base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/002.yaml
  text: I will stir up Egyptians against Egyptians[a], and each will fight against his brother, and each against his neighbor, city against city[b], kingdom against kingdom.
translation:
  language: ru
  text: Я подниму египтян против египтян[a], и каждый будет сражаться против своего брата, каждый — против своего ближнего[b], город — против города, царство — против царства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Египет против Египта». По смыслу речь идёт о внутренней распре среди египтян.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «со своим товарищем»; еврейское слово может также означать друга или соседа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסִכְסַכְתִּי
  choice: Я подниму … против
  rationale: Глагол выражает побуждение сторон к взаимной вражде. Оборот «подниму … против» естественен в современном русском, сохраняет каузативный смысл и не звучит столь разговорно, как «натравлю».
- source_word: מִצְרַיִם בְּמִצְרַיִם
  choice: египтян против египтян
  rationale: В еврейском тексте буквально повторено название страны — «Египет против Египта», однако последующее множественное число и перечисление личных столкновений показывают внутреннюю распрю среди египтян. Русский перевод раскрывает коллективное значение названия страны.
- source_word: וְנִלְחֲמוּ אִישׁ
  choice: и каждый будет сражаться
  rationale: Глагол стоит во множественном числе, а אִישׁ далее имеет распределительное значение. «Каждый будет сражаться» естественно передаёт сочетание общей и индивидуальной вражды.
- source_word: בְּאָחִיו
  choice: со своим братом
  rationale: Сохранён прямой смысл «брат» и образ распада даже ближайших семейных связей. После глагола «сражаться» русский творительный с «с» ясно обозначает противостояние.
- source_word: בְּרֵעֵהוּ
  choice: со своим ближним
  rationale: רֵעַ может означать ближнего, товарища, друга или соседа. «Ближний» сохраняет более широкое отношение между людьми и хорошо передаёт переход от семьи к обществу.
- source_word: עִיר בְּעִיר
  choice: город — против города
  rationale: Краткая конструкция воспроизводит параллелизм и нарастание масштаба конфликта.
- source_word: מַמְלָכָה בְּמַמְלָכָה
  choice: царство — против царства
  rationale: «Царство» — прямой и прозрачный эквивалент מַמְלָכָה; он сохраняет политическую ступень в нарастающем перечислении.
theological_decisions:
- issue: Коллективное значение названия מִצְרַיִם в описании междоусобицы
  choice: египтян против египтян
  alternative: Египет против Египта
  rationale: Контекст поясняет повторённое название страны столкновениями между отдельными людьми, городами и царствами. Эксплицируется внутренняя распря, но буквальная форма отмечена в сноске, чтобы не скрывать образность оригинала.
- issue: Распределительное значение אִישׁ
  choice: каждый … каждый
  alternative: человек … и человек
  rationale: Здесь אִישׁ распределяет действие между участниками, а не подчёркивает их пол. «Каждый» точно и естественно выражает этот смысл по-русски.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Параллелизм и нарастание — от брата и ближнего к городу и царству — сохранены; архаизмы и конфессионально окрашенные формулировки не использованы.
