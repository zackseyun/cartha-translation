source:
  edition: WLC
  text: וְ/הֶאֶזְנִ֣יחוּ נְהָר֔וֹת דָּלֲל֥וּ וְ/חָרְב֖וּ יְאֹרֵ֣י מָצ֑וֹר קָנֶ֥ה וָ/ס֖וּף קָמֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/006.yaml
  text: The rivers will stink[a]; the canals of Egypt will dwindle and dry up[c][b]; reed and rush will wither.
translation:
  language: ru
  text: Реки станут зловонными[a], каналы Египта обмелеют и пересохнут[b]; тростник и камыш[c] увянут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «реки начнут смердеть». Еврейский глагол редок; речь идёт о том, что вода испортится и станет издавать дурной запах.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каналы Мацора». Здесь «Мацор», вероятно, поэтическое название Египта.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «папирус». Еврейское слово обозначает болотную растительность, характерную для речных берегов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶאֶזְנִיחוּ
  choice: станут зловонными
  rationale: Редкий глагол в данной связи указывает на то, что воды испортятся и начнут издавать дурной запах. Формулировка сохраняет состояние водоёмов, не сводя значение только к действию «завоняют».
- source_word: נְהָרוֹת
  choice: реки
  rationale: Обычный и ясный эквивалент множественного существительного со значением рек или водных потоков.
- source_word: דָּלֲלוּ
  choice: обмелеют
  rationale: Глагол означает стать скудным, слабым или низким; применительно к каналам естественно передаёт уменьшение уровня и объёма воды.
- source_word: וְחָרְבוּ
  choice: пересохнут
  rationale: С водными потоками глагол обозначает высыхание; «пересохнут» естественно звучит по-русски и выражает завершённость бедствия.
- source_word: יְאֹרֵי
  choice: каналы
  rationale: В египетском контексте слово относится к рукавам и каналам нильской водной системы; «каналы» отличает их от ранее названных рек.
- source_word: מָצוֹר
  choice: Египта
  rationale: Здесь Мацор лучше понимать как поэтическое наименование Египта, а не как нарицательное «осада».
- source_word: קָנֶה
  choice: тростник
  rationale: Название характерного для берегов высокого тростникового растения; это наиболее понятный русский эквивалент.
- source_word: וָסוּף
  choice: камыш
  rationale: Слово обозначает болотную или прибрежную растительность. «Камыш» сохраняет различие с קָנֶה, тогда как «папирус» возможен, но более конкретен и толкователен.
- source_word: קָמֵלוּ
  choice: увянут
  rationale: Глагол обозначает увядание растительности; выбор избегает повтора «пересохнут» и сохраняет образ гибнущих растений.
