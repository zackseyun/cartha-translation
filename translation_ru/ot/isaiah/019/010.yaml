lexical_decisions:
- source_word: שָׁתֹתֶיהָ
  choice: основания её
  rationale: Редкое и спорное слово, вероятно связанное с идеей установления или опоры. «Основания» естественно передаёт образ разрушения общественно-хозяйственного устройства Египта, а существенные варианты сохранены в примечании.
- source_word: מְדֻכָּאִים
  choice: будут сокрушены
  rationale: Страдательное причастие от דכא выражает состояние раздавленности или сломленности; в пророческом контексте будущее время по-русски передаёт предстоящее бедствие.
- source_word: כָּל
  choice: все
  rationale: Сохранено прямое распределительное значение слова.
- source_word: עֹשֵׂי שֶׂכֶר
  choice: кто трудится за плату
  rationale: Буквально — «делающие [за] плату»; выбран естественный русский оборот для обозначения наёмных работников без ненужного уточнения рода занятий.
- source_word: אַגְמֵי נָפֶשׁ
  choice: удручены душой
  rationale: Еврейское выражение неясно. По контексту оно, вероятнее всего, обозначает внутреннюю подавленность; перевод передаёт этот смысл, а буквальная необычность отражена в примечании.
theological_decisions:
- issue: Неясность описания хозяйственного краха Египта
  choice: Не уточнять, какую именно группу или отрасль обозначают «основания»
  alternative: Перевести как «ткачи» или «опоры» и тем самым конкретизировать образ
  rationale: Текстологическая и лексическая неопределённость не позволяет уверенно отождествить названных людей или предметы; основной текст сохраняет широкий образ, а варианты вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксический параллелизм и точка с запятой сохраняют двухчастную структуру стиха; редкие обороты не вводятся в основной текст без необходимости.
