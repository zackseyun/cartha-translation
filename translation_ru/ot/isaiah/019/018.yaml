base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/018.yaml
  text: In that day there will be five cities in the land of Egypt speaking the language of Canaan and swearing allegiance to the LORD of Armies. One of them will be called the City of Destruction.
translation:
  language: ru
  text: В тот день пять городов в земле Египта будут говорить на языке Ханаана и приносить присягу ГОСПОДУ Воинств. Один из них будет называться Городом разрушения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В одном из свитков Мёртвого моря и в некоторых древних переводах: «Городом солнца». Еврейские написания «разрушение» и «солнце» здесь различаются одной согласной.'
    reason: Существенный древний текстовый вариант меняет название города и должен быть доступен читателю без замены чтения WLC в основном тексте.
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Устойчиво и точно передаёт пророческую формулу, сохраняя её эсхатологическую открытость.
- source_word: שְׂפַת כְּנַעַן
  choice: на языке Ханаана
  rationale: Буквально «губой Ханаана», то есть на языке Ханаана; современная русская формулировка передаёт смысл без неестественного семитизма.
- source_word: וְנִשְׁבָּעוֹת לַיהוָה צְבָאוֹת
  choice: и клясться в верности ГОСПОДУ Воинств
  rationale: Глагол с предлогом ל допускает оттенок присяги или обязательства перед ГОСПОДОМ; «клясться в верности» естественно выражает этот смысл и не смешивает его с формулой «клясться именем ГОСПОДА».
- source_word: עִיר הַהֶרֶס
  choice: Городом разрушения
  rationale: 'Следует масоретскому тексту WLC: הֶרֶס означает «разрушение». Заглавная буква показывает, что это название города.'
theological_decisions:
- issue: Характер клятвы ГОСПОДУ
  choice: клясться в верности ГОСПОДУ
  alternative: клясться ГОСПОДОМ
  rationale: Контекст обращения египетских городов к Богу поддерживает значение присяги на верность, однако формулировка не уточняет содержание этой верности сверх того, что выражает еврейский текст.
- issue: Имя одного из городов
  choice: Город разрушения
  alternative: Город солнца
  rationale: Основной текст переводит непосредственно представленное в WLC чтение הַהֶרֶס. Древнее вариантное чтение отмечено в сноске, а не подменяет исходный текст.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. «Земля Египетская» сохраняет библейскую приподнятость, а синтаксис остаётся естественным. Имя ГОСПОДЬ передано капителью как обозначение тетраграмматона; «Воинств» сохраняет традиционный и семантически прозрачный титул.
