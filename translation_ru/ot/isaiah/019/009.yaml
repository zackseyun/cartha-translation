  text: וּ/בֹ֛שׁוּ עֹבְדֵ֥י פִשְׁתִּ֖ים שְׂרִיק֑וֹת וְ/אֹרְגִ֖ים חוֹרָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/009.yaml
  text: Those who work with combed flax will be ashamed[b][a], and those who weave white cloth.
translation:
  language: ru
  text: Постыдятся те, кто обрабатывает чёсаный лён[a], и те, кто ткёт белое полотно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тонкий лён». Еврейское слово, вероятно, обозначает особо обработанный лён высокого качества.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «белую льняную ткань»; возможно также: «выбеленную ткань». Значение еврейского слова не вполне ясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֹשׁוּ
  choice: постыдятся
  rationale: Глагол בוש обычно выражает стыд и унижение вследствие краха или неудачи; в контексте хозяйственного бедствия прямое значение уместнее ослабленного «разочаруются».
- source_word: עֹבְדֵי
  choice: те, кто обрабатывает
  rationale: Причастная форма обозначает людей, занятых работой с названным далее материалом. «Обрабатывает» естественно передаёт ремесленный контекст.
- source_word: פִשְׁתִּים
  choice: лён
  rationale: Слово обозначает лён как растение или сырьё для изготовления ткани; перевод не подменяет сырьё готовым льняным полотном.
- source_word: שְׂרִיקוֹת
  choice: чёсаный
  rationale: Редкое и трудное слово, вероятно, характеризует специально подготовленный, вычесанный высококачественный лён. Основной перевод сохраняет производственный смысл, не сводя его лишь к оценке качества.
- source_word: וְאֹרְגִים
  choice: и те, кто ткёт
  rationale: Причастие от ארג обозначает ткачей или занимающихся ткачеством; развёрнутая конструкция сохраняет параллелизм с первой группой работников.
- source_word: חוֹרָי
  choice: белое полотно
  rationale: Трудное слово традиционно связывают с белизной или выбеленной тканью. «Белое полотно» понятно современному читателю и не уточняет без необходимости, что речь непременно о льне.
