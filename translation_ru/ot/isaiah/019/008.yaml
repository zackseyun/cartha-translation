lexical_decisions:
- source_word: וְאָנוּ
  choice: И зарыдают
  rationale: Глагол передаёт скорбный стон или плач; «зарыдают» естественно выражает открытое сетование и сохраняет отличие от следующего глагола.
- source_word: הַדַּיָּגִים
  choice: рыбаки
  rationale: Обычное современное обозначение людей, занимающихся рыбной ловлей.
- source_word: וְאָבְלוּ
  choice: и будут скорбеть
  rationale: Глагол אבל обозначает скорбь и траур; перевод сохраняет параллелизм, не отождествляя его полностью с предыдущим глаголом.
- source_word: כָּל מַשְׁלִיכֵי
  choice: все, кто забрасывает
  rationale: Причастная конструкция обозначает людей по их постоянному занятию; такая формулировка естественна по-русски.
- source_word: בַיְאוֹר
  choice: в Нил[a]
  rationale: В египетском контексте יְאֹר обычно обозначает Нил либо связанные с ним водные протоки; в основном тексте выбран ясный конкретный референт, а более широкая возможность отмечена в сноске.
- source_word: חַכָּה
  choice: крючок
  rationale: Существительное обозначает рыболовный крючок; контекст рыбной ловли делает дополнительное уточнение ненужным.
- source_word: וּפֹרְשֵׂי
  choice: те, кто раскидывает
  rationale: Причастие описывает развёртывание или раскидывание рыболовной сети; «раскидывает» идиоматично в данном контексте.
- source_word: מִכְמֹרֶת
  choice: сети
  rationale: Слово обозначает рыболовную сеть; русское множественное число естественно при описании занятия группы людей, не меняя смысла орудия лова.
- source_word: עַל פְּנֵי מַיִם
  choice: по воде
  rationale: Буквально «по поверхности вод»; краткое русское выражение сохраняет пространственный образ без тяжеловесности.
- source_word: אֻמְלָלוּ
  choice: изнемогут
  rationale: Глагол выражает ослабление, увядание или упадок; «изнемогут» сохраняет образ физического и жизненного истощения, не уточняя, является ли оно прежде всего душевным или экономическим.
