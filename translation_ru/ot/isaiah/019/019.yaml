base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/019.yaml
  text: In that day there will be an altar to Yahweh in the midst of the land of Egypt[a], and a pillar to Yahweh beside its border.
translation:
  language: ru
  text: В тот день посреди Египетской земли будет жертвенник Яхве, и у её границы — каменный столб[a] Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каменная стела». Еврейское слово מַצֵּבָה обозначает поставленный вертикально камень или столб.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Устойчивая и естественная по-русски передача пророческой временной формулы, сохраняющая её возвышенный регистр.
- source_word: יִהְיֶה
  choice: будет
  rationale: Глагол употреблён экзистенциально; русская конструкция с «будет» естественно вводит названные далее предметы.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Обычное значение слова — место принесения жертв; «жертвенник» точно и традиционно передаёт его в современном литературном русском.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Беспредложное сочетание «жертвенник Яхве» естественно выражает посвящение и принадлежность, передаваемые еврейским לְ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем, а не заменён титулом «Господь».
- source_word: בְּתוֹךְ
  choice: посреди
  rationale: Передаёт расположение внутри страны, в противопоставлении второму предмету у её границы, и сохраняет пророческую выразительность.
- source_word: אֶרֶץ מִצְרָיִם
  choice: Египетской земли
  rationale: Сохраняет явное слово «земля» в еврейском сочетании и звучит естественно в данном возвышенном контексте.
- source_word: וּמַצֵּבָה
  choice: и … каменный столб
  rationale: מַצֵּבָה обозначает установленный вертикально камень или столб. «Каменный столб» ясно выражает конкретный образ, не сводя его к более общему «памятнику».
- source_word: אֵצֶל
  choice: у
  rationale: Кратко и естественно обозначает близость к границе; еврейское слово не требует нахождения точно на самой пограничной линии.
- source_word: גְּבוּלָהּ
  choice: её границы
  rationale: Местоимение отнесено к Египетской земле; «граница» — обычное русское обозначение рубежа страны.
- source_word: לַיהוָה
  choice: Яхве
  rationale: 'Повтор имени сохранён: как жертвенник, так и каменный столб посвящены Яхве.'
theological_decisions:
- issue: Передача יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Его передача как «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Значение מַצֵּבָה в положительном пророческом контексте
  choice: каменный столб
  alternative: стела; памятник; поставленный камень
  rationale: Перевод сохраняет предметный смысл слова и напряжение, возникающее из положительного упоминания такого столба, не смягчая его до общего «памятника» и не приписывая ему дополнительной культовой оценки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Параллелизм двух частей и повтор имени Яхве сохранены; тире во второй части естественно восполняет пропущенное в еврейском тексте сказуемое.
