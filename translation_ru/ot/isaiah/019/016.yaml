  text: בַּ/יּ֣וֹם הַ/ה֔וּא יִֽהְיֶ֥ה מִצְרַ֖יִם כַּ/נָּשִׁ֑ים וְ/חָרַ֣ד וּ/פָחַ֗ד מִ/פְּנֵי֙ תְּנוּפַת֙ יַד יְהוָ֣ה צְבָא֔וֹת אֲשֶׁר ה֖וּא מֵנִ֥יף עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/016.yaml
  text: In that day Egypt will be like women[a], trembling and afraid because of the waving of the hand of Yahweh of Armies[c][b], which he waves against it.
translation:
  language: ru
  text: 'В тот день Египет будет подобен женщинам[a]: он задрожит и устрашится из-за взмаха руки Яхве Воинств[b], которой Он размахивает против него[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сравнение «подобен женщинам» отражает древнюю военную образность, в которой женщины изображались как беззащитные и объятые страхом; в еврейском тексте прямо сказано «женщинам».
    reason: cultural_note
  - marker: b
    text: 'Или: «Яхве Сил».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «которой Он размахивает над ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Сохранена обычная пророческая временная формула; выражение естественно для современного литературного русского языка.
- source_word: מִצְרַיִם
  choice: Египет
  rationale: Название страны в контексте выступает как собирательное лицо; далее оно обозначено местоимением мужского рода «он» по нормам русского языка.
- source_word: כַּנָּשִׁים
  choice: подобен женщинам
  rationale: Перевод прямо сохраняет употреблённое в еврейском тексте гендерно определённое сравнение, не смягчая и не расширяя его.
- source_word: וְחָרַד וּפָחַד
  choice: он задрожит и устрашится
  rationale: Два однородных глагола передают как телесную дрожь, так и страх, сохраняя усиление исходного текста.
- source_word: מִפְּנֵי
  choice: из-за
  rationale: В данном контексте предлог указывает на причину дрожи и страха.
- source_word: תְּנוּפַת יַד
  choice: взмаха руки
  rationale: Сохранён конкретный образ движения руки и связь с последующим причастием от того же еврейского корня.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — прозрачным обозначением воинств; это сохраняет военную силу титула в контексте суда.
- source_word: אֲשֶׁר הוּא מֵנִיף עָלָיו
  choice: которой Он замахивается на него
  rationale: Относительное местоимение относится к руке; выражение естественно передаёт угрожающее движение, направленное против Египта, при этом вариант пространственного «над ним» отмечен в сноске.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон; транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Сил
  rationale: «Воинств» яснее сохраняет собирательный и военный оттенок еврейского слова, особенно уместный в сцене грозящего суда.
- issue: Гендерное сравнение כַּנָּשִׁים
  choice: подобен женщинам
  alternative: станет слабым и испуганным
  rationale: Сравнение отражает древнюю военную образность, но прямо присутствует в тексте; перевод не должен молча заменять его толкованием.
- issue: Направленность жеста עָלָיו
  choice: на него
  alternative: над ним
  rationale: Контекст угрозы и суда поддерживает враждебную направленность жеста, однако пространственное значение предлога остаётся возможным и сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого звучания. Синтаксис сделан ясным без устранения повторяющегося образа движения руки; культурно трудное сравнение оставлено в основном тексте и пояснено в сноске.
