    text: 'Или: «луга», «пастбища» либо «голые места». Значение еврейского слова עָרוֹת в этом контексте неясно; вероятно, речь идёт о прибрежной растительности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все посевы Нила». Еврейское выражение может означать всё посеянное у Нила или благодаря его водам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹת
  choice: растения
  rationale: Редкое и неясное в данном контексте слово, вероятно, обозначает растительность у воды. Нейтральное «растения» передаёт экологический смысл, не сужая его до тростника или лугов; неопределённость отмечена в сноске.
- source_word: יְאֹר
  choice: Нил
  rationale: В пророчестве о Египте слово обозначает Нил или связанную с ним водную систему; собственное название ясно передаёт референт.
- source_word: עַל־פִּי יְאֹר
  choice: по берегам Нила
  rationale: Буквально «у края/устья реки»; пространственная идиома здесь естественно означает берег. Множественное число по-русски подходит для протяжённой прибрежной полосы.
- source_word: כֹל מִזְרַע יְאֹר
  choice: всё посеянное у Нила
  rationale: Фраза может обозначать посевы или всё, что засеяно благодаря Нилу. Эта передача сохраняет предметную широту и связь земледелия с рекой.
- source_word: יִיבַשׁ
  choice: засохнет
  rationale: Глагол означает стать сухим; применительно к растениям и посевам естественно русское «засохнет».
- source_word: נִדַּף
  choice: будет развеяно
  rationale: Форма передаёт пассивное действие — быть унесённым или развеянным, вероятно ветром. «Будет развеяно» сохраняет яркий образ полного уничтожения высохшей растительности.
- source_word: וְאֵינֶנּוּ
  choice: и исчезнет
  rationale: 'Идиома буквально выражает отсутствие: «его нет». «Исчезнет» естественно и кратко передаёт итоговое небытие.'
