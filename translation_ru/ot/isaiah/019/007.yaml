  text: The reeds along the Nile[a], along the bank of the Nile, and every sown field of the Nile will dry up, be driven away[c][b], and be no more.
translation:
  language: ru
  text: Прибрежная растительность Нила[a], у самого берега Нила, и всё посеянное у Нила[b] — всё это засохнет, будет развеяно и исчезнет.
  philosophy: optimal-equivalence
  footnotes:
