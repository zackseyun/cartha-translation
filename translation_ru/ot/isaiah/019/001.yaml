source:
  edition: WLC
  text: מַשָּׂ֖א מִצְרָ֑יִם הִנֵּ֨ה יְהוָ֜ה רֹכֵ֨ב עַל עָ֥ב קַל֙ וּ/בָ֣א מִצְרַ֔יִם וְ/נָע֞וּ אֱלִילֵ֤י מִצְרַ֨יִם֙ מִ/פָּנָ֔י/ו וּ/לְבַ֥ב מִצְרַ֖יִם יִמַּ֥ס בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/001.yaml
  text: 'An oracle concerning Egypt: Behold[a], Yahweh is riding on a swift cloud and is coming to Egypt; the idols of Egypt will tremble before him[c][b], and the heart of Egypt will melt within it.'
translation:
  language: ru
  text: 'Пророчество о Египте:[a]


    Вот, Яхве едет верхом на быстром облаке и направляется в Египет. Идолы Египта содрогнутся перед ним,[b] и сердце Египта растает в нём.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бремя о Египте»; или: «Изречение о Египте».'
    reason: Слово מַשָּׂא может обозначать пророческое изречение, а также нести оттенок тяжести или бремени.
  - marker: b
    text: 'Буквально: «от его лица», то есть от присутствия Яхве.'
    reason: Поясняет идиоматическое выражение מִפָּנָיו и его причинный оттенок.
  - marker: c
    text: 'Или: «внутри страны». В еврейском тексте Египет представлен как единое лицо мужского рода.'
    reason: Поясняет, что суффикс мужского рода относится к Египту, представленному как единое целое, и сохраняет возможное пространственное понимание.
lexical_decisions:
- source_word: מַשָּׂא
  choice: пророчество
  rationale: В заголовках пророческих речей слово обозначает весомое пророческое изречение, часто обращённое против народа. «Пророчество» естественно для современного русского языка; возможные оттенки отмечены в сноске.
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: Египет
  rationale: Общепринятое русское название страны.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательную силу слова и создаёт эффект непосредственного пророческого видения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: רֹכֵב עַל עָב קַל
  choice: мчится на быстром облаке
  rationale: Причастие изображает действие как происходящее перед глазами; קַל в контексте подчёркивает быстроту. «Мчится» естественно передаёт движение всадника и скорость, сохраняя теофанический образ.
- source_word: וּבָא
  choice: и приближается
  rationale: Форма продолжает картину близкого, уже разворачивающегося действия. «Приближается к Египту» по-русски естественнее буквального «приходит в Египет» при таком зрительном описании.
- source_word: וְנָעוּ
  choice: содрогнутся
  rationale: Глагол выражает колебание, дрожь или потрясение. «Содрогнутся» сохраняет как физическую неустойчивость, так и оттенок ужаса.
- source_word: אֱלִילֵי
  choice: идолы
  rationale: Точно обозначает изображения ложных богов; возможный уничижительный оттенок не развёрнут сверх явно необходимого.
- source_word: מִפָּנָיו
  choice: перед Ним
  rationale: Естественно передаёт буквальное «от Его лица / присутствия» и указывает, что содрогание вызвано явлением Яхве.
- source_word: וּלְבַב מִצְרַיִם
  choice: и сердце Египта
  rationale: Сохраняет метафору внутреннего существа, мужества и решимости страны, представленной как единое лицо.
- source_word: יִמַּס
  choice: растает
  rationale: Сохраняет конкретный древнееврейский образ утраты мужества и внутреннего распада от страха.
- source_word: בְּקִרְבּוֹ
  choice: внутри него
  rationale: Местоименный суффикс мужского рода относится к Египту как к единому персонифицированному целому. Такое согласование сохраняет олицетворение, хотя по-русски возможно и пространственное «внутри страны».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя. «Яхве» сохраняет различие между именем и титулом и не вносит конфессиональной замены.
- issue: Образ Яхве, едущего на облаке
  choice: 'Сохранён прямой теофанический образ: «мчится на быстром облаке»'
  alternative: 'Истолковывающая передача: «Яхве стремительно идёт»'
  rationale: Текст намеренно изображает Бога как небесного всадника. Перевод не демифологизирует и не сводит этот образ к абстрактному указанию на скорость.
- issue: Грамматическое олицетворение Египта
  choice: «сердце Египта растает внутри него»
  alternative: «сердце Египта растает внутри страны»
  rationale: Мужской единственный суффикс и метафора сердца представляют Египет как единое лицо. Основной текст сохраняет эту напряжённость, а сноска поясняет возможное пространственное понимание.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Синтаксис сохраняет энергичное развитие видения и образность исходного текста без архаизмов вроде «се» и без истолковывающего упрощения.
