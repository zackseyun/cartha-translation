revisions:
- from: 'Пророчество о Египте:[a]


    Вот, Яхве мчится на быстром облаке и приближается к Египту. Идолы Египта содрогнутся перед Ним,[b] и сердце Египта растает внутри него.[c]'
  to: 'Пророчество о Египте:[a]


    Вот, Яхве едет верхом на быстром облаке и направляется в Египет. Идолы Египта содрогнутся перед ним,[b] и сердце Египта растает в нём.[c]'
  rationale: Правка уточняет образ רֹכֵב («едет верхом»), не превращая его в отвлечённое описание скорости, и заменяет менее естественное «внутри него» на литературно ясное «в нём». Смысл, пророческий регистр и сохранённая в сноске грамматическая неоднозначность не меняются.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:32:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: מַשָּׂא уместно передано как «Пророчество», имя יהוה — «Яхве», а образы облака, идолов и тающего сердца сохранены. Однако «мчится» несколько смещает акцент с «едет/восседает верхом» (רֹכֵב) на самостоятельное стремительное движение; также «внутри него» в русском контексте звучит тяжеловесно и двусмысленно.'
  naturalness: Текст в целом литературен, но «сердце Египта растает внутри него» менее естественно, чем «растает в нём». «Едет верхом на быстром облаке» прямо и ясно сохраняет намеренно необычный теофанический образ.
  terminology: «Яхве», «идолы», «Египет» и «сердце Египта» выбраны последовательно и точно. Строчные местоимения при имени Бога соответствуют нейтральной современной русской орфографической норме и не вносят конфессионального оформления.
