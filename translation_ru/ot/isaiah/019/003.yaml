  text: וְ/נָבְקָ֤ה רֽוּחַ מִצְרַ֨יִם֙ בְּ/קִרְבּ֔/וֹ וַ/עֲצָת֖/וֹ אֲבַלֵּ֑עַ וְ/דָרְשׁ֤וּ אֶל הָֽ/אֱלִילִים֙ וְ/אֶל הָ֣/אִטִּ֔ים וְ/אֶל הָ/אֹב֖וֹת וְ/אֶל הַ/יִּדְּעֹנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/003.yaml
  text: And the spirit of Egypt will be emptied out within it[a], and I will swallow up its counsel; and they will seek the idols, the mutterers, the mediums, and the spiritists.
translation:
  language: ru
  text: И дух Египта иссякнет в нём, и Я поглощу его замысел. Тогда египтяне станут обращаться к идолам, к бормочущим[a], к медиумам и к ведунам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение редкого еврейского слова неясно; возможно также: «к заклинателям» или «к духам умерших».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָבְקָה
  choice: иссякнет
  rationale: Передаёт образ внутреннего опустошения и утраты сил естественным современным русским языком, не сводя смысл исключительно к унынию или страху.
- source_word: רוּחַ מִצְרַיִם בְּקִרְבּוֹ
  choice: дух Египта … в нём
  rationale: '«Дух» сохраняет широту еврейского образа: внутреннюю силу, настрой и мужество народа; местоимение относится к Египту как к стране и народу.'
- source_word: וַעֲצָתוֹ אֲבַלֵּעַ
  choice: Я поглощу его замысел
  rationale: Сохраняется конкретная метафора глагола «поглощать»; «замысел» здесь естественно обозначает совет, план или государственное решение.
- source_word: וְדָרְשׁוּ אֶל
  choice: станут обращаться к
  rationale: В контексте гадательной практики оборот означает обращение за помощью или советом; русское выражение ясно передаёт это без излишнего пояснения.
- source_word: הָאֱלִילִים
  choice: идолам
  rationale: Прямой и понятный эквивалент неодобрительного обозначения ложных божеств.
- source_word: הָאִטִּים
  choice: бормочущим заклинания
  rationale: Редкое и не вполне ясное слово, вероятно, связано с тихим бормотанием или заклинаниями; описательный перевод сохраняет эту вероятную особенность, а неопределённость отмечена в сноске.
- source_word: הָאֹבוֹת
  choice: вызывающим духов
  rationale: Слово может обозначать как вызываемых духов умерших, так и посредников, которые их вызывают. В ряду лиц, к которым обращаются, выбран естественный русский эквивалент для практикующих некромантию.
- source_word: הַיִּדְּעֹנִים
  choice: ведунам
  rationale: Обозначает людей, которым приписывалось тайное оккультное знание. «Ведуны» отличает их от вызывающих духов и не использует архаичное «волшебники».
theological_decisions:
- issue: Передача перечня оккультных объектов и практиков без устранения его лексической неоднозначности
  choice: 'Сохранить прямой перечень: «идолам, к бормочущим заклинания, к вызывающим духов и к ведунам»'
  alternative: Обобщить как «к идолам и прорицателям» либо однозначно назвать все слова духами умерших
  rationale: Прямой перечень сохраняет пророческое осуждение обращения Египта к запретным духовным средствам, но не навязывает спорному слову узкую демонологическую трактовку.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Иссякнет» и «поглощу» сохраняют образность оригинала; подлежащее «египтяне» раскрывает подразумеваемое множественное число и устраняет неясное русское «они».
