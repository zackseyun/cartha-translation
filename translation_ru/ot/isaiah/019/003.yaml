revisions:
- from: И дух Египта иссякнет в нём, и Я поглощу его замысел. Тогда египтяне станут обращаться к идолам, к бормочущим заклинания[a], к вызывающим духов и к ведунам.
  to: И дух Египта иссякнет в нём, и Я поглощу его замысел. Тогда египтяне станут обращаться к идолам, к бормочущим[a], к медиумам и к ведунам.
  rationale: Исправлена грамматическая ошибка и устранено необоснованное превращение спорного термина в «заклинания». «Бормочущим» передаёт вероятную этимологическую окраску הָאִטִּים, а сноска сохраняет существенную лексическую неопределённость. «Медиумам» — естественное современное обозначение אֹבוֹת в данном перечислении; «ведунам» сохраняет отдельность יִדְּעֹנִים.
