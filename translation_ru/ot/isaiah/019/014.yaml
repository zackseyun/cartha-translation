  text: יְהוָ֛ה מָסַ֥ךְ בְּ/קִרְבָּ֖/הּ ר֣וּחַ עִוְעִ֑ים וְ/הִתְע֤וּ אֶת מִצְרַ֨יִם֙ בְּ/כָֽל מַעֲשֵׂ֔/הוּ כְּ/הִתָּע֥וֹת שִׁכּ֖וֹר בְּ/קִיאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/014.yaml
  text: Yahweh has mixed within her a spirit of confusion[a], and they have led Egypt astray in all its work[b], as a drunkard staggers in his vomit.
translation:
  language: ru
  text: Яхве примешал в Египет дух смятения[a], и они сбили Египет с пути во всех его делах[b], как пьяный шатается в своей блевотине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух искажения», «дух извращения» или «дух головокружения». Еврейское выражение обозначает дезориентирующее, искривляющее влияние, посланное как суд.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте глагол стоит во множественном числе: «они сбили Египет с пути». Субъект прямо не назван; это могут быть силы смятения либо египетские вожди, оказавшиеся под их воздействием.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מָסַךְ
  choice: примешал
  rationale: Сохраняет конкретный образ смешивания или примешивания и одновременно естественно передаёт внесение пагубного влияния.
- source_word: בְּקִרְבָּהּ
  choice: внутри него
  rationale: Суффикс относится к Египту. В русском название «Египет» мужского рода, поэтому грамматический род естественно согласован с русским существительным.
- source_word: רוּחַ עִוְעִים
  choice: дух смятения
  rationale: «Смятение» передаёт вызванные судом растерянность и дезориентацию, не сводя выражение исключительно к нравственной испорченности или физическому головокружению.
- source_word: וְהִתְעוּ
  choice: и они сбили ... с пути
  rationale: Сохранено множественное число еврейского глагола и его каузативное значение; субъект намеренно не уточняется.
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: во всех его делах
  rationale: Охватывает все действия и предприятия Египта и сохраняет местоименный суффикс.
- source_word: כְּהִתָּעוֹת שִׁכּוֹר
  choice: как пьяный шатается
  rationale: Естественно по-русски передаёт беспорядочное движение и утрату ориентации в сравнении.
- source_word: בְּקִיאוֹ
  choice: в своей блевотине
  rationale: Сохраняет резкий и унизительный образ оригинала без смягчения.
theological_decisions:
- issue: Действие Яхве в суде через «дух смятения»
  choice: Яхве прямо представлен как Тот, кто примешал этот дух внутри Египта.
  alternative: Яхве лишь допустил возникновение смятения в Египте.
  rationale: Еврейский текст прямо называет Яхве субъектом активного глагола מָסַךְ; перевод сохраняет эту причинность, не развивая её в более позднюю систематическую формулировку.
- issue: Субъект глагола וְהִתְעוּ во множественном числе
  choice: Сохранено «они сбили», без явного определения субъекта.
  alternative: «Он сбил» или страдательное «Египет был сбит с пути».
  rationale: Масоретский текст содержит глагол во множественном числе. Неясность того, относятся ли «они» к силам смятения или к руководителям Египта под их воздействием, следует сохранить.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены резкий образ блевотины, активная роль Яхве и грамматически выраженная неоднозначность множественного субъекта.
