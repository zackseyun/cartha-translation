  text: וְ/סִכַּרְתִּי֙ אֶת מִצְרַ֔יִם בְּ/יַ֖ד אֲדֹנִ֣ים קָשֶׁ֑ה וּ/מֶ֤לֶךְ עַז֙ יִמְשָׁל בָּ֔/ם נְאֻ֥ם הָ/אָד֖וֹן יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/004.yaml
  text: I will give Egypt into the hand of a harsh master[a], and a fierce king will rule over them, declares the Lord[c][b], Yahweh of Armies.
translation:
  language: ru
  text: Я отдам Египет в руки сурового господина[a], и могущественный царь будет править ими, — возвещает Владыка[b], Яхве Воинств[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руку сурового господина». Слово «господин» в еврейском тексте имеет форму множественного числа, но прилагательное и дальнейшее упоминание одного царя, вероятно, указывают здесь на единственного властителя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Господь». Здесь употреблён божественный титул, отличный от слова «господин» в первой части стиха.'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционно: «Господь Бог Саваоф».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסִכַּרְתִּי
  choice: Я отдам
  rationale: В данном контексте глагол означает передачу Египта под чужую власть; «отдам» естественно передаёт этот смысл, не уточняя способ передачи.
- source_word: בְּיַד
  choice: в руки
  rationale: Сохранён ясный и привычный для русского языка древнееврейский образ передачи во власть другого.
- source_word: אֲדֹנִים קָשֶׁה
  choice: сурового господина
  rationale: Хотя существительное אֲדֹנִים формально имеет множественное число, согласование прилагательного в единственном числе и последующее упоминание одного царя указывают здесь на единственного властителя. «Суровый» передаёт קָשֶׁה без усиления до однозначно «жестокого».
- source_word: וּמֶלֶךְ עַז
  choice: и жестокий царь
  rationale: В контексте суда עַז обозначает не просто силу, а грозную, беспощадную властность; «жестокий» естественно сочетается с образом угнетающего царя.
- source_word: יִמְשָׁל בָּם
  choice: будет править ими
  rationale: Прямо передаёт политическое господство; местоимение во множественном числе сохраняет переход от страны Египет к её жителям.
- source_word: נְאֻם
  choice: возвещает
  rationale: Торжественная формула пророческого изречения; «возвещает» звучит современно и достойно, сохраняя авторитет высказывания.
- source_word: הָאָדוֹן
  choice: Владыка
  rationale: Божественный титул передан отдельно от личного имени Яхве и отличён от человеческого «господина» в первой части стиха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет традиционный высокий регистр и военный смысл обозначения небесных или совокупных сил, не сводя его однозначно к человеческим армиям.
theological_decisions:
- issue: Передача последовательности הָאָדוֹן יְהוָה צְבָאוֹת
  choice: Владыка, Яхве Воинств
  alternative: Господь Бог Саваоф; Владыка, Яхве Сил
  rationale: Различены титул הָאָדוֹן и личное имя יְהוָה; צְבָאוֹת передано буквально и достаточно прозрачно, без традиционной, но малопонятной транслитерации «Саваоф».
- issue: Число в אֲדֹנִים קָשֶׁה
  choice: 'единственное число: «сурового господина»'
  alternative: 'множественное число: «суровых господ»'
  rationale: Прилагательное קָשֶׁה стоит в единственном числе, а параллельная фраза говорит об одном царе; потому форма אֲדֹנִים здесь, вероятнее всего, обозначает одного властителя, хотя её морфологическая множественность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Образ «в руки» сохранён как понятная библейская метафора; человеческий властитель назван «господином», а божественный титул — «Владыкой», чтобы избежать неясного повтора. Личное имя Яхве передано явно.
