  text: И иссякнут воды моря[a], и река[b] иссохнет и высохнет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воды будут удалены из моря». Еврейский глагол может обозначать истощение или высыхание вод.'
    reason: lexical_alternative
  - marker: b
    text: Судя по контексту, под «рекой», вероятно, подразумевается Нил, однако в еврейском тексте употреблено нарицательное слово, а не собственное имя.
    reason: cultural_note
lexical_decisions:
- source_word: נִשְּׁתוּ
  choice: иссякнут
  rationale: В данном нифале глагол описывает истощение или высыхание вод. «Иссякнут» естественно передаёт результат, не воспроизводя неуместное здесь буквальное значение «будут выпиты».
- source_word: מַיִם מֵהַיָּם
  choice: воды моря
  rationale: Сохраняется образ «вод» и названного в еврейском тексте «моря»; сочетание с מִן выражает их отношение к морю и допускает также буквальное понимание «воды будут удалены из моря».
- source_word: נָהָר
  choice: река
  rationale: В египетском контексте, вероятнее всего, подразумевается Нил, однако в еврейском тексте стоит нарицательное существительное, поэтому собственное имя в основной текст не внесено.
- source_word: יֶחֱרַב וְיָבֵשׁ
  choice: обмелеет и высохнет
  rationale: Два близких глагола образуют усилительную пару. По-русски сочетание «обмелеет и высохнет» естественно передаёт постепенное истощение реки и окончательный результат, не прибегая к тяжеловесному повтору «пересохнет и высохнет».
