source:
  edition: WLC
  text: וְ/נוֹדַ֤ע יְהוָה֙ לְ/מִצְרַ֔יִם וְ/יָדְע֥וּ מִצְרַ֛יִם אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/עָֽבְדוּ֙ זֶ֣בַח וּ/מִנְחָ֔ה וְ/נָדְרוּ נֵ֥דֶר לַֽ/יהוָ֖ה וְ/שִׁלֵּֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/021.yaml
  text: And Yahweh will make himself known to Egypt[a], and Egypt will know Yahweh in that day, and they will serve with sacrifice and offering[c][b], and they will vow vows to Yahweh and fulfill them.
translation:
  language: ru
  text: И Яхве откроется Египту[a], и в тот день Египет узнает Яхве. Египтяне будут служить Ему, принося жертвы и приношения[b], будут давать обеты Яхве[c] и исполнять их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве станет известен Египту». Еврейскую форму можно понять более пассивно; перевод «откроется» передаёт возможный оттенок самооткровения.'
    reason: lexical_alternative
  - marker: b
    text: Словом «приношение» переведено еврейское מִנְחָה, которое в богослужебном контексте часто обозначает хлебное приношение.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «дадут обет». В еврейском тексте глагол и дополнение однокоренные, что усиливает выражение.'
    reason: source_form
lexical_decisions:
- source_word: וְנוֹדַע
  choice: откроется
  rationale: Нифаль глагола ידע допускает значения «станет известен» и «откроется». Русское «откроется Египту» естественно передаёт становление Яхве известным Египту и возможный оттенок Божественного самооткровения, не делая его чрезмерно явным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: לְמִצְרַיִם
  choice: Египту
  rationale: Предлог ל обозначает того, кому Яхве становится известен; название страны метонимически указывает на её народ.
- source_word: וְיָדְעוּ מִצְרַיִם אֶת־יְהוָה
  choice: Египет узнает Яхве
  rationale: Сохраняется повтор названия Египта и его собирательное значение. «Узнает» передаёт не только осведомлённость, но и действительное признание Яхве в контексте последующего поклонения.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчиво и естественно передаёт пророческую временную формулу.
- source_word: וְעָבְדוּ
  choice: будут служить Ему
  rationale: Основное значение עבד — «служить»; контекст жертв и обетов придаёт служению культовый смысл. Местоимение «Ему» естественно указывает на названного ранее Яхве.
- source_word: זֶבַח וּמִנְחָה
  choice: жертвы и приношения
  rationale: זבח обозначает жертву, обычно закалываемую, а מנחה — приношение, нередко хлебное. Обобщённая пара сохраняет различие без ненужного уточнения состава второго дара.
- source_word: וְנָדְרוּ נֵדֶר
  choice: будут давать обеты
  rationale: Естественная русская идиома передаёт еврейскую конструкцию с однокоренным дополнением, не воспроизводя неестественный оборот «обещать обеты».
- source_word: וְשִׁלֵּמוּ
  choice: и исполнять их
  rationale: В сочетании с обетами глагол שלם означает исполнить или уплатить обещанное; местоимение явно обозначает подразумеваемые обеты.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Значение עבד в жертвенном контексте
  choice: служить Ему
  alternative: поклоняться Ему
  rationale: «Служить» ближе к обычному значению глагола и сохраняет его смысловой диапазон, тогда как упоминание жертв, приношений и обетов ясно показывает, что речь идёт о богослужении.
- issue: Характер того, как Яхве становится известен Египту
  choice: откроется Египту
  alternative: станет известен Египту
  rationale: Выбранный вариант допускает Божественное самооткровение, соответствующее контексту, однако примечание сохраняет более пассивное прочтение нифаля.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Повтор имени «Яхве» и собирательное «Египет» сохранены; при переходе к глаголам во множественном числе употреблено «египтяне» ради ясности и естественной русской грамматики.
