  text: אַךְ אֱוִלִים֙ שָׂ֣רֵי צֹ֔עַן חַכְמֵי֙ יֹעֲצֵ֣י פַרְעֹ֔ה עֵצָ֖ה נִבְעָרָ֑ה אֵ֚יךְ תֹּאמְר֣וּ אֶל פַּרְעֹ֔ה בֶּן חֲכָמִ֥ים אֲנִ֖י בֶּן מַלְכֵי קֶֽדֶם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/011.yaml
  text: Surely the princes of Zoan are fools[a]; the wise counselors of Pharaoh give foolish counsel. How can you say to Pharaoh, “I am a son of wise men[b], a son of ancient kings”?
translation:
  language: ru
  text: 'Воистину, князья Цоана — глупцы; мудрые советники фараона дают неразумный совет. Как можете вы говорить фараону: «Я — потомок мудрецов[a], потомок древних царей»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын мудрецов». Выражения «сын мудрецов» и «сын древних царей» указывают на происхождение или родословную, а не обязательно на непосредственное сыновство.'
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Воистину
  rationale: Частица выражает здесь усиленное утверждение, а не ограничение; «воистину» сохраняет торжественный пророческий регистр.
- source_word: אֱוִלִים
  choice: глупцы
  rationale: Предикативное существительное передаёт резкую оценку князей, не смягчая её до «неразумны».
- source_word: שָׂרֵי צֹעַן
  choice: князья Цоана
  rationale: שׂרים обозначает высокопоставленных правителей или сановников; традиционное «князья» уместно при дворе фараона.
- source_word: חַכְמֵי יֹעֲצֵי פַרְעֹה
  choice: мудрые советники фараона
  rationale: Передано как характеристика советников, считавшихся мудрыми; контекст создаёт намеренную иронию.
- source_word: עֵצָה נִבְעָרָה
  choice: дают неразумный совет
  rationale: Сжатая еврейская конструкция буквально описывает совет как тупой или лишённый разумения; глагол «дают» естественно восполняется из контекста.
- source_word: אֵיךְ תֹּאמְרוּ אֶל פַּרְעֹה
  choice: Как можете вы говорить фараону
  rationale: Вопрос выражает недоверие и упрёк, а не простой запрос о способе речи.
- source_word: בֶּן חֲכָמִים אֲנִי
  choice: Я — потомок мудрецов
  rationale: בּן здесь естественно обозначает принадлежность к роду или происхождение; «потомок» ясно передаёт смысл по-русски без предположения о непосредственном сыновстве.
- source_word: בֶּן מַלְכֵי קֶדֶם
  choice: потомок древних царей
  rationale: קדם относится к давним временам; фраза выражает притязание на древнюю царскую родословную.
