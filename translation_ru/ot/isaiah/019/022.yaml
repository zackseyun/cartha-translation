  source_fidelity: 'Перевод точно передаёт структуру и смысл еврейского текста: Яхве поражает Египет, при этом поражение и исцеление намеренно сопоставлены; затем египтяне обращаются к Яхве, Он благосклонно отвечает на их мольбы и исцеляет их. Переход от «Египта» к «египтянам» обоснован формами множественного числа в продолжении стиха и не меняет смысла.'
