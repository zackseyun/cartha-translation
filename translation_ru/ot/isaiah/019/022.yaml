  terminology: «Яхве» последовательно передаёт тетраграмматон. «Поразит», «исцелит», «обратятся» и «откликнется на их мольбы» точны, понятны и не навязывают конфессионального истолкования. «Обратятся» сохраняет покаянно-религиозный оттенок שׁוב, не требуя предположения о прежней принадлежности египтян к завету.
