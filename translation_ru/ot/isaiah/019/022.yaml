source:
  edition: WLC
  text: וְ/נָגַ֧ף יְהוָ֛ה אֶת מִצְרַ֖יִם נָגֹ֣ף וְ/רָפ֑וֹא וְ/שָׁ֨בוּ֙ עַד יְהוָ֔ה וְ/נֶעְתַּ֥ר לָ/הֶ֖ם וּ/רְפָאָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/022.yaml
  text: And Yahweh will strike Egypt[a], striking and healing; and they will return to Yahweh[b], and he will respond to their pleas and heal them.
translation:
  language: ru
  text: И поразит Яхве Египет — поразит и исцелит; и египтяне обратятся к Яхве[a], и Он откликнется на их мольбы[b] и исцелит их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернутся к Яхве». Еврейский глагол может означать как обращение, так и возвращение и в пророческом контексте нередко подразумевает покаяние.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «и Он позволит им умолить Себя»; также возможно: «услышит их моление». Выражение указывает на благосклонный ответ Яхве на их просьбу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָגַף
  choice: поразит
  rationale: Глагол נָגַף обозначает нанесение удара или поражение, в том числе бедствием. «Поразит» передаёт силу суда без архаизма.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: מִצְרַיִם
  choice: Египет / египтяне
  rationale: В первом случае сохранено название страны; при последующем глаголе во множественном числе подразумеваются жители Египта, поэтому для ясности употреблено «египтяне».
- source_word: נָגֹף וְרָפוֹא
  choice: поразит и исцелит
  rationale: Повтор «поразит» передаёт усилительную конструкцию с абсолютным инфинитивом, а координация двух глаголов сохраняет резкое сопоставление суда и исцеления без навязывания временной последовательности.
- source_word: וְשָׁבוּ עַד יְהוָה
  choice: обратятся к Яхве
  rationale: שׁוב с עַד выражает поворот или возвращение к Яхве и в пророческой речи может нести оттенок покаяния. «Обратятся» естественно звучит по-русски и не предполагает однозначно, что прежде египтяне уже принадлежали Ему.
- source_word: וְנֶעְתַּר לָהֶם
  choice: Он откликнется на их мольбы
  rationale: Нифаль глагола עתר означает позволить умолить себя, то есть благосклонно ответить на обращённую мольбу. Эта формулировка передаёт не просто слышание, а благоприятный ответ.
- source_word: וּרְפָאָם
  choice: и исцелит их
  rationale: רפא обычно означает «исцелять». Повтор сохраняет связь с предыдущим «исцелит» и оставляет открытой широту образа — от избавления народа до духовного восстановления.
theological_decisions:
- issue: Соотношение Божьего суда и восстановления
  choice: Яхве и поражает Египет, и исцеляет его.
  alternative: Понимать исцеление лишь как политическое восстановление после бедствия.
  rationale: Еврейский текст прямо относит к Яхве оба действия и связывает исцеление с обращением египтян к Нему и Его благосклонным ответом. Перевод сохраняет это напряжение.
- issue: Оттенок покаяния в שׁוב
  choice: обратятся к Яхве
  alternative: вернутся к Яхве
  rationale: «Обратятся» сохраняет религиозный оттенок перемены направления, но не утверждает сверх текста, что египтяне прежде состояли в заветных отношениях с Яхве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический повтор «поразит — поразит и исцелит» сохраняет риторический строй еврейского текста. Местоимение «Он» написано с прописной буквы в соответствии с принятой русской благоговейной традицией; смысл от этого не меняется.
