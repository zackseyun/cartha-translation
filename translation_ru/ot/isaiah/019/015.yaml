  text: And there will be no work for Egypt that head or tail[a], palm branch or reed[b], can do.
translation:
  language: ru
  text: И у Египта не будет дела, которое могли бы выполнить голова или хвост[a], пальмовая ветвь или тростник[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Голова или хвост, пальмовая ветвь или тростник» — образное обозначение всех слоёв общества, от высших до низших; ср. Ис 9:14.
    reason: cross_reference
  - marker: b
    text: 'Или: «голова и хвост, пальмовая ветвь и тростник». В еврейском тексте члены пар соединены союзом «и», но общий смысл таков: никто в Египте — ни высокий, ни низкий — не сможет действовать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֶׂה
  choice: дела
  rationale: Существительное обозначает дело, действие или работу; «дела» естественно сочетается с относительным оборотом «которое мог бы сделать».
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: которое мог бы сделать
  rationale: Имперфект в контексте всеобщей неспособности уместно передать модальным оборотом, не превращая его в простое предсказание действия.
- source_word: רֹאשׁ וְזָנָב
  choice: голова или хвост
  rationale: 'Буквальные образы обозначают общественные крайности; разделительное «или» ясно выражает смысл: ни высшие, ни низшие не смогут действовать.'
- source_word: כִּפָּה
  choice: пальмовая ветвь
  rationale: Передаёт вероятный растительный образ и сохраняет контраст с низким болотным тростником.
- source_word: אַגְמוֹן
  choice: тростник
  rationale: Слово обозначает болотное растение, тростник или камыш; «тростник» — ясный литературный эквивалент, сохраняющий образный контраст.
- source_word: לְמִצְרַיִם
  choice: в Египте
  rationale: Предлог выражает отношение к Египту; по-русски экзистенциальная конструкция «не будет в Египте дела» естественно передаёт отсутствие доступного ему действия.
- source_word: וְלֹא יִהְיֶה
  choice: И не будет
  rationale: Прямая и естественная передача будущей экзистенциальной конструкции в современном литературном русском языке.
theological_decisions:
- issue: Охват образного перечисления
  choice: Сохранить буквальные парные образы и пояснить их общественный смысл в сноске.
  alternative: Заменить образы толкованием «ни высшие, ни низшие».
  rationale: Буквальная образность принадлежит тексту и перекликается с Ис 9:14; пояснение делает смысл доступным, не устраняя поэтической формы.
translation_notes:
  register: Современный литературный русский с сохранением пророческой образности и синтаксической ясности. Вставка «кто-либо» эксплицирует подразумеваемого деятеля перечисления и предотвращает грамматически неестественное восприятие неодушевлённых образов как буквальных исполнителей.
