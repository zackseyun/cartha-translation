id: ISA.19.12
reference: Isaiah 19:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַיָּ/ם֙ אֵפ֣וֹא חֲכָמֶ֔י/ךָ וְ/יַגִּ֥ידוּ נָ֖א לָ֑/ךְ וְ/יֵ֣דְע֔וּ מַה יָּעַ֛ץ יְהוָ֥ה צְבָא֖וֹת עַל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/012.yaml
  text: Where[a], then, are your wise men? Let them tell you, please; let them know what Yahweh of Armies has purposed against Egypt.
translation:
  language: ru
  text: Где же твои мудрецы? Пусть же они скажут тебе, пусть узнают, что замыслил Яхве Воинств[a] против Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционной передаче: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּם אֵפוֹא
  choice: Где же
  rationale: Местное вопросительное слово вместе с усилительно-выводной частицей образует насмешливый риторический вопрос; «где же» естественно передаёт его силу по-русски.
- source_word: חֲכָמֶיךָ
  choice: твои мудрецы
  rationale: Речь идёт о египетских советниках и носителях особой мудрости; «мудрецы» передаёт их общественную роль, не сужая значение до жрецов или магов.
- source_word: וְיַגִּידוּ נָא
  choice: Пусть же они скажут
  rationale: Юссив выражает риторический вызов, а נָא усиливает побуждение. Частица «же» здесь естественнее буквального вежливого «пожалуйста» и сохраняет насмешливый тон.
- source_word: וְיֵדְעוּ
  choice: пусть узнают
  rationale: Сохранена параллельная юссивная форма и прямое значение ידע; перевод не устраняет напряжение между тем, чтобы мудрецы сами узнали замысел и сообщили его адресату.
- source_word: מַה יָּעַץ
  choice: что замыслил
  rationale: יעץ здесь означает выработать намерение или план. Совершенный вид «замыслил» передаёт оформленность божественного решения.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — прозрачным современному читателю словом «Воинств», сохраняющим образ небесных и военных сил.
- source_word: עַל מִצְרָיִם
  choice: против Египта
  rationale: Предлог עַל при יעץ может означать «о» или «против»; контекст суда над Египтом поддерживает враждебно направленное «против».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно сохраняется как имя, а не заменяется титулом.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф
  rationale: Основной текст раскрывает значение צְבָאוֹת, тогда как традиционный вариант приводится в сноске; это сохраняет военный образ титула без конфессионального уточнения.
- issue: Направленность замысла, выраженная עַל
  choice: против Египта
  alternative: об Египте
  rationale: Хотя предлог допускает более нейтральное «об Египте», пророческий контекст суда указывает на замысел, направленный против него.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Краткие побудительные конструкции сохраняют риторический вызов и насмешку оригинала; архаизмы вне традиционного варианта в сноске не используются.
