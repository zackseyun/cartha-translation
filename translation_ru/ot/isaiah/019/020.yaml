  to: И будет это знамением и свидетельством для Яхве Воинств в земле Египта. Ибо они воззовут к Яхве из-за притеснителей, и Он пошлёт им спасителя и защитника[a] и избавит их.
  rationale: Исправлена передача כִּי с временного «когда» на причинно-пояснительное «ибо», что точнее передаёт синтаксическую связь еврейского текста. Архаизирующее «в земле Египетской» заменено на современное литературное «в земле Египта». Сноска оставлена при «защитника», поскольку вторая характеристика посланного лица текстуально спорна.
