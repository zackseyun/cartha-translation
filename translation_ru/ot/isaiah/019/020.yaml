id: ISA.19.20
reference: Isaiah 19:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֨ה לְ/א֥וֹת וּ/לְ/עֵ֛ד לַֽ/יהוָ֥ה צְבָא֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם כִּֽי יִצְעֲק֤וּ אֶל יְהוָה֙ מִ/פְּנֵ֣י לֹֽחֲצִ֔ים וְ/יִשְׁלַ֥ח לָ/הֶ֛ם מוֹשִׁ֥יעַ וָ/רָ֖ב וְ/הִצִּילָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/020.yaml
  text: It will be for a sign and for a witness to Yahweh of Armies in the land of Egypt. For they will cry out to Yahweh because of oppressors[a], and he will send them a savior and champion, and he will deliver them.
translation:
  language: ru
  text: И будет это знамением и свидетельством для Яхве Воинств в земле Египта. Ибо они воззовут к Яхве из-за притеснителей, и Он пошлёт им спасителя и защитника[a] и избавит их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно для толкования. Возможно также: «спасителя и великого» или «спасителя и поборника».'
    reason: Слово וָרָב допускает более буквальное понимание «великий», а также функциональное значение того, кто вступается или ведёт борьбу за других.
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет это
  rationale: Сохраняет соединительный וְ и предсказательное значение формы היה; местоимение «это» естественно отсылает к алтарю и столбу из предыдущего стиха.
- source_word: לְאוֹת וּלְעֵד
  choice: знамением и свидетельством
  rationale: 'Передаёт оба существительных и сохраняет их различие: אוֹת — видимый знак, עֵד — свидетельство с юридическим оттенком.'
- source_word: לַיהוָה צְבָאוֹת
  choice: для Яхве Воинств
  rationale: Предлог לְ передан как «для», без превращения свидетельства в свидетельство «о» Яхве; имя יהוה транслитерировано, а צְבָאוֹת переведено прозрачно как «Воинств».
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египетской
  rationale: Сохраняет полную географическую формулу оригинала и звучит естественно в возвышенной русской прозе.
- source_word: כִּי
  choice: Когда
  rationale: כִּי допускает временное прочтение; здесь оно естественно связывает вопль угнетённых с последующим Божьим ответом, не устраняя причинно-пояснительной связи контекста.
- source_word: יִצְעֲקוּ אֶל־יְהוָה
  choice: они воззовут к Яхве
  rationale: «Воззовут» передаёт настойчивый вопль о помощи и сохраняет достойный библейский регистр без архаической грамматики.
- source_word: מִפְּנֵי לֹחֲצִים
  choice: из-за притеснителей
  rationale: Идиома מִפְּנֵי выражает причину бедствия, а субстантивированное причастие לֹחֲצִים обозначает тех, кто притесняет.
- source_word: מוֹשִׁיעַ
  choice: спасителя
  rationale: Прямо передаёт деятеля от корня ישׁע и поддерживает связь с последующим Божьим избавлением.
- source_word: וָרָב
  choice: и защитника
  rationale: Трудная форма понята функционально как обозначение того, кто вступается и борется за угнетённых; более буквальная возможность отмечена в сноске.
- source_word: וְהִצִּילָם
  choice: и избавит их
  rationale: Глагол נצל в породе хифиль означает избавление или спасение из опасности; «избавит» избегает ненужного повтора слова «спаситель».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблён тетраграмматон; «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; Небесных Воинств
  rationale: «Воинств» прозрачно передаёт основной смысл еврейского множественного существительного и не ограничивает неоднозначный объём титула уточнением «небесных».
- issue: Кем является посланный спаситель
  choice: Не уточнять личность или мессианский статус
  alternative: Прямо обозначить его как Мессию
  rationale: Сам стих говорит лишь о посланном Богом спасителе и защитнике; перевод не должен добавлять отождествление, отсутствующее в формулировке оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «воззовут» и «земле Египетской» сохраняют достоинство стиля, но синтаксис остаётся ясным для современного читателя. Заглавное «Он» употреблено как традиционная русская графическая форма почтительного указания на Бога.
