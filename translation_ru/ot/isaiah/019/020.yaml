  terminology: «Яхве Воинств» последовательно передаёт יהוה צבאות. «Знамением и свидетельством», «воззовут», «спасителя» и «избавит» точны по смыслу и уместны по регистру. «Защитника» допустимо для спорного וָרָב, при наличии сноски.
