  text: נֽוֹאֲלוּ֙ שָׂ֣רֵי צֹ֔עַן נִשְּׁא֖וּ שָׂ֣רֵי נֹ֑ף הִתְע֥וּ אֶת מִצְרַ֖יִם פִּנַּ֥ת שְׁבָטֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/013.yaml
  text: The princes of Zoan have become foolish; the princes of Noph are deceived. They have led Egypt astray[a], they who are the cornerstone of her tribes.
translation:
  language: ru
  text: Князья Цоана поступили глупо, князья Нофа[a] обмануты; они ввели Египет в заблуждение — те, кто составляет краеугольный камень его племён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ноф — еврейское название Мемфиса.
    reason: alternative_reading
lexical_decisions:
- source_word: נֽוֹאֲלוּ
  choice: обезумели
  rationale: Нифаль глагола יאל передаёт наступившее состояние или проявившуюся глупость; «обезумели» естественно выражает результативный оттенок.
- source_word: שָׂרֵי
  choice: князья
  rationale: שַׂר обозначает правителя, сановника или князя; «князья» сохраняет возвышенную политическую лексику пророческой речи.
- source_word: צֹעַן
  choice: Цоан
  rationale: Передача еврейского географического названия транслитерацией.
- source_word: נִשְּׁאוּ
  choice: обмануты
  rationale: Нифаль от נשׁא здесь означает быть обманутыми или введёнными в заблуждение; это соответствует параллелизму с последующим הִתְעוּ.
- source_word: נֹף
  choice: Ноф
  rationale: Сохранена еврейская форма названия; общеизвестное отождествление с Мемфисом дано в сноске.
- source_word: הִתְעוּ
  choice: ввели ... в заблуждение
  rationale: 'Хифиль от תעה имеет каузативный смысл: заставить блуждать, сбить с пути; выбранная формулировка естественна по-русски и сохраняет причинительный оттенок.'
- source_word: מִצְרַיִם
  choice: Египет
  rationale: Общепринятая русская форма названия страны.
- source_word: פִּנַּת
  choice: краеугольный камень
  rationale: Буквально «угол» или «краеугольный камень»; метафора указывает на главную опору составляющих Египет групп.
- source_word: שְׁבָטֶיהָ
  choice: его племён
  rationale: שֵׁבֶט здесь обозначает племя или родовую группу; местоименный суффикс относится к Египту, который в русском языке мужского рода.
theological_decisions:
- issue: Синтаксическая связь выражения פִּנַּת שְׁבָטֶיהָ
  choice: 'Приложение к князьям Нофа: «они ... — краеугольный камень его племён»'
  alternative: 'Понимать выражение как дополнительное обозначение всех египетских руководителей либо передать менее определённо: «опора его племён»'
  rationale: Еврейский текст допускает некоторую синтаксическую сжатость. Сохранена образность «краеугольного камня» без догматического уточнения того, какие именно руководители имеются в виду.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Географические имена переданы в формах «Цоан» и «Ноф»; менее узнаваемый Ноф пояснён сноской. Точка с запятой и тире сохраняют энергичный параллелизм и сжатую образность оригинала.
