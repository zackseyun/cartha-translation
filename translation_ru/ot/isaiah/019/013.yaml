- from: Князья Цоана обезумели, князья Нофа обмануты; они ввели Египет в заблуждение — краеугольный камень его племён.[a]
  to: Князья Цоана поступили глупо, князья Нофа[a] обмануты; они ввели Египет в заблуждение — те, кто составляет краеугольный камень его племён.
  rationale: Смягчено чрезмерное «обезумели», устранена русская грамматическая неровность в приложении и перенесён маркер сноски к поясняемому топониму. Оборот «те, кто составляет краеугольный камень» сохраняет коллективную метафору оригинала и не навязывает решение вопроса о том, относятся ли заключительные слова к одной группе князей или к названным руководителям в совокупности.
