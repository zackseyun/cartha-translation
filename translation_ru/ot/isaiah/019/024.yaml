  text: In that day Israel will be the third with Egypt and Assyria[a], a blessing in the midst of the earth,
translation:
  language: ru
  text: В тот день Израиль будет третьим вместе с Египтом и Ассирией и благословением посреди земли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посреди страны». Еврейское слово אֶרֶץ может означать как «землю» в широком смысле, так и отдельную «страну».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественная для современного русского языка передача устойчивой пророческой формулы с сохранением её торжественного регистра.
- source_word: יִהְיֶה
  choice: станет
  rationale: В данном именном высказывании «станет» естественно выражает будущий статус Израиля; возможное «будет» звучало бы менее ясно рядом с творительным падежом.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятая русская форма имени собственного.
- source_word: שְׁלִישִׁיָּה
  choice: третьим
  rationale: Субстантивированное порядковое числительное обозначает Израиль как третьего участника объединения с Египтом и Ассирией, а не как одну треть чего-либо.
- source_word: לְמִצְרַיִם וּלְאַשּׁוּר
  choice: наряду с Египтом и Ассирией
  rationale: Предлог לְ здесь выражает соотнесённость и принадлежность к группе. «Наряду с» ясно передаёт равноправное положение трёх названных народов.
- source_word: בְּרָכָה
  choice: благословением
  rationale: Прямая передача предикативного существительного без добавления идеи «источника», которой нет в еврейском тексте.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: посреди земли
  rationale: Сохраняет пространственный оттенок בְּקֶרֶב и широкое значение הָאָרֶץ; в русском «земля» также допускает как всемирное, так и территориальное понимание.
theological_decisions:
- issue: Масштаб значения הָאָרֶץ
  choice: земля в широком, всемирном смысле
  alternative: страна, то есть конкретная земля или территория
  rationale: Международный контекст, объединяющий Египет, Ассирию и Израиль, поддерживает всемирный горизонт, однако еврейское слово допускает и более узкое территориальное значение, поэтому оно отмечено в сноске.
- issue: Отношение Израиля к Египту и Ассирии
  choice: Израиль — третий участник наряду с ними
  alternative: Израиль как «третья часть»
  rationale: Контекст перечисляет три народа, а конструкция с לְ естественно обозначает включение Израиля в их ряд; перевод не вводит иерархии между ними.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Тире делает ясным, что «благословением» характеризуется образованное тремя народами единство, при этом не добавляя нового смыслового отношения.
