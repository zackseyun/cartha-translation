  text: בַּ/יּ֣וֹם הַ/ה֗וּא תִּהְיֶ֨ה מְסִלָּ֤ה מִ/מִּצְרַ֨יִם֙ אַשּׁ֔וּרָ/ה וּ/בָֽא אַשּׁ֥וּר בְּ/מִצְרַ֖יִם וּ/מִצְרַ֣יִם בְּ/אַשּׁ֑וּר וְ/עָבְד֥וּ מִצְרַ֖יִם אֶת אַשּֽׁוּר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/023.yaml
  text: In that day there will be a highway from Egypt to Assyria[a], and Assyria will come into Egypt, and Egypt into Assyria[b]; and Egypt will serve with Assyria.
translation:
  language: ru
  text: В тот день будет дорога из Египта в Ассирию; Ассирия придёт в Египет, а Египет — в Ассирию[a], и Египет будет служить вместе с Ассирией[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте во второй части фразы пропущен глагол: буквально «а Египет — в Ассирию», то есть «а Египет придёт в Ассирию».'
    reason: lexical_alternative
  - marker: b
    text: Буквальнее еврейскую конструкцию можно понять как «и Египет будет служить Ассирии». Однако общий контекст говорит, по-видимому, о том, что Египет вместе с Ассирией будет служить Богу; глагол может также обозначать поклонение.
    reason: alternative_reading
lexical_decisions:
- source_word: מְסִלָּה
  choice: большая дорога
  rationale: Слово обозначает проложенную, нередко поднятую дорогу — широкий открытый путь. «Большая дорога» естественно передаёт этот образ по-русски, не привнося современного технического смысла автомагистрали.
- source_word: מִמִּצְרַיִם ... אַשּׁוּרָה
  choice: из Египта в Ассирию
  rationale: Предлоги и направительный суффикс обозначают движение от Египта к Ассирии; выбранная формулировка точна и идиоматична.
- source_word: וּבָא אַשּׁוּר בְּמִצְרַיִם
  choice: ассирийцы будут приходить в Египет
  rationale: בוא с ב обозначает приход или вход в пределы страны. Названия народов переданы через жителей стран, что естественнее в русском при взаимном передвижении и последующем служении.
- source_word: וּמִצְרַיִם בְּאַשּׁוּר
  choice: а египтяне — в Ассирию
  rationale: Глагол «будут приходить» эллиптически подразумевается из предыдущей части. Тире сохраняет краткий параллелизм, а сноска поясняет пропуск.
- source_word: וְעָבְדוּ
  choice: будут служить
  rationale: עבד охватывает как общее служение, так и служение религиозное. «Служить» сохраняет эту смысловую широту и не сужает значение до одного лишь поклонения.
- source_word: מִצְרַיִם אֶת אַשּׁוּר
  choice: египтяне будут служить вместе с ассирийцами
  rationale: Непосредственный синтаксис допускает понимание Ассирии как объекта служения, однако контекст 19:24–25 изображает Египет и Ассирию совместно благословлёнными. Основной текст передаёт контекстуально предпочтительное совместное служение, а более буквальное синтаксическое прочтение сохраняется в сноске.
theological_decisions:
- issue: Смысл выражения וְעָבְדוּ מִצְרַיִם אֶת אַשּׁוּר
  choice: египтяне будут служить вместе с ассирийцами
  alternative: египтяне будут служить Ассирии; возможно также религиозное понимание глагола — «поклоняться»
  rationale: Частица אֶת обычно отмечает прямое дополнение, поэтому буквальный синтаксис нельзя скрывать. Вместе с тем ближайший контекст говорит о примирении и совместном благословении Египта и Ассирии перед Господом, а не о подчинении одного другому. Контекстуальное прочтение помещено в основной текст, синтаксическая напряжённость явно отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общедоступным звучанием. Параллелизм исходного стиха сохранён; названия стран в глагольных фразах естественно раскрыты как названия их жителей. Подлинная синтаксическая неоднозначность заключительной части не устранена молча, а вынесена в сноску.
