  text: אֲשֶׁ֧ר בֵּרֲכ֛/וֹ יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר בָּר֨וּךְ עַמִּ֜/י מִצְרַ֗יִם וּ/מַעֲשֵׂ֤ה יָדַ/י֙ אַשּׁ֔וּר וְ/נַחֲלָתִ֖/י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/025.yaml
  text: whom Yahweh of Armies has blessed[a], saying, “Blessed be Egypt my people, and Assyria the work of my hands[b], and Israel my inheritance.”
translation:
  language: ru
  text: 'которых благословил Яхве Воинств[a], сказав: «Благословен народ Мой — Египет, и дело рук Моих — Ассирия[b], и наследие Моё — Израиль!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве Саваоф»; традиционно: «Господь Саваоф».'
    reason: lexical_alternative
  - marker: b
    text: Наименования «Мой народ» и «дело Моих рук», обычно связанные с Израилем, здесь относятся также к Египту и Ассирии.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: которых
  rationale: Относительное местоимение отсылает к трём участникам предыдущего стиха — Египту, Ассирии и Израилю; множественное число естественно выражает совокупный референт.
- source_word: בֵּרֲכוֹ
  choice: благословил
  rationale: Перфект выражает совершённое действие; суффикс формально единственного числа может относиться к совокупности трёх народов, тогда как по-русски это естественно передаётся местоимением «которых».
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняется личное имя Яхве и передаётся конкретный смысл צְבָאוֹת — множества небесных и земных воинств; традиционная альтернатива отмечена в сноске.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Естественно вводит прямую речь и сохраняет связь с глаголом благословения.
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Краткая форма прилагательного передаёт торжественную формулу благословения без добавления отсутствующей в еврейском тексте связки.
- source_word: עַמִּי מִצְרַיִם
  choice: народ Мой — Египет
  rationale: Сохраняется прямое приложение, в котором Египту присваивается значимое наименование «Мой народ».
- source_word: וּמַעֲשֵׂה יָדַי אַשּׁוּר
  choice: и дело рук Моих — Ассирия
  rationale: Близко воспроизводится порядок еврейских слов и подчёркивается параллельное приложение.
- source_word: וְנַחֲלָתִי יִשְׂרָאֵל
  choice: и наследие Моё — Израиль
  rationale: נַחֲלָה обозначает наследие или удел-владение; «наследие» сохраняет привычный библейский смысл и параллелизм трёх наименований.
theological_decisions:
- issue: Передача имени и титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Господь Воинств
  rationale: Текст прямо содержит тетраграмматон, поэтому личное имя сохранено. «Воинств» делает смысл титула понятнее, не ограничивая его одним конкретным видом войска.
- issue: Заветные наименования Египта и Ассирии
  choice: Сохранить прямые формулы «народ Мой — Египет» и «дело рук Моих — Ассирия»
  alternative: Добавить пояснение вроде «Египет, ставший Моим народом»
  rationale: Еврейский текст намеренно и неожиданно применяет эти обозначения к иноземным народам; толкование не следует вносить в основной текст.
- issue: Число референта в אֲשֶׁר בֵּרֲכוֹ
  choice: «которых благословил» как отсылка ко всей тройке
  alternative: «которого благословил» с грамматически единичным совокупным референтом
  rationale: Контекст предыдущего стиха и последующая трёхчастная формула указывают на Египет, Ассирию и Израиль вместе. Русское множественное число яснее, хотя еврейский суффикс формально стоит в единственном числе.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Инверсия и тире сохраняют трёхчастный параллелизм и подчёркивают неожиданные приложения, не превращая их в истолковывающий пересказ.
