source:
  edition: WLC
  text: ה֤וֹי כָּל צָמֵא֙ לְכ֣וּ לַ/מַּ֔יִם וַ/אֲשֶׁ֥ר אֵֽין ל֖/וֹ כָּ֑סֶף לְכ֤וּ שִׁבְרוּ֙ וֶֽ/אֱכֹ֔לוּ וּ/לְכ֣וּ שִׁבְר֗וּ בְּ/לוֹא כֶ֛סֶף וּ/בְ/ל֥וֹא מְחִ֖יר יַ֥יִן וְ/חָלָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/001.yaml
  text: Come[a], everyone who is thirsty, come to the waters; and he who has no money, come, buy and eat! Yes[b], come, buy wine and milk without money and without price.
translation:
  language: ru
  text: Все, кто жаждет, идите к водам! А у кого нет денег — идите, покупайте и ешьте! Идите, покупайте без денег и без платы вино и молоко.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: Эй
  rationale: Междометие передаёт настойчивый призыв и сохраняет отдельный элемент еврейского текста; в данном контексте оно не выражает горя.
- source_word: כָּל צָמֵא
  choice: все жаждущие
  rationale: Сочетание с единственным числом имеет собирательное значение; русское множественное число естественно выражает обращение ко всем испытывающим жажду.
- source_word: לְכוּ
  choice: идите
  rationale: Буквальное значение повелительной формы сохранено. По-русски приглашение «идите к водам» понятно и поддерживает повторяющийся настойчивый ритм исходного текста.
- source_word: לַמַּיִם
  choice: к водам
  rationale: Множественное число сохраняет образ обильных вод и поэтическую форму оригинала.
- source_word: וַאֲשֶׁר אֵין לוֹ כָּסֶף
  choice: и у кого нет серебра
  rationale: Русская конструкция естественно передаёт обобщающее значение еврейского мужского единственного числа, не ограничивая приглашение мужчинами.
- source_word: שִׁבְרוּ
  choice: покупайте
  rationale: В данном контексте глагол означает приобретение пищи; общее «покупайте» сохраняет намеренный парадокс покупки без денег.
- source_word: וֶאֱכֹלוּ
  choice: и ешьте
  rationale: Прямая последовательность повелительных форм и союз исходного текста сохранены.
- source_word: בְּלוֹא כֶסֶף
  choice: без серебра
  rationale: כֶּסֶף может обозначать серебро и деньги. «Серебро» сохраняет конкретную лексику и естественно означает средство платежа в поэтическом контексте.
- source_word: וּבְלוֹא מְחִיר
  choice: и без платы
  rationale: «Плата» естественно по-русски передаёт отсутствие требуемой цены и сохраняет параллелизм с «без серебра».
- source_word: יַיִן וְחָלָב
  choice: вино и молоко
  rationale: Конкретные образы изобилия сохранены без богословской расшифровки в самом переводе.
theological_decisions:
- issue: Обобщающее мужское единственное число
  choice: Передано естественной обобщающей конструкцией «у кого нет серебра».
  alternative: «тот, у кого нет серебра»
  rationale: Еврейская форма грамматически стоит в мужском единственном числе, но имеет родово-обобщающее значение. Русская конструкция сохраняет этот смысл, не добавляя ограничения по полу.
- issue: Экономические образы и духовное толкование
  choice: Сохранены буквальные образы покупки, серебра, платы, вина и молока.
  alternative: Разъясняющий пересказ о даровом спасении или духовных благах
  rationale: Богословская глубина выражена в оригинале посредством конкретного рыночного и пищевого образа; её не следует подменять толкованием внутри текста.
- issue: Парадокс покупки без оплаты
  choice: Сохранено «покупайте без серебра и без платы».
  alternative: «берите даром»
  rationale: Пересказ «берите даром» разъяснил бы смысл, но устранил бы намеренное напряжение между повелением покупать и отсутствием платежа.
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим ритмом. Повтор «идите, покупайте» сохраняет настойчивость приглашения; архаизмы и конфессионально окрашенные пояснения не используются.
