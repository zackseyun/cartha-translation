  yaml_path: translation/ot/isaiah/055/013.yaml
  text: Instead of the thornbush[a], the cypress will come up; instead of the brier, the myrtle will come up. And it will be for Yahweh a name[c][b], an everlasting sign that will not be cut off.
translation:
  language: ru
  text: Вместо терновника[a] вырастет кипарис[b], вместо крапивы[c] вырастет мирт. И это будет во славу Яхве[d], вечным знамением, которое не будет отсечено[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает колючее растение; точный вид неизвестен.
    reason: lexical_alternative
  - marker: b
    text: Точный вид дерева, обозначенного еврейским словом «берош», неизвестен; возможны также «пихта» или «можжевельник».
    reason: lexical_alternative
  - marker: c
    text: Точный вид растения неизвестен; возможны также «колючий кустарник» или «ежевика».
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «будет для Яхве именем» — еврейская идиома со значением славы, известности или памятования.'
    reason: lexical_alternative
  - marker: e
    text: 'Буквально: «которое не будет отсечено».'
    reason: literal_rendering
lexical_decisions:
- source_word: תַּחַת
  choice: вместо
  rationale: В данном поэтическом контексте предлог выражает замену вредной растительности благородными деревьями, а не пространственное положение.
- source_word: הַנַּעֲצוּץ
  choice: терновник
  rationale: Слово обозначает колючее растение неустановленного вида; «терновник» естественно передаёт образ нежелательной колючей поросли без ложной ботанической точности.
- source_word: בְרוֹשׁ
  choice: кипарис
  rationale: Точный вид дерева спорен; «кипарис» — понятное современному читателю обозначение величественного вечнозелёного дерева, при этом неопределённость отражена в сноске.
- source_word: הַסִּרְפַּד
  choice: крапива
  rationale: Речь идёт о сорном или колючем растении неустановленного вида. «Крапива» сохраняет контраст с миртом, а возможные варианты приведены в сноске.
- source_word: הֲדַס
  choice: мирт
  rationale: Это общепринятое и достаточно надёжное соответствие еврейскому названию растения.
- source_word: וְהָיָה
  choice: И это принесёт… и станет
  rationale: Глагол в единственном числе обобщает всё описанное преображение; местоимение «это» естественно отсылает ко всей картине восстановления.
- source_word: לַיהוָה לְשֵׁם
  choice: принесёт Яхве славу
  rationale: Буквальное «будет Яхве именем» является идиомой, обозначающей славу, известность или памятование. Выбранная формулировка естественна по-русски и сохраняет направленность славы к Яхве.
- source_word: לְאוֹת עוֹלָם
  choice: вечным знамением
  rationale: «Знамение» передаёт публичный и символический характер אוֹת, а «вечным» — длительную силу עוֹלָם.
- source_word: לֹא יִכָּרֵת
  choice: не будет уничтожено
  rationale: Буквальный образ — «не будет отсечено». В отношении знамения русское «не будет уничтожено» звучит естественнее и передаёт неотменимость и непреходящий характер результата; исходный образ отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон יהוה. Передача «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: К чему относится וְהָיָה («и будет»)
  choice: ко всему описанному преображению
  alternative: к кипарису или мирту как отдельному дереву
  rationale: Единственное число естественно обобщает всю предшествующую картину замены колючей поросли благородными деревьями. Формулировка «это» сохраняет широкую референцию, не привязывая знамение лишь к одному растению.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Параллелизм двух замен сохранён повтором «вместо… вырастет». Ботаническая неопределённость исходных слов не скрыта, но вынесена в сноски, чтобы основной текст оставался ясным и плавным.
