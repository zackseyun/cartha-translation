    issue: Неестественное сочетание «вас поведут в мире».
    rationale: Предлог «в» здесь звучит калькированно. «С миром поведут» естественнее в русском библейско-поэтическом регистре и передаёт обстоятельственное בְּשָׁלוֹם, не сводя шалом к одному значению.
  - severity: low
    issue: «Полевые деревья» семантически неоднозначно.
    rationale: Это может быть понято как деревья, связанные с полевым хозяйством. «Все деревья в поле» яснее передаёт עֲצֵי הַשָּׂדֶה.
  - severity: low
    issue: В основном тексте не выражен певческий компонент רִנָּה.
    rationale: «Ликование» близко по смыслу, но не обозначает голосовое радостное выражение. «Разразятся радостным пением» точнее передаёт поэтический образ; вариант с радостным криком остаётся в сноске.
