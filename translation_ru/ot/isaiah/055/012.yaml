source:
  edition: WLC
  text: כִּֽי בְ/שִׂמְחָ֣ה תֵצֵ֔אוּ וּ/בְ/שָׁל֖וֹם תּֽוּבָל֑וּ/ן הֶ/הָרִ֣ים וְ/הַ/גְּבָע֗וֹת יִפְצְח֤וּ לִ/פְנֵי/כֶם֙ רִנָּ֔ה וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה יִמְחֲאוּ כָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/012.yaml
  text: For you will go out with joy and be led in peace[a]; the mountains and the hills will break out in singing before you[b], and all the trees of the field will clap their hands.
translation:
  language: ru
  text: Ибо вы выйдете с радостью, и вас поведут с миром[a]; горы и холмы перед вами разразятся радостным пением[b], и все деревья в поле будут рукоплескать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вас будут сопровождать с миром».'
    reason: 'Лексическая альтернатива: תּוּבָלוּן — страдательная форма со значением «вас поведут, будут сопровождать».'
  - marker: b
    text: 'Или: «разразятся перед вами радостным криком».'
    reason: 'Лексическая альтернатива: יִפְצְחוּ ... רִנָּה обозначает внезапный радостный прорыв в пение или ликующий крик.'
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Сохраняет пояснительно-причинную связь с предшествующим обещанием и естественно звучит по-русски.
- source_word: בְשִׂמְחָה תֵצֵאוּ
  choice: вы выйдете с радостью
  rationale: Передаёт будущую форму второго лица множественного числа и сохраняет существительное «радость», важное для поэтического параллелизма.
- source_word: וּבְשָׁלוֹם תּוּבָלוּן
  choice: и вас поведут в мире
  rationale: Хофал глагола יבל означает, что адресатов поведут или будут сопровождать; добавление «выведут» не требуется исходным текстом. «В мире» сохраняет широкий смысл שָׁלוֹם — мир, благополучие и целостность.
- source_word: הֶהָרִים וְהַגְּבָעוֹת
  choice: горы и холмы
  rationale: Прямой и естественный перевод парного обозначения природного ландшафта.
- source_word: יִפְצְחוּ ... רִנָּה
  choice: разразятся ликованием
  rationale: Передаёт внезапный, неудержимый характер радостного возгласа или пения, не сужая רִנָּה исключительно до песни.
- source_word: לִפְנֵיכֶם
  choice: перед вами
  rationale: Сохраняет пространственное значение выражения и допускает оттенок «в вашем присутствии».
- source_word: וְכָל עֲצֵי הַשָּׂדֶה
  choice: и все полевые деревья
  rationale: Кратко и поэтично передаёт деревья открытой местности; буквальное «деревья поля» в современном русском звучит менее естественно.
- source_word: יִמְחֲאוּ כָף
  choice: будут рукоплескать
  rationale: Естественно передаёт идиому хлопания в ладоши и сохраняет олицетворение деревьев.
theological_decisions:
- issue: Поэтическое олицетворение творения в картине восстановления
  choice: Сохранить горы, холмы и деревья как участников всеобщего ликования
  alternative: Передать образ как простое описание красоты и оживления природы
  rationale: Еврейский текст намеренно изображает творение ликующим вместе с возвращающимся народом; олицетворение следует сохранить, не добавляя к нему конфессиональных толкований.
- issue: Значение שָׁלוֹם
  choice: «в мире»
  alternative: «в благополучии» или «невредимыми»
  rationale: «Мир» сохраняет ёмкость еврейского слова, включающего безопасность, целостность и благополучие, не устраняя его богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Синтаксис остаётся ясным для широкого читателя; олицетворение и параллелизм исходного текста сохранены. «Рукоплескать» слегка возвышенно, но уместно в библейской поэзии и лучше сохраняет образ, чем нейтральное «аплодировать».
