base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/004.yaml
  text: Behold[a], I have made him a witness to the peoples[c][b], a leader and commander for the peoples.
translation:
  language: ru
  text: Вот, Я сделал[a] его[b] свидетелем для народов[c], вождём и повелителем народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «дал его».'
    reason: lexical_alternative
  - marker: b
    text: Местоимение «его», вероятно, относится к Давиду или к представителю Давидовой династии; некоторые видят здесь указание на Мессию.
    reason: alternative_reading
  - marker: c
    text: 'Или: «для племён»; еврейское слово может обозначать народы или нации.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Частица привлекает внимание и придаёт высказыванию пророческую выразительность; «вот» естественно передаёт эту функцию в современном литературном русском языке.
- source_word: עֵד
  choice: свидетелем
  rationale: Существительное обозначает человека, который свидетельствует; творительный падеж естественен после «поставил».
- source_word: לְאוּמִּים
  choice: для народов
  rationale: Передаёт отношение свидетеля и руководителя ко множеству народов, сохраняя множественное число и повтор исходного текста.
- source_word: נְתַתִּיו
  choice: Я поставил его
  rationale: Буквально глагол означает «Я дал его», однако при последующих обозначениях роли русское «поставил его свидетелем…» звучит естественно и точно передаёт назначение; буквальный вариант отмечен в сноске.
- source_word: נָגִיד
  choice: вождём
  rationale: Слово обозначает поставленного над другими руководителя. «Вождь» сохраняет оттенок высокого общественного положения, не сужая значение до наследственного княжеского титула.
- source_word: וּמְצַוֵּה
  choice: и повелителем
  rationale: Причастная форма от צוה обозначает того, кто отдаёт повеления. «Повелитель» образует естественную параллель с «вождём» и не ограничивает смысл военной должностью.
theological_decisions:
- issue: К кому относится местоимение мужского рода «его»
  choice: Сохранить местоимение, не называя его референта в основном тексте.
  alternative: 'Уточнить: Давид, представитель Давидовой династии / Мессия либо олицетворённый Израиль.'
  rationale: Предыдущий стих упоминает милости, обещанные Давиду, поэтому местоимение, вероятно, указывает на Давида или его династического представителя; однако сам еврейский текст не уточняет референта. Перевод сохраняет эту неоднозначность и не навязывает конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и повтор слова «народов» сохранены. Заглавная буква в «Я» отражает речь Бога по русской библейской издательской традиции; местоимение «его» оставлено со строчной буквы, чтобы не предрешать его референта.
