  text: For my thoughts are not your thoughts[a], and your ways are not my ways, declares Yahweh.
translation:
  language: ru
  text: Ведь Мои мысли — не ваши мысли[a], и ваши пути — не Мои пути, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Потому что Мои замыслы — не ваши замыслы, и ваши пути — не Мои пути». Еврейское слово, переведённое как «мысли», может также означать «замыслы» или «намерения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для предшествующего призыва; «ведь» естественно передаёт пояснительно-причинную связь, не делая её излишне жёсткой.
- source_word: מַחְשְׁבוֹתַי / מַחְשְׁבוֹתֵיכֶם
  choice: Мои мысли / ваши мысли
  rationale: Существительное может означать мысли, замыслы или намерения. «Мысли» сохраняет повтор, широту значения и параллелизм с «путями»; возможность значения «замыслы» отмечена в сноске.
- source_word: דַרְכֵיכֶם / דְּרָכָי
  choice: ваши пути / Мои пути
  rationale: «Пути» сохраняет образность еврейского выражения и его переносные значения — образ действий, направление жизни и намерения — без сужения до одного из них.
- source_word: לֹא ... וְלֹא
  choice: не ... и ... не
  rationale: В русском именная связка в настоящем времени естественно опускается; повтор отрицания сохраняет уравновешенный поэтический параллелизм оригинала.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: «Возвещает» передаёт торжественную пророческую формулу и звучит естественно и достойно; «говорит» было бы нейтральнее и слабее по регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале непосредственно употреблён тетраграмматон. Форма «Яхве» передаёт личное имя и не заменяет его титулом; «Иегова» отражает более позднюю традиционную вокализацию.
- issue: Объём значения מַחֲשָׁבוֹת
  choice: мысли с указанием варианта «замыслы» в сноске
  alternative: замыслы в основном тексте
  rationale: Контекст допускает как внутренние мысли, так и планы или намерения Бога и людей. Более широкое «мысли» сохраняет богословское напряжение и не сводит высказывание только к планам.
translation_notes:
  register: Современный литературный русский с торжественным пророческим оттенком. Сохранены симметрия двух строк, повтор ключевых слов и метафора пути. Прописные местоимения при обращении Бога к Себе использованы как умеренная русская библейская конвенция.
