source:
  edition: WLC
  text: כֵּ֣ן יִֽהְיֶ֤ה דְבָרִ/י֙ אֲשֶׁ֣ר יֵצֵ֣א מִ/פִּ֔/י לֹֽא יָשׁ֥וּב אֵלַ֖/י רֵיקָ֑ם כִּ֤י אִם עָשָׂה֙ אֶת אֲשֶׁ֣ר חָפַ֔צְתִּי וְ/הִצְלִ֖יחַ אֲשֶׁ֥ר שְׁלַחְתִּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/011.yaml
  text: 'so will my word be that goes out from my mouth: it will not return to me empty[c][b][a], but it will accomplish what I desire and succeed in the purpose for which I sent it.'
translation:
  language: ru
  text: 'таким будет и Моё слово, исходящее из Моих уст: оно не вернётся ко Мне без результата[a], но исполнит то, чего Я желаю, и преуспеет в том, для чего Я послал его[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пустым»; то есть без результата.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и успешно выполнит то, для чего Я послал его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן יִהְיֶה
  choice: таким будет и
  rationale: 'Передаёт сравнительную связь с образом дождя и снега в предыдущем стихе; частица «и» естественно выражает соответствие: как происходит с ними, так будет и со словом Бога.'
- source_word: דְבָרִי
  choice: слово Моё
  rationale: Сохраняет широкий смысл דָּבָר и образ действенного Божьего изречения, не превращая его ни в отвлечённое «послание», ни в личный титул.
- source_word: אֲשֶׁר יֵצֵא מִפִּי
  choice: исходящее из Моих уст
  rationale: Сохраняет конкретный образ произнесённого слова и длительно-характеризующую силу причастного оборота в русском контексте.
- source_word: לֹא יָשׁוּב אֵלַי רֵיקָם
  choice: оно не вернётся ко Мне без плода
  rationale: רֵיקָם буквально указывает на пустоту или отсутствие результата. «Без плода» естественно по-русски выражает результативность, не вводя образа «с пустыми руками».
- source_word: כִּי אִם
  choice: но
  rationale: 'После отрицания вводит резкое противопоставление: не вернётся без результата, но исполнит порученное.'
- source_word: עָשָׂה אֵת אֲשֶׁר חָפַצְתִּי
  choice: исполнит то, чего Я желаю
  rationale: Будущее время определяется контекстом; «исполнит» передаёт доведение Божьего желания до осуществления, а «желаю» сохраняет волевой смысл חפץ без догматически усиленного «предопределил».
- source_word: וְהִצְלִיחַ אֲשֶׁר שְׁלַחְתִּיו
  choice: и успешно совершит то, для чего Я послал его
  rationale: הצליח выражает успех; сжатая еврейская относительная конструкция раскрыта естественным русским оборотом, при этом целевая направленность посланного слова сохранена.
theological_decisions:
- issue: Возможная персонификация «слова»
  choice: Передать как действенное Божье изречение, не делая «Слово» личным титулом.
  alternative: Христологически отождествить слово с предвечным Сыном.
  rationale: Непосредственный контекст Ис 55 говорит об эффективности Божьей речи, уподобленной дождю и снегу; личного титула еврейский текст здесь не требует.
- issue: Действенность Божьего слова и человеческий отклик
  choice: Подчеркнуть несомненное исполнение Божьего намерения без добавления конфессионально окрашенной терминологии.
  alternative: Истолковать стих как техническое утверждение о непреодолимом декрете либо лишь о нравственном убеждении.
  rationale: Текст утверждает, что посланное Богом слово достигает желаемого результата, но не разворачивает механизм этого действия в отдельную доктрину.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Инверсия «слово Моё» умеренно возвышенна и подчёркивает принадлежность Богу; заглавные местоимения применены последовательно. Образ уст сохранён, а идиоматическое רֵיקָם передано естественным выражением «без плода» с буквальным вариантом в сноске.
