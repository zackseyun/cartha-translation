source:
  edition: WLC
  text: יַעֲזֹ֤ב רָשָׁע֙ דַּרְכּ֔/וֹ וְ/אִ֥ישׁ אָ֖וֶן מַחְשְׁבֹתָ֑י/ו וְ/יָשֹׁ֤ב אֶל יְהוָה֙ וִֽ/ירַחֲמֵ֔/הוּ וְ/אֶל אֱלֹהֵ֖י/נוּ כִּֽי יַרְבֶּ֥ה לִ/סְלֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/007.yaml
  text: Let the wicked man forsake his way[a], and the man of iniquity his thoughts; let him return to Yahweh, and he will have compassion on him, and to our God[e][d][c][b], for he will abundantly pardon.
translation:
  language: ru
  text: Пусть нечестивый оставит свой путь, и человек беззакония — свои замыслы; пусть возвратится к Яхве[a], и Он помилует его; пусть возвратится к нашему Богу, ибо Он обильно прощает[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное в еврейском тексте четырьмя согласными יהוה (ЙХВХ); в традиционных переводах его часто заменяют титулом «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «ибо Он умножает прощать»; также возможно: «ибо Он щедро простит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲזֹב
  choice: оставит
  rationale: Форма Qal в увещевательном контексте передана побуждением «пусть… оставит»; глагол выражает сознательный отказ от прежнего пути.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное обозначение человека; «нечестивый» естественно и достойно звучит по-русски, сохраняя нравственный смысл.
- source_word: דַּרְכּוֹ
  choice: свой путь
  rationale: Сохранён еврейский образ пути как образа образа жизни и поведения.
- source_word: אִישׁ אָוֶן
  choice: человек беззаконный
  rationale: Сочетание передаёт лицо, характеризуемое אָוֶן — злом, неправдой, беззаконием, — и сохраняет параллелизм стиха.
- source_word: מַחְשְׁבֹתָיו
  choice: свои замыслы
  rationale: מַחֲשָׁבוֹת может означать мысли, намерения или планы; «замыслы» здесь охватывает внутренние намерения, параллельные внешнему «пути».
- source_word: וְיָשֹׁב
  choice: пусть возвратится
  rationale: Сохранён пространственно-реляционный образ שׁוּב — возвращения к Богу; перевод не сужает значение до богословского термина «покаяться».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: וִירַחֲמֵהוּ
  choice: и Он помилует его
  rationale: רחם выражает сострадание и милость; «помилует» естественно передаёт обещанное милосердное действие Бога.
- source_word: אֱלֹהֵינוּ
  choice: нашему Богу
  rationale: Сохранено местоимение первого лица множественного числа и общинное звучание пророческой речи.
- source_word: כִּי יַרְבֶּה לִסְלוֹחַ
  choice: ибо Он щедр на прощение
  rationale: 'Идиоматический русский оборот передаёт усилительное значение רבה с инфинитивом: Бог прощает обильно, великодушно.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон — личное Божье имя; транслитерация сохраняет различие между именем и титулом.
- issue: Передача שׁוּב
  choice: возвратится
  alternative: покается / обратится
  rationale: «Возвратится» сохраняет основной еврейский образ движения обратно к Богу и не устраняет его богословскую широту.
- issue: Связь двух дополнений אֶל־יְהוָה и אֶל־אֱלֹהֵינוּ
  choice: оба отнесены к «пусть возвратится»
  alternative: считать «к нашему Богу» продолжением фразы о помиловании
  rationale: Параллельные предложные обороты естественно относятся к одному глаголу שׁוּב; тире помогает восстановить эту связь после вставной фразы «и Он помилует его».
- issue: Смысл כִּי יַרְבֶּה לִסְלוֹחַ
  choice: Он щедр на прощение
  alternative: Он многократно простит / обильно прощает
  rationale: Выбранная формулировка сохраняет изобилие Божьего прощения, не ограничивая его ни числом проступков, ни только будущим действием.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Синтаксический параллелизм оригинала сохранён; тире показывает подразумеваемый повтор сказуемого и не даёт ошибочно присоединить «к нашему Богу» к глаголу «помилует».
