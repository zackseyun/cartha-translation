id: ISA.55.9
reference: Isaiah 55:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי גָבְה֥וּ שָׁמַ֖יִם מֵ/אָ֑רֶץ כֵּ֣ן גָּבְה֤וּ דְרָכַ/י֙ מִ/דַּרְכֵי/כֶ֔ם וּ/מַחְשְׁבֹתַ֖/י מִ/מַּחְשְׁבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/009.yaml
  text: For as the heavens are higher than the earth[a], so my ways are higher than your ways[b], and my thoughts than your thoughts.
translation:
  language: ru
  text: Ибо как небеса выше земли[a], так Мои пути выше ваших путей, и Мои мысли — ваших мыслей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небо». Еврейское שָׁמַיִם имеет форму множественного числа и традиционно передаётся как «небеса».'
    reason: lexical_alternative
  - marker: b
    text: Слово «мысли» в данном контексте может также означать «замыслы» или «намерения».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предыдущего утверждения; «ибо» естественно передаёт причинно-пояснительную связь и сохраняет возвышенный регистр.
- source_word: גָבְהוּ שָׁמַיִם מֵאָרֶץ
  choice: как небеса выше земли
  rationale: Форма глагола выражает состояние, а מִן — сравнение. Русская сравнительная конструкция точно и естественно передаёт смысл.
- source_word: כֵּן
  choice: так
  rationale: Обозначает соответствие между высотой небес над землёй и превосходством Божьих путей и мыслей.
- source_word: דְרָכַי ... מִדַּרְכֵיכֶם
  choice: Мои пути выше ваших путей
  rationale: «Пути» сохраняет исходную метафору образа действий и точный поэтический параллелизм.
- source_word: וּמַחְשְׁבֹתַי ... מִמַּחְשְׁבֹתֵיכֶם
  choice: и Мои мысли — ваших мыслей
  rationale: «Мысли» сохраняет широкое значение слова, которое может охватывать также замыслы и намерения; эллипсис глагола естественен для русской поэзии и соответствует еврейскому параллелизму.
theological_decisions:
- issue: Антропоморфное сопоставление Божьего и человеческого мышления и образа действий
  choice: Сохранить прямые метафоры «Мои пути» и «Мои мысли» без поясняющей перифразы.
  alternative: «Мой образ действий» и «Мои замыслы»
  rationale: Исходный текст поэтически противопоставляет Бога человеку, не ограничивая смысл одним лишь планированием или действием. Сохранение метафор передаёт богословскую напряжённость и широту оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Заглавные буквы в местоимениях, относящихся к Богу, следуют принятой русской библейской издательской традиции; исходный еврейский текст такого различия не обозначает.
