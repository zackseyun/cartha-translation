base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/006.yaml
  text: Seek Yahweh while he may be found[a]; call on him while he is near.
translation:
  language: ru
  text: Ищите Яхве, пока Его можно найти[a]; взывайте к Нему, пока Он близко.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока Он может быть найден».'
    reason: 'Лексико-грамматическая альтернатива: בְּהִמָּצְאוֹ — временная конструкция с пассивным инфинитивом «в то время, когда Он бывает / может быть найден». Формулировка сохраняет пассивное значение оригинала, не подразумевая физического местонахождения.'
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Ищите
  rationale: Императив множественного числа передаёт призыв искать Бога, обращаясь к Нему; «ищите» естественно и сохраняет краткость и побудительную силу оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּהִמָּצְאוֹ
  choice: пока Его можно найти
  rationale: Конструкция с ב и инфинитивом имеет временное значение и указывает на нынешнюю возможность обратиться к Богу. Модальное «можно» естественно по-русски, хотя еврейская форма допускает и более буквальное «пока Он находится».
- source_word: קְרָאֻהוּ
  choice: взывайте к Нему
  rationale: В данном религиозном контексте קרא с личным объектом означает призывать Бога, обращаться к Нему с мольбой; «взывайте к Нему» точнее передаёт это, чем нейтральное «зовите Его».
- source_word: בִּהְיוֹתוֹ
  choice: пока Он
  rationale: Сочетание ב с инфинитивом היה задаёт временную рамку, параллельную первой половине стиха.
- source_word: קָרוֹב
  choice: близко
  rationale: Сохраняет прямое значение слова и его возможный пространственный и relational оттенок доступности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и соответствует наиболее вероятной научной реконструкции произношения.
- issue: Характер возможности найти Бога
  choice: пока Его можно найти
  alternative: пока Он находится; когда Он находится
  rationale: Перевод выражает временную доступность и настоятельность призыва, но не уточняет, чем эта возможность ограничена. Сноска сохраняет более буквальную альтернативу без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и побудительным звучанием. Параллелизм двух повелений и двух временных оборотов сохранён. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
