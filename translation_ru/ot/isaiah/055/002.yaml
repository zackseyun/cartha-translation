  text: לָ֤/מָּה תִשְׁקְלוּ כֶ֨סֶף֙ בְּֽ/לוֹא לֶ֔חֶם וִ/יגִיעֲ/כֶ֖ם בְּ/ל֣וֹא לְ/שָׂבְעָ֑ה שִׁמְע֨וּ שָׁמ֤וֹעַ אֵלַ/י֙ וְ/אִכְלוּ ט֔וֹב וְ/תִתְעַנַּ֥ג בַּ/דֶּ֖שֶׁן נַפְשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/002.yaml
  text: Why do you weigh out silver for what is not bread[a], and your labor for what does not satisfy? Listen carefully to me, and eat what is good[c][b], and let your soul delight itself in richness.
translation:
  language: ru
  text: Зачем вы отвешиваете серебро на то, что не хлеб[a], и тратите свой труд на то, что не насыщает? Слушайте Меня внимательно[b], ешьте доброе, и пусть душа ваша наслаждается изобилием[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тратите деньги не на хлеб»; буквально: «отвешиваете серебро», поскольку серебром расплачивались по весу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «слушайте, слушая Меня»; сочетание повеления с абсолютным инфинитивом усиливает призыв.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «тучной пищей», «богатством»; буквально образ связан с жиром как признаком обильной и лучшей пищи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁקְלוּ כֶסֶף
  choice: отвешиваете серебро
  rationale: Сохраняет конкретный древний образ расчёта серебром по весу; более привычное «тратите деньги» дано в сноске.
- source_word: בְּלוֹא לֶחֶם
  choice: за то, что не хлеб
  rationale: Передаёт краткую отрицательную конструкцию и сохраняет противопоставление истинной пище, не разъясняя метафору сверх текста.
- source_word: וִיגִיעֲכֶם
  choice: отдаёте свой труд
  rationale: יְגִיעַ может обозначать и тяжёлый труд, и его плод. Формулировка сохраняет образ затраты труда и естественно сочетается с параллельной строкой.
- source_word: לְשָׂבְעָה
  choice: за то, что не насыщает
  rationale: Естественно передаёт значение сытости и удовлетворения, сохраняя пищевой образ.
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Слушайте Меня внимательно
  rationale: Императив с абсолютным инфинитивом усиливает повеление; наречие передаёт эмфазу без неестественного русского повтора.
- source_word: וְאִכְלוּ טוֹב
  choice: ешьте то, что хорошо
  rationale: Передаёт субстантивированное טוֹב и сохраняет широту выражения, не сводя его исключительно к вкусной или полезной пище.
- source_word: וְתִתְעַנַּג ... נַפְשְׁכֶם
  choice: пусть душа ваша наслаждается
  rationale: Форма глагола согласуется с последующим существительным женского рода נֶפֶשׁ; русская конструкция естественно делает душу подлежащим.
- source_word: בַּדֶּשֶׁן
  choice: изобилием
  rationale: דֶּשֶׁן буквально связано с жиром и тучностью, а переносно — с обильной, богатой пищей и достатком. «Изобилие» избегает нежелательных современных ассоциаций слова «жир».
- source_word: נַפְשְׁכֶם
  choice: душа ваша
  rationale: Сохраняет поэтический акцент на внутреннем существе человека; возможное более широкое значение «вы сами» не навязывается.
theological_decisions:
- issue: Метафорический язык насыщения
  choice: Сохранить образы хлеба, еды и насыщения без явного добавления «духовный».
  alternative: Разъяснить приглашение как духовное питание и удовлетворение.
  rationale: Еврейский текст выражает Божье приглашение через конкретные пищевые образы. Их прямое одухотворение в основном тексте сузило бы поэтическую и богословскую многозначность.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной поэтической образности. Конкретный древний образ взвешивания серебра оставлен в тексте и пояснён в сноске; синтаксис сделан ясным для обычного читателя. Обращение к Богу передано местоимением «Меня» с прописной буквы согласно распространённой русской библейской издательской норме.
