  text: כִּ֡י כַּ/אֲשֶׁ֣ר יֵרֵד֩ הַ/גֶּ֨שֶׁם וְ/הַ/שֶּׁ֜לֶג מִן הַ/שָּׁמַ֗יִם וְ/שָׁ֨מָּ/ה֙ לֹ֣א יָשׁ֔וּב כִּ֚י אִם הִרְוָ֣ה אֶת הָ/אָ֔רֶץ וְ/הוֹלִידָ֖/הּ וְ/הִצְמִיחָ֑/הּ וְ/נָ֤תַן זֶ֨רַע֙ לַ/זֹּרֵ֔עַ וְ/לֶ֖חֶם לָ/אֹכֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/010.yaml
  text: For just as the rain and the snow come down from heaven and do not return there unless they have watered the earth[a], made it bear fruit, and made it sprout, and have given seed to the sower and bread to the eater[b],
translation:
  language: ru
  text: Ведь как дождь и снег нисходят с небес и не возвращаются туда, пока не напоят землю, не заставят её плодоносить и давать всходы и не дадут семя сеятелю и хлеб тому, кто ест,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: Ведь как
  rationale: «Ведь» передаёт пояснительную силу כִּי, а «как» вводит сравнение, которое получает продолжение в следующем стихе.
- source_word: יֵרֵד הַגֶּשֶׁם וְהַשֶּׁלֶג
  choice: дождь и снег нисходят
  rationale: Глагол ירד обозначает движение сверху вниз. «Нисходят» сохраняет образ и соответствует возвышенному, но современному регистру пророческой речи.
- source_word: מִן הַשָּׁמַיִם
  choice: с небес
  rationale: שָׁמַיִם имеет форму множественного числа и здесь обозначает небесную высь; русское «с небес» естественно и стилистически уместно.
- source_word: וְשָׁמָּה לֹא יָשׁוּב כִּי אִם
  choice: и не возвращаются туда, пока не
  rationale: 'Передано наречие שָׁמָּה «туда» и исключительное значение כִּי אִם: возвращение мыслится лишь после совершения перечисленных действий. Множественное число естественно согласует сказуемое с парой «дождь и снег».'
- source_word: הִרְוָה אֶת הָאָרֶץ
  choice: напоят землю
  rationale: Hiphil глагола רוה означает напоить, насытить влагой. «Напоят землю» ясно сохраняет земледельческий образ.
- source_word: וְהוֹלִידָהּ וְהִצְמִיחָהּ
  choice: не заставят её плодоносить и давать всходы
  rationale: Оба Hiphil переданы каузативно. «Плодоносить» выражает производительный результат ילד в отношении земли, а «давать всходы» сохраняет образ прорастания в צמח и различие между двумя глаголами.
- source_word: וְנָתַן זֶרַע לַזֹּרֵעַ וְלֶחֶם לָאֹכֵל
  choice: и не дадут семя сеятелю и хлеб тому, кто ест
  rationale: Сохранены конкретные образы семени и хлеба и параллелизм получателей. Описательное «тому, кто ест» современнее субстантивированного «едоку» и точно передаёт причастие.
