  text: הֵ֣ן גּ֤וֹי לֹֽא תֵדַע֙ תִּקְרָ֔א וְ/ג֥וֹי לֹֽא יְדָע֖וּ/ךָ אֵלֶ֣י/ךָ יָר֑וּצוּ לְמַ֨עַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/לִ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל כִּ֥י פֵאֲרָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/005.yaml
  text: Behold[a], you will call a nation that you do not know, and a nation that did not know you will run to you, because of Yahweh your God, and the Holy One of Israel[c][b], for he has glorified you.
translation:
  language: ru
  text: Вот[a], ты призовёшь народ, которого не знаешь, и народ, который не знал тебя, побежит к тебе[b] ради Яхве, твоего Бога, и Святого Израиля, потому что Он прославил тебя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поистине».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поспешит к тебе».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «украсил тебя великолепием»; также возможно: «почтил тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт эмфатическое введение пророческого возвещения естественным и понятным современным русским словом.
- source_word: גּוֹי
  choice: народ
  rationale: В данном контексте обозначает этническую или политическую общность. «Народ» звучит по-русски естественно и не вносит отсутствующего в еврейском тексте уточнения «языческий».
- source_word: לֹא תֵדַע
  choice: которого не знаешь
  rationale: Имперфект 2-го лица единственного числа естественно передаётся настоящим временем внутри предложения, ориентированного на будущее.
- source_word: תִּקְרָא
  choice: ты призовёшь
  rationale: Глагол קרא может означать «позвать» или «призвать». «Призовёшь» сохраняет оттенок властного обращения к народу, не превращая его в более узкое «прикажешь».
- source_word: לֹא יְדָעוּךָ
  choice: который не знал тебя
  rationale: Перфект указывает на предшествующее отсутствие знакомства и хорошо передаётся русским прошедшим временем.
- source_word: אֵלֶיךָ יָרוּצוּ
  choice: побежит к тебе
  rationale: 'רוּץ буквально обозначает быстрый бег. Хотя форма глагола во множественном числе согласована с собирательным גּוֹי по смыслу, в русском нормативно согласование в единственном числе: «народ… побежит».'
- source_word: לְמַעַן
  choice: ради
  rationale: Передаёт мотивирующее основание прихода народа; конструкция допускает также более явно причинное понимание «благодаря» или «из-за».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Прямая и естественная передача конструкции с местоименным суффиксом.
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: и Святого Израилева
  rationale: Сохраняет соединительный союз и традиционное, понятное русское наименование; фраза стоит параллельно «Яхве, твоего Бога».
- source_word: כִּי
  choice: потому что
  rationale: 'Ясно передаёт объяснительно-причинную связь: народы устремляются к адресату вследствие того, что Бог его прославил.'
- source_word: פֵאֲרָךְ
  choice: Он прославил тебя
  rationale: Порода piel глагола פאר охватывает значения украшения, наделения великолепием и почётом. «Прославил» передаёт публичное возвышение адресата, привлекающее народ.
theological_decisions:
- issue: К кому относятся местоимения второго лица единственного числа
  choice: Сохранено прямое обращение «ты/тебя» без уточнения личности адресата.
  alternative: Назвать адресата Сионом/Иерусалимом, Израилем либо Давидовым правителем.
  rationale: Еврейский текст использует единственное число, но сам стих не разрешает однозначно вопрос об адресате. Перевод сохраняет эту богословскую и литературную неоднозначность.
- issue: Соотношение выражений «Яхве, твоего Бога» и «Святого Израилева»
  choice: Сохранены союз «и» и параллельная конструкция.
  alternative: 'Передать второе наименование пояснительно: «то есть Святого Израилева».'
  rationale: Наименования явно относятся к одному Богу, однако еврейский союз не требует вводить в основной текст явное отождествляющее «то есть».
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис остаётся близким к еврейскому параллелизму, но согласование собирательного существительного «народ» приведено к нормам русского языка. Заглавная буква в «Он» служит ясности референции и соответствует принятому благоговейному регистру, не уточняя личность адресата.
