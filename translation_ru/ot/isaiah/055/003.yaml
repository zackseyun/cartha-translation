  text: הַטּ֤וּ אָזְנְ/כֶם֙ וּ/לְכ֣וּ אֵלַ֔/י שִׁמְע֖וּ וּ/תְחִ֣י נַפְשְׁ/כֶ֑ם וְ/אֶכְרְתָ֤ה לָ/כֶם֙ בְּרִ֣ית עוֹלָ֔ם חַֽסְדֵ֥י דָוִ֖ד הַ/נֶּאֱמָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/003.yaml
  text: Incline your ear and come to me; hear[a], and your soul shall live; and I will make with you an everlasting covenant—the faithful covenant love promised to David.
translation:
  language: ru
  text: Приклоните ухо и придите ко Мне; слушайте — и будет жить душа ваша. Я заключу с вами вечный завет — непреложные милости Давида.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «непреложные милости Давида». Еврейская конструкция допускает разные понимания связи с Давидом; в контексте она, вероятно, говорит о надёжных милостях или обетованиях, данных Давиду. Еврейское חֶסֶד может означать милость, верную любовь или заветную преданность.'
    reason: Сохраняет многозначность חֶסֶד и не вносит в основной текст невыраженное прямо толкование отношения к Давиду.
lexical_decisions:
- source_word: הַטּוּ אָזְנְכֶם
  choice: Приклоните ухо
  rationale: Сохраняет еврейскую метафору внимательного слушания и возвышенный тон; единственное число «ухо» соответствует собирательному обороту источника.
- source_word: וּלְכוּ אֵלַי
  choice: и придите ко Мне
  rationale: 'В контексте приглашения הלך אֶל естественно передаётся как движение к говорящему: «придите ко Мне».'
- source_word: שִׁמְעוּ
  choice: слушайте
  rationale: Передаёт не только слышание звука, но и внимательное, восприимчивое слушание, не превращая подразумеваемое послушание в явное толкование.
- source_word: וּתְחִי נַפְשְׁכֶם
  choice: и будет жить душа ваша
  rationale: Сохраняет последовательность еврейских форм и явное נֶפֶשׁ; форма выражает ожидаемый результат призыва.
- source_word: וְאֶכְרְתָה לָכֶם בְּרִית
  choice: Я заключу с вами завет
  rationale: «Заключить завет» — естественный русский эквивалент устойчивого еврейского выражения כרת ברית.
- source_word: בְּרִית עוֹלָם
  choice: вечный завет
  rationale: Точно и привычно передаёт продолжительность завета, выраженную עוֹלָם.
- source_word: חַסְדֵי דָוִד הַנֶּאֱמָנִים
  choice: верные милости, обещанные Давиду
  rationale: «Милости» сохраняет множественное число חַסְדֵי и широту значения חֶסֶד, а «верные» передаёт надёжность הַנֶּאֱמָנִים. Добавление «обещанные» ясно выражает наиболее вероятную связь с Давидом, при этом альтернативы отмечены в сноске.
theological_decisions:
- issue: Связь «верных милостей Давида» с вечным заветом
  choice: Божьи надёжные милости, обещанные Давиду и предлагаемые адресатам в вечном завете
  alternative: Милости, принадлежащие Давиду; проявленные Давидом благодеяния; неизменная любовь к Давиду
  rationale: Бог выступает как заключающий завет, поэтому наиболее вероятно, что речь идёт о надёжных заветных дарах или обещаниях, связанных с Давидом. Формулировка не вводит последующих конфессиональных выводов.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Метафора «приклоните ухо» сохранена как понятный возвышенный оборот; местоимение «Мне» оформлено с традиционной прописной буквы при прямой речи Бога. Сноска уточняет подлинную лексическую и синтаксическую неоднозначность.
