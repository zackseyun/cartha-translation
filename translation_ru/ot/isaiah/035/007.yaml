base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/007.yaml
  text: The burning sand will become a pool[a], and the thirsty ground springs of water; in the haunt of jackals, where they lie down, there will be grass, reeds[c][b], and rushes.
translation:
  language: ru
  text: 'Раскалённый песок превратится в озеро[a],

    и иссохшая земля — в водные источники.

    В обиталище шакалов, на месте их лежбища[b],

    будут расти трава, тростник и папирус[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знойное марево превратится в озеро». Еврейское שָׁרָב может обозначать палящий зной или мерцающее от жара марево над пустыней.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в обиталище шакалов, в его лежбище». Синтаксис еврейского текста здесь сжат и допускает разные способы связать «обиталище шакалов», «лежбище» и появляющуюся растительность.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «болотное растение». Еврейское גֹמֶא обычно обозначает папирус, но может употребляться и шире — о сходной влаголюбивой растительности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁרָב
  choice: раскалённый песок
  rationale: Слово обозначает зной или раскалённую, мерцающую от жара поверхность пустыни. «Раскалённый песок» передаёт конкретный образ пустынного ландшафта; возможное значение «марево» сохранено в примечании.
- source_word: לַאֲגַם
  choice: в озеро
  rationale: אֲגַם обозначает водоём, озеро или болотистое место. «Озеро» естественно передаёт контраст с раскалённой пустыней, не перегружая строку специальной лексикой.
- source_word: צִמָּאוֹן
  choice: иссохшая земля
  rationale: Существительное может означать жажду либо иссохшее место. Параллелизм указывает здесь на землю; выбранная формулировка ясно выражает этот топографический смысл.
- source_word: לְמַבּוּעֵי מָיִם
  choice: в водные источники
  rationale: מַבּוּעַ — источник, ключ. Множественное число сохраняет образ изобилия воды.
- source_word: בִּנְוֵה תַנִּים
  choice: в обиталище шакалов
  rationale: נָוֶה здесь означает место обитания, а תַנִּים в контексте пустынных развалин — шакалов, не мифических драконов.
- source_word: רִבְצָהּ
  choice: на месте их лежбища
  rationale: Слово образовано от רבץ, «лежать, залегать». Именная формулировка сохраняет сжатый синтаксис еврейского текста и естественно соотносится с шакалами.
- source_word: חָצִיר
  choice: трава
  rationale: Обычное и точное современное соответствие для травы или зелени.
- source_word: לְקָנֶה וָגֹמֶא
  choice: тростник и камыш
  rationale: קָנֶה — тростник, а גֹמֶא — болотное растение, которое может обозначать камыш либо папирус. Перечень передаёт появление растительности у воды; значение «папирус» отмечено в сноске.
