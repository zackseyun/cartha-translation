base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/006.yaml
  text: Then the lame will leap like a deer[a], and the tongue of the mute will sing for joy; for waters have burst forth in the wilderness[b], and streams in the desert plain.
translation:
  language: ru
  text: Тогда хромой будет скакать, как олень, и язык немого запоёт от радости[a], потому что в пустыне пробьются воды, и в сухой степи — потоки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «издаст радостный крик».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Араве», если понимать это слово как географическое название, а не как нарицательное обозначение сухой степи.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְדַלֵּג
  choice: будет скакать
  rationale: Пиэль передаёт энергичные, живые прыжки; «будет скакать» естественно по-русски и сохраняет яркость образа исцеления.
- source_word: כָּאַיָּל
  choice: как олень
  rationale: אַיָּל обозначает оленя или самца оленя; «олень» — современное и понятное соответствие без архаической окраски.
- source_word: פִּסֵּחַ
  choice: хромой
  rationale: Субстантивированное прилагательное в единственном числе обозначает хромого человека; русский вариант краток и непосредственно передаёт форму оригинала.
- source_word: וְתָרֹן
  choice: возликует
  rationale: רנן означает звонко выражать радость — пением или радостным возгласом. «Возликует» естественно сочетается с «язык» и сохраняет эту смысловую широту.
- source_word: לְשׁוֹן אִלֵּם
  choice: язык немого
  rationale: Сохранён конкретный образ оригинала, подчёркивающий обретение речи.
- source_word: נִבְקְעוּ
  choice: пробьются
  rationale: Нифаль от בקע выражает раскрытие или прорыв; применительно к воде «пробьются» передаёт её внезапное появление естественным русским языком.
- source_word: בַמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר здесь обозначает безлюдную, засушливую местность; «пустыня» ясно передаёт контекст и не смешивается со следующим термином עֲרָבָה.
- source_word: מַיִם
  choice: воды
  rationale: Сохранено грамматическое множественное число и возвышенный поэтический оттенок.
- source_word: וּנְחָלִים
  choice: потоки
  rationale: נְחָלִים может обозначать потоки или русла сезонных рек; в контексте обновления засушливой земли «потоки» подчёркивает текущую воду.
- source_word: בָּעֲרָבָה
  choice: в степи
  rationale: עֲרָבָה может быть нарицательным обозначением сухой равнины или географическим названием Арава. В поэтическом параллелизме нарицательное «степь» звучит естественно, а географическая возможность отмечена в сноске.
theological_decisions:
- issue: Характер образов восстановления
  choice: Передать конкретные телесное исцеление и обновление природы, не ограничивая их ни исключительно буквальным, ни исключительно метафорическим исполнением.
  alternative: Истолковать строку только как духовную метафору либо только как буквальное эсхатологическое предсказание.
  rationale: Еврейский текст прямо изображает устранение телесных недугов и появление воды в сухой земле, но сам стих не задаёт единственной богословской схемы исполнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис ясен для широкого читателя; образы оригинала сохранены без конфессионального истолкования.
