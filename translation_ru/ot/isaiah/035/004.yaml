source:
  edition: WLC
  text: אִמְרוּ֙ לְ/נִמְהֲרֵי לֵ֔ב חִזְק֖וּ אַל תִּירָ֑אוּ הִנֵּ֤ה אֱלֹֽהֵי/כֶם֙ נָקָ֣ם יָב֔וֹא גְּמ֣וּל אֱלֹהִ֔ים ה֥וּא יָב֖וֹא וְ/יֹשַׁעֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/004.yaml
  text: Say to those with an anxious heart[a], “Be strong; do not fear. Look, your God will come with vengeance, with the recompense of God[b]; he himself will come and save you.”
translation:
  language: ru
  text: 'Скажите тем, чьё сердце в смятении[a]: «Будьте сильны, не бойтесь! Вот ваш Бог: он придёт с отмщением, с Божьим воздаянием[b]. Он сам придёт и спасёт вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «торопливые сердцем»; то есть тем, чьё сердце встревожено, кто растерян или близок к панике.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с воздаянием Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְהֲרֵי לֵב
  choice: тем, чьё сердце в смятении
  rationale: Буквально выражение связано с «торопливостью» сердца, но в данном контексте обозначает внутреннюю тревогу, растерянность или близкое к панике смятение. Русская формулировка естественна и не сводит смысл только к страху.
- source_word: חִזְקוּ
  choice: Будьте крепки
  rationale: Прямо передаёт повелительную форму חזק и сохраняет возвышенный, но понятный библейский регистр.
- source_word: אַל תִּירָאוּ
  choice: не бойтесь
  rationale: Естественный русский эквивалент отрицательного повеления от ירא.
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательную и привлекающую внимание функцию частицы без архаичного «се».
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Сохраняет обращение во втором лице множественного числа и личностно-заветный оттенок выражения.
- source_word: נָקָם
  choice: отмщение
  rationale: Передаёт идею Божьего карательного воздаяния и сохраняет её рядом со спасением, не смягчая до общего понятия справедливости.
- source_word: גְּמוּל אֱלֹהִים
  choice: Божье воздаяние
  rationale: 'Естественно передаёт конструкцию «воздаяние Бога», оставляя открытым присущий сочетанию родительный смысл: воздаяние принадлежит Богу или исходит от Него.'
- source_word: הוּא
  choice: Он Сам
  rationale: Самостоятельное местоимение при глагольной форме имеет эмфатическую силу; «Он Сам» подчёркивает личное пришествие Бога.
- source_word: וְיֹשַׁעֲכֶם
  choice: и спасёт вас
  rationale: Широко и точно передаёт каузативную форму от ישׁע, уместную как для избавления в данном контексте, так и для более полного смысла спасения.
theological_decisions:
- issue: Соотношение Божьего отмщения и спасения
  choice: 'Оба мотива переданы прямо: Бог приходит с отмщением и воздаянием и одновременно приходит спасти свой народ.'
  alternative: Смягчить «отмщение» до общей «справедливости» либо истолковать спасение исключительно духовно.
  rationale: Еврейский текст ставит отмщение, воздаяние и спасение рядом. Перевод сохраняет эту богословскую напряжённость, не устраняя и не сужая ни одну из сторон.
- issue: Синтаксис сообщения о пришествии Бога
  choice: '«Вот ваш Бог: Он придёт с отмщением, с Божьим воздаянием».'
  alternative: «Вот ваш Бог! Отмщение придёт, Божье воздаяние» или «Вот ваш Бог, отмщение придёт».
  rationale: Краткая, эллиптическая еврейская последовательность допускает более буквальное расчленение, однако контекст и параллелизм поддерживают понимание Бога как приходящего с отмщением и воздаянием. Двоеточие сохраняет заметную паузу после «ваш Бог».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Избегаются архаизмы «се» и «да не устрашитесь», но сохраняются риторическая сила повелений, эмфаза «Он Сам» и напряжение между Божьим отмщением и спасением.
