  text: לֹא יִהְיֶ֨ה שָׁ֜ם אַרְיֵ֗ה וּ/פְרִ֤יץ חַיּוֹת֙ בַּֽל יַעֲלֶ֔/נָּה לֹ֥א תִמָּצֵ֖א שָׁ֑ם וְ/הָלְכ֖וּ גְּאוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/009.yaml
  text: No lion will be there[a], and no ravenous beast will go up on it; it will not be found there[c][b], but the redeemed will walk there.
translation:
  language: ru
  text: 'Льва там не будет,

    и свирепый зверь не взойдёт на неё[a],

    не окажется там;

    а искупленные[b] будут идти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть на дорогу, о которой говорится в предыдущем стихе.
    reason: cross_reference
  - marker: b
    text: Буквально — «искупленные», от еврейского корня גאל; в следующем стихе для близкого понятия употреблено другое еврейское слово, которое можно передать как «выкупленные».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: лев
  rationale: Обычное обозначение льва; единственное число в поэтическом контексте имеет обобщённое значение.
- source_word: פְרִיץ חַיּוֹת
  choice: свирепый зверь
  rationale: פְרִיץ выражает неукротимую, жестокую силу, а сочетание с חַיּוֹת обозначает опасного дикого зверя. «Свирепый зверь» естественно и ясно передаёт угрозу, не сужая смысл до конкретного вида хищника.
- source_word: בַּל
  choice: не
  rationale: Поэтическое отрицание с усилительным оттенком; по-русски естественно передаётся обычным «не», причём категоричность выражена всей конструкцией.
- source_word: יַעֲלֶנָּה
  choice: не взойдёт на неё
  rationale: Глагол עלה означает «подниматься, восходить», а суффикс женского рода, вероятнее всего, отсылает к дороге из предыдущего стиха. Местоимение сохраняет эту связь, не вставляя существительное в основной текст.
- source_word: תִמָּצֵא
  choice: не встретится там
  rationale: Нифаль от מצא буквально означает «быть найденным». В данном контексте русское «не встретится» естественно сообщает, что опасного зверя там не окажется, и избегает тяжеловесного «не будет найден».
- source_word: גְּאוּלִים
  choice: искупленные
  rationale: Страдательное причастие от גאל обозначает тех, кто был избавлен или возвращён ценой выкупа. «Искупленные» сохраняет ключевую богословскую и лексическую окраску слова.
- source_word: וְהָלְכוּ
  choice: пойдут по ней
  rationale: הלך — обычный глагол движения «идти, ходить». Выражение «пойдут по ней» естественно связывает действие с дорогой, подразумеваемой местоименным суффиксом ранее в стихе.
- source_word: שָׁם
  choice: там
  rationale: Пространственное наречие подчёркивает безопасность названного места; повтор по смыслу сохранён.
theological_decisions:
- issue: Различение терминов избавления גְּאוּלִים в стихе 9 и פְדוּיֵי в стихе 10
  choice: искупленные
  alternative: выкупленные; избавленные
  rationale: Здесь употреблено גאל, тогда как в следующем стихе стоит иной корень — פדה. Перевод «искупленные» сохраняет терминологическую особенность данного стиха; примечание предупреждает, что близкие по смыслу еврейские слова не следует безоговорочно отождествлять.
translation_notes:
  register: Современный литературный русский язык с поэтическим членением. Сохранены категорические отрицания и контраст между отсутствием опасных зверей и свободным путём искупленных. «Свирепый зверь» звучит достойно и понятно, а местоимение «неё» удерживает межстиховую связь с дорогой из Ис 35:8.
