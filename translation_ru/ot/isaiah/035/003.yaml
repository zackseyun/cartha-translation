  text: Strengthen weak hands[a], and make firm feeble knees.
translation:
  language: ru
  text: 'Укрепите ослабевшие руки

    и придайте твёрдость подгибающимся коленям[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шатким коленям». Еврейское причастие изображает колени, которые не держат человека, запинаются или подгибаются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַזְּקוּ
  choice: Укрепите
  rationale: Порода пиэль и форма повелительного наклонения во множественном числе выражают побуждение придать силу названному далее предмету — рукам.
- source_word: יָדַיִם רָפוֹת
  choice: ослабевшие руки
  rationale: Сочетание буквально описывает руки, утратившие силу; «ослабевшие» естественно передаёт состояние физической и образной немощи.
- source_word: וּבִרְכַּיִם
  choice: и ... коленям
  rationale: Союз и существительное сохранены, чтобы передать параллелизм двух строк; дательный падеж обусловлен русским выражением «придать твёрдость».
- source_word: כֹּשְׁלוֹת
  choice: подгибающимся
  rationale: Причастие от כשל изображает колени, которые не держат человека, запинаются или подгибаются. Этот выбор сохраняет динамичный образ еврейского текста и звучит естественно по-русски.
- source_word: אַמֵּצוּ
  choice: придайте твёрдость
  rationale: Пиэль, повелительное наклонение множественного числа, означает сделать крепкими или сильными. Формулировка сохраняет смысл и поэтическое различие между двумя близкими еврейскими глаголами.
