  edition: WLC
  text: וְ/הָיָה שָׁ֞ם מַסְל֣וּל וָ/דֶ֗רֶךְ וְ/דֶ֤רֶךְ הַ/קֹּ֨דֶשׁ֙ יִקָּ֣רֵא לָ֔/הּ לֹֽא יַעַבְרֶ֥/נּוּ טָמֵ֖א וְ/הוּא לָ֑/מוֹ הֹלֵ֥ךְ דֶּ֛רֶךְ וֶ/אֱוִילִ֖ים לֹ֥א יִתְעֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/008.yaml
  text: And there shall be a highway there[a], and a road, and it shall be called the Holy Way. The unclean shall not pass over it, but it shall be for them[b]; whoever walks on the way—even fools—shall not go astray.
translation:
  language: ru
  text: И будет там большая дорога и путь, который назовут Святым путём. Нечистый не пройдёт по нему; он будет для них[a]. Идущие по этому пути, даже глупцы, не заблудятся[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза трудна для понимания. Возможны также переводы: «Он будет с ними» или «он будет принадлежать им».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не собьются с пути»; возможно также: «не ошибутся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַסְלוּל
  choice: большая дорога
  rationale: Слово обозначает подготовленную, устроенную дорогу, возможно приподнятую насыпь. «Большая дорога» передаёт образ основного благоустроенного пути без архаичного оттенка.
- source_word: דֶּרֶךְ
  choice: путь
  rationale: Повторяющееся слово передано единообразно там, где это естественно по-русски; тире в первой паре позволяет понять «путь» как пояснение к большой дороге, не устраняя полностью повтор исходного текста.
- source_word: דֶּרֶךְ הַקֹּדֶשׁ
  choice: Святой путь
  rationale: Сочетание буквально связано со святостью или посвящённостью Богу. «Святой путь» естественно звучит по-русски и сохраняет сакральный смысл названия.
- source_word: יִקָּרֵא לָהּ
  choice: который назовут
  rationale: Форма породы нифаль выражает наименование. Русская неопределённо-личная конструкция передаёт пассивный смысл естественнее буквального «будет назван».
- source_word: טָמֵא
  choice: нечистый
  rationale: Прилагательное употреблено как существительное. Выбор сохраняет как обрядовый, так и нравственный оттенок нечистоты, не сужая значение.
- source_word: יַעַבְרֶנּוּ
  choice: не пройдёт по нему
  rationale: Глагол עבר описывает прохождение, а местоименный суффикс относится к пути. Формулировка естественна для движения по дороге.
- source_word: וְהוּא לָמוֹ
  choice: он будет для них
  rationale: Сжатая и трудная конструкция понята так, что местоимение относится к пути, предназначенному «для них». Неоднозначность других возможных разборов отмечена в сноске.
- source_word: הֹלֵךְ דֶּרֶךְ
  choice: идущие по этому пути
  rationale: Единственное причастие имеет обобщающий смысл. Русское множественное число согласовано с последующим «глупцы» и естественно описывает путников.
- source_word: אֱוִילִים
  choice: глупцы
  rationale: Слово обозначает именно неразумных или глупых людей, а не просто неопытных; прямой эквивалент сохраняет остроту исходного выражения.
- source_word: לֹא יִתְעוּ
  choice: не заблудятся
  rationale: Глагол תעה может означать блуждание, уклонение или ошибку. «Не заблудятся» сохраняет буквальный дорожный образ и допускает переносный смысл.
theological_decisions:
- issue: Характер нечистоты в выражении «нечистый не пройдёт по нему»
  choice: Сохранено широкое обозначение «нечистый» без уточнения вида нечистоты.
  alternative: «ритуально нечистый» или «нравственно нечистый»
  rationale: В пророческом контексте еврейское слово может иметь как культовый, так и нравственный оттенок; текст не требует ограничивать его только одним из них.
- issue: Толкование трудной конструкции וְהוּא לָמוֹ
  choice: 'Местоимение отнесено к пути: «он будет для них».'
  alternative: «Он будет с ними» или «он будет принадлежать им»
  rationale: 'Такой разбор лучше всего соответствует ближайшему контрасту: нечистый на путь не вступит, а для подразумеваемых путников он предназначен. Поскольку синтаксис допускает и другие понимания, они сохранены в сноске.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис сделан плавным для чтения вслух; «нечистый» и «глупцы» сохранены без смягчения, а подлинная неоднозначность трудной еврейской конструкции вынесена в сноску.
