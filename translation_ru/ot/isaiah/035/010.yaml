base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/010.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing; everlasting joy will be upon their heads. Gladness and joy will overtake them[a], and sorrow and sighing will flee away.
translation:
  language: ru
  text: И искупленные[a] Яхве вернутся и придут в Сион с ликованием; вечная радость будет на их головах. Ликование и радость настигнут их, а скорбь и стенание убегут прочь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выкупленные Яхве». Еврейское слово может обозначать тех, кто был освобождён посредством искупления или выкупа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְדוּיֵי יְהוָה
  choice: искупленные Яхве
  rationale: Пассивное причастие от פדה обозначает тех, кого избавили посредством искупления или выкупа. «Искупленные» естественно звучит в русском библейском контексте, не сводя образ исключительно к уплате цены; имя יהוה передано как «Яхве».
- source_word: יְשֻׁבוּן
  choice: вернутся
  rationale: Глагол שוב выражает возвращение; простая форма будущего времени точно и естественно передаёт смысл.
- source_word: וּבָאוּ צִיּוֹן
  choice: и придут на Сион
  rationale: בוא означает «приходить, входить». В данном контексте «придут на Сион» — естественная русская передача направленного движения.
- source_word: בְּרִנָּה
  choice: с ликованием
  rationale: רנה обозначает громкое радостное выражение — возглас, пение или ликование. «С ликованием» сохраняет широту значения лучше, чем одно лишь «с пением».
- source_word: וְשִׂמְחַת עוֹלָם
  choice: вечная радость
  rationale: Сочетание буквально означает радость длительного, непреходящего характера. «Вечная радость» кратко и ясно передаёт עוֹלָם.
- source_word: עַל רֹאשָׁם
  choice: над их головами
  rationale: Буквальный пространственный образ сохранён без добавления толкования о венце или украшении.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: ликование и радость
  rationale: Два близких существительных переданы разными словами, чтобы сохранить поэтическую парность и оттенок праздничного торжества.
- source_word: יַשִּׂיגוּ
  choice: настигнут их
  rationale: נשׂג может означать «достичь, настичь». При персонифицированных ликовании и радости «настигнут» сохраняет яркий образ благ, догоняющих людей.
- source_word: וְנָסוּ
  choice: убегут
  rationale: נוס буквально означает «бежать, спасаться бегством». Такая передача сохраняет олицетворение скорби и стенания.
- source_word: יָגוֹן וַאֲנָחָה
  choice: скорбь и стенание
  rationale: יגון означает скорбь или горе, а אנחה — вздох, стенание. Выбранная пара передаёт внутреннее страдание и его слышимое выражение.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — собственное имя Бога. «Яхве» прямо передаёт это имя и не заменяет его титулом.
- issue: 'Значение פְדוּיֵי: искупленные или выкупленные'
  choice: искупленные
  alternative: выкупленные
  rationale: Оба варианта лексически возможны. «Искупленные» сохраняет широкое значение избавления и привычно в русском библейском языке; вариант «выкупленные» отмечен в сноске, чтобы не скрывать образ выкупа.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Сохранены параллелизм, персонификация радости и скорби и пространственный образ радости над головами; архаизмы и добавочные богословские толкования исключены.
