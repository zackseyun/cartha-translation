  source_fidelity: 'Смысловые соответствия в целом точны: פְּדוּיֵי передано как «искупленные», יְשֻׁבוּן — «вернутся», רִנָּה — «ликование», а персонификация радости, скорби и стенания сохранена. Однако עַל רֹאשָׁם означает «на их головах», а не «над их головами»: русский вариант «над» легко создаёт образ радости, находящейся сверху, вместо библейского образа пребывающей на головах радости. Для направления к Сиону «в Сион» нейтральнее и естественнее, чем «на Сион».'
  naturalness: Текст звучит современно и сохраняет возвышенный поэтический регистр. «Ликование и радость настигнут их» удачно передаёт образ יַשִּׂיגוּ. «Скорбь и стенание убегут» допустимо, но «убегут прочь» несколько яснее воспроизводит окончательное удаление и сохраняет олицетворение. Сноску следует поставить непосредственно после слова «искупленные», к которому она относится.
  terminology: «Яхве» последовательно передаёт יהוה. «Искупленные» — точная и естественная передача פְּדוּיֵי; вариант «выкупленные» уместно сохранён в лексической сноске. «Скорбь и стенание» точно передаёт יָגוֹן וַאֲנָחָה.
