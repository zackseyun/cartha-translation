  text: Then the eyes of the blind will be opened[a], and the ears of the deaf will be opened.
translation:
  language: ru
  text: Тогда откроются глаза слепых, и откроются уши глухих.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Краткое временное наречие естественно обозначает грядущий момент как следствие описанного ранее восстановления.
- source_word: תִּפָּקַחְנָה
  choice: откроются
  rationale: Форма нифаля от פקח с существительным «глаза» передаёт открытие глаз; русский глагол сохраняет пассивно-результативный образ без лишнего усиления.
- source_word: עֵינֵי עִוְרִים
  choice: глаза слепых
  rationale: Сохранена конкретная телесная образность и конструкция принадлежности; субстантивированное прилагательное עִוְרִים естественно передано словом «слепых».
- source_word: וְאָזְנֵי חֵרְשִׁים
  choice: и уши глухих
  rationale: Сохранены параллелизм стиха и конкретный образ ушей; חֵרְשִׁים передано субстантивированным прилагательным «глухих».
- source_word: תִּפָּתַחְנָה
  choice: обретут слух
  rationale: Нифаль от פתח буквально означает «откроются», однако применительно к ушам современное русское выражение «обретут слух» естественно и ясно передаёт восстановление способности слышать. Буквальный образ указан в сноске.
theological_decisions:
- issue: Характер образов восстановления
  choice: Сохранить прямую телесную образность, не ограничивая её только физическим либо только духовным истолкованием.
  alternative: Истолковать текст исключительно как чудесное физическое исцеление или исключительно как духовное прозрение.
  rationale: Сам стих говорит о глазах и ушах конкретным языком, но не определяет здесь весь объём и способ исполнения пророчества; перевод не должен устранять эту богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Параллелизм исходного текста сохранён; архаичное «отверзнутся» не использовано.
