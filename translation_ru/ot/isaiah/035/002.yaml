  text: פָּרֹ֨חַ תִּפְרַ֜ח וְ/תָגֵ֗ל אַ֚ף גִּילַ֣ת וְ/רַנֵּ֔ן כְּב֤וֹד הַ/לְּבָנוֹן֙ נִתַּן לָ֔/הּ הֲדַ֥ר הַ/כַּרְמֶ֖ל וְ/הַ/שָּׁר֑וֹן הֵ֛מָּה יִרְא֥וּ כְבוֹד יְהוָ֖ה הֲדַ֥ר אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/002.yaml
  text: It will blossom abundantly and rejoice—yes[a], with rejoicing and a shout of joy. The glory of Lebanon will be given to it, the majesty of Carmel and Sharon. They will see the glory of Yahweh[c][b], the majesty of our God.
translation:
  language: ru
  text: Она пышно расцветёт[a] и возликует — да, с ликованием и радостным пением. Ей будет дана слава Ливана, великолепие Кармила и Шарона[b]. Они[d] увидят славу Яхве[c], великолепие нашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «непременно расцветёт». В еврейском тексте абсолютный инфинитив стоит рядом с личной формой того же глагола, усиливая его значение.'
    reason: lexical_alternative
  - marker: b
    text: Ливан, Кармил и Шарон — области, славившиеся красотой и плодородием; пустыня образно получает их великолепие.
    reason: cultural_note
  - marker: c
    text: В еврейском тексте — יהוה (YHWH), Божье имя, традиционно передаваемое как «Господь».
    reason: alternative_reading
  - marker: d
    text: В еврейском тексте употреблены местоимение и глагол мужского рода множественного числа. Их референт в самом стихе прямо не назван.
    reason: ambiguity_note
lexical_decisions:
- source_word: פָּרֹחַ תִּפְרַח
  choice: пышно расцветёт
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает значение глагола. «Пышно расцветёт» естественно передаёт и усиление, и образ обильного цветения.
- source_word: וְתָגֵל ... גִּילַת
  choice: и возликует — да, будет ликовать
  rationale: Корень גיל выражает бурную радость и повторяется в еврейском тексте. Повтор «возликует… будет ликовать» сохраняет нарастание и однокоренное усиление, не звуча в современном русском механически.
- source_word: אַף
  choice: да
  rationale: Здесь частица усиливает последующее выражение; «да» кратко и поэтически передаёт это подтверждающее усиление.
- source_word: וְרַנֵּן
  choice: и радостно восклицать
  rationale: רנן может обозначать звонкий радостный крик или ликующее пение. «Радостно восклицать» сохраняет слышимое, торжественное выражение радости и не сужает смысл только до пения.
- source_word: כְּבוֹד הַלְּבָנוֹן
  choice: слава Ливана
  rationale: «Слава» передаёт כבוד и сохраняет важный лексический отклик с последующим выражением «слава Яхве».
- source_word: נִתַּן לָהּ
  choice: ей будет дана
  rationale: Пассивная форма перфекта в контексте пророческой картины восстановления естественно имеет будущее значение; местоимение женского рода отсылает к пустыне или земле из предыдущего стиха.
- source_word: הֲדַר
  choice: великолепие
  rationale: «Великолепие» подходит и для красоты плодородных областей, и для величия Бога, сохраняя повтор одного еврейского слова и отличая его от כבוד («слава»).
- source_word: הַכַּרְמֶל וְהַשָּׁרוֹן
  choice: Кармила и Шарона
  rationale: Географические названия переданы общепринятыми русскими формами; родительный падеж обусловлен словом «великолепие».
- source_word: הֵמָּה יִרְאוּ
  choice: Они увидят
  rationale: Сохранены явно выраженное местоимение мужского рода множественного числа и множественное число глагола. Перевод не устраняет поэтическую смену от образа земли к тем, кто увидит Божью славу.
- source_word: כְבוֹד יְהוָה
  choice: славу Яхве
  rationale: Имя יהוה передано как «Яхве», а כבוד — как «слава», с сохранением связи со «славой Ливана».
- source_word: הֲדַר אֱלֹהֵינוּ
  choice: великолепие нашего Бога
  rationale: Повтор «великолепие» сохраняет соответствие одному и тому же слову הֲדַר и параллелизм заключительных строк.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон יהוה. Транслитерация «Яхве» сохраняет личное заветное имя; традиционный вариант указан в примечании.
- issue: Референт הֵמָּה («они»)
  choice: Сохранить форму «Они», не уточняя референт в основном тексте
  alternative: 'Понять местоимение как указание на обновлённые области; перестроить безлично: «там увидят»'
  rationale: Еврейский текст неожиданно переходит от женского единственного числа к мужскому множественному. Вероятнее всего, имеются в виду люди, связанные с восстановленной землёй, однако грамматическую и поэтическую неоднозначность не следует устранять в переводе.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Повтор корня «лик-» передаёт еврейское однокоренное усиление; «слава» и «великолепие» последовательно различают כבוד и הדר. Порядок примечаний в тексте соответствует месту маркеров.
