source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת אַל תִּירָ֥א עַמִּ֛/י יֹשֵׁ֥ב צִיּ֖וֹן מֵֽ/אַשּׁ֑וּר בַּ/שֵּׁ֣בֶט יַכֶּ֔/כָּה וּ/מַטֵּ֥/הוּ יִשָּֽׂא עָלֶ֖י/ךָ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/024.yaml
  text: 'Therefore thus says the Lord GOD of hosts: Do not fear[a], my people who dwell in Zion, because of Assyria. He will strike you with the rod, and he will lift up his staff against you in the manner of Egypt.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка, Яхве Воинств: «Не бойся Ассирии, народ Мой, живущий на Сионе! Она ударит тебя жезлом и поднимет против тебя свой посох — по обычаю Египта[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по пути Египта». Вероятно, речь идёт о прежнем угнетении Израиля Египтом.'
    reason: Сохранена буквальная альтернатива неоднозначного выражения בְּדֶרֶךְ מִצְרָיִם и пояснена наиболее вероятная историческая отсылка.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего контекста и сохраняет логическую связь.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная русская форма устойчивой пророческой формулы; настоящее время передаёт её актуальную силу.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: Владыка Яхве Воинств
  rationale: «Владыка» передаёт אֲדֹנָי, «Яхве» сохраняет личное имя Бога, а «Воинств» — значение צְבָאוֹת без добавления отсутствующего в тексте слова.
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Краткий и естественный запрет в единственном числе, соответствующий еврейской форме.
- source_word: עַמִּי יֹשֵׁב צִיּוֹן
  choice: народ Мой, живущий на Сионе
  rationale: Сохраняет собирательное единственное число исходного текста и прямое обращение к Божьему народу.
- source_word: מֵאַשּׁוּר
  choice: Ассирии
  rationale: После глагола страха обозначает объект страха; название державы сохраняет метонимию оригинала.
- source_word: בַּשֵּׁבֶט יַכֶּכָּה
  choice: Она будет бить тебя жезлом
  rationale: Предлог передаёт орудие действия, а будущее время естественно выражает значение имперфекта в данном пророческом контексте.
- source_word: וּמַטֵּהוּ יִשָּׂא עָלֶיךָ
  choice: и поднимать на тебя свой посох
  rationale: Сохраняет образ занесённого против угнетаемого посоха; притяжательное местоимение передаёт суффикс третьего лица.
- source_word: בְּדֶרֶךְ מִצְרָיִם
  choice: по обычаю Египта
  rationale: Передаёт вероятное идиоматическое значение «на манер Египта», сохраняя историческую отсылку; буквальная пространственная возможность отмечена в сноске.
theological_decisions:
- issue: Передача Божьего имени в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Сохраняется различие между титулом אֲדֹנָי и личным именем יהוה, без замены имени другим титулом.
- issue: Смысл выражения בְּדֶרֶךְ מִצְרָיִם
  choice: по обычаю Египта
  alternative: по пути Египта
  rationale: Контекст, вероятнее всего, сравнивает ассирийское угнетение с прежним египетским угнетением, однако буквальная и потенциально пространственная формулировка оригинала не замалчивается и приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Собирательное обращение оставлено в единственном числе; местоимение «она» согласовано с русским названием «Ассирия».
