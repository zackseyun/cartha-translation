  text: Горе тем, кто издаёт несправедливые постановления[a], и тем, кто записывает предписания, несущие угнетение[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тем, кто постановляет постановления беззакония»; в еврейском тексте глагол и существительное однокоренные.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать тяготу, бедствие или причиняемое зло; здесь «угнетение» передаёт обременительную несправедливость, закреплённую в предписаниях.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Пророческое междометие возвещает суд; «горе» естественно и весомо передаёт эту функцию в русском библейском стиле.
- source_word: הַחֹקְקִים
  choice: тем, кто издаёт
  rationale: 'Причастие от חקק употреблено в юридическом смысле: речь идёт о людях, устанавливающих обязательные постановления. «Издаёт» передаёт это без привязки к современному устройству законодательной власти.'
- source_word: חִקְקֵי
  choice: постановления
  rationale: Существительное обозначает установленные нормы или предписания. Однокоренной повтор с предшествующим глаголом отмечен в сноске, поскольку буквальное воспроизведение по-русски звучало бы тяжеловесно.
- source_word: אָוֶן
  choice: несправедливые
  rationale: В данном юридическом контексте слово характеризует постановления как нравственно порочные и причиняющие зло. «Несправедливые» ясно связывает осуждение с искажением правосудия, не сужая его до формального нарушения закона.
- source_word: וּמְכַתְּבִים
  choice: и составляет предписания
  rationale: Причастная форма связана с письменным оформлением решений. «Составляет предписания» естественно по-русски передаёт деятельность тех, кто закрепляет угнетение письменно, не вводя специальную должность «писцов».
- source_word: עָמָל
  choice: несущие угнетение
  rationale: Слово может означать тяжкий труд, бедствие, тяготу или причиняемое зло; в контексте неправедного управления оно указывает на обременительную несправедливость, от которой страдают другие.
- source_word: כִּתֵּבוּ
  choice: составляет
  rationale: Форма усиливает и завершает мысль о письменном закреплении решений. В русском переводе значение объединено с וּמְכַתְּבִים, чтобы избежать неестественного повтора «пишущие пишут».
