- source_word: הַר בית צִיּוֹן
  choice: горе дома Сиона
  rationale: Предоставленный еврейский текст содержит בית («дом»), поэтому необычная конструкция сохранена, а не исправлена по иной текстовой традиции.
- source_word: גִּבְעַת יְרוּשָׁלִָם
  choice: холму Иерусалима
  rationale: Прозрачно передаёт сопряжённую конструкцию и сохраняет топографический параллелизм с предыдущей фразой.
theological_decisions:
- issue: К кому относится подразумеваемое местоимение единственного числа
  choice: Сохранить «он», не называя действующее лицо в самом стихе
  alternative: Царь Ассирии или олицетворённое ассирийское войско
  rationale: Контекст указывает на ассирийского захватчика, однако сам еврейский стих оставляет субъект подразумеваемым и выражает его в единственном числе.
- issue: Необычное выражение הַר בית צִיּוֹן
  choice: 'Передать чтение предоставленного текста: «гора дома Сиона»'
  alternative: «гора дочери Сиона» по иной текстовой традиции либо сглаженное «гора Сион»
  rationale: Перевод не должен без пояснения заменять явно данное בית («дом») чтением בת («дочь»), хотя последнее широко засвидетельствовано в традиции текста.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Необычная формулировка «гора дома Сиона» намеренно сохранена ввиду предоставленного еврейского чтения; угрожающий жест передан естественным русским выражением.
