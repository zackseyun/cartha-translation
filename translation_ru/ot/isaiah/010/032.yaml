- source_word: ע֥וֹד הַיּוֹם
  choice: Ещё в этот самый день
  rationale: Сочетание передаёт продолжающееся развитие событий и подчёркнутую непосредственность пророческой сцены.
- source_word: בְּנֹב לַעֲמֹד
  choice: остановится в Нобе
  rationale: На фоне наступления עמד естественно означает остановку в названном месте; топоним передан современной транслитерацией.
- source_word: יְנֹפֵף יָדוֹ
  choice: погрозит рукой
