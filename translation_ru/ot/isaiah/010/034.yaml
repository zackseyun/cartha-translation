  text: וְ/נִקַּ֛ף סִֽבְכֵ֥י הַ/יַּ֖עַר בַּ/בַּרְזֶ֑ל וְ/הַ/לְּבָנ֖וֹן בְּ/אַדִּ֥יר יִפּֽוֹל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/034.yaml
  text: And the thickets of the forest will be cut down with iron[a], and Lebanon will fall by a mighty one.
translation:
  language: ru
  text: И лесные чащи будут вырублены железом, и Ливан падёт от руки могучего[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от руки Могучего», если слово «могучий» понимать здесь как титул Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִקַּף
  choice: будут вырублены
  rationale: Форма нифаль передаёт пассивное действие. «Будут вырублены» естественно продолжает образ леса, который валят железным орудием.
- source_word: סִבְכֵי הַיַּעַר
  choice: лесные чащи
  rationale: סבך обозначает густые, переплетённые заросли или ветви. «Лесные чащи» сохраняет собирательный образ густого леса, не сужая значение до одних ветвей.
- source_word: בַּבַּרְזֶל
  choice: железом
  rationale: Буквально — «железом»; вероятно, имеется в виду железное орудие. Перевод сохраняет метонимию исходного текста и не уточняет, что это именно топор.
- source_word: וְהַלְּבָנוֹן
  choice: и Ливан
  rationale: Название сохранено без поясняющего добавления, чтобы передать как географический образ Ливана, так и ассоциацию с его величественными лесами.
- source_word: בְּאַדִּיר
  choice: от руки могучего
  rationale: אַדִּיר может обозначать могучего или величественного деятеля, а предлог ב — орудие или действующую силу. Оборот «от руки» делает агентное значение естественным по-русски, сохраняя неопределённость самого деятеля.
- source_word: יִפּוֹל
  choice: падёт
  rationale: Прямое значение נפל — «пасть». Оно сохраняет краткость и поэтическую параллель с вырубкой леса.
theological_decisions:
- issue: Следует ли понимать אַדִּיר как явный титул Бога
  choice: могучего
  alternative: Могучего
  rationale: Контекст суда указывает на Божье действие, однако в самой фразе нет имени Бога или однозначного грамматического признака титула. Строчная буква в основном тексте сохраняет смысловую напряжённость, а возможное понимание как Божьего титула отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным пророческим ритмом. Образы железа, лесной чащи и падения Ливана сохранены; возможная божественная отсылка не сделана однозначной в основном тексте.
