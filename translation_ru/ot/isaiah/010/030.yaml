  text: צַהֲלִ֥י קוֹלֵ֖/ךְ בַּת גַּלִּ֑ים הַקְשִׁ֥יבִי לַ֖יְשָׁה עֲנִיָּ֥ה עֲנָתֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/030.yaml
  text: Cry aloud[a], daughter of Gallim! Listen[c][b], Laishah! O poor Anathoth!
translation:
  language: ru
  text: Кричи во весь голос[a], дочь Галлима[b]! Прислушайся, Лаиша! О несчастный Анафоф[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Издай пронзительный крик». Еврейский глагол может обозначать громкий, звонкий или пронзительный возглас.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дочь Галлима» — олицетворённое обращение к городу или его жителям.'
    reason: cultural_note
  - marker: c
    text: 'Или: «бедный Анафоф», «угнетённый Анафоф». Еврейское слово может указывать на нищету, страдание или угнетённое положение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַהֲלִי קוֹלֵךְ
  choice: Кричи во весь голос
  rationale: Повелительная форма призывает издать громкий, звонкий или пронзительный крик; русское выражение передаёт силу голоса и тревожность контекста, не определяя звук точнее, чем еврейский текст.
- source_word: בַּת גַּלִּים
  choice: дочь Галлима
  rationale: Сохранено характерное для пророческой речи олицетворённое обращение к городу или его жителям.
- source_word: הַקְשִׁיבִי
  choice: Прислушайся
  rationale: Глагол означает внимательное слушание; «прислушайся» естественно передаёт прямой призыв обратить слух и внимание.
- source_word: לַיְשָׁה
  choice: Лаиша
  rationale: Название местности передано транслитерацией формы, засвидетельствованной в данном стихе.
- source_word: עֲנִיָּה
  choice: несчастный
  rationale: Прилагательное может обозначать бедность, бедствие, угнетённость или жалкое положение. В восклицательном обращении «несчастный» естественно выражает бедственное состояние города, не сводя значение к материальной нищете.
- source_word: עֲנָתוֹת
  choice: Анафоф
  rationale: Использована укоренившаяся русская библейская форма географического названия.
