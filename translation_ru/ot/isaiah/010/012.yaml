  source_fidelity: В целом синтаксис, локативное значение בְּ («на горе Сионе и в Иерусалиме») и последовательность действий переданы верно. Однако «Владыка» как передача אֲדֹנָי звучит менее обычно для русского библейского регистра; «Господь» — устойчивая и точная передача титула. Образ רוּם עֵינָיו следует выразить естественнее, не утрачивая связи с «глазами».
  naturalness: 'Фраза «великолепие его вознесённых глаз» неестественна в современном литературном русском: глаза обычно не называют «вознесёнными». «Великолепие его высокомерных глаз» сохраняет намеренно ироническое сочетание и образ глаз, но читается значительно лучше. «Я взыщу с царя» допустимо, но несколько архаично; «Я призову ... к ответу» ясно передаёт судебное значение פקד על.'
  terminology: «Господь» является естественным русским соответствием божественному титулу אֲדֹנָי в данном контексте. «Плод надменности его сердца» удачно сохраняет метафору פְּרִי и передаёт отрицательную окраску גֹדֶל לְבַב без излишнего толкования.
