source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יְבַצַּ֤ע אֲדֹנָ/י֙ אֶת כָּל מַֽעֲשֵׂ֔/הוּ בְּ/הַ֥ר צִיּ֖וֹן וּ/בִ/ירוּשָׁלִָ֑ם אֶפְקֹ֗ד עַל פְּרִי גֹ֨דֶל֙ לְבַ֣ב מֶֽלֶךְ אַשּׁ֔וּר וְ/עַל תִּפְאֶ֖רֶת ר֥וּם עֵינָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/012.yaml
  text: And it will happen that when the Lord has finished all his work on Mount Zion and in Jerusalem[a], I will punish the fruit of the greatness of the heart of the king of Assyria[c][b], and the splendor of his haughty eyes.
translation:
  language: ru
  text: 'И будет: когда Господь завершит всё Своё дело на горе Сионе и в Иерусалиме, Я призову к ответу[a] царя Ассирии за плод надменности его сердца[b] и за великолепие его высокомерных глаз[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взыщу»; еврейский глагол может обозначать Божье взыскание и суд.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «за плод величия сердца царя Ассирии».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «за великолепие высоты его глаз» — образ гордого, высокомерного взгляда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 'И будет: когда'
  rationale: Сохраняет пророческий переход к будущему событию и передаёт временную функцию כִּי в сочетании с וְהָיָה; формула звучит возвышенно, но остаётся понятной современному читателю.
- source_word: יְבַצַּע
  choice: завершит
  rationale: Порода пиэль здесь обозначает доведение действия до конца; «завершит» точно и естественно передаёт этот смысл.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт божественный титул אֲדֹנָי и отличает его от имени יהוה, традиционно переводимого как «Господь».
- source_word: כָּל מַעֲשֵׂהוּ
  choice: всё Своё дело
  rationale: Единственное число מַעֲשֶׂה имеет собирательный смысл и обозначает всю полноту совершаемого Богом действия.
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלָם
  choice: на горе Сионе и в Иерусалиме
  rationale: Предлог בְּ передан локативно, без внесения не выраженного прямо значения «против».
- source_word: אֶפְקֹד עַל
  choice: Я взыщу с царя Ассирии за
  rationale: В контексте суда פקד על означает привлечь к ответу или наказать. Русское «взыщу с… за…» сохраняет судебный оттенок и хорошо сочетается с объектами наказания.
- source_word: פְּרִי גֹדֶל לְבַב
  choice: плод надменности его сердца
  rationale: «Плод» сохраняет еврейскую метафору, а «надменность» естественно выражает отрицательный контекстуальный смысл буквального «величия сердца».
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Обычная русская передача еврейской сопряжённой конструкции.
- source_word: תִּפְאֶרֶת רוּם עֵינָיו
  choice: великолепие его вознесённых глаз
  rationale: Сохраняет необычное сочетание «великолепия» с образом высоко поднятых глаз, выражающим гордость, не сводя его полностью к толкованию.
theological_decisions:
- issue: Характер Божьего дела на Сионе и в Иерусалиме
  choice: 'Передать בְּ локативно: «на горе Сионе и в Иерусалиме»'
  alternative: «против горы Сиона и Иерусалима»
  rationale: Еврейский предлог сам по себе обозначает место действия. Такая передача не устраняет напряжение между судом и иными сторонами Божьего дела и не уточняет сверх сказанного, в чём именно оно состоит.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис сохраняет переход от завершения Божьего дела в Иерусалиме к суду над ассирийским царём; метафоры «плод» и «глаза» удержаны.
