  text: עָֽבְרוּ֙ מַעְבָּרָ֔ה גֶּ֖בַע מָל֣וֹן לָ֑/נוּ חָֽרְדָה֙ הָֽ/רָמָ֔ה גִּבְעַ֥ת שָׁא֖וּל נָֽסָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/029.yaml
  text: They have crossed over the pass[a]; Geba is our lodging place. Ramah trembles[b]; Gibeah of Saul has fled.
translation:
  language: ru
  text: Они прошли через перевал[a]; Гева — место нашего ночлега. Рама трепещет; Гива Саула бежала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через переход»; возможно также: «через переправу». Еврейское слово מַעְבָּרָה обозначает место перехода вообще; в описании военного маршрута здесь уместно слово «перевал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְרוּ
  choice: они прошли
  rationale: Форма qal перфекта, 3-е лицо множественного числа, сообщает о завершённом продвижении войска; русский совершенный вид естественно передаёт это значение.
- source_word: מַעְבָּרָה
  choice: перевал
  rationale: Существительное обозначает место перехода; в контексте военного маршрута «перевал» звучит естественно, хотя возможны более общие значения «переход» и «переправа».
- source_word: גֶּבַע
  choice: Гева
  rationale: Традиционная русская передача географического названия Geba, позволяющая отличить его от следующей Гивы.
- source_word: מָלוֹן לָנוּ
  choice: место нашего ночлега
  rationale: מָלוֹן — место остановки или ночлега, а לָנוּ буквально означает «для нас»; именная конструкция без добавленного глагола сохраняет краткость еврейской строки.
- source_word: חָרְדָה
  choice: трепещет
  rationale: Глагол חרד выражает дрожь от страха. Настоящее время по-русски передаёт живую поэтическую картину паники, не сводя значение лишь к внутреннему испугу.
- source_word: הָרָמָה
  choice: Рама
  rationale: Традиционная русская передача географического названия.
- source_word: גִּבְעַת שָׁאוּל
  choice: Гива Саула
  rationale: Еврейское сопряжённое сочетание называет город, связанный с Саулом; русский родительный падеж сохраняет эту связь без уточнения её характера.
- source_word: נָסָה
  choice: бежала
  rationale: Форма qal перфекта, 3-е лицо женского рода; город персонифицирован как охваченный бегством. Женский род согласуется с названием «Гива».
