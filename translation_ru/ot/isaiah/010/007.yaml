base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/007.yaml
  text: But he does not think so[a], and his heart does not reckon so; for it is in his heart to destroy[b], and to cut off not a few nations.
translation:
  language: ru
  text: Но он думает не так[a], и сердце его помышляет не так, ибо в сердце своём он замышляет уничтожить и истребить немало народов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «намеревается не так»; древнееврейский глагол может обозначать как представление, так и намерение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не мало народов» — литота со значением «много народов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַמֶּה
  choice: думает
  rationale: Порода piel здесь передаёт представление или намерение ассирийского царя. «Думает» естественно по-русски и сохраняет отличие его замысла от цели, обозначенной в контексте.
- source_word: לְבָבוֹ
  choice: сердце его
  rationale: Сохраняет древнееврейский образ сердца как средоточия мысли и воли, а не только чувств.
- source_word: יַחְשֹׁב
  choice: рассуждает
  rationale: Передаёт мыслительную деятельность и слегка различает два параллельных глагола, не превращая их в полные синонимы.
- source_word: כִּי
  choice: ':'
  rationale: Двоеточие естественно вводит по-русски пояснение того, что в действительности составляет внутренний замысел царя.
- source_word: לְהַשְׁמִיד
  choice: уничтожать
  rationale: Широко и точно передаёт каузативное значение глагола, не усиливая его до обязательного полного истребления.
- source_word: בִּלְבָבוֹ
  choice: у него на сердце
  rationale: Естественная русская идиома сохраняет образ внутреннего намерения и повтор ключевого слова «сердце».
- source_word: לְהַכְרִית
  choice: истребить
  rationale: В данном военном контексте передаёт устранение народов естественнее, чем буквальное «отсечь», сохраняя силу исходного глагола.
- source_word: גּוֹיִם
  choice: народов
  rationale: В контексте завоеваний обозначает этнополитические общности; русское «народы» здесь естественно и точно.
- source_word: לֹא מְעָט
  choice: немало
  rationale: Сохраняет литоту «не мало» в естественной современной русской форме и передаёт значение большого числа.
- source_word: וְהוּא
  choice: Но он
  rationale: Союз имеет контрастное значение по отношению к предыдущему стиху и противопоставляет намерение царя Божьему поручению.
theological_decisions:
- issue: Соотношение Божьего намерения и намерения Ассирии в контексте
  choice: 'Сохранить краткое противопоставление: «он думает не так», не поясняя прямо, что речь идёт о Божьем замысле.'
  alternative: «Но он не понимает Божьего замысла» или иная явно истолковывающая формулировка.
  rationale: Сам стих оставляет подразумеваемую точку сравнения в контексте предыдущего высказывания. Эксплицитное добавление разрешило бы намеренную контекстуальную и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Параллелизм сохранён, но синтаксис сделан естественным; образ сердца как средоточия мысли и воли удержан без конфессионально обусловленных пояснений.
