  text: כִּי ע֖וֹד מְעַ֣ט מִזְעָ֑ר וְ/כָ֣לָה זַ֔עַם וְ/אַפִּ֖/י עַל תַּבְלִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/025.yaml
  text: For in just a very little while[a], indignation will come to an end, and my anger will be for their destruction.
translation:
  language: ru
  text: Ведь ещё немного, совсем немного — и негодование прекратится, а Мой гнев — на их погибель[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на их уничтожение», «на их истребление» или «на их конец». Еврейское существительное встречается редко, и точный оттенок его значения неясен; контекст указывает на падение угнетателя или угнетателей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит обоснование и заверение, продолжая мысль предыдущего стиха; «ведь» естественно передаёт эту связь по-русски.
- source_word: עוֹד מְעַט מִזְעָר
  choice: ещё совсем немного
  rationale: Сочетание близких по значению слов подчёркивает крайнюю краткость оставшегося времени; формулировка сохраняет усиление и звучит естественно.
- source_word: וְכָלָה
  choice: прекратится
  rationale: Форма совершенного вида в пророческом контексте имеет будущее значение. Глагол передаёт окончание действия негодования.
- source_word: זַעַם
  choice: негодование
  rationale: Слово обозначает гневное осуждение; «негодование» сохраняет возвышенный регистр и не сливает его со следующим אַף — «гнев».
- source_word: וְאַפִּי
  choice: а Мой гнев
  rationale: Буквально «и Мой нос», но это устойчивое обозначение гнева. Противительный оттенок «а» ясно показывает переход от прекращающегося негодования к гневу, обращённому против угнетателей.
- source_word: עַל תַּבְלִיתָם
  choice: обернётся их погибелью
  rationale: Редкое существительное указывает на гибель или уничтожение, а суффикс третьего лица множественного числа сохранён словом «их». Такая формулировка естественно передаёт губительный исход гнева, не устраняя лексическую неопределённость, отмеченную в сноске.
theological_decisions:
- issue: К кому относится местоимение «их»
  choice: К врагам-угнетателям, в ближайшем контексте — к Ассирии
  alternative: 'Безличное понимание: «на уничтожение», без чётко названного объекта'
  rationale: Контекст говорит о прекращении гнева Господа на Его народ и о суде над Ассирией. При этом перевод сохраняет местоименный суффикс исходного текста и не подставляет имя Ассирии непосредственно в стих.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Тире передаёт краткую временную конструкцию и подчёркивает близость предсказанного события; прописная буква в «Мой» обозначает речь Господа.
