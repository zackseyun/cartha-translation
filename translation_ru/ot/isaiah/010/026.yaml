language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עוֹרֵ֨ר עָלָ֜י/ו יְהוָ֤ה צְבָאוֹת֙ שׁ֔וֹט כְּ/מַכַּ֥ת מִדְיָ֖ן בְּ/צ֣וּר עוֹרֵ֑ב וּ/מַטֵּ֨/הוּ֙ עַל הַ/יָּ֔ם וּ/נְשָׂא֖/וֹ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/026.yaml
  text: And Yahweh of hosts will stir up a whip against him[a], as at the striking down of Midian at the rock of Oreb; and his staff will be over the sea[c][b], and he will lift it as in the way of Egypt.
translation:
  language: ru
  text: И воздвигнет на него Яхве Воинств бич — как при поражении Мадиама у скалы Орива[a]; и жезл его будет над морем, и он поднимет его, как в Египте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Скала Орива напоминает о поражении Мадиама: у этой скалы был убит мадиамский князь Орив (Суд. 7:25).'
    reason: cross_reference
  - marker: b
    text: 'Буквально: «по пути Египта»; вероятно, это отсылка к тому, как при исходе был поднят жезл над морем.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹרֵר
  choice: и воздвигнет
  rationale: Порода hифиль выражает побуждение или приведение в действие; «воздвигнет… бич» естественно передаёт образ орудия суда.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняется личное имя Бога и устойчивый широкий смысл צְבָאוֹת — небесных и земных сил под Его властью.
- source_word: שׁוֹט
  choice: бич
  rationale: Конкретное орудие удара и наказания; в возвышенном русском регистре хорошо сохраняет метафору суда.
- source_word: כְּמַכַּת מִדְיָן
  choice: как при поражении Мадиама
  rationale: מַכָּה обозначает удар или поражение; формулировка сохраняет историческое сравнение, не привнося более узкого смысла массового истребления.
- source_word: בְּצוּר עוֹרֵב
  choice: у скалы Орива
  rationale: Естественно передаёт местное значение предлога и сохраняет отсылку к Суд 7:25; имя עוֹרֵב дано в принятой русской библейской форме «Орив».
- source_word: וּמַטֵּהוּ
  choice: и жезл Его
  rationale: מַטֶּה может означать посох, жезл или розгу. «Жезл» сохраняет отличие от бича и соответствует торжественному образу исхода; прописная буква отражает вероятное отнесение местоимения к Яхве, не устраняя неоднозначность самой конструкции.
- source_word: עַל הַיָּם
  choice: будет над морем
  rationale: Сохраняется пространственный образ жезла над морем без уточнения движения, которого нет в этой фразе.
- source_word: וּנְשָׂאוֹ
  choice: и Он поднимет его
  rationale: נשׂא здесь естественно означает поднять; местоименный суффикс отнесён к жезлу.
- source_word: בְּדֶרֶךְ מִצְרָיִם
  choice: как во дни Египта
  rationale: Буквальное «по пути Египта» в современном русском ошибочно звучало бы как обозначение дороги. Контекстуально выражение указывает на прежний образ действия Бога при исходе; «как во дни Египта» сохраняет аллюзивность и остаётся понятным.
theological_decisions:
- issue: К кому относятся местоименные суффиксы во второй половине стиха
  choice: «жезл Его… Он поднимет его» вероятнее относится к Яхве и Его действию над морем
  alternative: Жезл может быть жезлом Ассирии, обращённым против неё самой
  rationale: Упоминание моря и Египта особенно сильно вызывает образ исхода и поднятого по Божьему повелению жезла. Перевод не добавляет поясняющего субъекта сверх местоимений, хотя русская капитализация отмечает выбранное прочтение.
- issue: Исторические параллели суда и избавления
  choice: Сохранены совместные отсылки к поражению Мадиама и исходу через море
  alternative: Читать сравнения как общие образы военной победы без конкретных исторических аллюзий
  rationale: Скала Орива прямо связывает текст с Суд 7:25, а море и Египет — с исходом; обе памяти формируют обещание нового Божьего вмешательства.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. «Яхве Воинств», «бич» и «жезл» сохраняют достоинство и конкретность исходного текста; синтаксис слегка выровнен для ясности, а исторические аллюзии пояснены в сносках.
