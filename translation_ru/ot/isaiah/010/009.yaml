  text: Разве Кално не подобен Кархемишу? Разве Хамат не подобен Арпаду? Разве Самария не подобна Дамаску?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Кално» в некоторых переводах передаётся как «Калне» — это традиционный вариант формы данного топонима.
