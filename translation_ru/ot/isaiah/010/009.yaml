lexical_decisions:
- source_word: הֲלֹא ... אִם לֹא ... אִם לֹא
  choice: Разве ... не то же, что
  rationale: Отрицательные вопросительные обороты выражают риторические вопросы, предполагающие согласие. Формула «разве ... не то же, что» естественно передаёт и вопросительную силу, и хвастливое приравнивание покорённых городов.
- source_word: כְּ/כַרְכְּמִישׁ כַּלְנוֹ
  choice: Кално не то же, что Кархемиш
  rationale: Префикс כְּ обозначает сравнение. В русском естественно сначала назвать сопоставляемый город — Кално, — а затем эталон сравнения — Кархемиш.
- source_word: כַּלְנוֹ
  choice: Кално
  rationale: Транслитерация непосредственно отражает форму еврейского текста данного стиха; традиционная альтернативная форма указана в сноске.
- source_word: כַּרְכְּמִישׁ
  choice: Кархемиш
  rationale: Устоявшаяся русская передача данного топонима.
- source_word: כְ/אַרְפַּד חֲמָת
  choice: Хамат не то же, что Арпад
  rationale: Сравнительный כְ передан той же конструкцией, чтобы сохранить поэтический параллелизм трёх риторических вопросов.
- source_word: חֲמָת
  choice: Хамат
  rationale: Распространённая современная русская транслитерация топонима.
- source_word: אַרְפַּד
  choice: Арпад
  rationale: Устоявшаяся русская передача топонима.
- source_word: כְ/דַמֶּשֶׂק שֹׁמְרוֹן
  choice: Самария не то же, что Дамаск
  rationale: Русский порядок слов ставит Самарию как предмет сравнения перед Дамаском, сохраняя смысл еврейской сравнительной конструкции.
- source_word: דַּמֶּשֶׂק
  choice: Дамаск
  rationale: Устоявшееся русское название города.
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Устоявшееся русское название города; в контексте оно может также подразумевать столицу Северного царства как его представительницу.
