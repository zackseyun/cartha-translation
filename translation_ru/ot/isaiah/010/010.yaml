  yaml_path: translation/ot/isaiah/010/010.yaml
  text: As my hand has reached the kingdoms of the idols[a], whose carved images were greater than those of Jerusalem and Samaria,
translation:
  language: ru
  text: Как рука моя достигла царств идолов[a], изваяния которых превосходили изваяния Иерусалима и Самарии,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Как рука моя нашла царства идолов, и их изваяния — от Иерусалима и от Самарии». Еврейская фраза эллиптична; в контексте подразумевается сравнение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Как
  rationale: Вводит сопоставление, продолжающееся в следующем стихе; краткое «как» естественно передаёт эту связь.
- source_word: מָצְאָה יָדִי
  choice: рука моя достигла
  rationale: Буквально сказано «моя рука нашла», но в контексте завоеваний выражение означает, что власть царя распространилась на эти царства. Перевод сохраняет образ руки, не уточняя сверх текста способ покорения.
- source_word: לְמַמְלְכֹת הָאֱלִיל
  choice: царств идолов
  rationale: Предлог определяется глагольным оборотом, а אֱלִיל обозначает идола, нередко с оттенком ничтожности; «идолы» ясно и прямо передаёт смысл без дополнительного толкования.
- source_word: וּפְסִילֵיהֶם
  choice: чьи изваяния
  rationale: פְסִילִים — высеченные или резные культовые изображения. «Чьи» естественно выражает принадлежность изваяний упомянутым царствам.
- source_word: מִירוּשָׁלִַם וּמִשֹּׁמְרוֹן
  choice: чем изваяния Иерусалима и Самарии
  rationale: Предлог מִן здесь имеет сравнительное значение. Повтор слова «изваяния» делает эллиптическое сопоставление понятным по-русски.
theological_decisions:
- issue: Следует ли раскрывать подразумеваемое сравнение в заключительной части стиха
  choice: 'Передать сравнительный смысл: «чьи изваяния были величественнее, чем изваяния Иерусалима и Самарии»'
  alternative: 'Передать буквально: «и их изваяния — от Иерусалима и от Самарии»'
  rationale: Еврейская фраза эллиптична, однако контекст хвастовства ассирийского царя и продолжение мысли в следующем стихе указывают на сравнение. Раскрытие сравнения передаёт вероятный смысл, а сноска сохраняет буквальную форму и присущую ей неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранён образ руки завоевателя и незавершённость синтаксиса, поскольку мысль продолжается в следующем стихе.
