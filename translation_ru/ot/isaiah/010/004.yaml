  source_fidelity: 'Основной текст верно передаёт наиболее связное понимание чрезвычайно сжатой еврейской конструкции: остаются лишь участь пленников либо гибель среди убитых. Рефрен «При всём этом ... рука Его всё ещё простёрта» точно сохраняет образность и смысл בְּכָל־זֹאת לֹא שָׁב אַפּוֹ וְעוֹד יָדוֹ נְטוּיָה. Однако «согнуться» несколько ослабляет значение כָּרַע («пригнуться/склониться, пасть на колени») и звучит менее естественно с «среди пленников».'
