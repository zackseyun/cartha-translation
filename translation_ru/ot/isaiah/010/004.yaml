  text: בִּלְתִּ֤י כָרַע֙ תַּ֣חַת אַסִּ֔יר וְ/תַ֥חַת הֲרוּגִ֖ים יִפֹּ֑לוּ בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/004.yaml
  text: Nothing remains but to crouch among the prisoners or to fall among the slain. For all this his anger has not turned away[a], and his hand is still stretched out.
translation:
  language: ru
  text: Остаётся лишь склониться среди пленников или пасть среди убитых.[a] При всём этом гнев Его не отвратился, и рука Его всё ещё простёрта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «разве что склониться под пленниками и пасть под убитыми». Еврейская фраза предельно сжата, и связь глаголов с предлогами толкуется по-разному.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְתִּי
  choice: Только и остаётся, что
  rationale: В предельно сжатой фразе слово указывает на единственно оставшийся исход. Русская конструкция естественно передаёт неизбежность, не восполняя эллипсис лишними деталями.
- source_word: כָרַע
  choice: согнуться
  rationale: Глагол означает склониться, согнуться, опуститься на колени. Здесь «согнуться» передаёт вынужденное унижение и не создаёт ненужной культовой ассоциации.
- source_word: תַּחַת
  choice: среди
  rationale: Буквально предлог может означать «под», но в данном контексте естественно выражает причисление к пленникам и убитым. Буквальная возможность сохранена в примечании.
- source_word: אַסִּיר
  choice: пленников
  rationale: Существительное обозначает связанного человека, пленника или узника; множественное число по-русски ясно передаёт собирательный смысл контекста.
- source_word: הֲרוּגִים
  choice: убитых
  rationale: Причастие указывает именно на тех, кто был насильственно убит, а не просто на умерших.
- source_word: יִפֹּלוּ
  choice: пасть
  rationale: Хотя еврейская форма личная — «они падут», в основном тексте инфинитив образует естественный параллелизм с «согнуться». Грамматически более буквальный вариант отмечен в сноске.
- source_word: בְּכָל זֹאת
  choice: При всём этом
  rationale: Формула сохраняет риторический рефрен Исайи и указывает, что уже совершившееся наказание ещё не исчерпало гнева.
- source_word: לֹא שָׁב אַפּוֹ
  choice: Его гнев не отвратился
  rationale: אַף здесь идиоматически означает гнев, а שׁוּב — его отвращение или прекращение. Выбор сохраняет образное выражение оригинала.
- source_word: יָדוֹ נְטוּיָה
  choice: рука Его всё ещё простёрта
  rationale: Сохранён повторяющийся у Исайи антропоморфный образ продолжающегося действия суда.
theological_decisions:
- issue: Антропоморфный язык Божьего суда
  choice: Сохранить выражения «Его гнев» и «рука Его всё ещё простёрта».
  alternative: 'Передать отвлечённо: «Его суд продолжается».'
  rationale: Оригинал намеренно использует телесный образ для выражения продолжающегося Божьего суда; перевод не должен сглаживать его до абстракции.
- issue: Связь сжатых частей первого предложения
  choice: 'Понять их как два единственно оставшихся исхода: оказаться среди пленников или среди убитых.'
  alternative: «Разве что склониться под пленником, и они падут под убитыми».
  rationale: Основной вариант даёт наиболее связное чтение в контексте неизбежного суда, но высокая сжатость еврейского текста не позволяет исключить более буквальный синтаксический разбор, поэтому он вынесен в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской ритмикой. Сохранены краткость рефрена, антропоморфный образ и подлинная синтаксическая неоднозначность; архаизмы сведены к уместному «простёрта».
