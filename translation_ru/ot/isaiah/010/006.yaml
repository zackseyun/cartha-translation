  text: בְּ/ג֤וֹי חָנֵף֙ אֲשַׁלְּחֶ֔/נּוּ וְ/עַל עַ֥ם עֶבְרָתִ֖/י אֲצַוֶּ֑/נּוּ לִ/שְׁלֹ֤ל שָׁלָל֙ וְ/לָ/בֹ֣ז בַּ֔ז ו/ל/שימ/ו מִרְמָ֖ס כְּ/חֹ֥מֶר חוּצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/006.yaml
  text: Against a godless nation I send him[a], and against the people of my wrath I command him, to seize spoil and to carry off plunder[c][b], and to make it a trampling place like the mud of the streets.
translation:
  language: ru
  text: 'Против нечестивого народа Я посылаю его[a] и против народа, на который обращён Мой гнев, повелеваю ему: захватывать добычу и уносить награбленное[b], и отдать его[c] на попрание, как грязь на улицах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ безбожный». Еврейское слово может обозначать нечестие, безбожие или осквернение святыни.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «захватывать добычу и грабить добычу» — две однокоренные конструкции, усиливающие картину разграбления.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сделать его предметом попрания». Местоименный суффикс мужского рода относится к народу как к единому целому.'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹי חָנֵף
  choice: народ нечестивый
  rationale: «Нечестивый» передаёт религиозно-нравственный смысл חָנֵף, а «народ» естественно обозначает коллективное политическое целое.
- source_word: אֲשַׁלְּחֶנּוּ
  choice: Я посылаю его
  rationale: Настоящее время сохраняет живость пророческой речи; мужское единственное число указывает на орудие суда — ассирийского властителя или олицетворённую Ассирию.
- source_word: עַם עֶבְרָתִי
  choice: народ, на который изливается Мой гнев
  rationale: Передаёт объективное значение сочетания — народ является предметом Божьего гнева, — сохраняя прямую речь Бога и образ сильного гнева.
- source_word: אֲצַוֶּנּוּ
  choice: даю ему повеление
  rationale: Естественно по-русски выражает значение צוה и подчёркивает, что действующий завоеватель исполняет Божье поручение.
- source_word: לִשְׁלֹל שָׁלָל וְלָבֹז בַּז
  choice: захватывать добычу и уносить награбленное
  rationale: Две параллельные конструкции с однокоренными глаголами и существительными переданы двумя близкими действиями без неестественной русской тавтологии.
- source_word: וּלְשִׂימוֹ מִרְמָס
  choice: попирать его
  rationale: Передаёт результат превращения народа в объект попрания; местоимение мужского рода сохраняет коллективный референт עַם и неоднозначность суффикса.
- source_word: כְּחֹמֶר חוּצוֹת
  choice: как уличную грязь
  rationale: חֹמֶר в данном образе означает размокшую землю, грязь; краткое выражение естественно и наглядно по-русски.
theological_decisions:
- issue: К кому относится местоимение «его» при глаголах посылания и повеления
  choice: 'Сохранено мужское единственное число: «его», «ему»'
  alternative: Назвать прямо ассирийского царя или Ассирию
  rationale: Контекст Ис 10:5 указывает на Ассирию как орудие суда, но сам стих оставляет референт в местоименной форме; перевод не устраняет эту корпоративно-личную неоднозначность.
- issue: Характер Божьего гнева
  choice: Сохранена прямая формулировка «Мой гнев»
  alternative: Смягчить до «народ, на который Я разгневан»
  rationale: עֶבְרָתִי прямо называет Божий гнев в контексте суда; его богословскую напряжённость не следует ослаблять.
- issue: Референт суффикса в וּלְשִׂימוֹ
  choice: «попирать его» — народ как коллектив
  alternative: «превратить его в место попрания» или отнести местоимение к иному ближайшему референту
  rationale: Мужской суффикс естественно соотносится с עַם; формулировка сохраняет народ как объект попрания, не превращая существительное действия в строго локативное понятие.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; сохранены параллелизм, прямая речь Бога, образ суда и местоименная неоднозначность исходного текста.
