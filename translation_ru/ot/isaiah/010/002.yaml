  text: לְ/הַטּ֤וֹת מִ/דִּין֙ דַּלִּ֔ים וְ/לִ/גְזֹ֕ל מִשְׁפַּ֖ט עֲנִיֵּ֣י עַמִּ֑/י לִ/הְי֤וֹת אַלְמָנוֹת֙ שְׁלָלָ֔/ם וְ/אֶת יְתוֹמִ֖ים יָבֹֽזּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/002.yaml
  text: to turn aside the poor from justice[a], and to rob the afflicted of my people of their right, so that widows may become their spoil[b], and they may plunder the fatherless.
translation:
  language: ru
  text: чтобы лишать бедняков[a] правосудия и отнимать у угнетённых Моего народа законное право, превращать вдов в свою добычу и грабить сирот[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать бедных, слабых или неимущих.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «лишённых отца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת מִדִּין
  choice: отстранять ... от правосудия
  rationale: Глагол נטה в породе hифиль передаёт намеренное отклонение или устранение от судебной защиты. «Отстранять от правосудия» сохраняет образ лишения доступа к справедливому суду и естественно звучит по-русски.
- source_word: דַּלִּים
  choice: бедняков
  rationale: דַּל обозначает бедного, слабого или социально незащищённого человека. В данном обличении «бедняков» прямо передаёт основной социальный смысл, а более широкий оттенок отмечен в сноске.
- source_word: וְלִגְזֹל מִשְׁפַּט
  choice: и отнимать законное право
  rationale: גזל означает насильственно или несправедливо отнимать, а מִשְׁפָּט здесь указывает на полагающееся человеку право или справедливое судебное решение. Такое сочетание ясно передаёт юридический характер притеснения.
- source_word: עֲנִיֵּי עַמִּי
  choice: у угнетённых Моего народа
  rationale: עָנִי может обозначать бедного, страдающего или притесняемого. «Угнетённых» сохраняет акцент на переживаемой несправедливости, не сводя выражение только к материальной бедности; суффикс первого лица передан как «Моего».
- source_word: לִהְיוֹת אַלְמָנוֹת שְׁלָלָם
  choice: чтобы вдовы становились их добычей
  rationale: Инфинитив לִהְיוֹת допускает оттенок цели или результата. Оборот с «чтобы» сохраняет эту смысловую открытость, а «добыча» передаёт хищнический образ שָׁלָל.
- source_word: יְתוֹמִים
  choice: сирот
  rationale: יָתוֹם в древнееврейском социальном контексте прежде всего обозначает ребёнка, лишённого отца. «Сироты» — естественное современное русское обозначение этой уязвимой группы; буквальная точность пояснена в сноске.
- source_word: יָבֹזּוּ
  choice: они грабили
  rationale: בזז означает грабить, расхищать или брать как добычу. «Грабили» естественно продолжает образ хищнической эксплуатации и не повторяет существительное «добыча».
theological_decisions:
- issue: Конкретные категории социально уязвимых людей
  choice: Сохранены «вдовы» и «сироты».
  alternative: Обобщающее «беззащитные» или «уязвимые».
  rationale: Еврейский текст называет конкретные группы, особо подверженные судебному и имущественному притеснению. Их сохранение поддерживает конкретность пророческого обвинения.
- issue: Суффикс первого лица в עַמִּי
  choice: «Моего народа»
  alternative: «его народа» или просто «народа»
  rationale: Форма עַמִּי недвусмысленно означает «Мой народ» и сохраняет речь от первого лица; замена на третье лицо устранила бы перспективу говорящего.
- issue: Цель или результат в конструкции לִהְיוֹת
  choice: «чтобы ... становились»
  alternative: «так что ... становятся»
  rationale: Инфинитивная конструкция может выражать как замысел притеснителей, так и результат их действий. Русское «чтобы» в данном контексте допускает целевой оттенок и не исключает фактического результата.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Строка начинается со строчной буквы, поскольку синтаксически продолжает Ис 10:1. Юридическая лексика передана ясно, а образы добычи и грабежа сохранены.
