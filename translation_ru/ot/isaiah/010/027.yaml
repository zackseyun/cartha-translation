  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יָס֤וּר סֻבֳּל/וֹ֙ מֵ/עַ֣ל שִׁכְמֶ֔/ךָ וְ/עֻלּ֖/וֹ מֵ/עַ֣ל צַוָּארֶ֑/ךָ וְ/חֻבַּ֥ל עֹ֖ל מִ/פְּנֵי שָֽׁמֶן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/027.yaml
  text: And in that day his burden will depart from your shoulder[a], and his yoke from your neck; and the yoke will be broken because of fatness.
translation:
  language: ru
  text: 'И будет в тот день: его бремя снимется с твоего плеча, и его ярмо — с твоей шеи; ярмо будет сокрушено из-за тучности[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за масла»; по традиции также переводят: «из-за помазания».'
    reason: Альтернативные понимания неоднозначного еврейского выражения מִפְּנֵי שָׁמֶן.
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохранена пророческая временная формула и будущая направленность; оборот звучит возвышенно, но остаётся понятным современному читателю.
- source_word: יָסוּר סֻבֳּלוֹ
  choice: его бремя снимется
  rationale: Глагол יָסוּר обозначает удаление или устранение; возвратная форма естественно передаёт непереходную конструкцию, где подлежащее — «бремя».
- source_word: מֵעַל שִׁכְמֶךָ
  choice: с твоего плеча
  rationale: Передаёт телесный образ и единственное число оригинала без неестественного для русского нагромождения предлогов.
- source_word: וְעֻלּוֹ
  choice: и его ярмо
  rationale: Сохранена сельскохозяйственная метафора угнетения; местоименный суффикс указывает на ярмо угнетателя.
- source_word: מֵעַל צַוָּארֶךָ
  choice: с твоей шеи
  rationale: Естественно передаёт параллельный телесный образ оригинала.
- source_word: וְחֻבַּל עֹל
  choice: ярмо будет сокрушено
  rationale: Пассивный глагол выражает разрушение ярма до непригодности; «сокрушено» сохраняет конкретность образа и достоинство пророческой речи.
- source_word: מִפְּנֵי שָׁמֶן
  choice: из-за тучности
  rationale: Сохранены причинная связь и буквальный образ трудноистолкуемой фразы; перевод не подменяет неоднозначное שָׁמֶן богословски нагруженным «помазанием».
theological_decisions:
- issue: Толкование מִפְּנֵי שָׁמֶן
  choice: из-за тучности
  alternative: из-за масла; из-за помазания
  rationale: שָׁמֶן может обозначать тучность или масло, а вся фраза остаётся трудной. Основной текст сохраняет наиболее буквальный причинный образ, тогда как традиционное «из-за помазания» вынесено в примечание, чтобы не вносить в текст прямо не названное помазание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Параллелизм «с твоего плеча — с твоей шеи» сохранён; эллипсис во второй части делает фразу естественной. Необычность заключительного образа намеренно не устранена.
