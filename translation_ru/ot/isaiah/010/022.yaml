  text: כִּ֣י אִם יִהְיֶ֞ה עַמְּ/ךָ֤ יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם שְׁאָ֖ר יָשׁ֣וּב בּ֑/וֹ כִּלָּי֥וֹן חָר֖וּץ שׁוֹטֵ֥ף צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/022.yaml
  text: For though your people[a], Israel, are like the sand of the sea, only a remnant of them will return. A destruction is decreed[b], overflowing with righteousness.
translation:
  language: ru
  text: Ибо хотя твой народ, Израиль, будет многочислен, как морской песок, возвратится лишь остаток его[a]. Предрешённое истребление хлынет потоком праведности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остаток в нём возвратится»; еврейское местоимение стоит в единственном числе и относится к народу как к единому целому.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Предрешённое истребление хлынет потоком справедливости».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Ибо хотя
  rationale: 'Сочетание имеет здесь уступительный смысл: вопреки огромной численности Израиля возвратится лишь остаток. «Ибо» также сохраняет связь с предшествующим рассуждением.'
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: твой народ, Израиль
  rationale: Сохранены обращение во втором лице и пояснительное наименование народа.
- source_word: כְּחוֹל הַיָּם
  choice: многочислен, как морской песок
  rationale: Добавление «многочислен» естественно выражает подразумеваемый смысл сравнения в современном русском, не устраняя исходный образ морского песка.
- source_word: שְׁאָר
  choice: остаток
  rationale: Передаёт уцелевшую часть народа; ограничительное значение выражено словом «лишь».
- source_word: יָשׁוּב
  choice: возвратится
  rationale: Сохраняет широкий смысл глагола «вернуться, обратиться», не сводя его однозначно ни к покаянию, ни к возвращению из конкретного изгнания.
- source_word: בּוֹ
  choice: его
  rationale: Местоимение единственного числа отнесено к собирательному существительному «народ» и передано как указание на остаток этого народа.
- source_word: כִּלָּיוֹן
  choice: истребление
  rationale: Передаёт уничтожение или опустошение, но не утверждает полного исчезновения народа, поскольку одновременно говорится об остатке.
- source_word: חָרוּץ
  choice: предрешено
  rationale: Выражает твёрдо принятое, непреложное решение и сохраняет судебно-пророческий оттенок.
- source_word: שׁוֹטֵף
  choice: изливающееся
  rationale: Сохраняет образ потока или разлива, связанный с причастием.
- source_word: צְדָקָה
  choice: праведностью
  rationale: Передаёт нравственную правоту совершающегося суда; возможное значение «справедливостью» указано в сноске.
theological_decisions:
- issue: Смысл возвращения остатка
  choice: «возвратится» без дальнейшего уточнения
  alternative: «обратится» в смысле покаяния или «вернётся» из конкретного изгнания
  rationale: Глагол допускает физическое и духовное прочтение и перекликается с темой остатка у Исаии; нейтральная формулировка сохраняет эту богословскую многозначность.
- issue: Значение צְדָקָה в заключительной фразе
  choice: «праведностью»
  alternative: «справедливостью»
  rationale: Оба значения лексически возможны. Основной вариант подчёркивает правоту Божьего суда, а альтернативный судебный оттенок сохранён в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены образы морского песка и разливающегося потока; синтаксис слегка выправлен ради естественности и ясности.
