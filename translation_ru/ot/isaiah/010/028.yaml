  text: He has come against Aiath; he has passed through Migron. At Michmash he stores his baggage.
translation:
  language: ru
  text: Он идёт на Аиаф, проходит через Мигрон; в Михмасе оставляет свой обоз.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא עַל־עַיַּת
  choice: подошёл к Аиафу
  rationale: В контексте перечисления этапов продвижения בוא על естественно передаёт прибытие к месту; предлог עַל сам по себе не требует значения «против», хотя враждебный характер похода ясен из контекста.
- source_word: עָבַר בְּמִגְרוֹן
  choice: прошёл через Мигрон
  rationale: Глагол עבר обозначает прохождение, а בְּ при географическом названии здесь естественно передаётся как «через».
- source_word: יַפְקִיד כֵּלָיו
  choice: оставил свой обоз
  rationale: В повествовательной последовательности имперфект понимается как описывающий очередное действие. הפקיד значит «поручить, оставить на хранение», а כֵּלָיו — буквально «его вещи/снаряжение»; в военном контексте естественное собирательное соответствие — «обоз».
