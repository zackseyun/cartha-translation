base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/005.yaml
  text: Woe to Assyria[a], the rod of my anger[b]; the staff in their hand is my wrath.
translation:
  language: ru
  text: Горе Ассирии — жезлу Моего гнева! Посох в их руке[a] — Моё негодование.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по масоретскому тексту: «в их руке». В некоторых переводах местоимение передают в единственном числе — «в её руке» или «в его руке», — чтобы согласовать его с образом Ассирии или жезла; однако в древнееврейском тексте стоит форма множественного числа.'
    reason: textual_variant
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Пророческое междометие выражает угрозу и возвещает суд; «горе» сохраняет его краткость и силу.
- source_word: אַשּׁוּר
  choice: Ассирии
  rationale: В данном контексте название относится к державе, которую Бог использует как орудие суда; дательный падеж естественен после «горе».
- source_word: שֵׁבֶט
  choice: жезлу
  rationale: Слово обозначает палку или жезл для нанесения ударов; здесь оно метафорически представляет Ассирию как орудие Божьего гнева. «Жезл» лучше сохраняет возвышенную поэтическую образность, чем разговорная «палка».
- source_word: אַפִּי
  choice: Моего гнева
  rationale: Буквально слово связано с «носом», но в устойчивом древнееврейском употреблении означает гнев.
- source_word: וּמַטֶּה
  choice: Посох
  rationale: Сохраняется параллельный образ второго орудия; союз передан разделением поэтических строк, естественным для русского синтаксиса.
- source_word: הוּא
  choice: —
  rationale: Местоименная связка передана тире как естественной русской нулевой связкой в настоящем времени.
- source_word: בְיָדָם
  choice: в их руке
  rationale: Сохранены единственное число существительного «рука» и множественное число притяжательного суффикса в масоретском тексте. Такое сочетание допустимо по-русски и не устраняет необычность исходной формулировки.
- source_word: זַעְמִי
  choice: Моё негодование
  rationale: Сильное обозначение Божьего гнева; «негодование» отличает его от אַף в первой строке и сохраняет поэтическое усиление.
theological_decisions:
- issue: Божественное действие и Ассирия как орудие суда
  choice: Ассирия прямо представлена как жезл Божьего гнева, а посох — как Его негодование.
  alternative: Представить Ассирию лишь независимым или случайным участником суда.
  rationale: Метафоры исходного текста подчёркивают Божье действие через языческую державу; перевод сохраняет это напряжение, не добавляя богословского объяснения.
- issue: Необычное множественное местоимение в בְיָדָם
  choice: Сохранить «в их руке» в основном тексте.
  alternative: Сгладить как «в её руке» либо «в его руке», относя местоимение к Ассирии или жезлу.
  rationale: Масоретский текст имеет суффикс третьего лица мужского рода множественного числа; его не следует молча заменять единственным числом.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Заглавные буквы в притяжательных местоимениях, относящихся к Богу, соответствуют принятой русской библейской традиции. Тире передают именные связки и подчёркивают параллелизм двух строк.
