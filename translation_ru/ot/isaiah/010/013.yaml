source:
  edition: WLC
  text: כִּ֣י אָמַ֗ר בְּ/כֹ֤חַ יָדִ/י֙ עָשִׂ֔יתִי וּ/בְ/חָכְמָתִ֖/י כִּ֣י נְבֻנ֑וֹתִי וְ/אָסִ֣יר גְּבוּלֹ֣ת עַמִּ֗ים ו/עתידתי/הם שׁוֹשֵׂ֔תִי וְ/אוֹרִ֥יד כַּ/אבִּ֖יר יוֹשְׁבִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/013.yaml
  text: For he says[a], “By the strength of my hand I have done it, and by my wisdom, for I have understanding. I remove the boundaries of peoples, and I plunder their treasures[c][b]; like a mighty man I bring down those who sit enthroned.”
translation:
  language: ru
  text: 'Ибо он говорит:

    «Силой своей руки я это совершил

    и своей мудростью, ведь я разумен.

    Я стираю границы народов,

    расхищаю их накопленные богатства[a]

    и, словно могучий[b], низвергаю восседающих[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их запасы», «их сокровища» или «их имущество». Редкое еврейское слово, вероятно, обозначает богатство, заранее накопленное или отложенное про запас.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как сильный». Слово может обозначать могучего, сильного; иногда его связывают и с образом сильного животного.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «жителей». Еврейское причастие может означать живущих где-либо, но в данном контексте, возможно, подразумевает тех, кто восседает у власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָמַר
  choice: Ибо он говорит
  rationale: כִּי связывает хвастливую речь с предшествующей оценкой Ассирии, а перфект אָמַר здесь естественно передаётся настоящим временем как характерное, вновь звучащее заявление.
- source_word: בְּכֹחַ יָדִי
  choice: Силой своей руки
  rationale: Сохранён конкретный древнееврейский образ руки как орудия и выражения военной силы.
- source_word: עָשִׂיתִי
  choice: я это совершил
  rationale: Глагол имеет широкое значение «сделал, совершил»; местоимение «это» естественно восполняет подразумеваемый объект из контекста.
- source_word: וּבְחָכְמָתִי כִּי נְבֻנוֹתִי
  choice: и своей мудростью, ведь я разумен
  rationale: Сохраняются самовосхваление говорящего и смысловая связь между «мудростью» и способностью понимать и различать.
- source_word: וְאָסִיר גְּבוּלֹת עַמִּים
  choice: Я стираю границы народов
  rationale: הסיר означает устранить или убрать; «стираю границы» естественно выражает уничтожение установленных рубежей, не превращая עַמִּים в современные государства.
- source_word: וַעֲתִידֹתֵיהֶם
  choice: их накопленные богатства
  rationale: Редкое слово, вероятно, обозначает приготовленное или отложенное про запас имущество; перевод передаёт этот оттенок, не сводя значение только к драгоценностям.
- source_word: שׁוֹשֵׂתִי
  choice: расхищаю
  rationale: Глагол обозначает захват добычи и разграбление; настоящее время согласуется с живым изложением типичного хвастовства завоевателя.
- source_word: וְאוֹרִיד
  choice: низвергаю
  rationale: Каузатив от ירד значит «заставить сойти, низвести»; «низвергаю» передаёт как движение вниз, так и унижение сильных мира.
- source_word: כַּאבִּיר
  choice: словно могучий
  rationale: אַבִּיר может обозначать могучего или сильного; субстантивированная форма сохраняет неопределённость образа и не добавляет отсутствующее в тексте слово «воин».
- source_word: יוֹשְׁבִים
  choice: восседающих
  rationale: Причастие от ישב буквально относится к сидящим или живущим; в сочетании с «низвергать» форма «восседающих» допускает контекстуальный намёк на тех, кто занимает высокое положение, не вводя прямо слово «престол».
theological_decisions:
- issue: Кто произносит хвастливые слова
  choice: 'Сохранено единственное число: «он говорит»'
  alternative: Передать Ассирию как коллективного говорящего
  rationale: Ближайший контекст называет царя Ассирии, одновременно представляющего державу; единственное число следует еврейскому тексту и не требует искусственно выбирать между личным и собирательным пониманием.
- issue: Статус «восседающих»
  choice: Не уточнять прямо, что это цари или сидящие на престолах
  alternative: «низвергаю сидящих на престолах» или «низвергаю жителей»
  rationale: יוֹשְׁבִים само по себе может означать как сидящих, так и жителей. Контекст допускает правителей, но явного слова «престол» в стихе нет, поэтому неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим ритмом. Параллелизм хвастливой речи сохранён строковым оформлением; архаизмы сведены к понятным словам «низвергаю» и «восседающих», уместным для возвышенного пророческого контекста.
