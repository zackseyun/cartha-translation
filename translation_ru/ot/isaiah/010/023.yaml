  text: כִּ֥י כָלָ֖ה וְ/נֶחֱרָצָ֑ה אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת עֹשֶׂ֖ה בְּ/קֶ֥רֶב כָּל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/023.yaml
  text: For the Lord Yahweh of hosts is carrying out a complete destruction[a], one that has been decreed, in the midst of all the earth.
translation:
  language: ru
  text: Ибо Владыка Яхве Саваоф совершает среди всей земли полное и предрешённое истребление.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди всей страны». Еврейское אֶרֶץ может означать как «землю», так и «страну» — в зависимости от контекста.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт причинно-пояснительную связь с предыдущим утверждением и сохраняет возвышенный, но понятный регистр.
- source_word: כָלָה
  choice: истребление
  rationale: В контексте суда обозначает доведение до конца, уничтожение; «истребление» естественно передаёт итоговый и губительный характер действия.
- source_word: וְנֶחֱרָצָה
  choice: предрешённое
  rationale: Форма от חרץ означает нечто решённое или определённое. Причастное согласование с «истреблением» кратко и естественно сохраняет эту характеристику.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יהוה, избегая неестественного сочетания «Господь Господь».
- source_word: צְבָאוֹת
  choice: Саваоф
  rationale: Устоявшаяся в русском библейском языке передача титула, сохраняющая его широкое значение, не сводя его лишь к человеческим войскам.
- source_word: עֹשֶׂה
  choice: совершает
  rationale: Причастие изображает действие как осуществляемое или неизбежно наступающее; настоящее время сохраняет эту непосредственность.
- source_word: בְּקֶרֶב
  choice: посреди
  rationale: Сохраняет пространственный смысл выражения — действие происходит внутри обозначенной области.
- source_word: כָּל הָאָרֶץ
  choice: всей земли
  rationale: אֶרֶץ допускает значения «земля» в широком смысле и «страна»; основной текст сохраняет более широкий естественный смысл, а локальный вариант указан в сноске.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, прямо сохраняя имя Яхве без конфессионального истолкования.
- issue: Масштаб значения הָאָרֶץ
  choice: всей земли
  alternative: всей страны
  rationale: Еврейское слово может обозначать как землю вообще, так и конкретную страну. Более широкое прочтение оставлено в тексте, а контекстуально возможное узкое — в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис краткий и торжественный; неоднозначность אֶרֶץ сохранена посредством сноски.
