source:
  edition: WLC
  text: לָ֠/כֵן יְשַׁלַּ֨ח הָ/אָד֜וֹן יְהוָ֧ה צְבָא֛וֹת בְּ/מִשְׁמַנָּ֖י/ו רָז֑וֹן וְ/תַ֧חַת כְּבֹד֛/וֹ יֵקַ֥ד יְקֹ֖ד כִּ/יק֥וֹד אֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/016.yaml
  text: Therefore the Lord[a], Yahweh of Armies, will send wasting sickness among his stout warriors[c][b], and under his glory a burning will be kindled like the burning of fire.
translation:
  language: ru
  text: Поэтому Владыка, Яхве Воинств, пошлёт истощение среди его тучных[a], и под его славой запылает пламя, словно пламя огня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «среди его тучных». Так названы сильные, благополучные или влиятельные люди; в данном контексте это может относиться к могущественной верхушке Ассирии, в том числе к её воинам.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вместо его славы запылает пламя». Слово, переведённое как «под», может также указывать на замену; «слава» здесь может означать великолепие или пышность.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Естественно передаёт вывод и следствие, вводимые еврейской частицей.
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: Владыка, Яхве Воинств
  rationale: Различает титул הָאָדוֹן и личное имя יְהוָה; «Воинств» сохраняет широкий смысл צְבָאוֹת и привычную возвышенную библейскую формулу.
- source_word: יְשַׁלַּח
  choice: пошлёт
  rationale: Прямо и естественно передаёт действие ниспослания суда.
- source_word: בְּמִשְׁמַנָּיו
  choice: на его тучных
  rationale: Сохраняет намеренный образ полноты как силы, достатка и влиятельной верхушки, не добавляя отсутствующего в тексте слова «воины»; предлог «на» идиоматично сочетается с ниспосланным бедствием.
- source_word: רָזוֹן
  choice: истощение
  rationale: Передаёт противопоставление тучности и исхудания, оставаясь естественнее буквальной «худобы» и не уточняя причину как болезнь.
- source_word: וְתַחַת כְּבֹדוֹ
  choice: и под его славой
  rationale: Сохраняет основной пространственный образ и неоднозначность תַחַת; возможное значение замещения вынесено в примечание.
- source_word: יֵקַד יְקֹד
  choice: запылает пламя
  rationale: Естественная русская конструкция передаёт усилительное сочетание однокоренных глагола и существительного.
- source_word: כִּיקוֹד אֵשׁ
  choice: словно пламя огня
  rationale: Сохраняет повтор и интенсивность еврейского образа, хотя по-русски он звучит намеренно возвышенно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо называет личное имя Бога; транслитерация «Яхве» отличает его от стоящего рядом титула «Владыка».
- issue: Кого обозначают «его тучные»
  choice: Сохранить телесную метафору без добавления слова «воины»
  alternative: его крепкие воины; его сильные
  rationale: Контекст допускает отнесение к военной или иной могущественной верхушке Ассирии, но сам стих не называет их воинами; буквальный образ сохраняет эту широту.
- issue: Значение תַחַת в выражении о славе
  choice: под его славой
  alternative: вместо его славы
  rationale: Пространственное прочтение создаёт образ огня под внешним великолепием, однако значение замещения грамматически возможно и сохранено в примечании.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейским регистром. Сохранены параллельные образы тучности и истощения, а также славы и скрытого под ней огня. Местоимения относятся к Ассирии или её правителю и потому даны со строчной буквы.
