base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/003.yaml
  text: What will you do on the day of punishment[a], and in the devastation that comes from far away? To whom will you flee for help, and where will you leave your wealth?
translation:
  language: ru
  text: Что вы будете делать в день кары и при разорении, которое придёт издалека? К кому вы побежите за помощью и где оставите своё богатство?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою славу» или «свою честь». Еврейское слово может обозначать славу или честь, а в данном контексте — ценное имущество, богатство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדָּה
  choice: расплата
  rationale: В контексте пророческого суда слово обозначает карательное взыскание. «День расплаты» ясно передаёт смысл и звучит естественно в современном русском языке.
- source_word: שׁוֹאָה
  choice: бедствие
  rationale: Слово означает разрушительную катастрофу или опустошение. «Бедствие» сохраняет широту значения и хорошо сочетается с образом угрозы, приходящей издалека.
- source_word: מִמֶּרְחָק
  choice: издалека
  rationale: Передаёт пространственное значение источника надвигающегося бедствия без уточнения, отсутствующего в еврейском тексте.
- source_word: תָּבֹוא
  choice: придёт
  rationale: Форма выражает предстоящее событие; будущее время естественно в русской риторической конструкции.
- source_word: תָּנוּסוּ
  choice: побежите
  rationale: Глагол означает бегство ради спасения. «Побежите» естественно соединяется с «за помощью» и сохраняет образ движения к возможному защитнику.
- source_word: לְעֶזְרָה
  choice: за помощью
  rationale: Это обычное и ясное русское выражение цели в сочетании с глаголом движения.
- source_word: אָנָה
  choice: где
  rationale: Современный русский вопрос о месте; архаическое «куда» в данном сочетании с «оставите» было бы менее естественно.
- source_word: תַעַזְבוּ
  choice: оставите
  rationale: 'Сохраняет широкий смысл глагола: оставить, покинуть или поместить где-либо, не уточняя предполагаемое действие.'
- source_word: כְּבוֹדְכֶם
  choice: своё богатство
  rationale: Хотя основное значение слова — «слава», «честь» или «вес», в данном контексте оно, вероятно, конкретно обозначает ценное имущество. Возвратное «своё» естественно при обращении к подлежащему «вы»; буквальная возможность отмечена в сноске.
theological_decisions:
- issue: Конкретное или абстрактное значение כְּבוֹדְכֶם в пророчестве о суде
  choice: своё богатство
  alternative: свою славу / свою честь
  rationale: Вопрос о том, где адресаты смогут оставить ценимое ими во время бедствия, допускает конкретное значение — имущество или богатство. Однако абстрактные значения «слава» и «честь» остаются лексически возможными, поэтому они сохранены в сноске без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык; риторические вопросы и угрожающий тон пророческого суда сохранены. Координация двух обстоятельств передана без добавления конкретного земного захватчика, которого текст прямо не называет.
