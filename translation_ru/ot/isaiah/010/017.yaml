base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/017.yaml
  text: And the light of Israel will become a fire[a], and his Holy One a flame[c][b]; it will burn and consume his thorns and his briers in a single day.
translation:
  language: ru
  text: И станет свет Израиля огнём[a], а его Святой — пламенем[b]; они запылают и пожрут его терновник и колючки[c] в один день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет огнём»; еврейскую конструкцию можно передать более формально, хотя здесь она, вероятно, означает переход в новое состояние.'
    reason: lexical_alternative
  - marker: b
    text: «Его Святой» — вероятнее всего, божественный титул, относящийся к Господу; такое именование характерно для книги Исаии.
    reason: cross_reference
  - marker: c
    text: Оба еврейских слова обозначают колючую растительность; первое встречается сравнительно редко и может пониматься шире — как заросли или подлесок.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: станет
  rationale: Сочетание היה с לְ обозначает переход в новое состояние; «станет» естественно передаёт образ превращения, сохраняя возможное более формальное понимание «будет» в сноске.
- source_word: אוֹר יִשְׂרָאֵל
  choice: свет Израиля
  rationale: Близкая и естественная передача сопряжённой конструкции; метафора сохранена без прямого истолкования её референта.
- source_word: לְאֵשׁ
  choice: огнём
  rationale: Творительный падеж после «станет» естественно выражает результат или новое состояние.
- source_word: וּקְדוֹשׁוֹ
  choice: его Святой
  rationale: Сохранены местоименная связь и титульное употребление; прописная буква указывает на вероятный божественный титул, не заменяя его поясняющим именем.
- source_word: לְלֶהָבָה
  choice: пламенем
  rationale: Прямая передача, сохраняющая поэтический параллелизм с «огнём».
- source_word: וּבָעֲרָה
  choice: оно запылает
  rationale: Форма в пророческой последовательности передана будущим временем; местоимение «оно» соотнесено с ближайшим словом «пламя» и отражает женский род еврейского сказуемого без неестественного русского согласования.
- source_word: וְאָכְלָה
  choice: и пожрёт
  rationale: Глагол אכל в образе огня означает полное уничтожение; «пожрёт» сохраняет силу и поэтичность метафоры.
- source_word: שִׁיתוֹ
  choice: его терновник
  rationale: Редкое существительное в сочетании со следующим словом обозначает колючую растительность; «терновник» передаёт этот смысл, а неопределённость отмечена в сноске.
- source_word: וּשְׁמִירוֹ
  choice: и колючки
  rationale: Передаёт второй член пары слов о колючей растительности, не сливая его полностью с первым.
- source_word: בְּיוֹם אֶחָד
  choice: в один день
  rationale: Естественная русская формулировка, сохраняющая акцент на внезапности и полноте уничтожения.
theological_decisions:
- issue: Референт выражений «свет Израиля» и «его Святой»
  choice: Сохранить метафору и титул, не называя их референта прямо в основном тексте.
  alternative: Передать оба выражения как прямые наименования Господа.
  rationale: В книге Исаии «Святой» с большой вероятностью обозначает Господа, и «свет Израиля», вероятно, относится к Нему же; однако сам стих выражает это поэтически, поэтому перевод не устраняет заложенную в тексте образность и некоторую недосказанность.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного пророческого параллелизма. Образы огня, пламени и колючей растительности переданы непосредственно; синтаксис сделан ясным для обычного читателя без конфессиональных уточнений.
