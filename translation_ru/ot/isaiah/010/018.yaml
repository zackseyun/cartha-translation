    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְבוֹד
  choice: славу
  rationale: Сохраняет основное значение כָּבוֹד — «слава, великолепие» — и образ величия и изобилия Ассирии.
- source_word: יַעְרוֹ
  choice: его леса
  rationale: Прямо передаёт יַעַר и сохраняет образ множества и могущества Ассирии.
- source_word: וְכַרְמִלּוֹ
  choice: и его плодородной земли
  rationale: כַּרְמֶל здесь естественно понимать как плодородную, возделанную землю, параллельную лесу, а не как имя собственное Кармил.
- source_word: מִנֶּפֶשׁ וְעַד בָּשָׂר
  choice: от души до плоти
  rationale: Буквально сохраняет меризм и намеренно не сглаживает антропологическую напряжённость выражения общим наречием «полностью».
- source_word: יְכַלֶּה
  choice: истребит
  rationale: Передаёт значение полного уничтожения у כלה в пиэле; глагол естественно сочетается с образом суда в контексте.
- source_word: וְהָיָה
  choice: и всё это будет
  rationale: Нейтральное «всё это» связывает итоговое состояние со всей ранее названной славой леса и плодородной земли, не навязывая единственного грамматического антецедента.
- source_word: כִמְסֹס
  choice: как угасание
  rationale: Редкая форма указывает на таяние, истощение или постепенное исчезновение; «угасание» естественно передаёт постепенный упадок.
- source_word: נֹסֵס
  choice: больного
  rationale: В основном тексте принят контекстуально распространённый смысл человека, изнуряемого болезнью; из-за неясности слова альтернативное понимание вынесено в примечание.
