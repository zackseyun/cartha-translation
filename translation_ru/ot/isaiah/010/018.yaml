  text: And the glory of his forest and of his fruitful land he will consume[a], from soul to flesh, and it will be like the wasting away of a sick man.
translation:
  language: ru
  text: И славу его леса и его плодородной земли он истребит — от души до плоти; и всё это будет как угасание больного[a].
  philosophy: optimal-equivalence
  footnotes:
