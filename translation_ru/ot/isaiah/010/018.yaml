translation_notes:
  register: 'Современный литературный русский язык с сохранением возвышенной образности. Местоимение «он» оставлено со строчной буквы: в самом еврейском тексте графического указания на сакральную капитализацию нет. Тире выделяют меризм «от души до плоти», не превращая его в пояснительное добавление.'
