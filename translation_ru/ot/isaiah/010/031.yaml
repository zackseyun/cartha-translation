lexical_decisions:
- source_word: נָדְדָה
  choice: обратилась в бегство
  rationale: Форма qal, перфект 3-го лица женского рода от נדד. В контексте продвижения войска передаёт бегство; женский род сохраняет олицетворение названия города.
- source_word: מַדְמֵנָה
  choice: Мадмена
  rationale: Географическое название передано русской транслитерацией, без перевода.
- source_word: יֹשְׁבֵי
  choice: жители
  rationale: Субстантивированное причастие в сопряжённой форме естественно передаётся собирательным словом «жители».
- source_word: הַגֵּבִים
  choice: Гевима
  rationale: Географическое название передано русской транслитерацией и поставлено в родительный падеж после слова «жители»; еврейский артикль отдельно не воспроизводится.
- source_word: הֵעִיזוּ
  choice: поспешили укрыться
  rationale: Трудная форма hiphil, перфект 3-го лица множественного числа, в данном контексте указывает на поспешное действие ради безопасности. Перевод передаёт защитную направленность, не навязывая буквального значения «проявили силу».
