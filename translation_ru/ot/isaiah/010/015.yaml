source:
  edition: WLC
  text: הֲ/יִתְפָּאֵר֙ הַ/גַּרְזֶ֔ן עַ֖ל הַ/חֹצֵ֣ב בּ֑/וֹ אִם יִתְגַּדֵּ֤ל הַ/מַּשּׂוֹר֙ עַל מְנִיפ֔/וֹ כְּ/הָנִ֥יף שֵׁ֨בֶט֙ וְ/אֶת מְרִימָ֔י/ו כְּ/הָרִ֥ים מַטֶּ֖ה לֹא עֵֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/015.yaml
  text: Does the axe boast over the one who chops with it? Or does the saw magnify itself over the one who wields it? As if a rod were to wield the one who lifts it up[a], or as if a staff were to lift up one who is not wood!
translation:
  language: ru
  text: Разве топор превозносится над тем, кто рубит им? Разве пила возвышает себя над тем, кто ею орудует? Всё равно что жезл размахивал бы тем, кто его поднимает[a], или посох поднимал бы того, кто не дерево!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст в конце стиха эллиптичен: буквально «или как если бы посох поднимал не-дерево». Возможен также перевод: «или посох — поднимать то, что не дерево».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִתְפָּאֵר
  choice: хвалится
  rationale: Возвратная форма выражает самовосхваление; современное русское слово естественно передаёт риторический упрёк.
- source_word: הַגַּרְזֶן
  choice: топор
  rationale: Обычное русское наименование рубящего орудия.
- source_word: הַחֹצֵב בּוֹ
  choice: тот, кто им рубит
  rationale: Сохраняет действующее лицо и инструментальное значение предлога בּוֹ.
- source_word: יִתְגַּדֵּל
  choice: превозносится
  rationale: Передаёт возвышение самого себя и сохраняет параллель с «хвалится».
- source_word: הַמַּשּׂוֹר
  choice: пила
  rationale: Прямой и естественный русский эквивалент.
- source_word: מְנִיפוֹ
  choice: тот, кто ею водит
  rationale: В контексте пилы естественно описывает движение орудием, сохраняя значение управления им.
- source_word: כְּהָנִיף שֵׁבֶט
  choice: это всё равно что прут стал бы размахивать
  rationale: Развёртывает трудный эллиптический оборот в понятное сравнение, сохраняя намеренную перестановку орудия и действующего лица.
- source_word: שֵׁבֶט
  choice: прут
  rationale: Передаёт деревянное орудие и позволяет отличить его от מַטֶּה, переведённого как «посох».
- source_word: מְרִימָיו
  choice: тем, кто его поднимает
  rationale: По контексту обозначает человека, поднимающего орудие; русский единственный род согласуется с образным рядом, несмотря на морфологическую сложность формы.
- source_word: כְּהָרִים מַטֶּה
  choice: или посох — поднимать
  rationale: Сохраняет параллельную картину невозможной смены действующего лица и орудия.
- source_word: מַטֶּה
  choice: посох
  rationale: Естественный эквивалент, отличающий этот предмет от שֵׁבֶט.
- source_word: לֹא עֵץ
  choice: того, кто не дерево
  rationale: Близко сохраняет краткость и необычность еврейского выражения, подразумевая живого человека в противопоставлении деревянному орудию.
theological_decisions:
- issue: Толкование заключительного эллиптического выражения לֹא עֵץ
  choice: «того, кто не дерево» — деревянное орудие поднимает живого человека
  alternative: «то, что не дерево»; либо «посох, который не из дерева»
  rationale: Контекст строится на нелепой перестановке орудия и того, кто им пользуется. Основной текст сохраняет буквальную странность выражения, а сноска отмечает грамматически возможную неоднозначность, не разрешая её догматически.
translation_notes:
  register: Современный литературный русский язык с риторической энергией пророческой речи. Синтаксис сделан понятным для обычного читателя, но заключительная образная странность и неоднозначность оригинала сохранены; «прут» и «посох» различают два близких еврейских термина.
