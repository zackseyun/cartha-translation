  text: שְׁאָ֥ר יָשׁ֖וּב שְׁאָ֣ר יַעֲקֹ֑ב אֶל אֵ֖ל גִּבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/021.yaml
  text: A remnant will return[a], the remnant of Jacob[b], to the Mighty God.
translation:
  language: ru
  text: Остаток возвратится[a] — остаток Иакова — к Могучему Богу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эти слова созвучны имени Шеар-Яшув («остаток возвратится») в Ис 7:3.
    reason: cross_reference
  - marker: b
    text: 'Возможный вариант: «к Богу, Могучему»; менее вероятно — «к могучему богу» или «к могучему воину». Еврейский титул אֵל גִּבּוֹר употреблён также в Ис 9:6.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר
  choice: остаток
  rationale: Существительное обозначает тех, кто остался после суда или бедствия. «Остаток» — точный и привычный для пророческой речи эквивалент, сохраняющий как количественный, так и богословский смысл.
- source_word: יָשׁוּב
  choice: возвратится
  rationale: Форма Qal imperfect глагола שוב выражает возвращение или обращение. «Возвратится» сохраняет будущую направленность пророчества и перекличку с именем Шеар-Яшув в Ис 7:3.
- source_word: שְׁאָר יַעֲקֹב
  choice: остаток Иакова
  rationale: Конструктивное сочетание буквально и естественно передаётся как «остаток Иакова»; имя Иаков сохранено, а не истолковано как «Израиль».
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает движение или обращение к кому-либо; русское «к» ясно передаёт эту направленность.
- source_word: אֵל גִּבּוֹר
  choice: Могучему Богу
  rationale: Сочетание естественно понимается как весомый титул Бога. «Могучий Бог» сохраняет оба элемента еврейского выражения и его связь с Ис 9:6; порядок слов и падеж приспособлены к русскому синтаксису.
theological_decisions:
- issue: Толкование אֵל גִּבּוֹר как обозначения того, к кому возвращается остаток
  choice: к Могучему Богу
  alternative: 'к Богу, Могучему; менее вероятно: к могучему богу или к могучему воину'
  rationale: Контекст возвращения остатка к этой Личности и употребление того же выражения в Ис 9:6 поддерживают понимание как божественного титула. При этом менее вероятные лексические возможности не исключены молча, а отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной пророческой интонацией. Тире выделяют повторное наименование «остаток Иакова», не устраняя присущую еврейской строке риторическую напряжённость. Заглавные буквы в «Могучему Богу» обозначают титульное употребление.
