  text: הֲ/לֹ֗א כַּ/אֲשֶׁ֥ר עָשִׂ֛יתִי לְ/שֹׁמְר֖וֹן וְ/לֶ/אֱלִילֶ֑י/הָ כֵּ֛ן אֶעֱשֶׂ֥ה לִ/ירוּשָׁלִַ֖ם וְ/לַ/עֲצַבֶּֽי/הָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/011.yaml
  text: shall I not do to Jerusalem and her idols just as I did to Samaria and her idols?[a]
translation:
  language: ru
  text: Разве не поступлю я с Иерусалимом и его идолами так же, как поступил с Самарией и её идолами?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте употреблены два разных слова: об идолах Самарии — אֱלִילִים, а об идолах Иерусалима — עֲצַבִּים («изваяния», «идольские изображения»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, естественной современной русской конструкцией.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: так же, как
  rationale: Ясно и естественно выражает сопоставление уже совершённого с Самарией и будущего действия против Иерусалима.
- source_word: עָשִׂיתִי
  choice: поступил
  rationale: Передаёт завершённое действие без добавления отсутствующего в еврейском тексте конкретного способа уничтожения; в сочетании «поступить с» естественно подразумевает воздействие на объект.
- source_word: לְשֹׁמְרוֹן
  choice: с Самарией
  rationale: Русское «поступить с Самарией» идиоматично передаёт конструкцию עשה ל и сохраняет определяемый контекстом враждебный смысл.
- source_word: אֱלִילֶיהָ
  choice: её идолами
  rationale: Обычное и понятное обозначение ложных богов; уничижительный оттенок еврейского слова не развёрнут сверх текста.
- source_word: אֶעֱשֶׂה
  choice: поступлю
  rationale: Будущее время сохраняет противопоставление завершённого действия над Самарией и намерения относительно Иерусалима.
- source_word: לִירוּשָׁלִַם
  choice: с Иерусалимом
  rationale: Параллельно первой половине стиха естественно передаёт объект действия в русском языке.
- source_word: עֲצַבֶּיהָ
  choice: его идолами
  rationale: В основном тексте единый перевод «идолы» сохраняет силу риторического параллелизма; отличие еврейских слов отмечено в сноске.
theological_decisions:
- issue: 'Два разных еврейских обозначения идолов: אֱלִילִים и עֲצַבִּים'
  choice: Оба слова переведены в основном тексте как «идолы»
  alternative: Передать второе слово как «изваяния» или «идольские изображения»
  rationale: Повтор «идолы» подчёркивает заявленное говорящим равенство Самарии и Иерусалима, а подлинное лексическое различие сохраняется в сноске.
translation_notes:
  register: 'Современный литературный русский с достоинством пророческой речи. Риторическая форма сохранена; местоимения согласованы с нормативным грамматическим родом русских топонимов: Самария — «её», Иерусалим — «его».'
