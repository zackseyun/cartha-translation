base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/014.yaml
  text: My hand found the wealth of the peoples as one finds a nest[a]; and as one gathers abandoned eggs, I gathered all the earth, and there was none that fluttered a wing, or opened a mouth[b], or chirped.
translation:
  language: ru
  text: Моя рука нашла богатства народов, как находят гнездо[a]; и, как собирают брошенные яйца, я собрал всю землю[b]. Никто не шевельнул крылом, не раскрыл рта и не пискнул.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достояние народов» или «богатство народов». Еврейское חַיִל может означать богатство, имущество, силу или войско; в данном образе речь, вероятнее всего, о легко захваченной добыче.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всю страну». Еврейское אֶרֶץ может означать как землю вообще, так и отдельную страну или территорию; здесь сохранён всеохватный язык похвальбы завоевателя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמְצָא
  choice: нашла
  rationale: Буквальное значение מצא сохраняет образ лёгкой находки, которым завоеватель хвастливо описывает добычу.
- source_word: כַקֵּן
  choice: словно гнездо
  rationale: Краткое сравнение следует синтаксису еврейского текста и естественно связывает найденное богатство с образом разоряемого гнезда.
- source_word: יָדִי
  choice: моя рука
  rationale: Буквальный образ передаёт личную силу и действие говорящего.
- source_word: לְחֵיל הָעַמִּים
  choice: богатство народов
  rationale: חַיִל может означать силу, войско, имущество или богатство; образы гнезда, яиц и собирания здесь указывают прежде всего на легко захваченную добычу и ресурсы.
- source_word: וְכֶאֱסֹף בֵּיצִים עֲזֻבוֹת
  choice: и как собирают оставленные яйца
  rationale: «Оставленные» непосредственно передаёт עֲזֻבוֹת и подчёркивает беззащитность, не добавляя предположения о причине оставления.
- source_word: כָּל הָאָרֶץ
  choice: всю землю
  rationale: אֶרֶץ допускает значения «земля» и «страна»; «всю землю» сохраняет намеренно всеохватную имперскую похвальбу.
- source_word: אָסַפְתִּי
  choice: я собрал
  rationale: Буквальное значение אסף поддерживает метафору собирания яиц и покорённых владений.
- source_word: וְלֹא הָיָה נֹדֵד כָּנָף
  choice: Никто не шевельнул крылом
  rationale: Русский оборот естественно передаёт отсутствие даже малейшего сопротивления и сохраняет птичий образ.
- source_word: וּפֹצֶה פֶה
  choice: не раскрыл рта
  rationale: Устойчивое русское выражение близко буквальному «открывающий рот» и не сводит образ только к словесному протесту.
- source_word: וּמְצַפְצֵף
  choice: и не пискнул
  rationale: צפף обозначает птичий писк или щебет; «пискнул» сохраняет образ и хорошо завершает ряд, одновременно подразумевая полное отсутствие возражения.
theological_decisions:
- issue: Масштаб ассирийской похвальбы в כָּל הָאָרֶץ
  choice: всю землю
  alternative: всю страну
  rationale: Универсальная формулировка сохраняет гиперболу самого говорящего, не утверждая от лица повествователя, что он буквально покорил весь мир.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской образностью. Синтаксис сделан плавным для чтения вслух; цепочка «крылом — рта — пискнул» сохраняет нарастающий образ полного отсутствия сопротивления.
