source:
  edition: WLC
  text: כִּ֖י יֹאמַ֑ר הֲ/לֹ֥א שָׂרַ֛/י יַחְדָּ֖ו מְלָכִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/008.yaml
  text: For he says[b][a], “Are not my commanders all kings?”
translation:
  language: ru
  text: 'Ибо он говорит: «Разве не все мои военачальники[a] — цари?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «князья», «правители», «сановники»; еврейское слово может обозначать высокопоставленных гражданских или военных руководителей.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предыдущего утверждения; «ибо» сохраняет причинно-пояснительную связь и соответствует возвышенному, но понятному библейскому регистру.
- source_word: יֹאמַר
  choice: он говорит
  rationale: Имперфект в пророческой речи естественно передаётся настоящим временем, вводящим хвастливые слова ассирийского царя.
- source_word: הֲלֹא
  choice: Разве не
  rationale: Передаёт отрицательный риторический вопрос, предполагающий утвердительный ответ.
- source_word: שָׂרַי
  choice: мои военачальники
  rationale: שַׂר может означать князя, правителя, сановника или военного начальника. В контексте ассирийской имперской похвальбы «военачальники» естественно обозначает высокопоставленных военно-политических подчинённых, не подразумевая царского происхождения.
- source_word: יַחְדָּו
  choice: все
  rationale: Буквально «вместе»; здесь слово подчёркивает совокупность и одинаковый статус всех названных лиц. Русское «все» естественно передаёт этот смысл.
- source_word: מְלָכִים
  choice: цари
  rationale: Прямое соответствие еврейскому существительному; сохраняет хвастливое утверждение, что подчинённые ассирийского царя сами равны царям.
