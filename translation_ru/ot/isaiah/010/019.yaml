  text: And the remaining trees of his forest will be few in number[b][a], and a boy can write them down.
translation:
  language: ru
  text: И оставшихся деревьев в его лесу будет так мало[a], что мальчик[b] сможет их записать[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будут числом»; это древнееврейский оборот о количестве, которое настолько мало, что его легко сосчитать.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «юноша». Древнееврейское слово נַעַר может обозначать мальчика, юношу или молодого человека.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «запишет их». Перевод «сможет записать» передаёт смысл: оставшихся деревьев будет достаточно мало, чтобы легко перечислить их письменно.'
    reason: translation_clarity
lexical_decisions:
- source_word: וּשְׁאָר עֵץ יַעְרוֹ
  choice: И оставшихся деревьев в его лесу
  rationale: שְׁאָר означает то, что осталось; עֵץ, стоящее в единственном числе, здесь имеет собирательное значение и естественно передаётся русским множественным числом «деревьев». Суффикс 3-го лица мужского рода в יַעְרוֹ сохранён как «его».
- source_word: מִסְפָּר יִהְיוּ
  choice: будет так мало
  rationale: Буквально сочетание означает «будут числом» и идиоматически указывает на столь малое, исчислимое количество. Конструкция «так мало, что» естественно связывает эту мысль со следующим образом.
- source_word: וְנַעַר
  choice: что даже мальчик
  rationale: נַעַר может обозначать мальчика, юношу или молодого человека. В данном образе «мальчик» подчёркивает, насколько мало деревьев останется; «даже» передаёт подразумеваемую лёгкость задачи, не меняя референта.
- source_word: יִכְתְּבֵם
  choice: сможет их записать
  rationale: 'Буквально: «запишет их». В контексте форма выражает практический результат их малого числа: их сможет перечислить письменно даже ребёнок.'
