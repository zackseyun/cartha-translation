source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא לֹֽא יוֹסִ֨יף ע֜וֹד שְׁאָ֤ר יִשְׂרָאֵל֙ וּ/פְלֵיטַ֣ת בֵּֽית יַעֲקֹ֔ב לְ/הִשָּׁעֵ֖ן עַל מַכֵּ֑/הוּ וְ/נִשְׁעַ֗ן עַל יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל בֶּ/אֱמֶֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/020.yaml
  text: And in that day the remnant of Israel and the survivors of the house of Jacob will no longer continue to lean on the one who struck them, but will lean on the LORD, the Holy One of Israel, in truth.
translation:
  language: ru
  text: 'И будет в тот день: остаток Израиля и уцелевшие из дома Иакова уже не будут опираться на того, кто поражал их, но будут поистине опираться на Господа, Святого Израилева.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁאָר יִשְׂרָאֵל
  choice: остаток Израиля
  rationale: Устойчиво и точно передаёт пророческое понятие сохранившейся части народа.
- source_word: פְלֵיטַת בֵּית יַעֲקֹב
  choice: уцелевшие из дома Иакова
  rationale: Передаёт собирательное значение существительного и естественно звучит по-русски.
- source_word: לְהִשָּׁעֵן / וְנִשְׁעַן
  choice: опираться / будут опираться
  rationale: Сохраняет повтор одного еврейского корня и образ зависимости от опоры.
- source_word: מַכֵּהוּ
  choice: того, кто поражал их
  rationale: Причастная форма обозначает поражавшего; множественное «их» согласовано с собирательными обозначениями людей в русском тексте.
- source_word: יְהוָה
  choice: Господа
  rationale: Традиционная русская передача тетраграмматона, уместная в основном тексте.
- source_word: בֶּאֱמֶת
  choice: поистине
  rationale: Сохраняет возможный смысл подлинности и верности упования, не сводя выражение только к наречию «верно».
theological_decisions:
- issue: К чему относится בֶּאֱמֶת («в истине / истинно»)?
  choice: «будут поистине опираться» — наречная характеристика упования
  alternative: «будут опираться на Господа… в верности» — возможная характеристика Господа или отношений с Ним
  rationale: Еврейский оборот допускает смысл искреннего, действительного упования. «Поистине» сохраняет некоторую смысловую широту без внесения конфессионального толкования.
- issue: Обозначение Бога в сочетании יְהוָה קְדוֹשׁ יִשְׂרָאֵל
  choice: «Господа, Святого Израилева»
  alternative: «Яхве, Святого Израиля»
  rationale: Выбрана привычная русская библейская форма, при этом титул передан как именование Бога, а не как указание на принадлежность.
translation_notes:
  register: Современный литературный русский с сохранением достоинства пророческой речи. Начальное «И будет в тот день» удерживает библейскую связность; повтор «опираться» воспроизводит риторический контраст оригинала.
