source:
  edition: WLC
  text: הִנֵּ֤ה הָ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת מְסָעֵ֥ף פֻּארָ֖ה בְּ/מַעֲרָצָ֑ה וְ/רָמֵ֤י הַ/קּוֹמָה֙ גְּדוּעִ֔ים וְ/הַ/גְּבֹהִ֖ים יִשְׁפָּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/033.yaml
  text: Behold[a], the Lord, Yahweh of Armies, is lopping off the boughs with terrifying power; the tall in stature are cut down[b], and the lofty are brought low.
translation:
  language: ru
  text: Вот, Владыка, Яхве Воинств, с ужасающей силой обрубает ветви[a]; высокие ростом будут срублены[b], и возвышенные будут низведены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «с грохотом», «сокрушительно» или «наводя ужас»; еврейское слово выражает грозную, насильственную силу.'
    reason: lexical_alternative
  - marker: b
    text: Образ обрубленных ветвей и срубленных высоких деревьев указывает на падение возвышенных, однако сам текст сохраняет древесную метафору.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательная частица привлекает внимание и придаёт пророческому описанию живую непосредственность; «вот» естественно для возвышенной современной русской речи.
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: Владыка, Яхве Воинств
  rationale: Определённое הָאָדוֹן передано титулом «Владыка», имя יהוה — как «Яхве», а צְבָאוֹת — прозрачным и традиционно понятным «Воинств».
- source_word: מְסָעֵף
  choice: обрубает
  rationale: Причастная форма изображает действие как уже разворачивающееся или неминуемое; глагол сохраняет образ удаления крупных ветвей.
- source_word: פֻּארָה
  choice: ветви
  rationale: Существительное обозначает пышные ветви или крону; общеупотребительное «ветви» ясно сохраняет древесную метафору.
- source_word: בְמַעֲרָצָה
  choice: с ужасающей силой
  rationale: Редкое слово передаёт грозную, сокрушительную силу и связанный с ней ужас; перевод не ограничивает его значение только шумом или насилием.
- source_word: רָמֵי הַקּוֹמָה
  choice: высокие ростом
  rationale: Формулировка сохраняет буквальный образ высоты и вместе с тем допускает метафорическое указание на возвышенных людей.
- source_word: גְּדוּעִים
  choice: будут срублены
  rationale: Передаёт результативно-пассивный смысл и продолжает образ рубки деревьев; будущее время естественно выражает неминуемый результат пророческого действия.
- source_word: הַגְּבֹהִים יִשְׁפָּלוּ
  choice: возвышенные будут унижены
  rationale: «Возвышенные» удерживает двусмысленность между физической высотой и высоким положением, а «будут унижены» передаёт становление низкими без уточнения нравственной причины.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст непосредственно называет Бога заветным именем; «Яхве» отличает имя от предшествующего титула הָאָדוֹן.
- issue: Древесный образ и подразумеваемый суд над возвышенными
  choice: Сохранить образ обрубания ветвей и срубания высоких
  alternative: Прямо истолковать это как наказание гордых
  rationale: Еврейский текст соединяет древесную метафору с языком высоты и унижения; перевод сохраняет это напряжение, не подменяя образ явным толкованием.
- issue: Временной оттенок причастия и последующих форм
  choice: Настоящее время для живописного действия и будущее для его результата
  alternative: Всё передать настоящим временем
  rationale: מְסָעֵף живо представляет совершаемое или неминуемое действие, тогда как יִשְׁפָּלוּ имеет незавершённую форму с естественным будущим оттенком; גְּדוּעִים согласовано с этим пророческим результатом.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Владыка» позволяет различить титул הָאָדוֹן и личное имя Яхве; «Воинств» сохраняет библейскую возвышенность, оставаясь понятным в составе устойчивого титула. Все примечания отмечены в основном тексте.
