  source_fidelity: 'Основной смысл передан верно: торговые поступления Тира и её «плата» посвящаются Яхве, не накапливаются, а предназначаются живущим пред Яхве для достаточного пропитания и одежды. Однако «торговля» как предмет, который «копят и приберегают», в русском семантически неудачна; в данном контексте лучше прямо назвать торговую выручку. Предлагаемая формулировка сохраняет различие между סַחְרָהּ и אֶתְנַנָּהּ, не уточняя референт «живущих пред Яхве».'
