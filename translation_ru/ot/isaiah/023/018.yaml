base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/018.yaml
  text: And her merchandise and her wages will be holy to Yahweh[a]; they will not be stored up or hoarded, for her merchandise will be for those who dwell before Yahweh[b], for eating to satisfaction and for durable clothing.
translation:
  language: ru
  text: Её торговая выручка и её плата[a] будут посвящены Яхве. Их не будут откладывать и сберегать, ибо её торговая выручка будет предназначена тем, кто живёт пред Яхве, — чтобы они ели досыта и имели добротную одежду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Плата» может также означать «плату блуднице»; это слово, вероятно, перекликается с образом Тира как блудницы в предыдущих стихах.
    reason: lexical_alternative
  - marker: b
    text: 'Последние слова еврейского текста трудны для перевода. Возможны варианты: «прочная одежда», «роскошная одежда» или «достаточное покрытие».'
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: סַחְרָהּ
  choice: торговля её / доход от её торговли
  rationale: Существительное обозначает торговлю, товарооборот или получаемый от них доход. В первой строке сохранено широкое «торговля», а далее контекст расходования средств естественно требует «доход от её торговли».
- source_word: אֶתְנַנָּהּ
  choice: плата её
  rationale: Слово означает плату или вознаграждение и может иметь оттенок платы блуднице, перекликаясь с образом Тира в Ис 23:15–17. «Плата» сохраняет эту возможность без навязывания узкого толкования.
- source_word: קֹדֶשׁ לַיהוָה
  choice: святыней для Яхве
  rationale: Оборот выражает священное посвящение Яхве. Существительное «святыня» близко передаёт предикативное קֹדֶשׁ и культовую силу выражения.
- source_word: יֵאָצֵר וְלֹא יֵחָסֵן
  choice: не будут копить и приберегать
  rationale: Два близких глагола говорят о накоплении и сохранении богатства в запасе. Русская пара передаёт параллелизм, не создавая искусственной точности между синонимами.
- source_word: לַיֹּשְׁבִים לִפְנֵי יְהוָה
  choice: живущим пред Яхве
  rationale: ישב здесь естественно понимать как «жить, обитать», а לִפְנֵי — как пребывание пред Яхве, в его присутствии. Архаизирующее, но литературно уместное «пред» сохраняет краткость исходного оборота.
- source_word: לֶאֱכֹל לְשָׂבְעָה
  choice: чтобы они ели досыта
  rationale: Передаёт цель и идею насыщения естественным современным русским выражением.
- source_word: לִמְכַסֶּה עָתִיק
  choice: носили добротную одежду
  rationale: מכסה означает покрытие или одежду; значение редкого עָתִיק в этом сочетании спорно и может указывать на прочность, высокое качество либо достаточность. «Добротная одежда» звучит естественно и сохраняет общий смысл хорошего обеспечения, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон; форма «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Характер предназначения доходов Тира
  choice: станут святыней для Яхве
  alternative: будут посвящены Яхве
  rationale: קֹדֶשׁ указывает именно на священную принадлежность или посвящённость, а не просто на перераспределение либо обложение дохода.
- issue: Кого обозначают «живущие пред Яхве»
  choice: референт не уточняется
  alternative: священники или служители храма
  rationale: Фраза может подразумевать служащих в присутствии Яхве, но сам стих не называет их священниками. Перевод сохраняет широту и богословскую напряжённость исходного выражения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; образ платы и неопределённость последней фразы сохранены с помощью сносок.
