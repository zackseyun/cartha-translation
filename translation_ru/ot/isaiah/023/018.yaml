  terminology: «Яхве» последовательно передаёт тетраграмматон. «Плата» сохраняет возможный отзвук образа блудницы, не превращая его в утверждение в основном тексте. «Добротная одежда» является осторожным выбором для трудного לִמְכַסֶּה עָתִיק; варианты сохраняются в сноске.
