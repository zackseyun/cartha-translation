lexical_decisions:
- source_word: הֵילִילוּ
  choice: Рыдайте
  rationale: Повелительная форма множественного числа от ילל обозначает громкий крик скорби или бедствия. «Рыдайте» естественно звучит по-русски и передаёт публичное выражение горя.
- source_word: אֳנִיּוֹת
  choice: корабли
  rationale: Основное значение существительного во множественном числе — «корабли». Уточнение «торговые» следует из контекста, но отсутствует в самом еврейском тексте.
- source_word: תַּרְשִׁישׁ
  choice: Фарсиса
  rationale: Традиционная русская форма топонима Таршиш; сочетание передано родительным падежом как «корабли Фарсиса».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину призыва к плачу. «Потому что» ясно выражает причинную связь в современном русском языке.
- source_word: שֻׁדַּד
  choice: разрушен
  rationale: Страдательная форма от שדד передаёт насильственное разорение или опустошение. «Разрушен» сохраняет силу высказывания без лишнего уточнения способа гибели.
- source_word: מָעֻזְּכֶן
  choice: ваш оплот
  rationale: Слово מָעוֹז означает укреплённое место, защиту или убежище; суффикс второго лица женского рода множественного числа соотносится с кораблями. «Оплот» сохраняет образ места безопасности и поддержки, вероятно Тира, не сужая значение до гавани.
