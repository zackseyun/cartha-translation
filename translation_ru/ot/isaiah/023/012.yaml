  source_fidelity: 'Текст точно передаёт еврейский оригинал: וַיֹּאמֶר отражено как «Он сказал»; прекращение ликования — «Больше не будешь ликовать»; הַמְעֻשָּׁקָה — «угнетённая»; образ בְּתוּלַת בַּת־צִידוֹן сохранён как «дева, дочь Сидона». Женские формы повелений «Встань, переправься» соответствуют обращению к персонифицированному Сидону. «Даже там не будет тебе покоя» удачно передаёт усилительное גַּם שָׁם и идиоматическое לֹא יָנוּחַ לָךְ.'
