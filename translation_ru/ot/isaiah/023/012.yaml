  text: וַ/יֹּ֕אמֶר לֹֽא תוֹסִ֥יפִי ע֖וֹד לַ/עְל֑וֹז הַֽ/מְעֻשָּׁקָ֞ה בְּתוּלַ֣ת בַּת צִיד֗וֹן כתיים ק֣וּמִי עֲבֹ֔רִי גַּם שָׁ֖ם לֹא יָנ֥וּחַֽ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/012.yaml
  text: He said[a], “You will exult no more, oppressed virgin daughter of Sidon. Arise, cross over to Kittim[b]; even there you will find no rest.”
translation:
  language: ru
  text: 'Он сказал: «Больше не будешь ликовать[a], угнетённая дева, дочь Сидона! Встань, переправься в Киттим[b] — даже там не будет тебе покоя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Больше не будешь радоваться».'
    reason: lexical_alternative
  - marker: b
    text: Киттим, вероятно, обозначает Кипр, а в более широком смысле может подразумевать западные приморские земли.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он сказал
  rationale: Передаёт обычную повествовательную форму глагола אמר; местоимение сохраняет мужской субъект, не называя его и тем самым не устраняя контекстуальную неоднозначность.
- source_word: לֹא תוֹסִיפִי עוֹד לַעְלֹז
  choice: Больше не будешь ликовать
  rationale: Сочетание отрицательной формы יסף с עוֹד выражает прекращение действия, а עלז обозначает бурное, торжествующее веселье. Формулировка естественна по-русски и сохраняет пророческий тон.
- source_word: הַמְעֻשָּׁקָה
  choice: угнетённая
  rationale: Пассивная форма от עשׁק характеризует ту, которая подверглась притеснению или насилию; «угнетённая» передаёт это прямо и без лишнего уточнения.
- source_word: בְּתוּלַת בַּת צִידוֹן
  choice: дева, дочь Сидона
  rationale: Сохранён характерный для пророческой речи образ города или народа как девы-дочери; запятая делает сочетание понятным современному русскому читателю.
- source_word: כתיים / כִּתִּים
  choice: Киттим
  rationale: Собственное имя передано транслитерацией, без сужения его значения до одного географического отождествления.
- source_word: קוּמִי עֲבֹרִי
  choice: Встань, переправься
  rationale: Два повелительных глагола женского рода передают срочный призыв, обращённый к олицетворённому Сидону.
- source_word: גַּם שָׁם לֹא יָנוּחַ לָךְ
  choice: даже там не будет тебе покоя
  rationale: «Даже там» передаёт усилительный смысл גם שם, а безличная русская конструкция естественно выражает идиому, согласно которой покой не будет доступен адресату.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного пророческого тона. Образ «дева, дочь Сидона» и неоднозначное имя Киттим оставлены в основном тексте; синтаксис слегка упрощён ради ясности без устранения смыслового напряжения.
