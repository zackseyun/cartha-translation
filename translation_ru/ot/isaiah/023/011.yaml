  naturalness: Первые два члена звучат естественно и соответствуют возвышенному пророческому регистру. Формула «Яхве повелел о Ханаане разрушить его твердыни» требует переработки для ясного современного литературного русского.
  terminology: «Яхве», «Ханаан», «царства» и «твердыни» уместны. Женское «её» в основном тексте лучше сохраняет грамматический и персонифицирующий эффект מָעֻזְנֶיהָ; сноска поясняет, что оно относится к персонифицированной стране или городу, не навязывая конкретный референт.
