  text: יָד/וֹ֙ נָטָ֣ה עַל הַ/יָּ֔ם הִרְגִּ֖יז מַמְלָכ֑וֹת יְהוָה֙ צִוָּ֣ה אֶל כְּנַ֔עַן לַ/שְׁמִ֖ד מָעֻזְנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/011.yaml
  text: He has stretched out his hand over the sea[a]; he has made kingdoms tremble. Yahweh has commanded concerning Canaan[c][b], to destroy her strongholds.
translation:
  language: ru
  text: 'Он простёр Свою руку над морем[a], заставил царства содрогнуться. Яхве отдал повеление относительно Ханаана[b]: разрушить её твердыни[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против моря». Еврейский предлог здесь допускает оба понимания.'
    reason: alternative_reading
  - marker: b
    text: В этой главе «Ханаан», вероятно, означает финикийскую область, связанную с Тиром.
    reason: cultural_note
  - marker: c
    text: 'Еврейский суффикс имеет женский род: «её твердыни». Он может относиться к персонифицированной стране или городу; возможно также: «её укрепления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹ נָטָה
  choice: Он простёр Свою руку
  rationale: Сохраняется конкретный антропоморфный образ Божьего властного действия; перфект передан естественной для русского повествования формой прошедшего времени.
- source_word: עַל הַיָּם
  choice: над морем
  rationale: Предлог עַל допускает значения «над», «на» и в контексте враждебного действия «против»; основной текст сохраняет образ руки, простёртой над морем, а иной оттенок отмечен в сноске.
- source_word: הִרְגִּיז מַמְלָכוֹת
  choice: заставил царства содрогнуться
  rationale: Каузативная форма глагола רגז означает привести в трепет или потрясение; «заставил… содрогнуться» передаёт и причинность, и силу пророческого образа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, стоящее в еврейском тексте, без замены титулом.
- source_word: צִוָּה אֶל כְּנַעַן
  choice: повелел о Ханаане
  rationale: Необычное сочетание צוה с אֶל, вероятно, указывает на объект или цель повеления. Формулировка «о Ханаане» сохраняет широту конструкции, не делая адресатом саму землю.
- source_word: לַשְׁמִיד
  choice: разрушить
  rationale: Глагол выражает уничтожение; применительно к следующим за ним твердыням русское «разрушить» звучит точно и естественно.
- source_word: מָעֻזְנֶיהָ
  choice: его твердыни
  rationale: מָעוֹז обозначает укреплённое место, оплот или твердыню. Местоимение «его» согласовано в русском с мужским названием «Ханаан»; грамматический женский суффикс оригинала и возможность иной соотнесённости отмечены в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное Божье имя и не подменяет его титулом.
- issue: Географическое значение כְּנַעַן
  choice: Ханаан в основном тексте
  alternative: Финикия
  rationale: Основной текст сохраняет еврейский топоним. В контексте пророчества о Тире он, вероятно, обозначает финикийскую область, что поясняется сноской без скрытой подмены исходного названия.
- issue: Соотнесённость женского суффикса в מָעֻזְנֶיהָ
  choice: его твердыни, с пояснением в сноске
  alternative: её твердыни
  rationale: Еврейский суффикс женского рода может олицетворять землю или город, тогда как русский топоним «Ханаан» мужского рода. Русская грамматика соблюдена в основном тексте, а подлинная образность и неоднозначность оригинала сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и ритмичный; конкретные образы оригинала сохранены без архаизации. Заглавная буква в «Свою» используется как почтительное редакционное оформление, тогда как имя Бога явно названо во втором предложении.
