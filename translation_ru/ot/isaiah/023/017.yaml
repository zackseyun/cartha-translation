base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/017.yaml
  text: And it will happen at the end of seventy years that Yahweh will attend to Tyre[c][b][a], and she will return to her wages and prostitute herself with all the kingdoms of the earth on the face of the earth.
translation:
  language: ru
  text: 'И будет: по прошествии семидесяти лет Яхве обратит внимание[a] на Тир, и она вернётся к своей плате[b] и будет блудодействовать со всеми царствами земли, что находятся по всей земле[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве посетит Тир». Еврейский глагол может обозначать вмешательство — как карающее, так и благоприятное, — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду плата блуднице; так продолжается образ Тира как блудницы среди народов.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «на лице почвы». Здесь употреблено другое еврейское слово, чем переведённое выше словом «земля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет краткую пророческую формулу и естественно вводит будущее событие.
- source_word: מִקֵּץ שִׁבְעִים שָׁנָה
  choice: по прошествии семидесяти лет
  rationale: Передаёт завершение установленного семидесятилетнего срока естественным литературным русским.
- source_word: יִפְקֹד
  choice: обратит внимание на
  rationale: Не уточняет однозначно, будет ли вмешательство карательным или восстановительным, сохраняя широту значения פקד.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: צֹר
  choice: Тир
  rationale: Устоявшаяся русская форма названия города.
- source_word: וְשָׁבָה
  choice: и она вернётся
  rationale: Женский род глагола поддерживает олицетворение Тира как женщины.
- source_word: לְאֶתְנַנָּה
  choice: к своей плате
  rationale: Слово обозначает плату блуднице; последующий глагол ясно сохраняет сексуально-коммерческую метафору.
- source_word: וְזָנְתָה
  choice: и будет блудодействовать
  rationale: Прямо сохраняет пророческую метафору Тира как блудницы, оставаясь уместным для dignified библейского регистра.
- source_word: אֶת כָּל מַמְלְכוֹת הָאָרֶץ
  choice: со всеми царствами земли
  rationale: Передаёт участников метафорического блудодеяния и всеобщий охват выражения.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: по всему лицу суши
  rationale: Сохраняет образное выражение «по лицу» и различает אֲדָמָה от предшествующего אֶרֶץ, не повторяя дважды «земля».
theological_decisions:
- issue: Смысл божественного посещения в יִפְקֹד
  choice: 'нейтральное вмешательство: «Яхве обратит внимание на Тир»'
  alternative: «Яхве посетит Тир», «Яхве накажет Тир» или «Яхве восстановит Тир»
  rationale: Контекст указывает на решительное действие Яхве, после которого деятельность Тира возобновится, однако сам глагол не требует сводить смысл только к наказанию или восстановлению.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Сохранены олицетворение Тира, резкая метафора блудодеяния и неопределённость характера действия Яхве; финальная формула передана образно, но понятно.
