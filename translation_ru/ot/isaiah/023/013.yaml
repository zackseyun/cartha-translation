base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/013.yaml
  text: Look at the land of the Chaldeans—this is the people that was not[a]; Assyria appointed it for desert creatures. They set up their siege towers, they stripped her palaces bare[d][c][b], they made her a ruin.
translation:
  language: ru
  text: Вот земля халдеев! Этого народа не было[a]. Ассирия основала её для пустынных обитателей[b]. Они поставили осадные башни[c], разрушили её дворцы[d] и превратили её в развалины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «этот народ не существовал» или «этот народ ничего не значил». Еврейская фраза кратка и трудна для понимания.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «для пустынных зверей». Выражение может относиться как к диким существам пустыни, так и к её обитателям.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово, переведённое как «осадные башни», не вполне ясно; возможны также переводы «сторожевые башни» или «укрепления».
    reason: textual_variant
  - marker: d
    text: 'Буквально возможно: «обнажили» или «оголили её дворцы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Современное и естественное указательное восклицание, привлекающее внимание к последующему образу.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: земля халдеев
  rationale: Близко передаёт конструкцию принадлежности и сохраняет одновременно этнический и географический смысл.
- source_word: זֶה הָעָם לֹא הָיָה
  choice: Этого народа не было
  rationale: Сохраняет краткость и загадочность трудной еврейской фразы, не уточняя без достаточных оснований, идёт ли речь о несуществовании или ничтожности народа.
- source_word: אַשּׁוּר
  choice: Ассирия
  rationale: В данном геополитическом контексте употреблено общепринятое русское название державы.
- source_word: יְסָדָהּ
  choice: предназначила её
  rationale: Контекстуально передаёт результативный смысл устроения или определения земли для пустынных обитателей; буквальное «основала» здесь по-русски могло бы ошибочно означать основание государства или города.
- source_word: לְצִיִּים
  choice: пустынным обитателям
  rationale: 'Сохраняет неопределённость референта: слово может обозначать пустынных зверей либо живущих в пустыне существ или людей.'
- source_word: הֵקִימוּ בחיניו
  choice: Они воздвигли свои осадные башни
  rationale: Военная последовательность стиха поддерживает значение осадных сооружений, однако трудность еврейской формы отмечена в сноске.
- source_word: עֹרְרוּ אַרְמְנוֹתֶיהָ
  choice: обнажили её дворцы
  rationale: Передаёт значение снятия покрова, разорения или оголения, не усиливая его до полного разрушения.
- source_word: שָׂמָהּ לְמַפֵּלָה
  choice: превратили её в развалины
  rationale: Естественно передаёт итоговое состояние падения и разрушения; множественное число продолжает цепочку предшествующих действий, хотя форма допускает и единичного субъекта.
theological_decisions:
- issue: Неясность происхождения или статуса халдейского народа
  choice: Сохранена формула «Этого народа не было» с пояснением в сноске.
  alternative: «Этот народ не существовал» или «этот народ ничего не значил».
  rationale: Текстологически и синтаксически трудная фраза не позволяет догматически выбрать одно историческое толкование.
- issue: Референт пустынных обитателей
  choice: Употреблено обобщённое «пустынным обитателям».
  alternative: «пустынным зверям» или «жителям пустыни».
  rationale: Так сохраняется реальная лексическая неоднозначность без привнесения богословски или исторически нагруженного уточнения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Синтаксическая резкость первой части намеренно сохранена; неясные места вынесены в сноски, чтобы основной текст оставался понятным и не скрывал неоднозначность оригинала.
