  text: בּ֣וֹשִׁי צִיד֔וֹן כִּֽי אָמַ֣ר יָ֔ם מָע֥וֹז הַ/יָּ֖ם לֵ/אמֹ֑ר לֹֽא חַ֣לְתִּי וְ/לֹֽא יָלַ֗דְתִּי וְ/לֹ֥א גִדַּ֛לְתִּי בַּחוּרִ֖ים רוֹמַ֥מְתִּי בְתוּלֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/004.yaml
  text: Be ashamed[a], Sidon, for the sea has spoken, the stronghold of the sea, saying, “I have not been in labor, and I have not given birth[c][b], and I have not raised young men or exalted virgins.”
translation:
  language: ru
  text: 'Устыдись, Сидон, ибо сказало море — твердыня моря[a]: «Я не испытывало родовых мук[b] и не рождало, не растило юношей и не взращивало девственниц[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крепость моря», «морская твердыня». Выражение может изображать само море как могущественную твердыню или подразумевать Тир как морскую крепость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я не корчилось в родовых муках».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «девиц», «девушек»; еврейское слово обычно обозначает девушек, не вступавших в половую связь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשִׁי
  choice: Устыдись
  rationale: Повелительная форма, обращённая к олицетворённому городу; перевод сохраняет мотив стыда и не ослабляет его до значения «скорби».
- source_word: צִידוֹן
  choice: Сидон
  rationale: Традиционная русская форма названия финикийского города.
- source_word: יָם
  choice: море
  rationale: Передано буквально как олицетворённое море, которое говорит от первого лица.
- source_word: מָעוֹז הַיָּם
  choice: твердыня моря
  rationale: מָעוֹז означает укреплённое, защищённое место. Сочетание сохранено без однозначного отнесения к морю или к Тиру как морской крепости.
- source_word: לֹא חַ֣לְתִּי
  choice: Я не мучилось родами
  rationale: Глагол обозначает муки или корчи, в данном контексте — родовые муки. Средний род согласован с русским словом «море».
- source_word: יָלַדְתִּי
  choice: не рождало
  rationale: Прямое обозначение рождения; сохраняет последовательность образов беременности и рождения.
- source_word: גִדַּלְתִּי בַּחוּרִים
  choice: не растило юношей
  rationale: גִדַּלְתִּי в контексте детей означает выращивать до зрелости, а בַּחוּרִים — юношей или молодых мужчин, не обязательно сыновей.
- source_word: רוֹמַמְתִּי בְתוּלוֹת
  choice: не воспитывало девушек
  rationale: В параллелизме רוֹמַמְתִּי имеет смысл взращивания или воспитания; «воспитывало» естественно по-русски и отличает этот глагол от предыдущего. Специфика בְתוּלוֹת отмечена сноской.
theological_decisions:
- issue: 'Кто говорит: само море или морская твердыня (возможно, Тир)'
  choice: Сохранена формулировка «море — твердыня моря» без прямого отождествления с Тиром
  alternative: «морская твердыня [Тир] сказала»
  rationale: Еврейский синтаксис и образность допускают более одного понимания; явное добавление Тира устранило бы подлинную неоднозначность текста.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного пророческого тона. Формы среднего рода в прямой речи согласованы с олицетворённым словом «море». Тире поясняет приложение «твердыня моря», не снимая его смысловой неоднозначности.
