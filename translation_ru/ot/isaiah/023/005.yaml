  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический эллипсис оригинала раскрыт минимально: прибытие вести выражено глаголом «достигнет», а подразумеваемая реакция жителей Египта — наречием «там» без явного добавления нового подлежащего.'
