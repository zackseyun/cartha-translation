  text: When the report comes to Egypt[a], they will writhe at the report of Tyre.
translation:
  language: ru
  text: Когда весть достигнет Египта, там содрогнутся[a] при известии о Тире.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут корчиться», «будут мучиться» или «задрожат».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: когда
  rationale: В данном контексте союз вводит придаточное времени, а не сравнение.
- source_word: שֵׁמַע לְמִצְרָיִם
  choice: весть достигнет Египта
  rationale: Существительное שֵׁמַע означает «весть, известие, слух», а предлог לְ указывает здесь на направление. Глагол в еврейской фразе подразумевается; «достигнет» естественно передаёт прибытие вести.
- source_word: יָחִילוּ
  choice: там содрогнутся
  rationale: Форма от חול выражает сильное телесное и душевное потрясение — дрожь, мучение или корчи. «Содрогнутся» сохраняет образ острой реакции и звучит естественно по-русски; «там» обозначает подразумеваемых жителей Египта, не превращая их в явно названное в оригинале подлежащее.
- source_word: כְּשֵׁמַע
  choice: при вести
  rationale: Предлог כְּ обозначает повод или наступление обстоятельства; повтор слова «весть» сохраняет параллелизм еврейского текста.
- source_word: צֹר
  choice: Тир
  rationale: Общепринятое русское название финикийского города צֹר.
