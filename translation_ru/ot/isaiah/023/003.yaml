lexical_decisions:
- source_word: וּבְמַיִם רַבִּים
  choice: По великим водам
  rationale: Предлог ב допускает пространственно-инструментальное понимание; в контексте морской торговли выражение передаёт движение товаров по обширным водным путям.
- source_word: זֶרַע
  choice: зерно
  rationale: Сочетание с жатвой и доходом указывает на сельскохозяйственный товар, а не на семя для посева или потомство.
- source_word: שִׁחֹר
  choice: Шихора
  rationale: Сохранено древнее географическое название; в данном контексте оно, вероятно, обозначает Нил либо один из его рукавов.
- source_word: קְצִיר יְאֹר
  choice: жатва Нила
  rationale: יְאֹר в египетском контексте означает Нил или его канал; родительная конструкция передана кратко и естественно.
- source_word: תְּבוּאָתָהּ
  choice: её доход
  rationale: Слово обозначает урожай, поступление или прибыль; здесь египетское зерно, доставляемое морем, становится доходом Тира. Женский суффикс соотнесён с подразумеваемым городом.
- source_word: וַתְּהִי
  choice: и стала она
  rationale: Форма выражает наступившее состояние, а женский род сохраняет олицетворение Тира как города.
- source_word: סְחַר גּוֹיִם
  choice: торговлей народов
  rationale: סְחַר может означать торговлю, товар или торговую прибыль. Формулировка сохраняет предметную неоднозначность лучше, чем интерпретирующие «торговка» или «рынок».
