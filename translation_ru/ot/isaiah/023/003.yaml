translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью пророческой речи. Инверсия «стала она» поддерживает высокий регистр и ясно соотносит женский род с олицетворённым Тиром. Добавлен глагол «шло», необходимый для естественного русского предложения и соответствующий морско-торговому контексту.
