base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/001.yaml
  text: 'An oracle concerning Tyre: Wail[a], ships of Tarshish, for it is destroyed, without house or harbor[b]. From the land of Kittim it is revealed to them.'
translation:
  language: ru
  text: 'Пророчество о Тире.


    Рыдайте, фарсисские корабли! Ведь Тир разорён: не осталось ни дома, ни гавани[a]. Из земли Киттим[b] пришла к ним эта весть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ни дома, ни входа». Вероятно, смысл в том, что Тир разорён и не осталось ни жилищ, ни доступа к гавани.'
    reason: lexical_alternative
  - marker: b
    text: Киттим — древнее географическое название, вероятно относящееся к Кипру или близлежащим западным приморским землям.
    reason: cultural_note
lexical_decisions:
- source_word: מַשָּׂא
  choice: пророчество
  rationale: В заголовках пророческих речей слово обозначает возвещение, часто содержащее суд. «Пророчество» естественно и понятно по-русски и не навязывает буквальный образ «бремени».
- source_word: צֹר
  choice: Тир
  rationale: Принятая в русском языке форма названия финикийского города.
- source_word: הֵילִילוּ
  choice: рыдайте
  rationale: Повелительная форма множественного числа призывает к громкому скорбному плачу; «рыдайте» передаёт силу глагола и звучит естественнее буквального «войте».
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: фарсисские корабли
  rationale: Традиционное русское обозначение крупных морских торговых судов, связанных с Фарсисом; оно сохраняет присущую еврейскому сочетанию неопределённость относительно происхождения, назначения или типа кораблей.
- source_word: שֻׁדַּד
  choice: Тир разорён
  rationale: Пассивная форма выражает опустошение и разорение. Название города повторено ради ясного и естественного русского синтаксиса, хотя в еврейском подлежащее подразумевается.
- source_word: מִבַּיִת מִבּוֹא
  choice: не осталось ни дома, ни гавани
  rationale: 'Предлог מִן истолкован как указывающий на лишение: разорение столь полно, что не осталось ни жилища, ни возможности войти в порт. Морской контекст поддерживает перевод בּוֹא словом «гавань», но буквальная неоднозначность отмечена в сноске.'
- source_word: מֵאֶרֶץ כִּתִּים
  choice: из земли киттимов
  rationale: Сохранено древнее этногеографическое название без преждевременного сведения его только к Кипру; вероятное значение пояснено в сноске.
- source_word: נִגְלָה לָמוֹ
  choice: пришла к ним эта весть
  rationale: В данном контексте пассивный глагол означает, что известие стало им известно. Такой перевод естественно передаёт смысл по-русски, не предполагая особого откровения от Бога.
