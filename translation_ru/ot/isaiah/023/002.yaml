lexical_decisions:
- source_word: דֹּמּוּ
  choice: Умолкните
  rationale: Повелительная форма множественного числа от דמם призывает к молчанию или оцепенению. «Умолкните» передаёт повелительную силу, не добавляя прямо не выраженного значения скорби.
- source_word: יֹשְׁבֵי אִי
  choice: жители побережья
  rationale: Субстантивированное причастие יֹשְׁבֵי естественно передаётся словом «жители»; אִי в пророческой речи может обозначать как остров, так и приморскую область. В финикийском контексте «побережье» звучит естественно, а альтернатива отмечена в сноске.
- source_word: סֹחֵר צִידוֹן
  choice: сидонские торговцы
  rationale: Хотя סֹחֵר имеет форму единственного числа, здесь оно допускает собирательное понимание; следующая форма מִלְאוּךְ имеет множественное число. Русское множественное число согласует фразу и ясно передаёт собирательный смысл.
- source_word: עֹבֵר יָם
  choice: пересекавшие море
  rationale: Причастный оборот сохраняет морской образ и характеризует торговцев как совершающих морские переходы.
- source_word: מִלְאוּךְ
  choice: наполняли тебя
  rationale: Форма глагола с суффиксом второго лица женского рода единственного числа буквально означает «наполняли тебя». Несовершенный вид по-русски естественно выражает продолжительное торговое снабжение; возможный экономический смысл указан в сноске.
