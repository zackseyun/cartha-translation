    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִי
  choice: Пройди
  rationale: Повелительная форма женского рода от עבר прежде всего означает «проходить, пересекать». Перевод сохраняет отдельность действия от следующего сравнения с Нилом, которое указывает на его размах и характер.
- source_word: אַרְצֵךְ
  choice: по своей земле
  rationale: Существительное ארץ с суффиксом 2-го лица женского рода означает «твоя земля». Русское возвратное местоимение естественно при повелительном обращении к дочери Фарсиса.
- source_word: כַיְאֹר
  choice: словно Нил
  rationale: יְאֹר в библейском иврите обычно обозначает Нил или его русло; здесь образ вызывает представление о широко разливающейся реке.
- source_word: בַּת תַּרְשִׁישׁ
  choice: дочь Фарсиса
  rationale: Сохранена пророческая персонификация земли или жителей Фарсиса. «Фарсис» — закрепившаяся в русской библейской традиции форма имени.
- source_word: אֵין
  choice: нет
  rationale: Обычное выражение отсутствия.
- source_word: מֵזַח
  choice: преграды
  rationale: Редкое и не вполне ясное слово связывают с тем, что опоясывает, удерживает или закрепляет. «Преграда» передаёт общий контекстуальный смысл, не сужая его до конкретной гавани либо причального каната.
- source_word: עוֹד
  choice: больше
  rationale: 'В сочетании с отрицанием означает прекращение прежнего положения: «больше нет».'
