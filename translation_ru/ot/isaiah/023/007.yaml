  text: Is this your exultant city[a], whose origin is from days of old, whose feet carried her far away to sojourn?
translation:
  language: ru
  text: Неужели это ваш ликующий город, чьё начало — в глубокой древности, чьи ноги уведут его далеко, чтобы жить на чужбине?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲזֹאת לָכֶם
  choice: Неужели это ваш
  rationale: Вопросительная частица с указательным местоимением вводит риторический вопрос; сочетание לָכֶם естественно передаётся по-русски притяжательным местоимением «ваш».
- source_word: עַלִּיזָה
  choice: ликующий город
  rationale: Прилагательное обозначает бурную радость и торжество. Слово «город» эксплицирует подразумеваемый в контексте Тир; мужской род обусловлен нормами русского языка.
- source_word: מִימֵי קֶדֶם קַדְמָתָהּ
  choice: чьё начало восходит к древним дням
  rationale: Передаёт мысль о древнем происхождении города, сохраняя образ временной глубины; неоднозначность слова קַדְמָתָהּ отмечена в сноске.
- source_word: יֹבִלוּהָ רַגְלֶיהָ
  choice: чьи ноги уносили его
  rationale: Сохраняется олицетворение города и образ ног как средства движения; «уносили» естественно выражает каузативное значение יבל в данном контексте.
- source_word: מֵרָחוֹק
  choice: вдаль
  rationale: Кратко и естественно обозначает удалённое место назначения, не перегружая поэтическую строку.
- source_word: לָגוּר
  choice: чтобы жить на чужбине
  rationale: Глагол גור часто означает проживание в качестве пришельца или чужеземца; перевод сохраняет этот оттенок лучше, чем нейтральное «жить» или окончательное «поселиться».
