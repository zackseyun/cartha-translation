  source_fidelity: 'Требуется исправление формы времени: יֹבִלוּהָ — имперфект, который в данном пророческом контексте естественно передать будущим («уведут»), а не прошедшим «уносили». Остальные основные соответствия переданы точно: риторический вопрос, древность города, образ его ног и проживание вдали в положении чужеземца сохранены.'
  naturalness: Фраза «чьи ноги уносили его» грамматически возможна, но прошедшее время ослабляет направленность пророческого высказывания. В исправленном варианте синтаксис остаётся современным литературным и естественным.
  terminology: «Ликующий город» уместно передаёт עַלִּיזָה с контекстуально подразумеваемым городом. «Жить на чужбине» хорошо выражает לָגוּר, не навязывая значения окончательного поселения. «Начало — в глубокой древности» передаёт קַדְמָתָהּ; вариант «древность» отмечен в сноске.
