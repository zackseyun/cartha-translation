    rationale: Прилагательное без опорного существительного в этом месте звучит неясно. Альтернативу лучше ограничить спорным значением קַדְמָתָהּ и сохранить явное «город».
  revised_text: Неужели это ваш ликующий город, чьё начало — в глубокой древности, чьи ноги уведут его далеко, чтобы жить на чужбине?
