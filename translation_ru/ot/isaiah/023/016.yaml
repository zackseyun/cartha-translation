base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/016.yaml
  text: Take a lyre[a], go about the city, forgotten prostitute; play skillfully, sing many songs, so that you may be remembered.
translation:
  language: ru
  text: Возьми лиру[a], обойди город, забытая проститутка! Играй искусно, пой песню за песней, чтобы тебя вспомнили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. киннор — древний струнный музыкальный инструмент; его также переводят как «арфа».
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחִי
  choice: Возьми
  rationale: Прямое повеление женского рода; краткая и естественная передача Qal imperative 2fs.
- source_word: כִנּוֹר
  choice: киннор
  rationale: Транслитерация сохраняет название древнего струнного инструмента и не отождествляет его без достаточных оснований с современной лирой или арфой; пояснение дано в сноске.
- source_word: סֹבִּי עִיר
  choice: обойди город
  rationale: Передаёт движение по городу или вокруг него, не добавляя явно отсутствующего в еврейском тексте предлога; русская форма сохраняет некоторую пространственную неоднозначность.
- source_word: זוֹנָה נִשְׁכָּחָה
  choice: забытая блудница
  rationale: Сохраняет прямую пророческую метафору и пассивное значение причастия; «блудница» уместно для высокого библейского регистра и остаётся понятным современному читателю.
- source_word: הֵיטִיבִי נַגֵּן
  choice: играй искусно
  rationale: 'Идиоматически передаёт усилительную конструкцию: играть хорошо, умело, на названном струнном инструменте.'
- source_word: הַרְבִּי שִׁיר
  choice: пой песню за песней
  rationale: Естественно передаёт буквальную идею умножения песни, не сводя выражение непременно к большому числу разных произведений.
- source_word: לְמַעַן תִּזָּכֵרִי
  choice: чтобы тебя вспомнили
  rationale: 'Сохраняет целевое значение לְמַעַן и пассивный смысл Niphal: добиться того, чтобы о персонифицированном городе вновь вспомнили.'
theological_decisions:
- issue: Метафорическое изображение Тира как блудницы
  choice: Сохранить в основном тексте прямое обращение «забытая блудница»
  alternative: Смягчить метафору как «забытая распутница» либо заменить её истолкованием о торговом городе
  rationale: Еврейский текст прямо персонифицирует Тир как забытую блудницу; перевод не должен устранять резкость образа или подменять его конфессиональным толкованием.
- issue: Цель песни в выражении תִּזָּכֵרִי
  choice: «чтобы тебя вспомнили»
  alternative: «чтобы ты была вновь признана» или «чтобы о тебе снова заговорили»
  rationale: 'Пассивное «быть вспомянутой» сохраняет как лексическое значение, так и напряжение образа: блудница старается снова привлечь внимание.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и повелительный; восклицательный знак подчёркивает прямое обращение. Редкое слово «киннор» сопровождено обязательной сноской, чтобы сохранить историко-лексическую точность без потери понятности.
