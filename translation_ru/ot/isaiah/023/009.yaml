  source_fidelity: 'Нужно передать тетраграмматон как личное имя: וְהוָה в исходном тексте и в английской контрольной версии передано «Yahweh», тогда как «Господь» заменяет имя титулом. «Замыслил» точнее передаёт обдуманное решение יְעָצָהּ, чем несколько разговорно-нейтральное «решил». Для לְחַלֵּל в данном некультовом контексте «посрамить» естественно передаёт лишение чести; «осквернить гордость» по-русски семантически неуклюже. Смысловые диапазоны צְבִי и לְהָקֵל сохранены в сносках.'
