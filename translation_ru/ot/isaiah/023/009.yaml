source:
  edition: WLC
  text: יְהוָ֥ה צְבָא֖וֹת יְעָצָ֑/הּ לְ/חַלֵּל֙ גְּא֣וֹן כָּל צְבִ֔י לְ/הָקֵ֖ל כָּל נִכְבַּדֵּי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/009.yaml
  text: 'Yahweh of hosts has purposed it: to defile the pride of all beauty[c][b][a], to humble all the honored ones of the earth.'
translation:
  language: ru
  text: 'Яхве Воинств замыслил это[a]: посрамить гордость всякой славы[b] и унизить[c] всех почитаемых на земле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «замыслил это против неё», то есть против Тира.'
    reason: alternative_reading
  - marker: b
    text: «Всякая слава» может также быть передана как «всякая красота» или «всё великолепие».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «принизить» или «обесчестить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Господь Воинств
  rationale: Передаёт личное имя в принятой русской библейской форме «Господь» и сохраняет широкий смысл צְבָאוֹת как небесных и земных воинств, не сужая его до одних армий.
- source_word: יְעָצָהּ
  choice: решил это
  rationale: Глагол выражает обдуманное намерение или замысел; «решил это» естественно по-русски, а «это» соотносится с возвещённым судом. Возможная отсылка суффикса непосредственно к Тиру отмечена в сноске.
- source_word: לְחַלֵּל
  choice: осквернить
  rationale: Сохраняет сильный смысл лишения святости, чести или высокого достоинства; в данном контексте речь не обязательно ограничена культовой сферой.
- source_word: גְּאוֹן כָּל צְבִי
  choice: гордость всей красы
  rationale: גְּאוֹן здесь допускает оттенки гордости, величия и превосходства, а צְבִי — красоты, великолепия и славы. Компактная формулировка сохраняет образность и неоднозначность еврейского сочетания.
- source_word: לְהָקֵל
  choice: унизить
  rationale: В породе hифиль глагол означает сделать малозначительным, обесчестить или унизить; русский выбор естественно передаёт ниспровержение высокого положения.
- source_word: כָּל נִכְבַּדֵּי אָרֶץ
  choice: всех почитаемых на земле
  rationale: Передаёт людей, обладающих весом, почётом и высоким положением, не сужая их до формального сословия знати. אָרֶץ понято в широком смысле «земля».
theological_decisions:
- issue: Референт женского объектного суффикса в יְעָצָהּ
  choice: «решил это» — отсылка к возвещённому суду или замыслу
  alternative: «замыслил это против неё» — суффикс относится непосредственно к Тиру как к городу женского рода
  rationale: Основной текст остаётся плавным и не навязывает узкий референт; грамматически возможное указание на Тир сохранено в сноске.
- issue: Смысл גְּאוֹן כָּל צְבִי
  choice: «гордость всей красы»
  alternative: «величие всей славы» или «гордость всего великолепия»
  rationale: Контекст суда поддерживает отрицательный оттенок «гордости», однако существительные сохраняют смысловой диапазон величия, красоты, славы и великолепия; альтернативы приведены в сноске.
- issue: Объём אָרֶץ
  choice: «на земле»
  alternative: «в стране»
  rationale: Широкий контекст пророчества и обобщающее כָּל благоприятствуют универсальному смыслу, хотя слово само по себе может означать и конкретную страну.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Синтаксический параллелизм двух инфинитивных целей сохранён. Формулировки понятны обычному читателю, но не сглаживают неоднозначность суффикса и смысловой диапазон ключевых существительных.
