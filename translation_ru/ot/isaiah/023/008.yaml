  yaml_path: translation/ot/isaiah/023/008.yaml
  text: Who has planned this against Tyre[a], the bestower of crowns, whose merchants are princes[b], whose traders are the honored ones of the earth?
translation:
  language: ru
  text: Кто замыслил это против Тира, увенчивающего[a], чьи купцы — князья, чьи торговцы[b] — почитаемые во всём мире?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раздающего венцы». Еврейское выражение представляет Тир как того, кто увенчивает или наделяет царским достоинством.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «хананеи». В данном торговом контексте это слово, вероятно, означает «купцы» или «торговцы».'
