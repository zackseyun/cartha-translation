lexical_decisions:
- source_word: מִי יָעַץ זֹאת עַל צֹר
  choice: Кто замыслил это против Тира
  rationale: Риторический вопрос передан естественно; יָעַץ здесь означает намеренно задумать или замыслить, а עַל в контексте суда имеет направленность «против».
- source_word: הַמַּעֲטִירָה
  choice: раздающего венцы
  rationale: Причастие от עטר описывает Тир как того, кто наделяет венцами или царским достоинством. Формулировка сохраняет активный смысл и метафору исходного текста.
- source_word: סֹחֲרֶיהָ שָׂרִים
  choice: чьи купцы — князья
  rationale: סֹחֲרֶיהָ обозначает купцов, а שָׂרִים — князей или высокопоставленных лиц; именная конструкция сохраняет возвышенный поэтический параллелизм.
- source_word: כִּנְעָנֶיהָ
  choice: чьи торговцы
  rationale: Буквально слово означает «её хананеи», но в торговом контексте «хананей» может метонимически обозначать торговца; буквальный вариант сохранён в сноске.
- source_word: נִכְבַּדֵּי אָרֶץ
  choice: почитаемые на земле
  rationale: Выражение обозначает людей, пользующихся весом и почётом. «На земле» передаёт широкий, международный масштаб славы Тира, не ограничивая смысл одной страной.
theological_decisions:
- issue: Субъект замысла суда прямо не назван в стихе
  choice: Сохранён вопрос «Кто замыслил», без добавления имени Бога
  alternative: «Господь замыслил»
  rationale: Хотя контекст далее указывает на Господа, данный стих оформлен как риторический вопрос; явное называние субъекта здесь преждевременно сняло бы литературное напряжение.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим строем. Активная метафора венцов и параллелизм двух относительных конструкций сохранены; архаизмы и конфессионально окрашенные уточнения не внесены.
