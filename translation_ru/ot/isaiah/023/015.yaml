  source_fidelity: 'Основной смысл передан верно: Тир будет предан забвению на семьдесят лет; срок сопоставлен с «днями одного царя»; затем следует сравнение с песней блудницы. Однако «как на дни одного царя» по-русски неестественно и синтаксически затемняет сравнительную конструкцию כִּימֵי מֶלֶךְ אֶחָד.'
  naturalness: «И в тот день» естественнее, чем вводное «И будет в тот день:». Формула «на семьдесят лет — как дни одного царя» сохраняет намеренную краткость и не решает спорный вопрос, имеются ли в виду жизнь либо царствование царя. «Как в песне блудницы» хорошо подготавливает следующую цитату.
  terminology: «Тир» — нормативное русское название города. «Блудница» уместна в современном литературном библейско-пророческом регистре и прямо передаёт הַזּוֹנָה, не сглаживая метафору.
