base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/015.yaml
  text: 'And in that day Tyre will be forgotten for seventy years[a], like the days of one king. At the end of seventy years[b], it will happen to Tyre as in the song of the prostitute:'
translation:
  language: ru
  text: И в тот день Тир будет забыт на семьдесят лет — как дни одного царя.[a] По прошествии семидесяти лет с Тиром будет как в песне блудницы:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на срок жизни (или правления) одного царя». Буквально: «как дни одного царя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как песня блудницы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохраняет характерную пророческую формулу и естественно передаёт будущее значение еврейской конструкции.
- source_word: וְנִשְׁכַּחַת צֹר
  choice: Тир будет забыт
  rationale: Страдательная форма точно передаёт нифаль глагола שׁכח и образ утраты городом прежней известности и значения.
- source_word: שִׁבְעִים שָׁנָה
  choice: на семьдесят лет
  rationale: Предлог «на» естественно обозначает продолжительность состояния в русском языке.
- source_word: כִּימֵי מֶלֶךְ אֶחָד
  choice: как на дни одного царя
  rationale: По возможности сохраняет буквальное сравнение «как дни одного царя», не подменяя его однозначным толкованием о продолжительности жизни или царствования.
- source_word: מִקֵּץ
  choice: По прошествии
  rationale: Естественно обозначает наступление события после завершения указанного семидесятилетнего срока.
- source_word: יִהְיֶה לְצֹר
  choice: с Тиром будет
  rationale: Передаёт идиому היה ל как наступление для Тира определённой участи, не уточняя её сверх сказанного в тексте.
- source_word: כְּשִׁירַת הַזּוֹנָה
  choice: как в песне блудницы
  rationale: Естественно вводит сравнение с песней, цитируемой в следующем стихе, и сохраняет прямой метафорический образ.
theological_decisions:
- issue: Метафорическое изображение Тира в образе זונה
  choice: блудницы
  alternative: проститутки
  rationale: «Блудница» прямо сохраняет резкий пророческий образ и при этом соответствует dignified библейскому регистру современного русского языка; метафора не смягчается и не истолковывается в самом тексте.
- issue: Значение выражения «дни одного царя»
  choice: сохранить буквальное сравнение в основном тексте
  alternative: срок жизни или правления одного царя
  rationale: Еврейская фраза допускает понимание как срока, связанного с одним царём, но не уточняет, идёт ли речь о жизни или царствовании; перевод не должен устранять эту неопределённость.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Двоеточие после вводной формулы и перед последующей песней помогает ясности. Термин «блудница» выбран как понятный, прямой и стилистически уместный для пророческой речи.
