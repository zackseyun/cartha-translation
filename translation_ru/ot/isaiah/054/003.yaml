  text: כִּי יָמִ֥ין וּ/שְׂמֹ֖אול תִּפְרֹ֑צִי וְ/זַרְעֵ/ךְ֙ גּוֹיִ֣ם יִירָ֔שׁ וְ/עָרִ֥ים נְשַׁמּ֖וֹת יוֹשִֽׁיבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/003.yaml
  text: For you will spread out to the right and to the left[b][a], and your offspring will possess nations and will settle desolate cities.
translation:
  language: ru
  text: Ибо ты распространишься направо и налево, и твоё потомство овладеет народами[a] и заселит опустевшие города[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «унаследует народы», «завладеет народами» либо «вытеснит народы». Еврейский глагол может означать наследовать, вступать во владение или лишать владения — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сделает опустевшие города обитаемыми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего призыва и сохраняет причинную связь в приподнятом, но понятном современном русском языке.
- source_word: יָמִין וּשְׂמֹאול
  choice: направо и налево
  rationale: Сохраняет конкретный пространственный образ расширения во все стороны, не превращая его без достаточных оснований в указание на стороны света.
- source_word: תִּפְרֹצִי
  choice: ты распространишься
  rationale: Глагол פרץ передаёт прорыв и стремительное расширение; в контексте увеличения шатра естественное русское выражение «распространишься» ясно передаёт результат, не устраняя образ расширения.
- source_word: וְזַרְעֵךְ
  choice: твоё потомство
  rationale: זֶרַע употреблено как собирательное существительное; «потомство» естественно передаёт этот смысл и лучше соответствует современному русскому употреблению, чем буквальное «семя».
- source_word: גּוֹיִם
  choice: народами
  rationale: Основное значение גּוֹיִם здесь — «народы»; вариант «язычники» внёс бы более позднее религиозное противопоставление, не обязательное в данном контексте.
- source_word: יִירָשׁ
  choice: овладеет
  rationale: ירשׁ может означать наследование, вступление во владение или вытеснение прежних владельцев. «Овладеет» сохраняет идею перехода во владение и не фиксирует однозначно лишь один из возможных оттенков.
- source_word: עָרִים נְשַׁמּוֹת
  choice: опустевшие города
  rationale: Форма от שׁמם описывает города, оставшиеся без жителей или лежащие в запустении. «Опустевшие» естественно сочетается с последующим «заселит».
- source_word: יוֹשִׁיבוּ
  choice: заселит
  rationale: Каузативная форма ישׁב буквально означает «сделает обитаемыми». При собирательном подлежащем «потомство» единственное число «заселит» грамматически естественно и передаёт каузативный результат.
theological_decisions:
- issue: Значение ירשׁ при גּוֹיִם в качестве прямого дополнения
  choice: овладеет народами
  alternative: унаследует народы; завладеет народами; вытеснит народы
  rationale: Обещание Сиону включает расширение и вступление его потомства во владение. «Овладеет» сохраняет конкретный оттенок обладания, но сноска удерживает подлинную лексическую неоднозначность между наследованием, обладанием и вытеснением, не разрешая её в пользу одной богословской схемы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Обращение к Сиону передано во втором лице единственного числа; собирательное «потомство» согласовано с глаголами в единственном числе. Конкретный образ движения направо и налево сохранён.
