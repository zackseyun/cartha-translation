base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/008.yaml
  text: In a surge of wrath I hid my face from you for a moment[a], but with everlasting lovingkindness I have had compassion on you, says Yahweh[b], your Redeemer.
translation:
  language: ru
  text: В порыве гнева Я на мгновение скрыл от тебя Своё лицо[a], но вечной милостью[b] Я проявил к тебе сострадание, — говорит Яхве, твой Искупитель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В нахлынувшем гневе»; возможно также: «В избытке гнева». Древнееврейское выражение редко и усиливает образ гнева.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «неизменной любовью навеки». Древнееврейское חֶסֶד соединяет значения милости, верной любви и постоянства в отношениях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁצֶף קֶצֶף
  choice: В порыве гнева
  rationale: Редкое שֶׁצֶף в сочетании с קֶצֶף усиливает образ внезапно нахлынувшего гнева. «В порыве гнева» сохраняет краткость и поэтическую силу выражения.
- source_word: הִסְתַּרְתִּי פָנַי
  choice: Я ... скрыл от тебя Своё лицо
  rationale: Прямо передаёт устойчивый древнееврейский образ временного отнятия благоволения или явленного присутствия, не заменяя его толкованием.
- source_word: רֶגַע
  choice: на мгновение
  rationale: Передаёт очень краткий промежуток и подчёркивает противопоставление вечной милости.
- source_word: וּבְחֶסֶד עוֹלָם
  choice: но по вечной милости Моей
  rationale: חֶסֶד охватывает милость, неизменную любовь и верность отношениям. «По вечной милости Моей» естественно по-русски и не сужает слово до одного богословского определения.
- source_word: רִחַמְתִּיךְ
  choice: Я сжалился над тобой
  rationale: Глагол רחם выражает глубокое сострадание и милосердие; выбранная формулировка точно и естественно передаёт завершённое действие.
- source_word: גֹּאֲלֵךְ
  choice: твой Искупитель
  rationale: Сохраняет титульное употребление причастной формы גאל и её смысл избавителя; уточнение «родственник-искупитель» здесь было бы чрезмерным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача חֶסֶד в контексте отношений Бога с Его народом
  choice: вечная милость Моя
  alternative: вечная неизменная любовь Моя
  rationale: «Милость» сохраняет широту חֶסֶד и хорошо сочетается с глаголом сострадания; альтернативная передача яснее выражает постоянство любви, но несколько расширяет исходное однословное понятие.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет отличие имени от титула.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического противопоставления «на мгновение — вечная». Заглавные местоимения при обращении Бога к Сиону использованы в соответствии с русской библейской традицией; женский род адресата не проявляется грамматически в данном русском стихе.
