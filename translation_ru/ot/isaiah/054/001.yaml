  text: רָנִּ֥י עֲקָרָ֖ה לֹ֣א יָלָ֑דָה פִּצְחִ֨י רִנָּ֤ה וְ/צַהֲלִי֙ לֹא חָ֔לָה כִּֽי רַבִּ֧ים בְּֽנֵי שׁוֹמֵמָ֛ה מִ/בְּנֵ֥י בְעוּלָ֖ה אָמַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/001.yaml
  text: Sing[a], barren woman, you who have not given birth; break forth into singing and shout for joy, you who have not been in labor. For the children of the desolate woman are more than the children of the married woman, says Yahweh.
translation:
  language: ru
  text: Пой, неплодная, не рожавшая! Разразись радостной песней и восклицай от радости, не знавшая родовых мук! Ведь у опустошённой детей больше[a], чем у замужней, — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многочисленны дети опустошённой — больше, чем дети замужней». Еврейская сравнительная конструкция выражена предельно сжато; «опустошённой» может также подразумевать покинутую или обезлюдевшую.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָנִּי
  choice: Пой
  rationale: Повелительная форма женского рода от רנן призывает к громкому радостному пению; «пой» естественно передаёт поэтическое обращение.
- source_word: עֲקָרָה
  choice: неплодная
  rationale: Слово обозначает женщину, не способную рождать; субстантивированное прилагательное сохраняет краткость и женский род обращения.
- source_word: לֹא יָלָדָה
  choice: не рождавшая
  rationale: Формально форма 3-го лица женского рода описывает ту, к которой обращена речь; причастный оборот естественно передаёт это в русском.
- source_word: פִּצְחִי רִנָּה
  choice: разразись радостной песней
  rationale: פצח выражает внезапное начало громкого звучания, а רנה — звонкий радостный крик или пение; сочетание сохраняет образность и поэтический тон.
- source_word: וְצַהֲלִי
  choice: и восклицай
  rationale: Глагол обозначает громкий ликующий возглас; «восклицай» передаёт звучность, не повторяя буквально уже выраженную радость.
- source_word: לֹא חָלָה
  choice: не мучившаяся родами
  rationale: חול/חיל здесь относится к мукам и схваткам при родах; русский оборот ясен и сохраняет телесную конкретность исходного образа.
- source_word: כִּי רַבִּים ... מִן
  choice: ведь ... больше, чем
  rationale: רבים вместе со сравнительным מן образует компактное сравнение; «больше, чем» естественно выражает его по-русски.
- source_word: בְּנֵי שׁוֹמֵמָה
  choice: у оставленной детей
  rationale: בנים в данном контексте охватывает детей вообще, а שוממה описывает женщину, оставленную или пребывающую в запустении; «оставленная» сохраняет личный женский образ.
- source_word: בְּנֵי בְעוּלָה
  choice: у замужней
  rationale: בעולה обозначает женщину, соединённую с мужем, то есть замужнюю; краткая форма поддерживает поэтический параллелизм.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Настоящее время естественно для пророческой формулы, а имя יהוה передано как «Яхве», сохраняя личное заветное имя.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит Тетраграмматон; передача «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Образ שׁוֹמֵמָה
  choice: оставленная
  alternative: опустошённая / безлюдная
  rationale: Женский образ противопоставлен замужней женщине. «Оставленная» удерживает это противопоставление, не устраняя возможный оттенок запустения.
translation_notes:
  register: Современный литературный русский с поэтической торжественностью. Сохранены женский образ, тройной призыв к радостному возгласу и напряжённое противопоставление оставленной и замужней; синтаксис слегка уплотнён ради естественного русского параллелизма.
