  verdict: revise
  source_fidelity: 'Основной смысл и поэтическая структура переданы точно: сохраняются обращение к женщине, три призыва к радостному голосу, образ отсутствия родов и сравнение числа детей. Однако «оставленная» сужает значение שׁוֹמֵמָה («опустошённая, разорённая; обезлюдевшая») до оставленности мужем. В данном образе такой оттенок возможен, но не должен заменять более широкую семантику исходного слова. Также «восклицай» без уточнения не передаёт присущего צהלי ликования.'
