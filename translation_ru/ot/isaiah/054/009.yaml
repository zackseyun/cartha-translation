source:
  edition: WLC
  text: כִּי מֵ֥י נֹ֨חַ֙ זֹ֣את לִ֔/י אֲשֶׁ֣ר נִשְׁבַּ֗עְתִּי מֵ/עֲבֹ֥ר מֵי נֹ֛חַ ע֖וֹד עַל הָ/אָ֑רֶץ כֵּ֥ן נִשְׁבַּ֛עְתִּי מִ/קְּצֹ֥ף עָלַ֖יִ/ךְ וּ/מִ/גְּעָר בָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/009.yaml
  text: 'For this is like the waters of Noah to me: just as I swore that the waters of Noah would never again pass over the earth[a], so I have sworn not to be angry with you and not to rebuke you.'
translation:
  language: ru
  text: '«Ибо для Меня это — как воды Ноя: как Я поклялся, что воды Ноя больше не пройдут по земле[a], так Я поклялся не гневаться на тебя и не укорять тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо это для Меня — как воды Ноя». Еврейская фраза допускает несколько способов синтаксического членения. В некоторых переводах под влиянием древних версий стоит «дни Ноя», однако в еврейском тексте — «воды Ноя».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Для
  rationale: Вводит основание предшествующего заверения; русский союз «для» здесь естественно входит в сочетание «для Меня», одновременно сохраняя объяснительную связь контекста.
- source_word: מֵי נֹחַ
  choice: воды Ноя
  rationale: Буквально передаёт еврейское сочетание и сохраняет образ потопа, не заменяя «воды» словом «дни».
- source_word: זֹאת לִי
  choice: Для Меня это — как воды Ноя
  rationale: Еврейская фраза эллиптична; слово «как» делает подразумеваемое сравнение понятным по-русски, не устраняя отмеченную в сноске неоднозначность.
- source_word: אֲשֶׁר ... כֵּן
  choice: как ... так
  rationale: Передаёт соотносительную конструкцию сравнения естественной русской парой.
- source_word: נִשְׁבַּעְתִּי
  choice: Я поклялся / поклялся
  rationale: Сохраняет торжественный язык клятвы; во второй части местоимение естественно опускается, поскольку субъект остаётся тем же.
- source_word: מֵעֲבֹר ... עוֹד
  choice: больше не пройдут
  rationale: Ясно выражает запрет повторения, подразумеваемый клятвой, и близко передаёт глагол «проходить».
- source_word: עַל הָאָרֶץ
  choice: по земле
  rationale: В сочетании с водами естественно описывает их движение по поверхности земли; «земля» соответствует всемирному контексту повествования о Ное.
- source_word: מִקְּצֹף עָלַיִךְ
  choice: не гневаться на тебя
  rationale: Точно и современно передаёт состояние гнева, направленного на адресата женского рода — Сион.
- source_word: וּמִגְּעָר בָּךְ
  choice: и не укорять тебя
  rationale: «Укорять» понятно современному читателю и передаёт גער как строгий словесный выговор, не усиливая его до наказания.
theological_decisions:
- issue: Эллиптическое сравнение זֹאת לִי
  choice: Для Меня это — как воды Ноя
  alternative: Для Меня это — воды Ноя; Для Меня это — словно дни Ноя
  rationale: Масоретский текст говорит именно о «водах Ноя». Сравнительное «как» восполняет эллипсис ради ясности, а буквальная возможность конструкции отмечена в сноске.
- issue: Отрицательная сила конструкции клятвы с מִן и инфинитивами
  choice: поклялся не гневаться на тебя и не укорять тебя
  alternative: поклялся, что не буду гневаться на тебя и укорять тебя
  rationale: Инфинитивная конструкция после глагола клятвы требует в русском явного отрицания. Выбранная форма сохраняет параллелизм и не добавляет богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены обращение к Сиону в женском роде, образ «вод Ноя» и торжественная формула клятвы; эллипсис умеренно прояснён без конфессиональной конкретизации.
