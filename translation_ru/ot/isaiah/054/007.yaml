  text: בְּ/רֶ֥גַע קָטֹ֖ן עֲזַבְתִּ֑י/ךְ וּ/בְ/רַחֲמִ֥ים גְּדֹלִ֖ים אֲקַבְּצֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/007.yaml
  text: For a brief moment I abandoned you[a], but with great compassion I will gather you.
translation:
  language: ru
  text: На короткое время Я оставил тебя[a], но с великим состраданием соберу тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «На малое мгновение Я покинул тебя».'
    reason: Лексическая альтернатива, более буквально передающая בְּרֶגַע קָטֹן и возможный оттенок עזב.
lexical_decisions:
- source_word: בְּרֶגַע קָטֹן
  choice: на короткое время
  rationale: Сочетание буквально говорит о «малом мгновении», то есть об очень кратком промежутке. «На короткое время» естественно передаёт длительность по-русски.
- source_word: עֲזַבְתִּיךְ
  choice: Я оставил тебя
  rationale: Глагол עזב означает «оставить, покинуть». «Оставил» сохраняет прямоту и серьёзность высказывания, не вводя чрезмерно усиленного оттенка окончательного отвержения.
- source_word: וּבְרַחֲמִים
  choice: но с ... состраданием
  rationale: Союз ו передан противительным «но», поскольку вторая часть противопоставляет милосердное восстановление временному оставлению. Множественное רַחֲמִים здесь естественно выражается русским абстрактным существительным в единственном числе.
- source_word: גְּדֹלִים
  choice: великим
  rationale: Прилагательное подчёркивает силу и обилие сострадания; «великим» сохраняет образ и возвышенный пророческий регистр.
- source_word: אֲקַבְּצֵךְ
  choice: соберу тебя
  rationale: Форма глагола קבץ означает «собирать» и в пророческом контексте несёт оттенок возвращения и восстановления. Буквальный перевод сохраняет этот смысл без поясняющей парафразы.
theological_decisions:
- issue: Соотношение Божьего оставления и восстановления
  choice: Сохранить прямое утверждение о временном оставлении, за которым следует собирание с великим состраданием.
  alternative: Смягчить оставление как лишь кажущееся или перевести глагол менее прямо.
  rationale: Еврейский текст прямо употребляет עזב, но сам ограничивает оставление кратким временем и противопоставляет ему великое сострадание. Перевод сохраняет эту богословскую напряжённость, не разрешая её за текст.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Заглавная буква в «Я» указывает на говорящего Бога; обращение имеет женский род, как в еврейском тексте, где речь обращена к Сиону/Иерусалиму.
