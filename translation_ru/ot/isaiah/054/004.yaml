  text: אַל תִּֽירְאִי֙ כִּי לֹ֣א תֵב֔וֹשִׁי וְ/אַל תִּכָּלְמִ֖י כִּ֣י לֹ֣א תַחְפִּ֑ירִי כִּ֣י בֹ֤שֶׁת עֲלוּמַ֨יִ/ךְ֙ תִּשְׁכָּ֔חִי וְ/חֶרְפַּ֥ת אַלְמְנוּתַ֖יִ/ךְ לֹ֥א תִזְכְּרִי עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/004.yaml
  text: Do not fear[a], for you will not be put to shame; and do not be humiliated, for you will not be disgraced. For you will forget the shame of your youth[b], and you will remember the reproach of your widowhood no more.
translation:
  language: ru
  text: Не бойся[a], ибо не будешь посрамлена; не стыдись, ибо не будешь опозорена. Ибо забудешь стыд юности своей и позора вдовства своего больше не вспомнишь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не страшись».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст использует в этом стихе несколько близких слов, связанных со стыдом, посрамлением и унижением, подчёркивая конец публичного бесчестья Сиона.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Не бойся
  rationale: Прямой запрет в форме женского рода, обращённый к олицетворённому Сиону; естественная и точная современная формулировка.
- source_word: תֵבוֹשִׁי
  choice: не будешь посрамлена
  rationale: Глагол может обозначать как переживание стыда, так и публичное посрамление или крушение надежд; пассивная формулировка здесь сохраняет общественный аспект бесчестья.
- source_word: תִּכָּלְמִי
  choice: не смущайся
  rationale: Передаёт призыв не испытывать унизительного смущения и позволяет отличить этот глагол от соседних слов поля стыда, не утяжеляя русский текст.
- source_word: תַחְפִּירִי
  choice: не будешь унижена
  rationale: Передаёт результат бесчестья и поддерживает параллелизм с «не будешь посрамлена», сохраняя лексическое различие.
- source_word: בֹשֶׁת עֲלוּמַיִךְ
  choice: стыд своей юности
  rationale: Естественно передаёт עֲלוּמִים как пору юности и сохраняет образ прежнего стыда Сиона.
- source_word: תִּשְׁכָּחִי
  choice: ты забудешь
  rationale: Будущее время соответствует характеру обещания о восстановлении.
- source_word: חֶרְפַּת אַלְמְנוּתַיִךְ
  choice: позора своего вдовства
  rationale: «Позор» сохраняет социальное измерение חרפה, а буквальное «вдовство» — брачно-заветную метафору текста.
- source_word: לֹא תִזְכְּרִי עוֹד
  choice: больше не вспомнишь
  rationale: Современный русский порядок слов естественно передаёт значение «уже не, впредь не».
theological_decisions:
- issue: К кому обращены формы женского рода
  choice: Сохранено обращение к олицетворённому Сиону/Иерусалиму как к женщине без поясняющей вставки в основной текст.
  alternative: Понимать адресата как отдельную женщину.
  rationale: Контекст Ис 54 с образами брака и вдовства указывает на Сион; женский род русских форм сохраняет эту персонификацию.
- issue: Метафора вдовства
  choice: 'Метафора сохранена буквально: «вдовство».'
  alternative: Истолковать как «оставленность» или «запустение».
  rationale: Брачная метафора существенна для напряжения между прежним отвержением и восстановлением; перевод не должен заранее истолковывать её.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род последовательно сохраняет обращение к олицетворённому Сиону. Лексика стыда намеренно варьируется, чтобы отразить еврейский параллелизм, не делая фразу архаичной.
