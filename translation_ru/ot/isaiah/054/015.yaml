source:
  edition: WLC
  text: הֵ֣ן גּ֥וֹר יָג֛וּר אֶ֖פֶס מֵֽ/אוֹתִ֑/י מִי גָ֥ר אִתָּ֖/ךְ עָלַ֥יִ/ךְ יִפּֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/015.yaml
  text: Look[a], if anyone stirs up strife, it is not from me[c][b]; whoever stirs up strife with you will fall before you.
translation:
  language: ru
  text: Вот, если кто и выступит против тебя[a], то не от Меня; кто выступит против тебя, падёт из-за тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол גור может означать «собираться», «селиться» или, в данном контексте, враждебно выступать; сочетание двух его форм усиливает выражение.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «падёт перед тобой»; буквальнее возможно также «падёт на тебя». В контексте речь, вероятнее всего, идёт о гибели нападающего, а не об успехе его нападения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт вводное указание и эмфатическое привлечение внимания естественным современным русским словом.
- source_word: גּוֹר יָגוּר
  choice: если кто и выступит против тебя
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает глагольную идею. Учитывая контекст враждебности, «выступит против» естественно передаёт враждебное собирание или нападение, не ограничивая смысл только военными действиями.
- source_word: אֶפֶס מֵאוֹתִי
  choice: то не от Меня
  rationale: 'Сохраняет значение источника или санкции: враждебное выступление не исходит от Яхве. Русская формулировка кратка и близка к еврейской.'
- source_word: מִי גָר אִתָּךְ
  choice: кто выступит против тебя
  rationale: מִי имеет здесь обобщающее относительное значение «кто бы ни». Предлог אִתָּךְ буквально означает «с тобой», но в данном контексте обозначает враждебное столкновение; «против тебя» делает это понятным по-русски.
- source_word: עָלַיִךְ יִפּוֹל
  choice: падёт из-за тебя
  rationale: Сохраняет возможное причинное или реляционное значение עַל и обещание гибели противника, не превращая неоднозначную конструкцию в однозначное «перед тобой» без пояснения.
theological_decisions:
- issue: Исходит ли враждебное выступление против Сиона от Бога
  choice: Фраза «не от Меня» отрицает Бога как источник или инициатора этого выступления.
  alternative: «Не по Моей воле» или «не с Моей помощью».
  rationale: Еврейское מֵאוֹתִי прежде всего указывает на происхождение «от Меня», тогда как перевод через «волю» сильнее уточняет природу Божьего непричастия, чем позволяет сама фраза.
- issue: Означает ли последняя фраза успешное нападение на Сион или падение нападающего
  choice: Она передана как падение противника из-за его столкновения с Сионом.
  alternative: Буквально возможны «падёт на тебя» и контекстуальное «падёт перед тобой».
  rationale: Контекст Ис 54:14,17 говорит о защите и оправдании Сиона, поэтому успешное нападение здесь маловероятно; сноска сохраняет грамматическую неоднозначность עַל.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Обращение к Сиону сохранено во втором лице единственного числа; повтор глагола передаёт повтор в еврейском тексте.
