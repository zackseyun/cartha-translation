    issue: «Даже если» для כִּי
    rationale: Эта формулировка превращает вводное обоснование в явно условную конструкцию. «Ибо» сохраняет основную дискурсивную функцию כִּי; модальное «могут» передаёт риторическую уступительность образа.
  - severity: low
    issue: «Отступят» для יָמוּשׁוּ
    rationale: Для гор «сдвинутся» более естественно и ближе к смыслу смещения/удаления. Оно также лучше согласуется со сноской и с повтором глагола далее.
  - severity: low
    issue: Сноска a не соответствует исправленной лексике
    rationale: После замены «отступят» на «сдвинутся» сноска должна указывать на повтор «не сдвинется», а не «не отступит».
  revised_text: Ибо горы могут сдвинуться и холмы поколебаться, но Моя неизменная любовь не сдвинется от тебя, и Мой завет мира не поколеблется, — говорит Яхве, сострадающий тебе.
