  text: כִּ֤י הֶֽ/הָרִים֙ יָמ֔וּשׁוּ וְ/הַ/גְּבָע֖וֹת תְּמוּטֶ֑נָה וְ/חַסְדִּ֞/י מֵ/אִתֵּ֣/ךְ לֹֽא יָמ֗וּשׁ וּ/בְרִ֤ית שְׁלוֹמִ/י֙ לֹ֣א תָמ֔וּט אָמַ֥ר מְרַחֲמֵ֖/ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/010.yaml
  text: For the mountains may depart and the hills may be shaken[a], but my steadfast love will not depart from you, and my covenant of peace will not be shaken, says Yahweh[c][b], who has compassion on you.
translation:
  language: ru
  text: Ибо горы могут сдвинуться и холмы поколебаться, но Моя неизменная любовь не сдвинется от тебя, и Мой завет мира не поколеблется, — говорит Яхве, сострадающий тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Даже если
  rationale: 'В контексте заверения вводит крайнюю, мыслимую возможность и подчёркивает контраст: даже устойчивые горы могут исчезнуть, но любовь Яхве останется. Такое прочтение естественно передаёт риторическую силу еврейской конструкции.'
- source_word: יָמוּשׁוּ / לֹא יָמוּשׁ
  choice: отступят / не отступит
  rationale: Повтор одного русского глагола сохраняет намеренный повтор מוּשׁ и противопоставление между горами и неизменной любовью Бога.
- source_word: תְּמוּטֶנָה / לֹא תָמוּט
  choice: поколеблются / не поколеблется
  rationale: 'Повтор передаёт обе формы מוֹט и сохраняет их отличие от מוּשׁ: речь идёт о потере устойчивости, а не просто об удалении.'
- source_word: חַסְדִּי
  choice: Моя неизменная любовь
  rationale: חֶסֶד объединяет любовь, верность и постоянство в отношениях. «Неизменная любовь» ясно и естественно передаёт здесь её прочность, не сводя значение исключительно к формальному понятию завета.
- source_word: בְרִית שְׁלוֹמִי
  choice: Мой завет мира
  rationale: Сохраняет прямое значение בְּרִית и традиционно узнаваемое «мир», а более широкий смысл שָׁלוֹם поясняется в сноске.
- source_word: מְרַחֲמֵךְ
  choice: сострадающий тебе
  rationale: Причастие обозначает Яхве как того, кто проявляет к персонифицированному Сиону продолжающееся сострадание; русское причастие сохраняет эту характеристику.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Смысл חֶסֶד
  choice: неизменная любовь
  alternative: верная любовь; любовь завета; милость
  rationale: Выбор сохраняет одновременно личный и устойчивый характер Божьей любви. Заветный оттенок не навязывается как единственный смысл, но поддерживается следующими словами о завете.
- issue: Смысл בְרִית שָׁלוֹם
  choice: завет мира
  alternative: завет благополучия; завет целостности
  rationale: «Завет мира» сохраняет конкретную лексику и библейскую формулу, а сноска отмечает более широкий смысл שָׁלוֹם.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет это различие.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Синтаксический параллелизм и повторы двух разных еврейских глаголов сохранены; обращение к Сиону передано формой женского рода, заметной в выражении «к тебе» лишь из контекста, как это естественно для русского текста.
