  text: כִּֽי כְ/אִשָּׁ֧ה עֲזוּבָ֛ה וַ/עֲצ֥וּבַת ר֖וּחַ קְרָאָ֣/ךְ יְהוָ֑ה וְ/אֵ֧שֶׁת נְעוּרִ֛ים כִּ֥י תִמָּאֵ֖ס אָמַ֥ר אֱלֹהָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/006.yaml
  text: For Yahweh has called you like a wife forsaken and grieved in spirit[a], like a wife of youth when she is rejected[b], says your God.
translation:
  language: ru
  text: Ибо Яхве призвал тебя, словно оставленную жену, удручённую духом[a], словно жену юности, когда её отвергают[b], — говорит твой Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно оставленную женщину, удручённую духом». Еврейское אִשָּׁה может означать и «женщина», и «жена»; брачный контекст поддерживает перевод «жена».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза сжата и допускает разные оттенки: «словно жену юности, хотя её отвергают»; возможно также вопросительное понимание: «разве жену юности отвергают?»'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего утешения; «ибо» естественно передаёт пояснительную связь и соответствует возвышенному пророческому регистру.
- source_word: כְאִשָּׁה
  choice: словно оставленную жену
  rationale: אִשָּׁה может обозначать женщину или жену; брачная метафора и последующее אֵשֶׁת נְעוּרִים делают значение «жена» наиболее вероятным.
- source_word: עֲזוּבָה
  choice: оставленную
  rationale: Слово передаёт состояние женщины, которую покинул муж; «оставленная» точно сохраняет брачно-реляционный смысл без излишней архаичности.
- source_word: וַעֲצוּבַת רוּחַ
  choice: скорбящую духом
  rationale: Оборот описывает глубокую внутреннюю боль. «Скорбящую духом» сохраняет образ רוּחַ и звучит естественно в современном литературном русском языке.
- source_word: קְרָאָךְ
  choice: призвал тебя
  rationale: Форма qatal обозначает совершённое действие, значимое для настоящего контекста. «Призвал» сохраняет прямой образ Божьего обращения к Сиону.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: וְאֵשֶׁת נְעוּרִים
  choice: словно жену юности
  rationale: Сочетание обозначает жену, на которой человек женился в молодости. Краткий оборот сохраняет еврейский образ и его поэтическую выразительность.
- source_word: כִּי תִמָּאֵס
  choice: когда её отвергли
  rationale: Трудный сжатый оборот истолкован как описание положения жены юности. Безлично-результативное русское выражение передаёт пассивный смысл формы Niphal, не уточняя действующее лицо.
- source_word: אָמַר אֱלֹהָיִךְ
  choice: говорит твой Бог
  rationale: Настоящее время естественно для пророческой формулы речи; «твой Бог» сохраняет обращение во втором лице и заветный характер отношений.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Брачная метафора Сиона
  choice: Сохранить прямой образ оставленной жены и жены юности
  alternative: Обобщить до «женщины» или заменить образом народа/города
  rationale: Исходный текст прямо описывает отношения Бога и Сиона через брачный образ; его сохранение удерживает богословскую и эмоциональную напряжённость пророчества без привнесения позднейших толкований.
- issue: Неоднозначность כִּי תִמָּאֵס
  choice: когда её отвергли
  alternative: хотя её отвергли; если её отвергли; разве можно отвергнуть жену юности?
  rationale: Синтаксис допускает разные оттенки, поэтому основной текст выбирает естественное контекстуальное прочтение, а альтернативы отмечаются в сноске, чтобы не скрывать подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Повтор «словно» делает две части сравнения ясными, а причастные и временные обороты сохраняют компактность и эмоциональную силу еврейского текста.
