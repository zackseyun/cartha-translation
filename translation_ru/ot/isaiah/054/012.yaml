base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/012.yaml
  text: And I will make your pinnacles of ruby[a], your gates of sparkling stone[d][c][b], and all your boundary walls of precious stones.
translation:
  language: ru
  text: И сделаю Я твои зубцы[a] из рубина[b], твои ворота — из сверкающих камней[c], а все твои пределы[d] — из драгоценных камней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово встречается редко; возможны также переводы: «окна» или «зубцы стен».'
    reason: lexical_alternative
  - marker: b
    text: 'Точное название камня неизвестно; возможно: «гранат» или «красная яшма».'
    reason: lexical_alternative
  - marker: c
    text: Имеются в виду яркие или огненно блестящие самоцветы; в старых переводах — «карбункулы».
    reason: lexical_alternative
  - marker: d
    text: 'Или: «всю твою границу», «все твои рубежи» или «всю твою территорию». В контексте образа строящегося города возможно и более конкретное понимание: «ограду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: И сделаю Я
  rationale: Глагол שׂים означает «помещать, устанавливать, делать». В образе созидания города «сделаю» естественно передаёт смысл; постановка местоимения после глагола сохраняет торжественный поэтический регистр без архаизации.
- source_word: שִׁמְשֹׁתַיִךְ
  choice: твои зубцы
  rationale: Редкое существительное обозначает не вполне ясную архитектурную деталь. В окружении ворот и городской ограды «зубцы» хорошо соответствует образу верхней части укреплений, но неопределённость отмечена в сноске.
- source_word: כַּדְכֹד
  choice: из рубина
  rationale: Точное название минерала не установлено; вероятно, имеется в виду красный или ярко блестящий драгоценный камень. «Рубин» сохраняет традиционный, понятный и поэтически выразительный образ, а возможные соответствия приведены в сноске.
- source_word: וּשְׁעָרַיִךְ
  choice: твои ворота
  rationale: Обычное значение שַׁעַר в контексте города.
- source_word: לְאַבְנֵי אֶקְדָּח
  choice: из сверкающего камня
  rationale: אֶקְדָּח, вероятно, обозначает яркий, огненно блестящий самоцвет, однако точная минералогическая идентификация неизвестна. Описательный перевод передаёт зрительный образ, не создавая ложной точности.
- source_word: וְכָל גְּבוּלֵךְ
  choice: а всю твою ограду
  rationale: גְּבוּל может означать границу, предел или территорию. Непосредственный ряд архитектурных деталей позволяет понимать слово как окружающую город ограду; альтернативы сохранены в сноске.
- source_word: לְאַבְנֵי חֵפֶץ
  choice: из драгоценных камней
  rationale: חֵפֶץ выражает желанность, ценность и то, что доставляет удовольствие. В сочетании с камнями естественный русский эквивалент — «драгоценные камни».
