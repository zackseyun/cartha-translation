  text: וְ/כָל בָּנַ֖יִ/ךְ לִמּוּדֵ֣י יְהוָ֑ה וְ/רַ֖ב שְׁל֥וֹם בָּנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/013.yaml
  text: And all your children will be taught by Yahweh[b][a], and great will be the peace of your children.
translation:
  language: ru
  text: И все твои дети будут научены Яхве[a], и велик будет мир[b] твоих детей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут учениками Яхве».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово «шалом» может также означать целостность, благополучие и процветание.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: И все
  rationale: Союз וְ продолжает предыдущее пророческое высказывание, а כָל имеет здесь собирательное значение.
- source_word: בָּנַיִ/ךְ
  choice: твои дети
  rationale: בנים может обозначать как сыновей, так и детей вообще; в обращении к олицетворённому Сиону собирательное «дети» не ограничивает смысл лицами мужского пола.
- source_word: לִמּוּדֵי
  choice: будут научены
  rationale: Форма от למד обозначает тех, кого обучили или наставили; предикативная конструкция по-русски естественно передаётся будущим временем, а יְהוָה сохраняется как действующее лицо.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем, а не заменён титулом.
- source_word: וְ/רַב
  choice: и велик будет
  rationale: Сохранены предикативность и поэтическая инверсия еврейской фразы.
- source_word: שְׁלֹום
  choice: мир
  rationale: «Мир» — основное и естественное соответствие שׁלום; более широкий смысл благополучия и целостности отмечен в сноске.
- source_word: בָּנָיִ/ךְ
  choice: твоих детей
  rationale: Повтор передан последовательно, с сохранением обращения к Сиону в единственном числе.
theological_decisions:
- issue: Кого обозначают «твои дети» в обещании, обращённом к Сиону
  choice: Обобщённое «твои дети» без уточнения этнической, церковной или исключительно мужской принадлежности
  alternative: «твои сыновья» или «твои жители»
  rationale: Еврейский текст изображает Сион/Иерусалим женщиной и говорит о её потомстве собирательно. Перевод сохраняет этот образ и не навязывает более позднее богословское отождествление.
- issue: Характер наставления выражением לִמּוּדֵי יְהוָה
  choice: «будут научены Яхве»
  alternative: «будут учениками Яхве»
  rationale: Еврейская форма допускает оттенок принадлежности к числу учеников, однако в данном предикативном контексте естественнее пассивное значение. При этом Яхве прямо сохраняется как источник наставления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, поэтическим порядком слов. Синтаксический параллелизм и повтор слова «дети» сохранены; обращение к олицетворённому Сиону передано формами женского рода и единственного числа.
