  text: הן אָֽנֹכִי֙ בָּרָ֣אתִי חָרָ֔שׁ נֹפֵ֨חַ֙ בְּ/אֵ֣שׁ פֶּחָ֔ם וּ/מוֹצִ֥יא כְלִ֖י לְ/מַעֲשֵׂ֑/הוּ וְ/אָנֹכִ֛י בָּרָ֥אתִי מַשְׁחִ֖ית לְ/חַבֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/016.yaml
  text: Look[a], I myself have created the craftsman who blows on the fire of coals and brings out a weapon for his work[c][b]; and I myself have created the destroyer to destroy.
translation:
  language: ru
  text: Вот, Я Сам сотворил кузнеца[a], который раздувает огонь на углях и изготовляет орудие[b] для своего дела[c]; и Я Сам сотворил губителя, чтобы разрушать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать ремесленника вообще; раздувание огня на углях и изготовление орудия указывают здесь на кузнеца.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оружие». Еврейское слово имеет широкое значение: предмет, орудие, сосуд или оружие; контекст допускает военный смысл.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «для его применения», то есть для применения изготовленного орудия. Еврейский суффикс может относиться либо к кузнецу, либо к изготовленному предмету.'
    reason: alternative_reading
lexical_decisions:
- source_word: הן
  choice: Вот
  rationale: Частица привлекает внимание и вводит подчёркнутое Божье утверждение; «вот» естественно для возвышенной современной русской речи.
- source_word: אָנֹכִי
  choice: Я Сам
  rationale: Самостоятельное местоимение выражает эмфазу; повтор этой формулы сохранён в обеих частях стиха.
- source_word: בָּרָאתִי
  choice: сотворил
  rationale: Форма Qal perfect 1cs обозначает совершённое действие Бога. «Сотворил» сохраняет сильное значение ברא и естественно звучит в библейском контексте.
- source_word: חָרָשׁ
  choice: кузнеца
  rationale: Слово может обозначать ремесленника вообще, однако раздувание углей и изготовление орудия ясно указывают здесь на кузнеца.
- source_word: נֹפֵחַ בְּאֵשׁ פֶּחָם
  choice: который раздувает угли в огне
  rationale: Передаёт действие причастия נֹפֵחַ и сохраняет образ огня и углей без излишнего уточнения устройства кузницы.
- source_word: וּמוֹצִיא כְלִי
  choice: и изготовляет орудие
  rationale: 'כְלִי имеет широкий диапазон значений: предмет, орудие, сосуд, оружие. «Орудие» сохраняет широту слова, а военный смысл остаётся возможным в контексте.'
- source_word: לְמַעֲשֵׂהוּ
  choice: для своего дела
  rationale: Мужской суффикс допускает соотнесение как с кузнецом, так и с изготовленным предметом, поскольку כְלִי также мужского рода. Основной текст естественно связывает его с кузнецом, а неоднозначность отмечена в сноске.
- source_word: מַשְׁחִית
  choice: губителя
  rationale: Субстантивированное причастие Hiphil обозначает того, кто причиняет гибель или разрушение; «губитель» прямо и ёмко передаёт это значение.
- source_word: לְחַבֵּל
  choice: чтобы разрушать
  rationale: Инфинитив выражает цель или назначение. «Разрушать» сохраняет семантическую связь с губителем, не смягчая утверждения.
theological_decisions:
- issue: Бог сотворил и кузнеца, и губителя
  choice: Прямо сохранить повторённое утверждение «Я Сам сотворил» применительно к обоим.
  alternative: Ослабить причинную связь или представить появление губителя лишь как Божье попущение.
  rationale: Еврейский текст дважды подчёркнуто употребляет אָנֹכִי בָּרָאתִי. Перевод сохраняет богословское напряжение и не добавляет отсутствующего в стихе объяснения происхождения или природы зла.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Вот» и «Я Сам» передают риторическую эмфазу; синтаксис оставлен компактным. Все сноски отмечены в основном тексте.
