id: ISA.54.14
reference: Isaiah 54:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בִּ/צְדָקָ֖ה תִּכּוֹנָ֑נִי רַחֲקִ֤י מֵ/עֹ֨שֶׁק֙ כִּֽי לֹ֣א תִירָ֔אִי וּ/מִ֨/מְּחִתָּ֔ה כִּ֥י לֹֽא תִקְרַ֖ב אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/014.yaml
  text: In righteousness you will be established[a]; you will be far from oppression, for you will not fear, and from terror[b], for it will not come near you.
translation:
  language: ru
  text: В праведности ты утвердишься[a]. Будь далека от притеснения, ведь ты не будешь бояться, и от ужаса[b], ведь он к тебе не приблизится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Праведностью ты утвердишься». Еврейский предлог может указывать как на сферу, так и на средство.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «ужас», может также означать «разрушение» или «гибель».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּצְדָקָה
  choice: в праведности
  rationale: Предлог בְּ может обозначать как сферу, так и средство. «В праведности» сохраняет эту ёмкость и не сужает значение до одной лишь общественной справедливости.
- source_word: תִּכּוֹנָנִי
  choice: ты утвердишься
  rationale: Форма от כון передаёт состояние прочной утверждённости. Русский возвратный глагол естественно выражает результативно-пассивный оттенок и сохраняет обращение к Сиону в женском роде.
- source_word: רַחֲקִי
  choice: будь далека
  rationale: Императив женского рода требует повелительного смысла, а не простого предсказания. Формулировка сохраняет женский род адресата и образ удаления.
- source_word: מֵעֹשֶׁק
  choice: от притеснения
  rationale: עֹשֶׁק охватывает притеснение, эксплуатацию и насилие. «Притеснение» передаёт широкий угрожающий смысл без неоправданного сужения.
- source_word: כִּי לֹא תִירָאִי
  choice: ведь ты не будешь бояться
  rationale: Сохранено будущее заверение исходного текста; частица «ведь» естественно вводит обоснование в современном русском языке.
- source_word: מִמְּחִתָּה
  choice: от ужаса
  rationale: מְחִתָּה может обозначать ужас, разрушение или гибель. В параллели с боязнью и приближением угрозы «ужас» наиболее естественен, а другие оттенки отмечены в сноске.
- source_word: כִּי לֹא תִקְרַב אֵלָיִךְ
  choice: ведь он к тебе не приблизится
  rationale: Фраза сохраняет образ персонифицированной угрозы, которая не подойдёт к Сиону; местоимение согласовано с русским словом «ужас».
theological_decisions:
- issue: Адресат и грамматический род
  choice: Женский род сохранён в формах «утвердишься», «будь далека», «не будешь бояться»; подразумевается Сион/Иерусалим.
  alternative: Добавить в основной текст обращение «Сион» или «Иерусалим».
  rationale: Контекст указывает на Сион/Иерусалим, однако в самом стихе название не повторяется, поэтому его не следует вставлять в основной текст.
- issue: Сфера или средство утверждения
  choice: «В праведности» с примечанием об инструментальном понимании.
  alternative: «Праведностью ты утвердишься».
  rationale: Еврейский предлог допускает оба прочтения. Основной текст сохраняет сферическое значение, а сноска — подлинную неоднозначность средства.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Женский род обращения сохранён. Повелительная форма רַחֲקִי передана прямо; лексическая неоднозначность ключевых слов вынесена в сноски.
