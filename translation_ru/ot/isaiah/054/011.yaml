id: ISA.54.11
reference: Isaiah 54:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עֲנִיָּ֥ה סֹעֲרָ֖ה לֹ֣א נֻחָ֑מָה הִנֵּ֨ה אָנֹכִ֜י מַרְבִּ֤יץ בַּ/פּוּךְ֙ אֲבָנַ֔יִ/ךְ וִ/יסַדְתִּ֖י/ךְ בַּ/סַּפִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/011.yaml
  text: O afflicted one[a], storm-tossed and not comforted, behold[b], I am setting your stones in antimony and laying your foundations with sapphires.
translation:
  language: ru
  text: О страдалица, бурей гонимая, неутешенная! Вот, Я укладываю твои камни на сурьме[a] и закладываю твоё основание сапфирами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «на сурьме», вероятно, подразумевает тёмный раствор, подложку или декоративную инкрустацию, на которой особенно выделяются камни.
    reason: cultural_note
  - marker: b
    text: 'Или: «лазуритами»; древнееврейское слово, традиционно переводимое как «сапфиры», могло обозначать синий драгоценный камень, не тождественный современному сапфиру.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנִיָּה
  choice: страдалица
  rationale: Форма женского рода служит прямым обращением к олицетворённому Сиону (Иерусалиму). «Страдалица» передаёт бедственное состояние и личный характер обращения, не сужая смысл до материальной бедности.
- source_word: סֹעֲרָה
  choice: бурей гонимая
  rationale: Причастная форма рисует адресата как подвергаемого ударам бури. Выражение сохраняет образ и естественно звучит в современном литературном русском языке.
- source_word: לֹא נֻחָמָה
  choice: неутешенная
  rationale: 'Сохранено прямое пассивное значение: та, которую не утешили. Краткая форма обращения передаёт параллелизм исходного текста.'
- source_word: הִנֵּה
  choice: вот
  rationale: «Вот» естественно передаёт усиленное пророческое объявление и привлекает внимание к последующему Божьему действию.
- source_word: מַרְבִּיץ
  choice: укладываю
  rationale: Причастие в сочетании с אָנֹכִי изображает действие как живо предстоящее или уже начинающееся. Настоящее время сохраняет эту наглядность, а глагол соответствует строительному образу.
- source_word: בַּפּוּךְ
  choice: на сурьме
  rationale: פּוּךְ обычно обозначает сурьму или чёрный косметический минерал. В строительной метафоре речь, вероятно, идёт о тёмном растворе либо декоративной подложке; основной текст сохраняет конкретное название вещества, а примечание отмечает неясность образа.
- source_word: אֲבָנַיִךְ
  choice: твои камни
  rationale: Сохранено обычное значение существительного и архитектурный образ восстановления Сиона; перевод «драгоценности» был бы неоправданным уточнением.
- source_word: וִיסַדְתִּיךְ
  choice: закладываю твоё основание
  rationale: Глагол יסד означает основывать или закладывать основание. По-русски строительный смысл естественно выражается с явным существительным «основание».
- source_word: בַּסַּפִּירִים
  choice: сапфирами
  rationale: Традиционное соответствие — «сапфиры», однако древний термин мог обозначать лазурит или другой синий драгоценный камень. Неопределённость идентификации вынесена в примечание.
theological_decisions:
- issue: Кто является адресатом обращения
  choice: Олицетворённый Сион (Иерусалим), к которому обращаются в женском роде как к страдалице.
  alternative: Некая страдающая женщина либо народ завета, названный без явного олицетворения города.
  rationale: Формы женского рода единственного числа и контекст Ис 54 указывают на олицетворённый Сион. Перевод сохраняет личное обращение, не добавляя конфессиональных отождествлений.
translation_notes:
  register: Современный литературный русский язык с возвышенной пророческой интонацией. Краткие однородные определения сохраняют силу прямого обращения, а настоящее время передаёт наглядность и близость обещанного Божьего действия.
