base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/002.yaml
  text: Enlarge the place of your tent[a], and let the curtains of your dwellings be stretched out; do not hold back. Lengthen your cords[b], and strengthen your stakes.
translation:
  language: ru
  text: 'Расширь место своего шатра,


    пусть полотнища твоих жилищ раскинутся;


    не скупись[a].


    Удлини свои верёвки


    и укрепи свои колья[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не жалей»; или: «не удерживай».'
    reason: lexical_alternative
  - marker: b
    text: Полотнища — тканевые части шатра; его верёвки натягивают и прикрепляют к кольям, вбитым в землю.
    reason: cultural_note
lexical_decisions:
- source_word: הַרְחִיבִי
  choice: Расширь
  rationale: Побудительная форма Hiphil, 2-е лицо женского рода единственного числа, передаёт обращённое к Сиону повеление «сделай шире»; «расширь» естественно и точно выражает его по-русски.
- source_word: מְקוֹם אָהֳלֵךְ
  choice: место для своего шатра
  rationale: Сохраняется конкретный образ пространства, необходимого для расширения шатра. Предлог «для» естественно передаёт смысл сочетания в современном русском языке.
- source_word: אָהֳלֵךְ
  choice: своего шатра
  rationale: Единственное число и образ переносного жилища сохранены; возвратное местоимение естественно при русском повелительном наклонении.
- source_word: וִירִיעוֹת
  choice: полотнища
  rationale: Слово обозначает тканевые части, из которых устраивали шатёр; «полотнища» точнее русского «занавеси» передаёт эту материальную деталь.
- source_word: מִשְׁכְּנוֹתַיִךְ
  choice: твоих жилищ
  rationale: Сохранены множественное число и широкое значение «места обитания» без внесения культового оттенка слова «скиния».
- source_word: יַטּוּ
  choice: пусть раскинут
  rationale: Активная форма Hiphil, 3-е лицо множественного числа, употреблена с побудительным значением. Неопределённо-личная русская конструкция сохраняет подразумеваемых исполнителей и идею развёртывания шатровой ткани.
- source_word: אַל תַּחְשֹׂכִי
  choice: не сдерживай себя
  rationale: Запрет допускает значения «не удерживай, не жалей, не ограничивай». Выбранная формулировка естественна в призыве к широкому расширению и не уточняет сверх текста, что именно не следует жалеть.
- source_word: הַאֲרִיכִי
  choice: Удлини
  rationale: Побудительная форма Hiphil буквально требует сделать верёвки длиннее; прямой русский глагол сохраняет повелительную силу.
- source_word: מֵיתָרַיִךְ
  choice: свои верёвки
  rationale: Речь идёт о верёвках, которыми растягивают и закрепляют шатёр. «Верёвки» понятнее современному читателю, чем более книжное «шнуры».
- source_word: וִיתֵדֹתַיִךְ
  choice: свои колья
  rationale: Существительное обозначает колышки или колья для закрепления шатра; «колья» лаконично сохраняет конкретный образ.
- source_word: חַזֵּקִי
  choice: укрепи
  rationale: Интенсивная форма Piel выражает действие «сделай крепкими, надёжно закрепи»; «укрепи» сохраняет и значение, и повелительную форму.
theological_decisions:
- issue: Метафорический образ жилища Сиона
  choice: Сохранить буквально шатёр, полотнища, верёвки и колья.
  alternative: Передать смысл как расширение народа, города или дома для новых жителей.
  rationale: Еврейский текст развивает единый конкретный образ расширяемого шатра. Его пророческое и богословское применение должно раскрываться контекстом, а не подменять образ пояснительным пересказом.
translation_notes:
  register: Современный литературный русский язык с ясным поэтическим ритмом. Женский род еврейских повелительных форм в русском тексте формально не выражен, поскольку русское повелительное наклонение не различает род; обращение к олицетворённому Сиону сохраняется контекстом. Параллелизм и конкретная шатровая образность удержаны без конфессиональной интерпретации.
