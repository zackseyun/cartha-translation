source:
  edition: WLC
  text: כָּל כְּלִ֞י יוּצַ֤ר עָלַ֨יִ/ךְ֙ לֹ֣א יִצְלָ֔ח וְ/כָל לָשׁ֛וֹן תָּֽקוּם אִתָּ֥/ךְ לַ/מִּשְׁפָּ֖ט תַּרְשִׁ֑יעִי זֹ֡את נַחֲלַת֩ עַבְדֵ֨י יְהוָ֧ה וְ/צִדְקָתָ֛/ם מֵ/אִתִּ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/017.yaml
  text: No weapon formed against you will succeed[a], and every tongue that rises against you in judgment you will condemn. This is the heritage of the servants of Yahweh, and their righteousness is from me[b], declares Yahweh.
translation:
  language: ru
  text: Ни одно оружие, созданное против тебя, не достигнет успеха, и всякий язык, который выступит против тебя на суде, ты осудишь[a]. Это наследие слуг Яхве, и их праведность — от Меня[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты признаешь виновным». Еврейский глагол имеет юридический смысл: объявить кого-либо виновным, осудить.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их оправдание — от Меня»; «подтверждение их правоты — от Меня». В данном судебном контексте еврейское слово может иметь значение оправдания или восстановления правоты.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלִי
  choice: оружие
  rationale: Хотя существительное может означать также орудие, сосуд или предмет, сочетание с направленностью «против тебя» указывает здесь на средство нападения.
- source_word: יוּצַר
  choice: созданное
  rationale: Пассивная форма от יצר означает сформированное или изготовленное; «созданное» естественно звучит по-русски и не сужает образ до кованого оружия.
- source_word: יִצְלָח
  choice: не будет иметь успеха
  rationale: Глагол означает преуспевать, достигать успеха. Формулировка передаёт неэффективность направленного против Сиона оружия.
- source_word: לָשׁוֹן
  choice: язык
  rationale: 'Сохранена яркая метонимия оригинала: язык обозначает обвиняющую речь.'
- source_word: תָּקוּם אִתָּךְ לַמִּשְׁפָּט
  choice: выступит против тебя на суде
  rationale: 'Выражение имеет судебный оттенок: некто поднимается или выступает против адресата с обвинением.'
- source_word: תַּרְשִׁיעִי
  choice: ты осудишь
  rationale: Порода hифиль от רשע означает признать виновным, осудить. Краткий основной вариант сохраняет юридический смысл, а более точная альтернатива вынесена в сноску.
- source_word: נַחֲלַת
  choice: наследие
  rationale: Слово обозначает наследственное владение, удел или достояние; «наследие» сохраняет заветный оттенок.
- source_word: עַבְדֵי
  choice: слуг
  rationale: В сочетании с Божьим именем это обозначение принадлежащих Яхве и служащих Ему людей; «слуги» здесь естественнее, чем социально-правовое «рабы».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: צִדְקָתָם
  choice: их праведность
  rationale: Основное значение связано с праведностью, но судебный контекст допускает смысл оправдания или подтверждения правоты; эта неоднозначность отмечена в сноске.
theological_decisions:
- issue: Значение צִדְקָתָם в заключительной фразе
  choice: их праведность — от Меня
  alternative: их оправдание — от Меня; подтверждение их правоты — от Меня
  rationale: Еврейское слово может обозначать праведность, но в контексте суда также Божье оправдание и восстановление правоты Его слуг. Основной текст сохраняет стандартное лексическое значение, не устраняя судебного оттенка, указанного в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены военный и судебный образы оригинала, обращение к Сиону в женском роде и повтор личного имени Яхве. Заглавная буква в «Меня» употреблена как принятая в русском религиозном письме форма почтительного местоимения.
