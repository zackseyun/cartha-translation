  text: כִּ֤י בֹעֲלַ֨יִ/ךְ֙ עֹשַׂ֔יִ/ךְ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ וְ/גֹֽאֲלֵ/ךְ֙ קְד֣וֹשׁ יִשְׂרָאֵ֔ל אֱלֹהֵ֥י כָל הָ/אָ֖רֶץ יִקָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/005.yaml
  text: For your husband is your Maker[a]; Yahweh of Armies is his name. And your Redeemer is the Holy One of Israel[b]; he is called the God of all the earth.
translation:
  language: ru
  text: Ибо твой супруг — твой Создатель; имя ему — Яхве Воинств[a]. Твой Искупитель — Святой Израиля; он именуется Богом всей земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Господь Саваоф».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «он будет назван Богом всей земли».'
    reason: grammatical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего утешения; «ибо» ясно передаёт пояснительно-причинную связь и сохраняет торжественный тон.
- source_word: בֹעֲלַיִךְ
  choice: твой супруг
  rationale: В обращении к Сиону как к женщине причастие от בעל имеет прежде всего брачный смысл. «Супруг» сохраняет метафору и звучит естественно и достойно по-русски.
- source_word: עֹשַׂיִךְ
  choice: твой Создатель
  rationale: Причастие от עשה с суффиксом 2-го лица женского рода выступает как божественный титул; «Создатель» кратко и ясно передаёт его смысл.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — прозрачным для современного читателя словом «Воинств», сохраняющим образ небесных или боевых сил.
- source_word: שְׁמוֹ
  choice: имя ему
  rationale: Русская именная конструкция «имя ему — …» естественно передаёт формулу именования и сохраняет торжественную краткость оригинала.
- source_word: וְגֹאֲלֵךְ
  choice: Твой Искупитель
  rationale: גאל включает идею избавления с родственными и заветными оттенками; «Искупитель» — устоявшийся и достаточно широкий титул, не сужающий смысл до явно названного родственника.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  rationale: Сохранён характерный для Исаии божественный титул в краткой, буквальной форме.
- source_word: אֱלֹהֵי כָל־הָאָרֶץ
  choice: Богом всей земли
  rationale: Творительный падеж обусловлен русской конструкцией именования, а «всей земли» передаёт всеобщий охват и владычество.
- source_word: יִקָּרֵא
  choice: он зовётся
  rationale: Нифаль имперфекта допускает общефактическое настоящее и будущее прочтение. Основной текст использует естественное настоящее, а возможное будущее значение отмечено в сноске.
theological_decisions:
- issue: Брачная метафора отношений Яхве и Сиона
  choice: 'Сохранить прямой брачный образ: «твой супруг — твой Создатель».'
  alternative: Передать בעל как «твой господин» или «твой владыка».
  rationale: Контекст обращается к Сиону в женском образе, поэтому брачное значение является основным. Его сохранение передаёт заветную и личностную напряжённость текста без привнесения более поздних доктринальных уточнений.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Господь воинств
  rationale: Форма «Яхве Воинств» сохраняет личное имя и делает значение צְבָאוֹת понятным, не ограничивая «воинства» только земными армиями.
- issue: Временное значение יִקָּרֵא
  choice: 'Общефактическое настоящее: «он зовётся».'
  alternative: 'Будущее: «он будет назван».'
  rationale: Имперфект может обозначать как признаваемое ныне имя, так и будущее именование. Основной вариант естественен в формуле титула, а альтернативное временное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаичным ритмом. Прямые брачные и искупительные образы сохранены; традиционный титул и временная неоднозначность последнего глагола вынесены в сноски.
