base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/006.yaml
  text: And the inhabitant of this coastland will say in that day[a], ‘Look, this is our hope, where we fled for help to be delivered from the king of Assyria[b]. And how shall we escape?’
translation:
  language: ru
  text: 'И скажут в тот день жители этой прибрежной земли[a]: «Вот то, на что мы надеялись, куда мы бежали за помощью, чтобы спастись от царя Ассирии. И как нам спастись?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «остров». У Исаии оно нередко обозначает шире приморские земли или области.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב הָאִי הַזֶּה
  choice: жители этой прибрежной земли
  rationale: Причастие в единственном числе имеет собирательное значение, поэтому по-русски естественно множественное число. אִי здесь обозначает островную или приморскую область; в контексте пророческой речи «прибрежная земля» не сужает значение до собственно острова.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Сохраняет обычную пророческую временную формулу и естественно звучит по-русски.
- source_word: הִנֵּה
  choice: вот
  rationale: Передаёт указательное и привлекающее внимание значение без архаизации.
- source_word: כֹּה מַבָּטֵנוּ
  choice: вот на кого мы надеялись
  rationale: מַבָּט буквально связано с тем, на что обращён взор, и в данном контексте означает объект ожидания или надежды. Формулировка сохраняет образ направленной надежды и естественна по-русски.
- source_word: אֲשֶׁר נַסְנוּ שָׁם
  choice: туда мы бежали
  rationale: נוס означает «бежать», а שָׁם при глаголе движения указывает на место назначения; русское «туда» передаёт эту направленность.
- source_word: לְעֶזְרָה
  choice: за помощью
  rationale: Естественная русская передача цели движения.
- source_word: לְהִנָּצֵל
  choice: чтобы спастись
  rationale: Нифаль передаёт избавление от угрозы; русская возвратная форма сохраняет смысл и звучит естественно.
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: от царя Ассирии
  rationale: מִפְּנֵי здесь идиоматически обозначает избавление от угрожающего лица или его власти.
- source_word: וְאֵיךְ נִמָּלֵט אֲנָחְנוּ
  choice: Как же теперь спасёмся мы?
  rationale: Риторический вопрос выражает безысходность. «Же» и контекстуальное «теперь» ясно передают вывод, а конечное «мы» сохраняет эмфатическое אֲנָחְנוּ.
