  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כַּ/אֲשֶׁ֥ר הָלַ֛ךְ עַבְדִּ֥/י יְשַׁעְיָ֖הוּ עָר֣וֹם וְ/יָחֵ֑ף שָׁלֹ֤שׁ שָׁנִים֙ א֣וֹת וּ/מוֹפֵ֔ת עַל מִצְרַ֖יִם וְ/עַל כּֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/003.yaml
  text: Then Yahweh said[b][a], “Just as my servant Isaiah has walked naked and barefoot for three years as a sign and a portent against Egypt and Cush,”
translation:
  language: ru
  text: 'И сказал Яхве: «Как раб Мой Исаия три года ходил обнажённым[a] и босым — в знамение и предзнаменование против Египта и Куша[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раздетым» — возможно, без верхней одежды, в одной набедренной повязке или нижнем одеянии, а не полностью обнажённым.'
    reason: lexical_alternative
  - marker: b
    text: Куш — область к югу от Египта, обычно связываемая с Нубией; в некоторых переводах — «Эфиопия».
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога общепринятой современной русской транслитерацией.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Естественно вводит сравнение, на котором основано истолкование пророческого действия.
- source_word: עַבְדִּי
  choice: раб Мой
  rationale: Сохраняет библейское обозначение пророка как принадлежащего Богу и исполняющего Его поручение; порядок слов поддерживает достойный литературный регистр.
- source_word: הָלַךְ
  choice: ходил
  rationale: В сочетании с продолжительностью «три года» естественно обозначает длительное публичное состояние и поведение.
- source_word: עָרוֹם
  choice: нагим
  rationale: Передаёт основное значение еврейского слова, не устраняя возможной неоднозначности относительно полной или частичной наготы.
- source_word: וְיָחֵף
  choice: и босым
  rationale: Прямой и естественный русский эквивалент, согласованный с «нагим».
- source_word: שָׁלֹשׁ שָׁנִים
  choice: три года
  rationale: Русский винительный времени естественно выражает продолжительность без предлога.
- source_word: אוֹת וּמוֹפֵת
  choice: знамением и предвестием
  rationale: «Знамение» передаёт указательную функцию действия, а «предвестие» — его пророческий характер как предвосхищения грядущего суда.
- source_word: עַל
  choice: для
  rationale: Русское «для» естественно обозначает народы, которым адресовано знамение; в данном контексте его угрожающий смысл раскрывается словом «предвестие» и продолжением речи.
- source_word: מִצְרַיִם
  choice: Египта
  rationale: Традиционное русское название страны.
- source_word: כּוּשׁ
  choice: Куша
  rationale: Сохраняет древнее географическое название, не отождествляя его без оговорки с современной Эфиопией.
theological_decisions:
- issue: Степень наготы Исаии при совершении пророческого знамения
  choice: В основном тексте употреблено «нагим».
  alternative: «раздетым», то есть без верхней одежды, но не обязательно полностью обнажённым
  rationale: Основное лексическое значение עָרוֹם — «нагой», однако контекст древней одежды допускает отсутствие только верхнего одеяния. Неопределённость сохранена примечанием.
- issue: Направленность знамения по отношению к Египту и Кушу
  choice: «для Египта и Куша»
  alternative: «против Египта и Куша» или «о Египте и Куше»
  rationale: Предлог עַל допускает несколько оттенков. «Для» естественно указывает адресатов знамения, не усиливая в этом стихе враждебный оттенок сверх текста; угрожающий характер выражен словом «предвестие».
translation_notes:
  register: 'Современный литературный русский с умеренно библейским достоинством. Синтаксис сохраняет незавершённость стиха: прямая речь продолжается в следующем стихе. Частица «служа» добавлена для естественной связи длительного действия со словами «знамением и предвестием», не изменяя их предикативной функции.'
