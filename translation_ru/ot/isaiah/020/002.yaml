  text: בָּ/עֵ֣ת הַ/הִ֗יא דִּבֶּ֣ר יְהוָה֮ בְּ/יַ֣ד יְשַׁעְיָ֣הוּ בֶן אָמוֹץ֮ לֵ/אמֹר֒ לֵ֗ךְ וּ/פִתַּחְתָּ֤ הַ/שַּׂק֙ מֵ/עַ֣ל מָתְנֶ֔י/ךָ וְ/נַעַלְ/ךָ֥ תַחֲלֹ֖ץ מֵ/עַ֣ל רַגְלֶ֑י/ךָ וַ/יַּ֣עַשׂ כֵּ֔ן הָלֹ֖ךְ עָר֥וֹם וְ/יָחֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/002.yaml
  text: At that time Yahweh spoke by the hand of Isaiah son of Amoz[a], saying, “Go, loosen the sackcloth from your waist, and remove your sandals from your feet.” And he did so, walking naked and barefoot.
translation:
  language: ru
  text: 'В то время Яхве сказал через Исаию, сына Амоца: «Пойди, сними вретище с поясницы и обувь с ног». Он так и сделал и ходил нагим[a] и босым.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раздетым», «полуобнажённым». В некоторых контекстах еврейское слово может означать, что человек недостаточно одет, а не обязательно полностью обнажён.'
    reason: Сохраняет контекстуально возможную степень обнажения при основном переводе עָרוֹם как «нагим».
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: דִּבֶּר ... בְּיַד
  choice: говорил через
  rationale: Естественно передаёт древнееврейскую формулу посредничества «говорил рукой» без неясного для современного русского читателя буквализма.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: Исаию, сына Амоца
  rationale: Употреблены принятые русские формы библейских имён и ясно передана родственная связь.
- source_word: וּפִתַּחְתָּ הַשַּׂק מֵעַל מָתְנֶיךָ
  choice: сними вретище с поясницы
  rationale: По контексту פתח означает развязать или снять надетое вретище; «сними» естественно выражает требуемое действие, а «поясница» сохраняет телесную локализацию מָתְנַיִם.
- source_word: וְנַעַלְךָ תַחֲלֹץ מֵעַל רַגְלֶיךָ
  choice: обувь с ног
  rationale: Коллективное נַעַל передано русским собирательным «обувь»; глагол «сними» распространяется на обе однородные конструкции и передаёт חלץ.
- source_word: וַיַּעַשׂ כֵּן
  choice: Он так и сделал
  rationale: Кратко и естественно передаёт повествовательную формулу исполнения.
- source_word: הָלֹךְ עָרוֹם וְיָחֵף
  choice: ходил нагим и босым
  rationale: Передаёт продолжительное публичное состояние, выраженное сочетанием הָלֹךְ с прилагательными; основной смысл עָרוֹם сохранён без смягчения.
theological_decisions:
- issue: Степень обнажения, обозначенная עָרוֹם в пророческом знамении
  choice: нагим
  alternative: раздетым; полуобнажённым; без верхней одежды
  rationale: Обычное значение עָרוֹם — «нагой», поэтому основной текст не смягчает резкость знамения. Вместе с тем контекст снятия вретища допускает неполную наготу; эта неопределённость отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский с достоинством библейского повествования. Синтаксис сделан естественным: формула בְּיַד передана как «через», а повтор глагола «сними» устранён посредством однородной конструкции. Слово «вретище» сохранено как устоявшееся библейское обозначение грубой одежды; форма «нагим» подчёркивает состояние во время длительного знакового действия.'
