  yaml_path: translation/ot/isaiah/020/005.yaml
  text: And they will be dismayed and ashamed because of Cush[a], their hope, and because of Egypt[c][b], their boast.
translation:
  language: ru
  text: И придут они в смятение и устыдятся из-за Куша[a], своей надежды[b], и из-за Египта, своей славы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Куш — древняя область к югу от Египта, обычно связываемая с Нубией; в некоторых старых переводах она называется Эфиопией.
    reason: cultural_note
  - marker: b
    text: 'Или: «того, на кого они взирали с надеждой».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «своей гордости» или «того, кем они хвалились».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַתּוּ
  choice: придут они в смятение
  rationale: Глагол חתת в пророческой последовательности описывает будущую подавленность и растерянность; выражение естественно по-русски и не сводит смысл только к страху или разрушению.
- source_word: וָבֹשׁוּ
  choice: и устыдятся
  rationale: בושׁ обозначает переживание стыда, посрамления и крушения ожиданий; «устыдятся» сохраняет активную форму еврейского текста.
- source_word: מִכּוּשׁ
  choice: из-за Куша
  rationale: Предлог מִן здесь имеет причинное значение в параллельных оборотах. «Куш» точнее сохраняет древнее географическое название, чем традиционное «Эфиопия».
- source_word: מַבָּטָם
  choice: своей надежды
  rationale: מַבָּט буквально связан с направленным взглядом и здесь означает то, на что возлагали надежду; «надежда» кратко и естественно передаёт контекст зависимости.
- source_word: וּמִן מִצְרַיִם
  choice: и из-за Египта
  rationale: 'Как и в первой параллельной части, מִן естественно понимать причинно: смятение и стыд наступят из-за Египта.'
- source_word: תִּפְאַרְתָּם
  choice: своей славы
  rationale: תִּפְאֶרֶת имеет диапазон значений «слава, великолепие, предмет гордости». «Слава» сохраняет присущую слову неоднозначность, не сводя его исключительно к хвастовству.
