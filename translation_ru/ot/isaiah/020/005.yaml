translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «придут они» поддерживает торжественный ритм, оставаясь понятной. Параллелизм Куша и Египта сохранён; местоимение «своей» согласовано с собирательным субъектом и естественно передаёт еврейские суффиксы третьего лица множественного числа.
