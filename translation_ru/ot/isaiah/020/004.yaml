  text: so the king of Assyria will lead away the captives of Egypt and the exiles of Cush[a], young and old, naked and barefoot[b], with buttocks uncovered—the nakedness of Egypt.
translation:
  language: ru
  text: Так царь Ассирии уведёт пленников Египта и изгнанников Куша — молодых и старых, нагих и босых, с обнажёнными ягодицами[a] — нагота Египта[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с оголёнными ягодицами». Еврейское выражение намеренно наглядно и изображает унижение пленных из Египта и Куша.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «позор Египта». Буквально: «нагота Египта»; выражение сохраняет образ публичного унижения и бесчестия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: так
  rationale: 'Передаёт связь между символическим действием Исаии и предсказанным исполнением: «так, таким образом».'
- source_word: יִנְהַג
  choice: уведёт
  rationale: В контексте насильственного переселения глагол означает, что царь поведёт или угонит людей прочь; «уведёт» естественно сочетается с пленниками и изгнанниками.
- source_word: שְׁבִי מִצְרַיִם
  choice: пленников Египта
  rationale: Существительное здесь обозначает не отвлечённое состояние плена, а взятых в плен людей, что подтверждается параллелью с גָּלוּת.
- source_word: גָּלוּת כּוּשׁ
  choice: изгнанников Куша
  rationale: Слово может обозначать изгнание либо изгнанное население; в параллели с «пленниками» речь идёт о людях. Название Куш сохранено без отождествления с современным государством.
- source_word: נְעָרִים וּזְקֵנִים
  choice: молодых и старых
  rationale: Краткая идиоматическая пара охватывает людей разных возрастов и не вводит более узкого указания на пол, чем требует контекст.
- source_word: עָרוֹם וְיָחֵף
  choice: нагих и босых
  rationale: Сохраняет прямую лексику символического действия и унизительный образ пленных.
- source_word: חֲשׂוּפַי שֵׁת
  choice: с обнажёнными ягодицами
  rationale: Передаёт намеренно резкий и телесный образ публичного унижения; причастная конструкция естественно выражена предложным оборотом.
- source_word: עֶרְוַת מִצְרָיִם
  choice: обнажая наготу Египта
  rationale: «Нагота» сохраняет буквальный образ и его связь с предыдущим описанием. Деепричастие делает краткое еврейское приложение понятным по-русски, не устраняя смысл публичного позора.
theological_decisions:
- issue: Значение заключительного выражения עֶרְוַת מִצְרָיִם
  choice: обнажая наготу Египта
  alternative: на позор Египту
  rationale: Основной текст сохраняет конкретный образ наготы и одновременно допускает подразумеваемый смысл позора; более истолковывающий вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой интонации. Графическая телесная образность оригинала не смягчена, но выражена без просторечия; тире передаёт перечислительный и пояснительный характер еврейской конструкции.
