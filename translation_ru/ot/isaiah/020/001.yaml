  text: בִּ/שְׁנַ֨ת בֹּ֤א תַרְתָּן֙ אַשְׁדּ֔וֹדָ/ה בִּ/שְׁלֹ֣ח אֹת֔/וֹ סַֽרְג֖וֹן מֶ֣לֶךְ אַשּׁ֑וּר וַ/יִּלָּ֥חֶם בְּ/אַשְׁדּ֖וֹד וַֽ/יִּלְכְּדָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/001.yaml
  text: In the year that the Tartan came to Ashdod[a], when Sargon king of Assyria sent him, and he fought against Ashdod and captured it,
translation:
  language: ru
  text: В год, когда тартан[a] пришёл к Азоту, когда Саргон, царь Ассирии, послал его, он вступил в сражение с Азотом и захватил его,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Тартан» — вероятно, ассирийский должностной титул, возможно соответствующий званию главнокомандующего, а не личное имя.
    reason: cultural_note
lexical_decisions:
- source_word: בִּשְׁנַת
  choice: В год, когда
  rationale: Предлог ב с существительным שְׁנַת вводит временную конструкцию; этот перевод естественно передаёт хронологическую рамку.
- source_word: תַרְתָּן
  choice: тартан
  rationale: Вероятнее всего, это ассирийский военный титул, а не личное имя; титул сохранён в транслитерации, а его значение пояснено в сноске.
- source_word: אַשְׁדּוֹדָה
  choice: к Азоту
  rationale: Направительный ה обозначает движение к городу. Устоявшаяся русская библейская форма названия — «Азот».
- source_word: בִּשְׁלֹח אֹתוֹ סַרְגוֹן מֶלֶךְ אַשּׁוּר
  choice: по повелению Саргона, царя Ассирии
  rationale: Еврейская конструкция буквально сообщает, что Саргон послал тартана. «По повелению» естественно выражает направление царём своего должностного лица, сохраняя Саргона как инициатора действия.
- source_word: וַיִּלָּחֶם בְּאַשְׁדּוֹד
  choice: вступил в сражение с Азотом
  rationale: לחם с ב означает вести борьбу или сражаться против; выбранная формулировка ясна в военном контексте и позволяет избежать неестественного повтора.
- source_word: וַיִּלְכְּדָהּ
  choice: и захватил его
  rationale: В военном контексте לכד означает овладеть городом; местоимение относится к Азоту, который в русском языке мужского рода.
