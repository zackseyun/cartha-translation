lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: В обоих случаях союз вводит причинное пояснение бедствия; во втором случае по-русски естественнее передать связь двоеточием, не повторяя союз.
- source_word: מֵי נִמְרִים
  choice: воды Нимрима
  rationale: Сохранена конструкция «воды» с географическим названием, переданным транслитерацией.
- source_word: מְשַׁמּוֹת יִהְיוּ
  choice: станут пустынным местом
  rationale: היה с именной частью допускает значение «стать», а существительное מְשַׁמּוֹת обозначает опустошённое, безлюдное место или состояние запустения. Русский единственный оборот передаёт образ естественно, а неоднозначность отмечена в сноске.
- source_word: יָבֵשׁ חָצִיר
  choice: трава засохла
  rationale: Перфект описывает наступившее состояние; «засохла» кратко и естественно передаёт иссушение травы.
- source_word: כָּלָה דֶשֶׁא
  choice: зелень исчезла
  rationale: דֶשֶׁא — свежая поросль или растительность, а כָּלָה указывает на её полное исчезновение.
- source_word: יֶרֶק לֹא הָיָה
  choice: ничего зелёного не осталось
  rationale: Экзистенциальное отрицание завершает нарастающее описание полного отсутствия растительности; формулировка естественна по-русски.
