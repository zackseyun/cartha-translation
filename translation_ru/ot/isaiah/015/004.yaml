  source_fidelity: Перевод в целом точно передаёт синтаксическое движение стиха, персонификацию городов, предел «до Яхаца», причинно-следственную связь и трудную форму единственного числа в заключительной строке. Однако «вооружённые воины» избыточно удваивает один и тот же военный признак; חֲלֻצֵי естественнее передать как «вооружённые люди» (или «воины») без плеоназма. В заключительной строке «содрогается» точнее передаёт сильное внутреннее потрясение, не снимая синтаксической трудности оригинала.
