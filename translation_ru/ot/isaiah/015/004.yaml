  text: וַ/תִּזְעַ֤ק חֶשְׁבּוֹן֙ וְ/אֶלְעָלֵ֔ה עַד יַ֖הַץ נִשְׁמַ֣ע קוֹלָ֑/ם עַל כֵּ֗ן חֲלֻצֵ֤י מוֹאָב֙ יָרִ֔יעוּ נַפְשׁ֖/וֹ יָ֥רְעָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/004.yaml
  text: Heshbon and Elealeh cry out[a]; their voice is heard as far as Jahaz. Therefore the armed men of Moab cry out[b]; his soul trembles within him.
translation:
  language: ru
  text: Хешбон и Элеале вопиют; голос их слышен до самого Яхаца. Поэтому вооружённые люди Моава[a] кричат; его душа содрогается в нём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воины Моава». Древнееврейское слово обозначает людей, снаряжённых или вооружённых для боя.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза в древнееврейском тексте трудна. Возможно также: «душа его изнемогает в нём» или «душа его страдает за него». Единственное число может относиться к олицетворённому Моаву или к каждому из воинов.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְעַק
  choice: вопиют
  rationale: Глагол זעק обозначает громкий крик бедствия или тревоги. Настоящее время передаёт живость пророческой поэзии; множественное число естественно согласуется в русском с двумя названиями городов.
- source_word: חֶשְׁבּוֹן וְאֶלְעָלֵה
  choice: Хешбон и Элеале
  rationale: Имена городов переданы прямой транслитерацией с древнееврейского, без перевода их предполагаемого значения.
- source_word: עַד יַהַץ
  choice: до самого Яхаца
  rationale: עַד указывает на предел распространения звука; «до самого» естественно подчёркивает дальность, не добавляя нового смысла.
- source_word: נִשְׁמַע קוֹלָם
  choice: голос их слышен
  rationale: קוֹל может означать голос, звук или крик. «Голос» сохраняет образ олицетворённых городов и близок к форме оригинала.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Сочетание выражает следствие и связывает крик городов с реакцией моавских воинов.
- source_word: חֲלֻצֵי מוֹאָב
  choice: вооружённые воины Моава
  rationale: חֲלֻצִים здесь обозначает снаряжённых для боя людей. Перевод передаёт военный смысл, а возможная более общая передача отмечена в сноске.
- source_word: יָרִיעוּ
  choice: кричат
  rationale: Глагол обозначает громкий возглас и нередко употребляется в военной обстановке, но контекст бедствия не требует уточнять, что это именно боевой клич.
- source_word: נַפְשׁוֹ
  choice: душа его
  rationale: נֶפֶשׁ здесь указывает на внутреннее существо или самого человека. «Душа» сохраняет поэтический образ и намеренно не превращает его в техническое антропологическое утверждение.
- source_word: יָרְעָה לוֹ
  choice: трепещет в нём
  rationale: Трудная древнееврейская фраза передаёт внутреннее потрясение или бедствие. Этот вариант сохраняет образ внутреннего страха, а неопределённость конструкции отмечена в сноске.
theological_decisions:
- issue: Единственное число в заключительной фразе после множественного «воины Моава»
  choice: 'сохранено: «душа его… в нём»'
  alternative: 'множественное: «душа их трепещет в них» или обобщённое «сердца их трепещут»'
  rationale: Масоретский текст имеет местоименные суффиксы единственного числа. Они могут относиться к олицетворённому Моаву либо к каждому воину; перевод не устраняет эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной лексикой пророческой поэзии. «Вопиют» сохранено как уместное библейско-поэтическое слово, тогда как второе действие передано нейтральным «кричат», чтобы различить זעק и ריע. Пунктуация следует параллелизму стиха; все сноски отмечены в основном тексте.
