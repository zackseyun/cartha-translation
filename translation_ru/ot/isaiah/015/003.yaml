lexical_decisions:
- source_word: בְּחוּצֹתָיו
  choice: на его улицах
  rationale: חוּצוֹת обозначает открытые места города, обычно улицы; местоимение мужского рода согласуется с Моавом в ближайшем контексте.
- source_word: חָגְרוּ שָׂק
  choice: надели вретище
  rationale: Сочетание буквально означает «опоясались вретищем» и описывает принятие обычного знака траура; выбран естественный, но сохраняющий библейский образ оборот.
- source_word: עַל גַּגּוֹתֶיהָ
  choice: на его крышах
  rationale: גַּגּוֹת — плоские крыши домов, служившие местом публичного плача. Женский суффикс в еврейском может относиться к подразумеваемой земле или области, однако по-русски местоимение согласовано с Моавом.
- source_word: וּבִרְחֹבֹתֶיהָ
  choice: и площадях
  rationale: רְחֹבוֹת — широкие общественные пространства, площади; это сохраняет отличие от חוּצוֹת «улицы».
- source_word: כֻּלֹּה
  choice: все
  rationale: Формально «весь он/вся она», но в контексте слово собирательно обозначает всех жителей.
- source_word: יְיֵלִיל
  choice: рыдают
  rationale: Форма от ילל выражает громкий скорбный плач; «рыдают» естественно передаёт интенсивность, не привнося животного оттенка слова «воют».
- source_word: יֹרֵד בַּבֶּכִי
  choice: сходя в слезах
  rationale: Сохранён буквальный образ движения вниз в причастии יֹרֵד и его связь с плачем, хотя точный смысл выражения допускает как физический спуск, так и образ подавленности горем.
