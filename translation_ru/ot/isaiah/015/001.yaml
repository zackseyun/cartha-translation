  text: 'An oracle concerning Moab: because in a night Ar of Moab is devastated[a], it is destroyed; because in a night Kir of Moab is devastated[c][b], it is destroyed.'
translation:
  language: ru
  text: 'Пророчество[a] о Моаве:


    ибо в одну ночь[b] разорён Ар-Моав — он погиб[c];


    ибо в одну ночь разорён Кир-Моав — он погиб.'
  philosophy: optimal-equivalence
  footnotes:
