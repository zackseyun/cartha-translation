    text: 'Или: «Бремя о Моаве» или «Возвещение о Моаве». Еврейское слово מַשָּׂא служит заголовком пророческой речи, обычно возвещающей суд.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение буквально означает «в ночь» или «ночью»; оно подчёркивает внезапность бедствия. Возможный идиоматический перевод: «за одну ночь».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «он умолк», «он отсечён» или «он уничтожен». Еврейский глагол допускает эти оттенки; здесь контекст указывает на гибель города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: пророчество
  rationale: В заголовках пророческих речей слово обозначает возвещение, часто содержащее суд. «Пророчество» естественно для современного русского языка; буквальное «бремя» могло бы ошибочно восприниматься только как тяжесть.
- source_word: מוֹאָב
  choice: Моав
  rationale: Устоявшаяся русская передача названия земли и народа.
- source_word: כִּי
  choice: да
  rationale: Здесь частица вводит и подчёркивает содержание возвещения. «Да» сохраняет утвердительно-пояснительную силу, не навязывая причинной связи, которая по-русски после заголовка звучала бы неестественно.
- source_word: בְּלֵיל
  choice: за одну ночь
  rationale: Передаёт внезапность и совершение бедствия в пределах одной ночи, сохраняя акцент еврейского выражения.
- source_word: שֻׁדַּד
  choice: разорён
  rationale: Страдательная форма обозначает насильственное опустошение или разграбление; «разорён» не обязательно предполагает полное уничтожение.
- source_word: עָר מוֹאָב
  choice: Ар-Моав
  rationale: Передано как составное название моавитского города; дефисная форма естественна в русской библейской ономастике.
- source_word: נִדְמָה
  choice: погиб
  rationale: В контексте гибели городов глагол означает прекращение существования, уничтожение или низвержение. «Погиб» ясно выражает итог разорения, не повторяя дословно предыдущий глагол.
- source_word: קִיר מוֹאָב
  choice: Кир-Моав
  rationale: Передано как составное название моавитского города с сохранением обеих частей еврейского наименования.
