  text: כִּֽי הִקִּ֥יפָה הַ/זְּעָקָ֖ה אֶת גְּב֣וּל מוֹאָ֑ב עַד אֶגְלַ֨יִם֙ יִלְלָתָ֔/הּ וּ/בְאֵ֥ר אֵילִ֖ים יִלְלָתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/008.yaml
  text: For the outcry has gone around the border of Moab[a]; its wailing reaches as far as Eglaim[b], and its wailing to Beer-elim.
translation:
  language: ru
  text: Ибо вопль обошёл границы Моава[a]; до Эглаима доносится плач его, и в Беэр-Элиме — плач его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «охватил границы Моава». Еврейский глагол сохраняет образ вопля, обошедшего Моав кругом.'
    reason: lexical_alternative
  - marker: b
    text: Беэр-Элим — название места; возможно, оно означает «колодец Элима» или «колодец сильных».
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит пояснение к предшествующему плачу; «ведь» естественно передаёт эту связь в русском тексте.
- source_word: הִקִּיפָה
  choice: обошёл
  rationale: Глагол выражает движение вокруг или охват по кругу. «Обошёл границы» сохраняет пространственный образ и не сводит его лишь к распространению.
- source_word: הַזְּעָקָה
  choice: вопль
  rationale: Слово обозначает громкий крик бедствия; «вопль» передаёт силу и скорбный характер крика.
- source_word: אֶת גְּבוּל מוֹאָב
  choice: границы Моава
  rationale: גְּבוּל может обозначать границу или пределы территории. Множественное «границы» естественно сочетается в русском с образом вопля, обходящего Моав вокруг.
- source_word: עַד
  choice: до
  rationale: Предлог отмечает предел распространения плача и естественно передаётся русским «до».
- source_word: אֶגְלַיִם
  choice: Эглаим
  rationale: Географическое название передано транслитерацией.
- source_word: יִלְלָתָהּ
  choice: плач его
  rationale: יִלְלָה — скорбный плач или вой. Местоимение сохраняет женский суффикс еврейского текста по смысловой отсылке к воплю, хотя в русском согласуется с существительным мужского рода «вопль». Два еврейских вхождения объединены в естественную русскую конструкцию с двумя однородными направлениями.
- source_word: וּבְאֵר אֵילִים
  choice: и до Беэр-Элима
  rationale: Название продолжает перечень мест, до которых доносится плач; предлог «до» восстановлен из параллельной конструкции.
