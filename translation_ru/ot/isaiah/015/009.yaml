base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/009.yaml
  text: 'For the waters of Dimon are full of blood[a], for I will bring more upon Dimon: a lion upon the fugitives of Moab[c][b], and upon the remnant of the land.'
translation:
  language: ru
  text: 'Ибо воды Димона полны крови[a], ибо Я наведу на Димон ещё нечто[b]: льва — на беглецов Моава[c] и на оставшихся в земле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Димон», возможно, созвучно еврейскому слову «кровь» (дам); некоторые связывают этот топоним с Дивоном.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «положу (возложу) на Димон добавления». В еврейском тексте не сказано, что именно будет добавлено.'
    reason: alternative_reading
  - marker: c
    text: Лев может означать как настоящего льва, так и образ новой кары.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵי דִימוֹן
  choice: воды Димона
  rationale: Сохраняется масоретская форма топонима דִימוֹן и естественное для русского языка сочетание «воды Димона»; возможная связь с Дивоном и игра слов отмечены в сноске.
- source_word: מָלְאוּ דָם
  choice: полны крови
  rationale: Точно и выразительно передаёт конструкцию מלא с דָם, сохраняя краткость и зримый образ.
- source_word: אָשִׁית עַל דִּימוֹן נוֹסָפוֹת
  choice: Я наведу на Димон и новые бедствия
  rationale: שׂים עַל в контексте суда естественно передаётся как «навести на»; субстантивированное נוֹסָפוֹת буквально оставляет добавляемое неуточнённым, однако «бедствия» ясно передаёт контекст, а буквальная неопределённость указана в сноске.
- source_word: לִפְלֵיטַת מוֹאָב
  choice: на беглецов Моава
  rationale: פְלֵיטָה обозначает спасшихся или бежавших; в контексте разорения «беглецы» наиболее наглядно передаёт смысл.
- source_word: אַרְיֵה
  choice: льва
  rationale: Сохраняется конкретный образ исходного текста без решения вопроса, является ли лев буквальным или символическим.
- source_word: וְלִשְׁאֵרִית אֲדָמָה
  choice: и на уцелевших в этой земле
  rationale: Передаёт שְׁאֵרִית как оставшихся в живых, а אֲדָמָה — как землю Моава; указательное «этой» естественно выражает подразумеваемую контекстом территорию.
- source_word: כִּי ... כִּי
  choice: Ведь ... Я
  rationale: Первое כִּי передано объяснительным «ведь». Второе в русском тексте не повторено механически, чтобы избежать тяжеловесности; смысловая связь сохраняется последовательностью двух предложений.
theological_decisions:
- issue: Природа «льва» в пророчестве о суде
  choice: Сохранить конкретный образ «лев» без истолкования в основном тексте.
  alternative: Буквальный лев либо образ вражеской силы или нового бедствия.
  rationale: Еврейский текст не определяет референт образа, поэтому перевод не устраняет его подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Синтаксис сделан естественным для обычного читателя; образность и неоднозначность исходного текста сохранены.
