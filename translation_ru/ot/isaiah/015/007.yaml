  text: Поэтому накопленный ими избыток и их запасы они уносят через Поток Ив[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через вади Аравы» / «через долину пустынных равнин». Еврейское выражение неясно; традиционный перевод — «Поток Ив».'
    reason: alternative_reading
  - marker: b
    text: 'Выражение, переведённое как «их запасы», в еврейском тексте трудно для понимания; возможны также варианты: «их имущество» или «то, что было им вверено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְרָה עָשָׂה
  choice: нажитый ими достаток
  rationale: 'Сочетание буквально трудно: יִתְרָה обозначает избыток, остаток или достаток, а עָשָׂה — «сделал/приобрёл». В контексте бегства речь естественно понять как накопленное имущество; формулировка сохраняет идею приобретённого достатка без сведения её только к деньгам.'
- source_word: וּפְקֻדָּתָם
  choice: и свои запасы
  rationale: 'Значение существительного спорно: возможны «запасы», «имущество» или «вверенное им». В параллели с нажитым достатком «запасы» звучит естественно, а неоднозначность отмечена в сноске.'
- source_word: נַחַל
  choice: Поток
  rationale: Слово может обозначать поток, русло или вади — долину сезонного водотока. «Поток» доступен современному читателю и подходит для традиционного географического названия.
- source_word: הָעֲרָבִים
  choice: Ив
  rationale: Традиционное понимание связывает слово с ивами или тополями, откуда «Поток Ив». Возможная связь с Аравой или пустынными равнинами сохранена в сноске.
- source_word: יִשָּׂאוּם
  choice: они уносят
  rationale: Глагол נשׂא означает «нести». Форма с объектным суффиксом указывает на перенос упомянутых вещей; настоящее время передаёт живость пророческого описания.
