base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/005.yaml
  text: My heart cries out for Moab[a]; her fugitives flee as far as Zoar, as far as Eglath-shelishiyah. For they go up the ascent of Luhith with weeping[c][b]; for on the road to Horonaim they raise a cry of destruction.
translation:
  language: ru
  text: Моё сердце вопиет о Моаве! Беглецы из Моава[c] бегут до Цоара, до Эглат-Шелишии[a]. По подъёму в Лухит они поднимаются с плачем[b], а на пути в Хоронаим поднимают крик о гибели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эглат-Шелишия, вероятно, название места. Это выражение можно также понять буквально: «трёхлетняя телица».'
    reason: lexical_alternative
  - marker: b
    text: Еврейские глаголы в этом стихе переходят от единственного числа к множественному; в переводе множественное число передаёт совместное движение жителей Моава.
    reason: lexical_alternative
  - marker: c
    text: Еврейское בְּרִיחֶיהָ — трудное слово. Оно может означать «её беглецы» или «беженцы», как в переводе; буквальное значение — «её засовы» или «затворы», которое некоторые понимают метафорически либо считают требующим исправления текста по контексту.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי לְמוֹאָב יִזְעָק
  choice: Моё сердце вопиет о Моаве
  rationale: Сохраняется буквальный образ сердца как средоточия скорби; לְ передаёт направленность сострадания, а זעק — громкий, мучительный крик.
- source_word: בְּרִיחֶיהָ
  choice: его беглецы
  rationale: Форма трудна, но в контексте бегства к Цоару наиболее вероятно обозначает беглецов или беженцев. Местоимение согласовано с русским мужским родом названия «Моав».
- source_word: עַד צֹעַר
  choice: до Цоара
  rationale: עַד указывает предел движения; краткое «до» естественно передаёт это значение по-русски.
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  choice: Эглат-Шелишии
  rationale: В географическом ряду выражение, вероятнее всего, является названием места; транслитерация не устраняет сохраняющуюся лексическую неоднозначность.
- source_word: מַעֲלֵה הַלּוּחִית
  choice: по подъёму в Лухит
  rationale: Передаёт дорогу или склон, ведущий к Лухиту, и естественно сочетается с глаголом движения вверх.
- source_word: בִּבְכִי יַעֲלֶה בּוֹ
  choice: они поднимаются с плачем
  rationale: Единственное число еврейского глагола понято собирательно по контексту движения моавитян; русский перевод использует множественное число для ясности.
- source_word: דֶּרֶךְ חוֹרֹנַיִם
  choice: на дороге в Хоронаим
  rationale: Естественное русское обозначение пути, ведущего к названному месту.
- source_word: זַעֲקַת שֶׁבֶר
  choice: крик о гибели
  rationale: שֶׁבֶר здесь обозначает сокрушительное бедствие и крах, а не буквальный перелом; «гибель» передаёт трагическую силу выражения.
- source_word: יְעֹעֵרוּ
  choice: поднимают
  rationale: При существительном «крик» русский оборот «поднимают крик» идиоматично передаёт буквальную идею возбуждения или пробуждения крика.
