base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/002.yaml
  text: He has gone up to the temple[a], and Dibon to the high places, to weep. Over Nebo and over Medeba Moab wails; on every head is baldness[b], every beard is cut off.
translation:
  language: ru
  text: Он поднялся в храм[a], и Дивон — на высоты, чтобы плакать. Над Нево и над Медевой рыдает Моав; на всех головах — плешь[b], все бороды сбриты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в дом». В данном контексте еврейское слово, вероятно, обозначает культовое святилище или храм.'
    reason: lexical_alternative
  - marker: b
    text: Плешь и сбритая борода служили знаками скорби.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה
  choice: поднялся
  rationale: Форма qal perfect 3 м. р. ед. ч. обозначает совершившееся действие; прошедшее время естественно передаёт его в русском повествовании-плаче.
- source_word: הַבַּיִת
  choice: в храм
  rationale: Буквально «в дом», однако сочетание с культовыми высотами указывает здесь, вероятнее всего, на святилище. Возможность буквального понимания сохранена в сноске.
- source_word: וְדִיבֹן
  choice: а Дивон
  rationale: Название города передано традиционной русской транслитерацией. Эллиптическая конструкция сохраняет Дивон как коллективно понимаемый субъект при подразумеваемом глаголе «поднялся», не добавляя отсутствующего в еврейском тексте предлога.
- source_word: הַבָּמוֹת
  choice: на высоты
  rationale: Слово обозначает культовые возвышения; «высоты» сохраняет традиционный религиозный смысл и конкретную пространственную образность.
- source_word: לְבֶכִי
  choice: чтобы плакать
  rationale: Предлог ל при существительном выражает цель; придаточное цели звучит естественно по-русски.
- source_word: נְבוֹ
  choice: Нево
  rationale: Географическое название передано в принятой русской форме.
- source_word: מֵידְבָא
  choice: Медева
  rationale: Географическое название передано в принятой русской библейской форме.
- source_word: מוֹאָב
  choice: Моав
  rationale: Название страны и народа передано в принятой русской форме; здесь оно имеет коллективный смысл.
- source_word: יְיֵלִיל
  choice: рыдает
  rationale: Глагол выражает громкий скорбный плач; «рыдает» передаёт силу чувства, не придавая ему животного оттенка слова «воет».
- source_word: בְּכָל רֹאשָׁיו קָרְחָה
  choice: на каждой голове — плешь
  rationale: Коллективный суффикс при Моаве передан распределительно. Именная конструкция и образ наготы головы сохранены без сведения их к естественному облысению.
- source_word: כָּל זָקָן גְּרוּעָה
  choice: всякая борода острижена
  rationale: Сохраняется параллелизм с предыдущей строкой и буквальный образ обрезанной в знак скорби бороды.
