base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/008.yaml
  text: For the moth will eat them like a garment[a], and the worm will eat them like wool; but my righteousness will be forever, and my salvation to generation after generation.
translation:
  language: ru
  text: Ибо моль съест их, словно одежду, и червь — словно шерсть; но Моя праведность[a] пребудет вовеки, и Моё спасение — из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моя справедливость»; еврейское слово может обозначать как праведность и правоту, так и справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего призыва; «ибо» ясно сохраняет причинную связь и соответствует возвышенному поэтическому регистру.
- source_word: כַבֶּגֶד
  choice: как одежду
  rationale: בֶּגֶד обозначает одежду или предмет одежды; форма «одежду» естественно согласуется с переходным глаголом «съест».
- source_word: יֹאכְלֵם
  choice: съест их
  rationale: Сохраняется яркий буквальный образ глагола אכל «есть, пожирать» и контекстуальное будущее значение имперфекта.
- source_word: עָשׁ
  choice: моль
  rationale: Речь идёт о моли, уничтожающей ткань; в русском родовое употребление естественно без артикля.
- source_word: וְכַצֶּמֶר
  choice: и… как шерсть
  rationale: צֶמֶר — «шерсть»; перевод сохраняет параллелизм двух сравнений.
- source_word: סָס
  choice: червь
  rationale: Редкое слово обозначает существо, разрушающее шерсть, вероятно личинку или червя; «червь» сохраняет образ, не вводя чрезмерной биологической конкретизации.
- source_word: וְצִדְקָתִי
  choice: но Моя праведность
  rationale: צְדָקָה охватывает праведность, правоту и справедливость. «Праведность» сохраняет моральную и заветную широту, а «но» выражает очевидное противопоставление преходящести людей и вечности Божьего действия.
- source_word: לְעוֹלָם תִּהְיֶה
  choice: пребудет вовеки
  rationale: Естественная для русской библейской поэзии формула передаёт как длительное существование, так и неограниченную продолжительность.
- source_word: וִישׁוּעָתִי
  choice: и Моё спасение
  rationale: יְשׁוּעָה означает спасение или избавление; «спасение» уместно передаёт широкое богословское и литературное значение в Исаии.
- source_word: לְדֹר דּוֹרִים
  choice: из поколения в поколение
  rationale: Русская идиома естественно передаёт непрерывность через череду поколений и сохраняет повторительный характер еврейского выражения.
theological_decisions:
- issue: Передача צִדְקָה в пророческом контексте
  choice: праведность
  alternative: справедливость / правосудие
  rationale: В сочетании со спасением слово обозначает не только судебную справедливость, но также Божью правоту и верность правильному порядку. Основной перевод сохраняет эту широту, а примечание указывает значимую альтернативу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Формы «ибо», «пребудет» и «вовеки» уместны для пророческого стиха, но остаются понятными современному читателю. Заглавные буквы в притяжательных местоимениях применены к словам Бога согласно распространённой русской библейской издательской норме.
