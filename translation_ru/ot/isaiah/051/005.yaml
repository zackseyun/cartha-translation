base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/005.yaml
  text: My righteousness is near[a], my salvation has gone out, and my arms will judge the peoples; the coastlands will wait for me[c][b], and for my arm they will hope.
translation:
  language: ru
  text: Моя праведность близка[a], Моё спасение явилось, и руки Мои будут судить народы[b]; дальние берега[c] будут ждать Меня и на руку Мою будут надеяться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моя справедливость близка»; еврейское слово может означать праведность, справедливость или оправдание.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь стоит множественное число — «руки Мои», а далее в стихе единственное — «руку Мою». Это образ действенной силы Господа.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «острова», «отдалённые приморские земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב צִדְקִי
  choice: Близка праведность Моя
  rationale: Именное сказуемое передано естественной для возвышенной русской речи инверсией; קָרוֹב выражает наличную близость, а צֶדֶק сохраняет широкий смысл праведности и справедливости.
- source_word: יָצָא יִשְׁעִי
  choice: вышло спасение Моё
  rationale: Совершенный вид передаёт qatal как совершившееся действие с актуальным результатом; сохранён конкретный образ выхода.
- source_word: וּזְרֹעַי
  choice: и руки Мои
  rationale: Передано морфологическое множественное число еврейского текста и сохранён антропоморфный образ деятельной силы Бога.
- source_word: עַמִּים יִשְׁפֹּטוּ
  choice: будут судить народы
  rationale: Сохранены множественное число подлежащего и основной судебный смысл שׁפט; русское будущее соответствует несовершенной форме в пророческом контексте.
- source_word: אִיִּים
  choice: дальние берега
  rationale: В книге Исаии слово обозначает не только острова, но и отдалённые приморские земли; этот вариант естественен по-русски и не сужает референцию до островов.
- source_word: יְקַוּוּ
  choice: будут ждать
  rationale: Передано ожидающее устремление; отличие от последующего יחל сохранено средствами русской лексики.
- source_word: וְאֶל זְרֹעִי יְיַחֵלוּן
  choice: и на руку Мою будут надеяться
  rationale: Предлог אל естественно передан управлением русского глагола «надеяться»; единственное число זְרֹעִי и образ руки сохранены.
theological_decisions:
- issue: Значение צֶדֶק в пророчестве о спасении
  choice: праведность Моя
  alternative: справедливость Моя; оправдание Моё
  rationale: «Праведность» сохраняет широкий богословский и заветный смысл слова рядом со «спасением», не сводя его только к судебному правосудию; контекстуально возможная «справедливость» отмечена в сноске.
- issue: Образ руки/рук Бога
  choice: сохранить буквальный образ «руки Мои / руку Мою»
  alternative: сила Моя; могущество Моё
  rationale: Пророческая метафора представляет силу Бога в действии. Буквальная передача сохраняет образность и заметную смену множественного числа на единственное.
- issue: Суд над народами
  choice: будут судить народы
  alternative: будут править народами
  rationale: שׁפט может включать управление, однако ближайший контекст праведности поддерживает основной судебный смысл; неоднозначность власти и суда не разворачивается в конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой инверсией. Сохранены параллелизм, антропоморфный образ руки и различие между «ждать» и «надеяться». Все сносочные маркеры помещены непосредственно после соответствующих выражений.
