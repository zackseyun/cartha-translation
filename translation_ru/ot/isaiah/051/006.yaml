source:
  edition: WLC
  text: שְׂאוּ֩ לַ/שָּׁמַ֨יִם עֵֽינֵי/כֶ֜ם וְֽ/הַבִּ֧יטוּ אֶל הָ/אָ֣רֶץ מִ/תַּ֗חַת כִּֽי שָׁמַ֜יִם כֶּ/עָשָׁ֤ן נִמְלָ֨חוּ֙ וְ/הָ/אָ֨רֶץ֙ כַּ/בֶּ֣גֶד תִּבְלֶ֔ה וְ/יֹשְׁבֶ֖י/הָ כְּמוֹ כֵ֣ן יְמוּת֑וּ/ן וִ/ישֽׁוּעָתִ/י֙ לְ/עוֹלָ֣ם תִּֽהְיֶ֔ה וְ/צִדְקָתִ֖/י לֹ֥א תֵחָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/006.yaml
  text: Lift up your eyes to the heavens[a], and look at the earth beneath; for the heavens will vanish like smoke, and the earth will wear out like a garment, and its inhabitants will die likewise. But my salvation will be forever[b], and my righteousness will not be shattered.
translation:
  language: ru
  text: 'Поднимите глаза к небесам и посмотрите на землю внизу: небеса исчезнут, как дым[a], земля износится, как одежда, и её жители так же умрут. Но Моё спасение пребудет вовеки, и Моя праведность[b] не сокрушится.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «рассеются, как дым». Еврейский глагол редок и труден для истолкования; общий смысл состоит в том, что небеса исчезнут.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Моя справедливость». Еврейское слово может обозначать и праведность, и справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ ... עֵינֵיכֶם
  choice: Поднимите глаза
  rationale: Множественное повелительное от נשׂא с прямым дополнением «ваши глаза»; русское выражение естественно и сохраняет конкретный образ.
- source_word: לַשָּׁמַיִם
  choice: к небесам
  rationale: Форма שׁמים морфологически множественная и здесь противопоставлена земле; «небеса» передаёт космический масштаб.
- source_word: וְהַבִּיטוּ אֶל הָאָרֶץ מִתַּחַת
  choice: и посмотрите на землю внизу
  rationale: Простое повеление сохраняет параллелизм; «земля» соответствует космической паре «небеса — земля», а מִתַּחַת обозначает её положение внизу.
- source_word: נִמְלָחוּ
  choice: исчезнут
  rationale: Редкий и трудный глагол в контексте означает прекращение существования или рассеивание небес. Ясный русский эквивалент передаёт общий смысл, а более конкретная возможность отмечена в сноске.
- source_word: כֶּעָשָׁן
  choice: как дым
  rationale: Прямо сохранено сравнение с дымом.
- source_word: תִּבְלֶה כַּבֶּגֶד
  choice: износится, как одежда
  rationale: בלה обозначает обветшание или изнашивание; перевод сохраняет образ изношенной одежды.
- source_word: וְיֹשְׁבֶיהָ
  choice: и её жители
  rationale: Субстантивированное причастие обозначает живущих на земле; краткий и естественный русский эквивалент.
- source_word: כְּמוֹ כֵן
  choice: так же
  rationale: Передаёт соответствие участи жителей предшествующим образам преходящих небес и земли, не уточняя сверх текста характер этого соответствия.
- source_word: לְעוֹלָם תִּהְיֶה
  choice: пребудет вовеки
  rationale: «Пребудет» уместно для возвышенной пророческой речи, а «вовеки» передаёт длительность לְעוֹלָם.
- source_word: לֹא תֵחָת
  choice: не сокрушится
  rationale: Форма от חתת выражает сокрушение или разрушение; перевод сохраняет сильный образ и параллель с вечностью спасения.
theological_decisions:
- issue: Передача צִדְקָתִי
  choice: Моя праведность
  alternative: Моя справедливость
  rationale: צדקה охватывает праведность, справедливость и верность Божьему спасительному порядку. «Праведность» сохраняет широту богословского смысла, а судебный оттенок отмечен в сноске.
- issue: Характер соответствия в כְּמוֹ כֵן
  choice: так же умрут
  alternative: умрут, как мошкара
  rationale: Масоретский текст содержит כְּמוֹ כֵן («так же»), хотя некоторые переводы связывают выражение с возможным обозначением мошкары. Основной текст следует засвидетельствованной огласовке и не вводит спорный образ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены космический параллелизм, три образа преходящести и противопоставление вечного Божьего спасения и праведности. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
