  source_fidelity: Черновик точно передаёт призывы, имя Яхве, образ чаши ярости и мысль о полном испитии. Однако мужские формы «выпил» ослабляют ясно выраженный в еврейском женский род обращения к персонифицированному Иерусалиму. Кроме того, в основном тексте чрезмерно сглажено отдельное обозначение сосуда קֻבַּעַת, тогда как сноска не вполне точно отражает синтаксис оригинала.
  naturalness: «Пробудись, пробудись, встань» и «осушила её до дна» естественны для современного литературного русского и сохраняют возвышенную пророческую интонацию. Формула «чашу — кубок, от которого шатает» передаёт накопление образов сосуда более прозрачно, чем буквальное, но неестественное «кубок чаши шатания».
  terminology: «Яхве» последовательно передаёт יהוה. «Ярость» допустимо передаёт חֵמָה. «Шатание» сохраняет образ дезориентации, не сводя его к одному догматическому толкованию.
