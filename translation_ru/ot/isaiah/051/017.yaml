base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/017.yaml
  text: Awake[a], awake, rise up, Jerusalem, you who have drunk from the hand of Yahweh the cup of his wrath; you have drunk the bowl, the cup of staggering[c][b]; you have drained it dry.
translation:
  language: ru
  text: Пробудись, пробудись, встань, Иерусалим! Ты испила из руки Яхве чашу Его ярости; ты выпила чашу — кубок, от которого шатает, — и осушила её до дна.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чашу — чашеобразный сосуд, чашу шатания — ты выпила, осушила». Еврейское слово обозначает шатание или потерю устойчивости, вызываемые напитком; традиционный вариант перевода: «чаша трепета».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוֹרְרִי הִתְעוֹרְרִי
  choice: Пробудись, пробудись
  rationale: Возвратная форма повеления женского рода обращена к олицетворённому Иерусалиму; повтор передаёт настойчивость призыва. «Пробудись» естественно и достойно звучит в современной русской поэзии.
- source_word: קוּמִי
  choice: встань
  rationale: Повеление женского рода продолжает прямое обращение к Иерусалиму и буквально передаёт призыв подняться.
- source_word: מִיַּד יְהוָה
  choice: из руки Яхве
  rationale: Сохранён образ руки как источника и орудия судебного действия Бога, а личное имя יהוה передано как «Яхве».
- source_word: כּוֹס חֲמָתוֹ
  choice: чашу Его ярости
  rationale: Сохранена пророческая метафора чаши; «ярость» передаёт силу חֵמָה и контекст Божьего гнева.
- source_word: קֻבַּעַת כּוֹס הַתַּרְעֵלָה
  choice: чашу, от которой шатает
  rationale: קֻבַּעַת обозначает чашеобразный сосуд, а הַתַּרְעֵלָה — вызываемое питьём шатание. По-русски единый образ без неестественного нагромождения «кубок чаши» яснее передаёт смысл.
- source_word: שָׁתִית מָצִית
  choice: выпил до дна
  rationale: Сочетание глаголов подчёркивает полное осушение сосуда; русская идиома естественно выражает исчерпанность чаши страдания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Образ чаши Божьей ярости
  choice: Метафора сохранена
  alternative: Разъясняющий пересказ «ты перенёс Божий суд»
  rationale: Текст изображает Иерусалим пьющим из Божьей руки; сохранение образа удерживает как судебный смысл, так и поэтическое напряжение.
- issue: Отношение двух обозначений сосуда
  choice: Передано как повторно уточняемый образ одной чаши
  alternative: «кубок, чашу, от которой шатает»
  rationale: Еврейская конструкция допускает близкое приложение и накопление образов. В русском буквальное удвоение названий сосуда звучало бы неясно, поэтому сохранены чаша, её действие и полное осушение.
translation_notes:
  register: Современный литературный русский с возвышенной пророческой интонацией. Женский род повелений и глаголов подразумевается обращением к олицетворённому городу, хотя в русском прошедшее время при названии «Иерусалим» грамматически оформлено мужским родом. Повтор и метафора чаши сохранены; громоздкое буквальное сочетание двух сосудов сглажено с пояснением в сноске.
