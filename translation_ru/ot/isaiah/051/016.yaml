source:
  edition: WLC
  text: וָ/אָשִׂ֤ים דְּבָרַ/י֙ בְּ/פִ֔י/ךָ וּ/בְ/צֵ֥ל יָדִ֖/י כִּסִּיתִ֑י/ךָ לִ/נְטֹ֤עַ שָׁמַ֨יִם֙ וְ/לִ/יסֹ֣ד אָ֔רֶץ וְ/לֵ/אמֹ֥ר לְ/צִיּ֖וֹן עַמִּ/י אָֽתָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/016.yaml
  text: And I have put my words in your mouth[a], and covered you with the shadow of my hand, to plant the heavens and to found the earth, and to say to Zion[b], ‘You are my people.’
translation:
  language: ru
  text: 'И Я вложил Мои слова в твои уста и укрыл тебя тенью Моей руки[a], чтобы насадить небеса[b], основать землю и сказать Сиону: «Ты — Мой народ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укрыл тебя под тенью Моей руки»; предлог может передавать как средство укрытия, так и пребывание под защитной тенью.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «насадить небеса». Это необычный образ; по смыслу возможно также «утвердить небеса», однако перевод сохраняет глагол «насаждать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  choice: И Я вложил
  rationale: Форма от שׂים означает «класть, помещать». Прошедшее совершенного вида согласуется с параллельным כִּסִּיתִיךָ и передаёт уже совершённое либо твёрдо удостоверенное действие; «вложил» естественно сочетается со словами и устами.
- source_word: דְּבָרַי בְּפִיךָ
  choice: Мои слова в твои уста
  rationale: Сохранены множественное число «слова» и образ пророческого поручения — слова помещаются «в уста», а не более истолковывающее «на губы».
- source_word: וּבְצֵל יָדִי כִּסִּיתִיךָ
  choice: укрыл тебя тенью Моей руки
  rationale: כסה буквально означает «покрывать, укрывать», а צל — «тень». Русское «укрыл тенью» естественно передаёт защитный смысл, не устраняя образ руки и тени.
- source_word: לִנְטֹעַ שָׁמַיִם
  choice: чтобы насадить небеса
  rationale: נטע обычно означает «сажать, насаждать». Намеренно сохранён необычный образ, а не заменён более привычным «распростереть» или истолковывающим «утвердить».
- source_word: וְלִיסֹד אָרֶץ
  choice: основать землю
  rationale: יסד означает «основывать, закладывать основание». «Основать землю» кратко сохраняет образ основания и параллелизм с насаждением небес.
- source_word: וְלֵאמֹר לְצִיּוֹן
  choice: и сказать Сиону
  rationale: אמר — обычный глагол «сказать»; более торжественное «возвестить» неоправданно усилило бы выражение.
- source_word: עַמִּי אָתָּה
  choice: Ты — Мой народ
  rationale: Сохранено прямое обращение к олицетворённому Сиону в мужском роде и формула принадлежности «Мой народ».
theological_decisions:
- issue: К кому относится второе лицо единственного числа («твои уста», «укрыл тебя»)
  choice: Оставлено прямое обращение в единственном числе без уточнения адресата.
  alternative: Назвать адресатом Раба, пророка либо собирательный Израиль/Сион.
  rationale: В самом стихе адресат прямо не назван. Уточнение сняло бы подлинную неоднозначность еврейского текста.
- issue: Смысл выражений «насадить небеса» и «основать землю»
  choice: В основном тексте сохранён космический язык творения.
  alternative: Передать эти слова исключительно как метафору восстановления Израиля или нового творения.
  rationale: У Исаии образы творения и избавления могут переплетаться. Перевод не должен заранее ограничивать выражение только буквальным космологическим или только метафорическим смыслом.
- issue: Связь целевых инфинитивов с предшествующими действиями
  choice: Передана общей конструкцией «чтобы…», без дополнительного указания действующего лица.
  alternative: Явно приписать насаждение небес и основание земли Богу либо адресату речи.
  rationale: Еврейская синтаксическая связь допускает обсуждение роли адресата, поэтому перевод сохраняет формальную открытость конструкции.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Образы «уста», «тень руки», «насадить небеса» и «основать землю» сохранены ради точности и поэтической силы. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской издательской традицией; это не меняет смысла оригинала.
