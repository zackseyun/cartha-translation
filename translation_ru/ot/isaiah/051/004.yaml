base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/004.yaml
  text: Pay attention to me[a], my people, and give ear to me, my nation; for instruction will go out from me[c][b], and I will set my justice as a light for the peoples.
translation:
  language: ru
  text: Слушайте Меня, народ Мой, и внимайте Мне, племя Моё! Ведь от Меня выйдет наставление[a], и правосудие Моё[b] Я утвержу как свет для народов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закон» или «учение» (евр. תּוֹרָה).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «суд Мой» или «решение Моё» (евр. מִשְׁפָּטִי).'
    reason: lexical_alternative
  - marker: c
    text: 'Последний еврейский глагол труден для истолкования. Возможны также переводы: «Я установлю» или «Я дам ему [правосудию] покой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: Слушай
  rationale: Повелительная форма призывает к сосредоточенному слушанию. В русском обращение к собирательному существительному «народ» естественно передаётся единственным числом.
- source_word: עַמִּי
  choice: народ Мой
  rationale: Сохраняет прямое обращение к народу, принадлежащему Богу, и возвышенный поэтический порядок слов.
- source_word: וּלְאוּמִּי
  choice: племя Моё
  rationale: לְאֹם означает народ или этническую общность. «Племя» позволяет сохранить лексическое различие с עַם, хотя в современном русском звучит несколько поэтически.
- source_word: הַאֲזִינוּ
  choice: внимай
  rationale: Передаёт второй, параллельный призыв слушать внимательно, не сводя оба еврейских глагола к одному русскому слову.
- source_word: תּוֹרָה
  choice: наставление
  rationale: 'В данном контексте речь может идти шире, чем о своде законов: об исходящем от Бога авторитетном учении. Возможный вариант «закон» отмечен в сноске.'
- source_word: תֵצֵא
  choice: выйдет
  rationale: Прямо передаёт движение от Бога к народам и сохраняет образ исходящего наставления.
- source_word: וּמִשְׁפָּטִי
  choice: правосудие Моё
  rationale: מִשְׁפָּט может означать суд, судебное решение или справедливый порядок. «Правосудие» хорошо сочетается с положительным образом света, но неоднозначность отмечена в сноске.
- source_word: לְאוֹר עַמִּים
  choice: как свет для народов
  rationale: Естественно передаёт предназначение Божьего правосудия и сохраняет множественное число и всеобщий горизонт выражения.
- source_word: אַרְגִּיעַ
  choice: Я утвержу
  rationale: Трудная форма Hiphil от רגע может выражать установление или приведение к покою. «Утвержу» даёт связный русский смысл, не превращая действие в простое провозглашение; другие возможности указаны в сноске.
- source_word: עַמִּים
  choice: народов
  rationale: Множественное число обозначает разные народы, которым Божье правосудие служит светом.
theological_decisions:
- issue: Объём значения תּוֹרָה и מִשְׁפָּט по отношению к народам
  choice: Стих говорит о Божьем наставлении и правосудии, обращённых к народам.
  alternative: Понимать תּוֹרָה узко как Моисеев закон, предназначенный только Израилю.
  rationale: Прямое упоминание «народов» и движение наставления «от Меня» указывают на широкий горизонт, не требуя привнесения более поздней богословской системы.
- issue: Передача מִשְׁפָּט
  choice: правосудие Моё
  alternative: суд Мой; решение Моё
  rationale: Образ света допускает положительный смысл Божьего справедливого порядка. Сноска сохраняет возможность судебного значения.
- issue: Понимание אַרְגִּיעַ
  choice: Я утвержу
  alternative: Я установлю; Я дам ему покой
  rationale: Еврейская форма трудна и допускает связь как с установлением, так и с приведением к покою. Основной текст выбирает контекстуально связное чтение, а сноска сохраняет реальную неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Единственное число повелительных форм согласовано с собирательными обращениями «народ» и «племя». Инверсия «народ Мой», «правосудие Моё» сохраняет достоинство и поэтический строй без излишней архаизации.
