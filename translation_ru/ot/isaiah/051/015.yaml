  text: וְ/אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ רֹגַ֣ע הַ/יָּ֔ם וַ/יֶּהֱמ֖וּ גַּלָּ֑י/ו יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/015.yaml
  text: For I am Yahweh your God[b][a], who stirs up the sea so that its waves roar— Yahweh of hosts is his name.
translation:
  language: ru
  text: Ибо Я — Яхве, твой Бог, вздымающий море[a], так что ревут его волны. Яхве Воинств — Его имя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «усмиряющий море, так что ревут его волны». Еврейское причастие может означать как приведение моря в волнение, так и его усмирение; упоминание ревущих волн здесь склоняет к первому значению.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по еврейскому тексту: «Его имя». По смыслу прямой речи можно было бы ожидать «Моё имя», однако масоретский текст сохраняет третье лицо.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Ведь Я
  rationale: Союз при самостоятельном местоимении продолжает предыдущее заверение и подчёркивает говорящего; «ведь» естественно передаёт пояснительный оттенок в контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Прямая передача существительного с суффиксом второго лица мужского рода единственного числа; обращение в русском языке остаётся личным и заветным.
- source_word: רֹגַע הַיָּם
  choice: вздымающий море
  rationale: Причастие допускает толкование как приведение моря в движение либо его усмирение. Последующее «ревут его волны» в данном контексте лучше согласуется со значением возбуждения моря; «вздымающий» естественно передаёт этот образ.
- source_word: וַיֶּהֱמוּ גַּלָּיו
  choice: так что ревут его волны
  rationale: Конструкция передана как результат воздействия на море. Настоящее время соответствует обобщающему причастному описанию Божьего действия, а «ревут» сохраняет звуковой и бурный образ.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняется традиционный и достаточно формальный смысл титула צְבָאוֹת без сужения до одних земных армий.
- source_word: שְׁמוֹ
  choice: имя Его
  rationale: Суффикс в масоретском тексте имеет третье лицо; перевод не сглаживает его до ожидаемого в прямой речи «Моё имя».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя передано транслитерацией, а не заменено титулом; это сохраняет лексическое различие исходного текста.
- issue: Значение רֹגַע применительно к морю
  choice: вздымающий море
  alternative: усмиряющий море; успокаивающий море
  rationale: Обе смысловые возможности отмечены, но непосредственное продолжение о ревущих волнах склоняет к значению возбуждения или вздымания моря. Альтернатива сохранена в сноске, чтобы не скрывать подлинную неоднозначность.
- issue: Лицо местоименного суффикса в שְׁמוֹ
  choice: имя Его
  alternative: имя Моё
  rationale: Несмотря на переход внутри прямой речи, еврейский текст имеет форму третьего лица. Она сохранена без гармонизации с первым лицом начала стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные буквы в «Я», «Его» отражают традиционное почтительное оформление речи о Боге, не меняя грамматического значения. Порядок фраз близок к еврейскому, но результативная связь выражена естественным русским оборотом «так что».
