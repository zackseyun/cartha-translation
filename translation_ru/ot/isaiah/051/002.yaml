base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/002.yaml
  text: Look to Abraham your father and to Sarah who bore you; for I called him when he was one[a], and I blessed him and multiplied him.
translation:
  language: ru
  text: 'Взгляните на Авраама, вашего отца, и на Сарру, родившую вас: ведь Я призвал его, когда он был один[a], благословил его и умножил его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я призвал его, когда он был в одиночестве». Буквально: «одного».'
    reason: 'Лексическая альтернатива для אֶחָד: слово означает «один» и может подчёркивать, что Авраам был один, прежде чем Бог сделал его многочисленным.'
lexical_decisions:
- source_word: הַבִּיטוּ
  choice: Взгляните на
  rationale: Повелительная форма множественного числа сохраняет образ направленного взгляда и призыв обратиться к Аврааму и Сарре как к примеру.
- source_word: אַבְרָהָם אֲבִיכֶם
  choice: Авраама, отца вашего
  rationale: Сохраняется прямой смысл родственного и заветного наименования; порядок слов придаёт русскому тексту сдержанно-библейское достоинство.
- source_word: שָׂרָה תְּחוֹלֶלְכֶם
  choice: Сарру, родившую вас
  rationale: Причастный оборот естественно передаёт материнский образ глагола, связанного с родовыми муками и рождением.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание предшествующего призыва и звучит естественно в современном литературном русском.
- source_word: אֶחָד
  choice: одного
  rationale: Сохраняет буквальное «один» и одновременно естественно указывает, что при призвании Авраам был один; возможное понимание «в одиночестве» отмечено в сноске.
- source_word: קְרָאתִיו
  choice: Я призвал его
  rationale: Передаёт обычное значение קרא в контексте Божьего призвания, не уточняя сверх текста характер призыва.
- source_word: וַאֲבָרְכֵהוּ
  choice: благословил его
  rationale: Прямо и точно передаёт ברך и сохраняет заветный смысл.
- source_word: וְאַרְבֵּהוּ
  choice: умножил
  rationale: Кратко передаёт каузативное значение רבה — сделать многочисленным; объект легко восстанавливается из предыдущего оборота и не требует тяжеловесного повторения.
theological_decisions:
- issue: Значение אֶחָד применительно к состоянию Авраама при призвании
  choice: Я призвал его одного
  alternative: Я призвал его, когда он был один / Я призвал его в одиночестве
  rationale: Основной текст сохраняет конкретное еврейское «один» и мысль о происхождении множества от одного человека. Сноска удерживает возможный оттенок одиночества, не подменяя им компактную неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский с dignified библейской интонацией. Формы «отца вашего» и «родившую вас» ясны обычному читателю, сохраняют параллелизм отцовского и материнского образов и не вводят конфессиональных уточнений.
