  text: לָ/כֵ֛ן שִׁמְעִי נָ֥א זֹ֖את עֲנִיָּ֑ה וּ/שְׁכֻרַ֖ת וְ/לֹ֥א מִ/יָּֽיִן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/021.yaml
  text: 'Therefore, please hear this, afflicted one, drunk, but not from wine:'
translation:
  language: ru
  text: 'Поэтому выслушай, прошу, это, страдалица, пьяная, но не от вина:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод или следствие, связывающее призыв с предшествующим контекстом.
- source_word: שִׁמְעִי נָא
  choice: выслушай же
  rationale: Форма повелительного наклонения обращена к женщине; частица נָא передана смягчающим и настойчивым «же», естественным для современного русского языка.
- source_word: עֲנִיָּה
  choice: страдалица
  rationale: Субстантивированное обращение женского рода сохраняет образ той, которая терпит бедствие и угнетение.
- source_word: וּשְׁכֻרַת
  choice: опьяневшая
  rationale: Сохраняет женский род и состояние опьянения, которое следующая фраза парадоксально отделяет от вина.
- source_word: וְלֹא מִיָּיִן
  choice: но не от вина
  rationale: Противительное «но» естественно выражает смысловой контраст еврейского וְ в данном контексте; מִן передано как указание на источник состояния.
theological_decisions:
- issue: Причина опьянения
  choice: Не уточнять, чем именно вызвано опьянение
  alternative: Добавить указание на Божий гнев или чашу суда
  rationale: Сам стих говорит лишь «не от вина»; конкретизация появляется из контекста и не должна вноситься непосредственно в перевод этого стиха.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Женский род всех обращений сохранён; двоеточие оставлено как переход к последующей речи.
