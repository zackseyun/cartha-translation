source:
  edition: WLC
  text: וּ/פְדוּיֵ֨י יְהוָ֜ה יְשׁוּב֗וּ/ן וּ/בָ֤אוּ צִיּוֹן֙ בְּ/רִנָּ֔ה וְ/שִׂמְחַ֥ת עוֹלָ֖ם עַל רֹאשָׁ֑/ם שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יַשִּׂיג֔וּ/ן נָ֖סוּ יָג֥וֹן וַ/אֲנָחָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/011.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing[a]; everlasting joy will be upon their heads; gladness and joy will overtake them[b]; sorrow and sighing will flee away.
translation:
  language: ru
  text: И искупленные Яхве вернутся и придут на Сион с ликованием[a]. Вечная радость будет на их головах; веселье и радость настигнут их[b], а скорбь и стенание убегут прочь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с радостными возгласами»; еврейское слово может обозначать как ликующее пение, так и торжествующий крик.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «достигнут их». Еврейский глагол буквально означает «догнать, настичь»; здесь веселье и радость изображены как те, кто следует за людьми и настигает их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְדוּיֵי
  choice: искупленные
  rationale: Страдательное причастие от פדה обозначает тех, кто был выкуплен или избавлен; «искупленные» естественно передаёт образ избавления, не расширяя его толкованием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: יְשׁוּבוּן
  choice: вернутся
  rationale: שוב обычно означает возвращение; будущее время соответствует контексту грядущего восстановления.
- source_word: וּבָאוּ
  choice: и придут
  rationale: Сохраняет прямое значение בוא и последовательность двух глаголов движения.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Сохранено собственное имя и его поэтико-богословское звучание.
- source_word: בְּרִנָּה
  choice: с ликованием
  rationale: רִנָּה обозначает звучное радостное выражение — пение или торжествующий возглас; «с ликованием» естественно охватывает оба оттенка.
- source_word: שִׂמְחַת עוֹלָם
  choice: вечная радость
  rationale: Кратко и естественно передаёт буквальное «радость вечности/навсегда».
- source_word: עַל רֹאשָׁם
  choice: над их головами
  rationale: Сохраняет поэтический образ радости, пребывающей над ними словно венец.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: веселье и радость
  rationale: Разные русские слова сохраняют парные близкие по смыслу существительные еврейского текста.
- source_word: יַשִּׂיגוּן
  choice: настигнут их
  rationale: Глагол נשׂג передаёт достижение или догоняющее движение; «настигнут» сохраняет яркое олицетворение радости.
- source_word: נָסוּ
  choice: убегут прочь
  rationale: Хотя употреблена форма qatal, в пророческом контексте она выражает итог будущего восстановления; перевод сохраняет и будущую направленность, и образ бегства.
- source_word: יָגוֹן וַאֲנָחָה
  choice: скорбь и вздохи
  rationale: «Скорбь» передаёт глубокую печаль, а множественное «вздохи» естественно выражает состояние, обозначенное собирательным существительным אֲנָחָה.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Временное значение נָסוּ в пророческой поэзии
  choice: 'будущий результат: «убегут прочь»'
  alternative: 'совершившееся действие: «убежали»; настоящее: «убегают»'
  rationale: Форма qatal включена в картину будущего возвращения и естественно понимается как завершающий результат обещанного избавления.
translation_notes:
  register: Современный литературный русский язык с торжественной поэтической интонацией. Сохранены параллелизм, повтор лексики радости, образ пребывающей над головами радости и олицетворённое бегство скорби. «Ликование» выбрано как ёмкое русское соответствие, а неоднозначность между пением и радостным возгласом отражена в сноске.
