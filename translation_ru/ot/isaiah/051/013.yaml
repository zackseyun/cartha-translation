source:
  edition: WLC
  text: וַ/תִּשְׁכַּ֞ח יְהוָ֣ה עֹשֶׂ֗/ךָ נוֹטֶ֣ה שָׁמַיִם֮ וְ/יֹסֵ֣ד אָרֶץ֒ וַ/תְּפַחֵ֨ד תָּמִ֜יד כָּל הַ/יּ֗וֹם מִ/פְּנֵי֙ חֲמַ֣ת הַ/מֵּצִ֔יק כַּ/אֲשֶׁ֥ר כּוֹנֵ֖ן לְ/הַשְׁחִ֑ית וְ/אַיֵּ֖ה חֲמַ֥ת הַ/מֵּצִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/013.yaml
  text: and you forgot Yahweh your Maker[a], who stretched out the heavens and founded the earth, and you feared continually all day long because of the fury of the oppressor, when he set himself to destroy. But where is the fury of the oppressor?
translation:
  language: ru
  text: И ты забыл Яхве, своего Создателя, раскинувшего небеса и основавшего землю, и непрестанно, весь день, боялся ярости угнетателя, когда он готовился уничтожить.[a] Но где ярость угнетателя?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно он готов был уничтожить».'
    reason: 'Лексико-синтаксическая неоднозначность כַּאֲשֶׁר: оборот можно понимать не только временно, но и сравнительно-модально.'
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: И ты забыл
  rationale: Форма qal wayyiqtol, 2-е лицо мужского рода единственного числа. Прошедшее время естественно передаёт совершившееся забвение и сохраняет обличительный тон.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: עֹשֶׂךָ
  choice: своего Создателя
  rationale: Причастие с суффиксом 2-го лица имеет обозначающую лицо, почти титульную силу. «Своего» естественно по-русски соотносит Создателя с подлежащим «ты».
- source_word: נוֹטֶה שָׁמַיִם
  choice: раскинувшего небеса
  rationale: נטה в космологическом контексте означает «растянуть, раскинуть». Причастный оборот сохраняет форму и образ исходного текста.
- source_word: וְיֹסֵד אָרֶץ
  choice: и основавшего землю
  rationale: יסד выражает основание или закладку фундамента; «основавшего» компактно сохраняет этот образ.
- source_word: וַתְּפַחֵד
  choice: ты ... боялся
  rationale: פחד прямо обозначает страх. Выбор не усиливает значение до физической дрожи, которой глагол сам по себе не требует.
- source_word: תָּמִיד כָּל הַיּוֹם
  choice: непрестанно, весь день
  rationale: Сохранены оба указания на длительность и интенсивность страха; запятая делает сочетание естественным в современном русском языке.
- source_word: מִפְּנֵי חֲמַת הַמֵּצִיק
  choice: ярости угнетателя
  rationale: В контексте מִפְּנֵי указывает на причину страха, חֲמַת — на сильный гнев, а מֵצִיק — на того, кто притесняет или угнетает.
- source_word: כַּאֲשֶׁר כּוֹנֵן לְהַשְׁחִית
  choice: когда тот приготовился уничтожить
  rationale: כַּאֲשֶׁר передано временно, а כּוֹנֵן — как подготовленность или готовность к действию. Указательное «тот» ясно возвращает к угнетателю, не вводя нового субъекта.
- source_word: וְאַיֵּה חֲמַת הַמֵּצִיק
  choice: Но где теперь ярость угнетателя?
  rationale: Риторический вопрос противопоставлен прежнему страху. «Теперь» явно выражает подразумеваемый контраст, не меняя содержания вопроса.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Субъект оборота כּוֹנֵן לְהַשְׁחִית
  choice: угнетатель
  alternative: неопределённый субъект; модальное понимание «словно он готов был уничтожить»
  rationale: Ближайший грамматический и смысловой референт — הַמֵּצִיק, «угнетатель»; следующий риторический вопрос также продолжает говорить о его ярости.
- issue: Оттенок כַּאֲשֶׁר в описании угрозы
  choice: временное «когда»
  alternative: сравнительно-модальное «словно»
  rationale: Форма допускает временное прочтение, выбранное в основном тексте, однако контекст позволяет понимать угрозу как кажущуюся или предполагаемую; эта подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис слегка приподнят, но понятен обычному читателю; сохранены обличение, длительность страха и резкий риторический вопрос.
