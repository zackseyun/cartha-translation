revisions:
- from: И ты забыл Яхве, своего Создателя, раскинувшего небеса и основавшего землю; ты непрестанно, весь день, боялся ярости угнетателя, когда тот приготовился уничтожить.[a] Но где теперь ярость угнетателя?
  to: И ты забыл Яхве, своего Создателя, раскинувшего небеса и основавшего землю, и непрестанно, весь день, боялся ярости угнетателя, когда он готовился уничтожить.[a] Но где ярость угнетателя?
  rationale: Убрано невыраженное в оригинале «теперь». Формулировка угрозы смягчена с завершённого «приготовился» до «готовился», что точнее передаёт подготовленность/намерение угнетателя, не утверждая завершённости приготовления. Сноска приведена в соответствие с выбранной формой и сохраняет спорный модальный оттенок.
  reviewer_model: gpt-5.6-terra
