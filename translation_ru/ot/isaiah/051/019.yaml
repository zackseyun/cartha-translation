base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/019.yaml
  text: These two things have come upon you—who will mourn for you?—devastation and destruction[a], famine and sword[b]; who will comfort you?
translation:
  language: ru
  text: Вот, два бедствия постигли тебя — кто посочувствует тебе?[a] — разорение и разрушение; голод и меч.[b] Кто утешит тебя?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто оплачет тебя?» Еврейский глагол может означать скорбное оплакивание или выражение сочувствия.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте сказано о «двух» бедствиях, после чего названы четыре несчастья; вероятно, они образуют две пары: «разорение и разрушение» и «голод и меч».'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁתַּיִם הֵנָּה
  choice: Вот два бедствия
  rationale: Сохраняет явно названное число «два» и указательную силу הֵנָּה; слово «бедствия» естественно вводит последующий перечень несчастий.
- source_word: קֹרְאֹתַיִךְ
  choice: постигли тебя
  rationale: В сочетании с бедствиями форма от קרא имеет идиоматическое значение «случиться с кем-либо, постигнуть», а не буквальное «позвать».
- source_word: מִי יָנוּד לָךְ
  choice: кто пожалеет тебя?
  rationale: נוּד может обозначать скорбное сочувствие, оплакивание или жест соболезнования. «Пожалеет» естественно передаёт здесь сочувствие, не сводя значение только к плачу.
- source_word: הַשֹּׁד
  choice: разорение
  rationale: Передаёт разрушительное опустошение и насильственное разорение, выражаемые שֹׁד.
- source_word: הַשֶּׁבֶר
  choice: сокрушение
  rationale: Сохраняет образ слома и крушения в שֶׁבֶר и образует выразительную пару с «разорением».
- source_word: הָרָעָב
  choice: голод
  rationale: Обычное и точное соответствие רָעָב в контексте общенародного бедствия.
- source_word: הַחֶרֶב
  choice: меч
  rationale: Точно сохраняет пророческую метонимию войны и насильственной смерти.
- source_word: מִי אֲנַחֲמֵךְ
  choice: Кто утешит тебя?
  rationale: Прямо передаёт значение נחם в пиэле и сохраняет важный для книги Исаии мотив утешения.
theological_decisions:
- issue: Упоминание «двух» при последующем перечислении четырёх существительных
  choice: 'Сохранить «два бедствия» и четыре названия, пунктуационно представленные как две пары: «разорение и сокрушение, голод и меч».'
  alternative: Обобщить как «двойное бедствие» либо исправить число на четыре.
  rationale: Масоретский текст ясно говорит «два», а четыре бедствия естественно объединяются в две параллельные пары. Сохранение этой напряжённости предпочтительнее конъектуры.
- issue: Смысл נוּד в вопросе о реакции окружающих
  choice: «кто пожалеет тебя?» с примечанием об оплакивании и сочувствии
  alternative: «кто будет оплакивать тебя?»
  rationale: Еврейский глагол допускает и скорбь, и выражение сочувствия; основной текст должен звучать естественно, а примечание сохраняет лексическую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род местоимения подразумевает Сион/Иерусалим. Два риторических вопроса сохранены; перечисление оформлено как две смысловые пары.
