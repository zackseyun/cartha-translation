  variant: modern literary Russian
source:
  edition: WLC
  text: אָנֹכִ֧י אָנֹכִ֛י ה֖וּא מְנַחֶמְ/כֶ֑ם מִֽי אַ֤תְּ וַ/תִּֽירְאִי֙ מֵ/אֱנ֣וֹשׁ יָמ֔וּת וּ/מִ/בֶּן אָדָ֖ם חָצִ֥יר יִנָּתֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/012.yaml
  text: I[a], I am he who comforts you. Who are you that you fear man, who dies, and the son of man, who is made like grass?
translation:
  language: ru
  text: Я, Я — Тот, кто утешает вас. Кто ты, что боишься человека, который умрёт, и сына человеческого[a], который станет как трава?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обычного человека». Здесь еврейское выражение «сын человеческий» обозначает человека как представителя смертного человечества и не обязательно является мессианским титулом.'
    reason: Лексическая альтернатива и предотвращение ошибочного титульного прочтения в данном контексте.
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי הוּא
  choice: Я, Я — Тот
  rationale: Повторение личного местоимения сохранено как сильное эмфатическое самообозначение; «Тот» естественно передаёт функцию הוּא в этой формуле.
- source_word: מְנַחֶמְכֶם
  choice: кто утешает вас
  rationale: Причастие выражает постоянное, характерное действие, а «вас» точно отражает суффикс второго лица множественного числа.
- source_word: מִי אַתְּ וַתִּירְאִי
  choice: Кто ты, что боишься
  rationale: Сохранён прямой риторический вопрос. В еврейском обращение стоит в женском роде единственного числа, вероятно к Сиону; по-русски местоимение «ты» и глагол настоящего времени не требуют искусственного уточнения рода.
- source_word: אֱנוֹשׁ יָמוּת
  choice: человека, который умрёт
  rationale: אֱנוֹשׁ обозначает хрупкого смертного человека, а יָמוּת прямо выражает неизбежность его смерти; оба элемента сохранены раздельно.
- source_word: בֶּן אָדָם
  choice: сына человеческого
  rationale: Буквальное выражение сохраняет поэтический параллелизм и лексику оригинала; сноска поясняет, что здесь это обозначение обычного смертного человека.
- source_word: חָצִיר יִנָּתֵן
  choice: который станет как трава
  rationale: Фраза передаёт уподобление человека недолговечной траве. «Станет как трава» понятно по-русски и не перегружает образ буквальным, но неясным «будет дан травой».
theological_decisions:
- issue: Значение בֶּן אָדָם в немессианском пророческом контексте
  choice: сына человеческого
  alternative: обычного человека
  rationale: В данном параллелизме выражение обозначает смертного человека, а не обязательно мессианский титул. Буквальная формулировка сохраняет библейскую образность и потенциальную ассоциацию, тогда как сноска удерживает контекстуальный смысл, не устраняя возможного богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Эмфатический повтор «Я, Я» и поэтический параллелизм сохранены; обращение остаётся прямым и риторическим.
