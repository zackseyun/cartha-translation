source:
  edition: WLC
  text: כִּֽי נִחַ֨ם יְהוָ֜ה צִיּ֗וֹן נִחַם֙ כָּל חָרְבֹתֶ֔י/הָ וַ/יָּ֤שֶׂם מִדְבָּרָ/הּ֙ כְּ/עֵ֔דֶן וְ/עַרְבָתָ֖/הּ כְּ/גַן יְהוָ֑ה שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יִמָּ֣צֵא בָ֔/הּ תּוֹדָ֖ה וְ/ק֥וֹל זִמְרָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/003.yaml
  text: For Yahweh comforts Zion[a]; he comforts all her ruins. He makes her wilderness like Eden, and her desert like the garden of Yahweh. Joy and gladness will be found in her[d][c][b], thanksgiving and the sound of song.
translation:
  language: ru
  text: Ибо Яхве утешает Сион, утешает все его развалины. Он сделает его пустыню подобной Эдему[a], и его безводную равнину — саду Яхве. Ликование и радость будут в нём, благодарение и звуки песен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Эдем» перекликается с образом сада в повествовании Бытия; в следующей строке говорится о «саде Яхве».
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт причинно-пояснительную связь с предшествующим призывом и обещанием.
- source_word: נִחַם
  choice: утешает
  rationale: В контексте восстановления Сиона означает утешение, выраженное в возрождении разорённого города; настоящее время сохраняет живую уверенность пророческого обещания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: כָּל חָרְבֹתֶיהָ
  choice: все его развалины
  rationale: Конкретно и естественно передаёт разорённые места олицетворённого Сиона; местоимение согласовано с мужским родом русского названия «Сион».
- source_word: וַיָּשֶׂם
  choice: Он сделает
  rationale: Будущее время ясно передаёт обещанное восстановление, не ослабляя уверенности пророческой речи.
- source_word: מִדְבָּרָהּ
  choice: его пустыню
  rationale: Обычное значение מִדְבָּר; сохраняется отличие от следующего топографического термина עֲרָבָה.
- source_word: כְּעֵדֶן
  choice: подобной Эдему
  rationale: Сохраняет имя Эдем и отсылку к повествованию о саде в Бытии.
- source_word: וְעַרְבָתָהּ
  choice: его безводную равнину
  rationale: Передаёт עֲרָבָה как засушливую равнинную местность и отличает её от מִדְבָּר, избегая узкого отождествления с географическим регионом Арава.
- source_word: כְּגַן יְהוָה
  choice: саду Яхве
  rationale: Прозрачно сохраняет образ сада, принадлежность Яхве и параллель с Эдемом.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: Ликование и радость
  rationale: Передаёт два близких, но не полностью тождественных слова праздничного веселья.
- source_word: יִמָּצֵא בָהּ
  choice: будут в нём
  rationale: Естественно по-русски передаёт значение присутствия («будут найдены/обретаться») и согласует число сказуемого с рядом однородных существительных.
- source_word: תּוֹדָה וְקוֹל זִמְרָה
  choice: благодарение и звуки песен
  rationale: Сохраняет религиозный оттенок תּוֹדָה и естественно передаёт собирательный образ слышимого пения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Временная перспектива пророческого обещания
  choice: «утешает» и «сделает», затем «будут»
  alternative: Последовательно прошедшее или последовательно будущее время
  rationale: Еврейские формы представляют восстановление как несомненное и живо совершающееся. Сочетание настоящего и будущего сохраняет эту напряжённость, не навязывая единообразной временной схемы.
- issue: Олицетворение Сиона и род местоимений
  choice: «его», «в нём»
  alternative: «её», «в ней» — по грамматическому роду еврейского צִיּוֹן и образу дочери Сиона
  rationale: В русском языке «Сион» грамматически мужского рода. Мужские местоимения обеспечивают ясность, не отрицая присутствующего в еврейском тексте олицетворения города.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Синтаксический параллелизм оригинала сохранён; редкое «безводная равнина» употреблено для различения двух еврейских обозначений пустынной местности.
