lexical_decisions:
- source_word: מִהַר
  choice: скоро
  rationale: Передаёт значение поспешности и близости обещанного освобождения естественным современным русским выражением.
- source_word: צֹעֶה
  choice: угнетённый
  rationale: Трудное причастие допускает образ согбенного, придавленного бедствием человека; «угнетённый» сохраняет контекст притеснения, не сужая значение до буквального узника.
- source_word: לְהִפָּתֵחַ
  choice: будет освобождён
  rationale: Буквальное значение нифаля — «быть открытым», но в данном контексте выражение идиоматически указывает на освобождение из заключения или стеснённого положения.
- source_word: וְלֹא יָמוּת
  choice: он не умрёт
  rationale: Прямо передаёт отрицательную форму имперфекта как уверенное обещание сохранения жизни.
- source_word: לַשַּׁחַת
  choice: в яме
  rationale: Сохраняет конкретный образ שחת, который может обозначать яму, темницу, могилу или гибель, не устраняя его смысловой многозначности.
- source_word: וְלֹא יֶחְסַר לַחְמוֹ
  choice: и хлеба у него не убудет
  rationale: Сохраняет конкретный образ хлеба как необходимого пропитания и близко передаёт глагол «недоставать, убывать» естественной русской конструкцией.
theological_decisions:
- issue: Кого обозначает угнетённый
  choice: Единственное число сохранено; образ может представительно относиться к угнетённому народу в изгнании.
  alternative: Конкретный заключённый или страдающий человек вообще.
  rationale: Грамматика еврейского текста требует единственного числа, а широкая формулировка не навязывает более узкого отождествления и сохраняет связь с контекстом избавления.
translation_notes:
  register: Современный литературный русский язык; стиль ясный и dignified, с сохранением пророческой уверенности, конкретного образа хлеба и смысловой открытости трудных еврейских выражений.
