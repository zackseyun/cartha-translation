  yaml_path: translation/ot/isaiah/051/014.yaml
  text: The one bent low will soon be set free[a]; he will not die in the pit[b], and his bread will not be lacking.
translation:
  language: ru
  text: Согбенный вскоре будет освобождён[a]; он не умрёт в яме[b], и хлеба у него не убудет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пленный вскоре будет отпущен». Еврейское выражение трудно для истолкования; оно может изображать человека, согнувшегося под гнётом, которого затем освобождают.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в темнице». Еврейское слово может обозначать яму, темницу, могилу или, в переносном смысле, гибель.'
