  text: שִׁמְע֤וּ אֵלַ/י֙ יֹ֣דְעֵי צֶ֔דֶק עַ֖ם תּוֹרָתִ֣/י בְ/לִבָּ֑/ם אַל תִּֽירְאוּ֙ חֶרְפַּ֣ת אֱנ֔וֹשׁ וּ/מִ/גִּדֻּפֹתָ֖/ם אַל תֵּחָֽתּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/007.yaml
  text: 'Listen to me[a], you who know righteousness, people with my law in their hearts: do not fear the reproach of man[d][c][b], and do not be dismayed by their insults.'
translation:
  language: ru
  text: Слушайте Меня, знающие праведность[a], народ, в сердцах которого Мой закон[b]! Не бойтесь поношения смертного[c] и не падайте духом от их оскорблений[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знающие справедливость».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «народ, в сердцах которого Моё наставление». Еврейское תּוֹרָה может означать как «закон», так и «наставление».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «человека». Еврейское אֱנוֹשׁ обозначает человека и может подчёркивать его смертность и немощь.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «не сокрушайтесь»; еврейский глагол может передавать смятение или внутренний надлом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Слушайте Меня
  rationale: Множественное повеление с אֵלַי выражает направленный призыв слушать и внимать; формулировка естественна и сохраняет прямоту обращения.
- source_word: יֹדְעֵי צֶדֶק
  choice: знающие праведность
  rationale: צֶדֶק охватывает праведность и справедливость; здесь сочетание с внутренне усвоенной Торой прежде всего указывает на нравственно-заветную праведность, при сохранении альтернативы в сноске.
- source_word: עַם תּוֹרָתִי בְלִבָּם
  choice: народ, у которого Мой закон в сердце
  rationale: Собирательное עַם передано единственным числом; поэтому местоименный суффикс множественного числа естественно выражен русским собирательным оборотом. «Закон» сохраняет нормативный оттенок תּוֹרָה, а единственное «сердце» — еврейскую форму לִבָּם.
- source_word: אַל תִּירְאוּ חֶרְפַּת אֱנוֹשׁ
  choice: не бойтесь поношения смертного
  rationale: חֶרְפָּה обозначает поношение, поругание или позор, а אֱנוֹשׁ — человека с возможным оттенком смертности и немощи. «Смертного» сохраняет контраст между бренным человеком и Богом без неестественного русского родового «человека».
- source_word: וּמִגִּדֻּפֹתָם
  choice: от их оскорблений
  rationale: גִּדֻּפוֹת обозначает брань, поношения, оскорбительные речи; «оскорбления» ясно передаёт человеческую словесную враждебность, не сужая значение до богохульства.
- source_word: אַל תֵּחָתּוּ
  choice: не падайте духом
  rationale: Нифаль חתת может означать быть сокрушённым, устрашённым или приведённым в смятение. Русская идиома естественно передаёт внутренний надлом под воздействием враждебных речей, не превращая метафору в буквальное физическое разрушение.
theological_decisions:
- issue: Значение צֶדֶק
  choice: праведность
  alternative: справедливость
  rationale: Контекст соединяет знание צֶדֶק с Торой в сердце, что поддерживает нравственно-заветное значение «праведность»; общественно-судебный оттенок «справедливость» остаётся возможным и отмечен в сноске.
- issue: Передача אֱנוֹשׁ
  choice: смертный
  alternative: человек
  rationale: Слово обозначает отдельного человека и нередко подчёркивает человеческую бренность. «Смертный» сохраняет этот риторический оттенок и универсальность, не вводя конфессионального толкования.
- issue: Сила метафоры חתת
  choice: не падайте духом
  alternative: не сокрушайтесь
  rationale: Форма допускает как эмоциональное смятение, так и образ внутреннего сокрушения. Основной вариант звучит естественно по-русски, а более формальный метафорический вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но общепонятной пророческой интонацией. Сохранены прямое обращение, собирательное «народ» и параллелизм двух запретов; неоднозначные значения вынесены в сноски.
