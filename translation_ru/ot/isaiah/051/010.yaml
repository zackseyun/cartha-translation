id: ISA.51.10
reference: Isaiah 51:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֲ/ל֤וֹא אַתְּ הִיא֙ הַ/מַּחֲרֶ֣בֶת יָ֔ם מֵ֖י תְּה֣וֹם רַבָּ֑ה הַ/שָּׂ֨מָה֙ מַֽעֲמַקֵּי יָ֔ם דֶּ֖רֶךְ לַ/עֲבֹ֥ר גְּאוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/010.yaml
  text: Was it not you who dried up the sea[a], the waters of the great deep[b], who made the depths of the sea a way for the redeemed to cross over?
translation:
  language: ru
  text: Не ты ли иссушила море, воды великой бездны, превратила морские глубины в путь, чтобы по нему прошли искупленные[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выкупленные».'
    reason: Лексема גאל может подчёркивать освобождение посредством выкупа или действие родственного искупителя; русский вариант «выкупленные» делает этот оттенок явнее.
lexical_decisions:
- source_word: הֲלוֹא אַתְּ הִיא
  choice: Не ты ли
  rationale: Риторический вопрос предполагает утвердительный ответ. Русская конструкция естественно передаёт и вопрос, и подчёркнутое обращение к адресату женского рода.
- source_word: הַמַּחֲרֶבֶת
  choice: иссушила
  rationale: Причастная форма от חרב в каузативном значении описывает устранение морских вод. «Иссушила» сохраняет возвышенный регистр и связь с исходом.
- source_word: יָם
  choice: море
  rationale: Буквальный перевод сохраняет явный намёк на переход через море, не уточняя в основном тексте его название.
- source_word: מֵי תְּהוֹם רַבָּה
  choice: воды великой бездны
  rationale: Передаёт конструкцию с תְּהוֹם и сохраняет её образ глубинных, первозданных вод; «великая» соответствует רַבָּה.
- source_word: הַשָּׂמָה
  choice: превратила
  rationale: Глагол שׂים буквально означает «положила, сделала». В сочетании с морскими глубинами и путём «превратила … в путь» звучит по-русски естественно и сохраняет смысл.
- source_word: מַעֲמַקֵּי יָם
  choice: морские глубины
  rationale: Естественно передаёт множественное число и образ глубоких мест моря.
- source_word: דֶּרֶךְ לַעֲבֹר
  choice: путь, чтобы по нему прошли
  rationale: Передаёт и созданный путь, и его назначение; добавленное «по нему» лишь проясняет естественную русскую связь между частями фразы.
- source_word: גְּאוּלִים
  choice: искупленные
  rationale: Страдательное причастие от גאל обозначает тех, кого освободил искупитель; «искупленные» сохраняет ключевую для Исайи лексику избавления.
theological_decisions:
- issue: Намёк на исход и широта образа искупления
  choice: Сохранить образ перехода через море, не называя его в основном тексте Красным морем.
  alternative: Прямо указать «Красное море» либо истолковать весь образ только метафорически.
  rationale: Еврейский текст вызывает в памяти исход, но говорит просто о «море», позволяя образу одновременно служить более широкой теме избавления у Исайи.
- issue: Женский род обращения
  choice: 'Передать обращение и глаголы в женском роде: «ты … иссушила … превратила».'
  alternative: Перестроить фразу так, чтобы род адресата не был выражен.
  rationale: В еврейском тексте местоимение אַתְּ и связанные формы обращены к «мышце Господа» из предыдущего стиха; женский род грамматически значим и естественно сохраняется по-русски.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Формулировка сохраняет риторический вопрос, женский род адресата, параллелизм морских образов и историко-богословскую многозначность намёка на исход.
