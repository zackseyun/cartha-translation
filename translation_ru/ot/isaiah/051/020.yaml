base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/020.yaml
  text: Your sons have fainted[a]; they lie at the head of every street, like an antelope in a net, full of the wrath of Yahweh[b], the rebuke of your God.
translation:
  language: ru
  text: Твои сыновья лишились сил; они лежат у начала каждой улицы[a], словно антилопа[b] в сети, исполненные ярости Яхве, укора твоего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на каждом углу улицы». Буквально: «у начала каждой улицы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «словно дикий бык». Точное значение еврейского названия животного неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַיִךְ
  choice: твои сыновья
  rationale: Существительное בֵּן во множественном числе с суффиксом 2-го лица женского рода буквально означает «твои сыновья»; родовое обозначение сохранено.
- source_word: עֻלְּפוּ
  choice: лишились сил
  rationale: Форма от עלף описывает обморочное состояние, изнеможение или утрату сил; выбран естественный русский оборот, передающий физическое истощение и беспомощность.
- source_word: שָׁכְבוּ
  choice: лежат
  rationale: Глагол обозначает лежание; настоящее время естественно передаёт наблюдаемое состояние сыновей после их изнеможения.
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: у начала каждой улицы
  rationale: רֹאשׁ буквально означает «голова, начало»; перевод сохраняет пространственный образ оригинала, не исключая возможного значения перекрёстков или углов улиц.
- source_word: כְּתוֹא
  choice: словно антилопа
  rationale: Точное определение редкого названия животного неясно; «антилопа» передаёт образ пойманного дикого животного без излишней зоологической конкретизации.
- source_word: מִכְמָר
  choice: в сети
  rationale: Слово обозначает сеть для ловли животных.
- source_word: הַמְלֵאִים
  choice: исполненные
  rationale: Причастие выражает состояние сыновей как тех, кто наполнен Божьей яростью и укором; согласование с «сыновья» сохраняет структуру еврейского текста.
- source_word: חֲמַת יְהוָה
  choice: ярости Яхве
  rationale: חֵמָה обозначает пылающий гнев или ярость; «ярость» сохраняет силу выражения, а имя יהוה передано как «Яхве».
- source_word: גַּעֲרַת אֱלֹהָיִךְ
  choice: грозного укора твоего Бога
  rationale: גְּעָרָה — резкий, властный укор; определение «грозный» естественно передаёт его суровую силу в данном поэтическом контексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и соответствует принятому принципу проекта.
- issue: Определение животного תוא
  choice: антилопа
  alternative: дикий бык
  rationale: Точная зоологическая идентификация не установлена и богословски не определяет смысл образа; альтернативное традиционное понимание отмечено в сноске.
