    rationale: Это слово вносит конкретное значение места добычи камня и не передаёт בּוֹר («яма, углубление»). В оригинале второй образ говорит об углублении/выемке ямы, откуда адресаты были выкопаны.
  - severity: low
    issue: «Извлечены» для נֻקַּרְתֶּם
    rationale: «Извлечены» слишком общее и ослабляет глагольный образ выкапывания или выдалбливания. «Выкопаны» точнее и сохраняет параллель с «высечены».
