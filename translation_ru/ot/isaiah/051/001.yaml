base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/001.yaml
  text: 'Listen to me[a], you who pursue righteousness, you who seek Yahweh: look to the rock from which you were cut[c][b], and to the quarry from which you were dug.'
translation:
  language: ru
  text: 'Слушайте Меня, стремящиеся к праведности[a], ищущие Яхве: взгляните на скалу, из которой вы высечены, и на углубление ямы, из которой вы выкопаны[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости».'
    reason: lexical_alternative
  - marker: b
    text: В стихе 2 эти образы связываются с Авраамом и Саррой.
    reason: cross_reference
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Слушайте Меня
  rationale: Форма повелительного наклонения во множественном числе выражает призыв не просто услышать, а внимательно прислушаться; местоимение передаёт אֵלַי.
- source_word: רֹדְפֵי צֶדֶק
  choice: стремящиеся к праведности
  rationale: Причастный оборот характеризует адресатов как настойчиво ищущих того, что право перед Богом. «Стремящиеся» естественно по-русски передаёт направленное, деятельное значение רדף, не создавая неуместного образа физической погони.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: ищущие Яхве
  rationale: Сохранён параллельный причастный оборот и личное имя Бога, представленное тетраграмматоном.
- source_word: הַבִּיטוּ
  choice: взгляните
  rationale: Прямо передаёт повеление обратить внимательный взгляд; дальнейший образ подразумевает также размышление, но это не вносится в основной текст.
- source_word: צוּר חֻצַּבְתֶּם
  choice: скалу, из которой вы высечены
  rationale: Сохранены каменная метафора и пассивное значение חצב — высекать или вырубать из камня.
- source_word: מַקֶּבֶת בּוֹר נֻקַּרְתֶּם
  choice: каменоломню, из которой вы извлечены
  rationale: «Каменоломня» естественно передаёт образ места выемки камня, выраженный сочетанием מַקֶּבֶת בּוֹר; «извлечены» сохраняет пассив и параллелизм с «высечены», не сужая действие до буквального копания.
theological_decisions:
- issue: Значение צֶדֶק
  choice: праведность
  alternative: справедливость
  rationale: В параллели с «ищущие Яхве» слово обозначает правоту и верность тому, что угодно Богу, однако возможный смысл общественной справедливости отмечен в сноске.
- issue: Истолкование образов скалы и каменоломни
  choice: сохранить образы без пояснения в основном тексте
  alternative: прямо назвать Авраама и Сарру
  rationale: Сам стих 1 оставляет образы метафорическими, а их связь с Авраамом и Саррой раскрывается в стихе 2; перевод не предваряет это раскрытие.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной интонацией пророческого обращения. Параллелизм двух групп адресатов и двух образов происхождения сохранён; имя Яхве передано как личное имя, а не заменено титулом.
