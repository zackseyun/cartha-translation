review_pass:
  verdict: revise
  source_fidelity: Первая часть передана точно. Однако מַקֶּבֶת בּוֹר — не «каменоломня» как обозначение места добычи камня, а образ выемки/углубления, связанный с ямой; נֻקַּרְתֶּם означает «вы были выкопаны/выдолблены». В переводе следует сохранить оба компонента образа, не заменяя их обобщающей «каменоломней».
  naturalness: «Стремящиеся к праведности» и «ищущие Яхве» естественны для современного литературного русского в возвышенном пророческом регистре. «Углубление ямы» несколько образно, но понятно и лучше сохраняет намеренно необычную метафору оригинала, чем терминологически сужающее «каменоломня».
  terminology: «Праведность» уместна для צֶדֶק; альтернативу «справедливость» надлежащим образом отмечает сноска. «Яхве» последовательно передаёт тетраграмматон. Образы не следует вносить в текст как прямое указание на Авраама и Сарру; существующая сноска корректно отсылает к следующему стиху.
