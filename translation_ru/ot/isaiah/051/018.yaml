base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/018.yaml
  text: There is no one to guide her among all the sons she has borne[a], and no one to take her by the hand among all the sons she has raised.
translation:
  language: ru
  text: Среди всех сыновей, которых она родила,[a] нет никого, кто вёл бы её; среди всех сыновей, которых она вырастила, нет никого, кто взял бы её за руку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из всех детей, которых она родила… из всех детей, которых она вырастила». В еврейском тексте: «сыновей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנַהֵל
  choice: того, кто повёл бы её
  rationale: Причастие породы piel от נהל означает ведущего или направляющего. Сослагательная конструкция естественно передаёт по-русски отсутствие человека, способного вести олицетворённый Сион.
- source_word: לָהּ
  choice: её
  rationale: Суффикс женского рода указывает на олицетворённый город — Сион/Иерусалим.
- source_word: מִכָּל בָּנִים
  choice: среди всех сыновей
  rationale: 'Предлог מן при כָּל обозначает выбор из всей группы: ни одного из всех её сыновей. Мужской род существительного сохранён.'
- source_word: יָלָדָה
  choice: которых она родила
  rationale: Форма qal перфекта сохраняет материнский образ и завершённость рождения; русское придаточное звучит естественно.
- source_word: מַחֲזִיק בְּיָדָהּ
  choice: того, кто взял бы её за руку
  rationale: Оборот буквально описывает удерживание или укрепление руки, а здесь выражает личную поддержку и руководство. Русская идиома сохраняет телесный образ.
- source_word: גִּדֵּלָה
  choice: которых она вырастила
  rationale: Piel от גדל означает вырастить, воспитать. «Вырастила» ясно и естественно сочетается с «родила».
- source_word: אֵין ... וְאֵין
  choice: Нет ... и нет
  rationale: Повтор отрицательной бытийной конструкции сохранён для передачи подчёркнутой полной оставленности.
theological_decisions:
- issue: Передача родового значения בָּנִים
  choice: сыновей
  alternative: детей
  rationale: В еврейском тексте прямо употреблено существительное мужского рода «сыновья» в материнском образе Иерусалима. Точный род сохранён, а более широкая возможная передача отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм и повтор «нет» сохранены; порядок слов слегка перестроен ради ясности и естественности.
