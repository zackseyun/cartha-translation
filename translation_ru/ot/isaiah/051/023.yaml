base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/023.yaml
  text: And I will put it into the hand of those who afflict you, who said to you, ‘Bow down, so that we may pass over’; and you made your back like the ground, and like the street for those passing by.
translation:
  language: ru
  text: 'Я отдам её в руки твоих мучителей, которые говорили тебе: «Склонись, чтобы мы прошли», — и ты сделала свою спину подобной земле, подобной улице для прохожих.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹגַיִךְ
  choice: твоих мучителей
  rationale: Причастная форма обозначает тех, кто причиняет страдание и унижает; «мучители» естественно и ёмко передаёт смысл в данном контексте.
- source_word: לְנַפְשֵׁךְ
  choice: тебе
  rationale: Здесь נֶפֶשׁ обозначает саму личность адресата; буквальное «твоей душе» в современном русском создало бы неуместное противопоставление души и тела.
- source_word: שְׁחִי
  choice: ложись
  rationale: Повелительная форма требует пригнуться или пасть ниц; дальнейший образ спины как дороги показывает, что речь идёт о полном униженном распростёртом положении.
- source_word: גֵּוֵךְ
  choice: спину
  rationale: В контексте попирания גֵּו означает спину, которую побеждённая Сион подставляет притеснителям.
- source_word: כַחוּץ
  choice: словно улицу
  rationale: חוּץ может обозначать открытое место или улицу; параллелизм с прохожими поддерживает «улицу».
- source_word: לַעֹבְרִים
  choice: для прохожих
  rationale: Причастие от עבר обозначает проходящих; «прохожие» сохраняет образ улицы и звучит естественно по-русски.
theological_decisions:
- issue: Местоимение «её» — чаша или ярость
  choice: 'Сохранить местоименную отсылку: «её»'
  alternative: 'Уточнить: «эту чашу»'
  rationale: Еврейский текст использует суффикс женского рода, отсылающий к чаше из предыдущего стиха. Местоимение сохраняет межстиховую связь, не добавляя отсутствующего здесь существительного.
- issue: Образ прохождения по спине Сиона
  choice: Сохранить прямой и резкий образ телесного унижения
  alternative: Смягчить до общего описания угнетения
  rationale: Текст намеренно изображает Сион как землю или улицу под ногами притеснителей; смягчение ослабило бы пророческую силу и контраст с Божьим избавлением.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и резкости пророческого образа. Женский род («тебе», «подставляла») соответствует обращению к Сиону/Иерусалиму в контексте. Пунктуация подчёркивает переход от речи мучителей к описанию унижения.
