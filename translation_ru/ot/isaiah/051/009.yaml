  text: עוּרִ֨י עוּרִ֤י לִבְשִׁי עֹז֙ זְר֣וֹעַ יְהוָ֔ה ע֚וּרִי כִּ֣/ימֵי קֶ֔דֶם דֹּר֖וֹת עוֹלָמִ֑ים הֲ/ל֥וֹא אַתְּ הִ֛יא הַ/מַּחְצֶ֥בֶת רַ֖הַב מְחוֹלֶ֥לֶת תַּנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/009.yaml
  text: Awake[a], awake, put on strength, arm of Yahweh; awake, as in days of old, generations of long ago[b]. Was it not you who cut Rahab in pieces, who pierced the dragon?
translation:
  language: ru
  text: Пробудись, пробудись, облекись силой, мышца Яхве! Пробудись, как в дни древности, в поколения былых веков! Не ты ли рассекла Раава[a], пронзила дракона[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Раав — поэтическое имя гордой враждебной силы; здесь оно, вероятно, указывает на Египет.
    reason: cross_reference
  - marker: b
    text: 'Или: «морское чудовище».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: Пробудись
  rationale: Повелительное наклонение женского рода обращено к олицетворённой «руке»; повтор и возвышенный поэтический тон сохранены.
- source_word: לִבְשִׁי עֹז
  choice: облекись силой
  rationale: Сохраняет буквальную метафору облачения в силу и естественно звучит в современном литературном русском.
- source_word: זְרוֹעַ יְהוָה
  choice: рука Яхве
  rationale: «Рука» естественно передаёт библейский образ деятельной силы Бога; личное имя יהוה транслитерировано как «Яхве».
- source_word: כִּימֵי קֶדֶם דֹּרוֹת עוֹלָמִים
  choice: как в древние дни, во времена далёких поколений
  rationale: Передаёт параллельное указание на глубокую древность, не придавая עוֹלָמִים отвлечённого смысла метафизической вечности.
- source_word: הַמַּחְצֶבֶת
  choice: рассекла
  rationale: Выражает сильное рубящее действие и подходит к образу сокрушения враждебной силы.
- source_word: רַהַב
  choice: Раава
  rationale: Сохранено поэтическое имя враждебной силы, часто связываемой с Египтом, без сведения многослойного образа к одному толкованию.
- source_word: מְחוֹלֶלֶת
  choice: пронзила
  rationale: Передаёт насильственное поражение чудовища и поддерживает параллелизм с «рассекла».
- source_word: תַּנִּין
  choice: дракона
  rationale: В данном поэтическом контексте слово обозначает чудовищного противника; лексически возможный вариант отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохранено собственное заветное имя, непосредственно стоящее в еврейском тексте.
- issue: Образы Раава и תַּנִּין
  choice: Сохранить «Раава» и «дракона»
  alternative: Передать Раава непосредственно как Египет, а תַּנִּין как морское чудовище
  rationale: Так сохраняются намеренная многослойность образов исхода и победы над силами хаоса и присущая тексту богословская напряжённость.
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим ритмом. Женский род глаголов естественно согласован со словом «рука». Повторы и риторический вопрос исходного текста сохранены.
