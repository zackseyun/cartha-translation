base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/022.yaml
  text: 'Thus says your Lord[a], Yahweh, and your God, who pleads the cause of his people: Behold, I have taken from your hand the cup of staggering, the bowl of the cup of my wrath[b]; you shall never again drink it.'
translation:
  language: ru
  text: 'Так говорит твой Владыка, Яхве, твой Бог, который ведёт тяжбу за Свой народ: «Вот, Я забрал из твоей руки чашу головокружения, саму чашу, чашу Моего гнева.[a] Ты уже никогда не будешь пить из неё».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чашу шатания»; возможно, «чашу трепета». Еврейское слово обозначает ошеломляющее, лишающее устойчивости состояние; далее текст намеренно повторяет названия сосуда: буквально «чашу ... саму чашу, чашу Моего гнева».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנַיִךְ
  choice: твой Владыка
  rationale: Передаёт титул власти и сохраняет отличие от личного имени Яхве; форма женского рода местоимения относится к Сиону/Иерусалиму.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени Бога, не заменяющая его титулом.
- source_word: וֵאלֹהַיִךְ
  choice: твой Бог
  rationale: В контексте это единственное число и продолжение ряда наименований Бога; союз естественно не повторён по-русски при приложении.
- source_word: יָרִיב עַמּוֹ
  choice: который ведёт тяжбу за Свой народ
  rationale: Сохраняет судебно-правовой оттенок глагола ריב и допускает смысл как заступничества, так и ведения дела.
- source_word: הִנֵּה
  choice: вот
  rationale: Передаёт указательную и торжественную силу пророческой формулы естественным современным русским словом.
- source_word: לָקַחְתִּי מִיָּדֵךְ
  choice: Я забрал из твоей руки
  rationale: Буквально сохраняет образ удаления чаши из руки адресата; совершенный вид соответствует завершённости действия.
- source_word: כּוֹס הַתַּרְעֵלָה
  choice: чашу, от которой шатаются
  rationale: Передаёт одурманивающее действие суда — потерю устойчивости, — не сводя значение к одному лишь страху или дрожи.
- source_word: קֻבַּעַת כּוֹס חֲמָתִי
  choice: кубок — чашу Моего гнева
  rationale: Сохраняет накопление обозначений сосуда и образ чаши Божьего гнева; тире ясно показывает пояснительное приложение.
- source_word: לֹא תוֹסִיפִי לִשְׁתּוֹתָהּ עוֹד
  choice: Больше ты не будешь пить из неё
  rationale: Естественно передаёт идиому прекращения будущего действия и её подчёркнутую окончательность.
theological_decisions:
- issue: Последовательность божественных наименований
  choice: твой Владыка, Яхве, твой Бог
  alternative: Господь твой, Господь и Бог твой
  rationale: Сохранены отдельно титул власти, личное имя и обозначение отношений Бога с адресатом; Яхве не заменено традиционным титулом.
- issue: Судебный смысл יָרִיב עַמּוֹ
  choice: ведёт тяжбу за Свой народ
  alternative: защищает Свой народ
  rationale: Формулировка сохраняет юридическую образность и не сужает её до общего понятия защиты.
- issue: Образ чаши суда
  choice: Сохранить буквальную метафору чаши и гнева
  alternative: Передать как наказание или страдание
  rationale: Метафора существенна для пророческого контекста и межтекстовых связей; её истолкование вместо перевода устранило бы богословскую напряжённость образа.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Обращение во втором лице единственного числа женского рода подразумевается контекстом Сиона/Иерусалима; прописные местоимения при обращении к Богу применены согласно принятой русской библейской традиции.
