base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/007.yaml
  text: Has he struck him as he struck the one who struck him? Or has he been killed as his slain were killed?[a][b]
translation:
  language: ru
  text: Разве он поразил его так, как поразил того, кто поражал его?[a] Или был ли он убит так, как были убиты его убитые?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Разве он поразил его ударом того, кто поражал его?»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его убитые». Еврейский текст сжато выражает связь местоимений; не вполне ясно, с каким из участников сравнения соотносится этот суффикс.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּמַכַּת
  choice: Разве ... так, как
  rationale: Вопросительная ה вместе со сравнительной כְּ образует риторический вопрос-сопоставление; эта конструкция естественно передаётся по-русски оборотом «Разве ... так, как».
- source_word: מַכֵּהוּ
  choice: того, кто поражал его
  rationale: Причастие породы hифиль от נכה с суффиксом 3-го лица мужского рода обозначает действующее лицо — того, кто наносил ему удары; несовершенный вид естественен для характеристики нападавшего.
- source_word: הִכָּהוּ
  choice: Он поразил его
  rationale: Перфект от נכה передан прошедшим временем; прописная буква у «Он» указывает на вероятного по контексту субъекта — Господа, не заменяя местоимение именем.
- source_word: אִם
  choice: Или
  rationale: В параллельном риторическом построении אִם вводит второй альтернативный вопрос.
- source_word: כְּהֶרֶג
  choice: так, как были умерщвлены
  rationale: Сравнительная конструкция с существительным הֶרֶג идиоматически развёрнута в русском в пассивную глагольную форму, сохраняя смысл убийства и параллелизм.
- source_word: הֲרֻגָיו
  choice: убитые им
  rationale: Пассивное причастие с суффиксом буквально обозначает «его убитых»; «убитые им» ясно передаёт наиболее естественное агентное отношение, а возможная сжатость местоименной связи отмечена в сноске.
- source_word: הֹרָג
  choice: был умерщвлён
  rationale: Форма передаёт пассивное умерщвление. Выбор «умерщвлён» сохраняет отличие от субстантивированного «убитые», оставаясь в достойном литературном регистре.
theological_decisions:
- issue: Референты местоимений в риторическом сравнении
  choice: Сохранить местоимения в основном тексте, не подставляя прямо «Израиль» и «его враг»; вероятного божественного субъекта первого глагола обозначить прописным «Он».
  alternative: Назвать в основном тексте Господа, Израиль и поразивший его народ.
  rationale: В еврейском стихе участники не названы существительными, а выражены местоимениями и причастиями. Контекст указывает на сопоставление наказания Иакова/Израиля с судом над поражавшими его, однако эксплицировать все референты значило бы устранить намеренную сжатость текста.
- issue: Значение суффикса в הֲרֻגָיו
  choice: Передать как «убитые им», сохранив пояснение о местоименной сжатости в сноске.
  alternative: «его убитые» или толкование как убитых его врагом.
  rationale: Суффикс допускает компактное притяжательное выражение, которое в данном контексте наиболее естественно понимается агентно, но цепочка референтов остаётся не вполне явной.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным синтаксисом. Повтор корня נכה передан формами «поразил / поражал», а параллель убийства — «умерщвлён / умерщвлены / убитые». Местоименная неоднозначность в основном сохранена и пояснена сносками.
