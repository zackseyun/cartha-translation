  variant: modern literary Russian
source:
  edition: WLC
  text: בִּ/יבֹ֤שׁ קְצִירָ/הּ֙ תִּשָּׁבַ֔רְנָה נָשִׁ֕ים בָּא֖וֹת מְאִיר֣וֹת אוֹתָ֑/הּ כִּ֣י לֹ֤א עַם בִּינוֹת֙ ה֔וּא עַל כֵּן֙ לֹֽא יְרַחֲמֶ֣/נּוּ עֹשֵׂ֔/הוּ וְ/יֹצְר֖/וֹ לֹ֥א יְחֻנֶּֽ/נּוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/011.yaml
  text: When its branches[a] dry up, they are broken; women come and set them on fire. For this is a people without understanding; therefore its Maker will not have compassion on it, and the one who formed it will show it no favor.
translation:
  language: ru
  text: Когда её ветви[a] засохнут, они будут сломаны; женщины придут и разведут ими огонь. Ведь это народ, лишённый понимания; поэтому его Создатель не пожалеет его, и Тот, кто образовал его, не окажет ему милости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать «жатва», «срезанная поросль» или, в данном контексте, сухие ветви. Оно оформлено как существительное женского рода единственного числа, однако следующий глагол — во множественном числе, а далее местоимение снова стоит в единственном числе; вероятно, растительность представлена собирательно.
    reason: Лексическая и грамматическая неоднозначность
lexical_decisions:
- source_word: בִּיבֹשׁ
  choice: когда … засохнут
  rationale: Предлог ב с инфинитивной формой передаёт временное значение. «Засохнут» естественно сочетается с образом растительности, которую затем ломают и сжигают.
- source_word: קְצִירָהּ
  choice: её ветви
  rationale: Обычно существительное связано с жатвой или срезанным ростом, но здесь речь идёт о высохшей растительности, которую ломают и используют как топливо. «Ветви» ясно передаёт конкретный образ, а неоднозначность отмечена в сноске.
- source_word: תִּשָּׁבַרְנָה
  choice: их обломают
  rationale: Форма стоит во множественном числе и относится к высохшим частям растения. Русская неопределённо-личная конструкция естественно передаёт пассивный смысл.
- source_word: נָשִׁים בָּאוֹת
  choice: придут женщины
  rationale: Сохраняется прямое упоминание женщин и последовательность действий в образе суда.
- source_word: מְאִירוֹת אוֹתָהּ
  choice: разведут ими огонь
  rationale: Глагол описывает разжигание огня с помощью высохшей растительности. Такой перевод ясно показывает, что ветви служат топливом.
- source_word: לֹא עַם בִּינוֹת הוּא
  choice: это народ, лишённый понимания
  rationale: Передаёт отсутствие разумения как характеристику народа без добавления конфессионально окрашенной терминологии.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Сохраняет причинно-следственную связь между отсутствием понимания и объявленным судом.
- source_word: לֹא יְרַחֲמֶנּוּ
  choice: не пожалеет его
  rationale: Передаёт значение сострадания и милосердия; местоимение относится к собирательному существительному «народ».
- source_word: עֹשֵׂהוּ
  choice: его Создатель
  rationale: Сохраняет краткое причастное именование Бога как Того, кто создал народ.
- source_word: וְיֹצְרוֹ
  choice: Тот, кто образовал его
  rationale: Сохраняет отдельный глагольный образ יצר — формирования, придания формы — и параллелизм с «Создателем».
- source_word: לֹא יְחֻנֶּנּוּ
  choice: не окажет ему милости
  rationale: Передаёт значение благоволения и милости, не смешивая его полностью с предшествующим выражением сострадания.
theological_decisions:
- issue: Число и референт в образе высохшей растительности
  choice: Передать קְצִירָהּ контекстуально как «ветви» во множественном числе, согласуя с ним последующие русские формы, а грамматический сдвиг в еврейском отметить в сноске.
  alternative: «Когда её срезанная поросль засохнет, её обломают; женщины придут и разведут ею огонь» или «когда её урожай засохнет».
  rationale: Еврейский текст сочетает форму женского рода единственного числа с глаголом женского рода множественного числа, вероятно рассматривая растительность то как совокупность, то как отдельные части. Контекст высыхания, ломки и сжигания поддерживает конкретное «ветви», но неоднозначность не должна быть скрыта.
- issue: Два параллельных обозначения Бога и два выражения отказа в милости
  choice: Сохранить отдельно «Создатель» и «Тот, кто образовал», а также различить «не пожалеет» и «не окажет милости».
  alternative: 'Свести обе строки к общему выражению: «Бог не помилует их».'
  rationale: 'Текст намеренно употребляет два глагола создания, עשה и יצר, и два глагола милосердного отношения, רחם и חנן. Их различение сохраняет богословское напряжение: Создавший и образовавший народ отказывает ему в сострадании и милости из-за отсутствия понимания.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен для обычного читателя; сохранены образ суда, причинная связь и параллелизм двух обозначений Творца.
