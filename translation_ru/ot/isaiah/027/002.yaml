  - marker: b
    text: 'Или: «пойте о нём» либо «пойте в его честь». Еврейский глагол может означать ответное пение, а местоимение относится к винограднику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Устойчивая и естественная для русского библейско-пророческого стиля временная формула.
- source_word: כֶּרֶם
  choice: виноградник
  rationale: Существительное обозначает виноградник, а не отдельную виноградную лозу; это также соответствует образу в ближайшем контексте.
- source_word: חֶמֶד
  choice: желанный
  rationale: Слово выражает привлекательность, желанность и то, что доставляет радость. «Желанный» сохраняет положительную оценку и поэтически естественно сочетается с «виноградником»; более буквальная именная конструкция отмечена в сноске.
- source_word: עַנּוּ
  choice: пойте
  rationale: 'Форма, вероятно, является повелительным наклонением множественного числа от ענה в музыкальном или литургическом значении: отвечать пением, петь. Краткое «пойте» естественно передаёт призыв, не исключая оттенка ответного пения.'
- source_word: לָהּ
  choice: ему
  rationale: Предлог ל с местоименным суффиксом женского рода отсылает к еврейскому слову «виноградник». В русском грамматический род слова мужской, поэтому употреблено «ему». Возможные смысловые отношения — петь ему, о нём или в его честь — сохранены в сноске.
