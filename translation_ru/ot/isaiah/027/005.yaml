  text: א֚וֹ יַחֲזֵ֣ק בְּ/מָעוּזִּ֔/י יַעֲשֶׂ֥ה שָׁל֖וֹם לִ֑/י שָׁל֖וֹם יַֽעֲשֶׂה לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/005.yaml
  text: Or let him take hold of my strength[a]; let him make peace with me; let him make peace with me.
translation:
  language: ru
  text: Или пусть он ухватится за Мою твердыню[a], пусть заключит мир со Мной, пусть заключит мир со Мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за Мою силу», «за Моё убежище» или «за Мою защиту».'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: Или
  rationale: Вводит альтернативу предшествующему образу суда; краткий союз сохраняет связь с контекстом, не уточняя её сверх сказанного.
- source_word: יַחֲזֵק
  choice: пусть он ухватится
  rationale: Передаёт активное действие — схватиться, крепко взяться — и побудительно-разрешительный оттенок данной глагольной формы.
- source_word: בְּמָעוּזִּי
  choice: за Мою твердыню
  rationale: Сохраняет образ укреплённого убежища и допускает заложенные в מָעוֹז оттенки силы и защиты; предлог передан естественным для русского управления сочетанием «ухватиться за».
- source_word: יַעֲשֶׂה שָׁלוֹם לִי
  choice: пусть заключит мир со Мной
  rationale: Русское «заключить мир с кем-либо» естественно передаёт идиому עשה שלום לְ в значении примирения и мирных отношений.
- source_word: שָׁלוֹם יַעֲשֶׂה לִּי
  choice: пусть заключит мир со Мной
  rationale: Полный повтор сохранён, поскольку в еврейском тексте он служит смысловому и риторическому усилению.
theological_decisions:
- issue: К кому относятся местоимения первого лица
  choice: Местоимения переданы как прямая речь Бога, предлагающего защиту и мир с Ним.
  alternative: Обезличить речь или ослабить прямое указание на Бога.
  rationale: Ближайший контекст определяет говорящего как Бога; перевод сохраняет это, не добавляя более узких богословских выводов.
- issue: Характер предлагаемой альтернативы
  choice: Сохранены одновременно образы обращения к Божьей твердыне и заключения мира с Богом.
  alternative: Истолковать первую строку только как абстрактное упование или весь стих только как формулу примирения.
  rationale: Еврейский текст соединяет конкретную метафору убежища с языком мира; перевод не сводит один образ к другому.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Повтор заключительной фразы сохранён без сглаживания. Прописные буквы в местоимениях обозначают Бога согласно принятой русской библейской издательской практике.
