  variant: modern literary Russian
source:
  edition: WLC
  text: חֵמָ֖ה אֵ֣ין לִ֑/י מִֽי יִתְּנֵ֜/נִי שָׁמִ֥יר שַׁ֨יִת֙ בַּ/מִּלְחָמָ֔ה אֶפְשְׂעָ֥ה בָ֖/הּ אֲצִיתֶ֥/נָּה יָּֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/004.yaml
  text: I have no wrath[a]. Who would set briers and thorns against me in battle? I would march against them[b]; I would burn them up together.
translation:
  language: ru
  text: Нет во Мне ярости.[a] Кто выставил бы против Меня в бою колючки и терновник? Я бы пошёл на них, разом предал бы их огню.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нет у Меня гнева». Еврейское слово означает сильный, пылающий гнев; предмет гнева в тексте не назван.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте местоименные окончания имеют единственное число женского рода и собирательно относятся к колючкам и терновнику; по-русски смысл естественно передан множественным числом.
    reason: grammar
lexical_decisions:
- source_word: חֵמָה אֵין לִי
  choice: Нет во Мне ярости
  rationale: Передаёт экзистенциально-притяжательную конструкцию естественно и торжественно, сохраняя интенсивность חֵמָה и не уточняя объект ярости, которого нет в еврейском тексте.
- source_word: מִי יִתְּנֵנִי
  choice: Кто выставил бы против Меня
  rationale: Буквально «кто дал бы Мне», но в контексте боевого вызова речь идёт о том, чтобы перед говорящим выставили противников. Сослагательная форма по-русски естественно передаёт оттенок вызова или желания.
- source_word: שָׁמִיר שַׁיִת
  choice: колючки и терновник
  rationale: Оба слова обозначают колючую растительность. Выбор сохраняет образ и избегает искусственного различения видов, которое невозможно установить с уверенностью.
- source_word: בַּמִּלְחָמָה
  choice: в бою
  rationale: Кратко и естественно передаёт военную обстановку и сочетается с образом противников, выставленных против говорящего.
- source_word: אֶפְשְׂעָה בָהּ
  choice: Я бы пошёл на них
  rationale: Глагол פשׂע здесь означает шагнуть или двинуться через/против чего-либо. В военном контексте «пошёл на них» сохраняет движение и наступательную силу, не сводя образ однозначно к нападению или попранию.
- source_word: אֲצִיתֶנָּה יָּחַד
  choice: разом предал бы их огню
  rationale: Передаёт каузативное значение «поджечь» и наречие יחד как одновременное, полное уничтожение. Множественное число естественно относится по-русски к паре собирательных образов.
theological_decisions:
- issue: Отношение говорящего к винограднику
  choice: Оставить без уточнения заявление «Нет во Мне ярости»
  alternative: Я не гневаюсь на виноградник
  rationale: Контекст указывает на Господа как хранителя виноградника, однако прямого дополнения в стихе нет. Добавление «на виноградник» сняло бы подлинную недосказанность и ослабило переход к вызову враждебным колючкам.
- issue: Образ колючек и терновника
  choice: Сохранить их как образ противников без явного аллегорического толкования
  alternative: Передать их непосредственно как врагов народа Божьего
  rationale: Текст использует растительный образ в контексте виноградника и боя, но сам стих не отождествляет колючки с конкретной группой. Перевод не должен вносить конфессиональное или частное толкование.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Формы «во Мне» и «против Меня» пишутся с прописной буквы как указание на Господа в непосредственном контексте. Синтаксис сохраняет резкий переход от отсутствия ярости к боевому вызову.
