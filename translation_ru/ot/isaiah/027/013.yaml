source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יִתָּקַע֮ בְּ/שׁוֹפָ֣ר גָּדוֹל֒ וּ/בָ֗אוּ הָ/אֹֽבְדִים֙ בְּ/אֶ֣רֶץ אַשּׁ֔וּר וְ/הַ/נִּדָּחִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הִשְׁתַּחֲו֧וּ לַ/יהוָ֛ה בְּ/הַ֥ר הַ/קֹּ֖דֶשׁ בִּ/ירוּשָׁלִָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/013.yaml
  text: And in that day a great trumpet will be blown[c][b][a], and those perishing in the land of Assyria and those driven away in the land of Egypt will come and worship Yahweh on the holy mountain in Jerusalem.
translation:
  language: ru
  text: 'И будет в тот день: зазвучит великая труба, и придут гибнущие[a] в земле Ассирии и изгнанные[b] в земле Египта, и поклонятся[c] Господу на святой горе в Иерусалиме.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потерянные», «пропавшие».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прогнанные», «рассеянные».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «падут ниц» перед Господом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохранена характерная пророческая формула будущего события; двоеточие естественно вводит последующее описание.
- source_word: יִתָּקַע בְּשׁוֹפָר גָּדוֹל
  choice: зазвучит великая труба
  rationale: Естественная русская передача пассивной формы «будет протрублено»; «труба» ясно передаёт назначение шофара, а «великая» сохраняет возможные оттенки величины и значимости.
- source_word: הָאֹבְדִים
  choice: гибнущие
  rationale: Причастие сохраняет незавершённую словесную силу и допускает значение как гибели, так и потерянности; последнее отмечено в сноске.
- source_word: בְּאֶרֶץ אַשּׁוּר
  choice: в земле Ассирии
  rationale: Сохранено явно выраженное в еврейском тексте слово «земля» и географическая конкретность.
- source_word: וְהַנִּדָּחִים
  choice: изгнанные
  rationale: Передаёт пассивное состояние людей, которых прогнали или рассеяли, не сужая образ до строго юридического изгнания.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египта
  rationale: Сохранено слово «земля»; конструкция согласована с упоминанием Ассирии.
- source_word: וְהִשְׁתַּחֲווּ
  choice: поклонятся
  rationale: В контексте обращения к Богу слово обозначает поклонение, одновременно сохраняя в русском языке телесный оттенок поклона; буквальный образ указан в сноске.
- source_word: לַיהוָה
  choice: Господу
  rationale: Тетраграмматон передан принятой в русской библейской традиции reverential-формой «Господь», без введения реконструированного произношения в основной текст.
- source_word: בְּהַר הַקֹּדֶשׁ
  choice: на святой горе
  rationale: Естественно передаёт определённую священную гору, то есть Сион, не подставляя это название непосредственно в текст.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Стандартная русская форма топонима с естественным предложным управлением.
theological_decisions:
- issue: Образ будущего собирания рассеянных
  choice: Сохранён открытый пророческий образ возвращения из Ассирии и Египта.
  alternative: Ограничить смысл только историческим возвращением изгнанников либо только окончательным эсхатологическим собиранием.
  rationale: Формула «в тот день» и образ восстановления допускают исторический и эсхатологический горизонты; перевод не разрешает эту напряжённость за читателя.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве; Иегова
  rationale: Форма «Господь» сохраняет однозначную отсылку к Богу завета и соответствует устойчивой русской библейской норме, не навязывая спорное произношение тетраграмматона.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис остаётся ясным для обычного читателя; причастия «гибнущие» и «изгнанные» сохраняют компактность и смысловую напряжённость еврейского текста.
