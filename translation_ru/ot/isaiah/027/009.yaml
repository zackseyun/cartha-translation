source:
  edition: WLC
  text: לָ/כֵ֗ן בְּ/זֹאת֙ יְכֻפַּ֣ר עֲוֺֽן יַעֲקֹ֔ב וְ/זֶ֕ה כָּל פְּרִ֖י הָסִ֣ר חַטָּאת֑/וֹ בְּ/שׂוּמ֣/וֹ כָּל אַבְנֵ֣י מִזְבֵּ֗חַ כְּ/אַבְנֵי גִר֙ מְנֻפָּצ֔וֹת לֹֽא יָקֻ֥מוּ אֲשֵׁרִ֖ים וְ/חַמָּנִֽים־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/009.yaml
  text: 'Therefore by this the guilt of Jacob will be atoned for, and this will be the full fruit of the removal of his sin: when he makes all the stones of the altar like crushed chalkstones, the Asherah poles and incense altars will not stand.'
translation:
  language: ru
  text: 'Поэтому этим будет искуплена вина Иакова, и это будет полным плодом устранения его греха: когда он превратит все камни жертвенника в раздробленный мел, столбы Ашеры и солнечные столбы[a] не будут стоять.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «солнечные изваяния»; значение еврейского слова «хамманим» точно не установлено. Его связывают с культовыми предметами, посвящёнными солнцу; некоторые переводы понимают его как курильные алтари.'
    reason: חַמָּנִים — редкий и спорный термин. Сноска фиксирует основное значение и существенную переводческую альтернативу, не устраняя неоднозначность оригинала.
lexical_decisions:
- source_word: יְכֻפַּר עֲוֺן
  choice: будет искуплена вина
  rationale: Глагол כפר в пассивной форме выражает совершение искупления, а עון здесь обозначает вину за беззаконие; сочетание передаёт и культовый, и нравственный смысл.
- source_word: כָּל־פְּרִי
  choice: весь плод
  rationale: Сохранён образ плода как полного результата очищения, без замены его более отвлечённым словом «следствие».
- source_word: הָסִר חַטָּאתוֹ
  choice: удаления его греха
  rationale: Масдарная конструкция допускает буквальное понимание удаления греха; местоимение отнесено к Иакову.
- source_word: אַבְנֵי־גִר מְנֻפָּצוֹת
  choice: раздробленные известковые камни
  rationale: גִר означает известковый или меловой камень, а מְנֻפָּצוֹת — разбитые, раздробленные; образ полного разрушения жертвенников сохранён.
- source_word: אֲשֵׁרִים
  choice: столбы Ашеры
  rationale: Термин обозначает культовые предметы, связанные с Ашерой; «столбы» понятно современному читателю и не смешивает их с обычными деревьями.
- source_word: חַמָּנִים
  choice: курильные алтари
  rationale: Контекст требует обозначения языческих культовых сооружений; значение термина спорно, но такой перевод соответствует одной из основных контекстуальных трактовок.
theological_decisions:
- issue: Средство искупления в выражении בְּזֹאת
  choice: «так» сохраняет отсылку к последующему уничтожению идолопоклонства как проявлению удаления греха
  alternative: «этим», с более прямым пониманием разрушения алтарей как средства искупления
  rationale: Еврейский текст допускает напряжение между средством искупления и его плодом. Русское «так» не делает разрушение идолов самостоятельной искупительной заслугой и не устраняет связь между очищением и покаянием.
- issue: Субъект בְּשׂוּמוֹ
  choice: «он обратит» с грамматически возможным отнесением к Иакову
  alternative: 'безличное или божественное действие: «когда все камни жертвенника будут обращены»'
  rationale: Мужской единственный субъект естественно соотносится с ближайшим «Иаковом», однако контекст может подразумевать действие Бога через суд; перевод сохраняет грамматику, не вводя явно отсутствующее имя.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой образности и культовой терминологии. Формулировка торжественная, но понятная; архаизмы вроде «беззаконие Иакова загладится» не использованы.
