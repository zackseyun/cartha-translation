base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/010.yaml
  text: For the fortified city is solitary[a], a habitation deserted and abandoned like the wilderness; there a calf grazes[b], and there it lies down and strips its branches bare.
translation:
  language: ru
  text: Ибо укреплённый город одинок — жилище, покинутое и оставленное, словно пустыня. Там будет пастись телёнок, там он будет лежать и обглодает её ветви дочиста.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский суффикс в слове «ветви» имеет женский род («её»); вероятно, он относится к городу или жилищу. Глагол обозначает полное уничтожение ветвей поеданием.
    reason: grammatical_clarification
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт объяснительную или причинную связь с предшествующим контекстом и сохраняет возвышенный поэтический тон.
- source_word: עִיר בְּצוּרָה
  choice: укреплённый город
  rationale: Прямо передаёт город как защищённый укреплениями; определённость в русском языке устанавливается контекстом без артикля.
- source_word: בָּדָד
  choice: остался один
  rationale: Естественно по-русски выражает одиночество и запустение города, не сводя значение лишь к отсутствию населения.
- source_word: נָוֶה
  choice: обиталище
  rationale: Сохраняет основное значение места обитания и допускает присущий слову пастушеский оттенок, отмеченный в сноске.
- source_word: מְשֻׁלָּח וְנֶעֱזָב
  choice: покинуто и оставлено
  rationale: Сохраняет парность пассивных определений и их усиливающий эффект, не смешивая их в одно слово.
- source_word: כַּמִּדְבָּר
  choice: словно пустыня
  rationale: Передаёт сравнение с необитаемой, невозделанной местностью; «пустыня» естественна и узнаваема в библейской поэзии.
- source_word: שָׁם יִרְעֶה עֵגֶל
  choice: там будет пастись телёнок
  rationale: Сохраняет единственное число и пасторальный образ; русская форма будущего времени соответствует несовершенному действию в данном пророческом описании.
- source_word: וְשָׁם יִרְבָּץ
  choice: там он будет лежать
  rationale: Передаёт спокойное лежание животного и ясно связывает действие с телёнком.
- source_word: וְכִלָּה סְעִפֶיהָ
  choice: и объест все его ветви
  rationale: «Объест» естественно описывает действие пасущегося животного, а «все» передаёт значение полного уничтожения в כלה. Местоимение согласовано с русским словом «город».
