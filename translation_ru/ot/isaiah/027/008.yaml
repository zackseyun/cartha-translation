base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/008.yaml
  text: By measure[a], when you sent her away, you contended with her[c][b]; he drove her out with his fierce wind on the day of the east wind.
translation:
  language: ru
  text: В меру[a], когда ты отсылал её, ты судился с нею[b]; он изгнал её своим суровым ветром в день восточного ветра[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сдержанно»; возможно также: «точной мерой». Редкое еврейское слово, вероятно, означает, что суд был ограниченным, а не уничтожающим.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте женский род сохранён в местоименных суффиксах; вероятно, так олицетворены Сион, Израиль или Божий народ.
    reason: alternative_reading
  - marker: c
    text: Восточный ветер — обычный библейский образ знойного и разрушительного ветра, дующего из пустыни.
    reason: cultural_note
lexical_decisions:
- source_word: בְּסַּאסְּאָה
  choice: В меру
  rationale: Редкое и трудное слово, вероятно, указывает на отмеренный, ограниченный суд, а не на полное уничтожение. Русское «в меру» сохраняет краткость и смысл сдержанности.
- source_word: בְּשַׁלְחָהּ
  choice: отсылая её
  rationale: 'Конструкция с инфинитивом и предлогом ב передаёт сопутствующее действие или способ: Бог судится с нею, отсылая или удаляя её. Причастная форма близка к структуре еврейского текста и не привносит образ развода.'
- source_word: תְּרִיבֶנָּה
  choice: ты судился с нею
  rationale: Глагол ריב обозначает спор, тяжбу или ведение судебного дела. «Судился с нею» сохраняет юридический оттенок и при этом понятно современному читателю.
- source_word: הָגָה
  choice: он изгнал её
  rationale: В данном контексте глагол означает решительное удаление или изгнание; образ сильного ветра поддерживает значение насильственного удаления.
- source_word: בְּרוּחוֹ
  choice: своим ветром
  rationale: Хотя רוּחַ может означать также «дыхание» или «дух», упоминание восточного ветра ясно поддерживает буквальный образ ветра.
- source_word: הַקָּשָׁה
  choice: яростным
  rationale: Прилагательное выражает суровость и силу. «Яростный ветер» естественно звучит по-русски и передаёт разрушительную мощь, не превращая эпитет в отдельное толкование.
- source_word: בְּיוֹם קָדִים
  choice: в день восточного ветра
  rationale: Сохранён традиционный библейский образ восточного ветра без пояснительного расширения в основном тексте.
theological_decisions:
- issue: К кому относятся местоимения женского рода
  choice: Сохранить «её/нею», не называя референта в основном тексте.
  alternative: 'Уточнить: Израиль, Сион или народ Божий.'
  rationale: Еврейский текст использует женский род, но в самом стихе не называет референта прямо. Сохранение местоимений удерживает олицетворение и не сужает возможное понимание.
- issue: Переход от второго лица к третьему
  choice: 'Сохранить переход: «ты судился… он изгнал».'
  alternative: 'Согласовать обе части во втором лице: «ты судился… ты изгнал».'
  rationale: Резкая смена лица присутствует в масоретском тексте. Её сохранение передаёт поэтическую форму и не сглаживает подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим строем. Строчные местоимения «ты/он/своим» соответствуют современной издательской норме и не вводят конфессиональной практики почтительного написания с прописной буквы. Сохранены женское олицетворение и смена грамматического лица.
