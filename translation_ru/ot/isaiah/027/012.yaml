source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יַחְבֹּ֧ט יְהוָ֛ה מִ/שִּׁבֹּ֥לֶת הַ/נָּהָ֖ר עַד נַ֣חַל מִצְרָ֑יִם וְ/אַתֶּ֧ם תְּלֻקְּט֛וּ לְ/אַחַ֥ד אֶחָ֖ד בְּנֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/012.yaml
  text: And in that day Yahweh will thresh from the channel of the River to the Wadi of Egypt[a], and you will be gathered one by one[d][c][b], O sons of Israel.
translation:
  language: ru
  text: 'И будет в тот день: Яхве будет выколачивать урожай от потока Реки[a] до вади Египта[b], а вы, сыны Израиля[d], будете собраны по одному[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «Рекой» здесь, вероятнее всего, подразумевается Евфрат.
    reason: cross_reference
  - marker: b
    text: 'Возможный перевод: «до Египетского потока». Еврейское слово обозначает вади — русло сезонного водотока, а не обязательно Нил.'
    reason: lexical_alternative
  - marker: c
    text: Глагол «будете собраны» напоминает о подборе урожая по отдельности после его выколачивания.
    reason: cultural_note
  - marker: d
    text: 'Возможный перевод: «дети Израиля». Буквально по-еврейски: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохранена обычная пророческая формула времени; этот оборот естественен для возвышенного современного русского текста.
- source_word: יַחְבֹּט
  choice: будет выколачивать урожай
  rationale: Глагол חבט обозначает выбивание зерна или плодов. Добавлен подразумеваемый объект «урожай», чтобы сельскохозяйственный образ был понятен по-русски, но сам образ отделения и последующего собирания сохранён.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не замещающий его титул.
- source_word: מִשִּׁבֹּלֶת הַנָּהָר
  choice: от русла Реки
  rationale: שׁבלת здесь в географическом контексте вероятнее всего означает поток или русло. Написание «Река» сохраняет традиционное обозначение великой реки без внесения её идентификации прямо в текст.
- source_word: עַד נַחַל מִצְרָיִם
  choice: до Египетского вади
  rationale: נחל обычно обозначает русло сезонного водотока; «вади» точнее, чем общее «река», и не создаёт ложного отождествления с Нилом.
- source_word: תְּלֻקְּטוּ
  choice: вас соберут
  rationale: Пассивная форма передаёт собирание, напоминающее подбор оставшегося урожая; неопределённо-личная русская конструкция сохраняет пассивный смысл естественно.
- source_word: לְאַחַד אֶחָד
  choice: по одному
  rationale: 'Кратко и ясно передана дистрибутивность: каждого соберут отдельно.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранена буквальная мужская форма этнического обращения; «сыны» соответствует достоинству пророческой речи и остаётся понятным современному читателю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон, поэтому личное имя сохранено, а не заменено титулом.
- issue: Образ выколачивания и собирания
  choice: Сохранить сельскохозяйственную метафору без определения её точного богословского механизма
  alternative: Передать прямо как очищение, суд или возвращение изгнанников
  rationale: Текст связывает выколачивание урожая с поочерёдным собиранием Израиля, но не объясняет однозначно все стороны образа; перевод не должен преждевременно сводить его только к суду либо только к восстановлению.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: дети Израиля; народ Израиля
  rationale: В основном тексте сохранено буквальное обращение мужского рода, а более широкое традиционное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Формула «И будет в тот день» и обращение «сыны Израиля» сохраняют достоинство исходного текста; «вади» служит точным и понятным географическим термином. Сельскохозяйственная метафора сохранена, при этом подразумеваемое «урожай» добавлено ради естественного русского синтаксиса.
