  source_fidelity: 'Смысловой каркас передан верно: пророческая формула, суд Яхве, три характеристики меча, два параллельных именования Левиафана и морской дракон сохранены. Однако «змея извивающегося» передаёт совершаемое действие, тогда как עֲקַלָּתוֹן характеризует змея как извилистого/изогнутого; формулировку следует уточнить. Альтернативные чтения в сносках также нуждаются в грамматическом и лексическом исправлении.'
