base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/001.yaml
  text: In that day Yahweh will punish Leviathan the fleeing serpent[a], Leviathan the twisting serpent, with his fierce and great and strong sword[c][b]; and he will kill the dragon that is in the sea.
translation:
  language: ru
  text: В тот день Яхве Своим грозным, великим и могучим мечом покарает Левиафана, ускользающего змея[a], Левиафана, извилистого змея[b], и убьёт дракона[c], который в море.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быстрого змея»; возможен также смысл: «бегущего змея».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «искривлённого змея» или «вьющегося змея».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «морское чудовище».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Сохраняет обычную пророческую временную формулу и естественно звучит по-русски.
- source_word: יִפְקֹד
  choice: покарает
  rationale: В сочетании с עַל и в контексте суда глагол означает наказание; «покарает» передаёт судебный смысл и соответствует возвышенной поэзии.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом.
- source_word: בְּחַרְבוֹ הַקָּשָׁה וְהַגְּדוֹלָה וְהַחֲזָקָה
  choice: Своим суровым, великим и могучим мечом
  rationale: Творительный падеж выражает орудие действия; три определения сохраняют нарастающее описание меча. «Суровый» передаёт קָשֶׁה применительно к орудию суда без неестественного «жёсткий».
- source_word: לִוְיָתָן
  choice: Левиафана
  rationale: Сохраняется традиционная транслитерация имени мифопоэтического существа.
- source_word: נָחָשׁ בָּרִחַ
  choice: змея ускользающего
  rationale: «Змей» соответствует возвышенному регистру; «ускользающий» сохраняет вероятный смысл бегства или скользящего движения, не сводя образ только к быстроте.
- source_word: נָחָשׁ עֲקַלָּתוֹן
  choice: змея извивающегося
  rationale: Передаёт образ искривлённого, вьющегося движения и естественно сочетается со словом «змей».
- source_word: וְהָרַג
  choice: и убьёт
  rationale: В пророческой последовательности форма продолжает будущее время; прямой современный эквивалент сохраняет силу высказывания.
- source_word: הַתַּנִּין
  choice: дракона
  rationale: В данном мифопоэтическом контексте «дракон» сохраняет образ морского чудовища и связь с Левиафаном.
- source_word: אֲשֶׁר בַּיָּם
  choice: который в море
  rationale: Кратко и близко передаёт относительное предложение; море не определяется как конкретное географическое название.
theological_decisions:
- issue: Мифопоэтические образы Левиафана и таннина
  choice: Сохранить Левиафана и дракона как образы самого стиха, не отождествляя их в основном тексте с сатаной или определённой империей.
  alternative: Истолковать их прямо как сатану, силы хаоса либо конкретные враждебные державы.
  rationale: Еврейский текст использует образность морских чудовищ, но в этом стихе прямо не устанавливает единственного исторического или богословского референта.
translation_notes:
  register: Современный литературный русский язык с dignified пророческим звучанием. Порядок компонентов показывает, что меч направлен против обоих параллельных описаний Левиафана. Заглавное «Своим» употреблено как уважительное местоименное написание применительно к Богу; образность не рационализирована.
