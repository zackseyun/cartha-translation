id: ISA.27.6
reference: Isaiah 27:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הַ/בָּאִים֙ יַשְׁרֵ֣שׁ יַֽעֲקֹ֔ב יָצִ֥יץ וּ/פָרַ֖ח יִשְׂרָאֵ֑ל וּ/מָלְא֥וּ פְנֵי תֵבֵ֖ל תְּנוּבָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/006.yaml
  text: In days to come Jacob will take root[a]; Israel will blossom and flower[b], and they will fill the face of the world with fruit.
translation:
  language: ru
  text: В грядущие дни[a] Иаков пустит корни, Израиль даст ростки и расцветёт, и они наполнят плодами[b] весь мир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Приходящие: Иаков пустит корни». Начальное еврейское выражение буквально можно понять как «приходящие», но в данном контексте оно, вероятно, указывает на будущее время.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «урожаем», «произведениями земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּאִים
  choice: В грядущие дни
  rationale: Форма буквально означает «приходящие», однако здесь, вероятнее всего, служит эллиптическим обозначением будущего времени. Перевод естественно передаёт пророческую направленность в будущее, не скрывая альтернативу, указанную в сноске.
- source_word: יַשְׁרֵשׁ
  choice: пустит корни
  rationale: 'Глагол породы хифиль допускает каузативное значение «укоренит», но в данном растительном образе естественно понимается непереходно: Иаков «пустит корни».'
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Сохранено традиционное русское написание имени; в параллелизме оно собирательно обозначает народ, но это не раскрывается пояснительной вставкой.
- source_word: יָצִיץ
  choice: даст ростки
  rationale: 'Глагол обозначает появление почек или ростков. Этот вариант сохраняет последовательность образов: корни, ростки, цветение и плоды.'
- source_word: וּפָרַח
  choice: и расцветёт
  rationale: Передан конкретный ботанический образ цветения, а не более отвлечённое «будет процветать».
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено традиционное русское написание имени и его поэтический параллелизм с Иаковом.
- source_word: וּמָלְאוּ
  choice: и они наполнят
  rationale: Явное местоимение сохраняет заметный переход еврейского текста от единственного числа собирательных имён к глаголу во множественном числе.
- source_word: פְנֵי תֵבֵל
  choice: весь мир
  rationale: Буквально «лицо мира». По-русски «весь мир» естественно передаёт охват всей обитаемой земли, избегая неясной кальки.
- source_word: תְּנוּבָה
  choice: плодами
  rationale: Слово обозначает плод, произведение земли или урожай. «Плодами» поддерживает сквозной растительный образ и допускает метафорическое прочтение.
theological_decisions:
- issue: Собирательное значение имён Иаков и Израиль в растительном образе
  choice: Имена сохранены без пояснительного расширения и представляют народ как единое целое, а затем как множество.
  alternative: 'Перевести раскрывающе: «потомки Иакова» или «народ Израиля».'
  rationale: Еврейская поэзия прямо употребляет имена Иаков и Израиль. Их сохранение удерживает литературную и богословскую многослойность текста, не навязывая уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Последовательность «пустит корни — даст ростки — расцветёт — наполнит плодами» делает растительный образ ясным; синтаксический переход к множественному числу намеренно сохранён.
