base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/003.yaml
  text: I[a], Yahweh, am its keeper[b]; I water it continually. Lest anyone punish it, I guard it night and day.
translation:
  language: ru
  text: 'Я, Яхве, — его хранитель;

    каждое мгновение[a] поливаю его.

    Чтобы никто не посягнул на него[b],

    ночью и днём охраняю его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непрестанно» или «из мгновения в мгновение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не причинил ему вреда»; возможно также: «не подверг его наказанию». Еврейский глагол может обозначать как враждебное вмешательство, так и карательное посещение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: נֹצְרָהּ
  choice: храню его
  rationale: Глагол נצר означает беречь, охранять, сохранять. Местоимение мужского рода согласовано с русским словом «виноградник», к которому отсылает женский суффикс в еврейском тексте.
- source_word: לִרְגָעִים
  choice: каждое мгновение
  rationale: Близко передаёт буквальное «по мгновениям» и выражает непрестанную заботу.
- source_word: אַשְׁקֶנָּה
  choice: поливаю его
  rationale: Каузативная форма שקה означает «давать пить»; применительно к винограднику естественно «поливать».
- source_word: פֶּן
  choice: чтобы никто не
  rationale: Передаёт предупредительно-предотвратительное значение частицы в естественной современной русской конструкции.
- source_word: יִפְקֹד עָלֶיהָ
  choice: не напал на него
  rationale: פקד с על допускает значение враждебного выступления или карательного посещения. В контексте охраны виноградника «напал» ясно передаёт угрозу, не уточняя отсутствующего в еврейском тексте субъекта.
- source_word: לַיְלָה וָיוֹם
  choice: ночь и день
  rationale: Естественный русский меризм, обозначающий непрерывность.
- source_word: אֶצֳּרֶנָּה
  choice: Я стерегу его
  rationale: Повторно употреблено נצר; «стерегу» сохраняет значение бдительной охраны и позволяет избежать тяжёлого дословного повтора.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет это различие.
- issue: Неуказанный субъект יִפְקֹד
  choice: никто
  alternative: он; враг
  rationale: Еврейский глагол стоит в 3-м лице единственного числа без явно названного субъекта. Неопределённое «никто» в отрицательной конструкции сохраняет открытый характер угрозы и не вводит конкретного врага.
- issue: Значение פקד с על
  choice: напал на
  alternative: наказал; подверг каре; причинил вред
  rationale: Контекст говорит о защите виноградника от враждебного вмешательства, однако возможный карательно-судебный оттенок не устраняется и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим синтаксисом. Сохранены параллелизм строк, повтор первого лица и напряжение между заботой о винограднике и возможной враждебной либо карательной угрозой.
