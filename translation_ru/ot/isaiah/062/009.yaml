base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/009.yaml
  text: But those who gather it will eat it and praise Yahweh[b][a], and those who collect it will drink it in the courts of my sanctuary.
translation:
  language: ru
  text: Но[a] те, кто соберёт урожай, будут есть его и восхвалять Яхве, и те, кто соберёт виноград, будут пить вино во дворах моего святилища[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо те, кто соберёт урожай, будут есть его и восхвалять Яхве». Еврейское כִּי может означать «ибо» или «поистине»; здесь, в противопоставлении предыдущему стиху, оно передано словом «Но».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные варианты: «во дворах моей святыни» или «во дворах моего святого места».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: 'В контексте противопоставляет обещание этого стиха угрозе предыдущего: плодами будут пользоваться не чужие, а собравшие их. Формально возможны также «ибо» и «поистине».'
- source_word: מְאַסְפָיו
  choice: те, кто собрал урожай
  rationale: Причастие от אסף обозначает собирающих урожай; мужской суффикс отсылает к хлебу/зерну предыдущего стиха. «Урожай» естественно передаёт подразумеваемый объект по-русски.
- source_word: יֹאכְלֻהוּ
  choice: будут есть его
  rationale: Прямо передаёт имперфект от אכל и объектный суффикс мужского рода, относящийся к урожаю.
- source_word: וְהִלְלוּ אֶת־יְהוָה
  choice: и восхвалять Яхве
  rationale: Пиэль הלל означает «восхвалять»; однородный инфинитив после «будут» позволяет естественно передать координацию глаголов, не устраняя её будущей направленности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: וּמְקַבְּצָיו
  choice: те, кто собрал виноград
  rationale: Причастие от קבץ параллельно אסף; контекст предыдущего стиха и следующий глагол «пить» указывают на виноград/его винный продукт. Конкретизация делает русский текст ясным.
- source_word: יִשְׁתֻּהוּ
  choice: будут пить вино
  rationale: Глагол שתה означает «пить»; объектный суффикс контекстуально относится к вину. В русском явное «вино» естественнее местоимения после упоминания винограда.
- source_word: בְּחַצְרוֹת קָדְשִׁי
  choice: во дворах Моего святилища
  rationale: חצרות — дворы, а קָדְשִׁי здесь в сочетании с ними естественно имеет конкретный смысл святого места, то есть святилища.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохраняется собственное имя в исходном тексте без подмены титулом.
- issue: Значение קָדְשִׁי в культовом контексте
  choice: Моего святилища
  alternative: Моего святого места; Моей святости
  rationale: Упоминание дворов указывает на конкретное священное пространство, хотя буквально существительное связано со «святостью».
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавное «Моего» обозначает речь Бога. Контекстуальные «урожай», «виноград» и «вино» проясняют местоименные суффиксы, опираясь на Ис 62:8; параллелизм двух полустиший сохранён.
