source:
  edition: WLC
  text: וְ/הָיִ֛יתְ עֲטֶ֥רֶת תִּפְאֶ֖רֶת בְּ/יַד יְהוָ֑ה ו/צנוף מְלוּכָ֖ה בְּ/כַף אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/003.yaml
  text: You will be a crown of beauty in the hand of Yahweh[a], and a royal turban in the palm of your God.
translation:
  language: ru
  text: И будешь венцом великолепия в руке Яхве и царским тюрбаном[a] на ладони твоего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царской диадемой»; «царским головным убором». Еврейское слово означает обёрнутый головной убор, или тюрбан.'
    reason: Лексическое значение צָנִיף допускает несколько близких способов передачи; примечание сохраняет эту неоднозначность.
lexical_decisions:
- source_word: וְהָיִיתְ
  choice: И будешь
  rationale: Форма 2-го лица женского рода в пророческом контексте имеет будущее значение и сохраняет прямое обращение к Сиону/Иерусалиму.
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: венцом великолепия
  rationale: Сохраняется конструкция «венец великолепия» и возвышенный образ; «великолепие» передаёт תִּפְאֶרֶת, не сводя выражение к простому прилагательному.
- source_word: בְּיַד
  choice: в руке
  rationale: Буквальный пространственный образ показывает Сион как драгоценность, которую держит Яхве; абстрактное «во власти» ослабило бы метафору.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: וְצָנִיף מְלוּכָה
  choice: и царским тюрбаном
  rationale: צָנִיף обозначает обёрнутый головной убор, а מְלוּכָה придаёт ему царский характер. «Тюрбан» сохраняет отличие от упомянутого ранее венца.
- source_word: בְּכַף
  choice: на ладони
  rationale: כַּף конкретно обозначает ладонь или углубление руки. Предлог передан как «на», что естественно по-русски для предмета, лежащего на открытой ладони, при сохранении образа и вариативности параллелизма.
- source_word: אֱלֹהָיִךְ
  choice: твоего Бога
  rationale: Форма с суффиксом 2-го лица женского рода в данном контексте обозначает единого Бога Израиля и продолжает обращение к Сиону.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной пророческой образностью. Сохранены женский род обращения, конкретные образы руки и ладони и различие между венцом и тюрбаном.
