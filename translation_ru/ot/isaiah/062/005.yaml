base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/005.yaml
  text: For as a young man marries a virgin[a], so your sons will marry you; and as a bridegroom rejoices over a bride, so your God will rejoice over you.
translation:
  language: ru
  text: Как юноша женится на девственнице, так твои сыновья[a] женятся на тебе; и как жених радуется своей невесте, так твой Бог будет радоваться тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые древние переводы и многие толкователи отражают иное чтение: «твой строитель женится на тебе» или «твои строители женятся на тебе». Масоретский текст гласит: «твои сыновья».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְעַל / יִבְעָלוּךְ
  choice: женится / женятся на тебе
  rationale: В данном брачном сравнении глагол בעל обозначает вступление в брак. Такой перевод естественен по-русски и сохраняет повтор одного и того же образа в обеих частях.
- source_word: בָּחוּר
  choice: юноша
  rationale: Слово обозначает молодого мужчину брачного возраста; «юноша» точно и уместно в поэтическом контексте.
- source_word: בְּתוּלָה
  choice: девственница
  rationale: Перевод сохраняет лексическую определённость еврейского существительного, обычно обозначающего девственницу или незамужнюю девушку, не заменяя её более широким понятием «молодая женщина».
- source_word: בָּנָיִךְ
  choice: твои сыновья
  rationale: Масоретская огласовка даёт чтение «твои сыновья». Необычность метафоры не является достаточным основанием, чтобы заменять засвидетельствованный текст конъектурой; альтернативное чтение указано в сноске.
- source_word: מְשׂוֹשׂ חָתָן עַל כַּלָּה
  choice: как жених радуется невесте
  rationale: Именная конструкция со значением радости передана естественным русским сравнительным оборотом и согласована с однокоренным глаголом в продолжении стиха.
- source_word: יָשִׂישׂ עָלַיִךְ
  choice: будет радоваться тебе
  rationale: Глагол выражает сильную радость. Управление «радоваться тебе» естественно по-русски и сохраняет параллель с радостью жениха о невесте.
- source_word: אֱלֹהָיִךְ
  choice: твой Бог
  rationale: Несмотря на формально множественную форму אֱלֹהִים, здесь слово имеет единственное число и обозначает Бога Израиля; местоименная форма обращена к олицетворённому Сиону.
theological_decisions:
- issue: Следует ли переводить בָּנָיִךְ как «твои сыновья» или принять альтернативное чтение «твой строитель / твои строители»
  choice: твои сыновья
  alternative: твой строитель / твои строители
  rationale: Перевод следует масоретскому тексту и сохраняет намеренно напряжённый образ сыновей-жителей, вступающих в брачный союз с олицетворённым городом. Поскольку альтернативное чтение отражено в некоторых древних версиях и широко обсуждается, оно вынесено в сноску, а не скрыто.
- issue: Женский адресат местоименных форм второго лица
  choice: Сион/Иерусалим понимается как олицетворённая женщина
  alternative: Снять персонификацию и передать смысл как возвращение жителей в город
  rationale: Женские суффиксы и брачная образность прямо поддерживают персонификацию; её следует сохранить, не превращая метафору в прозаическое объяснение.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но не архаичной поэтической интонацией. Синтаксический параллелизм «как… так…; и как… так…» сохраняет устройство еврейского стиха. Необычная брачная метафора оставлена без сглаживания.
