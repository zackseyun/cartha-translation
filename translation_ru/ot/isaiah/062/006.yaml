  text: עַל חוֹמֹתַ֣יִ/ךְ יְרוּשָׁלִַ֗ם הִפְקַ֨דְתִּי֙ שֹֽׁמְרִ֔ים כָּל הַ/יּ֧וֹם וְ/כָל הַ/לַּ֛יְלָה תָּמִ֖יד לֹ֣א יֶחֱשׁ֑וּ הַ/מַּזְכִּרִים֙ אֶת יְהוָ֔ה אַל דֳּמִ֖י לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/006.yaml
  text: On your walls[a], Jerusalem, I have appointed watchmen; all day and all night, continually, they will never be silent. You who remind Yahweh, take no rest for yourselves,
translation:
  language: ru
  text: На твоих стенах, Иерусалим, Я поставил стражей. Целый день и целую ночь они не умолкнут ни на миг. Вы, напоминающие Яхве[a], не давайте себе покоя!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взывающие к Яхве»; буквально: «напоминающие Яхве» или «побуждающие Яхве вспомнить». Еврейское выражение необычно и образно передаёт настойчивое обращение к Богу.'
    reason: Лексическая неоднозначность каузативного причастия הַמַּזְכִּרִים и необычность сочетания с прямым дополнением יְהוָה.
lexical_decisions:
- source_word: חוֹמֹתַיִךְ
  choice: на твоих стенах
  rationale: חוֹמָה обозначает городскую оборонительную стену; обращение во втором лице относится к Иерусалиму.
- source_word: הִפְקַדְתִּי
  choice: Я поставил
  rationale: Hiphil глагола פקד здесь означает назначить или разместить на посту. «Поставил» естественно сочетается со стражами и сохраняет идею целенаправленного назначения.
- source_word: שֹׁמְרִים
  choice: стражей
  rationale: Причастие от שמר обозначает тех, кто несёт стражу. «Стражи» сохраняет образ людей, поставленных на городских стенах, не уточняя их личность.
- source_word: כָּל־הַיּוֹם וְכָל־הַלַּיְלָה תָּמִיד לֹא יֶחֱשׁוּ
  choice: Целый день и целую ночь они не умолкнут ни на миг
  rationale: 'Перевод передаёт совокупный усилительный смысл: стражи молчат ни днём, ни ночью, то есть непрестанно. «Ни на миг» естественно выражает תָּמִיד в данном контексте.'
- source_word: הַמַּזְכִּרִים אֶת־יְהוָה
  choice: побуждающие Яхве вспомнить
  rationale: Hiphil от זכר буквально выражает побуждение к воспоминанию. Формулировка сохраняет необычный и намеренно смелый образ настойчивого обращения к Богу, не добавляя, что именно Он должен вспомнить.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: אַל־דֳּמִי לָכֶם
  choice: не давайте себе покоя
  rationale: דֳּמִי может обозначать молчание, тишину или покой. В сочетании с לָכֶם выражение призывает адресатов не прекращать настойчивого обращения.
theological_decisions:
- issue: Кто такие «стражи» и тождественны ли они тем, кто побуждает Яхве вспомнить
  choice: Сохранить образы и переход к прямому обращению, не определяя личность стражей и не утверждая прямо, что обе группы полностью совпадают.
  alternative: Уточнить, что это ангельские хранители, пророки, священники либо молящиеся ходатаи.
  rationale: Еврейский текст не даёт однозначного определения. Конкретизация устранила бы намеренную образность и привнесла бы богословское толкование в основной текст.
- issue: Содержание того, о чём Яхве должен вспомнить
  choice: Не добавлять подразумеваемый объект воспоминания.
  alternative: «Напоминающие Яхве о Его обещаниях» или «напоминающие Яхве об Иерусалиме».
  rationale: В контексте возможны Божьи обещания и судьба Иерусалима, однако непосредственно в стихе объект не назван; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Сохранены прямое обращение к Иерусалиму, метафора стражей и смелый образ напоминания Богу. Восклицательный знак передаёт силу запрета אַל, не превращая строку в разговорную.
