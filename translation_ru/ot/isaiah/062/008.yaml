source:
  edition: WLC
  text: נִשְׁבַּ֧ע יְהוָ֛ה בִּֽ/ימִינ֖/וֹ וּ/בִ/זְר֣וֹעַ עֻזּ֑/וֹ אִם אֶתֵּן֩ אֶת דְּגָנֵ֨/ךְ ע֤וֹד מַֽאֲכָל֙ לְ/אֹ֣יְבַ֔יִ/ךְ וְ/אִם יִשְׁתּ֤וּ בְנֵֽי נֵכָר֙ תִּֽירוֹשֵׁ֔/ךְ אֲשֶׁ֥ר יָגַ֖עַתְּ בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/008.yaml
  text: 'Yahweh has sworn by his right hand and by his strong arm: I will never again give your grain as food for your enemies[c][b][a], nor will foreigners drink your new wine for which you have labored.'
translation:
  language: ru
  text: 'Яхве поклялся своей правой рукой и своей мощной мышцей: «Никогда больше не отдам твоё зерно в пищу твоим врагам и чужеземцы[a] не будут пить твоё молодое вино, ради которого ты трудилась».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья чужой [земли]», то есть чужеземцы.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская клятвенная формула буквально начинается словами: «Если Я отдам твоё зерно… и если будут пить…» Здесь «если» выражает решительное отрицание: «никогда не отдам» и «не будут пить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и естественная для русского библейского текста передача Тетраграмматона; она сохраняет благоговейный регистр, не вводя спорную русскую транслитерацию реконструируемого произношения.
- source_word: נִשְׁבַּע
  choice: поклялся
  rationale: Перфект нифаля обозначает совершённое принесение клятвы; русское «поклялся» естественно и передаёт торжественную силу высказывания.
- source_word: בִּימִינוֹ וּבִזְרֹעַ עֻזּוֹ
  choice: Своей правой рукой и Своей могучей рукой
  rationale: Сохраняется параллелизм исходного текста; «могучей» естественно передаёт עֹז и подчёркивает силу.
- source_word: אִם אֶתֵּן ... וְאִם יִשְׁתּוּ
  choice: Не отдам ... и не будут ... пить
  rationale: После глагола клятвы אִם образует эллиптическую клятвенную формулу с сильным отрицательным смыслом; буквальное «если» в русском могло бы исказить значение.
- source_word: דְּגָנֵךְ
  choice: твоё зерно
  rationale: Современное и точное обозначение зернового урожая.
- source_word: בְנֵי נֵכָר
  choice: чужеземцы
  rationale: Естественно передаёт идиоматическое «сыновья чужой [земли]», то есть людей из чужих народов.
- source_word: תִּירוֹשֵׁךְ
  choice: твоё молодое вино
  rationale: תִּירוֹשׁ обозначает свежее, новое вино; «молодое вино» сохраняет отличие от общего обозначения вина и звучит естественно по-русски.
- source_word: אֲשֶׁר יָגַעַתְּ בּוֹ
  choice: над которым ты трудилась
  rationale: Женский род глагола сохраняет обращение к Сиону; конструкция передаёт вложенный тяжёлый труд без излишнего уточнения процесса.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» является укоренённой русской передачей Тетраграмматона и не требует выбирать конкретную реконструкцию древнего произношения; при этом речь остаётся явно о Боге Израиля.
- issue: Отрицательный смысл клятвенной формулы с אִם
  choice: 'Передать явным отрицанием: «Не отдам... и не будут... пить»'
  alternative: 'Буквально: «Если Я отдам... и если будут пить...»'
  rationale: В еврейской клятвенной формуле условие эллиптически выражает решительное отрицание. Явное отрицание передаёт смысл, тогда как буквальная форма без дополнения была бы непонятна или двусмысленна по-русски.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Женские формы «твоё»/«трудилась» в контексте относятся к олицетворённому Сиону. Повтор «рукой» сохранён ради исходного параллелизма; кавычки обозначают прямую речь Бога.
