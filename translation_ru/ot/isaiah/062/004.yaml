  text: לֹֽא יֵאָמֵר֩ לָ֨/ךְ ע֜וֹד עֲזוּבָ֗ה וּ/לְ/אַרְצֵ/ךְ֙ לֹא יֵאָמֵ֥ר עוֹד֙ שְׁמָמָ֔ה כִּ֣י לָ֗/ךְ יִקָּרֵא֙ חֶפְצִי בָ֔הּ וּ/לְ/אַרְצֵ֖/ךְ בְּעוּלָ֑ה כִּֽי חָפֵ֤ץ יְהוָה֙ בָּ֔/ךְ וְ/אַרְצֵ֖/ךְ תִּבָּעֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/004.yaml
  text: No longer will you be called Forsaken[a], and your land will no longer be called Desolate; but you will be called My Delight Is in Her, and your land Married; for Yahweh delights in you[b], and your land will be married.
translation:
  language: ru
  text: Тебя больше не назовут «Оставленной», и твою землю больше не назовут «Опустошённой»; но тебя назовут «Моя отрада — в ней»[a], а твою землю — «Замужней»[b], потому что Яхве находит в тебе отраду, и земля твоя будет замужем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское имя Хефциба означает «Моя отрада — в ней».
    reason: lexical_alternative
  - marker: b
    text: Еврейское имя Беула означает «Замужняя».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזוּבָה
  choice: Оставленная
  rationale: Форма передаёт состояние той, кого оставили, и в контексте служит прежним именем олицетворённого Сиона.
- source_word: שְׁמָמָה
  choice: Опустошённая
  rationale: Сохраняет значение разорения и параллелизм с именованием олицетворённой земли.
- source_word: חֶפְצִי בָהּ
  choice: Моя отрада — в ней
  rationale: Переводит семантически прозрачное имя и сохраняет его связь с последующим глаголом חָפֵץ.
- source_word: בְּעוּלָה
  choice: Замужняя
  rationale: Передаёт брачный статус как новое имя земли; необычность формулировки отражает намеренную метафору оригинала.
- source_word: חָפֵץ
  choice: радуется о
  rationale: Естественно выражает благоволение и сохраняет смысловую перекличку с существительным חֶפְצִי — «моя отрада».
- source_word: יְהוָה
  choice: Яхве
  rationale: Прямо передаёт личное Божье имя, представленное тетраграмматоном.
- source_word: תִּבָּעֵל
  choice: будет замужем
  rationale: Сохраняет пассивную брачную метафору и связь с предшествующим именем בְּעוּלָה, не заменяя её общим образом восстановления.
- source_word: לָךְ / אַרְצֵךְ
  choice: тебя / твоя земля
  rationale: Сохраняет различие между олицетворённым Сионом и принадлежащей ему землёй.
theological_decisions:
- issue: Перевод новых имён или их транслитерация
  choice: 'Смысловые имена переведены в основном тексте: «Оставленная», «Опустошённая», «Моя отрада — в ней», «Замужняя»'
  alternative: Транслитерировать Хефциба и Беула
  rationale: В еврейском эти наименования прозрачны по смыслу и образуют риторическое переименование; перевод позволяет русскому читателю увидеть противопоставление и объяснение имён.
- issue: Брачная метафора земли
  choice: 'Сохранить прямой брачный образ: «Замужняя» и «будет замужем»'
  alternative: Сгладить до «будет населена», «обретёт хозяина» или общего утверждения о восстановлении
  rationale: Оригинал намеренно повторяет лексику корня בעל. Прямой перевод сохраняет образ и его богословское напряжение, не сводя его к отвлечённому восстановлению.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Кавычки и прописные буквы показывают, что определения выступают как имена. Синтаксический параллелизм оригинала сохранён; непривычное выражение «земля будет замужем» оставлено ради явной брачной метафоры.
