  text: עִבְר֤וּ עִבְרוּ֙ בַּ/שְּׁעָרִ֔ים פַּנּ֖וּ דֶּ֣רֶךְ הָ/עָ֑ם סֹ֣לּוּ סֹ֤לּוּ הַֽ/מְסִלָּה֙ סַקְּל֣וּ מֵ/אֶ֔בֶן הָרִ֥ימוּ נֵ֖ס עַל הָ/עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/010.yaml
  text: Pass through[a], pass through the gates; clear the way for the people. Build up, build up the highway; clear it of stones[c][b]. Raise up a banner over the peoples.
translation:
  language: ru
  text: Проходите, проходите через ворота; расчистите путь для народа. Устройте, устройте большую дорогу[a], уберите с неё камни. Поднимите знамя над народами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Насыпьте, насыпьте дорогу» или «Проложите, проложите дорогу». Еврейский глагол обозначает сооружение, вероятно насыпание, дороги.'
    reason: lexical_alternative
  - marker: b
    text: «Знамя» может также означать поднятый сигнальный знак; выражение можно понимать как знак, видимый народам или предназначенный для них.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ עִבְרוּ
  choice: Проходите, проходите
  rationale: Повтор повелительной формы сохранён; глагол передаёт движение через ворота без добавления не выраженного в тексте направления.
- source_word: בַּשְּׁעָרִים
  choice: через ворота
  rationale: Предлог вместе с глаголом естественно обозначает прохождение через ворота; слово «городские» не добавлено, поскольку его нет в еврейском тексте.
- source_word: פַּנּוּ דֶּרֶךְ
  choice: расчистите путь
  rationale: Порода piel глагола פנה здесь означает освободить или подготовить путь; «расчистите» поддерживает образ дорожных работ.
- source_word: הָעָם
  choice: для народа
  rationale: Единственное собирательное עם передано словом «народ» и не смешано с последующим множественным עמים.
- source_word: סֹלּוּ סֹלּוּ הַמְסִלָּה
  choice: Насыпайте, насыпайте большую дорогу
  rationale: סלל в дорожном контексте обозначает сооружение дороги посредством насыпи, а מסלה — устроенную, приподнятую дорогу. Повтор императива сохранён.
- source_word: סַקְּלוּ מֵאֶבֶן
  choice: уберите с неё камни
  rationale: Редкая конструкция означает очистить дорогу от камней; местоимение «с неё» естественно отсылает к дороге и делает русскую фразу ясной.
- source_word: הָרִימוּ נֵס
  choice: Поднимите знамя
  rationale: נס обозначает поднятый на видном месте стяг или сигнальный знак; «знамя» сохраняет наглядный и собирательный характер образа.
- source_word: עַל הָעַמִּים
  choice: над народами
  rationale: Сохранено прямое пространственное значение על и множественное число עמים, отличающее народы от «народа» в первой части стиха.
theological_decisions:
- issue: Соотношение «народа» и «народов»
  choice: Единственное «народ» и множественное «народы» сохранены как разные обозначения
  alternative: Понимать оба выражения как относящиеся к Израилю либо оба — ко всем народам
  rationale: Еврейский текст намеренно переходит от собирательного единственного עם к множественному עמים. Перевод не отождествляет их и не уточняет сверх текста, хотя в контексте первый термин естественно относится к народу Сиона, а второй — к народам мира.
- issue: Функция поднятого знамени
  choice: знамя над народами
  alternative: знамя для народов / сигнальный знак народам
  rationale: Предлог על буквально допускает пространственный образ «над», тогда как назначение знамени как сигнала можно вывести из контекста. Основной текст сохраняет образ, не превращая подразумеваемую функцию в явное толкование.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Императивные повторы оригинала сохранены. «Большая дорога» выбрана как понятное обозначение специально устроенного пути; конкретный образ насыпи дополнительно отражён глаголом «насыпайте».
