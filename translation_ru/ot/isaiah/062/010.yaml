  verdict: revise
  source_fidelity: 'Проходите, проходите через ворота; расчистите путь для народа; уберите с неё камни; поднимите знамя над народами — точно передают повелительные формы, повторы, различие בין «народом» (עם) и «народами» (עמים), а также пространственный образ על. Однако «насыпайте, насыпайте большую дорогу» в современном русском звучит не вполне естественно: глагол обычно требует указания материала либо может быть понят как покрытие уже существующей дороги. Более нейтральное «устройте» передаёт сооружение/подготовку дороги, подразумеваемое סלל, без этой синтаксической неясности.'
  naturalness: После замены дорожной формулы текст сохраняет торжественный ритм и становится более естественным для современного литературного русского. «Большая дорога» понятна и соответствует значению מסלה как специально устроенного пути.
  terminology: «Народ» и «народы» последовательно сохраняют значимое различие единственного и множественного числа. «Знамя» — уместная передача נס; примечание об альтернативном значении сигнального знака сохраняет лексическую широту. «Большая дорога» приемлема для מסלה и не навязывает современную транспортную коннотацию слова «шоссе».
