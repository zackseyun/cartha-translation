  text: וְ/רָא֤וּ גוֹיִם֙ צִדְקֵ֔/ךְ וְ/כָל מְלָכִ֖ים כְּבוֹדֵ֑/ךְ וְ/קֹ֤רָא לָ/ךְ֙ שֵׁ֣ם חָדָ֔שׁ אֲשֶׁ֛ר פִּ֥י יְהוָ֖ה יִקֳּבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/002.yaml
  text: Nations will see your righteousness[a], and all kings your glory[b]; and you will be called by a new name that the mouth of Yahweh will designate.
translation:
  language: ru
  text: 'Народы увидят твою праведность[a],

    и все цари — твою славу;

    тебе дадут новое имя,

    которое определят уста Яхве[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоё оправдание»; или: «твою справедливость».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте глагол имеет дополнение «его», относящееся к новому имени.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: увидят
  rationale: Перфект с союзом в пророческой речи передаёт предстоящее событие; русское будущее время ясно выражает этот смысл.
- source_word: גוֹיִם
  choice: народы
  rationale: Слово обозначает народы мира в целом; перевод не вводит более узкое противопоставление евреям.
- source_word: צִדְקֵךְ
  choice: твою праведность
  rationale: Сохраняет широкое значение צדק, включающее праведность, справедливость и публичное оправдание Сиона; возможные контекстуальные оттенки отмечены в сноске.
- source_word: וְכָל מְלָכִים
  choice: и все цари
  rationale: Прямой и естественный перевод собирательно-дистрибутивного выражения, сохраняющий параллелизм с «народами».
- source_word: כְּבוֹדֵךְ
  choice: твою славу
  rationale: «Слава» сохраняет характерную для Исаии богословскую и поэтическую ёмкость כבוד, включая явленное величие и честь.
- source_word: וְקֹרָא לָךְ
  choice: тебя назовут
  rationale: Формально глагол стоит в 3-м лице единственного числа, однако неопределённо-личная русская конструкция естественно передаёт действие наречения, не назначая явно не названного деятеля.
- source_word: שֵׁם חָדָשׁ
  choice: новым именем
  rationale: Передаёт дарование новой идентичности и нового положения, а не просто замену словесного обозначения.
- source_word: אֲשֶׁר פִּי יְהוָה
  choice: которое нарекут уста Яхве
  rationale: Сохранён антропоморфный образ «уст Яхве», подчёркивающий, что новое имя исходит из Божьего речения.
- source_word: יִקֳּבֶנּוּ
  choice: нарекут
  rationale: В данном контексте נקב означает назвать или точно обозначить. «Нарекут» естественно сочетается с новым именем и сохраняет торжественный характер строки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, представленное тетраграмматоном, без замены титулом.
theological_decisions:
- issue: Значение צִדְקֵךְ в описании восстановления Сиона
  choice: твою праведность
  alternative: твоё оправдание; твою справедливость
  rationale: «Праведность» сохраняет богословскую широту еврейского слова и не сводит его ни исключительно к судебному оправданию, ни исключительно к общественной справедливости. Контекст публичного восстановления остаётся доступен через сноску.
- issue: Кто даёт Сиону новое имя
  choice: тебя назовут новым именем, которое нарекут уста Яхве
  alternative: Он назовёт тебя новым именем, которое определят уста Яхве
  rationale: Неопределённо-личная первая конструкция не устанавливает личность грамматически подразумеваемого субъекта, а относительное предложение сохраняет прямое утверждение, что само имя определяется речением Яхве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим ритмом. Параллелизм оригинала сохранён делением на строки; тире во второй строке естественно восполняет пропущенный глагол. Форма «уста» удерживает библейский антропоморфный образ, не делая весь перевод архаичным.
