  yaml_path: translation/ot/isaiah/062/012.yaml
  text: And they will call them[a], “The holy people, the redeemed of Yahweh”; and you will be called, “Sought Out[c][b], a city not forsaken.”
translation:
  language: ru
  text: 'И назовут их: «Святой народ, искупленные Яхве»; а тебя назовут: «Искомая[a], город, которого не покинут[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Та, которую ищут»; возможно также: «Та, о которой спрашивают».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «город, который не оставлен»; «город не покинутый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ לָהֶם
  choice: И назовут их
  rationale: Неопределённое множественное подлежащее сохранено, а конструкция קרא ל передана естественной для русского формулой наречения; в пророческом контексте перфект с ו имеет будущее значение.
- source_word: עַם הַקֹּדֶשׁ
  choice: Святой народ
  rationale: עַם означает здесь «народ», а определённость еврейского словосочетания уместно выражена титульной формой в прямой речи.
- source_word: גְּאוּלֵי יְהוָה
  choice: искупленные Яхве
  rationale: Субстантивированная пассивная форма передана словом «искупленные»; конструкция допускает оттенки принадлежности Яхве и совершённого Им искупления, поэтому двусмысленность не снята добавлением предлога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: וְלָךְ יִקָּרֵא
  choice: а тебя назовут
  rationale: Женский род обращения относится к олицетворённому Сиону/Иерусалиму; пассивная еврейская формула естественно передана русской неопределённо-личной конструкцией.
- source_word: דְרוּשָׁה
  choice: Разысканная
  rationale: Причастная форма от דרשׁ выражает результат целенаправленного поиска; «Разысканная» сохраняет форму почётного нового имени и не сводит значение лишь к популярности или желанности.
- source_word: עִיר לֹא נֶעֱזָבָה
  choice: город не оставленный
  rationale: Аппозиция сохранена без добавления отсутствующих в оригинале слов; «оставленный» поддерживает смысловой контраст с прежней оставленностью Сиона.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблён тетраграмматон, поэтому личное имя передано прямо, без замены титулом.
- issue: Отношение גְּאוּלֵי к имени Яхве
  choice: искупленные Яхве
  alternative: искупленные Яхве люди / те, кого искупил Яхве
  rationale: 'Краткая родительная конструкция сохраняет возможные оттенки: это принадлежащие Яхве искупленные и те, кого Он искупил; развёрнутый вариант сделал бы одно отношение исключительным.'
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной пророческой интонацией. Параллель двух формул наречения сохранена; заглавная буква у «Разысканная» обозначает новое почётное имя города.
