  text: וְ/אַֽל תִּתְּנ֥וּ דֳמִ֖י ל֑/וֹ עַד יְכוֹנֵ֞ן וְ/עַד יָשִׂ֧ים אֶת יְרֽוּשָׁלִַ֛ם תְּהִלָּ֖ה בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/007.yaml
  text: and give him no rest until he establishes and until he makes Jerusalem a praise in the earth[a][b].
translation:
  language: ru
  text: и не давайте Ему покоя, пока Он не утвердит Иерусалим и пока не сделает Иерусалим предметом хвалы на земле[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не давайте Ему тишины». Еврейское слово может означать «молчание», «тишину» или «покой»; этот оборот рисует неотступное обращение к Господу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в стране». Еврейское אֶרֶץ может означать как всю землю, так и отдельную страну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּתְּנוּ
  choice: и не давайте
  rationale: Союз с отрицательной частицей продолжает призыв предыдущего стиха; форма множественного числа передана повелительной конструкцией «не давайте».
- source_word: דֳמִי לוֹ
  choice: Ему покоя
  rationale: דֳמִי может означать «молчание, тишина, покой»; в сочетании с נתן естественный русский оборот «не давать покоя» выражает неотступное обращение к Господу, не устраняя буквальную образность полностью.
- source_word: עַד יְכוֹנֵן
  choice: пока Он не утвердит
  rationale: עַד с формой глагола обозначает предел продолжающегося действия; כון здесь означает прочно установить, утвердить.
- source_word: וְעַד יָשִׂים
  choice: и не сделает
  rationale: Повтор עַד сохранён в составе однородной конструкции «пока… не… и не…»; שׂים с именной частью сказуемого естественно передаётся как «сделает».
- source_word: אֶת יְרוּשָׁלִַם תְּהִלָּה
  choice: Иерусалим… славой
  rationale: תְּהִלָּה обозначает хвалу, прославление или предмет хвалы; «славой» сохраняет предикативную метафору и звучит естественно по-русски.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: אֶרֶץ допускает значения «земля» в широком смысле и «страна»; основной текст сохраняет вероятный широкий, международный охват пророчества.
theological_decisions:
- issue: К кому относится местоимение לוֹ
  choice: К Господу; поэтому употреблено почтительное «Ему»
  alternative: Неуточнённый небесный или божественный адресат
  rationale: В Ис 62:6 непосредственно упомянуты напоминающие Господу; обращение к ним продолжается в стихе 7, поэтому мужское местоимение естественно относится к Господу.
- issue: Смысл превращения Иерусалима в תְּהִלָּה
  choice: Иерусалим становится «славой», то есть прославленным и вызывающим хвалу
  alternative: Иерусалим становится «предметом хвалы» или обретает «известность»
  rationale: Предикативная метафора исходного текста сохранена без уточнения того, является ли город источником, содержанием или предметом хвалы.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но общедоступным библейским звучанием. «Не давайте Ему покоя» — естественный русский идиом, соответствующий контексту непрестанной молитвы. Повтор еврейского עַד передан одной рамочной конструкцией «пока… не… и не…», чтобы избежать тяжеловесности без потери двойной цели.
