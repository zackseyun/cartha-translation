base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/011.yaml
  text: 'Behold[a], Yahweh has proclaimed to the end of the earth: Say to Daughter Zion, “Behold, your salvation comes; behold, his reward is with him, and his recompense before him.”'
translation:
  language: ru
  text: 'Вот, Яхве возвестил до края земли: «Скажите дочери Сиона: „Вот, спасение твоё приходит;[a] вот, награда его с ним, и воздаяние его — перед ним“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Спаситель твой приходит». В еврейском тексте буквально: «спасение твоё», однако далее стоят местоименные суффиксы мужского рода: «награда его… воздаяние его». Возможно, спасение здесь олицетворено в приходящем избавителе.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: הִשְׁמִיעַ
  choice: возвестил
  rationale: Каузативная форма означает «сделал слышимым, объявил»; «возвестил» естественно передаёт публичный и торжественный характер речи.
- source_word: אֶל קְצֵה הָאָרֶץ
  choice: до края земли
  rationale: Сохраняет единственное число и пространственную направленность еврейского выражения.
- source_word: לְבַת צִיּוֹן
  choice: дочери Сиона
  rationale: Сохраняет поэтическую персонификацию Сиона и естественно звучит по-русски.
- source_word: יִשְׁעֵךְ
  choice: спасение твоё
  rationale: Буквально передаёт существительное с суффиксом второго лица женского рода и не устраняет возможную персонификацию спасения.
- source_word: בָּא
  choice: приходит
  rationale: В пророческом провозглашении форма выражает живо представленное настоящее или близкое будущее.
- source_word: שְׂכָרוֹ
  choice: награда его
  rationale: Передаёт значение награды или платы и сохраняет мужской суффикс оригинала.
- source_word: וּפְעֻלָּתוֹ
  choice: и воздаяние его
  rationale: В данном параллелизме обозначает причитающуюся отдачу или плату; «воздаяние» сохраняет отличие от «награды».
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Формально и ясно передаёт пространственный образ, параллельный выражению «с ним».
- source_word: הִנֵּה
  choice: вот
  rationale: Естественный современный русский указатель, сохраняющий трёхкратное эмфатическое привлечение внимания.
theological_decisions:
- issue: Следует ли передавать יִשְׁעֵךְ безлично («спасение твоё») или лично («Спаситель твой») ввиду последующих мужских местоименных суффиксов?
  choice: спасение твоё
  alternative: Спаситель твой
  rationale: Еврейская форма буквально означает «твоё спасение». Последующие мужские суффиксы допускают персонификацию спасения в приходящем избавителе, однако основной текст не должен устранять эту содержательную напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Инверсия «спасение твоё» и «награда его» сохраняет поэтический акцент и связь местоимений с оригиналом; архаизм «се» не используется.
