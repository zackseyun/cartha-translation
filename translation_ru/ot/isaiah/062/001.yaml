  text: לְמַ֤עַן צִיּוֹן֙ לֹ֣א אֶחֱשֶׁ֔ה וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם לֹ֣א אֶשְׁק֑וֹט עַד יֵצֵ֤א כַ/נֹּ֨גַהּ֙ צִדְקָ֔/הּ וִ/ישׁוּעָתָ֖/הּ כְּ/לַפִּ֥יד יִבְעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/001.yaml
  text: For Zion’s sake I will not keep silent[a], and for Jerusalem’s sake I will not be quiet[c][b], until her righteousness goes out like brightness and her salvation burns like a torch.
translation:
  language: ru
  text: Ради Сиона я не умолкну[a], ради Иерусалима не успокоюсь[b], пока её праведность[c] не засияет, словно свет, и её спасение не запылает, словно факел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте говорящий прямо не назван; им могут считать пророка, Господа или иной голос, выступающий от чьего-либо имени.
    reason: alternative_reading
  - marker: b
    text: 'Или: «не буду знать покоя». Еврейский глагол может означать пребывание в покое, тишине или бездействии.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «её оправдание». Еврейское слово может обозначать как праведность, так и явное восстановление справедливости, то есть публичное оправдание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ради
  rationale: Естественно передаёт значение мотивации «ради, ради блага» и сохраняет параллелизм «ради Сиона… ради Иерусалима».
- source_word: אֶחֱשֶׁה
  choice: я не умолкну
  rationale: Точно и естественно передаёт значение «не буду молчать» и подчёркивает продолжительность решимости говорящего.
- source_word: אֶשְׁקֹט
  choice: не успокоюсь
  rationale: Сохраняет более широкий смысл «не быть спокойным, не знать покоя», не сливая этот глагол полностью с предшествующим «не умолкну».
- source_word: יֵצֵא כַנֹּגַהּ
  choice: засияет, словно свет
  rationale: Буквально образ означает выход или явление яркого сияния; по-русски «засияет, словно свет» естественно выражает появление праведности во всеобщей видимости, не сужая נֹגַהּ до «зари».
- source_word: צִדְקָהּ
  choice: его праведность
  rationale: Сохраняет основное нравственно-заветное значение צדקה; возможный контекстуальный оттенок публичного оправдания отмечен в сноске.
- source_word: וִישׁוּעָתָהּ
  choice: его спасение
  rationale: Передаёт широкий смысл избавления и восстановления, присущий ישועה.
- source_word: כְלַפִּיד יִבְעָר
  choice: не запылает, словно факел
  rationale: Сохраняет конкретный образ горящего факела и естественно передаёт интенсивность глагола בער.
theological_decisions:
- issue: Кто говорит от первого лица
  choice: Говорящий не назван, как и в еврейском тексте.
  alternative: Говорящим можно считать пророка, Господа либо иной представляющий Иерусалим голос.
  rationale: Сам стих не устанавливает личность говорящего, поэтому перевод не разрешает эту богословско-экзегетическую неоднозначность добавлением субъекта.
- issue: Значение צִדְקָהּ
  choice: праведность
  alternative: оправдание, восстановление справедливости
  rationale: «Праведность» сохраняет нравственный и заветный диапазон слова, тогда как контекст публичного явления допускает, но не требует, смысл оправдания перед народами.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Местоимение «его» согласовано с русскими названиями «Сион» и «Иерусалим», хотя соответствующие еврейские суффиксы женского рода представляют город как женщину. Повтор «ради» и параллельные отрицательные формы сохраняют структуру оригинала.
