  terminology: «Дочь Сиона» корректно сохраняет библейское поэтическое олицетворение. «Правитель страны» уместно передаёт מֹשֵׁל אֶרֶץ в данном региональном контексте, не навязывая идентификацию правителя. Примечания корректно раскрывают альтернативу «скала/утёс» и вероятную функцию ягнёнка как дани.
