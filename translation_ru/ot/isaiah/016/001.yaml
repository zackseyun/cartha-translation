  source_fidelity: 'Перевод точно передаёт повелительное обращение во множественном числе, конкретный предмет посылки («ягнёнка»), получателя («правителю страны») и направление к горе дочери Сиона. «Из Селы, через пустыню» является допустимой контекстуальной передачей трудного מִדְבָּרָה: она выражает маршрут движения и не устраняет топонимическую неопределённость Селы.'
