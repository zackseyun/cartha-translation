id: ISA.16.1
reference: Isaiah 16:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁלְחוּ כַ֥ר מֹשֵֽׁל אֶ֖רֶץ מִ/סֶּ֣לַע מִדְבָּ֑רָ/ה אֶל הַ֖ר בַּת צִיּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/001.yaml
  text: Send a lamb to the ruler of the land[b][a], from Sela in the wilderness to the mountain of daughter Zion.
translation:
  language: ru
  text: Пошлите ягнёнка правителю страны[b] — из Селы[a], через пустыню, на гору дочери Сиона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из скалы» либо «из утёса»; еврейское слово סלע может быть нарицательным, хотя здесь, вероятно, имеется в виду место Села.'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, ягнёнка посылают правителю в качестве дани.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ
  choice: Пошлите
  rationale: Форма повелительного наклонения, мужской род, множественное число; «пошлите» естественно передаёт прямое обращение к группе людей.
- source_word: כַר
  choice: ягнёнка
  rationale: Сохранено конкретное значение существительного; вероятный смысл дани не внесён непосредственно в основной текст.
- source_word: מֹשֵׁל אֶרֶץ
  choice: правителю страны
  rationale: מֹשֵׁל означает правящего, а אֶרֶץ в региональном контексте естественнее понимать как «страна», а не как вся земля или мир.
- source_word: מִסֶּלַע
  choice: из Селы
  rationale: סלע допускает нарицательное значение «скала, утёс», но здесь, вероятнее всего, является топонимом Села; альтернативное прочтение вынесено в примечание.
- source_word: מִדְבָּרָה
  choice: через пустыню
  rationale: Форма с направительным окончанием описывает движение, однако синтаксис труден. В контексте «через пустыню» естественно обозначает маршрут, не превращая Селу прямо в населённый пункт, расположенный в пустыне.
- source_word: אֶל הַר בַּת צִיּוֹן
  choice: на гору дочери Сиона
  rationale: Сохранены образ горы и поэтическое олицетворение «дочь Сиона», а направление к возвышенности по-русски естественно передано предлогом «на».
theological_decisions:
- issue: Следует ли прямо назвать ягнёнка данью
  choice: 'Сохранить конкретный образ: «Пошлите ягнёнка».'
  alternative: «Пошлите ягнёнка в дань» или «Пошлите дань ягнятами».
  rationale: Политический контекст позволяет видеть здесь дань, но само еврейское существительное обозначает животное. Основной текст сохраняет образ, а вероятная функция разъясняется в примечании.
- issue: К кому относится выражение «правитель страны»
  choice: 'Передать его как получателя: «правителю страны».'
  alternative: Понимать כַר־מֹשֵׁל как сочетание со значением «ягнёнок правителя».
  rationale: Традиционное и контекстуально связное прочтение понимает правителя как адресата посылаемой дани, но не уточняет его личность и не вводит дополнительного богословского отождествления.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического образа «дочь Сиона». Тире помогает связать длинное указание маршрута с повелением. Формулировка остаётся торжественной, но понятной; неоднозначность топонима Села и подразумеваемый характер дани раскрыты в примечаниях.
