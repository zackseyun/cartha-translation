base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/006.yaml
  text: We have heard of the pride of Moab—how very proud he is—of his arrogance[a], his pride, and his fury; his boasts are not so.
translation:
  language: ru
  text: Мы слышали о гордости Моава — он чрезвычайно горд, — о его высокомерии, гордыне и ярости; но его похвальба[a] пуста.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его пустые речи неосновательны»; возможно также: «его ложь неосновательна». Еврейское слово может означать хвастливые заявления, пустые речи или ложь; краткое заключительное отрицание указывает на их несостоятельность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: Мы слышали
  rationale: Перфект Qal, 1-е лицо множественного числа; по-русски естественно передаёт знание, полученное из дошедших сведений и сохраняющее актуальность.
- source_word: גְאוֹן מוֹאָב
  choice: о гордости Моава
  rationale: В контексте суда גְאוֹן обозначает надменную гордость, а не нейтральное величие.
- source_word: גֵּא מְאֹד
  choice: он чрезвычайно горд
  rationale: Сохраняет усиление מְאֹד и риторическое повторение корня, оставаясь естественным для современного русского языка.
- source_word: גַּאֲוָתוֹ וּגְאוֹנוֹ
  choice: о его высокомерии, гордыне
  rationale: Два близких по смыслу существительных переданы разными словами, чтобы сохранить накопление характеристик и не устранить их риторическое различие.
- source_word: וְעֶבְרָתוֹ
  choice: и ярости
  rationale: עֶבְרָה здесь обозначает сильный, переполняющий гнев; «ярость» естественно передаёт силу обвинения.
- source_word: לֹא כֵן בַּדָּיו
  choice: но его похвальба пуста
  rationale: בַּדָּיו может означать хвастливые заявления, пустые речи или ложь. В контексте гордости «похвальба» удерживает основную связь, а «пуста» естественно выражает отрицание их состоятельности.
