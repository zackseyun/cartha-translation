base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/005.yaml
  text: A throne will be established in steadfast love[a], and one will sit on it in faithfulness in the tent of David[c][b], judging and seeking justice and swift to do righteousness.
translation:
  language: ru
  text: И престол будет утверждён милостью[a], и на нём будет восседать в верности[b], в шатре Давида, судья, ищущий правосудия и скорый творить правду[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское хесед может означать милость, неизменную любовь или верность обязательствам.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в истине». В еврейском тексте подлежащее не названо; буквально: «и будет восседать на нём».'
    reason: alternative_reading
  - marker: c
    text: 'Еврейское выражение сжато; буквально: «скорый в праведности». Возможны также переводы: «скорый вершить правду» или «быстрый в совершении справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַן
  choice: и утвердится
  rationale: 'Гофаль глагола כון передаёт пассивно-результативное значение: престол будет прочно установлен. Русское «утвердится» сохраняет поэтическую краткость и естественно звучит в пророческом контексте.'
- source_word: בַּחֶסֶד
  choice: милостью
  rationale: 'חֶסֶד охватывает милость, неизменную любовь и верность обязательствам. Творительный падеж естественно передаёт возможное инструментальное значение предлога ב: престол утверждается милостью.'
- source_word: כִּסֵּא
  choice: престол
  rationale: Неопределённость существительного без артикля в русском не требует отдельного показателя; «престол» сохраняет царский образ.
- source_word: וְיָשַׁב עָלָיו
  choice: и на нём будет восседать
  rationale: В еврейском глагол стоит в 3-м лице мужского рода, но явно названного подлежащего нет. Русская конструкция допускает такое опущение и не вынуждает вводить «он» или «некто».
- source_word: בֶּאֱמֶת
  choice: в верности
  rationale: אֱמֶת может означать истину, надёжность или верность. В контексте царского правления «в верности» подчёркивает надёжный и честный характер власти, не исключая оттенка истины.
- source_word: בְּאֹהֶל דָּוִד
  choice: в шатре Давида
  rationale: Сохранён буквальный образ אֹהֶל — «шатёр», который может указывать на династию Давида, но не сводится в переводе к слову «дом».
- source_word: שֹׁפֵט
  choice: судья
  rationale: Причастие характеризует восседающего как совершающего суд. Именное «судья» в русском ясно связывает последующие определения с подразумеваемым правителем.
- source_word: וְדֹרֵשׁ מִשְׁפָּט
  choice: ищущий правосудия
  rationale: דרשׁ выражает деятельное искание или стремление, а מִשְׁפָּט здесь обозначает справедливый суд и правосудие.
- source_word: וּמְהִר צֶדֶק
  choice: и скорый в праведности
  rationale: Сжатая конструкция дословно связывает быстроту с צֶדֶק. «Скорый в праведности» сохраняет поэтическую напряжённость и не добавляет отсутствующего в тексте глагола «делать».
theological_decisions:
- issue: Мессианский или историко-династический референт
  choice: Сохранено описание неназванного правителя на престоле Давида без прямого отождествления с Мессией.
  alternative: Явно назвать восседающего Мессией либо конкретным историческим царём.
  rationale: Еврейский текст рисует идеального правителя Давидовой линии, но не называет его. Перевод оставляет открытыми историческое и мессианское прочтения.
- issue: Характер утверждения престола
  choice: «милостью»
  alternative: «неизменной любовью» или «заветной верностью»
  rationale: חֶסֶד имеет богословски ёмкое значение, однако само по себе не требует явного добавления слова «завет». Сноска сохраняет его широкий смысл.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Сохранены образ «шатра Давида», неопределённость подлежащего и сжатость заключительной фразы; архаизмы сведены к уместному царскому «восседать».
