  text: וְ/נֶאֱסַ֨ף שִׂמְחָ֤ה וָ/גִיל֙ מִן הַ/כַּרְמֶ֔ל וּ/בַ/כְּרָמִ֥ים לֹֽא יְרֻנָּ֖ן לֹ֣א יְרֹעָ֑ע יַ֗יִן בַּ/יְקָבִ֛ים לֹֽא יִדְרֹ֥ךְ הַ/דֹּרֵ֖ךְ הֵידָ֥ד הִשְׁבַּֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/010.yaml
  text: Joy and gladness are taken away from the fruitful field[a], and in the vineyards no one sings for joy, no one shouts; no treader treads out wine in the presses[b]; I have put an end to the vintage shout.
translation:
  language: ru
  text: Исчезли радость и ликование с плодородной земли[a]; в виноградниках больше не поют от радости, не восклицают. Никто не вытаптывает виноград в давильнях; крику во время сбора винограда[b] Я положил конец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с Кармила», если כַּרְמֶל понимать как название местности, а не как «плодородную землю».'
    reason: alternative_reading
  - marker: b
    text: 'Евр. «хейдад» — громкий возглас, сопровождавший сбор или вытаптывание винограда; возможно также: «крик во время сбора урожая».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱסַף
  choice: исчезли
  rationale: Нифаль глагола אסף здесь идиоматически означает удаление или прекращение; форма множественного числа в русском согласована с парным подлежащим «радость и ликование».
- source_word: שִׂמְחָה וָגִיל
  choice: радость и ликование
  rationale: Передаёт поэтическую пару близких по значению слов, сохраняя различие между обычной радостью и её торжественным проявлением.
- source_word: כַּרְמֶל
  choice: плодородная земля
  rationale: В сельскохозяйственном контексте и параллели с виноградниками предпочтительно нарицательное значение «плодородная земля», а не топоним Кармил.
- source_word: יְרֻנָּן לֹא יְרֹעָע
  choice: не поют от радости, не восклицают
  rationale: Сохраняется параллель двух глаголов, обозначающих праздничное пение и громкие возгласы.
- source_word: יַיִן בַּיְקָבִים לֹא יִדְרֹךְ הַדֹּרֵךְ
  choice: Никто не топчет виноград в давильнях
  rationale: Еврейское «вино» в данном выражении обозначает виноград или виноградную массу, которую топчут; естественная русская формулировка передаёт реальное действие без буквальной неясности. Сочетание личной формы с причастием выражено словом «никто».
- source_word: הֵידָד
  choice: крик давильщиков
  rationale: Слово обозначает громкий ритмический возглас, сопровождавший вытаптывание винограда; контекстуальное уточнение по-русски ясно связывает его с предыдущей строкой.
- source_word: הִשְׁבַּתִּי
  choice: Я заставил умолкнуть
  rationale: Передаёт каузативное значение породы хифиль — говорящий прекращает этот крик — и сохраняет первое лицо без добавления прямо не названного субъекта.
theological_decisions:
- issue: Кто говорит в первом лице в конце стиха
  choice: Сохранить «Я» без добавления имени Господа
  alternative: «Я, Господь, заставил умолкнуть»
  rationale: Контекст указывает на божественного говорящего, но сам стих не повторяет его имени; добавление имени устранило бы присущую тексту имплицитность.
- issue: Нарицательное значение или топоним כַּרְמֶל
  choice: «плодородная земля»
  alternative: «Кармил»
  rationale: Сельскохозяйственная параллель с виноградниками, давильнями и сбором винограда поддерживает нарицательное значение, однако топонимическая трактовка остаётся возможной и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Краткие параллельные фразы сохраняют ритм пророческой речи; сельскохозяйственные реалии переданы понятно без архаизмов.
