id: ISA.16.12
reference: Isaiah 16:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֧ה כִֽי נִרְאָ֛ה כִּֽי נִלְאָ֥ה מוֹאָ֖ב עַל הַ/בָּמָ֑ה וּ/בָ֧א אֶל מִקְדָּשׁ֛/וֹ לְ/הִתְפַּלֵּ֖ל וְ/לֹ֥א יוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/012.yaml
  text: And when it is seen that Moab is worn out on the high place[a], and he comes to his sanctuary to pray[c][b], he will not be able.
translation:
  language: ru
  text: И когда станет видно, что Моав изнемог на высоте[a], он придёт в своё святилище помолиться, но ничего не сможет сделать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Высота» — расположенное на возвышении место поклонения.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «но не сможет». Возможно также: «но не добьётся успеха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Формула вводит будущее обстоятельство; «И когда» естественно передаёт временное значение.
- source_word: נִרְאָה
  choice: станет видно
  rationale: Безличная конструкция сохраняет возможный безличный смысл нифаля и не навязывает Моав как прямое подлежащее этого глагола.
- source_word: נִלְאָה
  choice: изнемог
  rationale: Передаёт достигнутое вследствие тщетных усилий состояние усталости и истощения.
- source_word: מוֹאָב
  choice: Моав
  rationale: Традиционная русская передача названия народа и страны; далее он представлен как единое олицетворённое лицо.
- source_word: עַל הַבָּמָה
  choice: на высоте
  rationale: Сохраняет единственное число и традиционное обозначение возвышенного культового места; культурный смысл пояснён в сноске.
- source_word: וּבָא
  choice: он придёт
  rationale: Будущее время естественно в русском контексте; местоимение отражает олицетворённый Моав и мужской род названия.
- source_word: אֶל מִקְדָּשׁוֹ
  choice: в своё святилище
  rationale: «Святилище» достаточно широко для культового места Моава, а возвратное «своё» естественно передаёт суффикс третьего лица при совпадении с субъектом.
- source_word: לְהִתְפַּלֵּל
  choice: помолиться
  rationale: Точно и естественно передаёт цель прихода без добавления смысла ходатайства.
- source_word: וְלֹא יוּכָל
  choice: но ничего не сможет сделать
  rationale: יכל буквально означает способность; дополнение «ничего ... сделать» делает незавершённую по-русски формулу понятной, сохраняя общий, а не узко истолкованный смысл неудачи.
theological_decisions:
- issue: Число и референция форм при имени «Моав»
  choice: 'Моав передан как олицетворённое лицо в единственном числе: «он придёт»'
  alternative: Передать название собирательно, относя действия к моавитянам во множественном числе
  rationale: Еврейский текст сочетает имя народа с формами единственного числа; сохранение олицетворения воспроизводит его риторику без догматического уточнения.
- issue: Смысл заключительного וְלֹא יוּכָל
  choice: «но ничего не сможет сделать»
  alternative: «но не добьётся успеха» / «но молитва его не поможет»
  rationale: Перевод сохраняет прямое значение «не сможет» и подразумеваемую тщетность, не сводя намеренно незавершённую формулировку исключительно к безуспешной молитве.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным, но сохранены олицетворение Моава, единственное число культового места и открытость заключительной формулы.
