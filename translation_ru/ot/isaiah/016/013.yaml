  text: זֶ֣ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל מוֹאָ֖ב מֵ/אָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/013.yaml
  text: This is the word that Yahweh spoke concerning Moab in time past[a].
translation:
  language: ru
  text: Вот слово, которое Яхве прежде произнёс о Моаве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот весть, которую Яхве прежде произнёс о Моаве».'
    reason: Лексема דָּבָר в данном пророческом контексте может означать как «слово», так и «весть».
lexical_decisions:
- source_word: זֶה
  choice: Вот
  rationale: Указательное זֶה вводит итоговое указание на уже приведённое пророчество; русское «вот» естественно передаёт эту дейктическую силу.
- source_word: הַדָּבָר
  choice: слово
  rationale: דָּבָר может означать «слово», «дело» или «весть». Здесь «слово» сохраняет устойчивый пророческий оборот и остаётся понятным современному читателю.
- source_word: אֲשֶׁר דִּבֶּר
  choice: которое … произнёс
  rationale: Относительная конструкция передана естественным русским оборотом. «Произнёс» точно выражает действие речи и соответствует возвышенному, но современному библейскому регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֶל מוֹאָב
  choice: о Моаве
  rationale: В контексте пророчества предлог אֶל указывает на предмет речи. «О Моаве» не добавляет ни прямого обращения, ни усиленного значения враждебности.
- source_word: מֵאָז
  choice: прежде
  rationale: Наречие обозначает время, предшествующее нынешнему высказыванию. «Прежде» кратко и точно передаёт этот смысл, не уточняя, насколько давно это было.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога; его передача как «Яхве» сохраняет различие между именем и титулом.
- issue: Значение אֶל при упоминании Моава
  choice: о Моаве
  alternative: Моаву; против Моава
  rationale: Стих подводит итог пророчеству о Моаве. Нейтральное «о» сохраняет предметную направленность речи и не вносит сверх текста ни прямого адресата, ни дополнительной враждебности.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Порядок слов выбран ради естественности: наречие «прежде» поставлено перед сказуемым. Формулировка сохраняет краткость и неоднозначность еврейского текста.'
