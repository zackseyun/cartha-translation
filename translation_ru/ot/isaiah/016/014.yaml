base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/014.yaml
  text: But now Yahweh has spoken[a], saying, “Within three years, like the years of a hired worker, the glory of Moab will be brought low, with all its great multitude; and the remnant will be few, very small[c][b], not mighty.”
translation:
  language: ru
  text: 'Но теперь Яхве сказал: «В течение трёх лет, как годы наёмного работника[a], слава Моава будет унижена со всем его великим множеством; а остаток будет малочисленным, совсем малым и незначительным[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в три года, как годы наёмного работника»; образ указывает на строго установленный, точно отсчитанный срок, который не будет продлён.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а оставшихся будет мало, совсем мало и они не будут сильны»; последнее слово может также означать «велики» или «значительны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Но теперь
  rationale: Передаёт переход и контраст с предшествующим пророчеством.
- source_word: דִּבֶּר יְהוָה
  choice: Яхве сказал
  rationale: Перфект обозначает совершённое и властное Божье изречение; личное имя передано как «Яхве».
- source_word: בְּשָׁלֹשׁ שָׁנִים כִּשְׁנֵי שָׂכִיר
  choice: Через три года, отсчитанные точно, как срок наёмного работника
  rationale: Предлог с временным выражением указывает на наступление события через три года, а сравнение со сроком наёмного работника подчёркивает точность и неизменность установленного срока.
- source_word: וְנִקְלָה כְּבוֹד מוֹאָב
  choice: слава Моава будет унижена
  rationale: Сохраняет контраст между славой и утратой почёта; нифаль קלה здесь означает унижение или умаление статуса.
- source_word: בְּכֹל הֶהָמוֹן הָרָב
  choice: вместе со всем его многочисленным народом
  rationale: הָמוֹן допускает значения множества, массы и изобилия; в контексте национального суда естественно понимать его как многочисленное население, не исключая оттенка могущества.
- source_word: וּשְׁאָר מְעַט מִזְעָר לֹא כַבִּיר
  choice: а остаток будет мал, ничтожен и бессилен
  rationale: 'Передаёт накопление трёх характеристик: малочисленность, крайнюю незначительность и отсутствие силы; «остаток» здесь не наделяется положительным богословским смыслом.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя.
- issue: Смысл שְׁאָר
  choice: остаток
  alternative: уцелевшие / то, что останется
  rationale: «Остаток» является прямым естественным соответствием и в данном контексте означает лишь немногое, оставшееся после суда.
- issue: Неоднозначность כַבִּיר
  choice: бессилен
  alternative: невелик / незначителен
  rationale: Слово может обозначать великое или сильное; в контексте разгрома Моава «бессилен» естественно передаёт утрату национальной мощи, а альтернативный оттенок отмечен в сноске.
