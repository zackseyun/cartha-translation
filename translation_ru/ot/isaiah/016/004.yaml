  text: יָג֤וּרוּ בָ/ךְ֙ נִדָּחַ֔/י מוֹאָ֛ב הֱוִי סֵ֥תֶר לָ֖/מוֹ מִ/פְּנֵ֣י שׁוֹדֵ֑ד כִּֽי אָפֵ֤ס הַ/מֵּץ֙ כָּ֣לָה שֹׁ֔ד תַּ֥מּוּ רֹמֵ֖ס מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/004.yaml
  text: Let the outcasts of Moab stay with you; be a shelter for them from the destroyer. For the oppressor has come to an end[a], destruction has ceased, those who trample have vanished from the land.
translation:
  language: ru
  text: Пусть изгнанники Моава живут у тебя; будь для них укрытием от разорителя.[a] Ведь угнетатель исчез, разорение прекратилось, попиратели исчезли из земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно и другое распространённое прочтение: «Пусть мои изгнанники живут у тебя, Моав; будь для него укрытием от разорителя». Оно основано на иной огласовке или членении начальных слов стиха.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָגוּרוּ בָךְ
  choice: пусть … живут у тебя
  rationale: Глагол גור обозначает временное проживание в качестве пришельца или под защитой. Такая формулировка естественна по-русски и не добавляет прямо не выраженного значения «искать убежища».
- source_word: נִדָּחַי
  choice: мои изгнанники
  rationale: В масоретской огласовке форма содержит суффикс первого лица единственного числа («мои»); נדח обозначает изгнанных, рассеянных или вынужденных покинуть своё место.
- source_word: מוֹאָב
  choice: Моав
  rationale: При чтении נִדָּחַי как «мои изгнанники» слово естественно понимать как обращение к Моаву.
- source_word: הֱוִי סֵתֶר
  choice: будь для них укрытием
  rationale: סֵתֶר — скрытое, защищённое место; «укрытие» сохраняет конкретный защитный образ и звучит современно.
- source_word: מִפְּנֵי שׁוֹדֵד
  choice: от разорителя
  rationale: Причастие שׁוֹדֵד обозначает того, кто грабит и опустошает. «Разоритель» передаёт как насилие, так и опустошение, не сужая смысл до кражи имущества.
- source_word: הַמֵּץ
  choice: угнетатель
  rationale: Редкое и трудное слово обычно связывают с притеснением или вымогательством. «Угнетатель» соответствует контексту насильственного господства, сохраняя необходимую широту.
- source_word: כָּלָה שֹׁד
  choice: разорение прекратилось
  rationale: שֹׁד охватывает разорение, опустошение и грабёж; в данном параллелизме речь идёт о прекращении разрушительного насилия.
- source_word: תַּמּוּ רֹמֵס
  choice: не стало … тех, кто её попирал
  rationale: Глагол стоит во множественном числе, а причастие может иметь собирательное значение. Русское множественное число отражает согласование и образ насильственного попрания.
- source_word: מִן הָאָרֶץ
  choice: в земле
  rationale: В региональном пророческом контексте הָאָרֶץ означает страну или землю. Конструкция «не стало в земле» естественно передаёт удаление попирающих из неё.
theological_decisions:
- issue: Адресат и синтаксис начального призыва
  choice: «Пусть мои изгнанники живут у тебя, Моав»
  alternative: «Пусть изгнанники Моава живут у тебя»
  rationale: Предоставленный масоретский текст огласован נִדָּחַי, буквально «мои изгнанники», поэтому מוֹאָב естественно воспринимать как обращение. Распространённое альтернативное прочтение понимает изгнанников как принадлежащих Моаву; оно отражено в сноске, поскольку требует иного членения или понимания формы.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены параллельные утверждения о прекращении угнетения, разорения и попрания; избегнуты архаизмы и конфессионально окрашенные термины.
