source:
  edition: WLC
  text: כִּ֣י שַׁדְמוֹת֩ חֶשְׁבּ֨וֹן אֻמְלָ֜ל גֶּ֣פֶן שִׂבְמָ֗ה בַּעֲלֵ֤י גוֹיִם֙ הָלְמ֣וּ שְׂרוּקֶּ֔י/הָ עַד יַעְזֵ֥ר נָגָ֖עוּ תָּ֣עוּ מִדְבָּ֑ר שְׁלֻ֣חוֹתֶ֔י/הָ נִטְּשׁ֖וּ עָ֥בְרוּ יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/008.yaml
  text: For the fields of Heshbon languish[a], the vine of Sibmah as well. The lords of the nations have struck down its choice vines; they reached as far as Jazer, they wandered into the wilderness[c][b]; its shoots spread out and crossed the sea.
translation:
  language: ru
  text: 'Ведь поля Хешбона увяли,

    и виноградная лоза Сивмы — тоже.

    Властители народов поразили её отборные лозы[a],

    которые доходили до Язера

    и блуждали по пустыне.

    Её побеги раскинулись[b]

    и пересекли море[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её усики» либо «её ветви». Еврейское слово может указывать как на отборную виноградную лозу, так и на её побеги.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово имеет не вполне ясное значение; возможен перевод: «её ветви широко протянулись».'
    reason: lexical_alternative
  - marker: c
    text: Возможно, имеется в виду Мёртвое море.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁדְמוֹת
  choice: поля
  rationale: Слово обозначает возделанную землю; «поля» естественно по-русски и не вводит более узкое значение «виноградники», хотя контекст связан с виноградарством.
- source_word: אֻמְלָל
  choice: увяли
  rationale: Глагол передаёт истощение, иссыхание и упадок; «увяли» сохраняет сельскохозяйственный образ и поэтическую краткость.
- source_word: גֶּפֶן שִׂבְמָה
  choice: виноградная лоза Сивмы
  rationale: Сохранено единственное число и олицетворённый собирательный образ еврейского текста, а уточнение «виноградная» делает значение ясным современному читателю.
- source_word: בַּעֲלֵי גוֹיִם
  choice: властители народов
  rationale: В данном контексте בְּעָלִים означает господ, повелителей или правителей; «властители» передаёт высокий поэтический регистр и не создаёт впечатления, будто речь идёт о владельцах виноградников.
- source_word: הָלְמוּ
  choice: разбили
  rationale: Глагол буквально выражает нанесение удара; «разбили» передаёт разрушительное действие без усиления до полного уничтожения.
- source_word: שְׂרוּקֶּיהָ
  choice: её отборные лозы
  rationale: Термин может обозначать ценный сорт лозы либо её побеги; основной текст передаёт вероятный оттенок отборного виноградного насаждения, а неоднозначность отмечена в сноске.
- source_word: עַד יַעְזֵר נָגָעוּ
  choice: они доходили до Язера
  rationale: Множественное число соотнесено с лозами и описывает прежнюю географическую протяжённость их роста; «доходили до» естественно передаёт буквальное «касались, достигали».
- source_word: תָּעוּ מִדְבָּר
  choice: блуждали по пустыне
  rationale: Сохранён буквальный образ блуждания или странствия, метафорически описывающий далеко разросшиеся лозы.
- source_word: שְׁלֻחוֹתֶיהָ
  choice: её побеги
  rationale: Существительное обозначает то, что лоза выпускает или посылает от себя; «побеги» точно и естественно продолжает виноградный образ.
- source_word: נִטְּשׁוּ
  choice: раскинулись
  rationale: В контексте роста лозы форма, вероятно, описывает широко протянувшиеся побеги; поскольку значение трудное и допускает другое понимание, это отражено в сноске.
- source_word: עָבְרוּ יָם
  choice: пересекли море
  rationale: Перевод сохраняет общее обозначение יָם и не уточняет в основном тексте, какое именно море имеется в виду.
