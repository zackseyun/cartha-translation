id: ISA.16.9
reference: Isaiah 16:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַל כֵּ֡ן אֶבְכֶּ֞ה בִּ/בְכִ֤י יַעְזֵר֙ גֶּ֣פֶן שִׂבְמָ֔ה אֲרַיָּ֨וֶ/ךְ֙ דִּמְעָתִ֔/י חֶשְׁבּ֖וֹן וְ/אֶלְעָלֵ֑ה כִּ֧י עַל קֵיצֵ֛/ךְ וְ/עַל קְצִירֵ֖/ךְ הֵידָ֥ד נָפָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/009.yaml
  text: Therefore I weep with the weeping of Jazer for the vine of Sibmah[a]; I drench you with my tears, Heshbon and Elealeh[b], because over your summer fruit and over your harvest the battle shout has fallen.
translation:
  language: ru
  text: Поэтому я плачу вместе с плачем Иазера о лозе Сивмы; я орошаю вас своими слезами[a], Есевон и Елеала, потому что на ваши летние плоды и на вашу жатву обрушился крик[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я заливаю вас своими слезами». Глагол выражает обильное насыщение влагой.'
    reason: lexical_alternative
  - marker: b
    text: «Крик обрушился» может означать боевой клич захватчиков, обрушившийся на урожай; возможно также понимание, что радостные возгласы при сборе урожая смолкли.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶבְכֶּה
  choice: я плачу
  rationale: Имперфект Qal первого лица в контексте плача естественно передаёт продолжающееся или предстоящее скорбное действие; настоящее время по-русски звучит естественно.
- source_word: בִּבְכִי יַעְזֵר
  choice: вместе с плачем Иазера
  rationale: Предлог בְּ перед существительным допускает сопутствующее или ассоциативное значение; формулировка сохраняет поэтическое отождествление плача говорящего с плачем Иазера.
- source_word: גֶּפֶן שִׂבְמָה
  choice: лоза Сивмы
  rationale: Единственное число גֶּפֶן сохраняет образ лозы, возможно употреблённый собирательно, без расширения до «виноградника».
- source_word: אֲרַיָּוֶךְ
  choice: я орошаю вас
  rationale: Пиэль от רוה означает напоить, насытить влагой, оросить; «орошаю» естественно сочетается со слезами и сохраняет образ обильного увлажнения.
- source_word: דִּמְעָתִי
  choice: своими слезами
  rationale: Русское множественное число идиоматично передаёт собирательное значение и выражает средство действия.
- source_word: חֶשְׁבּוֹן וְאֶלְעָלֵה
  choice: Есевон и Елеала
  rationale: Географические названия переданы в укоренившейся русской библейской форме и поняты как прямое обращение, что согласуется с формой второго лица женского рода множественного числа.
- source_word: קֵיץ
  choice: летние плоды
  rationale: קֵיץ обозначает созревшие летом плоды или летний урожай; выбран конкретный и понятный земледельческий образ.
- source_word: קָצִיר
  choice: жатва
  rationale: Обычное значение термина — жатва или время сбора урожая; «жатва» сохраняет поэтический сельскохозяйственный регистр.
- source_word: הֵידָד
  choice: крик
  rationale: Слово может обозначать как радостный возглас при сборе урожая, так и вражеский боевой клич. Нейтральное «крик» сохраняет эту неоднозначность.
- source_word: נָפָל
  choice: обрушился
  rationale: Буквально глагол означает «упал»; «обрушился на» естественно передаёт направленный образ бедствия, не подменяя его толкованием «смолк».
theological_decisions:
- issue: Смысл заключительного выражения הֵידָד נָפָל
  choice: «обрушился крик» с нейтральным существительным
  alternative: «обрушился боевой клич» или «смолк радостный крик сборщиков»
  rationale: В контексте суда вероятен вражеский клич, однако הֵידָד употребляется и о возгласах во время сбора винограда. Основной текст сохраняет образ и напряжение оригинала, а примечание сообщает обе возможности.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Сохранены образы лозы, слёз, летних плодов и жатвы; синтаксис слегка упорядочен ради ясности. Неоднозначность финального крика не снята.
