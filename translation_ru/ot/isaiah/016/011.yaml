lexical_decisions:
- source_word: מֵעַי
  choice: утроба моя
  rationale: Слово буквально обозначает внутренности и образно выражает глубокое чувство. «Утроба моя» сохраняет телесную образность еврейского текста и при этом уместно звучит в возвышенной современной речи.
- source_word: לְמוֹאָב
  choice: о Моаве
  rationale: Предлог указывает, к кому обращена скорбь. По-русски естественнее всего сказать «стонет о Моаве».
- source_word: כַּכִּנּוֹר
  choice: словно лира
  rationale: Киннор был древним струнным инструментом; точное соответствие современным инструментам не установлено. «Лира» ясно передаёт сравнение, а неопределённость сохранена в примечании.
- source_word: יֶהֱמוּ
  choice: стонет
  rationale: Глагол обозначает гулкий, рокочущий или стонущий звук. В контексте плача «стонет» передаёт и звучание инструмента, и скорбь говорящего.
- source_word: וְקִרְבִּי
  choice: и всё нутро моё
  rationale: Существительное обозначает внутреннюю часть человека, его внутреннее существо. «Всё нутро моё» сохраняет параллелизм и телесно-эмоциональную силу оригинала, не сводя выражение к более толковательному «сердце».
- source_word: לְקִיר חָרֶשׂ
  choice: о Кир-Хересе
  rationale: Сочетание понято как название моавитского города и передано транслитерацией; традиционная расширенная форма приведена в примечании.
