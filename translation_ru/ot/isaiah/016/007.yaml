lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Естественно передаёт вывод или следствие, вводимое контекстом предшествующего пророчества о суде.
- source_word: יְיֵלִיל
  choice: будет рыдать
  rationale: Передаёт громкий скорбный плач в контексте бедствия; современно и выразительно, без излишне животного оттенка слова «выть».
- source_word: מוֹאָב לְמוֹאָב
  choice: Моав будет рыдать о Моаве
  rationale: Сохраняет намеренный повтор и образ народа или страны, оплакивающей саму себя; ל обозначает предмет плача.
- source_word: כֻּלֹּה
  choice: весь он
  rationale: Относится к Моаву как к целому народу или краю и сохраняет грамматическое согласование русского названия мужского рода.
- source_word: לַאֲשִׁישֵׁי
  choice: о лепёшках с изюмом
  rationale: Масоретский текст естественнее всего понимается как форма от אֲשִׁישָׁה, то есть прессованная лепёшка, вероятно из изюма; возможное значение «основания» отмечено в сноске.
- source_word: קִיר חֲרֶשֶׂת
  choice: Кир-Харесета
  rationale: Передано как географическое название; родительный падеж после «из» естественен по-русски.
- source_word: תֶּהְגּוּ
  choice: вы будете стонать
  rationale: Форма второго лица множественного числа сохраняет риторический переход к прямому обращению; «стонать» передаёт тихое, слышимое выражение скорби.
- source_word: אַךְ נְכָאִים
  choice: совершенно сокрушённые
  rationale: אַךְ понято как усилитель, а נְכָאִים — как состояние глубокой подавленности или поражённости бедствием.
