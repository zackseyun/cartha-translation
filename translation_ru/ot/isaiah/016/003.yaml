base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/003.yaml
  text: Bring counsel[a]; make a decision. Make your shadow like the night in the middle of noon; hide the outcasts[c][b]; do not betray the fugitive.
translation:
  language: ru
  text: Дайте совет; вынесите судебное решение[a]. Сделай свою тень[b] подобной ночи в самый полдень; укрой изгнанников, не выдавай беглеца[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершите правосудие», «вынесите приговор» либо «рассудите дело». Еврейское слово имеет юридико-судебный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: «Тень» можно также перевести как «сень».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не открывай» или «не обнаруживай беглеца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הביאו עֵצָה
  choice: Дайте совет
  rationale: Множественное повеление и существительное со значением «совет, замысел» переданы естественной русской формулой, сохраняющей официальный тон обращения.
- source_word: עֲשׂוּ פְלִילָה
  choice: примите судебное решение
  rationale: פְלִילָה имеет юридико-судебный оттенок; «примите решение» естественно по-русски, а определение «судебное» сохраняет заложенную в еврейском слове правовую семантику.
- source_word: שִׁיתִי כַלַּיִל צִלֵּךְ
  choice: Сделай свою тень подобной ночи
  rationale: Женский род единственного числа в повелении сохранён; сравнение с ночью и образ тени переданы прямо.
- source_word: בְּתוֹךְ צָהֳרָיִם
  choice: среди полудня
  rationale: Передаёт буквальный контраст глубокой ночной тени и полуденного света, сохраняя возвышенную поэтическую форму.
- source_word: סַתְּרִי נִדָּחִים
  choice: укрой изгнанников
  rationale: «Укрой» передаёт не только сокрытие, но и защиту, подразумеваемую контекстом; נִדָּחִים — люди, изгнанные или отогнанные прочь.
- source_word: נֹדֵד אַל תְּגַלִּי
  choice: не выдавай беглеца
  rationale: Хотя גלה буквально означает «открывать, обнаруживать», в контексте укрытия преследуемого «не выдавай» точно выражает практический смысл запрета; נֹדֵד здесь обозначает бегущего или скитающегося человека.
