    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... תִּהְיֶינָה
  choice: И ... так будут
  rationale: Начальная форма היה вводит сравнение, а תִּהְיֶינָה выражает будущее состояние подлежащего во множественном числе. Конструкция «И как... так будут» естественно передаёт связь образа с последующим утверждением.
- source_word: כְעוֹף נוֹדֵד
  choice: как скитающаяся птица
  rationale: עוֹף означает птицу, а נוֹדֵד — беспокойное перемещение, странствие или бегство. «Скитающаяся» сохраняет образ лишённой пристанища птицы, не уточняя сверх текста, что она именно спасается бегством.
- source_word: קֵן מְשֻׁלָּח
  choice: как разорённое гнездо
  rationale: Буквально это сжатый образ «гнезда, отосланного/изгнанного». По-русски «разорённое гнездо» естественно передаёт нарушенность, оставленность и рассеяние его обитателей; добавленное в переводе «как» ясно оформляет параллельное сравнение.
- source_word: בְּנוֹת מוֹאָב
  choice: дочери Моава
  rationale: Буквальный поэтический оборот сохранён, поскольку он может обозначать как моавитянок, так и олицетворённые города или селения Моава.
- source_word: מַעְבָּרֹת לְאַרְנֹון
  choice: у переправ через Арнон
  rationale: מַעְבָּרוֹת обозначает места перехода, в данном контексте речные броды или переправы. Русская конструкция «переправы через Арнон» ясно указывает на реку и звучит естественно.
