  source_fidelity: 'Основной образ и порядок колонов переданы точно: земля скорбит и чахнет; Ливан и плодородные области представлены как переживающие запустение. Однако «Ливан посрамлён» звучит как страдательное состояние, причинённое не названным субъектом, тогда как הֶחְפִּיר в данном олицетворении передаёт, что Ливан устыдился/испытывает стыд. Лучше сохранить этот активный оттенок.'
