  yaml_path: translation/ot/isaiah/033/009.yaml
  text: The land mourns and withers[a]; Lebanon is ashamed and withers away. Sharon has become like the Arabah[b], and Bashan and Carmel shake off their leaves.
translation:
  language: ru
  text: Скорбит и чахнет земля; Ливан стыдится и увядает. Шарон стал как Арава[a], а Васан и Кармил сбрасывают листву[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как пустынная равнина» или «как пустыня».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Васан и Кармил стряхивают»; подразумевается, что они лишаются листвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַל
  choice: скорбит
  rationale: Глагол обозначает скорбь или плач; этот выбор сохраняет олицетворение земли и одновременно передаёт картину запустения.
- source_word: אֻמְלְלָה
  choice: чахнет
  rationale: Слово описывает ослабление, истощение и увядание. «Чахнет» естественно сочетается со «скорбит» и подходит как к земле, так и к растительности.
- source_word: אֶרֶץ
  choice: земля
  rationale: В данном контексте речь идёт об опустошённой земле как территории, а не обязательно обо всём мире.
- source_word: הֶחְפִּיר
  choice: посрамлён
  rationale: Форма выражает стыд, унижение или посрамление. Краткая форма сохраняет поэтическое олицетворение Ливана.
- source_word: לְבָנוֹן
  choice: Ливан
  rationale: Устоявшаяся русская форма географического названия.
- source_word: קָמַל
  choice: увядает
  rationale: Глагол употребляется об увядании и усыхании растительности; настоящее время сохраняет живость пророческой картины.
- source_word: הַשָּׁרוֹן
  choice: Шарон
  rationale: Устоявшаяся русская передача названия плодородной прибрежной равнины.
- source_word: כָּעֲרָבָה
  choice: словно Арава
  rationale: Сохраняется географическое наименование засушливой долины; возможное нарицательное понимание поясняется в сноске.
- source_word: נֹעֵר
  choice: сбрасывают листву
  rationale: Глагол означает стряхивать или сбрасывать. Объект «листву» подразумевается образом оголяющихся плодородных областей и делает его ясным по-русски.
- source_word: בָּשָׁן
  choice: Васан
  rationale: Устоявшаяся русская библейская форма названия области.
- source_word: כַרְמֶל
  choice: Кармил
  rationale: Устоявшаяся русская библейская форма названия; слово «гора» в еврейском тексте здесь отсутствует.
