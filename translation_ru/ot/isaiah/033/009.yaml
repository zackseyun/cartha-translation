- from: Скорбит и чахнет земля; Ливан посрамлён и увядает. Шарон стал словно Арава[a], а Васан и Кармил сбрасывают листву[b].
  to: Скорбит и чахнет земля; Ливан стыдится и увядает. Шарон стал как Арава[a], а Васан и Кармил сбрасывают листву[b].
  rationale: Правка заменяет страдательное «посрамлён» на активное персонифицированное «стыдится», более близкое к образу еврейского глагола в контексте. Сноска к «Араве» уточнена как лексическая альтернатива и не навязывает одно географическое толкование. Остальные решения, включая передачу подразумеваемого объекта «листву» и расположение сносок, сохранены.
