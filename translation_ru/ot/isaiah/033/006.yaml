  yaml_path: translation/ot/isaiah/033/006.yaml
  text: And he will be the stability of your times[a], a wealth of salvation, wisdom, and knowledge[c][b]; the fear of Yahweh is his treasure.
translation:
  language: ru
  text: И Он будет устойчивостью твоих времён, богатством спасения, мудрости и знания; страх перед Яхве — его сокровище.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: И Он будет
  rationale: Мужская форма единственного числа естественно допускает личного субъекта, вероятнее всего Яхве в ближайшем контексте; возможность безличного прочтения сохранена в сноске.
- source_word: אֱמוּנַת עִתֶּיךָ
  choice: опорой во все твои времена
  rationale: אֱמוּנָה здесь выражает устойчивость, надёжность; «опора» естественно сочетается с личным субъектом. עִתֶּיךָ сохраняет обращение во втором лице и временную широту выражения.
- source_word: חֹסֶן
  choice: богатством
  rationale: Слово обозначает богатство, запас или изобилие; «богатство» сохраняет образ и позволяет связать последующий ряд благ.
- source_word: יְשׁוּעֹת
  choice: спасения
  rationale: Еврейское множественное число может иметь усилительное или собирательное значение, указывая на обильное спасение либо многочисленные избавления.
- source_word: חָכְמַת וָדָעַת
  choice: мудрости и знания
  rationale: Передаёт координированный именной ряд и конструктивную связь после חֹסֶן без ненужного смыслового уточнения.
- source_word: יִרְאַת יְהוָה
  choice: страх перед Яхве
  rationale: Сохраняется личное имя יהוה и библейское понятие благоговейного страха; предлог «перед» звучит естественно в современном русском языке.
- source_word: הִיא אוֹצָרוֹ
  choice: его сокровище
  rationale: Женское הִיא соотносится со «страхом», а суффикс 3-го лица мужского рода передан как «его»; неоднозначность референта отмечена в сноске.
theological_decisions:
- issue: Субъект וְהָיָה
  choice: 'Личное прочтение: «Он будет»'
  alternative: 'Безличное прочтение: «в твои времена будет устойчивость»'
  rationale: Мужская форма единственного числа и контекст позволяют видеть субъектом Яхве, но синтаксис не исключает безличной конструкции; альтернатива сохранена.
- issue: Референт суффикса в אוֹצָרוֹ
  choice: «его сокровище»
  alternative: «твоё сокровище» или «её/его сокровище» в зависимости от предполагаемого референта
  rationale: Форма суффикса буквально означает принадлежность лицу или предмету мужского рода, однако контекст не устанавливает референт однозначно; перевод не устраняет эту напряжённость, а сноска сообщает основные варианты.
- issue: Множественное число יְשׁוּעֹת
  choice: Собирательное «спасения»
  alternative: «избавлений» или «побед»
  rationale: Форма множественного числа может обозначать полноту спасения либо ряд избавлений; русское отвлечённое единственное число лучше вписывается в перечень, при этом морфологическая особенность отмечена.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Опора» выбрана вместо отвлечённой «устойчивости» в основном тексте ради естественного сочетания с личным субъектом. Порядок сносок приведён к последовательному [a], [b], [c], и каждый маркер присутствует в основном тексте.
