language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֹלֵ֣ךְ צְדָק֔וֹת וְ/דֹבֵ֖ר מֵֽישָׁרִ֑ים מֹאֵ֞ס בְּ/בֶ֣צַע מַעֲשַׁקּ֗וֹת נֹעֵ֤ר כַּפָּי/ו֙ מִ/תְּמֹ֣ךְ בַּ/שֹּׁ֔חַד אֹטֵ֤ם אָזְנ/וֹ֙ מִ/שְּׁמֹ֣עַ דָּמִ֔ים וְ/עֹצֵ֥ם עֵינָ֖י/ו מֵ/רְא֥וֹת בְּ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/015.yaml
  text: He who walks in righteousness and speaks what is upright[a], who despises gain from extortions, who shakes his hands free from taking a bribe, who stops his ears from hearing of bloodshed[c][b], and shuts his eyes from looking on evil—
translation:
  language: ru
  text: Тот, кто живёт праведно[a], говорит честно, презирает наживу от притеснений[b], отряхивает руки, не принимая взяток, затыкает уши, чтобы не слушать о кровопролитии[c], и закрывает глаза, чтобы не смотреть на зло, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступает справедливо»; или: «совершает праведные дела».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наживу от вымогательства».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «крови». Еврейское множественное число может обозначать кровопролитие или вину за пролитую кровь.'
    reason: cultural_note
lexical_decisions:
- source_word: הֹלֵךְ צְדָקוֹת
  choice: живёт праведно
  rationale: Глагол הלך в этическом контексте обозначает образ жизни. Естественное русское «живёт праведно» передаёт метафорический смысл, а множественное צְדָקוֹת понимается как качественное обозначение праведных поступков или справедливости.
- source_word: דֹבֵר מֵישָׁרִים
  choice: говорит правду
  rationale: מֵישָׁרִים передаёт прямоту, честность и справедливость речи; «говорит правду» ясно и естественно выражает здесь нравственную прямоту, не ограничивая её судебной сферой.
- source_word: מֹאֵס בְּבֶצַע מַעֲשַׁקּוֹת
  choice: презирает наживу от притеснения
  rationale: מֹאֵס выражает нравственное отвращение, בֶּצַע — корыстную прибыль, а מַעֲשַׁקּוֹת — притеснения или вымогательства. Формулировка сохраняет силу оценки и возможную широту вида злоупотребления.
- source_word: נֹעֵר כַּפָּיו מִתְּמֹךְ בַּשֹּׁחַד
  choice: отряхивает руки, чтобы не брать взяток
  rationale: Образ отряхивания рук передаёт решительный отказ иметь дело со взяткой; целевая конструкция по-русски естественно выражает смысл удаления рук от её принятия.
- source_word: אֹטֵם אָזְנוֹ מִשְּׁמֹעַ דָּמִים
  choice: затыкает уши, чтобы не слушать о кровопролитии
  rationale: 'Русское множественное «уши» естественно для устойчивого телесного образа. «Не слушать о кровопролитии» сохраняет некоторую неоднозначность: речь может идти о кровавых замыслах, призывах или сообщениях, предполагающих соучастие.'
- source_word: עֹצֵם עֵינָיו מֵרְאוֹת בְּרָע
  choice: закрывает глаза, чтобы не смотреть на зло
  rationale: Передаётся сознательный отказ направлять взгляд на зло или с одобрением наблюдать его; широкая формулировка не сводит смысл только к одному виду соучастия.
theological_decisions:
- issue: Цепочка причастий без явно выраженного относительного местоимения
  choice: Тот, кто…
  alternative: Идущий…; кто…
  rationale: «Тот, кто» естественно вводит по-русски единичный представительный образ человека и позволяет сохранить последовательность характеристик.
- issue: Смысл צְדָקוֹת
  choice: живёт праведно
  alternative: поступает справедливо; совершает праведные дела
  rationale: Основной текст сохраняет широкий нравственный смысл, не сводя выражение только к судебной справедливости или к перечню отдельных дел; альтернативы отмечены в сноске.
- issue: Смысл דָּמִים во множественном числе
  choice: кровопролитие
  alternative: кровь; кровавые замыслы; вина за кровь
  rationale: «Кровопролитие» является естественной передачей еврейской идиомы, однако сноска отмечает буквальную форму и связанную с ней смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранена цепочка нравственных характеристик и незавершённость стиха перед продолжением в следующем стихе; буквальные еврейские образы оставлены там, где они понятны по-русски.
