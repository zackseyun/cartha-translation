    issue: «говорит правду»
    rationale: Формула может означать лишь сообщение истинных фактов, тогда как דֹבֵר מֵישָׁרִים характеризует речь как честную, прямую и справедливую. «Говорит честно» сохраняет эту более широкую этическую характеристику.
  - severity: low
    issue: Единственное число «притеснения»
    rationale: Еврейское מַעֲשַׁקּוֹת стоит во множественном числе; русское «нажива от притеснений» естественно и точнее сохраняет этот оттенок.
  - severity: low
