lexical_decisions:
- source_word: עַתָּה
  choice: теперь
  rationale: Передаёт непосредственность предстоящего действия; троекратный повтор сохранён ради ритма и нарастания.
- source_word: אָקוּם
  choice: Я восстану
  rationale: Форма глагола קום обозначает решительное вставание и начало действия; «восстану» сохраняет возвышенный пророческий тон.
- source_word: יֹאמַר יְהוָה
  choice: говорит Яхве
  rationale: Настоящее время естественно передаёт пророческую формулу речи, а личное имя יְהוָה транслитерировано как «Яхве».
- source_word: אֵרוֹמָם
  choice: возвышусь
  rationale: Форма от רום выражает возвышение говорящего; возвратный русский глагол кратко и естественно передаёт этот оттенок.
- source_word: אֶנָּשֵׂא
  choice: вознесусь
  rationale: Нифаль от נשׂא допускает возвратное или страдательное понимание. «Вознесусь» сохраняет смысл возвышения и отличает этот глагол от предшествующего רום.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Соотношение אֵרוֹמָם и אֶנָּשֵׂא
  choice: «возвышусь» и «вознесусь»
  alternative: «буду возвеличен» и «буду вознесён»; оба глагола передать одинаково
  rationale: Два близких по смыслу еврейских глагола сохранены как разные, без жёсткого устранения возможного возвратного или страдательного оттенка; так передаётся поэтическое нарастание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Повтор «теперь» и последовательность трёх действий сохранены; оформление прямой речи делает формулу «говорит Яхве» естественной по-русски.
