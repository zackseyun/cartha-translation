base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/016.yaml
  text: He will dwell on the heights[a]; rocky fortresses will be his refuge; his bread will be given[b], his water will be sure.
translation:
  language: ru
  text: Он будет жить на высотах; скальные крепости будут его убежищем[a]. Хлеб будет дан ему, и вода у него не иссякнет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скальные крепости будут его твердыней». Еврейское выражение рисует высокое, надёжно защищённое место.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вода у него будет всегда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְרוֹמִים
  choice: на высотах
  rationale: Сохраняет пространственный образ возвышенного и безопасного места; естественно звучит по-русски.
- source_word: יִשְׁכֹּן
  choice: будет жить
  rationale: Передаёт длительное пребывание, выраженное Qal imperfect глагола שכן, современным литературным русским языком.
- source_word: מְצָדוֹת סְלָעִים
  choice: неприступные скалы
  rationale: Конструктивное сочетание буквально означает укрепления или твердыни скал; перевод передаёт образ природной каменной крепости без тяжеловесности.
- source_word: מִשְׂגַּבּוֹ
  choice: станут его убежищем
  rationale: Существительное обозначает высокое, защищённое место; «убежище» ясно передаёт его защитную функцию.
- source_word: לַחְמוֹ נִתָּן
  choice: хлеб будет дан ему
  rationale: Сохраняет конкретное «хлеб» и пассивную форму, выражающую обещанное обеспечение.
- source_word: מֵימָיו נֶאֱמָנִים
  choice: вода у него не иссякнет
  rationale: Передаёт надёжность и гарантированность запаса воды, выраженную נֶאֱמָנִים, естественной русской формулировкой.
- source_word: הוּא
  choice: Он
  rationale: Местоимение относится к праведному человеку, описанному в предыдущем стихе, и сохраняет мужской род и единственное число.
theological_decisions:
- issue: К кому относится местоимение мужского рода в единственном числе
  choice: К праведному человеку, описанному в Ис 33:15
  alternative: Обобщённое указание на праведника либо типологическое указание на верный остаток
  rationale: Ближайший контекст перечисляет качества человека, живущего праведно, а стих 16 обещает ему безопасность и обеспечение; перевод не вводит прямого мессианского отождествления, которого сам текст не требует.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис ясен для широкого читателя; параллелизм безопасности и обеспечения сохранён.
