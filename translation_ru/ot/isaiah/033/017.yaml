  text: מֶ֥לֶךְ בְּ/יָפְי֖/וֹ תֶּחֱזֶ֣ינָה עֵינֶ֑י/ךָ תִּרְאֶ֖ינָה אֶ֥רֶץ מַרְחַקִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/017.yaml
  text: Your eyes will behold the king in his beauty[a]; they will see a far-reaching land.
translation:
  language: ru
  text: Твои глаза увидят царя в его красоте; они увидят землю, простирающуюся вдаль[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «далёкую землю»; букв.: «землю дальних пространств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царя
  rationale: Существительное означает «царь». Хотя артикля нет, контекст допускает определённого царя; русский винительный «царя» не уточняет его личность.
- source_word: בְּיָפְיוֹ
  choice: в его красоте
  rationale: Сохраняет еврейскую конструкцию и не сужает смысл до одной лишь внешней привлекательности или царского великолепия.
- source_word: תֶּחֱזֶינָה
  choice: увидят
  rationale: Глагол חזה может подразумевать созерцание, однако в современном русском «увидят» звучит естественно и в данном поэтическом контексте передаёт непосредственное зрительное восприятие.
- source_word: עֵינֶיךָ
  choice: твои глаза
  rationale: Сохранён явный образ оригинала и грамматическая связь с глаголами женского рода во множественном числе.
- source_word: תִּרְאֶינָה
  choice: они увидят
  rationale: Местоимение отсылает к «глазам», сохраняет синтаксический параллелизм двух частей стиха и делает связь ясной по-русски.
- source_word: אֶרֶץ מַרְחַקִּים
  choice: землю, простирающуюся вдаль
  rationale: Идиоматически передаёт буквальное «земля далей/дальних расстояний», сохраняя образ широкого, уходящего вдаль пространства; возможность значения удалённой земли отмечена в сноске.
theological_decisions:
- issue: Личность царя
  choice: 'Личность не уточняется: «царя»'
  alternative: Езекия; Господь как Царь; мессианский или эсхатологический Царь
  rationale: В самом стихе царь не назван. Перевод сохраняет эту неопределённость и не навязывает одну богословскую трактовку.
translation_notes:
  register: Современный литературный русский язык с поэтической сдержанностью. Повторение глагола «увидят» и выражение «твои глаза» сохранены ради параллелизма и образности оригинала. Маркер сноски поставлен при выражении אֶרֶץ מַרְחַקִּים, к которому относится примечание.
