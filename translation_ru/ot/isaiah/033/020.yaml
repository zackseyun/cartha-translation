source:
  edition: WLC
  text: חֲזֵ֣ה צִיּ֔וֹן קִרְיַ֖ת מֽוֹעֲדֵ֑/נוּ עֵינֶי/ךָ֩ תִרְאֶ֨ינָה יְרוּשָׁלִַ֜ם נָוֶ֣ה שַׁאֲנָ֗ן אֹ֤הֶל בַּל יִצְעָן֙ בַּל יִסַּ֤ע יְתֵֽדֹתָי/ו֙ לָ/נֶ֔צַח וְ/כָל חֲבָלָ֖י/ו בַּל יִנָּתֵֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/020.yaml
  text: Look upon Zion[a], the city of our appointed feasts; your eyes will see Jerusalem, a quiet habitation, a tent that will not be moved; its stakes will never be pulled up[c][b], and none of its ropes will be torn apart.
translation:
  language: ru
  text: 'Взгляни на Сион, город наших праздников[a]. Твои глаза увидят Иерусалим — спокойную обитель[b], шатёр, который не будет перенесён[c]: его колья никогда не выдернут, и ни одна из его верёвок не порвётся.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «город наших назначенных собраний»; также возможно: «город наших установленных празднеств». Еврейское מוֹעֲדֵנוּ может обозначать назначенные времена или собрания, особенно связанные с богослужением.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «безопасную обитель». Прилагательное может означать спокойствие, безмятежность или защищённость.'
    reason: lexical_alternative
  - marker: c
    text: Буквально речь идёт о шатре, который не станут передвигать или сворачивать. Образ раскрывают следующие слова о кольях и верёвках.
    reason: cultural_note
lexical_decisions:
- source_word: חֲזֵה
  choice: Взгляни
  rationale: Повелительная форма призывает непосредственно обратить взор на Сион; «взгляни» естественно передаёт эту силу в современном русском языке.
- source_word: קִרְיַת מוֹעֲדֵנוּ
  choice: город наших праздников
  rationale: מוֹעֵד обозначает назначенное время или собрание, особенно празднично-богослужебное; в контексте Сиона «праздников» ясно передаёт культовый смысл, не исключая идеи назначенных собраний.
- source_word: עֵינֶיךָ תִרְאֶינָה
  choice: Твои глаза увидят
  rationale: Сохранён явный субъект еврейского текста — «твои глаза», создающий зрительный и личный акцент.
- source_word: נָוֶה שַׁאֲנָן
  choice: спокойную обитель
  rationale: נָוֶה — место обитания, а שַׁאֲנָן выражает покой, безмятежность и защищённость; формулировка сохраняет образ жилища и основное значение прилагательного.
- source_word: אֹהֶל
  choice: шатёр
  rationale: Обычное значение слова — переносное жилище; последующие упоминания кольев и верёвок подтверждают буквальный образ шатра, а не специальное значение «скиния».
- source_word: בַּל יִצְעָן
  choice: который не будет перенесён
  rationale: Редкий глагол, вероятно, описывает перемещение или кочевание шатра. «Не будет перенесён» сохраняет конкретный образ и идею устойчивости.
- source_word: בַּל יִסַּע יְתֵדֹתָיו לָנֶצַח
  choice: его колья никогда не выдернут
  rationale: נסע применительно к кольям означает вынимать их при сворачивании лагеря; «никогда» естественно передаёт לָנֶצַח в отрицательном высказывании.
- source_word: וְכָל חֲבָלָיו בַּל יִנָּתֵקוּ
  choice: и ни одна из его верёвок не порвётся
  rationale: Отрицание при «всех верёвках» идиоматично передано как «ни одна»; נתק в нифале означает быть разорванным или оборванным.
theological_decisions:
- issue: Характер образа Сиона и Иерусалима
  choice: Сохранить обещание мирной и прочной устойчивости Иерусалима посредством буквального образа неподвижного шатра.
  alternative: Истолковать шатёр прямо в тексте исключительно как эсхатологический народ Божий либо только как историко-политическое восстановление.
  rationale: Еврейский текст изображает Сион/Иерусалим безопасным жилищем через метафору шатра, который не сворачивают. Перевод сохраняет образ, не разрешая более широкие богословские вопросы за читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен обычному читателю; конкретная шатровая образность сохранена без архаичного «скиния» и без богословского переистолкования.
