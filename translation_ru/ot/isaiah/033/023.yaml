  source_fidelity: 'Основной образ и последовательность действий переданы верно: ослабленные корабельные канаты, неспособность закрепить опору мачты и развернуть парус, затем раздел добычи и участие даже хромых. Однако «поднять парус» менее точно передаёт פָּרַשׂ («развернуть, расправить»), а «снасти» шире, чем חֲבָלִים («канаты, верёвки»).'
  naturalness: 'Текст в целом литературен и ясен. «Не удерживают основание мачты» звучит несколько неестественно по-русски: основание скорее закрепляют, чем удерживают. Более естественная конструкция сохраняет трудность и осторожность исходного כֵן.'
