  text: נִטְּשׁ֖וּ חֲבָלָ֑יִ/ךְ בַּל יְחַזְּק֤וּ כֵן תָּרְנָ/ם֙ בַּל פָּ֣רְשׂוּ נֵ֔ס אָ֣ז חֻלַּ֤ק עַֽד שָׁלָל֙ מַרְבֶּ֔ה פִּסְחִ֖ים בָּ֥זְזוּ בַֽז־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/023.yaml
  text: Your ropes hang loose[a]; they cannot hold firm the base of their mast; they cannot spread the sail. Then abundant plunder will be divided[b]; even the lame will carry off the spoil.
translation:
  language: ru
  text: 'Твои канаты ослабли: они не могут закрепить основание своей мачты, не могут развернуть парус.[a] Тогда будет разделена обильная добыча — даже хромые завладеют добычей.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не могут развернуть знамя». Еврейское נֵס обычно означает знамя или сигнальный штандарт, но в корабельном образе этой строки его можно понимать как парус.'
    reason: lexical_alternative
  - marker: b
    text: 'Образ неисправного корабля показывает падение врага: он станет настолько беспомощным, что добычу смогут взять даже хромые.'
    reason: cultural_note
lexical_decisions:
- source_word: נִטְּשׁוּ חֲבָלָיִךְ
  choice: Ослабли твои снасти
  rationale: Пассивная форма передаёт распущенное, ослабленное состояние корабельных канатов. «Снасти» естественно обозначает такелаж в морском образе и сохраняет обращение во 2-м лице женского рода.
- source_word: בַּל יְחַזְּקוּ
  choice: не удерживают
  rationale: Сильное отрицание с глаголом חזק здесь выражает неспособность надёжно закрепить или поддержать конструкцию.
- source_word: כֵן תָּרְנָם
  choice: основание мачты
  rationale: כֵן — трудное в данном контексте слово, вероятно обозначающее подставку, опору или основание; תֹּרֶן означает мачту. Перевод сохраняет корабельный образ, не внося излишней технической конкретики.
- source_word: בַּל פָּרְשׂוּ נֵס
  choice: не могут поднять парус
  rationale: פרשׂ означает расправлять или развёртывать. נֵס обычно означает знамя или сигнальный штандарт, однако рядом с мачтой и снастями возможно значение паруса; неоднозначность отмечена в сноске.
- source_word: אָז חֻלַּק עַד שָׁלָל מַרְבֶּה
  choice: Тогда будет поделена богатая добыча
  rationale: Пассив חֻלַּק передаёт раздел добычи; пророческое будущее естественно выражает последовательность событий. Частица עַד в этой трудной фразе, вероятно, усиливает представление о множестве добычи.
- source_word: פִּסְחִים בָּזְזוּ בַז
  choice: даже хромые захватят трофеи
  rationale: Необычная способность даже хромых унести добычу подчёркивает полное бессилие побеждённого врага. Разные русские соответствия словам שָׁלָל и בַז избегают тяжёлого повтора, сохраняя смысл.
