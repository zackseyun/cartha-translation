translation_notes:
  register: Современный литературный русский язык с краткой, образной синтаксической структурой. Морская метафора сохранена; трудное כֵן передано осторожно, а неоднозначность נֵס вынесена в сноску. «Хромые» — точное и нейтральное обозначение в контексте древнего текста.
