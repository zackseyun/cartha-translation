lexical_decisions:
- source_word: וְאֻסַּף
  choice: И соберут
  rationale: Еврейская пассивная форма буквально означает «будет собрана». Неопределённо-личное русское «соберут» естественно передаёт пассив и не вводит названного деятеля.
- source_word: שְׁלַלְכֶם
  choice: вашу добычу
  rationale: שׁלל обозначает военную добычу; «добыча» естественно звучит в данном контексте.
- source_word: אֹסֶף הֶחָסִיל
  choice: как саранча собирает всё вокруг
  rationale: Оборот построен на корне אסף («собирать») и буквально близок к «как собирание саранчи». По-русски образ яснее передаётся глагольной конструкцией; «всё вокруг» эксплицирует характер опустошающего собирания, не определяя точный предмет.
- source_word: הֶחָסִיל
  choice: саранча
  rationale: חָסִיל может обозначать вид или стадию саранчи; общее «саранча» понятно современному читателю и сохраняет образ.
- source_word: כְּמַשַּׁק
  choice: как ... устремляются
  rationale: Редкое слово, вероятно обозначающее стремительное движение, натиск или набег; глагольная формулировка естественна по-русски.
- source_word: גֵּבִים
  choice: полчища саранчи
  rationale: Редкое и неясное существительное. В контексте оно, вероятно, указывает на скопления или рои; «полчища» сохраняет массовость и оттенок натиска, а «саранчи» обозначено как контекстуально вероятное восполнение.
- source_word: שׁוֹקֵק
  choice: устремятся
  rationale: Причастие передаёт быстрое, энергичное движение; повтор «устремляются — устремятся» отражает сравнение еврейского текста.
- source_word: בּוֹ
  choice: на неё
  rationale: Местоименный суффикс, вероятнее всего, отсылает к добыче; по-русски требуется женский род.
