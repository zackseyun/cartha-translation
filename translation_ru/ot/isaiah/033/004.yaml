  text: And your spoil will be gathered like the gathering of locusts[a]; like the rushing of swarms[b], they rush upon it.
translation:
  language: ru
  text: И вашу добычу соберут, словно саранча собирается; на неё устремятся, как устремляются рои[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в первой части: «как собирание саранчи»; еврейское חָסִיל может обозначать особый вид или стадию развития саранчи. Вторая часть еврейского текста трудна: редкое слово, переданное как «рои», может обозначать скопления или массы; возможны также переводы: «как при натиске роёв» или «как саранча устремляется на неё».'
