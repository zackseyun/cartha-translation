  text: הֵ֚ן אֶרְאֶלָּ֔ם צָעֲק֖וּ חֻ֑צָ/ה מַלְאֲכֵ֣י שָׁל֔וֹם מַ֖ר יִבְכָּיֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/007.yaml
  text: Look[a], their heroes cry out outside[b]; the messengers of peace weep bitterly.
translation:
  language: ru
  text: Вот, их герои[a] кричат снаружи; посланники мира[b] горько плачут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское אֶרְאֶלָּם имеет неясное значение; возможно: «их храбрецы», а более буквально — «их люди Ариэля» или «их львы Божьи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «послы мира», «мирные посланцы». В контексте, вероятно, имеются в виду посланники, ведущие переговоры о мире.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Указательно-восклицательная частица привлекает внимание к внезапно представленной картине; «вот» естественно передаёт её силу в современном литературном русском.
- source_word: אֶרְאֶלָּם
  choice: их герои
  rationale: Редкое и спорное слово в данном контексте, вероятнее всего, обозначает выдающихся храбрецов или воинов; местоименный суффикс передан словом «их». Неопределённость отражена в сноске.
- source_word: צָעֲקוּ
  choice: кричат
  rationale: Глагол обозначает громкий крик, особенно крик бедствия. Настоящее время сохраняет живость пророческой картины.
- source_word: חֻצָה
  choice: снаружи
  rationale: Наречие указывает на пространство вне дома или иного внутреннего места. «Снаружи» сохраняет пространственную широту исходного выражения, не уточняя его до городских улиц.
- source_word: מַלְאֲכֵי שָׁלוֹם
  choice: посланники мира
  rationale: מַלְאָך может означать вестника или посланника; в контексте сорвавшихся переговоров речь, вероятно, идёт о людях, посланных ради мира. Буквально прозрачное выражение не устраняет дипломатический оттенок.
- source_word: מַר
  choice: горько
  rationale: Прилагательное употреблено наречно и характеризует плач; русское «горько плачут» точно и естественно.
- source_word: יִבְכָּיוּן
  choice: плачут
  rationale: Имперфект допускает настоящее или будущее осмысление; настоящее время согласуется с живым изображением сцены и параллельным «кричат».
theological_decisions:
- issue: Кого обозначает אֶרְאֶלָּם
  choice: людей-героев или храбрецов
  alternative: «люди Ариэля», «львы Божьи» либо иное связанное с Ариэлем обозначение
  rationale: Контекст разорения, неудавшейся дипломатии и общественного плача поддерживает понимание как человеческих защитников или выдающихся воинов. Поскольку форма редка и её значение неясно, альтернативы не исключены и указаны в сноске.
translation_notes:
  register: Современный литературный русский с лаконичным, возвышенным ритмом пророческой поэзии. Настоящее время создаёт живую сцену. Точка с запятой сохраняет параллелизм двух строк; спорные значения не сглажены и вынесены в сноски.
