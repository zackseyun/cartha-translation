  text: נִשְׂגָּ֣ב יְהוָ֔ה כִּ֥י שֹׁכֵ֖ן מָר֑וֹם מִלֵּ֣א צִיּ֔וֹן מִשְׁפָּ֖ט וּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/005.yaml
  text: Yahweh is exalted[a], for he dwells on high; he has filled Zion with justice and righteousness.
translation:
  language: ru
  text: Возвышен Яхве, ибо Он обитает на высоте; Он наполнил Сион правосудием и праведностью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשְׂגָּב
  choice: Возвышен
  rationale: Передаёт стативное значение формы и одновременно сохраняет образ высоты и смысл величия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: כִּי
  choice: ибо
  rationale: Вводит основание предшествующего утверждения и уместно в возвышенной поэтической речи.
- source_word: שֹׁכֵן מָרוֹם
  choice: Он обитает на высоте
  rationale: Сохраняет значение постоянного пребывания и пространственный образ возвышенного места.
- source_word: מִלֵּא
  choice: Он наполнил
  rationale: Совершенный вид передаёт завершённое действие, результат которого сохраняется.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Общепринятая русская форма библейского топонима.
- source_word: מִשְׁפָּט
  choice: правосудием
  rationale: В сочетании с צְדָקָה обозначает справедливый общественный и судебный порядок; «правосудие» сохраняет отличие от следующего понятия.
- source_word: צְדָקָה
  choice: праведностью
  rationale: Передаёт нравственную правоту и не сливает оба члена устойчивой смысловой пары.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Сочетание מִשְׁפָּט וּצְדָקָה
  choice: правосудием и праведностью
  alternative: справедливостью и праведностью; судом и правдой
  rationale: 'Раздельная передача терминов сохраняет широту пары: справедливое устроение и нравственную правоту.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, поэтическим звучанием. Синтаксический параллелизм еврейского стиха сохранён; заглавная буква в местоимении «Он» поддерживает принятый благоговейный регистр.
