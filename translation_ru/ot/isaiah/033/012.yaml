lexical_decisions:
- source_word: וְהָיוּ
  choice: И станут
  rationale: Глагол היה с именной частью сказуемого здесь выражает переход в новое состояние как итог суда; «станут» передаёт это естественно и кратко.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число сохраняет широкий коллективный смысл еврейского עַמִּים без сужения до конкретных государств.
- source_word: מִשְׂרְפוֹת שִׂיד
  choice: словно известь в печи
  rationale: 'Буквальное сочетание необычно и сжато: речь об обжиге извести. Русская формулировка сохраняет образ огненного уничтожения, но делает его понятным; сравнительность метафоры выражена словом «словно».'
- source_word: קוֹצִים כְּסוּחִים
  choice: словно срубленный терновник
  rationale: קוֹצִים обозначает колючий кустарник или терновник, а כְּסוּחִים — срезанный или срубленный. Собирательное единственное число естественно для русской поэзии и передаёт образ сухого топлива.
- source_word: בָּאֵשׁ
  choice: в огне
  rationale: Предлог естественно понимается локативно и продолжает образ терновника, охваченного огнём.
- source_word: יִצַּתּוּ
  choice: вспыхнут
  rationale: Глагол допускает оттенок «загорятся, будут зажжены». «Вспыхнут» сохраняет образ воспламенения и не сводит его исключительно к результату полного сгорания.
