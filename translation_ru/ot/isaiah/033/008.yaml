base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/008.yaml
  text: The highways lie desolate[a]; the traveler has ceased from the road. He has broken the covenant, despised the cities[b], and regarded no man.
translation:
  language: ru
  text: Главные дороги опустели, путники больше не ходят. Он нарушил завет, презрел города[a] и ни во что не ставил человека[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых древних переводах — «презрел свидетелей»; в масоретском еврейском тексте — «города».
    reason: textual_variant
  - marker: b
    text: Евр. ʾэнош — «человек», то есть смертный человек; здесь слово имеет обобщающее значение.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ מְסִלּוֹת
  choice: Большие дороги опустели
  rationale: נָשַׁמּוּ передаёт наступившее запустение, а מְסִלּוֹת обозначает крупные, общественные дороги. «Большие дороги» звучит естественнее современного технического «магистрали» и сохраняет масштаб образа.
- source_word: שָׁבַת עֹבֵר אֹרַח
  choice: путники больше не ходят
  rationale: Буквально речь о прекращении движения проходящего дорогой. Русское множественное обобщение естественно выражает отсутствие путников, не меняя смысла еврейской конструкции.
- source_word: הֵפֵר בְּרִית
  choice: Он нарушил завет
  rationale: הֵפֵר означает нарушение или расторжение обязательства, а בְּרִית — завет либо договор. Сохранено ключевое библейское слово «завет», поскольку сам стих не требует сужать значение до политического договора.
- source_word: מָאַס עָרִים
  choice: презрел города
  rationale: Масоретский текст прямо читает עָרִים, «города». Глагол מָאַס здесь передан как «презрел», что выражает не только отказ, но и пренебрежение.
- source_word: לֹא חָשַׁב אֱנוֹשׁ
  choice: ни во что не ставит человека
  rationale: Идиома выражает полное отсутствие уважения или внимания. «Человека» сохраняет единственное число אֱנוֹשׁ и его значение смертного человеческого существа; русское выражение естественно передаёт силу отрицания.
theological_decisions:
- issue: Неуказанный субъект глаголов во второй половине стиха
  choice: Сохранено неопределённое «он»
  alternative: 'Уточнить: «враг», «вероломный» или «нарушитель договора»'
  rationale: В еврейском стихе субъект прямо не назван. Местоимение сохраняет эту контекстуальную неопределённость и не навязывает толкование.
- issue: Обобщающее значение אֱנוֹשׁ
  choice: человека
  alternative: никого; людей; человечество
  rationale: Еврейское слово стоит в единственном числе и обозначает человека как смертное существо. Русское «человека» сохраняет форму источника, оставаясь обобщающим.
- issue: Значение בְּרִית в непосредственном контексте
  choice: завет
  alternative: договор
  rationale: Контекст допускает политическое соглашение, однако слово имеет более широкий заветный диапазон. Основной текст не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Первая строка передана естественно, без архаизма «путь прекратился»; во второй сохранены краткие резкие утверждения и неуказанный мужской субъект.
