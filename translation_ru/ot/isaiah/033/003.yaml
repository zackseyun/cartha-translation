  yaml_path: translation/ot/isaiah/033/003.yaml
  text: At the sound of the tumult[a], peoples fled; at your rising up[b], nations were scattered.
translation:
  language: ru
  text: От шума смятения[a] бежали народы; когда Ты восстал[b], народы рассеялись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «От грохота».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «при Твоём возвышении». Еврейское выражение может указывать как на то, что Бог восстаёт, чтобы действовать, так и на Его возвышенное величие.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִקּוֹל הָמוֹן
  choice: От звука грохота
  rationale: מִן при קוֹל указывает на причину или повод, а הָמוֹן здесь естественнее всего обозначает громкий шум, гул или смятение. «От звука грохота» передаёт причинную связь и военную образность, не сводя слово к значению «множество».
- source_word: נָדְדוּ
  choice: бежали
  rationale: Хотя глагол может означать движение или скитание, в контексте устрашения враждебных народов он описывает бегство.
- source_word: עַמִּים
  choice: народы
  rationale: «Народы» — обычное соответствие עַמִּים; последующее גּוֹיִם передано иначе, насколько это допускает естественный русский язык.
- source_word: מֵרוֹמְמֻתֶךָ
  choice: когда Ты восстал
  rationale: Форма от רום допускает значения возвышения и поднятия. В контексте вероятен образ Бога, восстающего для действия; временное «когда» естественно передаёт реакцию народов. Неоднозначность отмечена в сноске.
- source_word: נָפְצוּ
  choice: рассеялись
  rationale: Для множества людей или народов глагол здесь вероятнее означает рассеивание, хотя в иных контекстах может выражать разбивание или сокрушение.
- source_word: גּוֹיִם
  choice: племена
  rationale: «Племена» позволяет стилистически различить גּוֹיִם и предшествующее עַמִּים без привнесения позднейшего противопоставления «язычников» и Божьего народа.
theological_decisions:
- issue: К кому относится местоименный суффикс во фразе מֵרוֹמְמֻתֶךָ
  choice: 'Обращение к Богу: «когда Ты восстал»'
  alternative: 'Обращение к олицетворённому Сиону или Иерусалиму; либо акцент на Божьем величии: «при Твоём возвышении»'
  rationale: Ближайший контекст говорит о вмешательстве Господа против враждебных народов. Прописная буква отражает наиболее вероятного адресата, а сноска сохраняет смысловую возможность «возвышения» и не устраняет напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским ритмом. Параллелизм двух полустиший сохранён; заглавное «Ты» обозначает наиболее вероятное обращение к Богу.
