  yaml_path: translation/ot/isaiah/033/024.yaml
  text: And no inhabitant will say[a], “I am sick”; the people who dwell there are forgiven their iniquity.
translation:
  language: ru
  text: 'И ни один житель не скажет: «Я болен»; народу, живущему там, прощено беззаконие.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «снято беззаконие», «унесена вина». Буквальный образ еврейского выражения — беззаконие (или вина), которое несут, уносят или снимают.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַל יֹאמַר שָׁכֵן
  choice: И ни один житель не скажет
  rationale: Союз וּ сохранён как «и», сильное отрицание בַל передано конструкцией «ни один… не», а имперфект יֹאמַר — будущим временем в контексте пророческого обещания. שָׁכֵן обозначает жителя, пребывающего в городе.
- source_word: חָלִיתִי
  choice: Я болен
  rationale: Форма от חלה выражает состояние болезни или немощи; настоящее время естественно звучит в прямой речи и передаёт достигшее состояние.
- source_word: הָעָם הַיֹּשֵׁב בָּהּ
  choice: народу, живущему там
  rationale: Собирательное הָעָם передано как «народ», а причастие единственного числа согласовано с ним. Местоименный суффикс женского рода относится к городу/Сиону; «там» естественно передаёт местное значение без навязывания олицетворения.
- source_word: נְשֻׂא עָוֺן
  choice: прощено беззаконие
  rationale: Пассивное причастие נשׂא в сочетании с עָוֺן образует идиому снятия или прощения вины. Формулировка сохраняет «беззаконие» как грамматический субъект и не превращает пассивную конструкцию в указание на не названного в стихе деятеля.
theological_decisions:
- issue: Связь отсутствия болезни с прощением беззакония
  choice: Обе милости поставлены рядом как блага восстановленного Сиона, без утверждения прямой причинной связи между каждой болезнью и личным грехом.
  alternative: Понимать болезнь только метафорически либо усматривать однозначную связь всякой личной болезни с личным грехом.
  rationale: Еврейский текст сополагает телесное благополучие и снятие беззакония, но прямо не объясняет причинное отношение между ними.
- issue: Значение נְשֻׂא עָוֺן
  choice: В основном тексте передать идиоматический смысл как «прощено беззаконие», а буквальный образ снятия/унесения сохранить в сноске.
  alternative: 'Перевести непосредственно: «беззаконие снято» или «вина унесена».'
  rationale: Такой выбор понятен современному читателю, одновременно сноска сохраняет образность и семантическую широту еврейской идиомы.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Синтаксический параллелизм двух благословений сохранён; архаизмы и конфессионально окрашенные уточнения не вводятся.
