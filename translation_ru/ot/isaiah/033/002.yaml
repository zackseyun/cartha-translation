  text: יְהוָ֥ה חָנֵּ֖/נוּ לְ/ךָ֣ קִוִּ֑ינוּ הֱיֵ֤ה זְרֹעָ/ם֙ לַ/בְּקָרִ֔ים אַף יְשׁוּעָתֵ֖/נוּ בְּ/עֵ֥ת צָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/002.yaml
  text: O Yahweh[a], be gracious to us; we wait for you. Be our arm every morning, also our salvation in the time of distress.
translation:
  language: ru
  text: Господи, будь милостив к нам! На Тебя мы надеемся. Будь их силой каждое утро и нашим спасением в час бедствия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Будь их мышцей каждое утро», то есть их силой. В еврейском тексте стоит «их», хотя по контексту некоторые понимают это как указание на молящийся народ и переводят: «Будь нашей силой каждое утро».'
    reason: Уточняет буквальный образ еврейского слова «мышца/рука» и сохраняет отмеченное в исходном тексте спорное соотнесение местоимения «их».
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: Традиционная русская передача тетраграмматона в форме прямого обращения; естественна для молитвенного контекста.
- source_word: חָנֵּנוּ
  choice: будь милостив к нам
  rationale: Передаёт повелительную форму חנן и просьбу о благоволении, сохраняя возвышенный, но современный молитвенный регистр.
- source_word: לְךָ קִוִּינוּ
  choice: На Тебя мы надеемся
  rationale: קוה обозначает полное надежды ожидание; русское «надеемся» естественно передаёт доверительное ожидание, тогда как буквальное «ждём Тебя» здесь может звучать уже по смыслу.
- source_word: זְרֹעָם
  choice: их силой
  rationale: Суффикс 3-го лица множественного числа сохранён как «их». Метафорическое «рука» означает силу и действенную защиту; «силой» звучит естественно по-русски, не устраняя смену лица.
- source_word: לַבְּקָרִים
  choice: каждое утро
  rationale: Передаёт повторяющееся значение формы множественного числа «по утрам».
- source_word: אַף יְשׁוּעָתֵנוּ
  choice: а ... нашим спасением
  rationale: אַף имеет добавочное значение, а יְשׁוּעָה сохраняется широким словом «спасение», уместным и для избавления от непосредственной беды.
- source_word: בְּעֵת צָרָה
  choice: в час бедствия
  rationale: Естественная русская формула, точно передающая время нужды, тесноты и бедствия.
theological_decisions:
- issue: Местоименный суффикс в זְרֹעָם
  choice: их силой
  alternative: нашей силой
  rationale: Масоретский текст прямо содержит суффикс 3-го лица множественного числа — «их». Хотя контекст общей молитвы побуждает некоторые переводы сгладить смену лица как «нашей», основной текст сохраняет подлинное напряжение, а вариант указан в примечании.
- issue: Передача образа «руки»
  choice: силой
  alternative: рукой
  rationale: В данном предикативном употреблении «быть чьей-либо рукой» по-русски может ошибочно восприниматься как «быть исполнителем». «Силой» передаёт устойчивое метафорическое значение זְרוֹעַ — мощь и защиту.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенным звучанием. Прямое обращение выделено восклицанием; смена «нам/мы» на «их», присутствующая в еврейском тексте, намеренно сохранена. Местоимения обращения к Богу написаны с прописной буквы согласно распространённой русской библейской традиции.
