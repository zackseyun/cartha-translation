source:
  edition: WLC
  text: כִּ֤י יְהוָה֙ שֹׁפְטֵ֔/נוּ יְהוָ֖ה מְחֹקְקֵ֑/נוּ יְהוָ֥ה מַלְכֵּ֖/נוּ ה֥וּא יוֹשִׁיעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/022.yaml
  text: For Yahweh is our judge[a]; Yahweh is our lawgiver; Yahweh is our king[b]; he will save us.
translation:
  language: ru
  text: Ведь Яхве — наш Судья, Яхве — наш Законодатель, Яхве — наш Царь; Он спасёт нас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предшествующим контекстом, не сводя её к строго причинному «потому что».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя; повтор имени трижды сохранён как важная риторическая структура стиха.
- source_word: שֹׁפְטֵנוּ
  choice: наш Судья
  rationale: Кратко и непосредственно передаёт субстантивированное обозначение Яхве как судьи.
- source_word: מְחֹקְקֵנוּ
  choice: наш Законодатель
  rationale: 'Сохраняет смысл устанавливающего законы и параллельный ряд общественно-царских титулов: Судья, Законодатель, Царь.'
- source_word: מַלְכֵּנוּ
  choice: наш Царь
  rationale: Точно сохраняет монархический образ и параллелизм исходного текста.
- source_word: הוּא
  choice: Он
  rationale: Отдельное личное местоимение сохраняет выраженное в еврейском тексте смысловое ударение перед заключительным обещанием.
- source_word: יוֹשִׁיעֵנוּ
  choice: спасёт нас
  rationale: Прямо передаёт каузативную форму от ישׁע и сохраняет как контекстуальный смысл избавления, так и более широкое богословское звучание спасения.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст трижды употребляет личное имя; транслитерация сохраняет это имя и его риторический повтор, не заменяя его титулом.
- issue: Значение מְחֹקְקֵנוּ
  choice: наш Законодатель
  alternative: наш правитель
  rationale: «Законодатель» сохраняет самостоятельный юридико-властный смысл среднего члена триады и не сливает его с царским титулом.
- issue: Смысл יוֹשִׁיעֵנוּ
  choice: спасёт нас
  alternative: избавит нас
  rationale: «Спасёт» естественно передаёт глагол ישׁע и не ограничивает его значение только немедленным политическим или военным избавлением.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Трёхкратный анафорический повтор «Яхве» и именные сказуемые сохранены. Прописные буквы в титулах подчёркивают их отнесённость к Богу, не изменяя смысла исходного текста.
