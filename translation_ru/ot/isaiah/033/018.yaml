  register: Современный литературный русский язык с сохранением возвышенной библейской интонации. Инверсия «сердце твоё» поддерживает поэтический регистр, оставаясь понятной. Повтор «Где… Где… Где…» и прозрачные описательные конструкции воспроизводят риторическую силу и неоднозначность еврейских причастий.
