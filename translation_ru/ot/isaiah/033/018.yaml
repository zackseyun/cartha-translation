  text: לִבְּ/ךָ֖ יֶהְגֶּ֣ה אֵימָ֑ה אַיֵּ֤ה סֹפֵר֙ אַיֵּ֣ה שֹׁקֵ֔ל אַיֵּ֖ה סֹפֵ֥ר אֶת הַ/מִּגְדָּלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/018.yaml
  text: 'Your heart will meditate on terror: “Where is the scribe? Where is the one who weighs? Where is the one who counts the towers?”[a][b]'
translation:
  language: ru
  text: 'Сердце твоё будет размышлять об ужасе: «Где писец? Где тот, кто взвешивает? Где тот, кто считает башни?»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет обдумывать ужас»; возможно также: «будет тихо говорить об ужасе». Еврейский глагол может обозначать внутреннее раздумье или негромкое проговаривание.'
    reason: lexical_alternative
  - marker: b
    text: «Писец… тот, кто взвешивает… тот, кто считает башни» — вероятно, чужеземные должностные лица, занимавшиеся оценкой имущества, сбором дани или расчётами при осаде.
    reason: cultural_note
lexical_decisions:
- source_word: לִבְּךָ
  choice: сердце твоё
  rationale: «Сердце» сохраняет еврейское обозначение внутреннего человека, включая его мысли и воспоминания; следующий глагол ясно указывает на умственную деятельность.
- source_word: יֶהְגֶּה
  choice: будет размышлять
  rationale: Глагол הגה может обозначать внутреннее размышление, тихое проговаривание или раздумье. В данном контексте естественнее всего значение внутреннего осмысления; русский оборот не сводит его к произнесению вслух.
- source_word: אֵימָה
  choice: об ужасе
  rationale: Существительное обозначает сильный страх, ужас или трепет. «Ужас» передаёт интенсивность слова, не добавляя прямо отсутствующего в еврейском тексте указания на прошлое.
- source_word: אַיֵּה
  choice: где
  rationale: Троекратное повторение «где» сохраняет риторический строй и нарастающую выразительность исходного текста.
- source_word: סֹפֵר
  choice: писец
  rationale: Причастная форма от ספר может обозначать пишущего, ведущего записи или считающего. В первой фразе «писец» естественно передаёт вероятную административную должность, не уточняя её функции сверх текста.
- source_word: שֹׁקֵל
  choice: тот, кто взвешивает
  rationale: Буквальное причастие от שקל означает взвешивающего. Описательный оборот сохраняет образ действия и не превращает вероятную функцию по оценке дани в конкретную должность.
- source_word: סֹפֵר אֶת הַמִּגְדָּלִים
  choice: тот, кто считает башни
  rationale: При прямом дополнении «башни» глагольное значение ספר естественно понимать как «считать». Перевод сохраняет конкретный образ и возможную связь с военной оценкой укреплений.
- source_word: הַמִּגְדָּלִים
  choice: башни
  rationale: Прямое значение слова — «башни». Более широкие варианты вроде «укрепления» были бы контекстуальным истолкованием.
