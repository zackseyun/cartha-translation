source:
  edition: WLC
  text: כִּ֣י אִם שָׁ֞ם אַדִּ֤יר יְהוָה֙ לָ֔/נוּ מְקוֹם נְהָרִ֥ים יְאֹרִ֖ים רַחֲבֵ֣י יָדָ֑יִם בַּל תֵּ֤לֶךְ בּ/וֹ֙ אֳנִי שַׁ֔יִט וְ/צִ֥י אַדִּ֖יר לֹ֥א יַעַבְרֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/021.yaml
  text: But there the majestic Yahweh will be for us a place of rivers[a], of broad streams, where no rowing ship can go[c][b], and no mighty vessel can pass through.
translation:
  language: ru
  text: Но там величественный Яхве будет для нас местом рек и широких потоков[b], по которым не пройдёт гребное судно[c] и не проплывёт могучий корабль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Буквально: «широких руками»; это идиома, обозначающая очень широкие водные пространства.'
    reason: Пояснение древнееврейской идиомы.
  - marker: c
    text: 'Или: «судно на вёслах».'
    reason: Лексическая альтернатива для выражения אֳנִי שַׁיִט.
lexical_decisions:
- source_word: כִּי אִם שָׁם
  choice: Но там
  rationale: Сочетание вводит сильное противопоставление предыдущей угрозе и сохраняет указание на Сион.
- source_word: אַדִּיר יְהוָה
  choice: величественный Яхве
  rationale: אַדִּיר непосредственно характеризует Яхве как величественного и могущественного; личное имя передано транслитерацией.
- source_word: לָנוּ מְקוֹם
  choice: будет для нас местом
  rationale: 'Сохраняется смелая метафора исходного текста: сам Яхве является для народа защитным местом, а не просто подобен ему.'
- source_word: נְהָרִים יְאֹרִים רַחֲבֵי יָדָיִם
  choice: рек, широких потоков
  rationale: Два водных термина различены, а идиома «широкие руками/сторонами» естественно передана как указание на большую ширину потоков.
- source_word: אֳנִי שַׁיִט
  choice: гребное судно
  rationale: Передаёт корабль, движущийся посредством активной навигации, вероятнее всего на вёслах, без чрезмерно узкого исторического уточнения.
- source_word: וְצִי אַדִּיר
  choice: могучий корабль
  rationale: צִי обозначает судно, а אַדִּיר подчёркивает его мощь и внушительность.
- source_word: לֹא יַעַבְרֶנּוּ
  choice: не проплывёт
  rationale: В контексте водных путей естественно обозначает прохождение корабля через них; отрицание сохранено как категорическое.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Яхве как место защитных вод
  choice: будет для нас местом рек
  alternative: будет для нас словно реки
  rationale: Сохранена прямая метафорическая идентификация в еврейском тексте, не ослабленная добавлением сравнения.
- issue: Характер недоступности водных путей
  choice: по которым не пройдёт... и не проплывёт
  alternative: где не ходит... и не проходит
  rationale: Формулировка сохраняет образ защищающих вод, по которым при этом не могут проникнуть вражеские корабли, не объясняя явно, каким образом сочетаются ширина и непроходимость.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Прямая метафора сохранена; архаизмы и чрезмерно техническая морская лексика исключены.
