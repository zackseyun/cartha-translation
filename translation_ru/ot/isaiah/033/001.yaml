base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/001.yaml
  text: Woe to you[a], destroyer, though you yourself have not been destroyed, and betrayer, though they have not betrayed you. When you finish destroying, you will be destroyed; when you cease betraying[c][b], they will betray you.
translation:
  language: ru
  text: Горе тебе, разоритель[a], хотя тебя самого не разоряли, и тебе, предатель, хотя тебя не предавали[b]! Когда ты закончишь разорять, разорят тебя; когда перестанешь предавать[c], предадут тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грабитель… хотя тебя самого не грабили… ограбят тебя». Еврейский корень может обозначать как широкое насильственное разорение, так и разграбление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по еврейскому тексту: «хотя с ним не поступали вероломно». Основной текст следует прямому обращению и параллелизму; возможно и чтение в третьем лице.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «когда закончишь предавать» или «когда перестанешь поступать вероломно». Еврейская конструкция может указывать как на прекращение, так и на завершение действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе тебе
  rationale: Передаёт силу пророческого возгласа, одновременно заключающего в себе обличение и объявление суда; это естественная и традиционная формула на современном литературном русском.
- source_word: שׁוֹדֵד / שָׁדוּד / תּוּשַּׁד
  choice: разоритель / разоряли / разорят
  rationale: Корень שׁדד обозначает насильственное разорение, опустошение или разграбление. Единый русский корень сохраняет словесный повтор и мотив возмездия; возможный более узкий смысл грабежа указан в сноске.
- source_word: בּוֹגֵד / בגד
  choice: вероломный / поступать вероломно
  rationale: Передаёт повторяющуюся идею предательского, коварного нарушения верности и позволяет сохранить лексический повтор без неестественного русского обращения «предатель» в каждом члене фразы.
- source_word: בָגְדוּ בוֹ
  choice: с тобой не поступали вероломно
  rationale: Основной текст продолжает прямое обращение и сохраняет параллелизм стиха. Масоретское местоимение буквально имеет значение «с ним», поэтому формальная неоднозначность отмечена в сноске.
- source_word: כַּהֲתִמְךָ
  choice: когда ты закончишь
  rationale: Естественно выражает временное значение конструкции и завершение действия разорителя, не добавляя лишней аспектуальной определённости.
- source_word: כַּנְּלֹתְךָ לִבְגֹּד
  choice: когда перестанешь поступать вероломно
  rationale: Передаёт прекращение или доведение вероломного поведения до конца; альтернативное понимание «закончишь» сохранено в сноске.
theological_decisions:
- issue: Лицо местоимения в וְלֹא בָגְדוּ בוֹ
  choice: 'В основном тексте — второе лицо: «с тобой не поступали вероломно»'
  alternative: 'Буквальное третье лицо: «с ним не поступали вероломно»'
  rationale: Контекст представляет собой прямое обращение к разорителю, и второе лицо поддерживает параллелизм; однако масоретскую форму третьего лица нельзя скрывать, поэтому она приведена в сноске без богословского разрешения напряжения.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повторы «разорять» и «поступать вероломно» намеренно сохранены ради еврейского параллелизма и картины ответного возмездия; синтаксис сделан ясным для обычного читателя без устранения текстовой неоднозначности.
