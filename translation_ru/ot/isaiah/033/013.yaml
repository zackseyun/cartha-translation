  text: Слушайте, далёкие, что Я совершил; и познайте, близкие, Мою мощь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения во множественном числе от שׁמע. «Слушайте» естественно передаёт прямой призыв и в данном контексте включает требование услышать и принять к сведению.
- source_word: רְחוֹקִים
  choice: далёкие
  rationale: Прилагательное мужского рода во множественном числе употреблено субстантивированно как обращение к находящимся вдали; краткая форма сохраняет поэтический параллелизм с «близкие».
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: что Я совершил
  rationale: Относительная частица с перфектом 1-го лица единственного числа указывает на завершённое действие. «Совершил» звучит достойно и передаёт значительное деяние в пророческом контексте.
- source_word: וּדְעוּ
  choice: и познайте
  rationale: Повелительная форма множественного числа от ידע. «Познайте» сохраняет смысл осознанного знания и параллель с призывом «слушайте», не усиливая его до «признайте».
- source_word: קְרוֹבִים
  choice: близкие
  rationale: Субстантивированное прилагательное во множественном числе, параллельное רְחוֹקִים. Передаёт обращение к находящимся близко без уточнения, которого нет в еврейском тексте.
- source_word: גְּבֻרָתִי
  choice: Мою мощь
  rationale: גְּבוּרָה обозначает силу, могущество или мощь. «Мощь» сохраняет абстрактное значение существительного и соответствует контексту явленного могущественного действия.
theological_decisions:
- issue: Кто говорит от первого лица
  choice: Сохранить формы первого лица без добавления имени говорящего
  alternative: Явно добавить «Господь»
  rationale: По контексту говорящий — Господь, однако в самой строке Его имя отсутствует. Добавление имени устранило бы сохранённую в форме текста неявность.
- issue: Значение גְּבֻרָתִי
  choice: «Мою мощь» как обозначение присущего говорящему могущества
  alternative: «Моё могучее деяние»
  rationale: Контекст допускает связь мощи с совершённым деянием, но еврейское абстрактное существительное не требует превращать его в обозначение отдельного поступка.
translation_notes:
  register: Современный литературный русский язык с лаконичным пророческим звучанием. Субстантивированные обращения «далёкие» и «близкие» сохраняют симметрию и широту еврейского текста. Прописные буквы в местоимениях первого лица отражают контекстуальное отнесение речи к Богу, не добавляя отсутствующего в строке имени.
