  text: פָּחֲד֤וּ בְ/צִיּוֹן֙ חַטָּאִ֔ים אָחֲזָ֥ה רְעָדָ֖ה חֲנֵפִ֑ים מִ֣י יָג֣וּר לָ֗/נוּ אֵ֚שׁ אוֹכֵלָ֔ה מִי יָג֥וּר לָ֖/נוּ מוֹקְדֵ֥י עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/014.yaml
  text: 'Sinners in Zion are afraid[d][c][b][a]; trembling has seized the godless: “Who among us can dwell with a consuming fire? Who among us can dwell with everlasting burnings?”'
translation:
  language: ru
  text: 'Грешники на Сионе испугались; трепет охватил нечестивых[a]: «Кто из нас сможет обитать при пожирающем огне[b]? Кто из нас сможет обитать при вечных горениях[c]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лицемеров». Еврейское слово может обозначать безбожных, порочных или нечестивых людей, а не только неискренних.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жить при пожирающем огне». Образ пожирающего огня перекликается с библейским описанием святого и судящего присутствия Бога; ср. Втор. 4:24; Евр. 12:29.'
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: 'Или: «вечном пламени», «вечных пожарищах» или «неугасающем пламени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּחֲדוּ בְצִיּוֹן חַטָּאִים
  choice: Грешники на Сионе испугались
  rationale: Перфект выражает наступивший страх; прошедшее время естественно передаёт событие в данном пророческом контексте. Предлог בְ передан местным оборотом «на Сионе», нормативным для русского названия Сион.
- source_word: אָחֲזָה רְעָדָה
  choice: трепет охватил
  rationale: 'Сохранён конкретный образ: дрожь или трепет овладевает людьми. «Трепет» соответствует возвышенной поэтической речи, оставаясь понятным современному читателю.'
- source_word: חֲנֵפִים
  choice: нечестивых
  rationale: Здесь слово обозначает людей безбожных, порочных или чуждых благочестию, а не обязательно лицемеров. «Нечестивые» сохраняет широкий нравственно-религиозный смысл.
- source_word: מִי יָגוּר לָנוּ
  choice: Кто из нас сможет жить
  rationale: גור допускает значения временного пребывания и проживания. Вопрос касается возможности оставаться в присутствии губительного огня; «жить» естественно передаёт продолжительное пребывание, а לָנוּ — коллективное «из нас».
- source_word: אֵשׁ אוֹכֵלָה
  choice: огне пожирающем
  rationale: Причастие אוֹכֵלָה буквально рисует огонь, который пожирает. Такой перевод сохраняет метафорическую силу и не сводит образ заранее к одной богословской трактовке.
- source_word: מוֹקְדֵי עוֹלָם
  choice: вечном пламени
  rationale: Сочетание обозначает неугасающие очаги, горения или языки пламени. Единственное собирательное «пламя» звучит по-русски естественно, а «вечное» передаёт עוֹלָם без уточнения природы или места этого огня.
theological_decisions:
- issue: К чему относятся пожирающий огонь и вечное пламя
  choice: В основном тексте сохранены образы огня без прямого отождествления; в контексте они указывают на грозную святость и судящее присутствие Бога.
  alternative: Образы могут пониматься уже — как огонь Божьего суда над нечестивыми — либо связываться с огнём Сиона и его жертвенника.
  rationale: Следующий стих отвечает, кто способен обитать в таких условиях, описывая праведника. Это поддерживает связь с присутствием Бога, однако сам стих говорит метафорически, поэтому перевод не устраняет напряжение и не вводит позднейшие догматические категории.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Синтаксический параллелизм двух вопросов сохранён. Формы «пожирающем» и «вечном» поддерживают торжественный регистр без архаизации; двоеточие и кавычки ясно отделяют речь охваченных страхом людей.
