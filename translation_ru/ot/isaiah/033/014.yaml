  source_fidelity: 'Основной смысл передан точно: פחד выражен как наступивший страх, רעדה — как охвативший трепет, חנפים — в уместном широком значении «нечестивые». Два параллельных вопроса и образ опасного огня сохранены. Однако множественное число מוֹקְדֵי («горения, пламени») в основном тексте лучше сохранить, не сводя его к единственному «пламени».'
