  text: אֶת עַ֥ם נוֹעָ֖ז לֹ֣א תִרְאֶ֑ה עַ֣ם עִמְקֵ֤י שָׂפָה֙ מִ/שְּׁמ֔וֹעַ נִלְעַ֥ג לָשׁ֖וֹן אֵ֥ין בִּינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/019.yaml
  text: You will no longer see the insolent people[a], a people of speech too deep to understand[c][b], of a stammering tongue without comprehension.
translation:
  language: ru
  text: Ты больше не увидишь дерзкий народ[a], народ с речью, слишком трудной для понимания на слух[b], с невнятным языком, которого не понять[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свирепого народа»; или: «непокорного народа».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «народа, глубокого устами для слышания», то есть народа, чью речь слушатель не может понять.'
    reason: lexical_alternative
  - marker: c
    text: 'Выражение на еврейском неясно. Возможны переводы: «с запинающимся языком», «с насмешливым языком» или «с чужеземным языком». Вероятно, имеется в виду иностранная речь, непонятная слушателю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹעָז
  choice: дерзкого
  rationale: Передаёт вызывающую, устрашающую смелость народа; при этом сохраняется возможность понимать слово как «свирепый» или «непокорный».
- source_word: תִרְאֶה
  choice: ты больше не увидишь
  rationale: Основное значение глагола — «видеть»; в контексте отрицание означает, что адресату больше не придётся сталкиваться с этим народом.
- source_word: עִמְקֵי שָׂפָה
  choice: с речью, слишком непонятной для слуха
  rationale: Буквально «глубокий устами»; идиома описывает речь, недоступную пониманию слушателя. Формулировка сохраняет связь последующего מִשְּׁמוֹעַ со слуховым восприятием.
- source_word: מִשְּׁמוֹעַ
  choice: для слуха
  rationale: Сохраняет буквальную связь с «слышанием», одновременно выражая невозможность понять услышанное.
- source_word: נִלְעַג לָשׁוֹן
  choice: с невнятным языком
  rationale: Трудное выражение в параллелизме указывает на чужую речь, которая звучит неразборчиво; «невнятный» не приписывает говорящим буквального дефекта речи.
- source_word: אֵין בִּינָה
  choice: которого не понять
  rationale: Передаёт отсутствие понятности для слушателя естественным русским оборотом, не утверждая, будто у говорящего отсутствует разумение.
- source_word: עַם ... עַם
  choice: народа ... народа
  rationale: Повтор сохранён ради еврейского синтаксического акцента и связи двух характеристик одного народа.
