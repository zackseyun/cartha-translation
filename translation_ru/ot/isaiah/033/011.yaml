  text: תַּהֲר֥וּ חֲשַׁ֖שׁ תֵּ֣לְדוּ קַ֑שׁ רוּחֲ/כֶ֕ם אֵ֖שׁ תֹּאכַלְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/011.yaml
  text: You conceive chaff; you give birth to stubble[a]. Your breath is a fire that will consume you.
translation:
  language: ru
  text: Вы зачинаете мякину, рождаете солому. Ваше дыхание — огонь, который пожрёт вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ваш дух — огонь, который пожрёт вас». Еврейское רוּחַ может означать «дыхание», «ветер» или «дух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּהֲרוּ
  choice: вы зачинаете
  rationale: Форма Qal, 2-е лицо множественного числа, сохраняет образ зачатия, который продолжается глаголом «рождаете».
- source_word: חֲשַׁשׁ
  choice: мякину
  rationale: Слово обозначает лёгкий сухой растительный материал, легко воспламеняющийся; «мякина» естественно передаёт образ никчёмности и горючести.
- source_word: תֵּלְדוּ
  choice: рождаете
  rationale: Буквально передаёт роды и сохраняет параллель «зачинаете — рождаете».
- source_word: קַשׁ
  choice: солому
  rationale: Обычное значение — солома или сухие остатки стеблей; «солома» ясно сочетается с мякиной и образом огня.
- source_word: רוּחֲכֶם
  choice: ваше дыхание
  rationale: רוּחַ допускает значения «дыхание», «ветер» и «дух». «Дыхание» сохраняет конкретность образа и не устраняет его смысловую многозначность, отмеченную в сноске.
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое и естественное соответствие еврейскому слову.
- source_word: תֹּאכַלְכֶם
  choice: пожрёт вас
  rationale: Глагол אכל буквально означает «есть, пожирать»; при огне как подлежащем «пожрёт» естественно и выразительно сохраняет силу исходного образа.
theological_decisions:
- issue: Значение רוּחֲכֶם в образе суда
  choice: ваше дыхание
  alternative: ваш дух; ваш ветер
  rationale: Основной текст сохраняет зримый образ того, что исходит от самих адресатов и становится причиной их гибели. Возможное значение «дух» не исключено, а вынесено в сноску без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного пророческого параллелизма и резкой образности суда. «Зачинаете мякину, рождаете солому» намеренно сохраняет необычную метафору оригинала.
