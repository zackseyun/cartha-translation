source:
  edition: WLC
  text: אֹמַ֤ר לַ/צָּפוֹן֙ תֵּ֔נִי וּ/לְ/תֵימָ֖ן אַל תִּכְלָ֑אִי הָבִ֤יאִי בָנַ/י֙ מֵ/רָח֔וֹק וּ/בְנוֹתַ֖/י מִ/קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/006.yaml
  text: I will say to the north[a], ‘Give them up,’ and to the south, ‘Do not hold them back.’ Bring my sons from far away[b], and my daughters from the end of the earth.
translation:
  language: ru
  text: 'Я скажу северу: «Отдай[a]», и югу: «Не удерживай». Приведи моих сыновей издалека и моих дочерей — с края земли[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Отдай»; объект в еврейском тексте не выражен и по контексту обозначает рассеянный Божий народ. То же относится к повелению «не удерживай».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте слово «край» стоит в единственном числе; также возможно более привычное по-русски: «с краёв земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Я скажу
  rationale: Имперфект qal, 1-е лицо единственного числа, в этом пророческом провозглашении естественно передаётся будущим временем.
- source_word: לַצָּפוֹן
  choice: северу
  rationale: Название стороны света персонифицировано и выступает адресатом Божьего повеления.
- source_word: תֵּנִי
  choice: Отдай
  rationale: Императив женского рода единственного числа; объект в еврейском тексте не назван, поэтому и в переводе он оставлен подразумеваемым.
- source_word: וּלְתֵימָן
  choice: и югу
  rationale: В параллели с «севером» תֵּימָן обозначает юг, а не эдомский город Феман.
- source_word: אַל תִּכְלָאִי
  choice: Не удерживай
  rationale: Отрицательное повеление передаёт запрет удерживать рассеянный народ; объект, как и в еврейском тексте, остаётся подразумеваемым.
- source_word: הָבִיאִי
  choice: Приведи
  rationale: Императив hiphil единственного числа означает побуждение привести или доставить названных далее сыновей и дочерей.
- source_word: בָנַי
  choice: моих сыновей
  rationale: Сохранено конкретное значение существительного мужского рода во множественном числе и его параллелизм с «дочерьми».
- source_word: מֵרָחוֹק
  choice: издалека
  rationale: Наречное выражение расстояния естественно и точно передаётся современным русским словом «издалека».
- source_word: וּבְנוֹתַי
  choice: и моих дочерей
  rationale: Сохранено конкретное значение существительного женского рода во множественном числе и явная парность с «сыновьями».
- source_word: מִקְצֵה הָאָרֶץ
  choice: с края земли
  rationale: Сохранено единственное число קָצֶה — «край, предел»; предлог «с» естественно выражает исходное удаление от края земли.
theological_decisions:
- issue: К кому обращены повеления северу и югу
  choice: Север и юг представлены как персонифицированные области, которым Бог повелевает отпустить и привести Его рассеянный народ.
  alternative: Север и юг понимаются только как безличные космические силы, без конкретной связи с возвращением рассеянного Израиля.
  rationale: Ближайший контекст говорит о восстановлении и собирании Израиля, а выражения «моих сыновей» и «моих дочерей» прямо указывают, кого следует привести.
translation_notes:
  register: Современный литературный русский язык с краткими, торжественными повелениями. Персонификация сторон света сохранена; явный гендерный параллелизм «сыновей — дочерей» и единственное число в выражении «край земли» не сглажены.
