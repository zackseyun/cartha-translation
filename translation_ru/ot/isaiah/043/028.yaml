base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/028.yaml
  text: So I profaned the princes of the sanctuary[a], and I gave Jacob over to destruction, and Israel to reviling.
translation:
  language: ru
  text: И Я осквернил начальников святилища, предал Иакова истреблению[a], а Израиль — поруганию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предал под заклятие». Еврейское חֵרֶם означает то, что в силу Божьего суда предано заклятию и уничтожению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחַלֵּל
  choice: И Я осквернил
  rationale: Пиэль глагола חלל означает сделать несвятым, осквернить, лишить сакрального статуса. «Осквернил» сохраняет культовый смысл; форма с וַ передаёт совершившееся действие в контексте суда.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: начальников святилища
  rationale: שָׂרֵי обозначает начальников, предводителей или высокопоставленных лиц, а конструкция с קֹדֶשׁ связывает их со священной сферой. Перевод не уточняет их как священников, поскольку в еврейском тексте этого прямо нет.
- source_word: וְאֶתְּנָה
  choice: предал
  rationale: נתן буквально означает «дать», но в данном контексте суда естественно передаётся как «предать, отдать во власть».
- source_word: לַחֵרֶם
  choice: истреблению
  rationale: חֵרֶם здесь обозначает предание под заклятие ради уничтожения как акт Божьего суда. «Истреблению» ясно передаёт результат, а особое понятие заклятия отмечено в сноске.
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Сохранено традиционное русское написание имени; здесь оно метонимически обозначает народ.
- source_word: וְיִשְׂרָאֵל
  choice: а Израиль
  rationale: Традиционная форма имени сохранена. Союз «а» естественно оформляет параллельную вторую строку поэтического высказывания.
- source_word: לְגִדּוּפִים
  choice: поруганию
  rationale: גדופים означает оскорбления, поношение, насмешки. Русское собирательное единственное число «поруганию» естественно передаёт участь Израиля как объекта публичного поношения, не придавая слову узкого значения богохульства.
theological_decisions:
- issue: Характер суда в слове חֵרֶם
  choice: предал Иакова истреблению
  alternative: предал Иакова заклятию / обрёк Иакова на уничтожение
  rationale: Суровость судебного высказывания сохранена без смягчения. При этом основная строка остаётся понятной современному читателю, а связь с понятием заклятия сохраняется в сноске.
- issue: Кого обозначает שָׂרֵי קֹדֶשׁ
  choice: начальники святилища
  alternative: святые князья / священники
  rationale: Перевод связывает этих руководителей со святилищем, но не называет их священниками, чего еврейский текст прямо не говорит, и не превращает конструкцию в утверждение об их личной святости.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм сохранён; устаревшие «князья святыни» и неясное без пояснения «заклятие» не вынесены в основной текст.
