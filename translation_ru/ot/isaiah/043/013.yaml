base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/013.yaml
  text: Indeed[a], from that day on I am he, and there is none who can deliver from my hand; I act[b], and who can turn it back?
translation:
  language: ru
  text: Да, с того дня Я — Он[a]. Никто не может избавить из Моей руки. Я действую — и кто обратит это вспять?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение кратко и допускает также переводы: «отныне», «издревле» или, более истолковательно, «от вечности».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «кто отменит это?» Буквально: «кто повернёт это назад?» — то есть кто сможет обратить Божье действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Да
  rationale: В данном контексте частица усиливает последующее утверждение; русское «Да» естественно передаёт торжественное подтверждение, а не простое присоединение.
- source_word: מִיּוֹם
  choice: с того дня
  rationale: Краткое еврейское выражение буквально означает «от дня» и допускает несколько временных толкований. «С того дня» передаёт продолжительность от некоторой временной точки, не вводя в основной текст утверждение о вечности.
- source_word: אֲנִי הוּא
  choice: Я — Тот же
  rationale: Весомая формула самоотождествления сохранена как самостоятельное утверждение. «Тот же» по-русски звучит естественнее буквального «Я — Он», сохраняя акцент на неизменной и уникальной личности Бога.
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: Никто не может избавить от Моей руки
  rationale: Передаёт отрицательную конструкцию с причастием в естественной русской форме и сохраняет образ руки как власти и обладания.
- source_word: אֶפְעַל
  choice: Я действую
  rationale: Глагол פעל обозначает совершение действия или дела; настоящее время здесь выражает непререкаемую действенность Божьих решений.
- source_word: יְשִׁיבֶנָּה
  choice: обратит это вспять
  rationale: Порода hifil глагола שוב означает заставить вернуться, повернуть назад. Выражение «обратить вспять» сохраняет образ отмены или обращения Божьего действия.
theological_decisions:
- issue: Временной охват מִיּוֹם
  choice: с того дня
  alternative: отныне; издревле; от начала дней
  rationale: Еврейская фраза предельно кратка и не уточняет временную точку. Основной текст не превращает её в недвусмысленное метафизическое утверждение о вечности, а сноска сохраняет реальные варианты понимания.
- issue: Формула самоотождествления אֲנִי הוּא
  choice: Я — Тот же
  alternative: Я — Он; Я есть
  rationale: Выбранная формулировка сохраняет особую богословскую весомость утверждения в книге Исаии, но не навязывает ему позднейшую догматическую терминологию.
- issue: Неотвратимость Божьего действия
  choice: кто обратит это вспять?
  alternative: кто отменит это?
  rationale: Риторический вопрос утверждает невозможность отменить Божье действие; образное выражение сохраняет конкретность еврейского глагола, не уточняя сверх текста характер этого действия.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавные местоимения относятся к Богу в соответствии с русской издательской традицией. Образ «руки» сохранён, а синтаксис сделан естественным для устного и письменного чтения.
