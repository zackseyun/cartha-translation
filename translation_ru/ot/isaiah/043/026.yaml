lexical_decisions:
- source_word: הַזְכִּירֵנִי
  choice: Напомни Мне
  rationale: Побудительная форма породы hифиль от זכר с суффиксом 1-го лица единственного числа означает «напомни Мне». Формулировка естественна по-русски и сохраняет прямой вызов собеседнику.
- source_word: נִשָּׁפְטָה
  choice: давай рассудимся
  rationale: 'Когортативная форма нифаля от שפט в данном контексте имеет взаимный, судебный смысл: стороны вступают в разбирательство. «Давай рассудимся» передаёт этот смысл естественно и не сводит форму к простому пассиву «будем судимы».'
- source_word: יָחַד
  choice: вместе
  rationale: Наречие указывает на совместное участие сторон в разбирательстве; прямое соответствие «вместе» сохраняет эту взаимность.
- source_word: סַפֵּר
  choice: Изложи своё дело
  rationale: Императив пиэля от ספר может значить «расскажи, изложи, объяви». В судебном контексте «изложи своё дело» ясно передаёт требование представить свои доводы, не меняя характера высказывания.
- source_word: אַתָּה
  choice: подразумеваемое «ты» в форме «изложи»
  rationale: Самостоятельное местоимение усиливает обращение, однако буквальное добавление «ты» после русского императива звучало бы неестественно. Второе лицо однозначно выражено формой глагола.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Обычный целевой союз, вводящий предполагаемую цель или исход.
- source_word: תִּצְדָּק
  choice: оказаться правым
  rationale: Форма qal от צדק в судебном контексте означает оказаться или быть признанным правым. Эта формулировка сохраняет юридический смысл и не привносит более позднюю богословскую терминологию.
theological_decisions:
- issue: Судебный смысл צדק
  choice: оказаться правым
  alternative: быть оправданным; быть признанным правым
  rationale: Речь построена как судебный спор. Перевод «оказаться правым» сохраняет возможность установления правоты, не превращая выражение в специальный термин определённой доктринальной системы.
- issue: Взаимный или пассивный смысл נִשָּׁפְטָה
  choice: давай рассудимся
  alternative: давай вместе вступим в судебное разбирательство; будем судимы вместе
  rationale: Контекст поддерживает взаимное судебное разбирательство, но форма нифаля допускает более формальное понимание вхождения в суд. Основной текст передаёт наиболее естественный контекстуальный смысл, а альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством судебной речи. «Рассудимся» слегка возвышенно, но понятно и уместно для пророческого текста; архаизмы и конфессионально нагруженные формулы в основном тексте исключены.
