  source_fidelity: 'В целом перевод точно передаёт судебный призыв и сохраняет суффикс 1-го лица множественного числа в יַשְׁמִיעֻנוּ: «возвестить нам». Это место в английской контрольной версии передано неполно, но русский текст следует еврейскому оригиналу. Однако «докажут свою правоту» делает народы активными доказателями собственной правоты, тогда как וְיִצְדָּקוּ выражает результат судебного разбирательства: они будут признаны правыми/окажутся правы.'
