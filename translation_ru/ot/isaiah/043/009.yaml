source:
  edition: WLC
  text: כָּֽל הַ/גּוֹיִ֞ם נִקְבְּצ֣וּ יַחְדָּ֗ו וְ/יֵאָֽסְפוּ֙ לְאֻמִּ֔ים מִ֤י בָ/הֶם֙ יַגִּ֣יד זֹ֔את וְ/רִֽאשֹׁנ֖וֹת יַשְׁמִיעֻ֑/נוּ יִתְּנ֤וּ עֵֽדֵי/הֶם֙ וְ/יִצְדָּ֔קוּ וְ/יִשְׁמְע֖וּ וְ/יֹאמְר֥וּ אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/009.yaml
  text: Let all the nations be gathered together[a], and let the peoples be assembled. Who among them can declare this and make the former things heard? Let them present their witnesses, that they may be justified; and let them hear and say[b], “It is true.”
translation:
  language: ru
  text: 'Пусть все народы соберутся вместе,

    пусть соберутся племена.

    Кто из них может объявить об этом

    и возвестить нам о том, что было прежде[a]?

    Пусть они представят своих свидетелей

    и будут признаны правыми[b].

    Пусть услышат и скажут: «Это правда!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о прежнем» или «о первом». Выражение может обозначать прежние события или прежние возвещения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и окажутся правы» или «и будут оправданы». Здесь употреблён судебный язык.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  choice: все народы
  rationale: גּוֹיִם здесь обозначает народы мира, созванные на судебное разбирательство; «язычники» неоправданно сужало бы смысл.
- source_word: נִקְבְּצוּ יַחְדָּו ... וְיֵאָסְפוּ לְאֻמִּים
  choice: пусть ... соберутся вместе, пусть племена сойдутся
  rationale: Формулировка передаёт призыв к всеобщему собранию и сохраняет параллелизм двух близких по смыслу строк. «Племена» отличает לְאֻמִּים от גּוֹיִם, не превращая их в совершенно разные группы.
- source_word: מִי בָהֶם יַגִּיד זֹאת
  choice: кто из них может объявить об этом
  rationale: נגד в породе hифиль означает объявлять или возвещать; «может» естественно выражает подразумеваемый риторический вызов.
- source_word: וְרִאשֹׁנוֹת יַשְׁמִיעֻנוּ
  choice: и возвестить нам о том, что было прежде
  rationale: Суффикс первого лица множественного числа в יַשְׁמִיעֻנוּ передан словом «нам». רִאשֹׁנוֹת сохранено как намеренно широкое указание на прежние события либо прежние возвещения.
- source_word: יִתְּנוּ עֵדֵיהֶם
  choice: пусть они представят своих свидетелей
  rationale: В судебном контексте נתן с «свидетелями» естественно означает представить или выставить свидетелей.
- source_word: וְיִצְדָּקוּ
  choice: и докажут свою правоту
  rationale: 'Фраза ясно передаёт судебный смысл: свидетельские показания должны подтвердить, что сторона права, без привнесения позднейшего богословского термина.'
- source_word: וְיִשְׁמְעוּ וְיֹאמְרוּ אֱמֶת
  choice: 'пусть услышат и скажут: «Это правда!»'
  rationale: Краткая формула сохраняет последовательность еврейских глаголов и естественно передаёт אֱמֶת как признание истинности услышанного.
theological_decisions:
- issue: Судебный смысл וְיִצְדָּקוּ
  choice: и докажут свою правоту
  alternative: и будут оправданы / и окажутся правы
  rationale: Контекст представляет состязание народов и их свидетелей. Выбранная формулировка сохраняет судебную образность, но не вводит специальное учение об оправдании.
- issue: Значение רִאשֹׁנוֹת
  choice: то, что было прежде
  alternative: первое / прежние предсказания
  rationale: Еврейское выражение может относиться как к прежним событиям, так и к прежним возвещениям. Обобщённая формулировка не устраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной судебной интонацией. Поэтический параллелизм сохранён; архаизмы и конфессионально нагруженная терминология избегаются.
