lexical_decisions:
- source_word: אָבִיךָ הָרִאשׁוֹן
  choice: твой праотец
  rationale: Сочетание буквально означает «твой первый отец». В современном русском «праотец» естественно передаёт древнего родоначальника, не определяя, идёт ли речь об Адаме, Аврааме, Иакове или ином предке; неоднозначность пояснена в сноске.
- source_word: חָטָא
  choice: согрешил
  rationale: Обычное и точное соответствие глаголу в нравственно-религиозном контексте.
- source_word: מְלִיצֶיךָ
  choice: твои толкователи
  rationale: Слово допускает значения толкователей, посредников и представителей, говорящих от имени других. «Толкователи» сохраняет основное лексическое значение и не сужает смысл до священнического посредничества; варианты отмечены в сноске.
- source_word: פָּשְׁעוּ בִי
  choice: восстали против Меня
  rationale: Глагол выражает сознательное нарушение верности, мятеж или бунт, а предлог при нём обозначает направленность против Бога. «Восстали против» естественно передаёт эту усиленную силу.
theological_decisions:
- issue: Кого обозначает выражение «твой первый отец»
  choice: Передано обобщённо как «твой праотец», без отождествления с конкретным лицом.
  alternative: Адам, Авраам, Иаков либо другой ранний родоначальник Израиля.
  rationale: Еврейский текст не называет этого человека, поэтому перевод не должен устранять подлинную неопределённость.
- issue: Роль מְלִיצֶיךָ
  choice: «твои толкователи» с указанием иных возможностей в сноске.
  alternative: «твои посредники», «твои представители», «твои ходатаи».
  rationale: Контекст не позволяет уверенно ограничить круг названных лиц священниками или какой-либо одной должностью.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавная буква в «Меня» следует принятой русской библейской традиции при местоименном обозначении Бога. Сноски расставлены непосредственно после тех выражений, которые они поясняют.
