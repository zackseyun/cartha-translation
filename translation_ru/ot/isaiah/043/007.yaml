source:
  edition: WLC
  text: כֹּ֚ל הַ/נִּקְרָ֣א בִ/שְׁמִ֔/י וְ/לִ/כְבוֹדִ֖/י בְּרָאתִ֑י/ו יְצַרְתִּ֖י/ו אַף עֲשִׂיתִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/007.yaml
  text: everyone who is called by my name[a], whom I created for my glory, whom I formed, indeed whom I made.
translation:
  language: ru
  text: каждого, кто назван Моим именем[a], кого Я сотворил для Моей славы, кого Я образовал, да, кого Я создал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «каждого, кто назван Моим именем, и для Моей славы Я сотворил его; образовал его, да, создал его».'
    reason: Сноска сохраняет более близкий к еврейскому порядок слов, единственное число объектных суффиксов и менее тесную синтаксическую связь оборота «для Моей славы» с глаголом «сотворил».
lexical_decisions:
- source_word: כֹּל
  choice: каждого
  rationale: В контексте речь идёт о людях, которых Бог собирает (ст. 5–6). Винительный падеж естественно продолжает призыв «приведи» из предыдущего стиха, а форма единственного числа сохраняет собирательно-распределительный смысл.
- source_word: הַנִּקְרָא
  choice: кто назван
  rationale: Нифаль от קרא здесь означает носить имя, быть названным; это точнее контекстуального «призван» и сохраняет пассивную конструкцию.
- source_word: בִשְׁמִי
  choice: Моим именем
  rationale: 'Оборот נקרא בשם обозначает именование и принадлежность: человек назван Божьим именем.'
- source_word: וְלִכְבוֹדִי
  choice: для Моей славы
  rationale: כבוד здесь выражает Божью славу и честь; предлог ל указывает на цель сотворения.
- source_word: בְּרָאתִיו
  choice: кого Я сотворил
  rationale: ברא передано традиционным и точным глаголом «сотворить»; объектный суффикс выражен относительным местоимением «кого».
- source_word: יְצַרְתִּיו
  choice: кого Я создал
  rationale: יצר означает формировать, придавать облик. «Создал» звучит естественно по-русски и сохраняет отличие от более специального «сотворил», хотя образ формирования становится менее явным.
- source_word: אַף
  choice: и
  rationale: Здесь אַף усиливает заключительное звено последовательности. Русская конструкция «кого Я и сделал» естественно передаёт это усиление.
- source_word: עֲשִׂיתִיו
  choice: кого Я и сделал
  rationale: עשה — широкий глагол «делать, создавать». «Сделал» сохраняет третий, итоговый глагол и не смешивает его с ברא и יצר.
theological_decisions:
- issue: Собирательное единственное число и мужские объектные суффиксы
  choice: Передать כֹּל как «каждого», а суффиксы — повторяющимся «кого», не вводя отдельного местоимения «его».
  alternative: «всех, кто назван Моим именем… которых Я сотворил…» или формально «каждого… его Я сотворил».
  rationale: Еврейский текст использует собирательно-распределительное единственное число, относящееся ко всему собираемому народу. Русское «каждого… кого» сохраняет эту грамматику без ненужного указания только на мужчин.
- issue: Связь оборота «для Моей славы»
  choice: 'Непосредственно связать его с «сотворил»: «кого Я сотворил для Моей славы».'
  alternative: 'Сохранить более формальный порядок: «и для Моей славы Я сотворил его; создал его и сделал его».'
  rationale: Порядок слов допускает формальное воспроизведение, но смысл цели сотворения по-русски яснее и естественнее выражен непосредственным присоединением к глаголу.
- issue: Различение трёх глаголов Божьего действия
  choice: «сотворил… создал… сделал».
  alternative: «сотворил… образовал… устроил» или «создал… сформировал… сделал».
  rationale: Сохранена трёхчастная последовательность ברא–יצר–עשה без превращения её в техническое описание отдельных стадий и без привнесения особой доктринальной схемы.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому регистру. Повтор «кого Я» намеренно сохраняет торжественную трёхчастную структуру исходного текста.
