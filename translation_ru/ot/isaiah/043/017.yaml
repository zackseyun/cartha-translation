  text: who brings out chariot and horse[a], army and mighty one together; they lie down, they do not rise; they are extinguished, quenched like flax.
translation:
  language: ru
  text: который выводит колесницу и коня, войско и сильного — вместе; они ложатся и не встают; угасли, погасли, словно лён[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно льняной фитиль». Буквально: «словно лён» — образ того, что легко и быстро гаснет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: который выводит
  rationale: Причастие породы хифиль продолжает описание Господа в предыдущем стихе. Настоящее время сохраняет живую описательность и не ограничивает смысл лишь прошедшим событием.
- source_word: רֶכֶב וָסוּס
  choice: колесницу и коня
  rationale: Оба существительных стоят в единственном числе и употреблены собирательно; буквальная пара естественно звучит по-русски и передаёт военный образ.
- source_word: חַיִל וְעִזּוּז
  choice: войско и могучего воина
  rationale: חַיִל здесь обозначает военную силу, а субстантивированное עִזּוּז — сильного, могучего. Слово «воина» уточняется из непосредственного военного контекста и позволяет избежать неестественного русского «могучего» без определяемого слова.
- source_word: יַחְדָּו
  choice: всех вместе
  rationale: Добавление «всех» естественно передаёт совместную гибель перечисленных сил, не меняя референта.
- source_word: יִשְׁכְּבוּ בַּל יָקוּמוּ
  choice: они ложатся и больше не встают
  rationale: Сохранён образ поверженных, лежащих сил. «Больше» естественно выражает усиленное отрицание בַּל и окончательность поражения.
- source_word: דָּעֲכוּ ... כָבוּ
  choice: угасли, погасли
  rationale: Оба глагола описывают прекращение горения. Два близких русских глагола сохраняют параллелизм, огненный образ и завершённость форм перфекта.
- source_word: כַּפִּשְׁתָּה
  choice: словно лён
  rationale: Прямое значение פִּשְׁתָּה — «лён». Возможный образ льняного фитиля не внесён в основной текст, а отмечен в сноске.
theological_decisions:
- issue: Временная перспектива действия Господа и гибели противников
  choice: Сохранить описательное настоящее у причастия и сочетание незавершённых и завершённых форм в последующих строках
  alternative: Передать весь стих прошедшим временем как прямое повествование об исходе
  rationale: Еврейский текст сочетает причастие, имперфекты и перфекты. Русский текст сохраняет живую картину и историческую аллюзию, не сводя высказывание исключительно к рассказу о прошлом.
- issue: Кого обозначают поверженные силы
  choice: Назвать только перечисленные в еврейском тексте военные силы
  alternative: Прямо назвать фараона, египтян или египетское войско
  rationale: Контекст ясно напоминает о переходе через море, однако данный стих не называет Египет. Аллюзия сохранена без внесения отсутствующего уточнения.
translation_notes:
  register: Современный литературный русский язык с поэтическим ритмом и достоинством пророческой речи. Военная образность и повтор глаголов угасания сохранены; пунктуация подчёркивает параллельные части стиха.
