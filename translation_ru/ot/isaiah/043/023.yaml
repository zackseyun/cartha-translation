base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/023.yaml
  text: You have not brought me sheep for your burnt offerings[a], nor have you honored me with your sacrifices. I have not burdened you with grain offerings, nor wearied you with frankincense.
translation:
  language: ru
  text: Ты не приносил Мне овец для своих всесожжений и не чтил Меня своими жертвами. Я не обременял тебя хлебными приношениями[a] и не утомлял тебя ладаном.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не заставлял тебя служить хлебным приношением». Еврейское выражение может подразумевать возложение тягостной службы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂה
  choice: овец
  rationale: Слово обозначает мелкий скот — овцу или козу — и здесь употреблено собирательно. «Овец» естественно звучит по-русски и не сужает значение до ягнят, хотя возможное включение коз не выражено явно.
- source_word: עֹלֹתֶיךָ
  choice: своих всесожжений
  rationale: עֹלָה — устойчивое обозначение жертвы, целиком сжигаемой на жертвеннике; «всесожжение» точно и привычно передаёт культовый термин.
- source_word: זְבָחֶיךָ
  choice: своими жертвами
  rationale: זֶבַח означает закланную жертву и шире жертвоприношение; в данном контексте современное «жертвы» сохраняет культовый смысл без излишней технической тяжеловесности.
- source_word: כִבַּדְתָּנִי
  choice: не чтил Меня
  rationale: Пиэль כבד обычно означает «почитать, оказывать честь». «Чтил» естественно связывает принесение жертв с возданием Богу должной чести.
- source_word: הֶעֱבַדְתִּיךָ
  choice: не обременял тебя
  rationale: Каузатив от עבד буквально выражает принуждение к служению или труду. В параллели с «не утомлял» речь идёт о тягостно навязанной службе, поэтому «не обременял» передаёт идиоматический смысл; более буквальный вариант дан в сноске.
- source_word: מִנְחָה
  choice: хлебными приношениями
  rationale: В культовом контексте מִנְחָה обозначает приношение из продуктов земледелия. Традиционное русское «хлебное приношение» понятно и точнее общего слова «дар».
- source_word: הוֹגַעְתִּיךָ
  choice: не утомлял тебя
  rationale: Каузатив יגע означает «утомлять, доводить до усталости» и образует смысловой параллелизм с «не обременял».
- source_word: לְבוֹנָה
  choice: ладана
  rationale: לְבוֹנָה обозначает именно ладан, а не благовония вообще; конкретный культовый предмет сохранён.
- source_word: לִי
  choice: Мне
  rationale: Предлог указывает на адресата или получателя приношения; русское «приносил Мне» естественно передаёт обе стороны значения.
theological_decisions:
- issue: Смысл слов Бога о жертвенном служении
  choice: Бог говорит, что не обременял Израиль тягостными требованиями о приношениях
  alternative: Бог вообще не требовал приношений
  rationale: Параллельные выражения «не обременял» и «не утомлял» подчёркивают не угнетающий характер Божьих требований на фоне пренебрежения Израиля. Перевод не превращает эти слова в отрицание установленного жертвенного служения, но и не устраняет риторическое напряжение текста.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Сохранены прямое обращение на «ты», параллелизм двух половин стиха и специальная культовая лексика; архаические синтаксические обороты не использованы.
