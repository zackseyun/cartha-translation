source:
  edition: WLC
  text: כִּֽי תַעֲבֹ֤ר בַּ/מַּ֨יִם֙ אִתְּ/ךָ אָ֔נִי וּ/בַ/נְּהָר֖וֹת לֹ֣א יִשְׁטְפ֑וּ/ךָ כִּֽי תֵלֵ֤ךְ בְּמוֹ אֵשׁ֙ לֹ֣א תִכָּוֶ֔ה וְ/לֶהָבָ֖ה לֹ֥א תִבְעַר בָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/002.yaml
  text: When you pass through the waters[a], I am with you; and through the rivers, they will not sweep over you. When you walk through fire, you will not be scorched[b], and the flame will not burn you.
translation:
  language: ru
  text: Когда будешь проходить через воды, Я с тобой; и через реки — они не захлестнут тебя.[a] Когда пойдёшь сквозь огонь, не будешь опалён,[b] и пламя не обожжёт тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они не смоют тебя»; возможен также смысл «они не поглотят тебя». Еврейский глагол может описывать затопление, смывание потоком или подавляющую силу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будешь обожжён». Здесь употреблён иной еврейский глагол, чем в следующей фразе о пламени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: когда
  rationale: В обеих половинах стиха союз вводит временное обстоятельство. «Когда» естественно передаёт уверенный характер обещания, не превращая его ни в причинное объяснение, ни в условную возможность.
- source_word: תַעֲבֹר בַּמַּיִם
  choice: будешь проходить через воды
  rationale: Глагол עבר обозначает прохождение или переход; сочетание «проходить через воды» сохраняет движение внутри опасной стихии и поэтический образ еврейского множественного числа.
- source_word: אִתְּךָ אָנִי
  choice: Я с тобой
  rationale: Краткая именная конструкция прямо выражает Божье присутствие. Настоящее время сохраняет непосредственность заверения и не сводит его лишь к будущему.
- source_word: וּבַנְּהָרוֹת
  choice: и через реки
  rationale: Предлог буквально указывает на нахождение в реках, но в связи с продолжающейся идеей движения по-русски естественно «через». «Реки» сохраняет усиление образа после «вод».
- source_word: לֹא יִשְׁטְפוּךָ
  choice: они не захлестнут тебя
  rationale: Глагол שטף может означать затопление, смывание потоком или подавляющее воздействие. «Не захлестнут» сохраняет конкретный образ бурной воды и допускает его более широкий поэтический смысл.
- source_word: תֵלֵךְ בְּמוֹ אֵשׁ
  choice: пойдёшь сквозь огонь
  rationale: הלך означает идти, а בְּמוֹ אֵשׁ — движение в огне или через него. «Сквозь огонь» звучит естественно и подчёркивает прохождение через опасность.
- source_word: לֹא תִכָּוֶה
  choice: не обожжёшься
  rationale: Форма от כוה означает быть обожжённым или опалённым. Возвратное «не обожжёшься» естественно по-русски и отличается от следующего утверждения о действии пламени.
- source_word: וְלֶהָבָה לֹא תִבְעַר בָּךְ
  choice: и пламя не опалит тебя
  rationale: בער с предлогом ב выражает горение, затрагивающее человека. «Не опалит тебя» сохраняет образ воздействия пламени и избегает тяжеловесной буквальности.
theological_decisions:
- issue: Характер обещания среди образов воды и огня
  choice: Сохранено конкретное поэтическое обещание Божьего присутствия и защиты при прохождении через крайнюю опасность.
  alternative: Истолковать образы исключительно как духовные испытания либо сформулировать абсолютную гарантию отсутствия всякого физического вреда.
  rationale: Сам стих не объясняет образы и не ограничивает их только переносным или только буквальным смыслом. Перевод поэтому сохраняет образность и напряжение обещания, не добавляя богословских уточнений.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим ритмом. Заглавная буква в «Я» подчёркивает речь Бога согласно русской издательской традиции, не добавляя содержания. Тире после «реки» помогает естественно передать смену конструкции и отнести местоимение «они» именно к рекам.
