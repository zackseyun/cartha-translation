id: ISA.43.11
reference: Isaiah 43:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אָנֹכִ֥י אָנֹכִ֖י יְהוָ֑ה וְ/אֵ֥ין מִ/בַּלְעָדַ֖/י מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/011.yaml
  text: I[a], I am Yahweh, and besides me there is no savior.
translation:
  language: ru
  text: Я, Я — Яхве, и кроме Меня[a] нет спасителя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вне Меня».'
    reason: Лексически מִבַּלְעָדַי допускает передачу как «кроме Меня» и как «вне Меня».
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי
  choice: Я, Я
  rationale: Повтор самостоятельного местоимения передаёт сильное смысловое ударение исходного текста, не добавляя толкования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму и функцию имени в еврейском тексте, а не заменяет его титулом.
- source_word: וְאֵין
  choice: и ... нет
  rationale: Экзистенциальное отрицание естественно и точно передаётся современной русской конструкцией «нет».
- source_word: מִבַּלְעָדַי
  choice: кроме Меня
  rationale: 'Выражение обозначает исключительность: никакого другого спасителя не существует. Вариант «вне Меня» сохранён в сноске как более буквальная пространственно-отделительная передача.'
- source_word: מוֹשִׁיעַ
  choice: спасителя
  rationale: Субстантивированное причастие породы hifil от ישׁע означает того, кто спасает или избавляет; «спаситель» естественно передаёт его абсолютное употребление в данном контексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова
  rationale: В стихе прямо употреблено личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Исключительность спасения
  choice: и кроме Меня нет спасителя
  alternative: и вне Меня нет спасителя
  rationale: Обе формулировки сохраняют категорическое утверждение еврейского текста. Основной вариант звучит естественнее по-русски, не ослабляя исключительности.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Повтор «Я, Я» намеренно сохранён ради эмфазы; тире помогает естественно прочитать именную конструкцию.
