source:
  edition: WLC
  text: אַל תִּירָ֖א כִּ֣י אִתְּ/ךָ אָ֑נִי מִ/מִּזְרָח֙ אָבִ֣יא זַרְעֶ֔/ךָ וּ/מִֽ/מַּעֲרָ֖ב אֲקַבְּצֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/005.yaml
  text: Do not fear[a], for I am with you; from the east I will bring your offspring[b], and from the west I will gather you.
translation:
  language: ru
  text: Не бойся[a], потому что Я с тобой; с востока Я приведу твоё потомство[b], и с запада соберу тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Обращение стоит в единственном числе, но относится к Иакову/Израилю как к единому народу.
    reason: cultural_note
  - marker: b
    text: 'Буквально употреблено собирательное единственное число; возможно также: «твоих потомков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Отрицательная частица אַל с формой глагола ירא выражает запрет. «Не бойся» естественно и точно передаёт обращение во 2-м лице единственного числа.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для призыва не бояться. «Потому что» ясно передаёт причинную связь в современном русском языке.
- source_word: אִתְּךָ אָנִי
  choice: Я с тобой
  rationale: Передаёт Божье присутствие без добавления отсутствующих в оригинале оттенков; явное «Я» сохраняет эмфатический характер еврейской конструкции.
- source_word: מִמִּזְרָח
  choice: с востока
  rationale: Хотя существительное этимологически связано с восходом солнца, здесь оно обозначает географическое направление.
- source_word: אָבִיא
  choice: Я приведу
  rationale: Hiphil глагола בוא означает «привести, сделать так, чтобы пришёл». «Приведу» сохраняет значение исходной формы, не добавляя прямо не выраженного значения возвращения.
- source_word: זַרְעֶךָ
  choice: твоё потомство
  rationale: זֶרַע здесь имеет собирательное значение «потомство». Русское «потомство» сохраняет собирательное единственное число и звучит естественнее буквального «семя».
- source_word: וּמִמַּעֲרָב
  choice: и с запада
  rationale: Идиоматически передаёт географический антоним востока; буквальная связь слова с закатом не нуждается в воспроизведении.
- source_word: אֲקַבְּצֶךָ
  choice: соберу тебя
  rationale: Piel глагола קבץ обозначает собирание. Единственное число местоименного суффикса сохранено, поскольку пророк обращается к Израилю как к единому народу.
theological_decisions:
- issue: К кому относятся местоимения второго лица единственного числа
  choice: 'Сохранить обращение в единственном числе: «не бойся», «с тобой», «твоё», «тебя».'
  alternative: 'Передать обращение множественным числом либо пояснить в тексте: «вас», «ваш народ».'
  rationale: В еврейском тексте Иаков/Израиль представлен как единый собирательный адресат. Русское единственное число сохраняет грамматику и пророческую образность оригинала, не снимая напряжения между единичной формой и коллективным референтом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис прост и понятен; единственное число обращения и параллелизм «с востока… с запада» сохранены.
