  yaml_path: translation/ot/isaiah/043/022.yaml
  text: Yet you have not called on me[a], Jacob, because you have grown weary of me[b], Israel.
translation:
  language: ru
  text: Но ты не взывал ко Мне[a], Иаков, потому что утомился от Меня[b], Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не звал Меня». Еврейский глагол может означать просто «звать», но при обращении к Богу нередко имеет смысл «взывать к Нему».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «утомился Мною». Еврейский предлог допускает близкое понимание усталости в отношении Бога; в данном контексте наиболее естественно: «утомился от Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Но ... не
  rationale: Союз с отрицанием противопоставляет этот упрёк предшествующему контексту; «но» естественно передаёт противительный оттенок.
- source_word: אֹתִי קָרָאתָ
  choice: ты не взывал ко Мне
  rationale: קרא буквально означает «звать», а при обращении к Богу часто обозначает молитвенное призывание. Русское «взывать к» ясно передаёт этот смысл, не устраняя буквальной альтернативы.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Имя употреблено как обращение к народу завета.
- source_word: כִּי
  choice: потому что
  rationale: Здесь союз естественно вводит причину предшествующего обвинения.
- source_word: יָגַעְתָּ בִּי
  choice: утомился от Меня
  rationale: יגע обозначает усталость, а בִּי указывает, в отношении кого она возникла. Формулировка «утомился от Меня» естественна по-русски и сохраняет образ текста.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Второе обращение параллельно имени «Иаков» и усиливает прямой упрёк народу.
theological_decisions:
- issue: Характер вины Израиля перед Богом
  choice: Израиль не взывал к Богу, потому что утомился от Него.
  alternative: Израиль не звал Бога; либо он утомился при служении Богу, либо утомил Бога.
  rationale: Грамматика делает Израиль подлежащим обоих глаголов. Предлог ב допускает оттенок «с/при Мне», но не поддерживает понимание, будто здесь Израиль утомил Бога; эту смысловую напряжённость отражает сноска.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены параллельные обращения «Иаков» и «Израиль», прямой упрёк и неоднозначность предложных сочетаний посредством сносок.
