source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה גֹּאַלְ/כֶ֖ם קְד֣וֹשׁ יִשְׂרָאֵ֑ל לְמַעַנְ/כֶ֞ם שִׁלַּ֣חְתִּי בָבֶ֗לָ/ה וְ/הוֹרַדְתִּ֤י בָֽ/רִיחִים֙ כֻּלָּ֔/ם וְ/כַשְׂדִּ֖ים בָּ/אֳנִיּ֥וֹת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/014.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: For your sake I have sent to Babylon and brought them all down as fugitives, even the Chaldeans[b], in the ships of their rejoicing.'
translation:
  language: ru
  text: 'Так говорит Яхве, ваш Искупитель, Святой Израиля:


    «Ради вас Я послал в Вавилон[a]

    и низверг всех их как беглецов[b] —

    халдеев на кораблях, где они ликовали».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Я послал против Вавилона». Буквально еврейский текст говорит: «Я послал в Вавилон», оставляя объект глагола невыраженным.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «и низверг все засовы». Еврейское слово, переведённое как «беглецов», трудно для понимания; его также связывают с «засовами» и, менее вероятно, с «вельможами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, в принятой современной русской форме, не заменяя его титулом.
- source_word: גֹּאַלְכֶם
  choice: ваш Искупитель
  rationale: Сохраняет краткость, торжественность и присущий книге Исаии смысл избавления Богом Своего народа.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  rationale: Устоявшаяся и ясная передача повторяющегося у Исаии божественного титула.
- source_word: לְמַעַנְכֶם
  choice: Ради вас
  rationale: Естественно выражает действие, совершаемое ради блага адресатов.
- source_word: שִׁלַּחְתִּי בָבֶלָה
  choice: Я послал в Вавилон
  rationale: Сохраняет выраженное направительным окончанием значение «в Вавилон» и оставляет подразумеваемое дополнение глагола неуточнённым, как в еврейском тексте.
- source_word: וְהוֹרַדְתִּי
  choice: и низверг
  rationale: Передаёт каузативное значение «заставил сойти вниз» и допускает одновременно пространственный смысл и смысл унижения или поражения.
- source_word: בָרִיחִים
  choice: как беглецов
  rationale: В контексте падения Вавилона это наиболее связное понимание трудного слова; существенная альтернатива «засовы» сохранена в сноске.
- source_word: כֻּלָּם
  choice: всех их
  rationale: Сохраняет собирательное и всеохватное значение выражения.
- source_word: וְכַשְׂדִּים
  choice: халдеев
  rationale: Тире перед словом позволяет понять халдеев как пояснение к «всем им», что соответствует возможной аппозиционной функции союза, не добавляя усилительного «даже».
- source_word: בָּאֳנִיּוֹת רִנָּתָם
  choice: на кораблях, где они ликовали
  rationale: Естественно передаёт связь халдеев с кораблями и иронический образ их прежнего ликования; значение רִנָּה как радостного громкого возгласа передано глаголом «ликовали».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет это различие и не превращает имя в титул.
- issue: Толкование трудного слова בָרִיחִים
  choice: как беглецов
  alternative: как засовы; вельмож
  rationale: Выбранное значение лучше согласуется с изображением поражения и бегства халдеев, однако лексическая неопределённость подлинна и потому отмечена в сноске.
- issue: Объект и направленность שִׁלַּחְתִּי בָבֶלָה
  choice: Я послал в Вавилон
  alternative: Я послал против Вавилона
  rationale: Еврейский текст буквально указывает направление «в Вавилон», оставляя объект глагола подразумеваемым; более истолковывающая передача дана в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для обычного читателя; поэтическое членение отражает структуру изречения. Подлинные лексические трудности вынесены в сноски, а не устранены пояснительным пересказом.
