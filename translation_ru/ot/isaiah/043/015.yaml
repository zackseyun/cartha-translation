source:
  edition: WLC
  text: אֲנִ֥י יְהוָ֖ה קְדֽוֹשְׁ/כֶ֑ם בּוֹרֵ֥א יִשְׂרָאֵ֖ל מַלְכְּ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/015.yaml
  text: I am Yahweh[a], your Holy One, the Creator of Israel, your King.
translation:
  language: ru
  text: Я — Яхве[a], ваш Святой, Творец Израиля, ваш Царь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ) — личное имя Бога; традиционно передаётся как «Господь».
    reason: Пояснение передачи божественного имени
lexical_decisions:
- source_word: אֲנִי
  choice: Я —
  rationale: Самостоятельное местоимение имеет эмфатическую силу; тире естественно передаёт в русском именную конструкцию самоидентификации без добавления глагола.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое самоименование Бога в еврейском тексте.
- source_word: קְדוֹשְׁכֶם
  choice: ваш Святой
  rationale: Форма с суффиксом 2-го лица множественного числа выражает принадлежность и заветное отношение; субстантивированное «Святой» выступает здесь как божественный титул.
- source_word: בּוֹרֵא
  choice: Творец
  rationale: Причастие характеризует Бога как Создателя Израиля и в данном перечислении имеет титульную силу.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Общепринятая русская форма имени; родительный падеж передаёт зависимость от «Творец».
- source_word: מַלְכְּכֶם
  choice: ваш Царь
  rationale: Существительное с суффиксом 2-го лица множественного числа прямо называет Яхве Царём обращённого к нему народа.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, а не титул «Господь». Форма «Яхве» сохраняет это различие и наиболее близко отражает принятую научную реконструкцию произношения.
- issue: Оформление божественных наименований
  choice: Святой, Творец и Царь с прописной буквы
  alternative: святой, творец и царь со строчной буквы
  rationale: В контексте эти слова образуют ряд приложений к имени Яхве и функционируют как божественные титулы; прописная буква передаёт это без изменения смысла.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной структурой исходного провозглашения. Повтор «ваш» сохранён ради параллелизма и заветной направленности обращения; местоимение имеет форму множественного числа, как в еврейском тексте.
