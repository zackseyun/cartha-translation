id: ISA.43.12
reference: Isaiah 43:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אָנֹכִ֞י הִגַּ֤דְתִּי וְ/הוֹשַׁ֨עְתִּי֙ וְ/הִשְׁמַ֔עְתִּי וְ/אֵ֥ין בָּ/כֶ֖ם זָ֑ר וְ/אַתֶּ֥ם עֵדַ֛/י נְאֻם יְהוָ֖ה וַֽ/אֲנִי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/012.yaml
  text: I myself declared and saved and announced[a], and there was no foreign god among you; and you are my witnesses, declares Yahweh, and I am God.
translation:
  language: ru
  text: Я сам объявил, спас и возвестил, и не было среди вас чужого бога[a]. Вы — Мои свидетели, — говорит Яхве, — и Я — Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не было среди вас чужого (постороннего)». Еврейское слово может обозначать чужого человека, но в данном контексте, вероятнее всего, подразумевается чужой бог.'
    reason: Лексическая неоднозначность слова זָר и контекстуально подразумеваемое существительное.
lexical_decisions:
- source_word: אָנֹכִי
  choice: Я сам
  rationale: Самостоятельное местоимение אָנֹכִי имеет эмфатический характер; «Я сам» передаёт ударение, не добавляя прямо не выраженного значения «только Я».
- source_word: הִגַּדְתִּי
  choice: объявил
  rationale: Hифиль от נגד означает «сообщить, объявить, сделать известным»; «объявил» соответствует торжественному свидетельскому контексту.
- source_word: וְהוֹשַׁעְתִּי
  choice: спас
  rationale: Hифиль от ישׁע прямо обозначает спасение или избавление; краткое «спас» сохраняет силу исходного утверждения.
- source_word: וְהִשְׁמַעְתִּי
  choice: возвестил
  rationale: Hифиль от שׁמע буквально может означать «дал услышать», а здесь — «возвестил, провозгласил». Выбор отличает этот глагол от предшествующего הִגַּדְתִּי и звучит естественно по-русски.
- source_word: וְאֵין בָּכֶם זָר
  choice: и не было среди вас чужого бога
  rationale: זָר буквально означает «чужой, посторонний, иноземный». В ближайшем контексте речь идёт о притязаниях божеств на способность предсказывать и спасать, поэтому подразумеваемое «бога» уместно восполнено в основном тексте; буквальная возможность отмечена в сноске.
- source_word: עֵדַי
  choice: Мои свидетели
  rationale: Форма с суффиксом первого лица прямо обозначает тех, кто является свидетелями Яхве; русский притяжательный оборот точен и естественен.
- source_word: נְאֻם יְהוָה
  choice: говорит Яхве
  rationale: Устойчивая пророческая формула передана естественным современным русским оборотом, сохраняющим прямое авторство изречения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное заветное имя, а не заменён титулом.
- source_word: וַאֲנִי אֵל
  choice: и Я — Бог
  rationale: אֵל здесь функционирует как обозначение Бога. Именное предложение передано тире без добавления слова «единый» или «один», которого в этой клаузе нет.
theological_decisions:
- issue: Значение זָר во фразе וְאֵין בָּכֶם זָר
  choice: чужой бог
  alternative: чужой человек; посторонний; иноземец
  rationale: Контекст Ис 43 противопоставляет спасительное и возвещающее действие Яхве иным богам. Поэтому «чужой бог» наиболее вероятно, однако лексическая неоднозначность самого זָר сохранена в сноске.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» позволяет не смешивать его с титулом אֲדֹנָי.
- issue: Смысл заключительного וַאֲנִי אֵל
  choice: и Я — Бог
  alternative: и Я — Бог один
  rationale: Контекст несёт исключительное богословское утверждение, но данная клауза буквально не содержит слова «один». Перевод не усиливает формулировку за пределы еврейского текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Параллельные глаголы переданы кратко и ритмично; различие между «объявил» и «возвестил» сохранено. Заглавные буквы в местоимениях «Мои» и «Я» отражают соответственно начало реплики после тире и принятое благоговейное оформление обращения к Богу без архаизации синтаксиса.
