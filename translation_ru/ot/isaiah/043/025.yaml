base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/025.yaml
  text: I[a], I am he who blots out your transgressions for my own sake[c][b], and your sins I will not remember.
translation:
  language: ru
  text: Я, Я — Тот, кто стирает твои преступления ради Меня Самого, и грехов твоих не вспомню.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Не вспомню» — образное выражение: Бог не будет более держать эти грехи в памяти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי הוּא
  choice: Я, Я — Тот
  rationale: Повтор личного местоимения передаёт усиленное божественное самоутверждение; «Тот» естественно выражает функцию הוּא как формулы самоидентификации.
- source_word: מֹחֶה
  choice: стирает
  rationale: Причастие от מחה обозначает стирание или уничтожение написанного; в русском «стирает преступления» сохраняет метафору полного удаления.
- source_word: פְשָׁעֶיךָ
  choice: твои преступления
  rationale: פשע указывает на серьёзное нарушение, нередко с оттенком мятежа; «преступления» сохраняет его отличие от более общего «грехи».
- source_word: לְמַעֲנִי
  choice: ради Себя Самого
  rationale: Оборот прямо связывает прощение с собственной целью и основанием Бога; возвратная форма естественно передаёт усилительный смысл.
- source_word: וְחַטֹּאתֶיךָ
  choice: и грехов твоих
  rationale: חטאות — обычное обозначение грехов; иной русский термин сохраняет параллель с פשעים без их полного отождествления.
- source_word: לֹא אֶזְכֹּר
  choice: не вспомню
  rationale: Будущая форма передаёт решимость Бога не припоминать эти грехи против Своего народа; буквальная формулировка сохраняет богословскую напряжённость образа памяти.
theological_decisions:
- issue: Основание прощения
  choice: '«ради Себя Самого»: Бог стирает преступления ради собственной цели и имени'
  alternative: Прощение обусловлено прежде всего достоинством или покаянием грешника
  rationale: Еврейское לְמַעֲנִי недвусмысленно ставит основание действия в Самом Боге; условия со стороны человека в этом стихе не названы.
- issue: Божественное «невоспоминание» грехов
  choice: Сохранить прямое «не вспомню», пояснив его судебно-отношенческий смысл в примечании
  alternative: 'Перевести толковательно: «не поставлю тебе в вину»'
  rationale: Прямой перевод сохраняет метафору и её богословскую напряжённость, не подразумевая недостатка знания у Бога и не подменяя текст толкованием.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повтор «Я, Я» намеренно сохранён как необычный, но ясный способ передать еврейское усиление; инверсия «грехов твоих» подчёркивает вторую половину параллелизма.
