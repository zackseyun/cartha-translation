base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/010.yaml
  text: You are my witnesses[a], declares Yahweh, and my servant whom I have chosen, so that you may know and believe in me and understand that I am he. Before me no god was formed[c][b], and after me there will be none.
translation:
  language: ru
  text: «Вы — Мои свидетели, — возвещает Яхве, — и Мой раб, которого Я избрал, чтобы вы знали и верили Мне[a] и понимали, что Я — Тот[b]. До Меня не было создано никакого бога, и после Меня не будет никого[c]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «верили в Меня» или «доверяли Мне». Еврейская конструкция допускает оттенки веры в сказанное и доверия к Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «что Я — Он». Это краткая формула божественного самоотождествления, неоднократно встречающаяся у Исаии.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский текст эллиптичен: «и после Меня не будет». По смыслу подразумевается: «не будет никакого бога» или «не будет никого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדַי
  choice: Мои свидетели
  rationale: Форма множественного числа с суффиксом первого лица единственного числа; Израиль представлен как множество свидетелей.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественный характер пророческой формулы и передаёт личное имя יהוה как «Яхве».
- source_word: וְעַבְדִּי
  choice: и Мой раб
  rationale: 'Единственное число сохранено: в непосредственном контексте это собирательное обозначение избранного народа, однако перевод не устраняет возможную смысловую напряжённость.'
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: которого Я избрал
  rationale: Относительное предложение точно обозначает предшествующий Божий выбор раба.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Ясно передаёт целевое значение союза.
- source_word: תֵּדְעוּ
  choice: вы знали
  rationale: После целевого союза форма передаёт предполагаемый результат, а не простое будущее.
- source_word: וְתַאֲמִינוּ לִי
  choice: и верили Мне
  rationale: Конструкция אמן в породе hифиль с ל допускает значения «верить кому-либо», «верить в кого-либо» и «доверять»; дательный «Мне» сохраняет непосредственную направленность еврейской конструкции.
- source_word: וְתָבִינוּ
  choice: и понимали
  rationale: Сохраняет последовательность «знать — верить — понимать» в естественном русском синтаксисе.
- source_word: כִּי אֲנִי הוּא
  choice: что Я — Тот
  rationale: Передаёт краткую формулу божественного самоотождествления, не сокращая её до более интерпретационного «Я есмь».
- source_word: לְפָנַי לֹא נוֹצַר אֵל
  choice: До Меня не было создано никакого бога
  rationale: לְפָנַי понято во временном смысле, а страдательная форма יצר передана без утверждения о существовании иных богов.
- source_word: וְאַחֲרַי לֹא יִהְיֶה
  choice: и после Меня не будет никого
  rationale: Сохранён эллиптический характер еврейской фразы; «никого» естественно отсылает к упомянутому богу.
theological_decisions:
- issue: К кому относится «Мой раб»
  choice: Сохранено единственное число как собирательное обозначение Израиля/Иакова в ближайшем контексте
  alternative: Индивидуальный раб или пророческий представитель
  rationale: Множественное обращение «вы» и контекст Ис 43 указывают прежде всего на народ, но буквальная форма «раб» оставляет текст открытым и не навязывает более узкого толкования.
- issue: Передача אֲנִי הוּא
  choice: Я — Тот
  alternative: Я есмь; это Я; Я — Он
  rationale: «Я — Тот» звучит по-русски как сжатое самоотождествление и сохраняет богословскую весомость формулы, не отождествляя её без оговорок с другими формулами откровения.
- issue: Утверждение об иных богах
  choice: никакого бога не было создано и не будет
  alternative: До Яхве и после Него не существовало и не будет существовать никакого божества
  rationale: Перевод следует образу «создания/образования» в тексте и не разворачивает полемическое утверждение в систематическое богословское пояснение.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают благоговейный регистр; имя יהוה передано как «Яхве». Синтаксическая напряжённость сочетания множественного «свидетели» и единственного «раб» намеренно сохранена.
