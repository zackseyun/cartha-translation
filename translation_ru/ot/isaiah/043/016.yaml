  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַ/נּוֹתֵ֥ן בַּ/יָּ֖ם דָּ֑רֶךְ וּ/בְ/מַ֥יִם עַזִּ֖ים נְתִיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/016.yaml
  text: 'Thus says Yahweh[a], who makes a way in the sea and a path in the mighty waters:'
translation:
  language: ru
  text: 'Так говорит Яхве, пролагающий путь в море и тропу в могучих водах[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через море» и «через могучие воды». Древнееврейский предлог буквально означает «в», но в контексте может описывать движение через воды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая и естественная для современного русского языка формула пророческого возвещения; настоящее время передаёт речевую функцию древнееврейской формулы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: הַנּוֹתֵן
  choice: пролагающий
  rationale: Причастие характеризует Яхве как того, кто устраивает путь. «Пролагающий» естественно сочетается с «путём» и «тропой» и сохраняет образ открываемого прохода.
- source_word: בַּיָּם
  choice: в море
  rationale: Предлог בְּ буквально выражает нахождение «в»; русский оборот сохраняет исходный образ и не исключает смысла движения через море.
- source_word: דָּרֶךְ
  choice: путь
  rationale: Передаёт как буквальный маршрут, так и более широкий образный смысл слова.
- source_word: וּבְמַיִם עַזִּים
  choice: и в могучих водах
  rationale: «Могучих» передаёт значение силы в עַזִּים, не сужая его до более истолковывающего «бурных».
- source_word: נְתִיבָה
  choice: тропу
  rationale: Сохраняет поэтический параллелизм и лексическое отличие от דָּרֶךְ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблён тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет это имя, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Причастный оборот сохраняет структуру исходного текста, а двоеточие показывает, что возвещение продолжается в следующем стихе.
