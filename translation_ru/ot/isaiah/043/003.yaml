id: ISA.43.3
reference: Isaiah 43:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֗י אֲנִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ קְד֥וֹשׁ יִשְׂרָאֵ֖ל מוֹשִׁיעֶ֑/ךָ נָתַ֤תִּי כָפְרְ/ךָ֙ מִצְרַ֔יִם כּ֥וּשׁ וּ/סְבָ֖א תַּחְתֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/003.yaml
  text: For I am Yahweh your God[a], the Holy One of Israel, your Savior; I have given Egypt as your ransom[b], Cush and Seba in exchange for you.
translation:
  language: ru
  text: 'Ведь Я — Яхве, твой Бог,

    Святой Израиля, твой Спаситель.

    Я отдал Египет как выкуп за тебя,

    Куш[a] и Севу — вместо тебя[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Куш — древняя область к югу от Египта, главным образом на территории Нубии; её не следует безоговорочно отождествлять с современным государством Эфиопия.
    reason: cultural_note
  - marker: b
    text: 'Или: «в обмен на тебя». Еврейское выражение обозначает замещение или обмен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Связывает стих с предшествующим заверением и вводит основание для него; в современном русском «ведь» естественно передаёт пояснительную функцию союза.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом; форма «Яхве» общепринята в современной русской библеистике.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет форму единственного числа и личное обращение к Израилю во втором лице мужского рода.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  rationale: Сохраняет характерный для книги Исаии титул и его сжатую родительную конструкцию.
- source_word: מוֹשִׁיעֶךָ
  choice: твой Спаситель
  rationale: Причастие употреблено субстантивно; «Спаситель» сохраняет как титульное, так и личное звучание формы с суффиксом второго лица.
- source_word: נָתַתִּי
  choice: Я отдал
  rationale: Еврейский перфект обозначает совершённое действие; «отдал» естественно сочетается с образом выкупа и замены, не требуя искусственного русского перфекта.
- source_word: כָפְרְךָ
  choice: как выкуп за тебя
  rationale: В данном контексте слово обозначает компенсационную цену, отданную ради освобождения или сохранения другого; «выкуп» передаёт обменный смысл без внесения культового значения искупительной жертвы.
- source_word: מִצְרַיִם
  choice: Египет
  rationale: Традиционное и однозначное русское название страны.
- source_word: כּוּשׁ
  choice: Куш
  rationale: Транслитерация древнего географического названия позволяет избежать анахроничного отождествления с современной Эфиопией.
- source_word: סְבָא
  choice: Сева
  rationale: Передаёт еврейское סְבָא и отличает это название от Шевы (Савы).
- source_word: תַּחְתֶּיךָ
  choice: вместо тебя
  rationale: 'Предлог выражает замещение: названные народы оказываются на месте адресата. Формулировка сохраняет сильный смысл замены, не сводя его только к торговому обмену.'
theological_decisions:
- issue: Смысл выкупа и замены Египтом, Кушем и Севой
  choice: Стих говорит о народах, отданных ради сохранения и избавления Израиля, используя образ выкупа и замещения.
  alternative: Понимать выражение более свободно как политическую компенсацию без выраженного образа выкупа.
  rationale: Сочетание כָפְרְךָ с תַּחְתֶּיךָ поддерживает сильную образность цены и замены. Перевод сохраняет её, но не переносит в текст позднейшую систематическую теорию искупления, которой сам стих не формулирует.
- issue: Референт местоимения второго лица
  choice: Сохранено прямое обращение в единственном числе («тебя», «твой»), относящееся в контексте к Израилю как к единому народу.
  alternative: Передать обращение множественным числом как речь ко всем израильтянам.
  rationale: Еврейский текст последовательно использует суффиксы второго лица мужского рода единственного числа; сохранение числа поддерживает олицетворение народа.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранён поэтический параллелизм и прямое обращение к Израилю; порядок титулов близок к еврейскому, но синтаксис остаётся естественным для русского читателя.
