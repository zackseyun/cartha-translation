  text: הִנְ/נִ֨י עֹשֶׂ֤ה חֲדָשָׁה֙ עַתָּ֣ה תִצְמָ֔ח הֲ/ל֖וֹא תֵֽדָע֑וּ/הָ אַ֣ף אָשִׂ֤ים בַּ/מִּדְבָּר֙ דֶּ֔רֶךְ בִּֽ/ישִׁמ֖וֹן נְהָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/019.yaml
  text: Look[a], I am doing a new thing; now it springs up—do you not perceive it? I will even make a way in the wilderness[b], rivers in the wasteland.
translation:
  language: ru
  text: Вот, Я совершаю нечто новое; теперь оно прорастает — разве вы этого не замечаете?[a] Даже в пустыне Я устрою дорогу, в пустоши — реки.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разве вы этого не знаете?»; «разве вы этого не узнаёте?»'
    reason: Лексема ידע может означать знание, узнавание или осознание; контекст допускает несколько близких оттенков.
  - marker: b
    text: 'Еврейский текст употребляет два близких, но разных обозначения бесплодной местности: «пустыня» и «пустошь».'
    reason: Примечание сохраняет лексическое различие между מִדְבָּר и יְשִׁימוֹן.
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот
  rationale: Современное и dignified вводное слово, сохраняющее указательно-привлекающую внимание силу еврейского выражения без архаичного «се».
- source_word: עֹשֶׂה חֲדָשָׁה
  choice: Я совершаю нечто новое
  rationale: Причастие передаёт разворачивающееся или близкое действие, а субстантивированное прилагательное — новый Божий поступок; «совершаю» естественно для значимого деяния.
- source_word: עַתָּה תִצְמָח
  choice: Оно уже всходит
  rationale: «Всходит» сохраняет образ прорастания, а «уже» естественно выражает контекстуальную непосредственность עַתָּה и связь с вопросом о распознавании.
- source_word: הֲלוֹא תֵדָעוּהָ
  choice: разве вы этого не замечаете?
  rationale: Риторический вопрос ожидает утвердительного ответа; «замечаете» передаёт распознавание возникающего Божьего дела, не исключая базовых значений «знать» и «узнавать».
- source_word: אַף
  choice: Даже
  rationale: Передаёт усиление и неожиданность обещанного действия в бесплодной местности.
- source_word: אָשִׂים ... דֶּרֶךְ
  choice: Я проложу дорогу
  rationale: Хотя שׂים буквально означает «помещать, устанавливать», с существительным «дорога» современный русский требует естественного «проложу».
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Обозначает пустынную, необрабатываемую местность и сохраняет конкретный образ нового исхода, не превращая его в прямое толкование.
- source_word: בִּישִׁמוֹן נְהָרוֹת
  choice: по пустоши проведу реки
  rationale: «Пустошь» отличает יְשִׁימוֹן от מִדְבָּר; «проведу реки» естественно по-русски выражает единое управление глагола שׂים в еврейском параллелизме.
theological_decisions:
- issue: Смысл «нечто новое» и образов дороги и рек
  choice: Сохранить конкретные образы обновления и нового исхода, не называя единственного исполнения.
  alternative: Уточнить в тексте возвращение из плена, эсхатологическое обновление или мессианское спасение.
  rationale: Еврейский текст допускает исторический, эсхатологический и типологический уровни прочтения, но сам стих не ограничивает образ одним из них.
translation_notes:
  register: Современный литературный русский с торжественной, но не архаичной интонацией. Краткие параллельные образы и риторический вопрос сохранены; «всходит» удерживает органическую метафору еврейского глагола.
