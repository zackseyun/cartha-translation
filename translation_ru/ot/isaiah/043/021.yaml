  text: עַם זוּ֙ יָצַ֣רְתִּי לִ֔/י תְּהִלָּתִ֖/י יְסַפֵּֽרוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/021.yaml
  text: This people I formed for myself[a]; they will declare my praise.
translation:
  language: ru
  text: Этот народ Я создал для Себя; он возвестит Мне хвалу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Этот народ Я образовал для Себя; он будет возвещать Мне хвалу».'
    reason: Лексические и аспектуальные варианты для יצר и ספר; вариант сохраняет значение תְּהִלָּתִי как хвалы, обращённой к Богу.
lexical_decisions:
- source_word: עַם
  choice: народ
  rationale: «Народ» естественно передаёт группу людей и сохраняет контекстуальный, в том числе заветный, смысл, не привнося понятия современного государства.
- source_word: זוּ
  choice: этот
  rationale: Указательное местоимение относится к уже названному народу; «этот» прямо передаёт его значение.
- source_word: יָצַרְתִּי
  choice: Я создал
  rationale: Глагол יצר обозначает целенаправленное создание, формирование. В данном контексте «создал» звучит естественнее по-русски, тогда как более буквальное «сформировал» сохранено в сноске.
- source_word: לִי
  choice: для Себя
  rationale: Дательный предлог с суффиксом первого лица выражает принадлежность или цель; «для Себя» естественно передаёт личную и целевую направленность.
- source_word: תְּהִלָּתִי
  choice: хвалу Мне
  rationale: Форма буквально означает «Мою хвалу», то есть хвалу, обращённую к Богу. Русское «хвалу Мне» устраняет неестественную двусмысленность сочетания «Мою хвалу» и хорошо сочетается с глаголом «возвестит».
- source_word: יְסַפֵּרוּ
  choice: он возвестит
  rationale: Пиэль ספר означает рассказывать, возвещать, провозглашать. «Возвестит» соответствует возвышенному пророческому стилю; единственное число согласуется в русском с собирательным существительным «народ».
theological_decisions:
- issue: Целевая или результативная связь второй части стиха
  choice: 'Точка с запятой и будущее время: «он возвестит хвалу Мне»'
  alternative: «чтобы он возвещал хвалу Мне»
  rationale: Еврейский текст не содержит явного целевого союза. Последовательность фраз допускает оттенок цели или результата; конструкция с точкой с запятой сохраняет эту напряжённость, не делая цель грамматически явной.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные буквы в местоимениях «Я», «Себя», «Мне» отражают принятую русскую библейскую традицию. Единственное число «он» употреблено по нормам русского согласования с существительным «народ».
