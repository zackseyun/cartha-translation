  text: אַֽל תִּזְכְּר֖וּ רִֽאשֹׁנ֑וֹת וְ/קַדְמֹנִיּ֖וֹת אַל תִּתְבֹּנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/018.yaml
  text: Do not remember the former things[a], and do not consider the things of old.
translation:
  language: ru
  text: Не вспоминайте прежнего[a] и не размышляйте о давнем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не вспоминайте первого и не размышляйте о древнем».'
    reason: 'Лексическая альтернатива: רִאשֹׁנוֹת может означать «первое», а קַדְמֹנִיּוֹת — «древнее»; сноска воспроизводит альтернативу для обеих параллельных частей стиха.'
lexical_decisions:
- source_word: אַל
  choice: не
  rationale: Отрицательная частица при формах имперфекта выражает запрет; по-русски естественно передаётся конструкцией «не» с повелительным наклонением.
- source_word: תִּזְכְּרוּ
  choice: вспоминайте
  rationale: Глагол זכר означает «помнить, вспоминать»; форма множественного числа сохраняет прямой характер обращения.
- source_word: רִאשֹׁנוֹת
  choice: прежнего
  rationale: Субстантивированное множественное прилагательное обозначает прежние, более ранние события или дела. Собирательное «прежнего» естественно по-русски и сохраняет контраст с «новым» в следующем стихе.
- source_word: וְ
  choice: и
  rationale: Простой соединительный союз связывает два параллельных запрета.
- source_word: קַדְמֹנִיּוֹת
  choice: о том, что было издревле
  rationale: Слово обозначает давнее, древнее или бывшее прежде. Эта формулировка ясна современному читателю и сохраняет поэтическое различие между двумя близкими понятиями.
- source_word: תִּתְבֹּנָנוּ
  choice: размышляйте
  rationale: Форма от בין передаёт внимательное обдумывание или сосредоточенное рассмотрение; «размышляйте» точнее выражает длительное умственное внимание, чем нейтральное «думайте».
