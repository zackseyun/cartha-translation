  verdict: revise
  source_fidelity: Первая часть точно передаёт запрет אַל־תִּזְכְּרוּ и субстантивированное רִאשֹׁנוֹת («прежнее»). Во второй части «размышляйте» уместно передаёт внимательное обдумывание в תִּתְבֹּנָנוּ, однако «о том, что было издревле» превращает קַדְמֹנִיּוֹת («древнее/давнее», субстантивированное множественное) в придаточную конструкцию с наречием «издревле», несколько смещая значение. «О давнем» сохраняет параллельную структуру и лексическое значение.
