id: ISA.43.1
reference: Isaiah 43:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עַתָּ֞ה כֹּֽה אָמַ֤ר יְהוָה֙ בֹּרַאֲ/ךָ֣ יַעֲקֹ֔ב וְ/יֹצֶרְ/ךָ֖ יִשְׂרָאֵ֑ל אַל תִּירָא֙ כִּ֣י גְאַלְתִּ֔י/ךָ קָרָ֥אתִי בְ/שִׁמְ/ךָ֖ לִ/י אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/001.yaml
  text: 'But now[a], thus says Yahweh, he who created you, Jacob, and he who formed you, Israel: Do not fear, for I have redeemed you; I have called you by name; you are mine.'
translation:
  language: ru
  text: 'А теперь так говорит Яхве, сотворивший тебя, Иаков, и образовавший тебя, Израиль: «Не бойся, ибо Я искупил тебя, позвал тебя по имени[a] — ты Мой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призвал тебя по имени».'
    reason: Глагол קרא в сочетании с именем означает обращение к кому-либо по имени; в контексте также возможен оттенок призыва.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: בֹּרַאֲךָ
  choice: сотворивший тебя
  rationale: Сохраняет характерное для ברא значение Божьего творческого действия и естественно входит в приложение к имени Яхве.
- source_word: וְיֹצֶרְךָ
  choice: и образовавший тебя
  rationale: Передаёт יצר как придание формы и отличает его от предшествующего ברא; «образовавший» также уместно применительно к возникновению Израиля как народа.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Иаков … Израиль
  rationale: Сохраняет парные личные и заветные имена, которыми назван один и тот же народ.
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Краткий и естественный русский запрет, сохраняющий торжественную прямоту еврейского текста.
- source_word: גְאַלְתִּיךָ
  choice: Я искупил тебя
  rationale: «Искупил» сохраняет смысл избавления и возвращения себе, связанный с обязанностью родича-искупителя, не сужая значение до конкретного способа выкупа.
- source_word: קָרָאתִי בְשִׁמְךָ
  choice: назвал тебя по имени
  rationale: Естественно передаёт буквальное «позвал/назвал по твоему имени» и подчёркивает личное, определённое обращение; возможный оттенок призвания указан в сноске.
- source_word: לִי אָתָּה
  choice: ты Мой
  rationale: Компактно воспроизводит именную конструкцию принадлежности и её заветную силу.
- source_word: וְעַתָּה כֹּה אָמַר
  choice: А теперь так говорит
  rationale: Сохраняет переход «а теперь» и традиционную, но понятную современному читателю пророческую формулу «так говорит».
theological_decisions:
- issue: Заветно-искупительный смысл גאל
  choice: искупил
  alternative: избавил; выкупил; вернул Себе
  rationale: «Искупил» удерживает одновременно избавление и право Искупителя на Свой народ, не уточняя сверх текста ни цену, ни механизм.
- issue: Утверждение принадлежности в לִי אָתָּה
  choice: ты Мой
  alternative: ты принадлежишь Мне
  rationale: Краткая формула сохраняет напряжение между Божьим избранием, властью и защитой, не превращая его в пояснительный пересказ.
- issue: Значение קרא в сочетании с именем
  choice: назвал тебя по имени
  alternative: призвал тебя по имени
  rationale: Основной текст сохраняет естественный смысл личного обращения, а сноска отмечает возможный оттенок действенного призвания, не навязывая его как единственный.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Параллелизм «сотворивший … образовавший» сохранён, как и прямое обращение к народу в единственном числе. Кавычки обозначают начало речи Яхве; тире подчёркивает краткое итоговое утверждение принадлежности.
