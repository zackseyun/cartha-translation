  text: מֵ/אֲשֶׁ֨ר יָקַ֧רְתָּ בְ/עֵינַ֛/י נִכְבַּ֖דְתָּ וַ/אֲנִ֣י אֲהַבְתִּ֑י/ךָ וְ/אֶתֵּ֤ן אָדָם֙ תַּחְתֶּ֔י/ךָ וּ/לְאֻמִּ֖ים תַּ֥חַת נַפְשֶֽׁ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/004.yaml
  text: Because you are precious in my eyes[a], honored, and I love you, I give men in exchange for you[b], and peoples in place of your life.
translation:
  language: ru
  text: Поскольку ты драгоценен в Моих глазах[a], почитаем и Я люблю тебя, Я отдаю людей взамен тебя[b] и народы — вместо твоей жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поскольку ты был драгоценен в Моих глазах, почитаем и Я полюбил тебя». Еврейские глагольные формы в этом контексте могут пониматься как относящиеся к прошлому или настоящему.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я отдам людей взамен тебя и народы — вместо твоей жизни». В этом пророческом контексте еврейский глагол может иметь значение будущего времени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֲשֶׁר
  choice: Поскольку
  rationale: Сочетание вводит причину спасительного действия Бога; причинное значение здесь лучше соответствует контексту, чем возможное временное.
- source_word: יָקַרְתָּ בְעֵינַי
  choice: ты драгоценен в Моих глазах
  rationale: Передаёт ценность адресата в Божьей оценке, сохраняет образ еврейского выражения «в глазах» и допускает настоящее значение формы qatal.
- source_word: נִכְבַּדְתָּ
  choice: почитаем
  rationale: Niphal от כבד указывает на того, кого чтут или высоко ценят; краткое «почитаем» естественно продолжает ряд характеристик.
- source_word: וַאֲנִי אֲהַבְתִּיךָ
  choice: и Я люблю тебя
  rationale: Настоящее время выражает продолжающуюся Божью любовь, не ограничивая её завершённым событием прошлого.
- source_word: וְאֶתֵּן
  choice: Я отдаю
  rationale: Форма yiqtol допускает настоящее или будущее значение в пророческом контексте; настоящее передаёт живое действующее заверение, а будущее отмечено в сноске.
- source_word: אָדָם
  choice: людей
  rationale: Собирательное употребление обозначает людей, отдаваемых взамен Израиля; русское «людей» ясно и естественно передаёт смысл без отвлечённого «человечество».
- source_word: תַּחְתֶּיךָ
  choice: взамен тебя
  rationale: תחת имеет здесь заместительное значение, а не пространственное; «взамен» кратко выражает обмен.
- source_word: וּלְאֻמִּים
  choice: и народы
  rationale: Сохраняет множественное число и этнополитический смысл, а также параллелизм с «людей».
- source_word: תַּחַת נַפְשֶׁךָ
  choice: вместо твоей жизни
  rationale: נפש здесь означает жизнь или самого человека, а не обязательно нематериальную душу; перевод сохраняет конкретный смысл замещения.
theological_decisions:
- issue: Передача собирательного אָדָם
  choice: людей
  alternative: человека; человечество
  rationale: В данном контексте речь идёт о человеческих жизнях, отдаваемых взамен Израиля. «Людей» сохраняет конкретность и не превращает слово в абстрактное обозначение всего человечества.
- issue: Значение נֶפֶשׁ
  choice: жизнь
  alternative: душа; сам человек
  rationale: Контекст требует значения жизни или личности, которую сохраняют ценой других; «душа» могла бы привнести не выраженное здесь противопоставление души и тела.
- issue: Временная отнесённость Божьей любви и действия обмена
  choice: настоящее время в основном тексте
  alternative: прошедшее для יקרת/אהבתיך; будущее для ואתן
  rationale: Еврейские глагольные формы в пророческом контексте допускают более одного временного прочтения. Основной текст выражает нынешний статус и действие, а реальные альтернативы сохранены в сносках.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены образ «в Моих глазах», мужской род обращения к олицетворённому Израилю и напряжённый язык замещения. Местоимение Бога оформлено с прописной буквы в соответствии с распространённой русской библейской традицией.
