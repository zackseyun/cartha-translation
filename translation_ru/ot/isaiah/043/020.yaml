base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/020.yaml
  text: The beasts of the field will honor me[a], jackals and ostriches, because I give water in the wilderness, rivers in the wasteland, to give drink to my people[c][b], my chosen ones.
translation:
  language: ru
  text: Меня почтут дикие звери — шакалы[a] и страусы[b], — ибо Я дам в пустыне воду, в пустоши — реки, чтобы напоить Мой народ, Моего избранника.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может передаваться также как «драконы» в старой переводческой традиции; в этом контексте вероятнее значение «шакалы».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дочери яаны»; это идиоматическое название, обычно понимаемое как «страусы». В старых переводах встречается «совы».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово «избранник» стоит в единственном числе и относится к «Моему народу» как к единому целому.
    reason: lexical_alternative
