- source_word: תַּנִּים
  choice: шакалы
  rationale: В данном контексте пустынной фауны наиболее вероятно значение «шакалы», а не традиционное «драконы».
- source_word: בְנוֹת יַעֲנָה
  choice: страусы
  rationale: Буквально «дочери страуса» — еврейское идиоматическое обозначение страусов; буквальное воспроизведение по-русски затемнило бы смысл.
- source_word: נָתַתִּי
  choice: Я дал
  rationale: 'Перфект сохранён прошедшим временем: Божье действие представлено как совершившееся или несомненно совершённое в пророческой перспективе.'
- source_word: בַמִּדְבָּר מַיִם
  choice: воду в пустыне
  rationale: Прямое и естественное воспроизведение образа Божьего обеспечения в необитаемой местности.
- source_word: נְהָרוֹת בִּישִׁימוֹן
  choice: реки — в безводной земле
  rationale: יְשִׁימוֹן обозначает пустынную, опустошённую местность; «безводная земля» ясно передаёт контраст с реками и избегает тавтологии.
- source_word: לְהַשְׁקוֹת
  choice: чтобы напоить
  rationale: Инфинитив выражает цель; русский глагол конкретно и естественно сочетается с объектом «народ».
- source_word: עַמִּי בְחִירִי
  choice: Мой народ, Моего избранника
  rationale: Сохраняется сочетание собирательного «народ» с морфологически единственным «Мой избранник», характерное для корпоративного представления Израиля.
theological_decisions:
- issue: Корпоративное единственное число בְחִירִי применительно к Израилю
  choice: Моего избранника
  alternative: Моих избранных / Мой избранный народ
  rationale: Еврейское слово стоит в единственном числе и приложено к собирательному «Мой народ». Единственное число сохраняет грамматику и образ народа как единого корпоративного лица, не разрешая неоднозначность множественным переводом.
