  variant: modern literary Russian
source:
  edition: WLC
  text: לֹא קָנִ֨יתָ לִּ֤/י בַ/כֶּ֨סֶף֙ קָנֶ֔ה וְ/חֵ֥לֶב זְבָחֶ֖י/ךָ לֹ֣א הִרְוִיתָ֑/נִי אַ֗ךְ הֶעֱבַדְתַּ֨/נִי֙ בְּ/חַטֹּאותֶ֔י/ךָ הוֹגַעְתַּ֖/נִי בַּ/עֲוֺנֹתֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/024.yaml
  text: You did not buy me sweet cane with silver[a], or satisfy me with the fat of your sacrifices; instead, you burdened me with your sins[b]; you wearied me with your iniquities.
translation:
  language: ru
  text: Ты не покупал Мне за серебро благовонного тростника[a] и не насыщал Меня жиром своих жертв; напротив, ты обременял Меня своими грехами[b], утомлял Меня своими беззакониями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ароматического камыша». Еврейское слово обозначает дорогой благовонный тростник.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «заставлял Меня служить своими грехами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתָ לִּי בַכֶּסֶף
  choice: не покупал Мне за серебро
  rationale: קנה в сочетании с указанием платы имеет торговое значение «покупать»; «за серебро» сохраняет конкретный образ еврейского текста и естественно звучит по-русски.
- source_word: קָנֶה
  choice: благовонного тростника
  rationale: В данном контексте слово обозначает дорогой ароматический тростник, использовавшийся как благовоние; перевод понятен современному читателю и не сводит значение к обычному камышу.
- source_word: חֵלֶב זְבָחֶיךָ
  choice: жиром своих жертв
  rationale: Сохранено буквальное культовое значение חֵלֶב — жировые части жертвоприношения, а не обобщённое «лучшей частью».
- source_word: הִרְוִיתָנִי
  choice: не насыщал Меня
  rationale: Hiphil от רוה означает «насытить, напоить досыта»; «насыщал» сохраняет намеренно антропоморфный образ в связи с жертвенной пищей.
- source_word: אַךְ
  choice: напротив
  rationale: Частица вводит резкий контраст между неоказанным почитанием и тем, что народ в действительности делал своими грехами.
- source_word: הֶעֱבַדְתַּנִי בְּחַטֹּאותֶיךָ
  choice: обременял Меня своими грехами
  rationale: Буквально конструкция означает «заставил Меня служить посредством своих грехов». В основном тексте «обременял» естественно передаёт контекстуальную силу выражения, а буквальный образ отмечен в сноске.
- source_word: הוֹגַעְתַּנִי
  choice: утомлял Меня
  rationale: Hiphil от יגע означает «утомлять, доводить до изнеможения»; выбранный вариант точен и сохраняет возвышенный пророческий регистр.
- source_word: בַּעֲוֺנֹתֶיךָ
  choice: своими беззакониями
  rationale: «Беззакония» передаёт нравственную тяжесть עָוֹן и сохраняет лексическое различие с חטאות — «грехами».
theological_decisions:
- issue: Антропоморфное изображение Бога насыщаемым жертвами, обременённым и утомлённым грехами
  choice: Сохранить выражения «насыщал Меня», «обременял Меня» и «утомлял Меня» без догматического смягчения.
  alternative: 'Передать отвлечённо: «не почитал Меня… оскорблял Меня».'
  rationale: 'Еврейский текст намеренно создаёт напряжённый образ: вместо служения Богу народ как бы принуждает Бога нести бремя его грехов. Абстрактный пересказ устранил бы этот риторический и богословский контраст.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм оригинала сохранён; культовая лексика передана конкретно, а непривычные антропоморфные образы не сглажены.
