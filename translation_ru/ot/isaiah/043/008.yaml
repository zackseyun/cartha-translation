  text: הוֹצִ֥יא עַם עִוֵּ֖ר וְ/עֵינַ֣יִם יֵ֑שׁ וְ/חֵרְשִׁ֖ים וְ/אָזְנַ֥יִם לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/008.yaml
  text: Bring out a blind people[a], though they have eyes, and the deaf, though they have ears.
translation:
  language: ru
  text: Выведи слепой народ[a], хотя у него есть глаза, и глухих, хотя у них есть уши.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Приведи слепой народ: у него есть глаза; и глухих: у них есть уши».'
    reason: 'Лексико-синтаксическая альтернатива: הוֹצִיא допускает значение «приведи/выведи», а союз וְ можно формально передать как «и», не выражая уступительное отношение явно.'
lexical_decisions:
- source_word: הוֹצִיא
  choice: Выведи
  rationale: 'Порода хифиль, повелительное наклонение, мужской род, единственное число от יצא: повеление заставить кого-либо выйти или вывести. «Выведи» естественно передаёт каузативное значение и повелительную силу формы.'
- source_word: עַם עִוֵּר
  choice: слепой народ
  rationale: עַם обозначает народ как коллектив, а עִוֵּר — согласованное с ним прилагательное в единственном числе. Русский язык не имеет неопределённого артикля, поэтому сочетание сохраняет естественную неопределённость еврейской именной группы.
- source_word: וְעֵינַיִם יֵשׁ
  choice: хотя у него есть глаза
  rationale: 'Буквально: «и глаза есть». Союз «хотя» ясно передаёт подразумеваемое уступительное противопоставление: народ назван слепым, несмотря на наличие глаз.'
- source_word: וְחֵרְשִׁים
  choice: и глухих
  rationale: Прилагательное во множественном числе употреблено субстантивированно. В конструкции с повелительным «выведи» русская форма винительного падежа «глухих» естественно продолжает ряд объектов.
- source_word: וְאָזְנַיִם לָמוֹ
  choice: хотя у них есть уши
  rationale: 'Буквально: «и уши у них». Уступительное «хотя» передаёт риторический контраст между названной глухотой и наличием ушей, не устраняя метафорической напряжённости.'
theological_decisions:
- issue: Характер слепоты и глухоты
  choice: Сохранены обычные обозначения физических состояний, при этом контексту позволено указывать на духовную невосприимчивость.
  alternative: Прямо назвать народ духовно слепым и глухим в основном тексте.
  rationale: Еврейский текст употребляет обычные слова «слепой» и «глухие». Их буквальная передача сохраняет пророческую иронию и не превращает подразумеваемое метафорическое значение в явное толкование.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная пророческая речь. Сохранён параллелизм слепоты при наличии глаз и глухоты при наличии ушей.
