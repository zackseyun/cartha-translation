base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/003.yaml
  text: Egypt is man and not God[a], and their horses are flesh and not spirit. When Yahweh stretches out his hand, the helper will stumble and the one helped will fall[c][b], and together all of them will come to an end.
translation:
  language: ru
  text: Египет — человек, а не Бог[a], и кони его — плоть, а не дух[b]. Когда ГОСПОДЬ прострёт свою руку, помощник споткнётся, и получающий помощь падёт; все они вместе погибнут[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Египет — человеческая сила, а не Бог». Название страны здесь представляет тех, кто оказывает помощь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дыхание»; «дух» может обозначать нематериальную силу и не обязательно является прямым упоминанием Святого Духа.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «исчезнут», «будут истреблены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: египтяне
  rationale: В данном контексте название страны метонимически обозначает египтян, на чью помощь рассчитывали; множественное «египтяне» естественно сочетается с последующим «люди» и местоимением «их».
- source_word: אָדָם
  choice: люди
  rationale: Передаёт противопоставление человеческой, тварной природы Египта Богу; в русском множественное число естественно при собирательном обозначении египтян.
- source_word: אֵל
  choice: Бог
  rationale: Речь идёт об истинном Боге в противопоставлении людям, поэтому употреблена прописная буква.
- source_word: סוּסֵיהֶם
  choice: кони их
  rationale: Прямой перевод формы с местоименным суффиксом; постпозиция местоимения поддерживает возвышенный пророческий ритм.
- source_word: בָּשָׂר
  choice: плоть
  rationale: Сохраняет краткое и образное противопоставление «плоть — дух», подразумевающее тварность, слабость и смертность.
- source_word: רוּחַ
  choice: дух
  rationale: Строчная буква сохраняет широкое значение — нематериальная или животворящая сила — и не превращает выражение в прямое упоминание Святого Духа.
- source_word: יהוה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона, типографически отличающая имя Яхве от титула «Господь».
- source_word: יַטֶּה יָדוֹ
  choice: прострёт Свою руку
  rationale: Естественная для литературного и библейского русского идиома решительного Божьего действия; будущее время отражает последовательность еврейских форм.
- source_word: עוֹזֵר
  choice: помогающий
  rationale: Передаёт субстантивированное действительное причастие и сохраняет словесную связь с пассивной формой в следующей строке.
- source_word: עָזֻר
  choice: тот, кому помогают
  rationale: Ясно передаёт пассивное причастие и противопоставляет получателя помощи помогающему.
- source_word: כָשַׁל
  choice: споткнётся
  rationale: Сохраняет конкретный образ утраты устойчивости, предваряющей падение.
- source_word: נָפַל
  choice: падёт
  rationale: Прямо передаёт второй, усиливающий этап крушения и образует естественную пару со «споткнётся».
- source_word: יִכְלָיוּן
  choice: погибнут
  rationale: В контексте совместного крушения помощника и получателя помощи естественно передаёт полное прекращение их силы и существования, не уточняя способ уничтожения.
theological_decisions:
- issue: Следует ли понимать רוּחַ как Святого Духа или как дух / нематериальную силу
  choice: дух
  alternative: Дух; дыхание
  rationale: Противопоставление плоти указывает на отсутствие у коней нематериальной, животворящей или божественной силы, но не требует прямой ссылки на Святого Духа; строчная буква сохраняет смысловую широту.
- issue: Как передать אָדָם в противопоставлении Египта Богу
  choice: люди
  alternative: человек; человеческое
  rationale: Смысл состоит в тварной человеческой природе египтян, а не в мужском поле. Множественное число естественно в современном русском и согласуется с метонимическим «египтяне».
- issue: Кого обозначают «помогающий» и «тот, кому помогают»
  choice: сохранить ролевые обозначения без вставки конкретных названий
  alternative: Египет и Иуда
  rationale: Контекст позволяет соотнести роли с Египтом и теми, кто ищет его поддержки, однако сам стих использует обобщённые причастные формы; перевод не должен устранять эту риторическую обобщённость.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксический параллелизм и контрасты «люди — Бог», «плоть — дух», «помогающий — тот, кому помогают» сохранены. Формы «прострёт» и «падёт» придают возвышенность, оставаясь понятными современному читателю.
