base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/008.yaml
  text: And Assyria will fall by a sword not of man[a], and a sword not of humankind will devour him; and he will flee from before the sword[d][c][b], and his young men will become forced labor.
translation:
  language: ru
  text: И падёт Ассирия от меча, не человеческого; меч, не людской, поглотит её. Она побежит от меча, а её юноши будут нести принудительную повинность.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָפַל
  choice: И падёт
  rationale: Перфект в пророческом контексте передаёт предстоящее событие; будущее время естественно для современного русского языка.
- source_word: אַשּׁוּר
  choice: Ассирия
  rationale: Название обозначает ассирийскую державу как единое целое. Женский род русского названия определяет дальнейшие местоименные формы.
- source_word: בְּחֶרֶב לֹא אִישׁ
  choice: от меча, но не человеческого
  rationale: Предлог ב передаёт орудие или средство поражения. Формулировка сохраняет отрицание человеческого происхождения или действия меча и при этом звучит естественно по-русски.
- source_word: וְחֶרֶב לֹא אָדָם
  choice: меч не людской
  rationale: Слово «людской» позволяет отразить параллелизм и некоторое лексическое различие между אִישׁ и אָדָם, не превращая поэтическую строку в неестественную кальку.
- source_word: תֹּאכֲלֶנּוּ
  choice: пожрёт её
  rationale: Глагол буквально связан с поеданием, но здесь образно описывает истребляющее действие меча. Местоимение женского рода согласовано с русским словом «Ассирия».
- source_word: וְנָס לוֹ מִפְּנֵי חֶרֶב
  choice: Она побежит от меча
  rationale: Ассирия продолжает выступать собирательным субъектом. Русское «побежит от меча» ясно передаёт древнееврейскую идиому מִפְּנֵי חֶרֶב; местоимение לו не требует отдельного выражения в естественном русском синтаксисе.
- source_word: בַחוּרָיו
  choice: её молодые воины
  rationale: בָּחוּר обозначает молодых мужчин в расцвете сил; военный контекст допускает и подсказывает «воины», тогда как определение «молодые» сохраняет основной возрастной оттенок.
- source_word: לָמַס יִהְיוּ
  choice: попадут на принудительные работы
  rationale: מַס может обозначать повинность, барщину или принудительный труд. Выбранная формулировка современна, понятна и передаёт наступление состояния подневольности после поражения.
theological_decisions:
- issue: Природа меча, поражающего Ассирию
  choice: меч, не принадлежащий человеческой силе или не приводимый ею в действие
  alternative: буквальный меч без человеческого воина либо образ непосредственного Божьего вмешательства — например, через ангела или поражение
  rationale: Древнееврейский текст дважды отрицает человеческий характер или участие, но не уточняет конкретный способ суда. Перевод сохраняет эту неопределённость и не отождествляет меч с каким-либо одним механизмом.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой образности и параллелизма. Выражения «меч не людской» и «пожрёт» намеренно имеют возвышенно-поэтическую окраску, соответствующую стилю Исайи; синтаксис остаётся понятным для широкого читателя.
