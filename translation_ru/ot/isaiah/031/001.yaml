source:
  edition: WLC
  text: ה֣וֹי הַ/יֹּרְדִ֤ים מִצְרַ֨יִם֙ לְ/עֶזְרָ֔ה עַל סוּסִ֖ים יִשָּׁעֵ֑נוּ וַ/יִּבְטְח֨וּ עַל רֶ֜כֶב כִּ֣י רָ֗ב וְ/עַ֤ל פָּֽרָשִׁים֙ כִּֽי עָצְמ֣וּ מְאֹ֔ד וְ/לֹ֤א שָׁעוּ֙ עַל קְד֣וֹשׁ יִשְׂרָאֵ֔ל וְ/אֶת יְהוָ֖ה לֹ֥א דָרָֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/001.yaml
  text: Woe to those who go down to Egypt for help[a], who rely on horses and trust in chariots because they are many, and in horsemen because they are very strong[c][b], but do not look to the Holy One of Israel and do not seek Yahweh.
translation:
  language: ru
  text: Горе тем, кто спускается в Египет за помощью, опирается на коней[a], полагается на колесницы, потому что их много, и на всадников, потому что они очень сильны[b], но не обращает своего взора к Святому Израилеву и не ищет Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «надеется на коней». Еврейский глагол изображает поддержку, которую ищут в том, на что опираются.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что они весьма могущественны».'
    reason: lexical_alternative
  - marker: c
    text: Яхве — передача еврейского божественного имени יהוה (YHWH), которое традиционно заменяют словом «Господь».
    reason: divine_name
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Пророческое междометие вводит обличение и возвещение суда; «горе» сохраняет его торжественную и угрожающую силу.
- source_word: הַיֹּרְדִים מִצְרַיִם לְעֶזְרָה
  choice: тем, кто спускается в Египет за помощью
  rationale: Причастие употреблено субстантивно, а «спускается» сохраняет обычное для библейской географии описание движения в Египет и характеристику определённого круга людей.
- source_word: עַל סוּסִים יִשָּׁעֵנוּ
  choice: надеется на коней
  rationale: Nifal глагола שׁען буквально рисует опору на что-либо; современное «надеется на» ясно передаёт зависимость от военной силы, а образ опоры отмечен в сноске.
- source_word: וַיִּבְטְחוּ עַל רֶכֶב כִּי רָב
  choice: полагается на множество колесниц
  rationale: רֶכֶב имеет собирательное значение, а כִּי רָב указывает на многочисленность колесничного войска. Такая перестройка естественна по-русски и сохраняет причинную связь.
- source_word: וְעַל פָּרָשִׁים
  choice: и на всадников
  rationale: פָּרָשִׁים обозначает конных воинов; конкретное «всадники» сохраняет образ исходного текста, не сводя его заранее к техническому термину «конница».
- source_word: כִּי עָצְמוּ מְאֹד
  choice: потому что они очень сильны
  rationale: עָצַם может выражать силу, мощь или многочисленность. В военном контексте «очень сильны» хорошо передаёт мощь всадников, а иная возможность отражена в сноске.
- source_word: וְלֹא שָׁעוּ עַל קְדוֹשׁ יִשְׂרָאֵל
  choice: но не обращает взора к Святому Израилеву
  rationale: שׁעה означает направлять взгляд и внимание; выражение сохраняет зрительный образ и одновременно подразумевает упование.
- source_word: וְאֶת יְהוָה לֹא דָרָשׁוּ
  choice: и не ищет Яхве
  rationale: דרש передаёт сознательное обращение к Богу за руководством и помощью; «ищет» сохраняет широкую смысловую ёмкость глагола.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В исходном тексте стоит тетраграмматон, личное имя Бога. «Яхве» передаёт его как имя и не заменяет титулом; примечание поясняет традицию написания.
- issue: Временной план пророческого обличения
  choice: 'настоящее время: «спускается… надеется… полагается… не обращает… не ищет»'
  alternative: 'прошедшее время: «спустились… опёрлись… положились… не обратились… не искали»'
  rationale: Начальное субстантивированное причастие характеризует людей по их поведению, а последующие формы входят в пророческое возвещение «горя». Русское настоящее время естественно передаёт эту обобщённую, продолжающуюся характеристику.
- issue: Число сказуемых при собирательном адресате
  choice: единственное число после «тем, кто»
  alternative: множественное число по формам еврейского текста
  rationale: Русская конструкция «тем, кто» нормативно требует сказуемого в единственном числе; множественность адресатов остаётся ясной из местоимения «тем» и не меняет смысла обличения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан плавным для публичного чтения; сохранены нисходящее движение в Египет, военные образы, противопоставление человеческой силы и обращения к Богу, а также титул «Святой Израилев».
