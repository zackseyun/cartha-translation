  - severity: low
    issue: Оба знака сносок поставлены в конце предложения, а не у соответствующих элементов.
    rationale: Для ясности сноску об альтернативном разборе следует поставить после относительного оборота, а сноску о בְּנֵי יִשְׂרָאֵל — после «сыновья Израиля».
  revised_text: Вернитесь к Тому, против Кого[a] сыновья Израиля[b] зашли так далеко в своем мятеже.
