  verdict: revise
  source_fidelity: 'Смысловой каркас передан верно: множественное повеление שׁוּבוּ, относительное обозначение Бога без добавления имени, а также направленность סָרָה против Него сохранены. Однако «так глубоко восстали» в русском языке звучит не вполне естественно и менее ясно передаёт идиоматическое сочетание הֶעְמִיקוּ סָרָה — углубление, крайнее развитие мятежа.'
  naturalness: Предлагаемая формулировка «зашли так далеко в своем мятеже» естественна для современного литературного русского, сохраняет пророчески возвышенный регистр и передаёт усилительное значение еврейского глагола без искусственной метафоры «глубоко восстали». Порядок слов также делает «сыновья Израиля» подлежащим, как в еврейском тексте.
  terminology: «Сыновья Израиля» сохраняет форму בְּנֵי יִשְׂרָאֵל; «мятеж» уместно передаёт סָרָה как активное отпадение/непокорность, не навязывая конфессионально узкого термина. Прописные буквы в «Тому» и «Кого» допустимы, поскольку референт ясен из контекста, хотя в самом стихе не назван.
  issues:
