  text: שׁ֗וּבוּ לַ/אֲשֶׁ֛ר הֶעְמִ֥יקוּ סָרָ֖ה בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/006.yaml
  text: Return to him from whom the sons of Israel have deeply revolted[a][b].
translation:
  language: ru
  text: Вернитесь к Тому, против Кого[a] сыновья Израиля[b] зашли так далеко в своем мятеже.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вернитесь к Тому, от Кого сыновья Израиля так далеко отступили». Еврейский относительный оборот сжат и допускает оба способа передачи.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «сыновья Израиля»; это выражение обозначает израильский народ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Вернитесь
  rationale: Повелительная форма множественного числа от שוב выражает призыв возвратиться, в данном контексте — обратиться к Богу после отступления. «Вернитесь» сохраняет направленность движения и звучит естественно в современном русском языке.
- source_word: לַאֲשֶׁר
  choice: к Тому, против Кого
  rationale: Предлог לְ при относительном אֲשֶׁר указывает на Лицо, к Которому призывают вернуться и против Которого было направлено восстание. Сжатость еврейского оборота допускает также понимание «к Тому, от Кого»; оно отмечено в сноске.
- source_word: הֶעְמִיקוּ
  choice: так глубоко
  rationale: Hiphil от עמק буквально передаёт идею углубления. Наречное выражение «так глубоко» естественно по-русски передаёт усилительный смысл при обозначении мятежа.
- source_word: סָרָה
  choice: восстали
  rationale: Слово обозначает отступничество, непокорность или мятеж. «Восстали» передаёт активное противление, не прибегая к более специальному богословскому термину «отпали от веры».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыновья Израиля
  rationale: Буквально воспроизводит мужское множественное число и традиционное родовое обозначение потомков Израиля; более обобщённое «народ Израиля» было бы менее формально точным.
theological_decisions:
- issue: Следует ли прямо назвать Бога или Господа объектом возвращения
  choice: Сохранить относительное обозначение «к Тому»
  alternative: «Вернитесь к Господу»
  rationale: Хотя из контекста ясно, что речь идёт о Боге Израиля, в самом стихе Божье имя или титул отсутствует. Относительный оборот сохраняет форму и сдержанность исходного текста.
- issue: Как передать отношение между возвращением и прежним отступлением
  choice: «к Тому, против Кого… восстали»
  alternative: «к Тому, от Кого… отошли»
  rationale: Основной вариант ясно передаёт направленность мятежа, тогда как альтернативный лучше подчёркивает удаление от Бога. Из-за сжатости еврейского выражения альтернативное понимание сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Написание «Тому, Кого» с прописных букв обозначает ясного из контекста божественного референта, не добавляя отсутствующего в еврейском тексте имени или титула.
