- from: Вернитесь к Тому, против Кого вы так глубоко восстали, сыновья Израиля[a][b].
  to: Вернитесь к Тому, против Кого[a] сыновья Израиля[b] зашли так далеко в своем мятеже.
  rationale: Заменено неестественное «так глубоко восстали» на «зашли так далеко в своем мятеже», что точнее передаёт еврейскую идиому о глубоко зашедшем отступлении. Сохранены относительное обозначение Бога, возможная альтернативная интерпретация и буквальное «сыновья Израиля». Якоря сносок перенесены к тем словам и оборотам, которые они поясняют.
