base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/005.yaml
  text: Like birds hovering[a], so Yahweh of Armies will shield Jerusalem—shielding and delivering, passing over and rescuing.
translation:
  language: ru
  text: 'Как птицы в полёте, так Яхве Воинств защитит Иерусалим: защитит и избавит, пощадит[a] и спасёт.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пройдёт мимо». Также возможно: «защитит». Еврейский глагол, вероятно, отсылает к пасхальному повествованию в книге Исход.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/צִפֳּרִים עָפוֹת
  choice: Как птицы, парящие над гнездом
  rationale: 'Буквально: «как птицы летающие». В контексте защиты образ естественно передаётся как парение птиц над гнездом; слова «над гнездом» эксплицируют подразумеваемую картину, не превращая её в отдельное утверждение исходного текста.'
- source_word: יָגֵן ... גָּנוֹן
  choice: защитит ... защитит
  rationale: Корень גנן означает защищать, укрывать. Повтор сохранён, чтобы передать риторическое усиление еврейского текста; «защитит» звучит естественнее по-русски, чем метафорическое «оградит щитом».
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а צבאות — прозрачным современным соответствием «Воинств», сохраняющим военные и небесные ассоциации титула.
- source_word: עַל יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: При русском переходном глаголе «защитит» объект оформляется без предлога; пространственный оттенок עַל уже поддерживается образом птиц, находящихся над теми, кого они защищают.
- source_word: וְ/הִצִּיל
  choice: и избавит
  rationale: נצל в породе hifil означает избавить, вырвать из опасности. «Избавит» сохраняет отличие от последующего מלט.
- source_word: פָּסֹחַ
  choice: минует
  rationale: Выбор сохраняет основное значение прохождения мимо и вероятную связь с пасхальным повествованием, не устраняя возможного контекстуального смысла «пощадит/защитит».
- source_word: וְ/הִמְלִיט
  choice: и спасёт
  rationale: מלט в породе hifil означает дать ускользнуть, вывести в безопасное место, спасти. «Спасёт» естественно завершает компактную цепь действий и не дублирует дословно «избавит».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. Транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Пасхальная ассоциация глагола פסח
  choice: минует
  alternative: пощадит; защитит
  rationale: '«Минует» сохраняет вероятное эхо Исхода и одновременно оставляет неоднозначность: в данном контексте действие означает защитительное пощажение. Альтернативный смысл отмечен в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и повтор корня גנן сохранены. Образ «над гнездом» делает сравнение понятным обычному читателю, тогда как сноска удерживает лексическую и богословскую неоднозначность פסח.
