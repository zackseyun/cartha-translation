  yaml_path: translation/ot/isaiah/031/002.yaml
  text: Yet he too is wise and brings disaster[a]; he does not take back his words[c][b], but rises against the house of evildoers and against the help of workers of iniquity.
translation:
  language: ru
  text: 'Но и Он мудр: Он наведёт бедствие[a] и не возьмёт назад Своих слов[b]. Он восстанет против дома злодеев и против помощи творящих беззаконие[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «навлечёт несчастье». Еврейское слово может означать «зло» или «бедствие»; в данном контексте оно обозначает карающее бедствие, а не нравственное зло.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не отзовёт Своих слов». Буквально: «не удалит (не отведёт) Своих слов».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «против поддержки творящих беззаконие». В еврейском тексте употреблено отвлечённое существительное «помощь», а не слово «помощники».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם הוּא חָכָם
  choice: Но и Он мудр
  rationale: 'Сочетание «но и» передаёт добавочно-противительный и иронический оттенок контекста: Господь тоже мудр, причём Его мудрость противопоставлена политическим расчётам надеющихся на Египет. Явное местоимение сохранено для эмфазы.'
- source_word: וַיָּבֵא רָע
  choice: Он наведёт бедствие
  rationale: רָע здесь обозначает бедствие как суд, а не нравственное зло. Последовательность древнееврейских форм допускает передачу будущим временем в пророческом контексте; «наведёт» сохраняет активную причинность.
- source_word: וְאֶת־דְּבָרָיו לֹא הֵסִיר
  choice: и не откажется от Своих слов
  rationale: Буквально глагол означает «не удалит/не отведёт»; с объектом «слова» речь идёт о том, что сказанное не будет взято назад или отменено. «Не откажется от Своих слов» естественно по-русски и сохраняет смысл неотменимости.
- source_word: וְקָם עַל
  choice: Он восстанет против
  rationale: קום с עַל выражает враждебное выступление или действие против кого-либо. «Восстанет против» сохраняет образ и судебно-военный оттенок.
- source_word: בֵּית מְרֵעִים
  choice: дома злодеев
  rationale: Сохранён конструктивный оборот «дом злодеев»; «дом» может обозначать дом, сообщество или политическое образование, поэтому неоднозначность не устраняется.
- source_word: עֶזְרַת
  choice: помощи
  rationale: В тексте стоит абстрактное существительное «помощь», а не личное «помощники». Перевод сохраняет это различие и может указывать на поддержку, оказываемую Египтом.
- source_word: פֹּעֲלֵי אָוֶן
  choice: творящих беззаконие
  rationale: Причастный оборот сохраняет деятельный образ выражения «делающие/творящие אָוֶן». «Беззаконие» передаёт нравственную порочность и отличает אָוֶן от רָע в первой части стиха.
theological_decisions:
- issue: Значение רָע применительно к действию Бога
  choice: бедствие
  alternative: зло; несчастье
  rationale: В пророческом контексте слово обозначает губительное бедствие как Божий суд, а не совершение Богом нравственного зла. Это контекстуальное разграничение значений, а не устранение идеи активного Божьего действия.
- issue: Референт местоимения הוּא
  choice: Он, то есть Господь
  alternative: не названный мудрый деятель
  rationale: В контексте местоимение относится к Господу и подчёркивает Его подлинную мудрость в противоположность человеческим расчётам. В основном тексте сохранено местоимение, поскольку референт задаётся контекстом.
- issue: Временная перспектива цепочки וַיָּבֵא ... וְקָם
  choice: будущее пророческое действие
  alternative: 'настоящее обобщённое: «наводит... восстаёт»; совершённое: «навёл... восстал»'
  rationale: В контексте угрозы суда формы описывают предстоящее и непреложное действие Господа. Будущее время естественно для русского текста, при этом примечание отмечает допустимую аспектуально-временную вариативность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Прописная буква в «Он/Своих» показывает контекстуальную отнесённость к Господу, не заменяя местоимение истолковывающим именованием. Параллелизм двух объектов после «против» сохранён; лексика различает судебное «бедствие» (רָע) и нравственное «беззаконие» (אָוֶן).
