  text: כִּ֣י כֹ֣ה אָֽמַר יְהוָ֣ה אֵלַ֡/י כַּ/אֲשֶׁ֣ר יֶהְגֶּה֩ הָ/אַרְיֵ֨ה וְ/הַ/כְּפִ֜יר עַל טַרְפּ֗/וֹ אֲשֶׁ֨ר יִקָּרֵ֤א עָלָי/ו֙ מְלֹ֣א רֹעִ֔ים מִ/קּוֹלָ/ם֙ לֹ֣א יֵחָ֔ת וּ/מֵֽ/הֲמוֹנָ֖/ם לֹ֣א יַֽעֲנֶ֑ה כֵּ֗ן יֵרֵד֙ יְהוָ֣ה צְבָא֔וֹת לִ/צְבֹּ֥א עַל הַר צִיּ֖וֹן וְ/עַל גִּבְעָתָֽ/הּ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/004.yaml
  text: 'For thus Yahweh said to me: As the lion or the young lion growls over its prey[a], and though a band of shepherds is called out against it, it is not terrified by their voice or cowed by their noise[b], so Yahweh of hosts will come down to wage war on Mount Zion and on its hill.'
translation:
  language: ru
  text: 'Ибо так сказал мне Яхве: «Как лев или молодой лев рычит над своей добычей[a] и, хотя против него созвано множество пастухов, не пугается их крика и не робеет перед их шумом[b], так Яхве Воинств сойдёт, чтобы вести битву на горе Сион и на её холме».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лев и молодой лев»; еврейское сочетание можно понимать как поэтическую пару, а не как строгое указание на выбор между двумя животными.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, более буквально: «не отвечает на их шум»; значение еврейского глагола здесь спорно и в данном контексте может обозначать, что лев не поддаётся устрашению или давлению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте, без замены титулом «Господь».
- source_word: יֶהְגֶּה
  choice: рычит
  rationale: В данном образе глагол обозначает низкий угрожающий звук льва над добычей; «рычит» естественно и конкретно передаёт сцену.
- source_word: הָאַרְיֵה וְהַכְּפִיר
  choice: лев или молодой лев
  rationale: Сочетание допускает понимание как поэтической пары или пояснительного дублета; союз «или» естественно представляет единый сравнительный образ, а альтернативное чтение отмечено в сноске.
- source_word: מְלֹא רֹעִים
  choice: множество пастухов
  rationale: מְלֹא указывает на полный состав или большую собравшуюся группу; «множество» ближе к форме источника и сохраняет торжественный регистр.
- source_word: יִקָּרֵא עָלָיו
  choice: против него созвано
  rationale: Пассивная форма קרא передаёт созыв пастухов против льва; русский оборот сохраняет и пассивность, и направленность действия.
- source_word: לֹא יֵחָת
  choice: не пугается
  rationale: Глагол выражает страх или смятение; эта формулировка ясна и уместна в образе бесстрашного льва.
- source_word: לֹא יַעֲנֶה
  choice: не робеет
  rationale: В параллели с «не пугается» вероятен смысл подчинения или устрашения, однако буквальная возможность «не отвечает» сохранена в сноске.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя и военный оттенок титула צְבָאוֹת, особенно значимый рядом с образом сражения.
- source_word: לִצְבֹּא עַל
  choice: чтобы сразиться за
  rationale: Глагол צבא здесь обозначает выступление на битву; предлог עַל в контексте допускает защитный смысл — сражение за Сион, что согласуется с пророческим контекстом, не устраняя полностью образ военного действия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; его транслитерация сохраняет различие между именем и титулом.
- issue: Направленность выражения לִצְבֹּא עַל הַר צִיּוֹן
  choice: сразиться за гору Сион
  alternative: сразиться на горе Сион; воевать против горы Сион
  rationale: Образ льва, не отступающего перед пастухами, в ближайшем контексте указывает на защиту Сиона. Русское «за» передаёт этот смысл, тогда как сама еврейская конструкция допускает более широкую пространственную или враждебную направленность.
- issue: Смысл לֹא יַעֲנֶה
  choice: не робеет от их шума
  alternative: не отвечает на их шум; не смиряется перед их шумом
  rationale: Поэтический параллелизм с «не пугается» поддерживает значение устрашения или подавления, но буквальная семантическая возможность ответа указана в примечании.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Конкретность образа льва сохранена; синтаксис слегка упорядочен ради естественного русского ритма. Все маркеры сносок присутствуют в основном тексте.
