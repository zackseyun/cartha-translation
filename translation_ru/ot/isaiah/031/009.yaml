base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/009.yaml
  text: His rock will pass away because of terror[a], and his princes will be terrified at the signal, declares Yahweh[c][b], whose fire is in Zion and whose furnace is in Jerusalem.
translation:
  language: ru
  text: И твердыня его исчезнет от ужаса[a], и князья его содрогнутся перед знаменем[b], — возвещает Яхве, чей огонь — на Сионе и чья печь — в Иерусалиме[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «скала его». Возможно также: «его оплот исчезнет от ужаса». «Скала» может быть образом убежища, твердыни или правителя Ассирии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «князья его будут повергнуты в смятение от знамени (штандарта)».'
    reason: alternative_reading
  - marker: c
    text: Образы огня и печи Яхве на Сионе и в Иерусалиме, вероятно, указывают на его уничтожающее присутствие в суде, но текст не поясняет их точнее.
    reason: cultural_note
lexical_decisions:
- source_word: וְסַלְעוֹ
  choice: твердыня его
  rationale: Сֶלַע буквально означает «скала, утёс», но здесь, вероятно, метафорически обозначает оплот, убежище или правителя Ассирии. «Твердыня» сохраняет образ прочности и естественно звучит по-русски; буквальная возможность отмечена в сноске.
- source_word: מִמָּגוֹר
  choice: от ужаса
  rationale: Предлог מִן может указывать на причину или исходную точку. «От ужаса» естественно передаёт обе близкие смысловые возможности, не уточняя излишне, исчезает ли твердыня вследствие страха или бежит в страхе.
- source_word: יַעֲבוֹר
  choice: исчезнет
  rationale: Хотя עבר обычно значит «проходить», в данном контексте речь идёт об устранении или исчезновении ассирийской опоры под воздействием Божьего суда.
- source_word: וְחַתּוּ
  choice: содрогнутся
  rationale: חתת в породе qal может означать быть сокрушённым, устрашённым или приведённым в смятение. «Содрогнутся» передаёт сильный страх, сохраняя оттенок внутреннего потрясения.
- source_word: מִנֵּס
  choice: при виде знамени
  rationale: נֵס обозначает знамя, штандарт или сигнальный знак. Контекст допускает страх перед поднятым боевым знаменем; предметный образ сохранён, а не заменён абстрактным «сигналом».
- source_word: שָׂרָיו
  choice: князья его
  rationale: שַׂר может обозначать князя, начальника или военачальника. «Князья» сохраняет широкое значение; военный оттенок определяется контекстом.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана современно и торжественно. Имя יהוה транслитерировано как «Яхве», в соответствии с прямым употреблением заветного имени в исходном тексте.
- source_word: אֲשֶׁר אוּר לוֹ בְצִיּוֹן
  choice: чей огонь — на Сионе
  rationale: אוּר здесь означает «огонь», что подтверждается параллелью с תַּנּוּר. Притяжательная конструкция естественно передана словом «чей».
- source_word: וְתַנּוּר לוֹ בִּירוּשָׁלִָם
  choice: и чья печь — в Иерусалиме
  rationale: תַּנּוּר буквально означает печь или горн. «Печь» сохраняет конкретный исходный образ и его параллелизм с огнём, не превращая метафору сразу в толкование.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон. «Яхве» сохраняет личное заветное имя и соответствует предоставленному доктринальному решению.
- issue: Смысл образов огня и печи
  choice: Сохранить образы без узкого истолкования
  alternative: Прямо назвать жертвенник, Божье присутствие или эсхатологический суд
  rationale: Огонь и печь могут указывать на уничтожающее присутствие Яхве в суде, однако сам стих не отождествляет их однозначно с жертвенником или определённым этапом суда.
- issue: Референт «твердыни его»
  choice: Не уточнять в основном тексте, идёт ли речь об убежище, оплоте или правителе Ассирии
  alternative: Перевести как «его правитель» либо «его убежище»
  rationale: Метафора סֶלַע допускает несколько контекстуально правдоподобных референтов. Сноска сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Порядок частей и параллелизм еврейского текста в основном сохранены; архаизмы сведены к минимуму. «Твердыня» выбрана как понятное образное слово, а буквальное «скала» вынесено в сноску.
