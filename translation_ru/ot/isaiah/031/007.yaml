source:
  edition: WLC
  text: כִּ֚י בַּ/יּ֣וֹם הַ/ה֔וּא יִמְאָס֗וּ/ן אִ֚ישׁ אֱלִילֵ֣י כַסְפּ֔/וֹ וֶ/אֱלִילֵ֖י זְהָב֑/וֹ אֲשֶׁ֨ר עָשׂ֥וּ לָ/כֶ֛ם יְדֵי/כֶ֖ם חֵֽטְא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/007.yaml
  text: For on that day each man will reject his idols of silver and his idols of gold, which your hands have made for you as sin.
translation:
  language: ru
  text: Ибо в тот день каждый отвергнет своих серебряных и золотых идолов, которых ваши руки сделали вам во грех.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально заключительное еврейское слово — «грех»; оно может относиться к изготовлению идолов как к греховному поступку или его результату.
    reason: Поясняет необычную и неоднозначную синтаксическую роль חֵטְא, не устраняя её в основном тексте.
lexical_decisions:
- source_word: יִמְאָסוּן
  choice: отвергнет
  rationale: Глагол מאס означает решительно отвергать, отказываться от чего-либо; форма во множественном числе согласуется по смыслу с собирательным אִישׁ — «каждый».
- source_word: אִישׁ
  choice: каждый
  rationale: 'В сочетании с глаголом во множественном числе слово имеет распределительное значение: каждый человек из народа.'
- source_word: אֱלִילֵי כַסְפּוֹ וֶאֱלִילֵי זְהָבוֹ
  choice: своих серебряных и золотых идолов
  rationale: Сохраняются материал идолов и притяжательные суффиксы третьего лица единственного числа, соотносящиеся с «каждый».
- source_word: אֲשֶׁר עָשׂוּ לָכֶם יְדֵיכֶם
  choice: которых ваши руки сделали вам
  rationale: Буквальный образ рук как действующего лица сохранён; переход от единственного числа «каждый» к множественному «ваши» отражает такой же переход в еврейском тексте.
- source_word: חֵטְא
  choice: во грех
  rationale: Краткое именное завершение оригинала синтаксически напряжённо; русский оборот передаёт результат или нравственный характер изготовления идолов, не превращая слово явно в определение самих идолов.
theological_decisions:
- issue: Синтаксическая связь слова חֵטְא («грех»)
  choice: «сделали вам во грех»
  alternative: «сделали себе, согрешая»; «греховно сделали для себя»; «сделали вам как грех»
  rationale: 'В еврейском тексте חֵטְא стоит в конце без предлога, поэтому его точная связь неоднозначна: оно может характеризовать изготовление идолов как грех, его результат или сами идолы. Формулировка сохраняет эту напряжённость настолько, насколько позволяет естественный русский язык.'
translation_notes:
  register: Современный литературный русский язык с библейски достойным, но понятным синтаксисом. «Ибо» сохраняет причинную связь כִּי с предыдущим контекстом; распределительное «каждый» естественно передаёт сочетание אִישׁ с глаголом во множественном числе.
