  to: Праведник гибнет, и никто не принимает этого близко к сердцу; людей, исполненных неизменной любви, забирают, и никто не понимает, что праведника забирают от зла[a].
  rationale: Правка уточняет передачу חֶסֶד и делает перевод повторённых пассивных форм אסף более естественным, сохраняя их эвфемистический смысл удаления/смерти и не называя деятеля. Основное «от зла» не разрешает спорную семантику רָעָה, а сноска сохраняет альтернативу «бедствие» и контекстуально возможное значение грядущей беды.
