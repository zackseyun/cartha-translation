source:
  edition: WLC
  text: הַ/צַּדִּ֣יק אָבָ֔ד וְ/אֵ֥ין אִ֖ישׁ שָׂ֣ם עַל לֵ֑ב וְ/אַנְשֵׁי חֶ֤סֶד נֶֽאֱסָפִים֙ בְּ/אֵ֣ין מֵבִ֔ין כִּֽי מִ/פְּנֵ֥י הָ/רָעָ֖ה נֶאֱסַ֥ף הַ/צַּדִּֽיק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/001.yaml
  text: The righteous man perishes[a], and no one takes it to heart; men of faithful love are gathered away, with no one understanding that the righteous man is gathered away because of evil.
translation:
  language: ru
  text: Праведник гибнет, и никто не принимает этого близко к сердцу; людей, исполненных неизменной любви, забирают, и никто не понимает, что праведника забирают от зла[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от бедствия»; возможно: «от грядущей беды».'
    reason: Слово רָעָה может означать и зло, и бедствие; выражение מִפְּנֵי допускает смысл удаления от него, в том числе до его наступления.
lexical_decisions:
- source_word: הַצַּדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода в единственном числе естественно и точно передаётся русским существительным «праведник».
- source_word: אָבָד
  choice: погибает
  rationale: Форма может обозначать гибель или исчезновение; настоящее время сохраняет силу пророческого плача и не уточняет способ смерти.
- source_word: שָׂם עַל לֵב
  choice: принимает этого близко к сердцу
  rationale: Современный русский фразеологизм передаёт не просто размышление, а серьёзное внутреннее внимание к происходящему.
- source_word: אַנְשֵׁי חֶסֶד
  choice: людей, хранящих верность
  rationale: Так передаётся существенный оттенок חסד — стойкая, деятельная верность; формулировка остаётся естественной и не вводит явно не названный объект верности.
- source_word: נֶאֱסָפִים / נֶאֱסַף
  choice: уносят / унесён
  rationale: Пассивные формы אסף здесь служат эвфемизмом смерти или удаления. Повтор одного русского корня сохраняет композиционную связь обеих частей стиха.
- source_word: בְּאֵין מֵבִין
  choice: и никто не понимает
  rationale: 'Естественно передаёт сопутствующее обстоятельство: это происходит при полном непонимании окружающих.'
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, чего никто не понимает.
- source_word: מִפְּנֵי הָרָעָה
  choice: от зла
  rationale: Краткая формулировка сохраняет пространственный оттенок удаления и смысловую широту רָעָה, которое может означать как нравственное зло, так и бедствие.
theological_decisions:
- issue: Означает ли הָרָעָה нравственное зло или грядущее бедствие
  choice: от зла
  alternative: от бедствия; от грядущей беды
  rationale: Контекст допускает мысль о том, что праведник удаляется до грядущего суда или бедствия, однако само слово сохраняет более широкий смысл. Основной текст не сужает значение, а вероятный контекстуальный смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм и повтор глагола удаления сохранены без неестественной буквальности «собираются / собран».
