  text: דְּרָכָ֥י/ו רָאִ֖יתִי וְ/אֶרְפָּאֵ֑/הוּ וְ/אַנְחֵ֕/הוּ וַ/אֲשַׁלֵּ֧ם נִֽחֻמִ֛ים ל֖/וֹ וְ/לַ/אֲבֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/018.yaml
  text: I have seen his ways[a], and I will heal him; I will lead him and restore comforts to him and to his mourners.
translation:
  language: ru
  text: Я видел его пути и исцелю его; поведу его и возвращу ему и его скорбящим утешения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское существительное стоит во множественном числе: «утешения», «утешения и поддержка». Возможен более идиоматичный перевод в единственном числе: «возвращу ему и его скорбящим утешение».'
    reason: Лексическая и стилистическая альтернатива для וַאֲשַׁלֵּם נִחֻמִים.
lexical_decisions:
- source_word: דְּרָכָיו
  choice: его пути
  rationale: Множественное число דֶּרֶךְ здесь обозначает образ жизни и поступки человека. «Его пути» сохраняет еврейский образ и его нравственный оттенок, не добавляя прямо не названного покаяния.
- source_word: רָאִיתִי
  choice: Я видел
  rationale: 'Перфект передан прошедшим временем с сохраняющейся актуальностью: Богу известен образ жизни человека, которому Он обещает исцеление.'
- source_word: וְאֶרְפָּאֵהוּ
  choice: и исцелю его
  rationale: רפא обычно означает «исцелять»; это слово сохраняет как прямой, так и переносный смысл восстановления.
- source_word: וְאַנְחֵהוּ
  choice: Я поведу его
  rationale: Порода hifil глагола נחה означает «вести, направлять». «Поведу» передаёт личное Божье руководство и естественно звучит по-русски.
- source_word: וַאֲשַׁלֵּם
  choice: и воздам
  rationale: Piel глагола שׁלם может означать «воздать, восполнить, восстановить». «Воздам» сохраняет смысл предоставления человеку того, что восполняет пережитую скорбь, не превращая выражение в буквальную выплату долга.
- source_word: נִחֻמִים
  choice: утешениями
  rationale: 'Сохранено множественное число еврейского существительного: речь может идти о многократных или разнообразных проявлениях утешения.'
- source_word: לּוֹ וְלַאֲבֵלָיו
  choice: ему и тем, кто скорбит о нём
  rationale: Первый ל обозначает получателя, а אֲבֵלָיו — связанных с ним скорбящих. Развёрнутая формулировка яснее современному русскому читателю, чем двусмысленное «его скорбящим».
theological_decisions:
- issue: Нравственный смысл слов «его пути» перед обещанием восстановления
  choice: Сохранено утверждение, что Бог видел пути человека и всё же обещает исцелить его.
  alternative: Можно было нейтрализовать выражение как «его путь» или истолковать его как прямое указание на покаяние.
  rationale: Сам стих не называет покаяния прямо. Тире подчёркивает неожиданный переход к милости, но не объясняет его богословски и не снимает напряжения текста.
- issue: К кому относятся «скорбящие»
  choice: «Те, кто скорбит о нём» — люди, связанные с исцеляемым человеком и скорбящие из-за него или о нём.
  alternative: «Его скорбящие» либо «скорбящие вместе с ним».
  rationale: Суффикс в וְלַאֲבֵלָיו выражает принадлежность или связь, не уточняя её точнее. Русская формулировка передаёт наиболее прямой реляционный смысл, не отождествляя скорбящих с самим человеком.
translation_notes:
  register: Современный литературный и возвышенный регистр. Параллельные формы «исцелю» и «поведу» сохраняют пророческий ритм; тире передаёт резкий, значимый переход от Божьего знания человеческих путей к обещанию милости.
