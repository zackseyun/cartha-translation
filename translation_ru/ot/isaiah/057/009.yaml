base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/009.yaml
  text: You journeyed to the king with oil[a], and multiplied your perfumes; you sent your envoys far away[b], and debased yourself even to Sheol.
translation:
  language: ru
  text: Ты отправилась к царю[a] с маслом и умножила свои благовония; ты послала своих послов далеко и унизила себя до самого Шеола[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также понимание: «к Молоху», если слово «царь» служит намёком на имя этого божества.'
    reason: alternative_reading
  - marker: b
    text: Шеол — мир мёртвых.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּשֻׁרִי
  choice: ты отправлялась
  rationale: Глагол труден для толкования; в сочетании с «к царю», маслом и послами наиболее вероятно движение или приближение. «Отправлялась» естественно передаёт целенаправленную поездку, не устраняя неоднозначность контекста.
- source_word: לַמֶּלֶךְ
  choice: к царю
  rationale: Масоретский текст буквально означает «к царю». Возможный намёк на Молоха сохранён в сноске, а не внесён в основной текст.
- source_word: בַּשֶּׁמֶן
  choice: с маслом
  rationale: Сохранено конкретное значение שֶׁמֶן; в данном контексте это могло быть ароматическое масло, связанное с дарами, ухаживанием или культовой практикой.
- source_word: וַתַּרְבִּי רִקֻּחָיִךְ
  choice: умножала свои благовония
  rationale: Переданы как значение רבה — «умножать», так и значение רִקֻּחִים — составные ароматические смеси. Формулировка сохраняет образ избыточных приготовлений.
- source_word: צִרַיִךְ
  choice: своих послов
  rationale: Слово обозначает посланцев или уполномоченных представителей; «послы» соответствует вероятному дипломатическому оттенку.
- source_word: עַד מֵרָחֹק
  choice: далеко
  rationale: Естественная русская передача указания на большое расстояние.
- source_word: וַתַּשְׁפִּילִי
  choice: унижала себя
  rationale: В контексте пророческого обличения глагол обозначает не добродетельное смирение, а самоунижение и нравственное падение.
- source_word: עַד שְׁאוֹל
  choice: до самого шеола
  rationale: Термин «шеол» сохранён как обозначение мира мёртвых, а усилительная конструкция передана словами «до самого».
theological_decisions:
- issue: Следует ли понимать לַמֶּלֶךְ как «к царю» или как намёк на Молоха
  choice: 'В основном тексте: «к царю»'
  alternative: «к Молоху»
  rationale: Еврейский текст непосредственно читает «к царю» и допускает образ политической либо религиозной неверности. Традиционная возможность намёка на Молоха отмечена в сноске без подмены основного чтения.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого тона. Формы женского рода передают обращение еврейского текста к олицетворённой неверной общине. Повтор «ты» сохраняет обвинительный ритм стиха.
