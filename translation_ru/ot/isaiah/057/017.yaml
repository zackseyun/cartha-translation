  text: בַּ/עֲוֺ֥ן בִּצְע֛/וֹ קָצַ֥פְתִּי וְ/אַכֵּ֖/הוּ הַסְתֵּ֣ר וְ/אֶקְצֹ֑ף וַ/יֵּ֥לֶךְ שׁוֹבָ֖ב בְּ/דֶ֥רֶךְ לִבּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/017.yaml
  text: Because of the iniquity of his unjust gain I was angry[a], and I struck him; I hid myself and was angry[b], and he went on backsliding in the way of his heart.
translation:
  language: ru
  text: Из-за его неправедной наживы Я разгневался[a] и поразил его; Я скрылся и гневался[b], и он продолжал своевольно идти путём своего сердца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за его корыстолюбия». Еврейское слово может означать и алчное желание, и прибыль, полученную из корысти.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я скрыл Своё лицо и гневался». Выражение «скрыть лицо» — распространённый библейский оборот, хотя слово «лицо» здесь в еврейском тексте прямо не употреблено.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲוֺן
  choice: За грех
  rationale: Предлог ב в данном контексте выражает причину Божьего гнева; «за грех» естественно передаёт причинно-карательную связь и сохраняет существительное עָוֺן.
- source_word: בִּצְעוֹ
  choice: его корыстной наживы
  rationale: בֶּצַע может обозначать как алчное стремление, так и прибыль, добытую корыстным или неправедным путём. «Корыстная нажива» сохраняет конкретный экономический и нравственный оттенки.
- source_word: קָצַפְתִּי / וְאֶקְצֹף
  choice: Я разгневался / и гневался
  rationale: קצף обозначает гнев. Повтор корня сохранён, но формы слегка варьируются ради естественного русского синтаксиса.
- source_word: וְאַכֵּהוּ
  choice: и поразил его
  rationale: Каузативная форма נכה означает нанести удар, поразить. «Поразил» соответствует возвышенному, но современно понятному библейскому регистру.
- source_word: הַסְתֵּר
  choice: Я скрылся
  rationale: Инфинитив абсолютный употреблён эллиптически или обстоятельственно. Перевод не добавляет отсутствующего в еврейском тексте слова «лицо».
- source_word: וַיֵּלֶךְ שׁוֹבָב
  choice: а он продолжал упрямо идти
  rationale: Сочетание выражает продолжающееся своевольное отступление. «Продолжал ... идти» передаёт длительность, а «упрямо» — непокорность שׁוֹבָב без узкоконфессионального термина «отступничество».
- source_word: בְּדֶרֶךְ לִבּוֹ
  choice: путём своего сердца
  rationale: Сохранён образ пути как поведения, направляемого внутренними желаниями и волей человека.
theological_decisions:
- issue: Выражение Божьей сокрытости в הַסְתֵּר
  choice: Я скрылся
  alternative: Я скрыл Своё лицо
  rationale: Слово «лицо» в еврейском тексте прямо не выражено, хотя такая формула хорошо известна в библейской речи. Основной текст сохраняет краткость оригинала, а традиционное раскрытие дано в сноске.
- issue: Предмет осуждения в בִּצְעוֹ
  choice: его корыстная нажива
  alternative: его корыстолюбие
  rationale: Еврейское слово допускает как конкретное значение неправедной прибыли, так и внутреннюю алчность. Основной вариант сохраняет предметный смысл, не устраняя лексическую неоднозначность, которая отмечена в сноске.
- issue: Связь последней части стиха
  choice: а он продолжал
  alternative: и он продолжал
  rationale: Еврейский ו допускает контекстуально-противительное русское «а». Оно подчёркивает напряжение между Божьим наказанием и продолжающимся своеволием человека, не превращая связь в резкое «но».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность еврейских предложений; повторы глагола гнева и образы сокрытия, пути и сердца удержаны. Терминология понятна широкому читателю и не вводит конфессионально специфических толкований.
