  text: כִּ֣י לֹ֤א לְ/עוֹלָם֙ אָרִ֔יב וְ/לֹ֥א לָ/נֶ֖צַח אֶקְּצ֑וֹף כִּי ר֨וּחַ֙ מִ/לְּ/פָנַ֣/י יַֽעֲט֔וֹף וּ/נְשָׁמ֖וֹת אֲנִ֥י עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/016.yaml
  text: For I will not contend forever[a], nor will I be angry without end, for the spirit would grow faint before me[b], and the breaths that I have made.
translation:
  language: ru
  text: Ведь Я не буду вечно вести тяжбу[a] и не буду бесконечно гневаться, ибо дух[b] изнемог бы предо Мной, и дыхания[c], которые Я создал, изнемогли бы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «состязаться», «обвинять». Еврейский глагол может относиться как к противоборству, так и к ведению тяжбы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дыхание». Еврейское רוּחַ может означать «дух», «дыхание» или «ветер»; здесь речь идёт о жизненной силе сотворённой жизни, а не о Святом Духе.'
    reason: lexical_alternative
  - marker: c
    text: 'Или более толковательно: «души» или «жизни». Еврейское נְשָׁמוֹת буквально означает «дыхания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעוֹלָם
  choice: вечно
  rationale: В отрицательной конструкции обозначает неограниченную длительность; «не вечно» естественно передаёт смысл и сохраняет параллелизм.
- source_word: אָרִיב
  choice: вести тяжбу
  rationale: Глагол ריב может обозначать спор, противоборство или судебную тяжбу. Это выражение сохраняет юридико-обличительный оттенок, не сводя его исключительно к формальному суду.
- source_word: לָנֶצַח
  choice: бесконечно
  rationale: Синонимично לְעוֹלָם в поэтическом параллелизме; иной русский эквивалент позволяет избежать тяжеловесного повтора.
- source_word: אֶקְּצֹף
  choice: гневаться
  rationale: Прямо и естественно передаёт глагол со значением гнева, сохраняя достойный современный регистр.
- source_word: רוּחַ
  choice: дух
  rationale: В контексте речь идёт о данном Богом жизненном духе человека, а не о Святом Духе; «дух» сохраняет антропологическую широту еврейского слова.
- source_word: מִלְּפָנַי
  choice: предо Мной
  rationale: Идиоматически передаёт «передо Мной / в Моём присутствии» и соответствует возвышенному, но понятному регистру.
- source_word: יַעֲטוֹף
  choice: изнемогут
  rationale: Глагол עטף выражает ослабление, угасание сил или обморочное состояние. Множественное число обусловлено естественным русским согласованием с объединённым подлежащим «дух и дыхания».
- source_word: נְשָׁמוֹת
  choice: дыхания
  rationale: Буквальное значение сохраняет образ жизненного дыхания и связь с Божьим творением; более толковательные варианты «души» и «жизни» вынесены в примечание.
- source_word: אֲנִי עָשִׂיתִי
  choice: которые Я создал
  rationale: Передаёт личное местоимение אֲנִי и совершённое действие עשה. «Создал» по-русски естественно в отношении дарованного Богом дыхания жизни.
theological_decisions:
- issue: Антропологический смысл רוּחַ и נְשָׁמוֹת
  choice: Передать как человеческий «дух» и сотворённые Богом «дыхания».
  alternative: Понимать оба слова более толковательно как «души» или «жизни» либо перевести רוּחַ как «дыхание».
  rationale: Контекст объясняет ограничение Божьего гнева немощью сотворённой жизни. Здесь нет достаточного основания видеть указание на Святого Духа или вводить строго определённую антропологическую систему.
- issue: Синтаксическая связь וּנְשָׁמוֹת אֲנִי עָשִׂיתִי
  choice: Понять «дыхания, которые Я создал» как вторую часть составного подлежащего при глаголе «изнемочь».
  alternative: 'Понять выражение как пояснительное присоединение к «духу»: «дух — дыхания, которые Я создал».'
  rationale: Союз ו естественно допускает координацию, хотя краткая поэтическая конструкция оставляет оттенок пояснения. Перевод сохраняет обе группы образов, не отождествляя их жёстко.
- issue: Причинно-следственная связь второго כִּי
  choice: Передать как «иначе», выражая результат непрекращающегося гнева.
  alternative: 'Перевести буквально-причинно: «ибо дух… изнеможет».'
  rationale: В данном контексте причина Божьего решения не гневаться бесконечно состоит в том, что при ином развитии сотворённая жизнь изнеможет. «Иначе» ясно выражает эту логику по-русски, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «буду Я» и форма «предо Мной» поддерживают достоинство речи, оставаясь понятными. Порядок последней части слегка перестроен ради естественного русского согласования; образ «духа и дыханий» сохранён.
