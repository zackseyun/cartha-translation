  text: אֵ֣ין שָׁל֔וֹם אָמַ֥ר אֱלֹהַ֖/י לָ/רְשָׁעִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/021.yaml
  text: There is no peace," says my God[b][a], "for the wicked.
translation:
  language: ru
  text: «Нет мира[b], — говорит мой Бог[a], — нечестивым».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В Ис 48:22 сказано почти так же: «Нет мира нечестивым, — говорит Господь». Здесь в еврейском тексте стоит «мой Бог».'
    reason: cross_reference
  - marker: b
    text: 'Или: «благополучия», «целостности». Еврейское шалом имеет более широкий смысл, чем отсутствие вражды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: нет
  rationale: Экзистенциальное отрицание естественно и точно передаётся русским «нет», сохраняя категоричность высказывания.
- source_word: שָׁלוֹם
  choice: мира
  rationale: «Мир» — основное соответствие; здесь оно также допускает более широкий смысл благополучия и целостности, свойственный еврейскому слову.
- source_word: אָמַר
  choice: говорит
  rationale: Хотя форма глагола перфектная, в формуле пророческого изречения настоящее время по-русски естественно передаёт актуальное Божье утверждение.
- source_word: אֱלֹהַי
  choice: мой Бог
  rationale: Сохранено местоименное окончание первого лица единственного числа без гармонизации с Ис 48:22.
- source_word: לָרְשָׁעִים
  choice: нечестивым
  rationale: 'Русский дательный падеж естественно выражает отношение: мира нет для тех, кто назван нечестивыми. «Нечестивые» сохраняет нравственную характеристику רְשָׁעִים без лишнего уточнения.'
theological_decisions:
- issue: Обозначение говорящего в формуле Божьего изречения
  choice: «мой Бог» согласно масоретскому тексту
  alternative: «Господь» по уподоблению Ис 48:22 или «Бог» без притяжательного местоимения
  rationale: В WLC стоит אֱלֹהַי, буквально «мой Бог». Перевод сохраняет первое лицо и не согласует стих с близким параллельным местом.
translation_notes:
  register: Краткое, торжественное пророческое изречение на современном литературном русском языке. Порядок слов и рамочная конструкция с авторской ремаркой сохраняют выразительность оригинала; архаизмы не используются.
