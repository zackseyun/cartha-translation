base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/015.yaml
  text: 'For thus says the One who is high and lifted up[a], who inhabits eternity, whose name is Holy: “I dwell in the high and holy place, and also with the crushed and lowly in spirit[b], to revive the spirit of the lowly and to revive the heart of the crushed.”'
translation:
  language: ru
  text: 'Ибо так говорит Высокий и Вознесённый, живущий вечно[a], чьё имя свято: «Я обитаю в высоком и святом месте, а также с сокрушёнными и смиренными духом[b], чтобы оживлять дух смиренных и оживлять сердце сокрушённых».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обитающий в вечности». Еврейское выражение может подчёркивать как вечную продолжительность, так и пребывание в вечности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «со сломленными и смиренными духом». Слово «сокрушённые» передаёт образ тех, кто раздавлен или сломлен, и не обязательно означает только раскаяние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָם וְנִשָּׂא
  choice: Высокий и Вознесённый
  rationale: Сохраняет парное описание Божьего величия и характерный для Исаии вертикальный образ, не сводя его лишь к отвлечённому понятию превосходства.
- source_word: שֹׁכֵן עַד
  choice: живущий вечно
  rationale: Естественно передаёт возможное значение непрерывного вечного существования; альтернативное пространственно-образное понимание «обитающий в вечности» отмечено в сноске.
- source_word: קָדוֹשׁ שְׁמוֹ
  choice: чьё имя свято
  rationale: Передаёт именную предикативную конструкцию без превращения слова «Святой» в однозначное собственное имя.
- source_word: מָרוֹם וְקָדוֹשׁ אֶשְׁכּוֹן
  choice: Я обитаю в высоком и святом месте
  rationale: Слово «месте» восполняется для естественности русского языка; сохраняются высота, святость и связь глагола обитания с предыдущим שֹׁכֵן.
- source_word: דַּכָּא / נִדְכָּאִים
  choice: сокрушённый / сокрушённые
  rationale: Сохраняет прямой образ раздавленности и внутренней сломленности, не сужая смысл исключительно до покаяния.
- source_word: שְׁפַל רוּחַ / רוּחַ שְׁפָלִים
  choice: смиренный дух / дух смиренных
  rationale: Естественно выражает внутреннюю приниженность или смирение и сохраняет слово «дух» в обеих частях стиха.
- source_word: לְהַחֲיוֹת
  choice: оживлять
  rationale: Передаёт каузативное значение «возвращать к жизни, давать новую жизненную силу», не навязывая здесь смысл телесного воскресения.
- source_word: לֵב נִדְכָּאִים
  choice: сердце сокрушённых
  rationale: Сохраняет библейский антропологический образ сердца и лексическую связь נִדְכָּאִים с דַּכָּא.
theological_decisions:
- issue: Божественная трансцендентность и близость к униженным
  choice: Сохранено прямое соседство Божьего обитания в высоком и святом месте с Его пребыванием с сокрушённым и смиренным.
  alternative: Ослабить одно из утверждений или истолковать пребывание с сокрушённым лишь метафорически.
  rationale: Еврейский текст намеренно соединяет оба утверждения; перевод не должен устранять это богословское напряжение.
- issue: Значение דַּכָּא / נִדְכָּאִים
  choice: сокрушённый / сокрушённые
  alternative: кающийся / кающиеся; раскаявшийся / раскаявшиеся; сломленный / сломленные
  rationale: Корень непосредственно выражает сокрушённость или раздавленность. Покаянный смысл возможен в контексте, но не должен безоговорочно вноситься в само слово.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. Повтор «оживлять» сохранён ради параллелизма оригинала; повторяющиеся «дух» и «сердце» не заменены отвлечёнными психологическими терминами.
