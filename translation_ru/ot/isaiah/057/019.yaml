source:
  edition: WLC
  text: בּוֹרֵ֖א נוב שְׂפָתָ֑יִם שָׁל֨וֹם שָׁל֜וֹם לָ/רָח֧וֹק וְ/לַ/קָּר֛וֹב אָמַ֥ר יְהוָ֖ה וּ/רְפָאתִֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/019.yaml
  text: 'Creating the fruit of the lips: Peace[a], peace to the one far off and to the one near, says Yahweh[c][b], and I will heal him.'
translation:
  language: ru
  text: 'Я творю плод уст[a]: «Мир, мир[b] дальнему и ближнему[c], — говорит Яхве, — и Я исцелю его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «произведение уст»; речь идёт о том, что рождают уста, вероятно о словах хвалы или исповедания.'
    reason: lexical_alternative
  - marker: b
    text: Повтор «мир, мир» передаёт еврейское усиление.
    reason: lexical_alternative
  - marker: c
    text: «Дальний и ближний» в ближайшем контексте могут означать рассеянных и находящихся рядом членов Божьего народа; позднее Писание употребляет это выражение и в более широком смысле.
    reason: cross_reference
lexical_decisions:
- source_word: בּוֹרֵא
  choice: Я творю
  rationale: Причастие qal от ברא продолжает речь Яхве и называет его действующим лицом. В русском конечная форма «Я творю» естественнее сохраняет связь с последующим «Я исцелю», не устраняя сжатости еврейского выражения.
- source_word: נוב שְׂפָתָיִם
  choice: плод уст
  rationale: Образно обозначает то, что производят уста, то есть произносимые слова; буквальный образ сохранён, поскольку уточнение «хвала» было бы более узким толкованием.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: Мир, мир
  rationale: Сохранён еврейский повтор, усиливающий обещание. «Мир» передаёт широкий смысл שָׁלוֹם — целостность, благополучие и восстановленные отношения, — не сводя его лишь к спокойствию.
- source_word: לָרָחוֹק וְלַקָּרוֹב
  choice: дальнему и ближнему
  rationale: Субстантивированные прилагательные в единственном числе переданы естественной русской формой; предлог ל указывает на адресатов возвещаемого мира.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Формула пророческого провозглашения естественно передаётся настоящим временем, а личное имя יהוה — принятой русской транслитерацией «Яхве».
- source_word: וּרְפָאתִיו
  choice: и Я исцелю его
  rationale: רפא означает «исцелять» и здесь допускает как собственно исцеление, так и более широкое восстановление. Будущее время согласуется с обещанием в контексте.
theological_decisions:
- issue: Кого обозначают «дальний» и «ближний»
  choice: Оставить обозначения без уточнения личности или принадлежности адресатов
  alternative: Явно назвать рассеянных и находящихся рядом израильтян либо иудеев и язычников
  rationale: Ближайший контекст допускает понимание как рассеянных и оставшихся рядом членов Божьего народа, тогда как позднейшее Писание применяет эту формулу шире. Сам стих не определяет группы, поэтому перевод сохраняет эту открытость.
- issue: Смысл «плода уст»
  choice: Сохранить образ без сведения его исключительно к хвале
  alternative: Перевести как «хвалу уст» или «исповедание уст»
  rationale: Выражение относится к тому, что производят уста, но в данном стихе не называет однозначно конкретный вид речи. Более узкий вариант снял бы подлинную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены образ «плода уст», emphатический повтор и неопределённость выражения «дальний и ближний».
