  text: בְּ/זַֽעֲקֵ/ךְ֙ יַצִּילֻ֣/ךְ קִבּוּצַ֔יִ/ךְ וְ/אֶת כֻּלָּ֥/ם יִשָּׂא ר֖וּחַ יִקַּח הָ֑בֶל וְ/הַ/חוֹסֶ֥ה בִ/י֙ יִנְחַל אֶ֔רֶץ וְ/יִירַ֖שׁ הַר קָדְשִֽׁ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/013.yaml
  text: When you cry out[a], let your gathered idols rescue you! But the wind will carry all of them off; a breath will take them away[c][b]. But whoever takes refuge in me will inherit the land and possess my holy mountain.
translation:
  language: ru
  text: Когда ты воззовёшь, пусть тебя спасёт всё, что ты собрала![a] Но ветер унесёт их всех, дуновение развеет их.[b] А тот, кто ищет убежища во Мне, получит землю[c] в наследие и овладеет Моей святой горой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твои собрания» или «то, что ты собрала». Вероятно, имеются в виду идолы либо другие ложные опоры, в том числе союзники.'
    reason: lexical_alternative
  - marker: b
    text: Слова «ветер» и «дуновение» образуют поэтическую пару, подчёркивая, как легко исчезнет всё, на что она надеялась.
    reason: cultural_note
  - marker: c
    text: Еврейское слово может означать как конкретную землю, так и землю вообще; здесь упоминание святой горы поддерживает значение обетованной земли.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזַעֲקֵךְ
  choice: Когда ты воззовёшь
  rationale: Предлог בְּ при форме זַעֲקֵךְ передаёт временное обстоятельство. «Воззовёшь» сохраняет смысл настойчивого крика о помощи и соответствует возвышенному, но понятному пророческому регистру.
- source_word: יַצִּילֻךְ
  choice: пусть спасут тебя
  rationale: Форма имперфекта в данном контексте звучит как иронический вызов, а не как нейтральное предсказание.
- source_word: קִבּוּצַיִךְ
  choice: собранные тобой
  rationale: Буквально речь идёт о собранных вместе лицах или предметах. Формулировка сохраняет неоднозначность еврейского текста; вероятный контекстуальный референт поясняется в сноске.
- source_word: וְאֶת־כֻּלָּם
  choice: их всех
  rationale: Прямое дополнение отсылает ко всему собранному, на что адресат надеется.
- source_word: יִשָּׂא רוּחַ
  choice: ветер унесёт
  rationale: רוּחַ здесь естественно означает «ветер» и образует поэтическую пару с הָבֶל. Глагол נשׂא передан как «унести» в соответствии с образом полного исчезновения.
- source_word: יִקַּח הָבֶל
  choice: дуновение заберёт
  rationale: הָבֶל может означать дыхание, пар или тщету; параллелизм с «ветром» поддерживает конкретный образ лёгкого дуновения.
- source_word: וְהַחוֹסֶה בִי
  choice: А тот, кто ищет убежища во Мне
  rationale: Причастие выражает устойчивую направленность доверия и поиск защиты. «Тот, кто» сохраняет обобщённое значение единственного числа.
- source_word: יִנְחַל אֶרֶץ
  choice: получит землю в наследие
  rationale: נחל обозначает получение наследственного владения. «Земля» сохраняет возможную связь с обетованной землёй, не устраняя полностью более широкое значение слова אֶרֶץ.
- source_word: וְיִירַשׁ הַר קָדְשִׁי
  choice: и овладеет Моей святой горой
  rationale: ירשׁ означает вступить во владение или получить в наследие. «Овладеет» избегает тяжёлого повтора и сохраняет смысл обладания; святая гора в контексте — Сион.
theological_decisions:
- issue: Кого или что обозначает קִבּוּצַיִךְ
  choice: В основном тексте сохранено нейтральное «собранные тобой»
  alternative: «собранные тобой идолы» или «собранные тобой союзники»
  rationale: Контекст главы прежде всего указывает на идолов и иные ложные опоры, однако само слово не называет их прямо. Поэтому перевод не превращает вероятное толкование в однозначное содержание текста.
- issue: Значение אֶרֶץ
  choice: «земля» с вероятным значением обетованной земли
  alternative: «вся земля» или «мир»
  rationale: Упоминание святой горы и тема наследования поддерживают локально-заветный смысл, но сноска отмечает более широкую лексическую возможность.
translation_notes:
  register: Современный литературный русский язык с dignified пророческим звучанием. Женский род адресата, выраженный в еврейских суффиксах, естественно отражён формой «собранные тобой», тогда как другие глагольные формы прошедшего рода не требуют. Заглавные буквы в местоимении «Мне» и притяжательном «Моей» соответствуют принятому русскому библейскому оформлению.
