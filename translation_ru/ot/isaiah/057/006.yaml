  text: בְּ/חַלְּקֵי נַ֣חַל חֶלְקֵ֔/ךְ הֵ֥ם הֵ֖ם גּוֹרָלֵ֑/ךְ גַּם לָ/הֶ֞ם שָׁפַ֥כְתְּ נֶ֨סֶךְ֙ הֶעֱלִ֣ית מִנְחָ֔ה הַ֥/עַל אֵ֖לֶּה אֶנָּחֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/006.yaml
  text: Among the smooth stones of the valley is your portion[a]; they, they are your lot. Even to them you have poured out a drink offering; you have offered up a grain offering[b]. Shall I relent because of these things?
translation:
  language: ru
  text: Среди гладких камней русла — твоя доля[a]; они, именно они, — твой удел. Им же ты возливала возлияние, приносила зерновое приношение. Неужели из-за этого Я смилостивлюсь?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Среди долей долины». Вероятнее всего, еврейское выражение означает гладкие камни в русле потока, что соответствует контексту идолопоклонства.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Неужели этим Я утешусь?» Еврейский глагол может означать «утешиться»; в данном контексте также возможно значение «смилостивиться» или «отказаться от решения о суде».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַלְּקֵי נַחַל
  choice: Среди гладких камней русла
  rationale: חַלְּקֵי, вероятно, обозначает гладкие камни, а נַחַל — русло сезонного потока. Такое понимание соответствует контексту идолопоклонства и последующему местоимению множественного числа. Неопределённость отмечена в сноске.
- source_word: חֶלְקֵךְ
  choice: твоя доля
  rationale: Передаёт значение назначенной доли и сохраняет созвучную смысловую связь с גּוֹרָלֵךְ.
- source_word: הֵם הֵם
  choice: они, именно они
  rationale: Сохраняет эмфатическое повторение, но выражает его естественно по-русски.
- source_word: גּוֹרָלֵךְ
  choice: твой удел
  rationale: Передаёт назначенную по жребию долю и образует естественную русскую пару с «доля».
- source_word: נֶסֶךְ
  choice: возлияние
  rationale: Устоявшийся и точный русский термин для жидкой жертвы, которую выливают перед божеством.
- source_word: הֶעֱלִית מִנְחָה
  choice: приносила хлебное приношение
  rationale: В культовом контексте Hiphil עלה означает возносить или приносить жертву, а מִנְחָה здесь обозначает приношение из зерна или муки. «Хлебное приношение» сохраняет культовую точность и литературный регистр.
- source_word: הַעַל אֵלֶּה אֶנָּחֵם
  choice: Неужели из-за этого Я смилостивлюсь?
  rationale: В контексте обличения Niphal נחם вероятнее всего относится к отказу от наказания или смягчению решения. Риторическая форма передаёт ожидаемый отрицательный ответ; иной смысл глагола сохранён в сноске.
theological_decisions:
- issue: Смысл заключительного риторического вопроса
  choice: Вопрос о том, смилостивится ли Бог и отступит ли от суда
  alternative: «Неужели этим Я утешусь?» или «Неужели этим Меня можно умилостивить?»
  rationale: Контекст осуждает идольские жертвы, поэтому вопрос, вероятно, отрицает возможность того, что они побудят Бога отказаться от суда. Однако семантическая неоднозначность נחם не устранена и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род глаголов отражает обращение к персонифицированному женскому адресату в еврейском тексте. Эмфаза הֵם הֵם сохранена без неестественного буквального повтора.
