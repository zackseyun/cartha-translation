source:
  edition: WLC
  text: עַל מִי֙ תִּתְעַנָּ֔גוּ עַל מִ֛י תַּרְחִ֥יבוּ פֶ֖ה תַּאֲרִ֣יכוּ לָשׁ֑וֹן הֲ/לֽוֹא אַתֶּ֥ם יִלְדֵי פֶ֖שַׁע זֶ֥רַע שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/004.yaml
  text: At whom do you sport yourselves? Against whom do you open your mouth wide and stick out your tongue? Are you not children of transgression[c][b][a], offspring of deceit?
translation:
  language: ru
  text: Над кем вы насмехаетесь?[a] Против кого широко раскрываете рот и высовываете язык?[b] Разве не вы — дети беззакония, потомство лжи?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «над кем вы услаждаетесь?» В данном контексте речь, вероятно, идёт о злорадстве и насмешке.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «удлиняете язык», то есть высовываете его в знак насмешки.'
    reason: lexical_alternative
  - marker: c
    text: Выражения «дети беззакония» и «потомство лжи» используют язык родства для характеристики людей, отмеченных беззаконием и ложью.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְעַנָּגוּ
  choice: насмехаетесь
  rationale: Форма глагола ענג буквально связана с удовольствием или наслаждением, однако параллельные образы широко раскрытого рта и высунутого языка указывают здесь на злорадную насмешку. «Насмехаетесь» естественно передаёт эту силу в современном русском языке.
- source_word: תַּרְחִיבוּ פֶה
  choice: широко раскрываете рот
  rationale: Перевод сохраняет зримый еврейский образ дерзкой, насмешливой речи и при этом звучит естественно по-русски.
- source_word: תַּאֲרִיכוּ לָשׁוֹן
  choice: высовываете язык
  rationale: Буквально выражение означает «удлиняете язык»; по смыслу это узнаваемый жест насмешки, который по-русски передаётся глаголом «высовываете».
- source_word: הֲלוֹא
  choice: разве не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; «разве не» точно воспроизводит его функцию.
- source_word: יִלְדֵי פֶשַׁע
  choice: дети беззакония
  rationale: Сохраняется метафорический язык родства. «Беззаконие» передаёт нравственный смысл פשע — преступления, мятежа или сознательного нарушения — без неестественного русского сочетания «дети преступления».
- source_word: זֶרַע שָׁקֶר
  choice: потомство лжи
  rationale: «Потомство» сохраняет образ זרע как рода или семени, а «ложь» прямо и ёмко передаёт שׁקר, не сужая его только до обмана как действия.
theological_decisions:
- issue: Родовая образность в пророческом обличении
  choice: Сохранить выражения «дети беззакония, потомство лжи» и пояснить их метафорическую функцию.
  alternative: 'Передать смысл без образа: «люди, исполненные беззакония и лжи», либо понять слова как утверждение о буквальном происхождении.'
  rationale: Еврейский текст намеренно характеризует адресатов через язык происхождения и принадлежности. Сохранение этой образности удерживает силу обвинения, а примечание предотвращает необоснованное сведение текста к утверждению о физической родословной.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой пророческой риторики и наглядных телесных образов. Метафорические выражения родства оставлены в тексте, но сформулированы так, чтобы не звучать как указание на пол или буквальную биологическую родословную.
