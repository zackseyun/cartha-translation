source:
  edition: WLC
  text: וְ/הָ/רְשָׁעִ֖ים כַּ/יָּ֣ם נִגְרָ֑שׁ כִּ֤י הַשְׁקֵט֙ לֹ֣א יוּכָ֔ל וַ/יִּגְרְשׁ֥וּ מֵימָ֖י/ו רֶ֥פֶשׁ וָ/טִֽיט׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/020.yaml
  text: But the wicked are like the tossing sea[a], for it cannot be quiet[b], and its waters toss up mire and mud.
translation:
  language: ru
  text: 'А нечестивые — как бушующее море[a]: оно не может успокоиться, и воды его выбрасывают ил и грязь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как гонимое море»; также возможно: «как волнующееся море». Еврейское слово изображает море вздымаемым и гонимым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרְשָׁעִים
  choice: А нечестивые
  rationale: Существительное обозначает нечестивых людей; союз передаёт контраст с миром, о котором говорится в предыдущем стихе.
- source_word: כַּיָּם נִגְרָשׁ
  choice: как бушующее море
  rationale: Форма от גרשׁ буквально изображает море гонимым, вздымаемым внешней силой; «бушующее» естественно передаёт по-русски его неспокойное движение, не превращая образ в отвлечённое «тревожное море».
- source_word: כִּי הַשְׁקֵט לֹא יוּכָל
  choice: оно не может успокоиться
  rationale: שׁקט означает пребывать в покое или затихнуть; возвратный глагол «успокоиться» естественен применительно к морю и сохраняет значение невозможности покоя.
- source_word: וַיִּגְרְשׁוּ מֵימָיו
  choice: и воды его выбрасывают
  rationale: Повтор корня גרשׁ передаёт изгнание или выталкивание; «выбрасывают» ясно описывает действие морских вод и по возможности сохраняет связь с первым образом.
- source_word: רֶפֶשׁ וָטִיט
  choice: ил и грязь
  rationale: Парные слова обозначают взмученную илистую грязь и тину/глину; сочетание «ил и грязь» понятно современному читателю и сохраняет конкретный образ.
theological_decisions:
- issue: Противительное значение начального союза
  choice: А нечестивые
  alternative: И нечестивые
  rationale: Контекст противопоставляет участь нечестивых миру праведного; русское «а» естественно выражает этот контраст без усиления до более резкого «но».
- issue: Характер образа моря
  choice: бушующее море
  alternative: гонимое море; волнующееся море
  rationale: Перевод сохраняет образ моря, которое находится в непрерывном движении и не может затихнуть, не сводя его состояние только к внутреннему беспокойству.
translation_notes:
  register: Современный литературный русский язык с кратким, образным синтаксисом. «Нечестивые» сохранено как привычное библейское обозначение людей, поступающих вопреки Божьей правде; остальная лексика общепонятна и не архаична.
