id: ISA.57.10
reference: Isaiah 57:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּ/רֹ֤ב דַּרְכֵּ/ךְ֙ יָגַ֔עַתְּ לֹ֥א אָמַ֖רְתְּ נוֹאָ֑שׁ חַיַּ֤ת יָדֵ/ךְ֙ מָצָ֔את עַל כֵּ֖ן לֹ֥א חָלִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/010.yaml
  text: In the multitude of your ways you grew weary[a], yet you did not say, ‘It is hopeless.’ You found renewed strength in your hand[c][b]; therefore you did not grow weak.
translation:
  language: ru
  text: 'От множества путей твоих ты утомилась, но не сказала: «Безнадёжно!» Ты обрела новую силу в руке своей[a], поэтому не изнемогла[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жизнь (или жизненную силу) руки своей»; вероятный смысл — вновь обретённая способность продолжать.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не ослабела»; возможно также: «не заболела».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב דַּרְכֵּךְ
  choice: От множества путей твоих
  rationale: 'רֹב выражает множество или обилие, а множественная форма דַּרְכֵּךְ — «твои пути». Предлог בְּ здесь естественно передаётся как указание на причину утомления: «от множества».'
- source_word: יָגַעַתְּ
  choice: ты утомилась
  rationale: Форма женского рода означает утомление от долгих усилий; «утомилась» сохраняет смысл и звучит естественно.
- source_word: נוֹאָשׁ
  choice: Безнадёжно!
  rationale: Краткое безличное восклицание передаёт вывод о тщетности дальнейших усилий, не уточняя сверх текста, кто именно отчаялся.
- source_word: חַיַּת יָדֵךְ
  choice: новую силу в руке своей
  rationale: Буквально сжатое выражение «жизнь/жизненную силу твоей руки» обозначает обнаруженную жизнеспособность или способность продолжать; «в руке» сохраняет исходный образ, а «новую силу» делает идиому понятной.
- source_word: מָצָאת
  choice: ты обрела
  rationale: מצא означает «найти, обрести»; в сочетании с силой по-русски естественнее «обрела».
- source_word: עַל־כֵּן
  choice: поэтому
  rationale: Передаёт следствие, выраженное устойчивым оборотом עַל־כֵּן.
- source_word: לֹא חָלִית
  choice: не изнемогла
  rationale: חלה может означать стать слабым, изнемочь или заболеть. В данном параллелизме «не изнемогла» передаёт физико-волевую слабость, не сужая смысл до болезни.
theological_decisions:
- issue: Характер упорства в контексте обличения неверности
  choice: Основной текст сохраняет описание настойчивости без добавочной нравственной оценки.
  alternative: Явно назвать это упорством в греховных или идолопоклоннических стремлениях.
  rationale: Контекст Ис 57 придаёт действиям отрицательную оценку, однако сам стих выражает её косвенно. Добавление оценки в перевод разрешило бы напряжение, отсутствующее в формулировке оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Женский род сохранён по еврейским формам обращения. Инверсия «путей твоих», «в руке своей» поддерживает достоинство стиля, оставаясь понятной современному читателю.
