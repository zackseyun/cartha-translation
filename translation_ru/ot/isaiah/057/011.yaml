  naturalness: 'Сочетание «— и уже давно, —» пунктуационно и синтаксически неудачно: вставка разрывает придаточное и создаёт неясную связь. Перестройка в «Я давно уже молчу» даёт современную литературную, ясную и риторически цельную фразу.'
  terminology: «Меня», «молчать», «бояться» и женские формы обращения уместны. «Не принимала этого близко к сердцу» — естественная передача идиомы; сноска сохраняет буквальный образ. Не требуется богословских добавлений.
