source:
  edition: WLC
  text: וְ/אֶת מִ֞י דָּאַ֤גְתְּ וַ/תִּֽירְאִי֙ כִּ֣י תְכַזֵּ֔בִי וְ/אוֹתִ/י֙ לֹ֣א זָכַ֔רְתְּ לֹא שַׂ֖מְתְּ עַל לִבֵּ֑/ךְ הֲ/לֹ֨א אֲנִ֤י מַחְשֶׁה֙ וּ/מֵ֣/עֹלָ֔ם וְ/אוֹתִ֖/י לֹ֥א תִירָֽאִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/011.yaml
  text: And whom did you dread and fear[a], so that you lied and did not remember me, did not lay it to your heart? Was it not because I have kept silent, and that from long ago[b], that you do not fear me?
translation:
  language: ru
  text: Кого же ты страшилась и боялась, что лгала, Меня не помнила и не принимала этого близко к сердцу?[a] Разве не потому, что Я давно уже молчу,[b] ты Меня не боишься?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не положила на своё сердце».'
    reason: Сохраняет образ еврейского идиома, который в основном тексте передан естественным русским выражением.
  - marker: b
    text: 'Возможно также: «Разве не потому, что Я молчал с давних пор, ты Меня не боялась?» Еврейский синтаксис допускает передачу заключительных глаголов как относящихся к прошлому; также возможна более сочинительная связь: «Я молчал с давних пор, а Меня ты не боялась».'
    reason: Отмечает допустимые способы передать длительное Божье молчание и синтаксическую связь заключительных частей, не устраняя неоднозначность.
lexical_decisions:
- source_word: דָּאַגְתְּ וַתִּירְאִי
  choice: страшилась и боялась
  rationale: 'Сохраняет парное выражение страха в еврейском тексте: דאג передаёт тревожный, гнетущий страх, а ירא — обычное «бояться».'
- source_word: כִּי תְכַזֵּבִי
  choice: что лгала
  rationale: 'כִּי понято как вводящее следствие: страх перед кем-то привёл адресата ко лжи. Краткая конструкция естественна по-русски и не перегружает риторический вопрос.'
- source_word: וְאוֹתִי לֹא זָכַרְתְּ
  choice: Меня не помнила
  rationale: Прямо передаёт זכר и сохраняет как обычный когнитивный смысл, так и более глубокий смысл верности Богу, не поясняя его внутри перевода.
- source_word: לֹא שַׂמְתְּ עַל לִבֵּךְ
  choice: не принимала этого близко к сердцу
  rationale: Современный русский идиом передаёт смысл еврейского образного выражения — всерьёз обдумать и внутренне принять; подразумеваемое дополнение обозначено словом «этого».
- source_word: מַחְשֶׁה
  choice: Я молчал
  rationale: חשה означает «молчать, хранить молчание». Простая форма сохраняет предикативную конструкцию и не истолковывает Божье молчание как безразличие или одобрение.
- source_word: וּמֵעוֹלָם
  choice: и уже давно
  rationale: Здесь עוֹלָם указывает на длительность, уходящую в прошлое, а не на абстрактную вечность. Оборот естественен для современного русского языка.
- source_word: וְאוֹתִי לֹא תִירָאִי
  choice: ты Меня не боялась
  rationale: Передаёт отсутствие страха перед Богом как результат или сопутствующее обстоятельство Его долгого молчания. Прошедшее время согласуется с обращённым к адресату упрёком и контекстом вопроса.
theological_decisions:
- issue: Смысл продолжительного Божьего молчания
  choice: Долгое Божье молчание представлено как обстоятельство, которым адресат воспользовался и потому перестал бояться Бога.
  alternative: Понимать молчание только как невмешательство либо как полную сокрытость Бога.
  rationale: Текст связывает отсутствие страха перед Богом с Его давним молчанием, но не утверждает, что это молчание означало безразличие или одобрение. Вопросительная форма сохраняет напряжение исходного текста.
- issue: Синтаксическая связь וּמֵעוֹלָם и последней части стиха
  choice: Связать «и уже давно» с Божьим молчанием, сохранив причинно-результативное прочтение всего вопроса.
  alternative: 'Читать две самостоятельные мысли: «Я молчал издавна, а Меня ты не боялась».'
  rationale: Первое прочтение хорошо соответствует риторической логике контекста, однако еврейский синтаксис допускает и более сочинительную связь; эта возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены обращение к адресату в женском роде, риторические вопросы, повтор слов со значением страха и напряжение между Божьим молчанием и отсутствием богобоязненности. Архаизмы и конфессионально окрашенные пояснения не вводились.
