base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/014.yaml
  text: And it will be said[a], “Build up, build up; clear the way; remove the stumbling block from the way of my people.”
translation:
  language: ru
  text: 'И будет сказано[a]: «Насыпайте, насыпайте, расчищайте дорогу; устраните препятствие с пути моего народа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более традиционной передаче: «Возвышайте, возвышайте; приготовьте дорогу». Еврейский текст использует образ сооружения и расчистки дороги; субъект в начале прямо не назван.'
    reason: Передаёт традиционную лексическую альтернативу и поясняет дорожную метафору, не приписывая говорящего определённому лицу.
lexical_decisions:
- source_word: וְאָמַר
  choice: И будет сказано
  rationale: Безличная конструкция сохраняет неопределённость еврейского текста относительно говорящего и естественно передаёт формулу возвещения.
- source_word: סֹלּוּ סֹלּוּ
  choice: Прокладывайте, прокладывайте дорогу
  rationale: Глагол סלל обозначает сооружение или прокладывание приподнятой дороги; повтор передаёт настойчивость повеления. Дополнение «дорогу» естественно восполняется из дорожного образа всей строки.
- source_word: פַּנּוּ דָרֶךְ
  choice: расчистите путь
  rationale: פנה в данном сочетании призывает освободить и подготовить путь; «расчистите» сохраняет конкретный образ устранения помех.
- source_word: הָרִימוּ מִכְשׁוֹל
  choice: уберите препятствие
  rationale: Буквально הָרִימוּ означает «поднимите», но при объекте «то, обо что спотыкаются» выражает удаление помехи. «Уберите препятствие» ясно и естественно передаёт смысл, не превращая его в отвлечённое «соблазн».
- source_word: מִדֶּרֶךְ עַמִּי
  choice: с пути Моего народа
  rationale: Предлог מן обозначает удаление с пути, а עַמִּי сохраняет принадлежность народа говорящему. Заглавная буква в «Моего» указывает на подразумеваемого Бога, не добавляя Его имени.
theological_decisions:
- issue: Кто произносит вступительные слова
  choice: Безличное «И будет сказано»
  alternative: «И Он сказал» или «И скажут»
  rationale: В еврейской форме субъект прямо не назван. Безличная передача сохраняет эту неоднозначность и не приписывает речь определённому лицу.
- issue: Значение מִכְשׁוֹל
  choice: Конкретное «препятствие» в образе дороги
  alternative: Богословски нагруженное «камень преткновения» или «соблазн»
  rationale: Контекст последовательно использует дорожную образность; нейтральное «препятствие» сохраняет возможность буквального и переносного понимания без преждевременного догматического уточнения.
translation_notes:
  register: Современный литературный русский язык; повеления звучат ясно и торжественно. Повтор сохранён. Дорожная метафора передана конкретно, без архаичного «насыпайте» и без конфессионально окрашенных уточнений.
