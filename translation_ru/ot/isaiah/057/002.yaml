  text: He enters into peace[a]; they rest on their beds[c][b], each one who walks in his uprightness.
translation:
  language: ru
  text: Он входит в мир[a]; они покоятся на своих ложах — каждый, кто идет прямым путем[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он обретает мир». Еврейский глагол в этом контексте допускает оба перевода.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «идущий прямо перед ним»; также возможно: «идущий в своей непорочности» или «поступающий праведно».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте происходит переход между единственным и множественным числом: «он входит… они покоятся… идущий».'
    reason: alternative_reading
lexical_decisions:
- source_word: יָבוֹא
  choice: входит
  rationale: Qal imperfect 3-го лица мужского рода единственного числа от בוא. Настоящее время естественно передаёт поэтическое описание участи праведника; «входит» выражает переход в состояние мира, не исключая буквального значения «приходит».
- source_word: שָׁלוֹם
  choice: мир
  rationale: שָׁלוֹם охватывает мир, благополучие и целостность. «Мир» — краткий и естественный эквивалент, сохраняющий широту контекста.
- source_word: יָנוּחוּ
  choice: они покоятся
  rationale: Qal imperfect 3-го лица множественного числа от נוח. «Покоятся» сохраняет образ успокоения после смерти и звучит достойно, не превращая метафору в явное учение о посмертном состоянии.
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: на своих ложах
  rationale: Буквально — «на своих местах лежания/ложах». «Ложа» сохраняют поэтическую метафору покоя и в данном контексте звучат естественнее, чем бытовое «кровати».
- source_word: הֹלֵךְ
  choice: кто ходит
  rationale: Причастие Qal мужского рода единственного числа от הלך обозначает характерный образ жизни. Настоящее время передаёт причастную форму и привычное поведение без необязательного перевода в прошедшее время.
- source_word: נְכֹחוֹ
  choice: прямо перед Ним
  rationale: Форма от נכח с суффиксом 3-го лица мужского рода допускает понимание «прямо перед ним/Ним», «прямо» или этически «в своей правоте». Выбранный вариант близок к форме текста и сохраняет неоднозначность референта суффикса; прописная буква отражает вероятное указание на Бога в контексте.
theological_decisions:
- issue: Переход от единственного числа к множественному
  choice: 'Сохранить: «Он входит… они покоятся… каждый, кто ходит».'
  alternative: Согласовать весь стих либо в единственном, либо во множественном числе.
  rationale: Еврейский текст сам переходит от единственного числа к множественному и затем возвращается к причастию единственного числа. «Каждый» делает распределительный смысл понятным, не устраняя текстовое напряжение.
- issue: Образ смерти и покоя
  choice: Сохранить метафоры мира, покоя и лож.
  alternative: Явно истолковать ложа как могилы либо мир как небесное блаженство.
  rationale: Контекст связывает стих со смертью праведника, однако сам стих не уточняет устройство посмертного состояния. Перевод не должен добавлять такую конкретизацию.
- issue: Значение נְכֹחוֹ
  choice: «прямо перед Ним» с примечанием об альтернативе «в своей правоте/непорочности».
  alternative: 'Однозначно передать только этический смысл: «в своей правоте».'
  rationale: Сжатая еврейская конструкция допускает как пространственно-реляционное, так и этическое понимание. Основной текст сохраняет суффикс, а примечание фиксирует смысловую альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. «Покоятся» и «ложа» сохраняют достоинство и погребально-покойную образность, не звуча архаично чрезмерно. Местоимение «Ним» написано с прописной буквы как вероятная отсылка к Богу, но примечание сохраняет грамматическую неоднозначность.
