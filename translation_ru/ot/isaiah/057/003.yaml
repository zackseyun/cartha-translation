lexical_decisions:
- source_word: וְאַתֶּם
  choice: А вы
  rationale: Союз с самостоятельным местоимением вводит резкое противопоставление предыдущему контексту; «А вы» естественно передаёт этот поворот, не усиливая его сверх текста.
- source_word: קִרְבוּ הֵנָּה
  choice: подойдите сюда
  rationale: Сочетание повелительной формы множественного числа от קרב и указательного наречия הֵנָּה передаёт прямой призыв приблизиться; «подойдите сюда» звучит современно и сохраняет вызывающе-судебный тон.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Мужское множественное число в сопряжённой форме передано буквально; выражение также может обозначать принадлежность или сходство по характеру.
- source_word: עֹנְנָה
  choice: чародейки
  rationale: Женская форма связана с запрещённой гадательной или оккультной практикой. «Чародейка» кратко и понятно передаёт общий смысл, тогда как точный вид практики не вполне определён.
- source_word: זֶרַע
  choice: потомство
  rationale: Собирательное «потомство» естественно передаёт זֶרַע в формуле происхождения и допускает как буквальное, так и образное понимание.
- source_word: מְנָאֵף
  choice: прелюбодея
  rationale: Причастие мужского рода обозначает мужчину, совершающего прелюбодеяние; существительное сохраняет род, число и прямоту обвинения.
- source_word: וַתִּזְנֶה
  choice: и блудницы
  rationale: Форма женского рода от זנה буквально описывает женщину, занимающуюся блудом или проституцией. Именное «блудницы» естественно входит в генеалогическую формулу и сохраняет резкость пророческой речи без грубой просторечности.
theological_decisions:
- issue: Характер обличительной родословной образности
  choice: Сохранить в основном тексте формулу происхождения без уточнения, буквальна она или метафорична.
  alternative: Явно истолковать адресатов как духовных потомков идолопоклонников и нарушителей завета.
  rationale: Контекст допускает пророческую метафору духовной неверности и идолопоклонства, однако сама строка оформлена как обвинение в происхождении. Перевод сохраняет эту богословскую напряжённость, а возможное образное значение отмечает в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением резкого пророческого обличения. «Чародейка» и «блудница» понятны широкому читателю и поддерживают достоинство библейского регистра; синтаксис остаётся кратким и ударным. Маркеры сносок поставлены при тех выражениях, которые они поясняют.
