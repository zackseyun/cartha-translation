source:
  edition: WLC
  text: הַ/נֵּֽחָמִים֙ בָּֽ/אֵלִ֔ים תַּ֖חַת כָּל עֵ֣ץ רַעֲנָ֑ן שֹׁחֲטֵ֤י הַ/יְלָדִים֙ בַּ/נְּחָלִ֔ים תַּ֖חַת סְעִפֵ֥י הַ/סְּלָעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/005.yaml
  text: you who burn with lust among the terebinths[a], under every green tree, who slaughter the children in the wadis[b], under the clefts of the rocks.
translation:
  language: ru
  text: Вы, распаляющиеся страстью среди теревинтов[a], под всяким зеленеющим деревом, закалывающие детей в ущельях[b], под выступами скал!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди дубов». Еврейское слово может обозначать крупные деревья, почитавшиеся как священные; возможно также прочтение «среди богов», однако параллель с зеленеющими деревьями говорит в пользу названия деревьев.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в долинах». Еврейское слово обозначает также овраги и русла потоков, нередко пересыхающих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֵּחָמִים
  choice: распаляющиеся страстью
  rationale: Причастная форма в данном контексте обличения идольских обрядов передаёт состояние возбуждения или разжигания страсти. Формулировка сохраняет образ жара и вероятный сексуально-культовый оттенок, не сводя его к одной конкретной практике.
- source_word: בָּאֵלִים
  choice: среди теревинтов
  rationale: Параллель «под всяким зеленеющим деревом» указывает здесь скорее на крупные священные деревья, чем на «богов». «Теревинты» передаёт вероятное конкретное значение; возможность перевода «дубы» отмечена в сноске.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: под всяким зеленеющим деревом
  rationale: Сохранён характерный пророческий образ мест незаконного культа. «Зеленеющим» естественно передаёт пышную живую листву, не превращая образ в пояснительный пересказ.
- source_word: שֹׁחֲטֵי
  choice: закалывающие
  rationale: Глагол обозначает заклание и нередко имеет жертвенный оттенок. «Закалывающие» передаёт и насилие, и культовый контекст точнее, чем общее «убивающие».
- source_word: הַיְלָדִים
  choice: детей
  rationale: Слово обозначает детей или потомство без обязательного уточнения пола и возраста; нейтральное «детей» наиболее точно.
- source_word: בַּנְּחָלִים
  choice: в ущельях
  rationale: נְחָלִים обозначает долины, овраги или русла водотоков, часто сезонных. «В ущельях» понятно современному читателю и сохраняет рельеф местности; географическая конкретика приведена в сноске.
- source_word: תַּחַת סְעִפֵי הַסְּלָעִים
  choice: под выступами скал
  rationale: סְעִפִים буквально связано с разветвлениями или ответвлениями; применительно к скалам обозначает их выступы, расселины либо нависающие части. «Под выступами скал» естественно по-русски и сохраняет образ укрытых скальных мест.
theological_decisions:
- issue: Насколько явно передавать сексуально-культовый оттенок начального причастия
  choice: «распаляющиеся страстью»
  alternative: «распаляющиеся» или «разгорячённые»
  rationale: Контекст священных деревьев и детских жертв поддерживает обличение идольского культа с оттенком чувственного возбуждения. Добавление «страстью» делает этот оттенок понятным, но не называет конкретного обряда и не привносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с торжественно-обличительным ритмом. Параллельные причастные обороты сохраняют синтаксис обвинения; восклицательный знак передаёт пророческую резкость. Редкие географические и ботанические значения пояснены сносками.
