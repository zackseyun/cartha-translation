  text: וְ/אַחַ֤ר הַ/דֶּ֨לֶת֙ וְ/הַ/מְּזוּזָ֔ה שַׂ֖מְתְּ זִכְרוֹנֵ֑/ךְ כִּ֣י מֵ/אִתִּ֞/י גִּלִּ֣ית וַֽ/תַּעֲלִ֗י הִרְחַ֤בְתְּ מִשְׁכָּבֵ/ךְ֙ וַ/תִּכְרָת לָ֣/ךְ מֵ/הֶ֔ם אָהַ֥בְתְּ מִשְׁכָּבָ֖/ם יָ֥ד חָזִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/008.yaml
  text: Behind the door and the doorpost you set up your memorial[a]; for away from me you uncovered yourself and went up; you made your bed wide, and you made a covenant for yourself with them; you loved their bed[c][b]; you looked on a hand.
translation:
  language: ru
  text: За дверью и дверным косяком ты поставила свой памятный знак[a]. Удалившись от Меня, ты обнажилась и взошла; ты расширила своё ложе и заключила для себя союз с ними[b]. Ты возлюбила их ложе и смотрела на руку[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свой знак», «напоминание о себе». Еврейское слово может обозначать тайно поставленный культовый знак.'
    reason: lexical_alternative
  - marker: b
    text: Буквально выражение использует глагол «рубить», обычный в обороте «заключать завет (союз)», хотя само слово «завет» здесь не названо.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «смотрела на руку». Выражение неясно: под «рукой» может подразумеваться памятник или знак; возможен также сексуальный эвфемизм.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר הַדֶּלֶת וְהַמְּזוּזָה
  choice: За дверью и дверным косяком
  rationale: מְזוּזָה обозначает боковой дверной косяк, а не порог; אַחַר здесь имеет пространственное значение.
- source_word: שַׂמְתְּ זִכְרוֹנֵךְ
  choice: ты поставила свой памятный знак
  rationale: זִכָּרוֹן может обозначать как напоминание или памятный знак, так и конкретный культовый предмет. Формулировка сохраняет предметность, не подставляя прямо слово «идол».
- source_word: כִּי מֵאִתִּי גִּלִּית
  choice: Удалившись от Меня, ты обнажилась
  rationale: מֵאִתִּי передаёт отделение от Бога, а גלה сохраняет образ обнажения с оттенками позора и сексуальной неверности.
- source_word: וַתַּעֲלִי
  choice: и взошла
  rationale: Сохранено широкое значение עלה «подниматься, восходить» без уточнения, идёт ли речь о ложе или культовой высоте.
- source_word: הִרְחַבְתְּ מִשְׁכָּבֵךְ
  choice: ты расширила своё ложе
  rationale: Буквально воспроизводится образ расширенного ложа, несущий сексуальную и идолопоклонническую метафорику.
- source_word: וַתִּכְרָת לָךְ מֵהֶם
  choice: заключила для себя союз с ними
  rationale: כרת употреблено в характерном для заключения союза обороте, хотя существительное בְּרִית в тексте не выражено.
- source_word: אָהַבְתְּ מִשְׁכָּבָם
  choice: ты возлюбила их ложе
  rationale: Сохранён яркий и намеренно двусмысленный образ ложа, не сведённый только к идолопоклонству или политическим союзам.
- source_word: יָד חָזִית
  choice: смотрела на руку
  rationale: Буквальное значение оставлено в основном тексте, поскольку смысл загадочного выражения остаётся спорным; חזה передано как направленное созерцание.
theological_decisions:
- issue: Сексуально-культовая метафора отступничества
  choice: Сохранить образы обнажения и ложа, не объясняя их прямо как идолопоклонство или политическую неверность.
  alternative: Заменить образный ряд прямым указанием на поклонение идолам либо на политические союзы.
  rationale: Текст намеренно соединяет сексуальную неверность, культовое отступничество и, возможно, незаконные союзы; перевод не должен устранять это напряжение.
- issue: Заветный оттенок וַתִּכְרָת
  choice: Передать как «заключила для себя союз».
  alternative: 'Передать нейтральнее: «заключила соглашение».'
  rationale: Глагол כרת вызывает устойчивую формулу заключения завета или союза, но отсутствие существительного «завет» отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой торжественности. Женский род последовательно отражает обращение к персонифицированному народу. Образы переданы прямо, но без излишней архаизации; «возлюбила» выбрано ради возвышенного и обвинительного регистра.
