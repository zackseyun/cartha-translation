  text: אֲנִ֥י אַגִּ֖יד צִדְקָתֵ֑/ךְ וְ/אֶֽת מַעֲשַׂ֖יִ/ךְ וְ/לֹ֥א יוֹעִילֽוּ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/012.yaml
  text: I myself will declare your righteousness and your works[b][a], but they will not profit you.
translation:
  language: ru
  text: Я Сам объявлю о твоей праведности[a] и о твоих делах, но они не принесут тебе пользы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о твоей справедливости». Древнееврейское слово может означать как праведность, так и справедливость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но они тебе не помогут». Древнееврейский глагол может означать «приносить пользу, помогать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Я Сам
  rationale: Самостоятельное местоимение перед глаголом выражает усиление; «Я Сам» естественно передаёт этот акцент по-русски.
- source_word: אַגִּיד
  choice: объявлю
  rationale: Порода hифиль глагола נגד означает «объявлять, сообщать, делать известным». Контекст может придавать словам обличительный оттенок, но его не следует вносить в сам глагол переводом «разоблачу».
- source_word: צִדְקָתֵךְ
  choice: о твоей праведности
  rationale: צדקה обычно означает «праведность», хотя возможно и значение «справедливость». Формулировка сохраняет ироническое или обвинительное напряжение контекста, не добавляя пояснения «мнимой».
- source_word: וְאֶת מַעֲשַׂיִךְ
  choice: и о твоих делах
  rationale: מעשים — обычное обозначение дел или поступков. «Дела» кратко и точно передаёт смысл, не предрешая их нравственной оценки.
- source_word: וְלֹא יוֹעִילוּךְ
  choice: но они не принесут тебе пользы
  rationale: Глагол יעל в hифиле означает «приносить пользу, помогать». Русское «не принесут тебе пользы» естественно и точно; противительный союз «но» ясно передаёт смысловое противопоставление, выраженное контекстом.
theological_decisions:
- issue: Иронический характер выражения «твоя праведность»
  choice: Сохранено прямое выражение «твоя праведность» без кавычек и оценочного определения.
  alternative: «твоя мнимая праведность» или «твои праведные дела»
  rationale: В контексте слова, вероятно, звучат иронически и обличают ложную праведность, однако древнееврейский текст прямо не говорит «мнимая». Контекст должен сам раскрывать иронию.
translation_notes:
  register: Современный литературный русский язык; тон возвышенный, но понятный. Прописная буква в «Сам» подчёркивает отнесённость местоимения к Богу и сохраняет эмфазу исходного текста.
