lexical_decisions:
- source_word: עַל הַר
  choice: На … горе
  rationale: Предлог עַל здесь обозначает место действия, а הַר имеет обычное значение «гора».
- source_word: גָּבֹהַּ וְנִשָּׂא
  choice: высокой и возвышенной
  rationale: Сохраняет парные определения высоты и усиленную пророческую выразительность еврейского текста.
- source_word: שַׂמְתְּ מִשְׁכָּבֵךְ
  choice: ты устроила себе ложе
  rationale: Форма глагола обращена к женщине в единственном числе. «Ложе» сохраняет конкретный образ места для возлежания и его возможные сексуальные оттенки; «устроила себе» естественно передаёт сочетание שׂים с данным дополнением.
- source_word: גַּם שָׁם
  choice: туда же
  rationale: В сочетании с глаголом движения по-русски естественно «туда»; частица «же» передаёт присоединительно-усилительное значение גַּם.
- source_word: עָלִית
  choice: ты поднялась
  rationale: Глагол буквально обозначает движение вверх и согласуется с образом горы; женский род отражает форму второго лица женского рода.
- source_word: לִזְבֹּחַ זָבַח
  choice: чтобы принести жертву
  rationale: Инфинитив с однокоренным существительным обозначает совершение жертвоприношения. Русское «принести жертву» сохраняет культовый смысл без неестественного повтора «пожертвовать жертву».
theological_decisions:
- issue: Метафорический смысл «ложа» в обличении идолопоклонства
  choice: Сохранить в основном тексте конкретный образ «ложе», не раскрывая метафору прямо.
  alternative: «место развратного поклонения» или иная пояснительная передача
  rationale: Еврейский текст сохраняет образную двусмысленность между ложем и неверным поклонением; прямое истолкование в тексте устранило бы эту напряжённость.
- issue: Культовое значение זבח
  choice: «принести жертву»
  alternative: '«заколоть жертву»; буквально и неестественно: «пожертвовать жертву»'
  rationale: Формулировка ясно передаёт жертвенный, культовый акт, не сводя его лишь к физическому закланию и не добавляя конфессиональной специфики.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род обращения передан явно. Порядок слов и точка с запятой сохраняют параллелизм двух действий.
