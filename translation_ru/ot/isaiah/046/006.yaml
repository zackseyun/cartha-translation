  source_fidelity: 'Перевод точно передаёт структуру и смысл еврейского текста: люди щедро расходуют золото из кошелька, взвешивают серебро, нанимают мастера, который делает из металла бога, после чего они совершают усиленно описанное поклонение. Переход от множественного числа к единственному («нанимают… тот делает») оправдан оригиналом. «Даже падают ниц» удачно передаёт усилительное אַף и более глубокое действие השתחוה.'
