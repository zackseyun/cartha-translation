source:
  edition: WLC
  text: הַ/זָּלִ֤ים זָהָב֙ מִ/כִּ֔יס וְ/כֶ֖סֶף בַּ/קָּנֶ֣ה יִשְׁקֹ֑לוּ יִשְׂכְּר֤וּ צוֹרֵף֙ וְ/יַעֲשֵׂ֣/הוּ אֵ֔ל יִסְגְּד֖וּ אַף יִֽשְׁתַּחֲוּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/006.yaml
  text: Those who lavish gold from the purse and weigh out silver on the scale hire a goldsmith[a], and he makes it into a god; they bow down, indeed they prostrate themselves.
translation:
  language: ru
  text: Те, кто щедро высыпает золото из кошелька и отвешивает серебро на весах[a], нанимают золотых дел мастера, и тот делает из него бога; они преклоняются перед ним и даже падают ниц.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тростником» или «коромыслом»; еврейское слово может обозначать коромысло весов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּלִים
  choice: Те, кто щедро высыпает
  rationale: Причастная форма описывает тех, кто без удержу расходует или высыпает золото; выражение сохраняет конкретный образ и оттенок расточительности.
- source_word: זָהָב מִכִּיס
  choice: золото из кошелька
  rationale: כִּיס — мешочек или кошель для денег; «кошелёк» естественно передаёт смысл в современном русском языке.
- source_word: וְכֶסֶף בַּקָּנֶה יִשְׁקֹלוּ
  choice: и отвешивает серебро на весах[a]
  rationale: קָנֶה буквально означает «тростник, камыш» и здесь, вероятно, обозначает коромысло весов; основной текст передаёт понятный коммерческий образ, а буквальная деталь отмечена в сноске.
- source_word: יִשְׂכְּרוּ צוֹרֵף
  choice: нанимают золотых дел мастера
  rationale: צוֹרֵף обозначает плавильщика, ювелира или мастера по металлу; в контексте золота, серебра и изготовления изображения уместно традиционное, но понятное выражение «золотых дел мастер».
- source_word: וְיַעֲשֵׂהוּ אֵל
  choice: и тот делает из него бога
  rationale: Местоименный суффикс указывает на упомянутый драгоценный металл; «делает из него бога» сохраняет полемически резкое אֵל, не заменяя его толкующим словом «идол».
- source_word: יִסְגְּדוּ
  choice: они преклоняются перед ним
  rationale: Глагол обозначает поклон или преклонение в знак почитания; добавленное «перед ним» естественно указывает на изготовленного бога.
- source_word: אַף יִשְׁתַּחֲווּ
  choice: и даже падают ниц
  rationale: אַף усиливает высказывание, а השתחוה обозначает глубокое поклонение; перевод сохраняет риторическое нарастание и различие между двумя действиями.
theological_decisions:
- issue: Обозначение рукотворного божества без признания его истинной божественности
  choice: бога
  alternative: идола
  rationale: Еврейский текст употребляет אֵל — «бог». Контекст изготовления из металла ясно выражает полемику против ложного божества; замена на «идола» устранила бы намеренное напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конкретные действия переданы живо и понятно; синтаксический переход от множественного числа («нанимают») к единственному («тот делает») сохраняет различие между заказчиками и мастером.
