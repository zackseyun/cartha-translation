base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/013.yaml
  text: I have brought near my righteousness[a]; it is not far away, and my salvation will not delay. I will place salvation in Zion[b], for Israel my splendor.
translation:
  language: ru
  text: Я приблизил Мою праведность[a] — она недалеко; Моё спасение не замедлит. Я дарую на Сионе спасение, Израилю — славу Мою[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мою справедливость»; или: «Моё оправдание».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Моё великолепие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֵרַבְתִּי
  choice: Я приблизил
  rationale: Форма qal perfect, 1-е лицо ед. числа. Совершенный вид передаёт уже совершённое Богом действие с сохраняющейся актуальностью.
- source_word: צִדְקָתִי
  choice: Мою праведность
  rationale: «Праведность» сохраняет широкий смысл צדקה, который здесь может включать справедливость и оправдывающее, спасительное вмешательство Бога.
- source_word: לֹא תִרְחָק
  choice: она недалеко
  rationale: Глагол согласован с «праведностью»; краткая русская формулировка естественно выражает её близость и сохраняет настоящее значение контекста.
- source_word: וּתְשׁוּעָתִי
  choice: Моё спасение
  rationale: «Спасение» соответствует широкому значению תשועה и сохраняет связь с повторением того же существительного далее.
- source_word: לֹא תְאַחֵר
  choice: не замедлит
  rationale: Передаёт piel imperfect глагола אחר как уверенное указание на то, что спасительное действие не задержится.
- source_word: וְנָתַתִּי
  choice: Я дарую
  rationale: נתן означает «дать, поместить, даровать». В сочетании со спасением «дарую» звучит естественно, не устраняя пространственное значение последующего בְּצִיּוֹן.
- source_word: בְצִיּוֹן
  choice: на Сионе
  rationale: Предлог ב передан локативно; традиционное и естественное русское сочетание — «на Сионе».
- source_word: תְּשׁוּעָה
  choice: спасение
  rationale: Повтор слова «спасение» отражает повтор תשועה в еврейском тексте и сохраняет смысловой акцент.
- source_word: לְיִשְׂרָאֵל
  choice: Израилю
  rationale: Дательный падеж естественно передаёт ל и допускает понимание Израиля как получателя Божьего дара.
- source_word: תִּפְאַרְתִּי
  choice: Моё великолепие
  rationale: «Великолепие» передаёт величие и красоту תפארת, не ограничивая слово только значением «слава».
theological_decisions:
- issue: Значение «Моей праведности» в параллели с «Моим спасением»
  choice: Сохранено широкое слово «праведность», тесно связанное со спасительным действием Бога.
  alternative: «Моя справедливость» или «Моё оправдание»
  rationale: Контекст Исайи позволяет видеть в Божьей праведности и качество Бога, и Его верное, справедливое, оправдывающее вмешательство. Более узкий вариант преждевременно снял бы это напряжение.
- issue: Синтаксическая связь заключительных слов לְיִשְׂרָאֵל תִּפְאַרְתִּי
  choice: «Израилю — Моё великолепие» сохраняет сжатую, параллельную конструкцию и связывает оба дара с глаголом «дарую».
  alternative: «Израиль — Моё великолепие» или «Моё великолепие для Израиля»
  rationale: Еврейская фраза допускает различное понимание отношений между Израилем и Божьим великолепием. Тире сохраняет некоторую синтаксическую открытость, хотя русская фраза прежде всего допускает прочтение Израиля как получателя.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Заглавные буквы в притяжательных местоимениях отражают принятую в русском библейском стиле почтительность. Пунктуация подчёркивает параллелизм и сжатость еврейской поэзии.
