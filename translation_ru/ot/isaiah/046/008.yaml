source:
  edition: WLC
  text: זִכְרוּ זֹ֖את וְ/הִתְאֹשָׁ֑שׁוּ הָשִׁ֥יבוּ פוֹשְׁעִ֖ים עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/008.yaml
  text: Remember this and be ashamed[a]; take it to heart[c][b], you transgressors.
translation:
  language: ru
  text: Помните об этом и стойте твёрдо[a]; примите это к сердцу[b], мятежники[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Редкий еврейский глагол можно также понять как «укрепитесь» или «проявите мужество»; древние переводы допускают смысл «устыдитесь».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «возвратите на сердце», то есть вновь обдумайте и глубоко усвойте.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «преступники», «бунтовщики».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ זֹאת
  choice: Помните об этом
  rationale: Повелительное множественного числа от זכר и указательное זֹאת переданы прямо и естественно; оборот указывает на сказанное в ближайшем контексте.
- source_word: וְהִתְאֹשָׁשׁוּ
  choice: и стойте твёрдо
  rationale: Редкая форма допускает разные толкования, но, вероятнее всего, призывает укрепиться, проявить стойкость. Перевод не вносит отсутствующего в самой форме указания на мужской пол и не принимает контекстуальное «стыдитесь» за бесспорное значение.
- source_word: הָשִׁיבוּ עַל־לֵב
  choice: примите это к сердцу
  rationale: Буквально выражение означает «возвратите на сердце»; русский идиоматический оборот передаёт призыв вновь обдумать сказанное и глубоко его усвоить.
- source_word: פוֹשְׁעִים
  choice: мятежники
  rationale: Причастие от פשע обозначает тех, кто восстаёт, бунтует или преступает верность. «Мятежники» сохраняет активный оттенок сопротивления, уместный в обращении пророка.
theological_decisions:
- issue: Значение редкого глагола וְהִתְאֹשָׁשׁוּ
  choice: стойте твёрдо
  alternative: устыдитесь; будьте мужественны; укрепитесь
  rationale: Значение формы не вполне определённо. Основной текст следует вероятному значению укрепления или стойкости, а примечание сохраняет существенные древние и лексические альтернативы, не превращая одну из них в богословски обязательное прочтение.
translation_notes:
  register: Современный литературный русский язык с кратким, повелительным и пророчески торжественным звучанием. Сохранены образ сердца, прямое обращение и лексическая неоднозначность редкого еврейского глагола.
