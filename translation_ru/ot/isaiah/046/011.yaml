  naturalness: Предлагаемая редакция остаётся современной литературной и ритмически торжественной. «Человек Моего замысла» несколько возвышенно, но естественно в пророческом регистре и точнее, чем развёрнутое толкование «который исполнит».
  terminology: «Хищная птица» верно не конкретизирует עַיִט. «Человек Моего замысла» передаёт чтение qere; примечание должно отразить также согласный текст с «его». Имя Кира уместно оставить только в примечании.
