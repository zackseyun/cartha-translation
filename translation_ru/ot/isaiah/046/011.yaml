  text: calling from the east a bird of prey[a], from a distant land the man of my purpose. Indeed, I have spoken; indeed, I will bring it to pass. I have formed it; indeed[b], I will do it.
translation:
  language: ru
  text: Я призываю с востока хищную птицу, из далёкой страны — человека Моего замысла.[a][b] Да, Я сказал; да, Я приведу это в исполнение. Я образовал это; да, Я сделаю это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человека Моего совета». В согласном тексте стоит: «человека его совета (или замысла)»; традиционное чтение: «Моего».'
    reason: textual_and_lexical_alternative
  - marker: b
    text: В более широком контексте этого призванного с востока человека часто понимают как Кира, однако в данном стихе он не назван.
    reason: cross_reference
lexical_decisions:
- source_word: קֹרֵא
  choice: Я призываю
  rationale: Причастие qal описывает действие Бога и продолжает предшествующее Его самоописание. В русском личная форма естественнее причастного оборота и ясно передаёт подразумеваемое первое лицо.
- source_word: מִמִּזְרָח
  choice: с востока
  rationale: מִזְרָח может буквально относиться к восходу солнца, но обычно обозначает восток; здесь уместно ясное географическое значение.
- source_word: עַיִט
  choice: хищную птицу
  rationale: Слово обозначает хищную, пожирающую добычу птицу без указания конкретного вида, поэтому перевод не уточняет его как «орла».
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: из далёкой страны
  rationale: Естественно передаёт географическую удалённость, выраженную еврейским оборотом.
- source_word: אִישׁ עֲצָתוֹ / עֲצָתִי
  choice: человека, который исполнит Мой замысел
  rationale: Контекст говорит о человеке как об орудии Божьего намерения. Функциональная формулировка естественна по-русски; текстовый и буквальный варианты отмечены в сноске.
- source_word: אַף
  choice: Да; усиление посредством конструкции «и …»
  rationale: Повторяющаяся частица имеет подтверждающе-усилительное значение. Однократное «Да» и параллельные краткие фразы сохраняют напор, не делая русский текст тяжеловесным.
- source_word: דִּבַּרְתִּי
  choice: Я сказал
  rationale: Совершенный вид передаёт завершённость Божьего высказывания и его действенную силу.
- source_word: אֲבִיאֶנָּה
  choice: приведу это в исполнение
  rationale: Женский суффикс, вероятнее всего, указывает на подразумеваемый замысел или объявленное дело. Русское «это» сохраняет референциальную открытость.
- source_word: יָצַרְתִּי
  choice: Я замыслил
  rationale: Основной образ глагола — формировать, придавать образ; применительно к будущему делу он выражает намеренное устроение. «Замыслил» естественно передаёт этот смысл в контексте, хотя ослабляет конкретную метафору.
- source_word: אֶעֱשֶׂנָּה
  choice: сделаю
  rationale: Краткий глагол сохраняет лаконичность и решительность еврейского заключения.
theological_decisions:
- issue: Кого обозначают «хищная птица» и человек из далёкой страны
  choice: Не называть этого человека в основном тексте и сохранить образ источника.
  alternative: Прямо назвать Кира либо понимать выражение обобщённо как любое орудие Божьего суда и замысла.
  rationale: В широком контексте фигуру часто отождествляют с Киром, однако в данном стихе имя не названо; перевод не должен превращать контекстуальное толкование в явное утверждение текста.
- issue: Референт женских суффиксов в אֲבִיאֶנָּה и אֶעֱשֶׂנָּה
  choice: Передать нейтральным «это», относящимся к сказанному Богом замыслу или делу.
  alternative: Передать как «его», относя к призываемому человеку, либо конкретизировать как «Мой замысел».
  rationale: Женский род суффиксов не согласуется с существительным «человек» мужского рода и естественнее указывает на подразумеваемое дело, слово или намерение; «это» не сужает возможный референт.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным ритмом. Местоимение «Мой» написано с прописной буквы как уважительное обозначение Бога. Параллелизм второй половины стиха сохранён краткими симметричными фразами.
