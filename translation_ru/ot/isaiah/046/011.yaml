  rationale: Заменено толковательное «который исполнит Мой замысел» на именную конструкцию, соответствующую еврейскому тексту; «Я замыслил» исправлено на «Я образовал», чтобы сохранить значение יצר. Повторяющаяся частица אַף передана повтором «да», а нейтральное «это» сохраняет неуточнённый референт женских суффиксов.
