lexical_decisions:
- source_word: קָרְסוּ
  choice: осели
  rationale: Глагол передаёт опускание, проседание или обрушение. «Осели» сохраняет образ бессильно опускающихся идолов и не усиливает его до полного падения.
- source_word: כָרְעוּ
  choice: склонились
  rationale: Глагол означает преклониться, согнуться или опуститься на колени; «склонились» естественно передаёт физический образ и иронию над богами, которые сами преклоняются.
- source_word: יַחְדָּו
  choice: все вместе
  rationale: Передаёт совместность действия; добавление «все» естественно по-русски подчёркивает совокупность персонажей.
- source_word: לֹא יָכְלוּ מַלֵּט
  choice: не смогли спасти
  rationale: Сочетание выражает неспособность дать ускользнуть, избавить или спасти. Прошедшее время соответствует еврейским перфектным формам и связному русскому повествованию.
- source_word: מַשָּׂא
  choice: ношу
  rationale: Слово обозначает груз или бремя, которое несут. «Ноша» сохраняет предметный образ и связь с переносимыми изваяниями.
- source_word: וְנַפְשָׁם
  choice: и сами
  rationale: נֶפֶשׁ может обозначать душу, жизнь или самого носителя жизни. В данном олицетворении «сами» естественно передаёт рефлексивный смысл, не отрицая буквальной неоднозначности.
- source_word: בַּשְּׁבִי הָלָכָה
  choice: пошли в плен
  rationale: Идиоматически передаёт движение в состояние плена. Множественное число согласовано с русским «сами», тогда как в еврейском глагол стоит в женском единственном числе при נֶפֶשׁ.
theological_decisions:
- issue: Олицетворение богов/идолов в последней части стиха
  choice: «и сами пошли в плен»
  alternative: «и их душа (или жизнь) пошла в плен»
  rationale: В контексте насмешки над бессилием вавилонских богов נֶפֶשׁ может обозначать их самих. Основной текст звучит естественно по-русски, а сноска сохраняет буквальную лексическую и богословскую напряжённость, не приписывая идолам определённого учения о душе.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческой речи. Прошедшие формы следуют формам исходного текста; лексическая неоднозначность קָרְסוּ и נֶפֶשׁ сохранена в сносках.
