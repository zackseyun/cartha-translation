  text: כָּרַ֥ע בֵּל֙ קֹרֵ֣ס נְב֔וֹ הָיוּ֙ עֲצַבֵּי/הֶ֔ם לַ/חַיָּ֖ה וְ/לַ/בְּהֵמָ֑ה נְשֻׂאֹתֵי/כֶ֣ם עֲמוּס֔וֹת מַשָּׂ֖א לַ/עֲיֵפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/001.yaml
  text: Bel bows down[a]; Nebo stoops. Their idols are for the beasts and the cattle. Your loads are borne[c][b], loaded as a burden for the weary.
translation:
  language: ru
  text: Склонился Бел, согнулся Нево. Их идолов[a] взвалили на зверей и скот; то, что вы носили, погружено — груз для изнурённой.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изваяния». Здесь имеются в виду изготовленные культовые изображения.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст этой части стиха труден. Более буквально: «то, что вы носили, погружено — ноша для изнурённой». Последнее слово стоит в женском роде и, вероятно, подразумевает утомлённое вьючное животное.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: כָּרַע
  choice: склонился
  rationale: Форма перфекта изображает унижение и падение Бела как уже совершившееся; прошедшее время естественно передаёт эту пророческую картину по-русски.
- source_word: בֵּל
  choice: Бел
  rationale: Имя вавилонского божества передано транслитерацией с еврейской формы.
- source_word: קֹרֵס
  choice: согнулся
  rationale: Причастие от קרס описывает того, кто сгибается или оседает под тяжестью; «согнулся» сохраняет параллель со «склонился» и образ унижения.
- source_word: נְבוֹ
  choice: Нево
  rationale: Имя вавилонского божества передано в привычной русской библейской форме.
- source_word: עֲצַבֵּיהֶם
  choice: их идолы
  rationale: В данном пророческом контексте слово обозначает изготовленные культовые изображения и несёт полемический оттенок; «идолы» передаёт его яснее всего.
- source_word: לַחַיָּה וְלַבְּהֵמָה
  choice: для зверей и скота
  rationale: Сохраняется парное обозначение животных; контекст показывает, что идолы становятся перевозимой ими ношей.
- source_word: נְשֻׂאֹתֵיכֶם
  choice: ваши ноши
  rationale: Трудная форма буквально указывает на «ваши переносимые вещи» или «то, что несут у вас»; «ваши ноши» сохраняет обращение к почитателям идолов и мотив переноски, не уточняя сверх текста, кто именно несёт.
- source_word: עֲמוּסוֹת
  choice: навьючены
  rationale: Страдательное причастие описывает предметы, погруженные на животных; «навьючены» естественно и конкретно передаёт этот образ.
- source_word: מַשָּׂא לַעֲיֵפָה
  choice: груз для изнурённого животного
  rationale: מַשָּׂא означает груз или ношу, а форма женского рода לַעֲיֵפָה, вероятно, подразумевает утомлённое животное; это уточнение вынесено также в примечание из-за грамматической неоднозначности.
theological_decisions:
- issue: Обозначение языческих культовых изображений
  choice: идолы
  alternative: изваяния
  rationale: 'Контекст противопоставляет беспомощные изображения Богу Израиля: их приходится перевозить как груз. «Идолы» сохраняет полемическую силу текста, а более нейтральная возможность отмечена в сноске.'
- issue: Соотношение божеств и их изображений
  choice: Бел и Нево представлены как униженные, после чего названы их идолы
  alternative: понимать имена Бел и Нево исключительно как названия статуй
  rationale: Текст намеренно сближает божеств с их беспомощными изображениями. Перевод не устраняет это риторическое напряжение и не отождествляет их явным пояснением.
translation_notes:
  register: 'Современный литературный русский язык с кратким, торжественным пророческим ритмом. Параллелизм первой строки сохранён, а конкретный глагол «навьючены» делает понятной иронию: божества, которые должны были помогать людям, сами стали тяжёлым грузом.'
