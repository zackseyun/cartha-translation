  text: Кому вы уподобите Меня, с кем поставите Меня наравне и с кем сравните Меня, чтобы мы были подобны?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст нанизывает несколько близких по смыслу глаголов: «уподобить», «уравнять», «сравнить». Или: «Кому вы уподобите Меня, с кем уравняете Меня и с кем сопоставите Меня, чтобы мы были подобны?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִי
  choice: Кому
  rationale: Предлог לְ при вопросительном местоимении обозначает объект сопоставления — «кому?». Начальная позиция сохраняет силу риторического вопроса.
- source_word: תְדַמְיוּנִי
  choice: вы уподобите Меня
  rationale: Пиэль глагола דמה означает «уподоблять, сравнивать»; форма передаёт прямое дополнение первого лица.
- source_word: וְתַשְׁווּ
  choice: с кем поставите наравне
  rationale: Хифиль глагола שוה выражает уравнивание или постановку на один уровень. Оборот «поставить наравне» естественен по-русски; подразумеваемый второй участник сравнения передан как «с кем».
- source_word: וְתַמְשִׁלוּנִי
  choice: и с кем сравните
  rationale: Хифиль משל здесь означает «сравнить, уподобить». Отдельный русский глагол сохраняет накопление близких по смыслу выражений.
- source_word: וְנִדְמֶה
  choice: чтобы мы оказались подобны
  rationale: Форма первого лица множественного числа от דמה включает Бога и предполагаемый объект сравнения; «чтобы» передаёт предполагаемый результат, не утверждая действительного сходства.
theological_decisions:
- issue: Полемика против сравнения Бога с идолами
  choice: Сохранить последовательность трёх близких по смыслу сравнительных выражений.
  alternative: Свести их к одному или двум глаголам ради большей гладкости.
  rationale: Нагромождение почти синонимичных глаголов усиливает риторический вызов и не допускает скрытого добавления конфессионального толкования.
- issue: Смысл заключительного וְנִדְמֶה
  choice: «чтобы мы оказались подобны»
  alternative: «чтобы нам быть похожими» или «и мы были бы подобны»
  rationale: Выбранная формулировка сохраняет первое лицо множественного числа и представляет подобие как предполагаемый итог сравнения, а не как установленный факт.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией пророческого риторического вопроса. Заглавная буква в «Меня» служит русской библейской издательской норме; синтаксис остаётся понятным широкому читателю.
