lexical_decisions:
- source_word: זִכְרוּ
  choice: Вспомните
  rationale: Форма повелительного наклонения во множественном числе призывает слушателей сознательно обратиться к памяти; «вспомните» прямо и естественно передаёт этот призыв.
- source_word: רִאשֹׁנוֹת
  choice: прежнее
  rationale: Субстантивированное прилагательное во множественном числе обозначает прежние дела или события. Собирательное «прежнее» сохраняет широту выражения, не уточняя без основания, идёт ли речь только о событиях или также о Божьих деяниях.
- source_word: מֵעוֹלָם
  choice: что было издревле
  rationale: В данном контексте слово указывает на отдалённое прошлое, а не обязательно на вечность как отвлечённое понятие. Оборот «что было издревле» естественен в современном литературном русском и сохраняет возвышенный регистр.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для повеления помнить. «Ведь» ясно и естественно передаёт пояснительно-причинную связь.
- source_word: אָנֹכִי אֵל
  choice: Я — Бог
  rationale: אֵל употреблено как обозначение Бога, а не как имя, требующее транслитерации. Именная конструкция с тире естественно передаёт еврейское самоопределение.
- source_word: וְאֵין עוֹד
  choice: и другого нет
  rationale: 'Еврейский оборот выражает исключительность: иного Бога не существует. Русская формулировка кратка и сохраняет силу утверждения, а подразумеваемое слово «Бог» ясно из контекста.'
- source_word: אֱלֹהִים
  choice: Я — Бог
  rationale: 'Согласно синтаксическому параллелизму и масоретскому членению, слово начинает второе утверждение с подразумеваемыми местоимением и связкой: «[Я —] Бог». Их восполнение по-русски делает параллельную структуру ясной.'
- source_word: וְאֶפֶס כָּמוֹנִי
  choice: и нет подобного Мне
  rationale: Выражение утверждает несравненность Бога. «Нет подобного Мне» точно и торжественно передаёт смысл, не добавляя чуждых тексту уточнений.
theological_decisions:
- issue: Божественное самоопределение и исключительность
  choice: 'Сохранить два параллельных утверждения: «Я — Бог, и другого нет; Я — Бог, и нет подобного Мне».'
  alternative: 'Передать одной непрерывной фразой: «Я — Бог, и нет другого Бога, и нет подобного Мне».'
  rationale: Масоретское членение допускает понимание אֱלֹהִים как начала второй параллельной части с восполнением «Я —». Повтор подчёркивает как отсутствие иного Бога, так и несравненность говорящего, не вводя дополнительного догматического содержания.
translation_notes:
  register: Современный литературный русский с dignified библейским звучанием. Слово «издревле» сохраняет возвышенность, оставаясь понятным; синтаксис не перегружен архаизмами. Маркер [a] помещён непосредственно после относящегося к нему выражения.
