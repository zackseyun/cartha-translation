  variant: modern literary Russian
source:
  edition: WLC
  text: יִ֠שָּׂאֻ/הוּ עַל כָּתֵ֨ף יִסְבְּלֻ֜/הוּ וְ/יַנִּיחֻ֤/הוּ תַחְתָּי/ו֙ וְ/יַֽעֲמֹ֔ד מִ/מְּקוֹמ֖/וֹ לֹ֣א יָמִ֑ישׁ אַף יִצְעַ֤ק אֵלָי/ו֙ וְ/לֹ֣א יַעֲנֶ֔ה מִ/צָּרָת֖/וֹ לֹ֥א יוֹשִׁיעֶֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/007.yaml
  text: They lift it onto the shoulder[a], they carry it, and they set it in its place, and it stands there; it does not move from its place. Even if someone cries out to it, it does not answer; it does not save him from his distress.
translation:
  language: ru
  text: Его поднимают на плечо[a], несут и ставят на место. Он стоит и не сдвигается со своего места. Даже если кто-нибудь воззовёт к нему, он не ответит и не спасёт его от бедствия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ставят его под ним»; смысл выражения не вполне ясен. Вероятно, речь об установке идола на его основании или пьедестале, то есть на предназначенном ему месте.'
    reason: лексическая неоднозначность
lexical_decisions:
- source_word: יִשָּׂאֻהוּ
  choice: его поднимают
  rationale: Глагол נשׂא обозначает начальное действие — идола поднимают; это отличает его от следующего סבל, «нести».
- source_word: עַל כָּתֵף
  choice: на плечо
  rationale: Единственное число «плечо» в еврейском идиоматично; при глаголе движения русское «на плечо» естественно передаёт направление.
- source_word: יִסְבְּלֻהוּ
  choice: несут
  rationale: סבל означает нести тяжесть; нейтральное «несут» сохраняет образ идола как груза.
- source_word: וְיַנִּיחֻהוּ תַחְתָּיו
  choice: ставят на место
  rationale: Буквально выражение содержит «под ним/под него», но в контексте, вероятно, означает установку идола на предназначенное место или основание; неоднозначность отмечена сноской.
- source_word: וְיַעֲמֹד
  choice: он стоит
  rationale: Мужской род местоимения естественно согласуется с подразумеваемым идолом и передаёт его неподвижное положение после установки.
- source_word: מִמְּקוֹמוֹ לֹא יָמִישׁ
  choice: не сдвигается со своего места
  rationale: מושׁ здесь означает удалиться или сдвинуться; формулировка сохраняет насмешку над неподвижностью идола.
- source_word: אַף יִצְעַק אֵלָיו
  choice: даже если кто-нибудь воззовёт к нему
  rationale: אַף придаёт уступительно-усилительный смысл, а неопределённое «кто-нибудь» естественно передаёт родовое употребление формы 3-го лица мужского рода.
- source_word: וְלֹא יַעֲנֶה
  choice: он не ответит
  rationale: ענה — обычный глагол ответа на зов или молитву; будущее совершенного вида естественно соответствует условной конструкции по-русски.
- source_word: מִצָּרָתוֹ לֹא יוֹשִׁיעֶנּוּ
  choice: не спасёт его от беды
  rationale: ישׁע в породе хифиль означает «спасти, избавить», а צָרָה — «беда, бедствие, теснота»; выбранная формулировка ясна и сохраняет богословски значимую лексику спасения.
theological_decisions:
- issue: Родовое мужское единственное число в заключительной части
  choice: «кто-нибудь… его… от беды»
  alternative: «он воззовёт… не спасёт его от его беды» или множественная инклюзивная передача
  rationale: Еврейская форма мужского рода единственного числа имеет обобщённое значение. «Кто-нибудь» ясно показывает неопределённость субъекта, а последующее «его» сохраняет единственное число без ненужного уточнения пола.
- issue: Способность идола спасать
  choice: «не спасёт»
  alternative: «не сможет спасти»
  rationale: В еврейском тексте прямо сказано, что идол не спасает, а не употреблена отдельная модальная конструкция о неспособности. Перевод не добавляет модальность, хотя контекст очевидно показывает бессилие идола.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Сохранены последовательность действий, иронический контраст между людьми, несущими идола, и его неподвижностью, а также лексика зова, ответа и спасения.
