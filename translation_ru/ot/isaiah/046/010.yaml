  text: declaring the end from the beginning[a], and from ancient times things that have not been done, saying, ‘My purpose shall stand[c][b], and I will accomplish all my good pleasure.’
translation:
  language: ru
  text: 'От начала Я возвещаю конец, и издревле — то, что ещё не совершилось[a]. Я говорю: «Мой замысел[b] устоит, и всё, чего Я желаю[c], Я исполню».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что не было сделано». Возможный перевод: «то, что ещё не произошло».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Моё решение»; «Мой совет».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «всю Мою волю»; «всё, что Мне угодно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַגִּיד
  choice: Я возвещаю
  rationale: Причастие породы хифиль означает «делать известным, возвещать». В русском конечная форма первого лица естественно продолжает Божье самоописание из контекста, не меняя смысла.
- source_word: מֵרֵאשִׁית אַחֲרִית
  choice: от начала то, что будет в конце
  rationale: Передаёт временное противопоставление «начало — конец»; добавление «то, что будет» необходимо для ясного и естественного русского синтаксиса.
- source_word: וּמִקֶּדֶם
  choice: и издревле
  rationale: Кратко и в возвышенном современном регистре передаёт временное значение קֶדֶם — «издавна, с давних времён».
- source_word: אֲשֶׁר לֹא נַעֲשׂוּ
  choice: то, что ещё не совершилось
  rationale: Сохраняет значение нифаля от עשה и в данном контексте ясно указывает на события, которые пока не произошли.
- source_word: אֹמֵר
  choice: Я говорю
  rationale: Конечная форма сохраняет параллелизм с «Я возвещаю» и естественно вводит прямую речь.
- source_word: עֲצָתִי
  choice: Мой замысел
  rationale: עֵצָה здесь обозначает намерение, решение или план. «Замысел» естественно выражает целенаправленность, не сводя слово к совету.
- source_word: תָקוּם
  choice: устоит
  rationale: 'Передаёт метафору прочности и действенности: Божий замысел сохранит силу и осуществится.'
- source_word: וְכָל חֶפְצִי
  choice: и всё, чего Я желаю
  rationale: חֵפֶץ допускает значения желания, воли и удовольствия. Такая формулировка естественна по-русски и сохраняет волевой оттенок без добавления оценки «благое».
- source_word: אֶעֱשֶׂה
  choice: Я исполню
  rationale: В сочетании с замыслом и желанием עשה означает осуществить задуманное; «исполню» точно и естественно передаёт этот результат.
theological_decisions:
- issue: Соотношение Божьего замысла и желания в עֲצָתִי и חֶפְצִי
  choice: «Мой замысел устоит, и всё, чего Я желаю, Я исполню»
  alternative: «Мой совет устоит, и всю Мою волю Я совершу»
  rationale: Выбранный вариант сохраняет утверждение о действенности Божьего намерения, но не вводит более узкой систематико-богословской формулы. Различие между «замыслом» и «желанием» отражает два разных еврейских слова.
- issue: Временной смысл אַחֲרִית
  choice: «то, что будет в конце»
  alternative: «конец» или «исход»
  rationale: Контраст с «началом» поддерживает временное понимание, однако формулировка не уточняет, идёт ли речь об окончании или итоговом исходе событий.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Формы первого лица делают продолжение Божьей речи естественным по-русски. Заглавное «Я» в прямой речи подчёркивает традиционное оформление Божьего самообозначения, не добавляя отдельного богословского смысла.
