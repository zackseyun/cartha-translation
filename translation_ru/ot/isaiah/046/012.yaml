  text: שִׁמְע֥וּ אֵלַ֖/י אַבִּ֣ירֵי לֵ֑ב הָ/רְחוֹקִ֖ים מִ/צְּדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/012.yaml
  text: Listen to me[a], you stubborn of heart[b], you who are far from righteousness.
translation:
  language: ru
  text: Слушайте Меня, упрямые сердцем[a], далёкие от праведности[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильные сердцем», «крепкие сердцем»; в данном контексте выражение, вероятно, имеет отрицательный смысл: внутренне упорные, непреклонные.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «далёкие от справедливости», «далёкие от оправдания»; здесь также может подразумеваться спасительное избавление, которое Бог приближает в следующем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Слушайте Меня
  rationale: Форма повелительного наклонения во множественном числе с направлением действия к говорящему. «Слушайте Меня» естественно передаёт призыв не просто услышать, а внять.
- source_word: אַבִּירֵי לֵב
  choice: упрямые сердцем
  rationale: Буквально выражение связано с силой или крепостью сердца, но в контексте пророческого обличения указывает на внутреннее упорство. Перевод сохраняет образ сердца и передаёт вероятный отрицательный смысл.
- source_word: הָרְחוֹקִים
  choice: далёкие
  rationale: Субстантивированное причастие характеризует тех же адресатов. Краткая конструкция естественна по-русски и сохраняет параллелизм обращения.
- source_word: מִצְּדָקָה
  choice: от праведности
  rationale: צְדָקָה охватывает значения праведности, справедливости и оправдывающего или спасительного Божьего деяния. «Праведность» сохраняет широту термина и его связь со следующим стихом.
theological_decisions:
- issue: Значение צְדָקָה
  choice: праведность
  alternative: справедливость; оправдание; спасительное избавление
  rationale: В Ис 46:12–13 слово может обозначать не только нравственную правоту, но и приближающееся праведное, спасительное действие Бога. Основной вариант не сужает эту смысловую напряжённость, а примечание показывает существенные альтернативы.
- issue: Отрицательный смысл אַבִּירֵי לֵב
  choice: упрямые сердцем
  alternative: сильные сердцем; крепкие сердцем
  rationale: Само выражение допускает буквальный смысл силы, однако обличительный контекст поддерживает значение непреклонности или упрямства. Альтернативы сохранены в примечании без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык; прямое пророческое обращение передано кратко и торжественно. Местоимение «Меня» написано с прописной буквы как относящееся к Богу. Восклицательный знак передаёт силу повелительного призыва.
