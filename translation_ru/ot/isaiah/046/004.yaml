base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/004.yaml
  text: Even to your old age[a], I am he, and to gray hairs I will carry you. I have made, and I will bear; I will carry[b], and I will rescue.
translation:
  language: ru
  text: И до старости вашей Я тот же, и до седин Я буду поддерживать вас. Я создал вас — и буду нести вас, буду поддерживать вас и избавлю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…и спасу». Еврейский глагол означает избавить, вывести в безопасное место, спасти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד זִקְנָה
  choice: И до старости вашей
  rationale: וְעַד выражает продолжение вплоть до указанного времени; притяжательное «вашей» естественно восстанавливается по обращению к народу и последующему образу Божьей заботы.
- source_word: אֲנִי הוּא
  choice: Я тот же
  rationale: Краткое торжественное самоутверждение Бога. В русском «Я тот же» естественно передаёт неизменность говорящего в данном временном контексте, не вводя более развёрнутой богословской формулы.
- source_word: וְעַד שֵיבָה
  choice: и до седин
  rationale: Сохраняется конкретный еврейский образ седины как обозначения преклонного возраста.
- source_word: אֶסְבֹּל
  choice: Я буду нести вас / Я буду поддерживать
  rationale: סבל охватывает значения несения тяжести и поддержания. Первое употребление передано через «нести», а второе — через «поддерживать», чтобы естественно выразить смысл без утраты образа заботы.
- source_word: עָשִׂיתִי
  choice: Я создал вас
  rationale: Обычное значение עשה — «делать, создавать»; подразумеваемое дополнение относится к народу. «Создал» ясно передаёт основание последующей заботы Бога.
- source_word: אֶשָּׂא
  choice: Я буду нести вас
  rationale: נשא здесь означает поддерживающее несение; добавленное «вас» восстанавливает подразумеваемый объект и делает русский текст ясным.
- source_word: וַאֲמַלֵּט
  choice: и избавлю
  rationale: Пиэль מלט означает вывести из опасности, избавить, спасти. «Избавлю» сохраняет широту значения и торжественный регистр.
theological_decisions:
- issue: Божественное самоотождествление אֲנִי הוּא
  choice: Я тот же
  alternative: это Я / Я — Он
  rationale: Выбор сохраняет краткость и вес божественного утверждения, а в контексте «до старости… до седин» подчёркивает непрерывность и неизменность Божьего присутствия, не привнося позднейших формулировок.
- issue: Подразумеваемый объект глаголов несения и создания
  choice: вас
  alternative: оставить объект невыраженным
  rationale: Контекст обращён к народу, которого Бог несёт; явное «вас» необходимо для естественного русского синтаксиса и не сужает референт до отдельного человека.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Параллелизм сохранён; лексическое варьирование «нести / поддерживать» отражает смысловой диапазон близких глаголов и избегает тяжеловесного повтора.
