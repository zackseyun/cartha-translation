  yaml_path: translation/ot/isaiah/046/003.yaml
  text: Listen to me[a], house of Jacob, and all the remnant of the house of Israel, who have been borne by me from birth, carried from the womb.
translation:
  language: ru
  text: 'Слушайте Меня, дом Иакова,

    и весь остаток дома Израиля —

    всех вас, кого Я ношу от чрева,

    кого несу от утробы.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте стоят два близких образа: «от чрева» и «от утробы». Они образуют поэтический параллелизм и говорят о Божьей заботе с самого начала жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Слушайте Меня
  rationale: Форма повелительного наклонения во множественном числе призывает не просто услышать звук, а внимательно внимать Богу; «слушайте Меня» естественно передаёт это в современном русском.
- source_word: בֵּית יַעֲקֹב
  choice: дом Иакова
  rationale: Сохранён устойчивый библейский образ народа как дома, то есть рода Иакова, без поясняющего перифраза.
- source_word: וְכָל שְׁאֵרִית בֵּית יִשְׂרָאֵל
  choice: и весь остаток дома Израиля
  rationale: «Остаток» сохраняет ключевое для книги Исаии понятие שְׁאֵרִית и литературную связь с другими пророческими местами.
- source_word: הַעֲמֻסִים
  choice: кого Я ношу
  rationale: Пассивный образ буквально описывает тех, кого несут. В русском активная конструкция ясно и естественно выражает подразумеваемое контекстом действие Бога и поддерживает противопоставление идолам, которых вынуждены носить люди (ст. 1–2).
- source_word: מִנִּי בֶטֶן
  choice: с самого рождения
  rationale: Выражение буквально связано с чревом и обозначает заботу с самого начала жизни; идиоматический русский оборот не создаёт неестественного повтора со следующей строкой.
- source_word: הַנְּשֻׂאִים מִנִּי רָחַם
  choice: кого несу ещё от материнской утробы
  rationale: נשׂא продолжает параллельный образ несения, а רָחַם конкретно обозначает материнскую утробу. «Ещё от» подчёркивает начало действия в самой ранней жизни.
theological_decisions:
- issue: Пророческое понятие «остатка»
  choice: остаток
  alternative: те, кто остался
  rationale: Формальный термин сохраняет богословскую и литературную преемственность употребления שְׁאֵרִית у Исаии, не добавляя к тексту конфессионального толкования.
- issue: Кто несёт Израиль
  choice: активные формы «Я ношу… несу»
  alternative: пассивные формы «носимые… несомые»
  rationale: В еврейском стоят пассивные причастия, однако ближайший контекст однозначно противопоставляет Господа, несущего Свой народ, идолам, которых несут люди. Активная русская конструкция делает подразумеваемого деятеля явным, не меняя образа.
- issue: Соотношение בטן и רחם
  choice: «с самого рождения» и «от материнской утробы»
  alternative: дважды «от утробы»
  rationale: Разные еврейские слова образуют поэтический параллелизм. Перевод сохраняет обе строки и общий смысл заботы с начала жизни, одновременно избегая механического повтора.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксическое добавление «все вы» согласует множественные причастия с совокупным обращением к дому Иакова и остатку Израиля. Строки оформлены поэтически, чтобы сохранить параллелизм оригинала.
