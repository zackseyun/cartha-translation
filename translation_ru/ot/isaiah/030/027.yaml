base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/027.yaml
  text: Look[a], the name of Yahweh comes from afar, burning with his anger, and with dense smoke; his lips are full of wrath, and his tongue is like a consuming fire.
translation:
  language: ru
  text: Вот, имя Яхве идёт издалека. Его гнев пылает, и поднимается густой дым[a]; уста Его полны ярости, и язык Его — словно пожирающий огонь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение неясно; буквальнее: «и тяжесть поднятия». Возможно также понимание: «и тяжкое бремя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Современная и естественная частица, которая привлекает внимание к открывающемуся пророческому видению.
- source_word: שֵׁם יְהוָה
  choice: имя Яхве
  rationale: Сохраняет явно выраженное в еврейском тексте «имя» как действующий субъект, не сводя выражение просто к «Яхве» и тем самым удерживая оттенок явленного присутствия и силы Бога.
- source_word: בָּא מִמֶּרְחָק
  choice: идёт издалека
  rationale: Передаёт приближение в живой пророческой картине и сохраняет возвышенный, но понятный русский язык.
- source_word: בֹּעֵר אַפּוֹ
  choice: Его гнев пылает
  rationale: Еврейское אַף буквально связано с носом или ноздрями, но здесь идиоматически означает гнев; глагол «пылает» сохраняет образ огня.
- source_word: וְכֹבֶד מַשָּׂאָה
  choice: и поднимается густой дым
  rationale: Трудное сочетание понято как описание тяжёлой, плотной массы поднимающегося дыма в контексте огненного явления. Неопределённость отмечена в сноске.
- source_word: שְׂפָתָיו מָלְאוּ זַעַם
  choice: уста Его полны ярости
  rationale: Близко передаёт образ губ или уст, наполненных сильным гневом; «уста» поддерживает достоинство пророческого регистра без чрезмерной архаичности.
- source_word: וּלְשׁוֹנוֹ כְּאֵשׁ אֹכָלֶת
  choice: и язык Его — словно пожирающий огонь
  rationale: Сохраняет сравнение и активную разрушительную силу причастия אֹכָלֶת.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное имя, непосредственно стоящее в исходном тексте, без замены титулом.
- issue: Сохранение выражения «имя Яхве» как действующего субъекта
  choice: имя Яхве идёт
  alternative: Яхве идёт
  rationale: Еврейский текст прямо называет субъектом «имя Яхве». Сохранение этой формулировки не устраняет напряжение между самим Богом и явлением Его имени и присутствия.
- issue: Толкование трудного выражения וְכֹבֶד מַשָּׂאָה
  choice: образ густого поднимающегося дыма
  alternative: тяжесть поднятия; тяжкое бремя
  rationale: Контекст пылающего гнева и пожирающего огня поддерживает конкретный образ дыма, однако еврейская формулировка неясна, поэтому буквальная возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Формы «уста» и инверсия с местоимением поддерживают достоинство речи, оставаясь понятными современному читателю.
