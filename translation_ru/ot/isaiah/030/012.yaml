  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ קְד֣וֹשׁ יִשְׂרָאֵ֔ל יַ֥עַן מָֽאָסְ/כֶ֖ם בַּ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/תִּבְטְחוּ֙ בְּ/עֹ֣שֶׁק וְ/נָל֔וֹז וַ/תִּֽשָּׁעֲנ֖וּ עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/012.yaml
  text: 'Therefore thus says the Holy One of Israel: Because you have rejected this word[a], and have trusted in oppression and perversity, and have relied on it[b],'
translation:
  language: ru
  text: 'Поэтому так говорит Святой Израиля: «За то, что вы отвергли это слово[a], положились на угнетение и коварство и оперлись на это[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это послание»; или: «это дело».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте местоимение стоит в единственном числе: «на него». Оно может относиться к сказанному в целом или преимущественно к последнему названному понятию. «Угнетение» можно также перевести как «вымогательство», а «коварство» — как «извращённость» или «кривду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт логический вывод из предшествующего обличения.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная и узнаваемая по-русски формула пророческой речи.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  rationale: Точно сохраняет характерный для Исаии титул Бога.
- source_word: יַעַן
  choice: За то, что
  rationale: Вводит основание последующего приговора и естественно согласуется с незавершённым продолжением предложения.
- source_word: מָאַסְכֶם
  choice: вы отвергли
  rationale: Передаёт сознательное неприятие без излишнего усиления до эмоционального презрения.
- source_word: בַּדָּבָר הַזֶּה
  choice: это слово
  rationale: Сохраняет широкий смысл דָּבָר и вероятную отсылку к пророческому слову.
- source_word: בְּעֹשֶׁק
  choice: на угнетение
  rationale: Передаёт несправедливое притеснение; контекст допускает также вымогательство или грабёж.
- source_word: וְנָלוֹז
  choice: и коварство
  rationale: Естественно по-русски выражает нравственно извращённые, нечестные средства, не устраняя оттенок кривизны.
- source_word: וַתִּשָּׁעֲנוּ עָלָיו
  choice: и оперлись на них
  rationale: Сохраняет образ опоры. Русское множественное число естественно соотносит местоимение с парой названных средств, хотя в еврейском местоимение стоит в единственном числе.
theological_decisions:
- issue: К чему относится «это слово»
  choice: к только что возвещённому пророческому слову или предостережению
  alternative: «это дело» или «этот замысел»
  rationale: Контекст поддерживает отсылку к Божьему слову через пророка, но примечание сохраняет лексическую широту דָּבָר.
- issue: Характер того, на что надеется народ
  choice: угнетение и коварство
  alternative: вымогательство и извращённость; обман и кривда
  rationale: Перевод сохраняет нравственное обличение несправедливых и нечестных средств, не сводя его к одному конкретному историческому механизму.
- issue: Референт местоимения עָלָיו
  choice: оба названных средства, переданные русским «на них»
  alternative: единственное число «на это» или отсылка преимущественно к последнему слову
  rationale: Еврейская форма единственного числа допускает собирательную отсылку. Русское «на них» яснее и естественнее после двух однородных существительных; исходная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Начальная кавычка оставлена незакрытой, поскольку стих представляет собой начало прямой речи, продолжающейся в следующем стихе.
