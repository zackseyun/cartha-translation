base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/005.yaml
  text: Everyone is put to shame because of a people that cannot profit them[a]—who are not for help and not for profit, but for shame and also for reproach.
translation:
  language: ru
  text: 'Все покрылись позором[a] из-за народа, который не может принести им пользы: от него ни помощи, ни пользы — только стыд и поношение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово הבאיש трудно для истолкования. Оно связано со значениями «сделать отвратительным» или «сделать зловонным», но в контексте неудачного союза и рядом со словами «стыд» и «поношение» предпочтителен смысл публичного посрамления.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Все
  rationale: Передаёт совокупность всех участников и естественно согласуется в русском с глаголом во множественном числе.
- source_word: הבאיש
  choice: покрылись позором
  rationale: Трудная форма буквально связана с представлением о том, чтобы стать отвратительным или дурно пахнуть; однако контекст неудачного союза и параллель со «стыдом» и «поношением» указывают на публичное посрамление.
- source_word: עַל
  choice: из-за
  rationale: Предлог обозначает причину или повод их позора.
- source_word: עַם
  choice: народа
  rationale: Сохраняет еврейское собирательное существительное и не вводит прямо имя Египта, хотя оно ясно из контекста.
- source_word: לֹא יוֹעִילוּ לָמוֹ
  choice: который не может принести им пользы
  rationale: Передаёт отсутствие практической пользы; «не может» естественно выражает контекстуальную неспособность помочь.
- source_word: לְעֵזֶר
  choice: ни помощи
  rationale: Краткая именная конструкция сохраняет параллелизм.
- source_word: לְהוֹעִיל
  choice: ни пользы
  rationale: Повтор слова «польза» сохраняет лексическую связь с יוֹעִילוּ.
- source_word: כִּי
  choice: только
  rationale: В данном противопоставлении частица вводит реальный результат вместо ожидаемых помощи и пользы.
- source_word: לְבֹשֶׁת
  choice: стыд
  rationale: Прямо передаёт результат постыдного союза.
- source_word: וְגַם לְחֶרְפָּה
  choice: и поношение
  rationale: «Поношение» передаёт публичный позор и презрительное осуждение; союз сохраняет добавочное усиление.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык. Формулировка сохраняет риторический параллелизм и различает публичное посрамление («покрылись позором») и последующий «стыд». Тире естественно подчёркивает контраст между ожидаемой пользой и фактическим исходом.
