id: ISA.30.33
reference: Isaiah 30:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי עָר֤וּךְ מֵֽ/אֶתְמוּל֙ תָּפְתֶּ֔ה גַּם הוא לַ/מֶּ֥לֶךְ הוּכָ֖ן הֶעְמִ֣יק הִרְחִ֑ב מְדֻרָתָ֗/הּ אֵ֤שׁ וְ/עֵצִים֙ הַרְבֵּ֔ה נִשְׁמַ֤ת יְהוָה֙ כְּ/נַ֣חַל גָּפְרִ֔ית בֹּעֲרָ֖ה בָּֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/033.yaml
  text: For Topheth has long been prepared[a]; indeed, it is made ready for the king. He has made it deep and wide, with a pyre of fire and wood in abundance. The breath of Yahweh, like a stream of sulfur[c][b], kindles it.
translation:
  language: ru
  text: Ведь Тофет[a] приготовлен издавна[b]; и для царя он приготовлен. Его кострище углубили и расширили; огня и дров там в изобилии. Дыхание Яхве, словно поток серы, пылает в нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тофет — название места, связанное с образами сожжения и суда.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «со вчера»; здесь это выражение означает, что место приготовлено заранее, с давних пор.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּךְ מֵאֶתְמוּל
  choice: приготовлен издавна
  rationale: Причастие עָרוּךְ передаёт состояние как результат приготовления, а буквально означающее «со вчера» מֵאֶתְמוּל здесь указывает на давнее, заблаговременное приготовление.
- source_word: תָּפְתֶּה
  choice: Тофет
  rationale: Сохранено традиционное русское написание географического названия, связанного в контексте с образом огненного суда.
- source_word: גַּם הוא לַמֶּלֶךְ הוּכָן
  choice: приготовлен он и для царя
  rationale: Частица גַּם передана как «и», а определённое לַמֶּלֶךְ — без уточнения личности царя, поскольку сам стих её не называет.
- source_word: הֶעְמִיק הִרְחִב
  choice: Его сделали глубоким и широким
  rationale: Каузативное значение глаголов сохранено. Неопределённо-личная конструкция не называет подразумеваемого деятеля и тем самым не устраняет не выраженную прямо в еврейском тексте референцию субъекта.
- source_word: מְדֻרָתָהּ
  choice: в его кострище
  rationale: Слово обозначает место или устройство для горения; «кострище» сохраняет образ специально подготовленного места с огнём и дровами, не добавляя погребального смысла.
- source_word: אֵשׁ וְעֵצִים הַרְבֵּה
  choice: огонь и множество дров
  rationale: Переданы оба элемента и значение изобилия в הַרְבֵּה.
- source_word: נִשְׁמַת יְהוָה
  choice: Дыхание Яхве
  rationale: נְשָׁמָה прямо обозначает дыхание, которое в данном образе обладает воспламеняющей силой; имя יהוה передано как «Яхве».
- source_word: כְּנַחַל גָּפְרִית
  choice: словно поток серы
  rationale: «Поток» естественно передаёт נַחַל в сравнении, а «сера» является современным и точным соответствием גָּפְרִית.
- source_word: בֹּעֲרָה בָּהּ
  choice: разжигает его
  rationale: По контексту причастие описывает действие дыхания Яхве, воспламеняющего подготовленное место; местоимение соотнесено с Тофетом/кострищем.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Кого обозначает «царь»
  choice: для царя
  alternative: для ассирийского царя / для Молоха
  rationale: Еврейский текст не уточняет референта; перевод сохраняет эту неоднозначность и не вносит спорного отождествления.
- issue: Субъект глаголов «сделал глубоким и широким»
  choice: не назван прямо
  alternative: Яхве сделал его глубоким и широким
  rationale: Формы глаголов имеют мужской род, единственное число, но существительное-субъект не выражено. Неопределённо-личная русская конструкция избегает добавления имени субъекта.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис остаётся ясным для широкого читателя; сохранены повтор «приготовлен», образ огня и неопределённость относительно царя и невыраженного деятеля.
