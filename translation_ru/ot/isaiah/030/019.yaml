  text: כִּי עַ֛ם בְּ/צִיּ֥וֹן יֵשֵׁ֖ב בִּ/ירֽוּשָׁלִָ֑ם בָּכ֣וֹ לֹֽא תִבְכֶּ֗ה חָנ֤וֹן יָחְנְ/ךָ֙ לְ/ק֣וֹל זַעֲקֶ֔/ךָ כְּ/שָׁמְעָת֖/וֹ עָנָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/019.yaml
  text: For a people in Zion will dwell in Jerusalem[a]; you will surely weep no more. He will surely be gracious to you at the sound of your cry; when he hears it[b], he will answer you.
translation:
  language: ru
  text: Ибо народ на Сионе будет жить в Иерусалиме. Ты больше не будешь плакать[a]. Он непременно явит тебе милость[b] при звуке твоего вопля; как только услышит его, ответит тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плача, не будешь плакать» — усилительная еврейская конструкция со значением «совсем не будешь плакать» или «больше не будешь плакать».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «милуя, помилует тебя» — усилительная конструкция, подчёркивающая несомненность Божьей милости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего обетования; «ибо» естественно сохраняет логическую связь и возвышенный, но понятный регистр.
- source_word: עַם
  choice: народ
  rationale: Собирательное существительное обозначает жителей Сиона без излишней конкретизации.
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: Для названия горы и священного места в русском языке нормативно сочетание «на Сионе»; имя собственное сохранено.
- source_word: יֵשֵׁב
  choice: будет жить
  rationale: В контексте заселения и восстановления ישׁב означает постоянное проживание; современное «жить» здесь естественнее, чем более архаичное «обитать».
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Сохраняется географический параллелизм с Сионом и традиционная русская форма топонима.
- source_word: בָּכוֹ לֹא תִבְכֶּה
  choice: ты больше не будешь плакать
  rationale: Инфинитив абсолютный при личной форме усиливает отрицание; оборот «больше не будешь» естественно передаёт прекращение плача и уверенность обещания.
- source_word: חָנוֹן יָחְנְךָ
  choice: Он непременно явит тебе милость
  rationale: Повтор корня חנן выражает усиление и несомненность; «явит милость» передаёт оказание благоволения, а «непременно» — эмфазу конструкции.
- source_word: לְקוֹל זַעֲקֶךָ
  choice: услышав твой вопль
  rationale: Буквально речь идёт о голосе вопля. Русская формулировка сохраняет слуховой образ и выражает реакцию на мольбу.
- source_word: כְּשָׁמְעָתוֹ
  choice: как только Он услышит
  rationale: Временное значение конструкции естественно передаётся оборотом «как только», подчёркивающим непосредственность ответа; подразумеваемый объект — вопль.
- source_word: עָנָךְ
  choice: ответит тебе
  rationale: Глагол ענה означает «отвечать, откликаться»; будущее время соответствует контексту обещания восстановления.
theological_decisions:
- issue: Подразумеваемое подлежащее в заключительных предложениях
  choice: Явно обозначить его местоимением «Он», относящимся к Господу
  alternative: Оставить субъект невыраженным или повторить имя «Господь»
  rationale: В еврейских глагольных формах субъект грамматически подразумевается, а контекст указывает на Господа. Местоимение делает русский текст ясным, не добавляя нового содержания.
- issue: Переход от собирательного «народ» к обращению во втором лице единственного числа
  choice: Сохранить прямое «ты», как в еврейском тексте
  alternative: 'Согласовать по-русски в третьем лице: «он больше не будет плакать»'
  rationale: Формы תִבְכֶּה, יָחְנְךָ и עָנָךְ обращены к народу как к единому адресату. Сохранение «ты» передаёт риторическую непосредственность и не сглаживает смену грамматической перспективы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сохранены географические названия, прямое обращение к народу и две еврейские усилительные конструкции; буквальный повтор вынесен в сноски ради естественности основного текста.
