base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/002.yaml
  text: who set out to go down to Egypt, but have not asked my mouth, to seek refuge in Pharaoh’s stronghold and to take shelter in the shadow of Egypt.
translation:
  language: ru
  text: которые идут в Египет, но не вопросив Моих уст, чтобы обрести защиту в твердыне фараона и укрыться в тени Египта.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַהֹלְכִים לָרֶדֶת מִצְרַיִם
  choice: которые отправляются в Египет
  rationale: Идиома «спуститься в Египет» отражает географическое направление, но по-русски без специального контекста звучит неестественно; «отправляются» ясно передаёт движение и сохраняет причастную конструкцию.
- source_word: וּפִי לֹא שָׁאָלוּ
  choice: не спросив Моих уст
  rationale: 'Сохранён необычный образ оригинала: речь идёт о том, что они не запросили Божьего решения или совета. Притяжательное «Моих» следует масоретскому тексту и контексту речи Господа.'
- source_word: לָעוֹז בְּמָעוֹז פַּרְעֹה
  choice: чтобы найти опору в твердыне фараона
  rationale: 'Сохранена игра однокоренных слов עוז/מעוז настолько, насколько это позволяет естественный русский: искомая поддержка связывается с укреплённой силой фараона.'
- source_word: וְלַחְסוֹת בְּצֵל מִצְרָיִם
  choice: и укрыться в тени Египта
  rationale: «Укрыться в тени» буквально и естественно передаёт древний образ покровительства и защиты.
theological_decisions:
- issue: Источник совета в выражении «Моих уст»
  choice: Сохранить прямое указание на уста Бога
  alternative: «не спросив у Меня совета»
  rationale: Более объяснительный вариант устраняет яркую метонимию и конкретность еврейского текста; выбранный перевод не определяет способ получения ответа.
- issue: Характер надежды на фараона
  choice: «найти опору в твердыне фараона»
  alternative: «положиться на защиту фараона»
  rationale: Выбранный вариант сохраняет как идею упования, так и образ укрепления, не сводя выражение только к политическому союзу.
translation_notes:
  register: Современный литературный русский с сохранением поэтических образов пророческой речи. Синтаксис продолжает характеристику людей из предыдущего стиха; формулировка рассчитана на чтение в составе контекста.
