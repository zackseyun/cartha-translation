base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/004.yaml
  text: For his officials are in Zoan, and his envoys reach Hanes.
translation:
  language: ru
  text: Потому что его сановники в Цоане, и его посланники достигают Ханеса.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרָיו
  choice: его сановники
  rationale: Передаёт высокопоставленных представителей или должностных лиц фараона; «сановники» естественно для литературного русского и соответствует политико-дипломатическому контексту.
- source_word: מַלְאָכָיו
  choice: его посланники
  rationale: В данном контексте слово обозначает человеческих дипломатических посланцев, а не небесных ангелов.
- source_word: יַגִּיעוּ
  choice: достигают
  rationale: Сохраняет значение достижения места назначения и форму незавершённого действия без внесения уточнения «прибывают», отсутствующего в еврейском тексте.
- source_word: צֹעַן / חָנֵס
  choice: Цоан / Ханес
  rationale: Географические названия переданы традиционной русской библейской транслитерацией.
theological_decisions:
- issue: К кому относится местоимение «его»
  choice: Сохранено «его» без поясняющей замены существительным
  alternative: «сановники фараона» / «его [Иудеи] сановники»
  rationale: Еврейский текст допускает контекстуальное отнесение местоимения, но сам стих не называет референта; перевод сохраняет эту формальную неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством пророческого текста. Союз «потому что» передаёт כִּי и сохраняет связь с предыдущим стихом; «уже» естественно выражает результативное состояние הָיוּ в данном контексте.
