  text: לָ/כֵ֗ן יִֽהְיֶ֤ה לָ/כֶם֙ הֶ/עָוֺ֣ן הַ/זֶּ֔ה כְּ/פֶ֣רֶץ נֹפֵ֔ל נִבְעֶ֖ה בְּ/חוֹמָ֣ה נִשְׂגָּבָ֑ה אֲשֶׁר פִּתְאֹ֥ם לְ/פֶ֖תַע יָב֥וֹא שִׁבְרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/013.yaml
  text: Therefore this iniquity will be to you like a falling breach, bulging out in a high wall, whose breaking comes suddenly, in an instant.
translation:
  language: ru
  text: Поэтому это беззаконие станет для вас как трещина в высокой стене, выпирающая и готовая обрушиться; её разрушение внезапно, в одно мгновение, наступит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעָוֹן הַזֶּה
  choice: этот грех
  rationale: Существительное עָוֹן здесь обозначает нравственную вину или беззаконие, о котором говорится в предыдущем контексте; «грех» естественно и точно передаёт смысл.
- source_word: כְּפֶרֶץ נֹפֵל
  choice: словно обвалившийся пролом
  rationale: פֶּרֶץ — пролом или разлом в стене; причастие נֹפֵל буквально означает «падающий». Русское «обвалившийся» передаёт образ уже рушащегося участка, не превращая его лишь в угрозу будущего падения.
- source_word: נִבְעֶה
  choice: словно вздутие
  rationale: Редкое слово описывает выпирание или вздутие стены под давлением. Существительное «вздутие» сохраняет наглядный строительный образ.
- source_word: בְּחוֹמָה נִשְׂגָּבָה
  choice: в высокой стене
  rationale: נִשְׂגָּבָה в данном образе означает высокую, возвышающуюся стену.
- source_word: פִּתְאֹם לְפֶתַע
  choice: внезапно, в одно мгновение
  rationale: Сочетание двух близких наречий усиливает внезапность катастрофы; русская формулировка сохраняет это усиление.
- source_word: יָבוֹא שִׁבְרָהּ
  choice: она … рухнет
  rationale: 'Буквально: «придёт её сокрушение/разрушение». Глагол «рухнет» естественно выражает внезапное разрушение стены по-русски.'
theological_decisions:
- issue: 'Смысл עָוֹן: вина, беззаконие или наказание за него'
  choice: грех
  alternative: вина / наказание за грех
  rationale: Контекст связывает последующую гибель с отвергнутым словом и упованием на неправду. Перевод «грех» сохраняет причинную нравственную категорию, не утверждая спорное метонимическое значение «наказание».
translation_notes:
  register: Современный литературный русский язык; сохранён пророческий, образный и суровый тон. Повтор «словно» делает синтаксическую связь двух образных элементов ясной для обычного читателя.
