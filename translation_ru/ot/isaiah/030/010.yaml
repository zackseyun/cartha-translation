base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/010.yaml
  text: who say to the seers[a], “Do not see,” and to the visionaries, “Do not envision for us what is right; speak to us smooth things[b]; envision illusions.”
translation:
  language: ru
  text: 'которые говорят провидцам: «Не провидьте», и тем, кто видит видения: «Не открывайте нам правду[a]; говорите нам гладкое[b], возвещайте нам обманчивое».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того, что прямо», «верно» или «справедливо». Еврейское слово означает прямое, правильное, справедливое.'
    reason: lexical_alternative
  - marker: b
    text: То есть приятное для слуха, льстивое или успокаивающее.
    reason: idiomatic_explanation
  - marker: c
    text: 'Или: «обман», «иллюзии» или «заблуждения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים / תִרְאוּ
  choice: провидцам / не провидьте
  rationale: Субстантивированное причастие и однокоренной глагол переданы однокоренными русскими словами, чтобы сохранить словесную связь и пророческий контекст.
- source_word: חֹזִים / תֶחֱזוּ
  choice: тем, кому бывают видения / не видьте; являйте
  rationale: Вторая еврейская пара обозначает пророческое видение, но её буквальное воспроизведение однокоренными словами по-русски было бы тяжеловесным. Формулировка сохраняет отличие от первой пары и естественное звучание прямой речи.
- source_word: נְכֹחוֹת
  choice: правды
  rationale: Слово означает прямое, верное и справедливое. «Правда» в данном контексте естественно сочетает фактическую истинность и нравственную правоту, не сужая смысл до отвлечённых «истин».
- source_word: חֲלָקוֹת
  choice: приятное
  rationale: Буквально речь идёт о «гладком», то есть льстивом, успокаивающем и приятном для слуха. В основном тексте выбран естественный русский эквивалент, а образ отмечен в сноске.
- source_word: מַהֲתַלּוֹת
  choice: обман
  rationale: Существительное обозначает обманчивые, вводящие в заблуждение вещи. «Обман» ясно передаёт смысл, не уточняя без достаточных оснований, являются ли это иллюзии, заблуждения или сознательная ложь.
- source_word: אֲשֶׁר אָמְרוּ
  choice: которые говорят
  rationale: Настоящее время характеризует мятежный народ, упомянутый в предыдущем контексте, и естественно звучит в русском повествовании.
theological_decisions:
- issue: Содержание отвергаемого пророческого слова
  choice: «правды»
  alternative: «того, что верно»; «прямого»; «истины»
  rationale: Перевод сохраняет одновременно нравственную и фактическую стороны נְכֹחוֹת и не превращает выражение в узкий богословский термин.
- issue: Различение двух обозначений пророческого видения
  choice: «провидцам» и «тем, кому бывают видения»
  alternative: передать оба слова как «провидцы» или «пророки»
  rationale: Еврейский текст использует параллельно два различных корня, связанных со зрением. Русский текст различает их, не приписывая им разных должностей или духовных статусов.
- issue: Степень намеренности обмана в מַהֲתַלּוֹת
  choice: «обман» без дальнейшего уточнения
  alternative: «иллюзии»; «заблуждения»; «ложь»
  rationale: Исходное слово допускает оттенки обмана и заблуждения. Нейтральное собирательное «обман» сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Не провидьте» несколько возвышенно, но сохраняет важную однокоренную связь; «приятное» делает вторую просьбу ясной для обычного читателя. Сноски [a] и [b] стоят после соответствующих выражений в основном тексте.
