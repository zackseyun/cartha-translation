  source_fidelity: Черновик в целом передаёт параллелизм и общий смысл, но «не видьте» в сочетании с «тем, кому бывают видения» ненормативно и нарушает соответствие второй еврейской паре חֹזִים / תֶחֱזוּ. «Являйте обман» также недостаточно ясно передаёт повеление, относящееся к пророческому видению. Сноски в тексте поставлены не у тех слов, которые поясняют.
  naturalness: «Не провидьте» допустимо в возвышенном пророческом регистре, однако «тем, кому бывают видения» и «не видьте» звучат неестественно. Более естественное «тем, кто видит видения» сохраняет отличение второй группы, а «не открывайте нам» и «возвещайте» ясно выражают требование не сообщать истинного откровения, а сообщать обманчивое.
  terminology: «Провидцы» и «те, кто видит видения» различают רֹאִים и חֹזִים без приписывания им разных религиозных статусов. נְכֹחוֹת лучше передать как «правду» с лексической сноской. חֲלָקוֹת следует сохранить в основном тексте как «гладкое»; «льстивое» и «приятное для слуха» уместны как пояснения. מַהֲתַלּוֹת во множественном числе передано как «обманчивое», с примечанием о вариантах «обман», «иллюзии», «заблуждения».
