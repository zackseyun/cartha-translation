base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/021.yaml
  text: And your ears shall hear a word behind you[a], saying, “This is the way; walk in it,” when you turn to the right and when you turn to the left.
translation:
  language: ru
  text: 'И уши твои услышат позади тебя слово: «Это путь — идите по нему», — когда вы повернёте направо и когда повернёте налево.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда вы пойдёте направо и когда пойдёте налево». Еврейские глаголы в заключительной части стиха трудны для истолкования; общий смысл в том, что наставление прозвучит, когда предстоит выбрать направление — направо или налево.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָזְנֶיךָ
  choice: И уши твои
  rationale: Сохранено множественное число и конкретный телесный образ еврейского текста; порядок слов придаёт фразе умеренно возвышенное, но понятное звучание.
- source_word: תִּשְׁמַעְנָה דָבָר
  choice: услышат… слово
  rationale: Прямо передаёт согласование сказуемого с множественным «уши» и сохраняет краткое דָבָר как «слово», не уточняя его как сообщение или голос.
- source_word: מֵאַחֲרֶיךָ
  choice: позади тебя
  rationale: Передаёт пространственный образ источника наставления, находящегося за спиной адресата.
- source_word: זֶה הַדֶּרֶךְ
  choice: Вот путь
  rationale: Естественная русская указательная формула; «путь» сохраняет как буквальное, так и нравственное значение דֶּרֶךְ.
- source_word: לְכוּ בוֹ
  choice: идите по нему
  rationale: Передаёт множественное повелительное לְכוּ и естественное русское управление с существительным «путь».
- source_word: כִּי תַאֲמִינוּ וְכִי תַשְׂמְאִילוּ
  choice: когда вы уклонитесь вправо или влево
  rationale: Передаёт параллель правого и левого направления и общий смысл наставления при отклонении в любую сторону; союз «или» естественно выражает альтернативность, подразумеваемую парой.
theological_decisions:
- issue: Источник и природа наставляющего слова
  choice: Сохранено неопределённое «слово» без указания говорящего или механизма наставления
  alternative: Уточнить как голос учителя, пророческое наставление или внутреннее побуждение
  rationale: В данном стихе говорящий прямо не назван; перевод не должен вводить отсутствующее в тексте богословское уточнение.
- issue: Образ пути
  choice: Сохранена открытость между буквальным направлением и образом правильного поведения
  alternative: Передать исключительно как нравственный путь
  rationale: דֶּרֶךְ и контекст допускают пространственный образ, служащий также метафорой образа жизни; перевод сохраняет оба уровня.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Смена единственного числа («твои», «тебя») на множественное («идите», «вы уклонитесь») сохранена в соответствии с еврейскими формами. Маркер сноски поставлен при трудной заключительной фразе.
