base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/003.yaml
  text: Then Pharaoh’s stronghold will become your shame[b][a], and refuge in Egypt’s shadow your humiliation.
translation:
  language: ru
  text: Тогда убежище у фараона[a] станет для вас позором, а укрытие в тени Египта[b] — унижением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «защита у фараона». Еврейское слово מָעוֹז может также означать «оплот» или «крепость».'
    reason: lexical_alternative
  - marker: b
    text: Образ защитной тени означает надежду на покровительство Египта.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Тогда ... обернётся
  rationale: В контексте форма выражает последствие предшествующего предостережения. «Обернётся» естественно передаёт итоговый оттенок, а «тогда» — развитие мысли.
- source_word: לָכֶם
  choice: для вас
  rationale: Дательный оборот обозначает отношение и результат не в пользу адресатов; по-русски это естественно передаётся словами «для вас».
- source_word: מָעוֹז
  choice: защита
  rationale: Слово обозначает источник силы, безопасности или защищённое место. «Защита» ясно передаёт смысл упования на фараона и не смешивается полностью с последующим образом укрытия.
- source_word: פַּרְעֹה
  choice: фараона
  rationale: Устоявшаяся русская передача египетского царского титула; родительный падеж отражает зависимость от מָעוֹז.
- source_word: לְבֹשֶׁת
  choice: позором
  rationale: בֹּשֶׁת означает стыд или позор. Творительный падеж естественно сочетается с глаголом «обернётся».
- source_word: וְהֶחָסוּת
  choice: а укрытие
  rationale: Существительное выражает поиск или обретение убежища. «Укрытие» сохраняет параллелизм, а союз «а» подчёркивает вторую, соответствующую строку.
- source_word: בְּצֵל
  choice: в тени
  rationale: Сохранён конкретный образ защитной тени, служащий метафорой покровительства.
- source_word: מִצְרַיִם
  choice: Египта
  rationale: Устоявшееся русское географическое название; родительный падеж сохраняет еврейскую конструкцию.
- source_word: לִכְלִמָּה
  choice: унижением
  rationale: כְּלִמָּה близко к понятию позора, но обозначает также посрамление и унижение. Выбор сохраняет различие между двумя параллельными существительными.
theological_decisions:
- issue: Сохранение различия между двумя близкими обозначениями стыда
  choice: Передать בֹּשֶׁת как «позор», а כְּלִמָּה как «унижение»
  alternative: Передать оба слова одинаково — как «позор» или «стыд»
  rationale: В еврейском тексте употреблены два близких, но разных слова. Различные русские соответствия сохраняют риторический параллелизм и смысловой оттенок, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык; тон краткий, пророческий и достойный. Параллельное построение стиха сохранено, а метафора тени не раскрыта непосредственно в основном тексте.
