  text: כִּ֣י עַ֤ם מְרִי֙ ה֔וּא בָּנִ֖ים כֶּחָשִׁ֑ים בָּנִ֕ים לֹֽא אָב֥וּ שְׁמ֖וֹעַ תּוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/009.yaml
  text: For they are a rebellious people[a], lying children, children unwilling to hear the law of Yahweh[b],
translation:
  language: ru
  text: Ведь это народ мятежный, лживые дети, дети, которые не хотят слушать наставление Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слушать закон Яхве»; возможно также: «внимать учению Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предшествующим пророческим высказыванием естественным для русского языка способом.
- source_word: עַם מְרִי
  choice: народ мятежный
  rationale: Существительное מְרִי обозначает мятежность, непокорность; в сочетании с עַם естественно передаётся качественным прилагательным без ослабления обвинения.
- source_word: בָּנִים
  choice: дети
  rationale: Образно называет народ детьми; русское «дети» сохраняет метафору и не ограничивает её мужчинами.
- source_word: כֶּחָשִׁים
  choice: лживые
  rationale: Передаёт характеристику людей, отмеченных ложью, сохраняя краткость и резкость еврейского выражения.
- source_word: לֹא אָבוּ
  choice: не хотят
  rationale: Передаёт выраженное глаголом волевое нежелание, а не простую неспособность услышать.
- source_word: שְׁמוֹעַ
  choice: слушать
  rationale: Сохраняет основной смысл слышания с оттенком внимательного принятия; подразумеваемое послушание не превращается в явное толкование.
- source_word: תּוֹרַת
  choice: наставление
  rationale: תּוֹרָה здесь означает данное Яхве авторитетное учение или наставление; этот вариант в современном русском не сужает значение до свода юридических норм.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
theological_decisions:
- issue: Передача תּוֹרָה в пророческом контексте завета
  choice: наставление
  alternative: закон; учение
  rationale: «Наставление» сохраняет широкий смысл תּוֹרָה как авторитетного Божьего указания. «Закон» возможен, но в современном русском способен неоправданно сузить значение до юридических предписаний.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл שׁמע в сочетании с волевым отказом
  choice: слушать
  alternative: слушаться; внимать
  rationale: «Слушать» сохраняет лексическую открытость между слышанием, принятием и послушанием, тогда как «слушаться» явно выражало бы лишь предполагаемое следствие.
translation_notes:
  register: Современный литературный русский с сохранением резкого пророческого тона. Порядок «народ мятежный» придаёт фразе достоинство и библейскую выразительность, не делая её архаичной. Повтор «дети» сохранён как риторическая анафора исходного текста.
