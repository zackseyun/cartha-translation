base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/026.yaml
  text: And the light of the moon will be like the light of the sun[a], and the light of the sun will be sevenfold, like the light of seven days, on the day when Yahweh binds up the fracture of his people and heals the wound from his blow.
translation:
  language: ru
  text: И свет луны будет как свет солнца, а свет солнца будет семикратным, как свет семи дней, в тот день, когда Яхве перевяжет перелом Своего народа и исцелит рану от Его удара[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сокрушение (или повреждение) от Его удара». Еврейское слово מַחַץ может обозначать сокрушение, ушиб или рану; образ остаётся образом причинённого повреждения, которое Яхве исцеляет.'
    reason: Лексическая альтернатива для מַחַץ без внесения неподтверждённой синтаксической перестройки выражения מַחַץ מַכָּתוֹ.
lexical_decisions:
- source_word: וְהָיָה
  choice: будет
  rationale: Будущее связочное значение естественно передаётся русской формой «будет».
- source_word: אוֹר
  choice: свет
  rationale: Прямое и естественное обозначение света, последовательно сохранённое в поэтическом повторе.
- source_word: הַלְּבָנָה
  choice: луна
  rationale: Обычное поэтическое название луны в данном контексте.
- source_word: הַחַמָּה
  choice: солнце
  rationale: В контексте речь идёт о солнце, а не об отвлечённом жаре.
- source_word: שִׁבְעָתַיִם
  choice: в семь раз сильнее
  rationale: Передаёт семикратное усиление света естественным современным русским языком; «семикратным» звучало бы тяжеловесно.
- source_word: כְּאוֹר שִׁבְעַת הַיָּמִים
  choice: как свет семи дней
  rationale: Сохраняет необычный поэтический образ и не уточняет без необходимости, имеется ли в виду совокупный свет семи дней.
- source_word: חֲבֹשׁ
  choice: перевяжет
  rationale: Передаёт лечебный образ наложения повязки и хорошо сочетается с образом перелома.
- source_word: שֶׁבֶר
  choice: перелом
  rationale: Сохраняет конкретную медицинскую метафору разрушения и последующего исцеления.
- source_word: מַחַץ מַכָּתוֹ
  choice: рану от нанесённого Им удара
  rationale: Передаёт повреждение, связанное с ударом, и сохраняет напряжение между Божьим судом и Божьим исцелением.
- source_word: עַמּוֹ
  choice: Своего народа
  rationale: Естественная русская передача народа, принадлежащего Яхве; возвратное местоимение ясно соотносится с подлежащим.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное заветное имя в исходном тексте и не заменяет его титулом.
- issue: Отнесение суффикса в מַכָּתוֹ и источник удара
  choice: рана от нанесённого Им удара
  alternative: его рана; рана от удара по нему
  rationale: 'Контекст суда и восстановления позволяет понимать удар как действие Яхве: Тот, Кто поразил, затем исцеляет. Поскольку краткая еврейская конструкция допускает несколько способов описать повреждение, это отмечено в сноске.'
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повтор слова «свет» и медицинские образы сохранены; тире выделяет поясняющее сравнение, не устраняя его поэтической неоднозначности.
