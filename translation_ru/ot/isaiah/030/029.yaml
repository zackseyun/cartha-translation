  text: הַ/שִּׁיר֙ יִֽהְיֶ֣ה לָ/כֶ֔ם כְּ/לֵ֖יל הִתְקַדֶּשׁ חָ֑ג וְ/שִׂמְחַ֣ת לֵבָ֗ב כַּֽ/הוֹלֵךְ֙ בֶּֽ/חָלִ֔יל לָ/ב֥וֹא בְ/הַר יְהוָ֖ה אֶל צ֥וּר יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/029.yaml
  text: The song will be for you as in the night when a feast is consecrated[a], and gladness of heart as when one goes with the flute to come to the mountain of Yahweh[d][c][b], to the Rock of Israel.
translation:
  language: ru
  text: У вас будет песня, как в ночь освящения праздника[a], и радость в сердце — как у того, кто идёт под звуки свирели[b], чтобы прийти на гору Яхве[c], к Скале Израиля[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как в ночь, когда празднуют священный праздник». Еврейское выражение, вероятно, указывает на праздничную ночь, связанную с богослужением и паломничеством.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «под звуки флейты». Еврейское слово обозначает духовой инструмент, звучавший во время праздничного шествия.'
    reason: lexical_alternative
  - marker: c
    text: '«Яхве» — передача еврейского имени יהוה; традиционный перевод: «Господь».'
    reason: alternative_reading
  - marker: d
    text: 'Или: «к Твердыне Израиля». «Скала» — божественный титул, подчёркивающий силу, надёжность и защиту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁיר יִהְיֶה לָכֶם
  choice: У вас будет песня
  rationale: Передаёт определённую форму הַשִּׁיר и идиому יִהְיֶה לָכֶם естественным русским порядком слов; в контексте речь идёт о праздничном пении, которое станет уделом народа.
- source_word: כְּלֵיל הִתְקַדֶּשׁ חָג
  choice: как в ночь, когда освящают праздник
  rationale: Сохраняет сравнение и культовый смысл корня קדשׁ — отделение праздника как святого. Необычная еврейская конструкция передана без уточнения конкретного праздника.
- source_word: וְשִׂמְחַת לֵבָב
  choice: и радость в сердце
  rationale: Сохраняет именную параллель первой части стиха и естественно передаёт еврейское обозначение внутренней, искренней радости.
- source_word: כַּהוֹלֵךְ
  choice: как у того, кто идёт
  rationale: Передаёт сравнительную частицу и обобщённое значение причастия, не уточняя число участников шествия.
- source_word: בֶּחָלִיל
  choice: под звуки свирели
  rationale: חָלִיל обозначает духовой инструмент, флейту или свирель; формулировка ясно показывает музыкальное сопровождение праздничного шествия.
- source_word: לָבוֹא בְהַר יְהוָה
  choice: чтобы прийти на гору Яхве
  rationale: Инфинитив передан как цель движения, а בְ при глаголе движения — естественным русским «на». Личное имя יהוה транслитерировано как «Яхве».
- source_word: אֶל צוּר יִשְׂרָאֵל
  choice: к Скале Израиля
  rationale: Сохраняет параллельное направление движения и метафорический божественный титул צוּר, выражающий прочность, силу и защиту.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул. Транслитерация сохраняет это различие; традиционный вариант отмечен в сноске.
- issue: Культовый смысл הִתְקַדֶּשׁ חָג
  choice: когда освящают праздник
  alternative: в ночь освящённого праздника
  rationale: Выбранный вариант сохраняет действие посвящения праздника как святого, не определяя точнее ни исполнителя, ни конкретный праздник.
- issue: Образ צוּר יִשְׂרָאֵל
  choice: Скала Израиля
  alternative: Твердыня Израиля
  rationale: «Скала» непосредственно сохраняет метафору исходного текста и её титульный характер; «Твердыня» яснее выражает переносный смысл, но ослабляет конкретный образ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм сохранён, но порядок слов сделан естественным; архаизмы и конфессионально окрашенные уточнения исключены.
