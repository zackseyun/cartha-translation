id: ISA.30.15
reference: Isaiah 30:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה קְד֣וֹשׁ יִשְׂרָאֵ֗ל בְּ/שׁוּבָ֤ה וָ/נַ֨חַת֙ תִּוָּ֣שֵׁע֔וּ/ן בְּ/הַשְׁקֵט֙ וּ/בְ/בִטְחָ֔ה תִּהְיֶ֖ה גְּבֽוּרַתְ/כֶ֑ם וְ/לֹ֖א אֲבִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/015.yaml
  text: 'For thus says the Lord GOD[a], the Holy One of Israel: “In returning and rest you will be saved[b]; in quietness and trust will be your strength.” But you were unwilling.'
translation:
  language: ru
  text: 'Ибо так говорит Владыка Господь, Святой Израиля: «В обращении[a] и покое вы будете спасены[b]; в тишине и доверии будет ваша сила». Но вы не захотели.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в возвращении»; возможно также: «в покаянии». Еврейское слово буквально означает возвращение и может включать покаяние и обращение к Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будете избавлены».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Передаёт составной божественный титул и различает אֲדֹנָי («Владыка») и имя יהוה, традиционно передаваемое как «Господь».
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  rationale: Точно и естественно передаёт характерный для Исаии титул, сохраняя связь святости Бога с Израилем.
- source_word: בְּשׁוּבָה
  choice: в возвращении
  rationale: Сохраняет конкретный образ возвращения и не сужает смысл до одного лишь внутреннего раскаяния; по контексту возможно возвращение к Богу и отказ от самонадеянной политики.
- source_word: וָנַחַת
  choice: и покое
  rationale: Передаёт состояние покоя и умиротворённости и естественно сочетается с «возвращением».
- source_word: תִּוָּשֵׁעוּן
  choice: вы будете спасены
  rationale: Нифаль от ישׁע означает «быть спасёнными, избавленными»; формулировка сохраняет как конкретно-исторический, так и более широкий богословский смысл.
- source_word: בְּהַשְׁקֵט
  choice: в тишине
  rationale: Передаёт спокойствие и отсутствие суетливых действий; в современном русском звучит естественнее отвлечённого «в безмолвии».
- source_word: וּבְבִטְחָה
  choice: и доверии
  rationale: Сохраняет смысл упования и зависимости от Бога, не сводя слово к объективной безопасности или самоуверенности.
- source_word: תִּהְיֶה גְּבוּרַתְכֶם
  choice: будет ваша сила
  rationale: Прямо передаёт גְּבוּרָה и подчёркивает контраст между истинной силой и поиском военной опоры.
- source_word: וְלֹא אֲבִיתֶם
  choice: Но вы не захотели
  rationale: Точно передаёт отсутствие согласия или готовности; форма естественна для современного литературного русского языка.
theological_decisions:
- issue: Следует ли понимать בְּשׁוּבָה исключительно как покаяние
  choice: в возвращении
  alternative: в покаянии
  rationale: Корень שׁוב допускает покаянный смысл, но здесь также подразумевается возвращение к Богу от политической и военной самонадеянности. Более широкая передача сохраняет эту многозначность.
- issue: Объём значения תִּוָּשֵׁעוּן
  choice: вы будете спасены
  alternative: вы будете избавлены
  rationale: В контексте речь может идти о конкретном избавлении народа, однако ישׁע обладает и более широким смыслом спасения. Основной текст сохраняет богословскую ёмкость, а примечание указывает ситуационную альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм оригинала сохранён; формулировки ясны обычному читателю и не устраняют смысловую напряжённость между возвращением, покаянием, историческим избавлением и спасением.
