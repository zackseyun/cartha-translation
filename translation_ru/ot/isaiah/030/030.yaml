base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/030.yaml
  text: And Yahweh will make the majesty of his voice heard[a], and will show the descending blow of his arm, in furious anger and a flame of consuming fire[b], with cloudburst and storm and hailstones.
translation:
  language: ru
  text: И Яхве даст услышать величие Своего голоса и покажет нисходящий удар Своей руки[a] — в яростном гневе, в пламени пожирающего огня, среди сокрушительного ливня[b], бури и града.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нисхождение Своей руки». Еврейское выражение неоднозначно и может подчёркивать нисходящее движение руки Яхве при совершении суда, а не сам удар.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «внезапного ливня»; еврейское слово передаёт представление о чём-то с силой прорывающемся или сокрушающем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, и соответствует принятой в проекте передаче тетраграмматона.
- source_word: הִשְׁמִיעַ
  choice: даст услышать
  rationale: Сохраняет каузативное значение породы hифиль и при этом естественно звучит по-русски.
- source_word: הוֹד קוֹלוֹ
  choice: величие Своего голоса
  rationale: הוֹד обозначает величие, великолепие или славу; «величие» естественно передаёт теофанический образ голоса.
- source_word: נַחַת זְרוֹעוֹ
  choice: обрушивающийся удар Своей руки
  rationale: Трудное выражение, вероятно, изображает нисходящее движение руки при нанесении удара; перевод сохраняет и движение, и контекст суда, не скрывая неоднозначности в примечании.
- source_word: יַרְאֶה
  choice: покажет
  rationale: Передаёт каузативное значение «даст увидеть, явит» кратким и естественным русским глаголом.
- source_word: בְּזַעַף אַף
  choice: в яростном гневе
  rationale: Выражение усиливает образ гнева; выбранная формулировка сохраняет интенсивность без неестественного повтора однокоренных понятий.
- source_word: לַהַב אֵשׁ אוֹכֵלָה
  choice: в пламени пожирающего огня
  rationale: Сохраняет яркий поэтический образ огня, который активно пожирает.
- source_word: נֶפֶץ
  choice: сокрушительный ливень
  rationale: В последовательности образов бури слово, связанное с прорывом или сокрушением, вероятнее всего обозначает внезапно обрушивающийся сильный дождь; определение «сокрушительный» сохраняет его силу.
- source_word: זֶרֶם
  choice: буря
  rationale: В данном погодном ряду передаёт мощный, несущийся бурный поток или шторм, не ограничивая образ только водой.
- source_word: אֶבֶן בָּרָד
  choice: каменный град
  rationale: Буквальный образ «камень града» подчёркивает тяжесть градин; русское выражение звучит поэтично и понятно.
theological_decisions:
- issue: Антропоморфный образ руки и гнева Яхве в сцене суда
  choice: Сохранить конкретные образы руки, удара, гнева и пожирающего огня.
  alternative: Абстрактно передать их как проявления Божьей силы.
  rationale: Сам еврейский текст использует телесные и эмоционально насыщенные поэтические образы. Их сохранение передаёт силу пророческой теофании, не превращая образный язык в утверждение о телесной природе Бога.
translation_notes:
  register: Современный литературный русский язык с высоким, но понятным пророческим регистром. Синтаксис сохраняет нарастающую череду образов суда; тире делает естественным переход от двух главных действий к описанию сопровождающих их явлений.
