  verdict: revise
  source_fidelity: 'Нужна правка: תִּזְרֵם означает «разбросаете/рассеете их», а כְּמוֹ דָוָה прямо отсылает к менструальной нечистоте; «нечистая тряпка» делает этот образ слишком неопределённым. В масоретском тексте לּוֹ имеет единственное число, поэтому «ему» точнее, чем «им», хотя ближайший референт может пониматься собирательно.'
  naturalness: «Разбросаете их» и «как ткань при месячных» понятны в современном литературном русском; последняя формула передаёт исторический образ без чрезмерно медицинской стилистики.
  terminology: «Резные идолы», «литые изваяния», «обкладка» и «покрытие» удачно сохраняют различие между изображениями и их драгоценной облицовкой. «Оскверните» уместно для טמא.
