  text: וְ/טִמֵּאתֶ֗ם אֶת צִפּוּי֙ פְּסִילֵ֣י כַסְפֶּ֔/ךָ וְ/אֶת אֲפֻדַּ֖ת מַסֵּכַ֣ת זְהָבֶ֑/ךָ תִּזְרֵ/ם֙ כְּמ֣וֹ דָוָ֔ה צֵ֖א תֹּ֥אמַר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/022.yaml
  text: And you will defile the silver overlay of your carved idols and the gold plating of your cast images. You will scatter them like a menstrual cloth; you will say to them, “Go out!”
translation:
  language: ru
  text: 'И вы оскверните серебряную обкладку своих резных идолов и золотое покрытие своих литых изваяний. Вы разбросаете их, как ткань при месячных, и скажете ему: «Прочь!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְטִמֵּאתֶם
  choice: и вы оскверните
  rationale: Пиэль от טמא выражает намеренное признание или обращение предметов в нечистые; форма второго лица множественного числа сохранена.
- source_word: צִפּוּי פְּסִילֵי כַסְפֶּךָ
  choice: серебряную обкладку своих резных идолов
  rationale: צִפּוּי означает наружное покрытие, а פְּסִילִים — изготовленные резьбой идолы; притяжательное отношение передано естественным русским оборотом.
- source_word: אֲפֻדַּת מַסֵּכַת זְהָבֶךָ
  choice: золотое покрытие своих литых изваяний
  rationale: Редкое אֲפֻדָּה здесь обозначает облицовку или покрытие; מַסֵּכָה — литое изображение. Перевод не смешивает покрытие с самим изваянием.
- source_word: תִּזְרֵם
  choice: вы выбросите их
  rationale: Глагол זרה может означать развеивать или разбрасывать; в контексте решительного отвержения идолов естественно «выбросите», при сохранении множественного объекта.
- source_word: כְּמוֹ דָוָה
  choice: как нечистую тряпку
  rationale: דָּוָה связано с менструальной нечистотой. Формулировка передаёт образ отталкивающей ритуально нечистой ткани без неестественной буквальности.
- source_word: צֵא
  choice: Прочь!
  rationale: Буквально повелительное «выйди», но как формула изгнания неодушевлённых идолов по-русски естественно и сильно звучит «Прочь!».
theological_decisions:
- issue: Число адресата в לָמוֹ
  choice: «им» — обращение к идолам/изваяниям во множественном числе
  alternative: «ему» — собирательное обращение к отброшенному предмету или покрытию
  rationale: Поэтическое לָמוֹ допускает контекстуальное соотнесение со множественными изображениями; множественное «им» согласуется с перечисленными идолами и сохраняет их персонифицированное изгнание.
- issue: Ритуальная нечистота образа דָוָה
  choice: сохранить явное понятие нечистоты, но не уточнять физиологию в основном тексте
  alternative: «как менструальную ткань»
  rationale: Контекст говорит об осквернении и отвержении идолов; «нечистая тряпка» понятно современному читателю и не превращает пророческий образ в медицинский термин.
translation_notes:
  register: Современный литературный русский, достойный и прямой. Параллелизм двух покрытий сохранён; лексика конкретна, а финальное «Прочь!» передаёт резкость полного отказа от идолов.
