  text: וַ/תֹּ֨אמְר֥וּ לֹא כִ֛י עַל ס֥וּס נָנ֖וּס עַל כֵּ֣ן תְּנוּס֑וּ/ן וְ/עַל קַ֣ל נִרְכָּ֔ב עַל כֵּ֖ן יִקַּ֥לּוּ רֹדְפֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/016.yaml
  text: But you said[a], “No, for we will flee on horses”—therefore you will flee; and, “We will ride on swift horses”—therefore your pursuers will be swift.
translation:
  language: ru
  text: 'Но вы сказали: «Нет, мы убежим на конях», — потому и побежите; «Мы поедем на быстрых[a]», — потому быстры будут ваши преследователи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть на быстрых конях. В еврейском тексте буквально: «на быстрых»; существительное подразумевается из контекста.'
    reason: Сохранён эллипсис подлинника, а подразумеваемое существительное пояснено без ненужного расширения смысла.
lexical_decisions:
- source_word: וַתֹּאמְרוּ
  choice: Но вы сказали
  rationale: Союз продолжает речь, но в контексте вводит противопоставление Божьему призыву из предыдущего стиха; русское «но» естественно передаёт эту функцию.
- source_word: לֹא כִּי
  choice: Нет!
  rationale: В данном контексте сочетание выражает решительный отказ, после которого говорящие заявляют о своём плане. В русском отдельное восклицание сохраняет резкость ответа, не навязывая спорное причинное значение כִּי.
- source_word: עַל סוּס נָנוּס
  choice: На конях мы убежим
  rationale: Единственное число סוּס имеет собирательный смысл. «Убежим» сохраняет основное значение נוּס и повтор корня в ответном пророческом слове.
- source_word: עַל כֵּן תְּנוּסוּן
  choice: потому и побежите
  rationale: 'Повтор глагола נוּס передаёт иронию суда: задуманное бегство оборачивается вынужденным бегством. Частица «и» усиливает связь следствия с заявлением народа.'
- source_word: וְעַל קַל נִרְכָּב
  choice: На быстрых[a] поскачем
  rationale: קַל — субстантивированное прилагательное «быстрый» с подразумеваемым из контекста названием ездовых животных. «Поскачем» естественно передаёт верховую езду и стремительность, не добавляя в основной текст отсутствующее существительное.
- source_word: עַל כֵּן יִקַּלּוּ רֹדְפֵיכֶם
  choice: потому быстры будут ваши преследователи
  rationale: 'Сохраняется повтор идеи быстроты и пророческое противопоставление: быстрота, на которую надеются беглецы, будет присуща их преследователям.'
