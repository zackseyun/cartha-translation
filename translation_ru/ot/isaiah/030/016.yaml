  to: 'Но вы сказали: «Нет, мы убежим на конях», — потому и побежите; «Мы поедем на быстрых[a]», — потому быстры будут ваши преследователи.'
  rationale: Редакция заменяет чрезмерно конкретное «поскачем» на нейтральное «поедем», делает обе реплики параллельными и полными и уточняет сноску. Повторы «убежим — побежите» и «быстрых — быстры» сохранены как существенная ироническая игра исходного текста.
