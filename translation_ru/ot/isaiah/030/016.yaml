  naturalness: Предлагаемая редакция сохраняет краткий пророческий ритм, но делает обе прямые реплики синтаксически полными и естественными для современного литературного русского.
  terminology: «Кони», «преследователи» и «быстрые» уместны. Эллипсис после «на быстрых» следует сохранить в тексте и пояснить сноской; не стоит расширять пояснение до «других верховых животных», поскольку ближайший контекст задаёт коней.
