revisions:
- from: И он пошлёт дождь для семян, которыми ты засеваешь землю, и даст хлеб из урожая земли[a]; хлеб будет питательным и обильным[b]. В тот день твой скот будет пастись на просторном пастбище.
  to: И он даст дождь для твоего посева, которым ты засеешь землю, и хлеб из урожая земли[a]; хлеб будет добротным и обильным[b]. В тот день твой скот будет пастись на просторном пастбище.
  rationale: Исправлены неточный смысловой оттенок «питательным» и несколько тяжеловесная формулировка о семенах. Сохранены подразумеваемое «он», пророческое будущее, связь хлеба с урожаем земли и отмеченная в английском аудите синтаксическая альтернатива.
