base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/023.yaml
  text: And he will give rain for your seed with which you sow the ground[a], and bread from the produce of the ground; and it will be rich and plentiful[b]. On that day your livestock will graze in a broad pasture.
translation:
  language: ru
  text: И он даст дождь для твоего посева, которым ты засеешь землю, и хлеб из урожая земли[a]; хлеб будет добротным и обильным[b]. В тот день твой скот будет пастись на просторном пастбище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «хлеб — урожай земли». Еврейское сочетание допускает понимание второго выражения как приложения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тучным и жирным» — образ добротности, изобилия и плодородия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: и он пошлёт… и даст
  rationale: В пророческом контексте форма передаёт будущее действие. Повтор сказуемого в русском делает два дополнения — дождь и хлеб — ясными и сохраняет естественный синтаксис.
- source_word: מְטַר זַרְעֲךָ
  choice: дождь для семян
  rationale: מְטַר означает дождь, а זֶרַע здесь — семя для посева; русское множественное «семена» естественно передаёт собирательное значение.
- source_word: אֲשֶׁר תִּזְרַע אֶת הָאֲדָמָה
  choice: которыми ты засеваешь землю
  rationale: Передаёт инструментальную связь необычной еврейской конструкции и звучит естественно по-русски.
- source_word: לֶחֶם תְּבוּאַת הָאֲדָמָה
  choice: хлеб из урожая земли
  rationale: לֶחֶם конкретно передано как «хлеб», а תְּבוּאַת הָאֲדָמָה — как источник этого хлеба; возможное приложение отмечено в сноске.
- source_word: דָשֵׁן וְשָׁמֵן
  choice: питательным и обильным
  rationale: Буквальные образы жирности выражают добротность, изобилие и плодородие; выбранная формулировка понятна современному читателю.
- source_word: יִרְעֶה מִקְנֶיךָ
  choice: твой скот будет пастись
  rationale: מִקְנֶה — собирательное обозначение домашнего скота, а רעה в данном контексте означает пастись.
- source_word: כַּר נִרְחָב
  choice: на просторном пастбище
  rationale: כַּר обозначает луг или пастбище, а נִרְחָב подчёркивает его широту и простор.
theological_decisions:
- issue: Подразумеваемое подлежащее начального глагола
  choice: Сохранено местоимение «он», относящееся к Господу из ближайшего контекста.
  alternative: Явно повторить «Господь».
  rationale: В еврейском тексте имя действующего лица здесь не повторено. Местоимение сохраняет связность с контекстом, не добавляя отсутствующего в стихе имени.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сельскохозяйственные образы сохранены, но буквальные семитские обороты переданы естественными русскими выражениями; подлинная синтаксическая неоднозначность отмечена в сноске.
