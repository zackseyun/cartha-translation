  text: וְ/הָיָ֗ה כֹּ֤ל מַֽעֲבַר֙ מַטֵּ֣ה מֽוּסָדָ֔ה אֲשֶׁ֨ר יָנִ֤יחַ יְהוָה֙ עָלָ֔י/ו בְּ/תֻפִּ֖ים וּ/בְ/כִנֹּר֑וֹת וּ/בְ/מִלְחֲמ֥וֹת תְּנוּפָ֖ה נִלְחַם ב/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/032.yaml
  text: And every stroke of the appointed rod that Yahweh lays on him will be with tambourines and lyres[b][a]; and with battles of brandishing he will fight against them.
translation:
  language: ru
  text: И каждый удар[a] предназначенного жезла, который Яхве опустит на него, будет сопровождаться бубнами и лирами; а Он будет сражаться с нею[b] в сражениях, сопровождаемых взмахами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждое прохождение предназначенного жезла». Еврейское выражение трудно для понимания; слово «удар» истолковывает образ как каждый взмах или удар жезла.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с ней»; возможно также «с этим», в зависимости от референта. В еврейском тексте стоит местоименный суффикс женского рода единственного числа, но к чему именно он относится, неясно.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «в сражениях размахивания» или «в битвах взмахов». Еврейское сочетание образно и синтаксически трудно; не уточняется, чем именно размахивают.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כֹּל
  choice: И каждый … будет
  rationale: 'Передаёт будущую картину и дистрибутивное значение כֹּל: речь идёт о каждом отдельном действии жезла.'
- source_word: מַעֲבַר מַטֵּה
  choice: удар жезла
  rationale: מַעֲבַר обычно связано с прохождением, но рядом с жезлом, служащим орудием суда, естественно обозначает каждый его взмах или удар. Буквальная трудность сохранена в сноске.
- source_word: מוּסָדָה
  choice: назначенного
  rationale: Пассивная форма выражает нечто установленное или определённое заранее; здесь — жезл, предназначенный для суда.
- source_word: אֲשֶׁר יָנִיחַ יְהוָה עָלָיו
  choice: который Яхве обрушит на него
  rationale: Каузатив נוח буквально означает «даст опуститься/положит на него». «Обрушит» естественно передаёт нисходящий удар в контексте наказания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет различие между именем и титулом.
- source_word: בְּתֻפִּים וּבְכִנֹּרוֹת
  choice: будет сопровождаться бубнами и лирами
  rationale: Предлог בְּ выражает сопровождение; названия инструментов переданы современными и понятными эквивалентами.
- source_word: וּבְמִלְחֲמוֹת תְּנוּפָה
  choice: и, размахивая оружием в битвах
  rationale: תְּנוּפָה обозначает размахивание или взмах. Упоминание оружия следует из военного контекста и делает образ естественным по-русски, не устраняя его динамики.
- source_word: נִלְחַם בָהּ
  choice: Он будет сражаться с ними
  rationale: Субъект понят как Яхве, а противники — как ассирийская вражеская сила из контекста. Формально суффикс женского рода единственного числа; это отмечено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя исходного текста и не заменяет его титулом.
- issue: Кто сражается и к кому относится конечное местоимение
  choice: Яхве сражается с ассирийскими противниками, переданными множественным числом
  alternative: Он сражается с ней/с ним/с этим
  rationale: Ближайший контекст говорит о суде Яхве над Ассирией. Однако форма בָהּ — женский род единственного числа, поэтому её грамматическая неоднозначность явно сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис сохраняет параллельность исходного стиха; трудные образы переданы естественно, а подлинная лексическая и местоименная неоднозначность вынесена в сноски.
