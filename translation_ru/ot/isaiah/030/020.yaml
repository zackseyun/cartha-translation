base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/020.yaml
  text: And the Lord will give you bread of distress and water of oppression[a], yet your teacher will no longer hide himself[b], and your eyes will see your teacher.
translation:
  language: ru
  text: И даст вам Господь хлеб бедствия и воду притеснения[a]. Но учитель твой больше не будет скрываться[b], и глаза твои увидят учителя твоего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлеб невзгод и воду страдания».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст можно также понять так: «твои учителя больше не будут скрыты»; традиционный вариант: «учитель твой больше не будет удалён в угол».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт божественный титул как обозначение верховной власти и отличает его от имени יהוה; звучит естественно и достойно в современном русском языке.
- source_word: לֶחֶם צָר
  choice: хлеб бедствия
  rationale: Сохраняет конкретную метафору хлеба, получаемого во время или в условиях бедствия, не сводя выражение только к скудости пищи.
- source_word: מַיִם לָחַץ
  choice: вода притеснения
  rationale: Сохраняет параллелизм с «хлебом бедствия» и передаёт значение давления, угнетения или тяготы в существительном לָחַץ.
- source_word: יִכָּנֵף
  choice: не будет скрываться
  rationale: Нифаль допускает значение «быть скрытым / укрываться»; русская возвратная форма естественно сочетается с личным субъектом, не навязывая более узкое традиционное толкование «удаляться в угол».
- source_word: מוֹרֶיךָ
  choice: учитель твой / учителя твоего
  rationale: В основном тексте выбрано традиционно возможное единственное число, согласующееся с личным пониманием субъекта; формально возможное множественное число сохранено в сноске.
- source_word: עֵינֶיךָ רֹאוֹת
  choice: глаза твои увидят
  rationale: Прямо сохраняет еврейский образ и акцент на непосредственном зрительном восприятии.
theological_decisions:
- issue: Кого обозначает מוֹרֶיךָ («твой учитель» / «твои учителя»)
  choice: Неопределённый «учитель» со строчной буквы, без прямого отождествления с Богом.
  alternative: «твои учителя», то есть человеческие наставники или пророки; также возможен подразумеваемый божественный референт.
  rationale: Контекст и форма допускают несколько пониманий. Строчная буква и отсутствие уточняющего имени сохраняют богословскую неоднозначность, не закрепляя конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Инверсия «учитель твой», «глаза твои» сохраняет поэтическую выразительность и связь повторяющихся форм, оставаясь понятной современному читателю.
