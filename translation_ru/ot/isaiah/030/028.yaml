  text: וְ/רוּח֞/וֹ כְּ/נַ֤חַל שׁוֹטֵף֙ עַד צַוָּ֣אר יֶֽחֱצֶ֔ה לַ/הֲנָפָ֥ה גוֹיִ֖ם בְּ/נָ֣פַת שָׁ֑וְא וְ/רֶ֣סֶן מַתְעֶ֔ה עַ֖ל לְחָיֵ֥י עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/028.yaml
  text: and his breath is like an overflowing stream[a]; it reaches up to the neck, to sift nations with a sieve of emptiness[c][b], and a misleading bridle is on the jaws of the peoples.
translation:
  language: ru
  text: И дыхание Его — как разлившийся поток[a], поднимающийся до самой шеи, чтобы просеять народы решетом пустоты[b]; а на щеках народов — узда, уводящая с пути[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух Его»; или: «ветер Его».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «решетом тщеты», «решетом лжи» или «никчёмным решетом».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «узда, сбивающая с пути»; возможен также перевод: «обманчивая узда». Евр. слово, переданное как «щёки», может также означать «челюсти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחוֹ
  choice: дыхание Его
  rationale: רוּחַ допускает значения «дыхание», «ветер» и «дух». В контексте суда Господа и исходящего от Него губительного воздействия «дыхание» лучше всего сохраняет конкретный образ, не устраняя лексической многозначности, отмеченной в сноске.
- source_word: כְּנַחַל שׁוֹטֵף
  choice: как разлившийся поток
  rationale: נַחַל обозначает поток или сезонное русло, а שׁוֹטֵף — затопляющий, разливающийся или всё сметающий. Выбран естественный русский образ мощного наводнения.
- source_word: עַד צַוָּאר יֶחֱצֶה
  choice: поднимающийся до самой шеи
  rationale: Хотя חצה буквально связано с разделением, в образе наводнения выражение обычно понимается как указание на уровень воды, достигшей шеи. Русская формулировка ясно передаёт смертельную близость опасности.
- source_word: לַהֲנָפָה
  choice: чтобы просеять
  rationale: Форма от נוף выражает встряхивание или веяние; соседнее נָפָה «решето» делает глагол «просеять» наиболее связным и наглядным выбором.
- source_word: גוֹיִם
  choice: народы
  rationale: В данном геополитическом контексте גּוֹיִם означает народы или нации; «народы» звучит естественно и не привносит конфессиональной окраски слова «язычники».
- source_word: בְּנָפַת שָׁוְא
  choice: решетом пустоты
  rationale: נָפָה — «решето», а שָׁוְא может означать пустоту, тщету, ложь или никчёмность. Буквально-напряжённый образ «решето пустоты» сохраняет неоднозначность и не объясняет метафору вместо текста.
- source_word: רֶסֶן מַתְעֶה
  choice: узда, уводящая с пути
  rationale: רֶסֶן — узда или средство управления, а מַתְעֶה означает заставляющий блуждать, сбивающий или уводящий с пути. Активная конструкция сохраняет причинное значение причастия.
- source_word: עַל לְחָיֵי עַמִּים
  choice: на челюстях племён
  rationale: לְחִי может означать щёку или челюсть; при образе узды «челюсти» анатомически точнее. «Племена» передаёт עַמִּים и позволяет не повторять ранее употреблённое «народы».
theological_decisions:
- issue: К кому относится местоименный суффикс в רוּחוֹ
  choice: К Господу, действующему как Судья в ближайшем контексте
  alternative: К безличной силе бури
  rationale: Контекст описывает явление Господа в гневе и действие Его голоса. Форма «дыхание Его» сохраняет личную божественную действенность, не добавляя дальнейших догматических уточнений.
- issue: Характер образа решета и узды
  choice: 'Сохранены два параллельных образа суда: просеивание народов и принудительное уведение племён'
  alternative: Объединить образы либо истолковать их как исключительно очищение или исключительно уничтожение
  rationale: Еврейский текст оставляет напряжение в целях и результате просеивания, а также в том, кто подразумевается носителем узды. Перевод не снимает эту образную и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет последовательность двух сильных метафор оригинала. Прописное «Его» ясно связывает местоимение с Господом в русском библейском регистре; необычное выражение «решето пустоты» намеренно сохранено как подлинно трудный образ.
