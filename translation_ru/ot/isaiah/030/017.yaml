  text: אֶ֣לֶף אֶחָ֗ד מִ/פְּנֵי֙ גַּעֲרַ֣ת אֶחָ֔ד מִ/פְּנֵ֛י גַּעֲרַ֥ת חֲמִשָּׁ֖ה תָּנֻ֑סוּ עַ֣ד אִם נוֹתַרְתֶּ֗ם כַּ/תֹּ֨רֶן֙ עַל רֹ֣אשׁ הָ/הָ֔ר וְ/כַ/נֵּ֖ס עַל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/017.yaml
  text: A thousand will flee at the rebuke of one[a]; at the rebuke of five you will flee, until you are left like a signal pole on the top of a mountain[b], and like a banner on a hill.
translation:
  language: ru
  text: От окрика одного побежит тысяча; от окрика пятерых побежите вы, пока не останетесь, словно шест[a] на вершине горы и словно знамя[b] на холме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно мачта». Еврейское תֹּרֶן может обозначать мачту или высокий шест.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «словно сигнальный штандарт». Еврейское נֵס обозначает поднятое знамя или штандарт, служащий сигналом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אֶחָד
  choice: тысяча
  rationale: Сочетание буквально означает «одна тысяча»; в русском языке здесь естественно простое «тысяча».
- source_word: מִפְּנֵי גַּעֲרַת
  choice: от окрика
  rationale: מִפְּנֵי выражает причину бегства, а גְּעָרָה — властный, угрожающий окрик или резкое обличение. В военном контексте «от окрика» звучит естественно и не сводит слово к простой угрозе.
- source_word: אֶחָד
  choice: одного
  rationale: 'Сохраняется резкий риторический контраст: один обращает в бегство тысячу.'
- source_word: חֲמִשָּׁה
  choice: пятерых
  rationale: Форма числительного указывает на пять лиц; собирательно-личная русская форма естественна при подразумеваемых воинах или врагах.
- source_word: תָּנֻסוּ
  choice: побежите вы
  rationale: Форма второго лица множественного числа сохраняет прямое обращение. Выраженное местоимение подчеркивает переход от «тысячи» к адресатам пророчества.
- source_word: עַד אִם נוֹתַרְתֶּם
  choice: пока не останетесь
  rationale: 'Передает предел и итог бегства: после разгрома адресаты останутся одинокими и заметными.'
- source_word: כַּתֹּרֶן
  choice: словно шест
  rationale: תֹּרֶן может обозначать мачту или высокий шест. Нейтральное «шест» сохраняет наземный образ на вершине горы, а лексическая неоднозначность отмечена в сноске.
- source_word: עַל רֹאשׁ הָהָר
  choice: на вершине горы
  rationale: Прямое и естественное воспроизведение высотного положения предмета.
- source_word: וְכַנֵּס
  choice: и словно знамя
  rationale: נֵס обозначает поднятое знамя, штандарт или иной знак, служащий сигналом. «Знамя» понятно современному читателю, а сигнальная функция уточнена в сноске.
- source_word: עַל הַגִּבְעָה
  choice: на холме
  rationale: Естественная передача простого топографического выражения.
theological_decisions:
- issue: Смысл заключительного сравнения
  choice: Сохранен образ одиноко оставшегося, открытого и заметного остатка после бегства.
  alternative: Понимать образ исключительно как предупреждающий сигнал либо только как указание на малочисленность и слабость.
  rationale: Параллельные образы шеста и знамени на возвышенностях допускают одновременно значения одиночества, открытости и заметности. Перевод не сводит метафору лишь к одному из них.
translation_notes:
  register: Современный литературный русский язык с кратким, напряженным ритмом пророческой речи. Инверсия «побежит тысяча» усиливает несоразмерность сил; «побежите вы» сохраняет внезапный переход к прямому обращению. Образы в конце оставлены без разъясняющих добавлений в основном тексте.
