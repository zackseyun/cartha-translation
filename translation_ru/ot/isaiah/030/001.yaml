  variant: modern literary Russian
source:
  edition: WLC
  text: ה֣וֹי בָּנִ֤ים סֽוֹרְרִים֙ נְאֻם יְהוָ֔ה לַ/עֲשׂ֤וֹת עֵצָה֙ וְ/לֹ֣א מִ/נִּ֔י וְ/לִ/נְסֹ֥ךְ מַסֵּכָ֖ה וְ/לֹ֣א רוּחִ֑/י לְמַ֛עַן סְפ֥וֹת חַטָּ֖את עַל חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/001.yaml
  text: Woe to the rebellious children[a], declares Yahweh, who carry out a plan, but not from me, and who pour out a libation, but not by my Spirit, so as to add sin to sin.
translation:
  language: ru
  text: «Горе непокорным детям, — возвещает Яхве, — которые осуществляют замысел, но не от Меня, и совершают возлияние[a], но не по Моему Духу, прибавляя грех ко греху!»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и ткут покров»; некоторые в данном контексте понимают выражение шире: «и заключают союз». Еврейский текст с масоретской огласовкой естественнее всего означает: «и совершают возлияние».'
    reason: Альтернативные толкования неоднозначного еврейского выражения וְלִנְסֹךְ מַסֵּכָה.
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Сохраняет силу пророческого возгласа, одновременно выражающего обличение и предвестие бедствия.
- source_word: בָּנִים סוֹרְרִים
  choice: непокорным детям
  rationale: Передаёт как отношения Яхве со Своим народом, так и упорное сопротивление, выраженное причастием סוֹרְרִים; «детям» естественно обозначает коллектив независимо от пола.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Весомая и естественная передача пророческой формулы; личное имя יְהוָה передано как «Яхве».
- source_word: לַעֲשׂוֹת עֵצָה
  choice: осуществляют замысел
  rationale: Инфинитив с существительным указывает не только на составление плана, но и на проведение задуманной политической линии.
- source_word: וְלֹא מִנִּי
  choice: но не от Меня
  rationale: 'Предлог מִן указывает на источник: замысел не исходит от Яхве.'
- source_word: וְלִנְסֹךְ מַסֵּכָה
  choice: и совершают возлияние
  rationale: Сохраняет наиболее естественный смысл масоретской огласовки. Возможные контекстуальные толкования вынесены в сноску.
- source_word: וְלֹא רוּחִי
  choice: но не по Моему Духу
  rationale: «По Моему Духу» естественно по-русски выражает отсутствие Божьего водительства или побуждения, не сводя רוּחַ лишь к человеческому намерению.
- source_word: לְמַעַן סְפוֹת
  choice: прибавляя
  rationale: Деепричастная конструкция кратко передаёт итоговую или целевую направленность действия, не устраняя присущую конструкции оттеночную неоднозначность.
- source_word: חַטָּאת עַל חַטָּאת
  choice: грех ко греху
  rationale: Сохраняет повтор и ясно передаёт накопление вины.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное заветное имя и соответствует заданному проектному решению, не подменяя его титулом.
- issue: Толкование וְלִנְסֹךְ מַסֵּכָה
  choice: сохранить в основном тексте масоретский смысл «совершают возлияние»
  alternative: «ткут покров»; в более широком контекстуальном понимании — «заключают союз»
  rationale: Масоретская огласовка наиболее прямо указывает на возлияние, тогда как контекст союза с Египтом породил иные толкования. Сноска сохраняет эту реальную неоднозначность.
- issue: Значение וְלֹא רוּחִי
  choice: «но не по Моему Духу»
  alternative: «но не по Моей воле»; «но не от Моего духа»
  rationale: Основной вариант сохраняет богословскую весомость רוּחִי и одновременно допускает смысл Божьего водительства, не отождествляя выражение исключительно с позднейшей терминологией о Святом Духе.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Прямая речь оформлена так, чтобы формула «возвещает Яхве» оставалась частью Божьего высказывания. Заглавные буквы в «Меня» и «Моему Духу» служат принятой русской типографической маркировкой обращения к Богу; они не добавляют отдельного толкования.
