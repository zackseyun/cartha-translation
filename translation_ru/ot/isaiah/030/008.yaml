  text: עַתָּ֗ה בּ֣וֹא כָתְבָ֥/הּ עַל ל֛וּחַ אִתָּ֖/ם וְ/עַל סֵ֣פֶר חֻקָּ֑/הּ וּ/תְהִי֙ לְ/י֣וֹם אַחֲר֔וֹן לָ/עַ֖ד עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/008.yaml
  text: Now come[a], write it before them on a tablet, and inscribe it in a scroll, that it may stand for a later day[b], as a witness forever and ever.
translation:
  language: ru
  text: Теперь пойди, запиши это при них на табличке и начертай это на свитке, чтобы это осталось для будущего дня[a], навек, навсегда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для последующего дня»; возможно также: «для последнего дня».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «навсегда»; еврейское выражение усиленно подчёркивает непреходящую длительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה בּוֹא
  choice: Теперь иди
  rationale: 'עַתָּה вводит немедленное повеление, а בּוֹא здесь естественно передаётся по-русски как побуждение приступить к действию: «иди».'
- source_word: כָתְבָהּ
  choice: напиши это
  rationale: Суффикс женского рода указывает на подразумеваемую весть или речь; нейтральное «это» не уточняет референт сверх текста.
- source_word: עַל לוּחַ
  choice: на табличке
  rationale: לוּחַ обозначает твёрдую поверхность для письма — табличку или доску; «табличка» ясно и естественно в данном контексте.
- source_word: אִתָּם
  choice: перед ними
  rationale: Хотя форма может означать «с ними», в контексте публичной фиксации вести вероятен смысл «в их присутствии», кратко переданный как «перед ними».
- source_word: וְעַל סֵפֶר חֻקָּהּ
  choice: и начертай это в свитке
  rationale: סֵפֶר здесь означает письменный документ, вероятно свиток; חקק передаёт намеренную, устойчивую запись. «Начертай» сохраняет эту выразительность, не предполагая буквального высекания на камне.
- source_word: וּתְהִי
  choice: чтобы оно сохранилось
  rationale: Юссив выражает цель или результат записи. «Сохранилось» естественно передаёт предполагаемую длительность существования письменного свидетельства.
- source_word: לְיוֹם אַחֲרוֹן
  choice: на грядущий день
  rationale: Выражение указывает на будущий или последующий день и само по себе не требует узкотехнического эсхатологического смысла.
- source_word: לָעַד עַד עוֹלָם
  choice: навеки, навсегда
  rationale: Сочетание подчёркивает непреходящую длительность. Два близких русских наречия сохраняют усиление еврейской формулы без добавления отсутствующего существительного «свидетельство».
theological_decisions:
- issue: Имеет ли לְיוֹם אַחֲרוֹן обязательный эсхатологический смысл
  choice: на грядущий день
  alternative: на последний день
  rationale: В контексте выражение может обозначать просто будущий день. Основной текст не навязывает специального учения о последнем дне, а возможный более сильный смысл сохранён в примечании.
- issue: Следует ли понимать לָעַד как «в свидетельство»
  choice: навеки
  alternative: как вечное свидетельство
  rationale: Обычное временное значение לָעַד хорошо сочетается с עַד עוֹלָם и не требует добавлять существительное, отсутствующее в еврейском тексте. Возможный свидетельский оттенок письменной записи отмечен отдельно.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повеления. Синтаксис остаётся близким к еврейскому, но звучит естественно; неоднозначность выражения о будущем или последнем дне сохранена в примечании.
