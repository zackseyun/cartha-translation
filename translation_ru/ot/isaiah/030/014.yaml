  text: וּ֠/שְׁבָרָ/הּ כְּ/שֵׁ֨בֶר נֵ֧בֶל יוֹצְרִ֛ים כָּת֖וּת לֹ֣א יַחְמֹ֑ל וְ/לֹֽא יִמָּצֵ֤א בִ/מְכִתָּת/וֹ֙ חֶ֔רֶשׂ לַ/חְתּ֥וֹת אֵשׁ֙ מִ/יָּק֔וּד וְ/לַ/חְשֹׂ֥ף מַ֖יִם מִ/גֶּֽבֶא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/014.yaml
  text: and its breaking is like the breaking of a potter’s jar[a], smashed without pity[b], so that among its shattered pieces not a shard is found with which to take fire from the hearth or to scoop water from a cistern.
translation:
  language: ru
  text: Её разрушение будет подобно разбиению гончарного сосуда — разбиению без жалости, так что среди его осколков не найдётся ни одного черепка, которым можно было бы взять огонь из очага[a] или зачерпнуть воды из водоёма[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взять огонь из места горения»; речь может идти о том, чтобы подхватить черепком горящие угли или жар.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из водосборника (цистерны)». Еврейское слово может обозначать вообще место, где собралась вода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁבָרָהּ
  choice: И он разобьёт её
  rationale: 'Масоретская огласовка естественно понимается как форма глагола в породе пиэль с суффиксом 3-го лица женского рода: «он разобьёт её». Подлежащее в еврейском тексте прямо не названо, поэтому русское «он» написано со строчной буквы и не отождествляется в самом переводе с Богом.'
- source_word: כְּשֵׁבֶר נֵבֶל יוֹצְרִים
  choice: как разбивают сосуд горшечника
  rationale: Оборот вводит сравнение с полным разрушением глиняного сосуда. «Сосуд горшечника» сохраняет образ изготовленной горшечником утвари, не сужая נֵבֶל непременно до кувшина или фляги.
- source_word: כָּתוּת לֹא יַחְמֹל
  choice: раздробит без жалости
  rationale: כָּתוּת передаёт состояние полного раздробления, а לֹא יַחְמֹל буквально выражает отсутствие пощады или сострадания. Русская формулировка сохраняет силу и конкретность образа.
- source_word: בִמְכִתָּתוֹ
  choice: среди его осколков
  rationale: Контекст указывает на результат раздробления сосуда. Такое выражение естественно по-русски и подготавливает упоминание отдельного черепка.
- source_word: חֶרֶשׂ
  choice: черепка
  rationale: Слово обозначает осколок глиняного сосуда. «Черепок» точнее и нагляднее общего «осколок».
- source_word: לַחְתּוֹת אֵשׁ מִיָּקוּד
  choice: взять огонь из очага
  rationale: Перевод близок к буквальному «взять огонь из места горения» и сохраняет конкретное назначение достаточно крупного черепка; возможное понимание огня как углей или жара вынесено в примечание.
- source_word: וְלַחְשֹׂף מַיִם מִגֶּבֶא
  choice: или зачерпнуть воды из водоёма
  rationale: Глагол в данном предметном контексте описывает зачерпывание воды черепком. גֶּבֶא обозначает место со скопившейся водой; нейтральное «водоём» сохраняет широту значения, а более узкая возможность «водосборник/цистерна» отмечена в сноске.
theological_decisions:
- issue: Неназванное подлежащее в начале стиха
  choice: Передать грамматическое мужское единственное число как «он», не поясняя, кто именно действует
  alternative: «Её разрушение будет подобно…» или безличное «её разобьют…»
  rationale: Масоретская форма поддерживает глагольное чтение, но сам стих не называет действующего. Строчная буква и отсутствие поясняющей вставки не навязывают богословского отождествления, сохраняя связь с контекстом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет нарастающий образ полного уничтожения, но избегает устаревших слов и искусственной буквальности. Местоименные связи оставлены контекстуальными, как в еврейском тексте.
