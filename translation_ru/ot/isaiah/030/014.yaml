  - severity: high
    issue: Начальное וּשְׁבָרָהּ переведено как «И он разобьёт её».
    rationale: В приведённой масоретской огласовке форма имеет естественное именное понимание «и её разрушение/крушение»; это также отражено в английском аудите. Глагольное прочтение возможно как интерпретация, но не должно занимать основное место без оговорки.
  - severity: medium
