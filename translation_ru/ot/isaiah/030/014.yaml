    rationale: Она называет именное прочтение «другой интерпретацией», хотя именно оно лучше соответствует огласованному тексту. Следует дать его в основном тексте, а глагольное — как альтернативное понимание.
  revised_text: Её разрушение будет подобно разбиению гончарного сосуда — разбиению без жалости, так что среди его осколков не найдётся ни одного черепка, которым можно было бы взять огонь из очага[a] или зачерпнуть воды из водоёма[b].
