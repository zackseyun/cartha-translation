  text: מַשָּׂ֖א בַּהֲמ֣וֹת נֶ֑גֶב בְּ/אֶרֶץ֩ צָרָ֨ה וְ/צוּקָ֜ה לָבִ֧יא וָ/לַ֣יִשׁ מֵ/הֶ֗ם אֶפְעֶה֙ וְ/שָׂרָ֣ף מְעוֹפֵ֔ף יִשְׂאוּ֩ עַל כֶּ֨תֶף עֲיָרִ֜ים חֵֽילֵ/הֶ֗ם וְ/עַל דַּבֶּ֤שֶׁת גְּמַלִּים֙ אֽוֹצְרֹתָ֔/ם עַל עַ֖ם לֹ֥א יוֹעִֽילוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/006.yaml
  text: 'An oracle concerning the beasts of the Negev: through a land of distress and hardship[a], of lioness and lion, of viper and flying fiery serpent, they carry their wealth on the shoulders of donkeys and their treasures on the humps of camels[c][b], to a people who cannot profit them.'
translation:
  language: ru
  text: 'Пророчество о животных Негева:[a]


    через землю бедствия и тесноты,

    где львица и лев,[b]

    гадюка и огненный летучий змей,

    они везут своё богатство на спинах ослов

    и свои сокровища на горбах верблюдов —

    к народу, который им не поможет.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бремя о животных Юга». Еврейское слово может означать пророческое возвещение или «бремя», а Негев — название южной области либо просто «юг».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лев и лев». В еврейском тексте употреблены два разных слова для льва, но их точное различие в этом контексте неясно.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к народу, который не принесёт им пользы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Пророчество
  rationale: В заголовках пророческих речей слово обозначает возвещение или изречение. «Пророчество» естественно для современного русского языка и передаёт жанровую функцию; буквальное «бремя» отмечено в сноске.
- source_word: בַּהֲמוֹת נֶגֶב
  choice: о животных Негева
  rationale: Сохранена вероятная географическая отсылка к Негеву и общий смысл בַּהֲמוֹת; в контексте речь далее идёт о вьючных животных посольства.
- source_word: בְּאֶרֶץ צָרָה וְצוּקָה
  choice: через землю бедствия и тесноты
  rationale: Предлог понят как указание пути. Пара близких по смыслу слов передана без устранения образа стеснённости и опасности.
- source_word: לָבִיא וָלַיִשׁ
  choice: львица и лев
  rationale: Так различены два еврейских обозначения льва, хотя точное зоологическое различие не вполне ясно.
- source_word: אֶפְעֶה
  choice: гадюка
  rationale: Современное и понятное обозначение ядовитой змеи без ложной зоологической точности.
- source_word: שָׂרָף מְעוֹפֵף
  choice: летучий огненный змей
  rationale: 'Сохранён необычный и неоднозначный образ оригинала: שָׂרָף связан с огнём или жгучим действием, а מְעוֹפֵף — с полётом либо стремительным движением.'
- source_word: יִשְׂאוּ
  choice: они везут
  rationale: В данном контексте глагол описывает перевозку ценностей на вьючных животных; «везут» звучит естественно по-русски.
- source_word: עַל כֶּתֶף עֲיָרִים
  choice: на спинах ослов
  rationale: Русское «на спинах» естественно описывает размещение вьюка на животных; буквальное «на плечах» здесь было бы менее ясно.
- source_word: חֵילֵהֶם
  choice: своё богатство
  rationale: Из возможных значений «сила, имущество, богатство» контекст дипломатических даров требует имущественного смысла.
- source_word: עַל דַּבֶּשֶׁת גְּמַלִּים
  choice: на горбах верблюдов
  rationale: Сохранена конкретная и выразительная деталь еврейского текста.
- source_word: אֹצְרֹתָם
  choice: свои сокровища
  rationale: Слово обозначает запасы ценностей или сокровища; контекст предполагает дорогие дары.
- source_word: עַל עַם לֹא יוֹעִילוּ
  choice: к народу, который им не поможет
  rationale: עַל передаёт направление движения, а יעל может означать как «помогать», так и «приносить пользу». Формулировка естественно выражает тщетность надежды на Египет, не уточняя сверх текста причину неспособности помочь.
theological_decisions:
- issue: Характер опасных существ в Негеве
  choice: Передать их прямо как обитателей опасной пустынной земли, не аллегоризируя.
  alternative: Истолковать животных как символы политических сил либо заменить перечень общим обозначением диких зверей.
  rationale: Текст подчёркивает опасность пути и тщетность посольства; символические отождествления самим стихом не заявлены.
- issue: Смысл бесполезности народа, к которому направляются дары
  choice: «который им не поможет»
  alternative: «который не принесёт им пользы»
  rationale: Оба значения допустимы для יוֹעִילוּ. Основной текст сохраняет политический смысл ожидания помощи, а сноска отмечает более широкую возможность «не принесёт пользы».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Стих оформлен поэтическими строками; сохранены яркие образы оригинала и его смысловая неоднозначность. Местоимение «они» оставлено без явного уточнения субъекта, как и в еврейском тексте.
