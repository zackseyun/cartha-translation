source:
  edition: WLC
  text: וְ/לָ/כֵ֞ן יְחַכֶּ֤ה יְהוָה֙ לַֽ/חֲנַנְ/כֶ֔ם וְ/לָ/כֵ֥ן יָר֖וּם לְ/רַֽחֶמְ/כֶ֑ם כִּֽי אֱלֹהֵ֤י מִשְׁפָּט֙ יְהוָ֔ה אַשְׁרֵ֖י כָּל ח֥וֹכֵי לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/018.yaml
  text: Therefore Yahweh waits to be gracious to you[a], and therefore he rises up to show you mercy; for Yahweh is a God of justice. Blessed are all who wait for him.
translation:
  language: ru
  text: Поэтому Яхве ждёт, чтобы явить вам милость, и потому Он поднимется[a], чтобы сжалиться над вами, ведь Яхве — Бог правосудия. Блаженны все, кто ждёт Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он возвысится, чтобы сжалиться над вами»; возможно также: «Он возвысит Себя, чтобы сжалиться над вами».'
    reason: Еврейское יָרוּם допускает понимание как подъёма к действию, так и возвышения.
lexical_decisions:
- source_word: וְלָכֵן
  choice: Поэтому / и потому
  rationale: Передаёт выводное значение связки и сохраняет её двукратное употребление, не утяжеляя русскую фразу дословным повтором.
- source_word: יְחַכֶּה
  choice: ждёт
  rationale: Основное значение חכה; сохраняет напряжение между отсрочкой и грядущей милостью, а также перекличку с חוֹכֵי в конце стиха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לַחֲנַנְכֶם
  choice: чтобы явить вам милость
  rationale: Передаёт действие חנן как благосклонность и незаслуженную милость; глагол «явить» естественен в современном литературном русском.
- source_word: יָרוּם
  choice: Он поднимется
  rationale: Сохраняет конкретный образ Qal от רום — «подняться, стать высоким» — и в контексте может обозначать переход к действию; альтернативное понимание как возвышения отмечено в сноске.
- source_word: לְרַחֶמְכֶם
  choice: чтобы сжалиться над вами
  rationale: Передаёт רחם как сострадание и отличает его от предшествующего חנן.
- source_word: אֱלֹהֵי מִשְׁפָּט
  choice: Бог правосудия
  rationale: Конструктивное сочетание характеризует Яхве как Бога справедливого суда и управления; «правосудие» здесь естественнее и точнее, чем допускающее иной оттенок «суд».
- source_word: אַשְׁרֵי
  choice: Блаженны
  rationale: Устоявшаяся и достойная передача древнееврейской формулы благополучия, сохраняющая её богословскую весомость.
- source_word: חוֹכֵי לוֹ
  choice: кто ждёт Его
  rationale: 'Сохраняет повтор корня חכה: Яхве ждёт, и блаженны ожидающие Его.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение יָרוּם
  choice: Он поднимется
  alternative: Он возвысится / будет возвышен
  rationale: Форма допускает как образ подъёма ради вмешательства, так и значение возвышения. Основной текст следует динамическому смыслу параллели, а подлинная неоднозначность сохраняется в сноске.
- issue: Соотношение Божьего ожидания и человеческого ожидания
  choice: Повторить «ждёт» в обеих частях
  alternative: 'Во второй части: «надеется на Него»'
  rationale: Повтор одного еврейского корня создаёт значимую богословскую и литературную перекличку, которую следует сохранить без истолковывающего расширения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; сохранены повтор «ждёт» и неоднозначность יָרוּם.
