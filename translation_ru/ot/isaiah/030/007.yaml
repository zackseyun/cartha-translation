  text: For Egypt’s help is utterly empty and worthless[a]; therefore I call her[b], “Rahab Who Sits Still.”
translation:
  language: ru
  text: 'Помощь Египта совершенно бесполезна; поэтому Я назвал его: «Раав: они сидят без дела».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Раав» — поэтическое имя или прозвище Египта; оно также может вызывать оттенки гордыни или хвастовства. Еврейская фраза сжата и допускает иные передачи: «Раав, сидящий без дела» или «Хвастун, который ничего не делает». В последней части еврейского текста употреблено множественное число: буквально «они сидят без дела».'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: וּמִצְרַיִם
  choice: А Египет
  rationale: Союз вводит пояснение к предшествующему предостережению; «А Египет» естественно сохраняет связь и позволяет передать еврейскую конструкцию без превращения глагола в существительное.
- source_word: הֶבֶל וָרִיק
  choice: тщетно и впустую
  rationale: Парные слова обозначают бесполезность и безрезультатность египетской помощи. Два наречия сохраняют усиление исходного текста и естественно сочетаются с глаголом «помогает».
- source_word: יַעְזֹרוּ
  choice: помогает
  rationale: Буквально стоит форма множественного числа «помогают», однако Египет может мыслиться собирательно — как его силы или представители. В русском единственное число согласовано с названием страны; формальная особенность отмечена в примечании.
- source_word: לָכֵן
  choice: поэтому
  rationale: 'Передаёт явный вывод: поскольку помощь Египта бесполезна, ему даётся насмешливое имя.'
- source_word: קָרָאתִי לָזֹאת
  choice: Я называю его
  rationale: Форма совершенного вида может обозначать данное пророком устойчивое наименование. Местоимение соотнесено с грамматически мужским русским словом «Египет», хотя еврейское указательное местоимение женского рода олицетворяет страну.
- source_word: רַהַב
  choice: Раав
  rationale: Сохранено поэтическое имя-прозвище Египта, связанное со значениями буйной силы, гордыни и хвастовства; смысловые оттенки пояснены в сноске.
- source_word: הֵם שָׁבֶת
  choice: сидящий без дела
  rationale: Сжатая и трудная фраза передаёт насмешку над гордым, но бездействующим Египтом. Причастный оборот сохраняет образ сидения, а «без дела» проясняет подразумеваемое бездействие, не устраняя альтернативного синтаксического понимания.
theological_decisions:
- issue: Передача насмешливого имени רַהַב הֵם שָׁבֶת
  choice: «Раав, сидящий без дела»
  alternative: «Раав — они сидят без дела»; «Хвастун, который ничего не делает»
  rationale: Это пророческая сатира, а не отдельное вероучительное утверждение. Основной текст сохраняет имя «Раав» и образ бездействия, а сноска отмечает неоднозначность крайне сжатой еврейской фразы.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формулировка сохраняет параллельное усиление «тщетно и впустую» и насмешливую образность прозвища, а неоднозначность еврейского синтаксиса вынесена в примечание.
