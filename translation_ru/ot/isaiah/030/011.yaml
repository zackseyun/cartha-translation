source:
  edition: WLC
  text: ס֚וּרוּ מִנֵּי דֶ֔רֶךְ הַטּ֖וּ מִנֵּי אֹ֑רַח הַשְׁבִּ֥יתוּ מִ/פָּנֵ֖י/נוּ אֶת קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/011.yaml
  text: Turn aside from the way[a]; depart from the path; remove the Holy One of Israel from before us.
translation:
  language: ru
  text: «Сойдите с дороги, сверните с пути, уберите от нас Святого Израиля[a]!»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделайте так, чтобы Святой Израиля перестал быть перед нами».'
    reason: Лексическая альтернатива, сохраняющая явную каузативную силу еврейского глагола הַשְׁבִּיתוּ и буквальный образ מִפָּנֵינוּ — «перед нами».
lexical_decisions:
- source_word: סוּרוּ מִנֵּי דֶרֶךְ
  choice: Сойдите с дороги
  rationale: Повелительная форма множественного числа передаёт требование покинуть избранное направление; «сойти с дороги» естественно по-русски сохраняет образ движения в сторону.
- source_word: הַטּוּ מִנֵּי אֹרַח
  choice: сверните с пути
  rationale: Глагол נטה означает отклониться или повернуть; сочетание «сверните с пути» сохраняет поэтический параллелизм с первой строкой, различая близкие существительные דֶּרֶךְ и אֹרַח.
- source_word: הַשְׁבִּיתוּ מִפָּנֵינוּ
  choice: уберите от нас
  rationale: Каузативная форма от שבת требует сделать так, чтобы некто перестал находиться перед говорящими. «Уберите от нас» ясно и естественно выражает враждебное требование устранить Божье присутствие, не уточняя способ.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святого Израиля
  rationale: Сохранён устойчивый для книги Исаии титул Бога. Современная конструкция с родительным падежом понятнее обычному читателю, чем архаическое «Святой Израилев».
theological_decisions:
- issue: Референт выражения «Святой Израиля»
  choice: Божественный титул Бога Израиля сохранён без перифраза.
  alternative: Понимать выражение метонимически как пророческое слово Исаии или как Божью святость вообще.
  rationale: В книге Исаии это повторяющийся титул Господа. Прямой перевод сохраняет богословскую силу отвержения самого Бога и Его обличающего присутствия, не исключая контекстуальной связи с пророческим словом.
- issue: Каузативная сила הַשְׁבִּיתוּ
  choice: Передана глаголом «уберите», а буквальная каузативность отмечена в сноске.
  alternative: «Сделайте так, чтобы Святой Израиля больше не был перед нами».
  rationale: Основной вариант звучит естественно и сохраняет требование устранения; сноска удерживает более буквальный оттенок прекращения присутствия, не разрешая чрезмерно конкретно, идёт ли речь о Боге, упоминании о Нём или Его слове.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, повелительного тона и параллелизма еврейской поэзии. Титул «Святой Израиля» передан торжественно, но без архаической притяжательной формы «Израилев».
