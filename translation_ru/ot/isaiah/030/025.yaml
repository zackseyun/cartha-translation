    issue: «Водные русла» может обозначать сухие или просто геоморфологические русла.
    rationale: В сочетании с מָיִם и в образе изобильной воды предпочтительно слово, обозначающее сам водный поток. «Водотоки» сохраняет неопределённость редкого выражения и не вносит представление о сухом русле.
  - severity: low
    issue: Повтор «на всякой ... и на всяком ...» несколько тяжеловесен для современного литературного русского.
    rationale: Замена на «на каждой высокой горе и каждом возвышенном холме» сохраняет еврейский параллелизм и квантор всеохватности, улучшая плавность.
