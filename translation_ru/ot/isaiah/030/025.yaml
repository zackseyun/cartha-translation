base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/025.yaml
  text: And on every high mountain and on every lofty hill there will be streams[a], channels of water, on the day of great slaughter, when the towers fall.
translation:
  language: ru
  text: И на каждой высокой горе и каждом возвышенном холме будут потоки, водотоки[a], в день великого побоища, когда падут башни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «водные протоки»; редкое еврейское слово может также обозначать ручьи или небольшие водотоки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: будут
  rationale: Еврейский оборот вводит будущее существование потоков; русское «будут» естественно согласуется с составным подлежащим и сохраняет пророческую перспективу.
- source_word: הַר גָּבֹהַ
  choice: высокая гора
  rationale: Обычное и ясное обозначение высоты в топографическом контексте.
- source_word: גִּבְעָה נִשָּׂאָה
  choice: возвышенный холм
  rationale: Передаёт буквальный образ поднятого, возвышающегося холма, оставаясь естественным для современного литературного русского языка.
- source_word: פְּלָגִים
  choice: потоки
  rationale: В контексте изобильной воды на высотах слово обозначает текущие водные потоки; выбранное соответствие ясно и не чрезмерно конкретизирует их размер.
- source_word: יִבְלֵי מָיִם
  choice: водные русла
  rationale: Редкое выражение поставлено рядом с «потоками» и, вероятно, уточняет образ водных протоков или русел. Перевод сохраняет отдельное наименование, а лексическая неопределённость отмечена в сноске.
- source_word: בְּיוֹם הֶרֶג רָב
  choice: в день великого побоища
  rationale: Сохраняет суровую лексику суда и торжественно-пророческий регистр; «побоище» передаёт массовое убийство без смягчения.
- source_word: בִּנְפֹל מִגְדָּלִים
  choice: когда падут башни
  rationale: Предложная инфинитивная конструкция передана временным придаточным; отсутствие определённого артикля сохранено без уточнения, о каких именно башнях идёт речь.
theological_decisions:
- issue: Соотношение образа изобильных вод и картины суда
  choice: Сохранить рядом образы благословения («потоки, водные русла») и суда («день великого побоища», падение башен), не объясняя их взаимосвязь.
  alternative: Истолковать воду исключительно как восстановление после суда либо как обеспечение среди самого суда.
  rationale: Еврейский текст непосредственно соединяет плодородие и разрушение, но не указывает явно, следует ли одно после другого или происходит одновременно; перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксический параллелизм двух высот и резкое соседство воды с побоищем сохранены; добавочных богословских пояснений в основной текст не внесено.
