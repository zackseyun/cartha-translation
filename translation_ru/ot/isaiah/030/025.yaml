revisions:
- from: И на всякой высокой горе и на всяком возвышенном холме будут потоки, водные русла[a], в день великого побоища, когда падут башни.
  to: И на каждой высокой горе и каждом возвышенном холме будут потоки, водотоки[a], в день великого побоища, когда падут башни.
  rationale: Минимальная правка заменяет «водные русла» на «водотоки», чтобы образ обозначал наличие и течение воды, как того требует контекст, но не решает спорный точный оттенок редкого еврейского слова. Временная связь воды, побоища и падения башен оставлена столь же неразъяснённой, как в оригинале.
  reviewer_model: gpt-5.6-terra
