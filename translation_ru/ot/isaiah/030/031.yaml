  text: For at the voice of Yahweh Assyria will be shattered[b][a]; with a rod he will strike.
translation:
  language: ru
  text: Ибо от голоса Яхве Ассирия будет сокрушена[a]; жезлом Он поразит[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придёт в ужас»; также возможно: «будет сломлена». Еврейский глагол может обозначать ужас, крушение или сокрушительное поражение.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте субъект глагола «поразит» прямо не назван; наиболее естественно понимать под ним Яхве, упомянутого в первой части стиха. Дополнение при глаголе также не выражено; по контексту может подразумеваться Ассирия.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предыдущему высказыванию; «ибо» естественно передаёт эту связь в возвышенной, но современной русской речи.
- source_word: מִקּוֹל
  choice: от голоса
  rationale: 'Предлог מִן здесь указывает на причину или повод: Ассирия терпит крах от голоса Яхве. Формулировка сохраняет яркий образ непосредственного действия Божьего голоса.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: יֵחַת
  choice: будет сокрушена
  rationale: Нифаль глагола חתת может обозначать ужас, надлом, крушение или поражение. «Будет сокрушена» уместно передаёт военный и внутренний крах Ассирии, не исключая оттенка ужаса.
- source_word: אַשּׁוּר
  choice: Ассирия
  rationale: В контексте название относится к державе; употреблена общепринятая русская форма.
- source_word: בַּשֵּׁבֶט
  choice: жезлом
  rationale: שֵׁבֶט обозначает жезл, посох или прут. Здесь это орудие карающего удара; «жезл» сохраняет достоинство стиля и образ власти и наказания.
- source_word: יַכֶּה
  choice: Он поразит её
  rationale: Форма Hiphil от נכה означает «ударить, поразить». Мужской субъект прямо не назван и наиболее естественно соотносится с Яхве; объект «её» относится к Ассирии и добавлен ради ясного русского синтаксиса.
theological_decisions:
- issue: Неявный субъект глагола יַכֶּה
  choice: 'Субъектом понят Яхве: «Он поразит её».'
  alternative: Формально субъект в еврейском тексте не назван; возможны более безличные или иные синтаксические истолкования.
  rationale: Ближайший естественный референт мужского рода — Яхве из первой части стиха; такое прочтение также соответствует контексту суда над Ассирией. Неявность оригинала отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Ибо», «сокрушена» и «жезлом» поддерживают достоинство текста, оставаясь понятными широкому читателю. Пунктуация сохраняет двучленную структуру еврейского стиха.
