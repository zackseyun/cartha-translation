  source_fidelity: 'Перевод верно передаёт всех основных участников и действие: тягловых волов и ослов, работающих на земле, их будущий корм и обработку корма двумя орудиями для веяния. Страдательное «провеянный» уместно передаёт смысл относительной конструкции, хотя еврейский глагол формально активен.'
