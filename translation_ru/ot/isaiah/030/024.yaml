  text: וְ/הָ/אֲלָפִ֣ים וְ/הָ/עֲיָרִ֗ים עֹֽבְדֵי֙ הָֽ/אֲדָמָ֔ה בְּלִ֥יל חָמִ֖יץ יֹאכֵ֑לוּ אֲשֶׁר זֹרֶ֥ה בָ/רַ֖חַת וּ/בַ/מִּזְרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/024.yaml
  text: And the oxen and the donkeys that work the ground will eat seasoned fodder[b][a], which has been winnowed with shovel and fork.
translation:
  language: ru
  text: И волы, и ослы, обрабатывающие землю, будут есть приправленный корм[a], провеянный лопатой и веяльными вилами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подсоленный корм»; еврейское определение может обозначать корм, улучшенный добавлением соли или иной приправы.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте названы два земледельческих орудия, которыми при веянии подбрасывали зерно или корм: лопата и веяльные вилы.'
    reason: cultural_note
lexical_decisions:
- source_word: הָאֲלָפִים
  choice: волы
  rationale: В данном земледельческом контексте слово обозначает крупный рогатый скот, используемый как тягловая сила; «волы» точнее передаёт эту функцию, чем общее «скот».
- source_word: הָעֲיָרִים
  choice: ослы
  rationale: Обычное современное обозначение рабочих животных, поставленных здесь в параллель к волам.
- source_word: עֹבְדֵי הָאֲדָמָה
  choice: обрабатывающие землю
  rationale: Причастный оборот характеризует животных по их работе; формулировка сохраняет сельскохозяйственный образ и естественно звучит по-русски.
- source_word: בְּלִיל
  choice: корм
  rationale: Слово обозначает приготовленную смесь для кормления скота. «Корм» понятно современному читателю и не вносит архаического оттенка.
- source_word: חָמִיץ
  choice: приправленный
  rationale: Значение определения спорно и может указывать на улучшенный, в частности подсоленный, корм. «Приправленный» сохраняет общий смысл специально приготовленного корма, не делая более узкое толкование основным текстом.
- source_word: יֹאכֵלוּ
  choice: будут есть
  rationale: Форма передаёт будущее действие в контексте обещанного изобилия.
- source_word: אֲשֶׁר זֹרֶה
  choice: провеянный
  rationale: Хотя еврейская конструкция формально активна, по смыслу корм подвергается обработке; русское страдательное причастие ясно и естественно передаёт этот образ.
- source_word: בָרַחַת
  choice: лопатой
  rationale: Названо земледельческое орудие, которым зерно или корм подбрасывали при веянии; «лопата» — наиболее понятный русский эквивалент.
- source_word: וּבַמִּזְרֶה
  choice: и веяльными вилами
  rationale: Это второе орудие для веяния. Уточнение «веяльными» отличает его от обычных вил и сохраняет конкретность древнего сельскохозяйственного образа.
