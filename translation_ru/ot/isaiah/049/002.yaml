  text: וַ/יָּ֤שֶׂם פִּ/י֙ כְּ/חֶ֣רֶב חַדָּ֔ה בְּ/צֵ֥ל יָד֖/וֹ הֶחְבִּיאָ֑/נִי וַ/יְשִׂימֵ֨/נִי֙ לְ/חֵ֣ץ בָּר֔וּר בְּ/אַשְׁפָּת֖/וֹ הִסְתִּירָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/002.yaml
  text: And he made my mouth like a sharp sword; in the shadow of his hand he hid me[a]. And he made me into a polished arrow; in his quiver he concealed me.
translation:
  language: ru
  text: Он сделал мои уста подобными острому мечу; в тени своей руки он укрыл меня. Он сделал меня отшлифованной стрелой[a] и спрятал в своём колчане.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отборной стрелой», «заострённой стрелой» или «очищенной стрелой». Еврейское определение может обозначать нечто очищенное, отборное или тщательно подготовленное к употреблению.'
    reason: Лексическая неоднозначность בָּרוּר.
lexical_decisions:
- source_word: וַיָּשֶׂם פִּי כְּחֶרֶב חַדָּה
  choice: Он сделал мои уста подобными острому мечу
  rationale: Сохранены телесный образ «мои уста» и прямое сравнение с острым мечом; конструкция «сделал… подобными» естественно передаёт результативное значение שׂים с именной частью сказуемого.
- source_word: בְּצֵל יָדוֹ
  choice: в тени своей руки
  rationale: Буквальный поэтический образ сохранён без поясняющего истолкования как защиты или сокрытия.
- source_word: הֶחְבִּיאָנִי
  choice: укрыл меня
  rationale: Передаёт каузативное значение חבא — «скрыл, укрыл» — и естественно сочетается с образом тени руки.
- source_word: וַיְשִׂימֵנִי לְחֵץ בָּרוּר
  choice: Он сделал меня отшлифованной стрелой
  rationale: «Сделал меня… стрелой» прямо передаёт результативную конструкцию. «Отшлифованной» конкретно выражает образ тщательно подготовленной стрелы, при этом неоднозначность בָּרוּר отмечена в сноске.
- source_word: בְּאַשְׁפָּתוֹ הִסְתִּירָנִי
  choice: спрятал в своём колчане
  rationale: «Колчан» является обычным соответствием אַשְׁפָּה; «спрятал» сохраняет значение сокрытия и позволяет избежать тяжеловесного повтора «укрыл».
theological_decisions:
- issue: Образы оружия как характеристика речи и призвания раба
  choice: Сохранить конкретные образы острого меча и подготовленной стрелы без разъяснения их богословского референта.
  alternative: Прямо истолковать их как действенную пророческую речь, проповедь или мессианскую миссию.
  rationale: Сам стих не раскрывает образ в таких терминах; буквальная образность сохраняет поэтическую силу и не сужает допустимое понимание текста.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified поэтической интонацией. Божественные местоимения даны со строчной буквы в соответствии с обычной современной редакционной практикой. Параллелизм двух полустиший сохранён; лексическое варьирование «укрыл / спрятал» отражает два разных еврейских глагола сокрытия.
