  yaml_path: translation/ot/isaiah/049/024.yaml
  text: Can plunder be taken from a mighty man[b][a], or can the captives of a righteous one be rescued?
translation:
  language: ru
  text: Разве можно отнять у сильного добычу[a] или могут ли быть освобождены пленники праведника[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трофеи»; возможно также: «улов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по еврейскому тексту: «пленники праведника». В данном контексте выражение трудно для понимания. Некоторые толкуют его иначе, а ряд древних переводов отражает чтение, более близкое к «пленникам тирана» или «пленникам жестокого».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֻקַּח
  choice: Разве можно отнять
  rationale: Вопросительная частица с пассивной формой несовершенного вида вводит риторический вопрос. Русская конструкция «разве можно отнять» естественно передаёт и вопрос, и подразумеваемую невозможность.
- source_word: מִגִּבּוֹר
  choice: у сильного
  rationale: גִּבּוֹר обозначает сильного, могучего человека, нередко воина. «У сильного» сохраняет широкий смысл и не добавляет военной конкретики, которой контекст прямо не требует.
- source_word: מַלְקוֹחַ
  choice: добычу
  rationale: Слово обозначает захваченное — добычу, трофеи или улов. «Добыча» естественно звучит по-русски и поддерживает параллель с пленниками.
- source_word: וְאִם
  choice: и разве
  rationale: В параллельном риторическом вопросе сочетание вводит вторую вопросительную часть; «и разве» сохраняет связь между строками и естественно передаёт её функцию.
- source_word: שְׁבִי
  choice: пленники
  rationale: Существительное может означать плен или собирательно пленников. Здесь личное значение лучше соответствует глаголу «спасутся» и параллели с захваченной добычей.
- source_word: צַדִּיק
  choice: праведника
  rationale: Это прямое значение масоретского чтения צַדִּיק. Хотя обозначение захватившего плен как «праведника» трудно в данном контексте, основной текст сохраняет эту смысловую напряжённость.
- source_word: יִמָּלֵט
  choice: спасутся
  rationale: Нифаль глагола מלט выражает избавление или спасение. «Спасутся» сохраняет форму вопроса и допускает как избавление извне, так и выход из плена, не уточняя способ.
theological_decisions:
- issue: Значение צַדִּיק применительно к тому, у кого находятся пленники
  choice: В основном тексте сохранено масоретское чтение «праведника» без устранения контекстуальной трудности.
  alternative: «тирана», «жестокого» или сходное чтение, отражённое в части древних версий и современных толкований
  rationale: Еврейский текст WLC содержит צַדִּיק, обычно означающее «праведный, справедливый». Подмена его контекстуально более ожидаемым обозначением захватчика скрыла бы подлинную текстовую и смысловую трудность, поэтому альтернативы вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской риторики. Повтор «разве» делает обе половины параллельного вопроса ясными для обычного читателя; спорное масоретское чтение сохранено в основном тексте, а не сглажено.
