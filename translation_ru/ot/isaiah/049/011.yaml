  yaml_path: translation/ot/isaiah/049/011.yaml
  text: And I will make all my mountains into a road[b][a], and my highways will be raised up.
translation:
  language: ru
  text: Я превращу все Мои горы в дорогу[a], и Мои пути будут приподняты[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделаю все Мои горы дорогой»; еврейская конструкция может указывать как на результат, так и на назначение: «для дороги» или «как путь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Мои насыпные дороги». Еврейское слово может обозначать специально устроенную, приподнятую дорогу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Я превращу
  rationale: Глагол שׂים означает «положить, поставить, сделать». В сочетании с לַדָּרֶךְ естественное русское «превращу… в дорогу» передаёт результат действия, не устраняя возможного оттенка назначения.
- source_word: כָל הָרַי
  choice: все Мои горы
  rationale: Сохраняется конкретный поэтический образ гор, принадлежащих Богу или находящихся в Его власти; метафорическое истолкование в текст не вносится.
- source_word: לַדָּרֶךְ
  choice: в дорогу
  rationale: Предлог ל после שׂים может указывать на результат или назначение. Основной текст передаёт результат, а альтернативу отмечает сноска.
- source_word: וּמְסִלֹּתַי
  choice: и Мои большие дороги
  rationale: מְסִלָּה обозначает подготовленную, нередко насыпанную или поднятую дорогу. «Большие дороги» понятно современному читателю и не создаёт невольной тавтологии с последующим «будут подняты».
- source_word: יְרֻמוּן
  choice: будут подняты
  rationale: Форма от רום здесь выражает поднятие дорог; пассивная конструкция сохраняет дорожный образ и не придаёт слову отвлечённого смысла «возвеличены».
theological_decisions:
- issue: Характер образа возвращения и восстановления
  choice: Сохранить конкретный образ Бога, превращающего горы в дорогу и поднимающего подготовленные пути.
  alternative: Истолковать горы как духовные или промыслительные препятствия либо представить исключительно буквальный путь возвращения изгнанников.
  rationale: Еврейский текст допускает одновременное буквальное и образное восприятие. Перевод не должен разрешать эту богословскую напряжённость за читателя.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Конкретная топографическая образность сохранена; порядок слов сделан естественным для русского языка. Заглавная буква в «Мои» указывает на речь Бога согласно русской издательской традиции.
