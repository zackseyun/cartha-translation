base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/012.yaml
  text: Look[a], these will come from far away, and look, these from the north and from the sea[b], and these from the land of Sinim.
translation:
  language: ru
  text: Вот, эти придут издалека; вот, эти — с севера и от моря[a], а эти — из земли Синим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно, «с запада»: в древнееврейском языке «море» может служить географическим обозначением запада.'
    reason: lexical_alternative
  - marker: b
    text: Синим — географическое название с неясной локализацией. Среди предложенных отождествлений — Сиена (современный Асуан) на юге Египта; высказывались также предположения о более далёкой восточной области, однако точное местонахождение неизвестно.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: вот
  rationale: Современное и естественное указательное междометие, сохраняющее призыв обратить внимание; повтор передан в тексте.
- source_word: אֵלֶּה
  choice: эти
  rationale: Прямой эквивалент указательного местоимения во множественном числе. Повтор сохранён, чтобы передать последовательное указание на разные группы.
- source_word: מֵרָחוֹק
  choice: издалека
  rationale: Естественно передаёт пространственную удалённость без излишне архаического оттенка.
- source_word: יָבֹאוּ
  choice: придут
  rationale: Имперфект в данном контексте имеет будущее значение; в последующих однородных частях сказуемое подразумевается.
- source_word: מִצָּפוֹן
  choice: с севера
  rationale: Обычное русское обозначение исходного направления, точно соответствующее еврейской форме с предлогом מִן.
- source_word: וּמִיָּם
  choice: и от моря
  rationale: Основной текст сохраняет буквальное значение יָם, не устраняя возможную географическую двусмысленность; значение «с запада» отмечено в сноске.
- source_word: מֵאֶרֶץ
  choice: из земли
  rationale: Сохраняет конструкцию с географическим названием и библейски уместный, но понятный современному читателю оборот.
- source_word: סִינִים
  choice: Синим
  rationale: Неустановленное географическое название транслитерировано, а не отождествлено предположительно с конкретным местом.
