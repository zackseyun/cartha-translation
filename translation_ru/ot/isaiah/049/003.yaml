  yaml_path: translation/ot/isaiah/049/003.yaml
  text: And he said to me[a], “You are my servant, Israel, in whom I will be glorified.”
translation:
  language: ru
  text: 'И он сказал мне: «Ты — мой раб, Израиль; в тебе я прославлюсь[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тебе я явлю свою славу». Возвратная форма еврейского глагола может описывать то, как Бог являет собственную славу в своём рабе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: И он сказал мне
  rationale: 'Последовательная форма וַיֹּאמֶר продолжает повествование, а לִי прямо обозначает адресата: «мне».'
- source_word: עַבְדִּי אַתָּה
  choice: Ты — мой раб
  rationale: Слово עֶבֶד допускает значения «раб» и «слуга»; в контексте книги Исаии «раб» сохраняет устойчивый образ Божьего раба и подчёркнутую конструкцию с отдельным местоимением «ты».
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Имя сохранено как обращение-приложение к словам «мой раб», без уточнения, обозначает ли оно народ, остаток или представляющего Израиль отдельного служителя.
- source_word: בְּךָ
  choice: в тебе
  rationale: Предлог בְּ с местоименным суффиксом прежде всего означает «в тебе»; такой перевод не подменяет исходную пространственно-инструментальную неоднозначность более определённым «через тебя».
- source_word: אֶתְפָּאָר
  choice: я прославлюсь
  rationale: Возвратная порода глагола פאר передаёт явление собственной славы или великолепия. «Прославлюсь» кратко и естественно сохраняет возвратный оттенок, не превращая форму в обычный пассив.
theological_decisions:
- issue: Кого обозначает имя «Израиль» в обращении к рабу
  choice: 'Сохранить прямое обращение: «Ты — мой раб, Израиль»'
  alternative: 'Уточнить в переводе: народ Израиля, верный остаток или отдельный мессианский представитель Израиля'
  rationale: Сам стих называет раба Израилем, тогда как более широкий контекст сохраняет напряжение между собирательным и индивидуальным пониманием. Перевод не должен разрешать этот вопрос доктринально.
- issue: Как Бог прославляется в рабе
  choice: «в тебе я прославлюсь»
  alternative: «через тебя я явлю свою славу»
  rationale: Основной текст сохраняет буквальное בְּךָ («в тебе») и возвратность глагола, не определяя жёстко, идёт ли речь о сфере явления славы или о посредничестве раба.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Тире перед именной частью подчёркивает явное местоимение אַתָּה. Местоимения, относящиеся к Богу, написаны со строчной буквы как нейтральная современная издательская норма.
