source:
  edition: WLC
  text: לֹ֤א יִרְעָ֨בוּ֙ וְ/לֹ֣א יִצְמָ֔אוּ וְ/לֹא יַכֵּ֥/ם שָׁרָ֖ב וָ/שָׁ֑מֶשׁ כִּי מְרַחֲמָ֣/ם יְנַהֲגֵ֔/ם וְ/עַל מַבּ֥וּעֵי מַ֖יִם יְנַהֲלֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/010.yaml
  text: They will not hunger or thirst[a], nor will scorching heat or sun strike them; for the one who has compassion on them will lead them[b], and he will guide them to springs of water.
translation:
  language: ru
  text: Они не будут ни голодать, ни жаждать; ни палящий зной, ни солнце не поразят их, ибо тот, кто сострадает им, поведёт их и приведёт к источникам воды[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет вести их у источников воды».'
    reason: Предлог עַל может обозначать как направление к месту, так и положение рядом с ним; в сочетании с глаголом ведения возможны оба оттенка.
lexical_decisions:
- source_word: יִרְעָבוּ
  choice: будут голодать
  rationale: Глагольная передача формы Qal сохраняет параллелизм с выражением о жажде и звучит естественно по-русски.
- source_word: יִצְמָאוּ
  choice: томиться жаждой
  rationale: Передаёт не просто состояние, а переживание жажды; вместе с «голодать» образует естественную русскую поэтическую пару.
- source_word: יַכֵּם
  choice: поразят их
  rationale: Сохраняет конкретный образ губительного воздействия зноя и солнца, оставаясь естественным в современном литературном русском.
- source_word: שָׁרָב
  choice: палящий зной
  rationale: Слово обозначает иссушающий пустынный жар; «палящий зной» ясно передаёт его силу и поэтический образ.
- source_word: שָׁמֶשׁ
  choice: солнце
  rationale: Прямое и контекстуально уместное обозначение физического солнца.
- source_word: מְרַחֲמָם
  choice: тот, кто сострадает им
  rationale: Передаёт причастную конструкцию с суффиксом множественного числа и сохраняет описательное именование, не вставляя прямо слово «Бог».
- source_word: יְנַהֲגֵם
  choice: поведёт их
  rationale: Соответствует значению Piel «вести» и уместно передаёт заботливое руководство в данном контексте.
- source_word: מַבּוּעֵי מַיִם
  choice: источники воды
  rationale: Сохраняет конкретный образ естественных водных источников и понятно современному читателю.
- source_word: יְנַהֲלֵם
  choice: приведёт
  rationale: Передаёт мягкое ведение к месту назначения и позволяет по-русски избежать тяжеловесного повтора глагола «вести».
- source_word: וְעַל
  choice: к
  rationale: В контексте движения предлог עַל допускает направительное понимание; «к источникам воды» естественно выражает обещание привести к воде, при этом пространственная альтернатива сохранена в сноске.
theological_decisions:
- issue: Кого обозначает сострадающий вождь
  choice: Сохранено описательное выражение «тот, кто сострадает им» без прямого добавления имени Бога.
  alternative: Явно перевести «Бог, который сострадает им» либо использовать прописную букву в местоименном именовании.
  rationale: Контекст указывает на Бога, однако еврейский текст называет его описательно. Такой перевод сохраняет вероятный смысл, не превращая контекстуальное отождествление в прямое утверждение текста.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Парная конструкция «ни… ни…» сохраняет ритм отрицаний; лексика понятна широкому кругу читателей. Описательное именование Бога намеренно оставлено со строчной буквы, чтобы не добавлять отсутствующую в еврейском тексте графическую интерпретацию.
