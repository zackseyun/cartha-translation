reference: Isaiah 49:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָי֨וּ מְלָכִ֜ים אֹֽמְנַ֗יִ/ךְ וְ/שָׂרֽוֹתֵי/הֶם֙ מֵינִ֣יקֹתַ֔יִ/ךְ אַפַּ֗יִם אֶ֚רֶץ יִשְׁתַּ֣חֲווּ לָ֔/ךְ וַ/עֲפַ֥ר רַגְלַ֖יִ/ךְ יְלַחֵ֑כוּ וְ/יָדַ֨עַתְּ֙ כִּֽי אֲנִ֣י יְהוָ֔ה אֲשֶׁ֥ר לֹֽא יֵבֹ֖שׁוּ קוָֹֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/023.yaml
  text: Kings will be your foster fathers[a], and their princesses your nursing mothers. With faces to the ground they will bow down to you, and they will lick the dust of your feet. Then you will know that I am Yahweh[b]; those who wait for me will not be put to shame.
translation:
  language: ru
  text: Цари станут твоими воспитателями[a], а их княгини — твоими кормилицами. Повергнувшись лицом к земле, они поклонятся тебе и будут лизать прах у твоих ног. И ты узнаешь, что Я — Яхве; те, кто ждёт Меня[b], не будут посрамлены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоими приёмными отцами», «твоими попечителями». Еврейское слово может обозначать тех, кто растит, поддерживает или оберегает.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «те, кто уповает на Меня». Еврейский глагол выражает и ожидание, и надежду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְנַיִךְ
  choice: твоими воспитателями
  rationale: Слово обозначает тех, кто растит, поддерживает и оберегает. «Воспитателями» сохраняет образ попечения и естественно сочетается с последующим образом кормилиц.
- source_word: שָׂרוֹתֵיהֶם
  choice: их княгини
  rationale: Женская форма от שׂר может обозначать княгинь, знатных женщин или правительниц. «Княгини» сохраняет связь с царской и аристократической средой, не сужая значение до жён царей.
- source_word: מֵינִיקֹתַיִךְ
  choice: твоими кормилицами
  rationale: «Кормилицы» точно и естественно передаёт женщин, кормящих и растящих ребёнка, сохраняя параллель с воспитателями.
- source_word: אַפַּיִם אֶרֶץ
  choice: повергнувшись лицом к земле
  rationale: Еврейская идиома буквально связывает лицо с землёй и описывает полное преклонение; русский оборот ясно передаёт и позу, и уничижение.
- source_word: יִשְׁתַּחֲווּ לָךְ
  choice: они поклонятся тебе
  rationale: Глагол обозначает поклон или простирание ниц. В данном контексте речь идёт о выражении покорности и почтения Сиону, без обязательного значения богопоклонения.
- source_word: וַעֲפַר רַגְלַיִךְ יְלַחֵכוּ
  choice: будут лизать прах у твоих ног
  rationale: Сохранён намеренно резкий образ полного унижения и подчинения; «у твоих ног» звучит по-русски естественнее буквального «прах твоих ног».
- source_word: וְיָדַעַתְּ
  choice: И ты узнаешь
  rationale: Союз и форма глагола продолжают пророческое следствие. Женский род адресата подразумевается формой еврейского глагола и соответствует обращению к Сиону.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени сохраняет отличие тетраграмматона от титула «Господь» и следует непосредственно еврейскому тексту.
- source_word: לֹא יֵבֹשׁוּ
  choice: не будут посрамлены
  rationale: Формулировка передаёт не просто внутренний стыд, а итоговое публичное унижение или крушение надежды.
- source_word: קוָֹי
  choice: те, кто ждёт Меня
  rationale: Причастие от קוה сочетает ожидание с надеждой. Основной текст сохраняет образ ожидания, а оттенок упования отмечен в сноске.
theological_decisions:
- issue: Характер поклонения Сиону
  choice: «поклонятся тебе» как конкретный жест почтения и подчинения
  alternative: «будут поклоняться тебе» в смысле богопочитания
  rationale: Контекст описывает царей и княгинь, признающих восстановленный Сион. Перевод сохраняет жест преклонения, не приписывая Сиону божественного статуса и не устраняя силу образа.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация передаёт личное имя, присутствующее в еврейском тексте, тогда как «Господь» является традиционной заменой имени титулом.
- issue: Значение קוה
  choice: ожидание Бога с оттенком доверия
  alternative: исключительно «уповать» или исключительно нейтрально «ждать»
  rationale: Еврейский глагол удерживает вместе временное ожидание и надежду; основной вариант и сноска сохраняют оба оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский адресат передан естественной формой «ты узнаешь»; речь обращена к Сиону. Сохранены яркие телесные образы преклонения и лизания праха, но синтаксис сделан понятным современному читателю.
