base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/001.yaml
  text: 'Listen to me[a], coastlands, and pay attention, peoples from far away: Yahweh called me from the womb[b]; from my mother’s body he mentioned my name.'
translation:
  language: ru
  text: Слушайте меня, приморские земли[a], и внимайте, далёкие народы! Яхве призвал меня из чрева; из утробы матери моей Он произнёс моё имя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «острова». Еврейское слово может обозначать острова, побережья и, шире, далёкие заморские земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение можно также передать: «назвал меня по имени» или «упомянул моё имя»; в данном контексте оно может подразумевать наречение, призвание или предназначение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Слушайте меня
  rationale: Множественное повелительное наклонение передаёт прямой призыв к внимательному слушанию; современная и естественная формулировка.
- source_word: אִיִּים
  choice: приморские земли
  rationale: В Книге Исаии слово нередко обозначает не только острова, но и далёкие морские побережья и заморские области; более узкое значение отмечено в сноске.
- source_word: וְהַקְשִׁיבוּ
  choice: и внимайте
  rationale: Глагол выражает усиленный призыв прислушаться и сосредоточить внимание. «Внимайте» сохраняет достоинство пророческой речи и параллелизм.
- source_word: לְאֻמִּים מֵרָחוֹק
  choice: далёкие народы
  rationale: Компактная русская конструкция естественно передаёт обращение к народам, находящимся вдали.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: מִבֶּטֶן קְרָאַנִי
  choice: призвал меня ещё во чреве
  rationale: «Призвал» сохраняет как основное значение глагола, так и возможный оттенок предназначения; «ещё» естественно выражает временной смысл исходной конструкции.
- source_word: מִמְּעֵי אִמִּי
  choice: ещё в утробе матери моей
  rationale: Буквально речь идёт о внутренностях матери; «утроба» является естественным и поэтически уместным русским соответствием, параллельным слову «чрево».
- source_word: הִזְכִּיר שְׁמִי
  choice: Он произнёс моё имя
  rationale: Формулировка сохраняет конкретный образ упоминания имени и не сводит выражение безоговорочно к наречению или назначению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. «Яхве» прямо его передаёт и не подменяет титулом.
- issue: Смысл дородового призвания и произнесения имени
  choice: 'Сохранены два отдельных высказывания: «призвал меня» и «произнёс моё имя»'
  alternative: «назвал меня по имени» или «предназначил меня»
  rationale: Так сохраняются поэтический параллелизм и напряжение между буквальным упоминанием имени и возможным смыслом избрания или назначения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обращения. Слова «чрево» и «утроба» сохраняют поэтический параллелизм, не звуча архаично в библейском контексте; местоимение «Он» выделяет смену субъекта и соответствует принятой русской религиозной орфографии.
