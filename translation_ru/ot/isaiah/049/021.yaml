  source_fidelity: 'В целом ряд образов передан точно: утрата детей, бездетность, изгнание/удаление, одиночество и вопрос о тех, кто появился. Однако в последнем вопросе еврейский глагол-связка стоит в настоящем времени: «где же эти?»; вариант «где же они были?» необоснованно переносит вопрос в прошлое. Также «всех их» усиливает указательное אֵלֶּה («эти») до всеохватности, которой в тексте нет.'
