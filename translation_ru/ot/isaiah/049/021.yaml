  text: וְ/אָמַ֣רְתְּ בִּ/לְבָבֵ֗/ךְ מִ֤י יָֽלַד לִ/י֙ אֶת אֵ֔לֶּה וַ/אֲנִ֥י שְׁכוּלָ֖ה וְ/גַלְמוּדָ֑ה גֹּלָ֣ה וְ/סוּרָ֗ה וְ/אֵ֨לֶּה֙ מִ֣י גִדֵּ֔ל הֵ֤ן אֲנִי֙ נִשְׁאַ֣רְתִּי לְ/בַדִּ֔/י אֵ֖לֶּה אֵיפֹ֥ה הֵֽם־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/021.yaml
  text: Then you will say in your heart, ‘Who has borne these for me, since I was bereaved and barren, exiled and cast off? And these—who has raised them? Look, I was left alone; where then did these come from?’
translation:
  language: ru
  text: 'Тогда ты скажешь в своём сердце: «Кто родил мне этих детей? Ведь я была лишена детей и бездетна, изгнанница и отверженная[a]. А этих кто вырастил? Вот, я осталась совсем одна — где же они?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удалённая». Значение еврейского слова неоднозначно и может указывать на ту, кого удалили или отвергли.'
    reason: Сохраняет возможный смысловой диапазон סוּרָה, не устраняя основной перевод «отверженная».
lexical_decisions:
- source_word: יָלַד לִי אֶת־אֵלֶּה
  choice: родил мне всех их
  rationale: Передаёт образ рождения детей для Сиона и сохраняет вопрос о неожиданно появившемся множестве, не уточняя пол того, кто родил.
- source_word: שְׁכוּלָה וְגַלְמוּדָה
  choice: лишилась детей и была бесплодна
  rationale: Сохраняет сочетание утраты детей и невозможности иметь их; в данном контексте גַלְמוּדָה обозначает оставшуюся без потомства, опустевшую женщину.
- source_word: גֹּלָה וְסוּרָה
  choice: была изгнана и отвержена
  rationale: גֹּלָה передано как состояние изгнания, а многозначное סוּרָה — как удаление и отверженность; возможный более буквальный оттенок отмечен в сноске.
- source_word: גִדֵּל
  choice: вырастил
  rationale: Порода пиэль выражает вскармливание и воспитание до зрелости; «вырастил» естественно передаёт оба оттенка.
- source_word: אֵלֶּה אֵיפֹה הֵם
  choice: где же они были?
  rationale: Сохранён прямой пространственный вопрос еврейского текста и его риторическая загадочность, без поясняющего преобразования в «откуда они взялись».
theological_decisions:
- issue: Неожиданное восстановление детей Сиона
  choice: Сохранить вопросы Сиона без явного указания на деятеля
  alternative: Уточнить, что детей дал или собрал Бог
  rationale: В стихе деятель намеренно не назван; ответ раскрывается ближайшим контекстом, поэтому его не следует вносить в сам вопрос.
- issue: Состояние Сиона в изгнании
  choice: Передать одновременно потерю детей, бесплодие, изгнание и отверженность
  alternative: Свести ряд определений к общему образу одиночества
  rationale: Накопление четырёх определений создаёт богословское напряжение между прежней опустошённостью Сиона и внезапным множеством детей.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Обращение в женском роде сохраняет олицетворение Сиона; синтаксический параллелизм и цепь риторических вопросов переданы без излишней архаизации.
