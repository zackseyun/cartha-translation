base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/019.yaml
  text: For your ruins[a], your desolate places, and your devastated land—surely now you will be too cramped for inhabitants[b], and those who swallowed you up will be far away.
translation:
  language: ru
  text: Ибо твои развалины, твои опустевшие места и твоя разорённая земля — теперь тебе станет слишком тесно для жителей[a], а те, кто поглощал тебя[b], уйдут далеко.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «тебе станет тесно от жителей» или «из-за жителей». Еврейский предлог допускает связь как с вместимостью для жителей, так и с теснотой вследствие их множества.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поглощающие тебя»; сохранён еврейский образ уничтожения как поглощения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרְבֹתַיִךְ
  choice: твои развалины
  rationale: Существительное חָרְבָּה обозначает разрушенное, лежащее в руинах место; «развалины» естественно передаёт образ и сохраняет параллелизм.
- source_word: שֹׁמְמֹתַיִךְ
  choice: твои опустевшие места
  rationale: Форма от שׁמם описывает места, ставшие безлюдными и запустелыми; такой перевод отличает их от собственно развалин.
- source_word: אֶרֶץ הֲרִסֻתֵיךְ
  choice: твоя разорённая земля
  rationale: Сочетание обозначает землю, подвергшуюся разрушению; «разорённая» звучит естественно и сохраняет результативный смысл.
- source_word: כִּי
  choice: ведь
  rationale: Первое כִּי вводит основание для предшествующего обещания и связывает стих с контекстом.
- source_word: כִּי עַתָּה
  choice: теперь
  rationale: Второе כִּי имеет усилительно-переходную функцию; по-русски акцент достаточно передан порядком слов и тире, без тяжеловесного «воистину теперь».
- source_word: תֵּצְרִי
  choice: ты станешь тесна
  rationale: Глагольная форма обращена к Сиону во втором лице женского рода и выражает недостаток пространства; сохранено прямое обращение и пространственный образ.
- source_word: מִיּוֹשֵׁב
  choice: для жителей
  rationale: Предлог מִן при форме от ישׁב допускает понимание тесноты по отношению к населяющим Сион людям; «для жителей» естественно выражает это по-русски.
- source_word: וְרָחֲקוּ
  choice: удалятся далеко
  rationale: Перфект в пророческом контексте передаёт будущий результат обещанного восстановления; русское будущее согласуется с предыдущей формой.
- source_word: מְבַלְּעָיִךְ
  choice: поглощавшие тебя
  rationale: Причастная форма от בלע сохраняет яркий образ поглощения и не сводит его к общему обозначению «разрушители».
theological_decisions:
- issue: Временная отнесённость перфекта וְרָחֲקוּ
  choice: 'будущее время: «удалятся далеко»'
  alternative: 'прошедшее или результативное настоящее: «удалились далеко»'
  rationale: В пророчестве о восстановлении Сиона форма описывает обещанный итог перемены; будущее время ясно передаёт эту направленность, не превращая действие в уже завершившееся историческое сообщение.
- issue: Образ врагов как поглощающих Сион
  choice: 'сохранить метафору: «поглощавшие тебя»'
  alternative: обобщить как «твои разорители» или «твои губители»
  rationale: Еврейский текст намеренно использует конкретный и напряжённый образ בלע; его сохранение не навязывает дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор притяжательного местоимения сохраняет трёхчастный параллелизм; тире передаёт резкий переход от запустения к многолюдству. Прямое обращение к Сиону в женском роде сохранено.
