revisions:
- from: И теперь говорит Яхве, создавший меня от утробы, чтобы я был Его слугой, возвратил к Нему Иакова и собрал для Него Израиль[a]. Я почтён в глазах Яхве, и мой Бог стал моей силой.
  to: И теперь говорит Яхве, создавший меня от утробы, чтобы я был Его слугой, возвратил к Нему Иакова и собрал к Нему Израиль[a]. Я почтён в глазах Яхве, и мой Бог стал моей силой.
  rationale: Исправлена координация придаточного цели, чтобы служение и две задачи слуги были выражены одной ясной конструкцией. «Для Него» заменено на «к Нему» в соответствии с направлением, подразумеваемым принятым альтернативным чтением и параллелизмом. Сноска уточнена так, чтобы не стирать различие между отрицательным чтением консонантного текста и альтернативным пониманием, поддержанным древней переводческой традицией.
