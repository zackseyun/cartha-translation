  text: וְ/עַתָּ֣ה אָמַ֣ר יְהוָ֗ה יֹצְרִ֤/י מִ/בֶּ֨טֶן֙ לְ/עֶ֣בֶד ל֔/וֹ לְ/שׁוֹבֵ֤ב יַֽעֲקֹב֙ אֵלָ֔י/ו וְ/יִשְׂרָאֵ֖ל לא יֵאָסֵ֑ף וְ/אֶכָּבֵד֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֵ/אלֹהַ֖/י הָיָ֥ה עֻזִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/005.yaml
  text: And now Yahweh says—he who formed me from the womb to be his servant, to bring Jacob back to him, and that Israel might be gathered to him[a]—yet I am honored in the eyes of Yahweh, and my God has become my strength.
translation:
  language: ru
  text: И теперь говорит Яхве, создавший меня от утробы, чтобы я был Его слугой, возвратил к Нему Иакова и собрал к Нему Израиль[a]. Я почтён в глазах Яхве, и мой Бог стал моей силой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский консонантный текст гласит: «а Израиль не будет собран» или «хотя Израиль не собран». Многие древние переводы и толкователи понимали здесь: «и Израиль будет собран к Нему», что соответствует параллельной строке о возвращении Иакова к Нему.'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом; соответствует форме, общепринятой в современной русской библеистике.
- source_word: יֹצְרִי מִבֶּטֶן
  choice: создавший меня от утробы
  rationale: Глагол יצר обозначает намеренное формирование, а оборот מִבֶּטֶן указывает на призвание ещё от материнской утробы. Краткая русская формулировка сохраняет образ оригинала.
- source_word: לְעֶבֶד לוֹ
  choice: чтобы я был Его слугой
  rationale: עבד здесь описывает служение и призвание персонажа; «слуга» естественнее в данном контексте, чем социально окрашенное «раб».
- source_word: לְשׁוֹבֵב יַעֲקֹב אֵלָיו
  choice: возвратил к Нему Иакова
  rationale: Причинное значение формы передаёт действие, побуждающее Иакова вернуться к Богу. «Возвратить» сохраняет направление движения и звучит естественно и достойно.
- source_word: וְיִשְׂרָאֵל לא יֵאָסֵף
  choice: и собрал для Него Израиль[a]
  rationale: Основной текст следует древнему пониманию לא как לוֹ, которое создаёт параллель с возвращением Иакова. Консонантное чтение с отрицанием сохранено в примечании.
- source_word: וְאֶכָּבֵד בְּעֵינֵי יְהוָה
  choice: Я почтён в глазах Яхве
  rationale: Нифаль глагола כבד выражает состояние почёта или славы. Настоящее время соответствует контекстуальной оценке слуги Богом без добавления контраста, не выраженного явно при принятом основном чтении.
- source_word: וֵאלֹהַי הָיָה עֻזִּי
  choice: и мой Бог стал моей силой
  rationale: Сохраняет глагольность היה и прямое значение עֹז — «сила», не превращая образ в более узкое «крепость» или «оплот».
theological_decisions:
- issue: Чтение וְיִשְׂרָאֵל לא יֵאָסֵף
  choice: «и собрал для Него Израиль» в основном тексте
  alternative: «а Израиль не собран» или «хотя Израиль не собран»
  rationale: Масоретская вокализация понимает לא как отрицание «не», однако чтение לוֹ — «Ему, для Него» — поддерживается параллелизмом с возвращением Иакова и древней переводческой традицией. Значимая текстовая и богословская напряжённость не скрывается, а отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Синтаксис несколько упрощён относительно длинной еврейской конструкции, но её смысловые связи сохранены. Местоимения, относящиеся к Богу, написаны с прописной буквы как редакционная норма данного проекта.
