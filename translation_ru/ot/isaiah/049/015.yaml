id: ISA.49.15
reference: Isaiah 49:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֲ/תִשְׁכַּ֤ח אִשָּׁה֙ עוּלָ֔/הּ מֵ/רַחֵ֖ם בֶּן בִּטְנָ֑/הּ גַּם אֵ֣לֶּה תִשְׁכַּ֔חְנָה וְ/אָנֹכִ֖י לֹ֥א אֶשְׁכָּחֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/015.yaml
  text: Can a woman forget her nursing child[a], and have no compassion on the son of her womb? Even these may forget, yet I will not forget you.
translation:
  language: ru
  text: Может ли женщина забыть своё грудное дитя[a], не пожалеть сына своего чрева? Даже они могут забыть, но Я тебя не забуду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «младенца, которого она кормит грудью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִשְׁכַּח
  choice: Может ли… забыть
  rationale: Вопросительная частица с имперфектом вводит риторический вопрос о почти немыслимой возможности; русская конструкция естественно передаёт эту силу.
- source_word: אִשָּׁה
  choice: женщина
  rationale: В еврейском тексте стоит «женщина», а не отдельное слово «мать»; материнский смысл раскрывается последующими образами.
- source_word: עוּלָהּ
  choice: своё грудное дитя
  rationale: Существительное обозначает младенца, которого кормят грудью. «Грудное дитя» ясно и сохраняет образ полной зависимости ребёнка от матери.
- source_word: מֵרַחֵם
  choice: не пожалеть
  rationale: Глагол רחם выражает жалость и сострадание; в связи с первым вопросом краткая русская форма естественно передаёт отсутствие материнского сострадания.
- source_word: בֶּן בִּטְנָהּ
  choice: сына своего чрева
  rationale: Сохраняются явно употреблённое בן («сын») и выразительный телесный образ בטן («чрево, утроба»).
- source_word: גַּם אֵלֶּה
  choice: Даже они
  rationale: Фраза с усилительным גם и указательным אֵלֶּה отсылает к только что названным женщинам; местоимение звучит по-русски естественнее буквального «даже эти».
- source_word: תִשְׁכַּחְנָה
  choice: могут забыть
  rationale: Имперфект в уступительном контексте выражает возможность, а не утверждение, что матери непременно забывают.
- source_word: וְאָנֹכִי
  choice: но Я
  rationale: Эмфатическое אָנֹכִי создаёт резкий контраст; «но» естественно выражает его, а прописная буква обозначает говорящего Бога по принятой русской библейской норме.
- source_word: לֹא אֶשְׁכָּחֵךְ
  choice: тебя не забуду
  rationale: Прямое отрицание передаёт безусловное Божье заверение; порядок слов подчёркивает адресата-женщину, Сион.
theological_decisions:
- issue: Родовое обозначение в בֶּן בִּטְנָהּ
  choice: сына своего чрева
  alternative: ребёнка своей утробы
  rationale: Еврейский текст прямо употребляет בן («сын»), поэтому мужской термин сохранён, не превращая образ в гендерно нейтральный.
- issue: Сила риторического сопоставления
  choice: Даже они могут забыть, но Я тебя не забуду
  alternative: Даже если они забудут, Я тебя не забуду
  rationale: Выбранная формулировка сохраняет уступительную возможность человеческой неверности и подчёркнутый контраст с Божьей верностью, не утверждая, что материнское забвение неизбежно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Грудное дитя» сохраняет поэтический образ без архаичного «сосущий младенец»; «чрево» оставлено как понятный высокий библейский термин. Адресат в еврейском тексте — Сион, грамматически женского рода, поэтому «тебя» не маркирует род отдельно.
