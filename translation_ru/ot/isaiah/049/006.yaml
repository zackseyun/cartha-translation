source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר נָקֵ֨ל מִֽ/הְיוֹתְ/ךָ֥ לִ/י֙ עֶ֔בֶד לְ/הָקִים֙ אֶת שִׁבְטֵ֣י יַעֲקֹ֔ב ו/נצירי יִשְׂרָאֵ֖ל לְ/הָשִׁ֑יב וּ/נְתַתִּ֨י/ךָ֙ לְ/א֣וֹר גּוֹיִ֔ם לִֽ/הְי֥וֹת יְשׁוּעָתִ֖/י עַד קְצֵ֥ה הָ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/006.yaml
  text: And he said[a], “It is too small a thing for you to be my servant to raise up the tribes of Jacob and to bring back the preserved ones of Israel; I will also make you a light for the nations[c][b], to be my salvation to the end of the earth.”
translation:
  language: ru
  text: 'И Он сказал: «Мало того, что ты будешь Моим слугой, чтобы восстановить колена Иакова и возвратить сохранившихся из Израиля[a]. Я также сделаю тебя светом для народов[b], чтобы ты стал Моим спасением до края земли[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уцелевших из Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «светом народам»; слово также можно перевести как «язычникам».'
    reason: lexical_alternative
  - marker: c
    text: 'Или, по обычному русскому выражению: «до краёв земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: Мало того
  rationale: В данном обороте прилагательное выражает недостаточность или незначительность одной лишь миссии к Израилю; русское «мало того» естественно передаёт расширение поручения, не обесценивая его первую часть.
- source_word: עֶבֶד
  choice: слуга
  rationale: В песнях о Слуге слово обозначает призванного Богом исполнителя Его воли; «слуга» сохраняет почётно-служебный смысл и не привносит акцент на рабском статусе.
- source_word: לְהָקִים
  choice: восстановить
  rationale: Порода hифиль глагола קום здесь означает вновь поставить на ноги, восстановить. Такой перевод яснее по-русски в сочетании с коленами Иакова.
- source_word: שִׁבְטֵי יַעֲקֹב
  choice: колена Иакова
  rationale: Сохраняется прямое обозначение Иакова и традиционно понятное библейское название племенных подразделений — «колена».
- source_word: נְצִירֵי יִשְׂרָאֵל
  choice: сохранившихся из Израиля
  rationale: Форма от נצר указывает на тех, кто был сохранён или убережён. Формулировка сохраняет эту смысловую связь и не сводит её однозначно к выжившим после бедствия.
- source_word: לְהָשִׁיב
  choice: возвратить
  rationale: Hифиль שוב буквально выражает побуждение или содействие возвращению; «возвратить» сохраняет как пространственный, так и восстановительный оттенок.
- source_word: וּנְתַתִּיךָ
  choice: Я также сделаю тебя
  rationale: Буквально «дам тебя», но конструкция означает назначение в качестве света. «Также» естественно показывает расширение миссии от Израиля к народам.
- source_word: לְאוֹר גּוֹיִם
  choice: светом для народов
  rationale: «Народы» передаёт универсальный горизонт גּוֹיִם без преждевременного сужения до этнорелигиозного термина «язычники»; «для» естественно в русской предикативной конструкции.
- source_word: יְשׁוּעָתִי
  choice: Моё спасение
  rationale: «Спасение» сохраняет широкий смысл Божьего избавляющего действия и соответствует богословской лексике Исаии.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: достигло края земли
  rationale: Еврейский текст употребляет единственное число «край/предел земли». Добавление нейтрального глагола «достигло» создаёт естественную русскую конструкцию при целевом לִהְיוֹת, не меняя масштаба высказывания.
theological_decisions:
- issue: Личность и масштаб миссии слуги
  choice: 'Сохранена двойная направленность поручения: восстановление Израиля и распространение Божьего спасения среди народов.'
  alternative: Явно определить слугу либо исключительно как коллективный Израиль, либо исключительно как Мессию.
  rationale: Сам стих не разрешает окончательно вопрос о личности слуги, но прямо описывает его служение Иакову/Израилю и народам. Перевод не вносит в текст более узкого толкования.
- issue: Значение גּוֹיִם
  choice: народы
  alternative: язычники
  rationale: В контексте слово охватывает народы вне Израиля. «Народы» лучше сохраняет всемирный горизонт пророчества и не усиливает конфессионально окрашенное противопоставление.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис сделан ясным для чтения вслух; сохранены образ света, названия Иаков и Израиль и единственное число «края земли».
