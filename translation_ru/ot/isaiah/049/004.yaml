  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/אֲנִ֤י אָמַ֨רְתִּי֙ לְ/רִ֣יק יָגַ֔עְתִּי לְ/תֹ֥הוּ וְ/הֶ֖בֶל כֹּחִ֣/י כִלֵּ֑יתִי אָכֵן֙ מִשְׁפָּטִ֣/י אֶת יְהוָ֔ה וּ/פְעֻלָּתִ֖/י אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/004.yaml
  text: But I said[a], “I have labored in vain; I have spent my strength for emptiness and vanity. Yet surely my justice is with Yahweh[b], and my reward is with my God.”
translation:
  language: ru
  text: 'А я сказал: «Напрасно я трудился, на пустоту и тщету истратил свою силу. Но всё же моё правое дело[a] — у Яхве, и моё воздаяние[b] — у моего Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моё право», «мой суд» или «моё оправдание».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «моя награда» или «моя плата».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרִיק
  choice: напрасно
  rationale: Передаёт отсутствие видимого результата и естественно сочетается в русском языке с глаголом «трудился».
- source_word: יָגַעְתִּי
  choice: я трудился
  rationale: Глагол обозначает тяжёлый, изнурительный труд; «трудился» сохраняет смысл усилия без архаического оттенка.
- source_word: לְתֹהוּ וְהֶבֶל
  choice: на пустоту и тщету
  rationale: 'Два разных существительных сохраняют еврейскую парность: תֹהוּ указывает на пустоту и безрезультатность, а הֶבֶל — на мимолётность и тщетность.'
- source_word: כֹּחִי כִלֵּיתִי
  choice: истратил свою силу
  rationale: Порода пиэль глагола כלה здесь выражает исчерпание или полное расходование; формулировка естественна по-русски.
- source_word: אָכֵן
  choice: но всё же
  rationale: Передаёт решительный поворот от жалобы к уверенности, сочетая противительный и утвердительный оттенки.
- source_word: מִשְׁפָּטִי
  choice: моё правое дело
  rationale: В данном контексте מִשְׁפָּט обозначает принадлежащее говорящему право или дело, которое он вверяет Богу. Выражение сохраняет судебный оттенок и звучит естественнее, чем буквальное «моя справедливость».
- source_word: אֶת יְהוָה
  choice: у Яхве
  rationale: אֵת выражает нахождение дела у Яхве, в его ведении или хранении, без добавления явно не выраженной направленности.
- source_word: וּפְעֻלָּתִי
  choice: и моё воздаяние
  rationale: פְעֻלָּה может означать труд, плату или награду за труд; в параллелизме здесь уместно «воздаяние», при сохранении иных возможностей в примечании.
- source_word: אֶת אֱלֹהָי
  choice: у моего Бога
  rationale: Сохраняет синтаксический параллелизм с «у Яхве» и мысль о том, что исход труда находится в Божьем ведении.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Смысл מִשְׁפָּטִי в речи Слуги
  choice: моё правое дело
  alternative: мой суд; моё оправдание; моё право
  rationale: Фраза может обозначать дело, право, судебное решение или оправдание. Основной текст сохраняет юридическую широту и не утверждает заранее, каким именно образом Бог подтвердит правоту говорящего.
- issue: Смысл פְעֻלָּתִי
  choice: моё воздаяние
  alternative: моя награда; моя плата; мой труд
  rationale: Контекст допускает как результат труда, так и плату за него. «Воздаяние» хорошо соответствует параллели с правым делом, но неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной речью. Повтор и параллелизм еврейского стиха сохранены; «пустота» и «тщета» не сведены к одному понятию. Тире перед «у Яхве» и «у моего Бога» естественно передаёт подразумеваемую связку.
