  - severity: low
    issue: Порядок и различение повелений в первой строке
    rationale: «Оглянись вокруг» в целом передаёт мысль, но объединяет «подними глаза» и «посмотри» в более свободную русскую конструкцию. «Подними глаза, посмотри вокруг» сохраняет оба глагола и остаётся литературно естественным.
  - severity: low
