  text: שְׂאִֽי סָבִ֤יב עֵינַ֨יִ/ךְ֙ וּ/רְאִ֔י כֻּלָּ֖/ם נִקְבְּצ֣וּ בָֽאוּ לָ֑/ךְ חַי אָ֣נִי נְאֻם יְהוָ֗ה כִּ֤י כֻלָּ/ם֙ כָּ/עֲדִ֣י תִלְבָּ֔שִׁי וּֽ/תְקַשְּׁרִ֖י/ם כַּ/כַּלָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/018.yaml
  text: 'Lift up your eyes all around and see: they all gather together; they come to you. As I live[a], declares Yahweh, you will surely put them all on like an ornament and bind them on like a bride.'
translation:
  language: ru
  text: 'Подними глаза, посмотри вокруг: все они собрались, пришли к тебе. Жив Я, — возвещает Яхве, — ты непременно наденешь их всех, как украшение[a], и закрепишь их на себе, как невеста.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как убранство»; еврейское слово обозначает украшение, наряд или драгоценности.'
    reason: Лексема עֲדִי допускает как единичное «украшение», так и собирательное обозначение убранства.
lexical_decisions:
- source_word: שְׂאִי סָבִיב עֵינַיִךְ וּרְאִי
  choice: Подними глаза и оглянись вокруг
  rationale: Два повеления женского рода обращены к олицетворённому Сиону. По-русски «оглянись вокруг» естественно передаёт призыв посмотреть во все стороны, не утрачивая образа поднятых глаз.
- source_word: כֻּלָּם נִקְבְּצוּ בָאוּ לָךְ
  choice: все они собрались, пришли к тебе
  rationale: Перфектные формы переданы прошедшим временем как уже представшая пророческому взору картина; краткая последовательность сохраняет поэтический ритм оригинала.
- source_word: חַי אָנִי
  choice: Жив Я
  rationale: Сохранена краткая и весомая форма божественной клятвы; более разъяснительное «клянусь Своей жизнью» излишне раскрывает формулу.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: «Возвещает» передаёт торжественную пророческую формулу, а личное имя יהוה транслитерировано как «Яхве».
- source_word: כִּי כֻלָּם כָּעֲדִי תִלְבָּשִׁי
  choice: ты непременно наденешь их всех, как украшение
  rationale: כִּי после клятвенной формулы имеет усилительное значение. Образ одежды сохранён глаголом «наденешь», а עֲדִי передано собирательным «украшение».
- source_word: וּתְקַשְּׁרִים כַּכַּלָּה
  choice: и обвяжешься ими, как невеста
  rationale: Переданы как значение связывания/прикрепления, так и местоименный суффикс множественного числа; форма «обвяжешься ими» естественно продолжает образ невесты, надевающей убранство.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно сохранено транслитерацией, а не заменено титулом.
- issue: Образ вернувшихся людей как убранства Сиона
  choice: 'Сохранена прямая метафора: Сион надевает их и обвязывается ими'
  alternative: Разъяснить метафору как указание на славу или радость Сиона
  rationale: Текст намеренно отождествляет собравшихся людей с невестинским украшением; толковательное раскрытие сузило бы образ.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Женский род сказуемых естественно поддерживает обращение к Сиону как к женщине; архаизмы, кроме уместной краткой клятвенной формулы «Жив Я», не используются.
