  to: 'Подними глаза, посмотри вокруг: все они собрались, пришли к тебе. Жив Я, — возвещает Яхве, — ты непременно наденешь их всех, как украшение[a], и закрепишь их на себе, как невеста.'
  rationale: Пересмотр ограничен безопасными стилистико-синтаксическими уточнениями. Два еврейских повеления отчётливо сохранены. Оборот «закрепишь их на себе» передаёт переходный характер וּתְקַשְּׁרִים и продолжает свадебный образ без доктринального истолкования. Маркер сноски перенесён к слову, которое она поясняет.
