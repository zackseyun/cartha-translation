base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/020.yaml
  text: Yet the children of your bereavement will still say in your hearing[a], ‘The place is too cramped for me[b]; make room for me so that I may dwell.’
translation:
  language: ru
  text: 'Ты ещё услышишь, как дети твоей утраты[a] скажут: «Мне здесь тесно! Дай мне место[b], чтобы я мог поселиться».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья твоей утраты»; «дети» передаёт собирательный смысл. Выражение связано с прежней утратой детей или бездетностью Сиона, но не уточняет точный характер связи этих детей с этой утратой.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол обычно означает «подойди» или «приблизься». Здесь, в речи о тесноте, он, вероятно, выражает просьбу освободить или дать место.
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֚וֹד
  choice: ещё
  rationale: 'Передаёт продолжение и добавление: Сион ещё услышит эти слова на фоне обещанного умножения его жителей.'
- source_word: יֹאמְר֣וּ בְ/אָזְנַ֔יִ/ךְ
  choice: ты ещё услышишь, как … скажут
  rationale: Еврейское выражение буквально означает «скажут в твои уши». Русская конструкция естественно передаёт прямое, слышимое Сионом обращение, сохраняя будущее значение имперфекта.
- source_word: בְּנֵ֖י שִׁכֻּלָ֑יִ/ךְ
  choice: дети твоей утраты
  rationale: 'Сохраняет парадоксальный образ исходного текста: дети связаны с пережитой Сионом потерей детей. «Дети» естественно передаёт собирательное בני, не ограничивая речь сыновьями мужского пола.'
- source_word: צַר לִ֥/י הַ/מָּק֖וֹם
  choice: мне здесь тесно
  rationale: Краткая современная русская формулировка передаёт пространственную тесноту и переполненность; «здесь» естественно выражает значение определённого «места» в данном контексте.
- source_word: גְּשָׁ/ה לִּ֥/י
  choice: потеснись ради меня
  rationale: Форма повелительного наклонения обращена к олицетворённому Сиону. Хотя глагол обычно значит «приблизиться», в контексте нехватки места просьба означает подвинуться и освободить пространство; сноска сохраняет буквальную возможность.
- source_word: וְ/אֵשֵֽׁבָה
  choice: чтобы я мог поселиться
  rationale: 'ישׁב здесь означает обосноваться или жить, а не просто сидеть. Целевая конструкция передаёт волитивную последовательность просьбы: уступи место, чтобы говорящий мог там жить.'
theological_decisions:
- issue: Кого обозначают «дети утраты»
  choice: Сохранён образ связи новых или возвращённых детей Сиона с его прежней утратой без дальнейшего уточнения.
  alternative: «Дети, родившиеся после твоей утраты» или «дети, которых ты считала потерянными».
  rationale: Еврейская конструкция допускает контекстуальные толкования, но прямо не уточняет ни времени рождения детей, ни того, что они прежде считались погибшими. Перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: 'Современный литературный русский язык с обращением к олицетворённому Сиону на «ты». Реплика сохраняет единственное число исходного текста: каждый из множества детей словно говорит от своего имени. Восклицание после «тесно» подчёркивает живую речь, не добавляя нового содержания.'
