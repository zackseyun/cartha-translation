source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה בְּ/עֵ֤ת רָצוֹן֙ עֲנִיתִ֔י/ךָ וּ/בְ/י֥וֹם יְשׁוּעָ֖ה עֲזַרְתִּ֑י/ךָ וְ/אֶצָּרְ/ךָ֗ וְ/אֶתֶּנְ/ךָ֙ לִ/בְרִ֣ית עָ֔ם לְ/הָקִ֣ים אֶ֔רֶץ לְ/הַנְחִ֖יל נְחָל֥וֹת שֹׁמֵמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/008.yaml
  text: 'Thus says Yahweh: “In a time of favor I answered you[a], and in a day of salvation I helped you; I will keep you and give you as a covenant for the people, to raise up the land[e][d][c][b], to apportion the desolate inheritances,”'
translation:
  language: ru
  text: 'Так говорит Яхве: «Во время благоволения[a] Я ответил тебе, и в день спасения[b] помог тебе. Я сохраню тебя[c] и дам тебя как завет для народа[d], чтобы восстановить землю[e] и передать в наследие опустошённые владения».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в благоприятное время»; также возможно: «во время принятия».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в день избавления».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «буду оберегать тебя».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «дам тебя народу как завет».'
    reason: lexical_alternative
  - marker: e
    text: 'Или: «утвердить землю» или «поднять землю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, не заменяя его титулом.
- source_word: בְּעֵת רָצוֹן
  choice: Во время благоволения
  rationale: רָצוֹן выражает благоволение, принятие или расположение; формулировка сохраняет идею назначенного Богом благоприятного времени.
- source_word: עֲנִיתִיךָ
  choice: Я ответил тебе
  rationale: Прямо передаёт обычное значение ענה; благоприятный характер ответа уже выражен ближайшим контекстом.
- source_word: בְיוֹם יְשׁוּעָה
  choice: в день спасения
  rationale: יְשׁוּעָה охватывает как конкретное избавление, так и более широкое спасение; русский язык естественно употребляет здесь определённую форму без артикля.
- source_word: עֲזַרְתִּיךָ
  choice: помог тебе
  rationale: Прямой и естественный современный эквивалент глагола עזר.
- source_word: וְאֶצָּרְךָ
  choice: Я сохраню тебя
  rationale: נצר может означать хранить, оберегать или сохранять; «сохраню» сочетает защиту с идеей удержания невредимым.
- source_word: וְאֶתֶּנְךָ לִבְרִית עָם
  choice: дам тебя как завет для народа
  rationale: 'Сохраняет необычную и богословски насыщенную конструкцию: адресат сам даётся как завет, а не только как его посредник.'
- source_word: לְהָקִים אֶרֶץ
  choice: чтобы восстановить землю
  rationale: Каузатив קום допускает значения «поднять», «утвердить» и в данном контексте «восстановить»; последнее естественно связывается с последующим упоминанием опустошённых владений.
- source_word: לְהַנְחִיל נְחָלוֹת שֹׁמֵמוֹת
  choice: передать в наследие опустошённые владения
  rationale: Hiphil נחל означает дать или передать в наследие; נְחָלוֹת здесь обозначает наследственные участки либо владения, лежащие опустошёнными.
theological_decisions:
- issue: Роль адресата как «завета для народа»
  choice: Сохранить буквальную формулировку «дам тебя как завет для народа».
  alternative: «Дам тебя народу как посредника завета» или «через тебя заключу завет с народом».
  rationale: Еврейский текст представляет самого адресата как завет в его роли или воплощении; поясняющие варианты преждевременно снимают богословское напряжение.
- issue: Смысл יְשׁוּעָה
  choice: «спасение» в основном тексте.
  alternative: «избавление».
  rationale: «Спасение» сохраняет как смысл конкретного избавления, так и более широкое искупительное звучание; лексическая альтернатива отмечена в сноске.
- issue: Референт עָם
  choice: «народ» без добавленного определения.
  alternative: «Мой народ», «народ Израиля» или «народы».
  rationale: Контекст может указывать на народ завета, но само выражение не содержит притяжательного определения и стоит в единственном числе; перевод не уточняет референт сверх текста.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Сохранено прямое обращение к Рабу в единственном числе и образное выражение «как завет для народа». «Восстановить землю» выбрано как естественное контекстуальное выражение, а более формальные варианты вынесены в сноску.
