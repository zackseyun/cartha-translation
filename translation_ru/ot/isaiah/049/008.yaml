  source_fidelity: 'Перевод точно передаёт основные синтаксические и смысловые элементы еврейского текста: благоприятное время и день спасения, совершённые действия «ответил» и «помог», последующие обещания сохранить и дать адресата «как завет для народа», а также цели восстановления земли и наделения опустошёнными наследственными владениями. «Восстановить землю» — обоснованное контекстуальное раскрытие לְהָקִים אֶרֶץ, не выходящее за пределы его значения.'
