  text: לֵ/אמֹ֤ר לַֽ/אֲסוּרִים֙ צֵ֔אוּ לַ/אֲשֶׁ֥ר בַּ/חֹ֖שֶׁךְ הִגָּל֑וּ עַל דְּרָכִ֣ים יִרְע֔וּ וּ/בְ/כָל שְׁפָיִ֖ים מַרְעִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/009.yaml
  text: saying to the prisoners[a], “Come out,” to those in darkness, “Show yourselves.” They will graze along the roads[b], and on all the bare heights will be their pasture.
translation:
  language: ru
  text: 'сказать узникам: «Выходите!» — и тем, кто во тьме: «Покажитесь!» Они будут пастись вдоль дорог, и все голые высоты[a] станут их пастбищем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открытые высоты»; речь идёт о безлесных, открытых возвышенностях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: сказать
  rationale: Инфинитив от אמר продолжает синтаксис предыдущего стиха и вводит содержание поручения; русский инфинитив естественно сохраняет эту связь.
- source_word: לַאֲסוּרִים
  choice: узникам
  rationale: Страдательное причастие от אסר обозначает связанных или заключённых; «узники» передаёт образ плена, не уточняя его исторический либо духовный характер.
- source_word: צֵאוּ
  choice: Выходите!
  rationale: Повелительная форма множественного числа от יצא; «выходите» — прямой и естественный призыв покинуть место заключения.
- source_word: לַאֲשֶׁר בַּחֹשֶׁךְ
  choice: тем, кто во тьме
  rationale: Формулировка сохраняет как конкретный образ пребывания в темноте, так и возможный переносный смысл.
- source_word: הִגָּלוּ
  choice: Покажитесь!
  rationale: Нифаль, повелительное множественного числа от גלה, здесь означает стать видимыми, появиться из укрытия; «покажитесь» естественно сочетается с образом тьмы.
- source_word: עַל דְּרָכִים
  choice: вдоль дорог
  rationale: Предлог על с «дорогами» указывает на место выпаса; «вдоль дорог» передаёт распределённое движение и кормление по пути.
- source_word: יִרְעוּ
  choice: будут пастись
  rationale: Форма от רעה сохраняет пастушеский образ народа как стада, не заменяя его более общим «будут питаться».
- source_word: שְׁפָיִם
  choice: голые высоты
  rationale: Слово обозначает открытые, лишённые растительности возвышенности; выбор избегает возможных культовых ассоциаций выражения «высокие места».
- source_word: מַרְעִיתָם
  choice: станут их пастбищем
  rationale: Существительное с суффиксом 3-го лица множественного числа означает их место выпаса; перестройка с «станут» даёт естественную русскую фразу при сохранении смысла.
theological_decisions:
- issue: Буквальный или переносный смысл узничества и тьмы
  choice: Сохранены конкретные образы «узников» и «тьмы» без пояснения их референта.
  alternative: Явно истолковать их как изгнанников, возвращающихся из плена, либо как людей, получающих духовное освобождение.
  rationale: Еврейский текст допускает исторический и более широкий спасительный смысл; перевод не должен сужать эту многозначность.
- issue: Пасторальный образ освобождённого народа
  choice: Сохранено «будут пастись».
  alternative: 'Передать нейтрально: «будут находить пищу».'
  rationale: Образ стада и пастбища является частью поэтики текста и не нуждается в разъясняющей деметафоризации.
translation_notes:
  register: Современный литературный русский язык, сжатый пророческий стиль. Прямая речь оформлена энергичными повелительными формами. Слово «узники» звучит dignified и общепонятно; образность тьмы, выпаса и высот сохранена.
