id: ISA.49.25
reference: Isaiah 49:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה גַּם שְׁבִ֤י גִבּוֹר֙ יֻקָּ֔ח וּ/מַלְק֥וֹחַ עָרִ֖יץ יִמָּלֵ֑ט וְ/אֶת יְרִיבֵ/ךְ֙ אָנֹכִ֣י אָרִ֔יב וְ/אֶת בָּנַ֖יִ/ךְ אָנֹכִ֥י אוֹשִֽׁיעַ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/025.yaml
  text: 'For thus says Yahweh: Even the captives of the mighty will be taken away[a], and the prey of the ruthless will escape; and I myself will contend with the one who contends with you[b], and I myself will save your children.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве: «Даже пленники сильного будут отняты, и добыча жестокого спасётся[a], и Я Сам вступлю в спор с тем, кто спорит с тобой, и Я Сам спасу твоих детей[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ускользнёт»; возможно также: «пленные жестокого спасутся».'
    reason: Форма יִמָּלֵט допускает оттенки избавления и бегства, а параллельные выражения שְׁבִי и מַלְקוֹחַ могут оба относиться к пленным людям.
  - marker: b
    text: 'Буквально: «твоих сыновей».'
    reason: בָּנַיִךְ — форма мужского рода множественного числа, хотя в контексте она может собирательно обозначать детей или потомков Сиона.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: שְׁבִי גִבּוֹר
  choice: пленники сильного
  rationale: שְׁבִי понято конкретно и собирательно — как находящиеся в плену люди; גִבּוֹר обозначает могущественного захватчика без обязательного уточнения военного статуса.
- source_word: יֻקָּח
  choice: будут отняты
  rationale: Пассивная форма לקח здесь указывает на изъятие пленников из власти захватчика; «отняты» естественно выражает эту перемену обладания.
- source_word: מַלְקוֹחַ עָרִיץ
  choice: добыча жестокого
  rationale: מַלְקוֹחַ сохраняет образ захваченной добычи, а עָרִיץ характеризует насильственного и безжалостного угнетателя.
- source_word: יִמָּלֵט
  choice: спасётся
  rationale: Нифаль от מלט допускает значения избавления и бегства; в параллелизме речь прежде всего о высвобождении добычи, поэтому выбрано «спасётся», а вариант «ускользнёт» отмечен в сноске.
- source_word: וְאֶת יְרִיבֵךְ אָנֹכִי אָרִיב
  choice: Я Сам вступлю в спор с тем, кто спорит с тобой
  rationale: Сохранён повтор корня ריב и его намеренная неоднозначность между судебной тяжбой и деятельным противоборством; אָנֹכִי передано эмфатически как «Я Сам».
- source_word: בָּנַיִךְ
  choice: твоих детей
  rationale: При обращении к Сиону форма мужского рода множественного числа может собирательно обозначать его потомков; буквальное «сыновей» сохранено в сноске.
- source_word: אוֹשִׁיעַ
  choice: спасу
  rationale: Прямо передаёт каузативное значение ישׁע и сохраняет богословскую выразительность Божьего спасения.
theological_decisions:
- issue: Объём значения בָּנַיִךְ при обращении к Сиону
  choice: твоих детей
  alternative: твоих сыновей
  rationale: Адресат обозначен формой женского рода единственного числа — это Сион/Иерусалим; существительное может собирательно охватывать его потомков. Более буквальная передача дана в сноске, чтобы не скрывать грамматическую форму.
- issue: Характер Божьего действия, выраженного корнем ריב
  choice: вступлю в спор
  alternative: буду бороться; поведу тяжбу
  rationale: Выбранная формулировка не сводит образ исключительно к суду или к вооружённой борьбе и сохраняет напряжение исходного выражения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Повтор «Я Сам» сохранён ради эмфазы оригинала; повтор корня ריב по возможности воспроизведён словами «спор… спорит». Кавычки обозначают прямую речь Яхве.
