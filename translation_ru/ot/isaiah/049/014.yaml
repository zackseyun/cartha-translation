  yaml_path: translation/ot/isaiah/049/014.yaml
  text: But Zion said, “The LORD has forsaken me; my Lord has forgotten me.”
translation:
  language: ru
  text: 'Но Сион сказал: «Господь оставил меня, мой Господь забыл меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִיּוֹן
  choice: Сион
  rationale: Традиционное и общепонятное русское соответствие; здесь Сион олицетворён и говорит от первого лица.
- source_word: עֲזָבַנִי
  choice: оставил меня
  rationale: Прямо передаёт значение глагола עזב и ощущение покинутости, выраженное Сионом.
- source_word: יְהוָה
  choice: Господь
  rationale: Передаёт тетраграмматон принятой в русской библейской традиции заменой без навязывания реконструированного произношения.
- source_word: וַאדֹנָי
  choice: мой Владыка
  rationale: Суффикс первого лица в אֲדֹנָי сохраняется явно; «Владыка» отличает это обращение от передачи имени יהוה как «Господь».
- source_word: שְׁכֵחָנִי
  choice: забыл меня
  rationale: Естественное и точное соответствие еврейскому глаголу שכח с объектным суффиксом первого лица.
theological_decisions:
- issue: Различение יהוה и אֲדֹנָי с суффиксом первого лица
  choice: «Господь … мой Владыка»
  alternative: «Господь … Господь» или «Яхве … мой Господь»
  rationale: Выбранный вариант сохраняет как различие двух еврейских обозначений, так и притяжательное «мой», не вводя спорного произношения тетраграмматона.
- issue: Характер высказывания Сиона
  choice: Сохранено как прямая жалоба без поясняющего смягчения
  alternative: Добавить указание, что это лишь субъективное чувство Сиона
  rationale: Стих передаёт напряжение жалобы, а ответ на неё следует далее; перевод не должен заранее разрешать это напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Союз «Но» передаёт противительный וַ в контексте. Параллелизм двух кратких утверждений сохранён.
