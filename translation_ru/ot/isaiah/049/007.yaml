base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/007.yaml
  text: 'Thus says Yahweh[a], the Redeemer of Israel, his Holy One, to one despised in soul, abhorred by the nation, a servant of rulers: Kings will see and rise up, princes also, and they will bow down, because of Yahweh, who is faithful, the Holy One of Israel[d][c][b], who has chosen you.'
translation:
  language: ru
  text: 'Так говорит Яхве[a], Искупитель Израиля, Святой Израиля: «Тому, кого глубоко презирают[b], кем гнушается народ, рабу властителей: цари увидят тебя и встанут, князья поклонятся[c], ибо Яхве верен — Святой Израиля, избравший тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное в еврейском тексте четырьмя согласными יהוה (ЙХВХ).
    reason: divine_name
  - marker: b
    text: 'Еврейское выражение сжато и допускает переводы: «тому, кого презирают всей душой», «тому, кого презирают люди» или «глубоко презираемому».'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте не названо прямо, перед кем поклонятся князья. По контексту это может быть жест почтения к избранному рабу, совершаемый вследствие верности Яхве; перевод сохраняет эту недосказанность.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: גֹּאֵל יִשְׂרָאֵל
  choice: Искупитель Израиля
  rationale: «Искупитель» сохраняет идею избавителя, имеющего право и обязанность вступиться за своего, и соответствует возвышенному языку Исайи.
- source_word: קְדוֹשׁוֹ
  choice: его Святой
  rationale: 'Суффикс 3-го лица ед. числа сохранён. По ближайшему синтаксическому построению местоимение относится к Израилю: Яхве назван его, то есть Израиля, Святым. Необычная форма не сглажена до повторного «Святой Израилев».'
- source_word: לִבְזֹה נֶפֶשׁ
  choice: тому, кого глубоко презирают
  rationale: Сжатое и трудное еврейское выражение передаётся естественно по-русски; נֶפֶשׁ здесь усиливает полноту презрения либо может обозначать людей как тех, кто презирает.
- source_word: לִמְתָעֵב גּוֹי
  choice: кем гнушается народ
  rationale: Сохраняет единственное число גּוֹי и направленность отвращения к адресату; «народ» может пониматься собирательно.
- source_word: לְעֶבֶד מֹשְׁלִים
  choice: рабу властителей
  rationale: «Раб» сохраняет выраженную в контексте униженность и подчинённость; מֹשְׁלִים передано общим словом «властители».
- source_word: מְלָכִים יִרְאוּ וָקָמוּ
  choice: цари увидят тебя и встанут
  rationale: Дополнение «тебя» ясно подразумевается обращением и делает русскую фразу полноценной; вставание передаёт жест почтения.
- source_word: שָׂרִים וְיִשְׁתַּחֲווּ
  choice: князья — и поклонятся
  rationale: «Князья» соответствует высокому регистру, а «поклонятся» передаёт жест глубокого почтения, не определяя его как богослужебное поклонение.
- source_word: לְמַעַן יְהוָה
  choice: ради Яхве
  rationale: Передаёт основание и конечную причину почтения; повтор «ради» перед приложением делает синтаксис ясным по-русски.
- source_word: אֲשֶׁר נֶאֱמָן
  choice: Который верен
  rationale: Сохраняет относительную конструкцию и смысл надёжности, верности Яхве.
- source_word: קְדֹשׁ יִשְׂרָאֵל
  choice: Святого Израилева
  rationale: Традиционная и узнаваемая русская форма характерного для Исайи божественного титула.
- source_word: וַיִּבְחָרֶךָּ
  choice: избравшего тебя
  rationale: Причастная форма естественно связывает заключение с предшествующими именованиями Яхве и передаёт совершённость избрания.
theological_decisions:
- issue: К кому относится «его Святой» (קְדוֹשׁוֹ)
  choice: 'К Израилю: Яхве — Святой Израиля.'
  alternative: 'К адресату-рабу: он назван «Святым» Яхве или Израиля.'
  rationale: 'Слова גֹּאֵל יִשְׂרָאֵל קְדוֹשׁוֹ естественно образуют ряд титулов говорящего: «Искупитель Израиля, его Святой». Ближайший возможный антецедент суффикса — Израиль; понимание выражения как титула адресата требует более трудной синтаксической связи через последующее לִ־.'
- issue: Объект поклонения князей
  choice: Не указан; перевод оставляет его невыраженным.
  alternative: Князья поклонятся адресату либо Яхве.
  rationale: У וְיִשְׁתַּחֲווּ нет явного дополнения. Контекст возвышения адресата допускает почтение перед ним, тогда как לְמַעַן יְהוָה называет Яхве основанием происходящего; перевод не превращает этот жест в однозначное богослужебное поклонение.
- issue: Характер избрания адресата
  choice: Передано без уточнения личности адресата и без конфессиональной интерпретации.
  alternative: Явно мессианское, коллективно-израильское или иное отождествление.
  rationale: В стихе сказано лишь, что Святой Израилев избрал обращённого; перевод сохраняет это утверждение без разрешения более широкого вопроса о личности раба.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены библейские титулы «Искупитель Израиля» и «Святой Израилев»; архаизмы сведены к узнаваемой титульной форме «Израилев». Прямая речь оформлена так, чтобы ясно отделить слова Яхве от вводной формулы.
