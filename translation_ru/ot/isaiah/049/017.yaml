  text: Your children hurry back[a]; those who tore you down and devastated you will depart from you.
translation:
  language: ru
  text: Твои дети спешат[a]; те, кто разрушал и опустошал тебя, уйдут от тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твои строители спешат». В некоторых древних текстовых свидетельствах отражено чтение «строители» вместо «дети».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִהֲרוּ
  choice: спешат вернуться
  rationale: Глагол מהר означает «спешить, торопиться». В контексте возвращения детей Сиона и ухода разорителей направление движения подразумевается; «спешат вернуться» естественно передаёт этот контраст, не превращая подразумеваемое в отдельное утверждение.
- source_word: בָּנָיִךְ
  choice: твои дети
  rationale: Масоретская огласовка указывает на «твои сыновья/дети». Поскольку обращение направлено к олицетворённому Сиону, «дети» естественно обозначает его жителей и не сужает выражение до лиц мужского пола. Древний вариант «строители» отмечен в сноске.
- source_word: מְהָרְסַיִךְ
  choice: те, кто разрушал тебя
  rationale: Причастие от הרס означает «разрушать, сносить». Относительная конструкция звучит по-русски естественно и сохраняет образ разрушенного города.
- source_word: וּמַחֲרִבַיִךְ
  choice: и опустошал тебя
  rationale: Форма от חרב в каузативном значении указывает на тех, кто приводит место в запустение. Однородное сказуемое «опустошал» передаёт тяжесть разорения и согласуется с конструкцией «те, кто».
- source_word: מִמֵּךְ
  choice: от тебя
  rationale: Сохранено прямое разделительное значение предлога מן с суффиксом второго лица женского рода.
- source_word: יֵצֵאוּ
  choice: уйдут
  rationale: Глагол יצא означает «выходить, уходить». При дополнении «от тебя» русское «уйдут» ясно и естественно выражает удаление разорителей от Сиона.
theological_decisions:
- issue: Вариантное понимание בָּנָיִךְ
  choice: твои дети
  alternative: твои строители
  rationale: Основной текст следует масоретской огласовке «твои дети», соответствующей теме возвращения потомков Сиона. Чтение «твои строители», отражённое некоторыми древними свидетелями и подходящее к контексту восстановления, сохранено в сноске, чтобы не устранять текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Женский род местоимений сохраняет обращение к олицетворённому Сиону. Параллелизм возвращающихся детей и уходящих разорителей передан компактно.
