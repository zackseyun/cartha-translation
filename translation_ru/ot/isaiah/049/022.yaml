  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה אֶשָּׂ֤א אֶל גּוֹיִם֙ יָדִ֔/י וְ/אֶל עַמִּ֖ים אָרִ֣ים נִסִּ֑/י וְ/הֵבִ֤יאוּ בָנַ֨יִ/ךְ֙ בְּ/חֹ֔צֶן וּ/בְנֹתַ֖יִ/ךְ עַל כָּתֵ֥ף תִּנָּשֶֽׂאנָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/022.yaml
  text: 'Thus says the Lord GOD: Behold[a], I will lift up my hand to the nations, and raise my banner to the peoples; and they will bring your sons in their bosom[b], and your daughters will be carried on the shoulder.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Вот, Я подниму руку к народам и воздвигну Моё знамя[a] для народов; они принесут твоих сыновей, прижав к груди[b], а твоих дочерей понесут на плече».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мой сигнальный знак»; еврейское слово может обозначать знамя, штандарт или поднятый для созыва знак.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в пазухе» — то есть прижав к телу, возможно в складке одежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сочетание передано с сохранением титула אֲדֹנָי и личного имени יהוה; «Владыка» позволяет избежать тяжеловесного повтора «Господь Яхве» и звучит достойно в современном русском.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественная русская частица, сохраняющая указательную функцию и торжественную силу пророческого объявления.
- source_word: אֶשָּׂא ... יָדִי
  choice: Я подниму руку
  rationale: Близко воспроизводит образ публичного жеста, которым подаётся знак или созываются люди, не уточняя сверх текста его точное значение.
- source_word: גּוֹיִם
  choice: народы
  rationale: Передаёт широкое значение народов или наций без позднейшего специального оттенка слова «язычники».
- source_word: אָרִים נִסִּי
  choice: воздвигну Моё знамя
  rationale: נֵס может означать знамя, штандарт или сигнальный знак; «знамя» ясно сохраняет видимый знак для созыва, а альтернативы отмечены в сноске.
- source_word: עַמִּים
  choice: племена
  rationale: Сохраняет лексическое варьирование параллельных גּוֹיִם и עַמִּים. Здесь «племена» обозначает сообщества людей и не навязывает резкого смыслового различия.
- source_word: וְהֵבִיאוּ
  choice: они принесут
  rationale: Простое будущее естественно передаёт пророческое обещание.
- source_word: בָנַיִךְ
  choice: твоих сыновей
  rationale: Сохраняет выраженную в еврейском тексте гендерную пару с последующим «дочерей».
- source_word: בְּחֹצֶן
  choice: у груди
  rationale: Передаёт ношение ребёнка вплотную к телу и остаётся ближе к буквальному образу груди или пазухи, чем обобщённое «на руках».
- source_word: בְנֹתַיִךְ
  choice: твоих дочерей
  rationale: Прямое и гендерно точное соответствие еврейскому множественному числу.
- source_word: עַל כָּתֵף תִּנָּשֶׂאנָה
  choice: понесут на плече
  rationale: 'Естественная русская активная конструкция с неопределённым человеческим субъектом передаёт пассивную форму: дочери будут несомы на плече. Единственное число «плече» сохранено вслед за еврейским.'
theological_decisions:
- issue: Передача Божьего имени в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Сохраняется личное заветное имя יהוה и одновременно титул אֲדֹנָי, без замены имени общим титулом и без внесения конфессионального толкования.
- issue: К кому относятся местоимения женского рода единственного числа «твоих»
  choice: Сохранено прямое обращение в женском роде без поясняющей вставки
  alternative: Добавить в текст «Сион»
  rationale: В контексте адресатом является олицетворённый Сион, но в самом стихе имя не повторено; перевод сохраняет эту контекстуальную связь и не делает подразумеваемое явным.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис сохранён компактным; обращение к олицетворённому Сиону передано формами женского рода. Заглавные буквы в местоимениях, относящихся к Богу, применены по принятой русской библейской издательской традиции.
