  text: הֵ֥ן עַל כַּפַּ֖יִם חַקֹּתִ֑י/ךְ חוֹמֹתַ֥יִ/ךְ נֶגְדִּ֖/י תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/016.yaml
  text: Look[a], I have engraved you on the palms of my hands; your walls are continually before me.
translation:
  language: ru
  text: Вот, Я начертал[a] тебя на ладонях Своих; твои стены всегда передо Мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «вырезал» (нанёс как надпись). Еврейский глагол обозначает вырезание или высекание и подчёркивает прочность начертания.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Указательно-восклицательная частица привлекает внимание и подчёркивает последующее утверждение; «вот» естественно и уместно в современном литературном русском.
- source_word: עַל כַּפַּיִם
  choice: на ладонях Своих
  rationale: Предлог עַל обозначает положение на поверхности, а двойственное כַּפַּיִם — ладони. Возвратное «Своих» естественно связывает ладони с говорящим и сохраняет конкретный телесный образ.
- source_word: חַקֹּתִיךְ
  choice: Я начертал тебя
  rationale: Глагол חקק означает вырезать, высекать или наносить надпись; «начертал» сохраняет образ нанесённой на ладони надписи и оттенок долговечности, не сводя метафору к простому воспоминанию. Суффикс второго лица женского рода передан местоимением «тебя» и относится к олицетворённому Сиону.
- source_word: חוֹמֹתַיִךְ
  choice: твои стены
  rationale: Передаёт форму множественного числа без добавления отсутствующего в тексте уточнения «городские»; контекст указывает на стены Сиона/Иерусалима.
- source_word: נֶגְדִּי
  choice: передо Мной
  rationale: Устойчиво передаёт нахождение перед взором или в присутствии говорящего; форма «передо Мной» естественна в данном сочетании.
- source_word: תָּמִיד
  choice: всегда
  rationale: 'Кратко и естественно выражает непрерывность: стены постоянно находятся перед Божьим взором.'
theological_decisions:
- issue: Антропоморфный образ Божьих ладоней и начертания
  choice: 'Метафора сохранена прямо: «Я начертал тебя на ладонях Своих».'
  alternative: 'Истолковывающий пересказ: «Я никогда не забываю тебя».'
  rationale: Еврейский текст использует яркий телесный образ, выражающий неизменную память и верность Бога Сиону. Пересказ передал бы лишь один смысловой вывод и устранил бы сам образ.
- issue: К кому относятся суффиксы женского рода второго лица
  choice: Сохранено обращение «тебя / твои», без вставки имени адресата.
  alternative: Добавить в текст «Сион» или «Иерусалим».
  rationale: Из контекста адресатом является олицетворённый Сион/Иерусалим, однако сам стих продолжает обращаться к нему местоименно. Такой перевод сохраняет грамматику и не вносит пояснение в основной текст.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Синтаксический параллелизм и конкретный образ исходного текста сохранены; местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
