  text: וְ/הַאֲכַלְתִּ֤י אֶת מוֹנַ֨יִ/ךְ֙ אֶת בְּשָׂרָ֔/ם וְ/כֶ/עָסִ֖יס דָּמָ֣/ם יִשְׁכָּר֑וּ/ן וְ/יָדְע֣וּ כָל בָּשָׂ֗ר כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/026.yaml
  text: I will make those who oppress you eat their own flesh[a], and they will become drunk with their own blood as with sweet wine. Then all flesh will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
translation:
  language: ru
  text: Я заставлю твоих притеснителей есть собственную плоть, и они упьются собственной кровью, как молодым вином.[a] Тогда всякая плоть узнает, что Я — Яхве, твой Спаситель и твой Искупитель, Могучий Иакова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как сладким вином»; еврейское слово עָסִיס может обозначать свежий виноградный сок или молодое сладкое вино.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַאֲכַלְתִּי
  choice: Я заставлю ... есть
  rationale: Каузативная порода гифиль глагола אכל выражает побуждение или принуждение к действию; эта формулировка естественно передаёт его силу.
- source_word: מוֹנַיִךְ
  choice: твоих притеснителей
  rationale: Слово обозначает тех, кто угнетает или жестоко притесняет Сион; существительное сохраняет краткость и прямоту оригинала.
- source_word: בְּשָׂרָם
  choice: собственную плоть
  rationale: Местоименный суффикс указывает на их плоть, а «собственную» ясно передаёт рефлексивный ужас образа.
- source_word: וְכֶעָסִיס
  choice: словно молодым вином
  rationale: עָסִיס обозначает свежий виноградный сок или молодое сладкое вино; в контексте опьянения «молодое вино» звучит естественно и сохраняет образ напитка.
- source_word: דָּמָם
  choice: собственной кровью
  rationale: Передаёт принадлежность крови самим притеснителям и поддерживает параллелизм с «собственной плотью».
- source_word: יִשְׁכָּרוּן
  choice: упьются
  rationale: Глагол означает опьянеть; «упьются» ёмко передаёт результат и хорошо сочетается с творительным падежом.
- source_word: כָל בָּשָׂר
  choice: всякая плоть
  rationale: Сохраняет буквальный пророческий оборот, его универсальный охват и межтекстовые связи, не сводя его просто к «всем людям».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: מוֹשִׁיעֵךְ
  choice: твой Спаситель
  rationale: Кратко и естественно выражает постоянную роль и личное отношение к Сиону.
- source_word: וְגֹאֲלֵךְ
  choice: твой Искупитель
  rationale: Сохраняет ключевое для Исаии значение корня גאל, не добавляя более узкое понятие родственника-искупителя.
- source_word: אֲבִיר יַעֲקֹב
  choice: Могучий Бог Иакова
  rationale: אֲבִיר выражает могущество; добавление «Бог» делает божественный титул естественным и однозначным по-русски, при этом «Иакова» точно следует еврейскому тексту.
theological_decisions:
- issue: Передача жестоких образов суда
  choice: Сохранить прямые образы поедания собственной плоти и опьянения собственной кровью
  alternative: Смягчить до общего образа самоуничтожения врагов
  rationale: Резкость образов намеренна и выражает обращение насилия угнетателей против них самих; смягчение ослабило бы пророческую риторику.
- issue: Передача כָל בָּשָׂר
  choice: всякая плоть
  alternative: все люди / всё человечество
  rationale: Буквальный оборот сохраняет пророческий регистр, универсальность и богословскую межтекстовую связь, не устраняя семитскую образность.
- issue: Передача титула אֲבִיר יַעֲקֹב
  choice: Могучий Бог Иакова
  alternative: Могучий Иакова / Сильный Иакова
  rationale: В контексте это божественный титул. Слово «Бог» подразумевается, но не представлено отдельной лексемой; его добавление по-русски предотвращает неясность и сохраняет смысл титула.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Сохранены резкие образы суда и выражение «всякая плоть». Обращение к Сиону передано формами женского рода в притяжательных конструкциях; местоимение «твой» согласуется с мужским родом именных сказуемых «Спаситель» и «Искупитель».
