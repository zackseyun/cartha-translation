id: ISA.49.13
reference: Isaiah 49:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: רָנּ֤וּ שָׁמַ֨יִם֙ וְ/גִ֣ילִי אָ֔רֶץ יפצחו הָרִ֖ים רִנָּ֑ה כִּֽי נִחַ֤ם יְהוָה֙ עַמּ֔/וֹ וַ/עֲנִיָּ֖/ו יְרַחֵֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/013.yaml
  text: Shout for joy[a], O heavens, and rejoice, O earth; let the mountains break out in singing[c][b], for Yahweh has comforted his people and will have compassion on his afflicted ones.
translation:
  language: ru
  text: Ликуйте[a], небеса, и радуйся, земля! Пусть горы разразятся радостным пением, ведь Яхве[c] утешил Свой народ и проявит сострадание к Своим угнетённым[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пойте от радости». Еврейский глагол может обозначать радостный возглас или ликующее пение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бедным» или «смиренным». Еврейское слово может обозначать угнетённых, бедных либо смиренных людей.'
    reason: lexical_alternative
  - marker: c
    text: «Яхве» — передача еврейского божественного имени יהוה (ЙХВХ), традиционно заменяемого словом «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: רָנּוּ
  choice: Ликуйте
  rationale: Повелительная форма множественного числа выражает громкое, радостное ликование. «Ликуйте» естественно передаёт и радость, и возвышенный поэтический тон; возможный акцент на пении отмечен в сноске.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: В космическом параллелизме с землёй и горами множественное «небеса» точнее и поэтичнее, чем «небо».
- source_word: וְגִילִי
  choice: и радуйся
  rationale: Повелительная форма женского рода обращена к земле. «Радуйся» — современное и естественное соответствие глаголу ликования.
- source_word: אָרֶץ
  choice: земля
  rationale: Параллель с небесами и горами указывает на землю как часть всего творения, а не на отдельную страну.
- source_word: יפצחו ... רִנָּה
  choice: Пусть ... разразятся радостным пением
  rationale: Сочетание передаёт поэтический призыв к внезапно и мощно начинающемуся радостному пению.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание для всеобщего ликования и естественно связывает части русского предложения.
- source_word: נִחַם
  choice: утешил
  rationale: В данном контексте глагол означает дарованное Богом утешение Его народу; совершенный вид сохраняет завершённость еврейской формы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: Возвратное притяжательное местоимение естественно в русском языке при подлежащем «Яхве», а «народ» сохраняет коллективный и заветный смысл.
- source_word: וַעֲנִיָּו
  choice: к Своим угнетённым
  rationale: Слово может обозначать бедных, смиренных или терпящих притеснение. «Угнетённым» сохраняет основную идею страдания, не сводя значение только к материальной бедности.
- source_word: יְרַחֵם
  choice: проявит сострадание
  rationale: Несовершенная форма здесь смотрит к действию Бога по отношению к страдающим; выражение непосредственно передаёт значение милосердного сострадания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом; традиционный вариант указан в сноске.
- issue: Временная соотнесённость נִחַם и יְרַחֵם
  choice: «утешил ... и проявит сострадание»
  alternative: «утешает ... и проявляет сострадание»
  rationale: Перевод сохраняет различие между перфектной формой первого глагола и имперфектной формой второго, не устраняя возможную напряжённость между совершившимся утешением и последующим проявлением сострадания.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Сохранены обращения к олицетворённым небесам, земле и горам, а также смена числа в соответствии с еврейским текстом. Восклицательный знак помогает передать призыв к космическому ликованию.
