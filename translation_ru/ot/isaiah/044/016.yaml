  text: חֶצְי/וֹ֙ שָׂרַ֣ף בְּמוֹ אֵ֔שׁ עַל חֶצְי/וֹ֙ בָּשָׂ֣ר יֹאכֵ֔ל יִצְלֶ֥ה צָלִ֖י וְ/יִשְׂבָּ֑ע אַף יָחֹם֙ וְ/יֹאמַ֣ר הֶאָ֔ח חַמּוֹתִ֖י רָאִ֥יתִי אֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/016.yaml
  text: 'Half of it he burns in the fire[a]; over the other half he eats meat: he roasts a roast and is satisfied. He also warms himself and says, “Aha! I am warm[c][b]; I have seen the fire.”'
translation:
  language: ru
  text: 'Половину он сжигает в огне; из другой половины готовит себе мясо: жарит жаркое[a] и насыщается. Ещё он греется и говорит: «Ага! Я согрелся, увидел огонь[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жарит жаркое» — в еврейском тексте употреблены однокоренные глагол и существительное; по смыслу возможно: «жарит мясо».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «увидел пламя». Еврейское слово может обозначать огонь, пламя или сияющий свет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶצְיוֹ
  choice: половину его / на другой половине
  rationale: Существительное с местоименным суффиксом указывает на половину того же куска дерева; во втором случае «другой» добавлено из явного противопоставления двух половин.
- source_word: שָׂרַף בְּמוֹ אֵשׁ
  choice: сжигает в огне
  rationale: Перфект входит в живое описание обычных действий мастера, поэтому передан настоящим временем; предложное сочетание естественно обозначает сжигание в огне.
- source_word: בָּשָׂר יֹאכֵל
  choice: ест мясо
  rationale: בָּשָׂר в контексте пищи означает мясо, а форма глагола прямо обозначает еду.
- source_word: יִצְלֶה צָלִי
  choice: жарит жаркое
  rationale: Сохранён родственный оборот «глагол + однокоренное существительное», заметный в еврейском тексте и усиливающий конкретность описания.
- source_word: וְיִשְׂבָּע
  choice: и насыщается
  rationale: Глагол обозначает достижение сытости после еды; «насыщается» передаёт результат без лишнего толкования.
- source_word: אַף יָחֹם
  choice: ещё он греется
  rationale: Частица добавляет новое применение дерева, а глагол в данном контексте естественно передаётся возвратным «греется».
- source_word: הֶאָח
  choice: Ах!
  rationale: Междометие выражает довольное восклицание; современное русское «Ах!» звучит естественно и не усиливает насмешку сверх текста.
- source_word: חַמּוֹתִי
  choice: я согрелся
  rationale: 'Перфект выражает достигнутый результат: человек уже стал тёплым благодаря огню.'
- source_word: רָאִיתִי אוּר
  choice: увидел огонь
  rationale: Сохранены обычное значение глагола «видеть» и многозначное אוּר; в основном тексте выбрано «огонь» по ближайшему контексту.
theological_decisions:
- issue: Передача сатиры над идолопоклонством без добавочного толкования
  choice: Прямо описать бытовое использование двух половин дерева и довольные слова человека
  alternative: Прямо упомянуть здесь изготовление идола или подчеркнуть нелепость поступка поясняющими словами
  rationale: Сатира ясна из более широкого контекста, но сам стих говорит о топливе, приготовлении пищи и обогреве. Перевод не добавляет отсутствующего в стихе богословского пояснения.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного, накопительного ритма сатирического описания. Необычный однокоренной оборот оставлен ради формы оригинала и пояснён в сноске.
