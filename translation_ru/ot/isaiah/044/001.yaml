base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/001.yaml
  text: But now hear[a], Jacob my servant, and Israel, whom I have chosen.
translation:
  language: ru
  text: Но теперь слушай, Иаков, Мой слуга, и Израиль, которого Я избрал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И теперь слушай, Иаков, Мой слуга, и Израиль, которого Я избрал».'
    reason: 'Лексико-дискурсивный вариант: начальный союз וְ может передаваться соединительным «и», а не противительным «но».'
lexical_decisions:
- source_word: וְעַתָּה
  choice: Но теперь
  rationale: Сочетание союза с наречием времени вводит контрастный переход от предшествующего обличения и суда к новому утешительному обращению; «Но теперь» естественно передаёт этот поворот по-русски.
- source_word: שְׁמַע
  choice: слушай
  rationale: Императив означает «слушай/услышь». «Слушай» в современном русском ясно выражает призыв внимать и не добавляет отсутствующего в еврейском тексте дополнения.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Традиционная русская форма библейского имени.
- source_word: עַבְדִּי
  choice: раб Мой
  rationale: В пророческом обращении это закреплённое и уместное обозначение заветной принадлежности и служения Израиля. Оно сохраняет более сильный оттенок принадлежности, чем современное «слуга».
- source_word: וְיִשְׂרָאֵל
  choice: и Израиль
  rationale: Союз сохраняет параллельное именование одного и того же народа как Иакова и Израиля.
- source_word: בָּחַרְתִּי בוֹ
  choice: которого Я избрал
  rationale: Предлог ב при בחר образует идиоматическую конструкцию со значением выбора лица. Русское относительное предложение естественно передаёт синтаксис, а прошедшее совершенного вида сохраняет завершённость избрания без излишнего истолкования его временного аспекта.
theological_decisions:
- issue: Обозначение Израиля עַבְדִּי
  choice: раб Мой
  alternative: слуга Мой
  rationale: Контекст говорит о заветной принадлежности и призвании Израиля служить Господу. «Раб Мой» сохраняет традиционный пророческий регистр и полноту отношения принадлежности, не сводя выражение только к бытовой услуге.
- issue: Значение начального וְ в וְעַתָּה
  choice: Но теперь
  alternative: И теперь; Теперь
  rationale: Контекстуальный переход от обличения к ободрению допускает и поддерживает противительное прочтение. Оно передаёт риторический поворот, не изменяя содержания обращения.
- issue: Соотношение имён Иаков и Израиль
  choice: параллельное обращение через союз «и»
  alternative: «то есть Израиль»
  rationale: Еврейский текст координирует два заветных имени, не вводя явного пояснительного оборота; поэтому перевод сохраняет формальную и богословскую напряжённость параллелизма.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повелительное «слушай» понятно современному читателю; формы «раб Мой» и «Я» написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
