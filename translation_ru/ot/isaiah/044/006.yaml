  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: формулу пророческой речи, титулы «Царь Израиля» и «его Искупитель», имя Яхве, титул יהוה צבאות, двукратное эмфатическое «Я», а также исключительное утверждение «кроме Меня нет Бога». Местоимение «его» корректно отсылает к Израилю, как в суффиксе גֹאֲלוֹ.'
