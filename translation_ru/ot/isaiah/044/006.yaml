  text: כֹּֽה אָמַ֨ר יְהוָ֧ה מֶֽלֶךְ יִשְׂרָאֵ֛ל וְ/גֹאֲל֖/וֹ יְהוָ֣ה צְבָא֑וֹת אֲנִ֤י רִאשׁוֹן֙ וַ/אֲנִ֣י אַחֲר֔וֹן וּ/מִ/בַּלְעָדַ֖/י אֵ֥ין אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/006.yaml
  text: 'Thus says Yahweh[a], the King of Israel and his Redeemer, Yahweh of Armies: I am the first, and I am the last[b]; apart from me there is no God.'
translation:
  language: ru
  text: 'Так говорит Яхве, Царь Израиля и его Искупитель, Яхве Воинств[a]: «Я — первый, и Я — последний; кроме Меня нет Бога[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве Сил»; традиционно: «Господь Саваоф».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кроме Меня нет бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Царь Израиля
  rationale: Прямо и естественно передаёт сочетание существительных и сохраняет торжественный титул.
- source_word: גֹאֲלוֹ
  choice: его Искупитель
  rationale: Сохраняет местоименную отсылку к Израилю и основное значение причастия от גאל; вариант «родственник-искупитель» здесь был бы чрезмерно конкретным.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Лексически прозрачно передаёт צְבָאוֹת как «воинства» и сохраняет традиционно возвышенную, но понятную форму божественного титула.
- source_word: אֲנִי רִאשׁוֹן וַאֲנִי אַחֲרוֹן
  choice: Я — первый, и Я — последний
  rationale: Повторение «Я» отражает два явно выраженных местоимения и сохраняет параллелизм и эмфазу оригинала.
- source_word: וּמִבַּלְעָדַי
  choice: кроме Меня
  rationale: Естественная современная русская передача исключительного значения выражения «помимо/кроме меня».
- source_word: אֵין אֱלֹהִים
  choice: нет Бога
  rationale: Передаёт абсолютное утверждение об отсутствии иного Бога; прописная буква отражает монтеистический смысл в русском письме, не изменяя лексического содержания.
theological_decisions:
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Яхве Сил; Господь Саваоф
  rationale: «Воинств» непосредственно передаёт צְבָאוֹת и не заменяет образ более интерпретирующим словом «Всемогущий»; имя יְהוָה сохраняется как «Яхве».
- issue: Смысл אֵין אֱלֹהִים
  choice: нет Бога
  alternative: нет бога
  rationale: Контекст представляет абсолютное исповедание уникальности Яхве. При этом сноска сохраняет формально возможное родовое написание со строчной буквы.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Синтаксический параллелизм оригинала сохранён; обращение Бога о Себе оформлено с традиционными прописными местоимениями. Все сноски отмечены в основном тексте.
