  text: מֵקִים֙ דְּבַ֣ר עַבְדּ֔/וֹ וַ/עֲצַ֥ת מַלְאָכָ֖י/ו יַשְׁלִ֑ים הָ/אֹמֵ֨ר לִ/ירוּשָׁלִַ֜ם תּוּשָׁ֗ב וּ/לְ/עָרֵ֤י יְהוּדָה֙ תִּבָּנֶ֔ינָה וְ/חָרְבוֹתֶ֖י/הָ אֲקוֹמֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/026.yaml
  text: who confirms the word of his servant and fulfills the counsel of his messengers[a], who says of Jerusalem, ‘She will be inhabited,’ and of the cities of Judah, ‘They will be rebuilt,’ and ‘I will raise up her ruins.’
translation:
  language: ru
  text: 'Который подтверждает слово Своего раба и исполняет замысел Своих посланников[a], Который говорит об Иерусалиме: «Он будет населён», — и о городах Иуды: «Они будут отстроены», — и: «Я восстановлю его развалины».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своих ангелов». Еврейское слово может обозначать как человеческих посланников, так и небесных ангелов; здесь, вероятно, имеются в виду пророческие вестники.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים
  choice: подтверждает
  rationale: Каузативная форма от קום со словом в качестве дополнения означает «даёт устоять», то есть подтверждает и осуществляет сказанное.
- source_word: דְּבַר עַבְדּוֹ
  choice: слово Своего раба
  rationale: Сохраняются единственное число עבד и формальная, уместная в пророческом контексте передача דבר как «слово».
- source_word: וַעֲצַת
  choice: и замысел
  rationale: עצה может обозначать совет, план или замысел; «замысел» естественно сочетается с глаголом «исполняет» и передаёт целенаправленность.
- source_word: מַלְאָכָיו
  choice: Своих посланников
  rationale: מלאך обозначает посланника и может относиться как к людям, так и к ангелам. Параллелизм со «слугой» и пророческий контекст делают «посланников» наиболее вероятным вариантом, а альтернативное значение сохранено в сноске.
- source_word: יַשְׁלִים
  choice: исполняет
  rationale: Каузативная форма от שלם означает доводить до завершения, осуществлять; по-русски «исполняет замысел» звучит естественно.
- source_word: הָאֹמֵר
  choice: Который говорит
  rationale: Субстантивированное причастие продолжает описание Бога и естественно передаётся относительной конструкцией.
- source_word: לִירוּשָׁלִַם
  choice: об Иерусалиме
  rationale: Предлог ל буквально может означать «к», однако здесь вводит высказывание о городе; русское «об Иерусалиме» ясно передаёт это отношение.
- source_word: תּוּשָׁב
  choice: Он будет населён
  rationale: Пассивная форма от ישב указывает, что в Иерусалиме снова будут жить. В русском языке название «Иерусалим» грамматически мужского рода, поэтому местоимение согласовано как «он».
- source_word: וּלְעָרֵי יְהוּדָה
  choice: и о городах Иуды
  rationale: Конструкция параллельна высказыванию об Иерусалиме; «о городах» естественно вводит относящееся к ним пророчество.
- source_word: תִּבָּנֶינָה
  choice: Они будут отстроены
  rationale: Nifal означает «будут построены»; в контексте восстановления разрушенных городов «отстроены» естественно выражает повторное строительство.
- source_word: וְחָרְבוֹתֶיהָ
  choice: его развалины
  rationale: חרבות — разрушенные места или руины. Местоимение в еврейском женского рода согласовано с Иерусалимом как городом; по нормам русского языка требуется мужское «его».
- source_word: אֲקוֹמֵם
  choice: Я восстановлю
  rationale: Форма от קום буквально передаёт воздвижение разрушенного; с «развалинами» русское «восстановлю» ясно и естественно выражает результат, не меняя образ восстановления города.
theological_decisions:
- issue: Кого обозначают «Его раб» и «Его посланники»
  choice: Личность раба и состав посланников не уточняются; сохраняются соответственно единственное и множественное число оригинала.
  alternative: Под рабом можно понимать конкретного пророка, например Исаию, а под посланниками — совокупность пророческих вестников.
  rationale: Сам стих не называет их прямо, поэтому перевод не должен устранять заложенную в тексте неопределённость.
- issue: Значение מַלְאָכָיו
  choice: посланники
  alternative: ангелы
  rationale: Еврейское слово допускает оба значения. Пророческий параллелизм вероятнее указывает на человеческих вестников, но вариант «ангелы» отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным синтаксисом. Прописное «Своего/Своих» помогает ясно соотнести местоимения с Богом, не добавляя имени или титула. Грамматический род Иерусалима адаптирован к русской норме.
