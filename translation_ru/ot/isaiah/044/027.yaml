  text: הָ/אֹמֵ֥ר לַ/צּוּלָ֖ה חֳרָ֑בִי וְ/נַהֲרֹתַ֖יִ/ךְ אוֹבִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/027.yaml
  text: who says to the deep[a], ‘Be dry, and I will dry up your rivers,’
translation:
  language: ru
  text: 'говорящий пучине[a]: «Высохни! И реки твои Я иссушу»;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «водной глубине». Еврейское слово обозначает глубокую массу вод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: говорящий
  rationale: Субстантивированное причастие с артиклем продолжает начатое в предыдущем контексте описание Бога. Причастие «говорящий» сохраняет синтаксическую зависимость стиха и не добавляет отсутствующего в еврейском тексте подлежащего.
- source_word: לַצּוּלָה
  choice: пучине
  rationale: צּוּלָה обозначает водную глубину, пучину. «Пучина» естественно передаёт образ глубокой массы вод и допускает обращение к ней как к олицетворённой стихии.
- source_word: חֳרָבִי
  choice: Высохни
  rationale: Повелительная форма женского рода обращена к существительному женского рода צּוּלָה. «Высохни» прямо и естественно передаёт приказ стать сухой.
- source_word: וְנַהֲרֹתַיִךְ
  choice: И реки твои
  rationale: נְהָרוֹת буквально означает «реки», а суффикс второго лица женского рода связывает их с пучиной. Постпозиция местоимения придаёт речи dignified biblical cadence without obscuring meaning.
- source_word: אוֹבִישׁ
  choice: Я иссушу
  rationale: Порода hifil глагола יבש выражает причинение сухости. Будущее «иссушу» кратко и точно передаёт обещанное действие говорящего.
theological_decisions:
- issue: Кто говорит и как стих связан с предыдущим контекстом
  choice: Сохранить зависимое причастие «говорящий», не вставляя имя Господа.
  alternative: 'Передать самостоятельным предложением с добавленным подлежащим: «Господь говорит…»'
  rationale: В еврейском тексте стих продолжает цепь определений Бога из предыдущего контекста. Добавление явного подлежащего устранило бы эту литературно-синтаксическую связь.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной библейской интонацией. «Пучина» сохраняет поэтический образ; «иссушу» передаёт причинное значение глагола. Точка с запятой отражает зависимость от окружающего предложения.
