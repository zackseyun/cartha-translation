base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/003.yaml
  text: For I will pour water on the thirsty land[a], and streams on the dry ground; I will pour out my Spirit on your offspring[c][b], and my blessing on your descendants.
translation:
  language: ru
  text: Ибо Я изолью воду на жаждущую землю[a] и потоки[b] — на сухую землю; изолью Мой Дух[c] на твоё потомство и Моё благословение — на твоих потомков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на жаждущего». В еврейском тексте прилагательное может употребляться как существительное, однако параллель с «сухой землёй» указывает прежде всего на жаждущую землю.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «текущие воды». Еврейское слово буквально означает «то, что течёт».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может также означать «дыхание» или «ветер», но в данном обещании Божьего благословения потомству контекст поддерживает перевод «Мой Дух».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт объяснительно-причинную связь с предшествующим обещанием и естественно звучит в современном русском.
- source_word: אֶצָּק / אֶצֹּק (יצק)
  choice: изолью
  rationale: Сохраняет общий глагольный образ для воды и Божьего Духа; форма литературна, понятна и соответствует значению выливания.
- source_word: מַיִם
  choice: воду
  rationale: Прямое значение массового существительного; винительный падеж обусловлен русским управлением.
- source_word: צָמֵא
  choice: жаждущую землю
  rationale: В еврейском тексте стоит прилагательное «жаждущий» без выраженного существительного; параллель с иссохшей почвой указывает на землю.
- source_word: וְנֹזְלִים
  choice: и потоки
  rationale: Причастная форма буквально обозначает «текущие [воды]»; «потоки» кратко и естественно передают образ, не усиливая его до наводнения.
- source_word: יַבָּשָׁה
  choice: иссохшую почву
  rationale: Передаёт сухую землю и поддерживает поэтическую параллель с «жаждущей землёй».
- source_word: רוּחִי
  choice: Мой Дух
  rationale: רוּחַ допускает значения «дух», «дыхание», «ветер», но в обещании Божьего дара потомству контекст прежде всего поддерживает «Дух».
- source_word: זַרְעֶךָ
  choice: твоё потомство
  rationale: Еврейское «семя» употреблено как собирательное обозначение потомства; буквальное «семя» в современном русском здесь менее прозрачно.
- source_word: וּבִרְכָתִי
  choice: и Моё благословение
  rationale: Прямо сохраняет смысл Божьего благотворного дара и параллель с излиянием Духа.
- source_word: צֶאֱצָאֶיךָ
  choice: твоих потомков
  rationale: Естественно обозначает тех, кто происходит от адресата, и позволяет сохранить смысловую параллель без неуклюжего точного повтора.
theological_decisions:
- issue: Значение רוּחִי в контексте обещания
  choice: Мой Дух
  alternative: моё дыхание; мой ветер
  rationale: Параллель с Божьим благословением, изливаемым на будущие поколения, поддерживает личностно-божественное значение «Дух», при этом лексическая многозначность отмечена в сноске.
- issue: Референт צָמֵא
  choice: жаждущая земля
  alternative: жаждущий человек или народ
  rationale: Непосредственная параллель «на иссохшую почву» прежде всего создаёт образ обезвоженной земли, хотя формально прилагательное может быть субстантивировано.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Сохранены параллелизм, повтор глагола «изолью» и переход от образа орошения земли к Божьему дару потомству. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской издательской норме.
