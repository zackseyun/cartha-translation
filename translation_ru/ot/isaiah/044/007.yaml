source:
  edition: WLC
  text: וּ/מִֽי כָמ֣וֹ/נִי יִקְרָ֗א וְ/יַגִּידֶ֤/הָ וְ/יַעְרְכֶ֨/הָ֙ לִ֔/י מִ/שּׂוּמִ֖/י עַם עוֹלָ֑ם וְ/אֹתִיּ֛וֹת וַ/אֲשֶׁ֥ר תָּבֹ֖אנָה יַגִּ֥ידוּ לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/007.yaml
  text: And who is like me? Let him call and declare it[a], and set it in order for me, since I appointed an ancient people. Let them declare to them the things to come[b], and the things that will come.
translation:
  language: ru
  text: И кто подобен Мне? Пусть он возгласит, объявит это и представит Мне по порядку с тех пор, как Я поставил древний народ.[a] Пусть они возвестят им грядущее[b] и то, что ещё придёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с того времени, как Я поставил народ древности». Еврейское выражение допускает темпоральное понимание, а «древний народ» можно также передать как «народ древности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «знамения». Еврейское слово может означать знаки или знамения, хотя параллель с последующими словами здесь поддерживает значение будущих событий.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כָמוֹנִי
  choice: И кто подобен Мне?
  rationale: Сохранён риторический вызов и союз ו, связывающий стих с предшествующей речью.
- source_word: יִקְרָא
  choice: пусть он возгласит
  rationale: Имперфект в контексте вызова передан побудительно. «Возгласит» сохраняет публичный характер действия и звучит естественнее, чем буквальное «пусть позовёт» без названного адресата.
- source_word: וְיַגִּידֶהָ וְיַעְרְכֶהָ לִי
  choice: объявит это и изложит передо Мной
  rationale: Женские суффиксы переданы нейтральным «это», без добавления отсутствующего в тексте явного антецедента. ערך выражает упорядоченное изложение; לִי в данном контексте естественно передано как «передо Мной».
- source_word: מִשּׂוּמִי עַם עוֹלָם
  choice: с тех пор, как Я утвердил древний народ
  rationale: מן с инфинитивом понят темпорально; שׂים передан широким «утвердил», а עוֹלָם — как указание на древность. Не вносится дополнительное учение о вечном статусе народа.
- source_word: וְאֹתִיּוֹת
  choice: грядущее
  rationale: В параллели с וַאֲשֶׁר תָּבֹאנָה слово понято как обозначение будущих событий; возможное значение «знамения» отмечено в сноске.
- source_word: וַאֲשֶׁר תָּבֹאנָה
  choice: и то, что ещё придёт
  rationale: Сохранено отдельное второе выражение о будущем и его параллелизм с предыдущим, без сведения двух членов к одному.
- source_word: יַגִּידוּ לָמוֹ
  choice: пусть они возвестят им
  rationale: Сохранены оба местоименных элемента с неуточнёнными референтами, как в сжатом еврейском тексте; неоднозначность не устранена добавлением толкования.
theological_decisions:
- issue: Значение עַם עוֹלָם
  choice: древний народ
  alternative: вечный народ; народ древности
  rationale: Контекст подчёркивает Божье владычество над историей и знание будущего. Значение древности здесь уместнее и не привносит в стих утверждение о метафизически вечном статусе народа.
- issue: Значение וְאֹתִיּוֹת
  choice: грядущее
  alternative: знамения; знаки
  rationale: Параллель с «тем, что ещё придёт» поддерживает значение будущих событий, однако лексическая возможность «знамений» сохранена в сноске.
- issue: Неясные референты множественных местоимений в יַגִּידוּ לָמוֹ
  choice: сохранить «они» и «им» без уточнения
  alternative: назвать соперничающих богов и древний народ либо их слушателей
  rationale: Еврейская формулировка сжата и допускает разные способы восстановления участников. Перевод не превращает одно толкование в явный текст.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Формы «Мне», «Мной», «Я» пишутся с прописной буквы как местоимения, относящиеся к Богу. Архаизмы сведены к умеренному «грядущее», которое здесь кратко и естественно передаёт эсхатологически нейтральное значение будущих событий.
