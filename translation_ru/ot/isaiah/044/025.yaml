revisions:
- from: Который расстраивает знамения лжецов[a], заставляет прорицателей глупеть, обращает мудрецов вспять и превращает их знание в глупость.
  to: Который делает знамения лжецов[a] тщетными, делает прорицателей глупцами, обращает мудрецов вспять и обращает их знание в глупость.
  rationale: Правка заменяет неестественное «расстраивает знамения» на ясное «делает ... тщетными», передающее מֵפֵר, и делает формулировку о прорицателях более точной и литературной. Неоднозначность בַּדִּים сохранена в сноске; смысл и структура стиха не изменены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:35:41Z'
