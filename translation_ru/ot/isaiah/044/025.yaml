  verdict: revise
  source_fidelity: 'В целом смысл передан верно: מֵפֵר — лишает действенности, בַּדִּים оставлено как «лжецы» с корректно отмеченной неоднозначностью, קֹסְמִים — «прорицатели», а два последних образа сохранены. Однако «расстраивает знамения» по-русски неестественно и недостаточно ясно передаёт, что знамения лишаются силы/подтверждения.'
  naturalness: Нужна небольшая стилистическая правка. «Делает знамения ... тщетными» и «делает ... глупцами» естественнее для современного литературного русского, сохраняя возвышенную библейскую интонацию и параллелизм.
  terminology: «Знамения», «лжецы», «прорицатели», «мудрецы» уместны. Сноска к בַּדִּים необходима и удачно не навязывает одно спорное значение. Не следует уточнять эту группу как лжепророков.
