  text: מֵפֵר֙ אֹת֣וֹת בַּדִּ֔ים וְ/קֹסְמִ֖ים יְהוֹלֵ֑ל מֵשִׁ֧יב חֲכָמִ֛ים אָח֖וֹר וְ/דַעְתָּ֥/ם יְשַׂכֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/025.yaml
  text: who frustrates the signs of liars and makes diviners act like fools, who turns wise men back and makes their knowledge foolish,
translation:
  language: ru
  text: Который делает знамения лжецов[a] тщетными, делает прорицателей глупцами, обращает мудрецов вспять и обращает их знание в глупость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пустословов»; еврейское слово может обозначать лжецов, хвастливых говорунов или пустословов.'
    reason: Слово בַּדִּים допускает несколько близких значений, и контекст не позволяет полностью устранить эту неоднозначность.
lexical_decisions:
- source_word: מֵפֵר
  choice: расстраивает
  rationale: Передаёт значение «нарушает, делает недействительным, срывает» применительно к предсказательным знамениям.
- source_word: בַּדִּים
  choice: лжецов
  rationale: В данном контексте слово обозначает людей, чьи притязания или предсказания оказываются ложными; неоднозначность отмечена в сноске.
- source_word: אֹתוֹת
  choice: знамения
  rationale: Сохраняет религиозно-пророческий смысл знаков, на которые ссылаются названные далее прорицатели.
- source_word: קֹסְמִים
  choice: прорицателей
  rationale: Современное и точное обозначение тех, кто занимается гаданием и предсказанием скрытого или будущего.
- source_word: יְהוֹלֵל
  choice: заставляет … глупеть
  rationale: 'Каузативная форма передаёт действие Бога: Он делает прорицателей глупыми, выставляя несостоятельность их притязаний.'
- source_word: מֵשִׁיב … אָחוֹר
  choice: обращает … вспять
  rationale: Сохраняет пространственный образ отступления или поворота назад, не сводя его лишь к опровержению.
- source_word: יַשְׂכֵּל
  choice: превращает … в глупость
  rationale: В данном контексте глагол выражает превращение знания мудрецов в неразумие или обнаружение его как глупости.
theological_decisions:
- issue: Характер «знамений» и носителей ложных притязаний
  choice: «знамения лжецов»
  alternative: «знамения хвастунов» / «знамения пустословов» / «знамения лжепророков»
  rationale: Перевод не уточняет их как именно пророков, чего еврейский текст прямо не говорит, и сохраняет общий смысл ложности их притязаний.
- issue: Действие Бога над знанием мудрецов
  choice: «превращает их знание в глупость»
  alternative: «показывает глупость их знания»
  rationale: Выбрана более формально близкая каузативная формулировка; она сохраняет напряжение между активным Божьим действием и обнаружением несостоятельности человеческой мудрости.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Параллелизм еврейской строки сохранён; причастная конструкция «Который…» отражает синтаксическую связь с предыдущими стихами.
