  text: וְ/הָיָ֤ה לְ/אָדָם֙ לְ/בָעֵ֔ר וַ/יִּקַּ֤ח מֵ/הֶם֙ וַ/יָּ֔חָם אַף יַשִּׂ֖יק וְ/אָ֣פָה לָ֑חֶם אַף יִפְעַל אֵל֙ וַ/יִּשְׁתָּ֔חוּ עָשָׂ֥/הוּ פֶ֖סֶל וַ/יִּסְגָּד לָֽ/מוֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/015.yaml
  text: Then it becomes fuel for a man[a], and he takes some of them and warms himself; he also kindles a fire and bakes bread. He also makes a god and bows down; he makes it a carved image and prostrates himself before it.
translation:
  language: ru
  text: 'И становится оно человеку топливом: он берёт часть из них и греется; ещё разводит огонь и печёт хлеб. А ещё делает бога и поклоняется ему; делает из него изваяние и падает ниц перед ним.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «падает ниц перед ними». В древнееврейском тексте употреблена поэтическая местоименная форма לָמוֹ, формально имеющая множественное значение («им», «перед ними»), хотя ближайшее слово «изваяние» стоит в единственном числе. Это может быть особенностью поэтической речи или относиться к древесине либо её частям.'
    reason: Сохраняет грамматическую и референциальную неоднозначность לָמוֹ, оставляя в основном тексте естественное русское согласование с единичным «изваянием».
lexical_decisions:
- source_word: וְהָיָה לְאָדָם לְבָעֵר
  choice: И становится оно человеку топливом
  rationale: Передаёт результат и назначение древесины; אָדָם имеет здесь обобщённое единственное значение, естественно выраженное русским «человеку».
- source_word: וַיִּקַּח מֵהֶם
  choice: он берёт часть из них
  rationale: מֵהֶם — множественная местоименная форма с партитивным смыслом, относящаяся к деревьям или кускам древесины из контекста.
- source_word: וַיָּחָם
  choice: и греется
  rationale: Непереходное значение «становиться тёплым, согреваться» в данном контексте естественно передаётся возвратным глаголом.
- source_word: אַף יַשִּׂיק
  choice: ещё разводит огонь
  rationale: אַף добавляет следующий способ употребления древесины; глагол означает разжигать, а объект «огонь» естественно восполняется из контекста.
- source_word: וְאָפָה לָחֶם
  choice: и печёт хлеб
  rationale: Прямое и современное соответствие глагольно-объектному сочетанию.
- source_word: אַף יִפְעַל אֵל
  choice: А ещё делает бога
  rationale: 'Сохраняет אֵל как «бог» и пророческую иронию: человек сам изготовляет того, кому затем поклоняется.'
- source_word: וַיִּשְׁתָּחוּ
  choice: и поклоняется ему
  rationale: В данном контексте физическое преклонение является актом почитания; местоимение «ему» естественно указывает на только что названного бога.
- source_word: עָשָׂהוּ פֶסֶל
  choice: делает из него изваяние
  rationale: Суффикс -הוּ допускает объектное понимание «делает его изваянием»; русское «делает из него» ясно передаёт превращение материала в резной культовый образ. «Изваяние» сохраняет значение изготовленного образа без архаизма.
- source_word: וַיִּסְגָּד לָמוֹ
  choice: и простирается перед ним
  rationale: סגד обозначает земной поклон, простирание ниц. В тексте стоит поэтическая форма לָמוֹ, формально допускающая множественное значение, но в данном месте естественно соотносимая с единичным изваянием; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Различение אֵל и פֶסֶל
  choice: «делает бога… делает из него изваяние»
  alternative: «делает идола» в обоих случаях
  rationale: 'Разные слова оригинала сохранены, чтобы не ослабить иронию: изготовленный человеком «бог» оказывается изваянием.'
- issue: Референт формы לָמוֹ
  choice: «перед ним» с примечанием о форме оригинала
  alternative: «перед ними»
  rationale: Единственное число по-русски согласуется с ближайшим референтом פֶסֶל и не создаёт искусственной неясности, тогда как формальная особенность древнееврейского текста открыто отмечена в сноске.
- issue: Характер действий וַיִּשְׁתָּחוּ и וַיִּסְגָּד
  choice: «поклоняется… простирается»
  alternative: дважды «поклоняется» или «падает ниц»
  rationale: Перевод различает два близких выражения и сохраняет нарастание от поклонения к телесному простиранию перед образом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Короткая последовательность бытовых действий сохранена, как и резкий иронический переход от топлива и хлеба к изготовлению предмета поклонения. Маркер [a] помещён непосредственно после спорной фразы.
