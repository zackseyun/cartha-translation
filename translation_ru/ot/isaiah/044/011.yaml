  source_fidelity: 'В целом смысл передан точно: разоблачение изготовителей как всего лишь людей, вызов собраться и общий страх и посрамление сохранены. Однако «предстанут» конкретизирует יַעֲמֹדוּ как явку перед судом/лицом властителя, тогда как еврейский глагол буквально и достаточно широко означает «пусть встанут / станут».'
