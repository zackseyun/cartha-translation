source:
  edition: WLC
  text: הֵ֤ן כָּל חֲבֵרָי/ו֙ יֵבֹ֔שׁוּ וְ/חָרָשִׁ֥ים הֵ֖מָּה מֵֽ/אָדָ֑ם יִֽתְקַבְּצ֤וּ כֻלָּ/ם֙ יַֽעֲמֹ֔דוּ יִפְחֲד֖וּ יֵבֹ֥שׁוּ יָֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/011.yaml
  text: Look[a], all his companions will be put to shame, and the craftsmen are only men. Let them all gather and stand up; they will be terrified[b], they will be put to shame together.
translation:
  language: ru
  text: 'Вот, все, кто с ним заодно, будут посрамлены, а мастера — всего лишь люди. Пусть все они соберутся и встанут: их охватит страх, и все вместе они будут посрамлены.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Современное и литературное средство привлечения внимания, сохраняющее указательную и усилительную функцию еврейской частицы.
- source_word: חֲבֵרָיו
  choice: все, кто с ним заодно
  rationale: Передаёт связь и солидарность с идолом или его изготовителем, не сужая значение до ремесленной гильдии; местоименная отсылка в еврейском допускает контекстуальную неоднозначность.
- source_word: יֵבֹשׁוּ
  choice: будут посрамлены
  rationale: Сохраняет пророческий оттенок публичного позора и повтор одного и того же глагола в начале и конце стиха.
- source_word: וְחָרָשִׁים
  choice: а мастера
  rationale: חָרָשׁ — широкое обозначение искусного ремесленника или изготовителя, не обязательно кузнеца.
- source_word: הֵמָּה מֵאָדָם
  choice: всего лишь люди
  rationale: Естественно передаёт противопоставление человеческой природы изготовителей предполагаемой божественности идола.
- source_word: יִתְקַבְּצוּ כֻלָּם
  choice: Пусть все они соберутся
  rationale: Имперфект понят как вызов-побуждение; русский возвратный глагол естественно передаёт форму и значение еврейского глагола.
- source_word: יַעֲמֹדוּ
  choice: предстанут
  rationale: В сцене вызова означает не просто физически встать, а занять место и явиться для противостояния или суда.
- source_word: יִפְחֲדוּ
  choice: их охватит страх
  rationale: Передаёт сильную реакцию страха естественным современным русским выражением, не усиливая её до прямо не выраженного 'ужаса'.
- source_word: יָחַד
  choice: все вместе
  rationale: Ясно выражает общность их участи и естественно завершает фразу.
theological_decisions:
- issue: Значение מֵאָדָם в противопоставлении изготовителей и божества
  choice: всего лишь люди
  alternative: они из числа людей / они человеческого происхождения
  rationale: Смысл состоит в том, что мастера принадлежат к человечеству и не обладают божественной природой; перевод сохраняет контраст, не вводя дополнительного учения.
- issue: Неоднозначная отсылка местоимения в חֲבֵרָיו
  choice: кто с ним заодно
  alternative: его товарищи / его сообщники
  rationale: Еврейское 'его' может контекстуально соотноситься с идолом либо с его изготовителем; формулировка не закрепляет спорный референт и сохраняет ассоциацию.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет движение оригинала: объявление позора, разоблачение человеческой природы мастеров, затем вызов собраться и итог общего страха и посрамления. Архаизмы и конфессионально окрашенные уточнения исключены.'
