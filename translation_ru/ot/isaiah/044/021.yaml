base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/021.yaml
  text: Remember these things[a], Jacob, and Israel, for you are my servant; I formed you; you are a servant to me. Israel, you will not be forgotten by me.
translation:
  language: ru
  text: Помни обо всём этом, Иаков и Израиль, потому что ты Мой раб. Я создал тебя; ты Мой раб. Израиль, Я не забуду тебя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Израиль, не забывай Меня». Еврейскую форму можно также понимать как обращённое к Израилю увещание, а не как заверение Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר אֵלֶּה
  choice: Помни это
  rationale: Императив זְכָר передан прямым и естественным повелением «помни»; множественное אֵלֶּה указывает на сказанное выше, но по-русски собирательное «это» звучит естественнее, чем «эти вещи».
- source_word: יַעֲקֹב וְיִשְׂרָאֵל
  choice: Иаков, и ты, Израиль
  rationale: Оба имени сохраняются как параллельные обращения к одному народу; добавление «ты» перед вторым обращением делает русский синтаксис ясным и торжественным.
- source_word: כִּי עַבְדִּי אָתָּה
  choice: потому что ты Мой раб
  rationale: כִּי вводит основание повеления, а עֶבֶד в данном контексте обозначает принадлежащего Богу служителя; «раб» сохраняет традиционный библейский образ и силу отношения принадлежности.
- source_word: יְצַרְתִּיךָ
  choice: Я создал тебя
  rationale: Глагол יצר означает формировать, создавать; «создал» естественно для современного русского и сохраняет здесь образ Божьего творческого действия.
- source_word: עֶבֶד לִי אַתָּה
  choice: ты Мой раб
  rationale: 'Предикативная конструкция буквально утверждает: «раб для Меня ты». Русское «ты Мой раб» точно и без лишнего истолкования передаёт принадлежность и служение.'
- source_word: לֹא תִנָּשֵׁנִי
  choice: Я не забуду тебя
  rationale: Основное прочтение понимает форму как заверение, что Израиль не будет забыт Богом. Активная русская конструкция естественнее пассивной и сохраняет тот же смысл; грамматически возможная альтернатива вынесена в сноску.
theological_decisions:
- issue: Субъектно-объектное понимание לֹא תִנָּשֵׁנִי
  choice: 'Божественное заверение: «Я не забуду тебя»'
  alternative: 'Увещание Израилю: «не забывай Меня»'
  rationale: Контекст Божьего избрания и создания Израиля как Своего раба естественно завершается обещанием Божьей верности. Вместе с тем неоднозначность еврейской формы не устраняется, а отражается в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены прямые обращения и параллелизм; местоимение «Мой» написано с прописной буквы как уважительное обозначение Бога.
