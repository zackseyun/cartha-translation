  source_fidelity: 'Основной смысл передан верно: повеление помнить, двойное именование Израиля, основание в его статусе Божьего раба, Божье формирование и заверение о незабвении сохранены. Однако «Или: “Помни об этом”» не является содержательно отличающимся вариантом перевода и не соответствует заявленной причине сноски; реальная текстовая неоднозначность относится к заключительной форме לֹא תִנָּשֵׁנִי.'
  naturalness: «Помни обо всём этом, Иаков и Израиль» естественно для современного литературного русского и яснее передаёт отсылку ко множеству предшествующих обстоятельств. Устранение вставного «и ты» делает параллельные именования ближе к еврейскому тексту без потери понятности.
  terminology: «Мой раб» уместно сохраняет библейский и заветный регистр עַבְדִּי. «Я создал тебя» является допустимой современной передачей יְצַרְתִּיךָ; изменение на «образовал» не требуется. Прописное «Мой» последовательно отражает редакционную практику уважительного написания о Боге.
