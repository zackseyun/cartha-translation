base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/017.yaml
  text: And with the rest of it he makes a god—his carved image[a]; he bows down to it and worships, and prays to it and says, “Deliver me[b], for you are my god.”
translation:
  language: ru
  text: 'А из остатка он делает бога — своего резного идола; преклоняется перед ним, падает ниц, молится ему и говорит: «Спаси меня, ведь ты — мой бог!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁאֵרִיתוֹ
  choice: А остаток
  rationale: שְׁאֵרִיתוֹ обозначает оставшуюся часть того же дерева, о котором говорится в предшествующем контексте; краткая формулировка сохраняет связь с ним.
- source_word: לְאֵל עָשָׂה
  choice: он превращает в бога
  rationale: 'Предлог לְ при עשה выражает результат: человек делает оставшуюся древесину богом, то есть наделяет изготовленный предмет божественным статусом. Настоящее время передаёт живое описание типичного действия.'
- source_word: לְפִסְלוֹ
  choice: в своего резного идола
  rationale: פֶסֶל — вырезанный образ, служащий предметом поклонения. «Резной идол» сохраняет и материальный способ изготовления, и культовый смысл; притяжательное местоимение передаёт суффикс 3-го лица.
- source_word: יִסְגּוֹד לוֹ
  choice: преклоняется перед ним
  rationale: סגד обозначает телесное преклонение в знак почитания; формулировка естественна по-русски и позволяет сохранить нагнетание действий поклонения.
- source_word: וְיִשְׁתַּחוּ
  choice: падает ниц
  rationale: שׁחה выражает глубокий поклон или простирание перед кем-либо. «Падает ниц» сохраняет конкретный телесный образ и не сливает этот глагол с предшествующим סגד.
- source_word: וְיִתְפַּלֵּל אֵלָיו
  choice: молится ему
  rationale: התפלל אל прямо означает обращение к кому-либо с молитвой; мужское местоимение естественно согласуется с русскими словами «бог» и «идол».
- source_word: הַצִּילֵנִי
  choice: Спаси меня
  rationale: Императив от נצל выражает просьбу о спасении или избавлении. «Спаси меня» ясно и естественно передаёт и просьбу, и иронию обращения к изготовленному предмету.
- source_word: כִּי אֵלִי אָתָּה
  choice: ведь ты — мой бог
  rationale: כִּי вводит основание просьбы, а אֵלִי означает «мой бог». Частица «ведь» естественно передаёт мотивировку без ослабления идолопоклоннического утверждения.
theological_decisions:
- issue: Личные местоимения по отношению к идолу
  choice: Использовать формы мужского рода «ним», «ему», согласуя их с «бог» и «идол»
  alternative: Использовать средний род при переводе פֶסֶל словом «изваяние»
  rationale: В еврейском тексте употреблены формы мужского рода, а выбранные русские существительные также мужского рода. Такое согласование сохраняет форму исходного текста и звучит естественно, не утверждая реальной одушевлённости идола.
- issue: Соотношение двух глаголов поклонения
  choice: 'Передать оба как отдельные телесные действия: «преклоняется» и «падает ниц»'
  alternative: Один из глаголов передать обобщённо как «поклоняется»
  rationale: Последовательное перечисление в еврейском тексте усиливает сатирическое изображение идолопоклонства. Раздельная передача сохраняет риторическое нагнетание и не устраняет возможное смысловое перекрытие глаголов.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Настоящее время сохраняет живой, обобщающий характер пророческого описания; ряд однородных действий передаёт нарастающую иронию исходного текста.
