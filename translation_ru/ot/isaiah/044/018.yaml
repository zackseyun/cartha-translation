base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/018.yaml
  text: They do not know[a], nor do they understand, because he has shut their eyes from seeing[c][b], and their hearts from understanding.
translation:
  language: ru
  text: Они не знают и не понимают, потому что он залепил им глаза, чтобы они не видели[a][b], и их сердца, чтобы они не понимали[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальный образ еврейского глагола — намазать или покрыть слоем; возможный перевод: «замазал им глаза».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте деятель не назван прямо: глагол имеет форму мужского рода единственного числа — «он залепил».'
    reason: alternative_reading
  - marker: c
    text: В древнееврейском представлении сердце — средоточие не только чувств, но также мысли, воли и понимания.
    reason: cultural_note
lexical_decisions:
- source_word: יָדְעוּ
  choice: не знают
  rationale: Отрицательная форма перфекта в данном контексте выражает общее, продолжающееся состояние; настоящее время естественно для современного русского языка.
- source_word: יָבִינוּ
  choice: не понимают
  rationale: Глагол בין обозначает понимание и способность различать; «понимают» естественно сочетается с «знают», не добавляя лишнего толкования.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину их незнания и непонимания.
- source_word: טַח
  choice: залепил
  rationale: Сохранён конкретный образ нанесения или намазывания слоя, закрывающего глаза. «Залепил» звучит естественнее по-русски, чем буквальное «замазал поверх», и менее истолковательно, чем «ослепил».
- source_word: מֵרְאוֹת עֵינֵיהֶם
  choice: им глаза, чтобы они не видели
  rationale: Предлог מִן с инфинитивом выражает воспрепятствование действию; целевая конструкция естественно передаёт это значение по-русски.
- source_word: מֵהַשְׂכִּיל לִבֹּתָם
  choice: и сердца — чтобы они не разумели
  rationale: Сохранено «сердца» как носитель мысли и восприятия в древнееврейском словоупотреблении, а «разумели» передаёт познавательный смысл השׂכיל и поддерживает высокий, но понятный регистр.
- source_word: לִבֹּתָם
  choice: сердца
  rationale: Буквальный образ сохранён, поскольку древнееврейское «сердце» охватывает не только чувства, но также разумение и волю.
theological_decisions:
- issue: Неуказанный субъект глагола טַח
  choice: он залепил
  alternative: глаза их залеплены / им залепили глаза
  rationale: В еврейском тексте стоит глагол 3-го лица мужского рода единственного числа, но деятель прямо не назван. Русское «он» сохраняет грамматическое число и род, а сноска предупреждает, что текст стиха не называет деятеля; тем самым не решается молча, идёт ли речь о Боге, другом деятеле или риторически подразумеваемом субъекте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конкретная метафора сохранена, синтаксис сделан естественным для русского читателя; слово «сердца» оставлено ради передачи древнееврейской антропологии.
