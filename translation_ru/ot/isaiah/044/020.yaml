base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/020.yaml
  text: He feeds on ashes[a]; a deceived heart has led him astray, and he cannot deliver himself or say[b], “Is there not a lie in my right hand?”
translation:
  language: ru
  text: 'Он питается пеплом[a]; обманутое сердце сбило его с пути, и он не может спасти себя[b] и не говорит: «Разве не ложь у меня в правой руке?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пасётся на пепле». В еврейском тексте ярко сохраняется образ кормления или выпаса.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не может спасти свою נפשׁ»; еврейское נפשׁ здесь может означать самого человека, его жизнь или душу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה אֵפֶר
  choice: питается пеплом
  rationale: Причастие от רעה сохраняет образ кормления или выпаса, а אֵפֶר обычно означает «пепел». Русское «питается пеплом» естественно передаёт яркий образ тщетности, связанный с сожжённым деревом.
- source_word: לֵב הוּתַל
  choice: обманутое сердце
  rationale: «Сердце» сохраняет широкий древнееврейский смысл — внутренний центр мысли, воли и нравственного решения; пассивная форма הוּתַל указывает на состояние обмана или заблуждения.
- source_word: הִטָּהוּ
  choice: сбило его с пути
  rationale: Каузативная форма от נטה означает, что обманутое сердце отклонило человека от верного пути. Выражение естественно по-русски и сохраняет нравственно-религиозный оттенок.
- source_word: וְלֹא יַצִּיל אֶת נַפְשׁוֹ
  choice: Он не спасает себя
  rationale: נֶפֶשׁ здесь обозначает самого человека, его жизнь или личность, а не обязательно отделимую «душу». Настоящее время передаёт продолжающееся состояние, не усиливая исходное отрицание модальным «не может».
- source_word: שֶׁקֶר בִּימִינִי
  choice: в моей правой руке не ложь
  rationale: Сохранены риторический вопрос, образ лжи и конкретная правая рука идолопоклонника; русская конструкция остаётся понятной без поясняющего добавления «то, что».
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ
  choice: себя
  alternative: свою душу; свою жизнь
  rationale: В контексте речь идёт о неспособности идолопоклонника избавить самого себя от гибельного заблуждения. «Себя» передаёт древнееврейскую идиому без внесения более позднего технического противопоставления души и тела.
- issue: Характер отрицания в וְלֹא יַצִּיל
  choice: не спасает
  alternative: не может спасти
  rationale: В еврейском тексте отрицательная форма прямо описывает отсутствие спасительного действия, но сама по себе не содержит отдельного модального глагола «мочь». Выбранный вариант не устраняет возможный контекстуальный оттенок неспособности, но и не делает его единственным прочтением.
translation_notes:
  register: Современный литературный русский язык с кратким, обличительным и образным звучанием. Сохранены «сердце», «пепел», «ложь» и «правая рука» как ключевые конкретные образы исходного текста; синтаксис разделён на два предложения ради ясности без изменения смысловых связей.
