base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/005.yaml
  text: This one will say[a], ‘I am Yahweh’s’; another will call himself by the name of Jacob; and another will write on his hand[c][b], ‘Belonging to Yahweh,’ and will name himself by the name of Israel.
translation:
  language: ru
  text: 'Один скажет[a]: «Я принадлежу Яхве»; другой назовёт себя именем Иакова; ещё один напишет на своей руке[b]: «Принадлежу Яхве» — и назовёт себя именем Израиля[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее по строю еврейской фразы: «Яхве — я»; это эллиптическое выражение означает: «Я принадлежу Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Надпись на руке, вероятно, служит знаком принадлежности Яхве. Необычную еврейскую конструкцию можно передать буквальнее: «напишет свою руку для Яхве».'
    reason: cultural_note
  - marker: c
    text: 'Возможно также: «и даст себе дополнительное имя Израиль».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה ... וְזֶה ... וְזֶה
  choice: один ... другой ... третий
  rationale: Повторяющаяся указательная конструкция последовательно выделяет разных людей. Русская распределительная формула естественно передаёт эту последовательность.
- source_word: יֹאמַר
  choice: скажет
  rationale: Имперфект в пророческом контексте передан будущим временем.
- source_word: לַיהוָה אָ֔נִי
  choice: Я принадлежу Яхве
  rationale: Еврейская именная и эллиптическая конструкция буквально близка к «Я — Яхве» в значении принадлежности, а не отождествления с Богом. Добавленный по смыслу глагол делает исповедание ясным по-русски.
- source_word: יִקְרָא בְשֵׁם יַעֲקֹב
  choice: назовёт себя именем Иакова
  rationale: В параллельном контексте личного самообозначения оборот означает принятие имени Иакова как знака принадлежности к народу; возвратность подразумевается контекстом.
- source_word: יִכְתֹּב יָדוֹ לַיהוָה
  choice: 'напишет на своей руке: «Принадлежу Яхве»'
  rationale: Необычная еврейская конструкция буквально говорит о написании руки для Яхве. Перевод сохраняет конкретный образ руки и передаёт наиболее вероятный смысл надписи как знак принадлежности.
- source_word: יָדוֹ
  choice: своей руке
  rationale: Обычное значение существительного — «рука»; возвратное «своей» естественно связывает её с подлежащим.
- source_word: וּבְשֵׁם יִשְׂרָאֵל יְכַנֶּה
  choice: и назовёт себя именем Израиля
  rationale: Пиэль глагола כנה здесь обозначает наименование или принятие дополнительного имени. Формулировка сохраняет самоотождествление с Израилем, не сужая его до современного понятия фамилии.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Характер исповедания и принадлежности
  choice: Люди открыто объявляют о своей принадлежности Яхве и отождествляют себя с Иаковом/Израилем.
  alternative: Речь может пониматься шире как общественное присоединение к Израилю без явно выраженного заветного исповедания.
  rationale: Параллельные действия — заявление, принятие имени и надпись на руке — указывают на сознательную принадлежность, однако перевод не вводит более поздние конфессиональные категории.
- issue: Соотношение имён Иаков и Израиль
  choice: Оба имени сохранены без поясняющей замены словом «народ».
  alternative: Передать их истолковательно как обозначения народа или общины Израиля.
  rationale: В исходном тексте значимы сами имена; их метонимический смысл понятен из параллелизма и не должен подменяться толкованием.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Параллелизм сохранён с помощью последовательности «один — другой — третий»; личное имя Яхве передано прямо.
