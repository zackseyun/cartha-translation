  text: אַֽל תִּפְחֲדוּ֙ וְ/אַל תִּרְה֔וּ הֲ/לֹ֥א מֵ/אָ֛ז הִשְׁמַעְתִּ֥י/ךָ וְ/הִגַּ֖דְתִּי וְ/אַתֶּ֣ם עֵדָ֑/י הֲ/יֵ֤שׁ אֱל֨וֹהַּ֙ מִ/בַּלְעָדַ֔/י וְ/אֵ֥ין צ֖וּר בַּל יָדָֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/008.yaml
  text: Do not fear[a], and do not tremble. Have I not long ago made you hear and declared it? And you are my witnesses. Is there a God besides me? There is no Rock[c][b]; I know of none.
translation:
  language: ru
  text: Не бойтесь[a] и не трепещите. Разве не Я издавна[b] дал тебе услышать и возвестил? Вы — Мои свидетели. Есть ли Бог кроме Меня? Нет другой Скалы; Я не знаю иной.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не бойтесь и не ужасайтесь». Второй глагол редок и, вероятно, усиливает первый запрет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Разве не Я с давних времён дал тебе услышать и возвестил?»'
    reason: lexical_alternative
  - marker: c
    text: '«Скала» — образное наименование Бога; возможно также написание со строчной буквы: «скала».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְחֲדוּ
  choice: не бойтесь
  rationale: Глагол פחד обозначает страх или ужас; прямой запрет «не бойтесь» естественен для современного русского языка и сохраняет форму множественного числа.
- source_word: תִּרְהוּ
  choice: не трепещите
  rationale: Редкая форма, по контексту параллельная и усиливающая запрет бояться. «Не трепещите» сохраняет поэтический параллелизм, не уточняя сверх меры природу страха.
- source_word: מֵאָז
  choice: издавна
  rationale: Наречие указывает на давнее время. «Издавна» кратко и естественно передаёт обращение к прежнему Божьему возвещению.
- source_word: הִשְׁמַעְתִּיךָ
  choice: возвестил тебе
  rationale: Hифиль שמע с суффиксом 2-го лица единственного числа буквально выражает понуждение услышать. Русское «возвестил тебе» естественно передаёт причинное сообщение и сохраняет неожиданную смену от множественного обращения к единственному числу.
- source_word: וְהִגַּדְתִּי
  choice: и объявил
  rationale: נגד означает сообщить, объявить, сделать известным. «Объявил» поддерживает торжественный тон и не вводит отсутствующего в еврейском тексте прямого дополнения.
- source_word: עֵדָי
  choice: Мои свидетели
  rationale: Существительное стоит во множественном числе с суффиксом 1-го лица; перевод сохраняет судебно-свидетельский мотив и обращение к общине.
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: В риторическом вопросе речь идёт о существовании какого-либо истинного божества помимо говорящего; прописная буква в русском контексте передаёт божественный референт.
- source_word: מִבַּלְעָדַי
  choice: кроме Меня
  rationale: Предложное выражение обозначает исключение; «кроме Меня» ясно и идиоматично выражает исключительность.
- source_word: צוּר
  choice: Скала
  rationale: Метафорическое наименование Бога, выражающее незыблемость и надёжность. Буквальное «Скала» сохраняет образ, а прописная буква указывает на титульное употребление.
- source_word: בַּל יָדָעְתִּי
  choice: Я не знаю никакой
  rationale: Эмфатическое отрицание передано естественной русской конструкцией; женский род соотносится с «Скалой», а утверждение сохраняет абсолютный характер.
theological_decisions:
- issue: Исключительность Бога в риторическом вопросе
  choice: «Есть ли Бог кроме Меня? Нет Скалы — Я не знаю никакой» как абсолютное отрицание существования иного истинного божества.
  alternative: Писать «бог» со строчной буквы, подчёркивая категорию любого божества.
  rationale: Контекст Ис 44 полемизирует с идолами и провозглашает уникальность говорящего Бога. Формулировка не добавляет систематического толкования, но сохраняет категоричность еврейского текста.
- issue: צוּר как метафорический титул
  choice: «Скала» с прописной буквы.
  alternative: «скала» со строчной буквы либо интерпретирующее «Твердыня».
  rationale: Прописная буква помогает распознать наименование Бога, а «Скала» непосредственно сохраняет исходную метафору и её смысл незыблемости и надёжности.
translation_notes:
  register: 'Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Сохранены поэтический параллелизм, риторические вопросы и смена числа: множественное «не бойтесь» и «вы» рядом с единственным «тебе», отражающим масоретский текст. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской стилистике.'
