  verdict: revise
  source_fidelity: 'Основной смысл передан верно: два запрета, отсылка к давнему возвещению, свидетельство Израиля и риторическое утверждение исключительности Бога сохранены. Однако «возвестил тебе» ослабляет каузативный оттенок הִשְׁמַעְתִּיךָ («дал тебе услышать») и в сочетании с «объявил» неясно, что именно было объявлено. Необходимо также не создавать впечатление, будто «Я не знаю никакой» относится к отсутствующей в русском конструкции конкретной женской «Скале».'
  naturalness: «Не бойтесь и не трепещите» и «Вы — Мои свидетели» естественны для современного литературного, возвышенного библейского регистра. «Нет Скалы — Я не знаю никакой» звучит по-русски тяжеловесно и синтаксически неясно; «Нет другой скалы; Я не знаю иной» более ясно, но добавленное «другой» лишь эксплицирует риторический контекст и лучше отражает отсутствие иной божественной опоры.
  terminology: «Бог», «Мои свидетели» и «Скала» уместны. Прописная буква в «Скала» допустима как передача титульно-метафорического употребления, но не должна сопровождаться чрезмерно интерпретирующим пояснением. Смена множественного числа на единственное («тебе») отражает согласный масоретский текст и должна быть сохранена.
