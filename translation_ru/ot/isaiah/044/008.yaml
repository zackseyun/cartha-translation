  to: Не бойтесь[a] и не трепещите. Разве не Я издавна[b] дал тебе услышать и возвестил? Вы — Мои свидетели. Есть ли Бог кроме Меня? Нет другой Скалы; Я не знаю иной.[c]
  rationale: 'Исправлены две точки, где русский текст недостаточно точно и ясно передавал еврейский оригинал: каузативное «дал тебе услышать» и заключительное отрицание иной «Скалы». Добавление «другой» и «иной» в последней фразе не меняет смысла, а делает явной подразумеваемую в риторическом вопросе исключительность и обеспечивает естественную русскую связность. Сноски сохранены с теми же маркерами и привязками; сноска c сокращена во избежание избыточного толкования.'
