  yaml_path: translation/ot/isaiah/044/010.yaml
  text: Who fashions a god or casts an idol that is profitable for nothing?[a]
translation:
  language: ru
  text: Кто создаёт бога и отливает идола без всякой пользы?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто создаёт бога и отливает идола не на пользу?»'
    reason: 'Еврейский оборот может подчёркивать цель или результат действия: оно не приносит пользы.'
lexical_decisions:
- source_word: מִי
  choice: Кто
  rationale: Вопросительное местоимение вводит резкий риторический вопрос.
- source_word: יָצַר
  choice: создаёт
  rationale: Глагол означает формировать, придавать облик; «создаёт» естественно передаёт здесь изготовление божества человеком.
- source_word: אֵל
  choice: бога
  rationale: В контексте речь идёт о сделанном человеком ложном божестве, поэтому слово написано со строчной буквы.
- source_word: וּפֶסֶל
  choice: и ... идола
  rationale: Союз ו передан обычным соединительным «и», сохраняющим параллелизм двух выражений.
- source_word: נָסָךְ
  choice: отливает
  rationale: В контексте изготовления идола глагол обозначает литьё изображения, вероятно из металла.
- source_word: לְבִלְתִּי הוֹעִיל
  choice: от которого нет никакой пользы
  rationale: Выражение передаёт полную бесполезность изготовленного идола естественным современным русским языком, не устраняя возможного оттенка цели или результата.
theological_decisions:
- issue: Передача אֵל в полемике против идолов
  choice: бога
  alternative: Бога; божество
  rationale: Строчная буква показывает, что имеется в виду изготовленный ложный бог, а не истинный Бог, при этом сохраняется прямота исходного слова.
- issue: Связь двух частей вопроса
  choice: создаёт бога и отливает идола
  alternative: создаёт бога или отливает идола
  rationale: 'Еврейский союз буквально соединительный; русский вариант с «и» сохраняет формальную неоднозначность: это могут быть параллельные обозначения одного дела либо два тесно связанных действия.'
translation_notes:
  register: Современный литературный русский язык; краткий, резкий риторический вопрос. Сохранена пророческая ирония, без архаизмов и конфессионально окрашенной терминологии.
