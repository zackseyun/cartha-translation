revisions:
- from: Кузнец работает режущим инструментом[a] над раскалёнными углями, молотами придаёт изделию форму и обрабатывает его сильной рукой. Но вот он проголодался — и сил уже нет; не пил воды — и изнемог.
  to: Кузнец работает режущим инструментом[a] с углями, молотами придаёт изделию форму и обрабатывает его сильной рукой. Он голоден, и силы у него нет; он не пил воды и изнемогает.
  rationale: Устранены добавленные противопоставительный и временной оттенки, а состояние голода, отсутствие сил и нарастающее изнеможение переданы ближе к еврейской последовательности. Сноска сохранена на спорном названии инструмента; её якорь остаётся корректным.
