base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/012.yaml
  text: The ironsmith works with a cutting tool and works over the coals; with hammers he shapes it and works it with his strong arm. He also becomes hungry[a], and there is no strength; he has not drunk water, and he grows faint.
translation:
  language: ru
  text: Кузнец работает режущим инструментом[a] с углями, молотами придаёт изделию форму и обрабатывает его сильной рукой. Он голоден, и силы у него нет; он не пил воды и изнемогает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «теслом», «резцом» или «долотом»; точный вид названного здесь инструмента неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרַשׁ בַּרְזֶל
  choice: кузнец
  rationale: Сочетание обозначает мастера, работающего с железом. «Кузнец» — точный и естественный русский эквивалент в данной сцене.
- source_word: מַעֲצָד
  choice: режущий инструмент
  rationale: Точный вид инструмента неясен; обобщённый перевод передаёт его назначение, не создавая ложной конкретности. Возможные специальные названия приведены в сноске.
- source_word: וּפָעַל בַּפֶּחָם
  choice: работает … над раскалёнными углями
  rationale: Фраза описывает кузнечную работу с использованием жара углей. Слово «раскалёнными» естественно выражает подразумеваемую функцию углей в этой сцене.
- source_word: וּבַמַּקָּבוֹת יִצְּרֵהוּ
  choice: молотами придаёт изделию форму
  rationale: Сохранено явное множественное число «молотами» и значение глагола יצר — формировать, придавать форму. «Изделию» проясняет неодушевлённый объект, не уточняя его сверх контекста.
- source_word: וַיִּפְעָלֵהוּ בִּזְרוֹעַ כֹּחוֹ
  choice: обрабатывает его сильной рукой
  rationale: Перевод сохраняет повтор корня פעל через лексику работы и передаёт буквальное «рукой своей силы» естественным русским оборотом.
- source_word: גַּם רָעֵב וְאֵין כֹּחַ
  choice: Но вот он проголодался — и сил уже нет
  rationale: Передана смена фокуса с мастерства кузнеца на его телесную слабость. Тире подчёркивает следствие, не добавляя богословского толкования.
- source_word: לֹא שָׁתָה מַיִם וַיִּיעָף
  choice: не пил воды — и изнемог
  rationale: Форма совершенного вида и последовательность действий переданы краткими прошедшими формами; «изнемог» выражает крайнюю усталость и ослабление от жажды.
theological_decisions:
- issue: Пророческая сатира на изготовление идола
  choice: Конкретно описать тяжёлую работу и физическое истощение кузнеца, не называя её тщетной прямо в стихе.
  alternative: Внести в основной текст явную оценку бессилия или тщетности идолопоклонства.
  rationale: Контекст создаёт сатирический и богословский смысл, тогда как сам стих рисует труд и слабость мастера. Нейтрально-конкретная передача позволяет этому смыслу возникнуть из контекста.
translation_notes:
  register: Современный литературный русский язык с конкретной ремесленной лексикой и сдержанно-возвышенным библейским ритмом. Параллельные части разделены запятыми и тире, чтобы передать нарастание физического истощения. Маркер сноски поставлен при спорном названии инструмента, а не при словах о голоде.
