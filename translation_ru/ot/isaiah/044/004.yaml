  text: וְ/צָמְח֖וּ בְּ/בֵ֣ין חָצִ֑יר כַּ/עֲרָבִ֖ים עַל יִבְלֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/004.yaml
  text: And they will spring up among the grass like willows by streams of water[a].
translation:
  language: ru
  text: И они взойдут среди травы, как ивы у потоков воды[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как тополя у водных потоков». Еврейское עֲרָבִים обычно переводится как «ивы», но, возможно, обозначает более широкий вид растущих у воды деревьев, сходных с тополями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָמְחוּ
  choice: И они взойдут
  rationale: Глагол צמח в породе qal обозначает прорастание и рост растений. «Взойдут» живо передаёт образ появления молодых побегов и сохраняет форму будущего времени.
- source_word: בְּבֵין
  choice: среди
  rationale: Буквальное значение — «между», однако при собирательном существительном חָצִיר естественный русский эквивалент — «среди».
- source_word: חָצִיר
  choice: травы
  rationale: חָצִיר означает траву или травянистую растительность. Форма «среди травы» естественна для русского языка и сохраняет собирательный характер образа.
- source_word: כַּעֲרָבִים
  choice: как ивы
  rationale: עֲרָבִים традиционно понимается как «ивы», особенно в связи с водными потоками. Точное ботаническое отождествление не вполне бесспорно, поэтому вариант «тополя» отмечен в сноске.
- source_word: עַל
  choice: у
  rationale: В данном пространственном контексте עַל естественно передаётся русским «у», то есть возле потоков.
- source_word: יִבְלֵי מָיִם
  choice: потоков воды
  rationale: Сочетание обозначает водные потоки или русла. «Потоки воды» ясно передаёт множественность и образ текущей воды, не сужая значение до ручьёв.
