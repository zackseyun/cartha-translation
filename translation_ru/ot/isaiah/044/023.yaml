  text: רָנּ֨וּ שָׁמַ֜יִם כִּֽי עָשָׂ֣ה יְהוָ֗ה הָרִ֨יעוּ֙ תַּחְתִּיּ֣וֹת אָ֔רֶץ פִּצְח֤וּ הָרִים֙ רִנָּ֔ה יַ֖עַר וְ/כָל עֵ֣ץ בּ֑/וֹ כִּֽי גָאַ֤ל יְהוָה֙ יַֽעֲקֹ֔ב וּ/בְ/יִשְׂרָאֵ֖ל יִתְפָּאָֽר־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/023.yaml
  text: Sing for joy[a], O heavens, for Yahweh has done it; shout aloud, depths of the earth. Break forth into singing, O mountains, O forest, and every tree in it; for Yahweh has redeemed Jacob[c][b], and in Israel he displays his glory.
translation:
  language: ru
  text: 'Ликуйте, небеса, ведь Яхве совершил это[a]!


    Громко восклицайте, глубины земли[b]!


    Разразитесь радостным пением, горы,


    лес и каждое дерево в нём!


    Ведь Яхве искупил Иакова


    и в Израиле являет свою славу[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь Яхве совершил»; или: «ведь Яхве действовал». В еврейском тексте объект глагола «совершил» не назван.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нижние области земли».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «прославляет себя в Израиле»; или: «показывает себя славным в Израиле».'
    reason: alternative_reading
lexical_decisions:
- source_word: רָנּוּ
  choice: Ликуйте
  rationale: Императив רנן выражает громкую, радостную хвалу; «ликуйте» естественно передаёт её торжественный характер и не ограничивает действие только пением.
- source_word: כִּי עָשָׂה יְהוָה
  choice: ведь Яхве совершил это
  rationale: Объект глагола עשה в еврейском тексте не назван. Местоимение «это» по-русски делает абсолютное употребление естественным, не уточняя, что именно совершено.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: הָרִיעוּ
  choice: Громко восклицайте
  rationale: Hифиль רוע обозначает громкий возглас или победное ликование; сочетание передаёт силу призыва без излишнего уточнения его причины.
- source_word: תַּחְתִּיּוֹת אָרֶץ
  choice: глубины земли
  rationale: Естественный поэтический эквивалент выражения о нижних областях земли, сохраняющий вселенский размах обращения.
- source_word: פִּצְחוּ ... רִנָּה
  choice: Разразитесь радостной песней
  rationale: Сочетание передаёт внезапный, неудержимый всплеск радостного пения, выраженный глаголом פצח и существительным רנה.
- source_word: יַעַר וְכָל עֵץ בּוֹ
  choice: лес и каждое дерево в нём
  rationale: Сохраняет коллективное единственное число «лес» и отдельное упоминание каждого находящегося в нём дерева.
- source_word: גָאַל
  choice: искупил
  rationale: Глагол גאל обозначает избавление или возвращение того, на кого есть право родства; «искупил» сохраняет его библейскую и богословскую ёмкость.
- source_word: יִתְפָּאָר
  choice: являет свою славу
  rationale: Форма hitpael указывает на проявление Богом собственного величия или славы. Выражение естественно по-русски и не делает Израиль грамматическим субъектом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл יִתְפָּאָר в заключительной строке
  choice: в Израиле являет свою славу
  alternative: в Израиле прославляет себя; в Израиле показывает себя славным
  rationale: Выбранная формулировка сохраняет Бога как субъекта и передаёт проявление его славы через Израиль, не сводя форму к тому, что Израиль прославляет Бога.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим ритмом. Параллельные повелительные обращения к небесам, глубинам земли, горам и лесу сохранены; архаические звательные частицы и тяжеловесная церковнославянская лексика не используются.
