base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/024.yaml
  text: 'Thus says Yahweh[a], your Redeemer, who formed you from the womb: I am Yahweh, who makes all things, who alone stretched out the heavens, who spread out the earth by myself.'
translation:
  language: ru
  text: 'Так говорит Яхве, твой Искупитель, образовавший тебя в утробе: «Я — Яхве, творящий всё. Я один распростёр небеса, сам распростёр землю[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последние еврейские слова трудны для истолкования. Возможное прочтение: «кто был со Мною?» В любом случае контекст подчёркивает, что Яхве творил один, без помощника.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: גֹּאֲלֶךָ
  choice: твой Искупитель
  rationale: Сохраняет смысл избавителя и защитника, включая заветные и родственные оттенки глагола גאל, не уточняя сверх текста роль родственника-искупителя.
- source_word: וְיֹצֶרְךָ מִבָּטֶן
  choice: создавший тебя ещё в материнской утробе
  rationale: Естественно передаёт образ намеренного формирования человека до рождения; «создавший» понятно современному читателю, а упоминание утробы сохраняет исходный образ.
- source_word: עֹשֶׂה כֹּל
  choice: сотворивший всё
  rationale: Передаёт всеохватность творческой деятельности Яхве и естественно звучит в контексте описания Творца.
- source_word: נֹטֶה שָׁמַיִם לְבַדִּי
  choice: Я один распростёр небеса
  rationale: «Распростёр» сохраняет пространственный образ נטה, а «один» прямо выражает исключительность Божьего действия в לְבַדִּי.
- source_word: רֹקַע הָאָרֶץ
  choice: расстелил землю
  rationale: Передаёт образ разворачивания или распластывания поверхности без неуместно технического образа ковки.
- source_word: מֵאִתִּי / מי אתי
  choice: сам
  rationale: Основной текст передаёт контекстуальный смысл самостоятельного действия Яхве, а трудность еврейской формы и возможное вопросительное прочтение сохраняются в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное заветное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Исключительное участие Бога в сотворении
  choice: «Я один… сам…»
  alternative: «кто был со Мной?»
  rationale: Контекст ясно подчёркивает, что Яхве творил без помощника, однако трудное окончание еврейского текста допускает вопросительное понимание; оно вынесено в сноску, а не устранено.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Параллельные глаголы «распростёр» и «расстелил» сохраняют поэтическую образность; короткие самостоятельные предложения делают провозглашение ясным и торжественным.
