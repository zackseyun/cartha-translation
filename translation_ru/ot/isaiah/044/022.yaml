base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/022.yaml
  text: I have wiped away your transgressions like a cloud[a], and your sins like a mist. Return to me[c][b], for I have redeemed you.
translation:
  language: ru
  text: Я стёр твои преступления, как облако[a], и твои грехи — как тучу. Вернись ко Мне[b], ведь Я искупил тебя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я изгладил твои преступления, как облако, и твои грехи — как облако». В еврейском тексте употреблены два близких слова, обозначающих облако; первое может подразумевать густое облако.'
    reason: lexical_alternative
  - marker: b
    text: '«Вернись ко Мне» можно также передать: «Обратись ко Мне»; призыв подразумевает возвращение к Богу и покаяние.'
    reason: lexical_alternative
  - marker: c
    text: 'В пророческой речи перфектные формы могут выражать несомненное будущее: «Я сотру… Я искуплю тебя».'
    reason: alternative_reading
lexical_decisions:
- source_word: מָחִיתִי
  choice: Я стёр
  rationale: Глагол מחה означает стирать, изглаживать, уничтожать. «Стёр» естественно по-русски передаёт полное устранение и сочетается с образом рассеивающихся облака и тумана.
- source_word: כָעָב
  choice: как облако
  rationale: Предлог כ выражает сравнение, а עָב обозначает облако, нередко густое. «Как облако» сохраняет образ и допускает подразумеваемое рассеивание.
- source_word: פְּשָׁעֶיךָ
  choice: твои преступления
  rationale: פשע обозначает нарушение, мятеж или преступление против установленной верности. «Преступления» сохраняет нравственно-правовую силу слова, не сужая её до политического мятежа.
- source_word: וְכֶעָנָן
  choice: и ... как туман
  rationale: עָנָן обычно означает облако, однако в параллели с עָב различение посредством слова «туман» сохраняет поэтическое варьирование и образ исчезающей дымки.
- source_word: חַטֹּאותֶיךָ
  choice: твои грехи
  rationale: «Грехи» — прямой и контекстуально точный эквивалент חטאות; он естественно образует параллель с «преступлениями».
- source_word: שׁוּבָה אֵלַי
  choice: Вернись ко Мне
  rationale: Императив שוב с אֵלַי призывает возвратиться к Богу и несёт как личный, так и заветный оттенок покаяния. «Вернись ко Мне» кратко и естественно передаёт оба аспекта.
- source_word: כִּי
  choice: ведь
  rationale: 'כִּי вводит основание призыва: возвращение возможно и требуется в свете совершённого Богом искупления. «Ведь» естественно передаёт пояснительно-причинную связь.'
- source_word: גְאַלְתִּיךָ
  choice: Я искупил тебя
  rationale: גאל — значимый термин освобождения и возвращения принадлежащего близким защитником-искупителем. «Искупил» сохраняет широкий библейско-богословский смысл, не уточняя механизм сверх текста.
theological_decisions:
- issue: Видо-временное значение перфектных форм מָחִיתִי и גְאַלְתִּיךָ
  choice: 'Прошедшее совершённое действие с сохраняющимся результатом: «Я стёр… Я искупил»'
  alternative: 'Пророческий перфект с будущим значением: «Я сотру… Я искуплю»'
  rationale: Еврейский перфект в данном контексте естественно представляет очищение и искупление как совершённые либо несомненно гарантированные Божьи действия, на которых основан призыв вернуться. Русское прошедшее время хорошо передаёт завершённость; возможное пророческое будущее сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным, но общепонятным звучанием. Заглавная буква в «Мне» следует принятой русской библейской издательской норме для местоимения, относящегося к Богу. Поэтический параллелизм сохранён; тире во второй строке восполняет опущенный еврейский глагол без его ненужного повтора.
