base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/009.yaml
  text: All who fashion an idol are nothing[a], and the things they delight in do not profit. Their witnesses neither see nor know[d][c][b], so that they will be put to shame.
translation:
  language: ru
  text: Все, кто создаёт идола, — ничто[a], и то, чем они дорожат, не приносит пользы[b]. Их свидетели сами ничего не видят и не знают[c], так что они будут посрамлены[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все создатели изваяний — пустота»; или: «все, кто делает изваяния, — тщета».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их драгоценности»; или: «их желанные вещи».'
    reason: lexical_alternative
  - marker: c
    text: Слова «их свидетели» могут относиться к поклонникам, свидетельствующим в пользу идолов, либо, иронически, к самим идолам.
    reason: alternative_reading
  - marker: d
    text: 'Или: «чтобы они были посрамлены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹצְרֵי פֶסֶל
  choice: все, кто создаёт идола
  rationale: Причастие от יצר обозначает формирование, изготовление, а פֶסֶל — изваяние или идола. «Создаёт идола» естественно по-русски передаёт как сам процесс изготовления, так и культовый характер предмета.
- source_word: כֻּלָּם
  choice: все, кто
  rationale: Местоимение естественно объединено с причастным оборотом; это сохраняет всеобщность утверждения без тяжеловесного «создатели идола, все они».
- source_word: תֹּהוּ
  choice: ничто
  rationale: В данном контексте слово выражает пустоту, тщетность и полную несостоятельность, а не первозданный хаос. «Ничто» сохраняет резкость пророческой полемики, не утверждая буквально метафизическое небытие этих людей.
- source_word: וַחֲמוּדֵיהֶם
  choice: то, чем они дорожат
  rationale: Существительное от חמד обозначает желанное, ценное или дорогое. Формулировка сохраняет эмоциональный оттенок и не уточняет сверх текста, идёт ли речь именно об идолах или шире — о драгоценных культовых предметах.
- source_word: בַּל יוֹעִילוּ
  choice: не приносит пользы
  rationale: Глагол означает приносить пользу или выгоду. Русская формулировка ясна, естественна и сохраняет практическую бесполезность предметов.
- source_word: וְעֵדֵיהֶם הֵמָּה
  choice: их свидетели сами
  rationale: «Их свидетели» сохраняет притяжательную связь и неоднозначность референта, а «сами» передаёт усилительное הֵמָּה.
- source_word: בַּל יִרְאוּ וּבַל יֵדְעוּ
  choice: ничего не видят и не знают
  rationale: Двойное отрицание передаёт обвинение в слепоте и неведении. По-русски сочетание «ничего не видят и не знают» звучит естественно и охватывает оба глагола.
- source_word: לְמַעַן יֵבֹשׁוּ
  choice: так что они будут посрамлены
  rationale: לְמַעַן допускает оттенок цели или результата. «Так что» передаёт вероятный результативный смысл, а «будут посрамлены» — состояние позора, выраженное בוש.
theological_decisions:
- issue: К кому относятся слова «их свидетели»
  choice: 'В основном тексте референт не уточнён: «их свидетели» могут быть людьми, свидетельствующими в пользу идолов.'
  alternative: Идолы сами иронически названы свидетелями.
  rationale: Следующие слова о неспособности видеть и знать применимы и к идолопоклонникам, и, в ироническом смысле, к идолам. Неоднозначность еврейского текста сохранена и пояснена в примечании.
- issue: Смысл תֹּהוּ
  choice: 'Полная тщетность и несостоятельность: «ничто».'
  alternative: «Пустота», «тщета» или «хаос».
  rationale: Контекст осуждает бесполезность создателей идолов и их произведений. Перевод не превращает это в отдельное метафизическое утверждение и сохраняет полемическую силу текста.
- issue: Цель или результат в לְמַעַן יֵבֹשׁוּ
  choice: 'Результат: «так что они будут посрамлены».'
  alternative: 'Цель: «чтобы они были посрамлены».'
  rationale: Обе связи грамматически возможны. В основном тексте выбран естественный для контекста оттенок результата, а возможный целевой смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Краткие параллельные конструкции сохраняют резкость обличения; неоднозначности относительно «свидетелей» и значения לְמַעַן не устранены молча.
