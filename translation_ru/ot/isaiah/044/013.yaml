source:
  edition: WLC
  text: חָרַ֣שׁ עֵצִים֮ נָ֣טָה קָו֒ יְתָאֲרֵ֣/הוּ בַ/שֶּׂ֔רֶד יַעֲשֵׂ֨/הוּ֙ בַּ/מַּקְצֻע֔וֹת וּ/בַ/מְּחוּגָ֖ה יְתָאֳרֵ֑/הוּ וַֽ/יַּעֲשֵׂ֨/הוּ֙ כְּ/תַבְנִ֣ית אִ֔ישׁ כְּ/תִפְאֶ֥רֶת אָדָ֖ם לָ/שֶׁ֥בֶת בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/013.yaml
  text: The woodworker stretches out a line; he marks it out with a stylus; he shapes it with planes[a], and marks it out with a compass. He makes it like the form of a man, like the beauty of a human, to dwell in a house.
translation:
  language: ru
  text: Мастер по дереву натягивает шнур, размечает чертилом, обрабатывает резцами[a] и очерчивает циркулем. Он делает его подобием мужчины, подобно красоте человека, чтобы оно пребывало в доме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рубанками»; точное значение еврейского названия инструментов неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרַשׁ עֵצִים
  choice: плотник
  rationale: Сочетание буквально обозначает мастера по дереву; «плотник» — естественное и понятное русское наименование такого ремесленника в данном контексте.
- source_word: נָטָה קָו
  choice: натягивает мерный шнур
  rationale: Передаёт физическое действие и назначение קָו как линии или шнура для разметки.
- source_word: יְתָאֲרֵהוּ בַשֶּׂרֶד
  choice: намечает образец чертилом
  rationale: Глагол означает очерчивание или разметку, а редкое שֶׂרֶד — вероятно, инструмент для нанесения линий; конкретный материал инструмента не уточняется.
- source_word: יַעֲשֵׂהוּ בַּמַּקְצֻעוֹת
  choice: обрабатывает его резцами
  rationale: Редкое множественное существительное обозначает деревообрабатывающие режущие инструменты; «резцы» сохраняют конкретность, не утверждая сомнительное узкое значение «рубанки».
- source_word: וּבַמְּחוּגָה יְתָאֳרֵהוּ
  choice: очерчивает циркулем
  rationale: מְחוּגָה обозначает инструмент для проведения окружностей или дуг; «циркуль» — точный современный эквивалент.
- source_word: כְּתַבְנִית אִישׁ
  choice: облик мужчины
  rationale: תַּבְנִית означает форму или образ, а אִישׁ здесь указывает на мужскую человеческую фигуру.
- source_word: כְּתִפְאֶרֶת אָדָם
  choice: человеческое великолепие
  rationale: תִּפְאֶרֶת допускает значения красоты, великолепия и украшенности; формулировка сохраняет возвышенный оттенок и родовое значение אָדָם.
- source_word: לָשֶׁבֶת בָּיִת
  choice: чтобы тот находился в доме
  rationale: יָשַׁב может означать сидеть, пребывать или обитать. Нейтральное «находился» сохраняет иронию неподвижного рукотворного образа и не уточняет «дом» как святилище.
theological_decisions:
- issue: Соотношение אִישׁ и אָדָם
  choice: «облик мужчины, человеческое великолепие»
  alternative: «образ человека, красота человеческая»
  rationale: אִישׁ естественно передаёт мужскую фигуру, тогда как אָדָם имеет более общее значение человека; различие между словами сохранено без догматического истолкования.
- issue: Значение לָשֶׁבֶת применительно к идолу
  choice: «чтобы тот находился в доме»
  alternative: «чтобы обитать в доме» или «чтобы сидеть в доме»
  rationale: Исходное выражение допускает пребывание, обитание или сидение. Выбранный вариант не приписывает идолу действительной жизни, но и не устраняет заложенную в тексте иронию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Последовательность ремесленных действий передана наглядно; редкие названия инструментов не конкретизированы сверх данных еврейского текста. Местоимение «тот» помогает ясно отнести заключительную цель к изготовленному образу.
