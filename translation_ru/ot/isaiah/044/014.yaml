base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/014.yaml
  text: He cuts down cedars for himself[a], or he takes a cypress tree or an oak and chooses it from among the trees of the forest. He plants a pine[c][b], and the rain makes it grow.
translation:
  language: ru
  text: Он рубит себе кедры, берёт кипарис[a] и дуб и даёт им окрепнуть среди лесных деревьев[b]. Он сажает сосну[c], и дождь растит её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское תִּרְזָה обозначает породу дерева, точное определение которой неизвестно; возможны также переводы «каменный дуб», «теревинф» или «вяз».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и выбирает их себе среди лесных деревьев». Еврейская фраза трудна и может говорить либо о том, что деревьям дают окрепнуть, либо о выборе крепких деревьев в лесу.'
    reason: alternative_reading
  - marker: c
    text: Еврейское אֹרֶ обозначает породу дерева, точное определение которой неизвестно; предлагаются также варианты «пихта», «ясень» или «лавр».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִכְרָת ל֣וֹ אֲרָזִים
  choice: Он рубит себе кедры
  rationale: Инфинитив с ל продолжает описание действий мастера; в русском естественно передать его личной формой настоящего времени. לּוֹ выражает действие для собственной пользы.
- source_word: וַיִּקַּח תִּרְזָה וְאַלּוֹן
  choice: берёт кипарис или дуб
  rationale: תִּרְזָה обозначает не вполне определённую породу дерева; «кипарис» — распространённый и уместный по контексту вариант. Союз перед אַלּוֹן передан как «или», поскольку перечисляются возможные виды древесины, а не обязательно два одновременно взятых дерева.
- source_word: וַיְאַמֶּץ ל֖וֹ בַּעֲצֵי יָעַר
  choice: и даёт ему окрепнуть среди лесных деревьев
  rationale: Глагол אמץ имеет значение «укреплять, делать сильным». Формулировка сохраняет образ дерева, крепнущего среди леса, не скрывая при этом трудности сжатой еврейской конструкции; возможное понимание как выбора крепкого дерева отмечено в сноске.
- source_word: נָטַע אֹרֶ
  choice: Он сажает сосну
  rationale: אֹרֶ — редкое название дерева с неуверенной ботанической идентификацией. «Сосна» — один из правдоподобных традиционных вариантов; неопределённость вынесена в сноску.
- source_word: וְגֶשֶׁם יְגַדֵּל
  choice: и дождь взращивает её
  rationale: 'Порода הִפְעִיל передаёт причинное значение: дождь заставляет дерево расти. «Взращивает» кратко и естественно выражает это в литературном русском языке.'
theological_decisions:
- issue: Сжатое описание выбора или выращивания дерева в контексте обличения идолопоклонства
  choice: 'Передать действия как обычный процесс заготовки и выращивания древесины: человек рубит или берёт дерево, даёт ему окрепнуть, сажает другое, а дождь его взращивает.'
  alternative: Понять וַיְאַמֶּץ לּוֹ как «выбирает себе крепкое дерево среди лесных деревьев».
  rationale: 'Основное значение אמץ связано с укреплением, поэтому оно сохранено в тексте. Однако синтаксис допускает контекстуальное понимание выбора крепкого дерева, и эта подлинная неоднозначность отмечена в сноске. Так сохраняется и ирония отрывка: материал будущего идола — обыкновенное дерево, рост которого зависит от дождя.'
translation_notes:
  register: Современный литературный русский язык, ясный для широкого читателя. Сохранены лаконичная последовательность действий и иронический подтекст исходного отрывка; ботаническая и синтаксическая неопределённость не устранена, а обозначена сносками.
