source:
  edition: WLC
  text: כֹּה אָמַ֨ר יְהוָ֥ה עֹשֶׂ֛/ךָ וְ/יֹצֶרְ/ךָ֥ מִ/בֶּ֖טֶן יַעְזְרֶ֑/ךָּ אַל תִּירָא֙ עַבְדִּ֣/י יַֽעֲקֹ֔ב וִ/ישֻׁר֖וּן בָּחַ֥רְתִּי בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/002.yaml
  text: 'Thus says Yahweh[a], your Maker and the one who formed you from the womb, who will help you: Do not fear, my servant Jacob, Jeshurun, whom I have chosen.'
translation:
  language: ru
  text: 'Так говорит Яхве, создавший тебя, сформировавший тебя в утробе, — Он поможет тебе: «Не бойся, мой слуга Иаков, Иешурун[a], которого Я избрал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Иешурун — поэтическое имя Израиля, вероятно означающее «прямой», «праведный».
    reason: Сноска сохраняет вероятное лексическое значение поэтического имени, переданного транслитерацией в основном тексте.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, сохраняя его заветный характер и не заменяя титулом.
- source_word: עֹשֶׂךָ
  choice: создавший тебя
  rationale: Причастная форма от עשה обозначает Бога как Творца Израиля; русское выражение естественно и сохраняет личную направленность действия.
- source_word: וְיֹצֶרְךָ
  choice: и придавший тебе облик
  rationale: Глагол יצר подразумевает намеренное формирование, подобное работе горшечника; формулировка отличает его от более общего עשה — «создать».
- source_word: מִבֶּטֶן
  choice: ещё в утробе
  rationale: Сохраняет образ формирования до рождения и естественно выражает его по-русски; «утроба» оставляет материнский контекст подразумеваемым, как в еврейском тексте.
- source_word: יַעְזְרֶךָּ
  choice: Он поможет тебе
  rationale: Имперфект передан будущим временем как обещание помощи; отдельная предикативная конструкция ясно отражает переход от описания Яхве к заверению.
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Краткий и обычный русский эквивалент еврейского запрета.
- source_word: עַבְדִּי
  choice: мой слуга
  rationale: В данном заветном обращении слово обозначает принадлежащего Богу и служащего Ему Израиля; «слуга» естественнее контекстуального значения, чем «раб», не отрицая диапазона еврейского слова.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Устоявшаяся русская форма имени, здесь также обозначающего Израиль как единое лицо.
- source_word: וִישֻׁרוּן
  choice: Иешурун
  rationale: Поэтическое имя Израиля сохранено как имя собственное; вероятный смысл пояснён в сноске.
- source_word: בָּחַרְתִּי בוֹ
  choice: которого Я избрал
  rationale: Относительное придаточное естественно передаёт еврейский перфект с местоименным дополнением и сохраняет мотив Божьего избрания.
theological_decisions:
- issue: Единственное число при собирательном обращении к Израилю
  choice: 'Сохранено обращение в единственном числе: «тебя», «тебе», а Иаков и Иешурун даны как соотнесённые именования адресата.'
  alternative: Передать смысл множественным числом или прямо подставить «Израиль».
  rationale: Еврейский текст персонифицирует весь народ как одного адресата; сохранение единственного числа передаёт пророческий и заветный образ без истолковывающего расширения.
- issue: Передача имени יְשֻׁרוּן
  choice: Имя «Иешурун» оставлено в основном тексте, а его вероятное значение вынесено в сноску.
  alternative: Перевести непосредственно как «праведный» или «прямодушный».
  rationale: Слово функционирует как поэтическое имя Израиля; транслитерация сохраняет этот статус, а сноска сообщает важный смысловой оттенок.
- issue: Временная форма יַעְזְרֶךָּ
  choice: 'Передана обещанием: «Он поможет тебе».'
  alternative: 'Передать настоящим временем: «Он помогает тебе» или атрибутивно: «твой помощник».'
  rationale: Еврейский имперфект допускает контекстуальные оттенки, но после описания творящего Бога и перед призывом не бояться естественно звучит заверение в предстоящей помощи; настоящее значение не вводится как единственно возможное.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Два близких глагола עשה и יצר разведены как «создать» и «придать облик». Тире перед обещанием помощи устраняет синтаксическую тяжеловесность, не меняя последовательности мысли. Маркер [a] поставлен непосредственно после имени Иешурун, к которому относится сноска.
