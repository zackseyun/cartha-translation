  to: 'Он не задумывается об этом; нет у него ни знания, ни разумения, чтобы сказать: «Половину его я сжёг в огне, на углях от него испёк хлеб, зажарил мясо и поел. Неужели я превращу оставшееся в мерзость? Неужели поклонюсь деревянному чурбану[a]?»'
  rationale: Уточнена синтаксическая связь между «оставшимся» и «мерзостью», чтобы передать изготовление предмета поклонения из остатка древесины, не добавляя слова «идол», которого в самом стихе нет. Заключительные риторические вопросы разделены для сохранения еврейского параллелизма. Сноска и её привязка сохранены.
