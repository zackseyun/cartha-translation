  text: וְ/לֹא יָשִׁ֣יב אֶל לִבּ֗/וֹ וְ/לֹ֨א דַ֥עַת וְ/לֹֽא תְבוּנָה֮ לֵ/אמֹר֒ חֶצְי֞/וֹ שָׂרַ֣פְתִּי בְמוֹ אֵ֗שׁ וְ֠/אַף אָפִ֤יתִי עַל גֶּחָלָי/ו֙ לֶ֔חֶם אֶצְלֶ֥ה בָשָׂ֖ר וְ/אֹכֵ֑ל וְ/יִתְר/וֹ֙ לְ/תוֹעֵבָ֣ה אֶעֱשֶׂ֔ה לְ/ב֥וּל עֵ֖ץ אֶסְגּֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/019.yaml
  text: And he does not take it to heart[a], and there is no knowledge or understanding to say, “I burned half of it in the fire; I also baked bread on its coals; I roasted meat and ate. Shall I make the rest of it into an abomination? Shall I bow down to a block of wood?”
translation:
  language: ru
  text: 'Он не задумывается об этом; нет у него ни знания, ни разумения, чтобы сказать: «Половину его я сжёг в огне, на углях от него испёк хлеб, зажарил мясо и поел. Неужели я превращу оставшееся в мерзость? Неужели поклонюсь деревянному чурбану[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «куску дерева» или «полену». Еврейское выражение звучит презрительно и подчёркивает, что идол — всего лишь дерево.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׁיב אֶל לִבּוֹ
  choice: задумается об этом
  rationale: Идиома означает обратить мысль к чему-либо, внутренне обдумать. Такой перевод естественен по-русски и не привносит эмоционального оттенка выражения «принять близко к сердцу».
- source_word: דַעַת וְלֹא תְבוּנָה
  choice: ни знания, ни разумения
  rationale: 'Сохранена парность двух понятий: דַעַת обозначает знание, а תְבוּנָה — понимание, разумение или проницательность.'
- source_word: חֶצְיוֹ
  choice: половину его
  rationale: Местоименный суффикс отсылает к куску дерева, о котором говорится в контексте.
- source_word: בְמוֹ אֵשׁ
  choice: в огне
  rationale: Естественная русская передача обстоятельства сжигания без тяжеловесного буквального оборота.
- source_word: וְאַף אָפִיתִי עַל גֶּחָלָיו לֶחֶם
  choice: на углях от него испёк хлеб
  rationale: אַף передаёт добавочное усиление, выраженное здесь последовательностью действий; суффикс в גֶּחָלָיו отнесён к сожжённому дереву, поэтому «угли от него» устраняет возможную неясность.
- source_word: אֶצְלֶה בָשָׂר וְאֹכֵל
  choice: зажарил мясо и поел
  rationale: צלה означает жарить над огнём. Русское прошедшее время естественно продолжает перечисление уже совершённых действий в прямой речи.
- source_word: וְיִתְרוֹ
  choice: из остатка
  rationale: Слово обозначает оставшуюся часть и прямо противопоставлено ранее упомянутой половине.
- source_word: לְתוֹעֵבָה
  choice: мерзость
  rationale: Сильное слово сохраняет религиозно-нравственное отвращение, выраженное תוֹעֵבָה, и пророческую резкость текста.
- source_word: לְבוּל עֵץ
  choice: деревянному чурбану
  rationale: Выражение презрительно сводит идола к простому куску дерева. «Деревянный чурбан» естественно передаёт эту насмешливую силу по-русски.
theological_decisions:
- issue: Сохранение пророческой насмешки над материалом идола
  choice: деревянному чурбану
  alternative: куску дерева; полену
  rationale: Контраст между деревом как обычным топливом и тем же деревом как предметом поклонения составляет острие стиха. Выбранное выражение сохраняет презрительный тон, не добавляя отдельного богословского толкования.
- issue: Риторический характер заключительных глаголов первого лица
  choice: Неужели из остатка я сделаю мерзость и поклонюсь…?
  alternative: Из остатка я сделаю мерзость; деревянному чурбану поклонюсь
  rationale: 'Контекст внутреннего рассуждения требует риторического вопроса: человек должен был бы осознать нелепость изготовления идола из остатка топлива. При этом оба действия оставлены в одной вопросительной конструкции.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис внутреннего монолога сделан ясным для обычного читателя; презрительная образность оригинала сохранена без архаизации. Маркер сноски поставлен у выражения, к которому относится пояснение.
