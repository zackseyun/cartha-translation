  yaml_path: translation/ot/isaiah/044/028.yaml
  text: who says of Cyrus, ‘He is my shepherd, and he will fulfill all my purpose,’ saying of Jerusalem, ‘She will be rebuilt,’ and of the temple, ‘Its foundation will be laid.’
translation:
  language: ru
  text: 'который говорит о Кире: «Он — Мой пастырь и исполнит всё, чего Я желаю», — об Иерусалиме: «Он будет отстроен», и о храме: «Основание храма будет заложено».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כּוֹרֶשׁ
  choice: Кир
  rationale: Общепринятая русская форма имени персидского царя Кира.
- source_word: רֹעִי
  choice: Мой пастырь
  rationale: Сохраняет прямую метафору исходного текста и притяжательное значение суффикса первого лица.
- source_word: חֶפְצִי
  choice: всё, чего Я желаю
  rationale: Передаёт волю и угодное Богу без сужения значения до заранее сформулированного «замысла».
- source_word: יַשְׁלִם
  choice: исполнит
  rationale: В данном контексте означает довести до осуществления, выполнить полностью.
- source_word: תִּבָּנֶה
  choice: будет отстроен
  rationale: Нифаль обозначает восстановительное строительство Иерусалима; мужской род согласован с русским названием города.
- source_word: תִּוָּסֵד
  choice: будет заложено его основание
  rationale: Естественно передаёт пассивную форму глагола יסד применительно к основанию храма.
theological_decisions:
- issue: Обозначение Кира как Божьего пастыря
  choice: Сохранена прямая речь «Он — Мой пастырь»
  alternative: «Кир — пастырь, поставленный Мною»
  rationale: Исходный текст прямо называет Кира Божьим пастырем; поясняющая перифраза неоправданно ослабила бы формулировку.
- issue: Значение חפץ
  choice: «всё, чего Я желаю»
  alternative: «весь Мой замысел»
  rationale: Выбрана формулировка, сохраняющая семантическую широту Божьего желания, воли и угодного Ему дела, не превращая слово в специальный термин о предопределённом плане.
- issue: Синтаксическая связь וְלֵאמֹר
  choice: «и говорит»
  alternative: «говоря»
  rationale: Форма буквально вводит последующее высказывание; русский параллелизм с первым «говорит» ясен, тогда как точная синтаксическая зависимость еврейской конструкции допускает некоторую шероховатость.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Заглавные буквы в местоимениях «Мой», «Я» обозначают Бога согласно принятой русской издательской традиции. Синтаксический параллелизм исходного текста сохранён без добавления толкований.
