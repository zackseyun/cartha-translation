    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Кратко и естественно передаёт пророческую формулу будущего состояния, сохраняя её торжественный характер без архаизации.
- source_word: טֶרֶם
  choice: прежде чем
  rationale: Ясно выражает, что Божий ответ предшествует зову.
- source_word: יִקְרָאוּ
  choice: они позовут
  rationale: Глагол קרא здесь означает обращённый к Богу зов, вероятно молитвенный; «позовут» сохраняет широту значения и не добавляет прямо слова «молиться».
- source_word: אֶעֱנֶה
  choice: Я отвечу
  rationale: Точно передаёт обычное значение ענה и естественно соотносится с обращённым зовом.
- source_word: עוֹד הֵם מְדַבְּרִים
  choice: пока они ещё говорят
  rationale: Передаёт продолжающееся действие и временное наложение, сохраняя порядок и смысл еврейской конструкции.
- source_word: אֶשְׁמָע
  choice: Я услышу
  rationale: Сохраняет основное значение שמע и не устраняет возможный смысл внимательного, благосклонного слышания.
theological_decisions:
- issue: Следует ли прямо обозначить молитвенный контекст
  choice: Сохранить общие глаголы «позовут», «отвечу» и «услышу».
  alternative: «Прежде чем они помолятся, Я отвечу» или «Я внемлю».
  rationale: Контекст подразумевает молитвенное обращение и Божью готовность ответить, однако еврейский текст употребляет более широкие слова. Перевод не конкретизирует их сверх исходного текста.
- issue: Смысл Божьего «слышания»
  choice: «Я услышу»
  alternative: «Я выслушаю» или «Я внемлю».
  rationale: '«Услышу» сохраняет лексическую открытость: в контексте это не простое восприятие звука, но перевод не подменяет исходный глагол явным толкованием о благосклонном принятии просьбы.'
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Заглавное «Я» употреблено как традиционное уважительное обозначение говорящего Бога. Двоеточие после «И будет» позволяет сохранить вводную пророческую формулу и избежать тяжеловесного «И произойдёт так, что».
