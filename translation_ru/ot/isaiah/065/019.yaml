base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/019.yaml
  text: I will rejoice in Jerusalem and delight in my people[a]; no longer will the sound of weeping be heard in her[c][b], or the sound of crying.
translation:
  language: ru
  text: Я буду радоваться об Иерусалиме и ликовать о Моём народе[a]. Не будет больше слышно в нём[b] ни плача, ни вопля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Я буду радоваться в Иерусалиме и ликовать среди Моего народа». Предлог ב обычно означает «в», но здесь может указывать и на предмет радости.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в ней». В еврейском тексте местоимение, относящееся к Иерусалиму, имеет женский род.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «крика о помощи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַלְתִּי
  choice: Я буду радоваться
  rationale: Глагол גיל выражает сильную радость, ликование. Будущее время естественно передаёт перспективный смысл обетований в контексте, несмотря на форму qatal.
- source_word: בִירוּשָׁלִַם
  choice: о Иерусалиме
  rationale: Хотя ב обычно имеет пространственное значение «в», при глаголе радости оно может обозначать предмет или повод радости. В русском «радоваться о Иерусалиме» сохраняет возвышенный тон и параллелизм с «о Моём народе»; буквальное «радоваться в Иерусалиме» также возможно и отмечено в сноске.
- source_word: וְשַׂשְׂתִּי
  choice: и ликовать
  rationale: שׂושׂ близок к גיל и обозначает радость или ликование. «Ликовать» сохраняет различие между двумя родственными глаголами и поэтическую насыщенность строки.
- source_word: בְעַמִּי
  choice: о Моём народе
  rationale: Предлог ב при глаголе радости естественно понимается как указание на предмет радости. Такое выражение в русском яснее буквального «ликовать в Моём народе», при этом последняя возможность сохранена в сноске.
- source_word: יִשָּׁמַע
  choice: будет слышно
  rationale: Нифаль глагола שׁמע имеет здесь пассивное значение «быть услышанным»; безличная русская конструкция звучит естественно.
- source_word: בָּהּ
  choice: в нём
  rationale: Местоимение женского рода относится к Иерусалиму. В современном русском название города грамматически мужского рода, поэтому «в нём» сохраняет референцию без неестественного нарушения согласования.
- source_word: עוֹד
  choice: больше
  rationale: 'В сочетании с отрицанием עוֹד указывает на прекращение: «больше не», «уже не».'
- source_word: קוֹל בְּכִי
  choice: плача
  rationale: Буквально «звук плача». В конструкции «не будет слышно» русское «плача» уже передаёт слуховой аспект и избегает избыточного «не будет слышно звука».
- source_word: וְקוֹל זְעָקָה
  choice: ни вопля
  rationale: זְעָקָה обозначает громкий крик, вопль или призыв о помощи. «Вопль» отличает его от тихого плача и сохраняет интенсивность исходного слова.
theological_decisions:
- issue: Отношение Божьей радости к Иерусалиму и народу
  choice: Передать ב как «о», обозначая предмет Божьей радости
  alternative: «в Иерусалиме» и «среди Моего народа» либо буквально «в Моём народе»
  rationale: Еврейский предлог допускает как пространственное, так и реляционное понимание. Основной русский текст выбирает естественное обозначение предмета радости, а сноска сохраняет подлинную неоднозначность без догматического уточнения.
- issue: Два близких глагола радости
  choice: «радоваться» и «ликовать»
  alternative: Повторить «радоваться» в обеих частях
  rationale: Разные русские глаголы отражают два разных, хотя и близких, еврейских слова и сохраняют поэтический параллелизм.
- issue: Род местоимения, относящегося к Иерусалиму
  choice: «в нём» по нормам современного русского согласования
  alternative: «в ней» для воспроизведения еврейского женского рода и олицетворения города
  rationale: В еврейском Иерусалим назван местоимением женского рода, но в русском название города мужского рода. «В нём» обеспечивает ясность; исходная форма и возможность олицетворённого прочтения отмечены в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Параллелизм сохранён; конструкция «не будет больше слышно… ни… ни…» естественна и передаёт повтор קוֹל без тяжеловесного буквального повтора. Заглавная буква в «Моём» соответствует традиционному русскому оформлению божественной речи, не добавляя толкования.
