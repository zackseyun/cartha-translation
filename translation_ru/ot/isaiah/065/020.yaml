  text: לֹא יִֽהְיֶ֨ה מִ/שָּׁ֜ם ע֗וֹד ע֤וּל יָמִים֙ וְ/זָקֵ֔ן אֲשֶׁ֥ר לֹֽא יְמַלֵּ֖א אֶת יָמָ֑י/ו כִּ֣י הַ/נַּ֗עַר בֶּן מֵאָ֤ה שָׁנָה֙ יָמ֔וּת וְ/הַ֣/חוֹטֶ֔א בֶּן מֵאָ֥ה שָׁנָ֖ה יְקֻלָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/020.yaml
  text: No more shall there be from there an infant of days[a], or an old man who does not fill out his days; for the youth will die a hundred years old[c][b], and the sinner a hundred years old will be accursed.
translation:
  language: ru
  text: Там больше не будет ни младенцев, живущих лишь несколько дней[a], ни стариков, не доживающих до полноты своих дней[b]; ведь юноша умрёт в сто лет, а грешник в сто лет будет проклят[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «младенец дней». То есть младенец, проживший всего несколько дней.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «который не наполнит своих дней»; то есть не проживёт весь отпущенный ему срок.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «столетний грешник будет проклят».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: там
  rationale: В русском экзистенциальном обороте «там не будет» естественно передаёт пространственное значение еврейского מִשָּׁם; буквальное «оттуда» здесь звучало бы неясно и неестественно.
- source_word: עוּל יָמִים
  choice: младенец, проживший лишь несколько дней
  rationale: Буквальный оборот «младенец дней» является еврейской идиомой и означает младенца, жизнь которого ограничилась немногими днями. Смысл передан естественным современным русским языком, а буквальная форма отмечена в сноске.
- source_word: זָקֵן אֲשֶׁר לֹא יְמַלֵּא אֶת יָמָיו
  choice: старик, который не дожил до полноты своих дней
  rationale: Формулировка сохраняет образ «наполнения» или завершения отпущенных дней и ясно выражает мысль о недостигнутой полноте жизни.
- source_word: הַנַּעַר
  choice: юноша
  rationale: נַעַר обозначает мальчика или молодого человека; «юноша» сохраняет контраст со столетним возрастом, не сужая значение до ребёнка.
- source_word: בֶּן־מֵאָה שָׁנָה
  choice: в сто лет
  rationale: Это естественная русская передача стандартного древнееврейского обозначения возраста «сын ста лет».
- source_word: יָמוּת
  choice: умрёт
  rationale: Имперфект в пророческом контексте естественно передаётся будущим временем; прямое значение глагола — физическая смерть.
- source_word: הַחוֹטֵא
  choice: грешник
  rationale: Субстантивированное причастие обозначает человека, характеризуемого грехом; «грешник» передаёт это кратко и точно.
- source_word: יְקֻלָּל
  choice: будет проклят
  rationale: Пуаль выражает состояние или действие проклятия. «Будет проклят» — сильная, но естественная русская формулировка, сохраняющая судебно-религиозный оттенок.
theological_decisions:
- issue: Смерть и проклятие в пророчестве о новом творении
  choice: Прямо передать слова о том, что юноша умрёт в сто лет, а столетний грешник будет проклят.
  alternative: Истолковать смерть исключительно образно или переформулировать стих так, чтобы устранить его напряжение с другими эсхатологическими текстами.
  rationale: Еврейский текст прямо употребляет глаголы «умрёт» и «будет проклят». Перевод сохраняет внутреннее богословское напряжение и не навязывает читателю его систематического разрешения.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Синтаксический параллелизм стиха сохранён; необычный образ столетнего юноши оставлен без поясняющей гармонизации.
