  text: וּ/בָנ֥וּ בָתִּ֖ים וְ/יָשָׁ֑בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/אָכְל֖וּ פִּרְיָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/021.yaml
  text: They will build houses and live in them[b][a]; they will plant vineyards and eat their fruit.
translation:
  language: ru
  text: Они будут строить дома и жить в них, будут сажать виноградники и есть их плоды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָנוּ בָתִּים
  choice: будут строить дома
  rationale: בנה означает «строить», а בָּתִּים — конкретно «дома». Будущее время передаёт значение форм перфекта в контексте пророческого обещания.
- source_word: וְיָשָׁבוּ
  choice: жить в них
  rationale: ישׁב здесь означает постоянное проживание. По-русски «жить в них» естественнее формального «обитать в них»; местоимение «них» восстанавливает подразумеваемое отношение к домам.
- source_word: וְנָטְעוּ כְרָמִים
  choice: будут сажать виноградники
  rationale: נטע означает «сажать», а כרמים — «виноградники», не просто отдельные лозы. Повтор «будут» делает параллельные части ясными и естественными по-русски.
- source_word: וְאָכְלוּ פִּרְיָם
  choice: есть их плоды
  rationale: אכל имеет прямое значение «есть», а פְּרִי с суффиксом 3-го лица множественного числа — «их плод(ы)». Русское множественное «плоды» естественно при множественном «виноградники» и сохраняет конкретный образ урожая.
theological_decisions:
- issue: Временное значение пророческих форм
  choice: Передать еврейские перфекты русским будущим временем
  alternative: Передать их прошедшим временем
  rationale: В контексте обещанного обновления эти действия относятся к будущему благополучию народа. Будущее время ясно передаёт пророческую направленность, не превращая описание в рассказ о прошлом.
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и ритмически параллельный. Сохранены конкретные образы домов, виноградников и плодов без добавления конфессиональных толкований.
