  text: וְ/הִנַּחְתֶּ֨ם שִׁמְ/כֶ֤ם לִ/שְׁבוּעָה֙ לִ/בְחִירַ֔/י וֶ/הֱמִיתְ/ךָ֖ אֲדֹנָ֣/י יְהוִ֑ה וְ/לַ/עֲבָדָ֥י/ו יִקְרָ֖א שֵׁ֥ם אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/015.yaml
  text: You will leave your name as a curse for my chosen ones[a], and the Lord Yahweh will put you to death[b]; but to his servants he will call another name.
translation:
  language: ru
  text: Вы оставите ваше имя как проклятие для моих избранных[a], и Господь Яхве предаст тебя смерти[b], а своих слуг Он назовёт другим именем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как клятву» — то есть ваше имя будут произносить в формуле проклятия.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте здесь происходит смена числа: после «вы оставите ваше имя» сказано «предаст тебя смерти».'
    reason: textual_clarity
lexical_decisions:
- source_word: וְהִנַּחְתֶּם שִׁמְכֶם
  choice: вы оставите своё имя
  rationale: Глагол в породе hифиль здесь означает «оставить после себя»; единственное «имя» передано собирательно, как в еврейском тексте.
- source_word: לִשְׁבוּעָה
  choice: как проклятие
  rationale: Основное значение — «клятва», но в данном контексте суда речь идёт об имени, употребляемом в формуле проклятия. Буквальная альтернатива сохранена в сноске.
- source_word: לִבְחִירַי
  choice: для моих избранных
  rationale: Передаёт субстантивированное множественное число с суффиксом первого лица без добавления гендерно ограничивающего существительного.
- source_word: וֶהֱמִיתְךָ
  choice: умертвит тебя
  rationale: Каузативная форма от מות означает «предать смерти, умертвить». Смена множественного числа на единственное в оригинале намеренно сохранена.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יהוה, избегая неестественного сочетания «Господь Яхве» и сохраняя оба элемента.
- source_word: וְלַעֲבָדָיו
  choice: а своих слуг
  rationale: Союз передан как противопоставление судьбе осуждённых. «Слуги» естественно выражает здесь принадлежность Богу и служение Ему, не выдвигая на первый план рабский статус.
- source_word: יִקְרָא שֵׁם אַחֵר
  choice: Он назовёт другим именем
  rationale: Естественная русская конструкция, близко передающая буквальное «назовёт/призовёт другое имя», то есть даст новое наименование.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка ГОСПОДЬ
  rationale: Сохраняется явное личное имя Бога и одновременно передаётся титул אֲדֹנָי; перевод не подменяет имя общим титулом.
- issue: Кого Бог называет другим именем
  choice: своих слуг Он назовёт другим именем
  alternative: для своих слуг Он наречёт другое имя
  rationale: Еврейская конструкция допускает некоторую сжатость, но наиболее естественно понимается как наделение Божьих слуг новым именем. Формулировка не уточняет содержание этого имени.
- issue: Смена числа адресата
  choice: «вы… ваше» сменяется на «тебя»
  alternative: 'полностью согласовать во множественном числе: «вас»'
  rationale: Масоретский текст действительно переходит от множественного числа וְהִנַּחְתֶּם / שִׁמְכֶם к единственному וֶהֱמִיתְךָ. Смена сохранена как возможное обращение к группе как к собирательному лицу.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Архаизмы сведены к минимуму; «умертвит» сохранено ради краткости и судебного оттенка. Заглавная буква в «Он» помогает однозначно соотнести подлежащее с Владыкой Яхве, тогда как притяжательные местоимения оставлены со строчной по современному издательскому употреблению.
