  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַתֶּם֙ עֹזְבֵ֣י יְהוָ֔ה הַ/שְּׁכֵחִ֖ים אֶת הַ֣ר קָדְשִׁ֑/י הַֽ/עֹרְכִ֤ים לַ/גַּד֙ שֻׁלְחָ֔ן וְ/הַֽ/מְמַלְאִ֖ים לַ/מְנִ֥י מִמְסָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/011.yaml
  text: But you are those who forsake Yahweh[a], who forget my holy mountain, who set a table for Gad[c][b], and who fill mixed wine for Meni.
translation:
  language: ru
  text: А вы — те, кто оставляет Яхве, кто забывает Мою святую гору, кто накрывает стол для Гада[a] и наливает для Мени[b] смешанное вино[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Гад, вероятно, имя божества, связанного с удачей; возможный перевод: «для Удачи».'
    reason: alternative_reading
  - marker: b
    text: 'Мени, вероятно, имя божества, связанного с судьбой; возможный перевод: «для Судьбы».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «смешанный напиток»; речь идёт о приготовленном напитке для возлияния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: А вы
  rationale: Самостоятельное местоимение с союзом обозначает контраст с предшествующим контекстом; «А вы» естественно передаёт этот переход по-русски.
- source_word: עֹזְבֵי יְהוָה
  choice: те, кто оставляет Яхве
  rationale: Причастие употреблено субстантивно и характеризует адресатов. «Оставляет» сохраняет прямой смысл עזב и его вес в контексте неверности Богу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: הַשְּׁכֵחִים
  choice: кто забывает
  rationale: Сохраняет прямое значение причастия и параллельную характеристику той же группы.
- source_word: אֶת הַר קָדְשִׁי
  choice: Мою святую гору
  rationale: Естественная русская передача еврейского выражения, относящегося к освящённой горе Бога, то есть Сиону.
- source_word: הָעֹרְכִים ... שֻׁלְחָן
  choice: кто накрывает стол
  rationale: В сочетании со словом «стол» ערך означает расставлять или приготовлять; «накрывать стол» — точное и естественное русское соответствие в данном культовом контексте.
- source_word: לַגַּד
  choice: для Гада
  rationale: גד, вероятнее всего, является именем божества, связанного с удачей; имя транслитерировано, а его смысл указан в сноске.
- source_word: וְהַמְמַלְאִים
  choice: и наполняет
  rationale: Сохраняется буквальное значение глагола «наполнять». Единственное число согласовано с повторяющейся русской конструкцией «те, кто».
- source_word: לַמְנִי
  choice: для Мени
  rationale: מני, вероятнее всего, является именем божества, связанного с судьбой; имя транслитерировано, а смысловая передача дана в сноске.
- source_word: מִמְסָךְ
  choice: чашу винной смесью
  rationale: Существительное обозначает приготовленный смешанный напиток, вероятно вино. «Чаша» эксплицирует подразумеваемый сосуд, который можно наполнить, не превращая напиток непосредственно в «жертвенное возлияние».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Имена или нарицательные значения גַּד и מְנִי
  choice: Гад и Мени как имена в основном тексте
  alternative: Удача и Судьба
  rationale: В контексте это, вероятнее всего, имена божеств или персонифицированных сил. Транслитерация сохраняет их статус имён, а сноски сообщают связанные с ними значения, не устраняя имеющуюся неоднозначность.
- issue: Характер напитка מִמְסָךְ
  choice: винная смесь
  alternative: смешанный напиток; возлияние
  rationale: Слово обозначает приготовленный смешанный напиток, но само по себе не требует переводить его как ритуальное «возлияние». Выбранная формулировка передаёт вероятный винный состав и сохраняет культовый смысл контекста без чрезмерного уточнения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Повтор «кто» сохраняет риторический параллелизм еврейских причастных конструкций; имена малоизвестных божеств пояснены сносками.
