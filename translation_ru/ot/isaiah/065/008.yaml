base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/008.yaml
  text: 'Thus says Yahweh: As when new wine is found in a cluster[a], and one says, ‘Do not destroy it, for there is a blessing in it,’ so I will act for the sake of my servants[b], so as not to destroy all of them.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Подобно тому как в виноградной грозди находят молодое вино[a] и кто-нибудь говорит: „Не уничтожай её, ведь в ней есть благословение“, — так и Я поступлю ради моих слуг, чтобы не уничтожить всех[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вино» или «свежее вино»; еврейское слово תִּירוֹשׁ обозначает именно новое, молодое вино.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы не уничтожить всё»; в еврейском тексте объект прямо не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчиво и естественно передаёт торжественную пророческую формулу.
- source_word: תִּירוֹשׁ
  choice: молодое вино
  rationale: Слово обозначает новое, свежее вино и сохраняет сельскохозяйственный образ текста.
- source_word: אֶשְׁכּוֹל
  choice: виноградная гроздь
  rationale: Контекст ясно указывает на гроздь винограда; уточнение делает образ сразу понятным по-русски.
- source_word: וְאָמַר
  choice: и говорят
  rationale: Безлично-неопределённая русская конструкция естественно передаёт еврейский глагол с неопределённым субъектом.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: Не уничтожай её
  rationale: Местоимение относится к грозди; женский род обусловлен русским существительным. «Уничтожай» сохраняет связь с повторением того же корня в конце стиха.
- source_word: כִּי בְרָכָה בּוֹ
  choice: ведь в ней есть благословение
  rationale: Сохраняет конкретное слово «благословение» и естественно выражает основание запрета.
- source_word: כֵּן אֶעֱשֶׂה
  choice: так и Я поступлю
  rationale: Ясно завершает сопоставление и естественно передаёт עשה в данном контексте.
- source_word: לְמַעַן עֲבָדַי
  choice: ради Моих слуг
  rationale: Передаёт мотив или целевую направленность לְמַעַן, не добавляя конфессиональных оттенков.
- source_word: לְבִלְתִּי הַשְׁחִית הַכֹּל
  choice: чтобы не уничтожить всех
  rationale: В контексте подразумеваются люди, подвергающиеся суду; русское «всех» естественно оставляет саму группу неназванной.
theological_decisions:
- issue: Подразумеваемое дополнение при הַכֹּל в заключительной фразе
  choice: «чтобы не уничтожить всех» — подразумеваются люди, о которых идёт речь
  alternative: «чтобы не уничтожить всё» или буквально «чтобы не уничтожить всё целиком»
  rationale: Контекст применения образа указывает на людей и Божьих слуг, однако еврейский текст прямо не называет дополнение. Основной текст передаёт контекстуальный смысл, а примечание сохраняет формальную неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Сельскохозяйственный образ сохранён без архаизмов; прямая речь оформлена так, чтобы ясно различались слова Яхве и речь внутри сравнения.
