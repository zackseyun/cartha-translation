base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/009.yaml
  text: And I will bring forth offspring from Jacob[a], and from Judah an heir of my mountains; my chosen ones will possess it[b], and my servants will dwell there.
translation:
  language: ru
  text: И произведу от Иакова потомство[a], а от Иуды — наследника Моих гор. Мои избранные унаследуют их[b], и Мои слуги будут жить там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семя». Еврейское זֶרַע — собирательное существительное в единственном числе, которое может означать семя, потомство или потомков.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «овладеют ими». Слова «наследник» и «унаследуют» передают один и тот же еврейский корень ירש, объединяющий значения наследования и вступления во владение. В еврейском тексте местоименный суффикс имеет форму женского рода единственного числа, хотя «Мои горы» стоят во множественном числе.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: И произведу
  rationale: Каузативная форма глагола יצא означает «вывести, произвести». В сочетании с זֶרַע русское «произведу потомство» естественно передаёт появление потомков, не добавляя толкования.
- source_word: מִיַּעֲקֹב זֶרַע
  choice: от Иакова потомство
  rationale: Предлог מן передан как «от», имя Иаков сохранено, а собирательное единственное זֶרַע — как «потомство».
- source_word: וּמִיהוּדָה יוֹרֵשׁ
  choice: а от Иуды — наследника
  rationale: Причастие יוֹרֵשׁ обозначает наследующего или овладевающего. «Наследник» сохраняет связь с последующим глаголом того же корня и хорошо сочетается с территориальным объектом.
- source_word: הָרָי
  choice: Моих гор
  rationale: Сохранён конкретный образ множественного числа «Мои горы» без сведения его к земле вообще или к исключительно духовному благословению.
- source_word: וִירֵשׁוּהָ
  choice: унаследуют их
  rationale: Глагол ירש повторяет корень слова «наследник» и может означать как наследование, так и вступление во владение. Местоимение «их» согласовано по смыслу с «горами»; необычный еврейский суффикс женского единственного числа отмечен в сноске.
- source_word: בְחִירַי
  choice: Мои избранные
  rationale: Передаёт людей, избранных Богом, без внесения более поздней конфессиональной терминологии.
- source_word: וַעֲבָדַי
  choice: Мои слуги
  rationale: В контексте отношений с Богом עֲבָדַי естественно передаётся словом «слуги»; оно сохраняет идею подчинённого служения без неуместного усиления до «рабов».
- source_word: יִשְׁכְּנוּ שָׁמָּה
  choice: будут жить там
  rationale: שכן обозначает устойчивое проживание или обитание. «Будут жить там» понятно современному читателю и сохраняет смысл длительного поселения.
theological_decisions:
- issue: Значение «Моих гор» и обещания наследия
  choice: Сохранить конкретное территориальное выражение «Моих гор».
  alternative: Передать обобщённо как «Мою землю» либо истолковать исключительно как духовное эсхатологическое благословение.
  rationale: Еврейский текст прямо говорит о горах Бога. Перевод сохраняет географический образ и связь с наследием, не решая в самом тексте вопрос о более широком богословском исполнении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок параллельных частей и конкретный образ гор сохранены; тире после «от Иуды» помогает ясно прочитать синтаксис.
