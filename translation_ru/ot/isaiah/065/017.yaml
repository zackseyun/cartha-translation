base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/017.yaml
  text: For behold[a], I am creating new heavens and a new earth; and the former things will not be remembered[b], nor will they come to mind.
translation:
  language: ru
  text: Ибо вот, Я творю новые небеса и новую землю; прежнее не вспомнится и не придёт на ум.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не взойдут на сердце» — еврейский оборот со значением «не придут на ум».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет пояснительно-причинную связь с предшествующим контекстом и соответствует достоинству пророческой речи.
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Передаёт указательно-привлекающую внимание силу еврейского оборота и подчёркнутое самоуказание говорящего.
- source_word: בוֹרֵא
  choice: творю
  rationale: Настоящее время передаёт причастную форму как совершаемое или несомненно предпринимаемое действие; «творю» естественно для контекста Божьего созидания.
- source_word: שָׁמַיִם חֲדָשִׁים
  choice: новые небеса
  rationale: Сохраняет космический смысл и устойчивое библейское звучание выражения, не сужая его до видимого неба.
- source_word: וָאָרֶץ חֲדָשָׁה
  choice: и новую землю
  rationale: В паре с «небесами» слово обозначает землю в широком, космическом смысле, а не только страну или территорию.
- source_word: הָרִאשֹׁנוֹת
  choice: прежнее
  rationale: Субстантивированное собирательное обозначение сохраняет широту оригинала и не уточняет без основания, идёт ли речь о событиях, бедствиях или прежнем порядке вещей.
- source_word: תִזָּכַרְנָה
  choice: не вспомнится
  rationale: Естественно передаёт пассивно-возвратный смысл нифаля и согласуется в русском языке с собирательным «прежнее».
- source_word: תַעֲלֶינָה עַל לֵב
  choice: не придёт на ум
  rationale: Передаёт значение еврейской идиомы естественным современным русским выражением; буквальный образ отмечен в сноске.
theological_decisions:
- issue: Масштаб обещанного обновления
  choice: «новые небеса и новую землю» сохранено как выражение космического масштаба
  alternative: понимать выражение исключительно как метафору политического или послепленного восстановления
  rationale: Парное выражение «небеса и земля» отсылает к языку творения. Перевод не сужает обещание, но и не навязывает стиху детально разработанную эсхатологическую схему.
- issue: Что именно обозначает «прежнее»
  choice: оставлено широкое собирательное обозначение
  alternative: уточнить как прежние бедствия, события или прежний мир
  rationale: Еврейский текст не называет конкретный референт, поэтому перевод сохраняет смысловую открытость и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Ибо вот» сохраняет торжественный ввод без архаического «се»; «не придёт на ум» передаёт идиому понятно для современного читателя. Прописная буква в «Я» отражает принятое в русской библейской традиции уважительное оформление прямой речи Бога.
