  text: who sit among the graves and spend the night in hidden places[a], who eat pig's flesh, and broth of unclean things is in their vessels[b];
translation:
  language: ru
  text: которые сидят среди могил и ночуют в скрытых местах[a], едят свиное мясо, и отвар из нечистого — в их сосудах[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово неясно; возможны также переводы: «в укромных местах», «в охраняемых местах» или, что менее вероятно в данном контексте, «в осаждённых местах».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «похлёбка» или «варево из нечистого либо отвратительного».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשְׁבִים בַּקְּבָרִים
  choice: которые сидят среди могил
  rationale: Причастие ישׁב передано конкретным «сидят», а בַּקְּבָרִים — естественным для данного контекста «среди могил», без добавочного истолкования обряда.
- source_word: וּבַנְּצוּרִים יָלִינוּ
  choice: и ночуют в укромных местах
  rationale: לין означает оставаться или проводить ночь. Значение редкого נְצוּרִים не вполне ясно; «укромные места» естественно передаёт вероятный смысл скрытых мест, а иные варианты отмечены в сноске.
- source_word: הָאֹכְלִים בְּשַׂר הַחֲזִיר
  choice: едят свиное мясо
  rationale: Сохраняется конкретное обозначение мяса свиньи и причастная характеристика людей; «свиное мясо» звучит современно и не ослабляет контекст ритуальной нечистоты.
- source_word: וּפְרַק פִּגֻּלִים
  choice: и отвар из нечистот
  rationale: Редкое פְּרַק, согласно традиционному пониманию, обозначает жидкое кушанье или отвар. פִּגֻּלִים указывает на ритуально нечистое либо отвратительное; «нечистоты» сохраняет резкость и допускает как вещества, так и куски нечистой пищи.
- source_word: כְּלֵיהֶם
  choice: в их сосудах
  rationale: כְּלִי — общее обозначение сосуда или ёмкости; «сосуды» сохраняет широту исходного слова и подходит к пищевому и ритуальному контексту.
theological_decisions:
- issue: Передача языка ритуально предосудительной пищи
  choice: Сохранены конкретные образы свиного мяса, нечистот и сосудов.
  alternative: Обобщить как «запрещённая пища» или усилить до «мерзостей».
  rationale: Исходный текст осуждает практики, связанные с нечистотой и недозволенным культом, но не формулирует здесь более широкого догматического вывода. Конкретная образность сохранена без привнесения позднейших конфессиональных категорий.
translation_notes:
  register: Современный литературный русский, с сохранением достоинства пророческой речи и конкретной, резкой образности оригинала. Синтаксис продолжает перечень характеристик из контекста; конечная точка с запятой сохранена как указание на незавершённость периода.
