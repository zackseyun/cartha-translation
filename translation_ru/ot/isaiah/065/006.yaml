lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную и торжественно-привлекающую внимание функцию частицы, оставаясь естественным в современном литературном русском.
- source_word: כְתוּבָה לְפָנָי
  choice: это записано предо Мною
  rationale: Передаёт причастную конструкцию как существующую перед Богом запись; «предо Мною» сохраняет образ оригинала и соответствует возвышенному регистру.
- source_word: לֹא אֶחֱשֶׂה
  choice: Я не умолкну
  rationale: Естественно выражает решимость не оставаться безмолвным и сохраняет переход от молчания к действию.
- source_word: כִּי אִם
  choice: но
  rationale: 'Передаёт противопоставление после отрицания: Бог не умолкнет, а совершит воздаяние.'
- source_word: שִׁלַּמְתִּי וְשִׁלַּמְתִּי
  choice: воздам — воздам
  rationale: Будущее время отражает определённое грядущее действие в пророческой речи, а повтор сохраняет усиление и твёрдость заявления.
- source_word: עַל חֵיקָם
  choice: им в лоно
  rationale: Сохраняет телесно-пространственный образ возвращённого человеку воздаяния; дательный «им» ясно обозначает адресата, не сводя образ к отвлечённому наказанию.
theological_decisions:
- issue: Видо-временное значение שִׁלַּמְתִּי / וְשִׁלַּמְתִּי
  choice: 'Будущее: «воздам — воздам»'
  alternative: 'Прошедшее или результативное: «Я уже воздал» / «Я воздал»'
  rationale: Хотя глагольные формы формально перфектные, в пророческом провозглашении суда они могут обозначать твёрдо решённое будущее действие. Контекст поддерживает объявление грядущего воздаяния.
- issue: Характер воздаяния
  choice: «воздам» без дополнительного уточнения
  alternative: «накажу» или «отомщу»
  rationale: Так сохраняется взаимно-судебная семантика שׁלם и не вносится более узкое богословское толкование, чем позволяет текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формы «предо Мною» и «лоно» оправданы образностью и торжественным характером пророческой речи; синтаксис остаётся ясным для современного читателя.
