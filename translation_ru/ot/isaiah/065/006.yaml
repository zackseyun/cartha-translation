  source_fidelity: Передача в целом точно отражает декларативную частицу הִנֵּה, образ записи перед Богом, отказ молчать и усиленное повторением обещание воздаяния. Будущее «воздам» оправдано пророческим контекстом. Однако עַל חֵיקָם буквально означает «на их колени / на их лоно», а не «в лоно»; в русском «лоно» также преимущественно воспринимается как архаичное или анатомическое слово и здесь звучит неясно.
