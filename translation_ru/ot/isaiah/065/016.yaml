base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/016.yaml
  text: whoever blesses himself in the land will bless himself by the God of truth[a], and whoever swears in the land will swear by the God of truth; because the former troubles are forgotten[c][b], and because they are hidden from my eyes.
translation:
  language: ru
  text: Кто благословляет себя[a] на земле[b], тот будет благословлять себя Богом истины[c], и кто клянётся на земле, тот будет клясться Богом истины, потому что прежние бедствия забыты и скрыты от Моих глаз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «провозглашает себя благословенным» или «призывает благословение на себя». Еврейский глагол имеет возвратную форму.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское אֶרֶץ может означать как «землю», так и «страну» или «край».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально возможно: «Богом Аминь»; также: «верным Богом». Еврейское אָמֵן выражает истинность, твёрдость, надёжность и верность.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּתְבָּרֵךְ / יִתְבָּרֵךְ
  choice: благословляет себя / будет благословлять себя
  rationale: Возвратная форма хитпаэль передана возвратной конструкцией. Хотя по-русски она звучит несколько необычно, она сохраняет смысл обращения благословения на самого себя; возможный оттенок провозглашения себя благословенным вынесен в сноску.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: Такой перевод естественен по-русски и не устраняет намеренно многозначность אֶרֶץ, которое может обозначать как землю вообще, так и конкретную страну или край.
- source_word: בֵּאלֹהֵי אָמֵן
  choice: Богом истины
  rationale: Здесь אָמֵן выступает необычным определением Бога и несёт значения истинности, надёжности и верности. «Богом истины» ясно и естественно передаёт выражение по-русски, а буквальная связь со словом «Аминь» и оттенок верности отмечены в сноске.
- source_word: הַנִּשְׁבָּע / יִשָּׁבַע
  choice: клянётся / будет клясться
  rationale: Нифаль глагола שׁבע обычно означает принесение клятвы; русский глагол «клясться» кратко и точно сохраняет этот смысл.
- source_word: הַצָּרוֹת הָרִאשֹׁנוֹת
  choice: прежние бедствия
  rationale: צָרוֹת обозначает беды, тяготы или бедствия; «прежние бедствия» передаёт тяжесть выражения и естественно звучит в современном литературном русском.
- source_word: נִשְׁכְּחוּ / נִסְתְּרוּ מֵעֵינָי
  choice: забыты / скрыты от Моих глаз
  rationale: Сохранены завершённое состояние и образное антропоморфное выражение оригинала без дополнительного богословского истолкования.
theological_decisions:
- issue: Значение בֵּאלֹהֵי אָמֵן
  choice: Богом истины
  alternative: Богом Аминь; верным Богом
  rationale: Слово אָמֵן допускает акцент на истине, надёжности и верности и здесь необычно употреблено как Божье определение. Основной текст выбирает ясное «Богом истины», не исключая других оттенков, которые сохранены в сноске.
- issue: Объём значения בָּאָרֶץ
  choice: на земле
  alternative: в этой стране; в этом краю
  rationale: Контекст допускает как локально-общинное значение, так и более широкий смысл земли. Русское «на земле» сохраняет эту напряжённость, а сноска прямо указывает альтернативу.
- issue: Смысл возвратной формы ברך
  choice: благословляет себя
  alternative: провозглашает себя благословенным; призывает благословение на себя
  rationale: Основной перевод сохраняет грамматическую возвратность и не сводит выражение к единственному толкованию; более разъяснительные варианты приведены в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксический параллелизм двух условно-обобщённых конструкций сохранён; необычная возвратная формулировка оставлена ради близости к еврейскому тексту и пояснена в сноске.
