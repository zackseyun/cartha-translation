source:
  edition: WLC
  text: פֵּרַ֧שְׂתִּי יָדַ֛/י כָּל הַ/יּ֖וֹם אֶל עַ֣ם סוֹרֵ֑ר הַ/הֹלְכִים֙ הַ/דֶּ֣רֶךְ לֹא ט֔וֹב אַחַ֖ר מַחְשְׁבֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/002.yaml
  text: I spread out my hands all day long to a rebellious people[a], who walk in a way that is not good[c][b], following their own thoughts.
translation:
  language: ru
  text: Весь день Я простирал руки[a] к непокорному народу[b], который идёт недобрым путём, следуя своим замыслам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «протягивал руки».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «упрямому»; также возможно: «мятежному».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «своим мыслям» или «своим планам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרַשְׂתִּי
  choice: простирал
  rationale: Глагол в породе пиэль передаёт развёртывание или протягивание рук. «Простирал» сохраняет конкретный образ настойчивого обращения и соответствует возвышенному, но понятному русскому регистру.
- source_word: יָדַי
  choice: руки
  rationale: Форма с суффиксом первого лица имеет двойственное/множественное значение; множественное число сохраняет телесный образ оригинала.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Естественно передаёт продолжительность действия на протяжении всего дня.
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает направленность жеста к народу.
- source_word: עַם
  choice: народу
  rationale: В контексте речь идёт о собирательной общности, поэтому «народ» точнее, чем политически окрашенное «нация».
- source_word: סוֹרֵר
  choice: непокорному
  rationale: Слово обозначает упрямое отступление и сопротивление. «Непокорный» передаёт нравственную и заветную окраску, не усиливая её сверх текста.
- source_word: הַהֹלְכִים
  choice: который идёт
  rationale: Согласование в единственном числе естественно для русского собирательного существительного «народ», а глагол движения сохраняет метафору образа жизни.
- source_word: הַדֶּרֶךְ לֹא טוֹב
  choice: недобрым путём
  rationale: Формулировка сохраняет метафору пути и отрицание добра, не усиливая оценку до «злого» или «нечестивого» пути.
- source_word: אַחַר
  choice: следуя
  rationale: В сочетании с движением слово выражает следование за чем-либо; выбранный вариант ясен и естественен по-русски.
- source_word: מַחְשְׁבֹתֵיהֶם
  choice: своим замыслам
  rationale: Существительное допускает значения мыслей, намерений, планов или замыслов. «Замыслы» естественно сочетается с «следуя» и сохраняет смысл внутренне избранного направления действий.
theological_decisions:
- issue: Поза Бога по отношению к непокорному народу
  choice: 'Сохранён антропоморфный образ: «Я простирал руки».'
  alternative: «Я не переставал протягивать руки» или «Я обращался»
  rationale: Исходный текст изображает действие Бога телесной метафорой. Её сохранение удерживает напряжение между Божьим постоянным обращением к людям и их непокорностью, не сводя образ к одному истолкованию.
- issue: Нравственная оценка пути народа
  choice: «недобрым путём»
  alternative: «злым путём» или «нечестивым путём»
  rationale: В еврейском тексте слово «добрый/хороший» поставлено под отрицанием. Перевод не заменяет эту широкую оценку более сильным и конкретным определением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной пророческой интонацией. Порядок слов «Весь день Я…» подчёркивает непрерывность действия. Метафоры протянутых рук и пути сохранены; синтаксис приспособлен к русскому согласованию собирательного слова «народ».
