language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: זְאֵ֨ב וְ/טָלֶ֜ה יִרְע֣וּ כְ/אֶחָ֗ד וְ/אַרְיֵה֙ כַּ/בָּקָ֣ר יֹֽאכַל תֶּ֔בֶן וְ/נָחָ֖שׁ עָפָ֣ר לַחְמ֑/וֹ לֹֽא יָרֵ֧עוּ וְ/לֹֽא יַשְׁחִ֛יתוּ בְּ/כָל הַ֥ר קָדְשִׁ֖/י אָמַ֥ר יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/025.yaml
  text: The wolf and the lamb will graze together[a], and the lion will eat straw like the cattle; and dust will be the serpent’s food[c][b]. They will do no evil or destruction on all my holy mountain," says Yahweh.
translation:
  language: ru
  text: Волк и ягнёнок[a] будут пастись вместе, лев, как скот, будет есть солому, а пищей змея будет прах[b]. Не будут вредить и губить на всей Моей святой горе[c], — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «козлёнок»; еврейское слово טָלֶה может обозначать молодое животное из мелкого скота — овцу или козу.'
    reason: lexical_alternative
  - marker: b
    text: Образ праха как пищи змея, вероятно, перекликается с Бытие 3:14.
    reason: cross_reference
  - marker: c
    text: 'Или: «Не будут причинять зла и разрушать»; первый глагол может означать как совершение зла, так и причинение вреда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְאֵב וְטָלֶה
  choice: волк и ягнёнок
  rationale: Сохраняет контраст хищника и уязвимого молодого животного; טָלֶה может обозначать молодняк мелкого скота шире, что отмечено в сноске.
- source_word: יִרְעוּ כְאֶחָד
  choice: будут пастись вместе
  rationale: Естественно передаёт значение совместного мирного кормления; כְאֶחָד здесь значит «вместе, как одно целое».
- source_word: וְאַרְיֵה כַּבָּקָר יֹאכַל תֶּבֶן
  choice: лев, как вол, будет есть солому
  rationale: בָּקָר — родовое обозначение крупного рогатого скота; в русском сравнении единственное «как вол» звучит естественно и ясно передаёт травоядный образ.
- source_word: וְנָחָשׁ עָפָר לַחְמוֹ
  choice: а пищей змея будет прах
  rationale: לֶחֶם может означать не только хлеб, но и пищу вообще. «Прах» сохраняет возвышенный библейский регистр и вероятную связь с Быт 3:14.
- source_word: לֹא יָרֵעוּ וְלֹא יַשְׁחִיתוּ
  choice: не будут причинять зла и не будут губить
  rationale: Первый глагол допускает оттенки зла и причинения вреда; формулировка сохраняет эту смысловую широту. Второй передан обычным для контекста глаголом «губить».
- source_word: בְּכָל הַר קָדְשִׁי
  choice: на всей Моей святой горе
  rationale: Естественная русская передача пространственного оборота с сохранением полного охвата.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, не заменяя его титулом.
theological_decisions:
- issue: Вероятная отсылка к проклятию змея в Бытие 3:14
  choice: Сохранить образы «змей», «прах» и «пища», не объясняя отсылку в основном тексте.
  alternative: Развернуть фразу как прямое упоминание проклятия или заменить «прах» более бытовым словом.
  rationale: Исайя явно не называет проклятие, поэтому перевод сохраняет межтекстовую связь, но не превращает её в явное толкование.
- issue: Смысл לֹא יָרֵעוּ
  choice: «не будут причинять зла»
  alternative: «не будут вредить» или «не будут поступать нечестиво»
  rationale: Глагол может обозначать как злое действие, так и причинение вреда. Выбранная формулировка удерживает моральный и практический оттенки без их искусственного разведения.
- issue: Субъект множественных глаголов в заключительной строке
  choice: 'Оставить субъект невыраженным: «не будут…»'
  alternative: Добавить «они», относя это место только к перечисленным животным, либо назвать людей и животных.
  rationale: В еврейском тексте субъект грамматически подразумевается, но не уточняется; русский допускает такое же сохранение неопределённости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис сделан плавным и понятным, при этом сохранены образность, повтор отрицания и неуточнённый субъект заключительных глаголов. Местоимение «Моей» оформлено с прописной буквы согласно распространённой русской библейской издательской традиции.
