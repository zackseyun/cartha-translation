  variant: modern literary Russian
source:
  edition: WLC
  text: הִנֵּ֧ה עֲבָדַ֛/י יָרֹ֖נּוּ מִ/טּ֣וּב לֵ֑ב וְ/אַתֶּ֤ם תִּצְעֲקוּ֙ מִ/כְּאֵ֣ב לֵ֔ב וּ/מִ/שֵּׁ֥בֶר ר֖וּחַ תְּיֵלִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/014.yaml
  text: Look[a], my servants will sing for gladness of heart, but you will cry out from pain of heart[d][c][b], and from a broken spirit you will wail.
translation:
  language: ru
  text: Вот, Мои слуги будут петь от радости в сердце[a], а вы будете кричать от боли в сердце и рыдать из-за сокрушённого духа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут радостно восклицать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт призыв обратить внимание и эмфатическую силу частицы естественным для современного русского языка способом.
- source_word: עֲבָדַי
  choice: Мои слуги
  rationale: В данном контексте обозначает принадлежащих Богу и служащих Ему людей; «слуги» передаёт смысл без ненужного усиления оттенка рабского статуса.
- source_word: יָרֹנּוּ
  choice: будут петь
  rationale: Глагол обозначает звучное выражение радости — пение или радостный возглас; «петь» естественно сочетается с причиной, названной далее.
- source_word: מִטּוּב לֵב
  choice: от радости в сердце
  rationale: Оборот описывает внутреннее благополучие и радость, а не нравственную «доброту»; предлог «от» сохраняет причинный оттенок מן.
- source_word: תִּצְעֲקוּ
  choice: будете кричать
  rationale: Передаёт громкий крик, вызванный страданием, и сохраняет резкий контраст с радостным пением.
- source_word: מִכְּאֵב לֵב
  choice: от боли в сердце
  rationale: Сохраняет образ и параллелизм с «от радости в сердце», не сводя значение только к одному виду душевного страдания.
- source_word: מִשֵּׁבֶר רוּחַ
  choice: из-за сокрушённого духа
  rationale: Сохраняет метафору внутренней сломленности и ясно выражает причинную связь.
- source_word: תְּיֵלִילוּ
  choice: рыдать
  rationale: Передаёт громкое скорбное причитание; звучит естественнее, чем буквальное «выть», не устраняя интенсивности.
theological_decisions:
- issue: Кого обозначают «Мои слуги» и «вы»
  choice: Сохранить установленное стихом противопоставление, не уточняя личности обеих групп.
  alternative: Назвать «Моих слуг» верным остатком, а «вас» — отступниками из Израиля.
  rationale: Сам стих резко противопоставляет две группы, но их более узкая идентификация должна определяться контекстом, а не добавляться в перевод.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «в сердце» намеренно сохраняет еврейский параллелизм; формы будущего времени поддерживают пророческий контраст.
