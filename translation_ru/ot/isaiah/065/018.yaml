  text: כִּֽי אִם שִׂ֤ישׂוּ וְ/גִ֨ילוּ֙ עֲדֵי עַ֔ד אֲשֶׁ֖ר אֲנִ֣י בוֹרֵ֑א כִּי֩ הִנְ/נִ֨י בוֹרֵ֧א אֶת יְרוּשָׁלִַ֛ם גִּילָ֖ה וְ/עַמָּ֥/הּ מָשֽׂוֹשׂ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/018.yaml
  text: But be glad and rejoice forever in what I am creating; for behold[a], I am creating Jerusalem as rejoicing, and her people as joy.
translation:
  language: ru
  text: Но радуйтесь и ликуйте вовеки о том, что Я творю. Ибо вот, Я творю Иерусалим ликованием, а народ его — радостью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я создаю Иерусалим для ликования, а народ его — для радости».'
    reason: Альтернативное целевое понимание предикативных существительных גִּילָה и מָשׂוֹשׂ.
lexical_decisions:
- source_word: כִּי אִם
  choice: Но
  rationale: Передаёт противопоставление предыдущему запрету вспоминать прежнее (ст. 17), не перегружая русский текст.
- source_word: שִׂישׂוּ וְגִילוּ
  choice: радуйтесь и ликуйте
  rationale: Сохраняет два близких по смыслу глагола и поэтическое усиление; «ликуйте» передаёт более сильную, открытую радость.
- source_word: עֲדֵי עַד
  choice: вовеки
  rationale: Кратко и торжественно передаёт неограниченную длительность, оставаясь понятным в современном литературном русском.
- source_word: אֲשֶׁר אֲנִי בוֹרֵא
  choice: о том, что Я творю
  rationale: Относительное предложение обозначает предмет или повод радости; настоящее время сохраняет живую аспектуальность причастия.
- source_word: הִנְנִי
  choice: ведь вот, Я
  rationale: «Вот» сохраняет указательно-эмфатическую силу пророческого возвещения, а «ведь» естественно передаёт пояснительное כִּי.
- source_word: בוֹרֵא
  choice: творю
  rationale: Настоящее время передаёт продолжающееся или близко предстоящее творческое действие Бога и лексически связывает обе части стиха.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Общепринятая русская форма библейского топонима.
- source_word: גִּילָה
  choice: ликованием
  rationale: 'Творительный предикативный передаёт результативный смысл: Иерусалим создаётся как воплощение ликования; также сохраняется связь с גילוּ.'
- source_word: וְעַמָּהּ
  choice: а народ его
  rationale: Местоимение относится к Иерусалиму; союз «а» естественно оформляет параллелизм без выраженного противопоставления.
- source_word: מָשׂוֹשׂ
  choice: радостью
  rationale: Творительный предикативный зеркально передаёт параллельную конструкцию и образ народа как воплощённой радости.
theological_decisions:
- issue: Предикативное или целевое понимание גִּילָה и מָשׂוֹשׂ после ברא
  choice: «творю Иерусалим ликованием, а народ его — радостью»
  alternative: «создаю Иерусалим для ликования, а народ его — для радости»
  rationale: Еврейский текст допускает результативно-предикативное и целевое понимание. Основной текст сохраняет более яркий образ преобразованной сущности, а сноска фиксирует естественное целевое прочтение, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. «Вовеки» и «творю» придают достоинство без избыточной архаики; необычный образ «творю ... ликованием» намеренно сохраняет плотность и неоднозначность еврейской поэзии.
