  text: וּ/מָנִ֨יתִי אֶתְ/כֶ֜ם לַ/חֶ֗רֶב וְ/כֻלְּ/כֶם֙ לַ/טֶּ֣בַח תִּכְרָ֔עוּ יַ֤עַן קָרָ֨אתִי֙ וְ/לֹ֣א עֲנִיתֶ֔ם דִּבַּ֖רְתִּי וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּעֲשׂ֤וּ הָ/רַע֙ בְּ/עֵינַ֔/י וּ/בַ/אֲשֶׁ֥ר לֹֽא חָפַ֖צְתִּי בְּחַרְתֶּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/012.yaml
  text: And I will destine you for the sword[a], and all of you will bow down for the slaughter, because I called and you did not answer; I spoke and you did not listen. And you did what was evil in my eyes[d][c][b], and chose what I did not delight in.
translation:
  language: ru
  text: И Я предназначу вас для меча[a], и все вы склонитесь на заклание[b], потому что Я звал — вы не отвечали, говорил — вы не слушали[c]. Вы делали зло в Моих глазах и избрали то, чего Я не желал[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначу вас»; возможно также: «исчислю вас». Еврейский глагол созвучно перекликается с упомянутым в предыдущем стихе божеством Судьбы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «преклоните колени» или «согнётесь». Еврейский глагол буквально обозначает сгибание колен; в этом контексте он может изображать падение под судом.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не слышали»; по смыслу возможно также: «не повиновались».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «того, что Мне неугодно» / «того, в чём Я не находил удовольствия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָנִיתִי
  choice: И Я предназначу
  rationale: Глагол מנה допускает значения «назначить», «определить», «исчислить». «Предназначу» передаёт определение к участи и отчасти сохраняет ироническую связь с почитанием Судьбы в предыдущем стихе, не вводя учения о предопределении.
- source_word: לַחֶרֶב
  choice: для меча
  rationale: Сохраняет образ меча как орудия Божьего суда и соответствует сочетанию с «предназначу».
- source_word: לַטֶּבַח
  choice: перед закланием
  rationale: טבח означает убой, заклание. Формулировка сохраняет суровый судебный образ и параллель с мечом.
- source_word: תִּכְרָעוּ
  choice: падёте на колени
  rationale: כרע буквально обозначает сгибание колен, преклонение или падение на колени. В данном контексте образ указывает на поверженность перед смертью, но перевод сохраняет конкретное движение.
- source_word: יַעַן
  choice: потому что
  rationale: Прямо вводит причину объявленного суда.
- source_word: קָרָאתִי ... וְלֹא עֲנִיתֶם
  choice: Я звал — вы не отвечали
  rationale: Сохраняет ясную смысловую пару «звать — отвечать» и краткий ритм оригинала.
- source_word: דִּבַּרְתִּי וְלֹא שְׁמַעְתֶּם
  choice: говорил — вы не слушали
  rationale: שמע может означать слышание, внимательное слушание и послушание. «Не слушали» передаёт виновный отказ откликнуться, не сужая значение до одного лишь физического слышания или до явно выраженного непослушания.
- source_word: וַתַּעֲשׂוּ הָרַע בְּעֵינַי
  choice: Вы делали зло в Моих глазах
  rationale: Сохраняет обычную еврейскую оценочную формулу и остаётся понятным в современном литературном русском.
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בְּחַרְתֶּם
  choice: и избрали то, чего Я не желал
  rationale: חפץ охватывает желание, благоволение и удовольствие. «Не желал» естественно передаёт волевой смысл, а примечание сохраняет другие оттенки.
theological_decisions:
- issue: Активный характер Божьего суда
  choice: «Я предназначу вас для меча»
  alternative: «Я исчислю вас для меча» / «Я назначу вас мечу»
  rationale: Перевод сохраняет Бога как действующего Судью и не смягчает угрозу, но также не разворачивает её в более широкое учение о предопределении.
- issue: Значение שמע
  choice: «не слушали»
  alternative: «не слышали» / «не повиновались»
  rationale: В параллели с «говорил» речь идёт о виновном нежелании слушать. «Не слушали» сохраняет и слуховой образ, и подразумеваемое непослушание, не устраняя смысловую многозначность.
- issue: Образ преклонения колен перед закланием
  choice: «падёте на колени перед закланием»
  alternative: «преклонитесь на заклание» / «будете повержены для заклания»
  rationale: Сохраняется буквальный телесный образ כרע, тогда как его значение как падения под судом остаётся ясным из контекста и не превращается в добавленное толкование.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Параллельные обвинения оформлены краткими бессоюзными парами с тире. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской издательской традиции. Судебные образы не смягчены, а неоднозначность ключевых еврейских слов вынесена в примечания.
