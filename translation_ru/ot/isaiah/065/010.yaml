base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/010.yaml
  text: Sharon will become a pasture for flocks[a], and the Valley of Achor a resting place for cattle[b], for my people who have sought me.
translation:
  language: ru
  text: Для Моего народа, который искал Меня, Шарон станет пастбищем для овец[a], а долина Ахор — местом отдыха для крупного скота[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «местом обитания для мелкого скота»; «местом выпаса для овец».'
    reason: lexical_alternative
  - marker: b
    text: Долина Ахор прежде была связана с судом (Нав. 7:24–26); здесь она изображена как место восстановления, покоя и безопасности.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: станет
  rationale: Пророческая форма в данном контексте имеет будущее и результативное значение; «станет» подчёркивает переход к восстановленному состоянию.
- source_word: הַשָּׁרוֹן
  choice: Шарон
  rationale: Географическое название передано принятой русской транслитерацией; еврейский артикль отдельно не воспроизводится.
- source_word: לִנְוֵה צֹאן
  choice: пастбищем для овечьих стад
  rationale: נָוֶה может означать пастбище, обиталище или место выпаса. В пасторальном параллелизме «пастбище» звучит естественно, а צֹאן обозначает мелкий скот, преимущественно овец и коз; здесь выбран традиционный образ овечьих стад с сохранением альтернативы в примечании.
- source_word: וְעֵמֶק עָכוֹר
  choice: а долина Ахор
  rationale: עֵמֶק передано как «долина», а עָכוֹר сохранено как собственное географическое название в принятой библейской форме.
- source_word: לְרֵבֶץ בָּקָר
  choice: местом отдыха для крупного скота
  rationale: רֵבֶץ обозначает место, где животные ложатся и спокойно отдыхают, а בָּקָר — крупный рогатый скот; формулировка сохраняет оттенок безопасности и покоя.
- source_word: לְעַמִּי
  choice: для Моего народа
  rationale: 'Предлог לְ выражает предназначение или пользу: восстановленные земли будут предоставлены Божьему народу.'
- source_word: אֲשֶׁר דְּרָשׁוּנִי
  choice: который искал Меня
  rationale: דָּרַשׁ по отношению к Богу означает «искать», «обращаться к». Прошедшее время естественно передаёт еврейский перфект, не исключая сохраняющейся значимости этого поиска.
theological_decisions:
- issue: Кого обозначает выражение «Мой народ, который искал Меня»
  choice: Верный Богу народ, признаваемый Им Своим, без дальнейшего сужения его состава.
  alternative: Остаток внутри Израиля либо весь восстановленный Израиль как единое целое.
  rationale: Сам стих связывает обещанное восстановление с людьми, искавшими Бога, но не уточняет их состав в рамках более узкой богословской схемы; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм сохранён; географические названия даны в традиционной русской библейской форме. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской издательской практикой.
