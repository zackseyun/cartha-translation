base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/023.yaml
  text: They will not labor for emptiness[a], nor bear children for calamity, for they are the offspring of those blessed by Yahweh, and their descendants with them.
translation:
  language: ru
  text: 'Они не будут трудиться напрасно

    и не будут рожать детей на беду[a],

    потому что они — потомство благословенных Яхве,

    и их потомки — с ними.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «ужас», «смятение» или «внезапное бедствие».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִיגְעוּ
  choice: будут трудиться
  rationale: Глагол יגע обозначает тяжёлый, изнурительный труд. «Трудиться» естественно звучит по-русски и сохраняет значение напряжённого труда.
- source_word: לָרִיק
  choice: напрасно
  rationale: רִיק буквально связано с пустотой и здесь указывает на тщетность, отсутствие плода. Наречие «напрасно» естественно передаёт смысл выражения, не перегружая русский текст буквальным оборотом «для пустоты».
- source_word: יֵלְדוּ
  choice: будут рожать детей
  rationale: ילד здесь означает рождение потомства. Добавление слова «детей» делает русскую фразу полной и ясно связывает обещание с жизнью семей и поколений.
- source_word: לַבֶּהָלָה
  choice: на беду
  rationale: בֶּהָלָה может обозначать ужас, смятение или внезапное бедствие. Оборот «рожать детей на беду» краток и естественен, передавая мысль о детях, которым не суждено стать жертвами бедствия; широта значения отмечена в сноске.
- source_word: זֶרַע
  choice: потомство
  rationale: זֶרַע буквально означает «семя», но часто употребляется в значении потомства. Здесь «потомство» ясно передаёт родовую связь с благословенными Яхве.
- source_word: בְּרוּכֵי יְהוָה
  choice: благословенных Яхве
  rationale: Форма множественного числа в сопряжённой конструкции обозначает людей, благословенных Яхве. Такая передача сохраняет отличие между нынешним поколением и следующими за ним потомками.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: и их потомки
  rationale: צֶאֱצָאִים обозначает потомков. Выбор слова «потомки» сохраняет развитие мысли о непрерывности поколений и избегает повтора слова «потомство».
- source_word: אִתָּם
  choice: будут с ними
  rationale: Предлог с местоименным суффиксом буквально означает «с ними». В русском для обещания будущего естественно восполнить сказуемое «будут», подразумеваемое контекстом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога — тетраграмматон יְהוָה. «Яхве» передаёт именно имя, не заменяя его титулом.
- issue: К кому относится выражение זֶרַע בְּרוּכֵי יְהוָה
  choice: они — потомство людей, благословенных Яхве
  alternative: они — благословенное Яхве потомство
  rationale: 'Грамматическая форма בְּרוּכֵי — множественное число сопряжённой формы («благословенные Яхве»), поэтому наиболее прямой разбор связывает זֶרַע с группой благословенных людей: «потомство благословенных Яхве».'
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим ритмом. Параллелизм двух отрицательных обещаний сохранён. Формулировки понятны широкому читателю; буквальная образность רִיק передана идиоматически словом «напрасно», а многозначность בֶּהָלָה сохранена с помощью сноски.
