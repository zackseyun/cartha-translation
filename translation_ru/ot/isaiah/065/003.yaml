    rationale: הַמַּכְעִיסִים (хифиль от כעס) означает «вызывающие гнев, гневящие». Контекст действительно подчёркивает дерзость, особенно через עַל־פָּנַי, но «бросает вызов» заменяет значение гнева более узким понятием неповиновения. Это лучше передать сочетанием «гневит Меня прямо в лицо».
