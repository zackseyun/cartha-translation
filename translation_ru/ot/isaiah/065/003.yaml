  text: הָ/עָ֗ם הַ/מַּכְעִיסִ֥ים אוֹתִ֛/י עַל פָּנַ֖/י תָּמִ֑יד זֹֽבְחִים֙ בַּ/גַּנּ֔וֹת וּֽ/מְקַטְּרִ֖ים עַל הַ/לְּבֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/003.yaml
  text: the people who continually provoke me to my face[a], sacrificing in the gardens and burning incense on the bricks.
translation:
  language: ru
  text: народ, который постоянно гневит Меня прямо в лицо, приносит жертвы в садах и воскуряет благовония на кирпичах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на кирпичах». Возможно, имеются в виду сложенные из кирпича культовые сооружения или жертвенники, использовавшиеся для недозволенного поклонения.'
    reason: Сохранение лексической точности и пояснение вероятного культового значения без внесения слова «жертвенники» в основной текст.
lexical_decisions:
- source_word: הָעָם
  choice: народ
  rationale: Определённая форма указывает на уже названную группу; «народ» естественно передаёт собирательное значение.
- source_word: הַמַּכְעִיסִים
  choice: который… бросает Мне вызов
  rationale: Причастие породы хифиль означает действие, вызывающее гнев. В сочетании с עַל־פָּנַי выражение передаёт не просто раздражение, а открытое, вызывающее неповиновение.
- source_word: עַל־פָּנַי
  choice: прямо в лицо
  rationale: Буквально «перед Моим лицом / на Моём лице»; в контексте упрёка русский оборот сохраняет оттенок дерзкого противостояния.
- source_word: תָּמִיד
  choice: постоянно
  rationale: Передаёт продолжительный и повторяющийся характер действий.
- source_word: זֹבְחִים
  choice: приносит жертвы
  rationale: Причастие обозначает продолжающееся культовое действие; сочетание естественно для современного литературного русского языка.
- source_word: בַּגַּנּוֹת
  choice: в садах
  rationale: Сохранено прямое пространственное значение без добавления отсутствующего в еврейском тексте слова «святилища».
- source_word: וּמְקַטְּרִים
  choice: и воскуряет благовония
  rationale: Форма от קטר в данном культовом контексте обозначает сжигание благовоний или дымного приношения; выбран традиционно понятный и естественный русский оборот.
- source_word: עַל־הַלְּבֵנִים
  choice: на кирпичах[a]
  rationale: Существительное прямо означает «кирпичи». Перевод не вводит слово «жертвенники», которого в оригинале нет, а вероятный культовый смысл поясняется в сноске.
theological_decisions:
- issue: Культовый смысл עַל־הַלְּבֵנִים
  choice: на кирпичах
  alternative: на кирпичных жертвенниках
  rationale: Контекст жертвоприношений позволяет предполагать культовые сооружения или жертвенники из кирпича, однако сам еврейский текст называет только кирпичи. Основной текст сохраняет эту неоднозначность, а вероятный смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Единственное число сказуемых согласовано с собирательным существительным «народ». Оборот «бросает Мне вызов прямо в лицо» передаёт совместную силу הַמַּכְעִיסִים и עַל־פָּנַי, не сводя выражение к нейтральному «в Моём присутствии».
