revisions:
- from: Не будут они строить дома, чтобы в них жил другой, не будут сажать, чтобы другой ел плоды. Ибо дни Моего народа будут как дни дерева, и избранные Мои в полной мере воспользуются плодами труда своих рук[a].
  to: Не будут строить, а жить будет другой; не будут сажать, а есть будет другой. Ибо дни Моего народа будут как дни дерева, и Мои избранные в полной мере будут пользоваться тем, что создали своими руками[a].
  rationale: Исправлен синтаксис первых двух строк, чтобы передать еврейское противопоставление без оттенка цели. Необязательные уточнения «дома» и «плоды» сняты, а заключительная идиома передана естественным русским выражением с сохранением буквального образа в сноске.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:40:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: отмена ситуации, в которой плодами труда пользуется другой, и обещание долговечности и прочного владения результатами собственного труда. Однако союз «чтобы» может придавать придаточным оттенок цели, которого в двух координированных еврейских клаузах нет. Добавления «дома» и особенно «плоды» допустимы как восполнение, но не необходимы и несколько сужают подразумеваемые объекты.'
  naturalness: Текст в целом литературен, но «не будут ... чтобы ...» менее точно и естественно для параллельного пророческого противопоставления, чем «не будут ..., а ... будет другой». «Пользоваться тем, что создали своими руками» — современное и ясное русское выражение, передающее идиому «дело их рук».
  terminology: «Мои избранные» точно передаёт בְּחִירָי и не навязывает конфессионально окрашенное «избранники» или «избранные Божьи». Прописная буква в местоимении Бога сохранена как стилистическое решение. Образ «дней дерева» оставлен открытым, без сведения его к одному толкованию.
  issues:
  - severity: medium
    issue: Союз «чтобы» в первых двух членах
    rationale: 'В оригинале: «не будут строить, и другой не будет жить [в построенном]; не будут сажать, и другой не будет есть». Русское «чтобы» может обозначать цель («строят для того, чтобы...»), тогда как текст отрицает последствие/лишение плодов труда.'
  - severity: low
    issue: Экспликации «дома» и «плоды»
    rationale: Они логично выводятся из контекста, но в еврейском тексте объекты не названы. Их удаление лучше сохраняет лаконичный параллелизм и широту образа.
  - severity: low
    issue: Формулировка сноски «до полного его употребления»
    rationale: Местоимение «его» имеет неясную отсылку, а выражение звучит тяжеловесно. Сноску можно сделать точнее, сохранив буквальный образ изнашивания.
  revised_text: Не будут строить, а жить будет другой; не будут сажать, а есть будет другой. Ибо дни Моего народа будут как дни дерева, и Мои избранные в полной мере будут пользоваться тем, что создали своими руками[a].
