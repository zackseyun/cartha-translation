source:
  edition: WLC
  text: לֹ֤א יִבְנוּ֙ וְ/אַחֵ֣ר יֵשֵׁ֔ב לֹ֥א יִטְּע֖וּ וְ/אַחֵ֣ר יֹאכֵ֑ל כִּֽי כִ/ימֵ֤י הָ/עֵץ֙ יְמֵ֣י עַמִּ֔/י וּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם יְבַלּ֥וּ בְחִירָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/022.yaml
  text: They will not build and another inhabit; they will not plant and another eat. For the days of my people will be like the days of a tree[a], and my chosen ones will wear out the work of their hands.
translation:
  language: ru
  text: Не будут строить, а жить будет другой; не будут сажать, а есть будет другой. Ибо дни Моего народа будут как дни дерева, и Мои избранные в полной мере будут пользоваться тем, что создали своими руками[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «износят дело своих рук»; глагол может обозначать пользование чем-либо до полного износа или употребления.'
    reason: Сохраняет конкретный образ глагола יְבַלּוּ, не выдавая контекстуальное истолкование за единственное буквальное значение.
lexical_decisions:
- source_word: יִבְנוּ
  choice: будут строить дома
  rationale: Глагол בנה означает «строить»; подразумеваемый дом назван явно ради естественного русского выражения и связи со следующим «жил».
- source_word: וְאַחֵר יֵשֵׁב
  choice: чтобы в них жил другой
  rationale: ישב здесь значит «жить, обитать»; местоимение «в них» восполняет подразумеваемые построенные дома. Союзная конструкция передана как нежелательный результат труда, не доставшийся строителю.
- source_word: יִטְּעוּ
  choice: будут сажать
  rationale: Обычное значение נטע — «сажать»; форма имперфекта в контексте обещанного будущего передана будущим временем.
- source_word: וְאַחֵר יֹאכֵל
  choice: чтобы другой ел плоды
  rationale: אכל означает «есть»; слово «плоды» эксплицирует подразумеваемый результат посадки, не уточняя вид насаждений.
- source_word: כִּי כִימֵי הָעֵץ יְמֵי עַמִּי
  choice: Ибо дни Моего народа будут как дни дерева
  rationale: Сравнение сохранено непосредственно. Определённая форма «дерево» понята обобщённо, как образ долговечности.
- source_word: וּמַעֲשֵׂה יְדֵיהֶם
  choice: плодами труда своих рук
  rationale: Буквально «делом их рук»; русское выражение «плоды труда своих рук» естественно обозначает созданное ими и одновременно связывается с образом насаждений.
- source_word: יְבַלּוּ
  choice: в полной мере воспользуются
  rationale: Пиэль от בלה может передавать доведение вещи до износа или полного употребления. В контексте благословения речь о длительном и полном пользовании результатами собственного труда; буквальный образ сохранён в сноске.
- source_word: בְחִירָי
  choice: избранные Мои
  rationale: Субстантивированное множественное «Мои избранные» передано без добавления конфессионально нагруженной терминологии.
theological_decisions:
- issue: Смысл יְבַלּוּ в обещании долгой и безопасной жизни
  choice: в полной мере воспользуются
  alternative: износят / употребят до конца
  rationale: Контекст обещает, что люди не лишатся созданного ими, а смогут пользоваться им полностью и долго. Перевод не превращает образ в утверждение о разрушении труда, а буквальная метафора отмечена в сноске.
- issue: Характер сравнения с днями дерева
  choice: сохранено открытое сравнение «как дни дерева»
  alternative: будут жить так же долго, как дерево
  rationale: Исходный текст подразумевает долговечность, но не разъясняет образ. Прямое сравнение сохраняет его поэтическую ёмкость и не сужает смысл до одного прозаического толкования.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. Инверсия «Не будут они» и написание местоимений, относящихся к Богу, с прописной буквы поддерживают достоинство стиля; подразумеваемые объекты названы лишь там, где это необходимо для ясности.
