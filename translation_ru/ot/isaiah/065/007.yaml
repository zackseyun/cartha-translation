  yaml_path: translation/ot/isaiah/065/007.yaml
  text: your iniquities and the iniquities of your fathers together[a], says Yahweh, because they burned incense on the mountains and reproached me on the hills[b]; so I will measure their former deed into their lap.
translation:
  language: ru
  text: «Ваши беззакония и беззакония ваших отцов вместе, — говорит Яхве, — за то, что они воскуряли благовония на горах и поносили Меня на холмах; Я отмерю им в лоно[a] содеянное ими прежде».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в их лоно». Этот образ означает личное, непосредственно получаемое воздаяние. Слово, переданное как «содеянное», может также означать «воздаяние» или «плату».'
    reason: Пояснение древнееврейской идиомы עַל־חֵיקָם и сохранение лексической альтернативы для פְעֻלָּתָם.
lexical_decisions:
- source_word: עֲוֺנֹתֵיכֶם וַעֲוֺנֹת אֲבוֹתֵיכֶם יַחְדָּו
  choice: ваши беззакония и беззакония ваших отцов — все вместе
  rationale: «Беззакония» передаёт как нравственное зло, так и связанную с ним виновность; «все вместе» сохраняет совокупное рассмотрение проступков нынешнего поколения и отцов, не разрешая напряжение текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: אֲשֶׁר
  choice: за то, что
  rationale: В данном контексте частица вводит основание суда; русская причинная конструкция естественно выражает эту связь.
- source_word: קִטְּרוּ
  choice: воскуряли благовония
  rationale: Глагол обозначает культовое сжигание благовоний; «воскуряли» является точным и понятным библейским термином.
- source_word: עַל הֶהָרִים וְעַל הַגְּבָעוֹת
  choice: на горах ... на холмах
  rationale: Сохранены оба прямо названных элемента и параллелизм еврейского текста без замены толковательным выражением «на высотах».
- source_word: חֵרְפוּנִי
  choice: поносили Меня
  rationale: Передаёт смысл оскорбления и бесчестия в достойном современном русском регистре.
- source_word: וּמַדֹּתִי
  choice: поэтому Я воздам
  rationale: Буквально глагол означает «отмерю», но в сочетании с образом помещения в лоно выражает прямое воздаяние; динамическая передача делает смысл понятным, а образ частично сохраняется в дополнении.
- source_word: פְעֻלָּתָם רִאשֹׁנָה
  choice: за прежние дела
  rationale: פְּעֻלָּה допускает значения «дело» и «воздаяние». Выбрано «дела», поскольку само воздаяние уже выражено сказуемым; множественное число естественно по-русски суммирует ранее названные поступки.
- source_word: עַל חֵיקָם
  choice: прямо в руки
  rationale: Еврейская идиома буквально говорит о воздаянии «в их лоно». Русское «прямо в руки» сохраняет представление о непосредственном и личном получении воздаяния, не создавая неясного анатомического образа.
theological_decisions:
- issue: Межпоколенческая вина и суд
  choice: Текст совместно называет беззакония адресатов и их отцов, не объясняя полностью принцип такого суда.
  alternative: Истолковать стих либо как безусловное наказание потомков за предков, либо как наказание только за сознательное повторение их грехов.
  rationale: 'Перевод сохраняет напряжение исходного текста: явно названы и «ваши» беззакония, и беззакония отцов; причинная часть описывает тот же идолопоклоннический образ действий, но не вводит отсутствующего в стихе догматического пояснения.'
- issue: Значение פְעֻלָּתָם в контексте суда
  choice: за ... дела
  alternative: их воздаяние; их плату
  rationale: Слово может обозначать и поступок, и плату за него. Здесь конструкция с «отмерю/воздам ... в лоно» уже выражает расплату, поэтому значение «дела» меньше перегружает фразу толкованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской тональностью. Сохранены параллелизм, прямая речь и личное имя Яхве. Архаизм «лоно» вынесен в буквальную сноску; в основном тексте использована понятная идиома «прямо в руки».
