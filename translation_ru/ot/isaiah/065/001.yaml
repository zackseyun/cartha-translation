  text: נִדְרַ֨שְׁתִּי֙ לְ/ל֣וֹא שָׁאָ֔לוּ נִמְצֵ֖אתִי לְ/לֹ֣א בִקְשֻׁ֑/נִי אָמַ֨רְתִּי֙ הִנֵּ֣/נִי הִנֵּ֔/נִי אֶל גּ֖וֹי לֹֽא קֹרָ֥א בִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/001.yaml
  text: I let myself be sought by those who did not ask[a]; I let myself be found by those who did not seek me. I said, ‘Here I am[b], here I am,’ to a nation that did not call on my name.
translation:
  language: ru
  text: 'Я открылся тем, кто не спрашивал обо Мне[a], дал найти Себя тем, кто Меня не искал. Я сказал: «Вот Я, вот Я!» — народу, который не призывал Моё имя[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Меня вопрошали… Меня нашли». Еврейские формы Нифаля допускают простой пассив, хотя контекст указывает на то, что Бог Сам открылся тем, кто Его не искал.'
    reason: lexical_alternative
  - marker: b
    text: В Римлянам 10:20 Павел цитирует этот стих применительно к язычникам; поэтому слово «народ» в более широком каноническом контексте может пониматься и в этом смысле.
    reason: cross_reference
lexical_decisions:
- source_word: נִדְרַשְׁתִּי
  choice: Я открылся
  rationale: Нифаль допускает буквальное пассивное «Меня искали / вопрошали обо Мне», но в данном контексте выражает доступность и самооткровение Бога. «Я открылся» естественно передаёт эту мысль, не делая Бога лишь пассивным объектом.
- source_word: לְלֹא שָׁאָלוּ
  choice: тем, кто не спрашивал обо Мне
  rationale: שאל означает «спрашивать, вопрошать»; дополнение «обо Мне» естественно в русском и проясняет подразумеваемый объект в связи с предшествующим глаголом.
- source_word: נִמְצֵאתִי
  choice: дал найти Себя
  rationale: Нифаль буквально означает «был найден». Формулировка сохраняет оттенок Божьей инициативы и доступности, оставаясь близкой к параллельной конструкции.
- source_word: לְלֹא בִקְשֻׁנִי
  choice: тем, кто Меня не искал
  rationale: בקשׁ прямо означает «искать», а суффикс первого лица требует дополнения «Меня».
- source_word: הִנֵּנִי הִנֵּנִי
  choice: Вот Я, вот Я!
  rationale: Повтор сохранён как эмфатический. «Вот Я» — краткое, современное и при этом торжественное русское выражение присутствия и готовности откликнуться.
- source_word: גּוֹי
  choice: народ
  rationale: גוי может обозначать народ или нацию. В обращении к человеческому сообществу русское «народ» звучит естественнее, не внося прямо толкование «язычники».
- source_word: לֹא קֹרָא בִשְׁמִי
  choice: который не призывал Моего имени
  rationale: Активное קרא с בְּשֵׁם здесь передаёт призывание имени, а не пассивное именование народа Божьим именем.
theological_decisions:
- issue: Следует ли прямо обозначить народ как язычников
  choice: В основном тексте оставить нейтральное «народ», а каноническое применение к язычникам отметить в сноске.
  alternative: Перевести גּוֹי как «язычники» или «языческий народ».
  rationale: Само еврейское слово не требует такого уточнения. Павел применяет стих к язычникам в Римлянам 10:20, но это каноническое прочтение лучше не подставлять вместо лексического значения в основном тексте.
- issue: Активность Бога в формах Нифаля
  choice: Передать самооткровение Бога выражениями «Я открылся» и «дал найти Себя», сохранив буквальный пассив как альтернативу в сноске.
  alternative: 'Перевести строго пассивно: «Меня искали… Меня нашли».'
  rationale: Пассив грамматически возможен, однако контекст подчёркивает инициативную доступность Бога тем, кто Его не искал. Сноска сохраняет реальную грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сделан ясным для обычного читателя; эмфатический повтор сохранён. Заглавные буквы в местоимениях, относящихся к Богу, использованы согласно распространённой русской библейской традиции.
