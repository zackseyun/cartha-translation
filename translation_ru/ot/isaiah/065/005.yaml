  yaml_path: translation/ot/isaiah/065/005.yaml
  text: who say[a], ‘Keep to yourself; do not come near me, for I am holier than you.’ These are smoke in my nostrils, a fire burning all day long.
translation:
  language: ru
  text: 'которые говорят: «Держись особняком, не приближайся ко мне, ведь я святее, чем ты»[a]. Они — дым в Моих ноздрях, огонь, горящий целый день.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь я слишком свят для тебя»; или: «ведь я хранил себя в святости, вдали от тебя». Еврейская фраза трудна для понимания и выражает притязание на ритуальное или нравственное превосходство.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: которые говорят
  rationale: Субстантивированное причастие продолжает описание людей из предыдущего стиха; относительное придаточное естественно передаёт эту связь по-русски.
- source_word: קְרַב אֵלֶיךָ
  choice: Держись особняком
  rationale: Буквальное «приблизься к себе» по-русски непонятно. В контексте это пренебрежительное требование оставаться отдельно и соблюдать дистанцию.
- source_word: אַל תִּגַּשׁ בִּי
  choice: не приближайся ко мне
  rationale: Глагол נגשׁ с предлогом ב обозначает приближение к человеку; выбранная формулировка ясна и сохраняет исключающий тон.
- source_word: כִּי קְדַשְׁתִּיךָ
  choice: ведь я святее тебя
  rationale: Трудная, сжатая еврейская конструкция в контексте выражает притязание говорящего на превосходящую святость и отделённость; основной текст передаёт наиболее вероятный риторический смысл, а варианты отмечены в сноске.
- source_word: אֵלֶּה
  choice: Они
  rationale: Указательное местоимение отсылает к только что описанным людям; «они» естественно связывает части русского предложения.
- source_word: עָשָׁן בְּאַפִּי
  choice: дым в Моих ноздрях
  rationale: Сохранён конкретный и резкий образ раздражающего дыма; אף может также ассоциироваться с гневом, но абстрактное «гнев» ослабило бы метафору.
- source_word: אֵשׁ יֹקֶדֶת
  choice: огонь, горящий
  rationale: Причастная конструкция прямо передаёт непрекращающееся горение и сохраняет параллельный образ.
- source_word: כָּל הַיּוֹם
  choice: целый день
  rationale: Естественный современный русский эквивалент выражения продолжительности, передающий постоянное действие.
theological_decisions:
- issue: Толкование כִּי קְדַשְׁתִּיךָ
  choice: ведь я святее тебя
  alternative: ведь я слишком свят для тебя; ведь я отделил себя от тебя как святого
  rationale: Еврейская форма синтаксически трудна и допускает несколько прочтений. Основной вариант лучше всего передаёт осуждаемое в контексте высокомерное самоотделение, не представляя притязание говорящих как истинное; подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейской образностью. Реплика звучит надменно и отчуждающе; конкретные метафоры дыма в ноздрях и постоянно горящего огня сохранены. Местоимение «Моих» написано с прописной буквы как относящееся к Богу.
