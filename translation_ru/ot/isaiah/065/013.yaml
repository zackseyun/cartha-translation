id: ISA.65.13
reference: Isaiah 65:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה עֲבָדַ֤/י יֹאכֵ֨לוּ֙ וְ/אַתֶּ֣ם תִּרְעָ֔בוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׁתּ֖וּ וְ/אַתֶּ֣ם תִּצְמָ֑אוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׂמָ֖חוּ וְ/אַתֶּ֥ם תֵּבֹֽשׁוּ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/013.yaml
  text: 'Therefore this is what the Lord GOD says: Look[a], my servants will eat, but you will be hungry; look, my servants will drink, but you will be thirsty; look, my servants will rejoice[b], but you will be put to shame.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Вот, Мои слуги будут есть, а вы будете голодать; вот, Мои слуги будут пить, а вы будете томиться от жажды; вот, Мои слуги будут радоваться, а вы будете посрамлены[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будете стыдиться». Еврейский глагол может обозначать как переживание стыда, так и посрамление, бесчестие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Сохраняет причинно-следственный переход от предшествующего обличения к объявлению суда и благословения.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная для русского библейского стиля передача устойчивой пророческой формулы без архаизации.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт отдельно титул אֲדֹנָי и личное имя יְהוִה, избегая неестественного сочетания «Господь Господь».
- source_word: הִנֵּה
  choice: Вот
  rationale: Кратко и естественно сохраняет указательно-эмфатическую функцию частицы перед каждым из трёх контрастов.
- source_word: עֲבָדַי
  choice: Мои слуги
  rationale: עבד допускает значения «раб» и «слуга»; в данном контексте речь прежде всего о принадлежащих Богу и служащих Ему людях. «Слуги» передаёт это без излишнего акцента на подневольном статусе.
- source_word: תִּרְעָבוּ
  choice: будете голодать
  rationale: Идиоматично выражает не только ощущение голода, но и лишение пищи, прямо противопоставленное тому, что слуги будут есть.
- source_word: תִּצְמָאוּ
  choice: будете томиться от жажды
  rationale: Естественно передаёт состояние жажды и усиливает параллельный образ лишения, не выходя за смысл еврейского глагола.
- source_word: יִשְׂמָחוּ
  choice: будут радоваться
  rationale: Сохраняет активное выражение радости и возвышенный пророческий регистр.
- source_word: תֵּבֹשׁוּ
  choice: будете посрамлены
  rationale: В контексте суда хорошо передаёт публичный, результативный оттенок בוש, при этом возможное значение внутреннего стыда отмечено в сноске.
- source_word: וְאַתֶּם
  choice: а вы
  rationale: Русский противительный союз естественно выражает повторяющийся контраст между участью Божьих слуг и адресатов обличения.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Так сохраняются и титул, и явленное в тексте личное имя Бога, без смешения двух разных еврейских обозначений.
- issue: Характер стыда в תֵּבֹשׁוּ
  choice: будете посрамлены
  alternative: будете стыдиться
  rationale: Контекст противопоставления благословения и суда допускает как переживание стыда, так и объективное бесчестие. Основной текст отражает публичный итог суда, а сноска сохраняет смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Трёхчастный параллелизм и повтор «вот» сохранены; обращения «Мои» оформлены с традиционной почтительной прописной буквы.
