base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/011.yaml
  text: 'An oracle concerning Dumah: One calls to me from Seir[a], “Watchman, what of the night? Watchman[b], what of the night?”'
translation:
  language: ru
  text: 'Пророчество о Думе[a]: из Сеира ко мне взывает некто: «Страж, сколько ещё ночи? Страж, сколько ещё ночи?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Дума» созвучно еврейскому слову «молчание»; из-за упоминания Сеира некоторые связывают Думу с Эдомом.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Что с ночью?» Еврейское выражение спрашивает о состоянии ночи — как далеко она продвинулась или сколько её ещё осталось.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: пророчество
  rationale: В заголовках пророческих речей слово обозначает возвещение или пророческое изречение. «Пророчество» естественно и понятно современному русскому читателю, не привнося буквального образа тяжёлой ноши.
- source_word: דּוּמָה
  choice: Дума
  rationale: Форма передана как имя собственное в соответствии со структурой заголовка. Возможный смысловой отзвук слова «молчание» и связь с Эдомом сохранены в сноске.
- source_word: אֵלַי קֹרֵא
  choice: ко мне взывают
  rationale: Причастие мужского рода единственного числа не называет действующее лицо. Русская неопределённо-личная конструкция сохраняет эту неопределённость; «взывают» передаёт обращённый к стражу настойчивый возглас.
- source_word: מִשֵּׂעִיר
  choice: из Сеира
  rationale: Предлог указывает, откуда доносится обращение; географическое имя передано в традиционной русской форме.
- source_word: שֹׁמֵר
  choice: страж
  rationale: В контексте ночного дозора это обращение к несущему стражу. Краткое слово «страж» сохраняет поэтическую силу и повтор.
- source_word: מַה מִלַּיְלָה / מַה מִלֵּיל
  choice: сколько ещё ночи?
  rationale: Обе параллельные формулы спрашивают о ходе или оставшейся продолжительности ночи. Такой перевод звучит естественно по-русски и сохраняет подразумеваемый вопрос о том, далеко ли продвинулась ночь.
theological_decisions:
- issue: Отождествление דּוּמָה
  choice: Имя собственное «Дума» в основном тексте
  alternative: «молчание» либо косвенное обозначение Эдома
  rationale: Форма пророческого заголовка благоприятствует пониманию слова как имени, а упоминание Сеира допускает эдомский контекст. Транслитерация не разрешает эту историко-лексическую неоднозначность без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Повтор обращения и вопроса сохранён; синтаксис сделан естественным для русского без уточнения личности говорящего.
