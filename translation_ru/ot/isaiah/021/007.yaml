  text: And he saw riders, pairs of horsemen[a], riders on donkeys, riders on camels; and he listened intently, with great attentiveness.
translation:
  language: ru
  text: 'И увидел он отряд всадников: конников, ехавших попарно, всадников на ослах и всадников на верблюдах; и внимательно прислушался, с величайшим вниманием[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально: «внимание, великое внимание»; повтор подчёркивает крайнюю сосредоточенность. Слово, переданное как «отряд всадников», может также означать «колесница» или «колесничный отряд».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: И увидел он
  rationale: Форма Qal perfect 3 м. ед. ч. с союзом передаёт последовательное повествовательное действие; инверсия сохраняет возвышенный, но понятный библейский регистр.
- source_word: רֶכֶב
  choice: всадников
  rationale: Хотя слово может означать «колесница» или «колесничное войско», параллельные упоминания ослов и верблюдов указывают здесь на собирательное обозначение едущих верхом, а не колёсных повозок.
- source_word: צֶמֶד פָּרָשִׁים
  choice: конников попарно
  rationale: צֶמֶד обозначает пару или упряжку, а פָּרָשִׁים — конников. Формулировка естественно передаёт видимое построение и не превращает собирательное описание в одну-единственную пару.
- source_word: רֶכֶב חֲמוֹר
  choice: всадников на ослах
  rationale: Контекстуальное раскрытие конструкции передаёт людей, едущих верхом на ослах, и избегает вводящего в заблуждение буквального варианта «колесница осла».
- source_word: רֶכֶב גָּמָל
  choice: всадников на верблюдах
  rationale: Параллельно предыдущей конструкции речь идёт о едущих верхом на верблюдах.
- source_word: וְהִקְשִׁיב
  choice: и стал напряжённо вслушиваться
  rationale: Hiphil от קשׁב выражает целенаправленное, сосредоточенное слушание; «стал» естественно отмечает переход от наблюдения к напряжённому слуховому вниманию.
- source_word: קֶשֶׁב רַב קָשֶׁב
  choice: с великим вниманием
  rationale: Повтор существительного с רַב усиливает значение. Русская формулировка передаёт эмфазу без неестественного буквального повтора; буквальная особенность отражена в сноске.
