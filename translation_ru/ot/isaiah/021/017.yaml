base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/017.yaml
  text: And the remainder of the number of the bowmen[a], the mighty men of the sons of Kedar, will be few, for Yahweh, the God of Israel[b], has spoken.
translation:
  language: ru
  text: И оставшихся лучников[a] — могучих воинов из сынов Кедара — будет немного[b], потому что Яхве, Бог Израиля, сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лука»; лук здесь обозначает вооружённых им людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный более буквальный перевод: «И остаток числа лучников, могучих воинов из сынов Кедара, уменьшится».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁאָר מִסְפַּר
  choice: И оставшихся … будет немного
  rationale: Еврейское сочетание буквально говорит об «остатке числа», но по-русски естественнее передать его как количество тех, кто останется; количественный смысл сохранён без привнесения богословского оттенка слова «остаток».
- source_word: קֶשֶׁת
  choice: лучников
  rationale: Буквально «лук»; здесь оружие метонимически обозначает вооружённых им людей. «Лучники» ясно и естественно передаёт военный контекст.
- source_word: גִּבּוֹרֵי
  choice: могучих воинов
  rationale: Слово обозначает сильных, доблестных людей, особенно воинов. Сочетание передаёт и силу, и военный смысл контекста.
- source_word: בְנֵי קֵדָר
  choice: из сынов Кедара
  rationale: Сохранён еврейский родовой оборот и этническое наименование, при этом предлог «из» естественно связывает его с лучниками-воинами.
- source_word: יִמְעָטוּ
  choice: будет немного
  rationale: Глагол означает «стать малочисленными, уменьшиться числом». Результативная русская формулировка естественна и соответствует контексту поражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо передаёт еврейскую сопряжённую конструкцию и сохраняет идентификацию Яхве как Бога Израиля.
- source_word: דִּבֵּר
  choice: сказал это
  rationale: Перфект утверждает уже произнесённое слово как основание достоверности пророчества; местоимение «это» делает русскую заключительную формулу естественной.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Значение слова שְׁאָר в количественном обороте
  choice: оставшихся
  alternative: остаток
  rationale: Контекст подчёркивает малое количество уцелевших воинов. Выбор не придаёт слову специального богословского смысла «остатка», которого данный стих сам по себе не требует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён ради ясности, но образ лука, родовое обозначение «сыны Кедара» и неоднозначность количественной конструкции сохранены в тексте и примечаниях.
