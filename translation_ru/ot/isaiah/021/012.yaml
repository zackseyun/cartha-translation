  yaml_path: translation/ot/isaiah/021/012.yaml
  text: The watchman says[a], “Morning comes, and also night. If you would inquire, inquire; return[b], come.”
translation:
  language: ru
  text: 'Страж говорит[a]: «Наступает утро, и ночь тоже. Если хотите спросить — спрашивайте; вернитесь, приходите»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Страж сказал». Еврейская форма допускает прошедшее время, но здесь она вводит речь стража в ответ на вопрос из предыдущего стиха.'
    reason: grammatical_alternative
  - marker: b
    text: 'Последние слова можно понять и так: «обратитесь, приходите снова». Они могут призывать к обращению или просто предлагать позднее вновь прийти с вопросом; еврейский текст оставляет оттенок смысла открытым.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁמֵר
  choice: страж
  rationale: Субстантивированное причастие обозначает того, кто несёт дозор; «страж» естественно и достойно звучит в контексте пророческого возглашения.
- source_word: אָמַר
  choice: отвечает
  rationale: Хотя форма морфологически перфектная, здесь она вводит прямую речь как ответ на вопрос предыдущего стиха; настоящее время естественно передаёт живой характер диалога.
- source_word: אָתָה בֹקֶר
  choice: наступает утро
  rationale: Глагол אתה означает приход; с подлежащим «утро» русское «наступает» точно и естественно передаёт образ.
- source_word: וְגַם לָיְלָה
  choice: но также и ночь
  rationale: Союз допускает простое присоединение, однако сопоставление утра и ночи в русском яснее выражается через «но»; частицы «также и» сохраняют явное גם.
- source_word: אִם תִּבְעָיוּן בְּעָיוּ
  choice: если хотите спросить — спрашивайте
  rationale: 'Сохраняется повтор одного еврейского корня и условно-волевая окраска: желающие вопрошать приглашаются делать это.'
- source_word: שֻׁבוּ
  choice: вернитесь
  rationale: Передаёт основное значение שׁוב, не решая, подразумевается ли буквальное возвращение, повторное обращение или покаяние.
- source_word: אֵתָיוּ
  choice: приходите
  rationale: Прямо передаёт повелительную форму от אתה и сохраняет краткую, несколько загадочную последовательность двух повелений.
theological_decisions:
- issue: Смысл заключительных повелений שֻׁבוּ אֵתָיוּ
  choice: вернитесь, приходите
  alternative: обратитесь и приходите снова
  rationale: Буквальная формулировка сохраняет открытым, идёт ли речь о покаянии или о возвращении за новым ответом; богословский смысл не уточняется сверх еврейского текста.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческого ответа. Повтор глагольного корня в условии и повелении сохранён; неоднозначность финальных команд не устранена.
