source:
  edition: WLC
  text: מַשָּׂ֖א בַּ/עְרָ֑ב בַּ/יַּ֤עַר בַּ/עְרַב֙ תָּלִ֔ינוּ אֹֽרְח֖וֹת דְּדָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/013.yaml
  text: 'An oracle concerning Arabia: In the forest in Arabia you will spend the night[c][b][a], O caravans of Dedanites.'
translation:
  language: ru
  text: Пророчество об Аравии[a]. В лесу Аравии[b] проведёте вы ночь, караваны деданитян[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Возвещение об Аравии»; еврейское מַשָּׂא в заголовках пророчеств может также означать «бремя» или «изречение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «В зарослях Аравии». Еврейское יַעַר обычно означает лес или лесистую местность, но здесь может подразумевать кустарник или густые заросли.'
    reason: cultural_note
  - marker: c
    text: Еврейское אֹרְחוֹת буквально может означать «пути, дороги», но здесь, вероятно, обозначает идущие по ним группы путников, то есть караваны.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Пророчество
  rationale: В заголовках пророческих речей слово обозначает возвещение от Бога. «Пророчество» естественно для современного русского языка и не навязывает буквальный образ «бремени».
- source_word: בַּעְרָב
  choice: об Аравии
  rationale: При מַשָּׂא предлог указывает на предмет пророчества; нейтральное «об» сохраняет широту конструкции и не усиливает её до «против».
- source_word: בַּיַּעַר
  choice: В лесу
  rationale: Основное значение יַעַר — «лес, лесистая местность»; буквальный образ сохранён, а вероятная особенность аравийской местности отмечена в сноске.
- source_word: בַּעְרַב
  choice: Аравии
  rationale: Форма понята как повторное географическое название, что согласуется с заголовком и упоминанием деданитян; возможное прочтение, связанное с вечером, контекстуально менее вероятно.
- source_word: תָּלִינוּ
  choice: проведёте вы ночь
  rationale: Глагол לין означает ночевать или проводить ночь. Такой порядок слов сохраняет поэтическое обращение и звучит достойно по-русски.
- source_word: אֹרְחוֹת
  choice: караваны
  rationale: Хотя существительное буквально может обозначать пути или дороги, здесь в обращении к деданитянам оно метонимически обозначает идущие по ним торговые группы.
- source_word: דְּדָנִים
  choice: деданитян
  rationale: Форма обозначает людей, связанных с Деданом; в сочетании с «караваны» естествен родительный падеж, а вся группа имеет силу обращения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, пророческим звучанием. Инверсия «проведёте вы ночь» подчёркивает прямое обращение, не прибегая к архаизмам. Все смысловые альтернативы, существенные для неоднозначности еврейского текста, вынесены в сноски.
