  text: And look[a], here comes a chariot, a man with a pair of horsemen. And he answered and said, “Fallen, fallen is Babylon[c][b], and all the carved images of her gods he has shattered to the ground.”
translation:
  language: ru
  text: 'И вот, приближается колесница: человек с парой всадников.[a] И он ответил: «Пал, пал Вавилон! Все изваяния его богов[b] он разбил вдребезги и поверг на землю[c]».'
  philosophy: optimal-equivalence
  footnotes:
