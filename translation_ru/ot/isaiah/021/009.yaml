    text: Древнееврейская фраза сжата и допускает разные способы членения; буквально в ней стоят слова «колесница», «человек» и «пара всадников».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все идолы его богов».'
    reason: lexical_alternative
  - marker: c
    text: В древнееврейском тексте сказано «он разбил», но действующее лицо прямо не названо.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה זֶה בָא
  choice: И вот, приближается
  rationale: Передаёт живое указание на появляющийся объект и непосредственность сообщения; «вот» естественно сохраняет функцию הִנֵּה в современном литературном русском.
- source_word: רֶכֶב אִישׁ צֶמֶד פָּרָשִׁים
  choice: колесница с парой всадников
  rationale: Еврейская конструкция предельно сжата и синтаксически трудна. Основной текст передаёт вероятный образ приближающейся колесницы и сохраняет «пару» (צֶמֶד), не пытаясь искусственно воспроизвести неясное אִישׁ; буквальная структура отмечена в сноске.
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: И он сказал в ответ
  rationale: Естественно по-русски передаёт двухглагольную древнееврейскую формулу введения речи, сохраняя значение וַיַּעַן без тяжеловесного «ответил и сказал».
- source_word: נָפְלָה נָפְלָה
  choice: Пал, пал
  rationale: Повтор сохранён ради краткости, торжественности и усиления. Мужской род обусловлен родом названия «Вавилон» в русском языке.
- source_word: בָּבֶל
  choice: Вавилон
  rationale: Устоявшаяся русская форма географического названия.
- source_word: פְּסִילֵי אֱלֹהֶיהָ
  choice: изваяния его богов
  rationale: «Изваяния» конкретно передаёт резные культовые изображения; местоимение согласовано с грамматическим родом слова «Вавилон» в русском языке.
- source_word: שִׁבַּר לָאָרֶץ
  choice: он разбил о землю
  rationale: Передаёт активный глагол 3-го лица единственного числа и направленность действия к земле, не называя подразумеваемого деятеля.
theological_decisions:
- issue: Кто разбил изваяния
  choice: Сохранить форму единственного числа «он разбил», не называя деятеля.
  alternative: «их разбили» или пассивное «они разбиты»
  rationale: В древнееврейском тексте стоит глагол 3-го лица мужского рода единственного числа без явно названного подлежащего. Сохранение этой формы не решает за читателя, идёт ли речь о Боге, завоевателе или ином деятеле.
translation_notes:
  register: Современный литературный русский с торжественной пророческой краткостью. Повтор «Пал, пал» сохранён; трудная конструкция о колеснице передана читабельно, а её подлинная синтаксическая неоднозначность вынесена в сноску.
