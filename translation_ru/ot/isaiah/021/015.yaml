  yaml_path: translation/ot/isaiah/021/015.yaml
  text: For they have fled from swords[a], from the drawn sword, and from the bent bow[c][b], and from the weight of battle.
translation:
  language: ru
  text: Ибо они бежали от мечей, от обнажённого меча[a], от натянутого лука[b] и от тяжести войны[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от занесённого меча». Еврейское слово может обозначать меч, простёртый или приготовленный к удару.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от лука с натянутой тетивой». Еврейское слово описывает лук, приготовленный к выстрелу.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «от тяжести военных действий» или «от жестокости войны». Буквально: «от тяжести войны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Передаёт пояснительно-причинную связь с предыдущим стихом естественным для современного русского языка способом.
- source_word: מִפְּנֵי
  choice: от
  rationale: Четырежды обозначает угрозу, от которой спасаются бегством; повтор предлога в переводе сохраняет риторику оригинала.
- source_word: חֲרָבוֹת
  choice: мечей
  rationale: Прямой перевод множественного числа; здесь оно обобщённо изображает вооружённую угрозу.
- source_word: נָדָדוּ
  choice: бегут
  rationale: В контексте военной опасности глагол означает бегство, а не бесцельное скитание. Русское настоящее время живо передаёт изображаемую пророком сцену.
- source_word: חֶרֶב נְטוּשָׁה
  choice: обнажённого меча
  rationale: Прилагательное описывает меч, извлечённый или простёртый и готовый к применению; «обнажённый меч» — естественное русское соответствие.
- source_word: קֶשֶׁת דְּרוּכָה
  choice: натянутого лука
  rationale: Выражение изображает лук, подготовленный к выстрелу; «натянутый» точно и естественно передаёт это состояние.
- source_word: כֹּבֶד מִלְחָמָה
  choice: тяжести битвы
  rationale: Сохраняет буквальный образ тяжести и непосредственный военный контекст, не сводя его однозначно лишь к ожесточённости или суровости.
