base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/005.yaml
  text: They set the table[a], they spread the rugs, they eat, they drink. Rise up, princes[b]; oil the shield.
translation:
  language: ru
  text: Накрывают стол, расстилают ковры[a], едят, пьют. Вставайте, князья! Смажьте щит маслом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ставят стражу» / «наблюдают со сторожевой башни». Еврейское выражение здесь неясно; основной текст следует пониманию, связанному с приготовлением места для пира.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «помажьте щит», то есть подготовьте его к бою, натерев маслом.'
    reason: cultural_note
lexical_decisions:
- source_word: עָרֹךְ הַשֻּׁלְחָן
  choice: накрывают стол
  rationale: Сочетание буквально передаёт приведение стола в готовность. Русское «накрывают стол» естественно описывает подготовку к пиру и сохраняет конкретный образ.
- source_word: צָפֹה הַצָּפִית
  choice: расстилают ковры
  rationale: Редкое и трудное сочетание допускает толкование, связанное с покрытием или ковром; в контексте последовательной подготовки пира это чтение даёт связный смысл. Неуверенность сохранена в сноске.
- source_word: אָכוֹל שָׁתֹה
  choice: едят, пьют
  rationale: Инфинитивы абсолютные создают живую, отрывистую последовательность действий; в современном русском её естественно передают личные формы настоящего времени.
- source_word: קוּמוּ
  choice: вставайте
  rationale: Повелительное множественного числа резко прерывает сцену пира и передаёт срочность приказа.
- source_word: הַשָּׂרִים
  choice: князья
  rationale: Слово обозначает высокопоставленных правителей или сановников; «князья» сохраняет придворный и возвышенный оттенок контекста.
- source_word: מִשְׁחוּ מָגֵן
  choice: смажьте щит маслом
  rationale: Глагол буквально значит «помажьте» или «смажьте». Уточнение «маслом» естественно передаёт практическую подготовку щита к бою, а единственное число сохраняет собирательный образ еврейского текста.
