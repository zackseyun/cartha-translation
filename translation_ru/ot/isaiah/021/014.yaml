  text: לִ/קְרַ֥את צָמֵ֖א הֵתָ֣יוּ מָ֑יִם יֹשְׁבֵי֙ אֶ֣רֶץ תֵּימָ֔א בְּ/לַחְמ֖/וֹ קִדְּמ֥וּ נֹדֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/014.yaml
  text: Bring water to meet the thirsty[a]; O inhabitants of the land of Tema[b], meet the fugitive with bread.
translation:
  language: ru
  text: Вынесите воду навстречу жаждущему; жители земли Темы[a], встретьте беглеца с хлебом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тема — аравийский оазис и область на караванных путях.
    reason: cultural_note
  - marker: b
    text: 'Или: «встретьте беглеца, дав ему хлеб». Еврейское выражение допускает как встречу с хлебом (припасами), так и снабжение беглеца хлебом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת צָמֵא
  choice: навстречу жаждущему
  rationale: Сочетание לִקְרַאת выражает движение навстречу, а субстантивированное прилагательное צָמֵא обозначает жаждущего человека; единственное число сохранено.
- source_word: הֵתָיוּ מָיִם
  choice: вынесите воду
  rationale: Императив множественного числа в данном контексте призывает принести воду к тому, кто приближается. «Вынесите» естественно передаёт направленное навстречу действие и не дублирует следующую фразу.
- source_word: יֹשְׁבֵי אֶרֶץ תֵּימָא
  choice: жители земли Темы
  rationale: Форма понята как обращение к населению аравийской области или оазиса Тема; топоним передан традиционной русской транслитерацией и склоняется.
- source_word: בְּלַחְמוֹ
  choice: с хлебом
  rationale: Предлог בְּ допускает значение сопровождения или средства, а хлеб может пониматься как припас встречающих либо как хлеб, предназначенный беглецу. Основной текст сохраняет краткость и неоднозначность конструкции.
- source_word: קִדְּמוּ נֹדֵד
  choice: встретьте беглеца
  rationale: Пиэль קדם означает выйти навстречу или встретить; причастие נֹדֵד в контексте бегства обозначает человека, вынужденного бежать, а не просто странника.
