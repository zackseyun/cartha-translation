base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/002.yaml
  text: 'A harsh vision has been declared to me: the betrayer betrays[a], and the destroyer destroys. Go up, Elam; lay siege, Media[b]. I have put an end to all her groaning.'
translation:
  language: ru
  text: 'Мне возвещено суровое видение: предатель предаёт[a], разоритель разоряет. Поднимайся, Элам! Осаждай, Мидия! Я положил конец всем её стенаниям[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вероломный поступает вероломно». В еврейском тексте существительное и глагол образованы от одного корня.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всем её стенаниям». К кому относится «её», в этом стихе прямо не сказано.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָזוּת קָשָׁה
  choice: суровое видение
  rationale: חָזוּת обозначает пророческое видение, а קָשָׁה — его тяжёлый, грозный характер. Такое сочетание естественно для современного литературного русского языка.
- source_word: הֻגַּד לִי
  choice: мне было явлено
  rationale: Пассивная форма указывает, что содержание стало известно пророку. «Было явлено» сохраняет пророческий регистр, не уточняя явно того, кто сообщил видение.
- source_word: הַבּוֹגֵד בּוֹגֵד
  choice: предатель предаёт
  rationale: Сохраняется выразительное повторение одного корня в причастии и глаголе; «предатель» передаёт действующее лицо без добавления конкретной политической идентификации.
- source_word: וְהַשֹּׁדֵד שֹׁדֵד
  choice: разоритель разоряет
  rationale: Корневой повтор сохранён; глагол שׁדד в военном контексте может обозначать разорение, опустошение или грабёж. «Разоряет» достаточно широко передаёт насильственное опустошение.
- source_word: עֲלִי עֵילָם
  choice: Поднимайся, Элам!
  rationale: Императив женского рода согласуется с названием страны; «поднимайся» сохраняет образ военного выступления, присущий עלה.
- source_word: צוּרִי מָדַי
  choice: Осаждай, Мидия!
  rationale: צור здесь употреблено в значении осады. Императив женского рода естественно согласован с русским названием «Мидия».
- source_word: כָּל אַנְחָתָהּ
  choice: всем её стенаниям
  rationale: Суффикс женского рода передан местоимением «её» без уточнения референта. אַנְחָה обозначает вздохи, стоны или стенания; «стенания» соответствует высокому, но понятному пророческому регистру.
- source_word: הִשְׁבַּתִּי
  choice: Я положил конец
  rationale: Каузативная форма означает прекращение действия; русское выражение точно и естественно передаёт результативность.
theological_decisions:
- issue: Референт местоименного суффикса в כָּל אַנְחָתָהּ
  choice: Сохранить неопределённое «её»
  alternative: Уточнить как «стенания Вавилона», «стенания земли» или «стенания, причинённые ею»
  rationale: В самом стихе референт суффикса женского рода прямо не назван. Уточнение внесло бы толкование в основной текст и сняло подлинную неоднозначность.
- issue: Субъект формы הִשְׁבַּתִּי
  choice: 'Передать буквально первым лицом: «Я положил конец»'
  alternative: Назвать говорящего Богом либо связать реплику с другим участником видения
  rationale: Грамматика ясно указывает на первое лицо, однако стих не называет говорящего непосредственно; перевод не должен добавлять идентификацию.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Корневые повторы по возможности сохранены; команды Эламу и Мидии переданы кратко и энергично. Неопределённость женского суффикса оставлена без догматического или исторического уточнения.
