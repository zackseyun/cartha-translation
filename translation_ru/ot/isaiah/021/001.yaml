base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/001.yaml
  text: 'An oracle concerning the wilderness of the sea: like whirlwinds in the Negev sweeping through[a], it comes from the wilderness[c][b], from a fearful land.'
translation:
  language: ru
  text: 'Пророчество о пустыне моря[a]: как вихри, проносящиеся по Негеву[b], из пустыни идёт[c], из земли, внушающей ужас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пустыня у моря». Еврейское выражение необычно и, возможно, служит поэтическим географическим обозначением.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как бури, проносящиеся на юге». «Негев» может обозначать южную область или просто юг.'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте подлежащее глагола «идёт» не названо; оно может относиться к только что описанной буреподобной силе.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: пророчество
  rationale: В заголовках пророческих речей слово обозначает возвещение, нередко имеющее характер суда. «Пророчество» естественно для современного русского языка и не сводит образ к буквальному «бремени».
- source_word: מִדְבַּר יָם
  choice: пустыня моря
  rationale: Сохранена необычная конструкция оригинала и её поэтическая либо географическая неоднозначность; более истолковывающее «пустыня у моря» не внесено в основной текст.
- source_word: כְּסוּפוֹת
  choice: как вихри
  rationale: Слово обозначает сильные бурные ветры; «вихри» передаёт стремительность и образность сравнения.
- source_word: בַּנֶּגֶב
  choice: по Негеву
  rationale: Передано как географическое название южной пустынной области; предлог «по» естественно сочетается с движением вихрей, при этом возможное общее значение «на юге» отмечено в сноске.
- source_word: לַחֲלֹף
  choice: проносящиеся
  rationale: Инфинитив описывает быстрое прохождение бурь через местность; причастная форма естественно передаёт связь со сравнением.
- source_word: מִמִּדְבָּר בָּא
  choice: оно надвигается из пустыни
  rationale: Подлежащее в еврейском тексте не названо. Средний род местоимения позволяет соотнести движение с пророчеством или грозным явлением, не превращая неявного деятеля в человека; «надвигается» передаёт угрожающее движение в контексте бури.
- source_word: מֵאֶרֶץ נוֹרָאָה
  choice: из грозной земли
  rationale: «Грозная» передаёт вызывающий страх характер земли и стилистически соответствует возвышенной поэтической речи.
theological_decisions:
- issue: Степень истолкования загадочного заголовка и географического обозначения
  choice: Сохранить выражение «пустыня моря», не отождествляя его в основном тексте с конкретной страной.
  alternative: Передать как «пустыня у моря» или прямо связать с Вавилоном.
  rationale: Еврейский текст намеренно или поэтически необычен; прямое отождествление с Вавилоном выходит за пределы формулировки данного стиха и устраняет подлинную неоднозначность.
- issue: Неявное подлежащее глагола בָּא
  choice: Передать нейтральным «оно», допускающим отнесение к пророчеству или буреподобной силе.
  alternative: «Он идёт» либо назвать конкретного наступающего врага.
  rationale: В оригинале подлежащее отсутствует, поэтому его персонализация или конкретизация внесла бы толкование, которого сам стих явно не даёт.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой образностью. Необычное «пустыня моря» сохранено ради формы и неоднозначности оригинала; синтаксис слегка упорядочен для естественного русского звучания.
