source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אַרְיֵ֑ה עַל מִצְפֶּ֣ה אֲדֹנָ֗/י אָנֹכִ֞י עֹמֵ֤ד תָּמִיד֙ יוֹמָ֔ם וְ/עַל מִ֨שְׁמַרְתִּ֔/י אָנֹכִ֥י נִצָּ֖ב כָּל הַ/לֵּילֽוֹת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/008.yaml
  text: Then he cried[a], “A lion! On the watchtower, my lord, I stand continually by day[b], and at my post I am stationed all the nights.”
translation:
  language: ru
  text: 'И он закричал[a]: «Лев! На сторожевой башне, господин мой, я непрестанно стою днём и на своём посту нахожусь ночь за ночью[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально можно понять: «И он закричал: „Лев!“»; выражение трудно для истолкования. Возможно также: «И он закричал, как лев».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «все ночи»; возможно также: «каждую ночь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: И он закричал
  rationale: Глагол קרא в данной сцене означает громко воззвать или крикнуть; форма с וַ передаёт продолжение повествования.
- source_word: אַרְיֵה
  choice: Лев!
  rationale: Существительное буквально означает «лев». Синтаксис труден, поэтому в основном тексте сохранено масоретское чтение как отдельное восклицание, а возможное понимание «как лев» отмечено в сноске.
- source_word: עַל מִצְפֶּה
  choice: На сторожевой башне
  rationale: מִצְפֶּה обозначает наблюдательный пункт или сторожевую башню; выбран ясный и естественный русский эквивалент.
- source_word: אֲדֹנָי
  choice: господин мой
  rationale: Форма с суффиксом первого лица означает обращение к господину или начальнику, а не Божье имя; строчная буква сохраняет это различие.
- source_word: אָנֹכִי עֹמֵד תָּמִיד יוֹמָם
  choice: я непрестанно стою днём
  rationale: Независимое местоимение подчёркивает говорящего, причастие выражает продолжающееся действие, а תָּמִיד — постоянство несения дозора.
- source_word: וְעַל מִשְׁמַרְתִּי
  choice: и на своём посту
  rationale: מִשְׁמֶרֶת здесь относится к месту или обязанности стража; «на своём посту» естественно передаёт образ дозорного.
- source_word: אָנֹכִי נִצָּב
  choice: нахожусь
  rationale: Причастие נִצָּב описывает поставленного на определённое место стража. В сочетании «нахожусь на посту» результативный смысл положения передан без тяжеловесного повтора глагола «стою».
- source_word: כָּל הַלֵּילוֹת
  choice: ночь за ночью
  rationale: Еврейское выражение буквально имеет множественное число «все ночи» и указывает на повторяющееся ночное бдение; «ночь за ночью» передаёт это естественно по-русски.
