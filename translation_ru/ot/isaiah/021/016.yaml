base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/016.yaml
  text: 'For thus the Lord said to me: Within a year[a], like the years of a hired worker, all the glory of Kedar will come to an end.'
translation:
  language: ru
  text: 'Ибо так сказал мне Господь: «Ещё год, отсчитанный так же точно, как годы наёмного работника, — и вся слава Кедара[a] придёт к концу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё великолепие (или богатство) Кедара». Еврейское слово может означать славу, почёт, великолепие или материальное изобилие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Ибо так сказал
  rationale: Сохраняет причинно-пояснительную связь с предыдущим контекстом и торжественную формулу провозглашения.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт божественный титул Адонай, не смешивая его с тетраграмматоном; в современном литературном русском «Владыка» естественно выражает господство и власть.
- source_word: בְּעוֹד שָׁנָה
  choice: Ещё год
  rationale: Буквально и естественно передаёт оставшийся до исполнения срок; в сочетании со следующим оборотом речь идёт о точно отсчитанном годе.
- source_word: כִּשְׁנֵי שָׂכִיר
  choice: точно отмеренный, как срок наёмного работника
  rationale: Передаёт образ наёмного работника, чей договорный срок отсчитывается строго и без продления. Небольшое поясняющее развёртывание делает древнюю идиому понятной современному читателю.
- source_word: וְכָלָה
  choice: исчезнет
  rationale: В данном контексте глагол означает исчерпание и прекращение величия Кедара; «исчезнет» естественно выражает итог суда.
- source_word: כָּל כְּבוֹד קֵדָר
  choice: вся слава Кедара
  rationale: Сохраняет полноту כָּל, широкий смысл כָּבוֹד и транслитерирует имя Кедар.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Владыка
  alternative: Господь
  rationale: В исходном тексте стоит титул אֲדֹנָי, а не имя YHWH. «Владыка» позволяет ясно передать титул и избежать их неразличимого русского обозначения.
- issue: Смысл כְּבוֹד применительно к Кедару
  choice: слава
  alternative: великолепие / богатство
  rationale: '«Слава» сохраняет широкую смысловую ёмкость слова: честь, величие, великолепие и материальное благополучие. Более конкретные оттенки отмечены в сноске, чтобы не сужать исходную неоднозначность.'
translation_notes:
  register: Современный литературный русский с сохранением торжественного пророческого звучания. Древняя идиома о сроке наёмного работника передана ясным, но всё ещё образным оборотом. Маркер сноски поставлен после всего предложения, к которому относится лексическая оговорка.
