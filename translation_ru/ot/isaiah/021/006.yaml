  source_fidelity: 'Текст точно передаёт структуру и смысл еврейского стиха: כִּי как вводящее обоснование («Ибо»), повествовательное «так сказал мне», обращение к אֲדֹנָי как к божественному Владыке, два повеления («Пойди, поставь дозорного») и побудительное поручение дозорному сообщать увиденное. «Что увидит» естественно выражает содержание сообщения и сохраняет подразумеваемого субъекта — дозорного.'
