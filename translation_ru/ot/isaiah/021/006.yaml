source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר אֵלַ֖/י אֲדֹנָ֑/י לֵ֚ךְ הַעֲמֵ֣ד הַֽ/מְצַפֶּ֔ה אֲשֶׁ֥ר יִרְאֶ֖ה יַגִּֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/006.yaml
  text: 'For thus the Lord said to me: “Go[a], station the watchman; let him report what he sees.”'
translation:
  language: ru
  text: 'Ибо так сказал мне Владыка: «Пойди, поставь дозорного; пусть он сообщит, что увидит».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит обоснование предыдущих слов; «ибо» сохраняет логическую связь и соответствует возвышенному, но понятному пророческому стилю.
- source_word: כֹה אָמַר
  choice: так сказал
  rationale: Естественно передаёт устойчивую формулу речи при перфекте אָמַר в повествовательной рамке.
- source_word: אֵלַי
  choice: мне
  rationale: Обычная русская конструкция при глаголе речи; отдельный предлог не требуется.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт божественный титул, а не имя YHWH, и позволяет не смешивать их в русском тексте.
- source_word: לֵךְ
  choice: Пойди
  rationale: Прямо передаёт повелительное наклонение и естественно вводит поручение.
- source_word: הַעֲמֵד
  choice: поставь
  rationale: Каузативная форма означает поставить человека на определённое место или пост; русский глагол естественен в сочетании с «дозорным».
- source_word: הַמְצַפֶּה
  choice: дозорного
  rationale: Субстантивированное причастие обозначает человека, наблюдающего с поста; «дозорный» точно соответствует военному контексту.
- source_word: אֲשֶׁר יִרְאֶה
  choice: что увидит
  rationale: Относительное придаточное выражает содержание будущего донесения; совершенный вид естественно передаёт ожидаемое обнаружение.
- source_word: יַגִּיד
  choice: пусть он сообщит
  rationale: Имперфект после повеления имеет побудительный оттенок; «пусть сообщит» ясно передаёт распоряжение доложить увиденное.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Владыка
  alternative: Господь; мой Господь
  rationale: В исходном тексте стоит титул אֲדֹנָי, а не тетраграмматон. «Владыка» сохраняет это различие и не усиливает формально присутствующий суффикс до отдельного притяжательного значения «мой».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Краткая повелительная структура оригинала сохранена; пунктуация делает последовательность поручений ясной.
