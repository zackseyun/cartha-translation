  text: תָּעָ֣ה לְבָבִ֔/י פַּלָּצ֖וּת בִּֽעֲתָ֑תְ/נִי אֵ֚ת נֶ֣שֶׁף חִשְׁקִ֔/י שָׂ֥ם לִ֖/י לַ/חֲרָדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/004.yaml
  text: My heart reels; shuddering terrifies me[a]. The twilight I longed for he has turned into terror for me.
translation:
  language: ru
  text: Сердце моё мечется, дрожь охватила меня. Сумерки, которых я жаждал, он обратил для меня в ужас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּעָה
  choice: мечется
  rationale: Глагол буквально означает блуждать или сбиваться с пути; применительно к сердцу «мечется» естественно передаёт внутреннюю потерю устойчивости и смятение.
- source_word: לְבָבִי
  choice: сердце моё
  rationale: Сохраняет образ сердца как внутреннего человека и поэтический строй еврейского текста.
- source_word: פַּלָּצוּת
  choice: дрожь
  rationale: Существительное обозначает сильную дрожь или содрогание; «дрожь» кратко и выразительно передаёт физический и эмоциональный ужас.
- source_word: בִּעֲתַתְנִי
  choice: охватила меня
  rationale: В сочетании с подлежащим «дрожь» эта формулировка естественно передаёт значение «устрашила меня», не создавая по-русски неуклюжего оборота «дрожь ужаснула меня».
- source_word: נֶשֶׁף
  choice: сумерки
  rationale: Передаёт период тусклого света, вероятнее всего вечерние сумерки, сохраняя поэтическую атмосферу и некоторую временную широту слова.
- source_word: חִשְׁקִי
  choice: которых я жаждал
  rationale: Существительное с суффиксом означает «моё желание, моё влечение»; придаточная конструкция звучит естественно и сохраняет интенсивность желания.
- source_word: שָׂם לִי
  choice: Он обратил для меня
  rationale: Активная форма сохраняет грамматику оригинала. Заглавное «Он» указывает на подразумеваемого в контексте деятеля, не называя его и не добавляя более конкретного толкования.
- source_word: לַחֲרָדָה
  choice: в ужас
  rationale: Слово может означать ужас, тревогу или трепет; здесь «ужас» ясно выражает резкое превращение желанных сумерек в источник страха.
theological_decisions:
- issue: Не выраженный явно субъект глагола שָׂם
  choice: Он обратил
  alternative: обратились для меня / кто-то обратил
  rationale: В еврейском глаголе субъект выражен формой третьего лица мужского рода единственного числа, но в самом стихе не назван. Перевод сохраняет личный субъект, не уточняя его имени; заглавная буква отражает наиболее вероятную отсылку к Богу в контексте, хотя синтаксически субъект остаётся подразумеваемым.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим ритмом. Сохранены телесно-эмоциональные образы сердца, дрожи, сумерек и ужаса; синтаксис сделан естественным без устранения напряжённости оригинала.
