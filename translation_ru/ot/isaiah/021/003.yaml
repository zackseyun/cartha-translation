    issue: «Охвачены дрожью» вместо образа наполненности
    rationale: מָלְאוּ מָתְנַי буквально говорит, что чресла «наполнились»; русская конструкция с «наполнились мучительной дрожью» сохраняет исходную метафору и остаётся естественной.
  - severity: medium
    issue: Разговорная и чрезмерно конкретная форма «я скрючился»
    rationale: נַעֲוֵיתִי допускает значения «согнулся», «искривился», «скрутился». «Согнулся» передаёт физический эффект без разговорной окраски и без сужения значения.
  - severity: low
    issue: «Пришёл в ужас» несколько сильнее и уже, чем נִבְהַלְתִּי
    rationale: Глагол выражает испуг, тревогу, смятение или потрясение. «Пришёл в смятение» сохраняет силу переживания и соответствует лексической широте оригинала, а также английскому audit trail («dismayed»).
