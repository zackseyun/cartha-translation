  rationale: Правка восстанавливает образ наполненных чресл, заменяет разговорное «скрючился» нейтральным литературным «согнулся» и передаёт נִבְהַלְתִּי как смятение, не усиливая его до однозначного ужаса. Синтаксический параллелизм причинных оборотов и все имеющиеся сноски сохранены.
