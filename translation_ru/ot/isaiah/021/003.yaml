  text: עַל כֵּ֗ן מָלְא֤וּ מָתְנַ/י֙ חַלְחָלָ֔ה צִירִ֣ים אֲחָז֔וּ/נִי כְּ/צִירֵ֖י יֽוֹלֵדָ֑ה נַעֲוֵ֣יתִי מִ/שְּׁמֹ֔עַ נִבְהַ֖לְתִּי מֵ/רְאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/003.yaml
  text: Therefore my loins are filled with anguish[a]; pains have seized me like the pains of a woman giving birth. I am bent over from hearing[b]; I am dismayed from seeing.
translation:
  language: ru
  text: Поэтому чресла мои наполнились мучительной дрожью[a]; муки объяли меня, как муки роженицы. Я согнулся от услышанного[b], пришёл в смятение от увиденного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «содроганием»; еврейское слово обозначает сильную телесную дрожь или мучительное корчение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я скрутился» или «меня скрутило».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלְאוּ מָתְנַי
  choice: чресла мои охвачены
  rationale: Сохраняет конкретный телесный образ מָתְנַיִם, но передаёт сочетание естественнее, чем буквальное «наполнились».
- source_word: חַלְחָלָה
  choice: дрожью
  rationale: Слово обозначает сильную телесную дрожь или мучительное содрогание; «дрожь» сохраняет соматический характер контекста.
- source_word: צִירִים אֲחָזוּנִי
  choice: муки объяли меня
  rationale: Передаёт сильные схваткообразные боли и образ внезапно охватившего страдания; «муки» естественно связываются с последующим образом родов.
- source_word: כְּצִירֵי יוֹלֵדָה
  choice: как муки роженицы
  rationale: Кратко и ясно сохраняет прямое сравнение с родовыми муками.
- source_word: נַעֲוֵיתִי
  choice: я скрючился
  rationale: Передаёт состояние физической согнутости или скрученности, выраженное формой нифаль.
- source_word: מִשְּׁמֹעַ
  choice: от услышанного
  rationale: מן с инфинитивом понят причинно; субстантивированная формулировка естественна по-русски и сохраняет параллелизм.
- source_word: נִבְהַלְתִּי
  choice: пришёл в ужас
  rationale: Передаёт сильное потрясение, испуг и смятение, соответствующие напряжённости контекста.
- source_word: מֵרְאוֹת
  choice: от увиденного
  rationale: Причинное значение и синтаксический параллелизм с «от услышанного» сохранены.
