source:
  edition: WLC
  text: מְדֻשָׁתִ֖/י וּ/בֶן גָּרְנִ֑/י אֲשֶׁ֣ר שָׁמַ֗עְתִּי מֵ/אֵ֨ת יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הִגַּ֥דְתִּי לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/010.yaml
  text: O my threshed one[a], and son of my threshing floor, what I have heard from Yahweh of hosts, the God of Israel[b], I have declared to you.
translation:
  language: ru
  text: О мой измолоченный[a], сын моего гумна[b]! То, что я услышал от Яхве Воинств, Бога Израиля, я возвестил вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мой обмолоченный», «мой сокрушённый». Еврейское слово сохраняет образ молотьбы как метафору тяжёлого бедствия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сын моего гумна». Это продолжение образа молотьбы; вероятно, так назван тот, кто был избит или сокрушён, словно зерно на гумне.'
    reason: cultural_note
lexical_decisions:
- source_word: מְדֻשָׁתִי
  choice: мой измолоченный
  rationale: Субстантивированное страдательное обозначение от דושׁ сохраняет образ молотьбы и одновременно передаёт тяжесть перенесённого сокрушения, не заменяя метафору прямым толкованием вроде «угнетённый народ».
- source_word: וּבֶן גָּרְנִי
  choice: сын моего гумна
  rationale: Буквально переданы בֵּן «сын» и גֹּרֶן «гумно, место молотьбы». Намеренно сохранён необычный метафорический параллелизм исходного текста.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: то, что я услышал
  rationale: Естественная русская конструкция, передающая содержание услышанного; перфект в данном пророческом сообщении уместно выражен прошедшим временем.
- source_word: מֵאֵת יְהוָה צְבָאוֹת
  choice: от Яхве Воинств
  rationale: מֵאֵת обозначает источник вести. Личное имя передано как «Яхве», а צְבָאוֹת — широким по значению «Воинств», без сужения исключительно до земных армий.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая передача сопряжённой конструкции, отождествляющей Яхве Воинств с Богом Израиля.
- source_word: הִגַּדְתִּי לָכֶם
  choice: я возвестил вам
  rationale: Форма Hiphil от נגד означает сообщить, объявить; «возвестил» сохраняет достойный пророческий регистр. «Вам» передаёт множественное число адресатов без лишнего пояснения в основном тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно транслитерировано, а не заменено титулом.
- issue: Степень сохранения метафоры молотьбы
  choice: Сохранить в основном тексте образы измолоченного и сына гумна
  alternative: Передать толкованием вроде «мой угнетённый народ»
  rationale: Необычная сельскохозяйственная метафора принадлежит самому еврейскому тексту. Её прямое сохранение не решает без достаточных оснований, кто именно назван измолоченным, и удерживает напряжённость образа.
translation_notes:
  register: Современный литературный русский с приподнятым пророческим звучанием. Необычность обращений «мой измолоченный» и «сын моего гумна» сохранена намеренно как особенность исходной метафоры; пунктуация оформляет их как единое эмоциональное обращение.
