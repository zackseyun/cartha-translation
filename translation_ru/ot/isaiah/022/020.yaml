base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/020.yaml
  text: And it shall happen on that day that I will call my servant Eliakim son of Hilkiah,[a]
translation:
  language: ru
  text: 'И будет в тот день: Я призову Моего слугу Елиакима, сына Хилкии.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я позову». Еврейский глагол может означать призыв человека для назначения или поручения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Естественно передаёт древнееврейскую формулу, вводящую будущее событие, сохраняя её краткость и пророческое звучание.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчивое и естественное для современного русского языка соответствие пророческой временной формуле.
- source_word: וְקָרָאתִי
  choice: Я призову
  rationale: Глагол קרא с ל может означать «позвать», «призвать» или «вызвать». «Призову» сохраняет значение обращения к человеку и допускает контекст поручения или назначения, не выражая его чрезмерно явно.
- source_word: לְעַבְדִּי
  choice: Моего слугу
  rationale: В данном контексте עבד обозначает человека, состоящего на службе у Бога и получающего от Него поручение; «слуга» не выдвигает на первый план значение социальной несвободы.
- source_word: אֶלְיָקִים
  choice: Елиакима
  rationale: Имя передано в принятой русской библейской форме и поставлено в винительный падеж согласно синтаксису перевода.
- source_word: בֶּן חִלְקִיָּהוּ
  choice: сына Хелкии
  rationale: Стандартная передача древнееврейского патронима; форма «Хелкия» соответствует принятой русской библейской традиции.
theological_decisions:
- issue: Обозначение Елиакима как принадлежащего Богу служителя
  choice: Моего слугу
  alternative: Моего раба
  rationale: Фраза указывает на избрание Елиакима Богом для служения и поручения. «Слуга» сохраняет эту связь, не усиливая без необходимости оттенок рабского социального положения и не вводя в сам перевод позднейших типологических толкований.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified пророческим звучанием. Двоеточие естественно связывает временную формулу с последующим действием. Заглавная буква в «Моего» отражает обращение Бога о принадлежащем Ему слуге в принятом русском религиозном регистре.
