id: ISA.22.9
reference: Isaiah 22:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אֵ֨ת בְּקִיעֵ֧י עִיר דָּוִ֛ד רְאִיתֶ֖ם כִּי רָ֑בּוּ וַֽ/תְּקַבְּצ֔וּ אֶת מֵ֥י הַ/בְּרֵכָ֖ה הַ/תַּחְתּוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/009.yaml
  text: You saw that the breaches of the city of David were many[a], and you collected the waters of the lower pool.
translation:
  language: ru
  text: Вы увидели, что проломов в городе Давида много, и собрали воду нижнего пруда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воду нижнего водоёма». Еврейское слово, переведённое как «пруд», может также обозначать водоём для хранения воды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקִיעֵי
  choice: проломов
  rationale: Существительное обозначает разрывы или бреши в сооружении; в контексте городских укреплений «проломы» ясно передаёт повреждённые участки стены.
- source_word: עִיר דָּוִד
  choice: городе Давида
  rationale: Сохранено историческое наименование места в естественной для русского языка форме.
- source_word: רְאִיתֶם
  choice: вы увидели
  rationale: Прямое значение глагола ראה; по контексту речь идёт о том, что жители заметили состояние укреплений.
- source_word: כִּי רָבוּ
  choice: что ... много
  rationale: כִּי вводит содержание увиденного, а רָבוּ указывает на многочисленность проломов; русская конструкция передаёт это естественно.
- source_word: וַתְּקַבְּצוּ
  choice: и собрали
  rationale: Глагол קבץ означает «собирать, скапливать»; с водой «собрали» сохраняет конкретный смысл мер по её накоплению.
- source_word: מֵי הַבְּרֵכָה הַתַּחְתּוֹנָה
  choice: воду нижнего пруда
  rationale: מֵי естественно передаётся в русском собирательным единственным «воду», а בְּרֵכָה может обозначать пруд или водоём; «нижний пруд» кратко и ясно сохраняет топографическое обозначение.
