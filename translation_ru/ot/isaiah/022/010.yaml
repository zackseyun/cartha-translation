  text: וְ/אֶת בָּתֵּ֥י יְרוּשָׁלִַ֖ם סְפַרְתֶּ֑ם וַ/תִּתְֿצוּ֙ הַ/בָּ֣תִּ֔ים לְ/בַצֵּ֖ר הַ/חוֹמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/010.yaml
  text: And you counted the houses of Jerusalem[b][a], and you tore down the houses to fortify the wall.
translation:
  language: ru
  text: И дома Иерусалима вы пересчитали[a], и разрушили дома[b], чтобы укрепить стену.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосчитали».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «снесли дома».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: И дома Иерусалима
  rationale: Союз וְ передан как «и», а необычно вынесенный вперёд прямой объект сохранён начальной позицией слов «дома Иерусалима», что передаёт его смысловое выделение без искусственного русского оборота.
- source_word: בָּתֵּי יְרוּשָׁלִַם
  choice: дома Иерусалима
  rationale: Сочетание передано как конструкция принадлежности; определённость в русском языке естественно выражается контекстом.
- source_word: סְפַרְתֶּם
  choice: вы пересчитали
  rationale: Глагол ספר в породе qal означает считать или пересчитывать. «Пересчитали» естественно описывает учёт городских домов при подготовке к обороне, не добавляя идеи оценки их состояния.
- source_word: וַ/תִּתְֿצוּ
  choice: и разрушили
  rationale: נתץ обозначает разрушение или снос сооружения. «Разрушили» ясно и прямо передаёт действие, не вводя отсутствующего в тексте уточнения о повторном использовании строительного материала.
- source_word: הַ/בָּתִּים
  choice: дома
  rationale: Повтор слова «дома» сохранён вслед за еврейским текстом; определённый артикль передаётся контекстуально, поскольку русский язык не имеет артиклей.
- source_word: לְ/בַצֵּר
  choice: чтобы укрепить
  rationale: Инфинитив с לְ выражает цель. В данном военном контексте בצר означает сделать оборонительное сооружение более крепким или защищённым.
- source_word: הַ/חוֹמָה
  choice: стену
  rationale: חוֹמָה — оборонительная стена города. В контексте Иерусалима слово «стена» достаточно ясно и не требует добавления «городская».
