base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/004.yaml
  text: Therefore I said[a], “Look away from me; let me weep bitterly[b]. Do not labor to comfort me over the destruction of the daughter of my people.”
translation:
  language: ru
  text: 'Поэтому я сказал: «Отвернитесь от меня[a], дайте мне горько плакать. Не старайтесь утешить меня из-за разорения дочери моего народа[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Отведите взгляд от меня».'
    reason: lexical_alternative
  - marker: b
    text: '«Дочь моего народа» — пророческий поэтический образ: народ олицетворён в образе дочери.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁעוּ מִנִּי
  choice: Отвернитесь от меня
  rationale: Императив множественного числа в данном контексте выражает просьбу отвести взгляд или оставить говорящего одного. «Отвернитесь от меня» естественно по-русски и сохраняет возможный зрительный оттенок глагола.
- source_word: אֲמָרֵר בַּבֶּכִי
  choice: дайте мне горько плакать
  rationale: Сочетание глагола מרר с существительным «плач» передаёт усиленную, горестную скорбь. Такая формулировка идиоматична и сохраняет образ горечи, не превращая его в отдельное толкование.
- source_word: אַל תָּאִיצוּ לְנַחֲמֵנִי
  choice: Не настаивайте на том, чтобы утешить меня
  rationale: Каузативная форма אוץ может обозначать понуждение, настойчивость или поспешность. В контексте отвергаемого утешения «не настаивайте» лучше передаёт нежелательное усиленное старание, чем буквальное «не спешите».
- source_word: שֹׁד
  choice: разорение
  rationale: Слово обозначает насильственное опустошение, разгром или гибель. «Разорение» сохраняет идею постигшей народ разрушительной беды, не сужая её до одного лишь грабежа.
- source_word: בַּת עַמִּי
  choice: дочери моего народа
  rationale: Сохранён буквальный пророческий образ народа, олицетворённого как дочь; он значим для поэтики текста и не требует преждевременного отождествления исключительно с Иерусалимом.
theological_decisions:
- issue: Сохранять ли выражение בַּת עַמִּי как поэтическое олицетворение или заменить его прямым обозначением народа либо Иерусалима
  choice: дочери моего народа
  alternative: моего народа; дочери Сиона; Иерусалима
  rationale: В еврейском тексте прямо сказано «дочь моего народа». Сохранение метафоры передаёт эмоциональную и литературную силу стиха и не вводит более узкое отождествление, которого сам стих не формулирует.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис оставлен ясным и эмоционально напряжённым; сохранено поэтическое олицетворение «дочь моего народа».
