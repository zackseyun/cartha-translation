  verdict: revise
  source_fidelity: 'Основная последовательность образов и грамматических связей передана верно: колышек/гвоздь, надёжное место, его смещение, отсечение и падение, а также отсечение груза. Однако «расшатается» несколько сужает תָּמוּשׁ, которое прежде всего обозначает сдвиг/уступание; «сдвинется» сохраняет образ и не предрешает способ разрушения. Финальная формула דִּבֵּר лучше передаётся без добавленного «это».'
