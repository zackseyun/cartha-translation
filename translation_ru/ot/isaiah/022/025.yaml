source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת תָּמוּשׁ֙ הַ/יָּתֵ֔ד הַ/תְּקוּעָ֖ה בְּ/מָק֣וֹם נֶאֱמָ֑ן וְ/נִגְדְּעָ֣ה וְ/נָפְלָ֗ה וְ/נִכְרַת֙ הַ/מַּשָּׂ֣א אֲשֶׁר עָלֶ֔י/הָ כִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/025.yaml
  text: On that day[a], declares Yahweh of hosts, the peg fastened in a secure place will give way, and it will be cut down and fall, and the load that was on it will be cut off[b], for Yahweh has spoken.
translation:
  language: ru
  text: В тот день, — возвещает Господь Воинств, — колышек, вбитый в надёжном месте, сдвинется; он будет срублен и упадёт, а груз, висевший на нём, будет отсечён[a], ибо Господь изрёк.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Груз» можно также перевести как «ноша» или «бремя»; имеется в виду то, что держалось или висело на колышке.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Господь Воинств
  rationale: נְאֻם передаёт формулу пророческого провозглашения; «возвещает» звучит естественно и торжественно. צְבָאוֹת сохранено как широкий титул «Воинств», не ограниченный только земными войсками.
- source_word: תָּמוּשׁ
  choice: расшатается
  rationale: В образе вбитого кола глагол מוּשׁ означает, что он сдвинется с места и перестанет надёжно держаться; «расшатается» естественно передаёт наступающую неустойчивость.
- source_word: הַיָּתֵד
  choice: кол
  rationale: יָתֵד может обозначать колышек, кол или крупный гвоздь. Контекст описывает предмет, вбитый в опору и несущий подвешенный груз; «кол» сохраняет этот образ без привнесения исключительно шатрового значения.
- source_word: הַתְּקוּעָה
  choice: вбитый
  rationale: Страдательное причастие описывает кол, который забили или прочно закрепили; конкретное «вбитый» сохраняет физическую образность оригинала.
- source_word: בְּמָקוֹם נֶאֱמָן
  choice: в прочное место
  rationale: נֶאֱמָן здесь характеризует надёжность и устойчивость места, а не нравственную верность. Сочетание с «вбитый» требует естественной русской конструкции «в прочное место».
- source_word: וְנִגְדְּעָה וְנָפְלָה
  choice: его срубят, и он упадёт
  rationale: גדע выражает отсечение или срубание, а נפל — падение. Последовательность действий сохранена явно.
- source_word: וְנִכְרַת הַמַּשָּׂא אֲשֶׁר עָלֶיהָ
  choice: и груз, висевший на нём, будет отсечён
  rationale: מַשָּׂא означает груз или ношу; в данном образе это то, что держалось на коле. «Будет отсечён» сохраняет лексику уничтожения и формальную связь с образом отсечения.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: потому что Господь сказал это
  rationale: Формула утверждает непреложность приговора на основании слова Господа. Добавленное местоимение «это» естественно по-русски указывает на всё предшествующее изречение.
theological_decisions:
- issue: Кого или что обозначает кол
  choice: Сохранить метафору, не называя её референта.
  alternative: Отождествить кол с Елиакимом, его домом или династией либо прямо представить стих как отмену предшествующего обещания.
  rationale: Сам стих не называет референта метафоры. Его явное уточнение устранило бы подлинную смысловую и богословскую напряжённость контекста.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» соответствует устойчивой русской библейской традиции; при этом одинаковая передача имени в обеих частях стиха сохраняет внутреннее единство формулы.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Конкретная предметная образность сохранена; референт метафоры намеренно не уточнён. Маркер [a] помещён непосредственно после спорного выражения.
