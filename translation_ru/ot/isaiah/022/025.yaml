  terminology: '«Господь Воинств» допустимо и последовательно передаёт יהוה צבאות. «Колышек» удачнее, чем «кол»: он естественнее сочетается с тем, что на нём висит груз, и не навязывает шатровый контекст. Сноска корректно отмечает лексическую альтернативу для מַשָּׂא и уместно привязана к «грузу».'
