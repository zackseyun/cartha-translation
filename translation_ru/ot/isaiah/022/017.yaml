  source_fidelity: 'Основной смысл передан верно: הִנֵּה вводит emphатическое пророческое объявление, глагол טלטל и однокоренное дополнение выражают насильственное бросание, а עֹטְךָ עָטֹה — усиленное обёртывание/укутывание. «Яхве» последовательно передаёт тетраграмматон. Однако «обовьёт тебя» менее точно и естественно для עטה, поскольку обычно вызывает образ обвивания чем-либо, а не завертывания самого человека.'
