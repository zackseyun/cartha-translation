  text: הִנֵּ֤ה יְהוָה֙ מְטַלְטֶלְ/ךָ֔ טַלְטֵלָ֖ה גָּ֑בֶר וְ/עֹטְ/ךָ֖ עָטֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/017.yaml
  text: Look[a], Yahweh is about to hurl you away violently, O man, and wrap you up tightly.
translation:
  language: ru
  text: Вот, Яхве готов с силой швырнуть тебя, человек, и крепко завернуть тебя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-эмфатическую силу частицы естественным для современного русского языка вводным словом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: מְטַלְטֶלְךָ טַלְטֵלָה
  choice: вот-вот с силой швырнёт тебя
  rationale: Порода pilpel и однокоренное дополнение выражают резкое, усиленное бросание; «вот-вот» передаёт близость пророчески возвещаемого действия, подчеркнутую הִנֵּה.
- source_word: גָּבֶר
  choice: человек
  rationale: Сохранено наиболее прямое значение существительного и возможное обращение к Шевне; синтаксическая неоднозначность отмечена в сноске.
- source_word: וְעֹטְךָ עָטֹה
  choice: и крепко обовьёт тебя
  rationale: Однокоренная усилительная конструкция передана наречием «крепко»; «обовьёт» сохраняет образ охватывания или обёртывания и подготавливает образ свёртывания в следующем стихе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте и не подменяет его титулом; форма «Яхве» соответствует преобладающей современной научной реконструкции произношения.
- issue: Функция слова גָּבֶר
  choice: обращение «человек»
  alternative: «сильный человек» либо не обращение, а часть трудной усилительной конструкции
  rationale: Краткий еврейский оборот синтаксически неясен. Основной текст сохраняет возможное прямое обращение, не добавляя уверенно значения силы; альтернативу сообщает сноска.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой энергией. Повторы однокоренных еврейских форм переданы сильными глаголами и наречиями, чтобы сохранить усиление без неестественной буквальности.
