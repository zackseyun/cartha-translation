  text: וְ/הִלְבַּשְׁתִּ֣י/ו כֻּתָּנְתֶּ֗/ךָ וְ/אַבְנֵֽטְ/ךָ֙ אֲחַזְּקֶ֔/נּוּ וּ/מֶֽמְשֶׁלְתְּ/ךָ֖ אֶתֵּ֣ן בְּ/יָד֑/וֹ וְ/הָיָ֥ה לְ/אָ֛ב לְ/יוֹשֵׁ֥ב יְרוּשָׁלִַ֖ם וּ/לְ/בֵ֥ית יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/021.yaml
  text: I will clothe him with your tunic[a], and I will fasten your sash on him; I will place your authority into his hand, and he will become a father to the inhabitants of Jerusalem and to the house of Judah.
translation:
  language: ru
  text: Я облачу его в твой хитон и крепко опояшу твоим поясом; твою власть Я передам в его руки, и он станет отцом[a] для жителей Иерусалима и для дома Иуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отцом»; здесь это образ заботливого, ответственного и защищающего руководителя, а не указание на родство.'
    reason: Пояснение прямой еврейской метафоры без её устранения из основного текста.
lexical_decisions:
- source_word: וְהִלְבַּשְׁתִּיו
  choice: Я облачу его
  rationale: Каузативная форма глагола לבש означает «одеть, облечь кого-либо». «Облачу» естественно передаёт торжественный контекст введения в должность.
- source_word: כֻּתָּנְתֶּךָ
  choice: в твой хитон
  rationale: כֻּתֹּנֶת — длинная нательная одежда типа туники. «Хитон» точнее, чем общее «одежда», и сохраняет древний предметный образ.
- source_word: וְאַבְנֵטְךָ אֲחַזְּקֶנּוּ
  choice: крепко опояшу твоим поясом
  rationale: אַבְנֵט обозначает пояс, в том числе часть должностного облачения; Piel חזק здесь выражает прочное закрепление пояса. Русская конструкция передаёт смысл естественно, не превращая действие в отвлечённое «укреплю».
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: твою власть
  rationale: מֶמְשָׁלָה в данном контексте означает передаваемые полномочия и власть должностного лица.
- source_word: אֶתֵּן בְּיָדוֹ
  choice: Я передам в его руки
  rationale: Оборот означает вверение власти и ответственности. Русское множественное «в руки» идиоматично и сохраняет конкретный образ передачи.
- source_word: וְהָיָה לְאָב
  choice: он станет отцом
  rationale: Конструкция указывает на новый статус после назначения. Прямая метафора «отец» сохранена без пояснительного ослабления «как отец».
- source_word: לְיוֹשֵׁב יְרוּשָׁלִַם
  choice: для жителей Иерусалима
  rationale: Причастие в единственном числе имеет собирательное значение; множественное «жителей» естественно выражает его по-русски.
- source_word: וּלְבֵית יְהוּדָה
  choice: для дома Иуды
  rationale: Сохранён библейский национально-родовой оборот «дом Иуды», а не сведён к одному географическому названию.
theological_decisions:
- issue: Метафорическое именование политического должностного лица «отцом»
  choice: он станет отцом
  alternative: он будет как отец; он станет покровителем
  rationale: В еврейском тексте стоит прямая метафора לְאָב. Она изображает ответственное, заботливое и защищающее руководство; перевод не подменяет её толкованием и не привносит позднейших конфессиональных значений.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной интонацией. Слова «облачу» и «хитон» поддерживают контекст официального облачения, а синтаксис остаётся понятным широкому читателю. Маркер сноски поставлен после слова «отцом», к которому относится пояснение; во входном английском слое маркер после «tunic» не соответствовал содержанию сноски.
