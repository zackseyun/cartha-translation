base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/018.yaml
  text: He will surely wrap you up tightly[a], like a ball, into a broad land. There you will die, and there will be the chariots of your glory[c][b], O shame of your master's house.
translation:
  language: ru
  text: Он непременно туго скрутит тебя[a], словно мяч, — в просторную страну[b]. Там ты умрёшь, и там будут колесницы твоей славы[c], о позор дома твоего господина!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непременно туго обмотает тебя»; возможно также: «непременно свернёт тебя». В еврейском тексте для усиления повторён один и тот же корень и употреблено однокоренное существительное.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в землю, широкую руками» — идиома, обозначающая широкую, просторную землю.'
    reason: cultural_note
  - marker: c
    text: 'Или: «твои великолепные колесницы»; возможно также: «колесницы, которыми ты гордился». Еврейское выражение может относиться к колесницам как к предмету славы или гордости адресата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָנוֹף יִצְנָפְךָ צְנֵפָה
  choice: непременно туго скрутит тебя
  rationale: Сочетание инфинитива абсолютного с личной формой того же корня усиливает действие, а однокоренное существительное подчёркивает образ туго свёрнутого или обмотанного предмета. «Непременно туго скрутит» естественно передаёт и интенсивность, и образ, не уточняя, будто речь обязательно идёт об одежде или тюрбане.
- source_word: כַּדּוּר
  choice: словно мяч
  rationale: Сравнение представляет человека как туго свёрнутый шарообразный предмет; «мяч» ясно и естественно передаёт этот образ по-русски.
- source_word: אֶל אֶרֶץ רַחֲבַת יָדָיִם
  choice: и отправит в просторную землю
  rationale: Буквально выражение означает «в землю широкую руками» и идиоматически описывает обширную, просторную страну. Глагол «отправит» эксплицирует необходимое в русском языке направление движения, выраженное еврейским אֶל, не конкретизируя способ удаления.
- source_word: שָׁמָּה ... וְשָׁמָּה
  choice: Там ... и там
  rationale: Повтор наречия сохранён ради пространственного и риторического акцента оригинала.
- source_word: תָמוּת
  choice: ты умрёшь
  rationale: Простая форма будущего времени естественно передаёт прямое пророческое обращение.
- source_word: מַרְכְּבוֹת כְּבוֹדֶךָ
  choice: колесницы твоей славы
  rationale: Сохранена сжатая конструкция оригинала, которая может означать как великолепные колесницы, так и колесницы, служившие адресату предметом славы и гордости.
- source_word: קְלוֹן בֵּית אֲדֹנֶיךָ
  choice: о позор дома твоего господина
  rationale: Оборот передан как обращённое к сановнику обличение. אֲדֹן здесь обозначает его земного господина, а не служит божественным титулом.
