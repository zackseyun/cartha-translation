base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/014.yaml
  text: 'And the LORD of Armies has revealed in my ears: “Surely this iniquity will not be atoned for you until you die,” says the Lord GOD of Armies.'
translation:
  language: ru
  text: 'И Господь Воинств открыл мне: «Не будет прощён вам этот грех до самой вашей смерти», — сказал Владыка, Господь Воинств.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִגְלָה בְאָזְנַי
  choice: И Господь Воинств открыл мне
  rationale: 'Буквально: «и было открыто в моих ушах». В современном русском «открыл мне» естественно передаёт смысл личного откровения; субъект восстановлен из следующего имени.'
- source_word: יְהוָה צְבָאוֹת
  choice: Господь Воинств
  rationale: Традиционная передача тетраграмматона как «Господь» сочетается с близким к форме оригинала «Воинств» и сохраняет титул.
- source_word: אִם יְכֻפַּר
  choice: Не будет прощён
  rationale: Частица אִם в клятвенной формуле выражает решительное отрицание. Страдательная форма כפר здесь передана понятным русским «будет прощён», не устраняя смысл снятия вины.
- source_word: לָכֶם
  choice: вам
  rationale: 'Явно сохраняет местоименный элемент оригинала: вина не будет прощена адресатам пророчества.'
- source_word: עַד תְּמֻתוּן
  choice: до самой вашей смерти
  rationale: Передаёт предел «пока не умрёте» естественным русским оборотом, сохраняя коллективную отнесённость формы второго лица множественного числа.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: Владыка Господь Воинств
  rationale: Различает אֲדֹנָי («Владыка») и тетраграмматон («Господь»), сохраняя полный тройной титул.
theological_decisions:
- issue: Значение клятвенной формулы אִם יְכֻפַּר
  choice: 'Категорическое отрицание: «Не будет прощён»'
  alternative: 'Условное: «если будет прощён»'
  rationale: После формулы откровения אִם функционирует как сокращённая клятва и выражает твёрдое отрицание, а не обычное условие.
- issue: Передача כפר применительно к греху
  choice: «прощён»
  alternative: «искуплен» / «очищен»
  rationale: Контекст возвещает неотменимость вины и суда; «прощён» ясно и естественно, хотя корень допускает культово-искупительный оттенок.
- issue: Смысл עַד תְּמֻתוּן
  choice: Приговор остаётся в силе до смерти адресатов
  alternative: После смерти грех будет прощён
  rationale: Текст устанавливает смерть как предел приговора, но не утверждает положительно посмертного прощения; перевод не должен добавлять такое учение.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Инверсия и архаическая формула «открылось в ушах моих» устранены ради ясности; божественные титулы сохранены раздельно и последовательно.
