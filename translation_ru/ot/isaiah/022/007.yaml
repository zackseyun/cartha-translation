lexical_decisions:
- source_word: מִבְחַר עֲמָקַיִךְ
  choice: лучшие из твоих долин
  rationale: מִבְחַר обозначает отборное, лучшее; сочетание передаёт выделение лучших среди долин, принадлежащих олицетворённому городу.
- source_word: מָלְאוּ רָכֶב
  choice: наполнились колесницами
  rationale: Собирательное רֶכֶב в военном контексте естественно передаётся русским множественным числом «колесницы».
- source_word: הַפָּרָשִׁים
  choice: всадники
  rationale: Слово обозначает конных воинов; «всадники» ясно и естественно передаёт образ без излишней терминологичности.
- source_word: שֹׁת שָׁתוּ
  choice: заняли позиции
  rationale: Сочетание инфинитива абсолютного с личной формой глагола подчёркивает намеренное размещение войск; русский оборот сохраняет военный смысл и усиление.
- source_word: הַשָּׁעְרָה
  choice: у ворот
  rationale: Направительный суффикс допускает значение движения «к воротам», но при глаголе размещения контекстуально уместно положение «у ворот».
