base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/001.yaml
  text: 'An oracle concerning the Valley of Vision: What is the matter with you now[a], that all of you have gone up to the rooftops?'
translation:
  language: ru
  text: Пророчество о Долине видения[a]. Что с тобой теперь, что все твои жители поднялись на крыши?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Долина видения», вероятно, является поэтическим названием Иерусалима, хотя в самом стихе это прямо не сказано.
    reason: cross_reference
lexical_decisions:
- source_word: מַשָּׂא
  choice: пророчество
  rationale: В заголовках пророческих речей слово обозначает возвещение свыше. «Пророчество» естественно для современного русского языка и не вносит возможной дополнительной метафоры «бремени».
- source_word: גֵּיא חִזָּיוֹן
  choice: Долина видения
  rationale: Буквально передаёт конструкцию «долина видения» как поэтическое наименование, не подменяя её прямым указанием на Иерусалим.
- source_word: מַה לָּךְ
  choice: Что с тобой
  rationale: Естественно передаёт идиоматический вопрос о том, что произошло с олицетворённым городом.
- source_word: אֵפוֹא
  choice: теперь
  rationale: Передаёт риторическое усиление и оттенок непосредственности в данном вопросе.
- source_word: כִּי
  choice: что
  rationale: 'Вводит содержание или основание риторического вопроса: почему адресат оказался на крышах.'
- source_word: עָלִית
  choice: поднялась
  rationale: Сохраняет значение движения вверх и согласуется с обращением к городу в женском роде.
- source_word: כֻּלָּךְ
  choice: вся ты
  rationale: Сохраняет грамматическое обращение во втором лице женского рода единственного числа и одновременно коллективный смысл, относящийся ко всему населению города.
- source_word: לַגַּגּוֹת
  choice: на крыши
  rationale: Речь идёт о доступных плоских крышах домов; русское «поднялась на крыши» звучит естественно и точно.
theological_decisions:
- issue: К чему относится название «Долина видения»
  choice: Название сохранено буквально без отождествления в основном тексте
  alternative: Прямо назвать Иерусалим или конкретную долину возле него
  rationale: Сам еврейский текст стиха не называет референт прямо. Вероятное отнесение к Иерусалиму вынесено в примечание, чтобы не устранять заложенную в тексте неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род обращения сохранён, поскольку в еврейском тексте город олицетворён; формулировка «вся ты» передаёт и грамматику, и собирательный смысл.
