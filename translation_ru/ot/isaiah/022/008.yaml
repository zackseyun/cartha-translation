  source_fidelity: «Он снял покров Иуды» точно передаёт глагол в хифиле с прямым дополнением, не называя невыраженное подлежащее. «Покров» сохраняет метафору מָסָךְ, а «ты посмотрел на» передаёт 2-е лицо ед. числа и направленность אֶל. «Оружие Дома Леса» соответствует נֶשֶׁק בֵּית הַיָּעַר без добавления «Ливан» в основной текст.
  naturalness: Текст краток, литературен и понятен в современном русском. Мужской род формы «посмотрел» оправдан грамматикой еврейского оригинала и возможной персонификацией Иуды; не следует заменять его формой, которая изменила бы число или лицо.
  terminology: «Иуда», «покров», «оружие» и «Дом Леса» употреблены последовательно. Сноска a уместно сообщает интерпретативный вариант «защиту», а сноска b осторожно поясняет вероятное историческое отождествление, не выдавая его за содержание самого стиха.
