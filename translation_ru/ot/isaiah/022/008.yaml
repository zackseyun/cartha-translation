id: ISA.22.8
reference: Isaiah 22:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יְגַ֕ל אֵ֖ת מָסַ֣ךְ יְהוּדָ֑ה וַ/תַּבֵּט֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֶל נֶ֖שֶׁק בֵּ֥ית הַ/יָּֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/008.yaml
  text: And he removed the covering of Judah[b][a], and on that day you looked to the weapons of the House of the Forest.
translation:
  language: ru
  text: И он снял покров Иуды[a], и в тот день ты посмотрел на оружие Дома Леса[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «защиту Иуды». Буквально в еврейском тексте — «покров Иуды»; это образ того, что укрывало или защищало Иуду.'
    reason: lexical_alternative
  - marker: b
    text: «Дом Леса», вероятно, означает царский дворец или оружейную палату, в других местах называемую «Домом Ливанского леса».
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגַל
  choice: он снял
  rationale: 'Порода hифиль от גלה здесь выражает действие над объектом: «снять, удалить покров». Местоимение сохраняет мужской род подлежащего, но не уточняет его сверх еврейского текста.'
- source_word: מָסַךְ
  choice: покров
  rationale: Слово обозначает покров, завесу или прикрытие. «Покров» сохраняет конкретный образ, тогда как возможный смысл защиты поясняется в сноске.
- source_word: יְהוּדָה
  choice: Иуды
  rationale: Общепринятая русская форма названия в родительном падеже.
- source_word: וַתַּבֵּט ... אֶל
  choice: ты посмотрел на
  rationale: Передаёт направленный взгляд и форму второго лица мужского рода единственного числа, сохраняя пророческое обращение.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественное русское соответствие пророческому временному выражению.
- source_word: נֶשֶׁק
  choice: оружие
  rationale: Ясное современное обозначение совокупности вооружения; «доспехи» было бы неоправданно узким.
- source_word: בֵּית הַיַּעַר
  choice: Дом Леса
  rationale: Сохраняет буквальное наименование из данного стиха, не добавляя отсутствующее здесь слово «Ливан»; вероятное историческое отождествление дано в сноске.
theological_decisions:
- issue: Образ «покрова Иуды»
  choice: Сохранить метафору как «покров Иуды».
  alternative: «защита Иуды» или «оборонительные укрепления Иуды»
  rationale: Еврейский текст оставляет конкретный и многозначный образ покрова; прямая замена на военный термин преждевременно разрешила бы метафору.
- issue: Адресат глагола וַתַּבֵּט
  choice: Передать формой единственного числа «ты посмотрел».
  alternative: Множественное число или безличная конструкция
  rationale: Так сохраняются грамматическая форма 2-го лица мужского рода единственного числа и риторическое обращение к олицетворённому Иерусалиму/Иуде.
- issue: Подлежащее וַיְגַל
  choice: Не называть подлежащее, передав только «он».
  alternative: Уточнить как «Господь» или использовать неопределённо-личную конструкцию
  rationale: В самом стихе подлежащее выражено лишь глагольной формой 3-го лица мужского рода; перевод не должен устранять эту референциальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Конкретная метафора оригинала и обращение во втором лице единственного числа сохранены; историческое уточнение названия вынесено в сноску.
