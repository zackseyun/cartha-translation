base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/023.yaml
  text: And I will drive him like a peg into a secure place[b][a], and he will become a throne of honor to his father's house.
translation:
  language: ru
  text: Я вобью его, словно колышек, в надёжное место[a], и он станет престолом славы[b] для дома своего отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прочно закреплю его, словно колышек, в твёрдом месте».'
