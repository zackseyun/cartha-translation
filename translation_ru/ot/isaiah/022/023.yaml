  - marker: b
    text: 'Или: «славным престолом»; возможно также: «почётным местом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתִּיו
  choice: Я вобью его
  rationale: Глагол תקע в сочетании с образом колышка означает вбивание или прочное закрепление. «Вобью» сохраняет конкретность и силу исходной метафоры.
- source_word: יָתֵד
  choice: колышек
  rationale: Слово обозначает колышек, кол или крепёжный штырь. «Колышек» естественно передаёт предмет, который вбивают и на котором может держаться тяжесть.
- source_word: בְּמָקוֹם נֶאֱמָן
  choice: в надёжное место
  rationale: נֶאֱמָן здесь характеризует место как прочное, устойчивое и безопасное, а не как «верное» в нравственном смысле.
- source_word: וְהָיָה
  choice: он станет
  rationale: Форма היה допускает «будет» и «станет». Здесь речь идёт о результате Божьего действия, поэтому «станет» естественно выражает переход к новому положению.
- source_word: לְכִסֵּא כָבוֹד
  choice: престолом славы
  rationale: 'Перевод сохраняет оба образных компонента: כִּסֵּא — «престол/сиденье», כָבוֹד — «слава/честь». Конструкция остаётся достаточно открытой для значений почёта и славного достоинства.'
- source_word: לְבֵית אָבִיו
  choice: для дома своего отца
  rationale: Предлог לְ выражает отношение или пользу, а «дом отца» означает родовое семейство. «Для» ясно и естественно передаёт эту связь по-русски.
theological_decisions:
- issue: Метафорическое изображение роли Елиакима
  choice: Сохранить конкретные образы колышка и престола, не заменяя их объяснением о политической устойчивости или семейном почёте.
  alternative: 'Передать смысл описательно: он станет надёжным правителем и принесёт честь своему роду.'
  rationale: Исходный текст соединяет две метафоры, не разъясняя полностью их соотношение. Их сохранение передаёт литературное и богословское напряжение пророчества без навязывания узкого толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен для широкого читателя; конкретные метафоры и смысловая многозначность исходного текста сохранены.
