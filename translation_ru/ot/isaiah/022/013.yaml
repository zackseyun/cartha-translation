  naturalness: Текст звучит как современный литературный русский. «Но вот» уместно передаёт контраст с призывом к плачу в предыдущем стихе. «Закалывают мелкий скот» несколько более терминологично, чем «закалывают овец», но естественно в контексте перечисления скота и лучше сохраняет объём еврейского слова. Точка в конце лозунга сохраняет его сжатую констатирующую силу, не добавляя экспрессии, которой в оригинале специально не выражено.
