base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/013.yaml
  text: 'And behold[a], joy and gladness, killing cattle and slaughtering sheep, eating meat and drinking wine: “Let us eat and drink, for tomorrow we die.”'
translation:
  language: ru
  text: 'Но вот — веселье и радость: режут крупный скот и закалывают мелкий скот, едят мясо и пьют вино: «Будем есть и пить, потому что завтра умрём».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Есть и пить»; в еврейском тексте эта краткая форма звучит как лозунг или призыв.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Но вот
  rationale: הִנֵּה привлекает внимание к неожиданной картине, а союз וְ в данном контексте естественно передаёт контраст с призывом к плачу в предыдущем стихе. «Но вот» звучит современно и сохраняет живость выражения.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: веселье и радость
  rationale: Два близких по значению существительных передают шумное праздничное настроение; сочетание сохраняет параллелизм и не добавляет нравственной оценки.
- source_word: הָרֹג בָּקָר
  choice: режут крупный скот
  rationale: בָּקָר обозначает крупный рогатый скот как собирательное понятие. Настоящее время передаёт разворачивающуюся сцену приготовления пира.
- source_word: וְשָׁחֹט צֹאן
  choice: и закалывают овец
  rationale: שׁחט означает закалывать животное; перевод не вводит отсутствующего в тексте указания на ритуальное жертвоприношение. В данном пиршественном контексте צֹאן естественно передано как «овцы».
- source_word: אָכֹל בָּשָׂר וְשָׁתוֹת יָיִן
  choice: едят мясо и пьют вино
  rationale: Конкретные действия переданы естественными русскими глагольными формами, сохраняющими ритмическую последовательность еврейского текста.
- source_word: אָכוֹל וְשָׁתוֹ
  choice: Будем есть и пить
  rationale: Формально это абсолютные инфинитивы, но в контексте они имеют побудительно-лозунговую силу. Форма первого лица множественного числа естественно согласуется с последующим «умрём».
- source_word: כִּי מָחָר נָמוּת
  choice: потому что завтра умрём
  rationale: Сохраняется краткое, фаталистическое обоснование пиршества. Будущее значение формы נָמוּת в русском языке выражено совершенным видом.
theological_decisions:
- issue: Следует ли прямо обозначить пиршество как греховное или порочное
  choice: Описать происходящее без добавочных осуждающих определений
  alternative: Добавить слова вроде «безумное» или «греховное веселье»
  rationale: Сам стих рисует картину веселья и фаталистического наслаждения, тогда как её пророческая оценка раскрывается контекстом. Перевод не должен вносить в текст отсутствующие характеристики.
- issue: Побудительная сила אָכוֹל וְשָׁתוֹ
  choice: 'Передать как коллективный призыв: «Будем есть и пить»'
  alternative: 'Передать буквально и отрывисто: «Есть и пить» либо как приказ: «Ешьте и пейте»'
  rationale: Последующее «завтра умрём» показывает, что говорящие включают себя в призыв. Выбранная форма сохраняет смысл общего лозунга, а формальная особенность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Двоеточия организуют нарастающий перечень действий и вводят прямую речь; формулировки остаются ясными для обычного читателя без архаизации.
