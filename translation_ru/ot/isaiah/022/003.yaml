  rationale: Исправление устраняет неоправданное сужение значения выражения «без/от лука» и слегка выравнивает русскую конструкцию второй части. Смысл стиха, пассивность пленения, коллективность действий и отмеченная в английском аудите неоднозначность заключительной фразы сохранены.
