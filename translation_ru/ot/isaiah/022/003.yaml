  yaml_path: translation/ot/isaiah/022/003.yaml
  text: All your rulers have fled together[a]; they were captured without the bow. All of your fugitives who were found were captured together[b]; they had fled far away.
translation:
  language: ru
  text: Все твои правители бежали вместе; их взяли в плен без лука.[a] Все те из твоих, кого нашли, были вместе взяты в плен; они бежали далеко.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «были связаны без/от лука». Возможно, их пленили без стрельбы из лука или тогда, когда у них не было лука в руках.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «Все те из твоих, кого нашли, были связаны вместе; они бежали издалека». Сжатый синтаксис заключительной части допускает разные способы понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִינַיִךְ
  choice: твои правители
  rationale: קָצִין может обозначать правителя, должностное лицо или военачальника; «правители» достаточно широко передаёт гражданско-военное руководство Иерусалима.
- source_word: נָדְדוּ
  choice: бежали
  rationale: В обстановке осады и пленения נדד означает не просто удаление или скитание, а бегство.
- source_word: יַחַד / יַחְדָּו
  choice: вместе
  rationale: Обе близкие наречные формы подчёркивают совместность действия и естественно передаются словом «вместе».
- source_word: מִקֶּשֶׁת
  choice: без применения лука
  rationale: 'Предлог מִן, вероятно, имеет здесь лишительное значение: пленение произошло без стрельбы из лука или без вооружённого сопротивления с луком. Формулировка сохраняет связь с конкретным оружием и остаётся понятной по-русски.'
- source_word: אֻסָּרוּ / אֻסְּרוּ
  choice: были взяты в плен
  rationale: אָסַר буквально значит «связать», но в военном контексте пассивная форма обозначает связывание и удержание пленников; «взять в плен» ясно передаёт смысл.
- source_word: נִמְצָאַיִךְ
  choice: все твои, кого нашли
  rationale: Форма буквально означает «твои найденные / те из твоих, кого нашли». Нейтральная передача не добавляет к тексту определения «беглецы» или «мужчины».
- source_word: מֵרָחוֹק בָּרָחוּ
  choice: они бежали далеко
  rationale: Сжатая конструкция связывает дальность с бегством, однако допускает понимание «бежали издалека»; основная формулировка следует наиболее вероятному контекстуальному смыслу, а неоднозначность отмечена в сноске.
