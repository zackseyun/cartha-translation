base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/015.yaml
  text: 'Thus says the Lord Yahweh of hosts: Go[a], come to this steward, to Shebna[b], who is over the house:'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве Воинств: «Ступай, войди[a] к этому управляющему, Шевне, который поставлен над домом[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст содержит два повеления: «ступай, войди»; вместе они могут иметь идиоматический смысл «пойди к этому сановнику» или «войди к нему».'
    reason: lexical_alternative
  - marker: b
    text: «Поставлен над домом» — должностное обозначение главного управляющего царским дворцом.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה
  choice: Так
  rationale: 'Сохраняет краткую и торжественную формулу введения пророческой речи: «Так говорит…».'
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» прямо представляет личное имя יהוה и позволяет избежать неестественного сочетания «Господь Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Традиционное и ёмкое обозначение множества сил, подвластных Богу; оно не сужает значение исключительно до земных армий.
- source_word: לֶךְ בֹּא
  choice: Ступай, войди
  rationale: Сохранены оба повелительных глагола еврейского текста. «Ступай» придаёт первому естественную направительную силу, а «войди» передаёт второй глагол без их молчаливого слияния.
- source_word: הַסֹּכֵן
  choice: управляющему
  rationale: Слово обозначает сановника, которому вверено административное управление; современное «управляющий» естественно сочетается с последующим титулом.
- source_word: הַזֶּה
  choice: этому
  rationale: Передаёт указательное значение оригинала и возможный пренебрежительный оттенок контекста.
- source_word: עַל שֶׁבְנָא
  choice: к Шевне
  rationale: Шевна поясняет, кто именно назван «этим управляющим». В русском приложению естественно придать форму направления после «войди к».
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: который поставлен над домом
  rationale: Сохраняет образное выражение оригинала и одновременно показывает, что речь идёт о должности, а не просто о физическом нахождении над зданием.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, не заменяя имя общим обозначением «Бог».
- issue: Значение צְבָאוֹת в божественном титуле
  choice: Воинств
  alternative: небесных сил / армий
  rationale: «Воинств» сохраняет широту и традиционную торжественность титула, не ограничивая его только ангельскими либо земными войсками.
translation_notes:
  register: Современный литературный русский с торжественным пророческим зачином. Сохранены резкость двух повелений и образное должностное выражение «над домом»; пояснение вынесено в сноску. Двоеточие оставлено, поскольку речь продолжается в следующем стихе.
