  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Тройной повтор слова «город» сохраняет поэтический параллелизм, а повтор «убитые — ... убитые» передаёт заметную игру однокоренных слов в еврейском тексте.
