base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/002.yaml
  text: O city full of shouting[a], tumultuous city, exultant town—your slain are not slain by the sword, nor dead in battle.
translation:
  language: ru
  text: О город, полный криков[a], город шумный, город ликующий! Твои погибшие не от меча погибли и не пали в сражении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полный гомона… гудящий город… радостный город». В еврейском тексте нагромождены близкие по смыслу слова, рисующие город, охваченный громким праздничным возбуждением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשֻׁאוֹת
  choice: криков
  rationale: Существительное обозначает громкий шум, крики или гомон. «Криков» естественно сочетается с образом шумного, ликующего города; более широкое значение отмечено в сноске.
- source_word: מְלֵאָה
  choice: полный
  rationale: Передаёт предикативное значение «наполненный, полный» и сохраняет образ города, наполненного шумом.
- source_word: עִיר
  choice: город
  rationale: Обычное значение слова; форма обращения естественно передана как «О город».
- source_word: הוֹמִיָּה
  choice: шумный
  rationale: Слово описывает гудящий, бурлящий шумом город. «Шумный» звучит естественно по-русски и сохраняет смысл общественного гомона.
- source_word: קִרְיָה
  choice: город
  rationale: Это поэтический синоним עִיר. Повтор «город» сохраняет параллелизм еврейского текста без искусственного различения между городом и меньшим поселением.
- source_word: עַלִּיזָה
  choice: ликующий
  rationale: Передаёт бурную радость и праздничное возбуждение, сохраняя возвышенный пророческий тон.
- source_word: חֲלָלַיִךְ
  choice: твои убитые
  rationale: В данном контексте речь идёт о погибших, а не просто о раненых. Выбор также позволяет частично сохранить повтор корня со следующим חַלְלֵי.
- source_word: חַלְלֵי חֶרֶב
  choice: мечом убитые
  rationale: Близко передаёт устойчивое обозначение погибших от меча и сохраняет намеренный повтор «убитые — ... убитые».
- source_word: מֵתֵי מִלְחָמָה
  choice: павшие в сражении
  rationale: Естественное русское обозначение погибших в бою; «сражение» конкретно передаёт военный контекст.
