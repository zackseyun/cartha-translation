  text: וְ/תָל֨וּ עָלָ֜י/ו כֹּ֣ל כְּב֣וֹד בֵּית אָבִ֗י/ו הַ/צֶּֽאֱצָאִים֙ וְ/הַ/צְּפִע֔וֹת כֹּ֖ל כְּלֵ֣י הַ/קָּטָ֑ן מִ/כְּלֵי֙ הָֽ/אַגָּנ֔וֹת וְ/עַ֖ד כָּל כְּלֵ֥י הַ/נְּבָלִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/024.yaml
  text: 'And they will hang on him all the honor of his father’s house: the offspring and the offshoots, every small vessel, from the bowls to all the jars.'
translation:
  language: ru
  text: И повесят на него всю славу дома его отца — потомков и отпрысков, все малые сосуды, от чаш до всяких кувшинов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּבוֹד
  choice: славу
  rationale: Основное значение — «слава, честь, вес, значимость». В образном контексте на человеке оказывается всё достоинство и значение отцовского дома; «слава» сохраняет широту еврейского слова.
- source_word: הַצֶּאֱצָאִים וְהַצְּפִעוֹת
  choice: потомков и отпрысков
  rationale: Парное выражение обозначает членов рода или его ответвления. «Отпрыски» естественно передаёт растительную метафору второго редкого существительного, не устраняя возможную синонимичность пары.
- source_word: כְּלֵי הַקָּטָן
  choice: все малые сосуды
  rationale: Буквально — «все сосуды малого [вида/размера]». Сохранён образ утвари, символизирующей зависимых членов дома.
- source_word: אַגָּנוֹת
  choice: чаш
  rationale: Слово обозначает чаши или тазы; «чаши» уместны в перечислении сосудов и понятны современному читателю.
- source_word: נְּבָלִים
  choice: кувшинов
  rationale: Здесь это сосуды, вероятно крупные бутыли или кувшины, а не музыкальные инструменты. «Кувшины» естественно завершает диапазон домашней утвари.
theological_decisions:
- issue: Образ возложенной на Елиакима славы отцовского дома
  choice: Сохранить метафору «повесят на нём» без богословского истолкования
  alternative: 'Передать объяснительно: «возложат на него ответственность за весь род»'
  rationale: Еврейский текст продолжает образ надёжного колышка из предыдущего стиха; буквальная метафора сохраняет связь и напряжение образа.
- issue: Значение כְּבוֹד
  choice: «слава»
  alternative: «честь» или «почёт»
  rationale: «Слава» охватывает не только общественный почёт, но также вес и значимость всего дома, которые образно подвешиваются на Елиакиме.
translation_notes:
  register: Современный литературный русский язык с сохранением образности оригинала. Синтаксис торжественный, но понятный; редкая родовая пара передана как «потомков и отпрысков».
