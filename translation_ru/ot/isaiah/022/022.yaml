  text: וְ/נָתַתִּ֛י מַפְתֵּ֥חַ בֵּית דָּוִ֖ד עַל שִׁכְמ֑/וֹ וּ/פָתַח֙ וְ/אֵ֣ין סֹגֵ֔ר וְ/סָגַ֖ר וְ/אֵ֥ין פֹּתֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/022.yaml
  text: And I will place the key of the house of David on his shoulder; he will open[a], and no one will shut; he will shut, and no one will open.
translation:
  language: ru
  text: 'И возложу ключ от дома Давида ему на плечо: он откроет[a] — и никто не запрёт; он запрёт — и никто не откроет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот образ непререкаемой власти открывать и запирать находит отзвук в Откровении 3:7.
    reason: cross_reference
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И возложу
  rationale: נתן может означать «дать, положить, поместить». При сочетании «на плечо» глагол «возложу» естественно передаёт конкретное действие и сохраняет образ вручения знака власти.
- source_word: מַפְתֵּחַ
  choice: ключ
  rationale: מַפְתֵּחַ означает «ключ»; определённость задаётся уточняющим оборотом «от дома Давида» и контекстом конкретного символа полномочий.
- source_word: בֵּית דָּוִד
  choice: дома Давида
  rationale: Близкая к форме оригинала передача сохраняет возможные значения царского рода, двора и связанного с ним управления, не добавляя толкования в основной текст.
- source_word: עַל שִׁכְמוֹ
  choice: ему на плечо
  rationale: Это прямое значение еврейского оборота. Возможный образ знака должности или бремени власти не разворачивается внутри перевода.
- source_word: וּפָתַח
  choice: он откроет
  rationale: Форма продолжает последовательность будущего результата после Божьего обещания и ясно выражает действенность полученной власти.
- source_word: וְאֵין סֹגֵר
  choice: и никто не запрёт
  rationale: Конструкция указывает на отсутствие того, кто мог бы отменить совершённое им действие. «Никто не запрёт» передаёт это естественно и сохраняет параллелизм.
- source_word: וְסָגַר
  choice: он запрёт
  rationale: Глагол סגר здесь означает закрыть или запереть. «Запрёт» образует в русском точную риторическую пару с «откроет» и соответствует образу ключа.
- source_word: וְאֵין פֹּתֵחַ
  choice: и никто не откроет
  rationale: Формулировка зеркально соответствует предыдущей строке и выражает невозможность отменить его решение.
theological_decisions:
- issue: Следует ли явно обозначить в основном тексте мессианское или новозаветное применение образа
  choice: Сохранить непосредственный историко-литературный смысл стиха без добавления явного мессианского толкования.
  alternative: Сформулировать перевод так, чтобы сильнее подчеркнуть его последующее использование в Откровении 3:7, либо расширить «дом Давида» до «царского дома Давида».
  rationale: В контексте Исайи речь идёт о делегированной власти, связанной с домом Давида. Канонический отзвук важен, но его следует отметить в сноске, а не вносить позднейшее применение в перевод основного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Тире подчёркивают уравновешенный параллелизм еврейской фразы. «Запрёт» выбрано вместо более общего «закроет», поскольку в контексте ключа оно конкретнее и естественно противопоставлено «откроет».
