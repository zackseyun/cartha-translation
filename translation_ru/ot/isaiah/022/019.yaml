  yaml_path: translation/ot/isaiah/022/019.yaml
  text: And I will thrust you from your office[a], and he will pull you down from your station.
translation:
  language: ru
  text: Я столкну тебя с твоего поста, и он[a] свергнет тебя с твоего положения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте происходит смена лица: «Я столкну тебя» — затем «он свергнет тебя». В некоторых переводах вторую часть сглаживают, согласуя с первой: «Я свергну тебя».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲדַפְתִּיךָ
  choice: Я вытолкну тебя
  rationale: Глагол הדף обозначает сильный толчок, вытеснение или изгнание. «Вытолкну» сохраняет образ насильственного удаления и естественно звучит в контексте лишения должности; форма передана будущим временем как пророческое объявление.
- source_word: מִמַּצָּבֶךָ
  choice: с твоего поста
  rationale: מַצָּב может обозначать место, положение или служебный пост. В контексте устранения Севны от власти «пост» ясно передаёт официальный характер его положения.
- source_word: וּמִמַּעֲמָדְךָ
  choice: с твоего места
  rationale: מַעֲמָד означает место стояния, положение или место служения. «Место» сохраняет параллелизм с «постом», не делая обе части полностью одинаковыми.
- source_word: יֶהֶרְסֶךָ
  choice: он низвергнет тебя
  rationale: הרס буквально означает разрушать, сносить; применительно к человеку здесь выражает свержение и утрату положения. «Низвергнет» сохраняет образ решительного падения и соответствует форме третьего лица.
theological_decisions:
- issue: Смена лица субъекта во второй части стиха
  choice: Сохранена смена с первого лица («Я вытолкну») на третье лицо мужского рода («он низвергнет»).
  alternative: 'Согласовать обе части в первом лице: «Я вытолкну тебя… и низвергну тебя»; либо использовать безличную конструкцию: «тебя низвергнут».'
  rationale: Масоретский текст явно меняет лицо глагола. Перевод сохраняет эту напряжённость и не определяет без достаточных оснований, относится ли «он» к Богу при смене лица или к неуказанному исполнителю Божьего решения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной лексикой. Параллелизм исходного текста сохранён посредством сочетания «пост» и «место»; необычная смена субъекта не сглажена.
