  naturalness: «Я столкну тебя с твоего поста» и «он свергнет тебя с твоего положения» естественны для современного литературного русского и сохраняют возвышенно-пророческий регистр без излишней архаизации.
  terminology: «Пост» уместно передаёт מַצָּב в контексте отстранения Севны. «Положение» точнее, чем «место», для מַעֲמָד и поддерживает смысловой параллелизм, не делая оба члена идентичными. «Свергнет» удачно выражает метафорическое низложение, заложенное в הרס.
