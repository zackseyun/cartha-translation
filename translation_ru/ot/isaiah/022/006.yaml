- source_word: עֵילָם
  choice: Элам
  rationale: Название народа и страны передано традиционной русской транслитерацией.
- source_word: נָשָׂא
  choice: нёс
  rationale: Сохраняет основное значение глагола — нести воинское снаряжение — и образ военного выступления.
- source_word: אַשְׁפָּה
  choice: колчан
  rationale: Слово обозначает футляр для стрел, то есть колчан.
- source_word: בְּרֶכֶב אָדָם פָּרָשִׁים
  choice: с колесницами и всадниками
  rationale: Кратко и естественно передаёт сжатое перечисление военных сил, не выдавая неясную синтаксическую связь слов за однозначную; другие возможные разборы приведены в примечании.
- source_word: קִיר
  choice: Кир
  rationale: Название народа или местности передано транслитерацией.
- source_word: עֵרָה
  choice: обнажил
  rationale: Передаёт буквальный образ снятия покрытия со щита; в контексте, вероятно, подразумевается приготовление к бою.
- source_word: מָגֵן
  choice: щит
  rationale: Сохранено единственное число еврейского текста, которое может иметь собирательное или типовое значение.
