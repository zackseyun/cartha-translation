  text: In that day the Lord GOD of hosts called for weeping[a], for mourning, for baldness, and for putting on sackcloth.
translation:
  language: ru
  text: В тот день Владыка Яхве, Бог Воинств, призвал к плачу, к скорби, к облысению и к тому, чтобы опоясаться вретищем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к выбриванию головы»; еврейское слово обозначает облысение или выбривание как знак траура.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: призвал
  rationale: Глагол קרא в данном контексте выражает требование или настоятельный призыв к названным далее действиям скорби.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: Владыка Яхве Воинств
  rationale: «Владыка» естественно передаёт אֲדֹנָי и не смешивается с личным именем Яхве; «Воинств» сохраняет ёмкость традиционного титула צְבָאוֹת, не ограничивая его только земными войсками.
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественная русская форма распространённой пророческой временной формулы.
- source_word: לִבְכִי וּלְמִסְפֵּד
  choice: плакать и скорбеть
  rationale: Глагольная конструкция по-русски естественно передаёт призыв к плачу и траурному оплакиванию, сохраняя различие между двумя близкими выражениями горя.
- source_word: וּלְקָרְחָה
  choice: обрить головы
  rationale: Существительное буквально обозначает плешь или облысение, но здесь называет намеренное обривание головы как знак траура; действие выражено явно ради понятности современному читателю.
- source_word: וְלַחֲגֹר שָׂק
  choice: препоясаться вретищем
  rationale: Сохраняется конкретный образ подпоясывания грубой траурной тканью; «вретище» — узнаваемый библейский термин, уместный в литературном регистре.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Передача имени как «Яхве» сохраняет личное имя в исходном тексте, а «Владыка» отличает предшествующий титул אֲדֹנָי и избегает сочетания «Господь Господь».
- issue: Смысл צְבָאוֹת в божественном титуле
  choice: Воинств
  alternative: небесных воинств / войск
  rationale: Исходное слово допускает широкий охват и не уточняет здесь, идёт ли речь исключительно о небесных или земных силах; краткая форма сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Параллелизм четырёх траурных действий сохранён; архаизирующая форма «препоясаться вретищем» оставлена как понятный устойчивый библейский образ.
