base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/011.yaml
  text: You made a reservoir between the two walls for the waters of the old pool[a], but you did not look to the one who made it, nor did you see the one who formed it long ago.
translation:
  language: ru
  text: Вы устроили водоём между двумя стенами для воды старого пруда, но не обратили взора на Того, кто создал её, и не увидели Того, кто издавна[a] образовал её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «издалека». Еврейское выражение может указывать на пространственную удалённость, но здесь, вероятно, означает «издавна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוָה
  choice: водоём
  rationale: В контексте городских водных сооружений слово обозначает место, где собирают воду; «водоём» естественно передаёт сооружённое хранилище и не смешивается с последующим «прудом».
- source_word: בֵּין הַחֹמֹתַיִם
  choice: между двумя стенами
  rationale: Двойственное число прямо указывает на две стены; эта особенность сохранена.
- source_word: לְמֵי הַבְּרֵכָה הַיְשָׁנָה
  choice: для воды из старого пруда
  rationale: В данном описании предлог может естественно обозначать назначение водоёма для воды старого пруда; «из» ясно выражает связь источника и нового водохранилища, не отождествляя два сооружения.
- source_word: הִבַּטְתֶּם אֶל
  choice: не обратили взора к
  rationale: Оборот передаёт не просто физический взгляд, а направленное внимание и упование; при этом сохраняется зрительный образ оригинала.
- source_word: עֹשֶׂיהָ
  choice: к Тому, кто создал его
  rationale: Причастная конструкция передана без уточнения неоднозначного объекта местоименного суффикса; прописная буква уместно обозначает Бога в русском религиозном тексте.
- source_word: יֹצְרָהּ
  choice: Того, кто устроил его
  rationale: Глагол יצר выражает намеренное формирование или устройство. «Устроил» подходит к городу либо системе укреплений и не вынуждает понимать объект только как материально вылепленный предмет.
- source_word: מֵרָחוֹק
  choice: издавна
  rationale: В контексте Божьего замысла выражение вероятнее имеет временное значение — «с давних времён», однако пространственная возможность отмечена в сноске.
- source_word: לֹא רְאִיתֶם
  choice: не увидели
  rationale: Буквальное «увидели» сохраняет параллелизм с обращением взора и допускает более глубокий смысл — не распознали Божьего действия.
theological_decisions:
- issue: К чему относится суффикс женского рода в עֹשֶׂיהָ и יֹצְרָהּ
  choice: Сохранено местоимение «его» без прямого называния объекта; действующим лицом является Бог.
  alternative: Уточнить объект как пруд, водоём, систему водоснабжения или Иерусалим.
  rationale: Контекст обличает жителей за упование на оборонительные меры вместо Бога, но грамматика не позволяет с уверенностью сузить объект до одного конкретного элемента. Перевод сохраняет эту компактную неоднозначность.
- issue: Временное или пространственное значение מֵרָחוֹק
  choice: «издавна» — указание на давний Божий замысел или действие.
  alternative: «издалека» — пространственная удалённость.
  rationale: Временное прочтение лучше согласуется с пророческой речью о заранее устроенном Богом, но подлинная лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм оригинала сохранён; архаизмы сведены к умеренному «обратили взора», которое поддерживает образ зрения и остаётся понятным.
