base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/005.yaml
  text: For it is a day of tumult and trampling and confusion from the Lord GOD of Armies in the Valley of Vision[c][b][a], a battering down of the wall and a cry to the mountain.
translation:
  language: ru
  text: Ибо это день смятения, попрания и замешательства от Господа Яхве Воинств[a] в Долине Видения — разрушение стены[b] и крик, обращённый к горе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «день Господа Яхве Воинств» или «день для Господа Яхве Воинств»; еврейский предлог может указывать не только на источник, но и на отношение или принадлежность.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская форма трудна; возможно также: «сокрушение стены» или «разбивание стены».'
    reason: textual_or_lexical_difficulty
  - marker: c
    text: 'Буквально: «и крик к горе»; возможно также: «и крики в сторону горы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предшествующего плача и сохраняет торжественный пророческий регистр.
- source_word: מְהוּמָה
  choice: смятение
  rationale: Передаёт шумный общественный переполох и вместе с тем состояние тревоги, не сводя смысл только к внутренней панике.
- source_word: מְבוּסָה
  choice: попрание
  rationale: Сохраняет образ топтания и подавления, заложенный в еврейском корне, и соответствует ряду существительных бедствия.
- source_word: מְבוּכָה
  choice: замешательство
  rationale: Передаёт растерянность и потерю порядка, не уточняя сверх текста её причину.
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: от Владыки Яхве Воинств
  rationale: «От» естественно передаёт возможное значение источника или виновника суда; неоднозначность предлога ל отмечена в сноске. אֲדֹנָי передано как «Владыка», личное имя יְהוִה — как «Яхве», а צְבָאוֹת — смысловым «Воинств».
- source_word: בְּגֵיא חִזָּיוֹן
  choice: в Долине видения
  rationale: Буквально сохраняет образное обозначение места и оформляет его как название.
- source_word: מְקַרְקַר קִיר
  choice: разрушение стены
  rationale: Трудную глагольную форму передаёт как действие разрушения укрепления; именная конструкция по-русски продолжает ряд бедствий.
- source_word: וְשׁוֹעַ אֶל הָהָר
  choice: и крик к горе
  rationale: Сохраняет краткий и несколько загадочный направительный образ еврейского текста, не определяя говорящего и назначение крика.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה צְבָאוֹת
  choice: Владыка Яхве Воинств
  alternative: Господь Бог Воинств
  rationale: Так различаются титул אֲדֹנָי и личное имя יְהוִה, а צְבָאוֹת переводится, а не транслитерируется. Формулировка не ограничивает «воинства» только земными либо только небесными силами.
- issue: Отношение дня суда к Богу, выраженное предлогом ל
  choice: день … от Владыки Яхве Воинств
  alternative: день Владыки Яхве Воинств / день для Владыки Яхве Воинств
  rationale: Контекст позволяет понимать Бога как источник или действующего Судью, однако еврейский предлог допускает также отношение или принадлежность; эта напряжённость сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Тройной ряд «смятения, попрания и замешательства» сохраняет ритм и накопление бедствий; заключительная фраза оставлена лаконичной и образно неоднозначной.
