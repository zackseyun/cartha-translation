  source_fidelity: 'Смысл и ключевые образы переданы точно: резкий двойной вопрос, высеченная гробница, возвышенное место и жилище в скале сохранены. Необычная смена лица в еврейских причастных оборотах обоснованно отражена через «его гробницу» при сохранении возвратного «для себя».'
  naturalness: Основная конструкция допустима для пророческого, риторически напряжённого регистра. Однако «на высоте» в современном русском преимущественно вызывает значение уровня или качества, а не конкретного возвышенного места; «на возвышенности» точнее и естественнее в данном контексте.
  terminology: «Гробница», «высек», «вырубающий» и «жилище» удачно передают каменную гробницу и иронически-буквальное מִשְׁכָּן. Имя или специальный богословский термин в стихе отсутствуют.
