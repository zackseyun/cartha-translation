base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/016.yaml
  text: What do you have here[a], and whom do you have here, that you have cut out a tomb for yourself here, cutting out his tomb on the height, carving a dwelling for himself in the rock?
translation:
  language: ru
  text: Что у тебя здесь и кто у тебя здесь, что ты высек себе здесь гробницу — высекающий на возвышенности его гробницу, вырубающий для себя жилище в скале?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более плавно, согласуя местоимения с прямым обращением: «высекая на возвышенности свою гробницу, вырубая себе жилище в скале». В еврейском тексте здесь происходит переход от второго лица к третьему.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לְּךָ פֹה
  choice: Что у тебя здесь
  rationale: Сохраняет краткий, резкий вопрос о притязании или основании находиться здесь, не усиливая его до истолковывающего «какое у тебя право».
- source_word: וּמִי לְךָ פֹה
  choice: и кто у тебя здесь
  rationale: Передаёт параллельный вопрос о личных или родственных связях адресата и сохраняет структуру еврейского текста.
- source_word: כִּי
  choice: что
  rationale: Естественно вводит после риторических вопросов основание упрёка, не уточняя сверх текста причинную или результативную связь.
- source_word: חָצַבְתָּ לְּךָ פֹּה קָבֶר
  choice: ты высек себе здесь гробницу
  rationale: «Высек» точно передаёт обработку камня, а «гробница» лучше русского «могила» соответствует сооружению, вырубленному в скале.
- source_word: חֹצְבִי מָרוֹם קִבְרוֹ
  choice: высекающий на высоте его гробницу
  rationale: Причастная конструкция сохраняет повтор глагольного корня, возвышенное место погребения и необычный переход к третьему лицу.
- source_word: חֹקְקִי בַסֶּלַע מִשְׁכָּן לוֹ
  choice: вырубающий для себя жилище в скале
  rationale: «Вырубающий» естественно описывает создание помещения в камне; «жилище» сохраняет буквальный образ и погребальную иронию מִשְׁכָּן.
theological_decisions:
- issue: Переход от второго лица к третьему в причастных оборотах
  choice: 'Сохранить переход: «его гробницу», затем «для себя»'
  alternative: 'Согласовать всё со вторым лицом: «твою гробницу… для себя»'
  rationale: Масоретский текст действительно меняет лицо местоименных суффиксов. Сохранение этой шероховатости уважает исходный текст и не устраняет возможную риторическую дистанцию; более плавный вариант дан в примечании.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной лексикой. Намеренная синтаксическая резкость и смена лица сохранены как особенности еврейского текста; тире отделяет поясняющие причастные обороты.
