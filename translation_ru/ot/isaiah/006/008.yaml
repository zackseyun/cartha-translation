  text: וָ/אֶשְׁמַ֞ע אֶת ק֤וֹל אֲדֹנָ/י֙ אֹמֵ֔ר אֶת מִ֥י אֶשְׁלַ֖ח וּ/מִ֣י יֵֽלֶךְ לָ֑/נוּ וָ/אֹמַ֖ר הִנְ/נִ֥י שְׁלָחֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/008.yaml
  text: Then I heard the voice of the Lord saying[a], “Whom shall I send, and who will go for us?” And I said, “Here am I[b]. Send me.”
translation:
  language: ru
  text: 'Тогда я услышал голос Господа, Который говорил: «Кого Мне послать и кто пойдёт для Нас[a]?» И я сказал: «Вот я[b]. Пошли меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст употребляет множественное число: «для нас». Оно может быть связано с образом небесного совета; некоторые христианские читатели также видят здесь канонический отзвук позднейшего откровения о Троице. Сам текст не уточняет, к кому относится это «нас».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Я здесь». Еврейское выражение означает готовность откликнуться и действовать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: И услышал я
  rationale: Форма wayyiqtol продолжает повествование; такой порядок слов естественно и торжественно передаёт последовательность событий в русском пророческом повествовании.
- source_word: קוֹל
  choice: голос
  rationale: При последующем אֹמֵר речь идёт именно о звучащей речи, поэтому «голос» точнее, чем «звук».
- source_word: אֲדֹנָי
  choice: Владыки
  rationale: Божественный титул אֲדֹנָי означает Господина или Владыку. «Владыка» сохраняет значение титула и отличает его от передачи тетраграмматона יהוה как «Господь».
- source_word: אֹמֵר
  choice: говорившего
  rationale: Причастие согласуется с «голосом» и вводит содержание услышанной речи; русское «говорившего» сохраняет эту синтаксическую связь.
- source_word: מִי אֶשְׁלַח
  choice: Кого Мне послать
  rationale: Вопросительное מִי является объектом глагола «послать»; дательный «Мне» естественно передаёт личную вовлечённость говорящего, выраженную формой первого лица.
- source_word: וּמִי יֵלֶךְ לָנוּ
  choice: и кто пойдёт для Нас
  rationale: Сохранено первое лицо множественного числа לָנוּ без определения его референта. «Для Нас» непосредственно передаёт значение предлога и не добавляет подразумеваемого поручения.
- source_word: הִנְנִי
  choice: Вот я
  rationale: Краткая русская формула самопредъявления передаёт готовность и доступность, выраженные еврейской идиомой.
- source_word: שְׁלָחֵנִי
  choice: Пошли меня
  rationale: Императив с суффиксом первого лица передан прямым предложением себя в качестве посланника.
theological_decisions:
- issue: Первое лицо множественного числа в Божьей речи — לָנוּ
  choice: Сохранить «для Нас» в основном тексте, не определяя референта.
  alternative: Истолковать как обращение к небесному совету, множественное величия или совещания либо как канонический отзвук позднейшего откровения о Троице.
  rationale: Еврейский текст явно употребляет форму множественного числа, но сам стих не объясняет её. Перевод сохраняет эту богословскую напряжённость и не заменяет форму единственным числом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Формы «Мне» и «Нас» написаны с прописной буквы как местоимения, относящиеся к Богу; при этом множественное число намеренно не истолковано. Все сноски отмечены в основном тексте.
