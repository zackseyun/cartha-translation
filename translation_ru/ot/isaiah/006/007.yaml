  text: וַ/יַּגַּ֣ע עַל פִּ֔/י וַ/יֹּ֕אמֶר הִנֵּ֛ה נָגַ֥ע זֶ֖ה עַל שְׂפָתֶ֑י/ךָ וְ/סָ֣ר עֲוֺנֶ֔/ךָ וְ/חַטָּאתְ/ךָ֖ תְּכֻפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/007.yaml
  text: And he touched my mouth and said, “Look, this has touched your lips; your guilt is removed, and your sin is atoned for.”
translation:
  language: ru
  text: 'Он коснулся моих уст и сказал: «Вот, это коснулось твоих губ — и удалена твоя вина, и грех твой искуплён».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грех твой очищен».'
    reason: Еврейский глагол כפר в этом контексте допускает передачу как искупления, так и очищения; примечание сохраняет культовую смысловую широту.
lexical_decisions:
- source_word: וַיַּגַּע עַל־פִּי
  choice: Он коснулся моих уст
  rationale: Глагол נגע с עַל передаёт прикосновение к чему-либо; «уста» сохраняет достоинство пророческой речи и естественно соотносится с последующим «губ».
- source_word: הִנֵּה
  choice: Вот
  rationale: Краткий указательный возглас привлекает внимание к совершившемуся действию; «вот» естественно для современного литературного русского и сохраняет торжественный регистр.
- source_word: וְסָר עֲוֹנֶךָ
  choice: и удалена твоя вина
  rationale: עָוֹן может обозначать беззаконие, вину и её последствия. В контексте очищения «вина» точно передаёт то, что устраняется, не снимая смысловой напряжённости слова.
- source_word: וְחַטָּאתְךָ תְּכֻפָּר
  choice: и грех твой искуплён
  rationale: Пуаль כפר выражает совершённое очищение/искупление греха. «Искуплён» сохраняет культово-богословскую насыщенность выражения и пассивную форму оригинала.
theological_decisions:
- issue: Соотношение удаления вины и искупления греха
  choice: 'Сохранены две параллельные формулировки: «удалена твоя вина» и «грех твой искуплён».'
  alternative: Объединить их в общее утверждение об очищении или прощении.
  rationale: Еврейский текст различает עָוֹן и חַטָּאת и использует для них разные предикаты; перевод не должен сводить эту пару к одной богословской категории.
- issue: Завершённость искупления
  choice: «искуплён»
  alternative: «будет искуплён» или «прощён»
  rationale: Форма תְּכֻפָּר в данном пророческом объявлении естественно понимается как провозглашение уже совершившегося результата прикосновения угля; при этом пассив не уточняет действующего лица.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Уста» и инверсия «грех твой» поддерживают достоинство пророческого регистра, не делая фразу архаичной.
