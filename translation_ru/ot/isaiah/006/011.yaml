base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/011.yaml
  text: Then I said[a], “Until when, Lord?” And he said, “Until cities lie waste, without inhabitant, and houses without man, and the land is laid waste[b], a desolation.”
translation:
  language: ru
  text: 'Тогда я сказал[a]: «До каких пор, Господи?» Он ответил: «Пока города не опустеют, так что в них не останется жителей, дома — людей, и земля не станет пустыней».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как долго, Господи?»'
    reason: лексическая альтернатива для עַד מָתַי
lexical_decisions:
- source_word: וָאֹמַר
  choice: Тогда я сказал
  rationale: Последовательная форма с вау продвигает повествование; «тогда» естественно передаёт переход к ответу Исаии.
- source_word: עַד מָתַי
  choice: До каких пор
  rationale: Сохраняет буквальный временной предел и связь с повторным עַד в ответе; по-русски звучит естественно и возвышенно.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Форма звательного падежа естественно передаёт прямое обращение к Богу посредством титула אֲדֹנָי.
- source_word: עַד אֲשֶׁר אִם
  choice: Пока не
  rationale: В данном сочетании вводит предел продолжительности суда; русская конструкция «пока не» естественно передаёт этот смысл без условного оттенка.
- source_word: שָׁאוּ עָרִים מֵאֵין יוֹשֵׁב
  choice: города не опустеют и не останется в них жителей
  rationale: Передаёт запустение городов и отсутствие обитателей ясным современным русским языком.
- source_word: וּבָתִּים מֵאֵין אָדָם
  choice: дома не останутся без людей
  rationale: אָדָם обозначает здесь людей вообще, а не мужчину как представителя пола; «без людей» точно и недвусмысленно передаёт смысл.
- source_word: וְהָאֲדָמָה תִּשָּׁאֶה שְׁמָמָה
  choice: земля не будет разорена, став пустыней
  rationale: «Земля» передаёт страну/территорию, а сочетание глагола и существительного сохраняет усиленное описание полного запустения.
theological_decisions:
- issue: Значение אָדָם в выражении מֵאֵין אָדָם
  choice: без людей
  alternative: без человека
  rationale: Контекст говорит об отсутствии человеческого населения вообще. Множественное «людей» естественно по-русски и не вносит мужского ограничения, отсутствующего в еврейском.
- issue: Характер предела, выраженного עַד אֲשֶׁר אִם
  choice: пока не
  alternative: до тех пор, пока
  rationale: Высказывание обозначает продолжительность поручения до наступления опустошения. Выбор не уточняет, что произойдёт после этого предела, и тем самым сохраняет богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм сохранён через повтор «пока»; излишне буквальные и неестественные обороты устранены.
