revisions:
- from: 'Тогда я сказал[a]: «До каких пор, Господи?» Он ответил: «Пока города не опустеют и не останется в них жителей, пока дома не останутся без людей и земля не будет разорена, став пустыней».'
  to: 'Тогда я сказал[a]: «До каких пор, Господи?» Он ответил: «Пока города не опустеют, так что в них не останется жителей, дома — людей, и земля не станет пустыней».'
  rationale: Исправлены отрицания, чтобы города были без жителей, а дома — без людей, как в еврейском тексте. Единая конструкция «Пока...» передаёт עַד אֲשֶׁר אִם, а эллиптическое «дома — людей» воспроизводит краткий параллелизм оригинала. «Не станет пустыней» передаёт итоговое запустение земли без избыточного толкования.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:30:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Текст верно передаёт вопрос Исаии, обращение «Господи» и общий смысл предела суда. Однако отрицание в двух местах меняет смысл: «не останется в них жителей» и особенно «дома не останутся без людей» означают, что жители/люди останутся, тогда как еврейский текст говорит об их отсутствии. Кроме того, повтор «пока» перед второй частью создаёт ненужную синтаксическую неясность.'
  naturalness: «До каких пор, Господи?» и «Тогда я сказал» естественны для современного литературного русского. Исправленная конструкция с тире в «дома — без людей» сохраняет сжатый параллелизм пророческой речи и звучит естественно.
  terminology: «Господи» адекватно передаёт обращение אֲדֹנָי. «Людей» верно передаёт родовое אָדָם без искусственного мужского ограничения. «Земля» уместна для הָאֲדָמָה в данном контексте. «Пустыня» передаёт שְׁמָמָה как состояние полного запустения, не вводя географического значения в ущерб контексту.
  issues:
  - severity: high
    issue: Смысловое отрицание в описании безлюдности городов и домов.
    rationale: Фразы «не останется в них жителей» и «дома не останутся без людей» противоположны מֵאֵין יוֹשֵׁב и מֵאֵין אָדָם, которые обозначают отсутствие жителей и людей.
  - severity: medium
    issue: Повтор «пока» перед «дома не останутся без людей» нарушает структуру перечисления.
    rationale: В оригинале один временной предел охватывает три параллельных картины опустошения; русское перечисление следует сделать единым и ясным.
