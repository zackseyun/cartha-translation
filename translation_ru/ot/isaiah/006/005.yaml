  text: וָ/אֹמַ֞ר אֽוֹי לִ֣/י כִֽי נִדְמֵ֗יתִי כִּ֣י אִ֤ישׁ טְמֵֽא שְׂפָתַ֨יִם֙ אָנֹ֔כִי וּ/בְ/תוֹךְ֙ עַם טְמֵ֣א שְׂפָתַ֔יִם אָנֹכִ֖י יוֹשֵׁ֑ב כִּ֗י אֶת הַ/מֶּ֛לֶךְ יְהוָ֥ה צְבָא֖וֹת רָא֥וּ עֵינָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/005.yaml
  text: And I said[a], “Woe is me, for I am ruined; for I am a man of unclean lips, and I dwell among a people of unclean lips; for my eyes have seen the King[b], Yahweh of Armies.”
translation:
  language: ru
  text: 'И сказал я: «Горе мне! Я погиб[a], потому что я человек с нечистыми устами и живу среди народа с нечистыми устами; ведь глаза мои увидели Царя — Яхве Воинств[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «я обречён», «я уничтожен» или «я умолк».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Господь Саваоф» или «Господь воинств».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֽוֹי לִי
  choice: Горе мне!
  rationale: Устойчивое русское восклицание, передающее плач и осознание грозящей гибели.
- source_word: נִדְמֵיתִי
  choice: Я погиб
  rationale: В данном контексте форма нифаль выражает переживание собственной обречённости перед Божьим присутствием; краткая форма естественна и сохраняет напряжённость, а возможные оттенки отмечены в сноске.
- source_word: אִישׁ טְמֵא שְׂפָתַיִם
  choice: человек с нечистыми устами
  rationale: Передаёт самоописание Исаии и образ ритуально-нравственной нечистоты, проявляющейся в речи.
- source_word: וּבְתוֹךְ עַם
  choice: среди народа
  rationale: Естественно передаёт пребывание внутри сообщества без излишне архаичного оборота «посреди народа».
- source_word: יוֹשֵׁב
  choice: живу
  rationale: В контексте причастие от ישב обозначает постоянное проживание, а не буквальное сидение; «живу» ясно для современного читателя.
- source_word: הַמֶּלֶךְ
  choice: Царя
  rationale: Сохраняет определённый титул; прописная буква уместна при прямом именовании Бога.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יהוה транслитерацией и переводит צבאות, сохраняя образ Бога как Владыки небесных сил; традиционный вариант приведён в сноске.
- source_word: רָאוּ עֵינַי
  choice: глаза мои видели
  rationale: Сохраняет выразительную еврейскую конструкцию с глазами как грамматическим субъектом и завершённость увиденного.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Передача צְבָאוֹת в составе божественного именования
  choice: Воинств
  alternative: Саваоф; Господь воинств
  rationale: «Воинств» сохраняет значение множества небесных сил и торжественный регистр; привычная традиционная формула дана в сноске без сведения образа к одной конфессиональной трактовке.
- issue: Смысл נִדְמֵיתִי перед лицом Божьего присутствия
  choice: Я погиб
  alternative: я обречён; я уничтожен; я умолк
  rationale: Форма допускает оттенки гибели, уничтожения или прекращения речи. Основной текст передаёт непосредственное ощущение смертельной обречённости, не превращая его в утверждение о фактически уже совершившемся уничтожении.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Инверсия «глаза мои» сохранена ради возвышенного звучания и близости к еврейскому строю; архаизмы сведены к минимуму.
