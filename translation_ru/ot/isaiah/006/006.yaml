source:
  edition: WLC
  text: וַ/יָּ֣עָף אֵלַ֗/י אֶחָד֙ מִן הַ/שְּׂרָפִ֔ים וּ/בְ/יָד֖/וֹ רִצְפָּ֑ה בְּ/מֶ֨לְקַחַ֔יִם לָקַ֖ח מֵ/עַ֥ל הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/006.yaml
  text: Then one of the seraphim flew to me[a], and in his hand was a glowing coal that he had taken from the altar with tongs.
translation:
  language: ru
  text: Тогда один из серафимов полетел ко мне. В руке у него был раскалённый уголь[a], который он взял щипцами с жертвенника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раскалённый камень». Еврейское слово может обозначать горячий камень или горящий уголь, взятый с жертвенника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעָף
  choice: полетел
  rationale: Глагол עוּף прямо обозначает полёт; направление движения уже выражено словами «ко мне».
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица указывает на движение к говорящему.
- source_word: אֶחָד מִן־הַשְּׂרָפִים
  choice: один из серафимов
  rationale: В контексте видения שְׂרָפִים обозначает особый разряд небесных существ; традиционный термин «серафимы» сохраняет эту конкретику без навязывания этимологического толкования «пылающие».
- source_word: וּבְיָדוֹ
  choice: В руке у него был
  rationale: Именная конструкция естественно передана по-русски с добавлением связки «был»; конкретный образ руки сохранён.
- source_word: רִצְפָּה
  choice: раскалённый уголь
  rationale: В данном контексте слово обозначает горячий предмет с жертвенника — уголь или раскалённый камень. «Раскалённый уголь» ясно и естественно передаёт жар предмета и подходит к описанной сцене.
- source_word: בְּמֶלְקַחַיִם
  choice: щипцами
  rationale: Существительное обозначает щипцы или клещи; «щипцами» — современное и естественное название орудия, которым берут раскалённый предмет.
- source_word: לָקַח
  choice: который он взял
  rationale: Форма qatal описывает действие, предшествовавшее полёту серафима; русское придаточное определительное естественно передаёт эту связь, а последовательность ясна из контекста.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: с жертвенника
  rationale: מֵעַל означает движение «с поверхности»; русское «с жертвенника» точно и идиоматично передаёт смысл.
theological_decisions:
- issue: Передача שְׂרָפִים в видении небесного престола
  choice: серафимов
  alternative: пылающих
  rationale: Термин называет в Исайи 6 определённых небесных существ. Его сохранение удерживает литературную и богословскую специфику видения, не сводя название к возможной этимологии.
- issue: Передача רִצְפָּה в сцене очищения у жертвенника
  choice: раскалённый уголь
  alternative: раскалённый камень
  rationale: Еврейское слово допускает оба предметных понимания. Основной текст использует понятное современному читателю выражение, а лексическая неоднозначность сохраняется в примечании без догматизации образа.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-возвышенным повествованием. Синтаксис разделён на два предложения для естественности и прозрачности образа; традиционный термин «серафимы» сохранён.
