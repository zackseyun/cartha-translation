lexical_decisions:
- source_word: וְקָרָא זֶה אֶל זֶה וְאָמַר
  choice: И взывал один к другому
  rationale: Глагол קרא здесь обозначает громкое обращение; имперфект с ו в пророческом повествовании передаёт последовательное действие. Оборот זֶה אֶל זֶה естественно передан как «один к другому», а отдельное «и говорил» по-русски можно выразить двоеточием без потери смысла.
- source_word: קָדוֹשׁ קָדוֹשׁ קָדוֹשׁ
  choice: Свят, свят, свят
  rationale: Троекратное повторение сохранено без расширения, чтобы передать усиление и литургическую выразительность оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: 'В составе божественного титула традиционное русское «Воинств» сохраняет широту значения: силы или воинства, находящиеся под властью Яхве.'
- source_word: מְלֹא כָל הָאָרֶץ כְּבוֹדוֹ
  choice: Вся земля полна Его славы
  rationale: Именная конструкция естественно передана русским сказуемым «полна»; כָל הָאָרֶץ означает всю землю, а суффикс в כְּבוֹדוֹ — принадлежность славы Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал употребляет тетраграмматон как личное имя. Транслитерация сохраняет различие между именем и титулом, тогда как традиционный вариант «Господь» допустимо отметить как практику других переводов, но не подставлять в основной текст.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Яхве воинств; Яхве армий; Господь Саваоф
  rationale: «Воинств» сохраняет многозначность צְבָאוֹת и не ограничивает выражение только земными армиями. Заглавная буква подчёркивает цельность устойчивого титула, не уточняя сверх текста, о каких именно силах идёт речь.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной библейской интонацией. Поэтическое членение сохраняет торжественный параллелизм; архаизм «Саваоф» не используется в основном тексте. Маркер [a] поставлен непосредственно после титула, к которому относится примечание.
