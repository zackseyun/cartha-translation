id: ISA.6.1
reference: Isaiah 6:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בִּ/שְׁנַת מוֹת֙ הַ/מֶּ֣לֶךְ עֻזִּיָּ֔הוּ וָ/אֶרְאֶ֧ה אֶת אֲדֹנָ֛/י יֹשֵׁ֥ב עַל כִּסֵּ֖א רָ֣ם וְ/נִשָּׂ֑א וְ/שׁוּלָ֖י/ו מְלֵאִ֥ים אֶת הַ/הֵיכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/001.yaml
  text: In the year of King Uzziah’s death[a], I saw the Lord seated on a throne, high and lifted up[b], and the hem of his robe filled the temple.
translation:
  language: ru
  text: В год смерти царя Озии я увидел Господа, сидящего на высоком и превознесённом престоле; края Его одеяния[a] наполняли храм[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шлейф Его одеяния».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать и «дворец», и «храм».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת הַמֶּלֶךְ עֻזִּיָּהוּ
  choice: В год смерти царя Озии
  rationale: Сохраняет временную конструкцию и передаёт מוֹת как событие смерти, а имя עֻזִּיָּהוּ — в принятой русской библейской форме «Озия».
- source_word: וָאֶרְאֶה
  choice: я увидел
  rationale: Естественно передаёт повествовательную форму первого лица; союз не выражен отдельно, поскольку по-русски он здесь необязателен.
- source_word: אֲדֹנָי
  choice: Господа
  rationale: Это божественный титул Адонай, а не тетраграмматон; «Господь» — его естественный и традиционный русский эквивалент.
- source_word: יֹשֵׁב עַל כִּסֵּא
  choice: сидящего на … престоле
  rationale: Причастная конструкция передаёт положение восседающего Царя; «престол» сохраняет царственный образ.
- source_word: רָם וְנִשָּׂא
  choice: высоком и превознесённом
  rationale: Согласование с ближайшим существительным כִּסֵּא («престол») сохраняет прямую грамматическую связь еврейского текста и не устраняет возвышенный параллелизм двух определений.
- source_word: שׁוּלָיו
  choice: края Его одеяния
  rationale: Называет нижние края или полы одежды. Такой вариант понятен современному читателю и сохраняет конкретный образ; возможное «шлейф» указано в сноске.
- source_word: מְלֵאִים אֶת הַהֵיכָל
  choice: наполняли храм
  rationale: Множественное число сказуемого согласовано с «краями»; «храм» наиболее естественен в контексте небесного святилища, хотя הֵיכָל может означать также дворец.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет общепринятое обозначение Бога и не подменяет написанный титул личным именем YHWH; вариант «Владыка» возможен, но сильнее истолковывает оттенок господства.
- issue: К чему относится רָם וְנִשָּׂא
  choice: 'к престолу: «на высоком и превознесённом престоле»'
  alternative: 'к Господу: «высокого и превознесённого»'
  rationale: По непосредственному синтаксису определения стоят после כִּסֵּא и согласуются с ним. При этом образ возвышенного престола по смыслу выражает величие Сидящего на нём, не требуя переноса определений на Господа.
- issue: Значение הֵיכָל
  choice: храм
  alternative: дворец
  rationale: Оба значения лексически возможны. Контекст видения, служения серафимов и возглашения святости поддерживает значение святилища, тогда как царский оттенок сохраняется в образе престола.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Прописная буква в местоимении «Его» поддерживает принятую русскую религиозно-литературную норму; точка с запятой разделяет видение престола и описание одеяния без дробления стиха.
