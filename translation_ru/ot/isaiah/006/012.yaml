base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/012.yaml
  text: And Yahweh will remove people far away[b][a], and the forsaken places will be many in the midst of the land.
translation:
  language: ru
  text: И Яхве уведёт людей далеко[a], и велико будет запустение посреди страны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человека»; еврейское אָדָם здесь имеет собирательное значение и обозначает людей, население.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и много будет покинутых мест посреди страны». Еврейское выражение может обозначать как великое запустение, так и множество оставленных мест.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרִחַק
  choice: удалит далеко
  rationale: Глагол רחק передаёт причинение удаления или отдаления; в пророческом контексте перфект с וְ естественно выражен будущим временем. Сочетание сохраняет и действие, и идею большого расстояния, не уточняя способ удаления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом «Господь».
- source_word: הָאָדָם
  choice: людей
  rationale: Существительное אָדָם употреблено как собирательное единственное число и обозначает человеческое население; русское «людей» естественно передаёт этот смысл без ограничения только мужчинами.
- source_word: וְרַבָּה הָעֲזוּבָה
  choice: и велико будет запустение
  rationale: Форма רַבָּה согласована с הָעֲזוּבָה и выражает большую меру или распространённость. Абстрактное «запустение» непосредственно передаёт состояние оставленной земли и сохраняет возможное абстрактное понимание еврейского выражения.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: посреди страны
  rationale: Передаёт пространственное значение בְּקֶרֶב и контекстуальное значение הָאָרֶץ как страны или земли, не сужая его до отдельной местности.
theological_decisions:
- issue: Собирательное значение הָאָדָם
  choice: людей
  alternative: человека; человечество
  rationale: Речь идёт об удалении населения при суде. Множественное «людей» ясно и естественно передаёт собирательную функцию единственного числа, не вводя гендерного ограничения.
- issue: Значение הָעֲזוּבָה
  choice: запустение
  alternative: покинутые места; оставленность
  rationale: Еврейская форма допускает абстрактное обозначение оставленности или конкретное обозначение опустевших мест. Основной текст сохраняет абстрактный образ, а конкретное прочтение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксический параллелизм оригинала сохранён; формулировка не уточняет механизм удаления людей и не устраняет неоднозначность הָעֲזוּבָה.
