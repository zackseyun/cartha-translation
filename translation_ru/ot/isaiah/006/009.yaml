base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/009.yaml
  text: 'And he said[a], “Go, and say to this people: ‘Keep hearing, but do not understand; keep seeing, but do not perceive.’”'
translation:
  language: ru
  text: 'И Он сказал[a]: «Иди и скажи этому народу: слушайте, слушайте, но не понимайте; смотрите, смотрите, но не узнавайте».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более формальной передачей еврейского усиления: «Слушайте же, но не понимайте; смотрите же, но не узнавайте». Эти слова можно также понимать как предсказание: «Вы будете слушать, но не поймёте; будете смотреть, но не узнаете».'
    reason: Альтернативная передача усилительной конструкции и возможного предсказательного оттенка.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И Он сказал
  rationale: Обычная повествовательная форма от אמר. Союз «и» сохраняет ход еврейского повествования, не придавая ему лишнего временного оттенка.
- source_word: לֵךְ
  choice: Иди
  rationale: Прямое повеление, обращённое к Исаии.
- source_word: וְאָמַרְתָּ
  choice: и скажи
  rationale: Естественно передаёт следующее за «иди» повеление.
- source_word: לָעָם הַזֶּה
  choice: этому народу
  rationale: Сохраняет единственное число и несколько отстранённый тон указательного выражения.
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Слушайте снова и снова
  rationale: Сочетание повелительного наклонения с абсолютным инфинитивом усиливает глагольное действие; повторяемость естественно передаёт это усиление по-русски, не устраняя повелительную форму.
- source_word: וְאַל תָּבִינוּ
  choice: но не понимайте
  rationale: בין означает понимать, различать или постигать; «понимайте» здесь является прямым и естественным соответствием.
- source_word: וּרְאוּ רָאוֹ
  choice: смотрите снова и снова
  rationale: Как и в предыдущей строке, повелительное наклонение с абсолютным инфинитивом выражает усиленное или продолжающееся действие.
- source_word: וְאַל תֵּדָעוּ
  choice: но не осознавайте
  rationale: ידע буквально связано со знанием, но в сочетании со зрением здесь подразумевает осознание или распознавание увиденного. «Осознавайте» сохраняет отличие от בין («понимайте») и звучит естественно в данном параллелизме.
theological_decisions:
- issue: Передавать ли слова как прямые повеления или как ироническое судебное предсказание
  choice: 'Сохранены прямые повелительные формы: «слушайте… не понимайте; смотрите… не осознавайте».'
  alternative: 'Предсказательное прочтение: «вы будете слушать… но не поймёте; будете смотреть… но не осознаете».'
  rationale: Формы שִׁמְעוּ и רְאוּ грамматически являются императивами, а отрицательные конструкции естественно продолжают повелительную речь. В контексте поручения пророку они имеют иронический и судебный смысл, однако перевод не должен превращать грамматические повеления исключительно в предсказание; возможный предсказательный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «снова и снова» делает еврейское усиление понятным обычному читателю; синтаксис сохраняет резкость и богословское напряжение судебного поручения.
