source:
  edition: WLC
  text: הַשְׁמֵן֙ לֵב הָ/עָ֣ם הַ/זֶּ֔ה וְ/אָזְנָ֥י/ו הַכְבֵּ֖ד וְ/עֵינָ֣י/ו הָשַׁ֑ע פֶּן יִרְאֶ֨ה בְ/עֵינָ֜י/ו וּ/בְ/אָזְנָ֣י/ו יִשְׁמָ֗ע וּ/לְבָב֥/וֹ יָבִ֛ין וָ/שָׁ֖ב וְ/רָ֥פָא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/010.yaml
  text: Make the heart of this people dull[a], and make their ears heavy, and blind their eyes, lest they see with their eyes, and hear with their ears, and understand with their heart, and turn back[c][b], and be healed.
translation:
  language: ru
  text: Сделай сердце этого народа невосприимчивым[a], отяготи его уши и закрой ему глаза[b], чтобы он не увидел своими глазами, не услышал своими ушами, не понял сердцем, не вернулся[c] и не был исцелён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделай сердце этого народа жирным»; здесь образ означает невосприимчивость, притуплённость.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «сомкни ему глаза» или «залепи ему глаза»; еврейский глагол передаёт утрату зрительной восприимчивости.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обратился». Глагол может означать возвращение вообще, а в этом контексте — также обращение к Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁמֵן
  choice: сделай ... бесчувственным
  rationale: Глагол буквально означает «сделай жирным», но в сочетании с «сердцем» описывает утрату восприимчивости. «Бесчувственным» естественно передаёт смысл образа, не ослабляя повеления.
- source_word: לֵב
  choice: сердце
  rationale: לֵב обозначает внутренний центр мысли, восприятия и воли. «Сердце» сохраняет библейский антропологический образ.
- source_word: הָעָם הַזֶּה
  choice: этого народа
  rationale: Еврейское выражение стоит в собирательном единственном числе. Русское «этот народ» естественно сохраняет его, поэтому далее употреблены формы единственного числа.
- source_word: הַכְבֵּד
  choice: отяготи
  rationale: Повелительная форма буквально требует сделать уши «тяжёлыми», то есть невосприимчивыми. «Отяготи» сохраняет исходную метафору и торжественный пророческий строй.
- source_word: הָשַׁע
  choice: закрой
  rationale: Редкий глагол применительно к глазам выражает их закрытие или утрату способности воспринимать; «закрой» передаёт вероятный образ, а иные оттенки отмечены в сноске.
- source_word: פֶּן
  choice: чтобы ... не
  rationale: Такая конструкция естественно передаёт предупредительно-предотвратительное значение פֶּן в современном русском языке.
- source_word: וָשָׁב
  choice: обратился
  rationale: שׁוב значит «повернуться, вернуться, обратиться». «Обратился» сохраняет возможный духовный смысл, но не вводит более узкое слово «покаялся».
- source_word: וְרָפָא לוֹ
  choice: и не был исцелён
  rationale: Краткая еврейская конструкция выражает исцеление народа без прямо названного деятеля. Русская страдательная форма сохраняет эту неопределённость.
theological_decisions:
- issue: Божественное действие в ожесточении народа
  choice: 'Повеления переданы прямо: «сделай… отяготи… закрой».'
  alternative: 'Ослабить их разрешительными или результативными оборотами: «пусть станет», «так что стало».'
  rationale: В еврейском тексте стоят повелительные формы, обращённые к пророку. Прямой перевод сохраняет напряжённость темы Божьего суда и не смягчает её толкованием.
- issue: Значение обращения
  choice: «обратился»
  alternative: «покаялся» или нейтральное «вернулся»
  rationale: «Обратился» допускает подразумеваемое возвращение к Богу, но не делает этот смысл более определённым, чем позволяет многозначный глагол שׁוב.
- issue: Кто совершает исцеление
  choice: 'Не называть действующее лицо: «не был исцелён».'
  alternative: «И Я не исцелил его».
  rationale: Хотя в контексте исцеление исходит от Бога, в данной еврейской фразе субъект исцеления прямо не назван; перевод не добавляет его.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Собирательное «народ» последовательно согласовано в единственном числе. Сохранены резкие повеления и метафора тяжёлых ушей; архаизмы сведены к уместному глаголу «отяготи».
