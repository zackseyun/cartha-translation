base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/013.yaml
  text: And though a tenth remains in it[a], it will again be for burning, like a terebinth or like an oak whose stump remains when it is felled. The holy seed is its stump.
translation:
  language: ru
  text: И хотя в ней останется десятая часть, она вновь будет отдана на сожжение, как теревинф или дуб, у которых при рубке[a] остаётся пень. Святое семя — её пень.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда с них опадают листья». Значение еврейского слова בְּשַׁלֶּכֶת не вполне ясно; основной текст следует пониманию, связанному с рубкой дерева, поскольку далее упомянут оставшийся пень.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֥וֹד בָּהּ֙ עֲשִׂ֣רִיָּ֔ה
  choice: хотя в ней останется десятая часть
  rationale: Сочетание עוֹד с контекстом уцелевшего остатка передаёт продолжение существования, а уступительное «хотя» естественно выражает контраст между сохранением десятой части и новым судом. Женское местоимение בָּהּ передано как «в ней», сохраняя отсылку к земле.
- source_word: וְשָׁ֖בָה וְהָיְתָ֣ה לְבָעֵ֑ר
  choice: она снова будет предана сожжению
  rationale: וְשָׁבָה здесь указывает на повторность, а конструкция לְבָעֵר буквально сохраняет направленность «на сожжение/истребление». «Предана сожжению» передаёт образ огня, не уточняя способ и полноту уничтожения сверх сказанного в тексте.
- source_word: כָּאֵלָ֣ה וְכָאַלּ֗וֹן
  choice: как теревинф или дуб
  rationale: Сохранены два конкретных вида дерева. В русском парное сравнение естественно соединяется союзом «или», тогда как повторяющееся כְּ обозначает два сопоставимых образа.
- source_word: בְּשַׁלֶּכֶת֙
  choice: после того, как их срубят
  rationale: Слово трудно для истолкования. В основном тексте выбрано значение, связанное с рубкой, поскольку непосредственно далее говорится об остающемся пне; значение, связанное с опаданием листьев, сохранено в сноске.
- source_word: מַצֶּ֣בֶת בָּ֔ם
  choice: от которых ... остаётся пень
  rationale: מַצֶּבֶת обозначает оставшуюся стоять часть дерева. «Пень» ясно и естественно передаёт этот образ по-русски.
- source_word: זֶ֥רַע קֹ֖דֶשׁ
  choice: Святое семя
  rationale: Буквальный образ сохранён без замены на более узкое толкование вроде «верного остатка», «потомства» или мессианской линии.
- source_word: מַצַּבְתָּֽהּ
  choice: её пень
  rationale: Повторено слово «пень», чтобы явно связать заключительную фразу с образом срубленного дерева. Женское «её» сохраняет грамматическую форму еврейского суффикса и отсылку к земле/оставшейся части.
theological_decisions:
- issue: Кого обозначает «святое семя»
  choice: Оставлено буквальное выражение «Святое семя — её пень» без уточнения его исторической или мессианской идентичности.
  alternative: Верный остаток Израиля; уцелевший народ завета; мессианское семя.
  rationale: Образ указывает на освящённое начало продолжения после суда, но сам стих не определяет его точнее. Буквальная формулировка сохраняет богословскую многозначность.
- issue: Характер повторного суда над десятой частью
  choice: «Снова будет предана сожжению».
  alternative: «Снова будет истреблена»; «снова станет добычей огня».
  rationale: 'Так сохраняется образ בָּעֵר и повторность וְשָׁבָה, но не утверждается, что уничтожение обязательно окончательно: последующий образ пня удерживает напряжение между судом и продолжением.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Редкий, но точный ботанический термин «теревинф» сохранён; синтаксис упрощён настолько, чтобы сложный образ оставался понятным обычному читателю.
