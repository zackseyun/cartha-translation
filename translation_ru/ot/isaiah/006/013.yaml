  to: И хотя в ней останется десятая часть, она вновь будет отдана на сожжение, как теревинф или дуб, у которых при рубке[a] остаётся пень. Святое семя — её пень.
  rationale: Исправление ограничено стилистикой и степенью определённости в передаче спорного בְּשַׁלֶּכֶת. Сохраняются количественный образ «десятой части», повторность суда, конкретные названия деревьев и богословски нерасшифрованное выражение «Святое семя».
