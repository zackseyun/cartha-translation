base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/004.yaml
  text: The foundations of the thresholds shook at the sound of the one calling[b][a], and the house was filled with smoke.
translation:
  language: ru
  text: От голоса взывающего задрожали основания порогов[b], и дом[a] наполнился дымом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «храм». Буквально: «дом» — обычное обозначение храмового святилища.'
    reason: lexical_alternative
  - marker: b
    text: Или «опоры порогов» или «дверные косяки». Еврейское выражение обозначает конструктивные части в области порога или дверного проёма.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנֻעוּ
  choice: задрожали
  rationale: Глагол נוּעַ обозначает движение или колебание. «Задрожали» естественно передаёт зримое сотрясение архитектурных частей, не преувеличивая его силу.
- source_word: אַמּוֹת הַסִּפִּים
  choice: опоры порогов
  rationale: Сочетание обозначает несущие или опорные части в области порогов и дверных проёмов. «Опоры порогов» сохраняет архитектурный образ и допускает присущую еврейскому выражению неоднозначность.
- source_word: מִקּוֹל
  choice: от голоса
  rationale: Предлог מִן здесь выражает причину, а קוֹל — голос или звук. «От голоса» кратко и естественно передаёт причинную связь.
- source_word: הַקּוֹרֵא
  choice: взывающего
  rationale: Субстантивированное причастие сохраняет продолжающееся действие и не уточняет прямо, кто именно взывает, как и еврейский текст.
- source_word: וְהַבַּיִת
  choice: и дом
  rationale: בַּיִת буквально означает «дом» и в данном видении обозначает храмовое святилище. Основной текст сохраняет исходный образ, а храмовый смысл поясняется в сноске.
- source_word: יִמָּלֵא
  choice: наполнился
  rationale: Нифаль передаёт состояние наполнения; в русской повествовательной последовательности естественно употребить прошедшее время «наполнился».
- source_word: עָשָׁן
  choice: дымом
  rationale: Прямой и контекстуально точный эквивалент существительного עָשָׁן.
theological_decisions:
- issue: Обозначение святилища в пророческом видении
  choice: дом
  alternative: храм
  rationale: Еврейский текст употребляет обычное слово «дом», которое в контексте может обозначать храм. Сохранение слова «дом» не подменяет исходную формулировку толкованием; храмовый смысл указан в сноске.
- issue: Кто именно взывает
  choice: взывающего
  alternative: серафима, который взывал
  rationale: Ближайший контекст указывает на серафима, однако сам стих использует лишь причастие с определённым артиклем. Перевод сохраняет эту степень явности и не добавляет референта в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но ясным библейским звучанием. Инверсия «От голоса взывающего…» подчёркивает причину сотрясения и остаётся естественной для русского повествования.
