  text: שְׂרָפִ֨ים עֹמְדִ֤ים מִ/מַּ֨עַל֙ ל֔/וֹ שֵׁ֧שׁ כְּנָפַ֛יִם שֵׁ֥שׁ כְּנָפַ֖יִם לְ/אֶחָ֑ד בִּ/שְׁתַּ֣יִם יְכַסֶּ֣ה פָנָ֗י/ו וּ/בִ/שְׁתַּ֛יִם יְכַסֶּ֥ה רַגְלָ֖י/ו וּ/בִ/שְׁתַּ֥יִם יְעוֹפֵֽף׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/002.yaml
  text: 'Seraphim were standing above him. Each had six wings: with two he covered his face[a], and with two he covered his feet, and with two he flew.'
translation:
  language: ru
  text: 'Над Ним стояли серафимы[a]. У каждого было по шесть крыльев: двумя крыльями он закрывал своё лицо, двумя — свои ноги, а двумя летал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пылающие»; название, вероятно, связано с корнем, означающим «гореть».'
    reason: Лексическая альтернатива и возможная этимология термина שְׂרָפִים.
lexical_decisions:
- source_word: שְׂרָפִים
  choice: серафимы
  rationale: Сохранено традиционное название этого разряда небесных существ; буквальное «пылающие» этимологически возможно, но в данном контексте менее определённо.
- source_word: עֹמְדִים
  choice: стояли
  rationale: Передаёт причастную форму как состояние, наблюдаемое в видении, и естественно звучит в русском повествовании.
- source_word: מִמַּעַל לוֹ
  choice: Над Ним
  rationale: Фраза обозначает пространственное положение относительно Господа, сидящего на престоле; прописная буква ясно указывает на контекстуальный референт без добавления имени.
- source_word: שֵׁשׁ כְּנָפַיִם ... שֵׁשׁ כְּנָפַיִם לְאֶחָד
  choice: У каждого было по шесть крыльев
  rationale: Естественно передаёт распределительное значение еврейского выражения, хотя формальное повторение «шесть крыльев» в русском не воспроизводится.
- source_word: בִּשְׁתַּיִם
  choice: двумя
  rationale: Творительный падеж естественно передаёт инструментальное значение предлога и подразумевает два крыла.
- source_word: יְכַסֶּה
  choice: он закрывал
  rationale: Сохраняет распределительное единственное число и описывает повторяющееся либо характерное действие внутри видения.
- source_word: פָנָיו
  choice: своё лицо
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит лицо с субъектом действия.
- source_word: רַגְלָיו
  choice: свои ноги
  rationale: «Ноги» — обычное контекстуальное соответствие; эвфемистическое понимание возможно в иных местах, но здесь не навязывается.
- source_word: יְעוֹפֵף
  choice: летал
  rationale: Несовершенный вид согласуется с описательным характером видения и параллельными формами «закрывал».
theological_decisions:
- issue: Перевод שְׂרָפִים как названия небесных существ или как этимологической характеристики
  choice: серафимы
  alternative: пылающие
  rationale: Транслитерированное традиционное название сохраняет особенность образа и не превращает возможную этимологию в несомненное толкование.
- issue: Референт местоименного суффикса в לוֹ
  choice: Над Ним
  alternative: над ним; над престолом
  rationale: В ближайшем контексте речь идёт о Господе на престоле. Перевод «над престолом» заменил бы местоименный референт истолкованием.
- issue: Распределительное единственное число при множественном «серафимы»
  choice: У каждого… он закрывал… летал
  alternative: Они… закрывали… летали
  rationale: Сохранено переключение еврейского текста к каждому отдельному серафиму, не обезличивая небесных существ.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. «Серафимы» сохраняет укоренённый библейский термин; формы несовершенного вида поддерживают характер описываемой сцены.
