base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/031.yaml
  text: The strong man will become tinder[a], and his work a spark; both of them will burn together, with no one to quench them.
translation:
  language: ru
  text: И станет сильный трутом[a], а дело его — искрой; оба будут гореть вместе, и некому будет их потушить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «паклей» — рыхлым льняным волокном, которое легко воспламеняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָסֹן
  choice: сильный
  rationale: Субстантивированное прилагательное обозначает сильного или могущественного человека. «Сильный» сохраняет личный и основной лексический смысл, не сужая его до богатства.
- source_word: לִנְעֹרֶת
  choice: трутом
  rationale: Существительное обозначает легко воспламеняющееся вытрепанное волокно, в частности льняные очёски. «Трут» естественно передаёт функцию образа; конкретный материал пояснён в сноске.
- source_word: וּפֹעֲלוֹ
  choice: а дело его
  rationale: פֹּעַל может означать дело, действие, труд или произведённое. «Дело его» сохраняет широту значения и ясно связывает притяжательное местоимение с «сильным».
- source_word: לְנִיצוֹץ
  choice: искрой
  rationale: Слово обозначает искру или раскалённую частицу; «искра» прямо и образно сочетается с трутом.
- source_word: וּבָעֲרוּ
  choice: и загорятся
  rationale: Глагол описывает горение. В сочетании трута и искры «загорятся» естественно выражает начало совместного горения, не добавляя идеи, отсутствующей в тексте.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: оба вместе
  rationale: Краткая русская формула сохраняет усиленное указание на совместную гибель сильного и его дела.
- source_word: וְאֵין מְכַבֶּה
  choice: и некому будет погасить
  rationale: Конструкция с אֵין и причастием выражает отсутствие того, кто мог бы потушить огонь. Русская безличная конструкция естественна и сохраняет окончательность суда.
theological_decisions:
- issue: К кому относится единственное притяжательное местоимение в выражении וּפֹעֲלוֹ
  choice: '«Его» относится к сильному: суд постигает и самого могущественного человека, и его дело.'
  alternative: Местоимение можно понимать собирательно — как указание на дела сильных или могущественных людей.
  rationale: Единственное число суффикса наиболее естественно отсылает к стоящему в единственном числе הֶחָסֹן; так сохраняется тесный поэтический параллелизм между человеком и его делом.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и пророческой образности. Инверсия «дело его» придаёт строке достоинство и одновременно ясно удерживает связь с предшествующим «сильный».
