lexical_decisions:
- source_word: כַּסְפֵּךְ
  choice: серебро твоё
  rationale: כֶּסֶף здесь означает серебро как металл; это сохраняет образ порчи драгоценного металла. Суффикс 2-го лица женского рода единственного числа передан притяжательной формой и относится к Сиону/Иерусалиму.
- source_word: הָיָה
  choice: стало
  rationale: Форма qatal выражает наступившее состояние; русское «стало» естественно передаёт результат превращения.
- source_word: לְסִיגִים
  choice: примесью
  rationale: סִיגִים обозначает неблагородные примеси или отходы, отделяемые при очищении металла. «Примесью» понятно современному читателю и сохраняет контраст с чистым серебром; «шлаком» было бы более техническим и могло бы чрезмерно конкретизировать образ.
- source_word: סָבְאֵךְ
  choice: хмельной напиток твой
  rationale: Слово обозначает опьяняющий напиток и может относиться к вину или другому крепкому напитку. Обобщённый перевод сохраняет широту еврейского слова, а «хмельной» передаёт его существенный оттенок.
- source_word: מָהוּל
  choice: разбавлен
  rationale: Пассивная форма означает «смешан» или, в данном отрицательном контексте, «разбавлен»; последнее ясно выражает порчу напитка добавлением воды.
- source_word: בַּמָּיִם
  choice: водой
  rationale: Предлог ב употреблён инструментально или ассоциативно; творительный падеж естественно передаёт значение «с водой/водой».
