source:
  edition: WLC
  text: לְכוּ נָ֛א וְ/נִוָּֽכְחָ֖ה יֹאמַ֣ר יְהוָ֑ה אִם יִֽהְי֨וּ חֲטָאֵי/כֶ֤ם כַּ/שָּׁנִים֙ כַּ/שֶּׁ֣לֶג יַלְבִּ֔ינוּ אִם יַאְדִּ֥ימוּ כַ/תּוֹלָ֖ע כַּ/צֶּ֥מֶר יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/018.yaml
  text: 'Come now[a], and let us reason together, says Yahweh: though your sins are like scarlet, they will become white like snow; though they are red like crimson[b], they will become like wool.'
translation:
  language: ru
  text: «Давайте же разберём дело[a], — говорит Яхве. — Хотя ваши грехи подобны багрянцу, они станут белыми, как снег; хотя они красны, как червлёная краска[b], они станут как шерсть».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «и рассудимся», «и обсудим всё вместе» или «и разрешим спор». Еврейский глагол сочетает оттенки разговора, спора и судебного разбирательства.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово связано с червецом — насекомым, из которого получали багряно-красный краситель; в данном контексте оно обозначает этот цвет или краску.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ נָא
  choice: Давайте же
  rationale: Императив לְכוּ здесь служит идиоматическим призывом приступить к действию, а частица נָא придаёт ему настойчиво-пригласительный оттенок. «Давайте же» естественно передаёт это в современном русском языке.
- source_word: וְנִוָּכְחָה
  choice: разберём наше дело
  rationale: 'Форма от יכח имеет диалогический и судебный оттенок: речь может идти о совместном рассмотрении, споре или разрешении дела. Эта формулировка звучит естественно и сохраняет образ разбирательства; диапазон значений отмечен в сноске.'
- source_word: יֹאמַר יְהוָה
  choice: говорит Яхве
  rationale: Формула пророческой речи передана настоящим временем. Личное имя יְהוָה транслитерировано как «Яхве», что сохраняет употреблённое в еврейском тексте имя.
- source_word: אִם יִהְיוּ חֲטָאֵיכֶם
  choice: Хотя ваши грехи подобны
  rationale: אִם в параллельных строках имеет уступительный смысл. «Хотя» лучше передаёт риторическую силу обещания, чем условное «если».
- source_word: כַּשָּׁנִים
  choice: подобны багрянцу
  rationale: שָׁנִים обозначает ярко-красный, багряный краситель или окрашенный им материал. «Багрянец» кратко и поэтично передаёт цветовой образ.
- source_word: כַּשֶּׁלֶג יַלְבִּינוּ
  choice: они станут белыми, как снег
  rationale: Глагол לבן выражает приобретение белизны; «станут белыми» ясно передаёт подразумеваемое превращение.
- source_word: אִם יַאְדִּימוּ
  choice: хотя они красны
  rationale: В параллели с первой строкой форма от אדם описывает насыщенную красноту; настоящее качественное значение естественно по-русски.
- source_word: כַּתּוֹלָע
  choice: как червлёная краска
  rationale: תּוֹלָע буквально связано с насекомым, из которого получали багряно-красный краситель, и метонимически обозначает сам цвет или краску. «Червлёная краска» сохраняет традиционную цветовую ассоциацию, а буквальная основа пояснена в сноске.
- source_word: כַּצֶּמֶר יִהְיוּ
  choice: они станут как шерсть
  rationale: Перевод сохраняет сравнение без добавления отсутствующего во второй строке слова «белыми»; белизна подразумевается параллелью со снегом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Условный или уступительный смысл אִם
  choice: хотя
  alternative: если / даже если
  rationale: Параллелизм и обещание изменения поддерживают уступительное прочтение. При этом оно не устраняет напряжения между тяжестью грехов и провозглашаемым преображением.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для пророческой речи. Сохранены поэтический параллелизм, цветовые противопоставления и юридико-диалогический оттенок призыва; редкие реалии пояснены краткими сносками.
