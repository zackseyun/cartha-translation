id: ISA.1.10
reference: Isaiah 1:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה קְצִינֵ֣י סְדֹ֑ם הַאֲזִ֛ינוּ תּוֹרַ֥ת אֱלֹהֵ֖י/נוּ עַ֥ם עֲמֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/010.yaml
  text: Hear the word of Yahweh[a], rulers of Sodom; give ear to the instruction of our God[b], people of Gomorrah.
translation:
  language: ru
  text: Слушайте слово Яхве[a], правители Содома! Внимайте наставлению нашего Бога[b], народ Гоморры!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пророк обращается к правителям и народу Иудеи, называя их Содомом и Гоморрой в качестве обличительного сравнения, а не отождествляя их с этими городами буквально.
    reason: cultural_note
  - marker: b
    text: 'Или: «учению» либо «закону»; еврейское слово тора имеет все эти значения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения во множественном числе призывает не просто услышать, но внимательно принять сказанное; «слушайте» естественно передаёт этот призыв по-русски.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: «Слово» сохраняет устойчивую пророческую формулу, а личное имя יהוה передано транслитерацией «Яхве», без замены титулом.
- source_word: קְצִינֵי
  choice: правители
  rationale: Слово обозначает начальников или руководителей; «правители» уместно в прямом пророческом обращении.
- source_word: הַאֲזִינוּ
  choice: внимайте
  rationale: Этот глагол усиливает призыв слушать внимательно. «Внимайте» сохраняет параллелизм с «слушайте», не повторяя тот же глагол.
- source_word: תּוֹרַת
  choice: наставлению
  rationale: תורה здесь может означать закон, учение или наставление. «Наставление» передаёт широкий смысл Божьего поучения, не ограничивая его сводом законов.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: 'Сохранён явно выраженный суффикс первого лица множественного числа: пророк говорит о «нашем Боге», даже обличая народ.'
- source_word: עַם עֲמֹרָה
  choice: народ Гоморры
  rationale: Сочетание передано как прямое обращение, естественное для русского языка и сохраняющее резкость пророческой метафоры.
theological_decisions:
- issue: Пророческое именование вождей и народа Иудеи Содомом и Гоморрой
  choice: Сохранены буквальные обращения «правители Содома» и «народ Гоморры».
  alternative: «Правители, подобные правителям Содома» и «народ, подобный народу Гоморры».
  rationale: 'В еврейском тексте сравнение не выражено отдельным словом: адресаты прямо названы именами нечестивых городов. Буквальное обращение сохраняет обличительную силу и не добавляет пояснения в основной текст.'
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. «Внимайте» несколько возвышенно, но понятно и помогает сохранить лексический параллелизм двух разных еврейских глаголов. Восклицательные знаки передают силу двойного повелительного обращения.
