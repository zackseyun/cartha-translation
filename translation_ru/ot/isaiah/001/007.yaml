id: ISA.1.7
reference: Isaiah 1:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַרְצְ/כֶ֣ם שְׁמָמָ֔ה עָרֵי/כֶ֖ם שְׂרֻפ֣וֹת אֵ֑שׁ אַדְמַתְ/כֶ֗ם לְ/נֶגְדְּ/כֶם֙ זָרִים֙ אֹכְלִ֣ים אֹתָ֔/הּ וּ/שְׁמָמָ֖ה כְּ/מַהְפֵּכַ֥ת זָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/007.yaml
  text: Your land is a desolation[a]; your cities are burned with fire. Your soil—before your very eyes—strangers are devouring it, and it is a desolation[b], like an overthrow by strangers.
translation:
  language: ru
  text: Земля ваша опустошена, города ваши сожжены огнём; вашу землю прямо у вас на глазах пожирают чужеземцы. Она опустошена, словно после разгрома, учинённого чужеземцами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение можно также понять как «словно после разгрома чужеземцев»; некоторые усматривают здесь отголосок рассказа о гибели Содома.
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְצְכֶם
  choice: земля ваша
  rationale: אֶרֶץ обозначает страну или территорию; «земля ваша» естественно и достаточно широко передаёт смысл в контексте суда.
- source_word: שְׁמָמָה
  choice: опустошена
  rationale: Существительное обозначает состояние запустения и разорения. Русское краткое прилагательное естественно передаёт именную еврейскую конструкцию.
- source_word: עָרֵיכֶם
  choice: города ваши
  rationale: Прямое соответствие форме множественного числа с суффиксом второго лица множественного числа.
- source_word: שְׂרֻפוֹת אֵשׁ
  choice: сожжены огнём
  rationale: Сохраняет явное упоминание огня и выразительность еврейского оборота.
- source_word: אַדְמַתְכֶם
  choice: вашу землю
  rationale: אֲדָמָה здесь указывает на обрабатываемую почву или землю. Повтор слова «земля» по-русски звучит естественнее, чем «вашу почву пожирают», хотя частично сглаживает различие с אֶרֶץ.
- source_word: לְנֶגְדְּכֶם
  choice: прямо у вас на глазах
  rationale: Передаёт не только присутствие адресатов, но и их беспомощное наблюдение за происходящим.
- source_word: זָרִים
  choice: чужеземцы
  rationale: זָרִים обозначает посторонних, иноземных захватчиков; «чужеземцы» ясно выражает этот смысл и допускает последовательное повторение.
- source_word: אֹכְלִים אֹתָהּ
  choice: пожирают
  rationale: Буквально глагол означает «едят», но в данном контексте образно описывает уничтожение плодов и ресурсов земли; «пожирают» сохраняет метафору и её силу.
- source_word: וּשְׁמָמָה
  choice: она опустошена
  rationale: В русском добавлено местоимение-связка для ясности, при этом сохранено повторение мотива опустошения.
- source_word: כְּמַהְפֵּכַת זָרִים
  choice: словно после разгрома, учинённого чужеземцами
  rationale: Передаёт מַהְפֵּכָה как катастрофическое разрушение и понимает זָרִים как указание на его деятелей, сохраняя связь с чужеземцами в предыдущей части стиха.
theological_decisions:
- issue: Толкование כְּמַהְפֵּכַת זָרִים
  choice: словно после разгрома, учинённого чужеземцами
  alternative: словно после разгрома чужеземцев; возможен отголосок рассказа о гибели Содома
  rationale: Сжатое еврейское выражение синтаксически неоднозначно. Основной текст понимает чужеземцев как виновников разорения, что лучше всего продолжает предыдущую строку; другие возможные понимания вынесены в примечание без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Инверсия «земля ваша», «города ваши» сохраняет пророческий ритм, не создавая чрезмерно архаического звучания.
