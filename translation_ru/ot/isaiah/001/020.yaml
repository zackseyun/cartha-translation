lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз связывает угрозу с обещанием в предыдущем стихе и выражает противопоставление, сохраняя условное значение אִם.
- source_word: תְּמָאֲנוּ
  choice: вы откажетесь
  rationale: Глагол מאן обозначает сознательный отказ или нежелание; будущее совершенного вида естественно передаёт условие в русском языке.
- source_word: וּמְרִיתֶם
  choice: и восстанете
  rationale: Глагол מרה выражает непокорность и мятеж; «восстанете» передаёт активное противление, не ослабляя его до простого несогласия.
- source_word: חֶרֶב תְּאֻכְּלוּ
  choice: меч пожрёт вас
  rationale: Еврейская пассивная конструкция буквально означает «вы будете съедены мечом». Активная русская формулировка сохраняет образ меча, который пожирает людей, и словесный контраст с «вкушать блага земли» в стихе 19.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание и торжественное подтверждение угрозы; «ибо» уместно для достойного пророческого регистра.
- source_word: פִּי יְהוָה
  choice: уста Яхве
  rationale: Сохранён яркий антропоморфный образ божественного изречения, а не заменён более отвлечённым «сам Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом, поскольку в исходном тексте стоит тетраграмматон.
- source_word: דִּבֵּר
  choice: сказали
  rationale: Форма совершенного вида подчёркивает состоявшееся и непреложное изречение; множественное число согласовано с русским словом «уста».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога. «Яхве» сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Образ суда мечом
  choice: меч пожрёт вас
  alternative: вы погибнете от меча
  rationale: 'Образная формулировка исходного текста сохранена ради намеренного перевёрнутого соответствия стиху 19: послушные едят блага земли, а непокорных ест меч.'
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Образы «меч пожрёт» и «уста Яхве» сохранены ради смысловой связи и выразительности оригинала.
