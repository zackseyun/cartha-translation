id: ISA.1.9
reference: Isaiah 1:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לוּלֵי֙ יְהוָ֣ה צְבָא֔וֹת הוֹתִ֥יר לָ֛/נוּ שָׂרִ֖יד כִּ/מְעָ֑ט כִּ/סְדֹ֣ם הָיִ֔ינוּ לַ/עֲמֹרָ֖ה דָּמִֽינוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/009.yaml
  text: If Yahweh of hosts had not left us a very small remnant[a], we would have become like Sodom; we would have resembled Gomorrah.
translation:
  language: ru
  text: Если бы Яхве Воинств не оставил нам совсем малого остатка[a], мы стали бы как Содом, уподобились бы Гоморре.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не сохранил для нас немногих уцелевших».'
    reason: 'Лексическая альтернатива: הוֹתִיר может означать «сохранить, оставить в живых», а собирательное שָׂרִיד вместе с כִּמְעָט — «немногие уцелевшие».'
lexical_decisions:
- source_word: לוּלֵי
  choice: Если бы ... не
  rationale: Передаёт нереальное условие в прошлом и естественно сочетается с формами «стали бы» и «уподобились бы».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет широкий и традиционно понятный смысл титула, не ограничивая его только человеческими армиями.
- source_word: הוֹתִיר
  choice: не оставил
  rationale: Каузативная форма выражает оставление кого-либо в живых или в качестве остатка; «оставил» кратко и естественно передаёт это значение.
- source_word: שָׂרִיד
  choice: остатка
  rationale: Единственное число имеет собирательный смысл и поддерживает важный для пророческой книги образ сохранившегося остатка.
- source_word: כִּמְעָט
  choice: совсем малого
  rationale: В сочетании со словом «остаток» указывает на крайне малое число сохранившихся; вариант сохраняет отдельность слов שָׂרִיד и כִּמְעָט.
- source_word: כִּסְדֹם
  choice: как Содом
  rationale: Предлог כ выражает прямое сравнение.
- source_word: הָיִינוּ
  choice: мы стали бы
  rationale: В нереальном условии передаёт наступивший результат, а не просто статическое состояние.
- source_word: לַעֲמֹרָה
  choice: Гоморре
  rationale: Использована устоявшаяся русская форма имени; дательный падеж обусловлен глаголом «уподобиться».
- source_word: דָּמִינוּ
  choice: уподобились бы
  rationale: Сохраняет значение «стать подобными, быть похожими» и лексически отличает вторую строку параллелизма от הָיִינוּ.
theological_decisions:
- issue: Передача сочетания יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь воинств / Яхве Саваоф
  rationale: Основной текст сохраняет личное имя Яхве и смысловое значение צְבָאוֹת, не подменяя имя титулом и не оставляя второе слово без перевода.
- issue: Терминология остатка
  choice: остаток
  alternative: немногие уцелевшие
  rationale: «Остаток» непосредственно передаёт собирательное שָׂרִיד и сохраняет пророческий мотив, не уточняя сверх текста, каким именно образом эти люди уцелели.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Контрфактическая конструкция передана естественно; параллелизм сохранён различными глаголами «стали» и «уподобились». Обозначение «Воинств» написано с прописной буквы как часть божественного титула.
