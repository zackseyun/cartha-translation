id: ISA.1.26
reference: Isaiah 1:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אָשִׁ֤יבָה שֹׁפְטַ֨יִ/ךְ֙ כְּ/בָ/רִ֣אשֹׁנָ֔ה וְ/יֹעֲצַ֖יִ/ךְ כְּ/בַ/תְּחִלָּ֑ה אַחֲרֵי כֵ֗ן יִקָּ֤רֵא לָ/ךְ֙ עִ֣יר הַ/צֶּ֔דֶק קִרְיָ֖ה נֶאֱמָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/026.yaml
  text: And I will restore your judges as at the first[a], and your counselors as at the beginning. Afterward you will be called the city of righteousness, a faithful city.
translation:
  language: ru
  text: 'Я верну тебе судей, как прежде,

    и советников, как в начале.

    После этого тебя назовут

    городом праведности[a], верным городом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «городом справедливости».'
    reason: Лексема צֶדֶק может обозначать как широкую праведность, так и справедливость, особенно в общественном и судебном контексте.
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: Я верну
  rationale: Порода hифиль глагола שׁוב выражает действие «возвратить, восстановить». «Верну тебе» естественно передаёт восстановление должного руководства и сохраняет образ возвращения.
- source_word: שֹׁפְטַיִךְ
  choice: тебе судей
  rationale: שֹׁפֵט обычно означает судью; широкий смысл правителя здесь возможен, но контекст обличения несправедливости поддерживает прямое значение.
- source_word: כְּבָרִאשֹׁנָה
  choice: как прежде
  rationale: Фраза указывает на прежнее, идеальное состояние, не уточняя конкретный исторический период.
- source_word: וְיֹעֲצַיִךְ
  choice: и советников
  rationale: «Советники» ясно и естественно передаёт участников городского руководства и сохраняет параллель с судьями.
- source_word: כְּבַתְּחִלָּה
  choice: как в начале
  rationale: Передаёт временное сравнение и сохраняет параллелизм с «как прежде».
- source_word: אַחֲרֵי כֵן
  choice: После этого
  rationale: Ясный современный переход к результату обещанного восстановления.
- source_word: יִקָּרֵא לָךְ
  choice: тебя назовут
  rationale: Естественно передаёт пассивное значение нифаля и сохраняет прямое обращение к городу как к лицу женского рода.
- source_word: עִיר הַצֶּדֶק
  choice: городом праведности
  rationale: 'Именная конструкция сохраняет широкое значение צֶדֶק: правоту, нравственную верность и справедливость, а не только судебное правосудие.'
- source_word: קִרְיָה נֶאֱמָנָה
  choice: верным городом
  rationale: נֶאֱמָנָה обозначает верность и надёжность. Повтор «городом» понятен современному читателю и не вводит архаичное «град» ради передачи поэтического синонима קִרְיָה.
theological_decisions:
- issue: Значение צֶדֶק в контексте восстановления города
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет более широкий нравственный и заветный смысл слова, тогда как «справедливость» особенно подчёркивает общественно-судебную сторону. Альтернатива отмечена в сноске, чтобы не устранять подлинную смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным поэтическим ритмом. Сохранены параллелизм двух строк, персонифицированное обращение к городу и намеренный повтор слова «город».
