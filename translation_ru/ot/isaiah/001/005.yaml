  text: עַ֣ל מֶ֥ה תֻכּ֛וּ ע֖וֹד תּוֹסִ֣יפוּ סָרָ֑ה כָּל רֹ֣אשׁ לָ/חֳלִ֔י וְ/כָל לֵבָ֖ב דַּוָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/005.yaml
  text: Why should you be struck again? You continue in rebellion. The whole head is sick[a], and the whole heart is faint.
translation:
  language: ru
  text: Зачем вас ещё бить?[a] Вы продолжаете бунтовать. Вся голова больна, и всё сердце изнемогло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Куда ещё вас бить?» Еврейское выражение можно понять как вопрос о том, на какую часть тела могут прийтись новые удары, если всё тело уже поражено.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל מֶה
  choice: Зачем
  rationale: Передаёт наиболее вероятный причинный смысл риторического вопроса — «для чего, по какой причине», сохраняя при этом возможность иного, локативного понимания в сноске.
- source_word: תֻכּוּ עוֹד
  choice: вас ещё бить
  rationale: Безличная инфинитивная конструкция естественна по-русски и передаёт пассивное значение хофала от נכה вместе со значением дальнейшего или повторного наказания у עוֹד.
- source_word: תּוֹסִיפוּ סָרָה
  choice: Вы продолжаете бунтовать
  rationale: Сочетание формы יסף с существительным סָרָה идиоматически обозначает продолжение мятежного отступления. Глагол «бунтовать» ясно и естественно передаёт активное сопротивление, не вводя узкоконфессиональной терминологии.
- source_word: כָּל רֹאשׁ לָחֳלִי
  choice: Вся голова больна
  rationale: Сохранён образ единого тела и значение состояния болезни; כָּל перед собирательным единственным числом передано как «вся», а не «каждая».
- source_word: וְכָל לֵבָב דַּוָּי
  choice: и всё сердце изнемогло
  rationale: Сохранён параллелизм с «вся голова». «Изнемогло» передаёт болезненную слабость и внутренний упадок, не повторяя слово «больна».
theological_decisions:
- issue: Смысл начального риторического вопроса
  choice: Вопрос о бессмысленности дальнейших ударов, поскольку народ продолжает бунтовать
  alternative: Вопрос о том, по какой части уже полностью поражённого тела ещё можно ударить
  rationale: עַל מֶה обычно допускает причинное «зачем / за что» и в данном синтаксическом контексте естественнее читается как риторический вопрос. Однако последующий образ всего больного тела поддерживает реальную локативную возможность, поэтому она сохранена в сноске.
- issue: Синтаксический статус תּוֹסִיפוּ סָרָה
  choice: 'Отдельное повествовательное предложение: «Вы продолжаете бунтовать»'
  alternative: 'Продолжение вопроса: «Почему вы продолжаете бунтовать?»'
  rationale: В еврейском тексте нет второго вопросительного показателя; естественнее понимать эту часть как утверждение, объясняющее бесплодность дальнейнего наказания.
translation_notes:
  register: Современный литературный русский язык; краткий, суровый риторический строй оригинала сохранён. Образ народа как единого больного тела не разъясняется внутри текста и не заменяется отвлечёнными формулировками.
