base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/012.yaml
  text: 'When you come to appear before me[a], who has required this from your hand: trampling my courts?'
translation:
  language: ru
  text: Когда вы приходите предстать предо Мной[a], кто требовал от вас топтать Мои дворы?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидеть Моё лицо»; это выражение означает явиться в присутствие Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: Когда вы приходите
  rationale: כִּי здесь естественно вводит обстоятельство, при котором звучит обличение, а תָבֹאוּ означает приход в святилище.
- source_word: לֵרָאוֹת פָּנָי
  choice: чтобы предстать предо Мной
  rationale: Буквально выражение означает «увидеть Моё лицо», но в культовом контексте служит идиомой явления в присутствие Бога. Русское «предстать предо Мной» передаёт этот смысл естественно и достойно.
- source_word: מִי בִקֵּשׁ זֹאת מִיֶּדְכֶם
  choice: кто требует от вас этого
  rationale: Риторический вопрос отрицает, что Бог требовал подобного поклонения. Настоящее время сохраняет прямоту еврейской глагольной формы; מִיֶּדְכֶם передано естественным русским «от вас», поскольку буквальное «из вашей руки» здесь было бы неясно.
- source_word: רְמֹס חֲצֵרָי
  choice: топтать Мои дворы
  rationale: Инфинитив поясняет, в чём состоит осуждаемое действие; «дворы» обозначают дворы храмового комплекса, а «топтать» сохраняет уничижительную образность המקור.
theological_decisions:
- issue: Культовая идиома לֵרָאוֹת פָּנָי
  choice: предстать предо Мной
  alternative: увидеть Моё лицо
  rationale: Выбранный вариант передаёт явление поклоняющихся в Божье присутствие и не создаёт впечатления, будто речь непременно идёт о физическом лицезрении Бога. Буквальная форма сохранена в примечании.
- issue: Связь רְמֹס חֲצֵרָי с риторическим вопросом
  choice: 'пояснение после тире: «топтать Мои дворы?»'
  alternative: самостоятельное повеление или отдельный вопрос
  rationale: 'Инфинитив естественно раскрывает содержание указательного «этого»: Бог обличает их посещение дворов как попрание, а не санкционирует действие.'
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для пророческой речи. Форма «предо Мной» выбрана ради естественного библейского достоинства без излишней архаизации; прописные местоимения относятся к Богу. Тире яснее русского двоеточия связывает «этого» с поясняющим инфинитивом.
