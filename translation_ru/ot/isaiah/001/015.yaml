  text: וּ/בְ/פָרִשְׂ/כֶ֣ם כַּפֵּי/כֶ֗ם אַעְלִ֤ים עֵינַ/י֙ מִ/כֶּ֔ם גַּ֛ם כִּֽי תַרְבּ֥וּ תְפִלָּ֖ה אֵינֶ֣/נִּי שֹׁמֵ֑עַ יְדֵי/כֶ֖ם דָּמִ֥ים מָלֵֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/015.yaml
  text: And when you spread out your palms[a], I hide my eyes from you; even though you multiply prayers, I am not listening[c][b]. Your hands are full of blood.
translation:
  language: ru
  text: И когда вы простираете ладони[a], Я отвожу от вас Свой взгляд; даже когда вы умножаете молитвы, Я не слушаю[b]. Ваши руки полны крови[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «руки». В еврейском тексте буквально сказано «ладони», что вызывает образ простёртых или поднятых в молитве рук.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я не слышу»; возможно также: «Я не стану слушать». Здесь выражение передаёт продолжающийся отказ Бога внимать их молитвам.'
    reason: lexical_alternative
  - marker: c
    text: «Кровь» здесь может означать также кровопролитие или вину за пролитую кровь.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְפָרִשְׂכֶם
  choice: И когда вы простираете
  rationale: Сочетание союза и предлога с инфинитивом имеет временное значение. «Простираете» естественно описывает молитвенный жест и сохраняет образ исходного текста.
- source_word: כַּפֵּיכֶם
  choice: ладони
  rationale: כַּף обозначает именно ладонь, а не руку вообще. Такой перевод сохраняет конкретный образ раскрытых или поднятых в молитве ладоней.
- source_word: אַעְלִים עֵינַי מִכֶּם
  choice: Я закрываю от вас глаза
  rationale: Сохранён конкретный антропоморфный образ намеренного отказа Бога смотреть на молящихся; настоящее время соответствует продолжающемуся отказу в данном пророческом обвинении.
- source_word: גַּם כִּי
  choice: даже если
  rationale: 'Сочетание вводит уступку: множество молитв не меняет Божьего отказа их принимать.'
- source_word: תַרְבּוּ תְפִלָּה
  choice: вы умножаете молитвы
  rationale: Перевод сохраняет выраженную глаголом רבה идею увеличения количества молитв. Множественное число по-русски естественно передаёт собирательное значение еврейского существительного в единственном числе.
- source_word: אֵינֶנִּי שֹׁמֵעַ
  choice: Я не слушаю
  rationale: Отрицание с причастием выражает продолжающийся и намеренный отказ внимать молитвам, а не неспособность физически услышать.
- source_word: יְדֵיכֶם
  choice: Ваши руки
  rationale: Здесь употреблено обычное слово «руки», отличное от стоящего ранее слова «ладони»; различие сохранено, чтобы подчеркнуть переход от молитвенного жеста к нравственной вине.
- source_word: דָּמִים
  choice: крови
  rationale: Форма множественного числа может указывать на кровопролитие или вину за него. Русское выражение «руки полны крови» остаётся сильным и сохраняет широту смысла.
- source_word: מָלֵאוּ
  choice: полны
  rationale: Перфект описывает наличное состояние как результат прежних действий; краткое прилагательное естественно передаёт это состояние по-русски.
theological_decisions:
- issue: Антропоморфное описание Божьего отказа принимать поклонение
  choice: Сохранить образы «закрываю от вас глаза» и «не слушаю» без смягчения.
  alternative: «Я не обращаю на вас внимания» или «Я отвергаю ваши молитвы».
  rationale: Телесные образы исходного текста передают Божий сознательный отказ принимать лицемерное поклонение. Их сохранение удерживает пророческую резкость и не требует конфессионального истолкования.
- issue: Значение דָּמִים
  choice: В основном тексте оставить «крови», а возможные значения пояснить в сноске.
  alternative: «кровопролития» или «вины за пролитую кровь».
  rationale: Еврейская форма допускает взаимосвязанные оттенки крови, кровопролития и кровной вины; выбор одного из них в основном тексте неоправданно устранил бы смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конкретные образы ладоней, глаз, слушания и окровавленных рук сохранены; синтаксис сделан ясным для обычного современного читателя без конфессиональной конкретизации.
