base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/003.yaml
  text: An ox knows its owner[a], and a donkey its master's feeding trough; Israel does not know[b]; my people do not understand.
translation:
  language: ru
  text: Вол знает своего хозяина, и осёл — кормушку своего владельца[a]; Израиль не знает[b], мой народ не понимает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ясли».'
    reason: lexical_alternative
  - marker: b
    text: По смыслу подразумевается, что Израиль не знает Господа, хотя в еврейском тексте объект не назван.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַע
  choice: знает
  rationale: Сохраняет прямое когнитивно-отношенческое значение и лексический повтор во второй половине стиха.
- source_word: שׁוֹר
  choice: вол
  rationale: Точное и привычное русское обозначение рабочего домашнего быка, уместное в данном сравнении.
- source_word: קֹנֵהוּ
  choice: своего хозяина
  rationale: Причастие от קנה обозначает того, кто приобрёл животное и владеет им; «хозяин» естественно звучит в контексте домашнего животного.
- source_word: חֲמוֹר
  choice: осёл
  rationale: Современное общеупотребительное обозначение животного.
- source_word: אֵבוּס
  choice: кормушку
  rationale: Ясно передаёт место, откуда кормят животное, и не вносит посторонних ассоциаций, возможных у традиционного слова «ясли».
- source_word: בְּעָלָיו
  choice: своего владельца
  rationale: Передаёт значение обладания; выбор слова «владелец» также сохраняет различие формулировок между двумя параллельными строками.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено имя народа, прямо противопоставленного домашним животным.
- source_word: לֹא יָדַע
  choice: не знает
  rationale: Повтор глагола «знать» сохраняет риторический контраст оригинала; объект, как и в еврейском тексте, не добавлен.
- source_word: עַמִּי
  choice: народ Мой
  rationale: Передаёт форму с притяжательным суффиксом и патетическую силу Божьего обращения; прописная буква соответствует русской библейской издательской традиции.
- source_word: הִתְבּוֹנָן
  choice: не разумеет
  rationale: Передаёт вдумчивое понимание и распознание; «разуметь» звучит достойно и остаётся понятным современному читателю.
theological_decisions:
- issue: Неуказанный объект того, кого Израиль не знает
  choice: 'Оставить объект невыраженным: «Израиль не знает»'
  alternative: «Израиль не знает Меня/Бога»
  rationale: Контекст подразумевает Господа, однако в еврейском тексте объект отсутствует. Основной текст сохраняет лаконичность и богословское напряжение оригинала, а подразумеваемый смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический эллипсис после «осёл» сохраняет сжатый параллелизм оригинала; точка с запятой подчёркивает контраст между животными и Израилем.
