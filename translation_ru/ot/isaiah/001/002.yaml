  text: שִׁמְע֤וּ שָׁמַ֨יִם֙ וְ/הַאֲזִ֣ינִי אֶ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּ֑ר בָּנִים֙ גִּדַּ֣לְתִּי וְ/רוֹמַ֔מְתִּי וְ/הֵ֖ם פָּ֥שְׁעוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/002.yaml
  text: 'Hear[a], O heavens, and give ear, O earth, for Yahweh has spoken: “I have reared children and brought them up[b], but they have rebelled against me.”'
translation:
  language: ru
  text: 'Слушайте, небеса, и внимай, земля, ибо Яхве сказал: «Я вырастил детей[a] и возвысил их[b], но они восстали против Меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сыновей». Еврейское слово имеет форму мужского рода, но здесь собирательно обозначает народ как детей Яхве.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поднял их», «сделал их великими». Этот глагол означает поднять, возвысить или оказать честь; в сочетании с предыдущим глаголом он также может усиливать образ взращивания детей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения во множественном числе призывает небеса внимательно слушать; современное «слушайте» сохраняет торжественный пророческий тон.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: В паре с землёй слово обозначает небеса как призываемого космического свидетеля.
- source_word: הַאֲזִינִי
  choice: внимай
  rationale: Повелительная форма единственного числа согласована с «земля» и передаёт усиленный призыв прислушаться, сохраняя поэтический параллелизм.
- source_word: אֶרֶץ
  choice: земля
  rationale: Пара «небеса — земля» указывает на весь сотворённый мир, а не только на страну Израиля.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, без замены титулом.
- source_word: דִּבֵּר
  choice: сказал
  rationale: Перфект вводит последующее прямое высказывание как уже произнесённое авторитетное слово.
- source_word: בָּנִים
  choice: детей
  rationale: Хотя еврейская форма грамматически мужского рода и может означать «сыновей», здесь она собирательно обозначает народ как детей Яхве.
- source_word: גִּדַּלְתִּי
  choice: Я вырастил
  rationale: В родительском образе глагол естественно передаёт воспитание и взращивание детей.
- source_word: רוֹמַמְתִּי
  choice: возвысил их
  rationale: Сохраняет самостоятельный смысл второго глагола — поднять, возвеличить или почтить, — не сводя его к повторному указанию на воспитание.
- source_word: פָּשְׁעוּ בִי
  choice: восстали против Меня
  rationale: Сочетание обозначает мятеж против законной власти и передаёт как личную, так и заветную сторону измены.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Собирательное значение בָּנִים
  choice: детей
  alternative: сыновей
  rationale: Обращение относится ко всему народу, поэтому «детей» точно сохраняет образ родства, не ограничивая его мужчинами.
- issue: Соотношение глаголов גִּדַּלְתִּי и רוֹמַמְתִּי
  choice: вырастил и возвысил
  alternative: вырастил и воспитал; взрастил и поднял
  rationale: Выбранная пара сохраняет различие между взращиванием и последующим возвышением, не устраняя возможный оттенок почёта или высокого положения во втором глаголе.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Различие между множественным «слушайте» при «небеса» и единственным «внимай» при «земля» сохранено. Прямая речь оформлена естественно для русского синтаксиса.
