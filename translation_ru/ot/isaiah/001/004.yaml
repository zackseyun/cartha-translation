  text: ה֣וֹי גּ֣וֹי חֹטֵ֗א עַ֚ם כֶּ֣בֶד עָוֺ֔ן זֶ֣רַע מְרֵעִ֔ים בָּנִ֖ים מַשְׁחִיתִ֑ים עָזְב֣וּ אֶת יְהוָ֗ה נִֽאֲצ֛וּ אֶת קְד֥וֹשׁ יִשְׂרָאֵ֖ל נָזֹ֥רוּ אָחֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/004.yaml
  text: Ah[a], sinful nation, a people heavy with iniquity, offspring of evildoers[b], children who act corruptly! They have forsaken Yahweh; they have despised the Holy One of Israel[e][d][c]; they have turned backward.
translation:
  language: ru
  text: Ах[a], народ грешный, народ, отягчённый беззаконием[b], потомство злодеев, дети, поступающие развращённо[c]! Они оставили Яхве[d], презрели Святого Израиля, отступили вспять[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Увы»; или: «Горе». Еврейское междометие выражает и скорбь, и обличительное провозглашение бедствия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тяжёлый беззаконием»; возможно также: «обременённый виной».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «дети, поступающие губительно»; возможен и более буквальный оттенок: «дети, губящие».'
    reason: lexical_alternative
  - marker: d
    text: Яхве — передача еврейского божественного имени יהוה, традиционно заменяемого в переводах словом «Господь».
    reason: alternative_reading
  - marker: e
    text: 'Или: «отчуждились и удалились назад»; возможна идиоматическая передача: «повернулись спиной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: О
  rationale: Русское междометие «О» сохраняет возглас и не сводит его однозначно ни к скорбному «увы», ни к провозглашению бедствия «горе».
- source_word: גּוֹי חֹטֵא
  choice: народ грешный
  rationale: Причастие חֹטֵא имеет здесь определительное значение; порядок слов придаёт выражению торжественное пророческое звучание без архаической непонятности.
- source_word: עַם כֶּבֶד עָוֺן
  choice: народ, отягчённый беззаконием
  rationale: Передаёт образ тяжести в כֶּבֶד и сохраняет в עָוֺן сочетание смысла преступления и вины.
- source_word: זֶרַע מְרֵעִים
  choice: потомство злодеев
  rationale: זֶרַע обозначает собирательное потомство; перевод сохраняет семейно-корпоративный образ обвинения.
- source_word: בָּנִים מַשְׁחִיתִים
  choice: дети, поступающие пагубно
  rationale: Формулировка передаёт деятельный, причиняющий порчу оттенок Hiphil от שׁחת, не ограничивая его буквальным физическим разрушением.
- source_word: עָזְבוּ אֶת יְהוָה
  choice: оставили Яхве
  rationale: עָזַב означает оставить или покинуть; в контексте это выражение заветной неверности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом «Господь».
- source_word: נִאֲצוּ
  choice: презрели
  rationale: Глагол выражает презрительное отвержение; «презрели» кратко и сильно передаёт это отношение.
- source_word: קְדֹושׁ יִשְׂרָאֵל
  choice: Святого Израилева
  rationale: Сохранён устойчивый для книги Исаии божественный титул; форма «Израилева» естественна в возвышенной русской библейской речи.
- source_word: נָזֹרוּ אָחוֹר
  choice: отступили назад
  rationale: Перевод сохраняет образ движения назад, тогда как форма נָזֹרוּ может также подчёркивать отчуждение или удаление.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя יהוה; транслитерация сохраняет его как личное заветное имя, не подменяя титулом.
- issue: Корпоративные и семейные образы обвинения
  choice: Сохранить последовательность «народ — народ — потомство — дети»
  alternative: Сгладить ряд до одного обозначения народа
  rationale: Наслоение общественных и семейных обозначений усиливает обвинение Израиля и важно для заветного напряжения текста.
- issue: Характер последней фразы נָזֹרוּ אָחוֹר
  choice: отступили назад
  alternative: отчуждились и удалились / повернулись спиной
  rationale: Основной текст сохраняет пространственный образ, а примечание отмечает возможный смысл отчуждения, не разрешая неоднозначность без достаточных оснований.
translation_notes:
  register: Современный литературный русский с возвышенным пророческим ритмом. Синтаксический параллелизм и повтор «народ» сохранены намеренно; редкая, но понятная форма «Святого Израилева» поддерживает достоинство устойчивого титула. Архаизмы, затрудняющие понимание, не используются.
