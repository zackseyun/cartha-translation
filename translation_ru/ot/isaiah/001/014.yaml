source:
  edition: WLC
  text: חָדְשֵׁי/כֶ֤ם וּ/מוֹעֲדֵי/כֶם֙ שָׂנְאָ֣ה נַפְשִׁ֔/י הָי֥וּ עָלַ֖/י לָ/טֹ֑רַח נִלְאֵ֖יתִי נְשֹֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/014.yaml
  text: Your new moons and your appointed feasts my soul hates[a]; they have become a burden to me; I am weary of bearing them.
translation:
  language: ru
  text: Ваши новолуния и установленные праздники[a] ненавидит Моя душа. Они стали для Меня бременем; Я устал нести их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначенные времена»; или: «празднества».'
    reason: Лексема מוֹעֵד в данном культовом контексте может означать установленное время или праздник.
lexical_decisions:
- source_word: חָדְשֵׁיכֶם
  choice: ваши новолуния
  rationale: חֹדֶשׁ буквально обозначает новолуние и по контексту также связанное с ним ежемесячное религиозное празднование. «Новолуния» сохраняет образ и культовое значение исходного выражения без избыточного пояснения.
- source_word: וּמוֹעֲדֵיכֶם
  choice: и назначенные праздники
  rationale: מוֹעֵד может обозначать назначенное время или собрание, а здесь относится к установленным религиозным праздникам Израиля. Перевод сохраняет как идею назначенного срока, так и праздничный контекст.
- source_word: שָׂנְאָה נַפְשִׁי
  choice: ненавидит Моя душа
  rationale: В еврейском тексте подлежащим является נֶפֶשׁ, «Моя душа». Сохранение этой конструкции передаёт подчеркнуто личное и глубокое отвращение, не ослабляя её до простого «Я ненавижу».
- source_word: הָיוּ עָלַי לָטֹרַח
  choice: они стали для Меня бременем
  rationale: 'Форма глагола выражает наступившее состояние: эти празднования сделались бременем для Бога. «Стали для Меня бременем» естественно передаёт и результат, и личную направленность выражения.'
- source_word: טֹרַח
  choice: бремя
  rationale: טֹרַח означает бремя, тяготу или обременительный труд. «Бремя» поддерживает образ ноши, продолженный следующим глаголом «нести».
- source_word: נִלְאֵיתִי
  choice: Я устал
  rationale: Глагол выражает утомление и изнеможение. «Я устал» звучит естественно, прямо и достойно в современной русской речи.
- source_word: נְשֹׂא
  choice: нести их
  rationale: Инфинитив от נָשָׂא означает «нести, переносить». Местоимение «их» восстановлено из контекста и сохраняет метафору тяжёлой ноши.
theological_decisions:
- issue: Божественное отвращение к богослужебным практикам Израиля
  choice: Сохранено притяжательное «ваши», указывающее в контексте на отчуждённый и испорченный характер совершаемых обрядов, при этом неприятие выражено с полной силой.
  alternative: Формулировка, из которой следовало бы, что Бог отвергает установленные праздники сами по себе.
  rationale: Текст резко отвергает богослужение адресатов, но не утверждает прямо, что установленные времена изначально не были даны Богом. Перевод не снимает напряжения и не добавляет конфессионального истолкования.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Инверсия «ненавидит Моя душа» слегка возвышенна, но понятна и позволяет сохранить эмфатическую еврейскую конструкцию; метафорическая связь между «бременем» и «нести» сохранена.
