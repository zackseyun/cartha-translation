id: ISA.1.11
reference: Isaiah 1:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/מָּה לִּ֤/י רֹב זִבְחֵי/כֶם֙ יֹאמַ֣ר יְהוָ֔ה שָׂבַ֛עְתִּי עֹל֥וֹת אֵילִ֖ים וְ/חֵ֣לֶב מְרִיאִ֑ים וְ/דַ֨ם פָּרִ֧ים וּ/כְבָשִׂ֛ים וְ/עַתּוּדִ֖ים לֹ֥א חָפָֽצְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/011.yaml
  text: Why are your many sacrifices to me? says Yahweh[a]. I have had enough of burnt offerings of rams and the fat of fattened animals[b]; and in the blood of bulls and lambs and goats I do not delight.
translation:
  language: ru
  text: «К чему Мне множество ваших жертв? — говорит Яхве.[a] — Я пресыщен всесожжениями баранов и жиром откормленного скота; крови быков, ягнят[b] и козлов Я не желаю».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Зачем Мне множество ваших жертв?» Буквально еврейское выражение соединяет «зачем (почему)?» и «Мне».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «овец». Еврейское слово может обозначать как ягнят, так и овец шире.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה לִּי
  choice: К чему Мне
  rationale: Сочетание вопросительного לָמָּה («зачем, почему») с לִי («Мне») риторически ставит под сомнение пользу и назначение жертв для Яхве. «К чему Мне» естественно передаёт эту силу, не сводя выражение лишь к вопросу о потребности.
- source_word: רֹב זִבְחֵיכֶם
  choice: множество ваших жертв
  rationale: רֹב обозначает множество или изобилие, а זִבְחֵיכֶם — приносимые адресатами жертвы. Формулировка сохраняет количественный акцент еврейского текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: שָׂבַעְתִּי
  choice: Я пресыщен
  rationale: Глагол означает насыщение до полноты и в данном обличительном контексте выражает неприятие избытка; «пресыщен» сохраняет образ насыщения и подходит литературному регистру.
- source_word: עֹלוֹת אֵילִים
  choice: всесожжениями баранов
  rationale: עֹלוֹת — жертвы, целиком сжигаемые на жертвеннике; традиционный и точный русский термин — «всесожжения». אֵילִים означает взрослых самцов овец, то есть баранов.
- source_word: חֵלֶב מְרִיאִים
  choice: жиром откормленного скота
  rationale: חֵלֶב — жировая часть жертвы, а מְרִיאִים — откормленные животные. Собирательное «скот» передаёт неопределённую категорию животных без искусственного уточнения вида.
- source_word: פָּרִים וּכְבָשִׂים וְעַתּוּדִים
  choice: быков, ягнят и козлов
  rationale: Названия переданы конкретно и наглядно. כְבָשִׂים допускает значение «ягнята» или шире «овцы», поэтому альтернативу отмечает сноска; עַתּוּדִים конкретно обозначает козлов.
- source_word: לֹא חָפָצְתִּי
  choice: Я не желаю
  rationale: חפץ может выражать желание, благоволение или удовольствие. «Не желаю» сохраняет волевой смысл и не добавляет объяснения причин Божьего неприятия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя יְהוָה. Транслитерация «Яхве» позволяет отличить его от титула אֲדֹנָי и не скрывает имя за заменой.
- issue: Характер Божьего неприятия жертв
  choice: Я пресыщен… Я не желаю
  alternative: Мне отвратительны… Я не нахожу удовольствия
  rationale: Перевод сохраняет два образа исходного текста — насыщение и отсутствие желания или благоволения — не превращая стих в более широкое богословское утверждение о жертвоприношениях вообще.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены риторический вопрос, резкая смена на прямую речь Бога и культовые термины; избегнуты как архаическая тяжеловесность, так и разговорные выражения вроде «сыт по горло».
