  yaml_path: translation/ot/isaiah/001/028.yaml
  text: But rebels and sinners will be broken together[b][a], and those who forsake Yahweh will come to an end.
translation:
  language: ru
  text: Но мятежников и грешников вместе постигнет сокрушение[a], а те, кто оставил Яхве, погибнут[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мятежники и грешники будут сокрушены вместе»; еврейское слово можно понимать как «сокрушение», «разрушение» или «гибель».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «исчезнут», «истребятся» или «придут к концу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבֶר
  choice: постигнет сокрушение
  rationale: Еврейское существительное означает «сокрушение, разрушение, гибель». Именная передача сохраняет форму и образность исходного текста, оставаясь естественной по-русски.
- source_word: פֹּשְׁעִים
  choice: мятежников
  rationale: Слово обозначает тех, кто сознательно восстаёт и нарушает верность; «мятежники» передаёт оттенок открытого неповиновения.
- source_word: חַטָּאִים
  choice: грешников
  rationale: Обычное обозначение людей, характеризуемых грехом; сохраняет отличие от стоящего рядом слова со значением мятежа.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Передаёт общность или одновременность их участи без добавочного толкования.
- source_word: עֹזְבֵי יְהוָה
  choice: оставившие Яхве
  rationale: Причастная конструкция обозначает тех, кто покинул или оставил Яхве; совершенный вид по-русски естественно выражает состоявшийся разрыв верности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом.
- source_word: יִכְלוּ
  choice: погибнут
  rationale: Глагол может означать «закончиться, исчезнуть, быть истреблённым». В контексте суда «погибнут» ясно и естественно передаёт итог, а более буквальные варианты отмечены в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер участи мятежников и грешников
  choice: постигнет сокрушение
  alternative: будут сокрушены; гибель мятежникам и грешникам
  rationale: Именная конструкция сохраняет неоднозначность еврейского שֶׁבֶר между процессом сокрушения и итоговым разрушением, не уточняя способ суда.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Слова «мятежники» и «грешники» сохраняют смысловое различие исходной пары; имя «Яхве» передано прямо.
