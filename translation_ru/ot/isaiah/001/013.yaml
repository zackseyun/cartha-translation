source:
  edition: WLC
  text: לֹ֣א תוֹסִ֗יפוּ הָבִיא֙ מִנְחַת שָׁ֔וְא קְטֹ֧רֶת תּוֹעֵבָ֛ה הִ֖יא לִ֑/י חֹ֤דֶשׁ וְ/שַׁבָּת֙ קְרֹ֣א מִקְרָ֔א לֹא אוּכַ֥ל אָ֖וֶן וַ/עֲצָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/013.yaml
  text: Do not continue bringing worthless grain offerings[a]; incense is an abomination to me. New moon and Sabbath[b], the calling of an assembly—I cannot endure iniquity and solemn assembly.
translation:
  language: ru
  text: Не продолжайте приносить тщетные хлебные приношения[a]; воскурение — мерзость для Меня. Новомесячие и суббота, созыв собрания — не могу терпеть беззаконие и торжественное собрание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пустых хлебных приношений»; слово, переведенное как «тщетных», может выражать пустоту, тщетность или никчемность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не могу терпеть беззакония вместе с торжественным собранием». Еврейская фраза предельно кратка и может подчеркивать несовместимость зла с богослужебным собранием. Слово, переведенное как «беззаконие», может также означать «зло» или «бедствие».'
    reason: alternative_reading
lexical_decisions:
- source_word: תוֹסִיפוּ הָבִיא
  choice: не приносите больше
  rationale: Конструкция יסף с инфинитивом выражает продолжение или повторение действия; русский запрет естественно передаёт её итеративный смысл.
- source_word: מִנְחַת שָׁוְא
  choice: пустых хлебных приношений
  rationale: מִנְחָה в культовом контексте обозначает хлебное, обычно зерновое, приношение, а שָׁוְא — пустоту, тщетность и никчёмность. «Пустых» сохраняет образ внутренне бессодержательного богослужения.
- source_word: קְטֹרֶת
  choice: курение
  rationale: Слово обозначает благовонное курение; традиционный русский библейский термин здесь точен и понятен по культовому контексту.
- source_word: תּוֹעֵבָה הִיא לִי
  choice: отвратительно Мне
  rationale: Передаёт сильную нравственно-религиозную оценку תּוֹעֵבָה естественным современным русским языком, не ослабляя её.
- source_word: חֹדֶשׁ
  choice: новомесячие
  rationale: В данном календарно-культовом контексте речь идёт не просто о новой луне, а о праздновании новомесячия.
- source_word: שַׁבָּת
  choice: суббота
  rationale: Обычное и точное обозначение установленного дня покоя и богослужения.
- source_word: קְרֹא מִקְרָא
  choice: созыв собрания
  rationale: Передаёт сочетание глагола и однокоренного существительного, сохраняя сжатость еврейского выражения.
- source_word: לֹא אוּכַל
  choice: не могу терпеть
  rationale: Хотя буквально выражение означает неспособность, в контексте оно идиоматически указывает на непереносимость.
- source_word: אָוֶן
  choice: беззаконие
  rationale: Слово может обозначать зло, нечестие, бедствие или тщету; здесь нравственный контекст делает «беззаконие» уместным, но многозначность отмечена в сноске.
- source_word: וַעֲצָרָה
  choice: и торжественное собрание
  rationale: עֲצָרָה обозначает особое праздничное или священное собрание; «торжественное собрание» сохраняет культовый характер выражения.
theological_decisions:
- issue: Связь греховного поведения и богослужения в заключительной фразе
  choice: не могу терпеть беззаконие и торжественное собрание
  alternative: не могу терпеть беззакония вместе с торжественным собранием
  rationale: Еврейский текст кратко ставит אָוֶן и עֲצָרָה рядом, соединяя их союзом без явного предлога. Координативный перевод сохраняет синтаксическую резкость и богословское напряжение, а вероятное понимание совместимости зла с собранием вынесено в сноску.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены краткость, резкость перечисления и неоднозначность заключительной фразы; культовые термины переданы узнаваемо, без конфессионального уточнения.
