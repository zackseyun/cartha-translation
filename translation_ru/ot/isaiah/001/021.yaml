base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/021.yaml
  text: How the faithful city has become a prostitute! She was full of justice[a]; righteousness lodged in her[c][b], but now murderers.
translation:
  language: ru
  text: Как верный город стал блудницей![a] Он был полон правосудия; праведность находила в нём ночлег,[b] а теперь — убийцы.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово обозначает проститутку; здесь это метафора неверности и разложения города.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «праведность находила в нём ночлег»; глагол рисует её как обычно пребывающую в городе. Слово «праведность» можно также передать как «справедливость».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте фраза предельно кратка: «а теперь — убийцы»; глагол подразумевается.'
    reason: clarification
lexical_decisions:
- source_word: אֵיכָה
  choice: Как
  rationale: Вводит не вопрос, а скорбное восклицание о поразительной перемене; «как» сохраняет пророческую интонацию плача.
- source_word: הָיְתָה לְזוֹנָה
  choice: стал блудницей
  rationale: Передаёт завершившуюся перемену состояния и сохраняет резкую метафору неверности и нравственного разложения. «Блудница» соответствует возвышенному, но понятному библейскому регистру.
- source_word: קִרְיָה נֶאֱמָנָה
  choice: верный город
  rationale: Сохраняет характеристику города как прежде верного и надёжного; контраст с «блудницей» остаётся явным.
- source_word: מְלֵאֲתִי מִשְׁפָּט
  choice: Он был полон правосудия
  rationale: מִשְׁפָּט здесь обозначает справедливый общественный и судебный порядок. Местоимение согласовано с русским словом «город».
- source_word: צֶדֶק
  choice: праведность
  rationale: Сохраняет этический оттенок и позволяет отличить צֶדֶק от стоящего рядом מִשְׁפָּט, хотя их значения частично пересекаются.
- source_word: יָלִין בָּהּ
  choice: ночевала в нём
  rationale: Глагол буквально связан с ночлегом; такой перевод сохраняет яркий образ праведности, постоянно находившей приют в городе.
- source_word: וְעַתָּה מְרַצְּחִים
  choice: а теперь — убийцы
  rationale: «А теперь» выражает резкий контраст, а именная конструкция без добавленного глагола сохраняет лаконичный пророческий удар оригинала.
theological_decisions:
- issue: Сексуальная метафора неверности Иерусалима
  choice: 'Сохранить прямой образ: «стал блудницей»'
  alternative: «стал неверным» или «стал подобен блуднице»
  rationale: Еврейский текст прямо и резко изображает нравственную и заветную неверность города; абстрактная передача неоправданно смягчила бы пророческое обличение.
- issue: Соотношение מִשְׁפָּט и צֶדֶק
  choice: Передать как «правосудие» и «праведность»
  alternative: Передать оба понятия через «справедливость»
  rationale: 'Различение сохраняет параллельные, частично перекрывающиеся понятия: справедливый порядок и нравственную правоту, не отрицая их смысловой близости.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены резкая метафора, олицетворение города, образ ночлега и эллиптическая концовка. Архаические обороты не используются; «блудница» выбрана как понятное слово высокого библейского регистра.
