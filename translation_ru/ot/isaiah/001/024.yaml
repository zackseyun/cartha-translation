id: ISA.1.24
reference: Isaiah 1:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻ֤ם הָֽ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת אֲבִ֖יר יִשְׂרָאֵ֑ל ה֚וֹי אֶנָּחֵ֣ם מִ/צָּרַ֔/י וְ/אִנָּקְמָ֖ה מֵ/אוֹיְבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/024.yaml
  text: 'Therefore the declaration of the Lord[a], Yahweh of Armies, the Mighty One of Israel: “Ah[c][b], I will get relief from my foes and avenge myself on my enemies.”'
translation:
  language: ru
  text: 'Поэтому — изречение Владыки, Яхве Воинств, Могучего Израиля: «Ах, Я найду облегчение от моих противников и отомщу моим врагам!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и переход к следствию из предшествующего обличения.
- source_word: נְאֻם
  choice: слово
  rationale: Устойчивая пророческая формула торжественного Божьего изречения; «слово» естественно и понятно по-русски, тогда как «оракул» звучит технически и двусмысленно.
- source_word: הָאָדוֹן
  choice: Владыки
  rationale: Передаёт определённый титул, подчёркивающий верховную власть Бога, и позволяет отличить его от личного имени Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени Бога сохраняет различие между ним и предшествующим титулом הָאָדוֹן.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Традиционное и всё ещё понятное русское обозначение совокупности небесных или военных сил; сохраняет широту еврейского множественного числа и не уточняет референт сверх исходного текста.
- source_word: אֲבִיר יִשְׂרָאֵל
  choice: Могучего Бога Израиля
  rationale: Передаёт титул силы естественным русским выражением; добавление «Бога» ясно обозначает носителя титула в цепочке божественных наименований.
- source_word: הוֹי
  choice: О
  rationale: Сохраняет эмоциональное междометие, не сводя его однозначно ни к скорби, ни к насмешке.
- source_word: אֶנָּחֵם
  choice: Я найду облегчение
  rationale: В породе нифаль глагол здесь выражает облегчение или удовлетворение, обретаемое через действие против врагов; перевод не сливает его со следующим глаголом мести.
- source_word: מִצָּרַי
  choice: от моих противников
  rationale: Предлог מן при נחם естественно передан как источник избавления или облегчения; «противники» точно и литературно передаёт צרים.
- source_word: וְאִנָּקְמָה
  choice: и отомщу
  rationale: Передаёт решительную волю к воздаянию; русская возвратная конструкция «отомщу» естественно выражает действие от первого лица без искусственного «отомщу за себя».
- source_word: מֵאוֹיְבָי
  choice: моим врагам
  rationale: Русское управление глагола «отомстить» требует дательного падежа и естественно передаёт еврейское сочетание с מן.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст ставит рядом титул הָאָדוֹן и личное имя יְהוָה; «Яхве» сохраняет это значимое различие и избегает повторения двух одинаковых титулов.
- issue: Соотношение облегчения и возмездия
  choice: «найду облегчение… и отомщу» как два связанных, но различных действия
  alternative: «утешусь, отомстив врагам» как единое действие
  rationale: В еврейском тексте стоят два отдельных глагола. Перевод сохраняет напряжение между Божьим облегчением от противников и совершением возмездия, не смягчая и не объединяя их.
- issue: Референт צְבָאוֹת
  choice: Воинств
  alternative: небесных воинств / армий
  rationale: Исходное слово допускает широкое понимание сил или воинств. Перевод не ограничивает его только земными армиями либо только небесным воинством.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Тире после «Поэтому» обозначает присоединение формулы изречения; цепочка титулов сохранена. Междометие и параллелизм двух заключительных клауз передают эмоциональную силу и решимость оригинала.
