  yaml_path: translation/ot/isaiah/001/008.yaml
  text: And daughter Zion is left like a shelter in a vineyard[a], like a hut in a cucumber field[c][b], like a besieged city.
translation:
  language: ru
  text: И осталась дочь Сиона[a], словно шалаш в винограднике, словно хижина на огуречном поле[b], словно осаждённый город[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дочь Сиона» — поэтическое олицетворение Сиона.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на бахче» или «на поле дынь»; еврейское слово может обозначать участок с огурцами или другими бахчевыми культурами.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «словно охраняемый город»; в контексте разорения вероятнее значение «осаждённый город».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנוֹתְרָה
  choice: И осталась
  rationale: Форма нифаля передаёт состояние того, что уцелело или осталось после опустошения. «Осталась» естественно звучит по-русски и сохраняет связь с предшествующим описанием суда.
- source_word: בַת צִיּוֹן
  choice: дочь Сиона
  rationale: Сохранено поэтическое олицетворение Сиона/Иерусалима, без замены толкованием «Иерусалим» или «жители Сиона».
- source_word: כְּסֻכָּה
  choice: словно шалаш
  rationale: סֻכָּה обозначает лёгкое временное укрытие. «Шалаш» ясно передаёт его непрочность и уместен в сельскохозяйственном окружении.
- source_word: בְכָרֶם
  choice: в винограднике
  rationale: Прямо передаёт единственное число и местное значение еврейского выражения.
- source_word: כִּמְלוּנָה
  choice: словно хижина
  rationale: מְלוּנָה — временное место ночлега или полевая хижина. «Хижина» сохраняет образ одинокого непрочного сооружения, не уточняя сверх текста его назначение.
- source_word: בְמִקְשָׁה
  choice: на огуречном поле
  rationale: מִקְשָׁה обозначает участок, где выращивают огурцы либо сходные стелющиеся бахчевые культуры. Основной текст следует распространённому конкретному пониманию, а более широкое значение отмечено в сноске.
- source_word: כְּעִיר נְצוּרָה
  choice: словно осаждённый город
  rationale: 'В данном контексте נְצוּרָה естественнее всего понимать как «осаждённый»: образ передаёт изоляцию и бедственное положение уцелевшего Сиона. Возможное понимание «охраняемый» сохранено в сноске.'
theological_decisions:
- issue: Олицетворение Сиона
  choice: дочь Сиона
  alternative: Иерусалим; жители Сиона
  rationale: Еврейский текст олицетворяет Сион как дочь. Сохранение этого образа передаёт пророческую поэтику и не сужает смысл до конкретного истолкования.
- issue: Значение נְצוּרָה
  choice: осаждённый город
  alternative: охраняемый город
  rationale: «Осаждённый» лучше соответствует контексту разорения и образам одиночества и уязвимости, однако лексическая возможность иного понимания не скрывается.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого трёхчастного поэтического сравнения. «Шалаш» и «хижина» передают временность и непрочность полевых укрытий; повтор «словно» воспроизводит ритм еврейского текста.
