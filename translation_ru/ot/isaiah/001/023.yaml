  text: שָׂרַ֣יִ/ךְ סוֹרְרִ֗ים וְ/חַבְרֵי֙ גַּנָּבִ֔ים כֻּלּ/וֹ֙ אֹהֵ֣ב שֹׁ֔חַד וְ/רֹדֵ֖ף שַׁלְמֹנִ֑ים יָתוֹם֙ לֹ֣א יִשְׁפֹּ֔טוּ וְ/רִ֥יב אַלְמָנָ֖ה לֹֽא יָב֥וֹא אֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/023.yaml
  text: Your rulers are rebels and companions of thieves[a]; every one of them loves a bribe and runs after payments. They do not defend the orphan[c][b], and the widow’s case does not come before them.
translation:
  language: ru
  text: Твои правители непокорны и дружат с ворами[a]; каждый из них любит взятки и гонится за вознаграждениями[b]. Они не защищают сироту[c], и дело вдовы до них не доходит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твои князья непокорны».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гонится за выплатами» или «за дарами»; еврейское слово может означать выплаты, вознаграждения или дары, вероятно в контексте коррупции.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не дают сироте правосудия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרַיִךְ
  choice: твои правители
  rationale: שַׂר обозначает правителя, начальника или высокопоставленного должностного лица. «Правители» естественно звучит по-русски и соответствует общественно-судебному контексту.
- source_word: סוֹרְרִים
  choice: мятежники
  rationale: Причастная форма от סרר выражает упорное неповиновение и бунт. Существительное «мятежники» сохраняет резкую обвинительную силу оригинала.
- source_word: וְחַבְרֵי גַּנָּבִים
  choice: и сообщники воров
  rationale: Конструкция буквально обозначает товарищей или соучастников воров. «Сообщники» ясно передаёт преступный союз, а не просто личное знакомство.
- source_word: כֻּלּוֹ
  choice: каждый из них
  rationale: Форма единственного числа в данном контексте имеет распределительный смысл по отношению ко всей группе; «каждый из них» естественно выражает это по-русски.
- source_word: אֹהֵב שֹׁחַד
  choice: любит взятки
  rationale: שֹׁחַד означает взятку. Русское множественное число передаёт обобщённый характер обвинения и естественно сочетается с распределительным подлежащим.
- source_word: וְרֹדֵף שַׁלְמֹנִים
  choice: и гонится за вознаграждениями
  rationale: רדף буквально означает настойчиво преследовать или гнаться, а редкое שַׁלְמֹנִים может обозначать выплаты, вознаграждения или дары. Формулировка сохраняет энергичность глагола и не сужает чрезмерно значение существительного.
- source_word: יָתוֹם לֹא יִשְׁפֹּטוּ
  choice: они не защищают сироту
  rationale: В судебном контексте שׁפט может означать не только судить, но и обеспечивать правосудие или отстаивать права. «Не защищают сироту» понятно передаёт отказ властей вступиться за беззащитного.
- source_word: וְרִיב אַלְמָנָה
  choice: и дело вдовы
  rationale: רִיב может обозначать спор, жалобу или судебное дело. «Дело вдовы» естественно для юридического контекста и сохраняет смысл её законного требования.
- source_word: לֹא יָבוֹא אֲלֵיהֶם
  choice: до них не доходит
  rationale: Буквально дело «не приходит к ним». Русский оборот «до них не доходит» сохраняет образ оригинала и подразумевает, что жалобу вдовы не допускают к рассмотрению.
