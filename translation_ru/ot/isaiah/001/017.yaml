review_pass:
  verdict: approve
  source_fidelity: Текст точно передаёт последовательность еврейских повелений и их этико-правовой характер. «Учитесь делать добро» обоснованно раскрывает наречное הֵיטֵב; «ищите справедливости» хорошо передаёт דִּרְשׁוּ מִשְׁפָּט. «Защищайте права сироты» адекватно выражает משפטный смысл שִׁפְטוּ יָתוֹם, не создавая ложного впечатления, будто сироту судят. «Вступайтесь за вдову» сохраняет судебно-заступнический оттенок רִיבוּ. Трудное אַשְּׁרוּ חָמוֹץ переведено в соответствии с избранным в английском аудиторском следе активным прочтением и снабжено сноской, сохраняющей существенную альтернативу.
  naturalness: Русский текст звучит современно, литературно и ритмически цельно. «Исправляйте притеснителя» несколько более формально, чем разговорный современный язык, но в пророческом ряду повелений это естественная и уместная формулировка; она также не подменяет трудный еврейский оборот чрезмерно конкретным толкованием.
  terminology: «Справедливость», «притеснитель», «сирота» и «вдова» точны и понятны. Формулировки о защите прав и заступничестве удачно передают юридико-социальную лексику стиха. Сноска корректно отмечает спорность значения חָמוֹץ и не навязывает конфессионального решения.
