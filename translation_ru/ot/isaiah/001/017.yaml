  text: לִמְד֥וּ הֵיטֵ֛ב דִּרְשׁ֥וּ מִשְׁפָּ֖ט אַשְּׁר֣וּ חָמ֑וֹץ שִׁפְט֣וּ יָת֔וֹם רִ֖יבוּ אַלְמָנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/017.yaml
  text: Learn to do good; seek justice[a], correct the oppressor; judge for the fatherless, plead for the widow.
translation:
  language: ru
  text: Учитесь делать добро; ищите справедливости, исправляйте притеснителя[a], защищайте права сироты, вступайтесь за вдову.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «помогайте угнетённому» или «восстановите права угнетённого». Еврейское выражение трудно для истолкования, и слово חָמוֹץ допускает разные понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְדוּ הֵיטֵב
  choice: Учитесь делать добро
  rationale: Императив לִמְדוּ сохраняет призыв приобрести навык и привычку, а הֵיטֵב в этическом контексте естественно передаётся как «делать добро», а не просто «хорошо».
- source_word: דִּרְשׁוּ מִשְׁפָּט
  choice: ищите справедливости
  rationale: דִּרְשׁוּ выражает деятельный поиск или стремление, а מִשְׁפָּט здесь обозначает общественную и судебную справедливость.
- source_word: אַשְּׁרוּ חָמוֹץ
  choice: исправляйте притеснителя
  rationale: אַשְּׁרוּ в породе пиэль может означать «исправлять, направлять прямо», а חָמוֹץ допускает активное понимание «притеснитель». Краткая формулировка сохраняет выбранное чтение, тогда как существенная лексическая неоднозначность отмечена в сноске.
- source_word: שִׁפְטוּ יָתוֹם
  choice: защищайте права сироты
  rationale: Буквально выражение призывает «судить за сироту», то есть выносить справедливое решение в его пользу и обеспечивать ему правовую защиту. Русская формулировка естественно передаёт юридический смысл, не предполагая, будто судить нужно самого сироту.
- source_word: רִיבוּ אַלְמָנָה
  choice: вступайтесь за вдову
  rationale: רִיבוּ имеет оттенок ведения тяжбы и защиты чьего-либо дела. «Вступайтесь за» сохраняет смысл деятельного заступничества и звучит естественно в современном русском языке.
theological_decisions:
- issue: Передача трудного сочетания אַשְּׁרוּ חָמוֹץ
  choice: исправляйте притеснителя
  alternative: помогайте угнетённому; восстановите права угнетённого
  rationale: Еврейское сочетание допускает активное понимание חָמוֹץ как «притеснитель» и пассивное — как «угнетённый». Основной текст следует активному чтению и передаёт אַשְּׁרוּ как призыв исправить виновника неправды. Поскольку пассивное чтение лексически возможно и широко представлено в переводческой традиции, оно сохранено в сноске, а не устранено.
translation_notes:
  register: Современный литературный русский язык; ряд кратких повелительных форм сохраняет ритм пророческого призыва. Юридический оттенок последних двух предписаний передан понятно для обычного читателя без архаизмов.
