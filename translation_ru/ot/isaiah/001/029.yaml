  text: For you will be ashamed of the oaks that you desired[a], and you will be disgraced because of the gardens that you chose.
translation:
  language: ru
  text: Ибо они устыдятся дубов[a], которых вы желали, и будут посрамлены из-за садов, которые вы избрали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «теревинты»; еврейское слово может обозначать крупные деревья, связанные с недозволенным поклонением.'
