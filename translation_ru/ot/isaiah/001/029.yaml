lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит пояснение к предшествующему обличению и суду; «ибо» естественно сохраняет причинно-пояснительную связь.
- source_word: יֵבֹשׁוּ
  choice: вам будет стыдно
  rationale: Глагол выражает стыд и разочарование. Хотя форма формально стоит в 3-м лице множественного числа, контекст и последующие формы 2-го лица множественного числа указывают на обращение к той же аудитории.
- source_word: מֵאֵילִים
  choice: за дубы
  rationale: В параллели с садами речь, вероятнее всего, идёт о крупных деревьях, связанных с недозволенным культом. Предлог после глагола стыда обозначает его причину или предмет. Точный вид дерева неясен, поэтому вариант «теревинты» дан в сноске.
- source_word: אֲשֶׁר חֲמַדְתֶּם
  choice: которых вы желали
  rationale: חמד передаёт сильное желание или влечение; «желали» сохраняет широту значения, не сводя его исключительно к любованию или алчности.
- source_word: וְתַחְפְּרוּ
  choice: и вы будете посрамлены
  rationale: Глагол обозначает смущение, унижение или посрамление. Выбор сохраняет усиленный параллелизм с первой строкой, не делая оба глагола полными синонимами.
- source_word: מֵהַגַּנּוֹת
  choice: из-за садов
  rationale: Предлог מִן при глаголе стыда указывает на причину посрамления; «из-за» ясно и естественно передаёт это отношение.
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: которые вы избрали
  rationale: בחר означает сознательно выбирать; «избрали» передаёт намеренность выбора и соответствует возвышенному пророческому регистру.
theological_decisions:
- issue: Характер дубов и садов
  choice: В основном тексте сохранить буквальные образы дубов и садов, подразумевая вероятный контекст недозволенного поклонения, но не добавляя его прямо.
  alternative: Передать их как «священные дубы» и «культовые сады» либо понимать лишь как роскошные природные места.
  rationale: Контекст Ис 1 и пророческое употребление подобных образов поддерживают культовый смысл, однако сами существительные не содержат явного определения «священные». Буквальная формулировка сохраняет образность и не устраняет возможную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Ибо» и «избрали» поддерживают достоинство стиля, оставаясь понятными; синтаксический параллелизм оригинала сохранён.
