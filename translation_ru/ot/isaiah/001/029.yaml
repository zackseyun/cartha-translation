  source_fidelity: В еврейском тексте начальные глаголы יֵבֹשׁוּ и וְתַחְפְּרוּ стоят в 3-м лице множественного числа («они устыдятся / будут посрамлены»), тогда как в относительных предложениях сохранено 2-е лицо множественного числа («которых вы желали / которые вы избрали»). Черновик необоснованно заменяет 3-е лицо на 2-е. Это синтаксическое напряжение следует сохранить, а не гармонизировать по английскому аудиторскому варианту.
  naturalness: Формулировка «вам будет стыдно за дубы» возможна, но «за дубы» может означать стыд вместо или за поступки дубов. «Устыдятся дубов» точнее передаёт управление глагола и отношение, выраженное מִן. Смена «они» и «вы» в переработанном тексте намеренно отражает грамматику оригинала, хотя в русском она столь же заметна, как и в еврейском.
  terminology: «Дубы» — допустимый основной вариант для אֵילִים; вид дерева не вполне определён, и вариант «теревинты» уместен в сноске. Не следует называть деревья или сады культовыми непосредственно в основном тексте. В сноске осторожное указание на возможную связь с недозволенным поклонением допустимо.
