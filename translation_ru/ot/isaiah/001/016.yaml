  text: רַחֲצוּ֙ הִזַּכּ֔וּ הָסִ֛ירוּ רֹ֥עַ מַעַלְלֵי/כֶ֖ם מִ/נֶּ֣גֶד עֵינָ֑/י חִדְל֖וּ הָרֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/016.yaml
  text: Wash yourselves[a]; make yourselves clean. Remove the evil of your deeds from before my eyes[b]. Stop doing evil.
translation:
  language: ru
  text: Омойтесь[a], очиститесь. Удалите с Моих глаз зло ваших деяний[b]. Перестаньте делать зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вымойтесь». В данном контексте омовение служит образом нравственного очищения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от перед Моими глазами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחֲצוּ
  choice: Омойтесь
  rationale: Повелительная форма множественного числа от רחץ; в данном нравственном призыве возвратное «омойтесь» естественно передаёт образ очищения и сохраняет его метафорическую силу.
- source_word: הִזַּכּוּ
  choice: очиститесь
  rationale: Возвратная повелительная форма со значением стать чистыми или очистить себя. «Очиститесь» звучит естественно в современном литературном русском и не сводит выражение к специальному ритуальному термину.
- source_word: הָסִירוּ
  choice: Удалите
  rationale: Каузативная повелительная форма со значением убрать, устранить. «Удалите» точно продолжает ряд прямых повелений.
- source_word: רֹעַ מַעַלְלֵיכֶם
  choice: злые дела ваши
  rationale: Сочетание буквально обозначает зло ваших деяний. Формулировка «злые дела ваши» ясна, сохраняет нравственную направленность и допускает требуемую исходным текстом связь между злом и поступками адресатов.
- source_word: מִנֶּגֶד עֵינָי
  choice: от очей Моих
  rationale: Сохраняет буквальный и выразительный образ «прочь от того, что перед Моими глазами», не заменяя его полностью более отвлечённым «из Моего поля зрения».
- source_word: חִדְלוּ הָרֵעַ
  choice: Перестаньте делать зло
  rationale: חדל выражает прекращение действия, а הָרֵעַ — совершение зла. Русская конструкция прямо и естественно передаёт смысл еврейского оборота.
theological_decisions:
- issue: Образ нравственного очищения
  choice: Сохранены образы омовения и очищения как призыв к покаянию и изменению поведения.
  alternative: Передать «очиститесь» как специальное указание на обрядовое или сакраментальное очищение.
  rationale: Контекст связывает очищение со злыми делами и прекращением зла. Сам стих не определяет особого обряда, поэтому перевод не должен привносить такую конкретизацию.
- issue: Антропоморфное выражение «перед Моими глазами»
  choice: Сохранён образ «от очей Моих».
  alternative: Сгладить как «с глаз Моих» или «из Моего поля зрения».
  rationale: Еврейский текст употребляет яркое пространственное выражение. Его сохранение передаёт прямоту Божьего обличения, не пытаясь разрешить содержащийся в образе антропоморфизм.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Омойтесь» и «очи» слегка возвышенны, но понятны; они сохраняют образность оригинала. Инверсия «злые дела ваши» поддерживает торжественный ритм, не создавая архаической грамматики.
