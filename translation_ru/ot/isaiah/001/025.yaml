base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/025.yaml
  text: I will turn my hand against you[a], and I will smelt away your dross as with lye[c][b], and remove all your alloy.
translation:
  language: ru
  text: Я обращу Свою руку против тебя[a] и, словно щёлочью[b], очищу тебя от твоего шлака и удалю все твои примеси[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на тебя». Еврейское выражение может обозначать как карающее действие, так и очищающее вмешательство; здесь образ очистки соединяет суд с очищением.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово обозначает щёлочь, применявшуюся для очищения; возможны также переводы: «щелочным составом» или «как мылом».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально возможно: «всё твоё олово»; слово может обозначать олово или, шире, неблагородные металлы в сплаве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: обращу
  rationale: Форма породы хифиль от שוב в сочетании с «рукой» означает направить или обратить руку для действия; здесь контекст суда не позволяет понимать глагол как «восстановлю».
- source_word: יָדִי
  choice: Свою руку
  rationale: Сохранён библейский антропоморфный образ Божьего непосредственного действия и силы.
- source_word: עָלַיִךְ
  choice: против тебя
  rationale: Предлог על буквально допускает значение «на тебя», но в контексте суда естественное русское выражение «обратить руку против» передаёт враждебную сторону действия; двусмысленность отмечена в сноске.
- source_word: וְאֶצְרֹף
  choice: выплавлю
  rationale: Глагол צרף относится к плавке и очистке металла. «Выплавлю» сохраняет металлургический образ и одновременно указывает на отделение шлака.
- source_word: כַּבֹּר
  choice: словно щёлочью
  rationale: בֹּר обозначает щёлочь, применявшуюся для очищения; сравнительная частица כ передана словом «словно». Необычное соединение образов плавки и щёлочи сохранено, а не сглажено.
- source_word: סִיגָיִךְ
  choice: твой шлак
  rationale: סיגים — шлак или отходы, отделяемые при очистке металла. «Шлак» конкретно и понятно сохраняет пророческую метафору.
- source_word: וְאָסִירָה
  choice: и удалю
  rationale: Хифиль от סור означает устранить, удалить; выбран прямой и современный русский эквивалент.
- source_word: כָּל
  choice: всю
  rationale: Полнота действия выражена без ослабления.
- source_word: בְּדִילָיִךְ
  choice: твою примесь
  rationale: בדיל может означать олово либо неблагородный металл в составе сплава. Более широкое «примесь» естественно передаёт нежелательный компонент и не сужает возможный смысл до олова.
theological_decisions:
- issue: Характер Божьего действия
  choice: Суд, направленный на очищение
  alternative: Только разрушительный суд; только мягкое восстановление
  rationale: Выражение «руку против тебя» подчёркивает суровость суда, тогда как удаление шлака и примеси указывает на очистительную цель. Перевод сохраняет оба аспекта, не устраняя напряжения между ними.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного пророческого тона. Обращение имеет женский род, как и в еврейском тексте, где подразумевается Сион/Иерусалим. Заглавная буква в «Свою» отражает принятое русское благоговейное оформление местоимения, относящегося к Богу. Необычное сочетание металлургического образа со щёлочью намеренно не устранено.
