base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/027.yaml
  text: Zion will be redeemed by justice[a], and her returnees by righteousness.
translation:
  language: ru
  text: Сион будет искуплен правосудием, а его возвратившиеся — праведностью[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его возвращающиеся» или «его возвратившиеся». Еврейское слово может также обозначать тех, кто обратился, то есть раскаялся.'
    reason: alternative_reading
lexical_decisions:
- source_word: צִיּוֹן
  choice: Сион
  rationale: Традиционная русская форма библейского топонима; сохраняет имя собственное.
- source_word: בְּמִשְׁפָּט
  choice: правосудием
  rationale: מִשְׁפָּט обозначает суд и справедливое правосудие; предлог ב здесь естественно передаёт средство, посредством которого совершается искупление.
- source_word: תִּפָּדֶה
  choice: будет искуплен
  rationale: Страдательная форма глагола פדה означает освобождение посредством выкупа; «искуплен» сохраняет как образ избавления, так и богословскую насыщенность выражения.
- source_word: וְשָׁבֶיהָ
  choice: а те, кто к нему возвращается
  rationale: Причастие от שוב буквально обозначает возвращающихся или обращающихся. Формулировка сохраняет основной образ возвращения и не ограничивает его только физическим возвращением либо только покаянием.
- source_word: בִּצְדָקָה
  choice: праведностью
  rationale: צְדָקָה означает праведность и справедливость. «Праведностью» сохраняет отличие от параллельного מִשְׁפָּט, переведённого как «правосудие».
theological_decisions:
- issue: 'Значение וְשָׁבֶיהָ: возвращение в Сион или нравственно-духовное обращение'
  choice: те, кто к нему возвращается
  alternative: обратившиеся в нём; кающиеся в нём
  rationale: Еврейское שוב допускает как пространственное возвращение, так и обращение или покаяние. Основной текст сохраняет образ возвращения, а примечание явно отмечает нравственно-духовную возможность, не устраняя смыслового напряжения.
- issue: Соотношение правосудия и праведности как средств искупления
  choice: правосудием … праведностью
  alternative: через правосудие … через праведность
  rationale: Творительный падеж естественно передаёт инструментальное значение обоих предлогов ב и сохраняет параллелизм без уточнения того, чьё именно это правосудие и праведность.
translation_notes:
  register: Современный литературный русский язык с кратким пророческим параллелизмом. Род местоимения согласован с русским словом «Сион»; тире во второй части естественно восполняет сказуемое «будут искуплены».
