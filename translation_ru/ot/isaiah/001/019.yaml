  yaml_path: translation/ot/isaiah/001/019.yaml
  text: If you are willing and obedient[a], you will eat the good of the land.
translation:
  language: ru
  text: Если захотите и послушаетесь, будете есть блага земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Стандартный условный союз, вводящий условие.
- source_word: תֹּאבוּ
  choice: захотите
  rationale: Глагол אבה означает «желать, быть готовым, соглашаться»; форма «захотите» естественно передаёт волевую готовность и сочетается с последующим глаголом.
- source_word: וּשְׁמַעְתֶּם
  choice: и послушаетесь
  rationale: שׁמע может означать «слышать», «слушать» и в соответствующем контексте «слушаться». Возвратная форма «послушаетесь» передаёт отклик, выраженный в повиновении, и сохраняет связь со значением слушания.
- source_word: טוּב
  choice: блага
  rationale: Существительное обозначает добро или хорошие дары; здесь речь идёт о плодах и изобилии земли. Множественное «блага» естественно передаёт собирательное значение.
- source_word: הָאָרֶץ
  choice: этой земли
  rationale: В контексте имеется в виду конкретная земля народа, а не весь мир; указательное «этой» делает русский оборот естественным, не добавляя нового референта.
- source_word: תֹּאכֵלוּ
  choice: будете есть
  rationale: Сохраняется конкретный образ вкушения плодов земли и условно-будущее значение формы.
theological_decisions:
- issue: Значение שׁמע в призыве к заветному отклику
  choice: послушаетесь
  alternative: будете слушать
  rationale: Ближайший контекст противопоставляет готовность слушаться отказу и мятежу (ст. 19–20). «Послушаетесь» передаёт требуемый деятельный отклик, а примечание сохраняет буквальную лексическую возможность «слушать».
translation_notes:
  register: Современный литературный русский язык; фраза краткая и ритмичная. «Блага этой земли» звучит достойно и понятно, сохраняя конкретную связь обещания с землёй и её плодами.
