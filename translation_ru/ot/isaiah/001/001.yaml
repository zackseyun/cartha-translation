source:
  edition: WLC
  text: חֲזוֹן֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֲשֶׁ֣ר חָזָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בִּ/ימֵ֨י עֻזִּיָּ֧הוּ יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖הוּ מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/001.yaml
  text: The vision of Isaiah son of Amoz[a], which he saw concerning Judah and Jerusalem in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah.
translation:
  language: ru
  text: Видение Исаии, сына Амоца, которое он видел об Иудее и Иерусалиме[a] во дни Озии, Иоафама, Ахаза и Езекии, царей Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против Иудеи и Иерусалима». Еврейский предлог может указывать как на тему вести, так и, в некоторых контекстах, на её направленность против кого-либо.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזוֹן
  choice: видение
  rationale: Прямое и традиционное соответствие пророческому термину; сохраняет смысловую связь с глаголом חָזָה («видел»).
- source_word: יְשַׁעְיָהוּ בֶן־אָמֹוץ
  choice: Исаии, сына Амоца
  rationale: Имена переданы в устоявшейся русской библейской форме, а конструкция родства — прямо и естественно.
- source_word: אֲשֶׁר חָזָה
  choice: которое он видел
  rationale: Сохраняет буквальный образ видения и однокоренную смысловую связь существительного с глаголом, не добавляя толкования «получил».
- source_word: עַל
  choice: об
  rationale: Предлог обозначает предмет пророчества, оставаясь достаточно широким для вести как суда, так и надежды.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Иудее и Иерусалиме
  rationale: Устоявшиеся русские формы географических названий; падеж определяется предлогом «об».
- source_word: בִּימֵי
  choice: во дни
  rationale: Сохраняет еврейскую временную формулу и при этом соответствует достоинству заголовка в литературном русском языке.
- source_word: עֻזִּיָּהוּ יוֹתָם אָחָז יְחִזְקִיָּהוּ
  choice: Озии, Иоафама, Ахаза и Езекии
  rationale: Использованы устоявшиеся русские библейские формы имён этих царей.
- source_word: מַלְכֵי יְהוּדָה
  choice: царей Иудеи
  rationale: Формально точная и естественная русская передача приложения ко всему перечню царей.
theological_decisions:
- issue: Значение предлога עַל в надписании
  choice: об Иудее и Иерусалиме
  alternative: против Иудеи и Иерусалима
  rationale: Предлог может обозначать тему пророчества и сам по себе не обязательно выражает враждебную направленность. Основной текст сохраняет широкий охват книги — суд и надежду, а возможное значение «против» отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской формулой «во дни». Синтаксис сохраняет форму пророческого надписания и намеренный повтор «видение — видел».
