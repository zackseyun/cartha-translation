  source_fidelity: 'Текст точно передаёт еврейское надписание: חָזוֹן передано как «видение», а глагол חָזָה — как «видел», с сохранением намеренной лексической переклички. Родство, географические названия, временная формула и приложение «царей Иудеи» переданы без смысловых добавлений. «Об Иудее и Иерусалиме» адекватно передаёт широкий предметный смысл עַל.'
  naturalness: Фраза литературна и понятна для современного русского. Формула «во дни» уместна для пророческого надписания. Повтор «видение ... которое он видел» несколько тяжеловесен в обычной речи, но оправдан близостью к исходному тексту и сохранением его словесной связи.
  terminology: «Видение», «Иудея», «Иерусалим» и титул «цари Иудеи» употреблены последовательно и в подходящем регистре. Формы имён «Озия, Иоафам, Ахаз, Езекия» соответствуют обычной русской библейской традиции. «Амоца» точно отражает имя אָמוֹץ и не должно автоматически смешиваться с именем пророка Амоса (עָמוֹס).
