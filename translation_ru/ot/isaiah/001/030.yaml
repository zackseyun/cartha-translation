  text: כִּ֣י תִֽהְי֔וּ כְּ/אֵלָ֖ה נֹבֶ֣לֶת עָלֶ֑/הָ וּֽ/כְ/גַנָּ֔ה אֲשֶׁר מַ֖יִם אֵ֥ין לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/030.yaml
  text: For you will be like an oak whose leaf withers[a], and like a garden that has no water.
translation:
  language: ru
  text: Ибо вы будете как дуб[a], чей лист увядает, и как сад, в котором нет воды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «терпентинное дерево». Еврейское אֵלָה может обозначать терпентинное дерево или дуб; точный вид дерева неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение или следствие предшествующего приговора; «ибо» сохраняет эту связь и соответствует возвышенному, но понятному регистру.
- source_word: תִהְיוּ
  choice: вы будете
  rationale: Имперфект Qal, 2-е лицо множественного числа, здесь естественно передаёт будущее или результирующее состояние.
- source_word: כְאֵלָה
  choice: как дуб
  rationale: אֵלָה может обозначать дуб либо терпентинное дерево; в основном тексте выбран знакомый русскому читателю образ, а неопределённость вида сохранена в сноске.
- source_word: נֹבֶלֶת
  choice: увядает
  rationale: Причастие от נבל описывает увядание или поблёкновение; личная глагольная форма естественно звучит в русском относительном придаточном.
- source_word: עָלֶהָ
  choice: чей лист
  rationale: Сохранено единственное число еврейского существительного с местоименным суффиксом; «чей лист» естественно связывает его с образом дерева.
- source_word: וּכְגַנָּה
  choice: и как сад
  rationale: גַּנָּה означает сад или огороженный возделываемый участок; «сад» — прямой и ясный эквивалент.
- source_word: אֲשֶׁר מַיִם אֵין לָהּ
  choice: в котором нет воды
  rationale: Передаёт буквальный смысл «для которого нет воды» естественным русским оборотом, сохраняя образ лишённого воды сада.
- source_word: מַיִם
  choice: воды
  rationale: Несмотря на формально множественную форму в еврейском, слово обычно обозначает неисчисляемое «вода»; после «нет» требуется родительный падеж.
