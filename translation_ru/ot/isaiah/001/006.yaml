  text: מִ/כַּף רֶ֤גֶל וְ/עַד רֹאשׁ֙ אֵֽין בּ֣/וֹ מְתֹ֔ם פֶּ֥צַע וְ/חַבּוּרָ֖ה וּ/מַכָּ֣ה טְרִיָּ֑ה לֹא זֹ֨רוּ֙ וְ/לֹ֣א חֻבָּ֔שׁוּ וְ/לֹ֥א רֻכְּכָ֖ה בַּ/שָּֽׁמֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/006.yaml
  text: From the sole of the foot even to the head[a], there is no soundness in it—only wounds and bruises and fresh blows; they have not been pressed out, or bandaged[d][c][b], or softened with oil.
translation:
  language: ru
  text: От подошвы ноги до самой головы нет на нём здорового места[a] — только раны, кровоподтёки и свежие повреждения[b]; их не выдавили[c], не перевязали[d] и не смягчили маслом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в нём нет ничего здорового». Народ представлен как израненное тело.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «свежие раны». Выражение может обозначать недавние, ещё открытые повреждения.'
    reason: lexical_alternative
  - marker: c
    text: Редкий еврейский глагол, вероятно, относится к надавливанию на рану, чтобы удалить её содержимое перед дальнейшим лечением.
    reason: cultural_note
  - marker: d
    text: 'Или: «не обвязали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכַּף רֶגֶל
  choice: От подошвы ноги
  rationale: כַּף רֶגֶל обозначает подошву, нижнюю часть стопы; единственное число сохраняет еврейское собирательное выражение.
- source_word: וְעַד רֹאשׁ
  choice: до самой головы
  rationale: Фраза завершает меризм, охватывающий всё тело; «самой» естественно передаёт усиление, не расширяя смысла.
- source_word: אֵין בּוֹ מְתֹם
  choice: нет на нём ничего здорового
  rationale: מְתֹם означает целость, невредимость, здоровое состояние. Такая формулировка естественна по-русски и сохраняет образ поражённого тела; мужское местоимение соответствует форме בּוֹ и допускает как телесный, так и личностный референт.
- source_word: פֶּצַע
  choice: раны
  rationale: Общее обозначение ран или повреждений; множественное число естественно передаёт собирательное употребление еврейского единственного числа.
- source_word: חַבּוּרָה
  choice: ушибы
  rationale: Слово обозначает след или повреждение от удара, включая кровоподтёк; «ушибы» понятно современному читателю и соответствует перечню телесных повреждений.
- source_word: מַכָּה טְרִיָּה
  choice: свежие язвы
  rationale: מַכָּה может означать удар, поражение или возникшую от него рану, а טְרִיָּה — свежую, сырую. «Свежие язвы» передаёт открытые, ещё не обработанные повреждения без неподтверждённого смысла нагноения.
- source_word: לֹא זֹרוּ
  choice: их не выдавили
  rationale: В медицинском контексте редкий глагол, вероятно, означает надавливание или выжимание содержимого раны. Прямая формулировка сохраняет конкретное древнее действие; неопределённо-личная конструкция естественна по-русски.
- source_word: וְלֹא חֻבָּשׁוּ
  choice: не перевязали
  rationale: חבשׁ при лечении ран означает обвязать или наложить повязку; «перевязали» — ясный современный медицинский эквивалент.
- source_word: וְלֹא רֻכְּכָה בַּשָּׁמֶן
  choice: не смягчили маслом
  rationale: רכך означает делать мягким; буквальный образ обработки маслом сохранён без замены более общим «успокоили» или «лечили».
theological_decisions:
- issue: Референт образа израненного тела
  choice: «на нём» — грамматически мужская форма без явного уточнения референта
  alternative: «в нём» как указание на безличное тело либо явное «в народе»
  rationale: Еврейское בּוֹ имеет мужской род, а контекст олицетворяет народ как больное тело. Русское «на нём» сохраняет телесный образ и личностную персонификацию, не сводя её ни к отдельному мужчине, ни к чисто безличному предмету.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конструкция «одни раны…» естественно передаёт противопоставление отсутствия здоровья сплошным повреждениям. Медицинские действия названы конкретно, без архаизмов и без сглаживания редкого глагола זור.
