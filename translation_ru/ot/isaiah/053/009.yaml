  text: וַ/יִּתֵּ֤ן אֶת רְשָׁעִים֙ קִבְר֔/וֹ וְ/אֶת עָשִׁ֖יר בְּ/מֹתָ֑י/ו עַ֚ל לֹא חָמָ֣ס עָשָׂ֔ה וְ/לֹ֥א מִרְמָ֖ה בְּ/פִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/009.yaml
  text: And they assigned his grave with the wicked[a], and with a rich man in his deaths, although he had done no violence[b], and no deceit was in his mouth.
translation:
  language: ru
  text: Ему назначили могилу среди нечестивых[a], а с богатым — при его смерти[b], хотя он не совершил насилия и не было обмана в его устах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он назначил ему могилу среди нечестивых». В еврейском тексте стоит глагол 3-го лица единственного числа («дал, положил, назначил»), но его субъект прямо не назван.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «в его смертях». В еврейском тексте слово «смерть» имеет необычную здесь форму множественного числа; по смыслу её часто передают как «при его смерти» или «в его смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ему назначили
  rationale: Глагол נתן буквально означает «дать, положить, установить», но при слове «могила» передаёт назначение места погребения. Неопределённо-личная русская конструкция сохраняет невыраженность и неясность субъекта еврейского глагола 3-го лица единственного числа.
- source_word: רְשָׁעִים
  choice: нечестивыми
  rationale: Субстантивированное множественное число обозначает людей, виновных в нравственном зле; «нечестивые» — прямой и устойчивый русский эквивалент без сужения значения до конкретного вида преступления.
- source_word: קִבְרוֹ
  choice: могилу
  rationale: קבר означает могилу или место погребения; «могила» здесь наиболее прямое и естественное соответствие.
- source_word: עָשִׁיר
  choice: богатым
  rationale: Единственное число указывает на богатого человека. Субстантивированное «с богатым» сохраняет число и параллелизм с «с нечестивыми».
- source_word: בְּמֹתָיו
  choice: при его смерти
  rationale: Форма морфологически множественная — буквально «в его смертях», однако в данном контексте это необычное множественное число естественно понимается как указание на смерть или время смерти. В основном тексте дан ясный русский эквивалент, а формальная особенность сохранена в сноске.
- source_word: עַל
  choice: хотя
  rationale: В сочетании עַל לֹא частица вводит обстоятельство, контрастирующее с унизительным погребением Служителя; уступительное «хотя» естественно передаёт связь частей стиха, не превращая невиновность в причину такого обращения.
- source_word: חָמָס
  choice: насилия
  rationale: חמס обозначает насилие и насильственное злодеяние; «насилие» сохраняет основной смысл слова.
- source_word: מִרְמָה
  choice: обмана
  rationale: מִרְמָה означает обман, коварство или ложь; современное «обман» ясно и естественно в параллели с насилием.
- source_word: בְּפִיו
  choice: в его устах
  rationale: Сохранён еврейский образ речи, находящейся «в устах». Слово «уста» поддерживает dignified biblical register и остаётся понятным современному читателю.
theological_decisions:
- issue: Необычное множественное число בְּמֹתָיו в мессиански значимой Песни о Служителе
  choice: В основном тексте — «при его смерти», при буквальном «в его смертях» в сноске.
  alternative: «в его смертях»
  rationale: Формальное множественное число важно засвидетельствовать, но его буквальное воспроизведение в русском затемняет смысл и звучит как утверждение о нескольких смертях. Сноска сохраняет текстовую особенность, не навязывая ей позднейшего богословского объяснения.
- issue: Неуказанный субъект וַיִּתֵּן
  choice: Неопределённо-личное «Ему назначили».
  alternative: «Он назначил ему могилу» или пассивное «Ему была назначена могила».
  rationale: Еврейская форма имеет грамматический субъект 3-го лица единственного числа, но его референт не назван, а синтаксис сжат. Русская неопределённо-личная конструкция не отождествляет субъекта ни с Богом, ни со Служителем, ни с какой-либо конкретной группой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Синтаксический параллелизм «с нечестивыми — с богатым» сохранён; двусмысленность субъекта первого глагола и необычное число слова «смерть» явно отмечены, но основной текст остаётся понятным обычному читателю.
