base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/002.yaml
  text: For he grew up before him like a young plant[a], and like a root out of dry ground. He had no form or majesty that we should look at him[c][b], and no appearance that we should desire him.
translation:
  language: ru
  text: Он взошёл перед ним[b], как молодой побег[a], как корень из иссохшей земли. Не было в нём ни облика, ни величия, чтобы нам смотреть на него[c], ни вида, который был бы нам желанен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как нежный росток». Еврейское слово может обозначать молодой, нежный побег.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское: «перед ним». Референт может пониматься как Господь, однако в данном выражении он не назван явно.'
    reason: alternative_reading
  - marker: c
    text: 'Возможен более буквальный перевод: «и мы увидели его, но не было вида, который был бы нам желанен».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: Он взошёл
  rationale: Глагол עלה буквально означает движение вверх; в растительном образе естественно передаёт появление и рост побега. «Взошёл» сохраняет образ растения и допускает отзвук взросления Слуги.
- source_word: כַּיּוֹנֵק
  choice: как молодой побег
  rationale: יוֹנֵק может обозначать нежный, молодой побег. В параллели с корнем ботаническое значение несомненно; «молодой побег» ясно и естественно по-русски.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Сохранено буквальное местоименное выражение с суффиксом 3-го лица мужского рода; непосредственный текст не называет референта заново.
- source_word: וְכַשֹּׁרֶשׁ
  choice: как корень
  rationale: שֹׁרֶשׁ — обычное слово «корень»; конкретный растительный образ сохранён.
- source_word: מֵאֶרֶץ צִיָּה
  choice: из иссохшей земли
  rationale: צִיָּה обозначает сухость и безводность. «Иссохшая земля» естественно передаёт бесплодную среду, из которой появляется корень.
- source_word: לֹא תֹאַר לוֹ
  choice: не было в нём ни стати
  rationale: תֹאַר обозначает форму, облик, очертания. «Стать» здесь передаёт заметную внешнюю представительность, не сводя выражение только к красоте.
- source_word: וְלֹא הָדָר
  choice: ни величия
  rationale: הָדָר означает величие, великолепие или внушительность. «Величие» сохраняет достоинство слова и его связь с внешним впечатлением.
- source_word: וְנִרְאֵהוּ
  choice: чтобы нам смотреть на него
  rationale: В контексте выражение связано с отсутствием внешней привлекательности; такой перевод даёт естественную русскую синтаксическую связь. Более буквальное прочтение «и мы увидели его» отмечено в сноске.
- source_word: וְלֹא מַרְאֶה
  choice: ни вида
  rationale: מַרְאֶה обозначает видимый облик или наружность. «Вид» сохраняет зрительную направленность и не сужает смысл до физической красоты.
- source_word: וְנֶחְמְדֵהוּ
  choice: который привлекал бы нас
  rationale: חמד передаёт желание, влечение или усладу. В описании наружности «привлекал бы нас» естественно выражает отсутствие привлекательности, не добавляя специфически чувственного оттенка.
theological_decisions:
- issue: Референт местоимения в לְפָנָיו
  choice: Сохранить «перед ним», не называя референта в основном тексте.
  alternative: «перед Господом»; предлагалось также «перед нами»
  rationale: Еврейский суффикс имеет форму 3-го лица мужского рода, но в самой фразе его референт не назван. Контекст часто понимают как указание на Господа, однако перевод не должен молча устранять местоименную неоднозначность.
- issue: Отсутствие физической красоты или более широкой общественной значительности
  choice: Использовать слова видимого облика — «стать», «величие», «вид» — без добавления социальной оценки.
  alternative: «красота»; «царственная осанка»; «общественный престиж»
  rationale: Еврейская лексика сосредоточена на том, что воспринимается зрением. Возможные социальные и богословские выводы не внесены непосредственно в перевод.
- issue: Синтаксис וְנִרְאֵהוּ
  choice: 'Связать выражение с предшествующим описанием: «чтобы нам смотреть на него».'
  alternative: «и мы увидели его, но не было вида, который привлекал бы нас»
  rationale: Контекст допускает цельно-причинное прочтение, естественное по-русски, однако буквальная последовательность еврейских форм допускает самостоятельное «и мы увидели его»; эта возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Сохранены параллельные растительные образы и зрительная лексика; синтаксис сделан естественным без устранения смысловой напряжённости оригинала.
