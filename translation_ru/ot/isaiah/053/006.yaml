base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/006.yaml
  text: All of us[a], like sheep, have gone astray; each of us has turned to his own way[c][b]; and Yahweh has laid on him the iniquity of us all.
translation:
  language: ru
  text: Все мы, как овцы, заблудились; каждый пошёл своим путём; и Яхве возложил на него[a] беззаконие[b] всех нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально глагол может означать, что Яхве сделал так, чтобы беззаконие всех нас «встретилось» или «сошлось» на нём.
    reason: alternative_reading
  - marker: b
    text: Еврейское слово может также означать «вину» или последствия и ответственность, связанные с беззаконием.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: Все мы / всех нас
  rationale: Повтор в начале и конце сохраняет всеохватность и композиционное обрамление еврейского текста.
- source_word: כַּצֹּאן
  choice: как овцы
  rationale: Естественно передаёт сравнение и сохраняет образ стада, сбившегося с пути.
- source_word: תָּעִינוּ
  choice: блуждали
  rationale: Глагол обозначает уклонение или блуждание; выбранное слово подходит и к образу овец, и к нравственному смыслу контекста.
- source_word: אִישׁ לְדַרְכּוֹ פָּנִינוּ
  choice: каждый сворачивал на свой путь
  rationale: «Каждый» передаёт распределительное значение мужского единственного אִישׁ и естественно относится ко всем людям; «сворачивал» отражает направленное обращение каждого к собственному пути.
- source_word: וַיהוָה
  choice: но Яхве
  rationale: Собственное имя передано как «Яхве»; союз ו в данном противопоставлении естественно выражен словом «но».
- source_word: הִפְגִּיעַ בּוֹ
  choice: возложил на Него
  rationale: В каузативной форме сочетание означает, что Яхве сделал так, чтобы беззаконие встретилось или сошлось на Нём; «возложил» ясно и естественно передаёт смысл, не уточняя сверх текста его механизм.
- source_word: עֲוֺן
  choice: беззаконие
  rationale: Слово может обозначать беззаконие, вину и её последствия. «Беззаконие» сохраняет нравственную весомость и не сужает намеренно широкую семантику.
theological_decisions:
- issue: Возложение עָוֹן на Раба
  choice: «Яхве возложил на Него беззаконие всех нас»
  alternative: «Яхве сделал так, что вина всех нас пала на Него»
  rationale: Формулировка сохраняет заместительный смысл стиха, но не разворачивает его в более подробную догматическую формулу, чем позволяет еврейский текст.
- issue: Распределительное אִישׁ мужского рода
  choice: «каждый»
  alternative: «каждый из нас»
  rationale: В контексте «все мы» местоимение «каждый» естественно передаёт распределительный единственный смысл и универсальный охват, не создавая в русском языке ненужного ограничения только мужчинами.
- issue: Связь двух частей стиха
  choice: «но Яхве»
  alternative: «и Яхве»
  rationale: 'Еврейский ו допускает контекстуальное противительное прочтение: все уклонились каждый своим путём, но Яхве направил общее беззаконие на одного Раба.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Синтаксис краток и ритмичен; местоимение «Него» написано с прописной буквы как традиционное почтительное обозначение Раба в христианском издательском контексте.
