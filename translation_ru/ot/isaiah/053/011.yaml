source:
  edition: WLC
  text: מֵ/עֲמַ֤ל נַפְשׁ/וֹ֙ יִרְאֶ֣ה יִשְׂבָּ֔ע בְּ/דַעְתּ֗/וֹ יַצְדִּ֥יק צַדִּ֛יק עַבְדִּ֖/י לָֽ/רַבִּ֑ים וַ/עֲוֺנֹתָ֖/ם ה֥וּא יִסְבֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/011.yaml
  text: From the anguish of his soul he will see and be satisfied[a]; by his knowledge my righteous servant will justify many[b], and he will bear their iniquities.
translation:
  language: ru
  text: От страданий души своей он увидит и насытится[a]. Своим знанием мой праведный слуга оправдает многих, и их беззакония он понесёт[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые древние свидетели читают: «увидит свет и насытится». В масоретском тексте: «увидит и насытится».'
    reason: textual_variant
  - marker: b
    text: 'Или: «познанием его» — если речь идёт о том, что люди познают слугу, а не о знании самого слуги.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֲמַל נַפְשׁוֹ
  choice: После мучений своей души
  rationale: עָמָל здесь обозначает тягостное страдание, а не просто труд. Конструкция с מִן допускает исходную или временно-результативную связь; «после мучений» естественно передаёт переход от страдания к видению и удовлетворению.
- source_word: יִרְאֶה יִשְׂבָּע
  choice: он увидит и насытится
  rationale: Масоретский текст не называет объекта глагола «увидит». «Насытится» сохраняет образную силу שׂבע и не уточняет, чем именно он будет удовлетворён.
- source_word: בְּדַעְתּוֹ
  choice: Своим знанием
  rationale: Наиболее прямое понимание суффикса — знание, принадлежащее Слуге, при инструментальном значении предлога בְּ. Объектное понимание «познанием его» сохранено в примечании.
- source_word: יַצְדִּיק
  choice: оправдает
  rationale: Hiphil от צדק означает признать или представить праведным, оправдать. Русское «оправдает» кратко сохраняет как судебный оттенок, так и допустимую богословскую напряжённость.
- source_word: צַדִּיק עַבְדִּי
  choice: Мой праведный Слуга
  rationale: צַדִּיק естественно понимается как определение к «Слуге». Заглавные буквы используются как контекстуально уместное обозначение особого Божьего Слуги, не добавляя имени или конфессионального толкования.
- source_word: לָרַבִּים
  choice: многих
  rationale: Сохраняется выражение «многие» без богословского расширения до «всех».
- source_word: וַעֲוֺנֹתָם הוּא יִסְבֹּל
  choice: и их беззакония он понесёт
  rationale: עָוֺן передано как «беззакония», сохраняя нравственную тяжесть и возможный оттенок вины. Вынесенное «он» отражает явное самостоятельное местоимение הוּא без усилительного добавления «сам».
theological_decisions:
- issue: Значение בְּדַעְתּוֹ
  choice: «Своим знанием» — знанием, принадлежащим Слуге
  alternative: «познанием Его» — через то, что другие познают Слугу
  rationale: Суффикс грамматически естественнее относить к знанию самого Слуги, однако еврейская конструкция допускает традиционное объектное понимание; поэтому оно отмечено, а не исключено.
- issue: Текст после יִרְאֶה
  choice: Следовать масоретскому чтению «увидит» без объекта
  alternative: «увидит свет» по некоторым древним свидетелям
  rationale: Предоставленный текст WLC не содержит אוֹר «свет». Вариант древних свидетелей существенен и поэтому вынесен в примечание.
- issue: Объём לָרַבִּים
  choice: «многих»
  alternative: «множество» / «многих людей»
  rationale: Перевод сохраняет конкретную формулировку еврейского текста и не заменяет её богословски мотивированным «всех».
- issue: Характер оправдания в יַצְדִּיק
  choice: Сохранить многозначное «оправдает»
  alternative: «признает праведными» или «сделает праведными»
  rationale: Еврейская каузативная форма допускает судебный и результативный оттенки. «Оправдает» не вынуждает переводчика окончательно выбирать между ними.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического пророческого текста. Сохранены краткость, параллелизм и богословская неоднозначность оригинала; архаизмы и конфессиональные уточнения не добавлены.
