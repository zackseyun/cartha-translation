  text: מֵ/עֹ֤צֶר וּ/מִ/מִּשְׁפָּט֙ לֻקָּ֔ח וְ/אֶת דּוֹר֖/וֹ מִ֣י יְשׂוֹחֵ֑חַ כִּ֤י נִגְזַר֙ מֵ/אֶ֣רֶץ חַיִּ֔ים מִ/פֶּ֥שַׁע עַמִּ֖/י נֶ֥גַע לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/008.yaml
  text: By oppression and judgment he was taken away[a]; and as for his generation, who considered that he was cut off from the land of the living[c][b], stricken for the transgression of my people?
translation:
  language: ru
  text: Под гнётом притеснения и судом он был уведён. Кто размышлял о его поколении[a][b] — что он был отсечён от земли живых, что за преступление моего народа удар постиг его[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто говорил о его поколении?», «кто возвещал о нём?» либо «кто вникал в его участь?» Еврейский глагол редок, и его значение здесь не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: «Его поколение» может означать его современников, его потомство или, шире, его жизненный путь и участь.
    reason: alternative_reading
  - marker: c
    text: 'Буквально возможны прочтения: «удар — ему» или «удар — им». Форма לָמוֹ формально множественная, но в поэтическом еврейском может относиться к одному лицу.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֹצֶר
  choice: через притеснение
  rationale: עֹצֶר может означать удержание, заключение или притеснение. В сочетании с מִשְׁפָּט здесь выбран смысл жестокого, притеснительного обращения; «через» передаёт возможное значение средства, выраженное предлогом מִן, не сводя фразу к нейтральному заключению под стражу.
- source_word: וּמִמִּשְׁפָּט
  choice: и суд
  rationale: מִשְׁפָּט обозначает суд, судебное решение или правосудие. «Суд» сохраняет юридический смысл и не утверждает заранее, был ли процесс справедливым.
- source_word: לֻקָּח
  choice: он был взят
  rationale: Страдательная форма לקח означает, что его взяли или удалили. Буквальное «был взят» сохраняет сжатость и не уточняет сверх текста ни арест, ни само умерщвление.
- source_word: וְאֶת־דּוֹרוֹ
  choice: о его поколении
  rationale: דּוֹר прямо означает «поколение», однако в данном месте может указывать на современников, потомство либо жизненную участь. В основном тексте сохранён широкий термин.
- source_word: מִי יְשׂוֹחֵחַ
  choice: кто размышлял
  rationale: Редкий глагол допускает значения «размышлять», «говорить» или «возвещать». «Размышлял» естественно вводит риторический вопрос, но лексическая неуверенность отмечена в сноске.
- source_word: כִּי
  choice: ведь
  rationale: כִּי может вводить основание или содержание предыдущей мысли. «Ведь» сохраняет объяснительную связь, не превращая последующую часть однозначно в придаточное изъяснительное.
- source_word: נִגְזַר
  choice: он был отсечён
  rationale: Nifal от גזר передаёт насильственное отсечение или удаление; в контексте «земли живых» выражение указывает на смерть, сохраняя исходный образ.
- source_word: מֵאֶרֶץ חַיִּים
  choice: от земли живых
  rationale: Сохранена еврейская образная формула, обозначающая область или мир живущих.
- source_word: מִפֶּשַׁע עַמִּי
  choice: за преступление Моего народа
  rationale: 'Префикс מִן понят каузально: поражение связано с преступлением народа. «За» кратко и естественно передаёт эту связь, не уточняя её богословский механизм.'
- source_word: נֶגַע
  choice: поражение
  rationale: נֶגַע — существительное со значениями «удар», «поражение», «бедствие», иногда «язва». Именная передача «поражение» сохраняет грамматическую форму и сжатость трудного заключительного оборота.
- source_word: לָמוֹ
  choice: постигло его
  rationale: לָמוֹ формально имеет множественное число, но в поэтической речи может относиться к одному лицу. Единственное число согласуется с единичным образом раба в ближайшем контексте; формальная неоднозначность отмечена в сноске.
theological_decisions:
- issue: Референт и число לָמוֹ в заключительной части
  choice: 'Единственное число, относящее поражение к рабу: «поражение постигло его»'
  alternative: 'Формально множественное прочтение: «поражение постигло их»; также возможно построение «на нём было поражение»'
  rationale: Хотя форма לָמוֹ морфологически множественная, в библейской поэзии она может употребляться с единичным референтом. Ближайший контекст последовательно говорит об одном рабе, однако иной разбор не исключён и вынесен в сноску.
- issue: Смысл דּוֹר в выражении «его поколение»
  choice: Сохранить широкое слово «поколение»
  alternative: Его современники; его потомство; его жизненный путь или участь
  rationale: Еврейское слово и синтаксис допускают несколько толкований. Более узкое понимание не внесено в основной текст, чтобы не снимать реальную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены краткость, параллелизм и образы исходного текста; редкий глагол, значение «поколения» и число заключительного местоимения не нормализованы без оговорки.
