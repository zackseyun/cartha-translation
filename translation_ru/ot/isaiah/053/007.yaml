base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/007.yaml
  text: He was oppressed[a], and he was afflicted, yet he did not open his mouth; like a lamb led to the slaughter, and like a ewe silent before her shearers, so he did not open his mouth.
translation:
  language: ru
  text: Его притесняли и унижали, но он не открывал уст; как ягнёнок, которого ведут на заклание, и как овца, безмолвная перед теми, кто стрижёт её, так он не открывал уст.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִגַּשׂ
  choice: Его притесняли
  rationale: Нифаль глагола נגשׂ передаёт суровое обращение и угнетение. Безлично-пассивная русская конструкция звучит естественно и сохраняет направленное на Раба насилие.
- source_word: נַעֲנֶה
  choice: он был мучим
  rationale: В контексте форма выражает претерпеваемое страдание или унижение, а не словесный ответ. Формулировка сохраняет пассивный смысл, тогда как возможное возвратно-среднее понимание отмечено в сноске.
- source_word: וְלֹא יִפְתַּח פִּיו
  choice: но не открывал уст
  rationale: Первый союз передан уступительно-противительным «но». Образное выражение сохранено буквально и повторено в конце стиха ради исходного риторического акцента.
- source_word: כַשֶּׂה
  choice: как ягнёнок
  rationale: שֶׂה может обозначать мелкую овцу или козу, однако в данном образе уязвимого животного, ведомого на убой, «ягнёнок» естественно и традиционно передаёт смысл.
- source_word: לַטֶּבַח
  choice: на заклание
  rationale: Предлог указывает на назначение или направление движения. «На заклание» — ясное, устойчивое и достойное по регистру русское выражение.
- source_word: יוּבָל
  choice: которого ведут
  rationale: Хофаль выражает перемещение под чужой властью. Настоящее время внутри сравнения делает образ непосредственным и соответствует форме еврейского глагола.
- source_word: וּכְרָחֵל
  choice: и как овца
  rationale: רָחֵל обозначает взрослую самку овцы. Русское «овца» точно передаёт пол животного и звучит естественно.
- source_word: לִפְנֵי גֹזְזֶיהָ
  choice: перед теми, кто стрижёт её
  rationale: Развёрнутая конструкция естественнее редкого существительного «стригали» и сохраняет женский объектный референт.
- source_word: נֶאֱלָמָה
  choice: безмолвная
  rationale: Причастное определение естественно в русском сравнении и передаёт полное молчание овцы без предположения о физической немоте.
- source_word: וְלֹא יִפְתַּח פִּיו
  choice: так он не открывал уст
  rationale: «Так» ясно связывает заключительное повторение с двумя сравнениями, не добавляя нового содержания; повтор исходной формулы сохранён.
theological_decisions:
- issue: Степень мессианской конкретизации
  choice: Передать непосредственный смысл еврейского текста без добавления явного указания на Христа.
  alternative: Использовать формулировки, сильнее приспособленные к новозаветным цитатам и традиционному христологическому прочтению.
  rationale: Христианское прочтение видит исполнение стиха во Христе, однако сам перевод должен сохранять образ молча страдающего Раба и не вставлять его идентификацию в текст.
- issue: Значение נַעֲנֶה в начальной строке
  choice: 'Основной текст передаёт пассивное страдание: «он был мучим».'
  alternative: 'Понимать форму возвратно: «он смирял себя».'
  rationale: Еврейская начальная строка трудна и допускает оба понимания. Контекст и параллелизм поддерживают пассивное значение, но альтернативу нельзя устранять, поэтому она приведена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой («уста», «заклание», «безмолвная»). Синтаксис остаётся ясным для обычного читателя; параллелизм, два сравнения и заключительное повторение исходного текста сохранены.
