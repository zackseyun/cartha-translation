  verdict: revise
  source_fidelity: 'Основной смысл передан верно: притеснение, страдание, молчание, оба сравнения и заключительное повторение сохранены. Однако «был мучим» в современном русском неестественно и может излишне конкретизировать נַעֲנֶה как пытку; «унижали» точнее передаёт возможный спектр значения «подвергали страданию / унижали» в параллели с притеснением.'
  naturalness: «Был мучим» звучит книжно-архаично и для современного литературного русского неудачно. Координация «Его притесняли и унижали» естественна, ясна и сохраняет пассивную направленность действий на Раба.
  terminology: «Ягнёнок», «на заклание», «овца», «безмолвная» и «не открывал уст» соответствуют образности и умеренно возвышенному библейскому регистру. «Овца» адекватно передаёт רָחֵל как самку овцы.
  issues:
  - severity: medium
    issue: Неестественная и чрезмерно узкая формулировка «он был мучим».
    rationale: 'В современном русском «мучим» употребляется редко и воспринимается как архаизм; кроме того, оно легко вызывает ассоциацию именно с пыткой. Еврейское נַעֲנֶה в данном трудном контексте шире: страдание, унижение или смирение. «Унижали» в сочетании с «притесняли» сохраняет смысл без неоправданного сужения.'
  - severity: low
    issue: Формулировка альтернативы «смирял себя» менее естественна по-русски.
    rationale: Для возвратно-среднего прочтения נַעֲנֶה современнее и точнее по-русски сказать «смирялся»; это не навязывает богословского толкования и сохраняет отмеченную текстовую неоднозначность.
  revised_text: Его притесняли и унижали, но он не открывал уст; как ягнёнок, которого ведут на заклание, и как овца, безмолвная перед теми, кто стрижёт её, так он не открывал уст.
