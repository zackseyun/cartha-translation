source:
  edition: WLC
  text: לָ/כֵ֞ן אֲחַלֶּק ל֣/וֹ בָ/רַבִּ֗ים וְ/אֶת עֲצוּמִים֮ יְחַלֵּ֣ק שָׁלָל֒ תַּ֗חַת אֲשֶׁ֨ר הֶעֱרָ֤ה לַ/מָּ֨וֶת֙ נַפְשׁ֔/וֹ וְ/אֶת פֹּשְׁעִ֖ים נִמְנָ֑ה וְ/הוּא֙ חֵטְא רַבִּ֣ים נָשָׂ֔א וְ/לַ/פֹּשְׁעִ֖ים יַפְגִּֽיעַ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/012.yaml
  text: Therefore I will allot him a portion among the many[a], and he will divide plunder with the strong, because he poured out his life to death and was numbered with transgressors[c][b]; yet he bore the sin of many and intercedes for transgressors.
translation:
  language: ru
  text: Поэтому Я дам ему долю среди многих[a], и с сильными он разделит добычу, потому что предал свою жизнь смерти и был причислен к преступникам[b]. Но он понёс грех многих и ходатайствует за преступников[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я дам ему долю вместе со многими». Еврейская фраза сжата и допускает несколько близких толкований.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «был сочтён одним из преступников».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вступается за преступников». Еврейский глагол здесь обозначает обращение с просьбой за кого-либо, то есть ходатайство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие страданий и последующего возвышения слуги.
- source_word: אֲחַלֶּק לוֹ בָרַבִּים
  choice: Я дам ему долю среди многих
  rationale: Сохраняет образ распределения доли и неоднозначную связь с «многими», не превращая самих многих в долю слуги.
- source_word: עֲצוּמִים
  choice: сильными
  rationale: Обычное значение прилагательного и естественная параллель к образу раздела военной добычи.
- source_word: יְחַלֵּק שָׁלָל
  choice: разделит добычу
  rationale: Естественно передаёт образ победы и распределения захваченного имущества.
- source_word: תַּחַת אֲשֶׁר
  choice: за то что
  rationale: Выражает основание последующего воздаяния и сохраняет оттенок соответствия между поступком и наградой.
- source_word: הֶעֱרָה לַמָּוֶת נַפְשׁוֹ
  choice: отдал свою жизнь на смерть
  rationale: Передаёт смысл добровольного предания жизни смерти; буквальный образ «излил» по-русски здесь менее ясен.
- source_word: וְאֶת פֹּשְׁעִים נִמְנָה
  choice: и был причислен к преступникам
  rationale: Сохраняет пассивное значение и мысль о том, что его сочли принадлежащим к их числу.
- source_word: פֹּשְׁעִים
  choice: преступникам
  rationale: Передаёт нравственно-правовой оттенок нарушения и мятежа лучше, чем общее «грешники», оставаясь понятным современному читателю.
- source_word: וְהוּא
  choice: Но он
  rationale: 'Контекст допускает противительное понимание: он был причислен к преступникам, но нёс грех других.'
- source_word: חֵטְא רַבִּים נָשָׂא
  choice: он понёс грех многих
  rationale: Сохраняет образ несения греха и его представительский или жертвенный потенциал, не разворачивая его в отдельную догматическую формулу.
- source_word: רַבִּים
  choice: многих
  rationale: Прямо сохраняет еврейское «многие», не подменяя его ни «всеми», ни явно ограниченной группой.
- source_word: וְלַפֹּשְׁעִים יַפְגִּיעַ
  choice: и ходатайствует за преступников
  rationale: В данном контексте Hiphil от פגע с לְ естественно означает заступничество или ходатайство; несовершенный вид допускает настоящее обобщающее значение.
theological_decisions:
- issue: Объём значения רַבִּים («многие»)
  choice: многих
  alternative: всех; множества людей
  rationale: Перевод сохраняет формулировку еврейского текста и не решает за читателя вопрос о её полном богословском объёме.
- issue: Смысл נָשָׂא חֵטְא
  choice: понёс грех
  alternative: унёс грех; понёс наказание за грех
  rationale: Формулировка сохраняет жертвенно-представительный смысловой потенциал, но не сводит его к одной позднейшей доктринальной формуле.
- issue: Временной и смысловой оттенок יַפְגִּיעַ
  choice: ходатайствует
  alternative: ходатайствовал; вступался
  rationale: Еврейский имперфект может выражать продолжающееся или обобщённое действие; настоящее время сохраняет эту открытость.
- issue: Отношение וְהוּא к предшествующей части
  choice: Но он
  alternative: И он
  rationale: Противительный союз выявляет контраст, заложенный контекстом, но не меняет содержания утверждений.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; сохранены повтор «многих», образ раздела добычи и богословская напряжённость между причислением к преступникам и несением их греха.
