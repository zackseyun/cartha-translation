  text: וְ/הוּא֙ מְחֹלָ֣ל מִ/פְּשָׁעֵ֔/נוּ מְדֻכָּ֖א מֵ/עֲוֺנֹתֵ֑י/נוּ מוּסַ֤ר שְׁלוֹמֵ֨/נוּ֙ עָלָ֔י/ו וּ/בַ/חֲבֻרָת֖/וֹ נִרְפָּא לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/005.yaml
  text: But he was pierced because of our transgressions[a]; he was crushed because of our iniquities; the chastisement for our peace was upon him[c][b], and by his wound we are healed.
translation:
  language: ru
  text: Но Он был пронзён за наши преступления[a], сокрушён за наши беззакония; наказание, принёсшее нам мир[b], было на Нём, и Его раной[c] мы исцелены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изранен из-за наших преступлений». Еврейское слово может обозначать нанесение раны или пронзение.'
    reason: lexical_alternative
  - marker: b
    text: «Мир» здесь может также означать благополучие и целостность.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Его рубцом», «следом от удара». В еврейском тексте существительное стоит в единственном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Но Он
  rationale: Союз выражает контраст с ошибочной оценкой страдальца в предыдущем стихе; «Но» естественно передаёт этот поворот.
- source_word: מְחֹלָל
  choice: пронзён
  rationale: В контексте телесного страдания и параллелизма с «сокрушён» слово указывает на тяжёлое ранение; «пронзён» сохраняет конкретную жестокость образа, при том что возможно более широкое «изранен».
- source_word: מִפְּשָׁעֵינוּ
  choice: за наши преступления
  rationale: Предлог מִן здесь выражает причинную связь. Русское «за» ёмко передаёт страдание из-за преступлений других, не уточняя сверх текста механизм искупления.
- source_word: מְדֻכָּא
  choice: сокрушён
  rationale: Передаёт силу пассивной формы דכא и тяжесть страдания лучше, чем более слабое «ушиблен».
- source_word: מֵעֲוֺנֹתֵינוּ
  choice: за наши беззакония
  rationale: Сохраняет причинную связь и отличает עָוֹן от פֶּשַׁע, не сводя оба понятия к одному русскому слову.
- source_word: מוּסַר
  choice: наказание
  rationale: В данном контексте слово обозначает тяжёлое исправительное или карательное воздействие. «Наказание» ясно и современно, но не вводит развёрнутую теорию искупления.
- source_word: שְׁלוֹמֵנוּ
  choice: принёсшее нам мир
  rationale: Шалом означает мир, благополучие и целостность. Такая синтаксическая передача ясно выражает связь наказания с нашим миром и остаётся естественной по-русски.
- source_word: עָלָיו
  choice: было на Нём
  rationale: Сохраняет еврейский образ возложенной на страдальца тяжести.
- source_word: וּבַחֲבֻרָתוֹ
  choice: Его раной
  rationale: Существительное стоит в единственном числе и обозначает нанесённую травму; «раной» звучит естественно в современном русском.
- source_word: נִרְפָּא לָנוּ
  choice: мы исцелены
  rationale: Хотя форма глагола морфологически имеет третье лицо единственного числа, сочетание с לָנוּ в контексте идиоматически сообщает, что исцеление дано нам.
theological_decisions:
- issue: Связь страдания раба с грехами других
  choice: 'Сохранена заместительная причинная связь: «за наши преступления… за наши беззакония».'
  alternative: Лишь примерное страдание без несения последствий чужих грехов либо более детализированная формула карательного искупления.
  rationale: Еврейский текст прямо связывает страдание раба с грехами народа и их миром и исцелением, однако не излагает здесь полной теории искупления.
- issue: Объём значений «мир» и «исцелены»
  choice: Термины оставлены широкими, охватывающими восстановление и целостное благополучие.
  alternative: Ограничить смысл только телесным исцелением, только прощением грехов или материальным процветанием.
  rationale: שָׁלוֹם и רפא семантически широки; сужение любого из них устранило бы присутствующую в тексте богословскую многомерность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Рабу, написаны с прописной буквы согласно распространённой русской библейской издательской традиции; синтаксис сделан ясным без устранения смысловой широты שָׁלוֹם и רפא.
