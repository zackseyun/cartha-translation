  text: וַ/יהוָ֞ה חָפֵ֤ץ דַּכְּא/וֹ֙ הֶֽחֱלִ֔י אִם תָּשִׂ֤ים אָשָׁם֙ נַפְשׁ֔/וֹ יִרְאֶ֥ה זֶ֖רַע יַאֲרִ֣יךְ יָמִ֑ים וְ/חֵ֥פֶץ יְהוָ֖ה בְּ/יָד֥/וֹ יִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/010.yaml
  text: Yet it pleased Yahweh to crush him[a]; he made him sick. If his life makes a guilt offering, he will see offspring, he will prolong his days[e][d][c][b], and the pleasure of Yahweh will prosper in his hand.
translation:
  language: ru
  text: Но[a] Господу было угодно сокрушить его; Он поразил его недугом[b]. Если Ты сделаешь его жизнь жертвой повинности[c][d], он увидит потомство, продлит свои дни, и угодное Господу преуспеет в его руке[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский союз можно передать также «и» или «однако»; его значение определяется ходом речи.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Он сделал его больным»; возможны также варианты: «Он подверг его страданию» или «причинил ему скорбь».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейская фраза трудна. Огласовка текста даёт: «Если Ты сделаешь его жизнь жертвой повинности». Возможны и другие понимания, например: «Если его жизнь будет сделана жертвой повинности» или «Если его жизнь принесёт жертву повинности».'
    reason: alternative_reading
  - marker: d
    text: «Жертва повинности» — предписанная Торой жертва за вину, связанная также с возмещением причинённого ущерба.
    reason: cultural_note
  - marker: e
    text: 'Или: «замысел Господа осуществится через него»; еврейское выражение буквально говорит, что угодное Господу «преуспеет в его руке».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Но Господу
  rationale: Союз ו допускает значения «и», «но», «однако»; в данном контексте «но» естественно передаёт контраст с предыдущим описанием страданий. Имя יהוה по принятой русской библейской традиции передано как «Господь».
- source_word: חָפֵץ
  choice: было угодно
  rationale: Передаёт как волю, так и благоволение, сохраняя трудную прямоту еврейского выражения и не истолковывая его как жестокое удовольствие.
- source_word: דַּכְּאוֹ
  choice: сокрушить его
  rationale: Глагол выражает сильное разрушительное воздействие; «сокрушить» точнее по силе, чем «поразить» или традиционное «мучить».
- source_word: הֶחֱלִי
  choice: Он подверг его страданию
  rationale: Каузатив от חלה может означать «сделал больным», «поразил недугом», «причинил страдание». Выбранный вариант естественен по-русски и сохраняет прямое действие Господа, не ограничивая смысл только телесной болезнью.
- source_word: אִם תָּשִׂים אָשָׁם נַפְשׁוֹ
  choice: Если его жизнь будет принесена как жертва повинности
  rationale: 'Синтаксис фразы труден: תשים может пониматься как форма 3-го лица женского рода с נַפְשׁוֹ либо как 2-е лицо мужского рода. Пассивная русская конструкция ясно выражает жертвенный смысл, тогда как возможные субъекты действия сохранены в примечании.'
- source_word: אָשָׁם
  choice: жертва повинности
  rationale: Это установленный термин Торы для жертвы за вину, включающей идею возмещения; он сохраняет культовый контекст.
- source_word: נַפְשׁוֹ
  choice: его жизнь
  rationale: נפש здесь обозначает жизнь или самого человека, а не только нематериальную «душу»; «жизнь» естественно соответствует контексту принесения себя в жертву.
- source_word: יִרְאֶה זֶרַע
  choice: он увидит потомство
  rationale: זרע может означать семя, потомство или потомков. «Потомство» сохраняет ёмкость выражения и не требует исключительно биологического истолкования.
- source_word: יַאֲרִיךְ יָמִים
  choice: продлит свои дни
  rationale: Сохранён прозрачный еврейский оборот, означающий продолжительную жизнь.
- source_word: וְחֵפֶץ יְהוָה
  choice: а то, что угодно Господу
  rationale: Так сохраняется лексическая связь с חָפֵץ в начале стиха и одновременно естественно передаётся значение воли, замысла или благоволения.
- source_word: בְּיָדוֹ יִצְלָח
  choice: преуспеет в его руке
  rationale: Сохранён образ руки как средства действия и успеха; более явное «осуществится через него» дано как допустимое истолкование в примечании.
theological_decisions:
- issue: Участие Господа в страдании раба
  choice: 'Прямая формулировка: «Господу было угодно сокрушить его, Он подверг его страданию».'
  alternative: «Господь допустил, чтобы он был сокрушён» или «позволил страданию постичь его».
  rationale: Еврейские глаголы прямо связывают действие с Господом. Замена действия одним лишь допущением смягчила бы напряжение текста по богословским соображениям.
- issue: Субъект и залог фразы о жертве повинности
  choice: 'В основном тексте: «Если его жизнь будет принесена как жертва повинности».'
  alternative: «Если его жизнь принесёт жертву повинности» или «если Ты принесёшь его жизнь в жертву повинности».
  rationale: Форма תשים и порядок слов допускают разные синтаксические разборы. Основной вариант естественен по-русски и передаёт центральный жертвенный образ, а грамматическая неоднозначность открыто сохранена в примечании.
- issue: Значение потомства и продления дней
  choice: «Он увидит потомство и продлит свои дни».
  alternative: Не уточнять, идёт ли речь о буквальных потомках, духовном потомстве, продолжении рода или иной форме последующего существования.
  rationale: Сам стих соединяет смерть-подобное принесение жизни в жертву с последующим видением потомства и долгими днями. Перевод сохраняет это напряжение, не вводя готового конфессионального объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя, но сохранены ключевые образы «сокрушить», «жертва повинности», «продлит дни» и «в его руке». Неоднозначность трудной жертвенной фразы не скрыта, а вынесена в примечание.
