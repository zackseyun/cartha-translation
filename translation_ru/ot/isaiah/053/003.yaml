id: ISA.53.3
reference: Isaiah 53:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: נִבְזֶה֙ וַ/חֲדַ֣ל אִישִׁ֔ים אִ֥ישׁ מַכְאֹב֖וֹת וִ/יד֣וּעַ חֹ֑לִי וּ/כְ/מַסְתֵּ֤ר פָּנִים֙ מִמֶּ֔/נּוּ נִבְזֶ֖ה וְ/לֹ֥א חֲשַׁבְנֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/003.yaml
  text: He was despised and rejected by men[a], a man of pains and acquainted with sickness; and like one from whom people hide their faces, he was despised[d][c][b], and we did not esteem him.
translation:
  language: ru
  text: Он был презираем и оставлен людьми[a], человек, изведавший боль[b] и знакомый с болезнью[c]; словно тот, от кого скрывают лицо[d], он был презираем, и мы ни во что его не ставили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отвергнут людьми». Еврейское выражение трудно для толкования; буквальная основа указывает на оставленность или лишённость человеческого общества, тогда как традиционный вариант подчёркивает отвержение.'
    reason: alternative_reading
  - marker: b
    text: 'Буквальнее: «человек болей»; возможно также: «человек скорбей».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «познавший немощь». Традиционное «изведавший скорби» менее буквально.'
    reason: lexical_alternative
  - marker: d
    text: 'Еврейская фраза эллиптична: буквально — «словно сокрытие лица от него». Смысл, вероятно, в том, что люди отводили или скрывали от него лицо.'
    reason: cultural_note
lexical_decisions:
- source_word: נִבְזֶה
  choice: презираем
  rationale: Причастная форма породы нифаль обозначает того, кого презирают или считают ничтожным; «презираем» сохраняет страдательное значение и торжественный, но понятный регистр.
- source_word: חֲדַל אִישִׁים
  choice: оставлен людьми
  rationale: Трудное выражение, связанное с חדל («прекращаться, отсутствовать, быть лишённым»), передаёт социальную оставленность. Вариант «отвергнут людьми» контекстуально возможен и приведён в сноске.
- source_word: אִישׁ מַכְאֹבוֹת
  choice: человек, изведавший боль
  rationale: מַכְאֹב обозначает боль и страдание, телесное или душевное. Такая формулировка звучит естественнее буквального «человек болей» и не сводит смысл только к печали.
- source_word: וִידוּעַ חֹלִי
  choice: знакомый с болезнью
  rationale: חֹלִי прежде всего означает болезнь или немощь, а форма от ידע выражает близкое знакомство, приобретённое опытом. Перевод сохраняет конкретность еврейского образа.
- source_word: וּכְמַסְתֵּר פָּנִים מִמֶּנּוּ
  choice: словно тот, от кого скрывают лицо
  rationale: Еврейская конструкция эллиптична. Русская формулировка сохраняет образ сокрытия лица и направление, выраженное מִן, не уточняя без необходимости подразумеваемого действующего лица.
- source_word: וְלֹא חֲשַׁבְנֻהוּ
  choice: мы ни во что его не ставили
  rationale: חשב здесь значит «считать, расценивать, придавать значение». Русское устойчивое выражение естественно передаёт отрицательную оценку и пренебрежение.
theological_decisions:
- issue: Мессианское истолкование образа раба
  choice: Сохранить портрет страдающего раба в собственных формулировках стиха, не добавляя прямых христологических обозначений.
  alternative: Внести в перевод явное христологическое пояснение.
  rationale: Еврейский текст не называет здесь личность раба. Перевод оставляет открытым каноническое и богословское прочтение, не превращая его в добавление к исходному тексту.
- issue: Характер страданий
  choice: Передать конкретные понятия боли и болезни, сохранив возможность как телесного, так и душевного страдания.
  alternative: Использовать традиционную пару «скорби» и «горе».
  rationale: מַכְאֹבוֹת и חֹלִי имеют конкретные значения «боли» и «болезни/немощи». Такой перевод не сужает страдание ни до физического заболевания, ни до эмоциональной печали.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены повтор слова «презираем», исповедальное «мы» и эллиптический образ сокрытого лица; избегаются архаизмы вроде «муж скорбей» и конфессиональные добавления.
