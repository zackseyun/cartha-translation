  text: מִ֥י הֶאֱמִ֖ין לִ/שְׁמֻעָתֵ֑/נוּ וּ/זְר֥וֹעַ יְהוָ֖ה עַל מִ֥י נִגְלָֽתָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/001.yaml
  text: Who has believed our report[a], and to whom has the arm of Yahweh been revealed?
translation:
  language: ru
  text: Кто поверил нашей вести[a], и кому открылась рука Яхве?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашему сообщению»; возможно также: «тому, что мы услышали». Еврейское слово может означать услышанное, полученное известие или провозглашённую весть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Кто
  rationale: Вопросительное местоимение вводит риторический вопрос; прямое и естественное соответствие в русском языке.
- source_word: הֶאֱמִין
  choice: поверил
  rationale: Порода hифиль глагола אמן здесь означает «верить, доверять». Русское совершенное прошедшее естественно передаёт вопрос о том, кто действительно принял весть с верой.
- source_word: לִשְׁמֻעָתֵנוּ
  choice: нашей вести
  rationale: שְׁמוּעָה может обозначать услышанное, известие, весть или сообщение. «Нашей вести» естественно сочетается с глаголом «поверить» и сохраняет смысл провозглашаемого сообщения; более буквальная связь со слышанием отмечена в сноске.
- source_word: וּזְרוֹעַ
  choice: и ... рука
  rationale: זְרוֹעַ буквально обозначает руку как образ силы. Метафора сохранена, а не заменена толкованием «сила» или «могущество».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: עַל מִי
  choice: кому
  rationale: При глаголе откровения русское «кому» естественно обозначает того, кому нечто явлено, не утрачивая значения еврейской конструкции.
- source_word: נִגְלָתָה
  choice: открылась
  rationale: Нифаль от גלה означает «открыться, быть явленным». Форма «открылась» грамматически согласуется с «рука» и сохраняет образное выражение исходного текста.
theological_decisions:
- issue: Образ «рука Яхве»
  choice: Сохранить метафору «рука Яхве» в основном тексте
  alternative: могущество Яхве
  rationale: Этот библейский образ указывает на явленную силу Бога, особенно в спасении и суде. Его буквальное сохранение поддерживает межтекстовые связи и не подменяет перевод толкованием.
- issue: Смысл שְׁמוּעָה
  choice: наша весть
  alternative: то, что мы услышали; наше сообщение
  rationale: Слово допускает как значение услышанного известия, так и значение передаваемой вести. Основной вариант естественен по-русски, а сноска сохраняет подлинную лексическую широту.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческой речи. Синтаксический параллелизм двух риторических вопросов и исходная метафора сохранены.
