source:
  edition: WLC
  text: אָכֵ֤ן חֳלָיֵ֨/נוּ֙ ה֣וּא נָשָׂ֔א וּ/מַכְאֹבֵ֖י/נוּ סְבָלָ֑/ם וַ/אֲנַ֣חְנוּ חֲשַׁבְנֻ֔/הוּ נָג֛וּעַ מֻכֵּ֥ה אֱלֹהִ֖ים וּ/מְעֻנֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/004.yaml
  text: Surely he has borne our sicknesses and carried our pains[a]; yet we considered him stricken, struck by God[b], and afflicted.
translation:
  language: ru
  text: Но ведь это он понёс наши болезни и взял на себя наши боли[a]. А мы считали его поражённым, Богом поражённым[b] и угнетённым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши скорби» и «наши страдания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Богом сражённым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Но ведь
  rationale: Частица вводит настойчивое исправление прежнего ошибочного восприятия; в русском «но ведь» естественно передаёт и утверждение, и контраст.
- source_word: חֳלָיֵנוּ
  choice: наши болезни
  rationale: Существительное прежде всего обозначает болезнь или недуг, а не только душевную скорбь.
- source_word: נָשָׂא
  choice: понёс
  rationale: Глагол выражает принятие и несение бремени; «понёс» сохраняет образ нагрузки и высокий, но современный регистр.
- source_word: וּמַכְאֹבֵינוּ
  choice: наши боли
  rationale: Слово прямо обозначает боль, нередко физическую; это точнее традиционного обобщения «скорби».
- source_word: סְבָלָם
  choice: взял на себя
  rationale: Глагол означает нести груз. Выражение естественно по-русски передаёт принятие чужого бремени и отличает его от נָשָׂא.
- source_word: וַאֲנַחְנוּ
  choice: А мы
  rationale: Союз с явно выраженным местоимением вводит резкий контраст между действительностью и человеческой оценкой.
- source_word: חֲשַׁבְנֻהוּ
  choice: считали, что он
  rationale: Передаёт значение «полагать, считать кем-либо» ясным современным русским оборотом.
- source_word: נָגוּעַ
  choice: поражён
  rationale: Причастие обозначает поражённого ударом или бедствием, не уточняя природу поражения.
- source_word: מֻכֵּה אֱלֹהִים
  choice: Богом наказан
  rationale: Передаёт воспринятую людьми мысль о Божьем карающем ударе; буквальная форма «Богом поражён» приведена в сноске, чтобы сохранить прямую образность и избежать неявного снятия неоднозначности.
- source_word: וּמְעֻנֶּה
  choice: и унижен
  rationale: Причастие допускает значения страдания, угнетения и унижения; «унижен» сохраняет отдельный оттенок рядом с уже употреблённым «поражён».
theological_decisions:
- issue: Конкретная болезнь и боль или обобщённые скорби
  choice: 'В основном тексте: «наши болезни» и «наши боли»'
  alternative: «наши немощи/скорби» и «наши страдания/печали»
  rationale: Еврейские существительные наиболее непосредственно обозначают болезнь и боль. Более широкое применение текста не должно вытеснять их конкретный лексический смысл.
- issue: Явность Божьего действия в מֻכֵּה אֱלֹהִים
  choice: «Богом наказан» с буквальной альтернативой в сноске
  alternative: «Богом поражён»
  rationale: Божье действие нельзя скрывать. Вместе с тем вся формулировка находится внутри ошибочной человеческой оценки («мы считали»), поэтому перевод не утверждает эту оценку как окончательное объяснение страданий слуги.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического пророческого текста. Параллелизм сохранён, но синтаксис сделан понятным обычному читателю; контраст между действительным несением страданий и человеческой оценкой передан двумя предложениями.
