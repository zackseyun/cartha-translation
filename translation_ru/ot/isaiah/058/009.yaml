id: ISA.58.9
reference: Isaiah 58:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אָ֤ז תִּקְרָא֙ וַ/יהוָ֣ה יַעֲנֶ֔ה תְּשַׁוַּ֖ע וְ/יֹאמַ֣ר הִנֵּ֑/נִי אִם תָּסִ֤יר מִ/תּֽוֹכְ/ךָ֙ מוֹטָ֔ה שְׁלַ֥ח אֶצְבַּ֖ע וְ/דַבֶּר אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/009.yaml
  text: Then you will call[a], and Yahweh will answer; you will cry for help, and he will say, ‘Here I am.’ If you remove from your midst the yoke, the pointing of the finger, and speaking wickedness[c][b],
translation:
  language: ru
  text: 'Тогда ты воззовёшь — и Яхве ответит; позовёшь на помощь — и Он скажет: «Вот Я!» Если ты удалишь из своей среды ярмо[a], перестанешь указывать пальцем[b] и говорить злое[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ярмо» — образ угнетения и тяжёлого бремени, возлагаемого на других.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «протягивание пальца»; вероятно, имеется в виду обвинительный или презрительный жест.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможные варианты: «говорить неправду», «вести злонамеренные речи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временно-следственную связь с условиями, изложенными в предыдущем контексте.
- source_word: תִּקְרָא
  choice: ты воззовёшь
  rationale: В контексте молитвы выражает обращение к Богу; «воззовёшь» сохраняет возвышенный пророческий регистр и отличается от следующего, более настойчивого зова о помощи.
- source_word: וַיהוָה
  choice: и Яхве
  rationale: Передаёт личное имя Бога יהוה транслитерацией, а не заменяет его титулом.
- source_word: יַעֲנֶה
  choice: ответит
  rationale: Прямо сохраняет соответствие между обращением человека и Божьим ответом.
- source_word: תְּשַׁוַּע
  choice: позовёшь на помощь
  rationale: Форма от שׁוע обозначает настойчивый зов о помощи; перевод выражает эту смысловую окраску естественно по-русски.
- source_word: הִנֵּנִי
  choice: Вот Я!
  rationale: Краткая формула присутствия и готовности откликнуться; сохраняет непосредственность еврейского выражения.
- source_word: אִם תָּסִיר מִתּוֹכְךָ
  choice: Если ты удалишь из своей среды
  rationale: 'Сохраняет условное значение אִם и общественный оттенок מִתּוֹכְךָ: речь идёт о зле внутри общины или окружения адресата.'
- source_word: מוֹטָה
  choice: ярмо
  rationale: Сохраняет конкретную метафору бруса ярма, обозначающую угнетение и возложенное на других бремя.
- source_word: שְׁלַח אֶצְבַּע
  choice: перестанешь указывать пальцем
  rationale: Буквально выражение означает протягивание или выставление пальца; естественный русский оборот передаёт обвинительный либо презрительный жест.
- source_word: וְדַבֶּר אָוֶן
  choice: и говорить злое
  rationale: Сохраняет широкое значение אָוֶן, которое может охватывать злонамеренную, пагубную или лживую речь, не сужая его до одного вида проступка.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией, без замены титулом.
- issue: Характер Божьего ответа הִנֵּנִי
  choice: «Вот Я!»
  alternative: «Я здесь!»
  rationale: «Вот Я!» сохраняет библейскую формулу личного присутствия и готовности ответить, не добавляя богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Единственное число «ты» сохранено вслед за еврейским текстом; при этом выражение «из своей среды» удерживает общественный смысл увещания. Заключительная запятая показывает, что условная конструкция продолжается в следующем стихе.
