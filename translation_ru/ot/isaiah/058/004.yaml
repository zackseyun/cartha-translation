base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/004.yaml
  text: Look[a], you fast for strife and contention, and to strike with a wicked fist[b]. You are not fasting today to make your voice heard on high.
translation:
  language: ru
  text: Вот, вы поститесь ради ссор и распрей, чтобы бить кулаком нечестия[a]. При таком посте, как сегодня, ваш голос не будет услышан в вышине[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кулаком нечестия».'
    reason: lexical_alternative
  - marker: b
    text: «В вышине» может означать небесную сферу, то есть быть услышанными Богом.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт эмфатический призыв обратить внимание и сохраняет обличительную силу без архаичного оттенка.
- source_word: לְרִיב וּמַצָּה
  choice: ради ссор и распрей
  rationale: Оба существительных обозначают конфликт и препирательство; парное выражение естественно по-русски и сохраняет смысловую близость слов.
- source_word: תָּצוּמוּ
  choice: вы поститесь
  rationale: Форма 2-го лица множественного числа в контексте описывает совершаемое адресатами действие.
- source_word: וּלְהַכּוֹת בְּאֶגְרֹף רֶשַׁע
  choice: и бьёте нечестивым кулаком
  rationale: Целевая конструкция по-русски естественно передана однородным сказуемым; выражение сохраняет образ физического насилия и нравственную оценку.
- source_word: לֹא תָצוּמוּ כַיּוֹם
  choice: Не так нужно поститься, как сегодня
  rationale: 'Сохраняет сравнительную силу כַּיּוֹם и передаёт запретительно-обличительный смысл: нынешний образ поста не ведёт к заявленной цели.'
- source_word: לְהַשְׁמִיעַ ... קוֹלְכֶם
  choice: чтобы ваш голос был услышан
  rationale: Естественно передаёт каузативное значение Hiphil — «сделать так, чтобы голос услышали».
- source_word: בַּמָּרוֹם
  choice: в вышине
  rationale: Сохраняет пространственный образ и вероятный намёк на небесную сферу, не подставляя прямо слова «Бог» или «небо».
theological_decisions:
- issue: Кто слышит голос «в вышине»
  choice: Оставить пространственное выражение «в вышине»
  alternative: «на небесах» или «пред Богом»
  rationale: Еврейский текст подразумевает небесную, божественную сферу, но прямо не называет ни Бога, ни небо; перевод сохраняет эту недосказанность.
- issue: Связь отрицания с нынешним способом поста и его целью
  choice: «Не так нужно поститься, как сегодня, чтобы…»
  alternative: «Сегодня вы поститесь не для того, чтобы…»
  rationale: Так сохраняется сравнительный элемент כַּיּוֹם и мысль, что именно нынешний характер поста несовместим с желанием быть услышанными.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обличения. «Вот» служит ясным вводным возгласом; «ссоры и распри» понятны широкому читателю. Синтаксис последней фразы сохраняет неоднозначность еврейского текста, оставаясь естественным по-русски.
