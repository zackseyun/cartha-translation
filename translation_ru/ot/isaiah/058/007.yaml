base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/007.yaml
  text: Is it not to share your bread with the hungry[a], and bring the poor who are cast out into your house? When you see the naked, to cover him[b], and not hide yourself from your own flesh?
translation:
  language: ru
  text: 'Не в том ли состоит пост: разделить свой хлеб с голодным, привести в свой дом бедных, лишённых крова[a]? Когда увидишь нагого — одеть его и не скрываться от своей плоти[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово допускает значения «изгнанные», «скитающиеся» или «бездомные»; вероятно, речь идёт о бедных, оставшихся без пристанища.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от своей плоти». Это выражение может означать родных или близких по крови, а в более широком смысле — людей, связанных общей человеческой природой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹס
  choice: разделить
  rationale: Глагол буквально обозначает разделение или разламывание хлеба; «разделить свой хлеб с голодным» естественно передаёт конкретный образ и смысл милосердного участия.
- source_word: לָרָעֵב
  choice: с голодным
  rationale: Предлог обозначает получателя; при русском обороте «разделить хлеб» сочетание «с голодным» звучит естественно и ясно указывает, кому оказывается помощь.
- source_word: לַחְמֶךָ
  choice: свой хлеб
  rationale: Сохранён конкретный библейский образ хлеба, который в контексте также может обозначать пищу вообще.
- source_word: עֲנִיִּים מְרוּדִים
  choice: бедных, лишённых крова
  rationale: עֲנִיִּים означает бедных или нуждающихся, а редкое מְרוּדִים, вероятно, указывает на изгнанных, скитающихся либо оставшихся без пристанища. Перевод передаёт вероятный смысл, не вводя узкой современной категории.
- source_word: תָּבִיא בָיִת
  choice: привести в свой дом
  rationale: Каузативная форма глагола «входить» вместе со словом «дом» выражает принятие нуждающихся в собственный дом.
- source_word: כִּי תִרְאֶה
  choice: когда увидишь
  rationale: כִּי здесь вводит обстоятельство в ряду требуемых поступков; «когда» передаёт это естественнее, чем гипотетическое «если».
- source_word: עָרֹם
  choice: нагого
  rationale: Прилагательное употреблено как существительное в единственном числе; «нагого» сохраняет образ и возвышенный пророческий регистр.
- source_word: וְכִסִּיתוֹ
  choice: одеть его
  rationale: Буквально глагол означает «покрыть», но применительно к нагому по-русски яснее и естественнее «одеть», то есть снабдить одеждой.
- source_word: וּמִבְּשָׂרְךָ
  choice: от своей плоти
  rationale: Сохранена еврейская метафора, которая может указывать на родных и вместе с тем допускать более широкую человеческую солидарность.
- source_word: לֹא תִתְעַלָּם
  choice: не скрываться
  rationale: Возвратная форма выражает сокрытие или уклонение от человека; буквальный и выразительный оборот сохраняет образ исходного текста.
theological_decisions:
- issue: Круг людей, обозначенных выражением «твоя плоть»
  choice: Сохранить идиому «своя плоть», не сужая её значения.
  alternative: «твои родные» или «твои родственники»
  rationale: Выражение прежде всего может относиться к близким по крови, однако его образность допускает более широкую нравственную связь между людьми. Сохранение идиомы не снимает заложенную в тексте смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с dignified пророческой интонацией. Синтаксический параллелизм исходного стиха сохранён; архаизмы сведены к понятному и выразительному слову «нагого». Метафора «своя плоть» оставлена в основном тексте и пояснена в сноске.
