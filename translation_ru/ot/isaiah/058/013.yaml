base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/013.yaml
  text: If you turn back your foot from the Sabbath[a], from doing your own pleasure on my holy day, and call the Sabbath a delight, the holy thing of Yahweh honorable, and honor it by not going your own ways, nor seeking your own pleasure, nor speaking a word[c][b],
translation:
  language: ru
  text: Если ты перестанешь попирать субботу, делать угодное тебе в Мой святой день, если назовёшь субботу отрадой, а святой день Яхве — почитаемым, и почтишь её[a], не следуя своими путями, не ища угодного тебе[b] и не говоря своих слов[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и почтишь Его», если местоимение относится к Яхве, а не к субботе.'
    reason: alternative_reading
  - marker: b
    text: Еврейское выражение может также означать «не ища своего удовольствия», «своей выгоды» или «не занимаясь своими делами».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не говоря слова». Возможно, речь идёт об обычных, своекорыстных или праздных разговорах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב מִשַּׁבָּת רַגְלֶךָ
  choice: ради субботы ты удержишь свою ногу
  rationale: Передаёт конкретный образ удержанной ноги, но избегает неясного для русского читателя оборота «отведёшь ногу от субботы», который можно ошибочно понять как уклонение от соблюдения субботы. Предлог מִן здесь прочитан в контексте воздержания ради святости дня.
- source_word: עֲשׂוֹת חֲפָצֶיךָ
  choice: не делать угодного тебе
  rationale: חֵפֶץ может обозначать желание, удовольствие, личное занятие или дело. Формулировка сохраняет широту значения и связь с повторным חֶפְצְךָ далее в стихе.
- source_word: וְקָרָאתָ לַשַּׁבָּת עֹנֶג
  choice: назовёшь субботу отрадой
  rationale: «Отрада» естественно и достойно передаёт עֹנֶג как наслаждение и источник радости, сохраняя именную конструкцию оригинала.
- source_word: לִקְדוֹשׁ יְהוָה מְכֻבָּד
  choice: святыню Яхве — почитаемой
  rationale: Сжатая еврейская конструкция представлена как параллель к «назовёшь субботу отрадой». «Святыня» сохраняет субстантивированное קְדוֹשׁ, не добавляя отсутствующее в тексте слово «день».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: מֵעֲשׂוֹת דְּרָכֶיךָ
  choice: не следуя своими путями
  rationale: Сохраняет метафору «путей» как собственного образа действий и звучит естественно по-русски.
- source_word: מִמְּצוֹא חֶפְצְךָ
  choice: не ища угодного тебе
  rationale: Сохраняет повтор корня חפץ и допускает значения личного желания, удовольствия и собственной выгоды или дела.
- source_word: וְדַבֵּר דָּבָר
  choice: не говоря своих слов
  rationale: Контекстуальная формулировка связывает последнюю фразу с рядом собственных путей и желаний, но не сводит её однозначно к праздной речи или деловым разговорам; буквальность и диапазон смысла отмечены в сноске.
theological_decisions:
- issue: Референт местоименного суффикса в וְכִבַּדְתּוֹ
  choice: 'Местоимение отнесено к субботе/святыне: «почтишь её».'
  alternative: 'Местоимение может быть отнесено к Яхве: «почтишь Его».'
  rationale: 'Ход фразы сосредоточен на должном отношении к субботе: её называют отрадой и почитаемой, а затем чтут соответствующим поведением. Однако ближайшее упоминание Яхве делает иной референт грамматически возможным, поэтому он сохранён в сноске.'
- issue: Содержание запрета וְדַבֵּר דָּבָר
  choice: «не говоря своих слов» с пояснением неопределённости в сноске.
  alternative: «не говоря пустых слов», «не говоря о своих делах» или буквально «не говоря слова».
  rationale: Оригинал предельно краток и не называет прямо ни праздную речь, ни деловые разговоры. Перевод следует контексту параллельных выражений, не превращая одно возможное толкование в бесспорный смысл.
translation_notes:
  register: Современный литературный русский язык с обращением во втором лице единственного числа, соответствующим еврейскому тексту. Сохранены образ удержанной ноги, параллелизм личных путей и желаний и торжественное обозначение субботы как святыни Яхве. Прописная буква в «Мой» отражает речь Бога и русскую издательскую традицию; пунктуация оставляет стих открытым к продолжению в Ис 58:14.
