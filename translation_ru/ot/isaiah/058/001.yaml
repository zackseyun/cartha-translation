base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/001.yaml
  text: Cry out with your throat[a]; do not hold back. Raise your voice like a trumpet, and declare to my people their rebellion[b], and to the house of Jacob their sins.
translation:
  language: ru
  text: Взывай во всё горло, не сдерживайся! Возвысь свой голос, словно труба[a], и возвести Моему народу об их мятеже[b], дому Иакова — об их грехах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «словно шофар»; шофар — рог, обычно бараний, служивший для подачи сигналов.'
    reason: cultural_note
  - marker: b
    text: 'Или: «об их преступлении»; еврейское слово может подчёркивать сознательное неповиновение и бунт против Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא בְגָרוֹן
  choice: Взывай во всё горло
  rationale: Передаёт повеление громко и настойчиво провозглашать, сохраняя телесную образность буквального выражения «горлом» в естественной русской идиоме.
- source_word: אַל תַּחְשֹׂךְ
  choice: не сдерживайся
  rationale: Глагол в данном контексте означает не удерживать и не приглушать провозглашение; выбранная формулировка естественна по-русски.
- source_word: כַּשּׁוֹפָר
  choice: словно труба
  rationale: Шофар — сигнальный духовой инструмент из рога. «Труба» ясно передаёт его функцию для современного читателя, а конкретная реалия поясняется в сноске.
- source_word: הָרֵם קוֹלֶךָ
  choice: Возвысь свой голос
  rationale: Сохраняет образ подъёма голоса и торжественный пророческий регистр, оставаясь понятным в современном русском языке.
- source_word: וְהַגֵּד
  choice: и возвести
  rationale: Передаёт прямое, властное и публичное объявление, требуемое пророческим контекстом.
- source_word: לְעַמִּי
  choice: Моему народу
  rationale: Сохраняет притяжательное обозначение и подразумеваемую им заветную связь.
- source_word: פִּשְׁעָם
  choice: о его мятеже
  rationale: Слово פֶּשַׁע обозначает не просто проступок, а сознательное нарушение верности, непокорность или бунт. «Мятеж» сохраняет этот сильный оттенок.
- source_word: וּלְבֵית יַעֲקֹב
  choice: дому Иакова
  rationale: Сохраняет отдельное параллельное обозначение народа и традиционный библейский оборот.
- source_word: חַטֹּאתָם
  choice: о его грехах
  rationale: Передаёт множественное число еврейского существительного; местоимение согласовано с русским собирательным выражением «дом Иакова».
theological_decisions:
- issue: Соотношение выражений «Мой народ» и «дом Иакова»
  choice: Оба обозначения сохранены как отдельные параллельные адресаты обличения.
  alternative: Понять «дом Иакова» лишь как приложение и слить обе части в одно выражение.
  rationale: Еврейский текст выстраивает два параллельных дополнения. Их раздельная передача сохраняет риторическое усиление и заветную терминологию, не снимая возможной смысловой близости.
- issue: Смысл פֶּשַׁע
  choice: мятеж
  alternative: преступление
  rationale: Выбор сохраняет характерный для слова оттенок сознательного восстания против Бога, не сводя его к общему понятию проступка; более широкая альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным пророческим звучанием. Императивы переданы энергично; параллелизм двух адресатов и двух обвинений сохранён. Маркер сноски о шофаре поставлен при слове «труба», к которому относится пояснение.
