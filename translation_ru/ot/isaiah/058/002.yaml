  text: וְ/אוֹתִ֗/י י֥וֹם יוֹם֙ יִדְרֹשׁ֔וּ/ן וְ/דַ֥עַת דְּרָכַ֖/י יֶחְפָּצ֑וּ/ן כְּ/ג֞וֹי אֲשֶׁר צְדָקָ֣ה עָשָׂ֗ה וּ/מִשְׁפַּ֤ט אֱלֹהָי/ו֙ לֹ֣א עָזָ֔ב יִשְׁאָל֨וּ/נִי֙ מִשְׁפְּטֵי צֶ֔דֶק קִרְבַ֥ת אֱלֹהִ֖ים יֶחְפָּצֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/002.yaml
  text: Yet day after day they seek me[a], and they delight to know my ways, as if they were a nation that practiced righteousness and had not forsaken the justice of its God. They ask me for righteous judgments; they delight in the nearness of God.
translation:
  language: ru
  text: Но Меня они ищут изо дня в день и желают знать Мои пути, словно народ, который поступает праведно и не оставляет законов своего Бога. Они спрашивают Меня о праведных решениях; они желают близости Бога[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приближения к Богу». Еврейское выражение может означать как близость Бога, так и приближение к Нему.'
    reason: Сохранение смысловой неоднозначности קִרְבַת אֱלֹהִים.
lexical_decisions:
- source_word: וְאוֹתִי יוֹם יוֹם יִדְרֹשׁוּן
  choice: Но Меня они ищут изо дня в день
  rationale: «Но» передаёт контекстуальное противопоставление обличению в предыдущем стихе; «изо дня в день» сохраняет распределительное повторение יוֹם יוֹם, а «ищут» естественно передаёт религиозное искание или обращение к Богу.
- source_word: וְדַעַת דְּרָכַי יֶחְפָּצוּן
  choice: и желают знать Мои пути
  rationale: Передаёт как волевой оттенок חפץ, так и познавательный смысл דַּעַת; современная русская формулировка не утяжелена отвлечённым оборотом «знания Моих путей».
- source_word: כְּגוֹי אֲשֶׁר
  choice: словно народ, который
  rationale: «Словно» сохраняет сравнительную и контекстуально ироническую силу конструкции, не превращая подразумеваемое притворство в прямое утверждение.
- source_word: צְדָקָה עָשָׂה
  choice: поступает праведно
  rationale: Естественно передаёт еврейскую идиому «делать праведность» и сохраняет её этическое содержание.
- source_word: וּמִשְׁפַּט אֱלֹהָיו לֹא עָזָב
  choice: и не оставляет правосудия своего Бога
  rationale: מִשְׁפָּט допускает значения суда, установления и справедливого порядка. «Правосудие» сохраняет юридико-нравственный оттенок и связь с последующим מִשְׁפְּטֵי.
- source_word: יִשְׁאָלוּנִי מִשְׁפְּטֵי צֶדֶק
  choice: Они спрашивают Меня о праведных решениях
  rationale: «Спрашивают ... о» естественно передаёт обращение за ответом, а «праведные решения» сохраняет возможный смысл судебных решений или постановлений, соответствующих праведности.
- source_word: קִרְבַת אֱלֹהִים יֶחְפָּצוּן
  choice: близости Бога они желают
  rationale: «Близость Бога» сохраняет именную форму קִרְבָה и не снимает полностью неоднозначность между Божьей близостью и приближением к Богу; инверсия отражает эмфатическое начальное положение словосочетания.
theological_decisions:
- issue: Степень явного выражения иронии в сравнении
  choice: «словно народ, который...»
  alternative: «как если бы они были народом, который...»
  rationale: Контекст обличения придаёт сравнению иронический смысл, однако более сдержанное «словно» позволяет самому контексту раскрыть эту иронию и не усиливает её сверх еврейского текста.
- issue: Значение קִרְבַת אֱלֹהִים
  choice: «близости Бога» в основном тексте
  alternative: «приближения к Богу»
  rationale: Еврейское словосочетание может обозначать как близость Бога, так и приближение человека к Нему. Основной текст сохраняет номинальную форму, а сноска отмечает альтернативу, не устраняя подлинную неоднозначность.
- issue: Значение מִשְׁפָּט в выражении о Боге
  choice: «правосудия своего Бога»
  alternative: «установлений своего Бога»
  rationale: В контексте Ис 58 слово охватывает Божий справедливый порядок и требования. «Правосудие» поддерживает нравственно-судебную тему стиха, тогда как «установления» могло бы неоправданно сузить смысл до предписаний.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; повтор «желают» сохраняет лексическую связь двух употреблений חפץ. Заглавные буквы в местоимениях Бога использованы последовательно с принятой русской библейской традицией.
