revisions:
- from: Но Меня они ищут изо дня в день и желают знать Мои пути, словно народ, который поступает праведно и не оставляет правосудия своего Бога. Они спрашивают Меня о праведных решениях; близости Бога[a] они желают.
  to: Но Меня они ищут изо дня в день и желают знать Мои пути, словно народ, который поступает праведно и не оставляет законов своего Бога. Они спрашивают Меня о праведных решениях; они желают близости Бога[a].
  rationale: Перевод уточнён только там, где русское «правосудия своего Бога» могло затемнить объект, которого народ не оставляет. «Законов своего Бога» передаёт нормативно-правовой диапазон מִשְׁפָּט в данном контексте. Порядок слов в последней клаузе нормализован для естественного современного русского, при сохранении повторённого «желают» и сноски, фиксирующей подлинную неоднозначность קִרְבַת אֱלֹהִים.
