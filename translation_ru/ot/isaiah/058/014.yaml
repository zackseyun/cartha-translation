  terminology: '«Яхве», «наследие», «Иаков, твой отец» и «уста Яхве» выбраны верно. Сноска b удачно поясняет заветно-родовой идиом. В сноске a следует не называть исходный образ только буквальным и не противопоставлять ему основной текст: сам образ езды должен быть в основном тексте.'
