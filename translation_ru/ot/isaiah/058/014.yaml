  text: אָ֗ז תִּתְעַנַּג֙ עַל יְהוָ֔ה וְ/הִרְכַּבְתִּ֖י/ךָ עַל בָּ֣מֳותֵי אָ֑רֶץ וְ/הַאֲכַלְתִּ֗י/ךָ נַחֲלַת֙ יַעֲקֹ֣ב אָבִ֔י/ךָ כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/014.yaml
  text: then you will delight yourself in Yahweh[a], and I will make you ride on the heights of the earth; I will feed you with the inheritance of Jacob your father[b], for the mouth of Yahweh has spoken.
translation:
  language: ru
  text: 'тогда ты будешь радоваться в Яхве,


    и Я дам тебе ездить по высотам земли[a],


    и насыщу тебя наследием Иакова, твоего отца[b],


    ибо уста Яхве изрекли это.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также перевод: «по высотам страны».'
    reason: lexical_alternative
  - marker: b
    text: То есть Иакова, праотца народа; выражение передаёт семейный язык завета.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְעַנַּג עַל
  choice: будешь находить радость в
  rationale: Возвратная форма глагола выражает глубокое наслаждение и радость; сочетание с предлогом עַל и именем Яхве естественно передаётся по-русски как «находить радость в Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: וְהִרְכַּבְתִּיךָ
  choice: Я вознесу тебя
  rationale: Каузативная форма буквально означает «заставлю тебя ехать / дам тебе ехать». В сочетании с «высотами земли» русский глагол «вознесу» естественно передаёт образ возвышения, не сводя его к одному конкретному виду благословения; буквальный образ отмечен в сноске.
- source_word: בָּמוֹתֵי אָרֶץ
  choice: на высоты земли
  rationale: Сохраняется поэтический образ высот без истолкования его исключительно как военной победы, процветания, географического возвышения или языческих культовых мест.
- source_word: וְהַאֲכַלְתִּיךָ
  choice: буду питать тебя
  rationale: Каузатив глагола אכל значит «дать есть, кормить». «Буду питать тебя» естественно сочетается с образным объектом «наследием» и выражает дарованное пользование благословением.
- source_word: נַחֲלַת יַעֲקֹב אָבִיךָ
  choice: наследием Иакова, твоего отца
  rationale: «Наследие» сохраняет заветный смысл נחלה, а буквальное родственное обозначение «твоего отца» удерживает семейно-заветный язык исходного текста.
- source_word: כִּי פִּי יְהוָה דִּבֵּר
  choice: ибо это изрекли уста Яхве
  rationale: Сохранён явный образ «уст Яхве» и торжественная завершённость пророческой формулы; местоимение «это» естественно выражает подразумеваемый объект речи.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл выражения «высоты земли»
  choice: Сохранить открытый поэтический образ возвышения и благословения
  alternative: Победоносное господство над землёй; процветание в земле; буквальное пребывание на возвышенностях
  rationale: Сам стих не ограничивает метафору одним военным, территориальным или материальным смыслом, поэтому перевод не должен устранять её богословскую широту.
- issue: «Иаков, твой отец»
  choice: Сохранить родственное обозначение в основном тексте
  alternative: Иаков, твой предок
  rationale: Буквальная формулировка выражает принадлежность народа к семье завета; пояснение в сноске предотвращает ошибочное понимание как указания на непосредственного отца адресата.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим строем. Синтаксис остаётся ясным для обычного читателя; образы «высот земли», «наследия» и «уст Яхве» сохранены, а не заменены толкованием.
