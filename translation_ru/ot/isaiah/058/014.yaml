  source_fidelity: 'Основной смысл передан точно: радость в Яхве, высоты земли, наследие Иакова и заверительная формула сохранены. Однако «вознесу тебя» заменяет каузативный образ «дам тебе ездить/восседать» интерпретацией возвышения, а «буду питать» необоснованно меняет еврейские последовательные будущие формы на длительное действие. «Это изрекли уста» грамматически возможно, но менее точно и естественно, чем единственное число «уста Яхве изрекли».'
