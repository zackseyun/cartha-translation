source:
  edition: WLC
  text: לָ֤/מָּה צַּ֨מְנוּ֙ וְ/לֹ֣א רָאִ֔יתָ עִנִּ֥ינוּ נַפְשֵׁ֖/נוּ וְ/לֹ֣א תֵדָ֑ע הֵ֣ן בְּ/י֤וֹם צֹֽמְ/כֶם֙ תִּמְצְאוּ חֵ֔פֶץ וְ/כָל עַצְּבֵי/כֶ֖ם תִּנְגֹּֽשׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/003.yaml
  text: Why have we fasted[a], and you have not seen? Why have we humbled ourselves, and you do not notice? Look, on the day of your fast you pursue your own pleasure[c][b], and you drive all your laborers hard.
translation:
  language: ru
  text: '«Почему мы постились[a], а Ты не видел? Смиряли себя, а Ты не замечал?» Но вот: в день вашего поста вы ищете своего удовольствия[b] и притесняете всех своих работников[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «изнуряли (или уничижали) свою душу»; также возможно: «отказывали себе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «находите желаемое», «добиваетесь желаемого»; возможно также: «занимаетесь собственными делами».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «понуждаете всех своих работников»; еврейское выражение может также означать взыскание всей работы или всех трудовых повинностей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה צַּמְנוּ וְלֹא רָאִיתָ
  choice: Почему мы постились, а Ты не видел?
  rationale: Прямой вопрос передаёт жалобу народа; прошедшее время естественно по-русски выражает завершённый пост, последствия которого, по мнению говорящих, Бог не признал. «Не видел» сохраняет конкретный образ еврейского ראה.
- source_word: עִנִּינוּ נַפְשֵׁנוּ
  choice: Смиряли себя
  rationale: Еврейская идиома буквально говорит об «изнурении/уничижении души», то есть о самоограничении, связанном с постом. «Смиряли себя» понятно современному читателю, а буквальная сторона отмечена в сноске.
- source_word: וְלֹא תֵדָע
  choice: а Ты не замечал?
  rationale: ידע в параллели с «не видел» означает не простое отсутствие знания, а отсутствие внимания или признания; «не замечал» естественно передаёт жалобу.
- source_word: הֵן
  choice: Но вот
  rationale: Частица вводит подчёркнутый ответ Бога и поворот от жалобы к обличению; «но вот» современно, выразительно и не архаично.
- source_word: בְּיוֹם צֹמְכֶם
  choice: в день вашего поста
  rationale: Сохранена явная временная конструкция оригинала.
- source_word: תִּמְצְאוּ חֵפֶץ
  choice: вы ищете собственной выгоды
  rationale: Сочетание допускает буквальное «находите желаемое», но в данном контексте обозначает преследование собственного интереса; «собственной выгоды» связывает эгоистическое поведение с последующим притеснением работников, не сводя חֵפֶץ только к удовольствию.
- source_word: וְכָל עַצְּבֵיכֶם תִּנְגֹּשׂוּ
  choice: и притесняете всех своих работников
  rationale: נגשׂ выражает принуждение, понукание или притеснение. עַצְּבֵיכֶם может обозначать работников либо трудовые повинности; в контексте социального обличения личное значение хорошо согласуется с глаголом, а неоднозначность сохранена в сноске.
theological_decisions:
- issue: Смысл обличения в заключительной части стиха
  choice: Бог обличает пост, сопровождаемый своекорыстием и притеснением работников.
  alternative: Речь может идти о занятии собственными делами и взыскании всей положенной работы или повинностей.
  rationale: Контекст противопоставляет внешнее религиозное самоограничение несправедливому обращению с людьми. При этом лексическая неоднозначность חֵפֶץ и עַצְּבֵיכֶם не устраняется, а указывается в сносках.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи, но без архаизмов. Реплика народа оформлена кавычками, а «Но вот» ясно вводит Божий ответ. Заглавное «Ты» принято как уважительное обращение к Богу. Все три маркера сносок размещены непосредственно при соответствующих выражениях.
