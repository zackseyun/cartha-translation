id: ISA.58.11
reference: Isaiah 58:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/נָחֲ/ךָ֣ יְהוָה֮ תָּמִיד֒ וְ/הִשְׂבִּ֤יעַ בְּ/צַחְצָחוֹת֙ נַפְשֶׁ֔/ךָ וְ/עַצְמֹתֶ֖י/ךָ יַחֲלִ֑יץ וְ/הָיִ֨יתָ֙ כְּ/גַ֣ן רָוֶ֔ה וּ/כְ/מוֹצָ֣א מַ֔יִם אֲשֶׁ֥ר לֹא יְכַזְּב֖וּ מֵימָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/011.yaml
  text: And Yahweh will guide you continually[a], and satisfy your soul in parched places, and strengthen your bones; and you will be like a well-watered garden[c][b], and like a spring of water whose waters do not fail.
translation:
  language: ru
  text: И Яхве будет всегда вести тебя, насыщать душу твою в иссушённых местах[a] и укреплять кости твои[b]. Ты будешь как напоённый водой сад и как источник, воды которого не иссякают[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «в засушливых краях», «в местах, выжженных зноем». Еврейское слово обозначает иссушающие, знойные условия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оживлять (освежать) кости твои». Употреблённый здесь еврейский глагол редок и может выражать укрепление или возвращение жизненных сил.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «воды которого не лгут», то есть не подводят и не оказываются ненадёжными.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחֲךָ
  choice: будет вести тебя
  rationale: Глагол נחה обычно означает «вести, направлять»; «вести» естественно по-русски и сохраняет образ постоянного Божьего руководства.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: תָּמִיד
  choice: всегда
  rationale: Передаёт непрерывность и постоянство действия кратко и естественно.
- source_word: וְהִשְׂבִּיעַ ... נַפְשֶׁךָ
  choice: насыщать душу твою
  rationale: Hифиль שבע выражает полное утоление нужды; נֶפֶשׁ сохранено как «душа», что уместно в поэтическом контексте, хотя слово может обозначать также жизнь, самого человека или его желание.
- source_word: בְּצַחְצָחוֹת
  choice: в иссушённых местах
  rationale: Редкое множественное существительное обозначает знойные, выжженные, засушливые условия; перевод сохраняет образ и форму множественного числа.
- source_word: וְעַצְמֹתֶיךָ יַחֲלִיץ
  choice: укреплять кости твои
  rationale: Значение редкого здесь глагола חלץ не вполне определённо; в контексте он указывает на укрепление или оживление сил, при этом конкретный образ костей сохранён.
- source_word: כְּגַן רָוֶה
  choice: как напоённый водой сад
  rationale: רָוֶה описывает сад, обильно обеспеченный влагой; выражение звучит естественно и сохраняет связь с образом насыщения.
- source_word: וּכְמוֹצָא מַיִם
  choice: как источник
  rationale: מוֹצָא מַיִם — место выхода или источник воды; в русском слово «источник» уже предполагает воду и позволяет избежать тяжеловесности.
- source_word: אֲשֶׁר לֹא יְכַזְּבוּ מֵימָיו
  choice: воды которого не иссякают
  rationale: Буквально воды «не лгут», то есть не оказываются ненадёжными и не подводят; «не иссякают» ясно передаёт смысл идиомы в данном образе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» сохраняет личное имя Бога и не подменяет его титулом.
- issue: Антропологический смысл נֶפֶשׁ
  choice: душу твою
  alternative: тебя; жизнь твою; желание твоё
  rationale: «Душу» сохраняет поэтическую и антропологическую многослойность слова, не сводя обещание только к телесной потребности.
- issue: Неясное значение יַחֲלִיץ применительно к костям
  choice: укреплять
  alternative: освежать; оживлять
  rationale: «Укреплять» согласуется с контекстом восстановления, но альтернативный оттенок оживления отмечен в сноске без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Синтаксис слегка возвышенный, но понятный; конкретные образы души, костей, сада и источника сохранены. Все маркеры сносок размещены непосредственно после соответствующих выражений.
