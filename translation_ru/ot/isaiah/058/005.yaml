  to: 'Таков ли пост, который Я избираю: день, когда человек смиряет себя? Разве в том, чтобы склонять голову, как тростник, и расстилать под собой вретище и пепел? Назовёшь ли это постом и днём, угодным Господу?'
  rationale: Убрано невыраженное в оригинале «только ли» и второй риторический вопрос оформлен как естественная для русского конструкция «Разве в том, чтобы…?». Смысл образов, параллелизм вопросов и терминология сохранены.
