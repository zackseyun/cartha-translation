base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/005.yaml
  text: 'Is this the fast that I choose: a day for a man to humble himself? Is it to bow down his head like a reed, and to spread out sackcloth and ashes? Will you call this a fast, and a day acceptable to the LORD?'
translation:
  language: ru
  text: 'Таков ли пост, который Я избираю: день, когда человек смиряет себя? Разве в том, чтобы склонять голову, как тростник, и расстилать под собой вретище и пепел? Назовёшь ли это постом и днём, угодным Господу?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צוֹם
  choice: пост
  rationale: Прямой и естественный русский эквивалент, сохраняющий религиозный смысл воздержания.
- source_word: עַנּוֹת ... נַפְשׁוֹ
  choice: смиряет себя
  rationale: Идиома означает подвергать себя лишениям, смирять или изнурять себя; «смиряет себя» естественно передаёт смысл в контексте поста, не сводя его лишь к внутреннему чувству.
- source_word: כְאַגְמֹן
  choice: как тростник
  rationale: Образ гибкого болотного растения, поникающего под тяжестью; «тростник» понятен современному читателю и сохраняет сравнение.
- source_word: שַׂק וָאֵפֶר
  choice: вретище и пепел
  rationale: Устойчивое библейское обозначение внешних знаков скорби и покаяния; «вретище» сохраняет исторический предметный смысл и высокий регистр.
- source_word: יוֹם רָצוֹן לַיהוָה
  choice: днём, угодным Господу
  rationale: רָצוֹן здесь выражает благоволение или принятие; русский оборот передаёт день, который Господь принимает и одобряет.
- source_word: יהוה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, естественная для литературного библейского текста.
theological_decisions:
- issue: Направленность критики поста
  choice: Сохранены риторические вопросы, противопоставляющие избранный Богом пост одним лишь внешним действиям.
  alternative: Передать стих как безусловное отрицание всякого телесного смирения и обрядовых знаков.
  rationale: Еврейский текст обличает сведение поста к внешней форме в контексте главы, но сам по себе не требует отрицать всякое телесное выражение покаяния.
- issue: Значение עַנּוֹת נַפְשׁוֹ
  choice: «смиряет себя»
  alternative: «изнуряет душу свою» или «подвергает себя лишениям»
  rationale: Выбрана понятная формулировка, сохраняющая многозначность самоумаления и воздержания без догматического уточнения.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Риторическая структура оригинала сохранена; добавленное «только ли» естественно связывает второй вопрос с критикой внешних действий и не меняет общего смысла контекста.
