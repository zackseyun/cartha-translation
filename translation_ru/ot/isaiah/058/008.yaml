base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/008.yaml
  text: Then your light will break forth like the dawn[a], and your healing will spring up quickly; your righteousness will go before you[c][b], and the glory of Yahweh will be your rear guard.
translation:
  language: ru
  text: Тогда свет твой пробьётся, как заря, и исцеление твоё[a] быстро взойдёт; праведность твоя[b] пойдёт перед тобой, а слава Яхве будет охранять тебя сзади[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выздоровление твоё» или «восстановление твоё».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливость твоя»; возможно также: «правота твоя».'
    reason: lexical_alternative
  - marker: c
    text: Еврейский глагол буквально означает «соберёт тебя». В данном контексте он традиционно понимается как образ охраны сзади.
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּקַע
  choice: пробьётся
  rationale: Форма нифаля от בקע передаёт образ прорыва наружу. «Пробьётся» естественно сочетается со светом и сохраняет яркость исходного образа.
- source_word: כַּשַּׁחַר
  choice: как заря
  rationale: שׁחר означает зарю или рассвет; «как заря» кратко и точно сохраняет сравнение.
- source_word: אוֹרֶךָ
  choice: свет твой
  rationale: Прямое значение אוֹר — «свет»; притяжательный суффикс сохранён.
- source_word: אֲרֻכָתְךָ
  choice: исцеление твоё
  rationale: אֲרֻכָה может обозначать исцеление, выздоровление или восстановление. «Исцеление» сохраняет телесный образ и допускает более широкий смысл восстановления.
- source_word: מְהֵרָה
  choice: быстро
  rationale: Наречие указывает на стремительность происходящего; «быстро» естественно в современном русском языке.
- source_word: תִצְמָח
  choice: взойдёт
  rationale: צמח буквально описывает прорастание и рост. «Взойдёт» сохраняет органическую метафору, не делая фразу чрезмерно тяжеловесной.
- source_word: וְהָלַךְ לְפָנֶיךָ
  choice: пойдёт перед тобой
  rationale: Сочетание הלך с לפני означает идти впереди кого-либо; перевод сохраняет как движение, так и возможный оттенок сопровождения и защиты.
- source_word: צִדְקֶךָ
  choice: праведность твоя
  rationale: צדק охватывает праведность, справедливость и правоту. «Праведность» сохраняет широкий нравственный и заветный смысл, не сводя его только к общественной справедливости.
- source_word: כְּבוֹד יְהוָה
  choice: слава Яхве
  rationale: 'Конструкция передана естественно: כבוד — «слава», а личное имя יְהוָה транслитерировано как «Яхве».'
- source_word: יַאַסְפֶךָ
  choice: будет защищать тебя с тыла
  rationale: Основное значение אסף — «собирать», но в данном пространственном противопоставлении тому, что идёт впереди, глагол описывает замыкание шествия и защиту сзади. Контекстуальный смысл вынесен в основной текст, а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Значение צִדְקֶךָ
  choice: праведность твоя
  alternative: справедливость твоя; правота твоя
  rationale: Контекст главы подчёркивает общественную справедливость, однако само слово здесь шире и олицетворено как идущее впереди. Основной перевод сохраняет эту широту, а близкая альтернатива отмечена в сноске.
- issue: Образ в יַאַסְפֶךָ
  choice: будет защищать тебя с тыла
  alternative: соберёт тебя; замкнёт твоё шествие
  rationale: Контекст ясно создаёт образ защиты впереди и сзади, но буквальное значение глагола связано с собиранием. Перевод передаёт функцию образа, а сноска сохраняет его лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены параллелизм, образ прорывающегося света, метафора роста исцеления и движение защитников впереди и сзади; архаизмы и конфессионально маркированные формулы не использованы.
