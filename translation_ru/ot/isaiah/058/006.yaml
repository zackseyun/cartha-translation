  text: הֲ/ל֣וֹא זֶה֮ צ֣וֹם אֶבְחָרֵ/הוּ֒ פַּתֵּ֨חַ֙ חַרְצֻבּ֣וֹת רֶ֔שַׁע הַתֵּ֖ר אֲגֻדּ֣וֹת מוֹטָ֑ה וְ/שַׁלַּ֤ח רְצוּצִים֙ חָפְשִׁ֔ים וְ/כָל מוֹטָ֖ה תְּנַתֵּֽקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/006.yaml
  text: 'Is not this the fast that I choose: to loosen the chains of wickedness[a], to untie the cords of the yoke, to send the oppressed out free[c][b], and to tear off every yoke?'
translation:
  language: ru
  text: 'Не такой ли пост Я избираю: развязать узы нечестия[a], развязать ремни ярма, отпустить угнетённых на свободу[b] и разорвать всякое ярмо?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оковы беззакония».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сокрушённых» или «раздавленных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צ֣וֹם
  choice: пост
  rationale: Существительное обозначает религиозный пост; это прямой и естественный русский эквивалент.
- source_word: אֶבְחָרֵהוּ
  choice: Я избираю
  rationale: Глагол בחר означает «выбирать, избирать»; настоящее время передаёт актуальную оценку Бога.
- source_word: פַּתֵּחַ חַרְצֻבּוֹת רֶשַׁע
  choice: развязать узы нечестия
  rationale: Сохраняется конкретный образ связывающих уз и нравственная широта רֶשַׁע, не сводимого лишь к юридической несправедливости.
- source_word: הַתֵּר אֲגֻדּוֹת מוֹטָה
  choice: распустить путы ярма
  rationale: Передаётся действие развязывания или ослабления связывающих пут при сохранении физического образа ярма.
- source_word: וְשַׁלַּח רְצוּצִים חָפְשִׁים
  choice: отпустить угнетённых на свободу
  rationale: «Отпустить» естественно передаёт שלח в контексте освобождения, а «угнетённых» выражает социальный смысл пассивного причастия от רצץ.
- source_word: וְכָל מוֹטָה תְּנַתֵּקוּ
  choice: разбить всякое ярмо
  rationale: Глагол נתק обозначает сильное разрывание или разрушение связи; «разбить» звучит естественно с «ярмом» и сохраняет решительность действия.
theological_decisions:
- issue: Сущность избираемого Богом поста
  choice: Пост раскрыт через конкретные действия, освобождающие людей от угнетения.
  alternative: Понимать слова лишь как метафору внутреннего благочестия или общей доброты.
  rationale: Еврейские глагольные формы перечисляют осязаемые действия против угнетения, не отменяя религиозного контекста поста.
- issue: Образ ярма
  choice: Сохранить повтор слова «ярмо».
  alternative: Заменить оба употребления абстрактными словами «бремя» или «угнетение».
  rationale: Повтор מוֹטָה подчёркивает физический образ насильственного стеснения и его полного устранения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и повтор «ярмо» сохранены; архаизирующие формы сведены к минимуму, однако «нечестие» и «узы» уместны в высоком библейском регистре.
