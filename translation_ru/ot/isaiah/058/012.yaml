  text: Those from among you will rebuild the ancient ruins[a]; you will raise up the foundations of generation after generation, and you will be called the repairer of the breach[b], the restorer of paths for dwelling.
translation:
  language: ru
  text: Люди из твоей среды отстроят древние развалины; ты восстановишь основания многих поколений[a], и тебя назовут заделывающим проломы, восстанавливающим пути для проживания[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «основания поколения и поколения»; возможно также: «древние основания».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «восстанавливающим пути, чтобы жить» или «восстанавливающим улицы для жилья». Последнее выражение может означать восстановление возможности вновь жить в общине.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ מִמְּךָ
  choice: Люди из твоей среды отстроят
  rationale: Предлог מִן после глагола во множественном числе указывает на людей, происходящих из среды адресата. Формулировка не сужает смысл до биологических потомков; «отстроят» передаёт восстановление разрушенного.
- source_word: חָרְבוֹת עוֹלָם
  choice: древние развалины
  rationale: חָרְבוֹת обозначает развалины или опустошённые места, а עוֹלָם в данном контексте — давность, а не буквальную вечность.
- source_word: מוֹסְדֵי דוֹר וָדוֹר
  choice: основания, заложенные поколение за поколением
  rationale: Сохраняется образ оснований и повторительная формула דוֹר וָדוֹר («поколение и поколение»), указывающая на череду поколений. Добавленное «заложенные» делает связь естественной по-русски, не устраняя временную неоднозначность.
- source_word: תְּקוֹמֵם
  choice: ты восстановишь
  rationale: Каузативная форма от קום означает поставить, воздвигнуть или восстановить. В контексте развалин «восстановишь» ясно выражает возвращение оснований в надлежащее состояние.
- source_word: וְקֹרָא לְךָ
  choice: и тебя назовут
  rationale: Неопределённо-личная русская конструкция естественно передаёт безличное употребление глагола в 3-м лице единственного числа.
- source_word: גֹּדֵר פֶּרֶץ
  choice: заделывающим проломы
  rationale: גדר означает ограждать или заделывать, а פֶּרֶץ — пролом, брешь. Причастная конструкция сохраняет образ человека, устраняющего разрушения.
- source_word: מְשֹׁבֵב נְתִיבוֹת
  choice: восстанавливающим дороги
  rationale: Причастие от שוב имеет восстановительный смысл, а נְתִיבוֹת обозначает пути или дороги. Выбор согласован с образом возрождения поселения.
- source_word: לָשָׁבֶת
  choice: чтобы там жили
  rationale: 'Инфинитив выражает цель или результат: дороги и окружающее пространство восстанавливаются для обитаемой жизни. Местоименное «там» естественно восполняет подразумеваемое место в русском языке.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаическим звучанием. Сохранён переход от множественного числа («люди из твоей среды») к обращению во втором лице единственного числа («ты»), присутствующий в еврейском тексте. Причастные наименования передают почётные характеристики адресата без искусственной титулатуры.
