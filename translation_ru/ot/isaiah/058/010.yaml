  text: וְ/תָפֵ֤ק לָֽ/רָעֵב֙ נַפְשֶׁ֔/ךָ וְ/נֶ֥פֶשׁ נַעֲנָ֖ה תַּשְׂבִּ֑יעַ וְ/זָרַ֤ח בַּ/חֹ֨שֶׁךְ֙ אוֹרֶ֔/ךָ וַ/אֲפֵלָתְ/ךָ֖ כַּֽ/צָּהֳרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/010.yaml
  text: and if you pour yourself out for the hungry and satisfy the afflicted soul[a], then your light will rise in the darkness[b], and your gloom will be like noonday.
translation:
  language: ru
  text: Если ты отдашь себя голодному[a] и насытишь измученного[b], тогда твой свет взойдёт во тьме, и твой мрак станет как полдень.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выведешь (или: предложишь) голодному свою душу». Здесь «душа» означает самого человека, его жизнь и силы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «измученную душу»; еврейское נֶפֶשׁ здесь может обозначать всего страждущего человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפֵק ... נַפְשֶׁךָ
  choice: если ты отдашь себя
  rationale: Сочетание глагола в породе хифиль с נֶפֶשׁ выражает деятельную самоотдачу ради нуждающегося. «Отдашь себя» звучит естественно по-русски, сохраняет личную вовлечённость и не сводит действие лишь к передаче еды или вещи.
- source_word: לָרָעֵב
  choice: голодному
  rationale: Субстантивированное прилагательное רָעֵב обозначает голодного человека, а ל указывает на того, ради кого совершается действие.
- source_word: וְנֶפֶשׁ נַעֲנָה
  choice: измученного
  rationale: נֶפֶשׁ здесь обозначает всего человека, а נַעֲנָה — угнетённого, страждущего или изнурённого. «Измученного» передаёт бедственное состояние и естественно сочетается с «насытишь».
- source_word: תַּשְׂבִּיעַ
  choice: насытишь
  rationale: Хифиль от שׂבע означает дать насытиться, удовлетворить нужду до полноты. В контексте голода «насытишь» сохраняет конкретный образ и допускает более широкий смысл удовлетворения нужды.
- source_word: וְזָרַח
  choice: тогда ... взойдёт
  rationale: В условно-следственной связи форма выражает результат. Глагол זרח обычно описывает восход или появление света; «взойдёт» сохраняет этот образ.
- source_word: בַּחֹשֶׁךְ אוֹרֶךָ
  choice: твой свет взойдёт во тьме
  rationale: Буквально и естественно передаёт противопоставление света и тьмы, не истолковывая метафору вместо читателя.
- source_word: וַאֲפֵלָתְךָ
  choice: твой мрак
  rationale: אֲפֵלָה обозначает густую тьму, мрак. «Мрак» отличает это слово от предшествующего חֹשֶׁךְ и сохраняет усиленный оттенок.
- source_word: כַּצָּהֳרָיִם
  choice: как полдень
  rationale: צָהֳרַיִם — полдень, время наиболее яркого дневного света. Краткое сравнение соответствует еврейскому образу.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ в двух частях стиха
  choice: Передать первое употребление как «себя», а второе — как обозначение всего измученного человека
  alternative: 'В обоих случаях буквально употребить «душа»: «отдашь душу твою» и «насытишь измученную душу»'
  rationale: В данном контексте נֶפֶשׁ означает человека, его жизнь и личность, а не специально нематериальную часть человека. Контекстуальный перевод сохраняет смысл самоотдачи и помощи страждущему, не привнося в стих определённую антропологическую схему.
- issue: Характер обещанного света и мрака
  choice: Сохранить образы «свет», «тьма» и «мрак» без поясняющей подстановки
  alternative: Передать их толковательно как благословение, избавление или благополучие
  rationale: Образный язык допускает взаимосвязанные значения восстановления, Божьего благоволения и выхода из бедствия. Прямое воспроизведение не устраняет этой намеренной смысловой ёмкости.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейским звучанием. Условное «если» и следственное «тогда» делают синтаксическую связь явной. Лексика избегает как архаизма «напитаешь душу», так и чрезмерно толковательного «посвятишь себя заботе».
