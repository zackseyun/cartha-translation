  text: to open blind eyes[a], to bring a prisoner out from confinement[c][b], from the prison house those who sit in darkness.
translation:
  language: ru
  text: чтобы открыть слепые глаза[a], вывести из заточения узника[b], из темницы — сидящих во тьме[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глаза слепых».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из заключения» или «из темницы»; еврейское слово может обозначать заточение либо место, где держат взаперти.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обитающих во тьме».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְקֹחַ
  choice: открыть
  rationale: Инфинитив выражает цель; «открыть» естественно сочетается с «глазами» и точно передаёт еврейский образ.
- source_word: עֵינַיִם עִוְרוֹת
  choice: слепые глаза
  rationale: Прилагательное непосредственно определяет «глаза»; буквальный образ сохранён без поясняющего истолкования.
- source_word: לְהוֹצִיא
  choice: вывести
  rationale: Инфинитив выражает цель, а каузативная форма означает вывести, заставить выйти; «вывести» естественно в контексте освобождения узника.
- source_word: מִמַּסְגֵּר
  choice: из заточения
  rationale: Слово обозначает место или состояние, где человека держат взаперти; «заточение» не навязывает излишне конкретный вид помещения.
- source_word: אַסִּיר
  choice: узника
  rationale: Единственное число сохранено как собирательно-представительное; «узник» соответствует контексту заключения и освобождения.
- source_word: מִבֵּית כֶּלֶא
  choice: из темницы
  rationale: Еврейское сочетание буквально означает «из дома заключения»; «темница» кратко и естественно передаёт место заключения, сохраняя поэтический регистр.
- source_word: יֹשְׁבֵי חֹשֶׁךְ
  choice: сидящих во тьме
  rationale: Причастие от ישב может означать «сидеть» или «обитать». «Сидящих» сохраняет конкретный и вместе с тем метафорически ёмкий образ оригинала.
theological_decisions:
- issue: Буквальный и метафорический смысл слепоты, заключения и тьмы
  choice: Сохранить конкретные образы слепых глаз, узника, темницы и сидящих во тьме без пояснения их духовного смысла в основном тексте.
  alternative: Прямо истолковать образы как духовное просвещение и освобождение.
  rationale: В контексте Ис 42 образы допускают как буквальное, так и метафорическое прочтение. Сам еврейский текст не устраняет эту напряжённость, поэтому перевод её сохраняет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм и переход от единственного числа «узника» к множественному «сидящих» сохранены; тире обозначает подразумеваемое повторение глагола «вывести».
