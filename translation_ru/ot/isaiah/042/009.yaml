lexical_decisions:
- source_word: הָרִאשֹׁנוֹת
  choice: прежнее
  rationale: Субстантивированное прилагательное женского рода во множественном числе обозначает прежние события или дела. Собирательное «прежнее» естественно по-русски и сохраняет параллель с «новым».
- source_word: הִנֵּה
  choice: вот
  rationale: Обычное современное русское средство привлечения внимания, сохраняющее торжественную пророческую интонацию без архаизации.
- source_word: בָאוּ
  choice: сбылось
  rationale: Буквально глагол означает «пришло», но применительно к ранее возвещённым событиям передаёт их наступление или исполнение. «Сбылось» ясно выражает этот контекстуальный смысл.
- source_word: חֲדָשׁוֹת
  choice: новое
  rationale: Субстантивированное прилагательное, параллельное «прежнему». Собирательная форма не уточняет сверх текста, идёт ли речь о событиях, делах или иных явлениях.
- source_word: מַגִּיד
  choice: возвещаю
  rationale: Причастная форма породы хифиль от נגד означает «сообщать, объявлять, делать известным». «Возвещаю» соответствует пророческому регистру и остаётся понятным современному читателю.
- source_word: בְּטֶרֶם
  choice: прежде чем
  rationale: Естественно передаёт временное значение «до того как».
- source_word: תִּצְמַחְנָה
  choice: оно даст ростки
  rationale: Глагол сохраняет образ прорастания. Согласование в единственном числе обусловлено собирательным русским «новое», а не изменением смысла еврейского множественного числа.
- source_word: אַשְׁמִיעַ אֶתְכֶם
  choice: Я объявлю вам о нём
  rationale: Хифиль от שמע буквально означает «дам вам услышать». Русское «объявлю вам» естественно передаёт каузативно-коммуникативный смысл; местоимение отсылает к «новому».
theological_decisions:
- issue: Язык пророческого исполнения
  choice: «прежнее сбылось»
  alternative: «прежнее произошло» или буквально «прежнее пришло»
  rationale: Контраст между уже наступившим прежним и заранее возвещаемым новым поддерживает тему Божьего предведения и пророческого исполнения, но перевод не добавляет утверждений сверх текста.
- issue: Момент возвещения нового
  choice: Будущее «Я объявлю» после «прежде чем»
  alternative: Настоящее «Я объявляю»
  rationale: Еврейское מַגִּיד — причастие с настоящим значением в первой части, тогда как אַשְׁמִיעַ — форма имперфекта, естественно указывающая на действие до будущего прорастания. Русский перевод сохраняет это временное напряжение, не сглаживая его.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной пророческой интонацией. «Вот» и «возвещаю» сохраняют достоинство текста; архаизмы исключены. Растительная метафора оригинала сохранена и пояснена в сноске.
