  text: הַ/חֵרְשִׁ֖ים שְׁמָ֑עוּ וְ/הַ/עִוְרִ֖ים הַבִּ֥יטוּ לִ/רְאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/018.yaml
  text: Hear[a], you deaf; and look, you blind[b], that you may see.
translation:
  language: ru
  text: Глухие, слушайте[a]; слепые, смотрите, чтобы увидеть[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть глухие слушают». Еврейские прилагательные с артиклем можно понять и как прямое обращение («глухие… слепые»), и как обозначение групп («глухие… слепые»); в русском различие определяется синтаксисом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «смотрите, чтобы видеть». Заключительная фраза выражает цель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵרְשִׁים
  choice: глухие
  rationale: Прилагательное с артиклем допускает субстантивное прочтение, но в сочетании с повелительным שְׁמָעוּ естественно понимается как обращение. Русская форма «глухие» сохраняет и прямое обращение, и формальную неоднозначность.
- source_word: שְׁמָעוּ
  choice: слушайте
  rationale: Повелительное наклонение множественного числа от שׁמע. В данном парадоксальном призыве к глухим «слушайте» естественнее передаёт сознательное внимание, не устраняя буквального образа слуха.
- source_word: וְהַעִוְרִים
  choice: слепые
  rationale: Второе параллельное обращение, связанное союзом וְ. В русском бессоюзное присоединение после точки с запятой звучит естественно, тогда как смысл еврейского соединения сохраняется синтаксическим параллелизмом.
- source_word: הַבִּיטוּ
  choice: смотрите
  rationale: Повелительное наклонение множественного числа породы hифиль от נבט обозначает направленный взгляд. «Смотрите» — современная, ясная и стилистически достойная передача, параллельная «слушайте».
- source_word: לִרְאוֹת
  choice: чтобы увидеть
  rationale: 'Инфинитив с ל после повелительной формы выражает цель; «чтобы увидеть» ясно передаёт целевое значение и сохраняет намеренный парадокс: слепым велено смотреть ради того, чтобы увидеть.'
theological_decisions:
- issue: Следует ли сразу истолковывать «глухих» и «слепых» как духовно невосприимчивых
  choice: Сохранены буквальные обозначения «глухие» и «слепые», а метафорический смысл оставлен контексту.
  alternative: «Духовно глухие и слепые» или «невосприимчивые».
  rationale: Еврейский текст употребляет конкретные слова о слухе и зрении. Их буквальная передача сохраняет пророческий образ, парадокс и богословское напряжение, не подменяя перевод толкованием.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным пророческим призывом. Сохранены параллелизм и парадокс исходного текста; архаизмы и конфессионально окрашенные пояснения не используются.
