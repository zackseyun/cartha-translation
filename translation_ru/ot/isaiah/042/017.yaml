  text: נָסֹ֤גוּ אָחוֹר֙ יֵבֹ֣שׁוּ בֹ֔שֶׁת הַ/בֹּטְחִ֖ים בַּ/פָּ֑סֶל הָ/אֹמְרִ֥ים לְ/מַסֵּכָ֖ה אַתֶּ֥ם אֱלֹהֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/017.yaml
  text: They will be turned back[a]; they will be utterly put to shame—those who trust in an idol, who say to a cast image[d][c][b], “You are our gods.”
translation:
  language: ru
  text: 'Отступят назад[a] и покроются глубоким стыдом[b] те, кто полагаются на идола[c] и говорят литому изображению: «Вы — наши боги»[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут обращены вспять». Еврейский глагол может означать как отступление, так и вынужденное движение назад.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «устыдятся стыдом» — усилительное выражение, указывающее на глубокий, полный стыд.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «изваяние». В этом стихе употреблены два разных слова: первое обычно обозначает высеченное или вырезанное изображение, второе — изображение, изготовленное литьём.'
    reason: lexical_alternative
  - marker: d
    text: В еврейском тексте и «вы», и «наши боги» стоят во множественном числе; некоторые переводы согласуют обращение с единственным числом слова «изображение».
    reason: alternative_reading
lexical_decisions:
- source_word: נָסֹגוּ אָחוֹר
  choice: отступят назад
  rationale: Глагол נסג обозначает движение назад, отступление, а иногда — обращение вспять под чужим воздействием. В контексте возвещения суда уместно русское будущее время; активная формулировка сохраняет естественность и не навязывает причинителя.
- source_word: יֵבֹשׁוּ בֹשֶׁת
  choice: покроются глубоким стыдом
  rationale: Однокоренные глагол и существительное образуют усилительную конструкцию — буквально «устыдятся стыдом». Русская формулировка передаёт усиление без неестественного повтора.
- source_word: הַבֹּטְחִים
  choice: те, кто полагается
  rationale: Субстантивированное причастие описывает людей по их постоянной установке. «Полагается» естественно сочетается с объектом ложного религиозного упования.
- source_word: בַּפָּסֶל
  choice: на идола
  rationale: פֶּסֶל — изготовленное, обычно высеченное или вырезанное изображение, служащее предметом поклонения. «Идол» ясно передаёт его религиозную функцию.
- source_word: לְמַסֵּכָה
  choice: литому изображению
  rationale: מַסֵּכָה обозначает изображение, изготовленное литьём, обычно из металла. Перевод сохраняет отличие этого слова от פֶּסֶל.
- source_word: אַתֶּם אֱלֹהֵינוּ
  choice: Вы — наши боги
  rationale: И местоимение второго лица, и существительное имеют форму множественного числа. Она сохранена, несмотря на упоминание одного литого изображения непосредственно перед прямой речью.
theological_decisions:
- issue: 'Передача двух обозначений предметов идолопоклонства: פֶּסֶל и מַסֵּכָה'
  choice: «идол» и «литое изображение»
  alternative: «изваяние» и «литой идол» либо одинаковое «идол» для обоих слов
  rationale: 'Разные русские выражения сохраняют различие исходных терминов: первый подчёркивает функцию предмета поклонения, второй — способ его изготовления. При этом текст остаётся понятным современному читателю.'
- issue: Число в словах אַתֶּם אֱלֹהֵינוּ
  choice: 'сохранить множественное число: «Вы — наши боги»'
  alternative: 'согласовать с ближайшим существительным в единственном числе: «Ты — наш бог»'
  rationale: Обе соответствующие еврейские формы грамматически множественны. Их не следует нормализовать, поскольку необычное сочетание одного изображения и множественного обращения принадлежит самому тексту.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified формой пророческого возвещения. Синтаксис сохраняет поступательное усиление исходного текста; терминология различает два вида изготовленных предметов поклонения, не перегружая основной текст техническими подробностями.
