source:
  edition: WLC
  text: שִׁ֤ירוּ לַֽ/יהוָה֙ שִׁ֣יר חָדָ֔שׁ תְּהִלָּת֖/וֹ מִ/קְצֵ֣ה הָ/אָ֑רֶץ יוֹרְדֵ֤י הַ/יָּם֙ וּ/מְלֹא֔/וֹ אִיִּ֖ים וְ/יֹשְׁבֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/010.yaml
  text: Sing to Yahweh a new song[a], his praise from the end of the earth, you who go down to the sea, and all that fills it[b], the coastlands and those who dwell in them.
translation:
  language: ru
  text: Пойте Яхве новую песнь, возносите Ему хвалу от края земли — вы, спускающиеся к морю, и всё, что наполняет его, острова[a] и их жители.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прибрежные земли». Еврейское слово может обозначать как острова, так и отдалённые земли у моря.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Пойте
  rationale: Форма повелительного наклонения множественного числа прямо призывает многих людей к песенному прославлению.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт стоящее в еврейском тексте личное имя יהוה, не заменяя его титулом.
- source_word: שִׁיר חָדָשׁ
  choice: новую песнь
  rationale: Точная и естественная передача устойчивого сочетания, обозначающего новое прославление Бога.
- source_word: תְּהִלָּתוֹ
  choice: возносите Ему хвалу
  rationale: В русском языке это естественнее буквального «Его хвала» и сохраняет параллельный призыв, подразумеваемый начальным повелением «пойте».
- source_word: מִקְצֵה הָאָרֶץ
  choice: от края земли
  rationale: Сохраняет единственное число еврейского קְצֵה и пространственный образ исходящей издалека хвалы.
- source_word: יוֹרְדֵי הַיָּם
  choice: вы, спускающиеся к морю
  rationale: Сохраняет образное причастное выражение, а не сводит его к более узкому толкованию «мореплаватели».
- source_word: וּמְלֹאוֹ
  choice: и всё, что наполняет его
  rationale: Передаёт מְלֹא как совокупность всего находящегося в море и сохраняет олицетворяющий призыв творению.
- source_word: אִיִּים
  choice: острова
  rationale: Основное конкретное значение слова уместно в морском контексте; возможное более широкое значение отмечено в сноске.
- source_word: וְיֹשְׁבֵיהֶם
  choice: и их жители
  rationale: Кратко и естественно передаёт «живущих на них»; местоимение согласовано с островами.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Сохранено личное заветное имя, прямо употреблённое в исходном тексте; замена титулом могла бы скрыть лексическое различие.
- issue: Синтаксическая связь תְּהִלָּתוֹ
  choice: «возносите Ему хвалу» как продолжение повеления
  alternative: «Его хвала — от края земли»
  rationale: В еврейском тексте у תְּהִלָּתוֹ нет отдельного выраженного глагола. Русская вставка делает призыв ясным, но не утверждает, что в оригинале присутствует второе повелительное наклонение.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Сохранены перечисление, морская образность и географический размах еврейского текста; архаичное «песнь» уместно в контексте торжественного призыва.
