  terminology: «Яхве» последовательно передаёт тетраграмматон. «Новая песнь», «хвала», «край земли» и «острова» уместны в данном поэтическом и пророческом контексте. Сноска корректно отмечает более широкое значение אִיִּים как прибрежных земель.
