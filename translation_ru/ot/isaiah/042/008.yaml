base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/008.yaml
  text: I am Yahweh; that is my name. I will not give my glory to another[a], nor my praise to idols.
translation:
  language: ru
  text: Я — Яхве; это Моё имя. Я не отдам Моей славы другому и Моей хвалы — изваяниям.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идолам». Еврейское слово обозначает резные или высеченные изображения; в данном контексте речь идёт об идолах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הוּא שְׁמִי
  choice: это Моё имя
  rationale: Местоимение имеет отождествительно-указательную функцию; по-русски эта формулировка естественно подчёркивает названное имя.
- source_word: כְבוֹדִי
  choice: Моей славы
  rationale: «Слава» сохраняет основной смысл כָּבוֹד в контексте исключительного Божьего величия и почитания.
- source_word: לְאַחֵר
  choice: другому
  rationale: Сохраняет намеренно неуточнённое противопоставление Яхве любому иному претенденту.
- source_word: אֶתֵּן
  choice: не отдам
  rationale: Имперфект выражает твёрдое решение; «не отдам» естественно передаёт отказ уступить принадлежащее говорящему.
- source_word: תְהִלָּתִי
  choice: Моей хвалы
  rationale: Формально и поэтически передаёт похвалу, принадлежащую Яхве или обращённую к Нему, без поясняющего расширения.
- source_word: לַפְּסִילִים
  choice: изваяниям
  rationale: Передаёт конкретное значение изготовленных, высеченных изображений и в контексте ясно указывает на предметы идолопоклонства.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя; транслитерация сохраняет его отличие от титула.
- issue: Смысл выражения «Моей хвалы»
  choice: Сохранить краткую притяжательную конструкцию
  alternative: Полагающейся Мне хвалы
  rationale: Исходный текст краток и поэтичен; развёрнутая формулировка сделала бы подразумеваемый смысл явным и тем самым добавила бы толкование.
- issue: Передача פְּסִילִים
  choice: изваяниям
  alternative: идолам
  rationale: «Изваяния» сохраняет материальный аспект изготовленных изображений, тогда как культовый смысл следует из контекста; более прямое «идолам» дано в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Параллелизм двух полустиший сохранён; тире во второй части естественно восполняет пропущенный глагол. Заглавные буквы в местоимениях, относящихся к Богу, следуют принятой русской религиозной издательской традиции.
