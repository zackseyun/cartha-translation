  yaml_path: translation/ot/isaiah/042/023.yaml
  text: Who among you will listen to this[a], will pay attention and hear hereafter?
translation:
  language: ru
  text: Кто из вас прислушается к этому, будет внимать и слушать впредь?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на будущее», «впоследствии». Древнееврейское выражение буквально связано со значением «позади; после» и в данном контексте может обозначать последующее время.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם
  choice: Кто из вас
  rationale: Естественно передаёт риторический вопрос и значение בָכֶם — «из вас, среди вас».
- source_word: יַאֲזִין
  choice: прислушается
  rationale: Hiphil от אזן обозначает внимательное слушание; «прислушается» сохраняет оттенок намеренного внимания.
- source_word: זֹאת
  choice: к этому
  rationale: Указательное местоимение женского рода единственного числа отсылает к сказанному — вести или предостережению; управление русского глагола требует формы «к этому».
- source_word: יַקְשִׁב
  choice: будет внимать
  rationale: Передаёт сосредоточенное внимание и позволяет различить два близких, но не тождественных еврейских глагола слушания.
- source_word: וְיִשְׁמַע
  choice: и слушать
  rationale: שמע здесь относится к восприятию и вниманию; значение послушания возможно шире, но контекст не требует явно выражать его в переводе.
- source_word: לְאָחוֹר
  choice: впредь
  rationale: Буквально выражение связано с направлением «назад/после», а идиоматически может указывать на последующее время. «Впредь» естественно передаёт временную направленность, не перегружая стих.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллельные глаголы переданы различно («прислушается», «будет внимать», «слушать»), чтобы сохранить риторическое накопление исходного текста; неоднозначность לְאָחוֹר отмечена в сноске.
