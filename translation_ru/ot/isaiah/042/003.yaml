  text: קָנֶ֤ה רָצוּץ֙ לֹ֣א יִשְׁבּ֔וֹר וּ/פִשְׁתָּ֥ה כֵהָ֖ה לֹ֣א יְכַבֶּ֑/נָּה לֶ/אֱמֶ֖ת יוֹצִ֥יא מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/003.yaml
  text: A bruised reed he will not break[a], and a dimly burning wick he will not extinguish[b]; he will faithfully bring forth justice.
translation:
  language: ru
  text: Надломленной трости он не переломит, и тускло горящего фитиля[a] не погасит; он верно[b] установит справедливость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тусклого льна»; вероятно, имеется в виду фитиль светильника, сделанный из льна.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в истине».'
    reason: alternative_reading
lexical_decisions:
- source_word: קָנֶה
  choice: трость
  rationale: Слово обозначает тростник или трость; «трость» естественно сохраняет конкретный поэтический образ.
- source_word: רָצוּץ
  choice: надломленная
  rationale: Причастие описывает повреждённое, смятое или сокрушённое. «Надломленная» передаёт хрупкость трости, не представляя её уже полностью сломанной.
- source_word: יִשְׁבּוֹר
  choice: не переломит
  rationale: Форма несовершенного вида в пророческом описании передаёт характерное будущее действие. «Переломит» естественно сочетается с образом трости.
- source_word: פִשְׁתָּה
  choice: фитиль
  rationale: Буквально это «лён», но сочетание с глаголом כבה указывает на льняной фитиль светильника. Контекстуальное значение вынесено в основной текст, а буквальное — в примечание.
- source_word: כֵהָה
  choice: тускло горящий
  rationale: Прилагательное означает тусклый, слабый или угасающий. Выражение сохраняет образ едва горящего фитиля, не сводя его непременно к дымлению.
- source_word: יְכַבֶּנָּה
  choice: не погасит
  rationale: Глагол означает гасить или тушить; «не погасит» ясно и естественно продолжает образ светильника.
- source_word: לֶאֱמֶת
  choice: верно
  rationale: Оборот допускает значения «в истине», «истинно» и «верно». В основном тексте «верно» передаёт надёжность и соответствие истине; более буквальный вариант сохранён в примечании.
- source_word: יוֹצִיא
  choice: установит
  rationale: Порода Hiphil глагола יצא буквально выражает выведение или вынесение наружу. В сочетании со «справедливостью» русское «установит» естественно передаёт осуществление справедливого порядка, хотя менее буквально, чем «выведет».
- source_word: מִשְׁפָּט
  choice: справедливость
  rationale: В данном контексте слово обозначает не только судебное решение, но справедливый порядок и правосудие; «справедливость» наиболее ясно передаёт широкий смысл.
theological_decisions:
- issue: Метафорическое изображение отношения Слуги к слабым
  choice: Сохранены конкретные образы надломленной трости и тускло горящего фитиля.
  alternative: Передать образы прямо как указание на слабых и угасающих людей.
  rationale: Еврейский текст не раскрывает метафоры прямо. Их сохранение удерживает поэтическую силу и не превращает толкование в текст перевода.
- issue: Значение לֶאֱמֶת
  choice: «верно»
  alternative: «в истине» или «истинно»
  rationale: Слово אֱמֶת может обозначать истину, верность и надёжность. Контекст допускает оттенок верного совершения дела, но буквальная связь с истиной остаётся значимой и отмечена в сноске.
- issue: Значение מִשְׁפָּט
  choice: «справедливость»
  alternative: «суд» или «правосудие»
  rationale: Выбран широкий смысл справедливого порядка без ограничения судебным приговором; при этом напряжение между справедливостью и судом не получает догматического истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Параллелизм и конкретные метафоры оригинала сохранены; синтаксис остаётся ясным для широкого читателя.
