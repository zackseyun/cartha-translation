base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/001.yaml
  text: Behold my servant[a], whom I uphold, my chosen one, in whom my soul delights. I have put my Spirit upon him[c][b]; he will bring forth justice to the nations.
translation:
  language: ru
  text: Вот Мой раб, которого Я поддерживаю, Мой избранник, в котором радуется Моя душа.[a] Я дал ему Мой Дух.[b] Он явит народам справедливость.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «которым Я доволен». Буквально еврейский текст говорит о радости или благоволении Божьей души.'
    reason: lexical_alternative
  - marker: b
    text: В Новом Завете этот стих применяется к Иисусу Мессии (см. Мф. 12:18).
    reason: cross_reference
  - marker: c
    text: Еврейское מִשְׁפָּט (мишпа́т) может означать также «суд», «правосудие» или «справедливый порядок».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Частица привлекает внимание к рабу; «вот» сохраняет возвышенный пророческий тон и при этом естественно звучит по-русски.
- source_word: עַבְדִּי
  choice: Мой раб
  rationale: В данном пророческом контексте «раб» является обычным обозначением того, кто служит Богу; перевод не уточняет личную или коллективную идентичность раба.
- source_word: אֶתְמָךְ בּוֹ
  choice: которого Я поддерживаю
  rationale: Глагол תמך с предлогом ב передаёт поддержку и укрепление; относительное предложение естественно связывает эту характеристику с «Моим рабом».
- source_word: בְּחִירִי
  choice: Мой избранник
  rationale: Субстантивированное прилагательное означает особо избранного; «избранник» кратко и естественно передаёт личное обозначение.
- source_word: רָצְתָה נַפְשִׁי
  choice: к которому благоволит Моя душа
  rationale: Формулировка сохраняет присутствующее в еврейском тексте слово «душа» и выражает глубокое Божье благоволение, не сводя его к менее образному «которым Я доволен».
- source_word: נָתַתִּי רוּחִי עָלָיו
  choice: Я возложил на него Мой Дух
  rationale: Сочетание נתן с על буквально описывает помещение или возложение на кого-либо; «возложил» сохраняет образ ниспосланного свыше Божьего Духа.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: Слово может обозначать судебное решение, справедливость или справедливый порядок. «Правосудие» сохраняет одновременно судебный и общественный оттенки, а широта значения отмечена в сноске.
- source_word: לַגּוֹיִם
  choice: народам
  rationale: Здесь גוים обозначает народы в широком смысле; перевод «язычникам» был бы уже и сильнее зависел бы от позднейшего конфессионального словоупотребления.
- source_word: יוֹצִיא
  choice: принесёт
  rationale: Каузативная форма от יצא означает «выведет», «произведёт наружу». В сочетании с отвлечённым существительным «правосудие» глагол «принесёт» естественно передаёт его явление и распространение среди народов.
theological_decisions:
- issue: Кого обозначает раб
  choice: В основном тексте оставлено нейтральное «Мой раб».
  alternative: Израиль как народ; отдельный пророческий деятель; мессианская личность, получившая исполнение в Иисусе.
  rationale: Сам стих не называет раба по имени и допускает развитие его образа в дальнейшем контексте. Новозаветное применение указано в сноске, но не внесено в перевод еврейского текста.
- issue: רוּחִי как Божий Дух
  choice: «Мой Дух» с прописной буквы.
  alternative: «мой дух» со строчной буквы.
  rationale: Говорящий — Бог, и Его Дух возлагается на раба для исполнения поручения; прописная буква помогает обозначить божественный референт, не добавляя нового содержания.
- issue: Смысл מִשְׁפָּט
  choice: «правосудие» с пояснением диапазона значений.
  alternative: «суд», «справедливость», «справедливый порядок».
  rationale: 'Контекст миссии к народам шире отдельного судебного приговора. Однако значение не сведено исключительно к общественной справедливости: альтернативные оттенки сохранены в сноске.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Местоимения и притяжательные формы, относящиеся к Богу, даны с прописной буквы. Синтаксис остаётся ясным для современного читателя, а образное «благоволит Моя душа» сохраняет выразительность оригинала.
