    rationale: Слово может включать суд, судебное решение и установленный справедливый порядок. «Правосудие» в современном русском преимущественно связано с деятельностью судебной системы, тогда как контекст служения народам допускает более широкий смысл.
  - severity: low
    issue: «Принесёт» для יוֹצִיא
