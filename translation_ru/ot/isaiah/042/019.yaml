base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/019.yaml
  text: Who is blind but my servant[a], and deaf like my messenger whom I send? Who is blind like the one who is at peace, and blind like the servant of Yahweh?
translation:
  language: ru
  text: Кто слеп, если не раб Мой, и глух, как посланник Мой, которого Я посылаю? Кто так слеп, как пребывающий в мире[a], и слеп, как раб Яхве?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как совершенный (непорочный)»; значение еврейского слова неясно: оно может указывать на полноту, целостность или мирные, правильные отношения.'
    reason: alternative_reading
lexical_decisions:
- source_word: עִוֵּר
  choice: слеп
  rationale: Обычное значение прилагательного; троекратный повтор сохранён ради риторической силы.
- source_word: חֵרֵשׁ
  choice: глух
  rationale: Прямое и естественное соответствие, образующее параллель со словом «слеп».
- source_word: עַבְדִּי
  choice: раб Мой
  rationale: В библейском русском «раб» естественно передаёт принадлежность и служение Богу; прописная буква в местоимении соответствует принятому благоговейному регистру.
- source_word: מַלְאָכִי
  choice: посланник Мой
  rationale: В данном контексте речь идёт о направленном с поручением служителе; значение «ангел» здесь менее вероятно.
- source_word: אֶשְׁלָח
  choice: которого Я посылаю
  rationale: Сохраняет форму действия от первого лица и естественно связывается с «посланником».
- source_word: מְשֻׁלָּם
  choice: пребывающий в мире
  rationale: Трудное слово связано с семантическим полем целостности, завершённости и мира. Выбранное выражение сохраняет возможный смысл мирных, правильных отношений, не добавляя отсутствующего в еврейском тексте дополнения «со Мной».
- source_word: עֶבֶד יְהוָה
  choice: раб Яхве
  rationale: Прямо передаёт конструкцию принадлежности и сохраняет лексику служения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כִּי אִם
  choice: как не
  rationale: Русская конструкция «кто… как не…?» естественно передаёт исключительное значение еврейского оборота.
theological_decisions:
- issue: Кого обозначают «раб Мой» и «посланник Мой»
  choice: Референт не уточнён сверх сказанного в стихе.
  alternative: Израиль как народ; пророк; идеальный образ раба.
  rationale: Сам стих не устанавливает более узкую идентификацию, поэтому перевод сохраняет смысловую и богословскую напряжённость.
- issue: Значение מְשֻׁלָּם
  choice: «пребывающий в мире» в основном тексте с примечанием об иных значениях.
  alternative: «совершенный», «непорочный», «целостный», «вознаграждённый».
  rationale: Форма лексически трудна и допускает несколько толкований. Основной вариант отражает поле мира и целостности, а примечание сохраняет существенную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический параллелизм и повтор слова «слеп» сохранены; неоднозначность трудного еврейского מְשֻׁלָּם отмечена в сноске.
