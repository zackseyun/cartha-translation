  yaml_path: translation/ot/isaiah/042/021.yaml
  text: Yahweh was pleased[a], for the sake of his righteousness[c][b], to make the law great and glorious.
translation:
  language: ru
  text: Яхве пожелал ради Своей праведности возвеличить Закон и прославить его.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради Своего правосудия».'
    reason: alternative_reading
  - marker: b
    text: Евр. тора — также «наставление» или «учение».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: חָפֵץ
  choice: пожелал
  rationale: Глагол выражает благоволение и волю Яхве; «пожелал» естественно передаёт волевой оттенок, не усиливая эмоциональное значение до «возрадовался».
- source_word: לְמַעַן
  choice: ради
  rationale: Кратко и естественно передаёт мотив или основание действия, сохраняя возможный целевой оттенок конструкции.
- source_word: צִדְקוֹ
  choice: Своей праведности
  rationale: Передаёт широкий нравственный и заветный смысл צדק; местоимение «Своей» однозначно отсылает к Яхве. Возможное значение «правосудие» отмечено в сноске.
- source_word: יַגְדִּיל
  choice: возвеличить
  rationale: Передаёт каузативное значение породы hифиль — «сделать великим, возвеличить» — в естественном и достойном русском стиле.
- source_word: תּוֹרָה
  choice: наставление
  rationale: В данном контексте слово может обозначать Божье учение шире, чем свод законов; «наставление» сохраняет эту широту, а традиционное «закон» приведено в сноске.
- source_word: וְיַאְדִּיר
  choice: и прославить его
  rationale: Передаёт самостоятельный каузативный глагол «сделать славным, величественным», не сливая его с первым сказуемым.
theological_decisions:
- issue: Значение צִדְקוֹ как мотива действия Яхве
  choice: Своей праведности
  alternative: Своего правосудия
  rationale: «Праведность» сохраняет широкий нравственный и заветный смысл слова, тогда как «правосудие» допустимо, но сужает его до судебно-юридического аспекта; альтернатива сохранена в сноске.
- issue: Объём значения תּוֹרָה
  choice: наставление
  alternative: закон
  rationale: Еврейское תּוֹרָה охватывает наставление и учение, хотя может иметь заветно-правовой смысл. Основной текст не ограничивает значение исключительно законодательством, а традиционная передача отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксический параллелизм двух глаголов сохранён; прописная буква в «Своей» следует принятой благоговейной издательской норме.
