source:
  edition: WLC
  text: וְ/הוֹלַכְתִּ֣י עִוְרִ֗ים בְּ/דֶ֨רֶךְ֙ לֹ֣א יָדָ֔עוּ בִּ/נְתִיב֥וֹת לֹֽא יָדְע֖וּ אַדְרִיכֵ֑/ם אָשִׂים֩ מַחְשָׁ֨ךְ לִ/פְנֵי/הֶ֜ם לָ/א֗וֹר וּ/מַֽעֲקַשִּׁים֙ לְ/מִישׁ֔וֹר אֵ֚לֶּה הַ/דְּבָרִ֔ים עֲשִׂיתִ֖/ם וְ/לֹ֥א עֲזַבְתִּֽי/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/016.yaml
  text: And I will lead the blind by a way they have not known; on paths they have not known I will guide them. I will make the darkness before them into light[a], and the crooked places into level ground. These are the things I have done, and I have not forsaken them.
translation:
  language: ru
  text: Я поведу слепых дорогой, которой они не знали, направлю их по незнакомым им путям. Тьму перед ними Я превращу в свет, а искривлённые места — в ровную землю. Всё это Я совершил и их не покинул.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё это Я совершу и их не покину». В еврейском тексте здесь стоят перфектные формы: они могут обозначать совершившееся действие либо выражать пророческую уверенность в том, что Бог непременно исполнит обещанное.'
    reason: Альтернативное временное понимание заключительных еврейских форм.
lexical_decisions:
- source_word: וְהוֹלַכְתִּי
  choice: Я поведу
  rationale: Каузативная форма глагола הלך буквально означает «заставлю идти», но в данном контексте естественно передаётся глаголом «поведу», выражающим руководство.
- source_word: עִוְרִים
  choice: слепых
  rationale: Прилагательное во множественном числе употреблено как существительное. Перевод сохраняет образ слепоты, не ограничивая его только буквальным или только переносным смыслом.
- source_word: בְּדֶרֶךְ לֹא יָדָעוּ
  choice: дорогой, которой они не знали
  rationale: דרך обозначает дорогу или путь, а ידע — знание, в том числе приобретённую опытом знакомость. Формулировка сохраняет образ прежде неведомого маршрута.
- source_word: בִּנְתִיבוֹת לֹא יָדְעוּ אַדְרִיכֵם
  choice: направлю их по незнакомым им путям
  rationale: נתיבות — поэтическое обозначение путей или троп, а каузативная форма דרך означает вести, направлять. «Незнакомым им» естественно передаёт повторяющееся «которых они не знали» без утраты смысла.
- source_word: מַחְשָׁךְ לִפְנֵיהֶם לָאוֹר
  choice: Тьму перед ними Я превращу в свет
  rationale: שים имеет широкое значение «класть, делать»; в контексте преобразования русское «превращу» ясно выражает переход от тьмы к свету.
- source_word: וּמַעֲקַשִּׁים לְמִישׁוֹר
  choice: а искривлённые места — в ровную землю
  rationale: מַעֲקַשִּׁים указывает на кривое или искривлённое, а מִישׁוֹר — на ровное место, равнину или прямоту. Перевод сохраняет образ местности и не сводит его к отвлечённой нравственной «правоте».
- source_word: אֵלֶּה הַדְּבָרִים עֲשִׂיתִם
  choice: Всё это Я совершил
  rationale: Перфектная форма сохранена как совершившееся действие, что передаёт заметный аспектуальный сдвиг после будущих обещаний.
- source_word: וְלֹא עֲזַבְתִּים
  choice: и их не покинул
  rationale: Перфект передан прошедшим видом; местоимение «их» сохраняет естественную отсылку к слепым, которых Бог ведёт.
theological_decisions:
- issue: Временное значение заключительных перфектных форм
  choice: «Всё это Я совершил и их не покинул»
  alternative: «Всё это Я совершу и их не покину»
  rationale: Начало стиха явно ориентировано на будущее, однако в заключении еврейский текст переходит к перфектным формам. Основной перевод сохраняет этот сдвиг, который может представлять обещанное как уже несомненно совершённое; сноска указывает допустимое будущее понимание, не устраняя неоднозначность.
- issue: Характер слепоты
  choice: Сохранить простой образ «слепых» без поясняющего толкования
  alternative: Уточнить как духовную или буквальную слепоту
  rationale: Сам стих не требует выбрать исключительно буквальный либо переносный смысл, поэтому перевод не вводит конфессионального или частного истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены параллелизм, образ пути и переход от будущих форм к перфектам; синтаксис сделан понятным для обычного читателя без добавления богословских уточнений.
