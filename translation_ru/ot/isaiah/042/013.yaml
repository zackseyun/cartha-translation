source:
  edition: WLC
  text: יְהוָה֙ כַּ/גִּבּ֣וֹר יֵצֵ֔א כְּ/אִ֥ישׁ מִלְחָמ֖וֹת יָעִ֣יר קִנְאָ֑ה יָרִ֨יעַ֙ אַף יַצְרִ֔יחַ עַל אֹיְבָ֖י/ו יִתְגַּבָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/013.yaml
  text: Yahweh goes out like a mighty warrior[a]; like a man of war he stirs up zeal. He shouts, yes, he raises a battle cry[c][b]; over his enemies he shows himself mighty.
translation:
  language: ru
  text: Яхве выступает, как могучий воин; словно воитель[b], Он пробуждает рвение[a]. Он поднимает крик, да, издаёт боевой клич; над Своими врагами Он являет Свою мощь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пробуждает ревность». Еврейское קִנְאָה может означать как ревность, так и горячее рвение, особенно в контексте отношений завета.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как муж войн», то есть воин, закалённый в сражениях.'
    reason: cultural_note
  - marker: c
    text: 'Или: «одерживает верх над Своими врагами». Заключительные слова можно передать более динамично, подчеркнув победу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: כַּגִּבּוֹר
  choice: как могучий воин
  rationale: В военном контексте גִּבּוֹר обозначает сильного, доблестного воина; этот вариант естественен по-русски и сохраняет образ.
- source_word: יֵצֵא
  choice: выступает
  rationale: Глагол означает «выходить». «Выступает» сохраняет значение выхода и в данном контексте естественно передаёт начало военного действия, не добавляя явно не выраженного указания на марш.
- source_word: כְּאִישׁ מִלְחָמוֹת
  choice: словно воитель
  rationale: Буквально выражение означает «как муж войн». «Воитель» сохраняет мужской и воинский образ, но звучит по-русски естественнее буквальной кальки; буквальная форма отражена в примечании.
- source_word: יָעִיר קִנְאָה
  choice: пробуждает ревность
  rationale: קִנְאָה допускает значения «ревность» и «рвение». «Ревность» сохраняет напряжённую, в том числе заветную, многозначность еврейского слова; альтернатива указана в примечании.
- source_word: יָרִיעַ אַף יַצְרִיחַ
  choice: Он громко кричит, издаёт боевой клич
  rationale: Оба глагола описывают громкий крик. Военный контекст позволяет естественно передать второй как «боевой клич», сохраняя нарастание образа без смягчения.
- source_word: עַל אֹיְבָיו יִתְגַּבָּר
  choice: над Своими врагами Он являет Свою мощь
  rationale: Передаёт возможное значение עַל «над» и возвратно-интенсивный оттенок יִתְגַּבָּר — «показывать себя сильным», одновременно перекликаясь с образом могучего воина в начале стиха.
theological_decisions:
- issue: Воинский образ Яхве
  choice: 'Сохранить прямой и сильный язык войны: воин, воитель, боевой клич и враги'
  alternative: Обобщить образ как проявление силы
  rationale: Еврейский текст последовательно изображает Яхве как воина; смягчение устранило бы существенную образность стиха.
- issue: Значение קִנְאָה применительно к Богу
  choice: ревность
  alternative: рвение
  rationale: «Ревность» сохраняет возможный заветный оттенок и подлинную лексическую напряжённость текста, не сводя слово только к усердию; менее двусмысленная альтернатива дана в примечании.
- issue: Смысл заключительного יִתְגַּבָּר
  choice: являет Свою мощь
  alternative: одерживает верх
  rationale: Основной вариант сохраняет возвратный оттенок «показывает себя сильным» и словесную связь с גִּבּוֹר; вариант победы также возможен и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим ритмом. Военная образность сохранена без смягчения; буквальная, но неестественная калька «муж войн» вынесена в примечание. Прописные местоимения при указании на Бога использованы как допустимый элемент русского библейского регистра.
