source:
  edition: WLC
  text: אַחֲרִ֤יב הָרִים֙ וּ/גְבָע֔וֹת וְ/כָל עֶשְׂבָּ֖/ם אוֹבִ֑ישׁ וְ/שַׂמְתִּ֤י נְהָרוֹת֙ לָֽ/אִיִּ֔ים וַ/אֲגַמִּ֖ים אוֹבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/015.yaml
  text: I will lay waste mountains and hills[a], and I will dry up all their vegetation; I will turn rivers into islands, and I will dry up pools.
translation:
  language: ru
  text: Я опустошу горы и холмы, я иссушу всю их растительность; я превращу реки в острова[a], я высушу водоёмы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в прибрежные земли»; еврейское слово может обозначать острова или земли у моря.'
    reason: Лексическая неоднозначность слова אִיִּים.
lexical_decisions:
- source_word: אַחֲרִיב
  choice: опустошу
  rationale: Каузативная форма глагола חרב означает привести в запустение, разорить. «Опустошу» сохраняет образ суда, не усиливая его до полного уничтожения.
- source_word: הָרִים וּגְבָעוֹת
  choice: горы и холмы
  rationale: Прямое и естественное соответствие двум видам возвышенностей; перевод «высоты» мог бы необоснованно внести культовый смысл.
- source_word: וְכָל עֶשְׂבָּם
  choice: всю их растительность
  rationale: עֵשֶׂב охватывает траву и другую растительность; местоимение относится к горам и холмам вместе.
- source_word: אוֹבִישׁ
  choice: иссушу / высушу
  rationale: Каузатив от יבש означает «сделать сухим». В отношении растительности естественно «иссушу», а в отношении водоёмов — «высушу»; смысловой повтор сохранён при нормальной русской сочетаемости.
- source_word: וְשַׂמְתִּי
  choice: превращу
  rationale: В конструкции с объектом и результатом שׂים выражает изменение состояния; «превращу» естественно передаёт этот смысл.
- source_word: נְהָרוֹת
  choice: реки
  rationale: Обычное значение נְהָרוֹת; контекст не требует ослаблять его до «ручьёв» или «потоков».
- source_word: לָאִיִּים
  choice: в острова
  rationale: אִיִּים обычно обозначает острова либо прибрежные земли. Основной текст сохраняет прямое значение «острова», а лексическая неоднозначность отмечена в сноске.
- source_word: וַאֲגַמִּים
  choice: водоёмы
  rationale: אֲגַמִּים может обозначать стоячие водоёмы, пруды или болотистые места. «Водоёмы» не сужает значение до искусственных прудов либо болот.
theological_decisions:
- issue: Образ Божьего суда над творением
  choice: Сохранить конкретные образы опустошённых возвышенностей, иссохшей растительности и высохших вод.
  alternative: Истолковать всё исключительно как метафору устранения препятствий.
  rationale: Еврейский текст использует конкретные природные образы. Перевод не должен заранее решать, являются ли они только метафорическими или также историческими либо космическими.
- issue: Повтор первого лица в четырёх глагольных формах
  choice: Повторить «Я» перед каждым сказуемым.
  alternative: Опустить часть местоимений ради более плавной русской прозы.
  rationale: Повтор подчёркивает, что каждое действие совершает говорящий Господь, и передаёт риторическую настойчивость четырёх еврейских форм первого лица.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Повтор «Я» намеренно сохранён ради эмфазы; конкретность природных образов не смягчена.
