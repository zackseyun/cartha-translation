source:
  edition: WLC
  text: מִֽי נָתַ֨ן ל/משוסה יַעֲקֹ֛ב וְ/יִשְׂרָאֵ֥ל לְ/בֹזְזִ֖ים הֲ/ל֣וֹא יְהוָ֑ה ז֚וּ חָטָ֣אנוּ ל֔/וֹ וְ/לֹֽא אָב֤וּ בִ/דְרָכָי/ו֙ הָל֔וֹךְ וְ/לֹ֥א שָׁמְע֖וּ בְּ/תוֹרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/024.yaml
  text: Who gave Jacob over to plunder[a], and Israel to looters? Was it not Yahweh, he against whom we have sinned? They were not willing to walk in his ways[b], and they did not listen to his law.
translation:
  language: ru
  text: Кто отдал Иакова на разграбление[a], а Израиля — грабителям? Не Яхве ли — тот, против кого мы согрешили? Они не хотели ходить его путями и не слушали его закона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально здесь употреблены близкие выражения «на расхищение» и «грабителям»; Иаков и Израиль представлены как отданные врагам на разграбление.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его наставления». Еврейское слово тора может обозначать закон или наставление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/משוסה
  choice: на разграбление
  rationale: Существительное обозначает состояние того, кто отдан на расхищение; оборот «отдать на разграбление» естественен по-русски и сохраняет образ добычи.
- source_word: לְ/בֹזְזִים
  choice: грабителям
  rationale: Причастная форма от בזז называет тех, кто захватывает добычу; «грабителям» ясно передаёт значение враждебных действующих лиц.
- source_word: הֲ/לֹא יְהוָה
  choice: Не Яхве ли
  rationale: Вопросительная конструкция предполагает утвердительный ответ, а личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: זוּ
  choice: Тот, против кого
  rationale: Здесь זוּ вводит относительную характеристику Яхве; формулировка сохраняет присутствующий в еврейском тексте указательный элемент и естественно связывается с חטא ל.
- source_word: חָטָאנוּ לּוֹ
  choice: против кого мы согрешили
  rationale: Глагол חטא с предлогом ל обозначает грех против кого-либо; форма первого лица множественного числа сохранена.
- source_word: וְלֹא אָבוּ
  choice: Они не хотели
  rationale: אבה выражает желание или готовность; отрицательная конструкция передана без усиления до категорического «отказались».
- source_word: בִדְרָכָיו הָלוֹךְ
  choice: ходить его путями
  rationale: Сохранена распространённая библейская метафора поведения и образа жизни, понятная в современном русском языке.
- source_word: שָׁמְעוּ
  choice: не слушали
  rationale: Передано основное значение שׁמע, при этом подразумеваемое непослушание не внесено в текст явно.
- source_word: בְּתוֹרָתוֹ
  choice: его закона
  rationale: תּוֹרָה может означать как закон, так и наставление; в данном заветном контексте выбрано узнаваемое «закон», а более широкое значение отмечено в сноске.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Иакова / Израиля
  rationale: Оба имени сохранены, чтобы передать поэтический параллелизм и обозначение народа завета.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблено имя יְהוָה; транслитерация «Яхве» сохраняет личное имя Бога и не заменяет его титулом.
- issue: Переход от первого лица «мы согрешили» к третьему лицу «они не хотели… не слушали»
  choice: Сохранить смену лица
  alternative: Согласовать все глаголы в первом лице множественного числа
  rationale: Неожиданная смена лица присутствует в еврейском тексте и создаёт подлинное напряжение между общинным признанием и описанием народа; её не следует сглаживать.
- issue: Синтаксическая функция זוּ
  choice: 'Сохранить указательное ударение: «Тот, против кого»'
  alternative: 'Передать только относительным оборотом: «против которого»'
  rationale: Такой вариант отражает формальную выразительность זוּ, не превращая его в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены поэтический параллелизм, риторический вопрос, метафора хождения путями Бога и намеренная смена грамматического лица. Местоимение «его» оставлено со строчной буквы согласно нейтральной современной орфографической практике.
