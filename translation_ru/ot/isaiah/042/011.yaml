base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/011.yaml
  text: Let the wilderness and its cities lift up their voice[a], the settlements where Kedar dwells; let the inhabitants of Sela sing for joy; let them shout from the tops of the mountains.
translation:
  language: ru
  text: 'Пусть пустыня и её города возвысят голос,

    пусть и поселения, где обитает Кедар!


    Пусть жители Селы[a] радостно поют,

    пусть восклицают с вершин гор!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жители скалы», если סֶלַע понимать как нарицательное существительное, а не как название места Села.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: пусть … возвысят голос
  rationale: Форма выражает призыв; дополнение «голос» подразумевается контекстом и необходимо для естественного русского выражения. «Возвысят» сохраняет образ еврейского глагола נשׂא.
- source_word: מִדְבָּר
  choice: пустыня
  rationale: В данном поэтическом контексте слово обозначает пустынную, малонаселённую местность и олицетворённо призывается к хвале.
- source_word: וְעָרָיו
  choice: и её города
  rationale: Местоименный суффикс относится к слову «пустыня»; русский женский род согласуется с выбранным переводом.
- source_word: חֲצֵרִים
  choice: поселения
  rationale: Слово обозначает неукреплённые селения или стоянки; «поселения» охватывает оба оттенка и подходит к полукочевому Кедару.
- source_word: תֵּשֵׁב קֵדָר
  choice: где обитает Кедар
  rationale: Относительная конструкция естественно передаёт краткую еврейскую фразу. Кедар сохранён как собственное имя народа или области.
- source_word: יָרֹנּוּ
  choice: пусть … радостно поют
  rationale: Глагол רנן выражает ликующее пение или радостный крик; перевод сохраняет и музыкальный, и праздничный характер.
- source_word: יֹשְׁבֵי
  choice: жители
  rationale: Причастная форма означает людей, живущих в данном месте; «жители» — краткий и естественный русский эквивалент.
- source_word: סֶלַע
  choice: Села
  rationale: В параллели с Кедаром слово, вероятнее всего, является названием места. Возможное нарицательное значение «скала» сохранено в сноске.
- source_word: מֵרֹאשׁ הָרִים
  choice: с вершин гор
  rationale: Передаёт пространственное значение выражения буквально и естественно, сохраняя множественное число образа.
- source_word: יִצְוָחוּ
  choice: пусть восклицают
  rationale: Глагол обозначает громкий крик; «восклицают» в контексте хвалы передаёт громкое радостное провозглашение без оттенка бедствия.
