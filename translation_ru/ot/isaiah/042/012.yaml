  yaml_path: translation/ot/isaiah/042/012.yaml
  text: Let them give glory to Yahweh[c][b][a], and let them declare his praise in the coastlands.
translation:
  language: ru
  text: Пусть воздадут Яхве[a] славу[b] и возвестят хвалу Ему в приморских землях[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה (YHWH), Божье имя; традиционно передаётся как «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «припишут Яхве славу». Еврейский глагол буквально означает «положить, установить», но здесь идиоматически — воздать или приписать славу.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на островах»; у Исаии это слово часто обозначает также далёкие приморские и заморские земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂימוּ
  choice: пусть воздадут
  rationale: Глагол שׂים буквально означает «класть, помещать», но в сочетании с כָּבוֹד и адресатом, введённым ל, образует идиоматическое «воздавать/приписывать славу». «Пусть воздадут» естественно передаёт побудительное значение формы.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата действия, а יהוה — личное Божье имя; транслитерация «Яхве» сохраняет его отличие от титула «Господь».
- source_word: כָּבוֹד
  choice: славу
  rationale: כָּבוֹד означает «слава, честь»; в контексте поклонения и параллельно «хвале» наиболее уместно традиционное и понятное «слава».
- source_word: וּתְהִלָּתוֹ
  choice: и ... хвалу Ему
  rationale: תְּהִלָּה — «хвала», а суффикс 3-го лица ед. числа указывает на Бога. Русское «хвалу Ему» естественно передаёт хвалу, принадлежащую или подобающую Ему, не перегружая строку местоименной конструкцией «Его хвалу».
- source_word: בָּאִיִּים
  choice: на морских землях
  rationale: אִיִּים буквально может обозначать острова, но у Исаии нередко охватывает далёкие приморские и заморские земли. «На морских землях» сохраняет географическую образность и более широкий смысл.
- source_word: יַגִּידוּ
  choice: пусть ... возвестят
  rationale: Порода hифиль глагола נגד означает «объявлять, возвещать, сообщать». «Возвестят» соответствует возвышенной поэзии и публичному провозглашению хвалы.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. «Яхве» непосредственно передаёт имя и не заменяет его титулом; примечание сообщает читателю традиционную замену «Господь».
- issue: Смысл местоименного суффикса в תְהִלָּתוֹ
  choice: хвалу Ему
  alternative: Его хвалу
  rationale: Суффикс допускает понимание хвалы как принадлежащей Богу или подобающей Ему. Формулировка «хвалу Ему» естественна по-русски и сохраняет направленность поклонения, не вводя дополнительного догматического уточнения.
translation_notes:
  register: Современный литературный русский с возвышенным, но ясным поэтическим звучанием. Сохранён параллелизм двух побудительных форм; инверсия сведена к минимуму. Все примечания привязаны к маркерам в основном тексте.
