  yaml_path: translation/ot/isaiah/042/025.yaml
  text: So he poured out on him the heat of his anger and the might of battle[a]; it set him ablaze all around, but he did not know; it burned in him[d][c][b], but he did not take it to heart.
translation:
  language: ru
  text: И Он излил на него жар Своего гнева[a] и мощь войны[b]. Это опалило его со всех сторон, но он не осознал; это пылало в нём[c], но он не внял этому[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «ярость Его гнева» или «Его пылающий гнев».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «неистовство войны» или «ярость битвы».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское «он/его» относится к Израилю как к народу, олицетворённому одним человеком. Выражение также можно понять как «это жгло его».
    reason: cultural_note_and_lexical_alternative
  - marker: d
    text: 'Буквально: «не положил [этого] на сердце», то есть не внял и не задумался всерьёз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּךְ עָלָיו
  choice: излил на него
  rationale: Сохраняет образ изливаемого суда и форму мужского рода единственного числа, относящуюся к олицетворённому Израилю.
- source_word: חֵמָה אַפּוֹ
  choice: жар Своего гнева
  rationale: Передаёт сочетание жара/ярости с гневом и поддерживает проходящий через стих образ огня.
- source_word: וֶעֱזוּז מִלְחָמָה
  choice: и мощь войны
  rationale: עֱזוּז обозначает силу, мощь или неистовую силу; перевод не сводит выражение только к эмоциональной ярости.
- source_word: וַתְּלַהֲטֵהוּ מִסָּבִיב
  choice: Это опалило его со всех сторон
  rationale: Передаёт яркий огненный образ и круговой охват, а нейтральное «это» естественно обозначает действие излитого гнева и войны.
- source_word: וְלֹא יָדָע
  choice: но он не осознал
  rationale: ידע буквально связано со знанием, однако здесь выражает неспособность распознать смысл постигшего суда; «не осознал» естественно передаёт контекстуальный смысл.
- source_word: וַתִּבְעַר בּוֹ
  choice: это пылало в нём
  rationale: Сохраняет предлог בְּ («в») и продолжает метафору огня, не превращая её без необходимости в буквальное сожжение.
- source_word: וְלֹא יָשִׂים עַל לֵב
  choice: но он не принял этого близко к сердцу
  rationale: 'Современный русский фразеологизм передаёт еврейский образ помещения чего-либо на сердце: не внять и не отнестись всерьёз.'
theological_decisions:
- issue: Референт местоимений мужского рода единственного числа
  choice: Сохранено «его/он» как обозначение Израиля, олицетворённого одним человеком.
  alternative: 'Передать множественным числом: «их/они».'
  rationale: Еврейский текст последовательно употребляет единственное число; его сохранение удерживает литературное олицетворение народа.
- issue: Субъект действий суда
  choice: В начале субъектом представлен Бог («Он»), а последующее действие гнева и войны передано нейтральным «это».
  alternative: Сделать Бога явно выраженным субъектом всех глаголов либо согласовать последующие глаголы с одним из русских существительных.
  rationale: В еврейском тексте после действия Бога следуют формы женского рода, описывающие действие излитого гнева/силы войны. «Это» сохраняет смысловой переход без искусственного выбора единственного грамматического антецедента.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены огненная метафора, корпоративное единственное число и смысловой переход от Божьего действия к действию излитого суда; синтаксис сделан ясным для обычного современного читателя.
