base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/020.yaml
  text: You have seen many things[a], but you do not observe; his ears are open, but he does not hear.
translation:
  language: ru
  text: Ты видел многое, но не замечаешь; уши его открыты, но он не слышит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте первая половина стиха обращена к «тебе», а во второй глагол стоит в 3-м лице единственного числа. В некоторых переводах весь стих согласован во 2-м лице: «твои уши… ты не слышишь».'
    reason: alternative_reading
lexical_decisions:
- source_word: ראית
  choice: Ты видел
  rationale: Форма qal, перфект, 2-е лицо мужского рода единственного числа. Прошедшее время сохраняет завершённый вид действия и естественно звучит в контексте обличения.
- source_word: רַבּוֹת
  choice: многое
  rationale: Прилагательное женского рода множественного числа употреблено субстантивированно; «многое» естественно передаёт неопределённое множество увиденного.
- source_word: וְלֹא תִשְׁמֹר
  choice: но не замечаешь
  rationale: שׁמר может означать «хранить, блюсти, наблюдать, принимать во внимание». Здесь речь идёт о неспособности должным образом воспринять увиденное; «не замечаешь» естественно передаёт смысл, не вводя неуместного образа сторожевой бдительности.
- source_word: פָּקוֹחַ אָזְנַיִם
  choice: уши его открыты
  rationale: פָּקוֹחַ описывает открытое состояние ушей. Притяжательное «его» добавлено по нормам русского языка и согласовано с глаголом 3-го лица в следующей части.
- source_word: וְלֹא יִשְׁמָע
  choice: но он не слышит
  rationale: Форма qal, имперфект, 3-е лицо мужского рода единственного числа. Настоящее время естественно выражает продолжающееся состояние и сохраняет прямой смысл «слышать».
theological_decisions:
- issue: Смена грамматического лица внутри стиха
  choice: Сохранить переход от 2-го лица («ты видел… не замечаешь») к 3-му («уши его… он не слышит»)
  alternative: 'Согласовать весь стих во 2-м лице: «твои уши открыты, но ты не слышишь»'
  rationale: Масоретский текст действительно переходит от 2-го лица к 3-му. Сохранение этого риторического сдвига не устраняет присущую тексту напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой, обличительной интонацией. Необычная смена лица сохранена и пояснена в сноске.
