  text: וְ/הוּא֮ עַם בָּז֣וּז וְ/שָׁסוּי֒ הָפֵ֤חַ בַּֽ/חוּרִים֙ כֻּלָּ֔/ם וּ/בְ/בָתֵּ֥י כְלָאִ֖ים הָחְבָּ֑אוּ הָי֤וּ לָ/בַז֙ וְ/אֵ֣ין מַצִּ֔יל מְשִׁסָּ֖ה וְ/אֵין אֹמֵ֥ר הָשַֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/022.yaml
  text: But this is a people plundered and pillaged[a], all of them trapped in holes and hidden away in prison houses. They have become spoil, with no one to rescue them; plunder, with no one saying, “Restore!”
translation:
  language: ru
  text: 'Но это народ разграбленный и разорённый: все они пойманы в ямах[a] и спрятаны в темницах. Они стали добычей — и некому спасти; отданы на расхищение — и никто не говорит: «Верните!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «среди юношей». Обычно בַּחוּרִים означает «юноши», однако контекст здесь скорее указывает на ямы, углубления или укрытия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא עַם
  choice: Но это народ
  rationale: Связка вводит контраст с предшествующим контекстом; указательная конструкция естественно передаёт коллективный референт местоимения при עַם.
- source_word: בָּזוּז וְשָׁסוּי
  choice: разграбленный и разорённый
  rationale: Сохраняется парное описание насильственного опустошения без неестественного для русского языка почти полного повтора.
- source_word: הָפֵחַ
  choice: пойманы
  rationale: Трудная форма в данном контексте, вероятно, описывает захват или попадание в ловушку; «пойманы» ясно передаёт результат.
- source_word: בַּחוּרִים
  choice: в ямах
  rationale: Контекстуально вероятное редкое значение — ямы или укрытия; оно параллельно последующим темницам. Более обычное значение формы отмечено в сноске.
- source_word: וּבְבָתֵּי כְלָאִים
  choice: в темницах
  rationale: Естественный современный эквивалент буквального «в домах заключения», сохраняющий возвышенный библейский регистр.
- source_word: הָחְבָּאוּ
  choice: укрыты
  rationale: Передаёт пассивное состояние сокрытия; контекст говорит о насильственном заточении, а не обязательно о добровольном укрывательстве.
- source_word: הָיוּ לָבַז
  choice: Они стали добычей
  rationale: Конструкция היה ל выражает переход в состояние; «добыча» сохраняет образ военного захвата.
- source_word: וְאֵין מַצִּיל
  choice: и некому спасти
  rationale: Идиоматично передаёт экзистенциальную конструкцию אֵין с причастием «спасающий, избавляющий».
- source_word: מְשִׁסָּה
  choice: предметом грабежа
  rationale: Передаёт параллельный существительный образ, избегая двусмысленного русского сочетания «стали грабежом».
- source_word: הָשַׁב
  choice: Верните!
  rationale: Императив каузативной породы означает требование возвратить отнятое или захваченных; множественное вежливо-неопределённое обращение естественно по-русски и не уточняет невыраженный объект.
theological_decisions:
- issue: Референт единственного местоимения וְהוּא
  choice: Коллективно относится к народу и передано как «это народ».
  alternative: 'Более буквально: «но он — народ».'
  rationale: Следующее עַם поясняет коллективный референт; выбор является грамматико-дискурсивным и не вносит дополнительного богословского толкования.
- issue: Неуказанный объект повеления הָשַׁב
  choice: 'Сохранён невыраженным: «Верните!»'
  alternative: «Верните их!» или «Возвратите добычу!»
  rationale: Еврейский текст допускает понимание объекта как пленённого народа либо отнятого имущества; явное дополнение преждевременно сняло бы эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Параллелизм оригинала сохранён с помощью двоеточия, точки с запятой и повторной конструкции «и некому / и никто». Подлинная лексическая неоднозначность בַּחוּרִים вынесена в сноску.
