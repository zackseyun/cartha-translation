base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/014.yaml
  text: I have kept silent from long ago[a]; I have been quiet and restrained myself. Like a woman in labor I will cry out[b]; I will gasp and pant together.
translation:
  language: ru
  text: Я издавна молчал[a], хранил тишину и сдерживал себя. Словно роженица, Я закричу; буду хватать воздух ртом и тяжело дышать разом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долгое время»; возможно также: «с давних времён».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «буду хватать воздух ртом и тяжело дышать одновременно»; последнее слово может также означать «всё разом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱשֵׁיתִי
  choice: Я … молчал
  rationale: Форма первого лица передаёт продолжавшееся до настоящего момента молчание; русское прошедшее время естественно выражает этот ретроспективный смысл.
- source_word: מֵעוֹלָם
  choice: издавна
  rationale: В данном контексте обозначает длительное предшествующее время, а не абсолютную вечность; краткое «издавна» сохраняет возможный смысл «с давних пор».
- source_word: אַחֲרִישׁ
  choice: хранил тишину
  rationale: Продолжает параллельную тему молчания; формулировка избегает тяжёлого дословного повтора, не меняя смысла.
- source_word: אֶתְאַפָּק
  choice: сдерживал себя
  rationale: Возвратная форма выражает самоограничение, удерживание себя от действия.
- source_word: כַּיּוֹלֵדָה
  choice: словно роженица
  rationale: Кратко и ясно сохраняет прямое сравнение с женщиной, переживающей роды.
- source_word: אֶפְעֶה
  choice: Я закричу
  rationale: Глагол обозначает издание громкого голоса; в образе родов «закричу» звучит естественно и выразительно.
- source_word: אֶשֹּׁם
  choice: буду … судорожно вдыхать
  rationale: Контекст родов и сочетание со следующим глаголом указывают на резкое, затруднённое дыхание; перевод передаёт именно телесный образ, не выбирая несвязанное значение «опустошать».
- source_word: וְאֶשְׁאַף
  choice: и тяжело дышать
  rationale: Передаёт учащённое, напряжённое дыхание и образует естественную русскую пару с «судорожно вдыхать».
- source_word: יָחַד
  choice: разом
  rationale: Указывает на одновременность и внезапную совокупность двух действий; «разом» сохраняет обе смысловые стороны.
theological_decisions:
- issue: Божественное самоописание через образ родов
  choice: Сохранено прямое сравнение «словно роженица» без смягчения и аллегорического пояснения.
  alternative: Заменить его общим образом сильного крика или вынести сравнение в примечание.
  rationale: Еврейский текст прямо вкладывает это сравнение в речь Бога. Оно передаёт долго сдерживаемую силу и внезапность предстоящего действия; устранение образа ослабило бы напряжение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавное «Я» обозначает божественного Говорящего. Параллелизм первой части сохранён без неестественного дословного повтора, а короткие глагольные фразы второй части передают резкий переход от молчания к действию.
