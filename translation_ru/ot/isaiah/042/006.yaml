  text: אֲנִ֧י יְהוָ֛ה קְרָאתִ֥י/ךָֽ בְ/צֶ֖דֶק וְ/אַחְזֵ֣ק בְּ/יָדֶ֑/ךָ וְ/אֶצָּרְ/ךָ֗ וְ/אֶתֶּנְ/ךָ֛ לִ/בְרִ֥ית עָ֖ם לְ/א֥וֹר גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/006.yaml
  text: I am Yahweh[a]; I have called you in righteousness, and I will take hold of your hand; I will keep you and give you as a covenant for the people[c][b], as a light for the nations.
translation:
  language: ru
  text: Я — Яхве[a]. Я призвал тебя в праведности[b], возьму тебя за руку, буду оберегать тебя[c] и дам тебя заветом для народа[d], светом для народов[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — передача еврейского имени Бога יהוה; традиционно оно также передаётся как «Господь».
    reason: divine_name
  - marker: b
    text: 'Или: «в справедливости». Еврейское צֶדֶק может означать праведность или справедливость.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «буду хранить тебя»; возможны также значения «стеречь», «беречь».'
    reason: lexical_alternative
  - marker: d
    text: Выражение также можно передать как «заветом народа». Вероятно, под «народом» здесь подразумевается Израиль, однако в еврейском тексте он прямо не назван.
    reason: ambiguity
  - marker: e
    text: Еврейское גּוֹיִם означает «народы»; в некоторых контекстах это слово переводят как «язычники».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: קְרָאתִיךָ
  choice: Я призвал тебя
  rationale: Еврейский перфект обозначает совершившееся призвание; русский прошедший вид естественно передаёт завершённое действие.
- source_word: בְצֶדֶק
  choice: в праведности
  rationale: Сохраняет именную форму и широкий смысл צֶדֶק — праведность и справедливость, — не сводя выражение только к судебной справедливости или нравственной безупречности.
- source_word: וְאַחְזֵק בְּיָדֶךָ
  choice: возьму тебя за руку
  rationale: 'Передаёт конкретный образ: Яхве берёт призванного за руку, поддерживая и направляя его.'
- source_word: וְאֶצָּרְךָ
  choice: буду оберегать тебя
  rationale: Глагол נצר означает хранить, стеречь, оберегать; выбран естественный современный оборот с явным оттенком защиты.
- source_word: וְאֶתֶּנְךָ
  choice: дам тебя
  rationale: Сохраняет прямое значение נתן и необычную формулировку, в которой сам призванный даётся в качестве завета и света.
- source_word: לִבְרִית עָם
  choice: как завет для народа
  rationale: Сохраняет прямое отождествление служителя с заветом и не превращает его истолковательно в «посредника завета».
- source_word: עָם
  choice: народа
  rationale: Единственное число передаёт коллективное עָם; определённость понятна из контраста с последующим множественным «народов».
- source_word: לְאוֹר גּוֹיִם
  choice: как свет для народов
  rationale: Сохраняет образ света и широкий смысл גּוֹיִם — народы, не вводя более узкое и конфессионально окрашенное «язычники».
theological_decisions:
- issue: Призванный сам назван заветом для народа
  choice: дам тебя как завет для народа
  alternative: сделаю тебя посредником завета для народа
  rationale: В еврейском тексте адресат непосредственно даётся как завет. Прямая формулировка сохраняет богословскую насыщенность и не навязывает одно толкование его функции.
- issue: Соотношение единственного עָם и множественного גּוֹיִם
  choice: для народа … для народов
  alternative: для Израиля … для язычников
  rationale: Так сохраняется поэтический контраст оригинала, но вероятные референты не подставляются в основной текст и неоднозначность не устраняется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся близким к параллелизму еврейского стиха; необычный образ «дам тебя как завет» намеренно сохранён. Все местоимения второго лица даны со строчной буквы по нормам современного русского издания.
