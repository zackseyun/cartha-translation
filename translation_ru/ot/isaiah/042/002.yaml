  yaml_path: translation/ot/isaiah/042/002.yaml
  text: He will not cry out or raise his voice[a], or make his voice heard in the street.
translation:
  language: ru
  text: Он не будет кричать, не возвысит голоса и не даст услышать свой голос на улице.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он не кричит, не возвышает голоса и не даёт услышать свой голос снаружи».'
    reason: 'Лексико-аспектуальная альтернатива: имперфекты допускают настоящее обычного действия, а בַּחוּץ может означать «снаружи», то есть во внешнем, открытом или общественном пространстве.'
lexical_decisions:
- source_word: יִצְעַק
  choice: не станет кричать
  rationale: צעק обозначает громкий крик или воззвание; «кричать» естественно передаёт публичную звучность, не добавляя непременно оттенка отчаяния.
- source_word: יִשָּׂא
  choice: не возвысит голоса
  rationale: נשׂא буквально значит «поднимать», но здесь эллиптически подразумевается голос; русский оборот «возвысить голос» сохраняет образ и параллелизм.
- source_word: יַשְׁמִיעַ
  choice: не даст услышать
  rationale: Порода hифиль выражает каузативность — «сделать так, чтобы было услышано»; формулировка сохраняет это значение и звучит естественно.
- source_word: בַּחוּץ
  choice: на улице
  rationale: חוּץ обозначает внешнее, открытое общественное пространство; в данном образе «на улице» — точный и естественный русский эквивалент.
- source_word: קוֹלוֹ
  choice: свой голос
  rationale: קוֹל в контексте речи означает «голос»; возвратное «свой» однозначно связывает его с подлежащим.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: не станет ... не ... и не
  rationale: Последовательность отрицаний передана ритмической цепочкой; будущее время соответствует программному, устремлённому вперёд описанию Слуги.
theological_decisions:
- issue: Временно-аспектуальное значение имперфектов в песне о Слуге
  choice: 'Будущее описательное: «Он не станет…»'
  alternative: 'Настоящее обычного действия: «Он не кричит…»'
  rationale: В пророческом контексте имперфекты изображают будущую и вместе с тем характерную манеру действий Слуги. Будущее время сохраняет направленность отрывка вперёд, не исключая характеристики постоянного поведения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Сохранены три параллельных отрицания и нарастание от крика к публично слышимому голосу; эллипсис второго глагола раскрыт естественным оборотом «возвысит голоса».
