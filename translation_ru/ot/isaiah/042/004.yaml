base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/004.yaml
  text: He will not grow dim or be crushed until he establishes justice in the earth[a], and the coastlands will wait for his instruction.
translation:
  language: ru
  text: Он не померкнет и не будет сокрушён, пока не утвердит справедливость на земле, и прибрежные земли будут с надеждой ожидать[a] его наставления.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут надеяться на его наставление». Еврейский глагол означает ожидание, исполненное надежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְהֶה
  choice: не померкнет
  rationale: Глагол כהה означает «тускнеть, меркнуть, слабеть». «Не померкнет» сохраняет образную связь с едва тлеющим фитилём в предыдущем стихе и естественно звучит по-русски применительно к Слуге.
- source_word: יָרוּץ
  choice: не будет сокрушён
  rationale: Глагол רצץ означает «сокрушать, ломать». Страдательная формулировка передаёт форму и сохраняет связь с образом надломленной трости в Ис 42:3.
- source_word: עַד יָשִׂים
  choice: пока не утвердит
  rationale: Глагол שׂים буквально означает «положить, установить»; в сочетании с מִשְׁפָּט речь идёт об утверждении справедливого порядка.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: Русское «на земле» допускает как значение конкретной страны, так и более широкий смысл всей земли; упоминание прибрежных земель поддерживает широкий горизонт стиха.
- source_word: מִשְׁפָּט
  choice: справедливость
  rationale: Здесь מִשְׁפָּט обозначает не только судебное решение, но и справедливый порядок; «справедливость» ясно передаёт этот смысл современному читателю.
- source_word: לְתוֹרָתוֹ
  choice: его наставления
  rationale: תּוֹרָה имеет широкий смысл учения и наставления, а не только свода законов. «Наставление» сохраняет содержательную и авторитетную окраску слова.
- source_word: אִיִּים
  choice: прибрежные земли
  rationale: В пророческой речи אִיִּים может обозначать острова, побережья и отдалённые заморские области. «Прибрежные земли» не сужает значение до буквальных островов.
- source_word: יְיַחֵילוּ
  choice: будут ожидать
  rationale: Глагол יחל выражает ожидание, часто соединённое с надеждой. Основной текст сохраняет идею ожидания, а оттенок надежды и возможный вариант перевода отмечены в сноске.
theological_decisions:
- issue: Масштаб миссии Слуги
  choice: Широкий горизонт, выраженный словами «на земле» и «прибрежные земли»
  alternative: Преимущественно земля Израиля с возможным дальнейшим расширением смысла
  rationale: Сочетание אֶרֶץ с אִיִּים указывает за пределы одной местности, но русский оборот «на земле» сохраняет присущую אֶרֶץ неоднозначность и не привносит в стих более поздние богословские выводы.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Пара «не померкнет — не будет сокрушён» сохраняет образные и лексические связи с предыдущим стихом; синтаксис оставлен компактным и торжественным.
