  text: כֹּֽה אָמַ֞ר הָ/אֵ֣ל יְהוָ֗ה בּוֹרֵ֤א הַ/שָּׁמַ֨יִם֙ וְ/נ֣וֹטֵי/הֶ֔ם רֹקַ֥ע הָ/אָ֖רֶץ וְ/צֶאֱצָאֶ֑י/הָ נֹתֵ֤ן נְשָׁמָה֙ לָ/עָ֣ם עָלֶ֔י/הָ וְ/ר֖וּחַ לַ/הֹלְכִ֥ים בָּֽ/הּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/005.yaml
  text: 'Thus says God[a], Yahweh, who created the heavens and stretched them out, who spread out the earth and its offspring[c][b], who gives breath to the people on it and spirit to those who walk in it:'
translation:
  language: ru
  text: 'Так говорит Бог, Яхве, сотворивший небеса и распростёрший их, разостлавший землю[a] и то, что она производит[b], дающий дыхание народу на ней и дух[c] тем, кто ходит по ней:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выковавший землю». Еврейский глагол может вызывать образ металла, который расплющивают ударами.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «её порождение»; возможно также: «её произрастание», «её плоды».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «дыхание». Еврейское слово может означать «дух», «дыхание» или «ветер».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל יְהוָה
  choice: Бог Яхве
  rationale: Сохраняет и нарицательное обозначение Бога, и непосредственно названное заветное имя; по-русски сочетание звучит естественно и торжественно.
- source_word: בּוֹרֵא הַשָּׁמַיִם
  choice: сотворивший небеса
  rationale: Причастная конструкция естественно передаёт еврейское причастие и сохраняет возвышенный стиль описания Творца.
- source_word: וְנוֹטֵיהֶם
  choice: и распростёрший их
  rationale: Передаёт образ растягивания или простирания небес и ясно соотносит местоимение с небесами.
- source_word: רֹקַע הָאָרֶץ
  choice: расстеливший землю
  rationale: Глагол רָקַע обозначает распластывание, распространение, а также выколачивание; «расстеливший» естественно передаёт результирующий пространственный образ, а более предметный оттенок отмечен в сноске.
- source_word: וְצֶאֱצָאֶיהָ
  choice: и то, что она производит
  rationale: 'Широкая формулировка сохраняет неопределённый объём еврейского слова: всё, что произрастает, рождается или появляется из земли, без необоснованного сужения до одной растительности.'
- source_word: נֹתֵן נְשָׁמָה
  choice: дающий дыхание
  rationale: נְשָׁמָה здесь означает дыхание, поддерживающее жизнь, а не отдельную «душу».
- source_word: לָעָם עָלֶיהָ
  choice: народу на ней
  rationale: עָם имеет собирательное значение; женское местоимение относится к земле. Формулировка сохраняет грамматическую образность исходного текста.
- source_word: וְרוּחַ
  choice: и дух
  rationale: Отличает רוּחַ от предшествующего נְשָׁמָה и сохраняет смысловое напряжение между «дыханием» и «духом»; возможное значение «дыхание» вынесено в сноску.
- source_word: לַהֹלְכִים בָּהּ
  choice: тем, кто ходит по ней
  rationale: Сохраняет конкретный образ хождения по земле, естественно звучащий по-русски и обозначающий её обитателей.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблён тетраграмматон; «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Различение נְשָׁמָה и רוּחַ
  choice: дыхание … дух
  alternative: дыхание … дыхание
  rationale: Разные русские соответствия сохраняют два родственных, но не тождественных еврейских слова и не устраняют их антропологическую и богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Причастный ряд сохраняет синтаксическую торжественность оригинала; лексика остаётся понятной обычному читателю. Двоеточие сохранено, поскольку стих вводит последующую прямую речь.
