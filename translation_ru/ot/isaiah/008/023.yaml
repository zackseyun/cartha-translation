base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/023.yaml
  text: For there will be no gloom for her who was in anguish[a]. In the former time he brought contempt on the land of Zebulun and the land of Naphtali, but in the latter time he will make glorious the way of the sea, beyond the Jordan[c][b], Galilee of the nations.
translation:
  language: ru
  text: Ибо не будет мрака у той, что была в тесноте.[a] В прежнее время Он унизил землю Завулона и землю Неффалима, а впоследствии прославит путь у моря, Заиорданье, Галилею народов.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало стиха в еврейском тексте трудно для понимания. Слово, переведённое как «мрак», может также означать «тьму» или «помрачение».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Галилею народов»; возможно также: «Галилею язычников».'
    reason: lexical_alternative
  - marker: c
    text: В Мф. 4:15–16 эти земли упомянуты в связи с началом открытого служения Иисуса.
    reason: cross_reference
lexical_decisions:
- source_word: מוּעָף
  choice: мрак
  rationale: Редкое и трудное слово передаёт гнетущую тьму или помрачение; «мрак» естественно связывает стих с ближайшим контекстом тьмы и надежды.
- source_word: מוּצָק
  choice: теснота
  rationale: Слово обозначает стеснение, давление, бедственное положение. «Теснота» сохраняет образ давления и звучит достойно в современном литературном русском.
- source_word: הֵקַל
  choice: унизил
  rationale: В противопоставлении הִכְבִּיד глагол означает лишение веса, чести и значимости; «унизил» ясно передаёт прежнее бесчестие этих земель.
- source_word: הִכְבִּיד
  choice: прославит
  rationale: Буквально «сделает тяжёлым, весомым»; в антитезе к унижению речь идёт о наделении честью и славой. Будущее время соответствует движению контекста от суда к надежде.
- source_word: דֶּרֶךְ הַיָּם
  choice: путь у моря
  rationale: Формально близкая и понятная передача географического выражения без излишнего уточнения, было ли это дорогой или целой приморской областью.
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: Заиорданье
  rationale: Естественное русское географическое наименование сохраняет компактность еврейского выражения; направление относительно Иордана остаётся неуточнённым.
- source_word: גְּלִיל הַגּוֹיִם
  choice: Галилею народов
  rationale: «Народы» — широкое и буквальное значение גּוֹיִם; традиционное «язычников» дано в примечании как допустимая альтернатива.
- source_word: כִּי לֹא
  choice: Но не будет больше
  rationale: Передаёт смысловой поворот от предшествующего мрака к будущему избавлению. «Больше» естественно выражает прекращение прежнего состояния, хотя прямо отдельным словом в еврейском не представлено.
- source_word: לַאֲשֶׁר מוּצָק לָהּ
  choice: там, где была теснота
  rationale: Женский суффикс, вероятно, относится к олицетворённой земле или области. Пространственная формулировка по-русски естественна и не вводит отсутствующее в тексте существительное.
theological_decisions:
- issue: Будущая слава или продолжение суда в заключительной части
  choice: «прославит» — будущая перемена к чести
  alternative: «отяготил» или «сделал тягостным» — продолжение суда
  rationale: Антитеза между הֵקַל и הִכְבִּיד, а также переход контекста от тьмы к надежде поддерживают смысл восстановления чести. При этом примечание отмечает грамматическую трудность, не выдавая толкование за бесспорное.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Сохранены географическая последовательность, контраст унижения и прославления и трудность первой фразы; избегнуты архаизмы и конфессионально нагруженные уточнения.
