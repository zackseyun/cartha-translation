base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/022.yaml
  text: And he will look to the earth[a], and behold, distress and darkness, the gloom of anguish[b]; and thick darkness will be driven away.
translation:
  language: ru
  text: 'И взглянет он на землю[a] — и вот: бедствие и тьма, мрак страдания; и во мглу он будет изгнан[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на страну»; еврейское слово может означать также «край».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст здесь предельно сжат. Заключение буквально содержит слова: «и непроглядная тьма — изгнанный/отброшенный»; его синтаксис спорен. Наиболее вероятно, что подразумевается человек, изгнанный во мглу. Некоторые понимают это как «густая тьма будет прогнана», но такое понимание менее вероятно из-за несовпадения грамматического рода слов.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֶרֶץ
  choice: землю
  rationale: Слово может означать как землю вообще, так и страну или край. В контексте противопоставления взгляду вверх естественно основное значение «землю»; вариант «страну» сохранён в сноске.
- source_word: יַבִּיט
  choice: взглянет
  rationale: Глагол означает «смотреть, обращать взгляд». «Взглянет» естественно передаёт направленное действие и сохраняет возвышенный поэтический регистр.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Частица привлекает внимание к открывшейся взору картине; «и вот» точно и естественно передаёт её указательную силу.
- source_word: צָרָה וַחֲשֵׁכָה
  choice: бедствие и тьма
  rationale: 'Сохранена сжатая парная конструкция: צָרָה обозначает бедствие или тяжёлое положение, а חֲשֵׁכָה — тьму.'
- source_word: מְעוּף צוּקָה
  choice: мрак страдания
  rationale: Редкое מְעוּף, вероятно, означает мрак или сумрак и связано конструкцией сопряжения с צוּקָה — страданием, мукой, теснотой. Перевод сохраняет образ и поэтическое усиление.
- source_word: אֲפֵלָה
  choice: мглу
  rationale: Слово обозначает глубокую, непроглядную тьму. «Мгла» отличает его от уже употреблённого חֲשֵׁכָה и передаёт нарастание образа.
- source_word: מְנֻדָּח
  choice: будет изгнан
  rationale: Пассивное причастие от נדח означает «изгнанный, отогнанный, вытесненный». Мужской род формы позволяет понимать подразумеваемым субъектом человека, который оказывается изгнан во мглу.
theological_decisions:
- issue: Подразумеваемый субъект заключительной фразы
  choice: Человек будет изгнан во мглу
  alternative: Густая тьма будет прогнана
  rationale: Еврейская фраза предельно сжата, однако מְנֻדָּח стоит в мужском роде, тогда как אֲפֵלָה — существительное женского рода. Поэтому грамматически предпочтительнее видеть подразумеваемым субъектом человека, о котором говорится в начале стиха, а אֲפֵלָה понимать как направление изгнания. Необычность конструкции отмечена в сноске без устранения её неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Двоеточие сохраняет перечислительную сжатость еврейского текста, а точка с запятой отделяет трудную заключительную фразу, не сглаживая её напряжённость.
