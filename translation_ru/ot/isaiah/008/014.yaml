base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/014.yaml
  text: And he will become a sanctuary[a], but a stone to strike against and a rock to stumble over for both houses of Israel[b], a trap and a snare to the inhabitant of Jerusalem.
translation:
  language: ru
  text: И станет Он святилищем; для обоих домов Израиля — камнем, о который ударятся, и скалой, о которую споткнутся; для жителей Иерусалима[a] — ловушкой и западнёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для жителя Иерусалима»; форма единственного числа здесь имеет собирательное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И станет Он
  rationale: Форма глагола в пророческом контексте передаёт будущее. «Станет» естественно вводит последующие образы; местоимение восстанавливается из контекста стиха 13, где речь идёт о Господе.
- source_word: לְמִקְדָּשׁ
  choice: святилищем
  rationale: מִקְדָּשׁ обозначает святое место, святилище. Перевод сохраняет культовый смысл и возможный оттенок защищённости, не сводя образ только к убежищу.
- source_word: אֶבֶן נֶגֶף
  choice: камнем, о который ударятся
  rationale: נֶגֶף связано с ударом или столкновением. Такая передача сохраняет конкретный образ и отличает его от следующего выражения, где прямо говорится о преткновении.
- source_word: צוּר מִכְשׁוֹל
  choice: скалой, о которую споткнутся
  rationale: צוּר означает «скала», а מִכְשׁוֹל — препятствие, вызывающее падение или преткновение. Русская формулировка передаёт конкретную метафору.
- source_word: לִשְׁנֵי בָתֵּי יִשְׂרָאֵל
  choice: для обоих домов Израиля
  rationale: Сохраняется указание на две части разделённого Израиля; «оба дома» звучит по-русски естественно и точно.
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: ловушкой и западнёй
  rationale: Два близких, но не тождественных образа ловли переданы двумя русскими словами, без сведения еврейской пары к одному понятию.
- source_word: לְיוֹשֵׁב יְרוּשָׁלִָם
  choice: для жителей Иерусалима
  rationale: Единственное число причастия имеет собирательное значение; множественное число ясно и естественно выражает этот смысл по-русски.
theological_decisions:
- issue: К кому относится подразумеваемое подлежащее וְהָיָה
  choice: В тексте восстановлено местоимение «Он», относящееся к Господу из непосредственного контекста Ис 8:13.
  alternative: Оставить предложение без явно названного подлежащего или понимать его безлично.
  rationale: Ближайший контекст указывает на Господа Воинств. При этом имя «Господь» в стих не добавляется, поскольку его нет в еврейском тексте данного стиха.
- issue: Сочетание святилища с образами преткновения и суда
  choice: 'Сохранено противопоставление: тот же самый референт является святилищем, но также камнем, скалой, ловушкой и западнёй.'
  alternative: Передать מִקְדָּשׁ только как «убежище» и тем самым сгладить напряжение между защитой и судом.
  rationale: Еврейский текст намеренно соединяет защитный и грозный образы; перевод не объясняет и не устраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Тире проясняют распределение образов между обоими домами Израиля и жителями Иерусалима; конкретные глагольные обороты сохраняют различие между столкновением и преткновением.
