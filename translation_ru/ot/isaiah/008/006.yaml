  text: יַ֗עַן כִּ֤י מָאַס֙ הָ/עָ֣ם הַ/זֶּ֔ה אֵ֚ת מֵ֣י הַ/שִּׁלֹ֔חַ הַ/הֹלְכִ֖ים לְ/אַ֑ט וּ/מְשׂ֥וֹשׂ אֶת רְצִ֖ין וּ/בֶן רְמַלְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/006.yaml
  text: Because this people has rejected the waters of Shiloah that flow gently[a], and rejoices over Rezin and the son of Remaliah[b],
translation:
  language: ru
  text: За то, что этот народ отверг воды Шилоаха[a], текущие тихо, и радуется Рецину и сыну Ремальи[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шилоах — еврейская форма названия; в греческой традиции — Силоам.
    reason: lexical_alternative
  - marker: b
    text: 'Или, согласно иному пониманию этого трудного места: «и трепещет перед Рецином и сыном Ремальи». В еврейском тексте стоит слово «радуется», однако некоторые понимают общий смысл иначе, исходя из контекста.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן כִּי
  choice: За то, что
  rationale: Составной союз вводит причину суда, о котором говорится в следующем стихе. Формулировка естественно соединяется с последующим «то вот» в Ис 8:7 и сохраняет причинное значение.
- source_word: מָאַס
  choice: отверг
  rationale: Глагол обозначает решительный отказ или отвержение; «отверг» точно передаёт смысл без избыточного акцента на эмоциональном презрении.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняет единственное число и характерный пророческий оборот.
- source_word: מֵי הַשִּׁלֹחַ
  choice: воды Шилоаха
  rationale: Имя передано непосредственно с еврейской формы שִׁלֹחַ; привычная форма «Силоам», восходящая к греческой традиции, указана в сноске.
- source_word: הַהֹלְכִים לְאַט
  choice: текущие тихо
  rationale: Буквально воды «идут тихо/медленно»; применительно к воде «текущие тихо» звучит естественно и сохраняет контраст с бурной рекой следующего стиха.
- source_word: וּמְשׂוֹשׂ
  choice: и радуется
  rationale: Масоретский текст естественно связывается с корнем שׂושׂ, «радоваться, ликовать». Перевод сохраняет это чтение, не заменяя его контекстуальной догадкой о страхе.
- source_word: אֶת רְצִין וּבֶן רְמַלְיָהוּ
  choice: Рецину и сыну Ремальи
  rationale: При русском глаголе «радоваться» лица, являющиеся предметом радости, естественно ставятся в дательном падеже. Оборот «сын Ремальи» сохранён, поскольку в книге Исаии он может иметь намеренно отстранённый оттенок.
theological_decisions:
- issue: Трудное выражение וּמְשׂוֹשׂ אֶת רְצִין וּבֶן רְמַלְיָהוּ
  choice: и радуется Рецину и сыну Ремальи
  alternative: и трепещет перед Рецином и сыном Ремальи
  rationale: Масоретский текст содержит форму от корня שׂושׂ («радоваться, ликовать»), поэтому основной текст передаёт именно её, хотя в данном контексте смысл выражения остаётся трудным. Толкование как страха не внесено в текст, а приведено в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой речи. Синтаксис оставлен открытым к следующему стиху: начальное «За то, что» и конечная запятая передают незавершённую причинную конструкцию. Имена транслитерированы с еврейского, при этом общеизвестная греческая форма «Силоам» сохранена в сноске.'
