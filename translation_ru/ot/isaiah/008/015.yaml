  yaml_path: translation/ot/isaiah/008/015.yaml
  text: And many among them will stumble[a]; they will fall and be broken; they will be snared and captured.
translation:
  language: ru
  text: И многие среди них споткнутся[a], упадут и разобьются, попадут в западню и будут схвачены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многие споткнутся о него (или о них)», если местоимение относится к образам камня или западни в ближайшем контексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: споткнутся
  rationale: Глагол כשל обозначает спотыкание или потерю устойчивости; выбор сохраняет конкретный образ из ближайшего контекста и естественно передаёт предстоящий результат.
- source_word: בָם
  choice: из них
  rationale: Сочетание предлога ב с местоименным суффиксом допускает понимание «среди них»; по-русски «многие из них» естественно обозначает многих внутри упомянутой группы. Возможная отсылка к образу камня или западни отмечена в сноске.
- source_word: רַבִּים
  choice: многие
  rationale: Кратко передаёт субстантивированное прилагательное и не добавляет отсутствующего в еврейском тексте существительного.
- source_word: וְנָפְלוּ
  choice: упадут
  rationale: Прямое соответствие обычному значению נפל и продолжение последовательности образов.
- source_word: וְנִשְׁבָּרוּ
  choice: разобьются
  rationale: Форма нифаль выражает состояние или результат «быть разбитым». Возвратная русская форма естественно следует после «упадут» и сохраняет конкретность образа без усиления до «будут сокрушены».
- source_word: וְנוֹקְשׁוּ
  choice: попадут в западню
  rationale: Нифаль глагола יקש передаёт попадание в силок или ловушку. «Западня» сохраняет образ поимки и звучит естественно в современном литературном русском.
- source_word: וְנִלְכָּדוּ
  choice: будут схвачены
  rationale: Глагол לכד обозначает захват или поимку. Этот вариант отличает окончательный захват от предшествующего попадания в западню.
theological_decisions:
- issue: Образы суда в контексте камня преткновения
  choice: 'Сохранена конкретная цепь образов: споткнуться, упасть, разбиться, попасть в западню и быть схваченным.'
  alternative: Передать всё одной отвлечённой формулировкой о гибели или духовном падении.
  rationale: Еврейский текст намеренно соединяет образы препятствия и ловушки. Их сохранение не сводит богословский смысл суда к одной заранее выбранной интерпретации.
- issue: Референт местоимения בָם
  choice: 'В основном тексте: «многие из них», то есть многие среди упомянутых людей.'
  alternative: «Многие споткнутся о это / о них», связывая местоимение с образами камня или ловушки.
  rationale: Синтаксис и контекст допускают более одного понимания. Основной вариант естественен по-русски, а реальная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с кратким, ритмичным перечислением. Конкретные метафоры сохранены; архаизмы и конфессионально окрашенные пояснения не добавлены.
