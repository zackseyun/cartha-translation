source:
  edition: WLC
  text: לֹא תֹאמְר֣וּ/ן קֶ֔שֶׁר לְ/כֹ֧ל אֲשֶׁר יֹאמַ֛ר הָ/עָ֥ם הַ/זֶּ֖ה קָ֑שֶׁר וְ/אֶת מוֹרָא֥/וֹ לֹֽא תִֽירְא֖וּ וְ/לֹ֥א תַעֲרִֽיצוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/012.yaml
  text: Do not call conspiracy everything that this people calls conspiracy[a], and do not fear what they fear[b], nor be in dread.
translation:
  language: ru
  text: Не называйте заговором всё, что этот народ называет заговором[a]; не бойтесь того, чего он боится[b], и не трепещите.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не говорите: “Заговор!” — обо всём, о чём этот народ говорит: “Заговор!”»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не бойтесь его страха»; выражение может означать как страх этого народа, так и то, что внушает ему страх.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁר / קָשֶׁר
  choice: заговор
  rationale: Слово обозначает тайный сговор или заговор, в том числе политический. «Заговор» естественно передаёт повторяющееся обозначение, которым народ выражает свою тревожную оценку происходящего.
- source_word: תֹאמְרוּן
  choice: называйте
  rationale: Буквально глагол означает «говорить», но в данной конструкции речь идёт о присвоении явлению названия; поэтому русское «называть заговором» точнее и естественнее передаёт смысл.
- source_word: לְכֹל אֲשֶׁר יֹאמַר הָעָם הַזֶּה
  choice: всё, что этот народ называет
  rationale: Так передаётся отношение «относительно всего, о чём этот народ говорит» с подразумеваемым именным сказуемым «заговор»; формулировка остаётся ясной по-русски.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняет собирательное единственное число и возможный оттенок дистанцирования или упрёка, не заменяя выражение более нейтральным «эти люди».
- source_word: מוֹרָאוֹ
  choice: того, чего он боится
  rationale: Суффикс единственного числа относится к собирательному «этот народ». Формулировка естественна по-русски и передаёт страх через его предмет, не исключая более буквального понимания «его страха».
- source_word: תִירְאוּ
  choice: не бойтесь
  rationale: Прямо передаёт глагол ירא и сохраняет словесную связь с выражением מוֹרָאוֹ.
- source_word: תַעֲרִיצוּ
  choice: не трепещите
  rationale: 'Передаёт усиление: быть охваченными ужасом или считать нечто внушающим ужас. «Трепетать» сохраняет возвышенный поэтический регистр и не сливается полностью с предшествующим «бояться».'
theological_decisions:
- issue: Смысл запрета относительно страха
  choice: Народу Божьему запрещено перенимать испуганную оценку происходящего и панику окружающего народа.
  alternative: Запрет относится исключительно к участию в реальном политическом заговоре либо прежде всего к страху перед самим народом.
  rationale: Повтор слова «заговор» и параллельные запреты бояться и трепетать указывают на предостережение против принятия народной оценки и разделения его страха. Перевод не уточняет исторический предмет страха сверх того, что выражено в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксический параллелизм и нарастание «не бойтесь… не трепещите» сохранены; «этот народ» удерживает возможный оттенок дистанцирования.
