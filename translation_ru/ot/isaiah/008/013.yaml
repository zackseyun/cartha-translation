  text: Yahweh of hosts—you shall regard him as holy[a]. Let him be your fear[b], and let him be your dread.
translation:
  language: ru
  text: Яхве Воинств — Его почитайте святым[a]. Он да будет вашим страхом и трепетом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Его освящайте». Здесь это значит признавать Яхве святым и относиться к Нему как к святому, а не делать Его святым.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Он да будет Тем, кого вы боитесь и перед кем трепещете». Еврейские слова могут обозначать как сам страх и трепет, так и Того, кого боятся.'
    reason: ambiguity
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יְהוָה передано как «Яхве», а צְבָאוֹת — широким по значению словом «Воинств», не ограничивающим выражение только земными или только небесными силами.
- source_word: אֹתוֹ תַקְדִּישׁוּ
  choice: Его почитайте святым
  rationale: Каузативная форма от קדשׁ здесь призывает признавать святость Яхве и относиться к Нему как к святому, а не наделять Его святостью. Формулировка сохраняет прямое повеление и естественно звучит по-русски.
- source_word: מוֹרַאֲכֶם
  choice: вашим страхом
  rationale: Существительное מוֹרָא может обозначать страх либо того, кто внушает страх. Буквальное предикативное выражение сохраняет напряжённость и параллелизм еврейского текста.
- source_word: מַעֲרִצְכֶם
  choice: вашим трепетом
  rationale: Слово выражает сильный страх, ужас перед тем, кого страшатся. «Трепет» передаёт усиление по отношению к «страху», сохраняя при этом возвышенный и естественный русский регистр.
- source_word: וְהוּא ... וְהוּא
  choice: Он да будет ... и Он — ...
  rationale: В еврейском стоят именные предложения, буквально «и Он — ваш страх, и Он — ваш трепет». Русская конструкция «да будет» передаёт увещевательную силу контекста, а повторение «Он» сохраняет эмфазу оригинала.
theological_decisions:
- issue: Передача имени и титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Сил / Господь Воинств
  rationale: Текст прямо употребляет тетраграмматон как личное имя. Транслитерация сохраняет отличие имени от титула, а «Воинств» не сужает неоднозначный объём צְבָאוֹת.
- issue: Смысл повеления תַקְדִּישׁוּ
  choice: почитайте святым
  alternative: освящайте
  rationale: Речь не о том, что люди делают Бога святым, а о признании Его святости и соответствующем отношении к Нему. Выбор не устраняет богословскую весомость понятия святости.
- issue: Отношение двух заключительных именных предложений к повелению
  choice: Он да будет вашим страхом и Он — вашим трепетом
  alternative: Он — ваш страх, и Он — ваш трепет
  rationale: Еврейская форма допускает буквальное утверждение, но контекст противопоставленного увещевания поддерживает волитивное прочтение. Частица «да» передаёт его, не превращая выражение в категорическое объяснение природы Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Повторение «Он» и пара «страх — трепет» сохраняют параллелизм и нарастающую силу еврейской строки; архаизмы сведены к функционально оправданной частице «да».
