  text: וְ/אָעִ֣ידָה לִּ֔/י עֵדִ֖ים נֶאֱמָנִ֑ים אֵ֚ת אוּרִיָּ֣ה הַ/כֹּהֵ֔ן וְ/אֶת זְכַרְיָ֖הוּ בֶּ֥ן יְבֶרֶכְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/002.yaml
  text: 'And I will take for myself faithful witnesses: Uriah the priest and Zechariah son of Jeberekiah[a][b].'
translation:
  language: ru
  text: 'И я возьму себе надёжных свидетелей[a]: Урию, священника, и Захарию, сына Иеверехии[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призову свидетелями» или «поставлю свидетелями». Глагол указывает на официальное привлечение свидетелей для удостоверения.'
    reason: lexical_alternative
  - marker: b
    text: Евр. Йеверехьяху.
    reason: name_transliteration
lexical_decisions:
- source_word: וְאָעִידָה
  choice: И я возьму ... свидетелей
  rationale: 'Глагол в породе hифиль здесь имеет юридико-свидетельственный оттенок: заручиться свидетелями или назначить их для удостоверения. «Возьму ... свидетелей» естественно по-русски и сохраняет эту функцию; возможные значения отмечены в сноске.'
- source_word: לִּי
  choice: себе
  rationale: Передаёт личную заинтересованность и участие говорящего без излишнего усиления.
- source_word: עֵדִים נֶאֱמָנִים
  choice: надёжных свидетелей
  rationale: נֶאֱמָנִים обозначает тех, кому можно доверять и на чьё свидетельство можно положиться. В современном русском сочетание «надёжные свидетели» точнее и естественнее, чем «верные свидетели» в данном юридическом контексте.
- source_word: אֵת ... וְאֶת
  choice: ': ... и'
  rationale: Показатели прямого дополнения вводят имена свидетелей; по-русски их перечисление естественно оформить двоеточием и союзом «и».
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: Урию, священника
  rationale: Имя передано в принятой русской библейской форме, а определённое наименование должности — приложением.
- source_word: זְכַרְיָהוּ בֶּן יְבֶרֶכְיָהוּ
  choice: Захарию, сына Иеверехии
  rationale: Имена переданы в традиционных русских библейских формах; patronymic בֶּן передан обычной конструкцией «сына».
