base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/004.yaml
  text: For before the boy knows how to cry[c][b][a], ‘My father’ and ‘My mother,’ the wealth of Damascus and the spoil of Samaria will be carried away before the king of Assyria.
translation:
  language: ru
  text: 'Ведь прежде чем мальчик научится звать: «отец мой» и «мать моя», богатства Дамаска и добычу Самарии унесут пред царём Ассирии.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед царём Ассирии». Выражение может означать, что захваченное понесут в его присутствии или доставят ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим пророчеством естественно для современного русского языка.
- source_word: בְּטֶרֶם
  choice: прежде чем
  rationale: Точно выражает временное предшествование событию, обозначенному далее.
- source_word: יֵדַע ... קְרֹא
  choice: научится звать
  rationale: В сочетании с инфинитивом ידע обозначает достигнутую способность; «звать» сохраняет основное значение קרא и естественно вводит обращение к родителям.
- source_word: הַנַּעַר
  choice: мальчик
  rationale: Сохраняет мужской род и определённость, не внося в текст прямого отождествления ребёнка.
- source_word: אָבִי וְאִמִּי
  choice: «Отец мой» и «Мать моя»
  rationale: Сохраняет явно выраженные в еврейском тексте формы первого лица с притяжательным значением.
- source_word: יִשָּׂא
  choice: унесут
  rationale: Активная форма с неопределённым субъектом естественно передаётся русской неопределённо-личной конструкцией без добавления не названного агента.
- source_word: חֵיל
  choice: богатства
  rationale: В параллели с военной добычей слово указывает прежде всего на материальные ценности или ресурсы; множественное число естественно по-русски.
- source_word: שְׁלַל
  choice: добычу
  rationale: Современное и точное обозначение имущества, захваченного в войне.
- source_word: לִפְנֵי מֶלֶךְ אַשּׁוּר
  choice: пред царём Ассирии
  rationale: Сохраняет пространственно-реляционную формулировку оригинала и не уточняет сверх текста, будет ли добыча принесена царю или проведена перед ним.
theological_decisions:
- issue: Кого обозначает «мальчик»
  choice: В основном тексте оставлено «мальчик» без прямого отождествления.
  alternative: Прямо назвать его сыном Исаии Махер-Шелал-Хаш-Базом.
  rationale: Сам стих использует только определённое существительное «мальчик». Ближайший контекст позволяет установить вероятного референта, но перевод не должен устранять сохраняемую текстом меру неявности.
- issue: Отношение добычи к царю Ассирии
  choice: Сохранено буквальное «пред царём Ассирии».
  alternative: Передать как «унесут к царю Ассирии» или «царь Ассирии унесёт».
  rationale: לִפְנֵי буквально означает «перед, пред лицом»; более конкретные варианты могли бы неоправданно определить роль царя как места назначения или грамматического деятеля.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Пред царём» выбрано как краткая и достоинственная формула; остальная лексика общеупотребительна. Маркер сноски поставлен в основном тексте.
