source:
  edition: WLC
  text: לְ/תוֹרָ֖ה וְ/לִ/תְעוּדָ֑ה אִם לֹ֤א יֹֽאמְרוּ֙ כַּ/דָּבָ֣ר הַ/זֶּ֔ה אֲשֶׁ֥ר אֵֽין ל֖/וֹ שָֽׁחַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/020.yaml
  text: To the law and to the testimony! If they do not speak according to this word[b][a], there is no dawn for them.
translation:
  language: ru
  text: К закону[a] и к свидетельству! Если они не говорят в согласии с этим словом, для них нет зари[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к наставлению». Еврейское слово тора может означать не только закон, но и наставление.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская заключительная фраза предельно кратка и допускает разные понимания; возможно также: «…в согласии с этим словом, в котором нет зари» или «…для него нет зари».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְתוֹרָה
  choice: к закону
  rationale: Слово תּוֹרָה может обозначать как закон, так и наставление. «К закону» кратко и естественно передаёт обращение к данному Богом авторитетному мерилу; более широкое значение отмечено в сноске.
- source_word: וְלִתְעוּדָה
  choice: и к свидетельству
  rationale: תְּעוּדָה означает свидетельство или удостоверяющее свидетельство. Этот вариант сохраняет параллелизм с «законом» и идею авторитетного свидетельства.
- source_word: אִם לֹא יֹאמְרוּ
  choice: если они не говорят
  rationale: אִם לֹא естественно прочитывается как условие, а יֹאמְרוּ в данном контексте относится к тому, что люди провозглашают или говорят. Настоящее время по-русски естественно выражает общее условие.
- source_word: כַּדָּבָר הַזֶּה
  choice: в согласии с этим словом
  rationale: דָּבָר может означать слово, речь, дело или весть. «В согласии с этим словом» сохраняет формальную связь с авторитетным Божьим словом и ясно передаёт значение предлога כְּ.
- source_word: אֲשֶׁר אֵין לוֹ שָׁחַר
  choice: для них нет зари
  rationale: שַׁחַר — «заря». Русское множественное «для них» соотносит заключение с предшествующим «они» и передаёт коллективный смысл, не заменяя образ зари более толковательным словом «свет».
theological_decisions:
- issue: Смысл и отнесённость заключительной части стиха
  choice: 'Заключение предупреждает: для тех, кто не говорит в согласии с Божьим откровением, нет зари.'
  alternative: 'Заключение может относиться к самому высказыванию или сохранять грамматическое единственное число: «в нём нет зари» либо «для него нет зари».'
  rationale: Контекст противопоставляет обращение к Божьему откровению поиску иных источников руководства. При этом краткость и неоднозначность еврейской фразы признаются в сноске, а образ зари сохраняется без дополнительного догматического истолкования.
- issue: Значение אִם לֹא
  choice: 'Простое условие: «если… не».'
  alternative: 'Усилительное или клятвенное значение: «несомненно…» или «поистине…».'
  rationale: Условное прочтение грамматически прямолинейно и естественно связывает речь людей с последствием, не исключая того, что фраза может иметь усилительный оттенок.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной, лаконичной формы пророческого призыва. Эллиптическое «К закону и к свидетельству!» отражает столь же краткую еврейскую конструкцию; образ «зари» сохранён буквально.
