  text: Yahweh spoke to me again[a], saying,
translation:
  language: ru
  text: 'И Яхве вновь обратился ко мне[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И Яхве продолжил говорить ко мне ещё, говоря». Это еврейский оборот, вводящий новое обращение: «Яхве вновь обратился ко мне».'
    reason: Поясняет еврейскую конструкцию «добавил/продолжил говорить» и её значение, не выдавая неестественную русскую форму за дословный перевод.
lexical_decisions:
- source_word: וַיֹּסֶף ... עוֹד
  choice: снова говорил
  rationale: Сочетание יסף с глаголом и наречием עוֹד обозначает повторное действие. По-русски естественно передать его словом «снова», не воспроизводя буквально семитский оборот «добавил говорить».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: דַּבֵּר אֵלַי
  choice: говорил мне
  rationale: דבר означает «говорить», а אֶל с суффиксом первого лица указывает адресата речи. Русское «говорил мне» естественно в данном контексте.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит прямую речь, которая следует в следующем стихе; в современном русском эту функцию естественно выполняет двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык. Сохранена простота повествовательной формулы; двоеточие подготавливает прямую речь следующего стиха. Союз «И» отражает וַ־ и связь с предшествующим повествованием.
