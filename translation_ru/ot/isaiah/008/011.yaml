base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/011.yaml
  text: 'For thus Yahweh said to me with a strong hand[a], warning me not to walk in the way of this people[b], saying:'
translation:
  language: ru
  text: 'Ибо так сказал мне Яхве, когда Его рука с силой была на мне[a], предостерегая[b] меня не идти путём этого народа:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при силе руки». Возможный перевод: «когда Его рука с силой была на мне». Это выражение передаёт властное, непреодолимое воздействие Бога.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может также означать «наставляя», «вразумляя» или «исправляя»; здесь такое воздействие вводит запрет.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Ибо так сказал
  rationale: כִּי связывает стих с предшествующим контекстом как объяснение, а כֹה вводит последующую прямую речь; формула передана естественно и с сохранением пророческого регистра.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: כְּחֶזְקַת הַיָּד
  choice: властно возложив на меня Свою руку
  rationale: Буквальная конструкция «при силе руки» обозначает сильное, принуждающее воздействие. Русская формулировка сохраняет образ руки и ясно связывает её с Яхве, не представляя «сильную руку» как описание физической конечности.
- source_word: וְיִסְּרֵנִי
  choice: и предостерегая меня
  rationale: Глагол יסר охватывает наставление, вразумление, исправление и предостережение; последующий запрет делает «предостерегая» уместным в основном тексте, тогда как более широкий диапазон отмечен в сноске.
- source_word: מִלֶּכֶת בְּדֶרֶךְ
  choice: не идти путём
  rationale: После יסר предлог מן выражает удержание от действия. «Идти путём» сохраняет этико-поведенческую метафору и звучит естественно по-русски.
- source_word: הָעָם הַזֶּה
  choice: этого народа
  rationale: Сохраняет единственное число собирательного существительного и указательность еврейской фразы.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит содержание речи, продолжающееся в следующем стихе; в современном русском эту функцию естественно выполняет двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, то есть личное имя; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Характер действия Божьей руки
  choice: властно возложив на меня Свою руку
  alternative: сильной рукой; когда Его рука была сильна надо мной
  rationale: Фраза указывает на мощное Божье воздействие на пророка. Выбранный вариант сохраняет образ и силу воздействия, не уточняя сверх текста, было ли это переживание принуждением, вдохновением или иным пророческим воздействием.
- issue: Значение יסר
  choice: предостерегая
  alternative: наставляя; вразумляя; наказывая
  rationale: Контекст содержит запрещение следовать пути народа, поэтому функционально речь идёт о предостережении; многозначность глагола сохранена в примечании.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис оставлен открытым к следующему стиху посредством двоеточия. Заглавное «Свою» применено как уважительное написание местоимения, относящегося к Богу.
