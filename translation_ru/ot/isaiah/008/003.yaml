  text: וָ/אֶקְרַב֙ אֶל הַ/נְּבִיאָ֔ה וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קְרָ֣א שְׁמ֔/וֹ מַהֵ֥ר שָׁלָ֖ל חָ֥שׁ בַּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/003.yaml
  text: So I went near to the prophetess[a], and she conceived and bore a son. Then Yahweh said to me[b], “Call his name Maher-shalal-hash-baz.”
translation:
  language: ru
  text: 'И я приблизился к пророчице, и она зачала и родила сына. И сказал мне Яхве: «Назови его Махер-Шалал-Хаш-Баз[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Смысл имени приблизительно: «Спешит грабёж, торопится добыча»; возможна также передача: «Скорее к добыче, поспешнее к грабежу».'
    reason: Имя имеет символический смысл, а краткая еврейская фраза допускает разные синтаксические толкования.
lexical_decisions:
- source_word: וָאֶקְרַב
  choice: я приблизился
  rationale: Глагол קרב означает «приблизиться, подойти». В данном контексте это сдержанный эвфемизм супружеской близости; перевод сохраняет степень эксплицитности еврейского текста.
- source_word: הַנְּבִיאָה
  choice: к пророчице
  rationale: Существительное является женской формой слова «пророк»; современное русское «пророчица» точно и естественно передаёт это значение.
- source_word: וַתַּהַר
  choice: она зачала
  rationale: Глагол הרה означает «зачать, забеременеть». «Зачала» соответствует повествовательному стилю и хорошо сочетается с последующим «родила сына».
- source_word: וַתֵּלֶד בֵּן
  choice: и родила сына
  rationale: Прямой и естественный русский эквивалент еврейского выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: קְרָא שְׁמוֹ
  choice: Назови его
  rationale: Естественно передаёт еврейскую формулу «назови его имя», не внося дополнительного смысла.
- source_word: מַהֵר שָׁלָל חָשׁ בַּז
  choice: Махер-Шалал-Хаш-Баз
  rationale: Символическое личное имя транслитерировано в основном тексте; его значимый, но синтаксически неоднозначный смысл пояснён в сноске.
theological_decisions:
- issue: Следует ли прямо обозначить половую близость в выражении וָאֶקְרַב אֶל הַנְּבִיאָה
  choice: 'Сохранить эвфемизм: «я приблизился к пророчице»'
  alternative: «я вступил в близость с пророчицей»
  rationale: Контекст подразумевает супружескую близость, однако исходный текст выражается сдержанно. Перевод не должен устранять эту особенность.
- issue: Передача символического имени מַהֵר שָׁלָל חָשׁ בַּז
  choice: Транслитерировать имя, а значение пояснить в сноске
  alternative: Перевести имя непосредственно в основном тексте
  rationale: Это личное имя, но его смысл важен для пророческого знамения. Транслитерация сохраняет функцию имени, а сноска раскрывает игру значений без ложной однозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союзы «и» сохраняют последовательный ритм еврейских форм с вау; эвфемизм оригинала оставлен без эксплицитного расширения.
