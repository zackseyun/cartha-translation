  text: וְ/חִכִּ֨יתִי֙ לַ/יהוָ֔ה הַ/מַּסְתִּ֥יר פָּנָ֖י/ו מִ/בֵּ֣ית יַעֲקֹ֑ב וְ/קִוֵּ֖יתִֽי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/017.yaml
  text: And I will wait for Yahweh[a], who hides his face from the house of Jacob[b], and I will hope in him.
translation:
  language: ru
  text: И я буду ждать Яхве, который скрывает Своё лицо от дома Иакова[a], и буду надеяться на Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом Иакова» — собирательное обозначение потомков Иакова, то есть Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִכִּיתִי
  choice: И я буду ждать
  rationale: Глагол חכה обозначает ожидание, направленное к Богу; простое «ждать» естественно по-русски и не добавляет отсутствующего в тексте наречия «терпеливо».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает, кого ожидает говорящий; тетраграмматон передан транслитерацией личного имени «Яхве».
- source_word: הַמַּסְתִּיר פָּנָיו
  choice: скрывающего Своё лицо
  rationale: Причастие сохраняет оттенок продолжающегося или характерного действия, а библейский образ сокрытия лица оставлен без истолковывающего расширения.
- source_word: מִבֵּית יַעֲקֹב
  choice: от дома Иакова
  rationale: Формальное соответствие сохраняет собирательное обозначение потомков Иакова и его заветный оттенок.
- source_word: וְקִוֵּיתִי
  choice: и буду надеяться
  rationale: קוה сочетает ожидание с упованием; «надеяться» отличает его от первого глагола и передаёт поэтический параллелизм.
- source_word: לוֹ
  choice: на Него
  rationale: В сочетании с «надеяться» русский язык требует предлога «на»; местоимение относится к Яхве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; «Яхве» непосредственно сохраняет это различие.
- issue: Сокрытие Божьего лица
  choice: сохранить образ «скрывающего Своё лицо»
  alternative: «отвернувшегося»; «лишившего благоволения»
  rationale: Буквенный образ несёт богословское напряжение Божьего удаления и не должен подменяться его толкованием.
- issue: Временной оттенок причастия הַמַּסְתִּיר
  choice: скрывающего
  alternative: который скрывает; который скрыл
  rationale: Русское причастие сохраняет возможный продолжающийся или характеризующий смысл и не закрепляет однозначно прошедшее действие.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной библейской образности. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской религиозно-литературной норме.
