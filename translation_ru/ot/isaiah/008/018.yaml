base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/018.yaml
  text: Behold[a], I and the children whom Yahweh has given me are for signs and wonders in Israel from Yahweh of Armies, who dwells on Mount Zion.
translation:
  language: ru
  text: Вот я и дети, которых дал мне Яхве, — знамения и чудеса в Израиле от Яхве Воинств[a], обитающего на горе Сион.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Господа Саваофа»; буквально титул означает «Яхве Воинств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-эмфатическую силу частицы естественным и при этом возвышенным современным русским оборотом.
- source_word: אָנֹכִי וְהַיְלָדִים
  choice: я и дети
  rationale: Самостоятельное местоимение сохраняется; יְלָדִים в данном контексте обозначает детей Исаии без ненужного сужения до мальчиков или юношей.
- source_word: אֲשֶׁר נָתַן לִי יְהוָה
  choice: которых дал мне Яхве
  rationale: Простое прошедшее время естественно по-русски выражает совершившееся дарование, значимое для настоящего.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לְאֹתוֹת וּלְמוֹפְתִים
  choice: знамения и предзнаменования
  rationale: Предикативная конструкция с тире естественно передаёт функцию Исаии и его детей; «предзнаменования» сохраняет контекстуальный смысл מוֹפְתִים как знаменательных предвестий, не навязывая исключительно чудесное значение.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Сохраняет наиболее прямое локативное значение предлога בְּ.
- source_word: מֵעִם
  choice: от
  rationale: Кратко и естественно обозначает источник этих знамений.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя и значение титула צְבָאוֹת, сохраняя традиционно возвышенный библейский регистр.
- source_word: הַשֹּׁכֵן בְּהַר צִיּוֹן
  choice: обитающего на горе Сион
  rationale: Причастный оборот сохраняет атрибутивную форму и длительно-характерный смысл еврейского причастия; «на горе» соответствует русской норме.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет это различие и не превращает имя в титул.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф
  rationale: Основной текст раскрывает значение צְבָאוֹת и сохраняет имя Яхве; знакомая традиционная форма приведена в примечании.
- issue: Значение מוֹפְתִים
  choice: предзнаменования
  alternative: чудеса
  rationale: В контексте имена и существование пророка и его детей служат знаковыми предвестиями; вариант не исключает необычайности, но не утверждает здесь непременно чудотворное событие.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Начальное «Вот» сохраняет призыв обратить внимание; тире ясно выражает предикативную связь без добавления отсутствующего в еврейском глагола. Единственный маркер [a] помещён непосредственно после поясняемого титула.
