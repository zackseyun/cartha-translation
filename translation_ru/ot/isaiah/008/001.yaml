  text: 'Then Yahweh said to me[b][a], “Take for yourself a large tablet and write on it with an ordinary stylus: ‘Maher-shalal-hash-baz.’”'
translation:
  language: ru
  text: 'Тогда Яхве сказал мне: «Возьми себе большую табличку и напиши на ней обычным резцом[a]: „Махер-Шалал-Хаш-Баз“[b]».'
