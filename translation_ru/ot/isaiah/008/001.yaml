  footnotes:
  - marker: a
    text: 'Буквально: «резцом человека»; возможны также переводы «человеческим резцом», «обычным письменным орудием» или «обычным, понятным людям письмом».'
    reason: 'Сочетание בְּחֶרֶט אֱנוֹשׁ неоднозначно: оно может обозначать орудие письма либо указывать на обычный, общепонятный способ письма.'
  - marker: b
    text: 'Еврейское имя Махер-Шалал-Хаш-Баз, вероятно, означает: «Спешит к грабежу, торопится к добыче».'
    reason: Основной текст сохраняет символическое имя в транслитерации, а сноска передаёт вероятный лексический смысл еврейской формулы.
