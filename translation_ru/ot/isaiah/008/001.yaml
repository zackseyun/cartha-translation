  rationale: Передаёт вероятный смысл общедоступного человеческого письма; неоднозначность сочетания сохранена в сноске.
- source_word: לְמַהֵר שָׁלָל חָשׁ בַּז
  choice: Махер-Шалал-Хаш-Баз
  rationale: Фраза становится символическим личным именем в ближайшем контексте, поэтому в основном тексте она транслитерирована, а её смысл пояснён в сноске.
- source_word: קַח לְךָ
  choice: Возьми себе
  rationale: Сохраняет личный оттенок дательного местоимения לְךָ.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: Тогда Яхве сказал мне
  rationale: «Тогда» естественно передаёт продвижение древнееврейского повествования.
