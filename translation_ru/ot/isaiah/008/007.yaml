  text: וְ/לָ/כֵ֡ן הִנֵּ֣ה אֲדֹנָ/י֩ מַעֲלֶ֨ה עֲלֵי/הֶ֜ם אֶת מֵ֣י הַ/נָּהָ֗ר הָ/עֲצוּמִים֙ וְ/הָ֣/רַבִּ֔ים אֶת מֶ֥לֶךְ אַשּׁ֖וּר וְ/אֶת כָּל כְּבוֹד֑/וֹ וְ/עָלָה֙ עַל כָּל אֲפִיקָ֔י/ו וְ/הָלַ֖ךְ עַל כָּל גְּדוֹתָֽי/ו־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/007.yaml
  text: Therefore[a], behold, the Lord is bringing up against them the waters of the River, mighty and many—the king of Assyria and all his glory[b]. And it will rise over all its channels and go over all its banks.
translation:
  language: ru
  text: 'И потому вот: Владыка поднимает против них могучие и обильные воды Реки[a] — царя Ассирии и всё его величие. И она поднимется над всеми своими руслами и перельётся через все свои берега.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «Рекой», вероятно, имеется в виду Евфрат — великая река, связанная с Ассирией.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָכֵן
  choice: Поэтому
  rationale: Передаёт следствие из предшествующего отказа от тихих вод Силоама.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательную и привлекающую внимание силу слова в естественном современном русском языке.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт титул Адонай, не смешивая его с передачей собственного имени YHWH.
- source_word: מַעֲלֶה עֲלֵיהֶם
  choice: поднимает против них
  rationale: Причастие создаёт картину уже надвигающегося действия, а глагол сохраняет образ поднимающихся вод.
- source_word: מֵי הַנָּהָר
  choice: воды Реки
  rationale: Сохраняет определённое, но не названное в самом тексте обозначение реки; вероятная отсылка к Евфрату вынесена в примечание.
- source_word: הָעֲצוּמִים וְהָרַבִּים
  choice: могучие и обильные
  rationale: Раздельно передаёт силу вод и их изобилие, не устраняя образ наводнения.
- source_word: אֶת מֶלֶךְ אַשּׁוּר וְאֶת כָּל כְּבוֹדוֹ
  choice: царя Ассирии со всем его величием
  rationale: Передаёт пояснительное приложение к образу вод; «величие» здесь охватывает блеск, мощь и внушительность царской силы.
- source_word: וְעָלָה עַל כָּל אֲפִיקָיו
  choice: И поднимется она выше всех своих русел
  rationale: Женский род местоименного подлежащего естественно отсылает к Реке; формулировка сохраняет образ воды, превышающей вместимость русел.
- source_word: וְהָלַךְ עַל כָּל גְּדוֹתָיו
  choice: и выйдет из всех своих берегов
  rationale: Естественный русский оборот ясно передаёт разлив воды за обычные границы, сохраняя упоминание всех берегов.
theological_decisions:
- issue: Кого обозначают воды Реки
  choice: Воды Реки метафорически представлены как царь Ассирии со всей полнотой его царского величия и силы, которую Владыка направляет на суд.
  alternative: Понимать слова лишь как буквальное описание реки, не подчёркивая метафорического отождествления.
  rationale: Еврейский текст сам ставит «царя Ассирии и всё его величие» в пояснительное приложение к «водам Реки», поэтому перевод сохраняет и образ, и данное в тексте истолкование.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но не архаичной пророческой интонацией. Двоеточие после «вот» делает последующее возвещение естественным; заглавная буква в слове «Река» передаёт определённость обозначения без внесения названия «Евфрат» в основной текст.
