base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/021.yaml
  text: And he will pass through it[a], hard-pressed and hungry; and when he is hungry, he will become enraged and curse his king and his God, and he will turn upward.
translation:
  language: ru
  text: И пройдёт он по ней, теснимый и голодный; и когда проголодается, придёт в ярость и проклянёт своего царя и своего Бога, а затем повернётся вверх[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посмотрит вверх». Буквально: «повернётся вверх»; вероятно, имеется в виду, что страдающий поднимает взгляд к небу.'
    reason: 'Лексическая альтернатива: еврейское выражение обозначает поворот вверх, но прямо не называет ни лицо, ни взгляд.'
lexical_decisions:
- source_word: וְעָבַר בָּהּ
  choice: И пройдёт он по ней
  rationale: Глагол стоит в 3-м лице мужского рода единственного числа, а местоименный суффикс — женского рода единственного числа. Перевод сохраняет представительное единственное число и не уточняет подразумеваемый объект сверх еврейского текста; предлог ב при עבר здесь передаёт движение по местности или через неё.
- source_word: נִקְשֶׁה
  choice: теснимый
  rationale: Форма обозначает человека, оказавшегося в тяжёлых, стеснённых обстоятельствах. «Теснимый» сохраняет образ давления и не определяет точный вид бедствия.
- source_word: וְרָעֵב
  choice: и голодный
  rationale: Прямое и естественное соответствие прилагательному со значением голода без неоправданного усиления до «изголодавшийся».
- source_word: וְהָיָה כִּי יִרְעַב
  choice: и когда проголодается
  rationale: Еврейская конструкция вводит последующее обстоятельство. Русское «когда проголодается» естественно передаёт временное значение и наступление состояния.
- source_word: וְהִתְקַצַּף
  choice: придёт в ярость
  rationale: Порода хитпаэль здесь выражает вхождение в состояние сильного гнева; выбранная формулировка передаёт и интенсивность, и начальный оттенок.
- source_word: וְקִלֵּל
  choice: и проклянёт
  rationale: Пиэль глагола קלל в данном контексте означает именно проклятие, а не просто неодобрение или оскорбление.
- source_word: בְּמַלְכּוֹ
  choice: своего царя
  rationale: Предлог отмечает объект проклятия. Возвратное притяжательное местоимение естественно по-русски соотносит царя с действующим лицом.
- source_word: וּבֵאלֹהָיו
  choice: и своего Бога
  rationale: Несмотря на морфологическую форму אֱלֹהִים, контекст и суффикс допускают и здесь наиболее вероятно предполагают единственное число. Перевод не отождествляет Бога прямо с Господом и не определяет религиозную принадлежность человека.
- source_word: וּפָנָה לְמָעְלָה
  choice: а затем обратится вверх
  rationale: Сочетание буквально выражает поворот или обращение вверх. Глагол «обратится» сохраняет неопределённость между телесным поворотом и направлением взгляда; «затем» естественно связывает заключительное действие с цепью предшествующих событий.
theological_decisions:
- issue: Представительное мужское единственное число в сцене суда
  choice: 'Сохранить мужское единственное число: «он»'
  alternative: Передать неопределённо-лично или множественным числом
  rationale: Еврейский текст последовательно употребляет формы мужского рода единственного числа. Это может быть представительный образ человека и не означает, что речь идёт исключительно о мужчинах.
- issue: Кого обозначает «его Бог»
  choice: Перевести в единственном числе как «своего Бога», не уточняя личность Бога и положение человека
  alternative: «своих богов» или прямое отождествление с Господом
  rationale: Текст не употребляет здесь личного имени Бога и не разъясняет, является ли человек отступником, язычником или членом народа завета. Перевод сохраняет эту богословскую напряжённость.
- issue: Направление последнего действия
  choice: Сохранить буквальное «обратится вверх»
  alternative: Истолковать как молитвенное обращение к Богу или только как движение взгляда
  rationale: Само выражение описывает направление, но не объясняет намерение. Контекст проклятия не позволяет безоговорочно понимать действие как молитву, а лексика не требует добавлять слово «лицо» или «взгляд».
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксический параллелизм оригинала сохранён без архаизмов. Мужское единственное число передаёт грамматику еврейского текста и имеет представительный характер.
