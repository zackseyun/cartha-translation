  text: וְ/כִֽי יֹאמְר֣וּ אֲלֵי/כֶ֗ם דִּרְשׁ֤וּ אֶל הָ/אֹבוֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים הַֽ/מְצַפְצְפִ֖ים וְ/הַ/מַּהְגִּ֑ים הֲ/לוֹא עַם֙ אֶל אֱלֹהָ֣י/ו יִדְרֹ֔שׁ בְּעַ֥ד הַ/חַיִּ֖ים אֶל הַ/מֵּתִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/019.yaml
  text: And when they say to you[b][a], “Consult the mediums and the spiritists who chirp and mutter,” should not a people consult its God? Should they consult the dead on behalf of the living?
translation:
  language: ru
  text: 'И когда вам скажут: «Обратитесь к медиумам[a] и к прорицателям, которые пищат и бормочут[b]», — разве не должен народ обращаться к своему Богу? Разве ради живых обращаются к мёртвым?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать также «духов умерших» или «вызывателей духов». Здесь оно, вероятно, относится к посредникам, обращающимся к умершим.
    reason: lexical_alternative
  - marker: b
    text: 'Также: «щебечут и бормочут». Еврейские слова передают странные птичьи и приглушённые звуки, связывавшиеся с обращением к духам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יֹאמְרוּ אֲלֵיכֶם
  choice: И когда вам скажут
  rationale: Передаёт ожидаемую или возможную ситуацию и сохраняет неопределённое множественное число говорящих без лишнего уточнения.
- source_word: דִּרְשׁוּ
  choice: Обратитесь к
  rationale: В контексте речь идёт о поиске совета или сверхъестественного указания; оборот естественен по-русски и допускает повтор того же смыслового глагола далее.
- source_word: הָאֹבוֹת
  choice: вызывающим духов
  rationale: Термин может обозначать духов умерших либо связанных с ними некромантических посредников. В данном перечислении наиболее естественно обозначить практиков, сохранив альтернативу в сноске.
- source_word: הַיִּדְּעֹנִים
  choice: знахарям
  rationale: Обозначает оккультных практиков, притязающих на тайное знание; слово понятно современному читателю и не вызывает сказочно-фэнтезийных ассоциаций слова «волшебники».
- source_word: הַמְצַפְצְפִים וְהַמַּהְגִּים
  choice: которые пищат и бормочут
  rationale: Сохраняет контраст высокого, птичьеподобного звука и низкой невнятной речи, характерный для еврейских причастий.
- source_word: הֲלוֹא עַם אֶל אֱלֹהָיו יִדְרֹשׁ
  choice: разве не должен народ обращаться к своему Богу?
  rationale: Передаёт риторический вопрос, коллективное единственное число «народ» и повтор корня דרש.
- source_word: בְּעַד הַחַיִּים אֶל הַמֵּתִים
  choice: Разве ради живых обращаются к мёртвым?
  rationale: Восполняет эллиптический глагол из предыдущей фразы и сохраняет резкое противопоставление живых и мёртвых; בְּעַד передано как «ради».
theological_decisions:
- issue: Противопоставление обращения к Богу и обращения к мёртвым
  choice: 'Сохранён риторический упрёк: народу следует искать руководства у своего Бога, а не у мёртвых.'
  alternative: Понимать заключительную фразу только как насмешку над нелепостью некромантии либо как исчерпывающее учение о состоянии мёртвых.
  rationale: Еврейский текст прямо противопоставляет источники руководства, но не развивает здесь антропологию или подробное учение о состоянии умерших.
- issue: Референт הָאֹבוֹת
  choice: В основном тексте обозначены некромантические практики — «вызывающие духов», а лексическая неоднозначность отмечена в сноске.
  alternative: Перевести непосредственно как «духи умерших» или более технически как «медиумы».
  rationale: Форма допускает связь как с вызываемыми духами, так и с их посредниками; синтаксическое соседство со знахарями благоприятствует обозначению практиков, однако неоднозначность не следует скрывать.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Обратиться к» обеспечивает ясность и лексическую связность; звукоподражательные «пищат и бормочут» намеренно сохраняют резкость и необычность оригинала.
