  text: וְ/חָלַ֤ף בִּֽ/יהוּדָה֙ שָׁטַ֣ף וְ/עָבַ֔ר עַד צַוָּ֖אר יַגִּ֑יעַ וְ/הָיָה֙ מֻטּ֣וֹת כְּנָפָ֔י/ו מְלֹ֥א רֹֽחַב אַרְצְ/ךָ֖ עִמָּ֥נוּ אֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/008.yaml
  text: It will sweep on into Judah; it will overflow and pass through; it will reach up to the neck. And the spread of its wings will fill the breadth of your land[a], O Immanuel.
translation:
  language: ru
  text: Он войдёт в Иудею, разольётся и пройдёт по ней; поднимется до самой шеи. И простёртые крылья его покроют всю ширь твоей земли, Иммануил[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Иммануил означает «С нами Бог».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָלַף בִּיהוּדָה
  choice: Он войдёт в Иудею
  rationale: В контексте разлива реки глагол обозначает дальнейшее движение губительной силы, а предлог ב при глаголе движения допускает направительное понимание. «Войдёт» естественно передаёт вторжение в Иудею, не дублируя последующее «пройдёт».
- source_word: שָׁטַף וְעָבַר
  choice: разольётся и пройдёт по ней
  rationale: «Разольётся» сохраняет образ вышедшей из берегов реки, а «пройдёт по ней» передаёт движение через землю Иудеи; местоимение добавлено для естественности русского синтаксиса.
- source_word: עַד צַוָּאר יַגִּיעַ
  choice: поднимется до самой шеи
  rationale: Фраза изображает почти полное затопление и крайнюю опасность, но не окончательное поглощение. Частица «самой» естественно усиливает предельность образа.
- source_word: מֻטּוֹת כְּנָפָיו
  choice: простёртые крылья его
  rationale: Форма מֻטּוֹת выражает протяжённость или расправленность. «Простёртые крылья» сохраняют резкий переход от образа потока к образу крыльев, не объясняя его однозначно.
- source_word: מְלֹא רֹחַב אַרְצְךָ
  choice: покроют всю ширь твоей земли
  rationale: Буквально сочетание говорит о наполнении всей ширины земли. Русское «покроют всю ширь» естественно сочетается с крыльями и сохраняет представление о полном охвате территории.
- source_word: עִמָּנוּ אֵל
  choice: Иммануил
  rationale: Выражение передано как имя и прямое обращение, связывающее стих с Ис 7:14. Значение имени вынесено в сноску.
theological_decisions:
- issue: Понимать ли עִמָּנוּ אֵל как имя-обращение или как самостоятельное утверждение
  choice: Имя-обращение «Иммануил»
  alternative: «С нами Бог» или «Бог с нами»
  rationale: После введения имени в Ис 7:14 здесь естественно слышится обращение к Иммануилу, чья земля названа «твоей». При этом возможное смысловое эхо фразы «с нами Бог» сохранено посредством сноски.
- issue: К кому относится суффикс в כְּנָפָיו («его крылья»)
  choice: Сохранить мужской род и образ крыльев без уточнения референта
  alternative: Истолковать крылья исключительно как разлив ассирийского царя или его войска
  rationale: Еврейский текст продолжает образ вторгающейся силы, но не разъясняет переход от реки к крыльям. Перевод сохраняет эту образную и богословскую напряжённость, не навязывая единственного толкования.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной образностью. Синтаксис сохраняет нарастающее движение стиха и внезапный переход от потока к крыльям. Обращение передано без архаического «о».
