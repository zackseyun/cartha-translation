base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/010.yaml
  text: Make a plan[a], and it will be thwarted; speak a word, and it will not stand, for God is with us.
translation:
  language: ru
  text: Стройте планы — и они будут сорваны; говорите, что задумали, — и это не осуществится, потому что с нами Бог.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с нами Бог»; эти слова перекликаются с именем Эммануил («с нами Бог») в Ис. 7:14 и 8:8.'
    reason: cross_reference
lexical_decisions:
- source_word: עֻצוּ עֵצָה
  choice: Замышляйте замысел
  rationale: Однокоренная конструкция передаёт выразительный повтор еврейского текста и звучит как вызывающее обращение к противникам, строящим враждебные планы.
- source_word: וְתֻפָר
  choice: и он будет сорван
  rationale: Форма от פרר обозначает нарушение, расстройство или отмену замысла. «Будет сорван» естественно сочетается со словом «замысел» и ясно выражает его неосуществление.
- source_word: דַּבְּרוּ דָבָר
  choice: говорите слово
  rationale: Перевод сохраняет однокоренной риторический повтор и параллелизм с первой частью стиха.
- source_word: וְלֹא יָקוּם
  choice: и оно не устоит
  rationale: קום здесь означает состояться, утвердиться или сохранить силу. «Не устоит» сохраняет образ исходного текста и остаётся понятным по-русски.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой планы и слова противников не осуществятся.
- source_word: עִמָּנוּ אֵל
  choice: с нами Бог
  rationale: Передаёт именную фразу буквально и естественно, сохраняя её богословский вес и словесную связь с именем Эммануил в Ис 7–8.
theological_decisions:
- issue: Связь עִמָּנוּ אֵל с темой Эммануила в Исайи 7–8
  choice: Перевести в основном тексте как «с нами Бог», а связь с именем Эммануил отметить в сноске.
  alternative: «потому что Эммануил»
  rationale: В данном стихе выражение написано как два отдельных слова и непосредственно означает «с нами Бог», хотя явно перекликается с именем עִמָּנוּאֵל в Ис 7:14 и 8:8. Такой перевод не превращает фразу в имя собственное, но сохраняет межтекстовую связь.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и однокоренных повторов еврейского текста. Тире обозначают границы параллельных частей, не усложняя синтаксис.
