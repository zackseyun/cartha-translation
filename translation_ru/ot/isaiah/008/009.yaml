base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/009.yaml
  text: Be shattered[a], O peoples, and be broken; listen, all distant parts of the earth. Strap yourselves on for battle, and be broken; strap yourselves on for battle[b], and be broken.
translation:
  language: ru
  text: Сокрушитесь[a], народы, и будьте разбиты! Внимайте, все дальние края земли! Опояшьтесь — и будьте разбиты; опояшьтесь[b] — и будьте разбиты!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальное еврейское повеление трудно для истолкования. Возможны также переводы: «Поднимите боевой клич, народы» или «Объединяйтесь, народы».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «приготовьтесь»; еврейское слово буквально означает «опояшьтесь» и, вероятно, говорит о приготовлении к сражению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעוּ
  choice: Сокрушитесь
  rationale: Начальная форма и её значение спорны. В контексте насмешливого обращения к враждебным народам и повторяющегося וָחֹתּוּ выбран призыв, возвещающий их крушение; неоднозначность сохранена в сноске.
- source_word: עַמִּים
  choice: народы
  rationale: Передаёт множественное число и прямое обращение к нескольким народам, сохраняя поэтический характер строки.
- source_word: וָחֹתּוּ
  choice: и будьте разбиты
  rationale: Глагол חתת может обозначать сокрушение, поражение или смятение. Формулировка передаёт неизбежный крах и сохраняется без вариаций во всех трёх повторениях.
- source_word: וְהַאֲזִינוּ
  choice: внимайте
  rationale: Передаёт усиленный призыв слушать внимательно; слово современно, понятно и соответствует возвышенному поэтическому регистру.
- source_word: כֹּל מֶרְחַקֵּי אָרֶץ
  choice: все дальние края земли
  rationale: Естественно передаёт обращение ко всем отдалённым областям земли и сохраняет широкий географический охват.
- source_word: הִתְאַזְּרוּ
  choice: опояшьтесь
  rationale: Буквально передаёт возвратную форму от אזר — приготовиться, опоясавшись, вероятно к сражению. Военный смысл пояснён в сноске, а образ исходного текста сохранён.
theological_decisions:
- issue: Толкование начального повеления רֹעוּ
  choice: 'Насмешливый пророческий призыв, возвещающий крушение народов: «Сокрушитесь»'
  alternative: «Поднимите боевой клич» или «объединяйтесь»
  rationale: Повторяющееся возвещение поражения в этом стихе поддерживает значение крушения, однако трудность еврейской формы не скрыта, и основные альтернативы указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным пророческим звучанием. Краткие повеления и тройной повтор «будьте разбиты» сохраняют риторику насмешливого вызова; архаизирующая тяжеловесность избегается, а образ «опояшьтесь» сохранён и пояснён.
