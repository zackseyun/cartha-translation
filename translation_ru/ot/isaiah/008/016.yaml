  yaml_path: translation/ot/isaiah/008/016.yaml
  text: Bind up the testimony[b][a]; seal the instruction among my disciples.
translation:
  language: ru
  text: Сверни свидетельство, запечатай наставление[a] среди моих учеников[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «учение» или «закон». Еврейское слово תורה может обозначать наставление в широком смысле, а не только свод законов.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «среди моих наставляемых» или «моих обучаемых». Речь идёт о тех, кто получает наставление от говорящего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צ֖וֹר
  choice: Свяжи
  rationale: Повелительная форма передаёт конкретный образ связывания или сворачивания ради сохранности, не заменяя его одним лишь отвлечённым значением «сохрани».
- source_word: תְּעוּדָה
  choice: свидетельство
  rationale: Слово обозначает засвидетельствование или свидетельство; в контексте естественно относится к данному пророческому слову.
- source_word: חֲת֥וֹם
  choice: запечатай
  rationale: Сохраняет буквальный образ наложения печати на документ и оттенок его удостоверения и сохранения.
- source_word: תּוֹרָ֖ה
  choice: наставление
  rationale: Здесь תורה может обозначать пророческое наставление в широком смысле, а не только законодательный свод; «наставление» естественно передаёт эту широту.
- source_word: בְּ/לִמֻּדָֽ/י
  choice: среди моих учеников
  rationale: Существительное называет тех, кто был научен говорящим; предлог ב передан как «среди», то есть в кругу учеников, которым вверяется наставление.
theological_decisions:
- issue: Значение תּוֹרָה в пророческом контексте
  choice: наставление
  alternative: закон; учение
  rationale: Выбор не сужает значение до Моисеева законодательства и допускает вероятную связь с пророческим наставлением Исайи.
- issue: Кто говорит в выражении «моих учеников»
  choice: Строчная буква в «моих»
  alternative: Моих
  rationale: Строчная буква не предрешает, относится ли первое лицо непосредственно к пророку или к Богу, и тем самым сохраняет возможную неоднозначность контекста.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Сохранены документальные образы связывания и запечатывания; местоимение «моих» не капитализировано, чтобы не устранять неоднозначность личности говорящего.
