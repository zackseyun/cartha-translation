base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/005.yaml
  text: You say—but they are only words of the lips—‘There is counsel and strength for war.’ Now in whom have you trusted, that you have rebelled against me?
translation:
  language: ru
  text: 'Ты говоришь[a]: «У меня есть план и сила для войны», — но это лишь слова. На кого же ты положился, что восстал против меня?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском масоретском тексте буквально: «Я сказал». По контексту, параллельному месту в 4 Царств 18:20 и древним переводам многие понимают здесь: «Ты говоришь».'
    reason: Отмечает спорное лицо глагола, сохраняя доступным буквальное чтение WLC без перегрузки основного текста.
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Ты говоришь
  rationale: По контексту и параллели в 4 Царств 18:20 передаёт обращённое к Езекии обвинение; масоретская форма буквально означает «я сказал», однако синтаксис допускает трудное чтение, а древние версии и контекст поддерживают второе лицо.
- source_word: אַךְ דְּבַר שְׂפָתַיִם
  choice: но это лишь слова
  rationale: Буквально «только слово губ»; современная русская формулировка сохраняет пренебрежительный смысл пустых, ничем не подкреплённых заявлений.
- source_word: עֵצָה וּגְבוּרָה לַמִּלְחָמָה
  choice: У меня есть замысел и сила для войны
  rationale: עֵצָה — продуманный план или стратегический замысел, גְבוּרָה — сила/мощь; добавленное «у меня есть» естественно раскрывает смысл хвастливого заявления без изменения его содержания.
- source_word: בָטַחְתָּ
  choice: положился
  rationale: Передаёт доверие как практическую опору, соответствующую военно-политическому контексту.
- source_word: מָרַדְתָּ
  choice: восстал
  rationale: Обозначает мятеж или отказ от подчинения сюзерену; «восстал против» естественно и точно передаёт политический смысл.
theological_decisions:
- issue: Говорящий приписывает Езекии заявление о военной готовности
  choice: Оформить «У меня есть замысел и сила для войны» как цитируемое заявление
  alternative: 'Понять выражение как слова самого Рабсака: «лишь пустые слова — совет и сила для войны»'
  rationale: Контекст вопроса о том, на кого положился Езекия, и параллель 4 Царств 18:20 лучше поддерживают обвинительное цитирование притязания Езекии; при этом формулировка не добавляет богословской оценки сверх текста.
- issue: Разночтение лица в אָמַרְתִּי
  choice: Перевести «Ты говоришь»
  alternative: 'Буквально по огласовке WLC: «Я сказал»'
  rationale: Хотя WLC имеет форму первого лица, дальнейшая прямая речь, контекст и параллельное место поддерживают значение второго лица; это также отражает вероятную текстовую/передаточную трудность, засвидетельствованную традицией перевода.
translation_notes:
  register: Современный литературный русский, с прямой и властной интонацией царского посланника. Сохранены риторический вопрос, военно-политическая лексика и презрительная характеристика заявлений как пустых слов; архаизмы устранены.
