base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/002.yaml
  text: Then the king of Assyria sent the Rabshakeh from Lachish to Jerusalem, to King Hezekiah, with a heavy force. And he stood by the conduit of the upper pool, on the highway to the launderer’s field.
translation:
  language: ru
  text: И послал царь Ассирии из Лахиша в Иерусалим, к царю Езекии, рабсака[a] с большим войском. Он стал у водовода верхнего пруда, на дороге к полю прачечника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рабсак — ассирийский придворный титул, а не личное имя.
    reason: Форма «рабсак» может быть ошибочно воспринята современным читателем как имя; примечание сохраняет титульный характер исходного слова, не добавляя спорной специализации титула.
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: рабсак
  rationale: Передаёт ассирийский придворно-военный титул традиционной русской формой, не превращая его без достаточных оснований в личное имя и не сводя к одной предположительной должности.
- source_word: בְּחֵיל כָּבֵד
  choice: с большим войском
  rationale: חַיִל в данном военном контексте означает вооружённую силу или войско, а כָּבֵד указывает на его значительность; естественное русское выражение передаёт смысл без буквального «тяжёлое войско».
- source_word: בִּתְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: у водовода Верхнего пруда
  rationale: תְּעָלָה обозначает канал или водовод; сочетание сохраняет топографическую конкретность оригинала.
- source_word: בִּמְסִלַּת שְׂדֵה כוֹבֵס
  choice: на дороге к Полю прачечника
  rationale: מְסִלָּה здесь — проложенная дорога; כוֹבֵס — тот, кто стирает или отбеливает ткань. «Прачечник» понятно современному читателю и не вводит архаичное «сукновал».
