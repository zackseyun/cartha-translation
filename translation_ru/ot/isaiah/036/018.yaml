base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/018.yaml
  text: Do not let Hezekiah mislead you[a], saying, ‘Yahweh will deliver us.’ Have any of the gods of the nations, each one[b], delivered his land from the hand of the king of Assyria?
translation:
  language: ru
  text: 'Не дайте Езекии ввести вас в заблуждение[a] словами: «Яхве избавит нас». Разве хоть один из богов народов избавил свою землю из рук царя Ассирии?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «склонить вас»; еврейский глагол может выражать побуждение, обольщение или введение в заблуждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן יַסִּית אֶתְכֶם
  choice: Не дайте … ввести вас в заблуждение
  rationale: פֶּן вводит предостережение, а Hiphil יַסִּית может означать побуждение, склонение или введение в заблуждение. Эта формулировка естественно передаёт отрицательное предостережение и обвинительный смысл речи Рабсака, не усиливая его до однозначного «обмануть».
- source_word: חִזְקִיָּהוּ
  choice: Езекия
  rationale: Употреблена закрепившаяся в русской библейской традиции форма имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: יַצִּילֵנוּ
  choice: избавит нас
  rationale: Глагол נצל в породе Hiphil обозначает избавление или спасение из опасности; «избавит» соответствует военному контексту.
- source_word: אֱלֹהֵי הַגּוֹיִם אִישׁ אֶת אַרְצוֹ
  choice: хоть один из богов народов … свою землю
  rationale: 'Перестройка в единственное число естественно выражает распределительное אִישׁ: вопрос касается любого отдельного бога и соответствующей ему земли.'
- source_word: מִיַּד מֶלֶךְ אַשּׁוּר
  choice: из рук ассирийского царя
  rationale: Сохранён образ «руки» как власти и контроля; русское множественное «из рук» звучит естественно. Конструкция «ассирийского царя» точно передаёт царя Ассирии.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное Божье имя и не подменяет его титулом.
- issue: Статус богов народов в риторическом вопросе Рабсака
  choice: Сохранено обозначение «боги народов» без поясняющей оценки
  alternative: идолы народов; так называемые боги народов
  rationale: Говорящий сопоставляет Яхве с богами других народов. Перевод сохраняет его риторику и не добавляет отсутствующей в данном предложении богословской квалификации.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Риторический вопрос и военный образ «из рук» сохранены; распределительная еврейская конструкция передана естественным русским оборотом «хоть один из».
