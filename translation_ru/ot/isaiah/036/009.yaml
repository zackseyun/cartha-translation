translation_notes:
  register: Современный литературный русский язык с dignified, но понятной военной лексикой. Риторическая насмешка передана частицами «же» и «хотя бы». Слово «господина» оставлено со строчной буквы, поскольку речь идёт о царе Ассирии, которого говорящий называет своим владыкой.
