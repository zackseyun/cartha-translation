  yaml_path: translation/ot/isaiah/036/009.yaml
  text: How then can you repulse a single captain of the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: ru
  text: Как же ты сможешь отразить натиск хотя бы одного из низших военачальников[a] моего господина[b], если надеешься на Египет — на колесницы и всадников?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наместников» либо «правителей»; еврейское слово обозначает подчинённого правителя или должностное лицо.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «обратишь назад лицо». Это выражение означает оказать сопротивление или заставить противника отступить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ
  choice: Как же
  rationale: Передаёт и вопросительное значение, и связь с предшествующим доводом; частица «же» подчёркивает риторический характер вопроса.
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: сможешь отбить
  rationale: Буквально выражение означает «обратить назад лицо», но здесь это военная идиома со значением «отразить, заставить отступить». «Отбить» естественно передаёт смысл сопротивления наступающему противнику.
- source_word: פַחַת
  choice: начальника
  rationale: Термин обозначает подчинённого правителя или должностное лицо, нередко наместника; в данной военной насмешке нейтральное «начальник» сохраняет должностной и военный оттенки, не сужая значение до конкретного звания.
- source_word: אַחַד
  choice: хотя бы одного
  rationale: В контексте насмешки подчёркивается неспособность отразить даже одного низшего ассирийского начальника.
- source_word: עַבְדֵי אֲדֹנִי הַקְטַנִּים
  choice: из самых малых слуг господина моего
  rationale: «Малые» указывает на низкое положение или ранг, а не на физический размер. Словопорядок сохраняет уничижительное сравнение, лежащее в основе насмешки.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: если надеешься на Египет
  rationale: Передаёт упование Иудеи на египетскую военную помощь. Дательный местоименный элемент לְךָ идиоматичен и не требует отдельного выражения по-русски.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: на его колесницы и всадников
  rationale: Названы виды военной силы, которую ожидали получить от Египта. Местоимение «его» ясно связывает их с Египтом и естественно звучит по-русски.
