  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: рабсак
  rationale: Традиционная русская передача ассирийского придворного титула; контекст не требует превращать его в личное имя или давать предположительную расшифровку должности.
- source_word: יְהוּדִית
  choice: по-иудейски
  rationale: Наречная передача обозначает язык жителей Иудеи; в данном контексте имеется в виду местная иудейская речь, противопоставленная арамейскому.
- source_word: בְקוֹל גָּדוֹל
  choice: громко
  rationale: Естественно передаёт идиому «великим/громким голосом», сохраняя акцент на слышимости публичного возгласа.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: великий царь
  rationale: Буквальная и стилистически уместная передача царского титула-притязания.
