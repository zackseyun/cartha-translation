base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/011.yaml
  text: Then Eliakim[a], Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it[b]. And do not speak to us in Judean in the hearing of the people who are on the wall.”
translation:
  language: ru
  text: 'Тогда Елиаким, Шевна и Иоах сказали равсаку[a]: «Пожалуйста, говори своим слугам по-арамейски, ведь мы понимаем. Не говори с нами по-иудейски в пределах слышимости народа, который находится на стене».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Равсак — по-видимому, титул ассирийского сановника, а не личное имя.
    reason: cultural_note
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: рабсаку
  rationale: Передача ассирийского должностного титула традиционной транслитерацией позволяет не уточнять предположительное значение должности сверх того, что надёжно следует из источника.
- source_word: דַּבֶּר נָא
  choice: Прошу, говори
  rationale: Императив с частицей נָא выражает вежливую, настойчивую просьбу; эта формулировка естественна в современном русском языке.
- source_word: עֲבָדֶיךָ
  choice: с твоими слугами
  rationale: Дипломатическое самоназвание выражает почтительность; «слуги» сохраняет этот оттенок, не подразумевая буквального рабства.
- source_word: אֲרָמִית
  choice: по-арамейски
  rationale: Естественное русское обозначение языка в конструкции с глаголом речи.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: мы понимаем
  rationale: В контексте владения языком שׁמע означает не просто физически слышать, а понимать сказанное.
- source_word: יְהוּדִית
  choice: по-иудейски
  rationale: Термин буквально обозначает язык Иудеи или иудеев; такой перевод сохраняет этнолингвистическую конкретность и не подменяет её позднейшим техническим названием «древнееврейский».
- source_word: בְּאָזְנֵי הָעָם
  choice: чтобы не слышал народ
  rationale: Русская целевая конструкция естественно передаёт идиому «в ушах народа» и смысл просьбы не говорить при людях так, чтобы они услышали.
- source_word: הָעָם אֲשֶׁר עַל הַחוֹמָה
  choice: народ, который на стене
  rationale: Сохраняется общее значение הָעָם без неоправданного сужения до воинов или стражников.
