id: ISA.36.15
reference: Isaiah 36:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה לֹ֤א תִנָּתֵן֙ הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/015.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us[b]; this city will not be given into the hand of the king of Assyria.’
translation:
  language: ru
  text: 'И не позволяйте Езекии убеждать вас положиться на Яхве, когда он говорит: «Яхве непременно избавит нас[a]; этот город не будет отдан в руки царя Ассирии[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «избавляя, избавит нас» — древнееврейская усилительная конструкция со значением «непременно избавит нас».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будет предан во власть царя Ассирии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם חִזְקִיָּהוּ
  choice: И не позволяйте Езекии убеждать вас положиться
  rationale: Отрицательная конструкция передаёт запрет слушателям, а каузативная форма בטח — побуждение к доверию. «Убеждать вас положиться» естественно по-русски и не вносит значения обмана, которого нет в самом глаголе.
- source_word: אֶל יְהוָה
  choice: на Яхве
  rationale: Сочетание «положиться на» естественно передаёт направленность доверия; личное имя יְהוָה транслитерировано как «Яхве».
- source_word: לֵאמֹר
  choice: когда он говорит
  rationale: Инфинитив вводит содержание речи Езекии. Такое выражение яснее по-русски, чем буквальное причастное «говоря», при сохранении той же связи.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: непременно избавит нас
  rationale: Инфинитив абсолютный при личной форме того же глагола выражает усиление; «непременно» передаёт уверенное утверждение. «Избавит» уместно в контексте военной угрозы.
- source_word: לֹא תִנָּתֵן הָעִיר הַזֹּאת
  choice: этот город не будет отдан
  rationale: Сохраняется пассивная форма נִתַּן и прямое указание на город.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: в руки царя Ассирии
  rationale: Сохраняется понятный в русском языке образ передачи в чьи-либо руки, то есть под власть.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблено тетраграмматон; форма «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Степень усиления в הַצֵּל יַצִּילֵנוּ
  choice: непременно избавит нас
  alternative: точно спасёт нас; обязательно избавит нас
  rationale: Усилительная древнееврейская конструкция выражает категорическую уверенность, но сама по себе не определяет богословскую оценку процитированных слов.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксис сделан естественным для широкого читателя; военный образ «в руки» сохранён. Маркеры сносок размещены непосредственно при тех выражениях, которые они поясняют.
