base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/021.yaml
  text: But they kept silent and did not answer him a word[a], for the king’s command was, saying, “Do not answer him.”
translation:
  language: ru
  text: 'Но они молчали и не отвечали ему ни слова[a], потому что царь приказал: «Не отвечайте ему».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не отвечали ему словом»; это выражение означает, что они вовсе ничего ему не ответили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִישׁוּ
  choice: они молчали
  rationale: Глагол חרשׁ здесь передаёт намеренное молчание; простой русский глагол «молчали» естественно выражает сознательное воздержание от ответа в данном контексте.
- source_word: וְלֹא עָנוּ אֹתוֹ דָּבָר
  choice: и не отвечали ему ни слова
  rationale: Сохраняет еврейскую усилительную конструкцию с דָּבָר и естественно по-русски означает полное отсутствие ответа.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину их молчания; «потому что» ясно и естественно передаёт причинную связь.
- source_word: מִצְוַת הַמֶּלֶךְ הִיא לֵאמֹר
  choice: царь приказал
  rationale: Так естественно по-русски передаётся формула, вводящая содержание царского повеления, без тяжеловесного буквального оборота «повеление царя было — сказать».
- source_word: לֹא תַעֲנֻהוּ
  choice: Не отвечайте ему
  rationale: Форма обращена к группе мужчин и в контексте выражает прямой запрет; русский повелительный оборот точно передаёт эту функцию.
