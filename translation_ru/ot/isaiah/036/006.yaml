base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/006.yaml
  text: Look[a], you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, goes into his hand and pierces it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: ru
  text: Вот, ты надеешься на эту опору — надломленную трость, на Египет. Если человек[a] обопрётся на неё, она вонзится ему в ладонь и пронзит её. Таков фараон, царь Египта, для всех, кто на него надеется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «мужчина»; здесь единственное число мужского рода употреблено в обобщающем смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Современное русское слово, естественно передающее призыв обратить внимание без архаического оттенка.
- source_word: בָטַחְתָּ
  choice: ты надеешься
  rationale: Перфект описывает существующую установку адресата; настоящее время естественно передаёт продолжающееся политическое упование.
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: эту надломленную трость
  rationale: Образ трости как ненадёжной опоры ясен из следующего глагола «обопрётся»; «надломленная» передаёт רָצוּץ и сохраняет цельность метафоры.
- source_word: עַל מִצְרַיִם
  choice: на Египет
  rationale: Египет назван как поясняющее приложение к образу трости; тире естественно выражает эту связь по-русски.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: Если человек обопрётся на неё
  rationale: Условная формулировка естественно раскрывает подразумеваемую ситуацию, а «человек» передаёт родовое употребление אִישׁ.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: она вонзится ему в ладонь и пронзит её
  rationale: Передан конкретный и резкий образ проникновения трости в ладонь; будущее время естественно согласуется с русским условным предложением.
- source_word: כֵּן
  choice: Таков
  rationale: Кратко и ясно вводит сопоставление фараона с надломленной тростью.
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: для всех, кто на него надеется
  rationale: Сохраняет повтор корня בטח через одинаковый русский глагол и выражает отношение фараона ко всем полагающимся на него.
