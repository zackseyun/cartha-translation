base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/004.yaml
  text: 'Then the Rabshakeh said to them[a], “Please say to Hezekiah, ‘Thus says the great king[b], the king of Assyria: What is this confidence that you have trusted in?’”'
translation:
  language: ru
  text: 'Тогда рабсак[a] сказал им: «Передайте, пожалуйста, Езекии: „Так говорит великий царь, царь Ассирии: что это за уверенность, на которую ты полагаешься?[b]“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Рабсак» — вероятно, ассирийский должностной титул. Его связывают со значением «главный виночерпий», но он мог обозначать и другого высокопоставленного придворного или военного сановника.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «Что это за уверенность, на которую ты уповаешь?» В еврейском тексте существительное и глагол образованы от одного корня, что усиливает насмешливый вопрос.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: рабсак
  rationale: Сохранён традиционный исторический титул ассирийского сановника, поскольку его точная должностная функция остаётся предметом споров.
- source_word: אִמְרוּ נָא
  choice: Передайте, пожалуйста
  rationale: Множественное повелительное наклонение и смягчающая частица נָא переданы естественной современной русской формулой; по смыслу посланникам велено передать слова Езекии.
- source_word: חִזְקִיָּהוּ
  choice: Езекии
  rationale: Использована устоявшаяся русская форма библейского имени в требуемом дательном падеже.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохранена краткая торжественная формула вестника, здесь служащая выражением царской власти.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: великий царь
  rationale: Прямая передача ассирийского царского титула сохраняет его официальный и вызывающе-величавый оттенок.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Повтор слова «царь» сохранён вслед за еврейским приложением и передаёт официальный стиль титулатуры.
- source_word: הַבִּטָּחוֹן הַזֶּה אֲשֶׁר בָּטָחְתָּ
  choice: что это за уверенность, на которую ты полагаешься?
  rationale: Риторический вызов передан естественно по-русски. Существительное и однокоренной глагол в еврейском отмечены в сноске, поскольку буквальное русское повторение звучало бы неестественно.
