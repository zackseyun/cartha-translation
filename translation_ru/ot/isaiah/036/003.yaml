  text: וַ/יֵּצֵ֥א אֵלָ֛י/ו אֶלְיָקִ֥ים בֶּן חִלְקִיָּ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/שֶׁבְנָא֙ הַ/סֹּפֵ֔ר וְ/יוֹאָ֥ח בֶּן אָסָ֖ף הַ/מַּזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/003.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, came out to him, along with Shebna the scribe and Joah son of Asaph[d][c][b], the recorder.
translation:
  language: ru
  text: И вышел к нему Елиаким, сын Хилкии, управлявший дворцом[a], а с ним — писец[b] Шевна и летописец[c] Иоах, сын Асафа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который был над домом»; речь идёт о высоком царском чиновнике, управлявшем дворцом.'
    reason: cultural_note
  - marker: b
    text: 'Или: «секретарь».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «хранитель записей»; это была придворная должность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: И вышел
  rationale: Глагол יצא означает «выйти»; русское «вышел к нему» естественно передаёт движение к ранее названному ассирийскому представителю, не навязывая различие между английскими came out и went out.
- source_word: אֵלָיו
  choice: к нему
  rationale: Предлог אֶל с местоименным суффиксом прямо обозначает направление к лицу, упомянутому в предыдущем контексте.
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: Елиаким, сын Хилкии
  rationale: Имена переданы в принятой русской библейской форме, а конструкция родства сохранена буквально и ясно.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: управлявший дворцом
  rationale: Буквально «который над домом»; в данном контексте это титул высокого царского чиновника, ведавшего дворцом и его хозяйством. Функциональная передача понятнее современному читателю.
- source_word: וְשֶׁבְנָא הַסֹּפֵר
  choice: а с ним — писец Шевна
  rationale: Оборот «а с ним» естественно согласует последующих участников с единственным числом еврейского сказуемого при первом имени. סֹפֵר — писец либо царский секретарь; основной текст сохраняет прямой лексический эквивалент.
- source_word: וְיוֹאָח בֶּן אָסָף הַמַּזְכִּיר
  choice: и летописец Иоах, сын Асафа
  rationale: מַזְכִּיר обозначает придворного чиновника, ведавшего записями и докладами. «Летописец» кратко и традиционно передаёт эту должность, не используя архаичное «дееписатель».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис «а с ним» сохраняет еврейское единственное число сказуемого при Елиакиме и естественно присоединяет двух остальных чиновников. Архаичное название должности «дееписатель» не используется.
