id: ISA.36.19
reference: Isaiah 36:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַיֵּ֞ה אֱלֹהֵ֤י חֲמָת֙ וְ/אַרְפָּ֔ד אַיֵּ֖ה אֱלֹהֵ֣י סְפַרְוָ֑יִם וְ/כִֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/019.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim? And have they delivered Samaria from my hand?[a]
translation:
  language: ru
  text: Где боги Хамата и Арпада? Где боги Сефарваима? Разве они избавили Самарию от моей руки?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасли»; также возможно: «вырвали».'
    reason: Лексические варианты передачи הִצִּילוּ.
lexical_decisions:
- source_word: אַיֵּה
  choice: Где
  rationale: Вопросительное наречие места; русская форма не меняется при множественном подлежащем «боги».
- source_word: אֱלֹהֵי
  choice: боги
  rationale: Сопряжённая форма множественного числа; в русском определённость естественно передаётся контекстом без артикля.
- source_word: חֲמָת וְאַרְפָּד
  choice: Хамата и Арпада
  rationale: Географические названия переданы в принятых русских библейских формах и поставлены в родительном падеже после слова «боги».
- source_word: סְפַרְוָיִם
  choice: Сефарваима
  rationale: Использована традиционная и узнаваемая русская форма топонима в родительном падеже.
- source_word: וְכִי
  choice: Разве
  rationale: Частица естественно передаёт насмешливый риторический вопрос и его ожидаемый отрицательный ответ; отдельное «и» по-русски не требуется.
- source_word: הִצִּילוּ
  choice: избавили
  rationale: Hiphil от נצל означает «избавить, спасти, вырвать из опасности»; «избавили» уместно в военно-политическом контексте и сохраняет библейскую образность.
- source_word: אֶת שֹׁמְרוֹן
  choice: Самарию
  rationale: Показатель прямого дополнения не переводится; название города оформлено как прямое дополнение.
- source_word: מִיָּדִי
  choice: от моей руки
  rationale: Сохранён буквальный образ руки как власти и силы, понятный в контексте хвастливой речи.
theological_decisions:
- issue: К кому относится выражение «моя рука» в речи рабсака
  choice: Сохранено хвастливое первое лицо без поясняющей интерпретации
  alternative: Передать как «от руки ассирийского царя» или динамически как «из-под моей власти»
  rationale: Еврейский текст вкладывает эти слова в уста говорящего и намеренно сохраняет первое лицо; перевод не устраняет возможную риторическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранены риторическая насмешка, параллелизм вопросов и образ «руки» как силы и власти.
