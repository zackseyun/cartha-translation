  yaml_path: translation/ot/isaiah/036/008.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: ru
  text: 'Итак, заключи же пари[a] с моим господином, царём Ассирии: я дам тебе две тысячи коней, если ты сумеешь выставить для них всадников.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заключи соглашение», «дай обязательство». Еврейский глагол может обозначать вступление в соглашение или пари; здесь насмешливый контекст указывает на пари или вызов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב נָא
  choice: побейся об заклад
  rationale: Порода хитпаэль с אֶת в данном насмешливом дипломатическом контексте выражает предложение пари или вызов. Русское «побейся об заклад» сохраняет колкость реплики и риторически вежливую силу частицы נָא, не требуя неестественного отдельного «пожалуйста».
- source_word: אֶת אֲדֹנִי הַמֶּלֶךְ אַשּׁוּר
  choice: с моим господином, царём Ассирии
  rationale: אֲדֹנִי обозначает человеческого владыку говорящего; «господином» естественно передаёт отношение подчинённости и не превращает титул в божественное именование.
- source_word: וְאֶתְּנָה לְךָ
  choice: я дам тебе
  rationale: Передаёт прямое обещание-предложение; связь с предшествующим вызовом в русском естественно выражена двоеточием.
- source_word: אַלְפַּיִם סוּסִים
  choice: две тысячи коней
  rationale: Прямая передача числительного и существительного; «кони» уместно в военном контексте и современно понятно.
- source_word: אִם תּוּכַל
  choice: если ты сумеешь
  rationale: Условие способности передано с насмешливым оттенком сомнения, присутствующим в контексте.
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: найти для них всадников
  rationale: Буквально конструкция означает дать/предоставить себе всадников на коней. По-русски «найти для них всадников» естественно передаёт неспособность Иудеи выставить нужное число конников, не сводя смысл к физической посадке на коней.
