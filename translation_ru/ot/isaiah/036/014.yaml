base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/014.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you.'
translation:
  language: ru
  text: 'Так говорит царь: «Не позволяйте Езекии вводить вас в заблуждение[a], ибо он не сможет спасти[b] вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не позволяйте Езекии обманывать вас». Еврейский глагол может означать обманывать или вводить в заблуждение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избавить вас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Так говорит царь
  rationale: Сохраняет традиционную формулу провозглашения и её торжественный тон; настоящее время естественно вводит передаваемую прямую речь.
- source_word: אַל יַשִּׁא לָכֶם חִזְקִיָּהוּ
  choice: Пусть Езекия не вводит вас в заблуждение
  rationale: Глагол נשׁא здесь выражает обман или введение в заблуждение. Выбранная формулировка естественна по-русски и сохраняет оттенок уведения от верного суждения.
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание запрета и ясно передаёт причинную связь в современном русском языке.
- source_word: לֹא יוּכַל לְהַצִּיל אֶתְכֶם
  choice: он не сможет спасти вас
  rationale: Передаёт выраженную глаголом יכול невозможность совершить спасение и сохраняет направленность речи на грядущую военную угрозу.
theological_decisions:
- issue: К кому относится выражение «царь»
  choice: Сохранено общее обозначение «царь»
  alternative: «Сеннахирим» или «великий царь»
  rationale: В самом еврейском тексте этого стиха стоит только «царь». Имя или титул определяются контекстом, поэтому их добавление устранило бы исходную недосказанность.
- issue: Значение לְהַצִּיל
  choice: «спасти»
  alternative: «избавить» или «вырвать из опасности»
  rationale: «Спасти» естественно передаёт избавление от военной опасности и не ограничивает смысл каким-либо специальным богословским употреблением.
translation_notes:
  register: Современный литературный русский язык с dignified, но понятной формулой царского провозглашения. Прямая речь оформлена кавычками; синтаксис остаётся кратким и настойчивым, как в исходном обращении.
