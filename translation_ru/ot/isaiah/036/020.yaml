source:
  edition: WLC
  text: מִ֗י בְּ/כָל אֱלֹהֵ֤י הָֽ/אֲרָצוֹת֙ הָ/אֵ֔לֶּה אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּֽי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/020.yaml
  text: Who among all the gods of these lands has delivered their land from my hand, that Yahweh should deliver Jerusalem from my hand?
translation:
  language: ru
  text: Кто из всех богов этих земель избавил свою землю от моей руки, чтобы Яхве избавил Иерусалим от моей руки?»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת הָאֵלֶּה
  choice: Кто из всех богов этих земель
  rationale: Русская конструкция «кто из всех» естественно передаёт вопросительное מִי с בְּכָל и сохраняет насмешливую риторическую силу; «земли» конкретно обозначают покорённые территории.
- source_word: הִצִּילוּ אֶת אַרְצָם
  choice: избавил свою землю
  rationale: Глагол נצל в военном контексте означает избавить или спасти от власти противника. Единственное число по-русски согласуется с распределительным «кто из богов», а возвратное «свою» естественно соотносит землю с предполагаемым богом-защитником.
- source_word: מִיָּדִי
  choice: от моей руки
  rationale: Сохранён прозрачный древнееврейский образ руки как власти и контроля; повтор фразы воспроизводит настойчивость хвастливого вызова.
- source_word: כִּי יַצִּיל
  choice: чтобы ... избавил
  rationale: В этом риторическом вопросе כִּי вводит насмешливое следствие или предполагаемую возможность. Конструкция «чтобы ... избавил» естественна по-русски и не сводит форму к нейтральному предсказанию будущего.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Статус языческих богов в речи ассирийского посланника
  choice: боги
  alternative: так называемые боги
  rationale: Текст передаёт слова хулителя и не вставляет авторского пояснения об онтологическом статусе этих богов; добавление «так называемые» ослабило бы прямоту и напряжение речи.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной библейской образности. Дважды сохранено «от моей руки», чтобы передать параллелизм и самоуверенную угрозу говорящего. Финальная кавычка предполагает, что стих является продолжением прямой речи, начатой ранее.
