lexical_decisions:
- source_word: עַד בֹּאִי
  choice: пока я не приду
  rationale: עַד вводит временной предел, а בֹּאִי — инфинитив בוא с суффиксом первого лица; по-русски сочетание естественно передаётся придаточным времени «пока я не приду».
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: и не переселю вас
  rationale: לקח буквально означает «взять». В контексте увода населения речь идёт о перемещении в другую землю; «переселю» естественно выражает этот смысл, не усиливая его до «уведу в плен» или «угоню».
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: в землю, подобную вашей земле
  rationale: אֶל обозначает направление, а сравнительная כְ сохраняет утверждение лишь о подобии, не о тождестве земель.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: землю зерна и молодого вина
  rationale: דָּגָן обозначает зерно или зерновые культуры вообще. תִּירוֹשׁ часто отличается от общего слова «вино» и может обозначать свежее, молодое вино; это различие сохранено.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: землю хлеба и виноградников
  rationale: לֶחֶם передано буквально как «хлеб», а כְּרָמִים — как «виноградники», с сохранением образа сельскохозяйственного изобилия.
theological_decisions:
- issue: Характер перемещения, выраженного глаголом לקח
  choice: переселю вас
  alternative: возьму вас / уведу вас
  rationale: Сам глагол значит «взять» и не называет прямо ни плен, ни насилие, однако контекст предполагает переселение. Выбор сохраняет контекстуальный смысл без добавления более сильной богословской или политической характеристики.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «землю» сохранён ради ритма и параллелизма оригинала; формула «пока я не приду» естественна в русском контексте ожидания.
