  text: וְ/כִי תֹאמַ֣ר אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵ֛י הַ/מִּזְבֵּ֥חַ הַ/זֶּ֖ה תִּֽשְׁתַּחֲוֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/007.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall bow down before this altar’?”
translation:
  language: ru
  text: 'Если же ты скажешь мне: «Мы уповаем на ГОСПОДА, нашего Бога», — разве не Он тот, чьи высоты[a] и жертвенники устранил Езекия и сказал Иудее и Иерусалиму: «Поклоняйтесь перед этим жертвенником»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: культовые места на возвышенностях.'
    reason: «Высоты» передаёт еврейский культовый термин בָּמוֹת; сноска поясняет его современному читателю, не навязывая оценку этих мест или речи говорящего.
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДА
  rationale: Тетраграмматон передан традиционным русским библейским эквивалентом в прописных буквах, что отличает его от обычного титула и сохраняет узнаваемость текста.
- source_word: בָּטָחְנוּ
  choice: мы уповаем
  rationale: Глагол בטח выражает уверенное доверие и надежду; «уповаем» естественно в возвышенном библейском регистре и точнее простого «верим».
- source_word: בָּמֹתָיו
  choice: его святилища на высотах
  rationale: במות обозначает культовые места на возвышенностях; передача сохраняет культовый и пространственный смысл, не сводя слово просто к рельефу местности.
- source_word: הֵסִיר
  choice: упразднил
  rationale: В данном контексте речь не только о физическом удалении, но и о прекращении действия культовых мест; «упразднил» естественно передаёт этот смысл.
- source_word: תִּשְׁתַּחֲווּ
  choice: поклоняйтесь
  rationale: Форма означает совершать поклонение или падать ниц; в контексте жертвенника «поклоняйтесь» передаёт религиозное действие без излишнего уточнения позы.
theological_decisions:
- issue: Приписывание святилищ на высотах и жертвенников ГОСПОДУ
  choice: Сохранено выражение «его святилища на высотах и жертвенники» как часть речи ассирийского посланника.
  alternative: Уточнить, что это лишь ошибочное представление говорящего, или назвать эти места незаконными.
  rationale: Стих передаёт довод Рабсака, который истолковывает реформу Езекии как оскорбление Бога. Текст не следует исправлять богословским пояснением внутри перевода.
- issue: Исключительность иерусалимского жертвенника
  choice: Передано «перед этим жертвенником» без добавления «только».
  alternative: «Только перед этим жертвенником».
  rationale: Контекст подразумевает централизацию поклонения, но отдельного слова «только» в еврейском тексте нет; вынесение дополнения вперёд уже сохраняет смысловой акцент.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет насмешливый риторический вопрос говорящего; метонимическое обращение к Иудее и Иерусалиму оставлено без разъясняющего расширения.
