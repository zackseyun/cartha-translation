  text: וְ/עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/הַשְׁחִיתָ֑/הּ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה אֶל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/010.yaml
  text: And now[a], was it apart from Yahweh that I came up against this land to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: ru
  text: 'И теперь, разве я выступил против этой земли без Яхве?[a] Яхве сказал мне: «Выступи против этой земли и уничтожь её».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «независимо от Яхве?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: разве без
  rationale: Вопросительная частица הֲ и מִבַּלְעֲדֵי образуют риторический вопрос о действии без участия или дозволения Яхве. «Разве без» естественно звучит по-русски и сохраняет подразумеваемый отрицательный ответ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; это также позволяет точно представить заявление ассирийского посланника, не подтверждая его истинность.
- source_word: עָלִיתִי עַל
  choice: я выступил против
  rationale: Глагол עלה с предлогом עַל в военном контексте обозначает враждебное выступление против страны. «Выступил против» передаёт и движение, и военную направленность без неестественного буквального «поднялся».
- source_word: הָאָרֶץ הַזֹּאת
  choice: этой земли
  rationale: אֶרֶץ здесь обозначает территорию Иудеи; «земля» сохраняет исходную формулировку и естественно сочетается с военным контекстом.
- source_word: לְהַשְׁחִיתָהּ
  choice: чтобы уничтожить её
  rationale: Инфинитив породы Hiphil от שׁחת выражает цель разрушительного похода. «Уничтожить» прямо передаёт сильное значение глагола.
- source_word: אָמַר אֵלַי
  choice: сказал мне
  rationale: Простая и точная передача формулы сообщения речи.
- source_word: עֲלֵה אֶל
  choice: выступи против
  rationale: Императив עלה с אֶל в данном военном контексте — приказ направиться против земли. «Выступи против» естественнее буквального «поднимись к» и сохраняет военный смысл.
- source_word: וְהַשְׁחִיתָהּ
  choice: и уничтожь её
  rationale: Сохранены отдельный повелительный глагол, соединительный союз и намеренный повтор идеи уничтожения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст дважды употребляет тетраграмматон как личное имя. «Яхве» сохраняет различие между именем и титулом и не превращает заявление ассирийца в авторскую оценку.
- issue: Характер заявления ассирийского посланника
  choice: Передать как прямое утверждение говорящего без поясняющей оценки
  alternative: Добавить указание, что это ложное или пропагандистское заявление
  rationale: Сам стих приводит притязание говорящего, но здесь явно не оценивает его истинность. Перевод сохраняет эту богословскую и повествовательную напряжённость.
- issue: Смысл מִבַּלְעֲדֵי в связи с Яхве
  choice: без Яхве
  alternative: независимо от Яхве; без дозволения Яхве
  rationale: '«Без Яхве» сохраняет широту выражения: оно может подразумевать отсутствие санкции, содействия или воли Яхве, не фиксируя лишь одно толкование.'
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Военное «выступил против» выбрано вместо буквального и неестественного «поднялся на». Местоимение «её» относится к земле. Маркер сноски поставлен после всего риторического вопроса, к которому относится пояснение.
