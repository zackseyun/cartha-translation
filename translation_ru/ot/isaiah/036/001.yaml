  text: וַ/יְהִ֡י בְּ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה לַ/מֶּ֣לֶךְ חִזְקִיָּ֗הוּ עָלָ֞ה סַנְחֵרִ֤יב מֶֽלֶךְ אַשּׁוּר֙ עַ֣ל כָּל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת וַֽ/יִּתְפְּשֵֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/001.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: ru
  text: В четырнадцатый год царствования Езекии Сеннахирим, царь Ассирии, выступил против всех укреплённых городов Иудеи и захватил их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[не выражено отдельно]'
  rationale: Нарративная форма вводит новый эпизод; в современном русском её функцию естественно передаёт начало датирующего оборота без архаичного «и было».
- source_word: בְּאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: В четырнадцатый год царствования Езекии
  rationale: Это формула датировки по году правления царя. Добавление «царствования» ясно и естественно передаёт значение לַמֶּלֶךְ, не изменяя смысла.
- source_word: סַנְחֵרִיב
  choice: Сеннахирим
  rationale: Устоявшаяся русская библейская форма имени ассирийского царя.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Точно передаёт сочетание титула и названия государства.
- source_word: עָלָה ... עַל
  choice: выступил против
  rationale: В военном контексте сочетание обозначает движение войска против противника; «выступил против» сохраняет военный оттенок без излишней конкретизации.
- source_word: כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: всех укреплённых городов Иудеи
  rationale: «Укреплённых» точно передаёт города, защищённые фортификационными сооружениями.
- source_word: וַיִּתְפְּשֵׂם
  choice: и захватил их
  rationale: В отношении осаждаемых городов תפשׂ означает овладеть ими, захватить.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествовательный исторический стиль, ясный и dignified, без архаического оборота «и было». Обособленное приложение «царь Ассирии» облегчает чтение.
