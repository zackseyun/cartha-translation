base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/022.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: ru
  text: Тогда Елиаким, сын Хелкии, управляющий дворцом, Шевна, писец, и Иоах, сын Асафа, летописец, пришли к Езекии в разорванных одеждах и передали ему слова рабсака[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рабсак — ассирийский придворный титул; его часто понимают как «главный виночерпий» или как обозначение другого высокопоставленного царского чиновника.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Тогда ... пришли
  rationale: Последовательная форма повествования вводит следующее событие; «тогда» естественно передаёт развитие рассказа, а множественное число обусловлено составным подлежащим.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: управляющий дворцом
  rationale: Оборот обозначает придворного, ведавшего царским домом или дворцом; выбран естественный русский эквивалент административного звания.
- source_word: הַסּוֹפֵר
  choice: писец
  rationale: Слово может обозначать писца или царского секретаря. «Писец» прямо передаёт лексическое значение и сохраняет исторический колорит.
- source_word: הַמַּזְכִּיר
  choice: летописец
  rationale: Речь идёт о придворном должностном лице, отвечавшем за записи и памятные сведения; «летописец» понятно современному читателю и не смешивается с должностью писца.
- source_word: קְרוּעֵי בְגָדִים
  choice: в разорванных одеждах
  rationale: Оборот описывает их состояние при прибытии и сохраняет видимый знак скорби и потрясения.
- source_word: וַיַּגִּידוּ לוֹ
  choice: передали ему
  rationale: Порода hifil глагола נגד означает сообщить или передать; здесь чиновники передают Езекии услышанную речь.
- source_word: דִּבְרֵי
  choice: слова
  rationale: Буквальное «слова» сохраняет связь с предшествующей речью и не сводит её содержание лишь к общему сообщению.
- source_word: רַב שָׁקֵה
  choice: рабсак
  rationale: Сохранено историческое ассирийское должностное наименование, которое в повествовании употребляется как устойчивый титул представителя царя.
