  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר הַ/מֶּ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵי בוֹרֽ/וֹ־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/016.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern[b],'
translation:
  language: ru
  text: 'Не слушайте Езекию, потому что так говорит царь Ассирии: «Заключите со мной мир[a] и выйдите ко мне. Пусть каждый ест плоды своей виноградной лозы и своей смоковницы и пьёт воду из своей цистерны[b],»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделайте со мной благословение». Здесь это выражение означает заключить мир или прийти к благоприятному соглашению.'
    reason: lexical_alternative
  - marker: b
    text: То есть из вырытой ёмкости, в которой собирали и хранили воду.
    reason: cultural_clarification
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: слушайте
  rationale: Сочетание означает «слушать, внимать»; в данном контексте призыв не внимать словам Езекии. Русское «не слушайте» естественно и не усиливает значение до однозначного «не повинуйтесь».
- source_word: חִזְקִיָּהוּ
  choice: Езекию
  rationale: Имя передано в традиционной русской библейской форме.
- source_word: כִּי כֹה אָמַר
  choice: потому что так говорит
  rationale: Сохраняет причинную связь כִּי и обычную формулу введения прямой речи כֹה אָמַר, оставаясь естественным для современного русского языка.
- source_word: הַמֶּלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Прямо передаёт конструкцию принадлежности и политический титул.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: заключите со мной мир
  rationale: Буквально выражение содержит слово «благословение», но в дипломатическом контексте означает достижение благоприятного соглашения; буквальная форма отмечена в сноске.
- source_word: וּצְאוּ אֵלַי
  choice: и выйдите ко мне
  rationale: Сохраняет буквальную образность глагола יצא и подразумеваемый призыв выйти из города, не подменяя её более истолковывающим «сдайтесь».
- source_word: אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: каждый ест плоды своей виноградной лозы и своей смоковницы
  rationale: Повтор אִישׁ имеет распределительное значение. В русском одного «каждый» достаточно для естественной передачи параллельной конструкции; добавление «плоды» делает смысл глагола «есть» естественным, поскольку едят не саму лозу или дерево.
- source_word: מֵי בוֹרוֹ
  choice: воду из своей водосборной ямы
  rationale: בּוֹר обозначает вырытую ёмкость для сбора и хранения воды, а не непременно родниковый колодец. Описательный русский эквивалент точнее передаёт предмет, чем неоднозначное «колодец».
