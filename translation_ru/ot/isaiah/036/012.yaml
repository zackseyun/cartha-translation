base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/012.yaml
  text: But the Rabshakeh said[a], “Has my master sent me to your master and to you to speak these words? Has he not sent me to the men sitting on the wall, to eat their own dung and drink their own urine with you?”
translation:
  language: ru
  text: 'Но рабсак сказал: «Неужели мой господин послал меня сказать эти слова твоему господину и тебе? Разве не к людям, сидящим на стене, которым вместе с вами придётся есть собственное дерьмо и пить собственную мочу[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте намеренно употреблена грубая лексика осадной угрозы: буквально — «есть своё дерьмо и пить свою мочу». Грубая форма слова «моча» сохраняется в написании (кетив), тогда как традиционное чтение (кере) заменяет её эвфемистическим выражением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: рабсак
  rationale: Сохранён традиционный исторический титул ассирийского сановника; перевод названием предполагаемой должности был бы менее надёжен.
- source_word: אֲדֹנֶיךָ / אֲדֹנִי
  choice: твой господин / мой господин
  rationale: В обоих случаях речь идёт о земных владыках — Езекии и ассирийском царе; строчная буква исключает божественное прочтение.
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: сказать эти слова
  rationale: Передаёт конкретное דְּבָרִים и естественно звучит по-русски.
- source_word: הֲלֹא
  choice: разве не
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ.
- source_word: הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחוֹמָה
  choice: люди, сидящие на стене
  rationale: Точно передаёт существительное и причастную конструкцию без добавления военного толкования.
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: чтобы они ... ели ... и пили
  rationale: Русская придаточная конструкция ясно связывает инфинитивы с людьми на стене, не добавляя отсутствующего в тексте «обречены» или «придётся».
- source_word: חראיהם
  choice: собственное дерьмо
  rationale: Намеренно грубое слово сохраняет оскорбительную лексику ассирийской угрозы; «экскременты» неоправданно смягчило бы её.
- source_word: שיניהם
  choice: собственную мочу
  rationale: Передан прямой телесный смысл выражения; текстовая особенность и грубый регистр отмечены в сноске.
- source_word: עִמָּכֶם
  choice: вместе с вами
  rationale: Точно передаёт совместность страдания людей на стене и адресатов.
