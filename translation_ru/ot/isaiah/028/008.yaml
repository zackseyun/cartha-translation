- source_word: שֻׁלְחָנוֹת
  choice: столы
  rationale: Прямое соответствие множественному числу «столы».
- source_word: קִיא
  choice: блевотина
  rationale: Передаёт конкретный и намеренно отталкивающий образ рвотной массы в современном, но не жаргонном русском языке.
- source_word: צֹאָה
