- source_word: בְּלִי מָקוֹם
  choice: чистого места нет
  rationale: Буквально «без места»; в контексте залитых нечистотами столов естественно означает отсутствие незагрязнённого места, не добавляя идеи о свободном месте.
theological_decisions:
- issue: Объём выражения בְּלִי מָקוֹם
  choice: чистого места нет
  alternative: не осталось места
  rationale: Контекст поддерживает смысл отсутствия чистого участка; перевод не вводит богословского уточнения и сохраняет резкость пророческого обличения.
translation_notes:
