source:
  edition: WLC
  text: מִ/דֵּ֤י עָבְר/וֹ֙ יִקַּ֣ח אֶתְ/כֶ֔ם כִּֽי בַ/בֹּ֧קֶר בַּ/בֹּ֛קֶר יַעֲבֹ֖ר בַּ/יּ֣וֹם וּ/בַ/לָּ֑יְלָה וְ/הָיָ֥ה רַק זְוָעָ֖ה הָבִ֥ין שְׁמוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/019.yaml
  text: As often as it passes through[a], it will seize you; for morning by morning it will pass through, by day and by night[b]; and it will be sheer terror to understand the message.
translation:
  language: ru
  text: Всякий раз, когда он будет проходить[a], он схватит вас, потому что каждое утро он будет проходить — и днём, и ночью. И будет настоящим ужасом понять эту весть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда бы он ни проходил».'
    reason: Лексическая альтернатива для повторительного оборота מִדֵּי עָבְרוֹ.
  - marker: b
    text: 'Возможный перевод: «И будет лишь ужасом постичь весть»; выражение можно понимать и в смысле: «услышать эту весть будет настоящим ужасом».'
    reason: Заключительная еврейская конструкция сжата; שְׁמוּעָה может означать «весть, сообщение» или то, что услышано, тогда как הָבִין буквально значит «понять».
lexical_decisions:
- source_word: מִדֵּי עָבְרוֹ
  choice: Всякий раз, когда он будет проходить
  rationale: 'Оборот מִדֵּי с последующей глагольной формой выражает повторяемость: «всякий раз, когда», «когда бы ни». Выбранный вариант ясно передаёт многократность действия.'
- source_word: יִקַּח אֶתְכֶם
  choice: он схватит вас
  rationale: לקח буквально означает «брать, взять»; в контексте разящего бича форма «схватит» передаёт враждебное овладение, не добавляя более конкретного образа унесения или плена.
- source_word: בַבֹּקֶר בַבֹּקֶר
  choice: каждое утро
  rationale: Повтор существительного имеет распределительное значение. «Каждое утро» естественно передаёт его в современном русском языке.
- source_word: יַעֲבֹר
  choice: будет проходить
  rationale: 'Сохранено то же значение корня עבר, что и в начале стиха: движение через охваченное бедствием пространство, а не нейтральное прохождение мимо.'
- source_word: בַּיּוֹם וּבַלָּיְלָה
  choice: и днём, и ночью
  rationale: Естественная русская формула сохраняет меризм, обозначающий непрестанное повторение.
- source_word: רַק זְוָעָה
  choice: сущим ужасом
  rationale: רַק придаёт исключительное, усилительное значение — «одним лишь, сущим»; זְוָעָה обозначает ужас, потрясение или содрогание.
- source_word: הָבִין שְׁמוּעָה
  choice: понять эту весть
  rationale: הָבִין прямо означает «понять», а שְׁמוּעָה — услышанное известие, весть или сообщение. «Весть» сохраняет связь со слышанием и подходит возвышенному, но понятному регистру.
theological_decisions:
- issue: К кому относится мужской род глаголов «будет проходить… схватит»
  choice: Сохранено местоименное «он», отсылающее к бичу из непосредственного контекста Ис 28:18.
  alternative: Повторить в тексте стиха выражение «сокрушительный бич».
  rationale: В еврейском стихе подлежащее не повторено; его восстанавливают из предыдущего стиха. Местоименная передача сохраняет связность текста и не вносит пояснение непосредственно в перевод.
- issue: Синтаксис заключительной фразы הָבִין שְׁמוּעָה
  choice: «И понять эту весть будет сущим ужасом».
  alternative: «И будет лишь ужас от услышанной вести» или «Даже услышать эту весть будет сущим ужасом».
  rationale: Еврейская фраза сжата и допускает связь ужаса как с пониманием, так и шире с восприятием услышанного. Основной текст сохраняет прямое значение הָבִין — «понять», не заменяя его глаголом «услышать».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «будет проходить» намеренно сохранён вслед за еврейским текстом; сочетание «сущим ужасом» передаёт усилительное רַק без конфессионального истолкования.
