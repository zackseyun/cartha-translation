  text: כִּ֤י כְ/הַר פְּרָצִים֙ יָק֣וּם יְהוָ֔ה כְּ/עֵ֖מֶק בְּ/גִבְע֣וֹן יִרְגָּ֑ז לַ/עֲשׂ֤וֹת מַעֲשֵׂ֨/הוּ֙ זָ֣ר מַעֲשֵׂ֔/הוּ וְ/לַֽ/עֲבֹד֙ עֲבֹ֣דָת֔/וֹ נָכְרִיָּ֖ה עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/021.yaml
  text: For Yahweh will rise up as at Mount Perazim[a]; he will be stirred up as in the Valley of Gibeon[c][b], to do his work—his strange work—and to perform his task—his foreign task.
translation:
  language: ru
  text: Ибо Яхве восстанет, как на горе Перацим[a], будет приведён в волнение, как в долине у Гаваона[b], чтобы совершить Своё дело — дело необычное — и исполнить Свою работу — работу чуждую[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Гора Перацим напоминает о том, как Яхве сокрушил врагов Давида (2 Царств 5:20; 1 Паралипоменон 14:11).
    reason: cross_reference
  - marker: b
    text: Долина у Гаваона, вероятно, напоминает о вмешательстве Яхве в сражение при Гаваоне (Иисус Навин 10:10–14).
    reason: cross_reference
  - marker: c
    text: 'Или: «Своё чуждое дело… Свою необычную работу». Оба прилагательных подчёркивают, что это действие суда изображено как непривычное или чуждое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего предупреждения и сохраняет причинную связь.
- source_word: כְהַר פְּרָצִים
  choice: как у горы Перацим
  rationale: Предлог сравнения указывает на прежнее событие, связанное с этим местом, а не просто сравнивает Яхве с горой.
- source_word: יָקוּם
  choice: восстанет
  rationale: Глагол קום передаёт решительное выступление Яхве для действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: כְעֵמֶק בְּגִבְעוֹן
  choice: как в долине у Гаваона
  rationale: Формулировка естественно передаёт топографическую связь долины с Гаваоном, не превращая её без необходимости в собственное название.
- source_word: יִרְגָּז
  choice: придёт в ярость
  rationale: В данном контексте רגז обозначает сильное возбуждение и гнев, побуждающие к судному действию; выражение не предполагает утраты контроля.
- source_word: מַעֲשֵׂהוּ זָר מַעֲשֵׂהוּ
  choice: Своё дело — необычное Своё дело
  rationale: Сохранены повтор существительного и характеристика действия как непривычного, странного.
- source_word: וְלַעֲבֹד עֲבֹדָתוֹ
  choice: исполнить Свою работу
  rationale: Глагол и однокоренное существительное передают совершение действия; по-русски буквальное «работать Свою работу» было бы неестественно.
- source_word: נָכְרִיָּה עֲבֹדָתוֹ
  choice: чуждую Свою работу
  rationale: «Чуждую» сохраняет оттенок инородности и отличается от «необычное», отражая вариацию двух еврейских прилагательных.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характеристика Божьего дела как זָר / נָכְרִיָּה
  choice: Сохранить определения «необычное» и «чуждую» без истолковывающего уточнения
  alternative: Необычный суд; неожиданное наказание
  rationale: Еврейский текст намеренно создаёт богословское напряжение, называя предстоящее действие Бога непривычным и чуждым; перевод не должен заранее объяснять или устранять это напряжение.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Синтаксический параллелизм и настойчивый повтор «Своё дело / Свою работу» сохранены. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
