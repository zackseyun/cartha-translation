  text: הִנֵּ֨ה חָזָ֤ק וְ/אַמִּץ֙ לַֽ/אדֹנָ֔/י כְּ/זֶ֥רֶם בָּרָ֖ד שַׂ֣עַר קָ֑טֶב כְּ֠/זֶרֶם מַ֣יִם כַּבִּירִ֥ים שֹׁטְפִ֛ים הִנִּ֥יחַ לָ/אָ֖רֶץ בְּ/יָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/002.yaml
  text: Behold[a], the Lord has one who is mighty and strong; like a storm of hail, a destroying tempest, like a storm of mighty, overflowing waters[b], he casts it down to the earth with his hand.
translation:
  language: ru
  text: Вот, у Господа есть некто сильный и могучий[a]. Подобно ливню с градом, губительной буре, подобно потоку могучих, бурно разливающихся вод, он рукою низвергнет это на землю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот сильный и могучий, принадлежащий Господу (или находящийся в Его распоряжении)». Еврейское выражение допускает оттенок принадлежности или готовности служить орудием Господа.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте объект действия не назван; вероятно, имеется в виду гордый венок из стиха 1. Возможен также перевод: «он рукою повергнет это на землю».'
    reason: implicit_object
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный русский указательно-вводный маркер сохраняет силу внезапного пророческого возвещения без излишней архаичности.
- source_word: חָזָק וְאַמִּץ
  choice: могучий и сильный
  rationale: Сохраняет парное усиление и не конкретизирует личность названного деятеля.
- source_word: לַאדֹנָי
  choice: у Господа есть
  rationale: Передаёт дательный оттенок принадлежности или наличия в распоряжении Господа естественной русской конструкцией.
- source_word: כְּזֶרֶם בָּרָד
  choice: подобно ливню с градом
  rationale: זֶרֶם здесь обозначает бурный ливень или поток; сочетание «ливень с градом» естественно передаёт метеорологический образ.
- source_word: שַׂעַר קָטֶב
  choice: губительной буре
  rationale: Передаёт разрушительный характер סער/שׂער и קָטֶב кратко и образно.
- source_word: כְּזֶרֶם מַיִם כַּבִּירִים שֹׁטְפִים
  choice: подобно потоку могучих, разлившихся вод
  rationale: «Поток» отражает стремительное движение, כַּבִּירִים — мощь, а שֹׁטְפִים — разлив и затопление.
- source_word: הִנִּיחַ לָאָרֶץ
  choice: низвергнет её на землю
  rationale: В контексте суда и бурной стихии каузативный глагол имеет сильный смысл низложения; женское местоимение соотносится с подразумеваемой «короной» из стиха 1, но это уточнено в сноске.
- source_word: בְּיָד
  choice: рукой
  rationale: Сохраняет буквальный антропоморфный образ непосредственного действия или действия через орудие Господа.
theological_decisions:
- issue: Личность «могучего и сильного»
  choice: 'Оставлена неопределённой: «могучий и сильный».'
  alternative: Назвать Ассирию, ассирийского царя либо самого Господа.
  rationale: Еврейский текст прямо не называет деятеля; контекст указывает на орудие Божьего суда, но не требует раскрывать его личность в переводе.
- issue: Субъект последнего глагола
  choice: «он» продолжает указание на могучего и сильного.
  alternative: Понимать действующим лицом непосредственно Господа.
  rationale: Мужской субъект естественно продолжается от חָזָק וְאַמִּץ, однако формулировка не исключает божественной власти за действием этого орудия.
- issue: Объект низвержения
  choice: Использовано «её» с пояснением контекстуальной связи с венком/короной из стиха 1.
  alternative: «это», «его» или оставить объект невыраженным.
  rationale: В самом стихе объект формально не назван. Русский синтаксис требует его обозначить; ближайший контекст допускает отсылку к гордому венку Самарии, но сноска сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. «Вот» предпочтено архаичному «се», а «Господь» сохраняет традиционное обозначение אֲדֹנָי. Параллелизм образов бури и потока сохранён.
