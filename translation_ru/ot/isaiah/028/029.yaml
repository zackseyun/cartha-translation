source:
  edition: WLC
  text: גַּם זֹ֕את מֵ/עִ֛ם יְהוָ֥ה צְבָא֖וֹת יָצָ֑אָה הִפְלִ֣יא עֵצָ֔ה הִגְדִּ֖יל תּוּשִׁיָּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/029.yaml
  text: This also has come from Yahweh of hosts[a]; he is wonderful in counsel and great in wisdom.
translation:
  language: ru
  text: 'И это тоже пришло от Яхве Воинств: Он дивен в совете и велик в мудрости[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в здравой, практической мудрости»; возможен также оттенок находчивости и умелости.'
    reason: Еврейское תּוּשִׁיָּה обозначает не только мудрость вообще, но и здравую, действенную рассудительность или практическую умелость.
lexical_decisions:
- source_word: גַּם זֹאת
  choice: И это тоже
  rationale: Передаёт присоединение данного вывода к предшествующему земледельческому примеру.
- source_word: מֵעִם ... יָצָאָה
  choice: пришло от
  rationale: Естественно выражает происхождение от Яхве, сохраняя результативность перфекта יָצָאָה.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יְהוָה как «Яхве» и сохраняет образ воинств в составе титула צְבָאוֹת.
- source_word: הִפְלִיא עֵצָה
  choice: дивен в совете
  rationale: Сжатая предикативная формулировка естественно передаёт исключительность Божьего совета, не сводя עֵצָה только к совету, плану или замыслу.
- source_word: הִגְדִּיל תּוּשִׁיָּה
  choice: велик в мудрости
  rationale: Передаёт поэтический параллелизм и широкое значение תּוּשִׁיָּה; более практические оттенки отмечены в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно употреблено личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Смысл глагольных сочетаний הִפְלִיא עֵצָה и הִגְדִּיל תּוּשִׁיָּה
  choice: Он дивен в совете и велик в мудрости
  alternative: Он сделал совет дивным и возвеличил мудрость
  rationale: Выбранное чтение передаёт принятую в данном контексте характеристику Яхве, однако не добавляет конфессионального истолкования; буквальная каузативная форма по-русски звучала бы неясно и тяжеловесно.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим строем. Сохранены параллелизм второй половины стиха и образ «воинств» в Божьем титуле.
