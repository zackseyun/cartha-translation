  text: Прислушайтесь и услышьте мой голос; вслушайтесь и услышьте моё слово.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: Прислушайтесь
  rationale: Повелительная форма породы хифиль от אזן призывает внимательно склонить слух. «Прислушайтесь» естественно передаёт усиленное внимание и отличается от следующего «услышьте».
- source_word: וְשִׁמְעוּ
  choice: и услышьте
  rationale: Повелительная форма породы каль от שמע сохранена отдельным глаголом, чтобы не сглаживать еврейское сочетание двух призывов и его повтор во второй половине строки.
- source_word: קוֹלִי
  choice: мой голос
  rationale: В контексте прямой речи קול имеет обычное значение «голос»; притяжательная форма передана прямо и естественно.
- source_word: הַקְשִׁיבוּ
  choice: будьте внимательны
  rationale: Повелительная форма породы хифиль от קשב требует сосредоточенного внимания. Этот вариант ясен в современном русском и сохраняет отличие от первого призыва слушать.
- source_word: אִמְרָתִי
  choice: моё слово
  rationale: אמרה означает слово, высказывание или речь. «Моё слово» сохраняет единственное число и поэтический параллелизм с «моим голосом».
