  text: הֲ/כֹ֣ל הַ/יּ֔וֹם יַחֲרֹ֥שׁ הַ/חֹרֵ֖שׁ לִ/זְרֹ֑עַ יְפַתַּ֥ח וִֽ/ישַׂדֵּ֖ד אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/024.yaml
  text: Does the plowman plow all day to sow? Does he keep opening and harrowing his ground?[a]
translation:
  language: ru
  text: Разве пахарь весь день пашет, чтобы сеять? Разве он без конца взрыхляет и боронит свою землю?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве он без конца разбивает комья и разравнивает почву?» Значение еврейских земледельческих глаголов допускает более общее описание; основной текст передаёт вероятную последовательность обработки поля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכֹל הַיּוֹם
  choice: Разве ... весь день
  rationale: 'Вопросительная частица הֲ вводит риторический вопрос, а כֹל הַיּוֹם обозначает продолжительность: «весь день». Частица «разве» естественно передаёт ожидаемый отрицательный ответ.'
- source_word: יַחֲרֹשׁ / הַחֹרֵשׁ
  choice: пахарь ... пашет
  rationale: Однокоренные русские слова сохраняют повтор корня חרש и ясный земледельческий образ.
- source_word: לִזְרֹעַ
  choice: чтобы сеять
  rationale: Инфинитив выражает цель пахоты. Краткое «чтобы сеять» точно передаёт смысл и не добавляет отсутствующего в тексте объекта.
- source_word: יְפַתַּח
  choice: взрыхляет
  rationale: Буквально глагол означает «открывать»; в земледельческом контексте речь идёт о вскрытии и рыхлении почвы. «Взрыхляет» звучит естественно по-русски и сохраняет последовательность подготовки поля.
- source_word: וִישַׂדֵּד
  choice: боронит
  rationale: Здесь это специальный земледельческий глагол, вероятно обозначающий обработку почвы после пахоты — разбивание комьев и выравнивание бороной.
- source_word: אַדְמָתוֹ
  choice: свою землю
  rationale: אַדָמָה обозначает обрабатываемую землю или почву; возвратное «свою» естественно передаёт притяжательный суффикс при подлежащем «он».
