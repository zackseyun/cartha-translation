base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/025.yaml
  text: Does he not[a], when he has leveled its surface, scatter black cumin and sow cumin, and put wheat in rows, and barley in its appointed place[c][b], and spelt at its border?
translation:
  language: ru
  text: Разровняв поверхность земли, разве не рассыпает он чернушку[a], не сеет тмин, не высевает пшеницу рядами[b], ячмень — на отведённом ему месте, а полбу[c] — по краям?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное определение растения קֶצַח не вполне установлено; вероятно, это чернушка посевная, которую также называют чёрным тмином.
    reason: lexical_alternative
  - marker: b
    text: 'Значение еврейского слова שׂוֹרָה неясно. Возможны также переводы: «как главную культуру» или «на лучшем месте».'
    reason: lexical_alternative
  - marker: c
    text: Точное определение злака כֻסֶּמֶת не вполне установлено; возможно, имеется в виду эммер — один из видов полбы.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִם
  choice: разровняв... разве не
  rationale: Сочетание вводит риторический вопрос с условно-временным оттенком; деепричастная конструкция естественно передаёт последовательность действий по-русски.
- source_word: שִׁוָּה פָנֶיהָ
  choice: разровняв поверхность земли
  rationale: Глагол обозначает выравнивание, а форма с суффиксом указывает на поверхность земли; явное «земли» устраняет неясность русского местоимения.
- source_word: הֵפִיץ קֶצַח
  choice: рассыпает он чернушку
  rationale: Глагол передаёт широкое разбрасывание семян. קֶצַח обычно отождествляют с чернушкой посевной, хотя точная идентификация не бесспорна.
- source_word: כַמֹּן יִזְרֹק
  choice: сеет тмин
  rationale: Буквальное значение глагола связано с бросанием или рассыпанием, но в земледельческом контексте естественное русское обозначение действия — «сеет».
- source_word: וְשָׂם
  choice: сажает
  rationale: Глагол буквально означает «кладёт, помещает»; применительно к намеренному размещению зерновых «сажает» звучит понятно, сохраняя отличие от разбрасывания мелких семян.
- source_word: חִטָּה שׂוֹרָה
  choice: пшеницу рядами
  rationale: שׂוֹרָה — трудный земледельческий термин; «рядами» передаёт вероятный смысл упорядоченной посадки, а иные толкования отмечены в сноске.
- source_word: וּשְׂעֹרָה נִסְמָן
  choice: ячмень — на отведённом ему месте
  rationale: Редкая форма, вероятно, связана с обозначением или отведением участка; перевод подчёркивает намеренное распределение посевов.
- source_word: וְכֻסֶּמֶת גְּבֻלָתוֹ
  choice: а полбу — по краям
  rationale: כֻסֶּמֶת обозначает один из древних видов пшеницы, обычно передаваемый как «полба»; גְּבֻלָתוֹ здесь указывает на границу или края участка.
