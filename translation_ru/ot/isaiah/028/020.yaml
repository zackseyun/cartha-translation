source:
  edition: WLC
  text: כִּֽי קָצַ֥ר הַ/מַּצָּ֖ע מֵֽ/הִשְׂתָּרֵ֑עַ וְ/הַ/מַּסֵּכָ֥ה צָ֖רָה כְּ/הִתְכַּנֵּֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/020.yaml
  text: For the bed is too short to stretch oneself out on[a], and the covering too narrow to wrap oneself in.
translation:
  language: ru
  text: Ведь постель слишком коротка, чтобы вытянуться на ней, и покрывало слишком узко, чтобы закутаться в него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующей мыслью естественным для русского повествования способом.
- source_word: קָצַר הַמַּצָּע
  choice: постель слишком коротка
  rationale: מַצָּע обозначает то, что расстилают для лежания; «постель» сохраняет образ и звучит естественно. «Слишком коротка» выражает подразумеваемую непригодность.
- source_word: מֵהִשְׂתָּרֵעַ
  choice: чтобы вытянуться на ней
  rationale: Сохраняет возвратный оттенок глагола и ясно связывает действие с постелью.
- source_word: וְהַמַּסֵּכָה
  choice: и покрывало
  rationale: В данном образе существительное обозначает предмет, которым укрываются; «покрывало» достаточно широко и не уточняет материал или толщину сверх еврейского текста.
- source_word: צָרָה
  choice: слишком узко
  rationale: Передаёт не просто узость, а недостаточность покрывала для предполагаемого действия.
- source_word: כְּהִתְכַּנֵּס
  choice: чтобы закутаться в него
  rationale: Естественно передаёт смысл собирания покрывала вокруг себя и сохраняет возвратность действия.
