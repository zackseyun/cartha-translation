  text: וְ/יִסְּר֥/וֹ לַ/מִּשְׁפָּ֖ט אֱלֹהָ֥י/ו יוֹרֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/026.yaml
  text: For his God instructs him in justice[a]; he teaches him.
translation:
  language: ru
  text: Его Бог наставляет его, как следует поступать[a]; учит его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставляет его как следует». Еврейское выражение לַמִּשְׁפָּט может означать действие по надлежащему правилу или порядку; буквально оно связано с «судом», «решением» или «правилом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִסְּרוֹ
  choice: наставляет его
  rationale: Пиэль от יסר с объектным суффиксом 3-го лица ед. числа. В контексте земледельческой мудрости речь идёт не о наказании, а о наставлении и обучении правильному способу действий.
- source_word: לַמִּשְׁפָּט
  choice: как правильно поступать
  rationale: מִשְׁפָּט может означать «суд» или «справедливость», но здесь, в описании земледельческого умения, указывает на надлежащий порядок, правило или способ действий. Русская формулировка передаёт практический смысл и не сводит выражение к нравственно-юридической справедливости.
- source_word: אֱלֹהָיו
  choice: его Бог
  rationale: 'Сохранена притяжательная форма: источником умения земледельца назван его Бог.'
- source_word: יוֹרֶנּוּ
  choice: учит его
  rationale: Хифиль от ירה означает «учить, наставлять, направлять». «Учит его» естественно передаёт педагогический смысл и сохраняет параллелизм двух глаголов.
theological_decisions:
- issue: Источник земледельческой мудрости
  choice: Практическое знание земледельца прямо представлено как данное Богом через наставление.
  alternative: Фразу можно понимать шире — как указание на Божье провиденциальное руководство человеческим умением.
  rationale: Явно названный субъект «его Бог» и два глагола обучения связывают умение земледельца с Богом, не уточняя механизм этого обучения.
translation_notes:
  register: Современный литературный русский язык; формулировка проста и достойна. Повтор «его» сохранён ради ясности и близости к еврейскому параллелизму. Практический смысл לַמִּשְׁפָּט передан без устранения его более формального значения, отмеченного в сноске.
