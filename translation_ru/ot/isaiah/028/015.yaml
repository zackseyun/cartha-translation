id: ISA.28.15
reference: Isaiah 28:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י אֲמַרְתֶּ֗ם כָּרַ֤תְנֽוּ בְרִית֙ אֶת מָ֔וֶת וְ/עִם שְׁא֖וֹל עָשִׂ֣ינוּ חֹזֶ֑ה שיט שׁוֹטֵ֤ף כִּֽי עבר לֹ֣א יְבוֹאֵ֔/נוּ כִּ֣י שַׂ֧מְנוּ כָזָ֛ב מַחְסֵ֖/נוּ וּ/בַ/שֶּׁ֥קֶר נִסְתָּֽרְנוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/015.yaml
  text: Because you have said[a], “We have made a covenant with death, and with Sheol we have made an agreement. When the overwhelming scourge passes through, it will not come to us[c][b], because we have made falsehood our refuge and have hidden ourselves in deceit.”
translation:
  language: ru
  text: 'Ведь вы говорите: «Мы заключили союз со смертью и с шеолом[a] заключили договор[b]. Когда пронесётся сметающий бич[c], он нас не коснётся, потому что мы сделали ложь своим убежищем и укрылись в обмане».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шеол — древнееврейское обозначение мира мёртвых; это слово не обязательно тождественно позднейшим представлениям об аде.
    reason: cultural_note
  - marker: b
    text: 'Еврейское слово трудно для толкования. Возможно также: «соглашение» или «пакт»; буквально оно может означать «видение», но здесь, по-видимому, соответствует стоящему рядом слову «союз».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское выражение допускает переводы «захлёстывающий бич» или «наводняющая плеть» и соединяет образы разливающегося потока и разящего бича.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אֲמַרְתֶּם
  choice: Ведь вы говорите
  rationale: כִּי вводит основание для последующего обличения; «ведь» естественно передаёт эту связь. Перфект אֲמַרְתֶּם здесь обозначает высказанное и сохраняющее силу заявление, поэтому настоящее время уместно в русской прямой речи.
- source_word: כָּרַתְנוּ בְרִית
  choice: мы заключили союз
  rationale: Буквальная идиома «разрезали завет» по-русски неестественна. «Заключили союз» сохраняет договорный смысл и хорошо сочетается с олицетворённой смертью.
- source_word: מָוֶת
  choice: смерть
  rationale: Прямой эквивалент; олицетворение сохраняется синтаксисом, без необязательной прописной буквы.
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет древнееврейское представление о мире мёртвых и не отождествляет его автоматически с позднейшим понятием ада.
- source_word: עָשִׂינוּ חֹזֶה
  choice: заключили договор
  rationale: В данном параллелизме редкое חֹזֶה вероятнее всего означает соглашение или договор, а не «видение». Русское «заключили договор» ясно передаёт договорную формулу.
- source_word: שיט שׁוֹטֵף
  choice: сметающий бич
  rationale: Трудное сочетание объединяет образ удара бича с напором разлива. «Сметающий бич» сохраняет оба оттенка достаточно естественно, не делая спорную метафору чрезмерно конкретной.
- source_word: כִּי עבר
  choice: когда пронесётся
  rationale: В контексте угрозы כִּי имеет временное значение, а עבר описывает движение бедствия через землю. «Пронесётся» передаёт стремительность и разрушительный характер образа.
- source_word: לֹא יְבוֹאֵנוּ
  choice: он нас не коснётся
  rationale: Идиоматически передаёт уверенность говорящих, что бедствие до них не дойдёт, сохраняя местоименную отсылку к бичу.
- source_word: כָזָב מַחְסֵנוּ
  choice: сделали ложь своим убежищем
  rationale: Сохраняет абстрактное существительное и намеренно парадоксальный образ убежища, построенного на лжи.
- source_word: וּבַשֶּׁקֶר נִסְתָּרְנוּ
  choice: укрылись в обмане
  rationale: Передаёт возвратный смысл נִסְתָּרְנוּ и параллель с предыдущей строкой, при этом различая близкие כָזָב и שֶׁקֶר словами «ложь» и «обман».
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых; ад
  rationale: Транслитерация не сужает значение до отдельной могилы и не привносит более позднее учение об аде; пояснение дано в сноске.
- issue: Олицетворение смерти и шеола
  choice: сохранить их как стороны мнимого союза и договора
  alternative: перефразировать как защищённость от смерти
  rationale: Прямая метафора составляет основу обвинительной и иронической силы стиха; её не следует разъяснять вместо автора.
- issue: Неоднозначность חֹזֶה
  choice: договор
  alternative: видение; соглашение; пакт
  rationale: Параллелизм с בְרִית убедительно поддерживает договорное значение, однако реальная лексическая трудность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксический параллелизм сохранён, но буквальные древнееврейские идиомы переданы естественными русскими сочетаниями. Лексическая и образная неоднозначность отмечена сносками, а не устранена поясняющим переводом.
