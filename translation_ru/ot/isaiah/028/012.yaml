  naturalness: «Он сказал им» естественно и точно. Противительное «но» следует оставить внутри прямой речи, поскольку оно относится к продолжающемуся высказыванию в данном стихе; такое оформление также делает русский синтаксис прозрачнее.
  terminology: «Покой», «утомлённому» и «отдохновение» уместны в современном литературном русском и сохраняют сдержанную возвышенность параллельных еврейских выражений. Не требуется добавлять имя Бога или иные интерпретирующие уточнения.
