  yaml_path: translation/ot/isaiah/028/012.yaml
  text: to whom he said, “This is rest; give rest to the weary, and this is repose,” yet they were not willing to hear.
translation:
  language: ru
  text: 'Он сказал им: «Вот покой: дайте покой утомлённому; вот отдохновение, — но они не захотели слушать».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנוּחָה
  choice: покой
  rationale: Передаёт основное значение покоя и отдыха; указательное זֹאת сохранено словом «вот».
- source_word: הָנִיחוּ לֶעָיֵף
  choice: дайте покой утомлённому
  rationale: Императив каузативной формы передан как призыв предоставить покой; לֶעָיֵף — адресат, «утомлённому».
- source_word: הַמַּרְגֵּעָה
  choice: отдохновение
  rationale: Сохраняет близкое, но не полностью тождественное «покою» значение — передышку и восстановление — и соответствует возвышенному пророческому регистру.
- source_word: וְלֹא אָבוּא שְׁמוֹעַ
  choice: Но они не захотели слушать
  rationale: אָבוּ выражает нежелание или отказ, а инфинитив שְׁמוֹעַ — действие слушания; противительный смысл ו естественно передан союзом «но».
theological_decisions:
- issue: Кто является говорящим
  choice: «Он говорил им» без уточнения субъекта
  alternative: «Господь говорил им»
  rationale: В данном стихе субъект выражен формой третьего лица и определяется контекстом; имя Бога не следует добавлять непосредственно в текст стиха.
- issue: Характер отказа слушать
  choice: «не захотели слушать»
  alternative: «не стали слушать»
  rationale: Выбранный вариант сохраняет волевой оттенок אָבוּ, не усиливая его до более категоричного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Параллелизм двух указательных фраз сохранён; архаичные формы и конфессионально окрашенные добавления исключены.
