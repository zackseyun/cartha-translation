    rationale: כִּי вводит высказывание/объяснение, но не содержит «это»; добавление ухудшает русский синтаксис без необходимости.
  - severity: medium
    issue: «Правило» для קַו чрезмерно истолковывает образ.
    rationale: Кַו прежде всего означает линию или мерный шнур; «правило» переводит возможный вывод из образа, а не сам образ.
  - severity: low
