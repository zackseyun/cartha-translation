    rationale: Формальное «к» не воспроизводит функцию повторной формулы в современном русском; «за … за …» сохраняет её ритм и не вводит нового смысла.
  revised_text: 'Ибо: «Повеление за повелением, повеление за повелением, линия за линией, линия за линией, немного там, немного там».'
