  yaml_path: translation/ot/isaiah/028/010.yaml
  text: For it is[a], “Command on command, command on command, line on line, line on line, a little here, a little there.”
translation:
  language: ru
  text: 'Ибо: «Повеление за повелением, повеление за повелением, линия за линией, линия за линией, немного там, немного там».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит пояснение к предшествующему контексту; «ведь» естественно передаёт эту связь, не сводя её к строго причинной.
- source_word: צַו
  choice: заповедь
  rationale: Если слово связано с צוה, оно обозначает предписание или повеление. «Заповедь» сохраняет краткость, повторяемость и возможный оттенок насмешливого цитирования.
- source_word: לָצָו
  choice: к заповеди
  rationale: Буквально передаёт לְ в намеренно рубленой и повторяющейся конструкции, не сглаживая её до более истолковывающего русского оборота.
- source_word: קַו
  choice: правило
  rationale: Слово обозначает мерный шнур или линию; в данном ритмическом изречении «правило» кратко и может выражать мерку либо установленную норму, сохраняя неоднозначность образа.
- source_word: לָקָו
  choice: к правилу
  rationale: Параллельно «к заповеди» сохраняет форму и навязчивую повторность еврейской речи.
- source_word: זְעֵיר
  choice: немного
  rationale: Передаёт значение «мало, немного» и сохраняет краткий ритм.
- source_word: שָׁם
  choice: там
  rationale: Еврейский текст дважды прямо употребляет «там»; основной текст сохраняет это повторение, не заменяя первое вхождение на «здесь» ради русского идиоматического оборота.
theological_decisions:
- issue: Понимать ли слова как прямое описание обучения или как насмешливую, детски звучащую речь
  choice: Сохранить в кавычках рубленую, назойливо повторяющуюся речь, допускающую насмешливое прочтение
  alternative: Передать как нейтральное описание последовательного наставления
  rationale: Контекст Ис 28:9–13 поддерживает возможность того, что вожди передразнивают пророческое наставление, однако сама строка не называет речь насмешкой прямо. Кавычки и ритм передают риторический эффект без добавления уничижительной парафразы.
translation_notes:
  register: Современный литературный русский с намеренно рубленым, повторяющимся ритмом. Основной текст близок к форме WLC; возможная идиоматическая и более привычная передача вынесена в примечание.
