  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ יְהוָ֣ה צְבָא֔וֹת לַ/עֲטֶ֣רֶת צְבִ֔י וְ/לִ/צְפִירַ֖ת תִּפְאָרָ֑ה לִ/שְׁאָ֖ר עַמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/005.yaml
  text: In that day Yahweh of Armies will be a crown of beauty and a diadem of splendor for the remnant of his people[a].
translation:
  language: ru
  text: В тот день Яхве Воинств будет венцом красоты и диадемой великолепия для остатка Своего народа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь Саваоф». Еврейский титул יְהוָה צְבָאוֹת буквально связывает имя Яхве с «воинствами»; традиционный русский перевод — «Господь Саваоф».'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Устойчивая пророческая формула времени; естественно звучит по-русски и сохраняет торжественную пророческую интонацию.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Имя Яхве передаёт тетраграмматон как личное Божье имя, а «Воинств» сохраняет смысл традиционного библейского титула и его возвышенный регистр.
- source_word: יִהְיֶה
  choice: будет
  rationale: Имперфект глагола היה в данном пророческом контексте обозначает будущее состояние.
- source_word: לַעֲטֶרֶת צְבִי
  choice: венцом красоты
  rationale: «Венец» естественно передаёт עֲטֶרֶת в поэтическом контексте, а «красота» сохраняет эстетическое значение צְבִי и не сливает его со следующим תִּפְאָרָה.
- source_word: וְלִצְפִירַת תִּפְאָרָה
  choice: и диадемой великолепия
  rationale: «Диадема» сохраняет параллелизм с «венцом», не повторяя то же существительное; «великолепие» передаёт возвышенный смысл תִּפְאָרָה.
- source_word: לִשְׁאָר עַמּוֹ
  choice: для остатка Своего народа
  rationale: «Остаток» сохраняет характерный для Исайи пророческий мотив уцелевшей части народа; «для» естественно выражает значение еврейского предлога לְ в этом контексте.
theological_decisions:
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве воинств
  rationale: Передача «Яхве» сохраняет личное Божье имя, а «Воинств» отражает значение צְבָאוֹת. Заглавная буква подчёркивает, что слово входит в состав устойчивого божественного титула, не уточняя без основания, земные это или небесные войска.
- issue: Значение שְׁאָר
  choice: остаток
  alternative: оставшаяся часть
  rationale: В книге Исайи это слово связано не только с количеством уцелевших, но и с устойчивым пророческим мотивом остатка народа; перевод не развивает этот мотив сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Парные образы «венец красоты» и «диадема великолепия» сохраняют поэтический параллелизм и различие еврейских слов.
