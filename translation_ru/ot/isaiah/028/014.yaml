id: ISA.28.14
reference: Isaiah 28:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/כֵ֛ן שִׁמְע֥וּ דְבַר יְהוָ֖ה אַנְשֵׁ֣י לָצ֑וֹן מֹֽשְׁלֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה אֲשֶׁ֖ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/014.yaml
  text: Therefore hear the word of Yahweh[a], you scoffing men, rulers of this people who are in Jerusalem.
translation:
  language: ru
  text: Итак, слушайте слово Яхве, вы, насмешники[a], правители этого народа в Иерусалиме!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «люди насмешки» или «люди глумления».'
    reason: Сохраняет доступ к образной именной конструкции אַנְשֵׁי לָצוֹן и указывает близкую лексическую альтернативу.
lexical_decisions:
- source_word: לָכֵן
  choice: Итак
  rationale: Передаёт выводный переход от предшествующего обличения и естественно звучит в пророческой речи.
- source_word: שִׁמְעוּ
  choice: слушайте
  rationale: Форма повелительного наклонения во множественном числе содержит призыв услышать и принять сказанное, но перевод не усиливает её до однозначного «повинуйтесь».
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и передаёт יהוה как личное имя, а не заменяет его титулом.
- source_word: אַנְשֵׁי לָצוֹן
  choice: вы, насмешники
  rationale: Естественно передаёт обращение к конкретным мужчинам, склонным к насмешке и глумлению; буквальная конструкция «люди насмешки» по-русски неестественна.
- source_word: מֹשְׁלֵי הָעָם הַזֶּה
  choice: правители этого народа
  rationale: Точно передаёт причастие от משל в значении «править» и сохраняет указательное выражение «этот народ».
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Краткая предложная формулировка сохраняет локализацию, не навязывая спорную синтаксическую привязку относительного оборота исключительно к правителям или к народу.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога, не подменяя его титулом.
- issue: Мужской характер обращения אַנְשֵׁי
  choice: насмешники
  alternative: насмехающиеся; люди насмешки
  rationale: Русское существительное мужского рода естественно обозначает адресатов-мужчин, то есть правителей, и не нейтрализует форму исходного текста.
- issue: Синтаксическая привязка אֲשֶׁר בִּירוּשָׁלָם
  choice: правители этого народа в Иерусалиме
  alternative: правители этого народа, живущие в Иерусалиме; правители народа, который находится в Иерусалиме
  rationale: В еврейском относительное местоимение не маркирует число и род, поэтому оборот допускает отнесение к правителям либо к народу. Компактная русская конструкция оставляет эту связь открытой.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Частица «вы» ясно оформляет прямое обличительное обращение, а восклицательный знак передаёт силу повелительного призыва. Маркер [a] помещён непосредственно после слова, к которому относится примечание.
