  text: ה֗וֹי עֲטֶ֤רֶת גֵּאוּת֙ שִׁכֹּרֵ֣י אֶפְרַ֔יִם וְ/צִ֥יץ נֹבֵ֖ל צְבִ֣י תִפְאַרְתּ֑/וֹ אֲשֶׁ֛ר עַל רֹ֥אשׁ גֵּֽיא שְׁמָנִ֖ים הֲל֥וּמֵי יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/001.yaml
  text: Woe to the proud crown of the drunkards of Ephraim[a], and to the fading flower of his glorious beauty, which is on the head of the fertile valley[c][b], those overcome by wine.
translation:
  language: ru
  text: Горе горделивому венцу пьяниц Ефрема[a] и увядающему цветку его блистательной красоты, что находится на вершине плодородной долины тех, кого сразило вино[c][b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «венцу гордости… и увядающему цветку его блистательной красоты». Еврейская поэтическая строка допускает несколько способов выразить взаимосвязанные образы одного и того же предмета.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «долину тучностей», то есть долину с богатой, плодородной землёй.'
    reason: cultural_note
  - marker: c
    text: 'Или: «тех, кого одолело вино». Еврейское выражение буквально рисует людей поражёнными, словно сбитыми ударом вина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Передаёт пророческое восклицание, одновременно выражающее скорбь и возвещающее суд.
- source_word: עֲטֶרֶת גֵּאוּת
  choice: горделивому венцу
  rationale: Сохраняет образ «венца гордости», а определение «горделивый» естественно звучит по-русски и передаёт оттенок высокомерия.
- source_word: שִׁכֹּרֵי אֶפְרַיִם
  choice: пьяниц Ефрема
  rationale: Передаёт принадлежность названной группы Ефрему и сохраняет резкое обличительное обозначение.
- source_word: וְצִיץ נֹבֵל
  choice: и увядающему цветку
  rationale: Сохраняет параллельный поэтический образ и значение причастия «увядающий, вянущий».
- source_word: צְבִי תִפְאַרְתּוֹ
  choice: его блистательной красоты
  rationale: Естественно передаёт сочетание понятий красоты, великолепия и славы; местоимение мужского рода соотнесено с Ефремом как собирательным образом.
- source_word: אֲשֶׁר עַל רֹאשׁ גֵּיא שְׁמָנִים
  choice: что венчает плодородную долину
  rationale: Глагольная формулировка естественно воспроизводит пространственный образ предмета, находящегося «на голове/вершине» долины, а «плодородная» передаёт идиому «долина тучностей».
- source_word: הֲלוּמֵי יָיִן
  choice: тем, кого сразило вино
  rationale: Сохраняет яркий образ людей, буквально поражённых или сбитых вином, и ясно связывает заключительную характеристику с пьяницами Ефрема.
theological_decisions:
- issue: Соотнесение заключительной фразы הֲלוּמֵי יָיִן
  choice: 'Она отнесена к пьяницам Ефрема: «тем, кого сразило вино»'
  alternative: Связать её с ближайшим образом плодородной долины либо передать отдельной бессвязной фразой
  rationale: Форма множественного числа обозначает людей и естественно возвращает читателя к «пьяницам Ефрема»; при этом образная напряжённость еврейской строки сохраняется.
translation_notes:
  register: Современный литературный русский язык с возвышенной пророческой интонацией. Метафоры венца, увядающего цветка и поражения вином сохранены; синтаксис слегка упорядочен ради ясности без устранения поэтической многозначности.
