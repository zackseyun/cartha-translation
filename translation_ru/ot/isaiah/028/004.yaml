base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/004.yaml
  text: 'And the fading flower of his glorious beauty[a], which is on the head of the fertile valley, will be like an early fig before summer: whoever sees it, while it is still in his palm[b], swallows it down.'
translation:
  language: ru
  text: 'И увядающий цветок его великолепной красы[a], что на вершине плодородной долины[b], станет как ранняя смоква перед летом: кто увидит её, тот проглотит её, пока она ещё у него на ладони.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увядающий цветок красоты его великолепия». Два близких по смыслу еврейских слова усиливают образ красоты и славы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на голове долины тучностей», то есть на вершине богатой, плодородной долины.'
    reason: cultural_note
lexical_decisions:
- source_word: צִיצַת נֹבֵל
  choice: увядающий цветок
  rationale: Передаёт образ цветка и причастное значение נֹבֵל («увядающий») естественным современным русским языком.
- source_word: צְבִי תִפְאַרְתּוֹ
  choice: его великолепной красы
  rationale: Сохраняет притяжательный суффикс и усиленное сочетание слов со значениями красоты, великолепия и славы; «краса» уместна в dignified литературном регистре и поддерживает образ цветка.
- source_word: עַל רֹאשׁ גֵּיא שְׁמָנִים
  choice: возвышается над плодородной долиной
  rationale: רֹאשׁ буквально означает «голова, вершина»; в данном образе выражение указывает на заметное положение над долиной. Глагол «возвышается» естественно передаёт пространственный смысл, не устраняя метафоры полностью.
- source_word: גֵּיא שְׁמָנִים
  choice: плодородная долина
  rationale: Буквально «долина тучностей/изобилия»; по смыслу это богатая, плодородная долина.
- source_word: כְּבִכּוּרָהּ בְּטֶרֶם קַיִץ
  choice: как ранняя смоква перед летом
  rationale: בִּכּוּרָה обозначает первый созревший плод и в данном сельскохозяйственном образе обычно понимается как ранняя смоква; «перед летом» близко передаёт временную конструкцию.
- source_word: אֲשֶׁר יִרְאֶה הָרֹאֶה אוֹתָהּ
  choice: кто увидит её
  rationale: Естественно передаёт еврейскую конструкцию с повтором корня «видеть», выражающую непосредственность восприятия.
- source_word: בְּעוֹדָהּ בְּכַפּוֹ
  choice: едва она окажется у него на ладони
  rationale: כַּף точно передано как «ладонь»; формулировка подчёркивает немедленность действия, хотя буквально сказано «пока она ещё на его ладони».
- source_word: יִבְלָעֶנָּה
  choice: проглотит её
  rationale: Прямо передаёт значение בלע — «глотать, поглощать» — и сохраняет образ быстрого поедания.
