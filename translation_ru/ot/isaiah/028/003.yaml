  yaml_path: translation/ot/isaiah/028/003.yaml
  text: The proud crown of the drunkards of Ephraim will be trampled underfoot[a].
translation:
  language: ru
  text: Ногами будет растоптан венец гордости пьяниц Ефрема.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרַגְלַיִם
  choice: ногами
  rationale: Инструментальное значение предлога בְּ с двойственным числом «ноги» передано прямо; образ попирания ногами сохранён.
- source_word: תֵּרָמַסְנָה
  choice: будет растоптан
  rationale: Нифаль от רמס выражает страдательное действие — попирание, втаптывание. «Будет растоптан» ясно и естественно передаёт будущий результат.
- source_word: עֲטֶרֶת
  choice: венец
  rationale: Слово может обозначать венец, корону или венок. «Венец» сохраняет поэтический образ и хорошо сочетается с метафорой гордости.
- source_word: גֵּאוּת
  choice: гордости
  rationale: Сохранена именная конструкция исходного текста — «венец гордости», без сведения её к одному лишь качественному прилагательному.
- source_word: שִׁכּוֹרֵי
  choice: пьяниц
  rationale: Форма характеризует группу людей их постоянным или показательным пьянством; существительное «пьяницы» передаёт это кратко и понятно.
- source_word: אֶפְרָיִם
  choice: Ефрема
  rationale: Сохранено собственное имя, которое в контексте обозначает северное царство и его жителей.
theological_decisions:
- issue: Связь слов в выражении עֲטֶרֶת גֵּאוּת
  choice: венец гордости
  alternative: гордый венец
  rationale: Родительная конструкция точнее сохраняет образ и смысловую напряжённость еврейского выражения; речь может идти как о венце, которым гордятся, так и о гордости, уподобленной венцу.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и поэтической инверсии исходного стиха. Начальная позиция слова «Ногами» воспроизводит смысловое выделение בְּרַגְלַיִם.
