  terminology: Яхве последовательно передаёт тетраграмматон. «Воинств» точно отражает צְבָאוֹת и предпочтительнее, чем «Сил», поскольку последнее сужает образ. «Узы» удачно сохраняет метафору מוֹסְרִים. Для כָּלָה следует избегать специфически антропологического оттенка «истребления».
