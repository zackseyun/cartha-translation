  text: וְ/עַתָּה֙ אַל תִּתְלוֹצָ֔צוּ פֶּֽן יֶחְזְק֖וּ מֽוֹסְרֵי/כֶ֑ם כִּֽי כָלָ֨ה וְ/נֶחֱרָצָ֜ה שָׁמַ֗עְתִּי מֵ/אֵ֨ת אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת עַל כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/022.yaml
  text: So now[a], do not scoff, lest your bonds be made stronger[b]; for I have heard from the Lord GOD of Armies a complete destruction decreed against the whole land.
translation:
  language: ru
  text: Итак, не насмехайтесь, иначе ваши узы станут крепче; ибо я услышал от Владыки Яхве Воинств[a] о полном, уже определённом уничтожении всей земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Владыки Яхве Сил»; традиционно: «Господа Саваофа». Еврейское слово может обозначать воинства, включая небесные силы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всей земле», то есть всему миру. Еврейское слово может означать как страну или край, так и всю землю.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт и связь с предшествующим предупреждением, и настоятельный переход к выводу; отдельное «теперь» по-русски здесь необязательно.
- source_word: תִּתְלוֹצָצוּ
  choice: насмехайтесь
  rationale: Глагол לוץ обозначает презрительную, дерзкую насмешку; современное «насмехаться» сохраняет обличительный тон.
- source_word: פֶּן יֶחְזְקוּ מוֹסְרֵיכֶם
  choice: чтобы ваши узы не стали крепче
  rationale: Конструкция פן выражает предостережение о нежелательном результате, а מוֹסֵר сохраняет конкретный образ связывающих уз; узы являются подлежащим глагола חזק.
- source_word: כָלָה וְנֶחֱרָצָה
  choice: определено полное истребление
  rationale: כָלָה в контексте суда указывает на всеобъемлющий конец или истребление, а нифаль נֶחֱרָצָה — на твёрдо принятое решение; формулировка передаёт оба компонента без усиления до обязательного значения абсолютного уничтожения.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: Владыка Яхве Воинств
  rationale: «Владыка» различает אֲדֹנָי и личное имя יהוה, переданное как «Яхве»; «Воинств» сохраняет военный и небесно-царственный диапазон צְבָאוֹת без архаического «Саваоф».
- source_word: עַל כָּל הָאָרֶץ
  choice: всей земле
  rationale: עַל при объявленном суде передано русским дательным в конструкции «земле определено», а הָאָרֶץ оставлено как «земля», допускающая в контексте как страну, так и весь мир.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Выбор сохраняет оба элемента титула и передаёт тетраграмматон личным именем, не создавая неестественного повтора «Господь Господь».
- issue: Объём значения הָאָרֶץ
  choice: земля в значении страны/края
  alternative: вся земля, то есть весь мир
  rationale: Ближайший контекст суда над Иудеей и Иерусалимом поддерживает локальное понимание, но еврейское слово допускает и всемирный смысл; эта неоднозначность сохранена в примечании.
- issue: Характер объявленного суда в כָלָה וְנֶחֱרָצָה
  choice: полное истребление, твёрдо определённое
  alternative: предрешённый конец; окончательное уничтожение
  rationale: Перевод сохраняет тяжесть и окончательность пророческого суда, не уточняя сверх текста, означает ли он абсолютное истребление людей или полное опустошение земли.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сделан естественным для устного и письменного чтения; конкретный образ уз сохранён, а архаизм «Саваоф» вынесен в примечание.
