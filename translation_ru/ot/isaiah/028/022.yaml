  source_fidelity: 'Смысл предостережения, образ уз и объявление о решённом всеобъемлющем суде переданы в целом верно. Однако «полное истребление» несколько уже и сильнее, чем כָּלָה: слово может означать полный конец/разорение, не обязательно истребление людей. Связку כָלָה וְנֶחֱרָצָה лучше передать как «полное, уже определённое уничтожение/разорение».'
