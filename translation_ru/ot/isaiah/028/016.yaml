source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י יִסַּ֥ד בְּ/צִיּ֖וֹן אָ֑בֶן אֶ֣בֶן בֹּ֜חַן פִּנַּ֤ת יִקְרַת֙ מוּסָ֣ד מוּסָּ֔ד הַֽ/מַּאֲמִ֖ין לֹ֥א יָחִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am laying in Zion a stone, a tested stone, a precious cornerstone, a sure foundation[c][b]; the one who believes will not be in haste.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка ГОСПОДЬ: «Вот, Я полагаю на Сионе камень — камень испытанный, драгоценный краеугольный камень, прочно заложенное основание[c]. Тот, кто верит[a], не будет спешить[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверяет», «полагается». Еврейское слово выражает не только убеждённость, но и доверительное упование.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будет торопиться»; по смыслу также возможно: «не впадёт в панику».'
    reason: lexical_alternative
  - marker: c
    text: Этот образ камня в Новом Завете отнесён к Христу (Рим. 9:33; 1 Пет. 2:6).
    reason: cross_reference
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: 'Сочетание передаёт оба божественных титула без неестественного повтора «Господь ГОСПОДЬ»: אֲדֹנָי — «Владыка», а имя יהוה по принятой русской библейской традиции — «ГОСПОДЬ».'
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» сохраняет указательную и торжественно-пророческую силу еврейской формы и естественно звучит по-русски.
- source_word: יִסַּד
  choice: полагаю
  rationale: В контексте это торжественное заявление Бога об установлении или закладке камня. «Полагаю» сохраняет архитектурный образ и оттенок совершаемого действия.
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: Русское «на Сионе» естественно обозначает гору и традиционное место Божьего действия; предлог ב допускает такое локативное значение.
- source_word: אֶבֶן בֹּחַן
  choice: камень испытанный
  rationale: Передаёт камень, прошедший проверку и доказавший надёжность, не устраняя возможного оттенка «пробного/проверочного камня».
- source_word: פִּנַּת יִקְרַת
  choice: драгоценный краеугольный камень
  rationale: Сохраняет архитектурную функцию פִּנָּה и значение ценности, достоинства или редкости у יְקָרָה.
- source_word: מוּסָד מוּסָּד
  choice: прочно заложенное основание
  rationale: Еврейское созвучное усиление трудно воспроизвести буквально; формулировка передаёт мысль о надёжно учреждённом, устойчивом основании.
- source_word: הַמַּאֲמִין
  choice: верующий
  rationale: Причастие от אמן обозначает человека, который верит и доверяется. Краткая субстантивированная форма естественна в русском и сохраняет связь с последующим библейским употреблением.
- source_word: לֹא יָחִישׁ
  choice: не станет спешить
  rationale: Буквально сохраняет основное значение глагола — торопиться, действовать поспешно, — не усиливая его до более толковательного «не впадёт в панику».
theological_decisions:
- issue: Отнесение образа камня к Мессии
  choice: В основном тексте сохранён архитектурный образ без прямого называния Мессии.
  alternative: Передать как прямое пророческое именование Мессии или Христа.
  rationale: Еврейский текст говорит о закладываемом Богом камне на Сионе, не называя его прямо Мессией. Новозаветное мессианское применение важно для канонического прочтения, но не должно подменять формулировку исходного текста.
- issue: Значение הַמַּאֲמִין
  choice: верующий
  alternative: доверяющий; тот, кто полагается
  rationale: Корень אמן охватывает веру и доверительное упование. Основной вариант краток и традиционно узнаваем, а оттенок доверия отмечен в сноске.
- issue: Значение לֹא יָחִישׁ
  choice: не станет спешить
  alternative: не будет торопиться; не впадёт в панику
  rationale: Основной текст сохраняет лексическую сдержанность еврейского глагола и не превращает подразумеваемое спокойствие веры в явно названную панику.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис ясен для обычного читателя; сохранены повтор слова «камень», архитектурная метафора и смысловая напряжённость между верой, доверием и отсутствием поспешности.
