base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/028.yaml
  text: Bread grain is crushed[a], but not forever does one keep threshing it; though the wheel of his cart and his horses rumble over it[b], he does not crush it fine.
translation:
  language: ru
  text: Хлебное зерно дробят[a], но не молотят его бесконечно. Хотя он с грохотом гонит по нему колесо своей телеги и коней[b], он не растирает его в порошок.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зерно для хлеба дробят». Еврейское слово לֶחֶם («хлеб») здесь обозначает зерно, из которого делают хлеб.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всадников». Еврейское слово в некоторых контекстах обозначает всадников, но к земледельческому образу здесь лучше подходят кони.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: хлебное зерно
  rationale: Обычно слово означает «хлеб», но в данном земледельческом контексте оно метонимически обозначает зерно, предназначенное для выпечки хлеба.
- source_word: יוּדָק
  choice: дробят
  rationale: Глагол от דקק передаёт измельчение или раздробление; «дробят» сохраняет связь с заключительным глаголом того же корня.
- source_word: כִּי
  choice: но
  rationale: 'Здесь союз вводит поясняющее противопоставление: зерно дробят, однако молотьба не продолжается без конца.'
- source_word: לֹא לָנֶצַח
  choice: не … бесконечно
  rationale: Буквальное значение — «не навечно»; в контексте речь о том, что процесс не продолжают без конца.
- source_word: אָדוֹשׁ יְדוּשֶׁנּוּ
  choice: не молотят его
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает или подчёркивает действие. Вместе с לֹא לָנֶצַח естественный русский оборот «не молотят … бесконечно» передаёт длительность и обобщённого деятеля.
- source_word: וְהָמַם
  choice: с грохотом проводят по нему
  rationale: Глагол может выражать шумное движение, приведение в смятение или сильное воздействие. Здесь земледельческий образ указывает на грохот и движение молотильной повозки; перевод не приписывает зерну психологическое «смятение».
- source_word: גִּלְגַּל עֶגְלָתוֹ
  choice: колесом телеги
  rationale: Сочетание буквально обозначает колесо его телеги или повозки. В русском обобщённая конструкция допускает опустить притяжательное местоимение без утраты смысла.
- source_word: וּפָרָשָׁיו
  choice: конями
  rationale: פָרָשׁ нередко означает всадника, но может относиться к лошади. В образе молотьбы рядом с телегой «кони» дают наиболее связный смысл; лексическая неоднозначность отмечена в сноске.
- source_word: לֹא יְדֻקֶּנּוּ
  choice: его не размалывают в порошок
  rationale: 'Повтор корня דקק возвращает к начальному «дробят», но отрицание обозначает предел обработки: зерно не превращают в мелкую пыль. «В порошок» ясно передаёт подразумеваемую крайнюю степень измельчения.'
