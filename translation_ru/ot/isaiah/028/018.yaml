  text: וְ/כֻפַּ֤ר בְּרִֽיתְ/כֶם֙ אֶת מָ֔וֶת וְ/חָזוּתְ/כֶ֥ם אֶת שְׁא֖וֹל לֹ֣א תָק֑וּם שׁ֤וֹט שׁוֹטֵף֙ כִּ֣י יַֽעֲבֹ֔ר וִ/הְיִ֥יתֶם ל֖/וֹ לְ/מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/018.yaml
  text: And your covenant with death will be annulled[a], and your agreement with Sheol will not stand; when the overwhelming scourge passes through[b], you will become a trampling place for it.
translation:
  language: ru
  text: И будет расторгнут ваш завет со Смертью, и не устоит ваше соглашение со Шеолом[a]. Когда пройдёт сметающий бич[b], вы станете тем, что он будет попирать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Шеол — еврейское название мира мёртвых; возможный перевод: «могила».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально выражение соединяет образ бича с неудержимой, подобной наводнению силой; возможно: «захлёстывающий бич».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻפַּר
  choice: будет расторгнут
  rationale: В сочетании с בְּרִית пассивная форма выражает отмену или утрату силы договора. «Расторгнут» естественно передаёт юридический смысл, не привнося сюда жертвенно-искупительной терминологии.
- source_word: בְּרִיתְכֶם
  choice: ваш завет
  rationale: «Завет» сохраняет формальный характер בְּרִית и иронический образ союза со Смертью.
- source_word: אֶת־מָוֶת
  choice: со Смертью
  rationale: В данном обороте אֵת указывает на другую сторону завета. Прописная буква подчёркивает присутствующее в еврейском тексте олицетворение.
- source_word: חָזוּתְכֶם
  choice: ваше соглашение
  rationale: В параллели с «заветом» слово обозначает договорённость, а не видение. «Соглашение» ясно и естественно передаёт контекстуальный смысл.
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Транслитерация сохраняет более широкое представление о мире мёртвых и параллелизм с олицетворённой Смертью; пояснение дано в сноске.
- source_word: לֹא תָקוּם
  choice: не устоит
  rationale: О соглашении קום означает, что оно не сохранит силы и не окажется действительным. «Не устоит» сохраняет образность оригинала.
- source_word: שׁוֹט שׁוֹטֵף
  choice: всесокрушающий бич
  rationale: Сочетание соединяет образ бича с неудержимым, разливающимся и сметающим движением. Основной вариант передаёт силу образа естественным русским выражением, а более буквальная сторона пояснена в сноске.
- source_word: יַעֲבֹר
  choice: пройдёт
  rationale: Глагол описывает прохождение карающей силы через землю или народ; «пройдёт» не создаёт нежелательного смысла пощады.
- source_word: וִהְיִיתֶם לוֹ לְמִרְמָס
  choice: вы станете местом, которое он топчет
  rationale: Формулировка сохраняет предметный образ מִרְמָס и ясно выражает, что люди окажутся попираемы этим бичом.
theological_decisions:
- issue: Олицетворение Смерти и Шеола
  choice: Сохранить Смерть и Шеол как олицетворённые силы.
  alternative: 'Передать менее образно: «смерть» и «могила».'
  rationale: Так сохраняется насмешливая риторика пророчества о мнимой безопасности Иудеи без добавления утверждений о природе этих сил.
- issue: Передача שְׁאוֹל
  choice: Транслитерировать как «Шеол» и пояснить в сноске.
  alternative: «могила» или «мир мёртвых».
  rationale: «Могила» неоправданно сужает значение, тогда как «мир мёртвых» устраняет краткость и имяобразный характер параллели.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сохраняет параллелизм двух договорных формул и последовательность образов оригинала; редкий термин «Шеол» пояснён сноской.
