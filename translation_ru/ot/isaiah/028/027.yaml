translation_notes:
  register: Современный литературный русский с конкретной земледельческой лексикой. Сохранены параллелизм двух растений и контраст между тяжёлыми молотильными орудиями и более бережным выбиванием семян. Маркеры [a] и [b] помещены непосредственно после соответствующих названий растений.
