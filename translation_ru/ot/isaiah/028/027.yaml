source:
  edition: WLC
  text: כִּ֣י לֹ֤א בֶֽ/חָרוּץ֙ י֣וּדַשׁ קֶ֔צַח וְ/אוֹפַ֣ן עֲגָלָ֔ה עַל כַּמֹּ֖ן יוּסָּ֑ב כִּ֧י בַ/מַּטֶּ֛ה יֵחָ֥בֶט קֶ֖צַח וְ/כַמֹּ֥ן בַּ/שָּֽׁבֶט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/027.yaml
  text: For black cumin is not threshed with a sledge[a], nor is a cart wheel rolled over cumin; rather, black cumin is beaten out with a staff[b], and cumin with a rod.
translation:
  language: ru
  text: Ведь чернушку[a] не молотят молотильной доской и колесо телеги не прокатывают по кумину[b]; чернушку выбивают палкой, а кумин — прутом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. ке́цах: вероятнее всего, чернушка посевная (Nigella sativa); возможны и другие отождествления, например укроп.'
    reason: lexical_alternative
  - marker: b
    text: 'Евр. каммо́н: обычно кумин (зира); возможно также отождествление с тмином.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרוּץ
  choice: молотильная доска
  rationale: В земледельческом контексте обозначает снабжённое острыми элементами орудие для молотьбы. «Молотильная доска» — понятное и конкретное русское название.
- source_word: יוּדַשׁ
  choice: не молотят
  rationale: Хофал глагола דוש означает подвергать молотьбе; русская неопределённо-личная конструкция естественно передаёт пассивное значение.
- source_word: קֶצַח
  choice: чернушка
  rationale: Растение обычно отождествляют с Nigella sativa, по-русски «чернушка посевная». Краткое «чернушка» естественно в контексте; неопределённость идентификации отмечена в сноске.
- source_word: אוֹפַן עֲגָלָה
  choice: колесо телеги
  rationale: Буквально «колесо повозки/телеги»; выбран конкретный и естественный современный оборот.
- source_word: יוּסָּב
  choice: не прокатывают по
  rationale: Каузативно-пассивная форма от סבב описывает движение колеса по семенам; «прокатывают по» ясно передаёт сельскохозяйственное действие.
- source_word: כַּמֹּן
  choice: кумин
  rationale: Обычное ботаническое отождествление — Cuminum cyminum. «Кумин» в современном русском точнее, чем потенциально двусмысленное «тмин»; альтернативная идентификация отмечена в сноске.
- source_word: מַטֶּה
  choice: палка
  rationale: Здесь это деревянное орудие для выбивания семян. «Палка» передаёт практический земледельческий смысл и сохраняет отличие от שׁבט.
- source_word: יֵחָבֶט
  choice: выбивают
  rationale: Глагол חבט означает ударами извлекать или вытряхивать урожай; «выбивают» кратко выражает и действие, и его результат.
- source_word: שָּׁבֶט
  choice: прут
  rationale: В данном контексте обозначает более лёгкое орудие для ударов. «Прут» сохраняет параллелизм и различие с מַטֶּה («палка»).
- source_word: כִּי ... כִּי
  choice: ведь ... [бессоюзное противопоставление после точки с запятой]
  rationale: Первое כִּי вводит объяснение. Второе указывает на противопоставленный надлежащий способ обработки; в русском оно естественно выражено точкой с запятой без повторения причинного союза.
