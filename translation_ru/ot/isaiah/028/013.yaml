source:
  edition: WLC
  text: וְ/הָיָ֨ה לָ/הֶ֜ם דְּבַר יְהוָ֗ה צַ֣ו לָ/צָ֞ו צַ֤ו לָ/צָו֙ קַ֤ו לָ/קָו֙ קַ֣ו לָ/קָ֔ו זְעֵ֥יר שָׁ֖ם זְעֵ֣יר שָׁ֑ם לְמַ֨עַן יֵלְכ֜וּ וְ/כָשְׁל֤וּ אָחוֹר֙ וְ/נִשְׁבָּ֔רוּ וְ/נוֹקְשׁ֖וּ וְ/נִלְכָּֽדוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/013.yaml
  text: So the word of Yahweh will be to them[a], “Order on order, order on order, line on line, line on line, a little here, a little there,” so that they may go, and stumble backward, and be broken, and snared, and captured.
translation:
  language: ru
  text: 'И станет для них слово Яхве: «Приказ за приказом, приказ за приказом, строка за строкой, строка за строкой, немного здесь, немного там»[a], — чтобы они пошли, споткнулись, пятясь назад, разбились, попались в западню и были схвачены.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заповедь за заповедью, заповедь за заповедью; мерная линия за мерной линией, мерная линия за мерной линией». Еврейская фраза предельно кратка, трудна для толкования и, вероятно, воспроизводит насмешливую или детскую скороговорку.'
    reason: Лексические варианты и неясная стилистическая функция повторов.
lexical_decisions:
- source_word: וְהָיָה לָהֶם
  choice: И станет для них
  rationale: Форма היה с союзом вводит итог происходящего; «станет для них» сохраняет и будущую направленность, и оттенок наступившего результата.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: «Слово» сохраняет устойчивый пророческий оборот, а имя יהוה передано транслитерацией «Яхве», а не заменено титулом.
- source_word: צַו לָצָו צַו לָצָו
  choice: приказ за приказом, приказ за приказом
  rationale: «Приказ» передаёт вероятную связь с צוה и сохраняет рубленое, насмешливо-повторное звучание трудной еврейской фразы.
- source_word: קַו לָקָו קַו לָקָו
  choice: строка за строкой, строка за строкой
  rationale: קו буквально может означать мерную линию; «строка» естественно звучит по-русски и сохраняет образ линии и краткую повторяемость, не превращая его в абстрактное «правило».
- source_word: זְעֵיר שָׁם זְעֵיר שָׁם
  choice: немного здесь, немного там
  rationale: Идиоматическая распределительная передача сохраняет смысл малых разрозненных порций и ритм повторения.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Союз сохраняет присущую контексту напряжённость между целью и результатом, не разрешая её пояснительной вставкой.
- source_word: יֵלְכוּ וְכָשְׁלוּ אָחוֹר
  choice: они пошли, споткнулись, попятившись назад
  rationale: «Пошли» передаёт הלך, а сочетание «споткнулись, попятившись назад» сохраняет и образ преткновения, и направленность אָחוֹר.
- source_word: וְנִשְׁבָּרוּ וְנוֹקְשׁוּ וְנִלְכָּדוּ
  choice: разбились, попались в западню и были схвачены
  rationale: 'Последовательность сохраняет нарастание: крушение, попадание в ловушку и окончательный захват; формы страдательного значения переданы естественными русскими конструкциями.'
theological_decisions:
- issue: Целевое или результативное значение לְמַעַן в заключительной части
  choice: «чтобы они…»
  alternative: «так что они…»
  rationale: «Чтобы» формально сохраняет конструкцию цели и её судебную остроту, но не добавляет объяснения о причинности и не устраняет возможный оттенок результата.
- issue: Статус повторяющейся речи как слова Яхве и орудия суда
  choice: Повторная формула прямо названа тем, чем для них станет слово Яхве, после чего следует судебное последствие
  alternative: Понимать формулу только как насмешливое воспроизведение слушателями пророческой речи
  rationale: Синтаксис связывает формулу со «словом Яхве», а לְמַעַן и цепь глаголов указывают на суд; перевод при этом сохраняет насмешливую или детскую окраску самой формулы и не уточняет, чей именно голос она имитирует.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Рубленая повторная формула намеренно сохранена. Архаизмы вроде «предписание на предписание» в основном тексте избегаются; неоднозначность ключевой фразы вынесена в примечание. Маркер [a] стоит непосредственно после цитируемой формулы.
