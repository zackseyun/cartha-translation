  text: and a spirit of justice to the one who sits in judgment[c][b][a], and strength to those who turn back the battle at the gate.
translation:
  language: ru
  text: и духом правосудия — для того, кто вершит суд[a], и силой — для тех, кто отражает натиск у ворот[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для сидящего на суде»; возможно также: «для сидящего на судейском месте».'
