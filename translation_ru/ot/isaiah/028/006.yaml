  - marker: b
    text: 'Или: «для тех, кто отражает битву (или войну) у ворот».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְרוּחַ מִשְׁפָּט
  choice: и духом правосудия
  rationale: 'Предложный оборот продолжает сказуемое предыдущего стиха: Господь будет «духом правосудия». «Правосудие» естественно передаёт здесь способность выносить справедливый судебный приговор и сохраняет связь с последующим הַמִּשְׁפָּט.'
- source_word: לַיֹּשֵׁב עַל הַמִּשְׁפָּט
  choice: для того, кто вершит суд
  rationale: Причастие יֹשֵׁב буквально означает «сидящий», однако весь оборот идиоматически описывает человека, исполняющего судебные обязанности. Перевод передаёт функцию без ненужного уточнения должности.
- source_word: וְלִגְבוּרָה
  choice: и силой
  rationale: גְּבוּרָה означает силу, мощь или доблесть; в параллельной конструкции и военном контексте нейтральное «сила» звучит естественно.
- source_word: מְשִׁיבֵי מִלְחָמָה
  choice: для тех, кто отражает натиск
  rationale: Причастие от שוב выражает каузативную идею обращения вспять. В данном военном контексте речь идёт о защитниках, заставляющих вражеский натиск отступить; «отражает натиск» естественно передаёт этот смысл.
- source_word: שָׁעְרָה
  choice: у ворот
  rationale: Форма с направительным окончанием буквально допускает движение «к воротам», но в контексте обороны обозначает место столкновения у городских ворот.
theological_decisions:
- issue: Связь стиха с подлежащим предыдущего стиха
  choice: 'Сохранить эллиптическое продолжение: Господь будет духом правосудия и силой.'
  alternative: Понять выражения как безличное указание на дары, которые Господь даёт судьям и защитникам.
  rationale: Еврейские предложные обороты синтаксически зависят от предыдущего стиха. Творительный падеж сохраняет эту связь, не добавляя в сам стих повторного называния Господа.
- issue: Значение מְשִׁיבֵי מִלְחָמָה
  choice: Защитники отражают вражеский натиск у ворот.
  alternative: Воины обращают сражение к воротам, то есть переходят в контратаку.
  rationale: Конструкция допускает некоторую образную неоднозначность, но обычное понимание каузативного שוב здесь — заставить битву или неприятеля отступить. Альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Эллиптическая связь с предыдущим стихом сохранена; «вершит суд» и «отражает натиск» передают еврейские обороты естественно, а буквальные варианты вынесены в сноски.
