  yaml_path: translation/ot/isaiah/028/017.yaml
  text: And I will make justice the measuring line[a], and righteousness the plumb line; hail will sweep away the refuge of lies[c][b], and waters will flood the shelter.
translation:
  language: ru
  text: Я сделаю правосудие[a] мерным шнуром, а праведность — отвесом[b]. Град сметёт убежище лжи, и воды затопят укрытие[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: суд.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может обозначать отвесный груз, которым проверяют вертикальность.
    reason: lexical_alternative
  - marker: c
    text: 'Или: тайное место; еврейское слово обозначает место, где скрываются или находят защиту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: И сделаю Я
  rationale: שׂוּם означает «положить, установить, сделать». В сочетании с двумя образами строительных мер естественное русское «сделаю» передаёт установление Богом нормы; местоимение «Я» выражает заложенное в глагольной форме подлежащее и подчёркивает смену говорящего.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: Здесь מִשְׁפָּט обозначает справедливый суд и установленный Богом справедливый порядок. «Правосудие» сохраняет судебный оттенок и не сливается с последующим «праведность».
- source_word: לְקָו
  choice: мерным шнуром
  rationale: קָו — шнур или линия, применяемые при разметке. «Мерный шнур» ясно передаёт строительный образ и естественно звучит по-русски.
- source_word: וּצְדָקָה
  choice: а праведность
  rationale: צְדָקָה передаёт нравственную правоту и верность должной норме. «Праведность» сохраняет отличие от מִשְׁפָּט; союз «а» естественно оформляет русский поэтический параллелизм без значения противопоставления.
- source_word: לְמִשְׁקָלֶת
  choice: отвесом
  rationale: מִשְׁקָלֶת обозначает отвесный груз или приспособление для проверки вертикали. «Отвес» — краткий и понятный современный строительный термин.
- source_word: וְיָעָה
  choice: сметёт
  rationale: יעה выражает действие сметания или удаления. При подлежащем «град» глагол «сметёт» живо и естественно передаёт разрушительную силу образа.
- source_word: מַחְסֵה כָזָב
  choice: убежище лжи
  rationale: Сочетание буквально представляет ложь как основание или природу убежища. Такая передача сохраняет связь с ложной безопасностью, названной в ближайшем контексте.
- source_word: וְסֵתֶר
  choice: и … укрытие
  rationale: סֵתֶר — скрытое место, служащее для сокрытия или защиты. «Укрытие» соответствует контексту бури и сохраняет параллель с «убежищем».
- source_word: מַיִם יִשְׁטֹפוּ
  choice: воды затопят
  rationale: Множественное מַיִם сохранено словом «воды», а שׁטף передаёт наводнение, переполнение или смывание. «Затопят» прямо выражает поглощение укрытия нахлынувшей водой.
theological_decisions:
- issue: Передача пары מִשְׁפָּט / צְדָקָה
  choice: правосудие / праведность
  alternative: суд / справедливость; справедливость / праведность
  rationale: Разные русские слова сохраняют напряжение между Божьим справедливым судебным порядком и нравственной правотой, не сводя оба понятия к одному. Сноска отмечает допустимый более буквальный вариант для первого слова.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксический параллелизм и строительная метафора сохранены; во второй половине стиха использованы ясные, энергичные глаголы. Инверсия «сделаю Я» умеренно возвышает речь и подчёркивает Божье действие, не придавая тексту архаического характера.
