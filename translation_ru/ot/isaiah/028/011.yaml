  yaml_path: translation/ot/isaiah/028/011.yaml
  text: For with mocking lips and with another tongue he will speak to this people[b][a],
translation:
  language: ru
  text: Ибо насмешливыми устами[a] и на чужом языке[b] будет говорить к этому народу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лепечущими» или «запинающимися устами». Еврейское выражение прежде всего связано с насмешкой, но его также понимают как речь, звучащую невнятно или чужеземно.'
    reason: lexical_alternative
  - marker: b
    text: То есть на иностранном языке. Вероятно, образ указывает на Божий суд, совершающийся через чужеземцев; подлежащее глагола в еврейском тексте прямо не названо.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение или основание предшествующего высказывания и сохраняет связь с контекстом.
- source_word: בְּלַעֲגֵי שָׂפָה
  choice: лепечущими устами
  rationale: Фраза допускает понимание как невнятной, запинающейся либо воспринимаемой как насмешливая речи. «Лепечущими устами» естественно передаёт прежде всего её непонятное, чужеземное звучание, не исключая оттенка насмешки.
- source_word: וּבְלָשׁוֹן אַחֶרֶת
  choice: и на чужом языке
  rationale: לָשׁוֹן означает как «язык» в телесном смысле, так и язык речи; здесь сочетание указывает на чужую, иностранную речь. Русское «на чужом языке» звучит естественно и ясно.
- source_word: יְדַבֵּר
  choice: Он будет говорить
  rationale: Имперфект в пророческом контексте уместно передать будущим временем. Заглавное «Он» отражает вероятного подразумеваемого субъекта — Бога, однако это уточняется в примечании из-за отсутствия названного подлежащего в самом стихе.
- source_word: אֶל הָעָם הַזֶּה
  choice: с этим народом
  rationale: Предлог אֶל при глаголе речи допускает русское «говорить с»; עָם точно передаётся словом «народ», а указательное הַזֶּה — словом «этим».
theological_decisions:
- issue: Смысл чужой и невнятной речи
  choice: Основной текст передаёт непонятное чужеземное звучание; примечания сохраняют возможный оттенок насмешки и связь с судом через говорящих на чужом языке.
  alternative: Понимать выражение исключительно как насмешливую речь или исключительно как заикание.
  rationale: Контекст суда и параллельное «на чужом языке» поддерживают образ иностранной речи, звучащей для слушателей невнятно и, возможно, насмешливо. Перевод не должен устранять эту смысловую напряжённость.
- issue: Подразумеваемый субъект глагола
  choice: «Он» понимается как Бог, говорящий посредством чужеземцев.
  alternative: Безличное «будут говорить» или неопределённое «кто-то будет говорить».
  rationale: В контексте наиболее вероятным действующим лицом является Господь, хотя в еврейском тексте данного стиха субъект прямо не назван; примечание сохраняет эту грамматическую особенность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Ибо» сохраняет логическую связь и возвышенный, но понятный регистр; «лепечущими устами» сохраняет образность и неоднозначность еврейского выражения.
