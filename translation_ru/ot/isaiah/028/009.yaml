  yaml_path: translation/ot/isaiah/028/009.yaml
  text: Whom will he teach knowledge[a], and to whom will he explain the message? Those weaned from milk[b], those taken from the breasts?
translation:
  language: ru
  text: Кого он будет учить знанию[a] и кому объяснит весть[b]? Отнятых от молока, отлучённых от груди?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пониманию».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сообщение» или «то, что услышано».'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте не сказано прямо, кто именно будет учить и объяснять; в контексте это может быть насмешливой репликой об Исаии.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹרֶה
  choice: станет учить
  rationale: Порода hифиль глагола ירה означает «учить, наставлять». Форма передаёт риторический вопрос с перспективным оттенком и естественно звучит по-русски.
- source_word: דֵעָה
  choice: знанию
  rationale: Существительное обозначает знание или понимание; «знание» прямо передаёт основное значение и сохраняет параллелизм со второй частью.
- source_word: יָבִין
  choice: объяснит
  rationale: Hифиль глагола בין буквально означает «даст понять»; «объяснит» естественно передаёт каузативный смысл.
- source_word: שְׁמוּעָה
  choice: весть
  rationale: Слово может обозначать услышанное, сообщение, весть или молву. «Весть» сохраняет содержательную широту и уместно в пророческом контексте.
- source_word: גְּמוּלֵי מֵחָלָב
  choice: отнятых от молока
  rationale: Причастная форма от גמל описывает детей, которых отняли от молочного кормления; оборот сохраняет образ и форму риторического вопроса.
- source_word: עַתִּיקֵי מִשָּׁדָיִם
  choice: отлучённых от груди
  rationale: עתק выражает удаление или отделение, а שָׁדַיִם буквально имеет двойственное число «груди». Русское устойчивое выражение «отлучить от груди» естественно передаёт смысл всей фразы.
- source_word: אֶת מִי ... וְאֶת מִי
  choice: Кого ... и кому
  rationale: Повтор вопросительного местоимения образует две параллельные конструкции; разные падежи обусловлены естественным управлением русских глаголов «учить» и «объяснить».
theological_decisions:
- issue: Неуказанный субъект глаголов третьего лица
  choice: Сохранено местоимение «он» без отождествления говорящего или действующего лица.
  alternative: Назвать Исаию либо Господа; или представить весь стих как насмешливую реплику священников и пророков об Исаии.
  rationale: В еврейском тексте субъект прямо не назван. Контекст допускает насмешливое высказывание об Исаии, однако сам стих этого не уточняет, поэтому перевод сохраняет неоднозначность.
- issue: Адресаты риторического вопроса
  choice: 'Младенческий образ сохранён как вопрос: «Отнятых от молока, отлучённых от груди?»'
  alternative: Понять фразы как утвердительное указание на тех, кого следует учить.
  rationale: Пунктуация и контекст поддерживают насмешливый риторический вопрос, но перевод не поясняет сверх текста, кто именно произносит насмешку.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого риторического параллелизма. «Весть» выбрана как dignified, но понятный эквивалент; устойчивое «отлучённых от груди» предпочтено буквальному и неестественному «удалённых от грудей».
