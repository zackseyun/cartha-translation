source:
  edition: WLC
  text: וְ/גַם אֵ֨לֶּה֙ בַּ/יַּ֣יִן שָׁג֔וּ וּ/בַ/שֵּׁכָ֖ר תָּע֑וּ כֹּהֵ֣ן וְ/נָבִיא֩ שָׁג֨וּ בַ/שֵּׁכָ֜ר נִבְלְע֣וּ מִן הַ/יַּ֗יִן תָּעוּ֙ מִן הַ/שֵּׁכָ֔ר שָׁגוּ֙ בָּֽ/רֹאֶ֔ה פָּק֖וּ פְּלִילִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/007.yaml
  text: 'And even these reel with wine and stagger from strong drink: priest and prophet reel with strong drink[a], they are swallowed up by wine, they stagger from strong drink; they reel in vision[b], they totter in judgment.'
translation:
  language: ru
  text: И эти шатаются от вина, сбиваются с ног от хмельного напитка; священник и пророк шатаются от хмельного напитка, поглощены вином, сбиваются с ног от хмельного напитка; ошибаются в видении[a], спотыкаются при суде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шатаются при видении». Еврейское выражение может относиться к пророческому видению, но буквально не уточняет этого.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «спотыкаются, вынося судебное решение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֵלֶּה
  choice: Но и эти
  rationale: Сочетание сохраняет связь с предыдущим контекстом и подчёркивает, что обвинение распространяется также на названную далее группу.
- source_word: בַּיַּיִן
  choice: от вина
  rationale: Предлог בְּ в контексте опьянения естественно передаётся по-русски как указание на причину состояния.
- source_word: שָׁגוּ
  choice: шатаются / ошибаются
  rationale: Глагол допускает как физическое блуждание или шатание, так и ошибку. В начале стиха контекст опьянения требует наглядного «шатаются», а в сочетании с видением уместно смысловое «ошибаются».
- source_word: שֵׁכָר
  choice: хмельной напиток
  rationale: Обозначает опьяняющий напиток, отличный от вина; это современная, понятная и достаточно широкая передача без неоправданного уточнения вида напитка.
- source_word: תָּעוּ
  choice: сбиваются с пути
  rationale: Передаёт буквальный образ блуждания и одновременно сохраняет нравственный и служебный оттенок ошибки, не сводя глагол лишь к физическому пошатыванию.
- source_word: כֹּהֵן וְנָבִיא
  choice: священник и пророк
  rationale: Единственное число имеет собирательный характер и обозначает соответствующие группы религиозных руководителей.
- source_word: נִבְלְעוּ מִן הַיַּיִן
  choice: они поглощены вином
  rationale: Сохранён сильный образ пассивной формы «быть поглощёнными»; он выражает полную власть вина над ними.
- source_word: בָּרֹאֶה
  choice: в видении
  rationale: В контексте пророка רֹאֶה вероятнее всего относится к пророческому видению, однако грамматическая краткость и возможность более общего понимания отмечены в сноске.
- source_word: פָּקוּ
  choice: спотыкаются
  rationale: Глагол выражает неустойчивость и преткновение; русское слово естественно сочетается как с опьянением, так и с ошибочностью служебного решения.
- source_word: פְּלִילִיָּה
  choice: решении
  rationale: Слово относится к вынесению судебного или властного решения; «решение» сохраняет краткость оригинала, а юридическая конкретизация дана в сноске.
theological_decisions:
- issue: Относятся ли заключительные выражения прямо к пророческому видению и судебному решению
  choice: «ошибаются в видении, спотыкаются в решении»
  alternative: «шатаются при видении, спотыкаются при суде»
  rationale: Передача показывает, что опьянение искажает исполнение пророческой и судебной функций, но сноски сохраняют лексическую неоднозначность кратких еврейских выражений.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Повторы сохранены как часть обвинительной риторики оригинала; различие глаголов передано без искусственной монотонности.
