  text: עִמְדִי נָ֤א בַ/חֲבָרַ֨יִ/ךְ֙ וּ/בְ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בַּ/אֲשֶׁ֥ר יָגַ֖עַתְּ מִ/נְּעוּרָ֑יִ/ךְ אוּלַ֛י תּוּכְלִ֥י הוֹעִ֖יל אוּלַ֥י תַּעֲרֽוֹצִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/012.yaml
  text: Stand now with your enchantments and with your many sorceries[a], in which you have labored from your youth; perhaps you may be able to profit[b], perhaps you may inspire terror.
translation:
  language: ru
  text: Стой же со своими заклинаниями и со множеством своих чар, в которых ты трудилась с юности. Может быть, сумеешь извлечь пользу; может быть, внушишь ужас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «может быть, одолеешь»; еврейский глагол может означать наведение ужаса или подавление противника страхом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמְדִי נָא
  choice: Оставайся же
  rationale: Императив женского рода обращён к Вавилону; עמד здесь допускает смысл «продолжай, упорствуй», а частица נָא усиливает ироническое побуждение. «Оставайся же» естественно передаёт продолжение привычной опоры на магию.
- source_word: בַחֲבָרַיִךְ
  choice: со своими заклинаниями
  rationale: חֲבָרִים обозначает магические заговоры или связывающие заклинания. «Заклинания» ясно и современно передаёт оккультный смысл.
- source_word: וּבְרֹב כְּשָׁפַיִךְ
  choice: и множеством своих чар
  rationale: רֹב выражает многочисленность или изобилие, а כְּשָׁפִים — магические действия. «Множество чар» сохраняет количественный и магический оттенки, не перегружая фразу повтором слова «заклинания».
- source_word: בַאֲשֶׁר יָגַעַתְּ
  choice: над которыми ты трудилась
  rationale: יגע означает напряжённо трудиться, утомляться. Предлог «над» естественно связывает труд с многолетним освоением и применением названных магических практик.
- source_word: מִנְּעוּרָיִךְ
  choice: с юности
  rationale: Обычное временное выражение, указывающее на давнюю, устойчивую практику.
- source_word: אוּלַי תּוּכְלִי הוֹעִיל
  choice: Может быть, сумеешь извлечь пользу
  rationale: Сочетание יכל с הועיל означает оказаться способной принести или получить пользу. Формулировка сохраняет неопределённость и ироническую надежду контекста.
- source_word: אוּלַי תַּעֲרוֹצִי
  choice: может быть, внушишь ужас
  rationale: ערץ может означать вызывать страх, ужас или трепет. «Внушишь ужас» сохраняет вероятный каузативный смысл, не сводя его к более общему «одолеешь».
theological_decisions:
- issue: Тон обращения к Вавилону
  choice: Сохранить буквальную форму побуждения, позволяя иронии выявляться из контекста суда
  alternative: Передать как нейтральный искренний совет либо явно добавить насмешку
  rationale: В контексте это насмешливый вызов Вавилону положиться на магию, однако сам стих не называет тон прямо. Перевод не добавляет толкования в основной текст.
- issue: Значение תַּעֲרוֹצִי
  choice: внушишь ужас
  alternative: одолеешь / устоишь
  rationale: Форма допускает понимание как наведение ужаса или подавление противника страхом. Основной текст сохраняет этот более конкретный смысл, а сноска отмечает возможный результативный оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род последовательно сохраняет обращение к Вавилону. Пара «заклинания / чары» передаёт близкие, но не полностью тождественные обозначения магических практик; ирония не разъясняется внутри стиха.
