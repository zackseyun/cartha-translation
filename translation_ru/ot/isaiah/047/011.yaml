  text: וּ/בָ֧א עָלַ֣יִ/ךְ רָעָ֗ה לֹ֤א תֵדְעִי֙ שַׁחְרָ֔/הּ וְ/תִפֹּ֤ל עָלַ֨יִ/ךְ֙ הֹוָ֔ה לֹ֥א תוּכְלִ֖י כַּפְּרָ֑/הּ וְ/תָבֹ֨א עָלַ֧יִ/ךְ פִּתְאֹ֛ם שׁוֹאָ֖ה לֹ֥א תֵדָֽעִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/011.yaml
  text: But evil will come upon you[a]; you will not know how to charm it away. And disaster will fall upon you; you will not be able to atone for it. And ruin will come upon you suddenly[b], which you do not foresee.
translation:
  language: ru
  text: Но придёт на тебя беда — ты не будешь знать, как отвести её чарами.[a] И обрушится на тебя несчастье — ты не сможешь искупить его.[b] Внезапно постигнет тебя опустошение, которого ты не предвидишь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты не узнаешь её рассвета» или «ты не будешь знать, как отвратить её». Еврейский текст этой фразы труден; основной текст учитывает упомянутые рядом чары Вавилона.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ты не сможешь отвратить (устранить) его». Буквально употреблён глагол со значением «покрыть, очистить, искупить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: беда
  rationale: В контексте пророчества о суде слово обозначает губительное бедствие, а не нравственное зло; «беда» естественно сохраняет некоторую широту значения.
- source_word: שַׁחְרָהּ
  choice: как отвести её чарами
  rationale: Форма трудна и допускает разные толкования. Контекст ворожбы и заклинаний Вавилона (ст. 9, 12) поддерживает смысл магического отвращения беды.
- source_word: הֹוָה
  choice: несчастье
  rationale: Передаёт разрушительное бедствие и сохраняет параллелизм, не повторяя «беду».
- source_word: כַּפְּרָהּ
  choice: искупить его
  rationale: Сохраняет связь с корнем כפר («покрывать, очищать, искупать»), хотя в данном контексте речь может идти о невозможности устранить или отвратить несчастье.
- source_word: פִּתְאֹם
  choice: внезапно
  rationale: Прямо и естественно передаёт неожиданность наступления суда.
- source_word: שׁוֹאָה
  choice: разорение
  rationale: Передаёт опустошительное разрушение и уместно по отношению к Вавилону.
- source_word: לֹא תֵדָעִי
  choice: которого ты не предвидишь
  rationale: В заключительной фразе объект знания подразумевается; «не предвидишь» естественно выражает неожиданность бедствия, подчеркнутую словом «внезапно».
theological_decisions:
- issue: Передача כפר в контексте суда
  choice: ты не сможешь искупить его
  alternative: ты не сможешь отвратить / устранить его
  rationale: Основной текст сохраняет значимый лексический оттенок корня כפר, не утверждая при этом, что здесь обязательно имеется в виду культовое искупление; контекст придаёт выражению иронический смысл.
- issue: Неясность שַׁחְרָהּ
  choice: как отвести её чарами
  alternative: её рассвет / как отвратить её
  rationale: Контекст вавилонских чар поддерживает магический оттенок, но подлинная лексическая неясность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Женский род местоимений и глаголов сохранён, поскольку речь обращена к Вавилону, представленному как женщина. Трёхчастный параллелизм еврейского стиха передан тремя самостоятельными предложениями.
