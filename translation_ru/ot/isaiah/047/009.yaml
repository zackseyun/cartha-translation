id: ISA.47.9
reference: Isaiah 47:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/תָבֹאנָה֩ לָּ֨/ךְ שְׁתֵּי אֵ֥לֶּה רֶ֛גַע בְּ/י֥וֹם אֶחָ֖ד שְׁכ֣וֹל וְ/אַלְמֹ֑ן כְּ/תֻמָּ/ם֙ בָּ֣אוּ עָלַ֔יִ/ךְ בְּ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בְּ/עָצְמַ֥ת חֲבָרַ֖יִ/ךְ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/009.yaml
  text: 'But these two things will come to you in a moment[a], in one day: bereavement and widowhood. In full measure they will come upon you[b], in spite of your many sorceries and the great power of your spells.'
translation:
  language: ru
  text: 'Но оба эти бедствия постигнут тебя внезапно[a], в один день: потеря детей и вдовство. Во всей полноте они обрушатся на тебя[b], несмотря на множество твоих колдовств и великую силу твоих заклинаний.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в одно мгновение».'
    reason: Слово רֶגַע означает краткий миг; наречие «внезапно» передаёт его смысл в данном контексте.
  - marker: b
    text: 'Заключительные слова можно понять и так: «из-за множества твоих колдовств и великой силы твоих заклинаний» или «со всеми твоими колдовствами и могущественными заклинаниями».'
    reason: Предлог ב допускает уступительное, причинное либо сопутствующее/инструментальное понимание.
lexical_decisions:
- source_word: וְתָבֹאנָה לָּךְ שְׁתֵּי אֵלֶּה
  choice: оба эти бедствия постигнут тебя
  rationale: Женская форма числительного указывает на две далее названные утраты. «Бедствия» естественно восполняет подразумеваемое существительное, а «постигнут» идиоматично передаёт בוא с дательным дополнением в контексте суда.
- source_word: רֶגַע
  choice: внезапно
  rationale: Слово может обозначать краткий миг или внезапность. Наречие сохраняет мысль о стремительном наступлении бедствий и позволяет отметить альтернативу в сноске.
- source_word: בְּיוֹם אֶחָד
  choice: в один день
  rationale: Прямо передаёт сжатость и одновременность предсказанного суда.
- source_word: שְׁכוֹל
  choice: потеря детей
  rationale: Существительное обозначает лишение детей, а не общее переживание утраты; конкретный перевод сохраняет семейный образ, связанный с олицетворённым Вавилоном.
- source_word: וְאַלְמֹן
  choice: и вдовство
  rationale: Точно передаёт состояние женщины, лишившейся мужа, и соответствует женскому олицетворению адресата.
- source_word: כְּתֻמָּם
  choice: во всей полноте
  rationale: 'Передаёт значение полноты, завершённости: оба бедствия наступят не частично, а полностью.'
- source_word: בָּאוּ עָלַיִךְ
  choice: они обрушатся на тебя
  rationale: Перфект понимается как пророческий, представляющий будущее событие как несомненное. «Обрушатся» естественно выражает наступление бедствий.
- source_word: בְּרֹב כְּשָׁפַיִךְ
  choice: несмотря на множество твоих колдовств
  rationale: Предлог ב истолкован уступительно в соответствии с насмешкой над неспособностью магии предотвратить суд; другие грамматически возможные отношения сохранены в сноске.
- source_word: בְּעָצְמַת חֲבָרַיִךְ מְאֹד
  choice: и великую силу твоих заклинаний
  rationale: עָצְמָה передано существительным «сила», а חֲבָרִים в данном контексте — как магические заклинания. מְאֹד выражено усиленным определением «великую».
theological_decisions:
- issue: Значение предлога ב в двух заключительных оборотах
  choice: 'уступительное: «несмотря на…»'
  alternative: 'причинное: «из-за…»; либо сопутствующее/инструментальное: «со всеми…»'
  rationale: Контекст подчёркивает тщетность упования Вавилона на магию, однако еврейская конструкция допускает также причинное или сопутствующее понимание, поэтому неоднозначность отмечена в сноске.
- issue: Временная отнесённость בָּאוּ
  choice: 'будущее: «обрушатся»'
  alternative: 'совершённое: «обрушились»'
  rationale: В пророческой речи перфект может изображать грядущее как уже несомненно совершившееся; русское будущее согласуется с началом стиха и не создаёт ложного временного разрыва.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Женский адресат сохранён косвенно через образы потери детей и вдовства; лексика магии передана общеупотребительными словами «колдовства» и «заклинания».
