  text: וְ/עַתָּ֞ה שִׁמְעִי זֹ֤את עֲדִינָה֙ הַ/יּוֹשֶׁ֣בֶת לָ/בֶ֔טַח הָ/אֹֽמְרָה֙ בִּ/לְבָ֔בָ/הּ אֲנִ֖י וְ/אַפְסִ֣/י ע֑וֹד לֹ֤א אֵשֵׁב֙ אַלְמָנָ֔ה וְ/לֹ֥א אֵדַ֖ע שְׁכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/008.yaml
  text: Then[a], hear this, you lover of luxury, who sit securely, who say in your heart, ‘I am, and there is no one besides me. I will not sit as a widow[c][b], nor will I know the loss of children.’
translation:
  language: ru
  text: 'А теперь выслушай это, изнеженная[a], живущая в безопасности, говорящая в сердце своём: «Я — и кроме меня никого нет[b]. Не буду я жить вдовой и не узнаю потери детей[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живущая в неге», «избалованная роскошью». Еврейское слово описывает изнеженность и привычку к роскошной жизни.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я — и больше ничего нет». Это выражение передаёт надменное притязание на исключительность.'
    reason: alternative_reading
  - marker: c
    text: 'Еврейское выражение буквально: «не узнаю скорби от утраты детей»; то есть не испытаю их утраты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сочетание וְעַתָּה вводит новый, резкий этап прямого обращения; «А теперь» естественно передаёт и связку, и временно-дискурсивный переход.
- source_word: עֲדִינָה
  choice: изнеженная
  rationale: Прилагательное обозначает утончённую мягкость, избалованность роскошью и привычку к неге. «Изнеженная» сохраняет обращение в женском роде и его обличительный оттенок.
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  choice: живущая в безопасности
  rationale: Причастие от ישׁב может означать как сидение, так и постоянное проживание; לָבֶטַח выражает состояние уверенной безопасности. Русское сочетание естественно для олицетворённого города и не добавляет значения небрежности.
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: Я — и кроме меня никого нет
  rationale: Фраза выражает притязание на исключительность. Личное «никого» соответствует олицетворённой говорящей и сохраняет намеренное сходство с формулами исключительного верховенства.
- source_word: לֹא אֵשֵׁב אַלְמָנָה
  choice: Не буду я жить вдовой
  rationale: ישׁב здесь описывает пребывание в положении вдовы. «Жить вдовой» естественнее по-русски, чем буквальное «сидеть вдовой», при этом сохраняет длительное состояние, а не только момент его наступления.
- source_word: אֵדַע שְׁכוֹל
  choice: не узнаю потери детей
  rationale: Глагол «знать» имеет опытное значение, а שְׁכוֹל обозначает утрату детей. Формулировка сохраняет образное «узнать» и конкретный характер горя.
theological_decisions:
- issue: Самовозвеличивающее заявление Вавилона אֲנִי וְאַפְסִי עוֹד
  choice: Я — и кроме меня никого нет
  alternative: Я — и больше ничего нет
  rationale: Личный вариант подходит олицетворённому Вавилону и сохраняет напряжённое эхо формул, которыми в других местах утверждается исключительность Бога, не объясняя и не сглаживая это эхо в основном тексте.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим тоном. Женский род последовательно сохраняет олицетворение Вавилона. Синтаксис прямой речи слегка приподнят ради риторической силы, без архаизмов и конфессиональной терминологии.
