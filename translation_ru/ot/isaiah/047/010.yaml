base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/010.yaml
  text: You trusted in your wickedness; you said[a], ‘No one sees me.’ Your wisdom and your knowledge led you astray, and you said in your heart, ‘I am, and there is no one besides me.’
translation:
  language: ru
  text: 'Ты полагалась на своё нечестие и говорила: «Никто меня не видит». Твоя мудрость и твоё знание сбили тебя с пути, и ты говорила в своём сердце: «Я — и кроме меня никого нет».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я — и больше ничего нет». Еврейское выражение допускает более отвлечённое понимание, однако в данном контексте, вероятно, передаёт притязание Вавилона на исключительность.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּבְטְחִי בְרָעָתֵךְ
  choice: Ты полагалась на своё нечестие
  rationale: Глагол בטח передаёт уверенность или опору на что-либо, а רָעָה здесь обозначает нравственное зло, а не бедствие. «Полагалась на своё нечестие» сохраняет обвинительный смысл и звучит естественно по-русски.
- source_word: אֵין רֹאָנִי
  choice: Никто меня не видит
  rationale: Естественная передача отрицательной бытийной конструкции с причастием и местоименным суффиксом; выражает уверенность в том, что зло останется незамеченным.
- source_word: חָכְמָתֵךְ וְדַעְתֵּךְ
  choice: Твоя мудрость и твоё знание
  rationale: Оба понятия сохранены раздельно, как в еврейском параллелизме, без сведения их к одному общему слову.
- source_word: הִיא שׁוֹבְבָתֶךְ
  choice: сбили тебя с пути
  rationale: Форма передаёт причинённое отклонение или заблуждение. Русская идиома ясно показывает, что именно мудрость и знание Вавилона привели его к самообману.
- source_word: בְלִבֵּךְ
  choice: в своём сердце
  rationale: Сохранён характерный библейский образ внутренней речи; он понятен современному русскому читателю.
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: Я — и кроме меня никого нет
  rationale: Сохраняется резкое самоутверждение אֲנִי и притязание олицетворённого Вавилона на исключительность. Личное «никого» естественно в данном контексте, а более отвлечённая возможность отражена в сноске.
theological_decisions:
- issue: Передача хвастливого заявления אֲנִי וְאַפְסִי עוֹד с сохранением его переклички с исключительными самооткровениями Господа в книге Исаии
  choice: Я — и кроме меня никого нет
  alternative: Я — и больше ничего нет
  rationale: Формулировка сохраняет богопротивное притязание Вавилона и богословскую иронию, но не отождествляет говорящего с Богом. Личное прочтение лучше соответствует образу города-женщины, тогда как возможное отвлечённое прочтение не устранено, а вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с сохранением женского рода обращения к олицетворённому Вавилону, библейского образа сердца и строгого пророческого тона. Синтаксис сделан ясным и естественным без устранения смысловой неоднозначности заключительной фразы.
