  source_fidelity: Перевод точно передаёт обращение к Вавилону во 2-м лице женского рода, её утомление от множества советов, иронический призыв к астрологическим специалистам выступить и спасти её и содержание их предсказаний о грядущем. Трудное הֹבְרֵי שָׁמַיִם передано осторожно и снабжено уместной сноской. «Что тебя постигнет» хорошо передаёт מֵאֲשֶׁר יָבֹאוּ עָלָיִךְ без излишней конкретизации.
