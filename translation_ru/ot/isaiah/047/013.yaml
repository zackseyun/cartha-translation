  variant: modern literary Russian
source:
  edition: WLC
  text: נִלְאֵ֖ית בְּ/רֹ֣ב עֲצָתָ֑יִ/ךְ יַעַמְדוּ נָ֨א וְ/יוֹשִׁיעֻ֜/ךְ הברו שָׁמַ֗יִם הַֽ/חֹזִים֙ בַּ/כּ֣וֹכָבִ֔ים מֽוֹדִיעִם֙ לֶ/חֳדָשִׁ֔ים מֵ/אֲשֶׁ֥ר יָבֹ֖אוּ עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/013.yaml
  text: You are wearied by your many counsels[a]. Let them stand now and save you—those who divide the heavens, who gaze at the stars[b], who make known month by month what will come upon you.
translation:
  language: ru
  text: Ты утомилась от множества своих советов. Пусть же встанут и спасут тебя те, кто делит небеса[a], наблюдает за звёздами и из месяца в месяц возвещает[b], что тебя постигнет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «размечает небеса». Еврейское выражение трудно для истолкования; вероятно, речь об астрологах, деливших небо на участки.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возвещает при новолуниях». Еврейский текст может подразумевать предсказания, связанные с ежемесячным циклом новолуний.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִלְאֵית
  choice: ты утомилась
  rationale: Нифаль, перфект 2-го лица женского рода единственного числа, выражает достигнутое состояние усталости; форма сохраняет обращение к Вавилону как к женщине.
- source_word: בְּרֹב עֲצָתָיִךְ
  choice: от множества своих советов
  rationale: עֵצָה означает «совет, замысел, план»; конструкция указывает на причину изнурения, а «множество» сохраняет смысл רֹב.
- source_word: יַעַמְדוּ נָא
  choice: пусть же встанут
  rationale: 'Имперфект с побудительной частицей נָא передаёт иронический вызов: пусть советники теперь выступят и докажут свою способность помочь.'
- source_word: וְיוֹשִׁיעֻךְ
  choice: и спасут тебя
  rationale: Каузативная форма ישׁע означает «спасти, избавить»; выбран широкий и прямой русский эквивалент.
- source_word: הברו שָׁמַיִם
  choice: те, кто делит небеса
  rationale: Трудное еврейское выражение, вероятно, обозначает астрологов, разделявших небо на участки; буквальный образ сохранён в тексте, а неопределённость отмечена в сноске.
- source_word: הַחֹזִים בַּכּוֹכָבִים
  choice: наблюдает за звёздами
  rationale: Сочетание причастия от חזה со «звёздами» обозначает звездочётов или астрологов; формулировка естественна по-русски и не добавляет отсутствующих деталей.
- source_word: מוֹדִיעִם לֶחֳדָשִׁים
  choice: из месяца в месяц возвещает
  rationale: לֶחֳדָשִׁים допускает временное понимание «по месяцам» и связь с новолуниями; основной текст передаёт регулярность предсказаний, альтернативу сохраняет сноска.
- source_word: מֵאֲשֶׁר יָבֹאוּ עָלָיִךְ
  choice: что тебя постигнет
  rationale: Фраза указывает на содержание предсказаний — грядущие события или бедствия; русский глагол «постигнет» естественно передаёт идиому «придёт на тебя».
theological_decisions:
- issue: Обозначение вавилонских оккультных советников
  choice: Стих передан как иронический вызов астрологам, неспособным спасти Вавилон.
  alternative: Обобщённое указание на советников или мудрецов без явного астрологического смысла.
  rationale: Контекст Ис 47 говорит о вавилонских чарах и заклинаниях, а упоминания неба, звёзд и месяцев прямо поддерживают астрологическое понимание. При этом перевод не конкретизирует их практику сверх сказанного в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Женский род сохраняет олицетворённое обращение к Вавилону; ирония выражена побудительной конструкцией «пусть же встанут и спасут».
