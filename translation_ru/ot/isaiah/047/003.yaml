id: ISA.47.3
reference: Isaiah 47:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: תִּגָּל֙ עֶרְוָתֵ֔/ךְ גַּ֥ם תֵּרָאֶ֖ה חֶרְפָּתֵ֑/ךְ נָקָ֣ם אֶקָּ֔ח וְ/לֹ֥א אֶפְגַּ֖ע אָדָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/003.yaml
  text: Your nakedness will be uncovered[a]; indeed, your disgrace will be seen. I will take vengeance[b], and I will spare no man.
translation:
  language: ru
  text: Откроется нагота твоя, и позор твой станет виден. Я совершу возмездие и не пощажу никого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последняя фраза в еврейском тексте трудна и допускает переводы: «не встречу человека», «не допущу ничьего вмешательства» или, сходно по смыслу, «не сделаю исключения ни для кого».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּגָּל
  choice: откроется
  rationale: Нифаль имперфекта גלה передаёт пассивное обнажение; «откроется» естественно сохраняет образ разоблачения.
- source_word: עֶרְוָתֵךְ
  choice: нагота твоя
  rationale: Конкретно передаёт עֶרְוָה и сохраняет связанный с публичным обнажением оттенок стыда.
- source_word: גַּם
  choice: и
  rationale: В параллельной строке частица усиливает и развивает первую мысль; в современном русском это естественно выражается соединительным «и» без избыточного «воистину».
- source_word: תֵּרָאֶה
  choice: станет виден
  rationale: Нифаль от ראה здесь означает, что позор сделается видимым для других.
- source_word: חֶרְפָּתֵךְ
  choice: позор твой
  rationale: «Позор» передаёт общественное бесчестье и стыд, заключённые в חֶרְפָּה.
- source_word: נָקָם אֶקָּח
  choice: Я совершу возмездие
  rationale: Русское устойчивое сочетание передаёт идиому «взять/осуществить возмездие» и сохраняет судебную весомость контекста.
- source_word: וְלֹא אֶפְגַּע אָדָם
  choice: и не пощажу никого
  rationale: В контексте суда это естественно передаёт вероятный смысл неотвратимого, никем не смягчённого возмездия; подлинная неоднозначность פגע отмечена в сноске.
theological_decisions:
- issue: Толкование וְלֹא אֶפְגַּע אָדָם
  choice: и не пощажу никого
  alternative: «и не встречу человека»; «и не допущу ничьего вмешательства»; «и не сделаю исключения ни для кого»
  rationale: Сжатое еврейское выражение допускает несколько толкований. Контекст суда над Вавилоном поддерживает смысл беспощадного и неотвратимого возмездия, однако неоднозначность нельзя устранять без оговорки.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Инверсия «нагота твоя / позор твой» сохраняет поэтический параллелизм, не делая фразу архаичной.
