base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/006.yaml
  text: I was angry with my people[a]; I profaned my inheritance and gave them into your hand. You showed them no mercy[c][b]; on the aged you made your yoke very heavy.
translation:
  language: ru
  text: Я разгневался на Мой народ, осквернил Моё наследие[a] и отдал их в твою руку. Ты не оказала им милосердия[b]; на стариков[c] ты наложила своё ярмо, сделав его очень тяжёлым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «обесчестил Моё наследие» или «обошёлся с Моим наследием как с несвятым».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ты не положила им милосердия».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на старца»; единственное число здесь может обозначать пожилых людей как группу.'
    reason: source_form
lexical_decisions:
- source_word: קָצַפְתִּי
  choice: Я разгневался
  rationale: Глагол выражает гнев; «разгневался» сохраняет силу высказывания и соответствует достойному современному регистру.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Передаёт коллективное и заветное значение выражения без уточняющего толкования.
- source_word: חִלַּלְתִּי
  choice: осквернил
  rationale: Порода пиэль глагола חלל имеет сильное значение «осквернять, лишать святости, обращаться как с несвятым»; перевод не смягчает активное действие Бога.
- source_word: נַחֲלָתִי
  choice: Моё наследие
  rationale: Сохраняет образ принадлежности и заветную лексику еврейского נחלה.
- source_word: וָאֶתְּנֵם בְּיָדֵךְ
  choice: и отдал их в твою руку
  rationale: Сохраняет еврейский образ передачи во власть другого; женский род местоимения указывает на Вавилон, к которому обращена речь.
- source_word: לֹא שַׂמְתְּ לָהֶם רַחֲמִים
  choice: Ты не оказала им милосердия
  rationale: Естественно передаёт идиому, буквально говорящую о том, что милосердие им не было «положено».
- source_word: רַחֲמִים
  choice: милосердие
  rationale: Подходит к контексту жестокого обращения с покорёнными и передаёт смысл сострадания и пощады.
- source_word: זָקֵן
  choice: стариков
  rationale: Единственное число употреблено обобщённо; русское множественное число ясно обозначает категорию пожилых людей.
- source_word: הִכְבַּדְתְּ עֻלֵּךְ מְאֹד
  choice: наложила своё ярмо, сделав его непомерно тяжёлым
  rationale: Сохраняет метафору ярма и причинное значение глагола «сделать тяжёлым», выражая усиление מְאֹד естественным русским языком.
theological_decisions:
- issue: Действие Бога в словах «осквернил Моё наследие»
  choice: 'Сохранено прямое утверждение от первого лица: Бог осквернил Своё наследие, предав народ суду.'
  alternative: 'Смягчить до «оставил Моё наследие» или истолковать разрешительно: «позволил осквернить».'
  rationale: 'В еврейском тексте стоит активная форма первого лица. Её не следует смягчать ради устранения богословского напряжения: Бог совершает суд, а Вавилон при этом несёт ответственность за отсутствие милосердия.'
- issue: Ответственность Вавилона после передачи народа в его власть
  choice: Сохранено непосредственное обвинение Вавилона в немилосердии и чрезмерной тяжести ярма.
  alternative: Представить жестокость Вавилона лишь как нейтральное исполнение Божьего суда.
  rationale: Текст одновременно утверждает Божье судебное действие и порицает Вавилон за жестокое обращение; перевод не устраняет этого напряжения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Обращение к Вавилону последовательно передано формами женского рода. Сохранены ключевые образы «наследия», «руки» и «ярма», а менее естественная еврейская идиома о милосердии передана ясно и идиоматично.
