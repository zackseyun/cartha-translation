    reason: lexical_alternative
lexical_decisions:
- source_word: קְחִי רֵחַיִם
  choice: Возьми жернова
  rationale: Императив обращён к женщине; רֵחַיִם обозначает ручную мельницу или её жернова. Конкретное «жернова» сохраняет образ тяжёлого, унизительного труда.
- source_word: וְטַחֲנִי קָמַח
  choice: и мели муку
  rationale: טָחַן значит «молоть», а קֶמַח — «мука». Форма «мели» естественно передаёт повелительное наклонение женского рода.
- source_word: גַּלִּי צַמָּתֵךְ
  choice: откинь покрывало[a]
  rationale: 'Значение צַמָּה не вполне определённо: возможно покрывало либо волосы/локоны. В контексте последовательного лишения достоинства «покрывало» наиболее связно, а «откинь» естественно сочетается с ним.'
- source_word: חֶשְׂפִּי שֹׁבֶל
  choice: сними длинную юбку[b]
  rationale: שֹׁבֶל обозначает нижнюю длинную одежду, её подол или шлейф; חָשַׂף выражает снятие или обнажение. Такой перевод передаёт действие естественно по-русски, не усиливая наготу сверх текста.
- source_word: גַּלִּי שׁוֹק
  choice: обнажи ногу[c]
  rationale: שׁוֹק может обозначать ногу, особенно голень, а иногда понимается как бедро. Общее «ногу» естественно в сцене перехода через воду и сохраняет допустимую широту значения.
- source_word: עִבְרִי נְהָרוֹת
  choice: переходи реки
  rationale: עָבַר означает переходить или проходить через что-либо; נְהָרוֹת — реки. Русская формулировка кратка и сохраняет образ вынужденного перехода.
theological_decisions:
- issue: Характер образа унижения Вавилона
  choice: Последовательность приказов передана как утрата царского достоинства и вынужденное публичное унижение.
  alternative: Сделать описание более откровенно сексуализированным.
  rationale: Еврейский текст изображает постыдное обнажение и унижение, однако не требует усиливать сексуальный оттенок. Перевод сохраняет нарастание образа, не выходя за пределы лексических данных.
translation_notes:
  register: Современный литературный русский язык; краткие повелительные формы сохраняют резкость оригинала. Женский род обусловлен обращением к олицетворённому Вавилону. Пунктуация объединяет последовательность приказов, а лексические неопределённости вынесены в примечания.
