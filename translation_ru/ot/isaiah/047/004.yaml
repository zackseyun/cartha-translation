  text: Our Redeemer—Yahweh of Armies is his name—is the Holy One of Israel[a][b].
translation:
  language: ru
  text: Наш Искупитель — Святой Израиля; имя Его — Яхве Воинств.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционном переводе: «Господь Саваоф».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переведённое как «Искупитель», может также обозначать близкого родственника, который по праву и обязанности защищает родича и возвращает утраченное.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֲלֵנוּ
  choice: Наш Искупитель
  rationale: 'Причастная форма от גאל употреблена как существительное: «Тот, кто искупает нас». «Искупитель» сохраняет правовой и заветный смысл лучше, чем более общее «Спаситель»; оттенок родственного долга возможен, но непосредственно здесь не выражен.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: В устойчивом божественном имени «Яхве Воинств» слово сохраняет конкретный смысл множества небесных или земных сил и узнаваемую библейскую формулу.
- source_word: שְׁמוֹ
  choice: имя Ему
  rationale: Еврейское именное предложение передано естественной для возвышенного русского стиля формулой, сохраняющей смысл «таково Его имя».
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  rationale: Сохранён характерный для Исаии устойчивый титул Бога; родительный падеж не устраняет возможную смысловую связь с Израилем.
theological_decisions:
- issue: Передача божественного имени и титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф / Господь воинств
  rationale: Личное имя передано непосредственно как «Яхве», а צְבָאוֹת — понятным русским словом «Воинств», без замены имени титулом.
- issue: Статус слова גֹּאֲלֵנוּ
  choice: Искупитель с прописной буквы
  alternative: искупитель / Родственник-Искупитель
  rationale: В данном кратком высказывании это обозначение Бога, стоящее рядом с Его именем и титулом «Святой Израиля». Оттенок родственного защитника не внесён в основной текст, поскольку контекст стиха не выражает его явно.
translation_notes:
  register: Современный литературный русский с кратким, торжественным синтаксисом. Формула «имя Ему» выбрана как естественная библейская конструкция; местоимение написано с прописной буквы в соответствии с благоговейной русской издательской традицией. Все сноски отмечены в основном тексте.
