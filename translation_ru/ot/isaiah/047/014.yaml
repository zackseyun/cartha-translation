base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/014.yaml
  text: Look[a], they have become like stubble; fire burns them up. They cannot rescue themselves from the power of the flame. This is no coal for warming oneself, no fire to sit before.
translation:
  language: ru
  text: 'Вот, они стали как солома: огонь пожрал их. Они не смогут спасти себя от власти пламени. Это не уголёк, чтобы согреться[a], не огонь, перед которым можно посидеть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза трудна для истолкования. Возможно также: «Нет уголёка, чтобы согреться». Смысл, по-видимому, в том, что это не небольшой полезный жар очага, а всепожирающее пламя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт эмфатическое указание естественным и литературным современным русским языком.
- source_word: הָיוּ כְקַשׁ
  choice: они стали как солома
  rationale: Перфект выражает наступившее состояние; קַשׁ обозначает сухую солому или остатки стеблей, легко охватываемые огнём.
- source_word: אֵשׁ שְׂרָפָתַם
  choice: огонь пожрал их
  rationale: Форма от שׂרף выражает уничтожение огнём; «пожрал» сохраняет краткость, силу и завершённость образа.
- source_word: לֹא יַצִּילוּ אֶת נַפְשָׁם
  choice: они не смогут спасти себя
  rationale: Нֶפֶשׁ здесь означает самих людей или их жизнь, а Hiphil נצל — избавить, спасти. Модальная формулировка естественно выражает их неспособность избежать гибели.
- source_word: מִיַּד לֶהָבָה
  choice: от власти пламени
  rationale: Буквально «из руки пламени»; «власть» передаёт идиоматический смысл силы или хватки, не устраняя олицетворённый образ полностью.
- source_word: אֵין גַּחֶלֶת לַחְמָם
  choice: это не уголь, у которого можно согреться
  rationale: Трудная форма לַחְמָם понята как относящаяся к согреванию. Фраза противопоставляет уничтожающее пламя полезному домашнему жару.
- source_word: אוּר לָשֶׁבֶת נֶגְדּוֹ
  choice: не огонь, перед которым можно посидеть
  rationale: אוּר здесь означает огонь; выражение рисует обычный очаг, перед которым сидят, и тем самым усиливает контраст с губительным пожаром.
theological_decisions:
- issue: Характер образа суда
  choice: Сохранён образ конкретного губительного суда над Вавилоном и теми, на кого он полагался, без уточнения его как окончательного посмертного наказания.
  alternative: Истолковать пламя как прямое обозначение всеобщего или окончательного божественного суда.
  rationale: Ближайший контекст — пророческое возвещение суда над Вавилоном. Перевод сохраняет силу образа, но не навязывает ему более узкую позднейшую догматическую трактовку.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Вот» сохраняет указательную эмфазу, а «пожрал» — яркость и разрушительную силу образа. Синтаксис последней фразы намеренно параллелен.
