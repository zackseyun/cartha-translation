  text: שְׁבִ֥י דוּמָ֛ם וּ/בֹ֥אִי בַ/חֹ֖שֶׁךְ בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ גְּבֶ֖רֶת מַמְלָכֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/005.yaml
  text: Sit in silence[a], and go into darkness, daughter of the Chaldeans; for no longer will they call you the mistress of kingdoms.
translation:
  language: ru
  text: Сиди молча и войди во тьму, дочь халдеев, потому что больше не назовут тебя владычицей царств[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «госпожой царств».'
    reason: 'Лексическая альтернатива для גְּבֶרֶת: слово может означать как властную владычицу, так и госпожу высокого положения.'
lexical_decisions:
- source_word: שְׁבִי דוּמָם
  choice: Сиди молча
  rationale: Сочетание повелительной формы женского рода שְׁבִי и наречного דוּמָם передаёт приказ о безмолвном, униженном положении; «сиди молча» естественно звучит по-русски и сохраняет конкретный образ.
- source_word: וּבֹאִי בַחֹשֶׁךְ
  choice: и уйди во тьму
  rationale: Глагол בוא с направительным контекстом обозначает вхождение во тьму. «Уйди во тьму» естественно передаёт удаление от прежней славы, не заменяя конкретный пророческий образ его толкованием.
- source_word: בַּת כַּשְׂדִּים
  choice: дочь халдеев
  rationale: Сохранена характерная для пророков женская персонификация города и народа; в стих не добавляется отсутствующее в еврейском тексте имя «Вавилон».
- source_word: לֹא תוֹסִיפִי יִקְרְאוּ לָךְ
  choice: больше не назовут тебя
  rationale: Отрицание с יסף выражает прекращение, а форма третьего лица множественного числа имеет неопределённый субъект. Русская безлично-неопределённая конструкция точно и естественно передаёт обе особенности.
- source_word: גְּבֶרֶת מַמְלָכוֹת
  choice: владычицей царств
  rationale: גְּבֶרֶת обозначает госпожу или владычицу, обладающую властью. «Владычица» хорошо передаёт имперское господство, тогда как «царица» неоправданно уточняла бы официальный титул.
theological_decisions:
- issue: Тьма как образ суда и утраты прежнего положения
  choice: Сохранить буквальный образ «тьмы»
  alternative: Передать как «безвестность» или «забвение»
  rationale: Еврейский текст использует конкретный и многозначный образ. Его буквальная передача сохраняет поэтическое напряжение и не сводит смысл к одному толкованию.
- issue: Женская персонификация Халдеи/Вавилона
  choice: Сохранить обращение «дочь халдеев» и женский титул «владычица»
  alternative: Заменить персонификацию прямым названием «Вавилон»
  rationale: Форма оригинала представляет город и народ как женщину, лишаемую власти и почёта; сохранение этого приёма необходимо для риторики пророческого суда.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественный пророческий тон. Женские формы обращения сохранены. Синтаксис сделан естественным для русского языка без ослабления образов унижения, тьмы и утраты господства.
