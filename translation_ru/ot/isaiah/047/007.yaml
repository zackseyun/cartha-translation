id: ISA.47.7
reference: Isaiah 47:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/תֹּ֣אמְרִ֔י לְ/עוֹלָ֖ם אֶהְיֶ֣ה גְבָ֑רֶת עַ֣ד לֹא שַׂ֥מְתְּ אֵ֨לֶּה֙ עַל לִבֵּ֔/ךְ לֹ֥א זָכַ֖רְתְּ אַחֲרִיתָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/007.yaml
  text: You said[a], ‘I will be mistress forever,’ so that you did not take these things to heart[c][b]; you did not remember her end.
translation:
  language: ru
  text: 'Ты говорила: «Навеки останусь госпожой[a]». И потому не принимала всё это близко к сердцу[b], не помнила о её конце[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «владычицей». Еврейское слово обозначает женщину, занимающую властное или высокое положение; определённого царского титула здесь нет.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не положила всего этого на своё сердце».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский текст буквально говорит «о её конце»; возможно также понимание: «о своём конце» или «о том, чем всё это кончится». Женская форма может поддерживать олицетворение Вавилона как женщины.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמְרִי
  choice: Ты говорила
  rationale: Форма обращена к Вавилону, представленному женщиной; прошедшее время и женский род естественно передают еврейскую форму второго лица.
- source_word: לְעוֹלָם אֶהְיֶה
  choice: Навеки останусь
  rationale: В данном хвастливом утверждении אֶהְיֶה означает продолжающееся положение в будущем; «останусь» по-русски естественно выражает притязание на неизменность.
- source_word: גְבָרֶת
  choice: госпожой
  rationale: Слово обозначает женщину, обладающую властью или высоким положением. «Госпожа» сохраняет этот смысл, не вводя отсутствующего в тексте царского титула.
- source_word: עַד לֹא
  choice: И потому не
  rationale: В контексте сочетание передаёт следствие самоуверенного заявления. Такой перевод естественнее буквального «до тех пор не», при этом возможный оттенок результата отмечен структурой фразы.
- source_word: שַׂמְתְּ אֵלֶּה עַל לִבֵּךְ
  choice: не принимала всё это близко к сердцу
  rationale: 'Передан еврейский образ «положить на сердце»: серьёзно обдумать и принять во внимание. Русский устойчивый оборот сохраняет сердечную метафору.'
- source_word: לֹא זָכַרְתְּ
  choice: не помнила
  rationale: Сохранено основное значение корня זכר, а не более истолковывающее «не задумывалась».
- source_word: אַחֲרִיתָהּ
  choice: о её конце
  rationale: Женский суффикс третьего лица сохранён буквально, чтобы не устранять неясность его отнесения и поддержать женскую персонификацию Вавилона.
theological_decisions:
- issue: Женская персонификация Вавилона и референция суффикса в אַחֲרִיתָהּ
  choice: 'Сохранить форму третьего лица женского рода: «о её конце»'
  alternative: «о своём конце» или «о том, чем всё это кончится»
  rationale: В еврейском тексте стоит суффикс третьего лица женского рода, хотя речь обращена к Вавилону во втором лице. Перевод не исправляет это напряжение и не превращает его без предупреждения в прямое «о своём конце».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род последовательно отражает обращение к олицетворённому Вавилону. Формулировка «госпожой» сохраняет властный оттенок без чрезмерно конкретного «царицей»; необычное третье лицо в конце стиха оставлено в основном тексте и разъяснено в сноске.
