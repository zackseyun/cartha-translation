base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/015.yaml
  text: So have those with whom you labored become to you—your merchants from your youth[a]. Each one wanders to his own quarter; there is no one to save you.
translation:
  language: ru
  text: Таковы стали для тебя те, с кем ты трудилась, — твои торговцы с твоей юности. Каждый из них блуждает в свою сторону[a]; некому спасти тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение кратко и может означать: «каждый на свою сторону», «каждый в своём направлении» или «каждый своим путём»; оно может подчёркивать рассеяние, а не определённое место назначения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן הָיוּ לָךְ
  choice: Вот кем оказались для тебя
  rationale: 'Передаёт итоговый смысл כֵּן и результирующее значение היה с ל: давние связи Вавилона в итоге оказались бесполезными.'
- source_word: אֲשֶׁר יָגָעַתְּ
  choice: те, с кем ты трудилась
  rationale: Сохраняет значение тяжёлого, длительного труда и допускаемую контекстом связь Вавилона с названными далее торговцами, не уточняя искусственно характер их совместных занятий.
- source_word: סֹחֲרַיִךְ מִנְּעוּרַיִךְ
  choice: твои торговцы с самой твоей юности
  rationale: «Торговцы» прямо передаёт коммерческий термин, а «с самой твоей юности» подчёркивает давность отношений и сохраняет олицетворение города в женском роде.
- source_word: אִישׁ לְעֶבְרוֹ תָּעוּ
  choice: Они разбрелись, каждый в свою сторону
  rationale: Множественное «разбрелись» передаёт תָּעוּ как рассеяние без общего направления, а распределительное אִישׁ — оборотом «каждый». Неоднозначность לְעֶבְרוֹ отмечена в сноске.
- source_word: אֵין מוֹשִׁיעֵךְ
  choice: некому спасти тебя
  rationale: Краткая и естественная русская формулировка сохраняет абсолютность отсутствия избавителя и смысловой вес глагола ישׁע.
theological_decisions:
- issue: Передача מוֹשִׁיעֵךְ
  choice: спасти тебя
  alternative: избавить тебя; выручить тебя
  rationale: «Спасти» является прямым и контекстуально ясным соответствием, сохраняя богословский оттенок спасения, но не сводя речь к специальному учению о вечном спасении.
translation_notes:
  register: Современный литературный русский язык; обращение к олицетворённому Вавилону последовательно передано в женском роде. Формулировка сохраняет торжественный пророческий тон без архаизмов.
