source:
  edition: WLC
  text: רְדִ֣י וּ/שְׁבִ֣י עַל עָפָ֗ר בְּתוּלַת֙ בַּת בָּבֶ֔ל שְׁבִי לָ/אָ֥רֶץ אֵין כִּסֵּ֖א בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ רַכָּ֖ה וַ/עֲנֻגָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/001.yaml
  text: Come down and sit in the dust[a], virgin daughter Babylon; sit on the ground without a throne, daughter of the Chaldeans[d][c][b]. For they will no longer call you tender and delicate.
translation:
  language: ru
  text: Сойди и сядь в прах, девственная дочь Вавилона[a]; сядь на землю без престола, дочь халдеев. Ведь больше не назовут тебя нежной и изнеженной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Девственная дочь Вавилона» — поэтическое олицетворение города и державы в образе молодой царственной женщины.
    reason: cultural_note
lexical_decisions:
- source_word: רְדִי
  choice: Сойди
  rationale: Женская форма повелительного наклонения от ירד обозначает нисхождение с возвышенного положения; «сойди» естественно передаёт и движение, и образ унижения.
- source_word: וּשְׁבִי / שְׁבִי
  choice: сядь / сядь
  rationale: Повтор глагола сохранён как риторический приём; в данном контексте ישב означает занять низкое сидячее положение, а не жить или обитать.
- source_word: עַל עָפָר
  choice: в прах
  rationale: Буквально предлог может означать «на», однако русское «сесть в прах» естественно выражает библейский образ унижения и скорби.
- source_word: בְּתוּלַת בַּת בָּבֶל
  choice: девственная дочь Вавилона
  rationale: Сохранена женская поэтическая персонификация Вавилона как молодой женщины; «девственная» точно передаёт בְּתוּלַת и не снимает напряжения образа.
- source_word: לָאָרֶץ
  choice: на землю
  rationale: При повторном «сядь» выражение обозначает место униженного положения и образует естественную русскую параллель к «в прах».
- source_word: אֵין כִּסֵּא
  choice: без престола
  rationale: 'Краткая безглагольная конструкция передана обстоятельственно: Вавилон лишён царственного положения. Возможное самостоятельное прочтение «нет престола» отмечено неявно самой прозрачной формой без догматического уточнения.'
- source_word: בַּת כַּשְׂדִּים
  choice: дочь халдеев
  rationale: Передаёт множественное этническое наименование כַּשְׂדִּים и сохраняет параллельную персонификацию.
- source_word: כִּי לֹא תוֹסִיפִי יִקְרְאוּ לָךְ
  choice: Ведь больше не назовут тебя
  rationale: Конструкция יסף с последующим глаголом означает прекращение прежнего состояния; неопределённо-личное «не назовут» естественно передаёт безлично употреблённое третье лицо множественного числа.
- source_word: רַכָּה
  choice: нежной
  rationale: Передаёт мягкость и утончённость, сохраняя положительный оттенок прежнего почётного обозначения.
- source_word: וַעֲנֻגָּה
  choice: изнеженной
  rationale: Слово обозначает утончённость, связанную с роскошью и избалованностью; «изнеженная» точнее отличает его от רַכָּה, чем повтор близкого по смыслу «нежная».
theological_decisions:
- issue: Женская царственная персонификация Вавилона
  choice: Сохранить обращения «девственная дочь Вавилона» и «дочь халдеев».
  alternative: Свести оба обращения просто к названию «Вавилон».
  rationale: Пророческая насмешка изображает город и державу молодой царственной женщиной, низведённой с престола; устранение персонификации ослабило бы литературный и богословский образ суда.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и повтор «сядь» сохранены; устаревшее «дева» не использовано, но образность оригинала оставлена без сглаживания.
