- from: Как мать утешает своего сына[a], так Я утешу вас; и в Иерусалиме вы будете утешены.
  to: Как человека, которого утешает его мать, так Я утешу вас; и в Иерусалиме вы будете утешены.
  rationale: Исправление заменяет добавленное «своего сына» на «человека, которого утешает его мать», сохраняя лексическое значение אִישׁ, относительное построение и притяжательный суффикс при «мать». Остальная часть стиха точна и не нуждается в изменении.
