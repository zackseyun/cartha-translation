review_pass:
  verdict: revise
  source_fidelity: Основной текст неоправданно заменяет אִישׁ («мужчина; человек») словом «сын». Хотя мужчина по отношению к матери является сыном, еврейский текст не называет его сыном; замена сужает и конкретизирует образ. Исправленный вариант сохраняет сравнительную конструкцию, притяжательное «его мать», тройное повторение נחם и пассивную форму в заключении.
  naturalness: «Как человека, которого утешает его мать» — нормативная, ясная и достаточно естественная для современного литературного русского формулировка с уместной библейской интонацией. Она точнее, чем перестройка с «сыном», и не звучит архаично.
  terminology: '«Утешает / утешу / будете утешены» последовательно передаёт повтор корня נחם. «Иерусалим» и предложное сочетание «в Иерусалиме» корректны. Сноска должна описывать буквально форму оригинала, но не утверждать, будто основной текст заменяет её нейтральным выражением: «человека» в русском грамматически мужского рода и служит естественным соответствием אִישׁ в данном сравнении.'
  issues:
  - severity: medium
    issue: «Сына» вместо אִישׁ
    rationale: Еврейское אִישׁ обозначает мужчину/человека, а не сына. Добавление родственного термина меняет лексику и несколько сужает исходный образ, даже если связь с матерью логически предполагается.
  - severity: low
    issue: Неточная формулировка сноски и её обоснования
    rationale: 'Фраза «буквально: как человека, которого утешает его мать» не вполне буквально отражает мужскую лексику אִישׁ, а утверждение о нейтрализации в основном тексте не соответствует предлагаемому точному русскому варианту. Сноску следует сформулировать как пояснение мужской формы еврейского существительного.'
  revised_text: Как человека, которого утешает его мать, так Я утешу вас; и в Иерусалиме вы будете утешены.
