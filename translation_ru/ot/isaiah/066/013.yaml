  yaml_path: translation/ot/isaiah/066/013.yaml
  text: As one whom his mother comforts[a], so I will comfort you; and in Jerusalem you will be comforted.
translation:
  language: ru
  text: Как человека, которого утешает его мать, так Я утешу вас; и в Иерусалиме вы будете утешены.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּאִישׁ אֲשֶׁר אִמּוֹ תְּנַחֲמֶנּוּ
  choice: Как мать утешает своего сына
  rationale: Еврейская конструкция буквально описывает мужчину, которого утешает его мать. В русском «мать утешает своего сына» естественно передаёт личный и мужской образ сравнения, не создавая тяжеловесной конструкции.
- source_word: כֵּן אָנֹכִי אֲנַחֶמְכֶם
  choice: так Я утешу вас
  rationale: «Так» вводит вторую часть сравнения; местоимение «Я» сохраняет выраженное в еврейском тексте смысловое ударение, а «утешу» повторяет ключевой корень נחם.
- source_word: וּבִירוּשָׁלַם
  choice: и в Иерусалиме
  rationale: Предлог ב здесь обозначает место; форма «в Иерусалиме» естественна для современного русского языка.
- source_word: תְּנֻחָמוּ
  choice: вы будете утешены
  rationale: Страдательная конструкция сохраняет грамматическую форму оригинала и третий повтор корня נחם, связывающий весь стих.
theological_decisions:
- issue: Мужской образ в сравнении
  choice: «своего сына» в основном тексте
  alternative: «человека, которого утешает его мать»
  rationale: אִישׁ имеет форму мужского рода и обозначает здесь человека в единичном сравнительном образе. «Сын» естественно выражает подразумеваемое отношение к матери, а сноска сохраняет более буквальную форму и не превращает образ в гендерно нейтральный.
- issue: Место обещанного утешения
  choice: «в Иерусалиме»
  alternative: «через Иерусалим»
  rationale: Предлог и пассивная форма прямо указывают на место, где адресаты будут утешены; причинное или посредническое значение текстом не выражено.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Трёхкратный повтор корня נחם последовательно передан формами слова «утешать».
