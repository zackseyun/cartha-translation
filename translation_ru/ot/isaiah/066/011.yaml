    reason: lexical_alternative
  - marker: c
    text: Еврейское слово можно также понять как «полнота» или «избыток».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно передаёт целевое значение союза в обоих параллельных оборотах.
- source_word: תִּינְקוּ
  choice: вы питались у груди
  rationale: Глагол ינק буквально описывает сосание материнской груди; русский оборот сохраняет образ кормления и звучит естественно и достойно.
- source_word: וּשְׂבַעְתֶּם
  choice: и насыщались
  rationale: Передаёт значение сытости и полного удовлетворения от получаемой пищи.
- source_word: מִשֹּׁד תַּנְחֻמֶיהָ
  choice: у её утешающей груди
  rationale: Естественная русская передача буквального «от груди её утешений»; женский суффикс соотнесён с олицетворённым Иерусалимом в контексте.
- source_word: תָּמֹצּוּ
  choice: вы пили вволю
  rationale: Передаёт яркий образ высасывания или извлечения питья, продолжая образ грудного кормления без неестественной для русского буквальности.
- source_word: וְהִתְעַנַּגְתֶּם
  choice: и наслаждались
  rationale: Сохраняет значение глубокого удовольствия, выраженное возвратной породой глагола.
- source_word: מִזִּיז
  choice: изобилием
  rationale: Трудное существительное допускает значения изобилия, полноты или избытка; «изобилие» подходит параллелизму и не сужает образ чрезмерно.
- source_word: כְּבוֹדָהּ
  choice: её славы
  rationale: «Слава» точно и традиционно передаёт כבוד в контексте возвышения Иерусалима.
theological_decisions:
- issue: Материнский образ Иерусалима/Сиона
  choice: Сохранить прямой образ Иерусалима как матери, которая кормит и утешает своих детей.
  alternative: Обобщить образ как указание на Божье утешение, не сохраняя телесную материнскую метафору.
  rationale: Контекст олицетворяет Иерусалим как мать; перевод не заменяет этот образ отвлечённым богословским истолкованием.
- issue: Источник наслаждения во второй строке
  choice: Сохранить связь наслаждения с изобилием славы Иерусалима.
  alternative: Истолковать славу исключительно как непосредственную славу Бога.
  rationale: Женский суффикс грамматически указывает на олицетворённый Иерусалим, хотя в более широком контексте его слава зависит от Бога; перевод не устраняет эту смысловую связь.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и материнской образности. Буквально телесные выражения смягчены лишь настолько, насколько требуется для естественного и достойного русского звучания.
