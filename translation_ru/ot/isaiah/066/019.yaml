  text: וְ/שַׂמְתִּ֨י בָ/הֶ֜ם א֗וֹת וְ/שִׁלַּחְתִּ֣י מֵ/הֶ֣ם פְּ֠לֵיטִים אֶֽל הַ/גּוֹיִ֞ם תַּרְשִׁ֨ישׁ פּ֥וּל וְ/ל֛וּד מֹ֥שְׁכֵי קֶ֖שֶׁת תֻּבַ֣ל וְ/יָוָ֑ן הָ/אִיִּ֣ים הָ/רְחֹקִ֗ים אֲשֶׁ֨ר לֹא שָׁמְע֤וּ אֶת שִׁמְעִ/י֙ וְ/לֹא רָא֣וּ אֶת כְּבוֹדִ֔/י וְ/הִגִּ֥ידוּ אֶת כְּבוֹדִ֖/י בַּ/גּוֹיִֽם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/019.yaml
  text: And I will set a sign among them[a], and from them I will send survivors to the nations—to Tarshish, Pul, and Lud, who draw the bow; to Tubal and Javan[d][c][b]; to the distant coastlands that have not heard my report and have not seen my glory—and they will declare my glory among the nations.
translation:
  language: ru
  text: 'И поставлю среди них знамение[a] и пошлю из них уцелевших к народам: в Таршиш, Пул и Луд — к натягивающим лук[b], в Тувал и Яван, на далёкие побережья[c], которые не слышали Моей вести[d] и не видели Моей славы. И они возвестят Мою славу среди народов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «в них» или «на них»; еврейский предлог допускает несколько оттенков смысла.'
    reason: lexical_alternative
  - marker: b
    text: 'Слова «натягивающим лук» вероятнее всего относятся к Луду; возможен и более общий перевод: «лучникам».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на далёкие острова»; еврейское слово может обозначать как острова, так и приморские земли.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «не слышали обо Мне» либо «не слышали о Моей славе». Еврейское выражение может означать весть, молву или известность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: И поставлю
  rationale: Глагол שׂים означает «поставить, поместить»; «поставлю знамение» передаёт намеренное действие Бога и естественно звучит по-русски.
- source_word: בָהֶם
  choice: среди них
  rationale: Предлог ב допускает значения «в, на, среди». В отношении группы «среди них» наиболее естественно и не уточняет природу или место знамения.
- source_word: אוֹת
  choice: знамение
  rationale: אוֹת может обозначать знамение, знак или отличительную метку. «Знамение» сохраняет широкий смысл и возвышенный пророческий регистр.
- source_word: פְּלֵיטִים
  choice: уцелевших
  rationale: Слово обозначает спасшихся или переживших бедствие. Субстантивированное «уцелевших» точно и естественно связано с судом в контексте.
- source_word: אֶל הַגּוֹיִם
  choice: к народам
  rationale: גּוֹיִם здесь обозначает чужеземные народы; перевод не вводит более узкое богословское противопоставление «иудеев» и «язычников».
- source_word: תַּרְשִׁישׁ פּוּל וְלוּד ... תֻּבַל וְיָוָן
  choice: Таршиш, Пул и Луд ... Тувал и Яван
  rationale: Имена переданы современной русской транслитерацией, близкой к еврейскому звучанию.
- source_word: מֹשְׁכֵי קֶשֶׁת
  choice: натягивающих лук
  rationale: Буквальный образ «тянущих/натягивающих лук» сохранён; грамматически оборот естественнее всего относится к Луду.
- source_word: הָאִיִּים הָרְחֹקִים
  choice: далёкие побережья
  rationale: אִיִּים может обозначать острова или приморские земли. «Побережья» сохраняет широкий географический смысл, а вариант «острова» отмечен в сноске.
- source_word: אֲשֶׁר לֹא שָׁמְעוּ אֶת שִׁמְעִי
  choice: которые не слышали вести обо Мне
  rationale: 'שֵׁמַע обозначает то, что слышат о ком-либо: весть, молву или славу. «Весть обо Мне» близка конструкции оригинала и понятна современному читателю.'
- source_word: וְהִגִּידוּ אֶת כְּבוֹדִי
  choice: И они возвестят Мою славу
  rationale: נגד в форме hифиль означает сообщать или возвещать; «возвестят» соответствует пророческому регистру, а כָּבוֹד последовательно передано как «слава».
theological_decisions:
- issue: Природа знамения, поставленного Богом
  choice: Сохранено общее слово «знамение» без пояснения его формы.
  alternative: «метка на них» или «знамя среди них»
  rationale: Еврейский текст не определяет, является ли это чудесным знаком, меткой на людях или видимым сигналом; конкретизация сняла бы подлинную неоднозначность.
- issue: К кому относятся местоимения «них» и «из них»
  choice: Местоимения сохранены без явного обозначения группы.
  alternative: Прямо назвать Израиль, уцелевших или поклоняющихся из ближайшего контекста.
  rationale: Сам стих не повторяет существительное, поэтому перевод не должен искусственно сужать референт.
- issue: К кому относится выражение «натягивающих лук»
  choice: В основном тексте оборот согласован с ближайшим названием «Луд».
  alternative: Понять выражение обобщённо как отдельное указание на лучников.
  rationale: Синтаксически определение наиболее естественно относится к Луду, однако структура перечня допускает менее узкое прочтение, указанное в сноске.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис расчленён на два предложения ради ясности длинного перечня; повтор «Мою славу» сохранён. Имена транслитерированы непосредственно с еврейского: Таршиш, Тувал, Яван.'
