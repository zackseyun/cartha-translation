base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/014.yaml
  text: You will see[a], and your heart will rejoice; your bones will flourish like the grass. The hand of Yahweh will be made known to his servants, and he will be indignant against his enemies.
translation:
  language: ru
  text: Вы увидите, и сердце ваше возрадуется; ваши кости расцветут, как трава. Рука Яхве станет явной Его служителям, и[a] Он разгневается на Своих врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «а Он разгневается на Своих врагов». Союз может подчёркивать противопоставление между отношением Яхве к Его служителям и к Его врагам.'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Вы увидите
  rationale: Форма второго лица множественного числа в пророческом контексте естественно передаётся будущим временем; начальный союз не обязательно выражать отдельно, поскольку связь сохраняется последующим «и».
- source_word: וְשָׂשׂ לִבְּכֶם
  choice: и сердце ваше возрадуется
  rationale: Сохранены единственное число собирательного образа «сердце» и сильное, но понятное современному читателю обозначение радости.
- source_word: וְעַצְמוֹתֵיכֶם כַּדֶּשֶׁא תִפְרַחְנָה
  choice: кости ваши расцветут, словно трава
  rationale: Буквенный образ костей передаёт глубокое телесное обновление; «расцветут» сохраняет метафору роста, а «трава» прямо соответствует דֶּשֶׁא.
- source_word: וְנוֹדְעָה יַד יְהוָה אֶת עֲבָדָיו
  choice: Рука Яхве даст знать о себе Его служителям
  rationale: Идиома «рука» сохранена как образ действенной силы. Русское «даст знать о себе» естественно передаёт результативно-пассивный смысл Niphal ידע — рука станет явной или узнаваемой. «Служителям» выражает принадлежность и служение Богу без ненужного акцента на социальном рабстве.
- source_word: וְזָעַם אֶת אֹיְבָיו
  choice: и Он разгневается на Своих врагов
  rationale: Глагол передан как состояние и проявление гнева без добавления конкретного действия, которого еврейский текст не называет; объект естественно оформлен русским «на».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Смысл союза перед заключительной фразой וְזָעַם
  choice: и Он разгневается
  alternative: а Он разгневается
  rationale: Основной текст прямо сохраняет обычное соединительное значение וְ, не делая подразумеваемое противопоставление грамматически более явным, чем в источнике.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены конкретные библейские образы «сердце», «кости» и «рука», но синтаксис сделан естественным для современного читателя.
