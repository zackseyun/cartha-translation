source:
  edition: WLC
  text: שִׁמְעוּ֙ דְּבַר יְהוָ֔ה הַ/חֲרֵדִ֖ים אֶל דְּבָר֑/וֹ אָמְרוּ֩ אֲחֵי/כֶ֨ם שֹׂנְאֵי/כֶ֜ם מְנַדֵּי/כֶ֗ם לְמַ֤עַן שְׁמִ/י֙ יִכְבַּ֣ד יְהוָ֔ה וְ/נִרְאֶ֥ה בְ/שִׂמְחַתְ/כֶ֖ם וְ/הֵ֥ם יֵבֹֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/005.yaml
  text: 'Hear the word of Yahweh[a], you who tremble at his word: Your brothers who hate you, who cast you out for my name’s sake, have said, “Let Yahweh be glorified, that we may see your joy”[b]; but they will be put to shame.'
translation:
  language: ru
  text: 'Услышьте слово Яхве, трепещущие перед Его словом! Ваши братья, которые ненавидят вас и изгоняют вас[a] из-за Моего имени, сказали: «Пусть прославится Яхве, и мы увидим вашу радость!»[b] Но они будут посрамлены.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исключают вас», «удаляют вас».'
    reason: Глагол מְנַדֵּיכֶם допускает значения изгнания, удаления и социально-религиозного исключения.
  - marker: b
    text: 'Буквально: «Пусть прославится Яхве, и мы увидим вашу радость». Вероятно, это насмешка гонителей над верными; возможно также менее ироничное понимание: «Пусть Яхве будет прославлен, и да увидим мы вашу радость». Некоторые иначе понимают вторую часть как указание на явление Бога, однако масоретская форма лучше соответствует «мы увидим».'
    reason: Цитата сохраняет неоднозначность тона и содержит спорную интерпретацию формы וְנִרְאֶה.
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Услышьте
  rationale: Повелительная форма множественного числа передана прямым пророческим призывом; «услышьте» означает не только восприятие звука, но и внимательное принятие вести.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранён устойчивый пророческий оборот и личное имя, прямо представленное тетраграмматоном.
- source_word: הַחֲרֵדִים אֶל דְּבָרוֹ
  choice: трепещущие перед Его словом
  rationale: Причастие חרד выражает трепет, связанный с благоговейным страхом; «перед Его словом» естественно по-русски и сохраняет образ.
- source_word: אֲחֵיכֶם
  choice: ваши братья
  rationale: Сохранён буквальный родственный термин, который в контексте, вероятно, обозначает соплеменников и усиливает горечь отвержения.
- source_word: מְנַדֵּיכֶם
  choice: изгоняют вас
  rationale: Форма может означать удаление, изгнание или исключение; «изгоняют» сохраняет силу действия, не сужая его исключительно до формального религиозного отлучения.
- source_word: לְמַעַן שְׁמִי
  choice: за Моё имя
  rationale: Краткая русская формулировка сохраняет связь преследования с Божьим именем и допускает оттенок заявленного основания или предлога.
- source_word: יִכְבַּד יְהוָה
  choice: Пусть прославится Яхве
  rationale: Юссивное значение имперфекта передано пожеланием; пассивно-возвратная русская форма сохраняет намеренную двусмысленность благочестиво звучащей реплики.
- source_word: וְנִרְאֶה בְשִׂמְחַתְכֶם
  choice: и мы увидим вашу радость
  rationale: Масоретская форма естественнее всего понимается как первое лицо множественного числа «мы увидим»; предлог ב передан идиоматически.
- source_word: יֵבֹשׁוּ
  choice: они будут посрамлены
  rationale: Передаёт предсказанное публичное поражение и позор, а не только внутреннее чувство стыда.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и соответствует современному литературному русскому употреблению.
- issue: Характер речи в цитате
  choice: Сохранена как внешне благочестивая реплика, вероятно имеющая насмешливый оттенок
  alternative: Искреннее пожелание прославления Бога либо нейтральное высказывание
  rationale: Ненависть и изгнание верных, а также заключительное обещание посрамления говорящих указывают на насмешку, однако сам текст не маркирует её прямо, поэтому она пояснена в сноске, а не встроена в перевод.
- issue: Субъект формы וְנִרְאֶה
  choice: «мы увидим» — преследователи увидят радость верных
  alternative: «Он явится» — речь о явлении Бога в радости верных
  rationale: Безогласовочная форма допускает обсуждение, но масоретская вокализация и морфология поддерживают первое лицо множественного числа; альтернативное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис сделан ясным для широкого читателя, при этом сохранены повтор «слово», обращение «ваши братья» и напряжение между благочестиво звучащей репликой гонителей и их будущим посрамлением.
