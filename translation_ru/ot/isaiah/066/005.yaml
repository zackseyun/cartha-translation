  source_fidelity: 'В целом перевод точно передаёт структуру и смысл еврейского текста: обращение к трепещущим перед словом Яхве, враждебность «братьев», их исключение адресатов и итоговое посрамление гонителей сохранены. Однако настоящее «говорят» сглаживает форму qatal אָמְרוּ; нейтральное «сказали» ближе к тексту. Оборот «за Моё имя» по-русски неясен и может быть воспринят как плата или наказание; «из-за Моего имени» естественно передаёт указанное основание/предлог.'
