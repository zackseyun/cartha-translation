  text: וְ/הָיָ֗ה מִֽ/דֵּי חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ וּ/מִ/דֵּ֥י שַׁבָּ֖ת בְּ/שַׁבַּתּ֑/וֹ יָב֧וֹא כָל בָּשָׂ֛ר לְ/הִשְׁתַּחֲוֺ֥ת לְ/פָנַ֖/י אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/023.yaml
  text: And it shall be[a], from new moon to its new moon and from Sabbath to its Sabbath, all flesh shall come to bow down before me[b], says Yahweh.
translation:
  language: ru
  text: 'И будет так: от новолуния до новолуния и от субботы до субботы[a] всякая плоть[b] будет приходить, чтобы поклониться передо Мной, — говорит Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждое новолуние и каждую субботу». Еврейский оборот обозначает регулярное повторение.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «всякая плоть» здесь может означать всё человечество, сохраняя при этом образ телесной, сотворённой жизни.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет так
  rationale: Передаёт обычную пророческую формулу, указывающую на будущее положение дел, естественно и торжественно по-русски.
- source_word: מִדֵּי חֹדֶשׁ בְּחָדְשׁוֹ
  choice: от новолуния до новолуния
  rationale: Оборот обозначает регулярное повторение. В параллели с субботой חֹדֶשׁ лучше понимать как культовое новолуние, а не просто календарный месяц; еврейский суффикс не воспроизводится буквально, поскольку по-русски это звучало бы неестественно.
- source_word: וּמִדֵּי שַׁבָּת בְּשַׁבַּתּוֹ
  choice: и от субботы до субботы
  rationale: Сохраняет параллелизм и обозначение регулярного еженедельного поклонения, не заменяя богословски значимое слово «суббота» словом «неделя».
- source_word: יָבוֹא
  choice: будет приходить
  rationale: Длительная форма естественно выражает повторяющееся в будущем движение к месту поклонения.
- source_word: כָל בָּשָׂר
  choice: всякая плоть
  rationale: Сохраняет ёмкий еврейский библейский оборот, который в данном контексте прежде всего относится ко всему человечеству, но также несёт оттенок телесной, сотворённой жизни.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: чтобы поклониться
  rationale: Русский глагол передаёт как телесное склонение, так и его культовый смысл; более буквальное «пасть ниц» чрезмерно уточняло бы конкретную позу.
- source_word: לְפָנַי
  choice: передо Мной
  rationale: Передаёт пребывание непосредственно перед Богом; форма «передо» здесь благозвучна и соответствует возвышенному, но современному регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, не подменяя его титулом.
theological_decisions:
- issue: Обозначает ли חֹדֶשׁ месяц вообще или праздник новолуния
  choice: новолуние
  alternative: месяц
  rationale: Параллель с субботой и контекст регулярного поклонения поддерживают культовое значение «новолуние». Перевод не делает дополнительных выводов о продолжении календарных установлений.
- issue: Следует ли сузить כָל בָּשָׂר до значения «все люди»
  choice: всякая плоть
  alternative: все люди; всё человечество
  rationale: Сохранён исходный образ и его смысловая широта. В контексте наиболее вероятно всеобщее человеческое поклонение, однако текст не сужен сильнее, чем позволяет еврейское выражение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Библейский оборот «всякая плоть» намеренно сохранён и пояснён; неестественное буквальное воспроизведение притяжательных суффиксов при «новолунии» и «субботе» не используется.
