source:
  edition: WLC
  text: וְ/יָצְא֣וּ וְ/רָא֔וּ בְּ/פִגְרֵי֙ הָ/אֲנָשִׁ֔ים הַ/פֹּשְׁעִ֖ים בִּ֑/י כִּ֣י תוֹלַעְתָּ֞/ם לֹ֣א תָמ֗וּת וְ/אִשָּׁ/ם֙ לֹ֣א תִכְבֶּ֔ה וְ/הָי֥וּ דֵרָא֖וֹן לְ/כָל בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/024.yaml
  text: And they will go out and look on the corpses of the men who rebelled against me[a]. For their worm will not die, and their fire will not be quenched[c][b], and they will be an abhorrence to all flesh.
translation:
  language: ru
  text: 'И они выйдут и увидят трупы людей, восставших против Меня: их червь[a] не умрёт, и их огонь не угаснет, и они будут омерзением[b] для всякой плоти[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их личинка» или «их опарыш»; еврейское слово может обозначать червя, личинку либо опарыша.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ужасом», «чем-то отвратительным».'
    reason: lexical_alternative
  - marker: c
    text: «Всякая плоть» — древнееврейское выражение, означающее всех людей, всё человечество.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָצְאוּ וְרָאוּ
  choice: И они выйдут и увидят
  rationale: Последовательность глагольных форм продолжает перспективу будущего; сочетание ראה с ב указывает на созерцание объекта. По-русски «увидят» естественно передаёт смысл, не добавляя оттенка длительного разглядывания.
- source_word: בְּפִגְרֵי
  choice: трупы
  rationale: פגר обозначает мёртвое тело, труп. Это точное и достаточно строгое слово, сохраняющее резкость образа.
- source_word: הָאֲנָשִׁים
  choice: людей
  rationale: В данном контексте множественное אֲנָשִׁים обозначает конкретных людей. Русское «мужчин» неоправданно подчёркивало бы пол, тогда как «людей» естественно и точно называет группу человеческих существ.
- source_word: הַפֹּשְׁעִים בִּי
  choice: восставших против Меня
  rationale: פשׁע выражает не просто проступок, а мятеж, сознательное противление. «Восставших против Меня» сохраняет направленность неповиновения Богу.
- source_word: כִּי
  choice: ':'
  rationale: כִּי вводит объяснение увиденного. В русском двоеточие естественно и ясно передаёт эту пояснительную связь без утяжеления союзом «ибо».
- source_word: תוֹלַעְתָּם
  choice: их червь
  rationale: תולעת может обозначать червя, личинку или опарыша. «Червь» лексически допустим, сохраняет образ и его межтекстовые связи; вариант отмечен в сноске.
- source_word: לֹא תָמוּת
  choice: не умрёт
  rationale: Будущее время согласуется с пророческой перспективой и буквально сохраняет сказуемое «умереть».
- source_word: וְאִשָּׁם לֹא תִכְבֶּה
  choice: и их огонь не угаснет
  rationale: Притяжательный суффикс передан как «их», то есть связанный с ними огонь; כבה применительно к огню естественно переводится «угаснуть».
- source_word: דֵרָאוֹן
  choice: омерзением
  rationale: Редкое существительное обозначает предмет отвращения, нечто отвратительное. «Омерзение» сохраняет именную форму и сильную оценочную окраску.
- source_word: לְכָל בָּשָׂר
  choice: для всякой плоти
  rationale: Формально сохраняется древнееврейское выражение «всякая плоть», означающее всех людей; смысл пояснён в сноске.
theological_decisions:
- issue: Характер образов суда
  choice: Сохранить конкретные образы трупов, неумирающего червя и неугасающего огня без догматического уточнения их механики.
  alternative: Передать образы как чистую метафору либо прямо истолковать их как исчерпывающее описание вечного сознательного наказания.
  rationale: Сам стих описывает видимые последствия Божьего суда, но не объясняет, как именно следует систематизировать эти образы. Перевод сохраняет напряжение текста и не решает вопрос за него.
- issue: Значение הָאֲנָשִׁים
  choice: людей
  alternative: мужчин
  rationale: Хотя форма грамматически мужского рода, אֲנָשִׁים обычно служит множественным числом слова «человек». Контекст не акцентирует мужской пол осуждённых, поэтому «людей» точнее по-русски и не превращает грамматический род в дополнительное утверждение.
- issue: Референт местоимения в וְהָיוּ
  choice: «они» относится к трупам/восставшим людям, которые становятся предметом всеобщего отвращения.
  alternative: Понимать «они» как червя и огонь либо отвлечённо как картину суда.
  rationale: Множественная форма естественно возвращает читателя к множественному человеческому референту; формулировка не добавляет дальнейших утверждений о состоянии этих людей.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Сохранены резкие предметные образы исходного текста и выражение «всякая плоть»; архаизмы вроде «воззрят» и «не потухнет» не использованы. Заглавная буква в «Меня» следует принятой русской библейской практике для речи Бога.
