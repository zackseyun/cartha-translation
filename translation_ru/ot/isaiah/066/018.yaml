base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/018.yaml
  text: For I know their works and their thoughts[a]. The time is coming to gather all the nations and tongues[b], and they will come and see my glory.
translation:
  language: ru
  text: Ибо Я знаю их дела и их мысли[a]. Наступает время собрать все народы и языки[b]; они придут и увидят Мою славу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь обрывочен и синтаксически труден. Дословно его элементы можно передать так: «И Я — их дела и их мысли — приходит/идёт, чтобы собрать все народы и языки». Возможны, в частности, такие смысловые понимания: «Ибо Я знаю их дела и их мысли» или «Наступает время собрать все народы и языки».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «языковые группы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Ибо Я
  rationale: Самостоятельное אָנֹכִי подчёркивает говорящего; союз передан как «ибо» в рамках принятого смыслового восполнения «Я знаю», связывающего стих с контекстом суда.
- source_word: מַעֲשֵׂיהֶם
  choice: их дела
  rationale: «Дела» естественно передаёт нравственно значимые поступки и хорошо сочетается с «мыслями».
- source_word: וּמַחְשְׁבֹתֵיהֶם
  choice: и их мысли
  rationale: «Мысли» сохраняет наиболее широкое значение слова, не сужая его до замыслов или намерений.
- source_word: בָּאָה לְקַבֵּץ
  choice: Наступает время собрать
  rationale: Женская форма בָּאָה синтаксически трудна; формулировка передаёт будущее действие естественным русским языком, а буквальная шероховатость отмечена в сноске.
- source_word: כָּל־הַגּוֹיִם
  choice: все народы
  rationale: Передаёт всемирный охват без привнесения новозаветного противопоставления иудеев и язычников.
- source_word: וְהַלְּשֹׁנוֹת
  choice: и языки
  rationale: Сохраняет буквальный образ еврейского текста и одновременно допускает значение языковых сообществ; альтернатива пояснена в сноске.
- source_word: וּבָאוּ וְרָאוּ
  choice: они придут и увидят
  rationale: Формы переданы будущим временем согласно пророческой последовательности.
- source_word: כְּבוֹדִי
  choice: Мою славу
  rationale: «Слава» сохраняет богословскую весомость כָּבוֹד и устойчивое словоупотребление книги Исаии.
theological_decisions:
- issue: Передача трудного начала стиха
  choice: «Ибо Я знаю их дела и их мысли. Наступает время собрать…»
  alternative: «И Я — их дела и их мысли — иду собрать…» или «Что до Меня, из-за их дел и мыслей Я иду собрать…»
  rationale: Масоретский текст эллиптичен и синтаксически обрывочен. Основной текст использует широко принятое смысловое восполнение для ясности современному читателю, но сноска прямо сохраняет буквальную трудность и основные варианты понимания, не выдавая одно разрешение за несомненное.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Прописные местоимения при обращении Бога к Себе соответствуют принятой русской библейской традиции. Пунктуация разделяет два смысловых восполнения трудной еврейской конструкции; подлинная неоднозначность сохранена в сноске.
