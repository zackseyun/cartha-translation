lexical_decisions:
- source_word: בְּטֶרֶם
  choice: прежде чем
  rationale: Естественно передаёт временное значение «до того как»; повтор сохранён в обеих частях стиха.
- source_word: תָּחִיל
  choice: у неё начались родовые схватки
  rationale: В контексте родов форма от חול обозначает мучительные схватки; современное выражение ясно передаёт смысл без архаизма.
- source_word: יָלָדָה
  choice: она родила
  rationale: Прямой и естественный русский эквивалент обычного глагола рождения.
- source_word: יָבֹא
  choice: пришла к ней
  rationale: Сохраняет образ боли, приходящей к женщине, и явно передаёт еврейскую конструкцию с לָהּ.
- source_word: חֵבֶל
  choice: боль
  rationale: В данном контексте речь о родовой боли; краткий вариант избегает тяжеловесного повторения после упоминания схваток.
- source_word: וְהִמְלִיטָה
  choice: она произвела на свет
  rationale: Хифиль от מלט здесь означает рождение ребёнка; выражение естественно по-русски и передаёт результат родов.
- source_word: זָכָר
  choice: сына
  rationale: Буквально «мужского пола»; в контексте рождения «сына» звучит естественно, сохраняя указание на пол ребёнка.
theological_decisions:
- issue: Кого обозначает женщина
  choice: В основном тексте сохранена ссылка через местоимение «она», без прямого называния Сиона или Иерусалима.
  alternative: Сион; Иерусалим; народ Божий.
  rationale: Контекст указывает на Сион/Иерусалим, однако сам стих выражает субъект формами женского рода и местоимением. Сохранение образа не превращает контекстуальное толкование в явную часть текста.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Параллелизм и повтор בְּטֶרֶם переданы симметричной конструкцией «прежде чем». Маркер сноски помещён после всего стиха, поскольку поясняет женский субъект обеих частей.
