  yaml_path: translation/ot/isaiah/066/007.yaml
  text: Before she was in labor[a], she gave birth; before pain came upon her[b], she delivered a son.
translation:
  language: ru
  text: Прежде чем у неё начались родовые схватки, она родила; прежде чем пришла к ней боль, она произвела на свет сына.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Женский образ в ближайшем контексте относится к Сиону/Иерусалиму.
