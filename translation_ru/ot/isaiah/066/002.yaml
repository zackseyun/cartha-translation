id: ISA.66.2
reference: Isaiah 66:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אֶת כָּל אֵ֨לֶּה֙ יָדִ֣/י עָשָׂ֔תָה וַ/יִּהְי֥וּ כָל אֵ֖לֶּה נְאֻם יְהוָ֑ה וְ/אֶל זֶ֣ה אַבִּ֔יט אֶל עָנִי֙ וּ/נְכֵה ר֔וּחַ וְ/חָרֵ֖ד עַל דְּבָרִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/002.yaml
  text: 'My hand made all these things[a], and so all these things came to be, declares Yahweh. But to this one I will look: to the poor and contrite in spirit, and the one who trembles at my word.'
translation:
  language: ru
  text: '«Всё это сотворила Моя рука, и всё это возникло, — возвещает Яхве. — Но вот на кого Я обращу взор: на бедного и сокрушённого духом[a], на того, кто трепещет перед Моим словом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «угнетённого и сломленного духом».'
    reason: Лексемы עָנִי и נְכֵה допускают оттенки бедности, угнетённости, поражённости и внутренней сломленности.
lexical_decisions:
- source_word: יָדִי עָשָׂתָה
  choice: сотворила Моя рука
  rationale: Сохраняет антропоморфный образ еврейского текста и завершённость действия; «сотворила» естественно в контексте неба и земли.
- source_word: כָּל אֵלֶּה
  choice: всё это
  rationale: Естественно передаёт множественное указание на небо, землю и всё связанное с ними без ненужного добавления существительного.
- source_word: וַיִּהְיוּ
  choice: возникло
  rationale: Передаёт наступившее существование как результат Божьего творения, а не просто статичное «было».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественную пророческую формулу и передаёт тетраграмматон личным именем.
- source_word: וְאֶל זֶה אַבִּיט
  choice: Но вот на кого Я обращу взор
  rationale: Передаёт контраст, указательное выделение человека и еврейский образ благосклонного взгляда, не сводя его к отвлечённому «обращу внимание».
- source_word: עָנִי
  choice: бедного
  rationale: Сохраняет основной смысл бедности и нужды, не устраняя возможные оттенки угнетённости и смирения.
- source_word: נְכֵה רוּחַ
  choice: сокрушённого духом
  rationale: Естественное и достойное русское выражение для человека, чей дух поражён или сломлен; оно сохраняет образ внутренней сокрушённости.
- source_word: חָרֵד עַל דְּבָרִי
  choice: того, кто трепещет перед Моим словом
  rationale: Передаёт благоговейный страх перед Божьим словом и сохраняет единственное число דְּבָרִי.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В исходном тексте прямо стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя и соответствует предоставленному богословскому решению.
- issue: Характер Божьего взгляда в אֶל זֶה אַבִּיט
  choice: обращу взор
  alternative: посмотрю; обращу внимание
  rationale: Формулировка сохраняет образность и не добавляет прямо не выраженного определения «благосклонно», хотя контекст допускает такой смысл.
- issue: Значение עָנִי וּנְכֵה רוּחַ
  choice: бедного и сокрушённого духом
  alternative: угнетённого и сломленного духом; смиренного и сокрушённого духом
  rationale: Выбор не превращает социальную или пережитую беду исключительно в духовную добродетель и сохраняет смысловую напряжённость выражения.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Образ «Моя рука» и формула «обращу взор» сохранены; синтаксис слегка перестроен ради ясности. Местоимения, относящиеся к Богу, даны с прописной буквы в соответствии с принятой русской библейской традицией.
