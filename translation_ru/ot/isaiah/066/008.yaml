source:
  edition: WLC
  text: מִֽי שָׁמַ֣ע כָּ/זֹ֗את מִ֤י רָאָה֙ כָּ/אֵ֔לֶּה הֲ/י֤וּחַל אֶ֨רֶץ֙ בְּ/י֣וֹם אֶחָ֔ד אִם יִוָּ֥לֵֽד גּ֖וֹי פַּ֣עַם אֶחָ֑ת כִּֽי חָ֛לָה גַּם יָלְדָ֥ה צִיּ֖וֹן אֶת בָּנֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/008.yaml
  text: Who has heard such a thing? Who has seen things like these? Can a land be brought forth in one day? Can a nation be born all at once? For Zion was in labor and also gave birth to her children[a].
translation:
  language: ru
  text: 'Кто слышал такое? Кто видел подобные вещи? Может ли страна появиться на свет за один день? Может ли народ родиться разом? Ибо Сион: она мучилась родами и родила своих детей[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, буквальнее: «своих сыновей».'
    reason: Лексическая альтернатива для בָּנֶיהָ.
lexical_decisions:
- source_word: כָּזֹאת / כָּאֵלֶּה
  choice: о подобном / нечто такое
  rationale: Передаёт единственное и множественное указательные выражения естественными русскими риторическими оборотами, не сглаживая параллелизм двух вопросов.
- source_word: הֲיוּחַל אֶרֶץ
  choice: может ли страна появиться на свет
  rationale: «Страна» соответствует контекстуальному значению אֶרֶץ в параллели с «народом», а «появиться на свет» сохраняет образ рождения и звучит естественнее буквального «быть рождённой».
- source_word: בְּיוֹם אֶחָד
  choice: за один день
  rationale: Предлог בְּ здесь обозначает срок, в пределах которого совершается событие; русский оборот «за один день» ясно выражает эту мысль.
- source_word: אִם יִוָּלֵד גּוֹי
  choice: может ли народ родиться
  rationale: אִם продолжает риторический вопрос, а пассивная форма יִוָּלֵד прямо передаётся возвратным глаголом «родиться».
- source_word: פַּעַם אֶחָת
  choice: разом
  rationale: Кратко и естественно передаёт однократность и одновременность, не добавляя отсутствующего в тексте указания на буквальный миг.
- source_word: כִּי
  choice: а ведь
  rationale: Выражает пояснительно-усилительную связь с предшествующими вопросами и их оттенок изумления; причинное значение союза сохраняется прагматически.
- source_word: חָלָה
  choice: испытал родовые муки
  rationale: Сохраняет конкретный образ родов и избегает архаичного либо неестественного русского выражения.
- source_word: גַּם יָלְדָה
  choice: и родил
  rationale: Союз «и» передаёт координирующую силу גַּם, не вводя значения «едва… как», которого форма сама по себе не требует.
- source_word: בָּנֶיהָ
  choice: своих детей
  rationale: В контексте речь идёт о потомстве Сиона как совокупности; буквальное «сыновей» приведено в сноске.
theological_decisions:
- issue: Олицетворение Сиона в образе матери
  choice: Сохранить Сион как рождающего субъекта
  alternative: Передать образ отвлечённо как внезапное восстановление страны и народа
  rationale: Еврейский текст прямо приписывает Сиону родовые муки и рождение; перевод сохраняет это напряжённое олицетворение, несмотря на грамматический мужской род слова «Сион» в русском.
- issue: Родовое значение בָּנֶיהָ
  choice: «своих детей» в основном тексте
  alternative: «своих сыновей»
  rationale: Мужское множественное число может обозначать потомство в целом; нейтральное по полу коллективное значение уместно в основном тексте, а формально более буквальный вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной пророческой риторики. Формула «появиться на свет» поддерживает сквозной образ рождения, а «разом» сохраняет краткость и силу еврейского параллелизма. Грамматически мужские формы при слове «Сион» естественны для русского языка и при этом не устраняют материнскую метафору.
