  rationale: 'Исправлены число указательных выражений в первых двух вопросах и родовое оформление образа Сиона как роженицы. «Она мучилась родами и родила» передаёт два еврейских глагола без добавления временной последовательности вроде «едва… как». «Ибо» сохраняет пояснительную связь כִּי. Основные соответствия: הֲיוּחַל אֶרֶץ — «может ли страна появиться на свет», יִוָּלֵד גּוֹי — «может ли народ родиться», פַּעַם אֶחָת — «разом».'
