source:
  edition: WLC
  text: גַּם אֲנִ֞י אֶבְחַ֣ר בְּ/תַעֲלֻלֵי/הֶ֗ם וּ/מְגֽוּרֹתָ/ם֙ אָבִ֣יא לָ/הֶ֔ם יַ֤עַן קָרָ֨אתִי֙ וְ/אֵ֣ין עוֹנֶ֔ה דִּבַּ֖רְתִּי וְ/לֹ֣א שָׁמֵ֑עוּ וַ/יַּעֲשׂ֤וּ הָ/רַע֙ בְּ/עֵינַ֔/י וּ/בַ/אֲשֶׁ֥ר לֹֽא חָפַ֖צְתִּי בָּחָֽרוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/004.yaml
  text: So I also will choose harsh treatment for them[a], and I will bring their fears upon them, because I called and no one answered, I spoke and they did not listen; they did what was evil in my eyes[b], and chose what I did not delight in.
translation:
  language: ru
  text: Так и Я изберу для них суровую участь[a] и наведу на них то, чего они страшатся[b], потому что Я звал — и никто не ответил, говорил — и они не слушали; они делали зло в Моих глазах и избрали то, что Мне неугодно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «издевательство над ними», «их заблуждения» или «жестокое обращение с ними». Значение еврейского слова תַעֲלֻלֵיהֶם не вполне ясно; здесь оно может обозначать суровое или унизительное обращение как наказание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их страхи»; то есть то, чего они страшатся.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Так и Я
  rationale: 'Передаёт эмфатическое соответствие: как они избрали неугодное Богу, так и Он изберёт для них воздаяние.'
- source_word: אֶבְחַר
  choice: изберу
  rationale: Сохраняет глагол «избирать» и намеренную перекличку с заключительным בָּחָרוּ («избрали»).
- source_word: בְּתַעֲלֻלֵיהֶם
  choice: для них суровую участь
  rationale: Трудное слово может обозначать жестокое, издевательское или произвольное обращение. В контексте суда перевод передаёт назначенное им тяжёлое воздаяние, не приписывая Богу избрание их злых поступков.
- source_word: וּמְגוּרֹתָם
  choice: то, чего они страшатся
  rationale: Существительное может обозначать как страх, так и предмет страха; развёрнутый перевод естественно сочетается с «наведу на них».
- source_word: אָבִיא לָהֶם
  choice: наведу на них
  rationale: Естественно передаёт направленное против них бедствие в контексте суда.
- source_word: יַעַן
  choice: потому что
  rationale: Ясно вводит основание суда.
- source_word: קָרָאתִי וְאֵין עוֹנֶה
  choice: Я звал — и никто не ответил
  rationale: Передаёт отсутствие личного отклика; тире естественно оформляет присоединённый результат.
- source_word: דִּבַּרְתִּי וְלֹא שָׁמֵעוּ
  choice: говорил — и они не слушали
  rationale: В контексте обличения שׁמע означает не просто слышать звук, а внимать и повиноваться.
- source_word: וַיַּעֲשׂוּ הָרַע בְּעֵינַי
  choice: они делали зло в Моих глазах
  rationale: Сохраняет устойчивый древнееврейский образ оценки поступков Богом и остаётся понятным по-русски.
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בָּחָרוּ
  choice: и избрали то, что Мне неугодно
  rationale: «Неугодно» естественно передаёт отсутствие Божьего желания и благоволения, сохраняя контраст между человеческим и Божьим выбором.
theological_decisions:
- issue: Характер Божьего ответа в суде
  choice: Бог избирает для народа суровую участь как судебное воздаяние за его выбор.
  alternative: Бог избирает их заблуждения или порочные действия, предавая их последствиям собственного выбора.
  rationale: Связь со словами «наведу на них то, чего они страшатся» поддерживает смысл наказания и воздаяния. Сноска сохраняет лексическую неоднозначность, не устраняя напряжение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и повтор «изберу / избрали» сохранены. Прописные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской издательской традиции.
