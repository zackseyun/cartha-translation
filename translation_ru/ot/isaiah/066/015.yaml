base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/015.yaml
  text: For look[a], Yahweh will come in fire, and his chariots like the whirlwind[c][b], to repay his anger in fury and his rebuke with flames of fire.
translation:
  language: ru
  text: Ибо вот, Яхве придёт в огне[a], и колесницы Его — словно вихрь[b], чтобы в ярости обрушить Свой гнев, а в пламени огня — Своё обличение[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с огнём»; еврейский предлог может указывать как на сферу явления, так и на сопровождение или средство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «словно буря», «словно ураган».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский глагол может означать «вернуть», «обратить назад» или, в контексте суда, «воздать». Буквально: «чтобы в ярости возвратить Свой гнев и в пламени огня — Своё обличение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ибо вот
  rationale: כִּי связывает стих с предшествующим контекстом как основание или пояснение, а הִנֵּה живо привлекает внимание. Сочетание «ибо вот» сохраняет обе функции и уместно в современной литературной речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, непосредственно стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: בָּאֵשׁ יָבוֹא
  choice: придёт в огне
  rationale: Буквально и образно передаёт предлог בְּ, не уточняя сверх текста, является ли огонь средой явления или сопровождающим орудием.
- source_word: וְכַסּוּפָה מַרְכְּבֹתָיו
  choice: и колесницы Его — словно вихрь
  rationale: סוּפָה обозначает бурное атмосферное явление — вихрь или бурю. Именная конструкция с тире естественно воспроизводит краткое еврейское сравнение.
- source_word: לְהָשִׁיב בְּחֵמָה אַפּוֹ
  choice: чтобы в ярости воздать Своим гневом
  rationale: Каузативная форма שׁוּב может означать «вернуть», «обратить назад» и в судебном контексте «воздать». Русская конструкция передаёт карательный смысл, не создавая неестественного выражения «воздать Свой гнев».
- source_word: וְגַעֲרָתוֹ בְּלַהֲבֵי אֵשׁ
  choice: и пламенем огня — Своим обличением
  rationale: גְּעָרָה — властное, суровое обличение. Инструментальное «пламенем огня» сохраняет параллелизм с «Своим гневом» и образность оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя, поэтому оно сохранено в транслитерации без замены титулом.
- issue: Характер грядущего действия Бога
  choice: судебное воздаяние выражено глаголом «воздать»
  alternative: «вернуть Свой гнев» или «излить Свой гнев»
  rationale: Контекст говорит о суде, но форма לְהָשִׁיב сохраняет оттенок ответного действия. «Воздать» удерживает этот оттенок лучше, чем более истолковывающее «излить».
translation_notes:
  register: Современный литературный русский с возвышенной, но не архаичной пророческой интонацией. Инверсия и тире сохраняют энергичный параллелизм еврейской строки; прописные местоимения относятся к Яхве как элемент принятого библейского регистра.
