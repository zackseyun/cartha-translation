  source_fidelity: 'Начальная часть передана точно: כִּי הִנֵּה — «Ибо вот», имя יהוה — «Яхве», בָּאֵשׁ — «в огне», а образ колесниц, подобных вихрю, сохранён. Однако в заключительной части исходные дополнения «Свой гнев» и «Своё обличение» должны быть тем, на что направлено действие לְהָשִׁיב, а не средствами действия. Формулировка «воздать Своим гневом ... Своим обличением» синтаксически и смыслово меняет эту связь.'
