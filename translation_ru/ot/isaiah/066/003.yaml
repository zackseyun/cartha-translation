  text: שׁוֹחֵ֨ט הַ/שּׁ֜וֹר מַכֵּה אִ֗ישׁ זוֹבֵ֤חַ הַ/שֶּׂה֙ עֹ֣רֵֽף כֶּ֔לֶב מַעֲלֵ֤ה מִנְחָה֙ דַּם חֲזִ֔יר מַזְכִּ֥יר לְבֹנָ֖ה מְבָ֣רֵֽךְ אָ֑וֶן גַּם הֵ֗מָּה בָּֽחֲרוּ֙ בְּ/דַרְכֵי/הֶ֔ם וּ/בְ/שִׁקּוּצֵי/הֶ֖ם נַפְשָׁ֥/ם חָפֵֽצָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/003.yaml
  text: The one who slaughters an ox is like one who strikes down a man[a]; the one who sacrifices a lamb, like one who breaks a dog’s neck; the one who offers a grain offering, like one who offers pig’s blood; the one who makes a memorial offering of frankincense, like one who blesses wickedness. They too have chosen their own ways[b], and their soul delights in their abominations.
translation:
  language: ru
  text: Кто закалывает быка, тот словно поражает человека[a]; кто приносит в жертву ягнёнка — словно ломает шею собаке; кто приносит хлебное приношение — словно приносит свиную кровь; кто совершает поминальное приношение ладана — словно благословляет нечестие[b]. Они и сами избрали свои пути, и душа их находит удовольствие в их мерзостях[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убивает человека». Еврейский глагол может означать нанесение удара или поражение, а в зависимости от контекста — умерщвление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благословляет идола» или «благословляет зло». Еврейское слово может означать нечестие, зло, беззаконие или идолопоклонническую ложь.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «душа их находит удовольствие»; единственное число употреблено собирательно.'
    reason: collective_grammar
lexical_decisions:
- source_word: שׁוֹחֵט הַשּׁוֹר
  choice: кто закалывает быка
  rationale: Причастная конструкция передана обобщённым «кто…». «Закалывает» сохраняет жертвенный контекст; שׁוֹר здесь естественно передать как «бык».
- source_word: מַכֵּה אִישׁ
  choice: словно убивает человека
  rationale: מכה может обозначать нанесение удара вплоть до умерщвления. В данном ряду предельно тяжких деяний «убивает» естественно выражает силу образа; сравнительное «словно» восполняет подразумеваемое сопоставление.
- source_word: זוֹבֵחַ הַשֶּׂה
  choice: кто приносит в жертву ягнёнка
  rationale: שה обозначает животное из мелкого скота, овцу или козу; в жертвенном контексте «ягнёнок» является естественным вариантом, хотя исходное слово шире.
- source_word: עֹרֵף כֶּלֶב
  choice: словно ломает шею собаке
  rationale: ערף указывает на переламывание шеи, в том числе как особое ритуальное действие, а не обязательно на обезглавливание.
- source_word: מַעֲלֵה מִנְחָה
  choice: кто приносит хлебное приношение
  rationale: В культовом контексте מנחה обозначает бескровное приношение из продуктов земли; традиционно понятное «хлебное приношение» точнее общего «дар».
- source_word: דַּם חֲזִיר
  choice: словно свиную кровь
  rationale: Краткая именная конструкция сохранена; подразумеваемый глагол «приносит» восстанавливается из первой половины параллельной строки. Образ сохраняет смысл ритуальной нечистоты и оскорбительности.
- source_word: מַזְכִּיר לְבֹנָה
  choice: кто возжигает ладан в напоминание
  rationale: Hiphil זכר в жертвенной речи связан с напоминательной частью приношения. «Возжигает ладан в напоминание» передаёт культовое действие, не сводя его просто к принесению ладана.
- source_word: מְבָרֵךְ אָוֶן
  choice: словно благословляет нечестие
  rationale: און может обозначать зло, нечестие, беззаконие либо идолопоклонническую ложь. «Нечестие» сохраняет нравственно-религиозную широту слова и не сужает его до конкретного идола.
- source_word: גַּם הֵמָּה בָּחֲרוּ בְּדַרְכֵיהֶם
  choice: Они и сами избрали свои пути
  rationale: גם המה подчёркивает личную причастность этих людей; «и сами» естественно передаёт эмфазу, а «свои пути» — своевольный выбор.
- source_word: וּבְשִׁקּוּצֵיהֶם נַפְשָׁם חָפֵצָה
  choice: и душа их находит удовольствие в их мерзостях
  rationale: Сохранено коллективное единственное число נפשם с глаголом женского рода. «Мерзости» передаёт пророческую силу שקוצים и возможную связь с идолопоклонством.
theological_decisions:
- issue: Характер сопоставления жертв с насилием и нечистыми действиями
  choice: Передать подразумеваемое сравнение словом «словно»
  alternative: Передать как прямое отождествление без сравнительного слова
  rationale: В еврейском тексте сравнительная частица отсутствует, но параллельные причастные обороты создают резкое смысловое приравнивание. «Словно» делает синтаксис ясным по-русски, сохраняя пророческую оценку таких жертв.
- issue: Значение אָוֶן
  choice: нечестие
  alternative: идол; зло; беззаконие
  rationale: Слово допускает как общее нравственное значение, так и идолопоклоннический оттенок. «Нечестие» сохраняет эту широту, тогда как «идол» преждевременно устранил бы неоднозначность.
- issue: Коллективное выражение נַפְשָׁם חָפֵצָה
  choice: сохранить «душа их» в единственном числе
  alternative: 'передать идиоматически: «они находят удовольствие»'
  rationale: Формально близкая передача сохраняет представление о коллективном внутреннем желании народа и остаётся понятной в литературном русском языке.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм сохранён повтором «кто… словно…». Культовые термины переданы понятно, но без устранения подлинной лексической неоднозначности.
