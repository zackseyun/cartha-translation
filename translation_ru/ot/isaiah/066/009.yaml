base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/009.yaml
  text: Shall I bring to the point of birth and not cause to give birth? says Yahweh[a]. Shall I, who cause to give birth[c][b], shut the womb? says your God.
translation:
  language: ru
  text: «Разве Я доведу до родов и не дам родить? — говорит Яхве.[a] — Разве Я, дающий родить, закрою утробу?[b] — говорит твой[c] Бог».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доведу до решающего момента». В еврейском тексте употреблён образ доведения беременности до момента родов.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «удержу» или «закрою»; слово «утробу» в еврейском тексте не названо, но подразумевается образом родов.'
    reason: lexical_alternative
  - marker: c
    text: 'Форма «твой» в еврейском тексте — женского рода, единственного числа: Бог обращается к Сиону (Иерусалиму), представленному как женщина.'
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁבִּיר
  choice: доведу до родов
  rationale: Каузативная форма в данном контексте обозначает доведение беременности до решающего момента — родов. Такой перевод сохраняет образ и естественно звучит по-русски.
- source_word: אוֹלִיד / הַמּוֹלִיד
  choice: дам родить / дающий родить
  rationale: Каузатив от ילד передан выражением, сохраняющим значение содействия рождению; во второй строке причастная форма отражена оборотом «дающий родить».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: אִם
  choice: разве
  rationale: В параллельной второй строке частица вводит риторический вопрос. «Разве» естественно передаёт ожидаемый отрицательный ответ, не добавляя логического условия.
- source_word: וְעָצַרְתִּי
  choice: закрою утробу
  rationale: Глагол значит «удержать, запереть, закрыть»; объект в еврейском не выражен, но контролируется образом родов. «Утробу» делает этот образ понятным, сохраняя экспликацию как переводческую интерпретацию.
- source_word: אֱלֹהָיִךְ
  choice: твой Бог
  rationale: Сохранено прямое обращение. Женский род единственного числа у местоименного суффикса невозможно явно передать в этой русской форме без добавления слов.
theological_decisions:
- issue: Образ родов как заверение в завершении начатого Богом
  choice: Сохранить два риторических вопроса и образ доведения до родов
  alternative: 'Передать динамически: «Неужели Я начну роды и не завершу их?»'
  rationale: Выбранный вариант сохраняет поэтическую метафору и утверждение Божьей верности, не превращая его в более широкую догматическую формулу.
- issue: Не названный прямо объект глагола וְעָצַרְתִּי
  choice: Эксплицировать как «утробу» с примечанием
  alternative: Оставить «удержу» либо передать «задержу рождение»
  rationale: Контекст родов позволяет такую экспликацию, но примечание честно указывает, что объект подразумевается, а не выражен в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Параллелизм и риторическая сила оригинала сохранены; порядок с авторскими ремарками оформлен средствами русской пунктуации.
