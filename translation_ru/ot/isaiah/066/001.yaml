base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/001.yaml
  text: 'Thus says Yahweh: Heaven is my throne[a], and the earth is my footstool. What kind of house would you build for me[c][b], and what place would be my resting place?'
translation:
  language: ru
  text: 'Так говорит Яхве:


    «Небеса — Мой престол,

    а земля — подножие Моих ног.

    Где тот дом, который вы построите Мне[a][b],

    и где место Моего покоя[c]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Какой дом вы могли бы построить Мне?» Вопрос риторический и может подчёркивать несоразмерность любого дома, построенного людьми, Богу.'
    reason: лексическая альтернатива и пояснение риторического вопроса
  - marker: b
    text: Слово «дом» здесь, вероятно, указывает на храм, хотя в еврейском тексте употреблено именно слово «дом».
    reason: культурно-контекстуальное пояснение
  - marker: c
    text: 'Или: «какое место могло бы быть местом Моего покоя?»'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая формула пророческой речи; передаёт торжественность оригинала естественным современным русским языком.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: הַשָּׁמַיִם
  choice: Небеса
  rationale: Форма и контекст обозначают небесную сферу, противопоставленную земле; «небеса» естественно сохраняет образный и возвышенный строй.
- source_word: כִּסְאִי
  choice: Мой престол
  rationale: Прямо сохраняет царскую метафору оригинала.
- source_word: וְהָאָרֶץ
  choice: а земля
  rationale: Союз «а» естественно выражает смысловое сопоставление небес и земли.
- source_word: הֲדֹם רַגְלָי
  choice: подножие Моих ног
  rationale: Точно и понятно передаёт образ; более полно соответствует упоминанию ног, чем одно слово «подножие».
- source_word: אֵי זֶה
  choice: какой же / какое
  rationale: В данном контексте вопрос риторически подчёркивает несоразмерность любого человеческого сооружения величию Бога. Частица «же» передаёт оттенок вызова, не превращая его в категорическое утверждение.
- source_word: בַיִת
  choice: дом
  rationale: Сохраняет конкретное слово оригинала; храм подразумевается контекстом, но прямо не назван.
- source_word: אֲשֶׁר תִּבְנוּ לִי
  choice: вы могли бы построить Мне
  rationale: Модальная конструкция естественно передаёт риторический смысл вопроса о возможности и достаточности дома для Бога.
- source_word: מָקוֹם מְנוּחָתִי
  choice: место Моего покоя
  rationale: Сохраняет параллелизм с «домом» и допускает как пространственный образ, так и более широкое значение покоя.
theological_decisions:
- issue: Следует ли переводить בַיִת как «дом» или прямо как «храм»
  choice: дом
  alternative: храм
  rationale: Храм явно подразумевается, однако еврейский текст употребляет обычное слово «дом». Такой перевод не сужает смысл и сохраняет критику всякой попытки вместить Бога в человеческое сооружение.
- issue: Как передать риторический вопрос אֵי זֶה
  choice: Какой же дом вы могли бы построить Мне
  alternative: Где тот дом, который вы построите Мне
  rationale: Выбранный вариант естественен по-русски и передаёт основной риторический акцент на несоразмерности человеческого дома Богу, при этом возможная более буквальная пространственная формулировка отмечена в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Синтаксис разбит на поэтические строки. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому религиозному издательскому регистру, не изменяя смысла текста.
