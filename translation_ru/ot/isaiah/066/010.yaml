base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/010.yaml
  text: Rejoice with Jerusalem and be glad in her[a], all you who love her; rejoice with her in joy[b], all you who mourn over her.
translation:
  language: ru
  text: Радуйтесь вместе с Иерусалимом[a] и ликуйте о нём, все, кто любит его; радуйтесь вместе с ним с великой радостью[b], все, кто скорбит о нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Радуйтесь об Иерусалиме». Еврейская конструкция с אֶת может представлять Иерусалим как предмет радости, хотя последующие выражения указывают и на совместную с ним радость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «радуйтесь вместе с ним радостью». В еврейском тексте после глагола стоит однокоренное существительное, усиливающее выражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ אֶת יְרוּשָׁלִַם
  choice: Радуйтесь вместе с Иерусалимом
  rationale: Императив שׂמח передан обычным призывом «радуйтесь». При אֶת возможны объектное значение и значение совместности; последнее поддерживается последующим אִתָּהּ и хорошо передаёт общую радость.
- source_word: וְגִילוּ בָהּ
  choice: и ликуйте о нём
  rationale: גיל обозначает бурную, торжествующую радость, поэтому выбрано «ликуйте». Сочетание с בּ выражает радость, связанную с Иерусалимом; «о нём» естественно по-русски и сохраняет Иерусалим как предмет радости.
- source_word: כָּל אֹהֲבֶיהָ
  choice: все, кто любит его
  rationale: Причастная конструкция передана естественным русским обращением. Местоимение согласовано с грамматически мужским родом русского названия «Иерусалим».
- source_word: שִׂישׂוּ אִתָּהּ מָשׂוֹשׂ
  choice: радуйтесь вместе с ним великой радостью
  rationale: אִתָּהּ ясно обозначает совместность. Однокоренные глагол и существительное усиливают призыв; по-русски это естественно выражено сочетанием «великой радостью» без тяжеловесного «ликуйте ликованием».
- source_word: כָּל הַמִּתְאַבְּלִים עָלֶיהָ
  choice: все, кто скорбит о нём
  rationale: Причастие Hitpael от אבל обозначает пребывающих в скорби, а עַל указывает на предмет скорби. Настоящее время сохраняет форму исходного причастия.
