id: ISA.66.21
reference: Isaiah 66:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/גַם מֵ/הֶ֥ם אֶקַּ֛ח לַ/כֹּהֲנִ֥ים לַ/לְוִיִּ֖ם אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/021.yaml
  text: And even from them I will take some for priests and for Levites[b][a], says Yahweh.
translation:
  language: ru
  text: И из них[a] Я тоже возьму некоторых в священники и левиты[b], — говорит Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из их числа»; в еврейском тексте прямо не сказано, к кому относится местоимение, — это определяется по предыдущему контексту.'
    reason: lexical_alternative
  - marker: b
    text: '«В священники и левиты» можно также передать: «чтобы они были священниками и левитами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: И… тоже
  rationale: 'Сохраняет как связь с предыдущим высказыванием, так и усилительное значение: Бог возьмёт людей даже из названной ранее группы.'
- source_word: מֵהֶם
  choice: из них
  rationale: Передаёт конструкцию с מִן как выбор людей из некоторой группы, не называя явно оставленный в еврейском тексте антецедент.
- source_word: אֶקַּח
  choice: Я… возьму некоторых
  rationale: Глагол לקח буквально означает «брать»; «некоторых» естественно выражает по-русски подразумеваемое частичное выделение из группы.
- source_word: לַכֹּהֲנִים
  choice: в священники
  rationale: Предлог לְ здесь обозначает назначение на служение; русская конструкция «в священники» естественно передаёт этот смысл, не заменяя образ глагола «возьму».
- source_word: לַלְוִיִּם
  choice: в… левиты
  rationale: Параллельная конструкция передаёт назначение в число левитов и сохраняет тесный синтаксический параллелизм со «в священники».
- source_word: אָמַר יְהוָה
  choice: говорит Господь
  rationale: Пророческая формула с перфектом אמר имеет перформативный смысл; настоящее время естественно для русского пророческого стиля, а יהוה передано традиционным «Господь».
theological_decisions:
- issue: К кому относится местоимение «них» и каков объём включения в священническое и левитское служение
  choice: Антецедент местоимения не уточняется, поэтому контекст может указывать на людей из народов; названия служений сохранены буквально.
  alternative: Ограничить референт возвратившимися из среды народов израильтянами либо истолковать «священников» и «левитов» небуквально.
  rationale: В самом стихе группа не названа заново. Перевод не должен заранее сужать её состав или разрешать богословское напряжение относительно того, кто именно может быть взят для этих служений.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены лаконичность еврейского текста, образ «возьму» и неоднозначность антецедента; добавленное «некоторых» лишь естественно выражает по-русски частичный выбор из группы.
