base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/016.yaml
  text: For by fire Yahweh will execute judgment[a], and by his sword, against all flesh[b]; and many will be those slain by Yahweh.
translation:
  language: ru
  text: Ибо Яхве огнём и Своим мечом совершит суд[a] над всякой плотью[b]; и много будет убитых Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вступит в суд». Еврейский глагол можно передать кратко: «будет судить», — либо развёрнуто: «вступит в судебное разбирательство».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «над всякой плотью»; пророческое выражение, обозначающее всё человечество как смертных телесных существ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит обоснование предшествующего пророчества; «ибо» естественно сохраняет пояснительно-причинную связь и высокий, но понятный регистр.
- source_word: בָאֵשׁ
  choice: огнём
  rationale: Предлог ב здесь указывает на средство суда; творительный падеж по-русски ясно и кратко передаёт инструментальное значение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» общепринята в современной русской библеистической передаче.
- source_word: נִשְׁפָּט
  choice: совершит суд
  rationale: Нифаль глагола שׁפט в данном контексте обозначает выступление Яхве в судебном действии. «Совершит суд» звучит естественнее буквального «вступит в суд» и сохраняет судебную семантику.
- source_word: וּבְחַרְבּוֹ
  choice: и мечом Своим
  rationale: Творительный падеж передаёт инструментальное ב, а образ меча сохранён без уточнения, буквальный он или метафорический.
- source_word: אֶת כָּל בָּשָׂר
  choice: над всякой плотью
  rationale: При выражении «совершить суд» русский предлог «над» естественно обозначает объект судебного действия. «Всякая плоть» сохраняет широкий пророческий образ смертного человечества.
- source_word: וְרַבּוּ
  choice: и много будет
  rationale: Передаёт значение многочисленности и сохраняет вынесенный в смысловой фокус количественный элемент.
- source_word: חַלְלֵי יְהוָה
  choice: поражённых Яхве
  rationale: חָלָל обозначает убитого, павшего или поражённого насмерть. «Поражённых Яхве» сохраняет конструктивную связь и торжественно-грозный характер фразы, не добавляя отсутствующего в тексте пояснения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Объём выражения כָּל־בָּשָׂר
  choice: всякая плоть
  alternative: всё человечество
  rationale: Буквальный пророческий оборот сохраняет одновременно всеобщность и оттенок телесной, смертной тварности человека; сноска поясняет его современному читателю.
- issue: Значение נִשְׁפָּט
  choice: совершит суд
  alternative: вступит в суд
  rationale: Выбран естественный русский судебный оборот, не устраняющий образ Яхве как действующего Судьи. В сноске сохранён более буквальный вариант, поскольку форма допускает компактную и развёрнутую передачу.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Инверсия «мечом Своим» и выражение «всякая плоть» сохраняют поэтическую плотность оригинала, оставаясь понятными благодаря сноске.
