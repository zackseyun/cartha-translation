id: ISA.66.12
reference: Isaiah 66:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י נֹטֶֽה אֵ֠לֶי/הָ כְּ/נָהָ֨ר שָׁל֜וֹם וּ/כְ/נַ֧חַל שׁוֹטֵ֛ף כְּב֥וֹד גּוֹיִ֖ם וִֽ/ינַקְתֶּ֑ם עַל צַד֙ תִּנָּשֵׂ֔אוּ וְ/עַל בִּרְכַּ֖יִם תְּשָׁעֳשָֽׁעוּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/012.yaml
  text: 'For thus says Yahweh: Behold[a], I am extending peace to her like a river, and the glory of the nations like an overflowing stream; and you will nurse, you will be carried on the hip[b], and bounced on the knees.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве: «Вот, Я направляю к ней мир, подобный реке, и славу народов[a], подобную разливающемуся потоку. Вы будете кормиться у груди; вас будут носить на боку и ласково качать на коленях[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богатство (изобилие) народов». Еврейское слово «слава» может включать великолепие и богатства народов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вас будут нежить на коленях». Еврейский текст рисует нежную, радостную заботу о ребёнке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом; форма «Яхве» понятна современному русскому читателю.
- source_word: הִנְנִי נֹטֶה אֵלֶיהָ
  choice: Вот, Я направляю к ней
  rationale: «Вот» сохраняет указательно-эмфатическую силу הִנְנִי, а настоящее время передаёт живое, уже совершаемое или близкое действие причастия נֹטֶה. «Направляю к ней» естественно выражает образ потока, обращённого к городу-матери.
- source_word: שָׁלוֹם
  choice: мир
  rationale: Основное и узнаваемое соответствие; в контексте допускает также полноту благополучия и процветания.
- source_word: כְּנָהָר
  choice: словно реку
  rationale: Сохраняет прямое сравнение и образ обильного непрерывного течения.
- source_word: וּכְנַחַל שׁוֹטֵף
  choice: словно разливающийся поток
  rationale: נַחַל обозначает поток или русло, а שׁוֹטֵף придаёт образу силу разлива; формулировка естественна по-русски.
- source_word: כְּבוֹד גּוֹיִם
  choice: славу народов
  rationale: 'Буквально сохраняет многозначность כָּבוֹד: славу, великолепие и, в данном контексте, возможное материальное изобилие народов. Экономический оттенок вынесен в примечание.'
- source_word: וִינַקְתֶּם
  choice: вы будете кормиться у груди
  rationale: Передаёт активную форму глагола «сосать, питаться грудным молоком» и материнский образ, избегая неестественного для современного русского буквального выражения.
- source_word: עַל צַד תִּנָּשֵׂאוּ
  choice: вас будут носить на бедре
  rationale: Передаёт пассивную форму נשׂא и обычный образ ребёнка, которого мать несёт, посадив на бедро.
- source_word: וְעַל בִּרְכַּיִם תְּשָׁעֳשָׁעוּ
  choice: ласково качать на коленях
  rationale: Передаёт пассивный смысл и образ нежной, радостной заботы о ребёнке. Наречие «ласково» сохраняет аффективную составляющую глагола, а «качать на коленях» ясно рисует действие.
theological_decisions:
- issue: К кому относится местоимение женского рода אֵלֶיהָ («к ней»)
  choice: Сохранено «к ней»
  alternative: «к Иерусалиму» или «к Сиону»
  rationale: Непосредственный контекст указывает на Иерусалим/Сион как город-мать, но сам стих использует местоимение. Его сохранение поддерживает связность и образность исходного текста, не делая подразумеваемое имя явным.
- issue: Объём значения שָׁלוֹם
  choice: «мир» с сохранением широкого контекстуального смысла
  alternative: «благополучие» или «процветание»
  rationale: Выбор не сводит обещание только к материальному достатку и сохраняет характерное для еврейского слова напряжение между миром, целостностью и благополучием.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Материнские образы переданы ясно и естественно, без архаизмов; параллелизм двух водных сравнений сохранён. Маркер [a] помещён при выражении «слава народов», к которому относится его примечание, а [b] — при заключительном образе.
