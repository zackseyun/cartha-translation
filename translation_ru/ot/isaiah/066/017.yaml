  text: הַ/מִּתְקַדְּשִׁ֨ים וְ/הַ/מִּֽטַּהֲרִ֜ים אֶל הַ/גַּנּ֗וֹת אַחַ֤ר אחד בַּ/תָּ֔וֶךְ אֹֽכְלֵי֙ בְּשַׂ֣ר הַ/חֲזִ֔יר וְ/הַ/שֶּׁ֖קֶץ וְ/הָ/עַכְבָּ֑ר יַחְדָּ֥ו יָסֻ֖פוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/017.yaml
  text: Those who sanctify themselves and purify themselves to go into the gardens[a], following one in the midst, eating the flesh of pigs and detestable things and mice, shall come to an end together, declares Yahweh.
translation:
  language: ru
  text: Те, кто освящает и очищает себя для входа в сады, следуя за одним в середине[a], кто ест свиное мясо, нечто мерзкое и мышей, — все вместе придут к концу, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за одним в середине». Еврейская фраза неясна: она может означать следование за руководителем обряда, следование за кем-либо в центр или движение друг за другом во время культового ритуала.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּתְקַדְּשִׁים
  choice: освящающие себя
  rationale: Возвратное значение породы хитпаэль передаёт самостоятельное ритуальное освящение и сохраняет заложенную в контексте иронию.
- source_word: וְהַמִּטַּהֲרִים
  choice: и очищающие себя
  rationale: Хитпаэль имеет возвратное значение; выражение естественно продолжает описание ритуального приготовления.
- source_word: אֶל הַגַּנּוֹת
  choice: для входа в сады
  rationale: Предлог אֶל обозначает направленность движения; добавление «входа» естественно выражает подразумеваемое движение в русском языке.
- source_word: אַחַר אחד בַּתָּוֶךְ
  choice: следующие за одним в середине
  rationale: Буквально и намеренно неоднозначно передаёт трудное культовое выражение, не отождествляя упомянутого «одного» с конкретным лицом или предметом.
- source_word: אֹכְלֵי
  choice: едящие
  rationale: Причастие сохраняет синтаксическую цепочку характеристик данной группы.
- source_word: בְּשַׂר הַחֲזִיר
  choice: свиное мясо
  rationale: Современное и точное русское соответствие, естественнее буквального «плоть свиньи».
- source_word: הַשֶּׁקֶץ
  choice: мерзость
  rationale: Слово обозначает нечто отвратительное, особенно ритуально нечистое; единственное число сохраняет форму еврейского текста.
- source_word: הָעַכְבָּר
  choice: мышей
  rationale: עַכְבָּר обычно обозначает мышь; собирательный смысл естественно передан множественным числом.
- source_word: יַחְדָּו יָסֻפוּ
  choice: все вместе придут к концу
  rationale: Передаёт коллективность суда и значение глагола סוף, не уточняя сверх текста способ гибели.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: «Возвещает» передаёт весомую пророческую формулу, а «Яхве» непосредственно воспроизводит личное имя יהוה.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон; форма «Яхве» передаёт личное заветное имя и согласуется с предоставленным аудированным слоем.
- issue: Неясное культовое выражение אַחַר אחד בַּתָּוֶךְ
  choice: следующие за одним в середине
  alternative: следующие за одним в центре; идущие один за другим; следующие за тем, кто в середине
  rationale: Еврейская фраза синтаксически и текстуально трудна. Основной текст сохраняет её неопределённость, а примечание сообщает возможные понимания без догматического выбора.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Причастная конструкция сохраняет структуру перечня; архаизмы по возможности исключены. Тире отделяют приговор и заключительную пророческую формулу.
