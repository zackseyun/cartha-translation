  text: וְ/הֵבִ֣יאוּ אֶת כָּל אֲחֵי/כֶ֣ם מִ/כָּל הַ/גּוֹיִ֣ם מִנְחָ֣ה לַֽ/יהוָ֡ה בַּ/סּוּסִ֡ים וּ֠/בָ/רֶכֶב וּ/בַ/צַּבִּ֨ים וּ/בַ/פְּרָדִ֜ים וּ/בַ/כִּרְכָּר֗וֹת עַ֣ל הַ֥ר קָדְשִׁ֛/י יְרוּשָׁלִַ֖ם אָמַ֣ר יְהוָ֑ה כַּ/אֲשֶׁ֣ר יָבִיאוּ֩ בְנֵ֨י יִשְׂרָאֵ֧ל אֶת הַ/מִּנְחָ֛ה בִּ/כְלִ֥י טָה֖וֹר בֵּ֥ית יְהוָֽה־־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/020.yaml
  text: And they will bring all your brothers from all the nations as an offering to Yahweh[a], on horses and in chariots and in litters and on mules and on camels, to my holy mountain Jerusalem, says Yahweh[c][b], just as the sons of Israel bring the offering in a clean vessel to the house of Yahweh.
translation:
  language: ru
  text: И они приведут всех ваших братьев из всех народов как приношение Господу — на конях, в колесницах, в носилках[a], на мулах и на быстроходных верблюдах[b] — в Иерусалим, на Мою святую гору, — говорит Господь, — подобно тому как сыны Израиля приносят приношение в чистом сосуде в дом Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Редкое еврейское слово; возможно: «в крытых повозках» или «в паланкинах».'
    reason: lexical_alternative
  - marker: b
    text: 'Редкое еврейское слово; возможно: «в повозках».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיאוּ
  choice: И они приведут
  rationale: В пророческом контексте форма выражает будущее действие; «приведут» естественно передаёт доставление людей.
- source_word: כָּל אֲחֵיכֶם
  choice: всех ваших братьев
  rationale: Сохраняет прямое значение אָח и родственный образ; в данном контексте слово может обозначать не только родных братьев, но и соплеменников.
- source_word: מִכָּל הַגּוֹיִם
  choice: из всех народов
  rationale: Прямо и естественно передаёт происхождение собираемых людей из среды народов.
- source_word: מִנְחָה
  choice: как приношение
  rationale: Слово может означать дар, дань или культовое приношение; контекст храма требует культового оттенка без неоправданного сужения до хлебного приношения.
- source_word: לַיהוָה
  choice: Господу
  rationale: Традиционная русская передача тетраграмматона; дательный падеж выражает посвящение приношения.
- source_word: בַּסּוּסִים וּבָרֶכֶב
  choice: на конях, на колесницах
  rationale: Естественно передаёт средства передвижения; רֶכֶב здесь вероятнее всего обозначает колесницы.
- source_word: וּבַצַּבִּים
  choice: в крытых повозках
  rationale: Редкое слово обозначает некий вид транспорта; «крытые повозки» — вероятная, но не бесспорная конкретизация, поэтому неопределённость отмечена в сноске.
- source_word: וּבַפְּרָדִים
  choice: на мулах
  rationale: Прямое значение פֶּרֶד.
- source_word: וּבַכִּרְכָּרוֹת
  choice: на быстроходных верблюдах
  rationale: Редкое и спорное слово часто понимают как обозначение быстрых верховых животных, вероятно верблюдов; альтернативное понимание вынесено в сноску.
- source_word: עַל הַר קָדְשִׁי יְרוּשָׁלִַם
  choice: на Мою святую гору, в Иерусалим
  rationale: Передаёт направление движения и пояснительное соотношение Иерусалима с «Моей святой горой».
- source_word: בִּכְלִי טָהוֹר
  choice: в чистом сосуде
  rationale: Формально сохраняет храмовый образ ритуально чистой ёмкости, не уточняя её вид.
theological_decisions:
- issue: Кого обозначают «ваши братья»
  choice: Сохранено буквальное родственное обозначение, прежде всего указывающее на рассеянных соплеменников Израиля.
  alternative: Понимать выражение как всех обращённых из народов или как включающее всех будущих поклонников.
  rationale: Непосредственная формулировка и сравнение с сынами Израиля поддерживают образ собирания израильтян, но перевод не исключает более широкого эсхатологического звучания.
- issue: Люди как приношение Господу
  choice: Сохранена конструкция «как приношение Господу».
  alternative: Ослабить метафору до «в дар Господу» или истолковать её как указание на конкретную жертву.
  rationale: Еврейский текст намеренно сопоставляет приведённых людей с храмовым приношением; перевод сохраняет этот напряжённый культовый образ без догматического истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис слегка торжественный, но понятный; цепочка средств передвижения оформлена тире, а вставная формула «говорит Господь» — парными тире. Заглавная буква в «Мою» обозначает речь Бога и соответствует принятой русской библейской традиции.
