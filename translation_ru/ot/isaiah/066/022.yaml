source:
  edition: WLC
  text: כִּ֣י כַ/אֲשֶׁ֣ר הַ/שָּׁמַ֣יִם הַ֠/חֳדָשִׁים וְ/הָ/אָ֨רֶץ הַ/חֲדָשָׁ֜ה אֲשֶׁ֨ר אֲנִ֥י עֹשֶׂ֛ה עֹמְדִ֥ים לְ/פָנַ֖/י נְאֻם יְהוָ֑ה כֵּ֛ן יַעֲמֹ֥ד זַרְעֲ/כֶ֖ם וְ/שִׁמְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/022.yaml
  text: For just as the new heavens and the new earth that I am making shall remain before me[a], declares Yahweh, so your offspring and your name shall remain.
translation:
  language: ru
  text: Ведь как новое небо и новая земля, которые Я творю, пребудут предо Мной[a], — возвещает Яхве, — так пребудут ваше потомство и ваше имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут стоять» / «устоят»; в обоих случаях употреблён один и тот же еврейский глагол עמד («стоять, оставаться, пребывать»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Связывает стих с предшествующим высказыванием как его основание или пояснение; в современном русском «ведь» естественно передаёт эту дискурсивную функцию.
- source_word: כַאֲשֶׁר ... כֵּן
  choice: как ... так
  rationale: Сохраняет еврейскую соотносительную сравнительную конструкцию.
- source_word: הַשָּׁמַיִם הַחֳדָשִׁים וְהָאָרֶץ הַחֲדָשָׁה
  choice: новое небо и новая земля
  rationale: В русском библейском и литературном употреблении שָׁמַיִם естественно передаётся собирательным единственным «небо»; определённость выражается контекстом, поскольку отдельного артикля в русском нет.
- source_word: עֹשֶׂה
  choice: творю
  rationale: Настоящее время сохраняет значение еврейского причастия как совершаемого или предстоящего Божьего действия; «творю» уместно для созидательного действия Бога и сохраняет торжественный регистр.
- source_word: עֹמְדִים ... יַעֲמֹד
  choice: пребудут ... пребудут
  rationale: Одинаковый русский глагол сохраняет лексическую связь двух форм עמד и выражает длительное существование; буквальное «стоять» возможно, но здесь менее естественно с небом, землёй, потомством и именем.
- source_word: לְפָנַי
  choice: предо Мной
  rationale: Сохраняет пространственно-реляционное значение «передо мной» в достойной литературной форме.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную пророческую формулу, а личное имя יהוה сохраняется транслитерацией «Яхве», без замены титулом.
- source_word: זַרְעֲכֶם
  choice: ваше потомство
  rationale: Естественно передаёт собирательное значение זֶרַע и не сужает его до отдельного поколения.
- source_word: וְשִׁמְכֶם
  choice: и ваше имя
  rationale: Сохраняет конкретный образ исходного текста, не заменяя его толкованием вроде «слава» или «известность».
theological_decisions:
- issue: Эсхатологическое выражение «новое небо и новая земля»
  choice: Сохранено как прямое обозначение нового неба и новой земли без уточнения характера обновления.
  alternative: Истолковать как исключительно буквальное новое творение либо только как метафору восстановленного заветного порядка.
  rationale: Еврейский текст допускает широкую эсхатологическую значимость выражения и сам не разрешает здесь вопрос о степени буквальности.
- issue: Круг тех, к кому относится обещание о потомстве и имени
  choice: Сохранено обращение во втором лице множественного числа без дополнительного определения адресатов.
  alternative: Уточнить, что речь исключительно об этническом Израиле, верном остатке или более широком эсхатологическом народе Бога.
  rationale: Сам стих обещает непрерывность потомства и имени, но не определяет исчерпывающе богословский объём этого обещания.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим звучанием. Формы «пребудут», «предо Мной» и «возвещает» dignified, но понятны; личное имя передано как «Яхве». Маркер [a] помещён непосредственно после первого употребления спорного глагола.
