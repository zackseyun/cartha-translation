    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: шум / голос
  rationale: Слово קוֹל трижды вводит то, что слышится. В первом сочетании קוֹל שָׁאוֹן естественное русское «шум» передаёт единый образ громкого смятения; в двух следующих случаях «голос» сохраняет олицетворённое звучание и позволяет сказать «голос Яхве». Повтор еврейского слова отмечен в сноске.
- source_word: שָׁאוֹן
  choice: шум
  rationale: שָׁאוֹן обозначает громкий гул, смятение или грохот. «Шум» естественно сочетается с указанием источника и не сужает образ до одного вида звука.
- source_word: מֵעִיר
  choice: из города
  rationale: Предлог מִן указывает на источник звука; краткое «из города» сохраняет напряжённую бессоюзную конструкцию оригинала.
- source_word: מֵהֵיכָל
  choice: из храма
  rationale: הֵיכָל может означать дворец или храм, но в данном контексте Иерусалима и суда имеется в виду храм; возможное более широкое значение отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом.
- source_word: מְשַׁלֵּם גְּמוּל
  choice: воздающего ... по заслугам
  rationale: Сочетание глагола שׁלם с существительным גְּמוּל означает отплату за содеянное. Русская идиома «воздавать по заслугам» передаёт судебный смысл без неестественного повтора «воздающего воздаяние».
- source_word: לְאֹיְבָיו
  choice: Своим врагам
  rationale: Предлог לְ обозначает тех, кому направлено воздаяние; возвратное «Своим» ясно соотносит врагов с Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Характер воздаяния גְּמוּל
  choice: по заслугам
  alternative: возмездие; воздаяние
  rationale: Само слово обозначает то, что возвращается человеку за его поступки; наличие «врагов» придаёт здесь наказательный смысл, но перевод не добавляет более узкой богословской квалификации, чем даёт контекст.
translation_notes:
  register: Краткие бессоюзные фразы сохраняют внезапность и нарастающий риторический эффект еврейского текста. Регистр современный и торжественный; синтаксис намеренно допускает именные восклицательные конструкции без добавленного глагола «слышится».
