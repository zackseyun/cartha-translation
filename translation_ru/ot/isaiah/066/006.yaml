  text: A sound of uproar from the city[a], a sound from the temple[c][b], the sound of Yahweh repaying recompense to his enemies.
translation:
  language: ru
  text: Звук смятения из города[a], звук из храма[b], звук Яхве, воздающего своим врагам по заслугам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово קוֹל («звук», «голос») повторено в стихе трижды. «Смятение» передаёт שָׁאוֹן; возможны также «шум», «гул» или «грохот».
    reason: lexical_alternative
