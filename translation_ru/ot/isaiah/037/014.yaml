  text: וַ/יִּקַּ֨ח חִזְקִיָּ֧הוּ אֶת הַ/סְּפָרִ֛ים מִ/יַּ֥ד הַ/מַּלְאָכִ֖ים וַ/יִּקְרָאֵ֑/הוּ וַ/יַּ֨עַל֙ בֵּ֣ית יְהוָ֔ה וַ/יִּפְרְשֵׂ֥/הוּ חִזְקִיָּ֖הוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[b][a], and he went up to the house of Yahweh and spread them before Yahweh.
translation:
  language: ru
  text: Езекия взял письма из рук посланников и прочитал их[a]. Затем он поднялся в дом Яхве и разложил их перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прочитал его… разложил его». В еврейском тексте местоименные суффиксы стоят в единственном числе и, вероятно, обозначают единое письменное послание, содержащееся в письмах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: письма
  rationale: Слово סֵפֶר обозначает письменный документ; в данном повествовании речь идёт о письменном послании, доставленном ассирийскими посланниками. «Письма» — естественный русский эквивалент множественного числа.
- source_word: מִיַּד הַמַּלְאָכִים
  choice: из рук посланников
  rationale: Сохранён образ еврейского выражения «из руки», при этом русское множественное «из рук» естественно согласуется с несколькими посланниками и ясно передаёт получение документов от них.
- source_word: הַמַּלְאָכִים
  choice: посланников
  rationale: В историческом контексте מַלְאָכִים обозначает людей, доставивших послание, а не ангелов.
- source_word: וַיִּקְרָאֵהוּ
  choice: и прочитал их
  rationale: Глагол קרא при письменном объекте означает «читать». Хотя местоименный суффикс в еврейском тексте имеет форму единственного числа, он, вероятно, относится к посланию как единому содержанию писем; в русском местоимение согласовано с «письма», а особенность оригинала отмечена в сноске.
- source_word: וַיַּעַל
  choice: Затем он поднялся
  rationale: עלה сохраняет направленность движения вверх, уместную для восхождения к храму; «поднялся» звучит естественно и точно.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Буквальное «дом Яхве» сохраняет образность и богословскую лексику оригинала, не заменяя её более толковательным словом «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет различие между именем Бога и титулом «Господь».
- source_word: וַיִּפְרְשֵׂהוּ
  choice: и развернул их
  rationale: פרשׂ означает «расстилать, разворачивать». «Развернул» естественно описывает действие с письмами или свитками; русское множественное число согласовано с «письма», тогда как единственное число еврейского суффикса отражено в сноске.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Кратко и непосредственно передаёт пространственно-религиозный смысл выражения «перед лицом Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте употреблено личное имя Бога, а не титул. «Яхве» — современная научно обоснованная русская передача тетраграмматона; она сохраняет личный характер имени без конфессиональной подмены.
- issue: Единственное число местоименных суффиксов при множественном הַסְּפָרִים
  choice: В основном тексте употреблено множественное число «их», а формальная неоднозначность отмечена сноской
  alternative: «прочитал его… развернул его»
  rationale: Еврейские суффиксы единственного числа могут относиться к письменному посланию как единому целому, хотя предшествующее существительное стоит во множественном числе. Русское множественное число обеспечивает естественную связь с «письмами», не скрывая формы оригинала благодаря сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан ясным и естественным; сохранены выражения «дом Яхве» и «перед Яхве», а реальная грамматическая неоднозначность оригинала вынесена в сноску.
