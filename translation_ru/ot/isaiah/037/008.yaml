base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/008.yaml
  text: Then the Rabshakeh returned and found the king of Assyria fighting against Libnah[b][a], for he had heard that he had departed from Lachish.
translation:
  language: ru
  text: Тогда рабсак вернулся и застал царя Ассирии сражающимся против Ливны[b], потому что услышал, что тот ушёл от Лахиса.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «что он ушёл от Лахиса»; речь идёт о царе Ассирии.'
    reason: referent_clarification
  - marker: b
    text: 'Или: «сражающимся у Ливны». Еврейское выражение допускает более пространственную передачу, однако по смыслу царь вёл бой против города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: вернулся
  rationale: Повествовательная форма глагола שוב обозначает возвращение; это краткий и естественный русский эквивалент.
- source_word: רַב שָׁקֵה
  choice: рабсак
  rationale: Ассирийский придворный титул служит в повествовании обозначением уже известного должностного лица. Традиционная транслитерация не сужает его значение до одной спорной должностной функции.
- source_word: וַיִּמְצָא אֶת
  choice: застал
  rationale: В данном контексте מצא сообщает, что по возвращении чиновник обнаружил царя занятым военными действиями; «застал» естественно передаёт эту конструкцию по-русски.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царя Ассирии
  rationale: Прямой и привычный перевод сопряжённой конструкции.
- source_word: נִלְחָם עַל
  choice: сражающимся против
  rationale: Причастная форма לחם с עַל описывает ведение боя против города; перевод сохраняет враждебную направленность, не исключая пространственного оттенка.
- source_word: לִבְנָה
  choice: Ливны
  rationale: Традиционная русская библейская передача географического названия; падеж обусловлен предлогом «против».
- source_word: כִּי שָׁמַע
  choice: потому что услышал
  rationale: Первое כִּי вводит причину возвращения и обнаружения царя у Ливны. Русский контекст позволяет не повторять подлежащее, поскольку ближайший деятель — рабсак.
- source_word: כִּי נָסַע
  choice: что тот ушёл
  rationale: Второе כִּי вводит содержание услышанного; נסע означает сняться с места и отправиться прочь. Указательное «тот» ясно относит действие к царю Ассирии и снимает местоименную двусмысленность, возникающую в русском.
- source_word: מִלָּכִישׁ
  choice: от Лахиса
  rationale: Предлог מִן передаёт удаление от места; название дано в традиционной русской форме.
