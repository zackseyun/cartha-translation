  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּֽׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בּוֹטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying[b], “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: ru
  text: 'Так скажите Езекии, царю Иудеи: «Не дай твоему Богу, которому ты доверяешь, обмануть тебя[a], говоря: „Иерусалим не будет отдан в руки царя Ассирии“[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ввести тебя в заблуждение». Еврейский глагол может означать «обмануть» или «ввести в заблуждение».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в руку царя Ассирии», то есть под его власть.'
    reason: idiom_explanation
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  choice: Так скажите
  rationale: כֹּה вводит содержание послания, а форма 2-го лица множественного числа имеет побудительную силу; «Так скажите» естественно передаёт формулу поручения.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Езекии, царю Иудеи
  rationale: Сохраняется общепринятая русская форма имени и приложение с царским титулом.
- source_word: אַל יַשִּׁאֲךָ
  choice: Пусть ... не обманет тебя
  rationale: Порождение Hiphil от נשׁא в данном контексте означает «обмануть, ввести в заблуждение»; конструкция передаёт отрицательное волеизъявление без смягчения ассирийской хулы.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохранено обращение к Езекии во 2-м лице единственного числа.
- source_word: אֲשֶׁר אַתָּה בּוֹטֵחַ בּוֹ
  choice: на которого ты полагаешься
  rationale: בטח обозначает уверенное доверие или опору; «полагаться на» естественно сочетается с относительным оборотом в современном русском языке.
- source_word: לֵאמֹר
  choice: словами
  rationale: Второе לֵאמֹר вводит содержание предполагаемого обмана; «словами» ясно связывает обвинение с последующей цитатой и не перегружает русскую фразу повтором «говоря».
- source_word: לֹא תִנָּתֵן
  choice: не будет отдан
  rationale: Сохранено пассивное значение Niphal от נתן без конкретизации подразумеваемого захвата города.
- source_word: בְּיַד מֶלֶךְ אַשׁוּר
  choice: в руки царя Ассирии
  rationale: Буквальный образ «в руку» является понятной и устойчивой русской идиомой власти и подчинения; множественное «в руки» звучит естественно.
theological_decisions:
- issue: Ассирийское обвинение Бога в обмане
  choice: Пусть твой Бог ... не обманет тебя
  alternative: Пусть твой Бог ... не введёт тебя в заблуждение
  rationale: Речь принадлежит ассирийскому посланнику и намеренно кощунственна. Перевод сохраняет силу враждебного обвинения, не представляя его как истинное суждение повествователя.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского послания. Формула «Так скажите» лаконична; вложенные цитаты оформлены русскими кавычками. Сохранены резкость ассирийской насмешки и образ передачи города во власть завоевателя.
