  source_fidelity: 'Синтаксический параллелизм и образность еврейского текста переданы точно: просьбы «приклони ухо», «открой глаза», «услышь» и «увидь» сохранены, как и цель послания — оскорбление живого Бога. Однако имя סַנְחֵרִיב следует передать ближе к еврейской форме: «Санхериб», а не «Синаххериб».'
