base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/017.yaml
  text: Incline your ear, O LORD, and hear; open your eyes, O LORD, and see; and hear all the words of Sennacherib, which he has sent to mock the living God.
translation:
  language: ru
  text: Приклони, Господи, ухо Твоё и услышь; открой, Господи, очи Твои и увидь; услышь все слова Санхериба, которые он послал, чтобы поносить живого Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Приклони ... ухо Твоё
  rationale: Сохранён образ еврейского выражения «наклонить ухо»; возвышенная, но понятная русская формулировка соответствует молитвенному контексту.
- source_word: פְּקַח ... עֵינֶךָ
  choice: открой ... очи Твои
  rationale: Глагол передан буквально; «очи» поддерживает достоинство молитвенного регистра и параллелизм с «ухо Твоё».
- source_word: לְחָרֵף
  choice: чтобы поносить
  rationale: Глагол חרף означает поносить, хулить, оскорблять; «поносить» сохраняет направленность дерзкого оскорбления против живого Бога, не сводя смысл к насмешке.
- source_word: אֱלֹהִים חָי
  choice: живого Бога
  rationale: Прямое и естественное соответствие исходному выражению.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Господи
  alternative: Яхве
  rationale: В прямом молитвенном обращении использована укоренённая русская передача «Господи», без введения конфессионально маркированной реконструкции произношения имени.
- issue: Антропоморфные образы Божьего уха и глаз
  choice: Сохранить образы буквально
  alternative: 'Передать функционально: «выслушай» и «обрати внимание»'
  rationale: Исходный текст намеренно строит молитву на телесной образности и параллелизме; их не следует сглаживать или богословски переосмысливать.
translation_notes:
  register: Современный литературный русский с достоинством библейской молитвы. Синтаксический параллелизм оригинала сохранён; архаизирующее «очи» употреблено точечно, тогда как остальная лексика остаётся ясной современному читателю.
