  variant: modern literary Russian
source:
  edition: WLC
  text: הִנְ/נִ֨י נוֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב אֶל אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/007.yaml
  text: Behold[a], I am putting a spirit in him, so that he will hear a report and return to his own land[b], and I will cause him to fall by the sword in his own land.
translation:
  language: ru
  text: Вот, Я вложу в него дух[a], и он услышит весть[b], возвратится в свою землю, а Я сделаю так, что он падёт от меча в своей земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дам ему побуждение». Еврейское רוּחַ может означать дух, внутренний настрой или побуждение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «донесение», «слух». Еврейское שְׁמוּעָה обозначает полученную информацию, не уточняя, подтверждена ли она.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Передаёт указательно-эмфатическую силу частицы с местоименным суффиксом и сохраняет возвышенный тон пророческой речи без архаизма «се».
- source_word: נוֹתֵן בּוֹ רוּחַ
  choice: вложу в него дух
  rationale: Причастие после הִנְנִי указывает на предстоящее или уже решённое действие; по-русски естественный футурум передаёт эту близкую перспективу. «Вложу» ясно выражает внутреннюю направленность בּוֹ, а «дух» сохраняет смысловую широту רוּחַ.
- source_word: וְשָׁמַע שְׁמוּעָה
  choice: и он услышит весть
  rationale: Сохраняет последовательность событий, выраженную формами с waw. «Весть» обозначает полученную информацию, не уточняя её достоверность.
- source_word: וְשָׁב אֶל אַרְצוֹ
  choice: возвратится в свою землю
  rationale: «Возвратится» естественно передаёт שׁוּב в данном контексте, а «свою землю» ясно выражает местоименный суффикс.
- source_word: וְהִפַּלְתִּיו בַּחֶרֶב
  choice: а Я сделаю так, что он падёт от меча
  rationale: Передаёт каузативную форму Hiphil глагола נפל и сохраняет библейский образ насильственной смерти «от меча». Союз «а» естественно выделяет завершающее действие Бога.
- source_word: בְּאַרְצוֹ
  choice: в своей земле
  rationale: Сохраняет повтор слова «земля» и подчёркивает, что гибель произойдёт там, куда царь возвратится.
theological_decisions:
- issue: Значение רוּחַ в обещании Бога об ассирийском царе
  choice: дух, вложенный в него Богом
  alternative: внутреннее побуждение, настроение или ветер
  rationale: «Дух» сохраняет лексическую широту еврейского слова и утверждение о Божьем воздействии, не определяя сверх сказанного, идёт ли речь о духовном существе, внутреннем состоянии или побуждении.
- issue: Характер Божьей причинности в וְהִפַּלְתִּיו
  choice: Я сделаю так, что он падёт
  alternative: Я поражу его / он падёт
  rationale: Формулировка сохраняет явную каузативность Hiphil, но не уточняет непосредственного исполнителя смерти, которого данный стих не называет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим тоном. Архаичное «се» заменено на понятное «вот». Синтаксис сохраняет последовательность еврейского текста, а две сноски отмечают реальные лексические неоднозначности.
