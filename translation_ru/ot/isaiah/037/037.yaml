  text: וַ/יִּסַּ֣ע וַ/יֵּ֔לֶךְ וַ/יָּ֖שָׁב סַנְחֵרִ֣יב מֶֽלֶךְ אַשּׁ֑וּר וַ/יֵּ֖שֶׁב בְּ/נִֽינְוֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/037.yaml
  text: So Sennacherib king of Assyria departed and went and returned[a], and dwelt in Nineveh.
translation:
  language: ru
  text: И отправился Сеннахирим, царь Ассирии, и ушёл, и возвратился, и жил в Ниневии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע
  choice: отправился
  rationale: Глагол נסע в повествовании о передвижении означает «отправиться, выступить в путь». Выбор передаёт начало ухода, не добавляя прямо не упомянутого образа снятия лагеря.
- source_word: וַיֵּלֶךְ
  choice: ушёл
  rationale: Обычное значение הלך — «идти». В данном контексте «ушёл» естественно передаёт удаление Сеннахирима и при этом сохраняет отдельное звено еврейской последовательности глаголов.
- source_word: וַיָּשָׁב
  choice: возвратился
  rationale: שׁוב в контексте пути означает «возвратиться». Направление возвращения прямо не уточняется, поэтому оно не добавлено в перевод.
- source_word: סַנְחֵרִיב
  choice: Сеннахирим
  rationale: Традиционная и узнаваемая русская передача имени ассирийского царя.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Конструкция обозначает царский титул и государство Сеннахирима; по-русски естественно оформляется как приложение после имени.
- source_word: וַיֵּשֶׁב
  choice: жил
  rationale: ישׁב может означать «сидеть, оставаться, обитать, жить». Здесь после возвращения речь идёт о пребывании в Ниневии; «жил» звучит современно и не навязывает ни временности, ни нового поселения.
- source_word: בְּנִינְוֵה
  choice: в Ниневии
  rationale: Прямая передача предложного оборота с традиционной русской формой названия города.
