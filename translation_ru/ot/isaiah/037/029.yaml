base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/029.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips[b], and I will turn you back by the way that you came.
translation:
  language: ru
  text: За то, что ты неистовствуешь против Меня и твоя самоуверенность[a] донеслась до Моих ушей, Я вложу Мой крюк тебе в нос и Мои удила тебе в губы и поверну тебя назад по той дороге, по которой ты пришёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беспечность»; еврейское слово может обозначать спокойствие или чувство безопасности, а здесь, вероятно, подразумевает надменную уверенность в собственной неуязвимости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: За то, что
  rationale: Передаёт причинное основание последующего суда и естественно связывается в русском языке с будущим действием воздаяния.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: ты неистовствуешь против Меня
  rationale: Форма от רגז выражает яростное возбуждение и в данном контексте враждебную направленность против Бога; глагольная конструкция звучит по-русски естественнее отвлечённого существительного.
- source_word: שַׁאֲנַנְךָ
  choice: твоя самоуверенность
  rationale: Слово обозначает спокойствие и чувство безопасности, но здесь имеет отрицательный оттенок надменной уверенности в собственной неуязвимости. Примечание сохраняет его лексическую неоднозначность.
- source_word: עָלָה בְאָזְנָי
  choice: донеслась до Моих ушей
  rationale: Сохраняет конкретный образ слуха и основное значение идиомы, оставаясь естественным современным русским выражением.
- source_word: חַחִי בְּאַפֶּךָ
  choice: Мой крюк тебе в нос
  rationale: חח — крюк или кольцо, применяемое для управления животным либо пленником; упоминание носа сохранено буквально.
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: Мои удила — между твоих губ
  rationale: מתג обозначает удила; русская конструкция «между губ» ясно передаёт конкретный образ и избегает неестественного буквального выражения «в губах».
- source_word: וַהֲשִׁיבֹתִיךָ
  choice: поверну тебя назад
  rationale: Каузативная форма שוב показывает, что Бог заставит царя возвратиться; перевод сохраняет принудительный характер действия.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: по той дороге, по которой ты пришёл
  rationale: Точно передаёт возвращение прежним путём и звучит естественно в современном русском языке.
theological_decisions:
- issue: Антропоморфные образы Божьего слуха и Божьего господства над вражеским царём
  choice: Сохранить конкретные образы «до Моих ушей», «Мой крюк» и «Мои удила».
  alternative: 'Передать отвлечённо: «Я услышал твою надменность, поэтому обуздаю тебя и отправлю назад».'
  rationale: В еврейском тексте намеренно соединены антропоморфный образ слышащего Бога и образ царя как управляемого животного или пленника. Их сохранение передаёт риторическую силу текста, не превращая образный язык в догматическое утверждение о телесности Бога.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской образностью. Обращение к Богу передано с традиционным прописным «Меня/Моих», тогда как местоимения, относящиеся к ассирийскому царю, оставлены со строчной буквы.
