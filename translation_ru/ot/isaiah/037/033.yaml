  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבוֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עֳלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/033.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He will not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or heap up a siege ramp against it.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве о царе Ассирии: «Не войдёт он в этот город и не пустит туда стрелу, не подступит к нему со щитом[a] и не насыплет против него осадного вала[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не выступит против него со щитом». Еврейское выражение рисует приближение к городу для приступа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не выльет на него насыпь». Речь идёт о сооружении осадной насыпи, или приступного вала.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод, следующий из предшествующего пророческого слова.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет обычную пророческую формулу и передаёт тетраграмматон личным именем «Яхве».
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: о царе Ассирии
  rationale: В данной формуле אֶל вводит того, кого касается провозглашаемое слово; «о» естественно согласуется с содержанием речи.
- source_word: לֹא יָבוֹא אֶל הָעִיר הַזֹּאת
  choice: не войдёт он в этот город
  rationale: Передаёт движение внутрь города; местоимение подчёркивает, что царь представляет наступающее ассирийское войско.
- source_word: יוֹרֶה שָׁם חֵץ
  choice: не пустит туда стрелы
  rationale: Естественное современное русское обозначение выстрела из лука; «туда» сохраняет שָׁם и отсылает к городу.
- source_word: יְקַדְּמֶנָּה מָגֵן
  choice: не подступит к нему со щитом
  rationale: Передаёт приближение к городу для нападения под защитой щита, не устраняя образную неоднозначность глагола קדם.
- source_word: יִשְׁפֹּךְ עֳלֶיהָ סֹלְלָה
  choice: не насыплет против него осадного вала
  rationale: В осадном контексте сочетание обозначает сооружение насыпи или приступного вала; «насыплет» отчасти сохраняет конкретный образ שׁפך.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Адресат или предмет пророчества в אֶל מֶלֶךְ אַשּׁוּר
  choice: о царе Ассирии
  alternative: царю Ассирии; против царя Ассирии
  rationale: Речь сообщает о том, чего ассирийский царь не совершит, поэтому «о» естественно передаёт предмет пророчества, не усиливая значение до «против».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя; военная образность и параллелизм еврейского текста сохранены.
