id: ISA.37.4
reference: Isaiah 37:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/004.yaml
  text: Perhaps Yahweh your God will hear the words of the Rabshakeh[a], whom the king of Assyria his master has sent to reproach the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that is found.
translation:
  language: ru
  text: Может быть, Яхве, твой Бог, услышит слова рабсака[a], которого его господин, царь Ассирии, послал поносить живого Бога, и взыщет за слова, которые услышал Яхве, твой Бог.[b] Поэтому вознеси молитву за уцелевший остаток[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главного виночерпия». «Рабсак» — ассирийский должностной титул, употреблённый здесь почти как имя.'
    reason: cultural_note
  - marker: b
    text: 'Или: «обличит эти слова» или «призовёт к ответу за эти слова». Еврейское выражение может означать, что Бог ответит на услышанную хулу или осудит её.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «за тех уцелевших, кто ещё остался». Еврейское выражение буквально указывает на остаток, который ещё находится налицо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: Может быть, … услышит
  rationale: Передаёт надежду и возможность, не превращая их в уверенное предсказание; сохраняет основной смысл глагола «слышать».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: רַב שָׁקֵה
  choice: рабсак
  rationale: Традиционная русская передача ассирийского должностного титула, который в повествовании употребляется почти как обозначение лица.
- source_word: לְחָרֵף
  choice: поносить
  rationale: Выражает оскорбительную, хульную речь против Бога, не сводя её только к насмешке или военному вызову.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: и взыщет за слова
  rationale: Естественно по-русски передаёт ожидаемый Божий ответ и суд за услышанную хулу; возможный оттенок «обличит» указан в примечании.
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: Поэтому вознеси молитву
  rationale: «Вознеси молитву» сохраняет образность еврейского выражения; связка «поэтому» передаёт вывод-просьбу в данном контексте.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: уцелевший остаток
  rationale: Сохраняет значимое для Исаии понятие «остаток», а причастие передаёт тех, кто ещё остался в наличии и пережил бедствие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное Божье имя; форма «Яхве» прямо передаёт его и не смешивает имя с титулом.
- issue: Значение וְהוֹכִיחַ в отношении хульных слов
  choice: взыщет за слова
  alternative: обличит эти слова; призовёт к ответу за слова
  rationale: Контекст допускает как обличение, так и судебное воздаяние. Основной текст не уточняет способ Божьего ответа, а примечание сохраняет смысловой диапазон.
- issue: Передача שְׁאֵרִית
  choice: остаток
  alternative: уцелевшие; те, кто ещё остался
  rationale: «Остаток» сохраняет богословски значимый для книги Исаии мотив, не утверждая сверх того, что сказано в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для широкого читателя; сохранены имя «Яхве», исторический титул «рабсак» и тематически значимое слово «остаток». Все примечания отмечены в основном тексте.
