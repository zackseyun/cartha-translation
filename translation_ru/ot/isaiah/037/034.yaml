id: ISA.37.34
reference: Isaiah 37:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר בָּ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָב֖וֹא נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/034.yaml
  text: By the way that he came, by it he will return, and he will not come into this city, declares Yahweh.
translation:
  language: ru
  text: По той дороге, по которой он пришёл, он и возвратится; в этот город он не войдёт, — возвещает Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ
  choice: По той дороге
  rationale: דֶּרֶךְ здесь обозначает дорогу или путь передвижения; «по той дороге» естественно по-русски и подготавливает относительное придаточное.
- source_word: אֲשֶׁר בָּא בָּהּ
  choice: по которой он пришёл
  rationale: Женский суффикс в בָּהּ относится к דֶּרֶךְ. Русское «по которой» передаёт эту связь и повтор предлога без неестественного удвоения.
- source_word: יָשׁוּב
  choice: он и возвратится
  rationale: שׁוּב означает возвращение назад; частица «и» подчёркивает, что возвращение состоится именно той же дорогой.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבוֹא
  choice: в этот город он не войдёт
  rationale: При בוא с направлением אֶל русский глагол «войти» естественно выражает движение внутрь города. Хотя повтор корня בוא становится менее явным, формулировка точнее и естественнее, чем «не придёт в этот город» в данном контексте угрозы вторжения.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — торжественная пророческая формула; «возвещает» сохраняет её вес. Тетраграмматон передан личным именем «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит Тетраграмматон; «Яхве» передаёт личное заветное имя и соответствует предоставленному доктринальному решению.
- issue: Характер формулы נְאֻם יהוה
  choice: возвещает Яхве
  alternative: говорит Яхве; слово Яхве
  rationale: «Возвещает» передаёт формальный пророческий характер נְאֻם, не добавляя толкования к содержанию изречения.
translation_notes:
  register: Современный литературный русский язык, сдержанный и торжественный пророческий регистр. Синтаксический параллелизм и акцент на той же дороге сохранены; архаизмы избегаются.
