  source_fidelity: 'Основной смысл передан точно: כִּי имеет объяснительное «ибо», оба предлога מִן переданы как исходная точка, а пророческое будущее תֵּצֵא — формой «выйдет». Тире во второй строке уместно передаёт эллипсис глагола. Однако קִנְאַת в данном контексте деятельного осуществления обещанного прежде всего означает «рвение, пыл»; «ревность» допустима как лексическая альтернатива, но в основном тексте по-русски сильнее вызывает иной, личностно-собственнический смысл.'
