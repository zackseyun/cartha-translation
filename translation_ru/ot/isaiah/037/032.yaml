base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/032.yaml
  text: For from Jerusalem a remnant will go out[a], and survivors from Mount Zion. The zeal of Yahweh of hosts will do this.
translation:
  language: ru
  text: 'Ибо из Иерусалима выйдет остаток,

    и уцелевшие — с горы Сион.

    Рвение[a] Яхве Воинств совершит это.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «ревность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предшествующему обещанию; «ибо» естественно передаёт эту связь в литературном русском языке.
- source_word: מִירוּשָׁלִַם
  choice: из Иерусалима
  rationale: Предлог מִן обозначает исходную точку движения.
- source_word: תֵּצֵא
  choice: выйдет
  rationale: Форма Qal imperfect от יצא имеет здесь предсказательное, будущее значение; «выйдет» прямо передаёт движение из города.
- source_word: שְׁאֵרִית
  choice: остаток
  rationale: Сохранён характерный для пророческой речи образ части народа, оставшейся после бедствия или суда.
- source_word: וּפְלֵיטָה
  choice: и уцелевшие
  rationale: В параллели с «остатком» слово обозначает спасшихся людей, а не отвлечённое избавление.
- source_word: מֵהַר צִיּוֹן
  choice: с горы Сион
  rationale: Предлог указывает на исходную точку; «гора Сион» сохраняет географическое и богословское обозначение.
- source_word: קִנְאַת
  choice: Ревность
  rationale: 'Русское «ревность» сохраняет смысловую широту еврейского слова: горячее рвение и ревнивую, исключительную приверженность завету. Сноска поясняет возможные оттенки.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет широкий смысл устойчивого божественного именования, не ограничивая его только человеческими армиями.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: совершит это
  rationale: Передаёт прямое утверждение о том, что именно ревность Яхве приведёт обещанное к исполнению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение קִנְאַת применительно к Богу
  choice: ревность
  alternative: рвение; ревнивая любовь
  rationale: Контекст подчёркивает деятельную и исключительную верность Яхве своему обещанию. «Ревность» сохраняет присущую еврейскому слову напряжённость и не устраняет его смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм двух строк сохранён; тире во второй строке естественно восполняет пропущенный в еврейском тексте глагол.
