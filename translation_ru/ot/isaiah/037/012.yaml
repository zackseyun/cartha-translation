base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Telassar?
translation:
  language: ru
  text: Разве боги народов, которых уничтожили мои предки, спасли их — Гозан, Харран, Рецеф и жителей Эдена[a], живших в Телассаре?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Эдена», то есть народ Эдена или его жители.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: Разве ... спасли
  rationale: Перфект породы hифиль от נצל в риторическом вопросе. «Разве» естественно передаёт насмешливую отрицательную направленность вопроса, а «спасли» соответствует военному контексту.
- source_word: אוֹתָם
  choice: их
  rationale: Местоимение прямого дополнения сохранено; последующий перечень уточняет, кого именно не спасли.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: боги народов
  rationale: Сочетание обозначает богов чужих народов; «народы» уместно в данном геополитическом контексте.
- source_word: אֲשֶׁר הִשְׁחִיתוּ אֲבוֹתַי
  choice: которых уничтожили мои предки
  rationale: Hифиль שׁחת передаёт уничтожение или разорение. «Предки» ясно выражает династический смысл אֲבוֹתַי и не вызывает ассоциации только с непосредственными отцами.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: Гозан, Харран, Рецеф
  rationale: Географические названия переданы устойчивой русской библейской транслитерацией, близкой к еврейской форме.
- source_word: וּבְנֵי עֶדֶן
  choice: жителей Эдена
  rationale: Буквально «сынов Эдена»; в данном контексте בני обозначает жителей или народ, связанный с Эденом. Естественный русский эквивалент вынесен в текст, буквальная форма — в сноску.
- source_word: אֲשֶׁר בִּתְלַשָּׂר
  choice: живших в Телассаре
  rationale: Относительное придаточное естественнее всего относится к жителям Эдена и указывает их местонахождение; добавленное «живших» делает эллиптическую еврейскую конструкцию ясной по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторическое «Разве» сохраняет насмешливый вызов; синтаксис сделан естественным, без устранения связи местоимения «их» с последующим перечнем.
