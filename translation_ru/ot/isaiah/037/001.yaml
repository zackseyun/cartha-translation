base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/001.yaml
  text: And it happened[a], when King Hezekiah heard it, that he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: ru
  text: Когда царь Езекия услышал это[a], он разорвал одежды, облачился во вретище и вошёл в дом Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «когда царь Езекия услышал»; что именно он услышал, ясно из предыдущего контекста.'
    reason: В русском тексте добавлено подразумеваемое дополнение «это».
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Еврейская повествовательная формула вводит последующее событие; краткое «И было» сохраняет её функцию и библейскую торжественность без архаичного «и случилось так».
- source_word: כִּשְׁמֹעַ
  choice: когда … услышал это
  rationale: Предлог כ с инфинитивом שמע выражает временное обстоятельство. Дополнение в еврейском тексте не названо, но для естественной русской речи восстановлено из предшествующего контекста как «это» и отмечено сноской.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: царь Езекия
  rationale: Сочетание титула и имени естественно передаётся по-русски как «царь Езекия».
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: он разорвал свои одежды
  rationale: Сохранено буквальное действие, служившее знаком скорби и потрясения; «одежды» соответствует множественному числу בגדים и уместно в литературном регистре.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: надел вретище
  rationale: Возвратная форма глагола описывает облачение в грубую траурную ткань. «Надел вретище» естественно и кратко передаёт действие и его культурное значение.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: вошёл в дом Яхве
  rationale: בוא перед בית обозначает вход в храм; «дом Яхве» сохраняет устойчивое обозначение святилища и личное Божье имя.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан общепринятой русской транслитерацией личного имени, а не заменён титулом.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя יְהוָה. Передача «Яхве» сохраняет различие между именем и титулом и не привносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Слово «вретище» сохранено как точное и укоренённое обозначение траурной одежды из грубой ткани; синтаксис сделан ясным и естественным.
