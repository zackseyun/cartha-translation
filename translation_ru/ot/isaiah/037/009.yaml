    text: 'Или: «царе Эфиопии». Куш — древнее название области к югу от Египта, прежде всего связанной с Нубией; её границы не совпадают точно с границами современной Эфиопии.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с тобой». В данном военном контексте имеется в виду «против тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עַל
  choice: И услышал он о
  rationale: Сохраняет повествовательный союз и основное значение שׁמע; сочетание с עַל естественно передаётся по-русски как «услышал о».
- source_word: תִּרְהָקָה
  choice: Тиргака
  rationale: Традиционная русская библейская передача имени, соответствующая еврейской форме; после предлога имя поставлено в предложный падеж.
- source_word: מֶלֶךְ כּוּשׁ
  choice: царь Куша
  rationale: Сохраняет древний географический этноним כּוּשׁ и не отождествляет его безоговорочно с современной Эфиопией.
- source_word: לֵאמֹר
  choice: двоеточие / сказать
  rationale: Первое לֵאמֹר естественно выражено вводом прямой речи через двоеточие; заключительное сохранено глаголом «сказать», поскольку речь продолжается в следующем стихе.
- source_word: יָצָא לְהִלָּחֵם
  choice: выступил, чтобы сразиться
  rationale: «Выступил» естественно передаёт военное движение, а «сразиться» — значение инфинитива לחם в данном контексте.
- source_word: אִתָּךְ
  choice: с тобой
  rationale: Формально сохраняет предлог אֵת «с»; военный контекст ясно придаёт сочетанию противительное значение, не требуя замены на «против тебя».
- source_word: וַיִּשְׁמַע וַיִּשְׁלַח
  choice: Услышав это, он снова послал
  rationale: Причастно-деепричастная связь устраняет тяжёлый дословный повтор. «Снова» передаёт контекст повторной отправки посланников, хотя отдельно в данной фразе не выражено лексически.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В царском и военном контексте речь идёт о человеческих посланцах; «вестники» сохраняет широкий смысл слова.
- source_word: אֶל חִזְקִיָּהוּ
  choice: к Езекии
  rationale: Использована укоренившаяся русская форма имени и естественное управление глагола «послать».
