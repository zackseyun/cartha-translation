  text: And he heard concerning Tirhakah king of Cush[a], saying, “He has come out to fight against you.” And when he heard, he sent messengers to Hezekiah, saying[b],
translation:
  language: ru
  text: 'И он услышал о Тирхаке, царе Куша[a]: «Он выступил, чтобы сразиться против тебя[b]». Услышав это, он послал вестников к Езекии с такими словами:'
