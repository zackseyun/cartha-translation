  yaml_path: translation/ot/isaiah/037/028.yaml
  text: But I know your sitting down[a], your going out, your coming in, and your raging against me.
translation:
  language: ru
  text: Но Я знаю, когда ты садишься, когда выходишь и когда входишь, и твою ярость против Меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: когда ты садишься
  rationale: Инфинитивная форма от ישׁב с суффиксом 2-го лица ед. числа. Конкретный образ сидения сохранён, а придаточная конструкция естественно передаёт еврейский ряд действий; возможен также более широкий смысл пребывания или оседлой жизни.
- source_word: וְצֵאתְךָ
  choice: когда выходишь
  rationale: Прямо передаёт יצא и сохраняет устойчивую пару с «входишь», обозначающую передвижения и деятельность человека.
- source_word: וּבוֹאֲךָ
  choice: когда входишь
  rationale: Прямой и естественный эквивалент בוא в паре с «выходишь».
- source_word: יָדָעְתִּי
  choice: Я знаю
  rationale: Перфект Qal 1-го лица ед. числа здесь выражает полное и достоверное знание Бога; русское настоящее время естественно передаёт актуальность этого знания в контексте.
- source_word: הִתְרַגֶּזְךָ
  choice: как ты свирепствуешь
  rationale: Форма Hitpael от רגז обозначает сильное возбуждение, ярость и враждебное поведение. «Свирепствуешь» передаёт активную и направленную против Бога ярость, не сводя её лишь к внутреннему волнению.
- source_word: אֵלַי
  choice: против Меня
  rationale: Хотя אל обычно означает направление «к, по направлению к», при обозначении враждебной ярости по-русски естественно выражается противительный смысл.
- source_word: וְאֵת
  choice: и
  rationale: Показатель прямого дополнения отдельно не переводится; его координирующая функция отражена союзом перед последним объектом знания.
theological_decisions:
- issue: Божественное знание, выраженное перфектом
  choice: Я знаю
  alternative: Я знал; Я узнал
  rationale: Настоящее время передаёт актуальное и несомненное знание Господа о действиях и враждебности ассирийского царя, не добавляя к тексту дополнительных догматических уточнений.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Заглавные местоимения «Я» и «Меня» обозначают говорящего Господа. Пара «выходишь — входишь» сохраняет конкретную образность и идиоматическую всеохватность оригинала.
