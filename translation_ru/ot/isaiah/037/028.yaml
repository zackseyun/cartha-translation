review_pass:
  verdict: revise
  source_fidelity: В целом ряд «сидеть/выходить/входить» и настоящее «Я знаю» переданы верно. Однако הִתְרַגֶּזְךָ обозначает яростное, возмущённое враждебное отношение; «как ты свирепствуешь» скорее описывает жестокие действия и потому сужает/смещает смысл.
  naturalness: Фраза с повтором «когда» естественна, но финальное «как ты свирепствуешь» стилистически тяжеловесно и семантически менее точно. Существительное «ярость» естественно сочетается с «против Меня».
  terminology: Заглавные местоимения уместны в принятом возвышенном регистре. «Ярость против Меня» передаёт враждебную направленность אלי без богословских добавлений.
  issues:
  - severity: medium
    issue: «Как ты свирепствуешь» неточно передаёт הִתְרַגֶּזְךָ.
    rationale: «Свирепствовать» обычно значит проявлять жестокость, бесчинствовать; еврейское слово здесь говорит о ярости/возмущении, направленных против говорящего. «Твою ярость против Меня» сохраняет объектную структуру и враждебный смысл.
  - severity: low
    issue: Сноска сформулирована не вполне параллельно основному ряду.
    rationale: В варианте «где ты пребываешь, когда выходишь и когда входишь» первый элемент выражен местом, а остальные — временем. Лучше дать параллельные существительные или прямо назвать альтернативу «пребывание».
  revised_text: Но Я знаю, когда ты садишься, когда выходишь и когда входишь, и твою ярость против Меня.
