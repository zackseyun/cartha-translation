  text: אֲנִ֥י קַ֖רְתִּי וְ/שָׁתִ֣יתִי מָ֑יִם וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/025.yaml
  text: I dug and drank water[b][a], and with the sole of my feet I dried up all the streams of Egypt.
translation:
  language: ru
  text: Я копал и пил воду, и подошвами моих ног иссушил все протоки Египта.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «все протоки Мацора». «Мацор», вероятно, является поэтическим или вариантным названием Египта; «протоки» могут означать также каналы или рукава Нила.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Я
  rationale: Самостоятельное местоимение выражает хвастливое самоутверждение; в русском явное «я» уже передаёт это ударение без неестественного «я сам».
- source_word: קַרְתִּי
  choice: копал колодцы
  rationale: В контексте добывания воды глагол означает копать ради доступа к воде; дополнение «колодцы» делает подразумеваемый объект ясным и естественным по-русски.
- source_word: וְשָׁתִיתִי מָיִם
  choice: и пил воду
  rationale: Прямое и естественное соответствие еврейскому выражению; множественное по форме מָיִם по-русски передаётся словом «вода».
- source_word: וְאַחְרִב
  choice: и иссушил
  rationale: Каузативная форма חרב при водных потоках означает «сделал сухими»; «иссушил» сохраняет конкретный образ и возвышенный поэтический строй.
- source_word: בְּכַף פְּעָמַי
  choice: стопами ног моих
  rationale: כַּף применительно к ноге обозначает стопу, а всё выражение рисует гиперболический образ иссушения вод одним попиранием.
- source_word: כֹּל יְאֹרֵי
  choice: все протоки
  rationale: יְאֹרֵי в египетском контексте может обозначать рукава Нила или каналы; «протоки» естественно передаёт водные русла, не сужая значение исключительно до искусственных каналов.
- source_word: מָצוֹר
  choice: Египта
  rationale: Здесь מָצוֹר, вероятнее всего, является поэтическим названием Египта, особенно в сочетании с его водными протоками; эта идентификация вынесена также в примечание.
