  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֖/נוּ מִ/יָד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּֽי אַתָּ֥ה יְהוָ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/020.yaml
  text: And now[a], Yahweh our God, save us from his hand[b], so that all the kingdoms of the earth may know that you alone are Yahweh.
translation:
  language: ru
  text: И теперь, Яхве, Бог наш, спаси нас из его руки[a], чтобы все царства земли узнали, что Ты один — Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение: «из его руки», то есть из-под его власти.'
    reason: idiom_explanation
  - marker: b
    text: 'Буквально: «что Ты — Яхве, Ты один».'
    reason: literal_rendering
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как соединительный ו, так и временно-дискурсивное עַתָּה; естественно вводит кульминационную просьбу в молитве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֱלֹהֵינוּ
  choice: Бог наш
  rationale: Точно передаёт форму с суффиксом первого лица множественного числа и естественно звучит в русском молитвенном обращении.
- source_word: הוֹשִׁיעֵנוּ
  choice: спаси нас
  rationale: Прямая и естественная передача побудительной формы породы hифиль от ישׁע; в данном контексте речь о спасении от власти ассирийского царя.
- source_word: מִיָדוֹ
  choice: от его руки
  rationale: Сохраняет конкретный еврейский образ руки как власти или контроля; значение разъяснено в сноске.
- source_word: וְיֵדְעוּ
  choice: чтобы … узнали
  rationale: После просьбы форма выражает ожидаемую цель или результат; «чтобы» естественно передаёт эту связь, не устраняя полностью оттенок результата.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: все царства земли
  rationale: Международный контекст указывает на универсальный смысл אֶרֶץ; «земли» сохраняет библейскую широту выражения.
- source_word: כִּי
  choice: что
  rationale: Вводит содержание того, что должны узнать царства.
- source_word: אַתָּה יְהוָה לְבַדֶּךָ
  choice: Ты один — Яхве
  rationale: Сохраняет краткость и акцент לְבַדֶּךָ на исключительности Яхве, не добавляя прямо отсутствующее в тексте слово «Бог».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя; транслитерация «Яхве» сохраняет его и не подменяет титулом.
- issue: Смысл заключительного אַתָּה יְהוָה לְבַדֶּךָ
  choice: Ты один — Яхве
  alternative: Ты — Яхве, Ты один; только Ты — Яхве
  rationale: Выбранная формулировка передаёт исключительное утверждение исходного текста, но не разворачивает его в пояснение «Ты один являешься Богом», которого в стихе прямо нет.
- issue: Связь וְיֵדְעוּ с просьбой
  choice: 'цель: «чтобы … узнали»'
  alternative: 'результат: «и тогда … узнают»'
  rationale: Контекст молитвенной просьбы благоприятствует целевому прочтению, хотя еврейская форма допускает близкий оттенок результата.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным молитвенным строем. Сохранены личное имя «Яхве» и еврейский образ «руки»; местоимение «Ты» написано с прописной буквы как уместная русская форма благоговейного обращения к Богу.
