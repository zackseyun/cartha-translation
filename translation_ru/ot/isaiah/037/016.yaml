id: ISA.37.16
reference: Isaiah 37:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/016.yaml
  text: O Yahweh of hosts[a], God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.
translation:
  language: ru
  text: О Яхве Воинств, Бог Израиля, восседающий на херувимах[a]! Ты, и только Ты, — Бог над всеми царствами земли. Ты сотворил небеса и землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обитающий между херувимами»; или: «восседающий над херувимами».'
    reason: Лексико-синтаксическая неоднозначность выражения יֹשֵׁב הַכְּרֻבִים, в котором отношение к херувимам не обозначено явным предлогом.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет широкий смысл войск и небесных сил в составе устойчивого божественного титула, не сужая его до земных армий.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Естественно и точно передаёт конструкцию принадлежности; контекст требует единственного числа.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: восседающий на херувимах
  rationale: Причастие יֹשֵׁב в храмово-царском контексте выражает образ царственного восседания. Предлог «на» передаёт связь с херувимами, не добавляя отсутствующего в еврейском тексте слова «между».
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: Ты, и только Ты, — Бог
  rationale: Сочетание אַתָּה הוּא и לְבַדְּךָ имеет сильное эмфатическое и исключительное значение; русская конструкция сохраняет это усиление без философского расширения.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: над всеми царствами земли
  rationale: Предлог «над» естественно выражает подразумеваемое здесь владычество Бога по отношению ко всем земным царствам.
- source_word: עָשִׂיתָ
  choice: сотворил
  rationale: В контексте создания небес и земли русское «сотворил» естественно передаёт עשה, не меняя референта действия; оно несколько возвышеннее нейтрального «сделал» и уместно в молитве.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: небеса и землю
  rationale: Сохраняет множественное число «небеса» и традиционную формулу всеохватности творения.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Исключительность Бога в אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: Ты, и только Ты, — Бог
  alternative: Ты — единственный Бог; Ты один — Бог
  rationale: Выбранная формулировка передаёт и эмфатическое местоимение, и явное «только Ты», сохраняя силу исповедания без дополнительной догматической конкретизации.
- issue: Образ יֹשֵׁב הַכְּרֻבִים
  choice: восседающий на херувимах
  alternative: обитающий между херувимами; восседающий над херувимами
  rationale: Еврейский текст не содержит явного предлога. Основной перевод сохраняет царский образ, а примечание отмечает традиционные пространственные истолкования.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным звучанием. Обращение оформлено восклицанием; эмфаза передана конструкцией «Ты, и только Ты». Маркер примечания поставлен непосредственно после спорного выражения о херувимах.
