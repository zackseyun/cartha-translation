  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/003.yaml
  text: 'And they said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[b], and there is no strength to give birth.”'
translation:
  language: ru
  text: 'И они сказали ему: «Так говорит Езекия: этот день — день бедствия, обличения и поругания, ибо дети дошли до самого рождения[a], а сил родить нет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дети дошли до машбера». Значение этого слова в данном образе толкуют как родильный стул, место родов или критический момент родов. Смысл метафоры: роды дошли до решающего момента, но сил для рождения нет.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: И они сказали ему
  rationale: Естественно передаёт повествовательную последовательность и косвенное дополнение, не добавляя отсутствующего в еврейском тексте повтора.
- source_word: כֹּה אָמַר חִזְקִיָּהוּ
  choice: Так говорит Езекия
  rationale: Сохраняет торжественную формулу передачи речи; перфект в этой устойчивой формуле уместно передать русским настоящим временем.
- source_word: יוֹם צָרָה
  choice: день бедствия
  rationale: צָרָה обозначает беду, тяжёлое положение или бедствие; выбранный вариант соответствует масштабу национального кризиса.
- source_word: וְתוֹכֵחָה
  choice: обличения
  rationale: Сохраняет значение укора или порицания, не уточняя без достаточных оснований, исходит ли оно непосредственно от Бога или от врага.
- source_word: וּנְאָצָה
  choice: поругания
  rationale: Передаёт презрение, поношение и бесчестье; не сужает многозначное слово до одного лишь богохульства.
- source_word: הַיּוֹם הַזֶּה
  choice: этот день
  rationale: Сохраняет указательное выражение и его торжественный акцент.
- source_word: כִּי בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: потому что младенцы подошли к самому рождению
  rationale: 'Передаёт образ родов: дети достигли момента появления на свет. «Младенцы» естественнее по-русски в данном образе и не ограничивает смысл младенцами мужского пола.'
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: но нет сил родить
  rationale: Ясно завершает метафору родов; противительный союз естественно выражает подразумеваемый контраст между наступившим моментом рождения и отсутствием сил.
theological_decisions:
- issue: Метафора родов как образ национального кризиса
  choice: 'Сохранить образ прямо: младенцы достигли момента рождения, но сил родить нет.'
  alternative: Передать общий смысл как «кризис достиг предела, а сил у нас нет».
  rationale: Буквенный образ составляет риторическую силу высказывания и выражает одновременно близость избавления и полную человеческую беспомощность; разворачивать его в однозначное богословское толкование не следует.
- issue: Источник обличения и поругания
  choice: Не называть прямо ни Бога, ни ассирийцев субъектом этих понятий.
  alternative: «день Божьего наказания» или «день вражеского поношения».
  rationale: Еврейская именная цепочка не указывает субъекта однозначно; перевод должен сохранить эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Трёхчленная формула «бедствия, обличения и поругания» сохранена; архаизмы и конфессионально окрашенные уточнения не вводятся.
