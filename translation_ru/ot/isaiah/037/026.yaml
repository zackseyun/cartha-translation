base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/026.yaml
  text: Have you not heard? Long ago I made it; from days of old I formed it. Now I have brought it to pass[a], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: ru
  text: Разве ты не слышал? Издавна Я сделал это, с древних дней Я сформировал это; теперь же Я привёл это в исполнение[a], чтобы ты превратил укреплённые города в груды развалин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная часть еврейского текста синтаксически трудна; дословно: «чтобы опустошать груды, укреплённые города». Возможен также перевод: «и укреплённые города стали грудами развалин».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  choice: Разве ты не слышал?
  rationale: Риторический вопрос ожидает утвердительного ответа и сохраняет обличительный тон обращения к ассирийскому царю.
- source_word: לְמֵרָחוֹק
  choice: издавна
  rationale: Хотя выражение буквально связано с удалённостью, здесь оно обозначает отдалённое прошлое.
- source_word: אֹתָהּ עָשִׂיתִי
  choice: Я совершил это
  rationale: Местоимение указывает на подразумеваемый замысел или дело; «совершил» передаёт действенный смысл עשה, не сводя высказывание к одному лишь предвидению.
- source_word: מִימֵי קֶדֶם וִיצַרְתִּיהָ
  choice: в древние дни предначертал
  rationale: יצר буквально означает «сформировать, придать вид», а применительно к будущему событию выражает намеренное определение замысла. «Предначертал» естественно передаёт этот смысл и сохраняет возвышенный пророческий регистр.
- source_word: עַתָּה הֲבֵאתִיהָ
  choice: теперь же Я привёл это в исполнение
  rationale: Каузативная форма בוא обозначает осуществление ранее определённого замысла в истории.
- source_word: לְהַשְׁאוֹת
  choice: обращал … в … развалины
  rationale: Инфинитив передаёт опустошение и разорение; русская конструкция ясно выражает результат разрушения.
- source_word: גַּלִּים נִצִּים עָרִים בְּצֻרוֹת
  choice: укреплённые города в груды развалин
  rationale: 'Текст в этой части труден, однако общий образ ясен: укреплённые города становятся грудами руин.'
theological_decisions:
- issue: Божественная власть над завоеваниями Ассирии
  choice: Успех ассирийского царя представлен как осуществление давнего Божьего замысла.
  alternative: Понимать слова только как указание на Божье предведение событий.
  rationale: Последовательность «совершил… предначертал… привёл в исполнение» приписывает происходящее целенаправленному Божьему действию, не объясняя при этом отношения между Божьей властью и ответственностью царя.
- issue: Субъект заключительного действия
  choice: 'Сохранено обращение ко второму лицу: «чтобы ты обращал».'
  alternative: 'Передать безлично: «чтобы укреплённые города стали грудами развалин».'
  rationale: Контекст прямо обращён к ассирийскому царю, а трудную конструкцию וּתְהִי можно понимать как вводящую его роль в наступившем результате. Неоднозначность синтаксиса отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Формы «издавна» и «предначертал» сохраняют достоинство текста, оставаясь понятными современному читателю.
