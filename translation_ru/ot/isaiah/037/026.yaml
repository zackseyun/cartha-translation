revisions:
- from: Разве ты не слышал? Издавна Я совершил это, в древние дни предначертал; теперь же Я привёл это в исполнение[a], чтобы ты обращал укреплённые города в груды развалин.
  to: Разве ты не слышал? Издавна Я сделал это, с древних дней Я сформировал это; теперь же Я привёл это в исполнение[a], чтобы ты превратил укреплённые города в груды развалин.
  rationale: Исправление различает древнее Божье действие «сделал/сформировал» и его нынешнее осуществление, ближе передаёт образ יצר и сохраняет обращение ко второму лицу в трудной заключительной конструкции. Сноска прямо отмечает синтаксическую трудность и альтернативное безличное понимание.
