  text: אַיֵּ֤ה מֶֽלֶךְ חֲמָת֙ וּ/מֶ֣לֶךְ אַרְפָּ֔ד וּ/מֶ֖לֶךְ לָעִ֣יר סְפַרְוָ֑יִם הֵנַ֖ע וְ/עִוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, of Hena[b], and of Ivvah?
translation:
  language: ru
  text: Где царь Хамата, царь Арпада и царь города Сефарваима, Хены и Иввы?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально ставит названия Хены и Иввы после слов «царь города Сефарваима», не повторяя слово «царь»; их можно понимать и как следующие пункты перечня: «[царь] Хены и [царь] Иввы».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אַיֵּה
  choice: Где
  rationale: Вопросительное наречие «где?». В русском не требуется выражать число, поэтому оно естественно охватывает весь последующий перечень.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Обычное соответствие еврейскому слову מֶלֶךְ. Троекратное повторение в исходном тексте сохранено там, где слово выражено явно.
- source_word: חֲמָת
  choice: Хамат
  rationale: Устоявшаяся русская передача географического названия; в сочетании с «царь» употреблён родительный падеж «Хамата».
- source_word: אַרְפָּד
  choice: Арпад
  rationale: Устоявшаяся русская транслитерация; в тексте дан родительный падеж «Арпада».
- source_word: לָעִיר
  choice: города
  rationale: Предлог לְ при עִיר передан как часть именной связи «царь города…», что соответствует синтаксису насмешливого перечисления и естественно звучит по-русски.
- source_word: סְפַרְוָיִם
  choice: Сефарваим
  rationale: Традиционная и узнаваемая русская форма топонима; после «города» употреблена форма «Сефарваима».
- source_word: הֵנַע
  choice: Хена
  rationale: Транслитерация еврейского топонима с начальным гортанным согласным, обычно передаваемым в русском буквой «х»; в тексте — «Хены».
- source_word: עִוָּה
  choice: Ивва
  rationale: Русская передача еврейского топонима с удвоенным согласным; в тексте — родительный падеж «Иввы».
theological_decisions:
- issue: Синтаксическая связь названий Сефарваим, Хена и Ивва
  choice: 'Сохранить единый ряд после третьего слова «царь»: «царь города Сефарваима, Хены и Иввы»'
  alternative: Восполнить подразумеваемое множественное «цари Хены и Иввы» или разделить перечень на отдельные вопросы
  rationale: В еврейском тексте слово מֶלֶךְ перед этим рядом выражено только один раз, а названия Хена и Ивва следуют без дополнительного слова «царь». Основной текст сохраняет эту формальную неоднозначность, а примечание предупреждает о возможном понимании перечисления.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной краткости и повторов исходного насмешливого вопроса. Использованы узнаваемые русские формы древних топонимов; синтаксическая неоднозначность исходного перечня не устранена без оговорки.
