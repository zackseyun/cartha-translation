  text: בְּ/יַ֣ד עֲבָדֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר בְּ/רֹ֥ב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְחַ֣ר בְּרֹשָׁ֔י/ו וְ/אָבוֹא֙ מְר֣וֹם קִצּ֔/וֹ יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/024.yaml
  text: By your servants you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest height[c][b], its fruitful forest.’
translation:
  language: ru
  text: 'Через своих слуг ты насмехался над Господом[a] и говорил: «Со множеством моих колесниц я поднялся на горные вершины, в самые дальние пределы Ливана. Я срублю его высокие кедры и лучшие его кипарисы[b], проникну в самую дальнюю высь Ливана, в его плодородный лес[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поносил», «глумился над»; еврейский глагол выражает презрительное оскорбление и вызов.'
    reason: lexical_alternative
  - marker: b
    text: Точная порода дерева, названного еврейским словом берош, неизвестна; возможно, это кипарис, пихта или другое хвойное дерево.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в его роскошный лес», «в лес его плодородной земли»; еврейское выражение соединяет образы леса и плодородной садовой местности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד עֲבָדֶיךָ
  choice: Через своих слуг
  rationale: Инструментальная идиома בְּיַד естественно передаётся по-русски предлогом «через»; «слуги» соответствует контексту царских посланников.
- source_word: חֵרַפְתָּ
  choice: насмехался
  rationale: Передаёт презрительное оскорбление и вызывающую насмешку; возможны также «поносил» и «глумился».
- source_word: אֲדֹנָי
  choice: Владыкой
  rationale: Здесь стоит божественный титул אֲדֹנָי, а не имя יהוה; «Владыка» сохраняет титульное значение и отличается от передачи Божьего имени.
- source_word: בְּרֹב רִכְבִּי
  choice: Со множеством моих колесниц
  rationale: Сохраняет значение многочисленной колесничной силы и хвастливый тон речи.
- source_word: אֲנִי עָלִיתִי
  choice: я поднялся
  rationale: Отдельное местоимение אֲנִי уже естественно выражается русским «я»; дополнительное «сам» звучало бы избыточно, хотя хвастливое ударение допускается контекстом.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: в самые дальние пределы Ливана
  rationale: יַרְכְּתֵי обозначает отдалённые части, глубины или крайние пределы.
- source_word: קוֹמַת אֲרָזָיו
  choice: его высокие кедры
  rationale: Передаёт буквально выраженную высоту или статность кедров естественным русским сочетанием.
- source_word: מִבְחַר בְּרֹשָׁיו
  choice: лучшие его кипарисы
  rationale: מִבְחַר означает отборное, лучшее; точная ботаническая идентификация בְּרוֹשׁ не установлена.
- source_word: מְרוֹם קִצּוֹ
  choice: на самую дальнюю его высоту
  rationale: Сохраняет сочетание представлений о возвышенности и крайнем, дальнем пределе, не сглаживая необычный образ.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: его плодородный лес
  rationale: כַּרְמֶל может обозначать плодородную, садовую землю; сочетание с «лесом» намеренно сохраняет напряжение двух образов.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Владыка
  alternative: Господь
  rationale: «Владыка» ясно передаёт титул верховного господства и не подменяет его заветным именем יהוה. «Господь» также традиционно и лексически допустимо.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис прямой и понятный; необычные топографические и растительные образы сохранены без конфессионального истолкования.
