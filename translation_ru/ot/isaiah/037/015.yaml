  text: וַ/יִּתְפַּלֵּל֙ חִזְקִיָּ֔הוּ אֶל יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/015.yaml
  text: 'And Hezekiah prayed to Yahweh[a], saying:'
translation:
  language: ru
  text: 'И помолился Езекия Яхве[a], говоря:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «YHWH»; традиционно переводится «Господь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: помолился
  rationale: Форма хитпаэль от פלל здесь обозначает молитву. «Помолился» естественно передаёт завершённое повествовательное действие.
- source_word: חִזְקִיָּהוּ
  choice: Езекия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: אֶל
  choice: Яхве (дательный объект при глаголе «помолился»)
  rationale: Предлог указывает адресата молитвы; в естественном русском это выражается конструкцией «помолился кому» без отдельного предлога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Инфинитив вводит содержание следующей далее молитвы; «говоря» сохраняет формальную связь с прямой речью.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя, а примечание сообщает традиционную замену титулом.
translation_notes:
  register: Современный литературный русский с сохранением краткой повествовательной структуры оригинала. Оборот «говоря» выбран ради связи со следующим стихом и умеренно возвышенного библейского регистра.
