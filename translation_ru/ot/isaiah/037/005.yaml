  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: И пришли
  rationale: Форма wayyiqtol от בוא продолжает повествовательную последовательность; русское «И пришли» точно и естественно передаёт простое наступившее действие и связь с предыдущим контекстом.
- source_word: עַבְדֵי
  choice: слуги
  rationale: Форма сопряжённого состояния множественного числа от עבד. В контексте царского двора слово может обозначать слуг, приближённых или должностных лиц; «слуги» сохраняет лексическую широту и не приписывает им конкретного чина.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: царя Езекии
  rationale: Определённое существительное с последующим личным именем естественно передаётся по-русски сочетанием «царь Езекия» в родительном падеже после слова «слуги».
- source_word: אֶל
  choice: к
  rationale: Направительный предлог естественно передаётся русским «к» при обозначении прихода к человеку.
- source_word: יְשַׁעְיָהוּ
  choice: Исаии
  rationale: Использована устоявшаяся русская форма имени пророка Исаия, поставленная в дательном падеже после предлога «к».
