  text: וַ/יִּשְׁלַח֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֶל חִזְקִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ הִתְפַּלַּ֣לְתָּ אֵלַ֔/י אֶל סַנְחֵרִ֖יב מֶ֥לֶךְ אַשּֽׁוּר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/021.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah[a], saying, “Thus says Yahweh[b], the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria,”'
translation:
  language: ru
  text: 'Исаия, сын Амоса, послал сказать Езекии: «Так говорит Яхве[a], Бог Израиля: то, о чём ты молился Мне — о Сеннахириме, царе Ассирии…»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское имя יהוה (YHWH), традиционно передаваемое как «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Еврейская фраза синтаксически не завершена и продолжается в следующем стихе. В параллельном повествовании, 4 Царств 19:20, эта мысль сформулирована как основание последующего ответа: «Поскольку ты молился Мне о Сеннахириме, царе Ассирии, Я услышал».'
    reason: textual_clarification
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל חִזְקִיָּהוּ לֵאמֹר
  choice: послал сказать Езекии
  rationale: В еврейском тексте буквально сказано, что Исаия «послал к Езекии, говоря», причём посланник или весть подразумеваются. Русская формула «послал сказать» естественно передаёт эту эллиптическую конструкцию, не уточняя без основания, кого именно он послал.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: Исаия, сын Амоса
  rationale: Использованы устоявшиеся русские формы библейских имён; патроним передан прямо и естественно.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Традиционная и понятная современному читателю формула пророческой речи. Настоящее время по-русски естественно вводит действующее Божье изречение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача еврейской сопряжённой конструкции.
- source_word: אֲשֶׁר הִתְפַּלַּלְתָּ אֵלַי
  choice: О том, о чём ты молился Мне
  rationale: Сохраняет относительный характер אֲשֶׁר и незавершённость еврейской фразы, которая получает продолжение в следующем стихе, не вставляя отсутствующее здесь «Я услышал».
- source_word: אֶל סַנְחֵרִיב
  choice: в связи с Сеннахиримом
  rationale: Предлог указывает на предмет молитвы. «В связи с» передаёт это без более сильного и спорного толкования «против».
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царём Ассирии
  rationale: Сопряжённая конструкция передана обычным русским титулом при имени собственном.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя YHWH. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Эллиптическая фраза אֲשֶׁר הִתְפַּלַּלְתָּ אֵלַי
  choice: 'Сохранить незавершённость: «О том, о чём ты молился Мне…»'
  alternative: «Поскольку ты молился Мне…»; «Я услышал твою молитву…»
  rationale: Масоретский текст не содержит глагола «услышал», имеющегося в параллельном месте 4 Царств 19:20. Выбранный вариант сохраняет синтаксическую напряжённость и связь со следующим стихом, не дополняя текст из параллели и не превращая относительную конструкцию в однозначно причинную.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Формула «Так говорит» оставлена узнаваемой; эллипсис оригинала обозначен многоточием и пояснён в сноске.
