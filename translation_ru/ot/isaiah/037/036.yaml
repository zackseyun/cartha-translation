source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּכֶּה֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה וּ/שְׁמֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/036.yaml
  text: Then the angel of Yahweh went out and struck down 185,000 in the camp of Assyria. When they arose early in the morning[a], behold, all of them were dead bodies.
translation:
  language: ru
  text: И вышел ангел Яхве[a] и поразил в ассирийском стане сто восемьдесят пять тысяч человек. Рано утром, когда люди встали, — вот, все они были трупами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестник Яхве». Еврейское слово מַלְאָךְ может означать и «вестник», и «ангел»; здесь контекст указывает на небесного исполнителя Божьего суда.'
    reason: Лексическая неоднозначность исходного слова.
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאָךְ может обозначать как человеческого вестника, так и небесного ангела; в рассказе о непосредственном Божьем суде естественнее значение «ангел». Личное имя יְהוָה передано как «Яхве».
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Прямо передаёт повествовательную форму глагола יצא и звучит естественно в современном русском языке.
- source_word: וַיַּכֶּה
  choice: поразил
  rationale: Глагол נכה означает нанесение удара или поражение; контекст ясно показывает смертельный исход, но перевод сохраняет образ действия без пояснительной вставки «убил».
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: в ассирийском стане
  rationale: Идиоматично передаёт конструкцию «в стане Ассирии», сохраняя возвышенный, но понятный повествовательный регистр.
- source_word: מֵאָה וּשְׁמֹנִים וַחֲמִשָּׁה אָלֶף
  choice: сто восемьдесят пять тысяч человек
  rationale: Точно передаёт число; слово «человек» восполняет подразумеваемое в еврейском объектное существительное, необходимое для естественного русского синтаксиса.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: когда же рано утром поднялись
  rationale: Форма третьего лица множественного числа не называет действующих лиц. Безлично-неопределённая русская конструкция сохраняет эту неопределённость и значение раннего подъёма.
- source_word: וְהִנֵּה
  choice: оказалось
  rationale: В данном контексте естественно передаёт внезапное обнаружение, выраженное указательной частицей הִנֵּה, без архаического «вот» или «се».
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: все они — мёртвые тела
  rationale: Сохраняет явное «все они» и образ тел погибших; сочетание не сглаживается до одного слова «мертвы».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное заветное имя Бога, а не титул. Форма «Яхве» передаёт его как личное имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Значение מַלְאַךְ в выражении מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: вестник Яхве
  rationale: Само слово допускает оба значения, поэтому альтернатива отмечена в сноске. Контекст сверхъестественного суда над огромным войском делает значение «ангел» наиболее вероятным, не уточняя природу этого ангела сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены последовательность действий, точное число, неопределённость субъекта утреннего подъёма и резкий образ «мёртвых тел»; избегаются архаизмы вроде «се» и конфессиональная замена личного имени титулом.
