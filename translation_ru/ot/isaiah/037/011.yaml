id: ISA.37.11
reference: Isaiah 37:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands[b], destroying them utterly—and will you be delivered?
translation:
  language: ru
  text: Вот, ты слышал, что сделали цари Ассирии со всеми странами, предав их полному уничтожению[a]. А ты разве спасёшься?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полностью уничтожив их»; буквальный смысл еврейского глагола — обречь на полное уничтожение, предать заклятию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «А ты уцелеешь?» В контексте это насмешливый риторический вопрос.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет функцию emphатического привлечения внимания и естественно звучит в современном русском.
- source_word: שָׁמַעְתָּ
  choice: ты слышал
  rationale: Передаёт перфект второго лица единственного числа и отсылает к уже известным адресату событиям.
- source_word: אֲשֶׁר עָשׂוּ
  choice: что сделали
  rationale: Естественно передаёт относительную конструкцию, вводящую содержание услышанного.
- source_word: מַלְכֵי אַשּׁוּר
  choice: цари Ассирии
  rationale: Точно и ясно передаёт еврейскую сопряжённую конструкцию.
- source_word: לְכָל הָאֲרָצוֹת
  choice: со всеми странами
  rationale: В данном контексте אֲרָצוֹת обозначает покорённые страны и земли; русский оборот «что сделали со всеми странами» естественно передаёт управление глагола.
- source_word: לְהַחֲרִימָם
  choice: предав их полному уничтожению
  rationale: Передаёт каузативную форму חרם и идею обречения на окончательное уничтожение, не сводя её к нейтральному «разрушив».
- source_word: וְאַתָּה תִּנָּצֵל
  choice: А ты разве спасёшься?
  rationale: Самостоятельное местоимение подчёркивает контраст «а ты», а частица «разве» естественно выражает насмешливый риторический вопрос; форма «спасёшься» передаёт значение нифаля נצל.
theological_decisions:
- issue: Передача חרם в контексте военного уничтожения
  choice: предав их полному уничтожению
  alternative: полностью уничтожив их; обрёкши их на заклятие
  rationale: Выбранная формулировка сохраняет смысл окончательного обречения на уничтожение, но не вводит в основной текст малопонятный технический термин «заклятие».
- issue: Понимание заключительного תִּנָּצֵל
  choice: А ты разве спасёшься?
  alternative: А ты уцелеешь?; и ты спасёшься
  rationale: Контекст речи царя Ассирии указывает на издевательский риторический вопрос. При этом перевод не уточняет, кем именно могло бы быть совершено спасение.
translation_notes:
  register: Современный литературный русский язык с краткой, грозной интонацией ассирийской насмешки. «Вот» сохраняет библейскую торжественность без архаизма; «разве» ясно передаёт риторический характер финала.
