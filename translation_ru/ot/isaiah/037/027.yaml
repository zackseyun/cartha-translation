  terminology: «Бессильны» удачно передаёт идиому «коротки рукой». «Сокрушены» лучше соответствует образной силе חַתּוּ, не навязывая только психологическое значение «смущены». «Посрамлены», «полевая трава», «молодая зелень» и «трава на крышах» уместны. Для спорной заключительной конструкции выбрано нейтральное «нива до того, как поднимется хлеб» с пояснительной сноской.
