  text: And their inhabitants were powerless[a]; they were shattered and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and like a field before the standing grain.
translation:
  language: ru
  text: Их жители были бессильны[a], сокрушены и посрамлены. Они были как полевая трава и молодая зелень, как трава на крышах и как нива до того, как поднимется хлеб[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «коротки рукой» — то есть лишены силы или возможности действовать.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза в еврейском тексте трудна. Буквально: «и как поле (нива) перед стоящим хлебом». Вероятно, речь идёт о растительности или поле, погибшем до того, как хлеб поднимется; ср. параллельное место в 4 Царств 19:26.'
    reason: textual_and_lexical_difficulty
lexical_decisions:
- source_word: יֹשְׁבֵיהֶן
  choice: жители их
  rationale: Причастная форма от ישׁב с суффиксом 3-го лица множественного числа женского рода указывает на жителей упомянутых ранее городов; формулировка сохраняет связь с предшествующим контекстом.
- source_word: קִצְרֵי יָד
  choice: были бессильны
  rationale: Буквально «коротки рукой»; это устойчивый образ недостатка силы или способности действовать. Русское «были бессильны» ясно передаёт смысл идиомы.
- source_word: חַתּוּ
  choice: сломлены
  rationale: Глагол חתת может обозначать сокрушённость, смятение или ужас. «Сломлены» сохраняет образную силу слова и подходит к контексту разгрома, не исключая внутреннего смятения.
- source_word: וָבֹשׁוּ
  choice: и посрамлены
  rationale: בוש выражает стыд и позор; «посрамлены» передаёт здесь позор как следствие поражения.
- source_word: עֵשֶׂב שָׂדֶה
  choice: полевая трава
  rationale: Естественно передаёт сочетание «трава поля» и образ непрочной, быстро исчезающей растительности.
- source_word: וִירַק דֶּשֶׁא
  choice: и молодая зелень
  rationale: Сочетание обозначает свежую зелёную поросль. «Молодая зелень» понятно современному читателю и не дублирует слово «трава».
- source_word: חֲצִיר גַּגּוֹת
  choice: как трава на крышах
  rationale: Сохраняет библейский образ растительности на плоских крышах, которая имеет неглубокие корни и быстро засыхает.
- source_word: וּשְׁדֵמָה לִפְנֵי קָמָה
  choice: и как поле, иссохшее прежде, чем поднялись колосья
  rationale: Фраза в масоретском тексте трудна. Перевод передаёт вероятный сельскохозяйственный образ растительности, погибшей до созревания хлеба, но отмечает неуверенность в сноске.
