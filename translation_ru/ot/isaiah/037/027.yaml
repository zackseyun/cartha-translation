review_pass:
  verdict: revise
  source_fidelity: 'Начальная часть передана точно: «их жители», «бессильны», «сокрушены и посрамлены» адекватно передают יֹשְׁבֵיהֶן, קִצְרֵי יָד, חַתּוּ וָבֹשׁוּ. Ряд растительных образов также сохранён. Однако «иссохшее» не выражено прямо в масоретском тексте и преждевременно разрешает трудность שְׂדֵמָה לִפְנֵי קָמָה; «прежде, чем поднялись колосья» несколько сужает קָמָה до колосьев. Основной текст должен сохранить трудность без добавления причины увядания.'
