revisions:
- from: И жители их были бессильны[a], сломлены и посрамлены. Они стали как полевая трава и молодая зелень, как трава на крышах и как поле, иссохшее прежде, чем поднялись колосья[b].
  to: Их жители были бессильны[a], сокрушены и посрамлены. Они были как полевая трава и молодая зелень, как трава на крышах и как нива до того, как поднимется хлеб[b].
  rationale: 'Убрано невыраженное в оригинале «иссохшее» и смягчена чрезмерная конкретизация «колосья». Сноска теперь ясно отличает буквальную форму трудного еврейского выражения от вероятного истолкования, сохраняя текстовую неоднозначность. Остальная лексика слегка выровнена: «сокрушены» точнее и естественнее передаёт силу חַתּוּ, а «были как» воспроизводит прямое сравнение без оттенка превращения.'
