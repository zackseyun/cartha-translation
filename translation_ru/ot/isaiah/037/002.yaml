  text: Then he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah son of Amoz[b], the prophet.
translation:
  language: ru
  text: И послал он к пророку Исаии, сыну Амоца, Эльякима, управляющего царским домом[a], Шевну, писца, и старейшин священников — всех, одетых во вретище[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Управляющий царским домом» — официальный титул высокопоставленного придворного, ведавшего царским хозяйством.
    reason: cultural_note
  - marker: b
    text: 'Вретище — грубая одежда или ткань, которую надевали в знак скорби, бедствия или смирения; возможный перевод: «одетых в грубую траурную одежду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал он
  rationale: Форма wayyiqtol продолжает повествование; союз «и» сохраняет простую последовательность действий, а порядок слов естественно связывает стих с предыдущим контекстом.
- source_word: אֶלְיָקִים
  choice: Эльяким
  rationale: Имя передано транслитерацией, близкой к еврейскому произношению.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: управляющего царским домом
  rationale: Оборот обозначает придворную должность человека, ведавшего царским домом. Добавление «царским» проясняет подразумеваемый контекст, не сужая значение до одного здания.
- source_word: שֶׁבְנָא הַסּוֹפֵר
  choice: писца Шевну
  rationale: סֹפֵר может означать писца или царского секретаря; «писец» прямо передаёт слово и не уточняет спорный объём должностных обязанностей.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: старейшин священников
  rationale: Сохранена конструкция исходного текста; она допускает понимание как старших или руководящих представителей священства без излишнего институционального уточнения.
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: одетых во вретище
  rationale: Причастный оборот описывает их состояние и одежду как знак скорби или унижения. «Вретище» точно обозначает грубую одежду такого назначения; сноска поясняет редкое современному читателю слово.
- source_word: יְשַׁעְיָהוּ בֶן־אָמוֹץ הַנָּבִיא
  choice: к пророку Исаии, сыну Амоца
  rationale: Сохранены имя, отчество по отцу и определённый пророческий титул; перестановка титула делает фразу естественной по-русски.
