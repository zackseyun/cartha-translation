  yaml_path: translation/ot/isaiah/037/035.yaml
  text: For I will defend this city to save it[b][a], for my own sake and for the sake of David my servant.
translation:
  language: ru
  text: И Я буду защищать этот город, чтобы спасти его[a], ради Себя и ради Давида, Моего слуги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы избавить его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי עַל־הָעִיר הַזֹּאת
  choice: И Я буду защищать этот город
  rationale: Глагол גנן означает прикрывать, защищать; в военном контексте осады естественно звучит «защищать». Союз וְ передан как «И», поскольку стих продолжает прямую речь и связь с предыдущим высказыванием.
- source_word: לְהוֹשִׁיעָהּ
  choice: чтобы спасти его
  rationale: 'Инфинитив от ישׁע выражает цель: спасти, избавить. Местоимение относится к слову «город», которое в русском языке мужского рода.'
- source_word: לְמַעֲנִי
  choice: ради Себя
  rationale: Оборот указывает на основание Божьего действия в Нём Самом; возвратное «Себя» естественно и точно передаёт соотнесённость с говорящим Богом.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: и ради Давида, Моего слуги
  rationale: Сохранён параллелизм двух оборотов לְמַעַן. В данном царско-заветном контексте עבד уместно передать как «слуга», а не «раб».
theological_decisions:
- issue: Основания избавления Иерусалима
  choice: ради Себя и ради Давида, Моего слуги
  alternative: ради Моего имени и ради завета с Давидом
  rationale: Текст прямо называет Бога и Давида, но не упоминает ни «имя», ни «завет». Перевод сохраняет оба основания и не подменяет их богословским пояснением.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным звучанием. Заглавные местоимения в речи Бога использованы в соответствии с принятой русской библейской традицией. «Защищать» передаёт военный контекст без архаизации; возможный оттенок «прикрывать, ограждать» остаётся в пределах значения выбранного слова.
