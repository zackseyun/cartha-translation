base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/018.yaml
  text: Truly[a], O Yahweh, the kings of Assyria have laid waste all the lands and their own land[b],
translation:
  language: ru
  text: Воистину, Яхве, цари Ассирии разорили все страны[a] и их землю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все земли». Еврейское слово может обозначать земли, территории или страны.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их землю». В еврейском тексте стоит единственное число; эту форму иногда передают по смыслу как «их земли».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְנָם
  choice: Правда
  rationale: В молитвенном контексте слово вводит признание истинности сказанного далее. «Правда» естественно передаёт утвердительный, отчасти уступительный оттенок без архаизации.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הֶחֱרִיבוּ
  choice: разорили
  rationale: Порода хифиль глагола חרב означает привести в запустение, опустошить; «разорили» естественно описывает последствия военного нашествия.
- source_word: מַלְכֵי אַשּׁוּר
  choice: цари Ассирии
  rationale: Прямо и естественно передаёт еврейскую сопряжённую конструкцию.
- source_word: אֶת כָּל הָאֲרָצוֹת
  choice: все страны
  rationale: Военно-политический контекст поддерживает значение территориальных стран; более буквальное «все земли» также возможно.
- source_word: וְאֶת אַרְצָם
  choice: и их землю
  rationale: Сохранены единственное число существительного и суффикс 3-го лица мужского рода множественного числа в масоретском тексте. Перевод намеренно не добавляет отсутствующее в еврейском тексте усиление «собственную».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Необычное сочетание «все страны и их землю»
  choice: 'сохранить чтение масоретского текста: «все страны и их землю»'
  alternative: «все народы и их земли» по смыслу параллельного места; «все страны и свои земли»
  rationale: Предоставленный текст WLC имеет הָאֲרָצוֹת и единственное אַרְצָם. Необычность чтения не следует молча устранять по параллельному месту или посредством смыслового сглаживания.
translation_notes:
  register: Современный литературный русский язык с молитвенно-торжественным, но не архаическим звучанием. Двоеточие естественно отделяет обращение и вводное признание от содержания утверждения; необычная формулировка масоретского текста сохранена и пояснена в сноске.
