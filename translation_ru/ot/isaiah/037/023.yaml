  source_fidelity: 'В целом смысл передан верно: два риторических вопроса завершаются ответом «против Святого Израилева». Однако «высокомерно» эксплицирует оценку, которая в форме «поднял глаза свои ввысь» остаётся образно выраженной в еврейском тексте; формы «повышал/поднимал» также ослабляют завершённые глагольные формы оригинала.'
  naturalness: «На кого ты возвысил голос и поднял глаза свои ввысь?» — естественная современная литературная фраза с пророчески торжественным регистром. Титул «Святой Израилев» уместен как традиционная форма в современном переводе.
