  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָה קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/023.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel.
translation:
  language: ru
  text: Кого ты поносил и хулил? На кого ты возвысил голос и поднял глаза свои ввысь? На Святого Израилева!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: поносил
  rationale: Передаёт оскорбительное, уничижительное злословие; точнее исходного значения и естественнее в данном торжественном контексте, чем узкое «насмехался».
- source_word: גִדַּפְתָּ
  choice: хулил
  rationale: Сохраняет усиление после «поносил» и выражает дерзкую брань, направленную против Бога.
- source_word: הֲרִימוֹתָה קּוֹל
  choice: повышал голос
  rationale: Естественная русская передача идиомы «поднял голос» с оттенком дерзкого выступления против кого-либо.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: высокомерно поднимал глаза
  rationale: Мָרוֹם буквально связано с высотой; в контексте жест выражает надменность. Наречие делает подразумеваемый смысл ясным, не меняя образ глаз, поднятых вверх.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израилев
  rationale: Устоявшийся и торжественный русский эквивалент характерного для Исаии божественного титула.
theological_decisions:
- issue: Адресат поношения и хулы
  choice: 'Риторическая последовательность завершается отдельным ответом: «На Святого Израилева!»'
  alternative: Включить ответ в предыдущий вопрос без выразительного обособления
  rationale: Еврейский текст сначала дважды спрашивает «кого/на кого», а затем emphatically называет Бога; отдельная завершающая фраза сохраняет обвинительную силу и не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксический параллелизм и нарастающее риторическое обвинение сохранены; архаизмы сведены к традиционному титулу «Святой Израилев».
