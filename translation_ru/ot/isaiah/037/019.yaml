lexical_decisions:
- source_word: וְנָתֹן
  choice: и бросили
  rationale: Инфинитив абсолютный в последовательности описывает совершённое действие; נתן буквально значит «дать, поместить», но в сочетании с огнём естественно передаётся как «бросить в огонь».
- source_word: אֱלֹהֵיהֶם
  choice: их богов
  rationale: Прямо сохраняет обозначение почитаемых народами божеств; следующий оборот сразу отрицает, что они действительно боги.
- source_word: בָּאֵשׁ
  choice: в огонь
  rationale: При глаголе направленного помещения русское «в огонь» естественно выражает движение внутрь огня.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: потому что те были не богами
  rationale: Передаёт причинную связь и сохраняет прямое отрицание божественного статуса; «те» устраняет возможную двусмысленность местоимения.
- source_word: כִּי אִם מַעֲשֵׂה יְדֵי אָדָם
  choice: а изделием человеческих рук
  rationale: כִּי אִם выражает противопоставление «а, но лишь»; единственное число соответствует собирательному מַעֲשֵׂה, а אָדָם здесь имеет обобщённое значение.
- source_word: עֵץ וָאֶבֶן
  choice: деревом и камнем
  rationale: Сохраняет краткое приложенное пояснение о материале, из которого были сделаны эти изображения.
- source_word: וַיְאַבְּדוּם
  choice: потому их и уничтожили
  rationale: 'Каузативная форма אבד означает «уничтожить»; русская конструкция передаёт вывод: их смогли уничтожить именно потому, что они были рукотворными предметами.'
theological_decisions:
- issue: Статус божеств народов
  choice: «их богов», затем «были не богами»
  alternative: «их идолов», затем «были не богами»
  rationale: Еврейский текст сначала употребляет название «боги», а затем полемически отрицает их подлинную божественность. Такое построение сохраняет напряжение и логику оригинала.
translation_notes:
