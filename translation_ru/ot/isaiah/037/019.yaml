  verdict: revise
  source_fidelity: 'Основной смысл передан верно: народы предали своих богов огню, поскольку те не были богами, а были человеческим изделием из дерева и камня, и потому были уничтожены. Однако «изделием ... — деревом и камнем» неестественно согласуется с множественным «богов» и создаёт впечатление отождествления изделия с материалами, а не указания на состав. Более ясное «изделиями, сделанными ... из дерева и камня» сохраняет смысл без этой шероховатости.'
  naturalness: «И бросили их богов в огонь» и «ибо они не боги» звучат естественно в современном литературном русском при сохранении возвышенного регистра. «И потому уничтожили их» ясно сохраняет активного, контекстуально подразумеваемого субъекта, в отличие от несколько неопределённого «их и уничтожили».
  terminology: «Их богов» точно воспроизводит אֱלֹהֵיהֶם; примечание уместно фиксирует возможный перевод «идолов». Формулировка «не боги» сохраняет полемическое отрицание текста, не добавляя конфессиональных толкований. «Изделия, сделанные человеческими руками» адекватно передаёт מַעֲשֵׂה יְדֵי אָדָם.
