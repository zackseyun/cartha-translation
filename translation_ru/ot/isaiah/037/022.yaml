  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/022.yaml
  text: 'This is the word that the LORD has spoken concerning him: ‘Virgin Daughter Zion despises you and mocks you; Daughter Jerusalem shakes her head behind you.’'
translation:
  language: ru
  text: 'Вот слово, которое Господь сказал о нём: «Дева, дочь Сиона, презирает тебя и насмехается над тобой; дочь Иерусалима качает головой тебе вслед».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона; соответствует консультационному английскому слою и сохраняет достоинство библейского стиля.
- source_word: בְּתוּלַת בַּת־צִיּוֹן
  choice: Дева, дочь Сиона
  rationale: Сохраняет оба элемента еврейского поэтического обозначения и олицетворение Сиона, не превращая выражение в неестественное русское сложное имя.
- source_word: לָעֲגָה לְךָ
  choice: насмехается над тобой
  rationale: Естественно передаёт значение глагола לעג и параллелизм с «презирает тебя».
- source_word: אַחֲרֶיךָ רֹאשׁ הֵנִיעָה
  choice: качает головой тебе вслед
  rationale: 'Передаёт и жест насмешки, и пространственно-временной оттенок אַחֲרֶיךָ: адресат уходит, а Иерусалим насмешливо качает головой вслед ему.'
theological_decisions:
- issue: Форма передачи Божьего имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: В данном издании выбран общепринятый русский эквивалент без конфессионально заострённой транслитерации; референт остаётся однозначным.
- issue: Олицетворение Сиона и Иерусалима
  choice: Сохранены женские образы «дева, дочь Сиона» и «дочь Иерусалима»
  alternative: Перефразировать как «жители Сиона/Иерусалима»
  rationale: Еврейский текст поэтически представляет город как женщину; конкретизация через жителей устранила бы образность и внесла бы отсутствующее в тексте толкование.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой речи и еврейского поэтического параллелизма. Местоимения оставлены со строчной буквы по нормам современного русского текста; адресат в цитате — мужского рода, что отражает формы לְךָ и אַחֲרֶיךָ.
