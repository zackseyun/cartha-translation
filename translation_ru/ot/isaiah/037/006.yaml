base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/006.yaml
  text: 'And Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: ru
  text: 'И сказал им Исаия: «Так скажите вашему господину: „Так говорит Яхве: не бойся слов, которые ты услышал и которыми слуги ассирийского царя хулили[a] Меня“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поносили Меня», «бросали Мне вызов» или «богохульствовали против Меня». Еврейский глагол обозначает оскорбительную или презрительную речь, направленную против Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְשַׁעְיָהוּ
  choice: И сказал им Исаия
  rationale: Сохраняет последовательное повествовательное движение wayyiqtol и прямо обозначает адресатов речи.
- source_word: כֹּה תֹאמְרוּן אֶל אֲדֹנֵיכֶם
  choice: Так скажите вашему господину
  rationale: Передаёт формулу поручения; «господину» обозначает земного повелителя посланников — Езекию.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет традиционную пророческую формулу и передаёт тетраграмматон как личное имя.
- source_word: אַל תִּירָא מִפְּנֵי הַדְּבָרִים
  choice: не бойся слов
  rationale: Естественно по-русски передаёт запрет бояться из-за услышанных речей.
- source_word: אֲשֶׁר שָׁמַעְתָּ
  choice: которые ты услышал
  rationale: Точно передаёт завершённое восприятие уже произнесённых слов без ненужного добавления временного оттенка.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: слуги ассирийского царя
  rationale: В данном придворно-политическом контексте נַעֲרִים обозначает служителей или подчинённых царя, а не обязательно молодых людей.
- source_word: אֲשֶׁר גִּדְּפוּ ... אוֹתִי
  choice: которыми ... хулили Меня
  rationale: «Хулили» передаёт оскорбительную, презрительную речь против Бога и сохраняет более широкий смысл еврейского глагола, чем термин «богохульствовали».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; «Яхве» сохраняет его как имя и не смешивает с אֲדֹנֵיכֶם, относящимся к человеческому господину.
- issue: Смысл גִּדְּפוּ, когда объектом является Бог
  choice: хулили Меня
  alternative: поносили Меня; бросали Мне вызов; богохульствовали против Меня
  rationale: «Хулили» естественно сочетает оскорбительную речь и её религиозную тяжесть, не сужая многозначный глагол до одного только технического понятия богохульства; альтернативы отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «Так скажите... Так говорит...» сохранён как значимая вестническая формула. Прописное «Меня» употреблено как уважительное оформление речи Бога.
