base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/030.yaml
  text: 'And this will be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; but in the third year sow and reap, and plant vineyards and eat their fruit.'
translation:
  language: ru
  text: 'И вот тебе знамение: в этом году ешьте то, что выросло само[a], на второй год — то, что взойдёт вновь; а в третий год сейте и жните, сажайте виноградники и ешьте их плоды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самосев». Редкое еврейское слово обозначает урожай, выросший без обычного посева. Редкое слово, относящееся ко второму году и переданное как «то, что взойдёт вновь», может означать «вторичный самосев» или «позднюю поросль».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה לְּךָ הָאוֹת
  choice: И вот тебе знамение
  rationale: Безглагольная конструкция естественно передаётся формулой предъявления «вот тебе»; определённый артикль при הָאוֹת указывает на конкретное подтверждающее знамение.
- source_word: אָכוֹל
  choice: ешьте
  rationale: Инфинитив абсолютный имеет здесь повелительно-предсказательный оттенок. Множественное число по-русски согласуется с последующими формами, обращёнными к народу, тогда как единственное «тебе» относится к Езекии.
- source_word: סָפִיחַ
  choice: то, что выросло само
  rationale: Слово обозначает урожай, взошедший без обычного посева; описательная передача понятна современному читателю.
- source_word: שָׁחִיס
  choice: то, что вырастет из него
  rationale: Редкий земледельческий термин, вероятно обозначающий самосев или вторичную поросль следующего года. Формулировка передаёт вероятную связь с урожаем первого года, не вводя специального термина в основной текст.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: сейте и жните
  rationale: Сохраняется краткая параллельная последовательность повелительных форм и традиционная земледельческая пара «сеять — жать».
- source_word: וְנִטְעוּ כְרָמִים
  choice: сажайте виноградники
  rationale: Естественная русская передача выражения о насаждении виноградников.
- source_word: וְאִכְלוּ פִרְיָם
  choice: ешьте их плоды
  rationale: Местоимение «их» отсылает к виноградникам; множественное «плоды» естественно для русского употребления.
theological_decisions:
- issue: Адресат знамения и смена числа
  choice: Сохранить «тебе» в единственном числе, но передать земледельческие указания множественным числом
  alternative: Унифицировать обращение в единственном или множественном числе
  rationale: В еврейском тексте לְךָ обращено к Езекии в единственном числе, а זִרְעוּ, קִצְרוּ, נִטְעוּ, אִכְלוּ обращены к сообществу во множественном. Сохранение смены числа передаёт структуру источника и не сужает адресата практических указаний.
translation_notes:
  register: Современный литературный русский язык с библейски достойным, но понятным земледельческим словарём. Ритм перечисления сохранён; редкие термины переданы описательно, а их неопределённость отмечена в сноске.
