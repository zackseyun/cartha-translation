  yaml_path: translation/ot/isaiah/037/031.yaml
  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: ru
  text: И уцелевший остаток дома Иуды[a] снова пустит корни вниз и даст плод наверху.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остаток спасшихся из дома Иуды, оставшийся».'
    reason: 'Лексическая альтернатива: еврейский текст сочетает обозначение спасшихся с причастием «оставшаяся».'
lexical_decisions:
- source_word: וְיָסְפָה
  choice: снова
  rationale: Форма от יסף указывает на повторное или дальнейшее действие; «снова» естественно передаёт возобновление жизни остатка.
- source_word: פְּלֵיטַת … הַנִּשְׁאָרָה
  choice: уцелевший остаток
  rationale: פְּלֵיטָה обозначает спасшихся или уцелевших, а הַנִּשְׁאָרָה — то, что осталось. В основном тексте оба оттенка кратко объединены, а более буквальная структура отмечена в сноске.
- source_word: בֵּית יְהוּדָה
  choice: дома Иуды
  rationale: Сохраняет устойчивое библейское обозначение народа и царства Иуды.
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: пустит корни вниз
  rationale: Передаёт конкретный образ корней и направление, выраженное לְמָטָּה, естественным русским оборотом.
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: и принесёт плод наверху
  rationale: Сочетание עשה с פְרִי означает произведение плода; перевод сохраняет земледельческий образ и вертикальное противопоставление корням внизу.
theological_decisions:
- issue: Образ восстановления Иуды
  choice: Сохранить образ корней внизу и плода наверху как указание на восстановление, устойчивость и плодотворность уцелевшего народа.
  alternative: 'Передать смысл отвлечённо: «укрепится и будет процветать».'
  rationale: Еврейский текст выражает надежду через конкретную земледельческую метафору; её раскрытие в отвлечённых понятиях неоправданно устранило бы поэтический образ.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Коллективный образ передан существительным в единственном числе; параллелизм направлений сохранён без отвлечённого истолкования метафоры.
