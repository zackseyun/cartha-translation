source:
  edition: WLC
  text: וַ/יְהִי֩ ה֨וּא מִֽשְׁתַּחֲוֶ֜ה בֵּ֣ית נִסְרֹ֣ךְ אֱלֹהָ֗י/ו וְֽ/אַדְרַמֶּ֨לֶךְ וְ/שַׂרְאֶ֤צֶר בָּנָי/ו֙ הִכֻּ֣/הוּ בַ/חֶ֔רֶב וְ/הֵ֥מָּה נִמְלְט֖וּ אֶ֣רֶץ אֲרָרָ֑ט וַ/יִּמְלֹ֛ךְ אֵֽסַר חַדֹּ֥ן בְּנ֖/וֹ תַּחְתָּֽי/ו׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/038.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisroch his god, Adrammelech and Sharezer his sons struck him down with the sword, and they escaped to the land of Ararat[c][b]. And Esar-haddon his son reigned in his place.
translation:
  language: ru
  text: И вот, когда он поклонялся[a] в доме Нисроха, своего бога[b], его сыновья Адраммелех и Шарецер поразили его мечом и бежали в землю Арарат. А вместо него воцарился его сын Асархаддон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «склонялся»; еврейский глагол может подчёркивать телесное действие — поклон или простирание ниц — как выражение поклонения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в храме Нисроха, своего бога»; буквально по-еврейски: «в доме Нисроха, своего бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И вот
  rationale: Естественно передаёт переход к следующему событию в еврейском повествовании, не прибегая к архаическому обороту «и было».
- source_word: מִשְׁתַּחֲוֶה
  choice: поклонялся
  rationale: В культовом контексте глагол обозначает поклонение, совершаемое через преклонение или простирание; русский глагол сохраняет и религиозный смысл, и связь с телесным действием.
- source_word: בֵּית נִסְרֹךְ אֱלֹהָיו
  choice: в доме Нисроха, своего бога
  rationale: Сохраняет буквальный образ «дома» и ясно показывает, что Нисрох был богом Сеннахирима; запятая передаёт приложение.
- source_word: בָּנָיו
  choice: его сыновья
  rationale: Точно передаёт мужской род и множественное число исходного текста.
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: поразили его мечом
  rationale: Передаёт глагол נכה и инструментальное значение предлога; контекст однозначно указывает на смертельное нападение, не требуя замены глагола на «убили».
- source_word: נִמְלְטוּ אֶרֶץ אֲרָרָט
  choice: бежали в землю Арарат
  rationale: В данном контексте נמלׄט обозначает успешное бегство. Русское «бежали» естественно передаёт движение к названному месту; «земля Арарат» сохраняет обозначение области, а не горы.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: вместо него воцарился
  rationale: Естественно передаёт вступление преемника на престол и значение תַּחְתָּיו — «вместо него».
- source_word: אֵסַר חַדֹּן
  choice: Асархаддон
  rationale: Использована устоявшаяся в русской библейской и исторической традиции форма имени.
