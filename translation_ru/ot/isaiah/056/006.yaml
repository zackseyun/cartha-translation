    issue: Видовое значение «присоединившиеся»
    rationale: Еврейское הַנִּלְוִים — причастие, характеризующее тех, кто присоединяется/примыкает к Яхве; русское совершенное причастие может неоправданно представить это как исключительно предшествующее, завершённое действие.
  - severity: medium
    issue: Неясная синтаксическая связь «каждый, кто»
    rationale: В русском «каждый, кто» после ряда определений к «сыновья» выглядит как новый субъект, а не как уточнение условий, характеризующих сыновей чужеземцев. «Все те, кто» яснее связывает условия с исходной группой.
