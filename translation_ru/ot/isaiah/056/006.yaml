revisions:
- from: И сыновья чужеземцев, присоединившиеся к Яхве, чтобы служить Ему, любить имя Яхве и быть Его слугами, — каждый, кто хранит субботу, не оскверняя её, и крепко держится Моего завета, —
  to: И сыновья чужеземцев, присоединяющиеся к Яхве, чтобы служить Ему, любить имя Яхве и быть Его слугами, — все те, кто хранит субботу, не оскверняя её, и твёрдо держится Моего завета, —
  rationale: Исправлены только видовое значение первого причастия и русская синтаксическая связь заключительных условий с «сыновьями чужеземцев». Дистрибутивное единственное число в «кто ... держится» сохранено как естественный русский способ передать обобщающее «все те, кто», не приписывая смене числа в еврейском тексте самостоятельного смыслового значения. Финальное тире сохранено, поскольку стих продолжает фразу в следующем стихе.
