source:
  edition: WLC
  text: וּ/בְנֵ֣י הַ/נֵּכָ֗ר הַ/נִּלְוִ֤ים עַל יְהוָה֙ לְ/שָׁ֣רְת֔/וֹ וּֽ/לְ/אַהֲבָה֙ אֶת שֵׁ֣ם יְהוָ֔ה לִ/הְי֥וֹת ל֖/וֹ לַ/עֲבָדִ֑ים כָּל שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/006.yaml
  text: And the sons of the foreigner who join themselves to Yahweh[a], to minister to him, and to love the name of Yahweh[d][c][b], to be his servants—everyone who keeps the Sabbath from profaning it and holds fast my covenant—
translation:
  language: ru
  text: И сыновья чужеземцев, присоединяющиеся к Яхве, чтобы служить Ему, любить имя Яхве и быть Его слугами, — все те, кто хранит субботу, не оскверняя её, и твёрдо держится Моего завета, —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי הַנֵּכָר
  choice: сыновья чужеземцев
  rationale: Сохраняет конкретный еврейский оборот с בְּנֵי, при этом форма множественного числа естественна по-русски и обозначает людей чужеземного происхождения.
- source_word: הַנִּלְוִים עַל יְהוָה
  choice: присоединившиеся к Яхве
  rationale: Передаёт возвратно-медиальное значение нифаля לוה — добровольно примкнуть, связать себя с Яхве.
- source_word: לְשָׁרְתוֹ
  choice: чтобы служить Ему
  rationale: Русское «служить» естественно охватывает как служение Богу вообще, так и возможный культовый оттенок שרת, не сужая значение до священнического служения.
- source_word: וּלְאַהֲבָה אֶת שֵׁם יְהוָה
  choice: любить имя Яхве
  rationale: Сохраняет прямой объект «имя Яхве» и его заветно-религиозный смысл.
- source_word: לִהְיוֹת לוֹ לַעֲבָדִים
  choice: быть Его слугами
  rationale: עֲבָדִים допускает «рабы» и «слуги»; здесь контекст преданного служения Богу делает «слуги» естественным, не устраняя идею принадлежности.
- source_word: כָּל שֹׁמֵר שַׁבָּת מֵחַלְּלוֹ
  choice: каждый, кто хранит субботу, не оскверняя её
  rationale: «Каждый» отражает дистрибутивное כָּל при причастии единственного числа; «хранит субботу» передаёт שׁמר, а деепричастный оборот естественно выражает воздержание от её осквернения.
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  choice: и крепко держится Моего завета
  rationale: Передаёт интенсивное значение החזיק и сохраняет синтаксическое согласование с дистрибутивным «каждый», несмотря на формальный переход к множественному числу в еврейском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Включение чужеземцев в народ завета
  choice: Сохранить конкретное выражение «сыновья чужеземцев» и полный ряд действий их заветной верности.
  alternative: Обобщить до «чужеземцы».
  rationale: Так сохраняются и исходный образ, и ясное утверждение, что чужеземцы могут присоединиться к Яхве и держаться Его завета, без привнесения позднейших богословских схем.
- issue: Значение עֲבָדִים
  choice: слуги
  alternative: рабы
  rationale: В данном контексте на первом плане добровольное религиозное служение и принадлежность Яхве. «Слуги» передаёт это естественно, тогда как «рабы» может чрезмерно выдвинуть юридическую несвободу.
- issue: Смена числа в заключительной части стиха
  choice: 'Передать дистрибутивно: «каждый, кто… и… держится».'
  alternative: 'Передать формальное множественное число второго причастия: «все, кто… и держатся».'
  rationale: Еврейский текст начинает с כָּל и причастия единственного числа, затем переходит к причастию множественного числа. Русский вариант сохраняет дистрибутивный акцент и обеспечивает естественное согласование, не превращая смену числа в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. Структура сохранена как незавершённое продолжение мысли, переходящей в следующий стих; финальное тире отражает открытый синтаксис исходного контекста.
