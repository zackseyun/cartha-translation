  verdict: revise
  source_fidelity: 'В целом переданы все основные элементы еврейского текста: присоединение к Яхве, служение, любовь к имени Яхве, служение как слуг, соблюдение субботы и верность завету. Однако причастие הַנִּלְוִים имеет обобщённо-настоящее значение, а не значение уже совершившегося действия; «присоединяющиеся» точнее, чем «присоединившиеся».'
  naturalness: 'Исходный вариант в заключительной части синтаксически шероховат: после множественного «сыновья чужеземцев» следует самостоятельное «каждый, кто», хотя условия относятся к той же группе. Формулировка «все те, кто» делает связь ясной и сохраняет открытый, продолжающийся синтаксис стиха.'
  terminology: «Яхве», «имя Яхве», «суббота», «завет» и «слуги» уместны. «Сыновья чужеземцев» сохраняет конкретность еврейского идиоматического выражения и приемлемо в возвышенном современном регистре.
