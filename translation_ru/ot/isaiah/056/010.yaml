  text: צפו עִוְרִ֤ים כֻּלָּ/ם֙ לֹ֣א יָדָ֔עוּ כֻּלָּ/ם֙ כְּלָבִ֣ים אִלְּמִ֔ים לֹ֥א יוּכְל֖וּ לִ/נְבֹּ֑חַ הֹזִים֙ שֹֽׁכְבִ֔ים אֹהֲבֵ֖י לָ/נֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/010.yaml
  text: His watchmen are blind[a], all of them; they know nothing. All of them are mute dogs, unable to bark, dreamers, lying down, loving to slumber.
translation:
  language: ru
  text: Стражи его слепы — все до одного; ничего не понимают. Все они — немые псы, не способные лаять; грезят[a], лежат, любят дремать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бормочут». Древнееврейское слово הֹזִים встречается редко, и его значение здесь не вполне ясно; перевод «грезят» согласуется с последующими образами лежания и дремоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צפו
  choice: Стражи его
  rationale: Форма понимается в традиционном контекстуальном смысле как обозначение поставленных сторожей; притяжательное «его» относится к народу, о котором идёт речь. «Стражи» естественно передаёт образ ответственных за бдительность руководителей.
- source_word: עִוְרִים
  choice: слепы
  rationale: Сохранён конкретный образ слепоты, который в контексте метафорически указывает на отсутствие духовной и нравственной проницательности.
- source_word: לֹא יָדָעוּ
  choice: ничего не понимают
  rationale: Глагол ידע с отрицанием здесь выражает отсутствие понимания и распознавания; настоящее время по-русски естественно передаёт состояние, описанное древнееврейским перфектом в данном контексте.
- source_word: כְּלָבִים אִלְּמִים
  choice: немые псы
  rationale: Сохранены резкость пророческого обличения и метафора собак, которые не могут подать тревожный сигнал.
- source_word: לֹא יוּכְלוּ לִנְבֹּחַ
  choice: не способные лаять
  rationale: Причастная конструкция естественно передаёт неспособность стражей исполнить свою основную задачу в рамках образа.
- source_word: הֹזִים
  choice: грезят
  rationale: Редкое и трудное слово передано в соответствии с окружающей образностью лежания и дремоты. Глагольная форма сохраняет последовательность действий и не превращает выражение в отдельное наименование лиц.
- source_word: שֹׁכְבִים
  choice: лежат
  rationale: Прямо сохраняется физический образ без добавления разговорного оттенка праздности.
- source_word: אֹהֲבֵי לָנוּם
  choice: любят дремать
  rationale: «Дремать» точно и естественно передаёт נום и сохраняет повторяющуюся в строке образность сонливости.
theological_decisions: []
