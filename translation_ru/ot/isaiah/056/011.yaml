  text: וְ/הַ/כְּלָבִ֣ים עַזֵּי נֶ֗פֶשׁ לֹ֤א יָֽדְעוּ֙ שָׂבְעָ֔ה וְ/הֵ֣מָּה רֹעִ֔ים לֹ֥א יָדְע֖וּ הָבִ֑ין כֻּלָּ/ם֙ לְ/דַרְכָּ֣/ם פָּנ֔וּ אִ֥ישׁ לְ/בִצְע֖/וֹ מִ/קָּצֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/011.yaml
  text: And the dogs are greedy in appetite[a]; they do not know satisfaction. And they are shepherds who do not know understanding; all of them have turned to their own way, each one to his own gain[c][b], every one without exception.
translation:
  language: ru
  text: И псы ненасытны[a], они не знают сытости. И они — пастыри, не понимающие[b]. Все они пошли своим путём, каждый — к своей наживе, все до одного[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сильны (или неукротимы) аппетитом»; возможный перевод: «прожорливы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не знают разуметь»; также возможно: «не умеют понимать» или «не знают рассудительности».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское выражение не вполне ясно. Возможно также: «из каждого края» или «со всех сторон»; вероятно, оно подчёркивает, что обличение относится ко всем без исключения.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּלָבִים
  choice: псы
  rationale: Сохранён конкретный и резкий образ исходного текста; он не заменён пояснительным словом «вожди».
- source_word: עַזֵּי נֶפֶשׁ
  choice: прожорливы
  rationale: В данном контексте сочетание со значением «сильные/неудержимые аппетитом» описывает ненасытную алчность. «Прожорливы» естественно передаёт образ псов и не дублирует полностью следующую фразу о сытости.
- source_word: לֹא יָדְעוּ שָׂבְעָה
  choice: они не знают сытости
  rationale: Сохраняет глагол «знать» и существительное «сытость», а также риторический параллелизм со следующим «не умеющие разуметь».
- source_word: רֹעִים
  choice: пастыри
  rationale: Сохранена метафора пастырей, обозначающая ответственных за народ, без замены на более узкое институциональное наименование.
- source_word: לֹא יָדְעוּ הָבִין
  choice: не умеющие разуметь
  rationale: Передаёт необычную еврейскую конструкцию «не знают разуметь» понятным, но несколько возвышенным русским оборотом.
- source_word: כֻּלָּם לְדַרְכָּם פָּנוּ
  choice: все они обратились каждый на свой путь
  rationale: Сохраняет всеобщность обвинения и метафору собственного пути.
- source_word: אִישׁ לְבִצְעוֹ
  choice: каждый — к своей наживе
  rationale: Распределительное אִישׁ передано словом «каждый», а בֶּצַע — словом «нажива», которое выражает корыстный оттенок, типичный для этого существительного в пророческом контексте.
- source_word: מִקָּצֵהוּ
  choice: все до одного
  rationale: Трудная заключительная форма понята как усиление полного охвата группы; пространственная возможность отмечена в сноске.
theological_decisions:
- issue: Отождествление «псов» и «пастырей» с определённой группой руководителей
  choice: Сохранить обе метафоры без прямой расшифровки в основном тексте.
  alternative: Передать как «вожди», «стражи» или «священнослужители».
  rationale: Исходный текст намеренно соединяет резкие образы псов и пастырей. Их прямая институциональная расшифровка сузила бы смысл и внесла бы в перевод лишнее толкование.
- issue: Нравственная окраска בֶּצַע
  choice: нажива
  alternative: выгода; прибыль; неправедная прибыль
  rationale: «Нажива» передаёт корыстную окраску слова в контексте обличения, но не добавляет отдельного определения «неправедная», которого в строке нет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. «Псы» и «пастыри» сохраняют образность и достоинство библейского стиля; «разуметь» поддерживает параллелизм, оставаясь понятным современному читателю.
