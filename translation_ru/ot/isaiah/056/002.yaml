  text: אַשְׁרֵ֤י אֱנוֹשׁ֙ יַעֲשֶׂה זֹּ֔את וּ/בֶן אָדָ֖ם יַחֲזִ֣יק בָּ֑/הּ שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וְ/שֹׁמֵ֥ר יָד֖/וֹ מֵ/עֲשׂ֥וֹת כָּל רָֽע־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/002.yaml
  text: 'Blessed is the man who does this, and the son of man who holds fast to it: keeping the Sabbath from profaning it, and keeping his hand from doing any evil.'
translation:
  language: ru
  text: 'Блажен человек, который поступает так, и сын человеческий, который твёрдо держится этого: хранит субботу, не оскверняя её, и не даёт своей руке совершать никакого зла.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Счастлив
  rationale: Передаёт формулу блаженства естественным современным русским словом, сохраняя смысл благополучия и Божьего одобрения.
- source_word: אֱנוֹשׁ ... בֶן־אָדָם
  choice: человек ... сын человеческий
  rationale: Сохраняет поэтический параллелизм и обычное здесь значение смертного человека; строчная буква не позволяет ошибочно принять выражение за мессианский титул.
- source_word: יַחֲזִיק בָּהּ
  choice: крепко держится этого
  rationale: Отражает значение стойкой приверженности; местоимение оставляет тот же контекстуальный охват, что и еврейский текст.
- source_word: שֹׁמֵר שַׁבָּת מֵחַלְּלוֹ
  choice: хранит субботу, не оскверняя её
  rationale: «Хранит» естественно передаёт соблюдение и бережное отношение, а «оскверняя» сохраняет культово-нравственную силу корня חלל.
- source_word: שֹׁמֵר יָדוֹ מֵעֲשׂוֹת כָּל־רָע
  choice: удерживает свою руку от всякого зла
  rationale: Сохраняет телесную метафору оригинала и обобщённый охват выражения כָּל־רָע.
theological_decisions:
- issue: Связь «этого» с последующими причастными оборотами
  choice: Двоеточие перед «хранит»
  alternative: 'Отдельное придаточное: «который хранит…»'
  rationale: Двоеточие сохраняет возможность понимать дальнейшие действия как пояснение того, что значит «поступает так» и «держится этого», не сводя указание исключительно к одному предшествующему стиху.
- issue: Значение «сын человеческий»
  choice: Нарицательное обозначение человека со строчной буквы
  alternative: Титульное «Сын Человеческий»
  rationale: В данном поэтическом параллелизме выражение соответствует «человеку» и не функционирует как особый титул.
- issue: Суббота и зло
  choice: Сохранены как два параллельных признака верности
  alternative: Подчинить общее воздержание от зла соблюдению субботы или наоборот
  rationale: Еврейский синтаксис координирует два причастных оборота и не даёт основания устранять их богословское напряжение.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Сохранены параллелизм, метафора руки и повторяющаяся структура; архаизмы по возможности исключены.
