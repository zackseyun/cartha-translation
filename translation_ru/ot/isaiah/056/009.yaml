lexical_decisions:
- source_word: כֹּל
  choice: все
  rationale: Передаёт собирательный квантор и естественно сочетается с прямым обращением к зверям.
- source_word: חַיְתוֹ
  choice: звери
  rationale: В сочетании с полем и лесом обозначает диких животных; слово «звери» сохраняет силу пророческого образа.
- source_word: שָׂדָי
  choice: полевые
  rationale: Естественно передаёт принадлежность к открытой местности и сохраняет параллелизм с «лесные».
- source_word: אֵתָיוּ
  choice: приходите
  rationale: Прямо передаёт форму повелительного призыва во множественном числе.
- source_word: לֶאֱכֹל
  choice: пожирать
  rationale: Основное значение глагола — «есть», однако в призыве к диким зверям «пожирать» естественно выражает хищническую силу контекста.
- source_word: בַּיָּעַר
  choice: лесные
  rationale: Хотя предлог буквально даёт «в лесу», по-русски атрибутивное «лесные звери» естественно и сохраняет поэтический параллелизм.
theological_decisions:
- issue: Пророческий образ созванных зверей
  choice: Сохранено буквальное обращение к диким зверям как образ грядущего суда.
  alternative: Истолковать зверей непосредственно как вражеские народы или захватчиков.
  rationale: Еврейский текст прямо обращается к зверям; возможный переносный смысл не следует подставлять вместо образа в основном тексте.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным пророческим звучанием. Восклицательный знак подчёркивает призыв; синтаксический параллелизм двух групп зверей сохранён.
