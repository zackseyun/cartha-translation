revisions:
- from: 'Так говорит Яхве: «Держитесь справедливости и поступайте праведно, ведь Моё спасение[a] скоро придёт и Моя праведность[b] откроется».'
  to: 'Так говорит Яхве: «Соблюдайте правосудие и поступайте праведно, ведь моё спасение[a] скоро придёт и моя праведность[b] откроется».'
  rationale: Исправление уточняет передачу שׁמר משפט и устраняет из сноски b интерпретирующую, а не лексическую альтернативу. Референциальная неоднозначность Божьей צדקה — праведность, справедливость, правосудное/оправдывающее действие — сохранена, без навязывания узкого богословского толкования. Строчные «моё/моя» соответствуют современной русской орфографической норме и не изменяют смысла.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:37:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: сохранены пророческая формула, два повеления, близость Божьего спасения и грядущее откровение Его צדקה. Однако «держитесь справедливости» несколько ослабляет и размывает שִׁמְרוּ («соблюдайте, храните»); «соблюдайте правосудие» точнее передаёт משפט в данном этико-общественном контексте.'
  naturalness: «Соблюдайте правосудие и поступайте праведно» — естественная для современного литературного русского, умеренно возвышенная и параллельная формулировка. Синтаксис второй части сохранён простым и ясным.
  terminology: '«Яхве», «спасение» и «праведность» приемлемы и сохраняют значимые различия исходного текста. Альтернатива в сноске b «Моё восстановление правды» не является точной лексической альтернативой для צדקה: это уже развёрнутое истолкование. Следует заменить её на более прямую альтернативу «Моё правосудие» (наряду с «Моя справедливость»).'
  issues:
  - severity: low
    issue: «Держитесь справедливости»
    rationale: Выражение возможно, но глагол «держаться» передаёт скорее личную приверженность, тогда как שׁמר требует соблюдения/хранения справедливого порядка. «Соблюдайте правосудие» точнее и устойчивее в пророческом регистре.
  - severity: medium
    issue: 'Сноска b: «Моё восстановление правды»'
    rationale: Фраза не представляет прямой лексической альтернативы к צדקה и сужает многозначность слова до интерпретирующего результата действия. «Моё правосудие» сохраняет возможный аспект justice/vindication без такого добавления.
