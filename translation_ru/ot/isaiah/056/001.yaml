base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/001.yaml
  text: 'Thus says Yahweh: Keep justice[a], and do righteousness, for my salvation is near to come[b], and my righteousness to be revealed.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Соблюдайте правосудие и поступайте праведно, ведь моё спасение[a] скоро придёт и моя праведность[b] откроется».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё избавление».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Моя справедливость» или «Моё правосудие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет формулу пророческого провозглашения и передаёт тетраграмматон личным именем «Яхве».
- source_word: שִׁמְרוּ מִשְׁפָּט
  choice: Держитесь справедливости
  rationale: Передаёт настойчивое требование хранить справедливый порядок и следовать ему; по-русски звучит естественнее буквального «храните справедливость».
- source_word: וַעֲשׂוּ צְדָקָה
  choice: и поступайте праведно
  rationale: Сохраняет отличие צְדָקָה от מִשְׁפָּט и выражает требование воплощать праведность в поступках.
- source_word: כִּי קְרוֹבָה יְשׁוּעָתִי לָבוֹא
  choice: ведь Моё спасение скоро придёт
  rationale: כִּי вводит основание повеления, а конструкция с קְרוֹבָה и инфинитивом указывает на близость наступления Божьего спасения.
- source_word: וְצִדְקָתִי לְהִגָּלוֹת
  choice: и Моя праведность откроется
  rationale: Сохраняет широкое значение Божьей צְדָקָה и передаёт страдательное значение נִפעל глагола גלה.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; «Яхве» передаёт его как личное заветное имя, не заменяя титулом.
- issue: Соотношение מִשְׁפָּט и צְדָקָה
  choice: справедливость / поступайте праведно
  alternative: суд / правда; правосудие / праведность
  rationale: Перевод сохраняет различие между общественно-нравственной справедливостью и праведным образом действий, не превращая слова в полные синонимы.
- issue: Значение Божьей צְדָקָה
  choice: Моя праведность
  alternative: Моя справедливость; Моё оправдание
  rationale: '«Праведность» оставляет открытыми взаимосвязанные смыслы: Божий праведный характер, справедливое действие и спасительное восстановление правды.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Формулировка остаётся понятной широкой аудитории; параллелизм исходного текста сохранён без архаизмов.
