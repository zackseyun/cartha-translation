  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה לַ/סָּֽרִיסִים֙ אֲשֶׁ֤ר יִשְׁמְרוּ֙ אֶת שַׁבְּתוֹתַ֔/י וּ/בָֽחֲר֖וּ בַּ/אֲשֶׁ֣ר חָפָ֑צְתִּי וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/004.yaml
  text: 'For thus says the LORD to the eunuchs who keep my Sabbaths, and choose what I delight in, and hold fast to my covenant:'
translation:
  language: ru
  text: 'Ибо так говорит Господь евнухам, которые соблюдают Мои субботы, избирают угодное Мне и твёрдо держатся Моего завета:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона, соответствующая принятому в данном контексте представлению имени.
- source_word: לַסָּרִיסִים
  choice: евнухам
  rationale: Прямое значение слова в контексте, где речь идёт о людях, физическое состояние которых названо в соседнем стихе.
- source_word: יִשְׁמְרוּ אֶת־שַׁבְּתוֹתַי
  choice: соблюдают Мои субботы
  rationale: שׁמר в сочетании с установлением означает хранить и соблюдать; множественное число «субботы» сохранено.
- source_word: וּבָחֲרוּ בַּאֲשֶׁר חָפָצְתִּי
  choice: избирают угодное Мне
  rationale: Передаёт осознанный выбор того, чего желает и что одобряет Бог, без добавочного толкования.
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  choice: твёрдо держатся Моего завета
  rationale: Причастие от חזק с предлогом ב выражает крепкую приверженность завету; «твёрдо держатся» естественно передаёт эту силу.
theological_decisions:
- issue: Условия обещания евнухам
  choice: 'Сохранены три однородных признака: соблюдение суббот, избрание угодного Богу и твёрдая приверженность завету.'
  alternative: Подчинить последние два признака первому или истолковать их как отдельные доктринальные категории.
  rationale: Еврейский текст соединяет три формы союзом ו и не устанавливает между ними дополнительной богословской иерархии.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» сохраняет достоинство современного литературного русского библейского регистра и соответствует консультационному слою, не вводя конфессионально маркированного решения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм оригинала сохранён; двоеточие оставлено, поскольку высказывание продолжается в следующем стихе.
