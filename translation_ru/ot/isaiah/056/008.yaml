base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/008.yaml
  text: 'The declaration of the Lord GOD[b][a], who gathers the outcasts of Israel: I will gather still more to him besides those already gathered to him.'
translation:
  language: ru
  text: 'Изречение Господа Яхве, собирающего изгнанников Израиля: «Я соберу к нему ещё других — в дополнение к тем, кто уже собран к нему».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Возможно: «Я соберу к ним ещё других — в дополнение к тем, кто уже собран к ним». В еврейском тексте местоименные суффиксы стоят в единственном числе, но могут иметь собирательное значение.'
    reason: alternative_reading
lexical_decisions:
- source_word: נְאֻם
  choice: Слово
  rationale: Существительное вводит торжественное Божье изречение; «Слово» сохраняет именную форму и естественно звучит в современном литературном русском.
- source_word: אֲדֹנָי יְהוָה
  choice: Владыки Яхве
  rationale: «Владыка» передаёт אֲדֹנָי и позволяет ясно сохранить личное имя יהוה как «Яхве», не создавая неестественного сочетания «Господь Господь».
- source_word: מְקַבֵּץ
  choice: собирающего
  rationale: Причастие характеризует говорящего как того, кто собирает; русское действительное причастие сохраняет форму и связь с титулом.
- source_word: נִדְחֵי יִשְׂרָאֵל
  choice: изгнанников Израиля
  rationale: נדח обозначает прогнанных или рассеянных; «изгнанники» передаёт вынужденное удаление точнее, чем нейтральное «рассеянные».
- source_word: עוֹד אֲקַבֵּץ
  choice: Я соберу … и других
  rationale: עוֹד имеет здесь добавочное значение, а имперфект אֲקַבֵּץ выражает обещанное будущее действие.
- source_word: עָלָיו
  choice: к нему
  rationale: Сохранён мужской род единственного числа еврейского суффикса, вероятно отсылающего к Израилю как коллективному лицу; неоднозначность не сглажена множественным числом.
- source_word: לְנִקְבָּצָיו
  choice: кроме уже собранных к нему
  rationale: Фраза выражает добавление к ранее собранной группе; «уже собранных» передаёт результативность пассивной формы, а «к нему» сохраняет единственное число суффикса.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוָה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Выбор сохраняет различие между титулом אֲדֹנָי и собственным Божьим именем יהוה, избегая как повторения «Господь Господь», так и замены имени общим словом «Бог».
- issue: Референт суффиксов единственного числа в עָלָיו и לְנִקְבָּצָיו
  choice: Сохранить «к нему», понимая возможную коллективную отсылку к Израилю
  alternative: «к ним»; отсылка к Сиону или земле
  rationale: Еврейская форма имеет мужской род единственного числа. Основной текст сохраняет эту особенность и тем самым не устраняет спорность референта; более гладкое коллективное множественное число указано в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; формальная неоднозначность местоименных суффиксов сохранена в основном тексте и пояснена сноской.
