  text: וְ/אַל יֹאמַ֣ר בֶּן הַ/נֵּכָ֗ר הַ/נִּלְוָ֤ה אֶל יְהוָה֙ לֵ/אמֹ֔ר הַבְדֵּ֧ל יַבְדִּילַ֛/נִי יְהוָ֖ה מֵ/עַ֣ל עַמּ֑/וֹ וְ/אַל יֹאמַר֙ הַ/סָּרִ֔יס הֵ֥ן אֲנִ֖י עֵ֥ץ יָבֵֽשׁ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/003.yaml
  text: Let not the foreigner who has joined himself to the LORD say, “The LORD will surely separate me from his people”; and let not the eunuch say, “Look, I am a dry tree.”
translation:
  language: ru
  text: 'Пусть иноплеменник, присоединившийся к Господу, не говорит: «Господь непременно отделит меня от Своего народа». И пусть евнух не говорит: «Вот, я — сухое дерево».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן הַנֵּכָר
  choice: иноплеменник
  rationale: Буквально «сын чужеземья»; в данном контексте обозначает человека из другого народа. «Иноплеменник» сохраняет связь с народной принадлежностью и звучит достойно.
- source_word: הַנִּלְוָה אֶל־יְהוָה
  choice: присоединившийся к Господу
  rationale: Форма נלוה выражает присоединение или примыкание; возвратное причастие естественно передаёт личное присоединение к Господу.
- source_word: הַבְדֵּל יַבְדִּילַנִי
  choice: непременно отделит меня
  rationale: Сочетание абсолютного инфинитива с личной формой того же корня усиливает утверждение; «непременно» передаёт это усиление.
- source_word: הַסָּרִיס
  choice: евнух
  rationale: Прямое и общепонятное соответствие еврейскому обозначению кастрированного мужчины или придворного-евнуха; контекст образа бесплодия поддерживает буквальный смысл.
- source_word: הֵן
  choice: вот
  rationale: Частица привлекает внимание к горькой самооценке говорящего; «вот» сохраняет краткость и торжественный оттенок.
- source_word: עֵץ יָבֵשׁ
  choice: сухое дерево
  rationale: Буквальный образ дерева, лишённого плода и жизненной силы, важен для последующего обещания и потому сохранён без поясняющей замены.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционное русское соответствие тетраграмматону, понятное широкой аудитории и согласующееся с предоставленным консультационным текстом; собственное имя не заменено богословским толкованием.
- issue: Усилительная конструкция הַבְדֵּל יַבְדִּילַנִי
  choice: «непременно отделит меня» как опасение самого иноплеменника
  alternative: «Господь отделит меня» без усиления
  rationale: 'Грамматическое усиление сохранено, при этом стих не утверждает, что Бог действительно отвергнет иноплеменника: это запрещённая ему речь, на которую далее даётся ответ.'
- issue: Метафора сухого дерева
  choice: сохранена буквально
  alternative: разъяснить как «я бездетен и лишён будущего»
  rationale: Буквальная метафора сохраняет многослойность образа — бесплодие, отсутствие потомства и ощущение отсечённости — не сводя его к одному толкованию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксический параллелизм двух запретов сохранён; архаическое «да не говорит» заменено естественным современным «пусть… не говорит». Местоимение «Своего» написано с прописной буквы по распространённой русской библейской традиции.
