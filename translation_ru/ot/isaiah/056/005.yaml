base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/005.yaml
  text: And I will give them[a], in my house and within my walls, a monument and a name better than sons and daughters[b]; I will give them an everlasting name that will not be cut off.
translation:
  language: ru
  text: Я дам им в Моём доме, внутри Моих стен, памятный знак и имя[a], более ценные, чем сыновья и дочери. Я дам ему[b] вечное имя, которое не будет отсечено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «руку и имя»; здесь «рука» означает памятный знак или памятник.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст переходит здесь от множественного числа («им») к единственному («ему»), возможно выделяя каждого человека внутри всей группы.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Я дам
  rationale: Обычное значение נתן — «давать»; повтор глагола сохранён в обеих частях стиха.
- source_word: לָהֶם
  choice: им
  rationale: Сохранено множественное число, относящее обещание ко всей названной ранее группе.
- source_word: בְּבֵיתִי וּבְחֹמֹתַי
  choice: в Моём доме, внутри Моих стен
  rationale: «Дом» не сужен толкованием до «храма», а «внутри Моих стен» естественно передаёт местонахождение в священных пределах.
- source_word: יָד וָשֵׁם
  choice: памятный знак и имя
  rationale: Буквально сочетание означает «рука и имя», но יָד здесь обозначает осязаемый знак памяти или памятник; перевод сохраняет конкретный мемориальный образ и понятен современному читателю.
- source_word: טוֹב מִבָּנִים וּמִבָּנוֹת
  choice: лучшее, чем сыновья и дочери
  rationale: Сравнительное значение מן сохранено, как и раздельное упоминание сыновей и дочерей; форма «лучшее» представляет весь обещанный дар как превосходящий потомство.
- source_word: שֵׁם עוֹלָם
  choice: вечное имя
  rationale: עוֹלָם здесь выражает непреходящую длительность; «вечное имя» естественно и торжественно звучит по-русски.
- source_word: אֶתֶּן לוֹ
  choice: Я дам ему
  rationale: Сохранён переход масоретского текста от множественного לָהֶם к единственному לוֹ, индивидуализирующий обещание.
- source_word: אֲשֶׁר לֹא יִכָּרֵת
  choice: которое не будет пресечено
  rationale: Формулировка сохраняет образ כרת «отсекать, пресекать» и его смысловую связь с прекращением рода, не заменяя его более общим «не исчезнет».
theological_decisions:
- issue: Идиоматическое выражение יָד וָשֵׁם
  choice: памятный знак и имя
  alternative: 'память и имя; буквально: рука и имя'
  rationale: Контекст обещает людям без потомства непреходящее место и память. «Памятный знак» передаёт конкретность יָד, тогда как буквальная «рука» в основном тексте была бы непонятна.
- issue: Переход от множественного לָהֶם к единственному לוֹ
  choice: «им» … «ему»
  alternative: 'согласовать число: «им» … «им»; пояснить: «каждому из них»'
  rationale: Переход числа присутствует в еврейском тексте и потому не сглажен. Сноска объясняет читателю эту особенность, не разрешая её толковательно.
- issue: Образ в אֲשֶׁר לֹא יִכָּרֵת
  choice: не будет пресечено
  alternative: не исчезнет; не будет искоренено
  rationale: «Пресечено» позволяет услышать намеренное созвучие с прекращением потомства и не сводит выражение лишь к забвению.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаическим библейским звучанием. Заглавные буквы в местоимениях «Моём», «Моих» отражают прямую речь Господа. Реальная смена числа и образ «пресечения» сохранены, а непрозрачная идиома разъяснена сноской.
