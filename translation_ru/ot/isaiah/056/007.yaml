  text: וַ/הֲבִיאוֹתִ֞י/ם אֶל הַ֣ר קָדְשִׁ֗/י וְ/שִׂמַּחְתִּי/ם֙ בְּ/בֵ֣ית תְּפִלָּתִ֔/י עוֹלֹתֵי/הֶ֧ם וְ/זִבְחֵי/הֶ֛ם לְ/רָצ֖וֹן עַֽל מִזְבְּחִ֑/י כִּ֣י בֵיתִ֔/י בֵּית תְּפִלָּ֥ה יִקָּרֵ֖א לְ/כָל הָ/עַמִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/007.yaml
  text: I will bring them to my holy mountain[a], and I will make them glad in my house of prayer; their burnt offerings and their sacrifices will be accepted on my altar, for my house will be called a house of prayer for all peoples.
translation:
  language: ru
  text: Я приведу их на Мою святую гору и обрадую их в Моём доме молитвы. Их всесожжения и жертвы будут приняты на Моём жертвеннике, потому что Мой дом будет назван домом молитвы для всех народов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для всех племён». Еврейское עַמִּים означает народы или этнические общности; здесь «народы» подчёркивает, что дом молитвы открыт не только для Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבִיאוֹתִים
  choice: Я приведу их
  rationale: Хифиль глагола בוא выражает действие Бога, приводящего людей; по-русски «приведу» естественно и ясно сохраняет Божью инициативу.
- source_word: אֶל הַר קָדְשִׁי
  choice: на Мою святую гору
  rationale: Предлог אֶל обозначает направленность движения; в русском сочетание «привести на гору» естественнее буквального «к горе». Образ святой горы, связанный с Сионом и храмом, сохранён.
- source_word: וְשִׂמַּחְתִּים
  choice: и обрадую их
  rationale: 'Пиэль שׂמח имеет каузативный смысл: Бог дарует им радость. «Обрадую» передаёт это компактно и естественно.'
- source_word: בְּבֵית תְּפִלָּתִי
  choice: в Моём доме молитвы
  rationale: Сохраняется характеристика храма именно как места молитвы, без расширения значения до более общего «поклонения».
- source_word: עוֹלֹתֵיהֶם
  choice: их всесожжения
  rationale: עוֹלָה — установленный термин для жертвы, полностью сжигаемой на жертвеннике; «всесожжение» точно и привычно для русского библейского языка.
- source_word: וְזִבְחֵיהֶם
  choice: и жертвы
  rationale: זֶבַח — общее обозначение жертвенного приношения; «жертвы» естественно сочетается с более специальным «всесожжения».
- source_word: לְרָצוֹן
  choice: будут угодны Мне
  rationale: В жертвенном контексте רָצוֹן указывает на благосклонное принятие Богом. «Угодны Мне» передаёт подразумеваемого принимающего и не создаёт впечатления, будто жертвы принимают люди.
- source_word: עַל מִזְבְּחִי
  choice: на Моём жертвеннике
  rationale: Прямое и естественное соответствие предложной группе.
- source_word: כִּי
  choice: потому что
  rationale: Передаёт обосновывающую связь с предыдущим обещанием принятия и радости.
- source_word: בֵּיתִי בֵּית תְּפִלָּה יִקָּרֵא
  choice: Мой дом назовут домом молитвы
  rationale: יִקָּרֵא формально является нифалем и допускает «будет назван», однако русская неопределённо-личная конструкция естественно передаёт пассивный смысл и сохраняет повтор слова «дом».
- source_word: לְכָל הָעַמִּים
  choice: для всех народов
  rationale: לְ передано как целевое/бенефактивное «для», а עַמִּים — широким русским «народы», охватывающим этнические и корпоративные общности, а не только современные государства.
theological_decisions:
- issue: Охват выражения לְכָל הָעַמִּים
  choice: для всех народов
  alternative: для всех племён; всеми народами
  rationale: Контекст говорит о допущении иноплеменников к молитве и жертвоприношению. «Для всех народов» сохраняет универсальную направленность текста, тогда как «всеми народами» делает לְ показателем деятеля и менее вероятно в данном контексте.
- issue: Смысл принятия жертв в לְרָצוֹן
  choice: будут угодны Мне
  alternative: будут приняты; будут благоприятны
  rationale: Формулировка выражает Божье благосклонное принятие жертв, не уточняя сверх текста ни условия, ни механизм такого принятия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены традиционные культовые термины «всесожжения» и «жертвенник», поскольку они точны и понятны в библейском контексте. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской религиозно-издательской норме.
