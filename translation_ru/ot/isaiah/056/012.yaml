base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/012.yaml
  text: Come[a], let me get wine, and let us fill ourselves with strong drink; and tomorrow will be like this day[b], great beyond measure.
translation:
  language: ru
  text: «Пойдёмте, я возьму вина, и мы вдоволь напьёмся хмельного напитка[a]. А завтра будет таким же, как сегодня, — даже гораздо лучше[b]!»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и напьёмся допьяна хмельного напитка». Еврейский глагол может подчёркивать насыщение питьём; контекст подразумевает пьяное излишество.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а завтра будет как сегодня — только гораздо больше». Заключительные еврейские слова усиливают похвальбу об ожидаемом завтрашнем дне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵתָיוּ
  choice: Давайте
  rationale: Форма служит обращённым к группе приглашением или побуждением. «Давайте» естественно передаёт русский разговорный призыв и подходит к хвастливо-пирующему тону прямой речи.
- source_word: אֶקְחָה
  choice: я достану
  rationale: Волевая форма первого лица от לקח здесь выражает намерение говорящего раздобыть или взять вино. «Я достану» естественно сочетается с последующим приглашением выпить вместе.
- source_word: יַיִן
  choice: вина
  rationale: Обычное и точное соответствие еврейскому יין.
- source_word: וְנִסְבְּאָה
  choice: и мы вдоволь напьёмся
  rationale: Глагол סבא обозначает насыщение, в данном контексте — питьё досыта; перевод сохраняет образ пресыщения напитком, не превращая подразумеваемое пьянство в прямое утверждение.
- source_word: שֵׁכָר
  choice: хмельного напитка
  rationale: שֵׁכָר — опьяняющий напиток, отличный от вина, без обязательного указания на современный дистиллированный алкоголь. «Хмельной напиток» понятно современному читателю и не создаёт такого анахронического оттенка, как «крепкий напиток».
- source_word: וְהָיָה
  choice: А ... будет
  rationale: Простое будущее значение היה; противительно-продолжающее «а» естественно вводит самоуверенное обещание о завтрашнем дне.
- source_word: כָזֶה
  choice: такой же ... как сегодня
  rationale: Сравнительное указательное выражение соотносит завтрашний день с нынешним; русская конструкция явно и естественно выражает это сравнение.
- source_word: יוֹם מָחָר
  choice: завтра ... день
  rationale: Еврейское сочетание буквально говорит о «завтрашнем дне»; в русском оно естественно передано конструкцией «завтра будет ... день».
- source_word: גָּדוֹל
  choice: изобильнее
  rationale: В контексте вина и пиршества «изобильнее» передаёт подразумеваемую величину или обилие ожидаемого дня, не сводя גָּדוֹל к физическому размеру.
- source_word: יֶתֶר מְאֹד
  choice: даже намного
  rationale: 'Сочетание резко усиливает сравнительную похвальбу: завтрашний день ожидается не только таким же, но значительно превосходящим нынешний.'
theological_decisions:
- issue: Самоуверенность говорящих относительно завтрашнего дня
  choice: Сохранена как прямая хвастливая речь без добавленного нравственного комментария
  alternative: Добавить в перевод неодобрительную характеристику или указание на Божий суд
  rationale: Неодобрение ясно из литературного контекста, но не выражено отдельными словами данного стиха; в текст перевода его добавлять не следует.
translation_notes:
  register: Современная, естественная прямая речь с оттенком беспечной пирушки и самоуверенной похвальбы. Избегнуты архаичное «сикера» и способное вызвать анахроническую ассоциацию с дистиллированным алкоголем выражение «крепкий напиток».
