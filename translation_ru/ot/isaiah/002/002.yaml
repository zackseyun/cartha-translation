id: ISA.2.2
reference: Isaiah 2:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים נָכ֨וֹן יִֽהְיֶ֜ה הַ֤ר בֵּית יְהוָה֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֖א מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ אֵלָ֖י/ו כָּל הַ/גּוֹיִֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/002.yaml
  text: And in the latter days the mountain of the house of Yahweh shall be established as the highest of the mountains[a], and shall be lifted up above the hills[c][b]; and all the nations shall stream to it.
translation:
  language: ru
  text: 'И будет в грядущие дни[a]: гора дома Яхве будет прочно утверждена во главе гор[b] и возвысится над холмами; и все народы потекут к ней[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в последние дни»; также возможно: «в дни, которые придут».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «гора дома Яхве будет прочно утверждена как высочайшая из гор»; возможно также: «на вершине гор».'
    reason: alternative_reading
  - marker: c
    text: Еврейский глагол создаёт образ народов, которые текут к горе, словно река.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Кратко и естественно вводит будущую пророческую картину, сохраняя формулу еврейского текста без архаичного «и будет в тот день».
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: в грядущие дни
  rationale: Передаёт временную направленность выражения и его пророческую широту, не навязывая узкой схемы конца мира.
- source_word: נָכוֹן יִהְיֶה
  choice: утвердится
  rationale: Передаёт значение прочного установления и устойчивости; русская форма естественно вписывается в пророческое описание будущего.
- source_word: הַר בֵּית יְהוָה
  choice: гора дома Яхве
  rationale: 'Прозрачно сохраняет цепочку существительных: речь идёт о горе, связанной с домом Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: בְּרֹאשׁ הֶהָרִים
  choice: как высочайшая из гор
  rationale: В параллели с последующим «возвысится над холмами» выражение естественно указывает на превосходство и возвышенность; пространственное прочтение отмечено в сноске.
- source_word: וְנִשָּׂא מִגְּבָעוֹת
  choice: и возвысится над холмами
  rationale: Сохраняет образ возвышения и сравнительное значение предлога מן.
- source_word: גְּבָעוֹת
  choice: холмами
  rationale: Обычное топографическое значение соответствует параллелизму «горы — холмы».
- source_word: וְנָהֲרוּ
  choice: и потекут
  rationale: Сохраняет намеренно необычную речную метафору движения народов к горе.
- source_word: אֵלָיו
  choice: к ней
  rationale: Местоимение отнесено к грамматически женскому слову «гора» в русском переводе.
- source_word: כָּל הַגּוֹיִם
  choice: все народы
  rationale: В данном контексте גּוֹיִם обозначает народы в широком смысле; «язычники» было бы излишне толковательным.
theological_decisions:
- issue: Временной смысл בְּאַחֲרִית הַיָּמִים
  choice: в грядущие дни
  alternative: в последние дни; впоследствии
  rationale: Выбранная формулировка сохраняет открытый пророческий горизонт и не ограничивает выражение одной эсхатологической системой.
- issue: Характер возвышения горы
  choice: утвердится как высочайшая из гор
  alternative: утвердится на вершине гор
  rationale: Контекстуальный параллелизм благоприятствует смыслу превосходства, однако еврейское выражение допускает и более пространственное прочтение, поэтому оно сохранено в сноске.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис близок к еврейскому параллелизму, но остаётся естественным; образ «потекут» намеренно сохранён как яркая метафора.
