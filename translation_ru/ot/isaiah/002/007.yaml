  yaml_path: translation/ot/isaiah/002/007.yaml
  text: His land is filled with silver and gold[a], and there is no end to his treasures; his land is filled with horses[b], and there is no end to his chariots.
translation:
  language: ru
  text: Его земля[a] наполнена серебром и золотом, и нет конца его сокровищам[b]; его земля наполнена конями, и нет конца его колесницам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь и далее стоит единственное число: «его земля… его сокровища… его колесницы». Вероятно, так собирательно назван народ.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его хранилищам» либо «его сокровищницам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמָּלֵא
  choice: наполнилась
  rationale: Форма от מלא передаёт наступившее состояние полноты. Русское прошедшее совершенного вида естественно воспроизводит повествовательную форму wayyiqtol и сохраняет повтор в обеих половинах стиха.
- source_word: אַרְצוֹ
  choice: его земля
  rationale: Сохранён суффикс 3-го лица мужского рода единственного числа; в контексте он, вероятно, указывает на народ как на собирательное целое.
- source_word: כֶּסֶף וְזָהָב
  choice: серебром и золотом
  rationale: Прямой и естественный перевод названий драгоценных металлов, образующих поэтическую пару.
- source_word: וְאֵין קֵצֶה
  choice: и нет конца
  rationale: Близко передаёт отрицательную конструкцию со значением отсутствия конца или предела и звучит естественно по-русски.
- source_word: לְאֹצְרֹתָיו
  choice: его сокровищам
  rationale: В сочетании с серебром и золотом אֹצָר прежде всего обозначает накопленные богатства; возможное значение помещения для хранения отмечено в сноске.
- source_word: סוּסִים
  choice: конями
  rationale: Прямой перевод множественного числа; форма «конями» соответствует управлению глагола «наполнилась».
- source_word: לְמַרְכְּבֹתָיו
  choice: его колесницам
  rationale: Передано основное значение без добавления определения «боевым», которого нет в еврейском тексте.
theological_decisions:
- issue: Единственное число притяжательных суффиксов в обличении всего народа
  choice: его земля… его сокровищам… его колесницам
  alternative: их земля… их сокровищам… их колесницам
  rationale: Еврейский текст последовательно употребляет суффиксы 3-го лица мужского рода единственного числа. Вероятно, речь идёт о народе или Иакове как о собирательном целом; сохранение единственного числа не устраняет эту значимую особенность текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Сохранены синтаксический параллелизм, повтор «его земля наполнилась» и неоднозначность собирательного единственного числа.
