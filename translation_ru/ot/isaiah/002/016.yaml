  text: и против всех кораблей Таршиша, и против всех прекрасных изделий[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «всех прекрасных изображений», «всех прекрасных судов» или «всех драгоценных изделий». Еврейское слово, переведённое как «изделия», встречается редко, и его точное значение неясно; морской контекст может поддерживать понимание, связанное с кораблями или судами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: и против
  rationale: В контексте Ис 2:12–16 предлог עַל указывает на то, против чего направлен грядущий суд Господа; повтор «и против» сохраняет поэтическую анафору.
- source_word: כָּל
  choice: всех
  rationale: Передаёт полноту охвата и сохраняет повторение исходного текста.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: таршишских кораблей
  rationale: Естественно передаёт сочетание «корабли Таршиша», не решая однозначно, обозначены ли корабли, связанные с Таршишем, или класс больших морских торговых судов.
- source_word: שְׂכִיּוֹת
  choice: судов
  rationale: Редкое слово имеет неясное значение. Морской параллелизм с «таршишскими кораблями» поддерживает значение, связанное с судами, однако неопределённость отражена в сноске.
- source_word: הַחֶמְדָּה
  choice: прекрасных
  rationale: Передаёт смысл привлекательности, желанности или ценности и естественно сочетается по-русски со словом «судов».
