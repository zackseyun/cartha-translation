base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/003.yaml
  text: And many peoples will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For instruction will go out from Zion[b], and the word of Yahweh from Jerusalem.
translation:
  language: ru
  text: 'И многие народы пойдут и скажут[a]: «Придите, взойдём на гору Яхве, к дому Бога Иакова! Он научит нас своим путям, и мы будем ходить его стезями». Ибо с Сиона выйдет наставление[b], и слово Яхве — из Иерусалима.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придут»; еврейский глагол буквально означает «идти, ходить» и здесь описывает движение народов к Сиону.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово тора может также переводиться как «закон» или «учение».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: пойдут
  rationale: Глагол הלך буквально означает «идти, ходить». Русское «пойдут» естественно передаёт движение народов к Сиону, не меняя перспективу исходного текста на «придут».
- source_word: עַמִּים רַבִּים
  choice: многие народы
  rationale: עַמִּים обозначает народы как этнические сообщества; «народы» сохраняет множественность и не сводит смысл к современным государствам.
- source_word: לְכוּ וְנַעֲלֶה
  choice: Придите, взойдём
  rationale: לְכוּ служит призывом отправиться вместе, а עלה выражает восхождение к горе и Иерусалиму. Такая формулировка кратка, естественна и сохраняет образ паломничества.
- source_word: הַר יְהוָה
  choice: гора Яхве
  rationale: הַר прямо означает «гора», а имя יהוה передано как «Яхве», чтобы сохранить личное имя Бога в исходном тексте.
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  choice: дом Бога Иакова
  rationale: Сохранено буквальное «дом», а не поясняющее «храм», поскольку еврейское выражение обладает собственной образностью и богословским звучанием.
- source_word: וְיֹרֵנוּ מִדְּרָכָיו
  choice: Он научит нас Своим путям
  rationale: Хотя при דְּרָכָיו стоит מִן, сочетание идиоматически означает обучение Божьим путям или чему-либо из них. «Научит нас Своим путям» точно и естественно по-русски, без неуклюжего буквального «из Своих путей».
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  choice: и мы будем ходить Его стезями
  rationale: «Ходить стезями» сохраняет метафору поведения и образ пути. Когортатив допускает оттенок намерения; русское будущее в контексте призыва передаёт ожидаемый результат обучения.
- source_word: כִּי
  choice: Ведь
  rationale: כִּי вводит основание сказанного народами. «Ведь» естественно связывает их призыв с объяснением о наставлении, исходящем с Сиона.
- source_word: תּוֹרָה
  choice: наставление
  rationale: תּוֹרָה здесь шире законодательного кодекса и означает Божье учение или руководство. «Наставление» сохраняет этот широкий смысл.
- source_word: תֵּצֵא
  choice: выйдет
  rationale: יצא означает «выходить». «Выйдет с Сиона» сохраняет направленное вовне движение и параллелизм со словом, исходящим из Иерусалима.
- source_word: וּדְבַר יְהוָה
  choice: и слово Яхве
  rationale: Устойчивое «слово Яхве» сохраняет пророческий регистр и не сужает דָּבָר до одного лишь сообщения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано непосредственно как «Яхве», а не заменено титулом.
- issue: Значение תּוֹרָה в пророчестве о народах
  choice: наставление
  alternative: закон; учение
  rationale: «Наставление» передаёт широкий смысл Божьего обучения и руководства и не ограничивает תּוֹרָה юридическими предписаниями.
- issue: Соотношение וְיֹרֵנוּ и וְנֵלְכָה
  choice: «Он научит… и мы будем ходить»
  alternative: «чтобы Он научил… и чтобы мы ходили»
  rationale: Еврейская последовательность допускает целевой и результативный оттенки. Выбранная естественная русская конструкция сохраняет связь Божьего обучения с намерением народов жить согласно Его путям, не утверждая более узкой синтаксической трактовки.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Стези» сохраняют поэтический параллелизм и общеупотребительный библейский образ, тогда как синтаксис и остальные слова остаются доступными современному читателю.
