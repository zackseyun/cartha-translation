source:
  edition: WLC
  text: כִּ֣י נָטַ֗שְׁתָּה עַמְּ/ךָ֙ בֵּ֣ית יַעֲקֹ֔ב כִּ֤י מָלְאוּ֙ מִ/קֶּ֔דֶם וְ/עֹֽנְנִ֖ים כַּ/פְּלִשְׁתִּ֑ים וּ/בְ/יַלְדֵ֥י נָכְרִ֖ים יַשְׂפִּֽיקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/006.yaml
  text: For you have forsaken your people[a], the house of Jacob, because they are full of eastern ways, and they practice divination like the Philistines[c][b], and they strike hands with the children of foreigners.
translation:
  language: ru
  text: Ибо Ты оставил Свой народ, дом Иакова, потому что они полны обычаев Востока[a], гадают, как филистимляне[b], и сближаются с потомками чужеземцев[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «полны с востока» или «полны тем, что с востока»; возможно, имеются в виду восточные влияния или обычаи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «они — гадатели, как филистимляне».'
    reason: lexical_alternative
  - marker: c
    text: 'Редкий еврейский глагол имеет не вполне ясное значение. Возможно: «ударяют по рукам с потомками чужеземцев», «заключают с ними соглашения» или, шире, «объединяются с ними».'
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתָּה
  choice: Ты оставил
  rationale: Глагол נטשׁ означает «оставлять, покидать». Форма обращена к Богу; «оставил» естественно передаёт совершённое действие, сохраняя его судебно-заветную серьёзность.
- source_word: עַמְּךָ בֵּית יַעֲקֹב
  choice: Свой народ, дом Иакова
  rationale: 'Сохранено приложение: «дом Иакова» поясняет, какой именно народ назван Божьим. Имя Иаков передано буквально, без замены на «Израиль».'
- source_word: מָלְאוּ מִקֶּדֶם
  choice: они полны обычаев Востока
  rationale: Буквально сочетание означает «они полны с востока/того, что с востока». Добавление «обычаев» естественно выражает вероятный эллиптический смысл, а неоднозначность отмечена в сноске.
- source_word: עֹנְנִים
  choice: гадают
  rationale: Причастие обозначает гадателей либо тех, кто занимается гаданием. Русская глагольная форма ясна и естественна, не уточняя спорный конкретный способ гадания.
- source_word: כַּפְּלִשְׁתִּים
  choice: как филистимляне
  rationale: Прямо сохраняется сравнительная конструкция с כ.
- source_word: וּבְיַלְדֵי נָכְרִים
  choice: с детьми чужеземцев
  rationale: Формально передаёт ילדי «дети/потомки» и נכרים «чужеземцы». Не сужает значение до мужчин и не превращает этническое обозначение в нравственную оценку.
- source_word: יַשְׂפִּיקוּ
  choice: сходятся
  rationale: Редкий и не вполне ясный глагол, вероятно, описывает сближение, объединение или скрепление договорённости рукопожатием. Нейтральное «сходятся» сохраняет общий смысл связи, а более узкие варианты вынесены в сноску.
theological_decisions:
- issue: Характер заимствования с Востока
  choice: Речь, вероятнее всего, идёт об усвоении восточных обычаев, в данном контексте связанных с гаданием.
  alternative: Выражение может буквально указывать на людей или влияния, пришедшие с востока.
  rationale: Эллиптическое מִקֶּדֶם не позволяет безоговорочно определить предмет наполнения; основной текст даёт контекстуально вероятный смысл, а сноска сохраняет буквальную неоднозначность.
- issue: Связь с чужеземцами в заключительной части
  choice: Передана как сближение или объединение с потомками чужеземцев.
  alternative: Глагол может конкретнее означать рукопожатие, заключение соглашений или союзов.
  rationale: Редкость יַשְׂפִּיקוּ требует осторожности. Формулировка не превращает пророческое обличение религиозного и общественного смешения в безусловное осуждение людей по происхождению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Заглавные местоимения в обращении к Богу поддерживают принятую русскую библейскую традицию. «Восток» написан с прописной буквы как название культурно-географического региона; «филистимляне» — со строчной как название народа.
