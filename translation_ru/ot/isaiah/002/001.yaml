  text: הַ/דָּבָר֙ אֲשֶׁ֣ר חָזָ֔ה יְשַֽׁעְיָ֖הוּ בֶּן אָמ֑וֹץ עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/001.yaml
  text: The word that Isaiah son of Amoz saw concerning Judah and Jerusalem[a][b].
translation:
  language: ru
  text: Слово, которое видел Исаия, сын Амоса, об Иудее и Иерусалиме[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Весть» или «Дело».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «видел»; это обычное пророческое выражение, обозначающее получение откровения в видении.'
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: דָּבָר может означать «слово», «весть» или «дело». В пророческом заглавии «слово» сохраняет конкретный образ еврейского текста и остаётся понятным в русском библейском контексте.
- source_word: אֲשֶׁר
  choice: которое
  rationale: Относительное местоимение естественно связывает существительное «слово» с глаголом «видел».
- source_word: חָזָה
  choice: видел
  rationale: Глагол буквально означает «видел» и служит обычным пророческим обозначением восприятия откровения. Такой перевод сохраняет образ исходного текста, не заменяя его толкованием.
- source_word: יְשַׁעְיָהוּ
  choice: Исаия
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: בֶּן
  choice: сын
  rationale: Конструкция происхождения естественно передаётся по-русски приложением «сын Амоса».
- source_word: אָמוֹץ
  choice: Амос
  rationale: Использована устоявшаяся русская форма имени; это имя отца Исаии, не имя пророка Амоса, хотя в русской традиции они пишутся одинаково.
- source_word: עַל
  choice: об
  rationale: В пророческом заглавии предлог вводит тему видения. Нейтральное «об» не сужает содержание до пророчества исключительно против Иудеи и Иерусалима.
- source_word: יְהוּדָה
  choice: Иудее
  rationale: Устоявшаяся русская форма названия; падеж обусловлен предлогом «об».
- source_word: וִירוּשָׁלִָם
  choice: и Иерусалиме
  rationale: Союз и название города переданы естественной русской конструкцией, согласованной с предлогом «об».
theological_decisions:
- issue: Характер пророческого откровения в חָזָה
  choice: Сохранить образное выражение «видел».
  alternative: «получил в видении» или «пророчествовал»
  rationale: Еврейский текст прямо употребляет глагол «видеть». Его сохранение передаёт визионный характер пророческого восприятия и не сводит выражение к общему сообщению о пророчестве.
- issue: Значение עַל в заглавии
  choice: «об Иудее и Иерусалиме»
  alternative: «против Иудеи и Иерусалима»
  rationale: Заглавие обозначает широкую тему пророчества, включающего и суд, и надежду. Нейтральный предлог сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского заглавия. Необычное сочетание «слово, которое видел» сохранено намеренно ради исходного пророческого образа и пояснено сноской.
