  footnotes:
  - marker: a
    text: 'Или: «совершенно прекратят существование».'
    reason: 'Лексическая альтернатива: חלף может означать «пройти, миновать, исчезнуть, прекратиться»; в данном контексте речь идёт о полном исчезновении идолов.'
lexical_decisions:
- source_word: וְהָאֱלִילִים
  choice: А все идолы
  rationale: וְ передаётся контекстуальным союзом «А», естественно вводящим итоговое противопоставление истинному величию Господа; определённость существительного выражена по-русски контекстом. אֱלִילִים означает «идолы» и несёт уничижительный оттенок ничтожности, который уже подразумевается самим словом и контекстом.
- source_word: כָּלִיל
  choice: совершенно
  rationale: Наречное употребление подчёркивает полноту и окончательность исчезновения.
- source_word: יַחֲלֹף
  choice: исчезнут
  rationale: Форма от חלף допускает значения «пройти», «миновать», «исчезнуть». При подлежащем «идолы» и усилителе כָּלִיל естественное русское «исчезнут» передаёт пророческую мысль об их полном устранении.
