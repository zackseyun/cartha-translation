base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/022.yaml
  text: Stop trusting in man, whose breath is in his nostrils; for what is he really worth?
translation:
  language: ru
  text: Перестаньте полагаться на человека[a], у которого дыхание в ноздрях. Ведь чего он стоит?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отступитесь от человека»; возможный смысл: «перестаньте считаться с человеком».'
    reason: Древнееврейский оборот краток и допускает более буквальное понимание, тогда как основной текст выражает вероятный контекстуальный смысл — отказ от упования на человека.
  - marker: b
    text: 'Или: «что он значит?»; буквально: «в чём он считается (значимым)?»'
    reason: 'Сохраняет диапазон значений формы נחשב: оцениваться, считаться чем-либо, приниматься в расчёт.'
lexical_decisions:
- source_word: חִדְלוּ לָכֶם מִן־הָאָדָם
  choice: Перестаньте полагаться на человека
  rationale: Буквально оборот призывает «отстраниться от человека» или «перестать иметь дело с человеком»; в контексте обличения человеческой самонадеянности естественный русский эквивалент передаёт запрет считать человека надёжной опорой.
- source_word: נְשָׁמָה בְּאַפּוֹ
  choice: чьё дыхание — в его ноздрях
  rationale: Сохранён конкретный древнееврейский образ непрочного человеческого дыхания и, следовательно, смертности; он не заменён пояснением, которое устранило бы образность.
- source_word: בַמֶּה נֶחְשָׁב הוּא
  choice: чего он стоит?
  rationale: נחשב означает «считаться, быть оценённым, приниматься в расчёт». Русский вопрос передаёт риторическое сомнение в способности смертного человека служить окончательной опорой, сохраняя оценочный оттенок исходного текста.
theological_decisions:
- issue: Предмет запрета
  choice: Запрет полагаться на смертного человека как на надёжную опору
  alternative: Общий приказ полностью избегать людей или не ценить человеческую жизнь
  rationale: Контекст Ис 2 противопоставляет человеческую гордость и могущество одному лишь Господу; перевод не превращает стих в отрицание достоинства человека.
- issue: Смысл заключительного вопроса
  choice: Риторически подчеркнуть ограниченность и ненадёжность человека
  alternative: Утверждать, что человек вообще не имеет ценности
  rationale: Образ дыхания указывает на смертность; вопрос касается того, какой вес можно придавать человеку как опоре, а не выносит исчерпывающее суждение о человеческом достоинстве.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной интонацией. Сохранён телесный образ дыхания в ноздрях; синтаксис сделан ясным для обычного читателя. Формулировка не вводит конфессиональной терминологии и не устраняет риторическую напряжённость стиха.
