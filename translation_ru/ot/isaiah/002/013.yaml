lexical_decisions:
- source_word: וְעַל
  choice: и против
  rationale: 'Повторяющийся предлог עַל в перечне объектов суда передан как «против»: контекст дня Господня указывает на враждебное выступление, а союз «и» сохраняет поэтическую структуру списка.'
- source_word: כָּל
  choice: всех
  rationale: Собирательное «всех» естественно сочетается во множественном числе с названиями деревьев и передаёт всеохватность поэтического перечня.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: кедров Ливана
  rationale: Сопряжённая конструкция обозначает знаменитые кедры, связанные с Ливаном; родительный падеж точен и естественен по-русски.
- source_word: הָרָמִים
  choice: высоких
  rationale: Слово от корня רום прямо описывает высоту деревьев и одновременно сохраняет возможный контекстуальный оттенок возвышенности, не превращая образ в явное толкование.
- source_word: וְהַנִּשָּׂאִים
  choice: и вознесённых
  rationale: Пассивное причастие от נשׂא передано словом, сохраняющим образ поднятости и связь с темой превозношения в контексте. Союз сохранён в соответствии с еврейским параллелизмом.
- source_word: אַלּוֹנֵי הַבָּשָׁן
  choice: дубов Васана
  rationale: אַלּוֹן обычно можно передать как «дуб»; это хорошо соответствует параллели с величественными кедрами. Неуверенность в определении породы сохранена в сноске.
theological_decisions:
- issue: Символическое значение деревьев в пророчестве о суде
  choice: Сохранить буквальные образы деревьев, позволяя контексту выявить их связь с гордостью и превозношением.
  alternative: Явно назвать деревья символами гордых правителей или народов.
  rationale: В ближайшем контексте перечисляются возвышающиеся природные и человеческие объекты, которые Господь унизит. Буквальный образ сохраняет поэзию и не вносит толкование непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Синтаксический повтор «и против» сохранён ради ритма перечня; «вознесённых» удерживает физическую и символическую многозначность исходного образа.
