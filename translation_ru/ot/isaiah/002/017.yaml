  text: וְ/שַׁח֙ גַּבְה֣וּת הָ/אָדָ֔ם וְ/שָׁפֵ֖ל ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/017.yaml
  text: The loftiness of man will be brought low[a], and the exaltation of men will be humbled; and Yahweh alone will be exalted in that day.
translation:
  language: ru
  text: Высокомерие человека будет низведено[a], и надменность людей — унижена; один лишь Яхве будет превознесён в тот день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Надменность человека склонится, и гордыня людей будет унижена». В еврейском тексте употреблены слова, связанные с высотой; ими образно выражено человеческое превозношение.'
    reason: Лексическая альтернатива и пояснение образа высоты.
lexical_decisions:
- source_word: וְשַׁח
  choice: будет низложено
  rationale: Форма перфекта в пророческом контексте передаёт будущее действие. «Будет низложено» естественно выражает решительное понижение и сохраняет образ падения с высоты.
- source_word: גַּבְהוּת הָאָדָם
  choice: человеческое высокомерие
  rationale: גַּבְהוּת буквально связано с высотой, но здесь обозначает человеческую надменность. «Высокомерие» передаёт и смысл гордости, и заложенный в еврейском тексте образ высоты; родовое הָאָדָם естественно выражено прилагательным «человеческое».
- source_word: וְשָׁפֵל
  choice: будет унижена
  rationale: Глагол параллелен וְשַׁח и обозначает понижение того, что считалось высоким. «Будет унижена» ясно и естественно передаёт смысл в русском языке.
- source_word: רוּם אֲנָשִׁים
  choice: людская гордыня
  rationale: רוּם буквально означает высоту или возвышенность, а в данном контексте — человеческое превозношение. «Людская гордыня» сохраняет поэтический параллелизм и не ограничивает אֲנָשִׁים только мужчинами.
- source_word: וְנִשְׂגַּב
  choice: будет превознесён
  rationale: Нифаль выражает возвышение или признание высоким. «Будет превознесён» создаёт намеренный контраст с низложенной человеческой гордыней.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: לְבַדּוֹ
  choice: один лишь
  rationale: 'Сочетание подчёркивает исключительность: в тот день превознесённым окажется только Яхве.'
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача устойчивой пророческой формулы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Родовое значение הָאָדָם и אֲנָשִׁים
  choice: человеческое ... людская
  alternative: человека ... людей
  rationale: В контексте оба слова относятся к человечеству в целом. Русские определения передают родовое значение и сохраняют параллелизм без искусственного ограничения только мужчинами.
- issue: Образ человеческой высоты и Божьего превознесения
  choice: в основном передать смысл гордыни, сохранив вертикальный образ в глаголах «низложено» и «превознесён»
  alternative: 'буквально: «высота человека поникнет, и возвышенность людей понизится»'
  rationale: Буквальный вариант неестественен по-русски. Выбранная передача сохраняет контраст между унижением человеческого превозношения и исключительным превознесением Яхве, а образ высоты поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксический параллелизм оригинала сохранён; лексика понятна широкому кругу читателей, а буквальная метафора высоты раскрыта в сноске.
