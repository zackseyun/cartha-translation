  text: and against all the high mountains[a], and against all the lofty hills.
translation:
  language: ru
  text: и против всех высоких гор, и против всех возвышенных холмов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: и против
  rationale: В продолжающемся перечне объектов суда предлог עַל передаёт направленность действия против них, а не пространственное положение «на».
- source_word: כָּל
  choice: всех
  rationale: Форма «всех» естественно передаёт охват всей названной категории и сохраняет повторяющуюся еврейскую конструкцию.
- source_word: הֶהָרִים
  choice: гор
  rationale: «Горы» точно передаёт הָרִים и сохраняет отличие от следующего גְּבָעוֹת — «холмов».
- source_word: הָרָמִים
  choice: высоких
  rationale: Причастное прилагательное от רום обозначает высоту; сочетание «высокие горы» естественно в современном русском и не делает метафору гордости более явной, чем в исходном тексте.
- source_word: הַגְּבָעוֹת
  choice: холмов
  rationale: «Холмы» — ясное соответствие גְּבָעוֹת, сохраняющее топографический параллелизм с горами.
- source_word: הַנִּשָּׂאוֹת
  choice: возвышающихся
  rationale: Причастие от נשׂא буквально рисует поднятые, возвышенные холмы. «Возвышающихся» сохраняет образ высоты и звучит естественнее по-русски, чем буквальное «поднятых».
theological_decisions:
- issue: Следует ли переводить названия возвышенностей так, чтобы явно подчеркнуть символику человеческой гордости
  choice: 'Сохранить буквальный образ местности: «высоких гор» и «возвышающихся холмов».'
  alternative: 'Передать более интерпретирующе: «гордых гор» или «вознесённых холмов», выдвинув на первый план тему гордости.'
  rationale: В контексте Ис 2 всё возвышенное может приобретать символический смысл, однако сам стих называет реальные элементы ландшафта. Буквальная формулировка сохраняет возможный символический отзвук, не превращая его в однозначное толкование.
translation_notes:
  register: Современный литературный русский язык; поэтический параллелизм и повтор «и против всех» сохранены. Формулировка достоинственная и ясная, без искусственной архаизации.
