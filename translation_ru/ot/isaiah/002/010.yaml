  yaml_path: translation/ot/isaiah/002/010.yaml
  text: Enter into the rock and hide yourself in the dust from before the terror of Yahweh and from the splendor of his majesty[a][b][c].
translation:
  language: ru
  text: Войди в скалу и скройся в прахе от ужаса Яхве[a][b] и от великолепия его величия[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от страха перед Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от лица»; еврейский оборот выражает бегство от явленного присутствия Яхве.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «от величия его великолепия». В еврейском тексте соединены два близких по смыслу слова, описывающих подавляющую царственную славу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא בַצּוּר
  choice: Войди в скалу
  rationale: Повелительная форма בוא с предлогом ב передаёт движение внутрь; «войди в скалу» сохраняет прямоту приказа и образ укрытия среди скал.
- source_word: וְהִטָּמֵן
  choice: и скройся
  rationale: 'Нифаль в повелительной форме имеет здесь возвратно-медиальное значение: человеку велено самому укрыться.'
- source_word: בֶּעָפָר
  choice: в прахе
  rationale: עָפָר означает пыль, прах или землю. «Прах» сохраняет возвышенный литературный регистр и оттенки унижения и бренности.
- source_word: מִפְּנֵי
  choice: от
  rationale: В основном тексте выбран естественный русский предлог; буквальный пространственный оттенок «от лица», указывающий на бегство от присутствия, отмечен в сноске.
- source_word: פַּחַד יְהוָה
  choice: ужаса Яхве
  rationale: В контексте суда פַּחַד обозначает не благоговение, а вселяющий ужас страх. Конструкция с родительным падежом сохраняет сжатость и некоторую неоднозначность еврейского сочетания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: הֲדַר גְּאֹנוֹ
  choice: великолепия его величия
  rationale: Два близких по значению существительных переданы разными словами, чтобы сохранить усиленное описание царственной славы, не сводя их в одно понятие.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя יהוה; транслитерация сохраняет его как личное имя и не подменяет титулом.
- issue: Значение פחד в контексте Божьего суда
  choice: ужас Яхве
  alternative: страх перед Яхве
  rationale: Контекст описывает сокрушительное явление Бога в суде, а не благоговейный «страх Господень» из литературы мудрости. При этом альтернативное понимание отмечено в сноске.
- issue: Связь выражения מִפְּנֵי с Божьим присутствием
  choice: естественное русское «от» в тексте с пояснением в сноске
  alternative: буквальное «от лица»
  rationale: Буквализм «от лица ужаса» неясен по-русски; сноска сохраняет пространственно-богословский оттенок бегства от явленного присутствия Яхве.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Краткие повеления сохранены; «прах» выбран вместо разговорного «пыль», а необычная пара «великолепие его величия» намеренно удерживает риторическое усиление оригинала.
