  text: עֵינֵ֞י גַּבְה֤וּת אָדָם֙ שָׁפֵ֔ל וְ/שַׁ֖ח ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/011.yaml
  text: The lofty eyes of man will be brought low[a], and the haughtiness of men will be humbled; and Yahweh alone will be exalted in that day.
translation:
  language: ru
  text: Надменный взгляд человека будет унижен[a], и высокомерие людей будет унижено; один лишь Яхве будет возвышен в тот день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Надменные глаза человека будут унижены». Буквально еврейское выражение говорит о «глазах человеческой надменности» — о гордости, проявляющейся во взгляде и осанке.'
    reason: Лексическая альтернатива и пояснение еврейского образа.
lexical_decisions:
- source_word: עֵינֵי גַּבְהוּת אָדָם
  choice: надменные глаза человека
  rationale: Сохраняет конкретный еврейский образ глаз, выражающих человеческую гордость, и естественно звучит по-русски.
- source_word: שָׁפֵל
  choice: будут опущены
  rationale: Передаёт образ понижения применительно к глазам и пророческую направленность высказывания в будущее.
- source_word: וְשַׁח רוּם אֲנָשִׁים
  choice: и высокомерие людей будет унижено
  rationale: רוּם буквально связано с высотой и возвышенностью, но в сочетании с людьми обозначает их надменность; «будет унижено» сохраняет контраст возвышенного и низведённого.
- source_word: וְנִשְׂגַּב
  choice: будет возвышен
  rationale: Передаёт значение высоты и превознесения и подчёркивает противопоставление унижению человеческой гордости.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לְבַדּוֹ
  choice: один лишь
  rationale: 'Ясно и выразительно передаёт исключительность: возвышен будет Яхве и никто иной.'
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача устойчивой пророческой временной формулы.
theological_decisions:
- issue: Передача אָדָם и אֲנָשִׁים в пророчестве о суде
  choice: человека … людей
  alternative: человечества … смертных
  rationale: Сохраняется смена единственного обобщающего и множественного числа в еврейском тексте, при этом речь естественно понимается как относящаяся ко всем людям, а не только к мужчинам.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Сохраняется личное Божье имя, непосредственно употреблённое в исходном тексте, без подмены титулом.
- issue: Образ человеческой высоты и исключительное возвышение Бога
  choice: высокомерие людей будет унижено; один лишь Яхве будет возвышен
  alternative: возвышенность людей поникнет; только Яхве будет высок
  rationale: 'Перевод сохраняет богословски значимое противопоставление: человеческое самовозвышение низлагается, тогда как возвышенным остаётся только Яхве, не уточняя сверх текста характер «того дня».'
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Сохранены параллелизм, образ глаз и контраст между унижением человеческой надменности и исключительным возвышением Яхве.
