  text: בֵּ֖ית יַעֲקֹ֑ב לְכ֥וּ וְ/נֵלְכָ֖ה בְּ/א֥וֹר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/005.yaml
  text: House of Jacob[a], come[b], and let us walk in the light of Yahweh.
translation:
  language: ru
  text: Дом Иакова[a], придите[b], и пойдём во свете Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «О дом Иакова». Еврейское выражение является прямым обращением к потомкам Иакова.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «идите — и пойдём». Повелительная форма перед когортативом образует призыв к совместному действию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יַעֲקֹב
  choice: Дом Иакова
  rationale: Сочетание стоит в звательной функции и обращено к потомкам Иакова. Буквальный образ «дом» сохраняет пророческий регистр и не требует более толковательного «народ» или «семья».
- source_word: לְכוּ
  choice: придите
  rationale: Форма представляет собой повелительное наклонение множественного числа от הלך. В сочетании с последующим когортативом она служит призывом к совместному действию; русское «придите» естественно вводит приглашение, тогда как формально возможное «идите» здесь звучало бы как удаление от говорящего.
- source_word: וְנֵלְכָה
  choice: и пойдём
  rationale: Когортатив первого лица множественного числа выражает совместное побуждение. «Пойдём» сохраняет и это значение, и метафору хождения, не заменяя её толкованием «будем жить».
- source_word: בְּאוֹר
  choice: во свете
  rationale: Предлог ב допускает значение сферы или средства. «Во свете» сохраняет образ пребывания в Божьем свете и руководстве, не сводя его исключительно к инструментальному «при свете».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте употреблён тетраграмматон, поэтому перевод сохраняет личное имя. Форма «Яхве» передаёт наиболее распространённую научную реконструкцию произношения, не подменяя имя титулом.
- issue: Образ хождения во свете
  choice: 'сохранить метафору: «пойдём во свете»'
  alternative: будем жить, руководствуясь светом
  rationale: 'Исходный текст оставляет образ ёмким: он может включать образ жизни, Божье наставление и руководство. Буквенная метафора сохраняет эту смысловую широту.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис краток и призывен; традиционный библейский образ «во свете» сохранён без излишней архаизации.
