  source_fidelity: 'Основной смысл передан верно: земля Израиля/Иакова заполнена идолами, а люди совершают поклон перед человеческим изделием. Однако «наполнилась» описывает завершившееся событие, тогда как форма в данном пророческом описании выражает наличное состояние («полна», «наполнена»). Кроме того, «делу своих рук» по-русски может означать занятию или труду, а не изготовленному предмету.'
  naturalness: «Земля его» допустима, но несколько тяжеловесна; в сохранённом параллелизме она остаётся понятной. «Земля его полна идолов» естественнее, чем «наполнилась земля его идолами». «Произведению своих рук» ясно называет рукотворный предмет и сохраняет единственное число еврейского מַעֲשֵׂה.
  terminology: '«Идолы» и «поклоняются» точны и соответствуют современному литературному библейскому регистру. Не следует добавлять «собственных» или «ничтожных»: таких усилений в тексте нет.'
