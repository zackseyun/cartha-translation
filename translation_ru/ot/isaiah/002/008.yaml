    rationale: Совершенный прошедший вид представляет наполнение как завершённое событие. В контексте перечисления состояния земли предпочтительно русское статическое «полна идолов», соответствующее смыслу «is filled» и функции формы.
  - severity: medium
    issue: «Делу своих рук» может быть понято как труд или занятие
    rationale: Еврейское מַעֲשֵׂה здесь обозначает сделанное изделие, объект поклонения. «Произведению своих рук» устраняет неуместную двусмысленность без расширения смысла.
  revised_text: И земля его полна идолов; они поклоняются произведению своих рук, тому, что сделали их пальцы.
