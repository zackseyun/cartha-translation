  to: И земля его полна идолов; они поклоняются произведению своих рук, тому, что сделали их пальцы.
  rationale: Исправлены только видо-временная подача первой строки и русская лексическая двусмысленность слова «дело». Коллективное единственное число при «земле его» сохранено; при подлежащем «они» притяжательные формы во второй строке естественно переданы во множественном числе.
