lexical_decisions:
- source_word: וַתִּמָּלֵא
  choice: наполнилась
  rationale: Нифаль глагола מלא выражает состояние, возникшее вследствие наполнения. Русское совершенное прошедшее естественно передаёт еврейскую форму с вау-последовательным и согласуется с рядом пророческих утверждений в контексте.
- source_word: אַרְצוֹ
  choice: земля его
  rationale: Сохранён суффикс 3-го лица мужского рода единственного числа, относящийся к коллективно понимаемому Иакову/народу; постпозиция местоимения придаёт фразе уместное библейское достоинство без неясной сноски.
- source_word: אֱלִילִים
  choice: идолами
  rationale: Стандартный и ясный русский эквивалент; присущий слову уничижительный оттенок не развёрнут дополнительно.
- source_word: יִשְׁתַּחֲווּ
  choice: поклоняются
  rationale: Глагол обозначает поклон или простирание перед кем-либо, часто как акт почитания. «Поклоняются» сохраняет телесный образ и естественно звучит по-русски.
- source_word: לְמַעֲשֵׂה יָדָיו
  choice: делу своих рук
  rationale: Сохраняется конкретный образ человеческого изделия и ирония поклонения собственноручно созданному. Возвратное «своих» естественно соотносится с подлежащим множественного числа.
- source_word: לַאֲשֶׁר עָשׂוּ אֶצְבְּעֹתָיו
  choice: тому, что сделали их пальцы
  rationale: Формально единственный притяжательный суффикс понимается коллективно; множественное «их» согласуется с глаголом «сделали» и не добавляет отсутствующего в источнике усиления «собственные».
theological_decisions:
- issue: Значение действия השתחוה в контексте идолопоклонства
  choice: поклоняются
  alternative: падают ниц; почитают
  rationale: Перевод передаёт конкретный акт поклона и его культовый смысл, не заменяя образ отвлечённым богословским термином.
- issue: Коллективное единственное и переход к множественному
  choice: земля его ... они ... своих рук ... их пальцы
  alternative: их земля ... они ... их руки ... их пальцы; земля его ... его рук ... его пальцы
  rationale: Сохранён примечательный коллективный единственный суффикс при «земле», а действия множества людей и части их тела переданы естественным русским множественным числом. Тем самым не устраняется грамматическое напряжение источника и не создаётся ложное впечатление об одном изготовителе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Параллелизм двух обозначений человеческого изготовления сохранён; пунктуация подчёркивает вторую, поясняющую строку.
