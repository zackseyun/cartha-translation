base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/021.yaml
  text: to enter the caverns of the rocks and the clefts of the crags[a], from before the terror of Yahweh and from the splendor of his majesty[b], when he rises to terrify the earth.
translation:
  language: ru
  text: чтобы войти в пещеры в скалах и в расселины утёсов[a], скрываясь от ужаса перед Яхве и от великолепия Его величия, когда Он восстанет, чтобы привести землю[b] в трепет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в полости скал и трещины утёсов».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «страну».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чтобы навести ужас на землю»; возможен также смысл: «чтобы потрясти землю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא
  choice: чтобы войти
  rationale: 'Инфинитив с ל продолжает синтаксис предыдущего стиха и выражает направленное действие: люди устремляются в скальные укрытия.'
- source_word: נִקְרוֹת הַצֻּרִים
  choice: в пещеры среди скал
  rationale: נִקְרוֹת обозначает природные полости или углубления в скальной породе; «пещеры среди скал» ясно передаёт образ укрытия и естественно звучит по-русски.
- source_word: סְעִפֵי הַסְּלָעִים
  choice: в расселины утёсов
  rationale: В данном геологическом контексте סְעִפֵי указывает на трещины или расщелины, а סְלָעִים — на скалистые утёсы; перевод сохраняет параллелизм, не повторяя слово «скалы».
- source_word: מִפְּנֵי
  choice: скрываясь от
  rationale: Буквально выражение означает удаление «от лица/присутствия». В продолжении движения к укрытию русский деепричастный оборот естественно передаёт бегство от грозного явления Бога, не сводя предлог только к причинному значению.
- source_word: פַּחַד יְהוָה
  choice: от ужаса перед Яхве
  rationale: פַּחַד обозначает сильный страх, ужас. Русская конструкция передаёт человеческую реакцию на явление Яхве, сохраняя связь ужаса с Ним.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: הֲדַר גְּאוֹנוֹ
  choice: от великолепия Его величия
  rationale: 'Сочетание двух близких, но не тождественных слов сохранено: הֲדַר — великолепие, блеск; גָּאוֹן применительно к Богу — возвышенное величие.'
- source_word: בְּקוּמוֹ
  choice: когда Он восстанет
  rationale: Инфинитивная конструкция с בְּ имеет временное значение. «Восстанет» сохраняет торжественный образ Бога, поднимающегося для суда.
- source_word: לַעֲרֹץ
  choice: чтобы привести … в трепет
  rationale: Глагол может означать внушение ужаса или содрогания. «Привести в трепет» сохраняет оба оттенка лучше, чем однозначное «напугать» или чисто физическое «потрясти».
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте всеобщего унижения человеческой гордости вероятен широкий смысл «земля», хотя возможен и территориальный смысл «страна».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит собственное имя Бога; транслитерация сохраняет это отличие от титула אֲדֹנָי.
- issue: Отношение выражения פַּחַד יְהוָה к Яхве
  choice: ужас перед Яхве
  alternative: ужас, исходящий от Яхве
  rationale: Конструкция допускает понимание как ужаса, вызываемого явлением Яхве, так и человеческого ужаса перед Ним. Основной текст выбирает естественную русскую формулировку, не отрицая причинного оттенка.
- issue: Объём значения הָאָרֶץ
  choice: земля
  alternative: страна
  rationale: Контекст Ис 2 подчёркивает всеобщее унижение человечества перед Богом, поэтому предпочтён широкий смысл; лексическая возможность «страна» отмечена.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Стих оформлен как синтаксическое продолжение предыдущего контекста; заглавные местоимения по отношению к Богу использованы в соответствии с принятой русской библейской издательской традицией.
