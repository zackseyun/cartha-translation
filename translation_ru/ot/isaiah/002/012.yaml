  text: כִּ֣י י֞וֹם לַ/יהוָ֧ה צְבָא֛וֹת עַ֥ל כָּל גֵּאֶ֖ה וָ/רָ֑ם וְ/עַ֖ל כָּל נִשָּׂ֥א וְ/שָׁפֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/012.yaml
  text: For Yahweh of Armies has a day against all that is proud and lofty[a], and against all that is lifted up—and it shall be brought low.
translation:
  language: ru
  text: Ибо у Яхве Воинств[a] есть день, направленный против всего гордого и возвышенного, против всего вознесённого — и оно будет низвержено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Господь Саваоф».'
    reason: Лексическая альтернатива для передачи יהוה צבאות.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предыдущего утверждения и сохраняет логическую связь с контекстом.
- source_word: יוֹם לַיהוָה
  choice: у Яхве есть день
  rationale: Естественно передаёт еврейское именное предложение «день у/для Яхве», то есть назначенный Им день суда, не добавляя слова «суд» в основной текст.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יהוה как «Яхве», а צבאות — в его конкретном образе многочисленных сил или воинств, находящихся под властью Бога.
- source_word: עַל
  choice: против
  rationale: В контексте грядущего суда предлог имеет направленное, враждебное значение.
- source_word: גֵּאֶה וָרָם
  choice: гордого и возвышенного
  rationale: Сохраняет сочетание нравственной гордыни и образа высоты, не сводя оба определения к одному значению.
- source_word: נִשָּׂא
  choice: вознесённого
  rationale: Сохраняет образ поднятости и смысл самовозвышения или высокого положения; нейтральная форма позволяет отнести выражение и к людям, и к предметам.
- source_word: וְשָׁפֵל
  choice: и оно будет унижено
  rationale: 'Передаёт глагольную силу формы как итог суда: возвышенное станет низким. Местоимение «оно» согласуется с субстантивированным «всё» и сохраняет широту референции.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация сохраняет явленное личное имя, не заменяя его титулом.
- issue: Передача титула יהוה צבאות
  choice: Яхве Воинств
  alternative: Господь Саваоф
  rationale: Перевод делает значение צבאות понятным современному читателю и сохраняет образ Бога как Повелителя небесных и земных сил; традиционная форма отмечена в сноске.
- issue: Референт выражений «всё гордое… всё вознесённое»
  choice: Сохранена широкая, грамматически нейтральная отнесённость
  alternative: Только гордые люди
  rationale: Еврейские субстантивированные определения допускают широкий охват, а последующие стихи применяют образ высоты как к людям, так и к возвышенным объектам. Перевод не сужает эту намеренную образность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Конструкция «у Яхве… есть день» несколько необычна, но понятна и близко сохраняет лаконичное еврейское именное предложение. Тире подчёркивает итоговое низвержение.
