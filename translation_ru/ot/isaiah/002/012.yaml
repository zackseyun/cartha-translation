revisions:
- from: Ибо у Яхве Воинств[a] есть день против всего гордого и возвышенного, против всего вознесённого — и оно будет унижено.
  to: Ибо у Яхве Воинств[a] есть день, направленный против всего гордого и возвышенного, против всего вознесённого — и оно будет низвержено.
  rationale: Исправлены только естественность выражения направленности «дня» и передача образного низведения в וְשָׁפֵל. Широкая отнесённость субстантивированных определений, имя Яхве, титул «Воинств» и пророческое противопоставление сохранены.
