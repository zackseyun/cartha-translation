base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/004.yaml
  text: And he will judge between the nations and arbitrate for many peoples[a]; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[b], and they will not learn war anymore.
translation:
  language: ru
  text: И будет он судить между народами и будет выносить решения для многих народов[a]. Они перекуют свои мечи на лемехи, а свои копья — на садовые ножи. Не поднимет народ меча на народ, и больше не будут учиться войне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обличит многие народы». Еврейский глагол может означать как вынесение судебного решения, так и исправительное обличение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не будут больше учиться войне»; выражение может включать обучение военному делу.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְשָׁפַט בֵּין הַגּוֹיִם
  choice: будет он судить между народами
  rationale: Сохраняет судебное значение שׁפט и конструкцию בֵּין «между»; местоимение написано со строчной буквы, чтобы не вносить в текст явного отождествления субъекта.
- source_word: וְהוֹכִיחַ לְעַמִּים רַבִּים
  choice: рассудит многие племена
  rationale: В данном параллелизме форма Hiphil от יכח имеет судебно-арбитражный оттенок. «Рассудит» не добавляет отсутствующего в оригинале существительного «споры», а «племена» отличает עַמִּים от предшествующего הַגּוֹיִם.
- source_word: וְכִתְּתוּ חַרְבוֹתָם לְאִתִּים
  choice: перекуют свои мечи на лемехи
  rationale: «Перекуют» естественно передаёт обработку металла, подразумеваемую כתת в образе превращения оружия в земледельческие орудия; «лемехи» — точное и узнаваемое обозначение частей плуга.
- source_word: וַחֲנִיתוֹתֵיהֶם לְמַזְמֵרוֹת
  choice: а свои копья — на садовые ножи
  rationale: מַזְמֵרוֹת обозначает орудия для обрезки растений; «садовые ножи» понятнее современному читателю и точнее функционально, чем традиционное «серпы».
- source_word: לֹא יִשָּׂא גוֹי אֶל גוֹי חֶרֶב
  choice: Не поднимет народ меча на народ
  rationale: Сохраняет образное выражение נשא חרב — поднять меч для враждебного действия — и симметрию еврейской фразы.
- source_word: וְלֹא יִלְמְדוּ עוֹד מִלְחָמָה
  choice: и больше не будут учиться войне
  rationale: Близко передаёт буквальное «не будут более учиться войне», не сужая значение исключительно до военной подготовки.
theological_decisions:
- issue: Кто является субъектом глаголов «будет судить» и «рассудит»
  choice: Сохранить местоименное «он» без прямого называния субъекта
  alternative: «Господь будет судить»
  rationale: В ближайшем контексте субъект соотносится с Господом, однако в самом еврейском стихе имя не повторено. Перевод не устраняет эту грамматическую и контекстуальную недосказанность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Синтаксический параллелизм и образы оригинала сохранены; редкие или архаичные слова сведены к минимуму, за исключением точного и широко узнаваемого «лемехи».
