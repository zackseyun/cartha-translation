id: ISA.2.15
reference: Isaiah 2:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עַ֖ל כָּל מִגְדָּ֣ל גָּבֹ֑הַ וְ/עַ֖ל כָּל חוֹמָ֥ה בְצוּרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/015.yaml
  text: and against every high tower[a], and against every fortified wall—
translation:
  language: ru
  text: и против всякой высокой башни[a], и против всякой укреплённой стены —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и на всякую высокую башню, и на всякую укреплённую стену». Еврейский предлог буквально может означать «на», но здесь, в контексте суда, имеет смысл «против».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: и против
  rationale: Повторяющееся וְעַל продолжает перечень того, против чего направлен день Господа в контексте Ис 2:12–16. «Против» естественно передаёт здесь враждебную направленность, тогда как более буквальное «на» сохранено в сноске.
- source_word: כָּל
  choice: всякой
  rationale: 'При существительных в единственном числе כָּל имеет распределительное значение: речь идёт о каждой башне и каждой стене данного рода.'
- source_word: מִגְדָּל גָּבֹהַ
  choice: высокой башни
  rationale: Прямой и естественный перевод, сохраняющий физический смысл высоты и не устраняющий тематическую связь с человеческим превозношением в главе.
- source_word: חוֹמָה בְצוּרָה
  choice: укреплённой стены
  rationale: חוֹמָה обозначает стену, а בְצוּרָה — защищённую, укреплённую; сочетание ясно передаёт оборонительный смысл.
theological_decisions:
- issue: Подразумеваемое продолжение суда Божьего
  choice: Передать עַל как «против», обозначив объекты суда.
  alternative: Перевести формально как «на» и оставить направленность суда контексту.
  rationale: В Ис 2:12–16 эти предложные обороты образуют поэтический перечень всего, против чего приходит день Господа. «Против» выражает уже присутствующий в контексте смысл, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский язык; сохранены поэтический параллелизм, повтор «и против всякой» и незавершённость строки как части более широкого перечня. Форма «укреплённой» дана с буквой ё для однозначного современного чтения.
