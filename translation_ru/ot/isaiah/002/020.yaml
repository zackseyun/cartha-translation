  text: בַּ/יּ֤וֹם הַ/הוּא֙ יַשְׁלִ֣יךְ הָ/אָדָ֔ם אֵ֚ת אֱלִילֵ֣י כַסְפּ֔/וֹ וְ/אֵ֖ת אֱלִילֵ֣י זְהָב֑/וֹ אֲשֶׁ֤ר עָֽשׂוּ ל/וֹ֙ לְ/הִֽשְׁתַּחֲוֺ֔ת לַ/חְפֹּ֥ר פֵּר֖וֹת וְ/לָ/עֲטַלֵּפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/020.yaml
  text: In that day man will throw away his idols of silver and his idols of gold[a], which they made for him to bow down to[c][b], to the moles and to the bats.
translation:
  language: ru
  text: В тот день человек выбросит своих серебряных и золотых идолов, которых ему сделали, чтобы он им поклонялся, — кротам[a] и летучим мышам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение неясно; вероятно, имеются в виду кроты или другие роющие животные.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественно передаёт стандартную пророческую временную формулу, сохраняя её торжественное звучание.
- source_word: יַשְׁלִיךְ
  choice: выбросит
  rationale: Форма породы hифиль от שלך обозначает бросание; в данном контексте глагол также выражает решительный отказ от идолов.
- source_word: הָאָדָם
  choice: человек
  rationale: Единственное число сохранено; здесь слово имеет обобщённое значение и представляет человечество в лице человека.
- source_word: אֱלִילֵי כַסְפּוֹ וְאֵת אֱלִילֵי זְהָבוֹ
  choice: своих серебряных и золотых идолов
  rationale: Такой порядок слов естественен для современного русского языка; притяжательное «своих» относится к обоим видам идолов.
- source_word: אֲשֶׁר עָשׂוּ לוֹ
  choice: которых ему сделали
  rationale: Неопределённо-личная русская конструкция сохраняет множественное число еврейского глагола, не вводя прямо не названных в тексте ремесленников.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: чтобы он им поклонялся
  rationale: Передаёт целевое значение инфинитива и культовый смысл земного поклона; местоимение «он» соотнесено с обобщённым словом «человек».
- source_word: לַחְפֹּר פֵּרוֹת
  choice: кротам
  rationale: Традиционное контекстуальное понимание трудного еврейского выражения как названия роющих животных; неопределённость отмечена в сноске.
- source_word: וְלָעֲטַלֵּפִים
  choice: и летучим мышам
  rationale: Прямое и общепринятое соответствие еврейскому названию летучих мышей.
theological_decisions:
- issue: Обобщённое значение הָאָדָם
  choice: «человек» как представитель человечества
  alternative: «люди» или «человечество»
  rationale: Еврейский текст употребляет обобщённое единственное число. Русское «человек» звучит естественно и сохраняет исходную грамматическую форму, не ограничивая смысл одним конкретным лицом.
- issue: Характер действия לְהִשְׁתַּחֲוֺת
  choice: «поклонялся»
  alternative: «падал перед ними ниц»
  rationale: В контексте идолов речь идёт о культовом поклонении, однако перевод не добавляет более узкого конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой торжественности. Синтаксис сделан ясным для обычного читателя, но обобщённое единственное число и неопределённый деятель глагола «сделали» сохранены. Тире подчёркивает конечное место, куда будут выброшены идолы, и предотвращает ошибочное присоединение названий животных к цели поклонения.
