  source_fidelity: 'Перевод точно передаёт последовательность и основные образы еврейского текста: вход в два вида укрытий, бегство перед ужасом Яхве и великолепием Его величия, а также Его восстание, повергающее землю в трепет. «Спасаясь от» является естественной русской передачей מִפְּנֵי в данном контексте и не меняет смысла. «В норы в земле» несколько обобщает буквальное «в прахе», однако буквальный образ надлежащим образом сохранён в сноске.'
