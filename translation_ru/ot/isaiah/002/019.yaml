  terminology: «Яхве» последовательно передаёт тетраграмматон согласно предоставленному аудиторскому решению. «Великолепие Его величия» сохраняет усиленную пару הָדָר / גָּאוֹן. «Привести землю в трепет» адекватно передаёт לַעֲרֹץ без доктринального или излишне конкретного истолкования.
