id: ISA.2.19
reference: Isaiah 2:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בָ֨אוּ֙ בִּ/מְעָר֣וֹת צֻרִ֔ים וּ/בִ/מְחִלּ֖וֹת עָפָ֑ר מִ/פְּנֵ֞י פַּ֤חַד יְהוָה֙ וּ/מֵ/הֲדַ֣ר גְּאוֹנ֔/וֹ בְּ/קוּמ֖/וֹ לַ/עֲרֹ֥ץ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/019.yaml
  text: And they will enter the caves of the rocks and the holes of the dust from before the terror of Yahweh and from the splendor of his majesty[a], when he rises to terrify the earth.
translation:
  language: ru
  text: И войдут они в пещеры среди скал и в норы в земле[a], спасаясь от ужаса, который внушает Яхве, и от великолепия Его величия, когда Он восстанет, чтобы привести землю в трепет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в норы в прахе»; также возможно: «в отверстия в земле».'
    reason: Лексема מְחִלּוֹת и сочетание с עָפָר допускают образы нор, отверстий или подземных укрытий в пыли либо земле.
lexical_decisions:
- source_word: וּבָאוּ
  choice: И войдут они
  rationale: В пророческом контексте форма обозначает будущее последовательное действие; значение «войдут» естественно передаёт движение в укрытия, заданное следующими сочетаниями с בְּ.
- source_word: בִּמְעָרוֹת צֻרִים
  choice: в пещеры среди скал
  rationale: Передаёт מְעָרוֹת как «пещеры», а צֻרִים как «скалы, утёсы»; по-русски это естественнее буквального «в пещеры скал».
- source_word: וּבִמְחִלּוֹת עָפָר
  choice: и в норы в земле
  rationale: מְחִלּוֹת обозначает отверстия, норы или подземные убежища; עָפָר буквально означает «пыль, прах», но здесь сочетание указывает на укрытия в рыхлой земле. Буквальный образ сохранён в сноске.
- source_word: מִפְּנֵי
  choice: спасаясь от
  rationale: Идиома буквально означает «от лица/присутствия». В данном контексте она описывает бегство и укрытие; «спасаясь от» ясно передаёт направленность действия без неестественной русской кальки.
- source_word: פַּחַד יְהוָה
  choice: ужаса, который внушает Яхве
  rationale: פַּחַד здесь означает не благоговейный страх, а ужас перед Божьим судом. Развёрнутая конструкция устраняет возможное ошибочное понимание «ужаса Яхве» как ужаса, испытываемого Им.
- source_word: וּמֵהֲדַר גְּאוֹנוֹ
  choice: и от великолепия Его величия
  rationale: 'Сохраняет два взаимно усиливающих существительных: הָדָר — «великолепие, блеск», גָּאוֹן — «величие, возвышенность».'
- source_word: בְּקוּמוֹ
  choice: когда Он восстанет
  rationale: Инфинитивная конструкция с בְּ имеет временное значение; «восстанет» передаёт торжественное выступление Бога на суд.
- source_word: לַעֲרֹץ
  choice: чтобы привести … в трепет
  rationale: Глагол выражает причинение ужаса и содрогания. Такой перевод сохраняет телесно-эмоциональный оттенок и избегает повтора слова «ужас».
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте всеохватного Божьего суда הָאָרֶץ естественно понимать как землю, а не только отдельную страну.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст прямо употребляет тетраграмматон; форма «Яхве» сохраняет личное заветное имя и согласуется с указанным решением консультационного слоя.
- issue: Субъект ужаса в выражении פַּחַד יְהוָה
  choice: ужас, который внушает Яхве
  alternative: ужас Яхве
  rationale: Контекст представляет Яхве источником ужаса для скрывающихся людей, а не тем, кто Сам испытывает ужас. При этом не добавляется объяснение причин или характера суда.
- issue: Значение לַעֲרֹץ при Божьем восстании
  choice: привести землю в трепет
  alternative: ужаснуть землю
  rationale: Сохраняется образ Божьего явления на суд, вызывающего ужас и содрогание, без уточнения конкретного способа суда.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан естественным для обычного читателя; параллелизм двух укрытий и двух причин бегства сохранён. Местоимения, относящиеся к Богу, написаны с прописной буквы как регистровое решение.
