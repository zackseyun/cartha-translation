  yaml_path: translation/ot/isaiah/002/009.yaml
  text: So man is bowed down[a], and each person is brought low; do not forgive them.
translation:
  language: ru
  text: И человек склонился, и каждый унижен; не прощай им[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не поднимай их». Еврейский глагол может означать «поднимать, нести, брать на себя», а в некоторых контекстах — «прощать».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשַּׁח
  choice: склонился
  rationale: Глагол передаёт наклонение вниз и в данном контексте может подразумевать как поклонение, так и унижение. «Склонился» сохраняет эту образность и не уточняет без необходимости, добровольно ли человек преклонился или был унижен.
- source_word: אָדָם
  choice: человек
  rationale: Обобщённое «человек» естественно передаёт обозначение человечества и сохраняет параллелизм с последующим אִישׁ.
- source_word: וַיִּשְׁפַּל
  choice: унизился
  rationale: Форма от שׁפל означает стать низким, быть униженным. «Унизился» кратко передаёт понижение положения и поддерживает поэтический параллелизм.
- source_word: אִישׁ
  choice: всякий
  rationale: В параллели с אָדָם слово указывает на отдельного человека. «Всякий» естественно выражает распределительный смысл, не создавая тяжеловесного повтора «человек… человек».
- source_word: וְאַל תִּשָּׂא לָהֶם
  choice: не прощай им
  rationale: В сочетании с обозначением лица נשא может означать прощение, то есть снятие или несение вины. В контексте суда это наиболее вероятный смысл, однако буквальный образ «поднимать» остаётся возможным и вынесен в примечание.
theological_decisions:
- issue: Значение נשא в заключительной просьбе
  choice: просьба не прощать людей
  alternative: просьба не поднимать и не возвышать их
  rationale: Контекст суда над идолопоклонством и человеческой гордыней поддерживает значение «не прощай». Вместе с тем многозначность еврейского глагола допускает смысл «не поднимай», поэтому этот вариант сохранён в примечании, а богословское напряжение не устранено.
translation_notes:
  register: Современный литературный русский язык; краткий и торжественный поэтический строй. Параллелизм двух полустиший сохранён, а неоднозначность первого глагола и заключительного נשא не сглажена.
