source:
  edition: WLC
  text: וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הִנֵּ֨ה אֱלֹהֵ֥י/נוּ זֶ֛ה קִוִּ֥ינוּ ל֖/וֹ וְ/יֽוֹשִׁיעֵ֑/נוּ זֶ֤ה יְהוָה֙ קִוִּ֣ינוּ ל֔/וֹ נָגִ֥ילָה וְ/נִשְׂמְחָ֖ה בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/009.yaml
  text: And it will be said on that day[a], “Behold, this is our God; we have waited for him, that he might save us. This is Yahweh; we have waited for him. Let us rejoice and be glad in his salvation.”
translation:
  language: ru
  text: 'И в тот день скажут: «Вот наш Бог! Мы ждали Его, и Он спасёт нас. Это Яхве[a]; мы ждали Его. Будем ликовать и радоваться Его спасению!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское личное имя Бога — יהוה (YHWH); в этом переводе оно передано как «Яхве». Во многих переводах вместо него употребляется «Господь».
    reason: Пояснение передачи божественного имени и традиционной альтернативы.
lexical_decisions:
- source_word: וְאָמַר
  choice: И … скажут
  rationale: Еврейская форма буквально стоит в 3-м лице единственного числа, но субъект не назван. Русская неопределённо-личная конструкция естественно передаёт безлично-коллективный смысл, не вводя конкретного говорящего.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчивое и естественное соответствие пророческой временной формуле.
- source_word: הִנֵּה אֱלֹהֵינוּ זֶה
  choice: Вот Он, наш Бог!
  rationale: «Вот» сохраняет указательную и торжественную силу הִנֵּה, а местоимение «Он» естественно выражает распознавание, передаваемое זֶה.
- source_word: קִוִּינוּ לוֹ
  choice: мы ждали Его
  rationale: קוה обозначает ожидание, проникнутое надеждой. «Ждали Его» сохраняет прежде всего образ ожидания и личный объект, не сводя выражение только к отвлечённому упованию.
- source_word: וְיוֹשִׁיעֵנוּ
  choice: и Он спасёт нас
  rationale: 'Форма Hiphil от ישׁע с суффиксом 1-го лица множественного числа естественно означает будущее действие: «Он спасёт нас». Союз передан сочинительно, без превращения фразы в однозначное придаточное цели.'
- source_word: זֶה יְהוָה
  choice: Это Яхве
  rationale: Указательное местоимение передаёт торжественное узнавание, а личное имя יְהוָה транслитерировано как «Яхве».
- source_word: נָגִילָה וְנִשְׂמְחָה
  choice: Будем ликовать и радоваться
  rationale: Когортативные формы выражают совместное побуждение. Такая русская конструкция естественно сохраняет призыв и праздничную эмоциональную силу.
- source_word: בִּישׁוּעָתוֹ
  choice: Его спасению
  rationale: ישׁוּעָה означает спасение или избавление; предложное управление русского глагола «радоваться» естественно передаёт смысл еврейского בְּ в данном контексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо употреблено личное имя Бога. Транслитерация сохраняет различие между именем יְהוָה и титулом אֲדֹנָי, не добавляя конфессионального толкования.
- issue: Связь ожидания со спасением во фразе קִוִּינוּ לוֹ וְיוֹשִׁיעֵנוּ
  choice: «мы ждали Его, и Он спасёт нас»
  alternative: «мы ждали Его, чтобы Он спас нас»
  rationale: Еврейский союз допускает контекстуальное смысловое сближение ожидания и ожидаемого спасения, однако грамматически не требует целевого придаточного. Сочинительная передача сохраняет напряжение между надеждой и обещанным действием Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной пророческой интонацией. Синтаксис сделан ясным для широкого читателя; сохранены повтор «мы ждали Его», указательная выразительность и совместный призыв к радости.
