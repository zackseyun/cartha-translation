  source_fidelity: 'Первая половина точно сохраняет образ: олицетворённый Моав простирает руки «посреди него», словно пловец. Во второй половине еврейский текст не называет субъекта, тогда как объект «его гордость» естественно относится к Моаву; поэтому вероятная смена на Господа допустима, но её нельзя выдавать за явное указание оригинала. Выражение אָרְבוֹת יָדָיו трудно; «ухищрения» возможно, но несколько чрезмерно закрепляет отрицательную окраску. «Искусство его рук» более нейтрально и позволяет сохранить спорность в сноске.'
  naturalness: «Раcкинет руки» и «пловец раскидывает их, чтобы плыть» естественны в современном литературном русском. Строчная буква во втором «он» снимает типографическое навязывание божественного референта; сноска сообщает наиболее вероятное контекстуальное понимание.
  terminology: «Низложит» соответствует образу низведения, однако в современной русской речи несколько архаично. «Унизит» ясно передаёт Hiphil שׁפל в контексте гордости, но ослабляет пространственный образ. Сохраняю «низложит» как уместное для возвышенного пророческого регистра. «Искусство его рук» не решает спорный смысл אָרְבוֹת односторонне; возможные «ухищрения», «уловки» и «ловкость» вынесены в сноску.
