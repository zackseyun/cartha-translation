base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/011.yaml
  text: And he will spread out his hands in its midst as a swimmer spreads them out to swim[a], and he will bring down his pride along with the skill of his hands.
translation:
  language: ru
  text: И он раскинет руки посреди него, как пловец раскидывает их, чтобы плыть; и он[a] низложит его гордость вместе с искусством его рук.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте субъект прямо не назван. Вероятнее всего, в первой части изображён Моав, раскидывающий руки, словно пловец, а во второй — Господь, низлагающий его гордость. Возможны и другие способы соотнести местоимения.
    reason: Сохранение синтаксической и референциальной неоднозначности оригинала.
  - marker: b
    text: 'Или: «с ухищрениями его рук», «с ловкостью его рук», «с искусными приёмами его рук». Еврейское выражение неясно и может подразумевать коварные уловки или искусные действия.'
    reason: Лексическая неопределённость редкого выражения אָרְבוֹת יָדָיו.
lexical_decisions:
- source_word: וּפֵרַשׂ יָדָיו
  choice: он раскинет руки
  rationale: Глагол פרשׂ означает «раскинуть, простереть». В образе пловца современное русское «раскинет руки» звучит естественно и сохраняет телесную образность еврейского текста.
- source_word: בְּקִרְבּוֹ
  choice: посреди него
  rationale: Местоименный суффикс мужского рода единственного числа, вероятнее всего, отсылает к Моаву из ближайшего контекста. Формулировка не подменяет местоимение явным толкованием.
- source_word: כַּאֲשֶׁר יְפָרֵשׂ הַשֹּׂחֶה לִשְׂחוֹת
  choice: как пловец раскидывает руки, чтобы плыть
  rationale: Субстантивированное причастие הַשֹּׂחֶה передано словом «пловец», а инфинитив לִשְׂחוֹת — придаточным цели. Повтор глагола сохранён как часть яркого сравнения.
- source_word: וְהִשְׁפִּיל
  choice: и Он низложит
  rationale: Hiphil от שׁפל обозначает действие «сделать низким, низложить, унизить». «Низложит» сохраняет образ ниспровержения приговора. Заглавная буква отражает вероятную смену субъекта на Господа, но неоднозначность отмечена в сноске.
- source_word: גַּאֲוָתוֹ
  choice: его гордость
  rationale: В контексте суда גַּאֲוָה обозначает надменную гордость Моава. Местоимение сохранено, чтобы не вводить имя повторно.
- source_word: עִם
  choice: вместе с
  rationale: Предлог соединяет гордость с тем, что также будет низложено; «вместе с» ясно передаёт эту связь.
- source_word: אָרְבוֹת יָדָיו
  choice: ухищрениями его рук
  rationale: Редкое и трудное выражение, вероятно, указывает на искусные замыслы, уловки или приёмы. «Ухищрения его рук» соответствует отрицательному контексту и сохраняет конкретное упоминание рук; иные оттенки приведены в сноске.
theological_decisions:
- issue: Кто действует в двух частях стиха
  choice: 'В первой части местоимение «он» понимается как олицетворённый Моав, а во второй наиболее вероятна смена субъекта: Господь низлагает гордость Моава.'
  alternative: Обе глагольные формы можно формально отнести к одному субъекту; некоторые понимают Господа как субъекта уже первой части либо Моав как субъекта всего стиха.
  rationale: Еврейские формы стоят в третьем лице мужского рода единственного числа и сами по себе не называют субъекта. Образ пловца среди попираемого Моава естественно относится к Моаву, тогда как низложение его гордости по контексту совершает Господь. Смена субъекта без явного существительного типична для напряжённой пророческой поэзии; сноска сохраняет реальную неоднозначность.
- issue: Значение אָרְבוֹת יָדָיו
  choice: «ухищрения его рук»
  alternative: «ловкость его рук», «искусные приёмы его рук», «козни его рук»
  rationale: Лексема спорна и может обозначать как искусность, так и коварные приёмы. Контекст суда над гордыней благоприятствует отрицательному оттенку, но перевод не усиливает его до однозначных «козней»; альтернативы указаны в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повтор «раскинет/раскидывает» сохраняет риторику оригинала; «низложит» передаёт судебный и пространственный образ, не сводя действие лишь к внутреннему смирению. Заглавное «Он» различает вероятного божественного субъекта второй части, а сноска предупреждает, что еврейский текст допускает неоднозначность.
