base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/006.yaml
  text: And Yahweh of Armies will make on this mountain for all the peoples a feast of rich food[a], a feast of aged wine—rich food full of marrow, aged wine well refined.
translation:
  language: ru
  text: И приготовит Яхве Воинств на этой горе для всех народов пир с изысканными яствами[a], пир с выдержанным вином — яствами, богатыми костным мозгом, вином, тщательно очищенным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пир из жирных кушаний… пир из вина на осадке». Эти еврейские образы подчёркивают изобилие, зрелость и роскошь угощения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: И приготовит
  rationale: В контексте пира עשה естественно передаётся глаголом «приготовит»; он сохраняет конкретное действие и по-русски звучит естественнее буквального «сделает пир».
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией «Яхве», а צבאות — прозрачным словом «Воинств», без замены имени титулом и без добавления отсутствующих в еврейском тексте слов.
- source_word: לְכָל הָעַמִּים
  choice: для всех народов
  rationale: Множественное עמים обозначает совокупность различных народов; русский оборот сохраняет как множественность, так и всеобщий охват.
- source_word: בָּהָר הַזֶּה
  choice: на этой горе
  rationale: Это естественная русская передача местного значения предлога ב при слове «гора»; указательное местоимение сохранено.
- source_word: מִשְׁתֵּה
  choice: пир
  rationale: Слово обозначает пиршество, в том числе с вином; «пир» кратко и уместно охватывает обе части параллельной конструкции.
- source_word: שְׁמָנִים
  choice: изысканные яства
  rationale: Буквально речь о «жирных» кушаньях — древнем образе обилия и высшего качества. «Изысканные яства» естественно передаёт положительную оценку, а буквальный образ отмечен в сноске.
- source_word: שְׁמָרִים
  choice: выдержанные вина
  rationale: Буквально «осадки, дрожжи»; в данном положительном пиршественном контексте имеются в виду вина, выдержанные на осадке. Выбор сохраняет значение зрелости и высокого качества.
- source_word: מְמֻחָיִם
  choice: богатых костным мозгом
  rationale: Сохраняется яркий образ отборных кусков с обилием костного мозга, не сводя его к общей характеристике «сытные».
- source_word: מְזֻקָּקִים
  choice: тщательно процеженных
  rationale: Причастие выражает очищение или осветление вина. «Процеженных» конкретно передаёт удаление осадка, а наречие отражает усилительный оттенок качественной обработки.
theological_decisions:
- issue: Всеобщий охват пира
  choice: для всех народов
  alternative: для всех наций
  rationale: «Народов» сохраняет множественное число עמים и видение пира, предназначенного не одному Израилю, не развивая эту мысль за пределы сказанного в стихе.
- issue: Передача божественного имени и титула
  choice: Яхве Воинств
  alternative: Господь Саваоф
  rationale: Выбранная форма сохраняет личное имя יהוה и переводит значение צבאות, не подменяя имя традиционным титулом и не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным звучанием. Параллелизм еврейской строки и повтор слова «пир» сохранены; архаичные «тучные яства» и «вино на дрожжах» вынесены из основного текста в пояснение.
