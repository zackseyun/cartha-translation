base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/001.yaml
  text: O Yahweh[a], you are my God; I will exalt you; I will praise your name, for you have done wonderful things, plans formed long ago, faithful and sure.
translation:
  language: ru
  text: 'Яхве, Ты — мой Бог! Я превознесу Тебя, буду славить Твоё имя, ибо Ты совершил чудо: замыслы издавна — верность и твёрдость.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст краток и поэтичен. Буквально: «чудо; замыслы издавна, верность, твёрдость». «Издавна» может указывать на давность Божьих замыслов; заключительные слова могут характеризовать их как надёжные и непреложные.'
    reason: Сохраняет лексическую и синтаксическую неоднозначность פֶּלֶא, מֵרָחוֹק и אֱמוּנָה אֹמֶן, не вводя в основной текст отсутствующий глагол.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, принятой современной русской транслитерацией.
- source_word: אֱלֹהַי
  choice: мой Бог
  rationale: Существительное с суффиксом первого лица единственного числа прямо выражает принадлежность.
- source_word: אֲרוֹמִמְךָ
  choice: Я превознесу Тебя
  rationale: Глагол от רום здесь означает возвеличивание Бога в хвале; «превознесу» естественно для возвышенного русского стиля.
- source_word: אוֹדֶה שִׁמְךָ
  choice: буду славить Твоё имя
  rationale: ידה в данной форме выражает хвалу или благодарение; упоминание имени сохранено, как в еврейском тексте.
- source_word: כִּי עָשִׂיתָ פֶּלֶא
  choice: потому что Ты совершил дивные дела
  rationale: Единственное פֶּלֶא допускает собирательное понимание; множественное «дивные дела» естественно передаёт чудесные деяния Бога, не ограничивая смысл одним событием.
- source_word: עֵצוֹת מֵרָחוֹק
  choice: замыслы, задуманные издревле
  rationale: עֵצוֹת означает решения или замыслы, а מֵרָחוֹק в этом контексте естественно указывает на временную отдалённость. Добавленное «задуманные» ясно связывает давность именно с замыслами.
- source_word: אֱמוּנָה אֹמֶן
  choice: верные и надёжные
  rationale: Два близких существительных обозначают верность, твёрдость и достоверность. В русском тексте они переданы прилагательными, характеризующими древние Божьи замыслы и сохраняющими обе смысловые стороны.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога; «Яхве» сохраняет его как имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Значение מֵרָחוֹק при עֵצוֹת
  choice: 'временное: «задуманные издревле»'
  alternative: 'пространственное: «замыслы издалека»'
  rationale: Контекст исполнения ранее установленных Божьих решений поддерживает временное значение, хотя буквальная пространственная образность остаётся возможной и отмечена в сноске.
- issue: Синтаксическая функция אֱמוּנָה אֹמֶן
  choice: 'характеристика замыслов: «верные и надёжные»'
  alternative: 'два самостоятельных существительных: «верность и твёрдость»; усилительное выражение: «в совершенной верности»'
  rationale: Краткий поэтический еврейский оборот допускает несколько связей. Основной перевод естественно относит качества к древним замыслам, а сноска сохраняет более буквальное чтение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным молитвенно-поэтическим звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы по устойчивой русской религиозной традиции; синтаксис сделан плавным без устранения отмеченной в сноске неоднозначности.
