source:
  edition: WLC
  text: עַל כֵּ֖ן יְכַבְּד֣וּ/ךָ עַם עָ֑ז קִרְיַ֛ת גּוֹיִ֥ם עָרִיצִ֖ים יִירָאֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/003.yaml
  text: Therefore a strong people will honor you[c][b][a]; a city of ruthless nations will fear you.
translation:
  language: ru
  text: Поэтому сильный народ[a] будет чтить Тебя, а город безжалостных народов[b] будет бояться Тебя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могучий народ»; еврейское прилагательное может обозначать силу, могущество или свирепость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «город безжалостных племён». Еврейское сочетание сжато и может описывать город, принадлежащий безжалостным народам или отличающийся их безжалостностью.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будет благоговеть перед Тобой». Глагол может выражать страх, почтение или благоговение — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод или следствие из описанных выше Божьих деяний кратко и естественно.
- source_word: יְכַבְּדוּךָ
  choice: будет чтить Тебя
  rationale: Пиэль глагола כבד означает «чтить, прославлять». «Чтить» сохраняет параллель с «бояться» и не придаёт выражению излишне узкого богослужебного смысла.
- source_word: עַם עָז
  choice: сильный народ
  rationale: Прилагательное עַז может обозначать силу, могущество или свирепость. «Сильный» — наиболее широкая и наименее интерпретирующая передача.
- source_word: קִרְיַת גּוֹיִם עָרִיצִים
  choice: город безжалостных народов
  rationale: Сжатая конструкция может обозначать город, принадлежащий безжалостным народам либо характеризуемый ими. Буквенный образ и неоднозначность связи сохранены.
- source_word: יִירָאוּךָ
  choice: будет бояться Тебя
  rationale: Глагол ירא выражает страх, почтение или благоговение. Прямая передача «бояться» сохраняет силу контекста суда и допускает оттенок благоговения.
theological_decisions:
- issue: Характер отклика могущественных и жестоких народов на Бога
  choice: Стих говорит, что они будут чтить и бояться Бога, не уточняя, идёт ли речь о добровольном поклонении, вынужденном подчинении или о сочетании того и другого.
  alternative: Истолковать слова либо как искреннее обращение народов к поклонению, либо исключительно как их ужас и вынужденное подчинение после суда.
  rationale: Еврейские глаголы допускают почтение и благоговение, возникшие вследствие признания Божьей силы, но внутреннее состояние людей здесь прямо не определено; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Союз «а» делает параллелизм двух частей естественным по-русски, не превращая его в смысловое противопоставление. Местоимение, обращённое к Богу, написано с прописной буквы согласно распространённой русской библейской традиции.
