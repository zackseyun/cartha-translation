  yaml_path: translation/ot/isaiah/025/007.yaml
  text: And on this mountain he will swallow up the covering that covers all peoples[b][a], and the veil that is spread over all nations.
translation:
  language: ru
  text: И на этой горе Он поглотит покрывало, покрывающее все народы,[a] и завесу, простёртую над всеми народами.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «саван, окутывающий все народы». В еврейском тексте употреблены однокоренные слова, обозначающие покров и окутывание.'
    reason: lexical_alternative
  - marker: b
    text: Образ покрывала или завесы, вероятно, предваряет сказанное в следующем стихе о поглощении смерти, но может шире указывать на устранение того, что лежит над всеми народами.
    reason: cross_reference
lexical_decisions:
- source_word: וּבִלַּע
  choice: Он поглотит
  rationale: Сохраняет буквальный и яркий образ глагола בלע («поглощать, проглатывать») и его связь со следующим стихом, где Бог поглощает смерть.
- source_word: בָּהָר הַזֶּה
  choice: на этой горе
  rationale: Естественная русская передача локативного сочетания; гора в контексте указывает на Сион.
- source_word: פְּנֵי הַלּוֹט הַלּוֹט
  choice: покрывало, покрывающее
  rationale: Передаёт сочетание существительного и однокоренной формы от לוט, сохраняя повтор корня в естественной русской конструкции. פְּנֵי не выделено отдельным словом, поскольку здесь относится к поверхности покрывала и отдельное «лицо» затемнило бы смысл.
- source_word: עַל כָּל הָעַמִּים
  choice: все народы
  rationale: עַמִּים передано как «народы»; значение עַל включено в глагольную конструкцию «покрывающее».
- source_word: וְהַמַּסֵּכָה
  choice: и завесу
  rationale: В параллелизме с покрывалом מַסֵּכָה обозначает не литое изображение, а нечто закрывающее; «завеса» сохраняет образ и отличает вторую строку от первой.
- source_word: הַנְּסוּכָה
  choice: простёртую
  rationale: Передаёт пассивный образ чего-то раскинутого или разостланного над людьми; литературно и понятно по-русски.
- source_word: עַל כָּל הַגּוֹיִם
  choice: над всеми племенами
  rationale: «Племенами» позволяет сохранить поэтическое различие между עַמִּים и גּוֹיִם, не повторяя «народы»; слово здесь обозначает совокупность этнических общностей, а не обязательно политические государства.
theological_decisions:
- issue: Смысл покрывала и завесы
  choice: В основном тексте сохранён широкий метафорический образ покрова над всем человечеством.
  alternative: Погребальный саван, духовная слепота или бесчестие.
  rationale: Следующий стих связывает образ со смертью, однако сам стих 7 не определяет покрытие однозначно. Перевод не сужает намеренно широкую метафору.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Однокоренной повтор «покрывало, покрывающее» воспроизводит еврейский приём; «поглотит» сохраняет ключевую метафору и межстиховую связь.
