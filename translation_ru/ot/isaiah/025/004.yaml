source:
  edition: WLC
  text: כִּֽי הָיִ֨יתָ מָע֥וֹז לַ/דָּ֛ל מָע֥וֹז לָ/אֶבְי֖וֹן בַּ/צַּר ל֑/וֹ מַחְסֶ֤ה מִ/זֶּ֨רֶם֙ צֵ֣ל מֵ/חֹ֔רֶב כִּ֛י ר֥וּחַ עָרִיצִ֖ים כְּ/זֶ֥רֶם קִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/004.yaml
  text: For you have been a stronghold to the poor[a], a stronghold to the needy in his distress, a refuge from the storm, a shade from the heat[b]; for the breath of the ruthless is like a storm against a wall.
translation:
  language: ru
  text: 'Ведь Ты был оплотом для слабого,

    оплотом для бедного в его беде,

    укрытием от ливня,

    тенью от зноя;

    ведь дыхание жестоких[a] —

    словно ливень, хлещущий по стене[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «порыв жестоких» либо «натиск жестоких». Еврейское רוּחַ может означать «дыхание», «ветер» или «порыв».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение кратко и допускает переводы: «словно буря у стены», «словно ливень на стену» или «словно буря, бьющая в стену».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  choice: оплот
  rationale: Передаёт образ надёжной защиты и позволяет сохранить двукратный повтор еврейского слова в поэтическом параллелизме.
- source_word: דָּל
  choice: слабый
  rationale: Здесь слово обозначает социально уязвимого, бессильного человека; такой перевод сохраняет отличие от следующего אֶבְיוֹן.
- source_word: אֶבְיוֹן
  choice: бедный
  rationale: Естественно обозначает нуждающегося и сохраняет смысловое соседство, но не полное совпадение с דָּל.
- source_word: בַּצַּר לוֹ
  choice: в его беде
  rationale: Кратко и естественно передаёт состояние стеснения или бедствия, сохраняя местоименное указание на бедного.
- source_word: מַחְסֶה
  choice: укрытие
  rationale: Сохраняет конкретный образ защиты от непогоды и отличает это слово от повторённого מָעוֹז.
- source_word: זֶרֶם
  choice: ливень
  rationale: В обоих случаях поддерживает единый образ сильного, обрушивающегося потока дождя; возможное более широкое значение «буря» отмечено в примечании к трудной заключительной строке.
- source_word: צֵל
  choice: тень
  rationale: Обычное и ясное обозначение спасительной прохлады и защиты от палящего жара.
- source_word: חֹרֶב
  choice: зной
  rationale: В сочетании с «тенью» контекст требует значения палящего жара, а не засухи как продолжительного явления.
- source_word: רוּחַ
  choice: дыхание
  rationale: Сохраняет основной лексический образ и намеренную многозначность слова, которое здесь также может означать ветер, порыв или натиск.
- source_word: עָרִיצִים
  choice: жестокие
  rationale: Передаёт насильственный, притесняющий характер этих людей, не сужая значение до политических тиранов.
- source_word: קִיר
  choice: стена
  rationale: Сохраняет прямое значение слова и конкретный образ ливня, ударяющего в стену.
theological_decisions:
- issue: Метафорическое изображение Божьей защиты
  choice: Сохранить конкретные образы оплота, укрытия и тени без поясняющего богословского расширения.
  alternative: Передать образы отвлечённо как духовное утешение или спасение.
  rationale: Еврейский текст изображает Божью заботу об уязвимых через поэтические образы физической защиты; доктринальная конкретизация вышла бы за пределы сказанного.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Короткие строки сохраняют параллелизм и нарастающую последовательность защитных образов. Обращение к Богу оформлено с прописной буквы по принятой русской библейской традиции; неоднозначность רוּחַ и трудной заключительной конструкции вынесена в примечания.
