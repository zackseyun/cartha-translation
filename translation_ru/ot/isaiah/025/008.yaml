  text: בִּלַּ֤ע הַ/מָּ֨וֶת֙ לָ/נֶ֔צַח וּ/מָחָ֨ה אֲדֹנָ֧/י יְהוִ֛ה דִּמְעָ֖ה מֵ/עַ֣ל כָּל פָּנִ֑ים וְ/חֶרְפַּ֣ת עַמּ֗/וֹ יָסִיר֙ מֵ/עַ֣ל כָּל הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/008.yaml
  text: He will swallow up death forever[a], and the Lord GOD will wipe away tears from every face, and he will remove the reproach of his people from all the earth[c][b], for Yahweh has spoken.
translation:
  language: ru
  text: Он навеки поглотит смерть[a]. Господь Яхве[b] отрёт слёзы с каждого лица и снимет поношение своего народа[c] со всей земли, ибо Яхве сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Он навеки поглотил смерть». Еврейский перфект может изображать будущее действие как уже несомненно совершившееся.'
    reason: lexical_alternative
  - marker: b
    text: Евр. אֲדֹנָי יְהוִה — буквально «Господь Яхве».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «позор своего народа», «бесчестье своего народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלַּע הַמָּוֶת לָנֶצַח
  choice: Он навеки поглотит смерть
  rationale: Сохранена конкретная метафора глагола בלע («поглощать»), а перфект передан будущим временем как пророческий перфект в контексте обещания. לָנֶצַח передано словом «навеки», обозначающим окончательность и непреходящий результат.
- source_word: וּמָחָה ... דִּמְעָה מֵעַל כָּל פָּנִים
  choice: отрёт слёзы с каждого лица
  rationale: Глагол מחה при слове «слеза» естественно передаётся по-русски как «отереть». Единственное число דִּמְעָה передано собирательным множественным «слёзы», а כָּל פָּנִים — дистрибутивным «с каждого лица».
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» сохраняет личное имя יְהוִה и позволяет различить составной титул и отдельное употребление имени в конце стиха.
- source_word: וְחֶרְפַּת עַמּוֹ יָסִיר
  choice: и снимет поношение Своего народа
  rationale: חֶרְפָּה обозначает публичное унижение, поношение или позор; «поношение» сохраняет направленную извне составляющую. Hiphil יָסִיר естественно передан как «снимет».
- source_word: מֵעַל כָּל הָאָרֶץ
  choice: со всей земли
  rationale: В данном широком контексте הָאָרֶץ понято как «земля» в универсальном смысле, хотя лексически возможно и значение «страна».
- source_word: כִּי יְהוָה דִּבֵּר
  choice: ибо Яхве сказал
  rationale: כִּי вводит основание достоверности обещания. Перфект דִּבֵּר передан завершённым «сказал», а имя יְהוָה транслитерировано как «Яхве».
theological_decisions:
- issue: Временное значение בִּלַּע и וּמָחָה
  choice: 'Будущее пророческое действие: «поглотит», «отрёт»'
  alternative: 'Прошедшее совершенное: «поглотил», «отёр»'
  rationale: Обе формы морфологически являются перфектами, однако в пророческом обещании они могут изображать будущее событие как несомненное. Сноска сохраняет грамматически возможное чтение в прошедшем времени.
- issue: Передача имени יְהוָה
  choice: Яхве; в сочетании אֲדֹנָי יְהוִה — «Владыка Яхве»
  alternative: ГОСПОДЬ; в сочетании — «Господь БОГ»
  rationale: Транслитерация сохраняет личное Божье имя в исходном тексте, а «Владыка» ясно передаёт отдельный титул אֲדֹנָי, не сливая два элемента выражения.
- issue: Объём значения חֶרְפַּת עַמּוֹ
  choice: поношение Своего народа
  alternative: позор Своего народа / бесчестье Своего народа
  rationale: Выбрано слово, охватывающее как унижение народа, так и обращённые против него укоры, без уточнения, идёт ли речь преимущественно о внутреннем стыде или внешнем презрении.
- issue: Значение הָאָרֶץ
  choice: вся земля
  alternative: вся страна
  rationale: Универсальные выражения «с каждого лица» и «навеки» поддерживают широкий смысл, но само еврейское слово допускает также локальное значение «страна».
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Сохранены образ «поглощения» смерти и телесный образ отирания слёз; синтаксис слегка упрощён для естественного русского чтения. Местоимение «Своего» написано с прописной буквы как уважительное указание на Бога.
