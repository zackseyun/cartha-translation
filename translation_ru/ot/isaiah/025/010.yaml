base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/010.yaml
  text: For the hand of Yahweh will rest on this mountain[a], and Moab will be trampled down in its place[b], as straw is trampled down in the water of a dung pit.
translation:
  language: ru
  text: Ибо рука Яхве будет покоиться на этой горе, а Моав будет растоптан под ним[a], как солому топчут в воде навозной ямы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «под ним». Неясно, к кому относится древнееврейский местоименный суффикс.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в воде навозной кучи». Древнееврейское слово, вероятно, обозначает место, связанное с навозом; точный оттенок значения неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт пояснительную связь с предшествующим обещанием и сохраняет возвышенный, но понятный регистр.
- source_word: תָנוּחַ
  choice: будет покоиться
  rationale: Сохраняет конкретный образ руки Яхве, пребывающей на горе, не сводя его только к действию или защите.
- source_word: יַד יְהוָה
  choice: рука Яхве
  rationale: Сохранена древнееврейская метафора Божьей силы и действия, а личное имя передано непосредственно.
- source_word: בָּהָר הַזֶּה
  choice: на этой горе
  rationale: Естественная русская локативная конструкция; в контексте речь идёт о горе Сион.
- source_word: וְנָדוֹשׁ
  choice: а Моав будет растоптан
  rationale: Глагол דושׁ означает топтать или молотить. «Растоптан» ясно передаёт сокрушение и унижение Моава, а повтор образа сохранён в сравнении с соломой.
- source_word: תַּחְתָּיו
  choice: на своём месте
  rationale: Это естественно передаёт вероятный смысл — Моав будет растоптан там, где находится, — но не выдаёт неопределённый антецедент местоименного суффикса за несомненный; буквальные варианты даны в сноске.
- source_word: כְּהִדּוּשׁ מַתְבֵּן
  choice: как топчут солому
  rationale: Повтор глагольного корня דושׁ отражён словами «растоптан» и «топчут»; «солома» кратко и понятно передаёт מַתְבֵּן.
- source_word: בְמֵי מַדְמֵנָה
  choice: в воде навозной ямы
  rationale: Передаёт упоминание воды и зловонного места, связанного с навозом, не смягчая намеренно унизительный образ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблено личное имя Бога; форма «Яхве» передаёт тетраграмматон, не заменяя его титулом.
- issue: Антецедент местоименного суффикса в תַּחְתָּיו
  choice: на своём месте
  alternative: под Ним; под ней
  rationale: Еврейская форма буквально допускает значение «под ним/под ней», но её отнесение к конкретному предшествующему слову неясно. Основной текст передаёт вероятный идиоматический смысл, а неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; образ руки и резкое сравнение с навозной ямой сохранены без смягчения.
