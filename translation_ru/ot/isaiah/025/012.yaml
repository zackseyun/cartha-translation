lexical_decisions:
- source_word: וּמִבְצַר מִשְׂגַּב חוֹמֹתֶיךָ
  choice: А укреплённую высоту твоих стен
  rationale: Сжатая цепочка сопряжённых существительных описывает укреплённое, высоко расположенное и недоступное сооружение, связанное со стенами. Такая передача сохраняет и оборонительный, и высотный оттенки, не удваивая слово «крепость».
- source_word: הֵשַׁח
  choice: Он низверг
  rationale: Каузативная форма выражает низведение чего-либо возвышенного; «низверг» естественно передаёт как движение вниз, так и разрушение.
- source_word: הִשְׁפִּיל
  choice: унизил
  rationale: Глагол буквально означает «сделал низким». «Унизил» сохраняет намеренную словесную перекличку физического низведения и уничижения, не исключая разрушительного смысла.
- source_word: הִגִּיעַ לָאָרֶץ
  choice: поверг на землю
  rationale: 'Буквально: «довёл до земли». В контексте падения укреплений «поверг на землю» звучит естественно и сохраняет каузативный смысл.'
- source_word: עַד עָפָר
  choice: в самый прах
  rationale: Фраза усиливает образ полного низвержения. «В самый прах» передаёт предельность עַד и сохраняет торжественный поэтический регистр.
