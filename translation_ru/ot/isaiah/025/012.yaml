translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим ритмом. Последовательность глаголов сохраняет нарастающий образ полного низвержения. Местоимение «Он» написано с прописной буквы как прозрачная отсылка к Господу в контексте, без добавления имени, отсутствующего в стихе.
