  text: כִּ֣י שַׂ֤מְתָּ מֵ/עִיר֙ לַ/גָּ֔ל קִרְיָ֥ה בְצוּרָ֖ה לְ/מַפֵּלָ֑ה אַרְמ֤וֹן זָרִים֙ מֵ/עִ֔יר לְ/עוֹלָ֖ם לֹ֥א יִבָּנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/002.yaml
  text: For you have made the city a heap[a], the fortified town a ruin; the palace of foreigners is no city[b], it will never be rebuilt.
translation:
  language: ru
  text: Ибо Ты превратил город в груду развалин, укреплённый город — в руины; дворец чужеземцев — уже не город[a], и уже никогда не будет отстроен[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза сжата; буквально: «дворец чужеземцев — не город». Возможен смысл: «дворец чужеземцев больше не считается городом»; речь может идти о чужеземной твердыне, утратившей прежнее значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вовеки не будет построен». В контексте разрушения имеется в виду, что его никогда не отстроят заново.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתָּ
  choice: превратил
  rationale: В конструкции с результативными дополнениями глагол שׂוּם означает не просто «поместить», а «сделать, превратить во что-либо».
- source_word: מֵעִיר לַגָּל
  choice: город в груду развалин
  rationale: 'Первый מִן участвует в сжатой конструкции превращения: город обращён в גַּל — груду или насыпь, в данном контексте груду развалин.'
- source_word: קִרְיָה בְצוּרָה לְמַפֵּלָה
  choice: укреплённый город — в руины
  rationale: בְצוּרָה означает «укреплённый», а מַפֵּלָה — падение, обрушение или развалины; русское «в руины» естественно передаёт результат разрушения и сохраняет параллелизм.
- source_word: אַרְמוֹן זָרִים
  choice: дворец чужеземцев
  rationale: אַרְמוֹן обычно обозначает дворец либо укреплённую резиденцию; זָרִים — чужеземцев, посторонних. Выбран буквальный и естественный родительный оборот.
- source_word: מֵעִיר
  choice: перестал быть городом
  rationale: Сжатое еврейское выражение допускает понимание удаления из состояния или статуса города. Перевод сохраняет этот смысл, не отождествляя дворец и город без пояснения.
- source_word: לְעוֹלָם לֹא יִבָּנֶה
  choice: уже никогда не будет отстроен
  rationale: При отрицании לְעוֹלָם имеет значение «никогда», а нифаль יִבָּנֶה — «будет построен/отстроен». После описания разрушения «отстроен» ясно передаёт восстановление.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Заглавное «Ты» относится к Богу по русской издательской традиции. Параллелизм двух первых строк сохранён; неоднозначная сжатая фраза אַרְמוֹן זָרִים מֵעִיר не сглажена без примечания.
