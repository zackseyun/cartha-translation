  text: כְּ/חֹ֣רֶב בְּ/צָי֔וֹן שְׁא֥וֹן זָרִ֖ים תַּכְנִ֑יעַ חֹ֚רֶב בְּ/צֵ֣ל עָ֔ב זְמִ֥יר עָֽרִיצִ֖ים יַעֲנֶֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/005.yaml
  text: Like heat in a dry land[a], you subdue the uproar of strangers; like heat by the shadow of a cloud[b], the song of the ruthless is brought low.
translation:
  language: ru
  text: 'Как зной в иссохшей земле,

    Ты усмиряешь шум чужеземцев;

    как зной, умеряемый тенью облака,

    утихает песнь жестоких[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «песнь жестоких унижается» или «подавляется». Еврейскую форму можно также понимать в обычном значении «отвечает», однако контекст и параллелизм поддерживают смысл подавления или затихания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחֹרֶב
  choice: как зной
  rationale: חֹרֶב обозначает зной, жару или засуху; в сочетании с образом тени облака «зной» лучше всего сохраняет поэтическое сопоставление.
- source_word: בְּצָיוֹן
  choice: в иссохшей земле
  rationale: צָיוֹן указывает на сухое, выжженное место; этот перевод естественно передаёт образ безводной местности.
- source_word: שְׁאוֹן
  choice: гул
  rationale: Слово обозначает громкий шум, смятение или враждебный ропот; «гул» сохраняет прежде всего звуковой образ, параллельный «песни» во второй половине стиха.
- source_word: זָרִים
  choice: чужеземцев
  rationale: זָרִים может означать чужих, посторонних или иноземцев; в контексте враждебных народов «чужеземцев» звучит ясно и естественно.
- source_word: תַּכְנִיעַ
  choice: Ты усмиряешь
  rationale: Хифиль от כנע означает смирять, покорять, усмирять. Форма второго лица продолжает прямое обращение к Богу.
- source_word: חֹרֶב
  choice: как зной
  rationale: Повтор «зной» сохраняет лексический повтор и параллелизм еврейского текста.
- source_word: בְּצֵל עָב
  choice: в тени облака
  rationale: צֵל — «тень», עָב — плотное облако. Выражение передаёт образ зноя, ослабевающего, когда облако заслоняет солнце.
- source_word: זְמִיר
  choice: песнь
  rationale: זְמִיר означает песнь; здесь это, вероятно, торжествующая или хвастливая песнь угнетателей, однако в основном тексте сохранено более широкое значение.
- source_word: עָרִיצִים
  choice: безжалостных
  rationale: עָרִיץ обозначает жестокого, насильственного, беспощадного человека; субстантивированное «безжалостных» передаёт значение без привнесения конкретного политического титула.
- source_word: יַעֲנֶה
  choice: смиряется
  rationale: В данном параллелизме форма, вероятнее всего, выражает подавление или унижение песни. Возвратная конструкция не вводит в последнюю строку явно названного деятеля и сохраняет некоторую недосказанность оригинала.
theological_decisions:
- issue: Смена формы обращения и подразумеваемый деятель
  choice: 'В первой половине сохранено прямое обращение к Богу: «Ты усмиряешь», а последняя строка дана без явно названного деятеля: «песнь… смиряется».'
  alternative: 'Передать обе части с явным Божьим действием: «Ты усмиряешь… Ты смиряешь песнь…»'
  rationale: תַּכְנִיעַ несомненно стоит во втором лице и в контексте обращено к Богу. В последней строке иной глагольный строй; неявная конструкция позволяет не добавлять субъекта, которого еврейский текст прямо не называет.
- issue: Значение יַעֲנֶה
  choice: «смиряется» с примечанием об альтернативном буквальном разборе
  alternative: «отвечает» или «откликается»
  rationale: Огласованная форма допускает обычное значение «отвечать», но поэтический параллелизм с תַּכְנִיעַ и образ тени, умеряющей зной, убедительно поддерживают значение подавления или смирения. Примечание сохраняет реальную лексико-грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткими поэтическими строками. Сохранены прямое обращение к Богу, звуковой параллелизм «гул — песнь» и повтор образа зноя; синтаксис слегка прояснён без устранения неоднозначности последнего глагола.
