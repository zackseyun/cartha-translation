source:
  edition: WLC
  text: וּ/שְׁאַבְתֶּם מַ֖יִם בְּ/שָׂשׂ֑וֹן מִ/מַּעַיְנֵ֖י הַ/יְשׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/003.yaml
  text: With joy you will draw water from the springs of salvation[a][b].
translation:
  language: ru
  text: И с радостью вы будете черпать воду из источников спасения[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из родников спасения» или «из ключей спасения».'
    reason: lexical_alternative
  - marker: b
    text: В данном контексте «спасение» можно также перевести как «избавление».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁאַבְתֶּם
  choice: И … вы будете черпать
  rationale: Форма Qal, 2-е лицо множественного числа, с союзом וּ в пророческом контексте естественно передаётся будущим временем. Союз «и» сохранён как связь с предыдущим стихом.
- source_word: מַיִם
  choice: воду
  rationale: Обычная передача формы множественного числа, употреблённой в еврейском как название вещества.
- source_word: בְּ/שָׂשׂוֹן
  choice: с радостью
  rationale: Предлог בְּ с существительным выражает сопутствующее состояние; «с радостью» сохраняет именную конструкцию и естественно звучит по-русски.
- source_word: מִ/מַּעַיְנֵי
  choice: из источников
  rationale: מַעְיָן обозначает источник, родник или ключ. «Источники» точно передают природный источник воды и сохраняют образную ёмкость выражения.
- source_word: הַ/יְשׁוּעָה
  choice: спасения
  rationale: יְשׁוּעָה означает спасение или избавление. «Спасение» сохраняет как смысл избавления от беды, так и более широкое богословское звучание книги Исаии.
theological_decisions:
- issue: Передавать ли יְשׁוּעָה более узко как «избавление» или шире как «спасение»
  choice: спасение
  alternative: избавление
  rationale: В Ис 12 речь идёт о спасительном действии Бога, имеющем и конкретно-историческую, и более широкую богословскую глубину. «Спасение» сохраняет эту смысловую напряжённость, не привнося позднейших доктринальных уточнений.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и торжественно. Сохранены начальный союз и конкретный образ черпания воды.
