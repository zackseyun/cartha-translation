source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֞ם בַּ/יּ֣וֹם הַ/ה֗וּא הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָֽ/עַמִּ֖ים עֲלִֽילֹתָ֑י/ו הַזְכִּ֕ירוּ כִּ֥י נִשְׂגָּ֖ב שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/004.yaml
  text: 'And you will say on that day: “Give thanks to Yahweh[a]; call on his name. Make his deeds known among the peoples[b]; proclaim that his name is exalted.”'
translation:
  language: ru
  text: 'И скажете в тот день: «Благодарите Яхве[a], призывайте имя его; возвещайте среди народов о его деяниях, провозглашайте, что имя его превознесено[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ), личное имя Бога; традиционно также передаётся как «Господь».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «провозглашайте, ибо имя его превознесено». Еврейский союз может указывать не на содержание провозглашения, а на его причину.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: И скажете вы
  rationale: Форма 2-го лица множественного числа в пророческом контексте передаёт будущее действие и сохраняет связь с предыдущим стихом; порядок слов придаёт фразе естественную для торжественной русской речи выразительность.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчивое и естественное русское соответствие пророческой временной формуле.
- source_word: הוֹדוּ לַיהוָה
  choice: Благодарите Яхве
  rationale: Hiphil-императив ידה с ל выражает благодарение и хвалу, обращённые к Богу; «благодарите» точнее сохраняет основное значение, чем более широкое «прославляйте».
- source_word: יהוה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: קִרְאוּ בִשְׁמוֹ
  choice: призывайте Его имя
  rationale: Сочетание קרא с בְּשֵׁם допускает культовое призывание имени. Русская формулировка сохраняет этот образ, не сводя его только к публичному объявлению.
- source_word: הוֹדִיעוּ בָעַמִּים עֲלִילֹתָיו
  choice: возвещайте среди народов о Его деяниях
  rationale: Hiphil ידע означает «делать известным»; в русском управление с «о» делает фразу естественной. «Народы» сохраняет множественный этнический охват עמים, а «деяния» передаёт עֲלִילוֹת без добавления отсутствующего определения «могущественные».
- source_word: הַזְכִּירוּ
  choice: провозглашайте
  rationale: Hiphil זכר буквально связан с напоминанием или упоминанием, но здесь в поэтическом параллелизме обозначает публичное возвещение.
- source_word: כִּי נִשְׂגָּב שְׁמוֹ
  choice: что имя Его превознесено
  rationale: נשגב передаёт высоту и величие; «превознесено» естественно в торжественном религиозном контексте. כִּי понято как вводящее содержание провозглашения, при сохранении причинного прочтения в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Основной текст сохраняет личное имя, присутствующее в еврейском оригинале. Сноска сообщает традиционную русскую замену титулом, не подменяя ею исходную форму.
- issue: Значение כִּי после הַזְכִּירוּ
  choice: 'содержание провозглашения: «что имя Его превознесено»'
  alternative: 'причина призыва: «ибо имя Его превознесено»'
  rationale: Оба синтаксических прочтения возможны. В основном тексте выбрана содержательная связь, естественная после «провозглашайте»; причинная связь сохранена в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, поэтическим звучанием. Сохранены цепочка повелений, обращение во множественном числе и параллелизм стиха; архаизмы и конфессионально маркированная терминология сведены к минимуму.
