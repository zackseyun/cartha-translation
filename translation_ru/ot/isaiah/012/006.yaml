source:
  edition: WLC
  text: צַהֲלִ֥י וָ/רֹ֖נִּי יוֹשֶׁ֣בֶת צִיּ֑וֹן כִּֽי גָד֥וֹל בְּ/קִרְבֵּ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/006.yaml
  text: Cry aloud and shout for joy[a], inhabitant of Zion[b], for great in your midst is the Holy One of Israel.
translation:
  language: ru
  text: Громко восклицай и ликуй[a], жительница Сиона[b], ведь велик посреди тебя Святой Израиля!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «восклицай и пой от радости». Второе повеление может означать как радостный возглас, так и ликующее пение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «живущая в Сионе». В еврейском тексте употреблено единственное число женского рода: Сион олицетворён как женщина, к которой обращаются напрямую.'
    reason: cultural_note
lexical_decisions:
- source_word: צַהֲלִי
  choice: Громко восклицай
  rationale: Повелительная форма женского рода единственного числа обозначает громкий, торжествующий возглас. Добавление «громко» передаёт силу голоса и не сливает этот глагол со следующим.
- source_word: וָרֹנִּי
  choice: и ликуй
  rationale: Глагол выражает звонкое проявление радости — радостный крик или пение. «Ликуй» естественно передаёт эту радость, сохраняя возможность как возгласа, так и пения.
- source_word: יוֹשֶׁבֶת צִיּוֹן
  choice: жительница Сиона
  rationale: Причастие женского рода единственного числа прямо обращено к олицетворённому Сиону. «Жительница Сиона» сохраняет и грамматический род, и образ, не подменяя выражение отсутствующим здесь оборотом «дочь Сиона».
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для призыва к ликованию. «Ведь» естественно связывает обе части в современном русском языке.
- source_word: גָדוֹל
  choice: велик
  rationale: Сохраняется прямое значение предикативного прилагательного без сужения смысла до одной лишь силы или могущества.
- source_word: בְּקִרְבֵּךְ
  choice: посреди тебя
  rationale: Форма с суффиксом второго лица женского рода единственного числа согласуется с олицетворённым Сионом. «Посреди тебя» сохраняет пространственный образ и прямое обращение.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  rationale: Сохраняется характерный для книги Исаии титул Бога в современной и прозрачной русской форме.
theological_decisions:
- issue: Олицетворение Сиона как адресата женского рода единственного числа
  choice: 'Сохранить единственное число и женский род: «жительница Сиона» и «посреди тебя»'
  alternative: 'Передать собирательно: «жители Сиона» или «народ Сиона»'
  rationale: Все соответствующие еврейские формы стоят в женском роде единственного числа. Сохранение этой формы удерживает поэтическое олицетворение и не превращает его в общее обращение к множеству людей.
- issue: Божественный титул קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  alternative: Святой Израилев
  rationale: Выбранный вариант точно передаёт устойчивый титул и его связь с Израилем, оставаясь понятным современному читателю и не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической интонацией. Восклицательный знак уместен для двух настойчивых призывов к громкому ликованию. Формулировка сохраняет женский род и единственное число еврейского обращения.
