  to: Пойте хвалу Яхве[a], ибо Он совершил славное; пусть это станет известно по всей земле.
  rationale: Исправлена только неестественная коллокация в основной строке и слегка повышен регистр союза. «Славное» сохраняет субстантивированное единственное число, присущее исходному выражению, и не устраняет отмеченную в сноске возможность адвербиального понимания.
