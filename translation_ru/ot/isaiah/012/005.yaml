  text: זַמְּר֣וּ יְהוָ֔ה כִּ֥י גֵא֖וּת עָשָׂ֑ה מידעת זֹ֖את בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/005.yaml
  text: Sing praise to Yahweh[a], for he has done gloriously; let this be made known in all the earth.
translation:
  language: ru
  text: Пойте хвалу Яхве[a], ибо Он совершил славное; пусть это станет известно по всей земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он поступил величественно»; возможно: «Он совершил превосходное».'
    reason: Лексическая неоднозначность существительного גֵאוּת и необычного сочетания с глаголом «совершил» допускает передачу как качества действия или как величественного деяния.
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Пойте хвалу
  rationale: Форма повелительного наклонения во множественном числе призывает к музыкальному прославлению; выражение «пойте хвалу» естественно передаёт и пение, и его хвалебный характер.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для призыва и естественно связывает обе части фразы.
- source_word: גֵאוּת עָשָׂה
  choice: Он совершил величественное
  rationale: Сохранено единственное абстрактное существительное со значением величия, возвышенности или превосходства; русская субстантивированная форма передаёт необычную выразительность оригинала, не превращая её без необходимости во множественное число.
- source_word: מידעת זֹאת
  choice: да станет это известно
  rationale: Передан пассивно-побудительный смысл, соответствующий окружению из призывов; «это» указывает на только что названное деяние Яхве.
- source_word: בְּכָל הָאָרֶץ
  choice: по всей земле
  rationale: В контексте всемирного возвещения אֶרֶץ понимается как вся земля, а не отдельная страна.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Смысл выражения גֵאוּת עָשָׂה
  choice: Он совершил величественное
  alternative: Он поступил величественно; Он совершил превосходное
  rationale: Формулировка сохраняет семантическую широту слова גֵאוּת — величие, возвышенность, превосходство — и не сводит его только к манере действия.
translation_notes:
  register: Современный литературный русский язык с торжественным гимническим звучанием. Частица «да» уместно выражает пожелание-призыв; прописное «Он» поддерживает традиционный благоговейный регистр, не добавляя богословского толкования.
