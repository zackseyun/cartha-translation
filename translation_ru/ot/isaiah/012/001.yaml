  text: וְ/אָֽמַרְתָּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא אוֹדְ/ךָ֣ יְהוָ֔ה כִּ֥י אָנַ֖פְתָּ בִּ֑/י יָשֹׁ֥ב אַפְּ/ךָ֖ וּֽ/תְנַחֲמֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/001.yaml
  text: And you will say in that day[a], “I will praise you, O Yahweh, for though you were angry with me, your anger has turned away[b], and you comfort me.”
translation:
  language: ru
  text: 'И скажешь в тот день: «Буду славить Тебя[a], Яхве! Хотя Ты гневался на меня, гнев Твой отвратится[b], и Ты утешишь меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Буду благодарить Тебя». Еврейский глагол может обозначать как прославление Бога, так и благодарение Ему.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «гнев Твой обратится». Еврейское слово, буквально означающее «нос», здесь употреблено как идиома для гнева.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: И скажешь
  rationale: Форма перфекта 2-го лица мужского рода с союзом в пророческой речи передаёт будущее действие; краткое «и скажешь» естественно по-русски и сохраняет связь с контекстом.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчивое пророческое обозначение времени, которое естественно и узнаваемо звучит в современном литературном русском языке.
- source_word: אוֹדְךָ
  choice: Буду славить Тебя
  rationale: Глагол ידה в данной форме может обозначать хвалу, благодарение или исповедание; в песне после избавления «славить» хорошо передаёт богослужебный характер высказывания, не сводя его лишь к выражению благодарности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: כִּי אָנַפְתָּ בִּי
  choice: Хотя Ты гневался на меня
  rationale: כִּי само по себе многозначно, однако последующее прекращение гнева и утешение придают всей связи уступительный смысл; «хотя» ясно и естественно выражает его по-русски.
- source_word: יָשֹׁב אַפְּךָ
  choice: гнев Твой отвратился
  rationale: אַף буквально связано с «носом», но идиоматически означает гнев; שוב передаёт его поворот или удаление. «Отвратился» сохраняет образ движения прочь и возвышенный, но понятный регистр.
- source_word: וּתְנַחֲמֵנִי
  choice: и Ты утешил меня
  rationale: Пиэль глагола נחם означает утешать. Прошедшее время естественно продолжает описание прекращения гнева как уже пережитого избавления, хотя еврейская глагольная форма допускает иной временной оттенок.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя, а не титул. «Яхве» — принятая научная реконструкция произношения, позволяющая не подменять имя титулом.
- issue: Смысл связи, вводимой כִּי
  choice: Хотя Ты гневался на меня
  alternative: Ибо Ты гневался на меня
  rationale: Формального уступительного союза в еврейском нет, но контраст между прежним гневом и последующим утешением поддерживает уступительное прочтение. Альтернатива отмечает возможное более буквальное понимание связи.
- issue: Временная и модальная окраска יָשֹׁב ... וּתְנַחֲמֵנִי
  choice: гнев Твой отвратился, и Ты утешил меня
  alternative: да отвратится гнев Твой, и да утешишь Ты меня; гнев Твой отвратится, и Ты утешишь меня
  rationale: В контексте песни хвалы формы естественно понимать как описание совершившегося избавления. При этом древнееврейский имперфект допускает также будущее или желательное прочтение, поэтому неоднозначность отражена в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической интонацией. Формы «Тебя», «Ты», «Твой» написаны с прописной буквы как уважительное традиционное оформление обращения к Богу; архаические «еси», «ибо» и тяжеловесные обороты исключены.
