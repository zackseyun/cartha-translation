id: ISA.12.2
reference: Isaiah 12:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הִנֵּ֨ה אֵ֧ל יְשׁוּעָתִ֛/י אֶבְטַ֖ח וְ/לֹ֣א אֶפְחָ֑ד כִּֽי עָזִּ֤/י וְ/זִמְרָת֙ יָ֣הּ יְהוָ֔ה וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/002.yaml
  text: Behold[a], God is my salvation; I will trust and not be afraid, for Yah, Yahweh, is my strength and song[b], and he has become my salvation.
translation:
  language: ru
  text: Вот, Бог — моё спасение! Я буду уповать и не бояться, ибо Ях, Яхве[a], — моя сила и моя песнь[b]; Он стал для меня спасением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Ях» — краткая поэтическая форма имени Яхве; в еврейском тексте обе формы имени стоят рядом: «Ях, Яхве».'
    reason: Пояснение необычного двойного божественного имени.
  - marker: b
    text: Слова «моя сила и моя песнь» почти дословно повторяют Исход 15:2.
    reason: Межтекстовая ссылка, существенная для поэтического смысла стиха.
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт призыв обратить внимание и торжественную выразительность междометия, оставаясь естественным в современном русском языке.
- source_word: אֵל
  choice: Бог
  rationale: Прямое и естественное соответствие поэтическому обозначению Бога без добавления отсутствующего в тексте определения.
- source_word: יְשׁוּעָתִי / לִישׁוּעָה
  choice: моё спасение / спасением
  rationale: Сохраняет повтор ключевого слова и обрамление стиха; в данном контексте слово включает избавление, но не сводится лишь к нему.
- source_word: אֶבְטַח
  choice: Я буду уповать
  rationale: Форма выражает уверенное решение; «уповать» естественно передаёт доверие Богу и соответствует возвышенному поэтическому регистру.
- source_word: וְלֹא אֶפְחָד
  choice: и не бояться
  rationale: При общем вспомогательном глаголе «буду» это краткое и точное выражение отрицательного имперфекта.
- source_word: עָזִּי
  choice: моя сила
  rationale: Передаёт прямое значение существительного и сохраняет связь с Исходом 15:2.
- source_word: וְזִמְרָת
  choice: моя песнь
  rationale: Традиционное и контекстуально вероятное значение в формуле, повторяющей Исход 15:2; вариант «хвала» возможен, но менее точно сохраняет образ.
- source_word: יָהּ יְהוָה
  choice: Ях, Яхве
  rationale: Передаёт как краткую форму божественного имени, так и тетраграмматон, сохраняя необычное поэтическое удвоение исходного текста.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: Он стал для меня спасением
  rationale: Сохраняет результативный смысл глагола, местоименную конструкцию לִי («для меня») и повтор слова «спасение».
theological_decisions:
- issue: Передача сочетания יָהּ יְהוָה
  choice: Ях, Яхве
  alternative: Господь Бог; Господь, Господь; Ях, Господь
  rationale: В еврейском тексте стоят рядом краткая и полная формы личного имени Бога. Транслитерация сохраняет эту особенность и не превращает личное имя в титул; примечание поясняет непривычную краткую форму.
- issue: Связь с песнью Исхода 15:2
  choice: Сохранить выражения «моя сила и моя песнь» и повтор слова «спасение»
  alternative: 'Передать толковательно: «моя крепость и хвала»'
  rationale: Лексическая близость позволяет услышать намеренный отзвук песни об избавлении, не навязывая стиху дополнительного толкования.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим звучанием. «Уповать» выбрано как понятное, но возвышенное слово; синтаксис краток и сохраняет параллелизм. Восклицательный знак после первого утверждения передаёт эмоциональную силу הִנֵּה, не меняя содержания.
