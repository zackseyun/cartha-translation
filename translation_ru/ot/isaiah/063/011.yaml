  text: וַ/יִּזְכֹּ֥ר יְמֵֽי עוֹלָ֖ם מֹשֶׁ֣ה עַמּ֑/וֹ אַיֵּ֣ה הַֽ/מַּעֲלֵ֣/ם מִ/יָּ֗ם אֵ֚ת רֹעֵ֣י צֹאנ֔/וֹ אַיֵּ֛ה הַ/שָּׂ֥ם בְּ/קִרְבּ֖/וֹ אֶת ר֥וּחַ קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/011.yaml
  text: 'Then he remembered the ancient days[b][a], Moses and his people: “Where is the one who brought them up out of the sea with the shepherds of his flock? Where is the one who put his Holy Spirit within him?”'
translation:
  language: ru
  text: 'Тогда Он вспомнил древние дни, Моисея и его народ: «Где Тот, Кто вывел их из моря вместе с пастырями Своего стада[a]? Где Тот, Кто вложил в него Свой Святой Дух[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по масоретской огласовке: «с пастырями Своего стада»; возможно также чтение «с пастырем Своего стада», вероятно относящееся к Моисею.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в них»; или: «среди них». В еврейском тексте стоит суффикс единственного числа («в него»), но неясно, к кому именно он относится.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Тогда Он вспомнил
  rationale: Форма wayyiqtol продолжает повествование и обычно передаёт последовательность действий. «Тогда» естественно звучит по-русски; единственное число глагола сохранено.
- source_word: יְמֵי עוֹלָם
  choice: древние дни
  rationale: В данном сочетании עוֹלָם указывает на давние времена и прежние спасительные деяния Бога, а не обязательно на вечность.
- source_word: מֹשֶׁה עַמּוֹ
  choice: Моисея и Свой народ
  rationale: Еврейская последовательность предельно сжата и допускает разные синтаксические толкования. Перевод связывает Моисея и народ с тем, что было вспомнено, не вводя отсутствующих в тексте уточнений вроде «дни Моисея».
- source_word: אַיֵּה
  choice: Где Тот, Кто
  rationale: Повторяющийся вопрос сохранён в настоящем времени как риторический вопль. Добавленное по нормам русского синтаксиса «Тот, Кто» ясно обозначает действующее лицо, не называя его заново.
- source_word: הַמַּעֲלֵם מִיָּם
  choice: Кто вывел их из моря
  rationale: Причастная форма с множественным объектным суффиксом передана личной конструкцией. «Из моря» естественно выражает исход из вод в контексте исхода.
- source_word: אֵת רֹעֵי צֹאנוֹ
  choice: вместе с пастырями Своего стада
  rationale: Масоретская огласовка רֹעֵי имеет форму множественного числа «пастыри». Предлог «вместе с» передаёт сопутствие; возможное единственное число отмечено в сноске.
- source_word: הַשָּׂם
  choice: Кто вложил
  rationale: Причастие от שׂים означает «помещающий, полагающий». В сочетании с Духом и внутренним пребыванием русское «вложил» звучит естественно и не меняет образ.
- source_word: בְּקִרְבּוֹ
  choice: в него
  rationale: Суффикс в масоретском тексте имеет единственное число. Формулировка сохраняет его, не определяя однозначно, относится ли оно к Моисею либо к народу как собирательному целому.
- source_word: רוּחַ קָדְשׁוֹ
  choice: Свой Святой Дух
  rationale: Выражение обозначает Божий святой Дух (ср. Ис 63:10). «Свой» естественно соотносит Дух с субъектом действия, а прописные буквы соответствуют личному божественному референту в данном контексте.
theological_decisions:
- issue: Кто является субъектом слов «вспомнил»
  choice: 'В основном тексте субъектом оставлен Бог: «Он вспомнил»'
  alternative: «Его народ вспомнил»
  rationale: Глагол имеет форму мужского рода единственного числа, а предшествующий контекст называет Господа действующим лицом. Вместе с тем сжатая последовательность מֹשֶׁה עַמּוֹ позволяет некоторым понимать «Его народ» как собирательный субъект; перевод не развивает выбранное чтение дополнительными богословскими пояснениями.
- issue: К кому относится единственное число в בְּקִרְבּוֹ
  choice: 'Сохранено единственное число: «в него»'
  alternative: «в них» или «среди них»
  rationale: 'Масоретский суффикс имеет единственное число, но его референт неясен: это может быть Моисей либо народ как единое целое. Подлинная неопределённость сохранена и пояснена в сноске.'
- issue: Число слова «пастыри»
  choice: Сохранено масоретское множественное число
  alternative: 'Единственное число: «с пастырем Своего стада», вероятно о Моисее'
  rationale: Огласованный масоретский текст даёт множественное число, поэтому оно стоит в основном тексте; контекстуально возможное единственное число вынесено в сноску без догматического выбора.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Риторический параллелизм двух вопросов сохранён. Местоимения, относящиеся к Богу, написаны с прописной буквы как элемент принятого русского библейского регистра; синтаксическая и референтная неоднозначность исходного текста не устранена молча.
