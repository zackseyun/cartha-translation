source:
  edition: WLC
  text: בְּֽ/כָל צָרָתָ֣/ם לא צָ֗ר וּ/מַלְאַ֤ךְ פָּנָי/ו֙ הֽוֹשִׁיעָ֔/ם בְּ/אַהֲבָת֥/וֹ וּ/בְ/חֶמְלָת֖/וֹ ה֣וּא גְאָלָ֑/ם וַֽ/יְנַטְּלֵ֥/ם וַֽ/יְנַשְּׂאֵ֖/ם כָּל יְמֵ֥י עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/009.yaml
  text: In all their distress[a], he was distressed, and the angel of his presence saved them; in his love and in his compassion he redeemed them, and he lifted them up and carried them all the days of old.
translation:
  language: ru
  text: Во всех их бедах Он не был им врагом[a], и Ангел Его присутствия спас их; по Своей любви и Своему состраданию Он искупил их, поднял их и носил их во все былые дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнее альтернативное чтение: «Во всех их бедах Он страдал».'
    reason: Альтернативное чтение отражено в древних версиях и широко известно; оно существенно меняет смысл первой строки, тогда как масоретский текст содержит לֹא — «не».
lexical_decisions:
- source_word: בְּכָל צָרָתָם
  choice: Во всех их бедах
  rationale: Предлог בְּ с כָּל задаёт всеобъемлющее обстоятельство, а צָרָה обозначает беду, тяготу или бедствие. «Во всех их бедах» естественно по-русски и сохраняет широкий охват.
- source_word: לֹא צָר
  choice: Он не был врагом им
  rationale: Масоретский текст содержит отрицание לֹא и допускает понимание צַר как «враг, противник». Такое прочтение близко к данному еврейскому тексту и в контексте яснее, чем русское «Он не испытывал бедствия». Значимое древнее альтернативное чтение сохранено в сноске.
- source_word: וּמַלְאַךְ פָּנָיו
  choice: и Ангел Его присутствия
  rationale: מַלְאָךְ может означать посланника или ангела; здесь традиционное «Ангел» уместно в контексте Божьего спасительного действия. פָּנָיו буквально связано с Его лицом, а в данном сочетании означает Его присутствие.
- source_word: הוֹשִׁיעָם
  choice: спасал их
  rationale: Форма глагола יָשַׁע означает спасать или избавлять. Русское «спасал» сохраняет прямой и богословски ёмкий смысл; прошедший несовершенный вид естественно согласуется с последующим рядом действий в историческом обзоре.
- source_word: בְּאַהֲבָתוֹ וּבְחֶמְלָתוֹ
  choice: По Своей любви и Своему состраданию
  rationale: Предлог בְּ здесь может указывать на основание или побуждение. «По Своей любви» идиоматично передаёт мотив действия, а «сострадание» сохраняет эмоциональную силу חֶמְלָה.
- source_word: הוּא גְאָלָם
  choice: Он искупил их
  rationale: גָּאַל обозначает действие избавителя-родственника, выкупающего или возвращающего своих. «Искупил» сохраняет ключевое значение и богословскую насыщенность термина.
- source_word: וַיְנַטְּלֵם וַיְנַשְּׂאֵם
  choice: поднимал их и носил
  rationale: 'Два близких, но не тождественных глагола переданы раздельно: первый — как поднятие, второй — как несение. Несовершенный вид по-русски выражает продолжительную заботу в прежние времена.'
- source_word: כָּל יְמֵי עוֹלָם
  choice: во все дни древности
  rationale: עוֹלָם может указывать на отдалённое прошлое или будущее. Ретроспективный контекст требует значения древних времён, а не вечности.
theological_decisions:
- issue: Толкование לֹא צָר в первой строке
  choice: 'Следовать масоретскому לֹא («не») и понимать צָר как «враг, противник»: «Он не был врагом им».'
  alternative: «Во всех их бедах Он Сам страдал» — древнее альтернативное чтение, связанное с пониманием текста как לוֹ צָר и отражённое в древних версиях.
  rationale: Данный WLC-текст прямо содержит לֹא, поэтому основной перевод не должен молча заменять его альтернативным чтением. Вместе с тем синтаксис и значение צָר допускают трудности; прочтение «враг» сохраняет масоретские согласные и даёт связный смысл, а древняя богословски значимая альтернатива вынесена в сноску.
- issue: Личность «Ангела Его присутствия»
  choice: 'Сохранить обозначение текста без догматического отождествления: «Ангел Его присутствия».'
  alternative: Конкретизировать как обычного посланника, теофанию или определённое Лицо Божества.
  rationale: Сам стих не разъясняет личность Ангела достаточно для конфессионального уточнения; перевод сохраняет формулировку и напряжение исходного текста.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Синтаксис слегка упрощён для ясности, при этом сохранены ключевые повторы, образ несения народа и текстовая неоднозначность первой строки.
