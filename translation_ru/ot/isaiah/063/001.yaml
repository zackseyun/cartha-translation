  text: מִי זֶ֣ה בָּ֣א מֵ/אֱד֗וֹם חֲמ֤וּץ בְּגָדִים֙ מִ/בָּצְרָ֔ה זֶ֚ה הָד֣וּר בִּ/לְבוּשׁ֔/וֹ צֹעֶ֖ה בְּ/רֹ֣ב כֹּח֑/וֹ אֲנִ֛י מְדַבֵּ֥ר בִּ/צְדָקָ֖ה רַ֥ב לְ/הוֹשִֽׁיעַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/001.yaml
  text: Who is this coming from Edom[a], with crimson garments from Bozrah—this one splendid in his clothing, marching in the greatness of his strength? It is I, speaking in righteousness[c][b], mighty to save.
translation:
  language: ru
  text: 'Кто это идёт из Эдома,

    из Боцры — в багряных одеждах,[a]

    величественный в своём одеянии,

    выступающий во всей полноте своей силы?[b]


    «Это Я, говорящий то, что праведно,[c]

    могучий спасти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в одеждах, окрашенных в красное»; возможно также: «в одеждах, запятнанных красным».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «шагающий во всей полноте своей силы». Значение еврейского слова не вполне ясно.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «говорящий справедливо»; еврейское слово может обозначать как праведность, так и справедливость.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמוּץ בְּגָדִים
  choice: в покрасневших одеждах
  rationale: Причастное значение передаёт одежды, ставшие красными, не уточняя уже в этом стихе, чем именно они окрашены. Это сохраняет связь с образом давильни в следующем стихе, не опережая текст.
- source_word: הָדוּר בִּלְבוּשׁוֹ
  choice: величественный в своём одеянии
  rationale: הָדוּר указывает на величавый, внушительный вид; «одеяние» поддерживает возвышенный пророческий регистр и избегает буквального повтора слова «одежды».
- source_word: צֹעֶה
  choice: выступающий
  rationale: Редкий и трудный глагол описывает заметное, исполненное силы движение. «Выступающий» сохраняет возможность понимать его как шествие или широкий уверенный шаг, не делая военный оттенок обязательным.
- source_word: בְּרֹב כֹּחוֹ
  choice: во всей полноте своей силы
  rationale: Переданы и רֹב — полнота, изобилие, величие, — и כֹּחַ — сила. Формулировка естественна для современного литературного русского и сохраняет возвышенность оригинала.
- source_word: מְדַבֵּר בִּצְדָקָה
  choice: говорящий то, что праведно
  rationale: Так сохраняется предметно-нравственный смысл צְדָקָה, не сводимый только к правдивости речи или только к судебной справедливости.
- source_word: רַב לְהוֹשִׁיעַ
  choice: могучий спасти
  rationale: Фраза выражает великую способность совершить избавление. «Могучий спасти» кратко, понятно и соответствует возвышенному ответу говорящего.
- source_word: מֵאֱדוֹם / מִבָּצְרָה
  choice: из Эдома / из Боцры
  rationale: 'Сохранены географические названия: страна Эдом и эдомский город Боцра.'
theological_decisions:
- issue: Личность отвечающего
  choice: В тексте она не названа; ответ дан от первого лица без поясняющего имени.
  alternative: Господь как божественный воин; мессианская фигура; пророческая персонификация.
  rationale: Еврейский текст строится как драматический вопрос и ответ и в самом стихе не называет говорящего. Перевод не устраняет эту намеренную напряжённость.
- issue: Смысл צְדָקָה
  choice: «то, что праведно»
  alternative: «справедливо» или «по справедливости»
  rationale: Основной вариант удерживает широкий нравственный и заветный смысл слова; судебный оттенок отмечен в сноске, но не навязан основному тексту.
translation_notes:
  register: Современный литературный русский с возвышенным, но не архаическим пророческим звучанием. Строки оформлены как поэтическая речь. Сохранены смена вопроса на ответ, повтор лексики одежды через близкие русские слова и неоднозначность редкого глагола צֹעֶה.
