  text: לַ/מִּצְעָ֕ר יָרְשׁ֖וּ עַם קָדְשֶׁ֑/ךָ צָרֵ֕י/נוּ בּוֹסְס֖וּ מִקְדָּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/018.yaml
  text: Your holy people possessed it for a little while[b][a]; our adversaries have trampled your sanctuary.
translation:
  language: ru
  text: Недолго владел им Твой святой народ[a][b]; наши враги попрали Твоё святилище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишь короткое время». Еврейское выражение может обозначать краткость времени или малую меру.'
    reason: lexical_alternative
  - marker: b
    text: Буквально объект глагола «владел» не назван; по контексту подразумевается земля или наследие, но не обязательно само святилище.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּצְעָר
  choice: недолго
  rationale: Существительное מִצְעָר выражает малость; с предлогом ל здесь естественно передаёт краткость времени. «Недолго» ясно и сдержанно выражает временной смысл, не добавляя отдельного усилителя «только».
- source_word: יָרְשׁוּ
  choice: владел
  rationale: Форма от ירשׁ может означать «унаследовать», «овладеть» или «владеть». В данном плаче естественно «владел»; единственное число согласуется с собирательным подлежащим «народ». Не выраженный в еврейском объект передан местоимением «им» и пояснён в сноске.
- source_word: עַם קָדְשֶׁךָ
  choice: Твой святой народ
  rationale: Естественная русская передача сочетания «народ Твоей святости», сохраняющая принадлежность Богу и идею освящённости.
- source_word: צָרֵינוּ
  choice: наши враги
  rationale: צָר обозначает враждебного противника. «Враги» — современное, ясное и уместное в возвышенном плаче слово.
- source_word: בּוֹסְסוּ
  choice: попрали
  rationale: Глагол передаёт топтание ногами и оскверняющее надругательство. «Попрали» сохраняет силу образа и достоинство библейской речи.
- source_word: מִקְדָּשֶׁךָ
  choice: Твоё святилище
  rationale: מִקְדָּשׁ — святое место, святилище. Этот вариант сохраняет широкое значение термина, не сужая его без необходимости до архитектурного обозначения «храм».
theological_decisions:
- issue: Не выраженный объект при יָרְשׁוּ
  choice: В основном тексте добавить нейтральное «им», контекстуально относящееся к земле или наследию.
  alternative: Оставить объект невыраженным либо считать объектом «Твоё святилище».
  rationale: Русский язык требует здесь дополнения для естественной фразы. Еврейский текст его не называет, а следующая часть отдельно вводит святилище; поэтому нейтральное местоимение с пояснением в сноске сохраняет неоднозначность и параллелизм.
- issue: Значение לַמִּצְעָר
  choice: 'Понять как указание на краткую продолжительность: «недолго».'
  alternative: 'Понять количественно: «в малой мере», либо следовать чтениям, основанным на иной огласовке.'
  rationale: 'В контексте плача временное понимание создаёт связный смысл: святой народ владел наследием недолго, после чего враги попрали святилище. При этом сноска сохраняет возможный оттенок малой меры.'
translation_notes:
  register: Современный литературный русский с достоинством молитвенного плача. Прописные местоимения обращения к Богу соответствуют принятому русскому библейскому регистру. Точка с запятой сохраняет тесную связь и контраст двух частей стиха.
