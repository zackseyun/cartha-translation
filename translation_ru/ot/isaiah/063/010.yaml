id: ISA.63.10
reference: Isaiah 63:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הֵ֛מָּה מָר֥וּ וְ/עִצְּב֖וּ אֶת ר֣וּחַ קָדְשׁ֑/וֹ וַ/יֵּהָפֵ֥ךְ לָ/הֶ֛ם לְ/אוֹיֵ֖ב ה֥וּא נִלְחַם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/010.yaml
  text: But they rebelled and grieved his Holy Spirit[a]; so he turned against them as an enemy; he himself fought against them.
translation:
  language: ru
  text: Но они восстали против Него и огорчили Его Святого Духа[a]. Тогда Он стал им врагом и Сам сражался против них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его святой дух»; букв.: «дух Его святости».'
    reason: Лексическая альтернатива сохраняет буквальную форму еврейского сочетания и возможную вариативность его понимания.
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Но они
  rationale: Самостоятельное местоимение вместе с союзом подчёркивает контраст с предшествующими спасительными деяниями Бога; «Но они» естественно передаёт этот поворот.
- source_word: מָרוּ
  choice: восстали против Него
  rationale: Глагол מרה означает мятеж, неповиновение или противление, особенно по отношению к Богу. Дополнение «против Него» естественно выражает подразумеваемую направленность действия.
- source_word: וְעִצְּבוּ
  choice: огорчили
  rationale: Порода piel глагола עצב передаёт причинение боли или скорби; «огорчили» сохраняет личностно-реляционный смысл и звучит естественно по-русски.
- source_word: אֶת רוּחַ קָדְשׁוֹ
  choice: Его Святого Духа
  rationale: Конструкцию можно буквально передать как «дух Его святости», но в данном контексте традиционное и ясное «Его Святого Духа» сохраняет личностную отнесённость; буквальная возможность отмечена в сноске.
- source_word: וַיֵּהָפֵךְ לָהֶם לְאוֹיֵב
  choice: Тогда Он стал им врагом
  rationale: 'Еврейское выражение буквально описывает перемену отношения: «стал/обратился для них во врага». Русское «стал им врагом» прямо и естественно передаёт смысл, а «тогда» отражает последовательность и результат, не навязывая строгой причинной схемы.'
- source_word: הוּא
  choice: Сам
  rationale: Явно выраженное местоимение имеет эмфатическую функцию; «Сам» сохраняет акцент на личном действии Бога.
- source_word: נִלְחַם בָּם
  choice: сражался против них
  rationale: Глагол לחם с предлогом ב здесь означает борьбу против кого-либо; «сражался против них» исключает двусмысленность совместного действия.
theological_decisions:
- issue: Передача רוּחַ קָדְשׁוֹ
  choice: Его Святого Духа
  alternative: Его святой дух; дух Его святости
  rationale: Контекст допускает понимание Духа как личностного референта, которого можно огорчить, однако сама конструкция буквально означает «дух Его святости». Основной текст использует ясное библейское наименование, а сноска сохраняет лексическую неоднозначность.
- issue: Субъект וַיֵּהָפֵךְ и נִלְחַם
  choice: 'Бог: «Он стал им врагом и Сам сражался»'
  alternative: «Он обратился для них во врага»
  rationale: Мужской субъект естественно продолжает отсылку к Богу через суффикс «Его»; эмфатическое הוּא подчёркивает, что именно Он выступил против них. Формулировка не смягчает напряжённый образ Божьего суда.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Заглавные буквы в «Святого Духа» отражают личностное понимание референта, а не отдельный формальный признак еврейского текста. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с выбранным русским издательским регистром.
