base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/004.yaml
  text: For the day of vengeance was in my heart[a], and the year of my redeemed had come.
translation:
  language: ru
  text: Ибо день возмездия был в Моём сердце, и настал год Моих искупленных[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «год Моих искупленных». То есть год, относящийся к тем, кого Я искупил; по контексту это также может пониматься как время Моего искупительного действия.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предыдущего действия; «ибо» естественно передаёт причинно-пояснительную связь и сохраняет возвышенный, но понятный регистр.
- source_word: יוֹם נָקָם
  choice: день возмездия
  rationale: «День» сохраняет конкретный временной образ יוֹם, а «возмездие» передаёт судебно-карательный смысл נָקָם без оттенка личной мстительности, который в современном русском часто имеет слово «месть».
- source_word: בְּלִבִּי
  choice: у Меня в сердце
  rationale: Сохраняется древнееврейский образ сердца как средоточия внутреннего намерения и решимости; русская конструкция звучит естественнее буквального «в Моём сердце» в данном предложении.
- source_word: וּשְׁנַת
  choice: и год
  rationale: Сохранены сочинительная связь и временной параллелизм между «днём» и «годом».
- source_word: גְּאוּלַי
  choice: искупленных Мною
  rationale: 'Масоретская форма естественно понимается как субстантивированное множественное страдательное причастие с суффиксом первого лица: «Мои искупленные». Инструментальная конструкция «искупленных Мною» ясно выражает отношение к говорящему и естественно сочетается с «год».'
- source_word: בָּאָה
  choice: настал
  rationale: Женский перфект согласован с שְׁנַת; в русском о наступлении назначенного времени идиоматично говорится «год настал».
theological_decisions:
- issue: Значение גְּאוּלַי и связь суда со спасением
  choice: год искупленных Мною
  alternative: год Моего искупления
  rationale: Основной текст следует наиболее прямому морфологическому пониманию как обозначению людей, принадлежащих Искупителю или искупленных Им. Вариант с событием искупления отмечен в сноске, чтобы сохранить смысловую связь между Божьим возмездием и избавлением, не устраняя возможную неоднозначность выражения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавная буква в «Меня/Мною» обозначает божественного Говорящего по принятой русской издательской традиции. Параллелизм «день возмездия — год искупленных» сохранён.
