revisions:
- from: Ибо день возмездия был у Меня в сердце, и год искупленных Мною[a] настал.
  to: Ибо день возмездия был в Моём сердце, и настал год Моих искупленных[a].
  rationale: 'Исправлены стиль выражения «в сердце» и передача גְּאוּלַי: основной текст теперь сохраняет его наиболее прямое личное значение и характерную для оригинала сжатость. Сноска оставляет контекстуальное понимание, связанное с искупительным действием, но не приписывает абстрактное значение непосредственно грамматической форме.'
  reviewer_model: gpt-5.6-terra
