  text: כַּ/בְּהֵמָה֙ בַּ/בִּקְעָ֣ה תֵרֵ֔ד ר֥וּחַ יְהוָ֖ה תְּנִיחֶ֑/נּוּ כֵּ֚ן נִהַ֣גְתָּ עַמְּ/ךָ֔ לַ/עֲשׂ֥וֹת לְ/ךָ֖ שֵׁ֥ם תִּפְאָֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/014.yaml
  text: Like livestock going down into the valley[a], the Spirit of Yahweh gave them rest; so you led your people[c][b], to make for yourself a glorious name.
translation:
  language: ru
  text: Как скот спускается в долину, так Дух Яхве[a] даровал ему покой. Так Ты вёл Свой народ, чтобы сделать Себе славное имя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово רוּחַ может означать «дух», «ветер» или «дыхание». Буквально далее: «даровал ему покой»; единственное число, вероятно, относится к Израилю как к единому народу.'
    reason: Лексическая альтернатива и сохранение собирательного единственного числа.
  - marker: b
    text: 'Буквально: «чтобы сделать Себе имя славы»; возможно также: «славное имя».'
    reason: Более буквальная передача еврейской конструкции и её смысловая альтернатива.
lexical_decisions:
- source_word: כַּבְּהֵמָה
  choice: как скот
  rationale: Собирательное בְּהֵמָה обозначает домашних животных; «скот» естественно передаёт образ, не подразумевая диких зверей.
- source_word: בַּבִּקְעָה תֵרֵד
  choice: спускается в долину
  rationale: בִּקְעָה — долина или долинная равнина; при ירד предлог «в» ясно передаёт направленное движение вниз.
- source_word: רוּחַ יְהוָה
  choice: Дух Яхве
  rationale: В контексте воспоминания о Божьем водительстве רוּחַ вероятнее означает личное действие Божьего Духа; имя יהוה передано транслитерацией «Яхве».
- source_word: תְּנִיחֶנּוּ
  choice: даровал ему покой
  rationale: Форма гифиль от נוח означает «дать покой, привести к покою»; мужской суффикс единственного числа сохранён как собирательное обозначение Израиля.
- source_word: נִהַגְתָּ עַמְּךָ
  choice: Ты вёл Свой народ
  rationale: נהג здесь выражает руководство и водительство; «народ» сохраняет заветно-реляционный смысл עַם.
- source_word: לַעֲשׂוֹת לְךָ שֵׁם תִּפְאָרֶת
  choice: чтобы прославить Своё имя
  rationale: Целевая конструкция передана естественно по-русски; смысл «сделать Себе имя славы» выражен как обретение славы Божьим именем, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Референт единственного числа в תְּנִיחֶנּוּ
  choice: Сохранено «ему» как собирательное обозначение народа Израиля
  alternative: «даровал им покой»
  rationale: Еврейский суффикс однозначно стоит в мужском роде единственного числа, хотя по смыслу относится к народу как единому целому; перевод сохраняет эту грамматическую напряжённость.
- issue: Значение רוּחַ יְהוָה
  choice: «Дух Яхве»
  alternative: «ветер Яхве» или «дыхание Яхве»
  rationale: Контекст Божьего водительства и дарования покоя благоприятствует значению «Дух», но лексическая многозначность отмечена в сноске.
- issue: Смысл שֵׁם תִּפְאָרֶת
  choice: «прославить Своё имя»
  alternative: «создать Себе славное имя» или «имя славы»
  rationale: Выбран естественный русский целевой оборот без добавления конфессионального толкования; более буквальная конструкция сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сравнение оформлено коррелятивно («как… так»), чтобы ясно связать образ стада с действием Духа. Прописные местоимения при обращении к Богу использованы как традиционная русская издательская норма, не меняющая смысла текста.
