  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הַבֵּ֤ט מִ/שָּׁמַ֨יִם֙ וּ/רְאֵ֔ה מִ/זְּבֻ֥ל קָדְשְׁ/ךָ֖ וְ/תִפְאַרְתֶּ֑/ךָ אַיֵּ֤ה קִנְאָֽתְ/ךָ֙ וּ/גְב֣וּרֹתֶ֔/ךָ הֲמ֥וֹן מֵעֶ֛י/ךָ וְֽ/רַחֲמֶ֖י/ךָ אֵלַ֥/י הִתְאַפָּֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/015.yaml
  text: Look down from heaven and see[a], from your holy and glorious dwelling[c][b]. Where are your zeal and your mighty deeds? The stirring of your inward parts and your compassions are withheld from me.
translation:
  language: ru
  text: Взгляни с небес и посмотри из святого и славного жилища Твоего. Где ревность Твоя и могущественные деяния Твои? Волнение в глубине Твоей[a] и сострадание Твоё удерживаются от меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «шум (или волнение) внутренностей Твоих» — древнееврейский образ глубокого внутреннего чувства и сострадания.'
    reason: cultural_note
  - marker: b
    text: 'Или: «сдерживают себя по отношению ко мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט מִשָּׁמַיִם וּרְאֵה
  choice: Взгляни с небес и посмотри
  rationale: Сохраняет два повелительных глагола; направление взгляда вниз естественно следует из слов «с небес», поэтому отдельно не добавляется.
- source_word: מִזְּבֻל קָדְשְׁךָ וְתִפְאַרְתֶּךָ
  choice: из святого и славного жилища Твоего
  rationale: Передаёт возвышенное место пребывания и естественно преобразует еврейские отвлечённые существительные «святость» и «слава» в определения.
- source_word: קִנְאָתְךָ
  choice: ревность Твоя
  rationale: «Ревность» сохраняет многозначность קִנְאָה — пылкую, в том числе ревностную, приверженность — и в данном контексте звучит естественнее, чем «зависть» или пояснительное «рвение».
- source_word: גְבוּרוֹתֶיךָ
  choice: могущественные деяния Твои
  rationale: Множественное число указывает на проявления силы в действиях, а не только на отвлечённое могущество.
- source_word: הֲמוֹן מֵעֶיךָ
  choice: волнение в глубине Твоей
  rationale: Передаёт внутреннее движение чувств, избегая физиологически резкого буквального «внутренностей», но сохраняет образ глубинного переживания.
- source_word: רַחֲמֶיךָ
  choice: сострадание Твоё
  rationale: В русском собирательное единственное число естественно передаёт еврейское множественное с оттенком полноты милосердия.
- source_word: אֵלַי הִתְאַפָּקוּ
  choice: удерживаются от меня
  rationale: Возвратная форма сохраняет возможность понимать чувства как сдерживающие себя; «от меня» естественно сочетается с русским глаголом и передаёт контекстуальный смысл אֵלַי.
theological_decisions:
- issue: Антропопатический образ внутренних чувств Бога
  choice: «волнение в глубине Твоей» с пояснительной сноской
  alternative: «волнение внутренностей Твоих»; «сердечное волнение Твоё»
  rationale: Формулировка сохраняет образ глубокого внутреннего движения, не утверждая телесность Бога и не сводя выражение к отвлечённому понятию.
- issue: Значение божественной קִנְאָה
  choice: «ревность»
  alternative: «рвение»; «ревнивая любовь»
  rationale: «Ревность» сохраняет присущую еврейскому слову напряжённость и заветный оттенок, не ограничивая его одной интерпретацией.
- issue: Субъект и залог הִתְאַפָּקוּ
  choice: «удерживаются от меня»
  alternative: «Ты удерживаешь от меня»; «сдерживают себя по отношению ко мне»
  rationale: Возвратная формулировка следует грамматической форме и сохраняет поэтическое представление о внутренних чувствах и сострадании как о сдерживающихся.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным тоном. Местоимения, обращённые к Богу, написаны с прописной буквы по устойчивой русской библейской традиции. Синтаксический параллелизм и напряжённый вопрос оригинала сохранены.
