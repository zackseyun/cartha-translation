source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַךְ עַמִּ֣/י הֵ֔מָּה בָּנִ֖ים לֹ֣א יְשַׁקֵּ֑רוּ וַ/יְהִ֥י לָ/הֶ֖ם לְ/מוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/008.yaml
  text: For he said[a], “Surely they are my people, children who will not deal falsely”; so he became their Savior.
translation:
  language: ru
  text: 'И сказал Он: «Воистину, они — Мой народ, дети, которые не поступят лживо[a]». И стал Он для них Спасителем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не солгут»; возможно также: «не окажутся неверными».'
    reason: Лексема שׁקר в данной форме допускает как значение словесной лжи, так и более широкий смысл ложного или неверного поведения.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал Он
  rationale: Последовательная форма с וַ вводит продолжение повествования; русское «И сказал Он» непосредственно передаёт это движение и сохраняет торжественный, но современный библейский регистр.
- source_word: אַךְ
  choice: Воистину
  rationale: В данном контексте частица выражает уверенное утверждение, а не ограничение; «воистину» передаёт её усилительную силу.
- source_word: עַמִּי הֵמָּה
  choice: они — Мой народ
  rationale: Самостоятельное местоимение הֵמָּה подчёркивает отождествление; конструкция с тире естественно сохраняет это ударение по-русски.
- source_word: בָּנִים
  choice: дети
  rationale: Множественное число мужского рода обозначает здесь весь народ в отношениях с Богом, а не только сыновей мужского пола; «дети» сохраняет родственный смысл.
- source_word: לֹא יְשַׁקֵּרוּ
  choice: не поступят вероломно
  rationale: Форма породы пиэль от שׁקר может означать не только словесную ложь, но и ложное, неверное поведение; «поступят вероломно» передаёт более широкий нравственный и реляционный смысл.
- source_word: וַיְהִי לָהֶם
  choice: И стал Он для них
  rationale: Формулировка близко передаёт еврейскую конструкцию становления/обретения отношения, не заменяя её более истолковывающим оборотом.
- source_word: לְמוֹשִׁיעַ
  choice: Спасителем
  rationale: Причастное существительное от ישׁע означает того, кто спасает или избавляет; «Спаситель» естественно и точно передаёт здесь роль Бога.
theological_decisions:
- issue: Обозначение Бога словом לְמוֹשִׁיעַ
  choice: Спасителем
  alternative: избавителем
  rationale: «Спаситель» сохраняет богословскую весомость обозначения и одновременно прямо соответствует значению корня ישׁע, не привнося в стих более поздних доктринальных уточнений.
- issue: Передача בָּנִים по роду
  choice: дети
  alternative: сыновья
  rationale: Речь идёт обо всём народе как принадлежащем Богу; русское «дети» точно передаёт собирательный родственный смысл без неоправданного ограничения мужчинами.
- issue: Ожидание верности в לֹא יְשַׁקֵּרוּ
  choice: не поступят вероломно
  alternative: не солгут; не окажутся неверными
  rationale: Основной текст сохраняет широкий смысл ложного или неверного поведения, а примечание показывает реальную лексическую неоднозначность, не решая её односторонне.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Инверсия «сказал Он» и прописные местоимения поддерживают торжественный регистр; синтаксис остаётся ясным для современного читателя. Маркер [a] поставлен непосредственно при неоднозначном выражении.
