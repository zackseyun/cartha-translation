id: ISA.63.2
reference: Isaiah 63:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מַדּ֥וּעַ אָדֹ֖ם לִ/לְבוּשֶׁ֑/ךָ וּ/בְגָדֶ֖י/ךָ כְּ/דֹרֵ֥ךְ בְּ/גַֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/002.yaml
  text: Why is your clothing red[b][a], and your garments like one who treads in the winepress?
translation:
  language: ru
  text: Почему одежда твоя красна[a], и одеяния твои — как у того, кто топчет виноград в давильне?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покраснела», «багряна»; буквально еврейский текст говорит, что одежда красна, не указывая здесь причину.'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду человек, который ногами давит виноград; его одежда окрашивается красным виноградным соком.
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Почему
  rationale: Прямое и естественное вопросительное наречие, точно передающее причину, о которой спрашивает говорящий.
- source_word: אָדֹם
  choice: красна
  rationale: Еврейское прилагательное прямо обозначает красный цвет; перевод не добавляет не выраженного здесь значения «обагрена кровью».
- source_word: לִלְבוּשֶׁךָ
  choice: одежда твоя
  rationale: Передаёт общее значение одежды, не сужая его до одной конкретной части, например плаща.
- source_word: וּבְגָדֶיךָ
  choice: и одеяния твои
  rationale: Сохраняет поэтический параллелизм с «одежда» и звучит достойно в современном литературном русском языке.
- source_word: כְּדֹרֵךְ
  choice: как у того, кто топчет виноград
  rationale: Сравнение и причастное значение переданы естественной русской конструкцией; объект «виноград» уточнён из значения следующего слова и культурного образа винодельческой давильни.
- source_word: בְּגַת
  choice: в давильне
  rationale: גַּת обозначает место или устройство для выжимания винограда; «давильня» сохраняет древний образ и не смешивает его с сосудом для готового вина.
theological_decisions:
- issue: Следует ли прямо назвать красный цвет следами крови и суда
  choice: 'Сохранено буквальное описание цвета: «красна».'
  alternative: «обагрена кровью» или «в крови»
  rationale: В этом стихе причина красного цвета ещё не названа прямо; её раскрывает дальнейший контекст. Буквальный перевод сохраняет образную и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «одежда твоя», «одеяния твои» поддерживает библейскую поэтичность, оставаясь понятной. Все толковательные добавления вынесены в примечания.
