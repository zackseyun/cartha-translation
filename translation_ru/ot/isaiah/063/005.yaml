  text: וְ/אַבִּיט֙ וְ/אֵ֣ין עֹזֵ֔ר וְ/אֶשְׁתּוֹמֵ֖ם וְ/אֵ֣ין סוֹמֵ֑ךְ וַ/תּ֤וֹשַֽׁע לִ/י֙ זְרֹעִ֔/י וַ/חֲמָתִ֖/י הִ֥יא סְמָכָֽתְ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/005.yaml
  text: I looked[a], but there was no one to help; I was appalled, but there was no one to support. So my own arm brought me salvation[b], and my wrath—it upheld me.
translation:
  language: ru
  text: Я посмотрел — но некому было помочь; был потрясён[a] — но некому было поддержать. Тогда моя собственная рука принесла мне спасение[b], и моя ярость — она поддержала меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изумился». Еврейский глагол может обозначать ошеломлённое изумление или потрясение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «принесла мне победу». Еврейский глагол происходит от корня со значением «спасать, избавлять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַבִּיט
  choice: Я посмотрел
  rationale: Глагол נבט в породе hифиль обозначает направленный взгляд, осмотр. «Я посмотрел» естественно передаёт действие и не добавляет отсутствующего в тексте объекта.
- source_word: עֹזֵר
  choice: некому было помочь
  rationale: Причастие от עזר буквально указывает на помогающего; безличная русская конструкция естественно передаёт отсутствие кого-либо, кто мог бы помочь.
- source_word: וְאֶשְׁתּוֹמֵם
  choice: изумился
  rationale: Форма от שמם может выражать потрясённое изумление, ужас или оцепенение. «Изумился» сохраняет широту значения; более сильный оттенок отмечен в сноске.
- source_word: סוֹמֵךְ
  choice: некому было поддержать
  rationale: Причастие от סמך означает поддерживающего, опору. Безличная конструкция параллельна «некому было помочь».
- source_word: וַתּוֹשַׁע לִי זְרֹעִי
  choice: моя собственная рука принесла мне спасение
  rationale: Глагол от ישׁע с לִי описывает избавление, совершённое рукой говорящего для него самого. «Собственная» подчёркивает контекст полного отсутствия помощников, а «принесла мне спасение» сохраняет связь с корнем «спасать».
- source_word: וַחֲמָתִי
  choice: и моя ярость
  rationale: חֵמָה обозначает пылающий гнев, ярость. «Ярость» передаёт интенсивность образа в контексте суда.
- source_word: הִיא סְמָכָתְנִי
  choice: она поддержала меня
  rationale: Женское местоимение הִיא относится к существительному חֲמָתִי. Русское «она» естественно согласуется с «ярость», а «поддержала» сохраняет повтор корня סמך, уже представленного выше.
theological_decisions:
- issue: Божественное самоизбавление в антропоморфном образе
  choice: моя собственная рука принесла мне спасение
  alternative: моя рука принесла мне победу
  rationale: Текст изображает руку говорящего как средство избавления без человеческой помощи. Формулировка сохраняет антропоморфный образ и связь ישׁע со спасением, не сужая смысл до одной лишь военной победы.
- issue: Ярость как поддерживающая сила в совершении суда
  choice: моя ярость — она поддержала меня
  alternative: мой гнев укрепил меня
  rationale: 'Сохранён прямой и напряжённый образ: ярость говорящего выступает тем, что его поддерживает. Перевод не смягчает судебную образность и не превращает её лишь во внутреннее побуждение.'
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Параллелизм двух безличных конструкций сохранён; тире перед «она» подчёркивает вынесенное местоимение и напряжённость заключительной строки.
