  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: מִדְּרָכֶיךָ
  choice: от Твоих путей
  rationale: Предлог מִן обозначает удаление от путей Яхве.
- source_word: תַּקְשִׁיחַ
  choice: ожесточаешь
  rationale: Точно и естественно передаёт каузатив «делать жёстким» применительно к сердцу.
- source_word: לִבֵּנוּ
  choice: наше сердце
  rationale: Сохраняет единственное число еврейского текста и коллективный образ народа как единого целого.
- source_word: מִיִּרְאָתֶךָ
  choice: чтобы мы не боялись Тебя
  rationale: Естественно выражает отделение от благоговейного страха перед Богом как результат ожесточения.
- source_word: שׁוּב
  choice: Вернись
  rationale: Передаёт повелительное обращение с просьбой вновь обратиться к народу Своим благоволением и присутствием.
- source_word: לְמַעַן
  choice: ради
  rationale: Кратко и естественно выражает мотив просьбы — ради Божьих рабов.
- source_word: עֲבָדֶיךָ
  choice: Твоих рабов
  rationale: «Рабы» — традиционное и точное обозначение людей, принадлежащих Богу и служащих Ему; в данном молитвенном контексте оно не требует смягчения.
- source_word: שִׁבְטֵי
  choice: колен
  rationale: В сочетании с наследием обозначает племенные колена Израиля, а не жезлы или скипетры.
- source_word: נַחֲלָתֶךָ
  choice: Твоего наследия
  rationale: Сохраняет заветный образ Израиля как наследия, принадлежащего Яхве.
theological_decisions:
- issue: Божественная причинность в уклонении и ожесточении
  choice: 'Сохранена прямая причинная атрибуция Яхве: «заставляешь… уклоняться» и «ожесточаешь».'
  alternative: 'Смягчить до разрешительного смысла: «позволяешь нам уклоняться» или «допускаешь, чтобы наше сердце ожесточилось».'
  rationale: Обе еврейские глагольные формы каузативны. Молитва-жалоба намеренно сохраняет напряжение между Божьей властью и ответственностью народа; перевод не должен заранее разрешать его.
- issue: Коллективное единственное число «наше сердце»
  choice: Сохранено единственное число.
  alternative: «наши сердца»
  rationale: Масоретский текст содержит לִבֵּנוּ, буквально «наше сердце», а не множественное число. Эта форма представляет народ как единое целое и понятна по-русски.
- issue: Значение просьбы שׁוּב, обращённой к Богу
  choice: «Вернись» с пояснением возможного оттенка в сноске.
  alternative: «Обратись снова» или «повернись к нам».
  rationale: Основной перевод сохраняет краткость и прямоту повелительной формы, не исключая подразумеваемого возвращения Божьего благоволения.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Прямое обращение к Богу передано личным именем «Яхве»; местоимения обращения написаны с прописной буквы. Тире поясняет, что «колена Твоего наследия» находятся в приложении к «Твоим рабам», не добавляя нового смыслового отношения.
