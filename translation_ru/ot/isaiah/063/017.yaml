base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/017.yaml
  text: Why[a], Yahweh, do you make us wander from your ways and harden our hearts from fearing you? Return for the sake of your servants[c][b], the tribes of your inheritance.
translation:
  language: ru
  text: Почему[a], Яхве, Ты сбиваешь нас с Твоих путей и ожесточаешь наше сердце[b], так что мы не боимся Тебя? Вернись[c] ради Твоих рабов — колен Твоего наследия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Почему Ты заставляешь нас уклоняться от Твоих путей?» или «Почему Ты позволяешь нам уклоняться?» Еврейский глагол имеет каузативную форму: «делаешь так, что мы сбиваемся с пути». Молитва сохраняет напряжение между Божьей властью и уклонением Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «наше сердце» — единственное число, представляющее весь народ как одно целое.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «Обратись к нам снова». Это просьба к Богу вновь явить Своему народу благоволение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Почему
