source:
  edition: WLC
  text: פּוּרָ֣ה דָּרַ֣כְתִּי לְ/בַדִּ֗/י וּ/מֵֽ/עַמִּים֙ אֵֽין אִ֣ישׁ אִתִּ֔/י וְ/אֶדְרְכֵ֣/ם בְּ/אַפִּ֔/י וְ/אֶרְמְסֵ֖/ם בַּ/חֲמָתִ֑/י וְ/יֵ֤ז נִצְחָ/ם֙ עַל בְּגָדַ֔/י וְ/כָל מַלְבּוּשַׁ֖/י אֶגְאָֽלְתִּי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/003.yaml
  text: I have trodden the winepress alone[a], and from the peoples no man was with me; I trod them in my anger and trampled them in my wrath; their lifeblood spattered on my garments[b], and I stained all my clothing.
translation:
  language: ru
  text: Я один топтал точило[a], и из народов никого не было со Мной. Я топтал их в гневе Моём и попирал их в ярости Моей; их кровь брызнула на одежды Мои[b], и всё одеяние Моё Я запятнал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я топтал точило один, и из народов ни одного человека не было со Мной».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их жизненная кровь». Еврейское слово может напоминать о соке, текущем из винограда в точиле, и одновременно обозначать кровь тех, над кем совершается суд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוּרָה
  choice: точило
  rationale: Традиционное и точное русское название устройства для вытаптывания винограда; в сочетании с «топтал» ясно сохраняет метафору суда.
- source_word: דָּרַכְתִּי
  choice: Я топтал
  rationale: Глагол непосредственно обозначает топтание; русское прошедшее время естественно передаёт завершённое действие в яркой пророческой речи.
- source_word: לְבַדִּי
  choice: один
  rationale: Кратко и естественно подчёркивает, что говорящий действовал без чьей-либо помощи.
- source_word: וּמֵעַמִּים
  choice: из народов
  rationale: Сохраняет предлог מן и множественное число עַמִּים, указывая на отсутствие соучастника среди народов.
- source_word: אֵין אִישׁ אִתִּי
  choice: никого не было со Мной
  rationale: Естественная современная русская передача общего отрицания; смысл полного одиночества сохраняется, а буквальная форма с אִישׁ отмечена в сноске.
- source_word: וְאֶדְרְכֵם
  choice: Я топтал их
  rationale: Повтор «топтал» сохраняет связь с тем же еврейским корнем и развивает образ точила, в котором объектом становятся народы.
- source_word: בְּאַפִּי
  choice: в гневе Моём
  rationale: אַף здесь идиоматически означает гнев; формулировка ясна и сохраняет личный характер речи.
- source_word: וְאֶרְמְסֵם
  choice: и попирал их
  rationale: Отдельный глагол передаёт усиление действия и сохраняет поэтический параллелизм, не смешиваясь с повтором דרך.
- source_word: בַּחֲמָתִי
  choice: в ярости Моей
  rationale: Передаёт интенсивный, пылающий гнев и отличает חֵמָה от предшествующего אַף.
- source_word: וְיֵז
  choice: брызнула
  rationale: Передаёт резкий выброс жидкости; форма единственного числа согласована с собирательным существительным «кровь».
- source_word: נִצְחָם
  choice: их кровь
  rationale: В контексте суда слово обозначает кровь поражённых, одновременно вызывая ассоциацию с соком винограда; образная двусмысленность пояснена в сноске.
- source_word: בְּגָדַי
  choice: на одежды Мои
  rationale: «Одежды» соответствует возвышенному поэтическому регистру и естественно сочетается с образом брызг.
- source_word: וְכָל מַלְבּוּשַׁי אֶגְאָלְתִּי
  choice: и всё одеяние Моё Я запятнал
  rationale: «Одеяние» позволяет отразить лексическое различие между בֶּגֶד и מַלְבּוּשׁ; «запятнал» передаёт загрязнение кровью без смягчения образа.
theological_decisions:
- issue: Образ Божественного Воина и суда
  choice: Сохранена прямая речь от первого лица, а также насильственная метафора точила, гнева, ярости и крови.
  alternative: Передать сцену отвлечённо как образ победы или смягчить язык Божественного гнева.
  rationale: Еврейский текст изображает личное и единоличное совершение суда в предельно ярких образах. Перевод не устраняет напряжение между Божественной справедливостью и яростью и не добавляет конфессионального толкования.
- issue: Мужской singular אִישׁ в общем отрицании
  choice: В основном тексте употреблено естественное русское «никого», а буквальная форма отмечена в сноске.
  alternative: «Ни одного человека не было со Мной» или более буквально «не было со Мной мужчины».
  rationale: В отрицательной конструкции אֵין אִישׁ местоимение «никого» точно передаёт идиоматический смысл и по-русски не ограничивает утверждение взрослыми мужчинами. Сноска сохраняет прозрачность формы оригинала.
- issue: Значение נִצְחָם внутри метафоры точила
  choice: В основном тексте — «их кровь», с пояснением виноградной ассоциации в сноске.
  alternative: «Их жизненная кровь», «их сок» или сохранение неопределённого «их струя».
  rationale: Речь идёт о суде над народами, поэтому референтом выступает кровь, однако образ точила позволяет слышать и ассоциацию с виноградным соком. Сноска сохраняет эту намеренную образную напряжённость.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Повтор «топтал» намеренно сохраняет еврейскую игру корня דרך; «попирал» усиливает параллельное действие. Прописные местоимения при обращении к Богу соответствуют принятому русскому библейскому регистру. Все сноски обозначены в основном тексте.
