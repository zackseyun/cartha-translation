  source_fidelity: 'Основная мысль передана верно: ישראל уподобился народам, над которыми Бог не осуществлял власти и на которых не было наречено Его имя; далее следует страстное пожелание Божьего сошествия и образ гор, тающих/текущих перед Ним. «Растаяли бы горы» удачно сохраняет конкретный поэтический образ נזל. Однако «кто ... назывался Твоим именем» по-русски может означать лишь употребление имени как названия и не вполне передаёт пассивный оборот «Твоё имя было наречено над ними».'
