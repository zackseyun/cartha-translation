  text: הָיִ֗ינוּ מֵֽ/עוֹלָם֙ לֹֽא מָשַׁ֣לְתָּ בָּ֔/ם לֹֽא נִקְרָ֥א שִׁמְ/ךָ֖ עֲלֵי/הֶ֑ם לוּא קָרַ֤עְתָּ שָׁמַ֨יִם֙ יָרַ֔דְתָּ מִ/פָּנֶ֖י/ךָ הָרִ֥ים נָזֹֽלּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/019.yaml
  text: We have become like those over whom you have never ruled[a], those who were never called by your name. If only you would tear open the heavens and come down[b]; before you the mountains would quake.
translation:
  language: ru
  text: Мы стали как те, над кем Ты никогда не властвовал[a], над кем никогда не было наречено Твоё имя. О, если бы Ты разорвал небеса и сошёл! Перед Тобой растаяли бы горы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над кем Ты не властвовал издревле». Еврейская фраза допускает разные способы связи слова «издревле» с остальной частью предложения.'
    reason: textual_ambiguity
  - marker: b
    text: 'Буквально: «горы потекли бы»; возможно также: «горы содрогнулись бы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִינוּ
  choice: Мы стали
  rationale: Перфект 1-го лица множественного числа здесь естественно передаёт нынешнее состояние как результат предшествующих событий.
- source_word: מֵעוֹלָם לֹא מָשַׁלְתָּ בָּם
  choice: как те, над кем Ты никогда не властвовал
  rationale: Сжатая еврейская фраза трудна; сравнительное «как те» и «никогда» естественно передают мысль о людях, издревле не знавших Божьей власти.
- source_word: לֹא נִקְרָא שִׁמְךָ עֲלֵיהֶם
  choice: кто никогда не назывался Твоим именем
  rationale: Сохранён библейский образ имени, наречённого над людьми, который выражает принадлежность и отождествление, но сформулирован по-русски понятно.
- source_word: לוּא
  choice: О, если бы
  rationale: Передаёт сильное желание и напряжённость молитвенного плача без архаизации.
- source_word: קָרַעְתָּ שָׁמַיִם
  choice: Ты разорвал небеса
  rationale: Глагол קרע означает «разрывать»; форма понимается в сфере желания, заданной частицей לוּא.
- source_word: יָרַדְתָּ
  choice: сошёл
  rationale: В сочетании с לוּא перфект выражает желаемое действие; «сошёл» естественно для молитвенной речи.
- source_word: מִפָּנֶיךָ
  choice: Перед Тобой
  rationale: Буквально «от лица/присутствия Твоего»; «перед Тобой» кратко передаёт воздействие Божьего явления.
- source_word: הָרִים נָזֹלּוּ
  choice: растаяли бы горы
  rationale: נזל буквально обозначает течение; применительно к горам образ естественно передаётся как таяние, сохраняя поэтическую теофаническую картину точнее, чем обобщённое «содрогнулись бы».
theological_decisions:
- issue: Принадлежность Богу в выражении «Твоё имя было наречено над ними»
  choice: кто никогда не назывался Твоим именем
  alternative: над кем никогда не было наречено Твоё имя
  rationale: Выбранная формулировка передаёт принадлежность и отождествление с Богом, не сводя оборот лишь к произнесению имени и не добавляя конфессионального толкования.
- issue: Реакция гор на Божье явление
  choice: растаяли бы горы
  alternative: содрогнулись бы горы
  rationale: Сохранён конкретный образ глагола נזל — горы словно текут или тают перед Божьим присутствием; возможный образ содрогания отмечен в сноске без устранения исходной поэтической напряжённости.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но не архаичным молитвенно-поэтическим звучанием. Местоимения, обращённые к Богу, даны с прописной буквы согласно распространённой русской библейской традиции.
