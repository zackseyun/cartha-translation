  text: חַֽסְדֵ֨י יְהוָ֤ה אַזְכִּיר֙ תְּהִלֹּ֣ת יְהוָ֔ה כְּ/עַ֕ל כֹּ֥ל אֲשֶׁר גְּמָלָ֖/נוּ יְהוָ֑ה וְ/רַב טוּב֙ לְ/בֵ֣ית יִשְׂרָאֵ֔ל אֲשֶׁר גְּמָלָ֥/ם כְּֽ/רַחֲמָ֖י/ו וּ/כְ/רֹ֥ב חֲסָדָֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/007.yaml
  text: I will recount the steadfast love of Yahweh[a], the praises of Yahweh, according to all that Yahweh has bestowed on us[c][b], and the great goodness to the house of Israel that he has bestowed on them according to his compassion and according to the abundance of his steadfast love.
translation:
  language: ru
  text: Я расскажу о милостях[a] Яхве[b], о достохвальных деяниях Яхве[d] — обо всём, чем Яхве одарил нас[c], и о великой благости, явленной дому Израиля, которой Он одарил их по Своему состраданию и по множеству Своих милостей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о проявлениях верной любви». Еврейское חסד означает милость, преданную любовь и верность в отношениях.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское יהוה — личное имя Бога; традиционно передаётся как «Господь».
    reason: alternative_reading
  - marker: c
    text: 'Или: «как щедро Яхве поступил с нами».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «о хвалах Яхве». Еврейское תְּהִלּוֹת может обозначать как хвалы, так и деяния, вызывающие хвалу.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְדֵי / חֲסָדָיו
  choice: милостях / Своих милостей
  rationale: חסד обозначает верную, деятельную и устойчивую любовь, особенно в отношениях завета. Русское «милость» естественно в контексте Божьих благодеяний; множественное число сохраняет еврейскую форму и указывает на многочисленные проявления этой любви.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного Божьего имени транслитерацией сохраняет отличие имени יהוה от титула «Господь».
- source_word: אַזְכִּיר
  choice: я расскажу
  rationale: В породе хифиль и данном хвалебном контексте глагол означает не только внутренне помнить, но словесно упоминать и перечислять совершённое Богом.
- source_word: תְּהִלֹּת
  choice: деяниях… достойных хвалы
  rationale: Множественное תהלות может обозначать как хвалы, так и качества или дела, вызывающие хвалу. Выбранная формулировка естественна по-русски и сохраняет связь с последующим перечислением Божьих благодеяний.
- source_word: כְּעַל כֹּל אֲשֶׁר
  choice: обо всём, чем
  rationale: Оборот вводит основание и содержание провозглашаемой хвалы; русская формулировка передаёт эту связь без жёсткого сведения её только к причине или мере.
- source_word: גְּמָלָנוּ
  choice: одарил нас
  rationale: В контексте Божьей благости גמל означает благотворное действие или щедрое воздаяние. «Одарил» ясно передаёт благой характер действия.
- source_word: וְרַב טוּב
  choice: и о великой благости
  rationale: Формулировка сохраняет как усилительное значение רב, так и нравственно-благотворный смысл טוב.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: к дому Израиля
  rationale: Сохранено традиционное собирательное обозначение народа завета «дом Израиля» и направительный оттенок предлога ל.
- source_word: גְּמָלָם
  choice: которую Он явил им
  rationale: Повторное גמל передано естественным русским выражением, связанным с «благостью»; местоимение «им» сохраняет переход еврейского текста от «нас» к «им».
- source_word: כְּרַחֲמָיו
  choice: по Своему состраданию
  rationale: רחמים выражает глубокое, нежное сострадание; собирательное единственное число естественно для современного русского языка.
- source_word: וּכְרֹב חֲסָדָיו
  choice: и по множеству Своих милостей
  rationale: «Множество» передаёт количественный оттенок רֹב, а повтор «милостей» сохраняет лексическую связь с началом стиха.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, а не титул. Транслитерация сохраняет это различие; традиционная замена титулом отмечена в сноске.
- issue: Смысл חסד
  choice: милость, понимаемая как верная и неизменная любовь
  alternative: верная любовь; заветная верность
  rationale: Слово объединяет доброту, преданность и устойчивость отношений. «Милость» звучит естественно и достойно по-русски, а сноска сохраняет более широкий заветный оттенок без навязывания узкого толкования.
- issue: Референт תְּהִלֹּת
  choice: деяния, достойные хвалы
  alternative: хвалы
  rationale: Еврейское множественное число допускает указание и на произносимые хвалы, и на славные качества или дела Бога. Контекст перечисления благодеяний поддерживает второй смысл, однако подлинная неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Сохранены «дом Израиля», личное имя «Яхве» и переход от первого лица множественного числа («нас») к третьему («им»). Конструкция «деяния… достойные хвалы» устраняет неестественное русское «хвалы Яхве», не скрывая смысловой неоднозначности исходного слова.
