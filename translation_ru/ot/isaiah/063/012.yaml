  text: кто вёл Свою славную руку справа от Моисея, кто рассёк перед ними воды, чтобы создать Себе вечное имя,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: вёл
  rationale: Причастие каузативной породы буквально допускает «заставлял идти / направлял»; в данном поэтическом контексте естественное «вёл» сохраняет образ Божьего руководства.
- source_word: זְרוֹעַ תִּפְאַרְתּוֹ
  choice: Свою славную руку
  rationale: Сохранён библейский образ «руки» как силы и могущества; притяжательное местоимение относится к Богу.
- source_word: לִימִין מֹשֶׁה
  choice: по правую руку Моисея
  rationale: Передаёт пространственный образ еврейского выражения и не уточняет сверх текста, была ли эта рука рядом с Моисеем или действовала через него.
- source_word: בּוֹקֵעַ מַיִם
  choice: рассёк ... воды
  rationale: Глагол בקע означает раскалывать, рассекать; форма причастия продолжает ряд характеристик действующего Бога.
- source_word: לַעֲשׂוֹת לוֹ שֵׁם עוֹלָם
  choice: чтобы создать Себе вечное имя
  rationale: Буквально сохранены целевая конструкция, возвратная отнесённость к Богу и идея непреходящей славы.
theological_decisions:
- issue: Кто или что находится по правую руку Моисея
  choice: «Свою славную руку по правую руку Моисея»
  alternative: «Моисея Своей славной рукой»
  rationale: Еврейский порядок слов непосредственно связывает Божью «славную руку» с правой стороной Моисея; образ сохранён без богословского переосмысления.
- issue: Значение Божьего «вечного имени»
  choice: Сохранено буквальное выражение «вечное имя»
  alternative: «вечную славу»
  rationale: Хотя «имя» здесь включает известность и славу, буквальная метафора богословски значима и понятна в контексте.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической образности. Прописное «Свою/Себе» применено как традиционный русский знак отнесения местоимений к Богу; пунктуация продолжает синтаксический ряд соседнего контекста.
