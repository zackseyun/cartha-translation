lexical_decisions:
- source_word: אָבוּס
  choice: топтал
  rationale: Глагол בוס означает топтать, попирать ногами. «Топтал» прямо передаёт образ давильни и не ослабляет картину суда.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число עַם обозначает народы или племенные общности; «народы» естественно по-русски и не вызывает узкой ассоциации с современными государствами.
- source_word: בְּאַפִּי
  choice: в гневе Моём
  rationale: אַף буквально связано с носом или ноздрями, но здесь идиоматически означает гнев.
- source_word: וַאֲשַׁכְּרֵם
  choice: опьянял их
  rationale: Порода piel глагола שׁכר означает «делать пьяным, опьянять». Формулировка сохраняет связь с образом вина и давильни.
- source_word: בַּחֲמָתִי
  choice: в ярости Моей
  rationale: חֵמָה обозначает ярость, гнев, пыл. «Ярость» сохраняет усиленный оттенок и отличает слово от אַף, переданного как «гнев».
- source_word: וְאוֹרִיד
  choice: пролил
  rationale: Hiphil глагола ירד буквально означает «низвести, заставить спуститься». При жидком объекте и направлении на землю русское «пролил» естественно выражает образ, хотя конкретизирует способ движения; буквальный компонент отражён в примечании к спорному объекту.
- source_word: לָאָרֶץ
  choice: на землю
  rationale: В данном образе жидкость падает или проливается на землю; это естественная русская передача направления לָאָרֶץ.
- source_word: נִצְחָם
  choice: их кровь
  rationale: Редкое и спорное נֵצַח здесь может обозначать вытекающую при раздавливании жидкость. В контексте суда «кровь» передаёт вероятный смысл, а альтернативы сохранены в примечании.
theological_decisions:
- issue: Передача образа Божьего суда как топтания в давильне
  choice: Сохранены топтание, опьянение и пролитие крови без смягчения образа.
  alternative: Более буквально передать последнюю часть как «низвёл на землю их сок».
  rationale: Контекст соединяет образ раздавленного винограда с кровопролитием. Основной текст должен быть понятным, но примечание сохраняет лексическую неопределённость נִצְחָם и не превращает вероятное толкование в бесспорное.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Заглавные буквы в местоименных формах «Моём», «Моей» указывают на божественного Говорящего согласно принятой русской библейской традиции; лексически различены אַף («гнев») и חֵמָה («ярость»).
