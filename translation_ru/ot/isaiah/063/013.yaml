lexical_decisions:
- source_word: מוֹלִיכָם
  choice: вёл их
  rationale: Причастие породы хифиль от הלך с местоименным суффиксом 3-го лица множественного числа продолжает описание того, как Господь направлял народ. В русском контексте личная глагольная форма звучит естественно и сохраняет связь с предшествующим повествованием.
- source_word: בַּתְּהֹמוֹת
  choice: через бездны
  rationale: Множественное число תְּהוֹמוֹת обозначает глубины, особенно водные. Предлог и контекст исхода указывают на движение через них, однако слово «море» в перевод не добавляется.
- source_word: כַּסּוּס
  choice: словно коня
  rationale: Сравнительная частица כ и существительное в единственном числе образуют сравнение. В сочетании с «вёл их» винительный падеж «коня» естественно передаёт образ того, кого ведут.
- source_word: בַּמִּדְבָּר
  choice: по пустыне
  rationale: מִדְבָּר означает пустынную, необжитую местность. Русское «по пустыне» естественно описывает беспрепятственное движение коня и сохраняет отзвук повествования об исходе.
- source_word: לֹא יִכָּשֵׁלוּ
  choice: они не спотыкались
  rationale: Нифаль имперфекта от כשל означает «спотыкаться, оступаться». Самостоятельная клауза без добавления целевого союза ближе передаёт синтаксическую неопределённость еврейского текста.
theological_decisions:
- issue: Образ пути исхода через море
  choice: Передать תְּהֹמוֹת как «бездны», не вставляя прямо слово «море».
  alternative: «через глубокие воды» или «через море»
  rationale: Контекст ясно отсылает к переходу при исходе, но само еврейское слово шире по значению, чем «море». Выбранный вариант сохраняет исходный образ и не делает подразумеваемое уточнение частью основного текста.
- issue: Связь заключительной клаузы с предшествующим сравнением
  choice: «они не спотыкались» как отдельное утверждение
  alternative: «так что они не спотыкались»
  rationale: Еврейский текст не содержит явного союза цели или следствия. Отдельная клауза сохраняет возможную смысловую связь, не закрепляя её грамматически.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Словно» делает сравнение плавным, а тире отделяет заключительное утверждение, не добавляя отсутствующей в еврейском тексте причинно-следственной связки.
