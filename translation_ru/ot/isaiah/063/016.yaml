id: ISA.63.16
reference: Isaiah 63:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אָבִ֔י/נוּ כִּ֤י אַבְרָהָם֙ לֹ֣א יְדָעָ֔/נוּ וְ/יִשְׂרָאֵ֖ל לֹ֣א יַכִּירָ֑/נוּ אַתָּ֤ה יְהוָה֙ אָבִ֔י/נוּ גֹּאֲלֵ֥/נוּ מֵֽ/עוֹלָ֖ם שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/016.yaml
  text: For you are our Father[a], though Abraham does not know us and Israel does not acknowledge us; you, O Yahweh, are our Father[b]; our Redeemer from of old is your name.
translation:
  language: ru
  text: Ведь Ты — наш Отец, хотя Авраам не знает нас и Израиль[a] нас не признаёт. Ты, Яхве, — наш Отец; «Наш Искупитель издревле» — Твоё имя.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «Израиль», вероятно, означает патриарха Иакова, получившего имя Израиль; он назван параллельно Аврааму.
    reason: cross_reference
  - marker: b
    text: 'Или: «„Наш Искупитель от века“ — Твоё имя».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ведь / хотя
  rationale: Первое כִּי вводит основание мольбы («ведь»), а второе в данном контексте естественно имеет уступительный смысл («хотя»).
- source_word: אָבִינוּ
  choice: наш Отец
  rationale: Передаёт прямое обращение к Богу и сохраняет личный и заветный смысл, а не только идею происхождения.
- source_word: יְדָעָנוּ
  choice: не знает нас
  rationale: Сохраняет обычное значение ידע и оттенок отсутствия личного признания или близости.
- source_word: יַכִּירָנוּ
  choice: нас не признаёт
  rationale: Передаёт каузативную форму נכר и отличает её от предшествующего «не знает», не устраняя поэтический параллелизм.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя транслитерацией, а не заменяет его титулом.
- source_word: גֹּאֲלֵנוּ
  choice: Наш Искупитель
  rationale: Кратко и естественно передаёт избавление, выраженное корнем גאל; возможный родственный оттенок не делается явным без достаточного основания в самом стихе.
- source_word: מֵעוֹלָם
  choice: издревле
  rationale: Сохраняет значение глубокой древности и не вынуждает понимать выражение исключительно как метафизическую вечность.
- source_word: שְׁמֶךָ
  choice: Твоё имя
  rationale: Именная конструкция передана естественным русским предложением с тире; титул характеризует имя и известность Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Временной смысл מֵעוֹלָם
  choice: издревле
  alternative: от века / от вечности
  rationale: Слово допускает как указание на отдалённую древность, так и более сильный смысл вечности. Основной текст не снимает эту смысловую напряжённость, а альтернативный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Местоимения, обращённые к Богу, написаны с прописной буквы. Параллелизм между Авраамом и Израилем, а также между двумя утверждениями «наш Отец» сохранён.
