source:
  edition: WLC
  text: דִּרְשׁ֨וּ מֵֽ/עַל סֵ֤פֶר יְהוָה֙ וּֽ/קְרָ֔אוּ אַחַ֤ת מֵ/הֵ֨נָּה֙ לֹ֣א נֶעְדָּ֔רָה אִשָּׁ֥ה רְעוּתָ֖/הּ לֹ֣א פָקָ֑דוּ כִּֽי פִ/י֙ ה֣וּא צִוָּ֔ה וְ/רוּח֖/וֹ ה֥וּא קִבְּצָֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/016.yaml
  text: 'Search in the book of Yahweh and read: not one of these will be missing[a]; none will lack her mate. For his mouth has commanded[b], and his Spirit has gathered them.'
translation:
  language: ru
  text: 'Исследуйте книгу Яхве и прочтите: ни одной из них не будет недоставать, ни одна не останется без своей пары. Ибо мои уста повелели[a], и Его Дух собрал их[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мои уста — они повелели». Некоторые переводы передают: «Его уста повелели».'
    reason: Сохранение необычной смены первого лица на третье и значимой синтаксической альтернативы.
  - marker: b
    text: 'Или: «Его дыхание»; возможно также: «Его ветер собрал их».'
    reason: Сохранение смыслового диапазона еврейского слова רוּחַ.
lexical_decisions:
- source_word: דִּרְשׁוּ מֵעַל סֵפֶר יְהוָה
  choice: Обратитесь к книге Яхве
  rationale: Императив דִּרְשׁוּ призывает внимательно исследовать или свериться с письменным свидетельством. «Обратитесь к книге» естественно передаёт этот смысл по-русски, а имя יהוה воспроизведено как «Яхве».
- source_word: וּקְרָאוּ
  choice: и прочтите
  rationale: В сочетании с упоминанием книги קרא означает чтение, вероятно чтение вслух; нейтральное «прочтите» не добавляет отсутствующей в тексте детали.
- source_word: אַחַת מֵהֵנָּה לֹא נֶעְדָּרָה
  choice: ни одной из них не будет недоставать
  rationale: Форма единственного женского рода имеет распределительное значение и отсылает к перечисленным ранее существам. Будущее время естественно выражает достоверность предсказанного.
- source_word: אִשָּׁה רְעוּתָהּ לֹא פָקָדוּ
  choice: ни одна не останется без своей пары
  rationale: Буквальная конструкция «самка — её подруга/пара» в контексте животных указывает на соответствующую пару. Русская формулировка сохраняет женский распределительный образ и смысл отсутствия нехватки.
- source_word: כִּי פִי הוּא צִוָּה
  choice: Ведь мои уста повелели
  rationale: Масоретский текст буквально содержит «мои уста». Первое лицо сохранено, несмотря на последующий переход к третьему лицу, чтобы не сглаживать реальное напряжение исходного текста.
- source_word: וְרוּחוֹ
  choice: и Его Дух
  rationale: רוּחַ может означать дух, дыхание или ветер. В параллели с повелением и действием собирания «Дух» хорошо передаёт действующую Божественную силу; иные значения отмечены в сноске.
- source_word: קִבְּצָן
  choice: собрал их
  rationale: Перфект קבץ с объектным суффиксом передаёт совершённое или несомненное собирание; прошедшее «собрал» прямо отражает форму и пророческую уверенность высказывания.
theological_decisions:
- issue: Смена лица в заключительной фразе
  choice: «мои уста повелели, и Его Дух собрал их»
  alternative: «Его уста повелели, и Его Дух собрал их» или «мои уста повелели, и мой Дух собрал их»
  rationale: В еврейском тексте стоит первое лицо в פִי («мои уста») и третье лицо в רוּחוֹ («Его Дух»). Перевод сохраняет эту смену, не выравнивая её ради гладкости и не вкладывая в неё конфессионального толкования.
- issue: Значение רוּחַ применительно к Божественному действию
  choice: «Дух»
  alternative: «дыхание» или «ветер»
  rationale: Контекст допускает несколько значений слова. Основной текст выбирает «Дух» как наиболее естественное обозначение действующей силы Яхве, а лексическую неоднозначность сохраняет сноска.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Формулировка сохраняет пророческую торжественность, женский распределительный образ в описании существ и заметную смену грамматического лица в заключении.
