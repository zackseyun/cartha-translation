base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/004.yaml
  text: All the host of heaven will rot away[a], and the skies will be rolled up like a scroll; all their host will wither like a leaf withers from the vine[e][d][c][b], and like a withered fig from the fig tree.
translation:
  language: ru
  text: Всё небесное воинство истлеет[a], небеса свернутся, как свиток[b], и всё их воинство увянет[c], как увядающий лист с виноградной лозы и как увядающий плод со смоковницы.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «растворится», «исчезнет». Древнееврейский глагол может обозначать истощение, разложение или растворение.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «свиток», может также означать книгу или письменный документ; образ сворачивания указывает именно на свиток.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «всё их воинство» — вероятно, небесные светила, принадлежащие небесам.'
    reason: lexical_alternative
  - marker: d
    text: 'Образ может подчёркивать не только увядание, но и последующее опадание: «как лист опадает с виноградной лозы и как плод — со смоковницы».'
    reason: alternative_reading
lexical_decisions:
- source_word: נָמַקּוּ
  choice: истлеет
  rationale: Глагол в нифале обозначает истощение, разложение или растворение. «Истлеет» сохраняет яркий телесный образ и уместно в возвышенной пророческой речи.
- source_word: צְבָא הַשָּׁמַיִם
  choice: небесное воинство
  rationale: Сохраняет широкий древнееврейский образ небесного сонма, прежде всего звёзд и иных небесных тел, не сводя его однозначно к одному референту.
- source_word: וְנָגֹלּוּ כַסֵּפֶר הַשָּׁמָיִם
  choice: небеса свернутся, как свиток
  rationale: Глагол גלל передаёт сворачивание, а סֵפֶר в данном образе естественно означает свиток; перевод сохраняет конкретность сравнения.
- source_word: וְכָל צְבָאָם
  choice: и всё их воинство
  rationale: Местоименный суффикс соотносится с небесами. Буквенная связь сохранена без уточняющей подстановки «звёзды».
- source_word: יִבּוֹל
  choice: увянет
  rationale: נבל обычно описывает увядание или поблекновение растительности; «увянет» поддерживает последующие образы листа и смоквы.
- source_word: כִנְבֹל עָלֶה מִגֶּפֶן וּכְנֹבֶלֶת מִתְּאֵנָה
  choice: как увядает лист на виноградной лозе и смоква на смоковнице
  rationale: Передана растительная образность и лексическая связь с נבל. В основном тексте акцент сделан на увядании, а возможный оттенок опадания отмечен в сноске.
theological_decisions:
- issue: Характер космической образности суда
  choice: Передать картину космического распада прямо, не сводя её к простой политической метафоре и не превращая перевод в утверждение одной эсхатологической схемы.
  alternative: Понимать язык либо исключительно как метафору падения земных держав, либо исключительно как буквальное астрономическое описание.
  rationale: Пророческая поэзия допускает одновременно космическую и символическую силу образа; перевод должен сохранить эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Сохранены повторы «небеса / небесное» и «воинство», поскольку они структурируют древнееврейский образ; архаизмы, кроме устойчивого и прозрачного слова «свиток», не используются.
