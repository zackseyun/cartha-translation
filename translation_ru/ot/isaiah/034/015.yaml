  naturalness: Исправленная формулировка звучит естественно в современном литературном русском и сохраняет сжатый пророческий ритм. «Под своей тенью» яснее передаёт защитный смысл בְּצִלָּהּ, чем «в своей тени».
  terminology: «Змея-стрела» допустима только со сноской, поскольку קִפּוֹז — hapax и точная идентификация спорна. «Коршуны» соответствует вероятному значению דַּיּוֹת; альтернативы сохранены в сноске. «Каждый со своей парой» адекватно передаёт распределительное «одна с подругой своей», не навязывая толкования характера пары.
