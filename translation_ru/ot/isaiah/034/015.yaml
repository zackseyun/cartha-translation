base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/015.yaml
  text: There the arrow snake will nest and lay eggs[a], and hatch them, and gather them in her shadow; indeed, there the kites will gather[c][b], each with her mate.
translation:
  language: ru
  text: Там угнездится змея-стрела[a], отложит яйца, выведет детёнышей и соберёт их под своей тенью[b]. Да, там соберутся коршуны[c], каждый со своей парой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское קִפּוֹז обозначает неизвестное существо; его также понимают как сову или другое животное пустыни.
    reason: alternative_reading
  - marker: b
    text: 'Или: «и будет высиживать (или согревать) их в своей тени».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «стервятники»; возможно, шире — «хищные птицы».'
    reason: alternative_reading
lexical_decisions:
- source_word: קִפּוֹז
  choice: змея-стрела
  rationale: Название существа встречается в еврейской Библии только здесь и остаётся неясным. Вариант «змея-стрела» передаёт возможный образ стремительно движущейся змеи, не выдавая его за точное зоологическое определение; неопределённость отмечена в сноске.
- source_word: קִנְּנָה
  choice: угнездится
  rationale: Глагол קנן означает «устраивать гнездо, гнездиться». Будущее время естественно продолжает пророческое описание грядущего запустения.
- source_word: וַתְּמַלֵּט
  choice: отложит яйца
  rationale: Глагол обозначает рождение или произведение потомства. В сочетании с гнездованием и последующим בקע контекстуально уместно конкретизировать образ как откладывание яиц.
- source_word: וּבָקְעָה
  choice: высидит их
  rationale: בקע буквально связано с раскалыванием или прорывом; применительно к яйцам речь идёт об их выведении. Русское «высидит их» естественно передаёт действие матери, при котором детёныши вылупляются.
- source_word: וְדָגְרָה בְצִלָּהּ
  choice: и укроет в своей тени
  rationale: דגר может описывать собирание, высиживание или укрывание выводка. Вместе с «в своей тени» выражение создаёт образ матери, защищающей потомство; более буквальная возможность дана в сноске.
- source_word: אַךְ
  choice: да
  rationale: Частица здесь усиливает уверенность утверждения, а не вводит ограничение; русское «да» кратко и естественно сохраняет это подчёркивание.
- source_word: דַיּוֹת
  choice: коршуны
  rationale: Слово обычно относят к коршунам либо шире к падальщикам и хищным птицам. «Коршуны» — наиболее конкретный вероятный эквивалент, а неопределённость отражена в сноске.
- source_word: אִשָּׁה רְעוּתָהּ
  choice: каждый со своей парой
  rationale: Буквально выражение означает «каждая со своей спутницей» и служит распределительной формулой. «Каждый со своей парой» естественно по-русски передаёт попарное присутствие птиц, не уточняя сверх текста характер пары.
