  source_fidelity: 'Смысловые компоненты исходного текста переданы верно: объяснительный כִּי, два параллельных выражения Божьего гнева, направленных на народы и их военную силу, а также два совершенных глагола суда. Однако «предал их заклятию» в современном русском преимущественно вызывает представление о магическом проклятии и потому неясно передаёт הֶחֱרִימָם.'
