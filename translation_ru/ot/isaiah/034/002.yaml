revisions:
- from: Ибо гнев Яхве — на все народы, и ярость Его — на всё их воинство[a]. Он предал их заклятию[b], отдал их на заклание.
  to: Ибо гнев Яхве — против всех народов, и ярость Его — против всего их войска[a]. Он обрёк их на уничтожение[b], отдал их на заклание.
