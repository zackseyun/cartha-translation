  text: כִּ֣י קֶ֤צֶף לַֽ/יהוָה֙ עַל כָּל הַ/גּוֹיִ֔ם וְ/חֵמָ֖ה עַל כָּל צְבָאָ֑/ם הֶחֱרִימָ֖/ם נְתָנָ֥/ם לַ/טָּֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/002.yaml
  text: For Yahweh has indignation against all the nations[a], and wrath against all their host; he has devoted them to destruction[b]; he has given them over to the slaughter.
translation:
  language: ru
  text: Ибо гнев Яхве — против всех народов, и ярость Его — против всего их войска[a]. Он обрёк их на уничтожение[b], отдал их на заклание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против всего их воинства».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предал их херему» или «поставил их под запрет». Еврейский глагол обозначает предание уничтожению по Божьему суду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт пояснительное основание для предшествующего призыва и сохраняет торжественный пророческий строй.
- source_word: קֶצֶף
  choice: гнев
  rationale: Обозначает сильный, имеющий судебную направленность Божий гнев; отличается от следующего חֵמָה без искусственного усложнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עַל כָּל הַגּוֹיִם
  choice: на все народы
  rationale: Сочетание «гнев на» естественно для русского языка; גּוֹיִם здесь означает народы вообще.
- source_word: וְחֵמָה
  choice: и ярость
  rationale: Передаёт образ пылающего гнева и сохраняет различие между двумя близкими еврейскими существительными.
- source_word: עַל כָּל צְבָאָם
  choice: на всё их воинство
  rationale: צָבָא — собирательное обозначение войска или организованной силы; «воинство» сохраняет широту и возвышенный регистр оригинала.
- source_word: הֶחֱרִימָם
  choice: Он предал их заклятию
  rationale: Форма Hiphil от חרם обозначает предание под херем — на уничтожение по Божьему суду; «заклятие» сохраняет особый судебно-сакральный оттенок.
- source_word: נְתָנָם
  choice: отдал их
  rationale: Передаёт совершившееся судебное вручение или предание без лишнего уточнения.
- source_word: לַטָּבַח
  choice: на заклание
  rationale: Естественно и образно передаёт существительное טֶבַח — массовое умерщвление, заклание.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет это, не подменяя имя титулом.
- issue: Смысл הֶחֱרִימָם
  choice: предал их заклятию
  alternative: обрёк их на уничтожение; полностью уничтожил их
  rationale: Глагол חרם здесь выражает не только уничтожение, но и предание под особый запрет ради уничтожения как акт Божьего суда. Формулировка сохраняет этот оттенок, а сноска поясняет его современному читателю.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Параллелизм двух полустиший сохранён; «гнев» и «ярость» различают два близких еврейских слова. Редкое слово «заклятие» оставлено ради особого смысла חרם и разъяснено в сноске.
