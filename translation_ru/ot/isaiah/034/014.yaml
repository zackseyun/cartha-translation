  text: וּ/פָגְשׁ֤וּ צִיִּים֙ אֶת אִיִּ֔ים וְ/שָׂעִ֖יר עַל רֵעֵ֣/הוּ יִקְרָ֑א אַךְ שָׁם֙ הִרְגִּ֣יעָה לִּילִ֔ית וּ/מָצְאָ֥ה לָ֖/הּ מָנֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/014.yaml
  text: And desert creatures will meet with hyenas[a], and the goat-demon will call to its fellow; indeed[b], there Lilith will settle down and find a resting place for herself.
translation:
  language: ru
  text: Пустынные звери встретятся с гиенами[a], и демон-козёл будет звать своего собрата; да, там Лилит[b] успокоится и обретёт себе место отдыха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с шакалами»; точное значение еврейского названия животного неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: «Лилит» можно также передать как «ночное существо» или «ночное чудовище»; в некоторых старых переводах — «сова».
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיִּים
  choice: пустынные звери
  rationale: Слово обозначает существ, населяющих пустыни и опустевшие развалины, без уверенного указания на конкретный вид.
- source_word: אִיִּים
  choice: гиены
  rationale: Возможное обозначение пустынных падальщиков; точная зоологическая идентификация спорна, поэтому вариант «шакалы» дан в сноске.
- source_word: שָׂעִיר
  choice: козлоподобный демон
  rationale: В контексте жуткого запустения слово, вероятно, имеет сверхъестественный оттенок, а не обозначает просто козла; описательная передача не привносит образ античного сатира.
- source_word: עַל רֵעֵהוּ יִקְרָא
  choice: будет звать своего сородича
  rationale: Передаёт призыв к другому существу того же рода и естественно звучит применительно к описываемым существам.
- source_word: אַךְ
  choice: да
  rationale: Краткая усилительная частица сохраняет эмфатическую силу еврейского слова и не перегружает фразу.
- source_word: הִרְגִּיעָה
  choice: успокоится
  rationale: Передаёт значение прекращения движения и обретения покоя, сохраняя связь с последующим «местом покоя».
- source_word: לִּילִית
  choice: Лилит
  rationale: Редкое и спорное слово передано транслитерацией, чтобы сохранить возможный мифический оттенок и не навязывать сомнительную зоологическую идентификацию.
- source_word: מָנוֹחַ
  choice: место покоя
  rationale: Передаёт как состояние покоя, так и конкретное место, где существо обосновывается.
theological_decisions:
- issue: Следует ли устранять сверхъестественный или мифический оттенок образов пустыни
  choice: Сохранить вероятный сверхъестественный оттенок в выражении «козлоподобный демон» и имени «Лилит».
  alternative: Истолковать оба обозначения как названия обычных пустынных животных или птиц.
  rationale: Картина суда намеренно изображает опустевшую землю как место обитания зловещих существ. Такая передача сохраняет силу еврейского текста, не утверждая при этом развитой демонологии, о которой сам стих не говорит.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Сохранены параллелизм, зловещая образность пророчества и лексическая неопределённость редких названий существ.
