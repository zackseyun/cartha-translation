  source_fidelity: 'Передача в целом точно отражает еврейский текст: множественные пустынные существа, неопределённое название гиен/шакалов, призыв существа к собрату, эмфатическое «אַךְ», а также спорное לִּילִית сохранены. «Козлоподобный демон» несколько смещает значение שָׂעִיר к внешнему сходству, тогда как в данном контексте уместнее прямо передать образ «демона-козла».'
