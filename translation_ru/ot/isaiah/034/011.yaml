  yaml_path: translation/ot/isaiah/034/011.yaml
  text: The desert owl and the hedgehog will possess her[a], and the owl and the raven will dwell in her[b]; he will stretch over her the measuring line of desolation and the plumb stones of emptiness.
translation:
  language: ru
  text: Пеликан и ёж завладеют ею[a], сова и ворон поселятся в ней; он протянет над ней мерный шнур хаоса и камни отвеса пустоты[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точно определить названных здесь животных невозможно. «Пеликан» также переводят как «пустынная сова» или «баклан», а «ёж» — как «дикобраз» или «выпь».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мерный шнур то́ху и камни бо́ху». Эти слова перекликаются с Бытие 1:2 и изображают землю, возвращённую к хаосу и пустоте, словно порядок творения обращён вспять.'
    reason: cross_reference
lexical_decisions:
- source_word: וִירֵשׁוּהָ
  choice: завладеют ею
  rationale: Глагол ירשׁ может означать «наследовать», «владеть», «завладеть». В контексте опустошённой земли «завладеют» передаёт её переход к диким животным, не создавая оттенка законного наследования.
- source_word: קָאַת
  choice: пеликан
  rationale: Точная идентификация птицы неизвестна. «Пеликан» — традиционный и понятный русский эквивалент; неопределённость отражена в сноске.
- source_word: קִפּוֹד
  choice: ёж
  rationale: Название животного спорно; «ёж» — традиционный и естественный русский вариант, а возможные альтернативы указаны в сноске.
- source_word: יַנְשׁוֹף
  choice: филин
  rationale: Слово, вероятно, обозначает одну из ночных птиц семейства совиных. «Филин» сохраняет образ крупной птицы, обитающей среди развалин, без чрезмерно узкой зоологической конкретизации.
- source_word: עֹרֵב
  choice: ворон
  rationale: Обычный эквивалент еврейского עֹרֵב, соответствующий образам запустения.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: поселятся в ней
  rationale: שׁכן обозначает проживание или обитание. «Поселятся» естественно передаёт устойчивое обитание животных на разорённой земле.
- source_word: וְנָטָה עָלֶיהָ
  choice: Он протянет над ней
  rationale: В еврейском тексте стоит форма третьего лица мужского рода единственного числа без явно названного подлежащего; контекст указывает на Бога как совершающего суд. Местоимение сохраняет грамматику исходного текста без поясняющей вставки.
- source_word: קַו תֹהוּ
  choice: мерный шнур хаоса
  rationale: קַו — шнур для измерения, а תֹהוּ означает бесформенность, пустынность или хаос. «Хаос» сохраняет отзвук Бытия 1:2 и образ намеренно отмеренного опустошения.
- source_word: וְאַבְנֵי בֹהוּ
  choice: камни отвеса пустоты
  rationale: Буквально — «камни пустоты»; в параллели с мерным шнуром камни понимаются как грузила отвеса. Формулировка сохраняет одновременно измерительный образ и слово בֹהוּ — «пустота».
theological_decisions:
- issue: Отсылка к языку творения в сочетании תֹהוּ и בֹהוּ
  choice: «хаоса» и «пустоты» в основном тексте с пояснением отсылки в сноске
  alternative: «запустения» и «пустоты» либо «безвидности» и «пустоты»
  rationale: Сочетание намеренно перекликается с Бытие 1:2 и изображает суд как возвращение земли к состоянию неустроенности. Прямые слова «хаос» и «пустота» сохраняют эту богословскую напряжённость, не сводя образ лишь к разорению.
- issue: Неявное подлежащее глагола וְנָטָה
  choice: «Он протянет»
  alternative: «будет протянут» или «протянут»
  rationale: Форма глагола активная и имеет подлежащее мужского рода единственного числа; ближайший контекст книги указывает на Господа как Судью. Перевод не добавляет имени, которого нет в стихе, но сохраняет личное действие.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены женские местоимения, относящиеся к разорённой земле Эдома, параллелизм двух пар животных и технический образ измерительных орудий. Термины «мерный шнур» и «камни отвеса» достаточно ясны современному читателю и не устраняют необычность исходной метафоры.
