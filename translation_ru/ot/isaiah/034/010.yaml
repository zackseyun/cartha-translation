base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/010.yaml
  text: Night and day it shall not be quenched; its smoke shall go up forever[a]. From generation to generation it shall lie waste; forever and ever no one shall pass through it.
translation:
  language: ru
  text: 'Ни ночью, ни днём не угаснет;

    её дым будет вечно подниматься.


    Из поколения в поколение она будет лежать опустошённой[a];

    во веки веков никто не пройдёт через неё.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «она будет пустынной».'
    reason: 'Лексическая альтернатива для תֶּחֱרָב: глагол может обозначать как опустошение, так и состояние запустения.'
lexical_decisions:
- source_word: לַיְלָה וְיוֹמָם לֹא תִכְבֶּה
  choice: Ни ночью, ни днём не угаснет
  rationale: Отрицательная русская конструкция «ни… ни…» естественно передаёт непрерывность действия. Глагол כבה означает, что огонь перестаёт гореть; субъект оставлен подразумеваемым, как и в еврейском тексте.
- source_word: לְעוֹלָם יַעֲלֶה עֲשָׁנָהּ
  choice: вечно будет подниматься её дым
  rationale: עלה с עָשָׁן обозначает поднимающийся дым, а לְעוֹלָם сохраняет усиленное указание на неограниченную длительность. Женское местоимение соотносится с землёй Эдома в контексте.
- source_word: מִדּוֹר לָדוֹר
  choice: Из поколения в поколение
  rationale: Устойчивое и понятное русское выражение точно передаёт последовательность сменяющих друг друга поколений.
- source_word: תֶּחֱרָב
  choice: она будет лежать в запустении
  rationale: Глагол חרב здесь описывает землю, остающуюся разорённой и безлюдной. Формулировка передаёт результирующее длительное состояние и поддерживает параллель со следующей строкой.
- source_word: לְנֵצַח נְצָחִים
  choice: во веки веков
  rationale: Традиционное, но понятное современному читателю русское выражение сохраняет эмфатическое удвоение и торжественный пророческий регистр.
- source_word: אֵין עֹבֵר בָּהּ
  choice: никто не пройдёт по ней
  rationale: Конструкция אֵין с причастием выражает отсутствие проходящих через эту землю; будущее время по-русски соответствует контексту пророчества о результате суда.
theological_decisions:
- issue: Продолжительность суда в пророческом изречении
  choice: 'Сохранить прямые и усиленные обозначения длительности: «вечно» и «во веки веков».'
  alternative: Передать их как ограниченную гиперболическую длительность, например «долгие века».
  rationale: Сочетание עוֹלָם и נֵצַח נְצָחִים намеренно усиливает представление о непрекращающемся опустошении. Перевод не должен заранее ослаблять или догматически переопределять эту пророческую риторику.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Параллелизм четырёх строк сохранён; архаизирующее «во веки веков» употреблено как живое устойчивое выражение, а не ради искусственной стилизации.
