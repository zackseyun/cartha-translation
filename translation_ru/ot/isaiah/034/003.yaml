  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/חַלְלֵי/הֶ֣ם יֻשְׁלָ֔כוּ וּ/פִגְרֵי/הֶ֖ם יַעֲלֶ֣ה בָאְשָׁ֑/ם וְ/נָמַ֥סּוּ הָרִ֖ים מִ/דָּמָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/003.yaml
  text: Their slain will be thrown out[a], and the stench of their corpses will rise[c][b]; the mountains will melt from their blood.
translation:
  language: ru
  text: Их убитые будут выброшены[a], и от их трупов поднимется смрад[b]; горы растают от их крови[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут брошены прочь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поднимется их зловоние».'
    reason: lexical_alternative
  - marker: c
    text: 'Это гиперболический язык пророчества о суде: кровопролитие изображено столь огромным, что от крови растают даже горы.'
    reason: cultural_note
lexical_decisions:
- source_word: חַלְלֵיהֶם
  choice: их убитые
  rationale: Существительное חָלָל обозначает павших, пронзённых или убитых, особенно в контексте войны и суда; «убитые» естественно и точно передаёт смысл.
- source_word: יֻשְׁלָכוּ
  choice: будут выброшены
  rationale: Страдательная форма от שׁלך передаёт насильственное выбрасывание; формулировка также сохраняет оттенок бесчестия — тела остаются без погребения.
- source_word: פִגְרֵיהֶם
  choice: их трупов
  rationale: פֶּגֶר означает мёртвое тело, труп; выбранное слово сохраняет намеренно мрачную выразительность текста.
- source_word: יַעֲלֶה בָאְשָׁם
  choice: поднимется смрад
  rationale: עלה буквально означает «подниматься», а בָּאְשָׁם — «их зловоние, смрад»; русская формулировка сохраняет образ и принадлежность запаха упомянутым трупам.
- source_word: וְנָמַסּוּ
  choice: растают
  rationale: מסס означает «таять, растворяться»; буквальный образ не заменён объясняющей парафразой.
- source_word: הָרִים
  choice: горы
  rationale: Обычное значение הָרִים — «горы»; оно сохраняет космический масштаб пророческого образа.
- source_word: מִדָּמָם
  choice: от их крови
  rationale: Предлог מן допускает значение источника или причины; «от их крови» сохраняет эту смысловую ёмкость и формальную близость к еврейскому тексту.
theological_decisions:
- issue: Характер образа Божьего суда
  choice: 'Сохранён резкий гиперболический образ: горы «растают» от крови.'
  alternative: 'Передать объяснительно: «горы будут залиты их кровью».'
  rationale: Еврейский текст изображает суд через потрясающую картину бойни и распада космического масштаба. Смягчающая парафраза устранила бы намеренное напряжение образа.
translation_notes:
  register: Современный литературный русский язык; тон возвышенный и суровый, но синтаксис доступен обычному читателю. Графичность и неоднозначность еврейского текста сохранены без конфессионального истолкования.
