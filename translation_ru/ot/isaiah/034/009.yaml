lexical_decisions:
- source_word: נֶהֶפְכוּ
  choice: превратятся
  rationale: Нифаль перфекта הפך в пророческой речи передаёт будущее превращение; русское «превратятся» естественно выражает этот результат, хотя формально не является страдательной конструкцией.
- source_word: נְחָלֶיהָ
  choice: её потоки
  rationale: נחל может обозначать поток, русло сезонного потока или вади. «Потоки» понятно современному читателю и сохраняет образ водных русел; географическая неоднозначность отмечена в сноске.
- source_word: זֶפֶת
  choice: смола
  rationale: זפת обозначает смолу или битум. «Смола» — ясный, традиционно узнаваемый и образный русский эквивалент; «битум» звучал бы более технически.
- source_word: עֲפָרָהּ
  choice: её прах
  rationale: עפר означает прах, пыль или рыхлую землю. «Прах» сохраняет возвышенный пророческий регистр и резкий образ превращения самой земной материи.
- source_word: גָפְרִית
  choice: сера
  rationale: גפרית — сера; это точный и современный русский термин без необходимости в архаическом эквиваленте.
- source_word: אַרְצָהּ
  choice: её земля
  rationale: ארץ здесь означает землю или территорию народа, над которым совершается суд. «Её земля» естественно сохраняет олицетворение.
- source_word: בֹּעֵרָה
  choice: пылающей
  rationale: Причастие בֹּעֵרָה описывает горящую смолу. «Пылающей» передаёт интенсивный зрительный образ и согласуется с формой творительного падежа после «станет».
theological_decisions:
- issue: Олицетворение осуждаемой земли посредством суффиксов женского рода
  choice: 'Последовательно сохранить женский род: «её»'
  alternative: 'Передать безлично: «её» заменить конструкциями «тамошние» или повтором «земли»'
  rationale: Еврейский текст трижды использует суффиксы 3-го лица женского рода, поддерживая олицетворение Эдома или его земли. Русское «её» сохраняет эту литературную особенность, не уточняя сверх текста, относится ли образ к стране, земле или народу.
translation_notes:
  register: Современный литературный русский с dignified пророческой образностью. «Прах» слегка возвышенно, но общеупотребительно в библейском контексте; синтаксис сохраняет трёхчастный параллелизм оригинала.
