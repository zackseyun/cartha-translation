  text: Её потоки[a] превратятся в смолу, её прах — в серу[b], и её земля станет пылающей смолой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «русла потоков»; еврейское слово может обозначать поток, его русло или вади — обычно пересыхающую долину.'
