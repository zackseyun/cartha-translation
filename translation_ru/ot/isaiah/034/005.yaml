base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/005.yaml
  text: For my sword is drenched in the heavens[a]; behold, it will descend on Edom, on the people of my ban[b], for judgment.
translation:
  language: ru
  text: Ибо Мой меч напился вдоволь на небесах[a]. Вот, он сойдёт на Эдом, на народ, преданный Мною уничтожению[b], для суда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мой меч насытился на небесах»; еврейский глагол может изображать меч напившимся вдоволь или пропитанным.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «народ Моего херема» — народ, посвящённый уничтожению по Божьему приговору.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт пояснительно-причинную связь с контекстом, не исключая усилительного оттенка еврейской частицы.
- source_word: רִוְּתָה
  choice: напоён
  rationale: Сохраняет олицетворяющий образ от корня רוה — «насытиться, напиться вдоволь, пропитаться». По-русски «меч напоён» звучит поэтично и намеренно необычно, не уточняя без основания, чем именно он напоён.
- source_word: בַשָּׁמַיִם
  choice: на небесах
  rationale: Сохраняет множественную форму и космический масштаб образа.
- source_word: חַרְבִּי
  choice: Мой меч
  rationale: Прямая передача существительного с местоименным суффиксом; прописная буква указывает на речь Бога согласно русской библейской издательской традиции.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественная современная русская частица, привлекающая внимание к последующему действию без архаизации.
- source_word: עַל אֱדֹום תֵּרֵד
  choice: он сойдёт на Эдом
  rationale: Сохраняет пространственный образ меча, сходящего с небес на Эдом, и не заменяет его более общим «выступит против».
- source_word: עַם חֶרְמִי
  choice: народ, преданный Мною уничтожению
  rationale: Передаёт חֵרֶם как посвящение или обречение на уничтожение в контексте Божьего суда; буквальное «народ Моего заклятия» в современном русском двусмысленно и может быть понято лишь как словесное проклятие.
- source_word: לְמִשְׁפָּט
  choice: для суда
  rationale: Сохраняет юридическую сторону מִשְׁפָּט и целевое значение предлога לְ.
theological_decisions:
- issue: Значение חֵרֶם в контексте Божьего суда
  choice: народ, преданный Мною уничтожению
  alternative: народ под Моим заклятием; народ Моего заклятия
  rationale: Формулировка передаёт суровый смысл посвящения уничтожению по приговору Бога, но не сводит термин к проклятию и не привносит конфессиональной интерпретации.
- issue: Неуказанный объект насыщения меча
  choice: не добавлять «кровью» в основной текст
  alternative: Мой меч напился крови; Мой меч пропитан кровью
  rationale: В данном стихе еврейский текст не называет кровь. Сохранение необычного образа «напоён» оставляет эту поэтическую недосказанность, хотя контекст суда допускает кровавую ассоциацию.
translation_notes:
  register: Современный литературный русский с возвышенной пророческой образностью. Сохранены краткость, небесная перспектива и юридическая лексика оригинала; архаическое «се» заменено естественным «вот». Местоимения, относящиеся к Богу, написаны с прописной буквы по распространённой русской библейской традиции.
