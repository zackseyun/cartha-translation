base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/017.yaml
  text: And he himself has cast the lot for them[a], and his hand has apportioned it to them by line; they will possess it forever[b]; from generation to generation they will dwell in it.
translation:
  language: ru
  text: И Он сам бросил для них жребий, и Его рука разделила её между ними мерным шнуром[a]. Навеки они будут владеть ею[b]; из поколения в поколение будут жить на ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по мерной линии».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «унаследуют её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: И Он Сам
  rationale: Самостоятельное местоимение несёт смысловое ударение; «Он Сам» сохраняет этот акцент.
- source_word: הִפִּיל לָהֶן גּוֹרָל
  choice: бросил для них жребий
  rationale: Устойчивое сочетание буквально передаёт образ распределения по жребию; местоимение оставлено без уточняющего существительного, как в еврейском тексте.
- source_word: וְיָדוֹ
  choice: и Его рука
  rationale: Сохранён антропоморфный образ непосредственного действия Бога.
- source_word: חִלְּקַתָּה לָהֶם
  choice: распределила её между ними
  rationale: Глагол חלק в контексте наделения территорией означает распределение; местоимение женского рода отсылает к земле или области, названной в контексте, но не добавленной прямо в стих.
- source_word: בַּקָּו
  choice: по мерной линии
  rationale: קָו обозначает линию или шнур, применяемые при измерении и разделе земли; выбранный вариант сохраняет образ размежевания.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Естественно и ёмко передаёт продолжительность без архаизации.
- source_word: יִירָשׁוּהָ
  choice: они будут владеть ею
  rationale: ירשׁ может означать наследование или вступление во владение; здесь значение владения лучше соответствует образу земельного надела, а вариант «унаследуют» отмечен в сноске.
- source_word: לְדוֹר וָדוֹר
  choice: из поколения в поколение
  rationale: Устойчивый современный русский эквивалент распределительного оборота.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: будут жить на ней
  rationale: Передаёт длительное обитание естественным современным русским языком; предлог «на» соответствует подразумеваемой земле.
theological_decisions:
- issue: К кому относятся местоимения в образе распределения земли
  choice: Сохранить местоимения без добавления названий животных или птиц.
  alternative: Прямо назвать диких животных и птиц, перечисленных в ближайшем контексте.
  rationale: Контекст указывает на животных и птиц, заселяющих опустошённый Эдом, однако сам стих употребляет только местоимения. Перевод не устраняет эту формальную неоднозначность добавлением отсутствующих существительных.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Сохранены параллелизм, образ жребия, Божьей руки и размежевания земли.
