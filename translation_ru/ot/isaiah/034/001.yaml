base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/001.yaml
  text: Come near[a], nations, to hear; and listen, peoples. Let the earth hear, and all that fills it[b], the world and all its offspring.
translation:
  language: ru
  text: Приблизьтесь, народы, чтобы услышать; племена, внимайте! Пусть услышит земля и всё, что наполняет её, мир и все его порождения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё его потомство»; возможно также: «всё, что от него происходит» или «всё, что он производит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבוּ
  choice: Приблизьтесь
  rationale: Повелительная форма множественного числа передаёт призыв подойти ближе; «приблизьтесь» естественно и достойно звучит в пророческом обращении.
- source_word: גוֹיִם
  choice: народы
  rationale: В данном всемирном обращении слово обозначает народы вообще, а не «язычников» в более позднем конфессиональном смысле.
- source_word: לִשְׁמֹעַ
  choice: чтобы услышать
  rationale: Инфинитив выражает цель приближения и сохраняет связь с повторением корня שמע далее в стихе.
- source_word: לְאֻמִּים
  choice: племена
  rationale: Близкий синоним к גוים. Различение «народы / племена» сохраняет поэтический параллелизм и избегает механического повтора.
- source_word: הַקְשִׁיבוּ
  choice: внимайте
  rationale: Hiphil-повелительное от קשׁב призывает не просто слышать, а слушать внимательно; «внимайте» кратко и уместно для возвышенной пророческой речи.
- source_word: תִּשְׁמַע
  choice: пусть услышит
  rationale: Имперфект имеет юссивный оттенок; конструкция «пусть услышит» передаёт обращённый ко всему творению призыв.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Универсальный контекст, усиленный словом «мир», указывает на всю землю, а не на отдельную страну.
- source_word: מְלֹאָהּ
  choice: всё, что наполняет её
  rationale: Передаёт совокупность всего содержащегося на земле естественным современным русским выражением.
- source_word: תֵּבֵל
  choice: мир
  rationale: Обозначает обитаемый, устроенный мир; «мир» является естественным русским эквивалентом в этом параллелизме.
- source_word: כָל צֶאֱצָאֶיהָ
  choice: всё, что из него происходит
  rationale: צאצאים обозначает потомство или то, что выходит, произрастает из чего-либо. Формулировка сохраняет широту и порождающий образ, не ограничивая значение только людьми либо только земными плодами.
