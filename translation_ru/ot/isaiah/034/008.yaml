base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/008.yaml
  text: For Yahweh has a day of vengeance[a], a year of recompense for Zion’s cause.
translation:
  language: ru
  text: Ибо у Яхве — день возмездия, год воздаяния за тяжбу Сиона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Ибо для Яхве — день возмездия, год воздаяния за дело Сиона».'
    reason: Предлог לְ при имени Яхве допускает передачу отношения как «для Яхве» наряду с «у Яхве»; רִיב может обозначать тяжбу, спор или судебное дело.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего описания суда; «ибо» естественно передаёт пояснительно-причинную связь и соответствует достоинству пророческой речи.
- source_word: יוֹם נָקָם
  choice: день отмщения
  rationale: Сохраняется временной образ «дня» и судебно-карательный смысл נָקָם; «отмщение» здесь звучит естественнее и торжественнее, чем бытовая «месть».
- source_word: לַיהוָה
  choice: у Яхве
  rationale: Предлог לְ допускает значение принадлежности или отношения. Русская конструкция «у Яхве — день» ясно передаёт, что это назначенное Яхве время суда, не устраняя исходной смысловой гибкости.
- source_word: שְׁנַת שִׁלּוּמִים
  choice: год воздаяния
  rationale: Форма множественного числа שִׁלּוּמִים имеет отвлечённо-усилительный смысл выплаты по заслугам; русское единственное число «воздаяния» естественно передаёт этот смысл и сохраняет параллель «день — год».
- source_word: לְרִיב צִיּוֹן
  choice: за дело Сиона
  rationale: רִיב может обозначать спор, тяжбу, судебное дело или правое дело стороны. «Дело Сиона» сохраняет юридический оттенок и остаётся понятным современному читателю, не уточняя сверх текста, выступает ли Сион истцом или пострадавшей стороной.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Традиционная и общепонятная русская передача географического и богословски значимого имени.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит тетраграмматон; «Яхве» передаёт личное заветное имя и соответствует принятому для проекта решению.
- issue: Смысл конструкции לַיהוָה
  choice: 'принадлежность/отношение: «у Яхве — день отмщения»'
  alternative: «для Яхве день отмщения»; «Яхве назначил день отмщения»
  rationale: Исходная конструкция без выраженной глагольной связки допускает несколько близких прочтений. Основной текст передаёт принадлежность, не добавляя явно идею назначения, а примечание сохраняет альтернативную синтаксическую возможность.
- issue: Юридический смысл רִיב применительно к Сиону
  choice: дело Сиона
  alternative: тяжба Сиона; судебное дело Сиона
  rationale: Выбранная формулировка сохраняет образ судебного разбирательства, но не навязывает более узкую реконструкцию роли Сиона в нём.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим звучанием. Синтаксический параллелизм «день… год…» сохранён; архаизирующие формы сведены к уместному библейскому термину «отмщение».
