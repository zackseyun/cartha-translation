source:
  edition: WLC
  text: וְ/יָרְד֤וּ רְאֵמִים֙ עִמָּ֔/ם וּ/פָרִ֖ים עִם אַבִּירִ֑ים וְ/רִוְּתָ֤ה אַרְצָ/ם֙ מִ/דָּ֔ם וַ/עֲפָרָ֖/ם מֵ/חֵ֥לֶב יְדֻשָּֽׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/007.yaml
  text: Wild oxen will fall with them[a], and young bulls with the mighty ones; their land will be drenched with blood[b], and their dust made rich with fat.
translation:
  language: ru
  text: И падут с ними дикие быки[a], и молодые быки — с могучими[b]; их земля напитается кровью, и пыль их будет насыщена жиром.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ориксы». Еврейское слово רְאֵמִים обозначает мощное дикое животное из бычьих; точный вид неизвестен.'
    reason: lexical_alternative
  - marker: b
    text: «Могучие» могут означать сильных воинов или, в образном ряду стиха, могучих быков; возможны оба оттенка.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: и падут
  rationale: В основном значении глагол передаёт движение вниз, но в контексте кровавого суда естественно означает гибель, то есть «падут».
- source_word: רְאֵמִים
  choice: дикие быки
  rationale: Точный вид животного не установлен; речь идёт о крупном и сильном диком животном, вероятно из бычьих. «Дикие быки» ясно передаёт образ без устаревшего «единороги».
- source_word: עִמָּם
  choice: вместе с ними
  rationale: Сохранена местоименная отсылка без искусственного уточнения её адресата.
- source_word: וּפָרִים
  choice: и молодые быки
  rationale: פָּר обозначает быка, нередко молодого; этот выбор сохраняет оттенок исходного слова и образ массового заклания.
- source_word: אַבִּירִים
  choice: могучими
  rationale: Слово может обозначать сильных людей, в том числе властителей или воинов, а также в данном образном ряду сильных быков. Субстантивированное «могучими» сохраняет эту неоднозначность.
- source_word: וְרִוְּתָה
  choice: пропитается
  rationale: Глагол выражает насыщение влагой или питьё досыта; применительно к земле и крови «пропитается» естественно и наглядно.
- source_word: אַרְצָם
  choice: их земля
  rationale: Передаёт территорию подвергнутых суду и сохраняет обычное значение אֶרֶץ.
- source_word: מִדָּם
  choice: кровью
  rationale: Русский творительный падеж естественно обозначает то, чем пропитывается земля.
- source_word: וַעֲפָרָם
  choice: а прах их
  rationale: «Прах» сохраняет конкретный поэтический образ עָפָר и более точно, чем обобщённое «почва», отражает лексику стиха.
- source_word: מֵחֵלֶב
  choice: жиром
  rationale: Речь идёт о жире закланных; творительный падеж естественно передаёт вещество, которым обогащается прах.
- source_word: יְדֻשָּׁן
  choice: обогатится
  rationale: Буквальный образ связан с утучнением или насыщением жиром. «Обогатится» передаёт смысл применительно к земле, не создавая неестественного выражения «прах станет тучным».
theological_decisions:
- issue: Буквальный и метафорический смысл образов животных
  choice: Сохранить названия животных и одновременно не исключать их образного отношения к гибели сильных и властных.
  alternative: Истолковать всех животных только как жертвенный скот либо заменить их названия прямыми обозначениями человеческих правителей и воинов.
  rationale: В Ис 34 переплетаются образы жертвоприношения и поля битвы. Еврейский текст допускает многослойность, поэтому перевод не сводит её к одному толкованию.
- issue: Значение אַבִּירִים
  choice: могучими
  alternative: могучими быками; воинами; вельможами
  rationale: Нейтральное субстантивированное прилагательное сохраняет возможность как человеческого, так и животного референта и не снимает напряжение поэтического параллелизма.
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической интонацией. Сохранены параллелизм, жестокая образность суда и неоднозначность слова «могучие». «Прах» выбран как понятное библейско-поэтическое слово, а не как архаизм.
