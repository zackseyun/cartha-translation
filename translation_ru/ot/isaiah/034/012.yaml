  yaml_path: translation/ot/isaiah/034/012.yaml
  text: They will call its nobles[a], but there will be no kingdom there, and all its princes will be nothing.
translation:
  language: ru
  text: Её вельмож призовут[a], но царства там не будет, и все её князья станут ничем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Её вельможи будут взывать, но царства там не будет». Еврейский текст первой части стиха труден для понимания.'
    reason: Альтернативное синтаксическое прочтение חֹרֶיהָ и יִקְרָאוּ.
lexical_decisions:
- source_word: חֹרֶיהָ
  choice: её вельмож
  rationale: חֹר обозначает знатных, свободнорождённых представителей высшего сословия. «Вельможи» естественно передаёт общественно-политический смысл и соответствует параллельному упоминанию князей.
- source_word: וְאֵין שָׁם
  choice: но ... там не будет
  rationale: Конструкция выражает отсутствие с явным указанием места. Союз «но» естественно передаёт смысловое противопоставление в выбранном синтаксическом прочтении.
- source_word: מְלוּכָה
  choice: царства
  rationale: Слово может означать царскую власть, царствование или царство. Здесь «царство» ясно передаёт отсутствие действующего политического порядка, не уточняя сверх текста способ его учреждения.
- source_word: יִקְרָאוּ
  choice: позовут
  rationale: Сохранено обычное значение קרא «звать, призывать». Неопределённо-личная русская форма отражает множественное число глагола при вынесенном вперёд объекте, хотя синтаксис еврейской строки остаётся спорным.
- source_word: שָׂרֶיהָ
  choice: её князья
  rationale: שׂר означает князя, правителя или высокопоставленного сановника. «Князья» сохраняет возвышенный политический регистр и параллель с вельможами.
- source_word: יִהְיוּ אָפֶס
  choice: станут ничем
  rationale: Передаёт будущую связочную конструкцию и אָפֶס как полное ничто, то есть окончательное устранение правящей верхушки.
theological_decisions:
- issue: Трудный синтаксис первой половины стиха
  choice: «Позовут её вельмож, но царства там не будет»
  alternative: «Её вельможи будут взывать, но царства там не будет»
  rationale: Еврейский текст допускает понимание חֹרֶיהָ как вынесенного вперёд объекта глагола יִקְרָאוּ, но возможно и его прочтение как подлежащего. Основной текст следует объектному прочтению, а сноска сохраняет подлинную неоднозначность. Оба варианта согласуются с контекстом полного крушения политического устройства Эдома.
translation_notes:
  register: Современный литературный русский язык с возвышенной лексикой пророческого суда. «Вельможи» и «князья» сохраняют политический параллелизм; краткая конструкция передаёт резкость образа полного падения Эдома.
