base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/013.yaml
  text: Thorns will grow over her palaces[a], nettles and brambles in her fortresses; and she will become a haunt of jackals[b], a pasture for ostriches.
translation:
  language: ru
  text: Её дворцы зарастут колючками, её крепости — крапивой и терновником. Она станет обиталищем шакалов[a], пастбищем для страусов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Шакалы» — наиболее вероятное значение; в старых английских переводах встречается «драконы».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «для дочерей страуса» — древнееврейское обозначение страусов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלְתָה
  choice: зарастут
  rationale: Глагол עלה буквально означает «подниматься, всходить»; применительно к растениям среди развалин естественно передаётся как «зарастут».
- source_word: אַרְמְנֹתֶיהָ
  choice: её дворцы
  rationale: אַרְמוֹן обозначает дворец либо укреплённую резиденцию; «дворцы» сохраняет обычное значение и параллель с крепостями.
- source_word: סִירִים
  choice: колючками
  rationale: Общее обозначение колючей растительности; русский собирательный образ не требует сомнительной ботанической конкретизации.
- source_word: קִמּוֹשׂ
  choice: крапивой
  rationale: Слово обозначает сорное жгучее или колючее растение; «крапива» — традиционный и понятный эквивалент, хотя точный вид растения не установлен.
- source_word: וָחוֹחַ
  choice: терновником
  rationale: Обозначает колючее растение; «терновник» различает его с סִירִים и сохраняет образ запустения.
- source_word: בְּמִבְצָרֶיהָ
  choice: её крепости
  rationale: מִבְצָר — укреплённое место или крепость; выбран естественный русский эквивалент.
- source_word: נְוֵה
  choice: обиталищем
  rationale: נָוֶה может означать жилище, пристанище или пастбище; здесь «обиталище» естественно сочетается с дикими животными и не дублирует следующий образ.
- source_word: תַנִּים
  choice: шакалов
  rationale: В пророческих картинах опустошения множественное תַנִּים, вероятнее всего, обозначает шакалов; прежнее «драконы» вводит современного читателя в заблуждение.
- source_word: חָצִיר
  choice: пастбищем
  rationale: Слово может означать траву или травянистое место; в параллельной конструкции естественно передать результативный образ как «пастбище».
- source_word: לִבְנוֹת יַעֲנָה
  choice: для страусов
  rationale: Буквально «для дочерей страуса»; это еврейское обозначение страусов, которое в основном тексте лучше передать естественным русским названием, сохранив буквальную форму в примечании.
