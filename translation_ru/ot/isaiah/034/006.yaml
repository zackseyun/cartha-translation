source:
  edition: WLC
  text: חֶ֣רֶב לַ/יהוָ֞ה מָלְאָ֥ה דָם֙ הֻדַּ֣שְׁנָה מֵ/חֵ֔לֶב מִ/דַּ֤ם כָּרִים֙ וְ/עַתּוּדִ֔ים מֵ/חֵ֖לֶב כִּלְי֣וֹת אֵילִ֑ים כִּ֣י זֶ֤בַח לַֽ/יהוָה֙ בְּ/בָצְרָ֔ה וְ/טֶ֥בַח גָּד֖וֹל בְּ/אֶ֥רֶץ אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/006.yaml
  text: The sword of Yahweh is filled with blood[a]; it is made fat with fat, with the blood of lambs and goats, with the fat of the kidneys of rams. For Yahweh has a sacrifice in Bozrah[b], and a great slaughter in the land of Edom.
translation:
  language: ru
  text: Меч Яхве напоён кровью — кровью ягнят и козлов[a] — и утучнён жиром, жиром с почек баранов. Ибо у Яхве жертва в Восоре[b], великое заклание в земле Эдома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «козлов», то есть самцов коз.'
    reason: lexical_clarification
  - marker: b
    text: 'Безглагольную древнееврейскую конструкцию можно также перевести: «Ибо для Яхве — жертва в Восоре».'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב לַיהוָה
  choice: меч Яхве
  rationale: 'Связка с ל естественно обозначает принадлежность или отношение: меч служит орудием Яхве. Личное имя יהוה передано транслитерацией «Яхве».'
- source_word: מָלְאָה דָם
  choice: напоён кровью
  rationale: Совершенный вид выражает достигнутое состояние; «напоён» естественно по-русски передаёт образ меча, обильно покрытого кровью.
- source_word: הֻדַּשְׁנָה מֵחֵלֶב
  choice: утучнён жиром
  rationale: Сохранены пассивная форма и намеренно резкий жертвенный образ; «утучнён» точнее удерживает метафору корня דשׁן, чем нейтральное «покрыт».
- source_word: כָּרִים
  choice: ягнят
  rationale: В данном перечне жертвенных животных слово может обозначать молодых баранов; «ягнят» передаёт вероятный возрастной оттенок и согласуется с параллельным перечнем.
- source_word: עַתּוּדִים
  choice: козлов
  rationale: Слово обозначает именно самцов коз; русский эквивалент позволяет передать эту конкретность прямо в тексте.
- source_word: מֵחֵלֶב כִּלְיוֹת אֵילִים
  choice: жиром с почек баранов
  rationale: Формулировка сохраняет явное упоминание почек и жертвенную анатомическую деталь, оставаясь естественной для современного русского языка.
- source_word: כִּי זֶבַח לַיהוָה
  choice: ведь у Яхве жертва
  rationale: Безглагольная древнееврейская конструкция передана кратко и без чрезмерного уточнения характера отношения; возможный оттенок «жертва для Яхве» отмечен в сноске.
- source_word: בְּבָצְרָה
  choice: в Восоре
  rationale: Использована укоренившаяся русская библейская форма топонима, понятная читателям и соответствующая литературному регистру.
- source_word: טֶבַח גָּדוֹל
  choice: великое заклание
  rationale: «Заклание» сохраняет связь между массовым поражением и жертвенной образностью; «великое» передаёт גָּדוֹל в возвышенном пророческом регистре.
theological_decisions:
- issue: Жертвенная образность суда над Эдомом
  choice: 'Сохранить слова и детали жертвоприношения: жир, почки, жертва, заклание.'
  alternative: Передать всё как обычное описание битвы и массовой гибели.
  rationale: Текст намеренно соединяет военный суд Яхве с языком жертвоприношения; смягчение устранило бы заложенное в оригинале богословское напряжение.
- issue: Отношение жертвы к Яхве в безглагольной конструкции זֶבַח לַיהוָה
  choice: «у Яхве жертва»
  alternative: «жертва для Яхве»
  rationale: Основной текст естественно выражает принадлежность и назначенный Яхве акт, а сноска сохраняет допустимое целевое прочтение предлога ל.
translation_notes:
  register: Современный литературный русский с возвышенным пророческим звучанием. Резкая жертвенная лексика оригинала сохранена; синтаксис сделан ритмичным и понятным без сглаживания образа божественного суда.
