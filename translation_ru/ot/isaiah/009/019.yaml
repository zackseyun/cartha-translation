  yaml_path: translation/ot/isaiah/009/019.yaml
  text: He cuts on the right[a], but is hungry; he eats on the left, but is not satisfied[b]. Each one eats the flesh of his own arm.
translation:
  language: ru
  text: Режет справа[a] — и всё голоден; ест слева — но не насыщаются. Каждый ест плоть своей руки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Выхватывает справа». Еврейский глагол буквально означает «резать, отсекать», но здесь образ может подразумевать насильственное выхватывание пищи.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «плоть своей руки». Этот каннибалистический образ, вероятно, изображает крайнюю междоусобицу или саморазрушение.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְזֹר
  choice: Режет
  rationale: Глагол גזר буквально означает «резать, отсекать». Перевод сохраняет конкретный и жестокий образ, не исключая возможного смысла жадного хватания пищи.
- source_word: עַל יָמִין
  choice: справа
  rationale: Естественно передаёт пространственное значение и сохраняет параллель с «слева».
- source_word: וְרָעֵב
  choice: и всё голоден
  rationale: Передаёт сохраняющееся состояние голода вопреки предшествующему действию; частица «всё» естественно выражает подразумеваемое противопоставление.
- source_word: וַיֹּאכַל
  choice: ест
  rationale: Обычное значение אכל; контекст сам сообщает действию отчаянный и жестокий характер.
- source_word: עַל שְׂמֹאול
  choice: слева
  rationale: Сохраняет направленный параллелизм со словом «справа».
- source_word: וְלֹא שָׂבֵעוּ
  choice: и не насыщается
  rationale: שׂבע означает насыщение пищей. Единственное число согласовано по-русски с подразумеваемым участником, тогда как еврейская форма множественного числа предваряет собирательно-распределительное продолжение.
- source_word: אִישׁ
  choice: Каждый
  rationale: 'Передаёт распределительный смысл: речь идёт о каждом из участников.'
- source_word: בְּשַׂר
  choice: плоть
  rationale: Сохраняет телесность и ужас исходного образа лучше, чем нейтральное «мясо».
- source_word: זְרֹעוֹ
  choice: своей руки
  rationale: זְרוֹעַ обозначает руку, особенно плечо или мышцу. Возвратное «своей» естественно показывает, что человек пожирает собственную плоть, не превращая образ в отвлечённую «силу».
- source_word: יֹאכֵלוּ
  choice: ест
  rationale: Множественное число еврейского сказуемого сочетается с распределительным אִישׁ; по-русски конструкция «каждый ест» требует единственного числа.
theological_decisions:
- issue: Характер образа поедания собственной руки
  choice: Сохранён буквальный каннибалистический образ без истолкования в основном тексте.
  alternative: Передать образ как прямое указание на междоусобицу или саморазрушение.
  rationale: Контекст допускает значение крайней внутренней вражды и саморазрушения, но сам стих выражает его через намеренно страшный телесный образ; толкование вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым ритмом. Сохранены параллелизм «справа — слева», телесная образность и лексическая неоднозначность первого глагола.
