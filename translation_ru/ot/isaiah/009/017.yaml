  yaml_path: translation/ot/isaiah/009/017.yaml
  text: For wickedness burns like a fire; it devours brier and thorn[a], and it kindles the thickets of the forest, and they roll upward in a column of smoke.
translation:
  language: ru
  text: 'Ибо беззаконие пылает, как огонь: оно пожирает терновник и колючки, поджигает лесные чащи, и от них вздымаются клубы дыма.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последний еврейский оборот труден. Буквально: «и они вздымаются в высоте дыма»; возможно также: «и дым вздымается клубами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָעֲרָה כָאֵשׁ רִשְׁעָה
  choice: беззаконие разгорелось, как огонь
  rationale: Форма Qal perfect женского рода согласуется с רִשְׁעָה. «Разгорелось» передаёт совершенный вид и яркий образ уже начавшего действовать огня, не превращая абстрактное «беззаконие» просто в человеческий поступок.
- source_word: רִשְׁעָה
  choice: беззаконие
  rationale: Слово обозначает нравственное зло, порочность или нечестие. «Беззаконие» естественно для возвышенной русской речи и сохраняет персонифицированное отвлечённое понятие.
- source_word: שָׁמִיר וָשַׁיִת
  choice: терновник и колючки
  rationale: Это традиционная пара названий колючей, бесполезной растительности; точное ботаническое определение обоих слов ненадёжно, поэтому использованы общие наименования.
- source_word: תֹּאכֵל
  choice: пожирает
  rationale: Глагол אכל буквально означает «есть», но часто описывает уничтожающее действие огня. «Пожирает» сохраняет живую метафору.
- source_word: וַתִּצַּת
  choice: поджигает
  rationale: Глагол означает «зажечь, воспламенить». «Поджигает» ясно выражает переход огня от колючей растительности к лесной чаще.
- source_word: סִבְכֵי הַיַּעַר
  choice: лесные чащи
  rationale: סבך обозначает густо переплетённые заросли или чащу. Краткое русское выражение естественно передаёт лесную густую растительность.
- source_word: וַיִּתְאַבְּכוּ
  choice: вздымаются
  rationale: Редкий и трудный глагол, вероятно, рисует клубящееся движение вверх. «Вздымаются» передаёт восходящее движение, не уточняя сверх необходимого, что именно образует клубы.
- source_word: גֵּאוּת עָשָׁן
  choice: в клубах дыма
  rationale: Сочетание может описывать вздымающуюся, высокую или набухающую массу дыма. Русское «в клубах дыма» сохраняет зрительный образ и допускает связь дыма как со вздымающимся пламенем, так и с охваченной им чащей.
