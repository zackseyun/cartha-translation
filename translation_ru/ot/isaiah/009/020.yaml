  text: מְנַשֶּׁ֣ה אֶת אֶפְרַ֗יִם וְ/אֶפְרַ֨יִם֙ אֶת מְנַשֶּׁ֔ה יַחְדָּ֥ו הֵ֖מָּה עַל יְהוּדָ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/020.yaml
  text: Manasseh devours Ephraim[a], and Ephraim Manasseh; together they are against Judah. For all this his anger has not turned away, and his hand is still stretched out.
translation:
  language: ru
  text: Манассия пожирает Ефрема[a], а Ефрем — Манассию; вместе они выступают против Иуды. При всём этом гнев его не отступил, и рука его всё ещё простёрта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Манассия — Ефрема, а Ефрем — Манассию». В еврейском тексте глагол пропущен; слово «пожирает» восполнено по образу из предыдущего стиха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנַשֶּׁה
  choice: Манассия
  rationale: Традиционная русская форма названия колена и имени; собственное имя передано транслитерацией.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Устоявшаяся русская библейская форма названия колена.
- source_word: אֶת
  choice: не передано отдельно
  rationale: Показатель прямого дополнения не имеет самостоятельного соответствия в русском языке; объект выражен винительным падежом.
- source_word: יַחְדָּו הֵמָּה
  choice: вместе они
  rationale: Сохраняет подчёркнутое объединение прежде враждовавших сторон и естественно звучит по-русски.
- source_word: עַל יְהוּדָה
  choice: выступают против Иуды
  rationale: Предлог עַל в данном контексте имеет враждебное значение; добавленный глагол делает русскую фразу естественной, не уточняя вид враждебных действий сверх текста.
- source_word: בְּכָל זֹאת
  choice: При всём этом
  rationale: Естественно передаёт повторяющийся рефрен и подчёркивает, что названные бедствия ещё не исчерпали суда.
- source_word: לֹא שָׁב אַפּוֹ
  choice: гнев его не отступил
  rationale: אַף здесь идиоматически означает гнев, а שׁוּב — прекращение или отступление; формулировка сохраняет образ продолжающегося гнева и звучит современно.
- source_word: וְעוֹד
  choice: всё ещё
  rationale: Передаёт продолжающееся действие суда.
- source_word: יָדוֹ נְטוּיָה
  choice: рука его всё ещё простёрта
  rationale: Сохранён телесный образ простёртой руки как продолжающегося проявления силы; значение не сведено только к наказанию или защите.
theological_decisions:
- issue: К кому относятся слова «гнев его» и «рука его»
  choice: Сохранены местоимения без подстановки имени Бога.
  alternative: «гнев Господа» и «рука Господа»
  rationale: В контексте рефрена речь идёт о Боге, однако еврейский текст использует местоименные суффиксы. Их сохранение точнее воспроизводит форму и риторику оригинала, не устраняя контекстуально ясную отсылку.
- issue: Пропущенный глагол в первой строке
  choice: В основном тексте восполнено «пожирает» по образу предыдущего стиха.
  alternative: Оставить именные сочетания без глагола или восполнить нейтральное «против».
  rationale: В еврейском глагол отсутствует, но образ взаимного пожирания непосредственно продолжается из предыдущего стиха. Сноска сохраняет сведения о грамматической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Формы «Манассия», «Ефрем», «Иуда» соответствуют устоявшемуся русскому употреблению. Местоимения, относящиеся к Богу, оставлены со строчной буквы в соответствии с современной издательской нормой и формой исходного текста.
