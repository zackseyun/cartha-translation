base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/003.yaml
  text: For the yoke of his burden[a], and the staff on his shoulder[c][b], the rod of his oppressor—you have shattered them as on the day of Midian.
translation:
  language: ru
  text: Ибо ярмо его бремени, шест у него на плече и жезл его притеснителя — Ты сокрушил их[c], как в день Мадиана[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: «День Мадиана», вероятно, напоминает о победе Господа над Мадианом во времена Гедеона (Суд. 7).
    reason: cross_reference
  - marker: c
    text: 'В еврейском тексте стоит форма совершённого действия: «Ты сокрушил». Так пророчество представляет Божью победу как несомненную; возможен перевод: «Ты сокрушишь».'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹל סֻבֳּלוֹ
  choice: ярмо его бремени
  rationale: Сохраняет конкретный образ ярма и буквальное значение סֻבֳּל — «бремя, груз», не сводя выражение к отвлечённому понятию угнетения.
- source_word: מַטֵּה שִׁכְמוֹ
  choice: посох на его плече
  rationale: מַטֶּה обозначает палку, посох или жезл. «Посох» отличает этот предмет от следующего שֵׁבֶט, а «на его плече» прямо передаёт שִׁכְמוֹ без добавления отсутствующего в еврейском тексте действия.
- source_word: שֵׁבֶט הַנֹּגֵשׂ בּוֹ
  choice: жезл его притеснителя
  rationale: שֵׁבֶט здесь имеет карательный смысл, а נֹגֵשׂ обозначает притеснителя, надсмотрщика или погонщика. Формулировка сохраняет образ насильственной власти и звучит естественно в возвышенной прозе.
- source_word: הַחִתֹּתָ
  choice: Ты сокрушил
  rationale: Форма перфекта второго лица мужского рода единственного числа передана совершенным видом и прошедшим временем. Единственное сказуемое естественно относится ко всем трём предшествующим предметам; отдельное местоименное дополнение не требуется.
- source_word: כְּיוֹם מִדְיָן
  choice: как в день Мадиана
  rationale: Сохраняет историческое сравнение и традиционную русскую форму названия; выражение отсылает к решительной победе над Мадианом.
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего утверждения о радости и спасении; «ибо» ясно передаёт эту связь и соответствует достоинству пророческой речи.
theological_decisions:
- issue: Пророческий перфект и действие Бога
  choice: 'Перфект передан как уже совершившееся действие в прямом обращении к Богу: «Ты сокрушил».'
  alternative: «Ты сокрушишь» — будущее время, подчёркивающее хронологическую отнесённость обещанной победы.
  rationale: Еврейский перфект может изображать грядущее спасительное действие как несомненное. Прошедшее время сохраняет риторическую форму исходного текста и не устраняет напряжение между грамматически завершённым действием и пророческим контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксический параллелизм трёх образов угнетения сохранён; необозначенные в исходном тексте действия вроде «поражавший плечо» не добавлены. Заглавная буква в «Ты» отмечает прямое обращение к Богу, понятное из контекста.
