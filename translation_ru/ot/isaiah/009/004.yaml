  yaml_path: translation/ot/isaiah/009/004.yaml
  text: For every boot of the tramping warrior in the battle's tumult[a], and every garment rolled in blood, will be for burning, fuel for the fire.
translation:
  language: ru
  text: Ведь всякий сапог воина, топчущего в грохоте[a], и всякая одежда, извалянная в крови, пойдут на сожжение, станут пищей огню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякий топчущий сапог». Древнееврейское выражение редко и трудно для понимания; первую часть иногда передают более отвлечённо — как шум или грохот битвы, без упоминания обуви.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предыдущим высказыванием естественно для современного русского текста.
- source_word: כָל
  choice: всякий / всякая
  rationale: Сохранено распределительное значение при двух существительных в единственном числе.
- source_word: סְאוֹן
  choice: сапог
  rationale: Редкое и трудное слово в военном контексте наиболее вероятно обозначает обувь воина; неоднозначность отмечена в сноске.
- source_word: סֹאֵן
  choice: воина, топчущего
  rationale: Причастие передано как действие носителя сапога, что ясно выражает образ тяжёлой поступи и не делает сам сапог действующим лицом.
- source_word: בְּרַעַשׁ
  choice: в грохоте битвы
  rationale: רַעַשׁ означает грохот, потрясение или смятение; военный контекст позволяет естественно уточнить характер грохота, не устраняя лексической трудности всей фразы.
- source_word: וְשִׂמְלָה
  choice: и всякая одежда
  rationale: Общее обозначение предмета одежды; повтор «всякая» естественно передаёт распределительное действие כָל.
- source_word: מְגוֹלָלָה
  choice: извалянная
  rationale: Сохраняет конкретный образ одежды, которую катали или которая была вываляна в крови, вместо более отвлечённого «обагрённая».
- source_word: בְדָמִים
  choice: в крови
  rationale: Обычная русская передача идиоматического древнееврейского множественного דָּמִים в данном контексте.
- source_word: וְהָיְתָה לִשְׂרֵפָה
  choice: пойдут на сожжение
  rationale: Передаёт назначение или итог, выраженный конструкцией с ל, и по-русски распространяет его на оба перечисленных предмета.
- source_word: מַאֲכֹלֶת אֵשׁ
  choice: станут пищей огню
  rationale: Сохраняет исходную метафору «пища огня» в понятной и торжественной русской форме.
