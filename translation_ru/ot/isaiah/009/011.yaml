  text: אֲרָ֣ם מִ/קֶּ֗דֶם וּ/פְלִשְׁתִּים֙ מֵֽ/אָח֔וֹר וַ/יֹּאכְל֥וּ אֶת יִשְׂרָאֵ֖ל בְּ/כָל פֶּ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/011.yaml
  text: Aram from the east and the Philistines from the west devoured Israel with full mouth[a]. For all this, his anger has not turned away[b], and his hand is still stretched out.
translation:
  language: ru
  text: Арам с востока и филистимляне с запада[a] пожрали Израиль полным ртом[b]. Но при всём этом Его гнев не отступил, и рука Его всё ещё простёрта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сзади»; в противопоставлении востоку здесь, вероятно, имеется в виду запад.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всей пастью»; то есть ненасытно, целиком поглощая.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Арам
  rationale: Сохранено еврейское этногеографическое имя, а не позднейшее обозначение «Сирия».
- source_word: מִקֶּדֶם
  choice: с востока
  rationale: В паре с מֵאָחוֹר слово קֶדֶם имеет пространственное значение «восток», хотя буквально может обозначать и то, что находится впереди.
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Общепринятое русское название этого народа.
- source_word: מֵאָחוֹר
  choice: с запада
  rationale: Буквально «сзади»; в географическом противопоставлении востоку подразумевается запад. Буквальный образ отмечен в сноске.
- source_word: וַיֹּאכְלוּ
  choice: пожрали
  rationale: Глагол буквально означает «съели»; контекст вражеского нападения и образ пасти требуют сильного, наглядного глагола.
- source_word: בְּכָל פֶּה
  choice: полной пастью
  rationale: Передаёт буквальный образ «всей/полной пастью» и смысл ненасытного, полного поглощения, не заменяя метафору отвлечённым наречием.
- source_word: בְּכָל זֹאת
  choice: Но при всём этом
  rationale: Естественно передаёт уступительно-противительный смысл повторяющегося у Исаии рефрена.
- source_word: לֹא שָׁב אַפּוֹ
  choice: Его гнев не отступил
  rationale: אַף буквально связано с «носом», но здесь обозначает гнев; «не отступил» сохраняет идею того, что гнев не обратился и не прекратился.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: и рука Его всё ещё простёрта
  rationale: Сохранён пророческий образ продолжающегося действия и суда без поясняющего добавления.
theological_decisions:
- issue: К кому относятся местоимения в заключительном рефрене
  choice: Местоимения «Его» относятся к Богу, но имя Бога в текст не добавлено.
  alternative: Прямо написать «гнев Господа» и «рука Господа» либо оставить референта менее явным.
  rationale: Контекст повторяющегося рефрена указывает на продолжающийся Божий суд, однако сохранение местоименной формы не делает явным то, что в еврейском тексте выражено лишь контекстом.
- issue: Смысл простёртой руки
  choice: Образ оставлен без разъяснения как знак продолжающегося Божьего действия в контексте суда.
  alternative: 'Передать прямо: «Он всё ещё карает».'
  rationale: Прямое истолкование устранило бы образ и сузило его смысл.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и резкости пророческого образа. «Пожрали» и «пасть» намеренно удерживают метафору хищного поглощения; инверсия «рука Его» придаёт рефрену возвышенное звучание, оставаясь понятной современному читателю.
