    rationale: Причастие מַכֵּה в этой конструкции обозначает того, кто нанёс удар/поражает; русский несовершенный вид «поражал» вводит оттенок повторяемости или процесса, которого текст не требует. «Поразившему» нейтральнее и естественнее в контексте уже совершившегося наказания.
  - severity: medium
    issue: Прописные буквы в «Тому, Кто»
    rationale: 'Они прямо идентифицируют неназванного в первой части стиха деятеля с Богом. Хотя контекст поддерживает эту идентификацию, переводу лучше сохранить исходную грамматическую неявность: «к тому, кто…».'
  - severity: medium
