  yaml_path: translation/ot/isaiah/009/012.yaml
  text: But the people did not return to him who struck them[a], nor did they seek Yahweh of Armies.
translation:
  language: ru
  text: Но народ не обратился к тому, кто поразил его, и не искал Яхве Воинств.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционной передаче титула: «Яхве Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעָם
  choice: Но народ
  rationale: 'Союз וְ в контексте передаёт противопоставление: наказание уже постигло народ, однако он не обратился; «но» естественно выражает этот смысл по-русски.'
- source_word: לֹא שָׁב
  choice: не обратился
  rationale: שׁוּב означает «повернуться, возвратиться». В отношении к Богу русское «обратиться» сохраняет направительный и духовный смысл, не сводя выражение только к внутреннему раскаянию.
- source_word: עַד הַמַּכֵּהוּ
  choice: к Тому, Кто поражал его
  rationale: Предлог עַד здесь имеет направительное значение, а причастная конструкция обозначает действующее лицо. Единственное число местоимения согласуется с собирательным существительным «народ»; несовершенный оттенок причастия передан формой «поражал».
- source_word: וְאֶת
  choice: и
  rationale: Вторая отрицательная конструкция по-русски естественно координируется как «и не…»; אֶת отмечает прямое дополнение и отдельно не переводится.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יהוה передано как «Яхве», а צְבָאוֹת — прозрачным современному читателю словом «Воинств», сохраняющим множественное число и традиционную форму божественного титула.
- source_word: לֹא דָרָשׁוּ
  choice: не взыскал
  rationale: דָּרַשׁ здесь означает настойчиво искать Бога, обращаться к Нему за помощью и руководством. «Взыскал» сохраняет религиозно-реляционный смысл и соответствует возвышенному, но понятному библейскому регистру.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не заменяет его титулом.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; небесных воинств
  rationale: «Воинств» передаёт лексическое значение слова и сохраняет краткость устойчивого божественного титула. Традиционное «Саваоф» приведено в примечании, не подменяя смысл транслитерацией.
- issue: Кого обозначает «поражавший»
  choice: Бога, названного далее Яхве Воинств
  alternative: Оставить референта грамматически неуточнённым
  rationale: Контекст и параллельное продолжение указывают на Бога как совершающего суд, однако перевод не вставляет имя в первую часть и сохраняет форму исходного выражения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Прописные буквы в «Тому, Кто» помогают ясно обозначить Бога, не добавляя имени в первую часть стиха. Маркер примечания поставлен после всего титула, к которому относится вариант.
