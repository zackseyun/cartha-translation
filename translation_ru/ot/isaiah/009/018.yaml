  text: בְּ/עֶבְרַ֛ת יְהוָ֥ה צְבָא֖וֹת נֶעְתַּ֣ם אָ֑רֶץ וַ/יְהִ֤י הָ/עָם֙ כְּ/מַאֲכֹ֣לֶת אֵ֔שׁ אִ֥ישׁ אֶל אָחִ֖י/ו לֹ֥א יַחְמֹֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/018.yaml
  text: By the wrath of Yahweh of hosts the land is scorched[a], and the people have become like fuel for the fire; no man spares his brother.
translation:
  language: ru
  text: От ярости Яхве Воинств земля выжжена[a], и народ стал словно пищей для огня; никто не щадит своего брата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сожжена»; возможно также: «помрачилась». Еврейский глагол редок, и его точное значение спорно; ближайший контекст с образом огня поддерживает перевод «выжжена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶבְרַת
  choice: От ярости
  rationale: Предлог בְּ здесь передаёт причину или действующую силу, а עֶבְרָה — сильный, изливающийся гнев. «От ярости» естественно выражает причинный смысл и сохраняет напряжённость образа.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Имя יהוה передано как «Яхве», а צְבָאוֹת — традиционным и достаточно широким словом «Воинств», не ограничивающим выражение только земными армиями.
- source_word: נֶעְתַּם
  choice: выжжена
  rationale: Редкий глагол толкуют как «быть выжженным/сожжённым» либо «помрачиться». Непосредственный образ огня поддерживает «выжжена», а неопределённость отмечена в сноске.
- source_word: אָרֶץ
  choice: земля
  rationale: В контексте суда над конкретным народом אָרֶץ означает прежде всего его землю, а не весь мир.
- source_word: וַיְהִי הָעָם
  choice: и народ стал
  rationale: Форма продвигает повествование и обозначает наступившее состояние; русское прошедшее время передаёт это естественно.
- source_word: כְּמַאֲכֹלֶת אֵשׁ
  choice: словно пища для огня
  rationale: מַאֲכֹלֶת буквально обозначает то, что огонь поедает. «Пища для огня» сохраняет исходную метафору и остаётся понятным по-русски.
- source_word: אִישׁ אֶל־אָחִיו לֹא יַחְמֹלוּ
  choice: никто не щадит своего брата
  rationale: 'Еврейская конструкция имеет распределительный смысл: каждый человек не щадит брата. «Никто» естественно передаёт всеобщность, «брата» сохраняет родственную лексику, а «не щадит» выражает отказ пощадить из сострадания.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное заветное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Значение צְבָאוֹת
  choice: Воинств
  alternative: воинств / армий
  rationale: «Воинств» сохраняет традиционную широту выражения, которое может охватывать как небесные, так и военные силы, тогда как «армий» звучит уже.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Сохранены резкий образ огня, родственное слово «брат» и лексическая неоднозначность редкого глагола.
