  text: И усилил Яхве врагов Рецина против него[a] и возбудил его врагов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвысил», «поднял» или «сделал сильнее» врагов Рецина против него.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подстрекнул» или «натравил его врагов». В еврейском тексте сохранено единственное число: «против него… его врагов»; из более широкого контекста видно, что речь идёт о северном царстве — Ефреме.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: возвысил
  rationale: Порода хифиль глагола שׂגב может означать «возвысить», «укрепить» или «поднять». «Возвысил» сохраняет образ исходного глагола и в данном контексте означает, что Яхве дал противникам силу и преимущество, не обязательно оказав им почесть.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
- source_word: צָרֵי רְצִין
  choice: противников Рецина
  rationale: Точно передаёт конструкцию «противники Рецина» и позволяет избежать повтора слова «враги» в следующей части стиха.
- source_word: עָלָיו
  choice: против него
  rationale: Предлог עַל при враждебном действии естественно означает «против»; мужское местоимение единственного числа сохранено без уточнения референта.
- source_word: אֹיְבָיו
  choice: его врагов
  rationale: Прямое и естественное соответствие существительному с местоименным суффиксом мужского рода единственного числа.
- source_word: יְסַכְסֵךְ
  choice: поднял
  rationale: Глагол סכסך обозначает побуждение к враждебному столкновению, разжигание или возбуждение вражды. «Поднял» естественно выражает приведение врагов в действие, хотя более явный оттенок подстрекательства отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя Бога.
- issue: Референт местоимений единственного числа
  choice: Сохранить «против него» и «его врагов»
  alternative: Против Израиля; против Ефрема
  rationale: В еврейском тексте стоят местоименные суффиксы мужского рода единственного числа. Контекст указывает на северное царство, но сам стих не называет референта прямо, поэтому неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксический параллелизм оригинала сохранён; местоименная неоднозначность не устранена.
