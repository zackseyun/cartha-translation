lexical_decisions:
- source_word: וְיָדְעוּ
  choice: И узнает
  rationale: Перфект с союзом в пророческом контексте передан будущим временем. Единственное число естественно согласуется по-русски с собирательным подлежащим «весь народ».
- source_word: הָעָם כֻּלּוֹ
  choice: весь народ
  rationale: Передаёт полноту охвата и сохраняет естественную русскую форму собирательного наименования.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено собственное имя, хотя в контексте оно обозначает северное царство Израиля.
- source_word: וְיוֹשֵׁב שֹׁמְרוֹן
  choice: и жители Самарии
  rationale: Еврейское причастие единственного числа имеет собирательное значение; русский множественный оборот звучит естественно и точно передаёт смысл.
- source_word: בְּגַאֲוָה
  choice: с гордостью
  rationale: Передаёт отрицательно окрашенную горделивость в данном контексте и естественно сочетается с глаголом речи.
- source_word: וּבְגֹדֶל לֵבָב
  choice: и высокомерием в сердце
  rationale: Буквально «и с величием сердца»; контекст указывает на гордое самовозвышение. Формулировка сохраняет образ сердца и ясно передаёт отрицательный смысл.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Инфинитив вводит содержание речи, продолжающееся в следующем стихе; деепричастие сохраняет связь с основной фразой без добавления относительного предложения.
