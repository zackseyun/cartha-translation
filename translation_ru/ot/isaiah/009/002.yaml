source:
  edition: WLC
  text: הִרְבִּ֣יתָ הַ/גּ֔וֹי לא הִגְדַּ֣לְתָּ הַ/שִּׂמְחָ֑ה שָׂמְח֤וּ לְ/פָנֶ֨י/ךָ֙ כְּ/שִׂמְחַ֣ת בַּ/קָּצִ֔יר כַּ/אֲשֶׁ֥ר יָגִ֖ילוּ בְּ/חַלְּקָ֥/ם שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/002.yaml
  text: You have multiplied the nation[a]; you have not increased the joy. They rejoice before you as with the joy at harvest[b], as men exult when they divide spoil.
translation:
  language: ru
  text: Ты умножил народ[a], радость не умножил. Они радуются перед Тобой, как радуются во время жатвы[b], как ликуют, когда делят добычу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые древние версии передают: «Ты умножил народ и умножил его радость»; это отражает еврейское чтение, подобное לוֹ («ему», по смыслу — «его»), вместо לֹא («не»).'
    reason: textual_variant
  - marker: b
    text: 'Или: «Они радуются перед Тобой, как при радости жатвы, как ликуют, деля добычу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבִּיתָ
  choice: умножил
  rationale: Каузативная форма глагола רבה означает «сделать многочисленным, умножить»; этот выбор сохраняет образ возросшего народа.
- source_word: הַגּוֹי
  choice: народ
  rationale: גּוֹי может означать «народ» или «нация»; в русском библейско-пророческом контексте «народ» звучит естественно и передаёт собирательное единственное число.
- source_word: לֹא הִגְדַּלְתָּ הַשִּׂמְחָה
  choice: но не умножил радости
  rationale: Основной текст следует масоретскому чтению לֹא («не»), не устраняя трудность контекста. Повтор «умножил» естественно связывает обе части фразы, хотя еврейский текст использует два разных глагола со сходным значением увеличения.
- source_word: שָׂמְחוּ
  choice: они радуются
  rationale: Совершенная форма в пророческой речи передана настоящим временем для живого изображения результата; значение — радоваться, веселиться.
- source_word: לְפָנֶיךָ
  choice: пред Тобой
  rationale: Буквально «перед Твоим лицом»; «пред Тобой» сохраняет направленность радости к Богу и соответствует возвышенному современному регистру.
- source_word: כְּשִׂמְחַת בַּקָּצִיר
  choice: как радуются во время жатвы
  rationale: Передаёт сравнение с радостью поры жатвы естественной русской конструкцией.
- source_word: כַּאֲשֶׁר יָגִילוּ
  choice: как ликуют, когда
  rationale: גיל обозначает особенно бурную, торжествующую радость; «ликуют» сохраняет усиленный оттенок по сравнению с שׂמח.
- source_word: בְּחַלְּקָם שָׁלָל
  choice: когда делят добычу
  rationale: Фраза описывает раздел захваченного после победы; «добыча» ясно и естественно сохраняет военный образ.
theological_decisions:
- issue: Чтение לא («не») или לו («ему/ему же», по смыслу «его») во второй части стиха
  choice: 'Основной текст: «но не умножил радости» — по масоретскому тексту לֹא.'
  alternative: «Ты умножил народ и умножил его радость».
  rationale: Предоставленный еврейский источник прямо содержит לֹא («не»). Хотя это чтение создаёт смысловое напряжение, а ряд древних версий отражает вариант לוֹ, основной текст не следует молча исправлять; значимый вариант вынесен в примечание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Местоимение «Тобой» написано с прописной буквы как обращённое к Богу. Сохранено трудное отрицание масоретского текста; вариант древней текстовой традиции указан в примечании.
