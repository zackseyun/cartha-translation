id: ISA.9.5
reference: Isaiah 9:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּי יֶ֣לֶד יֻלַּד לָ֗/נוּ בֵּ֚ן נִתַּן לָ֔/נוּ וַ/תְּהִ֥י הַ/מִּשְׂרָ֖ה עַל שִׁכְמ֑/וֹ וַ/יִּקְרָ֨א שְׁמ֜/וֹ פֶּ֠לֶא יוֹעֵץ֙ אֵ֣ל גִּבּ֔וֹר אֲבִי עַ֖ד שַׂר שָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/005.yaml
  text: For a child has been born to us[a], a son has been given to us, and the rule is on his shoulder; and his name is called Wonderful Counselor, Mighty God, Father of Eternity[b], Prince of Peace.
translation:
  language: ru
  text: 'Ибо нам родился ребёнок[a], нам дан сын, и владычество — на Его плече; и нарекут Ему имя: Чудный Советник, Могучий Бог, Отец вечности[b], Князь мира.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционной передаче пророческого смысла: «Ибо нам родится ребёнок, нам будет дан сын, и владычество будет на Его плече; и нарекут Ему имя…»'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «Отец вечности»; традиционный вариант: «Отец вечный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт причинно-пояснительную связь с предшествующим пророчеством и сохраняет возвышенный, но понятный регистр.
- source_word: יֶלֶד
  choice: Младенец
  rationale: В данном пророческом возвещении естественно обозначает родившегося ребёнка; традиционное и современному читателю понятное слово.
- source_word: יֻלַּד לָנוּ
  choice: родился нам
  rationale: Еврейский пассивный перфект передан совершенным видом без добавления не названного в тексте действующего лица.
- source_word: בֵּן נִתַּן לָנוּ
  choice: Сын дан нам
  rationale: Сохраняет мужской род, пассивную конструкцию и параллелизм с первой строкой.
- source_word: הַמִּשְׂרָה
  choice: владычество
  rationale: Обозначает царскую власть и господство, не сужая смысл до государственного аппарата.
- source_word: וַתְּהִי ... עַל שִׁכְמוֹ
  choice: и владычество — на Его плече
  rationale: Прямо сохраняет образ власти, лежащей на плече, без пояснительного расширения.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: и нарекут Ему имя
  rationale: Неопределённо-личная русская конструкция естественно передаёт называние при неуказанном субъекте; будущее прочтение соответствует пророческому контексту.
- source_word: פֶּלֶא יוֹעֵץ
  choice: Чудный Советник
  rationale: Передаёт составной царский титул, соединяющий необычайность и мудрый совет.
- source_word: אֵל גִּבּוֹר
  choice: Бог Могучий
  rationale: Сохраняет сильный божественный смысл титула и не ослабляет его до «героя» или «сильного».
- source_word: אֲבִי עַד
  choice: Отец вечности
  rationale: Прозрачно передаёт еврейскую конструкцию «отец вечности/непреходящего», не превращая её без необходимости в прилагательное.
- source_word: שַׂר שָׁלוֹם
  choice: Князь мира
  rationale: Точно и традиционно передаёт царский титул; «мир» охватывает контекстуальный смысл благополучия и целостности.
theological_decisions:
- issue: Отнесение последовательности престольных имён
  choice: 'Все четыре титула относятся к Младенцу: «Чудный Советник, Бог Могучий, Отец вечности, Князь мира».'
  alternative: Часть титулов можно синтаксически отнести к Богу как к Тому, кто даёт ребёнку имя.
  rationale: Наиболее естественно формула наречения вводит последовательность имён самого ребёнка; перевод сохраняет их полную силу, не ослабляя и не перераспределяя их по богословским мотивам.
- issue: Временная перспектива пророческих глаголов
  choice: Рождение и дарование переданы прошедшим совершенного вида, а наречение — будущим временем.
  alternative: 'Возможна единообразная традиционная передача настоящим или будущим временем: «родится… будет дан… нарекут».'
  rationale: Еврейские формы сочетают завершённость пророческого возвещения с контекстуальной направленностью вперёд. Основной текст сохраняет эту напряжённость, а сноска отмечает традиционный будущий вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Умеренно традиционные слова «Младенец», «нарекут» и «Князь» сохранены ради жанра и узнаваемости, но синтаксис остаётся ясным. Прописные буквы в мессианских обозначениях служат русской издательской норме и не изменяют синтаксической неоднозначности оригинала.
