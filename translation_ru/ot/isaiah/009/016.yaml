  source_fidelity: 'Смысл в целом передан верно: Адонай отказывает в радости о молодых людях и в сострадании сиротам и вдовам; всеобщее нечестие и продолжающийся гнев сохранены. Однако «мерзость» чрезмерно конкретизирует נְבָלָה, которое обозначает безрассудное, постыдное или бесчестное слово/дело, а не обязательно «мерзость» в более узком русском библейском употреблении. Сноска a также неверно воспроизводит падеж буквального еврейского дополнения.'
