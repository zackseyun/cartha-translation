base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/016.yaml
  text: Therefore the Lord does not rejoice over their young men[a], and he does not have compassion on their fatherless and their widows; for every one of them is godless and an evildoer, and every mouth speaks folly. For all this his anger has not turned away[b], and his hand is still stretched out.
translation:
  language: ru
  text: Поэтому Владыка не радуется их юношам[a] и не проявляет сострадания к их сиротам и вдовам, потому что каждый из них безбожен и творит зло, и все уста говорят постыдное[b]. Но при всём этом гнев Его не отвратился, и рука Его всё ещё простёрта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском: «его юноши… его сироты и его вдовы»; местоимение относится к народу как к единому целому.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «говорят безрассудное», «говорят бесчестное» или «говорят мерзость»; еврейское слово обозначает нравственно постыдную, бесчестную или безумную речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод или следствие из предшествующего обличения.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт божественный титул Адонай и отличает его от имени יהוה, обычно переводимого как «Господь».
- source_word: בַּחוּרָיו
  choice: их юношам
  rationale: בָּחוּר обозначает молодых мужчин в расцвете сил; множественное «их» естественно выражает коллективный референт — народ.
- source_word: יְתֹמָיו וְאֶת אַלְמְנֹתָיו
  choice: их сирот и вдов
  rationale: Естественное русское обозначение социально уязвимых групп; «их» отражает народ как коллективный референт.
- source_word: לֹא יְרַחֵם
  choice: не жалеет
  rationale: Кратко и естественно передаёт отсутствие сострадания; настоящее время сохраняет поэтическую непосредственность древнееврейского имперфекта в контексте суда.
- source_word: כֻלּוֹ חָנֵף וּמֵרַע
  choice: каждый из них безбожен и творит зло
  rationale: חָנֵף здесь указывает на нечестие, а מֵרַע — на человека, делающего зло; развёрнутая формулировка звучит естественно по-русски.
- source_word: כָל פֶּה דֹּבֵר נְבָלָה
  choice: всякие уста говорят мерзость
  rationale: Сохраняет конкретный образ «уст» и передаёт נְבָלָה как нравственно постыдную, нечестивую речь, не сводя её к интеллектуальной глупости.
- source_word: בְּכָל זֹאת לֹא שָׁב אַפּוֹ
  choice: Но при всём этом гнев Его не отвратился
  rationale: 'Передаёт повторяющийся у Исаии рефрен: несмотря на уже описанное бедствие или обличение, Божий гнев остаётся в силе.'
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: и рука Его всё ещё простёрта
  rationale: Сохраняет телесный образ действующей, карающей Божьей силы и его намеренную неоднозначность без пояснения в основном тексте.
theological_decisions:
- issue: Божественный титул אֲדֹנָי
  choice: Владыка
  alternative: Господь; мой Господь
  rationale: «Владыка» точно передаёт титул господства и позволяет не смешивать Адонай с передачей тетраграмматона; притяжательное «мой» в данном употреблении могло бы создать неуместный смысл.
- issue: Притяжательные суффиксы единственного числа
  choice: их юношам ... их сирот и вдов
  alternative: его юношам ... его сиротам и вдовам
  rationale: Формально суффиксы имеют третье лицо единственного числа, но относятся к народу как собирательному целому; русское множественное «их» ясно выражает этот контекстуальный смысл.
- issue: Образ простёртой Божьей руки
  choice: сохранён без уточнения объекта и цели
  alternative: его рука всё ещё поднята для удара
  rationale: Контекст указывает на продолжающийся суд, однако сам древнееврейский текст оставляет образ лаконичным; перевод не добавляет отсутствующее пояснение.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены поэтические образы «всякие уста» и «простёртая рука», а также повторяющийся исайевский рефрен. Заглавные местоимения в отношении Бога соответствуют принятому русскому библейскому регистру.
