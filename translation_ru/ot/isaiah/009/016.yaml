  terminology: «Владыка» — допустимая передача אֲדֹנָי и не смешивает этот титул с передачей тетраграмматона. «Безбожен» и «творит зло» адекватно передают חָנֵף и מֵרַע. Для נְבָלָה предпочтено более широкое «постыдное», без навязывания одного спорного оттенка.
