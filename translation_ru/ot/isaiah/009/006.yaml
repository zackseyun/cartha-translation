id: ISA.9.6
reference: Isaiah 9:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: ל/םרבה הַ/מִּשְׂרָ֜ה וּ/לְ/שָׁל֣וֹם אֵֽין קֵ֗ץ עַל כִּסֵּ֤א דָוִד֙ וְ/עַל מַמְלַכְתּ֔/וֹ לְ/הָכִ֤ין אֹתָ/הּ֙ וּֽ/לְ/סַעֲדָ֔/הּ בְּ/מִשְׁפָּ֖ט וּ/בִ/צְדָקָ֑ה מֵ/עַתָּה֙ וְ/עַד עוֹלָ֔ם קִנְאַ֛ת יְהוָ֥ה צְבָא֖וֹת תַּעֲשֶׂה זֹּֽאת־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/006.yaml
  text: Of the increase of the dominion and of peace there will be no end[a], on the throne of David and over his kingdom, to establish it and to uphold it with justice and with righteousness from now on and forever. The zeal of Yahweh of Armies will do this.
translation:
  language: ru
  text: Владычеству его и миру не будет конца. Он будет править на престоле Давида и над его царством, чтобы утвердить и поддерживать его правосудием и праведностью отныне и навеки. Рвение Яхве Воинств[a] совершит это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь воинств».'
    reason: Традиционная альтернативная передача יהוה צבאות.
lexical_decisions:
- source_word: למרבה הַמשרה
  choice: Владычеству
  rationale: Конструкция с לְ и существительным от רבה указывает на неограниченное возрастание власти; русская формула «владычеству… не будет конца» естественно передаёт этот смысл, не превращая его в узко административное «правительство».
- source_word: ולשלום אין קץ
  choice: и миру не будет конца
  rationale: שָׁלוֹם охватывает мир, благополучие и целостность; «мир» сохраняет основное значение, а будущее время соответствует пророческому контексту без устранения формальной безглагольности еврейской фразы.
- source_word: על כסא דוד ועל ממלכתו
  choice: на престоле Давида и над его царством
  rationale: Сохранены династический образ престола и непосредственная отсылка местоименного суффикса к Давиду; формулировка не добавляет позднейших христологических определений.
- source_word: להכין אתה ולסעדה
  choice: чтобы утвердить его и поддерживать
  rationale: הכין обозначает утверждение и придание прочности, а סעד — поддержку и сохранение. Местоимение мужского рода согласовано с русским словом «царство».
- source_word: במשפט ובצדקה
  choice: правосудием и праведностью
  rationale: «Правосудие» передаёт общественно-судебный смысл מִשְׁפָּט, а «праведность» сохраняет отличие צְדָקָה и его нравственный оттенок.
- source_word: מעתה ועד עולם
  choice: отныне и навеки
  rationale: Краткая современная формула передаёт непрерывность обещанного правления от настоящего пророческого горизонта в вечность.
- source_word: קנאת
  choice: Ревность
  rationale: קִנְאָה здесь означает горячую, деятельную преданность Яхве своему намерению; «ревность» сохраняет силу слова лучше, чем более слабое «усердие».
- source_word: יהוה צבאות
  choice: Яхве Воинств
  rationale: Личное имя יהוה передано как «Яхве», а צבאות — по его прямому военному значению «Воинств»; традиционный вариант дан в примечании.
theological_decisions:
- issue: Давидово и мессианское содержание царского обещания
  choice: Сохранить выражения «на престоле Давида», «над его царством» и вечную продолжительность, не добавляя имени или христологического титула.
  alternative: Прямо назвать обещанного царя Мессией или Христом.
  rationale: Сам стих выражает династическое обещание и его вечный масштаб, но не содержит этих явных наименований; перевод не должен заранее снимать каноническое богословское напряжение.
- issue: Передача יהוה צבאות
  choice: Яхве Воинств
  alternative: Господь воинств
  rationale: Основной текст сохраняет открытое в еврейском тексте личное имя Бога и смысл צבאות; традиционная титульная передача сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксическая связь фразы о престоле с предыдущим обещанием сохранена без добавления явного подлежащего; тире облегчает чтение длинной еврейской конструкции.
