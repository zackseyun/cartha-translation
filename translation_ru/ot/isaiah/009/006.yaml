revisions:
- from: Владычеству и миру не будет конца — на престоле Давида и над его царством, чтобы утвердить его и поддерживать правосудием и праведностью отныне и навеки. Ревность Яхве Воинств[a] совершит это.
  to: Владычеству его и миру не будет конца. Он будет править на престоле Давида и над его царством, чтобы утвердить и поддерживать его правосудием и праведностью отныне и навеки. Рвение Яхве Воинств[a] совершит это.
  rationale: Добавлены лишь необходимые для естественного русского синтаксиса подразумеваемые местоимение и глагол царствования, выводимые из непосредственного контекста пророчества и синтаксиса фразы о престоле. «Его» при «владычестве» делает отнесённость к обещанному правителю явной, не называя его. «Рвение» точнее передаёт значение קִנְאָה в этой фразе. Смысл, династическая отсылка к Давиду, различение правосудия и праведности, а также временной охват сохранены.
