review_pass:
  verdict: revise
  source_fidelity: 'Основные лексические соответствия точны: מִשְׂרָה передано как «владычество», מִשְׁפָּט / צְדָקָה различены как «правосудие / праведность», а קִנְאָה в данном контексте лучше передавать не как человеческую зависть, а как деятельное рвение. Однако исходная русская конструкция после тире не образует естественного синтаксического продолжения: «на престоле Давида и над его царством, чтобы…» остаётся подвешенной. В еврейском тексте подразумеваемый царственный деятель ясен из ближайшего контекста; в русском его следует выразить местоимением, не добавляя богословского отождествления.'
  naturalness: «Ревность Яхве Воинств» возможно в традиционном библейском регистре, но в современном литературном русском «ревность» прежде всего означает jealousy. «Рвение» точнее передаёт קִנְאָה здесь. Явное «он будет править» делает фразу о престоле и царстве грамматически и стилистически цельной.
  terminology: «Яхве» последовательно передаёт יהוה. «Яхве Воинств» сохраняет смысл צְבָאוֹת; традиционное «Господь воинств» уместно оставить как сносковый вариант. Не следует вводить в основной текст титулы «Мессия» или «Христос», которых в данном стихе нет.
  issues:
  - severity: medium
    issue: Подвешенная синтаксическая конструкция после тире
    rationale: Оборот «— на престоле Давида и над его царством, чтобы утвердить его…» в русском не имеет выраженного сказуемого или носителя действия. Это затрудняет понимание связи престола, царства и инфинитивов.
  - severity: low
    issue: «Ревность» может быть неверно понята в современном русском
    rationale: В данном контексте קִנְאָה обозначает ревностное, действенное стремление Яхве осуществить обещанное. «Рвение» сохраняет этот смысл более непосредственно.
  revised_text: Владычеству его и миру не будет конца. Он будет править на престоле Давида и над его царством, чтобы утвердить и поддерживать его правосудием и праведностью отныне и навеки. Рвение Яхве Воинств[a] совершит это.
