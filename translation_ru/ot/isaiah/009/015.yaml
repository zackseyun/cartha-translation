  text: וַ/יִּֽהְי֛וּ מְאַשְּׁרֵ֥י הָֽ/עָם הַ/זֶּ֖ה מַתְעִ֑ים וּ/מְאֻשָּׁרָ֖י/ו מְבֻלָּעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/015.yaml
  text: And the guides of this people have become those who lead them astray[a], and those guided by them are swallowed up.
translation:
  language: ru
  text: И вожди этого народа стали теми, кто вводит его в заблуждение[a], а те, кого они ведут, — поглощены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Те, кто провозглашает этот народ блаженным, вводят его в заблуждение, а те, кого они провозглашают блаженными, — поглощены». Еврейские формы от корня אשר могут относиться к провозглашению кого-либо блаженным, хотя контекст также поддерживает значения «вожди» и «ведомые».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: стали
  rationale: Передаёт переход к описываемому состоянию, выраженный формой היה с последовательным ו, и естественно звучит по-русски.
- source_word: מְאַשְּׁרֵי
  choice: вожди
  rationale: В данном контексте причастие от אשר обозначает тех, кто направляет народ; существительное «вожди» ясно передаёт роль руководителей и сохраняет связь с пророческой речью.
- source_word: הָעָם הַזֶּה
  choice: этого народа
  rationale: Прямое и естественное соответствие еврейскому выражению «этот народ» с учётом русского синтаксиса.
- source_word: מַתְעִים
  choice: вводить его в заблуждение
  rationale: 'Причастие породы Hiphil от תעה имеет каузативный смысл: заставлять блуждать, сбивать с пути. Выражение сохраняет активное пагубное воздействие руководителей.'
- source_word: וּמְאֻשָּׁרָיו
  choice: ведомые ими
  rationale: Пассивное причастие образует смысловую пару с «вождями» и указывает на тех, кого они направляют. Множественное «ими» естественно соотносится с коллективом вождей, хотя суффикс в еврейском формально имеет единственное число и относится к народу как коллективу.
- source_word: מְבֻלָּעִים
  choice: поглощены
  rationale: Сохраняет яркий образ пассивного причастия от בלע — быть проглоченным или поглощённым, не сводя его смысл лишь к абстрактному «погублены».
theological_decisions:
- issue: Толкование парных форм от корня אשר
  choice: Передать их как «вожди» и «ведомые ими»
  alternative: «Те, кто называет этот народ блаженным» и «названные ими блаженными»
  rationale: Непосредственное соседство с מַתְעִים («вводить в заблуждение») и параллелизм двух форм поддерживают значение руководства и ведомости. Однако корень אשר допускает связь с провозглашением кого-либо блаженным, поэтому эта подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Вожди» употреблено в широком смысле руководителей народа; синтаксис краток и сохраняет резкий параллелизм оригинала.
