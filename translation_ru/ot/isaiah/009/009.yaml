id: ISA.9.9
reference: Isaiah 9:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לְבֵנִ֥ים נָפָ֖לוּ וְ/גָזִ֣ית נִבְנֶ֑ה שִׁקְמִ֣ים גֻּדָּ֔עוּ וַ/אֲרָזִ֖ים נַחֲלִֽיף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/009.yaml
  text: Bricks have fallen[a], but we will rebuild with cut stone; sycamores have been cut down[b], but we will replace them with cedars.
translation:
  language: ru
  text: Кирпичи обрушились, но мы построим из тёсаного камня; сикоморы[a] срублены, но мы заменим их кедрами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сикоморы — деревья, также называемые смоковницами-сикоморами.
    reason: cultural_note
lexical_decisions:
- source_word: לְבֵנִים
  choice: кирпичи
  rationale: Общее обозначение строительных кирпичей; уточнение «сырцовые» было бы вероятным исторически, но более узким, чем еврейское слово.
- source_word: נָפָלוּ
  choice: обрушились
  rationale: Форма обозначает завершившееся событие. В контексте строений русское «обрушились» естественно передаёт результат разрушения.
- source_word: גָזִית
  choice: тёсаный камень
  rationale: Слово обозначает обработанный строительный камень и сохраняет контраст с обычным кирпичом.
- source_word: נִבְנֶה
  choice: мы построим
  rationale: Еврейский глагол буквально означает «строить». Будущее намерение передано без добавления приставки «пере-», поскольку восстановительный смысл уже ясен из контекста.
- source_word: שִׁקְמִים
  choice: сикоморы
  rationale: Речь идёт о сикоморах, то есть библейских смоковницах-сикоморах; краткое традиционное название пояснено в сноске.
- source_word: גֻּדָּעוּ
  choice: срублены
  rationale: Пассивная форма передаёт поваленные рубкой деревья; краткое русское причастие сохраняет параллелизм строки.
- source_word: אֲרָזִים
  choice: кедры
  rationale: Кедры противопоставлены более простым сикоморам как более ценный и прочный строительный материал.
- source_word: נַחֲלִיף
  choice: мы заменим их
  rationale: Каузативная форма חלף здесь означает заменить одно другим; местоимение делает объект замены естественным и ясным по-русски.
theological_decisions:
- issue: Тон заявления говорящих
  choice: Уверенное и вызывающее намерение отстроиться с использованием лучших материалов
  alternative: Нейтральное сообщение о восстановлении
  rationale: Контекст показывает горделивую самоуверенность перед лицом суда. Сам перевод не добавляет оценочных слов, но сохраняет контраст материалов и решительный тон.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим параллелизмом. «Тёсаный камень» сохраняет библейскую выразительность и остаётся понятным современному читателю; формы «обрушились / срублены» передают завершённость и симметрию двух половин стиха.
