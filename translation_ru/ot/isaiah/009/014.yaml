lexical_decisions:
- source_word: זָקֵן
  choice: старейшина
  rationale: Слово может обозначать пожилого человека или старейшину. В контексте общественного руководства «старейшина» естественно сочетается с образом головы, не исключая возрастного значения.
- source_word: וּנְשׂוּא פָנִים
  choice: и почтенный человек
  rationale: Буквально выражение означает «возвышенный лицом» и указывает на человека, пользующегося почётом или занимающего высокое положение. Выбранный вариант ясно передаёт общественный статус без излишнего толкования.
- source_word: הוּא הָרֹאשׁ
  choice: — это голова
  rationale: Прямо сохранён телесный образ, обозначающий ведущую часть общества; поясняющая замена словом «руководитель» не вводится.
- source_word: וְנָבִיא
  choice: а пророк
  rationale: Союз передан как противопоставительное «а», естественно выражающее параллель между головой и хвостом. Единственное число сохраняет собирательно-представительный характер исходного текста.
- source_word: מוֹרֶה שֶּׁקֶר
  choice: учащий лжи
  rationale: Причастная конструкция передаёт продолжающееся или характерное действие. «Ложь» сохраняет нравственный и смысловой вес שֶׁקֶר и звучит по-русски кратко и выразительно.
- source_word: הוּא הַזָּנָב
  choice: — это хвост
  rationale: Метафора передана непосредственно и симметрично выражению «это голова», без поясняющего пересказа.
theological_decisions:
- issue: Метафорическое отождествление общественных и религиозных руководителей с «головой» и «хвостом»
  choice: Сохранить образы «голова» и «хвост» без истолковывающей замены.
  alternative: 'Передать смысл пояснительно: старейшина и почтенный человек — руководители, а лживо учащий пророк — низшая или ведомая часть.'
  rationale: В еврейском тексте употреблены конкретные образы частей тела. Их прямое сохранение удерживает пророческую риторику и не снимает заложенного в ней напряжения.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой пророческой параллели. Тире делает именные отождествления естественными для русского синтаксиса; образы «голова» и «хвост» оставлены без сглаживания.
