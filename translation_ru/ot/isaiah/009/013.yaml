base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/013.yaml
  text: So Yahweh cut off from Israel head and tail[a], palm branch and reed[b], in one day.
translation:
  language: ru
  text: И Яхве отсёк от Израиля голову и хвост[a], пальмовую ветвь и тростник[b], в один день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть весь народ — от высоких до низких; эти образы объясняются в следующем стихе.
    reason: cross_reference
  - marker: b
    text: 'Или: «камыш».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְרֵת
  choice: отсёк
  rationale: Форма Hifil от כרת выражает решительное устранение. «Отсёк» сохраняет конкретный образ и силу суда, не сводя выражение к нейтральному «удалил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מִיִּשְׂרָאֵל
  choice: у Израиля
  rationale: Предлог מן обозначает отделение или удаление того, что принадлежит Израилю; по-русски в сочетании с «отсёк» естественно звучит «у Израиля».
- source_word: רֹאשׁ וְזָנָב
  choice: голову и хвост
  rationale: Сохранён конкретный образ оригинала; его смысл раскрывается в следующем стихе, поэтому интерпретация не внесена в основной текст.
- source_word: כִּפָּה
  choice: пальмовую ветвь
  rationale: Слово обозначает верхушку или ветвь пальмы и создаёт образ возвышенного в противопоставлении болотному растению.
- source_word: וְאַגְמוֹן
  choice: тростник
  rationale: Слово обозначает болотное растение, камыш или тростник. «Тростник» — понятный литературный эквивалент, сохраняющий контраст с пальмовой ветвью.
- source_word: יוֹם אֶחָד
  choice: в один день
  rationale: Естественная русская передача временного выражения, подчёркивающего внезапность и полноту суда.
theological_decisions:
- issue: Сохранение метафоры или её истолкование в основном тексте
  choice: Сохранить «голову и хвост, пальмовую ветвь и тростник»
  alternative: 'Передать толковательно: «высших и низших» или «вождей и ведомых»'
  rationale: Оригинал использует предметные образы, истолкованные в следующем стихе. Их сохранение уважает форму исходного текста и не подменяет перевод объяснением.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис близок к еврейскому, но естественен по-русски; парные метафоры и личное имя Яхве сохранены.
