source:
  edition: WLC
  text: דָּבָ֛ר שָׁלַ֥ח אֲדֹנָ֖/י בְּ/יַעֲקֹ֑ב וְ/נָפַ֖ל בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/007.yaml
  text: The Lord sent a word into Jacob[a], and it fell on Israel.
translation:
  language: ru
  text: Господь послал слово к Иакову[a], и оно пало на Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь послал весть против Иакова, и она обрушилась на Израиль».'
    reason: 'Лексико-синтаксическая альтернатива: דָּבָר может означать «весть», а предлог בְּ в данном контексте — указывать на цель враждебного действия.'
lexical_decisions:
- source_word: דָּבָר
  choice: слово
  rationale: Существительное может означать «слово», «весть» или «дело». «Слово» сохраняет лаконичность и образ действенного Божьего провозглашения, не сводя его только к сообщению.
- source_word: שָׁלַח
  choice: послал
  rationale: Передаёт основное значение глагола и естественно сочетается со «словом» в контексте пророческого возвещения.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: В исходном тексте стоит божественный титул אֲדֹנָי, а не тетраграмматон; поэтому он переведён обычным русским титулом «Господь».
- source_word: בְּיַעֲקֹב
  choice: к Иакову
  rationale: Предлог בְּ здесь допускает направительное, целевое или враждебное понимание. «К Иакову» естественно выражает адресованность слова и не устраняет неоднозначность контекста суда; вариант «против Иакова» указан в сноске.
- source_word: וְנָפַל
  choice: и оно пало
  rationale: Буквальный образ падения сохранён; местоимение «оно» ясно соотносит действие со «словом».
- source_word: בְּיִשְׂרָאֵל
  choice: на Израиль
  rationale: При глаголе נפל предлог естественно передаётся как «на» и сохраняет образ слова, достигшего Израиля с действенной силой.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: Владыка
  rationale: Источник содержит титул אֲדֹנָי, не личное имя יהוה. «Господь» — укоренившаяся, понятная и точная передача титула в литературном русском языке.
- issue: Смысл предлога בְּ при именах Иаков и Израиль
  choice: направленность слова к Иакову и его падение на Израиль
  alternative: слово суда против Иакова и Израиля
  rationale: Контекст допускает карательную направленность, но сама краткая формула сохраняет игру направительного и ударного образов. Основной текст не делает враждебное значение явным сверх того, что выражено глаголом «пало»; судебное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Сохранены параллелизм «Иаков — Израиль» и конкретный образ слова, которое «пало» на народ.
