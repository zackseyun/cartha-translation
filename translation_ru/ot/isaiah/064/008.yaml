  text: אַל תִּקְצֹ֤ף יְהוָה֙ עַד מְאֹ֔ד וְ/אַל לָ/עַ֖ד תִּזְכֹּ֣ר עָוֺ֑ן הֵ֥ן הַבֶּט נָ֖א עַמְּ/ךָ֥ כֻלָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/008.yaml
  text: 'Do not be exceedingly angry[a], O Yahweh, and do not remember iniquity forever. Look, please: we are all your people.'
translation:
  language: ru
  text: 'Не гневайся, Яхве, слишком сильно и не помни вечно беззакония[a]. Вот, взгляни, прошу: все мы — твой народ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вины». Еврейское עָוֺן может обозначать как беззаконие, так и вину, возникающую вследствие него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּקְצֹף ... עַד מְאֹד
  choice: Не гневайся ... так сильно
  rationale: Запретительная частица אַל с глаголом передаёт мольбу прекратить или не проявлять гнев; עַד מְאֹד усиливает выражение. Русское «так сильно» естественно и не превращает просьбу в утверждение, будто любой гнев исключён.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: וְאַל לָעַד תִּזְכֹּר עָוֺן
  choice: и не помни вечно беззакония
  rationale: Сохранён образ памятования о проступке с целью суда; לָעַד передано наречием «вечно», а עָוֺן — словом «беззаконие», сохраняющим нравственную тяжесть выражения.
- source_word: הֵן הַבֶּט נָא
  choice: Вот, взгляни, прошу
  rationale: «Вот» передаёт привлекающее внимание הֵן, «взгляни» — повелительное הַבֶּט, а «прошу» — смягчающую и просительную частицу נָא.
- source_word: עַמְּךָ כֻלָּנוּ
  choice: все мы — твой народ
  rationale: Безглагольная еврейская конструкция естественно передана русским именным предложением; порядок слов подчёркивает, что к Божьему народу принадлежат все молящиеся.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение עָוֺן в покаянной молитве
  choice: беззаконие
  alternative: вина
  rationale: Слово может обозначать как неправедный поступок, так и возникшую вследствие него вину. В основном тексте сохранено обозначение проступка, а альтернативный смысл отмечен в сноске без устранения смысловой напряжённости.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Формы «гневайся», «взгляни, прошу» понятны широкому читателю и сохраняют настойчиво-просительный тон; местоимение «твой» написано со строчной буквы в соответствии с нейтральной современной издательской нормой.
