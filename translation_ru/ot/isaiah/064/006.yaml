  source_fidelity: 'Основной перевод верно передаёт отсутствие призывающих Божье имя, образ сокрытого лица и контекстуально обоснованное значение заключительной фразы: народ отдан во власть собственного беззакония. Однако «не пробуждается» обычно означает просто выход из сна и недостаточно ясно передаёт активный возвратный оттенок מִתְעוֹרֵר («побуждает/пробуждает себя»). Сноска должна точнее отражать прямую каузативную силу образного глагола.'
