  yaml_path: translation/ot/isaiah/064/006.yaml
  text: And there is no one who calls on your name[a], who stirs himself up to take hold of you; for you have hidden your face from us and have given us over into the hand of our iniquity.
translation:
  language: ru
  text: И никто не призывает Твоё имя, никто не пробуждает себя, чтобы крепко держаться за Тебя, ибо Ты скрыл от нас Своё лицо и предал нас во власть нашего беззакония[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «и Ты заставил нас таять в руке нашего беззакония». Еврейский глагол создаёт образ таяния, растворения или изнеможения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵין
  choice: И никто не
  rationale: Естественно передаёт соединительный союз и полное отрицание наличия кого-либо.
- source_word: קוֹרֵא בְשִׁמְךָ
  choice: не призывает Твоего имени
  rationale: Сохраняет библейскую формулу обращения к Богу в молитве и почитании, не сводя её к простому называнию по имени.
- source_word: מִתְעוֹרֵר
  choice: не пробуждается
  rationale: Передаёт образ внутреннего пробуждения и возвратность формы хитпаэль; в русском контексте действие понимается как сознательное побуждение самого себя.
- source_word: לְהַחֲזִיק בָּךְ
  choice: чтобы крепко держаться за Тебя
  rationale: Передаёт значение хвататься или твёрдо держаться и сохраняет живой образ настойчивого обращения к Богу.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит причину описанного духовного бездействия.
- source_word: הִסְתַּרְתָּ פָנֶיךָ מִמֶּנּוּ
  choice: Ты скрыл от нас Своё лицо
  rationale: Сохраняет устойчивый древнееврейский образ Божьего удаления или неблаговоления.
- source_word: וַתְּמוּגֵנוּ
  choice: и предал нас
  rationale: В контексте выражает оставление народа под властью собственного беззакония. Буквальный образ таяния сохранён в сноске.
- source_word: בְּיַד
  choice: во власть
  rationale: Естественно передаёт идиому «в руке», обозначающую власть или контроль, без неясной для современного русского читателя буквальности.
- source_word: עֲוֺנֵנוּ
  choice: нашего беззакония
  rationale: Сохраняет собирательное единственное число и нравственную тяжесть עָוֹן, которое может охватывать беззаконие, вину и её последствия.
theological_decisions:
- issue: Божественное действие и человеческое беззаконие в заключительной фразе
  choice: Бог предаёт народ во власть его собственного беззакония.
  alternative: Бог заставляет народ растаять посредством или в руке его беззакония.
  rationale: Перевод сохраняет одновременно Божий суд и ответственность народа, не уточняя сверх текста механизм причинности. Необычный буквальный образ глагола מוג отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой молитвы. Местоимения, относящиеся к Богу, написаны с прописной буквы. Образы «скрыл лицо» и «держаться за Тебя» сохранены, а не заменены отвлечёнными богословскими формулами.
