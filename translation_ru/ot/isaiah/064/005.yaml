  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/נְּהִ֤י כַ/טָּמֵא֙ כֻּלָּ֔/נוּ וּ/כְ/בֶ֥גֶד עִדִּ֖ים כָּל צִדְקֹתֵ֑י/נוּ וַ/נָּ֤בֶל כֶּֽ/עָלֶה֙ כֻּלָּ֔/נוּ וַ/עֲוֺנֵ֖/נוּ כָּ/ר֥וּחַ יִשָּׂאֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/005.yaml
  text: We all became like one who is unclean[a], and all our righteous deeds are like a filthy garment; we all wither like a leaf, and our iniquities carry us away like the wind.
translation:
  language: ru
  text: Все мы стали словно нечистые, и все наши праведные дела — как осквернённая одежда[a]. Все мы увяли, как лист, и наши беззакония, словно ветер, уносят нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как одежда при менструальной нечистоте».'
    reason: Лексически конкретный смысл выражения בֶגֶד עִדִּים существенен, но его буквальная передача в основном тексте звучала бы по-русски тяжеловесно и чрезмерно клинически.
lexical_decisions:
- source_word: וַנְּהִי כַטָּמֵא כֻּלָּנוּ
  choice: Все мы стали словно нечистые
  rationale: וַנְּהִי передаёт переход в состояние, поэтому выбрано «стали»; טָמֵא сохраняет образ нечистоты, не сводя его исключительно к обрядовой или нравственной категории; כֻּלָּנוּ передано с эмфатическим «все мы».
- source_word: וּכְבֶגֶד עִדִּים
  choice: как осквернённая одежда[a]
  rationale: Сочетание обозначает одежду, связанную с менструальной нечистотой. В основном тексте сохранён сильный, но естественный образ осквернения, а более конкретное значение вынесено в сноску.
- source_word: כָּל צִדְקֹתֵינוּ
  choice: все наши праведные дела
  rationale: Множественное число צִדְקוֹת в данном контексте указывает на конкретные праведные поступки, а не только на отвлечённую праведность.
- source_word: וַנָּבֶל כֶּעָלֶה כֻּלָּנוּ
  choice: Все мы увяли, как лист
  rationale: נבל описывает увядание растительности; «увяли» сохраняет видовременную форму и непосредственно поддерживает сравнение с листом.
- source_word: וַעֲוֺנֵינוּ
  choice: наши беззакония
  rationale: עָוֹן может обозначать беззаконие, вину или её последствия. «Беззакония» сохраняет нравственную тяжесть слова, не устраняя его смысловой объём.
- source_word: כָרוּחַ יִשָּׂאֻנוּ
  choice: словно ветер, уносят нас
  rationale: נשא буквально означает «нести, поднимать»; в образе увядшего листа ветер уносит человека прочь. Настоящее время естественно передаёт незавершённое действие формы יִשָּׂאֻנוּ.
theological_decisions:
- issue: Характер нечистоты в покаянном признании
  choice: Сохранить образы нечистоты и осквернённой одежды без их сведения только к обрядовой нечистоте или к поздней систематической формуле о человеческой греховности.
  alternative: Истолковать текст либо исключительно как обрядовую метафору, либо как прямую формулировку определённой доктрины о полной испорченности.
  rationale: Еврейский текст использует культовый образ в нравственно-покаянном контексте. Перевод сохраняет это напряжение и не добавляет более узкой конфессиональной интерпретации.
- issue: Значение עָוֹן
  choice: Передать как «беззакония», сохраняя основной нравственный смысл.
  alternative: Передать как «вина» или «последствия вины».
  rationale: В контексте возможно смысловое наложение проступка, вины и последствий; «беззакония» лучше всего согласуется с множественным числом и позволяет образу того, что уносит людей, сохранить поэтическую многозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной покаянно-поэтической интонацией. Параллелизм «Все мы… Все мы…» сохранён; лексика не архаизирована и не привязана к конфессиональной терминологии.
