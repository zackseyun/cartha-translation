    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲשׂוֹתְךָ
  choice: Когда Ты совершил
  rationale: Предлог ב при инфинитиве сопряжённой формы עשה с суффиксом 2-го лица вводит временное придаточное; совершенный вид естественно передаёт здесь завершённое действие.
- source_word: נוֹרָאוֹת
  choice: грозные дела
  rationale: Слово обозначает деяния, внушающие страх и благоговейный трепет. «Грозные» сохраняет величественную силу образа и не сводит смысл к чему-то просто ужасному.
- source_word: לֹא נְקַוֶּה
  choice: которых мы не ожидали
  rationale: קוה может означать надеяться, ждать или ожидать. В данном контексте речь идёт о неожиданных для молящихся Божьих деяниях; перевод не уточняет, были ли они желанными.
- source_word: יָרַדְתָּ
  choice: Ты сошёл
  rationale: Прямое и естественное обозначение нисхождения Бога в контексте Богоявления.
- source_word: מִפָּנֶיךָ
  choice: от Твоего присутствия
  rationale: Буквально «от Твоего лица/присутствия»; такая формулировка ясно показывает, что происходящее с горами вызвано явлением Бога.
- source_word: הָרִים
  choice: горы
  rationale: Прямое соответствие еврейскому существительному во множественном числе.
- source_word: נָזֹלּוּ
  choice: потекли
  rationale: Сохранён конкретный поэтический образ текучести или растворения гор. Более привычные «растаяли» и «содрогнулись» уже истолковывают точный характер образа и поэтому приведены в примечании.
theological_decisions:
- issue: Образ гор, реагирующих на нисхождение и присутствие Бога
  choice: 'Сохранить конкретный образ: «от Твоего присутствия горы потекли»'
  alternative: «горы растаяли перед Тобой» или «горы содрогнулись перед Тобой»
  rationale: Еврейский глагол создаёт образ текучести и распада. Буквальный поэтический образ сохраняет представление о творении, не способном устоять перед Божьим присутствием, но не определяет однозначно физическое явление.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим строем. Обращение к Богу оформлено традиционными прописными местоимениями. Тире передаёт резкий переход к последствию Богоявления; необычный образ «горы потекли» намеренно сохранён и пояснён в сноске.
