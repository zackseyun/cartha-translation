source:
  edition: WLC
  text: עָרֵ֥י קָדְשְׁ/ךָ֖ הָי֣וּ מִדְבָּ֑ר צִיּוֹן֙ מִדְבָּ֣ר הָיָ֔תָה יְרוּשָׁלִַ֖ם שְׁמָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/009.yaml
  text: Your holy cities have become a wilderness; Zion has become a wilderness[a], Jerusalem a desolation.
translation:
  language: ru
  text: Твои святые города стали пустыней; Сион стал пустыней[a], Иерусалим — запустением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безлюдной землёй»; так же в первом случае.'
    reason: Лексическая альтернатива для מִדְבָּר, которое может обозначать пустынную или необитаемую местность.
lexical_decisions:
- source_word: עָרֵי קָדְשְׁךָ
  choice: Твои святые города
  rationale: Естественно передаёт конструкцию «города Твоей святости», сохраняя идею принадлежности Богу и святости городов.
- source_word: הָיוּ
  choice: стали
  rationale: Перфект היה допускает значение наступившего состояния; «стали» ясно выражает переход к нынешнему разорению.
- source_word: מִדְבָּר
  choice: пустыней
  rationale: מִדְבָּר обозначает пустынную, необитаемую местность; «пустыня» сохраняет образ опустошения, не сводя его только к развалинам.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Традиционная и общепринятая русская передача имени собственного.
- source_word: הָיָתָה
  choice: стал
  rationale: Согласуется с русским родом названия «Сион» и передаёт наступившее состояние, выраженное перфектом היה.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Традиционная и общепринятая русская передача имени собственного.
- source_word: שְׁמָמָה
  choice: запустением
  rationale: Существительное передаёт состояние полного опустошения и сохраняет именную структуру еврейского сказуемого.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией плача. Повтор «пустыней» сохранён как значимый элемент еврейского параллелизма; в последней части естественная русская связка опущена.
