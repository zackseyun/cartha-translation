  source_fidelity: 'Основной смысл передан верно: это два риторических вопроса к Яхве о Его кажущемся безмолвии и продолжающемся причинении народу страданий. Однако «угнетать» в современном русском обычно предполагает социальное или политическое притеснение и сужает значение еврейского ענה; здесь безопаснее передать общее причинение тяжёлых страданий. «При всём этом» возможно, но менее точно выражает связь עַל אֵלֶּה («из-за / по поводу всего этого»).'
