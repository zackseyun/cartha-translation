  terminology: «Яхве» последовательно и точно передаёт тетраграмматон. «Сдерживать Себя» сохраняет возвратный оттенок хитпаэля. Альтернатива «смирять нас» в сноске уместна, но пояснение следует формулировать без излишнего отождествления «смирения» с «угнетением».
