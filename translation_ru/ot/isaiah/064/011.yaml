base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/011.yaml
  text: Will you restrain yourself over these things[b][a], O Yahweh? Will you keep silent and afflict us so very severely?
translation:
  language: ru
  text: Неужели из-за всего этого Ты будешь сдерживать Себя, Яхве?[a] Неужели Ты будешь молчать и подвергать нас тяжким страданиям без меры?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели Ты будешь сдерживаться из-за всего этого, Яхве?»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и безмерно смирять нас?» Еврейский глагол может означать причинять страдания, унижать или смирять.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: Неужели при всём этом
  rationale: Вопросительная частица הַ при עַל образует риторический вопрос, а אֵלֶּה отсылает к только что описанному разорению. Оборот «при всём этом» естественно передаёт обстоятельство, на фоне которого Яхве, как кажется молящимся, не действует.
- source_word: תִתְאַפַּק
  choice: будешь сдерживать Себя
  rationale: Форма хитпаэль от אפק выражает удерживание или сдерживание самого себя; возвратное значение сохранено явно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: תֶּחֱשֶׁה
  choice: будешь молчать
  rationale: Глагол означает «молчать, оставаться безмолвным»; в риторическом вопросе речь идёт о кажущемся продолжающемся молчании Бога.
- source_word: וּתְעַנֵּנוּ
  choice: и безмерно угнетать нас
  rationale: Пиэль от ענה в данном контексте означает причинять страдание, угнетать или смирять. «Угнетать» сохраняет идею тяжёлого воздействия, не устраняя возможный оттенок унижения или смирения.
- source_word: עַד מְאֹד
  choice: безмерно
  rationale: Усилительное выражение обозначает крайнюю степень и кратко, естественно сочетается по-русски с глаголом «угнетать».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Характер Божьего действия в וּתְעַנֵּנוּ
  choice: угнетать нас
  alternative: смирять нас; подвергать нас страданиям
  rationale: Контекст плача поддерживает значение причинения тяжёлого страдания, однако еврейский глагол допускает оттенок смирения. Этот диапазон отмечен в сноске, чтобы не устранять напряжение текста.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией молитвенного плача. Повтор «Неужели» передаёт напряжённость двух риторических вопросов; местоимение «Ты» написано с прописной буквы как уважительное обращение к Богу.
