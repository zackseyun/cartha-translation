revisions:
- from: От века никто не слышал, ни одно ухо не внимало, ни один глаз не видел Бога, кроме Тебя, Который действует ради того, кто ждёт Его.
  to: От века никто не слышал, ни одно ухо не внимало, ни один глаз не видел никакого Бога, кроме Тебя, Который действует для того, кто ждёт Его.
  rationale: 'Внесены лишь стилистико-семантические уточнения: «никакого» делает исключительную формулу ясной в русском отрицательном предложении, а «для» естественно передаёт бенефактивное לְ. Неоднозначность формы יַעֲשֶׂה сохранена в относительном придаточном «Который действует».'
