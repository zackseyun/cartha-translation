  text: וּ/מֵ/עוֹלָ֥ם לֹא שָׁמְע֖וּ לֹ֣א הֶאֱזִ֑ינוּ עַ֣יִן לֹֽא רָאָ֗תָה אֱלֹהִים֙ זוּלָ֣תְ/ךָ֔ יַעֲשֶׂ֖ה לִ/מְחַכֵּה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/003.yaml
  text: From of old no one has heard, no ear has listened, no eye has seen a God besides you, who acts for the one who waits for him.
translation:
  language: ru
  text: От века никто не слышал, ни одно ухо не внимало, ни один глаз не видел никакого Бога, кроме Тебя, Который действует для того, кто ждёт Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵעוֹלָם
  choice: От века
  rationale: Передаёт временное значение «с древних времён / испокон веков» кратко и в достойном библейском регистре.
- source_word: לֹא שָׁמְעוּ לֹא הֶאֱזִינוּ
  choice: никто не слышал, ни одно ухо не внимало
  rationale: Первый глагол выражает восприятие слухом, второй — внимательное слушание; формулировка сохраняет параллелизм и учитывает подразумеваемое «ухо» во второй части.
- source_word: אֱלֹהִים זוּלָתְךָ
  choice: Бога, кроме Тебя
  rationale: Сохраняет прямое обращение ко второму лицу и утверждение об отсутствии иного Бога такого рода.
- source_word: יַעֲשֶׂה
  choice: Который действует
  rationale: Незавершённая форма допускает характеристику обычного, продолжающегося действия; настоящее время естественно передаёт это по-русски.
- source_word: לִמְחַכֵּה לוֹ
  choice: ради того, кто ждёт Его
  rationale: לְ перед причастием обозначает того, в чью пользу совершается действие; «ждёт» сохраняет смысл уповающего ожидания без добавления толкования.
theological_decisions:
- issue: Связь придаточного יַעֲשֶׂה לִמְחַכֵּה לוֹ
  choice: отнести «Который действует...» к Богу
  alternative: 'понять как отдельное утверждение: «Он совершит [это] для ожидающего Его»'
  rationale: Масоретская последовательность естественно допускает определительное описание Бога; при этом настоящее «действует» не уточняет вид благодеяния и сохраняет смысловую открытость.
- issue: Формула אֱלֹהִים זוּלָתְךָ
  choice: «Бога, кроме Тебя»
  alternative: «Бога, подобного Тебе»
  rationale: זוּלָתְךָ буквально выражает исключение («кроме Тебя»); перевод не подменяет его сравнением, хотя контекст подразумевает уникальность Божьих дел.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавные местоимения в обращении к Богу сохранены как принятая русская издательская норма; синтаксический параллелизм еврейской строки передан без тяжеловесной буквальности.
