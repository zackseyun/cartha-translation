    rationale: Еврейское כִּקְדֹחַ содержит инфинитив קדח после сравнительной частицы; перевод личным глаголом добавляет явный субъект и несколько сглаживает образ события. Безличное «как от огня разгорается хворост» ближе к форме и естественнее.
  - severity: low
    issue: «Чтобы сделать имя Твоё известным»
    rationale: Формально допустимо для хифиля ידע, но в русском тяжеловесно. «Чтобы возвестить Твоё имя» сохраняет целевое и каузативное значение, а также библейский регистр.
  - severity: low
