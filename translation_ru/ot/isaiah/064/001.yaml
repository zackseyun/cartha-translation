base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/001.yaml
  text: As when fire kindles brushwood[a], and fire causes water to boil, to make your name known to your adversaries[c][b], so that nations tremble at your presence—
translation:
  language: ru
  text: Как от огня разгорается хворост[a] и закипает вода[b], чтобы возвестить Твоё имя Твоим противникам, чтобы народы затрепетали от Твоего присутствия[c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стерня», «сухие ветви» или «растопка». Еврейское слово встречается редко и, вероятно, обозначает легко воспламеняющийся материал.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вода начинает бурлить».'
    reason: lexical_alternative
  - marker: c
    text: В некоторых традициях нумерации эта строка относится к Ис. 63:19б.
    reason: textual_variant
lexical_decisions:
- source_word: כִּקְדֹחַ
  choice: как ... воспламеняет
  rationale: כְּ вводит сравнение, а инфинитив קָדַח передаёт разжигание или горение. Формулировка сохраняет образ сравнения и естественно звучит по-русски.
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое и контекстуально ясное соответствие обоим употреблениям слова.
- source_word: הֲמָסִים
  choice: хворост
  rationale: Редкое и не вполне ясное слово обозначает легко воспламеняющийся материал. «Хворост» естественно передаёт этот образ, не создавая ложной точности.
- source_word: מַיִם תִּבְעֶה אֵשׁ
  choice: от огня вскипает вода
  rationale: В данном контексте תִּבְעֶה описывает кипение или бурление воды под действием огня. Русская конструкция сохраняет причинную связь и поэтическую плавность.
- source_word: לְהוֹדִיעַ
  choice: чтобы сделать ... известным
  rationale: Причинный инфинитив породы хифиль от ידע означает «сделать известным». Перевод сохраняет целевое значение и не заменяет его более узким «возвестить» или «открыть».
- source_word: שִׁמְךָ
  choice: имя Твоё
  rationale: Сохранён библейский образ имени как выражения личности, славы и известности Бога без поясняющего парафраза.
- source_word: לְצָרֶיךָ
  choice: Твоим противникам
  rationale: צַר обозначает противника или врага. «Противники» сохраняет широкий смысл и не ограничивает образ военным конфликтом.
- source_word: מִפָּנֶיךָ
  choice: пред Тобой
  rationale: Буквально выражение связано с лицом или присутствием. «Пред Тобой» — естественный русский библейско-литературный оборот, сохраняющий смысл непосредственного Божьего явления.
- source_word: גּוֹיִם
  choice: народы
  rationale: Здесь слово обозначает народы вообще; перевод не сужает его до религиозно окрашенного значения «язычники».
- source_word: יִרְגָּזוּ
  choice: затрепетали
  rationale: Глагол выражает дрожь, содрогание или сильное волнение. «Затрепетали» соответствует явлению Божьего присутствия и сохраняет возвышенный, но понятный регистр.
theological_decisions:
- issue: Связь стиха с предшествующей мольбой
  choice: Передать стих как продолжающий предыдущую просьбу сравнительный образ и завершить его тире, не добавляя в текст отсутствующую здесь просьбу о сошествии Бога.
  alternative: 'Повторить или включить в этот стих слова предшествующей просьбы: «О, если бы Ты разорвал небеса и сошёл».'
  rationale: Еврейский текст данного стиха начинается со сравнения и синтаксически зависит от предшествующего контекста. Незавершённое тире сохраняет эту поэтическую связь, не привнося чужих слов.
- issue: Цель Божьего явления
  choice: Сохранить формулировку о том, что Божье имя становится известным противникам, а народы трепещут пред Ним.
  alternative: Истолковать образ исключительно как осуждение врагов либо исключительно как очищение.
  rationale: Образ огня и кипящей воды выражает мощь Божьего явления, но сам стих не сводит её к одной доктринальной категории.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Местоимения, обращённые к Богу, написаны с прописной буквы. Сравнение и синтаксическая незавершённость сохранены, поскольку стих продолжает предшествующую мольбу.
