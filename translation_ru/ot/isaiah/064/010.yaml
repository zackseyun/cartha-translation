base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/010.yaml
  text: Our holy and beautiful house[a], where our fathers praised you, has become a burning with fire[b], and all our precious things have become a ruin.
translation:
  language: ru
  text: Наш святой и прекрасный дом[a], где наши отцы[b] восхваляли Тебя, был сожжён огнём[c], и всё дорогое нам превратилось в развалины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом нашей святости и нашего великолепия (или красоты)»; по контексту — храм.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наши предки». В еврейском тексте буквально: «наши отцы».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально еврейское выражение можно передать: «стал сожжением огня»; по смыслу: «сгорел в огне».'
    reason: translation_clarity
lexical_decisions:
- source_word: בֵּית קָדְשֵׁנוּ וְתִפְאַרְתֵּנוּ
  choice: наш святой и славный дом
  rationale: Конструкция буквально означает «дом нашей святости и нашей славы/красы». Прилагательные передают её естественно по-русски; «славный» сохраняет возможные значения великолепия, красоты и почёта, не сводя תפארת только к внешней красоте. Слово «дом» оставлено в основном тексте, хотя по контексту речь прежде всего о храме.
- source_word: אֲשֶׁר הִלְלוּךָ אֲבֹתֵינוּ
  choice: где наши отцы восхваляли Тебя
  rationale: Относительное местоимение получает естественное локативное соответствие «где». אבותינו прямо означает «наши отцы»; этот исходный образ сохранён, а более общее «предки» дано в примечании.
- source_word: הִלְלוּךָ
  choice: восхваляли Тебя
  rationale: Пиэль глагола הלל обычно обозначает хвалу, особенно в богослужебном контексте. «Восхваляли» звучит естественно и достойно применительно к служению в святилище.
- source_word: הָיָה לִשְׂרֵפַת אֵשׁ
  choice: был сожжён огнём
  rationale: Еврейское именное выражение буквально описывает превращение дома в «сожжение огня». Русская пассивная конструкция ясно и естественно передаёт тот же итог полного огненного уничтожения; более буквальное устройство выражения отмечено в сноске.
- source_word: וְכָל מַחֲמַדֵּינוּ
  choice: и всё дорогое нам
  rationale: מַחֲמַדִּים может обозначать драгоценные, желанные или любимые вещи. Субстантивированное «всё дорогое нам» сохраняет широту выражения и не ограничивает его только сокровищами или храмовой утварью.
- source_word: הָיָה לְחָרְבָּה
  choice: превратилось в развалины
  rationale: חָרְבָּה обозначает разорение, опустошение или руины. «Превратилось в развалины» конкретно и естественно передаёт результат разрушения, согласуясь с собирательным «всё».
theological_decisions:
- issue: К чему относится выражение «наш святой и славный дом»
  choice: В основном тексте сохранено слово «дом»; по ближайшему контексту оно прежде всего обозначает Иерусалимский храм.
  alternative: Понимать выражение шире — как указание на Иерусалим или священные места земли.
  rationale: Упоминание места, где отцы восхваляли Бога, убедительно указывает на храм, однако перевод «дом» не устраняет образную широту исходного слова и не подменяет его прямым толкованием.
- issue: Передача אֲבֹתֵינוּ
  choice: наши отцы
  alternative: наши предки
  rationale: Еврейский текст употребляет явно мужское существительное во множественном числе, имеющее также заветно-исторический оттенок. Основной текст сохраняет эту форму, а смысловой вариант «предки» указан в примечании.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным регистром. Синтаксис сохраняет форму общего плача; прописная буква в местоимении «Тебя» поддерживает принятую в русском религиозном письме почтительность. Формулировки не вводят конфессионально специфического толкования.
