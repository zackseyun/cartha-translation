  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עַתָּ֥ה יְהוָ֖ה אָבִ֣י/נוּ אָ֑תָּה אֲנַ֤חְנוּ הַ/חֹ֨מֶר֙ וְ/אַתָּ֣ה יֹצְרֵ֔/נוּ וּ/מַעֲשֵׂ֥ה יָדְ/ךָ֖ כֻּלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/007.yaml
  text: But now, O Yahweh, you are our Father; we are the clay, and you are our potter; we all are the work of your hand.
translation:
  language: ru
  text: Но теперь, Яхве, ты — наш Отец. Мы — глина, а ты — наш Гончар; все мы — дело твоей руки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Но теперь
  rationale: Сочетание союза с наречием времени обозначает переход и в данном контексте противопоставляет нынешнее обращение предшествующему описанию бедствия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אָבִינוּ אָתָּה
  choice: ты — наш Отец
  rationale: Сохранены прямое обращение, отцовский образ и смысл именного предложения; тире естественно передаёт отсутствующую в еврейском связку.
- source_word: אֲנַחְנוּ הַחֹמֶר
  choice: Мы — глина
  rationale: В русском языке определённость не выражается артиклем; слово «глина» точно сохраняет материал гончарного образа.
- source_word: וְאַתָּה יֹצְרֵנוּ
  choice: а ты — наш Гончар
  rationale: Причастие от יצר означает формирующего; образ глины делает значение «Гончар» контекстуально точным. Союз «а» естественно передаёт параллельное сопоставление.
- source_word: וּמַעֲשֵׂה יָדְךָ כֻּלָּנוּ
  choice: все мы — дело твоей руки
  rationale: Сохранены конечное обобщение, поэтический образ труда Божьей руки и единственное число слова «рука» в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Отцовское именование Бога
  choice: наш Отец
  alternative: наш Родитель
  rationale: Еврейское אָבִינוּ прямо означает «наш Отец»; родственный образ сохранён без гендерно-нейтральной замены.
- issue: Образ Бога как формирующего глину
  choice: наш Гончар
  alternative: тот, кто нас сформировал
  rationale: Контекст прямо называет народ глиной, поэтому ремесленный образ гончара следует сохранить, не сводя его к отвлечённому утверждению о сотворении.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного поэтического параллелизма. Прописные буквы в словах «Отец» и «Гончар» отмечают употребление как именований Бога; местоимения даны со строчной буквы в соответствии с нейтральной современной издательской практикой.
