  text: פָּגַ֤עְתָּ אֶת שָׂשׂ֙ וְ/עֹ֣שֵׂה צֶ֔דֶק בִּ/דְרָכֶ֖י/ךָ יִזְכְּר֑וּ/ךָ הֵן אַתָּ֤ה קָצַ֨פְתָּ֙ וַֽ/נֶּחֱטָ֔א בָּ/הֶ֥ם עוֹלָ֖ם וְ/נִוָּשֵֽׁעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/004.yaml
  text: You meet the one who gladly does righteousness[a], those who remember you in your ways. Behold, you were angry, and we sinned; in them we have been a long time[b], and shall we be saved?
translation:
  language: ru
  text: Ты встретил тех, кто радуется и поступает праведно,[a] кто помнит о Тебе на Твоих путях. Вот, Ты разгневался, а мы согрешили; в них мы пребывали долгое время[b] — и разве мы спасёмся?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто с радостью поступает праведно». Еврейские причастия можно понимать либо как две характеристики людей — они радуются и поступают праведно, — либо как указание на то, что они с радостью творят праведное.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза в еврейском тексте синтаксически трудна. Возможны также переводы: «в них — постоянство, и мы спасёмся» или «в них мы пребывали долгое время, и мы спасёмся». Местоимение «в них» также имеет неясную отсылку.'
    reason: alternative_reading
lexical_decisions:
- source_word: פָּגַעְתָּ
  choice: Ты встречаешь
  rationale: Глагол פגע здесь естественно передаёт встречу Бога с человеком; настоящее время по-русски уместно для обобщённого утверждения и не привносит значения враждебного столкновения или ходатайства.
- source_word: שָׂשׂ וְעֹשֵׂה צֶדֶק
  choice: того, кто радуется и поступает праведно
  rationale: Два причастия сохранены как однородные характеристики человека. Такая передача формально ближе к еврейскому и не сужает радость до одного лишь радостного исполнения праведности.
- source_word: צֶדֶק
  choice: праведно
  rationale: В данном нравственно-богословском контексте наречная конструкция «поступает праведно» звучит естественно и сохраняет смысл праведности; «справедливо» было бы несколько уже.
- source_word: בִּדְרָכֶיךָ יִזְכְּרוּךָ
  choice: тех, кто помнит Тебя на Твоих путях
  rationale: 'Сохранены образ «путей» и неоднозначная связь слов: речь может идти о помнящих Бога при хождении Его путями. Более пояснительный перевод не внесён в основной текст.'
- source_word: הֵן
  choice: Вот
  rationale: Современный литературный указательный маркер с достаточной риторической силой, без архаизма «се».
- source_word: קָצַפְתָּ
  choice: Ты разгневался
  rationale: Передаёт совершившееся проявление Божьего гнева естественным и весомым русским выражением.
- source_word: וַנֶּחֱטָא
  choice: а мы согрешили
  rationale: Союз «а» естественно выражает напряжённое соположение Божьего гнева и человеческого греха, не навязывая строго причинной или временной связи.
- source_word: בָּהֶם
  choice: в них
  rationale: Местоименная отсылка в еврейском неясна; буквальная передача сохраняет эту неоднозначность и не определяет самовольно, идёт ли речь о путях, грехах или упомянутых обстоятельствах.
- source_word: עוֹלָם
  choice: долгое время
  rationale: Здесь עוֹלָם обозначает длительность; перевод не преувеличивает её до абсолютной вечности в синтаксически трудной фразе.
- source_word: וְנִוָּשֵׁעַ
  choice: и разве мы спасёмся?
  rationale: Нифаль передан возвратным страдательным по смыслу глаголом «спасёмся». Частица «разве» ясно оформляет избранное вопросительное прочтение, соответствующее напряжению покаянной жалобы.
theological_decisions:
- issue: Связь радости и праведного поступка
  choice: «того, кто радуется и поступает праведно»
  alternative: «того, кто с радостью поступает праведно»
  rationale: Еврейские причастия допускают как две параллельные характеристики, так и понимание радости как отношения к праведному делу. Основной текст сохраняет более формальную координацию, а альтернативу отмечает сноска.
- issue: Толкование заключительного וְנִוָּשֵׁעַ
  choice: 'риторический вопрос: «и разве мы спасёмся?»'
  alternative: 'утверждение: «и мы спасёмся»'
  rationale: Еврейская форма сама по себе не маркирует вопрос, а весь заключительный оборот синтаксически труден. Вопросительное прочтение сохраняет напряжение покаянной жалобы; утвердительное прочтение приведено в сноске как реальная возможность.
- issue: Референт בָּהֶם
  choice: 'не уточнять: «в них»'
  alternative: «на этих путях» или «в этих грехах»
  rationale: Уточнение могло бы богословски разрешить подлинную неоднозначность исходного текста. Поэтому местоимение оставлено без экспликации.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю и сохраняющий достоинство пророческой молитвы. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции. Синтаксическая трудность последней части не сглажена; она обозначена сноской.
