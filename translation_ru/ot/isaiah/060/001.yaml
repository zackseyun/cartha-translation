lexical_decisions:
- source_word: ק֥וּמִי
  choice: Встань
  rationale: Повелительная форма женского рода единственного числа от קום обращена к олицетворённому Сиону/Иерусалиму. «Встань» прямо передаёт призыв и естественно звучит в современном литературном русском.
- source_word: א֖וֹרִי
  choice: сияй
  rationale: Повелительная форма от אור призывает адресата стать видимо светлым или излучать свет. «Сияй» сохраняет образ и связь со словами «твой свет», не сужая значение до одного оттенка.
- source_word: כִּ֣י
  choice: потому что
  rationale: Союз вводит основание для двух повелений. «Потому что» ясно передаёт причинную связь и остаётся естественным для современного читателя.
- source_word: בָ֣א אוֹרֵ֑ךְ
  choice: пришёл твой свет
  rationale: Перфект בוא представлен как уже совершившееся событие, что сохраняет пророческую яркость и уверенность; אוֹר с суффиксом второго лица женского рода означает «твой свет».
- source_word: וּכְב֥וֹד
  choice: и слава
  rationale: כבוד может обозначать славу, величие и явленное присутствие. «Слава» сохраняет широкий смысл и устойчиво сочетается с Божьим именем.
- source_word: יְהוָ֖ה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: עָלַ֥יִךְ זָרָֽח
  choice: взошла над тобой
  rationale: זרח употребляется о восходе и появлении света. «Взошла над тобой» сохраняет образ рассвета, а также совершенный вид еврейского перфекта.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя, а не титул. «Яхве» позволяет читателю видеть это различие; примечание поясняет традиционную замену.
- issue: Временная сила перфектов בָא и זָרָח
  choice: 'прошедшее время совершенного вида: «пришёл», «взошла»'
  alternative: 'будущее время: «придёт», «взойдёт»'
  rationale: Еврейские перфекты изображают обещанное событие как уже наступившую и несомненную реальность. Русские формы прошедшего времени сохраняют эту пророческую наглядность, не устраняя возможной направленности пророчества в будущее.
translation_notes:
  register: Современный литературный русский с кратким, возвышенным пророческим ритмом. Сохранены световая образность, обращение к олицетворённому Сиону в единственном числе и смысловая напряжённость пророческих перфектов.
