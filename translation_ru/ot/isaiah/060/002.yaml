  text: כִּֽי הִנֵּ֤ה הַ/חֹ֨שֶׁךְ֙ יְכַסֶּה אֶ֔רֶץ וַ/עֲרָפֶ֖ל לְאֻמִּ֑ים וְ/עָלַ֨יִ/ךְ֙ יִזְרַ֣ח יְהוָ֔ה וּ/כְבוֹד֖/וֹ עָלַ֥יִ/ךְ יֵרָאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/002.yaml
  text: For look, darkness will cover the earth, and thick darkness the peoples; but the LORD will rise upon you, and his glory will appear over you.
translation:
  language: ru
  text: Ибо вот, тьма покроет землю, и густой мрак — народы; а над тобой воссияет Господь, и слава Его явится над тобой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: вот
  rationale: Естественный для современного литературного русского указательный оборот, сохраняющий эмфатическую функцию еврейского слова.
- source_word: הַחֹשֶׁךְ
  choice: тьма
  rationale: Передаёт обычное значение существительного и поддерживает поэтический контраст со светом.
- source_word: עֲרָפֶל
  choice: густой мрак
  rationale: Передаёт более плотную, сгущённую тьму по сравнению с חֹשֶׁךְ и сохраняет параллелизм без искусственной буквальности.
- source_word: יִזְרַח
  choice: воссияет
  rationale: Глагол обозначает восход или сияние света; «воссияет» естественно сочетается с Господом как подлежащим и сохраняет образ восходящего света.
- source_word: יֵרָאֶה
  choice: явится
  rationale: Нифаль глагола ראה здесь означает «стать видимым, явиться»; перевод не уточняет способ проявления славы.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и широко понятная русская передача тетраграмматона; имя обозначено прописной буквой без добавления конфессионально специфического толкования.
theological_decisions:
- issue: Направленность образа явления Господа и Его славы
  choice: «над тобой воссияет Господь… слава Его явится над тобой»
  alternative: «на тебя взойдёт Господь… слава Его будет видна на тебе»
  rationale: Предлог עַל допускает пространственные оттенки «над/на». Выбранное «над тобой» согласуется с образом восходящего света и не утверждает, будто слава является внутренним свойством адресата.
- issue: Будущее или настоящее время пророческой картины
  choice: 'будущее время: «покроет», «воссияет», «явится»'
  alternative: 'настоящее время: «покрывает», «восходит», «является»'
  rationale: Формы yiqtol естественно выражают предстоящее действие в данном контексте и соответствуют русскому развертыванию пророческой перспективы.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Сохранены параллелизм, контраст тьмы и света и обращение к Сиону в единственном числе женского рода («тобой»). Тире восполняет опущенный во второй параллельной строке глагол.
