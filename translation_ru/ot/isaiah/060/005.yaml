base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/005.yaml
  text: Then you will see and be radiant[a], and your heart will tremble and swell, because the abundance of the sea will be turned to you[b]; the wealth of the nations will come to you.
translation:
  language: ru
  text: Тогда ты увидишь и засияешь[a], и сердце твоё затрепещет и расширится, потому что к тебе обратится изобилие моря[b]; богатство народов придёт к тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станешь сияющей». Еврейский глагол может передавать сияние или просветление в ответ на увиденное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «богатство моря». Возможно, речь идёт именно о богатствах, доставляемых морем к Сиону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְאִי
  choice: ты увидишь
  rationale: Форма 2-го лица женского рода единственного числа обращена к Сиону/Иерусалиму; простое будущее сохраняет пророческую перспективу.
- source_word: וְנָהַרְתְּ
  choice: и засияешь
  rationale: В данном контексте глагол описывает сияние или просветление в ответ на увиденное; «засияешь» естественно и сохраняет образ.
- source_word: וּפָחַד
  choice: затрепещет
  rationale: Сказуемое относится к следующему за ним «сердцу» и передаёт сильное волнение, не сводя его ни к одному страху, ни к одной радости.
- source_word: וְרָחַב לְבָבֵךְ
  choice: сердце твоё… раскроется
  rationale: Буквально сердце становится широким; «раскроется» сохраняет метафору внутреннего расширения и звучит естественно по-русски.
- source_word: יֵהָפֵךְ עָלַיִךְ
  choice: к тебе обратится
  rationale: Сохраняет направленное к Сиону движение/поворот и не уточняет без необходимости, идёт ли речь о переносе или доставке.
- source_word: הֲמוֹן יָם
  choice: изобилие моря
  rationale: הֲמוֹן допускает значения множества, изобилия и гомона; параллелизм с богатством народов поддерживает ресурсно-экономический смысл, но «изобилие» сохраняет широту выражения.
- source_word: חֵיל גּוֹיִם
  choice: богатство народов
  rationale: Хотя חֵיל может означать силу или войско, контекст притока благ к Сиону и параллелизм с морским изобилием указывают на богатство и ресурсы.
- source_word: יָבֹאוּ לָךְ
  choice: придёт к тебе
  rationale: Передаёт простое движение к Сиону; единственное число согласовано с собирательным существительным «богатство».
theological_decisions:
- issue: Характер переживания Сиона
  choice: Трепет, соединённый с внутренним раскрытием и сиянием
  alternative: Только страх или только радость
  rationale: Последовательность «увидишь», «засияешь», «затрепещет» и «раскроется» выражает сложную реакцию благоговейного потрясения и радости; перевод не устраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранено обращение к олицетворённому Сиону в женском роде, а также метафоричность еврейского текста без конфессиональных уточнений.
