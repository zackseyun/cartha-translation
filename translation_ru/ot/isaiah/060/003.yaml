id: ISA.60.3
reference: Isaiah 60:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָלְכ֥וּ גוֹיִ֖ם לְ/אוֹרֵ֑/ךְ וּ/מְלָכִ֖ים לְ/נֹ֥גַהּ זַרְחֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/003.yaml
  text: Nations will come to your light[c][b][a], and kings to the brightness of your rising.
translation:
  language: ru
  text: Народы придут к твоему свету[a][b], и цари — к сиянию твоего восхода[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пойдут к твоему свету».'
    reason: lexical_alternative
  - marker: b
    text: В некоторых контекстах «народы» можно передать как «язычники».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к сиянию твоей зари».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: придут
  rationale: Глагол הלך буквально означает «идти, ходить», но при движении народов к цели, обозначенной предлогом לְ, по-русски естественно «придут». Будущее время соответствует пророческому контексту.
- source_word: גוֹיִם
  choice: народы
  rationale: גוֹיִם обычно обозначает народы или нации. «Народы» здесь широко и естественно передаёт смысл, не сужая его до религиозного обозначения «язычники».
- source_word: לְאוֹרֵךְ
  choice: к твоему свету
  rationale: אוֹר означает «свет», суффикс 2-го лица женского рода указывает на обращение к олицетворённому Сиону/Иерусалиму, а לְ выражает направление движения.
- source_word: וּמְלָכִים
  choice: и цари
  rationale: מְלָכִים прямо означает «цари»; более широкое «правители» было бы менее точным.
- source_word: לְנֹגַהּ
  choice: к сиянию
  rationale: נֹגַהּ означает яркость, сияние, лучезарность. «Сияние» естественно сочетается с образом восхода.
- source_word: זַרְחֵךְ
  choice: твоего восхода
  rationale: Слово происходит от זרח — «восходить, воссиять», особенно о свете или заре. «Твоего восхода» сохраняет словесный образ и его намеренную широту.
theological_decisions:
- issue: К кому относятся суффиксы 2-го лица женского рода
  choice: К олицетворённому Сиону/Иерусалиму
  alternative: В более общем смысле — к народу Божьему
  rationale: Ближайший контекст Ис 60 обращается к Сиону в образе женщины. Русское «твоему/твоего» сохраняет прямое обращение и не вносит в текст более широкое экклезиологическое истолкование.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Эллипсис во второй части («и цари — к…») сохраняет поэтический параллелизм еврейского текста. Женский род обращения понятен из контекста главы и не уточняется вставкой в основной текст.
