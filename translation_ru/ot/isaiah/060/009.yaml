    issue: «Во имя Яхве»
    rationale: 'Русское «во имя» обычно имеет инструментально-представительное значение («действовать во имя кого-либо») либо значение призывания. Еврейское לְשֵׁם здесь, параллельно לִקְדוֹשׁ, выражает направленность/цель: ради имени Яхве.'
  - severity: low
    issue: Разрыв и тяжеловесность оборота о серебре и золоте
    rationale: В еврейском тексте «их серебро и их золото с ними» относится к привозимым сыновьям. Формулировка «вместе с их серебром и золотом» ясно передаёт этот смысл по-русски, без неестественного повтора и без разрыва фразы точкой с запятой.
