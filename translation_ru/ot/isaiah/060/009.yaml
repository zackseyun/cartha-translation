base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/009.yaml
  text: Surely the coastlands wait for me[a], and the ships of Tarshish first, to bring your sons from far away, with their silver and their gold with them, for the name of Yahweh your God, and for the Holy One of Israel[b], because he has glorified you.
translation:
  language: ru
  text: Воистину, приморские земли ожидают Меня[a], и впереди — корабли Фарсиса, чтобы привезти твоих сыновей издалека вместе с их серебром и золотом, ради имени Яхве, твоего Бога, и ради Святого Израилева, потому что Он прославил тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «острова», «далёкие берега». Еврейское слово может обозначать островные и вообще приморские земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «украсил тебя», «почтил тебя», «наделил тебя великолепием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Воистину
  rationale: Передаёт утвердительно-пояснительную силу частицы в данном контексте, не сводя её только к причинному «ибо».
- source_word: אִיִּים
  choice: приморские земли
  rationale: В пророческой речи Исаии слово может обозначать не только острова, но и отдалённые морские побережья и страны.
- source_word: יְקַוּוּ
  choice: ожидают
  rationale: Сохраняет значение напряжённого, исполненного надежды ожидания; направленность выражена формой «Меня».
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: корабли Фарсиса
  rationale: Сохраняет традиционное географическое наименование и намеренно не решает, обозначает ли выражение суда, связанные с Фарсисом, либо тип дальнего торгового корабля.
- source_word: בָּרִאשֹׁנָה
  choice: впереди
  rationale: Естественно передаёт первенство или ведущее положение кораблей; буквальное «первыми» также возможно.
- source_word: בָנַיִךְ
  choice: твоих сыновей
  rationale: Передаёт грамматически мужское множественное число; в ближайшем контексте дочери упомянуты отдельно.
- source_word: כַּסְפָּם וּזְהָבָם אִתָּם
  choice: их серебро и золото — с ними
  rationale: Сохраняет подчёркнутое еврейским текстом наличие у возвращающихся их собственного серебра и золота, избегая неестественного повтора по-русски.
- source_word: לְשֵׁם יְהוָה אֱלֹהַיִךְ
  choice: во имя Яхве, твоего Бога
  rationale: «Во имя» естественно выражает направленность события к имени, славе и чести Бога; личное имя יהוה передано как «Яхве».
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: и ради Святого Израилева
  rationale: Сохраняет характерный для Исаии божественный титул и параллельную целевую конструкцию.
- source_word: כִּי פֵאֲרָךְ
  choice: потому что Он прославил тебя
  rationale: Глагол в породе пиэль допускает значения «прославить», «украсить», «наделить великолепием»; «прославил» лучше соответствует публичному возвышению Сиона в контексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное заветное имя; транслитерация «Яхве» сохраняет его как имя и соответствует предоставленному консультационному слою.
- issue: Референт местоимений женского рода
  choice: обращение к Сиону передано формами «твоих», «тебя»
  alternative: эксплицировать «Сион» или «Иерусалим»
  rationale: Еврейский текст обращается к персонифицированному Сиону в женском роде, но не называет его в самом стихе; перевод не добавляет отсутствующее существительное.
- issue: Значение פֵאֵר
  choice: прославил
  alternative: украсил; почтил
  rationale: 'Сохранено богословское напряжение между красотой, честью и славой: основной текст выбирает контекстуально сильное «прославил», а иные значения отмечены в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные буквы в «Меня» и «Он» помогают обозначить Бога как говорящего и действующего, не добавляя имени там, где его нет. Тире перед «корабли Фарсиса» и в обороте «серебро и золото — с ними» обеспечивает ясность синтаксиса без изменения образности оригинала.
