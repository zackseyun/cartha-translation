  text: For the nation and the kingdom that will not serve you will perish[b][a], and those nations will be utterly laid waste.
translation:
  language: ru
  text: Ибо народ и царство, которые не будут служить тебе, погибнут, и народы будут полностью опустошены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте усилительная конструкция: абсолютный инфинитив соединён с личной формой того же глагола; буквально, с повтором корня: «будут опустошены, опустошены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующих обетований и предупреждений; «ибо» естественно сохраняет пояснительную связь.
- source_word: הַגּוֹי וְהַמַּמְלָכָה
  choice: народ и царство
  rationale: Сохранены два существительных в единственном числе и их обычные значения; в русском согласование сказуемого с однородными подлежащими требует множественного числа.
- source_word: אֲשֶׁר לֹא יַעַבְדוּךְ
  choice: которые не будут служить тебе
  rationale: Глагол עבד передан нейтральным «служить», без добавления не выраженного прямо оттенка сознательного отказа; форма будущего времени уместна в пророческом контексте.
- source_word: יֹאבֵדוּ
  choice: погибнут
  rationale: Передаёт широкий смысл утраты существования или прихода к гибели, не уточняя её способ.
- source_word: וְהַגּוֹיִם
  choice: а народы
  rationale: Переход от единичных «народа и царства» к обобщающему множественному числу сохранён; русский противительно-присоединительный союз «а» естественно отмечает развитие мысли, не вводя полноценного смыслового противопоставления.
- source_word: חָרֹב יֶחֱרָבוּ
  choice: будут совершенно разорены
  rationale: Сочетание абсолютного инфинитива с личной формой того же корня выражает усиление; «совершенно» передаёт эмфазу, а «разорены» — состояние полного запустения.
theological_decisions:
- issue: К кому относится местоименный суффикс женского рода единственного числа в словах «служить тебе»
  choice: Сохранено прямое обращение «тебе» без поясняющей подстановки
  alternative: «служить Сиону», «служить Иерусалиму» или «служить восстановленному Божьему народу»
  rationale: В ближайшем контексте речь обращена к Сиону/Иерусалиму как к женщине. Прямое местоименное обращение сохраняет образ и не устраняет возможную многослойность его референта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Ибо» поддерживает достоинство стиля, а остальная фраза остаётся ясной для обычного читателя. Переход от единственного числа («народ и царство») к множественному («народы») сохранён.
