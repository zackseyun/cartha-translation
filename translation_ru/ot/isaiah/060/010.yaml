  text: וּ/בָנ֤וּ בְנֵֽי נֵכָר֙ חֹמֹתַ֔יִ/ךְ וּ/מַלְכֵי/הֶ֖ם יְשָׁרְת֑וּ/נֶךְ כִּ֤י בְ/קִצְפִּ/י֙ הִכִּיתִ֔י/ךְ וּ/בִ/רְצוֹנִ֖/י רִֽחַמְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/010.yaml
  text: The sons of foreigners will rebuild your walls[a], and their kings will minister to you; for in my wrath I struck you[d][c][b], but in my favor I have had compassion on you.
translation:
  language: ru
  text: Чужеземцы отстроят твои стены[a], и их цари будут служить тебе. Ведь в гневе Моём Я поразил тебя, но по благоволению Моему проявил к тебе сострадание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья чужеземца»; это еврейское выражение может обозначать чужеземцев вообще. Глагол также можно перевести: «возведут».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «смиловался над тобой» или «проявил к тебе милость». «По благоволению Моему» можно также передать: «по Моей доброй воле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: отстроят
  rationale: Глагол буквально означает «строить», но стены города в контексте восстановления возводятся заново; «отстроят» естественно передаёт этот смысл, не превращая перевод в свободный пересказ.
- source_word: בְּנֵי נֵכָר
  choice: чужеземцы
  rationale: Буквально «сыновья чужой земли / чужеземца»; это устойчивое обозначение иноземцев. Русское «чужеземцы» передаёт значение естественно, а буквальная форма отмечена в сноске.
- source_word: חֹמֹתַיִךְ
  choice: твои стены
  rationale: Форма множественного числа с суффиксом второго лица женского рода; адресат — олицетворённый город, не названный в самом стихе.
- source_word: וּמַלְכֵיהֶם
  choice: и их цари
  rationale: Прямо сохраняет конструкцию и отсылку местоимения к чужеземцам.
- source_word: יְשָׁרְתוּנֶךְ
  choice: будут служить тебе
  rationale: Глагол שׁרת обозначает служение, в том числе служение при ком-либо; нейтральное «служить» сохраняет широту значения и звучит естественно по-русски.
- source_word: בְקִצְפִּי
  choice: в гневе Моём
  rationale: קצף обозначает сильный гнев; формула сохраняет торжественный пророческий регистр.
- source_word: הִכִּיתִיךְ
  choice: Я поразил тебя
  rationale: נכה означает «ударить, поразить». «Поразил» уместно для Божьего суда и не содержит архаизма «сразил».
- source_word: וּבִרְצוֹנִי
  choice: но по благоволению Моему
  rationale: רצון здесь выражает благосклонность, добрую волю или расположение. «Благоволение» сохраняет контраст с гневом и не сводит слово к простому желанию.
- source_word: רִחַמְתִּיךְ
  choice: смилостивился над тобой
  rationale: רחם соединяет сострадание и милость; русский глагол передаёт оба оттенка и сохраняет завершённый вид еврейской формы.
theological_decisions:
- issue: Называть ли прямо Сион или Иерусалим
  choice: Сохранить обращение во втором лице женского рода без добавления названия города.
  alternative: «Чужеземцы отстроят твои стены, Иерусалим…»
  rationale: В стихе город олицетворён как женщина, однако его имя здесь отсутствует; добавление имени устранило бы контекстуальную недосказанность оригинала.
- issue: Как передать противопоставление суда и милости
  choice: «в гневе Моём Я поразил тебя, но по благоволению Моему смилостивился над тобой»
  alternative: «в ярости Я ударил тебя, но по Своей доброй воле проявил к тебе сострадание»
  rationale: Выбранная формулировка ясно удерживает обе стороны текста — Божий суд и последующее сострадание, — не ослабляя и не объясняя богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Формы «Моём» и «Я» написаны с прописной буквы как традиционное уважительное обозначение Бога; синтаксис остаётся ясным для широкого читателя.
