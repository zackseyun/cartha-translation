source:
  edition: WLC
  text: לֹא יִשָּׁמַ֨ע ע֤וֹד חָמָס֙ בְּ/אַרְצֵ֔/ךְ שֹׁ֥ד וָ/שֶׁ֖בֶר בִּ/גְבוּלָ֑יִ/ךְ וְ/קָרָ֤את יְשׁוּעָה֙ חוֹמֹתַ֔יִ/ךְ וּ/שְׁעָרַ֖יִ/ךְ תְּהִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/018.yaml
  text: Violence will no longer be heard in your land[a], devastation or destruction within your borders; and you will call your walls Salvation, and your gates Praise.
translation:
  language: ru
  text: Не будет больше слышно о насилии в твоей земле, о разорении и разрушении в твоих пределах.[a] Ты назовёшь свои стены «Спасение», а свои ворота — «Хвала».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грабёж и разорение» вместо «разорения и разрушения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁמַע
  choice: будет слышно о
  rationale: Нифаль imperfect от שׁמע передаёт отсутствие как самого явления, так и вести о нём; русское «не будет слышно о насилии» естественно и сохраняет образ слуха.
- source_word: חָמָס
  choice: насилие
  rationale: Слово обозначает насилие, жестокость и насильственное беззаконие; «насилие» точно соответствует контексту общественного бедствия.
- source_word: בְּאַרְצֵךְ
  choice: в твоей земле
  rationale: Прямо сохраняет географический и пророческий смысл אֶרֶץ.
- source_word: שֹׁד
  choice: разорение
  rationale: Передаёт как опустошительный грабёж, так и его результат; хорошо сочетается с последующим «разрушением».
- source_word: שֶׁבֶר
  choice: разрушение
  rationale: В данном пророческом параллелизме слово означает слом, крушение или гибель; «разрушение» ясно передаёт общий смысл.
- source_word: בִּגְבוּלָיִךְ
  choice: в твоих пределах
  rationale: Сохраняет пространственное значение границ и территории, звуча естественно в возвышенной современной речи.
- source_word: וְקָרָאת
  choice: ты назовёшь
  rationale: Глагол вводит наречение стен и ворот именами; союзная связь передана бессоюзным продолжением после точки с запятой без добавления неявного противопоставления.
- source_word: יְשׁוּעָה
  choice: Спасение
  rationale: Существительное выступает как имя стен; «Спасение» сохраняет мотив Божьего избавления и функцию именования.
- source_word: חוֹמֹתַיִךְ
  choice: свои стены
  rationale: Прямо передаёт образ городских укреплений; возвратное «свои» естественно при подлежащем «ты».
- source_word: שְׁעָרַיִךְ
  choice: свои ворота
  rationale: Прямое соответствие городским воротам как входам и месту общественной жизни.
- source_word: תְּהִלָּה
  choice: Хвала
  rationale: Основное значение — хвала или прославление; здесь слово служит именем ворот и параллельно «Спасению».
theological_decisions:
- issue: Следует ли передавать יְשׁוּעָה и תְּהִלָּה как обычные нарицательные существительные или как имена стен и ворот
  choice: 'Передать как имена-названия: «Спасение» и «Хвала»'
  alternative: 'Передать со строчной буквы: «спасением» и «хвалой»'
  rationale: Конструкция «назовёшь ...» указывает на наречение; кавычки и прописные буквы обозначают функцию названия, не добавляя персонификации.
- issue: Имеет ли וְקָרָאת явно противительное значение
  choice: Не добавлять «но» или «а» как противительный союз
  alternative: «но ты назовёшь» / «а ты назовёшь»
  rationale: Еврейский союз допускает простое продолжение. Контраст ощущается из контекста, но грамматически не требуется усиливать его в переводе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Параллелизм исходного текста сохранён; имена стен и ворот выделены кавычками и прописной буквой.
