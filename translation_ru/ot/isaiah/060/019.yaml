source:
  edition: WLC
  text: לֹא יִֽהְיֶה לָּ֨/ךְ ע֤וֹד הַ/שֶּׁ֨מֶשׁ֙ לְ/א֣וֹר יוֹמָ֔ם וּ/לְ/נֹ֕גַהּ הַ/יָּרֵ֖חַ לֹא יָאִ֣יר לָ֑/ךְ וְ/הָיָה לָ֤/ךְ יְהוָה֙ לְ/א֣וֹר עוֹלָ֔ם וֵ/אלֹהַ֖יִ/ךְ לְ/תִפְאַרְתֵּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/019.yaml
  text: The sun will no longer be for you the light by day[a], nor will the moon shine for you for brightness; but Yahweh will be for you an everlasting light[c][b], and your God your glory.
translation:
  language: ru
  text: Солнце уже не будет для тебя светом днём, и луна уже не будет освещать тебя своим сиянием; Яхве[a] будет для тебя вечным светом, и твой Бог — твоей славой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH; традиционно переводится «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «великолепием»; возможно также: «красотой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לָּךְ עוֹד
  choice: уже не будет для тебя
  rationale: Передаёт прекращение прежнего положения, выраженное отрицанием, формой היה, дательным לָךְ и наречием עוֹד, естественным современным русским языком.
- source_word: הַשֶּׁמֶשׁ לְאוֹר יוֹמָם
  choice: солнце ... светом днём
  rationale: Сохраняет образ солнца в функции дневного света; לְ передаётся творительным сказуемого, что естественно по-русски.
- source_word: וּלְנֹגַהּ הַיָּרֵחַ לֹא יָאִיר לָךְ
  choice: и луна не будет сиять тебе своим блеском
  rationale: נֹגַהּ означает блеск или сияние, а каузативная форма אור — давать свет, освещать. Формулировка сохраняет параллелизм и звучит естественно; «своим» лишь проясняет очевидную связь блеска с луной.
- source_word: וְהָיָה לָךְ
  choice: будет для тебя
  rationale: Повторяет конструкцию первой строки и подчёркивает, что Яхве занимает место сотворённых светил; контраст передан пунктуацией без добавления противительного союза.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени Бога сохраняет отличие тетраграмматона от титула «Господь».
- source_word: לְאוֹר עוֹלָם
  choice: вечным светом
  rationale: עוֹלָם указывает на неограниченную длительность; творительный падеж естественно передаёт предикативную конструкцию.
- source_word: וֵאלֹהַיִךְ לְתִפְאַרְתֵּךְ
  choice: и твой Бог — твоей славой
  rationale: Сохраняет прямое обращение к Сиону в женском роде и предикативный параллелизм. תִפְאֶרֶת допускает значения славы, великолепия и красоты.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя YHWH, а не титул; транслитерация сохраняет это различие. Традиционный вариант указан в примечании.
- issue: Характер образа солнца и луны
  choice: Сохранить пророческий образ без уточнения способа его исполнения
  alternative: Истолковать его исключительно как буквальное космическое изменение или исключительно как метафору духовного просвещения
  rationale: Сам стих не разрешает эту напряжённость, поэтому перевод не навязывает определённого толкования.
- issue: Значение תִפְאֶרֶת
  choice: слава
  alternative: великолепие; красота
  rationale: «Слава» естественно сочетается с возвышенным контекстом и сохраняет возможность понимать Бога как славу и честь Сиона, не исключая оттенков великолепия и красоты.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Синтаксический параллелизм сохранён; женские формы местоимений в еврейском обращены к Сиону/Иерусалиму, но в русском тексте род адресата здесь явно не выражен.
