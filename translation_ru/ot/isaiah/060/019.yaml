  naturalness: Текст выдержан в современном литературном и возвышенном регистре. Повтор «уже не будет» во второй части отрицательного параллелизма делает временной оттенок עוֹד ясным для обеих небесных светил. «Освещать тебя своим сиянием» более естественно, чем «сиять тебе своим блеском».
  terminology: «Яхве» последовательно передаёт יהוה и корректно снабжено примечанием о традиционном «Господь». «Вечный свет» и «слава» уместны для לְאוֹר עוֹלָם и לְתִפְאַרְתֵּךְ; примечание к «славе» надлежащим образом отмечает допустимые лексические оттенки.
