  text: כְּב֤וֹד הַ/לְּבָנוֹן֙ אֵלַ֣יִ/ךְ יָב֔וֹא בְּר֛וֹשׁ תִּדְהָ֥ר וּ/תְאַשּׁ֖וּר יַחְדָּ֑ו לְ/פָאֵר֙ מְק֣וֹם מִקְדָּשִׁ֔/י וּ/מְק֥וֹם רַגְלַ֖/י אֲכַבֵּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/013.yaml
  text: The glory of Lebanon will come to you—cypress[a], plane tree, and pine together—to beautify the place of my sanctuary[b], and I will honor the place of my feet.
translation:
  language: ru
  text: Слава Ливана придёт к тебе — кипарис, платан и сосна, все вместе, — чтобы украсить место Моего святилища; и место Моих ног[b] Я прославлю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «Моё подножие». Буквально по-еврейски: «место Моих ног».'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד
  choice: слава
  rationale: Передаёт великолепие и почёт; в данном контексте также подразумевает знаменитое лесное богатство Ливана, которое будет принесено Сиону.
- source_word: הַלְּבָנוֹן
  choice: Ливан
  rationale: Общепринятая русская форма географического названия.
- source_word: אֵלַיִךְ
  choice: к тебе
  rationale: Сохраняет прямое обращение в женском роде к Сиону/Иерусалиму, не называя адресата прямо, поскольку он не назван в самом стихе.
- source_word: יָבוֹא
  choice: придёт
  rationale: Прямо передаёт форму qal глагола בוא; возможный контекстуальный оттенок «будет принесена» не вносится в основной текст.
- source_word: בְּרוֹשׁ
  choice: кипарис
  rationale: Точный вид дерева не установлен; «кипарис» — традиционно и контекстуально уместное обозначение ценного строевого дерева.
- source_word: תִּדְהָר
  choice: платан
  rationale: Ботаническая идентификация неясна; «платан» — распространённый современный эквивалент, при этом неопределённость отмечена в сноске.
- source_word: תְאַשּׁוּר
  choice: сосна
  rationale: Точный вид спорен; «сосна» естественно передаёт образ ценного дерева, а альтернативы приведены в сноске.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Сохраняет значение совместности перечисленных деревьев.
- source_word: לְפָאֵר
  choice: чтобы украсить
  rationale: Piel от פאר здесь означает придать красоту и великолепие; «украсить» естественно звучит применительно к святилищу.
- source_word: מְקוֹם מִקְדָּשִׁי
  choice: место Моего святилища
  rationale: Сохраняет конструкцию исходного текста и сакральный смысл, не сводя выражение просто к «святому месту».
- source_word: וּמְקוֹם רַגְלַי
  choice: место Моих ног
  rationale: Буквально сохраняет антропоморфный образ еврейского текста; «подножие» возможно по смыслу, но соответствующее существительное здесь не употреблено.
- source_word: אֲכַבֵּד
  choice: Я прославлю
  rationale: Piel от כבד означает наделить славой или величием. «Прославлю» хорошо передаёт активное возвеличивание Богом этого места и поддерживает лексическую связь с начальным словом «слава».
theological_decisions:
- issue: Антропоморфное описание Божьего отношения к святилищу
  choice: сохранить в основном тексте выражение «место Моих ног»
  alternative: «Моё подножие»
  rationale: Исходный текст буквально говорит о «месте Моих ног». Это сохраняет поэтический образ Божьего присутствия и не заменяет его более истолковывающим термином, которого в стихе нет.
- issue: К кому относится местоимение «тебе»
  choice: не называть адресата в основном тексте
  alternative: «к тебе, Сион» или «к тебе, Иерусалим»
  rationale: Контекст указывает на Сион/Иерусалим, а форма обращения — женского рода, но в самом стихе адресат прямо не назван; добавление имени неоправданно устранило бы дискурсивную неявность.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим строем. Синтаксис остаётся прозрачным, а тире выделяют пояснительное перечисление «славы Ливана». Божественные местоимения оформлены с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
