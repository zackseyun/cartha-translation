source:
  edition: WLC
  text: כָּל צֹ֤אן קֵדָר֙ יִקָּ֣בְצוּ לָ֔/ךְ אֵילֵ֥י נְבָי֖וֹת יְשָׁרְת֑וּ/נֶךְ יַעֲל֤וּ עַל רָצוֹן֙ מִזְבְּחִ֔/י וּ/בֵ֥ית תִּפְאַרְתִּ֖/י אֲפָאֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/007.yaml
  text: All the flocks of Kedar will be gathered to you[a]; the rams of Nebaioth will minister to you. They will go up with acceptance on my altar[b], and I will beautify my glorious house.
translation:
  language: ru
  text: Все стада Кедара соберутся к тебе, бараны Невайота будут служить тебе; они взойдут на Мой жертвенник как угодная жертва[a], и Я украшу дом Моего великолепия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение соединяет образ восхождения на жертвенник с мыслью о благосклонном принятии жертвы; возможно также: «взойдут на Мой жертвенник с благоволением».'
    reason: lexical_alternative
  - marker: b
    text: '«Дом Моего великолепия» — храм; буквально: «дом Моей красоты (славы, великолепия)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאן
  choice: стада
  rationale: Собирательное обозначение мелкого скота, прежде всего овец и коз; «стада» сохраняет широкий и коллективный смысл.
- source_word: קֵדָר
  choice: Кедар
  rationale: Название аравийского народа и области передано транслитерацией, близкой к еврейскому произношению.
- source_word: יִקָּבְצוּ לָךְ
  choice: соберутся к тебе
  rationale: Форма нифаля допускает пассивно-возвратный оттенок; естественное русское «соберутся к тебе» сохраняет направленность действия, не уточняя действующего лица.
- source_word: אֵילֵי נְבָיוֹת
  choice: бараны Невайота
  rationale: В контексте стад, жертвенника и благоволения אֵילֵי обозначает именно баранов; имя נְבָיוֹת передано транслитерацией.
- source_word: יְשָׁרְתוּנֶךְ
  choice: будут служить тебе
  rationale: שרת обозначает служение и может иметь культовый оттенок; русский вариант сохраняет как прямое служение олицетворённому Сиону, так и жертвенный контекст.
- source_word: יַעֲלוּ עַל רָצוֹן מִזְבְּחִי
  choice: взойдут на Мой жертвенник и будут приняты с благоволением
  rationale: «Взойдут» сохраняет образ движения вверх в עלה, а «будут приняты с благоволением» передаёт רָצוֹן как благосклонное принятие жертвы. Союз «и» естественно раскрывает тесную связь двух смыслов без сведения выражения только к техническому «будут принесены в жертву».
- source_word: בֵית תִּפְאַרְתִּי
  choice: дом Моего великолепия
  rationale: Конструкция буквально связывает дом с Божьим великолепием, красотой или славой. Такой перевод сохраняет образ и не заменяет его прямо словом «храм».
- source_word: אֲפָאֵר
  choice: Я украшу
  rationale: Пиэль глагола פאר может означать «украшать», «придавать великолепие», «прославлять». «Украшу» естественно сочетается с восстановлением святилища и сохраняет конкретную образность.
theological_decisions:
- issue: К кому относятся формы второго лица женского рода
  choice: Сохранено прямое обращение «к тебе» к олицетворённому Сиону/Иерусалиму
  alternative: Истолковать адресата шире как народ Божий
  rationale: Ближайший контекст обращён к Сиону/Иерусалиму как к женщине. Перевод не подменяет этот образ более поздней богословской идентификацией.
- issue: Жертвенный смысл восхождения животных на жертвенник
  choice: Сохранены и буквальный образ восхождения, и смысл благосклонного принятия жертв
  alternative: Передать только общее принесение дани или прямо сказать «будут принесены в жертву»
  rationale: Стада, бараны, жертвенник и רָצוֹן явно создают жертвенный контекст, однако глагол буквально означает «взойти». Формулировка сохраняет оба уровня.
- issue: Значение «дома Моего великолепия»
  choice: В основном тексте сохранён образ дома, а его храмовый референт указан в примечании
  alternative: Перевести непосредственно «Мой славный храм»
  rationale: Так перевод остаётся близким к образной конструкции оригинала и не превращает подразумеваемое значение в буквальную формулировку текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранены олицетворённое обращение к Сиону, жертвенная образность и смысловая связь однокоренных תפארת и פאר, насколько это допускает естественная русская речь.
