lexical_decisions:
- source_word: מִי אֵלֶּה
  choice: Кто это
  rationale: Вопросительное местоимение с указательным местоимением образует живой вопрос с подразумеваемой связкой; «Кто это» естественно передаёт эту конструкцию по-русски.
- source_word: כָּעָב
  choice: словно облако
  rationale: Сравнительная частица כ и существительное в единственном числе; единственное число сохранено и может представлять летящих как единую массу.
- source_word: תְּעוּפֶינָה
  choice: летит
  rationale: Форма Qal imperfect 3-го лица женского рода множественного числа от עוף означает «лететь». В русском при вопросительном «кто» нормативно единственное число сказуемого; настоящее время сохраняет живость видения.
- source_word: וְכַיּוֹנִים
  choice: словно голуби
  rationale: Союз и сравнительная конструкция переданы вторым параллельным сравнением; «голуби» сохраняет множественное число оригинала.
- source_word: אֶל
  choice: к
  rationale: Предлог передаёт направленность движения к месту возвращения.
- source_word: אֲרֻבֹּתֵיהֶם
  choice: своим окнам
  rationale: אֲרֻבָּה обозначает окно или проём. Возвратное «своим» естественно передаёт принадлежность подлежащему; контекстуальное понимание как отверстий голубятни сохранено в сноске.
