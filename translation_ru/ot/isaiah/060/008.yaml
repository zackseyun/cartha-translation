  text: Кто это летит, словно облако, и словно голуби — к своим окнам?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к отверстиям своих голубятен» — то есть к проёмам, через которые голуби влетают в голубятню.'
