  text: And all your people will be righteous[a]; forever they will possess the land, the shoot of my planting, the work of my hands[c][b], that I may be glorified.
translation:
  language: ru
  text: И все люди твоего народа будут праведны; вовеки они будут владеть землёй[a][b] — побег его насаждения[c], дело Моих рук, чтобы Я прославился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут наследовать землю». Еврейский глагол может означать как «наследовать», так и «владеть».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское אֶרֶץ может означать «землю, страну», а в более широком понимании — «всю землю, мир»; здесь «земля» лучше соответствует контексту восстановления.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально по предоставленному еврейскому тексту: «побег его насаждения». В некоторых прочтениях и переводах местоимение согласуют со следующими словами и передают: «побег Моего насаждения»; основной текст сохраняет смену лица.'
    reason: textual_variant
lexical_decisions:
- source_word: וְעַמֵּךְ כֻּלָּם
  choice: И весь твой народ
  rationale: Сочетание с местоименным суффиксом 2-го лица женского рода обращено к Сиону/Иерусалиму; כֻּלָּם передано собирательно и естественно для русского языка словом «весь».
- source_word: צַדִּיקִים
  choice: будет праведен
  rationale: При собирательном «народ» употреблено единственное число; «праведен» сохраняет нравственно-заветный смысл исходного прилагательного.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Передаёт непреходящую длительность обещания и сохраняет возвышенный, но понятный библейский регистр.
- source_word: יִירְשׁוּ
  choice: будут владеть
  rationale: Глагол ירשׁ допускает значения «наследовать» и «владеть»; в контексте восстановления земли основным выбрано устойчивое обладание, а вариант отмечен в сноске.
- source_word: אָרֶץ
  choice: землёй
  rationale: В ближайшем контексте речь прежде всего о земле восстановленного народа; вместе с тем еврейское слово может обозначать всю землю/мир, что отражено в сноске.
- source_word: נֵצֶר
  choice: побег
  rationale: Конкретный образ молодой поросли передаёт значение слова точнее, чем более широкое «ветвь».
- source_word: מטעו
  choice: его насаждения
  rationale: Предоставленный масоретский текст и морфологическая разметка содержат суффикс 3-го лица мужского рода. Перевод сохраняет эту смену лица, не исправляя её молча на первое лицо.
- source_word: מַעֲשֵׂה יָדַי
  choice: дело Моих рук
  rationale: Сохранён предметный и торжественный библейский образ Божьего творения.
- source_word: לְהִתְפָּאֵר
  choice: чтобы Я прославился
  rationale: Целевая конструкция и возвратная форма передают мысль о явлении славы говорящего Бога без добавления внешнего деятеля.
theological_decisions:
- issue: Смена лица в выражении «побег его насаждения, дело Моих рук»
  choice: 'Сохранить чтение предоставленного масоретского текста: «его насаждения» с последующим «Моих рук».'
  alternative: 'Согласовать лица: «побег Моего насаждения».'
  rationale: Исходные данные дают суффикс 3-го лица в מטעו и 1-го лица в יָדַי. Неясность и напряжение текста сохранены, а возможное согласованное чтение отмечено в сноске.
- issue: Объём обещания, выраженного словом אָרֶץ
  choice: Основное чтение — «земля» как земля народа в контексте восстановления.
  alternative: «вся земля» или «мир».
  rationale: Контекст книги поддерживает конкретную землю, однако лексическая широта слова не исключает более всеобщего понимания; перевод не превращает эту возможность в единственно верное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «вовеки» и «дело Моих рук» сохраняют достоинство и образность, оставаясь понятными; синтаксис не перегружен архаизмами.
