  verdict: revise
  source_fidelity: 'Основной смысл передан точно: все люди, принадлежащие Сиону, праведны, навсегда овладеют/унаследуют землёй; они уподоблены побегу насаждения и делу Божьих рук, ради явления Божьей славы. Однако в первой части русское собирательное единственное число («народ будет праведен») сменяется множественным («они будут»), что создаёт грамматическую шероховатость и несколько ослабляет явную множественность еврейского צַדִּיקִים. Кроме того, сноска b неверно формулирует альтернативу как «всей землёй»: возможное значение אֶרֶץ — «земля/страна» или «вся земля, мир», но не добавление определения «всей» к тому же синтаксическому дополнению без изменения смысла.'
  naturalness: «И все люди твоего народа будут праведны» естественно для современного литературного русского и последовательно допускает дальнейшее «они будут». «Побег его насаждения» намеренно сохраняет необычность, обусловленную сменой лица в предоставленном еврейском тексте; тире уместно вводит приложение. «Дело Моих рук» и «вовеки» соответствуют умеренно возвышенному библейскому регистру.
  terminology: «Праведны», «наследовать/владеть землёй», «побег», «насаждение» и «дело Моих рук» удачны. Лицо в «его насаждения» необходимо сохранить по WLC, а возможную гармонизацию отметить только в сноске. Написание «Моих», «Я» с прописной буквы допустимо редакционной конвенцией для божественной речи и не меняет смысла.
