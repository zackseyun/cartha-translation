id: ISA.60.14
reference: Isaiah 60:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָלְכ֨וּ אֵלַ֤יִ/ךְ שְׁח֨וֹחַ֙ בְּנֵ֣י מְעַנַּ֔יִ/ךְ וְ/הִֽשְׁתַּחֲו֛וּ עַל כַּפּ֥וֹת רַגְלַ֖יִ/ךְ כָּל מְנַֽאֲצָ֑יִ/ךְ וְ/קָ֤רְאוּ לָ/ךְ֙ עִ֣יר יְהוָ֔ה צִיּ֖וֹן קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/014.yaml
  text: The sons of those who afflicted you will come to you bowed down[a], and all who despised you will bow down at the soles of your feet; and they will call you The City of Yahweh[c][b], Zion of the Holy One of Israel.
translation:
  language: ru
  text: Сыновья тех, кто угнетал тебя, придут к тебе, склонившись[a], и все, кто презирал тебя, падут ниц у стоп твоих[b]. Они назовут тебя Городом Яхве, Сионом Святого Израилева[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья угнетавших тебя придут к тебе, согнувшись».'
    reason: lexical_alternative
  - marker: b
    text: Падение ниц здесь выражает подчинение и почтение Сиону, а не поклонение ему как божеству.
    reason: cultural_note
  - marker: c
    text: То есть Сион, принадлежащий Святому Израилеву.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁחֹחַ
  choice: склонившись
  rationale: Передаёт физически пониженную позу и подразумеваемое смирение; в современном русском звучит естественнее, чем «согбенными».
- source_word: בְּנֵי מְעַנַּיִךְ
  choice: Сыновья тех, кто угнетал тебя
  rationale: Сохраняет буквально выраженное мужское בְּנֵי («сыновья») и передаёт причастную форму от ענה как обозначение угнетателей.
- source_word: וְהִשְׁתַּחֲווּ
  choice: падут ниц
  rationale: Выражает глубокий телесный поклон и подчинение, не приписывая городу божественного поклонения.
- source_word: עַל כַּפּוֹת רַגְלַיִךְ
  choice: у стоп твоих
  rationale: Естественная русская формула, сохраняющая яркий образ крайнего унижения, хотя буквальное значение כַּפּוֹת — «подошвы».
- source_word: מְנַאֲצָיִךְ
  choice: кто презирал тебя
  rationale: Точно и ясно передаёт значение נאץ — относиться с презрением, отвергать с пренебрежением.
- source_word: עִיר יְהוָה
  choice: Городом Яхве
  rationale: Передаёт титульное наименование и непосредственно воспроизводит личное имя יהוה как «Яхве».
- source_word: צִיּוֹן קְדוֹשׁ יִשְׂרָאֵל
  choice: Сионом Святого Израилева
  rationale: 'Сохраняет сжатую генитивную конструкцию: Сион принадлежит Святому Израилеву; не создаётся впечатления, будто сам Сион назван Святым Израилевым.'
- source_word: וְקָרְאוּ לָךְ
  choice: Они назовут тебя
  rationale: Естественно передаёт присвоение городу указанных почётных наименований.
theological_decisions:
- issue: Характер поклонения Сиону
  choice: «падут ниц» как знак покорности и почтения восстановленному Сиону
  alternative: Передать глагол как «поклонятся», что может быть понято как религиозное поклонение
  rationale: השתחוה допускает культовый смысл в иных контекстах, но здесь действие направлено к городу/народу Божьему и выражает подчинение, а не богопочитание.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя и соответствует предоставленному богословскому решению.
- issue: Связь слов «Сион» и «Святой Израилев»
  choice: Сион представлен как принадлежащий Святому Израилеву
  alternative: Понять «Святой Израилев» как приложение к самому Сиону
  rationale: Генитивное прочтение отвечает синтаксису и не смешивает город с божественным титулом.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Обращение к олицетворённому Сиону сохранено в единственном числе женского рода. «Стопы» придают строке возвышенный, но понятный библейский регистр; архаическое «согбенные» вынесено из основного текста.
