  text: שִֽׁפְעַ֨ת גְּמַלִּ֜ים תְּכַסֵּ֗/ךְ בִּכְרֵ֤י מִדְיָן֙ וְ/עֵיפָ֔ה כֻּלָּ֖/ם מִ/שְּׁבָ֣א יָבֹ֑אוּ זָהָ֤ב וּ/לְבוֹנָה֙ יִשָּׂ֔אוּ וּ/תְהִלֹּ֥ת יְהוָ֖ה יְבַשֵּֽׂרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/006.yaml
  text: A multitude of camels will cover you[a], the young camels of Midian and Ephah; all of them will come from Sheba. They will carry gold and frankincense[b], and they will proclaim the praises of Yahweh.
translation:
  language: ru
  text: Множество верблюдов — молодых верблюдов Мадиама и Ефы — покроет тебя[a]; все они придут из Савы. Они понесут золото и ладан и будут возвещать хвалы Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает молодых верблюдов; традиционно его также передают словом «дромадеры».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возвестят благую весть о хвалах Яхве». Глагол может обозначать провозглашение благой вести.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְעַת
  choice: Множество
  rationale: Существительное обозначает изобилие, многочисленность. «Множество» естественно по-русски передаёт обилие верблюдов, не превращая образ прямо в «поток».
- source_word: גְּמַלִּים
  choice: верблюдов
  rationale: Прямое соответствие форме множественного числа.
- source_word: תְּכַסֵּךְ
  choice: покроет тебя
  rationale: Форма глагола כסה в породе пиэль означает «покрывать». Местоименный суффикс женского рода единственного числа относится к Сиону/Иерусалиму; буквальный образ сохранён.
- source_word: בִּכְרֵי
  choice: молодые верблюды
  rationale: Слово обозначает молодых верблюдов. Этот вариант ясен современному читателю и точнее, чем зоологически более узкое «дромадеры».
- source_word: מִדְיָן וְעֵיפָה
  choice: Мадиама и Ефы
  rationale: Употреблены традиционные русские формы библейских имён; родительный падеж передаёт конструкцию принадлежности.
- source_word: כֻּלָּם
  choice: все они
  rationale: Сохраняет выраженный в еврейском тексте местоименный суффикс и его акцент.
- source_word: מִשְּׁבָא
  choice: из Савы
  rationale: Традиционная русская форма топонима с предлогом, указывающим на происхождение.
- source_word: יָבֹאוּ
  choice: придут
  rationale: Естественное русское выражение будущего действия в контексте пророческого видения.
- source_word: זָהָב וּלְבוֹנָה
  choice: золото и ладан
  rationale: לְבוֹנָה обозначает именно ладан, а не благовония вообще; точное наименование сохраняет предметную и межтекстовую конкретность.
- source_word: יִשָּׂאוּ
  choice: понесут
  rationale: Глагол означает «нести, переносить». «Понесут» сохраняет образ перевозимого дара и не добавляет прямо не выраженную цель принесения.
- source_word: וּתְהִלֹּת יְהוָה
  choice: хвалы Яхве
  rationale: Множественное число передано словом «хвалы». Родительная конструкция сохраняет возможность понимать выражение и как хвалу, обращённую к Яхве, и как возвещение того, за что Его хвалят.
- source_word: יְבַשֵּׂרוּ
  choice: будут возвещать
  rationale: Глагол означает провозглашать или приносить благую весть. «Возвещать» подходит к объекту «хвалы» и не устраняет положительный оттенок публичного провозглашения; дополнительный смысл отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому перевод сохраняет личное имя в принятой современной русской транслитерации.
- issue: Значение וּתְהִלֹּת יְהוָה יְבַשֵּׂרוּ
  choice: будут возвещать хвалы Яхве
  alternative: возвестят благую весть о славных деяниях Яхве; будут воздавать хвалу Яхве
  rationale: Компактная родительная конструкция исходного текста допускает хвалу, обращённую к Яхве, и провозглашение достойных хвалы деяний Яхве. Основной текст сохраняет эту напряжённость, не сводя выражение только к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Сохранены образ «покроет тебя», традиционные русские формы географических имён и неоднозначность выражения «хвалы Яхве».
