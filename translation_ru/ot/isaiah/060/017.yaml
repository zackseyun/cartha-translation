source:
  edition: WLC
  text: תַּ֣חַת הַ/נְּחֹ֜שֶׁת אָבִ֣יא זָהָ֗ב וְ/תַ֤חַת הַ/בַּרְזֶל֙ אָ֣בִיא כֶ֔סֶף וְ/תַ֤חַת הָֽ/עֵצִים֙ נְחֹ֔שֶׁת וְ/תַ֥חַת הָ/אֲבָנִ֖ים בַּרְזֶ֑ל וְ/שַׂמְתִּ֤י פְקֻדָּתֵ/ךְ֙ שָׁל֔וֹם וְ/נֹגְשַׂ֖יִ/ךְ צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/017.yaml
  text: Instead of bronze I will bring gold[a], and instead of iron I will bring silver; instead of wood, bronze, and instead of stones, iron. And I will make peace your overseers[c][b], and righteousness your taskmasters.
translation:
  language: ru
  text: Вместо бронзы Я принесу золото, вместо железа — серебро, вместо дерева — бронзу, а вместо камней — железо. Я поставлю мир твоими управителями[a], а праведность[b] — твоими надсмотрщиками[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоим управлением» / «твоей властью». Еврейское слово может обозначать надзор, управление, должность или должностных лиц.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливость». Еврейское слово может обозначать и нравственную праведность, и справедливость общественного порядка.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «твоими понуждающими» / «теми, кто взыскивает с тебя». Так называли людей, принуждавших к труду или взимавших дань.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: вместо
  rationale: В перечне заменяемых строительных материалов предлог обозначает замещение, а не пространственное положение.
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: Слово может обозначать медь или бронзу; в данном перечне материалов «бронза» точно и естественно передаёт вероятный смысл, не прибегая к анахроничному «латунь».
- source_word: אָבִיא
  choice: Я принесу
  rationale: Форма породы хифиль от בוא выражает действие Бога, доставляющего более ценные материалы.
- source_word: עֵצִים
  choice: дерево
  rationale: Собирательное русское существительное естественно обозначает древесный строительный материал.
- source_word: פְקֻדָּתֵךְ
  choice: твоими управителями
  rationale: Существительное может обозначать надзор, управление, должность или совокупность должностных лиц. Личное обозначение сохраняет параллелизм со следующим словом о надсмотрщиках; неоднозначность отмечена в сноске.
- source_word: שָׁלוֹם
  choice: мир
  rationale: Слово включает благополучие и целостность, однако «мир» остаётся центральным и узнаваемым значением в видении восстановленного общественного порядка.
- source_word: נֹגְשַׂיִךְ
  choice: твоими надсмотрщиками
  rationale: Причастная форма во множественном числе обозначает тех, кто понуждает к труду или взыскивает дань. «Надсмотрщики» сохраняет оттенок принуждения и поэтический контраст с праведностью.
- source_word: צְדָקָה
  choice: праведность
  rationale: Слово может означать как нравственную праведность, так и справедливость общественного порядка; основной текст сохраняет традиционно широкое «праведность», а альтернатива дана в сноске.
theological_decisions:
- issue: Образ преображённой власти в заключительной строке
  choice: Мир и праведность олицетворены как управляющие Иерусалимом лица.
  alternative: «Я сделаю мир твоим управлением, а справедливость — твоей властью».
  rationale: Еврейский текст допускает понимание первого термина как управления или как совокупности должностных лиц. Личное выражение сохраняет напряжённую поэтическую персонификацию и параллель с теми, кто прежде мог принуждать народ, не превращая строку в техническое описание государственного устройства.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Эллипсис во второй части перечня делает стих плавным, а намеренно необычная конструкция «поставлю мир твоими управителями» сохраняет поэтическое олицетворение оригинала.
