base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/022.yaml
  text: The smallest will become a thousand[a], and the least a mighty nation. I am Yahweh[c][b]; in its time I will hasten it.
translation:
  language: ru
  text: Самый малый станет тысячей[a], а самый незначительный — могучим народом. Я — Яхве; в своё время Я ускорю это[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станет родовой общиной». Еврейское אֶלֶף может означать как «тысячу», так и родовую общину; здесь параллелизм с «могучим народом» скорее поддерживает числовой смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в назначенное для этого время Я ускорю это». Еврейский текст соединяет определённый срок со скорым исполнением.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַקָּטֹן
  choice: малый
  rationale: Прилагательное употреблено субстантивно и обозначает того, кто мал числом или незначителен; «малый» естественно сочетается с образом последующего умножения.
- source_word: יִהְיֶה
  choice: станет
  rationale: В сочетании с לָאֶלֶף глагол выражает переход к новому состоянию, поэтому «станет» точнее простого «будет».
- source_word: לָאֶלֶף
  choice: тысячей
  rationale: Основное числовое значение אֶלֶף и параллелизм с «могучим народом» поддерживают смысл численного возрастания; возможное значение «род» отмечено в сноске.
- source_word: הַצָּעִיר
  choice: незначительный
  rationale: Здесь слово параллельно הַקָּטֹן и указывает скорее на малость или низкое положение, чем на юный возраст.
- source_word: לְגוֹי עָצוּם
  choice: могучим народом
  rationale: «Народ» передаёт גּוֹי, а «могучий» сохраняет силу עָצוּם и масштаб обещанного роста.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Сохранено прямое самоименование и передано личное имя יהוה транслитерацией «Яхве».
- source_word: בְּעִתָּהּ
  choice: в своё время
  rationale: Фраза указывает на надлежащее или определённое для обещанного события время, не уточняя сверх текста характер этого срока.
- source_word: אֲחִישֶׁנָּה
  choice: Я ускорю это
  rationale: Каузативная форма передаёт действие Яхве, который ускоряет исполнение; местоимение «это» естественно отсылает ко всему обещанному событию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное божественное имя; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Соотношение назначенного времени и ускоренного исполнения
  choice: в своё время Я ускорю это
  alternative: когда придёт время, Я быстро исполню это
  rationale: Буквенная конструкция сохраняет намеренное напряжение между установленным временем и ускоряющим действием Бога, не сглаживая его толкованием.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Синтаксический параллелизм первой половины стиха сохранён; архаизмы и конфессионально окрашенные замены имени יהוה исключены.
