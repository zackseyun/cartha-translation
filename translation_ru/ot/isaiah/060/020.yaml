source:
  edition: WLC
  text: לֹא יָב֥וֹא עוֹד֙ שִׁמְשֵׁ֔/ךְ וִ/ירֵחֵ֖/ךְ לֹ֣א יֵאָסֵ֑ף כִּ֣י יְהוָ֗ה יִֽהְיֶה לָּ/ךְ֙ לְ/א֣וֹר עוֹלָ֔ם וְ/שָׁלְמ֖וּ יְמֵ֥י אֶבְלֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/020.yaml
  text: Your sun will no longer go down[a], and your moon will not withdraw; for Yahweh will be your everlasting light[b], and the days of your mourning will be ended.
translation:
  language: ru
  text: Твоё солнце больше не зайдёт[a], и твоя луна не скроется[b], потому что Яхве будет для тебя вечным светом, и окончатся дни твоего плача.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «больше не придёт». В отношении солнца это выражение здесь означает, что оно больше не зайдёт.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будет убрана». Еврейский глагол буквально означает «быть собранной, убранной», то есть исчезнуть из виду или перестать светить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָבוֹא עוֹד שִׁמְשֵׁךְ
  choice: Твоё солнце больше не зайдёт
  rationale: Глагол בוא буквально означает «приходить», но применительно к солнцу здесь идиоматически обозначает заход. «Не зайдёт» естественно передаёт смысл и сохраняет образ.
- source_word: וִירֵחֵךְ לֹא יֵאָסֵף
  choice: и твоя луна не скроется
  rationale: Нифаль от אסף буквально передаёт значение «быть собранной, убранной». В параллели с заходом солнца речь о том, что луна не будет удалена из виду; «не скроется» звучит естественно и не сводит образ к фазам луны.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано транслитерацией, а не заменено титулом.
- source_word: יִהְיֶה לָךְ לְאוֹר עוֹלָם
  choice: будет для тебя вечным светом
  rationale: Формулировка сохраняет еврейскую конструкцию לָךְ и передаёт עוֹלָם как неограниченную длительность.
- source_word: וְשָׁלְמוּ יְמֵי אֶבְלֵךְ
  choice: и окончатся дни твоего плача
  rationale: שלם здесь означает достижение конца или завершение, а אֵבֶל — траурный плач, скорбь. Перевод естественно выражает прекращение периода плача.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Образы солнца и луны
  choice: Сохранить космические образы без сведения к отвлечённому утешению
  alternative: Передать как чисто образное обещание благополучия
  rationale: Текст противопоставляет исчезновение обычного света вечному свету Яхве; буквальное сохранение образов не предрешает их эсхатологическое истолкование.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Обращение к Сиону сохраняет формы женского рода и единственного числа. Синтаксис ясен для широкого читателя, а исходный параллелизм сохранён.
