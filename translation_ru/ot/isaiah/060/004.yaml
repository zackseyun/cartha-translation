  text: שְׂאִֽי סָבִ֤יב עֵינַ֨יִ/ךְ֙ וּ/רְאִ֔י כֻּלָּ֖/ם נִקְבְּצ֣וּ בָֽאוּ לָ֑/ךְ בָּנַ֨יִ/ךְ֙ מֵ/רָח֣וֹק יָבֹ֔אוּ וּ/בְנֹתַ֖יִ/ךְ עַל צַ֥ד תֵּאָמַֽנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/004.yaml
  text: Lift up your eyes all around and see[a]; all of them gather together; they come to you. Your sons will come from far away[b], and your daughters will be carried on the hip.
translation:
  language: ru
  text: 'Подними глаза и посмотри вокруг: все они собрались и идут к тебе. Сыновья твои придут издалека, а дочерей твоих будут носить на боку[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут поддерживаемы»; глагол может также содержать оттенок заботы или вскармливания, а выражение «на боку» указывает на ношение ребёнка сбоку, у бедра.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאִי סָבִיב עֵינַיִךְ וּרְאִי
  choice: Подними глаза и посмотри вокруг
  rationale: Женские формы повелительного наклонения обращены к олицетворённому Сиону. Перестановка наречия даёт естественное современное русское выражение, сохраняя оба повеления.
- source_word: כֻּלָּם נִקְבְּצוּ בָאוּ לָךְ
  choice: все они собрались и идут к тебе
  rationale: Первый перфект передан как уже состоявшееся собирание, а второй — как наглядно представленное движение к Сиону; так сохраняется напряжение пророческой картины без искусственного выравнивания форм.
- source_word: בָּנַיִךְ מֵרָחוֹק יָבֹאוּ
  choice: Сыновья твои придут издалека
  rationale: Сохранены конкретное обозначение сыновей, противопоставленное дочерям, и будущее значение имперфекта в обещании возвращения.
- source_word: וּבְנֹתַיִךְ עַל צַד תֵּאָמַנָה
  choice: а дочерей твоих будут носить на боку
  rationale: Конкретный образ ребёнка, которого несут у бедра или на боку, естественно передаёт עַל צַד. Страдательная конструкция соответствует нифалю, а возможные оттенки заботы и вскармливания отмечены в сноске.
theological_decisions:
- issue: Гендерно конкретный образ восстановления
  choice: Сохранить «сыновья» и «дочери»
  alternative: Обобщить как «дети»
  rationale: Еврейский текст намеренно использует параллельную пару мужского и женского рода, изображая возвращение всех детей Сиона.
- issue: Временной план пророческих глаголов
  choice: Передать первые перфекты как уже увиденное собирание и настоящее движение, а имперфекты — будущим временем
  alternative: Передать все глаголы единообразно в будущем или прошедшем времени
  rationale: Так сохраняются пророческая наглядность первой картины и направленность обещания во второй половине стиха.
- issue: Значение תֵּאָמַנָה
  choice: «будут носить» с пояснением в сноске
  alternative: «будут вскормлены» или «будут поддерживаемы»
  rationale: В данном образе возвращения детей значение ношения лучше всего сочетается с עַל צַד, однако редкий глагол допускает оттенок заботливого поддерживания или вскармливания, поэтому неоднозначность не устранена молча.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение к Сиону сохраняется в женском единственном числе; инверсия «Сыновья твои» и «дочерей твоих» слегка возвышает стиль, не делая его архаичным.
