  source_fidelity: Русский текст точно передаёт повеления, обращённые к персонифицированному Сиону, пророческую картину собирания и прихода, а также различение между сыновьями и дочерьми. «Будут носить на боку» адекватно передаёт עַל־צַד תֵּאָמַנָה, сохраняя конкретный образ ребёнка, несомого у бедра/сбоку.
