  terminology: «Сыновья» и «дочери» верно сохраняют гендерно конкретную пару исходного текста. Сноска надлежащим образом отмечает менее определённые оттенки תֵּאָמַנָה, не подменяя основной образ конфессиональной интерпретацией.
