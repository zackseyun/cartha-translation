source:
  edition: WLC
  text: וְ/יָנַקְתְּ֙ חֲלֵ֣ב גּוֹיִ֔ם וְ/שֹׁ֥ד מְלָכִ֖ים תִּינָ֑קִי וְ/יָדַ֗עַתְּ כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/016.yaml
  text: You will nurse on the milk of nations[a], and you will suck the breast of kings; and you will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
translation:
  language: ru
  text: Ты будешь сосать молоко народов[a] и кормиться у груди царей. И узнаешь, что Я — Яхве, твой Спаситель и твой Искупитель, Могучий Иакова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ты будешь сосать молоко народов и сосать грудь царей». В еврейском тексте дважды повторён глагол «сосать», подчёркивающий яркий образ кормления и получения поддержки от народов и их правителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָנַקְתְּ
  choice: ты будешь сосать
  rationale: Глагол ינק прямо обозначает сосание молока. Такая передача сохраняет яркий образ Сиона, представленного как женщина, которую питают народы.
- source_word: חֲלֵב גּוֹיִם
  choice: молоко народов
  rationale: Сохранено конкретное значение «молоко», а не истолкование «богатства» или «изобилие»; גּוֹיִם естественно передано как «народы».
- source_word: וְשֹׁד מְלָכִים תִּינָקִי
  choice: и кормиться у груди царей
  rationale: Передача сохраняет телесный образ кормления грудью и упоминание царей, но избегает в основном тексте неестественного для современного русского сочетания «сосать грудь». Более буквальная форма отмечена в сноске.
- source_word: וְיָדַעַתְּ
  choice: и узнаешь
  rationale: Сохраняется простая еврейская координация и будущая направленность пророческой речи без усиления причинно-следственной связи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: מוֹשִׁיעֵךְ
  choice: твой Спаситель
  rationale: Причастная форма с местоименным суффиксом естественно и ёмко передаётся как титул «твой Спаситель».
- source_word: וְגֹאֲלֵךְ
  choice: твой Искупитель
  rationale: Слово גאל обозначает избавление и возвращение принадлежащего; «Искупитель» сохраняет характерный для Исаии титул, не добавляя прямо не выраженного уточнения «родственник».
- source_word: אֲבִיר יַעֲקֹב
  choice: Могучий Иакова
  rationale: Сохранён божественный эпитет со значением силы и исходное имя «Иаков», а не заменяющее его «Израиль».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Буквальная образность кормления грудью или её истолкование как богатства и обеспечения
  choice: Сохранить образ молока и груди
  alternative: Передать смысл как получение богатств или ресурсов народов и царей
  rationale: Еврейский текст дважды использует ינק и прямо называет молоко и грудь. Хотя образ подразумевает обеспечение Сиона народами, его не следует заменять одним лишь объяснением.
- issue: Значение גֹאֵל
  choice: Искупитель
  alternative: Избавитель; родственник-искупитель
  rationale: Контекст допускает широкий смысл спасительного и восстановительного действия Бога; уточнение «родственник» здесь не выражено прямо и неоправданно сузило бы смысл.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого тона. Обращение ведётся к Сиону как к лицу женского рода; в русском тексте это видно по контексту раздела, хотя формы будущего времени сами по себе рода не обозначают. Необычная телесная метафора сохранена, а её предельно буквальная синтаксическая форма вынесена в сноску.
