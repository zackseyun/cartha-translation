base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/015.yaml
  text: Instead of your being forsaken and hated[a], with no one passing through, I will make you an everlasting majesty, a joy from generation to generation.
translation:
  language: ru
  text: Вместо того, что ты была покинута и ненавидима и никто не проходил через тебя, Я сделаю тебя вечным величием[a], радостью из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечной славой»; возможно также: «вечным возвышением». Еврейское слово может обозначать величие, славу, возвышенность или гордость в смысле почётного положения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת הֱיוֹתֵךְ
  choice: Вместо того чтобы быть
  rationale: Конструкция обозначает смену прежнего состояния новым; такой оборот естественен по-русски и сохраняет противопоставление.
- source_word: עֲזוּבָה
  choice: покинутой
  rationale: Передаёт состояние оставленности города и сохраняет весомость образа восстановления.
- source_word: וּשְׂנוּאָה
  choice: ненавистной
  rationale: Прямо передаёт пассивное значение причастия, не ослабляя его до «презираемой» или «отвергнутой».
- source_word: וְאֵין עוֹבֵר
  choice: так что никто не проходил через тебя
  rationale: Связывает отсутствие проходящих с прежним запустением и явно выражает подразумеваемый объект — олицетворённый город.
- source_word: וְשַׂמְתִּיךְ
  choice: Я сделаю тебя
  rationale: В сочетании с לְ глагол выражает превращение или наделение новым положением.
- source_word: לִגְאוֹן עוֹלָם
  choice: вечным величием
  rationale: גאון здесь обозначает дарованный Богом возвышенный и почётный статус, а עוֹלָם — его непреходящий характер; «величие» избегает отрицательных оттенков русского слова «гордость».
- source_word: מְשׂוֹשׂ
  choice: радостью
  rationale: Существительное обозначает радость или ликование; творительный падеж естественно зависит от «сделаю тебя».
- source_word: דּוֹר וָדוֹר
  choice: из поколения в поколение
  rationale: Устойчиво и точно передаёт непрерывность через последовательные поколения.
theological_decisions:
- issue: Значение גאון в пророчестве о восстановлении Сиона
  choice: вечное величие
  alternative: вечная слава; вечное возвышение; вечная гордость
  rationale: Контекст говорит не о греховной гордыне, а о возвышенном и почётном положении, которое Бог дарует Сиону. «Величие» сохраняет положительный смысл, не сужая его до одной конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род сохраняет обращение к олицетворённому Сиону/Иерусалиму; заглавное «Я» указывает на говорящего Бога.
