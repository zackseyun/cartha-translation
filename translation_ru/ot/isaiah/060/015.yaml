  source_fidelity: 'Основной смысл передан верно: תַּחַת вводит замену прежнего состояния Сиона обещанным; עֲזוּבָה и שְׂנוּאָה обозначают оставленность и ненависть; וְאֵין עוֹבֵר — отсутствие проходящих; גְאוֹן עוֹלָם — непреходящее возвышенное достоинство. Однако «так что» придаёт отсутствию проходящих причинно-следственный оттенок, которого в еврейском координированном описании нет.'
  naturalness: «Ненавистной» в современном русском может означать скорее «вызывающей ненависть», чем «той, которую ненавидят». «Ненавидима» точнее передаёт пассивное причастие и остаётся уместной в достоинственном пророческом регистре. Конструкция «Вместо того, что ты была...» литературно-библейская, но понятная и позволяет точно передать ретроспективное состояние без искусственной причинной связи.
  terminology: «Вечным величием» — удачное положительное соответствие גְאוֹן в контексте восстановления. Сноска корректно сохраняет возможные оттенки «слава», «возвышение» и «гордость» в смысле почётного статуса.
