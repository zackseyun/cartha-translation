source:
  edition: WLC
  text: וּ/פִתְּח֨וּ שְׁעָרַ֧יִ/ךְ תָּמִ֛יד יוֹמָ֥ם וָ/לַ֖יְלָה לֹ֣א יִסָּגֵ֑רוּ לְ/הָבִ֤יא אֵלַ֨יִ/ךְ֙ חֵ֣יל גּוֹיִ֔ם וּ/מַלְכֵי/הֶ֖ם נְהוּגִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/011.yaml
  text: Your gates will be open continually[a]; day and night they will not be shut, so that the wealth of the nations may be brought to you[b], with their kings led in procession.
translation:
  language: ru
  text: Твои ворота будут открыты всегда; ни днём, ни ночью они не будут затворяться, чтобы к тебе приносили богатство народов[a] и приводили их царей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достояние народов». Еврейское חֵיל может также означать «силу» или «войско», но здесь, вероятнее всего, речь идёт о богатстве, приносимом как дань.'
    reason: lexical_alternative
  - marker: b
    text: То есть царей будут вести; еврейское причастие может подразумевать торжественное сопровождение, шествие или ведение покорённых царей.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִתְּחוּ שְׁעָרַיִךְ תָּמִיד
  choice: Твои ворота будут открыты всегда
  rationale: Форма וּפִתְּחוּ в данном пророческом контексте описывает устойчивое будущее состояние ворот. Русская конструкция с кратким страдательным причастием естественно передаёт это значение, а «всегда» выражает непрерывность תָּמִיד.
- source_word: יוֹמָם וָלַיְלָה לֹא יִסָּגֵרוּ
  choice: ни днём ни ночью их не закроют
  rationale: Меризм «днём и ночью» обозначает непрерывность; повторяющая отрицательная конструкция «ни… ни…» естественна по-русски. Неопределённо-личная форма сохраняет страдательный смысл нифаля יִסָּגֵרוּ.
- source_word: לְהָבִיא אֵלַיִךְ
  choice: чтобы к тебе приносили
  rationale: Инфинитив с לְ выражает цель. «К тебе» сохраняет направленность к олицетворённому Сиону, а «приносили» естественно сочетается с богатством как данью.
- source_word: חֵיל גּוֹיִם
  choice: богатство народов
  rationale: חֵיל может означать силу, войско, имущество или богатство. В контексте Ис 60, где народы доставляют в Сион золото, стада и другие ценности, наиболее вероятно значение материальных ресурсов, при этом лексическая неоднозначность отмечена в сноске.
- source_word: וּמַלְכֵיהֶם נְהוּגִים
  choice: и вели их царей
  rationale: Страдательное причастие נְהוּגִים от נהג указывает, что царей ведут. Нейтральное «вели» не решает без достаточных оснований, идёт ли речь о торжественном сопровождении или о подчинённом положении пленников.
theological_decisions:
- issue: Значение חֵיל גּוֹיִם в картине принесения даров Сиону
  choice: материальное богатство народов
  alternative: войско или военная сила народов
  rationale: Ближайший контекст главы сосредоточен на ценностях и дарах, приносимых народами. Выбор «богатство» поддерживает эту связь, а возможность иных словарных значений сохраняется в примечании.
- issue: Положение царей, обозначенное נְהוּגִים
  choice: цари представлены как те, кого ведут
  alternative: цари идут в торжественной процессии или их ведут как покорённых пленников
  rationale: Еврейское причастие ясно передаёт пассивное ведение, но само по себе не определяет однозначно его церемониальный либо принудительный характер. Поэтому основной текст сохраняет напряжение между этими оттенками.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной пророческой интонацией. Обращение к Сиону сохранено в женском единственном числе. Синтаксис намеренно не уточняет, ведут ли царей в почётной процессии или как покорённых.
