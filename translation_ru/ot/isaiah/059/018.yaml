base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/018.yaml
  text: 'According to their deeds[a], so he will repay: wrath to his adversaries, repayment to his enemies; to the coastlands he will repay what is due.'
translation:
  language: ru
  text: 'Он воздаст по их делам: ярость — своим противникам, возмездие — своим врагам; дальним побережьям[a] Он воздаст возмездие.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «островам». Еврейское слово может обозначать острова или отдалённые приморские земли; у Исаии оно нередко относится в широком смысле к далёким прибрежным народам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַל גְּמֻלוֹת כְּעַל
  choice: По мере дел он и
  rationale: Повтор конструкции כְּעַל выражает соответствие воздаяния содеянному. «По мере дел» естественно передаёт этот смысл, а частица «и» отражает усиление повтором, не создавая неестественного сочетания вроде «по воздаяниям воздаст».
- source_word: יְשַׁלֵּם
  choice: воздаст
  rationale: Порода пиэль глагола שׁלם здесь означает отплатить, воздать. «Воздаст» сохраняет судебно-торжественный оттенок и связь с существительным «возмездие».
- source_word: חֵמָה
  choice: яростью
  rationale: Слово обозначает сильный, пылающий гнев; «ярость» передаёт интенсивность и хорошо вписывается в параллельную конструкцию стиха.
- source_word: לְצָרָיו
  choice: своим противникам
  rationale: צַר обозначает враждебно противостоящих ему людей; «противники» передаёт смысл без неоправданного уточнения характера их вражды.
- source_word: גְּמוּל
  choice: возмездием
  rationale: В данном судебном контексте существительное обозначает заслуженную отплату. «Возмездие» сохраняет мотив соответствующего делам наказания.
- source_word: לְאֹיְבָיו
  choice: своим врагам
  rationale: Это прямой и естественный русский эквивалент אוֹיֵב в контексте вражды и суда.
- source_word: לָאִיִּים
  choice: дальним побережьям
  rationale: В книге Исаии אִיִּים часто обозначает удалённые приморские земли и народы. «Дальние побережья» передаёт географическую широту выражения; возможное более узкое значение отмечено в сноске.
- source_word: גְּמוּל יְשַׁלֵּם
  choice: он воздаст по заслугам
  rationale: Сочетание однокоренных существительного и глагола усиливает мысль о полном и справедливом воздаянии. Русское «воздаст по заслугам» естественно передаёт этот акцент.
theological_decisions:
- issue: Подлежащее глаголов третьего лица единственного числа
  choice: Сохранить местоимение «он», не добавляя имени Господа
  alternative: Явно написать «Господь»
  rationale: Из ближайшего контекста ясно, что действует Бог, однако в еврейском тексте данного стиха Его имя повторно не названо. Местоимение сохраняет ход исходного повествования и не вносит отсутствующий в стихе титул.
- issue: Смысл начальной конструкции из корня גמל
  choice: 'Передать её как меру воздаяния: «По мере дел»'
  alternative: 'Буквально воспроизвести абстрактное существительное: «по мере воздаяний»'
  rationale: Конструкция подчёркивает соответствие отплаты содеянному. Выбранный вариант передаёт пропорциональность суда, не превращая неоднозначную форму в излишне конкретизированное утверждение о чьих-либо отдельных поступках.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой судебной речи. Параллелизм подчёркнут тире, а повтор лексики воздаяния сохранён без тяжеловесной буквальности. Маркер сноски поставлен при словах «дальним побережьям», к которым относится лексическая альтернатива.
