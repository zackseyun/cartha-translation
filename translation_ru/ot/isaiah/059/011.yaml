id: ISA.59.11
reference: Isaiah 59:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: נֶהֱמֶ֤ה כַ/דֻּבִּים֙ כֻּלָּ֔/נוּ וְ/כַ/יּוֹנִ֖ים הָגֹ֣ה נֶהְגֶּ֑ה נְקַוֶּ֤ה לַ/מִּשְׁפָּט֙ וָ/אַ֔יִן לִֽ/ישׁוּעָ֖ה רָחֲקָ֥ה מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/011.yaml
  text: We all growl like bears[a], and like doves we moan continually; we hope for justice, but there is none; for salvation[b], but it is far from us.
translation:
  language: ru
  text: Все мы рычим, словно медведи, и непрестанно стонем, словно голуби. Ждём справедливости[a] — но её нет, спасения[b] — но оно далеко от нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надеемся на справедливость». Еврейский глагол может выражать как ожидание, так и надежду.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избавления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶהֱמֶה
  choice: рычим
  rationale: Глагол передаёт громкий глухой звук; в сравнении с медведями русское «рычим» естественно сохраняет образ и отличается от стона голубей.
- source_word: כַדֻּבִּים כֻּלָּנוּ
  choice: все мы… словно медведи
  rationale: Сохранены собирательный акцент и сравнение во множественном числе; «словно» звучит естественно и литературно.
- source_word: וְכַיּוֹנִים הָגֹה נֶהְגֶּה
  choice: и непрестанно стонем, словно голуби
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает действие. «Непрестанно стонем» передаёт усиление и скорбный контекст; нейтральное «воркуем» ослабило бы плач.
- source_word: נְקַוֶּה
  choice: ждём
  rationale: קוה допускает значения ожидания и надежды. «Ждём» прямо выражает напряжённое ожидание отсутствующего исхода, а альтернативный оттенок надежды отмечен в сноске.
- source_word: לַמִּשְׁפָּט
  choice: справедливости
  rationale: Здесь מִשְׁפָּט означает ожидаемое восстановление справедливого порядка, а не только судебное решение; «справедливость» естественно передаёт этот широкий смысл.
- source_word: וָאַיִן
  choice: но её нет
  rationale: Противительный союз ясно выражает крушение ожидания, подразумеваемое контекстом.
- source_word: לִישׁוּעָה
  choice: спасения
  rationale: «Спасение» сохраняет широкий пророческий и богословский диапазон יְשׁוּעָה, оставаясь уместным для конкретного избавления.
- source_word: רָחֲקָה מִמֶּנּוּ
  choice: оно далеко от нас
  rationale: Прямая и естественная передача предикативного утверждения об удалённости ожидаемого спасения.
theological_decisions:
- issue: Значение יְשׁוּעָה в пророческом плаче
  choice: спасение
  alternative: избавление
  rationale: «Спасение» сохраняет богословскую широту слова у Исаии, не сводя его к одной форме помощи и не привнося позднейших доктринальных уточнений; конкретный смысл избавления остаётся возможным и указан в сноске.
- issue: Характер ожидаемого מִשְׁפָּט
  choice: справедливость
  alternative: суд; правосудие
  rationale: Контекст говорит об отсутствующем справедливом порядке и оправдывающем вмешательстве, поэтому перевод не ограничен формальным судебным приговором.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого плача. Параллелизм двух образов и двух несбывшихся ожиданий сохранён; тире подчёркивают резкий контраст. Лексика понятна широкому читателю и не привносит конфессиональных уточнений.
