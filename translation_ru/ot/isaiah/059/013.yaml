translation:
  language: ru
  text: восставать и отрекаться от Яхве, отступать от нашего Бога, говорить слова угнетения и мятежа[a], вынашивать в сердце и произносить слова лжи.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «мятеж», может также означать «бунт», «отступление» или «отступничество».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из сердца». Ложные слова исходят из внутреннего намерения, а не являются лишь внешней речью.'
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׁעַ
  choice: восставать
  rationale: Инфинитив передаёт деятельное нарушение верности, имеющее оттенок бунта; форма инфинитива сохраняет синтаксический перечень проступков, начатый в контексте.
- source_word: וְכַחֵשׁ בַּיהוָה
  choice: и отрекаться от Яхве
  rationale: כחש с предлогом ב при имени Бога может означать отрицание, неверность или ложное отношение; «отрекаться» естественно выражает здесь сознательное отрицание заветной верности, не сводя смысл к отрицанию существования Бога.
- source_word: בַּיהוָה
  choice: от Яхве
  rationale: Личное имя יהוה передано как «Яхве»; падежное управление обусловлено русским глаголом «отрекаться».
- source_word: וְנָסוֹג מֵאַחַר אֱלֹהֵינוּ
  choice: отступать от нашего Бога
  rationale: נסוג означает отходить или поворачивать назад, а מֵאַחַר в данном обороте — переставать следовать; «отступать от нашего Бога» передаёт и образ удаления, и прекращение следования.
- source_word: דַּבֶּר עֹשֶׁק
  choice: говорить об угнетении
  rationale: דבר вводит содержание речи, а עשק обозначает угнетение, притеснение или корыстную несправедливость. Широкое «угнетение» не сужает смысл до вымогательства либо обмана.
- source_word: וְסָרָה
  choice: и мятеже
  rationale: סרה может означать уклонение, бунт или отступничество. «Мятеж» сохраняет серьёзность неповиновения, не вводя более узкий конфессиональный термин «вероотступничество».
- source_word: הֹרוֹ וְהֹגוֹ
  choice: замышлять и произносить
  rationale: Сочетание описывает внутреннее зарождение замысла и его выражение вовне; русский выбор сохраняет эту последовательность.
- source_word: מִלֵּב
  choice: из сердца
  rationale: Фраза указывает на внутренний источник речи. Буквальный образ сердца понятен современному русскому читателю и значим в контексте намерения.
- source_word: דִּבְרֵי שָׁקֶר
  choice: слова лжи
  rationale: Конструкция означает слова, характеризуемые ложью и обманом; «слова лжи» сохраняет еврейскую именную структуру и звучит достойно по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблено личное имя Бога. «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Степень религиозной конкретизации וְסָרָה
  choice: мятеж
  alternative: отступничество; бунт
  rationale: Контекст говорит о неверности Богу, однако само существительное допускает более широкий смысл неповиновения. «Мятеж» сохраняет богословскую напряжённость, не делая значение неоправданно узким.
- issue: Смысл כחש по отношению к Яхве
  choice: отрекаться от Яхве
  alternative: лгать Яхве; поступать вероломно против Яхве
  rationale: Формулировка выражает заветное отрицание и неверность, но не утверждает, будто речь непременно идёт о философском отрицании существования Бога.
translation_notes:
  register: Современный литературный русский с достоинством пророческой исповеди. Цепочка инфинитивов сохраняет форму еврейского перечня и связь с предыдущим стихом; лексика понятна без церковнославянизмов.
