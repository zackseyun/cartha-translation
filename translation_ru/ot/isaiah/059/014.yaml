base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/014.yaml
  text: Justice is turned back[a], and righteousness stands far off; for truth has stumbled in the street[b], and uprightness cannot enter.
translation:
  language: ru
  text: Правосудие оттеснено назад[a], и праведность стоит вдали, потому что истина споткнулась на площади[b], и правота не может войти[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обращено вспять»; еврейская форма также допускает оттенок «отброшено назад».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на улице» — еврейское слово может обозначать широкую улицу или общественную площадь.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «то, что правильно, не может войти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻסַּג אָחוֹר
  choice: оттеснено назад
  rationale: Хофаль глагола סוג выражает пассивное движение вспять, вероятно под внешним давлением. «Оттеснено назад» сохраняет пассивность и олицетворение правосудия.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В данном общественно-судебном контексте речь идёт не об отдельном приговоре, а о справедливом отправлении суда.
- source_word: צְדָקָה
  choice: праведность
  rationale: Выбор сохраняет отличие от מִשְׁפָּט и передаёт нравственную правильность, хотя в контексте слово также имеет общественное измерение.
- source_word: מֵרָחוֹק תַּעֲמֹד
  choice: стоит вдали
  rationale: 'Буквальный и естественный образ: олицетворённая праведность остаётся на расстоянии.'
- source_word: כָשְׁלָה
  choice: споткнулась
  rationale: Глагол означает «споткнуться, пошатнуться»; перевод сохраняет метафору и не усиливает её до окончательного падения.
- source_word: בָרְחוֹב
  choice: на площади
  rationale: רְחוֹב обозначает широкое открытое общественное место, улицу или площадь. «На площади» особенно ясно передаёт публичную, гражданскую обстановку.
- source_word: אֱמֶת
  choice: истина
  rationale: В контексте общественной неправды слово означает истину и достоверность; «истина» естественно сочетается с олицетворением.
- source_word: נְכֹחָה
  choice: правота
  rationale: Слово обозначает прямоту и то, что правильно. «Правота» сохраняет абстрактное олицетворение и не смешивается полностью с «праведностью».
- source_word: לֹא תוּכַל לָבוֹא
  choice: не может войти
  rationale: Передаёт образ правильности, которой закрыт доступ в общественную жизнь, не добавляя не названного в тексте места назначения.
theological_decisions:
- issue: Передача пары מִשְׁפָּט / צְדָקָה
  choice: правосудие … праведность
  alternative: справедливость … правда
  rationale: Разные русские слова сохраняют различие двух взаимосвязанных общественно-нравственных понятий и не сводят их к одному термину.
- issue: Олицетворение общественных добродетелей
  choice: 'Сохранены глаголы движения и положения: «оттеснено», «стоит», «споткнулась», «войти»'
  alternative: Передать состояние отвлечённо, без олицетворения
  rationale: Еврейский текст намеренно изображает правосудие, праведность, истину и правоту как действующих лиц; сохранение образа не требует дополнительного богословского истолкования.
