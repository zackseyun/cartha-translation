id: ISA.59.16
reference: Isaiah 59:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יַּרְא֙ כִּֽי אֵ֣ין אִ֔ישׁ וַ/יִּשְׁתּוֹמֵ֖ם כִּ֣י אֵ֣ין מַפְגִּ֑יעַ וַ/תּ֤וֹשַֽׁע ל/וֹ֙ זְרֹע֔/וֹ וְ/צִדְקָת֖/וֹ הִ֥יא סְמָכָֽתְ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/016.yaml
  text: He saw that there was no man[a], and he was appalled that there was no one to intercede; so his own arm brought him salvation[c][b], and his righteousness upheld him.
translation:
  language: ru
  text: Он увидел, что не было ни одного человека[a], и был потрясён тем, что некому заступиться[b]. Тогда Его собственная рука принесла Ему спасение, и Его праведность[c] поддержала Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не было человека». Речь идёт об отсутствии какого-либо человеческого деятеля.'
    reason: cultural_note
  - marker: b
    text: 'Или: «вмешаться»; «ходатайствовать». Древнееврейское причастие может обозначать того, кто вступается за другого.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «справедливость». Древнееврейское слово может обозначать как праведность, так и справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ни одного человека
  rationale: Сохраняет единственное число и подчёркивает полное отсутствие человеческого деятеля; русское «человек» в таком контексте естественно имеет обобщённое значение.
- source_word: וַיִּשְׁתּוֹמֵם
  choice: был потрясён
  rationale: Передаёт не простое удивление, а глубокое потрясение перед нравственно тяжёлым положением, оставаясь естественным для современного русского языка.
- source_word: מַפְגִּיעַ
  choice: некому заступиться
  rationale: Причастие породы hифиль обозначает того, кто вступает в дело ради другого; «заступиться» естественно выражает посредническое вмешательство, не сужая значение исключительно до молитвенного ходатайства.
- source_word: וַתּוֹשַׁע
  choice: принесла Ему спасение
  rationale: Передаёт совершённое рукой избавление и сохраняет в тексте значимое понятие спасения.
- source_word: זְרֹעוֹ
  choice: Его собственная рука
  rationale: '«Рука» естественно передаёт древнееврейский образ силы и решительного действия, а «собственная» выявляет контекстуальный акцент: при отсутствии человека Бог действует Сам.'
- source_word: צִדְקָתוֹ
  choice: Его праведность
  rationale: «Праведность» сохраняет широту понятия צדקה — нравственную правоту, верность и справедливое действие; возможное значение «справедливость» отмечено в сноске.
- source_word: סְמָכָתְהוּ
  choice: поддержала Его
  rationale: Прямо и естественно передаёт значение опоры и поддержки без излишней архаизации.
theological_decisions:
- issue: К кому относятся местоименные суффиксы
  choice: 'Все формы «Его/Ему» относятся к Господу: Он Сам совершает спасительное действие, поскольку не нашлось человеческого заступника.'
  alternative: Заключительные строки можно понимать менее рефлексивно — как описание действия Божьей силы и праведности без особого ударения на «Сам».
  rationale: Ближайший контекст и последовательность древнееврейских суффиксов указывают на одного субъекта. Слово «собственная» раскрывает контекстуальное противопоставление, но не вводит более поздних богословских категорий.
- issue: Значение צְדָקָה
  choice: праведность
  alternative: справедливость
  rationale: В данном месте слово охватывает как нравственную правоту Бога, так и Его справедливое действие. Основной текст сохраняет более широкое «праведность», а альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Архаичное «мышца» заменено естественным «рука»; прописные местоимения последовательно указывают на Господа. Параллелизм двух заключительных частей сохранён.
