  yaml_path: translation/ot/isaiah/059/007.yaml
  text: Their feet run to evil[a], and they hurry to shed innocent blood; their thoughts are thoughts of iniquity[b]; devastation and destruction are in their highways.
translation:
  language: ru
  text: Ноги их бегут ко злу, и они спешат проливать невинную кровь; их помыслы[a] — помыслы беззакония; разорение и гибель — на их дорогах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их замыслы — замыслы беззакония»; еврейское слово может означать мысли, намерения или замыслы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на их путях»; еврейское слово буквально обозначает дороги или большие дороги, но здесь также указывает на образ действий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם
  choice: ноги их
  rationale: Сохранён конкретный образ частей тела, который метонимически описывает поведение; такой оборот естественен для возвышенной русской речи.
- source_word: לָרַע
  choice: ко злу
  rationale: Передаёт направленность к нравственному злу без поясняющего добавления «делать».
- source_word: יָרֻצוּ
  choice: бегут
  rationale: Прямо сохраняет образ быстрого движения.
- source_word: וִימַהֲרוּ
  choice: и они спешат
  rationale: Передаёт второе указание на быстроту и готовность действовать, не сливая его с глаголом «бегут».
- source_word: לִשְׁפֹּךְ דָּם נָקִי
  choice: проливать невинную кровь
  rationale: Естественный русский библейский идиоматический оборот, точно обозначающий насильственное кровопролитие.
- source_word: מַחְשְׁבוֹתֵיהֶם
  choice: их помыслы
  rationale: «Помыслы» охватывают мысли и намерения и позволяет сохранить повтор исходного существительного.
- source_word: מַחְשְׁבוֹת אָוֶן
  choice: помыслы беззакония
  rationale: Повтор «помыслы» сохраняет риторическую структуру; «беззаконие» передаёт нравственный смысл אָוֶן в данном обвинительном контексте.
- source_word: שֹׁד
  choice: разорение
  rationale: Передаёт опустошительный результат насилия и сохраняет отличие от следующего близкого по смыслу существительного.
- source_word: וָשֶׁבֶר
  choice: и гибель
  rationale: Естественно передаёт сокрушение и разрушительную катастрофу в паре с «разорением».
- source_word: בִּמְסִלּוֹתָם
  choice: на их дорогах
  rationale: Сохраняет конкретный образ дорог, одновременно допускающий метафорический смысл жизненного пути; предлог «на» естественен по-русски.
theological_decisions:
- issue: Нравственная характеристика אָוֶן
  choice: беззаконие
  alternative: зло; нечестие; бедствие
  rationale: Контекст обличает преступные намерения и поступки, поэтому нравственный смысл предпочтителен; перевод не уточняет его конфессионально.
