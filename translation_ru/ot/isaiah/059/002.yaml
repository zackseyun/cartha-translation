  text: כִּ֤י אִם עֲוֺנֹֽתֵי/כֶם֙ הָי֣וּ מַבְדִּלִ֔ים בֵּינֵ/כֶ֕ם לְ/בֵ֖ין אֱלֹֽהֵי/כֶ֑ם וְ/חַטֹּֽאותֵי/כֶ֗ם הִסְתִּ֧ירוּ פָנִ֛ים מִ/כֶּ֖ם מִ/שְּׁמֽוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/002.yaml
  text: But your iniquities have become those dividing between you and your God[a], and your sins have hidden his face from you, from hearing.
translation:
  language: ru
  text: Но ваши беззакония стали преградой между вами и вашим Богом, и ваши грехи заставили Его скрыть от вас Своё лицо, так что Он не слышит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ваши грехи скрыли лицо от вас, от слышания». В еврейском обороте подразумевается, что Бог скрывает от них Своё лицо; «от слышания» выражает результат: Он не слышит.'
    reason: Поясняет эллиптическое «скрыли лицо» и сохраняет формально близкое значение мִשְּׁמוֹעַ, не оставляя неестественной русской кальки в основном тексте.
lexical_decisions:
- source_word: כִּי אִם
  choice: Но
  rationale: 'В контексте сочетание имеет противительное значение: вопреки сказанному в ст. 1, причина не в неспособности Бога, а в беззакониях народа.'
- source_word: עֲוֺנֹתֵיכֶם
  choice: ваши беззакония
  rationale: «Беззакония» передаёт нравственную порочность и вину עָוֹן и сохраняет отличие от следующего חַטָּאוֹת — «грехи».
- source_word: הָיוּ מַבְדִּלִים
  choice: отделили
  rationale: Естественная русская передача конструкции היה с причастием в данном контексте; результат разделения сохраняется без неестественного буквального оборота.
- source_word: בֵּינֵיכֶם לְבֵין אֱלֹהֵיכֶם
  choice: вас от вашего Бога
  rationale: Идиоматически передаёт еврейскую конструкцию «между вами и вашим Богом» и ясно выражает возникшее разделение.
- source_word: וְחַטֹּאותֵיכֶם
  choice: и ваши грехи
  rationale: Передаёт חַטָּאוֹת обычным современным словом и сохраняет лексическое различие с «беззакониями».
- source_word: הִסְתִּירוּ פָנִים מִכֶּם
  choice: скрыли Его лицо от вас
  rationale: Сохраняет антропоморфный еврейский образ лица Бога; местоимение «Его» восполняет подразумеваемого обладателя лица.
- source_word: מִשְּׁמוֹעַ
  choice: так что Он не слышит
  rationale: Естественно передаёт значение результата у מִן с инфинитивом; формальный вариант отмечен в сноске.
theological_decisions:
- issue: Антропоморфный образ сокрытого Божьего лица
  choice: сохранить выражение «скрыли Его лицо»
  alternative: «заставили Его отвернуться» или «лишили вас Его благоволения»
  rationale: Исходный текст прямо использует образ лица. Его сохранение не сводит отчуждение к отвлечённому понятию и не добавляет толкования.
- issue: Причина разделения с Богом
  choice: представить беззакония и грехи народа причиной разделения и отсутствия ответа
  alternative: явно сформулировать более широкое учение о природе Бога и греха
  rationale: Стих противопоставляет человеческий грех предполагаемой неспособности Бога из ст. 1; перевод сохраняет эту причинность, не выходя за пределы текста.
- issue: Значение מִשְּׁמוֹעַ
  choice: 'передать как следствие: «так что Он не слышит»'
  alternative: 'формально: «от слышания»'
  rationale: Еврейская конструкция допускает выражение результата. Русская формулировка естественна, при этом более буквальная форма приведена в сноске, чтобы сохранить оттенок исходной конструкции.
translation_notes:
  register: Современный литературный русский, торжественный, но понятный. Сохранены параллелизм «беззакония / грехи» и библейский образ Божьего лица; синтаксис сделан естественным для русского языка.
