  text: We grope for the wall like the blind; like those without eyes we grope[a]. We stumble at noon as in the twilight; among the vigorous we are like the dead.
translation:
  language: ru
  text: Мы ощупываем стену, как слепые, и, словно без глаз, мы ощупываем путь. Спотыкаемся в полдень, будто в сумерках; среди крепких[a] мы — словно мёртвые.
