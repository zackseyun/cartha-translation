lexical_decisions:
- source_word: נְגַשְׁשָׁה / נְגַשֵּׁשָׁה
  choice: ощупываем / пробираемся на ощупь
  rationale: Порода пиэль глагола גשש обозначает поиск пути посредством осязания. В первом полустишии «ощупываем стену» естественно передаёт объект действия; во втором вариативное «пробираемся на ощупь» сохраняет повтор образа без неестественной русской тавтологии.
- source_word: כַעִוְרִים
  choice: как слепые
  rationale: Точно и естественно передаёт субстантивированное прилагательное во множественном числе, не добавляя отсутствующего в тексте указания на пол.
- source_word: קִיר
  choice: стену
  rationale: Существительное без артикля передано без обязательной определённости; винительный падеж обусловлен русским управлением глагола «ощупывать».
- source_word: וּכְאֵין עֵינַיִם
  choice: и, словно без глаз
  rationale: Сохраняет сравнительную конструкцию и усиление предыдущего образа слепоты, оставаясь лаконичным и естественным по-русски.
- source_word: כָּשַׁלְנוּ
  choice: спотыкаемся
  rationale: Глагол כשל здесь описывает утрату устойчивости и продолжает образ людей, не видящих пути.
- source_word: בַצָּהֳרַיִם
  choice: в полдень
  rationale: Передаёт ярчайшую часть дня и сохраняет резкий контраст с сумерками.
- source_word: כַּנֶּשֶׁף
  choice: будто в сумерках
  rationale: נשף может обозначать сумеречное время; контекст требует прежде всего образа слабой видимости, не вынуждая уточнять утро это или вечер.
- source_word: בָּאַשְׁמַנִּים
  choice: среди крепких
  rationale: Редкое и не вполне ясное слово, вероятно, обозначает крепких, здоровых или сильных людей. «Среди крепких» сохраняет контраст с мёртвыми; неопределённость отмечена в сноске.
- source_word: כַּמֵּתִים
  choice: словно мёртвые
  rationale: Кратко и резко сохраняет коллективное сравнение исходного текста.
