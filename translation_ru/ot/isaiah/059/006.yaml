source:
  edition: WLC
  text: קֽוּרֵי/הֶם֙ לֹא יִהְי֣וּ לְ/בֶ֔גֶד וְ/לֹ֥א יִתְכַּסּ֖וּ בְּ/מַֽעֲשֵׂי/הֶ֑ם מַֽעֲשֵׂי/הֶם֙ מַֽעֲשֵׂי אָ֔וֶן וּ/פֹ֥עַל חָמָ֖ס בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/006.yaml
  text: Their webs will not become clothing[a], nor will they cover themselves with their deeds; their deeds are deeds of wickedness[b], and the work of violence is in their hands.
translation:
  language: ru
  text: Их паутина не станет одеждой[a], и своими делами они не покроются; их дела — дела беззакония[b], и деяние насилия — в их руках.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «их сплетённое»; по контексту речь идёт о паутине.'
    reason: Лексема обозначает сплетённое или сотканное, а конкретный образ определяется предыдущим стихом.
  - marker: b
    text: 'Или: «дела зла»; также возможно: «дела нечестия».'
    reason: 'Еврейское אָוֶן имеет широкий диапазон значений: зло, нечестие, беззаконие, беда.'
lexical_decisions:
- source_word: קוּרֵיהֶם
  choice: их паутина
  rationale: Существительное обозначает сплетённое или сотканное; в связи с образом паутины в предыдущем стихе русское «паутина» естественно сохраняет метафору, хотя несколько конкретизирует её.
- source_word: לְבֶגֶד
  choice: одеждой
  rationale: בגד означает одежду или одеяние; творительный падеж после «станет» естественно передаёт значение результата.
- source_word: יִתְכַּסּוּ
  choice: они не покроются
  rationale: Форма хитпаэль имеет возвратное значение; «не покроются» сохраняет образ покрытия и не заменяет его толкованием.
- source_word: בְּמַעֲשֵׂיהֶם
  choice: своими делами
  rationale: 'Предлог ב имеет инструментальное значение: дела представлены как средство, которым они тщетно пытаются покрыться.'
- source_word: מַעֲשֵׂיהֶם
  choice: их дела
  rationale: Повтор слова «дела» воспроизводит повтор מַעֲשִׂים и его риторическое ударение.
- source_word: מַעֲשֵׂי אָוֶן
  choice: дела беззакония
  rationale: אָוֶן может означать зло, нечестие, беззаконие или беду; «беззаконие» передаёт здесь нравственное обвинение, сохраняя традиционно-библейский, но понятный регистр.
- source_word: וּפֹעַל חָמָס
  choice: и деяние насилия
  rationale: Единственное число и конструктивная связь сохранены. «Деяние» позволяет отличить פֹעַל от повторяющегося מַעֲשֶׂה, а חָמָס передано прямым словом «насилие».
- source_word: בְּכַפֵּיהֶם
  choice: в их руках
  rationale: כף буквально означает ладонь, но русское «в их руках» естественно передаёт образ обладания и ответственности.
theological_decisions:
- issue: Образ несостоятельного покрытия
  choice: Сохранить предметные образы паутины, одежды и покрытия, не разъясняя их нравственный смысл внутри перевода.
  alternative: 'Передать смысл толковательно: они не смогут скрыть себя или свою вину своими злыми делами.'
  rationale: Еврейский текст выражает обвинение через конкретную метафору; её прямое сохранение оставляет читателю подлинное образное напряжение и не добавляет отсутствующего в тексте объяснения.
- issue: Значение אָוֶן
  choice: беззаконие
  alternative: зло; нечестие; беда
  rationale: В данном контексте нравственного обличения «беззаконие» ясно выражает этическую направленность слова, не сводя его к одному частному виду зла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и повтор «дела» сохранены; метафора не заменена объяснительным пересказом.
