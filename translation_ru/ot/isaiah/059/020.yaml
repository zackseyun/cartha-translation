base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/020.yaml
  text: And a Redeemer will come to Zion[a], and to those in Jacob who turn from transgression[d][c][b], declares Yahweh.
translation:
  language: ru
  text: И придёт к Сиону[a] искупитель[b] и к тем из народа Иакова, кто отвращается от преступления[c], — возвещает Господь.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для Сиона». Еврейский предлог допускает такое значение, хотя при глаголе «прийти» наиболее естественно значение направления: «к Сиону».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское гоэль обозначает того, кто выкупает, возвращает утраченное или избавляет; слово нередко имеет оттенок обязанностей ближайшего родственника.
    reason: cultural_note
  - marker: c
    text: 'Возможные варианты: «к раскаявшимся из народа Иакова» или «к тем из народа Иакова, кто отвращается от мятежа».'
    reason: alternative_reading
  - marker: d
    text: Павел цитирует этот стих в Римлянам 11:26; его формулировка частично отличается под влиянием древнегреческой традиции.
    reason: cross_reference
lexical_decisions:
- source_word: וּבָא
  choice: И придёт
  rationale: Перфект Qal 3-го лица мужского рода в пророческом контексте передаёт уверенное будущее событие; русское будущее время естественно выражает этот смысл.
- source_word: לְצִיּוֹן
  choice: к Сиону
  rationale: При глаголе движения предлог ל естественнее всего понимать как указание направления. Вариант «для Сиона» сохранён в примечании как реальная лексическая возможность.
- source_word: גּוֹאֵל
  choice: Искупитель
  rationale: Существительное גאל обозначает того, кто выкупает, возвращает утраченное или избавляет, и может иметь родственно-правовые и заветные оттенки. «Искупитель» сохраняет смысловую и богословскую весомость слова, не уточняя сверх текста личность этого лица.
- source_word: וּלְשָׁבֵי
  choice: и к тем ... кто отворачивается
  rationale: Причастие от שוב обозначает тех, кто поворачивает или возвращается. В сочетании с פשע речь идёт о нравственном обращении прочь от непокорности; глагольная передача сохраняет динамику еврейской формы.
- source_word: פֶשַׁע
  choice: непокорность
  rationale: Слово часто означает сознательное нарушение должного порядка, бунт или преступление против законной власти. «Непокорность» ясно передаёт направленность против Бога и меньше, чем «преступление», вызывает узко уголовные ассоциации.
- source_word: בְּיַעֲקֹב
  choice: в Иакове
  rationale: 'Предлог ב обозначает здесь сферу или среду: среди народа, названного Иаковом. Буквальная формулировка сохраняет заветное наименование и образ исходного текста.'
- source_word: נְאֻם יְהוָה
  choice: возвещает Господь
  rationale: Устойчивая пророческая формула передана современным и торжественным русским выражением; имя יהוה по принятой библейской традиции передано как «Господь».
theological_decisions:
- issue: Личность и роль Искупителя
  choice: Оставить обозначение «Искупитель» без прямого отождествления личности в основном тексте.
  alternative: Прямо назвать Искупителя Мессией либо самим Господом.
  rationale: Еврейский стих называет фигуру Искупителем, но не даёт здесь более точного отождествления. Перевод сохраняет эту открытость, не отрицая последующего мессианского прочтения.
- issue: Смысл שָׁבֵי פֶשַׁע
  choice: «к тем в Иакове, кто отворачивается от непокорности»
  alternative: «к раскаявшимся в Иакове»; «к тем в Иакове, кто возвращается от мятежа»
  rationale: Фраза говорит о нравственном повороте прочь от непокорности. Глагольная конструкция передаёт причастный характер формы и не вносит в текст более систематизированную терминологию покаяния.
- issue: Связь Искупителя с Сионом
  choice: 'Понять לְצִיּוֹן направительно: «к Сиону».'
  alternative: 'Понять предлог как выражение пользы или назначения: «для Сиона».'
  rationale: С глаголом בוא направительное значение наиболее естественно, однако грамматика допускает и оттенок пользы, поэтому альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис следует еврейскому параллелизму, но остаётся понятным обычному читателю. Слова «Искупитель» и «Господь» сохраняют сложившийся библейский регистр; «непокорность» выбрана вместо более канцелярского «преступление» и более политически окрашенного «мятеж».
