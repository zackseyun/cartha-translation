  text: עַל כֵּ֗ן רָחַ֤ק מִשְׁפָּט֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תַשִּׂיגֵ֖/נוּ צְדָקָ֑ה נְקַוֶּ֤ה לָ/אוֹר֙ וְ/הִנֵּה חֹ֔שֶׁךְ לִ/נְגֹה֖וֹת בָּ/אֲפֵל֥וֹת נְהַלֵּֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/009.yaml
  text: Therefore justice is far from us[a], and righteousness does not overtake us; we hope for light, but look—darkness; for brightness[c][b], but we walk in deep gloom.
translation:
  language: ru
  text: Поэтому правосудие далеко от нас[a], и праведность не настигает нас[b]. Мы надеемся на свет — но вот тьма; ждём сияния — но ходим в непроглядном мраке[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суд далеко от нас».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «праведность не достигает нас».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ходим в густой тьме».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В данном пророческом контексте слово обозначает справедливый суд и должный общественный порядок; «правосудие» сохраняет судебно-общественный оттенок и отличается от следующего צְדָקָה.
- source_word: רָחַק
  choice: далеко
  rationale: Перфект описывает сложившееся состояние; русская конструкция «далеко от нас» естественно передаёт его результативный смысл.
- source_word: צְדָקָה
  choice: праведность
  rationale: Так сохраняется различие между מִשְׁפָּט и צְדָקָה и не устраняется напряжение между правосудием и нравственной правотой.
- source_word: תַשִּׂיגֵנוּ
  choice: не настигает нас
  rationale: Форма от נשׂג передаёт образ того, что догоняет или настигает; выбранный глагол сохраняет эту яркую метафору.
- source_word: נְקַוֶּה
  choice: надеемся
  rationale: קוה объединяет ожидание и надежду; в плаче здесь особенно заметна надежда на избавление.
- source_word: אוֹר
  choice: свет
  rationale: Прямой эквивалент сохраняет как зрительный образ, так и подразумеваемые благополучие и избавление.
- source_word: וְהִנֵּה
  choice: но вот
  rationale: «Но вот» естественно для современного литературного русского и передаёт внезапное указание на реальность, противоположную ожиданию.
- source_word: חֹשֶׁךְ
  choice: тьма
  rationale: Ёмкий и литературно нейтральный эквивалент, сохраняющий физический и переносный смыслы.
- source_word: נְגֹהוֹת
  choice: сияние
  rationale: Существительное во множественном числе выражает яркий свет; русское собирательное «сияние» естественно передаёт этот образ.
- source_word: אֲפֵלוֹת
  choice: мрак
  rationale: Слово обозначает густую, глубокую тьму; «мрак» кратко и весомо передаёт образ, а альтернативный оттенок отмечен в сноске.
- source_word: נְהַלֵּךְ
  choice: ходим
  rationale: Буквальный образ хождения сохраняет смысл постоянного жизненного состояния, а не единичного движения.
theological_decisions:
- issue: Соотношение מִשְׁפָּט и צְדָקָה
  choice: Передать соответственно как «правосудие» и «праведность»
  alternative: «суд» и «справедливость» либо «справедливость» для обоих слов
  rationale: Различение терминов сохраняет поэтический параллелизм и одновременный плач об отсутствии справедливого суда и нравственной правоты, не сводя оба понятия к одному.
translation_notes:
  register: Современный литературный русский, понятный широкому читателю; синтаксический параллелизм и контрасты еврейской поэзии сохранены. «Но вот» избегает архаичности, а «настигает» удерживает исходную метафору.
