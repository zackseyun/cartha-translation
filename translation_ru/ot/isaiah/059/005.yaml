lexical_decisions:
- source_word: בֵּיצֵי צִפְעוֹנִי
  choice: яйца ядовитой змеи
  rationale: Сочетание обозначает яйца опасной ядовитой змеи. Обобщённый русский эквивалент понятен современному читателю и не создаёт ложной точности при неопределённости конкретного вида.
- source_word: בִּקֵּעוּ
  choice: высиживают
  rationale: Глагол буквально связан с раскалыванием или выведением из яйца; в данном контексте «высиживают яйца» естественно передаёт действие, ведущее к появлению змей, и сохраняет активную форму.
- source_word: קוּרֵי עַכָּבִישׁ יֶאֱרֹגוּ
  choice: ткут паутину
  rationale: «Ткут» близко основному значению יֶאֱרֹגוּ, а «паутину» естественно передаёт нити или сеть паука без ненужного повтора.
- source_word: הָאֹכֵל מִבֵּיצֵיהֶם יָמוּת
  choice: кто съест их яйцо, тот умрёт
  rationale: Артиклированное причастие имеет обобщающее значение. Русская конструкция «кто…, тот…» естественно сохраняет всеобщий характер и категоричность предупреждения.
- source_word: וְהַזּוּרֶה
  choice: а если яйцо раздавить
  rationale: Форма трудна для толкования, но в контексте, вероятнее всего, относится к раздавленному или разбитому яйцу. Условная конструкция по-русски ясно выражает действие, не меняя образ.
- source_word: תִּבָּקַע אֶפְעֶה
  choice: из него вылупится гадюка
  rationale: Фраза рисует появление ядовитой змеи из разбитого яйца. «Вылупится» естественно для контекста яиц, а «гадюка» кратко и наглядно обозначает ядовитую змею.
