  text: So they will fear the name of Yahweh from the west[a], and his glory from the rising of the sun; for he will come like a rushing river[c][b], driven by the breath of Yahweh.
translation:
  language: ru
  text: И с запада будут страшиться имени Яхве, и от восхода солнца[a] — его славы; ибо он придёт, словно стремительный поток,[b] гонимый дыханием Яхве.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с востока».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст этой части стиха труден. Субъект «придёт» не вполне ясен; возможно также: «ибо оно придёт, словно стремительный поток, гонимый Духом Яхве».'
    reason: alternative_reading
  - marker: c
    text: 'Традиционный вариант: «Когда враг придёт, как поток, Дух Яхве поднимет против него знамя». Такой перевод основан на ином разборе еврейского текста; слово «враг» в нём прямо не употреблено.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: будут бояться
  rationale: Глагол ירא может означать страх и благоговейное почитание. «Будут бояться» сохраняет силу и многозначность исходного выражения.
- source_word: מִמַּעֲרָב
  choice: на западе
  rationale: Буквально — «с запада». Русское «на западе» естественно обозначает людей западных земель, которые будут бояться имени Яхве.
- source_word: אֶת שֵׁם יְהוָה
  choice: имени Яхве
  rationale: Выражение обозначает явленную личность, власть и славу Бога; личное имя יהוה передано как «Яхве».
- source_word: וּמִמִּזְרַח שֶׁמֶשׁ
  choice: там, где восходит солнце
  rationale: Сохраняет поэтический образ буквального «от восхода солнца» и одновременно ясно указывает на восток.
- source_word: אֶת כְּבוֹדוֹ
  choice: его славы
  rationale: כבוד в данном контексте означает явленное величие, честь и великолепие; «слава» передаёт этот богословский и поэтический диапазон.
- source_word: כִּי יָבוֹא
  choice: потому что он придёт
  rationale: כִּי вводит основание сказанного, а יָבוֹא имеет форму 3-го лица мужского рода. Личное «он» даёт связное чтение, но неясность субъекта отмечена в сноске.
- source_word: כַנָּהָר צָר
  choice: как стремительный поток
  rationale: Сочетание трудно для толкования. «Стремительный поток» передаёт образ напирающей, мощной воды, не добавляя отсутствующего в еврейском тексте слова «враг».
- source_word: רוּחַ יְהוָה
  choice: дыханием Яхве
  rationale: רוּחַ может означать дыхание, ветер или Дух. В образе движимого потока «дыхание» конкретно и поэтично, а вариант «Дух Яхве» сохранён в сноске.
- source_word: נֹסְסָה בוֹ
  choice: гонимый
  rationale: Редкая форма и синтаксис заключительной фразы спорны. «Гонимый» передаёт понимание, согласно которому дыхание Яхве с силой движет поток; иные разборы указаны в сносках.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога, стоящее в еврейском тексте, и не заменяет его титулом.
- issue: Значение רוּחַ יְהוָה
  choice: дыхание Яхве
  alternative: Дух Яхве; ветер Яхве
  rationale: Конкретное значение «дыхание» согласуется с образом потока, приведённого в движение, но исходное слово намеренно допускает также значения «ветер» и «Дух».
- issue: Толкование трудной заключительной фразы
  choice: Яхве приходит как стремительный поток, гонимый его дыханием
  alternative: Враг приходит как поток, а Дух Яхве поднимает против него знамя
  rationale: В еврейском тексте нет явного слова «враг», а традиционный вариант требует иного синтаксического и лексического разбора. Основной текст следует более непосредственному чтению, не скрывая известную альтернативу.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским ритмом. Географический параллелизм передан естественно для русского читателя; трудность последней строки не сглажена, а существенные варианты вынесены в сноски. Местоимения, относящиеся к Богу, оставлены со строчной буквы как нейтральная современная издательская норма.
