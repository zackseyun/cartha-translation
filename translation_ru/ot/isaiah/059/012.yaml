  text: כִּֽי רַבּ֤וּ פְשָׁעֵ֨י/נוּ֙ נֶגְדֶּ֔/ךָ וְ/חַטֹּאותֵ֖י/נוּ עָ֣נְתָה בָּ֑/נוּ כִּֽי פְשָׁעֵ֣י/נוּ אִתָּ֔/נוּ וַ/עֲוֺנֹתֵ֖י/נוּ יְדַֽעֲנֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/012.yaml
  text: For our transgressions are many before you[a], and our sins testify against us; for our transgressions are with us, and we know our iniquities.
translation:
  language: ru
  text: Ибо многочисленны наши преступления пред Тобой, и наши грехи свидетельствуют против нас[a]; ибо наши преступления остаются с нами, и свои беззакония мы знаем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выступают свидетелями против нас»; буквальнее: «отвечают против нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Передаёт пояснительно-причинную функцию частицы в контексте исповедания и естественно звучит по-русски.
- source_word: רַבּוּ
  choice: многочисленны
  rationale: 'Сохраняет результативно-стативный смысл глагола רבה: преступления стали многочисленны и теперь многочисленны.'
- source_word: פְשָׁעֵינוּ
  choice: наши преступления
  rationale: Передаёт тяжёлый смысл нарушения и мятежа против власти, не сводя его к общему слову «грехи».
- source_word: נֶגְדֶּךָ
  choice: пред Тобой
  rationale: Сохраняет пространственно-судебный оттенок «перед, на виду у» и не смешивает выражение со следующим «против нас».
- source_word: וְחַטֹּאותֵינוּ
  choice: и наши грехи
  rationale: Естественный русский эквивалент обычного обозначения грехов; сохраняет отличие от פשע и עון.
- source_word: עָנְתָה בָּנוּ
  choice: свидетельствуют против нас
  rationale: 'Ясно передаёт судебный смысл идиомы: грехи выступают свидетелями против виновных. Формальное число еврейского сказуемого не воспроизводится как неестественное для русского языка.'
- source_word: פְשָׁעֵינוּ אִתָּנוּ
  choice: наши преступления — с нами
  rationale: Близко сохраняет образ продолжающегося присутствия преступлений, не добавляя толкования «остаются».
- source_word: וַעֲוֺנֹתֵינוּ
  choice: и беззакония наши
  rationale: Сохраняет отдельный тяжёлый термин для вины и нравственной порочности, отличая его от «преступлений» и «грехов».
- source_word: יְדַעֲנוּם
  choice: мы знаем
  rationale: 'Прямо передаёт ידע и объектный суффикс: говорящие осознают и знают свои беззакония; «признаём» было бы более толковательным.'
theological_decisions:
- issue: Передача трёх еврейских обозначений греха
  choice: 'Сохранены разные слова: «преступления», «грехи», «беззакония».'
  alternative: Передать все три одним словом «грехи».
  rationale: Накопление близких, но не тождественных терминов составляет риторику исповедания и подчёркивает разные стороны вины.
- issue: Смысл עָנְתָה בָּנוּ
  choice: «свидетельствуют против нас»
  alternative: «отвечают против нас» или «свидетельствуют в нас»
  rationale: Контекст поддерживает судебный образ обвинительного свидетельства, но буквальная идиома допускает менее истолкованную передачу, поэтому альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным исповедальным звучанием. Формы «пред Тобой» и постпозиция «беззакония наши» поддерживают библейское достоинство без избыточной архаизации. Маркер сноски поставлен при выражении עָנְתָה בָּנוּ, к которому относится лексическая альтернатива.
