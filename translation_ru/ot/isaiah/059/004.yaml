  terminology: «Справедливость» хорошо передаёт судебно-нравственную широту צֶדֶק; в сноске сохранён вариант «правда». «По правде» передаёт אֱמוּנָה без навязывания одного из возможных оттенков («истина», «честность», «верность»). «Пустота», «ложь», «беда» и «беззаконие» сохраняют смысловые различия תֹהוּ, שָׁוְא, עָמָל и אָוֶן.
