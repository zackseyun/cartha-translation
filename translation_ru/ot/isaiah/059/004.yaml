base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/004.yaml
  text: No one calls for righteousness[a], and no one pleads with faithfulness; trusting in emptiness and speaking falsehood[d][c][b], they conceive trouble and give birth to wickedness.
translation:
  language: ru
  text: Никто не взывает о справедливости[a], и никто не судится по правде[b]; они полагаются на пустоту[c] и говорят ложь; они зачинают беду и рождают беззаконие[d].
  philosophy: optimal-equivalence
  footnotes:
