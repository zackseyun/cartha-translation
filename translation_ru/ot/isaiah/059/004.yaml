    text: 'Или: «о правде».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не судится честно»; возможен также перевод: «не судит по истине».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на тщету», «на нечто бесплодное».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «зло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא בְצֶדֶק
  choice: призывает к правде
  rationale: Сочетание קרא с ב допускает значение призыва к чему-либо или в защиту чего-либо. «Правда» сохраняет нравственно-судебную широту צֶדֶק; в данном контексте возможно также «справедливость».
- source_word: נִשְׁפָּט בֶּאֱמוּנָה
  choice: ведёт тяжбу по истине
  rationale: Нифаль от שפט здесь имеет судебный оттенок и описывает участие в тяжбе. אֱמוּנָה обозначает истинность, надёжность и честность; «по истине» естественно передаёт эту характеристику, не устраняя неоднозначность оборота.
- source_word: בָּטוֹחַ עַל תֹּהוּ
  choice: полагаясь на пустоту
  rationale: בטח означает доверять или полагаться, а תֹהוּ — пустоту, тщету, нечто бесплодное или нереальное. Деепричастие сохраняет обстоятельственно-причастную связь с последующими действиями.
- source_word: וְדַבֶּר שָׁוְא
  choice: и говоря ложь
  rationale: שָׁוְא может обозначать ложь, обман или нечто пустое и ничтожное. «Ложь» ясно выражает нравственный смысл и естественно сочетается с глаголом речи.
- source_word: הָרוֹ עָמָל
  choice: они зачинают беду
  rationale: Сохранена метафора зачатия. עָמָל здесь указывает на беду, вред или злодейство; «беду» можно понять и как замысел зла, и как его пагубный плод.
- source_word: וְהוֹלֵיד אָוֶן
  choice: и рождают беззаконие
  rationale: Порода гифиль от ילד продолжает образ рождения. אָוֶן может означать беззаконие, зло или бедствие; «беззаконие» подчёркивает нравственный характер обличения.
theological_decisions:
- issue: Передача нравственно-судебных терминов в обличении общественной неправды
  choice: «правда» для צֶדֶק и «истина» для אֱמוּנָה
  alternative: «справедливость» и «честно» либо «верно»
  rationale: Стих имеет явный судебный фон, однако еврейские слова шире узкой юридической терминологии. Выбранные слова сохраняют одновременно нравственный и судебный смысл, не превращая текст в утверждение какой-либо частной доктрины.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Судебная лексика передана понятно для широкого читателя; метафора зачатия и рождения сохранена. Деепричастные формы отражают нефинитный характер средних еврейских конструкций и связывают ложную опору и речь с порождением зла.
