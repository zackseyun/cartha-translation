  source_fidelity: 'Первая и последняя смысловые пары переданы в целом верно: צֶדֶק уместно передавать как «справедливость/правда», а образ зачатия и рождения зла сохранён. Однако «вести тяжбу по истине» звучит по-русски неестественно и несколько чрезмерно закрепляет спорное судебное понимание נִשְׁפָּט. Более нейтральное «судиться по правде» сохраняет судебный контекст и формальную неоднозначность. Финитные глаголы в средней части яснее передают соотнесённость действий с теми же людьми, не меняя смысла нефинитных еврейских форм.'
