base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/017.yaml
  text: He put on righteousness like a breastplate[a], and a helmet of salvation on his head; he put on garments of vengeance for clothing[c][b], and wrapped himself in zeal as in a cloak.
translation:
  language: ru
  text: Он облёкся в праведность, как в броню[a], и возложил на голову шлем спасения[b]; он облёкся в одежды возмездия, как в одеяние, и окутался ревностью[c], как плащом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как в нагрудник»; еврейское слово обозначает доспех, защищающий туловище.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избавления» или «победы».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «рвением»; слово может обозначать горячую, ревностную преданность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְדָקָה
  choice: праведность
  rationale: Сохраняет основной нравственно-богословский смысл слова и в данном контексте обозначает праведность Бога, проявляющуюся в решительном действии; возможный оттенок справедливости не исключается.
- source_word: שִׁרְיָן
  choice: броня
  rationale: Естественное современное обозначение защитного доспеха для туловища; оно не сужает значение до конкретной формы нагрудника или кольчуги.
- source_word: כּוֹבַע
  choice: шлем
  rationale: Прямой и естественный эквивалент защитного головного убора в воинском образе.
- source_word: יְשׁוּעָה
  choice: спасение
  rationale: Передаёт обычное значение существительного и соответствует контексту спасительного вмешательства Бога, сохраняя при этом возможные оттенки избавления и победы в сноске.
- source_word: בִּגְדֵי נָקָם
  choice: одежды возмездия
  rationale: Буквально сохраняет возвышенный образ одеяний, характеризуемых Божьим карающим воздаянием.
- source_word: תִּלְבֹּשֶׁת
  choice: не выражено отдельным словом
  rationale: Существительное усиливает образ одежды после בִּגְדֵי נָקָם; буквальное «одежды возмездия как одеяние» по-русски тяжеловесно и избыточно, тогда как конструкция «облёкся в одежды» естественно передаёт функцию обоих слов.
- source_word: וַיַּעַט
  choice: укутался
  rationale: Передаёт значение оборачивания или окутывания себя одеждой и естественно сочетается с образом плаща.
- source_word: מְעִיל
  choice: плащ
  rationale: Современное и ясное обозначение верхней одежды, подходящее для сравнения.
- source_word: קִנְאָה
  choice: ревность
  rationale: 'Сохраняет многозначность еврейского слова: горячую, ревностную преданность и пыл, а также его более широкий оттенок ревности; контекст указывает на напряжённую решимость Бога.'
theological_decisions:
- issue: Образ Господа как божественного воина
  choice: Конкретные образы брони, шлема, одежд и плаща сохранены.
  alternative: Передать праведность, спасение, возмездие и ревность только как отвлечённые качества.
  rationale: Еврейский текст намеренно изображает Бога облачающимся для вмешательства; смягчение воинской метафоры ослабило бы её богословскую силу.
- issue: Значение קִנְאָה применительно к Богу
  choice: ревность
  alternative: рвение
  rationale: «Ревность» сохраняет напряжённость и заветный оттенок исходного слова, не сводя его к нейтральному усердию; пояснение предотвращает понимание как мелочной человеческой зависти.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным строем. Повтор «облёкся» сохраняет риторическую структуру еврейского текста; воинская и одежная образность передана без аллегорического истолкования.
