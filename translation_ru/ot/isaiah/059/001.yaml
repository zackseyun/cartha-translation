  - marker: b
    text: 'Буквально: «рука Яхве не укоротилась от спасения, и ухо Его не отяжелело от слышания».'
    reason: literal_rendering
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Частица привлекает внимание и вводит подчёркнутое утверждение; «вот» естественно сохраняет эту функцию в современном русском языке.
- source_word: קָצְרָה יַד
  choice: рука … не стала слишком короткой
  rationale: Сохранён конкретный образ руки как выражение силы и способности; оборот передаёт отсутствие неспособности спасти, не заменяя метафору отвлечённым словом «сила».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, непосредственно представленное тетраграмматоном в еврейском тексте.
- source_word: מֵהוֹשִׁיעַ
  choice: чтобы спасать
  rationale: Инфинитив с предлогом выражает здесь ограничение способности; «спасать» прямо передаёт значение глагола и допускает как избавление, так и более широкий богословский смысл.
- source_word: כָבְדָה אָזְנוֹ
  choice: ухо Его не отяжелело
  rationale: Сохранена еврейская метафора тяжёлого уха, то есть неспособности слышать; глагол «отяжелело» поддерживает поэтический параллелизм и остаётся понятным по контексту.
- source_word: מִשְּׁמוֹעַ
  choice: чтобы не слышать
  rationale: По-русски отрицательная конструкция с «настолько» естественно выражает подразумеваемую неспособность слышать, заключённую в еврейском обороте ограничения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя יְהוָה. Транслитерация «Яхве» сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Характер спасения в מֵהוֹשִׁיעַ
  choice: спасать
  alternative: избавлять
  rationale: «Спасать» сохраняет широкий диапазон еврейского глагола и не ограничивает его только избавлением от непосредственной беды.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены телесные метафоры «рука» и «ухо» и поэтический параллелизм; синтаксис слегка адаптирован ради ясности.
