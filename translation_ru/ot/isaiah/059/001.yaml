  yaml_path: translation/ot/isaiah/059/001.yaml
  text: Look[a], Yahweh’s hand is not too short to save[b], nor is his ear too dull to hear.
translation:
  language: ru
  text: Вот[a], рука Яхве не слишком коротка, чтобы спасать, и Его ухо не настолько тяжело, чтобы не слышать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поистине»; также возможно: «Воистину».'
