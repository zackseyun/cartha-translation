source:
  edition: WLC
  text: וַ/אֲנִ֗י זֹ֣את בְּרִיתִ֤/י אוֹתָ/ם֙ אָמַ֣ר יְהוָ֔ה רוּחִ/י֙ אֲשֶׁ֣ר עָלֶ֔י/ךָ וּ/דְבָרַ֖/י אֲשֶׁר שַׂ֣מְתִּי בְּ/פִ֑י/ךָ לֹֽא יָמ֡וּשׁוּ מִ/פִּי/ךָ֩ וּ/מִ/פִּ֨י זַרְעֲ/ךָ֜ וּ/מִ/פִּ֨י זֶ֤רַע זַרְעֲ/ךָ֙ אָמַ֣ר יְהוָ֔ה מֵ/עַתָּ֖ה וְ/עַד עוֹלָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/021.yaml
  text: 'And as for me[a], this is my covenant with them, says Yahweh: my Spirit that is upon you, and my words that I have put in your mouth, shall not depart from your mouth, or from the mouth of your offspring, or from the mouth of your offspring’s offspring, says Yahweh[b], from now and forever.'
translation:
  language: ru
  text: '«А что до Меня, вот Мой завет с ними, — говорит Яхве: Мой Дух, Который на тебе, и Мои слова, которые Я вложил в твои уста, не отступят от твоих уст, от уст твоего потомства[a] и от уст потомства твоего потомства, — говорит Яхве, — отныне и навеки[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твоего семени» и «семени твоего семени». Еврейское слово זֶרַע («семя») употреблено здесь как собирательное обозначение потомства.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с этого времени и вовеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А что до Меня
  rationale: Вынесенное вперёд местоимение подчёркивает говорящего и обозначает смысловой переход; русская конструкция сохраняет эту эмфазу.
- source_word: זֹאת בְּרִיתִי אוֹתָם
  choice: вот Мой завет с ними
  rationale: Сочетание בְּרִית с объектным местоимением естественно передаётся по-русски как «завет с ними».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: רוּחִי אֲשֶׁר עָלֶיךָ
  choice: Мой Дух, пребывающий на тебе
  rationale: В пророческом контексте רוּחַ означает Божий Дух; «на тебе» сохраняет значение предлога עַל, а «пребывающий» делает оборот естественным по-русски.
- source_word: וּדְבָרַי אֲשֶׁר שַׂמְתִּי בְּפִיךָ
  choice: и Мои слова, которые Я вложил в твои уста
  rationale: Сохранены множественное число «слова», образ вкладывания слов в уста и продолжающийся результат совершённого действия.
- source_word: לֹא יָמוּשׁוּ
  choice: не удалятся
  rationale: Глагол מוּשׁ здесь выражает прекращение пребывания или удаление; вариант сохраняет торжественную силу обещания и допускает общий субъект — Дух и слова.
- source_word: זַרְעֲךָ
  choice: твоё потомство
  rationale: Коллективное זֶרַע обозначает потомков как совокупность; «потомство» естественно передаёт это значение в современном русском языке.
- source_word: זֶרַע זַרְעֲךָ
  choice: потомство твоего потомства
  rationale: Буквально сохраняется последовательность поколений, выраженная цепочкой существительных.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: отныне и навеки
  rationale: Устойчиво и лаконично передаёт непрерывную длительность, начинающуюся в настоящем.
theological_decisions:
- issue: К кому относится местоимение второго лица единственного числа «ты»
  choice: Сохранено единственное число без уточнения адресата
  alternative: Пророк; олицетворённый Сион/Израиль; раб или искупленное сообщество, представленное как одно лицо
  rationale: Еврейский текст непосредственно не называет адресата. Уточнение сузило бы намеренно сохраняемую контекстом неоднозначность.
- issue: Связь Духа и слов с выражением «не удалятся от твоих уст»
  choice: 'Сохранён единый составной субъект: «Мой Дух… и Мои слова… не удалятся»'
  alternative: Синтаксически связать с устами только слова или истолковать действие Духа отдельно
  rationale: Множественная форма еврейского глагола грамматически соотносится с Духом и словами вместе. Необычный образ сохранён без богословского сглаживания.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы; личное имя יהוה передано как «Яхве». Повторы «уста», «потомство» и формулы «говорит Яхве» сохранены как значимые особенности оригинала.
