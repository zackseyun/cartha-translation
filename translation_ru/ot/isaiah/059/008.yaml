source:
  edition: WLC
  text: דֶּ֤רֶךְ שָׁלוֹם֙ לֹ֣א יָדָ֔עוּ וְ/אֵ֥ין מִשְׁפָּ֖ט בְּ/מַעְגְּלוֹתָ֑/ם נְתִיבֽוֹתֵי/הֶם֙ עִקְּשׁ֣וּ לָ/הֶ֔ם כֹּ֚ל דֹּרֵ֣ךְ בָּ֔/הּ לֹ֥א יָדַ֖ע שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/008.yaml
  text: They do not know the way of peace[a], and there is no justice in their paths; they have made their roads crooked for themselves[b]; everyone who walks in them does not know peace.
translation:
  language: ru
  text: Пути мира они не знают, и нет справедливости[a] на их дорогах; они сами сделали свои тропы кривыми; всякий, кто идёт по ним[b], не знает мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правосудия»; также возможно: «правого суда».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по ней». Единственное число, вероятно, собирательно указывает на описанный выше путь.'
    reason: source_form
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: путь
  rationale: Сохраняет обычную для еврейского текста метафору образа жизни и естественно звучит в выражении «путь мира».
- source_word: שָׁלוֹם
  choice: мир
  rationale: Передаёт основное значение в обеих частях стиха; слово также может подразумевать благополучие и целостность, но контекстуально и стилистически «мир» предпочтительнее.
- source_word: יָדְעוּ / יָדַע
  choice: знают / знает
  rationale: Сохраняет повтор исходного текста и допускает не только умственное знание, но и жизненный опыт.
- source_word: מִשְׁפָּט
  choice: справедливость
  rationale: В обличительном общественно-нравственном контексте обозначает справедливый порядок и правосудие; вариант не сужает смысл до отдельного судебного решения.
- source_word: מַעְגְּלוֹתָם
  choice: на их дорогах
  rationale: Передаёт образ наезженных путей или колей и при этом естественно звучит по-русски; отличается от соседних דֶּרֶךְ и נְתִיבוֹתֵיהֶם.
- source_word: נְתִיבוֹתֵיהֶם
  choice: свои тропы
  rationale: Сохраняет дорожную образность и лексическое разнообразие поэтического параллелизма.
- source_word: עִקְּשׁוּ
  choice: сделали ... кривыми
  rationale: Непосредственно передаёт значение искривления и сохраняет нравственный оттенок образа.
- source_word: לָהֶם
  choice: для себя
  rationale: Передаёт дательный элемент еврейского текста, который можно понимать как возвратный или указывающий, что эти пути устроены ими для себя.
- source_word: כֹּל דֹּרֵךְ בָּהּ
  choice: всякий, кто идёт по ним
  rationale: Естественная русская формулировка; множественное «ним» соотносится с упомянутыми дорогами и тропами, тогда как в еврейском стоит местоимение единственного числа.
theological_decisions:
- issue: Значение нравственно-правового термина מִשְׁפָּט
  choice: справедливость
  alternative: правосудие; правый суд
  rationale: «Справедливость» охватывает общественный и нравственный смысл пророческого обличения, не исключая судебного оттенка; альтернативы отмечены в сноске.
- issue: Число местоимения в בָּהּ после слов о дорогах и тропах
  choice: по ним
  alternative: по ней
  rationale: Еврейское местоимение имеет единственное число и, вероятно, собирательно отсылает ко всему описанному пути. В основном тексте множественное число яснее по-русски, а формальная особенность сохранена в сноске.
- issue: Повтор выражения «знать мир»
  choice: сохранить буквальный повтор
  alternative: не испытывает мира; не обретает благополучия
  rationale: Повтор обрамляет стих и сохраняет смысловую напряжённость между нравственным незнанием пути мира и отсутствием опыта мира.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены дорожная метафора, трёхчленное лексическое разнообразие («путь — дороги — тропы») и повтор «не знает мира»; синтаксис сделан ясным для обычного читателя без устранения неоднозначностей исходного текста.
