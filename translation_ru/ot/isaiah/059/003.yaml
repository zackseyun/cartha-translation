lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт причинно-пояснительную связь с предшествующим обвинением естественным для современного русского языка способом.
- source_word: כַפֵּיכֶם
  choice: ваши руки
  rationale: Хотя существительное конкретно обозначает ладони, в русском образ «руки осквернены кровью» звучит естественнее и сохраняет смысловую картину.
- source_word: נְגֹאֲלוּ
  choice: осквернены
  rationale: Передаёт не просто физическую запачканность, но нравственное загрязнение кровопролитием.
- source_word: בַדָּם
  choice: кровью
  rationale: Творительный падеж естественно выражает то, чем осквернены руки, сохраняя образ кровной вины.
- source_word: וְאֶצְבְּעוֹתֵיכֶם
  choice: и ваши пальцы
  rationale: Сохраняет конкретный телесный образ и поэтический параллелизм.
- source_word: בֶּעָוֹן
  choice: беззаконием
  rationale: Слово עָוֹן может обозначать беззаконие и вину; здесь оно характеризует нравственную порочность поступков и параллельно крови.
- source_word: שִׂפְתוֹתֵיכֶם דִּבְּרוּ
  choice: ваши губы говорят
  rationale: Настоящее время по-русски естественно передаёт актуальное обвинение; буквальный образ губ сохранён.
- source_word: שֶׁקֶר
  choice: ложь
  rationale: Ясное современное слово, охватывающее неправду и обманную речь.
- source_word: לְשׁוֹנְכֶם
  choice: ваш язык
  rationale: Сохраняет олицетворение органа речи и параллелизм с губами.
- source_word: עַוְלָה
  choice: несправедливость
  rationale: Передаёт общественно-нравственный смысл неправды и неправедного отношения, не сводя термин к общей порочности.
- source_word: תֶהְגֶּה
  choice: бормочет
  rationale: Сохраняет оттенок негромкого произнесения; возможен и более общий смысл «произносит», отмеченный в сноске.
theological_decisions:
- issue: Нравственная терминология пророческого обвинения
  choice: Сохранить различие между кровью, беззаконием, ложью и несправедливостью.
  alternative: Обобщить все понятия словами «зло» или «неправда».
  rationale: Еврейский текст намеренно наслаивает разные стороны обвинения — кровопролитие, нравственную испорченность, ложную речь и общественную неправду. Их разграничение сохраняет этическое и судебное напряжение текста.
translation_notes:
