base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/015.yaml
  text: So truth was missing[a], and whoever turned away from evil was plundered. Yahweh saw[b], and it was evil in his eyes that there was no justice.
translation:
  language: ru
  text: Истины не было[a], и всякий, кто отступает от зла, становится добычей[b]. Яхве увидел это, и злом было в Его глазах[c], что нет правосудия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истина отсутствовала»; возможен также оттенок «верности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «становится жертвой»; значение редкой еврейской формы также понимают как «подвергается разграблению».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и было злом в Его глазах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֱמֶת
  choice: истина
  rationale: В контексте общественного и судебного разложения слово обозначает истину как нравственную и общественную реальность; оттенок верности также возможен, но здесь менее вероятен.
- source_word: נֶעְדֶּרֶת
  choice: не стало
  rationale: Причастие нифаля передаёт отсутствие или исчезновение. Русское «не стало» естественно выражает утрату истины, не уточняя её степень сверх исходного текста.
- source_word: וְסָר מֵרָע
  choice: кто удаляется от зла
  rationale: Мужское причастие имеет обобщающее значение. Такая конструкция естественна по-русски и сохраняет активный отказ от зла.
- source_word: מִשְׁתּוֹלֵל
  choice: становится добычей
  rationale: Редкая форма допускает понимание «делается добычей», «становится жертвой» или «подвергается разграблению». Выбранный вариант сохраняет образ добычи и смысл виктимизации.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: было злом в Его глазах
  rationale: Сохранена выразительная еврейская идиома и содержащаяся в ней нравственная оценка, а не только эмоциональное неудовольствие.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В данном общественно-судебном контексте речь идёт о справедливом суде и надлежащем правовом порядке; «правосудие» передаёт это точнее общего «справедливость».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон; транслитерация сохраняет личное имя, не заменяя его титулом.
- issue: Обобщающее значение וְסָר
  choice: кто удаляется от зла
  alternative: удаляющийся от зла; тот, кто удаляется от зла
  rationale: Форма мужского рода единственного числа здесь обозначает любого человека с таким поведением, а не конкретного мужчину.
- issue: Нравственная оценка во фразе וַיֵּרַע בְּעֵינָיו
  choice: было злом в Его глазах
  alternative: это не понравилось Ему; это было неправильно в Его глазах
  rationale: Более буквальная формулировка сохраняет богословски значимую категорию зла и не сводит реакцию Бога к неудовольствию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Редкая форма מִשְׁתּוֹלֵל передана образно и без ложной определённости; альтернативный смысл отмечен в обосновании. Все сноски обозначены в основном тексте.
