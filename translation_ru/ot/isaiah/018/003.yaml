base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/003.yaml
  text: 'All you inhabitants of the world[a], and you dwellers on the earth: when a banner is raised on the mountains, you will see it; and when a trumpet is blown[b], you will hear it.'
translation:
  language: ru
  text: Все вы, жители мира и обитатели земли! Когда на горах поднимут знамя[a], вы увидите его, а когда протрубит шофар[b], вы услышите его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сигнальный знак» или «штандарт». Еврейское слово נֵס обозначает поднятый знак, видимый издалека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «труба» или «бараний рог». Шофар — рог, служивший, в частности, для подачи сигналов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: Все вы, жители мира
  rationale: Сохраняет всеобщий охват обращения и естественно передаёт конструкцию со значением жителей обитаемого мира.
- source_word: וְשֹׁכְנֵי אָרֶץ
  choice: и обитатели земли
  rationale: Передаёт параллельное, почти синонимичное выражение, сохраняя поэтическое варьирование лексики.
- source_word: כִּנְשֹׂא נֵס הָרִים
  choice: Когда на горах поднимут знамя
  rationale: Временное значение конструкции передано союзом «когда»; неопределённо-личная форма сохраняет отсутствие названного действующего лица. «Знамя» обозначает поднятый и видимый издали знак.
- source_word: תִּרְאוּ
  choice: вы увидите
  rationale: Сохраняет второе лицо множественного числа; объект ясен из непосредственно предшествующего упоминания знамени и не добавлен явно.
- source_word: וְכִתְקֹעַ שׁוֹפָר
  choice: когда протрубит шофар
  rationale: Сохраняет параллельную временную конструкцию. «Шофар» точно обозначает сигнальный рог и уже понятно современному русскому читателю; возможное пояснение дано в сноске.
- source_word: תִּשְׁמָעוּ
  choice: вы услышите
  rationale: Передаёт второе лицо множественного числа и сохраняет подразумеваемый объект, не добавляя местоимения, отсутствующего в еврейском тексте.
