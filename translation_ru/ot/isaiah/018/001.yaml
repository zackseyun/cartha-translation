lexical_decisions:
- source_word: הוֹי
  choice: О
  rationale: Междометие может выражать скорбь, угрозу или призыв. Здесь нейтральное восклицательное «О» сохраняет открытость тона и не предрешает значение «горе».
- source_word: אֶרֶץ
  choice: земля
  rationale: Речь идёт о географической области, поэтому «земля» естественнее, чем «страна» или «вся земля».
- source_word: צִלְצַל כְּנָפָיִם
  choice: шелестящих крыльев
  rationale: Трудное еврейское выражение передаёт звук, связанный с крыльями или чем-то крылоподобным. «Шелестящих крыльев» сохраняет конкретный образ, не сводя его однозначно к насекомым.
- source_word: אֲשֶׁר
  choice: что
  rationale: Относительная частица естественно передана современным русским «что» после обращения.
- source_word: מֵעֵבֶר לְנַהֲרֵי
  choice: за реками
  rationale: Сочетание обозначает местоположение по ту сторону рек; краткое «за реками» естественно и точно передаёт пространственный смысл.
- source_word: כּוּשׁ
  choice: Куш
  rationale: Сохранён древний топоним без отождествления с какой-либо современной страной.
theological_decisions:
- issue: Отождествление כּוּשׁ
  choice: Передать как древний топоним «Куш»
  alternative: Эфиопия; Нубия
  rationale: Текст называет историческую область, но не устанавливает её точных современных границ; транслитерация не вносит лишней геополитической конкретизации.
- issue: Тон междометия הוֹי
  choice: Нейтрально-восклицательное «О»
  alternative: «Горе»; «Увы»
  rationale: В данном стихе ещё не выражено недвусмысленное осуждение или оплакивание, поэтому перевод не должен преждевременно устранять смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной интонацией пророческого обращения. Сохранены образность и неоднозначность трудного еврейского оборота; топоним транслитерирован.
