  text: О, земля шумящих крыльев[a], лежащая за реками Куша[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земля жужжащих крыльев»; возможно также: «земля шелестящих крыльев». Еврейское выражение трудно для понимания и может передавать звук крыльев, насекомых или чего-либо крылоподобного в движении.'
