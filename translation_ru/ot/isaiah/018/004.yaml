  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֵלַ֔/י אשקוטה וְ/אַבִּ֣יטָה בִ/מְכוֹנִ֑/י כְּ/חֹ֥ם צַח֙ עֲלֵי א֔וֹר כְּ/עָ֥ב טַ֖ל בְּ/חֹ֥ם קָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/004.yaml
  text: 'For this is what Yahweh said to me: “I will remain quiet and look on from my dwelling place[a], like clear heat in sunshine[b], like a cloud of dew in the heat of harvest.”'
translation:
  language: ru
  text: 'Ибо так сказал мне Яхве: «Я буду пребывать в покое и смотреть из Моей обители[a], словно ясный зной при солнечном свете[b], словно облако росы в зной жатвы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я буду пребывать в покое и смотреть из Моего постоянного места».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «словно ясный зной над светом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога общепринятой русской транслитерацией, не заменяя его титулом.
- source_word: אֵלַי
  choice: мне
  rationale: Предлог אֶל с суффиксом первого лица после глагола речи естественно означает «мне»; выраженный в еврейском тексте адресат сохранён.
- source_word: אשקוטה
  choice: Я буду спокойно пребывать
  rationale: Форма от שׁקט выражает невозмутимую тишину и отсутствие вмешательства. Такой перевод естественен по-русски и не сводит смысл только к отдыху.
- source_word: וְאַבִּיטָה
  choice: и наблюдать
  rationale: Глагол נבט обозначает направленный взгляд; «наблюдать» передаёт продолжительное созерцание, не добавляя идеи безразличия или скрытой подготовки к суду.
- source_word: בִמְכוֹנִי
  choice: из Моей обители
  rationale: מָכוֹן — установленное, постоянное место, в данном контексте обитель. Русское «из» естественно обозначает точку наблюдения, хотя ב буквально может значить «в».
- source_word: כְּחֹם צַח
  choice: словно ясный зной
  rationale: חֹם означает жар, зной, а צַח — ясный, светлый, чистый. «Ясный зной» сохраняет необычность образа и не истолковывает его сверх текста.
- source_word: עֲלֵי אוֹר
  choice: при солнечном свете
  rationale: Буквально сочетание означает «над/на свету». Контекст описывает природное явление; «при солнечном свете» звучит естественно, а буквальная форма отмечена в сноске.
- source_word: כְּעָב טַל
  choice: словно облако росы
  rationale: 'Прямо сохраняет два конкретных элемента образа: עָב «облако» и טַל «роса», не заменяя их поясняющим толкованием вроде «туман».'
- source_word: בְּחֹם קָצִיר
  choice: в разгар жатвенного зноя
  rationale: Передаёт обстоятельственный смысл выражения и сельскохозяйственную обстановку. «В разгар» естественно связывает зной со временем жатвы.
theological_decisions:
- issue: Божественная неподвижность и наблюдение
  choice: Передать слова Яхве как спокойное пребывание и наблюдение без явного вмешательства.
  alternative: Понять их как покой либо как скрытую подготовку к суду.
  rationale: Еврейский текст изображает Яхве неподвижным наблюдателем и сопоставляет Его состояние с природными явлениями, но прямо не объясняет цели этой неподвижности. Перевод сохраняет напряжение и не приписывает Богу ни безразличия, ни уже начавшегося суда.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимение «Моей» внутри прямой речи написано с прописной буквы по устойчивой русской религиозной традиции. Необычные природные образы сохранены, а более буквальные варианты вынесены в сноски.
