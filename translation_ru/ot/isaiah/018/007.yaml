  text: בָּ/עֵת֩ הַ/הִ֨יא יֽוּבַל שַׁ֜י לַ/יהוָ֣ה צְבָא֗וֹת עַ֚ם מְמֻשָּׁ֣ךְ וּ/מוֹרָ֔ט וּ/מֵ/עַ֥ם נוֹרָ֖א מִן ה֣וּא וָ/הָ֑לְאָה גּ֣וֹי קַו קָ֣ו וּ/מְבוּסָ֗ה אֲשֶׁ֨ר בָּזְא֤וּ נְהָרִים֙ אַרְצ֔/וֹ אֶל מְק֛וֹם שֵׁם יְהוָ֥ה צְבָא֖וֹת הַר צִיּֽוֹן־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/007.yaml
  text: At that time a gift will be brought to the LORD of Armies from a people tall and smooth-skinned, from a people feared far and wide, a nation of command upon command and trampling, whose land rivers divide, to the place of the name of the LORD of Armies, Mount Zion.
translation:
  language: ru
  text: В то время Господу Воинств будет принесён дар от народа высокого и гладкокожего, от народа, которого боятся повсюду, — народа, «мера за мерой и попрание»[a], чью землю рассекают реки, — к месту имени Господа Воинств, на гору Сион.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение, буквально близкое к «мера за мерой и попрание», неясно; возможны и другие переводы. Оно характеризует народ, а не место, где он живёт.
    reason: Сочетание גּוֹי קַו קָו וּמְבוּסָה редкое и спорное. Примечание сохраняет лексическую неопределённость и уточняет синтаксическую связь, которую русский буквальный оборот может затемнить.
lexical_decisions:
- source_word: שַׁי
  choice: дар
  rationale: Слово обозначает дар или приношение, иногда дань. «Дар» сохраняет широкий смысл и не предрешает, добровольное это приношение или обязательная дань.
- source_word: יְהוָה צְבָאוֹת
  choice: Господь Воинств
  rationale: Передаёт традиционное замещение тетраграмматона словом «Господь» и сохраняет конкретный образ небесных или воинских множеств в צְבָאוֹת.
- source_word: מְמֻשָּׁךְ וּמוֹרָט
  choice: высокого и гладкокожего
  rationale: Контекстуально естественная характеристика внешности народа; «высокий» отражает возможный смысл «вытянутый», а «гладкокожий» — буквальный образ чего-то гладкого или отполированного.
- source_word: נוֹרָא מִן־הוּא וָהָלְאָה
  choice: которого боятся повсюду
  rationale: Идиоматично передаёт народ, внушающий страх от места своего пребывания и далее, то есть далеко вокруг.
- source_word: בָּזְאוּ נְהָרִים אַרְצוֹ
  choice: чью землю рассекают реки
  rationale: Сохраняет географический образ потоков, разделяющих или прорезающих страну, без более узкого толкования.
- source_word: מְקוֹם שֵׁם יְהוָה צְבָאוֹת
  choice: месту имени Господа Воинств
  rationale: Сохраняет необычную исходную формулу и связь Божьего имени с Сионом, не добавляя отсутствующего глагола «пребывает».
theological_decisions:
- issue: Направление и назначение дара
  choice: Господу Воинств принесут дар ... к месту имени Господа Воинств
  alternative: Народ будет принесён как дар Господу
  rationale: Синтаксис естественнее понимается как принесение дара от названного народа Господу; при этом формулировка не уточняет характера дара.
- issue: Божественное имя יהוה
  choice: Господь
  alternative: Яхве
  rationale: Общеупотребительная русская библейская передача соответствует древней традиции чтения и не вводит конфессионально маркированного произношения.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Синтаксические повторы исходного текста сохранены там, где они остаются понятными; особо неясное еврейское выражение передано близко к форме оригинала и снабжено сноской.
