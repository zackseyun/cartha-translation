base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/005.yaml
  text: For before the harvest[a], when the blossom is finished and the flower becomes a ripening grape, he will cut off the shoots with pruning knives[b], and he will remove and lop off the spreading branches.
translation:
  language: ru
  text: Ибо до жатвы[a], когда цветение завершится и цветок превратится в наливающуюся, ещё незрелую виноградину, он срежет побеги ножами для обрезки[b], а раскинувшиеся ветви удалит и отсечёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда цветение завершится и цветок станет незрелой виноградиной». Еврейский образ показывает переход от цветения к развивающемуся виноградному плоду перед жатвой.'
    reason: lexical_alternative
  - marker: b
    text: Еврейские названия частей лозы в этом стихе редки; их можно также передать как «веточки», «усики» или «стелющиеся ветви».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт причинно-пояснительную связь с предшествующим образом и сохраняет возвышенный, но понятный регистр.
- source_word: לִפְנֵי קָצִיר
  choice: ещё до жатвы
  rationale: Точно передаёт временную фразу; «ещё» естественно подчёркивает, что действие совершается до ожидаемого сбора плодов.
- source_word: כְּתָם פֶּרַח
  choice: когда цветение завершится
  rationale: Передаёт достижение конца стадии цветения, не уточняя сверх текста способ опадания или увядания цветков.
- source_word: וּבֹסֶר גֹּמֵל יִהְיֶה נִצָּה
  choice: и из цветка станет созревать незрелая ягода
  rationale: Сохраняет переход от цветка к развивающемуся, ещё незрелому виноградному плоду и напряжение между незрелостью и процессом созревания.
- source_word: וְכָרַת
  choice: Он срежет
  rationale: Пророческое изображение естественно передаётся будущим временем; прописная буква соотносит невыраженное подлежащее с говорящим Господом в ближайшем контексте.
- source_word: הַזַּלְזַלִּים
  choice: побеги
  rationale: Редкое слово обозначает молодую или пышную поросль лозы; «побеги» наиболее естественно в русском виноградарском образе.
- source_word: בַּמַּזְמֵרוֹת
  choice: садовыми ножами
  rationale: Обозначает орудия для обрезки; этот вариант конкретен, понятен и не навязывает современную конструкцию секатора.
- source_word: הַנְּטִישׁוֹת
  choice: раскинувшиеся ветви
  rationale: Редкое слово, вероятно, указывает на вытянувшуюся или широко разросшуюся часть лозы; перевод сохраняет эту общую пространственную характеристику.
- source_word: הֵסִיר הֵתַז
  choice: удалит и отсечёт
  rationale: Сохраняет два последовательных глагола и усиленный образ полного удаления разросшихся ветвей.
theological_decisions:
- issue: Подлежащее глаголов обрезки не названо непосредственно в стихе
  choice: «Он» с прописной буквы
  alternative: «он» со строчной буквы или безличная перестройка
  rationale: В ближайшем контексте Ис 18:4 говорит Господь, поэтому местоимение естественно относится к Нему; при этом перевод не добавляет имени, отсутствующего в данном стихе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сельскохозяйственный образ передан ясно, редкие названия лозы не конкретизированы сверх доступных данных; оба примечания отмечены в основном тексте.
