  rationale: Исправлены неестественная формулировка о развитии плода, слишком общее обозначение орудия обрезки, интерпретационная прописная буква местоимения и неточное альтернативное примечание. Сохранены временная последовательность, образ виноградной лозы, два глагола удаления и осторожность в передаче редких названий её частей.
