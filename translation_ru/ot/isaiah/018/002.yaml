base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/002.yaml
  text: 'who sends envoys by sea in vessels of papyrus over the waters: “Go, swift messengers, to a nation tall and smooth-skinned[a], to a people feared far and wide, a nation that measures out and tramples down[b], whose land rivers divide[c].”'
translation:
  language: ru
  text: 'который посылает послов по морю в папирусных судах по водам: «Ступайте, быстрые вестники, к народу высокому и гладкокожему[a], к народу, которого боятся повсюду, к народу, который отмеряет и попирает[b], чью землю рассекают реки[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вытянутому и отполированному»; вероятно, речь идёт о внешнем облике людей.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «народ — линия за линией и попирание»; возможно также: «народ, который отмеряет и попирает». Выражение неясно.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «чью землю реки грабят» либо «разоряют». Обычное значение глагола связано с разграблением; «рассекают» — контекстуальное географическое толкование.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: который посылает
  rationale: Артикль с причастием продолжает описание из предыдущего стиха; относительное придаточное естественно передаёт эту связь по-русски.
- source_word: צִירִים
  choice: послов
  rationale: Слово обозначает уполномоченных посланников, нередко в дипломатическом контексте; «послы» передаёт этот оттенок.
- source_word: בַּיָּם
  choice: по морю
  rationale: Предлог обозначает путь или среду передвижения; «по морю» — естественное русское выражение.
- source_word: וּבִכְלֵי גֹמֶא
  choice: в папирусных судах
  rationale: Выражение обозначает лёгкие суда, сделанные из папируса; «суда» сохраняет достоинство стиля и точность.
- source_word: עַל פְּנֵי מַיִם
  choice: по водам
  rationale: Кратко и естественно передаёт движение по поверхности воды без тяжеловесного буквализма.
- source_word: לְכוּ
  choice: Ступайте
  rationale: Повелительное множественного числа; «ступайте» уместно в прямом поручении и сохраняет литературный регистр.
- source_word: מַלְאָכִים קַלִּים
  choice: быстрые вестники
  rationale: קַלִּים здесь указывает на быстроту; «вестники» позволяет не повторять уже употреблённое «послы».
- source_word: גּוֹי מְמֻשָּׁךְ וּמוֹרָט
  choice: к народу высокому и гладкокожему
  rationale: 'Трудное сочетание, вероятно, описывает внешний облик: מְמֻשָּׁךְ — вытянутый или высокий, מוֹרָט — гладкий, отполированный; неопределённость отмечена в сноске.'
- source_word: עַם נוֹרָא מִן הוּא וָהָלְאָה
  choice: к народу, которого боятся повсюду
  rationale: Передаёт устрашающую славу народа и широкий охват выражения, не фиксируя спорный пространственный или временной нюанс.
- source_word: גּוֹי קַו קָו וּמְבוּסָה
  choice: к народу, который отмеряет и попирает
  rationale: Активное прочтение связывает повторённое קַו с мерной линией, а מְבוּסָה — с попиранием; поскольку выражение исключительно тёмное, альтернативы вынесены в сноску.
- source_word: אֲשֶׁר בָּזְאוּ נְהָרִים אַרְצוֹ
  choice: чью землю рассекают реки
  rationale: Контекстуальное географическое понимание изображает землю, прорезанную реками; обычное значение глагола, связанное с разграблением, сохранено в сноске.
