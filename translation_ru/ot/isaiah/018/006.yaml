lexical_decisions:
- source_word: יֵעָזְבוּ
  choice: оставят
  rationale: 'Нифаль указывает на пассивное действие: погибшие будут оставлены под открытым небом. Неопределённо-личная русская конструкция естественно передаёт этот пассив.'
- source_word: יַחְדָּו
  choice: всех
  rationale: Наречие буквально означает «вместе», но здесь подчёркивает совокупность оставленных; «всех их» естественно передаёт коллективный смысл.
- source_word: לְעֵיט הָרִים
  choice: горным хищным птицам
  rationale: עַיִט обозначает хищную птицу или птицу-падальщика; множественное число передаёт собирательное значение, а «горным» естественно выражает конструкцию «птицам гор».
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: и земным зверям
  rationale: В контексте оставленных тел בְּהֵמָה обозначает наземных зверей; формулировка сохраняет образ и параллелизм.
- source_word: וְקָץ
  choice: будут проводить ... лето
  rationale: Глагол здесь означает проводить лето. Развёрнутая конструкция ясна в современном русском и образует параллель с зимой.
- source_word: עָלָיו
  choice: на них
  rationale: Суффикс в еврейском стоит в единственном числе, но, вероятно, имеет собирательного референта — оставленных погибших или их тела; русское множественное число делает связь ясной.
- source_word: תֶּחֱרָף
  choice: будут проводить ... зиму
  rationale: Глагол означает проводить зиму; эллиптическое «и ... — зиму» сохраняет строгий сезонный параллелизм.
