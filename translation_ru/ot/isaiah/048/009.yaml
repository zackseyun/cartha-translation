source:
  edition: WLC
  text: לְמַ֤עַן שְׁמִ/י֙ אַאֲרִ֣יךְ אַפִּ֔/י וּ/תְהִלָּתִ֖/י אֶחֱטָם לָ֑/ךְ לְ/בִלְתִּ֖י הַכְרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/009.yaml
  text: For the sake of my name I delay my anger[a], and for my praise I restrain it for you[c][b], so as not to cut you off.
translation:
  language: ru
  text: Ради Моего имени Я медлю с гневом[a], и ради Моей хвалы сдерживаю его по отношению к тебе[b], чтобы не истребить тебя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «удлиняю Мой нос». Это еврейская идиома, означающая, что Бог медлит с гневом, то есть не даёт ему немедленно излиться.'
    reason: cultural_note
  - marker: b
    text: 'Или: «удерживаю его». Еврейский глагол может вызывать образ обуздывания или надевания намордника.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «отсечь тебя»; также возможно: «уничтожить тебя» или «искоренить тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שְׁמִי
  choice: Ради Моего имени
  rationale: Передаёт значение основания и цели; сохраняет библейское понятие «имени» как Божьей чести, репутации и явленного характера, не сводя его к одному из этих аспектов.
- source_word: אַאֲרִיךְ אַפִּי
  choice: Я медлю с гневом
  rationale: Естественно передаёт еврейскую идиому буквально «удлиню мой нос/гнев» и сохраняет оттенок намеренного откладывания гнева, а не только общее качество долготерпения.
- source_word: וּתְהִלָּתִי
  choice: и ради хвалы Мне
  rationale: Сохраняет значение существительного תְּהִלָּה — «хвала» — и указывает на хвалу, принадлежащую Богу или подобающую Ему, не заменяя её более широким понятием «слава».
- source_word: אֶחֱטָם
  choice: сдерживаю его
  rationale: Глагол выражает сдерживание и может вызывать образ надевания намордника или узды. Местоимение «его» естественно восполняет подразумеваемый объект — гнев из предыдущей части строки.
- source_word: לָךְ
  choice: ради тебя
  rationale: Передаёт направленность действия на благо адресата; в контексте речь идёт об Израиле, но это не уточняется в основном тексте.
- source_word: לְבִלְתִּי
  choice: чтобы не
  rationale: Ясно и естественно выражает цель или предполагаемый результат в современном русском языке.
- source_word: הַכְרִיתֶךָ
  choice: истребить тебя
  rationale: Передаёт каузативное значение כרת — устранить, уничтожить, отсечь от существования. Буквальный образ «отсечь» сохранён в примечании.
theological_decisions:
- issue: Основание, по которому Бог сдерживает суд
  choice: Бог сдерживает гнев ради Своего имени и хвалы, а сохранение адресата выступает целью или результатом этого сдерживания.
  alternative: Представить главным основанием пользу или заслуги Израиля либо заменить «хвалу» богословским обобщением «слава».
  rationale: Синтаксис стиха прямо связывает Божье сдерживание с Его именем и хвалой. Перевод сохраняет этот акцент, не развивая его в отдельную доктринальную систему.
- issue: Не названный прямо объект глагола אֶחֱטָם
  choice: Подразумеваемый объект — Божий гнев из предыдущей части; он передан местоимением «его».
  alternative: Оставить объект невыраженным или добавить более конкретное «ярость».
  rationale: В русском языке переходный глагол здесь требует ясного объекта. Местоимение сохраняет еврейский эллипсис и не добавляет нового содержания.
- issue: Соотношение цели и результата в לְבִלְתִּי
  choice: Переведено «чтобы не», без жёсткого разграничения между намерением и результатом.
  alternative: 'Передать исключительно как результат: «так что Я не истребляю тебя».'
  rationale: Еврейская конструкция допускает тесное сочетание цели и результата; русский оборот сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской религиозно-издательской практикой. Параллелизм двух оснований — «ради Моего имени» и «ради хвалы Мне» — сохранён.
