    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע אֵלַי
  choice: Слушай Меня
  rationale: Повелительная форма призывает не просто услышать звук, а внимательно слушать; русское «Слушай Меня» естественно передаёт эту силу.
- source_word: יַעֲקֹב וְיִשְׂרָאֵל
  choice: Иаков, и Израиль
  rationale: Сохранены два параллельных обращения к одному народу под обоими именами.
- source_word: מְקֹרָאִי
  choice: которого Я призвал
  rationale: Причастная форма с суффиксом первого лица обозначает Израиль как призванного Богом. Придаточное предложение ясно и естественно выражает это по-русски, не уточняя сверх текста цель призвания.
- source_word: אֲנִי הוּא
  choice: Я — Он
  rationale: Краткая формула божественного самоопределения передана формально близко и без поясняющего расширения; необычная лаконичность исходного выражения сохранена.
- source_word: רִאשׁוֹן
  choice: первый
  rationale: Субстантивированное определение в составе абсолютного утверждения естественно передаётся русским «первый».
- source_word: אַף
  choice: и
  rationale: Частица имеет присоединительно-усилительное значение; «и» сохраняет уравновешенный параллелизм фразы, тогда как «также» было бы тяжелее.
- source_word: אַחֲרוֹן
  choice: последний
  rationale: Выбор сохраняет прямой контраст и формальный параллелизм с «первый».
theological_decisions:
- issue: Передача формулы божественного самоопределения אֲנִי הוּא
  choice: Я — Он
  alternative: Я — Тот; Я — Тот же; это Я
  rationale: «Я — Он» сохраняет оба местоименных элемента и напряжённую краткость еврейской формулы, не превращая её в разъяснение и не привнося позднейших богословских формулировок.
- issue: Абсолютный смысл רִאשׁוֹן ... אַחֲרוֹן
  choice: Я первый, и Я последний
  alternative: Я — первый и последний
  rationale: Повторение «Я» следует еврейскому параллелизму и подчёркивает исключительное первенство и окончательность Бога, не раскрывая это утверждение посредством толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Синтаксический параллелизм и краткость божественной речи сохранены; двоеточие ясно вводит самоопределение говорящего.
