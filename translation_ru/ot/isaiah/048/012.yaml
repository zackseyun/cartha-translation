  text: 'Listen to me[a], Jacob, and Israel, whom I called: I am he; I am the first[b], and I am the last.'
translation:
  language: ru
  text: Слушай Меня, Иаков и Израиль, которого Я призвал:[a] это Я;[b] Я — первый, и Я — последний.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Израиль, Мой призванный».'
