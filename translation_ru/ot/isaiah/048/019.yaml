base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/019.yaml
  text: Your offspring would have been like the sand[a], and the descendants from your body like its grains[b]; their name would not have been cut off or destroyed from before me.
translation:
  language: ru
  text: И потомство твоё было бы как песок, и те, кто произошёл от тебя, — как его песчинки[a]; его имя[b] не было бы отсечено и уничтожено из Моего присутствия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «как его частицы» или «как его мелкие камешки»; редкое еврейское слово обозначает малые частицы песка.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его имя». Единственное число может представлять потомство как единый род; по смыслу возможно также «их имя» или «имя потомства».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: было бы
  rationale: Стих продолжает нереализованное условие Ис. 48:18; сослагательное наклонение естественно передаёт контрфактический смысл по-русски.
- source_word: כַחוֹל
  choice: как песок
  rationale: חוֹל обычно означает песок; сравнение сохраняет образ неисчислимого множества.
- source_word: זַרְעֶךָ
  choice: потомство твоё
  rationale: В данном контексте коллективное זֶרַע обозначает потомство, а не буквальное семя. Единственное число сохраняет собирательность исходного слова.
- source_word: וְצֶאֱצָאֵי מֵעֶיךָ
  choice: и те, кто произошёл от тебя
  rationale: Выражение буквально указывает на вышедших из внутренних частей тела, то есть на телесных потомков. Русская формулировка передаёт происхождение без архаического или физиологически резкого оборота.
- source_word: כִּמְעֹתָיו
  choice: как его песчинки
  rationale: Суффикс естественно относится к песку, а редкое существительное обозначает его малые частицы; «песчинки» ясно сохраняет образ.
- source_word: לֹא יִכָּרֵת
  choice: не было бы отсечено
  rationale: Nifal от כרת передаёт прекращение или отсечение имени и рода. Формулировка сохраняет исходную метафору и контрфактическую модальность.
- source_word: וְלֹא יִשָּׁמֵד
  choice: и уничтожено
  rationale: Nifal от שׁמד означает быть уничтоженным или истреблённым и усиливает предшествующее «отсечено».
- source_word: שְׁמוֹ
  choice: его имя
  rationale: Масоретский текст содержит местоименный суффикс мужского рода единственного числа. Он сохранён, чтобы не устранять олицетворение потомства как единого рода.
- source_word: מִלְּפָנָי
  choice: предо Мной
  rationale: Передаёт буквальное «из-перед Моего лица / от Моего присутствия» кратким и торжественным русским оборотом.
theological_decisions:
- issue: Контрфактический смысл в связи с предыдущим стихом
  choice: 'Весь стих передан как нереализованное следствие: «было бы… не было бы».'
  alternative: Простое прошедшее или будущее время без явной контрфактической модальности.
  rationale: Стих продолжает условно-желательное сетование, начатое в Ис. 48:18, и говорит о благословении, которое могло бы осуществиться при послушании.
- issue: Число и референт שְׁמוֹ
  choice: 'Сохранено единственное число мужского рода: «его имя».'
  alternative: «Их имя» либо «имя потомства».
  rationale: Так непосредственно отражена форма еврейского текста и сохранена возможность понимать потомство как олицетворённый единый род, не исключая коллективного смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены параллелизм, контрфактическая модальность и необычное единственное число «его имя»; телесная идиома מֵעֶיךָ передана естественно и без ненужной физиологической резкости.
