  - marker: c
    text: Слово может обозначать медь или бронзу; образ металлического лба передаёт твёрдую непреклонность и может подразумевать бесстыдство.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּעְתִּי כִּי
  choice: Поскольку Я знал, что
  rationale: Сочетание מִן с ידע передаёт основание, а כִּי вводит содержание знания. Такой перевод естественно сохраняет и причинную связь с предшествующим контекстом, и значение «знал, что».
- source_word: קָשֶׁה
  choice: упрям
  rationale: Буквальное значение — «твёрдый, жёсткий», но применительно к человеку в пророческом обличении слово обозначает упорное неповиновение.
- source_word: וְגִיד בַּרְזֶל עָרְפֶּךָ
  choice: что шея твоя — железная жила
  rationale: 'Сохранён конкретный образ оригинала: גִּיד означает жилу или сухожилие, а עֹרֶף — шею, особенно её заднюю часть.'
- source_word: וּמִצְחֲךָ נְחוּשָׁה
  choice: а лоб твой — бронза
  rationale: Сохранена именная метафора еврейского текста. נְחוּשָׁה обозначает медь или бронзу; «бронза» ясно передаёт образ твёрдости.
theological_decisions:
- issue: Метафорическое описание непокорности Израиля
  choice: 'Сохранить телесно-металлические образы: «шея твоя — железная жила» и «лоб твой — бронза».'
  alternative: 'Передать смысл толкованием: «ты несгибаем и бесстыден».'
  rationale: Оригинал обличает непокорность посредством ярких метафор, не формулируя их смысл отвлечённо. Их сохранение не устраняет намеренную образность и не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Заглавная буква в «Я» указывает на говорящего Бога по русской библейской издательской традиции. Повтор «что» делает синтаксическую связь ясной и не сглаживает параллельные характеристики.
