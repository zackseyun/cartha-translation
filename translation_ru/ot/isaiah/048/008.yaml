  text: גַּ֣ם לֹֽא שָׁמַ֗עְתָּ גַּ֚ם לֹ֣א יָדַ֔עְתָּ גַּ֕ם מֵ/אָ֖ז לֹא פִתְּחָ֣ה אָזְנֶ֑/ךָ כִּ֤י יָדַ֨עְתִּי֙ בָּג֣וֹד תִּבְגּ֔וֹד וּ/פֹשֵׁ֥עַ מִ/בֶּ֖טֶן קֹ֥רָא לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/008.yaml
  text: Indeed[a], you had not heard; indeed, you had not known; indeed, from of old your ear had not been opened. For I knew that you would surely deal treacherously[b], and that from the womb you would be called a transgressor.
translation:
  language: ru
  text: Да, ты не слышал, да, не знал, да, издавна ухо твоё не открывалось. Ведь Я знал, что ты непременно поступишь вероломно и что ещё от чрева матери[a] тебя называли мятежником[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с самого рождения». Буквально: «от чрева»; это выражение может обозначать самый ранний период существования.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нарушителем», «отступником». Еврейское слово обозначает того, кто восстаёт или преступает верность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: да
  rationale: Троекратное «да» передаёт эмфатическое накопление, не сводя גַּם к простому присоединительному «также».
- source_word: שָׁמַעְתָּ / יָדַעְתָּ
  choice: ты не слышал / не знал
  rationale: Пара совершенных форм с отрицанием передана параллельно; русское прошедшее время естественно выражает предшествующее незнание без тяжеловесного уточнения.
- source_word: מֵאָז
  choice: издавна
  rationale: Слово обозначает давнее время и сохраняет временную глубину исходного выражения.
- source_word: פִתְּחָה אָזְנֶךָ
  choice: ухо твоё не было открыто
  rationale: 'Сохранён образ открытого уха и формальная неоднозначность выражения: речь может идти как о сообщении, так и о восприимчивости.'
- source_word: בָּגוֹד תִּבְגּוֹד
  choice: ты непременно поступишь вероломно
  rationale: Сочетание инфинитива абсолютного с личной глагольной формой усиливает утверждение; «непременно» передаёт эту эмфазу, а «поступишь вероломно» — смысл בגד.
- source_word: מִבֶּטֶן
  choice: ещё от чрева матери
  rationale: Сохранён яркий образ исходного текста и его значение «с самого раннего начала»; слово «матери» естественно проясняет по-русски подразумеваемое чрево.
- source_word: פֹשֵׁעַ
  choice: мятежник
  rationale: Причастие употреблено субстантивно и обозначает того, кто восстаёт, преступает установленную верность; «мятежник» сохраняет активный оттенок неповиновения.
- source_word: קֹרָא לָךְ
  choice: тебя зовут
  rationale: Конструкция выражает устойчивое наименование или характеристику. Настоящее время по-русски естественно передаёт значение закрепившегося обозначения, не исключая отнесённости к раннему существованию Израиля.
theological_decisions:
- issue: Описывает ли «от чрева матери» буквальную дородовую вину или постоянное неповиновение Израиля с самого начала
  choice: Сохранить буквальный образ, не превращая его в отдельное догматическое утверждение
  alternative: 'Передать только идиоматически: «с самого рождения»'
  rationale: Пророческая речь обращена к Израилю как к народу и характеризует его историю с самого раннего начала. Буквальный образ оставлен, а его возможная идиоматическая сила отмечена в сноске.
- issue: Оттенок פֹשֵׁעַ
  choice: мятежник
  alternative: преступник; отступник; нарушитель
  rationale: «Мятежник» передаёт активное восстание и нарушение верности, не ограничивая слово юридическим преступлением и не внося более узкого конфессионального смысла «отступничества».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Троекратное «да» сохраняет риторический напор, а образы «открытого уха» и «чрева матери» оставлены без излишнего истолкования.
