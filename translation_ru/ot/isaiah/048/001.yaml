  text: שִׁמְעוּ זֹ֣את בֵּֽית יַעֲקֹ֗ב הַ/נִּקְרָאִים֙ בְּ/שֵׁ֣ם יִשְׂרָאֵ֔ל וּ/מִ/מֵּ֥י יְהוּדָ֖ה יָצָ֑אוּ הַֽ/נִּשְׁבָּעִ֣ים בְּ/שֵׁ֣ם יְהוָ֗ה וּ/בֵ/אלֹהֵ֤י יִשְׂרָאֵל֙ יַזְכִּ֔ירוּ לֹ֥א בֶ/אֱמֶ֖ת וְ/לֹ֥א בִ/צְדָקָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/001.yaml
  text: Hear this[a], house of Jacob, you who are called by the name of Israel and who came out from the waters of Judah, who swear by the name of Yahweh and invoke the God of Israel, but not in truth or in righteousness.
translation:
  language: ru
  text: Слушайте это, дом Иакова, вы, которые названы именем Израиля и вышли из вод Иуды[a], клянущиеся именем Яхве и призывающие Бога Израиля, но не в истине и не в праведности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из вод Иуды»; вероятно, имеется в виду происхождение от Иуды, его потомство или образ «из чресл Иуды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: Слушайте это
  rationale: Форма повелительного наклонения во множественном числе передаёт прямой пророческий призыв; «слушайте» естественно и точно выражает требование внимать.
- source_word: בֵּית יַעֲקֹב
  choice: дом Иакова
  rationale: Сохранён устойчивый библейский образ, обозначающий народ — потомков Иакова, и его межтекстовые связи.
- source_word: הַנִּקְרָאִים בְּשֵׁם יִשְׂרָאֵל
  choice: вы, называющиеся именем Израиля
  rationale: Передаёт пассивное причастие и конструкцию «именем Израиля», сохраняя оттенок формального самообозначения, важный для последующего обличения.
- source_word: וּמִמֵּי יְהוּדָה יָצָאוּ
  choice: и происшедшие из вод Иуды
  rationale: В основном тексте сохранён необычный буквальный образ «вод Иуды»; вероятный смысл происхождения или потомства пояснён в сноске.
- source_word: הַנִּשְׁבָּעִים בְּשֵׁם יְהוָה
  choice: клянущиеся именем Яхве
  rationale: Причастная конструкция обозначает принесение клятвы с призыванием Божьего имени; русский оборот естественен и близок к форме оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: וּבֵאלֹהֵי יִשְׂרָאֵל יַזְכִּירוּ
  choice: и призывающие Бога Израиля
  rationale: В контексте клятвы и религиозного исповедания каузативная форма זכר означает не простое упоминание, а обращение к Богу с призыванием его имени.
- source_word: לֹא בֶאֱמֶת
  choice: но не в истине
  rationale: 'Сохранено компактное выражение оригинала и его смысловой диапазон: истинность, искренность и верность.'
- source_word: וְלֹא בִצְדָקָה
  choice: и не в праведности
  rationale: «Праведность» передаёт нравственно-религиозный смысл צְדָקָה, не исключая оттенка справедливости.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблено личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Толкование выражения מִמֵּי יְהוּדָה
  choice: Сохранить в тексте образ «из вод Иуды» и пояснить его в сноске
  alternative: из чресл Иуды; потомки Иуды; происшедшие от Иуды
  rationale: Вероятно, это поэтический или эвфемистический образ физического происхождения, однако буквальная метафора необычна и допускает осторожность. Сноска обеспечивает понятность без устранения образа оригинала.
- issue: Смысл אֱמֶת и צְדָקָה в заключительном обличении
  choice: в истине и в праведности
  alternative: искренне и справедливо; верно и праведно
  rationale: Существительные сохранены как нравственно-богословские категории, чтобы не сужать אֱמֶת только до искренности, а צְדָקָה — только до законной справедливости.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический ряд причастий сохраняет нарастающее обращение оригинала, а союз «но» ясно вводит заключительное обличение. Архаизмы сведены к минимуму; библейский образ «дом Иакова» и буквальная метафора «вод Иуды» сохранены.
