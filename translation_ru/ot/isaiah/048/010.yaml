lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт эмфатический призыв к вниманию и сохраняет возвышенный пророческий регистр, оставаясь естественным для современного русского языка.
- source_word: צְרַפְתִּיךָ
  choice: Я очистил тебя
  rationale: Глагол צרף обозначает очищение металла плавкой. «Очистил» естественно передаёт результат процесса, а образ металлургической очистки поддерживается последующими словами о серебре и горниле.
- source_word: וְלֹא בְכָסֶף
  choice: но не так, как серебро
  rationale: Значение предлога בְּ в этой трудной фразе неоднозначно. В контексте очистки металла сравнительное понимание наиболее связно и естественно по-русски.
- source_word: בְּחַרְתִּיךָ
  choice: Я избрал тебя
  rationale: Обычное и непосредственно засвидетельствованное значение глагола בחר — «избирать». Контекст допускает понимание «испытал», однако его следует сохранить как альтернативу в сноске, а не подменять им основное лексическое значение.
- source_word: בְּכוּר
  choice: в горниле
  rationale: כּוּר — печь или горнило для плавки и очистки металла. «Горнило» точно сохраняет метафору и соответствует возвышенному регистру.
- source_word: עֹנִי
  choice: страдания
  rationale: Существительное обозначает бедствие, угнетение или страдание. В данном контексте «страдание» достаточно широко передаёт тяжёлое испытание народа.
theological_decisions:
- issue: Значение בְּחַרְתִּיךָ в контексте металлургической метафоры
  choice: Я избрал тебя
  alternative: Я испытал тебя
  rationale: Основной текст следует обычному значению בחר и не устраняет мотив избрания лишь из-за окружающей метафоры. Вместе с тем контекст очищения в горниле создаёт реальную лексико-контекстуальную напряжённость, поэтому чтение «испытал» отмечено в сноске.
- issue: Характер очищения в выражении וְלֹא בְכָסֶף
  choice: не так, как серебро
  alternative: не с серебром; не ради серебра
  rationale: Сравнительное прочтение лучше всего согласуется с образом очистки и не предполагает, будто Израиль буквально плавился вместе с серебром. Трудность еврейского предлога открыто отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Вот» и «горнило» сохраняют достоинство и образность текста; синтаксис остаётся ясным для широкого читателя.
