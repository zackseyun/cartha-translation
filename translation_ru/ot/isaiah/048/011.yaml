base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/011.yaml
  text: For my own sake[a], for my own sake, I will act; for how can it be profaned? And my glory I will not give to another.
translation:
  language: ru
  text: Ради Себя, ради Себя Я буду действовать, ибо как может быть осквернено?[a] И Моей славы другому Я не отдам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо как может быть осквернено Моё имя?» В еврейском тексте подлежащее не выражено.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעֲנִי
  choice: ради Себя
  rationale: Сочетание לְ с מַעַן выражает основание или побуждение; повтор усиливает мысль. «Ради Себя» естественно передаёт возвратный и эмфатический смысл.
- source_word: אֶעֱשֶׂה
  choice: Я буду действовать
  rationale: У עשה здесь нет выраженного дополнения. «Буду действовать» сохраняет неопределённость и передаёт решительное вмешательство, не добавляя конкретного объекта действия.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит обоснование предыдущего утверждения; «ведь» естественно передаёт пояснительно-причинную связь в современном русском языке.
- source_word: אֵיךְ
  choice: как ... может
  rationale: Вопросительное слово вводит риторический вопрос; конструкция с «может» передаёт его недоумённо-отрицательную силу.
- source_word: יֵחָל
  choice: это может быть осквернено
  rationale: Нифаль глагола חלל означает «быть осквернённым». Референт подлежащего в еврейском тексте не назван; местоимение «это» сохраняет недосказанность приемлемым для русского способом.
- source_word: וּכְבוֹדִי
  choice: И славы Моей
  rationale: כָּבוֹד означает «слава, честь»; в контексте Божьего самооткровения «слава» точнее сохраняет смысл и устойчивую библейскую лексику.
- source_word: לְאַחֵר
  choice: другому
  rationale: Кратко обозначает иную сторону, не уточняя без основания, идёт ли речь об идоле, божестве или ином претенденте.
- source_word: אֶתֵּן
  choice: Я ... не отдам
  rationale: נתן обычно означает «давать». В русском сочетание «славы не отдам» звучит естественно и передаёт отказ уступить или передать её другому.
theological_decisions:
- issue: Не названное подлежащее в риторическом вопросе יֵחָל
  choice: 'Не вводить «Моё имя» в основной текст: «как это может быть осквернено?»'
  alternative: «как может быть осквернено Моё имя?» или «как Я могу быть осквернён?»
  rationale: В еврейском тексте референт не выражен. «Моё имя» правдоподобно по контексту, но его включение устранило бы подлинную неоднозначность; вероятное толкование вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной библейской интонацией. Повтор «ради Себя» сохранён ради исходного акцента; прописные буквы в местоимениях поддерживают традиционный русский религиозный регистр.
