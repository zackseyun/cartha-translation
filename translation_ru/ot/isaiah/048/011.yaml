  to: Ради Себя, ради Себя Я буду действовать, ибо как может быть осквернено?[a] И Моей славы другому Я не отдам.
  rationale: Убрано указательное «это», чтобы сохранить невыраженный референт исходного еврейского риторического вопроса. В последней строке сохранён естественный для русского родительный падеж при отрицании и исходный акцент на «Моей славе»; перестановка «Моей славы» в начало подчёркивает притяжательное слово и не меняет смысла. Союз «ибо» поддерживает высокий, но современно понятный библейский регистр.
