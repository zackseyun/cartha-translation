base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/002.yaml
  text: For they are called from the holy city[a], and they lean on the God of Israel; Yahweh of hosts is his name.
translation:
  language: ru
  text: Ибо они названы по святому городу[a] и опираются на Бога Израиля; Яхве Воинств — его имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они происходят из святого города». Еврейская конструкция может указывать как на именование по святому городу, так и на происхождение из него.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим обвинением и естественно звучит в современном русском языке.
- source_word: מֵעִיר הַקֹּדֶשׁ נִקְרָאוּ
  choice: их именуют по святому городу
  rationale: Сохраняет пассивную форму נִקְרָאוּ и передаёт возможный смысл обозначения или идентичности, связанной со святым городом; буквальный оттенок происхождения с מִן отмечен в сноске.
- source_word: וְעַל אֱלֹהֵי יִשְׂרָאֵל נִסְמָכוּ
  choice: и они опираются на Бога Израиля
  rationale: «Опираются» сохраняет образ глагола סמך — искать опору и полагаться на кого-либо — вместе с возможной иронией контекста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет широкий смысл традиционного библейского титула, не ограничивая его только земными армиями.
- source_word: שְׁמוֹ
  choice: имя Его
  rationale: Передаёт еврейскую формулу именования в краткой и торжественной русской форме.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; «Яхве» непосредственно его передаёт, не подменяя титулом.
- issue: Связь народа со святым городом
  choice: их именуют по святому городу
  alternative: они именуются происходящими из святого города
  rationale: Конструкция допускает оттенок как обозначения через город, так и происхождения из него. Основной текст передаёт заявленную идентичность, а вариант происхождения сохранён в сноске.
- issue: Характер упования на Бога Израиля
  choice: опираются
  alternative: полагаются
  rationale: Метафорическое «опираются» ближе к образу סמך и не снимает напряжения между исповедуемой опорой на Бога и обличением в окружающем контексте.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем пророческой речи. Сохранены метафора опоры, божественное имя и формула титула; неоднозначность связи со святым городом вынесена в сноску.
