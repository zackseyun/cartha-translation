  text: אַף יָדִ/י֙ יָ֣סְדָה אֶ֔רֶץ וִֽ/ימִינִ֖/י טִפְּחָ֣ה שָׁמָ֑יִם קֹרֵ֥א אֲנִ֛י אֲלֵי/הֶ֖ם יַעַמְד֥וּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/013.yaml
  text: Indeed[a], my hand founded the earth, and my right hand spread out the heavens; when I call to them, they stand together.
translation:
  language: ru
  text: Да, Моя рука основала землю, и Моя правая рука распростёрла небеса[a]. Я призываю их — и они встают вместе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «растянула небеса»; возможно также: «измерила небеса пядью».'
    reason: Лексическое значение редкого глагола טפח допускает оттенки простирания, растягивания или измерения рукой.
lexical_decisions:
- source_word: אַף
  choice: Да
  rationale: Здесь частица усиливает торжественное утверждение. «Да» естественно передаёт это подтверждающее усиление по-русски, не добавляя нового смысла.
- source_word: יָדִי
  choice: Моя рука
  rationale: Буквальный перевод сохраняет антропоморфный образ непосредственного творческого действия Бога.
- source_word: יָסְדָה
  choice: основала
  rationale: Глагол יסד обозначает закладку основания; «основала землю» кратко и сохраняет образ мироздания как возведённого строения.
- source_word: אֶרֶץ
  choice: землю
  rationale: В контексте сотворения мира речь идёт о земле как части космоса, а не об отдельной стране.
- source_word: וִימִינִי
  choice: и Моя правая рука
  rationale: Сохраняются параллелизм с «Моя рука» и конкретный образ силы и действия.
- source_word: טִפְּחָה
  choice: распростёрла
  rationale: Редкий глагол в данном контексте описывает действие правой руки по отношению к небесам. «Распростёрла» естественно передаёт их развёртывание, а возможные оттенки растягивания или измерения пядью отмечены в сноске.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Традиционное русское множественное число точно соответствует форме и уместно в космическом контексте.
- source_word: קֹרֵא אֲנִי אֲלֵיהֶם
  choice: Я призываю их
  rationale: Причастие с явно выраженным местоимением создаёт живое настоящее действие. Самостоятельная фраза сохраняет синтаксическую открытость еврейского текста и не навязывает исключительно временное прочтение.
- source_word: יַעַמְדוּ
  choice: предстают
  rationale: עמד буквально означает «стоять, встать» и здесь изображает землю и небеса, являющиеся по Божьему призыву. «Предстают» естественно передаёт отклик на властный зов.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Передаёт основное значение наречия и сохраняет образ единого отклика земли и небес.
theological_decisions:
- issue: Антропоморфный язык Божьего творческого действия
  choice: Сохранить конкретные образы «Моей руки» и «Моей правой руки».
  alternative: 'Передать их отвлечённо: «Моя сила основала землю, и Моё могущество распростёрло небеса».'
  rationale: Еврейский текст прямо использует телесную образность. Её не следует заменять истолкованием через абстрактные понятия силы и могущества.
- issue: Отклик земли и небес на Божий призыв
  choice: Сохранить олицетворяющее «Я призываю их — и они предстают вместе».
  alternative: 'Разъяснить образ: «по Моему повелению они существуют в установленном порядке».'
  rationale: Исходный текст изображает творение как непосредственно откликающееся на зов Бога; отвлечённый пересказ устранил бы этот поэтический и богословский образ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, соответствующим пророческой поэзии строем. Заглавные буквы в местоимениях, относящихся к Богу, употреблены в соответствии с принятой русской библейской издательской практикой. Тире передаёт быстрый и властный отклик творения, не превращая первую часть фразы в однозначно временное придаточное.
