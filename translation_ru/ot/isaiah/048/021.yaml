base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/021.yaml
  text: They did not thirst when he led them through the deserts[a]; he made water flow for them from the rock; he split the rock[b], and water gushed out.
translation:
  language: ru
  text: Они не испытывали жажды, когда Он вёл их через пустыни[a]; Он сделал так, что из скалы для них потекла вода; Он рассёк скалу[b] — и хлынула вода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по пустыням»; или: «через безводные места».'
    reason: lexical_alternative
  - marker: b
    text: Этот стих перекликается с рассказами о том, как Господь дал народу воду из скалы в пустыне (например, Исх. 17:6; Чис. 20:11).
    reason: cross_reference
lexical_decisions:
- source_word: צָמְאוּ
  choice: томились жаждой
  rationale: Глагольное выражение передаёт переживание жажды и естественно звучит в русском поэтическом повествовании; отрицание сохраняется непосредственно.
- source_word: בָּחֳרָבוֹת
  choice: через безводные места
  rationale: Форма во множественном числе обозначает сухие, опустошённые области. Предлог «через» естественно сочетается с последующим глаголом движения, не сужая значение до одного типа местности.
- source_word: הוֹלִיכָם
  choice: Он вёл их
  rationale: Порода hифиль от הלך имеет каузативное значение «вести, проводить»; русский вариант краток, ясен и естественен.
- source_word: הִזִּיל
  choice: Он извёл … воду
  rationale: Каузатив от נזל означает «заставить течь». «Извёл воду из скалы» сохраняет причинное значение и возвышенный, но понятный библейский регистр.
- source_word: מִצּוּר
  choice: из скалы
  rationale: Существительное указывает на скалу как источник воды. В русском отсутствие артикля не позволяет формально различить «скалу» и «некую скалу», поэтому контекстуальная определённость остаётся неявной.
- source_word: וַיִּבְקַע צוּר
  choice: рассёк скалу
  rationale: בקע означает раскалывать или рассекать. «Рассёк» точно передаёт конкретный образ и соответствует литературному регистру без архаической тяжеловесности.
- source_word: וַיָּזֻבוּ מָיִם
  choice: хлынула вода
  rationale: Глагол זוב обозначает истечение; в данном контексте «хлынула» ярко и естественно передаёт обильный выход воды. Русское единственное число согласуется с собирательным «вода».
theological_decisions:
- issue: Подразумеваемый субъект в третьем лице единственного числа
  choice: «Он» — Господь, названный в предшествующем контексте
  alternative: Оставить субъект безличным либо вставить имя «Господь»
  rationale: В еврейском тексте субъект выражен глагольными формами без повторного существительного. Местоимение сохраняет связь с контекстом и не добавляет имени, отсутствующего в самом стихе.
- issue: Отсылка к дарованию воды из скалы в пустыне
  choice: Сохранить историко-поэтическую аллюзию без расширения основного текста
  alternative: Явно истолковать событие типологически или сакраментально
  rationale: Образ ясно перекликается с повествованиями Исх 17:6 и Чис 20:11, но сам стих не формулирует дальнейшего богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Заглавное «Он» помогает обозначить божественного референта, не вставляя в текст имя «Господь». Точка с запятой и тире сохраняют последовательность и нарастание образов.
