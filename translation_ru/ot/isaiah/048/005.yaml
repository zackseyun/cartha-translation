source:
  edition: WLC
  text: וָ/אַגִּ֤יד לְ/ךָ֙ מֵ/אָ֔ז בְּ/טֶ֥רֶם תָּב֖וֹא הִשְׁמַעְתִּ֑י/ךָ פֶּן תֹּאמַר֙ עָצְבִּ֣/י עָשָׂ֔/ם וּ/פִסְלִ֥/י וְ/נִסְכִּ֖/י צִוָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/005.yaml
  text: I declared it to you long ago[a]; before it came to pass I made you hear it, lest you say, ‘My idol did them[b], and my carved image and my cast image commanded them.’
translation:
  language: ru
  text: 'Я возвестил тебе об этом издавна[a]; прежде чем это произошло, я дал тебе услышать об этом, чтобы ты не сказал: «Мой идол совершил всё это, а моё резное изваяние и моё литое изваяние[b] повелели им совершиться».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с тех пор».'
    reason: lexical_alternative
  - marker: b
    text: 'Также: «литое изображение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַגִּיד
  choice: Я возвестил
  rationale: Hифиль глагола נגד означает «объявить, возвестить, дать знать». «Возвестил» сохраняет возвышенный пророческий тон и остаётся понятным современному читателю.
- source_word: מֵאָז
  choice: издавна
  rationale: Выражение указывает на давнее предварительное возвещение. «Издавна» естественно передаёт временную удалённость, не сводя смысл лишь к непосредственному предшествованию событию.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: прежде чем это произошло
  rationale: 'Буквально: «прежде чем оно пришло». В контексте речь идёт о наступлении предсказанного события; русское «произошло» естественно передаёт событийный смысл, не уточняя само событие.'
- source_word: הִשְׁמַעְתִּיךָ
  choice: Я дал тебе услышать об этом
  rationale: Причинная форма שמע буквально означает «дал/заставил услышать». Выбранная формулировка сохраняет причинный оттенок и избегает ненужного повторения «возвестил».
- source_word: פֶּן
  choice: чтобы ты не сказал
  rationale: Союз вводит предотвращаемый результат или цель. Эта конструкция естественнее для современного русского языка, чем книжное «дабы не».
- source_word: עָצְבִּי
  choice: мой идол
  rationale: Существительное обозначает изготовленного идола. Общее слово «идол» отличает его от двух более конкретных видов изображений далее.
- source_word: עָשָׂם
  choice: совершил всё это
  rationale: Местоименный суффикс множественного числа отсылает к предсказанным делам или событиям. «Всё это» по-русски естественнее буквального «совершил их» и сохраняет собирательную множественность.
- source_word: פִסְלִי
  choice: моё резное изваяние
  rationale: פסל обозначает изображение, изготовленное посредством резьбы или высекания. Формулировка сохраняет отличие от общего «идола» и литого изображения.
- source_word: נִסְכִּי
  choice: мой литой идол
  rationale: Слово обозначает изображение, изготовленное литьём. «Литой идол» ясно передаёт способ изготовления и поддерживает полемический контекст.
- source_word: צִוָּם
  choice: повелели этому быть
  rationale: צוה обычно означает «повелеть». Русское дополнение «этому быть» выражает мысль о мнимом повелении событиям осуществиться; множественное сказуемое согласовано с двумя однородными подлежащими, хотя в еврейском глагол имеет форму единственного числа.
theological_decisions:
- issue: Различение трёх обозначений идолов
  choice: «идол», «резное изваяние», «литой идол»
  alternative: Передать все три слова общим словом «идол» либо использовать традиционные «истукан» и «кумир».
  rationale: В еврейском тексте употреблены три разных обозначения, усиливающие полемику против ложных богов. Их различение сохраняет риторику источника без добавления конфессионального толкования.
- issue: Кому приписывается повеление событиям
  choice: Сохранить образ идолов, которые якобы «повелели этому быть».
  alternative: Ослабить до «предсказали это» или «устроили это».
  rationale: Глагол צוה прямо означает «повелеть»; сохранение этой напряжённой персонификации передаёт иронию исходного текста и не объясняет её за читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис сохраняет последовательность предварительного возвещения и предотвращаемого ложного заявления; архаизмы вроде «дабы», «истукан» и «изваянный образ» не используются.
