  text: עַתָּ֤ה נִבְרְאוּ֙ וְ/לֹ֣א מֵ/אָ֔ז וְ/לִ/פְנֵי י֖וֹם וְ/לֹ֣א שְׁמַעְתָּ֑/ם פֶּן תֹּאמַ֖ר הִנֵּ֥ה יְדַעְתִּֽי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/007.yaml
  text: Now they are created[a], and not from long ago; before today you had not heard them, lest you should say, ‘Look, I knew them.’
translation:
  language: ru
  text: 'Теперь они сотворены[a], а не издревле; до сегодняшнего дня ты о них не слышал, чтобы ты не сказал: «Вот, я знал их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Теперь они были сотворены, а не издревле; до сегодняшнего дня ты о них не слышал».'
    reason: Возможна более явно прошедшая передача еврейского перфекта; оборот וְלִפְנֵי יוֹם допускает перевод «до сегодняшнего дня».
lexical_decisions:
- source_word: עַתָּה
  choice: Теперь
  rationale: Передаёт временное противопоставление прежнему времени и нынешнему явлению новых событий.
- source_word: נִבְרְאוּ
  choice: они сотворены
  rationale: Сохраняет явный язык творения глагола ברא и форму нифаль; перфект допускает понимание как нынешнего свершившегося факта.
- source_word: מֵאָז
  choice: издревле
  rationale: Естественно и кратко выражает отрицаемую древность происхождения этих событий.
- source_word: וְלִפְנֵי יוֹם
  choice: до этого дня
  rationale: Близко к еврейской форме и ясно означает время, предшествующее нынешнему откровению.
- source_word: שְׁמַעְתָּם
  choice: ты о них не слышал
  rationale: Передаёт буквальное значение שמע и естественно по-русски обозначает отсутствие прежнего знания об этих событиях.
- source_word: פֶּן
  choice: чтобы … не
  rationale: Передаёт предупредительно-целевое значение частицы без архаичного оборота.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественное современное вводное слово, подчёркивающее последующее самоуверенное заявление.
- source_word: יְדַעְתִּין
  choice: я знал их
  rationale: Сохраняет перфект и местоименный объект, не добавляя отсутствующего в тексте наречия «уже».
theological_decisions:
- issue: Значение «сотворены» применительно к новым событиям
  choice: 'Сохранить язык творения: «они сотворены»'
  alternative: «они осуществлены» или «они возвещены»
  rationale: Глагол ברא подчёркивает суверенное действие Бога; замена на «возвещены» неоправданно свела бы смысл лишь к сообщению.
- issue: Временная отнесённость נִבְרְאוּ
  choice: «Теперь они сотворены»
  alternative: «Теперь они творятся» / «Теперь они были сотворены»
  rationale: Еврейский перфект обозначает свершившееся действие, а עתה связывает его с настоящим моментом; русский краткий пассив сохраняет эту напряжённость.
- issue: Референт местоимений
  choice: «они / о них / их» без уточняющего существительного
  alternative: «эти события» или «эти дела»
  rationale: Контекст указывает на новые открываемые Богом вещи или события, но сам стих их не конкретизирует; местоимения сохраняют эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Издревле» уместно в поэтической пророческой речи и не затрудняет понимание; синтаксис сохраняет лаконичность и напряжение оригинала.
