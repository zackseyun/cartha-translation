base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/016.yaml
  text: 'Come near to me[a]; hear this: From the beginning I have not spoken in secret; from the time it came to be, I was there. And now the Lord GOD has sent me[c][b], and his Spirit.'
translation:
  language: ru
  text: 'Приблизьтесь ко мне, послушайте это: с самого начала я не говорил тайно; с того времени, как это возникло[a], я был там[b]. А теперь меня послал Владыка Яхве — и его дух[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с того времени, как это произошло». Еврейское выражение буквально означает: «со времени её бытия».'
    reason: lexical_alternative
  - marker: b
    text: Говорящий в еврейском тексте прямо не назван. Христианские читатели нередко понимали эти слова как речь Раба Господня, Мессии, однако сам стих оставляет его личность неуточнённой.
    reason: alternative_reading
  - marker: c
    text: 'Возможно также: «и его Дух». Еврейские слова можно понимать как указание на ещё одного действующего участника, но их синтаксическая связь с глаголом остаётся краткой и неоднозначной.'
    reason: alternative_reading
lexical_decisions:
- source_word: קִרְבוּ אֵלַי
  choice: Приблизьтесь ко мне
  rationale: Повелительная форма множественного числа прямо призывает слушателей подойти; «приблизьтесь» естественно и достойно передаёт этот призыв.
- source_word: שִׁמְעוּ זֹאת
  choice: послушайте это
  rationale: Передаёт повелительное обращение естественным современным русским языком.
- source_word: לֹא מֵרֹאשׁ בַּסֵּתֶר דִּבַּרְתִּי
  choice: с самого начала я не говорил тайно
  rationale: Сохраняет отрицание, временное значение מֵרֹאשׁ и идею открытой, а не сокрытой речи.
- source_word: מֵעֵת הֱיוֹתָהּ
  choice: с того времени, как это возникло
  rationale: Буквально оборот означает «со времени её/этого бытия». Нейтральное «это» не уточняет, относится ли выражение к событию, делу или предшествующему возвещению.
- source_word: שָׁם אָנִי
  choice: я был там
  rationale: Именная конструкция буквально означает «там я»; прошедшее время естественно следует из ретроспективного временного оборота.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное заветное имя יהוה и избегает неестественного повтора «Господь ГОСПОДЬ».
- source_word: שְׁלָחַנִי
  choice: меня послал
  rationale: Точно передаёт совершенную форму глагола с местоименным суффиксом первого лица; порядок слов позволяет присоединить последующее וְרוּחוֹ без излишнего истолкования.
- source_word: וְרוּחוֹ
  choice: и Его Дух
  rationale: רוּחַ может означать дух, дыхание или ветер; в контексте послания наиболее вероятно личное значение «Дух». Тире отражает необычное присоединение фразы, не превращая её явно ни в обстоятельство «с Духом», ни во второй объект.
theological_decisions:
- issue: Кто говорит от первого лица
  choice: Не называть говорящего в основном тексте
  alternative: Прямо обозначить говорящего как Раба Господня или Мессию
  rationale: Еврейский текст не называет говорящего прямо. Перевод сохраняет первое лицо и не устраняет значимую для толкования неопределённость.
- issue: Синтаксическая роль וְרוּחוֹ
  choice: 'Сохранить отдельное присоединение: «— и Его Дух»'
  alternative: «с Его Духом», «и его дух» или понимание Духа как второго посылаемого
  rationale: Краткая еврейская конструкция допускает разные синтаксические прочтения. Основной текст сохраняет напряжение, а сноска сообщает варианты, не закрепляя конфессионально обусловленную трактовку.
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка ГОСПОДЬ
  rationale: Транслитерация сохраняет личное имя, присутствующее в исходном тексте, а титул «Владыка» отличает אֲדֹנָי от имени יהוה.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя, но личность говорящего и роль заключительных слов о Духе намеренно не конкретизированы сверх еврейского текста. Строчная буква в местоимениях первого лица помогает не навязывать отождествление говорящего.
