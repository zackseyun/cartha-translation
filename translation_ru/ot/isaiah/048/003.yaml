base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/003.yaml
  text: I declared the former things long ago[a]; they went out from my mouth, and I made them heard. Suddenly I acted[b], and they came to pass.
translation:
  language: ru
  text: О прежних событиях Я возвестил издавна; они вышли из Моих уст, и Я дал им прозвучать. Внезапно Я совершил это[a] — и они сбылись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я сделал это». Еврейский глагол имеет обычное значение «делать, совершать»; здесь речь идёт о действии Бога, после которого возвещённые события сбылись.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִאשֹׁנוֹת
  choice: прежние события
  rationale: Субстантивированное прилагательное женского рода во множественном числе обозначает то, что было прежде, — события или предсказанное ранее. Добавление «события» делает выражение естественным по-русски, не сужая его до одних лишь пророчеств.
- source_word: מֵאָז
  choice: издавна
  rationale: Наречие указывает на давнее время провозглашения; «издавна» естественно передаёт временную удалённость и сохраняет возвышенный, но современный регистр.
- source_word: הִגַּדְתִּי
  choice: Я возвестил
  rationale: Каузативная форма נגד означает сообщить, объявить. «Возвестил» соответствует торжественному контексту Божьей пророческой речи и не звучит разговорно.
- source_word: וּמִפִּי יָצְאוּ
  choice: они вышли из Моих уст
  rationale: Перевод сохраняет конкретный еврейский образ слов или возвещённых событий, исходящих из уст Бога, хотя по-русски эта метафора остаётся намеренно необычной.
- source_word: וְאַשְׁמִיעֵם
  choice: и Я дал услышать о них
  rationale: 'Формулировка передаёт каузативное значение формы שמע: Бог сделал так, чтобы возвещённое было услышано. «О них» естественно связывает действие с прежними событиями.'
- source_word: פִּתְאֹם
  choice: Внезапно
  rationale: Прямо передаёт резкость и неожиданность последующего Божьего действия.
- source_word: עָשִׂיתִי
  choice: Я совершил это
  rationale: Обычный глагол «делать/совершать» здесь описывает действие Бога, вслед за которым предсказанное осуществляется. «Совершил это» естественнее по-русски, чем «Я действовал», и не уточняет способ действия сверх текста.
- source_word: וַתָּבֹאנָה
  choice: и они сбылись
  rationale: Глагол женского рода во множественном числе соотнесён с «прежними событиями». В контексте предсказания «сбылись» ясно выражает их наступление и осуществление.
theological_decisions:
- issue: Связь между Божьим предсказанием и исполнением
  choice: 'Сохранена последовательность: Бог заранее возвещает события, затем совершает действие, и события сбываются.'
  alternative: 'Можно было бы передать вторую часть нейтральнее: «Я сделал — и они наступили», не подчёркивая исполнения предсказанного.'
  rationale: Еврейский текст ставит рядом Божье возвещение, Божье действие и наступление событий. Перевод сохраняет эту связь, но не добавляет утверждений о механизме Божьего причинения или предопределения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской издательской традиции. Сохранён образ исходящего из уст возвещения; синтаксис сделан ясным для широкого читателя.
