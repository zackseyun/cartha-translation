base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/006.yaml
  text: You have heard; now see all this. And will you not declare it? From now on I make you hear new things, hidden things that you have not known.
translation:
  language: ru
  text: Ты слышал — рассмотри всё это. Неужели вы не возвестите об этом? Отныне Я возвещаю тебе новое — сокрытое, чего ты не знал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲזֵה
  choice: рассмотри
  rationale: Императив со значением «увидь, созерцай»; «рассмотри» естественно передаёт призыв внимательно взглянуть на уже услышанное свидетельство.
- source_word: תַגִּידוּ
  choice: возвестите об этом
  rationale: Глагол означает «сообщать, объявлять, рассказывать»; множественное число сохранено, а местоименное дополнение естественно отсылает ко «всему этому».
- source_word: הִשְׁמַעְתִּיךָ
  choice: Я даю тебе услышать
  rationale: Каузативная форма буквально выражает действие «дать услышать, сообщить»; единственное число адресата сохранено.
- source_word: חֲדָשׁוֹת
  choice: новое
  rationale: Субстантивированное множественное прилагательное допускает собирательную передачу «новое»; это сохраняет широту обозначения без добавления слова «дела» или «события».
- source_word: נְצֻרוֹת
  choice: сокрытое
  rationale: Форма обозначает нечто охраняемое, сохранённое в тайне или сокрытое; «сокрытое» передаёт контекстуальный смысл без излишнего уточнения.
theological_decisions:
- issue: Переход между единственным и множественным числом адресата
  choice: 'Сохранить: «ты… вы… тебе… вы»'
  alternative: Унифицировать обращение как только единственное или только множественное
  rationale: 'Масоретский текст намеренно чередует формы: שָׁמַעְתָּ/חֲזֵה — ед. ч., תַגִּידוּ — мн. ч., הִשְׁמַעְתִּיךָ — ед. ч., יְדַעְתָּם — мн. ч. Сглаживание устранило бы подлинное напряжение текста.'
- issue: Содержание «нового» и «сокрытого»
  choice: Не конкретизировать
  alternative: Добавить «события», «пророчества» или «тайны»
  rationale: Еврейский текст не называет предмет прямо; нейтральные субстантивированные формы сохраняют эту открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Тире обозначают смысловые паузы и связь между «новым» и «сокрытым». Необычная смена числа адресата сохранена как характеристика исходного текста.
