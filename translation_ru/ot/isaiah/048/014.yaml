  text: הִקָּבְצ֤וּ כֻלְּ/כֶם֙ וּֽ/שֲׁמָ֔עוּ מִ֥י בָ/הֶ֖ם הִגִּ֣יד אֶת אֵ֑לֶּה יְהוָ֣ה אֲהֵב֔/וֹ יַעֲשֶׂ֤ה חֶפְצ/וֹ֙ בְּ/בָבֶ֔ל וּ/זְרֹע֖/וֹ כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/014.yaml
  text: 'Gather yourselves[a], all of you, and listen: who among them has declared these things? Yahweh loves him; he will carry out his purpose in Babylon, and his arm will be against the Chaldeans.'
translation:
  language: ru
  text: 'Соберитесь все и послушайте: кто из них возвестил это? Яхве любит его; он исполнит Его замысел в Вавилоне, и его рука будет обращена против халдеев.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Яхве любит его; Он исполнит Свой замысел в Вавилоне, и Его рука будет обращена на халдеев», если местоимения понимать как относящиеся к Яхве, а не к избранному Им исполнителю.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִקָּבְצוּ כֻלְּכֶם
  choice: Соберитесь все
  rationale: Возвратная форма повелительного наклонения естественно передаётся русским «соберитесь»; כֻלְּכֶם подчёркивает полноту круга слушателей.
- source_word: וּשֲׁמָעוּ
  choice: и послушайте
  rationale: Передаёт призыв не просто услышать, а внимательно выслушать.
- source_word: מִי בָהֶם הִגִּיד אֶת־אֵלֶּה
  choice: кто из них возвестил это?
  rationale: נגד в породе hифиль означает объявить или возвестить; единственное «это» естественно охватывает названные ранее события.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אֲהֵבוֹ
  choice: любит его
  rationale: Суффикс однозначно обозначает объект мужского рода в единственном числе; настоящее время естественно выражает сохраняющееся благоволение.
- source_word: יַעֲשֶׂה חֶפְצוֹ
  choice: он исполнит Его замысел
  rationale: 'Сочетание עשה и חפץ означает осуществить волю или замысел. Заглавная буква у «Его» помогает показать принятую синтаксическую трактовку: избранный исполнитель осуществляет замысел Яхве.'
- source_word: בְּבָבֶל
  choice: в Вавилоне
  rationale: Сохраняет обычное пространственное значение предлога ב и не усиливает его до «против» без необходимости.
- source_word: וּזְרֹעוֹ כַּשְׂדִּים
  choice: и рука его будет против халдеев
  rationale: Сохранена библейская метафора руки как действующей силы; связка и отношение «против» восполнены по контексту суда над халдеями.
theological_decisions:
- issue: К кому относятся местоимения в יַעֲשֶׂה חֶפְצוֹ וּזְרֹעוֹ
  choice: Подлежащее «он» и «рука его» относятся к любимому Яхве человеческому исполнителю, а «Его замысел» — к замыслу Яхве.
  alternative: Яхве Сам исполнит Свой замысел в Вавилоне, и Его рука будет на халдеях.
  rationale: Ближайший контекст стихов 14–15 указывает на призванного Яхве исполнителя, но древнееврейская последовательность местоимений допускает соотнесение последних форм с Самим Яхве; альтернативу поэтому следует сохранить в примечании.
translation_notes:
  register: Современный литературный русский язык; синтаксис торжественный, но не архаичный. Метафора «рука» сохранена. Маркер примечания поставлен после всего неоднозначного высказывания.
