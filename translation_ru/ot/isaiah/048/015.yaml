    rationale: 'Хотя Hiphil морфологически каузативен и форма действительно 3 м. ед. ч., в сочетании «успешным сделать свой путь» русский текст неестественен и может искажать еврейскую идиому. Нормальный контекстуальный смысл: призванный человек будет успешен в своём пути. При этом английский audit trail ошибочно заменил субъект на первое лицо; русский вариант должен следовать еврейскому тексту.'
