  text: אֲנִ֥י אֲנִ֛י דִּבַּ֖רְתִּי אַף קְרָאתִ֑י/ו הֲבִיאֹתִ֖י/ו וְ/הִצְלִ֥יחַ דַּרְכּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/015.yaml
  text: I[a], I have spoken; indeed[b], I have called him; I have brought him, and I will make his way prosper.
translation:
  language: ru
  text: Я, Я сказал; да, Я призвал его[a], Я привёл его, и он сделает свой путь успешным[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимения «его» и «свой» относятся к тому, кого Бог призвал и привёл; судя по контексту, обычно здесь понимают Кира (см. Ис. 48:14).
    reason: cross_reference
  - marker: b
    text: 'Возможный перевод по смыслу: «и он преуспеет на своём пути» или «и его путь будет успешен». Еврейский глагол стоит в каузативной форме; буквально: «он сделает свой путь успешным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי אֲנִי
  choice: Я, Я
  rationale: Повтор личного местоимения передаёт усиленное самоутверждение говорящего и сохраняет риторическую форму еврейского текста.
- source_word: דִּבַּרְתִּי
  choice: сказал
  rationale: Перфект обозначает совершённое Божье речевое действие; простое прошедшее время естественно для современного русского языка.
- source_word: אַף
  choice: да
  rationale: Здесь частица подтверждает и усиливает последующее утверждение, а не только присоединяет ещё одно действие.
- source_word: קְרָאתִיו
  choice: призвал его
  rationale: Глагол может означать «позвать» или «призвать»; выбранный вариант сохраняет оттенок целенаправленного Божьего призвания, не уточняя его сверх текста.
- source_word: הֲבִיאֹתִיו
  choice: привёл его
  rationale: Каузативная форма глагола בוא означает «привести, сделать так, чтобы пришёл»; «привёл» кратко и естественно передаёт это значение.
- source_word: וְהִצְלִיחַ
  choice: и он сделает успешным
  rationale: Форма глагола — Hiphil, 3-е лицо мужского рода единственного числа; поэтому субъектом последней части является призванный человек, а не говорящий Бог. Каузативность сохранена, хотя по-русски оборот несколько необычен.
- source_word: דַּרְכּוֹ
  choice: свой путь
  rationale: При совпадении деятеля и обладателя пути русское возвратное притяжательное местоимение естественно передаёт еврейское «его путь».
theological_decisions:
- issue: К кому относятся местоимения «его» и «свой»
  choice: В основном тексте сохранён не названный по имени человек мужского рода; контекст связывает его с тем, кого Бог призвал и привёл.
  alternative: Прямо назвать Кира в основном тексте.
  rationale: В самом стихе стоит только местоименный суффикс. Непосредственный контекст обычно указывает на Кира, но добавление имени сняло бы сохранённую оригиналом неявность.
- issue: Субъект глагола וְהִצְלִיחַ
  choice: «он сделает» — субъектом является призванный человек.
  alternative: «Я сделаю» — продолжение ряда Божьих действий.
  rationale: Еврейская форма וְהִצְלִיחַ морфологически является 3-м лицом мужского рода единственного числа, а не 1-м лицом. Поэтому смена субъекта должна быть отражена, несмотря на синтаксическую возможность читателю ожидать продолжения первого лица.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного повтора «Я, Я». Пунктуация подчёркивает последовательность действий. Необычный, но понятный оборот «сделает свой путь успешным» выбран ради каузативной формы оригинала; более естественные варианты приведены в сноске.
