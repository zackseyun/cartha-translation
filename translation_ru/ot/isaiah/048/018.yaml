id: ISA.48.18
reference: Isaiah 48:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: ל֥וּא הִקְשַׁ֖בְתָּ לְ/מִצְוֺתָ֑/י וַ/יְהִ֤י כַ/נָּהָר֙ שְׁלוֹמֶ֔/ךָ וְ/צִדְקָתְ/ךָ֖ כְּ/גַלֵּ֥י הַ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/018.yaml
  text: If only you had paid attention to my commandments! Then your peace would have been like a river[b][a], and your righteousness like the waves of the sea.
translation:
  language: ru
  text: О, если бы ты внимал Моим заповедям![a] Тогда мир твой был бы как река, и праведность твоя — как морские волны.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слушал Мои заповеди»; «повиновался Моим заповедям».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливость твоя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּא
  choice: О, если бы
  rationale: Передаёт нереализованное желание и скорбное сожаление естественным для современной русской речи условно-желательным оборотом.
- source_word: הִקְשַׁ֖בְתָּ
  choice: ты внимал
  rationale: Глагол означает не просто слышать, а внимательно слушать с готовностью откликнуться; «внимать» кратко и точно передаёт этот оттенок в возвышенной поэтической речи.
- source_word: לְמִצְוֺתָי
  choice: Моим заповедям
  rationale: Сохраняет форму множественного числа, принадлежность говорящему и весомый заветно-нравственный смысл מִצְוָה.
- source_word: וַיְהִי
  choice: Тогда ... был бы
  rationale: После לוּא форма выражает не состоявшееся следствие нереального условия; русское сослагательное наклонение передаёт эту связь.
- source_word: כַנָּהָר
  choice: как река
  rationale: Прямо сохраняет поэтическое сравнение, вызывающее образ обильного и непрерывного течения.
- source_word: שְׁלוֹמֶךָ
  choice: мир твой
  rationale: «Мир» — традиционный и ёмкий русский эквивалент שָׁלוֹם, включающего также благополучие и целостность.
- source_word: וְצִדְקָתְךָ
  choice: и праведность твоя
  rationale: «Праведность» сохраняет нравственно-заветный смысл слова и его связь с вниманием к Божьим заповедям, не исключая оттенка справедливости.
- source_word: כְּגַלֵּי הַיָּם
  choice: как морские волны
  rationale: Естественно и образно передаёт еврейское словосочетание, сохраняя представление о множестве и непрерывности волн.
theological_decisions:
- issue: Значение צְדָקָה в данном контексте
  choice: праведность
  alternative: справедливость; оправдание
  rationale: Контекст связывает внимание к Божьим заповедям с надлежащим нравственно-заветным состоянием народа. «Праведность» сохраняет эту связь, а возможный общественно-правовой оттенок «справедливость» отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «мир твой», «праведность твоя» сохраняет библейский ритм, оставаясь понятной. Все местоимения, относящиеся к Богу как говорящему, оформлены с прописной буквы согласно принятой русской библейской издательской норме.
