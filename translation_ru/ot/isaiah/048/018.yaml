  source_fidelity: 'Текст точно передаёт еврейскую конструкцию сожаления/нереализованного условия: לוּא выражено «О, если бы», а последствие в сослагательном наклонении — «Тогда мир твой был бы». Сохранены оба сравнения: мир — с рекой, праведность — с волнами моря.'
