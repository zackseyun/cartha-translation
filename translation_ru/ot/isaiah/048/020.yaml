source:
  edition: WLC
  text: צְא֣וּ מִ/בָּבֶל֮ בִּרְח֣וּ מִ/כַּשְׂדִּים֒ בְּ/ק֣וֹל רִנָּ֗ה הַגִּ֤ידוּ הַשְׁמִ֨יעוּ֙ זֹ֔את הוֹצִיא֖וּ/הָ עַד קְצֵ֣ה הָ/אָ֑רֶץ אִמְר֕וּ גָּאַ֥ל יְהוָ֖ה עַבְדּ֥/וֹ יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/020.yaml
  text: Go out from Babylon[a]; flee from the Chaldeans! Declare this with a shout of joy; make it heard; send it out to the end of the earth. Say[b], “Yahweh has redeemed his servant Jacob.”
translation:
  language: ru
  text: 'Выходите из Вавилона, бегите из земли халдеев![a] С радостным возгласом объявите об этом, возвестите это, распространите это до самого края земли. Скажите: «Яхве искупил Своего слугу Иакова!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «бегите от халдеев»; в еврейском тексте назван народ, «халдеи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאוּ מִבָּבֶל
  choice: Выходите из Вавилона
  rationale: Множественное повелительное наклонение יצא и исходный пункт переданы прямо; «выходите» сохраняет образ оставления Вавилона и звучит естественно по-русски.
- source_word: בִּרְחוּ מִכַּשְׂדִּים
  choice: бегите от халдеев
  rationale: ברח выражает срочное бегство, а כַּשְׂדִּים грамматически обозначает народ — халдеев, а не название страны.
- source_word: בְּקוֹל רִנָּה
  choice: с радостным возгласом
  rationale: Сочетание указывает на громкое, ликующее провозглашение; перевод сохраняет и звучание голоса, и радость.
- source_word: הַגִּידוּ הַשְׁמִיעוּ זֹאת
  choice: объявите об этом, возвестите это
  rationale: Два повеления сохранены раздельно. «Возвестите» естественно передаёт каузативный смысл הַשְׁמִיעוּ — сделать услышанным — без тяжеловесной буквальности.
- source_word: הוֹצִיאוּהָ
  choice: разнесите эту весть
  rationale: Женский объектный суффикс относится к провозглашаемому сообщению; «эту весть» делает связь ясной по-русски, а «разнесите» передаёт широкое распространение.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: до края земли
  rationale: Сохранено единственное число קְצֵה; выражение естественно и передаёт предельную широту распространения вести.
- source_word: גָּאַל
  choice: искупил
  rationale: Глагол גאל обозначает избавление посредством действия искупителя; «искупил» сохраняет его устойчивую библейскую и богословскую насыщенность, не уточняя способ сверх текста.
- source_word: עַבְדּוֹ יַעֲקֹב
  choice: Своего слугу Иакова
  rationale: Притяжательный суффикс передан возвратным местоимением, естественным при подлежащем «Яхве»; עֶבֶד здесь передано современным и достойным словом «слуга».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом; форма «Иегова» не отражает наиболее вероятного древнего произношения.
- issue: Смысл גָּאַל в контексте избавления из плена
  choice: искупил
  alternative: выкупил; избавил
  rationale: «Искупил» сохраняет образ родственного искупителя и заветного избавления, присутствующий в корне גאל, не сводя его к общему «избавил» и не добавляя явно не названной платы.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Цепочка повелительных форм и нарастающий размах провозглашения сохранены; местоимения, относящиеся к Богу, оформлены с прописной буквы согласно распространённой русской библейской традиции.
