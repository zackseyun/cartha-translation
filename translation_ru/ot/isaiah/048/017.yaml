  text: כֹּֽה אָמַ֧ר יְהוָ֛ה גֹּאַלְ/ךָ֖ קְד֣וֹשׁ יִשְׂרָאֵ֑ל אֲנִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מְלַמֶּדְ/ךָ֣ לְ/הוֹעִ֔יל מַדְרִֽיכֲ/ךָ֖ בְּ/דֶ֥רֶךְ תֵּלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/017.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: I am Yahweh your God, who teaches you to profit[b], who leads you in the way you should go.'
translation:
  language: ru
  text: 'Так говорит Яхве[a], твой Искупитель, Святой Израиля:


    «Я — Яхве, твой Бог,


    который учит тебя тому, что приносит пользу,


    ведёт тебя по пути, которым тебе следует идти[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога; традиционно также передаётся словом «Господь».
    reason: divine_name
  - marker: b
    text: 'Возможно также: «ведёт тебя по пути, которым ты идёшь». Еврейский текст допускает как наставительный, так и более описательный смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, не заменяя его титулом; повтор имени в самооткровении сохранён.
- source_word: גֹּאַלְךָ
  choice: твой Искупитель
  rationale: Причастная форма выступает как титул; «Искупитель» кратко сохраняет смысл освобождения и возвращения принадлежащего, не конкретизируя сверх текста родственную функцию.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  rationale: Устойчивый для книги Исаии титул передан точно и в естественной русской форме.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Стандартная и контекстуально точная передача формы с суффиксом второго лица единственного числа.
- source_word: מְלַמֶּדְךָ
  choice: Который учит тебя
  rationale: Причастие обозначает характерное продолжающееся действие; относительное предложение естественно по-русски.
- source_word: לְהוֹעִיל
  choice: тому, что приносит пользу
  rationale: Передаёт цель и полезный результат обучения без неестественного оборота «учит извлекать выгоду» и без сужения смысла до материальной прибыли.
- source_word: מַדְרִיכֲךָ
  choice: ведёт тебя
  rationale: Сохраняет каузативный смысл и образ движения по пути; «направляет» также возможно, но менее наглядно.
- source_word: בְּדֶרֶךְ תֵּלֵךְ
  choice: по пути, которым тебе следует идти
  rationale: Сохраняет метафору пути и передаёт вероятный наставительный оттенок имперфекта, не скрывая возможного описательного прочтения, отмеченного в сноске.
theological_decisions:
- issue: Повтор личного имени יְהוָה в формуле Божьего самооткровения
  choice: «Яхве… Я — Яхве, твой Бог»
  alternative: «Господь… Я — Господь, твой Бог»
  rationale: Личное имя и его повтор сохранены непосредственно, без замены титулом и без добавления богословского истолкования.
- issue: Характер Божьего наставления в לְהוֹעִיל
  choice: «учит тебя тому, что приносит пользу»
  alternative: «учит тебя для твоего блага» / «учит тебя извлекать пользу»
  rationale: Выбранная формулировка сохраняет широкий смысл полезного и благотворного наставления, не сводя его к выгоде.
- issue: Модальность תֵּלֵךְ
  choice: «которым тебе следует идти»
  alternative: «которым ты идёшь»
  rationale: В контексте наставления предпочтён нормативный оттенок, однако грамматически возможное описательное понимание сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен для широкого читателя; традиционные титулы сохранены, архаизмы и конфессионально окрашенные уточнения не добавлены.
