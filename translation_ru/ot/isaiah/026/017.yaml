  rationale: Правка уточняет образ родовых мук без изменения смысла сравнения, делает начало фразы более естественным для современного русского и исправляет пояснение к неоднозначному מִפָּנֶיךָ. Основной текст не устраняет его возможный причинный оттенок; он отмечен в сноске.
