  text: כְּמ֤וֹ הָרָה֙ תַּקְרִ֣יב לָ/לֶ֔דֶת תָּחִ֥יל תִּזְעַ֖ק בַּ/חֲבָלֶ֑י/הָ כֵּ֛ן הָיִ֥ינוּ מִ/פָּנֶ֖י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/017.yaml
  text: Like a pregnant woman who is about to give birth writhes and cries out in her labor pains[a], so were we before you, O Yahweh.
translation:
  language: ru
  text: Как беременная женщина, когда ей близится время родов, корчится и кричит в родовых муках, так и мы были пред Тобой, Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Твоём присутствии»; возможно также: «из-за Тебя». Буквально: «от лица Твоего»; еврейское выражение связано с лицом и присутствием Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ הָרָה
  choice: Как беременная женщина
  rationale: Сохраняет вводное сравнение и прямо, естественно передаёт образ беременной женщины.
- source_word: תַּקְרִיב לָלֶדֶת
  choice: у которой приближаются роды
  rationale: Передаёт приближение времени рождения ребёнка современным и естественным русским выражением.
- source_word: תָּחִיל
  choice: корчится
  rationale: В контексте родов глагол изображает телесные мучения и судороги; выбор сохраняет яркость еврейского образа.
- source_word: תִּזְעַק
  choice: кричит
  rationale: Передаёт громкий крик без добавочного усиления, которого нет в исходном тексте.
- source_word: בַּחֲבָלֶיהָ
  choice: от схваток
  rationale: В родовом контексте חבלים обозначает родовые муки; «схватки» — точное и понятное современное соответствие.
- source_word: כֵּן הָיִינוּ
  choice: так и мы были
  rationale: Сохраняет заключительную часть сравнения и форму прошедшего времени.
- source_word: מִפָּנֶיךָ
  choice: пред Тобой
  rationale: Буквально связано с лицом или присутствием адресата; «пред Тобой» сохраняет пространственно-реляционный смысл и не сводит выражение однозначно к причинному.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя; транслитерация сохраняет это различие.
- issue: Значение מִפָּנֶיךָ
  choice: пред Тобой
  alternative: из-за Тебя
  rationale: Фраза допускает оттенок причины, но буквально указывает на лицо или присутствие. Основной текст сохраняет эту напряжённость, а возможное причинное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической пророческой речи. «Пред Тобой» выбрано вместо более разговорного «перед Тобой», чтобы сохранить возвышенный, но понятный регистр; архаические формы и конфессионально окрашенные добавления не используются.
