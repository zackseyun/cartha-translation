  text: בַּ/יּ֣וֹם הַ/ה֔וּא יוּשַׁ֥ר הַ/שִּׁיר הַ/זֶּ֖ה בְּ/אֶ֣רֶץ יְהוּדָ֑ה עִ֣יר עָז לָ֔/נוּ יְשׁוּעָ֥ה יָשִׁ֖ית חוֹמ֥וֹת וָ/חֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/001.yaml
  text: 'In that day this song will be sung in the land of Judah: “We have a strong city[c][b][a]; he sets salvation as walls and rampart.”'
translation:
  language: ru
  text: 'В тот день в земле Иуды будут петь эту песню:


    «У нас крепкий город[a];

    он поставит спасение стенами и валом[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «У нас укреплённый город».'
    reason: lexical_alternative
  - marker: c
    text: 'Вал — внешнее оборонительное укрепление города; возможные переводы: «укрепление» или «оплот».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Устойчивый пророческий оборот; естественно звучит по-русски и сохраняет указание на особый грядущий день.
- source_word: יוּשַׁר
  choice: будут петь
  rationale: Хофаль от שׁיר передаёт пассивное значение. Русская неопределённо-личная конструкция естественнее буквального «будет спета» и не вводит названного исполнителя.
- source_word: הַשִּׁיר הַזֶּה
  choice: эту песню
  rationale: Передаёт текст без пояснительного добавления «хвалебную».
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: в земле Иуды
  rationale: Сохраняет явно выраженное אֶרֶץ и географически-национальный смысл.
- source_word: עִיר עָז
  choice: крепкий город
  rationale: Кратко и естественно передаёт характеристику силы и защищённости города; вариант «укреплённый город» вынесен в примечание.
- source_word: לָנוּ
  choice: у нас
  rationale: Естественная русская конструкция обладания при древнееврейском дательном местоимении в безглагольном предложении.
- source_word: יְשׁוּעָה
  choice: спасение
  rationale: Прямой эквивалент, сохраняющий широкий смысл избавления и спасительной защиты, характерный для книги Исаии.
- source_word: יָשִׁית
  choice: поставит
  rationale: Передаёт qal глагола שׂים — «ставить, помещать, назначать». Будущее время согласуется с пророческим введением, не устраняя образную необычность исходного текста.
- source_word: חוֹמוֹת
  choice: стенами
  rationale: Сохранено множественное число древнееврейского слова и его роль в образе городских укреплений.
- source_word: וָחֵל
  choice: и валом
  rationale: «Вал» — понятное современному читателю обозначение внешнего оборонительного укрепления; более архаичное «оплот» менее конкретно.
theological_decisions:
- issue: Подлежащее при יָשִׁית («поставит»)
  choice: Сохранено не названное прямо местоименное подлежащее «Он»
  alternative: Назвать Бога или Господа; либо употребить безличную конструкцию
  rationale: В древнееврейском тексте подлежащее глагола в единственном числе прямо не названо. Контекст позволяет понимать его как Бога, но перевод не делает это толкование явным именованием и сохраняет исходную недосказанность.
- issue: Временное значение יָשִׁית
  choice: будущее «поставит»
  alternative: настоящее «ставит» или перфективное «поставил»
  rationale: Имперфект допускает контекстуальное толкование, однако пророческое «в тот день будут петь» естественно поддерживает будущее значение. При этом образ спасения как оборонительных сооружений сохранён.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Синтаксис сделан понятным обычному читателю, но необычный образ спасения, поставленного стенами и валом, намеренно не сглажен. Строки оформлены как поэтическая речь.
