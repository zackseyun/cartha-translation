    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для хвалы в ближайшем контексте; «ибо» естественно передаёт пояснительно-причинную связь и сохраняет возвышенный поэтический регистр.
- source_word: הֵשַׁח
  choice: низверг
  rationale: Каузативная форма от שׁחח означает заставить опуститься, унизить. «Низверг» сохраняет конкретный образ падения и уместен в контексте суда.
- source_word: יֹשְׁבֵי מָרוֹם
  choice: живущих на высоте
  rationale: Передаёт как пространственное значение, так и возможный переносный смысл высокого, безопасного или гордого положения, не разрешая эту неоднозначность.
- source_word: קִרְיָה נִשְׂגָּבָה
  choice: город вознесённый
  rationale: Сохраняет образ города, поставленного высоко или возвышенного, и его приложение к предшествующей фразе; конкретный город в еврейском тексте не назван.
- source_word: יַשְׁפִּילֶנָּה יַשְׁפִּילָהּ
  choice: унизил его, унизил
  rationale: Повтор глагола сохранён как намеренное поэтическое усиление. «Унизил» передаёт буквальное понижение и образ полного посрамления.
- source_word: עַד אֶרֶץ
  choice: до земли
  rationale: В параллели с «прахом» אֶרֶץ обозначает землю как нижний предел падения; формулировка близка к оригиналу и естественна по-русски.
- source_word: יַגִּיעֶנָּה עַד עָפָר
  choice: поверг его в прах
  rationale: Каузатив буквально выражает доведение или доставление города до праха. «Поверг в прах» естественно передаёт завершённость унижения и сохраняет поэтический образ.
theological_decisions:
- issue: Следует ли отождествлять вознесённый город с конкретным историческим городом или державой
  choice: Сохранить общее обозначение «город вознесённый»
  alternative: Назвать Вавилон либо истолковать город как всякую человеческую гордыню
  rationale: Еврейский текст не называет город. Перевод сохраняет намеренную обобщённость и не вводит историко-богословское отождествление на уровне основного текста.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим звучанием. Сохранены трёхчастное движение вниз («низверг… до земли… в прах») и подчеркнутый повтор глагола; имя Бога передано местоимением «Он» по ясному контексту предыдущего стиха.
