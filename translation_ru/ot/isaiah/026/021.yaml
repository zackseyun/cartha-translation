  rationale: 'Убраны интерпретирующие добавления и сохранены ключевые образы оригинала: Господь выходит «из Своего места», земля открывает «свою кровь» и перестаёт скрывать «своих убитых». «Наказать» прямо выражает в данном контексте значение божественного привлечения к ответу за вину.'
