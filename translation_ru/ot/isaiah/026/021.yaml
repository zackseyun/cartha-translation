  verdict: revise
  source_fidelity: Смысл судебного посещения передан в целом верно, но «обиталище» уточняет нейтральное מְקוֹמוֹ («место»), а «пролитую на ней» добавляет обстоятельство, не выраженное в еврейском тексте. Образ «её крови» следует сохранить без такого поясняющего расширения.
  naturalness: «Взыскать с ... за» возможно, но в современном русском может вызвать прежде всего ассоциацию с денежным взысканием. «Наказать ... за» ясно и естественно передаёт здесь судебное значение לִפְקֹד עָוֺן עַל.
  terminology: «Господь» — естественная традиционная передача тетраграмматона. «Живущий на земле» сохраняет единственное число יֹשֵׁב как собирательное и не сужает его до отдельного «жителя».
  issues:
  - severity: medium
    issue: «из Своего обиталища»
    rationale: מִמְּקוֹמוֹ буквально означает «из Своего места»; «обиталище» является интерпретирующим уточнением, которого источник не требует.
  - severity: medium
    issue: «пролитую на ней кровь» и поясняющее примечание
    rationale: В тексте сказано «свою кровь» (דָּמֶיהָ, буквально «её крови»); определение «пролитую на ней» не выражено прямо и несколько рационализирует поэтический образ земли.
  - severity: low
    issue: «взыскать с жителя земли»
    rationale: Хотя судебный оттенок уместен, для современного читателя глагол часто связан с взысканием денег. «Наказать» точнее и прозрачнее в данном контексте.
  revised_text: Ибо вот, Господь выходит из Своего места, чтобы наказать живущего на земле за его беззаконие. Земля откроет свою кровь и уже не скроет своих убитых.
