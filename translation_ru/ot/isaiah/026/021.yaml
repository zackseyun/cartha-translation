base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/021.yaml
  text: For look, the LORD is coming out from his place to punish the iniquity of the inhabitant of the earth upon him, and the earth will uncover her blood and will no longer cover her slain.
translation:
  language: ru
  text: Ибо вот, Господь выходит из Своего места, чтобы наказать живущего на земле за его беззаконие. Земля откроет свою кровь и уже не скроет своих убитых.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ведь вот
  rationale: Сохраняет причинную связь с предыдущим призывом и одновременно вводит торжественное указание на приближающееся действие.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона без искусственного воспроизведения предполагаемого произношения.
- source_word: מִמְּקוֹמוֹ
  choice: из Своего обиталища
  rationale: В данном теофаническом контексте מָקוֹם означает не просто точку в пространстве, а место пребывания Господа; «обиталище» естественно передаёт этот смысл.
- source_word: לִפְקֹד ... עָלָיו
  choice: взыскать с ... за
  rationale: Оборот פקד עון על обозначает привлечение к ответу и наказание за беззаконие; русское «взыскать с кого-либо за» сохраняет судебный оттенок.
- source_word: יֹשֵׁב הָאָרֶץ
  choice: жителя земли
  rationale: Сохранено собирательное единственное число оригинала, обозначающее население земли в целом.
- source_word: וְגִלְּתָה הָאָרֶץ אֶת דָּמֶיהָ
  choice: Земля откроет пролитую на ней кровь
  rationale: Глагол передан как «откроет», а множественное דמים — естественным русским собирательным «кровь»; добавление «пролитую на ней» проясняет образ без устранения его олицетворённости.
- source_word: הֲרוּגֶיהָ
  choice: своих убитых
  rationale: Передаёт людей, насильственно лишённых жизни, и сохраняет принадлежность земле, выраженную суффиксом.
theological_decisions:
- issue: Характер Божьего действия в לִפְקֹד עֲוֹן
  choice: «взыскать ... за беззаконие»
  alternative: «наказать за беззаконие»
  rationale: «Взыскать» сохраняет одновременно идеи расследования, привлечения к ответу и наказания, не сужая значение глагола до одного только исполнения кары.
- issue: Образ земли, обнаруживающей кровь и убитых
  choice: Сохранено олицетворение земли
  alternative: Рационализировать как обнаружение скрытых убийств
  rationale: Поэтический текст представляет землю свидетелем и хранительницей пролитой крови; буквальный образ сохраняет богословскую мысль о неизбежном выявлении вины.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис упрощён лишь настолько, чтобы стих естественно читался; судебная лексика и олицетворение земли сохранены.
