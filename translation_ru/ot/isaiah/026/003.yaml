  text: Твёрдое помышление[a] Ты хранишь в совершенном мире[b], потому что оно уповает на Тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать «помышление», «внутреннее расположение» или «настрой». В тексте прямо не назван человек; грамматически именно помышление названо твёрдым и уповающим на Бога.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст повторяет слово: «мир, мир», тем самым усиливая мысль о полном, совершенном мире.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצֶר
  choice: твёрдого духом
  rationale: Слово обозначает сформированное внутреннее расположение, помышление или настрой. Русская конструкция «твёрдого духом» естественно передаёт человека с устойчивым внутренним расположением, хотя личное обозначение в еврейском тексте прямо не выражено; буквальная особенность отмечена в сноске.
- source_word: סָמוּךְ
  choice: твёрдого
  rationale: Страдательное причастие от סמך передаёт состояние опоры, поддержки и вследствие этого устойчивости. «Твёрдого» сохраняет смысл постоянства и зависимости от Бога без тяжеловесного буквального оборота.
- source_word: תִּצֹּר
  choice: Ты хранишь
  rationale: Глагол נצר означает хранить, оберегать, сохранять. «Хранишь» точно и естественно сочетается с состоянием мира.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: в совершенном мире
  rationale: Двойное שָׁלוֹם усиливает понятие мира, выражая его полноту. «Совершенный мир» естественно передаёт это усиление; буквальное повторение сохранено в сноске.
- source_word: כִּי
  choice: потому что
  rationale: 'Союз вводит основание сказанного: Бог хранит в мире вследствие упования на Него.'
- source_word: בְךָ
  choice: на Тебя
  rationale: Предлог בְּ при בטח обозначает объект доверия; по-русски нормативно «полагаться на Тебя».
- source_word: בָּטוּחַ
  choice: он полагается
  rationale: Форма от בטח выражает доверие или уверенную опору. В естественной русской передаче местоимение относится к подразумеваемому человеку, чьё внутреннее расположение описано в начале стиха.
theological_decisions:
- issue: Внутреннее расположение или прямо названный человек
  choice: Твёрдого духом
  alternative: Твёрдое помышление Ты хранишь… потому что оно полагается на Тебя
  rationale: В еврейском прямо названо יֵצֶר — внутреннее расположение или помышление, а отдельного слова «человек» нет. Однако буквальное олицетворение помышления звучит по-русски неестественно. Основной текст передаёт подразумеваемого носителя этого расположения, а сноска сохраняет грамматическую особенность оригинала.
- issue: Усиление повтором שָׁלוֹם שָׁלוֹם
  choice: совершенный мир
  alternative: мир, мир
  rationale: Повтор усиливает значение полноты мира. Естественная русская формулировка помещена в основной текст, а поэтическая форма оригинала указана в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но общепонятным библейским звучанием. Обращение к Богу оформлено традиционными прописными местоимениями. Синтаксис сделан естественным для русского языка, а более буквальная антропологическая формулировка и еврейский повтор сохранены в сносках.
