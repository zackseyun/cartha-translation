  text: פִּתְח֖וּ שְׁעָרִ֑ים וְ/יָבֹ֥א גוֹי צַדִּ֖יק שֹׁמֵ֥ר אֱמֻנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/002.yaml
  text: Open the gates[a], that the righteous nation may enter, the one that keeps faithfulness.
translation:
  language: ru
  text: Откройте ворота, пусть войдёт праведный народ, хранящий верность[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хранящий истину»; или: «хранящий веру». Еврейское אֱמֻנִים в зависимости от контекста может означать верность, надёжность, истину или веру.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ
  choice: Откройте
  rationale: Форма повелительного наклонения множественного числа от פתח передаёт прямой призыв открыть ворота.
- source_word: שְׁעָרִים
  choice: ворота
  rationale: Множественное число обозначает городские ворота; в русском языке слово «ворота» естественно передаёт этот образ без отдельного показателя множественности.
- source_word: וְיָבֹא
  choice: пусть войдёт
  rationale: 'Сочетание союза с имперфектом после повеления допускает оттенок цели или дозволения: ворота следует открыть, чтобы народ мог войти. «Пусть войдёт» естественно сохраняет побудительную конструкцию и образ входа через ворота.'
- source_word: גוֹי צַדִּיק
  choice: праведный народ
  rationale: גוֹי обозначает народ или нацию как единое сообщество, а צַדִּיק характеризует его как праведный. «Народ» здесь звучит естественнее русского «нация» и не утрачивает коллективного смысла.
- source_word: שֹׁמֵר
  choice: хранящий
  rationale: Причастие единственного числа согласуется с собирательным существительным «народ» и описывает его постоянное качество. «Хранящий» передаёт идею соблюдения и стойкого удержания.
- source_word: אֱמֻנִים
  choice: верность
  rationale: Абстрактная форма множественного числа от אמן может выражать верность, надёжность, истину или веру. В данном описании праведного народа «верность» наиболее естественно передаёт стойкую преданность, не сводя смысл лишь к субъективной вере.
theological_decisions:
- issue: Значение אֱמֻנִים как качества праведного народа
  choice: верность
  alternative: истина; вера; надёжность
  rationale: «Верность» сохраняет этический и заветный оттенок стойкости, не навязывая более позднего узкодоктринального понимания веры. Поскольку еврейское слово допускает и другие смысловые оттенки, основные альтернативы указаны в примечании.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой призыва. Конструкция «пусть войдёт» звучит естественно и сохраняет целевой либо разрешительный оттенок еврейского имперфекта после повеления. Местоименное приложение не добавлено, поскольку русское причастие «хранящий» прямо и ясно относится к слову «народ».
