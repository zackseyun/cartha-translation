base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/020.yaml
  text: Go[a], my people, enter your rooms, and shut your doors behind you[c][b]; hide yourselves for a little moment until the wrath has passed by.
translation:
  language: ru
  text: Иди, Мой народ, войди в свои комнаты[a] и закрой за собой двери; спрячься[b] на краткий миг, пока не пройдёт гнев[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во внутренние комнаты» или «в покои». Еврейское слово может обозначать комнату, внутреннее помещение или уединённый покой.'
    reason: lexical_alternative
  - marker: b
    text: Еврейская форма — женского рода единственного числа, в отличие от предшествующих повелений мужского рода единственного числа. Причина этого грамматического сдвига не вполне ясна; в русском сохранено единственное число при обращении к народу как к собирательному целому.
    reason: textual_grammar
  - marker: c
    text: 'Или: «негодование». Еврейское слово обозначает сильный гнев, особенно в контексте суда; его носитель в этом стихе прямо не назван.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֵךְ
  choice: Ступай
  rationale: Прямое повеление в мужском роде единственного числа. «Ступай» естественно открывает последовательность приказов и сохраняет призыв к движению, не добавляя значения бегства.
- source_word: עַמִּי
  choice: народ Мой
  rationale: Существительное עַם с суффиксом первого лица передаёт личное обращение «Мой народ»; вариант «народ Мой» сохраняет торжественный пророческий строй русской фразы.
- source_word: בֹּא
  choice: войди
  rationale: Повелительная форма глагола בוא здесь обозначает вход в закрытое помещение; «войди» точно и естественно сочетается с «в свои покои».
- source_word: בַחֲדָרֶיךָ
  choice: в свои покои
  rationale: חֶדֶר может обозначать комнату, внутреннее или уединённое помещение. «Покои» передаёт идею защищённого внутреннего пространства и соответствует возвышенному, но понятному регистру.
- source_word: וּסְגֹר דלתיך בַּעֲדֶךָ
  choice: и затвори за собой двери
  rationale: Идиома с סגר и בְּעַד описывает закрывание дверей за вошедшим. «Затвори за собой двери» сохраняет образ и звучит естественно в торжественной речи.
- source_word: חֲבִי
  choice: укройся
  rationale: Повеление означает спрятаться или найти укрытие. Единственное число сохраняет грамматическое обращение к «народу» как к собирательному целому, не превращая его без необходимости во множественное.
- source_word: כִמְעַט רֶגַע
  choice: на краткий миг
  rationale: Сочетание выражает очень непродолжительное время. «На краткий миг» компактно и сохраняет поэтическую сжатость.
- source_word: עַד יַעֲבוֹר
  choice: пока не минует
  rationale: Конструкция обозначает временной предел укрытия, а глагол עבר представляет гнев как проходящий мимо. «Пока не минует» естественно передаёт и предел, и образ прохождения.
- source_word: זָעַם
  choice: гнев
  rationale: В пророческой речи זַעַם обозначает сильный, часто карающий гнев. «Гнев» сохраняет богословскую весомость, не называя прямо его носителя, которого данный стих не указывает.
theological_decisions:
- issue: Чей гнев обозначен словом זָעַם
  choice: «гнев» без добавления обладателя
  alternative: «гнев Господа» или «Божий гнев»
  rationale: Контекст позволяет понимать гнев как Божий суд, однако сам стих не называет его носителя. Перевод не добавляет этого уточнения и сохраняет подразумеваемый характер связи.
- issue: Число в повелении חֲבִי при собирательном обращении עַמִּי
  choice: «укройся» — обращение к народу как к единому целому
  alternative: «укройтесь» — обращение к отдельным представителям народа
  rationale: Еврейский текст обращается к «Моему народу» собирательно и использует формы единственного числа. Русское единственное число сохраняет эту форму и не устраняет напряжение между единым народом и множеством людей, входящих в свои помещения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Покои», «затвори» и порядок слов «народ Мой» поддерживают достоинство поэтической речи, оставаясь понятными. Последовательное единственное число воспроизводит обращение к народу как к собирательному адресату.
