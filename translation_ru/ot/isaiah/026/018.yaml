  text: הָרִ֣ינוּ חַ֔לְנוּ כְּמ֖וֹ יָלַ֣דְנוּ ר֑וּחַ יְשׁוּעֹת֙ בַּל נַ֣עֲשֶׂה אֶ֔רֶץ וּ/בַֽל יִפְּל֖וּ יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/018.yaml
  text: We were pregnant[a], we writhed in labor; as it were, we gave birth to wind. We accomplished no deliverance in the earth[c][b], and the inhabitants of the world were not born.
translation:
  language: ru
  text: Мы были беременны[a], мучились в родах и словно родили ветер[b]. Мы не совершили на земле избавлений, и жители мира не пали[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы зачали».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дыхание» или «дух»; еврейское слово может иметь значения «ветер», «дыхание» и «дух».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «жители мира не появились на свет» либо «не родились». Обычно этот глагол означает «падать», но здесь его иногда понимают как продолжение образа родов.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָרִינוּ
  choice: мы были беременны
  rationale: Форма глагола הרה обозначает зачатие или наступившую беременность. Основной вариант естественно начинает последовательность «беременность — родовые муки — рождение», а значение «зачали» сохранено в сноске.
- source_word: חַ֔לְנוּ
  choice: мучились в родах
  rationale: В контексте деторождения глагол передаёт родовые муки и страдание; выбран современный и выразительный русский оборот без архаизма.
- source_word: כְּמוֹ
  choice: словно
  rationale: 'Передаёт сравнительный и несколько иронический оттенок: результат родов оказывается не настоящим плодом, а ветром.'
- source_word: יָלַדְנוּ
  choice: родили
  rationale: Прямое и естественное соответствие обычному глаголу деторождения ילד.
- source_word: רוּחַ
  choice: ветер
  rationale: В образе бесплодных родов «ветер» лучше всего выражает пустой, тщетный результат. Возможные значения «дыхание» и «дух» отмечены в сноске.
- source_word: יְשׁוּעֹת
  choice: избавление
  rationale: Существительное во множественном числе может обозначать спасительные действия или победы. В русском собирательное единственное число «избавление» естественно передаёт общий смысл неосуществлённого спасения.
- source_word: נַעֲשֶׂה אֶרֶץ
  choice: не принесли земле
  rationale: עשה с отвлечённым дополнением допускает значение «совершить, осуществить, принести». Дательный оборот по-русски естественно выражает направленность избавления к земле, не сужая אֶרֶץ до одной страны.
- source_word: יִפְּלוּ
  choice: не пали
  rationale: Сохранено обычное лексическое значение נפל — «падать». Возможное продолжение родовой метафоры — «не родились, не появились на свет» — вынесено в сноску, чтобы не устранять подлинную неоднозначность.
- source_word: יֹשְׁבֵי תֵבֵל
  choice: жители мира
  rationale: Прямое и понятное соответствие устойчивому обозначению людей, населяющих обитаемый мир.
theological_decisions:
- issue: Значение רוּחַ в образе родов
  choice: ветер
  alternative: дыхание; дух
  rationale: 'Контекст говорит о тщетности усилий: родовые муки приводят лишь к «ветру», после чего говорится об отсутствии избавления. Вариант «дух» мог бы без достаточного основания внести положительный или пневматологический смысл.'
- issue: Значение יִפְּלוּ в заключительной строке
  choice: не пали
  alternative: не появились на свет; не родились
  rationale: Основной текст сохраняет обычное значение глагола נפל и не разрешает неоднозначность посредством свободного перефразирования. Вместе с тем родовая образность всего стиха делает значение рождения правдоподобным, поэтому оно явно представлено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства поэтической речи. Образ беременности, родовых мук и бесплодного рождения передан ясно; необычное «не пали» сознательно сохранено ради лексической точности, а контекстуальное толкование разъяснено в сноске.
