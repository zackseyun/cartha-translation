  text: אֹ֥רַח לַ/צַּדִּ֖יק מֵֽישָׁרִ֑ים יָשָׁ֕ר מַעְגַּ֥ל צַדִּ֖יק תְּפַלֵּֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/007.yaml
  text: The path of the righteous is level; O Upright One[a], you make the way of the righteous smooth.
translation:
  language: ru
  text: Путь праведника ровен; о Праведный, Ты выравниваешь стезю праведника.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרַח
  choice: путь
  rationale: Обозначает путь как в конкретном, так и в образном смысле; естественно передаёт метафору жизненного пути.
- source_word: לַצַּדִּיק
  choice: праведника
  rationale: Предлог ל выражает отношение или принадлежность; родительный оборот по-русски естественно передаёт «путь праведника».
- source_word: מֵישָׁרִים
  choice: ровен
  rationale: Формально существительное во множественном числе, здесь предикативно описывает путь как ровный, прямой и лишённый препятствий.
- source_word: יָשָׁר
  choice: Праведный
  rationale: Понято как обращение к Богу ввиду следующего глагола во втором лице единственного числа. «Праведный» сохраняет нравственный оттенок корня и звучит как естественное русское обращение.
- source_word: מַעְגַּל
  choice: стезю
  rationale: Означает колею, тропу или путь. «Стезя» поддерживает поэтический регистр и позволяет избежать повтора слова «путь».
- source_word: צַדִּיק
  choice: праведника
  rationale: Единственное число имеет обобщающий характер; русское «праведника» сохраняет эту форму без добавления гендерно уточняющего существительного.
- source_word: תְּפַלֵּס
  choice: Ты выравниваешь
  rationale: Порода piel глагола פלס в дорожном образе означает ровнять или делать путь гладким; «выравниваешь» прямо передаёт образ и второе лицо.
theological_decisions:
- issue: Следует ли понимать יָשָׁר как обращение к Богу или как определение пути
  choice: 'Обращение: «Праведный»'
  alternative: 'Определение: «прям путь праведника, прямую стезю праведника Ты выравниваешь»'
  rationale: Форма תְּפַלֵּס во втором лице мужского рода единственного числа естественно указывает на обращение к Богу. Однако отсутствие явного показателя звательного обращения допускает чтение יָשָׁר как прилагательного; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. «Стезя» — умеренно возвышенное, но понятное слово; прописные «Ты» и «Праведный» обозначают обращение к Богу. Сохранены дорожный параллелизм и неоднозначность יָשָׁר.
