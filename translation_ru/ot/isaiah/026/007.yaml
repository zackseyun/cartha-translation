    text: 'Или: «Путь праведника прям; прям путь праведника, который Ты выравниваешь». Еврейское יָשָׁר можно понимать не как обращение «о Праведный», а как прилагательное «прям». Однако глагол «Ты выравниваешь» стоит во втором лице, что поддерживает чтение как обращения.'
