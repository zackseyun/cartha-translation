  text: מֵתִים֙ בַּל יִחְי֔וּ רְפָאִ֖ים בַּל יָקֻ֑מוּ לָ/כֵ֤ן פָּקַ֨דְתָּ֙ וַ/תַּשְׁמִידֵ֔/ם וַ/תְּאַבֵּ֥ד כָּל זֵ֖כֶר לָֽ/מוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/014.yaml
  text: The dead do not live[a]; the shades do not rise. Therefore you have punished them and destroyed them[c][b], and you have made all memory of them perish.
translation:
  language: ru
  text: Мёртвые не оживут, тени умерших[a] не восстанут. Поэтому Ты призвал их к ответу[b], уничтожил их и истребил всякую память о них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово означает здесь умерших, обитающих в мире мёртвых, а не древний народ рефаимов.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наказал их». Еврейский глагол может означать «посетить», в том числе с милостью или с судом; здесь контекст указывает на суд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵתִים
  choice: мёртвые
  rationale: Субстантивированное множественное число естественно передаётся русским «мёртвые» и сохраняет собирательный смысл.
- source_word: בַּל יִחְיוּ
  choice: не оживут
  rationale: Поэтическое отрицание בַּל с имперфектом допускает модально-будущее понимание; «не оживут» естественно сочетается с последующим «не восстанут» и не превращает строку в отвлечённое утверждение о состоянии всех умерших.
- source_word: רְפָאִים
  choice: тени умерших
  rationale: В параллелизме с «мёртвыми» слово обозначает обитателей мира мёртвых, а не древний народ рефаимов. «Тени умерших» понятно современному читателю и сохраняет образность.
- source_word: בַּל יָקֻמוּ
  choice: не восстанут
  rationale: Глагол קום означает «встать, подняться»; «восстанут» сохраняет возможный отзвук восстания из смерти, не уточняя его доктринально.
- source_word: לָכֵן
  choice: поэтому
  rationale: Передаёт явную связь следствия с предшествующим утверждением.
- source_word: פָּקַדְתָּ
  choice: призвал их к ответу
  rationale: פקד имеет широкий диапазон значений — «посетить, обратить внимание, взыскать». В контексте последующего уничтожения речь идёт о судебном взыскании; выбранная формулировка выражает это без чрезмерного сужения до одного вида наказания.
- source_word: וַתַּשְׁמִידֵם
  choice: уничтожил их
  rationale: Передаёт сильное значение שׁמד, не вводя философского утверждения об абсолютной аннигиляции.
- source_word: וַתְּאַבֵּד כָּל זֵכֶר לָמוֹ
  choice: истребил всякую память о них
  rationale: Естественно передаёт каузативную конструкцию с אבד и охватывающий оборот כָּל זֵכֶר — полное исчезновение памяти о них.
theological_decisions:
- issue: Значение רְפָאִים
  choice: умершие, представленные как тени в мире мёртвых
  alternative: рефаимы как древний народ
  rationale: Параллелизм с מֵתִים и глаголами «ожить» и «восстать» указывает на умерших, а не на этноним.
- issue: Смысл слов «не восстанут»
  choice: поэтическое утверждение о необратимом падении осуждённых здесь властителей или угнетателей
  alternative: всеобщее отрицание воскресения мёртвых
  rationale: Контекст говорит о конкретных прежних господах, подвергшихся Божьему суду. Перевод сохраняет прямую формулировку и её напряжение, не превращая её во всеобщий догматический тезис.
- issue: Судебный оттенок פָּקַדְתָּ
  choice: призвал их к ответу
  alternative: наказал их; посетил их
  rationale: Последующие глаголы уничтожения определяют посещение как суд, однако формулировка «призвал к ответу» лучше сохраняет широту פקד.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Параллелизм «не оживут — не восстанут» сохранён; обращение к Богу передано традиционным прописным «Ты». Образное «тени умерших» сопровождено пояснением, чтобы исключить смешение с этнонимом.
