base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/013.yaml
  text: O Yahweh our God[a], other lords besides you have ruled over us, but through you alone we make mention of your name.
translation:
  language: ru
  text: Яхве, Бог наш! Другие владыки, кроме Тебя, господствовали над нами, но лишь благодаря Тебе[a] будем мы упоминать Твоё имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но лишь в Тебе будем мы упоминать Твоё имя». Еврейский предлог может иметь значение как «благодаря, посредством», так и «в».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией; звательная интонация выражена в русском синтаксисе и восклицательным знаком.
- source_word: אֱלֹהֵינוּ
  choice: Бог наш
  rationale: При обращении к Яхве форма обозначает единственного Бога; порядок слов сохраняет возвышенную, но понятную молитвенную речь.
- source_word: בְּעָלוּנוּ
  choice: господствовали над нами
  rationale: Глагол выражает осуществление власти или господства и сохраняет смысловую связь с последующим словом «владыки».
- source_word: אֲדֹנִים
  choice: владыки
  rationale: Слово может обозначать как земных правителей, так и иных притязающих на власть господ; перевод не сужает эту неоднозначность.
- source_word: זוּלָתֶךָ
  choice: кроме Тебя
  rationale: 'Естественно передаёт значение исключения: иные по отношению к Яхве владыки.'
- source_word: לְבַד
  choice: лишь
  rationale: Передаёт исключительность и относится к сочетанию с בך.
- source_word: בְּךָ
  choice: благодаря Тебе
  rationale: Предлог ב допускает инструментальное понимание «посредством Тебя / благодаря Тебе», однако также может обозначать сферу — «в Тебе»; альтернативу сохраняет сноска.
- source_word: נַזְכִּיר
  choice: упоминаем
  rationale: Порода hифиль глагола זכר здесь естественно означает «упоминать, называть»; выбран близкий к форме оригинала нейтральный русский эквивалент.
- source_word: שְׁמֶךָ
  choice: Твоё имя
  rationale: Прямой эквивалент, сохраняющий богословскую насыщенность понятия имени без пояснительного расширения.
theological_decisions:
- issue: Кого обозначают «другие владыки»
  choice: Сохранено общее обозначение «другие владыки» без уточнения их природы.
  alternative: Земные или иноземные правители; либо идолы и ложные боги, представленные как господа.
  rationale: Глагол господства хорошо применим к политическим властителям, но контекст допускает и религиозный оттенок; перевод не устраняет эту напряжённость.
- issue: Значение сочетания בך לבד
  choice: «лишь благодаря Тебе»
  alternative: «лишь в Тебе» или «лишь Тобою»
  rationale: Еврейский предлог ב может выражать средство, основание или сферу. В основном тексте выбран естественный инструментальный оборот, а возможное локативно-сферическое понимание вынесено в сноску.
translation_notes:
  register: Современный литературный русский с молитвенно-поэтической интонацией. Формы «владыки» и «господствовали» сохраняют достоинство и лексическую связь оригинала, не звуча чрезмерно архаично. Местоимения обращения к Богу написаны с прописной буквы согласно распространённой русской библейской традиции.
