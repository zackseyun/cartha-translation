  yaml_path: translation/ot/isaiah/026/019.yaml
  text: Your dead will live[a]; my dead bodies will rise. Awake and shout for joy, you who dwell in the dust! For your dew is a dew of lights[c][b], and the earth will cast out the dead.
translation:
  language: ru
  text: Оживут твои мёртвые; мои мёртвые тела восстанут[a]. Пробудитесь и ликуйте, обитатели праха! Ведь твоя роса — роса света[b], и земля исторгнет мёртвых[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте существительное имеет форму единственного числа: «моё мёртвое тело», но следующий глагол стоит во множественном числе. Поэтому это слово, вероятно, употреблено в собирательном смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «роса светов». Выражение неясно; возможны также переводы «роса света» и «сияющая роса». Вероятно, это образ светоносной, животворящей росы.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «тени умерших». Еврейское רְפָאִים может обозначать ушедших из жизни, представляемых как призрачные обитатели мира мёртвых.'
    reason: alternative_reading
