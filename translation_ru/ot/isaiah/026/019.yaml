  choice: Твои мёртвые
  rationale: Сохраняет форму множественного числа с суффиксом 2-го лица мужского рода единственного числа и не уточняет, обращена ли речь к Богу или к Сиону.
- source_word: נְבֵלָתִי
  choice: мои мёртвые тела
  rationale: Передаёт значение «труп, мёртвое тело» и сохраняет суффикс 1-го лица. Множественное число по смыслу согласовано с последующим глаголом во множественном числе; текстовая трудность отмечена в сноске.
- source_word: יְקוּמוּן
  choice: восстанут
  rationale: Естественно передаёт קום в контексте оживления умерших и сохраняет торжественное пророческое звучание.
- source_word: הָקִיצוּ
  choice: Пробудитесь
  rationale: Императив изображает смерть как сон и прямо обращён к лежащим в прахе.
- source_word: וְרַנְּנוּ
  choice: ликуйте
  rationale: Передаёт громкую радостную хвалу без обязательного уточнения, идёт ли речь о пении или возгласах.
- source_word: שֹׁכְנֵי עָפָר
  choice: обитатели праха
  rationale: Сохраняет метафору пребывания умерших в прахе и звучит естественно в русском поэтическом пророчестве.
- source_word: טַל אוֹרֹת
  choice: роса света
  rationale: Сохраняет образ светоносной, животворящей росы, избегая неестественного русского «роса светов»; грамматическая и смысловая неоднозначность вынесена в сноску.
- source_word: רְפָאִים
  choice: мёртвых
  rationale: В данном контексте обозначает умерших, пребывающих в подземном мире, а не народ рефаимов. Более образное «тени умерших» указано в сноске.
- source_word: תַּפִּיל
  choice: исторгнет
  rationale: 'Передаёт каузативную, энергичную картину: земля выпускает из себя погребённых, не добавляя образ родов, которого прямо нет в тексте.'
theological_decisions:
- issue: Воскресение в поэтико-пророческом контексте
  choice: Сохранить прямые образы оживления и восстания тел умерших.
  alternative: Истолковать весь стих только как метафору национального восстановления.
  rationale: Последовательность образов — мёртвые оживут, тела восстанут, обитатели праха пробудятся, земля исторгнет умерших — поддерживает язык реального воскресения, хотя корпоративная надежда Израиля также остаётся частью контекста.
- issue: Принадлежность «моих мёртвых тел»
  choice: Сохранить притяжательное местоимение 1-го лица.
  alternative: Исправить или сгладить как «их тела» либо «Твои тела».
  rationale: Масоретский текст содержит суффикс 1-го лица единственного числа; неопределённость личности говорящего не следует устранять переводческой гармонизацией.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Формы «ликуйте», «обитатели праха» и «исторгнет» сохраняют поэтическую силу, оставаясь понятными современному читателю. Заглавные буквы в «Твои/Твоя» отражают вероятное обращение к Богу, но сам перевод не добавляет имени адресата.
