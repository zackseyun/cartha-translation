source:
  edition: WLC
  text: נַפְשִׁ֤/י אִוִּיתִ֨י/ךָ֙ בַּ/לַּ֔יְלָה אַף רוּחִ֥/י בְ/קִרְבִּ֖/י אֲשַֽׁחֲרֶ֑/ךָּ כִּ֞י כַּ/אֲשֶׁ֤ר מִשְׁפָּטֶ֨י/ךָ֙ לָ/אָ֔רֶץ צֶ֥דֶק לָמְד֖וּ יֹשְׁבֵ֥י תֵבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/009.yaml
  text: My soul has desired you in the night[a]; indeed, my spirit within me seeks you early. For when your judgments are in the earth[c][b], the inhabitants of the world learn righteousness.
translation:
  language: ru
  text: Душа моя жаждала Тебя ночью; и дух мой внутри меня ищет Тебя на заре[a]. Ибо, когда Твои суды совершаются на земле[b], жители мира учатся праведности[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «настойчиво ищет Тебя»; еврейский глагол может указывать на поиски на заре и, шире, на ревностное стремление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «когда Твои суды — на земле».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Душа моя
  rationale: Сохраняет поэтическое обозначение внутреннего «я» и параллелизм с «дух мой», не сводя выражение к простому местоимению.
- source_word: אִוִּיתִיךָ
  choice: жаждет Тебя
  rationale: Передаёт сильное желание и устремлённость к Богу; в русском настоящая форма естественно выражает продолжающееся состояние в данном поэтическом контексте.
- source_word: בַּלַּיְלָה
  choice: ночью
  rationale: Прямой и естественный русский эквивалент временного оборота.
- source_word: אַף
  choice: и
  rationale: Передаёт добавочно-усилительную связь между параллельными строками без тяжеловесного русского усилителя.
- source_word: רוּחִי בְקִרְבִּי
  choice: дух мой во мне
  rationale: Сохраняет внутренний, личный смысл и формальный параллелизм с «душа моя».
- source_word: אֲשַׁחֲרֶךָּ
  choice: ищет Тебя с рассвета
  rationale: Сохраняет образ раннего утра, заложенный в глаголе שׁחר, и вместе с тем допускает смысл ревностного поиска; эта неоднозначность отмечена в сноске.
- source_word: כִּי כַּאֲשֶׁר
  choice: Ведь когда
  rationale: Ясно передаёт одновременно обоснование предыдущего высказывания и временное условие следующей мысли.
- source_word: מִשְׁפָּטֶיךָ
  choice: Твои суды
  rationale: Сохраняет судебно-нравственный диапазон מִשְׁפָּט и прямое указание на Божьи решения или действия суда.
- source_word: לָאָרֶץ
  choice: действуют на земле
  rationale: В еврейском тексте сказуемое отсутствует; «действуют» естественно раскрывает присутствие и проявление Божьих судов, не добавляя идеи их прибытия.
- source_word: צֶדֶק
  choice: праведности
  rationale: Передаёт нравственно-богословский смысл соответствия правильному перед Богом, сохраняя «справедливость» как реальную альтернативу в сноске.
- source_word: לָמְדוּ
  choice: учатся
  rationale: Настоящее время естественно выражает общеистинный, повторяющийся результат Божьих судов.
- source_word: יֹשְׁבֵי תֵבֵל
  choice: жители мира
  rationale: Кратко и естественно передаёт людей, населяющих весь обитаемый мир, сохраняя универсальный охват выражения.
theological_decisions:
- issue: Значение צֶדֶק в контексте Божьих судов
  choice: праведности
  alternative: справедливости
  rationale: «Праведность» сохраняет широкий нравственный и богословский смысл того, чему люди учатся через Божьи суды; «справедливость» также лексически возможна и отмечена в сноске, чтобы не устранять смысловое напряжение.
- issue: Характер Божьих מִשְׁפָּטִים на земле
  choice: Твои суды действуют на земле
  alternative: Твои суды — на земле
  rationale: Добавленное по-русски сказуемое раскрывает эллиптическую еврейскую конструкцию как присутствие и осуществление судов, но не уточняет, являются ли они постановлениями, проявлениями справедливости или карающими действиями.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены параллелизм «душа моя / дух мой», ночной и рассветный образы, а также краткая причинно-временная структура стиха. Заглавное «Тебя/Твои» употреблено как традиционное уважительное обращение к Богу.
