  text: Trust in the LORD forever, for in Yah, the LORD, is an everlasting rock.
translation:
  language: ru
  text: Полагайтесь на ГОСПОДА вовеки, ибо в Яхе, ГОСПОДЕ, — Скала веков.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ях — краткая форма имени Яхве. Еврейское выражение можно также понять так: «ибо Ях, ГОСПОДЬ, — Скала веков».'
    reason: Поясняет краткую форму божественного имени и сохраняет синтаксическую неоднозначность выражения בְּיָהּ יְהוָה.
lexical_decisions:
- source_word: בִּטְחוּ
  choice: Полагайтесь
  rationale: Форма множественного числа повелительного наклонения выражает устойчивое доверие и опору, а не только разовый акт веры.
- source_word: בַיהוָה
  choice: на ГОСПОДА
  rationale: Передаёт конструкцию с предлогом ב после глагола בטח естественным русским оборотом; тетраграмматон представлен традиционным титулом прописными буквами.
- source_word: עֲדֵי עַד
  choice: вовеки
  rationale: Кратко и возвышенно передаёт усиленное указание на бесконечную продолжительность.
- source_word: בְּיָהּ יְהוָה
  choice: в Ях, ГОСПОДЕ
  rationale: Сохраняет предлог ב, краткую форму божественного имени יָהּ и следующее за ней יהוה, не устраняя трудность и неоднозначность еврейской конструкции.
- source_word: צוּר עוֹלָמִים
  choice: вечная скала
  rationale: Сохраняет метафору надёжности и защиты; множественная форма עוֹלָמִים имеет здесь временное значение непреходящей вечности.
theological_decisions:
- issue: Синтаксис выражения בְּיָהּ יְהוָה
  choice: «в Ях, ГОСПОДЕ, — вечная скала»
  alternative: «Ях, ГОСПОДЬ, — вечная скала»
  rationale: Основной текст сохраняет явно присутствующий предлог ב и соответствует возможному пониманию как указания на основание доверия «в Господе». В примечании отмечена грамматически возможная трактовка ב как beth essentiae, при которой связка имён становится подлежащим.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Вовеки» и «ибо» поддерживают достоинство поэтической строки, а «полагайтесь» остаётся понятным современному читателю. Необычность оборота «в Ях, ГОСПОДЕ» сознательно сохранена и разъяснена в примечании.
