revisions:
- from: Господи, рука Твоя поднята, но они не видят. Увидят и постыдятся, увидев Твою ревность о народе[a]; и огонь, предназначенный Твоим врагам[b], пожрёт их.
  to: Господи, рука Твоя поднята, но они не видят. Увидят ревность о народе и устыдятся; даже огонь поглотит Твоих врагов[a].
  rationale: Устранены повтор «увидят … увидев» и не выраженное прямо в исходнике местоимение «Твою». Частица אַף передана усилительным «даже». Сноска к «ревности о народе» сохранена, но её якорь перенесён непосредственно к этому выражению; сноска об альтернативном понимании «огня» поставлена у заключительной конструкции.
