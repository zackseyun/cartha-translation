  source_fidelity: Первая часть в целом передаёт смысл точно, но оборот «постыдятся, увидев» неоправданно дублирует глагол «увидят». В тексте нет явного притяжательного суффикса при «ревности», поэтому «Твою ревность» несколько сильнее конкретизирует исходник. Заключительную конструкцию лучше передать так, чтобы огонь оставался субъектом, а враги — объектом глагола.
  naturalness: «Постыдятся, увидев Твою ревность» звучит тяжеловесно из-за повтора. Исправленный вариант сохраняет возвышенный, но современный литературный строй и делает синтаксис яснее.
  terminology: «Господи» уместно в звательном обращении. «Ревность о народе» сохраняет библейский регистр и не навязывает явно выраженного в русском тексте владельца ревности; альтернативное понимание должно остаться в сноске. «Поглотит» естественно для огня и несколько нейтральнее образного «пожрёт».
