base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/011.yaml
  text: O Yahweh[a], your hand is lifted up, but they do not see. They will see and be put to shame by the zeal for your people; indeed[b], the fire for your enemies will consume them.
translation:
  language: ru
  text: Господи, рука Твоя поднята, но они не видят. Увидят ревность о народе и устыдятся; даже огонь поглотит Твоих врагов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огонь Твоих врагов». Еврейская конструкция допускает и такое понимание, хотя контекст Божьего суда поддерживает перевод в основном тексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: Традиционная и естественная русская передача имени YHWH в звательной функции; сохраняет достоинство обращения.
- source_word: רָמָה יָדְךָ
  choice: рука Твоя поднята
  rationale: Сохраняет образ поднятой руки как знака явного действия или готовности действовать, не конкретизируя его сверх текста.
- source_word: בַּל יֶחֱזָיוּן
  choice: но они не видят
  rationale: Прямая передача отрицания и глагола зрительного восприятия; союз «но» естественно выражает контраст контекста.
- source_word: יֶחֱזוּ וְיֵבֹשׁוּ
  choice: увидят и постыдятся
  rationale: 'Будущее значение создаёт риторический перелом: сейчас не видят, но впоследствии увидят; «постыдятся» сохраняет лаконичность еврейского текста.'
- source_word: קִנְאַת עָם
  choice: Твою ревность о народе
  rationale: קִנְאָה здесь передаёт горячую, ревностную заботу; притяжательность подразумевается контекстом, однако компактная еврейская конструкция допускает и иное понимание, отмеченное в сноске.
- source_word: אַף
  choice: и
  rationale: В данном месте частица вводит усиленное продолжение мысли; русское «и» сохраняет связь без стилистически тяжеловесного пояснения.
- source_word: אֵשׁ צָרֶיךָ
  choice: огонь, предназначенный Твоим врагам
  rationale: Сохраняет огонь как субъект глагола и понимает генитивную связь как направленность суда против врагов; альтернативная конструкция отмечена в сноске.
- source_word: תֹאכְלֵם
  choice: пожрёт их
  rationale: С огнём в роли субъекта «пожрёт» естественно и образно передаёт буквальное «съест/поглотит».
theological_decisions:
- issue: Толкование קִנְאַת עָם
  choice: Божья ревность о народе
  alternative: ревность народа
  rationale: Контекст Божьего действия и противопоставление Его врагам поддерживают понимание как ревностной заботы Бога о народе, но сжатый синтаксис не исключает субъектного генитива; неоднозначность сохранена в сноске.
- issue: Связь אֵשׁ с צָרֶיךָ
  choice: огонь, предназначенный врагам Бога
  alternative: огонь врагов Бога
  rationale: Контекст суда и местоименный суффикс в תֹאכְלֵם поддерживают понимание огня как кары, которая поглотит врагов; формальная компактность еврейского допускает альтернативу, указанную в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейским регистром. Прописные формы местоимений при обращении к Богу соответствуют принятой русской религиозной письменной традиции. Синтаксическая сжатость и образность еврейского текста по возможности сохранены.
