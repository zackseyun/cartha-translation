id: ISA.26.10
reference: Isaiah 26:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יֻחַ֤ן רָשָׁע֙ בַּל לָמַ֣ד צֶ֔דֶק בְּ/אֶ֥רֶץ נְכֹח֖וֹת יְעַוֵּ֑ל וּ/בַל יִרְאֶ֖ה גֵּא֥וּת יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/010.yaml
  text: Though favor is shown to the wicked[a], he does not learn righteousness; in a land of uprightness he acts unjustly[e][d][c][b], and he does not see the majesty of Yahweh.
translation:
  language: ru
  text: Хотя нечестивому оказывают милость[a], он не учится праведности[b]; в стране справедливости[c] он поступает несправедливо и не видит[d] величия[e] Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если нечестивому оказывают милость». Начальную часть еврейского текста можно понимать не как уступительную, а как условную.'
    reason: alternative_reading
  - marker: b
    text: «Праведность» можно также перевести как «справедливость».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в праведной стране»; «в стране правоты».'
    reason: lexical_alternative
  - marker: d
    text: Здесь «видеть» может означать «осознавать» или «признавать».
    reason: lexical_alternative
  - marker: e
    text: 'Или: «возвышенность»; «величавость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻחַן
  choice: Хотя ... оказывают милость
  rationale: Хофал глагола חנן выражает оказанную милость или благосклонность. Безличная пассивная конструкция естественна по-русски, а «хотя» передаёт наиболее вероятный уступительный смысл в контексте.
- source_word: רָשָׁע
  choice: нечестивому
  rationale: Субстантивированное прилагательное в единственном числе имеет обобщающий смысл; русское «нечестивому» сохраняет эту характеристику без добавления слова «человек».
- source_word: בַּל לָמַד צֶדֶק
  choice: он не учится праведности
  rationale: בַּל выражает отрицание, לָמַד в породе qal — «учиться», а צֶדֶק здесь обозначает праведность как нравственную норму, не сводимую лишь к судебной справедливости.
- source_word: בְּאֶרֶץ נְכֹחוֹת
  choice: в земле правоты
  rationale: Множественное абстрактное נְכֹחוֹת передаёт прямоту, правильность и справедливый порядок. «Земля правоты» сохраняет образ и звучит естественнее, чем буквальное «земля прямот».
- source_word: יְעַוֵּל
  choice: поступает несправедливо
  rationale: Пиэль от עול означает действовать неправедно или несправедливо; выбранный вариант сохраняет этико-правовой оттенок.
- source_word: וּבַל יִרְאֶה
  choice: и не видит
  rationale: Сохранён конкретный образ глагола ראה «видеть», при этом контекст допускает смысл «осознавать, признавать».
- source_word: גֵּאוּת
  choice: величия
  rationale: Слово обозначает возвышенность, величие или величавость. «Величие» естественно применительно к Богу и не подменяет термин более специфическим «слава».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Уступительное или условное значение начальной части
  choice: 'Уступительное: «Хотя нечестивому оказывают милость»'
  alternative: 'Условное: «Если нечестивому оказывают милость»'
  rationale: Контекст противопоставляет оказанную милость упорному нежеланию нечестивого учиться праведности. Уступительное прочтение лучше передаёт риторический контраст, однако еврейская форма сама по себе допускает условное понимание.
- issue: Смысл «видеть величие Яхве»
  choice: Сохранить образ «видит», не поясняя его внутри текста
  alternative: 'Передать толковательно: «не осознаёт» или «не признаёт величия Яхве»'
  rationale: Буквальный зрительный образ значим и допускает как восприятие, так и признание. Толкование вынесено в примечание, чтобы не устранять смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Синтаксический параллелизм оригинала сохранён; архаизмы и конфессионально окрашенные толкования не добавлены.
