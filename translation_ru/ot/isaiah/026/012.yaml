source:
  edition: WLC
  text: יְהוָ֕ה תִּשְׁפֹּ֥ת שָׁל֖וֹם לָ֑/נוּ כִּ֛י גַּ֥ם כָּֽל מַעֲשֵׂ֖י/נוּ פָּעַ֥לְתָּ לָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/012.yaml
  text: O Yahweh[a], you will establish peace for us[b], for indeed you have accomplished all our works for us.
translation:
  language: ru
  text: Яхве, Ты установишь для нас мир[a], ведь и все наши дела Ты совершил для нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «шалом» может означать также благополучие и целостность.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «Ты совершил все наши дела в нас»; однако «для нас» точнее передаёт обычное значение стоящего здесь предлога.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, поскольку в еврейском тексте стоит יהוה; обращение естественно выражено русской звательной интонацией без добавления отдельного междометия.
- source_word: תִּשְׁפֹּת
  choice: установишь
  rationale: Глагол означает назначить, положить или утвердить; «установишь» естественно передаёт созидательное действие Бога и форму будущего времени.
- source_word: שָׁלוֹם
  choice: мир
  rationale: «Мир» — основное и контекстуально уместное соответствие; более широкий смысл благополучия и целостности отмечен в сноске.
- source_word: לָנוּ
  choice: для нас
  rationale: 'При глаголе «установишь» предлог ל выражает пользу или предназначение: мир устанавливается для народа.'
- source_word: כִּי גַּם
  choice: ведь и
  rationale: «Ведь» вводит основание предыдущего утверждения, а «и» сохраняет усилительно-присоединительный оттенок גם, не делая его чрезмерно категоричным.
- source_word: כָּל מַעֲשֵׂינוּ
  choice: все наши дела
  rationale: Формально прозрачное выражение сохраняет возможность понимать מעשים как поступки, труды или свершения, не сужая смысл.
- source_word: פָּעַלְתָּ
  choice: Ты совершил
  rationale: Глагол פעל указывает на осуществление или совершение; прошедшее совершенное «совершил» ясно передаёт завершённое Божье действие.
- source_word: לָּנוּ
  choice: для нас
  rationale: Наиболее прямое понимание ל здесь — действие ради народа или в его пользу; возможное толкование «в нас» сохранено в сноске.
theological_decisions:
- issue: Соотношение человеческих дел и Божьего действия
  choice: Все дела народа в конечном счёте представлены как совершённые Богом для него.
  alternative: Бог содействовал делам народа; Бог совершил всё для народа; Бог совершил все их дела в них самих.
  rationale: Перевод сохраняет напряжение между выражением «наши дела» и утверждением, что их совершил Бог, не превращая стих в более узкую доктринальную формулу. «Для нас» непосредственно передаёт значение предлога ל, тогда как вариант «в нас» отмечен как возможное толкование.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической интонацией. Синтаксис остаётся ясным и достоинственным; повторение «Ты» подчёркивает Божье действие, а выражение «ведь и» сохраняет причинный и присоединительно-усилительный оттенок оригинала.
