- source_word: מוּסָרְךָ
  choice: Твоё наказание
  rationale: В контексте бедствия слово указывает на Божье исправляющее воздействие; «наказание» понятно современному читателю, а педагогический оттенок отражён в сноске.
- source_word: לָמוֹ
  choice: их постигало
  rationale: Предлог с местоименным суффиксом передан естественной русской конструкцией, обозначающей, что Божье наказание было обращено на них.
