  yaml_path: translation/ot/isaiah/026/015.yaml
  text: You have increased the nation[a], O Yahweh; you have increased the nation; you have gained glory[b]; you have extended all the borders of the land.
translation:
  language: ru
  text: 'Ты умножил народ, Яхве!

    Ты умножил народ;

    Ты прославился[a],

    далеко раздвинул все границы страны[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты был прославлен», «Тебе воздали честь» или «Ты явил Свою славу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все края земли». Еврейское выражение может обозначать края или пределы земли; в данном контексте, вероятно, имеются в виду границы страны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַפְתָּ
  choice: Ты умножил
  rationale: Глагол יסף с предлогом ל при собирательном существительном выражает увеличение. «Умножил» естественно сочетается с «народ» и позволяет сохранить повтор исходного текста.
- source_word: לַגּוֹי
  choice: народ
  rationale: גּוֹי обозначает народ или нацию. В данном поэтическом контексте русское «народ» звучит естественнее и не вносит современного политического оттенка слова «нация».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом.
- source_word: נִכְבָּדְתָּ
  choice: Ты прославился
  rationale: Нифаль от כבד допускает результативное, пассивное или возвратно-стативное понимание. «Прославился» кратко передаёт проявившуюся славу, не уточняя её источник; другие допустимые оттенки приведены в сноске.
- source_word: רִחַקְתָּ
  choice: далеко раздвинул
  rationale: Форма от רחק означает сделать далёким, отдалить. В сочетании с пределами земли речь, вероятнее всего, идёт о расширении территории; «далеко раздвинул» сохраняет образ удаления рубежей.
- source_word: כָּל קַצְוֵי אָרֶץ
  choice: все границы страны
  rationale: קצה может означать край, предел или границу, а אָרֶץ — страну, землю или землю как мир. Параллель с умножением народа поддерживает территориальный смысл, при этом более широкий вариант сохранён в сноске.
theological_decisions:
- issue: Значение формы נִכְבָּדְתָּ
  choice: Ты прославился
  alternative: Ты был прославлен; Тебе воздали честь; Ты явил Свою славу
  rationale: Еврейская форма допускает несколько близких оттенков и не требует однозначно определять действующее лицо или точный характер прославления. Основной текст сохраняет эту сдержанность, а варианты отмечают подлинную неоднозначность.
- issue: Масштаб אָרֶץ
  choice: страна
  alternative: земля; вся земля
  rationale: Упоминание увеличения народа и удаления его рубежей указывает на территорию страны, а не обязательно на весь мир. Однако лексически возможное более широкое значение отражено в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтическим параллелизмом и сохранённым дословным повтором. «О Яхве» передаёт обращение без архаизации; строки разбиты по смысловым частям еврейского стиха.
