  source_fidelity: 'Смысл и референт «её» переданы верно: суффикс женского рода продолжает образ униженного города из предыдущего стиха. Однако פַּעֲמֵי означает «шаги, поступь, следы шагов», а не буквально «стопы». Кроме того, сочетание «нога — ноги» после единственного подлежащего в русском звучит синтаксически сбивчиво.'
  naturalness: '«Её топчет нога — ноги бедняка, стопы нуждающихся» сохраняет образ, но не вполне естественно для современного литературного русского: тире соединяет несогласованные по числу номинативные группы, а «стопы нуждающихся» слабо передаёт значение «шаги».'
  terminology: «Бедного» для עָנִי и «нуждающихся» для דַּלִּים — допустимое и уместное различение близких терминов. «Попирают» хорошо передаёт רמס в возвышенно-поэтическом, но понятном современном регистре.
