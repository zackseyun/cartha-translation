    rationale: Формально она начинается с единственного подлежащего («нога»), но затем поясняется множественным числом («ноги»), что воспринимается как сбой, а не как прозрачный поэтический параллелизм. Множественное «попирают ноги» естественно передаёт собирательный образ оригинала.
