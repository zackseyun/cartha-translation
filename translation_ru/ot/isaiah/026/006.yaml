  yaml_path: translation/ot/isaiah/026/006.yaml
  text: The foot tramples it— the feet of the poor[b][a], the steps of the needy.
translation:
  language: ru
  text: Её попирают ноги бедного, шаги нуждающихся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Её будут попирать». Еврейская глагольная форма в этом контексте может иметь значение будущего времени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְמְסֶנָּה
  choice: её топчет
  rationale: Глагол רמס означает «топтать, попирать»; форма 3-го лица женского рода единственного числа с местоименным суффиксом женского рода отсылает к униженному городу из предыдущего стиха. Настоящее время передаёт живость поэтической картины, хотя по контексту возможно будущее.
- source_word: רָגֶל
  choice: нога
  rationale: Единственное число употреблено собирательно и затем раскрывается параллельными выражениями.
- source_word: רַגְלֵי עָנִי
  choice: ноги бедняка
  rationale: עָנִי может обозначать бедного, угнетённого или смиренного человека; «бедняк» естественно передаёт здесь образ общественно униженного человека и сохраняет единственное число.
- source_word: פַּעֲמֵי
  choice: стопы
  rationale: Слово обозначает шаги или стопы; «стопы» сохраняет телесный образ и поэтический параллелизм с «ногами».
- source_word: דַלִּים
  choice: нуждающихся
  rationale: דַלִּים обозначает слабых, неимущих, бедных или людей низкого положения. «Нуждающиеся» отличает это слово от עָנִי, не устраняя смыслового пересечения.
theological_decisions:
- issue: К чему относится местоименный суффикс женского рода в תִּרְמְסֶנָּה
  choice: К униженному городу из непосредственного контекста (ст. 5), передано местоимением «её».
  alternative: Оставить объект менее определённым либо повторить «город».
  rationale: Женский род суффикса согласуется с קִרְיָה, «город», в предыдущем стихе. Местоимение сохраняет связность текста без избыточного пояснения.
- issue: Временное значение תִּרְמְסֶנָּה
  choice: 'Поэтическое настоящее: «топчет».'
  alternative: 'Будущее: «будет топтать» или «растопчет».'
  rationale: Имперфект допускает будущее значение, но в пророческой поэзии может живо изображать происходящее. Неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, телесной образности и параллелизма еврейской поэзии. «Стопы» выбрано как достойное поэтическое слово, понятное современному читателю; тире передаёт пояснительное развёртывание образа.
