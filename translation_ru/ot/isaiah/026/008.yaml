  text: אַ֣ף אֹ֧רַח מִשְׁפָּטֶ֛י/ךָ יְהוָ֖ה קִוִּינ֑וּ/ךָ לְ/שִׁמְ/ךָ֥ וּֽ/לְ/זִכְרְ/ךָ֖ תַּאֲוַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/008.yaml
  text: Indeed[a], in the path of your judgments, O Yahweh, we have waited for you[b]; for your name and your remembrance are the desire of the soul.
translation:
  language: ru
  text: Да, на пути Твоих судов[a], Яхве, мы ждали Тебя; Твоего имени и памяти о Тебе[b] жаждет душа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоей справедливости»; или: «Твоих установлений».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «памятования о Тебе»; еврейское слово также может означать «поминание» или «память».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Да
  rationale: Частица усиливает и подтверждает высказывание; русское «Да» естественно передаёт этот поэтический акцент, не сводя значение только к добавочному «также».
- source_word: אֹרַח
  choice: путь
  rationale: Сохраняет образ пути, связывающий этот стих с ближайшим контекстом, и естественно сочетается с переносным смыслом Божьих судов.
- source_word: מִשְׁפָּטֶיךָ
  choice: Твои суды
  rationale: מִשְׁפָּט может обозначать суды, установления или справедливый порядок. «Суды» сохраняет широту слова и его связь с Божьими действиями Судьи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: קִוִּינוּךָ
  choice: мы ждали Тебя
  rationale: Глагол קוה означает ожидание, обычно исполненное надежды. «Ждали Тебя» прямо передаёт действие и его личный объект, не исключая оттенка упования.
- source_word: לְשִׁמְךָ
  choice: Твоего имени
  rationale: Сохраняет ёмкий библейский образ имени как явленного имени и известности Бога; управление перестроено в соответствии с естественным русским выражением «жаждать чего-либо».
- source_word: וּלְזִכְרְךָ
  choice: памяти о Тебе
  rationale: זֵכֶר допускает значения памяти, памятования и памятного имени. «Память о Тебе» ясно и естественно передаёт основное значение, сохраняя параллель с Божьим именем.
- source_word: תַּאֲוַת נָפֶשׁ
  choice: жаждет душа
  rationale: Буквально сочетание выражает сильное «желание души». Глагольная русская формулировка сохраняет интенсивность стремления и поэтическое единственное число «душа».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение מִשְׁפָּטֶיךָ
  choice: Твои суды
  alternative: Твоя справедливость; Твои установления
  rationale: Контекст допускает как Божий справедливый порядок, так и Его судебные действия. «Суды» не устраняет эту смысловую напряжённость.
- issue: Субъект заключительной строки
  choice: душа
  alternative: наша душа; наши души
  rationale: В исходном тексте стоит единственное число без выраженного притяжательного местоимения. Сохранено обобщённо-поэтическое «душа», хотя по контексту оно может выражать общее стремление говорящих.
translation_notes:
  register: Современный литературный русский язык с кратким и возвышенным поэтическим строем. Синтаксис слегка инвертирован ради параллелизма, но остаётся понятным; формы местоимений, относящихся к Богу, даны с прописной буквы.
