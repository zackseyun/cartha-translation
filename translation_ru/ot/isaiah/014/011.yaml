revisions:
- from: В шеол низвергнуто твоё великолепие — шум твоих арф. Под тобой постелены личинки, и черви — твоё покрывало.
  to: В шеол низвергнуты твоё великолепие и звучание твоих арф. Под тобой расстелены личинки, а черви — твоё покрывало.
  rationale: Перестроено первое предложение, чтобы оба существительных были явно соединены как однородные компоненты еврейского высказывания. «Звучание» лучше соответствует музыкальному контексту הֶמְיָה, а «расстелены» сохраняет метафору погребального ложа. Значение и регистр остальных решений сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:32:00Z'
review_pass:
  verdict: revise
  source_fidelity: Требуется уточнение синтаксической связи в первой строке. В еврейском тексте «твоё великолепие/пышность» и «звучание твоих арф» — два координированных компонента, низведённые в шеол. Тире в черновике делает второе выражение пояснением к первому, что меняет связь. «Расстелены» точнее передаёт образ יֻצַּע как устройства ложа, чем «постелены».
  naturalness: Исправленный вариант сохраняет современную литературную библейскую интонацию. «Звучание арф» естественнее и музыкально точнее, чем «шум арф», хотя последнее лексически возможно. «Черви — твоё покрывало» сохраняет лаконичный образ и хорошо звучит по-русски.
  terminology: '«Шеол» уместно сохраняет древнееврейский термин без отождествления его с адом. «Великолепие» допустимо для גָּאוֹן в контексте царской пышности; оно не исключает контекстуального оттенка надменного возвышения. «Личинки» обоснованно передаёт רִמָּה, а «черви» — תּוֹלֵעָה. В английском аудиторском следе метки сносок размещены несогласованно: [c] стоит после «maggots», хотя поясняет «harps», а [b] — после «beneath you», хотя поясняет Sheol; это не должно переноситься в русский текст.'
  issues:
  - severity: medium
    issue: Тире между «твоё великолепие» и «шум твоих арф» ошибочно создаёт пояснительную связь.
    rationale: הֶמְיַת נְבָלֶיךָ является вторым членом перечисления после גְּאוֹנֶךָ, а не приложением или расшифровкой «великолепия».
  - severity: low
    issue: «Постелены личинки» менее точно воспроизводит образ расстилания ложа.
    rationale: יֻצַּע употреблён в образе приготовленного под телом ложа; «расстелены» передаёт это непосредственно и естественно.
  - severity: low
    issue: В английском audit trail неверно сопоставлены и размещены сноски [b] и [c].
    rationale: 'Это структурный дефект английской вспомогательной записи: [c] относится к арфам/лирам, [b] — к Шеолу. В представленном русском черновике сносочных якорей нет, поэтому исправление русского текста не требует искусственно добавлять сноски.'
  revised_text: В шеол низвергнуты твоё великолепие и звучание твоих арф. Под тобой расстелены личинки, а черви — твоё покрывало.
