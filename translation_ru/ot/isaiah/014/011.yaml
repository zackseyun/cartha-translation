  text: הוּרַ֥ד שְׁא֛וֹל גְּאוֹנֶ֖/ךָ הֶמְיַ֣ת נְבָלֶ֑י/ךָ תַּחְתֶּ֨י/ךָ֙ יֻצַּ֣ע רִמָּ֔ה וּ/מְכַסֶּ֖י/ךָ תּוֹלֵעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/011.yaml
  text: Your pomp has been brought down to Sheol[a], the sound of your harps; maggots are spread out beneath you[c][b], and worms are your covering.
translation:
  language: ru
  text: В шеол низвергнуты твоё великолепие и звучание твоих арф. Под тобой расстелены личинки, а черви — твоё покрывало.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּרַד
  choice: низвергнуто
  rationale: Хофал от ירד выражает принудительное нисхождение; краткая пассивная форма сохраняет торжественный и резкий тон насмешки.
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет древнееврейское представление о мире мёртвых и не сводит его только к могиле или к более позднему понятию ада.
- source_word: גְּאוֹנֶךָ
  choice: твоё великолепие
  rationale: גאון может обозначать величие, пышность и гордыню. В контексте падения царя «великолепие» передаёт царскую пышность, не устраняя оттенка надменного возвышения.
- source_word: הֶמְיַת נְבָלֶיךָ
  choice: шум твоих арф
  rationale: הֶמְיָה означает шум или звучание, а נבל — древний струнный инструмент типа арфы или лиры. «Шум» уместно передаёт умолкшую пышность царского двора.
- source_word: יֻצַּע רִמָּה
  choice: постелены личинки
  rationale: Глагол יצע описывает расстилание ложа; перевод сохраняет образ жуткой постели. רִמָּה обозначает личинок, связанных с разложением тела.
- source_word: וּמְכַסֶּיךָ תּוֹלֵעָה
  choice: и черви — твоё покрывало
  rationale: Именная конструкция сохраняет параллелизм между ложем внизу и покрывалом сверху; תּוֹלֵעָה передано общим словом «черви».
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: «Шеол» сохраняет образ подземного мира умерших в древнееврейском тексте, не ограничивая смысл физической могилой и не привнося позднейшее учение об аде.
- issue: Нравственный или царственный оттенок גְּאוֹן
  choice: великолепие
  alternative: гордыня; пышность; величие
  rationale: Контекст непосредственно изображает крушение царской роскоши и музыки. «Великолепие» сохраняет этот образ, тогда как отрицательный оттенок надменности остаётся доступен из общего контекста насмешки.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной библейской интонацией. Синтаксический параллелизм и образы погребального ложа сохранены; архаизмы сведены к содержательно необходимому термину «шеол».
