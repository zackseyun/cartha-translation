source:
  edition: WLC
  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ בִֽ/לְבָבְ/ךָ֙ הַ/שָּׁמַ֣יִם אֶֽעֱלֶ֔ה מִ/מַּ֥עַל לְ/כֽוֹכְבֵי אֵ֖ל אָרִ֣ים כִּסְאִ֑/י וְ/אֵשֵׁ֥ב בְּ/הַר מוֹעֵ֖ד בְּ/יַרְכְּתֵ֥י צָפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/013.yaml
  text: But you said in your heart[a], ‘I will ascend to the heavens; I will raise my throne above the stars of God, and I will sit on the mount of assembly in the far reaches of the north.’
translation:
  language: ru
  text: 'Но ты сказал в своём сердце: «Взойду на небеса, выше звёзд Бога вознесу свой престол и воссяду на горе собрания, в дальних пределах севера[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «в дальних пределах Цафона», если צָפוֹן здесь — имя космической горы, известной в древней ближневосточной традиции.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: Но ты
  rationale: Союз с местоимением выражает контраст с предшествующим контекстом; «Но ты» естественно передаёт это противопоставление.
- source_word: אָמַרְתָּ בִלְבָבְךָ
  choice: сказал в своём сердце
  rationale: Сохранён прозрачный древнееврейский образ внутренней речи, при этом фраза естественна для литературного русского языка.
- source_word: הַשָּׁמַיִם אֶעֱלֶה
  choice: Взойду на небеса
  rationale: «Небеса» передаёт форму множественного числа и возвышенный контекст, а «взойду» — направленное движение вверх и самовозвеличивающее притязание.
- source_word: מִמַּעַל לְכוֹכְבֵי אֵל
  choice: выше звёзд Бога
  rationale: Буквальный образ сохранён без уточнения, подразумеваются ли обычные звёзды, небесные существа или силы.
- source_word: אָרִים כִּסְאִי
  choice: вознесу свой престол
  rationale: Порода хифиль глагола רום обозначает поднятие или возвышение; «вознесу» естественно передаёт мотив самовозвеличивания.
- source_word: וְאֵשֵׁב
  choice: и воссяду
  rationale: Глагол означает «сидеть» или «обитать»; «воссяду» сохраняет действие и уместный здесь оттенок воцарения, не превращая намёк в прямое толкование.
- source_word: בְּהַר מוֹעֵד
  choice: на горе собрания
  rationale: מוֹעֵד здесь вероятнее обозначает назначенное собрание; перевод сохраняет космический образ и не смешивает его с устойчивым выражением «шатёр встречи».
- source_word: בְּיַרְכְּתֵי צָפוֹן
  choice: в дальних пределах севера
  rationale: יַרְכְּתֵי указывает на отдалённые края или глубины, а צָפוֹן обычно означает «север». Возможная отсылка к горе Цафон отмечена в сноске.
theological_decisions:
- issue: Возможная мифопоэтическая отсылка в צָפוֹן
  choice: В основном тексте переведено как «север».
  alternative: Понять צָפוֹן как собственное имя «Цафон».
  rationale: Обычное значение слова — «север», однако в контексте горы собрания оно может отсылать к известной в древней ближневосточной традиции космической горе Цафон. Основной текст сохраняет общеупотребительное значение, а сноска — возможную аллюзию.
- issue: Значение выражения «звёзды Бога»
  choice: Сохранён буквальный образ без поясняющей замены.
  alternative: Передать как «небесные существа» или просто «звёзды».
  rationale: Выражение может обозначать звёзды и одновременно вызывать представление о небесных существах или силах. Перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией пророческой насмешки. Слова «небеса», «вознесу» и «воссяду» поддерживают торжественный ритм хвастливой речи, оставаясь понятными современному читателю.
