source:
  edition: WLC
  text: וּ/מַֽה יַּעֲנֶ֖ה מַלְאֲכֵי ג֑וֹי כִּ֤י יְהוָה֙ יִסַּ֣ד צִיּ֔וֹן וּ/בָ֥/הּ יֶחֱס֖וּ עֲנִיֵּ֥י עַמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/032.yaml
  text: And what will one answer the messengers of the nation? That Yahweh has founded Zion[b][a], and in her the afflicted of his people will find refuge.
translation:
  language: ru
  text: И что ответят посланникам народа[a]? — «Яхве основал Сион[c], и в нём найдут убежище бедные из Его народа[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестникам народа» либо «послам народа». Еврейское слово может обозначать дипломатических посланников.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «страдающие», «угнетённые» или «смиренные из Его народа». Еврейское слово может обозначать экономически бедных, страдающих, униженных или смиренных — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: c
    text: 'Дословно: «в ней». Женский суффикс в еврейском тексте относится к Сиону и может поддерживать образ города как женщины; по-русски «Сион» имеет мужской род.'
    reason: literary_and_grammatical_note
lexical_decisions:
- source_word: וּמַה יַעֲנֶה
  choice: И что ответят
  rationale: Союз ו сохраняет связь с предшествующим контекстом; неопределённо-личная русская конструкция естественно передаёт 3-е лицо единственного числа без названного субъекта.
- source_word: מַלְאֲכֵי גוֹי
  choice: посланникам народа
  rationale: מַלְאָךְ здесь допускает значение дипломатических посланников; единственное число גוֹי передано буквально и без уточнения определённости, которой в еврейском выражении явно нет.
- source_word: כִּי
  choice: прямая речь после вопроса
  rationale: כִּי вводит содержание ответа; в русском естественнее оформить его прямой речью, не добавляя причинного значения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: יִסַּד צִיּוֹן
  choice: основал Сион
  rationale: Глагол יסד обозначает основание или утверждение; совершенный вид передаёт действие как состоявшийся факт.
- source_word: וּבָהּ
  choice: и в нём
  rationale: Местоимение относится к Сиону; в современном русском название «Сион» грамматически мужского рода, поэтому буквальное женское местоимение было бы неестественно и могло бы затемнить референцию.
- source_word: יֶחֱסוּ
  choice: найдут убежище
  rationale: חסה означает искать или находить защиту, прибегать под покров; выбранная формулировка естественно выражает результат укрытия.
- source_word: עֲנִיֵּי עַמּוֹ
  choice: угнетённые из Его народа
  rationale: עָנִי может обозначать бедных, страдающих, униженных или смиренных; «угнетённые» подчёркивает уязвимость в данном контексте, а «из Его народа» ясно передаёт конструкцию принадлежности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Образ Сиона и род местоимения
  choice: в нём
  alternative: в ней
  rationale: Еврейский суффикс женского рода согласуется с צִיּוֹן и может поддерживать образ города как женщины, однако русское «Сион» мужского рода. «В нём» сохраняет ясную референцию без искусственного нарушения русской грамматики; образное альтернативное прочтение отмечено в сноске.
- issue: Объём значения עֲנִיֵּי
  choice: угнетённые
  alternative: бедные; смиренные; страдающие
  rationale: Контекст убежища поддерживает значение уязвимых и терпящих притеснение, но семантическая неоднозначность не устраняется и отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Прямая речь естественно оформляет содержание ожидаемого ответа. Заглавная буква в «Его» служит русской издательской норме благоговейного обозначения Бога, не меняя смысла исходного местоимения.
