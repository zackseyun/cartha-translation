  text: וְ/אַתָּ֞ה הָשְׁלַ֤כְתָּ מִֽ/קִּבְרְ/ךָ֙ כְּ/נֵ֣צֶר נִתְעָ֔ב לְב֥וּשׁ הֲרֻגִ֖ים מְטֹ֣עֲנֵי חָ֑רֶב יוֹרְדֵ֥י אֶל אַבְנֵי ב֖וֹר כְּ/פֶ֥גֶר מוּבָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/019.yaml
  text: But you are cast out from your grave like a despised branch[a], clothed with the slain, those pierced by the sword, who go down to the stones of the pit[c][b], like a trampled corpse.
translation:
  language: ru
  text: Но ты отброшен от своей могилы, словно презренная ветвь[a], покрытая телами убитых — пронзённых мечом[b], нисходящих к камням могильной ямы[c], — словно растоптанный труп.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно отверженный побег». Еврейское слово означает побег или ветвь; здесь образ подчёркивает нечто презираемое, отвергнутое и выброшенное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поражёнными мечом». Еврейское выражение трудно для истолкования; по контексту речь идёт о павших в бою.'
    reason: lexical_alternative
  - marker: c
    text: «Могильная яма» — поэтический образ могилы или области мёртвых; «камни ямы», вероятно, вызывают образ обложенного камнями места погребения.
    reason: cultural_note
lexical_decisions:
- source_word: הָשְׁלַכְתָּ מִקִּבְרְךָ
  choice: ты выброшен из своей гробницы
  rationale: Пассивно-результативная форма передаёт насильственное лишение подобающего погребения; настоящее результативное состояние сохраняет живость пророческой насмешки.
- source_word: כְּנֵצֶר נִתְעָב
  choice: словно отвратительный побег
  rationale: נֵצֶר означает побег или отрасль, а נִתְעָב — нечто вызывающее отвращение и отверженное. «Побег» сохраняет растительный образ, не внося сюда мессианского смысла из Ис 11:1.
- source_word: לְבוּשׁ הֲרֻגִים
  choice: покрытый убитыми
  rationale: Буквальный образ «одетый убитыми» в русском может ошибочно означать одежду из тел; «покрытый» естественно передаёт нахождение среди тел и сохраняет образ внешнего покрова.
- source_word: מְטֹעֲנֵי חָרֶב
  choice: пронзёнными мечом
  rationale: Редкое и трудное выражение в данном контексте, вероятнее всего, обозначает поражённых или пронзённых мечом; неопределённость отмечена в сноске.
- source_word: יוֹרְדֵי אֶל אַבְנֵי בוֹר
  choice: сходящими к камням могильной ямы
  rationale: Сохранены и причастное движение вниз, и необычный конкретный образ камней ямы; добавление «могильной» ясно передаёт контекст смерти, не сводя בּוֹר к абстрактному миру мёртвых.
- source_word: כְּפֶגֶר מוּבָס
  choice: словно растоптанный труп
  rationale: Передаёт человеческое мёртвое тело и пассивное состояние попранности кратко, ясно и образно.
theological_decisions:
- issue: Возможные мессианские ассоциации слова נֵצֶר
  choice: побег
  alternative: отрасль
  rationale: В непосредственном контексте речь идёт об отвергнутом правителе и позорном лишении погребения. Перевод не переносит сюда богословскую ассоциацию из Ис 11:1.
- issue: Значение בּוֹר в поэтическом контексте смерти
  choice: могильная яма
  alternative: преисподняя / мир мёртвых
  rationale: Конкретный образ ямы и её камней сохранён; перевод не решает однозначно, имеется ли в виду физическая могила или более широкий поэтический образ области мёртвых.
translation_notes:
  register: Современный литературный русский с торжественно-мрачным, но понятным звучанием. Синтаксис сохраняет нагромождение образов оригинала, а тире помогает ясно связать определения с «убитыми».
