  text: גַּם בְּרוֹשִׁ֛ים שָׂמְח֥וּ לְ/ךָ֖ אַרְזֵ֣י לְבָנ֑וֹן מֵ/אָ֣ז שָׁכַ֔בְתָּ לֹֽא יַעֲלֶ֥ה הַ/כֹּרֵ֖ת עָלֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/008.yaml
  text: 'Even the cypresses rejoice over you[a], the cedars of Lebanon: ‘Since you have lain down, no woodcutter comes up against us.’'
translation:
  language: ru
  text: 'Даже кипарисы[a] ликуют над тобой, как и кедры Ливана: «С тех пор как ты лёг, лесоруб не поднимается против нас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «можжевельники» или «пихты»; какая именно порода дерева обозначена еврейским словом, точно не установлено.
    reason: 'Лексическая альтернатива: точное ботаническое значение בְּרוֹשׁ неизвестно.'
lexical_decisions:
- source_word: גַּם
  choice: даже
  rationale: 'Передаёт усиление: к падению притеснителя с радостью относятся не только люди, но даже деревья.'
- source_word: בְּרוֹשִׁים
  choice: кипарисы
  rationale: Обозначение хвойного дерева с неустановленной точной породой; традиционно и уместно в контексте ливанского леса передаётся как «кипарисы», а варианты отмечены в сноске.
- source_word: שָׂמְחוּ לְךָ
  choice: радуются из-за тебя
  rationale: Сохраняет намеренно широкую связь радости с адресатом и в контексте насмешки подразумевает радость по поводу его падения, не добавляя этого пояснения в основной текст.
- source_word: אַרְזֵי לְבָנוֹן
  choice: кедры Ливана
  rationale: Естественная передача сочетания в сопряжённой конструкции и устойчивого библейского образа.
- source_word: מֵאָז
  choice: с тех пор как
  rationale: Обозначает начало продолжающегося положения после падения царя.
- source_word: שָׁכַבְתָּ
  choice: ты лёг
  rationale: Сохраняет буквальный поэтический образ, который в контексте указывает на смерть или низвержение, не заменяя его толкованием.
- source_word: לֹא יַעֲלֶה
  choice: не поднимается
  rationale: Передаёт как направленное вверх движение в Ливанские горы, так и продолжающееся отсутствие угрозы.
- source_word: הַכֹּרֵת
  choice: лесоруб
  rationale: Причастная форма обозначает рубящего деревья; «лесоруб» ясно и естественно выражает эту роль.
- source_word: עָלֵינוּ
  choice: к нам
  rationale: В сочетании с глаголом движения естественно передаёт направленность движения к деревьям; в контексте сохраняется очевидный враждебный смысл.
theological_decisions:
- issue: Поэтическое олицетворение деревьев
  choice: Кипарисы радуются, а кедры произносят прямую речь в песне-насмешке над павшим царём.
  alternative: Понимать стих только как буквальное сообщение о прекращении вырубки леса.
  rationale: Контекст песни-насмешки и форма прямой речи поддерживают олицетворение; перевод сохраняет образ, не сводя его к прозаическому объяснению.
- issue: Смысл שָׁכַבְתָּ
  choice: Сохранить метафору «ты лёг».
  alternative: 'Передать явно: «ты умер» или «ты был повержен».'
  rationale: Еврейский текст оставляет образ смерти или падения выраженным косвенно; перевод не устраняет эту поэтическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и поэтической образности. Порядок фразы слегка перестроен для ясного присоединения «кедров Ливана» и естественного введения прямой речи; метафора «ты лёг» сохранена.
