  naturalness: '«В год смерти царя Ахаза было это пророчество» грамматически возможно, но для современного литературного русского стилистически тяжеловесно и не вполне ясно как заголовочная формула. Естественнее: «вот какое было пророчество»; это также лучше передаёт указательную функцию הַזֶּה.'
