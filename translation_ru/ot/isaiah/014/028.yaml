lexical_decisions:
- source_word: בִּשְׁנַת מוֹת
  choice: В год смерти
  rationale: Естественная русская формула датировки, точно передающая еврейское сочетание предлога ב, существительного שְׁנַת и конструкта מוֹת.
- source_word: הַמֶּלֶךְ אָחָז
  choice: царя Ахаза
  rationale: В русском языке после слова «смерти» требуется родительный падеж; сочетание титула с именем естественно передаётся как «царя Ахаза».
- source_word: הָיָה
  choice: было
  rationale: Сохранено простое значение еврейского глагола «быть» и формальная особенность заголовочной конструкции без добавления подразумеваемого глагола «пришло».
- source_word: הַמַּשָּׂא
  choice: пророчество
  rationale: В пророческом заголовке слово обозначает торжественное, нередко грозное пророческое возвещение. «Пророчество» понятно современному читателю и не навязывает буквальную метафору «бремени».
- source_word: הַזֶּה
  choice: это
  rationale: Указательное местоимение прямо указывает на следующее далее возвещение.
