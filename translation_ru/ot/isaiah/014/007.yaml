  yaml_path: translation/ot/isaiah/014/007.yaml
  text: All the earth is at rest and quiet[a]; they break out in singing.
translation:
  language: ru
  text: Вся земля[a] успокоилась и затихла; все разразились радостным пением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вся страна».'
    reason: Еврейское אֶרֶץ может означать как всю землю, так и определённую страну.
lexical_decisions:
- source_word: נָחָה
  choice: успокоилась
  rationale: Форма qal перфекта, согласованная с существительным женского рода «земля», обозначает наступившее состояние покоя. «Успокоилась» естественно передаёт и переход к покою, и его результат в данном контексте.
- source_word: שָׁקְטָה
  choice: затихла
  rationale: Второй qal перфект усиливает картину всеобщего покоя. «Затихла» сохраняет параллелизм с «успокоилась» и передаёт прекращение тревоги и смятения.
- source_word: כָּל הָאָרֶץ
  choice: Вся земля
  rationale: В контексте насмешливой песни выражение имеет широкий, универсальный смысл. Вместе с тем אָרֶץ может означать и «страна», поэтому эта возможность отмечена в сноске.
- source_word: פָּצְחוּ
  choice: все разом запели
  rationale: Глагол выражает внезапное, энергичное начало звучания. Слово «разом» передаёт порыв и естественно сочетается по-русски с «запели»; добавленное «все» ясно выражает подразумеваемое подлежащее множественного числа.
- source_word: רִנָּה
  choice: от радости
  rationale: Существительное обозначает звонкий возглас или пение, обычно радостное. В сочетании «запели от радости» его радостный оттенок передан естественным современным русским выражением.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим ритмом. Пара глаголов «успокоилась и затихла» сохраняет еврейский параллелизм, а «разом запели от радости» естественно передаёт внезапный общий порыв.
