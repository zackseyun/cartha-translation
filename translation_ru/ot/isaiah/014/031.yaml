base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/031.yaml
  text: Wail[a], O gate! Cry out, O city! Melt away, all of you, Philistia! For smoke comes from the north[c][b], and there is no straggler in his ranks.
translation:
  language: ru
  text: Рыдайте[a], ворота! Вопи, город! Растай[b], вся Филистия! Ведь с севера идёт дым, и в строю нет отставших[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Причитайте» или «Войте». Еврейский глагол обозначает громкий плач и крик скорби.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лишись сил» или «распадись от страха». Еврейский глагол буквально передаёт образ таяния и может означать утрату стойкости.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «и нет никого, кто был бы отделён от своего назначенного места». Заключительная фраза по-еврейски неоднозначна; вероятно, она изображает полностью собранное и организованное войско, в котором никто не отстаёт.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵילִילִי
  choice: Рыдайте
  rationale: Повелительная форма выражает громкий плач и скорбь. Множественное число обусловлено грамматической формой русского слова «ворота», хотя в еврейском обращение стоит в единственном числе.
- source_word: שַׁעַר
  choice: ворота
  rationale: Слово обозначает городские ворота, метонимически представляющие общественную жизнь и оборону города.
- source_word: זַעֲקִי
  choice: Вопи
  rationale: Передаёт настойчивый призыв поднять громкий крик бедствия и сохраняет возвышенный пророческий регистр.
- source_word: עִיר
  choice: город
  rationale: Прямое обращение, параллельное обращению к воротам; русское существительное мужского рода требует соответствующей формы глагола.
- source_word: נָמוֹג
  choice: Трепещи
  rationale: Корень מוג описывает утрату твёрдости и мужества, словно человек или целое общество тает и распадается от страха. «Трепещи» естественно выражает испуг и внутренний надлом, не сводя образ только к физической слабости.
- source_word: פְּלֶשֶׁת כֻּלֵּךְ
  choice: вся Филистия
  rationale: Сохраняет обращение ко всей Филистии как к единому женскому образу; значение местоименного суффикса передано словом «вся».
- source_word: כִּי
  choice: Ведь
  rationale: Вводит основание для предшествующего призыва к плачу и страху; в современном русском «ведь» звучит естественнее тяжеловесного «ибо», сохраняя причинную связь.
- source_word: מִצָּפוֹן
  choice: с севера
  rationale: Прямо передаёт направление приближающейся угрозы.
- source_word: עָשָׁן
  choice: дым
  rationale: Сохранён буквальный пророческий образ; он может указывать на войско или разорение, но перевод не делает это толкование частью текста.
- source_word: בָּא
  choice: идёт
  rationale: Передаёт непосредственное приближение дыма и угрозы естественным русским выражением.
- source_word: וְאֵין בּוֹדֵד
  choice: и никто не отстаёт
  rationale: בודד обозначает отделившегося или оказавшегося в одиночестве; в военном контексте это естественно понимается как отсутствие отставших.
- source_word: בְּמוֹעָדָיו
  choice: в его строю
  rationale: Контекст наступающей силы допускает значение назначенных мест или боевого порядка. Формулировка передаёт организованность войска, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Смысл заключительной фразы וְאֵין בּוֹדֵד בְּמוֹעָדָיו
  choice: 'Наступающая сила изображена организованной: никто не отстаёт в её строю.'
  alternative: «И нет одинокого в назначенные ему сроки» или «никого нет отдельно на назначенном ему месте».
  rationale: Образ дыма, идущего с севера, вероятнее всего представляет наступающую военную силу, поэтому военное прочтение связно с контекстом. Однако редкое сочетание слов допускает и более буквальные варианты, что отражено в сноске без догматизации образа.
translation_notes:
  register: Современный литературный русский с краткими, напряжёнными повелениями и сохранённой пророческой образностью. Архаизм «врата» не использован; грамматическое число согласовано с современным словом «ворота». Неоднозначный образ дыма и трудная заключительная фраза не разъясняются внутри основного текста сверх необходимого.
