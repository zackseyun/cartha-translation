id: ISA.14.1
reference: Isaiah 14:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּי֩ יְרַחֵ֨ם יְהוָ֜ה אֶֽת יַעֲקֹ֗ב וּ/בָחַ֥ר עוֹד֙ בְּ/יִשְׂרָאֵ֔ל וְ/הִנִּיחָ֖/ם עַל אַדְמָתָ֑/ם וְ/נִלְוָ֤ה הַ/גֵּר֙ עֲלֵי/הֶ֔ם וְ/נִסְפְּח֖וּ עַל בֵּ֥ית יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/001.yaml
  text: For Yahweh will have compassion on Jacob and will again choose Israel[a], and he will settle them on their own land. The foreigner will join them[b], and they will attach themselves to the house of Jacob.
translation:
  language: ru
  text: Потому что Яхве смилуется над Иаковом, вновь изберёт Израиль и поселит их на их земле. Живущий среди них чужеземец[a] присоединится к ним, и чужеземцы примкнут к дому Иакова[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переселенец». Еврейское גֵּר обычно означает пришлого человека, живущего среди местного населения, а не просто проезжего иностранца.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально во второй части стоит множественное число: «и они примкнут к дому Иакова»; вероятно, имеются в виду чужеземцы как группа.'
    reason: grammatical_clarification
lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит основание предшествующего пророчества; «потому что» ясно передаёт причинную связь.
- source_word: יְרַחֵם
  choice: смилуется
  rationale: Глагол выражает милосердное, сострадательное отношение; «смилуется» естественно и достойно звучит в пророческом контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом.
- source_word: וּבָחַר עוֹד בְּיִשְׂרָאֵל
  choice: вновь изберёт Израиль
  rationale: עוֹד указывает на возобновление избрания или благоволения после суда, не представляя его первым избранием.
- source_word: וְהִנִּיחָם עַל אַדְמָתָם
  choice: и поселит их на их земле
  rationale: Каузативная форма глагола נוח в контексте возвращения выражает предоставление покоя и устойчивого места на собственной земле; «поселит» естественно передаёт этот смысл.
- source_word: הַגֵּר
  choice: живущий среди них чужеземец
  rationale: גֵּר обозначает не просто иностранца, а пришлого человека, живущего среди местного населения; описательный перевод сохраняет это различие без архаизма.
- source_word: וְנִלְוָה ... עֲלֵיהֶם
  choice: присоединится к ним
  rationale: Передаёт добровольное присоединение и естественное для русского языка управление.
- source_word: וְנִסְפְּחוּ עַל בֵּית יַעֲקֹב
  choice: и чужеземцы примкнут к дому Иакова
  rationale: Множественное число глагола требует понятного множественного подлежащего, подразумеваемого собирательным הַגֵּר; «примкнут» сохраняет оттенок тесного присоединения.
theological_decisions:
- issue: Смысл повторного избрания Израиля
  choice: «вновь изберёт Израиль»
  alternative: «снова окажет Израилю благоволение»
  rationale: Сохраняется прямое значение בחר и напряжение между прежним избранием, пережитым судом и грядущим восстановлением, без уточнения его национального, эсхатологического или типологического объёма.
- issue: Кого обозначает הַגֵּר
  choice: Пришлый чужеземец, живущий среди Израиля
  alternative: «переселенец» или просто «чужеземец»
  rationale: Формулировка не сводит персонажа ни к случайному иностранцу, ни к поздней строго определённой юридической категории.
- issue: Переход от единственного הַגֵּר к множественному וְנִסְפְּחוּ
  choice: 'Во второй части назвать подразумеваемую группу: «чужеземцы примкнут»'
  alternative: «и они примкнут» / «и будет присоединён к дому Иакова»
  rationale: Масоретский текст действительно переходит от собирательного единственного числа к множественному; перевод делает референт ясным, не исправляя число глагола.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаическим звучанием. Имя Яхве передано прямо. Синтаксис упрощён для ясности, при этом сохранены параллелизм, образ «дома Иакова» и переход от собирательного единственного числа к множественному.
