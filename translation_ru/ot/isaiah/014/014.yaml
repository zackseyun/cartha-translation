  text: אֶעֱלֶ֖ה עַל בָּ֣מֳתֵי עָ֑ב אֶדַּמֶּ֖ה לְ/עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/014.yaml
  text: I will ascend above the heights of the clouds[a]; I will make myself like the Most High.
translation:
  language: ru
  text: Поднимусь выше облачных высот; уподоблюсь Всевышнему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: Поднимусь
  rationale: Форма qal, имперфект 1-го лица ед. числа от עלה, обозначает движение вверх; «поднимусь» естественно по-русски и сохраняет оттенок самовозвышения.
- source_word: עַל
  choice: выше
  rationale: При глаголе восхождения и выражении «облачные высоты» предлог указывает на превосходящую высоту, а не на положение на поверхности.
- source_word: בָּמֳתֵי עָב
  choice: облачных высот
  rationale: Конструктивное сочетание множественного числа בָּמָה («высота, возвышенность») с עָב («облако, густая туча») передаёт образ высочайших областей облаков; выражение кратко и естественно в поэтической русской речи.
- source_word: אֶדַּמֶּה
  choice: уподоблюсь
  rationale: Форма hitpael, имперфект 1-го лица ед. числа от דמה, выражает рефлексивное стремление стать подобным или сравняться; «уподоблюсь» сохраняет эту направленность без избыточного толкования.
- source_word: לְעֶלְיוֹן
  choice: Всевышнему
  rationale: עֶלְיוֹן здесь выступает как божественный титул; русское «Всевышний» является его устойчивым и понятным соответствием.
theological_decisions:
- issue: Передача עֶלְיוֹן как божественного титула
  choice: Всевышнему
  alternative: Высочайшему
  rationale: Контекст передаёт притязание говорящего на богоподобное возвышение. Устойчивый титул «Всевышний» сохраняет богословскую силу текста, не привнося позднейших отождествлений говорящего.
- issue: Характер притязания в אֶדַּמֶּה
  choice: уподоблюсь
  alternative: буду подобен
  rationale: Рефлексивная форма допускает смысл целенаправленного уподобления. Выбранный вариант передаёт его, но не уточняет сверх текста, идёт ли речь о полном равенстве, сходстве или присвоении положения.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим ритмом. Синтаксический параллелизм двух хвастливых заявлений сохранён; архаизмы и конфессионально специфические формулировки не использованы.
