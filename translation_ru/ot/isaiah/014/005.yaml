source:
  edition: WLC
  text: שָׁבַ֥ר יְהוָ֖ה מַטֵּ֣ה רְשָׁעִ֑ים שֵׁ֖בֶט מֹשְׁלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/005.yaml
  text: Yahweh has broken the staff of the wicked[a], the scepter of rulers,
translation:
  language: ru
  text: 'Яхве сломал посох нечестивых[a],

    жезл правителей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жезл нечестивых». В еврейском тексте употреблены два параллельных названия орудия или символа власти: «посох» и «жезл».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבַר
  choice: сломал
  rationale: Форма qal perfect 3-го лица мужского рода единственного числа обозначает завершённое действие — «сломал, разбил». «Сломал» прямо передаёт образ, не усиливая его до «сокрушил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом «Господь».
- source_word: מַטֵּה
  choice: посох
  rationale: Слово может означать посох или жезл. «Посох» позволяет сохранить параллелизм со שֵׁבֶט и при этом различить два близких образа орудия и символа власти.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное во множественном числе обозначает нечестивых людей как совокупность; русская форма не добавляет отсутствующего в оригинале уточнения.
- source_word: שֵׁבֶט
  choice: жезл
  rationale: В данном параллелизме слово обозначает орудие или символ власти. «Жезл» естественно сочетается с «правителями» и сохраняет отличие от «посоха».
- source_word: מֹשְׁלִים
  choice: правителей
  rationale: Причастие qal во множественном числе от משל означает «те, кто правит». «Правители» передаёт это прямо, тогда как «тираны» привнесло бы дополнительную оценку.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом и не вводя традиционную позднюю форму «Иегова».
- issue: Отношение двух параллельных образов власти
  choice: посох нечестивых, жезл правителей
  alternative: жезл нечестивых, скипетр властителей
  rationale: Текст не уточняет, описываются ли две группы или одна и та же власть в поэтическом параллелизме. Перевод сохраняет параллельные формулировки и не разрешает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой поэтической строкой. Синтаксический параллелизм оригинала сохранён; лексика понятна широкому читателю и не перегружена архаизмами.
