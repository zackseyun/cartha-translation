base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/010.yaml
  text: All of them will answer and say to you[a], ‘You too have become weak like us[b]; you have become like us.’
translation:
  language: ru
  text: 'Все они ответят и скажут тебе: «И ты тоже ослабел, как мы[a], стал подобен нам[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И ты тоже был обессилен, как мы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ты был уподоблен нам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Все они
  rationale: Передаёт собирательное значение с суффиксом 3-го лица множественного числа и подчёркивает, что отвечают все упомянутые в контексте обитатели шеола.
- source_word: יַעֲנוּ וְיֹאמְרוּ אֵלֶיךָ
  choice: ответят и скажут тебе
  rationale: Сохраняет параллельные глаголы речи и направленность высказывания к адресату; будущее время соответствует древнееврейской глагольной форме и ходу пророческой сцены.
- source_word: גַּם אַתָּה
  choice: И ты
  rationale: 'В данном контексте естественно передаёт включительное и насмешливое «ты тоже»: низвергнутый правитель теперь разделяет участь остальных.'
- source_word: חֻלֵּיתָ
  choice: ослабел
  rationale: Форма от חלה здесь указывает на утрату силы, а не обязательно на болезнь. Русский результативный глагол кратко и естественно выражает наступившее состояние.
- source_word: כָמוֹנוּ
  choice: как мы
  rationale: Прямо и естественно передаёт сравнительную конструкцию.
- source_word: אֵלֵינוּ נִמְשָׁלְתָּ
  choice: стал подобен нам
  rationale: Сохраняет значение уподобления или приравнивания и намеренный смысловой параллелизм с предыдущей строкой, не сводя обе части в одну.
theological_decisions:
- issue: Характер речи в шеоле
  choice: Передать слова как поэтическую насмешку над потерей царём силы и его уравнением с прочими умершими.
  alternative: Истолковать образ как точное учение о состоянии и сознании умерших либо усилить мифологические подробности.
  rationale: Текст изображает умерших говорящими в рамках пророческой поэзии. Перевод сохраняет образ и унижение царя, но не использует этот стих для разрешения более широких богословских вопросов.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формулировка лаконична и понятна; повтор двух близких по смыслу утверждений сохранён как черта древнееврейского оригинала.
