  text: זֹ֛את הָ/עֵצָ֥ה הַ/יְּעוּצָ֖ה עַל כָּל הָ/אָ֑רֶץ וְ/זֹ֛את הַ/יָּ֥ד הַ/נְּטוּיָ֖ה עַל כָּל הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/026.yaml
  text: This is the plan that is planned against all the earth[a], and this is the hand that is stretched out against all the nations.
translation:
  language: ru
  text: Вот замысел, задуманный против всей земли[a], и вот рука, простёртая против всех народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всей страны», если речь идёт не обо всём мире, а об определённой земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָעֵצָה הַיְעוּצָה
  choice: Вот замысел, замысленный
  rationale: Указательное «вот» передаёт выделительное זֹאת, а однокоренные «замысел, замысленный» сохраняют намеренный повтор существительного עֵצָה и причастия от יעץ. Формулировка подчёркивает уже определённое намерение, не усиливая его до отдельного понятия предопределения.
- source_word: עַל
  choice: против
  rationale: В контексте суда предлог обозначает направленность враждебного действия, поэтому «против» точнее, чем нейтральные «о» или «над».
- source_word: כָּל הָאָרֶץ
  choice: всей земли
  rationale: אֶרֶץ допускает значения «земля» и «страна». Параллель со «всеми народами» поддерживает широкий, вероятно всемирный охват; строчная буква сохраняет обычное библейское значение мира/суши, не превращая слово в астрономическое имя собственное.
- source_word: וְזֹאת הַיָּד הַנְּטוּיָה
  choice: и вот рука, простёртая
  rationale: Сохранён параллелизм двух указательных конструкций и образ руки как действенной силы. «Простёртая» естественно и возвышенно передаёт пассивное причастие от נטה, не заменяя метафору толкованием.
- source_word: כָּל הַגּוֹיִם
  choice: всех народов
  rationale: גּוֹיִם здесь означает народы мира; русское «народы» точнее контекстуально, чем конфессионально окрашенное «язычники».
theological_decisions:
- issue: Масштаб выражения כָּל הָאָרֶץ в пророчестве о суде
  choice: «всей земли» — широкий, всемирный охват
  alternative: «всей страны» — региональный охват
  rationale: Параллельное выражение «против всех народов» склоняет к универсальному пониманию, однако многозначность אֶרֶץ реальна и потому отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Синтаксический параллелизм и образ простёртой руки сохранены; намеренная однокоренная тавтология отражает еврейскую словесную связь.
