  source_fidelity: 'Основной смысл передан верно: тиран опустошил обитаемый мир, разрушил города и не позволял пленникам вернуться домой. Однако «вселенная» для תֵּבֵל слишком космологично: здесь имеется в виду мир как обитаемая земля. Финальная конструкция в еврейском тексте необычна и допускает идиоматический смысл «не отпускал домой», но сноска должна точнее обозначать ее образную буквальность и неопределенность.'
