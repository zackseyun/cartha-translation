  text: who made the world like a wilderness and tore down its cities[a], who did not open the house for his prisoners?
translation:
  language: ru
  text: который превратил мир в пустыню, разрушил его города и не отпустил своих пленников домой?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не открывал к дому/домой»; еврейское выражение необычно. Возможный более образный перевод: «не открывал своим пленникам путь домой».'
    reason: Лֹא פָתַח בָּיְתָה буквально содержит глагол «открывать» и направительное «к дому/домой», но в контексте пленников, вероятно, означает отказ отпустить их домой. Сноска сохраняет эту образность и синтаксическую неопределенность.
lexical_decisions:
- source_word: שָׂם
  choice: превратил
  rationale: 'В сочетании со сравнительным оборотом передаёт результат действия: он сделал обитаемый мир подобным пустыне. По-русски «превратил… в пустыню» естественнее буквального «сделал… как пустыню».'
- source_word: תֵּבֵל
  choice: вселенную
  rationale: Здесь слово обозначает обитаемый мир. «Вселенная» сохраняет широкий, возвышенный масштаб пророческой насмешки, не ограничивая смысл одной страной.
- source_word: כַּמִּדְבָּר
  choice: в пустыню
  rationale: Формально כ выражает сравнение («как пустыню»), но русская конструкция «превратил в пустыню» естественно передаёт тот же образ и результат, не сводя מִדְבָּר к песчаной пустыне.
- source_word: וְעָרָיו
  choice: и разрушил её города
  rationale: Местоименный суффикс мужского рода формально допускает «его города», однако по контексту города принадлежат упомянутому обитаемому миру; русское «её» ясно связывает их со «вселенной».
- source_word: הָרָס
  choice: разрушил
  rationale: Глагол означает разрушать, сносить, обращать в руины. «Разрушил» естественно сочетается с городами и сохраняет силу образа.
- source_word: אֲסִירָיו
  choice: своих пленников
  rationale: Речь идёт о людях, удерживаемых завоевателем. «Пленники» точнее контекста военной власти, чем более институциональное «заключённые».
- source_word: לֹא פָתַח בָּיְתָה
  choice: не отпускал … домой
  rationale: 'Буквально сочетание необычно: «не открыл к дому/домой». Направительный суффикс в בָּיְתָה указывает на движение домой, а פתח в контексте пленников подразумевает открытие пути или освобождение. Основной текст передаёт вероятный идиоматический смысл, а буквальная форма сохранена в сноске.'
