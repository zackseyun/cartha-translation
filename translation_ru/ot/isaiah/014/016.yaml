base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/016.yaml
  text: 'Those who see you will stare at you; they will look closely at you: ‘Is this the man who made the earth tremble[a], who shook kingdoms,’'
translation:
  language: ru
  text: 'Те, кто увидит тебя, будут пристально смотреть на тебя, будут вглядываться в тебя[a]: «Неужели это тот человек, который заставлял землю дрожать, потрясал царства,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут внимательно рассматривать тебя»; возможен также смысл «будут размышлять о тебе». Еврейский глагол обозначает не только зрительное наблюдение, но и пристальное изучение или осмысление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאֶיךָ
  choice: те, кто увидит тебя
  rationale: Субстантивированное причастие qal во множественном числе с суффиксом 2-го лица мужского рода передано естественной русской конструкцией; будущее время соответствует контексту пророческой картины.
- source_word: אֵלֶיךָ יַשְׁגִּיחוּ
  choice: будут пристально смотреть на тебя
  rationale: Hiphil глагола שׁגח выражает направленный, внимательный взгляд; «пристально смотреть» передаёт и зрительное действие, и изумление наблюдающих.
- source_word: אֵלֶיךָ יִתְבּוֹנָנוּ
  choice: будут вглядываться в тебя
  rationale: Форма от בין здесь указывает на внимательное рассматривание или осмысление. «Вглядываться» сохраняет зрительный параллелизм с предыдущей строкой и оттенок тщательного изучения; возможная смысловая широта отмечена в сноске.
- source_word: הֲזֶה הָאִישׁ
  choice: Неужели это тот человек
  rationale: Сочетание вопросительной частицы с указательным местоимением выражает потрясённое недоверие. «Неужели» естественно передаёт риторическую силу вопроса, а «человек» сохраняет мужской род и человеческий статус названной фигуры.
- source_word: מַרְגִּיז הָאָרֶץ
  choice: который заставлял землю дрожать
  rationale: 'Причастие hiphil передаёт причинное действие: этот человек наводил ужас и потрясал землю. Несовершенный вид «заставлял» соответствует характеристике его прежних действий.'
- source_word: מַרְעִישׁ מַמְלָכוֹת
  choice: потрясал царства
  rationale: Причастие hiphil от רעשׁ означает причинять сотрясение. «Потрясал царства» кратко и естественно сохраняет образ и синтаксический параллелизм.
theological_decisions:
- issue: Кого обозначает выражение «тот человек» в насмешливой песне
  choice: Передать его прямо как человека — павшего земного правителя.
  alternative: Истолковать в основном тексте как сатану/Люцифера либо одновременно как царя Вавилона и космического мятежника.
  rationale: В еврейском тексте данного стиха стоит הָאִישׁ, «человек, мужчина», а ближайший литературный контекст содержит насмешку над царём Вавилона. Перевод не должен вносить в сам текст более позднюю богословскую идентификацию.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Повтор «на тебя… в тебя» сохраняет настойчивую направленность двух еврейских оборотов. Открывающая кавычка и конечная запятая оставлены, поскольку прямая речь и предложение продолжаются в следующем стихе.
