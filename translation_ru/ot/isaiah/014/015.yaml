  source_fidelity: 'Основной смысл передан верно: אַךְ выражено как «Но», хофаль תּוּרָד сохранён пассивным «будешь низведён», а «шеол» обоснованно оставлен транслитерацией. Однако בּוֹר означает «яма; ров; преисподняя яма» и не содержит значения «могильная». Добавление «могильная» сужает и частично дублирует семантику «шеола».'
