  text: אַ֧ךְ אֶל שְׁא֛וֹל תּוּרָ֖ד אֶל יַרְכְּתֵי בֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/015.yaml
  text: But you will be brought down to Sheol[a], to the depths of the pit.
translation:
  language: ru
  text: Но ты будешь низведён в шеол[a], в глубины ямы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могилу»; или: «мир мёртвых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Частица резко противопоставляет прежним притязаниям на восхождение (ст. 13–14) последующее унизительное низвержение. «Но» естественно передаёт этот риторический перелом, хотя возможен и усилительный оттенок «непременно».
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет древнееврейское представление о мире мёртвых и не сужает значение до отдельной могилы, а также не привносит более поздней догматической конкретизации.
- source_word: תּוּרָד
  choice: будешь низведён
  rationale: 'Глагольная форма хофаль передаёт каузативно-пассивное действие: адресат не просто сойдёт, но будет низведён. Выбор сохраняет пассивность и оттенок унижения.'
- source_word: יַרְכְּתֵי
  choice: глубины
  rationale: Слово обозначает самые внутренние, дальние или крайние части; в контексте нисхождения естественное русское соответствие — «глубины».
- source_word: בּוֹר
  choice: могильная яма
  rationale: «Яма» сохраняет образ места низвержения, а определение «могильная» проясняет контекст смерти, не отождествляя слово полностью с шеолом и сохраняя поэтический параллелизм.
theological_decisions:
- issue: Передача שְׁאוֹל в поэтическом контексте суда
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: «Шеол» сохраняет образ подземного мира мёртвых и поэтическую связь с «глубинами могильной ямы», не сводя выражение ни к физической могиле, ни к позднейшему систематизированному представлению об аде.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Пассивное «будешь низведён» сохраняет грамматическую форму и резкий контраст с хвастливым намерением взойти выше в предыдущих стихах.
