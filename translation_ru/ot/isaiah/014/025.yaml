base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/025.yaml
  text: to break Assyria in my land[a], and on my mountains I will trample him; then his yoke will depart from upon them[b], and his burden from upon his shoulder will depart.
translation:
  language: ru
  text: чтобы сокрушить Ассирию[a] в Моей земле и растоптать её на Моих горах. Тогда её ярмо сойдёт с них[b], и её бремя сойдёт с его плеча.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ассирийца». Еврейское слово может обозначать как Ассирию, так и её представителя — царя или войско.'
    reason: alternative_reading
  - marker: b
    text: В еврейском тексте сначала стоит множественное число — «с них», а затем единственное — «с его плеча». Единственное число может олицетворять угнетённый народ или относиться к каждому из угнетённых в отдельности.
    reason: number_shift
lexical_decisions:
- source_word: לִשְׁבֹּר
  choice: сокрушить
  rationale: Инфинитив от שׁבר продолжает формулировку предшествующей клятвы и выражает намеченное действие. «Сокрушить» естественно передаёт решительную победу, сохраняя образ исходного глагола.
- source_word: אַשּׁוּר
  choice: Ассирию
  rationale: Название может обозначать как страну и державу, так и «ассирийца» — её царя или войско. В основном тексте выбрано корпоративное значение, а неоднозначность отмечена в сноске.
- source_word: בְּאַרְצִי
  choice: в Моей земле
  rationale: Буквально и естественно передаёт אֶרֶץ с суффиксом первого лица, сохраняя территориальный смысл и утверждение Божьей принадлежности земли.
- source_word: הָרַי
  choice: на Моих горах
  rationale: Сохранены множественное число и суффикс первого лица; выражение передаёт как географический образ, так и принадлежность этой местности Богу.
- source_word: אֲבוּסֶנּוּ
  choice: растоптать её
  rationale: Глагол בוס означает «топтать, попирать». Еврейский объект выражен мужским единственным числом, поскольку אַשּׁוּר грамматически мужского рода; по-русски согласование с названием «Ассирия» требует женского местоимения.
- source_word: וְסָר
  choice: будет снято
  rationale: Глагол סור означает удаление или прекращение. С ярмом русское «будет снято» естественно передаёт результат разгрома угнетателя, не меняя образа.
- source_word: מֵעֲלֵיהֶם
  choice: с них
  rationale: Передаёт предлог מעל и суффикс множественного числа без тяжеловесного буквального оборота «сверху них».
- source_word: עֻלּוֹ
  choice: её ярмо
  rationale: «Ярмо» — традиционный и понятный образ господства и угнетения. Местоимение относится к Ассирии; в русском оно согласовано с женским родом названия.
- source_word: סֻבֳּלוֹ
  choice: её бремя
  rationale: В параллели с ярмом обозначает навязанную тяжесть и гнёт; «бремя» сохраняет метафору и возвышенный, но понятный регистр.
- source_word: שִׁכְמוֹ
  choice: его плеча
  rationale: Сохранён масоретский суффикс единственного числа у обозначения угнетённого, несмотря на предшествующее множественное «с них». Этот переход числа отмечен в сноске.
- source_word: יָסוּר
  choice: сойдёт
  rationale: Второе употребление סור передано близким по смыслу, но естественным для сочетания с «бременем» глаголом. Образ тяжести, уходящей с плеча, сохраняется.
theological_decisions:
- issue: Референт אַשּׁוּר
  choice: Ассирия как имперская держава, представленная как единый действующий угнетатель
  alternative: «ассириец» — царь, военачальник или вторгшееся войско
  rationale: Контекст говорит о разгроме политической силы и снятии её ярма. «Ассирия» хорошо выражает собирательный смысл, но возможный личный или представительский смысл не устранён и вынесен в сноску.
- issue: Переход от множественного числа угнетённых к единственному
  choice: 'Сохранить: «с них… с его плеча»'
  alternative: 'Согласовать по множественному числу: «с их плеч»'
  rationale: Масоретский текст явно переходит от множественного суффикса в מֵעֲלֵיהֶם к единственному в שִׁכְמוֹ. Перевод не нормализует эту напряжённость; единственное число может олицетворять угнетённый народ либо иметь распределительное значение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Заглавные буквы в «Моей» и «Моих» указывают на речь Бога. Синтаксис сохраняет параллелизм и переход числа оригинала, но избегает неестественных русских конструкций.
