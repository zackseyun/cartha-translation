base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/004.yaml
  text: 'you will take up this taunt against the king of Babylon[a], and say: “How the oppressor has ceased, the insolence has ceased!”'
translation:
  language: ru
  text: 'И произнесёшь эту насмешливую песнь против царя Вавилона и скажешь:


    «Как не стало притеснителя,

    прекратилась тирания![a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово מַדְהֵבָה встречается только здесь, и его точное значение неизвестно. Возможные переводы: «натиск», «вымогательство», «жестокое угнетение»; по древней переводческой традиции — «золотой город».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂאתָ
  choice: и произнесёшь
  rationale: В сочетании с מָשָׁל глагол נָשָׂא означает «поднять голос, произнести». По-русски «произнесёшь» естественно передаёт эту идиому.
- source_word: הַמָּשָׁל הַזֶּה
  choice: эту насмешливую песнь
  rationale: В данном контексте מָשָׁל обозначает не просто пословицу, а поэтическую насмешку над поверженным владыкой. Выражение передаёт и жанр, и враждебно-ироническую функцию текста.
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: против царя Вавилона
  rationale: Предлог עַל может означать «о» или «против»; содержание насмешки здесь поддерживает направленное, враждебное значение «против».
- source_word: אֵיךְ
  choice: как
  rationale: Слово вводит восклицательную строку насмешки. Повтор «как» во второй строке естественно раскрывает параллелизм, хотя в еврейском тексте оно выражено один раз.
- source_word: שָׁבַת / שָׁבְתָה
  choice: не стало / прекратилась
  rationale: Обе формы одного глагола означают прекращение. Небольшое русское варьирование делает фразу естественной, сохраняя смысловой параллелизм.
- source_word: נֹגֵשׂ
  choice: притеснитель
  rationale: Причастно-именная форма обозначает того, кто принуждает, взыскивает повинности и угнетает. «Притеснитель» понятно современному читателю и подходит политическому контексту.
- source_word: מַדְהֵבָה
  choice: тирания
  rationale: Это редкое и неясное слово. В контексте параллелизма с «притеснителем» вероятнее всего имеется в виду жестокое господство, натиск или вымогательство; «тирания» ёмко передаёт этот смысл, а неопределённость отмечена в сноске.
theological_decisions:
- issue: Значение редкого слова מַדְהֵבָה
  choice: тирания
  alternative: натиск; вымогательство; золотой город
  rationale: Вопрос носит лексический, а не конфессиональный характер. Контекст благоприятствует обозначению угнетения или жестокого господства, однако форма уникальна и допускает традиционное толкование, связанное с золотом; поэтому альтернативы не скрыты, а вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Синтаксис остаётся доступным, а параллельные восклицания сохраняют риторику еврейской насмешливой песни.
