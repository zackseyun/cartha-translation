base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/003.yaml
  text: And it shall be[a], in the day when Yahweh gives you rest from your pain and your turmoil, and from the hard service with which you were made to serve[b],
translation:
  language: ru
  text: 'И будет так: в тот день, когда Яхве даст тебе покой от твоих страданий, тревоги и от тяжкого труда, к которому тебя принуждали[a], —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от тяжкой работы, возложенной на тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет пророческую вводную формулу и связь с последующим контекстом, не прибегая к архаичному «и будет в тот день» как самостоятельной законченной фразе.
- source_word: בְּיוֹם
  choice: в тот день, когда
  rationale: Передаёт временную конструкцию естественным современным русским оборотом.
- source_word: הָנִיחַ
  choice: даст тебе покой
  rationale: Каузатив породы хифиль означает дарование покоя или облегчения; выбранный оборот сохраняет образ покоя.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מֵעָצְבְּךָ
  choice: от твоих страданий
  rationale: עֶצֶב может обозначать боль, скорбь и мучение; множественное «страдания» естественно по-русски и не ограничивает смысл лишь телесной болью или душевной печалью.
- source_word: וּמֵרָגְזֶךָ
  choice: тревоги
  rationale: רֹגֶז обозначает смятение, беспокойство или внутреннее потрясение; «тревога» ясно передаёт состояние беспокойства, не добавляя идеи гнева.
- source_word: הָעֲבֹדָה הַקָּשָׁה
  choice: тяжкого труда
  rationale: Передаёт работу или службу под гнётом, не уточняя без достаточного основания юридический статус рабства.
- source_word: אֲשֶׁר עֻבַּד בָּךְ
  choice: к которому тебя принуждали
  rationale: Необычная пассивная конструкция с עבד и ב указывает на навязанный адресату труд; русский оборот ясно выражает принудительность и связывается с «трудом».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Характер тяжкого труда
  choice: тяжкий труд, к которому принуждали
  alternative: жестокое рабство; тяжкая работа, возложенная на тебя
  rationale: Текст явно выражает принудительный труд, но сам по себе не требует более узкого юридического понятия рабства; формулировка сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаичным синтаксисом. Двоеточие и завершающее тире показывают, что стих вводит действие следующего стиха и не является завершённым предложением.
