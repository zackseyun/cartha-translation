  terminology: «Яхве Воинств» корректно сохраняет личное имя и титул יהוה צבאות. «Ёж» допустим как основной, но не бесспорный вариант для קִפֹּד; сноска надлежащим образом сохраняет неопределённость. «Болотистые водоёмы» передаёт אַגְמֵי מָיִם без неоправданной точной идентификации ландшафта.
