base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/023.yaml
  text: I will make her a possession of the hedgehog and pools of water[a], and I will sweep her with the broom of destruction, declares Yahweh of Armies.
translation:
  language: ru
  text: И отдам её во владение ежу[a] и превращу в болотистые водоёмы; я вымету её метлой уничтожения, — возвещает Яхве Воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское קִפֹּד, вероятно, обозначает животное, обитающее в пустынных местах или среди развалин; возможны переводы «дикобраз», «сова» и традиционное «выпь».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּיהָ
  choice: Я сделаю её
  rationale: Форма שׂוּם с дополнением и сказуемым естественно передаётся как «сделаю»; местоимение женского рода сохраняет олицетворение Вавилона как города.
- source_word: לְמוֹרַשׁ
  choice: владением
  rationale: מוֹרָשׁ обозначает владение или территорию, которой завладели; эта передача сохраняет образ разорённого города как обиталища дикого существа.
- source_word: קִפֹּד
  choice: ежа
  rationale: Точное животное, обозначенное קִפֹּד, неизвестно. «Ёж» — вероятная современная передача; неопределённость отражена в сноске.
- source_word: וְאַגְמֵי מָיִם
  choice: и местом водоёмов
  rationale: אַגַם означает водоём, пруд или болотистое место. Добавление «местом» по-русски ясно связывает вторую часть с глаголом «сделаю», не устраняя образ затопленного запустения.
- source_word: וְטֵאטֵאתִיהָ
  choice: Я вымету её
  rationale: Глагол טאטא значит «мести, выметать». «Вымету» естественно передаёт направленное и полное удаление, сохраняя яркую метафору.
- source_word: בְּמַטְאֲטֵא הַשְׁמֵד
  choice: метлой уничтожения
  rationale: Сохранена исходная инструментальная и родительная конструкция, а также намеренно резкий образ окончательного опустошения.
- source_word: נְאֻם
  choice: возвещает
  rationale: Торжественная и понятная передача устойчивой пророческой формулы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, непосредственно стоящее в еврейском тексте, а не заменено титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: «Воинств» сохраняет широкий смысл צְבָאוֹת — собранных сил или небесных и земных войск — и привычную торжественность божественного наименования.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Референт суффиксов женского рода
  choice: её
  alternative: его
  rationale: Еврейские суффиксы женского рода относятся к олицетворённому Вавилону; русский женский род сохраняет пророческий образ города-женщины.
- issue: Объём значения צְבָאוֹת
  choice: Воинств
  alternative: Сил; воинств небесных
  rationale: Исходное слово допускает широкий образ множества организованных сил; «Воинств» не ограничивает его только ангелами или только человеческими армиями.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Сохранены олицетворение Вавилона, метафора метлы и неоднозначность названия животного; синтаксис слегка расправлен ради естественности русского языка.
