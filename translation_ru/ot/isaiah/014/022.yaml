review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Яхве возвещает суд над Вавилоном, с сохранением повторённой формулы נְאֻם и четырёхчленного перечня. Однако сочетание «истреблю у Вавилона» в современном литературном русском звучит неестественно и синтаксически неясно. Более ясная конструкция «лишу Вавилон» передаёт лишительное значение לְבָבֶל после глагола уничтожения, не добавляя нового смысла.'
  naturalness: '«Восстану против них» и «возвещает Яхве» уместны в торжественном пророческом регистре. Следует заменить «у Вавилона» и устранить неудачную разнородность «потомка и потомство»: пара во множественном числе читается естественнее и по-прежнему сохраняет два элемента исходной формулы.'
  terminology: «Яхве» последовательно передаёт יהוה; «Яхве Воинств» приемлемо для צְבָאוֹת и сохраняет библейскую торжественность. «Имя и остаток» точно отражает שֵׁם וּשְׁאָר. «Потомков и потомство» сохраняет намеренную широту и не навязывает спорное узкое значение «сын и внук».
  issues:
  - severity: medium
    issue: 'Неестественное управление: «истреблю у Вавилона».'
    rationale: В современном русском «истребить у кого-либо» не является ясной или естественной конструкцией. Она затрудняет понимание того, что Вавилон лишается имени, остатка и преемственности.
  - severity: low
    issue: Разнородная и стилистически тяжёлая пара «потомка и потомство».
    rationale: Единственное число «потомка» рядом со собирательным «потомство» создаёт ненужную шероховатость. Множественное «потомков и потомство» естественнее, при этом не уточняет спорные степени родства оригинала.
  revised_text: И восстану против них, — возвещает Яхве Воинств, — и лишу Вавилон имени и остатка, потомков и потомства, — возвещает Яхве.
  revised_footnotes:
