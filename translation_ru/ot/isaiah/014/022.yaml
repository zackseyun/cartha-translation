  text: וְ/קַמְתִּ֣י עֲלֵי/הֶ֔ם נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/הִכְרַתִּ֨י לְ/בָבֶ֜ל שֵׁ֥ם וּ/שְׁאָ֛ר וְ/נִ֥ין וָ/נֶ֖כֶד נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/022.yaml
  text: And I will rise up against them[a], declares Yahweh of Armies, and I will cut off from Babylon name and remnant, offspring and posterity[b], declares Yahweh.
translation:
  language: ru
  text: И восстану против них, — возвещает Яхве Воинств, — и лишу Вавилон имени и остатка, потомков и потомства, — возвещает Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקַמְתִּי עֲלֵיהֶם
  choice: И восстану против них
  rationale: Пророческий перфект передан будущим временем; сочетание קום с עַל выражает активное выступление против кого-либо и сохраняет судебно-военный образ.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Яхве Воинств
  rationale: Пророческая формула נְאֻם естественно передана глаголом «возвещает»; имя יהוה транслитерировано как «Яхве», а צְבָאוֹת переведено прозрачно и с сохранением военной силы титула.
- source_word: וְהִכְרַתִּי לְבָבֶל
  choice: и истреблю у Вавилона
  rationale: Hiphil כרת в контексте суда означает полное устранение или истребление. Предлог ל после этого глагола имеет лишительный смысл; «у Вавилона» естественно вводит перечень того, чего он будет лишён.
- source_word: שֵׁם וּשְׁאָר
  choice: имя и остаток
  rationale: Буквальная парная формула сохраняет смысл уничтожения памяти, идентичности и всего уцелевшего, не сводя «имя» только к славе или репутации.
- source_word: נִין וָנֶכֶד
  choice: потомка и потомство
  rationale: Редкая аллитерирующая пара обозначает продолжение рода и последующие поколения. Выбранная формулировка сохраняет двухчленность и не приписывает словам чрезмерно точных степеней родства.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Заключительная пророческая формула сохранена, поскольку её повтор создаёт торжественное обрамление и подчёркивает авторитет изречения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное заветное имя. «Яхве» непосредственно передаёт его и отличает от титула «Господь».
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; Небесных Воинств
  rationale: «Воинств» сохраняет традиционную библейскую торжественность и военный смысл титула, не ограничивая его только небесными силами.
- issue: Объём суда над Вавилоном
  choice: сохранить четырёхчленную формулу «имя и остаток, потомка и потомство»
  alternative: развернуть как полное уничтожение памяти и всех потомков
  rationale: Исходная формула риторически выражает всеохватность, но перевод не должен превращать её интерпретацию в основной текст или сглаживать поэтическое напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Синтаксический параллелизм и повтор формулы «возвещает Яхве» сохранены; архаизмы сведены к минимуму, кроме уместного титула «Воинств».
