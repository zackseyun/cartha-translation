revisions:
- from: И восстану против них, — возвещает Яхве Воинств[a], — и истреблю у Вавилона имя и остаток, потомка и потомство[b], — возвещает Яхве.
  to: И восстану против них, — возвещает Яхве Воинств, — и лишу Вавилон имени и остатка, потомков и потомства, — возвещает Яхве.
  rationale: Исправление ограничено русской идиоматикой и согласованием. «Лишу Вавилон» ясно выражает результат действия, заложенный в еврейской конструкции, а «потомков и потомство» сохраняет риторическую двухчленность без чрезмерного толкования נִין и נֶכֶד. Сноски и их привязки сохранены.
