id: ISA.14.20
reference: Isaiah 14:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹֽא תֵחַ֤ד אִתָּ/ם֙ בִּ/קְבוּרָ֔ה כִּֽי אַרְצְ/ךָ֥ שִׁחַ֖תָּ עַמְּ/ךָ֣ הָרָ֑גְתָּ לֹֽא יִקָּרֵ֥א לְ/עוֹלָ֖ם זֶ֥רַע מְרֵעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/020.yaml
  text: You will not be joined with them in burial[a], because you have destroyed your land; you have slain your people. The offspring of evildoers will never be named.
translation:
  language: ru
  text: Ты не будешь погребён вместе с ними, ибо ты разорил свою страну, убил свой народ. Потомство злодеев[a] вовек не будет названо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семя злодеев»; или: «потомки нечестивых».'
    reason: Лексема זֶרַע допускает значения «семя», «потомство», «потомки», а מְרֵעִים можно передать как «злодеи» или «нечестивые».
lexical_decisions:
- source_word: תֵחַד אִתָּם בִּקְבוּרָה
  choice: не соединишься с ними в погребении
  rationale: Передаёт значение יחד «соединяться, быть вместе» и сохраняет קְבוּרָה как обозначение погребения, не подменяя его конкретным местом — могилой.
- source_word: אַרְצְךָ שִׁחַתָּ
  choice: разорил свою землю
  rationale: «Разорил» естественно для современного русского пророческого обличения и передаёт разрушительный смысл Piel глагола שׁחת применительно к стране правителя.
- source_word: עַמְּךָ הָרָגְתָּ
  choice: убил свой народ
  rationale: 'Прямо передаёт обвинение и сохраняет выразительную иронию притяжательного оборота: правитель убил собственный народ.'
- source_word: לֹא יִקָּרֵא לְעוֹלָם
  choice: не будет названо вовек
  rationale: Сохраняет пассивную форму и смысл непреходящего лишения имени или памяти, не сужая выражение до одного истолкования.
- source_word: זֶרַע מְרֵעִים
  choice: потомство злодеев
  rationale: «Потомство» естественно передаёт собирательное זֶרַע, а «злодеев» сохраняет грамматическое множественное число и нравственную характеристику מְרֵעִים.
theological_decisions:
- issue: Относится ли זֶרַע מְרֵעִים исключительно к династии осуждённого правителя или шире — к потомству злодеев
  choice: потомство злодеев
  alternative: потомство этого злодея; потомки нечестивого
  rationale: В еврейском тексте «злодеи» стоит во множественном числе и выражение формально имеет общий характер. Контекст допускает отнесение к роду данного правителя, но перевод не сужает формулировку без текстового основания.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формулировки прямые и понятные; «вовек» сохраняет возвышенный библейский регистр без архаизации всего стиха.
