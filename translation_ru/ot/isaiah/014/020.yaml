review_pass:
  verdict: revise
  source_fidelity: Первая фраза черновика буквально ориентирована на יחד «соединяться», однако русский оборот «соединишься с ними в погребении» звучит неестественно и может быть понят как участие в чьём-то погребении. Смысл еврейского בִּקְבוּרָה — быть погребённым вместе с ними — яснее передаётся пассивной конструкцией. «Страну» уместно передаёт אַרְצְךָ как владение/государство правителя; обвинение в разорении и убийстве сохранено. «Потомство злодеев ... не будет названо вовек» сохраняет собирательное זֶרַע, множественное מְרֵעִים и пассивное יִקָּרֵא, не навязывая более узкое толкование.
  naturalness: «Ты не будешь погребён вместе с ними» — естественная современная литературная формулировка с должным пророческим регистром. Она точнее и яснее, чем «не соединишься с ними в погребении». Остальные формулировки понятны; «вовек» оправдано возвышенным стилем стиха.
  terminology: «Потомство злодеев» удачно передаёт собирательное «семя/потомство» и нравственную характеристику. Сноска корректно отмечает основные лексические альтернативы и не сужает референт до одной династии.
