  text: אַֽל תִּשְׂמְחִ֤י פְלֶ֨שֶׁת֙ כֻּלֵּ֔/ךְ כִּ֥י נִשְׁבַּ֖ר שֵׁ֣בֶט מַכֵּ֑/ךְ כִּֽי מִ/שֹּׁ֤רֶשׁ נָחָשׁ֙ יֵ֣צֵא צֶ֔פַע וּ/פִרְי֖/וֹ שָׂרָ֥ף מְעוֹפֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/029.yaml
  text: Do not rejoice, all of you Philistia, because the rod that struck you is broken; for from the root of the serpent will come out a viper, and its fruit will be a flying fiery serpent.
translation:
  language: ru
  text: 'Не радуйся, вся Филистия, что сломан жезл, поражавший тебя: ведь из корня змея выйдет гадюка, а его плодом будет летучий огненный змей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּלֶשֶׁת כֻּלֵּךְ
  choice: вся Филистия
  rationale: Сохраняет прямое обращение к стране как к единому лицу; форма женского рода соответствует еврейскому обращению.
- source_word: שֵׁבֶט
  choice: жезл
  rationale: Передаёт образ орудия власти и наказания; «палка» была бы стилистически сниженной, а «скипетр» чрезмерно сужал бы значение.
- source_word: מַכֵּךְ
  choice: поражавший тебя
  rationale: Причастная конструкция естественно передаёт действующее лицо и сохраняет повторяющееся насилие без лишнего уточнения.
- source_word: צֶפַע
  choice: гадюка
  rationale: Обозначает ядовитую змею; точный биологический вид в контексте не установлен, поэтому выбрано понятное родовое соответствие.
- source_word: שָׂרָף מְעוֹפֵף
  choice: летучий огненный змей
  rationale: 'Сохраняет оба элемента образа: שָׂרָף связан с жгучестью/огненностью, а מְעוֹפֵף означает «летающий, летучий».'
theological_decisions:
- issue: К чему относится местоимение וּפִרְיוֹ («его плод»)
  choice: «плодом её» — плод гадюки
  alternative: «его плод» — плод корня или змея
  rationale: В русском ближайшее существительное «гадюка» естественно служит антецедентом; образ последовательного усиления угрозы сохраняется. Еврейская форма мужского рода грамматически соотносится с צֶפַע, хотя русское соответствие женского рода.
- issue: Природа «летучего огненного змея»
  choice: Образ сохранён буквально без объяснения
  alternative: Истолковать как конкретного правителя, войско или вид змеи
  rationale: Стих сам не раскрывает референт метафоры; перевод не должен навязывать историко-богословскую идентификацию.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис прямой и понятный; цепочка образов «змей — гадюка — летучий огненный змей» сохранена без рационализации.
