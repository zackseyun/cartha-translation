base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/021.yaml
  text: Prepare slaughter for his sons because of the guilt of their fathers[a], lest they rise up and possess the land[c][b], and fill the face of the world with cities.
translation:
  language: ru
  text: Приготовьте расправу над его сыновьями за вину их отцов[a], чтобы они не восстали, не завладели землёй[b] и не наполнили мир городами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за беззаконие их отцов». Еврейское עָוֹן может обозначать вину, беззаконие или наказание как следствие вины.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не унаследовали землю» или «не овладели страной». Еврейский глагол может означать наследовать, овладевать или владеть, а אָרֶץ — землю или страну.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не наполнили лицо обитаемого мира городами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכִינוּ לְבָנָיו מַטְבֵּחַ
  choice: Приготовьте его сыновьям бойню
  rationale: Повелительная форма передана прямо. «Бойня» сохраняет жестокий смысл מַטְבֵּחַ и в современном русском звучит естественнее, чем архаичное «заклание»; конструкция с дательным передаёт לְבָנָיו без добавления идеи особого места.
- source_word: בַּעֲוֺן אֲבוֹתָם
  choice: за вину их отцов
  rationale: Предлог ב здесь выражает основание кары, а עָוֹן допускает значения вины, беззакония и его последствий. «За вину» сохраняет нравственную ответственность и не сводит слово только к наказанию.
- source_word: בַּל יָקֻמוּ
  choice: чтобы они не восстали
  rationale: בַּל вводит отрицательную цель или предотвращаемый результат. «Восстали» передаёт как буквальное поднятие, так и вероятный политический оттенок прихода к силе.
- source_word: וְיָרְשׁוּ אָרֶץ
  choice: не завладели землёй
  rationale: ירש может означать наследовать, овладевать или владеть. В контексте царской экспансии «завладеть» естественно и не привносит обязательного заветного оттенка наследования; «земля» сохраняет отличие אָרֶץ от последующего תֵבֵל — «мира».
- source_word: וּמָלְאוּ פְנֵי תֵבֵל עָרִים
  choice: не наполнили мир городами
  rationale: Смысл еврейского образа передан ясным современным русским выражением. Буквальное «лицо мира» отмечено в сноске, а עָרִים передано обычным значением «города».
theological_decisions:
- issue: Межпоколенческий суд за вину отцов
  choice: Сохранить прямую связь гибели сыновей с виной их отцов
  alternative: Уточнить, что сыновья наказываются лишь потому, что продолжают грехи отцов, либо понимать עָוֹן исключительно как последствия наказания
  rationale: Еврейский текст прямо связывает приготовленную сыновьям бойню с עָוֹן их отцов. Перевод не смягчает и не разрешает возникающее богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Бойня» намеренно сохраняет суровость образа, не прибегая к архаизму «заклание». Повтор частицы «не» делает цепочку отрицательной цели ясной по-русски; различие между «землёй» (אָרֶץ) и «миром» (תֵבֵל) сохранено.
