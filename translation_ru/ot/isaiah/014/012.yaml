source:
  edition: WLC
  text: אֵ֛יךְ נָפַ֥לְתָּ מִ/שָּׁמַ֖יִם הֵילֵ֣ל בֶּן שָׁ֑חַר נִגְדַּ֣עְתָּ לָ/אָ֔רֶץ חוֹלֵ֖שׁ עַל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/012.yaml
  text: How you have fallen from heaven[a], shining one, son of dawn! You have been cut down to the earth, you who subdued the nations.
translation:
  language: ru
  text: Как упал ты с небес[a], сияющий, сын зари! Срублен ты до земли, сокрушавший народы!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское הֵילֵל традиционно передавалось по-славянски как «денница», а в латинской традиции — как «Люцифер». Буквально слово обозначает сияющую небесную фигуру; его часто понимают как «утреннюю звезду».
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: Как
  rationale: Передаёт восклицательное изумление и насмешливо-скорбную риторическую силу, не добавляя отдельного междометия.
- source_word: נָפַלְתָּ מִשָּׁמַיִם
  choice: упал ты с небес
  rationale: Сохраняет завершённость падения, прямое обращение и возвышенную поэтическую инверсию.
- source_word: הֵילֵל
  choice: сияющий
  rationale: Передаёт образ блистающей небесной фигуры, не превращая неоднозначное еврейское обозначение в бесспорное собственное имя.
- source_word: בֶּן־שָׁחַר
  choice: сын зари
  rationale: Буквально сохраняет древнееврейский поэтический образ и его связь с небесным сиянием.
- source_word: נִגְדַּעְתָּ לָאָרֶץ
  choice: срублен ты наземь
  rationale: Глагол сохраняет образ насильственного отсечения или срубания, а «наземь» естественно передаёт направление падения и поддерживает противопоставление небес и земли.
- source_word: חוֹלֵשׁ עַל־גּוֹיִם
  choice: покорявший народы
  rationale: Естественно передаёт причастное обозначение прежнего господства или сокрушительного воздействия этой фигуры на народы, не уточняя способ такого господства.
theological_decisions:
- issue: Следует ли переводить הֵילֵל традиционным именем «Люцифер»
  choice: Описательное «сияющий» в основном тексте
  alternative: «Люцифер», «денница», «утренняя звезда»
  rationale: В еврейском тексте слово выступает как поэтическое обозначение и не является бесспорно установленным личным именем. Описательный перевод сохраняет исходный образ и не навязывает позднейшую традицию; исторически значимые варианты указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичной поэтической инверсией. Сохранены возвышенный тон насмешливой песни, небесно-земной контраст и образ насильственного низвержения; архаическое собственное имя не внесено в основной текст.
