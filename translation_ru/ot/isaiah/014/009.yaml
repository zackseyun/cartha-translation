    text: 'Евр. «рефаимы»; здесь — умершие, обитатели Шеола. Возможные переводы: «мертвецы» или «духи умерших».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Транслитерация сохраняет древнееврейское обозначение мира мёртвых и не привносит более поздние представления, связанные со словом «ад», а также не сужает значение до одной лишь могилы.
- source_word: מִתַּחַת
  choice: внизу
  rationale: Передаёт пространственный образ Шеола, находящегося внизу, естественным для современного русского языка выражением.
- source_word: רָגְזָה
  choice: пришёл в смятение
  rationale: Глагол выражает сильное волнение, содрогание или возбуждение; выбранная формулировка поддерживает олицетворение Шеола и не сводит образ только к физическому землетрясению.
- source_word: לִקְרַאת בּוֹאֶךָ
  choice: чтобы встретить тебя, когда ты придёшь
  rationale: Ясно передаёт цель и прибытие адресата, сохраняя драматическую картину приготовления Шеола к встрече.
- source_word: עוֹרֵר
  choice: пробуждает
  rationale: 'Передаёт причинное действие: Шеол заставляет своих обитателей подняться навстречу прибывающему царю.'
- source_word: רְפָאִים
  choice: тени умерших
  rationale: В данном контексте слово обозначает обитателей мира мёртвых, а не древний народ рефаимов; сочетание сохраняет поэтический потусторонний образ и остаётся понятным современному читателю.
- source_word: עַתּוּדֵי אָרֶץ
  choice: всех вождей земли
  rationale: Буквально это «козлы земли» — метафора выдающихся правителей. В основном тексте передан смысл метафоры, а её буквальный образ отмечен в сноске.
- source_word: הֵקִים
  choice: поднимает
  rationale: Каузативная форма изображает Шеол заставляющим умерших царей встать; настоящее время поддерживает живость поэтической сцены.
- source_word: מִכִּסְאוֹתָם
  choice: с их престолов
  rationale: «Престолы» естественно передают царские сиденья и связывают выражение с последующим упоминанием царей.
- source_word: כֹּל מַלְכֵי גוֹיִם
  choice: всех царей народов
  rationale: Сохраняет всеобщий охват и политический образ оригинала; «народы» точно передаёт גוֹיִם в данном контексте.
theological_decisions:
- issue: Передача שְׁאוֹל в поэтической насмешке о мире мёртвых
  choice: Шеол
  alternative: могила; мир мёртвых; ад
  rationale: В стихе Шеол олицетворён как подземная область, принимающая павшего царя. Транслитерация сохраняет древнееврейский образ и подлинную смысловую напряжённость, не отождествляя его без основания ни с отдельной могилой, ни с позднейшим доктринальным понятием ада.
- issue: Идентификация רְפָאִים
  choice: тени умерших
  alternative: рефаимы; мертвецы; духи умерших
  rationale: Контекст Шеола указывает на умерших царей и властителей. Перевод не трактует слово как название этнической группы, но сохраняет поэтический характер обозначения обитателей мира мёртвых.
