  terminology: «Шеол» удачно сохранён транслитерацией. «Тени» передаёт поэтическое значение רְפָאִים; сноска должна пояснять, что это не этноним. Буквальный образ «козлов земли» в сноске уместен и не требует переноса в основной текст.
