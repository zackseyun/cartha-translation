base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/009.yaml
  text: Sheol beneath is stirred up for you[a], to meet your coming; it rouses the shades for you, all the leaders of the earth[b]; it raises from their thrones all the kings of the nations.
translation:
  language: ru
  text: Шеол внизу содрогнулся из-за тебя, чтобы встретить тебя при твоём приходе; он пробуждает для тебя тени[a] — всех властителей земли; он поднимает с их престолов всех царей народов.
  philosophy: optimal-equivalence
  footnotes:
