  source_fidelity: 'В целом образ и синтаксические связи оригинала переданы верно: Шеол олицетворён, он приходит в движение при прибытии адресата, пробуждает רְפָאִים и поднимает царей с престолов. Однако «пришёл в смятение» несколько ослабляет телесно-поэтический оттенок רָגְזָה, а «ради тебя» может звучать как указание на пользу адресату, тогда как לְךָ здесь обозначает действие, вызванное его приходом и направленное на встречу с ним.'
