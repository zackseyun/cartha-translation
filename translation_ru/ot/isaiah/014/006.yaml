  yaml_path: translation/ot/isaiah/014/006.yaml
  text: striking peoples in fury with an unceasing blow[a], ruling nations in anger[b], with unrelenting persecution.
translation:
  language: ru
  text: поражавший народы в ярости непрестанным ударом[a], в гневе властвовавший над народами, — преследуемый без удержу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ударом, не прекращавшимся»; буквально: «ударом, не отступавшим».'
    reason: lexical_alternative
  - marker: b
    text: Еврейская заключительная фраза предельно сжата. «Преследуемый» передаёт её пассивную форму; её также понимают как указание на безудержное, неослабевающее преследование народов.
    reason: alternative_reading
lexical_decisions:
- source_word: מַכֶּה
  choice: поражавший
  rationale: Причастие породы hифиль описывает постоянное, характерное действие угнетателя и согласуется с причастием רֹדֶה.
- source_word: עַמִּים
  choice: народы
  rationale: Обычное обозначение народов или человеческих общностей; здесь выступает объектом насильственных действий правителя.
- source_word: בְּעֶבְרָה
  choice: в ярости
  rationale: עֶבְרָה передаёт сильный, как бы переполняющий гнев; «в ярости» естественно и выразительно по-русски.
- source_word: מַכַּת בִּלְתִּי סָרָה
  choice: непрестанными ударами
  rationale: Буквально речь об ударе, который «не отступает» или «не прекращается». Русское множественное число естественно выражает повторяющееся насилие.
- source_word: רֹדֶה
  choice: властвовавший
  rationale: Причастие от רדה может означать властвовать, подчинять или попирать; «властвовавший» сохраняет основной смысл, тогда как жестокость власти раскрывает контекст.
- source_word: בָאַף
  choice: в гневе
  rationale: אַף буквально означает «нос», но в данном устойчивом употреблении обозначает гнев.
- source_word: גּוֹיִם
  choice: народами
  rationale: גּוֹיִם обычно означает народы. Повтор слова «народы» в русском предпочтительнее искусственного разграничения через современное «нации» или неточное «племена».
- source_word: מֻרְדָּף בְּלִי חָשָׂךְ
  choice: преследуя их без удержу
  rationale: Сжатая еврейская конструкция выражает неослабевающее преследование. Активная русская формулировка связывает его с действиями угнетателя, а местоимение «их» — с народами; формальная неоднозначность отмечена в сноске.
theological_decisions:
- issue: Синтаксис и субъект заключительной части стиха
  choice: 'Заключительные слова продолжают характеризовать угнетателя: он безудержно преследовал народы.'
  alternative: 'Форму מֻרְדָּף можно формально понять как пассивное «преследуемый», либо отнести её к народам: «народы, неотступно преследуемые».'
  rationale: Контекст насмешливой песни о царе Вавилона и параллелизм описывают его прежнее угнетение. Основной текст передаёт этот вероятный смысл, а сноска сохраняет сжатость и грамматическую трудность масоретского текста.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической обличительной речи. Причастные обороты сохраняют связь с предшествующим контекстом и параллелизм еврейского стиха; выражение «без удержу» передаёт неограниченный характер насилия без архаизации.
