  source_fidelity: Нужна правка заключительной части. מֻרְדָּף — пассивное причастие («преследуемый / гонимый»), тогда как «преследуя их» делает его активным и добавляет прямое дополнение, отсутствующее в еврейском тексте. Синтаксис этой строки труден; основной текст должен сохранять пассивную форму, а альтернативное понимание как безудержного преследования народов следует отразить в сноске. Для מַכַּת уместнее сохранить единственное число («ударом»), как в исходном тексте.
  naturalness: «Поражавший… властвовавший… преследуемый…» — намеренно сжатая, поэтическая цепь причастий и естественна для современного литературного русского в контексте пророческой насмешливой песни. Тире перед последним членом помогает читателю воспринять смену залога, не объясняя её интерпретативно.
  terminology: «Народы», «ярость», «гнев», «властвовавший» и «без удержу» подходят по регистру. В сноске к [a] прежнее «ударами без пощады» не является ясной альтернативой именно для מַכַּת בִּלְתִּי סָרָה; её следует заменить вариантом, отражающим значение «не прекращающийся / не отступающий».
