source:
  edition: WLC
  text: נִשְׁבַּ֛ע יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר אִם לֹ֞א כַּ/אֲשֶׁ֤ר דִּמִּ֨יתִי֙ כֵּ֣ן הָיָ֔תָה וְ/כַ/אֲשֶׁ֥ר יָעַ֖צְתִּי הִ֥יא תָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/024.yaml
  text: 'Yahweh of Armies has sworn[a], saying: Surely, just as I have planned, so it has come to pass; and just as I have purposed[d][c][b], so it will stand.'
translation:
  language: ru
  text: 'Яхве Воинств поклялся: «Воистину, как Я замыслил, так и стало; и как Я решил, так и устоит»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское «если не» — клятвенная формула со значением «воистину, непременно». «Так и стало» передаёт еврейскую форму совершенного вида; в пророческом высказывании она может выражать несомненность исполнения. Буквально в конце: «оно встанет/устоит».'
    reason: Поясняет клятвенную идиому, сохраняет временную особенность еврейского перфекта и образность глагола «стоять», не навязывая единственного толкования.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Господь Воинств
  rationale: Передаёт традиционно узнаваемое в русском библейском языке обозначение Бога и сохраняет конкретный смысл צְבָאוֹת — небесные или воинские силы; прописная буква подчёркивает составной божественный титул.
- source_word: נִשְׁבַּע
  choice: поклялся
  rationale: Перфект обозначает совершённую торжественную клятву; русская форма прошедшего времени естественна и не ослабляет её сохраняющуюся силу.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В русском языке функцию еврейского «говоря» естественно выполняет синтаксическое введение прямой речи; буквальное «сказав» здесь было бы тяжеловесно.
- source_word: אִם לֹא
  choice: Воистину
  rationale: В составе клятвенной формулы это не обычное условие «если не», а усиленное утверждение; «воистину» передаёт торжественность и несомненность.
- source_word: דִּמִּיתִי
  choice: Я замыслил
  rationale: Глагол допускает значения «подумал», «намеревался», «замыслил»; в параллели с יָעַצְתִּי выбранное слово выражает обдуманное намерение, не сливая оба глагола.
- source_word: כֵּן הָיָתָה
  choice: так и будет
  rationale: Формально הָיָתָה — перфект «стало/сбылось», однако пророческий контекст и параллель с будущим תָקוּם позволяют передать совершенную уверенность в ещё предстоящем осуществлении естественным русским будущим.
- source_word: יָעַצְתִּי
  choice: Я решил
  rationale: Передаёт значение принятого совета, определения или твёрдого решения и сохраняет отличие от דִּמִּיתִי «замыслил».
- source_word: הִיא תָקוּם
  choice: так и исполнится
  rationale: Буквально «оно встанет/устоит»; в отношении решения выражение означает, что оно утвердится и осуществится. «Исполнится» звучит естественно, сохраняя уверенность результата.
theological_decisions:
- issue: Передача имени и титула יְהוָה צְבָאוֹת
  choice: Господь Воинств
  alternative: Яхве Воинств; Господь Саваоф
  rationale: «Господь Воинств» понятно современному читателю, переводит смысл צְבָאוֹת и избегает малопонятного заимствования «Саваоф». Вариант «Яхве Воинств» точнее передаёт личное имя и отмечен в сноске, чтобы не скрывать исходную форму.
- issue: Временная отнесённость כֵּן הָיָתָה
  choice: так и будет
  alternative: так и произошло; так и стало
  rationale: Еврейский перфект создаёт напряжение между грамматически завершённым представлением и контекстуально предстоящим исполнением. Основной текст передаёт пророческую перспективу по-русски, а сноска сохраняет буквальную временную форму и неоднозначность.
- issue: Образность תָקוּם
  choice: исполнится
  alternative: устоит; утвердится
  rationale: Контекст говорит о неизбежном осуществлении Божьего решения. «Исполнится» ясно передаёт эту мысль без добавления конфессионально специфического толкования; буквальный образ отмечен в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Параллелизм сохранён; архаизмы сведены к минимуму. Единственная сноска отмечена в основном тексте и объединяет тесно связанные текстовые альтернативы.
