  terminology: «Яхве Воинств» передаёт יהוה צבאות без подмены личного имени титулом. «Замыслил» и «решил» удачно различают דמיתי и יעצתי. «Воистину» уместно передаёт утвердительную силу клятвенного אם לא; сноска поясняет идиому.
