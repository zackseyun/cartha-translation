base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/027.yaml
  text: For Yahweh of hosts has purposed[a], and who can annul it? His hand is stretched out[b], and who can turn it back?
translation:
  language: ru
  text: Ибо Яхве Воинств решил — кто отменит Его решение?[a] Его рука простёрта[b] — кто повернёт её вспять?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто расстроит Его замысел?» Еврейский глагол может означать нарушить, отменить или сорвать задуманное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Его рука протянута». Этот образ передаёт силу, направленную к действию, и часто связан с судом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего пророческого утверждения; «ибо» сохраняет логическую связь и соответствует возвышенному, но понятному регистру.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией «Яхве», а צְבָאוֹת — широким традиционным обозначением небесных и земных воинств, без сужения до одних человеческих армий.
- source_word: יָעָץ
  choice: решил
  rationale: В контексте глагол означает составить замысел, принять твёрдое решение. «Решил» естественно по-русски и подготавливает подразумеваемое дополнение в следующей части.
- source_word: יָפֵר
  choice: отменит Его решение
  rationale: Hiphil от פרר выражает нарушение, упразднение или срыв замысла. Явное «Его решение» естественно восполняет подразумеваемый объект и устраняет неясное русское местоимение.
- source_word: יָדוֹ הַנְּטוּיָה
  choice: Его рука простёрта
  rationale: Сохранён антропоморфный образ действующей силы; краткая форма «простёрта» передаёт состояние руки, уже направленной к действию.
- source_word: יְשִׁיבֶנָּה
  choice: отведёт её
  rationale: Hiphil от שוב с суффиксом женского рода относится к руке и означает заставить её вернуться или отвернуться; «отведёт её» естественно передаёт прекращение направленного действия.
theological_decisions:
- issue: Передача имени и титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве воинств; Яхве армий
  rationale: «Яхве» сохраняет личное имя в исходном тексте. «Воинств» удерживает широкое значение צְבָאוֹת и не ограничивает его только человеческими армиями.
- issue: Образ простёртой руки
  choice: Сохранить образ без пояснения в основном тексте
  alternative: Передать смысл как «Его сила уже действует» или явно уточнить «для суда»
  rationale: Исходный текст использует образ руки и не называет прямо ни суд, ни конкретное действие; буквальный образ сохраняет богословскую и контекстуальную напряжённость.
- issue: Неотвратимость решения Яхве
  choice: Передать двумя риторическими вопросами без добавления абсолютных формулировок
  alternative: 'Перефразировать: «никто не отменит… никто не отведёт»'
  rationale: Риторическая форма исходника подчёркивает неотвратимость, но перевод не должен заменять вопросы пояснительным утверждением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллелизм и два риторических вопроса сохранены; синтаксис сделан естественным для русского языка.
