  text: וּ/לְקָח֣וּ/ם עַמִּים֮ וֶ/הֱבִיא֣וּ/ם אֶל מְקוֹמָ/ם֒ וְ/הִֽתְנַחֲל֣וּ/ם בֵּֽית יִשְׂרָאֵ֗ל עַ֚ל אַדְמַ֣ת יְהוָ֔ה לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָח֑וֹת וְ/הָיוּ֙ שֹׁבִ֣ים לְ/שֹֽׁבֵי/הֶ֔ם וְ/רָד֖וּ בְּ/נֹגְשֵׂי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/002.yaml
  text: Peoples will take them and bring them to their place[a], and the house of Israel will possess them on the land of Yahweh as male servants and female servants. They will become captors of their captors[d][c][b], and they will rule over their oppressors.
translation:
  language: ru
  text: Народы возьмут их и приведут их в их землю, а дом Израиля будет владеть ими на земле Яхве как рабами и рабынями[a]. Они пленят пленивших их[b] и будут господствовать над своими угнетателями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получит их в наследственное владение»; еврейский глагол может выражать как обладание, так и наследование.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально возможно: «станут пленителями пленивших их»; в еврейском здесь игра однокоренных слов со значением «пленять».'
    reason: wordplay
lexical_decisions:
- source_word: וּלְקָחוּם עַמִּים
  choice: Народы возьмут их
  rationale: Глагол לקח в породе qal обычно означает «брать»; множественное עַמִּים передано как «народы», а объектный суффикс указывает на Иакова/Израиль из предыдущего стиха.
- source_word: וֶהֱבִיאוּם אֶל מְקוֹמָם
  choice: и приведут на их место
  rationale: הביא означает «привести/доставить», а מְקוֹמָם — «их место»; местоименная неоднозначность сохранена без добавления отсутствующего в тексте «собственное».
- source_word: וְהִתְנַחֲלוּם
  choice: сделает их своим владением
  rationale: Форма hitpael от נחל с объектным суффиксом выражает приобретение во владение или наследственное обладание. Формулировка сохраняет объект «их» и наследственно-владельческий оттенок.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено традиционное коллективное обозначение народа, близкое к структуре еврейского текста.
- source_word: עַל אַדְמַת יְהוָה
  choice: на земле Яхве
  rationale: אַדְמָה передано как «земля», а тетраграмматон — личным именем «Яхве», без замены титулом.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: рабами и рабынями
  rationale: Еврейский текст прямо обозначает подневольное положение лиц обоих полов; «рабы и рабыни» передаёт это без смягчающего эвфемизма.
- source_word: וְהָיוּ שֹׁבִים לְשֹׁבֵיהֶם
  choice: Они пленят пленивших их
  rationale: Так переданы переворот положения и игра однокоренных слов שבה; по-русски это естественнее буквального «станут пленителями своих пленителей».
- source_word: וְרָדוּ בְּנֹגְשֵׂיהֶם
  choice: и будут господствовать над своими угнетателями
  rationale: רדה означает властвовать или господствовать, а נגשׂ здесь обозначает притеснителей/угнетателей; выбран широкий контекстуально уместный эквивалент.
theological_decisions:
- issue: Изображение обращения прежних поработителей в рабов
  choice: Передать социально-политический переворот прямо, сохранив лексику рабства
  alternative: Смягчить до «слуг» или обобщить как подчинение
  rationale: Текст прямо называет рабов и рабынь и описывает обращение прежнего угнетения; перевод не должен ни смягчать это, ни превращать описание в богословское оправдание рабства.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохранено личное имя, представленное тетраграмматоном, а не заменяющий его титул.
- issue: Неоднозначность וְהִתְנַחֲלוּם
  choice: Основной текст передаёт обладание; наследственный оттенок отмечен в сноске
  alternative: «унаследует их»
  rationale: Глагол допускает язык наследования и владения. Основная формулировка ясна по-русски, а сноска сохраняет реальную лексическую многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены коллективное «дом Израиля», жёсткая социальная лексика и имя Яхве; синтаксис сделан естественным для обычного современного читателя.
