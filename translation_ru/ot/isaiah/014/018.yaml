lexical_decisions:
- source_word: כָּל מַלְכֵי גוֹיִם
  choice: Все цари народов
  rationale: Передаёт совокупность царей разных народов без добавления значения «чужеземные», которого само выражение прямо не содержит.
- source_word: כֻּלָּם
  choice: все они
  rationale: Сохраняет подчёркивающее возобновление мысли после «все цари народов», не сглаживая характерный повтор еврейского текста.
- source_word: שָׁכְבוּ
  choice: покоятся
  rationale: В погребальном контексте глагол описывает пребывание умерших в месте погребения. «Покоятся» естественно звучит по-русски и не уточняет образ как «спят».
- source_word: בְכָבוֹד
  choice: с честью
  rationale: Здесь כָּבוֹד указывает на почётное, достойное погребение. Выражение «с честью» естественно передаёт смысл, тогда как буквальное «в славе» в данном русском контексте менее ясно.
- source_word: אִישׁ
  choice: каждый
  rationale: В распределительной конструкции слово означает каждого отдельного представителя уже названной группы царей.
- source_word: בְבֵיתוֹ
  choice: в своём доме
  rationale: Сохраняет буквальный образ «дома» и естественно передаёт возвратное отношение к подлежащему; контекстуальное понимание как гробницы вынесено в примечание.
