base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/030.yaml
  text: The firstborn of the poor will graze[a], and the needy will lie down in safety; and I will kill your root with famine[b], and it will slay your remnant.
translation:
  language: ru
  text: И первенцы бедных будут пастись[a], и нуждающиеся будут лежать в безопасности; и Я уморю голодом твой корень, и убьёт твой остаток[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беднейшие из бедных». Буквально по-еврейски: «первенцы бедных»; возможно, это выражение усиливает значение.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте здесь стоит глагол в 3-м лице мужского рода единственного числа: «убьёт твой остаток». Субъект не назван и остаётся не вполне ясным: это может быть голод как олицетворённое орудие суда, подразумеваемый исполнитель или сам Господь.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָעוּ
  choice: будут пастись
  rationale: 'Глагол רעה в породе qal здесь сохраняет пасторальный образ: речь идёт о выпасе или кормлении стада. «Будут пастись» естественно передаёт этот образ по-русски.'
- source_word: בְּכוֹרֵי דַלִּים
  choice: первенцы бедных
  rationale: 'Буквально: «первенцы бедных». Возможное идиоматическое значение «беднейшие из бедных» вынесено в примечание, чтобы не устранять образность и неоднозначность еврейского выражения.'
- source_word: וְאֶבְיוֹנִים
  choice: и нуждающиеся
  rationale: אביון обозначает бедного, испытывающего нужду. «Нуждающиеся» сохраняет смысловое отличие от דלים («бедных») в предыдущем обороте.
- source_word: לָבֶטַח יִרְבָּצוּ
  choice: лягут в безопасности
  rationale: רבץ обычно описывает лежащее животное и продолжает пасторальный образ, а לבטח выражает безопасность и покой.
- source_word: וְהֵמַתִּי בָרָעָב
  choice: и Я уморю голодом
  rationale: Каузативная форма מות означает «причинить смерть», а предлог ב обозначает средство. «Уморю голодом» точно и естественно передаёт оба элемента.
- source_word: שָׁרְשֵׁךְ
  choice: твой корень
  rationale: Сохранена буквальная метафора שׁרשׁ — «корень», обозначающая основание или источник существования адресата.
- source_word: וּשְׁאֵרִיתֵךְ
  choice: и твой остаток
  rationale: שארית означает оставшуюся часть или уцелевших. «Остаток» сохраняет характерную для пророческой речи лексику.
- source_word: יַהֲרֹג
  choice: он убьёт
  rationale: Мужской род единственного числа еврейского глагола передан местоимением «он» без явного называния субъекта; неоднозначность пояснена в сноске.
theological_decisions:
- issue: Неоднозначный субъект заключительного глагола יַהֲרֹג
  choice: 'Сохранить переход к третьему лицу: «он убьёт»'
  alternative: «Голод убьёт твой остаток» или «Я убью твой остаток»
  rationale: В еврейском тексте после первого лица «Я уморю» стоит глагол третьего лица мужского рода единственного числа. Перевод не отождествляет субъекта безоговорочно ни с голодом, ни с Богом, ни с подразумеваемым исполнителем суда.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой интонации. Пасторальные образы и резкий переход от первого к третьему лицу намеренно не сглажены; местоимение «Я» написано с прописной буквы как речь Бога.
