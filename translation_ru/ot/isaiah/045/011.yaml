source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/יֹצְר֑/וֹ הָ/אֹתִיּ֣וֹת שְׁאָל֔וּ/נִי עַל בָּנַ֛/י וְ/עַל פֹּ֥עַל יָדַ֖/י תְּצַוֻּֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/011.yaml
  text: 'Thus says Yahweh[a], the Holy One of Israel and his Maker: Ask me about the things to come concerning my sons[c][b], and command me concerning the work of my hands.'
translation:
  language: ru
  text: 'Так говорит Яхве, Святой Израиля и Создатель его: «О грядущем[a] спрашивайте Меня; о сыновьях Моих[b] и о деле рук Моих приказывайте Мне[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о будущем», «о том, что наступит».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «о Моих сыновьях»; возможно, имеются в виду израильтяне как Божий народ.'
    reason: lexical_alternative
  - marker: c
    text: 'Резкое выражение «приказывайте Мне» может быть намеренно ироническим; возможно также понимание как риторического упрёка: «Неужели вы будете приказывать Мне?»'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом; форма «Яхве» общепринята в современной русской библеистике.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  rationale: Сохраняет устойчивый пророческий титул и конструкцию принадлежности.
- source_word: וְיֹצְרוֹ
  choice: и Создатель его
  rationale: Суффикс третьего лица мужского рода единственного числа передан явно; наиболее вероятный референт — Израиль.
- source_word: הָאֹתִיּוֹת
  choice: о грядущем
  rationale: В данном пророческом контексте слово обозначает то, что наступит, а не буквы; русское собирательное выражение естественно передаёт еврейское множественное число.
- source_word: שְׁאָלוּנִי
  choice: спрашивайте Меня
  rationale: Сохраняет форму повелительного наклонения во множественном числе и прямое дополнение первого лица.
- source_word: עַל בָּנַי
  choice: о сыновьях Моих
  rationale: Передаёт мужское множественное число буквально, не заменяя его более широким словом «дети».
- source_word: פֹּעַל יָדַי
  choice: о деле рук Моих
  rationale: Сохраняет конкретный образ Божьих рук и параллельную конструкцию с предлогом עַל.
- source_word: תְּצַוֻּנִי
  choice: приказывайте Мне
  rationale: Сохраняет резкое и намеренно вызывающее значение глагола «приказывать», не устраняя напряжение толковательным пересказом.
theological_decisions:
- issue: Можно ли понимать последнюю фразу как разрешение людям приказывать Богу
  choice: В основном тексте сохранено прямое «приказывайте Мне»
  alternative: 'Передать как риторический упрёк: «Неужели вы будете приказывать Мне?»'
  rationale: Еврейская форма допускает прямое повелительное прочтение, хотя контекст может придавать ей иронический или укоризненный смысл. Перевод сохраняет эту напряжённость, а альтернативу отмечает в сноске.
- issue: Кого обозначают «сыновья Мои»
  choice: Сохранено буквальное «сыновья Мои»
  alternative: «дети Мои» или собирательно «народ Мой»
  rationale: Еврейский текст имеет существительное мужского рода во множественном числе; возможное собирательное указание на Израиль не следует вносить непосредственно в основной текст.
translation_notes:
  register: 'Современный литературный русский язык с торжественным пророческим ритмом. Порядок двух параллельных оборотов следует масоретской акцентуации: сначала «о грядущем спрашивайте Меня», затем «о сыновьях Моих и о деле рук Моих приказывайте Мне». Прописные местоимения, относящиеся к Богу, использованы в соответствии с распространённой русской библейской издательской традицией.'
