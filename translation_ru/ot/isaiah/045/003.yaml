base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/003.yaml
  text: And I will give you the treasures of darkness and the hidden riches of secret places[a], so that you may know that I am Yahweh, the one who calls you by name[c][b], the God of Israel.
translation:
  language: ru
  text: И дам тебе сокровища тьмы[a] и богатства, спрятанные в тайных местах[b], чтобы ты узнал, что Я — Яхве[c], Бог Израиля, Тот, кто называет тебя по имени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровища, скрытые во тьме».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и скрытые сокровища тайных мест».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское יהוה (ЙХВХ) — личное имя Бога; традиционно передаётся как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И дам
  rationale: Перфект с союзом в пророческом обещании имеет будущее значение; краткая форма естественна по-русски.
- source_word: אוֹצְרוֹת חֹשֶׁךְ
  choice: сокровища тьмы
  rationale: Сохраняет буквальный образ еврейского сопряжённого сочетания и допускает смысл сокровищ, скрытых во тьме.
- source_word: וּמַטְמֻנֵי מִסְתָּרִים
  choice: богатства, спрятанные в тайных местах
  rationale: Передаёт и материальную ценность скрытых запасов, и указание на укромные места, не сводя выражение к абстрактной метафоре.
- source_word: לְמַעַן תֵּדַע
  choice: чтобы ты узнал
  rationale: Точно передаёт целевое значение; совершенный вид уместен как результат данного Богом откровения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного Божьего имени сохраняет различие между именем и титулом.
- source_word: הַקּוֹרֵא בְשִׁמְךָ
  choice: называющий тебя по имени
  rationale: Естественно передаёт причастную конструкцию и личную обращённость к Киру; глагол может подразумевать как называние, так и призвание.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Ясная и традиционно естественная передача еврейской конструкции принадлежности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как личное имя; транслитерация не подменяет его титулом. В сноске отмечена традиционная замена.
- issue: Характер обещанных сокровищ
  choice: конкретные богатства, скрытые в тёмных и тайных местах
  alternative: духовные сокровища как метафора
  rationale: Контекст обращения к Киру, покорения царств и открытия ворот прежде всего указывает на материальные богатства; перевод сохраняет поэтический образ, не исключая его богословского звучания.
- issue: Значение הַקּוֹרֵא בְשִׁמְךָ
  choice: называющий тебя по имени
  alternative: призывающий тебя по имени
  rationale: Еврейское выражение допускает оттенки называния и призвания. Основной текст выбирает естественное русское выражение, а сноска сохраняет значимую альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся ясным для обычного читателя; параллелизм двух образов сохранён. Заглавная буква в «Я» употреблена как принятая русская издательская норма при прямой речи Бога.
