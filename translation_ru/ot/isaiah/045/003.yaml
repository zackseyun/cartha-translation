  source_fidelity: Начальная часть точно передаёт обещание в пророческом будущем времени. «Сокровища тьмы» сохраняет образ конструкта אוֹצְרוֹת חֹשֶׁךְ, а «богатства, спрятанные в тайных местах» адекватно передаёт материальные скрытые запасы מַטְמֻנֵי מִסְתָּרִים. Целевое «чтобы ты узнал» и передача имени יהוה как «Яхве» верны. Однако в завершающем именном ряду исходный текст одновременно отождествляет говорящего с Яхве, с Тем, кто называет адресата по имени, и с Богом Израиля; русский порядок приложения в черновике делает это присоединение менее ясным.
