  terminology: «Яхве» последовательно передаёт тетраграмматон как личное имя, а «Бог Израиля» — אֱלֹהֵי יִשְׂרָאֵל. «Называет тебя по имени» сохраняет нейтральную широту еврейского קרא בְּשֵׁם и не навязывает исключительно смысл призвания.
