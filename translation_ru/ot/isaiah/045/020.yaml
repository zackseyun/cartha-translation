source:
  edition: WLC
  text: הִקָּבְצ֥וּ וָ/בֹ֛אוּ הִֽתְנַגְּשׁ֥וּ יַחְדָּ֖ו פְּלִיטֵ֣י הַ/גּוֹיִ֑ם לֹ֣א יָדְע֗וּ הַ/נֹּֽשְׂאִים֙ אֶת עֵ֣ץ פִּסְלָ֔/ם וּ/מִתְפַּלְלִ֔ים אֶל אֵ֖ל לֹ֥א יוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/020.yaml
  text: Gather yourselves and come[a]; draw near together, you survivors of the nations. They have no knowledge[c][b], those who carry the wood of their carved image and pray to a god that cannot save.
translation:
  language: ru
  text: Соберитесь и придите, приблизьтесь все вместе, уцелевшие из народов! Не знают ничего те, кто носит дерево своего изваяния[a] и молится богу, который не может спасти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть деревянного идола; буквально: «дерево своего изваяния».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «который не спасает».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִקָּבְצוּ וָבֹאוּ
  choice: Соберитесь и придите
  rationale: Два повелительных глагола передают призыв собраться и явиться; возвратное «соберитесь» естественно отражает нифаль формы קבץ.
- source_word: הִתְנַגְּשׁוּ יַחְדָּו
  choice: приблизьтесь все вместе
  rationale: Хитпаэль נגש в контексте торжественного вызова означает «приблизиться», а יחדו подчёркивает совместность действия.
- source_word: פְּלִיטֵי הַגּוֹיִם
  choice: уцелевшие из народов
  rationale: Форма обозначает спасшихся или оставшихся в живых; «из народов» по-русски естественно передаёт принадлежность к множеству народов.
- source_word: לֹא יָדְעוּ
  choice: Не знают ничего
  rationale: Сохраняет прямую характеристику невежества и пророческую резкость, не уточняя сверх текста, чего именно они не знают.
- source_word: הַנֹּשְׂאִים אֶת עֵץ פִּסְלָם
  choice: те, кто носит дерево своего изваяния
  rationale: Сохраняются и «дерево», и «изваяние», благодаря чему остаётся явной полемика против рукотворного деревянного предмета поклонения.
- source_word: וּמִתְפַּלְלִים אֶל אֵל
  choice: и молится богу
  rationale: Причастие согласовано в русском с собирательной конструкцией «те, кто» в единственном числе относительной части; אֵל передано строчной буквой как объект ложного поклонения, а не имя истинного Бога.
- source_word: לֹא יוֹשִׁיעַ
  choice: который не может спасти
  rationale: Передаёт подразумеваемое бессилие ложного бога; буквальная возможность «не спасает» отмечена в сноске для сохранения смысловой неоднозначности.
theological_decisions:
- issue: Характер «бога» в выражении אֵל לֹא יוֹשִׁיעַ
  choice: «богу, который не может спасти»
  alternative: «богу, который не спасает»
  rationale: Слово אֵל сохранено как «бог», чтобы не устранять ироническую риторику оригинала, а строчная буква и контекст ясно указывают на ложный объект поклонения. Модальное прочтение подчёркивает его бессилие, но более буквальная немодальная передача дана в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Параллельные повеления сохранены, а тяжеловесные архаизмы устранены.
