  text: יִשְׂרָאֵל֙ נוֹשַׁ֣ע בַּ/יהוָ֔ה תְּשׁוּעַ֖ת עוֹלָמִ֑ים לֹא תֵבֹ֥שׁוּ וְ/לֹא תִכָּלְמ֖וּ עַד ע֥וֹלְמֵי עַֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/017.yaml
  text: Israel is saved by Yahweh with an everlasting salvation[b][a]; you will not be put to shame or disgraced forever and ever.
translation:
  language: ru
  text: Израиль спасён Яхве вечным спасением[a]; вы не будете постыжены и не будете посрамлены[b] во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасён в Яхве»; еврейский предлог может указывать как на действующего Спасителя, так и на сферу спасения.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «вы не испытаете стыда и не будете унижены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹשַׁע
  choice: спасён
  rationale: Страдательная форма глагола ישׁע обозначает избавление Израиля, совершённое Яхве. Краткая форма «спасён» сохраняет результативный характер высказывания и не сводит его однозначно ни к прошлому, ни к будущему.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: При страдательном «спасён» имя в русском творительном падеже естественно передаёт Яхве как действующего Спасителя. Возможное значение сферы — «в Яхве» — сохранено в сноске.
- source_word: יהוה
  choice: Яхве
  rationale: Передано личное заветное имя, непосредственно стоящее в еврейском тексте, без замены титулом «Господь».
- source_word: תְּשׁוּעַת עוֹלָמִים
  choice: спасением вечным
  rationale: Сохраняются существительное «спасение», усилительная конструкция оригинала и значение непреходящей длительности.
- source_word: לֹא תֵבֹשׁוּ
  choice: вы не будете постыжены
  rationale: Передаёт публичный и результативный оттенок בושׁ, а также форму обещания во втором лице множественного числа.
- source_word: וְלֹא תִכָּלְמוּ
  choice: и не будете посрамлены
  rationale: Сохраняет поэтический параллелизм, различая близкие понятия стыда и унизительного позора.
- source_word: עַד עוֹלְמֵי עַד
  choice: во веки веков
  rationale: Устойчивое русское выражение естественно передаёт усиленное обозначение бесконечной длительности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя יהוה; его транслитерация сохраняет заветное имя и не превращает его в титул.
- issue: Значение предлога ב в ביהוה
  choice: Яхве как действующий Спаситель
  alternative: «в Яхве» как сфера спасения
  rationale: При страдательной форме נוֹשַׁע агентное понимание синтаксически естественно, однако предлог допускает и значение сферы; эта подлинная неоднозначность отмечена в сноске.
- issue: Временная отнесённость נוֹשַׁע
  choice: результативное «спасён» без жёсткой временной привязки
  alternative: «будет спасён» или «был спасён»
  rationale: Еврейская форма в данном пророческом высказывании позволяет видеть совершившийся результат и уверенное обещание; краткое русское причастие не устраняет это напряжение.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Формулы «постыжены», «посрамлены» и «во веки веков» сохраняют поэтический параллелизм и торжественность, оставаясь понятными современному читателю.
