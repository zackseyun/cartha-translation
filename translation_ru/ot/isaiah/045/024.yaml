base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/024.yaml
  text: Only in Yahweh[a], it shall be said of me, are righteousness and strength; to him they shall come[b], and all who were enraged against him shall be put to shame.
translation:
  language: ru
  text: «Только в Яхве, — скажут обо Мне, — праведность[b] и сила».[a] К Нему придут, и будут посрамлены все, кто пылали гневом против Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза синтаксически неоднозначна. Возможно также: «Только в Яхве, — будет сказано, — праведность и сила»; буквальное значение местоимения может быть: «мне».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «праведности»; возможный смысл: «праведные дела», «акты справедливости» или «оправдательные действия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: 'Передаёт исключительность и усиление: праведность и сила обретаются только в Яхве.'
- source_word: בַּיהוָה
  choice: в Яхве
  rationale: Предлог ב обозначает сферу или источник, а имя יהוה передано как «Яхве», то есть как личное заветное имя Бога.
- source_word: לִי אָמַר
  choice: скажут обо Мне
  rationale: Сжатая поэтическая конструкция допускает понимание לִי как «обо мне», а אָמַר — как неопределённо-личное высказывание. Русское будущее время соответствует пророческому контексту, не вводя конкретного говорящего.
- source_word: צְדָקוֹת
  choice: праведность
  rationale: Хотя в еврейском стоит форма множественного числа, здесь естественно звучит собирательно-абстрактное «праведность»; множественное число может указывать на праведные деяния или оправдания, что отмечено в сноске.
- source_word: וָעֹז
  choice: и сила
  rationale: עֹז означает силу или могущество; «сила» образует естественную пару с «праведностью».
- source_word: עָדָיו יָבוֹא
  choice: К Нему придут
  rationale: Буквально глагол стоит в единственном числе, но имеет неопределённо-собирательный смысл, поясняемый следующим множественным числом; по-русски естественно множественное «придут».
- source_word: וְיֵבֹשׁוּ
  choice: будут посрамлены
  rationale: В контексте суда בוש обозначает не только внутренний стыд, но и постигшее человека публичное посрамление.
- source_word: כֹּל הַנֶּחֱרִים בּוֹ
  choice: все, кто пылал против Него гневом
  rationale: Причастие от חרה передаёт сильный, словно пылающий гнев, а בּוֹ обозначает его направленность против Яхве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя יהוה; транслитерация «Яхве» сохраняет его отличие от титула «Господь».
- issue: Смысл множественного צְדָקוֹת
  choice: праведность
  alternative: праведные дела; оправдания; победы
  rationale: «Праведность» сохраняет широкий смысл Божьей правоты и верности, не сводя слово исключительно к судебному оправданию или победе; морфологическая множественность отмечена в сноске.
- issue: Неоднозначная формула לִי אָמַר
  choice: скажут обо Мне
  alternative: мне скажут; скажет обо мне; мне сказано
  rationale: Еврейский синтаксис предельно сжат и допускает разные связи слов. Основной текст передаёт вероятный исповедальный смысл, а сноска сохраняет существенную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Образ «пылал… гневом» сохраняет интенсивность еврейского חרה; инверсия в прямой речи передаёт поэтическую сжатость оригинала.
