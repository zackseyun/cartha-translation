source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְ֠הוָה בּוֹרֵ֨א הַ/שָּׁמַ֜יִם ה֣וּא הָ/אֱלֹהִ֗ים יֹצֵ֨ר הָ/אָ֤רֶץ וְ/עֹשָׂ/הּ֙ ה֣וּא כֽוֹנְנָ֔/הּ לֹא תֹ֥הוּ בְרָאָ֖/הּ לָ/שֶׁ֣בֶת יְצָרָ֑/הּ אֲנִ֥י יְהוָ֖ה וְ/אֵ֥ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/018.yaml
  text: 'For thus says Yahweh[a], who created the heavens—he is God—who formed the earth and made it, he established it; he did not create it as a wasteland, but formed it to be inhabited: I am Yahweh, and there is no other.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве, сотворивший небеса, — Он Бог, — образовавший землю и создавший её; Он утвердил её. Не пустыней сотворил Он её[a], но образовал её для обитания: «Я — Яхве, и нет иного».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он сотворил её не пустой», «Он сотворил её не для хаоса» или «Он сотворил её не бесформенной». Еврейское то́ху может обозначать пустоту, запустение или бесформенность; здесь противопоставление словам «для обитания» говорит в пользу значения «пустыня, безлюдное место».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом; форма «Яхве» устоялась в современной русской библеистике.
- source_word: בּוֹרֵא הַשָּׁמַיִם
  choice: сотворивший небеса
  rationale: Причастный оборот естественно передаёт еврейское причастие и сохраняет его определительную функцию; множественное «небеса» соответствует форме и космологическому контексту.
- source_word: הוּא הָאֱלֹהִים
  choice: Он Бог
  rationale: Сохраняет краткое эмфатическое отождествление, не добавляя «единственный», поскольку исключительность прямо выражена в конце стиха.
- source_word: יֹצֵר הָאָרֶץ וְעֹשָׂהּ
  choice: образовавший землю и создавший её
  rationale: «Образовавший» передаёт оттенок придания формы у יצר, а «создавший» естественно выражает широкое значение עשה, сохраняя различие двух глаголов.
- source_word: כּוֹנְנָהּ
  choice: утвердил её
  rationale: Передаёт значение установления и придания устойчивости; это также естественная и достойная русская библейская формулировка.
- source_word: תֹהוּ
  choice: пустыней
  rationale: В противопоставлении предназначению земли для обитания слово обозначает пустынное, безлюдное состояние; буквальная краткость сохраняет метафорическую форму еврейского текста.
- source_word: לָשֶׁבֶת
  choice: для обитания
  rationale: 'Точно и естественно выражает целевое значение инфинитива: земля образована с тем, чтобы быть населённой.'
- source_word: יְצָרָהּ
  choice: образовал её
  rationale: Повтор того же русского корня сохраняет лексическую связь с יֹצֵר ранее в стихе.
- source_word: וְאֵין עוֹד
  choice: и нет иного
  rationale: Сохраняет лаконичное утверждение исключительности без добавления подразумеваемого существительного «Бога».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в еврейском тексте, не подменяя его титулом.
- issue: Значение תֹהוּ в высказывании о цели творения
  choice: пустыней
  alternative: пустой; бесформенной; хаосом
  rationale: Непосредственное противопоставление «для обитания» указывает прежде всего на безлюдность и непригодность для жизни, однако примечание сохраняет более широкий диапазон слова.
- issue: Сила выражения הוּא הָאֱלֹהִים
  choice: Он Бог
  alternative: Он есть Бог; Он — единственный Бог
  rationale: Так сохраняется эмфатическое отождествление без преждевременного добавления идеи «единственный», прямо выраженной лишь в заключительной фразе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксическая торжественность исходного провозглашения сохранена, но архаичные формы и перегруженные обороты избегаются. Прямая речь в конце оформлена кавычками для ясности.
