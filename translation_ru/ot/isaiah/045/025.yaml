base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/025.yaml
  text: In Yahweh all the offspring of Israel will be justified and will boast[a][b].
translation:
  language: ru
  text: В Яхве оправдаются[a] и будут хвалиться все потомки Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут признаны правыми». Еврейский глагол может означать как «быть оправданными», так и «быть признанными правыми»; то есть их правота может быть подтверждена.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «всё семя Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: В Яхве
  rationale: 'Предлог בְּ здесь естественно передаёт сферу или основание: оправдание и хвала потомков Израиля связаны с Яхве. Краткая конструкция сохраняет ёмкость еврейского текста и его заветный смысл.'
- source_word: יִצְדְּקוּ
  choice: оправдаются
  rationale: Форма Qal от צדק может означать «оказаться правыми», «быть оправданными» или «быть признанными правыми». «Оправдаются» сохраняет декларативно-результативный оттенок в контексте праведности и спасения у Яхве; возможный смысл «будут признаны правыми» отмечен в сноске.
- source_word: וְיִתְהַלְלוּ
  choice: и будут хвалиться
  rationale: Hitpael от הלל обозначает хвалу или похвалу, которой человек хвалится. «Будут хвалиться» ясно и прямо передаёт возвратный оттенок формы, а начальное «В Яхве» указывает, кем они хвалятся.
- source_word: כָּל
  choice: все
  rationale: Прямое соответствие коллективному значению כָּל перед словосочетанием «потомки Израиля».
- source_word: זֶרַע יִשְׂרָאֵל
  choice: потомки Израиля
  rationale: זֶרַע буквально означает «семя», но здесь обозначает совокупность потомков. «Потомки Израиля» естественно звучит по-русски, а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В тексте прямо употреблён тетраграмматон. «Яхве» передаёт личное заветное имя, не заменяя его титулом и не вводя менее вероятную традиционную вокализацию.
- issue: Смысл צדק в контексте спасения
  choice: оправдаются
  alternative: будут признаны правыми; окажутся правыми
  rationale: «Оправдаются» сохраняет вес идеи дарованного Богом правого положения, но не сводит глагол к одной поздней богословской схеме. Его судебно-виндикационный оттенок дан как допустимая альтернатива в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов сохраняет общий акцент «В Яхве» для обоих глаголов и не устраняет смысловую ёмкость исходной конструкции.
