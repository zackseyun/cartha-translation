base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/008.yaml
  text: Drip down from above[a], O heavens, and let the clouds pour down righteousness; let the earth open, that salvation may sprout, and let righteousness spring up together. I, Yahweh, have created it.
translation:
  language: ru
  text: Небеса, каплите свыше, и пусть облака источают праведность[a]. Пусть раскроется земля, пусть спасение принесёт плод[b], и вместе взойдёт праведность. Я, Яхве, сотворил его.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские слова צדק и צדקה могут также означать «справедливость»: «пусть облака источают справедливость… и вместе взойдёт справедливость».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте глагол «принесут плод» стоит во множественном числе, хотя «спасение» — в единственном; синтаксическая связь этого сжатого поэтического оборота не вполне ясна. Возможна передача: «пусть они принесут плод — спасение».'
    reason: grammatical_ambiguity
  - marker: c
    text: 'Еврейский местоименный суффикс имеет мужской род: буквально «сотворил его». Он может относиться к «спасению» или собирательно ко всему только что описанному.'
    reason: ambiguity
lexical_decisions:
- source_word: הַרְעִיפוּ
  choice: оросите
  rationale: Глагол רָעַף обозначает падение или истечение капель. «Оросите» сохраняет образ небесной влаги и поэтический тон, не усиливая его до образа ливня.
- source_word: שָׁמַיִם מִמַּעַל
  choice: небеса… свыше
  rationale: Сохраняются прямое обращение к небесам и вертикальный образ источника дара.
- source_word: שְׁחָקִים יִזְּלוּ
  choice: пусть облака источают
  rationale: יִזְּלוּ передаёт стекание или истечение; «источают» естественно сочетается с отвлечённым дополнением и поддерживает образ осадков.
- source_word: צֶדֶק / צְדָקָה
  choice: праведность
  rationale: В контексте спасения слово охватывает установленную Богом правоту и верность должному порядку. Возможное значение «справедливость» сохранено в примечании.
- source_word: תִּפְתַּח אֶרֶץ
  choice: пусть раскроется земля
  rationale: Передан поэтический побудительный смысл и космический, а не только территориальный образ אֶרֶץ.
- source_word: וְיִפְרוּ יֶשַׁע
  choice: пусть плодом станет спасение
  rationale: Форма יִפְרוּ буквально связана с принесением плода и стоит во множественном числе, тогда как синтаксис стиха сжат и неоднозначен. Русская формулировка сохраняет плодовый образ, не навязывая явно спорный субъект.
- source_word: וּצְדָקָה תַצְמִיחַ יַחַד
  choice: и вместе взойдёт праведность
  rationale: Передан растительный образ צמח и одновременность, выраженная יַחַד. Формулировка естественна по-русски и сохраняет параллелизм со спасением.
- source_word: אֲנִי יְהוָה
  choice: Я, Яхве
  rationale: Собственное имя יהוה передано как «Яхве», а еврейская аппозиционная конструкция сохранена.
- source_word: בְּרָאתִיו
  choice: сотворил это
  rationale: Глагол ברא передан обычным библейским «сотворил». Указательное «это» не сужает неоднозначный референт местоименного суффикса до одного из предшествующих даров.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное заветное имя; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Значение צדק / צדקה
  choice: праведность
  alternative: справедливость
  rationale: Связь со спасением и широким восстановлением должного порядка благоприятствует «праведности», однако судебно-общественный оттенок «справедливости» остаётся подлинной возможностью и отмечен в сноске.
- issue: Синтаксис וְיִפְרוּ יֶשַׁע
  choice: пусть плодом станет спасение
  alternative: пусть они принесут плод — спасение
  rationale: Еврейский глагол имеет форму множественного числа, но его субъект в сжатой поэтической конструкции прямо не назван. Основной текст делает образ понятным, а примечание сохраняет грамматическую неоднозначность.
- issue: Референт суффикса в בְּרָאתִיו
  choice: это
  alternative: его, то есть спасение
  rationale: Мужской суффикс может ближайшим образом относиться к יֶשַׁע («спасение»), но допускается и итоговая отсылка ко всему описанному событию. «Это» не разрешает напряжение насильно.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической интонацией. Избегаются как архаические «да кропят», так и разговорные обороты. Параллелизм небесной влаги и земного произрастания сохранён; грамматическая неоднозначность еврейского текста пояснена, а не устранена догматически.
