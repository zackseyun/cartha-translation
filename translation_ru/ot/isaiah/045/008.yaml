  source_fidelity: 'Первая строка черновика искажает направление образа: «оросите свыше» означает, что небеса орошают нечто сверху, тогда как еврейский императив призывает сами небеса капать/истекать сверху. «Пусть плодом станет спасение» также меняет смысл: спасение не становится плодом, а в сжатом и грамматически трудном еврейском колоне связано с принесением плода. В исправлении сохранён образ плодоношения; необычное множественное число еврейского глагола отмечено в сноске.'
