lexical_decisions:
- source_word: יוֹצֵר
  choice: образующий
  rationale: Причастие qal от יצר означает «формировать, образовывать». «Образующий» сохраняет причастную форму и не смешивает этот глагол с ברא «творить, создавать».
- source_word: אוֹר
  choice: свет
  rationale: Прямое значение слова и естественная противоположность «тьме».
- source_word: וּבוֹרֵא
  choice: и творящий
  rationale: Причастие qal от ברא обозначает творческое действие Бога. «Творящий» сохраняет параллелизм и причастную форму.
- source_word: חֹשֶׁךְ
  choice: тьму
  rationale: Обычное значение; явная антитеза свету.
- source_word: עֹשֶׂה שָׁלוֹם
  choice: устанавливающий мир
  rationale: עשה имеет широкое значение «делать, совершать», но по-русски «устанавливать мир» естественно передаёт сочетание со שָׁלוֹם и сохраняет противопоставление бедствию.
- source_word: רָע
  choice: бедствие
  rationale: רָע может означать зло, вред, несчастье или бедствие. В противопоставлении שָׁלוֹם здесь вероятнее обозначено губительное бедствие, а не нравственное зло; неоднозначность отмечена в сноске.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Самостоятельное местоимение при имени подчёркивает самоидентификацию; имя יהוה передано как «Яхве».
- source_word: עֹשֶׂה כָל־אֵלֶּה
  choice: совершающий всё это
  rationale: Итоговая причастная конструкция охватывает все перечисленные действия; «совершающий» естественно передаёт широкий смысл עשה.
theological_decisions:
- issue: Значение רָע применительно к действию Бога
  choice: бедствие
  alternative: зло; несчастье
  rationale: Контраст со שָׁלוֹם указывает прежде всего на бедствие или неблагополучие. Основной текст не приписывает Богу создание нравственного зла, однако подлинная широта еврейского слова сохранена в сноске.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передача личного имени как «Яхве» сохраняет его присутствие в исходном тексте и соответствует предоставленному решению для данного стиха.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским ритмом. Цепочка причастий сохраняет поэтический параллелизм еврейского текста; различие между יצר и ברא передано глаголами «образовывать» и «творить/создавать».
