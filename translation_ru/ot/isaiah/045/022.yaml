base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/022.yaml
  text: Turn to me and be saved[a], all the ends of the earth; for I am God, and there is no other.
translation:
  language: ru
  text: Обратитесь ко Мне и спаситесь[a], все концы земли, ибо Я — Бог, и нет иного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Взгляните на Меня и спаситесь». Еврейский глагол может означать поворот к кому-либо и в данном контексте может включать направленный на Бога взгляд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ
  choice: Обратитесь
  rationale: Императив множественного числа от פנה выражает поворот или направленность к кому-либо. «Обратитесь» естественно передаёт призыв повернуться к Богу, не сужая значение до одного лишь взгляда.
- source_word: אֵלַי
  choice: ко Мне
  rationale: Предлог אֶל с суффиксом первого лица указывает на направленность к говорящему; «ко Мне» идиоматично в русском языке.
- source_word: וְהִוָּשְׁעוּ
  choice: и спаситесь
  rationale: Нифаль, повелительное наклонение множественного числа от ישׁע. Русская возвратная форма в данном контексте естественно обозначает обретение спасения и не приписывает людям роль его источника.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: все концы земли
  rationale: Устойчивый библейский образ, обозначающий самые далёкие области земли и в совокупности всех её жителей; формулировка точна, понятна и сохраняет образ оригинала.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание для предшествующего призыва. «Ибо» сохраняет причинно-пояснительную связь и соответствует возвышенному, но понятному регистру.
- source_word: אֲנִי אֵל
  choice: Я — Бог
  rationale: אֵל здесь является обозначением Бога, а не именем, требующим транслитерации. Тире естественно оформляет именное сказуемое в русском языке.
- source_word: וְאֵין עוֹד
  choice: и нет иного
  rationale: Фраза утверждает исключительность Бога. «Нет иного» сохраняет лаконичность и не добавляет местоимения, отсутствующего в еврейском тексте.
theological_decisions:
- issue: Исключительность Бога / монотеистическое утверждение
  choice: «Я — Бог, и нет иного»
  alternative: «Я — Бог, и нет никого кроме Меня»
  rationale: Еврейский текст утверждает абсолютную уникальность Бога как основание всеобщего призыва к спасению. Выбранный вариант сохраняет эту силу, не добавляя явно «кроме Меня», которое в оригинале лишь подразумевается.
- issue: Характер призыва к спасению
  choice: «Обратитесь ко Мне и спаситесь»
  alternative: «Взгляните на Меня и спаситесь»
  rationale: פנה допускает значение поворота или направления взгляда. Основной текст сохраняет более широкое значение обращения к Богу, а суженная зрительная трактовка отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены краткость, прямой призыв, образ «концов земли» и неоднозначность глагола פנה; архаичные формы избегаются.
