  text: לְמַ֨עַן֙ עַבְדִּ֣/י יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל בְּחִירִ֑/י וָ/אֶקְרָ֤א לְ/ךָ֙ בִּ/שְׁמֶ֔/ךָ אֲכַנְּ/ךָ֖ וְ/לֹ֥א יְדַעְתָּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/004.yaml
  text: For the sake of my servant Jacob[a], and Israel my chosen one, I called you by your name; I surnamed you, though you did not know me.
translation:
  language: ru
  text: Ради Иакова, Моего раба, и Израиля, Моего избранника, Я позвал тебя по имени и нарёк тебя[a], хотя ты Меня не знал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дал тебе имя», «дал тебе наименование (титул)». Еврейский глагол может обозначать присвоение имени или особого наименования; в данном контексте возможен также оттенок почётного титула.'
    reason: Лексическая неоднозначность глагола אֲכַנְּךָ.
lexical_decisions:
- source_word: לְמַעַן
  choice: Ради
  rationale: Передаёт мотив и цель Божьего действия; в данном контексте естественнее и точнее, чем причинное «из-за».
- source_word: עַבְדִּי
  choice: Моего раба
  rationale: «Раб» — устоявшееся и уместное в пророческом контексте почётное обозначение служащего Богу; здесь речь не об акценте на подневольном положении.
- source_word: בְּחִירִי
  choice: Моего избранника
  rationale: Субстантивированное определение обозначает Израиля как избранного Богом и естественно передаётся существительным «избранник».
- source_word: וָאֶקְרָא לְךָ בִּשְׁמֶךָ
  choice: Я позвал тебя по имени
  rationale: Сохраняет личный характер обращения и призвания, а также явно выраженное в еврейском тексте местоименное значение «твоим именем».
- source_word: אֲכַנְּךָ
  choice: дал тебе почётное имя
  rationale: Глагол כנה в породе пиэль означает наделение именованием, прозванием или титулом. Формулировка передаёт особое, отличительное именование адресата, не сводя его к обычному личному имени; лексическая неоднозначность отмечена в сноске.
- source_word: וְלֹא יְדַעְתָּנִי
  choice: хотя ты Меня не знал
  rationale: Контекстуальное уступительное «хотя» естественно выражает напряжение между Божьим призванием Кира и тем, что Кир не знал Бога; объект первого лица передан без поясняющей подстановки имени Господа.
theological_decisions:
- issue: Незнание Бога адресатом
  choice: Сохранено прямое утверждение, что адресат не знал Бога, несмотря на полученное от Него призвание.
  alternative: Понимать слова лишь как отсутствие полного признания Бога или осознанных отношений с Ним.
  rationale: Непосредственный контекст указывает на Кира. Перевод не ослабляет формулировку и не предполагает его последующего обращения, сохраняя напряжение между Божьим верховным действием и незнанием Бога языческим правителем.
- issue: Передача местоименного суффикса первого лица в יְדַעְתָּנִי
  choice: «Меня»
  alternative: «Господа»
  rationale: В еврейском тексте стоит объектный суффикс первого лица, а личность Говорящего ясна из контекста; подстановка «Господа» была бы поясняющим расширением.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «Иакова, Моего раба» и параллельное «Израиля, Моего избранника» сохраняют структуру и торжественный ритм оригинала; заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской стилистике.
