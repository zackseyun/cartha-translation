  source_fidelity: Начальная формула «Мною клянусь» воспроизводит традиционный оборот, но в современном русском звучит неестественно и не передаёт явно завершённое действие еврейского перфекта. «Собою Я поклялся» естественно выражает клятву Богом Самим Собой. В остальном сохранены образ исходящего из уст слова, его необратимость, всеобщность преклонения и клятвы.
  naturalness: «Собою Я поклялся» — ясный торжественный современный литературный оборот. «Мне преклонится всякое колено» несколько возвышенно, но естественно для пророческой речи и точнее, чем «предо Мною», которое добавляет пространственный оттенок «передо мной».
  terminology: «Праведное слово» допустимо для сжатого צְדָקָה דָּבָר и не снимает синтаксической неоднозначности. «Поклянётся всякий язык» сохраняет метафору и не навязывает ни добровольности, ни конкретного богословского смысла исповедания.
