lexical_decisions:
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: Мною клянусь
  rationale: Естественная русская формула клятвы передаёт клятву Бога Самим Собой и сохраняет её настоящее, непреложное действие.
- source_word: יָצָא מִפִּי
  choice: из Моих уст вышло
  rationale: Сохраняет конкретный образ слова, исходящего из уст Бога, и звучит ясно по-русски.
- source_word: צְדָקָה דָּבָר
  choice: праведное слово
  rationale: Сжатое еврейское сочетание допускает связь понятия праведности как с самим словом, так и с тем, как оно произнесено. Основной текст естественно передаёт его как характеристику слова, а примечание сохраняет альтернативу.
- source_word: וְלֹא יָשׁוּב
  choice: и оно не возвратится
  rationale: Сохраняет исходную метафору необратимости произнесённого слова, не заменяя её толкованием «не будет отменено».
- source_word: לִי תִּכְרַע כָּל בֶּרֶךְ
  choice: предо Мною преклонится всякое колено
  rationale: «Предо Мною» естественно передаёт русскую формулу поклонения и подчинения, хотя буквальное значение предлога — «Мне».
- source_word: תִּשָּׁבַע כָּל לָשׁוֹן
  choice: Мне поклянётся всякий язык
  rationale: Передаёт принятие клятвы, направленной к Господу, не уточняя сверх текста, является ли это добровольной присягой; образ «всякий язык» сохранён.
theological_decisions:
- issue: Характер всеобщего преклонения и клятвы
  choice: Всеобщее поклонение и принесение клятвы Господу без уточнения, добровольно оно или вынужденно
  alternative: «всякий язык исповедует» или «присягнёт на верность»
  rationale: Еврейский текст утверждает всеобщее признание власти Господа, но не объясняет внутренний характер этого подчинения. Перевод сохраняет данное напряжение.
- issue: Отнесение צְדָקָה к слову или к способу его произнесения
  choice: «праведное слово» в основном тексте
  alternative: «в праведности вышло слово»
  rationale: Синтаксис сжат и допускает обе смысловые связи; основной вариант естественнее в современном русском, а альтернативный отражён в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Сохранены параллелизм и конкретные образы уст, колена и языка.
