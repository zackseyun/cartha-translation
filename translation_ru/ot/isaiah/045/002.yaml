source:
  edition: WLC
  text: אֲנִי֙ לְ/פָנֶ֣י/ךָ אֵלֵ֔ךְ וַ/הֲדוּרִ֖ים אושר דַּלְת֤וֹת נְחוּשָׁה֙ אֲשַׁבֵּ֔ר וּ/בְרִיחֵ֥י בַרְזֶ֖ל אֲגַדֵּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/002.yaml
  text: I myself will go before you[a], and I will level the rough places; I will break in pieces doors of bronze, and I will cut through bars of iron.
translation:
  language: ru
  text: Я сам пойду перед тобой и неровные места выровняю[a]; бронзовые двери разобью и железные засовы перерублю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и возвышенности сделаю ровными»; еврейская фраза текстуально и лексически трудна. Возможны также переводы «горы сделаю равниной» или «неровное выпрямлю».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Я сам
  rationale: Отдельно выраженное местоимение при личной форме глагола несёт смысловое ударение и подчёркивает личное обещание Господа.
- source_word: לְפָנֶיךָ אֵלֵךְ
  choice: пойду перед тобой
  rationale: Пространственное выражение означает движение впереди адресата; имперфект в контексте пророческого обещания передан будущим временем.
- source_word: וַהֲדוּרִים אושר
  choice: и неровные места выровняю
  rationale: Текстуально и лексически трудная фраза, вероятнее всего, описывает устранение неровностей или препятствий. Формулировка сохраняет широкий смысл и не сужает его до гор или возвышенностей.
- source_word: דַּלְתוֹת נְחוּשָׁה
  choice: бронзовые двери
  rationale: דְּלָתוֹת буквально означает «двери», а נְחוּשָׁה в данном контексте естественно передаётся как бронза.
- source_word: אֲשַׁבֵּר
  choice: разобью
  rationale: Интенсивная порода глагола выражает решительное разрушение; «разобью» звучит естественно применительно к дверям.
- source_word: בְרִיחֵי בַרְזֶל
  choice: железные засовы
  rationale: בְּרִיחַ обозначает запирающий брус или засов; «железные засовы» ясно передаёт назначение предметов и сохраняет параллелизм.
- source_word: אֲגַדֵּעַ
  choice: перерублю
  rationale: Глагол означает отсечение или разрубание; «перерублю» естественно сочетается с железными засовами и передаёт решительность действия.
theological_decisions:
- issue: Смысловое ударение в Божьем самообязательстве
  choice: Я сам пойду перед тобой
  alternative: Я пойду перед тобой
  rationale: Явное אֲנִי усиливает подлежащее. «Я сам» сохраняет этот акцент, не добавляя отсутствующего в тексте богословского содержания.
- issue: Образ устранения препятствий перед Киром
  choice: неровные места выровняю
  alternative: горы сделаю равниной / искривлённое выпрямлю
  rationale: Из-за трудности еврейской фразы перевод не конкретизирует препятствия как горы и сохраняет общий образ того, как Бог делает путь ровным.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Порядок слов «неровные места выровняю» слегка возвышен и подчёркивает объект, но остаётся понятным. Точка с запятой сохраняет две параллельные группы Божьих действий.
