base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/019.yaml
  text: I did not speak in secret[a], in a land of darkness; I did not say to the offspring of Jacob, ‘Seek me in vain.’ I, Yahweh, speak righteousness[b], declaring what is upright.
translation:
  language: ru
  text: 'Я говорил не тайно, не в каком-либо тёмном месте земли. Я не говорил потомкам Иакова: «Ищите Меня напрасно».[a] Я — Яхве: Я говорю то, что праведно, возвещаю то, что справедливо.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ищите Меня впустую» или «Ищите Меня без пользы». Еврейское תֹהוּ может означать пустоту, тщетность или бесформенность; здесь смысл в том, что искать Яхве не напрасно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я, Яхве, говорю праведность» или «говорю то, что правильно». Еврейское צֶדֶק может означать праведность, правоту или справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַסֵּתֶר
  choice: тайно
  rationale: Передаёт значение сокрытости и секретности естественным современным русским наречием.
- source_word: בִּמְקוֹם אֶרֶץ חֹשֶׁךְ
  choice: в месте, в земле тьмы
  rationale: Сохраняет необычную двучленную конструкцию еврейского текста и образ тёмной земли, не сводя её без необходимости к одному определению.
- source_word: לְזֶרַע יַעֲקֹב
  choice: потомкам Иакова
  rationale: Коллективное זֶרַע здесь естественно означает потомство, то есть потомков Иакова.
- source_word: תֹּהוּ
  choice: впустую
  rationale: В контексте повеления искать Бога слово указывает на тщетность или безрезультатность, а не на первозданный хаос.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: דֹּבֵר צֶדֶק
  choice: говорящий правду
  rationale: צֶדֶק охватывает правоту, праведность и справедливость; в сочетании с глаголом речи русское «говорящий правду» естественно выражает достоверность и правоту Божьих слов.
- source_word: מַגִּיד מֵישָׁרִים
  choice: возвещающий то, что справедливо
  rationale: Передаёт образ прямоты как нравственной правильности и справедливости естественным русским выражением.
theological_decisions:
- issue: Смысл Божьего самоописания в заключительной части стиха
  choice: говорящий правду, возвещающий то, что справедливо
  alternative: говорящий праведность, возвещающий прямое
  rationale: Формулировка сохраняет нравственную правоту и надёжность речи Яхве, не сужая צֶדֶק исключительно до судебной справедливости или абстрактной праведности.
- issue: Смысл призыва искать Яхве
  choice: «Ищите Меня впустую»
  alternative: «Ищите Меня в пустоте» / «Ищите Меня без пользы»
  rationale: Контекст противопоставляет открытую и надёжную речь Бога бесплодному поиску; перевод не утверждает, будто Бог повелевал искать Его тщетно.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксическая необычность выражения «в месте, в земле тьмы» сохранена ради близости к еврейскому тексту; местоимение «Меня» написано с прописной буквы согласно распространённой русской библейской традиции.
