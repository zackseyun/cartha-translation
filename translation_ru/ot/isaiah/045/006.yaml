  text: לְמַ֣עַן יֵדְע֗וּ מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ וּ/מִ/מַּ֣עֲרָבָ֔/הּ כִּי אֶ֖פֶס בִּלְעָדָ֑/י אֲנִ֥י יְהוָ֖ה וְ/אֵ֥ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/006.yaml
  text: so that they may know[a], from the rising of the sun and from its setting, that there is none besides me. I am Yahweh[b], and there is no other.
translation:
  language: ru
  text: чтобы от восхода солнца и от его заката[a] все знали, что нет никого, кроме Меня[b]. Я — Яхве[c], и нет иного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть от востока до запада; буквально: «от восхода солнца и от его заката».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение можно передать более буквально: «ничего нет помимо Меня»; в данном контексте речь об отсутствии иного Бога.'
    reason: source_ambiguity
  - marker: c
    text: Евр. יהוה (ЙХВХ); традиционно переводится как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: чтобы … знали
  rationale: Сочетание לְמַעַן с имперфектом вводит цель или ожидаемый результат; русская конструкция с «чтобы» естественно сохраняет эту функцию.
- source_word: מִמִּזְרַח שֶׁמֶשׁ וּמִמַּעֲרָבָהּ
  choice: от восхода солнца и от его заката
  rationale: Сохранён поэтический образ движения солнца и повтор предлога «от», соответствующий еврейскому מִן в обеих частях. Выражение охватывает восток и запад, то есть всю землю.
- source_word: כִּי
  choice: что
  rationale: Здесь союз вводит содержание того, что должны узнать, а не причину.
- source_word: אֶפֶס בִּלְעָדָי
  choice: нет никого, кроме Меня
  rationale: Идиома утверждает исключительную уникальность говорящего. «Никого» естественно в русском контексте личного Божьего высказывания, тогда как более буквальное «ничего» могло бы неоправданно расширить смысл до отрицания существования всего сотворённого.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Самостоятельное местоимение אֲנִי передаёт эмфатическое самоотождествление, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: וְאֵין עוֹד
  choice: и нет иного
  rationale: Краткая формула сохраняет абсолютное утверждение об отсутствии какого-либо другого Бога и не добавляет отсутствующего в еврейском тексте существительного.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон — личное Божье имя. «Яхве» сохраняет имя, тогда как «Господь» передаёт традиционную замену при чтении; форма «Иегова» основана на более позднем сочетании согласных имени с подсказывающими огласовками.
- issue: Географический охват солнечного образа
  choice: от восхода солнца и от его заката
  alternative: от востока до запада
  rationale: Буквенный образ исходного текста сохранён, не устраняя его поэтичности; подразумеваемый всеобщий охват разъяснён в сноске.
- issue: Формула исключительности אֶפֶס בִּלְעָדָי
  choice: нет никого, кроме Меня
  alternative: ничего нет помимо Меня
  rationale: Контекст противопоставляет Яхве другим притязаниям на божественность. Личное «никого» передаёт это без философского утверждения, будто вне Бога вообще ничто не существует; формальная широта еврейской конструкции отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краток и торжественен; солнечный образ сохранён, а архаизмы вроде «нет иного, кроме Меня» не нагромождаются. Заглавная буква в «Меня» следует принятой русской библейской орфографии для речи Бога.
