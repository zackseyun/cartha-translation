  verdict: revise
  source_fidelity: Первая форма בּוֹשׁוּ обозначает, прежде всего, что они устыдятся/будут испытывать стыд, а не обязательно что их кто-то «пристыдит». Нִכְלְמוּ уместно передано как «будут посрамлены». הָלְכוּ בַּכְּלִמָּה сохраняется в образном «пойдут с позором»; «уйдут» излишне конкретизирует направление движения как удаление.
  naturalness: «Будут пристыжены» в современном русском звучит менее естественно и вводит невыраженный пассивный агент. Ясное именование изготовителей идолов в начале и местоименная отсылка во второй части делают связь «все они» с последним членом еврейской строки прозрачной и сохраняют пророческий регистр.
  terminology: «Изготовители идолов» точно передаёт ремесленников/создателей культовых образов в данном контексте. Сноска «изваяния» корректно сохраняет более лексически нейтральную альтернативу для צִירִים.
  issues:
