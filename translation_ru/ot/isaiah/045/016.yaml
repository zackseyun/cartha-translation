    issue: «будут пристыжены»
    rationale: Форма בּוֹשׁוּ описывает стыд/посрамление субъектов и не требует пассивного значения «быть пристыженным кем-либо»; «устыдятся» передаёт её точнее и естественнее.
  - severity: low
    issue: «уйдут с позором»
    rationale: «Уйдут» добавляет смысл ухода прочь, которого в הָלְכוּ нет. «Пойдут с позором» сохраняет глагольный образ без этого уточнения.
  revised_text: Все изготовители идолов устыдятся и будут посрамлены; все вместе они пойдут с позором.[a]
