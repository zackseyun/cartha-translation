  text: בּ֥וֹשׁוּ וְ/גַֽם נִכְלְמ֖וּ כֻּלָּ֑/ם יַחְדָּו֙ הָלְכ֣וּ בַ/כְּלִמָּ֔ה חָרָשֵׁ֖י צִירִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/016.yaml
  text: They are put to shame and also humiliated[a], all of them together; the makers of idols go in disgrace.
translation:
  language: ru
  text: Все изготовители идолов устыдятся и будут посрамлены; все вместе они пойдут с позором.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изготовители изваяний».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשׁוּ
  choice: будут пристыжены
  rationale: Глагол выражает пережитый позор и крушение надежд; будущее время естественно передаёт пророческое совершенное в данном контексте.
- source_word: וְגַם נִכְלְמוּ
  choice: и посрамлены
  rationale: וְגַם усиливает параллельное выражение, а נכלם обозначает унижение и бесчестье; сочетание сохраняет риторическое нарастание без архаизма.
- source_word: כֻּלָּם יַחְדָּו
  choice: все они… вместе
  rationale: Переданы и местоименный суффикс, и указание на общность их участи.
- source_word: הָלְכוּ בַכְּלִמָּה
  choice: уйдут с позором
  rationale: הלך здесь описывает уход или вступление в состояние бесчестья; русское выражение «уйдут с позором» естественно сохраняет образ движения.
- source_word: חָרָשֵׁי צִירִים
  choice: те, кто изготовляет идолов
  rationale: חָרָשֵׁי означает ремесленников или изготовителей, а צִירִים в антиидолопоклонническом контексте — изваяния, служащие идолами.
theological_decisions:
- issue: Значение חָרָשֵׁי צִירִים
  choice: изготовители идолов
  alternative: изготовители изваяний
  rationale: Контекст Ис 45 противопоставляет Господа рукотворным богам, поэтому «идолы» ясно передаёт референт; сноска сохраняет более буквальную лексическую возможность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Параллелизм еврейского текста сохранён, но порядок слов слегка перестроен ради естественности русского синтаксиса.
