  variant: modern literary Russian
source:
  edition: WLC
  text: אֲנִ֤י יְהוָה֙ וְ/אֵ֣ין ע֔וֹד זוּלָתִ֖/י אֵ֣ין אֱלֹהִ֑ים אֲאַזֶּרְ/ךָ֖ וְ/לֹ֥א יְדַעְתָּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/005.yaml
  text: I am Yahweh[a], and there is no other; besides me there is no God. I strengthen you, though you have not known me.
translation:
  language: ru
  text: Я — Яхве, и нет другого; кроме Меня нет Бога. Я укреплю тебя[a], хотя ты Меня не знал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «препояшу тебя» или «вооружу тебя». Еврейский глагол может обозначать препоясывание или снаряжение для действия и тем самым — наделение силой.'
    reason: Лексическая неоднозначность глагола אֲאַזֶּרְךָ.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь»; форма «Яхве» устоялась в современной русской библеистике.
- source_word: וְאֵין עוֹד
  choice: и нет другого
  rationale: Естественно по-русски передаёт категорическое утверждение об отсутствии кого-либо другого и сохраняет параллелизм стиха.
- source_word: זוּלָתִי
  choice: кроме Меня
  rationale: Точно выражает исключение по отношению к говорящему и естественно сочетается со следующими словами «нет Бога».
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В данном утверждении слово обозначает Бога как единственного истинного Бога; прописная буква передаёт этот смысл и не представляет Его одним из множества божеств.
- source_word: אֲאַזֶּרְךָ
  choice: Я укреплю тебя
  rationale: Пиэль глагола אזר может означать «препоясывать», «снаряжать», «укреплять». Выбранный вариант ясно передаёт дарование Киру силы для действия, а будущее время соответствует форме yiqtol и контексту обещания.
- source_word: וְלֹא יְדַעְתָּנִי
  choice: хотя ты Меня не знал
  rationale: 'Союз ו в контексте имеет уступительный оттенок: Яхве наделяет Кира силой, несмотря на то что тот Его не знал. Прошедшее время естественно передаёт предшествующее отсутствие знания о Боге.'
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Смысл союза в заключительной части стиха
  choice: «хотя ты Меня не знал»
  alternative: «и ты Меня не знал»
  rationale: Уступительная передача выявляет контекстуальный контраст между действием Яхве и незнанием Кира, не устраняя напряжения между Божьим избранием и отсутствием у Кира прежнего признания Бога.
- issue: Образность глагола אזר
  choice: «укреплю» в тексте с буквальными вариантами в сноске
  alternative: «препояшу»; «вооружу»
  rationale: «Укреплю» понятно современному читателю и сохраняет общий смысл наделения силой; сноска удерживает конкретную образность и лексическую неоднозначность еврейского глагола.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Параллелизм двух утверждений об исключительности Яхве сохранён; местоимение «Меня» написано с прописной буквы по принятой русской библейской традиции.
