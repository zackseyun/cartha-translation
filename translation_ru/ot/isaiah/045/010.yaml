  naturalness: '«Горе тому, кто говорит отцу...» — естественная для современного литературного русского библейская формула. «Что ты мучишься родами?» имеет намеренно приподнятую библейскую окраску, но понятно и точнее передаёт образ, чем разговорно неестественное «рождаешь в муках». Тире перед «или» не нужно: это обычный второй однородный член конструкции.'
