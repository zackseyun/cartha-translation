base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/010.yaml
  text: Woe to one who says to a father[a], ‘What are you fathering?’ or to a woman[b], ‘What are you giving birth to?’
translation:
  language: ru
  text: 'Горе тому, кто говорит отцу[a]: «Что ты порождаешь?» или женщине[b]: «Что ты мучишься родами?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что ты зачинаешь?» Еврейский глагол относится к отцу и обозначает произведение потомства.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Что ты производишь на свет?» Еврейское слово вызывает образ родовых схваток и рождения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе тому
  rationale: Пророческое восклицание выражает осуждение и сохраняет резкую обличительную силу еврейского הוֹי.
- source_word: אֹמֵר
  choice: кто говорит
  rationale: Субстантивированное причастие передано естественной русской относительной конструкцией с обобщённым значением.
- source_word: לְאָב
  choice: отцу
  rationale: В еврейском тексте нет притяжательного суффикса, поэтому не добавлено «своему»; сохранён обобщённый образ отца.
- source_word: מַה תּוֹלִיד
  choice: Что ты порождаешь?
  rationale: Порода Hiphil глагола ילד при обращении к мужчине обозначает произведение потомства, зачатие со стороны отца. «Порождаешь» сохраняет отцовский образ и намеренно необычный вопрос, не подменяя его более привычным материнским «рожаешь».
- source_word: וּלְאִשָּׁה
  choice: или женщине
  rationale: Союз вводит вторую часть параллельной конструкции; русское «или» ясно передаёт парное сопоставление. Притяжательное «своей матери» не добавлено, поскольку его нет в тексте.
- source_word: מַה תְּחִילִין
  choice: Что ты рождаешь в муках?
  rationale: Глагол от חול/חיל вызывает образ схваток, родовых мук и рождения. Перевод сохраняет как результативную направленность, так и телесный образ родовых страданий.
theological_decisions:
- issue: Смысл образов отца и рожающей женщины
  choice: Сохранить буквальный родительский образ, не называя Бога прямо в тексте стиха.
  alternative: 'Раскрыть сравнение парафразом: «как смеет творение спрашивать своего Творца».'
  rationale: Контекст связывает образ с недопустимым пререканием человека со своим Создателем, однако сам стих выражает эту мысль через аналогию. Её напряжение и косвенность следует сохранить.
- issue: Необычность вопросов с מַה
  choice: Передать буквально вопросительным «что», сохранив вызывающую нелепость обращения.
  alternative: Передать «зачем» или заменить на более естественное «кого».
  rationale: Основное значение מַה — «что». Формулировка намеренно представляет нелепый упрёк родителям; более гладкий вариант мог бы преждевременно истолковать вопрос.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Горе тому» сохраняет библейскую торжественность, оставаясь понятным. Необычное «что ты порождаешь?» удерживает смысловую резкость и параллелизм исходного текста; тире перед «или» помогает ясно оформить два параллельных обращения.
