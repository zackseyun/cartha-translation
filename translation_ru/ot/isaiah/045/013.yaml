  variant: modern literary Russian
source:
  edition: WLC
  text: אָנֹכִי֙ הַעִירֹתִ֣/הֽוּ בְ/צֶ֔דֶק וְ/כָל דְּרָכָ֖י/ו אֲיַשֵּׁ֑ר הֽוּא יִבְנֶ֤ה עִירִ/י֙ וְ/גָלוּתִ֣/י יְשַׁלֵּ֔חַ לֹ֤א בִ/מְחִיר֙ וְ/לֹ֣א בְ/שֹׁ֔חַד אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/013.yaml
  text: I have stirred him up in righteousness[a], and I will make all his ways straight. He will rebuild my city and send my exiles away, not for a price and not for a bribe[c][b], says Yahweh of Armies.
translation:
  language: ru
  text: «Я побудил его в праведности[a] и выпрямлю все его пути. Он отстроит Мой город[b] и отпустит Моих изгнанников — не за плату и не за взятку, — говорит Яхве Воинств[c]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Я пробудил его» или «Я воздвиг его». Еврейское выражение может также пониматься как «ради праведности» или «ради справедливости».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «построит Мой город». «Отстроит» передаёт исторический контекст восстановления разрушенного Иерусалима.'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционно: «Господь Саваоф»; также переводят: «Господь воинств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִירֹתִהוּ
  choice: воздвиг его
  rationale: Каузативная форма глагола עור передаёт пробуждение или побуждение к действию. «Воздвиг» естественно звучит в торжественной речи и сохраняет смысл Божьей инициативы, не называя Кира прямо.
- source_word: בְצֶדֶק
  choice: по правде
  rationale: Предлог בְּ допускает оттенки образа действия, основания или цели, а צֶדֶק означает правду, праведность или справедливость. «По правде» кратко передаёт нравственно-правовой смысл и не сводит его только к судебной справедливости.
- source_word: אֲיַשֵּׁר ... דְּרָכָיו
  choice: выпрямлю все его пути
  rationale: 'Сохранён образ прямых путей: Бог направит и устроит ход действий этого человека.'
- source_word: יִבְנֶה עִירִי
  choice: отстроит Мой город
  rationale: Сам глагол означает «строить», но в историческом контексте речь идёт о восстановлении разрушенного Иерусалима. «Отстроит» естественно выражает этот контекстуальный смысл.
- source_word: גָלוּתִי יְשַׁלֵּחַ
  choice: отпустит Моих изгнанников
  rationale: גָּלוּת может обозначать изгнание или сообщество изгнанных, а интенсивная форма שׁלח — отпустить или выслать. При личном дополнении «отпустит Моих изгнанников» ясно передаёт освобождение, не добавляя прямо не названного направления возвращения.
- source_word: לֹא בִמְחִיר וְלֹא בְשֹׁחַד
  choice: не за плату и не за взятку
  rationale: 'Сохранена параллельная коммерческая и юридическая лексика: освобождение не будет куплено ни оплатой, ни подкупом.'
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יהוה передано как «Яхве», а множественное צְבָאוֹת — прозрачным титулом «Воинств», сохраняющим образ Бога как Повелителя небесных и земных сил без замены имени словом «Господь».
theological_decisions:
- issue: Кого обозначают местоимения «его» и «он»
  choice: Сохранить местоимения без добавления имени Кира
  alternative: Назвать Кира в основном тексте
  rationale: Контекст главы указывает на Кира, однако сам стих использует местоимения. Их сохранение следует форме еврейского текста и не превращает контекстуальное пояснение в часть перевода.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога, поэтому оно передано как имя, а не заменено титулом.
- issue: Смысл בְצֶדֶק
  choice: по правде
  alternative: ради правды; в праведности
  rationale: Еврейская конструкция допускает оттенок образа действия, основания или цели. Основной текст оставляет формулировку сравнительно открытой, а примечание фиксирует допустимые варианты.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис остаётся ясным и близким к еврейскому параллелизму; местоимения с прописной буквы относятся к Богу в сочетаниях «Мой город» и «Моих изгнанников».
