  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה יְגִ֨יעַ מִצְרַ֥יִם וּֽ/סְחַר כּוּשׁ֮ וּ/סְבָאִים֮ אַנְשֵׁ֣י מִדָּה֒ עָלַ֤יִ/ךְ יַעֲבֹ֨רוּ֙ וְ/לָ֣/ךְ יִֽהְי֔וּ אַחֲרַ֣יִ/ךְ יֵלֵ֔כוּ בַּ/זִּקִּ֖ים יַעֲבֹ֑רוּ וְ/אֵלַ֤יִ/ךְ יִֽשְׁתַּחֲוּוּ֙ אֵלַ֣יִ/ךְ יִתְפַּלָּ֔לוּ אַ֣ךְ בָּ֥/ךְ אֵ֛ל וְ/אֵ֥ין ע֖וֹד אֶ֥פֶס אֱלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/014.yaml
  text: 'Thus says Yahweh: The wealth of Egypt and the merchandise of Cush and the Sabeans[a], men of great stature, will pass over to you and will be yours; they will walk behind you, they will pass over in chains; they will bow down to you, they will pray to you: ‘Surely God is in you, and there is no other[b]; there is no other god.’'
translation:
  language: ru
  text: 'Так говорит Яхве:


    «Богатство Египта, товары Куша

    и рослые савеяне

    перейдут к тебе и будут твоими.

    Они пойдут за тобой,

    в оковах перейдут.

    Они склонятся перед тобой

    и будут молить тебя[a]:


    “Воистину, Бог в тебе,

    и нет другого —

    нет иного бога”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут молиться тебе». Еврейский глагол может означать как молитву, так и обращённую к кому-либо настойчивую мольбу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: יְגִיעַ מִצְרַיִם
  choice: богатство Египта
  rationale: Существительное может обозначать труд, добычу или плод труда; в параллели с торговыми товарами естественно передаёт материальные богатства Египта.
- source_word: סְחַר כּוּשׁ
  choice: товары Куша
  rationale: סְחַר обозначает торговый товар или торговую прибыль; «товары» конкретно и естественно в данном контексте. Древний топоним כּוּשׁ сохранён как «Куш» без отождествления с современной Эфиопией.
- source_word: סְבָאִים אַנְשֵׁי מִדָּה
  choice: рослые савеяне
  rationale: Этноним передан традиционной русской формой, а идиома אַנְשֵׁי מִדָּה — естественным обозначением людей высокого роста.
- source_word: עָלַיִךְ יַעֲבֹרוּ וְלָךְ יִהְיוּ
  choice: перейдут к тебе и будут твоими
  rationale: Сохраняет образ перехода и последующее значение принадлежности или подчинения; женский род адресата не выражен в этих русских формах.
- source_word: אַחֲרַיִךְ יֵלֵכוּ
  choice: пойдут за тобой
  rationale: Естественно сохраняет пространственный образ следования позади адресата.
- source_word: בַּזִּקִּים
  choice: в оковах
  rationale: Обозначает путы или цепи; «оковы» соответствует возвышенному пророческому регистру и ясно передаёт несвободу.
- source_word: וְאֵלַיִךְ יִשְׁתַּחֲוּוּ
  choice: склонятся перед тобой
  rationale: Передаёт телесный жест почтения, не уточняя его как божественное поклонение адресату.
- source_word: אֵלַיִךְ יִתְפַּלָּלוּ
  choice: будут молить тебя
  rationale: Глагол обычно связан с молитвой, но при человеческом или олицетворённом адресате может выражать настойчивую мольбу. Русское «молить» сохраняет направленность к адресату и избегает преждевременного снятия неоднозначности.
- source_word: אַךְ בָּךְ אֵל
  choice: только у тебя Бог
  rationale: Предлог בְּ с местоимением допускает смысл пребывания Бога «в тебе» либо Его присутствия «у тебя». Формулировка «у тебя Бог» естественна по-русски и сохраняет признание особого Божьего присутствия при адресате.
- source_word: וְאֵין עוֹד אֶפֶס אֱלֹהִים
  choice: и нет другого — нет иного бога
  rationale: Сохраняет усиленное повторение отрицания и различает первое эллиптическое «другого» от заключительного нарицательного אֱלֹהִים.
theological_decisions:
- issue: Обозначает ли יִשְׁתַּחֲוּוּ поклонение адресату как божеству или жест подчинения и почтения
  choice: «склонятся перед тобой»
  alternative: «поклонятся тебе»
  rationale: Адресат имеет форму женского единственного числа и, вероятно, представляет Сион или Израиль. Нейтральное описание жеста сохраняет смысл текста, не приписывая адресату божественный статус.
- issue: Следует ли понимать יִתְפַּלָּלוּ как молитву адресату или как обращённую к нему мольбу
  choice: «будут молить тебя» с примечанием
  alternative: «будут молиться тебе»
  rationale: Еврейская конструкция прямо направляет действие к адресату, но контекст связывает исповедание с присутствующим у него Богом. Основной текст и примечание сохраняют обе возможные смысловые стороны, не разрешая напряжение догматически.
- issue: Как передать בָּךְ в исповедании Божьего присутствия
  choice: «у тебя Бог»
  alternative: «в тебе Бог»
  rationale: Буквальное «в тебе» возможно и отмечено, однако «у тебя Бог» в современном русском лучше выражает присутствие Бога при Сионе/Израиле, не исключая более тесного пространственного оттенка оригинала.
- issue: Является ли последнее אֱלֹהִים именованием единого Бога или нарицательным обозначением божества
  choice: «нет иного бога» со строчной буквы
  alternative: «нет иного Бога»
  rationale: 'В отрицательной формуле существительное естественно читается как нарицательное: никакого иного божества не существует. Строчная буква сохраняет это различие, тогда как предыдущее אֵל в утверждении передано «Бог».'
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным пророческим ритмом. Синтаксический параллелизм и повтор отрицания сохранены. Местоимение «тебе/тобой» оставлено без поясняющей вставки: еврейские формы указывают на адресата женского рода, вероятнее всего олицетворённый Сион или Израиль. Маркер [a] присутствует в основном тексте.'
