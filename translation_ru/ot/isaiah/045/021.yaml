  text: הַגִּ֣ידוּ וְ/הַגִּ֔ישׁוּ אַ֥ף יִֽוָּעֲצ֖וּ יַחְדָּ֑ו מִ֣י הִשְׁמִיעַ֩ זֹ֨את מִ/קֶּ֜דֶם מֵ/אָ֣ז הִגִּידָ֗/הּ הֲ/ל֨וֹא אֲנִ֤י יְהוָה֙ וְ/אֵֽין ע֤וֹד אֱלֹהִים֙ מִ/בַּלְעָדַ֔/י אֵֽל צַדִּ֣יק וּ/מוֹשִׁ֔יעַ אַ֖יִן זוּלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/021.yaml
  text: Declare it and present your case[a]; indeed, let them consult together. Who announced this from long ago? Who declared it from former times? Was it not I, Yahweh? There is no other God besides me, a righteous God and a Savior[c][b]; there is none except me.
translation:
  language: ru
  text: Объявите и представьте своё дело[a]; пусть они вместе посоветуются. Кто возвестил это издавна, кто объявил это с давних времён? Не Я ли, Яхве[b]? Нет другого Бога, кроме Меня, праведного Бога[c] и Спасителя; нет никого, кроме Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднесите это», «представьте это». В контексте спора еврейское выражение, вероятно, имеет судебный смысл: «представьте своё дело».'
    reason: lexical_alternative
  - marker: b
    text: Евр. YHWH — личное имя Бога; традиционно передаётся как «Господь».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «справедливого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Объявите
  rationale: Множественное число повелительного наклонения передаёт призыв к публичному, формальному заявлению в контексте спора.
- source_word: וְהַגִּישׁוּ
  choice: представьте своё дело
  rationale: 'В данном контексте форма от נגשׁ, вероятно, имеет судебный оттенок: требуется выдвинуть доводы или представить дело.'
- source_word: אַף יִוָּעֲצוּ יַחְדָּו
  choice: пусть они вместе посоветуются
  rationale: Сохраняет значение совместного совещания и переход от обращения во втором лице к упоминанию оппонентов в третьем лице.
- source_word: מִי הִשְׁמִיעַ זֹאת
  choice: Кто возвестил об этом
  rationale: Каузативная форма идиоматически означает сделать известным, провозгласить; «возвестил» соответствует возвышенному, но современно понятному регистру.
- source_word: מִקֶּדֶם ... מֵאָז
  choice: издавна ... с давних времён
  rationale: Параллельные временные выражения передают древность предсказания без архаичной русской конструкции.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: אֵל צַדִּיק
  choice: Бога праведного
  rationale: צַדִּיק обозначает праведность и справедливость; «праведного» сохраняет широкий нравственно-заветный смысл.
- source_word: וּמוֹשִׁיעַ
  choice: и Спасителя
  rationale: Причастие обозначает того, кто спасает или избавляет; существительное «Спаситель» естественно передаёт эту функцию.
- source_word: אַיִן זוּלָתִי
  choice: нет никого, кроме Меня
  rationale: Передаёт заключительное усиленное утверждение исключительности Бога, не повторяя дословно предыдущую формулу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Основной текст сохраняет личное имя, непосредственно присутствующее в еврейском оригинале; традиционная замена титулом отмечена в сноске.
- issue: Значение צַדִּיק применительно к Богу
  choice: праведный
  alternative: справедливый
  rationale: Оба значения лексически возможны. «Праведный» шире и сохраняет привычную библейскую связь с нравственной правотой, тогда как оттенок справедливости указан в сноске.
- issue: Соотношение «праведного» и «Спасителя»
  choice: два согласованных определения одного Бога
  alternative: «праведный Бог и спасающий»
  rationale: Еврейский текст связывает справедливость/праведность Бога с Его спасительной деятельностью, не противопоставляя их и не объясняя догматически способ их сочетания.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис сохраняет смену второго лица на третье в еврейском тексте и параллелизм риторических вопросов. Прописные местоимения при обращении Бога к Себе использованы как русская издательская конвенция благоговейного регистра.
