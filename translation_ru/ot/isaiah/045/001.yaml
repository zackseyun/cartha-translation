id: ISA.45.1
reference: Isaiah 45:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּה אָמַ֣ר יְהוָה֮ לִ/מְשִׁיח/וֹ֮ לְ/כ֣וֹרֶשׁ אֲשֶׁר הֶחֱזַ֣קְתִּי בִֽ/ימִינ֗/וֹ לְ/רַד לְ/פָנָי/ו֙ גּוֹיִ֔ם וּ/מָתְנֵ֥י מְלָכִ֖ים אֲפַתֵּ֑חַ לִ/פְתֹּ֤חַ לְ/פָנָי/ו֙ דְּלָתַ֔יִם וּ/שְׁעָרִ֖ים לֹ֥א יִסָּגֵֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/001.yaml
  text: 'Thus says Yahweh to his anointed[a], to Cyrus, whose right hand I have grasped, to subdue nations before him and to loosen the loins of kings, to open doors before him[c][b], and gates shall not be shut:'
translation:
  language: ru
  text: 'Так говорит Яхве Своему помазаннику[a], Киру, которого Я взял за правую руку, чтобы покорить ему народы, развязать пояса царей[b], отворить перед ним двери[c], — и ворота не будут заперты:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «помазанник» принадлежит к той же семье слов, что и «Мессия»; здесь оно относится к Киру как к человеку, которого Яхве избрал и уполномочил для этой задачи.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «развязать чресла царей». Образ может означать лишить их силы или разоружить их.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово имеет форму двойственного числа и может означать «двустворчатые двери».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет краткую и торжественную формулу введения пророческой речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: לִמְשִׁיחוֹ
  choice: Своему помазаннику
  rationale: Сохраняет прямое значение «помазанный» и необычное применение этого обозначения к Киру, не превращая его здесь в позднейший специализированный титул.
- source_word: לְכוֹרֶשׁ
  choice: Киру
  rationale: Использована устоявшаяся русская форма имени персидского царя.
- source_word: אֲשֶׁר הֶחֱזַקְתִּי בִימִינוֹ
  choice: которого Я взял за правую руку
  rationale: Естественно передаёт конкретный образ поддержки и наделения силой; принадлежность руки Киру ясна из русской конструкции.
- source_word: לְרַד לְפָנָיו גּוֹיִם
  choice: чтобы покорить ему народы
  rationale: Передаёт военно-политическое подчинение народов перед Киром без излишнего усиления образа попрания.
- source_word: וּמָתְנֵי מְלָכִים אֲפַתֵּחַ
  choice: развязать пояса царей
  rationale: Сохраняет телесно-воинский образ еврейского выражения в понятной русской форме; смысл ослабления или разоружения разъясняется в примечании.
- source_word: לִפְתֹּחַ לְפָנָיו דְּלָתַיִם
  choice: отворить перед ним двери
  rationale: «Отворить» соответствует возвышенному регистру; обычное множественное число не перегружает текст, а возможное значение парных дверей отмечено в сноске.
- source_word: וּשְׁעָרִים לֹא יִסָּגֵרוּ
  choice: и ворота не будут заперты
  rationale: Передаёт пассивную форму и естественно сочетается в русском языке с воротами.
theological_decisions:
- issue: Обозначение Кира словом מָשִׁיחַ
  choice: Своему помазаннику
  alternative: Своему Мессии
  rationale: В данном контексте слово указывает на избрание и уполномочивание Кира Яхве для исторической задачи. Перевод сохраняет значимую связь со словом «Мессия», но не приписывает Киру без основания позднейшее специализированное мессианское значение.
- issue: Субъект действий, выраженных инфинитивами
  choice: Русские инфинитивы отнесены к действию Бога через взятие Кира за руку
  alternative: Понять инфинитивы как непосредственные действия самого Кира
  rationale: Еврейская конструкция допускает тесную связь целей с Божьим действием и одновременно подразумевает осуществление их через Кира. Русская формулировка сохраняет эту связь, не добавляя отдельного субъекта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Формы «отворить» и «помазанник» сохраняют достоинство и библейскую образность, оставаясь понятными; архаичные «чресла» вынесены в примечание.
