source:
  edition: WLC
  text: ה֗וֹי רָ֚ב אֶת יֹ֣צְר֔/וֹ חֶ֖רֶשׂ אֶת חַרְשֵׂ֣י אֲדָמָ֑ה הֲ/יֹאמַ֨ר חֹ֤מֶר לְ/יֹֽצְר/וֹ֙ מַֽה תַּעֲשֶׂ֔ה וּ/פָעָלְ/ךָ֖ אֵין יָדַ֥יִם לֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/009.yaml
  text: Woe to the one who contends with his Maker— a potsherd among the potsherds of the earth! Shall the clay say to the one who forms it[a], “What are you making?” or your work, “He has no hands”?
translation:
  language: ru
  text: 'Горе тому, кто спорит со своим Создателем, — черепку среди черепков земли! Разве скажет глина тому, кто лепит её: «Что ты делаешь?» — или твоё изделие: «У него нет рук»?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «У него нет ручек», то есть изделие порицает форму сосуда, а не умение создателя.'
    reason: Лексически יָדַיִם может обозначать как руки создателя, так и ручки сосуда; контекст допускает оба понимания.
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Передаёт пророческое предостережение и обличение естественным для русского библейского регистра выражением.
- source_word: רָב אֶת יֹצְרוֹ
  choice: кто спорит со своим Создателем
  rationale: Глагольная форма выражает спор, тяжбу или противоборство; «Создатель» сохраняет противопоставление Творца и творения, подразумеваемое образом горшечника.
- source_word: חֶרֶשׂ אֶת חַרְשֵׂי אֲדָמָה
  choice: черепку среди черепков земли
  rationale: «Черепок» точно обозначает обломок глиняного сосуда, а «среди» естественно раскрывает эллиптическое сопоставление с прочими земными черепками.
- source_word: הֲיֹאמַר חֹמֶר לְיֹצְרוֹ
  choice: Разве скажет глина тому, кто лепит её
  rationale: Сохраняет риторический вопрос и образ материала, возражающего тому, кто придаёт ему форму.
- source_word: מַה תַּעֲשֶׂה
  choice: Что ты делаешь?
  rationale: Передаёт широкий смысл עשה и сохраняет упрёк творения создателю, не сужая значение исключительно до ремесленного процесса.
- source_word: וּפָעָלְךָ
  choice: или твоё изделие
  rationale: В данном параллелизме слово обозначает результат труда, который представлен говорящим; «изделие» ясно передаёт этот смысл по-русски.
- source_word: אֵין יָדַיִם לוֹ
  choice: У него нет рук
  rationale: Буквально выражение говорит об отсутствии рук; в основном прочтении это дерзкое обвинение создателя в неспособности или неумелости.
theological_decisions:
- issue: Антропоморфическое обвинение в заключительной части стиха
  choice: 'Изделие говорит о создателе: «У него нет рук»'
  alternative: 'Изделие жалуется на собственную форму: «У него нет ручек»'
  rationale: Основное прочтение лучше продолжает обличение творения, которое оспаривает действия своего Создателя. Однако еврейское יָדַיִם допускает понимание «ручки сосуда», поэтому эта подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Образ горшечника передан доступной лексикой без архаизмов; прописная буква в слове «Создатель» указывает на Бога в данном контексте.
