  terminology: «Бог Израиля» и «Спаситель» — устойчивые и точные библейские соответствия. Примечание корректно фиксирует альтернативное понимание причастия и не навязывает объяснения Божьей сокрытости. Якорь [a] стоит непосредственно после спорного выражения.
