  source_fidelity: «Поистине» точно передаёт эмфатическое אָכֵן. «Ты — Бог, скрывающий себя» сохраняет возвратно-среднее, деятельное прочтение причастия מִסְתַּתֵּר, не устраняя допустимого статального смысла. «Бог Израиля, Спаситель» верно отражает последующие приложения אֱלֹהֵי יִשְׂרָאֵל מוֹשִׁיעַ.
