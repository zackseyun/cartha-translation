source:
  edition: WLC
  text: אָכֵ֕ן אַתָּ֖ה אֵ֣ל מִסְתַּתֵּ֑ר אֱלֹהֵ֥י יִשְׂרָאֵ֖ל מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/015.yaml
  text: Truly[a], you are a God who hides himself, the God of Israel, the Savior.
translation:
  language: ru
  text: Поистине, ты — Бог, скрывающий себя[a], Бог Израиля, Спаситель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровенный Бог». Еврейское причастие можно понимать либо возвратно — «скрывающий себя», либо как обозначение состояния — «сокрытый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Поистине
  rationale: Передаёт усиленное утверждение или внезапное признание с естественной для современного литературного русского торжественностью.
- source_word: אַתָּה
  choice: ты
  rationale: Личное местоимение второго лица мужского рода сохраняет прямое обращение к Богу; строчная буква не добавляет отсутствующего в еврейском тексте графического различия.
- source_word: אֵל
  choice: Бог
  rationale: В контексте обозначает Бога Израиля; вариант «могучий Бог» неоправданно расширял бы значение простого существительного.
- source_word: מִסְתַּתֵּר
  choice: скрывающий себя
  rationale: Причастие породы хитпаэль допускает возвратное или среднее значение и сохраняет действие сокрытия, не сводя выражение к одному лишь качеству.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Приложение уточняет, кто назван Богом; русский синтаксис естественно передаёт его без добавочного звательного междометия.
- source_word: מוֹשִׁיעַ
  choice: Спаситель
  rationale: Причастие каузативной породы от ישׁע обозначает того, кто спасает или избавляет; «Спаситель» кратко и естественно передаёт это титульное значение.
theological_decisions:
- issue: Смысл Божьей сокрытости
  choice: Бог, скрывающий себя
  alternative: сокровенный Бог; Бог, который сокрыт
  rationale: Основной текст сохраняет возвратную динамику еврейского причастия, а примечание отмечает возможное статальное понимание. Причина и характер сокрытия не поясняются, чтобы не устранять богословское напряжение стиха.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным исповедальным звучанием. Приложения «Бог Израиля, Спаситель» сохранены без внесения дополнительного обращения; подлинная неоднозначность причастия вынесена в примечание.
