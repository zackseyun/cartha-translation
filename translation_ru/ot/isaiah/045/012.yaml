  text: אָֽנֹכִי֙ עָשִׂ֣יתִי אֶ֔רֶץ וְ/אָדָ֖ם עָלֶ֣י/הָ בָרָ֑אתִי אֲנִ֗י יָדַ/י֙ נָט֣וּ שָׁמַ֔יִם וְ/כָל צְבָאָ֖/ם צִוֵּֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/012.yaml
  text: I made the earth[a], and I created man upon it; my hands stretched out the heavens, and I commanded all their host.
translation:
  language: ru
  text: Я сотворил землю и создал на ней человека[a]; Мои руки распростёрли небеса, и всему их воинству Я повелел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человечество». Еврейское адам здесь употреблено в собирательном значении — о человеческом роде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Я
  rationale: Самостоятельное местоимение подчёркивает личное действие Бога; начальная позиция сохраняет это ударение без добавления слова «Сам».
- source_word: עָשִׂ֣יתִי אֶ֔רֶץ
  choice: сотворил землю
  rationale: В контексте сотворения мира עשה обозначает произведение земли Богом; «сотворил» естественно и возвышенно звучит по-русски.
- source_word: וְאָדָ֖ם עָלֶ֣יהָ בָרָ֑אתִי
  choice: и создал на ней человека[a]
  rationale: אָדָם — собирательное единственное число, допускающее как «человек», так и «человечество»; «человека» сохраняет форму оригинала, а сноска раскрывает собирательный смысл. Местоимение «ней» относится к земле.
- source_word: אֲנִ֗י יָדַי֙
  choice: Мои руки
  rationale: Буквальная еврейская конструкция с повторным «Я» неестественна по-русски; вынесение «Мои руки» в начало части стиха передаёт акцент на непосредственном Божьем действии без добавления «собственные».
- source_word: נָט֣וּ שָׁמַ֔יִם
  choice: распростёрли небеса
  rationale: «Распростёрли» передаёт образ развёртывания или простирания небес и соответствует возвышенному пророческому регистру.
- source_word: וְכָל־צְבָאָ֖ם צִוֵּֽיתִי
  choice: и всему их воинству Я повелел
  rationale: צָבָא здесь означает совокупность небесного воинства или небесных сил; глагол «повелел» сохраняет смысл Божьего властного приказа, не уточняя его содержание.
theological_decisions:
- issue: Собирательное значение אָדָם
  choice: человека[a]
  alternative: человечество
  rationale: Еврейское слово стоит в единственном числе, но обозначает человеческий род в целом. Основной текст сохраняет эту грамматическую форму и подлинную смысловую многозначность, а сноска предотвращает ошибочное ограничение одним человеком.
- issue: Значение небесного «воинства»
  choice: всему их воинству
  alternative: всему их множеству
  rationale: «Воинство» сохраняет образ צָבָא и не решает сверх текста, имеются ли в виду светила, небесные существа или вся упорядоченная совокупность небес.
