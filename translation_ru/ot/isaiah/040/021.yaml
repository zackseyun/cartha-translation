  text: הֲ/ל֤וֹא תֵֽדְעוּ֙ הֲ/ל֣וֹא תִשְׁמָ֔עוּ הֲ/ל֛וֹא הֻגַּ֥ד מֵ/רֹ֖אשׁ לָ/כֶ֑ם הֲ/לוֹא֙ הֲבִ֣ינֹתֶ֔ם מוֹסְד֖וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/021.yaml
  text: Do you not know? Do you not hear? Has it not been told to you from the beginning? Have you not understood from the foundations of the earth?[a]
translation:
  language: ru
  text: Разве вы не знаете? Разве вы не слышали? Разве вам не было возвещено с самого начала? Разве вы не поняли этого от оснований земли?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве вы не поняли основания земли?»'
    reason: Еврейский оборот допускает понимание слов «основания земли» не как указания на источник или исходную точку понимания, а как прямого объекта глагола «поняли».
lexical_decisions:
- source_word: הֲלוֹא
  choice: разве не
  rationale: Повторяющаяся отрицательная вопросительная конструкция выражает риторические вопросы, предполагающие утвердительный ответ; повтор сохранён во всех четырёх частях.
- source_word: תֵדְעוּ
  choice: знаете
  rationale: Прямо передаёт значение знания или осведомлённости и естественно звучит в настоящем времени в риторическом обращении.
- source_word: תִשְׁמָעוּ
  choice: слышали
  rationale: Передаёт обычное значение глагола שׁמע без добавочного оттенка намеренного внимания, который возник бы при переводе «слушали».
- source_word: הֻגַּד
  choice: было возвещено
  rationale: Сохраняет страдательную форму и смысл сообщения аудитории; «возвещено» соответствует возвышенному пророческому регистру, оставаясь понятным современному читателю.
- source_word: מֵרֹאשׁ
  choice: с самого начала
  rationale: Естественно передаёт временное значение исходной, самой ранней точки.
- source_word: הֲבִינֹתֶם
  choice: поняли
  rationale: Передаёт когнитивный смысл понимания и не усиливает его до более узкого «постигли».
- source_word: מוֹסְדוֹת
  choice: были заложены основания
  rationale: Сохраняет образ и множественное число «оснований», а глагольная перестройка позволяет естественно выразить в русском языке возможное временное значение оборота.
- source_word: הָאָרֶץ
  choice: земли
  rationale: Контекст говорит о мироздании, поэтому имеется в виду земля, а не отдельная страна или территория.
theological_decisions:
- issue: Синтаксическая связь заключительного оборота מוֹסְדוֹת הָאָרֶץ
  choice: «с тех пор, как были заложены основания земли» — временное указание, параллельное «с самого начала»
  alternative: «Разве вы не поняли основания земли?» — «основания земли» как прямой объект понимания
  rationale: Перед существительным «основания» нет явного предлога, поэтому еврейский текст допускает обе связи. Основной перевод передаёт вероятное временное значение естественным русским оборотом, а не менее вероятное, но грамматически возможное объектное прочтение сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Четырёхкратное «Разве… не…?» сохраняет настойчивый риторический ритм оригинала. В последней части ради естественности русского синтаксиса добавлено местоимение «этого» и развёрнут временной оборот; альтернативная синтаксическая связь отмечена сноской.
