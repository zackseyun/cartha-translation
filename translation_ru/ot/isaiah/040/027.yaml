  text: Why do you say[a], O Jacob, and speak, O Israel, “My way is hidden from Yahweh, and my justice is disregarded by my God”?
translation:
  language: ru
  text: 'Почему ты говоришь, Иаков, и заявляешь, Израиль: «Мой путь скрыт от Яхве, и моё дело[a] остаётся без внимания моего Бога»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моё право», «мой иск» или «полагающаяся мне справедливость». Еврейское слово может означать дело, законное право или требование справедливого решения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Почему
  rationale: Естественно передаёт риторический вопрос и сохраняет его обличительную силу.
- source_word: תֹאמַר ... וּתְדַבֵּר
  choice: говоришь ... и твердишь
  rationale: Сохраняет параллелизм и различие двух еврейских глаголов; «твердишь» естественно выражает повторяемую жалобу народа.
- source_word: יַעֲקֹב ... יִשְׂרָאֵל
  choice: Иаков ... Израиль
  rationale: Традиционные русские формы имён, здесь параллельно обозначающие один и тот же народ.
- source_word: נִסְתְּרָה דַרְכִּי
  choice: Мой путь скрыт
  rationale: Сохраняет пассивную конструкцию и многозначный образ жизненного пути, положения и участи.
- source_word: מֵיְהוָה
  choice: от Яхве
  rationale: Передаёт предлог как сокрытие от чьего-либо взора и сохраняет личное имя יהוה.
- source_word: מִשְׁפָּטִי
  choice: моё дело
  rationale: В данном контексте обозначает дело или притязание, требующее справедливого рассмотрения; это по-русски естественнее буквального «моя справедливость», а допустимые значения сохранены в примечании.
- source_word: יַעֲבוֹר
  choice: остаётся без внимания
  rationale: Контекстуально передаёт образ того, что проходит мимо и потому не получает рассмотрения, не навязывая окончательного решения о юридическом оттенке существительного.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя Бога.
- issue: Смысл מִשְׁפָּטִי в жалобе Израиля
  choice: моё дело
  alternative: моё право; мой иск; полагающаяся мне справедливость
  rationale: Еврейское слово допускает юридические и более широкие оттенки. Основной текст звучит естественно, а примечание сохраняет неоднозначность и напряжение жалобы о кажущемся невнимании Бога.
translation_notes:
  register: Современный литературный русский язык с торжественной, но общепонятной интонацией. Обращения «Иаков» и «Израиль» сохранены без архаического «о». Формулировка жалобы естественна по-русски и при этом сохраняет образ пути и юридическую неоднозначность второй строки.
