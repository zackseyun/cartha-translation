  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַ֣ל הַר גָּבֹ֤הַ עֲלִי לָ/ךְ֙ מְבַשֶּׂ֣רֶת צִיּ֔וֹן הָרִ֤ימִי בַ/כֹּ֨חַ֙ קוֹלֵ֔/ךְ מְבַשֶּׂ֖רֶת יְרוּשָׁלִָ֑ם הָרִ֨ימִי֙ אַל תִּירָ֔אִי אִמְרִי֙ לְ/עָרֵ֣י יְהוּדָ֔ה הִנֵּ֖ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/009.yaml
  text: Go up on a high mountain[a], bearer of good news to Zion; lift up your voice with strength, bearer of good news to Jerusalem; lift it up, do not fear; say to the cities of Judah[b], “Behold your God!”
translation:
  language: ru
  text: 'Взойди на высокую гору[a], несущая благую весть Сиону; изо всех сил возвысь свой голос, несущая благую весть Иерусалиму[b]; возвысь его, не бойся! Скажи городам Иудеи: «Вот ваш Бог!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейский текст допускает и такой разбор: «Взойди на высокую гору, Сион, несущий благую весть… Иерусалим, несущий благую весть, изо всех сил возвысь свой голос». В этом случае Сион и Иерусалим — олицетворённые вестники.'
    reason: alternative_reading
  - marker: b
    text: Форма «несущая благую весть» в древнееврейском тексте стоит в женском роде. Она может обозначать отдельную вестницу либо олицетворённый город; Сион и Иерусалим, соответственно, могут быть адресатами вести или самими вестниками.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבַשֶּׂרֶת
  choice: несущая благую весть
  rationale: Причастие женского рода единственного числа передаёт возвещение доброй вести и может относиться как к женщине-вестнице, так и к олицетворённому городу; основное чтение трактует Сион и Иерусалим как адресатов, а иной синтаксический разбор отмечен в сносках.
- source_word: עֲלִי
  choice: взойди
  rationale: Повелительная форма глагола עלה обозначает движение вверх; «взойди» естественно сочетается с горой и сохраняет возвышенный пророческий регистр.
- source_word: הַר גָּבֹהַ
  choice: высокую гору
  rationale: Передаёт место, с которого должна прозвучать публичная весть; определённый артикль здесь может иметь родовое значение, поэтому русский язык не требует указательного уточнения.
- source_word: הָרִימִי
  choice: возвысь
  rationale: Повтор повелительной формы сохранён; глагол естественно употребляется с голосом и соответствует торжественному призыву к громкому провозглашению.
- source_word: בַכֹּחַ
  choice: во всю силу
  rationale: Передаёт идею силы и мощи провозглашения естественным русским выражением, не сводя её к нейтральному «громко».
- source_word: קוֹלֵךְ
  choice: свой голос
  rationale: В контексте публичного возвещения קוֹל означает голос; возвратное местоимение естественно при русском повелительном наклонении.
- source_word: אַל תִּירָאִי
  choice: не бойся
  rationale: Краткий и прямой русский эквивалент запретительной конструкции; женский род адресата ясен по форме глагола.
- source_word: לְעָרֵי יְהוּדָה
  choice: городам Иудеи
  rationale: Прямо сохраняет географическую отнесённость и значение предлога ל адресата речи.
- source_word: הִנֵּה
  choice: вот
  rationale: Современный и выразительный призыв обратить внимание; менее архаичен, чем «се», и уместен в торжественном возгласе.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Существительное с местоименным суффиксом относится к Богу городов Иудеи; в стихе не употреблено имя יהוה, поэтому перевод «Господь» здесь не требуется.
theological_decisions:
- issue: Синтаксическая связь מְבַשֶּׂרֶת с צִיּוֹן и יְרוּשָׁלִָם
  choice: В основном тексте обращение направлено к вестнице, несущей благую весть Сиону и Иерусалиму.
  alternative: 'Сион и Иерусалим могут пониматься как олицетворённые вестники, к которым обращены повеления: «Сион, несущий благую весть… Иерусалим, несущий благую весть…»'
  rationale: Древнееврейская конструкция допускает оба разбора. Основной текст выбирает ясную русскую синтаксическую форму, а сноски сохраняют значимую альтернативу, не превращая её в догматическое утверждение.
- issue: Передача אֱלֹהֵיכֶם
  choice: ваш Бог
  alternative: ваш Господь
  rationale: В данном стихе стоит אֱלֹהִים с суффиксом, а не имя יהוה; поэтому «Бог» точно передаёт исходное слово и не подменяет его традиционной передачей другого божественного имени.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. «Вот» выбрано вместо архаического «се»; «возвысь» сохраняет достоинство и повтор исходного текста. Женские формы «несущая» и «не бойся» передают грамматику древнееврейского обращения.
