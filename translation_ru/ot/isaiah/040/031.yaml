base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/031.yaml
  text: But those who wait for Yahweh will renew their strength[a]; they will rise up with wings like eagles; they will run and not grow weary[b]; they will walk and not faint.
translation:
  language: ru
  text: Но те, кто ждёт Яхве[a], вновь обретут силу; поднимутся на крыльях, как орлы[b]; побегут — и не утомятся, пойдут — и не изнемогут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надеются на Яхве». Еврейский глагол соединяет ожидание с уверенной надеждой.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское נשר обозначает крупную хищную птицу; обычно его переводят как «орёл», но оно может относиться и к грифу.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/קוֹיֵ
  choice: Но те, кто ждёт
  rationale: Причастие от קוה обозначает ожидание, проникнутое надеждой. «Ждёт» сохраняет конкретный образ ожидания, а союз «но» передаёт противопоставление изнемогающим юношам в предыдущем стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом «Господь».
- source_word: יַחֲלִיפוּ כֹחַ
  choice: вновь обретут силу
  rationale: Сочетание допускает смысл обновления или восстановления силы. Этот вариант естественен по-русски и не использует буквальное, но неясное «сменят силу».
- source_word: יַעֲלוּ אֵבֶר
  choice: поднимутся на крыльях
  rationale: Сохраняет направленное вверх движение глагола עלה и образ крыла или махового пера אבר.
- source_word: כַּ/נְּשָׁרִים
  choice: как орлы
  rationale: נשר обозначает крупную хищную птицу и в данном поэтическом образе традиционно и уместно передаётся словом «орлы»; более широкая зоологическая возможность отмечена в сноске.
- source_word: יָרוּצוּ וְלֹא יִיגָעוּ
  choice: побегут — и не утомятся
  rationale: Передаёт прямое значение глаголов и поэтический параллелизм обещания.
- source_word: יֵלְכוּ וְלֹא יִיעָפוּ
  choice: пойдут — и не изнемогут
  rationale: «Пойдут» сохраняет контраст с бегом, а «не изнемогут» передаёт сильное физическое истощение, выраженное יעף.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Сочетание ожидания и надежды в קוה
  choice: те, кто ждёт Яхве
  alternative: надеющиеся на Яхве
  rationale: Основной текст сохраняет образ ожидания, не устраняя присущего глаголу оттенка уверенной надежды; этот оттенок пояснён в сноске.
- issue: Значение יחליפו כח
  choice: вновь обретут силу
  alternative: обновят силу; сменят силу
  rationale: Форма может выражать обновление или замену силы. Выбранная формулировка передаёт восстановление сил, не настаивая на буквальном «обмене».
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Параллельные конструкции и тире сохраняют ритм стиха; архаизмы и конфессионально окрашенные формулы избегаются.
