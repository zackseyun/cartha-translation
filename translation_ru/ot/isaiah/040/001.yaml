source:
  edition: WLC
  text: נַחֲמ֥וּ נַחֲמ֖וּ עַמִּ֑/י יֹאמַ֖ר אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/001.yaml
  text: Comfort[a], comfort my people[b], says your God.
translation:
  language: ru
  text: «Утешайте[a], утешайте мой народ, — говорит[b] ваш Бог».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Утешьте, утешьте мой народ».'
    reason: 'Лексико-аспектуальная альтернатива: еврейское повеление допускает по-русски как продолжительный призыв «утешайте», так и более цельное «утешьте».'
  - marker: b
    text: 'Буквально: «скажет».'
    reason: Морфологически יֹאמַר — форма несовершенного вида, часто передаваемая будущим временем; здесь она вводит пророческую речь и потому переведена настоящим временем.
lexical_decisions:
- source_word: נַחֲמוּ
  choice: утешайте
  rationale: Форма Piel, повелительное наклонение, множественное число, призывает дать утешение. «Утешайте» естественно передаёт продолжительный призыв, не добавляя не названных в тексте средств утешения.
- source_word: נַחֲמוּ נַחֲמוּ
  choice: утешайте, утешайте
  rationale: Повтор сохранён, чтобы передать настойчивость, торжественность и выразительность еврейской речи.
- source_word: עַמִּי
  choice: мой народ
  rationale: Слово עַם обозначает народ как общность; притяжательное местоимение сохраняет выраженную в тексте принадлежность и заветное звучание.
- source_word: יֹאמַר
  choice: говорит
  rationale: Хотя форма глагола морфологически может передаваться как «скажет», в пророческой речи она служит введением слов Бога. Настоящее время «говорит» естественно выполняет эту функцию по-русски; буквальная временная форма отмечена в сноске.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: אֱלֹהִים имеет форму множественного числа, но здесь обозначает единого Бога Израиля; суффикс второго лица множественного числа передан словом «ваш».
theological_decisions:
- issue: Источник повеления и заветное обращение
  choice: 'Слова представлены как исходящее от Бога повеление: «говорит ваш Бог»; сочетание «мой народ» и «ваш Бог» сохранено без пояснения, кому именно поручено утешать.'
  alternative: «скажет ваш Бог», с более явным оттенком будущего времени
  rationale: Так сохраняются одновременно нежность восстановленных отношений Бога с народом и неопределённость адресатов повеления. Перевод не вводит в текст конкретных посредников.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Повтор повеления сохранён. Местоимения, относящиеся к Богу, даны со строчной буквы согласно общей современной орфографической норме; кавычки и тире ясно оформляют прямую речь.
