id: ISA.40.6
reference: Isaiah 40:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: ק֚וֹל אֹמֵ֣ר קְרָ֔א וְ/אָמַ֖ר מָ֣ה אֶקְרָ֑א כָּל הַ/בָּשָׂ֣ר חָצִ֔יר וְ/כָל חַסְדּ֖/וֹ כְּ/צִ֥יץ הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/006.yaml
  text: A voice says[a], “Cry out!” And I said, “What shall I cry?” All flesh is grass[c][b], and all its loveliness is like the flower of the field.
translation:
  language: ru
  text: 'Голос говорит[a]: «Возгласи!» И я сказал: «Что мне возгласить?» Всякая плоть — трава[b], и вся её краса[c] — как полевой цветок.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно другому традиционному прочтению: «И некто сказал» или «И он сказал».'
    reason: alternative_reading
  - marker: b
    text: «Всякая плоть» — буквальное выражение, означающее всё человечество, всех людей.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «всё её великолепие». Еврейское слово здесь может обозначать то, что в человеке прекрасно, славно или достойно восхищения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל אֹמֵר
  choice: Голос говорит
  rationale: קוֹל здесь естественно означает неопределённый голос, а причастие אֹמֵר передаёт живое, продолжающееся или актуальное говорение.
- source_word: קְרָא / אֶקְרָא
  choice: Возгласи / возгласить
  rationale: Повтор одного русского корня сохраняет повтор еврейского קרא и передаёт публичный, настойчивый характер призыва.
- source_word: וְאָמַר
  choice: И я сказал
  rationale: Основной текст следует масоретской огласовке первого лица; значимое традиционное чтение в третьем лице вынесено в примечание.
- source_word: כָּל הַבָּשָׂר
  choice: Всякая плоть
  rationale: Буквальный образ обозначает всё смертное человечество и сохраняет противопоставление плоти и быстро увядающей травы.
- source_word: חָצִיר
  choice: трава
  rationale: Обычное и ясное обозначение травы или зелени в образе человеческой бренности.
- source_word: חַסְדּוֹ
  choice: вся её краса
  rationale: Хотя חֶסֶד часто означает верность или преданную любовь, здесь параллелизм с полевым цветком указывает на привлекательность, достоинство или великолепие человека; «краса» кратко сохраняет широту образа.
- source_word: כְּצִיץ הַשָּׂדֶה
  choice: как полевой цветок
  rationale: Естественная русская передача родового образа недолговечного дикого цветка.
theological_decisions:
- issue: Кто отвечает голосу в וְאָמַר
  choice: 'Первое лицо: «И я сказал»'
  alternative: «И некто сказал» или «И он сказал»
  rationale: Масоретская огласовка поддерживает первое лицо, однако согласный текст допускает традиционное чтение в третьем лице; неопределённость сохранена в примечании.
- issue: Значение חַסְדּוֹ применительно ко всякой плоти
  choice: «вся её краса»
  alternative: «всё её великолепие»; буквально возможно значение «её верность/преданная любовь»
  rationale: Контекст увядающей травы и цветка говорит о преходящем человеческом достоинстве или привлекательности. Перевод не вносит сюда без необходимости заветное значение термина, но отмечает семантическую широту.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной пророческой интонацией. «Возгласи» и «всякая плоть» сохраняют библейскую образность без архаической перегруженности; синтаксис краток и пригоден для публичного чтения.
