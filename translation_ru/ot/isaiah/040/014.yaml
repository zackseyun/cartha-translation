id: ISA.40.14
reference: Isaiah 40:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֶת מִ֤י נוֹעָץ֙ וַ/יְבִינֵ֔/הוּ וַֽ/יְלַמְּדֵ֖/הוּ בְּ/אֹ֣רַח מִשְׁפָּ֑ט וַ/יְלַמְּדֵ֣/הוּ דַ֔עַת וְ/דֶ֥רֶךְ תְּבוּנ֖וֹת יוֹדִיעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/014.yaml
  text: Whom did he consult[a], and who gave him understanding? Who taught him the path of justice, taught him knowledge[b], and made known to him the way of understanding?
translation:
  language: ru
  text: С кем он советовался, и кто вразумил его? Кто наставил его на путь правосудия[a], научил его знанию и указал ему путь разумения[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на путь суда»; возможно также: «на путь справедливости».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «путь проницательности» или «путь рассудительности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי נוֹעָץ
  choice: С кем он советовался
  rationale: Нифаль глагола יעץ означает искать или принимать совет. Хотя אֶת обычно служит показателем прямого дополнения, при этом глаголе вопрос естественно передаётся по-русски творительным оборотом «с кем советовался».
- source_word: וַיְבִינֵהוּ
  choice: и кто вразумил его
  rationale: Каузативная форма בין значит «дать понять, сделать понимающим». «Вразумил» кратко и естественно сохраняет этот смысл и высокий, но современно понятный регистр.
- source_word: וַיְלַמְּדֵהוּ
  choice: наставил его / научил его
  rationale: 'Обе формы одного глагола למד переданы близкими русскими глаголами с учётом разных дополнений: «наставил на путь» естественно сочетается с образом пути, а «научил знанию» сохраняет повтор еврейского глагола на смысловом уровне без тяжеловесного русского повтора.'
- source_word: בְּאֹרַח מִשְׁפָּט
  choice: на путь правосудия
  rationale: אֹרַח — «путь, стезя», а מִשְׁפָּט охватывает суд, правосудие и справедливое решение. «Путь правосудия» сохраняет судебно-нормативный оттенок и метафору пути.
- source_word: דַעַת
  choice: знанию
  rationale: דַעַת прямо обозначает знание; этот выбор сохраняет отличие от слов корня בין, связанных с пониманием и разумением.
- source_word: וְדֶרֶךְ תְּבוּנוֹת
  choice: путь разумения
  rationale: דֶרֶךְ параллельно אֹרַח означает «путь». Множественная абстрактная форма תְּבוּנוֹת выражает разумение, проницательность или способность различать; «разумение» сохраняет мудростный регистр и параллелизм.
- source_word: יוֹדִיעֶנּוּ
  choice: указал ему
  rationale: Каузатив ידע буквально означает «дал узнать, сообщил». В сочетании с «путём» русское «указал ему путь» естественно выражает сообщение и направление, не меняя риторического смысла.
theological_decisions:
- issue: К кому относятся местоимения третьего лица
  choice: Местоимения сохранены; из контекста Ис 40:13–14 ясно, что речь о Господе.
  alternative: Вставить в стих имя «Господь» или слово «Бог».
  rationale: Еврейский текст этого стиха не повторяет Божьего имени. Сохранение местоимений передаёт форму оригинала и позволяет ближайшему контексту определить референта.
- issue: Значение מִשְׁפָּט
  choice: правосудие
  alternative: суд; справедливость
  rationale: Слово допускает судебное решение, суд и справедливый порядок. «Правосудие» удерживает как судебный, так и нормативный аспект; другие реальные оттенки отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторические вопросы и параллелизм сохранены. «Правосудие» и «разумение» поддерживают мудростный регистр, оставаясь понятными современному читателю; допустимые смысловые альтернативы вынесены в сноски.
