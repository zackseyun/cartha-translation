source:
  edition: WLC
  text: שְׂאוּ מָר֨וֹם עֵינֵי/כֶ֤ם וּ/רְאוּ֙ מִי בָרָ֣א אֵ֔לֶּה הַ/מּוֹצִ֥יא בְ/מִסְפָּ֖ר צְבָאָ֑/ם לְ/כֻלָּ/ם֙ בְּ/שֵׁ֣ם יִקְרָ֔א מֵ/רֹ֤ב אוֹנִים֙ וְ/אַמִּ֣יץ כֹּ֔חַ אִ֖ישׁ לֹ֥א נֶעְדָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/026.yaml
  text: 'Lift up your eyes on high and see: who created these? He who brings out their host by number[a], calling all of them by name. Because of the greatness of his might and the strength of his power[c][b], not one is missing.'
translation:
  language: ru
  text: 'Поднимите глаза ввысь и посмотрите: кто сотворил это? Тот, кто выводит их воинство[b] по счёту и всех их называет по имени[a]. Благодаря Его великой мощи и могучей силе ни один не пропадает[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «каждого из них называет по имени».'
    reason: 'לְכֻלָּם допускает естественную распределительную передачу: действие относится к каждому члену множества.'
  - marker: b
    text: «Воинство» — упорядоченное множество небесных светил.
    reason: Культурно-образная пояснительная заметка к צְבָאָם без замены исходного образа в основном тексте.
  - marker: c
    text: 'Буквально: «ни один человек не оказывается недостающим»; это еврейское распределительное выражение означает, что ни один из них не пропадает и не отсутствует.'
    reason: Поясняет буквальное значение אִישׁ, его распределительное употребление в контексте и значение נֶעְדָּר.
lexical_decisions:
- source_word: שְׂאוּ מָרוֹם עֵינֵיכֶם
  choice: Поднимите глаза к небу
  rationale: Передаёт повеление буквально по смыслу и естественно по-русски; מָרוֹם здесь указывает вверх, к небесной высоте.
- source_word: וּרְאוּ
  choice: и посмотрите
  rationale: Естественно продолжает призыв поднять глаза и вводит риторический вопрос.
- source_word: מִי בָרָא אֵלֶּה
  choice: кто сотворил всё это?
  rationale: Указательное אֵלֶּה сохранено без вставки слова «звёзды»; русское «всё это» естественно указывает на видимое в вышине множество.
- source_word: הַמּוֹצִיא
  choice: Тот, кто выводит
  rationale: Субстантивированное причастие выражено ясной русской конструкцией, которая служит ответом на предшествующий вопрос.
- source_word: בְמִסְפָּר צְבָאָם
  choice: выводит их воинство по счёту
  rationale: Сохраняются собирательный образ צָבָא и идея упорядоченного исчисления в בְמִסְפָּר.
- source_word: לְכֻלָּם בְּשֵׁם יִקְרָא
  choice: всех их называет по имени
  rationale: Близко передаёт всеобщность לְכֻלָּם и единственное число בְּשֵׁם; альтернативное распределительное понимание отмечено в сноске.
- source_word: מֵרֹב אוֹנִים וְאַמִּיץ כֹּחַ
  choice: Благодаря Его великой мощи и могучей силе
  rationale: מִן понято причинно; две близкие характеристики силы переданы параллельными русскими выражениями без устранения их смыслового усиления.
- source_word: אִישׁ לֹא נֶעְדָּר
  choice: ни один не отсутствует
  rationale: אִישׁ имеет распределительное значение применительно к членам небесного воинства, а не обозначает мужчину; перевод сохраняет также буквальный оттенок отсутствия.
theological_decisions:
- issue: К чему относятся «это» и «их воинство»
  choice: К видимому небесному множеству, прежде всего к небесным светилам, без прямой вставки слова «звёзды» в основной текст.
  alternative: Понимать выражение шире — как все видимые небесные явления.
  rationale: Призыв посмотреть к небу, а также образы исчисленного и названного воинства наиболее естественно указывают на светила. Однако еврейский текст не называет звёзды прямо, поэтому его образная широта сохранена.
- issue: Причина того, что никто не отсутствует
  choice: Связать это с великой мощью и силой Творца.
  alternative: Передать מִן менее определённо как «от/из-за изобилия мощи».
  rationale: В данном контексте причинное значение предлога מִן наиболее связно, но перевод не добавляет объяснения того, каким именно образом Божья сила поддерживает небесное воинство.
- issue: Распределительное значение אִישׁ
  choice: «ни один не отсутствует»
  alternative: 'Буквально: «ни один муж не отсутствует».'
  rationale: Здесь слово אִישׁ распределяет утверждение на каждого члена воинства и не указывает на человеческий пол; буквальный русизм исказил бы референцию.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Сохранены риторический вопрос, образ небесного воинства и параллелизм слов о силе; архаизмы и конфессионально окрашенные добавления не используются.
