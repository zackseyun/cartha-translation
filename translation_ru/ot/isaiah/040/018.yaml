id: ISA.40.18
reference: Isaiah 40:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אֶל מִ֖י תְּדַמְּי֣וּ/ן אֵ֑ל וּ/מַה דְּמ֖וּת תַּ֥עַרְכוּ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/018.yaml
  text: To whom[a], then, will you liken God, and what likeness will you compare to him?
translation:
  language: ru
  text: Итак, кому вы уподобите Бога[a] и какое подобие поставите рядом с Ним?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И кому вы уподобите Бога и какой образ сопоставите с Ним?»'
    reason: Лексически возможная передача וְ как «и», דְּמוּת как «образ» и תַּעַרְכוּ לֽוֹ как «сопоставите с Ним».
lexical_decisions:
- source_word: וְ/אֶל מִי
  choice: Итак, кому
  rationale: Предлог אֶל при מִי обозначает объект сопоставления — «кому». Союз וְ в развитии риторической мысли естественно передан переходным «итак», хотя возможно и буквальное «и».
- source_word: תְּדַמְּיוּן
  choice: вы уподобите
  rationale: Глагол דמה означает «уподоблять, сравнивать». «Уподобите» сохраняет образность и риторическую силу вопроса.
- source_word: אֵל
  choice: Бога
  rationale: В контексте Ис 40 слово אֵל обозначает Бога, противопоставленного идолам, а не неопределённое божество.
- source_word: דְּמוּת
  choice: подобие
  rationale: דְּמוּת означает подобие, сходство или образ. «Подобие» непосредственно передаёт значение и сохраняет связь с глаголом «уподобите».
- source_word: תַּעַרְכוּ לֽוֹ
  choice: поставите рядом с Ним
  rationale: Корень ערך может означать «располагать, выставлять, ставить в ряд»; с לּוֹ здесь подразумевается постановка чего-либо рядом для сопоставления. Формулировка сохраняет как сравнительный, так и конкретно-образный оттенок.
theological_decisions:
- issue: Значение אֵל в риторическом вопросе против идолопоклонства
  choice: Бога
  alternative: божество
  rationale: Ближайший контекст говорит о несравнимости единого Бога с рукотворными образами. Определённое «Бога» передаёт контекстуальный смысл без добавления конфессиональной терминологии.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой риторики. Параллелизм двух вопросов сохранён; формулировка понятна широкому читателю и не устраняет многозначность образа, который можно и мысленно сопоставить, и буквально поставить рядом.
