  text: הֲ/ל֨וֹא יָדַ֜עְתָּ אִם לֹ֣א שָׁמַ֗עְתָּ אֱלֹהֵ֨י עוֹלָ֤ם יְהוָה֙ בּוֹרֵא֙ קְצ֣וֹת הָ/אָ֔רֶץ לֹ֥א יִיעַ֖ף וְ/לֹ֣א יִיגָ֑ע אֵ֥ין חֵ֖קֶר לִ/תְבוּנָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/028.yaml
  text: Have you not known? Have you not heard? Yahweh is the everlasting God[a], the Creator of the ends of the earth. He does not grow faint or become weary; his understanding is unsearchable.
translation:
  language: ru
  text: Разве ты не знаешь? Разве ты не слышал? Яхве[a] — вечный Бог, Творец пределов земли. Он не изнемогает и не устаёт; Его разум неисследим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH; передаётся как «Яхве».
    reason: Уточнение еврейской формы личного Божьего имени и его передачи в переводе.
lexical_decisions:
- source_word: הֲלוֹא יָדַעְתָּ
  choice: Разве ты не знаешь?
  rationale: Риторический вопрос предполагает утвердительный ответ и напоминает адресату о том, что ему уже должно быть известно. Единственное число сохранено.
- source_word: אִם לֹא שָׁמַעְתָּ
  choice: Разве ты не слышал?
  rationale: В данном параллелизме выражение функционирует как второй риторический вопрос, а не как условное придаточное.
- source_word: אֱלֹהֵי עוֹלָם
  choice: вечный Бог
  rationale: Конструкцию «Бог вечности» естественно передаёт определение «вечный», сохраняющее смысл непреходящего бытия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, обозначенное тетраграмматоном, а не заменяющий его титул.
- source_word: בּוֹרֵא
  choice: Творец
  rationale: Причастие употреблено субстантивированно и в приложении к имени Яхве; «Творец» естественно выражает эту идентифицирующую характеристику.
- source_word: קְצוֹת הָאָרֶץ
  choice: краёв земли
  rationale: Сохранён пространственный образ самых дальних пределов земли; «края земли» звучит естественно по-русски.
- source_word: לֹא יִיעַף
  choice: не изнемогает
  rationale: Глагол обозначает ослабление, изнеможение от истощения.
- source_word: וְלֹא יִיגָע
  choice: и не устаёт
  rationale: Глагол выражает утомление от труда; пара «не изнемогает и не устаёт» сохраняет близкий, но не полностью тождественный смысл двух еврейских глаголов.
- source_word: אֵין חֵקֶר לִתְבוּנָתוֹ
  choice: Его разум неисследим
  rationale: Буквально речь идёт о том, что Божьему разумению нет исследования или постижимого предела; краткая формулировка сохраняет смысл непостижимости.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя YHWH. Транслитерация сохраняет отличие имени от титула, а традиционная замена указана в примечании.
- issue: Смысл неисследимости Божьего разумения
  choice: Его разум неисследим
  alternative: Его разумению нет исследования
  rationale: Выбрана естественная русская формулировка без уточнения причины или объёма этой неисследимости, чтобы не снимать богословское напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторические вопросы, параллелизм и краткая завершающая формула сохранены; архаизмы и конфессионально маркированные добавления не использованы.
