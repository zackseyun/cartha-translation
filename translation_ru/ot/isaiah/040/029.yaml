  variant: modern literary Russian
source:
  edition: WLC
  text: נֹתֵ֥ן לַ/יָּעֵ֖ף כֹּ֑חַ וּ/לְ/אֵ֥ין אוֹנִ֖ים עָצְמָ֥ה יַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/029.yaml
  text: He gives strength to the weary[a], and to the one without vigor he increases might.
translation:
  language: ru
  text: Он даёт силу утомлённому[a] и умножает мощь тому, у кого нет сил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изнемогающему».'
    reason: Еврейское יָעֵף может обозначать как утомлённого, так и изнемогающего, выбившегося из сил человека.
lexical_decisions:
- source_word: נֹתֵן
  choice: даёт
  rationale: Причастие породы qal в данном контексте выражает постоянное, характерное действие Бога; настоящее время естественно передаёт этот обобщённый смысл.
- source_word: לַיָּעֵף
  choice: утомлённому
  rationale: Слово обозначает изнурённого, выбившегося из сил человека. «Утомлённому» понятно современному читателю и сохраняет образ усталости.
- source_word: כֹּחַ
  choice: силу
  rationale: Здесь речь идёт о личной способности и жизненных силах, которых недостаёт утомлённому.
- source_word: וּלְאֵין אוֹנִים
  choice: тому, у кого нет сил
  rationale: Конструкция אֵין выражает отсутствие, а אוֹנִים — силу или жизненную энергию. Русская конструкция естественно передаёт состояние полного бессилия.
- source_word: עָצְמָה
  choice: мощь
  rationale: Существительное означает мощь, силу. Выбор «мощь» сохраняет поэтический параллелизм и различие с כֹּחַ.
- source_word: יַרְבֶּה
  choice: умножает
  rationale: Hiphil от רבה означает «делать многочисленным, увеличивать». «Умножает» сохраняет каузативность и поэтическую выразительность оригинала.
theological_decisions:
- issue: Неявно выраженное подлежащее
  choice: «Он» относится к Богу, о котором говорится в ближайшем контексте.
  alternative: Не называть подлежащее явно, что по-русски сделало бы фразу неполной или потребовало бы перестройки.
  rationale: В еврейском стихе подлежащее не названо, но контекст однозначно продолжает описание действий Господа. Русское местоимение необходимо для естественного синтаксиса и не добавляет нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным поэтическим строем. Сохранены параллельные части стиха и смысловое различие между כֹּחַ («сила») и עָצְמָה («мощь»).
