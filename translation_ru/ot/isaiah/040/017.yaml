  - severity: low
    issue: Сноска содержит неестественный для современного русского вариант «безвидность»
    rationale: Это архаизирующее, контекстуально неточное слово; для תֹהוּ здесь более понятны «запустение» или «хаос», при основном переводе «пустота».
