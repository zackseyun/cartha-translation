base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/017.yaml
  text: All the nations are as nothing before him[a]; they are regarded by him as less than nothing and emptiness.
translation:
  language: ru
  text: Все народы пред Ним — как ничто; в Его глазах они считаются за меньшее, чем ничто, за пустоту.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за меньшее, чем ничто, за хаос». Еврейское תֹהוּ может также означать запустение или хаос.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  choice: Все народы
  rationale: Коллективное выражение охватывает совокупность народов; перевод не сужает значение до этнически или конфессионально окрашенного обозначения.
- source_word: כְּאַיִן
  choice: как ничто
  rationale: Сохраняется сравнительная частица כְּ и образ полного ничтожества.
- source_word: נֶגְדּוֹ
  choice: пред Ним
  rationale: Краткое литературное выражение передаёт как нахождение перед Богом, так и подразумеваемое сопоставление с Ним.
- source_word: מֵאֶפֶס
  choice: меньше ничтожества
  rationale: Предлог מִן понят сравнительно; формулировка сохраняет риторическое усиление после «как ничто».
- source_word: וָתֹהוּ
  choice: и пустоты
  rationale: תֹהוּ обозначает пустоту, тщету, безвидность или хаос; в параллелизме здесь естественно звучит «пустота», при этом альтернативный оттенок отмечен в сноске.
- source_word: נֶחְשְׁבוּ לוֹ
  choice: считаются они у Него
  rationale: Нифаль глагола חשׁב передаёт значение «считаться, почитаться»; לוֹ указывает, в чьей оценке это так, без превращения образа в объективное метафизическое утверждение.
theological_decisions:
- issue: Степень отрицания во второй части стиха
  choice: «меньше ничтожества и пустоты» как усиленное сопоставление
  alternative: «за ничто и хаос» или «ничтожнее пустоты»
  rationale: Нагромождение слов со значением отсутствия и пустоты подчёркивает несравнимое величие Бога, но перевод не делает дополнительного утверждения о буквальном небытии народов.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. «Пред Ним» и инверсия «считаются они» сохраняют достоинство и параллелизм, оставаясь понятными современному читателю.
