  source_fidelity: 'Первая часть передана точно: «Все народы пред Ним — как ничто» сохраняет כָּל הַגּוֹיִם, сравнительное כְּאַיִן и נֶגְדּוֹ. Во второй части «меньше ничтожества и пустоты» синтаксически может ошибочно прочитываться как сравнение народов с «пустотой», тогда как מֵאֶפֶס וָתֹהוּ — два однородных обозначения крайней незначительности, при которых они «считаются» в Божьей оценке.'
  naturalness: «Меньше ничтожества и пустоты считаются они у Него» тяжеловесно и неоднозначно для современного литературного русского. Оборот «в Его глазах» естественно передаёт לֹו в конструкции оценки, а «за ничто, за пустоту» ясно связывает оба существительных с глаголом «считаться».
  terminology: «Народы», «ничто» и «пустота» уместны. «Пред Ним» допустимо в умеренно возвышенном библейском регистре. В сноске «безвидность» не является удачным современным лексическим соответствием תֹהוּ в данном контексте; следует оставить релевантные варианты «запустение» и «хаос».
