  text: Who has measured the Spirit of Yahweh[b][a], or what man has made his counsel known to him?
translation:
  language: ru
  text: Кто измерил Дух Яхве[a], и какой человек сообщил Ему Его замысел?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разум Яхве». Еврейское слово רוּחַ может означать дух, дыхание, ветер или внутренний настрой, разум; древнегреческий перевод, отражённый в Рим 11:34, передаёт здесь «разум» (букв. «ум»).'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально глагол означает «дал Ему знать», «сообщил Ему». Сочетание перед ним также традиционно понимают как «кто был Его советником»; в таком случае смысл: «кто мог наставить Его?» Древнегреческая традиция передаёт: «Кто познал разум Господа? Или кто был Его советником?»'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי תִכֵּן
  choice: Кто измерил
  rationale: תכן прежде всего связано с измерением, взвешиванием и определением меры; «измерил» сохраняет конкретный образ и связь с ближайшим контекстом Ис 40.
- source_word: רוּחַ יְהוָה
  choice: Дух Яхве
  rationale: רוּחַ допускает значения «дух», «дыхание» и «внутренний настрой/ум»; в сочетании с личным именем Бога основной перевод «Дух Яхве» сохраняет смысловую открытость и богословскую весомость выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста, не заменяя её титулом «Господь».
- source_word: וְאִישׁ עֲצָתוֹ
  choice: и кто, став Его советником
  rationale: Буквально сочетание может пониматься как «и человек Его совета/советник Его»; по-русски естественная предикативная конструкция передаёт мысль о человеке, способном быть Божьим советником.
- source_word: יוֹדִיעֶנּוּ
  choice: мог бы наставить Его
  rationale: Hiphil ידע буквально означает «дать знать, сообщить». В связи с «советником» контекстуальный смысл — сообщить Богу знание, то есть наставить Его; модальная форма передаёт риторический характер вопроса, не утверждая наличие такого человека.
theological_decisions:
- issue: Значение רוּחַ יְהוָה
  choice: Дух Яхве
  alternative: разум Яхве
  rationale: Основной текст сохраняет обычное значение «Дух», а примечание отмечает лексически возможное «разум», отражённое греческой традицией и Рим 11:34.
- issue: Синтаксис второй строки
  choice: кто, став Его советником, мог бы наставить Его?
  alternative: какой человек сообщил Ему Его замысел?
  rationale: 'Масоретская пунктуация и традиционное понимание допускают конструкцию «человек Его совета/Его советник». Выбранный перевод естественен по-русски и сохраняет риторическую мысль: никто не способен советовать или преподавать знание Богу; более буквальная синтаксическая возможность указана в примечании.'
- issue: Соотношение с греческой традицией и Рим 11:34
  choice: не подгонять основной текст под цитатную форму
  alternative: Кто познал разум Господа? Или кто был советником Ему?
  rationale: Перевод исходит прежде всего из еврейского текста WLC, а отличие древнегреческой формы отмечает в примечаниях.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. Риторический параллелизм сохранён; личное имя Яхве передано прямо. Заглавные местоимения «Его» использованы последовательно в отношении Бога.
