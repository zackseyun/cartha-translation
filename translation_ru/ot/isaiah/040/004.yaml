source:
  edition: WLC
  text: כָּל גֶּיא֙ יִנָּשֵׂ֔א וְ/כָל הַ֥ר וְ/גִבְעָ֖ה יִשְׁפָּ֑לוּ וְ/הָיָ֤ה הֶֽ/עָקֹב֙ לְ/מִישׁ֔וֹר וְ/הָ/רְכָסִ֖ים לְ/בִקְעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/004.yaml
  text: Every valley will be lifted up[a], and every mountain and hill will be made low; the uneven ground will become level[b], and the ridges a plain.
translation:
  language: ru
  text: Всякая долина поднимется, и всякая гора и холм понизятся; неровная местность[a] станет ровной, а горные гряды[b] — равниной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «извилистая местность»; еврейское слово может обозначать кривое, извилистое или неровное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пересечённая местность»; редкое еврейское существительное может иметь более общее значение и обозначать неровный, изрезанный рельеф.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּיא
  choice: долина
  rationale: Слово обозначает долину или ущелье. «Долина» естественно передаёт широкий смысл и создаёт ясный контраст с горой и холмом.
- source_word: יִנָּשֵׂא
  choice: поднимется
  rationale: Нифаль глагола נשׂא здесь описывает повышение долины. Русская возвратная форма естественно передаёт результат преобразования местности, не уточняя названного деятеля.
- source_word: הַר וְגִבְעָה
  choice: гора и холм
  rationale: Обычные и точные соответствия двум видам возвышенности; сохраняют поэтическую пару исходного текста.
- source_word: יִשְׁפָּלוּ
  choice: понизятся
  rationale: Глагол שׁפל означает стать низким или быть пониженным. «Понизятся» сохраняет параллель с «поднимется» и конкретную топографическую образность.
- source_word: הֶעָקֹב
  choice: неровная местность
  rationale: Слово может обозначать кривое, извилистое или неровное. В контексте приготовления пути речь естественно понимается как характеристика местности; неоднозначность отмечена в сноске.
- source_word: לְמִישׁוֹר
  choice: станет ровной
  rationale: מִישׁוֹר обозначает ровное место или равнину. Прилагательное «ровной» образует прямой и естественный контраст с «неровной местностью».
- source_word: הָרְכָסִים
  choice: горные гряды
  rationale: Редкое существительное, вероятно, обозначает гряды либо вообще пересечённую, изрезанную местность. «Горные гряды» сохраняет конкретную топографическую образность; более общее значение вынесено в сноску.
- source_word: לְבִקְעָה
  choice: равниной
  rationale: בִקְעָה — широкая долина или равнина. «Равниной» хорошо передаёт итог преобразования гряд и не повторяет ранее употреблённое слово «долина».
theological_decisions:
- issue: Характер образа
  choice: Передать физическое преобразование ландшафта, не включая его богословское истолкование непосредственно в формулировку стиха.
  alternative: Увидеть здесь метафорическое возвышение униженных и смирение гордых либо эсхатологическое приготовление к пришествию Господа.
  rationale: Еврейский текст непосредственно рисует изменение местности при приготовлении пути. Метафорические и эсхатологические смыслы возможны в контексте и истории восприятия, но перевод должен сохранить конкретный образ и не предрешать его толкование.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным библейским звучанием. Синтаксический параллелизм и конкретные образы ландшафта сохранены; архаизмы и конфессионально окрашенные толкования не вводятся.
