  yaml_path: translation/ot/isaiah/040/019.yaml
  text: As for the idol, a craftsman casts it, and a goldsmith overlays it with gold and forges silver chains for it.
translation:
  language: ru
  text: Идола отливает ремесленник; золотых дел мастер покрывает его золотом и изготовляет для него серебряные цепи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפֶּסֶל
  choice: идола
  rationale: Слово обозначает изваяние, служащее предметом поклонения; «идол» ясно передаёт смысл в данном полемическом контексте.
- source_word: נָסַךְ
  choice: отливает
  rationale: Глагол здесь описывает изготовление металлического изображения посредством литья.
- source_word: חָרָשׁ
  choice: мастер
  rationale: Общее обозначение умелого ремесленника; материал и вид работы уточняются глаголом.
- source_word: צֹרֵף
  choice: золотых дел мастер
  rationale: Название мастера, работающего с драгоценными металлами; традиционное русское выражение естественно в этом контексте.
- source_word: יְרַקְּעֶנּוּ
  choice: покрывает его золотом
  rationale: Буквально связано с расплющиванием или расковкой металла; по контексту речь идёт об облицовке изображения золотом.
- source_word: וּרְתֻקוֹת כֶּסֶף צוֹרֵף
  choice: и выковывает для него серебряные цепочки
  rationale: Передаёт изготовление серебряных цепочек для идола; «выковывает» сохраняет ремесленный характер действия, не сужая его до очистки металла.
theological_decisions:
- issue: Характер изображения
  choice: идол
  alternative: изваяние
  rationale: Контекст противопоставляет рукотворный предмет Богу; «идол» передаёт культовую функцию, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет риторическую краткость и последовательность действий еврейского текста. Повтор слова «мастер» отражает различие между общим ремесленником и специалистом по драгоценным металлам.
