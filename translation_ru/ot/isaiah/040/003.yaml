  text: ק֣וֹל קוֹרֵ֔א בַּ/מִּדְבָּ֕ר פַּנּ֖וּ דֶּ֣רֶךְ יְהוָ֑ה יַשְּׁרוּ֙ בָּ/עֲרָבָ֔ה מְסִלָּ֖ה לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/003.yaml
  text: 'A voice cries: “In the wilderness prepare the way of Yahweh[a]; make straight in the desert a highway for our God.”'
translation:
  language: ru
  text: 'Голос взывает[a]:


    «В пустыне приготовьте путь Яхве,


    проложите в пустынной степи прямую дорогу для нашего Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при иной синтаксической связи: «Голос взывает в пустыне: „Приготовьте путь Яхве, проложите в пустынной степи прямую дорогу для нашего Бога“».'
    reason: 'Альтернативное прочтение: оборот «в пустыне» можно связать либо со следующим повелением, как в масоретской акцентуации, либо с возглашением голоса.'
lexical_decisions:
- source_word: ק֣וֹל קוֹרֵ֔א
  choice: Голос возглашает
  rationale: Сочетание буквально означает «голос зовущего / голос зовёт». Русское «голос возглашает» естественно передаёт образ глашатая и сохраняет яркую провозгласительную силу причастия קוֹרֵא.
- source_word: בַּמִּדְבָּר
  choice: В пустыне
  rationale: מִדְבָּר обозначает пустынную, необитаемую местность. Согласно масоретской акцентуации, оборот в основном тексте отнесён к следующему повелению, а не к глаголу «возглашает»; другая возможная синтаксическая связь дана в сноске.
- source_word: פַּנּוּ דֶּרֶךְ
  choice: приготовьте путь
  rationale: В контексте подготовки дороги פנה означает расчистить или подготовить путь. «Приготовьте путь» сохраняет дорожный образ и торжественный характер обращения, оставаясь понятным современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией «Яхве», а не заменено титулом «Господь».
- source_word: יַשְּׁרוּ ... מְסִלָּה
  choice: проложите ... прямую дорогу
  rationale: יַשְּׁרוּ призывает сделать дорогу прямой или ровной, а מְסִלָּה обозначает специально устроенную дорогу. Цельное русское выражение «проложите прямую дорогу» естественно передаёт оба элемента и образ подготовки пути для царского шествия.
- source_word: בָּעֲרָבָה
  choice: в степи
  rationale: עֲרָבָה — сухая равнина, пустынная степь. «В степи» отличает этот термин от предшествующего מִדְבָּר и сохраняет параллелизм без искусственного повторения слова «пустыня».
- source_word: לֵאלֹהֵינוּ
  choice: для нашего Бога
  rationale: Хотя אֱלֹהִים имеет морфологически множественную форму, здесь это обычное единственное обозначение Бога Израиля с суффиксом первого лица множественного числа.
theological_decisions:
- issue: Синтаксическая связь выражения «в пустыне»
  choice: 'Отнести «в пустыне» к повелению: «В пустыне приготовьте путь Яхве»'
  alternative: 'Отнести выражение к глашатаю: «Голос возглашает в пустыне: „Приготовьте путь Яхве“»'
  rationale: Масоретская акцентуация отделяет קוֹרֵא от בַּמִּדְבָּר и тем самым поддерживает основной вариант. Однако согласный еврейский текст допускает иную синтаксическую связь, известную также по новозаветному цитированию, поэтому она сохранена в сноске.
- issue: Передача тетраграмматона יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное Божье имя в исходном тексте и не подменяет его титулом; при этом не вводится дополнительное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Лексика общепонятна; архаизмы вроде «стезя» и тяжеловесные буквальные конструкции устранены. Параллелизм двух строк и дорожный образ исходного текста сохранены.
