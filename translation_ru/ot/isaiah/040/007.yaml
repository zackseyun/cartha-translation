id: ISA.40.7
reference: Isaiah 40:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יָבֵ֤שׁ חָצִיר֙ נָ֣בֵֽל צִ֔יץ כִּ֛י ר֥וּחַ יְהוָ֖ה נָ֣שְׁבָה בּ֑/וֹ אָכֵ֥ן חָצִ֖יר הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/007.yaml
  text: The grass dries up[a], the flower withers, because the breath of Yahweh blows on it; surely the people are grass.
translation:
  language: ru
  text: Засыхает трава, увядает цветок, потому что дыхание Яхве веет на него[a]. Воистину, народ — трава.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветер Яхве дует на него»; менее вероятно здесь: «Дух Яхве веет на него».'
    reason: Слово רוּחַ может означать «дыхание», «ветер» или «дух», а глагол נָשְׁבָה — «дуть, веять».
lexical_decisions:
- source_word: יָבֵשׁ
  choice: засыхает
  rationale: Qal-перфект описывает высыхание растительности; настоящее время естественно передаёт поэтическое обобщение и согласуется с последующими формами.
- source_word: חָצִיר
  choice: трава
  rationale: Обычное значение слова в этом образе бренности; оно также сохраняет метафору, прямо раскрытую в конце стиха.
- source_word: נָבֵל
  choice: увядает
  rationale: Глагол обозначает увядание или потерю свежести; это естественное русское сочетание со словом «цветок».
- source_word: צִיץ
  choice: цветок
  rationale: В контексте травы и её недолговечности это ясный и привычный русский эквивалент.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину засыхания и увядания.
- source_word: רוּחַ
  choice: дыхание
  rationale: Слово допускает значения «дыхание», «ветер» и «дух». В основном тексте «дыхание» сохраняет личностный образ действия Яхве, а реальная лексическая неоднозначность отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем, а не замена его титулом, соответствует форме исходного текста.
- source_word: נָשְׁבָה
  choice: веет
  rationale: Глагол означает «дуть, веять»; настоящее время подходит для афористической поэзии, а «веет» сочетается как с дыханием, так и с возможным значением «ветер».
- source_word: בּוֹ
  choice: на него
  rationale: Предлог с местоименным суффиксом естественно передаёт направленное воздействие на ближайший образ растительности; мужской род согласуется со словом «цветок», хотя образ включает и траву.
- source_word: אָכֵן
  choice: воистину
  rationale: Частица выражает сильное подтверждение или итоговый вывод; «воистину» сохраняет возвышенный поэтический акцент без архаической синтаксической тяжеловесности.
- source_word: הָעָם
  choice: народ
  rationale: Собирательное существительное с артиклем передано без неоправданного уточнения, относится ли оно здесь к конкретному народу или к людям как целому.
theological_decisions:
- issue: Значение רוּחַ יְהוָה
  choice: дыхание Яхве
  alternative: ветер Яхве; Дух Яхве
  rationale: Непосредственный образ позволяет понимать רוּחַ как дыхание или ветер, тогда как «Дух» здесь менее вероятен. Основной текст выбирает «дыхание», но сноска сохраняет подлинную неоднозначность.
- issue: Референт הָעָם
  choice: народ
  alternative: люди; человечество
  rationale: Исходный текст говорит определённо и собирательно, но сам стих не требует окончательно решать, имеется ли в виду Израиль либо человечество шире; поэтому выбран нейтральный эквивалент «народ».
translation_notes:
  register: Современный литературный русский язык с кратким, dignified поэтическим ритмом. Параллелизм двух первых строк сохранён; настоящее время передаёт обобщающий характер образа. Имя Яхве транслитерировано, а не заменено титулом.
