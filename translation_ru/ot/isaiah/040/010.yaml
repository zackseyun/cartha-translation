  text: הִנֵּ֨ה אֲדֹנָ֤/י יְהוִה֙ בְּ/חָזָ֣ק יָב֔וֹא וּ/זְרֹע֖/וֹ מֹ֣שְׁלָה ל֑/וֹ הִנֵּ֤ה שְׂכָר/וֹ֙ אִתּ֔/וֹ וּ/פְעֻלָּת֖/וֹ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/010.yaml
  text: Behold[a], the Lord GOD comes with strength, and his arm rules for him; behold, his reward is with him[d][c][b], and his recompense before him.
translation:
  language: ru
  text: Вот, Господь Яхве[a] приходит с силой[b], и его рука властвует для него[c]. Вот, награда его с ним, и воздаяние его — перед ним[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение אֲדֹנָי יְהוִה соединяет титул «Господь» с личным именем Яхве (YHWH).
    reason: alternative_reading
  - marker: b
    text: 'Или: «придёт в могуществе»; еврейская глагольная форма допускает явное будущее значение, а בְּחָזָק может быть передано «с могуществом».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское выражение буквально: «и его рука властвует для него»; также возможно: «его рука властвует в его интересах».'
    reason: lexical_alternative
  - marker: d
    text: Слова, переведённые как «награда» и «воздаяние», могут также означать «плата» и «вознаграждение за труд».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательную и торжественно-провозгласительную силу еврейского междометия в обоих случаях, оставаясь естественным для современного русского языка.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Передаёт оба элемента составного титула: אֲדֹנָי как «Владыка», а личное имя יהוה как «Яхве», не создавая сочетания «Господь Господь».'
- source_word: בְּחָזָק
  choice: с силой
  rationale: Передаёт образ действия — могущественное пришествие — без превращения слова в не выраженный прямо титул «Сильный».
- source_word: יָבוֹא
  choice: приходит
  rationale: Настоящее время передаёт живую пророческую наглядность и уверенность провозглашения; возможное будущее значение отмечено в сноске.
- source_word: וּזְרֹעוֹ
  choice: и его рука
  rationale: Сохраняет прозрачную библейскую метафору руки как орудия силы и власти.
- source_word: מֹשְׁלָה לוֹ
  choice: правит от его имени
  rationale: Причастие от משל передано глаголом властвования, а לו понято как указание на действие в его интересах или от его имени. Более буквальная конструкция отмечена в сноске.
- source_word: שְׂכָרוֹ
  choice: награда его
  rationale: «Награда» естественно передаёт שָׂכָר в пророческом контексте и сохраняет возможность понимать её как принесённое им воздаяние, не уточняя получателя.
- source_word: אִתּוֹ
  choice: с ним
  rationale: Прямо передаёт значение сопровождения или присутствия.
- source_word: וּפְעֻלָּתוֹ
  choice: и воздаяние его
  rationale: В параллели с שְׂכָרוֹ слово обозначает плату или итог труда; «воздаяние» сохраняет поэтическую торжественность и смысловую широту.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Сохраняет пространственный образ и параллелизм исходного текста без дополнительного толкования.
theological_decisions:
- issue: Передача Божьего имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Выбор явно сохраняет личное имя יהוה и одновременно передаёт титул אֲדֹנָי, не смешивая два отдельных элемента еврейского выражения.
- issue: Чья и для кого награда упомянута в стихе
  choice: Сохранена форма «награда его» без указания получателя
  alternative: награда, которую он раздаёт; награда, которую он получает
  rationale: Еврейские притяжательные формы сами по себе не разрешают полностью, является ли это принадлежащей ему наградой, принесённой для раздачи, или платой за труд; перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Дважды сохранено риторическое «вот», а метафора руки оставлена без абстрактной замены. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная издательская норма.
