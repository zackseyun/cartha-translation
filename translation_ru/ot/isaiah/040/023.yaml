lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: Он обращает
  rationale: Причастие продолжает описание Бога из предыдущего стиха и обозначает Его характерное действие; в сочетании с לְאָיִן естественное русское выражение — «обращает в ничто».
- source_word: רוֹזְנִים
  choice: князей
  rationale: Слово обозначает знатных правителей или высших сановников; «князья» сохраняет возвышенный политический смысл и поэтический регистр.
- source_word: לְאָיִן
  choice: в ничто
  rationale: אָיִן выражает отсутствие, небытие или ничтожность; оборот «обращает в ничто» точно и естественно передаёт смысл.
- source_word: שֹׁפְטֵי אֶרֶץ
  choice: судей земли
  rationale: Конструкция буквально означает «судьи земли/страны». В универсальном контексте Ис 40 «земли» лучше сохраняет всемирный масштаб.
- source_word: כַּתֹּהוּ
  choice: пустотой
  rationale: תֹהוּ может обозначать пустоту, безлюдье, хаос или нечто лишённое реальности. Творительный падеж после «делает» естественно передаёт конструкцию с כ и не сводит многозначный образ только к хаосу.
- source_word: עָשָׂה
  choice: делает
  rationale: Хотя форма глагола — перфект, в поэтическом параллелизме с причастием она описывает характерное действие Бога; настоящее время сохраняет эту силу.
theological_decisions:
- issue: Масштаб אֶרֶץ в выражении שֹׁפְטֵי אֶרֶץ
  choice: земли
  alternative: страны
  rationale: Ближайший контекст подчёркивает власть Бога над всем миром и народами, поэтому универсальное значение предпочтительнее, однако возможное значение «страны» не исключается.
translation_notes:
  register: Современный литературный русский язык с лаконичным пророческим параллелизмом. Сохранены возвышенное «князья» и намеренно необычный образ «делает… пустотой»; неоднозначность תֹהוּ вынесена в сноску.
