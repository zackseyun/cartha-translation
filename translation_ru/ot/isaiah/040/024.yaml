  text: אַ֣ף בַּל נִטָּ֗עוּ אַ֚ף בַּל זֹרָ֔עוּ אַ֛ף בַּל שֹׁרֵ֥שׁ בָּ/אָ֖רֶץ גִּזְעָ֑/ם וְ/גַם נָשַׁ֤ף בָּ/הֶם֙ וַ/יִּבָ֔שׁוּ וּ/סְעָרָ֖ה כַּ/קַּ֥שׁ תִּשָּׂאֵֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/024.yaml
  text: Scarcely are they planted[a], scarcely are they sown, scarcely has their stem taken root in the earth, when he merely blows on them and they wither[b], and a storm carries them away like stubble.
translation:
  language: ru
  text: Едва они посажены[a], едва посеяны, едва их стебель пустил корни в земле — Он лишь дунет на них, и они засохнут, а буря[b] унесёт их, как солому.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Едва ли они посажены, едва ли посеяны…» Троекратное повторение в еврейском тексте подчёркивает, как быстро прекращается их возвышение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вихрь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף בַּל
  choice: едва
  rationale: 'Троекратное сочетание выражает усиленное отрицание с временным оттенком: они едва успевают утвердиться, как уже гибнут. Повтор «едва» сохраняет риторику еврейского текста.'
- source_word: נִטָּעוּ
  choice: посажены
  rationale: Пассивная форма глагола נטע сохраняет образ правителей как недавно посаженных растений.
- source_word: זֹרָעוּ
  choice: посеяны
  rationale: Пассивная форма продолжает земледельческий образ и параллель с «посажены».
- source_word: שֹׁרֵשׁ ... גִּזְעָם
  choice: их ствол пустил корни
  rationale: גזע означает ствол или древесный стебель, а необычная глагольная форма от שרש передаёт укоренение. Русское выражение «пустить корни» естественно и сохраняет образ утверждения в земле.
- source_word: נָשַׁף
  choice: Он лишь дунет на них
  rationale: Глагол означает «дуть, дохнуть». Частица «лишь» передаёт лёгкость действия Бога в данном контексте, не усиливая само действие.
- source_word: וַיִּבָשׁוּ
  choice: они засохнут
  rationale: Глагол יבש означает высохнуть или увянуть; «засохнут» естественно продолжает растительный образ.
- source_word: סְעָרָה
  choice: буря
  rationale: Слово обозначает бурю, сильный вихрь или штормовой ветер. «Буря» широко и понятно передаёт разрушительную силу, не сужая образ до вихря.
- source_word: כַּקַּשׁ
  choice: как солому
  rationale: קשׁ обозначает сухую солому или оставшиеся после жатвы стебли. «Солома» понятна современному читателю и хорошо сочетается с образом уносящего ветра.
- source_word: תִּשָּׂאֵם
  choice: унесёт их
  rationale: В данном контексте נשא означает поднять и унести; русский глагол кратко передаёт результат действия бури.
theological_decisions:
- issue: Подразумеваемое подлежащее в выражении «дунет на них»
  choice: Личное местоимение «Он» указывает на Бога как подразумеваемого деятеля
  alternative: 'Безличное чтение: «на них подует ветер»'
  rationale: В Ис 40:23–24 продолжается действие Того, кто обращает правителей в ничто. Заглавное «Он» сохраняет личную божественную субъектность, не добавляя Божьего имени, которого в этом стихе нет.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического трёхчастного повтора и земледельческого образа. Заглавное «Он» делает понятным подразумеваемого в контексте Бога, не вводя отсутствующего в еврейском тексте имени.
