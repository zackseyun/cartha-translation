base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/016.yaml
  text: Lebanon is not enough to burn[b][a], nor are its animals enough for a burnt offering.
translation:
  language: ru
  text: Ливана[a] не хватит для сожжения, и его животных[b] не хватит для всесожжения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ливан славился своими лесами; смысл в том, что даже всей его древесины не хватило бы как топлива для сожжения.
    reason: cultural_note
  - marker: b
    text: 'Или: «зверей». Еврейское слово может обозначать в особенности диких животных Ливана; в данном образе они мыслятся как животные для жертвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָנוֹן
  choice: даже Ливана
  rationale: Сохранено собственное имя «Ливан». В контексте оно метонимически указывает на знаменитые леса этой области; частица «даже» естественно передаёт усилительный смысл сопоставления, не заменяя географическое название толкованием.
- source_word: אֵין דֵּי
  choice: не хватит
  rationale: Оборот выражает недостаточность количества. Русское «не хватит» ясно и естественно передаёт этот смысл в обеих параллельных частях стиха.
- source_word: בָּעֵר
  choice: для огня
  rationale: Инфинитив относится к горению, то есть к топливу для жертвенного огня. Формулировка «для огня» сохраняет краткость оригинала и не вводит в основной текст отсутствующее слово «дрова».
- source_word: וְחַיָּתוֹ
  choice: и его животных
  rationale: חיה обозначает животное или зверя, нередко дикого. Нейтральное «животных» не сужает значение, а местоимение «его» относит их к Ливану.
- source_word: עוֹלָה
  choice: всесожжения
  rationale: «Всесожжение» — точный и общепонятный русский термин для жертвы, полностью сжигавшейся на жертвеннике. Единственное число еврейского текста сохранено.
theological_decisions:
- issue: Смысл жертвенного образа
  choice: Даже лесных и животных богатств Ливана недостаточно для огня и всесожжения, соответствующих величию Бога.
  alternative: Обобщённое утверждение о недостаточности любых человеческих средств поклонения.
  rationale: Ближайший контекст Ис 40:12–17 подчёркивает несравненное величие Бога. Перевод сохраняет конкретный жертвенный образ, не превращая его в более широкое doctrинальное утверждение, которого сам стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык; краткий параллелизм еврейского стиха сохранён с естественным для русского опущением повторного сказуемого во второй части. Тон возвышенный, но понятный; смысловая метонимия «Ливан — его леса» пояснена в сноске.
