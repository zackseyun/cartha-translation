base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/015.yaml
  text: Look[a], the nations are like a drop from a bucket, and are regarded as dust on the scales; look[b], the coastlands he lifts like fine dust.
translation:
  language: ru
  text: Вот, народы — как капля из ведра[a], считаются мелкой пылью на весах; вот, прибрежные земли[b] он поднимает как мелкую пыль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как капля в ведре». Еврейский текст буквально: «капля из ведра».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «острова». Еврейское слово может обозначать острова, побережья или далёкие заморские земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: вот
  rationale: Указательно-восклицательная частица привлекает внимание; «вот» естественно передаёт её риторическую силу в современном литературном русском языке.
- source_word: גּוֹיִם
  choice: народы
  rationale: Слово обозначает народы мира; русский язык позволяет употребить его здесь без определённого артикля.
- source_word: כְּמַר מִדְּלִי
  choice: как капля из ведра
  rationale: 'מַר означает каплю, а предлог מִן указывает на исходную точку или источник: буквально «из ведра».'
- source_word: וּכְשַׁחַק מֹאזְנַיִם
  choice: и пылью на весах
  rationale: שַׁחַק обозначает мелкую пыль или порошок, а מֹאזְנַיִם — весы. Образ подчёркивает ничтожность веса; форма «пылью» сохраняет вещественное значение слова.
- source_word: נֶחְשָׁבוּ
  choice: они считаются
  rationale: Пассивная форма от חשׁב выражает оценку или исчисление. «Считаются» сохраняет пассивность и не усиливает смысл.
- source_word: אִיִּים
  choice: прибрежные земли
  rationale: В книге Исаии слово может обозначать острова, побережья и далёкие заморские земли; «прибрежные земли» передаёт широкое географическое значение.
- source_word: כַּדַּק
  choice: словно пылинку
  rationale: דַּק означает нечто мелкое, тонкое или лёгкое. В сочетании с глаголом поднятия русское «пылинку» естественно выражает малость и невесомость.
- source_word: יִטּוֹל
  choice: он поднимает
  rationale: Глагол נטל означает поднимать, брать или нести. «Поднимает» сохраняет образ того, как Бог без усилия обращается с прибрежными землями.
theological_decisions:
- issue: Не выраженный существительным субъект יִטּוֹל
  choice: Местоимение «он» со строчной буквы отсылает по контексту к Богу, не добавляя в стих имени или титула.
  alternative: 'Оставить субъект невыраженным: «прибрежные земли поднимает, словно пылинку»; либо уточнить: «Господь поднимает».'
  rationale: В еврейском тексте форма глагола имеет мужской род, единственное число, но отдельного подлежащего в этой части стиха нет. В русском полное устранение местоимения создаёт неестественную и потенциально неясную конструкцию, а добавление имени «Господь» делает явным то, что в исходном тексте дано лишь контекстом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «вот» и параллельное построение сохранены; инверсия в заключительной части поддерживает риторический акцент исходного текста без архаизации.
