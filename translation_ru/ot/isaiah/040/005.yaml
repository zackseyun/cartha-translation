base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/005.yaml
  text: And the glory of Yahweh will be revealed[a], and all flesh together will see, for the mouth of Yahweh has spoken.
translation:
  language: ru
  text: И откроется слава Яхве, и увидит всякая плоть[a] вместе, ибо уста Яхве изрекли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё человечество»; буквально: «всякая плоть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְלָה
  choice: явится
  rationale: Нифаль глагола גלה обозначает раскрытие или проявление. «Явится» естественно передаёт будущее проявление славы, не сводя выражение к простому зрительному появлению.
- source_word: כְּבוֹד יְהוָה
  choice: слава Яхве
  rationale: Существительное כָּבוֹד означает славу, честь и весомое величие; русская конструкция с родительным падежом точно передаёт еврейское сочетание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул «Господь».
- source_word: וְרָאוּ
  choice: увидит
  rationale: Глагол имеет будущее значение в пророческой последовательности. Единственное число согласовано с собирательным выражением «всякая плоть»; местоимение «её» делает подразумеваемый объект естественным по-русски.
- source_word: כָל בָּשָׂר
  choice: всякая плоть
  rationale: Сохранён конкретный еврейский образ, обозначающий всё человечество и подчёркивающий его телесность и тварность; значение пояснено в сноске.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Наречие указывает на совместность и всеобщий охват происходящего.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание и заверение предшествующего обещания; «ибо» соответствует торжественному пророческому контексту.
- source_word: פִּי יְהוָה
  choice: уста Яхве
  rationale: Сохранён конкретный антропоморфный образ еврейского текста; «уста» звучит достойно и естественно в возвышенной русской речи.
- source_word: דִּבֵּר
  choice: сказали это
  rationale: Перфект представляет слово как уже произнесённое и потому несомненное. «Это» восполняет необходимый в естественной русской фразе объект, не добавляя нового содержания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит тетраграмматон, поэтому сохранено личное имя Бога в принятой русской транслитерации, а не подставлен титул.
- issue: Передача универсального выражения כָל בָּשָׂר
  choice: всякая плоть
  alternative: всё человечество; все люди
  rationale: Буквальный образ сохраняет телесный и тварный оттенок еврейского выражения, тогда как сноска ясно указывает его универсальный смысл.
- issue: Подразумеваемый объект при וְרָאוּ
  choice: увидит её
  alternative: увидит
  rationale: В еврейском объект не выражен, но из контекста естественно подразумевается явленная слава. Русское «её» делает предложение грамматически полным, не устраняя смысловой связи с первой частью.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Слова «плоть», «ибо» и «уста» сохраняют библейскую образность, оставаясь понятными современному читателю.
