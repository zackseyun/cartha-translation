revisions:
- from: Кому же вы уподобите Меня[a], чтобы Я был ему равен? — говорит Святой.
  to: Кому же вы уподобите Меня? Кому Я был бы равен? — говорит Святой.
  rationale: Перевод сохраняет риторическую форму, первое лицо второй части и краткий титул «Святой». Два параллельных вопроса передают смысл еврейского вав-соединения без внесения оттенка цели. Сноска сохранена как уместная лексическая альтернатива, но её маркер следует поставить после «уподобите Меня» в наборе текста.
