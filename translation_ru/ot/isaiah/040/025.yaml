  text: וְ/אֶל מִ֥י תְדַמְּי֖וּ/נִי וְ/אֶשְׁוֶ֑ה יֹאמַ֖ר קָדֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/025.yaml
  text: To whom then will you compare me[a], that I should be equal? says the Holy One.
translation:
  language: ru
  text: Кому же вы уподобите Меня? Кому Я был бы равен? — говорит Святой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶל מִי
  choice: Кому же
  rationale: Предлог אֶל с вопросительным местоимением вводит объект сопоставления. Частица «же» естественно передаёт переход к риторическому вопросу, выраженный начальным וְ, без тяжеловесного буквального «и кому».
- source_word: תְדַמְּיוּנִי
  choice: вы уподобите Меня
  rationale: Пиэль глагола דמה означает «уподоблять, сравнивать». «Уподобите Меня» сохраняет направление сравнения, заданное конструкцией с אֶל, и возвышенный, но современно понятный тон.
- source_word: וְאֶשְׁוֶה
  choice: чтобы Я был ему равен
  rationale: Глагол שׁוה выражает равенство или сопоставимость. Русское придаточное цели/следствия естественно передаёт смысловую связь частей вопроса; «ему» грамматически обозначает подразумеваемый объект сравнения, не уточняя его природу.
- source_word: יֹאמַר
  choice: говорит
  rationale: Имперфект в формуле пророческой речи уместно передаётся настоящим временем.
- source_word: קָדוֹשׁ
  choice: Святой
  rationale: Слово употреблено как самостоятельный Божий титул. Добавление «Израилев» отсутствует в данном стихе и потому не вводится.
theological_decisions:
- issue: Божественная несравнимость
  choice: Сохранить риторический вопрос и краткий титул «Святой»
  alternative: Раскрыть смысл утвердительной парафразой «Никто не может сравниться со Мной» или расширить титул до «Святой Израилев»
  rationale: Еврейский текст утверждает уникальность Бога посредством вопроса. Сохранение его формы, первого лица и точного титула передаёт богословскую силу стиха без добавления отсутствующих уточнений.
- issue: Подразумеваемый объект при וְאֶשְׁוֶה
  choice: Передать как «чтобы Я был ему равен»
  alternative: 'Оставить без дополнения: «чтобы Я был равен»'
  rationale: В еврейском объект равенства подразумевается предшествующим מִי. Русское «ему» делает эту связь грамматически естественной, не меняя смысла и не отождествляя сравниваемого с каким-либо конкретным существом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные «Меня», «Я» отражают обращение Бога от первого лица; тире естественно отделяет слова говорящего от авторской формулы.
