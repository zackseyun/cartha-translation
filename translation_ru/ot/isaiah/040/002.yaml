  text: דַּבְּר֞וּ עַל לֵ֤ב יְרֽוּשָׁלִַ֨ם֙ וְ/קִרְא֣וּ אֵלֶ֔י/הָ כִּ֤י מָֽלְאָה֙ צְבָאָ֔/הּ כִּ֥י נִרְצָ֖ה עֲוֺנָ֑/הּ כִּ֤י לָקְחָה֙ מִ/יַּ֣ד יְהוָ֔ה כִּפְלַ֖יִם בְּ/כָל חַטֹּאתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/002.yaml
  text: Speak to the heart of Jerusalem[a], and call out to her that her hard service is completed, that her iniquity is pardoned[c][b], that she has received from the hand of Yahweh double for all her sins.
translation:
  language: ru
  text: Говорите Иерусалиму с утешением[a] и возвестите ему, что тяжёлая служба его окончена[b], что вина его прощена[c], что от руки Яхве он получил вдвойне за все свои грехи[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально: «говорите к сердцу»; то есть говорите ему с утешением и ободрением.'
    reason: idiom_explanation
  - marker: b
    text: 'Или: «его война окончена»; или: «срок его службы исполнился».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское выражение допускает также смысл: «наказание за его вину принято как достаточное» или «за его вину дано удовлетворение».'
    reason: lexical_alternative
  - marker: d
    text: «Вдвойне» может означать полную меру, а не обязательно точное удвоение.
    reason: cultural_note
lexical_decisions:
- source_word: דַּבְּרוּ עַל־לֵב
  choice: Говорите к сердцу
  rationale: Сохранён выразительный еврейский оборот, означающий ободряющую, утешительную речь; его смысл пояснён в сноске.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалима
  rationale: Употреблена общепринятая русская форма названия. Грамматическое согласование в дальнейшем соответствует мужскому роду слова «Иерусалим» в русском языке, хотя в еврейском тексте город олицетворён как женщина.
- source_word: וְקִרְאוּ אֵלֶיהָ
  choice: и возвестите ему
  rationale: Глагол קרא с אֶל обозначает громко обратиться или провозгласить кому-либо. «Возвестите» естественно передаёт пророческое провозглашение.
- source_word: מָלְאָה צְבָאָהּ
  choice: тяжёлая служба его окончена
  rationale: צָבָא может означать войну, воинскую или назначенную на определённый срок службу. В контексте страдания Иерусалима «тяжёлая служба» передаёт более широкий смысл, не сводя его к буквальной войне.
- source_word: נִרְצָה עֲוֺנָהּ
  choice: вина его прощена
  rationale: В контексте утешения сочетание возвещает, что вина более не препятствует восстановлению. Поскольку глагол буквально связан с благосклонным принятием, а עָוֹן может обозначать также наказание за вину, эта неоднозначность отмечена в сноске.
- source_word: לָקְחָה מִיַּד יְהוָה
  choice: из руки Яхве он получил
  rationale: Сохранён образ получения из Божьей руки и личное имя יהוה передано как «Яхве».
- source_word: כִּפְלַיִם
  choice: вдвойне
  rationale: Прямо передано значение «двойное, вдвое», без решения вопроса, идёт ли речь о точной мере или об идиоме полноты.
- source_word: בְּכָל־חַטֹּאתֶיהָ
  choice: за все свои грехи
  rationale: Контекстуально חַטֹּאות означает грехи, а предлог בְּ выражает основание или соответствие полученного воздаяния.
theological_decisions:
- issue: Смысл того, что Иерусалим получил «вдвойне»
  choice: Сохранено буквальное «вдвойне» без уточнения математической меры.
  alternative: Полная мера воздаяния; либо строго двойное наказание за грехи.
  rationale: Контекст говорит о завершившемся страдании и восстановлении, однако сам образ допускает как буквальное, так и идиоматическое понимание.
- issue: Значение נִרְצָה עֲוֺנָהּ
  choice: «вина его прощена»
  alternative: «наказание за его вину принято как достаточное» или «его вина получила удовлетворение».
  rationale: Основной текст ясно передаёт итог для Иерусалима в контексте утешения, а сноска сохраняет заложенные в еврейских словах оттенки принятия, удовлетворения и наказания.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранён конкретный образ «говорить к сердцу» и образ «руки Яхве»; менее прозрачные обороты пояснены сносками. Русское грамматическое согласование с «Иерусалимом» мужского рода не воспроизводит женский род местоименных суффиксов еврейского текста, но естественно для русского языка.
