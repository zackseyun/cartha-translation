  text: יָבֵ֥שׁ חָצִ֖יר נָ֣בֵֽל צִ֑יץ וּ/דְבַר אֱלֹהֵ֖י/נוּ יָק֥וּם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/008.yaml
  text: The grass withers[a], the flower fades, but the word of our God will stand forever.
translation:
  language: ru
  text: Трава засыхает, цветок увядает, но слово нашего Бога устоит вечно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָבֵשׁ
  choice: засыхает
  rationale: Глагол יבש обозначает высыхание, засыхание; настоящее время естественно передаёт общеизвестную, повторяющуюся реальность поэтического образа.
- source_word: חָצִיר
  choice: трава
  rationale: В данном контексте חָצִיר означает траву или зелень; «трава» — наиболее ясный и естественный русский эквивалент.
- source_word: נָבֵל
  choice: увядает
  rationale: נבל применительно к цветку означает увядание; этот выбор сохраняет отличие от засыхания травы в первой строке.
- source_word: צִיץ
  choice: цветок
  rationale: צִיץ здесь обозначает цветок или цвет; «цветок» понятно современному читателю и естественно сочетается с глаголом «увядает».
- source_word: וּדְבַר
  choice: но слово
  rationale: Хотя союз ו обычно соответствует «и», в поэтическом параллелизме он вводит явное противопоставление преходящей растительности и непреходящего Божьего слова; русское «но» естественно выражает эту функцию.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: 'Форма אֱלֹהִים с суффиксом первого лица множественного числа в обычном израильском употреблении имеет единственное значение: «наш Бог».'
- source_word: יָקוּם
  choice: устоит
  rationale: קום буквально связано с вставанием и стоянием, а здесь выражает прочность и непреходящую действенность. «Устоит» сохраняет конкретный образ и естественно передаёт будущую направленность формы.
- source_word: לְעוֹלָם
  choice: вечно
  rationale: В контексте противопоставления человеческой преходящести Божьему слову выражение означает неограниченную продолжительность; «вечно» — ясный современный эквивалент.
theological_decisions:
- issue: Противопоставление преходящего творения и непреходящего Божьего слова
  choice: Передать союз как «но»
  alternative: Формально передать союз как «и»
  rationale: Противительное значение следует из самого параллелизма и контекста; «но» делает его явным, не добавляя нового богословского содержания.
- issue: Широта значения דָּבָר
  choice: слово
  alternative: весть; обещание
  rationale: «Слово» сохраняет широкое значение исходного существительного и не сужает Божье высказывание до вести или обещания.
- issue: Значение стойкости в יָקוּם
  choice: устоит
  alternative: пребудет; останется
  rationale: «Устоит» сохраняет образ стояния и одновременно выражает непреходящую силу Божьего слова, не уточняя сверх текста способ его исполнения.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified поэтическим ритмом. Различие двух еврейских глаголов передано естественной парой «засыхает — увядает»; архаизмы «пребудет» и «вовеки» не использованы.
