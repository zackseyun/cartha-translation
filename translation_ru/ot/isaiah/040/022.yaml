base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/022.yaml
  text: He is the one who sits above the circle of the earth[a], and its inhabitants are like grasshoppers[b]; who stretches out the heavens like a curtain and spreads them out like a tent to dwell in.
translation:
  language: ru
  text: Он сидит над кругом земли[a], и её жители — словно кузнечики; Он простирает небеса, как тонкую завесу[b], и раскидывает их, как шатёр, чтобы жить в нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над сводом земли»; также возможно: «над горизонтом земли». Еврейское слово может обозначать круг, дугообразную границу или свод.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как тонкое полотно». Еврейское слово обозначает нечто тонкое, лёгкое или мелкое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשֵׁב
  choice: Он восседает
  rationale: Субстантивированное причастие описывает постоянное положение Бога. «Восседает» естественно для возвышенной русской поэзии и передаёт пребывание над землёй, не добавляя явно слова «на престоле».
- source_word: עַל חוּג הָאָרֶץ
  choice: над кругом земли
  rationale: «Над» передаёт возвышенность, а «круг земли» сохраняет поэтический образ חוּג, не навязывая конкретной древней или современной космологической модели.
- source_word: וְיֹשְׁבֶיהָ
  choice: и её жители
  rationale: Краткий и естественный русский эквивалент обозначения тех, кто населяет землю.
- source_word: כַחֲגָבִים
  choice: словно кузнечики
  rationale: חָגָב обозначает кузнечика или саранчовое насекомое; здесь сравнение подчёркивает малость людей, поэтому «кузнечики» точнее передаёт образ без ассоциации с нашествием.
- source_word: הַנּוֹטֶה
  choice: Он простирает
  rationale: Причастие продолжает описание Бога; настоящее время сохраняет значение продолжающегося или характерного действия.
- source_word: כַדֹּק
  choice: как тонкое полотно
  rationale: דֹק указывает на нечто тонкое, лёгкое или мелкое. «Тонкое полотно» ясно передаёт качество материала и не сужает образ до конкретного вида занавеси.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: «Небеса» соответствуют широкому космическому смыслу и возвышенному поэтическому регистру.
- source_word: וַיִּמְתָּחֵם
  choice: и раскидывает их
  rationale: Глагол означает растягивать или распростирать. «Раскидывает» избегает тяжёлого повтора после «простирает» и естественно сочетается с образом шатра.
- source_word: כָּאֹהֶל לָשָׁבֶת
  choice: как шатёр для жилья
  rationale: Сохраняется прямое сравнение с переносным жилищем; инфинитив передан конструкцией цели «для жилья» без уточнения, кто именно живёт в нём.
theological_decisions:
- issue: Космологический образ חוּג הָאָרֶץ
  choice: круг земли
  alternative: свод земли; горизонт земли
  rationale: Поэтический текст возвещает превосходство и творческую власть Бога. «Круг» сохраняет исходный образ и его неоднозначность, не превращая стих в утверждение определённой научной модели.
- issue: Смысл לָשָׁבֶת и подразумеваемый обитатель
  choice: для жилья
  alternative: чтобы жить в нём; для обитания
  rationale: В еврейском тексте субъект проживания прямо не назван. Безличная целевая конструкция сохраняет эту открытость и не решает молча, идёт ли речь о Боге, людях или функции небес как образного шатра.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным поэтическим звучанием. Параллелизм еврейской строки сохранён; архаизмы и научно-космологические уточнения не вводятся.
