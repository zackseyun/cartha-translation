  source_fidelity: 'Основной смысл передан точно: Бог находится над «кругом земли», люди уподоблены кузнечикам, небеса распростираются как тонкая ткань и как шатёр. Однако «восседает» привносит оттенок престольного сидения, которого причастие יֹשֵׁב само по себе прямо не выражает. Кроме того, «раскидывает их, как шатёр для жилья» синтаксически допускает, будто сами небеса — «шатёр для жилья», тогда как לָשָׁבֶת естественнее передать как назначение шатра: «чтобы жить в нём».'
