  source_fidelity: 'Основной смысл передан точно: бедный человек выбирает долговечный материал, ищет искусного мастера и заботится об устойчивости сделанного образа. Примечание корректно сохраняет синтаксическую неоднозначность начала стиха. Однако עֵץ в данном контексте обозначает материал для изготовления, поэтому «древесина» точнее и естественнее, чем «дерево», которое по-русски прежде всего означает живое дерево. פֶּסֶל в полемическом контексте стиха уместнее передать как «идол»; это передаёт функцию предмета и соответствует контексту, не выходя за пределы лексического значения.'
