  text: הַֽ/מְסֻכָּ֣ן תְּרוּמָ֔ה עֵ֥ץ לֹֽא יִרְקַ֖ב יִבְחָ֑ר חָרָ֤שׁ חָכָם֙ יְבַקֶּשׁ ל֔/וֹ לְ/הָכִ֥ין פֶּ֖סֶל לֹ֥א יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/020.yaml
  text: He who is too poor for an offering chooses wood that will not rot[c][b][a]; he seeks out for himself a skilled craftsman to prepare an idol that will not totter.
translation:
  language: ru
  text: Кто слишком беден для приношения, выбирает древесину, которая не сгниёт[a]; он подыскивает себе искусного мастера, чтобы тот изготовил идола[b], который не пошатнётся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское начало стиха сжато и допускает также перевод: «Обедневший выбирает для приношения древесину, которая не гниёт».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «резное изображение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְסֻכָּן
  choice: кто слишком беден
  rationale: Передаёт субстантивированную форму, которую в данном контексте обычно понимают как указание на человека, стеснённого бедностью; не устраняет компактность и некоторую неоднозначность еврейского начала.
- source_word: תְּרוּמָה
  choice: для приношения
  rationale: Сохраняет культовое значение «приношение, вклад» и естественно сочетается с пониманием первой формы как указания на бедность.
- source_word: עֵץ לֹא יִרְקַב
  choice: дерево, которое не сгниёт
  rationale: Конкретно и ясно передаёт выбор долговечного материала, сохраняя образ гниения.
- source_word: יִבְחָר
  choice: выбирает
  rationale: Настоящее время естественно описывает типичное действие в пророческой сатире.
- source_word: חָרָשׁ חָכָם
  choice: искусного мастера
  rationale: חָכָם здесь обозначает профессиональное умение, а не нравственную или духовную мудрость.
- source_word: יְבַקֶּשׁ לוֹ
  choice: подыскивает себе
  rationale: Передаёт целенаправленный поиск и значение לוֹ естественным современным русским оборотом.
- source_word: לְהָכִין
  choice: чтобы тот изготовил
  rationale: В контексте работы мастера глагол означает подготовить или устроить изделие; «изготовил» естественно передаёт предполагаемое действие, не меняя его результата.
- source_word: פֶּסֶל
  choice: изваяние
  rationale: Передаёт конкретный резной или скульптурный образ и не добавляет к самому слову больше толкования, чем необходимо; полемический контекст идолопоклонства остаётся очевидным.
- source_word: לֹא יִמּוֹט
  choice: которое не пошатнётся
  rationale: 'Сохраняет иронию: изготовитель стремится обеспечить устойчивость созданного им образа; «пошатнётся» не усиливает значение до обязательного падения.'
theological_decisions:
- issue: Передача פֶּסֶל в контексте обличения идолопоклонства
  choice: изваяние
  alternative: идол
  rationale: «Изваяние» точнее сохраняет предметное значение слова и позволяет контексту выразить богословскую оценку; «идол» также допустим и делает полемическую направленность явной.
- issue: Неоднозначное начало הַמְסֻכָּן תְּרוּמָה
  choice: кто слишком беден для приношения
  alternative: обедневший выбирает для приношения дерево, которое не гниёт
  rationale: Основной текст следует широко принятому пониманию бедности как невозможности принести дорогое приношение, а примечание сохраняет возможность иного синтаксического членения.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; «подыскивает себе» естественно передаёт יְבַקֶּשׁ לוֹ, а придаточное «чтобы тот изготовил» устраняет неясность относительно того, кто выполняет работу. Все маркеры примечаний присутствуют в основном тексте.
