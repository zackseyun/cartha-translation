  terminology: «Стадо», «ягнята» и «кормящие овцы» уместны. «Кормящие овцы» точно передаёт עָלוֹת; сноска с вариантом «овцы с ягнятами» сохраняет допустимую лексическую альтернативу. Богословских интерпретаций текст не добавляет.
