  to: Как пастух он будет пасти своё стадо; мышцей своей соберёт ягнят и на груди своей понесёт их[a]; бережно поведёт кормящих овец[b].
  rationale: Исправлено «рукой» на «мышцей», чтобы точнее передать זְרוֹעַ и его образ силы. Перестроена фраза о несении ягнят для более естественного русского синтаксиса при сохранении буквального образа «на груди/лоне». Остальные элементы сохраняют смысл, регистр и неоднозначность исходного текста.
