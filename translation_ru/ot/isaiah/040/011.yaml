base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/011.yaml
  text: Like a shepherd he will pasture his flock[a]; with his arm he will gather the lambs, and in his bosom he will carry them[c][b]; he will gently lead the nursing ewes.
translation:
  language: ru
  text: Как пастух он будет пасти своё стадо; мышцей своей соберёт ягнят и на груди своей понесёт их[a]; бережно поведёт кормящих овец[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на груди (или на лоне) своей» — образ близкой и нежной заботы.'
    reason: cultural_note
  - marker: b
    text: 'Или: «овец с ягнятами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֹעֶה ... יִרְעֶה
  choice: Как пастух он будет пасти
  rationale: Сравнительная частица כְּ передаётся словом «как», а повтор корня רעה сохраняется естественным для русского языка сочетанием «пастух — пасти».
- source_word: עֶדְרוֹ
  choice: своё стадо
  rationale: В пастушеском контексте עֵדֶר обозначает стадо мелкого скота; возвратное «своё» естественно соотносит стадо с субъектом.
- source_word: בִּזְרֹעוֹ
  choice: своей рукой
  rationale: זְרוֹעַ буквально обозначает руку от плеча и здесь употреблено инструментально. «Своей рукой» звучит естественно и сохраняет образ деятельной силы.
- source_word: יְקַבֵּץ טְלָאִים
  choice: соберёт ягнят
  rationale: קבץ означает собирать вместе, а טְלָאִים — ягнят; русский перевод прямо сохраняет пастушеский образ.
- source_word: וּבְחֵיקוֹ יִשָּׂא
  choice: будет носить их у груди
  rationale: חֵיק указывает на грудь, лоно или пространство у груди, а נשׂא — на несение. Местоимение «их» восполняет подразумеваемый объект — ягнят.
- source_word: עָלוֹת
  choice: кормящих овец
  rationale: Слово относится к самкам, кормящим детёнышей; «кормящие овцы» понятно современному читателю и сохраняет пастушескую конкретность.
- source_word: יְנַהֵל
  choice: бережно поведёт
  rationale: נהל означает вести или направлять; наречие «бережно» передаёт обусловленный контекстом оттенок заботливого ведения уязвимых кормящих овец, не меняя основного значения глагола.
theological_decisions:
- issue: Образ Бога как пастуха
  choice: Сохранить пастушеское сравнение без внесения в текст позднейшего мессианского или христологического толкования.
  alternative: Передать стих интерпретирующим образом, прямо связывая пастуха с мессианским исполнением.
  rationale: В непосредственном контексте стих изображает заботу Яхве посредством пастушеского образа. Перевод сохраняет этот образ и не устраняет возможности его дальнейшего богословского прочтения.
- issue: Род и состояние עָלוֹת
  choice: Передать как «кормящих овец».
  alternative: «Овец с ягнятами».
  rationale: Форма указывает на самок, дающих молоко, однако может описывать их через связь с детёнышами. Основной текст выбирает более прямое значение, а близкая альтернатива сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранён намеренный повтор «пастух — пасти» и конкретный пастушеский образ. Местоимения, относящиеся к Богу, даны со строчной буквы как обычная современная издательская норма; это не выражает богословской позиции.
