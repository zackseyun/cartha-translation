  to: Кто отмерил воды своей пригоршней, пядью размерил небеса, отмерил прах земли мерой[a] и взвесил горы на весах, а холмы — на чашах весов?
  rationale: Исправлены грамматическая ошибка в сноске и несколько архаичный порядок слов. «Вместил» заменено на «отмерил», чтобы яснее передать последовательность действий измерения в еврейском тексте. Альтернатива в сноске сохраняет вероятную связь термина с «третьей» мерой, но прямо отмечает неопределённость её объёма.
