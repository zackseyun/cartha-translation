  text: מִֽי מָדַ֨ד בְּ/שָׁעֳל֜/וֹ מַ֗יִם וְ/שָׁמַ֨יִם֙ בַּ/זֶּ֣רֶת תִּכֵּ֔ן וְ/כָ֥ל בַּ/שָּׁלִ֖שׁ עֲפַ֣ר הָ/אָ֑רֶץ וְ/שָׁקַ֤ל בַּ/פֶּ֨לֶס֙ הָרִ֔ים וּ/גְבָע֖וֹת בְּ/מֹאזְנָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/012.yaml
  text: Who has measured the waters in the hollow of his hand[a], and marked off the heavens with a span, and measured the dust of the earth in a measure[c][b], and weighed the mountains in scales and the hills in balances?
translation:
  language: ru
  text: Кто отмерил воды своей пригоршней, пядью размерил небеса, отмерил прах земли мерой[a] и взвесил горы на весах, а холмы — на чашах весов?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отмерил прах земли третьей мерой». Еврейское слово обозначает древнюю меру или мерный сосуд, точный объём которого неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָדַד
  choice: Кто отмерил
  rationale: Риторический вопрос и совершённость действия естественно передаются русским прошедшим видом; «отмерил» сохраняет образ измерения.
- source_word: בְּשָׁעֳלוֹ
  choice: пригоршней своей
  rationale: Слово обозначает углубление ладони; «пригоршней» естественно и наглядно передаёт ладонь как меру вместимости, сохраняя антропоморфный образ.
- source_word: מַיִם
  choice: воды
  rationale: Множественное число соответствует еврейской форме и космическому масштабу поэтической картины.
- source_word: וְשָׁמַיִם בַּזֶּרֶת תִּכֵּן
  choice: пядью размерил небеса
  rationale: «Пядь» — традиционное и понятное обозначение меры длины между пальцами; תִּכֵּן здесь означает установление или измерение протяжённости.
- source_word: וְכָל
  choice: вместил
  rationale: В контексте измерения глагол допускает смысл «вместить, отмерить»; «вместил» сохраняет образ вещества, помещённого в мерный сосуд, и избегает монотонного повтора.
- source_word: בַּשָּׁלִשׁ
  choice: в меру
  rationale: Название древней меры или мерного сосуда не имеет надёжно установленного современного эквивалента; общий перевод не создаёт ложной точности.
- source_word: עֲפַר הָאָרֶץ
  choice: прах земли
  rationale: Буквально и естественно передаёт конструкцию; «прах» соответствует возвышенному поэтическому регистру.
- source_word: וְשָׁקַל בַּפֶּלֶס הָרִים
  choice: и взвесил горы на весах
  rationale: Передаёт действие взвешивания и конкретный измерительный прибор естественным современным русским выражением.
- source_word: וּגְבָעוֹת בְּמֹאזְנָיִם
  choice: а холмы — на чашах весов
  rationale: Сохраняет поэтический параллелизм и различие между двумя еврейскими обозначениями весового прибора; тире естественно восполняет глагол.
theological_decisions:
- issue: Антропоморфный образ Бога, измеряющего творение рукой
  choice: 'Сохранены конкретные телесные и измерительные образы: «пригоршней своей», «пядью»'
  alternative: 'Передать отвлечённо: «своей силой» или «точной мерой»'
  rationale: Еврейская поэзия намеренно изображает необъятное творение как легко измеряемое рукой; смягчение образа устранило бы выразительность и богословское напряжение текста.
- issue: Подразумеваемый субъект риторического вопроса
  choice: Не добавлять прямо слово «Бог»
  alternative: «Кто, кроме Бога, отмерил…»
  rationale: В оригинале субъект раскрывается контекстом. Сохранение открытой формы риторического вопроса не вносит отсутствующего уточнения и усиливает последующее утверждение несравненности Бога.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической окраской. Конкретные образы древнего измерения сохранены; синтаксис сделан ритмичным и понятным. Маркер [a] поставлен непосредственно после спорного выражения.
