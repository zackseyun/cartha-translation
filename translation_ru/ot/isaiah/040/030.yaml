  source_fidelity: 'В начале стиха נְעָרִים поставлено в эмфатической конструкции по отношению к предыдущему утверждению (ст. 29): «даже юноши». В черновике это существенное «даже» опущено. Остальные соответствия в целом точны: «утомляются и изнемогают» передаёт пару יִעֲפוּ / יִגָעוּ, а «непременно спотыкаются» приемлемо передаёт усиление инфинитивом абсолютным כָּשׁוֹל перед личной формой.'
