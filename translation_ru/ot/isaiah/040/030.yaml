  text: Even young men grow faint and become weary[a], and young men surely stumble.
translation:
  language: ru
  text: 'Даже юноши утомляются и изнемогают,

    и молодые мужчины непременно спотыкаются.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִעֲפוּ
  choice: утомляются
  rationale: Глагол עוף в данной форме передаёт ослабление от усталости; настоящее время естественно выражает обобщённое утверждение в русском поэтическом контексте.
- source_word: נְעָרִים
  choice: юноши
  rationale: נְעָרִים здесь обозначает молодых людей, а не малых детей; «юноши» естественно и сохраняет отличие от следующего בַחוּרִים.
- source_word: וְיִגָעוּ
  choice: изнемогают
  rationale: יגע означает утомляться, изнемогать. Выбор создаёт смысловое нарастание после «утомляются», не превращая параллельные глаголы в полные синонимы.
- source_word: וּבַחוּרִים
  choice: и молодые мужчины
  rationale: בַחוּרִים обозначает молодых мужчин, обычно в расцвете сил. Перевод не вводит этимологически спорное значение «избранные», но поясняет подразумеваемую силу в сноске.
- source_word: כָּשׁוֹל יִכָּשֵׁלוּ
  choice: непременно спотыкаются
  rationale: Инфинитив абсолютный перед личной формой усиливает глагол. «Непременно» передаёт эмфазу, тогда как «спотыкаются» сохраняет образ и не усиливает его до окончательного падения.
