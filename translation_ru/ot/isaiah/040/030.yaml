translation_notes:
  register: Современный литературный русский язык с сохранением краткого поэтического параллелизма. Лексическое различие между נְעָרִים и בַחוּרִים передано сочетаниями «юноши» и «молодые мужчины»; перенос строки отражает две параллельные части стиха.
