source:
  edition: WLC
  text: לָ֠/כֵן יִתֵּ֨ן אֲדֹנָ֥/י ה֛וּא לָ/כֶ֖ם א֑וֹת הִנֵּ֣ה הָ/עַלְמָ֗ה הָרָה֙ וְ/יֹלֶ֣דֶת בֵּ֔ן וְ/קָרָ֥את שְׁמ֖/וֹ עִמָּ֥נוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/014.yaml
  text: 'Therefore the Lord himself will give you a sign: behold[a], the young woman is pregnant and is bearing a son[d][c][b], and she will call his name Immanuel.'
translation:
  language: ru
  text: 'Поэтому Сам Господь даст вам знамение: вот, молодая женщина[a] беременна и родит сына[b]; она назовёт его Эммануилом[c][d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дева». Еврейское עַלְמָה означает молодую женщину; греческая Септуагинта передаёт его словом, обычно понимаемым как «дева», и в таком виде этот стих цитируется в Мф. 1:23.'
    reason: alternative_reading
  - marker: b
    text: 'Традиционный перевод: «зачнёт и родит сына». Еврейский текст прямо называет женщину уже беременной; форма следующего глагола допускает передачу «рожает» или «родит».'
    reason: lexical_alternative
  - marker: c
    text: 'Или, согласно некоторым древним переводам: «ты назовёшь его»; в Мф. 1:23 сказано: «назовут его».'
    reason: textual_variant
  - marker: d
    text: Имя «Эммануил» означает «с нами Бог».
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт логическое следствие отказа Ахаза и естественно звучит в современном русском.
- source_word: אֲדֹנָי הוּא
  choice: Сам Господь
  rationale: Самостоятельное местоимение הוּא имеет усилительное значение; порядок слов по-русски естественно выражает это как «Сам Господь».
- source_word: לָכֶם
  choice: вам
  rationale: Сохраняет множественное число обращения к Ахазу и дому Давида, которое в русском выражено формой «вам».
- source_word: אוֹת
  choice: знамение
  rationale: Традиционное и уместное в возвышенном пророческом контексте обозначение данного Богом знака.
- source_word: הִנֵּה
  choice: вот
  rationale: Естественно передаёт указательную и привлекающую внимание силу древнееврейского слова.
- source_word: הָעַלְמָה
  choice: молодая женщина
  rationale: עַלְמָה обозначает молодую женщину брачного возраста и само по себе не утверждает девственность; значимое традиционное прочтение вынесено в примечание.
- source_word: הָרָה
  choice: беременна
  rationale: Предикативная форма описывает состояние беременности; настоящее время следует форме масоретского текста.
- source_word: וְיֹלֶדֶת
  choice: и рождает
  rationale: Причастие женского рода передано настоящим временем без замены на однозначное будущее; возможная близость или процесс рождения остаются контекстуально открытыми.
- source_word: בֵּן
  choice: сына
  rationale: Естественное русское управление при глаголе «рождает».
- source_word: וְקָרָאת שְׁמוֹ
  choice: она назовёт его
  rationale: Масоретская огласовка указывает на женский род единственного числа; древнееврейская идиома «назовёт его имя» естественно передана по-русски как «назовёт его».
- source_word: עִמָּנוּ אֵל
  choice: Эммануилом
  rationale: Принятая русская форма имени; его значение раскрыто в примечании.
theological_decisions:
- issue: Передача הָעַלְמָה в мессиански значимом пророчестве
  choice: молодая женщина
  alternative: дева
  rationale: Основной текст следует значению древнееврейского существительного, не вкладывая в него более узкое значение автоматически. Греческая традиция и цитата в Мф. 1:23 отмечены в примечании, чтобы сохранить каноническую и богословскую связь.
- issue: Временной и аспектуальный смысл הָרָה וְיֹלֶדֶת
  choice: беременна и рождает
  alternative: зачнёт и родит; беременна и родит
  rationale: Прилагательное состояния и причастие наиболее непосредственно представлены настоящими формами. Традиционное будущее чтение дано в примечании, поскольку древнееврейская конструкция допускает восприятие рождения как близкого или разворачивающегося события.
- issue: Кто даёт ребёнку имя в וְקָרָאת
  choice: она назовёт его
  alternative: ты назовёшь его; назовут его
  rationale: Масоретский текст наиболее прямо читается как форма женского рода единственного числа. Отличающиеся древние традиции и Мф. 1:23 сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Знамение» и «Сам Господь» сохраняют торжественность; синтаксис и выражение «назовёт его» остаются понятными современному читателю. Все смысловые альтернативы, важные для текста и его последующего канонического прочтения, вынесены в примечания.
