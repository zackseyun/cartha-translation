  naturalness: «Среди этой земли» неестественно для современного литературного русского в данном значении. «В этой земле» ясно и естественно передаёт нахождение оставшихся в стране. «Творог» — более точное и обычное русское приближение к продукту типа curds, чем широкое «кислое молоко».
  terminology: חֶמְאָה обозначает не вполне определённый густой/сквашенный молочный продукт; «творог» уместен как основной перевод при сохранении альтернативы «масло» в сноске. Указание «сливки» как равноправной альтернативы менее обосновано и может быть снято.
