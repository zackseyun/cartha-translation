- from: 'И будет: от обилия молока, которое она даёт, он будет есть кислое молоко[a], ведь кислое молоко и мёд будет есть всякий, кто останется среди этой земли.'
  to: 'И будет: из-за обилия надоенного молока он будет есть творог[a], ибо творог и мёд будет есть всякий, кто останется в этой земле.'
  rationale: Устранено невыраженное в оригинале и неясное русское местоимение «она» посредством нейтрального «надоенного молока». «Творог» точнее передаёт выбранное значение חֶמְאָה, при этом сноска сохраняет лексическую неопределённость. «В этой земле» заменяет неестественное «среди этой земли» без утраты пространственного смысла. Единственное число «будет есть всякий» сохраняет грамматическую форму и собирательное значение еврейского כָּל הַנּוֹתָר.
