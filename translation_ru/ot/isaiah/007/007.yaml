  yaml_path: translation/ot/isaiah/007/007.yaml
  text: 'Thus says the Lord GOD: It shall not stand[a], and it shall not come to pass.'
translation:
  language: ru
  text: 'Так говорит Владыка Яхве: «Это не устоит и не сбудется[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не будет». В данном контексте речь о том, что задуманный план не осуществится.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного литературного русского языка пророческая формула; настоящее время передаёт действующую силу провозглашаемого слова.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и не сливает два элемента сочетания в повтор «Господь Господь».
- source_word: לֹא תָקוּם
  choice: Не устоит это
  rationale: Глагол קום буквально связан со стоянием и здесь означает, что упомянутый ранее вражеский замысел не утвердится и не окажется действенным. Местоимение «это» сохраняет отсылку к контексту, не добавляя в основной текст слова «замысел».
- source_word: וְלֹא תִהְיֶה
  choice: и не сбудется
  rationale: Буквально «и не будет»; в контексте задуманного нападения русское «не сбудется» ясно передаёт, что намерение не воплотится, сохраняя параллелизм двух отрицательных частей.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, не превращая последнее в общий титул и не вводя дополнительного слова «Бог», которого в еврейском тексте нет.
- issue: Степень конкретизации предмета божественного отрицания
  choice: это
  alternative: этот замысел
  rationale: Контекст указывает на вражеский замысел, однако в самом стихе существительное не повторено. Местоимение сохраняет контекстуальную связь и не делает подразумеваемое слово явным без необходимости.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Краткий параллелизм оригинала сохранён; архаические обороты вроде «не состоится сему» не используются.
