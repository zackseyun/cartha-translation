  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶֽל יְשַׁעְיָהוּ֒ צֵא נָא֙ לִ/קְרַ֣את אָחָ֔ז אַתָּ֕ה וּ/שְׁאָ֖ר יָשׁ֣וּב בְּנֶ֑/ךָ אֶל קְצֵ֗ה תְּעָלַת֙ הַ/בְּרֵכָ֣ה הָ/עֶלְיוֹנָ֔ה אֶל מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/003.yaml
  text: Then Yahweh said to Isaiah[a], “Go out now to meet Ahaz, you and Shear-jashub your son, at the end of the conduit of the upper pool[b], on the road to the launderer’s field.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Исаии: «Выйди сейчас навстречу Ахазу — ты и твой сын Шеар-Яшув[a] — к концу канала верхнего водоёма, на дороге к полю прачечника[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Шеар-Яшув означает «остаток возвратится».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к полю сукновала». Сукновал обрабатывал и очищал ткань.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: צֵא נָא
  choice: Выйди сейчас
  rationale: Императив צֵא означает «выйди», а частица נָא здесь естественно передаёт настоятельность повеления; «сейчас» звучит современно и не вводит архаической просительной формулы.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Инфинитив с ל обозначает цель выхода — встретить Ахаза; русское «выйди навстречу» точно и естественно передаёт конструкцию.
- source_word: אַתָּה וּשְׁאָר יָשׁוּב בְּנֶךָ
  choice: ты и твой сын Шеар-Яшув
  rationale: Синтаксис называет спутниками Исаию и его сына; порядок слов перестроен в соответствии с естественным русским словоупотреблением.
- source_word: שְׁאָר יָשׁוּב
  choice: Шеар-Яшув
  rationale: Личное имя транслитерировано в основном тексте, а его значимое для книги Исаии значение раскрыто в сноске.
- source_word: קְצֵה
  choice: к концу
  rationale: Предлог אֶל указывает на место назначения; «к концу» сохраняет направительное значение исходной конструкции.
- source_word: תְּעָלַת
  choice: канала
  rationale: Слово обозначает искусственный водовод или канал; «канал» понятно современному читателю и соответствует топографическому контексту.
- source_word: הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: верхнего водоёма
  rationale: בְּרֵכָה здесь обозначает бассейн или резервуар для воды. «Водоём» передаёт функцию объекта и естественно сочетается с упоминанием канала.
- source_word: מְסִלַּת
  choice: у дороги к
  rationale: Существительное обозначает дорогу, первоначально, вероятно, насыпную. В составе описания места русское «у дороги к» ясно передаёт расположение, не перегружая фразу.
- source_word: שְׂדֵה כוֹבֵס
  choice: полю прачечника
  rationale: כּוֹבֵס — человек, моющий или обрабатывающий ткань. «Прачечник» доступнее современному читателю, чем традиционное «сукновал», тогда как альтернативный исторический термин сохранён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Смысл имени שְׁאָר יָשׁוּב
  choice: Транслитерировать имя в тексте и раскрыть значение в сноске
  alternative: Перевести в основном тексте как «Остаток возвратится»
  rationale: Это личное имя сына Исаии, но его буквальное значение богословски и литературно существенно. Такое оформление сохраняет одновременно повествовательную форму и символический смысл, не определяя здесь, является ли «возвращение» обещанием спасения или указанием на ограниченность остатка.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Топографическая фраза сделана понятной без устранения её конкретности; редкий исторический термин вынесен в сноску. Маркер [a] поставлен непосредственно после имени, значение которого он поясняет, а [b] — после соответствующего профессионального обозначения.
