base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/008.yaml
  text: For the head of Aram is Damascus[a], and the head of Damascus is Rezin; and within sixty-five years Ephraim will be shattered from being a people.
translation:
  language: ru
  text: Ибо глава Арама — Дамаск, а глава Дамаска — Рецин; и не пройдёт и шестидесяти пяти лет, как Ефрем будет сокрушён и перестанет быть народом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Ефрем будет сокрушён, так что уже не будет народом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит обоснование предшествующего пророческого утверждения; «ибо» ясно передаёт логическую связь и сохраняет возвышенный, но понятный регистр.
- source_word: רֹאשׁ
  choice: глава
  rationale: 'Сохранена метафора «головы» как главного города или правителя, а также параллелизм: глава Арама — город, глава города — царь.'
- source_word: אֲרָם
  choice: Арам
  rationale: Передано древнееврейское историческое название без анахроничной замены на «Сирию».
- source_word: דַּמֶּשֶׂק
  choice: Дамаск
  rationale: Употреблена нормативная русская форма географического имени.
- source_word: רְצִין
  choice: Рецин
  rationale: Употреблена традиционная русская библейская форма личного имени.
- source_word: וּבְעוֹד
  choice: Не пройдёт и
  rationale: Русская конструкция естественно выражает остающийся срок, в пределах которого совершится предсказанное событие.
- source_word: שִׁשִּׁים וְחָמֵשׁ שָׁנָה
  choice: шестидесяти пяти лет
  rationale: Числительное передано в нормативной современной русской форме и согласовано с временной конструкцией.
- source_word: יֵחַת
  choice: будет сокрушён
  rationale: Форма Niphal от חתת обозначает разрушение или слом; «сокрушён» передаёт решительный распад Ефрема как национального целого.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено названное в тексте племенное и государственное имя без толкующей замены на «Израиль» или «северное царство».
- source_word: מֵעָם
  choice: перестанет быть народом
  rationale: Так естественно по-русски выражена утрата статуса отдельного народа; буквальная форма с предлогом отделения была бы неясной.
theological_decisions:
- issue: Смысл מֵעָם после יֵחַת
  choice: Ефрем будет сокрушён и перестанет быть народом
  alternative: Ефрем будет сокрушён, чтобы уже не быть народом
  rationale: Основной текст передаёт отделение от национального статуса, не уточняя сверх необходимого цель или результат; возможное результативно-целевое прочтение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Метафорическое «глава» сохранено ради структуры оригинала; синтаксис разделён на два предложения для ясности. Маркер примечания помещён при той части стиха, к которой относится вариант.
