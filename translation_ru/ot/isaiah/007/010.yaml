source:
  edition: WLC
  text: וַ/יּ֣וֹסֶף יְהוָ֔ה דַּבֵּ֥ר אֶל אָחָ֖ז לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/010.yaml
  text: And Yahweh continued to speak to Ahaz[a], saying,
translation:
  language: ru
  text: 'И Яхве снова обратился к Ахазу[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И Яхве добавил говорить к Ахазу»; еврейский оборот может означать, что Яхве продолжил говорить или заговорил снова.'
    reason: Сохраняется смысловой диапазон оборота וַיּוֹסֶף ... דַּבֵּר, который допускает как продолжение, так и повторное начало речи.
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: снова
  rationale: 'Конструкция יָסַף с инфинитивом выражает повторение или продолжение действия. Здесь контекст естественно передаётся как новое обращение: «снова обратился».'
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом.
- source_word: דַּבֵּר אֶל
  choice: обратился к
  rationale: В данном контексте сочетание означает речь, направленную к Ахазу; «обратился к» естественно по-русски и сохраняет смысл адресованной речи.
- source_word: אָחָז
  choice: Ахаз
  rationale: Имя передано в принятой русской библейской форме.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский вводитель прямой речи לֵאמֹר в современном русском естественно передаётся двоеточием; отдельное «говоря» было бы избыточным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. «Яхве» сохраняет это различие и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизации. Двоеточие подготавливает прямую речь следующего стиха.
