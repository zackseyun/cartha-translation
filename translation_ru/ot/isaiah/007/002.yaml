  naturalness: '«И донесли дому Давида» возможно, но «Дому Давида сообщили» естественнее в современном литературном русском. При двух однородных подлежащих предпочтительно множественное число: «сердце его и сердце его народа задрожали».'
  terminology: «Дом Давида», «Арам» и «Ефрем» переданы последовательно. Не следует заменять образ расположения на однозначно интерпретирующее «вступил в союз».
