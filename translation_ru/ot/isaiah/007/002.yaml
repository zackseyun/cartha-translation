  yaml_path: translation/ot/isaiah/007/002.yaml
  text: And it was reported to the house of David, saying, “Aram has settled on Ephraim.” And his heart and the heart of his people shook, as the trees of the forest shake before the wind.
translation:
  language: ru
  text: 'Дому Давида сообщили: «Арам расположился у Ефрема». И сердце его и сердце его народа задрожали, как деревья в лесу дрожат от ветра.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְבֵית דָּוִד
  choice: И донесли дому Давида
  rationale: Безличная русская конструкция естественно передаёт еврейский пассив «было сообщено»; «дом Давида» обозначает царский дом и его представителей, но метонимия сохранена.
- source_word: נָחָה אֲרָם עַל אֶפְרָיִם
  choice: Арам расположился в Ефреме
  rationale: נוח буквально выражает покой, оседание или расположение; перевод сохраняет образ размещения сил и не заменяет его более толковательным «заключил союз». Предлог עַל допускает пространственно-политический оттенок; по-русски «в Ефреме» естественно передаёт расположение Арама на территории или среди сил Ефрема.
- source_word: וַיָּנַע
  choice: задрожало
  rationale: Глагол נוע описывает колебание, раскачивание; в отношении сердца естественный русский эквивалент «задрожало» передаёт сильный страх и поддерживает последующее сравнение с деревьями.
- source_word: מִפְּנֵי רוּחַ
  choice: от ветра
  rationale: Краткое и естественное соответствие причинно-образному выражению «перед лицом ветра / из-за ветра».
theological_decisions:
- issue: Политический смысл сообщения об Араме и Ефреме
  choice: 'Сохранён буквальный образ: «Арам расположился в Ефреме»'
  alternative: «Арам вступил в союз с Ефремом»
  rationale: Контекст подразумевает союз, однако само נָחָה עַל выражает расположение или оседание. Перевод не подменяет исходную формулировку однозначным политическим толкованием.
- issue: Референт местоимения «его»
  choice: Сохранено местоименное выражение «сердце его»
  alternative: «сердце царя» или «сердце Ахаза»
  rationale: В еврейском тексте стоит местоименный суффикс; его референт ясен из контекста, но в стих не добавлено отсутствующее имя.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской метонимии «дом Давида» и параллелизма «сердце его и сердце народа его». Инверсия умеренная и торжественная, но понятная современному читателю.
