  text: כִּ֠י בְּ/טֶ֨רֶם יֵדַ֥ע הַ/נַּ֛עַר מָאֹ֥ס בָּ/רָ֖ע וּ/בָחֹ֣ר בַּ/טּ֑וֹב תֵּעָזֵ֤ב הָ/אֲדָמָה֙ אֲשֶׁ֣ר אַתָּ֣ה קָ֔ץ מִ/פְּנֵ֖י שְׁנֵ֥י מְלָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/016.yaml
  text: For before the boy knows to refuse the evil and choose the good[b][a], the land before whose two kings you dread will be forsaken.
translation:
  language: ru
  text: Ибо прежде, чем мальчик научится отвергать зло и выбирать добро, будет оставлена[a] земля, двух царей которой ты страшишься[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет покинута»; возможно также: «опустеет». Еврейская пассивная форма допускает значение оставленной или обезлюдевшей земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «земля, которой ты гнушаешься из-за двух её царей»; в данном контексте еврейский глагол, обозначающий отвращение, вероятно, включает оттенок ужаса перед этими царями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: прежде, чем
  rationale: 'Естественно передаёт временное значение: предсказанное произойдёт до того, как мальчик достигнет указанной способности различать.'
- source_word: הַנַּעַר
  choice: мальчик
  rationale: Слово נַעַר обозначает ребёнка или юношу; контекст ещё не достигнутого нравственного различения указывает здесь на мальчика и сохраняет мужской род.
- source_word: יֵדַע ... מָאֹס ... וּבָחֹר
  choice: научится отвергать... и выбирать
  rationale: Конструкция описывает достижение способности к различению. «Научится» естественно по-русски выражает наступление этого этапа, не сводя речь к формальному знанию.
- source_word: מָאֹס בָּרָע
  choice: отвергать зло
  rationale: В данной антитезе глагол обозначает отказ от зла, а не обязательно эмоциональное презрение; нулевая форма существительного естественна для общего нравственного понятия в русском языке.
- source_word: וּבָחֹר בַּטּוֹב
  choice: и выбирать добро
  rationale: Сохраняет прямое противопоставление отвержению зла и идиоматично передаёт בחר с предлогом.
- source_word: תֵּעָזֵב
  choice: будет оставлена
  rationale: Передаёт пассивную форму еврейского глагола, не уточняя действующее лицо и не решая однозначно, означает ли это запустение, оставление жителями или отказ от владения.
- source_word: הָאֲדָמָה
  choice: земля
  rationale: В контексте двух царей имеется в виду территория, а не почва.
- source_word: אֲשֶׁר אַתָּה קָץ מִפְּנֵי
  choice: двух царей которой ты страшишься
  rationale: По-русски естественно связывает относительное местоимение с землёй и передаёт контекстуальный оттенок страха в קוץ מִפְּנֵי; неоднозначность глагола отмечена в сноске.
- source_word: שְׁנֵי מְלָכֶיהָ
  choice: двух царей которой
  rationale: Женский суффикс относится к «земле»; такая конструкция яснее и естественнее буквального «её двух царей».
theological_decisions:
- issue: Кого обозначает «мальчик»
  choice: Оставить нейтральное «мальчик», не отождествляя его в переводе с конкретным лицом.
  alternative: Истолковать его исключительно как ближайшее историческое дитя-знамение либо прямо обозначить как Иммануила в мессианском смысле.
  rationale: Сам стих употребляет лишь общее существительное הַנַּעַר и не разрешает спор об идентичности; нейтральная передача сохраняет историческую и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Синтаксис сделан естественным для широкого читателя; сохранены пассивная неопределённость תֵּעָזֵב и смысловая неоднозначность קָץ. Все сноски отмечены в основном тексте.
