base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/020.yaml
  text: In that day the Lord will shave with a hired razor from beyond the River—with the king of Assyria—the head and the hair of the feet[a], and it will also sweep away the beard.
translation:
  language: ru
  text: В тот день Владыка обреет нанятой бритвой из-за Реки — царём Ассирии — голову и волосы на ногах[a]; она также сбреет бороду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «волосы на голенях». Слово «ноги» могло служить эвфемистическим обозначением половых органов, усиливая образ полного унижения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלַּח
  choice: обреет
  rationale: Порода пиэль глагола גלח означает сбривание волос; «обреет» естественно передаёт образ и сочетается с перечисленными частями тела.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Это божественный титул אֲדֹנָי, а не тетраграмматон; «Владыка» сохраняет различие и звучит достойно в современном русском.
- source_word: בְּתַעַר הַשְּׂכִירָה
  choice: нанятой бритвой
  rationale: תער — «бритва», שׂכירה — «нанятая»; перевод сохраняет метафору Ассирии как орудия, привлечённого Владыкой.
- source_word: בְּעֶבְרֵי נָהָר
  choice: из-за Реки
  rationale: Выражение указывает на области по ту сторону Реки, то есть Евфрата; прописная буква отражает употребление как известного географического обозначения.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: царём Ассирии
  rationale: 'Предлог ב отмечает орудие и одновременно раскрывает образ: нанятая бритва — царь Ассирии. Тире сохраняют это приложение без излишнего истолкования.'
- source_word: הָרֹאשׁ
  choice: голову
  rationale: Прямое обозначение части тела в развёрнутом образе бритья.
- source_word: שַׂעַר הָרַגְלָיִם
  choice: волосы на ногах
  rationale: Буквально речь идёт о «волосах ног»; такой основной текст сохраняет лексическую прозрачность, а возможный эвфемизм поясняется в сноске.
- source_word: וְגַם אֶת הַזָּקָן
  choice: и бороду
  rationale: גם усиливает полноту перечисления; в русском усиление естественно выражено частицей «и» перед последним объектом.
- source_word: תִּסְפֶּה
  choice: сметёт
  rationale: Глагол ספה передаёт полное удаление, «сметание»; женский род «она» согласуется с подразумеваемой бритвой и сохраняет смену грамматического субъекта исходного текста.
theological_decisions:
- issue: Толкование метафоры бритья
  choice: Владыка использует Ассирию как орудие унизительного суда.
  alternative: Образ лишь описывает военное поражение, не подчёркивая унижения.
  rationale: Бритьё головы, волос нижней части тела и бороды изображает полное обнажение и бесчестье; синтаксис отождествляет нанятую бритву с царём Ассирии, которым действует Владыка.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским регистром. «Владыка» отличает אֲדֹנָי от тетраграмматона. Конструкция с тире сохраняет метафорическое отождествление бритвы с царём Ассирии; местоимение «она» ясно возвращает читателя к бритве.
