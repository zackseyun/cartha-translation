base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/006.yaml
  text: Let us go up against Judah[a], and terrify her, and break her open for ourselves[b], and make the son of Tabeel king in her midst.
translation:
  language: ru
  text: «Поднимемся против Иудеи, устрашим её[a], пробьём в ней брешь для себя[b] и поставим в ней царём сына Тавеила».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «приведём её в ужас», «посеем в ней смятение» или «измучим её». Еврейский глагол труден для истолкования; в основном тексте он понят как указание на внушение страха.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «проломим её для себя» или «расколем её для себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲלֶה בִיהוּדָה
  choice: Поднимемся против Иудеи
  rationale: В военном контексте עלה с предлогом ב обозначает выступление или поход против страны. «Поднимемся против» сохраняет образ исходного выражения и ясно передаёт враждебное наступление.
- source_word: וּנְקִיצֶנָּה
  choice: устрашим её
  rationale: 'Редкая и трудная форма от קוץ здесь, вероятно, имеет каузативный смысл: вызвать страх, ужас или смятение. «Устрашим» естественно звучит по-русски и не ослабляет военную угрозу.'
- source_word: וְנַבְקִעֶנָּה אֵלֵינוּ
  choice: пробьём в ней брешь для себя
  rationale: בקע означает раскалывать, рассекать или проламывать. В контексте осады выражение о пробитой бреши передаёт насильственный захват, а «для себя» отражает אֵלֵינוּ как указание на выгоду и присвоение завоевателями.
- source_word: וְנַמְלִיךְ מֶלֶךְ
  choice: поставим … царём
  rationale: Каузативная форма מלך означает возвести или поставить кого-либо царём. Русская конструкция кратка, естественна и точно передаёт намерение установить своего правителя.
- source_word: בְּתוֹכָהּ
  choice: среди неё
  rationale: Женский суффикс относится к Иудее. Формулировка сохраняет олицетворение и грамматический род исходного текста.
- source_word: בֶּן טָבְאַל
  choice: сына Тавеила
  rationale: בֶּן употреблено как нарицательное «сын», а имя טָבְאַל передано принятой для библейского имени русской транслитерацией «Тавеил».
theological_decisions:
- issue: Олицетворение Иудеи и женские местоименные суффиксы
  choice: 'Сохранить женский род: «её», «в ней», «среди неё»'
  alternative: Передать Иудею безлично либо заменить местоимения повторением названия страны
  rationale: Еврейский текст последовательно использует женские суффиксы применительно к Иудее. Их сохранение передаёт олицетворение текста, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранена форма прямой речи с последовательными глаголами совместного намерения; военная образность передана без архаизмов и без сглаживания неоднозначных еврейских глаголов.
