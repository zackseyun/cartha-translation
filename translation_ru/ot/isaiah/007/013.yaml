source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר שִׁמְעוּ נָ֖א בֵּ֣ית דָּוִ֑ד הַ/מְעַ֤ט מִ/כֶּם֙ הַלְא֣וֹת אֲנָשִׁ֔ים כִּ֥י תַלְא֖וּ גַּ֥ם אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/013.yaml
  text: And he said[a], “Listen, please, house of David! Is it too little for you to weary men[b], that you also weary my God?”
translation:
  language: ru
  text: 'И сказал он: «Послушайте же, дом Давида! Неужели вам мало утомлять людей[b], что вы утомляете ещё и моего Бога?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве для вас мало утомлять людей, что вы утомляете ещё и моего Бога?»'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать «людей» или, в зависимости от контекста, «мужчин»; здесь люди противопоставлены Богу.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал он
  rationale: Сохранена обычная повествовательная формула с местоимением, поскольку говорящий определяется контекстом; значение последовательности не усиливается сверх еврейского текста.
- source_word: שִׁמְעוּ נָא
  choice: Послушайте же
  rationale: Множественное повелительное наклонение передано прямо, а частица נָא — естественной русской частицей «же», выражающей настойчивое обращение без архаичного оттенка.
- source_word: בֵּית דָּוִד
  choice: дом Давида
  rationale: Выражение обозначает династию и весь царский дом, а не только физическое жилище.
- source_word: הַמְעַט מִכֶּם
  choice: Неужели вам мало
  rationale: 'Естественная русская риторическая формула сохраняет вопросительную силу и смысл: адресаты считают уже совершённое недостаточным.'
- source_word: הַלְאוֹת ... תַלְאוּ
  choice: утомлять ... утомляете
  rationale: Повтор одного русского корня сохраняет намеренный лексический повтор еврейского לאה и нарастание упрёка.
- source_word: אֲנָשִׁים
  choice: людей
  rationale: В данном противопоставлении слово обозначает людей в отличие от Бога. Русское «мужей» неоправданно сужало бы значение до взрослых мужчин и звучало бы архаично.
- source_word: כִּי
  choice: что
  rationale: Союз естественно связывает две части риторического вопроса и передаёт переход к ещё более тяжкому действию.
- source_word: גַּם
  choice: ещё и
  rationale: 'Передано усиление и нарастание: к утомлению людей добавляется утомление Бога.'
- source_word: אֶת אֱלֹהָי
  choice: моего Бога
  rationale: Сохранён явный суффикс первого лица, важный для личной и пророческой позиции говорящего.
theological_decisions:
- issue: Противопоставление אֲנָשִׁים и אֱלֹהָי
  choice: людей ... моего Бога
  alternative: мужей ... моего Бога
  rationale: «Людей» ясно сохраняет противопоставление человеческого и Божьего, не вводя в русский текст более узкого значения, будто речь идёт исключительно о мужчинах.
- issue: Личное обозначение Бога в אֱלֹהָי
  choice: моего Бога
  alternative: Бога
  rationale: Притяжательное значение исходного текста сохранено, чтобы не сглаживать личную позицию пророка по отношению к дому Давида.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Обращение «дом Давида» сохранено как библейское династическое обозначение; повтор «утомлять — утомляете» намеренно удерживает риторическую структуру оригинала.
