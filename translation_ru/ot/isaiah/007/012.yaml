id: ISA.7.12
reference: Isaiah 7:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אָחָ֑ז לֹא אֶשְׁאַ֥ל וְ/לֹֽא אֲנַסֶּ֖ה אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/012.yaml
  text: But Ahaz said[a], “I will not ask[b], and I will not test Yahweh.”
translation:
  language: ru
  text: 'Но Ахаз сказал: «Я не стану просить и не буду испытывать[a] Яхве[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвергать испытанию».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте стоит имя יהוה (ЙХВХ), которое также традиционно передают как «ГОСПОДЬ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но … сказал
  rationale: 'Форма продолжает повествование, а союз ו в данном контексте имеет противительный оттенок: Ахаз отказывается воспользоваться только что данным ему повелением просить знамения.'
- source_word: אָחָז
  choice: Ахаз
  rationale: Имя передано в принятой русской библейской форме.
- source_word: לֹא אֶשְׁאַל
  choice: Я не стану просить
  rationale: Глагол שׁאל означает «просить, запрашивать»; здесь речь о предложении попросить у Бога знамение. Конструкция «не стану» естественно передаёт выраженное решение Ахаза.
- source_word: וְלֹא אֲנַסֶּה
  choice: и не буду испытывать
  rationale: В породе пиэль נסה означает «испытывать, подвергать испытанию». «Искушать» в современном русском может ошибочно подразумевать склонение ко злу.
- source_word: אֶת יְהוָה
  choice: Яхве
  rationale: Показатель прямого дополнения אֶת отдельно не переводится; личное имя Бога יהוה передано транслитерацией «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Транслитерация сохраняет различие между именем יהוה и титулом אֲדֹנָי.
- issue: Смысл אֲנַסֶּה применительно к Богу
  choice: испытывать
  alternative: искушать; подвергать испытанию
  rationale: Выбранный вариант сохраняет значение проверки или испытания и не привносит современного смысла побуждения к греху. Более развёрнутый вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Реплика звучит естественно и сохраняет краткость оригинала; противительный союз передаёт отказ Ахаза в контексте предыдущего стиха.
