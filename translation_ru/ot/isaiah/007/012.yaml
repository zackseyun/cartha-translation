  source_fidelity: 'Текст точно передаёт еврейский оригинал: וַיֹּאמֶר передано контекстуально оправданным «Но ... сказал»; обе формы 1-го лица передают решительный отказ Ахаза; נסה в пиэле корректно передано как «испытывать», без неуместного современного оттенка «искушать». Имя יהוה последовательно передано как «Яхве».'
