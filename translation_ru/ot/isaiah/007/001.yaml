  to: 'И было во дни Ахаза, царя Иудеи, сына Иоафама, сына Озии: Рецин, царь Арама[a], и Факей, сын Ремалии, царь Израиля, двинулись на Иерусалим, чтобы воевать против него, но он не смог воевать против него[b].'
