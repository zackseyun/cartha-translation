source:
  edition: WLC
  text: וַ/יְהִ֡י בִּ/ימֵ֣י אָ֠חָז בֶּן יוֹתָ֨ם בֶּן עֻזִּיָּ֜הוּ מֶ֣לֶךְ יְהוּדָ֗ה עָלָ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֤הוּ מֶֽלֶךְ יִשְׂרָאֵל֙ יְר֣וּשָׁלִַ֔ם לַ/מִּלְחָמָ֖ה עָלֶ֑י/הָ וְ/לֹ֥א יָכֹ֖ל לְ/הִלָּחֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/001.yaml
  text: And it happened in the days of Ahaz son of Jotham[a], son of Uzziah, king of Judah, that Rezin king of Aram and Pekah son of Remaliah, king of Israel, went up to Jerusalem to wage war against it[b], but they were not able to fight against it.
translation:
  language: ru
  text: 'И было во дни Ахаза, царя Иудеи, сына Иоафама, сына Озии: Рецин, царь Арама[a], и Факей, сын Ремалии, царь Израиля, двинулись на Иерусалим, чтобы воевать против него, но он не смог воевать против него[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Арам»; традиционный вариант — «Сирия».'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте сказуемое стоит в единственном числе: «он не смог», хотя перед этим названы Рецин и Факей вместе. В некоторых переводах: «они не смогли».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Сохраняет формулу начала исторического повествования, оставаясь понятной и достойной по стилю.
- source_word: בִּימֵי
  choice: во дни
  rationale: Передаёт еврейский временной оборот близко к форме оригинала; выражение уместно в современном литературном библейском регистре.
- source_word: אָחָז ... יוֹתָם ... עֻזִּיָּהוּ
  choice: Ахаз, сын Иоафама, сын Озии
  rationale: Использованы укоренившиеся русские формы библейских имён; родословная цепочка сохранена.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Рецин, царь Арама
  rationale: «Арам» непосредственно передаёт древнееврейское этногеографическое название и не подменяет его позднейшим названием «Сирия».
- source_word: עָלָה ... יְרוּשָׁלִַם
  choice: поднялись к Иерусалиму
  rationale: Глагол сохраняет пространственный оттенок восхождения к Иерусалиму и в контексте обозначает военный поход; множественное число естественно согласует сказуемое с двумя названными царями.
- source_word: לַמִּלְחָמָה עָלֶיהָ
  choice: чтобы воевать против него
  rationale: Целевая конструкция передана естественным русским оборотом; местоимение согласовано с русским родом слова «Иерусалим».
- source_word: וְלֹא יָכֹל
  choice: но он не смог
  rationale: Сохранено единственное число масоретского текста, несмотря на предшествующие два субъекта, чтобы не устранять грамматическую неоднозначность оригинала.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: сразиться с ним
  rationale: Передаёт военное значение глагола לחם и направленность действия против Иерусалима без добавления результата, прямо не выраженного в тексте.
theological_decisions:
- issue: Передача אֲרָם
  choice: Арам
  alternative: Сирия
  rationale: Выбрано историческое название, непосредственно соответствующее древнееврейскому тексту; традиционный вариант указан в примечании.
- issue: Единственное число יָכֹל после составного субъекта
  choice: он не смог
  alternative: они не смогли
  rationale: Единственное число оригинала сохранено, поскольку оно может относиться к одному из царей или представлять составной субъект как единое целое; перевод не устраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским началом «И было во дни». Имена даны в общеупотребительных русских библейских формах. Синтаксис сделан ясным для обычного читателя, при этом необычное единственное число в заключительной части сохранено и пояснено.
