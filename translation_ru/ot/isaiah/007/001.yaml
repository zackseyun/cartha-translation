  naturalness: «Двинулись на Иерусалим» — естественный современный русский военный оборот. Повтор «воевать против него» оправдан повтором направленного действия в еврейском тексте; необычное единственное число «он не смог» сохранено намеренно и пояснено.
  terminology: Традиционные русские формы имён Ахаз, Иоафам, Озия, Рецин, Факей и Ремалия приемлемы. «Арам» верно передаёт אֲרָם; примечание корректно отмечает традиционное «Сирия».
