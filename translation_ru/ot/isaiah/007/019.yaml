lexical_decisions:
- source_word: וּבָאוּ
  choice: прилетят
  rationale: Глагол буквально означает «придут», но в контексте мух и пчёл (ст. 18) естественное русское соответствие — «прилетят».
- source_word: וְנָחוּ
  choice: и усядутся
  rationale: נוח обозначает прекращение движения и покой; применительно к роям передаёт то, что они опускаются и располагаются в названных местах.
- source_word: כֻלָּם
  choice: все они
  rationale: 'Сохраняет выраженную в еврейском тексте полноту: явятся все призванные рои.'
- source_word: בְּנַחֲלֵי הַבַּתּוֹת
  choice: в крутых ущельях
  rationale: נחלים здесь обозначает русла, овраги или ущелья, а редкое הַבַּתּוֹת, вероятно, характеризует их как обрывистые или труднодоступные; неопределённость отмечена в сноске.
- source_word: וּבִנְקִיקֵי הַסְּלָעִים
  choice: в расселинах скал
  rationale: Точно и естественно передаёт сочетание существительных со значениями «трещины, расселины» и «скалы».
- source_word: וּבְכֹל הַנַּעֲצוּצִים
  choice: среди всех колючих кустов
  rationale: Редкое существительное обозначает колючую растительность; «колючие кусты» понятно современному читателю и подходит к месту, где могут усесться рои.
- source_word: וּבְכֹל הַנַּהֲלֹלִים
  choice: у всех водопоев
  rationale: Значение редкого слова не вполне ясно; «водопои» — вероятное контекстуальное толкование, при этом другие основные варианты сохранены в сноске.
