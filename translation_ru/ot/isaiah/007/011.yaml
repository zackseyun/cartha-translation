base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/011.yaml
  text: 'Ask for yourself a sign from Yahweh your God: make it as deep as Sheol or as high as heaven[a].'
translation:
  language: ru
  text: 'Попроси себе знамение у Яхве, твоего Бога: хоть из глубин Шеола, хоть с высот вверху[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделай глубоким — до Шеола — или сделай высоким — вверх». Еврейская конструкция выражает крайние пределы; слово «небеса» в этом стихе прямо не употреблено.'
    reason: Сноска поясняет необычные повелительные формы и направительную форму «к Шеолу», не вводя «небеса» в основной текст.
lexical_decisions:
- source_word: שְׁאַל לְךָ
  choice: Попроси себе
  rationale: Императив обращён к Ахазу, а местоимение с לְ придаёт просьбе личную направленность; «попроси себе» естественно передаёт обе черты.
- source_word: אוֹת
  choice: знамение
  rationale: В пророческом контексте это данный Богом подтверждающий знак; «знамение» сохраняет библейскую значимость слова без пояснительного расширения.
- source_word: מֵעִם יְהוָה אֱלֹהֶיךָ
  choice: у Яхве, твоего Бога
  rationale: מֵעִם обозначает источник просьбы, что по-русски естественно выражается конструкцией «попросить у»; личное имя יהוה передано как «Яхве».
- source_word: הַעְמֵק שְׁאָלָה
  choice: пусть оно будет хоть из самой глубины
  rationale: Фраза буквально связывает просьбу с углублением и допускает понимание предельно глубокой области. Перевод сохраняет пространственный контраст, не вводя прямо не написанное здесь слово «Шеол».
- source_word: אוֹ הַגְבֵּהַּ לְמָעְלָה
  choice: хоть с самой высоты
  rationale: Сочетание каузативного «сделай высоким» и «вверх» выражает верхний предел; естественная русская формулировка сохраняет параллелизм с «из самой глубины».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Толкование противопоставления глубины и высоты
  choice: из самой глубины… с самой высоты
  alternative: глубоко до Шеола… высоко до небес; углуби просьбу… возвысь её вверх
  rationale: Еврейский текст указывает на крайние пределы, но прямо не называет ни небо, ни — при данной орфографии — Шеол. Основной текст передаёт меризм естественно и сохраняет его образную открытость; буквальная форма и традиционное понимание отмечены в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Повтор «хоть… хоть…» естественно передаёт неограниченный выбор между двумя крайностями; обращение «твоего Бога» сохранено в единственном числе.
