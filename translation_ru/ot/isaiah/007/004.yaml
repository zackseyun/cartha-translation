  text: וְ/אָמַרְתָּ֣ אֵ֠לָי/ו הִשָּׁמֵ֨ר וְ/הַשְׁקֵ֜ט אַל תִּירָ֗א וּ/לְבָבְ/ךָ֙ אַל יֵרַ֔ךְ מִ/שְּׁנֵ֨י זַנְב֧וֹת הָ/אוּדִ֛ים הָ/עֲשֵׁנִ֖ים הָ/אֵ֑לֶּה בָּ/חֳרִי אַ֛ף רְצִ֥ין וַ/אֲרָ֖ם וּ/בֶן רְמַלְיָֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/004.yaml
  text: and say to him[a], ‘Be careful and stay calm. Do not fear, and do not let your heart be faint because of these two smoldering stubs of firebrands—because of the burning anger of Rezin and Aram, and the son of Remaliah.’
translation:
  language: ru
  text: 'И скажи ему: «Будь начеку и сохраняй спокойствие. Не бойся; пусть сердце твоё не слабеет из-за этих двух дымящихся обгорелых концов головней — из-за пылающего гнева Рецина и Арама, и сына Ремальи».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: Будь осмотрителен
  rationale: Возвратный императив здесь призывает к внимательности и осторожности; выражение естественно по-русски и сохраняет повелительную силу.
- source_word: וְהַשְׁקֵט
  choice: сохраняй спокойствие
  rationale: В обстановке военной и политической угрозы глагол означает состояние покоя и невозмутимости, а не просто молчание.
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Прямой и естественный русский эквивалент отрицательного повеления.
- source_word: וּלְבָבְךָ אַל יֵרַךְ
  choice: пусть сердце твоё не робеет
  rationale: Идиома буквально говорит о том, чтобы сердце не становилось мягким или слабым, то есть чтобы человек не терял мужества; «не робеет» передаёт этот смысл и сохраняет образ сердца.
- source_word: מִשְּׁנֵי זַנְבוֹת הָאוּדִים הָעֲשֵׁנִים
  choice: из-за этих двух дымящихся огарков головней
  rationale: Сохранены и буквальный образ «хвостов/концов», переданный словом «огарки», и обозначение обгорелых горящих поленьев. Образ представляет врагов ещё дымящимися, но почти угасшими.
- source_word: בָּחֳרִי אַף
  choice: из-за пылающего гнева
  rationale: Передаёт идиому сильного гнева и поддерживает огненный образ предшествующей метафоры.
- source_word: רְצִין וַאֲרָם וּבֶן רְמַלְיָהוּ
  choice: Рецина, Арама и сына Ремальи
  rationale: Сохранено косвенное и пренебрежительно звучащее обозначение Факея как «сына Ремальи» без подстановки его имени. Синтаксис допускает понимание Рецина вместе с Арамом и сына Ремальи как источников ярости.
theological_decisions:
- issue: Сохранение образа почти угасших врагов
  choice: Метафора «два дымящихся огарка головней» оставлена в основном тексте.
  alternative: 'Передать смысл разъяснительно: «две угасающие угрозы».'
  rationale: Пророческая сила стиха связана с Божьей оценкой устрашающих царей как почти догоревших головней; разъяснительный перевод ослабил бы образ и иронию.
- issue: Связь Рецина с Арамом в заключительной фразе
  choice: «Рецина, Арама и сына Ремальи»
  alternative: '«Рецина и Арама, и сына Ремальи» либо истолковать как две стороны: Рецина с Арамом и сына Ремальи.'
  rationale: Еврейская координация лаконична и допускает некоторую синтаксическую напряжённость. Перевод сохраняет перечисление, не добавляя отсутствующих в тексте пояснений.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Порядок «сердце твоё» поддерживает достоинство речи, не делая её архаичной; метафора оригинала сохранена и пояснена сноской.
