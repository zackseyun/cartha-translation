base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/009.yaml
  text: And the head of Ephraim is Samaria[a], and the head of Samaria is the son of Remaliah. If you do not believe[b], surely you will not be established.
translation:
  language: ru
  text: Во главе Ефрема — Самария, а во главе Самарии — сын Ремалии. Если вы не верите[a], то не устоите.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте глаголы «верите» и «устоите» образованы от одного корня (אמן), связывающего веру или доверие с твёрдостью и устойчивостью.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Если вы не будете доверять, то не будете стоять твёрдо».'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאשׁ
  choice: глава
  rationale: 'Сохранена политическая метафора и параллель: «глава Ефрема… глава Самарии». Слово подходит и к городу, и к правителю, тогда как «столица» не подходит ко второй части.'
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено собственное имя, которым здесь обозначено северное царство, без подстановки толкования «Израиль» в основной текст.
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Употреблено общепринятое русское название города, являвшегося столицей Ефрема.
- source_word: בֶּן רְמַלְיָהוּ
  choice: сын Ремалии
  rationale: Сохранено данное в еврейском тексте именование правителя по отцу; имя Факей не добавлено, поскольку пророк намеренно его не употребляет.
- source_word: אִם לֹא
  choice: если … не
  rationale: Оборот понят как условное придаточное, что сохраняет синтаксис и риторическую связь двух форм корня אמן.
- source_word: תַאֲמִינוּ
  choice: не будете верить
  rationale: Форма Hiphil от אמן передаёт веру и доверие. «Верить» естественно без явно названного объекта и не вносит позднейшей догматической терминологии.
- source_word: כִּי
  choice: то
  rationale: В русском условном предложении «то» естественно обозначает переход к следствию; оно передаёт аподотическую функцию частицы без вводящего в заблуждение причинного «ибо».
- source_word: תֵאָמֵנוּ
  choice: не устоите
  rationale: Форма Niphal от אמן означает быть твёрдым, устойчивым, прочно стоять. «Не устоите» ясно передаёт предупреждение, хотя общность еврейского корня с «верить» приходится пояснить в сноске.
theological_decisions:
- issue: Игра слов между двумя формами корня אמן
  choice: Если вы не будете верить, то не устоите
  alternative: Если вы не будете доверять, то не будете стоять твёрдо
  rationale: Перевод сохраняет различие между верой/доверием и устойчивостью, а также краткость пророческого предупреждения. Полностью воспроизвести однокоренную игру слов по-русски без неестественной формулировки невозможно, поэтому она отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм первой половины сохранён; архаичное, но понятное политическое слово «глава» оправдано метафорой оригинала. Во второй половине выбрана краткая и естественная формулировка.
