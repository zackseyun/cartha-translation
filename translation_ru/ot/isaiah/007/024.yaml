base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/024.yaml
  text: One will come there with arrows and with a bow[b][a], because all the land will become briers and thorns.
translation:
  language: ru
  text: Туда будут приходить[a] со стрелами и луком, потому что вся земля зарастёт колючими кустарниками и терновником[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «он придёт»; форма глагола единственного числа может употребляться в обобщённом значении.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вся земля будет колючими кустарниками и терновником».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחִצִּים וּבַקֶּשֶׁת
  choice: со стрелами и луком
  rationale: Предлог ב передаёт оснащение или средство; в современном русском сочетание «со стрелами и луком» естественно описывает человека, вооружённого для охоты или защиты.
- source_word: יָבוֹא
  choice: будут приходить[a]
  rationale: Еврейский глагол стоит в 3-м лице единственного числа, но может иметь обобщённое значение. Русское неопределённо-личное множественное число естественно передаёт это значение без введения отсутствующего в тексте подлежащего.
- source_word: שָׁמָּה
  choice: туда
  rationale: Форма обозначает направление движения — «туда», а не только местонахождение «там».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой в эту местность будут приходить вооружёнными.
- source_word: שָׁמִיר וָשַׁיִת
  choice: колючником и терновником
  rationale: Устойчивая у Исаии пара обозначает колючую растительность на запустевшей, необрабатываемой земле; выбранные слова сохраняют образ и порядок компонентов.
- source_word: תִּהְיֶה
  choice: станет
  rationale: Хотя буквально возможно «будет», в контексте суда глагол описывает переход прежде возделанной земли в запустение.
- source_word: כָל הָאָרֶץ
  choice: вся земля
  rationale: Речь идёт обо всей земле или местности в пределах описываемого бедствия, а не обязательно обо всём мире.
