base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/017.yaml
  text: Yahweh will bring upon you[a], upon your people[b], and upon your father's house days unlike any that have not come since the day Ephraim turned away from Judah—namely, the king of Assyria.
translation:
  language: ru
  text: Яхве наведёт на тебя, на твой народ и на дом твоего отца такие дни, каких не бывало со дня отделения Ефрема от Иуды; наведёт царя Ассирии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָבִיא
  choice: наведёт
  rationale: Каузативная форма от בוא означает «привести, вызвать приход». В контексте грядущего бедствия русское «наведёт» естественно передаёт как причинность, так и угрожающий смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: עָלֶיךָ ... וְעַל עַמְּךָ ... וְעַל בֵּית אָבִיךָ
  choice: на тебя, на твой народ и на дом твоего отца
  rationale: Повторное עַל передано естественной русской конструкцией с общим управлением глагола «наведёт»; «дом твоего отца» сохраняет семейно-династический образ исходного текста.
- source_word: יָמִים אֲשֶׁר לֹא בָאוּ
  choice: такие дни, каких не бывало
  rationale: Идиоматическая русская передача буквально отрицательной конструкции выражает беспрецедентность грядущего времени без неестественного двойного отрицания.
- source_word: לְמִיּוֹם סוּר אֶפְרַיִם מֵעַל יְהוּדָה
  choice: со дня отделения Ефрема от Иуды
  rationale: Субстантивированная форма סוּר обозначает удаление или отпадение. «Отделение» близко к лексическому смыслу и ясно указывает на исторический раскол, не усиливая его до более толковательного «мятежа».
- source_word: אֵת מֶלֶךְ אַשּׁוּר
  choice: царя Ассирии
  rationale: Заключительная группа называет конкретное орудие грядущего бедствия. Тире сохраняет резкую аппозиционную конструкцию еврейского текста, не добавляя пояснительного слова.
theological_decisions:
- issue: Синтаксическая связь слов «царя Ассирии»
  choice: Сохранить их как финальное уточнение грядущих дней бедствия после тире.
  alternative: 'Понять царя Ассирии как отдельное прямое дополнение к глаголу: «наведёт... царя Ассирии».'
  rationale: Начальное יָבִיא допускает связь с далёким אֵת מֶלֶךְ אַשּׁוּר, тогда как יָמִים также выступает объектом. Резкое финальное уточнение сохраняет синтаксическое напряжение и не вынуждает выбрать исключительно одну из тесно связанных функций.
- issue: Значение «дома отца» применительно к Ахазу
  choice: Сохранить буквальный семейно-родовой образ без замены на «династию».
  alternative: Передать как «царский дом» или «династия».
  rationale: В контексте выражение может включать династию Давида, но исходный текст формулирует это шире и образнее; конкретизацию не следует вносить без необходимости.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Формулировка понятна обычному читателю, избегает архаизмов и вместе с тем сохраняет повтор, образ «дома» и резкий финал исходного текста.
