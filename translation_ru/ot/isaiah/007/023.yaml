base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/023.yaml
  text: And in that day[b][a], every place where there were a thousand vines worth a thousand pieces of silver will become briars and thorns.
translation:
  language: ru
  text: 'И будет в тот день: всякое место, где когда-то росли тысяча виноградных лоз стоимостью в тысячу серебра[a], зарастёт колючками и терновником.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за тысячу серебра». Какая именно денежная единица имеется в виду, в еврейском тексте не сказано.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «где будет тысяча виноградных лоз стоимостью в тысячу серебра». Еврейскую глагольную форму можно понять как будущее время, однако контекст, вероятнее всего, противопоставляет когда-то ценный виноградник его грядущему запустению.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохраняет пророческую временную формулу и вводную конструкцию, звуча при этом естественно и торжественно по-русски.
- source_word: כָל מָקוֹם
  choice: всякое место
  rationale: Передаёт распределительное значение כָל и соответствует литературному русскому регистру.
- source_word: אֲשֶׁר יִהְיֶה שָּׁם
  choice: где прежде росла
  rationale: Имперфект допускает буквальное будущее «где будет», однако контекст противопоставляет ценное возделанное место его грядущему запустению. Слово «росла» естественно согласуется с лозами, а «прежде» явно выражает относительное прошлое.
- source_word: אֶלֶף גֶּפֶן
  choice: тысяча виноградных лоз
  rationale: «Виноградные лозы» точно и понятно передают גֶּפֶן, избегая возможной неясности общего слова «лозы».
- source_word: בְּאֶלֶף כָּסֶף
  choice: стоимостью в тысячу серебряных монет
  rationale: Предлог בְּ здесь передаёт оценку или цену. Название денежной единицы в еврейском тексте не указано, поэтому нейтральное «серебряных монет» не уточняет её как сикли.
- source_word: לַשָּׁמִיר וְלַשַּׁיִת
  choice: зарастёт колючками и терновником
  rationale: Передаёт образ заброшенной земли, покрывшейся колючей растительностью; точное ботаническое различие между двумя словами не вполне определённо.
- source_word: יִהְיֶה
  choice: зарастёт
  rationale: Контекст подразумевает переход от виноградника к запустению. «Зарастёт» естественно выражает этот результат, не меняя образа стиха.
theological_decisions:
- issue: Временное значение אֲשֶׁר יִהְיֶה שָּׁם
  choice: 'Основной текст передаёт прежнее состояние: «где прежде росла».'
  alternative: «где будет тысяча виноградных лоз»
  rationale: Еврейская форма сама по себе может обозначать будущее, но ближайший контекст суда и запустения поддерживает контраст между прежней ценностью виноградника и его будущим зарастанием. Альтернатива сохранена в примечании, чтобы не скрывать грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис сохраняет формулу «в тот день», но итоговый образ передан естественным русским глаголом «зарастёт». Маркеры примечаний стоят непосредственно после соответствующих фрагментов.
