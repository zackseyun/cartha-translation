  source_fidelity: 'Основной смысл передан верно: пророческая формула, ценность виноградников и их превращение в заросли колючих растений сохранены. Однако «серебряных монет» излишне конкретизирует כֶּסֶף, которое означает «серебро» и не называет ни монет, ни единицы веса. Кроме того, «где прежде росла тысяча ... лоз» грамматически допустимо, но несколько неуклюже: коллективное «тысяча лоз» лучше соотнести со сказуемым во множественном числе («росли»).'
