  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא יְחַיֶּה אִ֛ישׁ עֶגְלַ֥ת בָּקָ֖ר וּ/שְׁתֵּי צֹֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/021.yaml
  text: And in that day a man will keep alive a young cow and two sheep[a][b].
translation:
  language: ru
  text: 'И будет в тот день: человек будет содержать молодую корову[a] и две головы мелкого скота[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тёлку». Еврейское выражение обозначает молодую самку крупного рогатого скота.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское צֹאן — собирательное название мелкого скота, обычно овец и коз.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет обычную пророческую формулу и будущую направленность, не утяжеляя русский текст выражением «и произойдёт».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная для русского библейского регистра передача устойчивого пророческого обозначения времени.
- source_word: יְחַיֶּה
  choice: будет содержать
  rationale: Порода חיה здесь означает поддерживать жизнь животного, кормить и сохранять его; «содержать» естественно передаёт это применительно к домашнему скоту, не внося идеи разведения.
- source_word: אִישׁ
  choice: человек
  rationale: В данном обобщённом высказывании אִישׁ обозначает отдельного представителя народа; русское «человек» сохраняет единственное число и звучит естественнее, чем излишне конкретное «мужчина».
- source_word: עֶגְלַת בָּקָר
  choice: молодую корову
  rationale: Фраза обозначает молодую самку крупного рогатого скота. Эта передача понятна современному читателю; более точный животноводческий термин дан в примечании.
- source_word: וּשְׁתֵּי צֹאן
  choice: и две головы мелкого скота
  rationale: צֹאן — собирательное обозначение мелкого скота, включающего овец и коз. Счётная конструкция «две головы» позволяет сохранить родовую неопределённость еврейского слова.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим ритмом. Двоеточие после временной формулы делает синтаксис ясным. Формулировка избегает искусственного сужения צֹאן до одних овец и сохраняет конкретность крайне малого числа животных.
