  text: He will eat curds and honey by the time he knows to refuse the evil and choose the good[a][b].
translation:
  language: ru
  text: Он будет есть творог и мёд к тому времени, когда будет уметь отвергать зло и выбирать добро[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до того времени, когда он будет уметь отвергать зло и выбирать добро». Еврейское выражение может указывать на время, до которого это будет продолжаться.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово может также означать «сливки» или «масло»; в широком смысле речь идёт о молочном продукте.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: кислое молоко
  rationale: Слово обозначает молочный продукт, вероятно сквашенное или свернувшееся молоко, а не современное сливочное масло; этот вариант естественен в сочетании с мёдом.
- source_word: וּדְבַשׁ
  choice: и мёд
  rationale: Прямой и обычный эквивалент; союз сохранён.
- source_word: יֹאכֵל
  choice: будет есть
  rationale: Форма yiqtol передана будущим временем в соответствии с пророческим контекстом о ребёнке.
- source_word: לְדַעְתּוֹ
  choice: когда научится
  rationale: Предлог ל при инфинитиве с местоименным суффиксом допускает временное понимание. По-русски «когда научится» естественно выражает достижение ребёнком способности нравственно различать, не приписывая пище причинной роли.
- source_word: מָאוֹס
  choice: отвергать
  rationale: В нравственном противопоставлении речь идёт о практическом отвержении, а не об эмоциональном презрении.
- source_word: בָּרָע
  choice: зло
  rationale: Русское отвлечённое существительное без артикля естественно передаёт обобщённо-определённое еврейское выражение.
- source_word: וּבָחוֹר
  choice: и выбирать
  rationale: Естественный русский эквивалент, сохраняющий параллелизм с «отвергать».
- source_word: בַּטּוֹב
  choice: добро
  rationale: Передаёт обобщённо-определённое понятие и сохраняет нравственную пару «зло — добро».
theological_decisions:
- issue: Временное значение לְדַעְתּוֹ и его связь с пищей ребёнка и нравственным различением
  choice: «когда научится отвергать зло и выбирать добро»
  alternative: «до тех пор, пока не научится…» / «к тому времени, когда научится…»; также возможно целевое «чтобы научился…»
  rationale: Временное прочтение естественно в контексте и не утверждает, будто пища служит причиной нравственного различения. При этом примечание сохраняет возможное значение временного предела.
translation_notes:
  register: Современный литературный русский язык, простой и достойный по тону. Инфинитивы «отвергать» и «выбирать» сохраняют параллелизм оригинала; неоднозначность временной конструкции и названия молочного продукта вынесена в примечания.
