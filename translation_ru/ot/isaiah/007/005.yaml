  text: יַ֗עַן כִּֽי יָעַ֥ץ עָלֶ֛י/ךָ אֲרָ֖ם רָעָ֑ה אֶפְרַ֥יִם וּ/בֶן רְמַלְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/005.yaml
  text: Because Aram has planned evil against you, along with Ephraim and the son of Remaliah, saying,
translation:
  language: ru
  text: 'Так как Арам замыслил против тебя зло вместе с Ефремом и сыном Ремальи, говоря:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן כִּי
  choice: Так как
  rationale: Передаёт причинную связь с последующим контекстом естественным современным русским языком.
- source_word: יָעַץ עָלֶיךָ ... רָעָה
  choice: замыслил против тебя зло
  rationale: Сохраняет значение намеренного враждебного замысла и синтаксическую направленность действия против адресата.
- source_word: אֲרָם
  choice: Арам
  rationale: Передаёт древнее название государства, не подменяя его современным географическим названием.
- source_word: אֶפְרַיִם וּבֶן רְמַלְיָהוּ
  choice: вместе с Ефремом и сыном Ремальи
  rationale: Ефрем и сын Ремальи представлены как присоединившиеся к замыслу Арама; формулировка отражает необычную структуру еврейского предложения.
- source_word: לֵאמֹר
  choice: 'говоря:'
  rationale: Сохраняет ввод прямой речи, продолжающейся в следующем стихе.
theological_decisions:
- issue: Соотношение Арама, Ефрема и сына Ремальи как участников замысла
  choice: Арам — грамматический субъект; Ефрем и сын Ремальи присоединены оборотом «вместе с»
  alternative: «Арам, Ефрем и сын Ремальи замыслили»
  rationale: Единственное число глагола יָעַץ непосредственно согласуется с Арамом; выбранный вариант не сглаживает синтаксическое напряжение исходного текста.
translation_notes:
  register: Современный литературный русский; сдержанный пророческий регистр. Сохранены древние имена «Арам», «Ефрем» и патронимическое обозначение «сын Ремальи».
