  text: And in that day Yahweh will whistle for the fly that is at the far end of the streams of Egypt[b][a], and for the bee that is in the land of Assyria.
translation:
  language: ru
  text: И в тот день Яхве свистнет мухе, что у дальнего края египетских протоков, и пчеле, что в земле Ассирии.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подаст свистом знак». Еврейский глагол означает издать резкий звук, чтобы позвать или подать сигнал.'
    reason: lexical_alternative
  - marker: b
    text: Под «египетскими протоками» могут подразумеваться рукава Нила или египетские каналы.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохраняет обычную пророческую формулу и её будущую направленность, оставаясь естественной для современного литературного русского языка.
- source_word: יִשְׁרֹק
  choice: свистнет, подзывая
  rationale: Глагол обозначает резкий звук, которым зовут или подают сигнал. Сочетание передаёт и сам свист, и его призывную функцию; сноска сохраняет более буквальную альтернативу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, транслитерацией, а не заменяет его титулом.
- source_word: לַזְּבוּב
  choice: муху
  rationale: Сохранено единственное число собирательно-образного обозначения, параллельного слову «пчелу».
- source_word: אֲשֶׁר בִּקְצֵה יְאֹרֵי מִצְרָיִם
  choice: что у дальнего края египетских протоков
  rationale: «Дальний край» передаёт значение предела или удалённой оконечности; «протоки» естественно обозначают рукава Нила и связанные с ними водотоки, не сужая значение исключительно до каналов.
- source_word: וְלַדְּבוֹרָה
  choice: и пчелу
  rationale: Сохранено единственное число и параллелизм образов мухи и пчелы.
- source_word: אֲשֶׁר בְּאֶרֶץ אַשּׁוּר
  choice: что в земле Ассирии
  rationale: Сохраняет конкретное территориальное выражение исходного текста без пояснительного расширения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное Божье имя, непосредственно представленное в еврейском тексте.
- issue: Образы мухи и пчелы
  choice: Сохранить образный призыв мухи и пчелы без прямого отождествления с войсками или державами
  alternative: Пояснить в основном тексте, что муха означает Египет, а пчела — Ассирию
  rationale: Контекст допускает политико-военное понимание, но сам стих выражает его посредством образов; явное истолкование устранило бы намеренную образность текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Двоеточие после временной формулы ясно вводит действие; образность и единственное число исходного текста сохранены.
