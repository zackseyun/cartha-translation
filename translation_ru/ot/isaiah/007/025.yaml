base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/025.yaml
  text: And as for all the hills that used to be hoed with a hoe[a], you will not go there for fear of briers and thorns[d][c][b]; they will become a place for the sending out of oxen and for the trampling of sheep.
translation:
  language: ru
  text: А на все холмы, которые прежде обрабатывали мотыгой[a], не пойдут из страха перед колючими кустарниками и терновником[b]. Там будут выпускать волов, и мелкий скот будет топтать землю[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые обрабатывали мотыгой»; в еврейском тексте употреблены однокоренные существительное и глагол.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ты не придёшь туда»; форма второго лица может иметь здесь обобщённое значение: «туда не пойдут».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «овцы». Еврейское слово שֶׂה может обозначать овцу или козу, то есть животное из мелкого скота.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הֶהָרִים
  choice: А на все холмы
  rationale: Сочетание וְכֹל вводит следующий элемент картины запустения, а הַר в земледельческом контексте естественно передать как «холм». Предлог «на» обусловлен русским выражением движения «пойти на холмы».
- source_word: אֲשֶׁר בַּמַּעְדֵּר יֵעָדֵרוּן
  choice: которые прежде обрабатывали мотыгой
  rationale: מַעְדֵּר обозначает мотыгу или подобное земледельческое орудие, а глагол עדר — обработку им. «Прежде» выявляет контраст между прежним возделыванием и предстоящим запустением, подразумеваемый контекстом.
- source_word: לֹא תָבוֹא שָׁמָּה
  choice: не пойдут
  rationale: Форма 2-го лица ед. числа здесь допускает обобщённое значение. Неопределённо-личная русская конструкция передаёт его естественнее буквального «ты не пойдёшь».
- source_word: יִרְאַת שָׁמִיר וָשַׁיִת
  choice: из страха перед терновником и колючками
  rationale: Конструкция выражает причину избегания. Парные слова обозначают разросшуюся колючую растительность; перевод сохраняет два образа, не пытаясь чрезмерно точно определить ботанические виды.
- source_word: וְהָיָה לְמִשְׁלַח שׁוֹר
  choice: Там будут выпускать волов
  rationale: מִשְׁלַח передаёт выпускание животных на простор. Конкретная глагольная формулировка по-русски естественнее отвлечённого «место для выпускания» и не сводит образ только к понятию пастбища.
- source_word: וּלְמִרְמַס שֶׂה
  choice: и мелкий скот будет топтать их
  rationale: מִרְמַס означает попирание или вытаптывание, а שֶׂה может обозначать отдельное животное из мелкого скота — овцу либо козу. Собирательное «мелкий скот» сохраняет эту широту.
