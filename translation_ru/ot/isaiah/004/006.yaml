- from: И будет укрытие, дающее днём тень от зноя[a], и убежище, и потаённое место от бури[b] и дождя.
  to: 'И будет укрытие: тень днём от зноя, убежище и защита от бури[b] и дождя.'
  rationale: Заменено не вполне естественное и излишне специфичное «потаённое место» на «защита». Синтаксис уплотнён так, чтобы передать единое укрытие, служащее тенью, убежищем и защитой. Сноска a сохранена как исходная лексическая альтернатива для חֹרֶב, но её якорь в основном тексте отсутствует; для сохранения структурной согласованности якорь следует поставить после «зноя».
