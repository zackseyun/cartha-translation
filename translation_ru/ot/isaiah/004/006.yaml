base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/006.yaml
  text: And there will be a shelter for shade by day from heat[c][b][a], and for a refuge and a hiding place from storm and from rain.
translation:
  language: ru
  text: 'И будет укрытие: тень днём от зноя, убежище и защита от бури[b] и дождя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «от бурного потока»; возможно также: «от ливня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סֻכָּה
  choice: укрытие
  rationale: 'Слово обозначает крытое сооружение, часто временное: шалаш или навес. В данном контексте «укрытие» естественно передаёт его защитную функцию, не сужая образ до конкретного типа сооружения.'
- source_word: תִּהְיֶה
  choice: будет
  rationale: Простая форма будущего времени; русская конструкция «И будет укрытие» сохраняет поэтический порядок и звучит естественно.
- source_word: לְצֵל
  choice: дающее ... тень
  rationale: Буквально «для тени». Причастный оборот ясно и естественно выражает назначение укрытия в русском предложении.
- source_word: יוֹמָם
  choice: днём
  rationale: Кратко передаёт наречное значение дневного времени и сохраняет поэтическую сжатость.
- source_word: מֵחֹרֶב
  choice: от зноя
  rationale: В контексте защиты от непогоды существительное обозначает иссушающий, палящий жар; «зной» точнее и выразительнее общего слова «жара».
- source_word: מַחְסֶה
  choice: убежище
  rationale: Передаёт место защиты и позволяет отличить это слово от סֻכָּה.
- source_word: מִסְתּוֹר
  choice: потаённое место
  rationale: Сохраняет оттенок скрытого, защищённого места и не сливает значение с предшествующим «убежищем».
- source_word: זֶרֶם
  choice: буря
  rationale: Слово может обозначать бурный поток, ливень или бурю. В сочетании с отдельным словом «дождь» вариант «буря» лучше сохраняет различие образов.
- source_word: מָטָר
  choice: дождь
  rationale: Основное значение слова; естественно дополняет более сильный образ бури.
theological_decisions:
- issue: Смысл защитного образа
  choice: Передать конкретный поэтический образ укрытия, не называя в переводе его последующий богословский референт.
  alternative: Истолковать укрытие непосредственно как Сион, Божье присутствие или мессианскую защиту.
  rationale: Еврейский текст изображает защиту от зноя и непогоды, но в самом стихе не отождествляет укрытие с каким-либо одним богословским референтом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис сохраняет параллелизм еврейского текста; лексика понятна широкому читателю.
