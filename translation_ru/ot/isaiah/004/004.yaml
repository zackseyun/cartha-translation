source:
  edition: WLC
  text: אִ֣ם רָחַ֣ץ אֲדֹנָ֗/י אֵ֚ת צֹאַ֣ת בְּנוֹת צִיּ֔וֹן וְ/אֶת דְּמֵ֥י יְרוּשָׁלִַ֖ם יָדִ֣יחַ מִ/קִּרְבָּ֑/הּ בְּ/ר֥וּחַ מִשְׁפָּ֖ט וּ/בְ/ר֥וּחַ בָּעֵֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/004.yaml
  text: when the Lord has washed away the filth of the daughters of Zion and cleansed the bloodshed of Jerusalem from her midst by a spirit of justice and by a spirit of burning[a][b].
translation:
  language: ru
  text: когда Господь омоет скверну дочерей Сиона и смоет из среды Иерусалима кровопролитие[a][b] духом суда и духом горения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Духом суда и Духом горения». Еврейское слово может также означать «ветер» или «дыхание».'
    reason: alternative_reading
  - marker: b
    text: «Кровопролитие» может также означать «кровавую вину Иерусалима».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: когда
  rationale: В данном контексте частица вводит момент исполнения обещания, а не выражает простую неопределённую условность; «когда» естественно связывает стих с предшествующим обещанием.
- source_word: רָחַץ
  choice: омоет
  rationale: Глагол означает «мыть, омывать»; «омоет скверну» сохраняет образ очищения и удаления нечистоты.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Передаёт божественный титул Адонай без смешения с тетраграмматоном.
- source_word: צֹאַת
  choice: скверну
  rationale: Слово обозначает резкую, отвратительную нечистоту; «скверна» сохраняет силу образа и подходит возвышенной пророческой речи.
- source_word: בְּנוֹת צִיּוֹן
  choice: дочерей Сиона
  rationale: Буквальная передача сохраняет пророческий образ и связь с предыдущим контекстом, не сводя выражение только к женщинам города.
- source_word: דְּמֵי יְרוּשָׁלִַם
  choice: кровь, пролитую в Иерусалиме
  rationale: Множественное «крови» может обозначать кровопролитие или вину за пролитую кровь. Такая формулировка звучит естественно по-русски, передаёт совершённое в городе кровопролитие и не устраняет полностью образ крови как осквернения.
- source_word: יָדִיחַ
  choice: смоет
  rationale: Каузативная форма выражает удаление посредством смывания; повтор водного образа соответствует параллелизму еврейского текста.
- source_word: מִקִּרְבָּהּ
  choice: из Иерусалима … в нём
  rationale: Передаёт удаление изнутри города. Русский грамматический род названия «Иерусалим» требует мужского местоимения, хотя в еврейском город персонифицирован как женщина.
- source_word: בְּרוּחַ
  choice: духом
  rationale: רוּחַ может означать дух, ветер или дыхание. «Духом» сохраняет основную религиозно-поэтическую возможность, а альтернативы отмечены в сноске; строчная буква не навязывает прямое отождествление со Святым Духом.
- source_word: מִשְׁפָּט
  choice: суда
  rationale: В контексте очищающего Божьего действия «суд» непосредственно передаёт судебно-карательный оттенок слова, не исключая идеи справедливости.
- source_word: בָּעֵר
  choice: огня
  rationale: Форма вызывает образ горения и истребляющего, очищающего действия. «Дух огня» естественнее по-русски, чем буквальное «дух горения», и сохраняет метафору.
theological_decisions:
- issue: Значение רוּחַ в сочетаниях בְּרוּחַ מִשְׁפָּט וּבְרוּחַ בָּעֵר
  choice: «духом суда и духом огня» со строчной буквы
  alternative: «Духом суда и Духом огня» либо «ветром суда и палящим ветром»
  rationale: Еврейское слово допускает значения «дух», «ветер» и «дыхание», а текст прямо не уточняет, что речь идёт о Святом Духе. Строчная буква сохраняет открытость образа и не вносит более определённого пневматологического толкования.
- issue: Смысл множественного דְּמֵי («крови») применительно к Иерусалиму
  choice: «кровь, пролитую в нём»
  alternative: «вину Иерусалима за пролитую кровь»
  rationale: Контекст допускает как само кровопролитие и его оскверняющий след, так и кровавую вину города. Основной текст сохраняет образ пролитой крови, а юридико-нравственная альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены параллелизм двух очищающих действий, образ дочерей Сиона и намеренная неоднозначность слова רוּחַ. Формулировка избегает как излишней архаики, так и конфессионально заданного толкования.
