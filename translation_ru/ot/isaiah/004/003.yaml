base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/003.yaml
  text: And it shall be that whoever remains in Zion and whoever is left in Jerusalem will be called holy—everyone who is recorded for life in Jerusalem[a][b].
translation:
  language: ru
  text: 'И будет: оставшийся на Сионе и уцелевший в Иерусалиме будет назван святым — каждый, кто записан для жизни в Иерусалиме[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждый, кто записан среди живых в Иерусалиме».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «записан для жизни» может указывать на перечень тех, кому предстояло остаться в живых; вместе с тем оно перекликается с более широким библейским образом людей, записанных в Божьей книге жизни.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет краткую пророческую формулу будущего, естественную для литературного русского языка.
- source_word: הַנִּשְׁאָר בְּצִיּוֹן
  choice: оставшийся на Сионе
  rationale: Причастная конструкция передаёт единичную грамматическую форму и одновременно имеет обобщающий смысл; предлог «на» соответствует устойчивому русскому употреблению с названием Сион.
- source_word: וְהַנּוֹתָר בִּירוּשָׁלִַם
  choice: и уцелевший в Иерусалиме
  rationale: Передаёт параллельный термин со значением того, кто остался в живых, сохраняя смысловой оттенок пережитого суда.
- source_word: קָדוֹשׁ יֵאָמֶר לוֹ
  choice: назовётся святым
  rationale: Естественно передаёт безлично-пассивное обозначение человека как святого, не уточняя сверх текста, кем именно он так назван.
- source_word: כָּל הַכָּתוּב
  choice: каждый, кто записан
  rationale: Передаёт обобщающее כָּל и пассивное причастие כתב как запись в некоем реестре, не определяя его природу.
- source_word: לַחַיִּים
  choice: для жизни
  rationale: 'Буквально и компактно сохраняет неоднозначность: запись может относиться к сохранению жизни и вместе с тем иметь более широкий богословский отзвук.'
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Сохраняет заключительное обстоятельство места без перестройки его возможной синтаксической связи.
theological_decisions:
- issue: Относится ли запись только к физически уцелевшим или также отзывается мотивом Божьей книги жизни
  choice: В основном тексте сохранено выражение «записан для жизни», объединяющее выживание, святость остатка и образ записи.
  alternative: «Записан среди живых» либо явное «записан в книге жизни».
  rationale: Первый вариант сужает смысл до числа живых, а второй преждевременно отождествляет эту фразу с позднее развитым мотивом книги жизни. Еврейский текст допускает смысловую напряжённость, которую следует сохранить.
- issue: Характер святости остатка
  choice: «Назовётся святым» оставлено как утверждение о признанном статусе уцелевшего остатка.
  alternative: Истолковать только как нравственную безупречность или только как обрядовую посвящённость.
  rationale: קָדוֹשׁ может обозначать принадлежность и посвящённость Богу, не исключая нравственного измерения; перевод не должен искусственно ограничивать смысл.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Причастные формы сохраняют параллелизм еврейского текста; «уцелевший» вносит естественное русское разнообразие и подчёркивает контекст пережитого суда. Все примечания отмечены в основном тексте.
