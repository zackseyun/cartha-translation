  text: וְ/הֶחֱזִיקוּ֩ שֶׁ֨בַע נָשִׁ֜ים בְּ/אִ֣ישׁ אֶחָ֗ד בַּ/יּ֤וֹם הַ/הוּא֙ לֵ/אמֹ֔ר לַחְמֵ֣/נוּ נֹאכֵ֔ל וְ/שִׂמְלָתֵ֖/נוּ נִלְבָּ֑שׁ רַ֗ק יִקָּרֵ֤א שִׁמְ/ךָ֙ עָלֵ֔י/נוּ אֱסֹ֖ף חֶרְפָּתֵֽ/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/001.yaml
  text: And seven women will take hold of one man in that day[a], saying, “We will eat our own bread and wear our own clothing; only let your name be called over us[b]. Take away our reproach.”
translation:
  language: ru
  text: 'И в тот день семь женщин ухватятся за одного мужчину и скажут: «Мы будем есть свой хлеб и носить свою одежду; только пусть нас назовут твоим именем[a]. Сними с нас наш позор[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть твоё имя будет наречено над нами». Вероятно, речь идёт о браке либо об общественно-правовой принадлежности к этому мужчине.'
    reason: lexical_alternative
  - marker: b
    text: Под «позором» имеется в виду общественное бесчестье; в данном контексте — вероятно, стигма отсутствия мужа и связанного с ним общественного статуса после описанного прежде разорения.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֶחֱזִיקוּ
  choice: ухватятся
  rationale: Порода hифиль глагола חזק с предлогом ב передаёт решительное действие — крепко взяться за кого-либо; «ухватятся» сохраняет силу и настойчивость выражения, не обязательно подразумевая насилие.
- source_word: שֶׁבַע נָשִׁים
  choice: семь женщин
  rationale: Прямое соответствие числительному и существительному; называть их жёнами преждевременно, поскольку брачная связь лишь подразумевается далее.
- source_word: בְּאִישׁ אֶחָד
  choice: за одного мужчину
  rationale: Предлог ב при חזק указывает на объект, за который хватаются; русское управление требует «ухватиться за».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Сохраняет обычную пророческую формулу и естественно звучит по-русски.
- source_word: לַחְמֵנוּ נֹאכֵל
  choice: мы будем есть свой хлеб
  rationale: Притяжательное местоимение «свой» естественно выражает суффикс первого лица и контекстуальный акцент на самостоятельном обеспечении.
- source_word: וְשִׂמְלָתֵנוּ נִלְבָּשׁ
  choice: носить свою одежду
  rationale: «Одежда» передаёт собирательное значение שִׂמְלָה, а «свою» подчёркивает, что женщины не требуют материального содержания.
- source_word: רַק
  choice: только
  rationale: Выражает ограничение просьбы одним условием.
- source_word: יִקָּרֵא שִׁמְךָ עָלֵינוּ
  choice: пусть твоё имя будет наречено над нами
  rationale: Формулировка сохраняет образ и синтаксическую направленность еврейской идиомы, не заменяя подразумеваемую брачную или общественно-правовую связь прямым толкованием.
- source_word: אֱסֹף
  choice: сними с нас
  rationale: Глагол אָסַף буквально связан с собиранием, но здесь идиоматически означает устранить позор; «сними с нас» естественно сочетается с русским «позор» и сохраняет образ удаления бремени.
- source_word: חֶרְפָּתֵנוּ
  choice: наш позор
  rationale: Передаёт общественное бесчестье и унижение, не сводя смысл лишь к внутреннему чувству стыда.
theological_decisions:
- issue: Подразумеваемая брачная или общественно-правовая связь во фразе «пусть твоё имя будет наречено над нами»
  choice: Сохранить еврейскую идиому в основном тексте.
  alternative: «Пусть нас называют твоим именем» или «женись на нас».
  rationale: Контекст, вероятно, подразумевает брак либо получение имени и статуса мужчины, однако обычный глагол со значением «жениться» в тексте отсутствует. Буквенно-идиоматическая передача сохраняет подлинную смысловую широту.
- issue: Конкретное содержание позора
  choice: Передать общим словом «позор».
  alternative: «Позор незамужества» или «позор бездетности».
  rationale: Контекст указывает на общественное бесчестье женщин, оставшихся без мужа, имени или потомства после бедствия, но сам стих не ограничивает значение одной причиной.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным для обычного читателя; ключевая древнееврейская идиома «имя будет наречено над нами» сохранена ради смысловой и богословской неоднозначности и пояснена в сноске.
