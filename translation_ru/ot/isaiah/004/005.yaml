  text: וּ/בָרָ֣א יְהוָ֡ה עַל֩ כָּל מְכ֨וֹן הַר צִיּ֜וֹן וְ/עַל מִקְרָאֶ֗/הָ עָנָ֤ן יוֹמָם֙ וְ/עָשָׁ֔ן וְ/נֹ֛גַהּ אֵ֥שׁ לֶהָבָ֖ה לָ֑יְלָה כִּ֥י עַל כָּל כָּב֖וֹד חֻפָּֽה־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/005.yaml
  text: Then Yahweh will create over the whole site of Mount Zion and over her assemblies a cloud by day[a], and smoke, and the brightness of a flaming fire by night[d][c][b]; for over all the glory there will be a canopy.
translation:
  language: ru
  text: И тогда Яхве сотворит над всеми местами на горе Сион и над её собраниями[a] облако днём и дым, а ночью — сияние пылающего огня[b][c]; ибо над всей славой будет покров[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «созванные собрания». Еврейское слово может обозначать назначенные или созванные собрания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зарево пылающего огня».'
    reason: lexical_alternative
  - marker: c
    text: Облако и огонь напоминают о присутствии Яхве при исходе и во время странствий по пустыне (например, Исход 13:21–22).
    reason: cross_reference
  - marker: d
    text: 'Или: «навес», «балдахин». Еврейское слово может также обозначать свадебный балдахин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרָא
  choice: И тогда ... сотворит
  rationale: Перфект с союзом в контексте пророческого обещания передан будущим временем. «Сотворит» сохраняет сильное значение глагола ברא, а «тогда» естественно выражает развитие мысли.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: מְכוֹן
  choice: пространство
  rationale: Здесь слово обозначает определённое, устойчивое место. В сочетании с горой Сион «всё пространство» естественно по-русски указывает на всю её территорию, не навязывая более узкого смысла «обитель».
- source_word: הַר צִיּוֹן
  choice: гора Сион
  rationale: Обычная и ясная русская передача географического названия.
- source_word: מִקְרָאֶיהָ
  choice: её собрания
  rationale: Существительное может обозначать созванное собрание или священное собрание; местоименный суффикс женского рода относится к Сиону. «Собрания» сохраняет смысл и остаётся понятным современному читателю.
- source_word: עָנָן יוֹמָם וְעָשָׁן
  choice: облако днём и дым
  rationale: Сохраняет два согласованных образа еврейского текста, не сводя дым к простому пояснению облака.
- source_word: וְנֹגַהּ אֵשׁ לֶהָבָה לָיְלָה
  choice: а ночью — сияние пылающего огня
  rationale: «Сияние» передаёт נֹגַהּ, а «пылающий огонь» сохраняет образ пламени в לֶהָבָה. Перестановка обстоятельства времени делает противопоставление дня и ночи естественным по-русски.
- source_word: כִּי
  choice: ведь
  rationale: Вводит объяснение предыдущих образов и звучит естественно в современном русском литературном тексте.
- source_word: כָּבוֹד
  choice: вся слава
  rationale: Сохраняет многозначность образа славы, не уточняя в основном тексте, идёт ли речь непосредственно о Божьем присутствии, чести Сиона или обоих смыслах.
- source_word: חֻפָּה
  choice: покров
  rationale: Передаёт образ находящегося сверху защитного покрытия. Возможный смысл навеса или свадебного балдахина отмечен в сноске и не навязан основному тексту.
theological_decisions:
- issue: Время и вид וּבָרָא в пророческой речи
  choice: 'Будущее обещание: «сотворит»'
  alternative: 'Прошедшее повествование: «сотворил»'
  rationale: Контекст Ис 4 говорит о грядущем очищении и восстановлении Сиона; будущее время передаёт пророческое употребление перфекта, не ослабляя идеи нового Божьего деяния.
- issue: Образы облака, дыма и огня как отсылка к исходу
  choice: Сохранить словесные образы без раскрытия их богословского значения в основном тексте
  alternative: Добавить «столп облачный» и «столп огненный» либо прямо обозначить типологическое исполнение
  rationale: Текст напоминает о явлении Яхве во время странствий по пустыне, однако сам стих не употребляет слово «столп» и не формулирует дальнейшего типологического толкования.
- issue: Значение «славы» в заключительной строке
  choice: Оставить «славу» без поясняющего дополнения
  alternative: Уточнить как «славное присутствие Бога» или «славу Сиона»
  rationale: Еврейская формулировка допускает смысловую напряжённость между Божьим славным присутствием и славой восстановленного Сиона; перевод не должен устранять её.
- issue: Возможный брачный оттенок חֻפָּה
  choice: В основном тексте — нейтральный защитный «покров», брачный оттенок — в сноске
  alternative: «Свадебный балдахин» в основном тексте
  rationale: Слово допускает образ свадебного балдахина, но в данном контексте явно действует и более широкий образ защиты; конкретизация в основном тексте была бы чрезмерной.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Параллелизм дня и ночи сделан ясным посредством конструкции «днём ... а ночью». Личное имя יְהוָה передано как «Яхве»; архаизмы и конфессионально окрашенные уточнения избегаются.
