  source_fidelity: 'Основной смысл передан верно: пророческое будущее для וּבָרָא оправдано, образы облака, дыма и огня сохранены, а חֻפָּה передано нейтрально, без навязывания брачной метафоры. Однако מְכוֹן в сочетании с כָּל требует более точной передачи множественности отдельных мест/участков на Сионе, а не расплывчатого «всего пространства».'
