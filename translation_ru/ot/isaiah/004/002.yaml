id: ISA.4.2
reference: Isaiah 4:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ צֶ֣מַח יְהוָ֔ה לִ/צְבִ֖י וּ/לְ/כָב֑וֹד וּ/פְרִ֤י הָ/אָ֨רֶץ֙ לְ/גָא֣וֹן וּ/לְ/תִפְאֶ֔רֶת לִ/פְלֵיטַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/002.yaml
  text: In that day the branch of Yahweh will be for beauty and for glory[a], and the fruit of the land for majesty and for splendor[b], for the survivors of Israel.
translation:
  language: ru
  text: В тот день отрасль Яхве будет красой и славой[a], а плод земли — величием и великолепием для уцелевших из Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «произрастание Яхве», «то, чему Яхве даст произрасти». Еврейское выражение может вызывать представление и о возрождённом плодородии земли, и о встречающемся позднее у пророков образе «Отрасли» Яхве.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «для остатка Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественная русская передача устойчивой пророческой формулы без уточнения времени сверх сказанного в тексте.
- source_word: צֶמַח יְהוָה
  choice: отрасль Яхве
  rationale: צֶמַח допускает значения ростка, побега или произрастания. «Отрасль» сохраняет образ растения и возможный пророческий резонанс, не делая его однозначно мессианским.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не заменой титулом.
- source_word: לִצְבִי וּלְכָבוֹד
  choice: красой и славой
  rationale: 'Сохраняется возвышенная параллельная пара: צְבִי передано как «краса», а כָבוֹד — как «слава».'
- source_word: וּפְרִי הָאָרֶץ
  choice: а плод земли
  rationale: «Земля» здесь естественно относится к стране и её плодородию; союз передан как «а», чтобы ясно обозначить вторую параллельную строку без навязывания противопоставления.
- source_word: לְגָאוֹן וּלְתִפְאֶרֶת
  choice: величием и великолепием
  rationale: В данном положительном окружении גָאוֹן означает величие или возвышенность, а תִפְאֶרֶת — великолепие, красоту или славу.
- source_word: לִפְלֵיטַת יִשְׂרָאֵל
  choice: для уцелевших из Израиля
  rationale: פְלֵיטָה обозначает спасшихся или уцелевших после бедствия; эта формулировка прозрачна для современного читателя и точно передаёт смысл.
theological_decisions:
- issue: Следует ли понимать צֶמַח יְהוָה как растительность земли или как личный мессианский образ
  choice: отрасль Яхве
  alternative: произрастание Яхве; то, чему Яхве даст произрасти
  rationale: Основной текст сохраняет конкретный, но допускающий разные толкования растительный образ. Строчная буква не предрешает, обозначает ли он личность или обновлённое плодородие.
- issue: Следует ли передавать פְלֵיטָה традиционным богословским словом «остаток»
  choice: уцелевшие из Израиля
  alternative: остаток Израиля
  rationale: Еврейское слово непосредственно указывает на спасшихся или уцелевших. Традиционный вариант сохранён в сноске, чтобы не утратить связь с темой остатка у Исаии.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Синтаксический параллелизм стиха сохранён; архаизмы сведены к умеренно поэтическому слову «краса», уместному в пророческом контексте.
