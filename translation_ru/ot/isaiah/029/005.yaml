  yaml_path: translation/ot/isaiah/029/005.yaml
  text: But the multitude of your strangers shall become like fine dust[a], and the multitude of the ruthless like passing chaff; and it shall happen suddenly[b], in an instant.
translation:
  language: ru
  text: Но множество твоих чужеземцев[a] станет словно мелкая пыль, и множество безжалостных — словно проносящаяся мякина[b]. И случится это внезапно, в одно мгновение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иноземцев». Еврейское слово может обозначать чужих или пришлых людей; в данном контексте речь идёт о враждебных захватчиках.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мякина, проходящая мимо» или «мякина, исчезающая». Еврейское причастие описывает прохождение; в образе мякины оно может подразумевать и быстрое исчезновение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: станет / случится
  rationale: Глагол היה употреблён дважды. В первой части при сравнительном обороте естественно передать его как «станет», а в заключении — как «случится», сохраняя различие функций в контексте.
- source_word: כְּאָבָק דַּק
  choice: словно мельчайшая пыль
  rationale: אָבָק означает «пыль», а דַּק подчёркивает её мелкость и лёгкость; образ передаёт то, что легко рассеивается.
- source_word: הֲמוֹן
  choice: множество
  rationale: Нейтральное собирательное значение слова сохранено в обоих параллельных оборотах без усиления до «полчища», которого само слово не требует.
- source_word: זָרָיִךְ
  choice: твоих чужеземцев
  rationale: Слово обозначает чужих, посторонних или иноземцев. «Чужеземцы» сохраняет основное лексическое значение, тогда как враждебность этих людей определяется контекстом и не вносится прямо словом «враги».
- source_word: וּכְמֹץ עֹבֵר
  choice: словно проносящаяся мякина
  rationale: מֹץ — «мякина», а причастие עֹבֵר буквально описывает её как проходящую или проносящуюся. Формулировка сохраняет динамический образ, не добавляя отсутствующего в тексте слова «ветер».
- source_word: עָרִיצִים
  choice: безжалостных
  rationale: עָרִיץ обозначает жестокого, насильственного человека или притеснителя. Субстантивированное «безжалостных» передаёт нравственную характеристику и остаётся естественным в современном русском языке.
- source_word: לְפֶתַע פִּתְאֹם
  choice: внезапно, в одно мгновение
  rationale: Два близких по смыслу выражения усиливают идею неожиданности и стремительности; перевод сохраняет оба элемента, избегая тяжеловесного буквального повтора.
