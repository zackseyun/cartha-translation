  text: וְ/שָׁפַלְתְּ֙ מֵ/אֶ֣רֶץ תְּדַבֵּ֔רִי וּ/מֵֽ/עָפָ֖ר תִּשַּׁ֣ח אִמְרָתֵ֑/ךְ וְֽ֠/הָיָה כְּ/א֤וֹב מֵ/אֶ֨רֶץ֙ קוֹלֵ֔/ךְ וּ/מֵ/עָפָ֖ר אִמְרָתֵ֥/ךְ תְּצַפְצֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/004.yaml
  text: Then you will be brought low; from the earth you will speak[a], and from the dust your speech will be low. Your voice will be like that of a medium from the earth, and from the dust your speech will chirp.
translation:
  language: ru
  text: 'И ты будешь унижена: из земли станешь говорить, и из праха речь твоя будет звучать приглушённо. Голос твой будет словно голос медиума[a], доносящийся из земли, и из праха речь твоя пропищит.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «голос духа умершего» или «голос вызывающего духов». Еврейское слово «ов» связано с медиумом и с вызываемым им духом; здесь оно передаёт образ слабого голоса, доносящегося из земли.'
    reason: Лексическая неоднозначность слова אוֹב.
lexical_decisions:
- source_word: וְשָׁפַלְתְּ
  choice: И ты будешь унижена
  rationale: Форма второго лица женского рода соответствует олицетворённому городу; страдательное значение естественно передаёт его унижение под судом.
- source_word: מֵאֶרֶץ ... וּמֵעָפָר
  choice: из-под земли ... из праха
  rationale: «Из-под земли» естественно передаёт исходящий снизу голос, а «из праха» сохраняет поэтический параллелизм и образ крайнего унижения.
- source_word: תִּשַּׁח אִמְרָתֵךְ
  choice: тихо прозвучит твоя речь
  rationale: Трудная конструкция буквально изображает речь как низкую или приглушённую; выбранная формулировка сохраняет смысл слабого, едва слышного голоса без излишнего уточнения.
- source_word: כְּאוֹב
  choice: словно голос духа умершего[a]
  rationale: אוֹב может обозначать дух умершего либо человека, вызывающего духов. В сочетании с голосом, исходящим из земли, основной текст передаёт потусторонний образ, а лексическая неоднозначность отмечена в сноске.
- source_word: תְּצַפְצֵף
  choice: будет тонко пищать
  rationale: Глагол обозначает тонкий писк или щебетание; «тонко пищать» передаёт слабое, жутковатое звучание без более радостных ассоциаций слова «щебетать».
theological_decisions:
- issue: Упоминание אוֹב, связанного с вызыванием умерших
  choice: дух умершего
  alternative: вызывающий духов; некромант
  rationale: Сравнение описывает униженный, исходящий словно из земли голос и не одобряет некромантию. Основной вариант согласуется с образом подземного голоса, а сноска сохраняет возможное обозначение посредника.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой поэтичности, женского рода обращения и параллелизма «из-под земли / из праха». Слово «прах» оставлено как понятное возвышенное обозначение пыли в библейском образе унижения.
