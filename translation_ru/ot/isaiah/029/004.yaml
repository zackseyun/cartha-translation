revisions:
- from: 'И ты будешь унижена: из-под земли станешь говорить, и из праха тихо прозвучит твоя речь. Голос твой будет словно голос духа умершего[a] из-под земли, и из праха речь твоя будет тонко пищать.'
  to: 'И ты будешь унижена: из земли станешь говорить, и из праха речь твоя будет звучать приглушённо. Голос твой будет словно голос медиума[a], доносящийся из земли, и из праха речь твоя пропищит.'
  rationale: Исправление устраняет добавленное значение «из-под», сохраняет поэтический параллелизм «из земли / из праха» и не разрешает спорное значение אוֹב в пользу «духа умершего» без оговорки. «Медиум» соответствует основному лексическому выбору английского POB; альтернативы сохранены в сноске. «Пропищит» передаёт תְּצַפְצֵף без смягчения образа.
