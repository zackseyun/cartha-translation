  - severity: medium
    issue: Основное чтение «дух умершего» для אוֹב
    rationale: Слово может быть связано и с духом, и с медиумом/вызывателем духов; в данном обороте предпочтительно не делать спорное значение «дух умершего» единственным в основном тексте. Английский POB также выбирает «medium» с примечанием.
  - severity: low
    issue: «тихо прозвучит твоя речь»
    rationale: Передаёт общий образ, но «будет звучать приглушённо» ближе к представлению о низкой, подавленной речи и естественнее связывается с параллельным голосом из праха.
