base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/015.yaml
  text: Woe to those who go deep to hide counsel from Yahweh[a], whose deeds are in darkness, and who say, “Who sees us[b], and who knows us?”
translation:
  language: ru
  text: 'Горе тем, кто уходит в глубины, чтобы скрыть свой замысел от Яхве[a], чьи дела совершаются во тьме и кто говорит: «Кто нас видит и кто нас знает?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. «от Яхве»: они пытаются утаить от Него свой замысел.'
    reason: lexical_clarification
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Передаёт вводную формулу пророческого обличения и угрозы суда естественным для русского библейского стиля выражением.
- source_word: הַמַּעֲמִיקִים
  choice: тем, кто идёт в глубины
  rationale: Сохраняет образ углубления, метафорически указывающий на тщательно скрываемые действия; не сводит неоднозначный образ сразу к толкованию «таится».
- source_word: מֵיהוָה לַסְתִּר עֵצָה
  choice: чтобы скрыть свой замысел от Яхве
  rationale: Инфинитив передаёт цель, предлог מן — того, от кого пытаются скрыть, а עֵצָה в контексте означает обдуманный замысел или план.
- source_word: בְמַחְשָׁךְ מַעֲשֵׂיהֶם
  choice: чьи дела совершаются во тьме
  rationale: Сохраняет конкретную метафору тьмы и естественно выражает продолжающуюся характеристику этих людей.
- source_word: מִי רֹאֵנוּ
  choice: Кто нас видит
  rationale: Прямо передаёт краткую еврейскую конструкцию без добавления модального «может».
- source_word: וּמִי יוֹדְעֵנוּ
  choice: и кто о нас знает
  rationale: Передаёт смысл осведомлённости об этих людях и их поступках, сохраняя лаконичность оригинала.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ / Иегова
  rationale: Собственное заветное имя передано транслитерацией «Яхве», что отличает его от титула «Господь» и соответствует прямому употреблению Тетраграмматона в тексте.
- issue: Объект скрываемого замысла
  choice: скрыть свой замысел от Яхве
  alternative: скрыть совет от Яхве
  rationale: Контекст говорит о тайном человеческом плане, который пытаются утаить от Бога; «замысел» естественнее современному читателю, не устраняя нравственного и богословского напряжения попытки укрыться от Божьего знания.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены образ глубины, метафора тьмы и краткие риторические вопросы; синтаксис слегка сглажен для ясности.
