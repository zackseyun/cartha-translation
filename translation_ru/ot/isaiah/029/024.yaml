id: ISA.29.24
reference: Isaiah 29:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/יָדְע֥וּ תֹֽעֵי ר֖וּחַ בִּינָ֑ה וְ/רוֹגְנִ֖ים יִלְמְדוּ לֶֽקַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/024.yaml
  text: And those who go astray in spirit will come to understanding[b][a], and those who grumble will learn instruction.
translation:
  language: ru
  text: И заблуждающиеся духом обретут понимание, и ропщущие научатся наставлению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: обретут
  rationale: Буквально глагол означает «узнают/познают», но в сочетании с בִּינָה естественно передаёт достижение понимания; будущее время сохранено.
- source_word: תֹעֵי רוּחַ
  choice: заблуждающиеся духом
  rationale: Причастие от תעה обозначает блуждание или заблуждение, а רוּחַ здесь вероятнее всего относится к внутреннему настрою или складу мысли. Формулировка сохраняет образность и допустимую смысловую широту.
- source_word: בִּינָה
  choice: понимание
  rationale: Слово обозначает понимание, разумение или способность различать; «понимание» ясно и естественно в данном сочетании.
- source_word: וְרוֹגְנִים
  choice: ропщущие
  rationale: Форма от רגן обозначает тех, кто ропщет, ворчит или жалуется; «ропщущие» уместно в возвышенном пророческом контексте и передаёт сопротивляющуюся установку.
- source_word: יִלְמְדוּ
  choice: научатся
  rationale: Прямо передаёт будущую форму глагола למד и естественно сочетается с последующим существительным.
- source_word: לֶקַח
  choice: наставлению
  rationale: Слово означает наставление или учение, которое принимают и усваивают; «наставлению» сохраняет мудростный оттенок.
theological_decisions:
- issue: Значение רוּחַ в выражении תֹעֵי רוּחַ
  choice: человеческий дух, внутренний настрой («духом»)
  alternative: Дух; ветер
  rationale: Контекст говорит об исправлении заблуждения и сопротивления. Антропологическое понимание наиболее естественно, однако буквальное «духом» не вводит лишней конкретизации и сохраняет некоторую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксический параллелизм еврейского текста сохранён; архаизмы и конфессионально нагруженные уточнения не добавлены.
