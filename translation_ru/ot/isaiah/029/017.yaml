source:
  edition: WLC
  text: הֲ/לוֹא עוֹד֙ מְעַ֣ט מִזְעָ֔ר וְ/שָׁ֥ב לְבָנ֖וֹן לַ/כַּרְמֶ֑ל וְ/הַ/כַּרְמֶ֖ל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/017.yaml
  text: Is it not yet a very little while[a], and Lebanon will turn into an orchard, and the orchard will be regarded as a forest?
translation:
  language: ru
  text: Разве не пройдёт ещё совсем немного времени — и Ливан превратится в плодородную землю[a], а плодородная земля будет считаться лесом?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возделанную землю»; еврейское כַּרְמֶל означает плодородную, обрабатываемую землю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Разве не
  rationale: Сохраняет форму риторического вопроса, предполагающего утвердительный ответ.
- source_word: עוֹד מְעַט מִזְעָר
  choice: не пройдёт ещё совсем немного времени
  rationale: Естественно по-русски передаёт временной смысл и усиленное указание на краткость промежутка.
- source_word: וְשָׁב
  choice: превратится
  rationale: В данном контексте שוב обозначает переход в иное состояние, а не буквальное возвращение.
- source_word: לְבָנוֹן
  choice: Ливан
  rationale: Сохраняется географическое название, которое в контексте также вызывает образ лесистой местности.
- source_word: כַּרְמֶל
  choice: плодородная земля
  rationale: Здесь это не собственное имя Кармил, а обозначение плодородной, возделанной земли; выбранный вариант сохраняет широту значения и не сужает образ до сада или фруктового сада.
- source_word: לַיַּעַר
  choice: лесом
  rationale: Передаёт значение יַעַר и вместе с глаголом 'считаться' выражает классификацию или оценку.
- source_word: יֵחָשֵׁב
  choice: будет считаться
  rationale: Сохраняет страдательно-оценочное значение нифаля от חשב и звучит естественно в современном русском языке.
theological_decisions:
- issue: Характер изображённого преображения
  choice: Сохранить образ резкой перемены состояния земли, не уточняя, является ли она буквальной, метафорической или сочетает оба смысла.
  alternative: Истолковать её исключительно как земледельческое преобразование либо исключительно как общественно-духовный переворот.
  rationale: Еврейский текст ясно выражает переворот и обновление, но сам по себе не ограничивает пророческий образ одним уровнем значения.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос и параллелизм сохранены. Формулировка торжественная, но понятная; двусмысленность пророческого образа не устранена.
