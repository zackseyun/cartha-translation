  text: מֵ/עִ֨ם יְהוָ֤ה צְבָאוֹת֙ תִּפָּקֵ֔ד בְּ/רַ֥עַם וּ/בְ/רַ֖עַשׁ וְ/ק֣וֹל גָּד֑וֹל סוּפָה֙ וּ/סְעָרָ֔ה וְ/לַ֖הַב אֵ֥שׁ אוֹכֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/006.yaml
  text: From Yahweh of hosts you will be visited with thunder and with earthquake and a great noise[a], with whirlwind and storm[c][b], and with the flame of a consuming fire.
translation:
  language: ru
  text: Яхве Воинств посетит тебя[a] громом, землетрясением[b] и громким шумом[c], вихрем и бурей, пламенем пожирающего огня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покарает тебя». Еврейский глагол буквально означает «будешь посещён» и может говорить о Божьем вмешательстве как для милости, так и для суда; здесь контекст указывает на суд.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сотрясением».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «громким звуком»; буквально: «великим звуком».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעִם
  choice: Яхве Воинств посетит тебя
  rationale: Предлог указывает на источник или действующее лицо посещения. Перестройка еврейской пассивной конструкции в русскую активную делает фразу естественной, не меняя смысла.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: В составе устойчивого божественного именования слово сохраняет широкий образ небесных воинств и не сужается до земных армий.
- source_word: תִּפָּקֵד
  choice: посетит тебя
  rationale: Сохранён библейский смысл божественного посещения или вмешательства; судебный характер действия раскрывается окружающими образами, а не добавляется в сам глагол.
- source_word: בְּרַעַם
  choice: громом
  rationale: Творительный падеж естественно передаёт сопровождающее действие явление и сохраняет лаконичность перечисления.
- source_word: וּבְרַעַשׁ
  choice: землетрясением
  rationale: Слово может означать сотрясение вообще, но в картине грозного богоявления конкретное «землетрясение» наиболее выразительно и уместно.
- source_word: וְקוֹל גָּדוֹל
  choice: и могучим гулом
  rationale: קוֹל здесь обозначает не обязательно голос, а мощный звук. «Могучий гул» естественно передаёт величину и силу звука среди грозных природных явлений.
- source_word: סוּפָה
  choice: вихрем
  rationale: «Вихрь» сохраняет самостоятельный образ рядом со следующим словом «буря».
- source_word: וּסְעָרָה
  choice: и бурей
  rationale: Отдельное обозначение бури сохраняет поэтическое нагнетание двух близких, но не тождественных образов.
- source_word: וְלַהַב אֵשׁ אוֹכֵלָה
  choice: пламенем пожирающего огня
  rationale: Формулировка близко передаёт образы пламени и огня, который пожирает, оставаясь выразительной и понятной по-русски.
theological_decisions:
- issue: Характер божественного посещения в פקד
  choice: Сохранить выражение «посетит тебя»
  alternative: «покарает тебя» или «взыщет с тебя»
  rationale: Контекст указывает на суд, однако сам еврейский глагол шире и может обозначать божественное вмешательство как для милости, так и для суда. Образ суда здесь достаточно ясно выражен последующим перечислением.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Ритмическое перечисление и нагнетание образов сохранены; архаизм «Саваоф» не использован, чтобы значение титула оставалось прозрачнее.
