  text: וַ/יֹּ֣אמֶר אֲדֹנָ֗/י יַ֚עַן כִּ֤י נִגַּשׁ֙ הָ/עָ֣ם הַ/זֶּ֔ה בְּ/פִ֤י/ו וּ/בִ/שְׂפָתָי/ו֙ כִּבְּד֔וּ/נִי וְ/לִבּ֖/וֹ רִחַ֣ק מִמֶּ֑/נִּי וַ/תְּהִ֤י יִרְאָתָ/ם֙ אֹתִ֔/י מִצְוַ֥ת אֲנָשִׁ֖ים מְלֻמָּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/013.yaml
  text: 'And the Lord said: Because this people draws near with its mouth and honors me with its lips[a], while its heart is far from me, and their fear of me has become a commandment of men that is taught[b],'
translation:
  language: ru
  text: 'И сказал Владыка: «Поскольку этот народ приближается ко Мне устами и чтит Меня губами, а сердце его далеко от Меня и их страх передо Мной[a] стал человеческой заповедью, которой их научили[b],»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их благоговение передо Мной» или «их почитание Меня». Еврейское выражение буквально: «их страх Меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заученной человеческой заповедью»; возможен также смысл «человеческой заповедью, которую усвоили». Выражение описывает отношение к Богу, сведённое к человеческому наставлению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт божественный титул אֲדֹנָי и не смешивает его с передачей тетраграмматона; соответствует возвышенной пророческой речи.
- source_word: יַעַן כִּי
  choice: за то, что
  rationale: Естественно вводит основание последующего Божьего суда и сохраняет причинное значение оборота.
- source_word: נִגַּשׁ
  choice: приближается
  rationale: Сохраняет прямое значение приближения и возможный культовый оттенок, не уточняя его сверх исходного текста.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняет собирательное единственное число и пророческий тон.
- source_word: בְּפִיו וּבִשְׂפָתָיו
  choice: устами ... губами
  rationale: Сохраняет параллелизм двух обозначений внешней речи; «устами» звучит естественно и достойно, а «губами» удерживает буквальный образ второй части.
- source_word: כִּבְּדוּנִי
  choice: чтит Меня
  rationale: Точно передаёт значение כבד в смысле оказания чести и естественно сочетается с собирательным «народ».
- source_word: לִבּוֹ רִחַק מִמֶּנִּי
  choice: сердце его далеко от Меня
  rationale: Передаёт состояние внутренней удалённости и сохраняет контраст с внешним приближением.
- source_word: יִרְאָתָם אֹתִי
  choice: их страх предо Мной
  rationale: Сохраняет основное значение יִרְאָה и переход исходного текста от собирательного единственного числа к множественному; «предо Мной» естественно выражает направленность страха на Бога.
- source_word: מִצְוַת אֲנָשִׁים
  choice: человеческой заповедью
  rationale: Передаёт родительную конструкцию как заповедь человеческого происхождения; в современном русском это яснее, чем буквальное «заповедь людей».
- source_word: מְלֻמָּדָה
  choice: которой их научили
  rationale: Передаёт пассивное значение причастия от למד, не внося в основной текст более узкое толкование «заученная наизусть».
theological_decisions:
- issue: Значение יִרְאָה в отношении Бога
  choice: их страх предо Мной
  alternative: их благоговение предо Мной; их почитание Меня
  rationale: «Страх» сохраняет лексическое ядро и богословское напряжение между подлинным страхом Божьим и усвоенным человеческим предписанием; более широкие оттенки отмечены в сноске.
- issue: Характер человеческой заповеди
  choice: человеческой заповедью, которой их научили
  alternative: заученной человеческой заповедью; усвоенным человеческим предписанием
  rationale: Формулировка сохраняет пассивную семантику מְלֻמָּדָה, но не решает однозначно, идёт ли речь о механическом заучивании, самом процессе обучения или усвоенной традиции.
- issue: Смена числа в местоимениях
  choice: сердце его ... их страх
  alternative: их сердца ... их страх; его сердце ... его страх
  rationale: Сохранён заметный переход еврейского текста от народа как единого целого к людям, составляющим народ, вместо искусственного выравнивания числа.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксический обрыв в конце сохранён запятой, поскольку причинный оборот этого стиха получает продолжение в следующем стихе. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому регистру.
