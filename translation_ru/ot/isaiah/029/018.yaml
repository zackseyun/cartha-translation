base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/018.yaml
  text: And on that day the deaf will hear the words of a book[a], and out of gloom and out of darkness the eyes of the blind will see.
translation:
  language: ru
  text: И в тот день глухие услышат слова книги[a], и из мрака и тьмы глаза слепых увидят.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слова свитка»; также возможно: «слова документа». Еврейское слово се́фер может обозначать разные виды письменного текста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ
  choice: И ... услышат
  rationale: Форма совершенного вида с союзом в пророческом контексте передаёт будущее событие; русское будущее «услышат» естественно выражает обещание.
- source_word: בַיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчивый пророческий временной оборот; формулировка сохраняет указательный и пророческий характер выражения.
- source_word: הַחֵרְשִׁים
  choice: глухие
  rationale: Субстантивированное прилагательное; это краткое и естественное обозначение людей, лишённых слуха.
- source_word: דִּבְרֵי סֵפֶר
  choice: слова книги
  rationale: Конструкция буквально означает «слова [письменного текста]»; סֵפֶר может обозначать книгу, свиток или документ. «Книга» естественна по-русски, а примечание сохраняет широту значения.
- source_word: וּמֵאֹפֶל וּמֵחֹשֶׁךְ
  choice: и из мрака и тьмы
  rationale: Предлог מִן указывает на исходное состояние или среду. Сохранены оба параллельных образа, чтобы не сглаживать поэтическое усиление оригинала.
- source_word: עֵינֵי עִוְרִים
  choice: глаза слепых
  rationale: Прозрачно воспроизводит сопряжённую конструкцию и сохраняет конкретный телесный образ.
- source_word: תִּרְאֶינָה
  choice: увидят
  rationale: Форма согласована с существительным «глаза» и обозначает обретённую способность видеть; совершенный вид естественно передаёт наступление нового состояния.
theological_decisions:
- issue: Следует ли понимать стих исключительно как физическое исцеление или явно передать образ духовного восстановления
  choice: 'Сохранить конкретную лексику чувств: «глухие», «услышат», «глаза слепых», «увидят», не добавляя толкований.'
  alternative: Передать выражения явно метафорически — как духовное понимание и прозрение.
  rationale: Еврейский текст использует конкретные обозначения слуха и зрения, однако в контексте Исаии они могут иметь также образный смысл. Перевод сохраняет эту богословскую напряжённость и не ограничивает текст только одним прочтением.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Параллелизм «из мрака и тьмы» сохранён; порядок частей близок к еврейскому оригиналу.
