  yaml_path: translation/ot/isaiah/029/003.yaml
  text: And I will encamp against you all around[a], and I will besiege you with siegeworks[c][b], and I will raise up siege towers against you.
translation:
  language: ru
  text: Я расположусь лагерем вокруг тебя кольцом[a], осажу тебя, поставив осадную позицию[b], и возведу против тебя осадные укрепления[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как круг»; возможно также: «кольцом».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «осадный пост», «гарнизон» или «осадное сооружение». Еврейское слово обозначает нечто поставленное или размещённое.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское слово может обозначать осадные сооружения вообще; возможны более конкретные переводы: «осадные валы», «осадные насыпи» или «осадные башни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִיתִי
  choice: Я расположусь лагерем
  rationale: Глагол חנה означает «становиться лагерем, располагаться станом»; выбран естественный современный оборот с ясным военным смыслом.
- source_word: כַדּוּר
  choice: вокруг тебя
  rationale: Буквально выражение указывает на круговое расположение; в контексте осады «вокруг» естественно передаёт окружение города, а буквальный образ сохранён в примечании.
- source_word: עָלָיִךְ / עָלַיִךְ
  choice: вокруг тебя / тебя / против тебя
  rationale: Предлог עַל с суффиксом 2-го лица женского рода в данном военном контексте выражает направленность враждебного действия. Разные русские конструкции позволяют естественно передать его по контексту; женский род относится к городу, к которому обращена речь.
- source_word: וְצַרְתִּי
  choice: осажу
  rationale: Глагол צור здесь употреблён в военном значении «осаждать»; перевод прямо сохраняет действие говорящего.
- source_word: מֻצָּב
  choice: осадную позицию
  rationale: Слово обозначает нечто поставленное или размещённое. «Осадная позиция» сохраняет идею установленного у города военного объекта, не сводя неоднозначный термин к одному конкретному типу сооружения.
- source_word: וַהֲקִימֹתִי
  choice: и возведу
  rationale: Каузативная форма קום означает «поставить, воздвигнуть»; «возведу» естественно сочетается с военными укреплениями.
- source_word: מְצֻרוֹת
  choice: осадные укрепления
  rationale: Точный вид обозначаемых осадных сооружений неясен. Обобщённый перевод «осадные укрепления» надёжно передаёт военный контекст, а возможные конкретизации указаны в примечании.
theological_decisions:
- issue: Говорящий и действие суда
  choice: 'Все глаголы первого лица переданы как прямые действия Бога: «расположусь», «осажу», «возведу».'
  alternative: Понять это как косвенное действие Бога через допущенную или посланную Им человеческую армию.
  rationale: Еврейский текст последовательно употребляет формы первого лица единственного числа. Перевод не ослабляет прямую божественную субъектность до простого позволения, но и не уточняет здесь, каким человеческим орудием осуществляется осада.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Военная образность сохранена без архаизмов; неопределённость двух осадных терминов не устранена и отражена в примечаниях.
