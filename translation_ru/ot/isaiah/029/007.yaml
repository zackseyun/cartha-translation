  text: וְ/הָיָ֗ה כַּֽ/חֲלוֹם֙ חֲז֣וֹן לַ֔יְלָה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל אֲרִיאֵ֑ל וְ/כָל צֹבֶ֨י/הָ֙ וּ/מְצֹ֣דָתָ֔/הּ וְ/הַ/מְּצִיקִ֖ים לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/007.yaml
  text: And the multitude of all the nations that wage war against Ariel[a], even all who wage war against her and her stronghold, and who distress her, will be like a dream[c][b], a vision of the night.
translation:
  language: ru
  text: И множество всех народов, воюющих против Ариэля[a], — все, кто воюет против него и его крепости[b] и теснит его, — станет словно сон, словно ночное видение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ариэль — поэтическое имя Иерусалима в этом контексте.
    reason: cross_reference
  - marker: b
    text: 'Или: «его твердыня»; некоторые понимают это слово как «осадные укрепления против него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: станет
  rationale: Пророческая форма с ו передаёт будущее состояние; «станет» естественно вводит последующее сравнение.
- source_word: כַּחֲלוֹם חֲזוֹן לַיְלָה
  choice: словно сон, словно ночное видение
  rationale: כ выражает сравнение. Повтор «словно» ясно связывает оба поэтических образа с множеством нападающих; «ночное видение» точно передаёт конструкцию חֲזוֹן לַיְלָה.
- source_word: הֲמוֹן כָּל הַגּוֹיִם
  choice: множество всех народов
  rationale: הֲמוֹן обозначает множество или шумную массу людей, а גּוֹיִם здесь — чужеземные народы, собравшиеся для войны.
- source_word: הַצֹּבְאִים עַל
  choice: воюющих против
  rationale: В данном военном контексте причастие от צבא с עַל обозначает вооружённое выступление против кого-либо.
- source_word: אֲרִיאֵל
  choice: Ариэль
  rationale: Поэтическое имя сохранено транслитерацией, а его отнесение к Иерусалиму пояснено в сноске.
- source_word: וְכָל צֹבֶיהָ
  choice: все, кто воюет против него
  rationale: Повтор глагола «воюет» сохраняет лексическую связь с הַצֹּבְאִים; местоимение по нормам русского языка согласовано с именем «Ариэль».
- source_word: וּמְצֹדָתָהּ
  choice: и его крепости
  rationale: מְצוֹדָה обычно означает крепость или твердыню. Формулировка допускает понимание крепости как дополнительного объекта нападения; возможное значение «осадные укрепления против него» вынесено в сноску.
- source_word: וְהַמְּצִיקִים לָהּ
  choice: и теснит его
  rationale: Причастие передаёт причинение стеснения, бедствия и тяжёлого давления. «Теснит» сохраняет широту смысла и уместно в военном контексте, не сводя действие только к осаде.
theological_decisions:
- issue: Кого обозначает имя «Ариэль»
  choice: Сохранить «Ариэль» как поэтическое имя в основном тексте.
  alternative: Заменить имя толкованием «Иерусалим».
  rationale: В еврейском тексте стоит אֲרִיאֵל. Сохранение имени не подменяет перевод толкованием, тогда как контекстуальное отождествление с Иерусалимом можно ясно сообщить в сноске.
- issue: Принадлежность и смысл מְצֹדָתָהּ
  choice: Понять выражение как «его крепости», против которой также воюют.
  alternative: Понять слово как «осадные укрепления против него».
  rationale: Обычное значение מְצוֹדָה — «крепость, твердыня», а местоименный суффикс естественно относится к Ариэлю. Однако военный контекст допускает и альтернативное понимание, поэтому оно сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Порядок фразы перестроен ради ясности, но образность и синтаксическое напряжение еврейского текста сохранены с помощью тире и повторного «словно».
