source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֥י יוֹסִ֛ף לְ/הַפְלִ֥יא אֶת הָֽ/עָם הַ/זֶּ֖ה הַפְלֵ֣א וָ/פֶ֑לֶא וְ/אָֽבְדָה֙ חָכְמַ֣ת חֲכָמָ֔י/ו וּ/בִינַ֥ת נְבֹנָ֖י/ו תִּסְתַּתָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/014.yaml
  text: Therefore[a], behold, I will again do something astonishing with this people—something astonishing and marvelous; and the wisdom of its wise men will perish, and the understanding of its discerning men will hide itself.
translation:
  language: ru
  text: Поэтому Я снова совершу с этим народом нечто поразительное — поразительное и дивное; исчезнет мудрость его мудрецов, и скроется разумение его проницательных людей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я и впредь буду дивно поступать с этим народом — чудо за чудом».'
    reason: Еврейское сочетание допускает значение продолженного действия, а повтор слов от корня פלא можно передать идиомой «чудо за чудом».
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод или следствие из предшествующего обличения.
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Сохраняет торжественный пророческий призыв обратить внимание и явное указание на говорящего.
- source_word: יוֹסִף לְהַפְלִיא
  choice: снова совершу… нечто поразительное
  rationale: Сочетание יסף с инфинитивом указывает на повторное или продолжающееся действие, а форма פלא — на необычайное, вызывающее изумление деяние.
- source_word: הָעָם הַזֶּה
  choice: с этим народом
  rationale: Естественно передаёт объект воздействия при сохранении пророческого выражения «этот народ».
- source_word: הַפְלֵא וָפֶלֶא
  choice: поразительное и дивное
  rationale: Передаёт усиление, созданное повтором слов одного корня, и не придаёт Божьему необычайному деянию непременно положительного оттенка.
- source_word: וְאָבְדָה חָכְמַת חֲכָמָיו
  choice: и исчезнет мудрость его мудрецов
  rationale: Сохраняет однокоренную связь «мудрость — мудрецы» и будущий результат пророческого высказывания.
- source_word: וּבִינַת נְבֹנָיו
  choice: разумение его проницательных
  rationale: Различает בינה как способность понимать и נבון как человека, обладающего проницательностью, сохраняя параллелизм с предыдущей строкой.
- source_word: תִּסְתַּתָּר
  choice: скроется
  rationale: Передаёт возвратно-пассивный оттенок формы и согласуется с подлежащим «разумение».
theological_decisions:
- issue: Характер необычайного Божьего деяния
  choice: нейтральные по оценке слова «поразительное и дивное»
  alternative: «чудесное», которое может звучать исключительно положительно
  rationale: В контексте речь идёт о Божьем суде; перевод сохраняет необычайность действия, не превращая её в обещание благодеяния.
- issue: Обозначение мудрых и проницательных
  choice: «мудрецов» и «проницательных»
  alternative: «мудрых людей» и «разумных людей»
  rationale: Мужской множественный род исходных форм сохранён без добавления отсутствующего в тексте социального или конфессионального статуса.
- issue: Связь местоименного суффикса с народом
  choice: «его мудрецов… его проницательных»
  alternative: «мудрецов этого народа… проницательных этого народа»
  rationale: Местоимение естественно относится к собирательному существительному «народ» и сохраняет краткость еврейского параллелизма.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксический параллелизм и однокоренная пара «мудрость — мудрецы» сохранены; архаизмы и конфессионально окрашенные формулы по возможности устранены.
