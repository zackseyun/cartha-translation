base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/021.yaml
  text: those who make a man an offender by a word[a], and lay a snare for the one who reproves in the gate[c][b], and turn aside the righteous with emptiness.
translation:
  language: ru
  text: тех, кто одним словом объявляет человека виновным[a], ставит западню тому, кто обличает у городских ворот[b], и пустыми доводами лишает правого справедливости[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «кто осуждает человека за слово» или «кто словом вводит человека в грех». Еврейское выражение допускает судебный и каузативный смысл, однако здесь контекст суда говорит в пользу первого.'
    reason: lexical_alternative
  - marker: b
    text: У городских ворот проходили публичные разбирательства и вершился суд.
    reason: cultural_note
  - marker: c
    text: 'Возможные переводы: «ни за что оттесняет правого» или «пустым предлогом отказывает правому в справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲטִיאֵי
  choice: объявляет … виновным
  rationale: В породе hифиль причастие от חטא допускает как каузативное «вводить в грех», так и судебное «признавать виновным». Судебный контекст городских ворот делает второе значение наиболее вероятным.
- source_word: אָדָם
  choice: человека
  rationale: Передаёт единичное родовое обозначение естественным современным русским языком.
- source_word: בְּדָבָר
  choice: одним словом
  rationale: דבר может означать слово, высказывание, дело или обвинение. Формулировка сохраняет краткость и предполагаемую мысль о признании виновным на основании одного лишь слова.
- source_word: לַמּוֹכִיחַ
  choice: тому, кто обличает
  rationale: Причастие от יכח может обозначать обличающего, возражающего или ведущего судебное дело; выбранное выражение сохраняет нравственный и судебный оттенки.
- source_word: בַּשַּׁעַר
  choice: у городских ворот
  rationale: Ворота города служили местом публичного суда и разбирательств; добавление «городских» естественно раскрывает подразумеваемую реалиию.
- source_word: יְקֹשׁוּן
  choice: ставит западню
  rationale: Сохраняет метафору намеренного улавливания, выраженную корнем יקשׁ.
- source_word: וַיַּטּוּ
  choice: лишает … справедливости
  rationale: В судебном контексте נטה означает отклонить или извратить правосудие, то есть отказать человеку в справедливом решении.
- source_word: בַתֹּהוּ
  choice: пустыми доводами
  rationale: תֹהוּ обозначает пустоту, тщету или нечто лишённое действительного основания. «Пустыми доводами» естественно передаёт инструментальный предлог и юридический контекст, не сводя смысл исключительно ко лжи.
- source_word: צַדִּיק
  choice: правого
  rationale: В судебном контексте צדיק — тот, кто прав или невиновен; «правый» сохраняет юридический и нравственный оттенки.
