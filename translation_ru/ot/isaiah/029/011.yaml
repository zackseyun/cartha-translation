  text: וַ/תְּהִ֨י לָ/כֶ֜ם חָז֣וּת הַ/כֹּ֗ל כְּ/דִבְרֵי֮ הַ/סֵּ֣פֶר הֶֽ/חָתוּם֒ אֲשֶֽׁר יִתְּנ֣וּ אֹת֗/וֹ אֶל יוֹדֵ֥עַ ה/ספר לֵ/אמֹ֖ר קְרָ֣א נָא זֶ֑ה וְ/אָמַר֙ לֹ֣א אוּכַ֔ל כִּ֥י חָת֖וּם הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/011.yaml
  text: And the vision of all this has become to you like the words of a sealed scroll[a], which they give to one who knows writing, saying, “Please read this,” and he says, “I cannot, because it is sealed.”
translation:
  language: ru
  text: 'И видение обо всём этом стало для вас словно слова запечатанного свитка, который дают тому, кто умеет читать[a], и говорят: «Прочитай, пожалуйста, это». А он отвечает: «Не могу, потому что свиток запечатан».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тому, кто знает книгу (или свиток)»; то есть грамотному человеку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזוּת הַכֹּל
  choice: видение обо всём этом
  rationale: חָזוּת означает видение или пророческое откровение, а הַכֹּל указывает на всю совокупность того, о чём шла речь. Формулировка сохраняет пророческий образ и естественно звучит по-русски.
- source_word: כְּדִבְרֵי הַסֵּפֶר הֶחָתוּם
  choice: словно слова запечатанного свитка
  rationale: Сохранены и прямое значение דִּבְרֵי — «слова», и исторически уместное значение סֵפֶר — «свиток». Причастие חָתוּם точно передано словом «запечатанный».
- source_word: יוֹדֵעַ הַסֵּפֶר
  choice: тому, кто умеет читать
  rationale: Буквально выражение означает «знающему свиток/письмо», но в данном противопоставлении обозначает грамотного человека, способного читать. Выбран естественный современный русский эквивалент; буквальная форма отмечена в сноске.
- source_word: קְרָא נָא זֶה
  choice: Прочитай, пожалуйста, это
  rationale: Частица נָא при повелительном наклонении выражает вежливую просьбу; «пожалуйста» сохраняет эту оттеночную функцию.
- source_word: לֹא אוּכַל
  choice: Не могу
  rationale: Перевод сохраняет краткость еврейского выражения и не добавляет подразумеваемого глагола «прочитать».
- source_word: וַתְּהִי לָכֶם
  choice: стало для вас
  rationale: Передаёт возникшее и сохраняющееся состояние, а также эксплицитное לָכֶם — «для вас».
theological_decisions:
- issue: Недоступность откровения в образе запечатанного свитка
  choice: Сохранить образ запечатанного свитка без объясняющего пересказа
  alternative: Передать смысл как неспособность понять Божье слово
  rationale: Текст выражает богословское содержание посредством сравнения. Прямое сохранение образа не снимает намеренной напряжённости между данным видением и невозможностью прочесть запечатанный текст.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейским звучанием. Слово «свиток» сохраняет историческую реалию; диалог оформлен естественно и без толковательных добавлений.
