base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/019.yaml
  text: The humble will again increase their joy in Yahweh[b][a], and the poor among mankind will rejoice in the Holy One of Israel.
translation:
  language: ru
  text: Кроткие ещё больше возрадуются[a] в Яхве, и бедные люди[b] возликуют о Святом Израилевом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально говорит: «добавят (или умножат) радость». Слово, переведённое как «кроткие», может также означать «смиренные», «униженные» или «угнетённые».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «бедные человека»; слово אָדָם здесь обозначает людей вообще, то есть человеческий род.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָסְפוּ ... שִׂמְחָה
  choice: вновь умножат свою радость
  rationale: Глагол יסף означает «добавлять, умножать» и здесь управляет существительным «радость». Формулировка сохраняет образ возрастания радости и возможный оттенок повторности, выраженный контекстуально словом «вновь».
- source_word: עֲנָוִים
  choice: смиренные
  rationale: Слово обозначает кротких, смиренных или униженных людей и может одновременно указывать на их внутреннее состояние и низкое общественное положение. «Смиренные» естественно передаёт основное значение, не сводя его только к материальной нужде.
- source_word: בַּיהוָה
  choice: в Яхве
  rationale: Предлог ב обозначает того, в ком сосредоточена радость, а тетраграмматон передан личным именем «Яхве».
- source_word: וְאֶבְיוֹנֵי אָדָם
  choice: и бедные среди людей
  rationale: אֶבְיוֹן означает бедного или нуждающегося, а אָדָם употреблено в общем значении человеческого рода. Перевод сохраняет конструкцию и не придаёт ей исключительно мужского смысла.
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: о Святом Израилевом
  rationale: Русская конструкция «ликовать о ком-либо» естественно передаёт направленность радости на Бога; титул «Святой Израилев» сохранён как характерное для Исаии именование Бога.
- source_word: יָגִילוּ
  choice: возликуют
  rationale: Глагол גיל выражает сильную, торжествующую радость; «возликуют» передаёт эту интенсивность и поддерживает поэтический параллелизм.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; личное имя сохранено, а не заменено титулом.
- issue: Значение עֲנָוִים
  choice: смиренные
  alternative: угнетённые
  rationale: Слово допускает как нравственно-духовный, так и социальный оттенок. Основной текст не ограничивает его только страданием или угнетением, а примечание сохраняет диапазон значений.
- issue: Значение предлога ב при радости
  choice: «в Яхве» и «о Святом Израилевом»
  alternative: «из-за Яхве» и «благодаря Святому Израилеву»
  rationale: Выбраны формулировки, представляющие Бога как средоточие и предмет радости, без сведения предлога исключительно к причинному значению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены параллелизм двух строк, существительное «радость», личное имя Яхве и традиционный исайевский титул «Святой Израилев».
