source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל בֵּ֣ית יַֽעֲקֹ֔ב אֲשֶׁ֥ר פָּדָ֖ה אֶת אַבְרָהָ֑ם לֹֽא עַתָּ֤ה יֵבוֹשׁ֙ יַֽעֲקֹ֔ב וְ/לֹ֥א עַתָּ֖ה פָּנָ֥י/ו יֶחֱוָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/022.yaml
  text: 'Therefore thus says Yahweh to the house of Jacob[a], he who redeemed Abraham: Jacob will no longer be ashamed[b], and his face will no longer grow pale.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве дому Иакова — Тот, кто искупил Авраама: «Иаков больше не будет стыдиться[a], и лицо его больше не побледнеет[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «больше не будет посрамлён».'
    reason: lexical_alternative
  - marker: b
    text: Буквально глагол указывает на то, что лицо становится белым или бледным, — это образ стыда или смятения.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт выводное значение союза и сохраняет явную связь с предшествующим контекстом.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная для русского языка и близкая к еврейскому тексту передача пророческой вестнической формулы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל בֵּית יַעֲקֹב
  choice: дому Иакова
  rationale: Сохраняет корпоративный и родовой смысл слова «дом».
- source_word: אֲשֶׁר פָּדָה אֶת אַבְרָהָם
  choice: Тот, кто искупил Авраама
  rationale: Глагол פדה обозначает избавление ценой выкупа или освобождение; «искупил» сохраняет его ёмкий образный и богословский смысл.
- source_word: לֹא עַתָּה
  choice: больше не будет
  rationale: В данном обещании сочетание выражает прекращение прежнего состояния; такая передача естественна по-русски и соответствует контексту будущего обращения участи.
- source_word: יֵבוֹשׁ
  choice: будет стыдиться
  rationale: Передаёт основное значение בוש — испытывать стыд или оказаться в бесчестии — без уточнения внешнего виновника.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Сохраняет повтор имени в единственном числе, которым собирательно обозначен народ.
- source_word: פָּנָיו
  choice: лицо его
  rationale: Буквальная и естественная передача телесного образа еврейского текста.
- source_word: יֶחֱוָרוּ
  choice: побледнеет
  rationale: Глагол описывает побеление или бледность лица как видимый признак стыда, страха либо смятения.
theological_decisions:
- issue: К кому относится определительное предложение «кто искупил Авраама»
  choice: 'Оно характеризует Яхве: «Яхве… Тот, кто искупил Авраама».'
  alternative: Оно может быть синтаксически соотнесено с «домом Иакова» как более отдалённым определяемым выражением.
  rationale: 'По синтаксису и ходу мысли естественнее видеть здесь характеристику Яхве: его прежнее избавление Авраама служит основанием обещания Иакову. Тире и слово «Тот» делают эту связь понятной в русском тексте.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис оставлен ясным для широкого читателя; повтор «больше не» сохраняет параллелизм еврейского текста. Все примечания отмечены в основном тексте.
