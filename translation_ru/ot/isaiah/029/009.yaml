    text: 'Или: «Придите в оцепенение и ослепните». Еврейские глаголы этой пары редки и трудны для истолкования; они могут передавать ослепление, ошеломление или оцепенение.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְמַהְמְהוּ וּתְמָהוּ
  choice: Медлите и дивитесь
  rationale: Первая редкая форма допускает значение промедления в растерянности или оцепенения; «медлите» сохраняет эту неоднозначность, а «дивитесь» передаёт повелительное תמהה и поэтический параллелизм.
- source_word: הִשְׁתַּעַשְׁעוּ וָשֹׁעוּ
  choice: ослепите себя и будьте слепы
  rationale: Редкие глаголы в данном контексте традиционно связываются с ослеплением или ошеломлением. Перевод сохраняет рефлексивность первой формы и краткий параллелизм второй.
- source_word: שָׁכְרוּ
  choice: Они пьяны
  rationale: Перфект после повелительных форм живо описывает наступившее состояние; настоящее время естественно звучит по-русски.
- source_word: וְלֹא יַיִן
  choice: но не от вина
  rationale: Отрицательная именная конструкция указывает, что состояние, подобное опьянению, вызвано не буквальным вином.
- source_word: נָעוּ
  choice: шатаются
  rationale: נוע обозначает колебание, качание или нетвёрдую походку; «шатаются» естественно продолжает образ опьянения.
- source_word: וְלֹא שֵׁכָר
  choice: но не от крепкого напитка
  rationale: שֵׁכָר обозначает опьяняющий напиток, отличный от вина; «крепкий напиток» сохраняет это различие без излишнего уточнения.
theological_decisions:
- issue: Характер образов опьянения и слепоты
  choice: Сохранены метафоры духовного оцепенения и слепоты без поясняющего расширения в основном тексте.
  alternative: Буквальное опьянение либо прямое добавление идеи судебного ожесточения.
  rationale: Сам стих исключает буквальную причину опьянения словами «не от вина… не от крепкого напитка». Контексту предоставлено раскрыть богословский смысл образа.
translation_notes:
  register: Современный литературный русский язык с сохранением резких повелительных форм, лаконичного поэтического параллелизма и намеренно неразъяснённой пророческой образности.
