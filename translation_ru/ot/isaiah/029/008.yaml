- from: 'И будет это как во сне голодного: вот, он ест, но пробуждается — и пусто внутри у него[a]; и как во сне жаждущего: вот, он пьёт, но пробуждается — и вот, он изнемог, и всё существо его томится от жажды[b]. Так будет и со множеством всех народов, воюющих против горы Сион.'
