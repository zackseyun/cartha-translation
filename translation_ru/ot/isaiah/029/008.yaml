  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ יַחֲלֹ֨ם הָ/רָעֵ֜ב וְ/הִנֵּ֣ה אוֹכֵ֗ל וְ/הֵקִיץ֮ וְ/רֵיקָ֣ה נַפְשׁ/וֹ֒ וְ/כַ/אֲשֶׁ֨ר יַחֲלֹ֤ם הַ/צָּמֵא֙ וְ/הִנֵּ֣ה שֹׁתֶ֔ה וְ/הֵקִיץ֙ וְ/הִנֵּ֣ה עָיֵ֔ף וְ/נַפְשׁ֖/וֹ שׁוֹקֵקָ֑ה כֵּ֣ן יִֽהְיֶ֗ה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל הַ֥ר צִיּֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/008.yaml
  text: And it will be as when a hungry man dreams[a], and behold, he is eating, but he wakes and his appetite is empty; and as when a thirsty man dreams, and behold, he is drinking, but he wakes, and behold, he is faint and his appetite craves[b]. So will be the multitude of all the nations that wage war against Mount Zion.
translation:
  language: ru
  text: И будет, как когда голодному снится, что он ест, но он просыпается — а голод его не утолён; и как когда жаждущему снится, что он пьёт, но он просыпается — и вот, он обессилен, и жажда его не утолена. Так будет со множеством всех народов, выступающих войной против горы Сион.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: И будет это как во сне
  rationale: Передаёт будущий результат и вводит развёрнутое сравнение; по-русски такая конструкция естественнее буквального «как когда… видит сон».
- source_word: יַחֲלֹם הָרָעֵב
  choice: во сне голодного
  rationale: Еврейский имперфект описывает типичный наглядный случай; субстантивированное прилагательное сохранено как «голодный» в родительном обороте.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохраняет повторяющуюся указательную частицу и живость сцены без архаического оттенка.
- source_word: וְהֵקִיץ
  choice: но пробуждается
  rationale: Союз передан противительно, поскольку пробуждение резко противопоставлено мнимому насыщению во сне.
- source_word: וְרֵיקָה נַפְשׁוֹ
  choice: и пусто внутри у него
  rationale: Нֶפֶשׁ здесь обозначает самого человека как носителя голода и желания. Формулировка сохраняет телесно-внутренний образ и не превращает его в специальное учение о душе.
- source_word: עָיֵף
  choice: изнемог
  rationale: В контексте жажды обозначает физическое истощение; «изнемог» звучит естественно и выразительно.
- source_word: וְנַפְשׁוֹ שׁוֹקֵקָה
  choice: всё существо его томится от жажды
  rationale: Передаёт сильное, продолжающееся желание и телесную нужду; «от жажды» эксплицирует ясный контекст, не снимая образности נֶפֶשׁ.
- source_word: הֲמוֹן כָּל הַגּוֹיִם
  choice: множество всех народов
  rationale: Сохраняет собирательное значение הָמוֹן и всеобщность כָּל.
- source_word: הַצֹּבְאִים עַל הַר צִיּוֹן
  choice: воюющих против горы Сион
  rationale: Причастие от צבא здесь означает выступать войском, вести войну; עַל в враждебном контексте передано как «против».
theological_decisions:
- issue: Значение נֶפֶשׁ в образах голода и жажды
  choice: «внутри у него» / «всё существо его»
  alternative: «душа его» или «желание его»
  rationale: В данном контексте слово обозначает живого человека как носителя телесной нужды и стремления, а не исключительно нематериальную душу. Разные контекстные формулировки сохраняют широту еврейского слова.
- issue: Объект военных действий народов
  choice: «против горы Сион»
  alternative: «на гору Сион» или «осаждающих гору Сион»
  rationale: Еврейское צבא с עַל ясно выражает враждебное военное выступление. «Против» точно передаёт отношение, не добавляя более узкого образа осады.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм двух сновидений и троекратное «вот» сохранены; синтаксис слегка перестроен ради естественности и ясности.
