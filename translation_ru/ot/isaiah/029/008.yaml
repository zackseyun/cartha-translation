review_pass:
  verdict: revise
  source_fidelity: Черновик верно передаёт основное сравнение и военное выступление народов против горы Сион. Однако обороты «во сне голодного/жаждущего» ослабляют глагольную картину «снится», а «пусто внутри» и особенно «всё существо его томится» слишком расплывчаты для конкретного телесного образа נֶפֶשׁ в контексте голода и жажды. Добавление «от жажды» в основном тексте допустимо по контексту, но лучше передать параллелизм как неудовлетворённые голод и жажду.
  naturalness: Предлагаемая редакция использует современный литературный синтаксис, сохраняет пророческую торжественность и делает два параллельных образа ясными без неестественного буквального «душа его пуста».
  terminology: «Голод его не утолён» и «жажда его не утолена» контекстуально передают נֶפֶשׁ как жизненное желание/аппетит, не навязывая технического значения «душа». «Выступающих войной против» точно отражает военный смысл הצבאים על.
  issues:
  - severity: medium
    issue: «Во сне голодного» / «во сне жаждущего»
    rationale: Эти именные обороты не вполне передают повторяющийся глагол יחלם («снится/видит сон») и могут звучать как описание состояния сна, а не как сравнение с человеком, которому снится еда или питьё.
  - severity: medium
    issue: «Пусто внутри у него» и «всё существо его томится от жажды»
    rationale: Формулировки слишком обобщают конкретный образ неудовлетворённого желания; «всё существо» также избыточно расширяет значение נפש. Вторая формула делает явной жажду, но не сохраняет достаточно близко значение сильного, неутолённого желания.
  - severity: low
    issue: Примечания называют предлагаемые русские формулы буквальным переводом
    rationale: «Душа его пуста» и «душа его томится» не являются достаточно точными буквальными соответствиями данным еврейским выражениям, особенно для שוקקה («сильно жаждет, страстно желает»).
  revised_text: И будет, как когда голодному снится, что он ест, но он просыпается — а голод его не утолён; и как когда жаждущему снится, что он пьёт, но он просыпается — и вот, он обессилен, и жажда его не утолена. Так будет со множеством всех народов, выступающих войной против горы Сион.
