  text: Я принесу бедствие Ариэлю[a]; там будут плач и стенание, и она станет для Меня как очаг жертвенника.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское אֲרִיאֵל («Ариэль») — название Иерусалима; далее, вероятно, обыгрывается значение этого слова, связанное с очагом жертвенника.
    reason: lexical_wordplay
  - marker: b
    text: 'Буквально: «и она станет для Меня как Ариэль». Повтор слова, вероятно, является игрой слов; здесь оно может означать «очаг жертвенника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲצִיקוֹתִי
  choice: Я притесню
  rationale: Порода hифиль передаёт причинение тесноты, бедствия или давления. «Притесню» сохраняет широкий смысл, не сводя его исключительно к военной осаде.
- source_word: לַאֲרִיאֵל
  choice: Ариэль
  rationale: В контексте это имя-название Иерусалима (ср. ст. 1), поэтому оно транслитерировано; связанная с ним игра слов раскрывается во втором употреблении и в примечании.
- source_word: תַאֲנִיָה וַאֲנִיָּה
  choice: плач и стенание
  rationale: Два близких по смыслу существительных образуют поэтическое усиление скорби; русский оборот сохраняет и смысл, и парность.
- source_word: וְהָיְתָה לִּי
  choice: и станет он для Меня
  rationale: Форма указывает на итоговое состояние. Мужской род в русском согласован с названием «Ариэль», хотя еврейская форма женского рода олицетворяет город.
- source_word: כַּאֲרִיאֵל
  choice: словно жертвенник
  rationale: 'Повтор אֲרִיאֵל, вероятно, создаёт игру слов: Ариэль-город станет подобен очагу жертвенника. «Жертвенник» естественно и кратко передаёт жертвенный образ, а более буквальный вариант отмечен в сноске.'
theological_decisions:
- issue: Передача повторного אֲרִיאֵל и игры слов
  choice: Первое употребление передать как имя «Ариэль», второе — по предполагаемому значению «жертвенник».
  alternative: Передать оба употребления как «Ариэль» либо второе как «очаг жертвенника».
  rationale: Контекст обозначает словом Ариэль Иерусалим, однако заключительная фраза, по-видимому, обыгрывает значение названия. Такой перевод сохраняет пророческую иронию и жертвенный образ, не устраняя лексической неопределённости, которая обозначена в сноске.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Сохранена поэтическая пара «плач и стенание» и обозначена подлинная неоднозначность повторного אֲרִיאֵל.
