  text: כִּֽי נָסַ֨ךְ עֲלֵי/כֶ֤ם יְהוָה֙ ר֣וּחַ תַּרְדֵּמָ֔ה וַ/יְעַצֵּ֖ם אֶת עֵֽינֵי/כֶ֑ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת רָאשֵׁי/כֶ֥ם הַ/חֹזִ֖ים כִּסָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/010.yaml
  text: For Yahweh has poured out on you a spirit of deep sleep[b][a], and has shut your eyes—the prophets—and covered your heads—the seers.
translation:
  language: ru
  text: Ибо Яхве излил на вас дух глубокого сна[a] и сомкнул ваши глаза — пророков, и покрыл ваши головы — провидцев.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух оцепенения». Еврейское слово может обозначать глубокий сон или состояние тяжёлого оцепенения.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский синтаксис, вероятно, отождествляет «пророков» с «вашими глазами», а «провидцев» — с «вашими головами». Возможно и другое понимание: «закрыл пророков и покрыл ваши головы — провидцев».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт пояснительно-причинную связь с предшествующим контекстом и соответствует возвышенному, но современному библейскому регистру.
- source_word: נָסַךְ
  choice: излил
  rationale: Сохраняет конкретную метафору излияния и прямое действие Господа.
- source_word: יְהוָה
  choice: Господь
  rationale: В русском библейском употреблении естественно и узнаваемо передаёт тетраграмматон, не вводя спорной реконструкции произношения в основной текст.
- source_word: רוּחַ תַּרְדֵּמָה
  choice: дух глубокого сна
  rationale: Сохраняет многозначность רוּחַ как воздействующего внутреннего состояния и прямо передаёт תַּרְדֵּמָה; возможный оттенок оцепенения отмечен в сноске.
- source_word: וַיְעַצֵּם
  choice: сомкнул
  rationale: Естественно сочетается по-русски с глазами и сохраняет образ закрывания, не усиливая его до истолкования «ослепил».
- source_word: עֵינֵיכֶם
  choice: ваши глаза
  rationale: Буквально сохраняет образ; последующее «пророков» прочитано как приложение.
- source_word: אֶת הַנְּבִיאִים
  choice: пророков
  rationale: Передаёт термин прямо и сохраняет вероятную приложительную связь с «ваши глаза».
- source_word: רָאשֵׁיכֶם
  choice: ваши головы
  rationale: Сохраняет буквальный параллельный образ, не заменяя его толкованием «вожди» или «руководители».
- source_word: הַחֹזִים
  choice: провидцев
  rationale: Отличает חֹזִים от נְבִיאִים и передаёт особый термин для тех, кто получает видения.
- source_word: כִּסָּה
  choice: покрыл
  rationale: Прямо сохраняет параллельный образ покрытия и завершённость действия.
theological_decisions:
- issue: Божественное действие в образе судебного ожесточения
  choice: Господь прямо назван совершающим излияние, смыкание глаз и покрытие голов.
  alternative: 'Смягчить причинность: «Господь допустил, чтобы на вас сошёл дух глубокого сна».'
  rationale: Еврейские глаголы прямо приписывают действия YHWH; перевод сохраняет богословское напряжение и не превращает действие в простое попущение.
- issue: Синтаксическая связь слов «пророки» и «провидцы»
  choice: Прочитать их как приложения к «ваши глаза» и «ваши головы».
  alternative: 'Считать их самостоятельными дополнениями: «сомкнул пророков и покрыл ваши головы — провидцев».'
  rationale: Приложительное прочтение лучше поддерживает параллелизм и цельный образ пророков как глаз народа, а провидцев как его голов; реальная синтаксическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены конкретные образы излияния, сомкнутых глаз и покрытых голов; трудная приложительная конструкция передана тире, а её неоднозначность вынесена в сноску.
