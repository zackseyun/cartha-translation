base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/020.yaml
  text: For the ruthless one will come to nothing[a], the scoffer will be finished[b], and all who watch for wrongdoing will be cut off.
translation:
  language: ru
  text: Ибо притеснителя не станет[a], насмешнику придёт конец, и все, кто замышляет беззаконие[b], будут отсечены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жестокого человека»; возможно, «тирана». Еврейское עָרִיץ обозначает жестокого, склонного к насилию притеснителя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все, кто высматривает зло» или «все, кто караулит, чтобы совершить беззаконие». Еврейское причастие указывает на бдительную, намеренную устремлённость к беззаконию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего обетования; «ибо» естественно передаёт причинно-пояснительную связь и сохраняет возвышенный регистр.
- source_word: אָפֵס
  choice: не станет
  rationale: Глагол выражает прекращение существования или исчезновение; эта формулировка кратка, естественна и соответствует контексту грядущего суда.
- source_word: עָרִיץ
  choice: притеснителя
  rationale: Слово обозначает жестокого, насильственного угнетателя. «Притеснитель» передаёт его общественно-нравственную характеристику, не ограничивая смысл только политическим тираном.
- source_word: וְכָלָה
  choice: придёт конец
  rationale: Глагол означает завершиться, иссякнуть, прийти к концу; русская идиома ясно передаёт прекращение существования или деятельности насмешника.
- source_word: לֵץ
  choice: насмешнику
  rationale: Существительное обозначает человека, который высокомерно глумится и презирает; «насмешник» понятно современному читателю и сохраняет нравственную окраску.
- source_word: וְנִכְרְתוּ
  choice: будут истреблены
  rationale: Нифаль глагола כרת означает быть отсечённым, удалённым или уничтоженным. В русском «будут отсечены» здесь звучит неестественно, тогда как «будут истреблены» ясно передаёт судебное устранение, не уточняя способ.
- source_word: כָּל
  choice: все
  rationale: Передаёт полный собирательный охват группы.
- source_word: שֹׁקְדֵי
  choice: кто высматривает возможность
  rationale: Причастие выражает бодрствующее, настойчивое и намеренное внимание; дополнение «возможность» делает подразумеваемую направленность такого наблюдения естественной по-русски.
- source_word: אָוֶן
  choice: сделать зло
  rationale: Слово может обозначать зло, нечестие, бедствие или неправду. В данном контексте этический смысл естественно передаётся выражением «сделать зло».
theological_decisions:
- issue: Характер устранения нечестивых
  choice: Сохранён образ окончательного судебного устранения без указания конкретного способа или метафизического исхода.
  alternative: Передать וְנִכְרְתוּ буквально как «будут отсечены» либо более определённо как «будут уничтожены».
  rationale: Еврейский глагол допускает значения отсечения, удаления и уничтожения; перевод не должен привносить более узкое богословское толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Параллелизм трёх частей сохранён; конструкции естественны для широкого круга читателей.
