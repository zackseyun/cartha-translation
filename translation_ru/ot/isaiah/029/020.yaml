  source_fidelity: Перевод в целом верно передаёт трёхчастный параллелизм и судебную перспективу стиха. Однако «высматривает возможность сделать зло» несколько разворачивает еврейское שֹׁקְדֵי אָוֶן, добавляя «возможность» и глагол «сделать», которых в тексте нет. «Будут истреблены» возможно, но сужает широкий образ נִכְרְתוּ («будут отсечены / устранены») до физического уничтожения.
