  terminology: '«Притеснитель» удачно передаёт עָרִיץ без неоправданного сведения значения к политическому «тирану». «Насмешник» точно передаёт לֵץ. Для נִכְרְתוּ предпочтительно «будут отсечены»: это сохраняет образ и судебно-устранительный характер еврейского глагола без излишней спецификации способа гибели.'
