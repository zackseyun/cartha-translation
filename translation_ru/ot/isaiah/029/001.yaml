  yaml_path: translation/ot/isaiah/029/001.yaml
  text: Ah[a], Ariel, Ariel, the city where David encamped! Add year to year; let the feasts run their round.
translation:
  language: ru
  text: Увы[a], Ариил, Ариил, город, где Давид разбил стан! Прибавляйте год к году; пусть праздники идут своим чередом.
  philosophy: optimal-equivalence
  footnotes:
