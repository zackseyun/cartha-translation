    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Междометие вводит пророческое обращение с оттенками скорби и угрозы. Русское «горе» естественно в контексте грядущего суда; с местоимением «тебе» оно образует ясное обращение, не превращая фразу в простое восклицание удивления.
- source_word: אֲרִיאֵל
  choice: Ариил
  rationale: Здесь слово служит именованием Иерусалима, что поясняется приложением о городе Давида. Транслитерация сохраняет имя и возможную еврейскую игру значений, раскрытую в сноске.
- source_word: קִרְיַת חָנָה דָוִד
  choice: город, где Давид разбил стан
  rationale: Конструкция отождествляет Ариил с городом, в котором Давид расположился станом. «Разбил стан» передаёт обычное значение חנה и сохраняет историко-военный оттенок.
- source_word: סְפוּ שָׁנָה עַל שָׁנָה
  choice: Прибавляйте год к году
  rationale: Императив множественного числа сохранён, а краткая итеративная формула передаёт течение одного года за другим и оттенок иронического дозволения продолжать привычный ход времени.
- source_word: חַגִּים יִנְקֹפוּ
  choice: пусть праздники совершают свой круг
  rationale: חַגִּים обозначает установленные религиозные праздники, а נקף — круговое движение или завершение цикла. Формулировка передаёт их ежегодное повторение, не уточняя сверх текста способ отсчёта.
theological_decisions:
- issue: Передавать ли אֲרִיאֵל значением или сохранить как имя
  choice: Сохранить «Ариил» в основном тексте как имя Иерусалима, а возможные значения указать в сноске.
  alternative: Перевести как «жертвенник»/«очаг жертвенника» или «лев Божий».
  rationale: Повтор и последующее приложение показывают, что слово функционирует как обращение к городу. Транслитерация не устраняет намеренную многозначность, важную для дальнейшего пророчества.
- issue: Тон междометия הוֹי
  choice: Передать как «Горе тебе».
  alternative: 'Передать более нейтрально: «О» или «Ах».'
  rationale: Контекст речи о суде поддерживает формулу угрозы и плача, однако сам стих ещё содержит и обращение; добавленное по-русски «тебе» ясно обозначает адресата без внесения отдельного обвинения.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис остаётся кратким и ритмичным; архаизмы сведены к минимуму. Традиционная русская форма имени «Ариил» выбрана вместо фонетического «Ариэль».
