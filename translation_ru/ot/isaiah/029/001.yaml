  source_fidelity: '«Горе тебе» возможно в контексте суда, но еврейское הוֹי остаётся междометием плача/угрозы и не обязательно сводится к прямому объявлению горя. Более широкое «Увы» лучше сохраняет его силу и неоднозначность, в согласии с английским audit trail («Ah»). Остальные смысловые элементы переданы точно: Ариил отождествлён с городом Давида, повеление о годах сохранено, а цикличность праздников выражена адекватно.'
  naturalness: Текст в целом литературен и ритмичен. «Увы, Ариил, Ариил» естественно для современного торжественного пророческого регистра. «Пусть праздники совершают свой круг» понятно, но несколько книжно-механично; «пусть праздники идут своим чередом» более естественно по-русски и передаёт повторяемость годового круга.
  terminology: «Ариил» — оправданная традиционная русская передача имени; сноска корректно сохраняет игру значений, не разрешая её однозначно. «Разбил стан» точно передаёт חנה и уместно сохраняет военный оттенок. «Праздники» подходит для חגים.
