    rationale: Междометие может выражать скорбное восклицание, угрозу или привлечение внимания. При отсутствии в самом слове прямого эквивалента «тебе» и при выбранном английском «Ah» лучше не фиксировать лишь значение судебного проклятия.
  - severity: low
