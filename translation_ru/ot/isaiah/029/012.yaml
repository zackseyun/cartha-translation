    issue: «Передадут» вместо нейтрального «дадут»
    rationale: נִתַּן означает «дана/дадут»; «передадут» допустимо по контексту, но добавляет конкретный оттенок передачи, не выраженный в оригинале.
  - severity: low
    issue: «А он ответит» вместо «а он скажет»
    rationale: וְאָמַר буквально «и скажет». Реплика действительно является ответом по контексту, но прямой глагол сохраняет формулировку источника точнее.
  revised_text: 'И книгу дадут тому, кто не знает грамоты, со словами: «Пожалуйста, прочитай это». А он скажет: «Я не знаю грамоты».'
