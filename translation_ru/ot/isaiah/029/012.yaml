source:
  edition: WLC
  text: וְ/נִתַּ֣ן הַ/סֵּ֗פֶר עַל֩ אֲשֶׁ֨ר לֹֽא יָדַ֥ע סֵ֛פֶר לֵ/אמֹ֖ר קְרָ֣א נָא זֶ֑ה וְ/אָמַ֕ר לֹ֥א יָדַ֖עְתִּי סֵֽפֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/012.yaml
  text: And the book is given to one who does not know writing, saying, “Please read this,” and he says, “I do not know writing.”
translation:
  language: ru
  text: 'И книгу дадут тому, кто не знает грамоты, со словами: «Пожалуйста, прочитай это». А он скажет: «Я не знаю грамоты».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: книгу
  rationale: 'С определённым артиклем: речь идёт о ранее упомянутой запечатанной книге (свитке); в современном русском «книга» естественно сохраняет связь с контекстом.'
- source_word: לֹא יָדַע סֵפֶר / לֹא יָדַעְתִּי סֵפֶר
  choice: не знает грамоты / не знаю грамоты
  rationale: Буквально сочетание связано со «знанием книги/письма», но идиоматически обозначает неграмотность, то есть неспособность читать; «не знать грамоты» сохраняет образ письма и звучит естественно по-русски.
- source_word: קְרָא נָא זֶה
  choice: Прочитай, пожалуйста, это
  rationale: קרא — «прочитай», частица נָא выражает вежливую просьбу, זֶה — «это».
- source_word: וְנִתַּן / וְאָמַר
  choice: И передадут / А он ответит
  rationale: Формы грамматически допускают буквальное «и будет передана / и скажет»; неопределённо-личная конструкция естественна по-русски, а «ответит» ясно передаёт реплику в диалоге без изменения смысла.
theological_decisions:
- issue: Характер незнания адресата
  choice: не знает грамоты
  alternative: не умеет читать; не знает письма
  rationale: 'Выражение не истолковывается как специальное богословское или книжное знание: в непосредственном контексте человек не может прочитать текст. При этом «не знает грамоты» ближе к образности еврейского выражения, чем полностью разъясняющее «не умеет читать».'
translation_notes:
  register: Современный литературный русский, понятный широкому читателю. Сохранена торжественная повествовательная простота; архаичное «не знает письмен» и неестественное «не знает письма» отвергнуты.
