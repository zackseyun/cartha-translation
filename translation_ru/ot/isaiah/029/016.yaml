  text: הַ֨פְכְּ/כֶ֔ם אִם כְּ/חֹ֥מֶר הַ/יֹּצֵ֖ר יֵֽחָשֵׁ֑ב כִּֽי יֹאמַ֨ר מַעֲשֶׂ֤ה לְ/עֹשֵׂ֨/הוּ֙ לֹ֣א עָשָׂ֔/נִי וְ/יֵ֛צֶר אָמַ֥ר לְ/יוֹצְר֖/וֹ לֹ֥א הֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/016.yaml
  text: You turn things upside down! Shall the potter be regarded as clay[a], that what is made should say of its maker, “He did not make me,” and what is formed say of the one who formed it, “He has no understanding”?
translation:
  language: ru
  text: 'Как всё у вас перевёрнуто! Разве горшечника можно считать глиной[a], чтобы изделие говорило о том, кто его сделал: «Он меня не делал», — а созданное говорило о том, кто его создал: «Он ничего не понимает»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально начало стиха можно передать: «Ваше переворачивание!»; возможен также смысл: «Ваша извращённость!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְכְּכֶם
  choice: Как всё у вас перевёрнуто!
  rationale: Форма представляет собой сжатое восклицание с суффиксом 2-го лица множественного числа. Русская фраза естественно передаёт упрёк в переворачивании должного порядка, не сводя выражение только к нравственной «испорченности».
- source_word: אִם
  choice: Разве
  rationale: Здесь частица вводит риторический вопрос, а не обычное условие. «Разве» ясно передаёт ожидаемый отрицательный ответ.
- source_word: כְּחֹמֶר
  choice: глиной
  rationale: חֹמֶר обозначает материал горшечника — глину. Творительный падеж обусловлен русской конструкцией «считать кем-либо/чем-либо».
- source_word: הַיֹּצֵר
  choice: горшечника
  rationale: Причастие от יצר буквально означает «формирующий», но в непосредственном сочетании с глиной речь идёт о горшечнике. Конкретный образ сохранён.
- source_word: יֵחָשֵׁב
  choice: можно считать
  rationale: Нифаль глагола חשׁב означает «считаться, быть принимаемым за». Безличная русская конструкция сохраняет риторический характер вопроса.
- source_word: מַעֲשֶׂה
  choice: изделие
  rationale: В противопоставлении сделанного и сделавшего слово обозначает изготовленный предмет. «Изделие» кратко и естественно передаёт результат работы.
- source_word: לְעֹשֵׂהוּ
  choice: о том, кто его сделал
  rationale: Предлог при אמר допускает речь, обращённую к лицу или сказанную о нём. В данном контексте русское «говорило о том» естественно вводит отрицание авторства.
- source_word: עָשָׂנִי
  choice: Он меня не делал
  rationale: 'Перфект выражает отрицание совершённого действия: изделие отрицает, что мастер его сделал.'
- source_word: יֵצֶר
  choice: созданное
  rationale: Существительное обозначает сформированный предмет или образование. «Созданное» сохраняет параллель с «изделием» и отличие от создавшего его.
- source_word: לְיוֹצְרוֹ
  choice: о том, кто его создал
  rationale: Передаёт отношение сформированного предмета к сформировавшему его и сохраняет синтаксический параллелизм предыдущей части.
- source_word: הֵבִין
  choice: Он ничего не понимает
  rationale: Хифиль בין здесь означает «понимать, обладать разумением». Эта русская формулировка естественно выражает обвинение мастера в отсутствии понимания.
theological_decisions:
- issue: Образ горшечника и глины
  choice: Сохранить конкретные слова «горшечник» и «глина».
  alternative: Передать образ отвлечённо как «творец» и «творение».
  rationale: Смысл упрёка строится на нелепом переворачивании отношений между мастером и материалом. Конкретный пророческий образ сохраняет богословское напряжение, не добавляя к нему конфессиональных толкований.
- issue: Начальное восклицание
  choice: 'Передать как упрёк: «Как всё у вас перевёрнуто!»'
  alternative: 'Более буквально: «Ваше переворачивание!»; иначе: «Ваша извращённость!»'
  rationale: Еврейское выражение сжато и допускает разные оттенки. Выбранный вариант сохраняет идею перевёрнутого порядка и естественно подводит к риторическому вопросу, не закрепляя более узкое нравственное толкование.
- issue: Направленность речи изделия
  choice: «говорило о том, кто его сделал»
  alternative: «говорило тому, кто его сделал»
  rationale: Еврейский предлог לְ после אמר допускает обе возможности. В данном контексте речь формулируется как отрицательное утверждение о мастере; выбор сделан ради естественного русского синтаксиса, без изменения сути обвинения.
translation_notes:
  register: Современный литературный русский язык; тон обличительный, но dignified. Сохранены риторический вопрос, параллелизм двух обвинений и конкретный образ горшечника с глиной.
