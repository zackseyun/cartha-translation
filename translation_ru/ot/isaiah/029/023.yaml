source:
  edition: WLC
  text: כִּ֣י בִ֠/רְאֹת/וֹ יְלָדָ֞י/ו מַעֲשֵׂ֥ה יָדַ֛/י בְּ/קִרְבּ֖/וֹ יַקְדִּ֣ישֽׁוּ שְׁמִ֑/י וְ/הִקְדִּ֨ישׁוּ֙ אֶת קְד֣וֹשׁ יַֽעֲקֹ֔ב וְ/אֶת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל יַעֲרִֽיצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/023.yaml
  text: For when he sees his children[a], the work of my hands, in his midst, they will sanctify my name; they will sanctify the Holy One of Jacob[b], and they will stand in awe of the God of Israel.
translation:
  language: ru
  text: Ибо, когда он увидит среди себя своих детей[a] — дело Моих рук, — они будут признавать Моё имя святым, будут признавать святым Святого Иакова и благоговеть перед Богом Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «когда Авраам увидит среди себя своих детей — дело Моих рук». Формы единственного числа могут отсылать к названным в предыдущем стихе патриархам — особенно к Аврааму или Иакову, — либо к Иакову/Израилю как к единому народу.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «трепетать перед», «страшиться». Еврейский глагол выражает почтительный страх и трепет. «Святой Иакова» — божественный титул, то есть Святой, принадлежащий Иакову; речь не о патриархе Иакове как о святом человеке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי בִרְאֹתוֹ
  choice: Ибо, когда он увидит
  rationale: 'כִּי связывает стих с предшествующим обещанием как его основание или пояснение, а בְּ с инфинитивом и местоименным суффиксом имеет временное значение: «когда он увидит».'
- source_word: יְלָדָיו
  choice: своих детей
  rationale: Слово обозначает детей или потомков в широком смысле и не требует ограничения только сыновьями.
- source_word: מַעֲשֵׂה יָדַי
  choice: дело Моих рук
  rationale: Сохранён конкретный древнееврейский образ Божьего созидательного действия.
- source_word: בְּקִרְבּוֹ
  choice: среди себя
  rationale: Форма с суффиксом единственного числа сохранена и естественно передаёт нахождение детей внутри Иакова/Израиля, представленного как единое лицо.
- source_word: יַקְדִּישׁוּ שְׁמִי ... וְהִקְדִּישׁוּ אֶת קְדוֹשׁ יַעֲקֹב
  choice: будут чтить Моё имя как святое, будут чтить как святого Святого Иакова
  rationale: Hiphil от קדש здесь означает признавать или почитать святым. Такая формулировка яснее современному русскому читателю, чем буквальное «освятят», и одновременно сохраняет повтор одного действия в двух параллельных частях.
- source_word: קְדוֹשׁ יַעֲקֹב
  choice: Святого Иакова
  rationale: Сохранён характерный для Исаии Божий титул без конфессионального уточнения.
- source_word: יַעֲרִיצוּ
  choice: благоговеть перед
  rationale: Глагол выражает трепетный, почтительный страх перед Богом; «благоговеть» естественно передаёт это сочетание почтения и трепета.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богом Израиля
  rationale: Стандартный Божий титул передан прямо и прозрачно.
theological_decisions:
- issue: К кому относятся формы единственного числа «он увидит» и «среди себя»
  choice: В основном тексте референт не назван, поэтому местоименная неоднозначность древнееврейского текста сохранена.
  alternative: Прямо назвать Иакова/Израиль как олицетворённый народ либо Авраама или патриарха Иакова.
  rationale: В предыдущем стихе названы и Иаков, и Авраам. Контекст допускает олицетворённого Иакова/Израиль, но не позволяет безоговорочно исключить отсылку к одному из патриархов.
- issue: Передача освящения Божьего имени и Святого Иакова
  choice: «чтить ... как святое/святого» в обеих параллельных частях.
  alternative: «освятят Моё имя; освятят Святого Иакова».
  rationale: Выбранная формулировка передаёт признание Божьей святости, не создавая впечатления, будто люди делают Бога святым, и сохраняет риторический повтор.
- issue: Характер отношения к Богу в יַעֲרִיצוּ
  choice: «благоговеть перед» с примечанием о значении трепетного страха.
  alternative: «страшиться», «трепетать перед», «почитать».
  rationale: Слово объединяет страх, трепет и почтение; основной текст не должен сводить его ни к одному лишь ужасу, ни к спокойному уважению.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены параллелизм, образ «дело Моих рук», традиционные Божьи титулы и подлинная неоднозначность местоимений; синтаксис упрощён ровно настолько, чтобы стих был понятен обычному современному читателю.
