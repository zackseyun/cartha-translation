  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בָּאִ֛ים מֵ/אֶ֥רֶץ מֶרְחָ֖ק מִ/קְצֵ֣ה הַ/שָּׁמָ֑יִם יְהוָה֙ וּ/כְלֵ֣י זַעְמ֔/וֹ לְ/חַבֵּ֖ל כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/005.yaml
  text: They are coming from a distant land[c][b][a], from the end of the heavens— Yahweh and the weapons of his wrath— to destroy the whole earth.
translation:
  language: ru
  text: Они идут из далёкой страны, от края небес[a] — Яхве и орудия Его ярости[b], — чтобы погубить всю землю[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от дальних пределов небес».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оружие Его ярости».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «всю страну». Небесная образность стиха, однако, поддерживает более широкий смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאִים
  choice: Они идут
  rationale: Причастие мужского рода множественного числа создаёт живую картину приближения; местоимение восполняет подразумеваемое из контекста подлежащее.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: из далёкой страны
  rationale: Здесь אֶרֶץ обозначает страну или землю, а מֶרְחָק — удалённость; сочетание естественно передаётся современным русским выражением.
- source_word: מִקְצֵה הַשָּׁמָיִם
  choice: от края небес
  rationale: קָצֶה означает край, предел или оконечность; формулировка сохраняет образный космический размах еврейского текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, а не заменяющий его титул.
- source_word: וּכְלֵי זַעְמוֹ
  choice: и орудия Его ярости
  rationale: כְּלִי может означать орудие, предмет или оружие. Более широкое «орудия» сохраняет возможный смысл средств исполнения суда, а זַעַם передано сильным и естественным словом «ярость».
- source_word: לְחַבֵּל
  choice: чтобы погубить
  rationale: Инфинитив выражает цель; глагол означает причинить гибель, разорить или уничтожить.
- source_word: כָּל הָאָרֶץ
  choice: всю землю
  rationale: אֶרֶץ допускает значения «земля» и «страна». Основной текст сохраняет более широкий смысл, поддерживаемый небесной образностью стиха.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Масштаб суда в כָּל הָאָרֶץ
  choice: всю землю
  alternative: всю страну
  rationale: Упоминание края небес поддерживает широкий, космический смысл, однако локальное значение лексически возможно и отмечено в сноске.
- issue: Значение כְּלֵי זַעְמוֹ
  choice: орудия Его ярости
  alternative: оружие Его ярости
  rationale: Контекст допускает военное понимание, но כְּלִי шире слова «оружие»; основной вариант не сужает образ без необходимости.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Тире выделяют приложение «Яхве и орудия Его ярости», сохраняя синтаксическое напряжение оригинала. Все варианты в сносках обозначены в основном тексте.
