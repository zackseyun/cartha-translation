lexical_decisions:
- source_word: הֵילִילוּ
  choice: Рыдайте
  rationale: Форма повелительного наклонения множественного числа от ילל призывает к громкому крику скорби или ужаса; «рыдайте» естественно и выразительно передаёт этот смысл.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит причину призыва; «ибо» сохраняет краткий, торжественный пророческий строй.
- source_word: קָרוֹב
  choice: близок
  rationale: Предикативное прилагательное выражает близость и неотвратимость наступления дня.
- source_word: יוֹם יְהוָה
  choice: день Яхве
  rationale: Передаёт устойчивое пророческое выражение о решающем дне вмешательства и суда Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом.
- source_word: כְּשֹׁד
  choice: как разорение
  rationale: В данном контексте שֹׁד обозначает опустошительное разрушение; «разорение» естественно сочетается с приходом бедствия и отчасти поддерживает созвучие со следующим титулом.
- source_word: מִשַּׁדַּי
  choice: от Всемогущего
  rationale: Предлог מן указывает на источник, а שַׁדַּי передан традиционным смысловым эквивалентом божественного титула.
- source_word: יָבֹוא
  choice: он придёт
  rationale: Мужской род глагола согласован с ближайшим грамматическим антецедентом «день»; такая формулировка сохраняет возможную отнесённость прихода ко дню, не исключая общей картины наступающего разорения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Передача титула שַׁדַּי
  choice: Всемогущий
  alternative: Шаддай
  rationale: Это божественный титул, поэтому смысловой перевод понятен современному читателю; утраченное еврейское созвучие отмечено в сноске.
- issue: Референт יָבֹוא
  choice: он придёт — день Яхве
  alternative: оно придёт — разорение
  rationale: Мужской род формы допускает связь с יוֹם «день», однако смысловая картина включает и наступление разорения; перевод не добавляет отдельного действующего лица.
translation_notes:
  register: Современный литературный русский с кратким и торжественным пророческим звучанием. «Рыдайте» сохраняет эмоциональную силу императива; «ибо» уместно для возвышенного, но понятного регистра. Все маркеры сносок включены в основной текст.
