    rationale: Кетив שגל — грубое обозначение полового акта; смысл изнасилования здесь ясно вытекает из контекста разорения. Традиционный кере תשכבנה является более эвфемистическим и допускает буквальное «лягут», поэтому его не следует без оговорки отождествлять с «ими овладеют».
