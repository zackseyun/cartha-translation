  verdict: revise
  source_fidelity: В целом перевод точно передаёт три военных действия и их последовательность. עֹלְלֵיהֶם — «младенцы», לְעֵינֵיהֶם — «у них на глазах», יִשַּׁסּוּ בָּתֵּיהֶם — «дома будут разграблены». В последней клаузе написанная форма (кетив) תשגלנה употребляет грубый сексуальный глагол; в данном контексте «изнасилуют» обоснованно передаёт насильственный смысл. Однако «будут разбивать насмерть» звучит по-русски не вполне естественно и несколько меняет образ повторяющегося действия; совершенное «разобьют» лучше передаёт пророческое пассивное действие רטש без добавления деталей.
  naturalness: «Их младенцев разобьют у них на глазах» — естественная современная литературная формулировка. Она сохраняет намеренно тяжёлый характер стиха. Параллельные будущие формы «разобьют / будут разграблены / изнасилуют» грамматически и стилистически приемлемы.
  terminology: '«Младенцы», «разграблены» и «жёны» точны. «Изнасилуют» не эвфемизирует описанное насилие, но примечание следует уточнить: сам кетив содержит грубый сексуальный глагол, а вывод о насилии определяется прежде всего военным контекстом. Следует также точнее описать традиционное чтение как более эвфемистическое, не представляя его однозначно как форму со страдательным смыслом.'
  issues:
