    issue: Не вполне естественное выражение «будут разбивать насмерть».
    rationale: Оно создаёт оттенок длительного или повторяющегося процесса и звучит тяжеловесно. Простое «разобьют» точнее воспроизводит образ רטש — жестоко разбить/раздавить — и в контексте не смягчает результат.
