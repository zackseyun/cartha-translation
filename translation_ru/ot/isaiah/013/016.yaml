lexical_decisions:
- source_word: עֹלְלֵיהֶם
  choice: их младенцев
  rationale: עֹלֵל обозначает младенцев или совсем маленьких детей; «младенцев» передаёт возраст и беззащитность жертв.
- source_word: יְרֻטְּשׁוּ
  choice: будут разбивать насмерть
  rationale: Страдательная форма רטש описывает жестокое разбивание, ведущее к гибели. Русская безличная конструкция естественна и сохраняет направленность действия на младенцев, не добавляя отсутствующего в тексте орудия.
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Естественный современный русский эквивалент идиомы со значением «в их присутствии, в полной их видимости».
- source_word: יִשַּׁסּוּ
  choice: будут разграблены
  rationale: Глагол означает подвергнуться грабежу или разорению; страдательная конструкция согласуется с домами как подлежащим и звучит естественно по-русски.
- source_word: בָּתֵּיהֶם
  choice: их дома
  rationale: Прямой и естественный эквивалент בַּיִת в контексте военного разграбления.
- source_word: וּנְשֵׁיהֶם
  choice: их жён
  rationale: Форма множественного числа с притяжательным суффиксом здесь естественнее всего означает «их жёны», а не более широкое «их женщины».
- source_word: תשגלנה
  choice: изнасилуют
  rationale: Написанная в масоретском тексте форма содержит грубый глагол сексуального насилия; прямое современное слово не смягчает ужас описываемого военного преступления.
theological_decisions:
- issue: Передача сексуального насилия в пророчестве о суде
  choice: их жён изнасилуют
  alternative: их жёнами овладеют / их жёны будут обесчещены
  rationale: Выбранный вариант прямо передаёт грубую лексику написанного еврейского текста и не превращает описание насилия в эвфемизм. Формулировка описывает ужас суда, не выражая одобрения совершённого.
- issue: Написанная и традиционно читаемая формы последнего глагола
  choice: Основной текст следует написанной форме תשגלנה
  alternative: 'Традиционное чтение תשכבנה: «с ними лягут» / «ими овладеют»'
  rationale: Написанная форма является более прямой и грубой; традиционное чтение смягчает выражение. Различие сохранено в примечании, а не скрыто.
translation_notes:
  register: Современный литературный русский язык; фраза намеренно прямая и тяжёлая, как и еврейский текст. Синтаксис сделан естественным для русского, без смягчения военного насилия и без добавления отсутствующих деталей (например, камней или орудия убийства).
