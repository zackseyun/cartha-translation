base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/012.yaml
  text: I will make mortal man rarer than fine gold[a], and mankind than the gold of Ophir.
translation:
  language: ru
  text: Я сделаю смертного реже чистого золота[a], а человека — реже золота Офира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я сделаю смертного дороже чистого золота». Еврейский глагол может подчёркивать драгоценность или ценность; в данном контексте это, вероятно, подразумевает крайнюю редкость людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹקִיר
  choice: сделаю более редким
  rationale: Хифиль глагола יקר выражает придание ценности или редкости. В контексте опустошительного суда сравнение с золотом указывает прежде всего на крайнюю малочисленность оставшихся людей; формулировка сохраняет и оттенок драгоценности.
- source_word: אֱנוֹשׁ
  choice: смертного человека
  rationale: אֱנוֹשׁ обозначает человека с оттенком слабости и смертности; перевод сохраняет этот смысл и форму единственного числа.
- source_word: מִפָּז
  choice: чем чистое золото
  rationale: פָּז — высококачественное, очищенное золото; «чистое золото» естественно передаёт его особую ценность.
- source_word: וְאָדָם
  choice: и людей
  rationale: אָדָם здесь употреблено собирательно и параллельно אֱנוֹשׁ, обозначая человеческий род; «людей» естественно выражает коллективный смысл по-русски.
- source_word: מִכֶּתֶם אוֹפִיר
  choice: чем золото Офира
  rationale: כֶּתֶם означает драгоценное золото, а Офир славился своим золотом; географическая аллюзия сохранена без избыточного пояснения в тексте.
theological_decisions:
- issue: Значение אוֹקִיר в контексте суда
  choice: сделаю более редким
  alternative: сделаю дороже / драгоценнее
  rationale: Еврейский глагол допускает акцент на ценности, но контекст гибели людей делает редкость наиболее вероятным конкретным смыслом. Альтернативный оттенок сохранён в сноске.
- issue: Собирательное значение אָדָם
  choice: людей
  alternative: человека / человечество
  rationale: Параллелизм описывает малочисленность людей вообще. Множественное «людей» ясно и естественно передаёт собирательное значение, не вводя дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Эллипсис «и людей — чем…» сохраняет поэтический параллелизм оригинала.
