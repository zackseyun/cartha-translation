base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/022.yaml
  text: Hyenas will cry out in her palaces[a], and jackals in her luxurious halls. Her time is near to come[c][b], and her days will not be prolonged.
translation:
  language: ru
  text: 'Гиены[a] завоют в её дворцах[b],

    и шакалы — в роскошных чертогах.

    Её час близок[c],

    и дни её не продлятся.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дикие звери» или «шакалы». Точное значение еврейского слова אִיִּים неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово, переданное как «дворцах», трудно для понимания: буквально его можно связать со словом «вдовы», а его форма имеет суффикс мужского рода. Однако контекст и параллелизм указывают на опустевшие знатные жилища или дворцы.'
    reason: lexical_alternative
  - marker: c
    text: Вавилон олицетворён как женщина, поэтому сказано «её час» и «дни её».
    reason: cultural_note
lexical_decisions:
- source_word: וְעָנָה
  choice: завоют
  rationale: В сочетании с животными среди развалин глагол передаёт их громкий, зловещий крик; буквальное «ответят» по-русски создало бы неуместную двусмысленность.
- source_word: אִיִּים
  choice: гиены
  rationale: Точный вид животных не установлен. «Гиены» соответствует образу хищников-падальщиков среди развалин, а неопределённость отмечена в сноске.
- source_word: בְּאַלְמנוֹתָיו
  choice: в её дворцах
  rationale: Масоретская форма трудна и буквально может быть связана со словом «вдовы», однако параллелизм с роскошными чертогами указывает на разрушенные знатные жилища. Женский род согласован с олицетворённым Вавилоном.
- source_word: וְתַנִּים
  choice: и шакалы
  rationale: В пророческих картинах запустения תַנִּים обычно обозначает шакалов, а не мифических драконов или морских чудовищ.
- source_word: בְּהֵיכְלֵי עֹנֶג
  choice: в роскошных чертогах
  rationale: הֵיכָל обозначает большое дворцовое или храмовое здание, а עֹנֶג — наслаждение и роскошь. «Роскошные чертоги» естественно передаёт былое великолепие этих строений.
- source_word: וְקָרוֹב לָבוֹא עִתָּהּ
  choice: Её час близок
  rationale: Краткая русская формулировка передаёт приближение назначенного Вавилону времени и сохраняет олицетворение города, не добавляя прямо слова «гибель».
- source_word: וְיָמֶיהָ לֹא יִמָּשֵׁכוּ
  choice: и дни её не продлятся
  rationale: Передаёт значение נמשך — «быть продлённым, затянуться» — и сохраняет параллелизм с близким часом Вавилона.
theological_decisions:
- issue: Олицетворение Вавилона
  choice: Женский род в выражениях «её час» и «дни её» сохранён.
  alternative: Передать местоимения средним родом по слову «государство» либо прямо назвать гибель Вавилона.
  rationale: В контексте город Вавилон олицетворён как женщина; сохранение женского рода передаёт образность еврейского текста без дополнительного истолкования.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой поэзии. Строки сохраняют параллелизм: крики животных среди бывшей роскоши, затем близость назначенного срока. Лексика понятна широкому читателю; спорные зоологическое и текстологическое места вынесены в сноски.'
