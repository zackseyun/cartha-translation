lexical_decisions:
- source_word: וְהָיְתָה
  choice: будет низвергнут
  rationale: В пророческом контексте форма указывает на будущее состояние Вавилона; сказуемое естественно восполняется из сравнительного оборота о ниспровержении.
- source_word: בָבֶל
  choice: Вавилон
  rationale: Устоявшееся русское название города; мужской грамматический род требует соответствующего согласования.
- source_word: צְבִי מַמְלָכוֹת
  choice: краса царств
  rationale: Сохраняет поэтическую аппозицию и значение красоты, украшения или славы среди царств.
- source_word: תִּפְאֶרֶת גְּאוֹן כַּשְׂדִּים
  choice: великолепие и гордость халдеев
  rationale: Передаёт два тесно связанных понятия — великолепие и величавую гордость; союз делает сжатую еврейскую конструкцию понятной по-русски, не снимая смысловой неоднозначности גְּאוֹן.
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: будет низвергнут Богом, как
  rationale: Передаёт сравнение и явно обозначенного в еврейском тексте божественного деятеля; «низвергнут» соответствует катастрофическому перевороту и разрушению.
- source_word: אֶת סְדֹם וְאֶת עֲמֹרָה
  choice: Содом и Гоморра
  rationale: Устоявшиеся русские формы названий; показатели прямого дополнения отдельно не переводятся.
theological_decisions:
- issue: Значение גְּאוֹן в пророчестве о суде
  choice: гордость
  alternative: величие, величавость
  rationale: Контекст суда допускает отрицательный оттенок гордости, однако слово также может обозначать нейтральное величие; альтернативный смысл сохранён в сноске.
- issue: Бог как деятель ниспровержения
  choice: низвергнут Богом
  alternative: станет подобен ниспровержению Содома и Гоморры Богом
  rationale: Естественная русская перестройка сохраняет прямое указание еврейского текста на Бога как деятеля и не ослабляет богословскую напряжённость образа суда.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной пророческой дикцией. «Краса царств» сохраняет поэтичность; синтаксис слегка перестроен ради ясности и естественного согласования названия «Вавилон» мужского рода.
