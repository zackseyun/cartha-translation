translation:
  language: ru
  text: Пророчество о Вавилоне[a], которое видел Исаия, сын Амоса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бремя Вавилона»; или: «Изречение против Вавилона». Еврейское слово מַשָּׂא служит заголовком весомого пророческого сообщения, часто возвещающего суд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: пророчество
  rationale: В заголовках пророческих книг это слово обозначает весомое пророческое изречение, нередко содержащее суд. «Пророчество» естественно для современного русского языка и не создаёт предметного образа, возможного при буквальном «бремя».
- source_word: בָּבֶל
  choice: Вавилон
  rationale: Общепринятая русская форма географического названия.
- source_word: אֲשֶׁר
  choice: которое
  rationale: Относительное местоимение вводит придаточное определительное, относящееся к слову «пророчество».
- source_word: חָזָה
  choice: видел
  rationale: Сохраняет прямое значение глагола «видеть» и присущий контексту оттенок пророческого видения, не раскрывая его пояснительным переводом.
- source_word: יְשַׁעְיָהוּ
  choice: Исаия
  rationale: Традиционная и общепринятая русская форма имени пророка.
- source_word: בֶּן
  choice: сын
  rationale: Естественная русская передача древнееврейского родословного обозначения.
- source_word: אָמֽוֹץ
  choice: Амос
  rationale: Традиционная русская форма имени אָמוֹץ; это имя отца Исаии, не тождественное имени пророка Амоса в древнееврейском написании.
theological_decisions:
- issue: Передача пророческого заголовка מַשָּׂא
  choice: «Пророчество о Вавилоне»
  alternative: «Бремя Вавилона»; «Изречение против Вавилона»
  rationale: Формулировка передаёт жанр весомого пророческого сообщения и сохраняет широкое отношение к Вавилону. Предлог «о» не сужает смысл заранее до направленного против него приговора, хотя дальнейший текст содержит суд.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем пророческого заголовка. Сохранён глагол зрительного восприятия «видел», без поясняющего добавления «в видении».
