base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/002.yaml
  text: On a bare mountain raise a signal[a]; lift up the voice to them; wave the hand[c][b], that they may enter the gates of the nobles.
translation:
  language: ru
  text: На обнажённой горе поднимите знамя[a], возвышайте голос, обращаясь к ним, взмахните рукой[b], чтобы они вошли в ворота знатных[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сигнальный знак» или «стяг». Еврейское נֵס часто обозначает поднятый военный знак, служащий для сбора или направления войска.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поманите рукой». Вероятно, этот жест служит призывом наступающему войску.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «князей». Еврейское נְדִיבִים может обозначать знатных, князей или других видных предводителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁפֶּה
  choice: обнажённой
  rationale: Передаёт образ горы, лишённой растительности или иного покрова, то есть открытой и хорошо видимой; это естественно для места, где поднимают знак.
- source_word: נֵס
  choice: знамя
  rationale: В военно-пророческом контексте слово обозначает поднятый знак, служащий для сбора или направления войска. «Знамя» сохраняет предметный образ; функциональное «сигнал» дано в примечании.
- source_word: הָרִימוּ קוֹל
  choice: возвысьте к ним голос
  rationale: Сохраняет еврейскую идиому «поднимите голос» в достойном поэтическом регистре и ясно выражает громкий призыв.
- source_word: לָהֶם
  choice: к ним
  rationale: Предлог естественно указывает направление призыва к подразумеваемым войскам, не уточняя их сверх текста.
- source_word: הָנִיפוּ יָד
  choice: подайте знак рукой
  rationale: Естественно по-русски передаёт взмах или жест рукой и его призывную функцию, не уточняя конкретную форму жеста.
- source_word: וְיָבֹאוּ
  choice: чтобы они вошли
  rationale: После ряда повелений форма естественно выражает цель или результат; «вошли» согласуется с последующим упоминанием ворот.
- source_word: פִּתְחֵי
  choice: ворота
  rationale: В контексте города или укрепления множественное слово об обозначенных входах естественнее всего передаётся как «ворота».
- source_word: נְדִיבִים
  choice: знатных
  rationale: Обозначает высокопоставленных или влиятельных людей, но не требует более узкого значения «князья».
