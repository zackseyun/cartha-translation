  to: Гул множества в горах[a] — словно гул многочисленного народа! Шум царств, народов, собравшихся вместе[b]! Яхве Воинств собирает войско для битвы.
  rationale: Уточнён количественный смысл רַב и сделано явным, что сравнение относится к звуку. Во второй строке сохранены «царства» и «народы» как нарастающие элементы перечисления; сноска оставляет возможное более тесное синтаксическое соединение «царств народов». Имя и титул Бога, военная терминология и оба сносочных якоря сохранены.
