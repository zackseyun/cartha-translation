  text: ק֥וֹל הָמ֛וֹן בֶּֽ/הָרִ֖ים דְּמ֣וּת עַם רָ֑ב ק֠וֹל שְׁא֞וֹן מַמְלְכ֤וֹת גּוֹיִם֙ נֶֽאֱסָפִ֔ים יְהוָ֣ה צְבָא֔וֹת מְפַקֵּ֖ד צְבָ֥א מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/004.yaml
  text: The sound of a multitude in the mountains[a], like a great people! The sound of an uproar of kingdoms[b], of nations gathered together! Yahweh of hosts is mustering an army for battle.
translation:
  language: ru
  text: Гул множества в горах[a] — словно гул многочисленного народа! Шум царств, народов, собравшихся вместе[b]! Яхве Воинств собирает войско для битвы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на горах».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Шум царств народов, собравшихся вместе».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ק֥וֹל הָמ֛וֹן
  choice: Гул множества
  rationale: קוֹל обозначает звук или голос, а הָמוֹן — множество либо шумную толпу. «Гул множества» естественно передаёт одновременно слышимый шум и многочисленность собравшихся.
- source_word: בֶּהָרִים
  choice: в горах
  rationale: Предлог בְּ имеет здесь естественное местное значение; «в горах» сохраняет пространственный образ. Вариант «на горах» также грамматически возможен и отмечен в сноске.
- source_word: דְּמוּת עַם רָב
  choice: словно великого народа
  rationale: דְּמוּת буквально означает «подобие», но здесь вводит сравнение; עַם רָב может указывать на великий или многочисленный народ. Родительный оборот по-русски восполняет подразумеваемое «гул».
- source_word: שְׁאוֹן
  choice: Шум
  rationale: Слово обозначает громкий шум, грохот или смятение. «Шум» ясно и без излишней конкретизации передаёт звуковой образ.
- source_word: מַמְלְכוֹת גּוֹיִם נֶאֱסָפִים
  choice: царств, собравшихся народов
  rationale: Последовательность существительных допускает понимание «царства народов», а причастие мужского рода множественного числа грамматически согласуется с גּוֹיִם («народы»). Перевод сохраняет эту связь и плотную поэтическую конструкцию.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יהוה передано как «Яхве», а традиционный титул צְבָאוֹת — как «Воинств», что сохраняет его широкий смысл и связь с военной образностью стиха.
- source_word: מְפַקֵּד
  choice: собирает
  rationale: В военном контексте פקד означает проводить смотр, пересчитывать или созывать войска. «Собирает» понятно современному читателю и точно выражает подготовку сил к битве.
- source_word: צְבָא מִלְחָמָה
  choice: войско для битвы
  rationale: Сочетание буквально относится к боевому войску. Целевая конструкция «для битвы» естественна по-русски и сохраняет военный смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Передача титула יהוה צבאות
  choice: Яхве Воинств
  alternative: Яхве Сил; Господь воинств
  rationale: «Воинств» сохраняет намеренную перекличку с собираемым войском, не ограничивая титул исключительно земными армиями.
translation_notes:
  register: Современный литературный русский язык с возвышенным, энергичным ритмом пророческого возгласа. Повторение звуковой образности передано словами «гул» и «шум»; восклицания и краткие фразы сохраняют нарастающее напряжение оригинала.
