  rationale: Правка восстанавливает притяжательный оттенок «Моим посвящённым» и союз גַּם, а также заменяет неестественное «совершить гнев» на ясное «для исполнения Моего гнева». Основное решение для трудного выражения עַלִּיזֵי גַּאֲוָתִי сохранено, а альтернативные понимания оставлены в сноске.
