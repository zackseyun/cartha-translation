  text: אֲנִ֥י צִוֵּ֖יתִי לִ/מְקֻדָּשָׁ֑/י גַּ֣ם קָרָ֤אתִי גִבּוֹרַ/י֙ לְ/אַפִּ֔/י עַלִּיזֵ֖י גַּאֲוָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/003.yaml
  text: I myself have commanded my consecrated ones; I have also summoned my warriors for my anger[a], my proudly exulting ones.
translation:
  language: ru
  text: Я Сам отдал повеление Моим посвящённым; также Я призвал Моих воинов для исполнения Моего гнева — ликующих о Моём величии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «торжествующих в Моей победе»; возможно также: «Моих горделиво ликующих [воинов]».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Я Сам
  rationale: Самостоятельное местоимение при личной форме глагола имеет эмфатическую функцию; «Я Сам» естественно передаёт это ударение по-русски.
- source_word: צִוֵּיתִי
  choice: повелел
  rationale: Пиэль от צוה означает «повелеть, поручить»; совершенный вид соответствует представлению действия как уже решённого и совершённого.
- source_word: לִמְקֻדָּשָׁי
  choice: посвящённым Мною
  rationale: Страдательное причастие от קדשׁ обозначает людей, отделённых Богом для определённой цели; творительная конструкция ясно выражает, кем они посвящены, не приписывая им нравственной святости.
- source_word: גַּם קָרָאתִי
  choice: созвал
  rationale: В контексте сбора войска קרא передаёт призыв к выступлению; русское «созвал» естественно выражает военный контекст. גַּם связывает это действие с предыдущим, но отдельное «также» в русском здесь необязательно.
- source_word: גִּבּוֹרַי
  choice: Моих воинов
  rationale: גבור может означать сильного, доблестного человека или воина; военный контекст главы поддерживает конкретное «воины».
- source_word: לְאַפִּי
  choice: чтобы совершить Мой гнев
  rationale: אַף идиоматически означает гнев, а לְ выражает цель или направленность. Добавление «совершить» делает русскую фразу понятной, не меняя функции призванных как исполнителей суда.
- source_word: עַלִּיזֵי גַּאֲוָתִי
  choice: ликующих о Моём величии
  rationale: עַלִּיזֵי обозначает ликующих, а גַּאֲוָה может означать величие, возвышенность, гордость или торжество. Основной вариант сохраняет генитивную связь и богословскую неоднозначность лучше, чем характеристика «горделиво ликующие».
theological_decisions:
- issue: Означает ли «посвящённые» нравственно святых или людей, отделённых для исполнения Божьего суда
  choice: Люди, которых Бог отделил для исполнения Своей цели
  alternative: Нравственно святые люди или ангельские существа
  rationale: Ближайший контекст описывает созыв сил против Вавилона; посвящение здесь функционально и само по себе не утверждает нравственной святости исполнителей.
- issue: Как понимать עַלִּיזֵי גַּאֲוָתִי
  choice: «ликующих о Моём величии»
  alternative: «торжествующих в Моей победе» или «горделиво ликующих Моих»
  rationale: Сжатая древнееврейская конструкция допускает отнесение ликования к Божьему величию или торжеству, а также характеристику самих воинов. Основной текст и примечание сохраняют эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным синтаксисом. Заглавные местоимения, относящиеся к Богу, применены последовательно. Тире отделяет пояснительную характеристику призванных воинов.
