base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/010.yaml
  text: For the stars of the heavens and their constellations will not give their light; the sun is darkened at its rising[a], and the moon will not make its light shine.
translation:
  language: ru
  text: Ибо звёзды небес и их созвездия[a] не дадут своего света; солнце померкнет при восходе, и луна не засияет своим светом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их Орионы». Еврейское слово может обозначать созвездие Ориона, но здесь, во множественном числе, возможно, употреблено шире — о созвездиях вообще.'
    reason: Лексическая неоднозначность слова כְּסִיל и необычное множественное число.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предшествующего провозглашения суда; «ведь» естественно передаёт эту связь по-русски.
- source_word: כוֹכְבֵי הַשָּׁמַיִם
  choice: звёзды небес
  rationale: Сохранена поэтическая конструкция оригинала без тяжеловесного «небесные звёзды».
- source_word: וּכְסִילֵיהֶם
  choice: и их созвездия[a]
  rationale: Множественное число в этом контексте допускает обобщённое обозначение созвездий; возможное конкретное значение «Орионы» отмечено в сноске.
- source_word: לֹא יָהֵלּוּ אוֹרָם
  choice: не дадут своего света
  rationale: Естественно передаёт каузативную идею испускания света и сохраняет образ оригинала.
- source_word: חָשַׁךְ הַשֶּׁמֶשׁ בְּצֵאתוֹ
  choice: солнце померкнет при восходе
  rationale: Будущее время уместно в пророческом описании грядущего суда, а «при восходе» ясно передаёт буквальное «при его выходе».
- source_word: וְיָרֵחַ לֹא יַגִּיהַ אוֹרוֹ
  choice: и луна не даст сиять своему свету
  rationale: Передан каузативный оттенок глагола נגהּ при сохранении естественного русского синтаксиса.
theological_decisions:
- issue: Характер образа помрачения небесных светил
  choice: Передать космический образ прямо, не разъясняя его как исключительно буквальное или исключительно метафорическое событие.
  alternative: Истолковать его либо как буквальное эсхатологическое потрясение, либо как метафору падения земных держав.
  rationale: Еврейский текст использует образ космического распада в пророчестве о суде, но сам перевод не должен устранять заложенную в нём интерпретационную напряжённость.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Параллелизм трёх небесных образов сохранён; толкование космической образности в основной текст не внесено.
