  text: עַל כֵּ֖ן כָּל יָדַ֣יִם תִּרְפֶּ֑ינָה וְ/כָל לְבַ֥ב אֱנ֖וֹשׁ יִמָּס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/007.yaml
  text: Therefore all hands will grow weak[a], and every human heart will melt.
translation:
  language: ru
  text: Поэтому все руки ослабеют, и сердце каждого человека растает.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сердце каждого смертного». Еврейское אֱנוֹשׁ обозначает человека вообще и нередко подчёркивает его слабость и смертность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт краткое следственное заключение, связывающее стих с предшествующим возвещением суда.
- source_word: כָּל יָדַיִם
  choice: все руки
  rationale: Сохраняет собирательную множественную форму и телесный образ утраты силы и способности действовать.
- source_word: תִּרְפֶּינָה
  choice: ослабеют
  rationale: Глагол רפה обозначает утрату силы, вялость; «ослабеют» естественно звучит по-русски и не устраняет образ бессильных рук.
- source_word: וְכָל לְבַב אֱנוֹשׁ
  choice: и сердце каждого человека
  rationale: Передаёт дистрибутивное значение конструкции и общий, не ограниченный мужчинами смысл אֱנוֹשׁ; слово также может подчёркивать человеческую немощь и смертность.
- source_word: יִמָּס
  choice: растает
  rationale: Сохраняет буквальную метафору таяния сердца, выражающую страх и крушение мужества.
theological_decisions:
- issue: Значение אֱנוֹשׁ в обобщающем выражении
  choice: человека
  alternative: смертного; человека — в смысле представителя человечества
  rationale: В контексте существительное имеет обобщённое значение и не указывает исключительно на мужчину, но может нести оттенок человеческой слабости и смертности. Основной текст остаётся естественным, а оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного пророческого параллелизма и образов ослабевших рук и тающего сердца.
