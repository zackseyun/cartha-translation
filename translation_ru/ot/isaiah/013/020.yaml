    text: 'Или: «пустынный кочевник». Еврейское слово может обозначать как араба в собственном смысле, так и, в данном контексте, кочевого жителя пустыни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵשֵׁב
  choice: будет заселена
  rationale: Глагол יָשַׁב буквально означает «сидеть, жить, обитать», но при подразумеваемом городе как подлежащем естественно передаётся по-русски как «быть заселённым».
- source_word: לָנֶצַח
  choice: вовеки
  rationale: Сочетание выражает непрекращающуюся длительность; в отрицательной конструкции «не будет… вовеки» сохраняет категоричность пророческого высказывания и возвышенный регистр.
- source_word: תִשְׁכֹּן
  choice: жить в ней не будут
  rationale: שָׁכַן означает «обитать, селиться». Безлично-личная русская конструкция звучит естественно и сохраняет отличие от предшествующего «будет заселена».
- source_word: עַד דּוֹר וָדוֹר
  choice: из поколения в поколение
  rationale: Так передаётся еврейский оборот о непрерывности на протяжении сменяющих друг друга поколений.
- source_word: יַהֵל
  choice: раскинет шатра
  rationale: Форма глагола אהל означает разбить или поставить шатёр; выбранный оборот естественен для кочевого контекста и соответствует литературному регистру.
- source_word: עֲרָבִי
  choice: араб
  rationale: Наиболее прямое значение существительного — «араб, аравитянин»; возможное более широкое контекстуальное значение «пустынный кочевник» отмечено в сноске.
- source_word: רֹעִים
  choice: пастухи
  rationale: Причастие от רעה обозначает людей, пасущих стада; «пастухи» — ясный и обычный русский эквивалент.
- source_word: יַרְבִּיצוּ
  choice: не уложат … стада на отдых
  rationale: Каузативная форма רבץ означает «дать лечь, уложить». Объект «свои стада» восстановлен из пастушеского контекста, чтобы не создать впечатления, будто ложатся сами пастухи.
