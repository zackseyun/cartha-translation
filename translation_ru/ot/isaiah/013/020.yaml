  text: It will never be inhabited[a], and it will not be dwelt in from generation to generation; no Arab will pitch his tent there, and shepherds will not make their flocks lie down there.
translation:
  language: ru
  text: Она никогда не будет заселена, и из поколения в поколение в ней не будут жить. Ни один араб[a] не раскинет там шатра, и пастухи не уложат там свои стада.
  philosophy: optimal-equivalence
  footnotes:
