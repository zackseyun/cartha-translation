  text: They will be dismayed; pains and labor pangs will seize them[a]. They will writhe like a woman giving birth. Each man will stare at his neighbor; their faces will be faces of flame.
translation:
  language: ru
  text: Они придут в ужас; муки и родовые схватки охватят их. Они будут корчиться, как роженица. Каждый будет смотреть на другого в изумлении; их лица — лица пламени[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их лица будут пылать». Буквально в еврейском тексте: «их лица — лица пламени». Этот яркий образ может указывать на пламенеющий вид лиц или на ужас, ставший видимым на лице.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִבְהָלוּ
  choice: они придут в ужас
  rationale: Нифаль глагола בהל обозначает внезапный испуг, смятение или ужас. Выражение «придут в ужас» передаёт наступление этого состояния и естественно звучит по-русски.
- source_word: צִירִים וַחֲבָלִים
  choice: муки и родовые схватки
  rationale: Первое существительное имеет более общее значение сильных мучительных болей, а второе в данном контексте, особенно перед сравнением с роженицей, указывает на родовые боли. Сочетание сохраняет нарастание образа.
- source_word: יֹאחֵזוּן
  choice: охватят их
  rationale: Глагол אחז означает «схватить, овладеть». По-русски боли и схватки естественно «охватывают» человека; при этом сохраняется образ овладевающей силы.
- source_word: כַּיּוֹלֵדָה יְחִילוּן
  choice: они будут корчиться, как роженица
  rationale: Причастие יולדה обозначает женщину, рожающую ребёнка, а יחילון в контексте родовых мучений передаёт телесное содрогание и корчи. «Роженица» кратко и точно выражает состояние женщины во время родов.
- source_word: אִישׁ אֶל־רֵעֵהוּ יִתְמָהוּ
  choice: один на другого будут смотреть в изумлении
  rationale: Оборот איש אל־רעהו имеет распределительное значение «один на другого», а глагол תמה выражает ошеломлённое, изумлённое разглядывание. Формулировка сохраняет взаимную направленность взглядов.
- source_word: פְּנֵי לְהָבִים פְּנֵיהֶם
  choice: их лица — лица пламени
  rationale: 'Буквально: «лица пламени — их лица». Необычная именная метафора сохранена, чтобы не сводить многозначный образ лишь к покраснению, бледности или выражению ужаса.'
