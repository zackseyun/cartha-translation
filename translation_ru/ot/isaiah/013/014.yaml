base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/014.yaml
  text: And it will be like a hunted gazelle[a], and like sheep with no one to gather them; each man will turn to his own people[b], and each will flee to his own land.
translation:
  language: ru
  text: 'И будет как с гонимой газелью[a] и как с овцами, которых некому собрать: каждый обратится к своему народу[b], и каждый побежит в свою страну.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как с газелью, которую отогнали»; еврейское причастие может означать «гонимая», «отогнанная» или «прогнанная».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское «мужчина/человек» употреблено в дистрибутивном значении: «каждый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет он
  rationale: Форма היה с союзом в контексте пророчества обозначает будущее состояние; мужское местоимение соотносится с собирательным образом народа/пришельцев в ближайшем контексте, хотя в еврейском подлежащее прямо не названо.
- source_word: כִּצְבִי מֻדָּח
  choice: как вспугнутая газель
  rationale: צְבִי естественно передаётся как «газель», а пассивное מֻדָּח означает изгнанную, отогнанную или преследуемую. «Вспугнутая» сохраняет образ испуганного животного, вынужденного бежать, не сужая значение исключительно до охоты.
- source_word: וּכְצֹאן וְאֵין מְקַבֵּץ
  choice: и как овцы, которых некому собрать
  rationale: צֹאן обозначает мелкий скот или стадо; в данном пастушеском образе естественно «овцы». Оборот אֵין с причастием выражает отсутствие того, кто мог бы собрать рассеянных овец.
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  choice: Каждый обратится к своему народу
  rationale: אִישׁ употреблено дистрибутивно — «каждый». פנה означает повернуться или обратиться к кому-либо; «обратится» сохраняет направленность действия без добавления прямо не выраженной идеи возвращения.
- source_word: וְאִישׁ אֶל אַרְצוֹ יָנוּסוּ
  choice: и каждый побежит в свою землю
  rationale: נוּס означает бежать, спасаясь от опасности. אֶרֶץ здесь — родная земля или страна; «в свою землю» близко к форме и смыслу оригинала.
theological_decisions:
- issue: Дистрибутивное употребление אִישׁ
  choice: «каждый» в обоих параллельных оборотах
  alternative: «каждый мужчина» / «каждый человек»
  rationale: В данном контексте אִישׁ выполняет дистрибутивную функцию и относится к каждому члену описываемой группы. Русское «каждый» точно и естественно передаёт эту функцию, не превращая грамматический мужской род в специальное утверждение только о мужчинах.
- issue: Неявное подлежащее וְהָיָה
  choice: «он»
  alternative: безличное «и будет» или множественное «они будут»
  rationale: Еврейская форма стоит в мужском единственном числе и продолжает собирательное описание из контекста. Русское «он» сохраняет число исходной формы, при этом последующие множественные глаголы раскрывают дистрибутивное поведение людей.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма. «Вспугнутая газель» звучит естественно и передаёт уязвимость и бегство; синтаксис второй половины сделан ясным и ритмически параллельным.
