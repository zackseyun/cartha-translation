base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/015.yaml
  text: Everyone who is found will be pierced through[a], and everyone who is caught will fall by the sword.
translation:
  language: ru
  text: Каждый, кого найдут, будет пронзён, и каждый, кого захватят[a], падёт от меча.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кого сметёт»; еврейское причастие от ספה имеет более широкий смысл и может обозначать того, кто захвачен общей гибелью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: каждый
  rationale: При субстантивированных причастиях слово употреблено дистрибутивно и относится к каждому человеку в отдельности.
- source_word: הַנִּמְצָא
  choice: кого найдут
  rationale: Нифальское причастие от מצא имеет пассивный смысл; эта формулировка естественно передаёт значение «тот, кто будет найден».
- source_word: יִדָּקֵר
  choice: будет пронзён
  rationale: Нифальский имперфект от דקר обозначает пронзание оружием; «будет пронзён» сохраняет силу образа и возвышенно-нейтральный регистр.
- source_word: וְכָל
  choice: и каждый
  rationale: Союз связывает параллельные части стиха, а повтор слова «каждый» сохраняет его дистрибутивный охват.
- source_word: הַנִּסְפֶּה
  choice: кого захватят
  rationale: Пассивное причастие от ספה допускает несколько толкований. В контексте военного разгрома «кого захватят» естественно передаёт вероятный смысл, а более широкая лексическая неоднозначность отмечена в сноске.
- source_word: יִפּוֹל
  choice: падёт
  rationale: Глагол נפל в военном контексте означает гибель; буквальное «падёт» естественно сочетается с выражением «от меча».
- source_word: בֶּחָרֶב
  choice: от меча
  rationale: Это обычное древнееврейское обозначение гибели посредством оружия; русский оборот «пасть от меча» точно и естественно передаёт идиому.
