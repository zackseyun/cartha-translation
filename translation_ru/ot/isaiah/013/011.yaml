  text: וּ/פָקַדְתִּ֤י עַל תֵּבֵל֙ רָעָ֔ה וְ/עַל רְשָׁעִ֖ים עֲוֺנָ֑/ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן זֵדִ֔ים וְ/גַאֲוַ֥ת עָרִיצִ֖ים אַשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/011.yaml
  text: And I will punish the world for its evil[a], and the wicked for their iniquity; I will put an end to the pride of the arrogant[b], and I will humble the haughtiness of the ruthless.
translation:
  language: ru
  text: Я накажу мир[a] за зло и нечестивых — за их беззаконие; положу конец гордыне надменных и унижу высокомерие жестоких.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обитаемый мир».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: Я накажу
  rationale: В сочетании с עַל и указанием на зло и нечестивых глагол פקד выражает карающее взыскание; «накажу» естественно и ясно передаёт судебный смысл.
- source_word: תֵּבֵל
  choice: мир
  rationale: Слово обозначает мир как обитаемую землю; «мир» сохраняет широкий масштаб высказывания и естественно звучит по-русски.
- source_word: רָעָה
  choice: зло
  rationale: Параллель с нечестивыми и их беззаконием указывает на нравственное зло, а не на бедствие.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Традиционное и понятное обозначение людей, виновных в нравственном зле; сохраняет краткую субстантивированную форму.
- source_word: עֲוֺנָם
  choice: их беззаконие
  rationale: Здесь עָוֹן обозначает нравственную вину или преступление, за которое следует наказание; «беззаконие» сохраняет этическую весомость слова.
- source_word: וְהִשְׁבַּתִּי
  choice: положу конец
  rationale: Каузативная форма означает «заставить прекратиться»; выбранное выражение естественно передаёт прекращение гордыни.
- source_word: גְּאוֹן
  choice: гордыне
  rationale: В сочетании с זֵדִים слово имеет отрицательный смысл гордого самовозвышения.
- source_word: זֵדִים
  choice: надменных
  rationale: Передаёт значение дерзких, самонадеянных и высокомерных людей без излишнего сужения смысла.
- source_word: וְגַאֲוַת
  choice: высокомерие
  rationale: Сохраняет параллелизм с «гордыней», одновременно различая два близких еврейских выражения.
- source_word: עָרִיצִים
  choice: жестоких
  rationale: Слово обозначает жестоких, насильственных и угнетающих людей; перевод не ограничивает его формальными правителями-тиранами.
- source_word: אַשְׁפִּיל
  choice: унижу
  rationale: Каузатив от שׁפל означает «сделать низким, низвести»; «унижу» сохраняет образ низведения и хорошо сочетается с «высокомерием».
theological_decisions:
- issue: Масштаб суда в слове תֵּבֵל
  choice: Суд обращён к миру в его обитаемом человеческом порядке, а не только к Вавилону.
  alternative: Понимать слово как «землю» или исключительно Вавилон, представленный как весь мир.
  rationale: Хотя глава представляет пророчество о Вавилоне, תֵּבֵל и универсальные нравственные категории расширяют перспективу; перевод «мир» сохраняет эту напряжённость, не устраняя конкретного контекста главы.
- issue: Соотношение двух параллельных выражений о гордости
  choice: 'Сохранены две близкие, но различные формулировки: «гордыня надменных» и «высокомерие жестоких».'
  alternative: Объединить их или переставить свойства групп, например «низвергну гордыню жестоких».
  rationale: Еврейский текст содержит две параллельные строки с различными существительными и обозначениями людей; перевод сохраняет их разграничение и поэтическое усиление.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Точка с запятой сохраняет двухчастный параллелизм; тире перед «за их беззаконие» естественно восполняет эллипсис русского предложения. Термины «беззаконие» и «гордыня» dignified, но понятны широкому читателю.
