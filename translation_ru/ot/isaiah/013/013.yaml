base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/013.yaml
  text: Therefore I will make the heavens tremble[a], and the earth will shake from its place, at the fury of Yahweh of Armies, in the day of his burning anger.
translation:
  language: ru
  text: Поэтому Я заставлю небеса содрогнуться, и земля сдвинется со своего места — от ярости Яхве Воинств[a], в день Его пылающего гнева.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по традиции: «Господа Саваофа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Кратко и естественно передаёт причинно-следственную связь с предшествующим возвещением суда.
- source_word: שָׁמַיִם אַרְגִּיז
  choice: Я заставлю небеса содрогнуться
  rationale: «Заставлю» сохраняет каузативное значение породы хифиль, а «небеса» передаёт космический масштаб образа.
- source_word: וְתִרְעַשׁ הָאָרֶץ
  choice: и земля сдвинется
  rationale: Глагол обозначает сильное сотрясение; в сочетании «со своего места» глагол «сдвинется» естественно выражает результат этого потрясения.
- source_word: מִמְּקוֹמָהּ
  choice: со своего места
  rationale: Прямо передаёт идею смещения земли с принадлежащего ей места.
- source_word: בְּעֶבְרַת
  choice: от ярости
  rationale: Передаёт интенсивный, переполняющий гнев и естественно обозначает причину космического потрясения.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Имя יהוה передано как «Яхве», а צבאות переведено прозрачным титулом «Воинств», сохраняющим военный оттенок контекста.
- source_word: וּבְיוֹם
  choice: в день
  rationale: Сохраняет характерную пророческую временную формулу.
- source_word: חֲרוֹן אַפּוֹ
  choice: Его пылающего гнева
  rationale: Сохраняет метафору жара, заключённую в еврейском выражении, и звучит естественно по-русски.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит тетраграмматон; форма «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Передача титула יהוה צבאות
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве воинств; Яхве небесных воинств
  rationale: «Воинств» сохраняет широту неоднозначного צבאות и традиционную возвышенность, не уточняя без достаточного основания, идёт ли речь исключительно о небесных или земных войсках.
translation_notes:
  register: Современный литературный русский язык с возвышенным пророческим звучанием. Синтаксический параллелизм и космический масштаб образа сохранены; тире помогает ясно связать потрясение небес и земли с яростью Яхве.
