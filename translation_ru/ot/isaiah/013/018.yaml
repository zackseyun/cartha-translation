lexical_decisions:
- source_word: קְשָׁתוֹת
  choice: луки
  rationale: Обычное значение существительного — «луки»; женская форма глагола естественно согласуется с его формой множественного числа. Возможное метонимическое понимание «лучники» вынесено в сноску.
- source_word: נְעָרִים
  choice: юношей
  rationale: Слово может обозначать мальчиков, юношей или молодых мужчин; в военном контексте «юноши» передаёт молодость жертв, не ограничивая значение малыми детьми.
- source_word: תְּרַטַּשְׁנָה
  choice: раздробят
  rationale: Порода пиэль выражает жестокое разбивание или раздробление; выбранный глагол сохраняет силу и конкретность образа.
- source_word: פְרִי בֶטֶן
  choice: плодом чрева
  rationale: Сохранён устойчивый древнееврейский образ потомства, рождённого из чрева; выражение литературно и узнаваемо по-русски.
- source_word: יְרַחֵמוּ
  choice: не сжалятся
  rationale: Глагол обозначает сострадание и милосердие; русское «не сжалятся над» естественно передаёт как чувство, так и его практическое отсутствие.
- source_word: בָּנִים
  choice: детей
  rationale: Формально слово означает «сыновья», но в параллели с «плодом чрева» вероятно употреблено в общем смысле потомства; альтернатива отмечена в сноске.
- source_word: תָחוּס עֵינָם
  choice: не пощадит их глаз
  rationale: Сохранены единственное число собирательного образа «глаз» и значение חוס «щадить»; несколько необычный порядок слов поддерживает выразительность еврейской идиомы, оставаясь понятным по-русски.
