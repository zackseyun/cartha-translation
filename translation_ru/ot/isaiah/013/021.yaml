  text: וְ/רָבְצוּ שָׁ֣ם צִיִּ֔ים וּ/מָלְא֥וּ בָתֵּי/הֶ֖ם אֹחִ֑ים וְ/שָׁ֤כְנוּ שָׁם֙ בְּנ֣וֹת יַֽעֲנָ֔ה וּ/שְׂעִירִ֖ים יְרַקְּדוּ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/021.yaml
  text: But desert creatures will lie down there[a], and their houses will be full of owls; ostriches will dwell there[b], and wild goats will dance there.
translation:
  language: ru
  text: Но там будут лежать пустынные звери, дома их наполнятся совами[a]; там поселятся страусы, и дикие козлы[b] будут там плясать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воющими существами» либо «шакалами»; точное значение еврейского слова אֹחִים неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «козлоподобные демоны» либо «сатиры»; еврейское שְׂעִירִים может обозначать косматых козлов, а в некоторых контекстах иметь мифические или демонические ассоциации.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָבְצוּ
  choice: будут лежать
  rationale: Глагол רבץ обычно изображает животных, которые ложатся или располагаются на месте; перевод сохраняет конкретный образ заселения развалин.
- source_word: צִיִּים
  choice: пустынные звери
  rationale: Слово обозначает обитателей пустынных и опустевших мест без надёжного указания на конкретный вид; обобщённый перевод сохраняет эту неопределённость.
- source_word: וּמָלְאוּ בָתֵּיהֶם
  choice: дома их наполнятся
  rationale: Сохранены прямое значение глагола и местоименная отсылка еврейского текста к домам города или его жителей.
- source_word: אֹחִים
  choice: совами
  rationale: Точное значение редкого названия животного не установлено. «Совы» соответствует традиционному пониманию и образу заброшенных домов, а существенная лексическая неопределённость отмечена в сноске.
- source_word: וְשָׁכְנוּ
  choice: поселятся
  rationale: Глагол שׁכן означает обитать или селиться; «поселятся» естественно передаёт занятие опустевшего места.
- source_word: בְּנוֹת יַעֲנָה
  choice: страусы
  rationale: Буквально составное выражение имеет форму «дочери страуса», но употребляется как зоологическое наименование; по-русски естественно назвать вид прямо.
- source_word: וּשְׂעִירִים
  choice: дикие козлы
  rationale: Основное значение — «косматые», то есть козлы. Контекст допускает сверхъестественные ассоциации, однако не требует однозначно демонического перевода; эта возможность вынесена в сноску.
- source_word: יְרַקְּדוּ
  choice: будут плясать
  rationale: Глагол может означать плясать, скакать или подпрыгивать. «Плясать» сохраняет яркий и зловещий поэтический образ.
theological_decisions:
- issue: Следует ли понимать שְׂעִירִים как обычных животных или как демонических существ
  choice: В основном тексте — «дикие козлы»
  alternative: «козлоподобные демоны» или «сатиры»
  rationale: Лексическая основа слова указывает на косматых козлов, хотя в некоторых библейских контекстах оно получает мифические или демонические оттенки. Перевод не усиливает демонологическое толкование сверх того, что определённо выражено в данном стихе, но сохраняет альтернативу в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Плясать» передаёт поэтическую выразительность без архаизации; неопределённые названия существ не конкретизированы сверх доступных данных.
