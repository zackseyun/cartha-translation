base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/009.yaml
  text: Behold[a], the day of Yahweh is coming—cruel, with wrath and fierce anger—to make the land a desolation[d][c][b], and he will destroy its sinners from it.
translation:
  language: ru
  text: Вот, приближается день Яхве — жестокий, с яростью и пылающим гневом, — чтобы превратить землю[a] в запустение[b] и уничтожить с неё её грешников[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское אֶרֶץ может означать как землю вообще, так и определённую страну или территорию.
    reason: lexical_alternative
  - marker: b
    text: Еврейское שַׁמָּה обозначает запустение, разорение или опустошённое место; речь не обязательно идёт о буквальной пустыне.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и её грешников он уничтожит/истребит из неё». Субъект глагола может соотноситься с днём Яхве; возможно также, что подразумевается сам Яхве как совершающий суд.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную силу и торжественность пророческого возглашения, оставаясь естественным для современного русского языка.
- source_word: יוֹם יְהוָה
  choice: день Яхве
  rationale: Передаёт устойчивое пророческое выражение и непосредственно воспроизводит личное имя יְהוָה как «Яхве».
- source_word: בָּא
  choice: приближается
  rationale: В контексте пророческого возвещения форма обозначает предстоящее и несомненное событие; «приближается» передаёт его близость и динамику.
- source_word: אַכְזָרִי
  choice: жестокий
  rationale: Прямо передаёт характеристику дня как беспощадного по силе суда, не добавляя истолкования.
- source_word: וְעֶבְרָה
  choice: с яростью
  rationale: Естественно связывает существительное со словом «жестокий» и сохраняет первый из накопленных образов гнева.
- source_word: וַחֲרוֹן אָף
  choice: и пылающим гневом
  rationale: Передаёт образ жара, заложенный в идиоме, и сохраняет усиление после עֶבְרָה.
- source_word: לָשׂוּם
  choice: чтобы превратить
  rationale: Инфинитив выражает цель прихода дня; «превратить ... в» естественно сочетается с последующим обозначением состояния.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Русское «земля» сохраняет присущую אֶרֶץ неоднозначность между территорией и землёй в более широком смысле.
- source_word: לְשַׁמָּה
  choice: в пустыню
  rationale: Передаёт состояние опустошения и разорения в ясной современной формулировке; значение не обязательно ограничено буквальной пустыней, что отмечено в сноске.
- source_word: וְחַטָּאֶיהָ
  choice: грешников
  rationale: Кратко и точно обозначает людей, характеризуемых как грешники и относящихся к земле.
- source_word: יַשְׁמִיד
  choice: уничтожить
  rationale: Передаёт каузативную силу формы от שׁמד и решительность суда; русская инфинитивная конструкция естественно сохраняет единый субъект целевого оборота.
- source_word: מִמֶּנָּה
  choice: на ней
  rationale: По-русски «уничтожить на ней грешников» естественнее буквального «уничтожить из неё» и передаёт удаление грешников с земли.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: «Яхве» прозрачно передаёт личное Божье имя в исходном тексте и соответствует предоставленному доктринальному решению, не подменяя имя титулом.
- issue: Субъект יַשְׁמִיד
  choice: Не выражать отдельным местоимением; связать «уничтожить» с приходящим днём Яхве
  alternative: «Он уничтожит», где субъектом подразумевается Яхве
  rationale: В еврейском глагол стоит в мужском единственном числе, а ближайшее грамматическое соотнесение возможно с «днём»; вместе с тем действующим лицом суда богословски может подразумеваться Яхве. Русская целевая конструкция сохраняет эту напряжённость и не навязывает один вариант.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Накопление слов гнева сохранено, синтаксис сделан ясным без устранения неоднозначности субъекта последнего глагола.
