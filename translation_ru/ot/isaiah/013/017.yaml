  text: Behold[a], I am stirring up the Medes against them, who do not value silver and do not delight in gold.
translation:
  language: ru
  text: Вот, Я поднимаю против них мидян, которые серебро ни во что не ставят и золота не желают.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые не ценят серебра и не находят удовольствия в золоте». Еврейский текст подчёркивает, что мидяне не руководствуются платой и не прельщаются богатством.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сочетание указательной частицы с местоименным элементом вводит торжественное Божье возвещение; «Вот, Я» естественно и выразительно передаёт его пророческую силу.
- source_word: מֵעִיר
  choice: поднимаю
  rationale: Причастие породы хифиль от עור означает побуждение к действию, пробуждение или воздвижение. Настоящее время сохраняет непосредственный, уже начинающийся или близкий характер действия.
- source_word: עֲלֵיהֶם
  choice: против них
  rationale: В военном контексте предлог על обозначает враждебную направленность действия.
- source_word: אֶת מָדָי
  choice: мидян
  rationale: מָדַי здесь обозначает народ, выступающий как военная сила, поэтому употреблён русский этноним «мидяне», а не название страны «Мидия».
- source_word: כֶּסֶף לֹא יַחְשֹׁבוּ
  choice: серебро ни во что не ставят
  rationale: חשב в данном контексте означает считать ценным, принимать в расчёт. Русский оборот передаёт пренебрежение серебром, а не просто отсутствие мыслей о нём.
- source_word: וְזָהָב לֹא יַחְפְּצוּ בוֹ
  choice: и золота не желают
  rationale: חפץ может означать желать, находить удовольствие или быть заинтересованным. «Не желают» ясно передаёт отсутствие влечения к золоту и сохраняет отличие от предшествующего глагола.
theological_decisions:
- issue: Божья роль в выступлении мидян
  choice: 'Сохранено прямое первое лицо: «Я поднимаю»'
  alternative: Безличное или ослабленное выражение вроде «поднимутся»
  rationale: Еврейский текст прямо представляет Бога действующим субъектом; перевод не ослабляет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого тона. Оборот «ни во что не ставят» понятен широкому читателю и передаёт идиоматическую силу первой части параллелизма; «не желают» естественно передаёт вторую, не стирая различия между двумя еврейскими глаголами.
