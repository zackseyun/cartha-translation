  text: וְ/הָיָ֨ה כִנּ֜וֹר וָ/נֶ֗בֶל תֹּ֧ף וְ/חָלִ֛יל וָ/יַ֖יִן מִשְׁתֵּי/הֶ֑ם וְ/אֵ֨ת פֹּ֤עַל יְהוָה֙ לֹ֣א יַבִּ֔יטוּ וּ/מַעֲשֵׂ֥ה יָדָ֖י/ו לֹ֥א רָאֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/012.yaml
  text: There are lyre and harp[a], tambourine and flute, and wine at their feasts; but they do not look to the work of Yahweh[b], and they do not see the work of his hands.
translation:
  language: ru
  text: На их пирах — лира и арфа, бубен и свирель, и вино; но на деяние Яхве они не взирают и дел рук его не видят.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: На их пирах —
  rationale: Форма היה вводит картину происходящего; в русском естественно передать её именной конструкцией с тире, не навязывая прошедшего времени.
- source_word: כִנּוֹר וָנֶבֶל
  choice: лира и арфа
  rationale: Переданы как два различных струнных инструмента; их точная древняя конструкция остаётся не вполне определённой.
- source_word: תֹּף וְחָלִיל
  choice: бубен и свирель
  rationale: תֹּף — рамочный ударный инструмент, для которого «бубен» является понятным русским соответствием; חָלִיל — духовой инструмент типа свирели или флейты.
- source_word: מִשְׁתֵּיהֶם
  choice: на их пирах
  rationale: Слово обозначает пир или пиршество с питьём; контекст уже прямо упоминает вино, поэтому «пиры» звучит естественно и сохраняет смысл.
- source_word: פֹּעַל יְהוָה
  choice: деяние Яхве
  rationale: «Деяние» передаёт деятельность или дело, сохраняет вес выражения и позволяет избежать полного лексического повтора со следующей строкой.
- source_word: יַבִּיטוּ
  choice: не взирают
  rationale: Глагол выражает направленное внимание, а не только физический взгляд; «не взирают» передаёт сознательное невнимание и соответствует возвышенному поэтическому регистру.
- source_word: מַעֲשֵׂה יָדָיו
  choice: дел рук его
  rationale: Сохранён конкретный образ рук и параллелизм с «деянием Яхве».
- source_word: רָאוּ
  choice: не видят
  rationale: В поэтическом параллелизме перфект характеризует их нынешнее постоянное состояние; настоящее время естественно передаёт обличение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие.
- issue: Смысл невнимания к Божьему деянию
  choice: «не взирают» и «не видят» без уточнения конкретного деяния
  alternative: Раскрыть выражение как «не замечают того, что совершил Яхве»
  rationale: Еврейский текст не уточняет, идёт ли речь о творении, суде или иных действиях Яхве; перевод сохраняет эту смысловую открытость и поэтическое напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейско-поэтической лексикой. Перечень передан ритмично, а противопоставление после точки с запятой сохраняет обличительный поворот стиха.
