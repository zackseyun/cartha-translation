  source_fidelity: 'Перевод точно передаёт перечень музыкальных инструментов и вина на пирах, а также антитетический параллелизм: они не обращают взора на деяние Яхве и не видят дел Его рук. Настоящее время оправдано обобщённо-обличительным характером еврейских форм. «Лира и арфа» корректно различают כִּנּוֹר и נֶבֶל; «бубен и свирель» остаётся допустимой, естественной передачей תֹף и חָלִיל без ложной точности.'
