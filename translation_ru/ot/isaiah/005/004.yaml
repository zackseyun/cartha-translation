  terminology: «Виноградник» и «виноград» последовательно сохраняют образ оригинала. «Негодный виноград» не утверждает спорного узкого значения «дикий виноград», а передаёт основной отрицательный смысл редкого בְּאֻשִׁים. Сноска сохраняет допустимую более буквальную альтернативу.
