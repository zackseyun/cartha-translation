  text: מַה לַּ/עֲשׂ֥וֹת עוֹד֙ לְ/כַרְמִ֔/י וְ/לֹ֥א עָשִׂ֖יתִי בּ֑/וֹ מַדּ֧וּעַ קִוֵּ֛יתִי לַ/עֲשׂ֥וֹת עֲנָבִ֖ים וַ/יַּ֥עַשׂ בְּאֻשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/004.yaml
  text: What more was there to do for my vineyard that I have not done in it? Why[a], when I expected it to produce grapes, did it produce wild grapes?
translation:
  language: ru
  text: Что ещё следовало сделать для моего виноградника, чего я в нём не сделал? Почему же, когда я ожидал, что он принесёт виноград, он принёс негодный виноград[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зловонный виноград»; еврейское слово означает дурной, непригодный плод.'
    reason: Лексическая альтернатива сохраняет более буквальный оттенок редкого еврейского слова.
lexical_decisions:
- source_word: מַה לַּעֲשׂוֹת עוֹד
  choice: Что ещё следовало сделать
  rationale: Передаёт риторический вопрос о том, осталось ли какое-либо необходимое действие, не усиливая его до прямо выраженного «что ещё можно было сделать».
- source_word: לְכַרְמִי
  choice: для моего виноградника
  rationale: Предлог לְ в данном контексте обозначает действие на благо виноградника; образ виноградника сохранён буквально.
- source_word: וְלֹא עָשִׂיתִי בּוֹ
  choice: чего я в нём не сделал
  rationale: Сохраняет отрицательную риторическую конструкцию и буквальное пространственное значение בּוֹ — «в нём».
- source_word: קִוֵּיתִי
  choice: я ожидал
  rationale: В контексте ожидаемого урожая קוה выражает ожидание результата, а не только надежду или продолжительное ожидание.
- source_word: לַעֲשׂוֹת עֲנָבִים
  choice: что он принесёт виноград
  rationale: Глагол עשה применительно к земле или винограднику означает «произвести, принести плод»; местоимение «он» ясно указывает на виноградник.
- source_word: בְּאֻשִׁים
  choice: негодные ягоды
  rationale: Слово обозначает дурной, зловонный или непригодный плод. «Негодные ягоды» передаёт ключевую идею бесполезного урожая, не создавая ошибочного впечатления, будто речь лишь о дикорастущем винограде.
theological_decisions:
- issue: Метафорический образ виноградника
  choice: Сохранить слово «виноградник» без пояснения его референта в основном тексте.
  alternative: Заменить или дополнить образ прямым указанием на Израиль либо народ Бога.
  rationale: В этом стихе продолжает развиваться поэтический образ; его истолкование даётся в контексте, поэтому перевод не должен преждевременно подменять метафору объяснением.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической пророческой речи. Структура двух риторических вопросов сохранена; местоимения говорящего написаны со строчной буквы, поскольку в еврейском тексте особого графического почтительного выделения нет.
