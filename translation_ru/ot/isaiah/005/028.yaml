  text: whose arrows are sharpened[a], and all his bows are bent; the hooves of his horses are considered like flint[c][b], and his wheels like the whirlwind.
translation:
  language: ru
  text: 'стрелы его остры,

    и все луки его натянуты;

    копыта его коней — словно кремень,

    а колёса его — как вихрь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: опущено как отдельное слово
  rationale: Относительная связь с описываемым в предыдущем стихе войском естественно передаётся по-русски продолжением предложения; местоименное «у которого» здесь утяжеляло бы строку.
- source_word: חִצָּיו שְׁנוּנִים
  choice: стрелы его остры
  rationale: Причастно-прилагательное значение שְׁנוּנִים передаёт боевую готовность стрел; краткое «остры» точно и естественно в поэтическом русском.
- source_word: וְכָל קַשְּׁתֹתָיו דְּרֻכוֹת
  choice: и все луки его натянуты
  rationale: דְּרֻכוֹת описывает луки, согнутые и приготовленные к стрельбе. «Натянуты» — ясное современное обозначение их готовности, не ограниченное мгновением прицеливания.
- source_word: פַּרְסוֹת סוּסָיו
  choice: копыта его коней
  rationale: Сохраняются конструкция принадлежности и мужской род единственного числа, которым персонифицировано наступающее войско.
- source_word: כַּצַּר נֶחְשָׁבוּ
  choice: словно кремень
  rationale: צַר в данном контексте обозначает твёрдый камень, вероятнее всего кремень. Русская образная конструкция с тире естественно передаёт значение «считаются/уподобляются кремню» без канцелярского оттенка.
- source_word: וְגַלְגִּלָּיו
  choice: а колёса его
  rationale: Сохранено общее «колёса», как в еврейском тексте; контекст военного наступления позволяет понимать колёса колесниц без поясняющей вставки.
- source_word: כַּסּוּפָה
  choice: как вихрь
  rationale: סוּפָה обозначает бурю, вихрь или ураганный ветер; «вихрь» кратко и ярко выражает стремительность и разрушительную силу движения.
