  text: And he will roar over it on that day like the roaring of the sea[a]; and if one looks to the land, behold, darkness and distress[d][c][b], and the light is darkened in its clouds.
translation:
  language: ru
  text: 'И в тот день он зарычит над ним, как рёв моря. Взглянет кто-нибудь на землю — и вот: тьма и бедствие, и свет померк в её тучах.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִנְהֹם
  choice: и зарычит он
  rationale: נהם обозначает громкий рык или рёв. Форма 3-го лица мужского рода единственного числа оставляет подлежащее невыраженным; местоимение «он» сохраняет грамматику текста и может относиться к собирательно представленному врагу из контекста.
- source_word: עָלָיו
  choice: над ним
  rationale: על с суффиксом мужского рода единственного числа допускает значения «над ним» и «против него». «Над ним» сохраняет пространственно-угрожающую образность и род исходного суффикса, не уточняя его референт.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача устойчивого пророческого указания времени.
- source_word: כְּנַהֲמַת יָם
  choice: словно ревущее море
  rationale: Динамичная и естественная по-русски передача сравнения со звучанием моря; сохраняет слуховой образ исходного текста.
- source_word: וְנִבַּט לָאָרֶץ
  choice: и взглянут на землю
  rationale: Нифаль здесь допускает безличное или неопределённо-личное понимание. Русская неопределённо-личная форма передаёт это без введения конкретного наблюдателя.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет внезапность пророческой картины и звучит естественно в современном литературном русском.
- source_word: חֹשֶׁךְ
  choice: тьма
  rationale: Прямой и стилистически уместный эквивалент.
- source_word: צַר
  choice: бедствие
  rationale: Передаёт семантику тесноты, невзгоды и тяжёлого положения; рядом с «тьмой» обозначает объективное бедствие, не исключая переживания скорби.
- source_word: וָאוֹר חָשַׁךְ
  choice: и свет померк
  rationale: Естественно передаёт наступившее затемнение света и сохраняет краткость поэтической строки.
- source_word: בַּעֲרִיפֶיהָ
  choice: в её тучах
  rationale: Предлог ב естественно передан как «в»; редкое עריפים понято как густые облачные массы. Суффикс женского рода соотнесён с землёй, но трудность выражения отмечена в сноске.
