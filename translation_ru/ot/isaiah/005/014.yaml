source:
  edition: WLC
  text: לָ/כֵ֗ן הִרְחִ֤יבָה שְּׁאוֹל֙ נַפְשָׁ֔/הּ וּ/פָעֲרָ֥ה פִ֖י/הָ לִ/בְלִי חֹ֑ק וְ/יָרַ֨ד הֲדָרָ֧/הּ וַ/הֲמוֹנָ֛/הּ וּ/שְׁאוֹנָ֖/הּ וְ/עָלֵ֥ז בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/014.yaml
  text: Therefore Sheol has enlarged its throat and opened its mouth without measure[a], and her splendor, her multitude, her uproar[c][b], and the one who exults in her go down.
translation:
  language: ru
  text: Поэтому шеол расширил свою глотку и без меры разинул пасть[a]; сойдут великолепие города, множество его жителей, его шум и тот, кто ликует в нём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без предела».'
    reason: lexical_alternative
  - marker: b
    text: Шеол — мир мёртвых; здесь он олицетворён как ненасытное существо, раскрывающее пасть, чтобы поглотить великолепие города и его ликующих жителей.
    reason: cultural_note
lexical_decisions:
- source_word: שְּׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет обозначение мира мёртвых и его олицетворение как ненасытного пожирателя; варианты «могила» и «смерть» сужают образ.
- source_word: הִרְחִיבָה ... נַפְשָׁהּ
  choice: разверз свою глотку
  rationale: Буквально говорится о расширении nephesh; в параллели с раскрытой пастью имеется в виду глотка или ненасытная утроба. Выбранный оборот передаёт телесный образ естественным поэтическим русским языком.
- source_word: וּפָעֲרָה פִיהָ
  choice: и раскрыл пасть
  rationale: «Пасть» поддерживает олицетворённый образ шеола как пожирателя и передаёт силу глагола פער.
- source_word: לִבְלִי חֹק
  choice: без меры
  rationale: В данном сочетании חֹק означает предел или меру, а не закон или постановление.
- source_word: וְיָרַד
  choice: и сойдут туда
  rationale: Пророческое совершенное действие передано будущим временем как несомненно предстоящий суд; множественное число согласовано по-русски с составным рядом подлежащих, а «туда» проясняет направление в шеол.
- source_word: הֲדָרָהּ
  choice: великолепие города
  rationale: הָדָר обозначает блеск, величие и пышность. Явное «города» устраняет неясность русского местоимения при мужском роде слова «шеол», тогда как еврейский суффикс относится к городу из контекста.
- source_word: הֲמוֹנָהּ
  choice: его многолюдство
  rationale: Слово обозначает массу людей или множество, связанное с городом; «многолюдство» сохраняет коллективный и поэтический смысл.
- source_word: שְׁאוֹנָהּ
  choice: его шум
  rationale: Передаёт гул, шум и бурное веселье города без чрезмерного уточнения.
- source_word: וְעָלֵז בָּהּ
  choice: и всякий, кто ликует в нём
  rationale: Единственное число формы עָלֵז сохранено обобщающим «всякий»; «ликует» передаёт бурную, возможно самоуверенную радость.
theological_decisions:
- issue: Передача שְּׁאוֹל в поэтическом пророчестве о суде
  choice: шеол
  alternative: могила; смерть; мир мёртвых
  rationale: Сохранение еврейского термина не сводит образ ни к месту погребения, ни к отвлечённой смерти и удерживает напряжение олицетворённого мира мёртвых, поглощающего город.
- issue: Референт местоименных суффиксов женского рода в заключительной строке
  choice: город, выраженный словами «города / его / в нём»
  alternative: шеол
  rationale: По смыслу и контексту перечисляются великолепие, население, шум и ликующий житель города, нисходящие в шеол. В русском род слова «шеол» создаёт риск ложного отнесения местоимений к нему, поэтому референт обозначен явно.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Образность усилена естественной парой «глотка — пасть». Строчные написание «шеол» выбрано как нарицательное обозначение мира мёртвых, а не имя собственное. Местоименные связи слегка эксплицированы ради ясности, поскольку грамматический род в русском не воспроизводит различие референтов еврейского текста.
