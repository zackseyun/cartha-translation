base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/020.yaml
  text: Woe to those who call evil good and good evil[a], who make darkness light and light darkness[b], who make bitter sweet and sweet bitter.
translation:
  language: ru
  text: Горе тем, кто называет зло добром, а добро — злом[a], кто выдаёт тьму за свет, а свет — за тьму[b], кто выдаёт горькое за сладкое, а сладкое — за горькое!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорит: злу — „добро“, а добру — „зло“».'
    reason: lexical_alternative
  - marker: b
    text: 'Повторяющиеся противопоставления тьмы и света, горького и сладкого усиливают обвинение: речь идёт не просто об ошибочных словах, а о подмене нравственной действительности.'
    reason: cultural_note
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Пророческое восклицание, выражающее обличение и предстоящий суд; «горе» естественно и весомо звучит в данном контексте.
- source_word: הָאֹמְרִים
  choice: тем, кто называет
  rationale: Хотя глагол буквально означает «говорить», конструкция с оценочными определениями передаёт присвоение названия или оценки; «называет» ясно выражает это по-русски.
- source_word: לָרַע טוֹב וְלַטּוֹב רָע
  choice: называет зло добром, а добро — злом
  rationale: Сохраняет краткую нравственную антитезу и параллельное обращение понятий.
- source_word: שָׂמִים
  choice: выдаёт ... за
  rationale: В сочетании с לְ эта формулировка естественно передаёт сознательную подмену или представление одного как другого, не утверждая буквального превращения.
- source_word: חֹשֶׁךְ לְאוֹר וְאוֹר לְחֹשֶׁךְ
  choice: тьму за свет, а свет — за тьму
  rationale: Сохраняет зеркальный параллелизм и образ взаимной подмены противоположностей.
- source_word: מַר לְמָתוֹק וּמָתוֹק לְמָר
  choice: горькое — за сладкое, а сладкое — за горькое
  rationale: Передаёт компактную чувственную метафору и её симметрию; эллипсис глагола естественен для русской поэзии.
theological_decisions:
- issue: Характер обличения
  choice: 'Стих осуждает нравственную подмену: зло объявляют добром, а добро злом; последующие образы усиливают это обвинение.'
  alternative: Понимать стих лишь как общее осуждение путаницы либо ограничивать его исключительно судебной или общественной сферой.
  rationale: Контрасты зла и добра, тьмы и света, горького и сладкого указывают на широкую и намеренную перестановку ценностей, но сам текст не сужает её до одной конкретной области.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Зеркальный параллелизм оригинала сохранён; тире подчёркивают антитезы и позволяют не повторять глагол.
