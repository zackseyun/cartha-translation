  yaml_path: translation/ot/isaiah/005/016.yaml
  text: But Yahweh of hosts is exalted in justice[b][a], and the Holy God is shown holy in righteousness.
translation:
  language: ru
  text: Но Яхве Воинств возвысится судом[a], и Святой Бог явит Себя святым праведностью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливостью» либо «правосудием». Еврейское מִשְׁפָּט может означать как справедливость в принципе, так и совершаемый суд.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее возможно: «явится святым» или «будет освящён». Смысл в том, что Божья святость становится явной и подтверждается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּה
  choice: возвысится
  rationale: Форма от גבה означает «быть высоким, возвышаться». Будущее совершенного вида естественно передаёт пророческое описание того, как величие Бога обнаружится в совершаемом Им суде.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией «Яхве», а צְבָאוֹת — родительным «Воинств», сохраняющим широту титула и не ограничивающим его только земными армиями.
- source_word: בַּמִּשְׁפָּט
  choice: судом
  rationale: מִשְׁפָּט может обозначать как справедливость, так и судебное решение или действие. В контексте наказания «судом» естественно выражает средство, посредством которого возвышается Яхве, не устраняя нравственного оттенка справедливости.
- source_word: וְהָאֵל הַקָּדוֹשׁ
  choice: и Святой Бог
  rationale: Сочетание сохраняет существительное אֵל и определение הַקָּדוֹשׁ; прописная буква подчёркивает титульный оттенок, характерный для Исайи.
- source_word: נִקְדָּשׁ
  choice: явит Свою святость
  rationale: Нифаль от קדש здесь говорит не о приобретении Богом святости, а о её явлении и подтверждении. Активная русская формулировка естественна, при этом возврат к более формальному «явится святым» отмечен в сноске.
- source_word: בִּצְדָקָה
  choice: праведностью
  rationale: Инструментальная форма передаёт ב как указание на средство или основание и сохраняет лексическое различие между צְדָקָה «праведность» и מִשְׁפָּט «суд, правосудие».
theological_decisions:
- issue: Передача языка о Божьей святости без намёка на изменение Божьей природы
  choice: явит Свою святость
  alternative: явится святым; будет освящён
  rationale: Еврейский нифаль допускает формально-пассивную передачу, однако «будет освящён» по-русски может ошибочно подразумевать, что Бог становится святым под внешним воздействием. Контекст говорит о явлении и подтверждении Его святости в праведном суде.
- issue: Сохранение различия между מִשְׁפָּט и צְדָקָה
  choice: судом … праведностью
  alternative: справедливостью … праведностью; судом … справедливостью
  rationale: 'Два близких, но не тождественных слова переданы разными русскими словами: первое подчёркивает судебное действие, второе — нравственную правоту Бога.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Сохранены параллелизм двух частей стиха, личное имя Яхве и различие между «судом» и «праведностью».
