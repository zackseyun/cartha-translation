  text: הָ/אֹמְרִ֗ים יְמַהֵ֧ר יָחִ֛ישָׁ/ה מַעֲשֵׂ֖/הוּ לְמַ֣עַן נִרְאֶ֑ה וְ/תִקְרַ֣ב וְ/תָב֗וֹאָ/ה עֲצַ֛ת קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/נֵדָֽעָה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/019.yaml
  text: who say[a], “Let him hurry; let him hasten his work, so that we may see it; let the plan of the Holy One of Israel draw near and come, so that we may know it.”
translation:
  language: ru
  text: 'которые говорят: «Пусть он поторопится, пусть ускорит своё дело, чтобы мы это увидели; пусть приблизится и придёт замысел Святого Израиля[a], чтобы мы это узнали».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «намерение Святого Израиля».'
    reason: Лексическая альтернатива для עֲצַת, которое может обозначать замысел, план или намерение.
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: которые говорят
  rationale: Причастие продолжает характеристику людей из предыдущего стиха; придаточная конструкция естественна по-русски и сохраняет синтаксическую связь с контекстом.
- source_word: יְמַהֵר
  choice: пусть он поторопится
  rationale: Передаёт волитивную форму как насмешливое требование к Богу действовать скорее.
- source_word: יָחִישָׁה מַעֲשֵׂהוּ
  choice: пусть ускорит своё дело
  rationale: Сохраняет второй, усиливающий призыв и не сливает два близких по смыслу еврейских глагола в один.
- source_word: לְמַעַן נִרְאֶה
  choice: чтобы мы увидели
  rationale: Точно передаёт целевое придаточное; объект не добавлен, поскольку он отсутствует в еврейском тексте и понятен из контекста.
- source_word: וְתִקְרַב וְתָבוֹאָה
  choice: пусть приблизится и придёт
  rationale: Сохранены оба глагола, их параллелизм и нарастающая выразительность; «придёт» не подменяет образ толкованием вроде «исполнится».
- source_word: עֲצַת
  choice: замысел
  rationale: В данном контексте обозначает намерение или план; «замысел» звучит естественно и достойно, а возможное значение «решение» отмечено в сноске.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  rationale: Прямо и понятно передаёт характерный для Исаии титул Бога на современном литературном русском языке.
- source_word: וְנֵדָעָה
  choice: чтобы мы узнали
  rationale: Передаёт заключительную форму первого лица множественного числа и её связь с насмешливым вызовом; отсутствующий в оригинале объект не добавлен.
theological_decisions:
- issue: К кому относятся формы третьего лица и притяжательный суффикс
  choice: Говорящие насмешливо требуют, чтобы Бог скорее совершил Своё дело, но в цитате Он прямо не назван.
  alternative: Явно вставить имя «Бог» или написать местоимения с прописной буквы.
  rationale: Контекст и титул «Святой Израиля» указывают на Бога, однако еврейский текст сохраняет риторическую дистанцию говорящих. Строчные местоимения помогают не сгладить их дерзкий, насмешливый тон.
- issue: Значение עֲצַת
  choice: замысел Святого Израиля
  alternative: решение Святого Израиля; совет Святого Израиля; план Святого Израиля
  rationale: «Замысел» сохраняет значение намерения или плана, не превращая выражение в технический богословский термин. Лексическая альтернатива дана в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой выразительности. Два последовательных призыва и два глагола движения оставлены раздельно ради еврейского параллелизма. Насмешливый тон передан волитивной конструкцией «пусть» и строчными местоимениями.
