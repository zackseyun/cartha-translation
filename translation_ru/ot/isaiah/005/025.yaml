- from: Поэтому воспылал гнев Яхве на Его народ; Он простёр против него руку и поразил его. Горы содрогнулись, и их трупы стали словно отбросы[a] посреди улиц. Но при всём этом Его гнев не отвратился, и рука Его всё ещё простёрта.
  to: Поэтому воспылал гнев Яхве на Его народ; Он простёр против него руку и поразил его. Горы содрогнулись, и их трупы были словно отбросы[a] посреди улиц. При всём этом Его гнев не отвратился, и рука Его всё ещё простёрта.
