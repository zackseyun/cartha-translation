  variant: modern literary Russian
source:
  edition: WLC
  text: עַל כֵּ֡ן חָרָה֩ אַף יְהוָ֨ה בְּ/עַמּ֜/וֹ וַ/יֵּ֣ט יָד֧/וֹ עָלָ֣י/ו וַ/יַּכֵּ֗/הוּ וַֽ/יִּרְגְּזוּ֙ הֶֽ/הָרִ֔ים וַ/תְּהִ֧י נִבְלָתָ֛/ם כַּ/סּוּחָ֖ה בְּ/קֶ֣רֶב חוּצ֑וֹת בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/025.yaml
  text: Therefore the anger of Yahweh burned against his people[a], and he stretched out his hand against them and struck them; the mountains quaked, and their corpses were like refuse in the midst of the streets. For all this, his anger has not turned away, and his hand is still stretched out.
translation:
  language: ru
  text: Поэтому воспылал гнев Яхве на Его народ; Он простёр против него руку и поразил его. Горы содрогнулись, и их трупы были словно отбросы[a] посреди улиц. При всём этом Его гнев не отвратился, и рука Его всё ещё простёрта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как смёт»; редкое еврейское слово может обозначать то, что смели или выбросили.'
    reason: Лексическая альтернатива для כַּסּוּחָה; она сохраняет конкретный образ «сметённого» наряду с основным общим переводом «отбросы».
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Сохраняет причинно-следственную связь с предшествующим обличением и естественно звучит по-русски.
- source_word: חָרָה אַף יְהוָה
  choice: воспылал гнев Яхве
  rationale: Передаёт образ горящего гнева, заложенный в еврейской идиоме, в возвышенном, но понятном русском стиле.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּעַמּוֹ
  choice: на Его народ
  rationale: Предлог при выражении гнева обозначает объект, на который направлен гнев.
- source_word: וַיֵּט יָדוֹ עָלָיו
  choice: Он простёр против него руку
  rationale: Сохраняет антропоморфный образ направленной карающей руки; местоимение в оригинале единственного числа согласовано с собирательным существительным «народ».
- source_word: וַיַּכֵּהוּ
  choice: и поразил его
  rationale: Сохраняет единственное число еврейского суффикса и связь с «народом»; «поразил» соответствует пророческому регистру.
- source_word: וַיִּרְגְּזוּ הֶהָרִים
  choice: Горы содрогнулись
  rationale: Передаёт сильное колебание и сохраняет возвышенную образность пророчества.
- source_word: נִבְלָתָם
  choice: их трупы
  rationale: Прямо и без смягчения передаёт значение мёртвых тел.
- source_word: כַּסּוּחָה
  choice: словно отбросы
  rationale: Передаёт основную идею чего-то сметённого или выброшенного; более конкретная возможность отмечена в сноске.
- source_word: בְּקֶרֶב חוּצוֹת
  choice: посреди улиц
  rationale: Кратко и точно обозначает открытое нахождение тел на городских улицах.
- source_word: בְּכָל זֹאת
  choice: Но при всём этом
  rationale: 'Передаёт контраст повторяющегося у Исаии рефрена: уже совершившийся суд ещё не исчерпал гнева.'
- source_word: לֹא שָׁב אַפּוֹ
  choice: Его гнев не отвратился
  rationale: Сохраняет метафору гнева, который не повернул назад и не отступил.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: и рука Его всё ещё простёрта
  rationale: Сохраняет намеренно напряжённый образ продолжающегося Божьего суда, не уточняя сверх текста характер дальнейшего действия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя передано транслитерацией, что сохраняет различие между именем и титулом и соответствует предоставленному проектному решению.
- issue: Антропоморфные образы Божьего гнева и руки
  choice: Сохранить «воспылал гнев» и «рука… простёрта»
  alternative: 'Передать отвлечённо: «Бог разгневался» и «продолжает наказывать»'
  rationale: Оригинал говорит посредством телесно-наглядных образов; их сохранение удерживает пророческую силу и не устраняет напряжение последней строки.
- issue: Число местоимений при собирательном עַם
  choice: «против него… поразил его»
  alternative: «против них… поразил их»
  rationale: Еврейский текст грамматически возвращается к единственному числу «народ»; русский позволяет сохранить это согласование без потери ясности.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Сохранены резкие образы суда, параллелизм и антропоморфная метафорика; архаизация ограничена уместными формами «воспылал», «простёр» и «отвратился».
