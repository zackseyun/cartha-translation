    rationale: Еврейское וַתְּהִי нִבְלָתָם כַּסּוּחָה описывает состояние/уподобление, а не становление. «Стали» добавляет динамику, отсутствующую в тексте.
  - severity: low
    issue: Формулировка сноски «словно сметённый сор»
    rationale: Это менее естественное русское выражение и несколько сужает образ. «Как смёт» яснее сохраняет лексическую альтернативу «sweepings».
