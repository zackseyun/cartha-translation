base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/018.yaml
  text: Woe to those who drag iniquity with cords of falsehood[a], and sin with cart ropes[b],
translation:
  language: ru
  text: Горе тем, кто тянет беззаконие верёвками лжи[a] и грех — словно канатами, которыми тянут повозку[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верёвками тщеты» либо «верёвками пустоты». Еврейское слово שָׁוְא может означать ложь, тщету или пустоту.'
    reason: lexical_alternative
  - marker: b
    text: Образ может также подразумевать, что эти люди навлекают на себя вину или наказание, а не только тянут за собой грех.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Передаёт силу пророческого обличения и одновременно оттенок плача.
- source_word: מֹשְׁכֵי
  choice: тем, кто тянет
  rationale: Причастие обозначает продолжающееся действие; «тянет» естественно сохраняет образ волочения при помощи верёвок.
- source_word: עָוֹן
  choice: беззаконие
  rationale: Сохраняет нравственную весомость слова и отличает его от следующего חַטָּאָה; при этом еврейское слово может также включать значение вины или её последствия.
- source_word: בְּחַבְלֵי הַשָּׁוְא
  choice: верёвками лжи
  rationale: שָׁוְא может означать ложь, тщету или пустоту; в данном образе «ложь» звучит естественно, а более широкий диапазон отмечен в сноске.
- source_word: וְכַעֲבֹתוֹת הָעֲגָלָה
  choice: словно канатами повозки
  rationale: Префикс כ передаёт сравнение, עֲבֹתוֹת обозначает толстые верёвки или канаты, а הָעֲגָלָה — повозку. Формулировка сохраняет образ тяжёлой упряжи.
- source_word: חַטָּאָה
  choice: грех
  rationale: Прямой и естественный эквивалент, сохраняющий отличие от עָוֹן.
theological_decisions:
- issue: Отношение людей к беззаконию и греху в метафоре
  choice: Люди сами упорно тянут за собой беззаконие и грех, словно тяжёлый груз.
  alternative: Они навлекают на себя вину либо наказание посредством лжи.
  rationale: Прямой образ изображает сознательную и длительную привязанность ко злу. Однако עָוֹן может обозначать также вину и её последствия, поэтому возможный дополнительный смысл не исключён и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Верёвки» и более тяжёлые «канаты» передают нарастание образа; тире устраняет неестественное повторение глагола. Восклицательный знак соответствует силе הוֹי.
