  text: Woe to those who join house to house[a], who bring field near to field until there is no place left[b], and you are made to dwell alone in the midst of the land.
translation:
  language: ru
  text: Горе тем, кто присоединяет дом к дому и прибавляет поле к полю[a], пока не останется места, так что в стране жить останетесь только вы[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приближает поле к полю»; речь идёт о присоединении соседних участков и сосредоточении земли в одних руках.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст внезапно переходит к прямому обращению: «вы». Глагольная форма пассивно-каузативная; буквально: «так что поселены будете только вы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Передаёт силу пророческого обличения и предостережения в естественной для русского библейского стиля форме.
- source_word: מַגִּיעֵי בַיִת בְּבַיִת
  choice: кто присоединяет дом к дому
  rationale: Причастная форма от נגע в породе hифиль означает «заставлять соприкасаться»; «присоединяет» ясно выражает последовательное накопление недвижимости и сохраняет образ еврейского текста.
- source_word: שָׂדֶה בְשָׂדֶה יַקְרִיבוּ
  choice: и прибавляет поле к полю
  rationale: קרב в hифиле буквально значит «приближать», но здесь параллельно первой строке обозначает присоединение соседних земель; «прибавляет» естественно передаёт имущественный контекст, не смешивая два разных еврейских глагола.
- source_word: עַד אֶפֶס מָקוֹם
  choice: пока не останется места
  rationale: 'Ясно и кратко передаёт итог неуёмного расширения владений: свободного места больше нет.'
- source_word: וְהוּשַׁבְתֶּם
  choice: так что вы ... поселитесь
  rationale: Сохраняет внезапный переход к прямому обращению во втором лице множественного числа. По форме глагол допускает пассивно-каузативное понимание, отмеченное в сноске.
- source_word: לְבַדְּכֶם
  choice: вы одни
  rationale: 'Передаёт исключительность: захватчики стремятся остаться единственными землевладельцами.'
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: среди страны
  rationale: Сохраняет пространственный образ пребывания внутри страны; «страна» здесь естественнее русского «земля» и не смешивается с упомянутыми полями.
theological_decisions:
- issue: Значение пассивно-каузативной формы וְהוּשַׁבְתֶּם
  choice: В основном тексте передано естественным русским «так что вы одни поселитесь», при сохранении второго лица.
  alternative: «и будете поселены вы одни» / «и вас поселят одних»
  rationale: Формальная пассивность еврейского глагола не указывает явно действующее лицо и по-русски может ошибочно подразумевать Божье одобрение или прямое действие. Контекст выражает результат захвата собственности; подлинная грамматическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены параллелизм двух имущественных формул, обличительное «Горе» и резкий переход от третьего лица ко второму; тяжеловесный буквальный пассив вынесен в сноску.
