translation:
  language: ru
  text: 'которые за взятку оправдывают нечестивого[a]

    и лишают праведных их правоты.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые оправдывают виновного из-за взятки и отнимают у праведника его праведность». В еврейском тексте последнее местоимение стоит в единственном числе и может иметь распределительный смысл: «у каждого из них».'
    reason: Лексические варианты для רָשָׁע, עֵקֶב и צְדָקָה, а также формальная особенность единственного числа מִמֶּנּוּ.
lexical_decisions:
- source_word: מַצְדִּיקֵי
  choice: которые… оправдывают
  rationale: Причастие породы hифиль от צדק в судебном контексте означает «признавать правым, оправдывать», а не делать нравственно праведным.
- source_word: רָשָׁע
  choice: виновного
  rationale: Субстантивированное прилагательное обозначает неправого или виновного; судебное «виновного» естественно сочетается с «оправдывают», не исключая нравственного осуждения.
- source_word: עֵקֶב שֹׁחַד
  choice: за взятку
  rationale: 'Сочетание выражает основание или побуждение решения: виновного оправдывают вследствие полученной взятки. Русское «за взятку» кратко и ясно передаёт коррупционный смысл.'
- source_word: וְצִדְקַת
  choice: и… их правоты
  rationale: צְדָקָה здесь имеет судебно-нравственный смысл правоты, справедливого положения или законного притязания. «Правота» сохраняет связь с корнем צדק и не сводит значение только к формальному праву.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное прилагательное во множественном числе передано прямо и сохраняет противопоставление виновному.
- source_word: יָסִירוּ
  choice: лишают
  rationale: Hифиль от סור означает удалять, отнимать. В русском «лишать кого-либо правоты» естественнее буквального «отнимать правоту от него» и передаёт судебное ущемление.
- source_word: מִמֶּנּוּ
  choice: их
  rationale: Масоретский текст имеет суффикс 3-го лица мужского рода единственного числа, вероятно употреблённый распределительно при предшествующем множественном числе «праведных». В основном тексте это естественно передано русским множественным местоимением; формальная особенность отражена в сноске.
theological_decisions:
- issue: Передача צְדָקָה в обличении неправедного суда
  choice: правота
  alternative: праведность; справедливость; законное право
  rationale: Контекст относится к продажному судебному решению, однако слово сохраняет более широкую нравственную окраску корня צדק. «Правота» передаёт и обоснованность позиции праведных, и лексическую связь с «оправдывают», не ограничивая смысл одной юридической процедурой.
- issue: Число местоимения מִמֶּנּוּ после צַדִּיקִים
  choice: естественное русское множественное «их» с пояснением в сноске
  alternative: буквальное единственное «у него»
  rationale: Единственное число в еврейском, вероятно, распределительно указывает на каждого из праведных. Буквальное «у него» в русском создаёт неясного адресата; сноска сохраняет особенность масоретской формы и возможное индивидуализирующее звучание.
translation_notes:
  register: Современный литературный русский с достоинством пророческого обличения. Судебный смысл выражен ясно, без канцелярита; параллелизм двух строк сохранён.
