  text: ה֛וֹי מַשְׁכִּימֵ֥י בַ/בֹּ֖קֶר שֵׁכָ֣ר יִרְדֹּ֑פוּ מְאַחֲרֵ֣י בַ/נֶּ֔שֶׁף יַ֖יִן יַדְלִיקֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/011.yaml
  text: Woe to those who rise early in the morning to pursue strong drink[a], who stay late into the evening until wine inflames them.
translation:
  language: ru
  text: Горе тем, кто рано утром встаёт, чтобы гнаться за хмельным напитком, и засиживается до сумерек[a], пока вино не распалит их!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «нешэф» может означать сумерки; в данном контексте, после упоминания раннего утра, вероятнее имеются в виду вечерние сумерки.
    reason: Лексическое значение слова נֶשֶׁף в разных контекстах может относиться к сумеркам на рассвете или вечером; контекст поддерживает вечернее значение.
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Передаёт силу пророческого обличения и угрозы суда, сохраняя привычное для русского библейского стиля звучание.
- source_word: מַשְׁכִּימֵי בַבֹּקֶר
  choice: кто с раннего утра
  rationale: Естественно передаёт причастную конструкцию со значением раннего вставания и подчёркивает начало действия уже утром.
- source_word: שֵׁכָר
  choice: хмельной напиток
  rationale: Обозначает опьяняющий напиток, отличный от вина, но не обязательно современный крепкий дистиллят; выбранное выражение достаточно широко и понятно.
- source_word: יִרְדֹּפוּ
  choice: гонится
  rationale: Сохраняет яркий образ настойчивого преследования желаемого, заложенный в глаголе רדף.
- source_word: מְאַחֲרֵי בַנֶּשֶׁף
  choice: засиживается до сумерек
  rationale: Передаёт затягивание пьянства до позднего времени; в последовательности от раннего утра נֶשֶׁף естественно означает вечерние сумерки.
- source_word: יַיִן
  choice: вино
  rationale: Прямой и однозначный русский эквивалент.
- source_word: יַדְלִיקֵם
  choice: не распалит их
  rationale: Сохраняет метафору разжигания или воспламенения и естественно описывает возбуждающее действие вина.
