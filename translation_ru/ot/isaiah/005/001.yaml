base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/001.yaml
  text: 'Let me sing[a], please, for my beloved a song of my beloved concerning his vineyard: my beloved had a vineyard on a fertile hill.'
translation:
  language: ru
  text: Позвольте мне спеть для моего друга песню моего возлюбленного о его винограднике. У моего друга был виноградник на плодородном холме.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на роге, сыне масла» — образное еврейское выражение, обозначающее плодородный холм.'
    reason: Сохраняет буквальный образ выражения בְּקֶרֶן בֶּן־שָׁמֶן и поясняет его идиоматический смысл.
lexical_decisions:
- source_word: אָשִׁירָה נָּא
  choice: Позвольте мне спеть
  rationale: Когортатив первого лица с частицей נָא выражает побуждение или мягкую просьбу. Эта формулировка естественно передаёт оттенок «дай(те) мне спеть», не превращая его в простое будущее.
- source_word: לִידִידִי
  choice: для моего возлюбленного
  rationale: Предлог ל обозначает направленность или отношение; «для моего возлюбленного» естественно выражает, кому посвящается песня.
- source_word: שִׁירַת דּוֹדִי
  choice: песню моего любимого
  rationale: Конструкция означает «песню моего דּוֹד». Слово «любимый» сохраняет поэтическую близость и одновременно позволяет отразить, что здесь употреблено другое еврейское слово, чем יָדִידִי.
- source_word: לְכַרְמוֹ
  choice: о его винограднике
  rationale: Предлог ל здесь вводит тему песни; современное русское «о» звучит ясно и естественно.
- source_word: כֶּרֶם הָיָה לִידִידִי
  choice: У моего возлюбленного был виноградник
  rationale: Буквальная конструкция существования с дательным обладателя в русском языке естественно передаётся оборотом «у ... был».
- source_word: בְּקֶרֶן בֶּן שָׁמֶן
  choice: на плодородном холме
  rationale: Буквально «на роге, сыне масла/тука»; это образное топографическое выражение о возвышенности с богатой, плодородной почвой. Основной текст передаёт смысл, а образ сохраняется в сноске.
theological_decisions:
- issue: Кто такой «возлюбленный» в песне о винограднике
  choice: Не отождествлять его прямо в основном тексте
  alternative: Назвать возлюбленного Господом либо считать его другом пророка или литературным персонажем
  rationale: В этом стихе личность возлюбленного ещё прямо не раскрыта. Перевод сохраняет развитие метафоры и не снимает раньше времени литературно-богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического вступления. Различие между יָדִידִי и דּוֹדִי слегка отражено словами «возлюбленный» и «любимый»; синтаксис остаётся понятным обычному читателю.
