  to: Позвольте мне спеть для моего друга песню моего возлюбленного о его винограднике. У моего друга был виноградник на плодородном холме.[a]
  rationale: Исправление сохраняет смысловую и литературную неоднозначность стиха, но отчётливее отражает смену еврейских слов יְדִידִי и דּוֹדִי. Основной текст не определяет, кто именно назван другом или возлюбленным; образное описание местности остаётся в сноске.
