  yaml_path: translation/ot/isaiah/005/022.yaml
  text: Woe to those who are heroes at drinking wine[b][a], and men of strength at mixing strong drink.
translation:
  language: ru
  text: Горе тем, кто герои в питье вина,[a] и тем, кто силён в смешивании хмельного напитка![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «могучи (или: герои) пить вино». Обозначение воинов и могучих людей здесь употреблено иронически.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «опьяняющий напиток». Еврейское слово не уточняет вид напитка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Пророческое восклицание, выражающее осуждение и предвещающее бедствие; «горе» естественно для русского языка пророческих обличений.
- source_word: גִּבּוֹרִים
  choice: кто храбр
  rationale: 'Слово обычно обозначает могучих людей или воинов, но здесь употреблено иронически: их «доблесть» проявляется только в питье. Прилагательное «храбр» сохраняет эту иронию и военный оттенок.'
- source_word: לִשְׁתּוֹת יָיִן
  choice: лишь в том, чтобы пить вино
  rationale: Инфинитив с ל указывает на область проявления мнимой доблести. «Лишь» эксплицирует очевидный в контексте саркастический контраст, не меняя предмета осуждения.
- source_word: וְאַנְשֵׁי חַיִל
  choice: и силён
  rationale: Выражение может означать сильных, способных или доблестных людей. В параллельной строке «силён» естественно передаёт качество и сохраняет ироническое применение похвального обозначения.
- source_word: לִמְסֹךְ
  choice: смешивать
  rationale: Глагол означает смешивать или приготовлять напиток, вероятно посредством соединения компонентов; прямое «смешивать» сохраняет конкретность исходного образа.
- source_word: שֵׁכָר
  choice: хмельной напиток
  rationale: Термин обозначает опьяняющий напиток, не обязательно современный крепкий алкоголь. «Хмельной напиток» передаёт опьяняющее свойство без анахроничного уточнения вида или крепости.
theological_decisions:
- issue: Характер обличения
  choice: 'Сохранена ирония: слова о храбрости и силе отнесены к питью и приготовлению опьяняющего напитка.'
  alternative: Нейтрально передать «умеющие много пить» и «искусные в смешивании».
  rationale: Еврейский текст намеренно использует почётные обозначения могучих и доблестных людей в уничижительном контексте; нейтрализация устранила бы пророческий сарказм.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Параллелизм передан повтором «лишь в том, чтобы»; лексика «храбр» и «силён» сохраняет саркастическое переосмысление воинской доблести. Все маркеры сносок присутствуют в основном тексте.
