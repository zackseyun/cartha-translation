lexical_decisions:
- source_word: וְרָעוּ
  choice: Тогда ... будут пастись
  rationale: Форма Qal от רעה обозначает выпас животных; «тогда» передаёт следствие суда, описанного в предшествующем контексте.
- source_word: כְבָשִׂים
  choice: ягнята
  rationale: Слово может обозначать овец вообще, но «ягнята» сохраняет его обычное конкретное значение и образ беззащитных животных.
- source_word: כְדָבְרָם
  choice: как на своём пастбище
  rationale: Форма трудна для истолкования; контекстуально наиболее связно понимание דבר в редком значении места выпаса или перегона скота.
- source_word: וְחָרְבוֹת
  choice: среди развалин
  rationale: חרבות обозначает разорённые, опустевшие места; предложная передача естественно выражает подразумеваемое место действия.
- source_word: מֵחִים
  choice: откормленных
  rationale: Редкая форма, вероятно, относится к тучным, сытым или зажиточным людям; «откормленных» сохраняет конкретный образ и его социальный оттенок.
- source_word: גָּרִים
  choice: пришельцы
  rationale: גרים — живущие среди местного населения чужеземцы, а не просто неизвестные люди; «пришельцы» передаёт этот статус в dignified biblical register.
- source_word: יֹאכֵלוּ
  choice: будут есть
  rationale: Сохранено прямое значение глагола אכל; объект пищи в кратком поэтическом высказывании остаётся подразумеваемым.
