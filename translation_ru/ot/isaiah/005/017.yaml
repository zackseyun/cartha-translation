  source_fidelity: 'Основной смысл передан верно: после суда ягнята спокойно пасутся, а גרים едят в опустевших владениях/развалинах тех, кто прежде жил в достатке. Однако «откормленных» по-русски прежде всего характеризует специально откармливаемых животных и неоправданно сужает смысл редкого מֵחִים. Связь «развалин» с этой группой также нуждается в естественном выражении.'
  naturalness: '«Как на своём пастбище» понятнее с союзом «словно». Сочетание «среди развалин откормленных» грамматически возможно, но для современного литературного русского тяжеловесно и семантически сбивает: оно звучит как развалины животных. «Среди развалин, оставшихся от зажиточных» естественно и сохраняет образ опустевших владений без утверждения, что מֵחִים непременно означает только богатых.'
