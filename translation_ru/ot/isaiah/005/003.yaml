lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительный союз, продолжающий предшествующую речь-песнь, и отмечает переход к прямому обращению.
- source_word: יוֹשֵׁב יְרוּשָׁלַם
  choice: житель Иерусалима
  rationale: Передаёт причастие в единственном числе; это собирательное обращение ко всему населению города.
- source_word: וְאִישׁ יְהוּדָה
  choice: и муж Иудеи
  rationale: Сохраняет мужской род и единственное число אִישׁ в параллельном представительном обращении; «муж» соответствует достоинству пророческой речи и не превращает исходное единственное число во множественное.
- source_word: שִׁפְטוּ
  choice: рассудите
  rationale: Форма повелительного наклонения множественного числа призывает слушателей вынести суждение в споре; «рассудите» естественно сочетается с конструкцией «между… и…».
- source_word: נָא
  choice: прошу
  rationale: Передаёт частицу настойчивой, но смягчённой просьбы без архаического оборота.
- source_word: בֵּינִי וּבֵין כַּרְמִי
  choice: между Мною и Моим виноградником
  rationale: Сохраняет обе стороны образного разбирательства и обычное значение כֶּרֶם — «виноградник».
theological_decisions:
- issue: Представительное единственное число и обращение в мужском роде
  choice: «житель Иерусалима и муж Иудеи» с пояснительной сноской
  alternative: «жители Иерусалима и мужи Иудеи» или «народ Иерусалима и Иудеи»
  rationale: В еврейском тексте оба наименования стоят в единственном числе, тогда как повеление «рассудите» дано во множественном. Перевод сохраняет это напряжение между представительным единственным и коллективным адресатом, не нейтрализуя род и не подменяя форму толкованием.
- issue: Личность говорящего в образе виноградника
  choice: Прописные местоимения «Мною» и «Моим»
  alternative: Строчные «мною» и «моим»
  rationale: В контексте песни говорящий отождествляется с Господом; прописные местоимения соответствуют устойчивой русской библейской традиции, не устраняя самого метафорического строя текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет судебную метафору и необычное сочетание единственного обращения с повелением во множественном числе; «прошу» естественно передаёт вежливо-настойчивую частицу נָא.
