    rationale: Русское «знать» обычно ассоциируется с сословной аристократией. Еврейское כְבוֹדוֹ буквально означает «его слава» и в контексте, вероятно, относится к почётным или видным людям, не обязательно к сословию.
  - severity: medium
    issue: «Множество его» неестественно в современном литературном русском.
    rationale: Хотя порядок воспроизводит суффикс оригинала, сочетание звучит искусственно и отвлекает. «Множество народа» передаёт тот же коллективный референт и читается ясно.
  revised_text: Поэтому Мой народ идёт в изгнание из-за отсутствия знания; его знатные люди голодают, а множество народа изнывает от жажды.
