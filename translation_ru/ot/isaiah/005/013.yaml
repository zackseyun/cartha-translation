  text: לָ/כֵ֛ן גָּלָ֥ה עַמִּ֖/י מִ/בְּלִי דָ֑עַת וּ/כְבוֹד/וֹ֙ מְתֵ֣י רָעָ֔ב וַ/הֲמוֹנ֖/וֹ צִחֵ֥ה צָמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/013.yaml
  text: Therefore my people go into exile for lack of knowledge; their honored men are dying of hunger[a], and their multitude is parched with thirst.
translation:
  language: ru
  text: Поэтому Мой народ идёт в изгнание из-за отсутствия знания; его знатные люди голодают, а множество народа изнывает от жажды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие из предшествующего пророческого обличения.
- source_word: גָּלָה
  choice: идёт в изгнание
  rationale: Глагол обозначает удаление в изгнание; настоящее время сохраняет живость пророческого провозглашения и не уточняет прямо не названного деятеля.
- source_word: עַמִּי
  choice: народ Мой
  rationale: Точно передаёт форму с суффиксом первого лица и заветное обозначение народа, принадлежащего говорящему Богу.
- source_word: מִבְּלִי דָעַת
  choice: из-за недостатка знания
  rationale: Передаёт отсутствие знания и его причинную связь с изгнанием, не сужая смысл до одного лишь интеллектуального понимания.
- source_word: כְבוֹדוֹ
  choice: его знать
  rationale: Буквально «его слава»; в данном сочетании слово, вероятно, обозначает славных, почётных или видных представителей народа. «Знать» естественно выражает этот собирательный смысл.
- source_word: מְתֵי רָעָב
  choice: голодает
  rationale: Буквально «люди голода»; в составе именного предложения выражает состояние людей, мучимых голодом. Глагольная передача естественна по-русски и не добавляет значения смерти, которого масоретская огласовка прямо не требует.
- source_word: הֲמוֹנוֹ
  choice: множество его
  rationale: Сохраняет собирательное обозначение основной массы народа и местоименный суффикс единственного числа.
- source_word: צִחֵה צָמָא
  choice: изнывает от жажды
  rationale: Передаёт образ крайней сухости и истощения от жажды естественным современным русским выражением.
theological_decisions:
- issue: Смысл דַּעַת в пророческом обличении
  choice: знание
  alternative: понимание; познание Бога
  rationale: «Знание» сохраняет широкий смысл слова, который может включать нравственное и заветное знание Бога, не сводя его ни к интеллектуальной осведомлённости, ни исключительно к одному богословскому толкованию.
- issue: Временная перспектива глагола גָּלָה
  choice: идёт в изгнание
  alternative: пошёл в изгнание; пойдёт в изгнание
  rationale: Перфект может представлять суд как уже совершающийся или как несомненный в пророческой перспективе. Настоящее время сохраняет эту напряжённость лучше, чем однозначно прошедшее или будущее.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Порядок «народ Мой» и «множество его» поддерживает библейскую торжественность, оставаясь понятным обычному читателю.
