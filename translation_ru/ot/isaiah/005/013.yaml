revisions:
- from: Поэтому народ Мой идёт в изгнание из-за недостатка знания; его знать[a] голодает, и множество его изнывает от жажды.
  to: Поэтому Мой народ идёт в изгнание из-за отсутствия знания; его знатные люди голодают, а множество народа изнывает от жажды.
  rationale: Сделаны лишь безопасные стилистико-лексические уточнения. «Знатные люди» избегает неоправданно сословного оттенка слова «знать», а «множество народа» заменяет неестественное «множество его». Причинный и широкий смысл отсутствия знания, образ изгнания и тяжесть голода и жажды сохранены. Сноска удерживает буквальную трудность еврейской конструкции и маркирует контекстуальное истолкование как вероятное.
