base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/026.yaml
  text: He will raise a signal for the nations from far away[a], and whistle for them from the end of the earth; and behold, quickly, swiftly[c][b], it comes.
translation:
  language: ru
  text: Он поднимет знамя[a] для далёких народов и свистом созовёт их[b] от края земли. И вот — быстро, стремительно идёт он[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сигнальный шест» или «знак». Еврейское слово обозначает поднятый знак, служащий сигналом к сбору.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте здесь стоит местоимение единственного числа: «ему». Вероятно, оно представляет призываемую силу как единое целое; в русском употреблено «их» по слову «народы».'
    reason: grammatical_ambiguity
  - marker: c
    text: 'Буквально: «идёт он». Единственное число, вероятно, представляет призванное войско как одно целое.'
    reason: collective_singular
lexical_decisions:
- source_word: וְנָשָׂא
  choice: Он поднимет
  rationale: Перфект в пророческом контексте передан будущим временем; сочетание «поднять знамя» естественно для русского языка.
- source_word: נֵס
  choice: знамя
  rationale: Слово обозначает поднятый знак или штандарт, служащий сигналом к сбору; «знамя» сохраняет наглядный военный образ.
- source_word: לַגּוֹיִם מֵרָחוֹק
  choice: для далёких народов
  rationale: מֵרָחוֹק может характеризовать народы как находящиеся вдали. Такой синтаксический разбор естественен в контексте призыва войска, хотя возможна и связь со словом «знамя».
- source_word: וְשָׁרַק לוֹ
  choice: и свистом созовёт их
  rationale: Глагол означает подать резкий свистящий сигнал. Добавление «созовёт» ясно выражает функцию свиста; формально единственное לוֹ передано множественным числом по коллективному референту «народы».
- source_word: מִקְצֵה הָאָרֶץ
  choice: от края земли
  rationale: Сохраняется пространственный образ самых отдалённых пределов, причём международный контекст поддерживает значение «земля, мир», а не отдельная страна.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: «И вот» естественно и выразительно передаёт указательную частицу, создающую эффект внезапного появления.
- source_word: מְהֵרָה קַל
  choice: быстро, стремительно
  rationale: Два близких обозначения скорости сохранены, чтобы передать усиление исходного текста без буквальной неуклюжести.
- source_word: יָבוֹא
  choice: идёт он
  rationale: Настоящее время после «вот» передаёт живую непосредственность картины; местоимение сохраняет грамматическое единственное число коллективно представленного войска.
theological_decisions:
- issue: Число и референт призываемой силы
  choice: Ранее употреблено множественное «их» по слову «народы», а в заключении сохранено единственное «идёт он».
  alternative: Последовательно передать либо единственным числом («его… он идёт»), либо множественным («их… они идут»).
  rationale: В еврейском тексте народы названы во множественном числе, но местоимение и глагол относятся к призываемой силе в единственном числе. Частичное сохранение этого перехода не устраняет коллективную образность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. «Знамя», «от края земли» и «И вот» сохраняют достоинство и образность, оставаясь понятными обычному читателю.
