base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/024.yaml
  text: Therefore[a], as the tongue of fire devours stubble, and dry grass sinks before the flame, so their root will become rot, and their blossom will go up like dust; for they have rejected the law of Yahweh of hosts[b], and have despised the word of the Holy One of Israel.
translation:
  language: ru
  text: Поэтому, как язык огня пожирает жнивьё и сухая трава поникает перед пламенем, так их корень станет гнилью[a], а их цвет поднимется, словно пыль, потому что они отвергли закон Яхве Воинств и презрели слово Святого Израилева.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их корень будет как гниль». Еврейскую конструкцию можно понять и как указание на превращение, и как прямое сравнение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие из предшествующего обличения.
- source_word: קַשׁ
  choice: жнивьё
  rationale: Обозначает сухие остатки стеблей после жатвы и сохраняет земледельческий образ.
- source_word: לְשׁוֹן אֵשׁ
  choice: язык огня
  rationale: Сохраняет яркую метафору еврейского текста, не сводя её просто к пламени.
- source_word: חֲשַׁשׁ
  choice: сухая трава
  rationale: Естественно передаёт сухую, легко воспламеняющуюся растительность без неоправданного сужения значения.
- source_word: יִרְפֶּה
  choice: поникает перед
  rationale: Глагол выражает ослабление, обмякание или поникание; перевод сохраняет образ разрушительного воздействия пламени, не подменяя его прямым «сгорает».
- source_word: כַּמָּק
  choice: станет гнилью
  rationale: Кратко и зримо передаёт распад и тление; двусмысленность сравнительной конструкции отмечена в сноске.
- source_word: כָּאָבָק יַעֲלֶה
  choice: унесётся вверх, словно пыль
  rationale: Передаёт восходящее движение и образ лёгкой пыли, рассеиваемой в воздухе.
- source_word: תּוֹרַת
  choice: закон
  rationale: В контексте нарушения завета сохраняет обязательную и властную силу Торы.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יהוה и сохраняет многозначный титул צבאות без его сужения до одного вида воинства.
- source_word: אִמְרַת קְדוֹשׁ יִשְׂרָאֵל
  choice: слово Святого Израилева
  rationale: Сохраняет устойчивый пророческий титул и возвышенную, но понятную русскую форму.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо содержит Тетраграмматон; транслитерация сохраняет личное имя Бога.
- issue: Передача תּוֹרָה в контексте пророческого суда
  choice: закон
  alternative: наставление; учение
  rationale: Здесь речь идёт об отвержении обязательного Божьего установления в контексте вины и суда; «закон» сохраняет эту силу, хотя слово шире по диапазону.
- issue: Передача יהוה צבאות
  choice: Яхве Воинств
  alternative: Яхве Саваоф; Яхве небесных воинств
  rationale: «Воинств» сохраняет ёмкость титула и не уточняет без достаточных оснований, идёт ли речь исключительно о небесных силах или обо всех подвластных Богу воинствах.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и пророческой торжественности. Архаизирующая форма «Святого Израилева» оставлена как укоренившийся и ясный библейский титул; остальная лексика современна. Маркер сноски помещён непосредственно при спорной конструкции.
