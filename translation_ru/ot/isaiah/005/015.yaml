  text: And man is brought low[a], and a man is humbled[b], and the eyes of the lofty will be brought low.
translation:
  language: ru
  text: Люди будут унижены, и каждый будет низведён, а надменные взоры будут опущены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глаза высоких станут низкими»; то есть надменные взоры гордых людей будут унижены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁח
  choice: склонён
  rationale: Передаёт значение שׁחח — «склониться, быть пригнутым/низведённым» — и сохраняет отличие от следующего глагола שׁפל.
- source_word: אָדָם
  choice: человек
  rationale: Естественное русское обозначение человека вообще; в параллели с אִישׁ не требует искусственного повторения слова «мужчина».
- source_word: וַיִּשְׁפַּל
  choice: унижен
  rationale: Глагол שׁפל означает стать низким, быть униженным; выбор сохраняет поэтическое варьирование рядом со «склонён».
- source_word: אִישׁ
  choice: муж
  rationale: Краткое, возвышенное и уместное в пророческой поэзии соответствие, позволяющее сохранить различие между אָדָם и אִישׁ.
- source_word: עֵינֵי גְבֹהִים
  choice: надменные взоры
  rationale: 'Идиоматично передаёт буквальный образ «глаз высоких»: речь идёт о гордом выражении и надменности людей, а не о физически высоко расположенных глазах.'
- source_word: תִּשְׁפַּלְנָה
  choice: будут опущены
  rationale: Сохраняет образ глаз/взоров и значение שׁפל «стать низкими», а форма будущего времени передаёт несовершенный вид пророческого возвещения.
theological_decisions:
- issue: Обобщающий смысл אָדָם и אִישׁ
  choice: человек ... муж
  alternative: люди ... каждый
  rationale: Сохранены два разных существительных единственного числа и их поэтический параллелизм без сведения текста к одной социальной группе.
- issue: Временной план пророческой поэзии
  choice: первые две формы переданы краткими страдательными причастиями, последняя — будущим временем
  alternative: прошедшее время во всех трёх частях либо будущее время во всём стихе
  rationale: Русские формы «склонён» и «унижен» допускают результативно-пророческое прочтение и сохраняют напряжение еврейских wayyiqtol, тогда как תִּשְׁפַּלְנָה явно передано как предстоящее действие.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным ритмом пророческой поэзии. Слово «муж» употреблено поэтически, а не в значении «супруг».
