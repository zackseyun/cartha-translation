id: ISA.5.29
reference: Isaiah 5:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שְׁאָגָ֥ה ל֖/וֹ כַּ/לָּבִ֑יא ו/שאג כַּ/כְּפִירִ֤ים וְ/יִנְהֹם֙ וְ/יֹאחֵ֣ז טֶ֔רֶף וְ/יַפְלִ֖יט וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/029.yaml
  text: Its roaring is like a lion[a], and it roars like young lions; it growls and seizes prey, and carries it off[b], with none to rescue.
translation:
  language: ru
  text: Рёв у него — как у льва[a]; он ревёт, как молодые львы, рычит, хватает добычу и уносит её[b] — и некому спасти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как у львицы»; еврейское слово в некоторых контекстах может иметь это более узкое значение, хотя здесь параллель с молодыми львами поддерживает перевод «лев».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «утащив, ускользает с ней»; еврейский глагол указывает, что добычу уносят так, что её уже невозможно отбить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָגָה ל֖וֹ
  choice: Рёв у него
  rationale: Именная конструкция буквально описывает принадлежащий ему рёв; современная русская формулировка сохраняет мужской род отсылки к наступающему народу или войску из контекста.
- source_word: כַּלָּבִיא
  choice: как у льва
  rationale: לָבִיא обозначает сильного взрослого льва; родовое «лев» хорошо соответствует параллели с «молодыми львами», при сохранении возможного более узкого понимания в сноске.
- source_word: וְשאג
  choice: он ревёт
  rationale: Перфект в живом поэтическом описании передан настоящим временем, чтобы сохранить непосредственность картины.
- source_word: כַּכְּפִירִים
  choice: как молодые львы
  rationale: כְּפִירִים — молодые львы, уже обладающие хищной силой, а не маленькие львята.
- source_word: וְיִנְהֹם
  choice: рычит
  rationale: Глагол передаёт низкое угрожающее рычание и тем самым отличается от предшествующего рёва.
- source_word: וְיֹאחֵז טֶרֶף
  choice: хватает добычу
  rationale: אָחַז означает крепко схватить, а טֶרֶף в образе льва естественно означает добычу.
- source_word: וְיַפְלִיט
  choice: и уносит её
  rationale: В данном контексте хифиль выражает удаление добычи за пределы возможности её отбить; «уносит» естественно связано с последующим отсутствием спасителя.
- source_word: וְאֵין מַצִּיל
  choice: и некому спасти
  rationale: Фраза прямо подчёркивает отсутствие того, кто мог бы избавить добычу; краткая русская конструкция сохраняет категоричность оригинала.
