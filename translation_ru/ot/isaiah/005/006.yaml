source:
  edition: WLC
  text: וַ/אֲשִׁיתֵ֣/הוּ בָתָ֗ה לֹ֤א יִזָּמֵר֙ וְ/לֹ֣א יֵעָדֵ֔ר וְ/עָלָ֥ה שָׁמִ֖יר וָ/שָׁ֑יִת וְ/עַ֤ל הֶ/עָבִים֙ אֲצַוֶּ֔ה מֵ/הַמְטִ֥יר עָלָ֖י/ו מָטָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/006.yaml
  text: And I will make it a wasteland[a]; it will not be pruned or hoed, and briers and thorns will grow up[c][b]; and I will command the clouds not to rain on it.
translation:
  language: ru
  text: 'И превращу его в пустошь[a]: его не будут ни обрезать, ни вскапывать[b]; зарастёт он колючками и терновником[c]. И облакам Я повелю не проливать на него дождя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в запустение», «в невозделанную землю».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обрабатывать мотыгой». Еврейский глагол означает вскапывание или мотыжение почвы.'
    reason: lexical_alternative
  - marker: c
    text: 'Точное ботаническое значение двух еврейских названий колючих растений неизвестно; возможен перевод: «терниями и колючками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשִׁיתֵהוּ
  choice: И превращу его
  rationale: Глагол שׂים имеет широкое значение «положить, сделать». При последующем существительном, обозначающем новое состояние виноградника, «превращу его» естественно передаёт результат действия.
- source_word: בָתָה
  choice: в пустошь
  rationale: Существительное обозначает опустошённую либо заброшенную, невозделанную землю. «Пустошь» сохраняет обе смысловые стороны и соответствует образу оставленного виноградника.
- source_word: לֹא יִזָּמֵר
  choice: его не будут … обрезать
  rationale: В виноградарском контексте זמר означает обрезку лоз. Страдательная конструкция передаёт нифаль и прекращение ухода за виноградником.
- source_word: וְלֹא יֵעָדֵר
  choice: ни вскапывать
  rationale: עדר обозначает обработку почвы посредством копания или мотыжения. «Вскапывать» понятно современному читателю и не сужает значение до конкретного орудия.
- source_word: וְעָלָה
  choice: зарастёт он
  rationale: В сочетании с названиями колючих растений глагол описывает их появление и разрастание. Русское «зарастёт» естественно связывает этот рост с запустением участка.
- source_word: שָׁמִיר וָשָׁיִת
  choice: колючками и терновником
  rationale: Устойчивая пара обозначает нежелательную колючую растительность на опустевшей земле; точное ботаническое отождествление обоих слов остаётся неясным.
- source_word: וְעַל הֶעָבִים אֲצַוֶּה
  choice: И облакам Я повелю
  rationale: Сохраняются прямое действие говорящего и вынесение облаков вперёд для смыслового акцента. Заглавное «Я» уместно, поскольку в контексте говорит Бог.
- source_word: מֵהַמְטִיר עָלָיו מָטָר
  choice: не проливать на него дождя
  rationale: Инфинитив с מִן после צוה выражает запрет или удержание от действия. Еврейский оборот буквально повторяет корень «дождь», а по-русски естественно передаётся как «не проливать … дождя».
theological_decisions:
- issue: Прямое участие говорящего в суде
  choice: 'Сохранено первое лицо: «превращу» и «Я повелю»'
  alternative: Передать опустошение безлично, как лишь наступившее последствие
  rationale: Еврейский текст прямо изображает говорящего совершающим суд над виноградником; смягчение до безличного события устранило бы существенный акцент.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Параллелизм действий сохранён; инверсия «облакам Я повелю» передаёт акцент исходного текста без архаизации.
