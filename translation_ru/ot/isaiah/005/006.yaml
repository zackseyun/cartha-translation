  source_fidelity: 'Текст точно передаёт еврейский оригинал: говорящий делает виноградник пустошью; уход прекращается («не будут ... обрезать, ни вскапывать»); появляется колючая растительность; облакам велено не давать дождя. Прямое первое лицо и образ суда сохранены.'
  naturalness: Современный литературный русский звучит естественно и сохраняет сдержанно возвышенную библейскую интонацию. «Зарастёт он колючками и терновником» и «облакам Я повелю» стилистически уместны и ясны.
