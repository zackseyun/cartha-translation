base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/002.yaml
  text: He dug it up[a], cleared it of stones, and planted it with choice vines; he built a tower in its midst, and also hewed out a winepress in it. Then he expected it to produce grapes, but it produced wild grapes.
translation:
  language: ru
  text: Он вскопал его, очистил от камней и засадил отборной лозой; посреди него построил башню и высек в нём давильню. Затем он ожидал, что виноградник принесёт виноград, но виноградник принёс негодный виноград[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «дикий виноград», «дурные плоды» или «зловонные ягоды». Еврейское слово обозначает плохие, негодные плоды, противопоставленные ожидаемому хорошему винограду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַזְּקֵהוּ
  choice: вскопал его
  rationale: Глагол обозначает обработку почвы, вероятно вскапывание или мотыжение. «Вскопал» естественно передаёт подготовку земли под виноградник, не добавляя отсутствующей в тексте ограды.
- source_word: וַיְסַקְּלֵהוּ
  choice: очистил от камней
  rationale: В данном сельскохозяйственном контексте форма означает удаление камней с участка, а не побивание камнями.
- source_word: שֹׂרֵק
  choice: отборную виноградную лозу
  rationale: Слово указывает на высококачественную, отборную лозу. Единственное число сохраняет форму еврейского текста и может иметь собирательный смысл.
- source_word: מִגְדָּל
  choice: башню
  rationale: Передано основное значение слова. Хотя в винограднике она, вероятно, служила сторожевой башней, функция прямо не названа.
- source_word: בְּתוֹכוֹ
  choice: посреди него
  rationale: Сохраняет пространственный образ и поэтическую выразительность, оставаясь естественным для современного русского языка.
- source_word: יֶקֶב
  choice: давильню
  rationale: Речь идёт об устройстве для выжимания винограда. «Давильня» понятно передаёт предмет без архаизма «точило».
- source_word: חָצֵב
  choice: высек
  rationale: Глагол изображает вырубание или высекание в камне и подчёркивает основательность приготовления виноградника.
- source_word: וַיְקַו
  choice: ожидал
  rationale: Глагол допускает оттенки ожидания и надежды; здесь речь о закономерном ожидании плодов после тщательной подготовки.
- source_word: לַעֲשׂוֹת עֲנָבִים
  choice: виноградник принесёт виноград
  rationale: Буквально лоза должна была «сделать» виноград; глагол «принести» естественен по-русски применительно к плодам. Явно названный субъект устраняет неестественную цепочку местоимений, не меняя образа.
- source_word: וַיַּעַשׂ בְּאֻשִׁים
  choice: тот принёс негодные ягоды[a]
  rationale: בְּאֻשִׁים обозначает плохие, зловонные или негодные плоды, противопоставленные ожидаемому хорошему винограду. «Негодные ягоды» передаёт отрицательную оценку, а сноска сохраняет лексическую неоднозначность.
theological_decisions:
- issue: Виноградник далее истолковывается как образ Израиля
  choice: Сохранить в стихе конкретный образ виноградника без преждевременного раскрытия его значения
  alternative: Прямо обозначить Израиль или описать плоды как нравственные поступки
  rationale: В этом стихе ещё звучит песня о винограднике; её истолкование появляется позднее. Такой перевод сохраняет развитие метафоры и богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сельскохозяйственные образы сохранены, но архаизм «точило» заменён понятным словом «давильня».
