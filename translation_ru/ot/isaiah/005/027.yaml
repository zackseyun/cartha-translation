base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/027.yaml
  text: None among them is weary[a], and none stumbles; none slumbers or sleeps; the belt at his waist is not loosened[b], and the strap of his sandals is not broken.
translation:
  language: ru
  text: Среди них нет ни утомлённых[a], ни спотыкающихся; никто не дремлет и не спит. Пояс на его талии не развязывается[b], и ремешок его сандалий не рвётся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в нём»; в еврейском тексте стоит местоимение единственного числа, относящееся ко всему наступающему войску как к единому целому.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пояс на его чреслах не открывается».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָיֵף
  choice: утомлённый
  rationale: Передаёт физическую усталость в контексте стремительно идущего войска и естественно сочетается с последующим образом спотыкающегося.
- source_word: כּוֹשֵׁל
  choice: спотыкающийся
  rationale: Сохраняет конкретный образ потери устойчивости, не сводя его лишь к общему ослаблению решимости.
- source_word: בּוֹ
  choice: среди них
  rationale: Морфологически местоимение единственного числа относится к войску как к собирательному целому; русское распределительное выражение естественно передаёт смысл.
- source_word: יָנוּם
  choice: дремлет
  rationale: Сохраняет отличие от следующего יִישָׁן и поэтическую пару «дремлет и спит».
- source_word: יִישָׁן
  choice: спит
  rationale: Обычный и точный эквивалент, сохраняющий параллелизм с «дремлет».
- source_word: נִפְתַּח
  choice: распускается
  rationale: Для пояса обозначает развязывание или ослабление крепления; «распускается» естественно передаёт готовность снаряжения и сохраняет оттенок исходного «открываться».
- source_word: אֵזוֹר
  choice: пояс
  rationale: Современное и ясное обозначение пояса или опоясывающей повязки без архаизма.
- source_word: חֲלָצָיו
  choice: на его бёдрах
  rationale: Сохраняет телесную конкретность слова «чресла/бёдра», избегая архаичного «чресла»; конструкция описывает место ношения пояса.
- source_word: נִתַּק
  choice: рвётся
  rationale: Передаёт разрыв или отрыв ремешка; в русском это наиболее естественный глагол для повреждения такого крепления.
- source_word: שְׂרוֹךְ
  choice: ремешок
  rationale: Точно и понятно обозначает крепление древней обуви; лучше соответствует сандалии, чем современный «шнурок».
- source_word: נְעָלָיו
  choice: его сандалий
  rationale: Сохраняет исторически конкретный вид древневосточной обуви.
