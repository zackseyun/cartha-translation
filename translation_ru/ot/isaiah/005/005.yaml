  to: 'А теперь дайте мне сказать вам, что я сделаю с моим виноградником: уберу его изгородь — и он станет добычей[a]; разрушу его стену — и его вытопчут[b].'
  rationale: Изменение восстанавливает более конкретную образность לְבָעֵר, не выбирая спорно узкое значение «будет сожжён». Маркер сноски перенесён к соответствующему выражению. Начальная формула сделана естественнее для современного литературного русского при сохранении обращения во множественном числе и вежливо-побудительного оттенка.
