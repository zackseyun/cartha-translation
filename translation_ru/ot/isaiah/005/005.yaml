  text: וְ/עַתָּה֙ אוֹדִֽיעָה נָּ֣א אֶתְ/כֶ֔ם אֵ֛ת אֲשֶׁר אֲנִ֥י עֹשֶׂ֖ה לְ/כַרְמִ֑/י הָסֵ֤ר מְשׂוּכָּת/וֹ֙ וְ/הָיָ֣ה לְ/בָעֵ֔ר פָּרֹ֥ץ גְּדֵר֖/וֹ וְ/הָיָ֥ה לְ/מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/005.yaml
  text: 'And now[a], please let me tell you what I will do to my vineyard: I will remove its hedge, and it will be burned; I will break down its wall[b], and it will be trampled down.'
translation:
  language: ru
  text: 'А теперь дайте мне сказать вам, что я сделаю с моим виноградником: уберу его изгородь — и он станет добычей[a]; разрушу его стену — и его вытопчут[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет сожжён»; возможно также: «будет уничтожен (поглощён)». Буквально: «будет для уничтожения (пожирания)».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «он станет местом попрания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет и соединительную силу וְ, и переход к следующему этапу песни о винограднике; естественно звучит по-русски.
- source_word: אוֹדִיעָה נָּא אֶתְכֶם
  choice: позвольте мне объявить вам
  rationale: Передаёт каузативное значение ידע («дать знать, сообщить») и смягчающую силу נָא; множественное «вам» сохраняет обращение к нескольким слушателям.
- source_word: אֵת אֲשֶׁר אֲנִי עֹשֶׂה לְכַרְמִי
  choice: что я сделаю с моим виноградником
  rationale: Причастие עֹשֶׂה в контексте обозначает предстоящее действие; русское «сделаю с» идиоматично передаёт действие над виноградником.
- source_word: הָסֵר מְשׂוּכָּתוֹ
  choice: уберу его изгородь
  rationale: Инфинитив абсолютный передан решительным будущим действием; «изгородь» обозначает защитную живую или колючую ограду и отличается от последующей стены.
- source_word: וְהָיָה לְבָעֵר
  choice: и он будет опустошён
  rationale: Буквальная конструкция «будет для уничтожения/пожирания» выражает результат снятия защиты. «Опустошён» сохраняет более широкое значение, не сводя образ исключительно к сожжению.
- source_word: פָּרֹץ גְּדֵרוֹ
  choice: разрушу его стену
  rationale: פָּרֹץ означает пробить или разрушить преграду; «стена» сохраняет различие между גָּדֵר и ранее названной изгородью.
- source_word: וְהָיָה לְמִרְמָס
  choice: и его вытопчут
  rationale: Естественно передаёт результативную конструкцию с существительным «топтание» и сохраняет неопределённость относительно тех, кто совершит действие.
theological_decisions:
- issue: Метафора виноградника как образ суда
  choice: Сохранить земледельческий образ без указания его референта в основном тексте.
  alternative: Прямо назвать виноградник Израилем или Иудеей.
  rationale: Сам стих остаётся внутри метафоры; её истолкование даётся ближайшим контекстом, поэтому раскрывать его здесь означало бы добавить к тексту пояснение.
- issue: Смысл וְהָיָה לְבָעֵר
  choice: Передать как «он будет опустошён», отметив альтернативы в сноске.
  alternative: «Он будет сожжён» или «станет добычей».
  rationale: Еврейская конструкция допускает значение уничтожения, пожирания или выжигания. Более широкая формулировка сохраняет неоднозначность и естественно соответствует снятию защиты с виноградника.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Двоеточие и тире подчёркивают объявление последовательных действий суда; метафора сохранена без пояснительной вставки.
