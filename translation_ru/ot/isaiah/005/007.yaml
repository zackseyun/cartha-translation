  text: כִּ֣י כֶ֜רֶם יְהוָ֤ה צְבָאוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/אִ֣ישׁ יְהוּדָ֔ה נְטַ֖ע שַׁעֲשׁוּעָ֑י/ו וַ/יְקַ֤ו לְ/מִשְׁפָּט֙ וְ/הִנֵּ֣ה מִשְׂפָּ֔ח לִ/צְדָקָ֖ה וְ/הִנֵּ֥ה צְעָקָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/007.yaml
  text: For the vineyard of Yahweh of Armies is the house of Israel[a], and the men of Judah are the planting of his delight. He looked for justice, but behold, bloodshed; for righteousness, but behold[c][b], an outcry.
translation:
  language: ru
  text: 'Ибо виноградник Яхве Воинств[a] — дом Израиля,

    а люди Иудеи[b] — насаждение, которым Он любуется.

    Он ждал правосудия — но вот кровопролитие;

    праведности — но вот вопль![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Титул «Яхве Воинств» традиционно также переводят как «Господь Саваоф» или «Господь воинств».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «муж Иуды»; единственное число здесь употреблено собирательно — о народе Иудеи.'
    reason: alternative_reading
  - marker: c
    text: 'В еврейском тексте звучит игра близких по звучанию слов: мишпа́т («правосудие») — миспа́х («кровопролитие», точное значение редкого слова не вполне ясно); цедака́ («праведность») — цеака́ («вопль»). Она резко противопоставляет ожидаемое Яхве тому, что Он обнаружил.'
    reason: wordplay_and_lexical_uncertainty
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение образа виноградника; «ибо» ясно передаёт причинно-пояснительную связь и сохраняет достоинство поэтической речи.
- source_word: כֶרֶם
  choice: виноградник
  rationale: Речь идёт о возделываемом винограднике из предшествующей песни, а не об отдельной лозе.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией «Яхве», а צְבָאוֹת — смысловым эквивалентом «Воинств», сохраняющим силу божественного титула.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Устойчивое библейское собирательное выражение, естественное и понятное по-русски.
- source_word: וְאִישׁ יְהוּדָה
  choice: а жители Иудеи
  rationale: Единственное число אִישׁ здесь имеет собирательное значение. «Жители Иудеи» естественно выражает эту коллективность, не создавая ошибочного впечатления, будто имеется в виду один человек.
- source_word: נְטַע שַׁעֲשׁוּעָיו
  choice: любимое Его насаждение
  rationale: Сохраняется сельскохозяйственная метафора и передаётся мысль о том, что насаждение доставляло владельцу особую радость.
- source_word: וַיְקַו
  choice: Он ждал
  rationale: Глагол выражает ожидание желаемого плода; краткое «ждал» поддерживает параллелизм двух заключительных строк.
- source_word: לְמִשְׁפָּט
  choice: правосудия
  rationale: מִשְׁפָּט здесь обозначает справедливый общественный и судебный порядок; «правосудие» также позволяет приблизительно отразить звуковую перекличку с «кровопролитием».
- source_word: מִשְׂפָּח
  choice: кровопролитие
  rationale: Редкое слово обычно понимают как насилие или пролитие крови. «Кровопролитие» передаёт резкий контраст с ожидаемым правосудием, хотя значение слова не вполне бесспорно.
- source_word: לִצְדָקָה
  choice: праведности
  rationale: Слово охватывает нравственную правоту и справедливый порядок; «праведность» сохраняет его широкий нравственно-заветный смысл.
- source_word: צְעָקָה
  choice: вопль
  rationale: Обозначает крик людей, страдающих от притеснения или несправедливости. «Вопль» краток, силён и уместен в поэтическом контрасте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Собирательное значение וְאִישׁ יְהוּדָה
  choice: жители Иудеи
  alternative: муж Иуды / мужи Иудеи
  rationale: Формально единственное число допускает буквальное «муж Иуды», но в параллели с «домом Израиля» оно представляет народ Иудеи как единое целое. Выбран естественный современный коллективный эквивалент.
- issue: Соотношение מִשְׁפָּט и צְדָקָה
  choice: правосудие и праведность
  alternative: справедливость и правда
  rationale: Разные русские слова сохраняют различие еврейских понятий, не сводя оба к одной только социальной справедливости и не разрывая их тесной смысловой связи.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и торжественной краткости. Инверсия «любимое Его насаждение» слегка возвышает регистр, но остаётся понятной. Тире и точка с запятой подчёркивают два симметричных контраста заключительной строки.
