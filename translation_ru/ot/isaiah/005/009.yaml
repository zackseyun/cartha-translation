base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/009.yaml
  text: 'In my ears Yahweh of Armies has sworn: Surely many houses will become a desolation[a], great and good houses[b], without inhabitant.'
translation:
  language: ru
  text: 'Я слышал, как Яхве Воинств[a] сказал: «Воистину, многие дома станут запустением[b] — большие и прекрасные, без жителей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь Воинств»; традиционно: «Господь Саваоф».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «станут запустением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָזְנַי
  choice: В моих ушах
  rationale: Сохранён конкретный еврейский образ, подчёркивающий, что пророк услышал это непосредственно; по-русски оборот остаётся понятным в торжественном пророческом контексте.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — прозрачным современному читателю словом «Воинств»; этим сохраняется форма божественного титула без традиционной замены имени на «Господь».
- source_word: אִם לֹא
  choice: Несомненно
  rationale: В формуле клятвы сочетание выражает твёрдое заверение, а не обычное условие «если не».
- source_word: בָּתִּים רַבִּים
  choice: множество домов
  rationale: Речь идёт о многочисленных зданиях, а не прежде всего о семьях или домохозяйствах.
- source_word: לְשַׁמָּה יִהְיוּ
  choice: будет разорено
  rationale: Передаёт наступившее вследствие суда состояние опустошения и разорения естественным русским выражением.
- source_word: גְּדֹלִים וְטוֹבִים
  choice: большие и прекрасные дома
  rationale: Прилагательные характеризуют размер и высокое качество домов; «прекрасные» здесь естественнее буквального, но расплывчатого «хорошие».
- source_word: מֵאֵין יוֹשֵׁב
  choice: останутся без жителей
  rationale: Сжато и ясно передаёт полное отсутствие обитателей; множественное число согласовано с русским «дома».
theological_decisions:
- issue: Передача имени и титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве, Владыка воинств
  rationale: Выбранный вариант сохраняет личное имя Бога и смысл צְבָאוֹת, не подменяя имя титулом и не добавляя отсутствующего в еврейском тексте слова «Владыка».
- issue: Подразумеваемая клятва при אִם לֹא
  choice: клятва Яхве Воинств
  alternative: речь Яхве Воинств
  rationale: Формула אִם לֹא в данном контексте имеет силу торжественной клятвы с подразумеваемым проклятием, хотя отдельного глагола «поклялся» в масоретском тексте нет; именная конструкция сохраняет эту особенность лучше, чем прямое добавление глагола.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Начальный образ «В моих ушах» намеренно сохранён, а эллиптическая еврейская конструкция оформлена как именная фраза. Параллелизм второй половины стиха передан точкой с запятой.
