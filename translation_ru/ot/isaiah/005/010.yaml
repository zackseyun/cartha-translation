  text: כִּ֗י עֲשֶׂ֨רֶת֙ צִמְדֵּי כֶ֔רֶם יַעֲשׂ֖וּ בַּ֣ת אֶחָ֑ת וְ/זֶ֥רַע חֹ֖מֶר יַעֲשֶׂ֥ה אֵיפָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/010.yaml
  text: For ten yoke-pairs of vineyard will yield one bath[b][a], and a homer of seed will yield an ephah.
translation:
  language: ru
  text: Ибо виноградник площадью в десять упряжек[a] даст всего один бат[b], а хомер посевного зерна даст лишь эфу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «десять упряжек виноградника». Еврейское выражение, вероятно, обозначает площадь земли, соответствующую работе десяти пар тягловых животных, а не самих животных в винограднике.'
    reason: lexical_alternative
  - marker: b
    text: 'Бат был мерой жидкостей, а эфа — мерой сыпучих тел. Смысл в крайнем неурожае: большой виноградник даст совсем мало вина, а из хомера посевного зерна получится лишь эфа, то есть одна десятая хомера.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предшествующего пророчества о суде; «ибо» естественно передаёт причинно-пояснительную связь.
- source_word: עֲשֶׂרֶת צִמְדֵּי כֶרֶם
  choice: виноградник площадью в десять упряжек
  rationale: צֶמֶד буквально обозначает пару животных под ярмом, а также участок, обрабатываемый такой упряжкой. Формулировка передаёт здесь значение старинной меры площади и сохраняет земледельческий образ.
- source_word: יַעֲשׂוּ
  choice: даст
  rationale: Глагол עשה буквально означает «делать», но применительно к урожаю имеет значение «давать, производить».
- source_word: בַּת אֶחָת
  choice: один бат
  rationale: Сохранено древнее название меры жидкостей; числительное подчёркивает ничтожность урожая.
- source_word: וְזֶרַע חֹמֶר
  choice: а хомер посеянного зерна
  rationale: Сочетание обозначает количество семян объёмом в один хомер; «посеянного зерна» ясно выражает его роль как затраченного посевного материала.
- source_word: יַעֲשֶׂה
  choice: даст
  rationale: В земледельческом контексте передано так же, как однокоренная форма в первой части стиха.
- source_word: אֵיפָה
  choice: эфу
  rationale: Сохранено древнее название меры с нормативным русским склонением.
