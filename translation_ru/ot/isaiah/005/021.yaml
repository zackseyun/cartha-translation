base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/021.yaml
  text: Woe to those who are wise in their own eyes and discerning in their own sight[a].
translation:
  language: ru
  text: Горе тем, кто мудр в собственных глазах и разумен на свой взгляд!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Пророческое междометие, выражающее осуждение и возвещающее бедствие; «горе» естественно и точно передаёт тон контекста суда.
- source_word: חֲכָמִים
  choice: мудр
  rationale: Форма описывает людей, считающих себя мудрыми; краткое «кто мудр» идиоматично по-русски и сохраняет оценочную направленность.
- source_word: בְּעֵינֵיהֶם
  choice: в собственных глазах
  rationale: Сохранён еврейский образ самооценки; «собственных» ясно передаёт возвратный смысл местоименного суффикса.
- source_word: וְנֶגֶד פְּנֵיהֶם
  choice: в собственном представлении
  rationale: Буквально выражение указывает на то, что находится «перед их лицом», но в параллелизме означает их взгляд на самих себя. Выбран естественный русский оборот, не дублирующий дословно первую строку.
- source_word: נְבֹנִים
  choice: разумен
  rationale: Слово от корня בין обозначает способность понимать и различать; «разумен» сохраняет интеллектуально-нравственный оттенок и хорошо сочетается с «мудр».
