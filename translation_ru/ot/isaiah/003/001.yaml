    issue: Неестественное сочетание «опора в хлебе и ... в воде».
    rationale: В русском «опора в хлебе» не является нормативным способом обозначить обеспечение хлебом. Еврейские сочетания в контексте называют всякий запас/источник хлеба и воды.
  - severity: low
    issue: «Ведь вот» снижает пророчески-торжественный регистр.
    rationale: «Ведь» имеет разговорно-пояснительный оттенок; «Ибо вот» передаёт כִּי הִנֵּה без этой стилистической окраски.
  revised_text: Ибо вот, Владыка, ГОСПОДЬ Воинств, лишает Иерусалим и Иудею опоры и поддержки — всякого запаса хлеба и всякого запаса воды.
