  text: כִּי֩ הִנֵּ֨ה הָ/אָד֜וֹן יְהוָ֣ה צְבָא֗וֹת מֵסִ֤יר מִ/ירוּשָׁלִַ֨ם֙ וּ/מִ֣/יהוּדָ֔ה מַשְׁעֵ֖ן וּ/מַשְׁעֵנָ֑ה כֹּ֚ל מִשְׁעַן לֶ֔חֶם וְ/כֹ֖ל מִשְׁעַן מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/001.yaml
  text: 'For look, the Lord, the LORD of Armies, is removing from Jerusalem and from Judah support and supply: all support of bread and all support of water.'
translation:
  language: ru
  text: Ибо вот, Владыка, ГОСПОДЬ Воинств, лишает Иерусалим и Иудею опоры и поддержки — всякого запаса хлеба и всякого запаса воды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ведь вот
  rationale: Сохраняет причинно-пояснительное כִּי и вводящее внимание הִנֵּה, не перегружая современную русскую фразу.
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: Владыка, ГОСПОДЬ Воинств
  rationale: Передаёт определённое אֲדוֹן как титул верховной власти, тетраграмматон — принятой типографической формой ГОСПОДЬ, а צְבָאוֹת — традиционным и достаточно широким «Воинств».
- source_word: מֵסִיר
  choice: отнимает
  rationale: Причастная форма описывает решительное действие Бога; «отнимает» естественно сочетается с опорой и передаёт лишение, а не просто перемещение.
- source_word: מַשְׁעֵן וּמַשְׁעֵנָה
  choice: опору и поддержку
  rationale: Два однокоренных существительных мужского и женского рода образуют усиленную парную формулу. Русская пара сохраняет смысловую полноту без искусственного копирования рода.
- source_word: כֹּל מִשְׁעַן לֶחֶם וְכֹל מִשְׁעַן מָיִם
  choice: всякую опору в хлебе и всякую опору в воде
  rationale: Сохраняет повтор כֹּל и образ жизненно необходимого обеспечения хлебом и водой, не сводя выражение только к абстрактным «запасам».
theological_decisions:
- issue: Объект Божьего суда
  choice: ГОСПОДЬ сам отнимает жизненную опору у Иерусалима и Иудеи
  alternative: Безличное описание грядущей нехватки
  rationale: Грамматика прямо называет Владыку, ГОСПОДА Воинств, действующим субъектом; перевод не смягчает эту богословскую напряжённость.
- issue: Значение титула צְבָאוֹת
  choice: Воинств
  alternative: Небесных воинств / Сил
  rationale: Исходный титул не уточняет здесь, какие именно воинства имеются в виду, поэтому сохранена его подлинная широта.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Тире ясно вводит пояснение к паре «опору и поддержку». Заглавное написание «ГОСПОДЬ» отличает имя יהוה от титула «Владыка».
