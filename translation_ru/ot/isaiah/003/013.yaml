lexical_decisions:
- source_word: נִצָּב
  choice: встал
  rationale: Причастие нифаля от נצב изображает Яхве занимающим твёрдую позицию для судебного разбирательства. «Встал» естественно передаёт решительное вступление в судебную сцену.
- source_word: לָרִיב
  choice: вести тяжбу
  rationale: В судебном контексте ריב означает вступать в правовой спор или вести дело. «Вести тяжбу» сохраняет юридическую образность, не уточняя сверх текста, выступает ли Яхве обвинителем или иной стороной разбирательства.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: וְעֹמֵד
  choice: и стоит
  rationale: Причастие от עמד продолжает образ Яхве, стоящего в судебной позиции; настоящее время сохраняет длительность позы и еврейский параллелизм, хотя по-русски возникает намеренная смена вида после «встал».
- source_word: לָדִין
  choice: чтобы судить
  rationale: В данном контексте דין имеет судебное значение; «судить» — ясная и наименее истолковывающая передача.
- source_word: עַמִּים
  choice: народы
  rationale: Форма множественного числа сохранена. Русское «народы» оставляет открытым, имеются ли в виду разные народы вообще или группы внутри более близкого контекста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Сфера значения עַמִּים
  choice: народы
  alternative: племена; народ
  rationale: Еврейское слово стоит во множественном числе и может иметь широкий охват. «Народы» сохраняет множественность и не ограничивает судебную сцену только языческими государствами или только Израилем.
- issue: Роль Яхве в выражении לָרִיב
  choice: вести тяжбу
  alternative: предъявить обвинение; защищать дело
  rationale: Фраза несёт судебную образность, но сама по себе не требует сузить роль до обвинителя либо защитника. Выбранная формулировка сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-пророческой сцены. Краткий параллелизм оригинала сохранён; юридическое «вести тяжбу» понятно из контекста и не перегружает строку специальной терминологией.
