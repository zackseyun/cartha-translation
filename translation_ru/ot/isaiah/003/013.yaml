  text: Yahweh takes his stand to contend[b][a], and stands to judge the peoples.
translation:
  language: ru
  text: Яхве встаёт, чтобы вести тяжбу[a], и стоит, чтобы судить народы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вступить в спор», «вести судебное дело»; еврейский глагол имеет оттенок судебной тяжбы.'
