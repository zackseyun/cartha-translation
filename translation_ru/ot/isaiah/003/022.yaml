translation:
  language: ru
  text: праздничные одеяния[a], накидки[b], шали[c] и кошельки[d];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нарядные одежды». Вероятно, речь идёт об особой дорогой одежде, а не о повседневной.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верхние покрывала».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «платки» или «покрывала». Точный вид этой принадлежности из ткани неизвестен.'
    reason: lexical_alternative
  - marker: d
