base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/017.yaml
  text: therefore the Lord will strike the crown of the daughters of Zion with scabs[a], and Yahweh will lay bare their private parts.
translation:
  language: ru
  text: Поэтому Владыка покроет струпьями темя дочерей Сиона, и Яхве обнажит их интимные места[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их наготу»; еврейское слово трудно для понимания. Некоторые считают его эвфемизмом, обозначающим интимные части тела, а другие понимают как «лоб».'
    reason: Лексическая неоднозначность редкого слова פָּתְהֵן.
lexical_decisions:
- source_word: וְשִׂפַּח
  choice: поэтому … покроет струпьями
  rationale: Глагол обозначает поражение кожи струпьями или болезненными коростами. Выражение «покроет струпьями» естественно по-русски передаёт результат действия, а начальное «поэтому» отражает следственный ход пророческой речи.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: «Владыка» передаёт значение божественного титула «Господин, Владыка» и позволяет отличить его от следующего в стихе личного имени יהוה.
- source_word: קָדְקֹד
  choice: темя
  rationale: Слово означает верхнюю часть головы, темя. Этот краткий литературный эквивалент точнее, чем общее «голова», и не создаёт двусмысленности слова «венец».
- source_word: בְּנוֹת צִיּוֹן
  choice: дочерей Сиона
  rationale: Буквальное выражение сохраняет пророческую образность и возвышенный библейский регистр; замена на «женщин Сиона» была бы более истолковательной.
- source_word: וַיהוָה
  choice: и Яхве
  rationale: Личное имя Бога передано как «Яхве», в отличие от титула אֲדֹנָי «Владыка»; тем самым сохраняется различие двух еврейских обозначений в одном стихе.
- source_word: פָּתְהֵן
  choice: их интимные места
  rationale: Редкое и трудное слово в данном контексте, вероятнее всего, эвфемистически указывает на интимные части тела, обнажение которых означает публичное унижение. Лексическая неопределённость отмечена в сноске.
- source_word: יְעָרֶה
  choice: обнажит
  rationale: Глагол означает «открыть, обнажить». «Обнажит» ясно и сдержанно передаёт образ насильственного выставления наготы напоказ.
theological_decisions:
- issue: Различение אֲדֹנָי и יהוה в одном стихе
  choice: אֲדֹנָי передано как «Владыка», а יהוה — как «Яхве»
  alternative: Передать оба обозначения словом «Господь» либо יהוה традиционным написанием «ГОСПОДЬ»
  rationale: Еврейский текст намеренно употребляет рядом титул и личное имя. Разные русские соответствия сохраняют это формальное различие, не вводя дополнительного богословского толкования.
- issue: Значение פָּתְהֵן в пророчестве о позоре и суде
  choice: Эвфемистическое обозначение интимных частей тела
  alternative: «нагота» в общем смысле или, согласно иному пониманию трудного слова, «лоб»
  rationale: Сочетание с глаголом «обнажит» и контекст публичного унижения поддерживают конкретное значение, однако трудность еврейского слова не позволяет представить его как бесспорное; поэтому другие варианты сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Интимные места» передаёт смысл сдержанно и понятно, без грубости; «темя» сохраняет поэтическую точность. Божественный титул и личное имя различены как «Владыка» и «Яхве».
