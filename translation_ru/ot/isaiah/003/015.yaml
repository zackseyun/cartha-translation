  yaml_path: translation/ot/isaiah/003/015.yaml
  text: What do you mean by crushing my people and grinding the faces of the poor? declares the Lord GOD of hosts[a][b].
translation:
  language: ru
  text: «Что это вы сокрушаете Мой народ и перемалываете лица бедных?[a]» — возвещает Владыка, Яхве Воинств.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что вам, что вы…?» — древнееврейский оборот, выражающий резкий укор. «Перемалывать лица» — яркий образ беспощадного угнетения бедных.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Владыка Господь Воинств». В древнееврейском тексте стоит личное имя Бога — Яхве.'
    reason: divine_name
lexical_decisions:
- source_word: מַה־לָכֶם
  choice: Что это вы
  rationale: Эллиптический оборот буквально означает «что вам? / что это вам, что…?» и выражает резкий укор. «Что это вы…?» естественно передаёт вопросительную форму и обличительный тон, не превращая его в нейтральное «почему».
- source_word: תְּדַכְּאוּ
  choice: сокрушаете
  rationale: Порода пиэль глагола דכא передаёт действие, подобное раздавливанию. Конкретное «сокрушаете» сохраняет жестокий образ исходного текста лучше, чем отвлечённое «угнетаете».
- source_word: עַמִּי
  choice: Мой народ
  rationale: Прямо передаёт притяжательную конструкцию и подчёркивает, что Яхве отождествляет Себя с притесняемым народом.
- source_word: וּפְנֵי עֲנִיִּים
  choice: и ... лица бедных
  rationale: פנים имеет форму множественного числа; «лица бедных» сохраняет телесную конкретность метафоры. עניים в данном контексте обозначает социально слабых и неимущих.
- source_word: תִּטְחָנוּ
  choice: перемалываете
  rationale: Глагол טחן буквально означает «молоть, перемалывать». Выбор сохраняет второй, отличный от «сокрушаете», образ беспощадного угнетения.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт устойчивую формулу пророческого изречения как властное Божье объявление; звучит литературно и понятно в современном русском языке.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: Владыка Яхве Воинств
  rationale: «Владыка» различает אֲדֹנָי и личное имя יְהוִה, переданное как «Яхве». «Воинств» сохраняет широту צְבָאוֹת, не ограничивая её только земными армиями.
theological_decisions:
- issue: Передача имени יְהוִה в составном титуле אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь / Господь Бог
  rationale: Транслитерация «Яхве» позволяет различить титул אֲדֹנָי («Владыка») и собственное имя Бога, не создавая сочетания «Господь Господь» и не заменяя имя иным титулом.
- issue: Образ перемалывания лиц бедных
  choice: сохранить телесную метафору без истолковывающей замены
  alternative: жестоко угнетаете бедных
  rationale: Исходный текст намеренно соединяет два резких образа — сокрушение и перемалывание. Более отвлечённый перевод снял бы риторическую силу и богословскую остроту обвинения.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Конкретные и жестокие образы оригинала сохранены; архаичность ограничена словом «Воинств» как частью традиционно возвышенного божественного титула.
