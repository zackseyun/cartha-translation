  text: сильного мужа и воина, судью и пророка, гадателя[a] и старейшину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прорицателя». Еврейское слово обозначает человека, занимающегося гаданием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹר
  choice: сильного мужа
  rationale: Передаёт образ сильного, доблестного человека и сохраняет отличие от следующего прямо военного обозначения; форма согласована с продолжающимся из предыдущего стиха перечислением тех, кого Господь устранит.
- source_word: אִישׁ מִלְחָמָה
  choice: воина
  rationale: Естественный современный русский эквивалент еврейского выражения «человек войны»; не смешивается с более широким גִּבּוֹר.
- source_word: שׁוֹפֵט
  choice: судью
  rationale: Прямо обозначает человека, исполняющего судебную или общественно-управленческую функцию.
- source_word: נָבִיא
  choice: пророка
  rationale: Устоявшееся и точное обозначение пророческого служения.
- source_word: קֹסֵם
  choice: гадателя
  rationale: Точно и понятно обозначает человека, занимающегося гаданием; описательное упоминание не подразумевает одобрения этой практики.
- source_word: זָקֵן
  choice: старейшину
  rationale: В перечне общественных фигур слово указывает прежде всего на признанный статус и руководящую роль, а не только на преклонный возраст.
- source_word: וְ
  choice: и
  rationale: Повторение союза частично сохранено, чтобы передать размеренный характер перечня и при этом избежать неестественной для русского речи тяжеловесности.
theological_decisions:
- issue: Значение קֹסֵם в контексте пророческого обличения
  choice: гадателя
  alternative: прорицателя
  rationale: Нейтрально и прямо называет практикующего гадание, не смягчая значение слова и не создавая впечатления, будто текст одобряет запрещённую практику.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского перечня. Винительный падеж сохраняет синтаксическую связь со сказуемым предыдущего стиха. Маркер сноски поставлен непосредственно при слове קֹסֵם, к которому относится примечание.
