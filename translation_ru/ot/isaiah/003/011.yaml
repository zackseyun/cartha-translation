  text: א֖וֹי לְ/רָשָׁ֣ע רָ֑ע כִּֽי גְמ֥וּל יָדָ֖י/ו יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/011.yaml
  text: Woe to the wicked! It will go badly for him[a], for the work of his hands will be done to him.
translation:
  language: ru
  text: Горе нечестивому! Ему будет худо[a], ибо ему воздастся за дела его рук.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Горе нечестивому! Беда ему, ибо ему воздастся за дела его рук».'
    reason: Еврейское רַע может быть передано существительным «беда, зло» либо предикативно — «ему будет худо».
lexical_decisions:
- source_word: א֖וֹי
  choice: Горе
  rationale: Междометие выражает одновременно скорбь и угрозу; «горе» сохраняет характерную пророческую формулу осуждения.
- source_word: לְ/רָשָׁ֣ע
  choice: нечестивому
  rationale: Предлог לְ обозначает того, к кому обращено возвещение горя; единственное число сохранено как обобщённое.
- source_word: רָ֑ע
  choice: Ему будет худо
  rationale: רַע здесь допускает понимание как предикативного указания на бедственный исход. Такая передача естественна по-русски и не сводит слово исключительно к нравственному злу.
- source_word: כִּֽי
  choice: ибо
  rationale: Союз вводит основание объявленного горя; «ибо» соответствует торжественному пророческому регистру.
- source_word: גְמ֥וּל יָדָ֖י/ו
  choice: по делам его рук
  rationale: גְּמוּל указывает на воздаяние, соответствующее поступкам, а «руки» служат конкретным образом человеческих дел. Формулировка сохраняет этот образ и связь между поступком и последствием.
- source_word: יֵעָ֥שֶׂה לּֽ/וֹ
  choice: с ним поступят
  rationale: Безличная конструкция естественно передаёт нифаль со значением того, что будет сделано по отношению к нему, не вводя в текст явно названного исполнителя.
theological_decisions:
- issue: Обобщённое мужское единственное число в изречении о суде
  choice: 'Сохранено единственное число: «нечестивому… ему… его».'
  alternative: 'Передать множественным числом: «нечестивым… с ними… их».'
  rationale: В еврейском тексте грамматически представлена одна типичная фигура нечестивого; изменение числа ослабило бы индивидуальную направленность изречения.
- issue: Характер воздаяния
  choice: «С ним поступят по делам его рук».
  alternative: «Ему воздастся за дела его рук» или буквально «воздаяние его рук будет сделано ему».
  rationale: Перевод передаёт соразмерность суда поступкам, сохраняя неопределённость относительно исполнителя и не вводя дополнительной богословской терминологии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Худо» здесь намеренно сохраняет краткость и силу еврейской формулы, а «дела его рук» — её конкретный образ.
