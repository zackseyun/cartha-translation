  text: And I will make youths their princes[a], and capricious children will rule over them.
translation:
  language: ru
  text: И Я поставлю юношей их правителями, и капризные дети[a] будут править ими.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети», «младенцы» или «малыши»; значение редкого еврейского слова не вполне ясно и может указывать как на малолетство, так и на детскую капризность или непостоянство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И Я поставлю
  rationale: Хотя נתן буквально означает «дать», в контексте управления глагол передаёт назначение на власть; «поставлю» естественно выражает этот смысл по-русски.
- source_word: נְעָרִים
  choice: юношей
  rationale: נְעָרִים обозначает молодых людей и в данном контексте подчёркивает их неопытность и непригодность к управлению, не сужая значение до малолетних мальчиков.
- source_word: שָׂרֵיהֶם
  choice: их правителями
  rationale: שַׂר может означать князя, начальника или должностное лицо. «Правителями» ясно передаёт управленческую роль и естественно сочетается с глаголом «поставлю».
- source_word: וְתַעֲלוּלִים
  choice: своевольные дети
  rationale: Редкое и трудное слово תַעֲלוּלִים допускает оттенки детскости, прихоти, своеволия и неустойчивости. Сочетание «своевольные дети» сохраняет как возрастной образ, так и поведенческий оттенок.
- source_word: יִמְשְׁלוּ בָם
  choice: будут господствовать над ними
  rationale: משל с предлогом ב означает осуществлять власть над кем-либо. «Господствовать над ними» прямо передаёт властный и в контексте суда тягостный характер такого правления.
theological_decisions:
- issue: Характер образа суда
  choice: Сохранён образ Божьего суда через поставление молодых и своевольных правителей, без уточнения, следует ли понимать их возраст буквально или как образ незрелости.
  alternative: Истолковать выражения либо исключительно как буквальное указание на возраст, либо исключительно как метафору некомпетентности.
  rationale: Еврейские слова связаны и с молодостью, и с детским, прихотливым поведением; пророческий образ может одновременно нести буквальный и переносный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавное «Я» обозначает говорящего Господа в ближайшем контексте. Параллелизм двух строк сохранён; трудность תַעֲלוּלִים отражена сноской.
