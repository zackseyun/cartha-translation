source:
  edition: WLC
  text: וְ/הַ/גִּלְיֹנִים֙ וְ/הַ/סְּדִינִ֔ים וְ/הַ/צְּנִיפ֖וֹת וְ/הָ/רְדִידִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/023.yaml
  text: and the mirrors[a], and the linen garments, and the turbans[b], and the veils.
translation:
  language: ru
  text: и зеркала[a], и льняные одежды, и тюрбаны, и покрывала[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «таблички». Еврейское слово могло обозначать гладкие полированные предметы; в данном перечне предметов роскоши наиболее вероятны зеркала.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «шали», «накидки». Точный вид этой одежды неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְיֹנִים
  choice: зеркала
  rationale: В перечне предметов роскоши наиболее вероятно обозначение гладких полированных предметов, служивших зеркалами. Вариант «таблички» лексически возможен, но хуже соответствует контексту.
- source_word: סְּדִינִים
  choice: льняные одежды
  rationale: Слово обозначает изделия или одежды из тонкого льна; перевод сохраняет указание на материал, не уточняя без достаточных оснований покрой или назначение.
- source_word: צְּנִיפוֹת
  choice: тюрбаны
  rationale: Существительное обозначает головной убор, образованный обёрнутой вокруг головы тканью; «тюрбаны» — ясный и достаточно точный русский эквивалент.
- source_word: רְדִידִים
  choice: покрывала
  rationale: Вероятно, имеются в виду лёгкие верхние женские накидки или покрывала. Русское «покрывала» сохраняет неопределённость между вуалью и драпированной верхней одеждой.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением перечислительной структуры еврейского текста. Повтор союза «и» передаёт полисиндетон оригинала; названия предметов даны ясно, но без неоправданного уточнения их формы.
