  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָה֩ תַ֨חַת בֹּ֜שֶׂם מַ֣ק יִֽהְיֶ֗ה וְ/תַ֨חַת חֲגוֹרָ֤ה נִקְפָּה֙ וְ/תַ֨חַת מַעֲשֶׂ֤ה מִקְשֶׁה֙ קָרְחָ֔ה וְ/תַ֥חַת פְּתִיגִ֖יל מַחֲגֹ֣רֶת שָׂ֑ק כִּי תַ֖חַת יֹֽפִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/024.yaml
  text: 'And it shall be: instead of perfume[a], rottenness; and instead of a belt, a rope; and instead of well-set hair, baldness; and instead of a rich robe, a girding of sackcloth[c][b]; branding instead of beauty.'
translation:
  language: ru
  text: 'И будет: вместо благовония — гниль, вместо пояса — верёвка[a], вместо искусно уложенных волос — лысина[b], вместо роскошного одеяния — препоясание вретищем; клеймо вместо красоты[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шнур». Редкое еврейское слово может обозначать верёвку вместо украшенного пояса либо след от верёвки как знак унижения.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение трудно для понимания и может обозначать также искусную отделку или богато украшенную одежду; противопоставление лысине говорит в пользу искусно уложенных волос.
    reason: lexical_alternative
  - marker: c
    text: 'Заключительная фраза текстуально и лексически трудна. Её часто понимают как «клеймо вместо красоты»; возможен и более общий смысл: «вместо красоты — позор».'
    reason: textual_variant
lexical_decisions:
- source_word: בֹּשֶׂם
  choice: благовоние
  rationale: Слово обозначает ароматическое вещество, благовоние или бальзам; «благовоние» естественно передаёт как приятный запах, так и предмет роскоши.
- source_word: מַק
  choice: гниль
  rationale: Существительное означает гниение, разложение; конкретный образ сохранён без замены его следствием — зловонием.
- source_word: חֲגוֹרָה
  choice: пояс
  rationale: Общее обозначение того, чем опоясываются; «пояс» ясно и стилистически нейтрально.
- source_word: נִקְפָּה
  choice: верёвка
  rationale: Редкое слово, обычно понимаемое как верёвка или шнур; неопределённость отражена в сноске.
- source_word: מַעֲשֶׂה מִקְשֶׁה
  choice: искусно уложенные волосы
  rationale: Трудное выражение, вероятно, обозначает сложную причёску, поскольку ему противопоставлена лысина; перевод сохраняет наиболее вероятный контекстуальный смысл.
- source_word: קָרְחָה
  choice: лысина
  rationale: Прямое и понятное обозначение отсутствия волос, противопоставленное тщательно уложенным волосам.
- source_word: פְּתִיגִיל
  choice: роскошное одеяние
  rationale: Редкое слово обозначает дорогое или праздничное одеяние; «роскошное одеяние» передаёт богатство, не уточняя неизвестный покрой.
- source_word: מַחֲגֹרֶת שָׂק
  choice: препоясание вретищем
  rationale: Буквально речь идёт об опоясывании тканью для вретища; формулировка сохраняет образ траурного унижения вместо роскошной одежды.
- source_word: כִּי תַחַת יֹפִי
  choice: клеймо вместо красоты
  rationale: 'Конец строки текстуально и лексически труден: в традиционном согласном тексте ожидаемое существительное явно не выражено, однако контекст поддерживает образ обезображивающего клейма. Неопределённость отмечена в сноске.'
