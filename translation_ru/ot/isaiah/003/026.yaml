  text: And her gates will lament and mourn[a], and she will be stripped bare and sit on the ground.
translation:
  language: ru
  text: И будут стенать и скорбеть её ворота, и она, опустошённая[a], сядет на землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опустевшая»; возможно также: «оставленная пустой» или «обнажённая». Значение еврейского глагола не вполне определённо; он может обозначать опустошение или лишение всего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנ֥וּ
  choice: будут стенать
  rationale: Глагол אנה в контексте плача передаёт слышимое выражение горя; «стенать» естественно сочетается со следующим глаголом и сохраняет олицетворение ворот.
- source_word: וְאָבְל֖וּ
  choice: и скорбеть
  rationale: אבל обозначает скорбь и траур. «Скорбеть» сохраняет параллелизм со «стенать», не сливая значения двух глаголов.
- source_word: פְּתָחֶ֑י/הָ
  choice: её ворота
  rationale: В городском образе Иерусалима פתחים естественно означает ворота, а не просто входы или проёмы.
- source_word: וְנִקָּ֖תָה
  choice: опустошённая
  rationale: Нифаль от נקה здесь может передавать состояние того, что опустело, было лишено содержимого или осталось ни с чем. «Опустошённая» соответствует образу города, лишившегося людей и былого убранства, но неоднозначность отмечена в сноске.
- source_word: לָ/אָ֥רֶץ
  choice: на землю
  rationale: 'В сочетании с ישב выражение описывает конкретную позу унижения и скорби: сидеть на земле.'
- source_word: תֵּשֵֽׁב
  choice: сядет
  rationale: Хотя ישב может означать также «жить» или «оставаться», сочетание с «на землю» указывает на действие — сесть на землю.
theological_decisions:
- issue: К кому относится подлежащее женского рода в единственном числе
  choice: Олицетворённый Сион/Иерусалим, обозначенный местоимением «она»
  alternative: Обобщённый образ города в женском роде
  rationale: Контекст продолжает пророчество о дочерях Сиона и переходит к образу Иерусалима. Местоимение сохраняет олицетворение, не добавляя имени, которого нет в самом стихе.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим строем. Порядок слов сохраняет олицетворение ворот и завершает стих наглядным образом города, сидящего на земле.
