language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הַכָּרַ֤ת פְּנֵי/הֶם֙ עָ֣נְתָה בָּ֔/ם וְ/חַטָּאתָ֛/ם כִּ/סְדֹ֥ם הִגִּ֖ידוּ לֹ֣א כִחֵ֑דוּ א֣וֹי לְ/נַפְשָׁ֔/ם כִּֽי גָמְל֥וּ לָ/הֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/009.yaml
  text: The look on their faces testifies against them[a], and they proclaim their sin like Sodom; they do not hide it. Woe to themselves[c][b], for they have brought evil on themselves.
translation:
  language: ru
  text: Выражение их лиц свидетельствует против них[a]. О своём грехе они объявляют, как Содом, и не скрывают его[b]. Горе им самим[c], ибо они сами причинили себе зло!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вид их лиц свидетельствует против них». Еврейское выражение может указывать на заметный облик или выражение лица как свидетельство вины.'
    reason: lexical_alternative
  - marker: b
    text: Слова «как Содом» напоминают об открытом, не скрываемом нечестии; ср. Бытие 13:13; 19:5.
    reason: cross_reference
  - marker: c
    text: 'Буквально: «Горе их душе»; возможно также: «Горе им». Еврейское נֶפֶשׁ (не́феш) в зависимости от контекста может означать самого человека, его жизнь или душу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכָּרַת פְּנֵיהֶם
  choice: Выражение их лиц
  rationale: Сочетание, вероятнее всего, обозначает распознаваемый вид или выражение лица. Такой перевод естественен по-русски и согласуется с последующим образом свидетельства; менее вероятное значение, связанное с лицеприятием, в основной текст не внесено.
- source_word: עָנְתָה בָּם
  choice: свидетельствует против них
  rationale: 'Глагол ענה с предлогом ב здесь имеет судебный оттенок: видимые признаки становятся свидетельством против виновных.'
- source_word: וְחַטָּאתָם כִּסְדֹם הִגִּידוּ
  choice: Они объявляют о своём грехе, как Содом
  rationale: Глагол נגד в породе хифиль означает «сообщать, объявлять, делать известным». Сравнение с Содомом сохранено кратким и прямым, без добавленного истолкования.
- source_word: לֹא כִחֵדוּ
  choice: и не скрывают его
  rationale: כחד означает «скрывать, утаивать»; местоимение «его» ясно отсылает к греху и естественно связывает части русского предложения.
- source_word: אוֹי לְנַפְשָׁם
  choice: Горе им самим
  rationale: נפש здесь обозначает самих людей, их собственную жизнь или личность, а не обязательно нематериальную «душу». Рефлексивное «им самим» сохраняет направленность бедствия на них же.
- source_word: כִּי גָמְלוּ לָהֶם רָעָה
  choice: ведь они навлекли на себя зло
  rationale: גמל может означать «обходиться, воздавать, причинять», а רעה — «зло» или «бедствие». Перевод передаёт мысль о зле, обратившемся на самих совершающих его, не уточняя сверх текста механизм воздаяния.
theological_decisions:
- issue: Значение נֶפֶשׁ в לְנַפְשָׁם
  choice: «им самим» — речь о людях как таковых
  alternative: «их душе» или «их жизни»
  rationale: В библейском иврите נפש часто обозначает человека, личность или жизнь. Основной перевод не вводит более узкое представление о душе, которого контекст не требует.
- issue: Характер зла в заключительной части
  choice: Зло представлено как навлечённое ими на самих себя
  alternative: Явно обозначить Божье возмездие либо только естественное общественное последствие
  rationale: Стих утверждает, что они причинили или навлекли зло на себя, но не объясняет здесь, каким именно образом наступает воздаяние. Эта недосказанность сохранена.
- issue: Сравнение с Содомом
  choice: Сохранено прямое «как Содом»
  alternative: Развернуть как «подобно жителям Содома, они бесстыдно выставляют грех напоказ»
  rationale: Аллюзия указывает на явный, не скрываемый грех, однако основной текст не должен подменять краткий пророческий образ его толкованием.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Судебный оттенок слова «свидетельствует» и резкость возгласа «Горе» сохранены; неоднозначность נֶפֶשׁ и заключительного образа самообращённого зла пояснена без конфессионального уточнения.
