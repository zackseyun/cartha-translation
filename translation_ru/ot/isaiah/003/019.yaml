  text: the pendants[a], the armlets, and the veils.
translation:
  language: ru
  text: подвески, браслеты[a] и вуали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «цепочки», или «ножные браслеты»; точный вид украшения, обозначенного еврейским словом, неизвестен.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּטִיפוֹת
  choice: подвески
  rationale: Существительное связано с образом свисающей «капли» и, вероятно, обозначает подвесные украшения; «подвески» передаёт этот смысл, не уточняя без достаточных оснований, были ли это серьги.
- source_word: הַשֵּׁירוֹת
  choice: браслеты
  rationale: Редкое слово обозначает украшение, но его точный вид неизвестен. «Браслеты» естественно звучит в перечне женских украшений; возможность перевода «цепочки» или «ножные браслеты» отмечена в сноске.
- source_word: הָרְעָלוֹת
  choice: вуали
  rationale: Слово обозначает предмет одежды, закрывающий или окутывающий голову либо лицо. «Вуали» кратко и ясно передаёт наиболее вероятное значение в перечне нарядов.
theological_decisions: []
translation_notes:
  register: Краткий именной перечень сохранён без добавления глагола. Выбраны современные, общеупотребительные названия украшений и предметов одежды; сноска поставлена непосредственно после слова, к которому относится лексическая неопределённость.
