id: ISA.3.12
reference: Isaiah 3:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַמִּ/י֙ נֹגְשָׂ֣י/ו מְעוֹלֵ֔ל וְ/נָשִׁ֖ים מָ֣שְׁלוּ ב֑/וֹ עַמִּ/י֙ מְאַשְּׁרֶ֣י/ךָ מַתְעִ֔ים וְ/דֶ֥רֶךְ אֹֽרְחֹתֶ֖י/ךָ בִּלֵּֽעוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/012.yaml
  text: My people—his oppressors are children[a], and women rule over him. My people[b], your guides lead you astray and swallow up the course of your paths.
translation:
  language: ru
  text: Народ Мой! Его притеснители — дети, и женщины правят им. Народ Мой! Твои вожди[a] вводят тебя в заблуждение и поглощают путь твоих стезей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «называющие тебя блаженным». Еврейская форма допускает такое значение, однако в данном контексте, вероятнее всего, речь идёт о вождях или наставниках, сбивающих народ с пути.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «путь твоих стезей они поглотили» — яркий образ уничтожения верного пути народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשָׂיו
  choice: его притеснители
  rationale: Передаёт значение נגשׂ — тех, кто угнетает и понуждает; местоимение мужского рода сохраняет собирательное единственное число עַם («народ»).
- source_word: מְעוֹלֵל
  choice: дети
  rationale: Трудная форма в данном контексте, вероятнее всего, характеризует притеснителей как детей — незрелых и неспособных правителей, не заменяя образ толкованием «неразумные».
- source_word: וְנָשִׁים מָשְׁלוּ בוֹ
  choice: и женщины правят им
  rationale: Прямо передаёт נָשִׁים и конструкцию משל с ב; «им» относится к народу как к собирательному существительному мужского рода.
- source_word: מְאַשְּׁרֶיךָ
  choice: твои вожди
  rationale: В параллели с מַתְעִים слово обозначает тех, кто направляет народ; реальная возможность значения «называющие тебя блаженным» сохранена в сноске.
- source_word: מַתְעִים
  choice: вводят тебя в заблуждение
  rationale: Передаёт каузативное значение תעה — заставлять блуждать, сбивать с верного пути.
- source_word: דֶרֶךְ אֹרְחֹתֶיךָ
  choice: путь твоих стезей
  rationale: Сохраняет удвоенный образ дороги в сочетании דֶרֶךְ и אֹרְחוֹת, не сводя его к одному слову.
- source_word: בִּלֵּעוּ
  choice: поглощают
  rationale: Сохраняет яркую метафору בלע — «глотать, поглощать», подразумевающую уничтожение или стирание верного пути.
theological_decisions:
- issue: Упоминание женщин как правителей в пророческом образе общественного расстройства
  choice: Сохранено буквальное «женщины правят им» без расширительного богословского комментария.
  alternative: Обобщить как «слабые правят им» либо принять текстовую реконструкцию «заимодавцы правят им».
  rationale: Масоретский текст прямо содержит נָשִׁים, «женщины». Перевод сохраняет риторику конкретного места, но не превращает её в общее учение о женщинах.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «Народ Мой!» и собирательное мужское единственное число сохранены; метафора поглощённого пути оставлена без рационализирующего упрощения.
