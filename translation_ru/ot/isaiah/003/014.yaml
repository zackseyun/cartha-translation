source:
  edition: WLC
  text: יְהוָה֙ בְּ/מִשְׁפָּ֣ט יָב֔וֹא עִם זִקְנֵ֥י עַמּ֖/וֹ וְ/שָׂרָ֑י/ו וְ/אַתֶּם֙ בִּֽעַרְתֶּ֣ם הַ/כֶּ֔רֶם גְּזֵלַ֥ת הֶֽ/עָנִ֖י בְּ/בָתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/014.yaml
  text: 'Yahweh enters into judgment with the elders of his people and its princes: “It is you who have devoured the vineyard[d][c][b][a]; the plunder of the poor is in your houses.”'
translation:
  language: ru
  text: 'Яхве вступает в суд[a] со старейшинами Своего народа и его правителями:


    «Именно вы опустошили виноградник[b][c]; награбленное у бедняка[d] — в ваших домах».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «приходит на суд» или «приходит судить».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может также означать «истребили», «поглотили» или «сожгли»; здесь он выражает разрушительное опустошение.
    reason: lexical_alternative
  - marker: c
    text: Виноградник, вероятно, служит образом народа или общины; ср. образ виноградника в Ис. 5:1–7.
    reason: cross_reference
  - marker: d
    text: 'Буквально: «награбленное у бедного»; возможный перевод: «добыча, отнятая у бедняка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога принятой в современном русском языке транслитерацией, не заменяя его титулом.
- source_word: בְּמִשְׁפָּט יָבוֹא
  choice: вступает в суд
  rationale: Сочетание выражает начало судебного разбирательства; настоящее время сохраняет пророческую наглядность еврейского имперфекта.
- source_word: עִם
  choice: со
  rationale: Сохраняет основное значение предлога «с/со»; состязательный характер судебной сцены раскрывается контекстом.
- source_word: זִקְנֵי עַמּוֹ וְשָׂרָיו
  choice: со старейшинами Своего народа и его правителями
  rationale: «Старейшины» обозначает признанных руководителей, а «правители» естественно передаёт שׂרים без излишне узкого монархического оттенка слова «князья».
- source_word: וְאַתֶּם
  choice: Именно вы
  rationale: Самостоятельное местоимение имеет обвинительное эмфатическое значение.
- source_word: בִּעַרְתֶּם
  choice: опустошили
  rationale: Глагол обозначает разрушительное истребление или поглощение; «опустошили» естественно сочетается с образом виноградника и не ограничивает смысл буквальным сожжением.
- source_word: הַכֶּרֶם
  choice: виноградник
  rationale: Сохраняет конкретный пророческий образ, не подменяя его толкованием.
- source_word: גְּזֵלַת הֶעָנִי
  choice: награбленное у бедных
  rationale: Передаёт не просто абстрактный «грабёж», а имущество, отнятое у социально уязвимых людей; собирательное единственное число естественно выражено русским множественным.
- source_word: בְּבָתֵּיכֶם
  choice: в ваших домах
  rationale: Точно сохраняет множественное число и указывает на жилища руководителей как место хранения неправедно приобретённого.
theological_decisions:
- issue: Образ виноградника
  choice: Сохранить «виноградник» без поясняющей замены в основном тексте.
  alternative: Передать как «народ» или «община».
  rationale: Метафора перекликается с другими образами виноградника у Исаии, но сам стих прямо не отождествляет виноградник с конкретным референтом.
- issue: Судебный оттенок עִם
  choice: Передать предлог буквально как «со».
  alternative: Перевести «против».
  rationale: Хотя сцена явно обвинительная, исходный предлог означает «с»; перевод не должен делать его более однозначно враждебным, чем еврейский текст.
- issue: Референт местоименного суффикса в וְשָׂרָיו
  choice: 'Передать правителей как принадлежащих народу: «его правителями».'
  alternative: «Его [Яхве] правителями» или формально «Его князьями».
  rationale: По смыслу это руководители народа, вызванные на суд вместе со старейшинами; русская формулировка ясно передаёт эту связь, не предполагая, что они правят самим Яхве.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Судебная образность и резкость обвинения сохранены; синтаксис сделан естественным для публичного чтения.
