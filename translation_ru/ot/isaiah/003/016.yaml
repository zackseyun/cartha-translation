  source_fidelity: В целом переданы причинная конструкция, образ «дочерей Сиона», надменная поза, подчеркнуто мелкая походка и звуковой эффект при ходьбе. Однако «строят глазки» чрезмерно разговорно и сужает редкое, спорное מְשַׂקְּרוֹת עֵינָיִם до однозначно кокетливого смысла. «Позвякивают ногами» формально близко, но по-русски может звучать так, будто звенят сами ноги; деепричастная форма естественнее передаёт сопровождающий ходьбу звук, не называя прямо украшений.
  naturalness: «Играют глазами» — литературный и понятный современный оборот, сохраняющий образ глазных движений без просторечной окраски. «Выступают, семеня» естественно передаёт нарочито мелкую походку. «Позвякивая ногами» намеренно сохраняет несколько необычный образ оригинала, но синтаксически связывает звук с походкой лучше, чем личная форма «позвякивают ногами».
  terminology: '«Яхве» верно передаёт יהוה в соответствии с проектным решением. «Дочери Сиона» сохраняет образный библейский оборот. Сноски закреплены за действительно спорными выражениями: a — движениями глаз, b — звоном, вероятно связанным с украшениями на щиколотках. Это также исправляет несоответствие привязок в английском аудиторском следе, где маркеры сносок, по-видимому, переставлены.'
