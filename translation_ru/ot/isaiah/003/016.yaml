  text: וַ/יֹּ֣אמֶר יְהוָ֗ה יַ֚עַן כִּ֤י גָֽבְהוּ֙ בְּנ֣וֹת צִיּ֔וֹן וַ/תֵּלַ֨כְנָה֙ נטוות גָּר֔וֹן וּֽ/מְשַׂקְּר֖וֹת עֵינָ֑יִם הָל֤וֹךְ וְ/טָפֹף֙ תֵּלַ֔כְנָה וּ/בְ/רַגְלֵי/הֶ֖ם תְּעַכַּֽסְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/016.yaml
  text: 'And Yahweh said: Because the daughters of Zion are haughty[a], and walk with outstretched necks, glancing with their eyes, walking and mincing as they go, and making a jingling with their feet[b],'
translation:
  language: ru
  text: 'И сказал Яхве: «За то, что дочери Сиона возгордились, ходят, вытянув шею, и играют глазами[a], выступают, семеня, и позвякивают ногами[b], —»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бросают соблазняющие взгляды». Еврейское выражение встречается редко и может обозначать кокетливые, соблазняющие или лукавые движения глаз.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заставляют ножные браслеты звенеть». Глагол, вероятно, указывает на звон украшений на щиколотках, хотя сами браслеты в этом стихе прямо не названы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: יַעַן כִּי
  choice: за то, что
  rationale: Естественно вводит причину последующего суда и сохраняет причинное значение сочетания.
- source_word: גָבְהוּ
  choice: возгордились
  rationale: В контексте глагол, буквально связанный с высотой, обозначает надменность; совершенный вид также допускает оттенок наступившего состояния.
- source_word: בְּנוֹת צִיּוֹן
  choice: дочери Сиона
  rationale: Сохраняет традиционный и образный оборот исходного текста, не сводя его просто к женщинам Иерусалима.
- source_word: נטוות גָּרוֹן
  choice: вытянув шею
  rationale: Передаёт нарочито горделивую позу близким и естественным русским выражением.
- source_word: מְשַׂקְּרוֹת עֵינָיִם
  choice: строят глазки
  rationale: Редкое выражение, вероятно, описывает кокетливые либо соблазняющие движения глаз; разговорность оборота умерена и понятна современному читателю, а неопределённость отмечена в сноске.
- source_word: הָלוֹךְ וְטָפֹף תֵּלַכְנָה
  choice: выступают мелкими, жеманными шагами
  rationale: Передаёт короткую, нарочитую походку и повторный характер движения без тяжеловесного буквального воспроизведения конструкции.
- source_word: וּבְרַגְלֵיהֶם תְּעַכַּסְנָה
  choice: позвякивают ногами
  rationale: Сохраняет звуковой эффект глагола, не добавляя прямо не названные в стихе ножные украшения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в еврейском тексте, и не подменяет его титулом.
- issue: Характер движения глаз
  choice: строят глазки
  alternative: поглядывают; бросают соблазняющие взгляды
  rationale: Выбрано вероятное контекстуальное значение, но ввиду редкости еврейского выражения его неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис оставлен незавершённым тире, поскольку причинная придаточная конструкция продолжается вынесением приговора в следующем стихе. Маркеры сносок размещены непосредственно после спорных выражений.
