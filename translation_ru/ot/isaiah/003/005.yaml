lexical_decisions:
- source_word: וְנִגַּשׂ
  choice: будет притеснять
  rationale: Нифаль глагола נגשׂ в данном контексте передаёт взаимное враждебное давление и угнетение внутри общества; «притеснять» естественно выражает этот смысл.
- source_word: הָעָם
  choice: народ
  rationale: Собирательное обозначение общества в целом; «народ» соответствует контексту и литературному регистру.
- source_word: אִישׁ בְּאִישׁ וְאִישׁ בְּרֵעֵהוּ
  choice: друг друга — человек человека, каждый своего ближнего
  rationale: Перевод сохраняет взаимность и усиление посредством двух распределительных оборотов, не сглаживая повтор исходного текста.
- source_word: יִרְהֲבוּ
  choice: будет дерзить
  rationale: Глагол выражает надменное, вызывающее поведение; «дерзить» кратко и естественно передаёт непочтительность к старшему.
- source_word: הַנַּעַר
  choice: юноша
  rationale: В противопоставлении старцу слово обозначает молодого человека как представителя младшего поколения.
- source_word: בַּזָּקֵן
  choice: старцу
  rationale: זָקֵן может указывать как на преклонный возраст, так и на общественное старшинство; «старец» сохраняет обе ассоциации в библейском литературном регистре.
- source_word: הַנִּקְלֶה
  choice: презираемый
  rationale: Причастная форма обозначает человека, которого считают ничтожным или низким; «презираемый» ясно противопоставлено «почитаемому».
- source_word: בַּנִּכְבָּד
  choice: почитаемому
  rationale: Форма от כבד обозначает человека, пользующегося весом и уважением; «почитаемый» точно передаёт социальную оценку.
theological_decisions:
- issue: 'Значение זָקֵן: возраст или общественное положение'
  choice: старцу
  alternative: старейшине; пожилому человеку
  rationale: Контекст допускает одновременно возрастное и статусное прочтение. Основной текст не сводит слово исключительно к должности, а примечание сохраняет неоднозначность.
translation_notes:
