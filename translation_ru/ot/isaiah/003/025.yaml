base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/025.yaml
  text: Your men will fall by the sword[a], and your mighty men in battle.
translation:
  language: ru
  text: Твои мужчины падут от меча, и твоя сила — в бою.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְתַיִךְ
  choice: мужчины твои
  rationale: 'Поэтическое מְתַיִךְ здесь обозначает мужчин, а не мёртвых: глагол «падут» лишь далее сообщает об их гибели. В контексте обращения к Сиону речь, вероятно, о мужском населении, прежде всего способном сражаться.'
- source_word: בַּחֶרֶב
  choice: от меча
  rationale: Предлог ב с существительным «меч» выражает средство или причину гибели. Русское устойчивое выражение «пасть от меча» естественно передаёт военный образ.
- source_word: יִפֹּלוּ
  choice: падут
  rationale: Имперфект Qal 3-го лица множественного числа в пророческом высказывании указывает на предстоящий исход. «Падут» сохраняет библейский и общеупотребительный образ гибели в бою.
- source_word: וּגְבוּרָתֵךְ
  choice: воины твои
  rationale: Хотя גְּבוּרָה обычно означает «сила, мощь», форма с суффиксом в параллелизме с «мужчины твои» метонимически обозначает сильных людей, то есть воинов. Такое прочтение поддерживается продолжением «в сражении».
- source_word: בַּמִּלְחָמָה
  choice: в сражении
  rationale: מִלְחָמָה может означать как войну, так и конкретное сражение. Здесь «в сражении» естественно дополняет параллельное «падут от меча».
theological_decisions:
- issue: К кому относятся суффиксы женского рода 2-го лица единственного числа
  choice: Сохранено прямое обращение к олицетворённому Сиону/Иерусалиму без добавления имени в текст стиха.
  alternative: Обращение к дочерям Сиона как к собирательной группе.
  rationale: Ближайший контекст представляет Сион/Иерусалим в образе женщины; формы «твои» сохраняют это обращение, не устраняя возможный собирательный оттенок.
- issue: Значение וּגְבוּרָתֵךְ
  choice: 'Личное, метонимическое значение: «воины твои».'
  alternative: 'Абстрактное значение: «твоя сила».'
  rationale: Параллелизм с «мужчины твои» и обстоятельство «в сражении» делают личное значение наиболее вероятным, хотя слово сохраняет смысловую связь с силой и доблестью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Инверсия «мужчины твои» и форма «падут» сохраняют поэтический параллелизм; тире во второй строке ясно обозначает подразумеваемый повтор глагола «падут».
