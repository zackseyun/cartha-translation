  text: Say of the righteous that it will be well[a], for they will eat the fruit of their deeds.
translation:
  language: ru
  text: 'Скажите о праведнике: «Благо ему, потому что они будут есть плоды своих дел».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Скажите о праведнике, что это хорошо, потому что они будут есть плоды своих дел». Еврейский текст начинает с единственного числа («праведник»), а затем переходит к множественному: «они… своих дел».'
    reason: Лексическая альтернатива и сохранение перехода в грамматическом числе.
lexical_decisions:
- source_word: אִמְרוּ
  choice: Скажите
  rationale: Повелительная форма множественного числа от אמר; «скажите» прямо и естественно передаёт краткий призыв произнести или объявить.
- source_word: צַדִּיק
  choice: о праведнике
  rationale: Субстантивированное прилагательное в единственном числе обозначает представителя класса; «праведник» сохраняет грамматическое число и нравственный смысл.
- source_word: כִּי טוֹב
  choice: «Благо ему»
  rationale: Первое כִּי вводит содержание высказывания, а טוֹב выражает благополучный удел праведника. Добавленное «ему» делает краткую еврейскую конструкцию естественной по-русски, не превращая её в предсказание сверх выраженного исходным текстом.
- source_word: כִּי
  choice: потому что
  rationale: Второе כִּי имеет причинное значение и объясняет, почему праведнику благо.
- source_word: פְרִי
  choice: плоды
  rationale: Сохраняется образ плода как результата и воздаяния; множественное число естественно сочетается по-русски с множественным «дел».
- source_word: מַעַלְלֵיהֶם
  choice: своих дел
  rationale: Форма означает «их деяний/дел»; возвратное «своих» естественно связывает дела с подлежащим «они» и сохраняет нравственную окраску.
- source_word: יֹאכֵלוּ
  choice: они будут есть
  rationale: Буквально сохраняется форма будущего времени множественного числа и метафора вкушения последствий собственных поступков.
theological_decisions:
- issue: Переход от единственного числа к множественному
  choice: Сохранить «праведнике» в единственном числе, а в заключительной части — «они будут есть… своих дел».
  alternative: 'Согласовать всё в единственном числе: «он будет есть плод своих дел».'
  rationale: Масоретский текст начинает с единственного צַדִּיק, но затем использует суффикс и глагол множественного числа. Сохранение этого перехода передаёт собирательное применение и не устраняет подлинную грамматическую напряжённость текста.
- issue: Временной оттенок טוֹב
  choice: Передать как «Благо ему».
  alternative: «Ему будет хорошо» или формально «это хорошо».
  rationale: Само טוֹב не маркирует будущего времени. Именная формула «Благо ему» сохраняет лаконичность и допускает как оценку состояния, так и указание на благой удел, который поясняется следующей причинной фразой.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским звучанием. Формула «Благо ему» понятна и достойна по регистру; необычный переход числа намеренно сохранён и пояснён в сноске.
