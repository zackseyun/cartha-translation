lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Обычная пророческая формула времени; естественно звучит по-русски и сохраняет торжественный регистр.
- source_word: יָסִיר
  choice: отнимет
  rationale: Каузативная форма глагола סור означает устранение или лишение; в контексте суда речь идёт о том, что украшения будут отняты.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: В оригинале стоит божественный титул Адонай, а не тетраграмматон; «Владыка» передаёт титул и сохраняет отличие от имени Бога.
- source_word: תִּפְאֶרֶת
  choice: нарядные украшения
  rationale: Существительное обозначает красоту, великолепие или убранство. В перечне предметов наряда естественный русский перевод передаёт это значение определением «нарядные» при обобщающем слове «украшения».
- source_word: הָעֲכָסִים
  choice: ножные браслеты
  rationale: Речь идёт об украшениях, носимых на щиколотках; это ясный современный русский эквивалент.
- source_word: הַשְּׁבִיסִים
  choice: головные повязки
  rationale: Точный вид предмета не установлен; это осторожный и понятный перевод предполагаемого головного украшения, а неопределённость отмечена в сноске.
- source_word: הַשַּׂהֲרֹנִים
  choice: подвески в виде полумесяца
  rationale: Слово связано с обозначением луны или полумесяца и называет украшения такой формы; «подвески» естественно передаёт ювелирный предмет, не утверждая, что это непременно ожерелье.
