  text: the headdresses[a], the ankle chains, the sashes, the perfume boxes[b], and the amulets.
translation:
  language: ru
  text: нарядные головные уборы, цепочки на щиколотках, пояса, сосуды для благовоний[a] и амулеты[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «домики души (или жизни)»; вероятно, небольшие сосуды с благовониями или ароматическими веществами.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обереги». Еврейское слово связано с шёпотом или заклинанием и, вероятно, обозначает амулеты, которым приписывалась магическая сила.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּאֵרִים
  choice: нарядные головные уборы
  rationale: Множественное число פְּאֵרִים обозначает нарядное убранство головы. Такой перевод достаточно конкретен, но не сужает значение до тюрбанов.
- source_word: הַצְּעָדוֹת
  choice: цепочки на щиколотках
  rationale: Слово связано с шаганием и в перечне украшений, вероятно, обозначает ножные украшения, возможно цепочки; перевод передаёт наиболее вероятный предметный смысл.
- source_word: הַקִּשֻּׁרִים
  choice: пояса
  rationale: Производное от корня со значением связывания, вероятно, называет декоративные предметы одежды для опоясывания. «Пояса» естественно звучит по-русски и не архаично.
- source_word: בָּתֵּי הַנֶּפֶשׁ
  choice: сосуды для благовоний
  rationale: Буквально выражение означает «домики души/жизни», но в контексте носимых украшений, вероятнее всего, называет небольшие вместилища для ароматических веществ. Слово «сосуды» не навязывает конкретную форму предмета.
- source_word: הַלְּחָשִׁים
  choice: амулеты
  rationale: Существительное связано с шёпотом или заклинанием, однако в перечне снимаемых предметов естественнее понимать его как материальные обереги, связанные с заклинаниями.
theological_decisions:
- issue: Магическая окраска הַלְּחָשִׁים
  choice: В основном тексте — «амулеты», а связь с заклинаниями отмечена в сноске.
  alternative: заклинания; обереги
  rationale: Контекст перечисляет материальные предметы убранства, поэтому предметное значение предпочтительно, но сноска сохраняет заложенную в еврейском слове связь с шёпотом и заклинаниями.
translation_notes:
  register: Современный литературный русский язык; перечень сохранён как именная последовательность, продолжающая окружающий синтаксический контекст. Формулировки конкретны и понятны, а неясность двух редких еврейских выражений вынесена в сноски.
