  text: начальника над пятьюдесятью, и человека высокого положения, и советника, и искусного мастера, и знатока заклинаний[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искусного заклинателя». Еврейское выражение означает сведущего в шёпоте, заговорах или заклинаниях; вероятно, речь идёт о человеке, умеющем произносить шёпотом заговоры или заклинания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר חֲמִשִּׁים
  choice: начальника над пятьюдесятью
  rationale: שַׂר обозначает начальника или военачальника, а сочетание с חֲמִשִּׁים — должностное лицо, поставленное над пятьюдесятью людьми. Развёрнутая форма ясна современному читателю и сохраняет числовую конструкцию оригинала.
- source_word: נְשׂוּא פָנִים
  choice: знатного человека
  rationale: Буквально «возвышенного лицом»; это идиома, обозначающая человека, пользующегося почётом и занимающего высокое общественное положение. «Знатный человек» естественно передаёт личное и социальное значение выражения.
- source_word: יוֹעֵץ
  choice: советника
  rationale: Причастная форма называет того, кто даёт совет; «советник» прямо и естественно передаёт эту общественную роль.
- source_word: חֲכַם חֲרָשִׁים
  choice: искусного мастера
  rationale: חֲכַם здесь указывает на умение и опытность, а חֲרָשִׁים — на ремесленников или мастеров. Перевод передаёт практическое мастерство, а не только отвлечённую мудрость.
- source_word: נְבוֹן לָחַשׁ
  choice: знатока заклинаний
  rationale: נְבוֹן выражает понимание и опытность, а לָחַשׁ может обозначать шёпот, заговор или заклинание. Формулировка кратко передаёт вероятный ритуально-магический смысл, не добавляя оценки этой практики.
theological_decisions:
- issue: Передача выражения, связанного с магической практикой
  choice: знатока заклинаний
  alternative: искусного заклинателя; понимающего шёпот заговоров
  rationale: Еврейское выражение, вероятнее всего, обозначает человека, сведущего в произносимых шёпотом заговорах или заклинаниях. Основной текст сохраняет этот смысл, не смягчая его до красноречия или убеждения и не приписывая автору явного одобрения либо осуждения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого перечня. Повтор союза «и» сохранён, чтобы передать накопительную структуру еврейского текста. Форма «начальник над пятьюдесятью» предпочтена архаичному «пятидесятник» ради понятности обычному читателю.
