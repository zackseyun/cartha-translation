lexical_decisions:
- source_word: הַטַּבָּעוֹת
  choice: перстни
  rationale: טַבַּעַת обозначает кольцо; в перечне женских украшений русское «перстни» естественно передаёт украшения для пальцев и позволяет отличить их от следующих колец для носа. Возможное значение «кольца-печатки» не следует без необходимости вносить в основной текст.
- source_word: וְנִזְמֵי הָאָף
  choice: и кольца для носа
  rationale: נֶזֶם — кольцо или украшение, а сочетание с אַף прямо указывает на нос. «Кольца для носа» — ясная и современная русская формулировка.
- source_word: הָאָף
  choice: носа
  rationale: Здесь אַף употреблено в прямом анатомическом значении «нос»; вариант «ноздри» был бы неоправданно узким.
