  yaml_path: translation/ot/isaiah/003/007.yaml
  text: On that day he will cry out[a], saying, “I will not be a healer, for in my house there is no bread and there is no cloak[b]; you must not make me leader of the people.”
translation:
  language: ru
  text: 'В тот день он поднимет голос и скажет[a]: «Не стану я целителем[b]: у меня в доме нет ни хлеба, ни одежды. Не ставьте меня правителем народа[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимет [голос] и скажет»; возможный смысл: «решительно заявит».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тем, кто перевязывает раны».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «начальником народа», «руководителем народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: громко скажет
  rationale: Буквально глагол означает «поднимать, возносить», но в сочетании с последующей речью передаёт поднятие голоса или решительное публичное заявление. «Громко скажет» естественно выражает этот смысл, не превращая его в нейтральное «ответит».
- source_word: חֹבֵשׁ
  choice: целителем
  rationale: Причастие от חבש буквально обозначает того, кто перевязывает раны; здесь этот образ переносится на человека, способного исправить бедственное положение общества. «Целитель» сохраняет метафору, тогда как «правитель» чрезмерно истолковывает её.
- source_word: לֶחֶם
  choice: хлеба
  rationale: Сохранён конкретный основной смысл слова; хлеб может представлять пищу вообще, но вместе с одеждой здесь обозначает элементарные жизненные средства.
- source_word: שִׂמְלָה
  choice: одежды
  rationale: Слово обозначает одежду, часто верхнюю одежду или накидку. Обобщённое «одежда» в данном контексте естественно по-русски и не вводит излишне точный вид предмета.
- source_word: תְשִׂימֻנִי
  choice: не ставьте меня
  rationale: Форма означает «не ставьте, не назначайте меня». Выбор сохраняет прямой образ еврейского глагола и ясно передаёт отказ принять должность.
- source_word: קְצִין עָם
  choice: правителем народа
  rationale: קְצִין обозначает начальника, руководителя или должностное лицо. «Правитель народа» естественно передаёт общественно-властную роль, не приписывая ей специально военного характера.
