  text: כִּ֤י כָשְׁלָה֙ יְר֣וּשָׁלִַ֔ם וִ/יהוּדָ֖ה נָפָ֑ל כִּֽי לְשׁוֹנָ֤/ם וּ/מַֽעַלְלֵי/הֶם֙ אֶל יְהוָ֔ה לַ/מְר֖וֹת עֵנֵ֥י כְבוֹדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/008.yaml
  text: For Jerusalem has stumbled[a], and Judah has fallen, because their tongue and their deeds are against Yahweh, rebelling before the eyes of his glory.
translation:
  language: ru
  text: Ибо Иерусалим споткнулся, и Иуда пал, потому что их язык и их дела — против Яхве, чтобы оскорблять очи славы Его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы раздражать (оскорблять) очи славы Его». Необычное выражение «очи славы Его» может обозначать открытое оскорбление перед Его славным присутствием.'
    reason: Сохраняет образ оригинала и отмечает возможное понимание выражения, не называя неточный вариант буквальным переводом.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Первое כִּי вводит объяснение предшествующего суда; «ибо» естественно передаёт пояснительную связь и сохраняет торжественный тон.
- source_word: כָשְׁלָה
  choice: споткнулся
  rationale: Сохраняет конкретный образ преткновения и не усиливает его до полного разрушения.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Общепринятая русская форма названия города.
- source_word: וִיהוּדָה נָפָל
  choice: и Иуда пал
  rationale: Прямо передаёт поэтический параллелизм со словами «Иерусалим споткнулся»; «Иуда» здесь обозначает народ и землю.
- source_word: כִּי
  choice: потому что
  rationale: Второе כִּי вводит причину падения и потому передано явной причинной конструкцией.
- source_word: לְשׁוֹנָם
  choice: их язык
  rationale: Сохранён конкретный еврейский образ языка как обозначения речи, а не заменён более отвлечённым словом «слова».
- source_word: וּמַעַלְלֵיהֶם
  choice: и их дела
  rationale: «Дела» кратко и естественно передаёт поступки и сохраняет нравственный вес выражения.
- source_word: אֶל יְהוָה
  choice: против Яхве
  rationale: В контексте непокорности предлог אֶל обозначает направленность враждебных слов и дел против Бога; личное имя יהוה передано как «Яхве».
- source_word: לַמְרוֹת
  choice: они восстают
  rationale: Передаёт активное, продолжающееся неповиновение. Отдельное личное предложение по-русски яснее связывает действие с жителями Иерусалима и Иуды, не превращая язык и дела в буквальных действующих лиц.
- source_word: עֵינֵי כְבוֹדוֹ
  choice: пред очами Его славы
  rationale: Близко сохраняет необычный буквальный образ «очи Его славы» и вместе с тем употребляет понятную русскую конструкцию «пред очами».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: Связь לַמְרוֹת с עֵינֵי כְבוֹדוֹ
  choice: восстают пред очами Его славы
  alternative: противятся очам Его славы
  rationale: Еврейское выражение допускает понимание неповиновения, совершаемого перед Божьим славным присутствием, а также более жёсткую синтаксическую связь «противиться очам». Основной текст сохраняет образ и даёт естественный русский смысл, а альтернативная связь отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Слова «ибо», «пал» и «пред очами» поддерживают поэтический регистр, оставаясь понятными; синтаксис не перегружен архаизмами.
