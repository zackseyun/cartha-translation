base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/006.yaml
  text: 'For a man will seize his brother in his father''s house: “You have a cloak[a]; you shall be our leader[b], and this ruin shall be under your hand.”'
translation:
  language: ru
  text: 'Ибо человек схватит своего брата в доме своего отца и скажет: «У тебя есть плащ — стань нашим главой, и пусть эта разруха[a] будет под твоей рукой[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это крушение»; буквальнее: «это преткновение».'
    reason: lexical_alternative
  - marker: b
    text: «Под твоей рукой» — еврейское выражение со значением «под твоей властью» или «на твоём попечении».
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит пояснение к предшествующему описанию общественного распада; «ибо» сохраняет причинно-пояснительную связь.
- source_word: יִתְפֹּשׂ
  choice: схватит
  rationale: Глагол обозначает решительное физическое удержание; «схватит» передаёт настойчивость и давление в этой сцене.
- source_word: אִישׁ
  choice: человек
  rationale: В данном обобщённом примере речь идёт об отдельном мужчине; русское «человек» естественно в конструкции «человек схватит своего брата» и не устраняет указание на мужской пол, выраженное словом «брата».
- source_word: בְּאָחִיו
  choice: своего брата
  rationale: Обычное значение אָח — «брат»; упоминание отцовского дома поддерживает прямой семейный смысл.
- source_word: בֵּית אָבִיו
  choice: в доме своего отца
  rationale: Сохранено конкретное указание на отцовский дом или семейное хозяйство без замены его более широким понятием рода.
- source_word: שִׂמְלָה
  choice: плащ
  rationale: Слово обозначает верхнюю одежду; конкретное «плащ» передаёт иронию контекста, где наличие приличной одежды становится признаком пригодности к руководству.
- source_word: לְכָה
  choice: у тебя есть
  rationale: Предлог с местоименным суффиксом выражает обладание; по-русски это естественно передаётся конструкцией «у тебя есть».
- source_word: קָצִין
  choice: глава
  rationale: Слово обозначает человека, облечённого властью. «Глава» звучит современно и допускает как руководство, так и ответственность, не придавая выражению исключительно военного смысла.
- source_word: תִּהְיֶה לָּנוּ
  choice: стань нашим главой
  rationale: Форма несовершенного вида в прямой речи имеет побудительно-назначающий смысл; русское «стань» естественно выражает требование принять руководство.
- source_word: הַמַּכְשֵׁלָה הַזֹּאת
  choice: эта разруха
  rationale: Буквально существительное связано с преткновением, но в контексте обозначает переживаемый обществом крах. «Разруха» ясно передаёт общественное бедствие, сохраняя его конкретную тяжесть.
- source_word: תַּחַת יָדֶךָ
  choice: под твоей рукой
  rationale: Сохранён образный еврейский оборот, обозначающий власть, ведение или ответственность; смысл пояснён в примечании.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Прямая речь введена словами «и скажет», подразумеваемыми еврейским синтаксисом, чтобы избежать резкого и неестественного перехода. Образ «под твоей рукой» сохранён, а его идиоматический смысл вынесен в примечание.
