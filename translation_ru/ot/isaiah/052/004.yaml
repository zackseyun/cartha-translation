base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/004.yaml
  text: 'For thus says the Lord GOD: My people went down at first to Egypt to sojourn there[b][a], and Assyria oppressed them without cause.'
translation:
  language: ru
  text: 'Ибо так говорит Владыка Яхве: «Вначале Мой народ сошёл в Египет, чтобы жить там пришельцем, а Ассирия угнетала его без причины[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни за что», «даром» либо «без платы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Передаёт составной божественный титул двумя различимыми наименованиями, избегая неестественного «Господь Господь» и сохраняя принятую в русском библейском стиле передачу имени יהוה как «Господь».
- source_word: יָרַד
  choice: сошёл
  rationale: Сохраняет обычный древнееврейский образ движения «вниз» в Египет и естественно звучит по-русски.
- source_word: בָרִאשֹׁנָה
  choice: вначале
  rationale: Обозначает более ранний исторический эпизод и сохраняет временное сопоставление с последующим угнетением Ассирией.
- source_word: לָגוּר
  choice: чтобы пожить там как пришелец
  rationale: Глагол גור означает проживание вне своей земли в положении пришельца; перевод сохраняет и временность, и статус чужеземца, оставаясь понятным современному читателю.
- source_word: אַשּׁוּר
  choice: Ассирия
  rationale: В данном контексте обозначает государство или народ, а не личное имя Ассур.
- source_word: בְּאֶפֶס
  choice: без причины
  rationale: Контекстуально выражает беспричинность и несправедливость угнетения; возможные значения «ни за что» и «без платы» отмечены в сноске.
- source_word: עֲשָׁקוֹ
  choice: угнетала его
  rationale: Сохраняет местоименный суффикс мужского рода единственного числа, который естественно согласуется с русским собирательным существительным «народ».
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве; Господь Бог
  rationale: Выбранная форма различает אֲדֹנָי и יהוה, не создаёт повтора «Господь Господь» и не вводит в основной текст транслитерацию там, где русский библейский регистр обычно употребляет «Господь».
- issue: Число дополнения при עֲשָׁקוֹ
  choice: угнетала его
  alternative: угнетала их
  rationale: Еврейский текст имеет суффикс 3-го лица мужского рода единственного числа. Русское «народ» также является существительным мужского рода единственного числа, поэтому исходная форма сохраняется без ущерба для естественности.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, но понятным библейским регистром. Форма «пожить там как пришелец» раскрывает значение גור без устаревшего «странствовать»; кавычки ясно отмечают прямую речь Бога.
