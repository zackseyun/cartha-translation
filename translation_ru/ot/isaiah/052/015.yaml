base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/015.yaml
  text: So he will sprinkle many nations; kings will shut their mouths because of him. For they will see what had not been told to them[a], and they will understand what they had not heard.
translation:
  language: ru
  text: Так он окропит[a] многие народы; цари закроют уста перед ним, потому что увидят то, о чём им не рассказывали, и поймут то, чего не слышали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приведёт в изумление многие народы». Еврейский глагол обычно понимается как «окропит», однако некоторые считают, что здесь он означает «приведёт в изумление».'
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  choice: Так
  rationale: 'Кратко передаёт связь-соответствие с предшествующим описанием в стихе 14: «как… так».'
- source_word: יַזֶּה
  choice: окропит
  rationale: Порода hифиль глагола נזה обычно означает «окроплять», особенно в обрядовом контексте. Значимая альтернативная трактовка «приведёт в изумление» сохранена в сноске.
- source_word: גּוֹיִם רַבִּים
  choice: многие народы
  rationale: Передаёт широкий международный смысл גּוֹיִם без более позднего конфессионального оттенка слова «язычники».
- source_word: עָלָיו יִקְפְּצוּ מְלָכִים פִּיהֶם
  choice: цари сомкнут перед ним уста
  rationale: Сохраняет конкретный образ изумлённого молчания; «сомкнут уста» звучит естественно и достойно в современном литературном русском.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит объяснение того, почему цари умолкнут.
- source_word: אֲשֶׁר לֹא סֻפַּר לָהֶם רָאוּ
  choice: увидят то, о чём им не рассказывали
  rationale: Передаёт контраст между отсутствием прежнего сообщения и последующим непосредственным восприятием, сохраняя пророческую перспективу будущего.
- source_word: וַאֲשֶׁר לֹא שָׁמְעוּ הִתְבּוֹנָנוּ
  choice: и поймут то, чего не слышали
  rationale: Глагол התבונן обозначает осмысленное постижение, а не простое восприятие слухом; «поймут» естественно выражает этот смысл.
theological_decisions:
- issue: Значение יַזֶּה в контексте Раба
  choice: окропит многие народы
  alternative: приведёт в изумление многие народы
  rationale: Обычное лексическое значение hифиля от נזה — «окроплять»; оно также допускает обрядово-очистительный образ, не требуя его догматического уточнения. Поскольку трактовка «приведёт в изумление» широко представлена и согласуется с реакцией царей, она отмечена как реальная альтернатива.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Выражение «сомкнут уста» сохраняет образность оригинала, оставаясь понятным современному читателю; синтаксис сделан плавным без устранения смысловой неоднозначности ключевого глагола.
