  variant: modern literary Russian
source:
  edition: WLC
  text: פִּצְח֤וּ רַנְּנוּ֙ יַחְדָּ֔ו חָרְב֖וֹת יְרוּשָׁלִָ֑ם כִּֽי נִחַ֤ם יְהוָה֙ עַמּ֔/וֹ גָּאַ֖ל יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/009.yaml
  text: Break forth[a], sing together, you ruins of Jerusalem, for Yahweh has comforted his people; he has redeemed Jerusalem.
translation:
  language: ru
  text: Разразитесь радостным пением[a], ликуйте вместе, руины Иерусалима! Ибо Яхве утешил свой народ, искупил Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Гряньте, ликуйте вместе».'
    reason: Еврейское сочетание פִּצְחוּ רַנְּנוּ передаёт внезапно начинающееся радостное пение или громкий ликующий возглас.
lexical_decisions:
- source_word: פִּצְחוּ
  choice: разразитесь
  rationale: Повелительная форма множественного числа передаёт образ внезапно и мощно зазвучавшей песни или ликующего возгласа; русское «разразитесь» сохраняет яркость еврейской метафоры.
- source_word: רַנְּנוּ
  choice: ликуйте / пойте
  rationale: Глагол обозначает радостное громкое пение или возглас. В основном тексте сочетание «разразитесь ликованием, пойте» сохраняет два параллельных повеления и явно выражает радость.
- source_word: יַחְדָּו
  choice: все вместе
  rationale: Передаёт совместность и единодушие призванных к радости.
- source_word: חָרְבוֹת
  choice: руины
  rationale: Слово обозначает разорённые, опустошённые места; «руины Иерусалима» кратко и наглядно передаёт поэтическое обращение к разрушенному городу.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание для призыва ликовать и естественно связывает части русского предложения.
- source_word: נִחַם
  choice: утешил
  rationale: Перфект выражает совершённое действие, представленное пророчески как свершившееся; «утешил» сохраняет ключевую тему утешения в данном разделе Исайи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени Бога сохраняет различие между именем и титулом.
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: Естественно передаёт существительное с местоименным суффиксом третьего лица и ясно соотносит народ с Яхве.
- source_word: גָּאַל
  choice: искупил
  rationale: Сохраняет смысл избавления и возвращения того, на что предъявляет права близкий родственник-искупитель, не сводя значение лишь к денежному выкупу.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Объект повторён в заключительной строке, как в еврейском тексте, что сохраняет акцент и поэтическое завершение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Значение גָּאַל
  choice: искупил Иерусалим
  alternative: освободил / выкупил Иерусалим
  rationale: «Искупил» сохраняет широкий библейский смысл избавления и восстановления принадлежности, не уточняя не названный в стихе механизм.
- issue: Перфектные формы נִחַם и גָּאַל
  choice: 'прошедшее совершённое действие: «утешил… искупил»'
  alternative: 'настоящее или будущее: «утешает… искупит»'
  rationale: Еврейские перфекты изображают Божье действие как совершившееся; перевод сохраняет эту пророческую уверенность, не превращая формы в явное будущее.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Сохранены прямое обращение к руинам, два параллельных повеления, причинная связь и повтор названия Иерусалима. Прописная буква в «Свой» соответствует принятой русской благоговейной издательской традиции, не изменяя смысла.
