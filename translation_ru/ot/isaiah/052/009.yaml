  source_fidelity: 'Смысл и синтаксическое членение переданы в целом верно: два повеления обращены к руинам Иерусалима; сохранены совместность, причинная связь, имя Яхве, совершенные формы «утешил» и «искупил», а также повтор «Иерусалим». Однако «разразитесь ликованием, пойте» несколько неудачно распределяет два близких еврейских глагола: первое русское сочетание звучит тяжеловесно, а второе сужает רַנְּנוּ до простого пения.'
  naturalness: «Разразитесь радостным пением, ликуйте вместе» — более естественная для современного литературного русского поэтическая параллель. «Ибо» сохраняет возвышенный регистр без разговорного оттенка «ведь». Строчная буква в «свой народ» следует обычной современной орфографии местоимений и не влияет на благоговейный регистр.
