  text: הִתְנַעֲרִ֧י מֵ/עָפָ֛ר ק֥וּמִי שְּׁבִ֖י יְרֽוּשָׁלִָ֑ם התפתחו מוֹסְרֵ֣י צַוָּארֵ֔/ךְ שְׁבִיָּ֖ה בַּת צִיּֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/002.yaml
  text: Shake yourself from the dust[a]; rise up, sit down, Jerusalem. Loosen the bonds of your neck[c][b], captive daughter Zion.
translation:
  language: ru
  text: Отряхни с себя прах, поднимись, сядь[a], Иерусалим! Сбрось узы со своей шеи[b], пленная дочь Сиона[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сядь»; в контексте восстановления это может подразумевать возвращение почётного положения.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская форма, переданная словом «сбрось», трудна и необычна; вероятный смысл: «освободись от уз» или «пусть спадут узы».'
    reason: textual_variant
  - marker: c
    text: 'Также возможно титульное именование: «пленная Дочь Сион».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְנַעֲרִי מֵעָפָר
  choice: Отряхни с себя прах
  rationale: 'Возвратная форма императива передаёт действие самой адресатки: она стряхивает с себя прах как образ унижения. «Прах» сохраняет конкретность и достоинство пророческой речи.'
- source_word: קוּמִי
  choice: поднимись
  rationale: Естественный современный русский императив, точно передающий призыв встать.
- source_word: שְּׁבִי
  choice: воссядь
  rationale: Основное значение — «сядь»; в противопоставлении пребыванию в прахе слово подразумевает занятие восстановленного почётного места. «Воссядь» выражает этот контекстуальный оттенок, не добавляя прямого указания на престол.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Принятая русская форма топонима; город персонифицирован и выступает адресатом женского рода.
- source_word: התפתחו
  choice: Сбрось
  rationale: Трудная и нерегулярная еврейская форма, вероятно, выражает приказ освободиться от пут. В сочетании с узами на шее «сбрось» естественно передаёт предполагаемый возвратно-освободительный смысл, не закрепляя спорный морфологический разбор.
- source_word: מוֹסְרֵי צַוָּארֵךְ
  choice: узы со своей шеи
  rationale: «Узы» охватывают значение пут или оков, а предлог «со» естественно сочетается с глаголом «сбрось» и образом освобождения шеи.
- source_word: שְׁבִיָּה
  choice: пленная
  rationale: Форма женского рода характеризует олицетворённый Сион как находящийся в плену.
- source_word: בַּת צִיּוֹן
  choice: дочь Сиона
  rationale: Устоявшаяся и прозрачная русская передача еврейского пророческого наименования-персонификации.
theological_decisions:
- issue: Контекстуальная сила שְּׁבִי в пророчестве о восстановлении
  choice: воссядь
  alternative: сядь; займи своё место
  rationale: Глагол буквально означает «сесть», однако контраст с прахом указывает на возвращение достоинства. «Воссядь» сохраняет образ почётного положения, но не вводит прямо отсутствующее в еврейском тексте слово «престол».
- issue: Нерегулярная форма התפתחו
  choice: Сбрось узы
  alternative: развяжи на себе узы; да спадут узы
  rationale: Форма в масоретском тексте морфологически трудна и не согласуется ожидаемым образом с адресатом женского рода единственного числа. Перевод передаёт наиболее вероятный смысл освобождения, а примечание сохраняет текстовую неопределённость.
translation_notes:
  register: Современный литературный русский с достоинством пророческого призыва. Параллельные повелительные формы сохранены; «воссядь» выбрано как умеренно возвышенное и контекстуально точное. Все примечания отмечены в основном тексте.
