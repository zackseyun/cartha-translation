id: ISA.52.10
reference: Isaiah 52:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: חָשַׂ֤ף יְהוָה֙ אֶת זְר֣וֹעַ קָדְשׁ֔/וֹ לְ/עֵינֵ֖י כָּל הַ/גּוֹיִ֑ם וְ/רָאוּ֙ כָּל אַפְסֵי אָ֔רֶץ אֵ֖ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/010.yaml
  text: Yahweh has bared his holy arm before the eyes of all the nations[c][b][a], and all the ends of the earth will see the salvation of our God.
translation:
  language: ru
  text: Яхве обнажил[a] свою святую руку на глазах у всех народов[b], и все концы земли увидят[d] спасение[c] нашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открыл», «обнажил для действия». Еврейский глагол рисует образ руки, открытой для решительного действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед глазами всех народов»; то есть открыто, у них на виду.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «избавление».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «увидели». В пророческой речи еврейская форма может представлять будущее событие как уже совершившееся и несомненное.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: חָשַׂף
  choice: обнажил
  rationale: Глагол означает «обнажить, открыть». Выбор сохраняет яркий образ руки, обнажённой для решительного действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: זְרוֹעַ קָדְשׁוֹ
  choice: свою святую руку
  rationale: Сохраняется антропоморфный поэтический образ Божьей силы, проявленной в спасительном действии; местоимение «свою» естественно связывает руку с подлежащим.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Естественный русский эквивалент, сохраняющий смысл открытого, видимого всем действия.
- source_word: כָּל הַגּוֹיִם
  choice: всех народов
  rationale: Здесь речь обо всех народах мира, а не специально о язычниках в противопоставлении Израилю.
- source_word: וְרָאוּ
  choice: увидят
  rationale: Форма может описывать результат Божьего действия с пророческой перспективой; будущее время естественно передаёт ожидаемое всеобщее свидетельство.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: все концы земли
  rationale: Сохраняется традиционный и понятный поэтический образ самых отдалённых частей мира, то есть всей земли.
- source_word: יְשׁוּעַת
  choice: спасение
  rationale: Слово обозначает спасение или избавление; «спасение» сохраняет широкий богословский и литературный смысл контекста.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Точно сохраняется форма первого лица множественного числа и заветная перспектива говорящего сообщества.
theological_decisions:
- issue: Антропоморфный образ Божьего действия
  choice: Сохранить выражение «свою святую руку».
  alternative: 'Передать смысл отвлечённо: «свою святую силу».'
  rationale: Исходный текст прямо использует телесный образ; его сохранение передаёт поэтическую выразительность и не подменяет образ толкованием.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: Текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула и соответствует преобладающей современной научной реконструкции произношения.
- issue: Временная перспектива וְרָאוּ
  choice: Будущее «увидят» с указанием варианта в сноске.
  alternative: Прошедшее «увидели».
  rationale: В пророческой речи завершённая форма способна представлять грядущее действие как несомненное; контекст допускает также последовательное описание уже совершившегося действия, поэтому неоднозначность отмечена.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической образности. Формулировка «на глазах у» понятна современному читателю, а «все концы земли» сохраняет узнаваемый библейский образ без архаизации.
