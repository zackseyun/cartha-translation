base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/013.yaml
  text: Behold[a], my servant will act wisely; he will be raised and lifted up and highly exalted.
translation:
  language: ru
  text: Вот, Мой раб будет поступать мудро[a]; он возвысится, будет вознесён и будет чрезвычайно возвышен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет иметь успех». Еврейский глагол может означать мудрые действия и, как их следствие, успех.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественное для современного литературного русского языка торжественное указание, привлекающее внимание к следующему пророческому утверждению.
- source_word: יַשְׂכִּיל
  choice: будет поступать мудро
  rationale: Порода hифиль глагола שׂכל выражает разумное, благоразумное действие и может подразумевать обусловленный им успех. Основной текст сохраняет смысл мудрого действия, а допустимое значение успеха вынесено в сноску.
- source_word: עַבְדִּי
  choice: Мой раб
  rationale: В данном контексте עבד естественно передаётся словом «раб», обозначающим принадлежащего Богу и исполняющего Его волю служителя; притяжательное местоимение написано с прописной буквы согласно принятой русской библейской орфографии.
- source_word: יָרוּם
  choice: возвысится
  rationale: Глагол רום обозначает возвышение или пребывание на высоте. Возвратная форма сохраняет неоднозначность между восхождением и возвышением без явного указания действующего лица.
- source_word: וְנִשָּׂא
  choice: будет вознесён
  rationale: Форма נשׂא здесь имеет пассивное значение возвышения; «будет вознесён» сохраняет образ движения вверх и отличается от соседних глаголов.
- source_word: וְגָבַהּ מְאֹד
  choice: и станет чрезвычайно высок
  rationale: 'Буквально передаёт кульминацию трёх выражений возвышения: גבהּ указывает на высоту, а מְאֹד резко усиливает её степень.'
theological_decisions:
- issue: Возможное мессианское понимание Раба
  choice: Сохранить нейтральное обозначение «Мой раб», не вводя в перевод прямого отождествления с Мессией или Христом.
  alternative: Передать обозначение Раба как явное указание на Мессию или Христа.
  rationale: Еврейский текст данного стиха говорит только «Мой раб». Перевод сохраняет формулировку источника и оставляет мессианское отождествление сфере толкования и межтекстовых связей.
- issue: Характер возвышения Раба
  choice: Сохранить последовательность трёх близких образов возвышения без уточнения, относится ли она к положению, прославлению или физическому поднятию.
  alternative: Истолковать всю последовательность исключительно как прославление или как физическое вознесение.
  rationale: Глаголы רום, נשׂא и גבהּ создают усиленную последовательность высоты и возвышения, но сам стих не сводит её к одному конкретному виду возвышения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Тройная последовательность возвышения сохранена, при этом использованы различающиеся русские формулировки, чтобы передать нарастание исходного текста.
