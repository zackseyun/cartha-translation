source:
  edition: WLC
  text: וְ/עַתָּ֤ה מי ל/י פֹה֙ נְאֻם יְהוָ֔ה כִּֽי לֻקַּ֥ח עַמִּ֖/י חִנָּ֑ם משל/ו יְהֵילִ֨ילוּ֙ נְאֻם יְהוָ֔ה וְ/תָמִ֥יד כָּל הַ/יּ֖וֹם שְׁמִ֥/י מִנֹּאָֽץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/005.yaml
  text: And now[a], what do I have here? declares Yahweh. For my people have been taken away for nothing; those who rule over them wail, declares Yahweh, and continually, all day long[b], my name is despised.
translation:
  language: ru
  text: И теперь, что у Меня здесь? — возвещает Яхве. — Ведь народ Мой уведён даром; те, кто властвует над ним, вопят[a], — возвещает Яхве, — и непрестанно, весь день, имя Моё поносят[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его угнетатели воют». Еврейское выражение обозначает тех, кто властвует над народом; в данном контексте их власть является угнетением. Глагол передаёт громкий вопль или вой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «имя Моё непрестанно, весь день, хулят».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет и соединительный ו, и временное עתה, естественно вводя новый этап пророческого высказывания.
- source_word: מַה־לִּי פֹה
  choice: что Мне здесь делать?
  rationale: Естественная русская передача эллиптического риторического вопроса, выражающего Божье возражение против сложившегося положения; буквальное «что Мне здесь?» звучало бы неясно.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу и её авторитетный характер современным литературным языком.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание предшествующего риторического вопроса и естественно связывает части фразы.
- source_word: לֻקַּח עַמִּי
  choice: народ Мой уведён
  rationale: Пассивная форма сохраняется; «уведён» естественно передаёт насильственное перемещение народа и соответствует контексту изгнания.
- source_word: חִנָּם
  choice: даром
  rationale: 'Сохраняет смысловую широту: без платы, без выгоды или без достаточного основания, не снимая контекстуальной неоднозначности.'
- source_word: מֹשְׁלָיו
  choice: те, кто властвует над ним
  rationale: Передаёт правителей народа, не сужая значение до толкования «угнетатели», хотя в контексте их власть носит угнетающий характер.
- source_word: יְהֵילִילוּ
  choice: вопят
  rationale: Передаёт громкий, резкий крик, выраженный глаголом ילל, и по-русски допускает как плач, так и надменный крик в зависимости от контекста.
- source_word: וְתָמִיד כָּל־הַיּוֹם
  choice: и непрестанно, весь день
  rationale: Сохраняет оба усиливающих обозначения длительности, не сводя их к одному наречию.
- source_word: שְׁמִי
  choice: имя Моё
  rationale: Прямо сохраняет библейское понятие имени Бога, включающее Его честь и явленную людям славу.
- source_word: מִנֹּאָץ
  choice: поносят
  rationale: Передаёт активное проявление презрения к Божьему имени; русское «поносить имя» естественно и не обязательно ограничивается техническим значением богохульства.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Значение מִנֹּאָץ применительно к имени Бога
  choice: имя Моё поносят
  alternative: имя Моё хулят; имя Моё презирают
  rationale: «Поносят» сохраняет идею открытого бесчестия и допускает оттенок богохульства, не делая этот более узкий смысл единственно возможным.
- issue: Субъект и характер действия מֹשְׁלָיו יְהֵילִילוּ
  choice: те, кто властвует над ним, вопят
  alternative: его угнетатели глумятся; его правители воют
  rationale: Грамматика указывает на властвующих над народом, а ילל буквально обозначает громкий вопль или вой. Основной текст не заменяет «властителей» толковательным «угнетатели» и сохраняет неоднозначный характер их крика.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «народ Мой», «имя Моё» умеренно возвышает стиль, не делая его архаичным. Пунктуация оформляет повторяющуюся формулу «возвещает Яхве» как авторскую вставку.
