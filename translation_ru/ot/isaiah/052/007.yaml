  text: מַה נָּאו֨וּ עַל הֶ/הָרִ֜ים רַגְלֵ֣י מְבַשֵּׂ֗ר מַשְׁמִ֧יעַ שָׁל֛וֹם מְבַשֵּׂ֥ר ט֖וֹב מַשְׁמִ֣יעַ יְשׁוּעָ֑ה אֹמֵ֥ר לְ/צִיּ֖וֹן מָלַ֥ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/007.yaml
  text: How beautiful on the mountains are the feet of the one who brings good news[a], who announces peace, who brings good news of good things, who announces salvation, who says to Zion, “Your God reigns.”
translation:
  language: ru
  text: 'Как прекрасны на горах ноги вестника доброй вести, возвещающего мир, несущего добрую весть о благе, возвещающего спасение, говорящего Сиону: «Твой Бог царствует».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твой Бог воцарился»; или: «Твой Бог — Царь». Еврейский текст может подчёркивать как воцарение, так и царское правление.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה נָּאווּ
  choice: Как прекрасны
  rationale: מַה вводит восклицание, а не вопрос; сочетание естественно передаёт восхищение и сохраняет поэтический строй.
- source_word: עַל הֶהָרִים
  choice: на горах
  rationale: Сохраняется конкретный образ гор, по которым приближается вестник.
- source_word: רַגְלֵי מְבַשֵּׂר
  choice: ноги вестника доброй вести
  rationale: Буквальный образ ног сохранён; причастие מְבַשֵּׂר передано без введения специальной должности, которой текст прямо не называет.
- source_word: מַשְׁמִיעַ שָׁלוֹם
  choice: возвещающего мир
  rationale: Hифиль שמע означает «давать услышать, объявлять»; «возвещать» уместно для торжественной публичной вести.
- source_word: מְבַשֵּׂר טוֹב
  choice: несущего добрую весть о благе
  rationale: Сохраняется повтор корня, связанного с доброй вестью, и широкое значение טוֹב, не сведённое только к благополучию.
- source_word: מַשְׁמִיעַ יְשׁוּעָה
  choice: возвещающего спасение
  rationale: «Спасение» передаёт широкий смысл избавления и сохраняет богословскую и каноническую насыщенность слова יְשׁוּעָה.
- source_word: אֹמֵר לְצִיּוֹן
  choice: говорящего Сиону
  rationale: Прямо воспроизводит введение речи и сохраняет традиционное имя «Сион».
- source_word: מָלַךְ אֱלֹהָיִךְ
  choice: Твой Бог царствует
  rationale: «Царствует» естественно звучит как торжественное провозглашение царской власти Бога, не ограничивая форму только началом царствования.
theological_decisions:
- issue: Значение царского провозглашения מָלַךְ אֱלֹהָיִךְ
  choice: Твой Бог царствует
  alternative: Твой Бог воцарился; Твой Бог — Царь
  rationale: Еврейская форма может обозначать как воцарение, так и осуществляемое царское правление. Основной вариант сохраняет эту широту, а возможные оттенки отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Сохранены параллелизм, повтор мотивов благой вести и возвещения, а также конкретный образ ног вестника. Маркер сноски поставлен непосредственно после спорного царского провозглашения.
