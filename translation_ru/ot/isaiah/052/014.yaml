base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/014.yaml
  text: Just as many were appalled at you—so disfigured was his appearance[a], beyond that of a man[c][b], and his form beyond the sons of man—
translation:
  language: ru
  text: Как многие ужасались при виде тебя[a], так его облик был обезображен сильнее, чем у человека, и его вид — сильнее, чем у людей —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте происходит резкий переход от второго лица к третьему: «ужасались… при виде тебя… его облик… его вид».'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Как ... так
  rationale: Сохраняет соотносительную конструкцию еврейского текста; её продолжение раскрывается в следующем стихе.
- source_word: שָׁמְמוּ עָלֶיךָ
  choice: ужасались, глядя на тебя
  rationale: Глагол передаёт потрясение и ужас, вызванные видом адресата; добавление «глядя» естественно выражает по-русски связь реакции с внешностью, не меняя референта местоимения второго лица.
- source_word: מִשְׁחַת
  choice: обезображен
  rationale: В контексте внешности обозначает крайнюю степень повреждения или искажения облика; современное «обезображен» яснее и точнее, чем менее определённое «испорчен».
- source_word: מֵאִישׁ מַרְאֵהוּ
  choice: его облик, не как у человека
  rationale: Сравнительное מן указывает, что облик вышел за пределы обычного человеческого вида. Русская конструкция передаёт этот смысл без неестественного буквального оборота.
- source_word: וְתֹאֲרוֹ מִבְּנֵי אָדָם
  choice: и его вид — не как у людей
  rationale: תֹּאַר передано как «вид», в отличие от מַרְאֶה «облик»; выражение «сыны человеческие» здесь идиоматически означает людей вообще, поэтому современное «у людей» сохраняет смысл.
theological_decisions:
- issue: Смена грамматического лица внутри стиха
  choice: Сохранить переход от второго лица («тебя») к третьему («его»).
  alternative: 'Согласовать весь стих в третьем лице: «глядя на него… его облик…»'
  rationale: Масоретский текст прямо содержит עָלֶיךָ во втором лице, а затем суффиксы третьего лица в מַרְאֵהוּ и תֹאֲרוֹ. Неожиданный переход не следует молча гармонизировать.
- issue: Степень нечеловеческого вида
  choice: «не как у человека… не как у людей»
  alternative: «больше, чем у человека… больше, чем у сынов человеческих»
  rationale: В данном контексте сравнительное מן выражает выход за пределы нормального человеческого облика, а не просто количественно большую степень обезображенности; перевод сохраняет напряжённую гиперболу, не утверждая иной природы персонажа.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены тире и незавершённость сравнительной конструкции, которая продолжается в следующем стихе; архаическое «сыны человеческие» заменено естественным «люди».
