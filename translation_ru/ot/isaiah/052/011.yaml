base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/011.yaml
  text: Turn away[a], turn away; go out from there. Touch no unclean thing. Go out from her midst; purify yourselves[c][b], you who carry the vessels of Yahweh.
translation:
  language: ru
  text: Отойдите[a], отойдите, выйдите оттуда! Не прикасайтесь ни к чему нечистому. Выйдите из её среды[b], очиститесь[c], вы, несущие сосуды Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Удалитесь, удалитесь». Повтор повеления усиливает призыв отделиться.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из её среды»; форма женского рода, вероятно, относится к городу.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будьте чисты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  choice: Отойдите
  rationale: Повторённый императив множественного числа передаёт настойчивый призыв отделиться; «отойдите» сохраняет отличие от следующего צְאוּ — «выйдите».
- source_word: צְאוּ
  choice: выйдите
  rationale: Прямое значение императива от יצא; указывает на выход из названного места.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Естественная русская передача обстоятельства места, которое следует покинуть.
- source_word: טָמֵא אַל תִּגָּעוּ
  choice: Не прикасайтесь ни к чему нечистому
  rationale: Субстантивированное прилагательное טָמֵא передано естественной русской конструкцией, сохраняющей язык нечистоты без уточнения, является ли она только обрядовой или нравственной.
- source_word: מִתּוֹכָהּ
  choice: из среды её
  rationale: Сохраняет суффикс женского рода, вероятно относящийся к подразумеваемому городу, и не заменяет его безличным указанием.
- source_word: הִבָּרוּ
  choice: очиститесь
  rationale: Императив выражает очищение и уместен в контексте священных сосудов; при этом не сужает смысл до исключительно обрядового очищения.
- source_word: נֹשְׂאֵי
  choice: вы, несущие
  rationale: Причастие употреблено как обращение; формулировка сохраняет его характеристический характер.
- source_word: כְּלֵי יְהוָה
  choice: сосуды Яхве
  rationale: כְּלֵי в данном храмовом контексте обозначает священные сосуды, а יהוה передано личным именем «Яхве».
theological_decisions:
- issue: Характер нечистоты и очищения
  choice: Сохранить слова «нечистому» и «очиститесь» без ограничения смысла только обрядовой или только нравственной сферой.
  alternative: Истолковать выражения исключительно как обрядовые предписания либо исключительно как нравственное отделение от Вавилона.
  rationale: Контекст несения священных сосудов указывает на культовую чистоту, а призыв покинуть город имеет также нравственную силу; исходная напряжённость должна сохраняться.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное Божье имя в исходном тексте и отличает его от титула.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Повтор императива сохранён; «сосуды» передаёт храмовый контекст. Порядок маркеров приведён в соответствие с местами их привязки в русском тексте.
