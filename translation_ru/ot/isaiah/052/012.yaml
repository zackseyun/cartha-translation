  yaml_path: translation/ot/isaiah/052/012.yaml
  text: For you will not go out in haste[a], and you will not go in flight; for Yahweh is going before you[b], and the God of Israel is your rear guard.
translation:
  language: ru
  text: 'Ибо вы выйдете не второпях и не пойдёте в бегстве: ведь впереди вас идёт Яхве, а Бог Израиля охраняет вас с тыла[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Буквально: «собирает вас сзади». Здесь имеется в виду тот, кто замыкает шествие и защищает его с тыла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחִפָּזוֹן
  choice: не второпях
  rationale: Передаёт поспешность движения без добавления оттенка паники и естественно звучит по-русски.
- source_word: תֵּצֵאוּ
  choice: вы выйдете
  rationale: Сохраняет конкретный глагол «выходить» и связь образа с исходом.
- source_word: וּבִמְנוּסָה
  choice: не как беглецы
  rationale: מְנוּסָה обозначает бегство; личная конструкция естественна по-русски и передаёт мысль о том, что народ не будет спасаться бегством.
- source_word: תֵלֵכוּן
  choice: пойдёте
  rationale: Нейтрально передаёт הלך и сохраняет параллелизм с «выйдете».
- source_word: הֹלֵךְ לִפְנֵיכֶם
  choice: впереди вас идёт
  rationale: Сохраняет деятельный образ Бога, идущего впереди народа; причастная форма оригинала передана настоящим временем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וּמְאַסִּפְכֶם
  choice: охраняет вас с тыла
  rationale: В данном шественном контексте אסף описывает того, кто замыкает движение и обеспечивает защиту сзади; функциональный перевод естественнее буквального «собирает вас».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо передаёт конструкцию принадлежности и сохраняет заветное наименование.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Образ Бога позади народа
  choice: охраняет вас с тыла
  alternative: собирает вас сзади
  rationale: Выбран функциональный военный и шественный смысл, но буквальный образ глагола אסף сохранён в примечании, чтобы не устранить его смысловой оттенок.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Параллелизм двух отрицаний сохранён; двоеточие подчёркивает, что спокойный выход возможен благодаря присутствию Бога впереди и позади народа.
