  text: לָ/כֵ֛ן יֵדַ֥ע עַמִּ֖/י שְׁמִ֑/י לָ/כֵן֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי אֲנִי ה֥וּא הַֽ/מְדַבֵּ֖ר הִנֵּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/006.yaml
  text: 'Therefore my people will know my name[a]; therefore on that day they will know that I am he who speaks: Here I am.'
translation:
  language: ru
  text: 'Поэтому Мой народ узнает Моё имя; поэтому в тот день он узнает, что Я — Тот, кто говорит: «Вот Я!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: поэтому
  rationale: Передаёт следствие из предшествующего контекста; повтор сохранён ради пророческого ритма и смыслового акцента.
- source_word: יֵדַע
  choice: узнает
  rationale: Имперфект имеет здесь будущее значение. «Узнает» естественно сочетается как с раскрытием Божьего имени, так и с последующим распознаванием Говорящего.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Сохраняет обычное для заветного контекста собирательное обозначение.
- source_word: שְׁמִי
  choice: Моё имя
  rationale: Буквально сохраняет многозначность слова «имя», которое может подразумевать личность, славу и открытый характер Бога, не разворачивая это толкованием.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская формула, сохраняющая пророческое временное указание.
- source_word: כִּי
  choice: что
  rationale: В данном синтаксисе вводит содержание того, что народ узнает.
- source_word: אֲנִי הוּא הַמְדַבֵּר
  choice: это Я говорю
  rationale: Естественно и сжато передаёт эмфатическое самоотождествление אֲנִי הוּא вместе с субстантивированным причастием «говорящий», не добавляя отсутствующей в тексте конкретизации.
- source_word: הִנֵּנִי
  choice: Вот Я!
  rationale: Передаёт дейктическое самопредъявление и непосредственность Божьего присутствия; в современном литературном русском звучит возвышенно и ясно.
theological_decisions:
- issue: Эмфатическое Божье самоотождествление אֲנִי הוּא
  choice: это Я
  alternative: Я — Тот
  rationale: «Это Я» сохраняет краткость, эмфазу и возможность межтекстовых ассоциаций, но не превращает формулу в более развёрнутое богословское утверждение.
- issue: Связь הַמְדַבֵּר и הִנֵּנִי
  choice: 'что это Я говорю: «Вот Я!»'
  alternative: 'что Я — Тот, Кто говорит: «Вот Я!»'
  rationale: Первый вариант грамматически естественнее по-русски и сохраняет возможное прочтение «Вот Я!» как содержания Божьей речи, не устраняя синтаксической напряжённости оригинала.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены повтор «поэтому», образ «имени» и лаконичное Божье самопредъявление. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно устойчивой русской библейской традиции.
