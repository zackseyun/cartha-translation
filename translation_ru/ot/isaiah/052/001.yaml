id: ISA.52.1
reference: Isaiah 52:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עוּרִ֥י עוּרִ֛י לִבְשִׁ֥י עֻזֵּ֖/ךְ צִיּ֑וֹן לִבְשִׁ֣י בִּגְדֵ֣י תִפְאַרְתֵּ֗/ךְ יְרוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ כִּ֣י לֹ֥א יוֹסִ֛יף יָבֹא בָ֥/ךְ ע֖וֹד עָרֵ֥ל וְ/טָמֵֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/001.yaml
  text: Awake[a], awake; put on your strength, Zion; put on your beautiful garments, Jerusalem, the holy city[b]. For no longer shall the uncircumcised and the unclean enter you again.
translation:
  language: ru
  text: Пробудись, пробудись, облекись в силу свою, Сион! Надень свои прекрасные одежды[a], Иерусалим, святой город! Ведь больше не войдёт в тебя необрезанный и нечистый[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одежды великолепия».'
    reason: lexical_alternative
  - marker: b
    text: Слова «необрезанный и нечистый» сохраняют язык завета и ритуальной чистоты; здесь они могут в широком смысле обозначать тех, кому нет места в святости Иерусалима.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרִי עוּרִי
  choice: Пробудись, пробудись
  rationale: Повторённое повеление женского рода обращено к олицетворённому Сиону; повтор сохраняет настойчивость и поэтическое усиление.
- source_word: לִבְשִׁי עֻזֵּךְ
  choice: облекись в силу свою
  rationale: Сохраняет образ силы как одеяния и звучит естественно в возвышенной современной русской речи.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Устоявшаяся русская передача географического имени; здесь город олицетворён и выступает адресатом.
- source_word: לִבְשִׁי בִּגְדֵי תִפְאַרְתֵּךְ
  choice: надень свои прекрасные одежды
  rationale: תִפְאֶרֶת может обозначать красоту, великолепие и славу; основной текст передаёт образ ясным современным выражением, а оттенок великолепия отмечен в сноске.
- source_word: יְרוּשָׁלִַם עִיר הַקֹּדֶשׁ
  choice: Иерусалим, святой город
  rationale: Передаёт обращение и приложение без добавления отсутствующей в еврейском тексте связки.
- source_word: כִּי לֹא יוֹסִיף יָבֹא בָךְ עוֹד
  choice: Ведь больше не войдёт в тебя
  rationale: Сочетание יוֹסִיף и עוֹד подчёркивает прекращение в будущем; «больше не войдёт» естественно передаёт этот смысл без тяжеловесного дублирования.
- source_word: עָרֵל וְטָמֵא
  choice: необрезанный и нечистый
  rationale: Сохранены формы единственного числа и библейская лексика завета и чистоты; перевод не уточняет, идёт ли речь об одном лице с двумя признаками или о собирательных категориях.
theological_decisions:
- issue: Смысл выражения «необрезанный и нечистый» применительно к Иерусалиму
  choice: Сохранить язык завета и чистоты, не конкретизируя его как исключительно этнический, обрядовый, нравственный или эсхатологический.
  alternative: Истолковать выражение только как указание на чужеземных захватчиков, только на ритуально нечистых людей либо только как образ окончательно освящённого Иерусалима.
  rationale: Сам стих использует категории обрезания и чистоты, но не определяет здесь их точный объём; буквальная формулировка сохраняет богословскую многозначность.
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим ритмом. Императивы и олицетворение города сохранены; синтаксис сделан ясным для широкого читателя без устранения исходной неоднозначности.
