  text: ק֥וֹל צֹפַ֛יִ/ךְ נָ֥שְׂאוּ ק֖וֹל יַחְדָּ֣ו יְרַנֵּ֑נוּ כִּ֣י עַ֤יִן בְּ/עַ֨יִן֙ יִרְא֔וּ בְּ/שׁ֥וּב יְהוָ֖ה צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/008.yaml
  text: The voice of your watchmen—they lift up their voice[a]; together they shout for joy[b], for they will see eye to eye when Yahweh returns to Zion.
translation:
  language: ru
  text: Голос твоих стражей — они возвышают голос, все вместе ликуют, потому что своими глазами[a] увидят, когда Яхве возвращается на Сион[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глаз в глаз»; то есть непосредственно, воочию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда Яхве восстанавливает Сион».'
    reason: alternative_reading
lexical_decisions:
- source_word: ק֥וֹל
  choice: Голос
  rationale: Сохраняет именное начало еврейского текста без добавления отсутствующего в оригинале призыва «слушай».
- source_word: צֹפַיִךְ
  choice: твоих стражей
  rationale: Передаёт значение тех, кто несёт дозор; местоименный суффикс женского рода единственного числа сохранён как обращение к Сиону.
- source_word: נָשְׂאוּ קוֹל
  choice: они возвышают голос
  rationale: Естественно передаёт еврейскую идиому «поднимать голос» и сохраняет торжественный регистр.
- source_word: יַחְדָּו יְרַנֵּנוּ
  choice: все вместе ликуют
  rationale: Передаёт одновременно единодушие и громкое радостное восклицание; «ликуют» звучит естественнее по-русски, чем буквальное «издают радостный крик».
- source_word: עַיִן בְּעַיִן
  choice: своими глазами
  rationale: В данном контексте выражение обозначает непосредственное, личное зрительное восприятие. Буквальный образ «глаз в глаз» отмечен в сноске, поскольку в современном русском он может ошибочно пониматься как взаимный взгляд или полное согласие.
- source_word: יִרְאוּ
  choice: увидят
  rationale: Имперфект передан будущим временем в соответствии с контекстом ожидаемого действия Яхве.
- source_word: בְּשׁוּב
  choice: как ... возвращается
  rationale: Инфинитивная конструкция с ב передана временным оборотом; наиболее прямое синтаксическое прочтение представляет Яхве возвращающимся на Сион.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой русской транслитерацией, а не заменено титулом.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Традиционная и узнаваемая русская форма географического и богословского имени.
theological_decisions:
- issue: Смысл עַיִן בְּעַיִן
  choice: своими глазами
  alternative: буквально «глаз в глаз»; также возможно «лицом к лицу», «воочию»
  rationale: Контекст указывает на прямое, непосредственное видение действия Яхве, а не на согласие между людьми. Основной текст передаёт вероятный смысл, а сноска сохраняет образность и неоднозначность оригинала.
- issue: Субъект и значение בְּשׁוּב יְהוָה צִיּוֹן
  choice: как Яхве возвращается на Сион
  alternative: когда Яхве восстанавливает Сион
  rationale: Наиболее естественно понимать Яхве как подлежащее глагола «возвращаться». Каузативно-восстановительное понимание возможно по контексту и сохранено в сноске, но не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет энергичное именное начало и последовательность общего ликования, избегая архаизмов и неестественных буквальных оборотов.
