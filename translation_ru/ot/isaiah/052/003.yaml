id: ISA.52.3
reference: Isaiah 52:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה חִנָּ֖ם נִמְכַּרְתֶּ֑ם וְ/לֹ֥א בְ/כֶ֖סֶף תִּגָּאֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/003.yaml
  text: 'For thus says Yahweh: “You were sold for nothing[a], and you will be redeemed without money.”'
translation:
  language: ru
  text: 'Ибо так говорит Яхве: «Даром вы были проданы, и не за деньги[a] будете искуплены».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не за серебро». Здесь «серебро», вероятно, означает деньги или плату вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объясняющее и подтверждающее пророческое изречение; «ибо» сохраняет связь с предшествующим контекстом и соответствует возвышенному регистру.
- source_word: כֹה אָמַר
  choice: так говорит
  rationale: Традиционная и ясная по-русски передача пророческой вестнической формулы, близкая к форме еврейского текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте, без замены титулом.
- source_word: חִנָּם
  choice: даром
  rationale: Кратко и естественно выражает отсутствие полученной платы и сохраняет риторическое соответствие второй половине стиха.
- source_word: נִמְכַּרְתֶּם
  choice: вы были проданы
  rationale: Нифаль здесь естественно понимать как страдательный залог; перевод не привносит рефлексивного смысла «вы продали себя».
- source_word: וְלֹא בְכֶסֶף
  choice: и не за деньги
  rationale: В данном экономическом образе כֶּסֶף обозначает серебро как средство платежа, то есть деньги; формулировка сохраняет отрицание и звучит естественно на современном русском.
- source_word: תִּגָּאֵלוּ
  choice: будете искуплены
  rationale: Глагол גאל обозначает избавление или выкуп со стороны искупителя; «искуплены» сохраняет как образ выкупа, так и более широкий смысл избавления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблено четырёхбуквенное личное имя Бога; транслитерация сохраняет эту особенность исходного текста.
- issue: Характер искупления
  choice: Сохранён экономический образ без уточнения способа искупления
  alternative: Буквальный денежный выкуп; исключительно образное восстановление
  rationale: Стих противопоставляет продажу даром искуплению не за деньги, но не объясняет механизм избавления; перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с краткой, торжественной пророческой формулой. Порядок слов «не за деньги будете искуплены» слегка возвышен, но понятен и подчёркивает контраст «даром — не за деньги».
