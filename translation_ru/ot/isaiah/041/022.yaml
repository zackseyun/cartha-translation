source:
  edition: WLC
  text: יַגִּ֨ישׁוּ֙ וְ/יַגִּ֣ידוּ לָ֔/נוּ אֵ֖ת אֲשֶׁ֣ר תִּקְרֶ֑ינָה הָ/רִאשֹׁנ֣וֹת מָ֣ה הֵ֗נָּה הַגִּ֜ידוּ וְ/נָשִׂ֤ימָה לִבֵּ֨/נוּ֙ וְ/נֵדְעָ֣ה אַחֲרִיתָ֔/ן א֥וֹ הַ/בָּא֖וֹת הַשְׁמִיעֻֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/022.yaml
  text: Let them bring them forward and tell us what will happen[a]. Tell us the former things—what they are—that we may set our heart on them and know their outcome[c][b]; or declare to us the things to come.
translation:
  language: ru
  text: Пусть они представят их и скажут нам, что произойдёт. О прежнем — что оно такое — расскажите, чтобы мы приняли это во внимание[a] и узнали их исход[b]; или возвестите нам о грядущем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «положили к этому наше сердце», то есть внимательно и серьёзно это обдумали.'
    reason: cultural_note
  - marker: b
    text: 'Или: «узнали их конец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַגִּישׁוּ
  choice: Пусть они представят их
  rationale: Порода hiphil от נגשׁ в контексте судебного вызова означает представить идолов или их доказательства. Местоименное дополнение сохранено как подразумеваемое контекстом.
- source_word: וְיַגִּידוּ לָנוּ
  choice: и скажут нам
  rationale: Hiphil глагола נגד означает «сказать, объявить, сообщить»; нейтральное «скажут нам» естественно передаёт первый призыв.
- source_word: אֵת אֲשֶׁר תִּקְרֶינָה
  choice: что произойдёт
  rationale: קרה обозначает то, что случается или происходит; русское придаточное естественно передаёт подразумеваемое множество событий.
- source_word: הָרִאשֹׁנוֹת מָה הֵנָּה
  choice: о прежнем — что это было
  rationale: ראשׁון указывает на прежние события, а безглагольное מָה הֵנָּה буквально ставит вопрос об их сущности. Прошедшее время в русском согласует выражение с уже состоявшимся «прежним», не добавляя толкования их значения.
- source_word: הַגִּידוּ
  choice: Расскажите
  rationale: Повелительная форма נגד продолжает требование сообщить о прежних событиях; «расскажите» звучит естественно с дополнением «о прежнем».
- source_word: וְנָשִׂימָה לִבֵּנוּ
  choice: чтобы мы приняли это к сердцу
  rationale: Буквально «положим наше сердце» — идиома внимательного и серьёзного обдумывания. «Принять к сердцу» сохраняет образ сердца и понятно современному читателю; значение поясняется в сноске.
- source_word: וְנֵדְעָה אַחֲרִיתָן
  choice: и узнали, чем оно завершилось
  rationale: אַחֲרִית может означать конец, итог или исход. Формулировка передаёт результат прежних событий ясным современным русским языком.
- source_word: אוֹ הַבָּאוֹת הַשְׁמִיעֻנוּ
  choice: или возвестите нам о грядущем
  rationale: Причастие בוא обозначает грядущее, а hiphil שׁמע — дать услышать, объявить. «Возвестите» сохраняет торжественную риторическую силу вызова.
theological_decisions:
- issue: Связь «прежнего» с его исходом
  choice: Сохранить прежние события как предмет рассмотрения, исход которого предлагается узнать.
  alternative: Понять «прежнее» как прежние предсказания и проверить их исполнение.
  rationale: Еврейский текст прямо не называет прежнее предсказаниями; более конкретное толкование не внесено.
translation_notes:
  register: Современный литературный русский с достоинством пророческой судебной речи. Синтаксис сделан ясным для обычного читателя; образ сердца сохранён в естественной русской идиоме, а неоднозначность אַחֲרִית отмечена сноской.
