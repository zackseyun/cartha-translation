  to: Пусть они представят их и скажут нам, что произойдёт. О прежнем — что оно такое — расскажите, чтобы мы приняли это во внимание[a] и узнали их исход[b]; или возвестите нам о грядущем.
  rationale: Исправлены временная форма вопроса о «прежнем», число местоименных отсылок к прежним событиям и передача идиомы «положить сердце». Структура, риторический регистр, неоднозначность «прежнего» и лексическое различие между «исходом» и «концом» сохранены.
