source:
  edition: WLC
  text: לְמַ֧עַן יִרְא֣וּ וְ/יֵדְע֗וּ וְ/יָשִׂ֤ימוּ וְ/יַשְׂכִּ֨ילוּ֙ יַחְדָּ֔ו כִּ֥י יַד יְהוָ֖ה עָ֣שְׂתָה זֹּ֑את וּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל בְּרָאָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/020.yaml
  text: so that they may see and know[a], and may consider and understand together, that the hand of Yahweh has done this, and the Holy One of Israel has created it.
translation:
  language: ru
  text: чтобы они увидели и узнали, приняли это к сердцу и вместе поняли, что рука Яхве сделала это и Святой Израиля сотворил это.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное значение союза.
- source_word: יִרְאוּ וְיֵדְעוּ
  choice: они увидели и узнали
  rationale: Сохраняет последовательность непосредственного восприятия и осознания, не сужая смысл глаголов.
- source_word: וְיָשִׂימוּ
  choice: вдумались
  rationale: В данном ряду глагол выражает внутреннее внимание и обдумывание; «вдумались» естественно передаёт этот смысл по-русски.
- source_word: וְיַשְׂכִּילוּ יַחְדָּו
  choice: и все вместе поняли
  rationale: Передаёт обретение понимания и коллективное значение יַחְדָּו; расположение «все вместе» устраняет двусмысленность русского сочетания «вместе поняли».
- source_word: כִּי
  choice: что
  rationale: Вводит содержание того, что предстоит увидеть, узнать и понять.
- source_word: יַד יְהוָה
  choice: рука Яхве
  rationale: Сохраняет еврейский антропоморфный образ божественной силы и действия, а личное имя передаёт как «Яхве».
- source_word: עָשְׂתָה זֹּאת
  choice: сделала это
  rationale: Буквально и естественно передаёт широкий глагол עשה и указательное местоимение.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: и Святой Израиля
  rationale: Сохраняет характерный для Исаии божественный титул и соединительный союз, не превращая его без необходимости в пояснение.
- source_word: בְּרָאָהּ
  choice: сотворил это
  rationale: Передаёт особый глагол ברא отдельно от עשה; повтор «это» в русском яснее местоимения среднего рода, поскольку предшествующий референт грамматически не выражен существительным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное божественное имя; транслитерация сохраняет его статус имени и не заменяет титулом.
- issue: Соотношение עשה и ברא
  choice: сделала это … сотворил это
  alternative: объединить оба выражения в одно действие
  rationale: Два разных еврейских глагола сохранены раздельно, чтобы не сгладить риторический параллелизм и акцент на созидательном действии Бога.
- issue: Последовательность четырёх познавательных глаголов
  choice: увидели и узнали, вдумались и все вместе поняли
  alternative: увидели, узнали, приняли к сердцу и обрели разумение
  rationale: Перевод сохраняет нарастание от восприятия к осмыслению, не превращая близкие по смыслу глаголы в один и не навязывая узкую идиоматическую трактовку.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Синтаксический параллелизм оригинала сохранён; ненужные архаизмы исключены.
