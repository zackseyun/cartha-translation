base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/011.yaml
  text: Behold[a], all who are enraged against you will be put to shame and humiliated; they will become as nothing, and the men who contend with you will perish.
translation:
  language: ru
  text: Вот, все разгневанные на тебя[a] покроются стыдом и будут посрамлены; они будут как ничто, и погибнут люди, ведущие с тобой тяжбу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пылающие против тебя»; это еврейское выражение означает сильный гнев и враждебность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Частица привлекает внимание к торжественному пророческому заверению; «вот» естественно сохраняет эту функцию в современном литературном русском.
- source_word: יֵבֹשׁוּ
  choice: покроются стыдом
  rationale: Передаёт публичный позор и постыдный исход, а не только внутреннее чувство стыда.
- source_word: וְיִכָּלְמוּ
  choice: и будут посрамлены
  rationale: Сохраняет второй, усиливающий глагол параллельной конструкции, не сливая его с בוש.
- source_word: כֹּל הַנֶּחֱרִים בָּךְ
  choice: все разгневанные на тебя
  rationale: Причастие от חרה обозначает сильный, буквально «пылающий», гнев; предлог ב в данном контексте выражает направленную против адресата враждебность.
- source_word: יִהְיוּ כְאַיִן
  choice: они станут как ничто
  rationale: Сохраняет и будущую форму глагола, и сравнительную частицу כ, не ослабляя образ полного ничтожества.
- source_word: וְיֹאבְדוּ
  choice: и погибнут
  rationale: Непереходное «погибнут» точно передаёт Qal глагола אבד, не вводя прямо выраженного деятеля уничтожения.
- source_word: אַנְשֵׁי רִיבֶךָ
  choice: люди, ведущие с тобой тяжбу
  rationale: «Люди» передаёт אַנְשֵׁי, а «ведущие с тобой тяжбу» сохраняет оттенок спора или судебного противоборства в ריב.
theological_decisions:
- issue: Гендерная форма אַנְשֵׁי רִיבֶךָ
  choice: люди, ведущие с тобой тяжбу
  alternative: те, кто спорит с тобой / твои противники
  rationale: Существительное אַנְשֵׁי передано явно словом «люди», а не устранено обобщающей заменой. Русское «мужчины» здесь неоправданно подчёркивало бы биологический пол, тогда как «мужи» придало бы тексту ненужную архаичность.
- issue: Характер постигшего противников позора
  choice: покроются стыдом и будут посрамлены
  alternative: устыдятся и смутятся
  rationale: Выбранная формулировка сохраняет возможность понимать речь как об объективном публичном поражении, не сводя оба еврейских глагола к внутреннему переживанию.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксический параллелизм и различие между двумя глаголами стыда сохранены; архаизмы вроде «се» и «мужи» не использованы.
