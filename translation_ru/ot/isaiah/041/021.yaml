lexical_decisions:
- source_word: קָרְבוּ רִיבְכֶם
  choice: Представьте своё дело
  rationale: Буквально сочетание означает «приблизьте/предъявите вашу тяжбу». В контексте судебного вызова естественное русское выражение «представьте своё дело» передаёт повелительную форму и юридический смысл.
- source_word: יֹאמַר יְהוָה
  choice: говорит Яхве
  rationale: Формула речи передана в настоящем времени; личное имя יהוה транслитерировано как «Яхве», а не заменено титулом.
- source_word: הַגִּישׁוּ עֲצֻמוֹתֵיכֶם
  choice: Приведите свои веские доводы
  rationale: הַגִּישׁוּ значит «поднесите, предъявите», а редкое עֲצֻמוֹתֵיכֶם в данном судебном контексте обозначает сильные основания, доказательства или доводы. «Веские доводы» сохраняет идею силы аргумента и звучит естественно по-русски.
- source_word: מֶלֶךְ יַעֲקֹב
  choice: Царь Иакова
  rationale: Сохранена еврейская конструкция, представляющая Бога царём, правящим Иаковом; имя יַעֲקֹב передано без замены на «Израиль».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога — тетраграмматон יהוה. Транслитерация «Яхве» сохраняет личное заветное имя, тогда как «Господь» является традиционной заменой титулом.
- issue: Судебная образность божественного вызова
  choice: Представьте своё дело; приведите свои веские доводы
  alternative: Приблизьте вашу тяжбу; поднесите ваши сильные основания
  rationale: Контекст изображает судебное разбирательство. Современная русская юридическая фразеология ясно передаёт функцию еврейских выражений, не превращая пространственные идиомы в неестественный буквализм.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной судебной риторикой. Обращение дано во множественном числе, как в еврейском тексте; титул «Царь Иакова» сохранён в традиционно возвышенной форме.
