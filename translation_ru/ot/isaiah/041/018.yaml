  text: אֶפְתַּ֤ח עַל שְׁפָיִים֙ נְהָר֔וֹת וּ/בְ/ת֥וֹךְ בְּקָע֖וֹת מַעְיָנ֑וֹת אָשִׂ֤ים מִדְבָּר֙ לַ/אֲגַם מַ֔יִם וְ/אֶ֥רֶץ צִיָּ֖ה לְ/מוֹצָ֥אֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/018.yaml
  text: I will open rivers on the bare heights[a], and springs in the midst of the valleys; I will make the wilderness into a pool of water[b], and the dry land into springs of water.
translation:
  language: ru
  text: Я открою реки на голых высотах[a] и родники среди долин; превращу пустыню в водоём и иссохшую землю — в источники воды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на безлесных возвышенностях»; также возможно: «на бесплодных холмах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְתַּח
  choice: Я открою
  rationale: Прямо передаёт qal, имперфект 1-го лица ед. числа от פתח, сохраняя форму божественного обещания.
- source_word: שְׁפָיִים
  choice: на голых высотах
  rationale: Передаёт как возвышенность, так и открытый, лишённый растительности характер местности; избегает культовой окраски выражения «высоты» без определения.
- source_word: נְהָרוֹת
  choice: реки
  rationale: Основное значение слова и уместный образ изобилия воды; возможное «потоки» не требуется контекстом.
- source_word: וּבְתוֹךְ בְּקָעוֹת
  choice: среди долин
  rationale: Естественно передаёт בְתוֹךְ и противопоставление возвышенностям; בקעות здесь понимается как долины или широкие понижения.
- source_word: מַעְיָנוֹת
  choice: источники
  rationale: Современное и точное обозначение естественных источников воды.
- source_word: אָשִׂים
  choice: превращу
  rationale: В данном контексте שׂים выражает произведённое Богом изменение; «превращу» естественно связывает исходное состояние с новым, не добавляя способа преобразования.
- source_word: מִדְבָּר
  choice: пустыню
  rationale: В русском пророческом контексте ясно обозначает безводную и необитаемую местность, не ограничивая образ исключительно песчаной пустыней.
- source_word: לַאֲגַם מַיִם
  choice: в водоём
  rationale: אגם может обозначать скопление воды, пруд или озеро; нейтральное «водоём» сохраняет широту значения и не вводит болотной окраски.
- source_word: אֶרֶץ צִיָּה
  choice: иссохшую землю
  rationale: Передаёт не просто сухость, а состояние сильного иссушения, соответствующее צִיָּה.
- source_word: לְמוֹצָאֵי מָיִם
  choice: в ключи воды
  rationale: מוֹצָאֵי буквально указывает на места выхода воды. «Ключи воды» сохраняет образ воды, выходящей из земли, и отличает выражение от ранее употреблённого מַעְיָנוֹת.
theological_decisions:
- issue: Характер обещанного преображения
  choice: Сохранить конкретные природные образы как прямое божественное обещание в пророческой поэзии.
  alternative: Истолковать воду как исключительно духовное обновление либо прямо обозначить картину как эсхатологическое новое творение.
  rationale: Еврейский текст говорит о появлении воды в бесплодных местах, но сам стих не объясняет, следует ли понимать это только буквально, символически или эсхатологически. Перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены два параллельных действия от первого лица и конкретная природная образность; точка с запятой отражает поэтическое членение стиха.
