revisions:
- from: Кто поднял мужа с востока[a], призвал его по правде следовать за Собой? Он отдаёт ему народы и покоряет царей; его меч обращает их в прах[b], его лук — в гонимую ветром солому.
  to: Кто поднял с востока того, кого Он призывает в праведности следовать за Собой? Он отдаёт ему народы и покоряет царей; отдаёт их его мечу, как прах, его луку — как гонимую ветром солому.
  rationale: Правка убирает добавленное существительное «муж», уточняет передачу צֶדֶק и восстанавливает в последней части стиха общий глагол «отдаёт», который управляет образами меча и лука. Передача «следовать за Собой» остаётся допустимой смысловой экспликацией трудного לְרַגְלוֹ; сноска сохраняет его неоднозначность.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:35:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан: безымянный деятель приходит с востока, народы и цари отдаются ему, а образы меча и лука описывают сокрушение противников. Однако «мужа» неоправданно конкретизирует невыраженное в еврейском тексте лицо, а «его меч обращает их в прах, его лук — в ... солому» превращает оружие в грамматического деятеля и слишком далеко отходит от сжатой конструкции «даёт [их] как прах мечу его ...».'
  naturalness: Предлагаемая правка сохраняет современный литературный и поэтический русский. «Отдаёт их его мечу, как прах» намеренно воспроизводит образный параллелизм оригинала, но остаётся понятным в контексте.
  terminology: «В праведности» точнее передаёт צֶדֶק, чем разговорно-оценочное «по правде», не исключая отмеченных в сноске оттенков справедливости, оправдания или победы. Личность пришедшего с востока остаётся неназванной. Заглавные местоимения относятся к Богу как к субъекту призвания в контексте речи, не называя и не отождествляя восточного деятеля.
  issues:
  - severity: medium
    issue: «мужа с востока»
    rationale: В оригинале после «с востока» не стоит существительное «муж»; это лишь подразумеваемый объект. Нейтральное «того, кто пришёл с востока» не добавляет гендерно маркированного слова.
  - severity: medium
    issue: 'Орудия сделаны деятелями: «его меч обращает ... его лук — ...»'
    rationale: 'Еврейское יִתֵּן продолжает действие субъекта: он отдаёт/делает побеждённых подобными праху для меча и гонимой соломе для лука. Следует сохранить этот параллелизм, не приписывая глагол мечу.'
  - severity: low
    issue: «по правде»
    rationale: Выражение естественно в значении «честно», но здесь צֶדֶק сохраняет более широкий и возвышенный смысл праведности/справедливости. «В праведности» точнее и не закрывает отмеченную текстовую неоднозначность.
  revised_text: Кто поднял с востока того, кого Он призывает в праведности следовать за Собой? Он отдаёт ему народы и покоряет царей; отдаёт их его мечу, как прах, его луку — как гонимую ветром солому.
  revised_footnotes:
  - marker: a
    text: 'Или: «призывает его к победе» или «ради правого дела». Еврейский оборот труден; слово, переведённое как «праведность», может здесь также означать справедливость, оправдание или победу.'
    reason: lexical_alternative
  - marker: b
