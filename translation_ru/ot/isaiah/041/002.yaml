source:
  edition: WLC
  text: מִ֤י הֵעִיר֙ מִ/מִּזְרָ֔ח צֶ֖דֶק יִקְרָאֵ֣/הוּ לְ/רַגְל֑/וֹ יִתֵּ֨ן לְ/פָנָ֤י/ו גּוֹיִם֙ וּ/מְלָכִ֣ים יַ֔רְדְּ יִתֵּ֤ן כֶּֽ/עָפָר֙ חַרְבּ֔/וֹ כְּ/קַ֥שׁ נִדָּ֖ף קַשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/002.yaml
  text: Who has stirred up one from the east[a], calling him in righteousness to his feet? He gives nations before him and subdues kings; he gives them like dust to his sword[b], like driven stubble to his bow.
translation:
  language: ru
  text: Кто поднял с востока того, кого Он призывает в праведности следовать за Собой? Он отдаёт ему народы и покоряет царей; отдаёт их его мечу, как прах, его луку — как гонимую ветром солому.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵעִיר
  choice: поднял
  rationale: Каузативная форма означает «пробудить, побудить, воздвигнуть для действия». «Поднял» естественно звучит по-русски и уместно в контексте появления завоевателя.
- source_word: מִמִּזְרָח
  choice: с востока
  rationale: Буквально — «от восхода»; обычное географическое значение — восток.
- source_word: צֶדֶק
  choice: по правде
  rationale: Сохраняет основное значение праведности/справедливости и допускает контекстуальные оттенки правого дела, оправдания и победы, не сводя слово только к одному из них.
- source_word: יִקְרָאֵהוּ לְרַגְלוֹ
  choice: призвал его по правде следовать за Собой
  rationale: Буквальное «призвал его к Своей ноге» в современном русском неясно; оборот לְרַגְלוֹ может обозначать следование за кем-либо или нахождение в его распоряжении. Заглавное «Собой» показывает наиболее вероятную отсылку к говорящему Богу, но не добавляет имени.
- source_word: יִתֵּן לְפָנָיו גּוֹיִם
  choice: Он отдаёт ему народы
  rationale: נתן с לְפָנָיו передаёт вручение или предание народов власти поднятого человека. Русское «отдаёт ему» естественнее буквального «даёт перед ним».
- source_word: וּמְלָכִים יַרְדְּ
  choice: и покоряет царей
  rationale: Форма и синтаксис трудны, однако контекст требует подчинения царей, а не наделения их властью. Перевод следует распространённому контекстуальному пониманию, сохраняя проблему в примечании.
- source_word: יִתֵּן כֶּעָפָר חַרְבּוֹ
  choice: его меч обращает их в прах
  rationale: В сжатой поэтической конструкции подразумеваются побеждённые народы и цари. «Обращает в прах» естественно передаёт сравнение с пылью и действие оружия.
- source_word: כְּקַשׁ נִדָּף קַשְׁתּוֹ
  choice: его лук — в гонимую ветром солому
  rationale: קשׁ обозначает сухую солому или жнивь, а נדף — нечто гонимое и развеваемое. Эллипсис продолжает глагол «обращает» из предыдущей строки.
theological_decisions:
- issue: Кто именно назван мужем с востока
  choice: Не называть его по имени
  alternative: Кир, Авраам или обобщённый завоеватель, воздвигнутый Богом
  rationale: Сам стих не называет этого человека. Указание имени в основном тексте преждевременно устранило бы намеренную открытость отсылки.
- issue: Смысл צֶדֶק в призвании
  choice: «по правде»
  alternative: «к победе», «по справедливости», «ради правого дела»
  rationale: Слово допускает связь с праведностью, справедливостью, оправданием и победой. Основной текст сохраняет его лексическое ядро, а примечание сообщает контекстуальные варианты.
translation_notes:
  register: Современный литературный русский, поэтический и достоинственный, без архаизмов вроде «воздвиг» и без конфессионально обусловленного отождествления безымянного завоевателя. Параллелизм двух образов оружия сохранён; трудные места отмечены сносками.
