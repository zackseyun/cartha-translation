source:
  edition: WLC
  text: אַל תִּֽירְאִי֙ תּוֹלַ֣עַת יַֽעֲקֹ֔ב מְתֵ֖י יִשְׂרָאֵ֑ל אֲנִ֤י עֲזַרְתִּי/ךְ֙ נְאֻם יְהוָ֔ה וְ/גֹאֲלֵ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/014.yaml
  text: Do not fear[a], worm Jacob, men of Israel; I myself help you, declares Yahweh, your Redeemer[c][b], the Holy One of Israel.
translation:
  language: ru
  text: Не бойся, червь Иаков, люди Израиля![a] Я сам помогу тебе[b], — возвещает Яхве, — твой Искупитель, Святой Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово может быть передано также: «мужи Израиля»; «люди Израиля» — собирательная передача. В этом контексте оно может подчёркивать человеческую немощь; «червь» — метафора униженности и бессилия.'
    reason: Лексическая альтернатива и пояснение метафоры.
  - marker: b
    text: 'Еврейскую глагольную форму можно также передать: «Я помог тебе» или «Я помогаю тебе»; в пророческом заверении совершенная форма может выражать несомненность Божьей помощи.'
    reason: Сохранение неоднозначности времени и аспекта.
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Не бойся
  rationale: Сочетание אַל с имперфектом выражает запрет; форма женского рода согласуется с обращением к общине, представленной именем «Иаков».
- source_word: תּוֹלַעַת יַעֲקֹב
  choice: червь Иаков
  rationale: Сохранена резкая метафора слабости и униженности; выражение понято как обращение-приложение, а не как буквальное описание.
- source_word: מְתֵי יִשְׂרָאֵל
  choice: смертные Израиля
  rationale: מְתֵי может обозначать людей, смертных; в параллели с «червь Иаков» слово подчёркивает человеческую немощь. Русское «мужи Израиля» могло бы неоправданно придать выражению оттенок силы или почётного звания.
- source_word: אֲנִי
  choice: Я Сам
  rationale: Отдельно выраженное местоимение имеет эмфатическую силу, естественно передаваемую по-русски частицей «Сам».
- source_word: עֲזַרְתִּיךְ
  choice: помогу тебе
  rationale: Формально перфект может в пророческом заверении представлять помощь как несомненную; будущее время естественно передаёт обещание в данном контексте, а альтернативы отмечены в сноске.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — торжественная пророческая формула, а имя יהוה передано как «Яхве», с сохранением личного имени.
- source_word: וְגֹאֲלֵךְ
  choice: твой Искупитель
  rationale: גֹּאֵל обозначает избавителя, имеющего право и обязанность вступиться за своего; в качестве божественного титула естественно традиционное «Искупитель».
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  rationale: Сохранена характерная для Исайи форма божественного титула и его торжественное звучание.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Временное значение עֲזַרְתִּיךְ
  choice: помогу тебе
  alternative: Я помог тебе; Я помогаю тебе
  rationale: Хотя форма морфологически является перфектом, в пророческом обещании она может выражать уверенность в предстоящем действии. Сноска сохраняет временную неоднозначность.
- issue: Смысл מְתֵי יִשְׂרָאֵל
  choice: смертные Израиля
  alternative: мужи Израиля; люди Израиля
  rationale: В параллели с образом червя вероятен акцент на бренности и бессилии. Выбор не ограничивает обращение только взрослыми мужчинами и сохраняет богословское напряжение между человеческой немощью и Божьей помощью.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Резкая исходная метафора сохранена без смягчения; архаизмы сведены к минимуму. Единственное число «тебе» отражает обращение к Израилю как к единой общине.
