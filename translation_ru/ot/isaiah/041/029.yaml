  text: הֵ֣ן כֻּלָּ֔/ם אָ֥וֶן אֶ֖פֶס מַעֲשֵׂי/הֶ֑ם ר֥וּחַ וָ/תֹ֖הוּ נִסְכֵּי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/029.yaml
  text: Look[a], all of them are nothing; their works are nothing[b]. Their cast images are wind and emptiness.
translation:
  language: ru
  text: Вот[a], все они — ничтожество; дела их — ничто. Их литые изображения[b] — ветер и пустота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поистине».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «литые идолы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Указательно-восклицательная частица вводит подчёркнутый итог; «вот» естественно передаёт её силу в современном литературном русском.
- source_word: כֻּלָּם
  choice: все они
  rationale: Сохраняет и значение совокупности, и выраженный местоименный элемент; формулировка не сужает референт только до идолов или только до их изготовителей.
- source_word: אָוֶן
  choice: ничтожество
  rationale: В полемике против идолов слово обозначает бесполезность и никчёмность; «ничтожество» сохраняет отвлечённый характер существительного и отличается от следующего אֶפֶס.
- source_word: אֶפֶס
  choice: ничто
  rationale: Предикативное «ничто» естественно и резко выражает полное отсутствие ценности или действенности.
- source_word: מַעֲשֵׂיהֶם
  choice: дела их
  rationale: 'Сохраняет широкий смысл: это могут быть как действия, так и сделанное ими; инверсия поддерживает достоинство и ритм пророческой речи.'
- source_word: רוּחַ
  choice: ветер
  rationale: В параллели с תֹהוּ слово указывает на неуловимость и бессодержательность; «дух» здесь мог бы создать неуместный богословский оттенок.
- source_word: תֹהוּ
  choice: пустота
  rationale: В данном контексте речь идёт о тщете и отсутствии содержания, а не обязательно о первозданном хаосе или бесформенности.
- source_word: נִסְכֵּיהֶם
  choice: литые изваяния
  rationale: Существительное обозначает изображения, изготовленные литьём; выражение понятно современному читателю и сохраняет способ изготовления, заключённый в еврейском слове.
theological_decisions:
- issue: К кому относится обличение
  choice: Сохранена широкая формулировка «все они», а заключительная строка прямо называет литые изваяния.
  alternative: Отнести всё высказывание исключительно к идолам либо одновременно к идолам и их изготовителям.
  rationale: Контекст направлен против идолов и их неспособности действовать или предсказывать, однако формы множественного числа допускают более широкий охват всей системы идолопоклонства. Перевод не устраняет эту неоднозначность.
- issue: Смысл אָוֶן и אֶפֶס
  choice: «ничтожество» и «ничто» передают бесполезность и полное отсутствие действенности.
  alternative: Передать אָוֶן как «зло» или «нечестие», а אֶפֶס как «небытие».
  rationale: Хотя אָוֶן может иметь нравственный оттенок зла, параллелизм и полемика с бессильными идолами выдвигают здесь на первый план их никчёмность; перевод не превращает поэтическое обличение в метафизическое утверждение о несуществовании материальных предметов.
translation_notes:
  register: Современный литературный русский с кратким, торжественным пророческим ритмом. Именные конструкции с тире передают резкость еврейского параллелизма; лексика понятна широкому читателю без разговорного снижения.
