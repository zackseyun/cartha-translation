  text: He pursues them and passes on safely[a], by a path his feet had not traveled.
translation:
  language: ru
  text: Он преследует их и невредимым идёт дальше[a] — по пути, по которому прежде не ступали его ноги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он преследует их и проходит с миром; по пути, по которому не шли его ноги». Заключительный оборот в еврейском тексте труден: он может подчёркивать как невредимое продвижение, так и движение по прежде нехоженому пути.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְדְּפֵם
  choice: Он преследует их
  rationale: Qal imperfect 3-го лица мужского рода единственного числа с суффиксом 3-го лица множественного числа от רדף. Настоящее время передаёт живую последовательность пророческого повествования и сохраняет значение активного преследования.
- source_word: יַעֲבוֹר
  choice: идёт дальше
  rationale: Глагол עבר означает «проходить, переходить, двигаться мимо или дальше». Здесь выражение обозначает продолжение победоносного продвижения, не уточняя, что именно он пересекает.
- source_word: שָׁלוֹם
  choice: невредимым
  rationale: Буквально «мир, благополучие»; в обстоятельственном употреблении слово указывает, что он продвигается целым и невредимым. Этот вариант естественен по-русски и не предполагает мирного характера самого военного похода.
- source_word: אֹרַח
  choice: по пути
  rationale: אֹרַח обозначает путь или тропу. Перевод сохраняет конкретный образ передвижения и естественно связывается с последующим упоминанием ног.
- source_word: בְּרַגְלָיו
  choice: его ноги
  rationale: Буквально «его ногами» или «при его ногах». В составе трудного заключительного оборота сохранён телесный образ ног, идущих по пути.
- source_word: לֹא יָבוֹא
  choice: прежде не ступали
  rationale: Буквально глагольная форма означает «не приходит/не входит». В сочетании с «путём» и «его ногами» она, вероятнее всего, описывает путь, по которому он до этого не ходил. «Не ступали» естественно передаёт этот образ; слово «прежде» эксплицирует временной смысл, подразумеваемый контекстом.
theological_decisions:
- issue: Смысл заключительного оборота אֹרַח בְּרַגְלָיו לֹא יָבוֹא
  choice: Завоеватель продвигается по пути, которым прежде не ходил.
  alternative: 'Он идёт путём, которого не касаются его ноги; либо: он приходит путём не своими ногами.'
  rationale: Древнееврейский оборот сжат и синтаксически труден. В контексте победоносного движения естественнее видеть указание на необычайно быстрое или прежде не совершавшееся продвижение, однако примечание сохраняет буквальную форму и не скрывает неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом. Формулировка сохраняет образ пути и ног, но избегает неестественного буквального синтаксиса; подлинная неоднозначность вынесена в примечание.
