  yaml_path: translation/ot/isaiah/041/027.yaml
  text: The first says to Zion[a], ‘Look[d][c][b], here they are!’ and to Jerusalem I give a herald of good news.
translation:
  language: ru
  text: 'Я первым говорю Сиону[a]: «Вот они!»[b] — и Иерусалиму Я даю вестника доброй вести.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза предельно сжата; буквально: «Первый — Сиону». Возможно также: «Я — первый, кто сказал Сиону» или «Сначала — Сиону».'
    reason: alternative_reading
  - marker: b
    text: В еврейском тексте не уточняется, к кому или к чему относится «они»; это могут быть ранее возвещённые люди или события.
    reason: alternative_reading
  - marker: c
    text: 'Возможно также: «Иерусалиму Я дам вестника доброй вести».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִאשׁוֹן
  choice: Первый
  rationale: Сохраняет основное значение «первый» и не вводит в текст отсутствующее явное местоимение «Я». Связка с подразумеваемым глаголом речи передаёт сжатый поэтический синтаксис.
- source_word: לְצִיּוֹן
  choice: Сиону
  rationale: 'Дательный падеж естественно передаёт направительное ל: весть обращена к Сиону.'
- source_word: הִנֵּה הִנָּם
  choice: «Вот они!»
  rationale: «Вот» передаёт указательную и эмфатическую силу выражения, а «они» сохраняет множественный суффикс, не уточняя его референт.
- source_word: וְלִירוּשָׁלַם
  choice: и Иерусалиму
  rationale: Сохраняет параллелизм с обращением к Сиону и направительное значение предлога.
- source_word: מְבַשֵּׂר
  choice: вестника с доброй вестью
  rationale: Естественно по-русски передаёт причастное обозначение человека, возвещающего хорошую новость, без излишне церковнославянской окраски слова «благовестник».
- source_word: אֶתֵּן
  choice: Я даю
  rationale: Настоящее время сохраняет живую пророческую декларацию и согласуется с непосредственным «вот»; подлежащее выражено окончанием еврейского глагола.
theological_decisions:
- issue: К кому относится множественное местоимение в выражении «вот они»
  choice: Референт оставлен неуточнённым, как в еврейском тексте.
  alternative: Возвращающиеся изгнанники; предсказанные события; Божьи посланники или орудия избавления.
  rationale: Контекст допускает несколько толкований, а сам стих прямо не называет референт; его уточнение искусственно сняло бы подлинную неоднозначность.
- issue: Кто назван «Первым»
  choice: Форма «Первый говорит» сохраняет существительное/субстантивированное прилагательное без прямого добавления «Я —».
  alternative: «Я первым говорю Сиону» или «Я — первый, кто сказал Сиону».
  rationale: В контексте говорящим является Господь, однако еврейская строка предельно сжата и не содержит здесь отдельного местоимения или глагола речи; основной текст не делает подразумеваемое полностью явным.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сжатость первой строки частично сохранена, но для русской грамматики добавлен подразумеваемый глагол «говорит». Терминология намеренно не привязана к конфессиональному словоупотреблению.
