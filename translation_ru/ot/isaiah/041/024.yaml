base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/024.yaml
  text: Look[a], you are from nothing, and your work is from nonexistence; whoever chooses you is an abomination.
translation:
  language: ru
  text: Вот, вы — ничто, и дела ваши — меньше, чем ничто[a]; тот, кто выбирает вас, — мерзость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово, переданное как «меньше, чем ничто», редко и трудно для понимания; возможно также: «из небытия».'
    reason: Сохраняет лексическую неопределённость מֵאָפַע и возможное несравнительное понимание предлога מִן.
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Эмфатическое указательное междометие; «вот» естественно для современного литературного русского языка и сохраняет торжественную силу пророческого обличения.
- source_word: מֵאַיִן
  choice: меньше, чем ничто
  rationale: Предлог מִן допускает сравнительное понимание, а אַיִן обозначает отсутствие и ничто. В полемике с идолами выражение подчёркивает их полную ничтожность.
- source_word: וּפָעָלְכֶם
  choice: и дела ваши
  rationale: פֹּעַל может обозначать дело, действие или результат деятельности. «Дела ваши» сохраняет широту значения и параллелизм.
- source_word: מֵאָפַע
  choice: ничтожнее ничтожного
  rationale: Редкое и трудное слово в параллели с מֵאַיִן, вероятно, усиливает мысль о полном отсутствии ценности. Формулировка передаёт риторическое нарастание, а неопределённость отмечена в сноске.
- source_word: תּוֹעֵבָה
  choice: мерзость
  rationale: Сильное библейское обозначение того, что вызывает нравственное и религиозное отвращение; «мерзость» сохраняет вес исходного слова.
- source_word: יִבְחַר בָּכֶם
  choice: тот, кто выбирает вас
  rationale: Единственное число имеет обобщённый смысл, а сочетание בחר ב־ означает выбор или предпочтение. Русская конструкция точно и естественно передаёт этот смысл.
theological_decisions:
- issue: К кому обращено местоимение второго лица множественного числа
  choice: Обращение относится к идолам или богам народов, которым брошен вызов в ближайшем контексте.
  alternative: Возможна метонимическая отсылка к изготовителям идолов.
  rationale: Контекст требует от богов показать знание и силу, а заключительная часть осуждает выбирающего их. Прямое обращение сохранено без поясняющей вставки.
- issue: Синтаксическая связь תּוֹעֵבָה יִבְחַר בָּכֶם
  choice: «Тот, кто выбирает вас, — мерзость».
  alternative: «Он выбирает среди вас мерзость» или «мерзость выбирает вас».
  rationale: Порядок слов допускает формальную неоднозначность, однако обобщённое подлежащее при יִבְחַר и именная характеристика תּוֹעֵבָה лучше всего соответствуют контексту и обычному пониманию фразы.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм и риторическое усиление сохранены; архаизмы и конфессионально окрашенные пояснения не вводятся.
