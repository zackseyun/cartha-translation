base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/023.yaml
  text: Declare to us the things to come afterward[a], that we may know that you are gods; indeed, do good or do harm[c][b], that we may be dismayed and see together.
translation:
  language: ru
  text: Возвестите нам, что произойдёт потом[a], чтобы мы узнали, что вы — боги. Сделайте же хоть добро, хоть зло[b], чтобы мы пришли в смятение[c] и вместе увидели это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «последующее». Еврейское выражение означает то, что наступит позже; здесь это требование предсказать будущее.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «сделайте добро и сделайте зло». Это вызов показать хоть какую-нибудь реальную силу — благотворную или пагубную.'
    reason: lexical_alternative
  - marker: c
    text: Переведённый словами «прийти в смятение» глагол редок; он может также означать «взглянуть с изумлением» или «озираться в тревоге».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Возвестите
  rationale: Повелительная форма множественного числа требует публично объявить нечто; «возвестите» сохраняет торжественно-полемический тон и остаётся понятным современному читателю.
- source_word: הָאֹתִיּוֹת לְאָחוֹר
  choice: что произойдёт потом
  rationale: Буквально выражение обозначает «последующее»; в контексте это требование предсказать будущие события. Выбранный вариант ясно передаёт временной смысл.
- source_word: וְנֵדְעָה
  choice: чтобы мы узнали
  rationale: Когортатив после повелительной формы выражает цель или результат.
- source_word: כִּי אֱלֹהִים אַתֶּם
  choice: что вы — боги
  rationale: Обращение стоит во множественном числе и направлено к ложным божествам; множественное «боги» точно сохраняет полемический смысл.
- source_word: אַף
  choice: же
  rationale: Частица усиливает следующий вызов; русское «же» естественно передаёт настойчивость в данном контексте.
- source_word: תֵּיטִיבוּ וְתָרֵעוּ
  choice: Сделайте же хоть добро, хоть зло
  rationale: Парные глаголы требуют проявить любую действенную силу — благотворную или пагубную. Конструкция «хоть… хоть…» естественно передаёт риторический вызов, не приписывая поступкам нравственного одобрения.
- source_word: וְנִשְׁתָּעָה
  choice: чтобы мы пришли в смятение
  rationale: Редкая форма допускает оттенки испуга, изумления и тревожного созерцания. «Прийти в смятение» передаёт вероятную реакцию на предполагаемое проявление силы, не устраняя лексическую неопределённость, отмеченную в сноске.
- source_word: וְנִרְאֶה
  choice: и увидели
  rationale: Передан простой глагол первого лица множественного числа без добавления отсутствующего в еврейском тексте прямого дополнения.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Прямо передаёт наречие совместности и коллективную реакцию говорящих.
theological_decisions:
- issue: Передача אֱלֹהִים в полемике против идолов
  choice: боги
  alternative: божественные существа; Бог
  rationale: Сказуемое относится к адресатам во множественном числе. «Боги» сохраняет и грамматику, и насмешливый вызов ложным божествам, не подменяя его единственным числом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Возвестите» поддерживает возвышенный полемический тон, тогда как остальной синтаксис остаётся прозрачным. Тире перед «боги» подчёркивает именную часть сказуемого без богословского переосмысления. Подлинная неопределённость редкого וְנִשְׁתָּעָה сохранена в сноске.
