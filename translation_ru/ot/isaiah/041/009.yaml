base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/009.yaml
  text: you whom I took hold of from the ends of the earth[a], and called from its farthest corners, and said to you, ‘You are my servant; I have chosen you and not rejected you,’
translation:
  language: ru
  text: 'тебя, кого Я взял с краёв земли и призвал из её самых дальних пределов[a], кому сказал: «Ты — Мой раб; Я избрал тебя и не отверг тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «из её оконечностей». Еврейское слово, переведённое как «пределов», понимают по-разному; некоторые переводят: «из среды её знатных», однако географическое значение лучше соответствует параллелизму с выражением «с краёв земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזַקְתִּיךָ
  choice: Я взял
  rationale: 'В породе hифиль глагол חזק здесь передаёт конкретное действие: Бог взял Израиль из отдалённых земель. «Взял» естественно звучит по-русски и не вносит идеи внутреннего укрепления.'
- source_word: מִקְצוֹת הָאָרֶץ
  choice: от краёв земли
  rationale: Устойчивый поэтический образ наиболее удалённых областей; сохраняет пространственный размах еврейского выражения.
- source_word: וּמֵאֲצִילֶיהָ
  choice: из самых дальних её пределов
  rationale: Географическое значение хорошо соответствует параллелизму с «краями земли», хотя еврейское слово допускает и иное понимание; неоднозначность отмечена в сноске.
- source_word: קְרָאתִיךָ
  choice: призвал
  rationale: «Призвал» передаёт не только обращение по имени, но и властный Божий зов, оставаясь естественным для современного литературного русского языка.
- source_word: עַבְדִּי
  choice: Мой раб
  rationale: עבד обозначает принадлежащего господину раба или слугу. В обращении Бога к Израилю «раб» сохраняет отношение принадлежности и служения и является укоренённым библейским термином в русском языке.
- source_word: בְּחַרְתִּיךָ
  choice: Я избрал тебя
  rationale: Совершенный вид выражает состоявшийся выбор, сохраняющий силу в настоящем; «избрал» соответствует возвышенному, но понятному регистру пророческой речи.
- source_word: מְאַסְתִּיךָ
  choice: не отверг тебя
  rationale: מאס означает отвергнуть или отказаться принять. «Не отверг» ясно передаёт заверение в продолжающемся Божьем принятии без излишнего эмоционального усиления.
theological_decisions:
- issue: К кому относится единственное число второго лица
  choice: 'Сохранено обращение к одному адресату: «тебя», «ты»'
  alternative: Передать обращение множественным числом как обращение ко всему народу
  rationale: Еврейский текст последовательно употребляет мужской род единственного числа, поскольку Иаков/Израиль представлен как единый, собирательный раб. Единственное число сохраняет литературное и богословское напряжение текста.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет связь с предшествующим контекстом: стих начинается относительным оборотом «тебя, кого…». Прописные буквы в местоимениях, относящихся к Богу, использованы согласно принятой русской библейской издательской традиции.'
