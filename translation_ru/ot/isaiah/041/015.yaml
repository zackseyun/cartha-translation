  text: הִנֵּ֣ה שַׂמְתִּ֗י/ךְ לְ/מוֹרַג֙ חָר֣וּץ חָדָ֔שׁ בַּ֖עַל פִּֽיפִיּ֑וֹת תָּד֤וּשׁ הָרִים֙ וְ/תָדֹ֔ק וּ/גְבָע֖וֹת כַּ/מֹּ֥ץ תָּשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/015.yaml
  text: Behold[a], I have made you a new sharp threshing sledge with double edges; you will thresh the mountains and crush them, and you will make the hills like chaff.
translation:
  language: ru
  text: Вот, Я сделал тебя новыми, острыми молотильными санями, снабжёнными режущими кромками[a]. Ты будешь молотить горы и измельчать их, а холмы превратишь в мякину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально означает «обладающие устами»; в данном образе оно, вероятно, указывает на режущие части орудия. Возможны переводы: «с обоюдоострыми лезвиями», «со множеством режущих кромок» или «с зазубренными зубьями».'
    reason: Необычное выражение בַּעַל פִּיפִיּוֹת не позволяет с уверенностью установить точное устройство режущих частей молотильного орудия.
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный и выразительный указательный маркер, сохраняющий пророческое привлечение внимания без архаичного оттенка.
- source_word: שַׂמְתִּיךְ
  choice: Я сделал тебя
  rationale: Глагол שׂוּם здесь вводит образ превращения адресата в орудие; совершенная форма передана как уже совершённое Божье действие с сохраняющимся результатом.
- source_word: לְמוֹרַג
  choice: молотильными санями
  rationale: מוֹרַג обозначает тяжёлое молотильное орудие, которым дробили колосья; «молотильные сани» — точный и принятый русский термин.
- source_word: חָרוּץ חָדָשׁ
  choice: новыми острыми
  rationale: 'Сохранены оба определения орудия: его новизна и режущая острота.'
- source_word: בַּעַל פִּיפִיּוֹת
  choice: со множеством режущих зубьев[a]
  rationale: Контекст молотильного орудия указывает на режущие выступы или кромки. Формулировка естественна по-русски, а неоднозначность необычного еврейского выражения отражена в сноске.
- source_word: תָּדוּשׁ
  choice: Ты будешь молотить
  rationale: Сохранён основной сельскохозяйственный смысл דּוּשׁ и продолжена метафора молотьбы.
- source_word: הָרִים
  choice: горы
  rationale: Конкретный поэтический образ сохранён без истолкования гор как народов, врагов или препятствий.
- source_word: וְתָדֹק
  choice: и измельчать их
  rationale: דקק означает дробить или обращать в мелкие частицы; местоимение «их» естественно отсылает к горам.
- source_word: וּגְבָעוֹת כַּמֹּץ תָּשִׂים
  choice: а холмы превратишь в мякину
  rationale: «Превратишь» ясно передаёт результативное значение שׂוּם, а «мякина» сохраняет образ лёгких остатков после молотьбы.
theological_decisions:
- issue: Образ Израиля как молотильного орудия
  choice: 'Сохранить конкретную сельскохозяйственную метафору: горы перемалываются, а холмы становятся мякиной.'
  alternative: Прямо назвать горы и холмы народами, врагами или великими препятствиями.
  rationale: Сам стих не раскрывает референты образа. Их прямое истолкование сняло бы намеренную поэтическую и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой интонации. Техническое выражение «молотильные сани» поддерживает предметность древнего образа; остальная синтаксическая конструкция сделана прозрачной для обычного читателя.
