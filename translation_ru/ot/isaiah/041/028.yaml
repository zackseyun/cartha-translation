base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/028.yaml
  text: And I looked[a], but there was no man; among these there was no counselor, that I might ask them[b] and they would answer a word.
translation:
  language: ru
  text: Я посмотрел, но не было ни одного человека[a]; среди них не нашлось советника. Если бы Я спросил их[b], они дали бы ответ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но никого не было». Буквально: «не было человека (мужчины)»; форма единственного числа здесь может употребляться в представительном значении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и они ответили бы слово»; то есть «дали бы ответ» или «ответили бы хоть что-нибудь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרֶא
  choice: Я посмотрел
  rationale: Форма Qal 1-го лица ед. числа от ראה в данном пророческом контексте передаёт осмотр и оценку; прошедшее время естественно продолжает речь о произведённом поиске.
- source_word: וְאֵין אִישׁ
  choice: но не было ни одного человека
  rationale: אִישׁ буквально обозначает «мужчину; человека», а здесь репрезентативно указывает на отсутствие того, кто мог бы ответить. Оборот «ни одного человека» сохраняет единственное число и естественно звучит по-русски.
- source_word: וּמֵאֵלֶּה
  choice: среди этих
  rationale: 'Предлог מִן при указательном אֵלֶּה лучше понимать партитивно: ни одного из тех, кто только что был подвергнут проверке. Перевод не уточняет их референта сверх сказанного в тексте.'
- source_word: וְאֵין יוֹעֵץ
  choice: не нашлось советника
  rationale: Причастная форма יוֹעֵץ обозначает того, кто даёт совет. «Не нашлось советника» естественно выражает отсутствие такого лица в ходе поиска.
- source_word: וְאֶשְׁאָלֵם
  choice: чтобы Я мог спросить их
  rationale: 'Имперфект с союзом допускает целевое или потенциальное понимание: не оказалось советника, которого можно было бы спросить. Местоименное окончание 3-го лица мн. числа передано словом «их».'
- source_word: וְיָשִׁיבוּ דָבָר
  choice: и они ответили бы хотя бы словом
  rationale: Hiphil от שוב здесь означает «ответить», а דָבָר буквально — «слово». Условное «ответили бы» согласуется с потенциальным характером предыдущей формы; «хотя бы словом» передаёт риторически подчёркнутое отсутствие какого-либо ответа.
theological_decisions:
- issue: Кого обозначает «эти» и среди кого нет советника
  choice: 'Референт оставлен неопределённым: «среди этих».'
  alternative: Явно назвать идолов, их представителей либо народы и их богов.
  rationale: Ближайший контекст представляет судебный вызов идолам, однако сам стих употребляет только указательное местоимение. Перевод не устраняет эту текстовую недосказанность.
- issue: Передача אִישׁ
  choice: «ни одного человека»
  alternative: «ни одного мужчины» или просто «никого»
  rationale: Слово имеет грамматически мужскую форму, но здесь репрезентативно означает человека, способного выступить и ответить. Русское «человек» сохраняет личный и единственный характер выражения без неоправданного ограничения только взрослыми мужчинами.
- issue: Модальность заключительных глаголов
  choice: 'Потенциально-целевое прочтение: «чтобы Я мог спросить… ответили бы».'
  alternative: 'Последовательность совершившихся действий: «Я спросил их, но они ничего не ответили».'
  rationale: Формы имперфекта в синтаксическом окружении допускают потенциальное прочтение, соответствующее отсутствию кого-либо, к кому можно обратиться. Перевод сохраняет эту логику, не превращая вопрос в явно состоявшееся действие.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой судебной речи. Заглавное «Я» указывает на говорящего Бога согласно устойчивой русской библейской практике. Точка с запятой сохраняет двухчастное построение стиха, а условные формы передают потенциальность заключительной фразы.
