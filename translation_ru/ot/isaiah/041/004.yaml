base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/004.yaml
  text: Who has acted and done this[a], calling the generations from the beginning? I, Yahweh, am the first, and with the last ones—I am he.
translation:
  language: ru
  text: Кто совершил и сделал это, призывая поколения от начала? Я, Яхве, — первый, и с последними — Я тот же.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская конструкция допускает также перевод: «и с последним — Я тот же». Традиционно её понимают как утверждение, что Яхве остаётся с поколениями от первого до последнего.'
    reason: Альтернативное прочтение трудной эллиптической конструкции וְאֶת אַחֲרֹנִים.
lexical_decisions:
- source_word: מִי
  choice: Кто
  rationale: Вопросительное местоимение вводит риторический вопрос.
- source_word: פָעַל וְעָשָׂה
  choice: совершил и сделал это
  rationale: Сохранены оба глагола, совместно подчёркивающие действенность; «это» добавлено по-русски как указание на описанные ранее события.
- source_word: קֹרֵא
  choice: вызывая
  rationale: Причастие передаёт характерное действие; «вызывать» здесь означает властно призывать поколения к существованию и выводить их на историческую сцену.
- source_word: הַדֹּרוֹת
  choice: поколения
  rationale: Прямое и естественное соответствие, сохраняющее представление о последовательности поколений.
- source_word: מֵרֹאשׁ
  choice: от начала
  rationale: 'Передаёт временной смысл: от самого начала истории.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: רִאשׁוֹן
  choice: первый
  rationale: Предикативное определение выражает первенство и предшествование Бога.
- source_word: וְאֶת אַחֲרֹנִים
  choice: и с последними
  rationale: Сохраняет трудную еврейскую конструкцию со значением совместности и множественное число אַחֲרֹנִים, не превращая её без пояснения в утверждение «последний».
- source_word: אֲנִי הוּא
  choice: Я тот же
  rationale: Естественно по-русски передаёт краткую формулу неизменной самоидентификации, не добавляя нового предиката.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон, поэтому сохранено личное имя Бога.
- issue: Отношение Бога к «последним» в וְאֶת אַחֲרֹנִים
  choice: «с последними Я тот же»
  alternative: «Я — первый и последний»; «с последним поколением Я тот же»
  rationale: Выбранный вариант сохраняет множественное число и вероятное значение «с», а также эллиптичность оригинала; он не подменяет конструкцию знакомой, но текстуально иной формулой.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Параллелизм и краткость еврейского текста по возможности сохранены; подлинная неоднозначность последней части отмечена сноской.
