id: ISA.41.17
reference: Isaiah 41:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הָ/עֲנִיִּ֨ים וְ/הָ/אֶבְיוֹנִ֜ים מְבַקְשִׁ֥ים מַ֨יִם֙ וָ/אַ֔יִן לְשׁוֹנָ֖/ם בַּ/צָּמָ֣א נָשָׁ֑תָּה אֲנִ֤י יְהוָה֙ אֶעֱנֵ֔/ם אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֹ֥א אֶעֶזְבֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/017.yaml
  text: The poor and needy seek water[a], but there is none; their tongue is parched with thirst. I, Yahweh, will answer them; I, the God of Israel, will not forsake them.
translation:
  language: ru
  text: Бедные и нуждающиеся ищут воды, но её нет; язык у них пересох от жажды. Я, Яхве[a], отвечу им; Я, Бог Израиля, не оставлю их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH), личное имя Бога; традиционно также передаётся как «Господь».
    reason: Передача божественного имени и традиционная альтернатива.
lexical_decisions:
- source_word: הָעֲנִיִּים
  choice: бедные
  rationale: В сочетании с אֶבְיוֹנִים здесь прежде всего обозначает людей, терпящих материальную нужду или угнетение; «бедные» естественно передаёт основной смысл, не сводя слово к духовному смирению.
- source_word: וְהָאֶבְיוֹנִים
  choice: и нуждающиеся
  rationale: Слово обозначает людей, испытывающих нужду. Такой перевод сохраняет смысловое различие между двумя параллельными названиями и звучит естественно по-русски.
- source_word: מְבַקְשִׁים מַיִם
  choice: ищут воды
  rationale: Причастие изображает продолжающееся действие; настоящее время сохраняет живость пророческой картины. Родительный падеж после «ищут» уместен в возвышенной поэтической речи.
- source_word: וָאַיִן
  choice: но её нет
  rationale: Частица отсутствия относится к искомой воде. Союз «но» ясно выражает контраст, а местоимение позволяет избежать тяжеловесного повтора.
- source_word: לְשׁוֹנָם בַּצָּמָא נָשָׁתָּה
  choice: язык у них пересох от жажды
  rationale: Еврейский текст употребляет собирательное единственное число «их язык». Русская конструкция «язык у них» естественно сохраняет этот образ, а «пересох от жажды» точно передаёт высыхание вследствие жажды.
- source_word: אֲנִי יְהוָה
  choice: Я, Яхве
  rationale: Самостоятельное местоимение придаёт высказыванию особое ударение. Личное имя יהוה передано распространённой русской транслитерацией «Яхве», а не заменено титулом.
- source_word: אֶעֱנֵם
  choice: отвечу им
  rationale: Глагол ענה прямо означает «ответить, откликнуться»; перевод сохраняет обещание Божьего ответа на их бедственное положение.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Я, Бог Израиля
  rationale: Повтор «Я» передаёт параллельное эмфатическое построение еврейской строки и ясно связывает обещание с Богом Израиля.
- source_word: לֹא אֶעֶזְבֵם
  choice: не оставлю их
  rationale: עזב может означать оставить или покинуть. «Не оставлю» звучит современно и достойно, сохраняя всю силу обещания верности без излишне архаичного оттенка.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога, а не титул. «Яхве» сохраняет различие между именем יהוה и словом אֲדֹנָי («Господь»); традиционный вариант указан в примечании.
- issue: Характер обещания אֶעֱנֵם
  choice: отвечу им
  alternative: откликнусь на их нужду
  rationale: Буквальный глагол «отвечу» сохраняет как непосредственный отклик Бога, так и возможный более широкий смысл ответа делом, не уточняя то, чего прямо не уточняет еврейский текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Синтаксический параллелизм и повтор «Я» сохранены; архаизмы по возможности исключены.
