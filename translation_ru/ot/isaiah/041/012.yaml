base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/012.yaml
  text: You will seek them and not find them—those men who contend with you[a]. The men who wage war against you will become like nothing[b], like nonexistence.
translation:
  language: ru
  text: Ты будешь искать их, но не найдёшь — тех, кто враждует с тобой[a]. Те, кто воюет против тебя, станут как ничто, как небытие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «людей твоей распри»; то есть тех, кто спорит, борется или враждует с тобой.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как ничто и как אֶפֶס»; второе слово может означать полное отсутствие, ничтожество или небытие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַקְשֵׁם
  choice: Ты будешь искать их
  rationale: Пиэль глагола בקש означает «искать»; формулировка естественна по-русски и сохраняет параллель с «не найдёшь».
- source_word: וְלֹא תִמְצָאֵם
  choice: но не найдёшь
  rationale: מצא в породе каль означает «находить». Противительный союз «но» естественно передаёт смысловое противопоставление результата поиску, хотя еврейский текст использует простое וְ.
- source_word: אַנְשֵׁי מַצֻּתֶךָ
  choice: тех, кто враждует с тобой
  rationale: Буквально «люди твоей распри»; מַצּוּת обозначает распрю, тяжбу или противоборство. Относительный оборот сохраняет личный характер противников и звучит естественно.
- source_word: יִהְיוּ
  choice: станут
  rationale: היה может означать как «быть», так и «становиться»; здесь контекст обещанного устранения врагов поддерживает переходное значение «станут».
- source_word: כְאַיִן
  choice: как ничто
  rationale: אַיִן выражает отсутствие или небытие; «как ничто» сохраняет сравнительную частицу כְּ и поэтическую краткость.
- source_word: וּכְאֶפֶס
  choice: словно их и не было
  rationale: אֶפֶס может обозначать полное отсутствие, ничтожество или небытие. Идиоматическая русская формулировка передаёт усиление, не сводя оба параллельных выражения к одному слову.
- source_word: אַנְשֵׁי מִלְחַמְתֶּךָ
  choice: Те, кто воюет против тебя
  rationale: Буквально «люди твоей войны», то есть ведущие войну против адресата. Перевод ясно и естественно выражает направленность вражды.
theological_decisions:
- issue: Степень буквальности образов полного исчезновения врагов
  choice: Сохранить конкретное «искать, но не найти» и передать два параллельных образа как «как ничто, словно их и не было»
  alternative: 'Повторить «как ничто» дважды либо истолковать: «они полностью исчезнут»'
  rationale: Выбор сохраняет нарастающий поэтический параллелизм и риторику суда, но не превращает её в отвлечённое метафизическое утверждение об уничтожении бытия.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Единственное число «ты» сохранено по еврейскому тексту; формулировки понятны без церковнославянизмов. Тире подчёркивает пояснение к местоимению «их».
