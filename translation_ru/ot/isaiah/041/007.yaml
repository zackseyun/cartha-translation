  text: וַ/יְחַזֵּ֤ק חָרָשׁ֙ אֶת צֹרֵ֔ף מַחֲלִ֥יק פַּטִּ֖ישׁ אֶת ה֣וֹלֶם פָּ֑עַם אֹמֵ֤ר לַ/דֶּ֨בֶק֙ ט֣וֹב ה֔וּא וַ/יְחַזְּקֵ֥/הוּ בְ/מַסְמְרִ֖ים לֹ֥א יִמּֽוֹט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/007.yaml
  text: The craftsman strengthens the metalworker[a]; the one who smooths with the hammer strengthens the one who strikes the anvil, saying of the soldering, “It is good”[b]; then he fastens it with nails so that it will not totter.
translation:
  language: ru
  text: 'Мастер поддерживает мастера по металлу; тот, кто разглаживает молотком, поддерживает того, кто бьёт по наковальне, и говорит о спайке: «Она хороша!»[a] Затем он закрепляет его гвоздями, чтобы он не шатался.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о соединении», «о припое»; менее вероятно: «о клее». Еврейское слово может обозначать материал или способ, которым соединяют части изделия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы он не сдвинулся» или «чтобы он не опрокинулся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: поддерживает
  rationale: Порода пиэль глагола חזק может означать «укреплять» или «поддерживать». В отношении одного мастера к другому «поддерживает» естественно по-русски и сохраняет возможность как практической помощи, так и взаимного ободрения.
- source_word: חָרָשׁ
  choice: мастер
  rationale: Общее обозначение искусного ремесленника; выбор не сужает его занятие до кузнечного дела.
- source_word: צֹרֵף
  choice: мастер по металлу
  rationale: Причастие обозначает плавильщика или очистителя металла. Общее выражение не ограничивает смысл ювелиром или золотых дел мастером.
- source_word: מַחֲלִיק פַּטִּישׁ
  choice: разглаживающий молотком
  rationale: Передаёт причастную конструкцию и вероятное значение обработки и выравнивания металлической поверхности.
- source_word: הוֹלֶם פָּעַם
  choice: тот, кто бьёт по наковальне
  rationale: הוֹלֶם означает наносящего удары, а פָּעַם в данном ремесленном контексте, вероятно, обозначает наковальню или ударную поверхность.
- source_word: לַדֶּבֶק
  choice: о спайке
  rationale: דבק указывает на соединение, соединяющее вещество или процесс. В контексте обработки металла «спайка» звучит естественно, а неоднозначность отмечена в сноске.
- source_word: טוֹב הוּא
  choice: Хороша!
  rationale: Краткая оценка качества работы; женский род обусловлен русским словом «спайка».
- source_word: וַיְחַזְּקֵהוּ בְמַסְמְרִים
  choice: и закрепляет его гвоздями
  rationale: Второе употребление חזק описывает физическое закрепление предмета. Местоимение сохраняет не названный прямо в стихе объект.
- source_word: לֹא יִמּוֹט
  choice: чтобы он не шатался
  rationale: Глагол в нифале допускает значения «шататься», «сдвигаться» и «падать». «Не шатался» сохраняет образ неустойчивого предмета и пророческую иронию.
theological_decisions:
- issue: Изображение изготовления идола в пророческой сатире
  choice: Не вводить слово «идол» в основной текст, сохранив не названный прямо объект в форме местоимения.
  alternative: Для ясности прямо назвать закрепляемый предмет идолом или изваянием.
  rationale: Из ближайшего контекста ясно, о чём идёт речь, однако сам еврейский стих описывает работу мастеров, не называя объект. Местоимение сохраняет сдержанную иронию и не расширяет исходный текст.
- issue: Взаимодействие ремесленников
  choice: Передать חזק словом «поддерживает», допускающим практическую помощь и ободрение.
  alternative: «Укрепляет» или «ободряет».
  rationale: Контекст позволяет как социальный, так и практически-ремесленный оттенок; перевод не должен преждевременно устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением ремесленной образности и краткого параллелизма. Эллипсис второго сказуемого передан тире. Слово «идол» не добавлено; местоименный объект оставлен неявным, как в еврейском тексте.
