  source_fidelity: 'В целом переданы все основные элементы еврейского текста: два ремесленника, обработка молотком, удар по наковальне, оценка спайки и закрепление гвоздями. Однако исходное тире в конструкции «разглаживающий молотком — того» слишком резко обрывает параллельную глагольную конструкцию и затрудняет связь последующего «он говорит» с действующим лицом. Явное повторение глагола и присоединение речи к тому же подлежащему точнее отражают סדר причастных конструкций и אֹמֵר.'
