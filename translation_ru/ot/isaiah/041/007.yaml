revisions:
- from: 'Мастер поддерживает мастера по металлу; разглаживающий молотком — того, кто бьёт по наковальне. О спайке он говорит: «Хороша!»[a] — и закрепляет его гвоздями, чтобы он не шатался.[b]'
  to: 'Мастер поддерживает мастера по металлу; тот, кто разглаживает молотком, поддерживает того, кто бьёт по наковальне, и говорит о спайке: «Она хороша!»[a] Затем он закрепляет его гвоздями, чтобы он не шатался.[b]'
