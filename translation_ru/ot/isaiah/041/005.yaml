base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/005.yaml
  text: The coastlands have seen and fear[a]; the ends of the earth tremble[b]. They draw near and come.
translation:
  language: ru
  text: Прибрежные земли увидели и испугались; края земли задрожали. Они приблизились и пришли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאוּ
  choice: увидели это
  rationale: Перфект передан завершённым действием; местоимение «это» естественно по-русски обозначает увиденное действие, явное из контекста, не уточняя его сверх исходного текста.
- source_word: אִיִּים
  choice: дальние острова
  rationale: В Исаии слово обозначает острова и морские, удалённые земли. «Дальние острова» сохраняет конкретный образ и одновременно передаёт географическую удалённость.
- source_word: וְיִירָאוּ
  choice: и испугались
  rationale: Глагол ירא здесь выражает страх в ответ на увиденное, а не обязательно благоговейное поклонение.
- source_word: קְצוֹת הָאָרֶץ
  choice: края земли
  rationale: Устойчивый и понятный русский эквивалент древнееврейского обозначения самых отдалённых областей мира.
- source_word: יֶחֱרָדוּ
  choice: задрожали
  rationale: Передаёт как телесную дрожь, так и вызвавший её страх, не сводя значение лишь к внутреннему ужасу.
- source_word: קָרְבוּ
  choice: они приблизились
  rationale: Сохраняет значение движения к некоторой точке, не определённой в самом стихе.
- source_word: וַיֶּאֱתָיוּן
  choice: и пришли
  rationale: Поэтический глагол прихода передан непосредственно; сохранена намеренная близость двух последовательных глаголов движения.
theological_decisions:
- issue: Характер реакции далёких народов
  choice: Страх и дрожь переданы без указания на покаяние, поклонение или враждебное объединение.
  alternative: Истолковать страх как благоговение либо приближение как враждебное сплочение.
  rationale: Стих явно говорит о страхе, дрожи и приближении, но сам по себе не определяет духовный или политический смысл приближения; эта напряжённость сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Параллелизм и краткая последовательность глаголов сохранены; архаизмы исключены.
