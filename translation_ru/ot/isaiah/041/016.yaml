base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/016.yaml
  text: You will winnow them[a], and the wind will carry them away, and the storm will scatter them; but you will rejoice in Yahweh[c][b]; in the Holy One of Israel you will boast.
translation:
  language: ru
  text: Ты провеешь их[a], ветер унесёт их, и буря рассеет их. А ты будешь радоваться Яхве[b], Святым Израиля будешь хвалиться[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «развеешь их». Еврейский глагол может означать рассеивание вообще; перевод «провеешь» сохраняет образ молотьбы и веяния зерна из контекста.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте стоит личное имя Бога — יהוה (YHWH), здесь переданное как «Яхве».
    reason: alternative_reading
  - marker: c
    text: 'Или: «будешь находить свою славу в Святом Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרֵם
  choice: Ты провеешь их
  rationale: Глагол זרה может обозначать как рассеивание вообще, так и веяние зерна. «Провеешь» сохраняет образ молотьбы из ближайшего контекста и естественно передаёт отделение мякины ветром.
- source_word: רוּחַ
  choice: ветер
  rationale: Параллелизм с бурей и действие унесения указывают здесь на метеорологическое значение, а не на «дух» или «дыхание».
- source_word: תִּשָּׂאֵם
  choice: унесёт их
  rationale: נשׂא буквально означает «поднять, нести»; в образе провеянной мякины контекстуальный результат лучше всего передаёт «унесёт».
- source_word: סְעָרָה
  choice: буря
  rationale: Слово обозначает сильный, бурный ветер. «Буря» — современное и достаточно широкое соответствие без излишнего уточнения вроде «смерч».
- source_word: תָּפִיץ
  choice: рассеет их
  rationale: Каузативная форма פוץ означает «заставить рассеяться, разогнать»; «рассеет» кратко и точно продолжает образ мякины.
- source_word: תָּגִיל
  choice: будешь радоваться
  rationale: גיל выражает сильную радость и ликование. «Будешь радоваться» звучит естественно в современном русском и не ослабляет положительного смысла в данном контексте.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: Предлог ב отмечает того, в ком или благодаря кому человек радуется. По-русски прямое дополнение при «радоваться» естественно передаёт направленность радости, а личное имя יהוה сохранено как «Яхве».
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: Святым Израиля
  rationale: Значимый для Исаии божественный титул передан полностью. Творительный падеж естественно сочетается с «хвалиться» и сохраняет Бога как основание хвалы.
- source_word: תִּתְהַלָּל
  choice: будешь хвалиться
  rationale: Возвратная порода הלל означает «хвалиться, находить свою славу». Здесь речь не о самовосхвалении, а о радостной уверенности, основанной на Боге.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет различие между именем и титулом и соответствует наиболее вероятной научной реконструкции произношения.
- issue: Смысл выражения תִּתְהַלָּל
  choice: будешь хвалиться
  alternative: будешь славиться; будешь торжествовать
  rationale: 'Форма допускает оттенок «находить свою славу». «Хвалиться» сохраняет напряжение исходного выражения: предметом уверенной хвалы является не сам человек, а Святой Израиля.'
translation_notes:
  register: Современный литературный русский язык с поэтическим параллелизмом. Синтаксис остаётся ясным и торжественным без архаизмов; повтор местоимения «их» сохраняет ритм и предметную ясность еврейского текста.
