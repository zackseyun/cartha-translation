  text: הַחֲרִ֤ישׁוּ אֵלַ/י֙ אִיִּ֔ים וּ/לְאֻמִּ֖ים יַחֲלִ֣יפוּ כֹ֑חַ יִגְּשׁוּ֙ אָ֣ז יְדַבֵּ֔רוּ יַחְדָּ֖ו לַ/מִּשְׁפָּ֥ט נִקְרָֽבָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/001.yaml
  text: Be silent before me[a], coastlands; let the peoples renew their strength. Let them come near; then let them speak[c][b]. Together let us draw near for judgment.
translation:
  language: ru
  text: Умолкните предо Мною, приморские земли[a], и пусть народы обновят силы[b]. Пусть они приблизятся, затем пусть говорят. Вместе приблизимся на суд[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «острова» либо «далёкие побережья»; еврейское слово может широко обозначать приморские и удалённые земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наберутся новых сил»; еврейское выражение буквально связано со сменой или обновлением силы.'
    reason: lexical_alternative
  - marker: c
    text: Еврейский текст буквально говорит о совместном приближении «на суд», что создаёт картину судебного разбирательства.
    reason: cultural_note
lexical_decisions:
- source_word: הַחֲרִישׁוּ אֵלַי
  choice: Умолкните предо Мною
  rationale: Повелительная форма требует тишины перед обращающимся; сочетание с אֵלַי буквально означает «ко Мне», но в сцене судебного вызова естественно по-русски передаётся как «предо Мною».
- source_word: אִיִּים
  choice: приморские земли
  rationale: В пророческой речи слово может обозначать не только острова, но и далёкие морские побережья и прибрежные страны; выбран широкий и естественный русский эквивалент.
- source_word: וּלְאֻמִּים
  choice: и пусть народы
  rationale: לְאֻמִּים обозначает народы или этнические общности; «народы» сохраняет множественное число и параллелизм.
- source_word: יַחֲלִיפוּ כֹחַ
  choice: обновят силы
  rationale: Идиома говорит о смене или восстановлении сил; «обновят силы» сохраняет образ и хорошо соответствует подготовке к предстоящему разбирательству.
- source_word: יִגְּשׁוּ
  choice: Пусть они приблизятся
  rationale: Имперфект употреблён в побудительном значении и продолжает последовательность призывов.
- source_word: אָז יְדַבֵּרוּ
  choice: и тогда говорят
  rationale: Сохраняется последовательность действий и простое значение глагола «говорить», без добавления отсутствующего в тексте выражения «изложат своё дело».
- source_word: יַחְדָּו לַמִּשְׁפָּט נִקְרָבָה
  choice: Вместе предстанем на суд
  rationale: Когортатив первого лица множественного числа выражает совместное приближение; по-русски «предстанем на суд» естественно передаёт движение к судебному разбирательству, не уточняя его исход.
theological_decisions:
- issue: Судебно-правовой характер призыва
  choice: Передать стих как призыв к совместному судебному разбирательству
  alternative: Понять его лишь как общий призыв народов выслушать Бога либо развернуть в прямую парафразу «встретимся в суде»
  rationale: Последовательность повелений — умолкнуть, набраться сил, приблизиться, говорить и предстать на суд — создаёт судебный контекст, однако перевод не добавляет деталей, которых нет в еврейском тексте.
- issue: Включённость говорящего в נִקְרָבָה
  choice: 'Сохранить первое лицо множественного числа: «предстанем»'
  alternative: 'Передать как обращённое только к народам повеление: «предстаньте»'
  rationale: Еврейская когортативная форма прямо включает говорящего в совместное приближение и не должна сглаживаться.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой судебной речи. Формы «предо Мною» и «предстанем» поддерживают торжественный регистр, оставаясь понятными; синтаксис сохраняет краткие последовательные призывы оригинала.
