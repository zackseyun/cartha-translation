lexical_decisions:
- source_word: אֶתֵּן
  choice: Я посажу
  rationale: Буквально глагол означает «дам, помещу», но при перечислении деревьев естественное русское «посажу» ясно передаёт конкретное действие в данном образе.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необрабатываемую местность; «пустыня» естественно и понятно по-русски и сохраняет параллелизм со «степью».
- source_word: אֶרֶז
  choice: кедр
  rationale: Обычное соответствие еврейскому названию дерева, в библейском употреблении часто подразумевающему ливанский кедр.
- source_word: שִׁטָּה
  choice: акацию
  rationale: Современное и общепонятное ботаническое название, точно передающее еврейский термин без ненужной транслитерации.
- source_word: הֲדַס
  choice: мирт
  rationale: Устойчивое ботаническое соответствие.
- source_word: עֵץ שָׁמֶן
  choice: масличное дерево
  rationale: Буквально «дерево масла». «Масличное дерево» сохраняет широту и некоторую неопределённость выражения, не отождествляя его безоговорочно с оливой.
- source_word: אָשִׂים
  choice: Я насажу
  rationale: Глагол означает «помещу, поставлю» и параллелен אֶתֵּן; в контексте деревьев «насажу» звучит естественно и сохраняет поэтическую вариативность.
- source_word: בָּעֲרָבָה
  choice: в степи
  rationale: עֲרָבָה здесь, вероятнее всего, нарицательное обозначение сухой равнинной местности, а не собственное имя Арава. «Степь» отличает её от מִדְבָּר и передаёт поэтический параллелизм.
- source_word: בְּרוֹשׁ
  choice: кипарис
  rationale: Точный вид дерева неизвестен; «кипарис» — традиционное и распространённое соответствие, а возможные варианты отмечены в сноске.
- source_word: תִּדְהָר
  choice: платан
  rationale: Идентификация вида неуверенна; «платан» широко употребляется в переводах, при этом альтернативы вынесены в сноску.
- source_word: תְאַשּׁוּר
  choice: сосну
  rationale: Точный вид неизвестен; «сосна» уместна в ряду названий деревьев, а другие возможные определения отражены в сноске.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Кратко и естественно передаёт совместность появления перечисленных деревьев.
