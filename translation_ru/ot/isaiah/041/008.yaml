  source_fidelity: 'Текст точно передаёт все основные элементы еврейского оригинала: усиленное противопоставление «Но ты», обращения «Израиль» и «Иаков», заветное обозначение «раб Мой», избрание, собирательное «потомство Авраама» и характеристику Авраама как «друга Моего». Продолжающее тире оправдано тем, что синтаксическая конструкция продолжается в следующем стихе.'
