source:
  edition: WLC
  text: וְ/אַתָּה֙ יִשְׂרָאֵ֣ל עַבְדִּ֔/י יַעֲקֹ֖ב אֲשֶׁ֣ר בְּחַרְתִּ֑י/ךָ זֶ֖רַע אַבְרָהָ֥ם אֹהֲבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/008.yaml
  text: But you[a], Israel, my servant, Jacob, whom I have chosen, offspring of Abraham, my friend—
translation:
  language: ru
  text: Но ты, Израиль, раб Мой, Иаков, которого Я избрал, потомство Авраама, друга Моего[a], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «любящего Меня».'
    reason: Сохранён буквальный вариант прочтения еврейского причастия אֹהֲבִי.
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Но ты
  rationale: Сочетание союза с самостоятельным местоимением подчёркивает противопоставление Израиля народам и идолопоклонникам в ближайшем контексте.
- source_word: יִשְׂרָאֵל עַבְדִּי
  choice: Израиль, раб Мой
  rationale: עבד здесь служит обозначением заветного отношения Израиля к Богу; «раб» — естественный и традиционный русский эквивалент, не сводящий выражение к указанию на подневольный статус.
- source_word: יַעֲקֹב אֲשֶׁר בְּחַרְתִּיךָ
  choice: Иаков, которого Я избрал
  rationale: Иаков поставлен в приложении к Израилю; форма совершенного вида передаёт завершённость Божьего избрания без добавления отсутствующих в тексте временных оттенков.
- source_word: זֶרַע אַבְרָהָם
  choice: потомство Авраама
  rationale: זֶרַע — собирательное существительное в единственном числе. «Потомство» сохраняет собирательный смысл и звучит естественно в современном русском языке.
- source_word: אֹהֲבִי
  choice: друга Моего
  rationale: 'Причастие с суффиксом первого лица буквально допускает значение «любящего Меня», но в данном контексте естественно обозначает близкие отношения Авраама с Богом: «Мой друг».'
theological_decisions:
- issue: Значение אֹהֲבִי применительно к Аврааму
  choice: друга Моего
  alternative: любящего Меня
  rationale: Основной текст передаёт естественный для контекста смысл особой близости Авраама к Богу, а буквальная и богословски значимая направленность любви сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Богу, написаны с прописной буквы. Заключительное тире сохраняет незавершённость синтаксической конструкции, продолжающейся в следующем стихе.
