base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/026.yaml
  text: Who declared it from the beginning[a], so that we might know, and beforehand, so that we might say, ‘He is right’? But there was no one declaring it, no one making it heard[b], no one hearing your words.
translation:
  language: ru
  text: 'Кто возвестил с самого начала[a], чтобы мы узнали, и заранее, чтобы мы сказали: «Он прав»?[b] Но никто не возвещал, никто не давал вам услышать, и никто не слышал ваших слов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с начала».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Он оказался прав»; традиционно: «Он праведен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הִגִּיד
  choice: Кто возвестил
  rationale: Прямой вопрос сохраняет силу риторического вызова; «возвестил» передаёт публичное и ясное объявление, выраженное формой Hiphil глагола נגד.
- source_word: מֵרֹאשׁ
  choice: с начала
  rationale: Передаёт временной смысл раннего, предварительного объявления, не уточняя сверх текста, о каком именно начале идёт речь.
- source_word: וְנֵדָעָה
  choice: чтобы мы узнали
  rationale: Когортатив естественно передан как цель или ожидаемый результат предшествующего объявления.
- source_word: וּמִלְּפָנִים
  choice: и заранее
  rationale: Сохраняет параллель с «с начала» и подчёркивает предварительность предсказания.
- source_word: וְנֹאמַר צַדִּיק
  choice: 'чтобы мы сказали: «Он прав»'
  rationale: В данном судебно-полемическом контексте צַדִּיק выражает оправдательный вердикт о достоверности предсказателя, а не обязательно характеристику его нравственности.
- source_word: אַף אֵין מַגִּיד
  choice: Но никто не возвещал
  rationale: «Но» передаёт резкий переход к отрицательному итогу; конструкция с «никто» естественно выражает אַף אֵין.
- source_word: מַשְׁמִיעַ
  choice: никто не давал услышать
  rationale: Так сохраняется каузативный смысл Hiphil от שמע — не просто говорить, а делать так, чтобы сказанное было услышано.
- source_word: שֹׁמֵעַ אִמְרֵיכֶם
  choice: никто не слышал ваших слов
  rationale: Передаёт причастную конструкцию и сохраняет параллелизм трёх последовательных отрицаний.
theological_decisions:
- issue: Невыраженный объект глагола הִגִּיד
  choice: Не добавлять в основном тексте конкретный объект после «возвестил»
  alternative: «Кто возвестил это с начала» или «Кто возвестил о нём с начала»
  rationale: В еврейском тексте объект не выражен. Русская конструкция допускает его опущение, что сохраняет неопределённость и не сводит вызов к заранее выбранному лицу или событию.
- issue: Значение צַדִּיק
  choice: «Он прав»
  alternative: «Он праведен» или «Это верно»
  rationale: Контекст требует прежде всего признания правоты и достоверности того, кто заранее объявил событие. Сноска сохраняет традиционный нравственно-религиозный оттенок слова и безличное понимание краткого еврейского выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой судебной речи. Синтаксический параллелизм и троекратное отрицание сохранены; невыраженный в еврейском объект не конкретизирован.
