  text: אַל תִּירָא֙ כִּ֣י עִמְּ/ךָ אָ֔נִי אַל תִּשְׁתָּ֖ע כִּֽי אֲנִ֣י אֱלֹהֶ֑י/ךָ אִמַּצְתִּ֨י/ךָ֙ אַף עֲזַרְתִּ֔י/ךָ אַף תְּמַכְתִּ֖י/ךָ בִּ/ימִ֥ין צִדְקִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/010.yaml
  text: Do not fear[a], for I am with you; do not look around in dread, for I am your God. I will strengthen you; surely I will help you[b]; surely I will uphold you with my righteous right hand.
translation:
  language: ru
  text: Не бойся, ведь Я с тобой; не озирайся в страхе[a], ведь Я — твой Бог. Я укреплю тебя, непременно помогу тебе, непременно поддержу тебя правой рукой Моей праведности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не приходи в смятение»; еврейский глагол, вероятно, передаёт образ тревожного или испуганного оглядывания.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «Моей праведной правой рукой».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Прямой и естественный запрет, сохраняющий краткость и силу еврейского выражения.
- source_word: כִּי עִמְּךָ אָנִי
  choice: ведь Я с тобой
  rationale: כִּי указывает основание для призыва не бояться; «ведь» естественно передаёт причинно-пояснительную связь и сохраняет возвышенный, но современный тон.
- source_word: אַל תִּשְׁתָּע
  choice: не озирайся в страхе
  rationale: Передаёт вероятный конкретный образ тревожного оглядывания, а не только общее эмоциональное состояние; подлинная лексическая неоднозначность отмечена в сноске.
- source_word: אֲנִי אֱלֹהֶיךָ
  choice: Я — твой Бог
  rationale: Прямо сохраняет личное и заветное самоопределение Бога.
- source_word: אִמַּצְתִּיךָ
  choice: Я укреплю тебя
  rationale: Хотя форма морфологически перфектная, в последовательности заверений естественно понимается как обещание; будущее время ясно передаёт эту функцию по-русски.
- source_word: אַף
  choice: непременно
  rationale: Передаёт усилительное значение частицы и повтором сохраняет риторическое нарастание еврейского текста.
- source_word: עֲזַרְתִּיךָ
  choice: помогу тебе
  rationale: Простое и точное соответствие значению עזר; будущее время согласовано с функцией ряда как обещания.
- source_word: תְּמַכְתִּיךָ
  choice: поддержу тебя
  rationale: Передаёт образ удерживания и опоры естественным современным русским языком.
- source_word: בִּימִין צִדְקִי
  choice: правой рукой Моей праведности
  rationale: Сохраняет формальную конструкцию «правой рукой моей праведности» и не сводит צֶדֶק только к качеству «праведная»; более идиоматичный вариант отмечен в сноске.
theological_decisions:
- issue: Передача בִּימִין צִדְקִי
  choice: правой рукой Моей праведности
  alternative: Моей праведной правой рукой
  rationale: Формальный вариант сохраняет конструктивную связь и богословскую ёмкость слова צֶדֶק, которое может включать праведность, справедливость и верность. Более гладкий русский вариант возможен, но слегка сужает синтаксическую неоднозначность.
- issue: Видо-временное значение трёх глаголов заверения
  choice: 'будущие обещания: «укреплю… помогу… поддержу»'
  alternative: 'совершённое или настоящее действие: «укрепил… помог… поддержал» либо «укрепляю…»'
  rationale: Несмотря на формы перфекта, контекст пророческого заверения и параллелизм поддерживают передачу обещания будущим временем. Это не превращает формы в отвлечённые предсказания, а выражает надёжность Божьей помощи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Обращение остаётся в единственном числе, как в еврейском тексте. Прописное «Я» употреблено как уместная русская издательская конвенция для прямой речи Бога. Повтор «непременно» сохраняет усиление אַף; синтаксис остаётся ясным для широкого читателя.
