lexical_decisions:
- source_word: אִישׁ
  choice: Каждый
  rationale: Единственное число употреблено дистрибутивно; «каждый» естественно передаёт обобщённое значение в современном русском языке.
- source_word: אֶת רֵעֵהוּ
  choice: своему ближнему
  rationale: רֵעַ обозначает ближнего, товарища или друга; «ближний» сохраняет широкий межличностный смысл, не предполагая непременно близкой дружбы.
- source_word: יַעְזֹרוּ
  choice: помогает
  rationale: Имперфект здесь живо описывает происходящее, а не обязательно указывает на будущее; настоящее время естественно передаёт эту сцену. Русское единственное число согласуется с дистрибутивным «каждый».
- source_word: וּלְאָחִיו
  choice: и говорит своему брату
  rationale: אָח может означать как родного брата, так и соплеменника или близкого участника сообщества; прямое «брат» сохраняет образ и параллелизм.
- source_word: יֹאמַר
  choice: говорит
  rationale: Настоящее время передаёт живое описание последовательного действия.
- source_word: חֲזָק
  choice: Будь крепок!
  rationale: Императив от חזק призывает обрести силу и твёрдость; «будь крепок» прямо передаёт значение и звучит достойно и естественно в данном контексте.
