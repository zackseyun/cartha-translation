  text: כִּ֗י אֲנִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מַחֲזִ֣יק יְמִינֶ֑/ךָ הָ/אֹמֵ֥ר לְ/ךָ֛ אַל תִּירָ֖א אֲנִ֥י עֲזַרְתִּֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/013.yaml
  text: For I am Yahweh your God[a], who takes hold of your right hand, who says to you, ‘Do not fear; I will help you.’
translation:
  language: ru
  text: 'Ибо Я — Яхве, твой Бог, держащий тебя за правую руку и говорящий тебе: «Не бойся, Я помогу тебе».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейская форма может быть передана: «Я помог тебе» или «Я уже помог тебе»; здесь она выражает твёрдое заверение: «Я помогу тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего ободрения; «ибо» сохраняет логическую связь и соответствует достоинству пророческой речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Прямая передача притяжательной формы, выражающей личное обращение и отношения завета.
- source_word: מַחֲזִיק יְמִינֶךָ
  choice: держащий тебя за правую руку
  rationale: Причастная конструкция חזק в породе хифиль здесь передаёт конкретный образ крепкой поддерживающей хватки; русское выражение естественно и сохраняет образ правой руки.
- source_word: הָאֹמֵר לְךָ
  choice: и говорящий тебе
  rationale: Сохраняет параллельную причастную характеристику Бога и естественно связывает её с предыдущей.
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Обычная и ясная передача запрета с אַל; сохраняет прямое ободрение.
- source_word: עֲזַרְתִּיךָ
  choice: Я помогу тебе
  rationale: Хотя форма морфологически является перфектом, в контексте заверения она выражает твёрдую, имеющую силу для будущего помощь; русский будущий вид естественно передаёт обещание. Формальная аспектуальная альтернатива отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Временное и аспектуальное значение עֲזַרְתִּיךָ
  choice: 'будущее обещание: «Я помогу тебе»'
  alternative: 'перфект: «Я помог тебе» или «Я уже помог тебе»'
  rationale: В призыве «Не бойся» форма выражает надёжность Божьей помощи, а не только завершённое действие в прошлом. Будущее время яснее передаёт обещательный смысл, тогда как формальная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Причастные обороты сохраняют структуру еврейского описания, оставаясь понятными; конкретный образ правой руки не обобщён.
