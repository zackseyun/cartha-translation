source:
  edition: WLC
  text: הַעִיר֤וֹתִי מִ/צָּפוֹן֙ וַ/יַּ֔את מִ/מִּזְרַח שֶׁ֖מֶשׁ יִקְרָ֣א בִ/שְׁמִ֑/י וְ/יָבֹ֤א סְגָנִים֙ כְּמוֹ חֹ֔מֶר וּ/כְמ֥וֹ יוֹצֵ֖ר יִרְמָס טִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/025.yaml
  text: I have stirred up one from the north[a], and he has come; from the rising of the sun he calls on my name. He will come upon rulers as upon clay[c][b], and like a potter he treads mud.
translation:
  language: ru
  text: Я пробудил одного с севера[c], и он пришёл; от восхода солнца[a] он будет призывать Моё имя[b]. Он будет попирать правителей, как глину, и, как гончар, топтать глину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с востока»; буквально: «от восхода солнца».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «будет призывать Моё имя» можно также передать как «будет взывать к Моему имени» или «будет провозглашать Моё имя».
    reason: lexical_alternative
  - marker: c
    text: Того, кого пробудил Бог, часто отождествляют с Киром; однако еврейский текст этого стиха не называет его по имени.
    reason: cross_reference
lexical_decisions:
- source_word: הַעִירוֹתִי
  choice: Я пробудил
  rationale: Порода hифиль глагола עור здесь означает побудить или поднять кого-либо к действию. «Пробудил» сохраняет инициативу Бога и не уточняет способ побуждения.
- source_word: מִצָּפוֹן
  choice: с севера
  rationale: Прямое обозначение направления, естественное и точное по-русски.
- source_word: וַיַּאת
  choice: и он пришёл
  rationale: Форма продолжает совершенное действие и представляет приход как свершившийся; прошедшее время сохраняет пророческую перспективу текста.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: от восхода солнца
  rationale: Сохранён буквальный образ еврейского выражения, обозначающего восток; обычный географический эквивалент вынесен в сноску.
- source_word: יִקְרָא בִשְׁמִי
  choice: он призовёт Моё имя
  rationale: קרא בשם допускает смысл призывания имени, обращения к нему или его провозглашения. Выбранная формулировка близка к идиоме и не определяет однозначно религиозную позицию действующего лица.
- source_word: וְיָבֹא סְגָנִים
  choice: Он наступит на правителей
  rationale: Глагол движения с последующим обозначением правителей передаёт враждебное наступление. «Правители» ясно и достаточно широко передаёт название высокопоставленных должностных лиц.
- source_word: כְּמוֹ חֹמֶר
  choice: словно на глину
  rationale: חֹמֶר означает глину; оборот связан с действием наступающего и сохраняет образ лёгкого попрания.
- source_word: וּכְמוֹ יוֹצֵר
  choice: и, как горшечник
  rationale: יוֹצֵר в данном образе — мастер, формующий глину, то есть горшечник.
- source_word: יִרְמָס טִיט
  choice: будет топтать вязкую землю
  rationale: רמס означает топтать или попирать, а טיט — грязь, ил либо вязкую землю. Формулировка сохраняет физический образ подготовки материала горшечником и отличает טיט от уже названной глины חֹמֶר.
theological_decisions:
- issue: Кто тот, кого пробудил Бог, и что означает призывание Божьего имени
  choice: Оставить действующее лицо неназванным («одного») и не уточнять, означает ли призывание имени истинное поклонение.
  alternative: Прямо назвать Кира и истолковать выражение либо как исповедание веры, либо лишь как употребление или провозглашение Божьего имени.
  rationale: В историко-литературном контексте фигуру часто связывают с Киром, но в самом стихе имя отсутствует. Выражение קרא בשם также допускает несколько оттенков, поэтому перевод сохраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет параллелизм и смену временной перспективы еврейского пророческого высказывания; архаизмы и конфессионально окрашенные уточнения не вводятся.
