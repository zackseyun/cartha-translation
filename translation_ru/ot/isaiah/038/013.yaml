    reason: alternative_reading
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: Я ждал
  rationale: Значение глагольной формы здесь неясно и зависит от контекста. В плаче Езекии сочетание с עַד בֹּקֶר естественно передаёт ожидание или терпеливое перенесение страдания до утра; альтернативное понимание отмечено в сноске.
- source_word: עַד בֹּקֶר
  choice: до утра
  rationale: Прямое и естественное обозначение предела времени.
- source_word: כָּאֲרִי
  choice: как лев
  rationale: Сохранено явное сравнение и образ сокрушительной силы.
- source_word: כֵּן
  choice: смысл передан построением «Как лев, он…»
  rationale: В русском предложении соотносительное «так» можно опустить без утраты сравнительной связи; это делает строку естественнее.
- source_word: יְשַׁבֵּר
  choice: сокрушает
  rationale: Порода пиэль усиливает значение «ломать, разбивать»; «сокрушает» сохраняет телесную жестокость образа и сочетается с костями.
- source_word: כָּל עַצְמוֹתָי
  choice: все мои кости
  rationale: Буквально сохранён телесный образ крайнего страдания.
- source_word: מִיּוֹם עַד לַיְלָה
  choice: От дня до ночи
  rationale: Сохранено буквальное временное выражение, обозначающее течение дня до ночи.
- source_word: תַּשְׁלִימֵנִי
  choice: ты кладёшь мне конец
  rationale: Каузативная форма от שלם в данном контексте означает доведение до завершения, то есть до конца или гибели. Русское выражение сохраняет этот смысл без разговорного «ты со мной покончишь» и без добавления отсутствующего в тексте образа смерти или могилы.
theological_decisions:
- issue: Переход от третьего лица ко второму в пределах стиха
  choice: 'Сохранить переход: «он сокрушает… ты кладёшь мне конец»'
  alternative: Согласовать обе части, употребив в них только третье или только второе лицо
  rationale: В еврейском тексте действительно происходит резкий поэтический переход. Его сохранение не устраняет напряжение плача и не превращает сравнение со львом в более однозначное богословское утверждение, чем позволяет оригинал.
translation_notes:
  register: Современный литературный русский язык с лаконичным, исполненным достоинства строем плача. Сохранены телесная образность, временные рамки и резкая смена лица; избегнуты как архаизмы, так и разговорные формулировки.
