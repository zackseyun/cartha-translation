  yaml_path: translation/ot/isaiah/038/015.yaml
  text: What can I say? He has spoken to me[a], and he himself has done it. I will walk slowly all my years because of the bitterness of my soul.
translation:
  language: ru
  text: Что мне сказать? Он сказал мне, и Он Сам это сделал. Все мои годы я буду идти медленно из-за горечи моей души[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Все мои годы я буду идти тихо в горечи моей души». Редкий глагол может обозначать тихое, медленное или смиренное движение; выражение о горечи может описывать состояние или образ действия, а не причину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲדַבֵּר
  choice: Что мне сказать?
  rationale: Естественный русский риторический вопрос, передающий растерянность или изумление без добавления модального оттенка, отсутствующего в форме оригинала.
- source_word: וְאָמַר לִי
  choice: Он сказал мне
  rationale: Сохраняет простое завершённое действие и местоименный субъект; имя Бога не вставляется, хотя из контекста ясно, о ком идёт речь.
- source_word: וְהוּא עָשָׂה
  choice: и Сам это сделал
  rationale: «Сам» передаёт эмфатическое וְהוּא, а «это» естественно восполняет по-русски подразумеваемый объект действия.
- source_word: אֶדַּדֶּה
  choice: я буду идти тихо
  rationale: Редкий глагол допускает значения тихого, медленного или смиренного движения. «Идти тихо» сохраняет образ пути и намеренно не сужает его только до физической медлительности.
- source_word: כָּל שְׁנוֹתַי
  choice: все годы мои
  rationale: Формально и естественно передаёт временной охват, не добавляя подразумеваемого, но не выраженного слова «оставшиеся».
- source_word: עַל מַר נַפְשִׁי
  choice: из-за горечи души моей
  rationale: Передаёт вероятное причинное значение עַל и сохраняет образ «души»; возможное значение образа действия отмечено в сноске.
theological_decisions:
- issue: К кому относятся глаголы третьего лица
  choice: Сохранено местоимение «Он» без вставки имени Бога
  alternative: Явно перевести «Господь сказал мне»
  rationale: Контекст песни Езекии указывает на Бога, однако в самом стихе имя не названо; местоимение сохраняет контекстуально ясный, но формально не уточнённый референт.
- issue: Связь горечи души с дальнейшей жизнью говорящего
  choice: 'Причинное понимание: «из-за горечи души моей»'
  alternative: 'Образ действия или состояния: «в горечи души моей»'
  rationale: Предлог עַל допускает причинное или более общее соотносительное понимание. Основной текст выбирает естественное причинное прочтение, а реальная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной библейской интонацией. Инверсия «все годы мои» и выражение «души моей» поддерживают достоинство поэтической речи, не делая её архаичной.
