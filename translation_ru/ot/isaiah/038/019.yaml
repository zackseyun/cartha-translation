source:
  edition: WLC
  text: חַ֥י חַ֛י ה֥וּא יוֹדֶ֖/ךָ כָּמ֣וֹ/נִי הַ/יּ֑וֹם אָ֣ב לְ/בָנִ֔ים יוֹדִ֖יעַ אֶל אֲמִתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/019.yaml
  text: The living[a], the living—he gives thanks to you, as I do today[b]; a father makes your faithfulness known to children.
translation:
  language: ru
  text: Живой, живой благодарит Тебя, как я сегодня; отец рассказывает детям[a] о Твоей верности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «сыновьям».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «истине». Еврейское אֱמֶת может означать истину, верность или надёжность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי חַי
  choice: Живой, живой
  rationale: Субстантивированное прилагательное и его emphатический повтор сохранены без поясняющего расширения.
- source_word: יוֹדֶךָ
  choice: благодарит Тебя
  rationale: Порода hифиль глагола ידה в песне благодарения обозначает обращённое к Богу благодарение; этот вариант точнее контекстуально, чем более широкое «прославляет».
- source_word: כָּמוֹנִי הַיּוֹם
  choice: как я сегодня
  rationale: Русская формулировка естественно восполняет действие из предыдущей части фразы, не меняя смысла сравнения.
- source_word: אָב לְבָנִים
  choice: отец ... детям
  rationale: בָּנִים буквально означает «сыновья», но здесь обозначает детей как следующее поколение; дательный падеж передаёт адресата сообщения.
- source_word: יוֹדִיעַ
  choice: рассказывает
  rationale: Каузативное «даёт знать, сообщает» в связи с передачей знания от отца детям естественно выражается глаголом «рассказывает»; настоящее время передаёт обобщённый характер высказывания.
- source_word: אֶל אֲמִתֶּךָ
  choice: о Твоей верности
  rationale: Предлог אֶל здесь вводит содержание сообщаемого, а אֱמֶת в контексте Божьих деяний указывает прежде всего на Его надёжность и верность.
theological_decisions:
- issue: Значение בָּנִים в высказывании о передаче веры следующему поколению
  choice: детям
  alternative: сыновьям
  rationale: Форма слова мужского рода сохранена как возможное буквальное прочтение в сноске, однако в обобщённом межпоколенческом высказывании речь идёт о потомках, а не обязательно только о лицах мужского пола.
- issue: Смысл אֱמֶת применительно к Богу
  choice: верности
  alternative: истине
  rationale: «Верность» передаёт здесь надёжность Бога, явленную в Его делах, но лексически допустимое «истина» сохранено в сноске, чтобы не устранять смысловую многозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем. Повтор «Живой, живой» намеренно сохранён как характерный поэтический акцент; местоимение обращения к Богу написано с прописной буквы в соответствии с русской библейской традицией.
