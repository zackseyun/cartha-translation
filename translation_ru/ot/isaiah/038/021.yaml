lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: 'Форма wayyiqtol буквально продолжает повествование: «и сказал». Русское простое прошедшее естественно и не навязывает явно не выраженного в форме предпрошедшего времени; контекст при этом позволяет понять стих как пояснение к предыдущему рассказу.'
- source_word: יְשַׁעְיָהוּ
  choice: Исаия
  rationale: Устоявшаяся русская форма имени пророка.
- source_word: יִשְׂאוּ
  choice: пусть возьмут
  rationale: В данном контексте נשׂא обозначает взятие или доставку лечебного средства; «пусть возьмут» естественно передаёт юссивное значение.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: лепёшку из прессованного инжира
  rationale: Сочетание обозначает сформованную массу сушёных или спрессованных плодов инжира. Уточнение «прессованного» предотвращает современное понимание «лепёшки» как мучного изделия.
- source_word: וְיִמְרְחוּ עַל הַשְּׁחִין
  choice: приложат её к нарыву
  rationale: מרח означает намазывать или накладывать, а שְׁחִין — воспалённую язву либо нарыв. В отношении цельной инжирной лепёшки русское «приложат» звучит естественнее буквального «намажут», не меняя характера лечебного применения.
- source_word: וְיֶחִי
  choice: и он выздоровеет
  rationale: חיה буквально значит «жить», но в контексте болезни выражает возвращение к жизни и здоровью. «Выздоровеет» ясно передаёт контекстуальный смысл; буквальная возможность отмечена в сноске.
