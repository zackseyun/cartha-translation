  text: הִנֵּ֥ה לְ/שָׁל֖וֹם מַר לִ֣/י מָ֑ר וְ/אַתָּ֞ה חָשַׁ֤קְתָּ נַפְשִׁ/י֙ מִ/שַּׁ֣חַת בְּלִ֔י כִּ֥י הִשְׁלַ֛כְתָּ אַחֲרֵ֥י גֵוְ/ךָ֖ כָּל חֲטָאָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/017.yaml
  text: Behold[a], for my peace I had great bitterness; but you have held my soul back from the pit of destruction, for you have cast all my sins behind your back.
translation:
  language: ru
  text: Вот, во благо мне была горечь, горечь великая; но ты удержал мою жизнь от гибельной ямы[a], потому что бросил все мои грехи за свою спину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «ты возлюбил мою жизнь, избавив её от гибельной ямы». Еврейский глагол может означать глубокую привязанность или любовь.'
    reason: Лексически возможное прочтение сохраняет прямой оттенок любви в חָשַׁקְתָּ, тогда как основной текст передаёт подразумеваемое избавление.
lexical_decisions:
- source_word: לְשָׁלוֹם
  choice: к моему благу
  rationale: לְ перед שָׁלוֹם допускает направленность или результат, а שָׁלוֹם означает мир, благополучие, целостность. В данном парадоксальном признании «к моему благу» естественно по-русски передаёт мысль о благом результате пережитого страдания, не устраняя напряжения текста.
- source_word: מַר לִי מָר
  choice: было мне горько, очень горько
  rationale: Повтор корня מר передаёт усиление. Русское повторение «горько, очень горько» сохраняет выразительность еврейской фразы яснее, чем отвлечённое «великая горечь».
- source_word: חָשַׁקְתָּ
  choice: удержал
  rationale: Основное значение глагола связано с привязанностью, любовью и сильным расположением. В сочетании с מִן и образом гибельной ямы контекстуальный результат — спасение от смерти; «удержал» передаёт этот защитный смысл, а буквальная любовная семантика сохранена в сноске.
- source_word: נַפְשִׁי
  choice: мою жизнь
  rationale: נֶפֶשׁ здесь обозначает живую личность и жизнь, которой угрожает смерть. «Мою жизнь» естественно для современного русского и не создаёт ложного противопоставления души и тела.
- source_word: מִשַּׁחַת בְּלִי
  choice: от гибельной ямы
  rationale: שַׁחַת сохраняет конкретный образ ямы и одновременно несёт значение гибели или разрушения; בְּלִי усиливает представление о полном уничтожении. «Гибельная яма» передаёт оба компонента без сужения до одной лишь могилы.
- source_word: הִשְׁלַכְתָּ אַחֲרֵי גֵוְךָ
  choice: бросил ... за свою спину
  rationale: Сохранён яркий еврейский образ полного удаления грехов из поля зрения и внимания Бога.
- source_word: חֲטָאָי
  choice: мои грехи
  rationale: Прямой и богословски прозрачный эквивалент множественного числа חטא.
theological_decisions:
- issue: Передаёт ли חָשַׁקְתָּ прежде всего Божью любовь или совершённое Богом избавление?
  choice: 'В основном тексте передан защитный результат: «ты удержал мою жизнь от гибельной ямы».'
  alternative: «ты возлюбил мою жизнь, избавив её от гибельной ямы»
  rationale: Глагол действительно может выражать глубокую любовь или привязанность, однако конструкция с «от гибельной ямы» подчёркивает избавление от смерти. Основной текст остаётся естественным и контекстуально ясным, а лексически возможный акцент на любви не утрачен благодаря сноске.
- issue: Следует ли понимать לְשָׁלוֹם как уже имевшийся мир или как благо, к которому привело страдание?
  choice: «к моему благу»
  alternative: «вместо благополучия» или «ради моего благополучия»
  rationale: 'Контекст благодарственной песни после исцеления позволяет видеть в страдании путь к благому исходу, но краткая еврейская фраза остаётся напряжённой. Перевод сохраняет парадокс: крайняя горечь оказалась направлена к благу.'
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Повтор «горько, очень горько» сохраняет еврейское усиление; образы «ямы» и «за спину» оставлены конкретными. Местоимения, относящиеся к Богу, написаны со строчной буквы в соответствии с нейтральной современной издательской практикой.
