  rationale: Исправлены русская падежная форма имени и более естественный образ «страны живых». Заключительный трудный образ передан кратко и литературно как «преходящий мир», при этом сноска сохраняет значимую лексическую неопределённость и не навязывает толкование о загробном мире.
