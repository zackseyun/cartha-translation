base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/011.yaml
  text: I said[a], “I will not see Yah, Yah in the land of the living[b]; I will no longer look on man among the inhabitants of cessation.”
translation:
  language: ru
  text: 'Я сказал: «Не увижу Яха, Яха[a] в стране живых; больше не увижу человека среди обитателей преходящего мира[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ях» — краткая поэтическая форма Божьего имени; здесь она повторена дважды. Нередко её передают словом «Господь».
    reason: alternative_reading
  - marker: b
    text: Еврейское выражение неясно. Редкое слово חָדֶל связано с прекращением, исчезновением или бренностью; возможны также переводы «среди обитателей мира мёртвых» или «среди обитателей мира прекращения».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Я сказал
  rationale: Форма qal, перфект, 1-е лицо единственного числа, вводит прямую речь Езекии. Буквальное «я сказал» естественно по-русски и не заменяет речь внутренней мыслью.
- source_word: לֹא אֶרְאֶה
  choice: не увижу я
  rationale: Отрицание с имперфектом выражает ожидаемую утрату. Инверсия сохраняет торжественно-поэтическое звучание, оставаясь понятной современному читателю.
- source_word: יָהּ יָהּ
  choice: Ях, Ях
  rationale: Сохранена дважды повторённая краткая поэтическая форма Божьего имени יָהּ; она не отождествляется без пояснения с полной формой тетраграмматона.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: в земле живых
  rationale: Устойчивый древнееврейский образ области живущих в противопоставлении смерти. Русская формулировка точна и традиционно понятна.
- source_word: לֹא אַבִּיט ... עוֹד
  choice: не увижу больше
  rationale: נבט означает смотреть, видеть; вместе с отрицанием и עוֹד передаёт прекращение возможности видеть. Повтор «увижу» сохраняет параллелизм и звучит естественнее, чем искусственное «не буду взирать».
- source_word: אָדָם
  choice: человека
  rationale: Представительное единственное число обозначает человека как члена человеческого общества; форма оригинала сохранена.
- source_word: עִם
  choice: среди
  rationale: Буквально «с», однако в данном сочетании «среди» естественно выражает пребывание человека в сообществе названных обитателей.
- source_word: יֹשְׁבֵי
  choice: обитателей
  rationale: Субстантивированное причастие множественного числа в сопряжённой форме естественно передаётся существительным «обитатели».
- source_word: חָדֶל
  choice: мира, где всё прекращается
  rationale: Редкое и трудное слово связано с прекращением, исчезновением или бренностью. Описательный перевод остаётся понятным, но не сводит неоднозначный образ однозначно к шеолу либо миру мёртвых.
theological_decisions:
- issue: Передача краткой формы Божьего имени יָהּ
  choice: Ях, Ях
  alternative: Господь, Господь; Яхве
  rationale: В масоретском тексте дважды употреблена именно краткая форма יָהּ. Транслитерация и повтор сохраняют форму и поэтическое усиление оригинала, не подменяя её полной формой имени.
- issue: Толкование חָדֶל
  choice: мира, где всё прекращается
  alternative: мира мёртвых; бренного мира; прекращения
  rationale: Референт редкого слова не вполне определён. Перевод сохраняет семантику прекращения и напряжение с «землёй живых», не утверждая более конкретную картину загробного мира, чем позволяет текст.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Инверсия «не увижу я» поддерживает ритм плача; трудный заключительный образ передан понятно, но с сохранением его подлинной неопределённости.
