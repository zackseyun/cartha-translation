  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִ֖י עַל הָ/עִ֥יר הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/006.yaml
  text: And I will deliver you and this city from the hand of the king of Assyria[a], and I will defend this city.
translation:
  language: ru
  text: И Я избавлю тебя и этот город от власти царя Ассирии[a] и защищу этот город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из руки царя Ассирии»; это еврейское выражение означает освобождение из-под его власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכַּף
  choice: от власти
  rationale: Буквально сочетание означает «из руки (ладони)», но здесь это еврейская идиома, обозначающая власть или контроль. «От власти» естественно передаёт её смысл по-русски, а образ руки сохраняется в примечании.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царя Ассирии
  rationale: Прямое и естественное обозначение ассирийского царя посредством родительной конструкции.
- source_word: אַצִּילְךָ
  choice: Я избавлю тебя
  rationale: Каузативная форма глагола נצל означает вырвать из опасности, избавить или спасти. «Избавлю» соответствует историко-военному контексту и сохраняет возвышенный, но понятный регистр.
- source_word: וְאֵת הָעִיר הַזֹּאת
  choice: и этот город
  rationale: Указательное выражение прямо относится к данному городу, то есть в контексте к Иерусалиму; вводить название, отсутствующее в стихе, не требуется.
- source_word: וְגַנּוֹתִי
  choice: и защищу
  rationale: Глагол גנן выражает защиту или охрану; в условиях военной угрозы «защищу» наиболее точно передаёт активное покровительство городу.
- source_word: עַל הָעִיר הַזֹּאת
  choice: этот город
  rationale: 'При глаголе גנן предлог עַל указывает на объект защитного действия. Русское управление требует прямого дополнения: «защищу этот город».'
theological_decisions:
- issue: Язык Божьего избавления в историческом военном контексте
  choice: «избавлю» как обещание освободить Езекию и город от ассирийской власти
  alternative: «спасу» или «выручу»
  rationale: Стих говорит о конкретном историческом избавлении от вражеского царя. «Избавлю» передаёт смысл, не добавляя сотериологических утверждений, которых непосредственно в тексте нет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «этот город» сохранён вслед за еврейским текстом. Местоимение «Я» написано с прописной буквы как принятая в русском библейском стиле форма обращения к речи Бога.
