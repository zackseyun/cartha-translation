  yaml_path: translation/ot/isaiah/038/004.yaml
  text: Then the word of Yahweh came to Isaiah[a], saying,
translation:
  language: ru
  text: 'И пришло к Исаии слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH); также передаётся «Иегова».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: И пришло
  rationale: Последовательная форма глагола היה вводит очередное событие повествования. В сочетании со «словом» русское «пришло» естественно передаёт наступление нового события без архаичного «и было».
- source_word: דְּבַר
  choice: слово
  rationale: Сохраняет устойчивую пророческую формулу «слово Яхве» и не сужает значение до более толковательного «весть».
- source_word: יְהוָה
  choice: Яхве[a]
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом; сноска отмечает возможный вариант передачи.
- source_word: אֶל יְשַׁעְיָהוּ
  choice: к Исаии
  rationale: Предлог אֶל обозначает адресата откровения; русская конструкция «пришло к Исаии слово» звучит естественно и точно.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В еврейском тексте инфинитив вводит содержание последующей прямой речи. В современном русском эту функцию естественно и без смысловой потери выполняет двоеточие.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В тексте непосредственно стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом; иной традиционный вариант произношения указан в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением узнаваемой пророческой формулы. Порядок слов делает адресата ясным, а двоеточие естественно вводит речь следующего стиха.
