  yaml_path: translation/ot/isaiah/038/022.yaml
  text: And Hezekiah said[a], “What is the sign that I shall go up to the house of Yahweh?”
translation:
  language: ru
  text: 'И сказал Езекия[a]: «Что будет знаком того, что я взойду в дом Яхве?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к еврейскому: «Какой знак [того], что я взойду в дом Яхве?»'
    reason: 'Еврейская фраза מָה אוֹת כִּי эллиптична: буквально «что [за] знак, что…». Основной текст передаёт её естественным русским вопросом, а сноска сохраняет более близкую к форме оригинала конструкцию.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с последовательным וַ передаёт продвижение повествования; «И сказал» естественно сохраняет простую связь с предыдущим контекстом.
- source_word: חִזְקִיָּהוּ
  choice: Езекия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: מָה אוֹת
  choice: Какой знак
  rationale: מָה запрашивает указание знака, а אוֹת означает подтверждающий «знак». Русское выражение естественно и не уточняет природу знака сверх текста.
- source_word: כִּי
  choice: подтвердит, что
  rationale: כִּי вводит содержание, которое должен засвидетельствовать знак. Добавление «подтвердит» делает синтаксическую связь ясной по-русски, не меняя функции знака в контексте.
- source_word: אֶעֱלֶה
  choice: я взойду
  rationale: Имперфект Qal указывает здесь на ожидаемое будущее действие. «Взойду» сохраняет обычный библейский образ восхождения к храму и звучит достойно в современном литературном русском.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: «Дом» формально сохраняет образ בֵּית, относящийся к храму, а личное имя «Яхве» непосредственно передаёт тетраграмматон.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Характер будущего восхождения Езекии
  choice: что я взойду
  alternative: чтобы мне взойти
  rationale: Фраза может восприниматься как подтверждение будущего события, а не как просьба о разрешении. Выбранное чтение соответствует наиболее прямой будущей функции אֶעֱלֶה, не усиливая модальный оттенок.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Взойду» и «дом Яхве» сохраняют образность оригинала; синтаксис вопроса сделан естественным и понятным.
