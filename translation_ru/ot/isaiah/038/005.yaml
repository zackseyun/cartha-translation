base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/005.yaml
  text: 'Go and say to Hezekiah, ‘Thus says the LORD, the God of David your father: I have heard your prayer; I have seen your tears. Look, I will add fifteen years to your days.’'
translation:
  language: ru
  text: 'Пойди и скажи Езекии: «Так говорит ГОСПОДЬ, Бог Давида, отца твоего: Я услышал твою молитву и увидел твои слёзы. Вот, Я прибавлю к твоим дням пятнадцать лет».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ
  choice: Пойди
  rationale: Инфинитив абсолютный при следующем повелительном значении передан естественным русским повелением без избыточного усиления.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона капителью; сохраняет отличие личного имени Бога от обычного титула.
- source_word: אָבִיךָ
  choice: отца твоего
  rationale: 'Сохранена возможная широта древнееврейского родственного обозначения: Давид — предок Езекии, названный его отцом.'
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Передаёт указательно-эмфатическую функцию выражения и акцентирует предстоящее Божье действие.
- source_word: יוֹסִף עַל יָמֶיךָ
  choice: прибавлю к твоим дням
  rationale: Сохранён образный строй оригинала, означающий продление жизни.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Выбрана укоренённая в русской библейской традиции форма, графически отмечающая личное имя и не привносящая конфессиональной конкретизации.
- issue: Отношение Давида к Езекии
  choice: Бог Давида, отца твоего
  alternative: Бог твоего предка Давида
  rationale: Буквальная формулировка сохраняет библейское династическое и заветное употребление слова «отец», не сводя его лишь к биологическому отцовству.
- issue: Характер Божьего ответа
  choice: Я услышал… и увидел… Я прибавлю
  alternative: Я внял… и потому продлю
  rationale: Сохранена последовательность исходного текста без добавления причинной связи, прямо не выраженной в стихе.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис близок к еврейскому оригиналу, но естественен по-русски; сохранены торжественная формула посланнической речи и образ «прибавить к дням».
