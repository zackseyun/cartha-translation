  yaml_path: translation/ot/isaiah/038/018.yaml
  text: For Sheol does not thank you[a]; death does not praise you[b]; those who go down to the pit do not hope for your faithfulness.
translation:
  language: ru
  text: Ибо Шеол[a] не благодарит Тебя, смерть не восхваляет Тебя; сходящие в яму не ожидают Твоей верности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могила»; или: «мир мёртвых».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Твоей истины». Глагол может означать «ожидать с надеждой»; также: «не ожидают Твоей истины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Сохранён древнееврейский термин, обозначающий мир мёртвых, а не только место погребения; это не сужает образ до обычной могилы.
- source_word: תּוֹדֶךָּ
  choice: не благодарит Тебя
  rationale: Форма от ידה передаёт благодарение или хвалу; «благодарит» сохраняет смысловое отличие от следующего глагола «восхваляет».
- source_word: מָוֶת
  choice: смерть
  rationale: Прямой эквивалент, сохраняющий поэтическое олицетворение в параллели с Шеолом.
- source_word: יְהַלְלֶךָּ
  choice: не восхваляет Тебя
  rationale: Порода пиэль глагола הלל обычно означает «хвалить, восхвалять»; выбран естественный для возвышенной русской поэзии эквивалент.
- source_word: יְשַׂבְּרוּ
  choice: не уповают
  rationale: Глагол выражает ожидание с надеждой; «уповают» естественно сочетается с Божьей верностью и сохраняет религиозно-поэтический регистр.
- source_word: יוֹרְדֵי בוֹר
  choice: сходящие в яму
  rationale: Сохранены причастная конструкция и конкретный древнееврейский образ нисхождения в яму, относящийся к умершим или умирающим.
- source_word: בּוֹר
  choice: яма
  rationale: Буквальный поэтический образ сохранён без его истолкования как одной лишь могилы.
- source_word: אֲמִתֶּךָ
  choice: Твою верность
  rationale: В данном сочетании אֱמֶת естественно обозначает надёжность и верность Бога; примечание сохраняет также возможное значение «истина».
theological_decisions:
- issue: Смысл утверждения о мёртвых и хвале Богу
  choice: 'Передать поэтическое утверждение без поясняющего догматического расширения: в Шеоле нет благодарения и хвалы, а сходящие в яму не уповают на Божью верность.'
  alternative: Истолковать стих как однозначное онтологическое утверждение, что умершие полностью лишены сознания и всякого отношения к Богу.
  rationale: Сам стих говорит языком молитвенной поэзии и подчёркивает утрату хвалы и надежды при смерти, но не формулирует исчерпывающего учения о состоянии умерших; буквальная поэтическая передача сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Сохранены параллелизм, образ нисхождения в яму и термин «Шеол». Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
