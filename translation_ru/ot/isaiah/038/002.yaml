lexical_decisions:
- source_word: וַיַּסֵּב
  choice: повернулся
  rationale: Глагол סבב в породе хифиль здесь описывает конкретное изменение положения; возвратная русская форма естественно передаёт действие Езекии.
- source_word: חִזְקִיָּהוּ
  choice: Езекия
  rationale: Употреблена традиционная и общепринятая русская форма библейского имени.
- source_word: פָּנָיו
  choice: лицом
  rationale: Сохранена указанная в еврейском тексте телесная деталь, важная для выразительности сцены; творительный падеж естественен после «повернулся».
- source_word: אֶל הַקִּיר
  choice: к стене
  rationale: Предлог אֶל выражает направленность; «к стене» естественно по-русски и не утверждает соприкосновения со стеной.
- source_word: וַיִּתְפַּלֵּל
  choice: и помолился
  rationale: Форма хитпаэль от פלל имеет обычное значение обращения к Богу в молитве; совершенный вид соответствует последовательному повествованию.
- source_word: אֶל יְהוָה
  choice: Яхве
  rationale: Предлог указывает адресата молитвы, а тетраграмматон передан транслитерацией «Яхве», сохраняющей личное имя Бога.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господу
  rationale: В основном тексте сохранено личное имя, прямо стоящее в еврейском источнике; традиционный вариант указан в примечании без навязывания конфессионального предпочтения.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified повествовательным строем. Начальное וַ передано словом «Тогда», отражающим продолжение событий; порядок действий и конкретный жест Езекии сохранены.
