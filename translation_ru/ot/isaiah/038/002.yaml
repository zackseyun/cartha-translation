  yaml_path: translation/ot/isaiah/038/002.yaml
  text: Then Hezekiah turned his face to the wall and prayed to Yahweh[b][a],
translation:
  language: ru
  text: Тогда Езекия повернулся лицом к стене и помолился Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
