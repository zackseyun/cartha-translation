  text: וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/003.yaml
  text: And he said[a], “Please, O Yahweh, remember how I have walked before you in faithfulness and with a whole heart[c][b], and have done what is good in your eyes.” And Hezekiah wept greatly.
translation:
  language: ru
  text: 'И сказал: «О Яхве, прошу, вспомни, как я ходил перед Тобой в верности[a], с неразделённым сердцем[b] и делал то, что добро в Твоих глазах». И Езекия сильно плакал[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в истине». Еврейское слово может означать истину, надёжность или верность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с цельным сердцем»; также возможно: «от всего сердца» или «с совершенным сердцем».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «плакал великим плачем».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: И сказал
  rationale: Союз и глагольная форма продолжают повествование; простая русская конструкция сохраняет его ход.
- source_word: אָנָּה ... זְכָר נָא
  choice: прошу, вспомни
  rationale: Обе части выражают настойчивую мольбу. Русское «прошу, вспомни» естественно передаёт просительный оттенок без архаизма.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: я ходил пред Тобой
  rationale: Сохранён значимый библейский образ хождения перед Богом; форма «пред Тобой» уместна в возвышенной молитвенной речи и остаётся понятной.
- source_word: בֶּאֱמֶת
  choice: в верности
  rationale: В контексте поведения перед Богом слово указывает на надёжность и верность, при этом возможность значения «в истине» отмечена в сноске.
- source_word: וּבְלֵב שָׁלֵם
  choice: с сердцем, всецело преданным Тебе
  rationale: Передаёт целостность и неразделённость сердца, не создавая впечатления заявления о безгрешном совершенстве.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: и делал доброе в Твоих глазах
  rationale: Сохранён древнееврейский образ оценки поступков Божьими глазами; выражение понятно в современном русском библейском регистре.
- source_word: וַיֵּבְךְּ חִזְקִיָּהוּ בְּכִי גָדוֹל
  choice: И Езекия горько заплакал
  rationale: Естественная русская идиома передаёт усиление, выраженное в еврейском сочетанием глагола и однокоренного существительного с определением «великий».
theological_decisions:
- issue: Самоописание Езекии и возможный смысл безгрешного совершенства
  choice: с сердцем, всецело преданным Тебе
  alternative: с совершенным сердцем
  rationale: שָׁלֵם обозначает целостность, полноту и неразделённость преданности. Выбранный вариант не превращает молитвенное утверждение Езекии в безусловное учение о его безгрешности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Сохранены библейские образы «ходить пред Богом» и «доброе в Твоих глазах», а менее естественные буквальные соответствия и реальные смысловые варианты вынесены в сноски.
