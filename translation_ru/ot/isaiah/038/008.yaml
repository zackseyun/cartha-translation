- from: Вот, Я верну тень назад на десять ступеней[a] — ту тень, что спустилась по ступеням Ахаза под действием солнца[b]. И солнце вернулось на десять ступеней, по которым оно спустилось.
  to: Вот, Я верну тень назад на десять ступеней[a], по которым она спустилась на ступенях Ахаза от солнца[b]. И солнце вернулось на десять ступеней по ступеням, по которым оно прежде спустилось.
