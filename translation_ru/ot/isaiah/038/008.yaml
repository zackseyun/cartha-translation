base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/008.yaml
  text: Behold[a], I will make the shadow go back ten steps, which had gone down on the steps of Ahaz by the sun[b]. And the sun went back ten steps on the steps on which it had gone down.
translation:
  language: ru
  text: Вот, Я верну тень назад на десять ступеней[a], по которым она спустилась на ступенях Ахаза от солнца[b]. И солнце вернулось на десять ступеней по ступеням, по которым оно прежде спустилось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на десять делений». Еврейское слово буквально означает «ступени» или «подъёмы»; возможно, имеется в виду ступенчатое устройство для наблюдения за солнечной тенью.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на циферблате (солнечных часах) Ахаза». Еврейский текст буквально говорит о «ступенях Ахаза»; возможно, это было сооружение, по которому отмечали положение солнечной тени, но его точное устройство не уточняется.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет торжественное указательное вступление к Божьему обещанию и естественно звучит в современном литературном русском.
- source_word: מֵשִׁיב
  choice: верну ... назад
  rationale: Передаёт каузативное значение породы hифиль глагола שוב и направленность אֲחֹרַנִּית без тяжеловесной конструкции.
- source_word: צֵל
  choice: тень
  rationale: Прямое соответствие еврейскому слову; речь идёт о тени как видимом элементе знамения.
- source_word: מַעֲלוֹת
  choice: ступени
  rationale: Основное конкретное значение — ступени или подъёмы. Оно сохраняет образ исходного текста и не навязывает толкование как солнечных часов.
- source_word: בְמַעֲלוֹת אָחָז
  choice: по ступеням Ахаза
  rationale: Буквально и естественно передаёт связь сооружения с Ахазом, оставляя его точное устройство неопределённым.
- source_word: בַּשֶּׁמֶשׁ
  choice: под действием солнца
  rationale: Передаёт инструментальную или причинную связь нисхождения тени с солнцем яснее, чем буквальное и неестественное «солнцем».
- source_word: עֶשֶׂר מַעֲלוֹת
  choice: десять ступеней
  rationale: Сохраняет число и конкретный пространственный образ; традиционное «десять градусов» является возможным, но более истолковывающим вариантом.
- source_word: וַתָּשָׁב הַשֶּׁמֶשׁ
  choice: И солнце вернулось
  rationale: Сохраняет явно названное в еврейском тексте подлежащее и феноменологическое описание знамения, не предлагая естественно-научного объяснения.
- source_word: אֲשֶׁר יָרָדָה
  choice: по которым оно спустилось
  rationale: Передаёт предшествующее движение вниз и сохраняет грамматическую соотнесённость местоимения с солнцем во второй части стиха.
theological_decisions:
- issue: Характер знамения с солнцем и тенью
  choice: 'Передать событие феноменологически: тень возвращается назад, а солнце «вернулось».'
  alternative: Истолковать всё исключительно как движение показания солнечных часов либо перефразировать текст так, чтобы исключить представление об обратном движении солнца.
  rationale: Еврейский текст описывает чудесное знамение обычным языком наблюдения. Перевод сохраняет это напряжение, не натурализует чудо и не утверждает конкретную научную модель события.
- issue: Точное устройство «ступеней Ахаза»
  choice: Оставить буквальное «ступени Ахаза».
  alternative: Перевести как «солнечные часы Ахаза» или «циферблат Ахаза».
  rationale: Сам еврейский текст не называет сооружение солнечными часами; буквальная формулировка сохраняет подлинную неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. «Вот» сохраняет торжественность без архаичного «се». Синтаксис сделан ясным, но конкретный образ ступеней и феноменологическое описание движения солнца сохранены.
