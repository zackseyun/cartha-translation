  yaml_path: translation/ot/isaiah/038/010.yaml
  text: I said[a], “In the middle of my days I must go through the gates of Sheol[b]; I am deprived of the rest of my years.”
translation:
  language: ru
  text: 'Я сказал: «В середине моих дней[a] мне идти к вратам Шеола[b]; я лишён остатка моих лет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение допускает также переводы: «при пресечении моих дней» или «в расцвете моих дней».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть в мир мёртвых; возможный перевод: «к вратам могилы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְמִי יָמַי
  choice: в середине моих дней
  rationale: Значение דְּמִי спорно, однако параллель с утратой оставшихся лет указывает на середину или расцвет жизни. Формулировка сохраняет образ исходного текста и остаётся понятной по-русски.
- source_word: אֵלֵכָה בְּשַׁעֲרֵי
  choice: должен я войти во врата
  rationale: Имперфект в контексте передаёт ожидаемый и неизбежный уход, а сочетание предлога בְּ с «вратами» допускает понимание вступления через них. Инверсия придаёт фразе достоинство плача, не делая язык архаичным.
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Транслитерация сохраняет особое древнееврейское обозначение мира мёртвых и не сужает его до физической могилы и не отождествляет с позднейшим понятием ада.
- source_word: פֻּקַּדְתִּי
  choice: я лишён
  rationale: В данном плаче пассивная форма выражает утрату предназначавшихся говорящему оставшихся лет; перевод сохраняет пассивность и не называет того, кто их отнимает.
- source_word: יֶתֶר שְׁנוֹתָי
  choice: остатка моих лет
  rationale: Близко передаёт значение «остаток, оставшаяся часть» и сохраняет параллель между «днями» и «годами».
theological_decisions:
- issue: Передача שְׁאוֹל в плаче о приближающейся смерти
  choice: Шеол
  alternative: мир мёртвых; могила
  rationale: «Шеол» сохраняет древнееврейский образ области умерших, не привнося более поздних представлений об аде и не сводя смысл только к месту погребения.
- issue: Направление движения во фразе בְּשַׁעֲרֵי שְׁאוֹל
  choice: войти во врата Шеола
  alternative: отправиться к вратам Шеола
  rationale: Предлог допускает как локативное понимание, так и образ прохождения в область смерти. В контексте неизбежного ухода «войти во врата» естественно передаёт вступление, не развивая образ дальше сказанного.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной инверсией, подходящей для личного плача. Сохранены образы «дней», «врат» и «лет», а термин «Шеол» пояснён в сноске.
