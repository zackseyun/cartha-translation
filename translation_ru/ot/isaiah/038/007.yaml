  text: 'И вот знамение для тебя от Яхве: Яхве совершит это[a], о чём Он сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это дело», «это слово» или «то, о чём идёт речь». Еврейское дава́р может означать слово, дело, событие или предмет речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה לְּךָ הָאוֹת
  choice: И вот тебе знамение
  rationale: «И вот» естественно продолжает повествование и вводит указание на конкретное знамение; дательный «тебе» передаёт адресата.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: מֵאֵת обозначает источник, а личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: אֲשֶׁר יַעֲשֶׂה יְהוָה
  choice: Яхве совершит
  rationale: Глагол עשה имеет широкое значение «делать, совершать»; «совершит» в данном контексте естественно говорит об исполнении возвещённого события, не добавляя значения обещания.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: это дело[a]
  rationale: דָּבָר может обозначать дело, событие, предмет речи или слово. «Это дело» сохраняет направленность на то, что Яхве осуществит, а примечание отмечает лексическую многозначность.
- source_word: אֲשֶׁר דִּבֵּר
  choice: о котором сказал
  rationale: Форма דִּבֵּר указывает на уже произнесённое Яхве; «сказал» звучит естественно по-русски и не усиливает текст до значения «обещал».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В еврейском тексте дважды стоит собственное имя Бога, поэтому оно передано как «Яхве», без замены титулом и без привнесения конфессионального толкования.
- issue: Связь знамения с возвещённым действием
  choice: Двоеточие вводит содержание и подтверждающую силу знамения
  alternative: «знамение… что Яхве совершит»
  rationale: Еврейское אֲשֶׁר допускает пояснительную связь. Двоеточие делает фразу естественной по-русски, не уточняя сверх текста, является ли последующая часть содержанием знамения или объяснением того, что оно подтверждает.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Повтор имени «Яхве» сохранён вслед за еврейским текстом; двоеточие в конце сохранено, поскольку стих непосредственно вводит описание знамения в следующем стихе.
