id: ISA.38.16
reference: Isaiah 38:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֲדֹנָ֖/י עֲלֵי/הֶ֣ם יִֽחְי֑וּ וּ/לְ/כָל בָּ/הֶן֙ חַיֵּ֣י רוּחִ֔/י וְ/תַחֲלִימֵ֖/נִי וְ/הַחֲיֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/016.yaml
  text: Lord[a], by these things men live, and in all these is the life of my spirit[c][b]; so restore me to health and let me live.
translation:
  language: ru
  text: 'Господи, этим живут[a],

    и во всём этом — жизнь моего духа[b].

    Исцели меня[c] и дай мне жить[d]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они живут», «люди живут»; в еврейском тексте подлежащее не названо.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «дух», может также означать «дыхание» или жизненную силу.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «верни мне здоровье».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «оживи меня» или «сохрани мне жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Божественный титул передан естественной русской формой обращения; возможное буквальное «мой Господь» здесь излишне утяжеляло бы молитвенную речь.
- source_word: עֲלֵיהֶם
  choice: этим
  rationale: 'Творительный падеж естественно передаёт вероятный инструментальный смысл: именно благодаря названному прежде люди живут.'
- source_word: יִחְיוּ
  choice: живут
  rationale: Форма третьего лица множественного числа сохранена без добавленного подлежащего, что естественно по-русски и не устраняет неопределённость еврейского текста.
- source_word: וּלְכָל בָּהֶן
  choice: и во всём этом
  rationale: Передаёт совокупный и сферический смысл трудной еврейской конструкции, соотнося её с упомянутыми ранее реалиями.
- source_word: חַיֵּי רוּחִי
  choice: жизнь моего духа
  rationale: Сохраняет конструкцию оригинала и широкий смысл רוּחַ как внутренней жизненной силы; возможный оттенок «дыхания» отмечен в сноске.
- source_word: וְתַחֲלִימֵנִי
  choice: исцели меня
  rationale: В контексте болезни каузативный глагол означает возвращение здоровья; краткая русская формулировка звучит как естественная молитвенная просьба.
- source_word: וְהַחֲיֵנִי
  choice: дай мне жить
  rationale: Передаёт каузативное значение חיה, не сужая его непременно до оживления после смерти или только сохранения уже имеющейся жизни.
theological_decisions:
- issue: Неявное подлежащее при יִחְיוּ
  choice: 'Подлежащее не добавлено: «живут»'
  alternative: «люди живут»; «они живут»; «человек живёт»
  rationale: Еврейский глагол стоит во множественном числе, но явного подлежащего нет. Русская неопределённо-личная конструкция сохраняет эту открытость и не определяет группу без основания.
- issue: Значение רוּחִי в молитве об исцелении
  choice: «моего духа»
  alternative: «моего дыхания»; «моей жизни»
  rationale: «Дух» сохраняет многозначность исходного слова и связь с внутренней жизненной силой человека, не сводя выражение лишь к физическому дыханию.
- issue: Каузативное значение וְהַחֲיֵנִי
  choice: «дай мне жить»
  alternative: «оживи меня»; «сохрани мне жизнь»
  rationale: Выбранная формулировка сохраняет молитвенную просьбу о жизни, не решая однозначно, просит ли говорящий восстановления жизненных сил или сохранения жизни.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным молитвенным звучанием. Параллелизм двух строк сохранён; синтаксическая и лексическая неоднозначность оригинала не устранена молча.
