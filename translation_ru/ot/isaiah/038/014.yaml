base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/014.yaml
  text: Like a swift or a crane[a], so I chirp; I moan like a dove. My eyes grow weak looking upward. Lord, I am oppressed; be my pledge.
translation:
  language: ru
  text: 'Как стриж или журавль[a], я пищу;

    стону, как голубь.

    Глаза мои изнемогли, глядя ввысь.

    Владыка, я угнетён — поручись за меня!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному отождествлению: «Как ласточка или журавль». Точное значение первого названия птицы неизвестно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּסוּס עָגוּר
  choice: Как стриж или журавль
  rationale: Названия птиц, особенно סוּס, определяются неуверенно. «Стриж» отражает одно из распространённых современных отождествлений, а «журавль» — обычное понимание עָגוּר; союз «или» сохраняет неопределённость, представленную в консультационном слое.
- source_word: אֲצַפְצֵף
  choice: я пищу
  rationale: Глагол передаёт высокий, тонкий птичий крик. «Пищу» естественно передаёт слабый, жалобный звук и отличается от следующего низкого стона.
- source_word: אֶהְגֶּה
  choice: стону
  rationale: В контексте плача глагол обозначает тихий, низкий звук или стон; «стону» ясно выражает страдание.
- source_word: כַּיּוֹנָה
  choice: как голубь
  rationale: Прямое сравнение с жалобным воркованием голубя.
- source_word: דַּלּוּ עֵינַי
  choice: Глаза мои изнемогли
  rationale: Еврейская идиома описывает глаза, ослабевшие и утомлённые от напряжённого ожидания; «изнемогли» сохраняет образ и возвышенный тон без архаичности.
- source_word: לַמָּרוֹם
  choice: глядя ввысь
  rationale: Буквально «к высоте, ввысь». Формулировка передаёт направление взгляда, не подставляя более конкретное «к небу».
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Это обращение-титул, а не тетраграмматон. «Владыка» естественно в молитвенном контексте и позволяет не смешивать титул с особым обозначением имени YHWH.
- source_word: עָשְׁקָה לִּי
  choice: я угнетён
  rationale: Краткая и трудная конструкция от корня עשׁק выражает притеснение или причинённую несправедливость. Пассивная формулировка сохраняет неопределённость относительно того, кто угнетает говорящего.
- source_word: עָרְבֵנִי
  choice: поручись за меня
  rationale: Глагол несёт юридико-отношенческий образ поручительства или гарантии. «Поручись за меня» понятно современному читателю и точнее общего «помоги мне».
theological_decisions:
- issue: Передача обращения אֲדֹנָי
  choice: Владыка
  alternative: Господь; мой Владыка
  rationale: Еврейский текст употребляет божественный титул, а не имя YHWH. Перевод «Владыка» сохраняет прямое обращение к Богу и отличает титул от принятой передачи тетраграмматона.
- issue: Неопределённость названий птиц в כְּסוּס עָגוּר
  choice: Как стриж или журавль
  alternative: Как ласточка или журавль
  rationale: Точное зоологическое отождествление первого названия спорно. Основной текст не выдаёт одну идентификацию за несомненную, а традиционный вариант приводится в сноске.
- issue: Образ в עָרְבֵנִי
  choice: поручись за меня
  alternative: вступись за меня; помоги мне
  rationale: Просьба обращена к Богу, однако текст сохраняет конкретный образ поручителя. Более общее «помоги» сняло бы смысловую напряжённость и юридическую метафору.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного плача. Параллельные короткие строки сохраняют смену высокого птичьего писка и низкого стона; юридический образ поручительства оставлен без упрощения.
