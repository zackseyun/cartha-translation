    text: 'Или: «Яхве спасёт меня»; более буквально: «Яхве — спасти меня». Еврейская конструкция эллиптична.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мои песни на струнных инструментах»; «мою струнную музыку».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «при доме Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לְהוֹשִׁיעֵנִי
  choice: спасёт меня
  rationale: Эллиптическая конструкция буквально означает «Яхве — спасти меня»; в контексте благодарения естественно выражает спасительное действие Яхве, при этом подстрочная альтернатива сохраняет грамматическую неоднозначность.
- source_word: וּנְגִינוֹתַי
  choice: мои песни на струнных инструментах
  rationale: Существительное обозначает песни или музыку, связанную со струнным сопровождением; перевод сохраняет принадлежность говорящему и инструментальный оттенок.
- source_word: נְנַגֵּן
  choice: мы будем играть
  rationale: Порода piel глагола נגן обычно обозначает игру на музыкальном инструменте или исполнение музыки; форма первого лица множественного числа передана прямо.
- source_word: כָּל יְמֵי חַיֵּינוּ
  choice: во все дни нашей жизни
  rationale: Естественно передаёт еврейское устойчивое выражение, обозначающее всю продолжительность жизни.
- source_word: עַל בֵּית יְהוָה
  choice: в доме Яхве
  rationale: Предлог עַל здесь, вероятно, имеет локативное значение, связанное с богослужением при храме; «в доме» естественно по-русски, а возможное «при доме» отмечено в сноске.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; форма «Яхве» сохраняет это имя без замены титулом.
- issue: Характер спасительного действия в эллиптической фразе לְהוֹשִׁיעֵנִי
  choice: спасёт меня
  alternative: 'готов спасти меня; буквально: спасти меня'
  rationale: Контекст песни благодарения поддерживает утверждение о спасении, но необычная эллиптическая форма не позволяет безоговорочно уточнять готовность или временной оттенок, поэтому варианты вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Синтаксис сохраняет поэтический параллелизм и переход от единственного числа «меня/мои» к множественному «мы/нашей», присутствующий в еврейском тексте.
