  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּב֣וֹא אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/001.yaml
  text: 'In those days Hezekiah became sick to the point of death[a], and Isaiah the prophet, the son of Amoz, came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you shall not live.”'
translation:
  language: ru
  text: 'В те дни Езекия смертельно заболел[a]. К нему пришёл пророк Исаия, сын Амоса, и сказал ему: «Так говорит Яхве: распорядись делами своего дома, ибо ты умрёшь и не будешь жить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «заболел до смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Сохраняет обычную еврейскую временную формулу и повествовательную связь с контекстом.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: Езекия смертельно заболел
  rationale: Естественно передаёт заболевание, достигшее смертельной степени; примечание сохраняет более буквальную возможность перевода конструкции לָמוּת.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: пророк Исаия, сын Амоса
  rationale: Передаёт все приложения в естественном для современного русского языка порядке.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет торжественную пророческую формулу и передаёт тетраграмматон как личное имя.
- source_word: צַו לְבֵיתֶךָ
  choice: распорядись о своём доме
  rationale: Сохраняет образ дома и одновременно выражает требование отдать необходимые распоряжения семье и домашнему устроению перед смертью.
- source_word: כִּי מֵת אַתָּה
  choice: потому что ты умрёшь
  rationale: В контексте причастная конструкция объявляет неминуемую предстоящую смерть; буквальное «ты мёртв» было бы вводящим в заблуждение.
- source_word: וְלֹא תִחְיֶה
  choice: и не будешь жить
  rationale: Прямо передаёт отрицание дальнейшей жизни, не сужая смысл до медицинского «не выздоровеешь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя без замены титулом.
- issue: Сила объявления כִּי מֵת אַתָּה וְלֹא תִחְיֶה
  choice: «ты умрёшь и не будешь жить» как категорическое объявление предстоящей смерти
  alternative: «ты умираешь»; «ты мёртв»; «ты не выздоровеешь»
  rationale: Формулировка сохраняет пророческую определённость и напряжение текста, не создавая невозможного смысла настоящей смерти и не сводя высказывание лишь к вопросу выздоровления.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим регистром. Устранён тяжеловесный повтор «к нему… ему» там, где русский синтаксис позволяет сохранить смысл без него; формула «Так говорит Яхве» оставлена торжественной и прямой.
