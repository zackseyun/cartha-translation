base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/012.yaml
  text: My dwelling is pulled up and carried away from me like a shepherd’s tent[a]; I have rolled up my life like a weaver; from the loom he cuts me off[c][b]. From day to night you bring me to an end.
translation:
  language: ru
  text: Моё жилище снято и унесено от меня, словно шатёр пастуха[a]. Я свернул, как ткач, свою жизнь[b]; от основы он отрезает меня[c]. От дня до ночи ты доводишь меня до конца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поколение моё удалилось и отнято у меня, словно шатёр пастуха». Еврейское слово обычно означает «поколение», но здесь может иметь значение «жилище, обиталище».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я оборвал свою жизнь, как ткач». Значение еврейского глагола не вполне ясно; перевод «свернул» следует ткацкому образу.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «от нитей основы он отрезает меня». Еврейское слово обозначает свисающие нити или основу на ткацком станке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹרִי
  choice: жилище моё
  rationale: Хотя דּוֹר обычно означает «поколение», здесь образ снимаемого пастушеского шатра поддерживает значение «жилище, обиталище». В сноске сохранено основное лексическое прочтение.
- source_word: נִסַּע וְנִגְלָה
  choice: снято и унесено
  rationale: Сочетание глаголов конкретно передаёт снятие и удаление переносного шатра; страдательная конструкция исходного текста сохранена.
- source_word: כְּאֹהֶל רֹעִי
  choice: словно шатёр пастуха
  rationale: Естественно передаёт образ временного переносного укрытия пастуха.
- source_word: קִפַּדְתִּי
  choice: я свернул
  rationale: Трудный глагол истолкован в рамках ткацкого образа как сворачивание ткани; альтернативное «я оборвал» отмечено в сноске.
- source_word: כָאֹרֵג חַיַּי
  choice: свою жизнь, как ткач
  rationale: 'Сохраняет сжатое поэтическое сравнение: говорящий уподобляет обращение со своей жизнью работе ткача.'
- source_word: מִדַּלָּה
  choice: от основы
  rationale: Термин относится к свисающим нитям или основе на ткацком станке. «От основы» сохраняет специальный ткацкий образ, оставаясь понятным из контекста.
- source_word: יְבַצְּעֵנִי
  choice: он отрезает меня
  rationale: Глагол обозначает отсечение или обрыв и одновременно продолжает образ ткани и выражает прекращение жизни.
- source_word: מִיּוֹם עַד לַיְלָה
  choice: от дня до ночи
  rationale: Близко передаёт еврейскую формулу и подчёркивает стремительность приближающегося конца.
- source_word: תַּשְׁלִימֵנִי
  choice: ты доводишь меня до конца
  rationale: Передаёт каузативное значение «завершать, приводить к концу» в прямом обращении второго лица и сохраняет торжественный тон.
theological_decisions:
- issue: Смена грамматического лица с третьего на второе
  choice: 'Сохранить: «он отрезает меня… ты доводишь меня до конца»'
  alternative: 'Согласовать обе части как прямое обращение к Богу: «ты отрезаешь меня… ты доводишь меня до конца»'
  rationale: В еврейском тексте после формы третьего лица יְבַצְּעֵנִי следует форма второго лица תַּשְׁלִימֵנִי. Сохранение смены лица передаёт напряжённость поэтической речи и не сглаживает синтаксис.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатой поэтической образности. Выбраны понятные, но не разговорные слова. Строчные «он» и «ты» следуют современной издательской практике и не устраняют неоднозначность третьего лица.
