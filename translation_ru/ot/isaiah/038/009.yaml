  yaml_path: translation/ot/isaiah/038/009.yaml
  text: 'A writing of Hezekiah king of Judah[b][a], when he had been sick and had recovered from his sickness:'
translation:
  language: ru
  text: 'Письменное произведение[a] Езекии, царя Иудеи, когда он был болен и выздоровел от своей болезни[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Запись Езекии»; возможно также: «Стихотворение Езекии». Еврейское слово означает письменное произведение, не определяя точно его жанр.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и ожил от своей болезни»; то есть поправился, выздоровел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּב
  choice: Письменное произведение
  rationale: Существительное обозначает письменный текст, не уточняя его жанр. Такой перевод сохраняет широту значения и не определяет последующий текст как псалом или стихотворение.
- source_word: לְחִזְקִיָּהוּ
  choice: Езекии
  rationale: Предлог לְ в заголовке указывает на авторство или принадлежность; русская родительная конструкция естественно передаёт эту атрибуцию.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Прямой и естественный перевод статусного обозначения и названия царства.
- source_word: בַּחֲלֹתוֹ
  choice: после того как он переболел
  rationale: Инфинитивная конструкция задаёт временное обстоятельство болезни. В сочетании со следующим сообщением о выздоровлении русский ретроспективный оборот естественно передаёт последовательность событий.
- source_word: וַיְחִי
  choice: выздоровел
  rationale: Буквально глагол означает «ожил/жил», но в сочетании с «от своей болезни» идиоматически сообщает о восстановлении здоровья, а не о воскресении.
- source_word: מֵחָלְיוֹ
  choice: от болезни (передано в сочетании «переболел и выздоровел»)
  rationale: Предлог מִן выражает избавление или выход из состояния болезни. В русском глагол «выздоровел» уже включает значение восстановления после болезни, поэтому буквальное повторение было бы тяжеловесным.
