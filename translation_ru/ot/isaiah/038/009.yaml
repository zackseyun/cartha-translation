translation_notes:
  register: Современный литературный русский язык с достоинством заголовочной формулы. «Письменное произведение» несколько формально, но точно сохраняет жанровую неопределённость מִכְתָּב. Формулировка «переболел и выздоровел» звучит естественно и ясно передаёт ретроспективный характер надписания.
