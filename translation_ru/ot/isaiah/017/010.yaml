  text: כִּ֤י שָׁכַ֨חַתְּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/ךְ וְ/צ֥וּר מָעֻזֵּ֖/ךְ לֹ֣א זָכָ֑רְתְּ עַל כֵּ֗ן תִּטְּעִי֙ נִטְעֵ֣י נַעֲמָנִ֔ים וּ/זְמֹ֥רַת זָ֖ר תִּזְרָעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/010.yaml
  text: For you have forgotten the God of your salvation[a], and have not remembered the Rock of your refuge[c][b]; therefore you plant pleasant plants and sow it with a foreign vine.
translation:
  language: ru
  text: Ибо ты забыла Бога твоего спасения и не вспомнила Скалу, прибежище твоё; поэтому ты разводишь приятные насаждения[a] и засаживаешь их чужеземной лозой[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отборные насаждения». Возможно, имеются в виду растения, использовавшиеся в чужеземных религиозных обрядах.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чужой побег» или «чужеземный побег».'
    reason: lexical_alternative
  - marker: c
    text: Этот земледельческий образ может намекать на упование на чужеземные культы или союзы вместо Господа, однако еврейский текст не говорит об этом прямо.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁכַחַתְּ
  choice: ты забыла
  rationale: Qal, перфект, 2-е лицо женского рода единственного числа. Русское прошедшее время естественно передаёт завершённое действие; женский род сохраняет обращение к Дамаску.
- source_word: אֱלֹהֵי יִשְׁעֵךְ
  choice: Бога спасения твоего
  rationale: Сохраняет конструктивную цепь и существительное יֵשַׁע («спасение»), а также поддерживает возвышенный, но понятный библейский регистр.
- source_word: צוּר מָעֻזֵּךְ
  choice: Скалу, прибежище твоё
  rationale: צוּר сохранено как метафорическое «Скала»; приложение «прибежище твоё» естественно выражает защитный смысл מָעוֹז, не превращая образ в сугубо военную крепость.
- source_word: לֹא זָכָרְתְּ
  choice: не вспомнила
  rationale: Передаёт параллель к «забыла» без толковательного расширения.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Прямо выражает причинно-следственную связь.
- source_word: תִּטְּעִי נִטְעֵי נַעֲמָנִים
  choice: ты разводишь сады из приятных растений
  rationale: Имперфект передан настоящим временем как описание последующего поведения. «Приятные растения» сохраняет широкое значение נַעֲמָנִים, а «разводишь сады» естественно передаёт внутренний объект «насаждаешь насаждения».
- source_word: זְמֹרַת זָר
  choice: чужеземными виноградными побегами
  rationale: זְמֹרָה означает виноградную ветвь или побег, а זָר — чужой, иноземный. Такая передача точнее общего слова «лоза» и сохраняет земледельческий образ.
- source_word: תִּזְרָעֶנּוּ
  choice: засаживаешь их
  rationale: Буквально глагол связан с сеянием, однако применительно к виноградным побегам русское «засаживаешь» звучит естественно. Местоимение во множественном числе согласовано с русским словом «сады», поскольку еврейский суффикс относится к собирательно представленному насаждению.
theological_decisions:
- issue: Следует ли прямо истолковать земледельческие образы как языческий культ или опору на чужеземные союзы
  choice: Оставить в основном тексте земледельческие образы без явного отождествления с идолопоклонством или политическими союзами.
  alternative: Перевести как указание на культовые сады, языческие обряды либо зависимость от чужеземных держав.
  rationale: Контекст забвения Бога допускает такие толкования, но еврейский текст прямо их не называет. Буквальная образность сохраняет намеренную недосказанность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «Бога спасения твоего» и «прибежище твоё» сохраняет достоинство и поэтический параллелизм, оставаясь понятной современному читателю. Обращение передано в женском роде согласно еврейской грамматике и контексту обращения к Дамаску.
