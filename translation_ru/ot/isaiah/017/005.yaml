base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/005.yaml
  text: And it will be as when one gathers standing grain at harvest[a], and his arm reaps the ears[b]; and it will be as when one gleans ears in the Valley of Rephaim.
translation:
  language: ru
  text: И будет это подобно тому, как жнец собирает хлеб на корню, и его рука срезает колосья; будет подобно тому, как подбирают колосья в долине Рефаим[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рефаим — географическое название; это имя также связывают со значением «исполины».
    reason: alternative_reading
lexical_decisions:
- source_word: כֶּאֱסֹף קָצִיר קָמָה
  choice: как жнец собирает стоящий хлеб
  rationale: Оборот с כְּ и инфинитивом передаёт сравнение. קָצִיר допускает значение «жатва» и метонимически «жнец»; в данном контексте личный субъект естественно согласуется с последующим «его рука». «Стоящий хлеб» — принятое русское обозначение несжатых злаков.
- source_word: וּזְרֹעוֹ
  choice: и рукой
  rationale: 'Буквально: «и его рука». Русский творительный естественно передаёт орудийную роль руки, сохраняя телесный образ без тяжеловесной конструкции.'
- source_word: שִׁבֳּלִים יִקְצוֹר
  choice: срезает колосья
  rationale: יִקְצוֹר означает жать, срезать при жатве; сочетание «срезает колосья» ясно и естественно передаёт конкретное действие.
- source_word: כִּמְלַקֵּט שִׁבֳּלִים
  choice: подобно тому, как подбирают колосья
  rationale: לקט обозначает собирание оставшегося после жатвы. «Подбирают колосья» понятно современному читателю и сохраняет образ скудного остатка.
- source_word: בְּעֵמֶק רְפָאִים
  choice: в долине Рефаим
  rationale: Рְפָאִים здесь входит в географическое название; транслитерация избегает спорного истолкования имени как «исполины».
theological_decisions:
- issue: Передача רְפָאִים в составе топонима
  choice: Рефаим
  alternative: исполинов
  rationale: Контекст указывает на название известной долины. Транслитерация сохраняет имя собственное и не навязывает его возможную этимологию.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного пророческого ритма. Сельскохозяйственный образ передан понятными выражениями «стоящий хлеб», «срезает колосья» и «подбирают колосья».
