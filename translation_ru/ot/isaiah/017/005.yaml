  rationale: Сохранён подразумеваемый в сравнении жнец, но восстановлено явно выраженное «его рука». «Хлеб на корню» естественно передаёт קָמָה — несжатое, стоящее в поле зерно. Топоним и сноска сохранены без интерпретационного навязывания.
