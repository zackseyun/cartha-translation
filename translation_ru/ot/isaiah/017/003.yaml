review_pass:
  verdict: revise
  source_fidelity: 'Нужна безопасная правка. מִן в обоих первых членах естественнее передать как «из»: «исчезнет из Ефрема» и «из Дамаска». Это сохраняет параллелизм оригинала и не персонифицирует города/области оборотом «у». מַמְלָכָה следует передать «царство», а не более узко истолковывающим «царская власть». Формулу נְאֻם точнее передаёт «возвещает», чем «Таково слово».'
  naturalness: Предлагаемый текст звучит как современный литературный русский с уместной пророческой торжественностью. Конструкции «крепость у Ефрема» и «царская власть — у Дамаска» в данном контексте неестественны; «из Ефрема / из Дамаска» яснее и ближе к исходному синтаксису.
  terminology: Сохранены имена «Ефрем» и «Арам», «слава» для כָּבוֹד и традиционный титул «Господь Воинств». «Сынов Израиля» точно воспроизводит בְּנֵי יִשְׂרָאֵל. Смысл сравнения не истолкован в основном тексте.
  issues:
  - severity: medium
    issue: Передача מִן как «у Ефрема / у Дамаска»
    rationale: В параллельных выражениях в оригинале крепость прекращается «из Ефрема», а царство — «из Дамаска». Оборот «у» менее естественен и несколько меняет образ на лишение, принадлежащее персонифицированному субъекту.
  - severity: medium
    issue: «Царская власть» вместо «царство»
    rationale: מַמְלָכָה прежде всего означает «царство, царство как политическое образование». «Царская власть» возможна лексически, но здесь необязательно сужает смысл и нарушает прямую эквивалентность.
  - severity: low
    issue: «Таково слово Господа Воинств»
    rationale: Это допустимая формула, но נְאֻם точнее и естественно передать глаголом «возвещает» или «говорит»; так сохраняется декларативная пророческая формула.
  - severity: low
    issue: Формулировка сноски a
    rationale: Фраза «постигнет то же умаление, что и славу Израиля» синтаксически неудачна и представляет контекстуальный вывод как «вероятный». Следует нейтрально обозначить возможное прочтение, не снимая неоднозначности.
