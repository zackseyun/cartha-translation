  text: וְ/נִשְׁבַּ֤ת מִבְצָר֙ מֵֽ/אֶפְרַ֔יִם וּ/מַמְלָכָ֥ה מִ/דַּמֶּ֖שֶׂק וּ/שְׁאָ֣ר אֲרָ֑ם כִּ/כְב֤וֹד בְּנֵֽי יִשְׂרָאֵל֙ יִֽהְי֔וּ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/003.yaml
  text: And the fortress will cease from Ephraim[a], and the kingdom from Damascus; and the remnant of Aram will be like the glory of the sons of Israel[b], declares Yahweh of hosts.
translation:
  language: ru
  text: 'И исчезнет крепость из Ефрема,

    и царство — из Дамаска;

    а остаток Арама будет подобен славе сынов Израиля.[a]


    Возвещает Господь Воинств.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Смысл сравнения не уточнён. Оно может означать, что остаток Арама разделит предстоящее умаление славы Израиля. Слово «слава» может также означать честь или великолепие.
    reason: alternative_reading; lexical_alternative
  - marker: b
    text: 'Буквально: «изречение Господа Воинств».'
    reason: literal_rendering
lexical_decisions:
- source_word: וְנִשְׁבַּת
  choice: и исчезнет
  rationale: Нифаль глагола שׁבת обозначает прекращение или устранение. «Исчезнет» естественно передаёт прекращение существования крепости, не усиливая смысл до прямого «будет уничтожена».
- source_word: מִבְצָר
  choice: крепость
  rationale: Существительное в единственном числе означает укреплённое место или твердыню; «крепость» сохраняет конкретный военный смысл.
- source_word: מֵאֶפְרַיִם
  choice: у Ефрема
  rationale: Предлог מן при глаголе прекращения указывает, где или у кого перестанет существовать крепость. Имя Ефрем сохранено без истолкования как всего Северного царства.
- source_word: וּמַמְלָכָה
  choice: и царская власть
  rationale: מַמְלָכָה может обозначать царство, царское правление или власть. В параллели с исчезновением крепости «царская власть» естественно выражает то, чего лишится Дамаск, и не требует подразумевать исчезновение территории.
- source_word: מִדַּמֶּשֶׂק
  choice: у Дамаска
  rationale: 'Предлог מן передаёт лишение: царская власть прекратится у Дамаска.'
- source_word: וּשְׁאָר אֲרָם
  choice: а остаток Арама
  rationale: שְׁאָר — «остаток, оставшаяся часть». «Арам» сохраняет собственное имя исходного текста, не заменяя его позднейшим названием «Сирия».
- source_word: כִּכְבוֹד
  choice: станет подобен славе
  rationale: כְּ выражает сравнение, а כָּבוֹד допускает значения «слава», «честь», «величие». «Слава» сохраняет широкую семантику и пророческий регистр.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Буквально сохранена мужская форма בְּנֵי и устойчивое библейское обозначение потомков Израиля.
- source_word: יִהְיוּ
  choice: станет
  rationale: Форма множественного числа согласуется с собирательным «остатком» по смыслу. В русском единственное число требуется грамматикой слова «остаток».
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: Таково слово Господа Воинств
  rationale: נְאֻם — формула пророческого изречения. «Таково слово» звучит естественно и торжественно; имя יהוה передано принятой формой «Господь», а צְבָאוֹת — «Воинств» как традиционный титул.
theological_decisions:
- issue: Смысл сравнения остатка Арама со славой сынов Израиля
  choice: 'Сравнение оставлено без пояснения его основания: «станет подобен славе сынов Израиля».'
  alternative: Можно истолковать его как указание на то, что остаток Арама разделит предстоящее умаление славы Израиля.
  rationale: Еврейский текст не называет признак сходства. Контекст указывает на утрату величия, однако включение этого вывода в основной текст устранило бы подлинную неоднозначность.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Форма «Господь» соответствует устойчивой русской библейской традиции и воспринимается как передача божественного имени, не вводя конфессионально специфического произношения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм оригинала сохранён, но эллипсис раскрыт формой «царская власть — у Дамаска». Имена Ефрем и Арам оставлены как в еврейском тексте.
