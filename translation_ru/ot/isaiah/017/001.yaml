lexical_decisions:
- source_word: מַשָּׂא
  choice: пророчество
  rationale: В заголовках пророческих речей слово обозначает торжественное возвещение, нередко о суде. «Пророчество» естественно для современного русского языка; возможные оттенки «бремя» и «возвещение» отмечены в сноске.
- source_word: דַּמָּשֶׂק
  choice: Дамаск
  rationale: Использована общепринятая русская форма географического названия.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет функцию привлечения внимания и придаёт объявлению торжественную, наглядную силу без архаизации.
- source_word: מוּסָר מֵעִיר
  choice: перестанет быть городом
  rationale: Буквально выражено удаление Дамаска из состояния или статуса города. Русская формулировка естественно передаёт смысл, а буквальная конструкция приведена в сноске.
- source_word: וְהָיְתָה
  choice: и превратится
  rationale: В контексте глагол описывает переход в новое состояние как результат предсказанного суда.
- source_word: מְעִי מַפָּלָה
  choice: груду развалин
  rationale: Сочетание рисует образ нагромождения, возникшего вследствие падения и разрушения; эта формулировка ясна и образна в современном русском языке.
