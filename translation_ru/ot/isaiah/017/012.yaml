base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/012.yaml
  text: Ah[a], the roar of many peoples— they roar like the roaring of the seas[b]; and the rushing of nations— they rush like the rushing of mighty waters.
translation:
  language: ru
  text: О, шум множества народов — они шумят, как шумят моря; и грохот племён — они грохочут, как грохочут могучие воды.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Горе множеству народов…» либо «Увы, множество народов…». Начальное «о» передаёт еврейское הוֹי, которое может выражать плач, предупреждение или сильный возглас.'
    reason: alternative_reading
  - marker: b
    text: В еврейском тексте повторяются слова, связанные со значениями «шум/грохот»; этим усиливается образ народов, подобных бурным морям и могучим водам.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: О
  rationale: Междометие вводит сильное восклицание и не предрешает, выражает ли оно скорбь, угрозу или призыв обратить внимание; возможное значение «горе» отмечено в сноске.
- source_word: הֲמוֹן עַמִּים רַבִּים
  choice: гул множества народов
  rationale: הֲמוֹן может означать и множество, и производимый им гул. Такое сочетание сохраняет одновременно представление о многочисленности народов и ведущий звуковой образ.
- source_word: כַּהֲמוֹת יַמִּים יֶהֱמָיוּן
  choice: они гудят, как гудят моря
  rationale: Повтор однокоренных форм הֲמוֹן/הָמָה передан повтором «гул/гудят», а множественное יַמִּים — словом «моря».
- source_word: וּשְׁאוֹן לְאֻמִּים
  choice: И шум племён
  rationale: שָׁאוֹן обозначает громкий шум или грохот; «шум» естественно сохраняет акустический образ. «Племена» отличает לְאֻמִּים от עַמִּים, не превращая лексическое варьирование в жёсткое смысловое разграничение.
- source_word: כִּשְׁאוֹן מַיִם כַּבִּירִים יִשָּׁאוּן
  choice: они шумят, как могучие воды
  rationale: Повтор существительного и родственного ему глагола передан словами «шум/шумят». «Могучие воды» выражает силу и огромность מַיִם כַּבִּירִים, сохраняя поэтический регистр.
theological_decisions:
- issue: Смысл начального הוֹי
  choice: Нейтрально-восклицательное «О» в основном тексте
  alternative: «Горе» или «увы»
  rationale: Контекст допускает плач, предупреждение или возглас внимания. Основной текст не превращает неоднозначное междометие в однозначное провозглашение суда; варианты сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтической ритмикой. Однокоренные повторы намеренно сохранены, поскольку они воспроизводят звуковую ткань еврейского текста. «Народы/племена» передают параллельные коллективные обозначения без навязывания строгого политического различия.
