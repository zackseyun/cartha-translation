base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/013.yaml
  text: The peoples roar like the roaring of many waters[a], but he rebukes it, and it flees far away, chased like chaff on the mountains before the wind[d][c][b], and like whirling dust before the storm.
translation:
  language: ru
  text: Народы шумят, словно шумят многие воды[a]. Но он грозно прикрикнет на этот шум — и он умчится вдаль, гонимый, словно мякина на горах перед ветром[b] и словно кружащийся прах перед бурей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «племена шумят, словно шумят могучие воды».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте после множественного «народы» стоят формы единственного числа: «прикрикнет на него… он умчится… будет гоним»; множество представлено как единый шум или единая масса.'
    reason: alternative_reading
  - marker: c
    text: Еврейское слово может означать нечто катящееся или кружащееся; возможны переводы «перекати-поле» или «кружащийся мусор». «Буря» также может быть переведена как «вихрь» или «буря-ураган».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֻמִּים
  choice: народы
  rationale: Передаёт множественное число и совокупность этнических и национальных общностей, не сужая значение до политических государств.
- source_word: כִּשְׁאוֹן מַיִם רַבִּים יִשָּׁאוּן
  choice: шумят, словно шумят многие воды
  rationale: Сохраняет звуковой образ мощного водного гула и поэтический повтор существительного и родственного ему по смыслу глагола.
- source_word: וְגָעַר בּוֹ
  choice: Но Он прикрикнет на этот гул
  rationale: «Прикрикнет» передаёт властное пресечение; указание на гул позволяет естественно сохранить мужской род единственного числа местоименного суффикса. Личность действующего лица не называется, поэтому «Он» оставлено без добавления имени.
- source_word: וְנָס מִמֶּרְחָק
  choice: и тот умчится вдаль
  rationale: Единственное число продолжает представление общего гула народов как единой массы; «вдаль» естественно передаёт удаление на большое расстояние.
- source_word: וְרֻדַּף כְּמֹץ הָרִים
  choice: гонимый, словно мякина в горах
  rationale: Страдательная форма сохранена причастием «гонимый»; «мякина» является точным и узнаваемым образом лёгкого материала, уносимого ветром. Локативное «в горах» естественно передаёт сжатое еврейское сочетание.
- source_word: וּכְגַלְגַּל
  choice: и словно кружащийся прах
  rationale: גַּלְגַּל обозначает нечто катящееся или кружащееся; «кружащийся прах» ясно передаёт движение лёгкого мусора, не отождествляя его без достаточной уверенности с конкретным растением.
- source_word: לִפְנֵי סוּפָה
  choice: перед бурей
  rationale: «Буря» передаёт сильную, стремительную непогоду и сохраняет возможность вихревого движения, не ограничивая значение только смерчем.
theological_decisions:
- issue: Единственное число после множественного «народы»
  choice: Единственное число сохранено через «этот гул — и тот», представляя множество народов как единый гул или единую массу.
  alternative: 'Согласовать по-русски во множественном числе: «прикрикнет на них — и они убегут».'
  rationale: В еврейском после множественного יִשָּׁאוּן следуют формы единственного числа בּוֹ, וְנָס и וְרֻדַּף. Русская формулировка сохраняет этот значимый сдвиг, не исправляя его молча.
- issue: Кто совершает запрещающее действие
  choice: Субъект передан местоимением «Он» без прямого именования.
  alternative: Добавить «Господь».
  rationale: Контекст подразумевает Бога, однако в самом стихе имя не названо; перевод не вносит его явно.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой образностью. Повтор «шумят… шумят» намеренно сохраняет звуковую настойчивость оригинала; заглавное «Он» отмечает подразумеваемого Бога, не добавляя отсутствующего в стихе имени.
