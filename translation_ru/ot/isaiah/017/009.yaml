  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִהְי֣וּ עָרֵ֣י מָעֻזּ֗/וֹ כַּ/עֲזוּבַ֤ת הַ/חֹ֨רֶשׁ֙ וְ/הָ֣/אָמִ֔יר אֲשֶׁ֣ר עָזְב֔וּ מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָיְתָ֖ה שְׁמָמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/009.yaml
  text: In that day his fortified cities will be like the deserted places of the forest and the treetop[a], which they abandoned before the sons of Israel[b]; and it will become a desolation.
translation:
  language: ru
  text: В тот день его укреплённые города будут подобны покинутым местам в лесу и на вершине дерева[a], которые оставили перед сынами Израиля[b], — и станут запустением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на самой верхней ветви». Еврейское слово обозначает верхушку дерева или его верхнюю ветвь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которые оставили из-за сынов Израиля». Еврейское выражение может обозначать уход перед чьим-либо присутствием или его причину.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָרֵי מָעֻזּוֹ
  choice: его укреплённые города
  rationale: Сочетание буквально означает «города его крепости / оплота»; определение «укреплённые» естественно передаёт назначение этих городов, а местоименный суффикс сохранён.
- source_word: כַּעֲזוּבַת הַחֹרֶשׁ
  choice: подобны покинутым местам в лесу
  rationale: Форма от עזב выражает оставленность или заброшенность, а חֹרֶשׁ обозначает лес либо густую поросль. Множественное «местам» делает образ понятным по-русски, не устраняя его необычности.
- source_word: וְהָאָמִיר
  choice: и на вершине дерева
  rationale: אָמִיר может обозначать верхушку дерева или самую верхнюю ветвь. Основной текст передаёт пространственный образ естественным русским выражением; более буквальная альтернатива дана в сноске.
- source_word: אֲשֶׁר עָזְבוּ
  choice: которые оставили
  rationale: Сохранён действительный залог и неопределённый подразумеваемый субъект множественного числа, как в еврейском тексте.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: отступив перед сынами Израиля
  rationale: מִפְּנֵי буквально передаёт движение «от лица / от присутствия» кого-либо и здесь допускает оттенок отступления. Формулировка сохраняет образ присутствия Израиля, а возможный причинный смысл вынесен в сноску.
- source_word: וְהָיְתָה שְׁמָמָה
  choice: и там будет запустение
  rationale: Шְׁמָמָה обозначает опустошение, запустение. Безличная русская конструкция естественно передаёт итоговое состояние и не вводит не названный в стихе субъект женского рода.
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Устойчивое и ясное соответствие пророческой временной формуле.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: народ Израиля / израильтяне
  rationale: Сохранена форма стандартного еврейского этнонима и её межтекстовое звучание; выражение в данном контексте обозначает народ Израиля в историческом повествовании.
- issue: Связь מִפְּנֵי с оставлением мест
  choice: отступив перед сынами Израиля
  alternative: из-за сынов Израиля
  rationale: Основной вариант сохраняет пространственный образ ухода от чьего-либо присутствия, не исключая причинного оттенка; причинное понимание явно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Необычный лесной образ и неопределённый субъект глагола «оставили» сохранены, а не сглажены толкованием. Тире перед заключительной частью помогает ясно отделить итоговое запустение.
