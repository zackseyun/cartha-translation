  text: And he will not look to the altars[a], the work of his hands[b], and he will not regard what his fingers have made—the Asherim and the incense altars.
translation:
  language: ru
  text: И не обратит он взора к жертвенникам — делу рук его — и не взглянет на то, что сделали его пальцы, — на ашеры[a] и хамманимы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ашеры — культовые предметы, связанные с почитанием Ашеры; возможно, это были священные шесты или столбы.
    reason: lexical_alternative
  - marker: b
    text: Точное значение еврейского слова неизвестно. Вероятно, речь идёт о языческих культовых предметах, связанных с солнечным культом; возможны переводы «солнечные столбы», «солнечные изображения» или «курильные жертвенники».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁעֶה
  choice: не обратится
  rationale: Глагол означает не просто зрительное действие, а обращение внимания и упования; «не обратится» естественно передаёт этот смысл в контексте поклонения.
- source_word: הַמִּזְבְּחוֹת
  choice: к жертвенникам
  rationale: Обычное значение существительного — жертвенники; предлог «к» соответствует направленности действия.
- source_word: מַעֲשֵׂה יָדָיו
  choice: делу своих рук
  rationale: Сохранён образный еврейский оборот, подчёркивающий, что культовые предметы изготовлены самим человеком.
- source_word: וַאֲשֶׁר עָשׂוּ אֶצְבְּעֹתָיו
  choice: на то, что сделали его пальцы
  rationale: Формулировка сохраняет параллельный образ рук и пальцев и ясно связывает последующий перечень с изготовленными человеком предметами.
- source_word: יִרְאֶה
  choice: не посмотрит
  rationale: Основное значение — «видеть, смотреть»; здесь глагол обозначает направленное внимание и образует смысловой параллелизм с יִשְׁעֶה.
- source_word: הָאֲשֵׁרִים
  choice: ашеры
  rationale: Транслитерация сохраняет неопределённость относительно точного вида культовых предметов, связанных с почитанием Ашеры; пояснение вынесено в сноску.
- source_word: הַחַמָּנִים
  choice: солнечные столбы
  rationale: Термин обозначает языческие культовые объекты, вероятно связанные с солнцем; выбран распространённый конкретный эквивалент, а лексическая неопределённость отмечена в сноске.
theological_decisions:
- issue: Передача языческих культовых предметов в пророческой полемике
  choice: Назвать конкретные культовые предметы, не заменяя их общим словом «идолы»
  alternative: Передать оба термина обобщённо как «идолы» или «изваяния»
  rationale: Так сохраняются предметность и лексическая специфика еврейского текста, а осуждение рукотворного культа выражается самим параллелизмом стиха без добавочного богословского толкования.
- issue: Оттенок глаголов зрения в контексте поклонения
  choice: «не обратится» и «не посмотрит»
  alternative: «не станет уповать» и «не будет почитать»
  rationale: Выбранные слова сохраняют образ взгляда и внимания, не превращая подразумеваемое религиозное отношение в явно выраженное толкование.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Тире выделяют пояснительное приложение, а двоеточие вводит конкретный перечень рукотворных культовых предметов. Редкие термины снабжены краткими пояснениями.
