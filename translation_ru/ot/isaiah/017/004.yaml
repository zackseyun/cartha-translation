  text: And in that day the glory of Jacob will become thin[b][a], and the fatness of his flesh will waste away.
translation:
  language: ru
  text: 'И будет в тот день: слава Иакова умалится[a], и тучное тело его исхудает[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истощится» или «станет слабее». Еврейский глагол может означать, что нечто становится малым, слабым или тонким; «умалится» естественно передаёт его применительно к славе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тучность его плоти станет худой». В еврейском тексте полнота и худоба тела образно передают утрату силы и благополучия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет традиционную пророческую формулу будущего события, оставаясь естественной для литературного русского языка.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Точно передаёт устойчивую пророческую формулу времени без дополнительного истолкования.
- source_word: יִדַּל
  choice: истощится
  rationale: Глагол דלל выражает уменьшение, ослабление или истончение. «Истощится» передаёт убыль славы и одновременно поддерживает телесный образ следующей части стиха.
- source_word: כְּבוֹד
  choice: слава
  rationale: 'Сохраняет широкий смысл כבוד: слава, величие, почёт и могущество; контекст не требует сводить его только к богатству или положению.'
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Сохранено прямо названное в еврейском тексте имя, без поясняющей замены на «Израиль».
- source_word: וּמִשְׁמַן
  choice: и тучность
  rationale: Сохраняет конкретный образ упитанности, служащий метафорой силы и благополучия.
- source_word: בְּשָׂרוֹ
  choice: его плоти
  rationale: Буквально передаёт телесную лексику оригинала; здесь «плоть» обозначает физическое тело, а не специальное богословское понятие.
- source_word: יֵרָזֶה
  choice: иссякнет
  rationale: Передаёт утрату полноты и переход к худобе; выбранная формулировка естественно сочетается в русском языке с существительным «тучность».
theological_decisions:
- issue: Кого обозначает имя «Иаков» в пророчестве о суде
  choice: Сохранить имя «Иаков» как в еврейском тексте.
  alternative: Передать как «Израиль» или «народ Иакова».
  rationale: Имя имеет национальное и заветное звучание, но сам стих не заменяет его поясняющим обозначением; перевод не должен снимать эту смысловую насыщенность.
- issue: Образ истощения славы
  choice: Сохранить связь между умалением славы и телесным исхуданием.
  alternative: 'Передать отвлечённо: «слава Иакова уменьшится, а его благополучие исчезнет».'
  rationale: Параллельные телесные образы в еврейском тексте изображают потерю силы и процветания, поэтому их не следует полностью абстрагировать.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Двоеточие после формулы «И будет в тот день» делает синтаксис ясным. Телесная метафора оригинала сохранена, но выражена без нарочитой архаики.
