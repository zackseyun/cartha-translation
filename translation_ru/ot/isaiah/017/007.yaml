base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/007.yaml
  text: In that day man will look to his Maker[b][a], and his eyes will look to the Holy One of Israel.
translation:
  language: ru
  text: В тот день человек[a] обратит взор к своему Создателю, и его глаза устремятся к Святому Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «человек» здесь употреблено в единственном числе в обобщающем смысле — о людях вообще.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Обычная пророческая формула времени; естественно звучит по-русски и не уточняет характер или близость этого дня сверх сказанного в тексте.
- source_word: יִשְׁעֶה
  choice: обратит взор
  rationale: Глагол обозначает направленное внимание или взгляд. Такой перевод сохраняет образ зрения и не усиливает его до прямо выраженных понятий доверия или покаяния.
- source_word: הָאָדָם
  choice: человек
  rationale: Форма стоит в единственном числе, но представляет людей в целом. Русское «человек» сохраняет и грамматическое число, и обобщающий смысл.
- source_word: עַל
  choice: на
  rationale: В сочетании с «обратит взор» русский предлог «на» естественно передаёт направленность внимания.
- source_word: עֹשֵׂהוּ
  choice: своего Создателя
  rationale: 'Буквально: «того, кто создал его». «Своего Создателя» кратко и ясно сохраняет личное отношение человека к Богу.'
- source_word: וְעֵינָיו
  choice: и глаза его
  rationale: Буквальное сохранение телесного образа и поэтического параллелизма двух частей стиха.
- source_word: אֶל
  choice: на
  rationale: Предлог передаёт направление взгляда; при русском глаголе «смотреть» нормативно употребляется «на».
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святого Израиля
  rationale: Передаёт характерный для Исаии титул Бога современным литературным русским языком без архаической формы «Израилев».
- source_word: תִּרְאֶינָה
  choice: будут смотреть
  rationale: Хотя ראה часто означает «видеть», конструкция с направительным אֶל и параллель с יִשְׁעֶה здесь указывают на направленный взгляд. Перевод сохраняет параллелизм, не утверждая отдельно факт видения Бога.
theological_decisions:
- issue: Обобщающий смысл הָאָדָם
  choice: человек
  alternative: человечество
  rationale: Единственное число исходного текста сохранено, а сноска поясняет, что речь идёт о человеке как представителе людей вообще.
- issue: Выражать ли явно доверие или покаяние
  choice: обратит взор
  alternative: обратится / будет уповать
  rationale: Контекст допускает смысл возвращения внимания к Богу, однако сам глагол говорит прежде всего о направленном взгляде или внимании. Перевод не превращает подразумеваемый богословский смысл в прямое утверждение.
- issue: Передача титула קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  alternative: Святой Израилев
  rationale: Выбрана современная форма родительного отношения, сохраняющая титульный характер выражения без ненужной архаизации.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Поэтический параллелизм и образ направленного взгляда сохранены; архаизмы вроде «взирать» и «Израилев» не использованы.
