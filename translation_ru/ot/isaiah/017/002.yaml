base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/002.yaml
  text: The cities of Aroer are abandoned[a]; they will be for flocks[b], and they will lie down with no one to make them afraid.
translation:
  language: ru
  text: Города Ароэра покинуты[a]; они будут местом для стад[b], и те будут лежать, и никто их не вспугнёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставлены» или «заброшены».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «они будут для стад». Еврейское слово может обозначать стада разных пасущихся животных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזֻבוֹת
  choice: покинуты
  rationale: Страдательное причастие женского рода множественного числа от עזב описывает города как оставленные жителями. «Покинуты» естественно звучит по-русски и сохраняет значение состояния.
- source_word: עָרֵי
  choice: города
  rationale: Форма сопряжённого множественного числа от עִיר; «города» — обычная и достаточно широкая передача в контексте пророчества о суде.
- source_word: עֲרֹעֵר
  choice: Ароэра
  rationale: Географическое название передано традиционной русской транслитерацией; родительный падеж обусловлен сопряжённой конструкцией «города Ароэра».
- source_word: לַעֲדָרִים
  choice: пастбищем для стад
  rationale: 'Буквально: «для стад». В сочетании с глаголом היה русская формулировка «станут пастбищем для стад» ясно и естественно передаёт образ опустевших поселений, отданных пасущимся животным, не меняя его смысла.'
- source_word: תִּהְיֶינָה
  choice: они станут
  rationale: Будущее время от היה. «Станут» естественно выражает переход городов в новое состояние после запустения.
- source_word: וְרָבְצוּ
  choice: там стада будут лежать
  rationale: רבץ обычно означает, что животные ложатся или отдыхают. Подлежащее меняется с городов на упомянутые стада; его повтор устраняет неясность, которая в русском иначе могла бы создать впечатление, будто лежат города.
- source_word: וְאֵין מַחֲרִיד
  choice: и никто их не потревожит
  rationale: Устойчивое выражение обозначает отсутствие того, кто вспугнул бы или устрашил животных. «Не потревожит» естественно для пасторального контекста и передаёт их безмятежный покой.
