translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Обращение во 2-м лице женского рода сохранено, поскольку все соответствующие еврейские формы имеют женский род. Неясность выражений נֵד קָצִיר и בְּיוֹם נַחֲלָה отражена в примечаниях.
