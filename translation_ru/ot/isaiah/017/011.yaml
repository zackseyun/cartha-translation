base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/011.yaml
  text: On the day you plant[a], you make it grow luxuriantly; and in the morning you make your seed sprout[b]. But the harvest flees away in a day of grief and incurable pain.
translation:
  language: ru
  text: В день, когда ты сажаешь, ты даёшь посаженному пышно разрастись, и поутру даёшь своим семенам прорасти. Но урожай исчезнет[a] в день бедствия[b] и неисцелимой боли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «груда урожая». Еврейское выражение трудно для понимания: слово נֵד можно истолковать как «груда», а не как указание на исчезновение.'
    reason: lexical_alternative
  - marker: b
    text: «В день бедствия» можно также перевести как «в день болезни» или «в день страдания».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְעֵךְ
  choice: когда ты сажаешь
  rationale: Формально это существительное с суффиксом 2-го лица женского рода («твоё насаждение»), но в контексте естественная русская глагольная передача сохраняет смысл и согласуется с последующими формами 2-го лица женского рода.
- source_word: תְּשַׂגְשֵׂגִי
  choice: ты заботливо взращиваешь посаженное
  rationale: Глагол передаёт действие, благодаря которому насаждение пышно растёт или процветает. «Взращиваешь» выражает каузативный оттенок, а дополнение восстановлено из контекста.
- source_word: זַרְעֵךְ תַּפְרִיחִי
  choice: заставляешь свои семена дать ростки
  rationale: Каузативная форма פרח означает «заставить прорасти/расцвести»; применительно к семенам «дать ростки» звучит естественно и сохраняет земледельческий образ.
- source_word: נֵד קָצִיר
  choice: урожай исчезнет
  rationale: נֵד в этом трудном сочетании может пониматься как указание на исчезновение или удаление урожая. Такой перевод соответствует контексту суда, при этом буквальная альтернатива «груда урожая» вынесена в примечание.
- source_word: בְּיוֹם נַחֲלָה
  choice: в день бедствия
  rationale: Здесь נַחֲלָה, вероятно, означает болезнь, страдание или тяжёлое бедствие, а не обычное «наследие». «Бедствие» сохраняет широту значения и соответствует параллельной неисцелимой боли.
- source_word: וּכְאֵב אָנושׁ
  choice: и неисцелимой боли
  rationale: אָנושׁ обозначает тяжёлое, отчаянное или неисцелимое состояние; «неисцелимая боль» передаёт безысходную силу выражения.
