source:
  edition: WLC
  text: וְ/נִשְׁאַר בּ֤/וֹ עֽוֹלֵלֹת֙ כְּ/נֹ֣קֶף זַ֔יִת שְׁנַ֧יִם שְׁלֹשָׁ֛ה גַּרְגְּרִ֖ים בְּ/רֹ֣אשׁ אָמִ֑יר אַרְבָּעָ֣ה חֲמִשָּׁ֗ה בִּ/סְעִפֶ֨י/הָ֙ פֹּֽרִיָּ֔ה נְאֻם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/006.yaml
  text: 'Yet gleanings will be left in it[a], as when an olive tree is beaten: two or three berries at the top of the highest bough, four or five on its fruitful branches, declares Yahweh, the God of Israel.'
translation:
  language: ru
  text: 'Но останутся в нём остатки плодов, как при сбивании маслин: две-три маслины — на самой верхней ветви, четыре-пять — на её плодоносных ветвях, — возвещает Яхве, Бог Израиля.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁאַר בּוֹ
  choice: Но останутся в нём
  rationale: Нифаль глагола שׁאר передаёт значение «остаться, быть оставленным». Союз «но» выражает контраст с предшествующей картиной суда, а местоимение «в нём» сохраняет неопределённость референта мужского рода.
- source_word: עֹלֵלֹת
  choice: плоды для подбирания
  rationale: Существительное обозначает плоды, оставшиеся после сбора и предназначенные для последующего подбирания. Такая формулировка сохраняет земледельческий образ и понятна современному читателю.
- source_word: כְּנֹקֶף זַיִת
  choice: как после обивания маслины
  rationale: נֹקֶף обозначает сбивание плодов ударами при сборе маслин. «После обивания» естественно связывает сравнение с немногочисленными плодами, оставшимися на дереве.
- source_word: גַּרְגְּרִים
  choice: маслины
  rationale: Буквально это отдельные ягоды или зёрна; контекст прямо указывает на масличное дерево, поэтому название конкретного плода по-русски яснее и естественнее.
- source_word: בְּרֹאשׁ אָמִיר
  choice: на самой верхней ветви
  rationale: רֹאשׁ означает верх или вершину, а אָמִיר — верхнюю ветвь; перевод передаёт положение нескольких уцелевших плодов без избыточной метафорики.
- source_word: בִּסְעִפֶיהָ פֹּרִיָּה
  choice: на её плодоносных ветвях
  rationale: Суффикс женского рода относится к маслине; פֹּרִיָּה характеризует её ветви как плодоносящие.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Пророческая формула передана возвышенно, но понятно; личное имя יהוה транслитерировано как «Яхве».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо передана конструкция сопряжённого состояния, сохраняющая полное именование Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное заветное имя Бога. Транслитерация сохраняет различие между יהוה и титулом אֲדֹנָי и не вводит конфессионально обусловленного замещения.
- issue: Образ малого остатка после суда
  choice: сохранён как оставшиеся после сбора плоды
  alternative: истолковать прямо как уцелевших людей
  rationale: Стих выражает богословскую тему остатка посредством земледельческого сравнения; перевод не заменяет образ его истолкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой формулой. Ритмическое сопоставление «две-три… четыре-пять…» сохранено; местоименная неопределённость выражения בּוֹ не устранена.
