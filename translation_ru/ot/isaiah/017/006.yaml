  source_fidelity: 'Смысл и образность переданы в целом верно: сохраняются малый остаток, сравнение со сбором маслин, числовые пары и именование «Яхве, Бог Израиля». Однако «плоды для подбирания» неточно описывает עֹלֵלוֹת: речь не о плодах, предназначенных для подбирания, а об остатках плодов, оставшихся после сбора. «Как при сбивании маслин» ближе к значению כְּנֹקֶף זַיִת, чем временно-следственное «как после обивания маслины».'
