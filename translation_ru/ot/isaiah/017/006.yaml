  terminology: '«Яхве, Бог Израиля» корректно передаёт יהוה אֱלֹהֵי יִשְׂרָאֵל. «Маслины» уместно конкретизируют גַּרְגְּרִים в контексте масличного дерева. Дополнительная сноска не требуется: лексический вариант не создаёт существенной неоднозначности в русском тексте.'
