id: ISA.17.14
reference: Isaiah 17:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לְ/עֵ֥ת עֶ֨רֶב֙ וְ/הִנֵּ֣ה בַלָּהָ֔ה בְּ/טֶ֥רֶם בֹּ֖קֶר אֵינֶ֑/נּוּ זֶ֚ה חֵ֣לֶק שׁוֹסֵ֔י/נוּ וְ/גוֹרָ֖ל לְ/בֹזְזֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/014.yaml
  text: At evening time, look—terror! Before morning, he is no more. This is the portion of those who plunder us, and the lot of those who loot us.
translation:
  language: ru
  text: Вечером — и вот ужас! А до наступления утра его уже нет. Такова доля тех, кто нас разоряет, и жребий тех, кто нас грабит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֵת עֶרֶב
  choice: Вечером
  rationale: Естественно и точно передаёт временное указание «в пору вечера» без излишней тяжеловесности.
- source_word: וְהִנֵּה בַלָּהָה
  choice: и вот ужас!
  rationale: «И вот» сохраняет указательную внезапность הִנֵּה, а «ужас» передаёт בַלָּהָה как состояние и событие, вызывающее смятение.
- source_word: בְּטֶרֶם בֹּקֶר אֵינֶנּוּ
  choice: А до наступления утра его уже нет
  rationale: Сохраняет временной предел и местоименную неопределённость мужского единственного числа, вероятно относящуюся к вражеской силе из контекста.
- source_word: חֵלֶק
  choice: доля
  rationale: Стандартный образ назначенной участи или воздаяния.
- source_word: שׁוֹסֵינוּ
  choice: тех, кто нас разоряет
  rationale: Глагольное существительное связано с опустошением и разграблением; «разоряет» отличает его от следующего параллельного термина.
- source_word: וְגוֹרָל לְבֹזְזֵינוּ
  choice: и жребий тех, кто нас грабит
  rationale: «Жребий» сохраняет образ доставшейся участи; «грабит» точно передаёт добывание добычи и поддерживает параллелизм.
theological_decisions:
- issue: Личность подразумеваемого субъекта в אֵינֶנּוּ
  choice: Сохранено местоимение «его» без уточнения.
  alternative: «их уже нет» или явное «врага уже нет»
  rationale: Еврейский текст использует мужское единственное число и не называет референта в самом стихе; уточнение сняло бы подлинную контекстуальную неоднозначность.
- issue: Характер заключительного высказывания
  choice: Передано как утверждение об участи разорителей и грабителей.
  alternative: Истолковать явно как божественное возмездие
  rationale: Контекст подразумевает суд, но данный стих не называет действующего лица; перевод не добавляет отсутствующую экспликацию.
translation_notes:
  register: Современный литературный русский язык с кратким пророческим ритмом. Тире и восклицательный знак передают резкий переход от вечера к внезапному ужасу; заключительная фраза выдержана в dignified библейском параллелизме без архаизмов.
