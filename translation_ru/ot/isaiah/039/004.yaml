  text: And he said[a], “What have they seen in your house?” And Hezekiah said, “They have seen everything that is in my house. There was nothing that I did not show them in my treasuries.”
translation:
  language: ru
  text: 'И спросил он: «Что они видели в твоём доме[a]?» Езекия ответил: «Они видели всё, что есть в моём доме. Не было ничего в моих сокровищницах, чего бы я им не показал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во дворце». Буквально по-еврейски: «в доме»; применительно к царю это слово может означать дворец.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רָאוּ
  choice: Что они видели
  rationale: Прямой вопрос передан естественной русской конструкцией; прошедшее время соответствует завершённому посещению.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: в твоём доме / в моём доме
  rationale: Сохранено основное значение בַּיִת «дом» и повтор исходного текста; в царском контексте слово может обозначать дворец, что отмечено в сноске.
- source_word: חִזְקִיָּהוּ
  choice: Езекия
  rationale: Использована традиционная русская библейская форма имени.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: всё, что есть в моём доме
  rationale: Передаёт значение полноты и подразумеваемое настоящее состояние содержимого дома естественным современным русским языком.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הִרְאִיתִים
  choice: не осталось ничего, чего бы я им не показал
  rationale: Естественно передаёт еврейскую конструкцию с двойным отрицанием и подчёркивает исчерпывающий характер показа, не меняя смысла.
- source_word: בְּאוֹצְרֹתָי
  choice: в моих сокровищницах
  rationale: «Сокровищницы» точно соответствует царскому контексту и акценту повествования на богатствах, лучше чем более широкое «хранилища».
