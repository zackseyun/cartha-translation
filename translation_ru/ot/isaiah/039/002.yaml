base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/002.yaml
  text: And Hezekiah was glad because of them[a], and he showed them his treasure house—the silver, the gold, the spices, the fine oil, all his armory, and all that was found in his storehouses[e][d][c][b]. There was nothing in his house or in all his dominion that Hezekiah did not show them.
translation:
  language: ru
  text: 'И обрадовался им Езекия[a] и показал им свою сокровищницу[b]: серебро и золото, благовония и отборное масло, весь свой оружейный склад[c] и всё, что находилось в его хранилищах[d]. Не было ничего ни в его доме, ни во всех его владениях[e], чего Езекия не показал бы им.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обрадовался из-за них»; возможно также: «был ими доволен». Еврейское выражение может обозначать как радость из-за посланников или их даров, так и радость, обращённую к ним.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дом драгоценностей»; традиционно понимается как сокровищница.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «весь дом своей утвари (или снаряжения)». Многие понимают это выражение как оружейный склад, в том числе с учётом параллельного рассказа в 4 Царств 20:13.'
    reason: alternative_reading
  - marker: d
    text: 'Или: «в его сокровищницах».'
    reason: lexical_alternative
  - marker: e
    text: 'Или: «во всём его царстве»; буквально речь идёт обо всей области его власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח עֲלֵיהֶם
  choice: обрадовался им
  rationale: Сочетание שׂמח с עַל допускает как радость из-за посланников или принесённых ими даров, так и благосклонную радость при их появлении. Русское «обрадовался им» звучит естественно и не устраняет эту смысловую широту; альтернатива указана в сноске.
- source_word: וַיַּרְאֵם
  choice: показал им
  rationale: Порода hифиль глагола ראה означает «дать увидеть, показать»; это прямой и естественный русский эквивалент.
- source_word: בֵּית נכתה
  choice: свою сокровищницу
  rationale: Сочетание обозначает помещение для ценностей, что подтверждается последующим перечнем серебра, золота и других дорогих вещей. Притяжательное местоимение передаёт суффикс еврейского слова.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: серебро и золото
  rationale: В перечне царских ценностей речь идёт о драгоценных металлах, а не о деньгах в общем смысле.
- source_word: הַבְּשָׂמִים
  choice: благовония
  rationale: Слово обозначает ароматические вещества; «благовония» естественно для перечня дорогих царских запасов и шире, чем конкретное «бальзам».
- source_word: הַשֶּׁמֶן הַטּוֹב
  choice: драгоценное масло
  rationale: Буквально «хорошее масло»; в данном перечне выражение указывает на высококачественное, ценное, вероятно ароматическое масло. «Драгоценное» передаёт контекстуальный оттенок ценности.
- source_word: כָּל בֵּית כֵּלָיו
  choice: весь свой оружейный склад
  rationale: Буквально выражение связано с «домом» утвари, снаряжения или орудий. В царском контексте и параллельном повествовании вероятен оружейный склад, однако буквальная альтернатива сохранена в сноске.
- source_word: כָּל אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: всё, что находилось в его хранилищах
  rationale: אֹצָר может означать сокровищницу или хранилище. «Хранилищах» сохраняет широкий смысл и избегает неясного повторения слова «сокровищница».
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: Не было ничего ... чего Езекия не показал бы им
  rationale: Русская конструкция с двойным отрицанием естественно сохраняет эмфатическую полноту еврейского высказывания.
- source_word: בְּבֵיתוֹ
  choice: в его доме
  rationale: Сохранено буквальное «дом»; в контексте царя оно может подразумевать дворец, но текст не требует такого уточнения.
- source_word: וּבְכָל מֶמְשַׁלְתּוֹ
  choice: ни во всех его владениях
  rationale: מֶמְשָׁלָה обозначает область власти, владение или царство. «Владения» естественно передаёт территорию и имущество под властью царя, не сужая значение до одного государственного термина.
