base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/005.yaml
  text: Then Isaiah said to Hezekiah[b][a], “Hear the word of Yahweh of Hosts.”
translation:
  language: ru
  text: 'Тогда Исаия сказал Езекии: «Выслушай слово Яхве[b] Воинств[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве армий». Еврейский титул представляет Яхве как Владыку небесных и земных воинств.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте: ЙХВХ; традиционно переводится как «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Форма с повествовательным וַ последовательно развивает рассказ; «тогда» естественно передаёт переход к следующему действию.
- source_word: יְשַׁעְיָהוּ
  choice: Исаия
  rationale: Устоявшаяся русская форма имени пророка.
- source_word: אֶל חִזְקִיָּהוּ
  choice: Езекии
  rationale: Предлог אֶל обозначает адресата речи; «Езекия» — устоявшаяся русская форма имени царя.
- source_word: שְׁמַע
  choice: Выслушай
  rationale: Повелительная форма единственного числа. «Выслушай» передаёт требование внимательно принять последующее пророческое возвещение и естественно звучит по-русски.
- source_word: דְּבַר
  choice: слово
  rationale: В пророческой формуле דָּבָר означает возвещаемое Богом слово или послание; «слово» сохраняет традиционный и понятный библейский оборот.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не его замена титулом «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сжатая передача множественного числа צְבָאוֹת в составе божественного титула; сохраняет широту образа небесных и земных сил, не ограничивая его только человеческими армиями.
theological_decisions:
- issue: Передача божественного титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Воинств; Яхве, Владыка воинств; Господь Саваоф
  rationale: «Яхве» сохраняет личное божественное имя, а «Воинств» — ёмкость еврейского титула, который может охватывать небесные и земные силы. Добавление «Владыка» сделало бы подразумеваемое отношение явным, а «Саваоф» для многих современных читателей непрозрачно.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краток и близок к еврейскому оригиналу; устоявшиеся русские формы личных имён сохранены. Формулировка «Яхве Воинств» намеренно не разворачивает неоднозначную конструкцию дополнительным титулом.
