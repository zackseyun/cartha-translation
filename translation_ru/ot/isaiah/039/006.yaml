  variant: modern literary Russian
source:
  edition: WLC
  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑ל לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/006.yaml
  text: Look[a], days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon; not a thing will be left, says Yahweh.
translation:
  language: ru
  text: Вот, наступают дни, когда всё, что в твоём доме, и всё, что накопили твои отцы[a] до сего дня, будет унесено в Вавилон. Ничего не останется, — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твои предки». Буквально по-еврейски: «твои отцы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную силу и торжественность пророческого возвещения, оставаясь естественным для современного литературного русского языка.
- source_word: יָמִים בָּאִים
  choice: наступают дни
  rationale: Естественно передаёт стандартную пророческую формулу и значение причастной конструкции.
- source_word: וְנִשָּׂא
  choice: будет унесено
  rationale: Передаёт страдательное значение нифаля и насильственное перемещение имущества в Вавилон, не уточняя сверх текста, кем именно оно будет унесено.
- source_word: כָּל אֲשֶׁר בְּבֵיתֶךָ
  choice: всё, что в твоём доме
  rationale: Сохраняет буквальное «дом», не подменяя его более узкими толкованиями «дворец» или «сокровищница».
- source_word: וַאֲשֶׁר אָצְרוּ אֲבֹתֶיךָ
  choice: и всё, что накопили твои отцы
  rationale: Глагол אָצַר обозначает собирание и накопление запасов или сокровищ; «накопили» кратко и естественно передаёт этот смысл.
- source_word: אֲבֹתֶיךָ
  choice: твои отцы
  rationale: Сохраняет явно мужскую форму и историко-родовое обозначение еврейского текста; возможное более общее понимание отмечено в сноске.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Точно передаёт временной предел накопления; выражение имеет dignified biblical register и остаётся понятным современному читателю.
- source_word: בָּבֶל
  choice: Вавилон
  rationale: Устоявшееся русское название места.
- source_word: לֹא יִוָּתֵר דָּבָר
  choice: Ничего не останется
  rationale: Естественная и сильная русская формулировка, сохраняющая абсолютность отрицания.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Настоящее время сохраняет непосредственность пророческой формулы; личное имя передано как «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; передача «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Историко-родовое обозначение אֲבֹתֶיךָ
  choice: твои отцы
  alternative: твои предки
  rationale: Основной текст сохраняет грамматически мужское и более буквальное «отцы», тогда как потенциально более широкое родовое значение честно указано в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. «Вот» и «до сего дня» поддерживают достоинство стиля без чрезмерной архаизации; синтаксис сделан ясным для чтения вслух.
