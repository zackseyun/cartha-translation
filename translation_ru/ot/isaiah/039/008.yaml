base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/008.yaml
  text: Then Hezekiah said to Isaiah, “The word of the LORD that you have spoken is good.” For he thought, “There will be peace and stability in my days.”
translation:
  language: ru
  text: 'Тогда Езекия сказал Исаии: «Слово Господа, которое ты передал, хорошо». И добавил: «Ведь в мои дни будут мир и стабильность[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мир и истина»; слово אֱמֶת также может означать верность, надёжность или прочность.'
    reason: Сохраняет существенную многозначность אֱמֶת и позволяет читателю увидеть более буквальный вариант.
lexical_decisions:
- source_word: טוֹב
  choice: благо
  rationale: Передаёт положительную оценку Божьего слова, не уточняя сверх текста, означает ли она его справедливость, благость или принятие царём.
- source_word: דְבַר יְהוָה
  choice: слово Господа
  rationale: Естественная для русского библейского регистра передача выражения с тетраграмматоном.
- source_word: וַיֹּאמֶר
  choice: и ещё сказал
  rationale: В еврейском тексте стоит второй глагол речи; перевод сохраняет явное высказывание Езекии, а не превращает его в невысказанную мысль.
- source_word: כִּי
  choice: ведь
  rationale: Сохраняет связь второй реплики с первой и допускает как объяснительный, так и подтверждающий оттенок.
- source_word: שָׁלוֹם וֶאֱמֶת
  choice: мир и устойчивость
  rationale: שָׁלוֹם означает мир и благополучие; אֱמֶת здесь может обозначать надёжность, прочность и устойчивый порядок, хотя буквальное значение «истина» отмечено в сноске.
theological_decisions:
- issue: Была ли последняя фраза произнесена или только подумана Езекией
  choice: 'сохранить как прямую речь: «И ещё сказал»'
  alternative: «Ибо он подумал»
  rationale: Масоретский текст повторяет וַיֹּאמֶר, обычную формулу «и сказал»; перевод «подумал» является контекстуальным истолкованием, не выраженным самим глаголом.
- issue: Оценка пророческого слова словом טוֹב
  choice: «Благо слово Господа»
  alternative: «Слово Господа справедливо» или «хорошо»
  rationale: «Благо» сохраняет широту исходной оценки и не снимает напряжение между принятием Божьего решения и личным облегчением царя.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис прямой и понятный; слегка возвышенное «благо» выбрано для сохранения смысловой широты исходного טוֹב.
