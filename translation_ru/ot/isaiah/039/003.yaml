  yaml_path: translation/ot/isaiah/039/003.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him, “What did these men say, and where did they come to you from?” And Hezekiah said, “They came to me from a distant land, from Babylon.”
translation:
  language: ru
  text: 'Тогда пророк Исаия пришёл к царю Езекии и сказал ему: «Что сказали эти люди и откуда они пришли к тебе?» Езекия сказал: «Они пришли ко мне из далёкой страны — из Вавилона».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה אָמְרוּ
  choice: Что говорили
  rationale: Естественная современная передача вопроса; древнееврейский перфект в данном контексте указывает на состоявшийся разговор, но по-русски вопрос о содержании речи естественно звучит с несовершенным видом.
- source_word: מֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: откуда они пришли к тебе
  rationale: Передаёт направление, выраженное אֵלֶיךָ, и сохраняет прямой вопрос Исаии.
- source_word: אֶרֶץ רְחוֹקָה
  choice: далёкой страны
  rationale: Прямое и естественное соответствие словосочетанию «далёкая земля/страна»; в этом контексте «страна» яснее для современного читателя.
- source_word: מִבָּבֶל
  choice: из Вавилона
  rationale: Стандартная русская форма библейского топонима; тире показывает, что Вавилон уточняет названную перед этим далёкую страну.
