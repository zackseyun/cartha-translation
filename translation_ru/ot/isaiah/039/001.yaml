source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֡וא שָׁלַ֡ח מְרֹדַ֣ךְ בַּ֠לְאֲדָן בֶּֽן בַּלְאֲדָ֧ן מֶֽלֶךְ בָּבֶ֛ל סְפָרִ֥ים וּ/מִנְחָ֖ה אֶל חִזְקִיָּ֑הוּ וַ/יִּשְׁמַ֕ע כִּ֥י חָלָ֖ה וַֽ/יֶּחֱזָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/001.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, for he heard that he had been sick and had recovered.
translation:
  language: ru
  text: В то время Меродах-Баладан, сын Баладана, царь Вавилона, послал Езекии письма и подарок, потому что услышал, что Езекия болел и выздоровел[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «окреп». Здесь еврейское выражение означает восстановление после болезни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: В то время
  rationale: Естественная для современного литературного русского формула, вводящая временную рамку повествования.
- source_word: מְרֹדַךְ בַּלְאֲדָן
  choice: Меродах-Баладан
  rationale: Традиционная русская библейская передача имени, близкая к еврейской форме.
- source_word: סְפָרִים
  choice: письма
  rationale: В контексте царских дипломатических отношений речь идёт о письменных посланиях, а не о книгах или документах вообще.
- source_word: וּמִנְחָה
  choice: и подарок
  rationale: Здесь מִנְחָה обозначает дипломатический дар, а не культовое приношение.
- source_word: וַיִּשְׁמַע כִּי
  choice: потому что услышал, что
  rationale: Передаёт объяснительную связь с отправкой писем и дара; כִּי вводит содержание услышанного.
- source_word: חָלָה
  choice: болел
  rationale: Прямо и естественно обозначает предшествовавшую болезнь Езекии.
- source_word: וַיֶּחֱזָק
  choice: выздоровел
  rationale: В контексте болезни глагол «стать сильным, окрепнуть» естественно означает выздоровление.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинным повествовательным стилем. Повтор имени Езекии устраняет неестественную для русского двусмысленность местоимения, не меняя смысла контекста.
