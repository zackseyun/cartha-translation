base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/007.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: ru
  text: Некоторых из твоих сыновей, которые родятся у тебя, которых ты породишь, уведут, и они станут евнухами[a] во дворце царя Вавилона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придворными чиновниками». Еврейское слово может означать как евнухов в буквальном смысле, так и, в некоторых контекстах, царских должностных лиц.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: И некоторых из твоих сыновей
  rationale: 'Предлог מִן имеет здесь разделительное значение: речь идёт о некоторых из сыновей Езекии. «Сыновей» точнее сохраняет конкретную формулировку еврейского текста, чем более широкое «потомков».'
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: которые произойдут от тебя
  rationale: Оборот обозначает прямое происхождение от Езекии. «Произойдут от тебя» естественно передаёт родословный смысл и сохраняет отличие от следующего глагола.
- source_word: אֲשֶׁר תּוֹלִיד
  choice: которых ты породишь
  rationale: Каузативная форма ילד при подлежащем-мужчине означает «произвести на свет, стать отцом». «Породишь» применимо к отцу и позволяет сохранить намеренное повторение мысли о происхождении.
- source_word: יִקָּחוּ
  choice: заберут
  rationale: В еврейском тексте глагол имеет неопределённое действующее лицо. Русская неопределённо-личная форма естественно передаёт это и подразумевает насильственное уведение.
- source_word: וְהָיוּ
  choice: и они станут
  rationale: В данном контексте היה с именной частью сказуемого выражает переход в новое положение после уведения, поэтому «станут» уместнее простого «будут».
- source_word: סָרִיסִים
  choice: евнухами
  rationale: Основное значение слова — «евнухи», хотя при царском дворе оно может обозначать и должностных лиц. Основное значение сохранено в тексте, а возможное более широкое — в сноске.
- source_word: בְּהֵיכַל
  choice: во дворце
  rationale: הֵיכָל может означать храм или дворец, но сочетание с царём Вавилона ясно указывает на царский дворец.
- source_word: מֶלֶךְ בָּבֶל
  choice: царя Вавилона
  rationale: Естественная русская передача еврейской сопряжённой конструкции без уточнения, отсутствующего в оригинале.
theological_decisions:
- issue: Значение סָרִיסִים в пророчестве о вавилонском царском дворе
  choice: «евнухами» в основном тексте
  alternative: «придворными» или «царскими сановниками»
  rationale: Слово может обозначать как евнухов в буквальном смысле, так и, в некоторых контекстах, придворных чиновников. Основное прямое значение оставлено в тексте, но семантическая неоднозначность сохранена в сноске и не разрешена догматически.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор двух родственных по смыслу определительных оборотов сохранён вслед за еврейским оригиналом; формулировка остаётся понятной без архаизма «родишь» в значении отцовства или книжного «зачнёшь».
