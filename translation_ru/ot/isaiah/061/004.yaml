  text: וּ/בָנוּ֙ חָרְב֣וֹת עוֹלָ֔ם שֹׁמְמ֥וֹת רִֽאשֹׁנִ֖ים יְקוֹמֵ֑מוּ וְ/חִדְּשׁוּ֙ עָ֣רֵי חֹ֔רֶב שֹׁמְמ֖וֹת דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/004.yaml
  text: They will rebuild the ancient ruins[a]; they will raise up the former desolations; they will renew the ruined cities[b], the desolations of generation after generation.
translation:
  language: ru
  text: Они отстроят древние развалины[a], восстановят прежние опустошённые места; обновят разрушенные города, лежавшие в запустении из поколения в поколение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «давние развалины». Еврейское עוֹלָם здесь может указывать как на глубокую древность, так и на большую длительность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «города, лежавшие в запустении на протяжении многих поколений». Буквально по-еврейски: «поколение и поколение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: они отстроят
  rationale: Глагол בנה буквально означает «строить», но при дополнении «развалины» естественное русское «отстроят» ясно передаёт подразумеваемое восстановление, не выходя за рамки контекста.
- source_word: חָרְבוֹת עוֹלָם
  choice: древние развалины
  rationale: חָרְבוֹת — развалины, опустошённые места; עוֹלָם здесь указывает на давнюю древность или длительность, а не на метафизическую вечность.
- source_word: שֹׁמְמוֹת רִאשֹׁנִים
  choice: места, разорённые в прежние времена
  rationale: שֹׁמְמוֹת может обозначать опустошённые места, а רִאשֹׁנִים имеет временное значение «прежние, былые». Развёрнутая формулировка звучит по-русски естественнее буквального «прежние запустения».
- source_word: יְקוֹמֵמוּ
  choice: восстановят
  rationale: Каузативная форма от קום передаёт возвращение разрушенного в стоящее, устроенное состояние. «Восстановят» естественно выражает этот конкретный образ в сочетании с разорёнными местами.
- source_word: וְחִדְּשׁוּ
  choice: обновят
  rationale: Прямо передаёт значение חדשׁ «обновлять, делать новым» и сохраняет отличие этого глагола от предшествующих «отстроят» и «восстановят».
- source_word: עָרֵי חֹרֶב
  choice: разрушенные города
  rationale: Сочетание буквально описывает «города разрушения/разорения»; «разрушенные города» — точный и естественный современный русский эквивалент.
- source_word: שֹׁמְמוֹת דּוֹר וָדוֹר
  choice: места, пустовавшие из поколения в поколение
  rationale: Фраза דּוֹר וָדוֹר имеет распределительное значение «из поколения в поколение». Причастная конструкция связывает продолжительное запустение с городами и избегает неестественного отвлечённого оборота.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены три разных восстановительных глагола и параллелизм стиха; громоздкие буквальные абстракции заменены конкретными обозначениями мест без устранения временной неоднозначности עוֹלָם.
