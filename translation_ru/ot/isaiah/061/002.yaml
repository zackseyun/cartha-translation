base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/002.yaml
  text: to proclaim the year of Yahweh’s favor and the day of vengeance of our God[a], to comfort all who mourn[b],
translation:
  language: ru
  text: возвестить год благоволения Яхве[a] и день возмездия Бога нашего, утешить всех скорбящих[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «год, когда Яхве являет благоволение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всех плачущих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרֹא
  choice: возвестить
  rationale: Инфинитив выражает цель служения и означает публичное, торжественное объявление; «возвестить» точнее передаёт этот смысл, чем общее «провозгласить» или «объявить».
- source_word: שְׁנַת רָצוֹן
  choice: год благоволения
  rationale: Сочетание обозначает год, отмеченный Божьим расположением и принятием. «Благоволение» сохраняет смысл רָצוֹן и соответствует возвышенному, но понятному библейскому регистру.
- source_word: לַיהוָה
  choice: Яхве
  rationale: 'Предлог ל обозначает отношение: год благоволения, исходящего от Яхве. Тетраграмматон передан личным именем «Яхве».'
- source_word: וְיוֹם נָקָם
  choice: и день возмездия
  rationale: «Возмездие» передаёт идею справедливого ответного Божьего действия и сохраняет смысловую тяжесть נָקָם, не ослабляя его до общего «суда».
- source_word: לֵאלֹהֵינוּ
  choice: Бога нашего
  rationale: Родительный оборот естественно передаёт отношение дня возмездия к Богу; порядок «Бога нашего» поддерживает торжественный параллелизм стиха.
- source_word: לְנַחֵם
  choice: утешить
  rationale: Инфинитив продолжает перечень целей служения; «утешить» прямо и естественно передаёт נחם в контексте восстановления.
- source_word: כָּל אֲבֵלִים
  choice: всех скорбящих
  rationale: Субстантивированное причастие обозначает всех находящихся в скорби. «Всех скорбящих» естественно по-русски и не ограничивает смысл только мужчинами.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; личное имя «Яхве» сохраняет прямое именование Бога и заветный характер выражения.
- issue: Смысловое напряжение между благоволением и возмездием
  choice: Сохранить рядом «год благоволения» и «день возмездия» без смягчения
  alternative: Передать נָקָם более общим словом «суд» либо подчинить тему возмездия теме утешения
  rationale: Еврейский текст намеренно сополагает Божье благоволение и Божье возмездие; перевод не устраняет и не объясняет это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены параллелизм двух временных образов («год» / «день»), последовательность инфинитивов и конечная запятая, поскольку стих синтаксически продолжается в следующем стихе.
