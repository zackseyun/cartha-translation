source:
  edition: WLC
  text: שׂ֧וֹשׂ אָשִׂ֣ישׂ בַּֽ/יהוָ֗ה תָּגֵ֤ל נַפְשִׁ/י֙ בֵּֽ/אלֹהַ֔/י כִּ֤י הִלְבִּישַׁ֨/נִי֙ בִּגְדֵי יֶ֔שַׁע מְעִ֥יל צְדָקָ֖ה יְעָטָ֑/נִי כֶּֽ/חָתָן֙ יְכַהֵ֣ן פְּאֵ֔ר וְ/כַ/כַּלָּ֖ה תַּעְדֶּ֥ה כֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/010.yaml
  text: I will greatly rejoice in Yahweh[a]; my soul will exult in my God, for he has clothed me with garments of salvation; he has wrapped me in a robe of righteousness, like a bridegroom who adorns himself with a priestly headdress[b], and like a bride who decks herself with her jewelry.
translation:
  language: ru
  text: Буду безмерно ликовать в Яхве[a]; душа моя будет радоваться в Боге моём, ибо Он облёк меня в одежды спасения, окутал меня одеянием праведности[b], как жених, возлагающий на себя нарядный головной убор[c], и как невеста, украшающая себя драгоценностями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ликуя, буду ликовать в Яхве». Еврейская конструкция выражает усиление.'
    reason: Передача усилительной конструкции שׂוֹשׂ אָשִׂישׂ.
  - marker: b
    text: 'Или: «мантией праведности»; возможно также: «одеянием справедливости».'
    reason: Лексические варианты для מְעִיל и смысловой диапазон צְדָקָה.
  - marker: c
    text: 'Еврейская фраза необычна и, вероятно, отсылает к священническому убранству: «как жених, который возлагает головной убор, подобно священнику». Возможен и более общий смысл: «украшающий себя головным убором».'
    reason: Сохранение неоднозначности יְכַהֵן פְּאֵר и вероятной священнической аллюзии.
lexical_decisions:
- source_word: שׂוֹשׂ אָשִׂישׂ
  choice: Возликую
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагол. Русское «возликую» естественно передаёт сильную, торжественную радость; интенсивность дополнительно отражена в сноске.
- source_word: בַּיהוָה
  choice: в Яхве
  rationale: Предлог ב обозначает объект или сферу ликования; тетраграмматон передан личным именем «Яхве».
- source_word: תָּגֵל נַפְשִׁי
  choice: возрадуется душа моя
  rationale: גיל выражает бурную радость. Сочетание «душа моя» сохраняет поэтическую форму и не сужает נֶפֶשׁ до одной лишь эмоции.
- source_word: הִלְבִּישַׁנִי בִּגְדֵי יֶשַׁע
  choice: Он облёк меня в одежды спасения
  rationale: «Облёк» естественно сочетается с торжественным образом одежды, а «спасение» сохраняет широкий смысл избавления и благополучия.
- source_word: מְעִיל צְדָקָה יְעָטָנִי
  choice: окутал меня одеянием праведности
  rationale: מְעִיל — верхнее одеяние или мантия; יעט передаёт укрывание или окутывание. «Праведность» сохраняет нравственный и заветный диапазон צְדָקָה, не исключая значения справедливости.
- source_word: יְכַהֵן פְּאֵר
  choice: который, словно священник, возлагает на себя нарядный головной убор
  rationale: Редкая форма от כהן, вероятно, создаёт священническую ассоциацию, а פְּאֵר обозначает нарядный головной убор. Формулировка сохраняет и свадебный образ, и вероятный священнический оттенок.
- source_word: וְכַכַּלָּה תַּעְדֶּה כֵלֶיהָ
  choice: и как невеста, украшающая себя драгоценностями
  rationale: В свадебном контексте כֵלִים означает предметы убранства, украшения; «драгоценности» звучит естественно в современном русском.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное заветное имя и соответствует предоставленному консультационному слою.
- issue: Значение צְדָקָה
  choice: праведность
  alternative: справедливость
  rationale: В метафоре дарованного Богом одеяния «праведность» лучше сохраняет широкий нравственный и заветный смысл; возможный оттенок справедливости отмечен в сноске.
- issue: Священнический оттенок יְכַהֵן פְּאֵר
  choice: сохранить сравнением «словно священник»
  alternative: нейтральное «украшается головным убором»; «облачается как священник»
  rationale: Еврейская фраза необычна и допускает разные разборы. Перевод не устраняет вероятную игру со священническим облачением, но сноска сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим строем. Инверсия «душа моя» сохраняет ритм пророческой поэзии; архаизмы сведены к понятному «облёк», уместному для образа торжественного облачения. Все местоимения Бога оформлены с прописной буквы как редакционная норма благоговейного регистра.
