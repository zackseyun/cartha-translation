base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/006.yaml
  text: But you will be called the priests of Yahweh; they will say of you, "Ministers of our God." You will eat the wealth of nations[a], and in their glory you will boast.
translation:
  language: ru
  text: 'А вы будете названы священниками Яхве; о вас скажут: «Служители нашего Бога». Вы будете вкушать богатства народов и хвалиться их славой[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ликовать в их великолепии». Последний еврейский глагол редок, и точный оттенок его значения остаётся спорным; основной текст следует распространённому пониманию «хвалиться, славиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֵי יְהוָה
  choice: священниками Яхве
  rationale: Сохранены культовый термин и конструкция принадлежности; личное имя Бога передано как «Яхве».
- source_word: תִּקָּרֵאוּ
  choice: будете названы
  rationale: Прямая передача пассивного значения нифаля при сохранении пророческого будущего.
- source_word: מְשָׁרְתֵי אֱלֹהֵינוּ
  choice: Служители нашего Бога
  rationale: «Служители» передаёт официальное, в том числе культовое, служение и поддерживает параллель со священниками, не вводя более позднего церковного титула.
- source_word: יֵאָמֵר לָכֶם
  choice: о вас скажут
  rationale: Безличное употребление глагола естественно передано неопределённо-личной русской конструкцией; форма прямой речи сохраняет структуру еврейского текста.
- source_word: חֵיל גּוֹיִם
  choice: богатством народов
  rationale: В данном контексте חֵיל обозначает прежде всего достояние или материальные ресурсы народов, хотя в иных контекстах может означать силу.
- source_word: תֹּאכֵלוּ
  choice: будете питаться
  rationale: Сохраняет образ еды, но по-русски естественно сочетается с собирательным «богатством».
- source_word: וּבִכְבוֹדָם
  choice: их славой
  rationale: «Слава» сохраняет основное значение כבוד и не сужает его до одного лишь материального великолепия или общественной чести.
- source_word: תִּתְיַמָּרוּ
  choice: величаться
  rationale: Передаёт распространённое понимание редкого глагола как «хвалиться, славиться» и естественно сочетается с творительным падежом «их славой»; неопределённость отмечена в сноске.
theological_decisions:
- issue: Следует ли переосмыслить обращение к Израилю как указание на более позднюю церковную должность
  choice: Сохранить прямые наименования «священники Яхве» и «служители нашего Бога».
  alternative: Обобщить смысл как духовное служение без священнической терминологии.
  rationale: Еврейский текст прямо использует культовые наименования; перевод сохраняет пророческий образ, не отождествляя его с какой-либо поздней конфессиональной системой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Параллелизм двух наименований сохранён; редкая лексема не истолкована чрезмерно определённо.
