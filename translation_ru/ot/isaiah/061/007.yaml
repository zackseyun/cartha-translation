id: ISA.61.7
reference: Isaiah 61:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: תַּ֤חַת בָּשְׁתְּ/כֶם֙ מִשְׁנֶ֔ה וּ/כְלִמָּ֖ה יָרֹ֣נּוּ חֶלְקָ֑/ם לָ/כֵ֤ן בְּ/אַרְצָ/ם֙ מִשְׁנֶ֣ה יִירָ֔שׁוּ שִׂמְחַ֥ת עוֹלָ֖ם תִּֽהְיֶ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/007.yaml
  text: Instead of your shame[a], there will be a double portion; and instead of disgrace, they will shout for joy over their portion. Therefore in their land they will possess a double portion[c][b]; everlasting joy will be theirs.
translation:
  language: ru
  text: Вместо вашего стыда[a] — двойная доля; вместо унижения они будут ликовать из-за своей доли.[b] Поэтому на своей земле они унаследуют двойную долю,[c] и вечная радость будет у них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте после «вашего стыда» речь переходит от второго лица к третьему: «они… их доля… их земля». Во многих переводах для плавности везде употребляется «вы/ваш».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «будут радостно восклицать о своей доле».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «получат во владение двойную долю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: вместо
  rationale: В данном контексте предлог обозначает замену и перемену участи, а не пространственное положение.
- source_word: בָּשְׁתְּכֶם
  choice: вашего стыда
  rationale: Сохранено местоименное окончание второго лица множественного числа; «стыд» прямо передаёт тему утраты чести.
- source_word: מִשְׁנֶה
  choice: двойная доля
  rationale: Существительное обозначает двойную меру или долю и здесь связано с восстановлением и наследованием.
- source_word: וּכְלִמָּה
  choice: вместо унижения
  rationale: «Унижение» передаёт оттенок публичного бесчестья и отличает это слово от предшествующего «стыда»; значение замены подразумевается из первой части параллелизма.
- source_word: יָרֹנּוּ
  choice: будут ликовать
  rationale: Глагол выражает громкую, явную радость; «ликовать» естественно передаёт эту интенсивность в современном литературном русском.
- source_word: חֶלְקָם
  choice: о своей доле
  rationale: «Доля» сохраняет смысл назначенной части и поддерживает связь с повторяющимся образом двойной доли.
- source_word: לָכֵן
  choice: поэтому
  rationale: Передаёт вывод или следствие обещанной перемены участи.
- source_word: בְּאַרְצָם
  choice: в своей земле
  rationale: Сохраняет территориальный смысл אֶרֶץ и естественно соотносит землю с подлежащим третьего лица множественного числа.
- source_word: יִירָשׁוּ
  choice: унаследуют
  rationale: Глагол может означать «наследовать» или «овладеть»; с «двойной долей» наследственная образность особенно естественна.
- source_word: שִׂמְחַת עוֹלָם
  choice: вечная радость
  rationale: Передаёт продолжительную, непрекращающуюся радость и сохраняет возвышенный тон обещания.
- source_word: תִּהְיֶה לָהֶם
  choice: будет у них
  rationale: Близко передаёт еврейскую конструкцию принадлежности, оставаясь естественным по-русски.
theological_decisions:
- issue: Переход от второго лица («вашего стыда») к третьему лицу множественного числа («они», «своей земле»)
  choice: Сохранить переход лиц, засвидетельствованный масоретским текстом
  alternative: 'Согласовать весь стих во втором лице: «вы будете ликовать… в своей земле вы унаследуете»'
  rationale: Переход лиц действительно присутствует в исходном тексте. Его сохранение не устраняет подлинную текстовую особенность и не навязывает толкование.
- issue: Значение יִירָשׁוּ в сочетании с двойной долей
  choice: «унаследуют»
  alternative: «получат во владение»
  rationale: Оба значения лексически возможны; «унаследуют двойную долю» естественно выражает образ наследства, не уточняя сверх текста способ исполнения обещания.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной библейской интонацией. Эллипсис первой строки сохранён при помощи тире; параллелизм «вместо… вместо…» сделан явным. Необычная смена грамматического лица не сглажена.
