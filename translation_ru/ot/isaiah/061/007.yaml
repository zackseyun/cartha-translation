review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл и намеренная смена лица переданы точно: «вашего стыда» сохраняет 2-е лицо, тогда как далее сохранено 3-е лицо множественного числа. «Двойная доля», «унаследуют» и «вечная радость» хорошо соответствуют еврейскому тексту. Однако «в своей земле» в современном русском звучит неестественно для территориального значения בְּאַרְצָם; нормативнее и естественнее «на своей земле».'
  naturalness: 'Оборот «ликовать о своей доле» стилистически шероховат: с «ликовать» такое управление малоупотребительно. «Ликовать из-за своей доли» сохраняет связь радостного возгласа с долей и звучит естественно. Вариант с «славить» в сноске добавляет оттенок хвалы, которого глагол רנן сам по себе не требует.'
  terminology: «Стыд» и «унижение» удачно различают בֹּשֶׁת и כְּלִמָּה; «двойная доля» последовательно передаёт מִשְׁנֶה. «Унаследуют» допустимо для יִירָשׁוּ и сохраняет образ наследования, а сноска корректно отмечает вариант владения.
