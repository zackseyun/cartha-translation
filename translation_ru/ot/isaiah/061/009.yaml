source:
  edition: WLC
  text: וְ/נוֹדַ֤ע בַּ/גּוֹיִם֙ זַרְעָ֔/ם וְ/צֶאֱצָאֵי/הֶ֖ם בְּ/ת֣וֹךְ הָ/עַמִּ֑ים כָּל רֹֽאֵי/הֶם֙ יַכִּיר֔וּ/ם כִּ֛י הֵ֥ם זֶ֖רַע בֵּרַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/009.yaml
  text: Their offspring will be known among the nations[a], and their descendants in the midst of the peoples[b]; all who see them will recognize that they are offspring blessed by Yahweh.
translation:
  language: ru
  text: Их потомство станет известно среди народов, и их потомки — среди народов; все, кто увидит их, признают, что они — потомство, благословлённое Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנוֹדַע
  choice: станет известно
  rationale: Нифаль от ידע допускает значение «быть известным, стать известным». Будущее «станет известно» естественно передаёт предсказательный контекст и не уточняет действующего лица.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם здесь обозначает народы в широком международном смысле; перевод не вводит более узкое противопоставление иудеев и язычников.
- source_word: זַרְעָם
  choice: их потомство
  rationale: Коллективное זֶרַע означает «семя, потомство». «Потомство» естественно для современного русского языка и сохраняет собирательный смысл.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: их потомки
  rationale: Почти синонимичное параллельное выражение передано словом «потомки», чтобы сохранить поэтический параллелизм без неестественного буквального повтора.
- source_word: בְּתוֹךְ הָעַמִּים
  choice: среди племён
  rationale: בְּתוֹךְ буквально указывает на нахождение «посреди», но по-русски «среди» звучит естественно; «племён» отличает עַמִּים от предшествующего גּוֹיִם и сохраняет представление о множестве этнических сообществ.
- source_word: כָּל רֹאֵיהֶם
  choice: все, кто увидит их
  rationale: Причастная конструкция естественно передана определительным предложением; будущее время согласовано с пророческим контекстом.
- source_word: יַכִּירוּם
  choice: признают
  rationale: 'Хифиль от נכר означает «узнать, распознать, признать». В русском переход к придаточному с כִּי позволяет естественно опустить объектное «их»: содержание признания выражено далее.'
- source_word: כִּי
  choice: что
  rationale: כִּי вводит содержание того, что распознают наблюдатели, поэтому русское «что» точнее, чем причинное «потому что».
- source_word: זֶרַע
  choice: потомство
  rationale: Повтор слова «потомство» сохраняет лексическую связь с первым זֶרַע и его собирательное значение.
- source_word: בֵּרַךְ
  choice: благословлённое
  rationale: Форма передаёт состояние, возникшее вследствие благословения; русское причастие компактно и сохраняет неоднозначность между определительной и предикативной связью.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Характер благословения потомства
  choice: потомство, благословлённое Яхве
  alternative: потомство тех, кого благословил Яхве
  rationale: Еврейская конструкция допускает отнесение בֵּרַךְ непосредственно к собирательному זֶרַע. Перевод не добавляет отсутствующего слова «народ» и сохраняет компактность исходника.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис сохраняет еврейский параллелизм; архаизмы и конфессионально окрашенные добавления исключены.
