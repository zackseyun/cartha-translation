  text: כִּ֣י אֲנִ֤י יְהוָה֙ אֹהֵ֣ב מִשְׁפָּ֔ט שֹׂנֵ֥א גָזֵ֖ל בְּ/עוֹלָ֑ה וְ/נָתַתִּ֤י פְעֻלָּתָ/ם֙ בֶּ/אֱמֶ֔ת וּ/בְרִ֥ית עוֹלָ֖ם אֶכְר֥וֹת לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/008.yaml
  text: For I[a], Yahweh, love justice; I hate robbery with burnt offering. And I will give them their recompense in faithfulness[c][b], and I will cut an everlasting covenant with them.
translation:
  language: ru
  text: «Ибо Я, Яхве, люблю справедливость и ненавижу грабёж, связанный со всесожжением[a]. Я верно воздам им[b] и заключу с ними вечный завет[c]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно для понимания. Возможно также: «грабёж при всесожжении» или «грабёж ради всесожжения». Оно может говорить о принесении в жертву похищенного либо шире — о соединении несправедливости с богослужением. Некоторые древние свидетельства отражают чтение «грабёж с беззаконием».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «дам им их воздаяние»; возможно также: «их награду» или «их плату».'
    reason: lexical_alternative
  - marker: c
    text: Буквально еврейская идиома означает «рассеку завет», то есть «заключу завет».
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, сохраняя его заветный характер и отличая его от титула «Господь».
- source_word: מִשְׁפָּט
  choice: справедливость
  rationale: В противопоставлении грабежу слово обозначает прежде всего нравственную и общественную справедливость, а не только судебный приговор.
- source_word: גָזֵל
  choice: грабёж
  rationale: Кратко и естественно передаёт насильственное или неправомерное присвоение чужого.
- source_word: בְּעוֹלָה
  choice: соединённый со всесожжением
  rationale: Сохраняет связь грабежа со всесожжением, выраженную трудным еврейским сочетанием, но не определяет точнее неоднозначное значение предлога ב.
- source_word: פְעֻלָּתָם
  choice: воздам им
  rationale: В данном контексте речь идёт о воздаянии, которое Бог даст Своему народу; глагольная русская конструкция звучит естественнее буквального «дам им их воздаяние».
- source_word: בֶּאֱמֶת
  choice: по верности
  rationale: Передаёт Божью надёжность и верность обязательству в заветном контексте, не сводя выражение лишь к отвлечённой «истине».
- source_word: בְרִית עוֹלָם
  choice: вечный завет
  rationale: Устоявшееся и естественное соответствие заветной формуле.
- source_word: אֶכְרֹת
  choice: заключу
  rationale: Естественный русский эквивалент еврейской идиомы «срежу завет»; буквальный образ поясняется в сноске.
theological_decisions:
- issue: Толкование גָזֵל בְּעוֹלָה
  choice: грабёж, соединённый со всесожжением
  alternative: грабёж при всесожжении; грабёж ради всесожжения; грабёж вместе с беззаконием
  rationale: Масоретская огласовка указывает на «всесожжение», но синтаксическая связь остаётся неясной. Основной текст сохраняет пророческое противопоставление несправедливости и богослужения, не уточняя без достаточных оснований, каким именно образом грабёж связан с жертвой.
- issue: Значение פְעֻלָּתָם
  choice: воздам им
  alternative: дам им награду; дам им плату; дам им воздаяние
  rationale: Контекст обещания и завета поддерживает значение заслуженного воздаяния, однако перевод не определяет его исключительно как плату за труд или как награду.
- issue: Передача идиомы כרת ברית
  choice: заключу завет
  alternative: срежу завет
  rationale: Буквальная калька непонятна современному русскому читателю и способна создать ложный смысл. Устоявшееся «заключить завет» точно передаёт функцию идиомы, а её образ отмечен в сноске.
translation_notes:
  register: Современный литературный русский с dignified библейским звучанием. Синтаксис сделан ясным для обычного читателя; трудность בְּעוֹלָה не скрыта, а вынесена в сноску. Формула «заключу завет» предпочтена неестественной буквальной кальке.
