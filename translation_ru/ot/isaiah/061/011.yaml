base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/011.yaml
  text: For as the earth brings forth its growth[a], and as a garden causes what is sown in it to spring up, so the Lord GOD will cause righteousness and praise to spring up before all the nations.
translation:
  language: ru
  text: Ибо как земля производит свои всходы и как сад взращивает посеянное в нём, так Владыка Яхве взрастит праведность[a] и хвалу перед всеми народами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость». Еврейское слово может также обозначать публично явленную правоту или оправдание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт объяснительно-причинную связь с предыдущим обещанием и естественно вводит сравнение.
- source_word: כָאָרֶץ
  choice: как земля
  rationale: В земледельческом сравнении имеется в виду земля вообще, а не определённая территория.
- source_word: תּוֹצִיא צִמְחָהּ
  choice: даёт взойти своим росткам
  rationale: Сохраняет образ появления растительности и каузативный оттенок формы глагола, не сводя существительное к одному конкретному побегу.
- source_word: וּכְגַנָּה זֵרוּעֶיהָ תַצְמִיחַ
  choice: и как сад взращивает посеянное в нём
  rationale: Естественно передаёт собирательное значение «посеянное» и каузативность глагола צמח.
- source_word: כֵּן
  choice: так
  rationale: Ясно завершает параллельную конструкцию сравнения.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Передаёт оба элемента титула без неестественного повтора «Господь Господь» и сохраняет личное имя יהוה.
- source_word: יַצְמִיחַ
  choice: взрастит
  rationale: Повторяет земледельческий образ корня צמח и сохраняет каузативный смысл.
- source_word: צְדָקָה
  choice: праведность
  rationale: Сохраняет широкое значение нравственной и заветной правоты; возможный оттенок справедливости отмечен в сноске.
- source_word: וּתְהִלָּה
  choice: и хвалу
  rationale: Обычное значение существительного — хвала; здесь речь, вероятно, о публичной хвале, вызванной спасительным деянием Бога.
- source_word: נֶגֶד כָּל הַגּוֹיִם
  choice: перед всеми народами
  rationale: Передаёт публичность происходящего в присутствии и на виду у всех народов.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Основной вариант сохраняет различие между титулом אֲדֹנָי и личным именем יהוה, оставаясь понятным и благоговейным по-русски.
- issue: Значение צְדָקָה в контексте пророческого восстановления
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет богословскую широту термина, тогда как «справедливость» передаёт его общественно-правовой оттенок; альтернативу следует оставить в сноске, не устраняя смыслового напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор земледельческого образа сохранён через «взойти», «взращивает» и «взрастит»; синтаксис сделан ясным для обычного читателя.
