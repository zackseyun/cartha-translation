id: ISA.61.1
reference: Isaiah 61:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: ר֛וּחַ אֲדֹנָ֥/י יְהוִ֖ה עָלָ֑/י יַ֡עַן מָשַׁח֩ יְהוָ֨ה אֹתִ֜/י לְ/בַשֵּׂ֣ר עֲנָוִ֗ים שְׁלָחַ֨/נִי֙ לַ/חֲבֹ֣שׁ לְ/נִשְׁבְּרֵי לֵ֔ב לִ/קְרֹ֤א לִ/שְׁבוּיִם֙ דְּר֔וֹר וְ/לַ/אֲסוּרִ֖ים פְּקַח קֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/001.yaml
  text: The Spirit of the Lord GOD is upon me[a], because Yahweh has anointed me to bring good news to the humble; he has sent me to bind up the brokenhearted[b], to proclaim liberty to the captives and opening of the prison to the bound.
translation:
  language: ru
  text: Дух Владыки Яхве — на мне, потому что Яхве помазал меня возвещать благую весть смиренным[a]. Он послал меня перевязать раны сокрушённых сердцем, провозгласить пленным свободу и узникам — открытие темницы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедным» либо «угнетённым». Еврейское עֲנָוִים может обозначать смиренных, кротких, бедных или страдающих от притеснения.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение פְּקַח־קוֹחַ неясно; возможны также переводы: «открытие глаз» или, в более общем смысле, «освобождение узников».'
    reason: alternative_reading
lexical_decisions:
- source_word: ר֛וּחַ
  choice: Дух
  rationale: В сочетании с божественным титулом и в контексте пророческого призвания речь идёт о Божьем Духе, а не о ветре или человеческом настроении.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» сохраняет личное имя יְהוָה и не смешивает два элемента выражения.
- source_word: עָלָי
  choice: на мне
  rationale: Кратко и непосредственно сохраняет еврейский образ пребывания Духа на призванном вестнике.
- source_word: יַעַן
  choice: потому что
  rationale: Ясно вводит основание предшествующего утверждения и последующего поручения.
- source_word: מָשַׁח
  choice: помазал
  rationale: Передаёт совершённое действие посвящения на служение, сохраняя присущую тексту мессианскую значимость без её дополнительного истолкования.
- source_word: לְבַשֵּׂר
  choice: возвещать благую весть
  rationale: Естественно передаёт публичное сообщение доброй вести и сохраняет торжественный регистр.
- source_word: עֲנָוִים
  choice: смиренным
  rationale: Сохраняет нравственно-социальную широту слова, которое может обозначать смиренных, кротких, угнетённых или бедных; значимая альтернатива вынесена в примечание.
- source_word: שְׁלָחַנִי
  choice: Он послал меня
  rationale: Прямо передаёт завершённое поручение и естественно начинает новое русское предложение.
- source_word: לַחֲבֹשׁ
  choice: перевязать раны
  rationale: Глагол буквально описывает перевязывание повреждения; добавление «раны» делает метафору естественной по-русски, не сводя её к более общему «исцелить».
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: сокрушённых сердцем
  rationale: Передаёт образ разбитого сердца в привычной для русского библейского языка, но понятной современной форме.
- source_word: לִקְרֹא
  choice: провозгласить
  rationale: Соответствует официальному публичному объявлению свободы.
- source_word: לִשְׁבוּיִם דְּרוֹר
  choice: пленным свободу
  rationale: Сохраняет параллелизм и точно передаёт освобождение людей, захваченных в плен.
- source_word: וְלַאֲסוּרִים פְּקַח־קוֹחַ
  choice: и узникам — открытие темницы
  rationale: Передаёт традиционно понимаемый образ открытия заключения, при этом трудность редкого еврейского выражения и другая возможная трактовка отмечены в сноске.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Выбранный вариант различает титул и личное имя, не создаёт сочетания «Господь Господь» и сохраняет имя Яхве, присутствующее в исходном тексте.
- issue: Смысл помазания говорящего
  choice: помазал меня
  alternative: посвятил меня
  rationale: Буквальная формулировка сохраняет мессианское звучание текста, но не вводит в сам перевод позднейшее отождествление говорящего.
- issue: Трудное выражение פְּקַח־קוֹחַ
  choice: открытие темницы
  alternative: открытие глаз; освобождение
  rationale: Основной текст сохраняет образ открытия в параллели со свободой пленным, а примечание честно отражает лексическую неясность и не разрешает её догматически.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис разделён на два предложения ради ясности; тире подчёркивают именную конструкцию «Дух… на мне» и параллельное дополнение в заключительной строке. Все сноски поставлены непосредственно при словах и выражениях, к которым относятся.
