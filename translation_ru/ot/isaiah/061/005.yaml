base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/005.yaml
  text: Foreigners will stand and shepherd your flocks[b][a], and foreigners' sons will be your farmers and your vinedressers.
translation:
  language: ru
  text: Чужеземцы будут стоять и пасти ваши стада, а сыновья чужеземцев[a] будут вашими земледельцами и виноградарями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «сыновья чужеземцев»; идиоматическое выражение, означающее людей из чужих народов.
    reason: cultural_note
lexical_decisions:
- source_word: זָרִים
  choice: чужеземцы
  rationale: Передаёт людей, принадлежащих к другим народам; современно и естественно, при этом сохраняет отличие от адресованной общины.
- source_word: וְעָמְדוּ
  choice: будут стоять
  rationale: Сохраняет прямой образ еврейского глагола «стоять», не разворачивая его в толкование о готовности служить.
- source_word: וְרָעוּ
  choice: пасти
  rationale: Обычное значение רעה при стадах; естественное русское сочетание «пасти стада».
- source_word: צֹאנְכֶם
  choice: ваши стада
  rationale: Собирательное צֹאן обозначает мелкий скот, прежде всего овец и коз; «стада» сохраняет собирательность без неоправданного сужения до овец.
- source_word: בְנֵי נֵכָר
  choice: иноплеменники
  rationale: Еврейское «сыновья чужеземья/чужого [народа]» здесь идиоматически обозначает людей из иных народов, а не обязательно буквальных сыновей; «иноплеменники» кратко сохраняет этнический смысл.
- source_word: אִכָּרֵיכֶם
  choice: вашими земледельцами
  rationale: Точно и понятно обозначает работников, возделывающих землю, не сужая значение до пахарей.
- source_word: כֹרְמֵיכֶם
  choice: виноградарями
  rationale: Точно передаёт работников виноградников и звучит естественно в современном литературном русском.
theological_decisions:
- issue: Перемена общественных ролей в пророчестве о восстановлении Сиона
  choice: Чужеземцы изображены выполняющими для восстановленной общины пастушеские и земледельческие работы.
  alternative: Обобщённая картина международного сотрудничества либо чистая метафора изобилия.
  rationale: Еврейский текст прямо сохраняет асимметрию ролей. Перевод не смягчает её и не вводит позднейшего экклезиологического истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Буквальное «будут стоять» сохранено как выразительный и допускающий оттенок готовности к служению образ; редкое «иноплеменники» уместно в возвышенном контексте и пояснено сноской.
