base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/003.yaml
  text: to appoint for the mourners of Zion[a], to give them a headdress instead of ashes, oil of gladness instead of mourning, a garment of praise instead of a faint spirit; and they will be called oaks of righteousness, the planting of Yahweh[d][c][b], that he may display his glory.
translation:
  language: ru
  text: чтобы даровать скорбящим Сиона праздничный головной убор[a] вместо пепла, масло радости вместо скорби, одеяние хвалы вместо унылого духа. Их назовут дубами праведности[b], насаждением Яхве, чтобы Он прославился[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «украшение». Еврейское слово может обозначать украшение или нарядный головной убор; здесь головной убор, вероятно, противопоставлен пеплу на голове как знаку скорби.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «теревинфами праведности»; также возможно: «дубами справедливости». Еврейское название дерева и слово «праведность» допускают эти оттенки.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чтобы Он явил Свою славу». Заключительный еврейский глагол может указывать на то, что Яхве являет Своё величие через Своё насаждение.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָשׂוּם לַאֲבֵלֵי צִיּוֹן
  choice: чтобы позаботиться о скорбящих на Сионе
  rationale: לָשׂוּם вводит цель и в данном контексте означает устроить или обеспечить нечто для скорбящих. Русское «позаботиться о» естественно передаёт эту функцию; конструкция «скорбящие на Сионе» сохраняет возможную локативную связь с Сионом.
- source_word: פְּאֵר
  choice: праздничный головной убор
  rationale: Слово обозначает украшение, особенно нарядный головной убор. Конкретный образ противопоставлен пеплу, который в знак скорби возлагали на голову.
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: елей радости
  rationale: Сочетание обозначает масло для умащения, связанное с радостью и праздником. «Елей» сохраняет поэтический и библейский регистр, оставаясь понятным в контексте.
- source_word: מַעֲטֵה תְהִלָּה
  choice: одеяние хвалы
  rationale: מַעֲטֶה — верхнее покрытие или одежда; «одеяние» сохраняет образ и возвышенную поэтическую речь.
- source_word: רוּחַ כֵּהָה
  choice: угнетённый дух
  rationale: כֵּהָה буквально указывает на тусклость, ослабленность или изнеможение. «Угнетённый дух» естественно передаёт состояние внутренней подавленности, не сводя его к клиническому понятию.
- source_word: וְקֹרָא לָהֶם
  choice: Их назовут
  rationale: Форма 3-го лица единственного числа допускает неопределённо-личное значение, которое по-русски естественно передаётся конструкцией «их назовут» без добавления неуказанного субъекта.
- source_word: אֵילֵי הַצֶּדֶק
  choice: дубами праведности
  rationale: В связи с последующим «насаждением» אֵילֵי обозначает могучие деревья, вероятно дубы или терпентинные деревья. «Дубы» дают современному читателю ясный образ силы и укоренённости; צֶדֶק передано как «праведность».
- source_word: מַטַּע יְהוָה
  choice: насаждением Яхве
  rationale: מַטַּע означает посаженное или насаждение, а имя יְהוָה передано транслитерацией «Яхве», сохраняющей личное имя Бога.
- source_word: לְהִתְפָּאֵר
  choice: в котором Он явит Свою славу
  rationale: 'Возвратная форма допускает смысл прославления или явления великолепия. Эта формулировка выражает цель насаждения и сохраняет активный оттенок: Яхве являет через него Свою славу.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; «Яхве» передаёт личное заветное имя, а не заменяет его титулом.
- issue: Значение הַצֶּדֶק
  choice: праведности
  alternative: справедливости
  rationale: צֶדֶק охватывает праведность и справедливость. В образе восстановленного народа «праведность» удачно передаёт нравственно-заветный оттенок, тогда как возможный общественно-правовой оттенок отмечен в сноске.
- issue: Значение לְהִתְפָּאֵר
  choice: в котором Он явит Свою славу
  alternative: чтобы Он прославился
  rationale: Еврейская форма допускает и проявление славы, и прославление Яхве. Основной текст подчёркивает, что Его насаждение служит явлению Его величия, а пассивно-результативное понимание сохранено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Тройной параллелизм «вместо» сохранён. Конкретные образы головного убора, елея, одеяния и насаждения переданы без их аллегорического истолкования.
