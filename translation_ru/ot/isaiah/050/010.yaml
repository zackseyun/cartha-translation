  variant: modern literary Russian
source:
  edition: WLC
  text: מִ֤י בָ/כֶם֙ יְרֵ֣א יְהוָ֔ה שֹׁמֵ֖עַ בְּ/ק֣וֹל עַבְדּ֑/וֹ אֲשֶׁ֣ר הָלַ֣ךְ חֲשֵׁכִ֗ים וְ/אֵ֥ין נֹ֨גַהּ֙ ל֔/וֹ יִבְטַח֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/יִשָּׁעֵ֖ן בֵּ/אלֹהָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/010.yaml
  text: Who among you fears Yahweh[a], listening to the voice of his servant? Let the one who walks in darkness and has no light trust in the name of Yahweh and lean on his God.
translation:
  language: ru
  text: Кто из вас боится Яхве и слушает[a] голос Его слуги? Пусть тот, кто ходит во тьме и для кого нет света, уповает на имя Яхве и опирается на своего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внимает»; возможно также: «повинуется голосу Его слуги».'
    reason: Лексема שׁמע в конструкции «слушать голос» может обозначать как внимательное слушание, так и послушание.
lexical_decisions:
- source_word: מִי בָכֶם
  choice: Кто из вас
  rationale: Естественная русская вопросительная формула, сохраняющая прямое обращение к слушателям.
- source_word: יְרֵא יְהוָה
  choice: боится Яхве
  rationale: Глагол ירא передаёт благоговейный страх и верность Богу; «боится» сохраняет вес исходного выражения. Личное имя יהוה передано как «Яхве».
- source_word: שֹׁמֵעַ בְּקוֹל עַבְדּוֹ
  choice: слушает голос Его слуги
  rationale: Русское «слушает» сохраняет прямой смысл восприятия и внимания, но также допускает подразумеваемое послушание, не делая его единственным возможным толкованием.
- source_word: עַבְדּוֹ
  choice: Его слуги
  rationale: «Слуга» естественно обозначает посланного Богом служителя и не сужает его личность до какого-либо одного толкования.
- source_word: אֲשֶׁר הָלַךְ חֲשֵׁכִים
  choice: тот, кто ходит во тьме
  rationale: Настоящее время по-русски естественно выражает продолжающееся состояние; абстрактное множественное חֲשֵׁכִים передано единственным «тьма».
- source_word: וְאֵין נֹגַהּ לוֹ
  choice: и не видит света
  rationale: Идиоматическое русское выражение передаёт отсутствие для человека сияния или света, не утяжеляя фразу буквальным «и нет ему света».
- source_word: יִבְטַח בְּשֵׁם יְהוָה
  choice: уповает на имя Яхве
  rationale: «Уповать» естественно для возвышенного библейского регистра и выражает доверие; упоминание имени сохранено как указание на открытый Богом характер и верность.
- source_word: וְיִשָּׁעֵן בֵּאלֹהָיו
  choice: опирается на своего Бога
  rationale: «Опирается» сохраняет наглядную метафору שׁען и при этом ясно выражает доверие и зависимость.
theological_decisions:
- issue: Личность «Его слуги»
  choice: 'Референт оставлен неопределённым: «Его слуги».'
  alternative: Пророк; Израиль; мессианский Раб Господа.
  rationale: Сам стих прямо не называет слугу, поэтому перевод не разрешает сохраняемую контекстом богословскую многозначность.
- issue: Смысл שֹׁמֵעַ
  choice: «слушает» с примечанием о возможном значении послушания
  alternative: «повинуется»; «внимает»
  rationale: Корень שׁמע охватывает слышание, внимательное слушание и послушание. Основной текст сохраняет более широкий смысл, а примечание отмечает усиленный оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены имя «Яхве», образ упования на Божье имя и метафора опоры на Бога; личность слуги и оттенок глагола שׁמע намеренно не конкретизированы.
