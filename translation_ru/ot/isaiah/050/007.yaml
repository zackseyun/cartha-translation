- from: Но Владыка Яхве помогает мне[a], поэтому я не был посрамлён. Поэтому я сделал своё лицо подобным кремню[b] и знаю, что не буду постыжен[c].
  to: Но Владыка Яхве помогает мне[a], поэтому я не был посрамлён. Поэтому я сделал лицо своё твёрдым, как кремень[b], и знаю, что не буду посрамлён[c].
  rationale: 'Исправлена передача еврейского образа: лицо не просто уподобляется кремню, а становится твёрдым, как кремень. Лексика будущего посрамления приведена к более естественному современному русскому и снабжена близкой лексической альтернативой. Повтор «поэтому», имя Яхве и различие временных планов сохранены.'
