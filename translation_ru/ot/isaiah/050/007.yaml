  text: וַ/אדֹנָ֤/י יְהוִה֙ יַֽעֲזָר לִ֔/י עַל כֵּ֖ן לֹ֣א נִכְלָ֑מְתִּי עַל כֵּ֞ן שַׂ֤מְתִּי פָנַ/י֙ כַּֽ/חַלָּמִ֔ישׁ וָ/אֵדַ֖ע כִּי לֹ֥א אֵבֽוֹשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/007.yaml
  text: But the Lord GOD helps me[a]; therefore I have not been disgraced. Therefore I have set my face like flint[d][c][b], and I know that I will not be put to shame.
translation:
  language: ru
  text: Но Владыка Яхве помогает мне[a], поэтому я не был посрамлён. Поэтому я сделал лицо своё твёрдым, как кремень[b], и знаю, что не буду посрамлён[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «Владыка Яхве» передаёт אֲדֹנָי יְהוִה — титул «Владыка» и личное имя Бога Яхве.
    reason: alternative_reading
  - marker: b
    text: Образ лица, твёрдого, как кремень, означает непреклонную решимость перед лицом сопротивления.
    reason: cultural_note
  - marker: c
    text: 'Или: «не буду стыдиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сочетание сохраняет титул אֲדֹנָי и передаёт личное имя יהוה как «Яхве», не создавая неестественного русского сочетания «Господь ГОСПОДЬ».
- source_word: יַעֲזָר לִי
  choice: помогает мне
  rationale: Имперфект выражает продолжающуюся и уверенно ожидаемую помощь; настоящее время естественно передаёт эту настоящую-будущую уверенность.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Повтор слова сохранён, поскольку он подчёркивает последовательность выводов в речи.
- source_word: לֹא נִכְלָמְתִּי
  choice: я не был посрамлён
  rationale: Нифаль глагола כלם обозначает пережитое посрамление или унижение; форма «был посрамлён» сохраняет страдательно-результативный оттенок.
- source_word: שַׂמְתִּי פָנַי כַּחַלָּמִישׁ
  choice: я сделал своё лицо подобным кремню
  rationale: Близкая к форме оригинала передача сохраняет телесную метафору непреклонной решимости; «кремень» точно обозначает исключительно твёрдый камень.
- source_word: וָאֵדַע
  choice: и знаю
  rationale: Настоящее время передаёт твёрдую, уже обретённую уверенность говорящего естественнее буквального «и узнал».
- source_word: לֹא אֵבוֹשׁ
  choice: не буду постыжен
  rationale: Передача сохраняет оттенок объективного посрамления или крушения надежды и вместе с тем не полностью отождествляет בוש с предшествующим נכלם.
theological_decisions:
- issue: Передача составного Божьего титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: «Владыка Яхве» различает титул и личное имя и непосредственно отражает оба элемента еврейского выражения. Традиционный вариант «Господь Бог» возможен, но скрывает имя יהוה.
- issue: 'Соотношение двух выражений стыда: נִכְלָמְתִּי и אֵבוֹשׁ'
  choice: не был посрамлён / не буду постыжен
  alternative: не был унижен / не буду стыдиться
  rationale: Два близких, но не тождественных русских выражения сохраняют смысловой повтор и временное движение от уже испытанной Божьей помощи к уверенности в будущем, не сводя последнюю фразу лишь к внутреннему чувству стыда.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повтор «поэтому» и параллельная лексика посрамления сохранены. Метафора кремня оставлена явной, а её идиоматический смысл пояснён в сноске.
