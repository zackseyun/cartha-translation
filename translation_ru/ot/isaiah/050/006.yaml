    text: 'Или: «вырывающим бороду». В еврейском тексте объект действия прямо не назван; по контексту, вероятнее всего, имеются в виду волосы бороды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּוִי
  choice: спину мою
  rationale: גֵּו может обозначать спину или туловище; в контексте ударов «спину» — наиболее естественное и конкретное соответствие.
- source_word: נָתַתִּי
  choice: я отдал
  rationale: Прямо передаёт נתן и сохраняет контекстуальный оттенок добровольного принятия страдания без дополнительного толкования.
- source_word: לְמַכִּים
  choice: бьющим
  rationale: Причастие от נכה обозначает наносящих удары; краткая форма естественна в русском параллелизме.
- source_word: וּלְחָיַי
  choice: и щёки мои
  rationale: לְחִי обозначает щёку или область челюсти; «щёки» точно передаёт форму с суффиксом и образ унижения.
- source_word: לְמֹרְטִים
  choice: вырывающим волосы
  rationale: מרט означает вырывать или выщипывать, обычно волосы. Объект в еврейском тексте не назван; «волосы» делает действие понятным, не уточняя сверх текста, что речь непременно о бороде.
- source_word: פָּנַי לֹא הִסְתַּרְתִּי
  choice: лица моего не скрывал
  rationale: Сохраняет буквальный образ сокрытия лица и торжественный параллельный строй оригинала.
- source_word: מִכְּלִמּוֹת
  choice: от унижений
  rationale: כְּלִמּוֹת выражает позор, унижение или поношение; множественное «унижений» сохраняет форму и охватывает оскорбительное обращение.
- source_word: וָרֹק
  choice: и плевков
  rationale: רֹק означает плевок или слюну; «плевков» естественно сочетается с предлогом «от» и конкретно передаёт оскорбительное действие.
theological_decisions:
- issue: Следует ли явно обозначить мессианское или христологическое применение
  choice: Сохранить речь от первого лица на уровне еврейского текста, не называя говорящего Мессией или Иисусом.
  alternative: Сформулировать стих так, чтобы явно подчеркнуть его исполнение в страданиях Иисуса.
  rationale: Сам стих описывает говорящего раба от первого лица. Христологическое прочтение важно для христианской традиции, но его не следует вносить в перевод сверх сказанного в еврейском тексте.
translation_notes:
  register: Современный литературный русский с умеренно торжественным порядком слов, сохраняющим поэтический параллелизм. Формы «спину мою», «щёки мои», «лица моего» звучат достойно и связно, не становясь архаичными.
