source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהֹוִ֗ה נָ֤תַן לִ/י֙ לְשׁ֣וֹן לִמּוּדִ֔ים לָ/דַ֛עַת לָ/ע֥וּת אֶת יָעֵ֖ף דָּבָ֑ר יָעִ֣יר בַּ/בֹּ֣קֶר בַּ/בֹּ֗קֶר יָעִ֥יר לִ/י֙ אֹ֔זֶן לִ/שְׁמֹ֖עַ כַּ/לִּמּוּדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/004.yaml
  text: The Lord GOD has given me the tongue of those who are taught[a], that I may know how to sustain the weary with a word. Morning by morning he awakens[c][b]; he awakens my ear to hear like those who are taught.
translation:
  language: ru
  text: Владыка Яхве[a] дал мне язык наставляемых[b], чтобы я умел словом поддержать утомлённого[c]. Утро за утром Он пробуждает меня; утро за утром пробуждает моё ухо, чтобы я слышал, как слышат наставляемые.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «Владыка Яхве» — титул אֲדֹנָי вместе с Божьим именем YHWH.'
    reason: cultural_note
  - marker: b
    text: 'Или: «язык учеников», «язык наставленных».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский глагол имеет не вполне ясное значение; возможно также: «помочь» или, менее вероятно, «ответить утомлённому словом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Сочетание передаёт и титул אֲדֹנָי, и священное имя YHWH, избегая неестественного повтора «Господь Господь»; примечание сохраняет сведения о форме оригинала.
- source_word: לְשׁוֹן
  choice: язык
  rationale: Сохранён естественный и в русском языке образ языка как способности говорить.
- source_word: לִמּוּדִים
  choice: наставленных
  rationale: Форма обозначает людей, получивших наставление. «Наставленные» сохраняет эту пассивную окраску и не сужает значение до формального ученичества.
- source_word: לָדַעַת
  choice: чтобы я умел
  rationale: Инфинитив выражает цель данного Богом дара; в данном контексте знание означает способность уместно действовать.
- source_word: לָעוּת
  choice: поддержать
  rationale: Редкий и трудный глагол по контексту, вероятнее всего, означает оказать помощь или подкрепить; неопределённость отражена в примечании.
- source_word: יָעֵף
  choice: утомлённого
  rationale: Субстантивированное прилагательное обозначает изнемогшего или утомлённого человека; единственное число оригинала сохранено.
- source_word: דָּבָר
  choice: словом
  rationale: 'Творительный падеж естественно передаёт инструментальный смысл: помощь оказывается посредством слова.'
- source_word: יָעִיר
  choice: пробуждает
  rationale: Hiphil глагола עור означает «будить, пробуждать»; повтор сохранён для передачи ритма и смыслового акцента.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Утро за утром
  rationale: Повтор выражает регулярность и сохраняет поэтическую настойчивость еврейской фразы.
- source_word: יָעִיר לִי אֹזֶן
  choice: пробуждает моё ухо
  rationale: Сохранён конкретный образ оригинала. Притяжательное «моё» естественно передаёт датив לִי.
- source_word: לִשְׁמֹעַ כַּלִּמּוּדִים
  choice: чтобы я слушал, как наставленные
  rationale: «Слушал» в этом контексте передаёт не только восприятие звука, но и восприимчивость к наставлению; повтор слова «наставленные» связывает обе половины стиха.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Основной текст следует укоренённому русскому способу передачи священного имени словом «Господь», а отдельный титул передаёт как «Владыка». Примечание прямо указывает, что второй элемент в еврейском тексте — имя YHWH, не навязывая читателю спорную реконструкцию произношения.
- issue: Кто говорит в стихе
  choice: Не уточнять личность говорящего сверх первого лица оригинала
  alternative: Назвать говорящего Мессией, пророком или Израилем
  rationale: Стих сам не называет говорящего; перевод сохраняет эту открытость и не вносит конфессионального толкования.
- issue: Объект первого יָעִיר
  choice: «пробуждает меня»
  alternative: «пробуждает» без выраженного объекта
  rationale: В еврейском у первого глагола объект не назван, но русская фраза без него была бы резко неполной. «Меня» естественно выводится из последующего «моё ухо» и не определяет, каким именно образом происходит пробуждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Сохранены образы «язык» и «ухо», повтор «пробуждает» и единственное число «утомлённого». Архаизмы и конфессионально маркированные уточнения не вводятся.
