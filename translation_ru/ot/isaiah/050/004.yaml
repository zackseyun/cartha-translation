  to: Владыка Яхве[a] дал мне язык наставляемых[b], чтобы я умел словом поддержать утомлённого[c]. Утро за утром Он пробуждает меня; утро за утром пробуждает моё ухо, чтобы я слышал, как слышат наставляемые.
