id: ISA.50.11
reference: Isaiah 50:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֵ֧ן כֻּלְּ/כֶ֛ם קֹ֥דְחֵי אֵ֖שׁ מְאַזְּרֵ֣י זִיק֑וֹת לְכ֣וּ בְּ/א֣וּר אֶשְׁ/כֶ֗ם וּ/בְ/זִיקוֹת֙ בִּֽעַרְתֶּ֔ם מִ/יָּדִ/י֙ הָיְתָה זֹּ֣את לָ/כֶ֔ם לְ/מַעֲצֵבָ֖ה תִּשְׁכָּבֽוּ/ן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/011.yaml
  text: 'Look[a], all of you who kindle a fire, who gird yourselves with burning arrows: walk in the light of your fire and among the arrows you have set ablaze[b]. This has come to you from my hand: you will lie down in torment.'
translation:
  language: ru
  text: 'Вот, все вы, разжигающие огонь, вооружающиеся горящими стрелами[a], — идите при свете своего огня, среди стрел, которые вы зажгли. Вот что будет вам от Моей руки: вы ляжете в муках[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опоясывающиеся искрами»; возможны также: «вооружающиеся головнями» или «пылающими дротиками».'
    reason: Лексическое значение זִיקוֹת допускает понимание как искр, горящих головней либо огненных метательных средств; связь с מְאַזְּרֵי поддерживает образ снаряжения или вооружения.
  - marker: b
    text: 'Или: «в скорби»; также возможно: «в страдании».'
    reason: לְמַעֲצֵבָה охватывает значения боли, скорби, мучения и тяжёлого страдания.
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Указательно-восклицательная частица вводит резкое обращение; «вот» сохраняет её силу и естественно звучит в современном литературном русском.
- source_word: קֹדְחֵי אֵשׁ
  choice: разжигающие огонь
  rationale: Активное причастие передаёт действие тех, кто сам разводит или разжигает огонь; единственное число אֵשׁ сохранено.
- source_word: מְאַזְּרֵי זִיקוֹת
  choice: вооружающиеся горящими стрелами
  rationale: מְאַזְּרֵי буквально связано с опоясыванием или снаряжением себя. «Вооружающиеся» естественно передаёт этот образ по-русски, а «горящие стрелы» отражает возможное понимание זִיקוֹת как зажигательных метательных средств. Существенные альтернативы сохранены в сноске.
- source_word: לְכוּ
  choice: идите
  rationale: Императив הלך передан прямо; в контексте это ироническое повеление, а не одобрение.
- source_word: בְּאוּר אֶשְׁכֶם
  choice: при свете своего огня
  rationale: Передаёт образ созданного самими адресатами света и естественно сочетается с глаголом движения.
- source_word: וּבְזִיקוֹת בִּעַרְתֶּם
  choice: среди стрел, которые вы зажгли
  rationale: Предлог передан как «среди», а בִּעַרְתֶּם — активным «вы зажгли». Выбор «стрел» согласован с первым употреблением זִיקוֹת; неоднозначность отмечена в сноске.
- source_word: מִיָּדִי
  choice: от Моей руки
  rationale: Сохранён конкретный образ руки, выражающий непосредственное действие говорящего, без сглаживания до простого «от Меня».
- source_word: לְמַעֲצֵבָה
  choice: в муках
  rationale: Слово обозначает боль, мучение, скорбь или тяжёлое страдание. «В муках» естественно сочетается с образом того, что человек ложится, и сохраняет суровый судебный тон.
- source_word: תִּשְׁכָּבוּן
  choice: вы ляжете
  rationale: Буквально сохранены глагол שכב и направленность высказывания в будущее.
theological_decisions:
- issue: Тон повеления «идите при свете своего огня»
  choice: Иронический судебный вызов, возвещающий последствия самонадеянности адресатов
  alternative: Нейтральное разрешение продолжать избранный путь
  rationale: Упоминание руки говорящего и заключительное «вы ляжете в муках» показывают, что повеление не является одобрением.
- issue: Говорящий в выражении «от Моей руки»
  choice: Бог как источник возвещённого воздаяния
  alternative: Неуточнённый человеческий говорящий
  rationale: Контекст пророческой речи Исайи указывает на Божье действие; перевод не добавляет имени, а сохраняет форму первого лица исходного текста.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Заглавная буква в «Моей» обозначает божественного говорящего по русской издательской традиции. Двоеточие сохраняет переход от иронического повеления к судебному приговору; архаизмы и конфессионально специфические формулировки не используются.
