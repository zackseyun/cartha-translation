  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֵ֣ן אֲדֹנָ֤/י יְהוִה֙ יַֽעֲזָר לִ֔/י מִי ה֖וּא יַרְשִׁיעֵ֑/נִי הֵ֤ן כֻּלָּ/ם֙ כַּ/בֶּ֣גֶד יִבְל֔וּ עָ֖שׁ יֹאכְלֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/009.yaml
  text: Behold[a], the Lord GOD helps me; who is he who will declare me guilty? Behold, all of them will wear out like a garment; a moth will eat them.
translation:
  language: ru
  text: Вот, Владыка Яхве помогает мне — кто объявит меня виновным?[a] Вот, все они износятся, как одежда; моль съест их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто осудит меня?» Еврейский глагол имеет судебный смысл: признать или объявить кого-либо виновным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Эмфатическая частица, привлекающая внимание; «вот» сохраняет торжественную пророческую силу и естественно звучит по-русски.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Передаёт оба элемента составного Божественного титула: אֲדֹנָי как «Владыка», а тетраграмматон — личным именем «Яхве», без неестественного повтора «Господь Господь».'
- source_word: יַעֲזָר לִי
  choice: помогает мне
  rationale: Имперфект допускает настоящее или будущее значение; здесь настоящее выражает уверенность Раба в действенной и продолжающейся Божьей помощи.
- source_word: מִי הוּא
  choice: кто
  rationale: Русское риторическое «кто» естественно передаёт вопрос; буквальное «кто он» здесь звучало бы тяжеловесно и могло бы ошибочно предполагать конкретного названного человека.
- source_word: יַרְשִׁיעֵנִי
  choice: объявит меня виновным
  rationale: 'Hiphil от רשע имеет судебный смысл: признать или объявить виновным. Формулировка сохраняет юридический оттенок.'
- source_word: כֻּלָּם
  choice: все они
  rationale: Сохраняет всеохватность указания на противников и естественный русский порядок слов.
- source_word: כַּבֶּגֶד
  choice: как одежда
  rationale: Точно и естественно передаёт образ единственного собирательного существительного בֶּגֶד.
- source_word: יִבְלוּ
  choice: износятся
  rationale: Передаёт постепенное обветшание ткани, лежащее в основе сравнения.
- source_word: עָשׁ
  choice: моль
  rationale: Русское существительное без артикля естественно употребляется здесь в родовом значении.
- source_word: יֹאכְלֵם
  choice: съест их
  rationale: Сохраняет конкретный и яркий образ поедаемой молью одежды, не ослабляя его более отвлечённым «истребит».
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь ГОСПОДЬ
  rationale: «Владыка Яхве» различает титул אֲדֹנָי и личное имя יהוה, сохраняя оба элемента еврейского выражения и избегая повтора.
- issue: Судебный смысл יַרְשִׁיעֵנִי
  choice: объявит меня виновным
  alternative: осудит меня
  rationale: Основной текст явно сохраняет судебное значение каузативной формы; более краткое «осудит» допустимо, но может восприниматься шире.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Судебная риторика и образ ветшающей одежды сохранены; пунктуация подчёркивает уверенный вызов говорящего.
