source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֵ֣י זֶ֠ה סֵ֣פֶר כְּרִית֤וּת אִמְּ/כֶם֙ אֲשֶׁ֣ר שִׁלַּחְתִּ֔י/הָ א֚וֹ מִ֣י מִ/נּוֹשַׁ֔/י אֲשֶׁר מָכַ֥רְתִּי אֶתְ/כֶ֖ם ל֑/וֹ הֵ֤ן בַּ/עֲוֺנֹֽתֵי/כֶם֙ נִמְכַּרְתֶּ֔ם וּ/בְ/פִשְׁעֵי/כֶ֖ם שֻׁלְּחָ֥ה אִמְּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/001.yaml
  text: 'Thus says the LORD: Where is your mother''s certificate of divorce, with which I sent her away? Or which of my creditors is it to whom I sold you? Look, you were sold because of your iniquities, and your mother was sent away because of your transgressions.'
translation:
  language: ru
  text: 'Так говорит Господь: «Где разводное письмо вашей матери, с которым Я отослал её? Или кому из Моих заимодавцев Я продал вас? Вот, за ваши беззакония вы были проданы, и за ваши преступления была отослана ваша мать».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона, соответствующая консультационному слою LORD.
- source_word: סֵפֶר כְּרִיתוּת
  choice: разводное письмо
  rationale: Юридический документ о расторжении брака; выражение естественно для современного русского языка и сохраняет правовой образ.
- source_word: נֹשַׁי
  choice: заимодавцев
  rationale: Форма означает тех, кому говорящий должен, то есть кредиторов; «заимодавцы» звучит литературно и ясно в контексте продажи за долг.
- source_word: עֲוֺנֹתֵיכֶם
  choice: беззакония
  rationale: Передаёт нравственную вину и тяжесть проступков, не сводя слово лишь к отдельным ошибкам.
- source_word: פִשְׁעֵיכֶם
  choice: преступления
  rationale: Сохраняет оттенок сознательного нарушения или мятежа и отличает термин от עֲוֹנוֹת.
- source_word: שֻׁלְּחָה
  choice: была отослана
  rationale: Сохраняет связь с более ранним שִׁלַּחְתִּיהָ и бракоразводный образ, не усиливая его словом «изгнана».
theological_decisions:
- issue: Причина разрыва между Господом и народом
  choice: 'Сохранена явная причинная связь: «за ваши беззакония… за ваши преступления».'
  alternative: Представить продажу и отсылку как произвольный отказ Бога от народа.
  rationale: Риторические вопросы отрицают наличие разводного документа или кредитора и возлагают ответственность на грехи адресатов.
- issue: Метафоры матери и детей
  choice: Сохранены обе взаимосвязанные метафоры без прямого отождествления матери с конкретной исторической или богословской сущностью.
  alternative: Раскрыть «мать» непосредственно как Сион, Иерусалим или заветное сообщество.
  rationale: Сам стих оставляет референт образа подразумеваемым; перевод не должен устранять эту смысловую напряжённость.
- issue: «Продал вас» и «вы были проданы»
  choice: Сохранено различие между вопросом о предполагаемой продаже Богом кредитору и утверждением о продаже вследствие беззаконий.
  alternative: Сгладить оба выражения до общего смысла изгнания или плена.
  rationale: 'Так сохраняется риторическая логика еврейского текста: внешнего кредитора нет, а бедствие связано с виной самого народа.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторические вопросы и параллелизм сохранены; синтаксис сделан понятным без добавления толкований.
