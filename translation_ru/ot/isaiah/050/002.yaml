source:
  edition: WLC
  text: מַדּ֨וּעַ בָּ֜אתִי וְ/אֵ֣ין אִ֗ישׁ קָרָֽאתִי֮ וְ/אֵ֣ין עוֹנֶה֒ הֲ/קָצ֨וֹר קָצְרָ֤ה יָדִ/י֙ מִ/פְּד֔וּת וְ/אִם אֵֽין בִּ֥/י כֹ֖חַ לְ/הַצִּ֑יל הֵ֣ן בְּ/גַעֲרָתִ֞/י אַחֲרִ֣יב יָ֗ם אָשִׂ֤ים נְהָרוֹת֙ מִדְבָּ֔ר תִּבְאַ֤שׁ דְּגָתָ/ם֙ מֵ/אֵ֣ין מַ֔יִם וְ/תָמֹ֖ת בַּ/צָּמָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/002.yaml
  text: Why[a], when I came, was there no man? When I called, was there no one to answer? Is my hand really too short to redeem, or is there no power in me to deliver? Behold[b], by my rebuke I dry up the sea; I make rivers a wilderness[c]; their fish stink for lack of water and die of thirst.
translation:
  language: ru
  text: Почему, когда Я пришёл, никого не было? Когда Я звал, никто не ответил? Разве Моя рука стала слишком коротка для выкупа, или во Мне нет силы, чтобы избавить? Вот, Моим окриком Я иссушаю море, превращаю реки в пустыню; их рыба смердит от недостатка воды и умирает от жажды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַדּוּעַ בָּאתִי וְאֵין אִישׁ
  choice: Почему, когда Я пришёл, никого не было?
  rationale: מַדּוּעַ вводит риторический вопрос; אִישׁ в отрицательной экзистенциальной конструкции естественно передаётся по-русски местоимением «никого», не ограничивая смысл мужчиной.
- source_word: קָרָאתִי וְאֵין עוֹנֶה
  choice: Когда Я звал, никто не ответил?
  rationale: קרא сохраняет широкий смысл зова или призыва; причастие עוֹנֶה в данной риторической конструкции естественно передано русским прошедшим временем.
- source_word: הֲקָצוֹר קָצְרָה יָדִי מִפְּדוּת
  choice: Разве Моя рука стала слишком коротка, чтобы выкупить
  rationale: Сохранена антропоморфная метафора «короткой руки», выражающая мнимую неспособность. Конструкция קָצוֹר קָצְרָה допускает результативный оттенок «стала коротка»; פדות передано глаголом «выкупить».
- source_word: וְאִם אֵין בִּי כֹחַ לְהַצִּיל
  choice: или во Мне нет силы, чтобы избавить
  rationale: כֹחַ — «сила, мощь»; הציל имеет широкий смысл избавления или спасения от бедствия, поэтому «избавить» не сужает его до исключительно духовного спасения.
- source_word: הֵן בְּגַעֲרָתִי אַחֲרִיב יָם
  choice: Вот, от Моего грозного окрика Я иссушаю море
  rationale: הֵן привлекает внимание к доказательству Божьей силы. גערה обозначает властный окрик или грозное повеление; חרב в контексте отсутствия воды означает иссушение.
- source_word: אָשִׂים נְהָרוֹת מִדְבָּר
  choice: превращаю реки в пустыню
  rationale: Конструкция שים с двумя объектами выражает превращение; «в пустыню» ясно и естественно сохраняет образ.
- source_word: תִּבְאַשׁ דְּגָתָם מֵאֵין מַיִם וְתָמֹת בַּצָּמָא
  choice: рыба в них смердит от недостатка воды и умирает от жажды
  rationale: Собирательное דגה передано единственным числом «рыба»; суффикс «их» раскрыт естественным русским «в них», то есть в реках.
theological_decisions:
- issue: Антропоморфное изображение Божьей силы как «руки»
  choice: 'Сохранить: «Моя рука стала слишком коротка»'
  alternative: «Неужели Моей силы недостаточно»
  rationale: Образ прямо присутствует в еврейском тексте и усиливает риторический вопрос; следующая часть сама поясняет его через слово «сила».
- issue: Соотношение פדות и הציל
  choice: Различить как «выкупить» и «избавить»
  alternative: Передать оба глагола словом «спасти»
  rationale: Так сохраняются как выкупной оттенок פדות, так и более общий смысл избавления у הציל, без навязывания узкой догматической трактовки.
- issue: אִישׁ в отрицательной конструкции
  choice: «никого не было»
  alternative: «не было человека»
  rationale: Здесь אִישׁ имеет репрезентативно-неопределённый смысл. «Никого» — точный и современный русский эквивалент, не меняющий богословского содержания.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаической интонацией. Заглавные буквы в местоимениях, относящихся к Богу, использованы как русская издательская конвенция. Риторические вопросы, метафора руки и резкий образ гибнущей рыбы сохранены.
