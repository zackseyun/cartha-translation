  source_fidelity: 'Перевод точно передаёт структуру и судебную образность еврейского текста: начальное קָרוֹב отражено акцентированным «Близок»; מַצְדִּיקִי передано в уместном судебном значении «Тот, кто оправдывает меня»; ריב, когортатив נַעַמְדָה, בַּעַל מִשְׁפָּטִי и призыв יִגַּשׁ переданы без существенных смысловых добавлений. «Кто предъявляет мне иск?» естественно выражает смысл стороны, ведущей дело/претензию против говорящего, не выдавая спорный буквальный образ за основной текст.'
