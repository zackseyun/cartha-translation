source:
  edition: WLC
  text: קָרוֹב֙ מַצְדִּיקִ֔/י מִֽי יָרִ֥יב אִתִּ֖/י נַ֣עַמְדָה יָּ֑חַד מִֽי בַ֥עַל מִשְׁפָּטִ֖/י יִגַּ֥שׁ אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/008.yaml
  text: Near is the one who vindicates me[a]; who will contend with me? Let us stand together[b]. Who is the master of my case? Let him come near to me.
translation:
  language: ru
  text: Близок Тот, кто оправдывает меня[a]. Кто станет судиться со мной? Встанем вместе. Кто предъявляет мне иск[b]? Пусть подойдёт ко мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признаёт меня правым», «выносит решение в мою пользу». В данном контексте еврейский глагол имеет судебный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «кто хозяин моего судебного дела?», то есть кто выдвигает против меня правовое притязание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: Близок
  rationale: Предикативное прилагательное вынесено в начало, как в еврейском тексте, что сохраняет смысловое ударение и напряжённый тон судебной речи.
- source_word: מַצְדִּיקִי
  choice: Тот, кто оправдывает меня
  rationale: Hифиль глагола צדק в данном судебном контексте означает признание правым, оправдание или вынесение решения в пользу говорящего. Русское «оправдывает» естественно передаёт юридический смысл, не подразумевая нравственного преобразования.
- source_word: יָרִיב אִתִּי
  choice: станет судиться со мной
  rationale: Глагол ריב может обозначать спор и судебную тяжбу. Здесь окружающая юридическая лексика поддерживает ясное русское «судиться».
- source_word: נַעַמְדָה יָּחַד
  choice: Встанем вместе
  rationale: Когортатив выражает вызов совместно предстать перед судом. Краткая формулировка сохраняет буквальный образ и решительный тон.
- source_word: בַעַל מִשְׁפָּטִי
  choice: Кто предъявляет мне иск
  rationale: Буквально выражение означает «владелец/хозяин моего судебного дела» и обозначает сторону, выдвигающую против говорящего правовое притязание. Функциональная русская формулировка передаёт этот смысл без неестественной кальки.
- source_word: יִגַּשׁ אֵלָי
  choice: Пусть подойдёт ко мне
  rationale: Форма выражает вызывающее приглашение приблизиться. «Подойдёт ко мне» звучит естественно и перекликается с начальным «Близок».
theological_decisions:
- issue: Судебный или нравственно-преобразующий смысл מַצְדִּיקִי
  choice: судебное «оправдывает меня»
  alternative: «делает меня праведным» или терминологическое «объявляет меня праведным»
  rationale: 'Контекст последовательно изображает судебное разбирательство: спор, совместное предстояние, иск и приближение противной стороны. Поэтому перевод сохраняет значение судебного признания правоты, не привнося идею внутреннего нравственного преобразования и не связывая стих с более поздней богословской терминологией.'
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и напряжённым судебным тоном. Начальное «Близок» сохраняет инверсию и акцент оригинала; заглавное «Тот» отмечает субстантивированное указание без добавления отсутствующего в тексте имени. Юридическая образность передана понятными современному читателю выражениями.
