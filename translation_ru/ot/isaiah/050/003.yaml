  text: אַלְבִּ֥ישׁ שָׁמַ֖יִם קַדְר֑וּת וְ/שַׂ֖ק אָשִׂ֥ים כְּסוּתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/003.yaml
  text: I clothe the heavens with darkness[b][a], and I make sackcloth their covering.
translation:
  language: ru
  text: Я облекаю небеса мраком[a] и делаю вретище[b] их покрывалом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чернотой» или «сумраком».'
    reason: lexical_alternative
  - marker: b
    text: Вретище — грубая ткань, которую носили в знак скорби и плача.
    reason: cultural_note
lexical_decisions:
- source_word: אַלְבִּישׁ
  choice: Я облекаю
  rationale: Форма хифиль от לבשׁ означает «облекать, одевать». «Облекаю» сохраняет каузативный смысл, поэтический регистр и связь с последующим образом покрывала.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Форма обычно обозначает небо или небеса; «небеса» сохраняет грамматическое число и возвышенную поэтическую образность.
- source_word: קַדְרוּת
  choice: мраком
  rationale: Существительное передаёт значение темноты, черноты или сумрачности. «Мраком» естественно сочетается с «облекаю» и не сводит образ только к цвету либо эмоциональному состоянию.
- source_word: וְשַׂק
  choice: и вретище
  rationale: שַׂק — грубая ткань, связанная с трауром и скорбью. Традиционное русское «вретище» сохраняет библейскую и культурную образность; значение пояснено в сноске.
- source_word: אָשִׂים
  choice: делаю
  rationale: שׂים может означать «класть, помещать, делать». В сочетании с именной частью «их покрывалом» глагол «делаю» естественно передаёт превращение вретища в покрытие небес.
- source_word: כְּסוּתָם
  choice: их покрывалом
  rationale: Слово означает покрытие или одеяние. «Покрывалом» поддерживает поэтический образ облачения и не уточняет вид одежды сверх исходного текста.
theological_decisions:
- issue: Космический образ суда и скорби
  choice: Сохранить как прямое Божье высказывание о том, что Он облекает небеса мраком и покрывает их вретищем.
  alternative: Истолковать образ исключительно как буквальное помрачение неба либо исключительно как метафору траура и суда.
  rationale: Еврейская поэзия позволяет образу одновременно вызывать представления о космическом помрачении, скорби и суде; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. «Облекаю» и «покрывало» передают параллелизм оригинала; менее общеупотребительное «вретище» сохранено ради библейской культурной образности и снабжено пояснением.
