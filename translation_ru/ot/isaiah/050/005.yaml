base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/005.yaml
  text: The Lord GOD has opened my ear[a], and I was not rebellious; I did not turn back.
translation:
  language: ru
  text: Господь Яхве открыл мне ухо, и я не противился, не отступил назад[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отступил».'
    reason: Глагол סוג может означать отступить, податься назад или повернуть назад; вариант передаёт это значение без добавления толкования об уклонении от поручения.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי как титул верховной власти, а «Яхве» сохраняет личное заветное имя יהוה; сочетание естественно звучит по-русски и передаёт оба элемента еврейского выражения.
- source_word: פָּתַח לִי אֹזֶן
  choice: открыл мне ухо
  rationale: Сохранён конкретный и выразительный образ еврейского текста — буквально «открыл мне ухо», то есть сделал способным и готовым услышать; перевод не сводит образ к одному толкованию.
- source_word: מָרִיתִי
  choice: не воспротивился
  rationale: Глагол מרה обозначает непокорность или сопротивление. «Не воспротивился» естественно передаёт деятельный отказ от мятежного сопротивления, не добавляя конфессионального толкования.
- source_word: אָחוֹר לֹא נְסוּגֹתִי
  choice: не отступил назад
  rationale: Сочетание сохраняет пространственный образ движения вспять и передаёт смысл отказа уклониться от порученного пути.
theological_decisions:
- issue: Передача Божьего имени в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Владыка Господь
  rationale: Форма «Яхве» непосредственно представляет тетраграмматон и позволяет сохранить отличие личного имени от титула אֲדֹנָי, не сливая два элемента выражения.
- issue: Образ открытого уха
  choice: сохранить буквальный образ «открыл мне ухо»
  alternative: «научил меня слушать» или «дал мне способность слышать»
  rationale: Еврейский текст допускает смысл готовности внимать и повиноваться, но прямо не формулирует его отвлечённо; конкретный образ сохраняет смысловую глубину и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с dignified библейской выразительностью. Параллельные отрицательные конструкции сохранены, а конкретный образ уха не заменён поясняющей перифразой.
