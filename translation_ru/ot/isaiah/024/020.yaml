  variant: modern literary Russian
source:
  edition: WLC
  text: נ֣וֹעַ תָּנ֤וּעַ אֶ֨רֶץ֙ כַּ/שִּׁכּ֔וֹר וְ/הִֽתְנוֹדְדָ֖ה כַּ/מְּלוּנָ֑ה וְ/כָבַ֤ד עָלֶ֨י/הָ֙ פִּשְׁעָ֔/הּ וְ/נָפְלָ֖ה וְ/לֹא תֹסִ֥יף קֽוּם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/020.yaml
  text: The earth will stagger like a drunkard[a], and sway back and forth like a hut; its transgression lies heavy upon it, and it will fall and not rise again.
translation:
  language: ru
  text: Земля будет шататься, как пьяный, и раскачиваться, как временный шалаш[a]. Тяжким бременем лежит на ней её беззаконие; она падёт и больше не поднимется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как сторожевой шалаш»; еврейское слово обозначает непрочное временное укрытие или место ночлега.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֣וֹעַ תָּנ֤וּעַ
  choice: будет шататься
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает значение глагола. По-русски усиление естественно передаётся контекстом и образом пьяного, без неуклюжего буквального повтора.
- source_word: אֶ֨רֶץ֙
  choice: земля
  rationale: В контексте Ис 24 речь имеет вселенский масштаб; «земля» сохраняет этот смысл, не сужая его до отдельной страны.
- source_word: כַּ/שִּׁכּ֔וֹר
  choice: как пьяный
  rationale: Субстантивированное обозначение пьяного человека естественно и кратко передаётся по-русски словом «пьяный».
- source_word: וְ/הִֽתְנוֹדְדָ֖ה
  choice: и раскачиваться
  rationale: Форма передаёт повторное неустойчивое движение; «раскачиваться» хорошо отличает этот образ от предшествующего «шататься».
- source_word: כַּ/מְּלוּנָ֑ה
  choice: как временный шалаш
  rationale: מְלוּנָה обозначает непрочное временное укрытие или ночлег. Добавление «временный» делает существенную часть образа ясной современному читателю.
- source_word: וְ/כָבַ֤ד עָלֶ֨י/הָ֙
  choice: тяжким бременем лежит на ней
  rationale: Передаёт метафору тяжести и глагольное значение כבד естественным, но сохраняющим достоинство русским оборотом.
- source_word: פִּשְׁעָ֔/הּ
  choice: её беззаконие
  rationale: פשע может означать преступление, мятеж или нарушение. «Беззаконие» сохраняет нравственную тяжесть, не ограничивая смысл исключительно политическим бунтом.
- source_word: וְ/נָפְלָ֖ה
  choice: она падёт
  rationale: Пророческая последовательность естественно передаётся будущим временем; «падёт» соответствует возвышенному, но понятному регистру.
- source_word: וְ/לֹא תֹסִ֥יף קֽוּם
  choice: и больше не поднимется
  rationale: Оборот יסף с инфинитивом означает прекращение повторного действия; русский вариант ясно передаёт окончательность падения.
theological_decisions:
- issue: Масштаб значения אֶרֶץ в контексте суда
  choice: земля
  alternative: страна
  rationale: Общий контекст главы описывает всеохватное опустошение. «Земля» сохраняет космический масштаб текста без внесения дополнительных богословских построений.
- issue: Значение פִּשְׁעָהּ
  choice: её беззаконие
  alternative: её мятеж / её преступление
  rationale: Еврейское слово включает идею виновного нарушения и неповиновения. «Беззаконие» оставляет этот диапазон достаточно открытым и не сводит его к одному виду проступка.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис разделён на два предложения для ясности; образы шатания, раскачивания, тяжести и окончательного падения сохранены.
