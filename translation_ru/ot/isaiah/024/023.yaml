  text: וְ/חָֽפְרָה֙ הַ/לְּבָנָ֔ה וּ/בוֹשָׁ֖ה הַֽ/חַמָּ֑ה כִּֽי מָלַ֞ךְ יְהוָ֣ה צְבָא֗וֹת בְּ/הַ֤ר צִיּוֹן֙ וּ/בִ/יר֣וּשָׁלִַ֔ם וְ/נֶ֥גֶד זְקֵנָ֖י/ו כָּבֽוֹד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/023.yaml
  text: Then the moon will be ashamed[a], and the sun disgraced, for Yahweh of hosts reigns on Mount Zion and in Jerusalem[b], and before his elders there is glory.
translation:
  language: ru
  text: Тогда луна устыдится, и солнце посрамится, потому что Яхве Воинств воцарится на горе Сион и в Иерусалиме, и перед Его старейшинами — слава.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская заключительная фраза предельно кратка: буквально «и перед его старейшинами — слава». Местоимение «его» может относиться к Яхве; возможно также понимание «перед её старейшинами», то есть перед старейшинами Сиона или Иерусалима.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחָפְרָה
  choice: устыдится
  rationale: В данном контексте глагол выражает стыд и унижение; будущее время естественно передаёт пророческую перспективу.
- source_word: הַלְּבָנָה
  choice: луна
  rationale: Обычное обозначение луны; этимологический оттенок «белая» здесь не выдвинут на первый план.
- source_word: וּבוֹשָׁה
  choice: будет посрамлено
  rationale: Сохраняет параллелизм со стыдом луны, но различает два еврейских глагола и передаёт публичное унижение.
- source_word: הַחַמָּה
  choice: солнце
  rationale: В поэтической паре с луной слово однозначно обозначает солнце.
- source_word: כִּי
  choice: потому что
  rationale: 'Вводит причину помрачения небесных светил: царственное явление Яхве и Его славы.'
- source_word: מָלַךְ
  choice: воцарится
  rationale: Перфект в пророческом контексте представляет будущее событие как несомненное; «воцарится» передаёт как царствование, так и оттенок вступления на царство.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией, а צְבָאוֹת — широким по смыслу традиционным словом, не сводящим выражение только к земным армиям.
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלִַם
  choice: на горе Сион и в Иерусалиме
  rationale: Естественная русская передача разных локативных сочетаний с горой и городом.
- source_word: וְנֶגֶד זְקֵנָיו כָּבוֹד
  choice: и перед Его старейшинами будет слава
  rationale: Сохраняет краткость именной заключительной конструкции и наиболее естественно относит местоименный суффикс к Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога, поэтому оно передано непосредственно, а не заменено титулом.
- issue: Временной и видовой смысл מָלַךְ
  choice: воцарится
  alternative: царствует / воцарился
  rationale: Пророческий перфект допускает несколько временных оттенков. Будущее «воцарится» соответствует общей эсхатологической перспективе главы, не устраняя оттенка уверенности в событии.
- issue: Референт суффикса в זְקֵנָיו
  choice: Его старейшинами — старейшинами Яхве
  alternative: её старейшинами — старейшинами Сиона/Иерусалима
  rationale: Мужской единственный суффикс естественнее всего относится к Яхве, главному действующему лицу; структурно возможная альтернатива сохранена в примечании.
- issue: Синтаксис заключительного כָּבוֹד
  choice: будет слава
  alternative: Его слава / слава перед старейшинами
  rationale: В еврейском тексте «слава» стоит как краткое конечное существительное без явной связки и без местоименного суффикса; перевод не добавляет принадлежность, которой нет в форме слова.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Различие между двумя близкими глаголами стыда сохранено без архаизмов. Необычное, но прозрачное именование «Яхве Воинств» удерживает форму и широту исходного титула.
