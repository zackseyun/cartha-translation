  text: הִבּ֧וֹק תִּבּ֛וֹק הָ/אָ֖רֶץ וְ/הִבּ֣וֹז תִּבּ֑וֹז כִּ֣י יְהוָ֔ה דִּבֶּ֖ר אֶת הַ/דָּבָ֥ר הַ/זֶּֽה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/003.yaml
  text: The earth will be utterly emptied and utterly plundered[a], for Yahweh has spoken this word.
translation:
  language: ru
  text: Земля будет совершенно опустошена и полностью разграблена[a], потому что Яхве изрёк это слово.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Страна будет совершенно опустошена и полностью разграблена». Еврейское אֶרֶץ может означать «страна» или «земля»; более широкий контекст здесь поддерживает всеобщий смысл — «земля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבּוֹק תִּבּוֹק
  choice: будет совершенно опустошена
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает действие. Нифаль глагола בקק обозначает опустошение; перевод сохраняет страдательное значение и эмфазу.
- source_word: הָאָרֶץ
  choice: земля
  rationale: אֶרֶץ может означать как отдельную страну, так и землю в целом. Универсальный контекст Ис 24 поддерживает более широкий смысл.
- source_word: וְהִבּוֹז תִּבּוֹז
  choice: и полностью разграблена
  rationale: Повторная конструкция из абсолютного инфинитива и личной формы подчёркивает полноту действия. Глагол בזז означает разграбление или расхищение.
- source_word: כִּי
  choice: потому что
  rationale: 'Союз вводит основание неизбежности объявленного суда: это слово произнёс Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: דִּבֶּר
  choice: изрёк
  rationale: Перфект представляет высказывание как совершившееся и непреложное; «изрёк» естественно передаёт торжественный пророческий регистр.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: это слово
  rationale: В пророческой формуле דָּבָר обозначает произнесённое Божье постановление; буквальное «слово» сохраняет связь с речью.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное Божье имя, не заменяя его титулом.
- issue: Масштаб הָאָרֶץ
  choice: земля в целом
  alternative: страна
  rationale: Само слово допускает оба значения, однако окружающий контекст Ис 24 описывает всеобщий масштаб суда. Лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Параллельные усилительные конструкции переданы сочетаниями «совершенно» и «полностью», чтобы сохранить эмфазу без неестественного повтора.
