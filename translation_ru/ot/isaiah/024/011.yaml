base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/011.yaml
  text: There is an outcry over the wine in the streets[a]; all joy has grown dark[b]; the gladness of the earth has gone away.
translation:
  language: ru
  text: На улицах слышен крик о вине; вся радость померкла, ликование земли ушло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְוָחָה
  choice: кричат
  rationale: Существительное обозначает крик бедствия или вопль. Безлично-личная конструкция «кричат» естественна по-русски и передаёт публичный характер плача.
- source_word: עַל הַיַּיִן
  choice: о вине
  rationale: Предлог עַל может указывать на предмет или причину плача. «О вине» сохраняет неоднозначность лучше, чем пояснительное «из-за недостатка вина».
- source_word: בַּחוּצוֹת
  choice: на улицах
  rationale: Слово обозначает открытые городские пространства, включая улицы и площади; «на улицах» естественно передаёт место общего плача.
- source_word: עָרְבָה כָּל שִׂמְחָה
  choice: всякая радость померкла
  rationale: Глагол связан с наступлением вечера или потемнением. «Померкла» сохраняет образ угасающего света и звучит естественно в современном литературном русском.
- source_word: גָּלָה
  choice: исчезло
  rationale: В данном сочетании глагол означает удаление или уход. «Исчезло» ясно передаёт результат, не делая метафору изгнания излишне буквальной.
- source_word: מְשׂוֹשׂ
  choice: ликование
  rationale: Слово выражает праздничную, восторженную радость; «ликование» позволяет отличить его от שִׂמְחָה, переведённого как «радость».
- source_word: הָאָרֶץ
  choice: земли
  rationale: В контексте Ис 24 речь имеет широкий, всеобщий масштаб; «земли» сохраняет этот смысл, хотя слово может также означать отдельную страну.
theological_decisions:
- issue: Масштаб значения הָאָרֶץ
  choice: земли
  alternative: страны
  rationale: Широкая картина суда в Ис 24 поддерживает значение «земля» в универсальном смысле, но лексическая возможность значения «страна» остаётся реальной.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Образ наступающей темноты передан глаголом «померкла»; синтаксис краток и ритмичен.
