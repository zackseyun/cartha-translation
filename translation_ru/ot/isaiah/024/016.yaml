source:
  edition: WLC
  text: מִ/כְּנַ֨ף הָ/אָ֜רֶץ זְמִרֹ֤ת שָׁמַ֨עְנוּ֙ צְבִ֣י לַ/צַּדִּ֔יק וָ/אֹמַ֛ר רָזִי לִ֥/י רָֽזִי לִ֖/י א֣וֹי לִ֑/י בֹּגְדִ֣ים בָּגָ֔דוּ וּ/בֶ֥גֶד בּוֹגְדִ֖ים בָּגָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/016.yaml
  text: 'From the edge of the earth we hear songs: “Glory to the righteous one.” But I say[a], “I waste away, I waste away. Woe is me!” The treacherous deal treacherously[c][b]; with treachery the treacherous deal treacherously.'
translation:
  language: ru
  text: 'От края земли[a] мы слышим песни: «Слава праведнику!»[b] Но я сказал: «Я истощаюсь, я истощаюсь![c] Горе мне! Вероломные поступают вероломно, и вероломством вероломные поступают вероломно».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от крыла земли»; возможно также: «от конца земли».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Красота праведнику», «Честь праведному»; возможно также собирательное понимание: «Слава праведным».'
    reason: alternative_reading
  - marker: c
    text: 'Еврейское רָזִי לִי — трудное выражение. Традиционно его понимают как вопль об истощении или изнеможении; возможно также: «Моя тайна при мне» или «Для меня это тайна».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִכְּנַף הָאָרֶץ
  choice: От края земли
  rationale: כָּנָף буквально означает «крыло», но в географическом выражении обозначает край, оконечность. «От края земли» сохраняет образ и естественно звучит по-русски, не превращая единственное число в множественное.
- source_word: זְמִרֹת
  choice: песни
  rationale: Слово обозначает песни или музыкальные произведения; контекст допускает хвалебные песни, но само существительное этого не уточняет.
- source_word: שָׁמַעְנוּ
  choice: мы слышим
  rationale: Перфект в живой пророческой речи передан настоящим временем, чтобы сохранить непосредственность картины.
- source_word: צְבִי לַצַּדִּיק
  choice: Слава праведнику
  rationale: צְבִי может означать красоту, великолепие, славу или честь. В возгласе «слава» естественно передаёт хвалебный смысл, а единственное число לַצַּדִּיק сохранено словом «праведнику».
- source_word: וָאֹמַר
  choice: Но я сказал
  rationale: Форма продвигает повествование, а союз «но» передаёт резкий контраст между услышанными песнями и последующим плачем.
- source_word: רָזִי לִי רָזִי לִי
  choice: Я истощаюсь, я истощаюсь
  rationale: Трудное выражение традиционно связывают с худобой и истощением. Глагольная передача естественна по-русски и соответствует контексту бедствия; иное прочтение отмечено в сноске.
- source_word: אוֹי לִי
  choice: Горе мне!
  rationale: Устойчивое русское выражение плача сохраняет эмоциональную силу еврейского восклицания.
- source_word: בֹּגְדִים בָּגָדוּ
  choice: Вероломные поступают вероломно
  rationale: Корень בגד выражает вероломство, неверность или предательство. Повтор однокоренных слов по возможности сохранён.
- source_word: וּבֶגֶד בּוֹגְדִים בָּגָדוּ
  choice: и вероломством вероломные поступают вероломно
  rationale: Намеренно тяжеловесное накопление однокоренных форм отражает усиленный тройной повтор корня בגד в исходном тексте.
theological_decisions:
- issue: Кого обозначает לַצַּדִּיק
  choice: праведнику — форма единственного числа без уточнения личности
  alternative: праведным — собирательное понимание
  rationale: В еврейском тексте стоит определённая форма единственного числа, однако личность праведника не названа. Перевод сохраняет единственное число и не вводит конкретного богословского отождествления; собирательное понимание указано в сноске.
- issue: Понимание רָזִי לִי
  choice: плач об истощении
  alternative: «Моя тайна при мне» или «Для меня это тайна»
  rationale: Контекст возгласа «Горе мне!» и последующего описания вероломства поддерживает традиционное понимание как истощения, но неоднозначность согласного текста сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис в целом естественный, но заключительная однокоренная повторность намеренно сохранена ради резкой риторики еврейского текста. Слово «праведнику» оставлено со строчной буквы, чтобы не навязывать конкретного отождествления.
