source:
  edition: WLC
  text: עַל כֵּ֗ן אָלָה֙ אָ֣כְלָה אֶ֔רֶץ וַֽ/יֶּאְשְׁמ֖וּ יֹ֣שְׁבֵי בָ֑/הּ עַל כֵּ֗ן חָרוּ֙ יֹ֣שְׁבֵי אֶ֔רֶץ וְ/נִשְׁאַ֥ר אֱנ֖וֹשׁ מִזְעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/006.yaml
  text: Therefore a curse has devoured the earth[a], and those who dwell in it bear their guilt; therefore the inhabitants of the earth are scorched[c][b], and few men are left.
translation:
  language: ru
  text: Поэтому проклятие[a] пожрало землю, и живущие на ней несут свою вину. Поэтому жители земли[b] опалены, и людей осталось совсем мало.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клятва пожрала землю». Еврейское слово может означать «клятва» или «проклятие»; в контексте нарушенного завета и последовавшего суда лучше подходит «проклятие».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жители страны». Еврейское слово может означать как всю землю, так и отдельную страну; здесь всемирный размах главы указывает на значение «земля».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Передаёт причинно-следственную связь с обвинением в предыдущем стихе.
- source_word: אָלָה
  choice: проклятие
  rationale: В контексте нарушения законов и завета слово обозначает прежде всего судебное проклятие, хотя может означать и клятву.
- source_word: אָכְלָה
  choice: пожрало
  rationale: Сохраняет яркую метафору еврейского глагола «есть, пожирать» и образ разрушительного суда.
- source_word: אֶרֶץ
  choice: землю / земли
  rationale: В контексте всей главы речь, по-видимому, имеет всемирный масштаб; русское «земля» естественно допускает это значение.
- source_word: וַיֶּאְשְׁמוּ
  choice: несут свою вину
  rationale: Передаёт как виновность жителей, так и подразумеваемые последствия вины, не сводя значение только к наказанию.
- source_word: יֹשְׁבֵי בָהּ
  choice: живущие на ней
  rationale: Естественно передаёт причастную конструкцию и её продолжающийся характер.
- source_word: חָרוּ
  choice: опалены
  rationale: Передаёт образ воздействия жара или огня, не усиливая его до полного уничтожения.
- source_word: וְנִשְׁאַר
  choice: осталось
  rationale: Нифаль от שׁאר выражает пребывание малого остатка.
- source_word: אֱנוֹשׁ
  choice: людей
  rationale: Коллективное существительное обозначает смертных людей вообще; в современном русском «людей» точно и естественно передаёт этот смысл.
- source_word: מִזְעָר
  choice: совсем мало
  rationale: Передаёт не просто малое, а крайне малое число оставшихся людей.
theological_decisions:
- issue: Значение אָלָה в контексте суда
  choice: проклятие
  alternative: клятва; клятвенное проклятие
  rationale: Предыдущий стих говорит о нарушении законов и вечного завета, поэтому здесь вероятнее судебное последствие нарушения — проклятие. Лексическая неоднозначность сохранена в примечании.
- issue: Масштаб אֶרֶץ
  choice: земля в универсальном смысле
  alternative: страна, земля в локальном смысле
  rationale: Риторика Ис 24 имеет широкий, всемирный размах, однако еврейское слово само по себе допускает локальное понимание; это отмечено в примечании.
- issue: Значение אֱנוֹשׁ
  choice: люди как смертное человечество
  alternative: человек; смертные
  rationale: Еврейское слово стоит в единственном числе, но употреблено собирательно и подчёркивает человеческую смертность; русское «людей» ясно передаёт числовой смысл выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Метафора «проклятие пожрало» сохранена намеренно. Повтор «поэтому» воспроизводит композицию исходного текста; «живущие» и «жители» сохраняют близкий, но не механически одинаковый параллелизм.
