id: ISA.24.5
reference: Isaiah 24:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָ/אָ֥רֶץ חָנְפָ֖ה תַּ֣חַת יֹשְׁבֶ֑י/הָ כִּֽי עָבְר֤וּ תוֹרֹת֙ חָ֣לְפוּ חֹ֔ק הֵפֵ֖רוּ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/005.yaml
  text: The earth is defiled under its inhabitants[a], because they have transgressed laws, violated a statute[b], and broken the everlasting covenant.
translation:
  language: ru
  text: 'Земля осквернена из-за тех, кто живёт на ней: они преступили законы, нарушили установление[a] и нарушили вечный завет[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изменили установление». Еврейский глагол может означать изменение установленной нормы либо переход за её пределы.'
    reason: lexical_alternative
  - marker: b
    text: В этом стихе не уточняется, что именно названо «вечным заветом». Его связывают с заветом с Ноем или с установленным Богом непреходящим нравственным порядком для человечества.
    reason: alternative_reading
lexical_decisions:
- source_word: חָנְפָה
  choice: осквернена
  rationale: Передаёт нравственно-религиозное осквернение земли вследствие человеческого греха, не ограничивая смысл только ритуальной нечистотой.
- source_word: תַּחַת
  choice: из-за
  rationale: В данном сочетании предлог указывает на связь состояния земли с её жителями. Причинная передача естественна по-русски; буквальное «под» здесь звучало бы неясно.
- source_word: יֹשְׁבֶיהָ
  choice: тех, кто живёт на ней
  rationale: Естественно передаёт субстантивированное причастие с местоименным суффиксом и сохраняет образ живущих на земле людей.
- source_word: עָבְרוּ
  choice: преступили
  rationale: В сочетании с законами глагол означает переход установленной границы, то есть нарушение обязательных норм.
- source_word: תוֹרֹת
  choice: законы
  rationale: Сохраняет множественное число и в данном контексте ясно выражает обязательный характер установлений.
- source_word: חָלְפוּ
  choice: нарушили
  rationale: В параллельном ряду правовых и заветных проступков выражает нарушение установленной нормы. Возможное значение «изменили» сохранено в сноске.
- source_word: חֹק
  choice: установление
  rationale: Передаёт единичное или собирательное обозначение установленной нормы, не предполагая конкретного ранее названного закона.
- source_word: הֵפֵרוּ
  choice: нарушили
  rationale: Обычное и ясное русское сочетание «нарушить завет» точно передаёт идею несоблюдения и попрания заветных обязательств.
- source_word: בְּרִית עוֹלָם
  choice: вечный завет
  rationale: Передаёт непреходящий характер завета, не уточняя его вид там, где сам стих этого не делает.
theological_decisions:
- issue: К какому именно завету относится выражение «вечный завет»
  choice: Оставить общее выражение «вечный завет» без уточнения в основном тексте.
  alternative: Уточнить как завет с Ноем, установленный Богом нравственный порядок или общий завет Бога с человечеством.
  rationale: Еврейский текст не называет этот завет точнее; конкретизация устранила бы намеренно сохраняемую смысловую и богословскую открытость.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Причинное «из-за» предпочтено буквальному, но неестественному в данном контексте «под». Повтор «нарушили» отражает тесный параллелизм исходного текста; неоднозначность חָלְפוּ вынесена в сноску.
