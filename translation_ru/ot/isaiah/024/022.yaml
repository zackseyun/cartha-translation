base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/022.yaml
  text: And they will be gathered together like prisoners into a pit[a], and they will be shut up in a prison; and after many days they will be punished.
translation:
  language: ru
  text: Их соберут вместе, как узников, в яму и запрут в темнице; спустя много дней их призовут к ответу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посетят»; возможно также: «подвергнут наказанию». Еврейский глагол может означать, что на кого-либо обращают внимание, его посещают или призывают к ответу; здесь контекст указывает на суд.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֻסְּפוּ אֲסֵפָה
  choice: их соберут вместе
  rationale: Страдательная форма и однокоренное существительное создают усилительную конструкцию; по-русски её естественно передаёт «соберут вместе».
- source_word: אַסִּיר
  choice: как узников
  rationale: Формально единственное число здесь имеет собирательное значение при глаголе во множественном числе; «как узников» сохраняет сравнительный оттенок.
- source_word: עַל בּוֹר
  choice: в яму
  rationale: В контексте перемещения и заключения предлог עַל допускает направительное значение; винительный падеж «в яму» передаёт водворение в место заточения.
- source_word: וְסֻגְּרוּ עַל מַסְגֵּר
  choice: и запрут в темнице
  rationale: Страдательный סגר обозначает принудительное заключение, а מַסְגֵּר — место заточения. «Темница» сохраняет образ сурового заключения и остаётся понятной в возвышенной библейской речи.
- source_word: וּמֵרֹב יָמִים
  choice: а спустя много дней
  rationale: Оборот указывает на истечение длительного времени; «спустя много дней» точно и естественно передаёт временную последовательность.
- source_word: יִפָּקֵדוּ
  choice: призовут к ответу
  rationale: Nifal от פקד может обозначать посещение, обращение внимания или привлечение к ответу. В контексте суда «призовут к ответу» передаёт карательную направленность, не сводя многозначный глагол просто к наказанию.
theological_decisions:
- issue: Значение יִפָּקֵדוּ в контексте суда
  choice: призовут к ответу
  alternative: посетят; подвергнут наказанию
  rationale: Контекст всемирного суда делает нейтральное «посетят» недостаточно ясным, но сам глагол не обязательно называет уже совершённое наказание. Формулировка «призовут к ответу» сохраняет судебный смысл и подлинную семантическую широту; варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Темница» употреблена как общепонятное возвышенное слово; синтаксис сохраняет параллелизм двух сцен заключения и последующего суда.
