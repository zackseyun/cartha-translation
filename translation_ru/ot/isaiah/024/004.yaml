base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/004.yaml
  text: The earth mourns and withers[a]; the world wastes away and withers; the exalted people of the earth waste away.
translation:
  language: ru
  text: Скорбит и увядает земля; изнемогает и увядает мир; изнемогают возвышенные люди земли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знать земли изнемогает». Буквально еврейский текст говорит о «высоте» или «возвышении народа земли».'
    reason: Лексическая неоднозначность выражения מְרוֹם עַם הָאָרֶץ.
lexical_decisions:
- source_word: אָבְלָה
  choice: скорбит
  rationale: Глагол от אבל передаёт скорбь или плач. В поэтическом параллелизме земля олицетворена как скорбящая под судом; «скорбит» сохраняет эмоциональный образ, не сводя его к высыханию.
- source_word: נָבְלָה
  choice: увядает
  rationale: Глагол от נבל обозначает увядание, поблекновение и упадок. Повтор передан одинаково в обеих строках.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Хотя אֶרֶץ может означать отдельную страну или землю, параллель с תֵּבֵל и широкий контекст Ис 24 указывают здесь на землю в мировом масштабе.
- source_word: אֻמְלְלָה / אֻמְלָלוּ
  choice: изнемогает / изнемогают
  rationale: Формы от אמל описывают ослабление, истощение и увядание. «Изнемогает» отличает этот корень от נבל и естественно сочетается как с миром, так и с людьми.
- source_word: תֵּבֵל
  choice: мир
  rationale: Слово обозначает обитаемый или устроенный мир. «Мир» естественно передаёт его в параллели с «землёй».
- source_word: מְרוֹם עַם הָאָרֶץ
  choice: те, кто возвышен среди народа земли
  rationale: מְרוֹם буквально означает «высота» или «возвышение». Конструкция, вероятно, указывает на людей высокого положения, однако перевод сохраняет метафору и не сужает смысл до конкретного сословия.
theological_decisions:
- issue: Масштаб суда в הָאָרֶץ / תֵּבֵל
  choice: 'всемирный масштаб: «земля» и «мир»'
  alternative: 'местный масштаб: «страна» или «земля» как определённая территория'
  rationale: Сочетание הָאָרֶץ с תֵּבֵל и универсальная образность главы поддерживают всемирный горизонт, не требуя привнесения более поздних богословских построений.
- issue: Кого обозначает מְרוֹם עַם הָאָרֶץ
  choice: люди, возвышенные среди народа земли
  alternative: знать или вельможи земли; либо буквально «высота народа земли»
  rationale: Контекст позволяет понимать выражение как обозначение людей высокого общественного положения, но необычная метафора не уточняет их сословие. Поэтому основной текст остаётся понятным, а примечание сохраняет буквальную форму и лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим ритмом. Повтор «увядает» сохранён как значимый элемент еврейского параллелизма; разные формы «изнемогает / изнемогают» отражают повтор одного корня. Союзы сведены к минимуму, чтобы сохранить сжатость исходной поэзии.
