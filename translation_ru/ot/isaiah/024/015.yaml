  yaml_path: translation/ot/isaiah/024/015.yaml
  text: Therefore in the east give glory to Yahweh; in the coastlands of the sea[a], to the name of Yahweh, the God of Israel.
translation:
  language: ru
  text: Поэтому на востоке[a] воздавайте славу Яхве, а на морских побережьях — имени Яхве, Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в областях света»; значение еврейского слова неясно; его также понимают как «в огнях».'
