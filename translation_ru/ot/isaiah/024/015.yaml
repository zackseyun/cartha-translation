lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт обычное следственно-выводное значение сочетания и связывает призыв с предшествующим контекстом.
- source_word: בָּאֻרִים
  choice: на востоке
  rationale: Форма трудна и допускает разные толкования. Географическое значение хорошо согласуется с параллельным упоминанием морских побережий; иные лексические возможности сохранены в сноске.
- source_word: כַּבְּדוּ
  choice: воздавайте славу
  rationale: Передаёт императив множественного числа от כבד в значении признания и провозглашения Божьей славы; выражение естественно для современного литературного русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Сохраняет личное имя Бога, переданное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּאִיֵּי הַיָּם
  choice: на морских побережьях
  rationale: אִיִּים может обозначать как острова, так и приморские земли; выбранная формулировка естественно передаёт широкий географический смысл и морской образ.
- source_word: שֵׁם יְהוָה
  choice: имени Яхве
  rationale: Сохраняет прямое упоминание Божьего имени; опущенный во второй части глагол восполняется по параллелизму первой части.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Точно передаёт конструкцию, отождествляющую Яхве с Богом Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Текст прямо употребляет личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Толкование בָּאֻרִים
  choice: географическое значение «на востоке»
  alternative: «в областях света»; «в огнях»
  rationale: Параллелизм с морскими побережьями поддерживает географическое понимание, однако трудность еврейской формы не позволяет считать его бесспорным, поэтому альтернативы указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Эллипсис второй строки сохранён с помощью тире; личное имя передано как «Яхве».
