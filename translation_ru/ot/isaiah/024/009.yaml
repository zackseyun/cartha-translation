  text: They do not drink wine with a song[a]; strong drink is bitter to those who drink it.
translation:
  language: ru
  text: Не пьют вина под песни[a]; хмельной напиток горек для тех, кто его пьёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не будут пить вина с пением». Еврейский имперфект можно понимать как будущее время, а בַּשִּׁיר — также как «с пением» или «во время пения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשִּׁיר
  choice: под песни
  rationale: Предлог ב при שִׁיר выражает сопровождение или обстоятельство действия. Русское «под песни» естественно передаёт картину питья, сопровождаемого пением, и сохраняет поэтический характер строки.
- source_word: לֹא יִשְׁתּוּ
  choice: не пьют
  rationale: Имперфект в пророческой поэзии допускает настоящее или будущее понимание. Настоящее время живо описывает опустошённое состояние, не устраняя временной неоднозначности, которая отмечена в сноске.
- source_word: יַיִן
  choice: вино
  rationale: Обычное и точное соответствие еврейскому יַיִן.
- source_word: יֵמַר
  choice: горек
  rationale: Форма от מרר означает «быть горьким». Краткое именное сказуемое естественно по-русски и передаёт утрату удовольствия от напитка, не добавляя значения изменения или вкусового восприятия.
- source_word: שֵׁכָר
  choice: хмельной напиток
  rationale: שֵׁכָר обозначает опьяняющий напиток, отличный от обычного вина. «Хмельной напиток» понятно современному читателю и сохраняет лексическое различие между שֵׁכָר и יַיִן без слишком узкого отождествления с пивом.
- source_word: לְשֹׁתָיו
  choice: для тех, кто его пьёт
  rationale: Форма обозначает тех, кто пьёт данный напиток. Местоимение «его» естественно уточняет объект в русском языке.
