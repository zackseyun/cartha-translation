id: ISA.24.10
reference: Isaiah 24:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: נִשְׁבְּרָ֖ה קִרְיַת תֹּ֑הוּ סֻגַּ֥ר כָּל בַּ֖יִת מִ/בּֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/010.yaml
  text: The city of chaos is broken down[b][a]; every house is shut up so that none may enter.
translation:
  language: ru
  text: Разрушен город хаоса[a]; каждый дом заперт — войти невозможно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «город пустоты»; возможны также значения «город запустения» и «город беспорядка». Еврейское תֹּהוּ может обозначать хаос, пустоту или запустение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый дом закрыт от вхождения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבְּרָה
  choice: разрушен
  rationale: Нифаль перфекта שׁבר передаёт пассивное состояние как результат разрушения. В отношении города «разрушен» естественно выражает его разорение или обрушение.
- source_word: קִרְיַת
  choice: город
  rationale: Сопряжённая форма קִרְיָה означает «город» или «селение»; в пророческом контексте уместно общеупотребительное «город».
- source_word: תֹּהוּ
  choice: хаоса
  rationale: תֹּהוּ может обозначать хаос, пустоту, беспорядок или запустение. «Город хаоса» сохраняет абстрактность и многозначность пророческого образа, не сводя его только к физическим развалинам.
- source_word: סֻגַּר
  choice: заперт
  rationale: Пуаль перфекта סגר имеет пассивное значение «закрыт, заперт». «Заперт» ясно передаёт невозможность доступа внутрь дома.
- source_word: כָּל בַּיִת
  choice: каждый дом
  rationale: כָּל при существительном в единственном числе имеет распределительное значение. «Каждый дом» точно и естественно передаёт эту конструкцию.
- source_word: מִבּוֹא
  choice: войти невозможно
  rationale: Предлог מִן с инфинитивом בוא буквально даёт смысл «от вхождения» и указывает на воспрепятствование входу. Русское «войти невозможно» естественно выражает результат, не уточняя отсутствующий в еврейском тексте субъект.
