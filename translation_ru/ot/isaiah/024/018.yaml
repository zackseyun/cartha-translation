id: ISA.24.18
reference: Isaiah 24:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְֽ֠/הָיָה הַ/נָּ֞ס מִ/קּ֤וֹל הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עוֹלֶה֙ מִ/תּ֣וֹךְ הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אֲרֻבּ֤וֹת מִ/מָּרוֹם֙ נִפְתָּ֔חוּ וַֽ/יִּרְעֲשׁ֖וּ מ֥וֹסְדֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/018.yaml
  text: 'And it will happen: the one who flees from the sound of terror will fall into the pit[a], and the one who comes up from the midst of the pit will be caught in the trap; for the windows from on high are opened, and the foundations of the earth shake.'
translation:
  language: ru
  text: 'И случится: кто побежит от звука ужаса, тот упадёт в яму, а кто выберется из ямы, тот попадётся в ловушку. Ибо окна в вышине[a] отворились, и содрогнулись основания земли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небесные шлюзы». Буквально: «окна в вышине».'
    reason: 'Лексическая альтернатива: אֲרֻבּוֹת может обозначать окна или отверстия, а в данном образе — небесные шлюзы.'
lexical_decisions:
- source_word: וְהָיָה
  choice: И случится
  rationale: Передаёт вводную формулу как указание на последующее неизбежное событие; современно и вместе с тем сохраняет пророческую торжественность.
- source_word: הַנָּס מִקּוֹל הַפַּחַד
  choice: кто побежит от звука ужаса
  rationale: Субстантивированное причастие естественно передано русской обобщающей конструкцией «кто…». «Звук ужаса» сохраняет возможный слуховой образ קוֹל и не сводит его только к внутреннему страху.
- source_word: יִפֹּל אֶל הַפַּחַת
  choice: тот упадёт в яму
  rationale: פַּחַת обозначает яму или западню; «яма» ясно сохраняет конкретный образ и позволяет отличить её от следующей ловушки.
- source_word: וְהָעוֹלֶה מִתּוֹךְ הַפַּחַת
  choice: а кто выберется из ямы
  rationale: Естественно передаёт движение вверх и наружу, выраженное עלה и מִתּוֹךְ, без тяжеловесного буквального оборота «поднимающийся из середины».
- source_word: יִלָּכֵד בַּפָּח
  choice: тот попадётся в ловушку
  rationale: Передаёт пассивно-результативный смысл глагола и конкретный образ פַּח, отличая ловушку от ямы; полную звуковую игру еврейских פּחד / פּחת / פּח воспроизвести по-русски невозможно.
- source_word: אֲרֻבּוֹת מִמָּרוֹם
  choice: окна в вышине
  rationale: Сохраняет буквальный образ отверстий или окон наверху и не добавляет слово «небо», отсутствующее в данной фразе. Более образное толкование вынесено в сноску.
- source_word: נִפְתָּחוּ
  choice: отворились
  rationale: Совершенный вид отражает еврейский перфект и хорошо согласуется с последующим повествовательным действием; «отворились» уместно для окон и поддерживает возвышенный регистр.
- source_word: וַיִּרְעֲשׁוּ מוֹסְדֵי אָרֶץ
  choice: и содрогнулись основания земли
  rationale: «Содрогнулись» выразительно передаёт сильное колебание רָעַשׁ, а «земли» соответствует космическому масштабу контекста; «основания» точно сохраняют архитектурно-космический образ.
theological_decisions:
- issue: Объём значения אָרֶץ
  choice: земли
  alternative: страны
  rationale: Контекст Ис 24 изображает всеохватное, космическое потрясение, поэтому «земля» здесь вероятнее локального значения «страна».
- issue: Образ אֲרֻבּוֹת מִמָּרוֹם
  choice: окна в вышине
  alternative: небесные шлюзы
  rationale: Основной текст сохраняет формальную неопределённость образа и не уточняет, что именно изливается через эти отверстия. Традиционное понимание как небесных шлюзов отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Повтор «кто… тот…» делает цепь неизбежных бедствий ясной и сохраняет параллелизм. Сноска поставлена непосредственно после фразы, к которой относится.
