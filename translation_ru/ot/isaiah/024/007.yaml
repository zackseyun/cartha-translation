id: ISA.24.7
reference: Isaiah 24:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אָבַ֥ל תִּיר֖וֹשׁ אֻמְלְלָה גָ֑פֶן נֶאֶנְח֖וּ כָּל שִׂמְחֵי לֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/007.yaml
  text: The new wine mourns[a], the vine withers; all the glad of heart groan.
translation:
  language: ru
  text: Скорбит молодое вино[a], чахнет виноградная лоза; стонут все радостные сердцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «засыхает».'
    reason: Еврейский глагол обычно означает скорбь или плач, но в данном сельскохозяйственном образе может указывать на высыхание или увядание.
lexical_decisions:
- source_word: אָבַל
  choice: скорбит
  rationale: Основное значение глагола связано со скорбью и плачем. В отношении вина это поэтическое олицетворение, которое перекликается со стонами людей в конце стиха; возможное контекстуальное значение «засыхает» вынесено в сноску.
- source_word: תִּירוֹשׁ
  choice: молодое вино
  rationale: Слово обозначает свежее, молодое вино и отличается от более общего обозначения вина.
- source_word: אֻמְלְלָה
  choice: чахнет
  rationale: Глагол передаёт увядание, ослабление и истощение; «чахнет» естественно сочетается с виноградной лозой и сохраняет поэтический тон.
- source_word: גָפֶן
  choice: виноградная лоза
  rationale: Уточнение «виноградная» ясно передаёт конкретный образ и остаётся естественным для современного русского языка.
- source_word: נֶאֶנְחוּ
  choice: стонут
  rationale: Форма выражает слышимое проявление горя или страдания; «стонут» соответствует силе образа.
- source_word: כָּל
  choice: все
  rationale: Передаёт собирательное значение перед множественным обозначением людей.
- source_word: שִׂמְחֵי לֵב
  choice: радостные сердцем
  rationale: Сохраняет буквальный образ внутренней сердечной радости, не заменяя его более узким обозначением весельчаков.
