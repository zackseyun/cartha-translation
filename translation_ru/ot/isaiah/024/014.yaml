  text: Они возвышают голос и ликуют; величием Яхве они радостно восклицают с моря[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «с запада» или «из приморских земель»; еврейское выражение буквально означает «с моря» и в пророческой поэзии может иметь географический смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение имеет лёгкое смысловое выделение; повтор «они» во второй части сохраняет этот акцент без неестественного усиления.
- source_word: יִשְׂאוּ קוֹלָם
  choice: возвышают голос
  rationale: Передаёт устойчивое сочетание «поднять голос»; собирательное единственное число «голос» следует еврейской форме и естественно звучит по-русски.
- source_word: יָרֹנּוּ
  choice: ликуют
  rationale: Глагол обозначает радостный возглас или пение; «ликуют» сохраняет радостный смысл, не сводя его непременно к пению.
- source_word: בִּגְאוֹן
  choice: величию
  rationale: גאון здесь означает возвышенное величие. Дательный оборот передаёт направленность радостного отклика, не делая причинное значение предлога ב более определённым, чем в оригинале.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменено титулом.
- source_word: צָהֲלוּ
  choice: громко радуются
  rationale: Сочетание передаёт звучное, бурное проявление радости и отличает этот глагол от предшествующего «ликуют».
- source_word: מִיָּם
  choice: со стороны моря
  rationale: Сохраняет буквальный образ моря и одновременно допускает присущее выражению географическое значение — запад или приморские земли.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога, не подменяя его титулом.
- issue: Отношение ликования к величию Яхве
  choice: величию Яхве они громко радуются
  alternative: из-за величия Яхве; при величии Яхве
  rationale: Предлог ב допускает причинное и обстоятельственное понимание. Дательный оборот сохраняет поэтическую направленность отклика и не закрепляет только одно толкование.
translation_notes:
  register: Современный литературный русский с поэтическим параллелизмом. Синтаксис намеренно сохраняет некоторую необычность и смысловую открытость еврейской строки; «со стороны моря» звучит естественнее буквального «с моря», не устраняя географической неоднозначности.
