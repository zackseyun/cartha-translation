  text: שָׁבַת֙ מְשׂ֣וֹשׂ תֻּפִּ֔ים חָדַ֖ל שְׁא֣וֹן עַלִּיזִ֑ים שָׁבַ֖ת מְשׂ֥וֹשׂ כִּנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/008.yaml
  text: The mirth of tambourines has ceased[a]; the noise of the jubilant has stopped[b]; the mirth of the lyre has ceased.
translation:
  language: ru
  text: Умолкло веселье бубнов[a], стих шум ликующих, умолкло веселье лиры[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает ручной ударный инструмент — бубен или рамочный барабан.
    reason: lexical_alternative
  - marker: b
    text: Традиционно также переводится как «арфа», но речь, вероятнее всего, идёт о лире.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבַת
  choice: умолкло
  rationale: В данном музыкально-праздничном контексте глагол «умолкло» естественно передаёт прекращение звучания и сохраняет результативный оттенок формы перфекта. Один и тот же перевод употреблён в обоих вхождениях.
- source_word: מְשׂוֹשׂ
  choice: веселье
  rationale: Слово обозначает радость, ликование, праздничное веселье. Здесь «веселье» точнее общей «радости», поскольку речь идёт о прекратившемся праздничном звучании инструментов.
- source_word: תֻּפִּים
  choice: бубнов
  rationale: Слово обозначает ручные ударные инструменты типа бубна или рамочного барабана; «бубен» — понятное и традиционное русское наименование.
- source_word: חָדַל
  choice: стих
  rationale: Глагол означает «прекратиться, перестать». С существительным «шум» русское «стих» звучит естественно и позволяет отразить смену глагола по сравнению с повторённым שָׁבַת.
- source_word: שְׁאוֹן
  choice: шум
  rationale: Передаёт громкое звучание или гомон без добавочного оттенка беспорядка, который могло бы внести слово «гвалт».
- source_word: עַלִּיזִים
  choice: ликующих
  rationale: Субстантивированное определение обозначает людей, охваченных радостным ликованием. «Ликующих» сохраняет этот смысл, не приписывая им разгула или опьянения.
- source_word: כִּנּוֹר
  choice: лиры
  rationale: Древний струнный щипковый инструмент точнее определяется как лира, а не как арфа.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с поэтической, но понятной формулировкой. Сохранены трёхчастный параллелизм, повтор начального и конечного глагола в еврейском тексте и различие между שָׁבַת и חָדַל. Генитивные сочетания «веселье бубнов» и «веселье лиры» передают олицетворяющую метонимию оригинала, не устраняя её образность.
