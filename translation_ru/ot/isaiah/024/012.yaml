  revision_rationale: Убрано не имеющее отдельного соответствия «одно». Вторая часть перестроена в естественный русский оборот, передающий и пассивное сокрушение ворот, и итоговое разорение. Сноска заменена на нормативный и смыслово обоснованный альтернативный вариант.
