  yaml_path: translation/ot/isaiah/024/012.yaml
  text: Desolation is left in the city[a], and the gate is battered into ruins.
translation:
  language: ru
  text: В городе осталось запустение, а ворота сокрушены — от них остались руины.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשְׁאַר
  choice: осталось
  rationale: Нифаль глагола שׁאר обозначает то, что сохранилось или осталось после опустошения; безличная форма «осталось» естественно передаёт еврейскую конструкцию.
- source_word: בָּעִיר
  choice: в городе
  rationale: עִיר обычно означает «город», а предлог с артиклем прямо указывает на место.
- source_word: שַׁמָּה
  choice: одно запустение
  rationale: 'Существительное обозначает опустошение, запустение или разорение. Частица «одно» не имеет отдельного соответствия в еврейском, но в русском естественно подчёркивает результат: кроме запустения, ничего не осталось.'
- source_word: וּשְׁאִיָּה
  choice: обращены в руины
  rationale: Редкое существительное выражает разорение или разрушение; оно передано результативно, чтобы сохранить смысл и избежать неестественного буквального оборота.
- source_word: יֻכַּת
  choice: разбиты
  rationale: Хофаль от כתת означает быть разбитым, раздробленным или сокрушённым; «разбиты» ясно передаёт пассивное разрушительное действие.
- source_word: שָׁעַר
  choice: ворота
  rationale: Слово обозначает ворота, в данном контексте — городские. Русское множественное «ворота» является обычным соответствием единственному числу в еврейском.
