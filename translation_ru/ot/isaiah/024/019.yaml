lexical_decisions:
- source_word: רֹעָה הִתְרֹעֲעָה
  choice: разбита вдребезги
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает действие; выражение передаёт и разрушение, и интенсивность, естественно звуча по-русски.
- source_word: הָאָרֶץ / אֶרֶץ / אָרֶץ
  choice: земля
  rationale: Слово אֶרֶץ допускает значения «земля» и «страна»; широкий контекст суда в Ис 24 благоприятствует значению «земля». Троекратный повтор сохранён ради ритма и эмфазы оригинала.
- source_word: פּוֹר הִתְפּוֹרְרָה
  choice: расколота на части
  rationale: Усиленная конструкция описывает распад или раздробление. Этот вариант сохраняет отличие от первого высказывания и ясно передаёт разрушение целого.
- source_word: מוֹט הִתְמוֹטְטָה
  choice: сильно сотрясается
  rationale: Корень מוט обозначает колебание, шатание или сотрясение; наречие «сильно» передаёт усиление абсолютным инфинитивом, не добавляя отсутствующей в тексте причины движения.
