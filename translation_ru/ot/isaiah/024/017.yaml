base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/017.yaml
  text: Terror and the pit and the snare are upon you[a], inhabitant of the earth.
translation:
  language: ru
  text: Ужас, яма и западня — над тобой, житель земли!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּחַד
  choice: ужас
  rationale: Существительное означает страх или ужас; в тройной формуле суда «ужас» передаёт не только внутреннее чувство, но и надвигающееся бедствие.
- source_word: פַחַת
  choice: яма
  rationale: Слово обозначает ловчую яму. Краткое «яма» естественно по-русски и сохраняет отличие от следующей западни.
- source_word: פָח
  choice: западня
  rationale: Слово обозначает силок или ловушку; «западня» хорошо передаёт образ средства поимки и звучит выразительно в поэтической триаде.
- source_word: עָלֶיךָ
  choice: для тебя
  rationale: Буквально «на тебя/над тобой»; в безглагольной угрозе русское «для тебя» естественно выражает, что перечисленные бедствия уготованы адресату, не вводя явно будущего времени.
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: житель земли
  rationale: Причастие в единственном числе употреблено как обращение. «Житель земли» сохраняет единственное число и широкий масштаб контекста Ис 24.
theological_decisions:
- issue: Объём значения הָאָרֶץ
  choice: земля в значении всего мира
  alternative: страна
  rationale: Контекст Ис 24 описывает всеохватный суд; «земля» сохраняет возможный космический охват, не добавляя более узкой локализации.
translation_notes:
  register: Современный литературный русский с краткой, торжественной и угрожающей поэтической формой. Сохранена трёхчастная формула; еврейскую аллитерацию полностью воспроизвести по-русски невозможно.
