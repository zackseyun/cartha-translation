  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הִנֵּ֧ה יְהוָ֛ה בּוֹקֵ֥ק הָ/אָ֖רֶץ וּ/בֽוֹלְקָ֑/הּ וְ/עִוָּ֣ה פָנֶ֔י/הָ וְ/הֵפִ֖יץ יֹשְׁבֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/001.yaml
  text: Behold[a], Yahweh is emptying the earth and laying it waste[b]; he will distort its surface and scatter its inhabitants.
translation:
  language: ru
  text: Вот, Яхве опустошает землю[a] и разоряет её; Он исказит её поверхность[b] и рассеет её жителей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страну». Еврейское אֶרֶץ может означать как землю вообще, так и отдельную страну; широкий контекст здесь указывает на всеобщий масштаб.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «её лицо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет торжественный призыв к вниманию и вводит пророческое возвещение естественным для современного русского языка образом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное Божье имя, а не заменяет его титулом.
- source_word: בּוֹקֵק
  choice: опустошает
  rationale: Причастная форма изображает действие как уже предстоящее взору или начинающееся; глагол сохраняет основной образ лишения полноты и населения.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Слово может обозначать и землю как мир, и отдельную страну; широкий контекст Ис 24 поддерживает универсальное значение.
- source_word: וּבֹלְקָהּ
  choice: и разоряет её
  rationale: Редкий глагол усиливает образ опустошения. Еврейскую игру созвучных корней точно воспроизвести по-русски невозможно, но пара «опустошает… и разоряет» сохраняет усилительный параллелизм.
- source_word: וְעִוָּה
  choice: исказит
  rationale: Передаёт значение искривления или изменения облика, не сводя образ к конкретному виду разрушения.
- source_word: פָנֶיהָ
  choice: её поверхность
  rationale: Буквально «её лицо»; применительно к земле естественное русское соответствие — «поверхность».
- source_word: וְהֵפִיץ
  choice: и рассеет
  rationale: Передаёт насильственное разобщение и удаление людей из мест их проживания.
- source_word: יֹשְׁבֶיהָ
  choice: её жителей
  rationale: Естественно передаёт субстантивированное причастие со значением всех обитающих на земле.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не добавляет конфессионального толкования.
- issue: Масштаб слова הָאָרֶץ
  choice: земля в универсальном смысле
  alternative: страна, земля как отдельная территория
  rationale: Само слово допускает оба значения, поэтому альтернатива отмечена в сноске; широкий контекст главы склоняет к универсальному масштабу суда.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Начальное «Вот» сохраняет дейктическую силу הִנֵּה. Настоящее время первых глаголов передаёт наглядность причастной конструкции, а будущее время последующих форм — развитие возвещаемого суда. Местоимение «Он» после точки с запятой написано с прописной буквы как начало самостоятельной части, без введения дополнительных почтительных написаний.
