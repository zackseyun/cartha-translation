  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִפְקֹ֧ד יְהוָ֛ה עַל צְבָ֥א הַ/מָּר֖וֹם בַּ/מָּר֑וֹם וְ/עַל מַלְכֵ֥י הָ/אֲדָמָ֖ה עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/021.yaml
  text: And on that day the LORD will punish the host of the height in the height, and the kings of the earth on the earth.
translation:
  language: ru
  text: 'И будет в тот день: ГОСПОДЬ покарает воинство вышины[a] — в вышине, и царей земли — на земле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Воинство вышины» может означать небесное воинство, небесные светила или сверхъестественные силы; еврейский текст не уточняет.
    reason: Сохраняет реальную лексическую и богословскую неоднозначность выражения צבא המרום.
lexical_decisions:
- source_word: יִפְקֹד
  choice: покарает
  rationale: В данном контексте глагол פקד обозначает Божье взыскание и наказание; «покарает» естественно передаёт судебный смысл, не добавляя способа кары.
- source_word: צְבָא הַמָּרוֹם
  choice: воинство вышины
  rationale: 'Буквально: «воинство высоты/вышины». Формулировка сохраняет неоднозначность: речь может идти о небесном воинстве, небесных светилах или сверхъестественных властях.'
- source_word: בַּמָּרוֹם
  choice: в вышине
  rationale: 'Сохранён намеренный параллелизм с «на земле»: воинство вышины — в вышине, цари земли — на земле.'
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона прописными буквами.
- source_word: הָאֲדָמָה
  choice: земли / земле
  rationale: Передаёт и человеческих земных правителей, и место их суда, сохраняя повтор исходного текста.
theological_decisions:
- issue: Кого обозначает «воинство вышины»
  choice: Не уточнять в основном тексте; сохранить буквальный образ и пояснить неоднозначность в сноске.
  alternative: «небесное воинство» или «небесные силы»
  rationale: Еврейское выражение допускает несколько референтов, а контекст говорит о суде над силами вышины без их однозначного отождествления.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Парная конструкция «в вышине / на земле» воспроизводит поэтический параллелизм и повтор оригинала.
