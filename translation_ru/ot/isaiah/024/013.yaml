  yaml_path: translation/ot/isaiah/024/013.yaml
  text: 'For so it will be in the midst of the earth[a], among the peoples: like the beating of an olive tree[b], like gleanings when the grape harvest is finished.'
translation:
  language: ru
  text: 'Ибо так будет посреди земли[a], среди народов: как после обивания оливкового дерева, как оставшиеся ягоды после сбора винограда.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посреди страны». Еврейское הָאָרֶץ может означать как землю вообще, так и отдельную страну; упоминание народов поддерживает более широкий смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה יִהְיֶה
  choice: Ибо так будет
  rationale: כִּי связывает стих с предшествующим контекстом как пояснение, כֹה указывает на образ действия, а יִהְיֶה выражает будущее; краткая русская формула сохраняет эту связь.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: посреди земли[a]
  rationale: קֶרֶב означает внутренность или середину, а אֶרֶץ допускает значения «земля» и «страна». В сочетании с «среди народов» уместен широкий смысл «земля», при этом неоднозначность отмечена в сноске.
- source_word: בְּתוֹךְ הָעַמִּים
  choice: среди народов
  rationale: עַמִּים обозначает народы как множественные человеческие общности; «народы» не навязывает современного политического смысла государств.
- source_word: כְּנֹקֶף זַיִת
  choice: как при обивании оливкового дерева
  rationale: נֹקֶף здесь обозначает ударение по дереву для сбивания оливок. «Обивание» точно передаёт древний способ сбора и сохраняет сам образ, не добавляя прямо не названное число оставшихся плодов.
- source_word: כְּעוֹלֵלֹת
  choice: как при подборе оставшихся гроздей
  rationale: עוֹלֵלֹת относится к остаткам винограда, подбираемым после основного сбора. Формулировка передаёт и скудный остаток, и действие подбирания понятным современным языком.
- source_word: אִם כָּלָה בָצִיר
  choice: когда сбор винограда окончен
  rationale: В данном сравнении אִם имеет временное значение «когда», а בָצִיר обозначает именно сбор винограда, не жатву зерна вообще.
