base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/002.yaml
  text: 'And it shall be: as with the people[a], so with the priest; as with the servant, so with his master; as with the female servant, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the creditor, so with the one indebted to him.'
translation:
  language: ru
  text: 'И будет: что с народом, то и со священником; что с рабом, то и с его господином; что с рабыней, то и с её госпожой; что с покупателем, то и с продавцом; что с заимодавцем, то и с заёмщиком; что с кредитором, то и с его должником.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Кратко передаёт пророческую формулу, вводящую будущее положение дел, без излишней архаизации.
- source_word: כָעָם כַּכֹּהֵן
  choice: что с народом, то и со священником
  rationale: Конструкция «что с..., то и с...» естественно по-русски выражает одинаковую участь сопоставляемых групп и сохраняет параллелизм.
- source_word: כַּעֶבֶד כַּאדֹנָיו
  choice: что с рабом, то и с его господином
  rationale: В перечне общественных положений עֶבֶד обозначает зависимого раба; «господин» передаёт человеческого хозяина и сохраняет резкий социальный контраст.
- source_word: כַּשִּׁפְחָה כַּגְּבִרְתָּהּ
  choice: что с рабыней, то и с её госпожой
  rationale: שִׁפְחָה прямо обозначает рабыню, а גְּבִירָה — её хозяйку или госпожу; выбранная пара ясна и симметрична.
- source_word: כַּקּוֹנֶה כַּמּוֹכֵר
  choice: что с покупателем, то и с продавцом
  rationale: Субстантивированные причастия переданы обычными русскими названиями экономических ролей.
- source_word: כַּמַּלְוֶה כַּלֹּוֶה
  choice: что с заимодавцем, то и с заёмщиком
  rationale: Сохраняется различие между тем, кто предоставляет заём, и тем, кто берёт взаймы; «заимодавец» уместен в dignified литературном регистре.
- source_word: כַּנֹּשֶׁה כַּאֲשֶׁר נֹשֶׁא בוֹ
  choice: что с кредитором, то и с тем, кому он дал в долг
  rationale: Первая форма обозначает кредитора, а описательное второе звено буквально указывает на человека, по отношению к которому он выступает заимодавцем. Такая передача сохраняет отличие формулировки от предыдущей пары.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным пророческим зачином. Повтор «что с..., то и с...» воспроизводит ритмический ряд и подчёркивает, что бедствие уравняет людей разных общественных положений. Термины «раб» и «рабыня» не смягчены до «слуги», поскольку здесь существен именно зависимый социальный статус.
