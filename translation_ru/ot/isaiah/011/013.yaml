base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/013.yaml
  text: The jealousy of Ephraim will depart[a], and the adversaries of Judah will be cut off; Ephraim will not be jealous of Judah[b], and Judah will not harass Ephraim.
translation:
  language: ru
  text: И исчезнет зависть Ефрема[a], и враги Иуды будут истреблены; Ефрем не будет завидовать Иуде, а Иуда не будет враждовать[b] с Ефремом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ревность Ефрема». Еврейское слово может обозначать зависть либо ревнивое соперничество.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будет притеснять Ефрема»; еврейский глагол может выражать враждебность, преследование или притеснение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרָה
  choice: и исчезнет
  rationale: Глагол סור здесь описывает устранение или прекращение зависти. «Исчезнет» естественно по-русски и сохраняет образ того, что зависть уходит.
- source_word: קִנְאַת
  choice: зависть
  rationale: קִנְאָה может означать ревность, зависть или рвение; в контексте соперничества Ефрема и Иуды «зависть» наиболее ясно передаёт отрицательное межплеменное чувство, не устраняя возможный оттенок ревнивого соперничества, отмеченный в сноске.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено собственное имя, которым в контексте обозначена также северная общность; поясняющая замена на «северное царство» не вводится.
- source_word: וְצֹרְרֵי יְהוּדָה
  choice: и враги Иуды
  rationale: Причастная форма от צרר обозначает враждебно настроенных противников. «Враги» естественно и ёмко передаёт смысл без излишнего уточнения характера вражды.
- source_word: יִכָּרֵתוּ
  choice: будут истреблены
  rationale: Нифаль от כרת буквально выражает отсечение, а в отношении людей — устранение или истребление. Русское «будут истреблены» передаёт силу выражения яснее, чем буквальное «будут отсечены».
- source_word: לֹא יְקַנֵּא אֶת יְהוּדָה
  choice: не будет завидовать Иуде
  rationale: Глагол קנא продолжает тему завистливого соперничества из первой строки; повтор корня передан повтором «зависть / завидовать».
- source_word: לֹא יָצֹר אֶת אֶפְרָיִם
  choice: не будет враждовать с Ефремом
  rationale: Глагол передаёт активную враждебность и может также пониматься как притеснение или преследование. «Враждовать» сохраняет широкое значение и хорошо соответствует взаимному противостоянию в параллелизме.
- source_word: וִיהוּדָה
  choice: а Иуда
  rationale: Противительно-сопоставительное «а» естественно оформляет сбалансированный параллелизм двух сторон в русском языке.
theological_decisions:
- issue: Референты Ефрема и Иуды
  choice: Сохранить исторические имена «Ефрем» и «Иуда».
  alternative: Развернуть как «северное царство» и «южное царство» либо «Израиль» и «Иуда».
  rationale: Еврейский текст непосредственно называет Ефрема и Иуду. Сохранение имён передаёт поэтическую и историческую конкретность и не навязывает поясняющую интерпретацию.
- issue: Характер отношений между Ефремом и Иудой
  choice: Передать параллель как прекращение зависти Ефрема и вражды Иуды.
  alternative: Уточнить действия Иуды как притеснение, преследование или нападение.
  rationale: Текст рисует взаимную вражду несимметричными словами. Перевод сохраняет эту напряжённость, не сводя оба полустишия к одному понятию и не ограничивая второе военными действиями.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранён поэтический параллелизм и повтор корня «зависть / завидовать»; синтаксис сделан ясным для обычного читателя.
