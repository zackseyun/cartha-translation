base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/003.yaml
  text: And his delight shall be in the fear of Yahweh[a], and he shall not judge by what his eyes see, nor decide by what his ears hear.
translation:
  language: ru
  text: И отрадой ему будет страх перед Яхве[a]. Он будет судить не по тому, что видят его глаза, и выносить решение не по тому, что слышат его уши.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «его обоняние (или восприятие) будет в страхе перед Яхве». Еврейское выражение трудно для истолкования и, возможно, указывает на необычайно тонкую проницательность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרִיחוֹ
  choice: И отрадой ему будет
  rationale: Форма от корня ריח буквально связана с обонянием, но здесь трудна для прямой передачи. В контексте наделённого Духом правителя она, вероятно, выражает внутреннюю расположенность или тонкое восприятие. «Отрадой ему будет» естественно передаёт смысл, не устраняя буквальную возможность, отмеченную в сноске.
- source_word: בְּיִרְאַת
  choice: страх перед
  rationale: יִרְאָה обозначает страх и благоговейное почтение перед Богом. Формулировка сохраняет вес понятия «страх», не сводя его лишь к уважению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: לְמַרְאֵה עֵינָיו
  choice: по тому, что видят его глаза
  rationale: Сохраняется конкретный образ зрения и мысль о том, что суд не основывается лишь на видимой внешности.
- source_word: יִשְׁפּוֹט
  choice: будет судить
  rationale: Прямая передача судебного и правительственного значения שׁפט, соответствующая параллельной строке.
- source_word: לְמִשְׁמַע אָזְנָיו
  choice: по тому, что слышат его уши
  rationale: Формулировка сохраняет параллелизм зрения и слуха и не сужает значение до одного лишь «слуха» или молвы.
- source_word: יוֹכִיחַ
  choice: выносить решение
  rationale: В параллели с «судить» глагол имеет судебное значение — решать дело, разбирать спор или выносить вердикт. Выбор сохраняет отличие второго глагола, не придавая ему узкого смысла «обличать».
theological_decisions:
- issue: Проницательность грядущего правителя из дома Давида
  choice: Начальная строка передаёт его глубокую расположенность к страху перед Яхве, а следующие строки — суд, не ограниченный внешними впечатлениями и услышанными сообщениями.
  alternative: 'Начальная строка может непосредственно изображать необычайно острое восприятие: «он будет обонять/распознавать в страхе перед Яхве».'
  rationale: Контекст говорит о правителе, на котором пребывает Дух Яхве. Перевод не определяет механизм его проницательности и сохраняет лексическую трудность в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранён сенсорный параллелизм «глаза — уши»; «отрадой» выбрано как естественное, но не разговорное выражение внутренней расположенности.
