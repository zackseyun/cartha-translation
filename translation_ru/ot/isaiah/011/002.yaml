  text: וְ/נָחָ֥ה עָלָ֖י/ו ר֣וּחַ יְהוָ֑ה ר֧וּחַ חָכְמָ֣ה וּ/בִינָ֗ה ר֤וּחַ עֵצָה֙ וּ/גְבוּרָ֔ה ר֥וּחַ דַּ֖עַת וְ/יִרְאַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/002.yaml
  text: 'And the Spirit of Yahweh will rest on him: a spirit of wisdom and understanding[a], a spirit of counsel and might[c][b], a spirit of knowledge and the fear of Yahweh.'
translation:
  language: ru
  text: 'И будет покоиться на нём Дух Яхве[a][b]: дух мудрости и понимания, дух совета и силы, дух знания и страха перед Яхве[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Яхве» передаёт еврейское личное имя Бога יהוה (ЙХВХ), которое во многих переводах заменяется словом «Господь».
    reason: alternative_reading
  - marker: b
    text: 'После слов «Дух Яхве» еврейский текст ещё трижды повторяет слово «дух», подчёркивая качества или действия одного Духа: мудрость и понимание, совет и силу, знание и страх перед Яхве.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «благоговения перед Яхве». Еврейское выражение подразумевает почтительный трепет и не означает одного лишь ужаса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחָה
  choice: будет покоиться
  rationale: Глагол נוח выражает пребывание в покое, устойчивое присутствие. Такая форма естественно передаёт пророческую перспективу и длительность действия.
- source_word: עָלָיו
  choice: на нём
  rationale: Прямое и естественное соответствие предлогу עַל с местоименным суффиксом.
- source_word: רוּחַ יְהוָה
  choice: Дух Яхве
  rationale: В контексте наделения будущего правителя речь идёт о Божьем Духе. Личное имя יהוה передано транслитерацией «Яхве», а прописная буква в слове «Дух» указывает на референта.
- source_word: רוּחַ חָכְמָה וּבִינָה
  choice: дух мудрости и понимания
  rationale: Повтор слова רוּחַ сохранён. «Понимание» прямо и современно передаёт בינה, не исключая оттенка проницательности.
- source_word: רוּחַ עֵצָה וּגְבוּרָה
  choice: дух совета и силы
  rationale: עצה в царском контексте обозначает способность вырабатывать мудрое решение, а גבורה — силу или могущество. «Сила» звучит естественно и сохраняет широкий смысл слова.
- source_word: רוּחַ דַּעַת וְיִרְאַת יְהוָה
  choice: дух знания и страха перед Яхве
  rationale: «Знание» является прямым соответствием דעת. Слово «страх» сохраняет лексическую силу יראה и присущее выражению напряжение между страхом и благоговением.
theological_decisions:
- issue: Обозначают ли повторяющиеся сочетания с רוּחַ несколько духов или свойства и действия одного Духа Яхве
  choice: Сохранить три повторяющиеся описательные формулы как характеристики Духа Яхве
  alternative: Понимать перечень как перечисление отдельных духовных даров или духов
  rationale: Синтаксис допускает понимание последующих формул как приложений к «Духу Яхве». Перевод сохраняет повтор исходного текста, но не превращает толкование о числе духов в явное утверждение.
- issue: Передача выражения יִרְאַת יְהוָה
  choice: страх перед Яхве
  alternative: благоговение перед Яхве
  rationale: «Страх» сохраняет основное значение יראה и богословскую насыщенность библейской формулы; примечание поясняет, что речь не сводится к ужасу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Синтаксический параллелизм и тройное повторение слова «дух» сохранены; архаизмы вроде «почиет» и конфессионально привычная замена имени Яхве титулом «Господь» не использованы.
