base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/005.yaml
  text: Righteousness will be the belt of his waist[b][a], and faithfulness the belt of his loins.
translation:
  language: ru
  text: Праведность[a] будет поясом на его талии, и верность[b] — поясом на его бёдрах.
  philosophy: optimal-equivalence
  footnotes:
