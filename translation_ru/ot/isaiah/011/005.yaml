lexical_decisions:
- source_word: וְהָיָה
  choice: будет
  rationale: В пророческом контексте форма с союзом выражает будущее; начальное «и» естественно передано связью между частями контекста и не требуется в отдельно цитируемом русском стихе.
- source_word: צֶדֶק
  choice: праведность
  rationale: Слово обозначает праведность или справедливость; здесь оно характеризует нравственное качество обещанного правителя, при этом допустимая альтернатива отмечена в сноске.
- source_word: אֵזוֹר
  choice: пояс
  rationale: Конкретный образ предмета, которым опоясываются; современное и ясное русское соответствие, сохраняющее метафору и повтор оригинала.
- source_word: מָתְנָיו
  choice: на его бёдрах
  rationale: Слово указывает на область талии и бёдер. Такое выражение естественно сочетается с образом пояса и позволяет отличить его от второго анатомического термина.
- source_word: וְהָאֱמוּנָה
  choice: и верность
  rationale: אֱמוּנָה здесь означает надёжность, постоянство и верность как качество правителя; «верность» естественно передаёт этот смысл без внесения значения субъективной веры.
- source_word: חֲלָצָיו
  choice: на его чреслах
  rationale: Термин обозначает чресла, пояснично-бедренную область. «Чресла» сохраняет телесную образность и поэтическое различие между параллельными выражениями, хотя имеет возвышенную окраску.
theological_decisions:
- issue: Передача двух качеств обещанного правителя в мессианском пророчестве
  choice: «праведность» и «верность» как качества его характера
  alternative: «справедливость» и «надёжность»
  rationale: Перевод сохраняет нравственную характеристику правителя и образ опоясывания, не добавляя позднейших догматических формулировок и не сводя многозначность צֶדֶק к одному лишь судебному смыслу.
translation_notes:
  register: Современный литературный русский с поэтической возвышенностью. Слово «чресла» употреблено намеренно ради различения מָתְנַיִם и חֲלָצַיִם и сохранения параллелизма; остальная лексика общеупотребительна.
