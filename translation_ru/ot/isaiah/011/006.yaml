revisions:
- from: И волк будет жить рядом с ягнёнком[a], и леопард будет лежать рядом с козлёнком; и телёнок, молодой лев и откормленный скот будут вместе, и малый ребёнок поведёт их.
  to: И волк будет жить с ягнёнком[a], и леопард будет лежать с козлёнком; телёнок, молодой лев и откормленное животное будут вместе, и маленький мальчик поведёт их.
  rationale: Перевод приведён в соответствие с семантикой עִם («с»), не привнося значение «рядом». Исправлено неестественное «малый ребёнок» с утратой мужского рода; уточнение вида для מְרִיא не добавляется. Пророческий образ оставлен без интерпретации как буквальный либо символический.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:31:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Нужно устранить добавленное в первых двух параллельных строках пространственное значение «рядом»: עִם означает прежде всего «с». Для נַעַר קָטֹן естественнее и точнее сохранить мужской род как «маленький мальчик». מְרִיא не требует уточнения «телёнок»; «откормленное животное» сохраняет родовую неопределённость еврейского слова.'
  naturalness: «Малый ребёнок» в современном литературном русском звучит неестественно и стилистически смешивает архаизирующее определение с нейтральным словом. «Маленький мальчик» естественно, ясно и соответствует поэтическому регистру. «Волк будет жить с ягнёнком» передаёт намеренно необычное мирное сосуществование без лишнего пространственного уточнения.
  terminology: Названия животных в целом удачны. «Откормленное животное» точнее, чем коллективное «откормленный скот», поскольку מְרִיא обозначает отдельное упитанное/откормленное животное и не называет его вид. Сноска об альтернативном значении גור сохранена, но согласована с основным переводом.
  issues:
  - severity: medium
    issue: «Рядом с» в первых двух строках добавляет пространственное ограничение.
    rationale: Еврейское עִם означает «с, вместе с»; контекст предполагает мирное соседство, но перевод не должен заменять отношение совместности более узким «рядом с».
  - severity: medium
    issue: «Малый ребёнок» неестественно и не передаёт мужской род נַעַר.
    rationale: נַעַר в сочетании с קָטֹן здесь естественно передать как «маленький мальчик»; это сохраняет род и современную литературную норму.
  - severity: low
    issue: «Откормленный скот» — коллективное обозначение вместо отдельного животного.
    rationale: מְרִיא стоит в единственном числе и обозначает откормленное животное; вид животного в слове не указан.
