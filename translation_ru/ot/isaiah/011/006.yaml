source:
  edition: WLC
  text: וְ/גָ֤ר זְאֵב֙ עִם כֶּ֔בֶשׂ וְ/נָמֵ֖ר עִם גְּדִ֣י יִרְבָּ֑ץ וְ/עֵ֨גֶל וּ/כְפִ֤יר וּ/מְרִיא֙ יַחְדָּ֔ו וְ/נַ֥עַר קָטֹ֖ן נֹהֵ֥ג בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/006.yaml
  text: And the wolf will dwell with the lamb[a], and the leopard will lie down with the young goat; and the calf and the young lion and the fattened calf will be together[d][c][b], and a little boy will lead them.
translation:
  language: ru
  text: И волк будет жить с ягнёнком[a], и леопард будет лежать с козлёнком; телёнок, молодой лев и откормленное животное будут вместе, и маленький мальчик поведёт их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «волк будет обитать как пришелец у ягнёнка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָר
  choice: будет жить рядом
  rationale: Глагол גור в qal означает жить или пребывать, нередко как пришелец. В сочетании с עִם выражение «будет жить рядом» естественно передаёт мирное соседство, не сводя смысл к краткому посещению.
- source_word: זְאֵב
  choice: волк
  rationale: Обычное современное соответствие названию животного.
- source_word: עִם
  choice: рядом с
  rationale: Предлог обозначает совместность или близость. В первых двух параллельных строках «рядом с» естественно подчёркивает безопасное соседство хищника и добычи.
- source_word: כֶּבֶשׂ
  choice: ягнёнок
  rationale: В данном поэтическом противопоставлении уязвимой жертвы хищнику «ягнёнок» точнее и выразительнее общего «овца».
- source_word: וְנָמֵר
  choice: леопард
  rationale: Стандартное соответствие еврейскому названию животного.
- source_word: גְּדִי
  choice: козлёнок
  rationale: Слово обозначает детёныша козы; «козлёнок» ясно и естественно для современного русского читателя.
- source_word: יִרְבָּץ
  choice: будет лежать
  rationale: רבץ описывает лежание или отдых животного. Этот выбор сохраняет мирный образ и не привносит оттенок хищной засады.
- source_word: וְעֵגֶל
  choice: телёнок
  rationale: Обычное соответствие названию молодого крупного рогатого скота.
- source_word: וּכְפִיר
  choice: молодой лев
  rationale: כפיר означает молодого льва; выбранное выражение сохраняет достоинство пророческой поэзии и отличается от более узкого «львёнок».
- source_word: וּמְרִיא
  choice: откормленный скот
  rationale: מְרִיא обозначает откормленное, упитанное животное, вероятно предназначенное на убой. Род животного здесь прямо не назван, поэтому «скот» не вносит необязательного уточнения «телёнок».
- source_word: יַחְדָּו
  choice: будут вместе
  rationale: Наречие означает «вместе»; добавленная связка нужна для естественного русского безглагольного ряда.
- source_word: וְנַעַר קָטֹן
  choice: малый ребёнок
  rationale: נַעַר может обозначать мальчика, юношу или ребёнка, а קָטֹן подчёркивает малый возраст или размер. «Малый ребёнок» сохраняет семантическую широту и возвышенный, но понятный регистр.
- source_word: נֹהֵג בָּם
  choice: поведёт их
  rationale: נהג означает вести или погонять животных. «Поведёт их» естественно передаёт образ ребёнка, управляющего всей группой, без усиления принуждения.
theological_decisions:
- issue: Характер образов мирного царства
  choice: Передать пары животных непосредственно как пророческо-поэтические образы, не объясняя их в основном тексте.
  alternative: Истолковать их либо как строго буквальное эсхатологическое изменение животного мира, либо исключительно как метафору общественно-политического мира.
  rationale: Еврейский текст даёт конкретные образы животных, но сам стих не разрешает вопрос об их буквальном или символическом характере; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Синтаксический параллелизм оригинала сохранён; неясности не устранены конфессиональным толкованием. Единственная сноска отмечает смысловой диапазон גור и сочетания עִם.
