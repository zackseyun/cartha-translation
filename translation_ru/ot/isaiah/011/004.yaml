source:
  edition: WLC
  text: וְ/שָׁפַ֤ט בְּ/צֶ֨דֶק֙ דַּלִּ֔ים וְ/הוֹכִ֥יחַ בְּ/מִישׁ֖וֹר לְ/עַנְוֵי אָ֑רֶץ וְ/הִֽכָּה אֶ֨רֶץ֙ בְּ/שֵׁ֣בֶט פִּ֔י/ו וּ/בְ/ר֥וּחַ שְׂפָתָ֖י/ו יָמִ֥ית רָשָֽׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/004.yaml
  text: but he will judge the poor with righteousness[a], and decide with equity for the humble of the earth; he will strike the earth with the rod of his mouth[e][d][c][b], and with the breath of his lips he will put the wicked to death.
translation:
  language: ru
  text: 'Но бедных Он будет судить по правде[a][b]

    и по справедливости решать дела кротких на земле[c];

    Он поразит землю[d] жезлом Своих уст

    и дыханием Своих губ предаст смерти нечестивого[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И бедных Он будет судить». Союз может иметь простое соединительное значение «и», но «но» подчёркивает контраст со ст. 3: Он судит не по тому, что видят глаза.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по справедливости»; еврейское слово означает как праведность, так и справедливость.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «смиренных земли» либо «угнетённых земли». Еврейское слово может указывать на кротость и смирение или на бедственное, угнетённое положение.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «страну».'
    reason: lexical_alternative
  - marker: e
    text: Еврейское единственное число можно понимать обобщённо — «нечестивых», — или как указание на отдельного нечестивца.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁפַט
  choice: Но … Он будет судить
  rationale: 'Глагол сохраняет судебный и царский смысл. Союз וְ допускает простое «и», однако «но» естественно передаёт контраст со ст. 3: Он судит не по внешнему впечатлению, а по правде.'
- source_word: בְּצֶדֶק
  choice: по правде
  rationale: צֶדֶק охватывает праведность и справедливость. «По правде» звучит естественно по-русски в контексте суда и не сводит значение только к юридической беспристрастности.
- source_word: דַּלִּים
  choice: бедных
  rationale: דַּלִּים обозначает бедных, слабых или лишённых общественного влияния; «бедных» ясно выражает основное социальное значение в данном контексте.
- source_word: וְהוֹכִיחַ
  choice: решать дела
  rationale: В породе хифиль יכח в судебном контексте означает выносить решение или рассуживать спор. Оборот «решать дела» передаёт судебную функцию и не сужает смысл до словесного обличения.
- source_word: בְּמִישׁוֹר
  choice: по справедливости
  rationale: מִישׁוֹר буквально связано с прямотой и ровностью, а переносно — с честностью и беспристрастием; выбранный оборот естественен для современного русского судебного контекста.
- source_word: לְעַנְוֵי אָרֶץ
  choice: дела кротких на земле
  rationale: עָנָו может обозначать кроткого, смиренного или угнетённого, а לְ имеет значение пользы или заинтересованной стороны. Формулировка показывает, что решение выносится в их пользу, не перегружая стих неестественным оборотом «кротких земли».
- source_word: וְהִכָּה אֶרֶץ
  choice: Он поразит землю
  rationale: נכה означает «ударить, поразить», а אֶרֶץ — «земля, страна». «Поразит землю» сохраняет силу образа и возможный широкий масштаб пророчества.
- source_word: בְּשֵׁבֶט פִּיו
  choice: жезлом Своих уст
  rationale: שֵׁבֶט может быть жезлом, посохом или скипетром. «Жезл» сохраняет образ властного орудия суда, которым здесь метафорически становится Его слово.
- source_word: וּבְרוּחַ שְׂפָתָיו
  choice: дыханием Своих губ
  rationale: רוּחַ может означать дух, ветер или дыхание. Параллелизм «уста — губы» делает «дыхание» наиболее непосредственным значением, сохраняя образ могущественной речи.
- source_word: יָמִית רָשָׁע
  choice: предаст смерти нечестивого
  rationale: Хифиль глагола מות означает «умертвить, причинить смерть». Единственное число רָשָׁע сохранено в русском тексте и может пониматься как обобщённо, так и применительно к отдельной фигуре.
theological_decisions:
- issue: Масштаб значения אֶרֶץ
  choice: земля
  alternative: страна
  rationale: אֶרֶץ допускает оба значения. Более широкое «земля» соответствует расширяющемуся горизонту отрывка, но примечание сохраняет возможность локального значения «страна».
- issue: Значение единственного числа רָשָׁע
  choice: нечестивого — форма единственного числа без уточнения референта
  alternative: нечестивых как собирательное обозначение; Нечестивца как отдельная фигура
  rationale: Еврейское единственное число может быть родовым или указывать на отдельного противника. Русская форма «нечестивого» сохраняет эту напряжённость и не навязывает позднейшую богословскую идентификацию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Параллелизм сохранён четырьмя строками; «жезл уст» и «дыхание губ» оставлены как намеренно яркие метафоры. Местоимения, относящиеся к мессианскому царю, набраны с прописной буквы в соответствии с устойчивой русской библейской традицией, без добавления имени или догматического толкования.
