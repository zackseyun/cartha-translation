lexical_decisions:
- source_word: שִׁעֲשַׁע
  choice: будет играть
  rationale: В контексте безмятежного соприкосновения ребёнка с обычно смертельной опасностью глагол естественно передаёт непринуждённую игру.
- source_word: יוֹנֵק
  choice: грудной ребёнок
  rationale: Причастие обозначает ребёнка, который ещё питается грудным молоком; перевод сохраняет возрастное противопоставление отнятому от груди ребёнку.
- source_word: חֻר
  choice: нора
  rationale: Существительное обозначает отверстие или полость; применительно к змее русское «нора» звучит естественно.
- source_word: פָּתֶן
  choice: кобра
  rationale: Слово обозначает ядовитую змею, традиционно отождествляемую с аспидом или коброй; «кобра» понятно современному читателю, но точная зоологическая идентификация не вполне определённа.
- source_word: מְאוּרַת
  choice: логово
  rationale: Слово обозначает убежище или место обитания; «логово» сохраняет параллелизм, не повторяя «нору».
- source_word: צִפְעוֹנִי
  choice: гадюка
  rationale: Еврейское слово обозначает ядовитую змею без надёжной точной зоологической идентификации; «гадюка» — ясный и традиционный русский эквивалент.
- source_word: גָּמוּל
  choice: отнятый от груди ребёнок
  rationale: Перевод прямо передаёт ребёнка после отнятия от груди и сохраняет поэтическое возрастное противопоставление.
- source_word: יָדוֹ
  choice: руку
  rationale: Еврейская форма означает «его руку»; в русском притяжательное местоимение при однозначном подлежащем избыточно, поэтому естественно сказать просто «руку».
- source_word: הָדָה
  choice: протянет
  rationale: Редкий глагол в данном сочетании может означать протягивание или помещение руки. «Протянет руку к» естественно передаёт направленное движение, не утверждая, что рука уже помещена внутрь логова.
theological_decisions:
- issue: Характер образа мира и безопасности
  choice: Передать образ прямо, не уточняя, является ли он буквальным, символическим или сочетает оба смысла.
  alternative: Истолковать его либо исключительно как буквальное преображение творения, либо исключительно как символ мессианского мира.
  rationale: Стих поэтически изображает полную безопасность уязвимых детей рядом со смертоносными змеями, но сам не разрешает вопрос о способе исполнения этого образа.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным звучанием. Синтаксис сохраняет поэтический параллелизм двух строк; буквальное «отнятый от груди ребёнок» выбрано вместо более свободного возрастного обозначения.
