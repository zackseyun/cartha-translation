  source_fidelity: 'Основной смысл передан верно: חרם отражён как окончательное уничтожение, образ «языка» сохранён, הַנָּהָר оставлено без раскрытия в основном тексте, семь потоков и переход в сандалиях переданы точно. Однако «при палящем ветре» ослабляет инструментальную связь בְּעָיָם רוּחוֹ и может означать лишь сопутствующее обстоятельство. Кроме того, «прострёт руку» менее точно передаёт הֵנִיף («взмахнёт / поднимет, совершая властный жест»).'
