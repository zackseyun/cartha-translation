source:
  edition: WLC
  text: וְ/הֶחֱרִ֣ים יְהוָ֗ה אֵ֚ת לְשׁ֣וֹן יָם מִצְרַ֔יִם וְ/הֵנִ֥יף יָד֛/וֹ עַל הַ/נָּהָ֖ר בַּ/עְיָ֣ם רוּח֑/וֹ וְ/הִכָּ֨/הוּ֙ לְ/שִׁבְעָ֣ה נְחָלִ֔ים וְ/הִדְרִ֖יךְ בַּ/נְּעָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/015.yaml
  text: And Yahweh will utterly destroy the tongue of the sea of Egypt[a], and he will wave his hand over the River with the scorching of his wind; he will strike it into seven streams[c][b], and make people walk through in sandals.
translation:
  language: ru
  text: И Яхве предаст полному уничтожению язык Египетского моря[a], и взмахнёт рукой Своей над Рекой[b] — в палящем жаре ветра Своего[c]; Он разобьёт её на семь потоков и сделает так, что люди перейдут её в сандалиях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «залив Египта»; буквально: «язык Египетского моря».'
    reason: lexical_alternative
  - marker: b
    text: То есть Евфрат.
    reason: cross_reference
  - marker: c
    text: 'Или: «жаром ветра Своего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִים
  choice: предаст полному уничтожению
  rationale: Хифиль от חרם обычно означает предать заклятию или полному уничтожению. Такая передача сохраняет силу глагола, не подменяя его контекстуальным толкованием «высушит».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לְשׁוֹן יָם מִצְרַיִם
  choice: язык Египетского моря
  rationale: Сохраняет конкретный образ еврейского לשון — языка, то есть языкообразного залива или морского рукава; географическое толкование вынесено в сноску.
- source_word: וְהֵנִיף יָדוֹ
  choice: прострёт руку Свою
  rationale: Естественное для возвышенной русской речи выражение властного жеста; оно сохраняет образ действия рукой без неуместно бытового «помашет».
- source_word: הַנָּהָר
  choice: Река
  rationale: Еврейский текст употребляет определённое существительное без собственного названия; прописная буква указывает на известную Реку, а вероятное отождествление с Евфратом дано в сноске.
- source_word: בַּעְיָם רוּחוֹ
  choice: при палящем ветре Своём
  rationale: בעים, вероятно, выражает палящий жар, а רוח в контексте воздействия на воды естественно означает ветер. Предлог «при» сохраняет некоторую неоднозначность связи между жестом и ветром.
- source_word: וְהִכָּהוּ לְשִׁבְעָה נְחָלִים
  choice: разобьёт её на семь потоков
  rationale: Глагол נכה передаёт решительный удар, а конструкция с לְ указывает на результат — разделение Реки на семь потоков.
- source_word: וְהִדְרִיךְ בַּנְּעָלִים
  choice: сделает так, что люди перейдут её в сандалиях
  rationale: Хифиль выражает причинение или обеспечение хождения. Необозначенный человеческий участник восполнен словом «люди», а «в сандалиях» подчёркивает лёгкость сухого перехода.
theological_decisions:
- issue: Характер образа уничтожения морского языка и разделения Реки
  choice: Передать как действие Яхве над конкретно изображёнными водами в возвышенной пророческой речи, не аллегоризируя текст.
  alternative: Истолковать воды непосредственно как политические препятствия либо свести весь образ только к типологии исхода.
  rationale: Стих вызывает ассоциации с исходом, но сам говорит о море, Реке, ветре и переходе; перевод сохраняет эти образы и не предрешает их дальнейшее богословское истолкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Формы «прострёт» и инверсия с «Свою» поддерживают достоинство стиля, но архаизмы вроде «иссушит», «поразит» или «обутыми» не нагромождаются. Все сносочные маркеры стоят непосредственно при соответствующих выражениях.
