revisions:
- from: И предаст Яхве полному уничтожению язык Египетского моря[a], и прострёт руку Свою над Рекой[b] при палящем ветре Своём[c]; и разобьёт её на семь потоков, и сделает так, что люди перейдут её в сандалиях.
  to: И Яхве предаст полному уничтожению язык Египетского моря[a], и взмахнёт рукой Своей над Рекой[b] — в палящем жаре ветра Своего[c]; Он разобьёт её на семь потоков и сделает так, что люди перейдут её в сандалиях.
  rationale: Изменены только две формулировки, где русский текст менее точно отражал еврейский образ и синтаксическую связь. «Взмахнёт рукой» передаёт הֵנִיף, а «в палящем жаре ветра Своего» сохраняет не до конца бесспорный смысл עָיָם как палящего жара и не превращает ветер в простой фон действия. Остальные элементы, включая сохранение буквального «языка» и сноски, оставлены без изменения по смыслу.
