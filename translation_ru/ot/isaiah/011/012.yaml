revisions:
- from: Он поднимет знамя для народов, соберёт изгнанников Израиля и созовёт рассеянных из Иудеи[a] от четырёх краёв земли[b].
  to: Он поднимет знамя для народов, соберёт изгнанников Израиля и соберёт рассеянных Иуды[a] от четырёх краёв земли[b].
  rationale: Исправлено пространственно окрашенное «из Иудеи» на «Иуды», что восстанавливает параллелизм с «изгнанниками Израиля» и не смешивает Иуду как народ с Иудеей как территорией. «Созовёт» заменено на «соберёт» ради точного значения יְקַבֵּץ. Примечание о женском роде уточнено, чтобы сохранить грамматическую особенность без утверждения о женском составе референта.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:31:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: поднятие знамени, собирание изгнанников Израиля и рассеянных Иуды, а также образ четырёх краёв земли сохранены. Однако «рассеянных из Иудеи» вводит пространственное значение («вышедших из Иудеи»), которого в еврейском тексте нет: נְפֻצוֹת יְהוּדָה означает «рассеянных Иуды/принадлежащих Иуде».'
  naturalness: Текст звучит современно и литературно. Повтор «соберёт» в двух параллельных действиях естественен в русском библейском стиле и точнее, чем «созовёт», которое может обозначать лишь призыв, а не фактическое собирание.
  terminology: «Знамя», «народы», «изгнанники Израиля» и «четыре края земли» удачны. Для יְהוּדָה следует сохранить личное/коллективное обозначение «Иуда», а не подменять его географической «Иудеей». Примечание о женской форме должно сообщать грамматический факт, не создавая необоснованного варианта, будто речь специально о женщинах.
  issues:
