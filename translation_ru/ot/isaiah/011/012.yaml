  text: וְ/נָשָׂ֥א נֵס֙ לַ/גּוֹיִ֔ם וְ/אָסַ֖ף נִדְחֵ֣י יִשְׂרָאֵ֑ל וּ/נְפֻצ֤וֹת יְהוּדָה֙ יְקַבֵּ֔ץ מֵ/אַרְבַּ֖ע כַּנְפ֥וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/012.yaml
  text: He will raise a banner for the nations[a], and gather the banished of Israel[c][b]; he will assemble the scattered of Judah from the four corners of the earth.
translation:
  language: ru
  text: Он поднимет знамя для народов, соберёт изгнанников Израиля и соберёт рассеянных Иуды[a] от четырёх краёв земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «рассеянных» стоит в форме женского рода множественного числа. Вероятно, эта форма относится к Иуде как к собирательному обозначению народа, а не указывает только на женщин.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от четырёх крыльев земли», то есть от самых дальних её пределов.'
    reason: cultural_note
lexical_decisions:
- source_word: וְנָשָׂא נֵס
  choice: Он поднимет знамя
  rationale: Сочетание נשׂא с נֵס означает поднять видимый знак или знамя; русский оборот естественен и сохраняет образ всеобщего призыва.
- source_word: לַגּוֹיִם
  choice: для народов
  rationale: גּוֹיִם — «народы»; предлог ל здесь указывает, для кого поднимается знамя как призывной знак.
- source_word: וְאָסַף נִדְחֵי יִשְׂרָאֵל
  choice: соберёт изгнанников Израиля
  rationale: נדח обозначает тех, кого оттеснили или изгнали; «изгнанники» передаёт идею насильственного удаления, а אסף — возвращающего собирания.
- source_word: וּנְפֻצוֹת יְהוּדָה יְקַבֵּץ
  choice: и созовёт рассеянных из Иудеи
  rationale: נְפֻצוֹת — форма женского рода множественного числа от «быть рассеянным», но в контексте она, вероятнее всего, коллективно обозначает рассеянный народ Иудеи, а не только женщин. «Созовёт» передаёт קבץ и позволяет избежать тяжёлого повтора «соберёт».
- source_word: מֵאַרְבַּע כַּנְפוֹת הָאָרֶץ
  choice: от четырёх краёв земли
  rationale: Буквально כַּנְפוֹת — «крылья, края»; «четыре края земли» естественно передаёт образ самых дальних пределов без навязывания космологического смысла.
theological_decisions:
- issue: Женский род формы נְפֻצוֹת при יְהוּדָה
  choice: рассеянных из Иудеи
  alternative: рассеянных женщин Иудеи
  rationale: 'Морфологический женский род сохранён в примечании, но не превращён в утверждение, что речь исключительно о женщинах: форма может согласовываться с Иудеей как собирательным обозначением народа. Так сохраняется реальная грамматическая особенность без смыслового сужения.'
- issue: Объём значения הָאָרֶץ
  choice: земли
  alternative: страны
  rationale: Упоминание народов и образ собирания с четырёх пределов поддерживают всемирный смысл; «земля» также естественно входит в данный идиоматический образ.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной библейской интонацией. Параллелизм двух полустиший сохранён; различие глаголов אסף и קבץ передано словами «соберёт» и «созовёт».
