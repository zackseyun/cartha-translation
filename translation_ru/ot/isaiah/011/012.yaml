    issue: «Рассеянных из Иудеи»
    rationale: Оборот «из Иудеи» переводит источник рассеяния или происхождение из территории. В оригинале зависимое יְהוּדָה обозначает Иуду как коллектив народа, параллельно «Израиля» в предыдущей строке.
  - severity: low
    issue: «Созовёт» вместо «соберёт»
    rationale: «Созвать» прежде всего значит пригласить или велеть явиться; יְקַבֵּץ означает собрать воедино. Повтор глагола «соберёт» сохраняет реальное действие и поэтический параллелизм.
  - severity: low
    issue: Примечание a предлагает «рассеянных женщин Иудеи»
    rationale: Женская форма в данном контексте не требует вывода о женском референте. Примечание лучше ограничить грамматическим наблюдением и вероятным коллективным значением.
