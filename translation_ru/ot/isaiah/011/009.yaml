id: ISA.11.9
reference: Isaiah 11:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹֽא יָרֵ֥עוּ וְ/לֹֽא יַשְׁחִ֖יתוּ בְּ/כָל הַ֣ר קָדְשִׁ֑/י כִּֽי מָלְאָ֣ה הָ/אָ֗רֶץ דֵּעָה֙ אֶת יְהוָ֔ה כַּ/מַּ֖יִם לַ/יָּ֥ם מְכַסִּֽים־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/009.yaml
  text: They will not do harm or bring destruction on all my holy mountain[a], for the earth will be full of the knowledge of Yahweh as the waters cover the sea.
translation:
  language: ru
  text: Не будут причинять вреда и не будут губить на всей моей святой горе, потому что земля[a] будет полна знания Яхве, как воды покрывают море.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страна будет полна знания Яхве».'
    reason: Лексема הָאָרֶץ может обозначать как всю землю, так и определённую страну.
lexical_decisions:
- source_word: יָרֵעוּ
  choice: будут причинять вред
  rationale: Каузативная форма здесь естественно передаётся конкретным причинением вреда; это соответствует мирному контексту и параллели с יַשְׁחִיתוּ.
- source_word: יַשְׁחִיתוּ
  choice: будут губить
  rationale: Глагол передаёт причинение гибели или разорения. «Губить» звучит прямо и естественно, сохраняя каузативный смысл.
- source_word: בְּכָל הַר קָדְשִׁי
  choice: на всей моей святой горе
  rationale: Предлог ב при слове «гора» естественно передаётся по-русски как «на»; כָל сохранено словом «всей».
- source_word: מָלְאָה
  choice: будет полна
  rationale: Перфект в пророческом контексте имеет будущую направленность; такая передача согласуется с предшествующими формами будущего времени.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Слово допускает значения «земля» и «страна». Основной текст сохраняет широкий, вероятно всеобщий охват, а локальная возможность отмечена в сноске.
- source_word: דֵּעָה אֶת יְהוָה
  choice: знания Яхве
  rationale: Выражение обозначает знание, направленное на Яхве, а не только сведения о нём; краткая русская конструкция сохраняет эту смысловую насыщенность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя передано транслитерацией, а не заменено титулом.
- source_word: כַּמַּיִם לַיָּם מְכַסִּים
  choice: как воды покрывают море
  rationale: Сохранены множественное число «воды», образ покрытия и форма сравнительного оборота, близкая к еврейскому тексту.
theological_decisions:
- issue: Охват пророчества о мире
  choice: «земля» — вероятный всеобщий охват
  alternative: «страна» — более локальный охват, возможно земля Израиля
  rationale: Контекст и размах образа допускают вселенское понимание, но многозначность הָאָרֶץ не устраняется и отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм сохранён; архаизмы и конфессионально обусловленные замены Божьего имени не используются.
