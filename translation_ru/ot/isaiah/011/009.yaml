  source_fidelity: Текст точно передаёт два отрицательных глагола יָרֵעוּ и יַשְׁחִיתוּ, локатив «на всей Моей святой горе», пророческое будущее מָלְאָה, широкий смысл הָאָרֶץ и сравнительный образ «как воды покрывают море». «Знания Яхве» адекватно передаёт знание, направленное к Яхве, без неоправданного богословского уточнения.
  naturalness: Перевод звучит по-современному и литературно. Повтор «не будут» поддерживает еврейский параллелизм и ясно связывает оба действия с отрицанием. «Будет полна» и «как воды покрывают море» естественны в возвышенном пророческом регистре.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Святая гора», «земля», «знание» и «губить» соответствуют контексту; «губить» уместно сохраняет более сильный, разрушительный оттенок שׁחת, не сводя его к простому вреду.
