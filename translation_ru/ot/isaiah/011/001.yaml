  text: Then a shoot will come out from the stump of Jesse[d][c][b][a], and a branch from his roots will bear fruit.
translation:
  language: ru
  text: Тогда[a] из пня Иессея выйдет побег[b], и ветвь[c] от его корней[d] принесёт плод.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И из пня Иессея выйдет побег». Союз можно передать простым «и»; слово «тогда» подчёркивает переход от предшествующего суда к новой надежде.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прут» или «веточка».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «росток». Этот образ может иметь мессианское значение, но в основном тексте сохранён обычный ботанический смысл слова.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально в еврейском тексте: «от его корней». Местоимение мужского рода может поддерживать связь с Иессеем; по-русски оно также может относиться к пню.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Тогда ... выйдет
  rationale: Глагол יָצָא означает «выходить, появляться наружу» и естественно описывает побег, выходящий из пня. «Тогда» передаёт переход от предшествующего суда к надежде, а буквальное союзное «и» указано в сноске.
- source_word: חֹטֶר
  choice: побег
  rationale: חֹטֶר может обозначать побег, прут или молодую веточку. «Побег» точнее всего передаёт ботанический образ новой жизни, возникающей из срубленного дерева.
- source_word: מִגֵּזַע
  choice: из пня
  rationale: גֵּזַע здесь обозначает оставшуюся после рубки нижнюю часть ствола. «Пень» ясно сохраняет образ суда и последующего возрождения.
- source_word: יִשָׁי
  choice: Иессей
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: וְנֵצֶר
  choice: и ветвь
  rationale: נֵצֶר означает молодой побег, росток или ветвь. «Ветвь» сохраняет поэтическое различие между двумя параллельными образами, не превращая слово в явно выраженный богословский титул.
- source_word: מִשָּׁרָשָׁיו
  choice: от его корней
  rationale: Местоименный суффикс в еврейском тексте имеет мужской род и единственное число. Русское «его» сохраняет эту форму и не устраняет возможную связь как с Иессеем, так и с образом пня.
- source_word: יִפְרֶה
  choice: принесёт плод
  rationale: Глагол פרה означает «плодоносить, приносить плод». Выбранная формулировка естественно завершает растительную метафору и выражает не только рост, но и плодотворность.
theological_decisions:
- issue: Мессианское звучание образа побега и ветви
  choice: Сохранить в основном тексте обычный ботанический и династический образ, не оформляя «ветвь» как особый титул.
  alternative: Передать слово с прописной буквы — «Ветвь», тем самым явно обозначив мессианский титул.
  rationale: В христианском каноническом прочтении стих имеет мессианское значение, однако сам еврейский текст говорит образным языком о новой отрасли от Иессея. Перевод позволяет богословскому смыслу следовать из контекста, а не вносит его посредством капитализации.
- issue: Мужской суффикс в выражении «от его корней»
  choice: Сохранить местоимение мужского рода «его».
  alternative: 'Сгладить метафору: «от корней этого пня» или «от его собственных корней».'
  rationale: Форма «его» соответствует еврейскому суффиксу и сохраняет смысловую связь с Иессеем и образом пня, не фиксируя единственный возможный референт.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным поэтическим ритмом. Сохранены параллелизм двух полустиший, растительная метафора и неоднозначность местоименной связи; архаизмы и конфессионально маркированная капитализация не используются.
