base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/010.yaml
  text: And in that day the root of Jesse, who stands as a banner for the peoples—to him the nations will seek, and his resting place will be glory.
translation:
  language: ru
  text: 'И будет в тот день: корень Иессея будет стоять как знамя для народов; народы будут искать его, и место его покоя будет славой.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и место его покоя будет славным».'
    reason: 'Еврейское כָּבוֹד буквально означает «слава», но в данной конструкции возможно качественное понимание: «славным».'
lexical_decisions:
- source_word: שֹׁרֶשׁ יִשַׁי
  choice: корень Иессея
  rationale: Сохраняет конкретный образ еврейского текста и его связь с предыдущим контекстом главы.
- source_word: עֹמֵד לְנֵס עַמִּים
  choice: встанет как знамя для народов
  rationale: Причастие передано естественной русской глагольной формой будущего времени в рамках пророческой перспективы; נֵס означает поднятый знак или знамя, видимое народам.
- source_word: גּוֹיִם יִדְרֹשׁוּ
  choice: к нему обратятся племена
  rationale: דרשׁ здесь выражает устремление к нему, обращение за руководством или помощью; «обратятся» сохраняет широту смысла лучше, чем более узкое «будут искать».
- source_word: מְנֻחָתוֹ
  choice: место его покоя
  rationale: Суффиксальная форма допускает значение покоя либо места покоя; контекст и древняя переводческая традиция поддерживают локативную передачу.
- source_word: כָּבוֹד
  choice: славой
  rationale: Сохраняет именную конструкцию масоретского текста, не превращая существительное в прилагательное «славным».
theological_decisions:
- issue: Личность «корня Иессея»
  choice: Образ оставлен без поясняющей идентификации в основном тексте.
  alternative: Передать явно как мессианский титул или назвать Мессию.
  rationale: Сам стих использует образное обозначение; явная идентификация сузила бы текст посредством интерпретации.
- issue: Смысл обращения народов
  choice: «обратятся»
  alternative: «будут искать», «будут вопрошать о нём» или «прибегнут к нему»
  rationale: Выбранная формулировка сохраняет направленность народов к этой личности, не уточняя без достаточных оснований характер их поиска.
- issue: Предикативное כָּבוֹד
  choice: «будет славой»
  alternative: «будет славным»
  rationale: Именная передача сохраняет необычную силу и богословскую напряжённость исходной формулировки.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой торжественности. Пунктуация подчёркивает объявление события и последующее описание, не добавляя отсутствующих в оригинале богословских уточнений.
