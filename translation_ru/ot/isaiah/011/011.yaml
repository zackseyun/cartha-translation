source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יוֹסִ֨יף אֲדֹנָ֤/י שֵׁנִית֙ יָד֔/וֹ לִ/קְנ֖וֹת אֶת שְׁאָ֣ר עַמּ֑/וֹ אֲשֶׁ֣ר יִשָּׁאֵר֩ מֵ/אַשּׁ֨וּר וּ/מִ/מִּצְרַ֜יִם וּ/מִ/פַּתְר֣וֹס וּ/מִ/כּ֗וּשׁ וּ/מֵ/עֵילָ֤ם וּ/מִ/שִּׁנְעָר֙ וּ/מֵ֣/חֲמָ֔ת וּ/מֵ/אִיֵּ֖י הַ/יָּֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/011.yaml
  text: And in that day the Lord will again extend his hand[a], a second time, to recover the remnant of his people who remain, from Assyria, from Egypt, from Pathros, from Cush, from Elam, from Shinar, from Hamath[c][b], and from the coastlands of the sea.
translation:
  language: ru
  text: 'И будет в тот день: Господь снова прострёт Свою руку — во второй раз, чтобы вернуть остаток Своего народа — тех, кто останется в Ассирии, Египте, Патросе, Куше[a], Эламе, Сеннааре, Хамате и на морских островах[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Куш — древнее название области к югу от Египта, связанной прежде всего с Нубией; в некоторых переводах — «Эфиопия».
    reason: cultural_note
  - marker: b
    text: 'Или: «на морских побережьях». Еврейское выражение может обозначать как острова, так и приморские земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохраняет пророческую формулу и естественно звучит в современном литературном русском.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт титул Адонай, не смешивая его с тетраграмматоном; сохраняет торжественный регистр.
- source_word: יוֹסִיף ... שֵׁנִית יָדוֹ
  choice: снова прострёт Свою руку — во второй раз
  rationale: 'Сохраняет образ руки, а также оба указания на повторность: יוֹסִיף и שֵׁנִית.'
- source_word: לִקְנוֹת
  choice: чтобы вернуть
  rationale: В контексте повторного собирания уже принадлежащего Богу народа глагол קנה указывает на обретение или возвращение; «вернуть» естественно передаёт контекстуальный смысл, не внося значения «искупить».
- source_word: שְׁאָר עַמּוֹ אֲשֶׁר יִשָּׁאֵר
  choice: остаток Своего народа, который останется
  rationale: Сохраняет корневой повтор שׁאר и важное для пророческого текста понятие остатка.
- source_word: מִפַּתְרוֹס
  choice: в Патросе
  rationale: Транслитерация древнеегипетского регионального названия.
- source_word: מִכּוּשׁ
  choice: в Куше
  rationale: Сохраняет древнее географическое имя и не отождествляет его без оговорки с современной Эфиопией.
- source_word: מִשִּׁנְעָר
  choice: в Сеннааре
  rationale: Устоявшаяся русская библейская форма топонима Шинар.
- source_word: מֵאִיֵּי הַיָּם
  choice: на морских островах
  rationale: Основное значение אִיִּים передано как «острова»; выражение может также обозначать приморские земли, что отмечено в сноске.
theological_decisions:
- issue: Передача לִקְנוֹת как «приобрести», «вернуть» или «искупить»
  choice: вернуть
  alternative: приобрести; искупить
  rationale: «Вернуть» соответствует контексту повторного собирания остатка. «Искупить» добавило бы сотериологический оттенок, не обязательный для קנה, а «приобрести» по-русски могло бы ошибочно подразумевать, что народ прежде не принадлежал Владыке.
- issue: Сохранение антропоморфного образа руки
  choice: снова прострёт Свою руку — во второй раз
  alternative: во второй раз вернёт
  rationale: Еврейский текст явно называет руку Владыки; сохранение образа передаёт риторику и напряжение оригинала.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис слегка возвышенный, но понятный; географические названия переданы традиционными русскими библейскими формами. Местоимение «Свою/Своего» написано с прописной буквы как издательская норма уважительного обозначения Бога.
