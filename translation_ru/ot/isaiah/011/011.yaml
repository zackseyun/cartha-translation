    rationale: Во всех членах перечня стоит מִן («из, от»). Следует прямо выразить «из Ассирии...», одновременно указав, что это оставшиеся представители народа.
  - severity: low
    issue: «Владыка» менее точен и менее идиоматичен как соответствие אֲדֹנָי, чем «Господь».
    rationale: אֲדֹנָי — титул «Господь»; русское «Господь» передаёт его естественно, без необходимости обсуждать написание тетраграмматона.
