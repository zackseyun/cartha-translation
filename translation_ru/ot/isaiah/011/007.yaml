source:
  edition: WLC
  text: וּ/פָרָ֤ה וָ/דֹב֙ תִּרְעֶ֔ינָה יַחְדָּ֖ו יִרְבְּצ֣וּ יַלְדֵי/הֶ֑ן וְ/אַרְיֵ֖ה כַּ/בָּקָ֥ר יֹֽאכַל תֶּֽבֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/007.yaml
  text: The cow and the bear will graze[a]; together their young will lie down, and the lion, like the ox[b], will eat straw.
translation:
  language: ru
  text: Корова и медведица будут пастись; их детёныши будут лежать вместе, и лев, как вол, будет есть солому.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפָרָה
  choice: корова
  rationale: פָרָה обозначает корову или тёлку; «корова» — наиболее естественный русский эквивалент в парном образе с медведицей.
- source_word: וָדֹב
  choice: медведица
  rationale: Форма דֹב сама по себе может обозначать медведя без указания пола, однако женский род сказуемого תִּרְעֶינָה и суффикса в יַלְדֵיהֶן относится к обоим животным; «медведица» естественно согласуется с образом их детёнышей и русской грамматикой.
- source_word: תִּרְעֶינָה
  choice: будут пастись
  rationale: Qal от רעה описывает кормление животных на пастбище; «пастись» конкретно и естественно передаёт этот образ применительно и к корове, и к медведице.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Прямой и естественный эквивалент наречия «вместе».
- source_word: יִרְבְּצוּ
  choice: будут лежать рядом
  rationale: רבץ часто обозначает лежание отдыхающих животных. Добавление «рядом» естественно выражает совместность, заданную контекстом, не превращая действие в отдельный богословский вывод.
- source_word: יַלְדֵיהֶן
  choice: их детёныши
  rationale: Буквально «их дети/молодняк»; о животных по-русски естественно сказать «детёныши».
- source_word: וְאַרְיֵה
  choice: и лев
  rationale: Обычный русский эквивалент אַרְיֵה.
- source_word: כַּבָּקָר
  choice: как вол
  rationale: בָּקָר может обозначать крупный рогатый скот собирательно; в сравнении с отдельным львом «как вол» создаёт ясный образ одного животного и соответствует традиционному русскому словоупотреблению.
- source_word: יֹאכַל
  choice: будет есть
  rationale: Имперфект в пророческом описании естественно передаётся будущим временем.
- source_word: תֶּבֶן
  choice: солому
  rationale: תֶּבֶן — солома или мякина, используемая как корм; «солома» точно и понятно передаёт образ.
theological_decisions:
- issue: Характер образа мира между животными
  choice: Передать стих как конкретную картину примирённого творения, не уточняя, следует ли понимать её буквально, символически или одновременно в обоих смыслах.
  alternative: Истолковать образ либо только как символ политического мира между людьми, либо исключительно как буквальное изменение животного мира.
  rationale: Еврейский текст рисует яркую картину поведения животных, но сам не разрешает вопрос о способе исполнения пророчества; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным, возвышенным, но не архаическим звучанием. Параллелизм еврейской строки сохранён; двоеточие с точкой заменено естественной русской пунктуацией. Лексические альтернативы не вынесены в сноски, поскольку основной текст достаточно точно передаёт смысл, а неоднозначность בָּקָר здесь не влияет существенно на образ.
