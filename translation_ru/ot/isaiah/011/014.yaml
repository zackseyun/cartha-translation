  text: וְ/עָפ֨וּ בְ/כָתֵ֤ף פְּלִשְׁתִּים֙ יָ֔מָּ/ה יַחְדָּ֖ו יָבֹ֣זּוּ אֶת בְּנֵי קֶ֑דֶם אֱד֤וֹם וּ/מוֹאָב֙ מִשְׁל֣וֹח יָדָ֔/ם וּ/בְנֵ֥י עַמּ֖וֹן מִשְׁמַעְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/014.yaml
  text: They will swoop down on the shoulder of the Philistines to the west[a]; together they will plunder the sons of the east. Edom and Moab will be the putting forth of their hand[d][c][b], and the sons of Ammon will obey them.
translation:
  language: ru
  text: Они налетят на западный край филистимлян[a] и вместе разграбят сынов Востока[b]. На Эдом и Моав они прострут руку[c], а сыны Аммона будут им послушны[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на плечо филистимлян к морю». «Плечо» здесь, вероятно, означает фланг, край или область филистимлян к западу.'
    reason: Лексико-географическое пояснение.
  - marker: b
    text: 'То есть народы, живущие к востоку; буквально: «сынов Востока».'
    reason: Пояснение древнееврейского этнического выражения.
  - marker: c
    text: 'Или: «Эдом и Моав будут под их рукой»; возможно также: «они наложат руку на Эдом и Моав». Еврейское выражение может обозначать как распространение власти, так и захват.'
    reason: Сохранение неоднозначности сжатой еврейской идиомы.
  - marker: d
    text: То есть аммонитяне будут им повиноваться или окажутся у них в подчинении.
    reason: Пояснение буквального выражения «сыны Аммона» и смысла слова о послушании.
lexical_decisions:
- source_word: וְעָפוּ
  choice: они налетят
  rationale: Глагол буквально означает «полетят», но в военном контексте передаёт стремительное нападение. «Налетят» сохраняет образ полёта и ясно выражает враждебное действие.
- source_word: בְכָתֵף פְּלִשְׁתִּים
  choice: на плечо филистимлян
  rationale: כָּתֵף буквально означает «плечо», а также может обозначать бок, склон, фланг или край области. Основной текст сохраняет выразительную метафору, а примечание поясняет вероятный географический смысл.
- source_word: יָמָּה
  choice: на западе
  rationale: Направительная форма от слова «море» в библейской географии обычно означает движение к западу или местоположение на западе. Здесь «на западе» естественно связывается с филистимской областью.
- source_word: יַחְדָּו יָבֹזּוּ
  choice: вместе разграбят
  rationale: Передаёт совместное военное действие и обычное значение בזז — захватывать добычу, грабить.
- source_word: בְּנֵי קֶדֶם
  choice: сынов Востока
  rationale: Сохранён буквальный образ «сынов Востока», обозначающий восточные народы; прописная буква помогает воспринять выражение как наименование группы.
- source_word: מִשְׁלוֹח יָדָם
  choice: прострётся их рука
  rationale: Сжатая именная конструкция буквально говорит о «простирании/посылании их руки» и обозначает распространение силы или нападение. Русская формулировка сохраняет образ руки, не сводя его однозначно только к власти или только к удару.
- source_word: מִשְׁמַעְתָּם
  choice: будут им послушны
  rationale: Именная форма от שׁמע обозначает послушание или подчинение. Эта формулировка естественна по-русски и сохраняет оттенок повиновения.
- source_word: אֱדוֹם וּמוֹאָב
  choice: Эдом и Моав
  rationale: Традиционные русские формы библейских названий.
- source_word: וּבְנֵי עַמּוֹן
  choice: сыны Аммона
  rationale: Буквально «сыны Аммона»; форма сохранена в основном тексте, а примечание даёт обычное этническое обозначение.
theological_decisions:
- issue: Следует ли смягчать образы завоевания и подчинения
  choice: Сохранить явные образы стремительного нападения, разграбления, простёртой руки и послушания
  alternative: Передать стих общими словами о политическом влиянии или превосходстве
  rationale: Еврейский текст использует военную лексику и образы господства. Пророческий контекст не даёт оснований устранять напряжённость или смягчать силу этих выражений.
- issue: Как истолковать מִשְׁלוֹח יָדָם применительно к Эдому и Моаву
  choice: 'Сохранить метафору: «на Эдом и Моав прострётся их рука»'
  alternative: «Эдом и Моав будут под их властью» или «они наложат руку на Эдом и Моав»
  rationale: Еврейская конструкция допускает оттенки распространения власти и враждебного захвата. Образная передача сохраняет эту смысловую широту, а примечание называет основные варианты.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Военная образность оригинала сохранена без архаической перегруженности; буквальные семитские образы оставлены там, где они выразительны и где их неоднозначность важна, с пояснениями в сносках.
