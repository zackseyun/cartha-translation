id: MIC.6.16
reference: Micah 6:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/יִשְׁתַּמֵּ֞ר חֻקּ֣וֹת עָמְרִ֗י וְ/כֹל֙ מַעֲשֵׂ֣ה בֵית אַחְאָ֔ב וַ/תֵּלְכ֖וּ בְּ/מֹֽעֲצוֹתָ֑/ם לְמַעַן֩ תִּתִּ֨/י אֹתְ/ךָ֜ לְ/שַׁמָּ֗ה וְ/יֹשְׁבֶ֨י/הָ֙ לִ/שְׁרֵקָ֔ה וְ/חֶרְפַּ֥ת עַמִּ֖/י תִּשָּֽׂאוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/016.yaml
  text: The statutes of Omri are kept[a], and all the works of the house of Ahab; and you walk in their counsels, so that I may make you a desolation, and her inhabitants an object of hissing[c][b], and you will bear the reproach of my people.
translation:
  language: ru
  text: Соблюдаются установления Омри и все дела дома Ахава; вы поступаете по их советам, так что Я сделаю тебя местом запустения, а её жителей — предметом насмешливого свиста[a]. Вы понесёте поношение Моего народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свистом» — тем, чему люди свистят вслед в знак насмешки и презрения.'
    reason: cultural_note
  - marker: b
    text: Еврейское выражение можно также понять как «позор Моего народа» или «поношение, обращённое против Моего народа».
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִשְׁתַּמֵּר
  choice: соблюдаются
  rationale: Нифаль, имперфект, здесь естественно передать безлично-пассивной формой; она выражает продолжающееся следование установлениям.
- source_word: חֻקּוֹת עָמְרִי
  choice: установления Омри
  rationale: «Установления» сохраняет нормативно-официальный оттенок חֻקּוֹת, не предполагая непременно формально записанного законодательства.
- source_word: מַעֲשֵׂה בֵית אַחְאָב
  choice: все дела дома Ахава
  rationale: «Дела» передаёт широкий смысл מַעֲשֵׂה, а «дом Ахава» сохраняет династическое значение выражения.
- source_word: וַתֵּלְכוּ בְּמֹעֲצוֹתָם
  choice: вы поступаете по их советам
  rationale: Русское «поступаете» естественно передаёт метафорическое «ходите», то есть устойчивый образ жизни; «по их советам» сохраняет значение руководящих замыслов и наставлений.
- source_word: לְמַעַן תִּתִּי אֹתְךָ לְשַׁמָּה
  choice: так что Я сделаю тебя местом запустения
  rationale: «Так что» допускает оттенок цели или результата לְמַעַן; единственное «тебя» сохраняет обращение к городу или народу как к единому целому.
- source_word: וְיֹשְׁבֶיהָ לִשְׁרֵקָה
  choice: а её жителей — предметом насмешливого свиста
  rationale: Женский суффикс сохранён местоимением «её», относящимся к подразумеваемому городу; пояснение «насмешливого» ясно передаёт культурный смысл свиста как выражения презрения.
- source_word: וְחֶרְפַּת עַמִּי תִּשָּׂאוּ
  choice: Вы понесёте поношение Моего народа
  rationale: 'Близкая к форме оригинала передача сохраняет неоднозначность краткой генитивной конструкции: поношение народа, против народа или несомое народом.'
theological_decisions:
- issue: Значение выражения חֶרְפַּת עַמִּי («поношение Моего народа»)
  choice: поношение Моего народа
  alternative: поношение, обращённое против Моего народа; позор Моего народа
  rationale: Еврейская сопряжённая конструкция не определяет однозначно отношение между «поношением» и «народом». Буквально близкая формулировка и сноска сохраняют эту богословски значимую неопределённость.
- issue: Связь человеческого поведения и Божьего суда в לְמַעַן
  choice: так что
  alternative: чтобы; вследствие этого
  rationale: «Так что» сохраняет связь между следованием политике Омри и Ахава и объявленным Богом судом, не сводя её исключительно к намерению либо исключительно к механическому следствию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя, но сохранены коллективное обращение в единственном числе («тебя»), женское обозначение города («её») и неоднозначность заключительной конструкции.
