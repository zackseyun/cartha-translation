id: MIC.6.7
reference: Micah 6:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֲ/יִרְצֶ֤ה יְהוָה֙ בְּ/אַלְפֵ֣י אֵילִ֔ים בְּ/רִֽבְב֖וֹת נַֽחֲלֵי שָׁ֑מֶן הַ/אֶתֵּ֤ן בְּכוֹרִ/י֙ פִּשְׁעִ֔/י פְּרִ֥י בִטְנִ֖/י חַטַּ֥את נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/007.yaml
  text: Will Yahweh be pleased with thousands of rams[a], with ten thousands of streams of oil? Shall I give my firstborn for my transgression[c][b], the fruit of my body for the sin of my soul?
translation:
  language: ru
  text: Будет ли Яхве доволен тысячами баранов, десятками тысяч потоков масла[a]? Отдам ли я своего первенца за своё преступление, плод своего тела[b] — за грех своей души[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «мириадами потоков (или рек) масла». Это гипербола, изображающая неизмеримое изобилие масла.'
    reason: lexical_alternative
  - marker: b
    text: «Плод тела» — еврейское образное выражение, означающее собственного ребёнка, потомка; буквально возможно и «плод чрева».
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может означать как «грех», так и «жертву за грех». Здесь значение «грех» лучше соответствует параллели со словом «преступление».
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיִרְצֶה
  choice: будет ли ... доволен
  rationale: Передаёт вопрос о том, примет ли Яхве такие дары с благоволением; сохраняет Яхве грамматическим субъектом и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בְּאַלְפֵי אֵילִים
  choice: тысячами баранов
  rationale: Творительный падеж естественно передаёт еврейский предлог בְּ в значении того, чем пытаются угодить; אֵילִים в жертвенном контексте — «бараны».
- source_word: בְּרִבְבוֹת נַחֲלֵי שָׁמֶן
  choice: десятками тысяч потоков масла
  rationale: Сохраняются числовое преувеличение и яркий образ потоков или русел, наполненных маслом.
- source_word: הַאֶתֵּן
  choice: отдам ли я
  rationale: Продолжает нарастающую цепь риторических вопросов и естественно выражает принесение самого дорогого.
- source_word: בְּכוֹרִי
  choice: своего первенца
  rationale: Не добавляет отсутствующее в еврейском тексте слово «сын», но ясно обозначает перворождённого ребёнка говорящего.
- source_word: פִּשְׁעִי
  choice: своё преступление
  rationale: Передаёт тяжесть פֶּשַׁע как сознательного нарушения или мятежа; в данном контексте «преступление» звучит естественнее, чем книжное «прегрешение».
- source_word: פְּרִי בִטְנִי
  choice: плод своего тела
  rationale: Сохраняет конкретную еврейскую метафору потомства и не приписывает говорящему пол, которого текст прямо не указывает.
- source_word: חַטַּאת נַפְשִׁי
  choice: грех своей души
  rationale: Сохраняет поэтический параллелизм с «своё преступление» и личный, внутренний оттенок נֶפֶשׁ; неоднозначность חַטָּאת отмечена в сноске.
theological_decisions:
- issue: Передавать ли חַטַּאת как «грех» или «жертва за грех»
  choice: грех
  alternative: жертва за грех
  rationale: Параллелизм с «моё преступление» прежде всего поддерживает значение нравственной вины, однако возможное культовое значение не исключено и отмечено в сноске.
- issue: Может ли формулировка создать впечатление одобрения человеческого жертвоприношения
  choice: Сохранить риторический вопрос без утверждения, что Яхве желает такой жертвы
  alternative: Смягчить или истолковать упоминание первенца непосредственно в тексте
  rationale: Нарастающий ряд намеренно достигает предельного и страшного примера. Перевод сохраняет эту напряжённость, но вопросительная форма не приписывает Богу одобрения.
translation_notes:
  register: Современный литературный русский язык с торжественной поэтической интонацией. Повтор риторических вопросов и нарастание от множества жертв к первенцу сохранены; архаизмы и конфессионально маркированные выражения не используются.
