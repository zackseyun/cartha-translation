base_translation:
  language: en
  yaml_path: translation/ot/micah/006/014.yaml
  text: You will eat[a], but you will not be satisfied, and your emptiness will remain within you; you will move away, but you will not rescue anything, and what you do rescue I will give to the sword.
translation:
  language: ru
  text: Ты будешь есть[a], но не насытишься, и внутри тебя останется пустота; ты будешь уносить, но ничего не спасёшь, а то, что спасёшь, Я отдам мечу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза, переведённая как «внутри тебя останется пустота», трудна для понимания. Возможны также переводы: «унижение будет в твоей среде» или «упадок будет внутри тебя».'
    reason: alternative_reading
lexical_decisions:
- source_word: תֹאכַל
  choice: будешь есть
  rationale: Форма qal imperfect 2 м. ед. ч. от אכל в пророчестве о суде имеет естественный предсказательный смысл.
- source_word: תִשְׂבָּע
  choice: не насытишься
  rationale: Глагол שׂבע означает насыщение пищей; выбранное выражение естественно по-русски и сохраняет контраст с употреблением пищи.
- source_word: יֶשְׁחֲךָ
  choice: пустота останется
  rationale: Редкая и трудная форма допускает разные толкования. В контексте еды без насыщения значение внутренней пустоты наиболее ясно передаёт параллелизм; глагол «останется» добавлен для естественной передачи по-русски безглагольной еврейской конструкции.
- source_word: בְּקִרְבֶּךָ
  choice: внутри тебя
  rationale: קֶרֶב может обозначать внутренность или среду; здесь речь идёт о внутреннем бедствии адресата.
- source_word: תַסֵּג
  choice: будешь уносить
  rationale: Hiphil от סוג может означать отодвигать, удалять или уносить. В сочетании с последующим «не спасёшь» речь, вероятно, идёт о попытке убрать людей или имущество из опасности; перевод не уточняет подразумеваемый объект.
- source_word: תַפְלִיט / תְּפַלֵּט
  choice: не спасёшь / спасёшь
  rationale: Повтор одного и того же глагола פלט передан одним русским корнем, чтобы сохранить словесную связь и нарастание приговора.
- source_word: לַחֶרֶב
  choice: мечу
  rationale: Сохранён обычный пророческий образ меча как обозначения насильственной гибели на войне.
- source_word: אֶתֵּן
  choice: Я отдам
  rationale: «Отдам» естественно передаёт נתן в данной конструкции и ясно сохраняет прямое действие Бога как Судьи.
theological_decisions:
- issue: Смысл трудной фразы וְיֶשְׁחֲךָ בְּקִרְבֶּךָ
  choice: внутренняя пустота как часть суда
  alternative: унижение среди тебя; упадок или недуг внутри тебя
  rationale: Ближайший контекст говорит о еде без насыщения, тщетном спасении и гибели от меча. Основной текст отражает вероятную связь с голодом и лишением, а примечание сохраняет подлинную лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной краткости пророческого приговора. Местоимение «Я» написано с прописной буквы как обозначение говорящего Бога; синтаксический параллелизм и образ меча сохранены.
