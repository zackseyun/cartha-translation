base_translation:
  language: en
  yaml_path: translation/ot/micah/006/009.yaml
  text: 'The voice of the LORD cries out to the city—and sound wisdom fears your name: hear the rod and him who appointed it.'
translation:
  language: ru
  text: Голос ГОСПОДА взывает к городу; мудрость увидит Твоё имя[a]. Слушайте жезл и того, кто назначил его!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст этой части труден. Буквально: «мудрость увидит Твоё имя»; из-за необычного синтаксиса древние переводы и некоторые толкователи передают: «мудрый боится (или почитает) Твоё имя». Буквально далее: «слушайте жезл и того, кто назначил его»; последнее может относиться к тому, кто назначил жезл как орудие наказания.'
    reason: Сноска сохраняет синтаксическую трудность и известную интерпретацию «боится», не заменяя ею чтение WLC в основном тексте; также поясняет образное повеление о жезле.
lexical_decisions:
- source_word: ק֤וֹל יְהוָה֙
  choice: Голос ГОСПОДА
  rationale: Сохраняет образ «голоса» и передаёт тетраграмматон традиционным титулом, выделенным прописными буквами.
- source_word: וְתוּשִׁיָּ֖ה
  choice: и мудрость
  rationale: תושיה обозначает здравую, действенную мудрость; краткое «мудрость» естественно по-русски и не сужает значение до житейской рассудительности.
- source_word: יִרְאֶ֣ה שְׁמֶ֑ךָ
  choice: почитает имя Твоё
  rationale: Масоретский текст допускает понимание от корня «видеть», однако контекстуально и по древним версиям вероятно чтение, связанное со страхом/почтением. «Почитает» передаёт благоговейный страх естественным современным русским языком.
- source_word: שִׁמְע֥וּ מַטֶּ֖ה
  choice: Слушайте о жезле
  rationale: Буквально сохраняет необычное сочетание «слушать жезл», добавляя минимально необходимое «о» для русского синтаксиса; жезл здесь может быть орудием наказания.
- source_word: וּמִ֥י יְעָדָֽהּ
  choice: и о Том, Кто назначил его
  rationale: Передаёт вопросительное/относительное מי и глагол יעד как назначение жезла; прописные «Том, Кто» отражают вероятную отсылку к Богу без вставки имени в основной текст.
theological_decisions:
- issue: Значение יראה перед «имя Твоё»
  choice: почитает
  alternative: видит
  rationale: Консонантный текст и масоретская огласовка формально дают «увидит/видит», но синтаксис труден; древняя переводческая традиция и смысл изречения поддерживают благоговение перед Божьим именем. Неопределённость отмечена в сноске.
- issue: Кто назначил жезл
  choice: Том, Кто назначил его
  alternative: кто назначил его
  rationale: Контекст указывает на Господа как назначившего наказание, но формулировка сохраняет косвенность еврейского текста и не добавляет прямо «Господь».
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Обращение Бога к слушателям оформлено прямой речью; прописные местоимения употреблены только там, где референтом выступает Бог.
