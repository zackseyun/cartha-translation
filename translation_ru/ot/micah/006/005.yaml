  text: עַמִּ֗/י זְכָר נָא֙ מַה יָּעַ֗ץ בָּלָק֙ מֶ֣לֶךְ מוֹאָ֔ב וּ/מֶה עָנָ֥ה אֹת֖/וֹ בִּלְעָ֣ם בֶּן בְּע֑וֹר מִן הַ/שִּׁטִּים֙ עַד הַ/גִּלְגָּ֔ל לְמַ֕עַן דַּ֖עַת צִדְק֥וֹת יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/005.yaml
  text: My people[a], please remember what Balak king of Moab planned[c][b], and what Balaam son of Beor answered him—from Shittim to Gilgal—so that you may know the righteous acts of Yahweh.
translation:
  language: ru
  text: Народ мой, вспомни же, что замыслил[a] Валак, царь Моава, и что ответил ему Валаам, сын Веора, — от Шиттима до Галгала[b], — чтобы ты познал праведные деяния Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что задумал»; возможен также смысл «какой совет дал».'
    reason: lexical_alternative
  - marker: b
    text: Шиттим и Галгал — географические названия, напоминающие о пути Израиля от равнин Моава в обещанную землю.
    reason: cultural_note
  - marker: c
    text: 'Или: «спасительные деяния Яхве» или «дела праведности Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: Народ мой
  rationale: Форма обращения Бога к Израилю; передаёт принадлежность и отношения завета без архаизации.
- source_word: זְכָר נָא
  choice: вспомни же
  rationale: Повелительная форма с частицей נָא выражает настойчивую, но не резкую просьбу; частица «же» естественно передаёт этот оттенок в современном литературном русском.
- source_word: מַה יָּעַץ
  choice: что замыслил
  rationale: Глагол יעץ может означать «советовать, замышлять, задумывать». В контексте намерений Валака «замыслил» ясно передаёт враждебный план, а более буквальные варианты сохранены в примечании.
- source_word: בָּלָק מֶלֶךְ מוֹאָב
  choice: Валак, царь Моава
  rationale: Имена и титул переданы в принятой русской библейской форме; приложение выделено запятыми для естественного русского синтаксиса.
- source_word: וּמֶה עָנָה אֹתוֹ
  choice: и что ответил ему
  rationale: Сохраняется вопросительное מַה («что»), не заменяемое толковательным «как».
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Валаам, сын Веора
  rationale: Сохранены традиционные русские формы имён и патронимическая конструкция.
- source_word: מִן הַשִּׁטִּים עַד הַגִּלְגָּל
  choice: от Шиттима до Галгала
  rationale: Географические названия транслитерированы; обособление тире сохраняет сжатость и некоторую синтаксическую неоднозначность еврейского выражения.
- source_word: לְמַעַן דַּעַת
  choice: чтобы ты познал
  rationale: Целевая конструкция; подразумеваемое подлежащее второго лица восстановлено из обращения «Народ мой». «Познал» уместно для осознания значения исторических деяний, а не только получения сведений.
- source_word: צִדְקוֹת
  choice: праведные деяния
  rationale: Множественное число צדקה здесь обозначает справедливые и верные завету действия Бога. Перевод сохраняет связь с понятием праведности, не сужая смысл исключительно до спасения или суда.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Значение צִדְקוֹת יְהוָה
  choice: праведные деяния Яхве
  alternative: спасительные деяния Яхве; дела праведности Яхве
  rationale: Выражение охватывает справедливые, верные завету поступки Яхве в истории, включая избавление и водительство Израиля. «Праведные деяния» сохраняет широту смысла и богословское напряжение между праведностью, верностью и спасением.
- issue: Связь выражения «от Шиттима до Галгала» с окружающими частями стиха
  choice: сохранено как обособленное эллиптическое выражение
  alternative: 'явно дополнить: «вспомни, что произошло от Шиттима до Галгала»'
  rationale: В еврейском тексте нет выраженного глагола при географической формуле. Добавление «что произошло» сделало бы подразумеваемую связь однозначной, поэтому перевод сохраняет лаконичность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи, но без устаревших форм. Частица «же» передаёт настойчивость обращения естественнее, чем разговорное «пожалуйста» или архаичное «ныне». Эллиптическая географическая формула сохранена и обособлена тире.
