lexical_decisions:
- source_word: וְגַם
  choice: Поэтому и
  rationale: Связка продолжает мысль предыдущих обвинений и вводит ответный суд; «поэтому» передаёт контекстуальное следствие, а «и» сохраняет добавочное усиление גַם.
- source_word: אֲנִי
  choice: Я
  rationale: 'Явно выраженное местоимение сохранено и выделено прописной буквой согласно русской библейской традиции: Сам Господь совершает суд.'
- source_word: הֶחֱלֵיתִי
  choice: начал
  rationale: В сочетании с инфинитивом הַכּוֹתֶךָ форма естественно понимается инцептивно — «начал поражать». Возможное каузативное значение «сделал больным/изнурил» сохранено в примечании.
- source_word: הַכּוֹתֶךָ
  choice: поражать тебя
  rationale: Инфинитив от נכה передаёт карательное действие. «Поражать» звучит достойно и естественно в современном русском библейском тексте, не будучи столь архаичным, как «разить».
- source_word: הַשְׁמֵם
  choice: опустошая тебя
  rationale: Форма Hiphil от שמם выражает доведение до запустения или разорения; деепричастие естественно связывает это действие с поражением и сохраняет суровость суда.
- source_word: עַל
  choice: за
  rationale: Предлог вводит основание наказания. Русское «за твои грехи» кратко и ясно выражает причинно-судебное отношение.
- source_word: חַטֹּאתֶךָ
  choice: твои грехи
  rationale: Множественное число отражает форму и контекст нескольких перечисленных нарушений завета.
theological_decisions:
- issue: Смысл выражения הֶחֱלֵיתִי הַכּוֹתֶךָ о Божьем суде
  choice: «начал поражать тебя»
  alternative: «сделал тебя больным, поражая тебя»
  rationale: Инцептивное понимание хорошо соответствует конструкции с последующим инфинитивом и передаёт начавшийся Божий суд, не сводя образ к телесной болезни. Подлинная лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и прям; сохранены эмфатическое «и Я», образ поражения и причинная связь наказания с грехами.
