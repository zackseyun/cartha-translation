  text: Поэтому и Я начал поражать тебя и опустошать тебя за твои грехи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я сделал тебя больным, поражая тебя». Еврейский глагол может также означать «сделать больным» или «изнурить».'
