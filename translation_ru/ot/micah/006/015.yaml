source:
  edition: WLC
  text: אַתָּ֥ה תִזְרַ֖ע וְ/לֹ֣א תִקְצ֑וֹר אַתָּ֤ה תִדְרֹֽךְ זַ֨יִת֙ וְ/לֹא תָס֣וּךְ שֶׁ֔מֶן וְ/תִיר֖וֹשׁ וְ/לֹ֥א תִשְׁתֶּה יָּֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/015.yaml
  text: You will sow[a], but you will not reap; you will tread olives, but you will not anoint yourself with oil; and you will tread out new wine, but you will not drink wine.
translation:
  language: ru
  text: Ты будешь сеять, но не пожнёшь; будешь давить оливки, но не умастишься маслом; будешь давить виноград для молодого вина[a], но вина не выпьешь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте после слов «будешь давить оливки» буквально стоит «и молодое вино»; отдельный глагол во второй части отсутствует и, вероятно, подразумевается тот же глагол «давить».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  choice: будешь сеять
  rationale: Глагол זרע обычно означает посев семян; «сеять» сохраняет земледельческий образ и естественно противопоставляется жатве.
- source_word: תִקְצוֹר
  choice: не пожнёшь
  rationale: קצר — обычный глагол жатвы. «Не пожнёшь» точно передаёт результат напрасного посева и сохраняет связь «сеять — жать».
- source_word: תִדְרֹךְ זַיִת
  choice: будешь давить оливки
  rationale: דרך буквально означает «топтать, давить ногами». В данном производственном контексте современное русское «давить оливки» ясно передаёт действие без неуместного впечатления, будто речь идёт о простом хождении по ним.
- source_word: תָסוּךְ שֶׁמֶן
  choice: маслом не натрёшься
  rationale: סוך обозначает нанесение масла на тело. «Натереться маслом» естественно для современного русского языка и передаёт лишение возможности лично пользоваться полученным маслом.
- source_word: תִירוֹשׁ
  choice: молодое вино
  rationale: תירוש обозначает свежее вино или виноградное сусло. «Молодое вино» сохраняет широкий смысл термина и не сужает его до безалкогольного виноградного сока.
- source_word: וְתִירוֹשׁ
  choice: будешь давить виноград для молодого вина[a]
  rationale: Перед תירוש в еврейском тексте нет отдельного глагола; действие דרך из предыдущей части подразумевается и по-русски выражено явно. Упоминание винограда раскрывает естественный объект давки, тогда как תירוש называет получаемый продукт; буквальная форма отмечена в сноске.
- source_word: תִשְׁתֶּה יָּיִן
  choice: вина не выпьешь
  rationale: יין — обычное слово «вино». Такая формулировка кратко и ясно передаёт невозможность воспользоваться плодом своего труда.
- source_word: אַתָּה
  choice: ты
  rationale: Повторённое местоимение подчёркивает прямое обращение. В русском его достаточно выразить в начале стиха, поскольку повтор перед каждой частью звучал бы тяжеловесно, а формы второго лица сохраняют адресность.
theological_decisions:
- issue: Характер образа суда
  choice: Суд изображён как тщетный земледельческий труд и лишение возможности пользоваться его плодами.
  alternative: Общее несчастье без связи с формулами заветного проклятия.
  rationale: 'Стих использует характерную модель проклятия: человек трудится, но не получает и не вкушает плодов. Перевод сохраняет этот суровый образ, не добавляя в основной текст отсутствующего пояснения о завете.'
translation_notes:
  register: Современный литературный русский язык с сохранением краткого пророческого параллелизма. Выбраны понятные земледельческие выражения без архаизмов; повтор «будешь» поддерживает ритм, а противопоставления с «но» ясно передают тщетность труда.
