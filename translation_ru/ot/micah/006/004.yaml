base_translation:
  language: en
  yaml_path: translation/ot/micah/006/004.yaml
  text: For I brought you up from the land of Egypt[a], and from the house of slavery I redeemed you; and I sent before you Moses, Aaron, and Miriam.
translation:
  language: ru
  text: Ибо Я вывел тебя из земли Египта и выкупил тебя из дома рабства; Я послал впереди тебя Моисея, Аарона и Мариам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт обосновывающую связь с предшествующим обращением Господа и звучит естественно в современном русском языке.
- source_word: הֶעֱלִתִיךָ
  choice: Я вывел тебя
  rationale: В контексте исхода каузатив глагола עלה идиоматически обозначает выведение из Египта; буквальное «поднял» по-русски было бы неестественным и могло бы затемнить смысл.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохраняет традиционное достоинство библейской формулы и точно передаёт исходный предложный оборот.
- source_word: מִבֵּית עֲבָדִים
  choice: из дома рабства
  rationale: Естественный русский эквивалент еврейской идиомы «дом рабов», ясно обозначающий состояние, из которого был избавлен Израиль.
- source_word: פְּדִיתִיךָ
  choice: выкупил тебя
  rationale: Глагол פדה несёт значение выкупа и освобождения; «выкупил» сохраняет конкретный образ, не сводя его к более общему «спас».
- source_word: וָאֶשְׁלַח
  choice: Я послал
  rationale: Прямой и естественный эквивалент глагола שלח; повторение подлежащего уместно после точки с запятой.
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Сохраняет пространственно-представительное значение еврейского выражения, не устраняя возможный оттенок «впереди тебя».
- source_word: אֶת מֹשֶׁה אַהֲרֹן וּמִרְיָם
  choice: Моисея, Аарона и Мариам
  rationale: Передаёт все три имени; форма «Мариам» соответствует принятой русской библейской передаче имени сестры Моисея.
theological_decisions:
- issue: Передача עֲבָדִים в формуле исхода
  choice: рабство
  alternative: рабы («дом рабов»)
  rationale: Хотя еврейское слово имеет форму множественного числа «рабы», всё выражение בֵּית עֲבָדִים является идиомой, которую по-русски естественнее и яснее передать как «дом рабства»; реальность подневольного состояния сохраняется.
- issue: Передача פדה
  choice: выкупил
  alternative: искупил / избавил
  rationale: «Выкупил» удерживает образ освобождения посредством выкупа и не навязывает этому стиху более позднюю богословскую конкретизацию; «избавил» менее точно, а «искупил» в современном русском сильнее ассоциируется с иной богословской рамкой.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис остаётся близким к еврейскому, но избегает неестественных калек. Обращение к Израилю передано единственным числом «тебя/тобой», как в оригинале.
