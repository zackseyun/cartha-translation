source:
  edition: WLC
  text: שִׁמְע֤וּ הָרִים֙ אֶת רִ֣יב יְהוָ֔ה וְ/הָ/אֵתָנִ֖ים מֹ֣סְדֵי אָ֑רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם עַמּ֔/וֹ וְ/עִם יִשְׂרָאֵ֖ל יִתְוַכָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/002.yaml
  text: Hear[a], O mountains, the case of Yahweh, and you enduring foundations of the earth; for Yahweh has a case against his people[c][b], and he will contend with Israel.
translation:
  language: ru
  text: Слушайте, горы, тяжбу Яхве; слушайте и вы, прочные[a] основания земли! Ведь у Яхве тяжба с Его народом,[b] и с Израилем Он будет судиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крепкие», «древние» или «извечные основания земли».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с Его народом»; в судебном контексте это может означать «против Его народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения множественного числа; «слушайте» естественно передаёт пророческий призыв, обращённый к горам и основаниям земли.
- source_word: הָרִים
  choice: горы
  rationale: Прямое обращение к творению как к свидетелям тяжбы; звательная интонация в русском передаётся синтаксисом без частицы.
- source_word: רִיב
  choice: тяжба
  rationale: 'Слово имеет судебно-заветный оттенок: спор, разбирательство, обвинительное дело. «Тяжба» сохраняет юридическую образность и хорошо сочетается с «судиться» во второй строке.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: הָאֵתָנִים
  choice: несокрушимые
  rationale: Прилагательное обозначает прочность, постоянство и устойчивость. «Несокрушимые» естественно характеризует основания земли, не сводя значение только к древности.
- source_word: מֹסְדֵי אָרֶץ
  choice: основания земли
  rationale: Конструктивное сочетание обозначает основания земли; космический образ соответствует параллельному обращению к горам.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для призыва слушать; «ведь» естественно выражает пояснительно-причинную связь.
- source_word: עִם עַמּוֹ
  choice: с Его народом
  rationale: Предлог буквально означает «с». Русское сочетание «тяжба с кем-либо» одновременно естественно и сохраняет формальную неоднозначность, не заменяя её однозначным «против».
- source_word: יִתְוַכָּח
  choice: будет судиться
  rationale: Hitpael глагола יכח в данном контексте обозначает судебное прение или ведение дела; «будет судиться» сохраняет юридическую рамку и параллель с רִיב.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятая русская форма имени народа завета.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Характер тяжбы Яхве с народом
  choice: с Его народом
  alternative: против Его народа
  rationale: Контекст явно судебный и допускает противительную окраску, однако еврейский предлог עִם буквально означает «с». Русское «тяжба с» передаёт обе стороны смысла без излишнего уточнения.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Судебная образность последовательно передана словами «тяжба» и «судиться». Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской норме.
