lexical_decisions:
- source_word: עוֹד
  choice: всё ещё
  rationale: Передаёт продолжающееся наличие осуждаемых злоупотреблений.
- source_word: הַאִשׁ
  choice: неужели … есть
  rationale: Трудная форма понята как вопросительная; «неужели» естественно передаёт риторический и обличительный характер вопроса.
- source_word: בֵּית רָשָׁע
  choice: в доме нечестивца
  rationale: Сохраняет единственное число и обозначает дом или хозяйство нечестивого человека.
- source_word: אֹצְרוֹת רֶשַׁע
  choice: богатства, нажитые нечестием
  rationale: Передаёт как материальный смысл אֹצְרוֹת, так и наиболее вероятную связь с רֶשַׁע — имущество, накопленное неправедным путём.
- source_word: אֵיפַת
  choice: ефа
  rationale: Сохраняет конкретное название древней меры; значение поясняется в сноске.
- source_word: רָזוֹן
  choice: неполная
  rationale: В торговом контексте обозначает заниженную, недостаточную меру; «неполная» ясно выражает обман покупателя.
- source_word: זְעוּמָה
  choice: проклятая
  rationale: Сохраняет сильную оценку предмета как осуждённого и навлекающего проклятие, не ослабляя её до простого неодобрения.
theological_decisions:
- issue: Вопросительный характер начальной фразы при трудности еврейского текста
  choice: 'Риторический вопрос: «Неужели всё ещё есть…?»'
  alternative: Утвердительное высказывание о том, что неправедно нажитое богатство по-прежнему находится в доме нечестивца.
  rationale: Вопросительное прочтение соответствует обличительной последовательности вопросов в ближайшем контексте, особенно следующему стиху, но не превращается в отдельное вероучительное утверждение.
- issue: Связь слов в выражении אֹצְרוֹת רֶשַׁע
  choice: «богатства, нажитые нечестием»
  alternative: 'Более буквально: «сокровища нечестия».'
  rationale: Контекст обмана мерой указывает на неправедное происхождение богатства; формулировка остаётся нравственно сильной и понятной современному читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обличения. Синтаксис сделан естественным, а конкретный древний термин «ефа» сохранён и пояснён в сноске.
