id: MIC.6.6
reference: Micah 6:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בַּ/מָּה֙ אֲקַדֵּ֣ם יְהוָ֔ה אִכַּ֖ף לֵ/אלֹהֵ֣י מָר֑וֹם הַ/אֲקַדְּמֶ֣/נּוּ בְ/עוֹל֔וֹת בַּ/עֲגָלִ֖ים בְּנֵ֥י שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/006.yaml
  text: With what shall I come before Yahweh[a], and bow myself before God on high? Shall I come before him with burnt offerings, with year-old calves?
translation:
  language: ru
  text: С чем мне предстать перед Яхве и склониться перед Богом в вышине?[a] Предстать ли мне перед Ним со всесожжениями, с годовалыми телятами?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Всевышним Богом». Буквально: «перед Богом вышины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמָּה
  choice: С чем
  rationale: Передаёт вопрос о средстве или приношении, с которым человек может приблизиться к Богу; это естественная и точная русская формулировка.
- source_word: אֲקַדֵּם / הַאֲקַדְּמֶנּוּ
  choice: предстать перед / предстать перед Ним
  rationale: Глагол קדם здесь означает выйти навстречу или явиться перед кем-либо. «Предстать перед» соответствует контексту поклонения и позволяет сохранить риторическое повторение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אִכַּף
  choice: склониться
  rationale: Передаёт выраженное формой нифаль телесное движение — низко склониться в почтении, — не сводя его только к внутреннему смирению.
- source_word: לֵאלֹהֵי מָרוֹם
  choice: перед Богом в вышине
  rationale: Сохраняет образ высоты и возвышенности Бога, не превращая описательное выражение в однозначно закреплённый титул.
- source_word: בְעוֹלוֹת
  choice: со всесожжениями
  rationale: «Всесожжение» — точный и принятый русский эквивалент названия жертвы עוֹלָה; множественное число сохранено.
- source_word: בַּעֲגָלִים בְּנֵי שָׁנָה
  choice: с годовалыми телятами
  rationale: Кратко и естественно передаёт телят, достигших годовалого возраста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблено личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Следует ли понимать מָרוֹם как титул «Всевышний»
  choice: Бог в вышине
  alternative: Всевышний Бог; возвышенный Бог
  rationale: Конструкция אֱלֹהֵי מָרוֹם буквально описывает Бога как Бога высоты или пребывающего в вышине; описательный перевод сохраняет образ и не навязывает чтение как устойчивого титула.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но ясным богослужебным звучанием. Повтор «предстать перед» намеренно сохраняет риторическую структуру еврейского текста.
