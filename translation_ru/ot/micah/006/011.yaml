  text: Shall I acquit one with wicked scales and with a bag of deceptive weights?[a][b]
translation:
  language: ru
  text: Разве Я оправдаю того, кто пользуется нечестными весами и держит в мешке обманные гири?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве Я могу быть чистым (невиновным), когда есть нечестные весы и мешок обманных гирь?» Еврейский глагол может означать «быть чистым, невиновным» либо «считать невиновным, оправдать». В контексте судебной речи вероятно последнее значение, однако синтаксис допускает и первое понимание.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «камни обмана»; имеются в виду каменные гири, использовавшиеся при торговом взвешивании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶזְכֶּה
  choice: Разве Я оправдаю
  rationale: Вопросительная форма глагола זכה допускает значения «быть чистым» и «признать невиновным, оправдать». В контексте судебной тяжбы Господа естественнее судебный смысл; «разве» передаёт риторический вопрос, предполагающий отрицательный ответ.
- source_word: בְּמֹאזְנֵי רֶשַׁע
  choice: у кого неверные весы
  rationale: מֹאזְנַיִם — торговые весы, а רֶשַׁע характеризует их как порочные или неправедные. «Неверные весы» ясно и естественно обозначает средство торгового обмана, сохраняя нравственную оценку.
- source_word: וּבְכִיס
  choice: и мешок с
  rationale: כִּיס здесь обозначает мешок или суму торговца, в которой хранились гири. «Мешок» — понятное современное соответствие.
- source_word: אַבְנֵי מִרְמָה
  choice: обманными гирями
  rationale: 'Буквально «камни обмана»: камни служили гирями при взвешивании. Контекстуальное «гири» сразу раскрывает назначение предметов, а «обманные» передаёт מִרְמָה.'
theological_decisions:
- issue: Субъект и смысл риторического вопроса
  choice: 'Говорит Господь: Он спрашивает, может ли оправдать человека, пользующегося нечестными мерами.'
  alternative: Говорящий спрашивает, может ли сам оставаться чистым при наличии нечестных весов.
  rationale: Контекст Михея 6 представляет судебную тяжбу Господа с народом, поэтому первое лицо наиболее вероятно относится к Богу, а глагол имеет судебный смысл. При этом неоднозначность формы отмечена в сноске.
- issue: Не выраженный в еврейском тексте объект оправдания
  choice: «того, у кого» добавлено для ясного русского синтаксиса и отмечено сноской.
  alternative: «Разве Я буду чист с неверными весами…» без подразумеваемого человеческого объекта.
  rationale: В судебном прочтении русскому глаголу «оправдаю» необходим объект, но в еврейском он прямо не назван. Сноска сохраняет осведомлённость читателя об этой особенности и альтернативном разборе.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавное «Я» указывает на Господа как говорящего. Формулировка сохраняет краткость и силу риторического вопроса; обе подлинные смысловые возможности הַאֶזְכֶּה представлены в тексте и сноске.
