id: MIC.6.1
reference: Micah 6:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁמְעוּ נָ֕א אֵ֥ת אֲשֶׁר יְהוָ֖ה אֹמֵ֑ר ק֚וּם רִ֣יב אֶת הֶ/הָרִ֔ים וְ/תִשְׁמַ֥עְנָה הַ/גְּבָע֖וֹת קוֹלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/001.yaml
  text: 'Hear now what Yahweh says: Arise[a], contend before the mountains, and let the hills hear your voice.'
translation:
  language: ru
  text: 'Послушайте же, что говорит Яхве: «Встань, веди тяжбу перед горами[a], и пусть холмы услышат твой голос».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «веди тяжбу с горами» либо «выдвини обвинение против гор». Еврейский глагол имеет судебный оттенок; по контексту горы, вероятнее всего, призываются как свидетели в тяжбе Яхве с Его народом.'
    reason: Лексическая и синтаксическая неоднозначность сочетания רִיב אֶת.
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: Послушайте же
  rationale: Императив שׁמע требует внимательного слушания, а נָא придаёт призыву настойчивость; частица «же» естественно передаёт этот оттенок в современной литературной русской речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֹמֵר
  choice: говорит
  rationale: Причастие вводит непосредственную пророческую речь; настоящее время естественно по-русски.
- source_word: קוּם
  choice: Встань
  rationale: Императив призывает адресата подняться и приступить к действию; «встань» ясно и не архаично.
- source_word: רִיב
  choice: веди тяжбу
  rationale: Глагол имеет оттенок судебного спора; эта формулировка сохраняет юридическую образность, не уточняя без необходимости, кто именно выступает ответчиком.
- source_word: אֶת הֶהָרִים
  choice: перед горами
  rationale: 'При ריב конструкция допускает неоднозначность: спор может вестись с горами либо перед ними. Контекст следующего стиха поддерживает роль гор как свидетелей, поэтому в тексте выбрано «перед», а альтернатива отмечена в сноске.'
- source_word: וְתִשְׁמַעְנָה
  choice: и пусть ... услышат
  rationale: Имперфект после императива имеет побудительно-желательное продолжение, естественно передаваемое конструкцией «пусть».
- source_word: הַגְּבָעוֹת
  choice: холмы
  rationale: Прямой географический эквивалент, сохраняющий поэтический параллелизм с горами.
- source_word: קוֹלֶךָ
  choice: твой голос
  rationale: Буквальное и идиоматичное обозначение звучащей речи адресата.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Роль гор в сцене заветного суда
  choice: тяжба ведётся перед горами как свидетелями
  alternative: тяжба ведётся с горами или против гор
  rationale: Форма אֶת допускает понимание гор как стороны спора, однако параллельное повеление холмам слушать и продолжение судебной сцены благоприятствуют роли свидетелей. Неоднозначность сохранена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой судебной речи. «Послушайте же» передаёт настойчивый призыв без архаизации; «вести тяжбу» сохраняет юридическую метафору. Число адресатов исходного текста сохранено: сначала множественное «послушайте», затем единственное «встань/твой».'
