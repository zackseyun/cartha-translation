lexical_decisions:
- source_word: אֲשֶׁר
  choice: ведь
  rationale: В данном контексте частица связывает обвинение с предшествующими словами о городе и может иметь пояснительно-причинный оттенок. «Ведь» естественно передаёт эту связь в русском тексте, не превращая стих в зависимое относительное предложение.
- source_word: עֲשִׁירֶיהָ
  choice: её богачи
  rationale: Форма мужского рода во множественном числе с суффиксом 3-го лица женского рода обозначает богатых людей города, прежде всего его состоятельную верхушку. «Богачи» кратко и естественно сохраняет социально-обличительный оттенок.
- source_word: מָלְאוּ חָמָס
  choice: полны насилия
  rationale: Оборот описывает устойчивое состояние или достигнутый результат. חָמָס охватывает насилие, притеснение и жестокое беззаконие; «насилие» сохраняет основной и наиболее прямой смысл.
- source_word: וְיֹשְׁבֶיהָ
  choice: её жители
  rationale: Субстантивированное причастие обозначает живущих в городе. «Жители» передаёт коллективный смысл ясно и современно.
- source_word: דִּבְּרוּ שָׁקֶר
  choice: говорят ложь
  rationale: Хотя глагол имеет форму перфекта, в пророческом обвинении он характеризует обычное поведение жителей. Настоящее время по-русски естественно выражает эту постоянную практику.
- source_word: וּלְשׁוֹנָם רְמִיָּה
  choice: язык у них во рту — сама ложь
  rationale: Именное предложение буквально отождествляет язык с обманом или ложью, а не просто называет его лживым. Выражение «сама ложь» сохраняет силу метафоры и естественно звучит по-русски.
- source_word: בְּפִיהֶם
  choice: у них во рту
  rationale: Перевод сохраняет конкретный образ и коллективное единственное число существительного «рот» при множественном обладателе, приемлемое в русском языке.
