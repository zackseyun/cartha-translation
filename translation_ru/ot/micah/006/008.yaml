base_translation:
  language: en
  yaml_path: translation/ot/micah/006/008.yaml
  text: He has told you[a], O man, what is good; and what does Yahweh require of you but to do justice, and to love steadfast love[b], and to walk humbly with your God?
translation:
  language: ru
  text: Он сказал тебе, человек[a], что есть добро. Чего же Яхве требует от тебя? Только поступать справедливо, любить милость[b] и смиренно ходить с твоим Богом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово стоит в единственном числе: обращение к одному человеку имеет здесь обобщающий смысл и относится к людям вообще.'
    reason: cultural_note
  - marker: b
    text: 'Или: «доброту», «верную любовь» или «верность». Еврейское חֶסֶד обозначает милосердную доброту и устойчивую преданность в отношениях.'
    reason: lexical_alternative
  - marker: c
    text: Редкую еврейскую форму הַצְנֵעַ можно также понимать как «скромно» или «осмотрительно».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד
  choice: Он открыл
  rationale: Порода hифиль глагола נגד означает «сообщить, дать знать, возвестить». «Открыл» естественно передаёт уже данное Богом нравственное наставление, сохраняющее силу в настоящем.
- source_word: אָדָם
  choice: человек
  rationale: Единственное число сохраняет прямое обращение к отдельному слушателю, который здесь представляет человека вообще.
- source_word: טּוֹב
  choice: добро
  rationale: Широкое нравственное значение слова не следует сужать до «правильного» или «полезного».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога посредством общепринятой научной реконструкции отличает его от титула «Господь».
- source_word: דּוֹרֵשׁ מִמְּךָ
  choice: требует от тебя
  rationale: В данном контексте דרש с מן обозначает то, чего Бог ожидает и требует от человека.
- source_word: כִּי אִם
  choice: только
  rationale: 'Оборот вводит исчерпывающий ответ на риторический вопрос: требуется не что иное, как перечисленное далее.'
- source_word: עֲשׂוֹת מִשְׁפָּט
  choice: поступать справедливо
  rationale: Формулировка естественно передаёт деятельный смысл עשה и нравственно-общественный смысл מִשְׁפָּט.
- source_word: אַהֲבַת חֶסֶד
  choice: любить верность
  rationale: Сохраняется буквальное сочетание «любить» с многозначным חֶסֶד; «верность» подчёркивает постоянство и преданность в отношениях, не сводя слово лишь к чувству жалости.
- source_word: הַצְנֵעַ לֶכֶת
  choice: смиренно ходить
  rationale: Передаёт образ жизненного пути и обычное контекстуальное понимание редкой формы הַצְנֵעַ, при этом возможные оттенки скромности и осмотрительности отмечены в сноске.
- source_word: עִם אֱלֹהֶיךָ
  choice: с твоим Богом
  rationale: Прямо сохраняет значение предлога עִם («с») и личный, совместный характер описанного хождения.
theological_decisions:
- issue: Передача חֶסֶד
  choice: верность
  alternative: милость; доброта; преданная любовь; верность завету
  rationale: חֶסֶד соединяет доброту, милость и постоянную преданность в отношениях. «Верность» кратко передаёт устойчивый реляционный смысл, а сноска сохраняет более широкий диапазон слова.
- issue: Обобщающее обращение אָדָם
  choice: человек
  alternative: люди; человечество
  rationale: Еврейский текст обращается к одному человеку, представляющему людей вообще. Единственное число сохранено, а его обобщающая функция пояснена в сноске.
- issue: Значение הַצְנֵעַ
  choice: смиренно
  alternative: скромно; осмотрительно
  rationale: Традиционное контекстуальное понимание хорошо согласуется с требуемой позицией человека перед Богом, но редкость формы не позволяет исключить оттенки скромности или осмотрительности; они указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; образ «ходить с Богом» сохранён как значимая метафора образа жизни. Личное имя יהוה передано как «Яхве».
