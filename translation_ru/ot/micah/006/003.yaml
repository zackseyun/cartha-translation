base_translation:
  language: en
  yaml_path: translation/ot/micah/006/003.yaml
  text: My people[b][a], what have I done to you? How have I wearied you? Answer me.
translation:
  language: ru
  text: Народ Мой, что Я сделал тебе? Чем Я утомил тебя?[a] Ответь Мне.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Чем Я обременил тебя?»
    reason: lexical_alternative
  - marker: b
    text: Или «Возрази Мне» или «Свидетельствуй против Меня» — если здесь подразумевается судебное разбирательство.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: Народ Мой
  rationale: Форма с суффиксом первого лица употреблена как обращение; «Народ Мой» естественно передаёт личное и заветное обращение Бога к Израилю.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: что Я сделал тебе?
  rationale: Прямо передаёт вопросительное מֶה, перфект первого лица глагола עשה и направленность действия, выраженную предлогом לְ.
- source_word: וּמָה הֶלְאֵתִיךָ
  choice: Чем Я утомил тебя?
  rationale: Глагол לאה в породе хифиль означает «утомить, сделать усталым». Русское «чем» естественно оформляет вопрос о том, каким действием Бог якобы утомил народ.
- source_word: עֲנֵה בִּי
  choice: Ответь Мне
  rationale: Императив עֲנֵה передан прямым повелением. В основном тексте בִּי истолковано как указание на того, кому следует ответить; возможный состязательный, судебный оттенок сохранён в сноске.
theological_decisions:
- issue: Заветно-судебный оттенок обращения Бога к Израилю
  choice: Сохранить непосредственный личный призыв без добавления судебной терминологии в основной текст.
  alternative: «Ответь против Меня» или «Свидетельствуй против Меня».
  rationale: Контекст допускает картину судебного разбирательства, однако сочетание עֲנֵה בִּי само по себе не требует явно состязательного перевода. Сноска сохраняет эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткими, торжественными риторическими вопросами. Обращение «Народ Мой» и прописные местоимения поддерживают традиционно-библейский, но понятный современному читателю регистр.
