  text: And the mountains will melt beneath him, and the valleys will split open, like wax before the fire, like waters poured down a slope.
translation:
  language: ru
  text: 'И растают горы под Ним,

    и разверзнутся долины,

    как воск перед огнём,

    как воды, льющиеся по склону.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָמַסּוּ
  choice: и растают
  rationale: Глагол נמס обозначает таяние или растворение; «растают» естественно по-русски и непосредственно связано с последующим сравнением с воском.
- source_word: הֶהָרִים
  choice: горы
  rationale: Определённый артикль учтён контекстуально; в русском поэтическом предложении естественно сказать «горы» без указательного уточнения.
- source_word: תַּחְתָּיו
  choice: под Ним
  rationale: Местоименный суффикс относится к Господу из предыдущего стиха. «Под Ним» сохраняет связь стихов и образ творения, содрогающегося при Его шествии.
- source_word: וְהָעֲמָקִים
  choice: и долины
  rationale: עֲמָקִים обычно обозначает долины или низменные, глубокие места; «долины» образует естественную пару с горами.
- source_word: יִתְבַּקָּעוּ
  choice: расселятся
  rationale: Форма передаёт раскалывание, разверзание. «Расселятся» — современное, выразительное и не чрезмерно пояснительное соответствие.
- source_word: כַּדּוֹנַג
  choice: как воск
  rationale: Прямое и естественное воспроизведение сравнения.
- source_word: מִפְּנֵי הָאֵשׁ
  choice: перед огнём
  rationale: 'Сохраняет пространственно-причинный образ еврейского выражения: воск тает, оказавшись перед огнём, от его жара.'
- source_word: כְּמַיִם
  choice: как вода
  rationale: Хотя в еврейском стоит форма множественного числа, русский обычно употребляет вещественное существительное «вода» в единственном числе; это сохраняет образ без неестественной архаизации.
- source_word: מֻגָּרִים
  choice: льющаяся
  rationale: Пассивное причастие от נגר описывает воду, которую изливают или заставляют течь. В сочетании со склоном «льющаяся» передаёт наблюдаемый поток естественным русским языком.
- source_word: בְּמוֹרָד
  choice: по склону
  rationale: מוֹרָד означает спуск или склон. Русское «по склону» вместе с глаголом «льющаяся» ясно выражает движение вниз.
theological_decisions:
- issue: К кому относится местоимение в выражении «под Ним»
  choice: Местоимение относится к Господу, Который выходит и ступает по высотам земли в Мих 1:3.
  alternative: Заменить местоимение именем «Господь», явно обозначив референта.
  rationale: Еврейский текст сохраняет местоимение и связность с предыдущим стихом. Перевод «под Ним» не добавляет отсутствующего повторения имени и сохраняет изображение реакции творения на Его пришествие.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Сохранены параллельные строки и два сравнения. Заглавная буква в «Ним» помогает современному читателю распознать отсылку к Господу из предыдущего стиха, не заменяя местоимение именем.
