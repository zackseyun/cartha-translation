    issue: «Расселятся» для יִתְבַּקָּעוּ
    rationale: Глагол «расселиться» в современном употреблении преимущественно относится к людям, населению либо разъезду по разным местам. Он не передаёт отчётливо разрывание или раскрытие долин. «Разверзнутся» сохраняет поэтическую силу и смысл разлома.
  - severity: low
    issue: «Как вода, льющаяся» вместо образа «вод»
    rationale: Русское вещественное единственное число возможно, но еврейское множественное число рисует потоки вод. Множественное «воды, льющиеся» естественно в литературно-поэтическом регистре и лучше сохраняет образ.
