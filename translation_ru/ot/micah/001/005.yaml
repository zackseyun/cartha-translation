source:
  edition: WLC
  text: בְּ/פֶ֤שַׁע יַֽעֲקֹב֙ כָּל זֹ֔את וּ/בְ/חַטֹּ֖אות בֵּ֣ית יִשְׂרָאֵ֑ל מִֽי פֶ֣שַׁע יַעֲקֹ֗ב הֲ/לוֹא֙ שֹֽׁמְר֔וֹן וּ/מִי֙ בָּמ֣וֹת יְהוּדָ֔ה הֲ/ל֖וֹא יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/005.yaml
  text: All this is because of Jacob’s transgression[a], and because of the sins of the house of Israel[b]. What is Jacob’s transgression? Is it not Samaria? And what are the high places of Judah? Are they not Jerusalem?
translation:
  language: ru
  text: Всё это — из-за преступления Иакова[a] и из-за грехов дома Израиля. Что такое преступление Иакова? Разве не Самария? И что такое высоты Иуды[b]? Разве не Иерусалим?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мятеж»; то же слово употреблено во втором случае.'
    reason: lexical_alternative
  - marker: b
    text: «Высоты» — возвышенные места поклонения, часто связанные с недозволенным или идолопоклонническим культом.
    reason: cultural_note
lexical_decisions:
- source_word: בְּפֶשַׁע / פֶשַׁע
  choice: из-за отступничества / отступничеством
  rationale: Предлог בְּ в контексте выражает причину грядущего суда. פֶּשַׁע обозначает сознательное нарушение верности Богу, бунт или отступничество; выбранный вариант передаёт заветно-нравственную силу слова и последовательно употреблён в обоих случаях.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Сохранено данное в еврейском тексте имя, не заменённое на «Израиль», чтобы передать параллелизм с выражением «дом Израиля».
- source_word: כָּל־זֹאת
  choice: Всё это
  rationale: Естественное указание на предшествующее описание суда без внесения поясняющего существительного, отсутствующего в оригинале.
- source_word: וּבְחַטֹּאות
  choice: из-за грехов
  rationale: Предлог, как и в первой строке, понят причинно; חַטֹּאות в данном обвинительном контексте означает грехи, а не жертвы за грех.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Формально сохранено заветно-национальное выражение и его поэтическая связь с «Иаковом».
- source_word: מִי פֶשַׁע יַעֲקֹב
  choice: Что является отступничеством Иакова?
  rationale: Еврейское מִי буквально означает «кто», однако вопрос отождествляет отступничество с городом как его средоточием. В русском «что является» естественнее, при этом метонимическое отождествление не разъясняется в самом тексте.
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Традиционная русская форма названия столицы Северного царства.
- source_word: בָּמוֹת
  choice: святилища на высотах
  rationale: Так передаётся не просто возвышенный рельеф, а места поклонения, часто связанные в библейском контексте с недозволенным или идолопоклонническим культом.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Традиционное русское название племени и царства.
- source_word: הֲלוֹא
  choice: Не … ли?
  rationale: Отрицательный риторический вопрос естественно передаёт частицу, предполагающую утвердительный ответ.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Традиционная русская форма названия города.
theological_decisions:
- issue: Отождествление отступничества Иакова и высот Иуды со столицами
  choice: Сохранены риторические вопросы, в которых Самария и Иерусалим названы воплощением или средоточием греха и недозволенного поклонения.
  alternative: 'Можно было пояснить: «Где источник отступничества Иакова?» и «Где находятся высоты Иуды?», однако это конкретизировало бы неоднозначную метонимию.'
  rationale: Еврейский текст отвечает названиями столиц и тем самым представляет их как центры, олицетворяющие вину соответствующих царств. Перевод сохраняет напряжённое отождествление, не сводя его лишь к месту или источнику.
- issue: Число в выражении «высоты Иуды»
  choice: 'Сохранено множественное число: «святилища на высотах».'
  alternative: Некоторые переводы сглаживают фразу до единственного числа — «высота Иуды».
  rationale: Масоретский текст содержит форму множественного числа בָּמוֹת; грамматическое напряжение между множественными «высотами» и единственным городом-ответом намеренно не устранено.
translation_notes:
  register: Современный литературный русский язык, сдержанный пророческий регистр. Синтаксис риторических вопросов и повтор ключевого слова сохранены; традиционные библейские топонимы и выражение «дом Израиля» оставлены для узнаваемости и смысловой точности.
