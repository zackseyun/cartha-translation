  text: כִּֽי הִנֵּ֥ה יְהוָ֖ה יֹצֵ֣א מִ/מְּקוֹמ֑/וֹ וְ/יָרַ֥ד וְ/דָרַ֖ךְ עַל במותי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/003.yaml
  text: For look, the LORD is coming out from his place; he will come down and tread on the high places of the earth.
translation:
  language: ru
  text: Ибо вот, ГОСПОДЬ выходит из Своего места; Он сойдёт и ступит на высоты земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ведь вот
  rationale: כִּי связывает стих с предшествующим провозглашением, а הִנֵּה привлекает внимание к грядущему явлению.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона, ясно отличимая типографически как имя Бога.
- source_word: מִמְּקוֹמוֹ
  choice: из Своего жилища
  rationale: מָקוֹם буквально означает «место», но в контексте богоявления речь идёт о месте пребывания Бога; «жилище» естественно передаёт этот смысл без уточнения, что это небо или храм.
- source_word: וְיָרַד
  choice: Он сойдёт
  rationale: Глагол יָרַד передаёт движение вниз; будущее время естественно для русского пророческого возвещения.
- source_word: וְדָרַךְ
  choice: и ступит
  rationale: דָרַךְ означает наступать или ступать; «ступит» сохраняет образ шествия Бога и не усиливает его до явно разрушительного «попирать».
- source_word: עַל במותי אָרֶץ
  choice: на высоты земли
  rationale: במותי — конструктивная форма множественного числа от בָּמָה, способная обозначать возвышенности или культовые высоты. Буквальная передача сохраняет пространственный образ и возможный культовый оттенок.
theological_decisions:
- issue: Место, из которого выходит ГОСПОДЬ
  choice: жилище
  alternative: место
  rationale: «Жилище» выражает контекст богоявления, но не определяет это место как небо, храм или святилище, сохраняя недосказанность исходного текста.
- issue: Значение «высот земли»
  choice: сохранить формулировку без толкования
  alternative: возвышенности земли / святилища земли
  rationale: Слово может обозначать как физические возвышенности, так и культовые места; перевод не должен преждевременно устранять эту многозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Заглавное «Своего» соответствует принятому благоговейному регистру; точка с запятой сохраняет тесную связь двух частей богоявления.
