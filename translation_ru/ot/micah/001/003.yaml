  terminology: «ГОСПОДЬ» последовательно передаёт тетраграмматон. «Высоты земли» удачно сохраняет возможную двусмысленность בָּמוֹת — физические возвышенности и, возможно, культовые высоты — без истолковывающего уточнения. «Место» вместо «жилища» сохраняет исходную неопределённость.
