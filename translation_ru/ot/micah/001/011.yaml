source:
  edition: WLC
  text: עִבְרִ֥י לָ/כֶ֛ם יוֹשֶׁ֥בֶת שָׁפִ֖יר עֶרְיָה בֹ֑שֶׁת לֹ֤א יָֽצְאָה֙ יוֹשֶׁ֣בֶת צַֽאֲנָ֔ן מִסְפַּד֙ בֵּ֣ית הָאֵ֔צֶל יִקַּ֥ח מִ/כֶּ֖ם עֶמְדָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/011.yaml
  text: Pass on[a], naked and in shame, inhabitant of Shaphir. The inhabitant of Zaanan has not come out[c][b]. The lamentation of Beth-ezel will take away from you its support.
translation:
  language: ru
  text: Проходи, обнажённая и опозоренная, жительница Шафира[a][b]. Не вышла жительница Цаанана[a]. Плач Бет-Эцела[a] отнимет у вас опору[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Шафир, Цаанан и Бет-Эцел — названия мест. Вероятно, Михей обыгрывает их звучание или значение: Шафир может напоминать слово «красивый», Цаанан созвучен выражению «вышла», а Бет-Эцел может означать «дом рядом».'
    reason: cultural_note
  - marker: b
    text: 'Или: «Проходи мимо». Повеление может подразумевать уход в изгнание.'
    reason: lexical_alternative
  - marker: c
    text: 'Последняя фраза в еврейском тексте трудна. Возможно также: «Плач Бет-Эцела отнимет у вас место, где можно устоять»; вероятно, имеется в виду утрата близкой поддержки или убежища.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִי לָכֶם
  choice: Проходи своей дорогой
  rationale: Повелительная форма женского рода обращена к олицетворённому городу; сочетание с לָכֶם трудно и, вероятно, идиоматично. Перевод передаёт вынужденное движение, возможно уход в изгнание, не выделяя местоимение неестественной отдельной фразой.
- source_word: יוֹשֶׁבֶת שָׁפִיר
  choice: жительница Шафира
  rationale: Причастие женского рода олицетворяет город; форма «жительница» сохраняет эту грамматическую и поэтическую черту.
- source_word: עֶרְיָה בֹשֶׁת
  choice: обнажённая и опозоренная
  rationale: Переданы оба элемента — нагота и унижение — естественным современным русским выражением.
- source_word: לֹא יָצְאָה
  choice: не вышла
  rationale: 'Буквальный перевод сохраняет неясность: речь может идти о выходе для помощи, битвы, плача или о невозможности покинуть город.'
- source_word: יוֹשֶׁבֶת צַאֲנָן
  choice: жительница Цаанана
  rationale: Сохранено параллельное олицетворение города в женском роде.
- source_word: מִסְפַּד בֵּית הָאֵצֶל
  choice: плач Бет-Эцела
  rationale: מִסְפַּד обозначает траурный плач; родительный оборот намеренно не уточняет, плачут ли в Бет-Эцеле или о нём.
- source_word: יִקַּח מִכֶּם עֶמְדָּתוֹ
  choice: отнимет у вас опору
  rationale: לקח с מן передаёт лишение, а עֶמְדָּתוֹ связано со стоянием, местом или поддержкой. «Опора» естественно выражает вероятный смысл, тогда как трудность и иные возможности отмечены в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Синтаксический параллелизм и олицетворение городов сохранены; игра слов с географическими названиями вынесена в сноску, поскольку естественно воспроизвести её в основном русском тексте невозможно.
