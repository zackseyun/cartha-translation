base_translation:
  language: en
  yaml_path: translation/ot/micah/001/010.yaml
  text: In Gath[a], do not tell it; in Acco, do not weep.[b] In Beth-leaphrah[c], roll yourself in the dust.
translation:
  language: ru
  text: В Гате не рассказывайте об этом; не плачьте вовсе.[a] В Бет-ле-Афре[b] валяйся в пыли.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские слова можно также понять как игру с названием города: «в Акко не плачьте».'
    reason: alternative_reading
  - marker: b
    text: Название Бет-ле-Афра, вероятно, созвучно выражению «дом пыли», что создаёт игру слов со следующей фразой.
    reason: cultural_note
  - marker: c
    text: 'В согласном тексте форма глагола имеет вид первого лица: «я валялся». Здесь её обычно понимают как повеление ввиду контекста.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּגַת
  choice: В Гате
  rationale: Собственное географическое название передано транслитерацией; предлог ב естественно соответствует русскому «в».
- source_word: אַל תַּגִּידוּ
  choice: не рассказывайте об этом
  rationale: Глагол נגד в породе hифиль означает «сообщать, рассказывать, возвещать». Местоименное дополнение передаёт подразумеваемое содержание и сохраняет краткость переклички с 2 Царств 1:20.
- source_word: בָּכוֹ אַל תִּבְכּוּ
  choice: не плачьте вовсе
  rationale: 'Масоретская огласовка понимает בָּכוֹ как абсолютный инфинитив при תִּבְכּוּ, усиливающий запрет: «плакать не плачьте». По-русски это естественно передаётся как «не плачьте вовсе»; возможное прочтение первого слова как топонима Акко отмечено в сноске.'
- source_word: בְּבֵית לְעַפְרָה
  choice: В Бет-Леафре
  rationale: Название поселения сохранено как имя собственное; вероятная игра со значением «дом праха/пыли» пояснена в сноске.
- source_word: עָפָר
  choice: пыль
  rationale: Обычное значение слова — «пыль, прах»; «пыль» естественно сочетается с глаголом «валяться» и сохраняет игру слов с названием Бет-Леафра.
- source_word: התפלשתי
  choice: валяйся
  rationale: По согласному написанию форма выглядит как первое лицо единственного числа «я валялся», однако контекст последовательных обращений поддерживает традиционное повелительное понимание. «Валяйся в пыли» естественно передаёт жест скорби и унижения.
