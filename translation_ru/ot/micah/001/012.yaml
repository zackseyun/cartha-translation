  text: כִּֽי חָ֥לָֽה לְ/ט֖וֹב יוֹשֶׁ֣בֶת מָר֑וֹת כִּֽי יָ֤רַד רָע֙ מֵ/אֵ֣ת יְהוָ֔ה לְ/שַׁ֖עַר יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/012.yaml
  text: For the inhabitant of Maroth writhes for good, because disaster has come down from the LORD to the gate of Jerusalem.
translation:
  language: ru
  text: Ибо жительница Марофа изнемогает в ожидании добра, потому что бедствие сошло от ГОСПОДА к воротам Иерусалима.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלָה לְטוֹב
  choice: изнемогает в ожидании добра
  rationale: Глагол חלה обычно означает «быть слабым, больным, изнемогать»; сочетание с לְטוֹב выражает направленность надежды или ожидания на добро. Перевод сохраняет телесно-эмоциональную силу образа, не сводя его только к тревожному ожиданию.
- source_word: יוֹשֶׁבֶת מָרוֹת
  choice: жительница Марофа
  rationale: Причастие женского рода единственного числа обозначает жительницу или, собирательно, население города. Женский род сохранён; название передано в традиционно узнаваемой русской форме.
- source_word: רָע
  choice: бедствие
  rationale: В данном контексте речь не о нравственном зле, а о несчастье или суде, достигающем города.
- source_word: מֵאֵת יְהוָה
  choice: от ГОСПОДА
  rationale: Предлог указывает на источник бедствия. Тетраграмматон передан принятой заместительной формой «ГОСПОДЬ» с прописным начертанием.
- source_word: לְשַׁעַר יְרוּשָׁלִָם
  choice: к воротам Иерусалима
  rationale: Буквально передаёт предел, до которого дошло бедствие; «ворота» также обозначают подступ к городу, без необходимости добавлять толкование.
theological_decisions:
- issue: Бедствие как исходящее от Бога
  choice: «бедствие сошло от ГОСПОДА»
  alternative: «бедствие постигло… по воле ГОСПОДА»
  rationale: Сохранено прямое утверждение древнееврейского текста об источнике бедствия и пространственный образ «сошло»; причинность не смягчена и не усилена пояснением.
- issue: Значение חָלָה לְטוֹב
  choice: «изнемогает в ожидании добра»
  alternative: «мучительно ждёт добра» / «корчится ради добра»
  rationale: Фраза трудна и допускает оттенки болезненного томления и ожидания. Выбранный вариант сохраняет оба компонента, избегая чрезмерно буквального, но не вполне ясного «корчится ради добра».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм двух причинных предложений сохранён; неоднозначность редкого выражения חָלָה לְטוֹב передана через сочетание изнеможения и ожидания.
