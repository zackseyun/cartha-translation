  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל מִיכָה֙ הַ/מֹּ֣רַשְׁתִּ֔י בִּ/ימֵ֥י יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה אֲשֶׁר חָזָ֥ה עַל שֹׁמְר֖וֹן וִ/ירֽוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/001.yaml
  text: The word of Yahweh that came to Micah the Morashtite in the days of Jotham[a], Ahaz, and Hezekiah, kings of Judah[b], which he saw concerning Samaria and Jerusalem.
translation:
  language: ru
  text: Слово Яхве, пришедшее к Михе, уроженцу Морешета[a], во дни Иоафама, Ахаза и Езекии, царей Иудеи, которое он видел о Самарии и Иерусалиме[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «морешетянин», то есть человек из Морешета.'
    reason: cultural_note
  - marker: b
    text: 'Или: «против Самарии и Иерусалима». Древнееврейский предлог может обозначать как тему пророчества, так и его направленность против названных городов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: Слово Яхве
  rationale: Сохраняет устойчивую формулу пророческого заглавия и передаёт личное имя יהוה транслитерацией «Яхве».
- source_word: אֲשֶׁר הָיָה אֶל
  choice: которое было к
  rationale: Формально и понятно воспроизводит древнееврейскую формулу получения пророческого откровения, не сводя её просто к сообщению.
- source_word: מִיכָה הַמֹּרַשְׁתִּי
  choice: Михе из Морешета
  rationale: Форма «Михе» обусловлена управлением предлога; определение происхождения естественно передано по-русски как «из Морешета».
- source_word: בִּימֵי
  choice: во дни
  rationale: Сохраняет библейскую формулу датировки, оставаясь понятной в современном литературном русском.
- source_word: יוֹתָם אָחָז יְחִזְקִיָּה
  choice: Иоафама, Ахаза и Езекии
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён.
- source_word: מַלְכֵי יְהוּדָה
  choice: царей Иудеи
  rationale: Прямо и естественно передаёт конструктивное сочетание и приложение к перечисленным правителям.
- source_word: אֲשֶׁר חָזָה
  choice: и которое он видел
  rationale: Глагол «видел» сохраняет образ пророческого видения; повтор «которое» проясняет синтаксическую связь со «словом».
- source_word: עַל
  choice: о
  rationale: Передаёт наиболее широкое значение темы пророчества, не исключая возможного направленного против городов смысла.
- source_word: שֹׁמְרוֹן וִירוּשָׁלָם
  choice: Самарии и Иерусалиме
  rationale: Сохранены названные в тексте города без замены их обозначаемыми царствами.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; «Яхве» передаёт его транслитерацией, не заменяя титулом.
- issue: Значение предлога עַל в отношении Самарии и Иерусалима
  choice: о
  alternative: против
  rationale: Предлог допускает обозначение как темы, так и враждебной направленности. Основной текст сохраняет более широкое чтение, а альтернативный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Формула «во дни» сохранена как понятная традиционная датировка; синтаксис слегка прояснён союзом «и», не устраняя смысловой связи между словом и видением.
