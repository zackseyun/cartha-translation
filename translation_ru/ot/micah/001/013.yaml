- from: Запрягай быстрого коня в колесницу[a], жительница Лахиша! Она стала началом греха для дочери Сиона[b][c], потому что в тебе обнаружились преступления Израиля[d].
  to: Запрягай колесницу быстрым конём[a], жительница Лахиша! Она была началом греха для дочери Сиона[b][c], потому что в тебе были найдены преступления Израиля[d].
  rationale: Исправлены направление действия в повелении и передача пассивной формы «были найдены». «Была началом» точнее отражает еврейскую именную конструкцию, не уточняя исторический механизм, которым Лахиш стал источником греха для дочери Сиона. Сноска a перенесена к выражению «быстрым конём» и приведена в соответствие с исправленным переводом.
