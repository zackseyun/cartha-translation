source:
  edition: WLC
  text: רְתֹ֧ם הַ/מֶּרְכָּבָ֛ה לָ/רֶ֖כֶשׁ יוֹשֶׁ֣בֶת לָכִ֑ישׁ רֵאשִׁ֨ית חַטָּ֥את הִיא֙ לְ/בַת צִיּ֔וֹן כִּי בָ֥/ךְ נִמְצְא֖וּ פִּשְׁעֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/013.yaml
  text: Harness the chariot to the swift horse[a], inhabitant of Lachish; she was the beginning of sin to daughter Zion[d][c][b], for in you were found the transgressions of Israel.
translation:
  language: ru
  text: Запрягай колесницу быстрым конём[a], жительница Лахиша! Она была началом греха для дочери Сиона[b][c], потому что в тебе были найдены преступления Израиля[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Привяжи колесницу к быстрому коню». Еврейский текст велит запрячь колесницу к быстрому коню; слово, переведённое как «быстрый конь», может обозначать скакуна или боевого коня.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Она была первым источником греха для дочери Сиона». Возможно, Лахиш назван местом, откуда в Иуде распространился мятеж Израиля.'
    reason: alternative_reading
  - marker: c
    text: «Дочь Сиона» — еврейское поэтическое олицетворение Сиона, то есть Иерусалима.
    reason: cultural_note
  - marker: d
    text: 'Или: «мятежи Израиля». Еврейское слово может подчёркивать сознательный бунт, а не просто проступки вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְתֹם הַמֶּרְכָּבָה לָרֶכֶשׁ
  choice: Запрягай быстрого коня в колесницу
  rationale: Императив передан прямым повелением. В русском естественно говорить о запряжении коня в колесницу, хотя в еврейском непосредственным дополнением является «колесница». רֶכֶשׁ обозначает быстрого верхового или упряжного коня.
- source_word: יוֹשֶׁבֶת לָכִישׁ
  choice: жительница Лахиша
  rationale: Причастие стоит в женском роде и служит обращением к олицетворённому городу; форма «жительница» сохраняет эту персонификацию.
- source_word: רֵאשִׁית חַטָּאת הִיא
  choice: Она стала началом греха
  rationale: רֵאשִׁית означает начало или исходную точку, а חַטָּאת в данном обвинительном контексте — грех, не жертву за грех. Глагол «стала» естественно выражает именную конструкцию, не уточняя исторический механизм распространения греха.
- source_word: לְבַת צִיּוֹן
  choice: для дочери Сиона
  rationale: Предлог ל передан как «для», а традиционный поэтический образ «дочь Сиона» сохранён без сведения его просто к названию Иерусалима.
- source_word: כִּי בָךְ נִמְצְאוּ
  choice: потому что в тебе обнаружились
  rationale: כִּי вводит основание обвинения. Женское единственное число בָךְ сохраняет прямое обращение к Лахишу как к олицетворённому городу; נִמְצְאוּ передано возвратной формой со значением «оказались, были найдены».
- source_word: פִּשְׁעֵי יִשְׂרָאֵל
  choice: преступления Израиля
  rationale: פֶּשַׁע обозначает тяжкое нарушение и сознательный мятеж. «Преступления» звучит весомо и понятно, а оттенок бунта отмечен в сноске.
theological_decisions:
- issue: Значение חַטָּאת в пророческом обвинении
  choice: грех
  alternative: жертва за грех
  rationale: Контекст говорит о нравственной вине Лахиша и о преступлениях Израиля, поэтому культовое значение здесь неуместно.
- issue: Смысл выражения רֵאשִׁית חַטָּאת
  choice: Лахиш как начало или исходная точка греха для дочери Сиона
  alternative: Лахиш как главный грех либо первый город, подвергшийся суду
  rationale: Синтаксис естественнее всего представляет Лахиш началом греха для Сиона, но не раскрывает конкретный исторический путь влияния; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Восклицательный знак обозначает обращение и повеление. Женский род в словах «жительница», «она» и «в тебе» сохраняет олицетворение Лахиша; образ «дочь Сиона» оставлен в библейской поэтической форме.
