base_translation:
  language: en
  yaml_path: translation/ot/micah/001/009.yaml
  text: For her wound is incurable[a], for it has come as far as Judah; it has reached to the gate of my people[b], to Jerusalem.
translation:
  language: ru
  text: Ибо её рана неисцелима[a], ведь беда дошла до Иудеи, достигла ворот моего народа[b], до Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её раны неисцелимы». В еврейском тексте слово «раны» стоит во множественном числе, но может иметь собирательное значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «коснулась ворот моего народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנוּשָׁה
  choice: неисцелима
  rationale: Прилагательное обозначает крайне тяжёлое состояние, не поддающееся исцелению; в сочетании с образом раны естественно передаётся как «неисцелима».
- source_word: מַכּוֹתֶיהָ
  choice: её рана
  rationale: Форма морфологически множественного числа может иметь собирательное значение. Единственное число по-русски естественно сочетается со сказуемым в единственном числе и представляет поражение страны как единую беду.
- source_word: בָאָה
  choice: беда дошла
  rationale: Женская форма глагола допускает связь с персонифицированным несчастьем. Явное слово «беда» делает движение суда понятным по-русски, не превращая саму рану в действующее лицо.
- source_word: עַד יְהוּדָה
  choice: до Иудеи
  rationale: Предлог עַד указывает на достигнутый предел распространения бедствия.
- source_word: נָגַע
  choice: достигла
  rationale: Глагол может означать «коснуться» или «достичь»; здесь «достигла» естественно передаёт приближение бедствия к городским воротам.
- source_word: שַׁעַר
  choice: ворот
  rationale: Конкретный образ городских ворот сохранён; русское множественное «ворота» является обычной формой этого существительного.
- source_word: עַמִּי
  choice: моего народа
  rationale: Сохранено первое лицо и выражение принадлежности народа говорящему без уточнения, кто именно говорит.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалима
  rationale: Употреблена традиционная русская форма названия; тире показывает, что Иерусалим уточняет выражение «ворота моего народа».
theological_decisions:
- issue: К чему относятся формы женского рода и кто является субъектом наступающего бедствия
  choice: Первая строка сохраняет женскую персонификацию через «её рана», а далее субъект обозначен нейтральным по смыслу словом «беда».
  alternative: Можно понимать субъект буквально как Самарию либо считать, что далее подразумевается суд или поражение.
  rationale: В еврейском тексте наблюдается переход между персонифицированным образом и выражением наступающего бедствия. Русский текст не закрепляет спорный референт за конкретным городом и сохраняет напряжение контекста.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной пророческой фразой. Повтор причинного союза во второй части не воспроизведён буквально, чтобы избежать неясной русской связи; причинно-следственное движение передано точкой с запятой. Местоимение «моего» написано со строчной буквы, поскольку текст не требует однозначно отождествлять говорящего с Богом.
