source:
  edition: WLC
  text: עֹ֗ד הַ/יֹּרֵשׁ֙ אָ֣בִי לָ֔/ךְ יוֹשֶׁ֖בֶת מָֽרֵשָׁ֑ה עַד עֲדֻּלָּ֥ם יָב֖וֹא כְּב֥וֹד יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/015.yaml
  text: I will yet bring an heir against you[a], inhabitant of Mareshah[b]; the glory of Israel will come as far as Adullam.
translation:
  language: ru
  text: Я ещё приведу к тебе захватчика[a], жительница Мареши; до Одоллама дойдёт слава Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наследника», «того, кто вступит во владение» или «завоевателя». В еврейском тексте, вероятно, присутствует игра слов с названием Мареша.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «знать Израиля», «достояние Израиля» или «великолепие Израиля».'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹד
  choice: ещё
  rationale: 'Передаёт продолжение суда: угроза не исчерпана и последует новое бедствие.'
- source_word: הַיֹּרֵשׁ
  choice: захватчика
  rationale: Форма от ירשׁ обозначает того, кто вступает во владение, овладевает или наследует. В контексте вражеского нашествия «захватчик» естественно передаёт угрожающий смысл, а более буквальные варианты сохранены в сноске.
- source_word: אָבִי לָךְ
  choice: приведу к тебе
  rationale: Хифиль глагола בוא с ל допускает значение «привести к кому-либо»; в контексте ясно, что приход захватчика враждебен, поэтому нет необходимости усиливать текст добавлением «против тебя».
- source_word: יוֹשֶׁבֶת מָרֵשָׁה
  choice: жительница Мареши
  rationale: Сохранено обращение в женском роде к олицетворённому городу и его населению.
- source_word: עַד עֲדֻּלָּם יָבוֹא
  choice: до Одоллама дойдёт
  rationale: עַד здесь указывает на пространственный предел движения; «дойдёт до» звучит естественно и сохраняет образ перемещения.
- source_word: כְּבוֹד יִשְׂרָאֵל
  choice: слава Израиля
  rationale: 'Буквальная формулировка сохраняет смысловой диапазон כבוד: славу, великолепие, достояние или знатных людей народа.'
theological_decisions:
- issue: Кого или что обозначает «слава Израиля»
  choice: Сохранена широкая формулировка «слава Израиля» без уточнения референта.
  alternative: «знать Израиля», «достояние Израиля» или «великолепие Израиля»
  rationale: Еврейское выражение допускает несколько связанных смыслов и может обозначать знатных людей, национальное достояние либо славу Израиля в собирательном смысле. Основной текст не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия во второй части («до Одоллама дойдёт…») сохраняет акцент на пределе движения и остаётся естественной. Названия переданы в принятых русских библейских формах.
