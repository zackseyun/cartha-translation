  text: וְ/כָל פְּסִילֶ֣י/הָ יֻכַּ֗תּוּ וְ/כָל אֶתְנַנֶּ֨י/הָ֙ יִשָּׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל עֲצַבֶּ֖י/הָ אָשִׂ֣ים שְׁמָמָ֑ה כִּ֠י מֵ/אֶתְנַ֤ן זוֹנָה֙ קִבָּ֔צָה וְ/עַד אֶתְנַ֥ן זוֹנָ֖ה יָשֽׁוּבוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/007.yaml
  text: All her carved images will be smashed[a], and all her prostitute’s wages will be burned with fire; all her idols I will make desolate. For from the wages of a prostitute she gathered them[c][b], and to the wages of a prostitute they will return.
translation:
  language: ru
  text: Все её резные изваяния будут разбиты[a], и все её доходы от блуда будут сожжены в огне; всех её идолов Я обращу в развалины. Ведь она собрала всё это из платы блудницы[b], и к плате блудницы всё это возвратится[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высеченные изображения».'
    reason: lexical_alternative
  - marker: b
    text: «Плата блудницы» здесь служит метафорой богатства, приобретённого через неверность Богу и идолопоклонство.
    reason: cultural_note
  - marker: c
    text: 'Возможно также: «и всё это снова станет платой блудницы».'
    reason: alternative_reading
lexical_decisions:
- source_word: פְּסִילֶיהָ
  choice: её резные изваяния
  rationale: Слово обозначает изготовленные, прежде всего высеченные или вырезанные, культовые изображения. «Резные изваяния» сохраняет конкретный образ и не смешивает его полностью с последующим עֲצַבֶּיהָ.
- source_word: יֻכַּתּוּ
  choice: будут разбиты
  rationale: Пассивная форма передаёт насильственное разрушение; «будут разбиты» естественно и точно звучит по-русски.
- source_word: אֶתְנַנֶּיהָ
  choice: её плата за блуд
  rationale: אֶתְנַן — плата, получаемая за проституцию. Формулировка сохраняет резкую метафору и ясно передаёт характер дохода.
- source_word: יִשָּׂרְפוּ בָאֵשׁ
  choice: будет сожжена в огне
  rationale: Сохраняется явное упоминание огня, при этом русская формулировка остаётся естественной.
- source_word: עֲצַבֶּיהָ
  choice: её идолов
  rationale: В данном контексте слово обозначает идолов. Лексическое отличие от «резных изваяний» сохраняет параллелизм без ненужного повтора.
- source_word: אָשִׂים שְׁמָמָה
  choice: Я обращу в развалины
  rationale: Передаёт действие говорящего и итоговое состояние полного запустения; по-русски это естественнее буквального «сделаю запустением».
- source_word: כִּי
  choice: Ведь
  rationale: Вводит основание объявленного суда и плавно связывает две части стиха.
- source_word: מֵאֶתְנַן זוֹנָה
  choice: из платы блудницы
  rationale: Прямо сохраняет метафору проституции, не заменяя её истолкованием вроде «нечестного дохода».
- source_word: קִבָּצָה
  choice: она собрала всё это
  rationale: Женский род указывает на олицетворённую Самарию. «Всё это» естественно восполняет подразумеваемый объект из предыдущего контекста.
- source_word: וְעַד אֶתְנַן זוֹנָה יָשׁוּבוּ
  choice: и к плате блудницы всё это возвратится
  rationale: Сохраняет направление, выраженное עַד, и глагол «возвратиться», не устраняя неоднозначность того, означает ли это возвращение в ту же сферу или превращение добычи снова в плату за блуд.
theological_decisions:
- issue: Метафора блуда как образа идолопоклонства и приобретённого богатства
  choice: Сохранить в основном тексте прямые выражения «плата за блуд» и «плата блудницы».
  alternative: Передать как «нечестный доход» или «богатство, приобретённое идолопоклонством».
  rationale: Еврейский текст намеренно повторяет אֶתְנַן и זוֹנָה. Смягчение заменило бы сильную пророческую метафору её истолкованием.
- issue: Женский род и олицетворение Самарии
  choice: Передать местоимением «её» и формой «она собрала».
  alternative: Использовать безличные конструкции либо назвать Самарию прямо.
  rationale: Женские формы оригинала поддерживают образ города как женщины; этот образ связан с метафорой блуда и должен быть сохранён.
- issue: Смысл заключительной фразы о возвращении платы
  choice: 'В основном тексте сохранить буквальное направление: «к плате блудницы… возвратится».'
  alternative: «Снова станет платой блудницы».
  rationale: Оборот допускает понимание как возвращения богатства в ту же сферу, так и его нового превращения в плату за блуд. Основной текст не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сохраняет параллелизм оригинала; заглавное «Я» обозначает говорящего Господа в контексте пророчества. Резкая метафора блуда сохранена без архаизмов и конфессионального истолкования.
