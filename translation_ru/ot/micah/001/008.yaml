base_translation:
  language: en
  yaml_path: translation/ot/micah/001/008.yaml
  text: Because of this I will lament and wail[a]; I will go stripped and naked. I will make a lament like the jackals[b], and mourning like the daughters of the ostrich.
translation:
  language: ru
  text: Из-за этого буду скорбеть и рыдать; пойду раздетым и нагим[a]. Буду плакать, как шакалы, и скорбеть, как дочери страуса[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пойду разутым и нагим». Еврейское слово, переведённое как «раздетым», имеет неясное значение и может указывать на хождение босиком в знак скорби и унижения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как дочери страуса» — древнееврейское поэтическое обозначение страусов или самок страуса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶסְפְּדָה
  choice: я буду скорбеть
  rationale: Глагол ספד обозначает скорбь и оплакивание; «скорбеть» естественно передаёт траурный контекст и сохраняет отличие от следующего, более пронзительного вопля.
- source_word: וְאֵילִילָה
  choice: и рыдать
  rationale: Глагол ילל выражает громкий, пронзительный плач; «рыдать» передаёт его силу и естественно звучит по-русски.
- source_word: אֵילְכָה שילל וְעָרוֹם
  choice: пойду раздетым и нагим
  rationale: עָרוֹם однозначно означает «нагим», тогда как שילל — трудное слово, вероятно описывающее лишённость одежды либо обуви как знак скорби и унижения. Основной текст сохраняет парность и оттенок публичного бесчестья, а вариант «разутым» вынесен в сноску.
- source_word: מִסְפֵּד
  choice: плач
  rationale: Существительное обозначает выраженный вслух траурный плач. «Подниму плач» передаёт действие естественно и не смешивает его полностью с последующим אֵבֶל.
- source_word: כַּתַּנִּים
  choice: как шакалы
  rationale: В пророческой поэзии תנים, вероятнее всего, означает шакалов, чьи протяжные крики связаны с пустынными местами.
- source_word: וְאֵבֶל
  choice: и рыдание
  rationale: אֵבֶל означает скорбь или траур. В данном образном параллелизме «рыдание» естественно обозначает слышимое выражение скорби и сочетается со сравнением с криком птиц.
- source_word: כִּבְנוֹת יַעֲנָה
  choice: как дочери страуса
  rationale: Буквальный поэтический оборот «дочери страуса» сохранён ради образности оригинала; его обычный зоологический смысл пояснён в сноске.
