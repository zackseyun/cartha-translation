reference: Micah 1:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁמְעוּ֙ עַמִּ֣ים כֻּלָּ֔/ם הַקְשִׁ֖יבִי אֶ֣רֶץ וּ/מְלֹאָ֑/הּ וִ/יהִי֩ אֲדֹנָ֨/י יְהוִ֤ה בָּ/כֶם֙ לְ/עֵ֔ד אֲדֹנָ֖/י מֵ/הֵיכַ֥ל קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/002.yaml
  text: Hear[a], all you peoples; pay attention, O earth, and all that fills it. And let the Lord GOD be a witness against you[d][c][b], the Lord from his holy temple.
translation:
  language: ru
  text: Слушайте, все народы! Внимай, земля, и всё, что наполняет её! Пусть Владыка Яхве будет свидетелем против вас[a] — Владыка из Своего святого храма[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетелем среди вас». В данном контексте наиболее вероятен судебный смысл: «против вас».'
    reason: alternative_reading
  - marker: b
    text: Слово, переведённое как «храм», может также означать «дворец» или «святилище».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения во множественном числе выражает торжественный пророческий призыв к внимательному слушанию; современное «слушайте» естественно и сохраняет силу обращения.
- source_word: עַמִּים כֻּלָּם
  choice: все народы
  rationale: עַמִּים обозначает множество народов; сочетание имеет всеобщий охват, не ограничиваясь политическими государствами.
- source_word: הַקְשִׁיבִי
  choice: Внимай
  rationale: Женский род единственного числа соответствует обращению к земле; «внимай» передаёт усиленный призыв и сохраняет возвышенный, но понятный регистр.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: земля, и всё, что наполняет её
  rationale: В параллели со всеми народами אֶרֶץ имеет глобальный смысл, а מְלֹאָהּ охватывает всё находящееся на земле.
- source_word: וִיהִי
  choice: Пусть ... будет
  rationale: Юссив выражает торжественное волеизъявление или призыв; конструкция «пусть будет» естественно передаёт эту модальность.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Сохраняются оба элемента составного титула: אֲדֹנָי передано как «Владыка», а личное имя יהוה — как «Яхве», без неестественного повтора «Господь Господь».'
- source_word: בָּכֶם לְעֵד
  choice: свидетелем против вас
  rationale: 'В судебном контексте בָּכֶם при לְעֵד наиболее вероятно имеет противительное значение: Бог выступает свидетелем против призванных слушателей.'
- source_word: אֲדֹנָי מֵהֵיכַל קָדְשׁוֹ
  choice: Владыка из Своего святого храма
  rationale: הֵיכָל может означать дворец, храм или святилище; здесь «храм» ясно передаёт образ святого места Божьего пребывания, откуда исходит свидетельство.
theological_decisions:
- issue: Передача составного Божьего титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Передача личного имени как «Яхве» сохраняет различие между титулом אֲדֹנָי и именем יהוה и не вводит конфессионально обусловленного истолкования.
- issue: Судебный смысл בָּכֶם
  choice: против вас
  alternative: среди вас
  rationale: Образ свидетеля в пророческом обвинении поддерживает противительное понимание, однако грамматически предлог допускает более нейтральное «среди вас», поэтому альтернатива отмечена в сноске.
- issue: Охват אֶרֶץ
  choice: земля
  alternative: страна
  rationale: Параллелизм со «всеми народами» и выражение «всё, что наполняет её» указывают на универсальный, а не только местный охват.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Пара «Слушайте / Внимай» сохраняет смену числа в еврейском тексте и прямое олицетворённое обращение к земле; заглавное «Своего» соответствует принятому русскому благоговейному написанию, не меняя смысла.
