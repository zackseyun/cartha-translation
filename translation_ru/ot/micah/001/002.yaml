  terminology: «Владыка Яхве» последовательно различает титул אֲדֹנָי и имя יהוה и соответствует указанному принципу передачи имени. «Храм» — безопасный основной эквивалент הֵיכָל; альтернативы «дворец» и «святилище» надлежащим образом приведены в сноске.
