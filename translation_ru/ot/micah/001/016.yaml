  yaml_path: translation/ot/micah/001/016.yaml
  text: Make yourself bald and shave your head for the children of your delight; enlarge your baldness like the eagle[a], for they have gone from you into exile.
translation:
  language: ru
  text: 'Обрейся наголо и остриги волосы

    из-за дорогих тебе детей;

    сделай свою плешь широкой, как у орла[a],

    потому что они ушли от тебя в изгнание.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как у грифа». Еврейское נֶשֶׁר может обозначать крупную птицу-падальщика, а не только орла; в любом случае сравнение указывает на заметную плешь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְחִי
  choice: Обрейся наголо
  rationale: Повелительная форма женского рода обращена к олицетворённому городу или общине. Выражение прямо передаёт обычай скорби и действие над собой.
- source_word: וָגֹזִּי
  choice: и остриги волосы
  rationale: Глагол גזז буквально означает «стричь, состригать». Упоминание волос делает параллельное действие ясным и естественным по-русски.
- source_word: עַל בְּנֵי תַּעֲנוּגָיִךְ
  choice: из-за дорогих тебе детей
  rationale: עַל указывает на причину скорби, а идиома «дети твоего наслаждения/отрады» означает особенно любимых, дорогих детей. Перевод сохраняет эмоциональную связь и не ограничивает בנים сыновьями мужского пола.
- source_word: הַרְחִבִי קָרְחָתֵךְ
  choice: сделай свою плешь широкой
  rationale: Сохраняются повелительное значение הַרְחִבִי и конкретный образ заметно расширенной плеши; формулировка понятна без отвлечённого «расширь свою лысину».
- source_word: כַּנֶּשֶׁר
  choice: как у орла
  rationale: Традиционное значение נֶשֶׁר — «орёл», однако слово может обозначать крупную птицу-падальщика. Оборот «как у орла» естественно связывает сравнение именно с плешью; зоологическая неоднозначность отмечена в сноске.
- source_word: כִּי גָלוּ מִמֵּךְ
  choice: потому что они ушли от тебя в изгнание
  rationale: Qal глагола גלה передаёт уход или переселение в изгнание. Формулировка сохраняет активную грамматическую форму исходного текста и явно называет изгнание, не представляя уход добровольным событием вне данного контекста.
