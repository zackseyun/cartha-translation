base_translation:
  language: en
  yaml_path: translation/ot/micah/001/014.yaml
  text: Therefore you will give parting gifts for Moresheth-gath[b][a]; the houses of Achzib will prove deceptive to the kings of Israel.
translation:
  language: ru
  text: Поэтому ты дашь прощальные дары для Морешет-Гата[a]; дома Ахзива[b] окажутся обманом для царей Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отпускные дары» или «дары при расставании». Еврейское слово обозначает дары при отправлении или отпускании и, возможно, содержит отзвук образа развода.'
    reason: lexical_alternative
  - marker: b
    text: 'Название «Ахзив» созвучно еврейскому слову со значением «обман», «ложь» или «разочарование»; этим создаётся игра слов: дома Ахзива окажутся обманом для царей Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод или следствие из предшествующих пророчеств о суде.
- source_word: תִּתְּנִי
  choice: ты дашь
  rationale: Форма qal imperfect 2-го лица женского рода единственного числа. Русская форма будущего времени сохраняет прямое обращение, не уточняя неоднозначного адресата.
- source_word: שִׁלּוּחִים
  choice: дары при расставании
  rationale: Существительное связано с отправлением или отпусканием. Такая передача естественна по-русски и не сводит выражение исключительно к юридической формуле развода.
- source_word: עַל
  choice: за
  rationale: В сочетании с дарами передаёт направленность или назначение дара; «за Морешет-Гат» также соответствует контексту прощания с городом.
- source_word: מוֹרֶשֶׁת גַּת
  choice: Морешет-Гат
  rationale: Составное географическое название передано транслитерацией.
- source_word: בָּתֵּי אַכְזִיב
  choice: дома Ахзива
  rationale: Буквально сохраняет конструкцию «дома Ахзива»; в контексте возможны также семьи, владения или поселения.
- source_word: לְאַכְזָב
  choice: обманут
  rationale: Естественный русский предикат передаёт мысль, что Ахзив окажется ненадёжным и разочарует царей; сноска отмечает утраченную при переводе игру слов.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: царей Израиля
  rationale: При глагольной передаче «обманут» дательное отношение естественно выражается прямым дополнением.
theological_decisions:
- issue: Адресат глагола женского рода единственного числа
  choice: Не уточнять адресата в основном тексте, сохранив местоимение «ты».
  alternative: Явно назвать Иудею, Иерусалим, Сион или олицетворённый Морешет-Гат.
  rationale: Грамматическая форма указывает на адресата женского рода, однако сам стих его не называет. Контекст допускает олицетворение земли или города, поэтому конкретизация устранила бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Синтаксис сохранён в двух параллельных частях; неясный адресат не конкретизирован, а непередаваемая напрямую еврейская игра слов разъяснена в сноске.
