base_translation:
  language: en
  yaml_path: translation/ot/micah/001/006.yaml
  text: So I will make Samaria a heap in the open country[a], a place for planting vineyards[b]; I will pour her stones down into the valley and uncover her foundations.
translation:
  language: ru
  text: И сделаю Самарию грудой развалин среди поля[a], местом для посадки виноградников; обрушу её камни в долину[b] и обнажу её фундаменты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грудой развалин в поле». Еврейское выражение кратко и допускает такое более буквальное прочтение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «низвергну её камни в овраг». Глагол буквально передаёт движение вниз, подобное течению или высыпанию, а существительное может означать долину, лощину или овраг.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: И сделаю
  rationale: Форма совершенного вида с союзом в пророческой речи выражает решительное будущее действие. «И сделаю» прямо передаёт значение שׂים и связь с предыдущим контекстом, не усиливая причинный оттенок.
- source_word: שֹׁמְרוֹן
  choice: Самарию
  rationale: Общепринятая русская форма названия города; винительный падеж обусловлен синтаксисом.
- source_word: לְעִי הַשָּׂדֶה
  choice: грудой развалин среди поля
  rationale: עִי обозначает груду камней или развалин, а הַשָּׂדֶה — поле, открытую местность. Перевод сохраняет картину разрушенного города на месте, ставшем полем.
- source_word: לְמַטָּעֵי כָרֶם
  choice: местом для посадки виноградников
  rationale: 'Оборот указывает на назначение или результат: прежняя городская территория станет пригодной для виноградных посадок. Формулировка естественна для современного русского языка и сохраняет сельскохозяйственный образ.'
- source_word: וְהִגַּרְתִּי
  choice: обрушу
  rationale: Hiphil от נגר означает заставить течь или низвергаться. Применительно к камням «обрушу» естественно передаёт их стремительное падение вниз, не устраняя образ движения потоком.
- source_word: לַגַּי
  choice: в долину
  rationale: גַּי может обозначать долину, лощину или овраг. «Долина» — доступный и достаточно широкий эквивалент; более узкое «ущелье» не навязывается.
- source_word: אֲבָנֶיהָ
  choice: её камни
  rationale: Суффикс женского рода относится к Самарии. В русском языке название города также женского рода, поэтому местоимение звучит естественно и сохраняет образность.
- source_word: וִיסֹדֶיהָ אֲגַלֶּה
  choice: и обнажу её основания
  rationale: Piel גלה означает открыть, обнажить; יְסוֹד во множественном числе — основания. Формулировка передаёт полное разрушение города вплоть до фундаментов.
theological_decisions:
- issue: Олицетворение Самарии посредством суффиксов женского рода
  choice: Передать местоимением «её»
  alternative: Повторить название города или перестроить фразу без местоимения
  rationale: Еврейские суффиксы имеют женский род и относятся к Самарии. Русская грамматика позволяет сохранить это без искусственности и без дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Сохранены параллельные картины полного разрушения и последующего сельскохозяйственного использования места; редкие или конфессионально окрашенные слова не вводятся.
