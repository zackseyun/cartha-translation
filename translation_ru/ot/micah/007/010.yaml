  text: וְ/תֵרֶ֤א אֹיַ֨בְתִּ/י֙ וּ/תְכַסֶּ֣/הָ בוּשָׁ֔ה הָ/אֹמְרָ֣ה אֵלַ֔/י אַיּ֖/וֹ יְהוָ֣ה אֱלֹהָ֑יִ/ךְ עֵינַ/י֙ תִּרְאֶ֣ינָּה בָּ֔/הּ עַתָּ֛ה תִּֽהְיֶ֥ה לְ/מִרְמָ֖ס כְּ/טִ֥יט חוּצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/010.yaml
  text: Then my enemy will see[a], and shame will cover her—the one who said to me, “Where is Yahweh your God?” My eyes will look on her[b]; now she will be trampled down like mud in the streets.
translation:
  language: ru
  text: 'Тогда увидит это моя неприятельница, и стыд покроет ту, что говорила мне: «Где Яхве, твой Бог?» Я своими глазами увижу её[a]; теперь её будут топтать, как грязь на улицах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Мои глаза увидят её».'
    reason: Сноска сохраняет формальную особенность еврейского выражения с «глазами» как грамматическим подлежащим.
lexical_decisions:
- source_word: וְתֵרֶא אֹיַבְתִּי
  choice: Тогда увидит это моя неприятельница
  rationale: Имперфект с וְ продолжает развитие событий; «тогда» естественно передаёт последовательность. Женский род существительного и согласованных форм сохранён словом «неприятельница». Добавленное «это» естественно обозначает увиденное исполнение обещанного в предыдущем контексте, не меняя референта.
- source_word: וּתְכַסֶּהָ בוּשָׁה
  choice: и стыд покроет ту
  rationale: Сохранён близкий к еврейскому образ стыда, покрывающего неприятельницу; «ту» позволяет без тяжеловесного повтора присоединить определительное предложение.
- source_word: הָאֹמְרָה אֵלַי
  choice: что говорила мне
  rationale: Субстантивированное причастие женского рода определяет неприятельницу через её насмешку. Несовершенный вид «говорила» естественно передаёт характерную или повторявшуюся насмешку.
- source_word: אַיּוֹ יְהוָה אֱלֹהָיִךְ
  choice: Где Яхве, твой Бог?
  rationale: Прямой вопрос сохраняет насмешливую реплику. Тетраграмматон передан личным именем «Яхве», а суффикс 2-го лица женского рода в русском естественно выражается как «твой» по согласованию со словом «Бог».
- source_word: עֵינַי תִּרְאֶינָּה בָּהּ
  choice: Я своими глазами увижу её
  rationale: Русская идиома «своими глазами» сохраняет эмфатическое упоминание глаз и звучит естественнее буквального «мои глаза увидят её».
- source_word: עַתָּה תִּהְיֶה לְמִרְמָס
  choice: теперь её будут топтать
  rationale: Конструкция היה לְמִרְמָס означает, что она станет объектом попрания. Неопределённо-личная форма естественно передаёт это значение по-русски, не вводя конкретного деятеля.
- source_word: כְּטִיט חוּצוֹת
  choice: как грязь на улицах
  rationale: «Грязь на улицах» ясно и естественно передаёт образ уличной грязи, которую топчут ногами.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, поэтому транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Оттенок созерцания падения неприятельницы
  choice: Я своими глазами увижу её
  alternative: Мои глаза будут смотреть на неё
  rationale: Глагол ראה прежде всего означает «видеть». Перевод сохраняет подчёркнутое личное свидетельство, не усиливая сверх текста оттенок злорадного созерцания.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род неприятеля выражен явно словом «неприятельница», поскольку он последовательно отмечен в еврейском тексте. Синтаксис сделан естественным, но образ стыда и уличной грязи сохранён.
