id: MIC.7.6
reference: Micah 7:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי בֵן֙ מְנַבֵּ֣ל אָ֔ב בַּ֚ת קָמָ֣ה בְ/אִמָּ֔/הּ כַּלָּ֖ה בַּ/חֲמֹתָ֑/הּ אֹיְבֵ֥י אִ֖ישׁ אַנְשֵׁ֥י בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/006.yaml
  text: For a son treats his father with contempt[a]; a daughter rises up against her mother; a daughter-in-law against her mother-in-law[b]; a man's enemies are the men of his own house.
translation:
  language: ru
  text: Ибо сын бесчестит отца[a], дочь восстаёт против матери, невестка — против свекрови; враги человеку — его домашние[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позорит отца», «обращается с отцом презрительно». Еврейский глагол означает постыдное или презрительное обращение с кем-либо.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «люди его дома». Это выражение может обозначать всех домашних, а не только мужчин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предшествующего сетования; «ибо» ясно передаёт причинно-пояснительную связь и соответствует возвышенному, но понятному регистру.
- source_word: בֵן
  choice: сын
  rationale: Единственное число без артикля имеет обобщающий смысл; в русском языке форма без местоимения и артикля естественно сохраняет эту обобщённость.
- source_word: מְנַבֵּל
  choice: бесчестит
  rationale: Причастная форма породы пиэль от נבל обозначает презрительное, позорящее обращение. «Бесчестит» кратко передаёт активное попрание чести отца, не сводя смысл лишь к внутреннему презрению.
- source_word: אָב
  choice: отца
  rationale: Русская конструкция естественно выражает родственную связь без добавления притяжательного местоимения.
- source_word: בַּת
  choice: дочь
  rationale: Употреблено обобщённо и параллельно слову «сын».
- source_word: קָמָה
  choice: восстаёт против
  rationale: Передаёт враждебное значение קום с предлогом ב, сохраняя образ активного выступления против близкого человека и не усиливая его до однозначного политического «мятежа».
- source_word: בְאִמָּהּ
  choice: против матери
  rationale: После קום предлог имеет противительное значение; принадлежность и так ясна из родственной пары «дочь — мать».
- source_word: כַּלָּה
  choice: невестка
  rationale: В контексте отношений внутри семьи слово означает жену сына, то есть невестку, а не невесту.
- source_word: בַּחֲמֹתָהּ
  choice: против свекрови
  rationale: חמות обозначает мать мужа; точный современный русский термин — «свекровь».
- source_word: אֹיְבֵי אִישׁ
  choice: враги человеку
  rationale: Сохраняет мужскую форму единственного числа אִישׁ, употреблённую как представитель любого человека, и естественно звучит в русском афористическом высказывании.
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: его домашние
  rationale: Еврейская конструкция буквально говорит о «людях его дома», но идиоматически охватывает членов домашнего круга. «Его домашние» естественно передаёт этот смысл и усиливает трагедию разрушенной семейной верности.
theological_decisions:
- issue: Гендерно маркированный язык о доме
  choice: Сохранить мужскую форму в словах «враги человеку», а идиому אַנְשֵׁי בֵיתוֹ передать как «его домашние».
  alternative: «Враги мужчины — мужчины его дома» или «враги человека — люди его дома».
  rationale: אִישׁ явно стоит в мужском роде и сохраняется в русском грамматически мужской формой «человеку». Однако אַנְשֵׁי в составе устойчивой конструкции может обозначать не только взрослых мужчин, но домашних вообще; контекст, где только что названы мать, дочь, невестка и свекровь, не позволяет искусственно ограничить последнюю строку мужчинами.
translation_notes:
  register: Современный литературный русский с кратким пророческим параллелизмом. «Ибо» и «бесчестит» придают строке достоинство, оставаясь понятными; пропуск повторного сказуемого перед «против свекрови» сохраняет ритм оригинала.
