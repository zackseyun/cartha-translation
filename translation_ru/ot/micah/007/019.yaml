  text: יָשׁ֣וּב יְרַֽחֲמֵ֔/נוּ יִכְבֹּ֖שׁ עֲוֺֽנֹתֵ֑י/נוּ וְ/תַשְׁלִ֛יךְ בִּ/מְצֻל֥וֹת יָ֖ם כָּל חַטֹּאותָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/019.yaml
  text: He will again have compassion on us[a]; he will subdue our iniquities[b]. He will cast all their sins into the depths of the sea.
translation:
  language: ru
  text: Он снова смилуется над нами и покорит наши беззакония. Ты бросишь в морские глубины все их грехи.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь происходит неожиданный переход от «Он» к прямому обращению: «Ты бросишь». Некоторые древние свидетельства и переводы сглаживают его: «Он бросит».'
    reason: alternative_reading
  - marker: b
    text: Еврейский текст гласит «их грехи»; во многих переводах стоит «наши грехи» — в согласовании с предшествующим выражением «наши беззакония».
    reason: textual_variant
lexical_decisions:
- source_word: יָשׁוּב
  choice: снова
  rationale: В сочетании с последующим личным глаголом выражает повторность действия; «снова» естественно передаёт этот смысл по-русски.
- source_word: יְרַחֲמֵנוּ
  choice: смилуется над нами
  rationale: Передаёт глубокое сострадание и милость, сохраняя возвышенный, но понятный современному читателю регистр.
- source_word: יִכְבֹּשׁ
  choice: покорит
  rationale: Глагол означает подчинить, покорить; здесь образно описывает решительную власть Бога над беззакониями.
- source_word: עֲוֺנֹתֵינוּ
  choice: наши беззакония
  rationale: Сохраняет отличие עון, связанного с беззаконием и виной, от חטאת — «грех» — во второй части стиха.
- source_word: וְתַשְׁלִיךְ
  choice: Ты бросишь
  rationale: Масоретская форма имеет второе лицо мужского рода единственного числа. Перевод сохраняет неожиданный переход от повествования о Боге к прямому обращению к Нему.
- source_word: בִּמְצֻלוֹת יָם
  choice: в морские глубины
  rationale: Естественно и образно передаёт глубокие места моря и идею полного удаления грехов.
- source_word: כָּל
  choice: все
  rationale: Сохраняет всеохватный смысл исходного слова.
- source_word: חַטֹּאותָם
  choice: их грехи
  rationale: Суффикс масоретского текста — третье лицо множественного числа, поэтому сохранено «их», несмотря на резкий переход от «наших».
theological_decisions:
- issue: Переходы лица и местоименной отнесённости внутри стиха
  choice: 'Сохранены масоретские переходы: «Он…», затем «Ты…», а в конце «их грехи».'
  alternative: 'Сгладить переходы: «Он снова смилуется над нами… и бросит в морские глубины все наши грехи».'
  rationale: Исходный еврейский текст действительно меняет лицо глагола и местоименный суффикс. Сохранение этих переходов не устраняет подлинную текстовую напряжённость и не навязывает её толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся ясным, а необычные переходы еврейского текста сохранены и пояснены. Оба маркера примечаний помещены после предложения, к которому относятся; примечание [a] поясняет «Ты бросишь», [b] — «их грехи».
