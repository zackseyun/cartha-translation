base_translation:
  language: en
  yaml_path: translation/ot/micah/007/018.yaml
  text: Who is a God like you[a], bearing iniquity and passing over transgression for the remnant of his inheritance? He does not retain his anger forever[b], because he delights in steadfast love.
translation:
  language: ru
  text: Кто, Боже, подобен Тебе — снимающему вину с остатка Своего наследия и проходящему мимо его преступления[a]? Он не хранит Свой гнев вечно, ибо находит радость в милости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прощающему беззаконие и не взыскивающему за преступление». Буквально еврейский текст говорит о несении или снятии вины и о прохождении мимо преступления.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское חֶסֶד может также означать «верную любовь», «неизменную любовь» или «заветную верность». Здесь оно переведено словом «милость».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֵל כָּמוֹךָ
  choice: Кто Бог, подобный тебе
  rationale: Сохранён риторический вопрос о несравненности Бога и возможный отзвук имени пророка Михея — «Кто подобен Яхве?». Конструкция естественна для возвышенной современной русской речи.
- source_word: נֹשֵׂא עָוֹן
  choice: снимающий вину
  rationale: Глагол буквально означает «нести, поднимать», а в данном сочетании выражает устранение вины, то есть прощение. «Снимающий вину» сохраняет образ и учитывает, что עָוֹן может обозначать как беззаконие, так и связанную с ним вину.
- source_word: וְעֹבֵר עַל פֶּשַׁע
  choice: и проходящий мимо преступления
  rationale: Передан исходный образ «проходить мимо» проступка, то есть не взыскивать за него. «Преступление» сохраняет оттенок сознательного нарушения и отличается от предшествующей «вины».
- source_word: לִשְׁאֵרִית נַחֲלָתוֹ
  choice: остатка Своего наследия
  rationale: «Остаток» сохранён как значимый пророческий термин, а «наследие» передаёт язык принадлежности народа Богу. Родительная конструкция естественно связывает прощение с его объектом.
- source_word: לֹא הֶחֱזִיק לָעַד אַפּוֹ
  choice: Он не хранит Свой гнев вечно
  rationale: הֶחֱזִיק передаёт удерживание или сохранение, а אַף — идиоматически гнев. Формулировка ясна, современна и сохраняет длительный аспект отрицания.
- source_word: כִּי חָפֵץ חֶסֶד הוּא
  choice: потому что любит милость
  rationale: חָפֵץ выражает удовольствие, благоволение или любовь к чему-либо. «Любит милость» звучит естественно по-русски; «милость» передаёт в данном контексте прощающее действие חֶסֶד, не исключая его значений верности и неизменной любви.
theological_decisions:
- issue: Передача חֶסֶד
  choice: милость
  alternative: верная любовь; заветная любовь; неизменная любовь
  rationale: В контексте прощения «милость» наиболее естественна и непосредственно связана с темой стиха. Сноска сохраняет более широкий диапазон слова, включая постоянную, верную любовь в отношениях завета, не навязывая узкого конфессионального толкования.
- issue: Различение עָוֹן и פֶּשַׁע
  choice: вина … преступление
  alternative: беззаконие … мятеж; грех … преступление
  rationale: Два разных еврейских слова не сведены к одному русскому «грех». «Вина» отражает возможный смысл עָוֹן как виновности, а «преступление» передаёт оттенок сознательного нарушения в פֶּשַׁע без создания жёсткой систематической классификации грехов.
- issue: Смысл образов נֹשֵׂא и עֹבֵר עַל
  choice: снимающий … проходящий мимо
  alternative: прощающий … не взыскивающий за
  rationale: Сохранены конкретные еврейские образы, при этом сноска объясняет их значение как прощение. Это оставляет исходную образность и не утверждает дополнительной теории о механизме прощения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены риторическая форма, параллелизм и ключевые образы еврейского текста; архаизмы и конфессионально окрашенная терминология избегаются. Местоимение «тебе» в прямом обращении оставлено со строчной буквы по современной орфографической практике, тогда как притяжательное «Своего/Свой» капитализировано как традиционный издательский знак божественного референта.
