  yaml_path: translation/ot/micah/007/011.yaml
  text: A day for building your walls—on that day the boundary will be far removed[a].
translation:
  language: ru
  text: Наступает день строить твои стены! В тот день граница будет далеко отодвинута[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «указ будет далеко удалён». Еврейское слово может означать «граница, предел» либо «указ, установление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֖וֹם
  choice: День
  rationale: Сохраняет краткость и восклицательный характер эллиптического пророческого объявления, не добавляя отсутствующего в еврейском тексте «наступит».
- source_word: לִ/בְנ֣וֹת
  choice: строить
  rationale: Инфинитив с ל естественно передаётся русским инфинитивом; «восстанавливать» возможно по контексту, но не выражено самим глаголом.
- source_word: גְּדֵרָ֑יִ/ךְ
  choice: твои стены
  rationale: Форма от גדר обозначает ограждающие стены или преграды; «стены» естественно звучит в контексте восстановления и не вносит излишней конкретизации.
- source_word: י֥וֹם הַ/ה֖וּא
  choice: В тот день
  rationale: Обычная и естественная русская передача пророческого указания на определённое будущее время.
- source_word: יִרְחַק
  choice: будет отодвинута далеко
  rationale: Передаёт значение удаления или увеличения расстояния и в сочетании с «границей» ясно выражает пространственный образ, не называя действующее лицо.
- source_word: חֹֽק
  choice: граница
  rationale: Слово может означать границу, предел, установление или указ; архитектурно-территориальный контекст делает «границу» наиболее связным вариантом, а иное значение сохранено в сноске.
theological_decisions:
- issue: Значение חֹק в заключительной части стиха
  choice: пространственная граница или предел
  alternative: указ или установление
  rationale: 'Образ строительства стен поддерживает пространственное прочтение: ограничивающая линия будет отодвинута. Однако юридическое значение лексически реально, поэтому оно не исключено молча, а приведено в сноске.'
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Восклицательный знак помогает передать эллиптическое объявление первого полустишия; лексическая неоднозначность заключительного слова сохранена в сноске.
