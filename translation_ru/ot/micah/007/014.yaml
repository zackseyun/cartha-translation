base_translation:
  language: en
  yaml_path: translation/ot/micah/007/014.yaml
  text: Shepherd your people with your staff[a], the flock of your inheritance, dwelling alone in a forest in the midst of Carmel; let them graze in Bashan and Gilead as in days of old.
translation:
  language: ru
  text: Паси народ Твой Своим посохом — стадо, Твоё наследие, живущее уединённо в лесу, посреди Кармила[a]. Пусть они пасутся в Башане и Галааде, как в давние дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посреди плодородной земли»; еврейское слово «кармел» может обозначать как область Кармил, так и плодородную землю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵה
  choice: Паси
  rationale: Повелительная форма глагола רעה обращена к Богу. «Паси» естественно сохраняет образ пастыря и включает заботу, водительство и обеспечение пищей.
- source_word: בְשִׁבְטֶךָ
  choice: Своим посохом
  rationale: В контексте пастырского образа שֵׁבֶט означает посох. Этот вариант передаёт заботу и водительство, не выдвигая на первый план наказание, возможное при переводе «жезлом».
- source_word: צֹאן נַחֲלָתֶךָ
  choice: стадо Твоего наследия
  rationale: Сохраняется метафора народа как Божьего стада и заветное понятие «наследия», принадлежащего Богу.
- source_word: שֹׁכְנִי לְבָדָד
  choice: живущее уединённо
  rationale: Причастная конструкция описывает устойчивое состояние обособленного проживания; форма согласована с собирательным существительным «стадо».
- source_word: יַעַר
  choice: в лесу
  rationale: Сохраняется прямой образ лесистой или дикой местности, в которой стадо находится обособленно.
- source_word: בְּתוֹךְ כַּרְמֶל
  choice: среди Кармила
  rationale: Кармил сохранён как географическое название ввиду последующего упоминания Башана и Галаада; лексическая возможность значения плодородной земли отмечена в сноске.
- source_word: יִרְעוּ
  choice: Пусть они пасутся
  rationale: Имперфект имеет здесь желательное значение и продолжает молитвенное прошение; множественное число оригинала сохранено местоимением «они», относящимся к народу/стаду.
- source_word: בָשָׁן וְגִלְעָד
  choice: в Башане и Галааде
  rationale: Сохранены традиционные русские формы названий плодородных областей к востоку и северо-востоку от Иордана.
- source_word: כִּימֵי עוֹלָם
  choice: как в прежние дни
  rationale: В данном контексте עוֹלָם указывает на давнее прошлое, а не на метафизическую вечность; выражение звучит естественно и достойно по-русски.
theological_decisions:
- issue: Образ Божьей заботы или наказания в שֵׁבֶט
  choice: пастушеский «посох»
  alternative: «жезл», подчёркивающий власть или наказание
  rationale: Непосредственный контекст — молитва о том, чтобы Бог пас Свой народ и дал ему пастбища. «Посох» поддерживает целостный пастырский образ, не исключая власти пастуха, но и не привнося невыраженный акцент на наказании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Сохранены пастырская метафора, географическая образность и неоднозначность слова כַּרְמֶל посредством сноски.
