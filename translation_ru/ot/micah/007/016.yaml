id: MIC.7.16
reference: Micah 7:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יִרְא֤וּ גוֹיִם֙ וְ/יֵבֹ֔שׁוּ מִ/כֹּ֖ל גְּבֽוּרָתָ֑/ם יָשִׂ֤ימוּ יָד֙ עַל פֶּ֔ה אָזְנֵי/הֶ֖ם תֶּחֱרַֽשְׁנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/016.yaml
  text: Nations will see and be ashamed of all their might[a]; they will put their hand over their mouth[c][b]; their ears will become deaf.
translation:
  language: ru
  text: Увидят народы и устыдятся всей своей мощи[a]; положат руку на уста[b], и уши их оглохнут[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устыдятся из-за всей своей мощи»; возможно также понимание: «будут посрамлены при всей своей мощи». Еврейское выражение может указывать как на причину стыда, так и на бессилие их прежней мощи.'
    reason: lexical_alternative
  - marker: b
    text: Жест «положить руку на уста» означает умолкнуть от изумления, страха или покорности.
    reason: cultural_note
  - marker: c
    text: 'Или: «уши их будут закрыты»; «уши их перестанут слышать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: увидят
  rationale: Qal, имперфект 3-го лица множественного числа от ראה; в пророческом контексте естественно передаётся будущим временем.
- source_word: גוֹיִם
  choice: народы
  rationale: В данном контексте речь идёт о народах как политических и этнических общностях; «язычники» внесло бы лишний религиозный оттенок.
- source_word: וְיֵבֹשׁוּ
  choice: и устыдятся
  rationale: Qal глагола בוש обозначает стыд или посрамление. Возвратная форма сохраняет прямоту еврейского выражения, не уточняя внешнего виновника.
- source_word: מִכֹּל גְּבוּרָתָם
  choice: всей своей мощи
  rationale: 'Предлог מִן допускает оттенок отношения или причины. Родительный оборот сохраняет сжатость и неоднозначность: народы испытают стыд за свою мощь либо окажутся посрамлены вопреки ей.'
- source_word: יָשִׂימוּ יָד עַל־פֶּה
  choice: положат руку на уста
  rationale: Сохранён конкретный древнееврейский образ жеста, выражающего безмолвие, изумление или покорность. Единственное число «руку» соответствует идиоматическому употреблению יָד.
- source_word: אָזְנֵיהֶם תֶּחֱרַשְׁנָה
  choice: уши их оглохнут
  rationale: Форма חרשׁ при подлежащем «уши» передаёт наступление глухоты или неспособности слышать; глагол «оглохнут» естественно сохраняет образ и динамику изменения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Инверсия «уши их» слегка возвышает регистр, не делая текст архаичным. «Уста» выбрано ради устойчивого русского выражения и соответствия образу; прочие формы остаются прозрачными для современного читателя.
