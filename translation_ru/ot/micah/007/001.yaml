base_translation:
  language: en
  yaml_path: translation/ot/micah/007/001.yaml
  text: 'Woe is me! For I have become like the gatherers of summer fruit[a], like the gleanings of the grape harvest: there is no cluster to eat[b], no first-ripe fig that my soul desires.'
translation:
  language: ru
  text: 'Горе мне![a] Я стал как после сбора летних плодов, как после подбора винограда: ни одной грозди, чтобы поесть, ни ранней смоквы[b], которой жаждет моя душа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Увы мне!»'
    reason: lexical_alternative
  - marker: b
    text: «Ранняя смоква» — буквально «рано созревший плод»; вероятнее всего, имеется в виду особенно ценившаяся первая смоква.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְלַי לִי
  choice: Горе мне!
  rationale: Сильное междометное восклицание скорби; естественно и выразительно звучит в современном литературном русском.
- source_word: כִּי הָיִיתִי
  choice: Я стал
  rationale: Перфект היה передаёт наступившее состояние говорящего; «стал» сохраняет оттенок перехода в это состояние.
- source_word: כְאָסְפֵּי קַיִץ
  choice: как после сбора летних плодов
  rationale: Конструктивное сочетание допускает формальное понимание как «сборы летних плодов», однако контекст описывает оставшуюся после сбора пустоту. Русское «как после сбора» ясно передаёт образ, не вводя в сравнение неуместных собирателей.
- source_word: כְעֹלְלֹת בָּצִיר
  choice: как после подбора винограда
  rationale: עֹלְלֹת обозначает подбор оставшегося после основной уборки урожая. Формулировка передаёт состояние виноградника после такого подбора и сохраняет параллелизм.
- source_word: אֵין אֶשְׁכּוֹל לֶאֱכֹל
  choice: ни одной грозди, чтобы поесть
  rationale: אֶשְׁכּוֹל в данном виноградарском контексте естественно означает виноградную гроздь; отрицательная конструкция передана идиоматично.
- source_word: בִּכּוּרָה
  choice: ранней смоквы
  rationale: Слово буквально обозначает рано созревший плод, а в данном образе, вероятнее всего, особенно ценимую раннюю смокву; это уточнение вынесено также в примечание.
- source_word: אִוְּתָה נַפְשִׁי
  choice: которой жаждет моя душа
  rationale: Сохраняется явное упоминание נֶפֶשׁ и сильный оттенок желания; выражение остаётся понятным и возвышенным по-русски.
