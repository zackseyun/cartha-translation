base_translation:
  language: en
  yaml_path: translation/ot/micah/007/007.yaml
  text: But as for me[a], I will watch for Yahweh; I will wait for the God of my salvation. My God will hear me.
translation:
  language: ru
  text: А я буду взирать на Яхве; буду ждать Бога моего спасения[a]. Мой Бог услышит меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду надеяться на Бога моего спасения». Еврейский глагол может означать ожидание, соединённое с надеждой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Самостоятельное местоимение с союзом подчёркивает противопоставление говорящего окружающей неверности; по-русски это естественно передаётся конструкцией «А я».
- source_word: בַּיהוָה אֲצַפֶּה
  choice: буду высматривать Яхве
  rationale: Глагол צפה обозначает напряжённое, ожидающее всматривание. «Высматривать» сохраняет живой образ и передаёт направленное ожидание при предлоге ב.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом, что сохраняет различие между יהוה и אֱלֹהִים в самом стихе.
- source_word: אוֹחִילָה
  choice: буду ждать
  rationale: יחל совмещает оттенки ожидания и надежды. В основном тексте выбрано «ждать», тогда как второй оттенок сохранён в примечании.
- source_word: לֵאלֹהֵי יִשְׁעִי
  choice: Бога моего спасения
  rationale: Близкая к форме оригинала конструкция сохраняет поэтическую ёмкость и не сужает значение до одного конкретного способа спасения.
- source_word: יִשְׁמָעֵנִי
  choice: услышит меня
  rationale: שמע прямо означает «слышать, слушать». В молитвенном контексте оно может подразумевать благосклонный ответ, но перевод «ответит» сделал бы этот смысл чрезмерно явным.
- source_word: אֱלֹהָי
  choice: Мой Бог
  rationale: Личное исповедание сохранено как самостоятельное подлежащее заключительной фразы; начальная позиция естественна для русского синтаксиса и придаёт словам нужное ударение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Форма «Яхве» сохраняет его как имя и не смешивает с титулом.
- issue: Соотношение ожидания и надежды в אוֹחִילָה
  choice: В основном тексте — «буду ждать», оттенок надежды — в примечании
  alternative: буду надеяться; буду уповать
  rationale: Еврейский глагол допускает оба смысловых оттенка. Контекст ожидающего всматривания поддерживает «ждать», но неоднозначность не устраняется и отмечена в сноске.
- issue: Значение יִשְׁמָעֵנִי в молитвенном контексте
  choice: услышит меня
  alternative: ответит мне
  rationale: Перевод сохраняет прямое значение глагола и уверенность говорящего, не превращая подразумеваемый благосклонный отклик в явно выраженное обещание ответа.
translation_notes:
  register: Современный литературный русский с поэтической сжатостью. «Высматривать» сохраняет образ напряжённого ожидания, не прибегая к архаичному «взирать»; синтаксический параллелизм двух первых частей стиха сохранён.
