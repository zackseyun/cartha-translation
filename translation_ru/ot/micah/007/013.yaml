base_translation:
  language: en
  yaml_path: translation/ot/micah/007/013.yaml
  text: But the land will become a desolation because of its inhabitants[b][a], because of the fruit of their deeds.
translation:
  language: ru
  text: Но земля[a] станет пустошью из-за её жителей, из-за плода их дел[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страна». Еврейское אֶרֶץ может означать «земля» или «страна»; в данном контексте суда, вероятно, имеется в виду подвергающаяся опустошению страна.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от плода их дел» — то есть вследствие того, к чему привели их поступки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Но … станет
  rationale: Перфект с וְ в пророческом контексте указывает на будущее состояние; «станет» передаёт переход к запустению, а союз «но» естественно выражает контраст с предшествующим контекстом.
- source_word: הָאָרֶץ
  choice: земля
  rationale: אֶרֶץ может означать как «землю», так и «страну»; в ближайшем контексте суда вероятнее территория, подвергающаяся опустошению, однако двусмысленность отмечена в сноске.
- source_word: לִשְׁמָמָה
  choice: пустыней
  rationale: Существительное обозначает состояние полного запустения и разорения; такая передача сохраняет именную конструкцию и силу образа.
- source_word: עַל יֹשְׁבֶיהָ
  choice: из-за её жителей
  rationale: Предлог עַל здесь выражает причину, а причастие с суффиксом обозначает живущих на этой земле людей.
- source_word: מִפְּרִי מַעַלְלֵיהֶם
  choice: из-за плода их дел
  rationale: Сохранена метафора «плода», то есть последствий, порождённых поступками; מִן в данном контексте передаёт основание или причину опустошения.
theological_decisions:
- issue: Причинная связь суда и человеческих поступков
  choice: 'Обе еврейские причинные конструкции переданы повтором «из-за»: земля приходит в запустение из-за её жителей и плода их дел.'
  alternative: «Земля станет пустыней по вине её жителей — это плод их дел».
  rationale: Повтор сохраняет параллельную причинную структуру еврейского текста и не превращает вторую фразу в отдельное пояснительное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Формулировка остаётся простой и понятной; метафора «плод дел» сохранена, а неоднозначность אֶרֶץ вынесена в сноску.
