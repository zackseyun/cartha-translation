  yaml_path: translation/ot/micah/007/005.yaml
  text: Do not trust in a neighbor[a]; do not put confidence in a close companion. From the woman who lies in your bosom[d][c][b], guard the doors of your mouth.
translation:
  language: ru
  text: Не доверяйте ближнему[a], не полагайтесь на близкого друга[b]. От той, что лежит у тебя на груди[c], стереги двери уст твоих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «другу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «доверенному человеку» или «близкому товарищу».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «от лежащей у тебя на груди»; имеется в виду самая близкая спутница, вероятно жена. Возможный перевод: «от той, что в твоих объятиях».'
    reason: cultural_note
lexical_decisions:
- source_word: רֵעַ
  choice: ближний
  rationale: Слово обозначает человека, находящегося в близких общественных отношениях, и может значить как ближнего, так и друга. «Ближний» сохраняет широту значения и постепенное усиление параллелизма.
- source_word: אַלּוּף
  choice: близкий друг
  rationale: В данном контексте это близкий, доверенный человек, а не «вождь». Выражение передаёт большую степень близости по сравнению с רֵעַ.
- source_word: תַּאֲמִינוּ
  choice: верьте
  rationale: Порода hifil с предлогом ב выражает доверие человеку. В русском «не верьте ближнему» естественно передаёт личное доверие, сохраняя отличие от следующего глагола.
- source_word: תִּבְטְחוּ
  choice: полагайтесь
  rationale: Глагол בטח указывает на доверие и опору; «полагайтесь» естественно передаёт практическую уверенность в человеке и сохраняет синонимический параллелизм без повтора.
- source_word: מִשֹּׁכֶבֶת חֵיקֶךָ
  choice: Даже от той, что лежит у тебя на груди
  rationale: Формулировка близка к еврейскому образу женщины, лежащей на груди мужчины, то есть самой близкой спутницы, вероятно жены. «Даже» ясно передаёт усилительный смысл предлога מִן в контексте ряда предупреждений.
- source_word: שְׁמֹר
  choice: стереги
  rationale: Императив требует бдительной охраны; «стереги» кратко и выразительно передаёт предостерегающий тон.
- source_word: פִּתְחֵי פִיךָ
  choice: двери уст твоих
  rationale: Сохранена яркая метафора буквальных «отверстий/дверей рта». Сочетание «уста твои» придаёт строке достоинство и звучит естественнее, чем буквальные «двери твоего рта».
