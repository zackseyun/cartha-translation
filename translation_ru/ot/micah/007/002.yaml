base_translation:
  language: en
  yaml_path: translation/ot/micah/007/002.yaml
  text: The faithful has perished from the land[a], and there is no upright one among mankind. All of them lie in wait for blood[c][b]; each hunts his brother with a net.
translation:
  language: ru
  text: Не стало верного в стране[a], и нет праведного среди людей. Все они подстерегают, чтобы пролить кровь; каждый ловит сетью[c] своего брата[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на земле».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «брата»; это слово может обозначать не только родного брата, но и другого члена сообщества.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ловит западнёй».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַד
  choice: не стало
  rationale: Форма qal перфекта передаёт свершившуюся утрату; русское «не стало» естественно выражает скорбное утверждение об исчезновении таких людей.
- source_word: חָסִיד
  choice: верного
  rationale: Слово обозначает человека, отличающегося преданностью и верностью заветным обязательствам. «Верный» сохраняет этико-религиозный смысл без узкоконфессиональной окраски.
- source_word: מִן הָאָרֶץ
  choice: в стране
  rationale: В контексте пророческого обличения общества הָאָרֶץ естественнее означает страну; русская конструкция «не стало… в стране» идиоматически передаёт исходное значение удаления или исчезновения из неё.
- source_word: וְיָשָׁר
  choice: праведного
  rationale: Субстантивированное прилагательное обозначает нравственно прямого, честного человека. «Праведный» сохраняет возвышенный этический регистр пророческой речи.
- source_word: בָּאָדָם
  choice: среди людей
  rationale: אָדָם употреблено обобщённо, о людях как человеческом сообществе, а не только о мужчинах.
- source_word: אָיִן
  choice: нет
  rationale: Естественная русская передача бытийного отрицания.
- source_word: כֻּלָּם
  choice: все они
  rationale: Сохраняет явно выраженную всеобщность обвинения.
- source_word: לְדָמִים
  choice: чтобы пролить кровь
  rationale: Множественное דָּמִים обозначает кровопролитие или насильственное убийство; целевая конструкция с לְ естественно передаётся по-русски придаточным цели.
- source_word: יֶאֱרֹבוּ
  choice: подстерегают
  rationale: Глагол описывает скрытое ожидание жертвы для нападения.
- source_word: אִישׁ
  choice: каждый
  rationale: Слово имеет распределительное значение и подчёркивает личное участие каждого.
- source_word: אָחִיהוּ
  choice: своего брата
  rationale: Буквальное «брата» усиливает ужас предательства внутри сообщества; возвратное «своего» требуется русским синтаксисом при подлежащем «каждый».
- source_word: יָצוּדוּ חֵרֶם
  choice: ловит сетью
  rationale: Глагол относится к охоте или ловле, а חֵרֶם здесь обозначает сеть; сочетание передаёт образ целенаправленного захвата жертвы.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: среди людей
  alternative: среди человечества
  rationale: Форма относится ко всему человеческому сообществу, а не исключительно к мужчинам; «среди людей» точно и естественно передаёт это обобщение.
- issue: Смысл חָסִיד
  choice: верный
  alternative: благочестивый
  rationale: «Верный» позволяет сохранить оттенок преданности и надёжности в отношениях завета, не сводя значение лишь к внешней религиозности.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым ритмом пророческого плача. Сохранены собирательный единственный образ «верного», всеобщность обвинения и метафора охоты на ближнего.
