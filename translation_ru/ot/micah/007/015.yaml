  text: כִּ/ימֵ֥י צֵאתְ/ךָ֖ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אַרְאֶ֖/נּוּ נִפְלָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/015.yaml
  text: As in the days when you came out from the land of Egypt[a], I will show him wondrous things.
translation:
  language: ru
  text: Как в дни, когда ты вышел из земли Египта, Я покажу ему[a] дивные дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покажу им дивные дела». В древнееврейском тексте местоименный суффикс стоит в единственном числе («ему»), но может собирательно относиться к Израилю.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּימֵי
  choice: Как в те дни
  rationale: Предлог כְּ выражает сравнение, а יְמֵי указывает на известный период прошлого. Формулировка естественна для современного русского языка и сохраняет сравнительный смысл.
- source_word: צֵאתְךָ
  choice: когда ты вышел
  rationale: Инфинитивная конструкция с суффиксом 2-го лица мужского рода единственного числа буквально означает «при твоём выходе». Придаточное времени ясно и естественно передаёт её смысл.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египта
  rationale: Перевод сохраняет полную древнееврейскую формулу исхода, не сокращая её до «из Египта».
- source_word: אַרְאֶנּוּ
  choice: Я покажу ему
  rationale: Порода hифиль глагола ראה означает «дать увидеть, показать»; суффикс имеет форму 3-го лица мужского рода единственного числа. Единственное число сохранено, несмотря на вероятный собирательный референт.
- source_word: נִפְלָאוֹת
  choice: дивные дела
  rationale: Слово обозначает необычайные, вызывающие изумление деяния. «Дивные дела» сохраняет широту значения и не сужает его исключительно до сверхъестественных чудес.
theological_decisions:
- issue: Референт суффикса 3-го лица единственного числа в אַרְאֶנּוּ
  choice: 'Сохранить в основном тексте грамматическое единственное число: «ему».'
  alternative: 'Передать собирательный смысл множественным числом: «им».'
  rationale: Древнееврейская форма однозначно стоит в единственном числе, хотя в контексте, вероятно, относится к Израилю как к единому народу. Сохранение формы источника не устраняет намеренно эту грамматическую и смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Обращение «ты» и местоимение «ему» сохраняют формы единственного числа оригинала; «дивные дела» передаёт торжественный тон, не вводя более узкого толкования «чудеса».
