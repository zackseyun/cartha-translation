base_translation:
  language: en
  yaml_path: translation/ot/micah/007/008.yaml
  text: Do not rejoice over me[a], my enemy; though I have fallen, I will rise. Though I sit in darkness[b], Yahweh will be a light to me.
translation:
  language: ru
  text: Не ликуй надо мной[a], моя врагиня! Хотя я пал, я встану; хотя я сижу во тьме[b], Яхве будет мне светом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Не радуйся надо мной». Или: «Не злорадствуй надо мной». Еврейский глагол означает «радоваться»; «злорадствовать» яснее выражает враждебный контекст, но несколько усиливает смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте «я пал» и «я встал» имеют форму перфекта: буквально — «я пал, я встал». В поэтическом контексте вторая форма может выражать уверенность в грядущей перемене участи, поэтому переведено: «я встану».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׂמְחִי ... לִי
  choice: не радуйся обо мне
  rationale: Сохраняет основное значение שׂמח «радоваться» и передаёт לִי как указание на предмет враждебной радости; более сильное «не злорадствуй» вынесено в примечание.
- source_word: אֹיַבְתִּי
  choice: враг мой
  rationale: Прямое обращение к врагу в единственном числе; порядок слов естественен для возвышенной русской поэзии.
- source_word: כִּי נָפַלְתִּי קָמְתִּי
  choice: хотя я пал, я встану
  rationale: Первое כִּי контекстуально передано уступительно. Формально оба глагола стоят в перфекте, но параллелизм выражает уверенность в грядущем восстановлении после падения.
- source_word: כִּי אֵשֵׁב בַּחֹשֶׁךְ
  choice: хотя сижу во тьме
  rationale: Второе כִּי также понято уступительно; «сижу» сохраняет конкретный образ ישׁב, а «во тьме» — метафору бедствия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: אוֹר לִי
  choice: будет мне светом
  rationale: Естественная русская предикативная конструкция, сохраняющая метафору света как избавления и руководства.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Временное значение קָמְתִּי
  choice: я встану
  alternative: я встал
  rationale: Несмотря на перфектную форму, контраст с падением и уверенное ожидание обращения участи поддерживают будущее значение; примечание сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным поэтическим строем. Сохранены образы падения, сидения во тьме и света; синтаксическая неоднозначность перфектных форм отмечена в сноске.
