  variant: modern literary Russian
source:
  edition: WLC
  text: תִּתֵּ֤ן אֱמֶת֙ לְ/יַֽעֲקֹ֔ב חֶ֖סֶד לְ/אַבְרָהָ֑ם אֲשֶׁר נִשְׁבַּ֥עְתָּ לַ/אֲבֹתֵ֖י/נוּ מִ֥/ימֵי קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/020.yaml
  text: You will show faithfulness to Jacob and steadfast love to Abraham, which you swore to our fathers from days of old.
translation:
  language: ru
  text: Ты явишь верность Иакову, неизменную любовь — Аврааму, как Ты и поклялся нашим предкам в древние дни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֶת
  choice: верность
  rationale: В контексте исполнения Божьей клятвы слово обозначает надёжность и верность обещанию; «истина» здесь звучала бы менее естественно и сужала бы смысл.
- source_word: חֶסֶד
  choice: неизменная любовь
  rationale: Передаёт устойчивую, заветную благосклонность и любовь, не сводя многозначное еврейское слово лишь к «милости».
- source_word: תִּתֵּן
  choice: явишь
  rationale: Буквально «дашь»; по-русски сочетание «явить верность/любовь» естественно передаёт проявление названных качеств по отношению к Иакову и Аврааму.
- source_word: אֲבֹתֵינוּ
  choice: нашим предкам
  rationale: Современное и инклюзивное по отношению к поколениям обозначение праотцов народа; соответствует контексту древней клятвы.
- source_word: מִימֵי קֶדֶם
  choice: в древние дни
  rationale: Сохраняет временной образ исходного выражения и торжественный поэтический регистр.
theological_decisions:
- issue: Соотношение Иакова и Авраама с народом и патриархами
  choice: Сохранён параллелизм «Иакову… Аврааму» без поясняющей интерпретации.
  alternative: Передать имена как обозначения всего народа или потомков патриархов.
  rationale: Исходный текст допускает как прямую отсылку к патриархам, так и их репрезентативную функцию; перевод не должен устранять эту многозначность.
- issue: Связь относительного אֲשֶׁר с клятвой
  choice: «как Ты и поклялся»
  alternative: «которые Ты поклялся [явить]» или «о чём Ты поклялся»
  rationale: В русском языке «как Ты и поклялся» естественно связывает будущее проявление верности и любви с древней клятвой, не создавая грамматически неловкого согласования с двумя существительными.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, поэтическим звучанием. Параллелизм еврейской строки сохранён с помощью паузы-тире; местоимение «Ты» написано с прописной буквы как издательская норма обращения к Богу.
