source:
  edition: WLC
  text: יְלַחֲכ֤וּ עָפָר֙ כַּ/נָּחָ֔שׁ כְּ/זֹחֲלֵ֣י אֶ֔רֶץ יִרְגְּז֖וּ מִ/מִּסְגְּרֹֽתֵי/הֶ֑ם אֶל יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ יִפְחָ֔דוּ וְ/יִֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/017.yaml
  text: They will lick the dust like a snake[a]; like crawling things of the earth they will come trembling out of their strongholds. To Yahweh our God they will turn in dread[d][c][b], and they will be afraid because of you.
translation:
  language: ru
  text: Они будут лизать прах, как змеи; словно ползающие по земле твари, они, дрожа, выйдут из своих убежищ[a]. Перед Яхве, нашим Богом, они будут трепетать и устрашатся Тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из своих крепостей», «из своих оград» или «из своих укрытий».'
    reason: Еврейское слово обозначает замкнутое или ограждённое место и допускает несколько контекстуальных переводов.
  - marker: b
    text: 'Или: «будут бояться из-за Тебя»; еврейское выражение может обозначать страх перед Богом, возможно с оттенком благоговейного трепета.'
    reason: Предлог מן после глагола страха может указывать как на объект, так и на источник или причину страха; у ירא также возможен оттенок благоговения.
lexical_decisions:
- source_word: יְלַחֲכוּ עָפָר
  choice: будут лизать прах
  rationale: Сохраняет конкретный образ унижения; «прах» соответствует возвышенному, но понятному библейскому регистру.
- source_word: כַּנָּחָשׁ
  choice: как змея
  rationale: Нейтральная современная передача обычного еврейского слова «змея» без ненужного отождествления с конкретным змеем.
- source_word: כְּזֹחֲלֵי אֶרֶץ
  choice: словно ползающие по земле твари
  rationale: Передаёт низкое, пресмыкающееся движение, не сужая значение до определённого зоологического класса.
- source_word: יִרְגְּזוּ מִמִּסְגְּרֹתֵיהֶם
  choice: они, дрожа, выйдут из своих убежищ
  rationale: יִרְגְּזוּ выражает дрожь или содрогание, а מן указывает движение изнутри; «убежища» естественно передаёт защищённые или замкнутые места, сохраняя лексическую широту в сноске.
- source_word: אֶל יְהוָה אֱלֹהֵינוּ יִפְחָדוּ
  choice: К Яхве, нашему Богу, они обратятся в страхе
  rationale: Сохраняет направление אֶל и значение פחד — сильный страх; глагол «обратятся» естественно выражает направленность, имплицитную в еврейской конструкции.
- source_word: וְיִרְאוּ מִמֶּךָּ
  choice: и устрашатся Тебя
  rationale: Передаёт ירא как страх перед Богом; русское управление прямым объектом естественно охватывает функцию מן после глагола страха, не исключая оттенка благоговейного трепета.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в соответствии с проектной установкой и не подменяет его титулом.
- issue: Оттенок двух глаголов страха פחד и ירא
  choice: «в страхе» и «устрашатся»
  alternative: «в ужасе» и «будут благоговеть»
  rationale: Контекст униженных народов и параллелизм указывают прежде всего на страх, однако формулировка не отрицает возможного оттенка благоговейного трепета в ירא.
- issue: Направленность אֶל при יִפְחָדוּ
  choice: «К Яхве… обратятся в страхе»
  alternative: «перед Яхве… будут трепетать»
  rationale: Основной текст сохраняет явно выраженное направление «к», не утверждая более конкретного богословского смысла обращения или покаяния.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Синтаксис сохраняет поэтический параллелизм и последовательность образов, избегая архаизмов и конфессионально маркированных толкований.
