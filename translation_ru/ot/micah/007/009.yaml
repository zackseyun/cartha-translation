source:
  edition: WLC
  text: זַ֤עַף יְהוָה֙ אֶשָּׂ֔א כִּ֥י חָטָ֖אתִי ל֑/וֹ עַד֩ אֲשֶׁ֨ר יָרִ֤יב רִיבִ/י֙ וְ/עָשָׂ֣ה מִשְׁפָּטִ֔/י יוֹצִיאֵ֣/נִי לָ/א֔וֹר אֶרְאֶ֖ה בְּ/צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/009.yaml
  text: I will bear the indignation of Yahweh[a], because I have sinned against him, until he pleads my case and executes justice for me. He will bring me out to the light; I will look upon his righteousness.
translation:
  language: ru
  text: 'Я буду терпеть гнев Яхве

    за мой грех против Него,

    пока Он не вступится за меня

    и не восстановит для меня справедливость.


    Он выведет меня на свет,

    и я увижу Его праведность[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его справедливость». Еврейское слово может означать и праведность, и справедливость, особенно в контексте судебного оправдания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַעַף יְהוָה
  choice: гнев Яхве
  rationale: זַעַף обозначает сильный гнев или негодование; «гнев» естественно звучит по-русски и соответствует контексту заслуженного наказания. Имя יהוה передано как «Яхве».
- source_word: אֶשָּׂא
  choice: буду терпеть
  rationale: נשא здесь означает переносить тяжесть или последствия. «Буду терпеть» передаёт идиоматический смысл в современном русском языке.
- source_word: כִּי חָטָאתִי לוֹ
  choice: потому что согрешил против Него
  rationale: כִּי имеет причинное значение, а сочетание חטא с ל указывает на того, против кого совершён грех.
- source_word: עַד אֲשֶׁר
  choice: пока … не
  rationale: Оборот обозначает предел времени, до которого говорящий будет переносить гнев; русская конструкция «пока … не» здесь естественна.
- source_word: יָרִיב רִיבִי
  choice: вступится за меня
  rationale: Однокоренное сочетание глагола и существительного является судебной идиомой — вести или защищать чьё-либо дело. Выбор сохраняет юридический смысл без тяжеловесности.
- source_word: וְעָשָׂה מִשְׁפָּטִי
  choice: добьётся для меня справедливости
  rationale: מִשְׁפָּט здесь относится к судебному оправданию и восстановлению справедливости в пользу говорящего, а не просто к абстрактному суду.
- source_word: יוֹצִיאֵנִי לָאוֹר
  choice: выведет меня к свету
  rationale: Каузативная форма יצא означает «вывести»; образ перехода из тьмы к свету сохранён.
- source_word: אֶרְאֶה בְּצִדְקָתוֹ
  choice: я увижу Его праведность
  rationale: ראה передано простым и точным «увижу». צְדָקָה может обозначать как праведность, так и справедливость; основной текст сохраняет традиционно широкое «праведность».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное Божье имя, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Значение בְּצִדְקָתוֹ в контексте оправдания
  choice: Его праведность
  alternative: Его справедливость; Его правосудие
  rationale: Контекст имеет судебный характер, но צְדָקָה обладает более широким значением. «Праведность» оставляет эту широту, а юридически уместная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтической разбивкой строк. Судебные образы переданы ясно, но без архаичных выражений вроде «вести мою тяжбу». Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
