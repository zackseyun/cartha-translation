  variant: modern literary Russian
source:
  edition: WLC
  text: י֥וֹם הוּא֙ וְ/עָדֶ֣י/ךָ יָב֔וֹא לְ/מִנִּ֥י אַשּׁ֖וּר וְ/עָרֵ֣י מָצ֑וֹר וּ/לְ/מִנִּ֤י מָצוֹר֙ וְ/עַד נָהָ֔ר וְ/יָ֥ם מִ/יָּ֖ם וְ/הַ֥ר הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/012.yaml
  text: That day—they will come to you from Assyria and the cities of Egypt[a], and from Egypt to the River, from sea to sea[b], and from mountain to mountain.
translation:
  language: ru
  text: В тот день к тебе придут из Ассирии и городов Египта[a], от Египта до Реки[b], от моря до моря и от горы до горы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское מָצוֹר можно также понимать не как название Египта, а в значении «крепость», «осада» или «укреплённый город (города)».
    reason: lexical_alternative
  - marker: b
    text: Под «Рекой», вероятно, имеется в виду Евфрат.
    reason: cross_reference
lexical_decisions:
- source_word: י֥וֹם הוּא֙
  choice: В тот день
  rationale: Естественная для современного русского языка передача пророческого указания на определённый будущий день.
- source_word: וְעָדֶיךָ יָבוֹא
  choice: к тебе придут
  rationale: Хотя глагол стоит в единственном числе, перечисление земель предполагает собирательный субъект — людей, приходящих из разных мест. Обращение во 2-м лице единственного числа сохранено.
- source_word: לְמִנִּי אַשּׁוּר
  choice: из Ассирии
  rationale: Предлог указывает на исходную точку, а אַשּׁוּר является обычным названием Ассирии.
- source_word: וְעָרֵי מָצוֹר
  choice: и городов Египта
  rationale: В географическом параллелизме מָצוֹר вероятнее всего выступает как поэтическое обозначение Египта; реальная лексическая неоднозначность отмечена в сноске.
- source_word: וּלְמִנִּי מָצוֹר
  choice: от Египта
  rationale: Повтор מָצוֹר в ряду географических пределов поддерживает понимание слова как обозначения Египта.
- source_word: וְעַד נָהָר
  choice: до Реки
  rationale: Абсолютное употребление נָהָר в библейском геополитическом контексте обычно указывает на Евфрат; краткость оригинала сохранена, а вероятный референт пояснён в сноске.
- source_word: וְיָם מִיָּם
  choice: от моря до моря
  rationale: Естественная русская передача меризма, выражающего широкий пространственный охват.
- source_word: וְהַר הָהָר
  choice: и от горы до горы
  rationale: Сохранены параллельная конструкция и образ широкого пространственного охвата; предлог добавлен по требованиям русского синтаксиса.
theological_decisions:
- issue: Число подразумеваемого субъекта при יָבוֹא
  choice: 'Собирательное множественное: «придут»'
  alternative: 'Формально единственное: «придёт» — об одном лице либо о рассеянном народе как едином целом'
  rationale: Перечень многочисленных областей исхода делает собирательное понимание наиболее естественным по-русски, не определяя точнее, кто именно приходит.
- issue: Значение מָצוֹר в данном стихе
  choice: Географическое обозначение Египта
  alternative: 'Нарицательное значение: «крепость», «осада» или «укреплённый город»'
  rationale: Параллелизм с Ассирией и Рекой поддерживает географическое прочтение, однако подлинная лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; пророческая торжественность сохранена без архаизации. Географический ряд передан кратко, а неоднозначность מָצוֹר вынесена в сноску.
