base_translation:
  language: en
  yaml_path: translation/ot/micah/007/003.yaml
  text: 'Their hands are on evil[a], to do it well: the prince asks, and the judge is for a bribe, and the great man speaks the desire of his soul[c][b]; thus they weave it together.'
translation:
  language: ru
  text: 'Обеими руками они умело творят зло[a]: правитель требует, судья судит за плату[b], а вельможа высказывает желание своей души; и они вместе сплетают это воедино[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Они обеими руками берутся за зло, чтобы совершать его как можно лучше»; подчёркивается их полная вовлечённость и искусность в злодеянии.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст предельно краток: буквально «а судья — за плату». Это может означать, что судья судит за взятку или что он требует вознаграждения.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможен перевод: «они вместе скручивают это». Здесь зло уподоблено сплетаемой или скручиваемой сообща схеме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הָרַע כַּפַּיִם
  choice: Обеими руками они … творят зло
  rationale: Двойственное число כַּפַּיִם позволяет передать образ обеих рук; сочетание выражает полную и деятельную преданность злу.
- source_word: לְהֵיטִיב
  choice: умело
  rationale: Инфинитив породы hифиль от יטב буквально связан с тем, чтобы делать хорошо; наречие сохраняет горькую иронию искусности во зле.
- source_word: הַשַּׂר שֹׁאֵל
  choice: правитель требует
  rationale: שַׂר обозначает правителя или высокопоставленного начальника. В контексте согласованной коррупции שֹׁאֵל имеет оттенок настойчивого запроса, поэтому «требует» естественнее по-русски, хотя предмет требования в еврейском тексте не назван.
- source_word: וְהַשֹּׁפֵט בַּשִּׁלּוּם
  choice: судья судит за плату
  rationale: 'Еврейская фраза эллиптична: буквально «а судья — за плату». Добавление повторного «судит» делает фразу понятной по-русски, не устраняя в примечании возможного иного синтаксического понимания.'
- source_word: וְהַגָּדוֹל
  choice: вельможа
  rationale: Субстантивированное прилагательное обозначает знатного, влиятельного человека. «Вельможа» кратко передаёт высокий общественный статус и подходит к древнему контексту.
- source_word: דֹּבֵר הַוַּת נַפְשׁוֹ
  choice: высказывает пагубное желание своей души
  rationale: הַוָּה допускает значения желания, бедствия, злого умысла и гибели. «Пагубное желание» сохраняет связь внутреннего стремления с разрушительным контекстом, не уточняя конкретный порок.
- source_word: וַיְעַבְּתוּהָ
  choice: и они вместе сплетают всё это
  rationale: Глагол עבת передаёт скручивание, переплетение или сплетение. Формулировка изображает согласованную коррупционную схему; «всё это» естественно передаёт местоименный суффикс, относящийся к описанному злу.
theological_decisions:
- issue: Нравственная характеристика желания вельможи
  choice: пагубное желание
  alternative: желание
  rationale: Возможный разрушительный смысл הַוָּה и общий контекст коррупции оправдывают отрицательную характеристику, но формулировка не приписывает тексту конкретного вида греха.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сохраняет резкое перечисление участников коррупции; «вельможа» слегка исторически окрашено, но понятно современному читателю и точно обозначает влиятельного человека.
