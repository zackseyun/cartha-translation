base_translation:
  language: en
  yaml_path: translation/ot/micah/007/004.yaml
  text: The best of them is like a brier; the upright is worse than a thorn hedge. The day of your watchmen[a], your punishment, has come; now their confusion will be.
translation:
  language: ru
  text: Лучший из них — как колючий куст; праведный — хуже терновой изгороди. Настал день твоих стражей[a], день твоего наказания; теперь их охватит смятение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «День, которого ожидают твои стражи». Еврейское слово может обозначать как наблюдающих стражей, так и тех, кто чего-либо ожидает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָם
  choice: лучший из них
  rationale: Слово טוֹב с суффиксом 3-го лица множественного числа здесь имеет сравнительный смысл и указывает на лучшего среди ранее описанных людей.
- source_word: כְּחֵדֶק
  choice: как колючий куст
  rationale: חֵדֶק обозначает колючее растение; перевод сохраняет образ того, что ранит и мешает пройти.
- source_word: יָשָׁר
  choice: самый честный
  rationale: Субстантивированное прилагательное обозначает человека, считающегося нравственно прямым. Превосходная степень естественно передаёт параллелизм с «лучший из них».
- source_word: מִמְּסוּכָה
  choice: хуже терновой изгороди
  rationale: Предлог מִן выражает сравнение, а מְסוּכָה — изгородь, в данном контексте явно колючую. Слово «хуже» передаёт подразумеваемую отрицательную оценку.
- source_word: מְצַפֶּיךָ
  choice: твоих стражей
  rationale: Причастие от צפה может обозначать тех, кто наблюдает, высматривает или ожидает; «стражи» сохраняет традиционный пророческий образ, а возможный смысл ожидания отмечен в сноске.
- source_word: פְּקֻדָּתְךָ
  choice: твоего наказания
  rationale: פְּקֻדָּה может означать посещение, надзор, взыскание или наказание. В пророчестве о суде «наказание» ясно передаёт судебный смысл.
- source_word: בָאָה
  choice: настал
  rationale: Перфект женского рода согласован с פְּקֻדָּה и представляет объявленный срок суда как уже наступивший.
- source_word: תִהְיֶה מְבוּכָתָם
  choice: их охватит смятение
  rationale: Идиоматическая русская конструкция передаёт буквальное «будет их смятение», сохраняя значение растерянности и замешательства.
theological_decisions:
- issue: Значение פְּקֻדָּתְךָ в пророчестве о суде
  choice: день твоего наказания
  alternative: день твоего посещения / день взыскания с тебя
  rationale: Контекст общественного разложения и грядущего бедствия поддерживает судебное значение. Выбор «наказание» не уточняет ни исполнителя, ни конкретный вид кары и потому не вносит конфессионального толкования.
- issue: Связь выражения יוֹם מְצַפֶּיךָ с последующим פְּקֻדָּתְךָ
  choice: «День твоих стражей, день твоего наказания» как два соотнесённых обозначения одного срока
  alternative: «День, которого ожидают твои стражи, — твоё наказание — настал»
  rationale: Еврейская фраза допускает сжатое приложение и оттенок ожидания. Основной текст сохраняет формальную структуру, а сноска сообщает наиболее существенную синтаксико-лексическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Образы колючего куста и терновой изгороди сохранены; синтаксис второй половины оставлен несколько сжатым, чтобы не устранять неоднозначность еврейского текста.
