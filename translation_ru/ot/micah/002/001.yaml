  text: ה֧וֹי חֹֽשְׁבֵי אָ֛וֶן וּ/פֹ֥עֲלֵי רָ֖ע עַל מִשְׁכְּבוֹתָ֑/ם בְּ/א֤וֹר הַ/בֹּ֨קֶר֙ יַעֲשׂ֔וּ/הָ כִּ֥י יֶשׁ לְ/אֵ֖ל יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/001.yaml
  text: Woe to those who devise wickedness and work out evil on their beds! At the light of morning they do it[a], because it is in the power of their hand.
translation:
  language: ru
  text: Горе тем, кто, лёжа на своих постелях, замышляет беззаконие и готовит зло! С рассветом они совершают задуманное, ведь в их руках сила.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь их рука — их бог»; возможно, это образ самовозвеличивания собственной силы.'
    reason: Альтернативное понимание אֵל как «бог», а не как обозначение силы или власти.
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Пророческое междометие вводит обличение и возвещает бедствие; «горе» сохраняет его торжественную и угрожающую силу.
- source_word: חֹשְׁבֵי אָוֶן
  choice: замышляет беззаконие
  rationale: Причастие от חשב обозначает намеренное обдумывание и составление злого замысла, а אָוֶן здесь имеет нравственный смысл — неправда, беззаконие.
- source_word: וּפֹעֲלֵי רָע
  choice: и готовит зло
  rationale: פֹעֲלֵי передаёт деятельное вырабатывание злого замысла. «Готовит зло» естественно связывает ночное планирование с его исполнением на рассвете, не создавая впечатления, будто зло уже совершено в постели.
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: лёжа на своих постелях
  rationale: Сохраняет конкретный образ ночного замышления и естественно звучит по-русски.
- source_word: בְּאוֹר הַבֹּקֶר
  choice: С рассветом
  rationale: Кратко и образно передаёт буквальное «при свете утра», то есть с появлением утреннего света.
- source_word: יַעֲשׂוּהָ
  choice: они совершают задуманное
  rationale: Женский объектный суффикс отсылает к ранее названному злу или злому делу. «Задуманное» ясно передаёт переход от замысла к исполнению, не уточняя объект сверх контекста.
- source_word: כִּי יֶשׁ לְאֵל יָדָם
  choice: потому что это в их власти
  rationale: 'Наиболее естественное контекстуальное понимание идиомы: они исполняют замысел, поскольку располагают необходимой властью или силой. Русское выражение передаёт смысл без неестественной кальки с образом руки.'
theological_decisions:
- issue: Значение לְאֵל в заключительной части стиха
  choice: 'идиоматическое значение силы или власти: «это в их власти»'
  alternative: «их рука — их бог»
  rationale: 'В контексте заключительная часть объясняет, почему злоумышленники сразу осуществляют свои замыслы: у них есть возможность и власть сделать это. Вместе с тем понимание אֵל как «бог» создаёт возможный образ самовозвеличивания собственной силы; эта подлинная неоднозначность сохранена в примечании.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя; ночной замысел и утреннее исполнение противопоставлены без архаизмов. Маркер примечания поставлен после всей неоднозначной заключительной части.
