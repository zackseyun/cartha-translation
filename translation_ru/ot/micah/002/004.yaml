  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִשָּׂ֧א עֲלֵי/כֶ֣ם מָשָׁ֗ל וְ/נָהָ֨ה נְהִ֤י נִֽהְיָה֙ אָמַר֙ שָׁד֣וֹד נְשַׁדֻּ֔נוּ חֵ֥לֶק עַמִּ֖/י יָמִ֑יר אֵ֚יךְ יָמִ֣ישׁ לִ֔/י לְ/שׁוֹבֵ֥ב שָׂדֵ֖י/נוּ יְחַלֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/004.yaml
  text: On that day one will take up a taunt against you and lament a lament[a], saying, “We are utterly ruined! He changes the portion of my people[b]. How he removes it from me! To the one who turns away he divides our fields.”
translation:
  language: ru
  text: 'В тот день поднимут о вас насмешливое изречение

    и заплачут плачем[a], говоря:


    «Мы совершенно разорены!

    Он меняет удел моего народа.

    Как он отнимает его у меня!

    Тому, кто отступает[b], он разделяет наши поля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и зарыдают рыданием» или «и запоют погребальную песнь». В еврейском тексте повторяются родственные слова, обозначающие плач, что усиливает выражение скорби.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово допускает разные толкования: «отступнику», «мятежнику» или, возможно, «захватчику» / «тому, кто возвращается».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשָּׂא ... מָשָׁל
  choice: сложат насмешливую притчу
  rationale: Оборот буквально означает «поднять/произнести машаль». В контексте суда מָשָׁל обозначает стилизованное изречение с оттенком насмешки; сочетание сохраняет и форму притчи, и её язвительный характер.
- source_word: וְנָהָה נְהִי נִהְיָה
  choice: заплачут горьким плачем
  rationale: Однокоренные и близкие по значению слова усиливают мотив скорби. Русское сочетание передаёт риторическое повторение естественно и торжественно.
- source_word: שָׁדוֹד נְשַׁדֻּנוּ
  choice: мы совершенно разорены
  rationale: 'Инфинитив абсолютный с личной глагольной формой выражает усиление: полное разорение и опустошение.'
- source_word: חֵלֶק עַמִּי
  choice: удел моего народа
  rationale: «Удел» точно и естественно передаёт חֵלֶק в контексте земельного надела, не подменяя его более специальным словом «наследие».
- source_word: יָמִיר
  choice: передаёт другому
  rationale: Hiphil от מוּר означает менять или обменивать. В данном контексте речь идёт о смене владельца удела; добавление «другому» ясно выражает этот смысл, не уточняя способ передачи.
- source_word: אֵיךְ יָמִישׁ לִי
  choice: как Он отнимает его у меня
  rationale: Восклицательное אֵיךְ выражает потрясение, а Hiphil от מוּשׁ — удаление. Местоимение «его» отсылает к уделу.
- source_word: לְשׁוֹבֵב
  choice: отступнику
  rationale: Трудная форма, вероятно, обозначает того, кто отворачивается или отступает. «Отступник» кратко передаёт этот смысл; неоднозначность сохранена в примечании.
- source_word: שָׂדֵינוּ יְחַלֵּק
  choice: Он раздаёт наши поля
  rationale: Глагол означает делить или распределять. «Раздаёт» естественно описывает распределение отнятых полей между другими владельцами.
theological_decisions:
- issue: Кто подразумевается под действующим лицом в יָמִיר, יָמִישׁ и יְחַלֵּק
  choice: местоимение «Он» с прописной буквы, указывающее на Бога как совершающего суд
  alternative: «он» — неопределённый или вражеский распорядитель земли
  rationale: Контекст пророческого суда позволяет понимать подразумеваемого субъекта как Господа, хотя непосредственно в стихе он не назван. Прописная буква делает эту принятую интерпретацию заметной, не добавляя имени.
- issue: Толкование לְשׁוֹבֵב
  choice: отступнику
  alternative: мятежнику; захватчику; тому, кто отворачивается или возвращает
  rationale: Еврейская форма лексически и синтаксически спорна. Основной текст даёт вероятное субстантивированное значение от идеи отступления, а примечание сохраняет реальные альтернативы.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Поэтическая разбивка отражает речь плача. Сохранены повтор скорбной лексики, резкие восклицания и неоднозначность трудной заключительной фразы.
