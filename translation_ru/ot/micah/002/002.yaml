base_translation:
  language: en
  yaml_path: translation/ot/micah/002/002.yaml
  text: They covet fields and seize them[a], and houses and take them away; they oppress a man and his house[c][b], a man and his inheritance.
translation:
  language: ru
  text: Они зарятся на поля и захватывают их[a], на дома — и отнимают их[b]; они притесняют мужчину и его дом[c], человека и его наследственный удел[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отнимают силой»; глагол указывает на насильственное или неправомерное завладение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально возможно: «уносят» или «забирают».'
    reason: lexical_alternative
  - marker: c
    text: «Дом» может означать как жилище, так и домашних, то есть семью.
    reason: semantic_ambiguity
  - marker: d
    text: «Наследственный удел» — прежде всего унаследованная земля или родовое владение, а не просто имущество вообще.
    reason: cultural_note
lexical_decisions:
- source_word: חָמְדוּ
  choice: желают чужих
  rationale: Глагол обозначает желание завладеть тем, что принадлежит другому. Добавление «чужих» естественно передаёт по-русски нравственно предосудительный смысл, не сводя его к нейтральному желанию.
- source_word: שָׂדוֹת
  choice: поля
  rationale: Прямое и конкретное обозначение земельных участков, соответствующее имущественному контексту.
- source_word: גָזָלוּ
  choice: захватывают
  rationale: Передаёт насильственное или неправомерное завладение полями; возможный оттенок ограбления отмечен в сноске.
- source_word: בָתִּים
  choice: дома
  rationale: Сохраняет конкретный имущественный образ еврейского текста.
- source_word: נָשָׂאוּ
  choice: отнимают
  rationale: В данном контексте глагол означает унести или забрать присвоенное. Для домов «отнимают» звучит естественно и ясно указывает на лишение собственности.
- source_word: עָשְׁקוּ
  choice: притесняют
  rationale: Сохраняет широкий смысл общественного и имущественного угнетения, не ограничивая его только обманом или вымогательством.
- source_word: גֶּבֶר
  choice: мужчину
  rationale: Передаёт мужской род и единственное число исходного существительного, а также отличает его от параллельного אִישׁ.
- source_word: בֵיתוֹ
  choice: его дом
  rationale: Сохраняет как непосредственный имущественный смысл, так и возможную связь с домашними; неоднозначность поясняется в сноске.
- source_word: אִישׁ
  choice: человека
  rationale: Естественное русское обозначение отдельного человека в параллельной конструкции; мужское единственное число исходной формы не переводится во множественное или гендерно нейтрализованное выражение.
- source_word: נַחֲלָתוֹ
  choice: его наследственный удел
  rationale: «Наследственный удел» передаёт не просто имущество, а полученную по наследству землю или родовое владение.
theological_decisions:
- issue: Мужской род существительных גֶּבֶר и אִישׁ
  choice: мужчину … человека
  alternative: человека … человека; людей … их удел
  rationale: Перевод сохраняет мужское единственное число и представительный параллелизм еврейского текста, не заменяя его множественным числом. Разные русские слова также отражают лексическое различие между двумя еврейскими существительными.
- issue: Значение נַחֲלָה
  choice: наследственный удел
  alternative: имущество; собственность
  rationale: Выбранный вариант сохраняет правовой, родовой и земельный смысл понятия, не сводя его к собственности вообще.
translation_notes:
  register: Современный литературный русский язык с чётким параллелизмом исходного стиха. Настоящее время передаёт характерные, повторяющиеся действия обличаемых людей в данном пророческом контексте. Формулировки сохраняют имущественную направленность стиха и не устраняют неоднозначность слова «дом».
