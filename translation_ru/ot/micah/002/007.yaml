base_translation:
  language: en
  yaml_path: translation/ot/micah/002/007.yaml
  text: Should it be said[a], O house of Jacob, “Is the Spirit of Yahweh impatient? Are these his deeds?” Do not my words do good to the one who walks uprightly?
translation:
  language: ru
  text: 'Разве говорят, дом Иакова: «Разве Дух Яхве нетерпелив?[a] Разве это Его дела?» Разве Мои слова не приносят добра тому, кто поступает прямо?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Разве сократился Дух Яхве?» Еврейское выражение может также означать: «Разве терпение Яхве иссякло?»'
    reason: Сохраняет буквальный образ и смысловую неоднозначность слова רוּחַ, которое может обозначать дух, внутреннее расположение или терпение.
lexical_decisions:
- source_word: הֶאָמ֣וּר
  choice: Неужели следует говорить
  rationale: Безличный риторический вопрос естественно передаёт вводимую еврейской формой оспариваемую речь, не превращая её в простое утверждение.
- source_word: בֵּית יַעֲקֹב
  choice: дом Иакова
  rationale: Сохранено традиционное коллективное обозначение народа и прямое пророческое обращение.
- source_word: הֲקָצַר רוּחַ יְהוָה
  choice: Разве Дух Яхве нетерпелив?
  rationale: Идиома с קצר и רוח передана понятным современным языком; «Дух Яхве» сохранён в основном тексте, а возможность понимать רוח как терпение или расположение указана в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное заветное имя передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: אִם אֵלֶּה מַעֲלָלָיו
  choice: Разве таковы Его дела?
  rationale: Краткий параллельный риторический вопрос сохраняет значение «дела, поступки» и связь с предшествующим обвинением.
- source_word: דְבָרַי יֵיטִיבוּ
  choice: Мои слова не приносят добра
  rationale: Сохранены множественное число «слова» и благотворное значение каузативной формы יטב.
- source_word: עִם הַיָּשָׁר הוֹלֵךְ
  choice: тому, кто идёт прямым путём
  rationale: Передана библейская метафора хождения как образа постоянного образа жизни; «прямым путём» естественно выражает нравственную прямоту.
theological_decisions:
- issue: Личное или идиоматическое понимание רוּחַ יְהוָה
  choice: Дух Яхве
  alternative: терпение Яхве; расположение Яхве
  rationale: Конструкция допускает отнесение к Духу Яхве, однако идиома «короткий дух» может описывать нетерпение. Основной текст следует личному прочтению, а сноска сохраняет реальную смысловую неоднозначность.
- issue: К кому относятся формы первого лица в «Мои слова»
  choice: к Яхве
  alternative: к пророку как непосредственному говорящему
  rationale: В контексте противопоставления дел и слов Яхве наиболее вероятно, что речь продолжается от Его лица; прописная буква помогает обозначить это чтение, не добавляя имени в текст.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной пророческой интонацией. Риторические вопросы и метафора прямого пути сохранены; архаизмы и конфессионально специфическая терминология не используются.
