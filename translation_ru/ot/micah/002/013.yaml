  text: עָלָ֤ה הַ/פֹּרֵץ֙ לִ/פְנֵי/הֶ֔ם פָּֽרְצוּ֙ וַֽ/יַּעֲבֹ֔רוּ שַׁ֖עַר וַ/יֵּ֣צְאוּ ב֑/וֹ וַ/יַּעֲבֹ֤ר מַלְכָּ/ם֙ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה בְּ/רֹאשָֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/013.yaml
  text: The one who breaks through has gone up before them[a]; they have broken through and passed through the gate, and gone out by it. Their king passes on before them[c][b], and Yahweh is at their head.
translation:
  language: ru
  text: Тот, кто пробивает брешь[a][b], поднялся впереди них; они прорвались, прошли через ворота и вышли через них. Их царь прошёл впереди них, а Господь[c] — во главе их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Прорывающийся» или «Тот, кто прорывает». Еврейское причастие может служить подобным титулу обозначением того, кто проламывает преграду и открывает путь.'
    reason: lexical_alternative
  - marker: b
    text: 'Кого именно обозначает «Тот, кто пробивает брешь», неясно: это может быть военный предводитель, царь или сам Господь. Еврейский текст прямо не определяет, как эта фигура соотносится с упомянутыми далее царём и Господом.'
    reason: alternative_reading
  - marker: c
    text: В еврейском тексте стоит имя יהוה (ЙХВХ), традиционно передаваемое как «Господь».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפֹּרֵץ
  choice: Пробивающий проход
  rationale: Причастие с артиклем от פרץ («прорываться, пробивать брешь») употреблено как обозначение действующего лица. Перевод сохраняет образ того, кто устраняет преграду и открывает путь, не отождествляя его с конкретной фигурой.
- source_word: עָלָה
  choice: поднялся
  rationale: Форма qal perfect 3 м. р. ед. ч. передана завершённым действием; «поднялся» сохраняет основное пространственное значение глагола и подходит к пророческому изображению шествия.
- source_word: לִפְנֵיהֶם
  choice: впереди них
  rationale: Естественно передаёт пространственное значение «перед ними, впереди них» в обоих случаях.
- source_word: פָּרְצוּ
  choice: прорвались
  rationale: Сохраняет связь с корнем פרץ в обозначении «Пробивающий проход» и не добавляет в основной текст не названный прямо объект действия.
- source_word: וַיַּעֲבֹרוּ שַׁעַר
  choice: прошли через ворота
  rationale: עבר обозначает прохождение, а שַׁעַר здесь — ворота, через которые движется народ. Русское множественное «ворота» соответствует естественному обозначению сооружения.
- source_word: וַיֵּצְאוּ בוֹ
  choice: вышли через них
  rationale: Местоименное выражение относится к воротам; русский перевод согласует местоимение с нормативной формой множественного числа «ворота».
- source_word: מַלְכָּם
  choice: их царь
  rationale: Сохраняет прямое царское значение существительного и не заменяет его более общим словом «правитель».
- source_word: וַיהוָה
  choice: Господь
  rationale: Тетраграмматон передан традиционным русским соответствием «Господь», а форма исходного текста указана в сноске.
- source_word: בְּרֹאשָׁם
  choice: во главе их
  rationale: Сохраняет метафору ведущего положения и не сводит её к более толковательному «как их предводитель».
theological_decisions:
- issue: Кто такой הַפֹּרֵץ («Пробивающий проход»)
  choice: Передать фигуру описательно, не определяя её личность в основном тексте.
  alternative: Военачальник; царь или мессианский правитель; сам Господь, открывающий путь.
  rationale: Еврейский текст ставит рядом «Пробивающего проход», «их царя» и Господа, но прямо не разъясняет отношения между ними. Перевод сохраняет эту неоднозначность.
- issue: Соотношение «их царя» и Господа
  choice: Сохранить их как два отдельных выражения.
  alternative: Понять их как два наименования одной фигуры или слить в переводе.
  rationale: В еврейском тексте «их царь» и Господь названы последовательно и раздельно. Возможное богословское отождествление не следует вносить в перевод.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом. Повтор «впереди них» сохраняет композицию оригинала; конструкция «во главе их» слегка возвышенна и передаёт исходную метафору без лишнего истолкования.
