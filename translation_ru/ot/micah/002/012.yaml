  text: אָסֹ֨ף אֶאֱסֹ֜ף יַעֲקֹ֣ב כֻּלָּ֗/ךְ קַבֵּ֤ץ אֲקַבֵּץ֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל יַ֥חַד אֲשִׂימֶ֖/נּוּ כְּ/צֹ֣אן בָּצְרָ֑ה כְּ/עֵ֨דֶר֙ בְּ/ת֣וֹךְ הַ/דָּֽבְר֔/וֹ תְּהִימֶ֖נָה מֵ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/012.yaml
  text: I will surely gather all of you[a], Jacob; I will surely collect the remnant of Israel. Together I will set them like the sheep of Bozrah, like a flock in the midst of its pasture[c][b]; they will be noisy with men.
translation:
  language: ru
  text: 'Я непременно соберу тебя всего, Иаков,

    непременно соберу воедино остаток Израиля.

    Я сведу их воедино, как овец Боцры[a],

    как стадо посреди своего пастбища[b];

    они будут шуметь от множества людей[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как овец в загоне». Еврейское בָּצְרָה традиционно понимается как название города Боцра, но его также связывают со словом, обозначающим ограду или овечий загон.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как стадо посреди своего загона». Употреблённое здесь еврейское слово редкое и допускает оба пастушеских образа.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможные переводы: «они будут шуметь из-за людей» или «там будет тесно от людей». Еврейское выражение допускает разные толкования.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֶאֱסֹף
  choice: Я непременно соберу
  rationale: Сочетание инфинитива абсолютного с личной формой глагола усиливает утверждение. «Непременно» естественно передаёт эту эмфазу.
- source_word: יַעֲקֹב כֻּלָּךְ
  choice: всего тебя, Иаков
  rationale: Местоименный суффикс единственного числа сохраняет прямое обращение к Иакову как к собирательному целому; перевод не превращает обращение в безличное «всего Иакова».
- source_word: קַבֵּץ אֲקַבֵּץ
  choice: непременно соберу воедино
  rationale: Вторая усилительная конструкция параллельна первой. «Воедино» передаёт оттенок соединения рассеянных людей и слегка различает два близких еврейских глагола.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: остаток Израиля
  rationale: «Остаток» — точный и укоренившийся пророческий термин для уцелевшей или восстановленной части народа.
- source_word: יַחַד אֲשִׂימֶנּוּ
  choice: Я размещу их вместе
  rationale: Еврейский суффикс формально единственного числа относится к собирательному «остатку»; по-русски естественно употребить множественное «их». «Вместе» непосредственно передаёт יַחַד.
- source_word: כְּצֹאן בָּצְרָה
  choice: как овец Боцры
  rationale: Масоретский текст традиционно понимается как название места Боцра. Возможное нарицательное значение, связанное с загоном, сохранено в сноске.
- source_word: כְּעֵדֶר בְּתוֹךְ הַדָּבְרוֹ
  choice: как стадо посреди его пастбища
  rationale: Редкое пастушеское слово здесь по параллелизму и образу стада естественно означает пастбище; возможное значение «загон» отмечено в сноске.
- source_word: תְּהִימֶנָה מֵאָדָם
  choice: они будут шуметь от множества людей
  rationale: Глагол обозначает громкий шум или гул, а сочетание с מֵאָדָם трудно для однозначного истолкования. «От множества людей» передаёт картину людного, гулкого собрания, не придавая шуму непременно враждебного характера.
theological_decisions:
- issue: Обетование о восстановлении, обращённое к Иакову и Израилю
  choice: Сохранено прямое обещание собрать Иакова и остаток Израиля.
  alternative: Понимать речь исключительно как отвлечённую метафору духовного восстановления или только как указание на отдалённые последние времена.
  rationale: Еврейский текст прямо называет Иакова и Израиль и использует образ собираемого остатка. Перевод сохраняет историко-народный смысл, не навязывая ему более узкой богословской схемы.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Поэтическое членение сохраняет параллелизм и усилительные повторы оригинала; редкие и спорные пастушеские выражения не сглажены без пояснений.
