source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י חֹשֵׁ֛ב עַל הַ/מִּשְׁפָּחָ֥ה הַ/זֹּ֖את רָעָ֑ה אֲ֠שֶׁר לֹֽא תָמִ֨ישׁוּ מִ/שָּׁ֜ם צַוְּארֹֽתֵי/כֶ֗ם וְ/לֹ֤א תֵֽלְכוּ֙ רוֹמָ֔ה כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/003.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am planning disaster against this family, from which you will not remove your necks, and you will not walk haughtily[d][c][b], for it is an evil time.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве: «Вот, Я замышляю бедствие против этого рода[a], из-под которого вы не сможете высвободить шеи[b]. Вы не будете ходить, гордо подняв голову[c], ибо это время бедствия[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семейства», «клана». Еврейское מִשְׁפָּחָה может обозначать семью, род или более широкую родственную группу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «оттуда вы не уберёте своих шей». Это образ ярма или бремени, из-под которого невозможно высвободиться.'
    reason: cultural_note
  - marker: c
    text: 'Или: «не будете ходить надменно»; буквально выражение связано с высотой и может подразумевать гордо поднятую голову.'
    reason: lexical_alternative
  - marker: d
    text: В еврейском тексте одно и то же слово רָעָה обозначает и замышляемое «бедствие», и «время бедствия», создавая намеренный повтор.
    reason: literary_note
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и вводит ответ Яхве на беззакония, описанные перед этим.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Естественная для современного русского языка пророческая формула; личное имя Бога передано как «Яхве».
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет эмфатический характер вводимого Божьего объявления без архаизации.
- source_word: חֹשֵׁב
  choice: замышляю
  rationale: Сохраняет смысл обдуманного намерения и перекличку с тем же корнем в Мих 2:1, где люди замышляют беззаконие.
- source_word: עַל הַמִּשְׁפָּחָה הַזֹּאת
  choice: против этого рода
  rationale: «Род» обозначает более широкую родственную общность, чем отдельная семья, и уместен в данном коллективном контексте суда.
- source_word: רָעָה
  choice: бедствие / бедственное
  rationale: В контексте Божьего суда слово означает несчастье или бедствие, а не нравственное зло; однокоренная русская передача сохраняет повтор в еврейском тексте.
- source_word: אֲשֶׁר לֹא תָמִישׁוּ מִשָּׁם צַוְּארֹתֵיכֶם
  choice: из-под которого вы не высвободите своих шей
  rationale: Сохраняет образ шеи под наложенным ярмом или бременем и естественно связывает относительное местоимение с грядущим бедствием.
- source_word: וְלֹא תֵלְכוּ רוֹמָה
  choice: вы уже не будете ходить, гордо подняв голову
  rationale: Передаёт буквальный образ высоты и контекстуальный смысл гордой, надменной осанки.
- source_word: כִּי עֵת רָעָה הִיא
  choice: потому что это будет бедственное время
  rationale: Естественно обозначает наступающий период суда и сохраняет лексическую связь с первым употреблением רָעָה.
theological_decisions:
- issue: Значение רָעָה применительно к действию Яхве
  choice: «бедствие» и «бедственное время»
  alternative: «зло» и «злое время» либо «бедствие» без сохранения повтора
  rationale: Контекст говорит о карающем бедствии, которое Бог намерен навести, а не о нравственном зле с Его стороны. Повтор основы «бедств-» воспроизводит намеренное повторение еврейского слова.
- issue: Смысл образа шей
  choice: Сохранён образ невозможности высвободить шеи из-под бедствия как ярма
  alternative: Разъясняющая передача «от этого вы не сможете избавиться»
  rationale: Исходный текст использует напряжённую метафору наложенного ярма; её сохранение не устраняет возможную смысловую многослойность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся ясным для обычного читателя; метафора шеи под ярмом сохранена, а необычность пояснена в сноске. Повтор «бедствие — бедственное» передаёт риторику оригинала без намёка на нравственное зло в Боге.
