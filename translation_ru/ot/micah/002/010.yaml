  yaml_path: translation/ot/micah/002/010.yaml
  text: Rise and go[a], for this is not the resting place; because of uncleanness it brings destruction[b], even grievous destruction.
translation:
  language: ru
  text: Встаньте и уходите[a], потому что это не место покоя. Из-за нечистоты оно несёт гибель[b] — гибель тяжёлую.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Встаньте и идите». Далее можно перевести: «потому что это не покой». Еврейское слово означает как «покой», так и «место покоя»; здесь, вероятно, имеется в виду земля как место мирной, оседлой жизни Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально здесь употреблены однокоренные глагол и существительное, усиливающие друг друга. Возможный перевод: «оно разрушает — жестоким разрушением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ וּ/לְכ֔וּ
  choice: Встаньте и уходите
  rationale: Два повелительных глагола во множественном числе переданы прямо и естественно; «уходите» в контексте изгнания яснее простого «идите», но не уточняет направление.
- source_word: כִּ֥י לֹא זֹ֖את הַ/מְּנוּחָ֑ה
  choice: потому что это не место покоя
  rationale: מְנוּחָה может обозначать как покой, так и место покоя. Указательное «это» и контекст земли поддерживают конкретное значение, при этом сноска сохраняет лексическую неоднозначность.
- source_word: בַּ/עֲב֥וּר טָמְאָ֛ה
  choice: из-за нечистоты
  rationale: Передаёт причинное выражение без добавления явно названного подлежащего к краткой и неоднозначной еврейской формулировке; «нечистота» сохраняет нравственно-культовый оттенок.
- source_word: תְּחַבֵּ֖ל וְ/חֶ֥בֶל
  choice: оно губит — и гибель
  rationale: Глагол и однокоренное существительное переданы однокоренными русскими словами, чтобы сохранить выразительный повтор и усиление оригинала.
- source_word: נִמְרָֽץ
  choice: тяжела
  rationale: Слово выражает силу и суровость; предикативное «тяжела» естественно сочетается с «гибель» и не сужает смысл до одного вида разрушения.
theological_decisions:
- issue: К чему относится форма женского рода в причинной части стиха
  choice: Вероятный референт передан местоимением «оно», соотносимым с «местом покоя», а причина названа как «нечистота».
  alternative: Можно понять, что осквернённая земля сама губит, либо что губительной причиной является нечистота как таковая.
  rationale: Еврейские формы допускают связь с מְנוּחָה женского рода, то есть с землёй как местом покоя, но синтаксис сжат. Перевод не называет землю прямо и тем самым не устраняет напряжение.
- issue: Сила выражения וְחבל נמרץ
  choice: 'Однокоренной повтор с последующим усилением: «губит — и гибель тяжела».'
  alternative: «разрушает — жестоким разрушением» или «губит — да, гибелью тяжкой».
  rationale: Так сохраняются и figura etymologica, и риторическое нарастание без искусственно архаической конструкции.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-пророческим звучанием. Синтаксическая и референтная неоднозначность причинной части не устранена чрезмерным пояснением; однокоренной повтор оригинала сохранён.
