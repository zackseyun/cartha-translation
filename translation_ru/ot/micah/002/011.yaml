source:
  edition: WLC
  text: לוּ אִ֞ישׁ הֹלֵ֥ךְ ר֨וּחַ֙ וָ/שֶׁ֣קֶר כִּזֵּ֔ב אַטִּ֣ף לְ/ךָ֔ לַ/יַּ֖יִן וְ/לַ/שֵּׁכָ֑ר וְ/הָיָ֥ה מַטִּ֖יף הָ/עָ֥ם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/011.yaml
  text: If a man should go about with wind and falsehood[a], lying, ‘I will preach to you of wine and strong drink,’ he would be the preacher of this people.
translation:
  language: ru
  text: 'Если бы человек, ходящий с ветром и ложью[a], солгал: «Я буду пророчествовать тебе о вине и хмельном напитке», — он и был бы пророком для этого народа.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение допускает более буквальный перевод: «ходящий с ветром и ложью». Ветер здесь может служить образом пустоты и беспочвенности, однако сам образ намеренно сохранён в тексте.'
    reason: lexical_ambiguity
  - marker: b
    text: В обеих частях стиха употреблены формы одного еврейского глагола, буквально означающего «капать, изливать по капле» и применяемого к пророческой речи. Здесь он звучит с горькой иронией.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּ
  choice: Если бы
  rationale: Частица вводит гипотетическое условие; условная конструкция с «бы» естественно передаёт сатирический смысл стиха, не добавляя оттенка пожелания.
- source_word: אִישׁ
  choice: человек
  rationale: Сохраняет единственное число и обобщённое значение, оставаясь естественным для современного русского языка.
- source_word: הֹלֵךְ רוּחַ וָשֶׁקֶר
  choice: ходящий с ветром и ложью
  rationale: Сохраняет трудный и выразительный образ ветра как чего-то пустого и беспочвенного, не сводя его безоговорочно к толкованию «пустослов».
- source_word: כִּזֵּב
  choice: солгал
  rationale: Передаёт явное указание на ложь и естественно вводит последующую прямую речь как содержание обмана.
- source_word: אַטִּף / מַטִּיף
  choice: буду пророчествовать / пророк
  rationale: Глагол буквально связан с истечением или капанием, но употребляется о пророческой речи. Однокоренные русские слова сохраняют связь между двумя частями стиха и передают горькую иронию.
- source_word: לַיַּיִן וְלַשֵּׁכָר
  choice: о вине и хмельном напитке
  rationale: Предлог указывает на содержание обещанной речи. «Хмельной напиток» передаёт общее название опьяняющего питья, не создавая анахроничного впечатления о крепком дистиллированном алкоголе.
- source_word: הָעָם הַזֶּה
  choice: этого народа
  rationale: Сохраняет собирательное единственное число и обличительный указательный оборот оригинала.
theological_decisions:
- issue: Ироническое употребление глагола пророческой речи נטף
  choice: «пророчествовать / пророк» с пояснением буквального образа в сноске
  alternative: «проповедовать / проповедник» или буквальное «изливать слова»
  rationale: Контекст высмеивает религиозного вестника, которого охотно принял бы народ. «Пророчествовать» ясно показывает эту функцию, но не утверждает истинность его пророческого авторитета; ложность прямо выражена словом «солгал».
translation_notes:
  register: Современный литературный русский язык с сохранением резкого пророческого обличения. Необычный образ «ходящий с ветром и ложью» оставлен намеренно, а его возможный смысл пояснён в сноске. Формы «пророчествовать / пророк» обеспечивают ясность и воспроизводят внутреннюю словесную связь оригинала.
