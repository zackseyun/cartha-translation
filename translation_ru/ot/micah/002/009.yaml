base_translation:
  language: en
  yaml_path: translation/ot/micah/002/009.yaml
  text: You drive the women of my people out from their delightful houses[b][a]; from their children you take away my splendor forever.
translation:
  language: ru
  text: Женщин Моего народа вы изгоняете из их домов, полных радости[a]; у их детей вы навсегда отнимаете Моё величие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жён Моего народа». Еврейское слово может означать как женщин вообще, так и жён.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Мою славу». Еврейское слово может означать величие, великолепие, славу или честь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁי עַמִּי
  choice: женщин Моего народа
  rationale: Форма נְשֵׁי может обозначать как женщин, так и жён. В контексте обвинения более широкое «женщин» естественно передаёт уязвимую группу, не устраняя альтернативу, отмеченную в сноске.
- source_word: תְּגָרְשׁוּן
  choice: вы изгоняете
  rationale: Порода пиэль глагола גרשׁ выражает насильственное удаление; «изгоняете» сохраняет эту силу и звучит естественно по-русски.
- source_word: מִבֵּית תַּעֲנֻגֶיהָ
  choice: из их уютных домов
  rationale: Буквально сочетание говорит о доме приятностей или наслаждений; местоименный суффикс женского рода единственного числа имеет собирательно-распределительное значение. «Уютные дома» передаёт приятность, безопасность и домашний уклад без неестественной буквальности.
- source_word: מֵעַל עֹלָלֶיהָ
  choice: у их малых детей
  rationale: עוֹלָל обозначает маленького ребёнка или младенца. Конструкция מֵעַל с לקח здесь естественно передаётся по-русски как «отнимать у»; «малых детей» сохраняет указание на возраст.
- source_word: תִּקְחוּ
  choice: вы ... отнимаете
  rationale: לקח значит «брать», но в контексте лишения русское «отнимать» точно передаёт направленное против детей действие.
- source_word: הֲדָרִי
  choice: Моё величие
  rationale: הָדָר охватывает значения великолепия, величия, славы и чести. «Величие» сохраняет возвышенность и божественное первое лицо, не превращая слово в узкий богословский термин.
- source_word: לְעוֹלָם
  choice: навсегда
  rationale: Здесь עוֹלָם выражает непреходящую или неопределённо долгую утрату; «навсегда» естественно для пророческого обличения.
theological_decisions:
- issue: К кому относится первое лицо в выражениях «Моего народа» и «Моё величие»
  choice: Сохранена прямая речь Господа и божественное первое лицо.
  alternative: Понимать «Моё величие» как достоинство или славу, дарованные Богом детям.
  rationale: Ближайший пророческий контекст допускает речь Господа. Дословное сохранение «Моё» удерживает богословское напряжение и не решает, означает ли выражение непосредственно Божье величие либо данное Им достоинство.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис прямой и понятный; повтор «вы» сохраняет обвинительный ритм еврейского текста. Заглавные буквы в местоимениях первого лица обозначают речь Господа согласно русской библейской издательской традиции.
