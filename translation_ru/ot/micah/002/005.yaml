source:
  edition: WLC
  text: לָ/כֵן֙ לֹֽא יִֽהְיֶ֣ה לְ/ךָ֔ מַשְׁלִ֥יךְ חֶ֖בֶל בְּ/גוֹרָ֑ל בִּ/קְהַ֖ל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/005.yaml
  text: Therefore you will have no one to cast the measuring line by lot in the assembly of Yahweh[a][b].
translation:
  language: ru
  text: Поэтому не будет у тебя никого, кто по жребию протянет мерный шнур[a] в собрании Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мерную верёвку», «линию» или «линию надела». Еврейское слово обозначает шнур, которым отмеряли наследственные земельные участки.'
    reason: lexical_alternative
  - marker: b
    text: То есть в собравшейся общине завета, когда землю распределяют между её членами.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт следствие из предшествующего обвинения и приговора.
- source_word: לֹא יִהְיֶה לְךָ
  choice: не будет у тебя того
  rationale: Сохраняет прямое обращение во втором лице единственного числа и экзистенциальную конструкцию оригинала.
- source_word: מַשְׁלִיךְ
  choice: кто бросит
  rationale: Причастие употреблено субстантивированно и обозначает человека, совершающего действие.
- source_word: חֶבֶל
  choice: мерную верёвку
  rationale: В контексте раздела земли означает шнур, которым отмеряли земельный надел; формулировка сохраняет конкретный образ.
- source_word: בְּגוֹרָל
  choice: по жребию
  rationale: Передаёт распределение земли посредством жребия, не подменяя его более общим понятием наделения.
- source_word: בִּקְהַל יְהוָה
  choice: в собрании Яхве
  rationale: קהל обозначает собранную общину, а личное имя יהוה передано транслитерацией «Яхве».
theological_decisions:
- issue: К кому обращён приговор во втором лице единственного числа
  choice: 'Сохранено прямое единственное число: «у тебя»'
  alternative: «У вас не будет никого» — обращение к группе; либо уточнение, что речь именно о землевладельцах или вождях
  rationale: Контекст указывает на притеснителей, захватывающих землю, но сам стих не уточняет адресата сверх формы единственного числа; перевод сохраняет эту неоднозначность.
- issue: Смысл участия в будущем разделе земли
  choice: Сохранён образ бросания мерной верёвки по жребию в собрании Яхве
  alternative: Разъяснить в основном тексте как лишение доли при распределении земли
  rationale: Образ одновременно выражает измерение и распределение наследственной земли; прямой перевод сохраняет его богословскую и историческую насыщенность, а пояснение вынесено в сноски.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Конструкция «не будет у тебя того» намеренно несколько формальна, чтобы сохранить прямоту и структуру еврейского приговора; «мерная верёвка» понятнее современному читателю, чем специальное «мерный шнур».
