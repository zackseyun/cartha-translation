base_translation:
  language: en
  yaml_path: translation/ot/micah/002/008.yaml
  text: But lately my people have risen up as an enemy; from off the garment you strip the robe from those who pass by securely[a], those returning from war.
translation:
  language: ru
  text: 'Но с недавних пор мой народ восстаёт как враг: с одежды тех, кто проходит без опаски и возвращается с войны[a], вы срываете плащ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто сторонится войны»; возможно также: «тех, кто отвернулся от битвы». Последнее еврейское выражение трудно для понимания и может обозначать мирных людей, а не воинов, возвращающихся с войны.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶתְמוּל
  choice: Но с недавних пор
  rationale: Наречие буквально связано со «вчера», но здесь указывает на недавнее время; союз передаёт контраст с предшествующим контекстом.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Прямо передаёт притяжательную конструкцию и сохраняет заветное звучание.
- source_word: לְאוֹיֵב יְקוֹמֵם
  choice: восстаёт как враг
  rationale: Сохраняет образ враждебного выступления и сравнительно-предикативную силу לְ, не превращая народ буквально во врага.
- source_word: מִמּוּל שַׂלְמָה אֶדֶר תַּפְשִׁטוּן
  choice: с одежды вы срываете плащ
  rationale: Передаёт образ насильственного снятия верхнего одеяния и сохраняет оба обозначения одежды, не навязывая им чрезмерно точного технического различия.
- source_word: מֵעֹבְרִים בֶּטַח
  choice: у тех, кто мирно проходит мимо
  rationale: Причастие עבר обозначает проходящих людей, а בֶּטַח — их безопасное, не настороженное состояние; «мирно» естественно звучит по-русски и соответствует контексту.
- source_word: שׁוּבֵי מִלְחָמָה
  choice: возвращаясь с войны
  rationale: Основной текст следует прямому пониманию שוב как возвращения, но трудность конструкции и возможное указание на мирных людей отражены в сноске.
theological_decisions:
- issue: Смысл трудного выражения שׁוּבֵי מִלְחָמָה
  choice: возвращаясь с войны
  alternative: сторонясь войны / отвернувшись от битвы
  rationale: Выбранное прочтение естественно понимает שוב как «возвращаться» и согласуется с образом уязвимых путников. Поскольку еврейская конструкция допускает и описание мирных, не участвующих в войне людей, эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; обвинительная пророческая интонация сохранена. Формулировка остаётся образной и прямой, без архаизмов и конфессионально окрашенных уточнений.
