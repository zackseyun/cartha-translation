  text: אַל תַּטִּ֖פוּ יַטִּיפ֑וּ/ן לֹֽא יַטִּ֣פוּ לָ/אֵ֔לֶּה לֹ֥א יִסַּ֖ג כְּלִמּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/006.yaml
  text: “Do not preach,” they preach. “One should not preach about these things; disgrace will not overtake us.”
translation:
  language: ru
  text: «Не пророчествуйте», — пророчествуют они[a]. «Не следует пророчествовать обо всём этом; позор не наступит»[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально здесь повторяется глагол со значением «капать»; в переносном употреблении он означает «изрекать пророчество» или «проповедовать».
    reason: Сохраняет образность и игру на повторе одного еврейского корня.
  - marker: b
    text: 'Заключительные слова трудны для толкования. Возможно также: «позор не отступит» или «поношения не прекратятся».'
    reason: Отмечает реальную лексико-синтаксическую неоднозначность еврейского текста, не подменяя ею наиболее связное контекстуальное чтение.
lexical_decisions:
- source_word: תַּטִּיפוּ / יַטִּיפוּן
  choice: «пророчествуйте» / «пророчествуют»
  rationale: Глагол נטף буквально связан с капанием, но в пророческой речи употребляется в значении «изрекать пророчество, проповедовать». Повтор корня сохранён.
- source_word: לָאֵלֶּה
  choice: «об этом»
  rationale: 'Предлог ל с указательным местоимением допускает разные оттенки связи; в контексте запрета пророческой речи естественно передать как тему: «об этом».'
- source_word: כְּלִמּוֹת
  choice: «позор»
  rationale: Множественная форма существительного выражает бесчестье, унижение или поношение; русское собирательное «позор» естественно в данном утверждении.
- source_word: יִסַּג
  choice: «постигнет»
  rationale: В контексте самоуверенной речи противников пророка выражение понимается как отрицание наступления позора; при этом форма и корень допускают трудное альтернативное прочтение, отмеченное в сноске.
theological_decisions:
- issue: Кто произносит запрет и заверение в конце стиха
  choice: Обе реплики представлены как речь противников пророчества
  alternative: После первого запрета слова могут пониматься как ответ самого пророка или как повествовательный комментарий
  rationale: Повтор глагола и смысловая последовательность естественно передают насмешливое требование не пророчествовать и самоуверенное отрицание грядущего позора, но синтаксис еврейского текста остаётся сжатым.
- issue: Смысл заключительной фразы
  choice: «позор нас не постигнет»
  alternative: «позор не отступит» или «поношения не прекратятся»
  rationale: Основной текст следует контекстуальному пониманию угрозы, которую адресаты отвергают; альтернативное чтение точнее отражает возможный разбор формы от סוג/נסג и потому сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык; реплики оформлены ясно и кратко. Выбрано «пророчествовать», а не церковно окрашенное «прорицать» и не слишком широкое «проповедовать». Повтор однокоренных форм передаёт резкость и риторическую игру оригинала.
