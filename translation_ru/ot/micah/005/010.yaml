  text: וְ/הִכְרַתִּ֖י עָרֵ֣י אַרְצֶ֑/ךָ וְ/הָרַסְתִּ֖י כָּל מִבְצָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/010.yaml
  text: And I will cut off the cities of your land, and I will tear down all your strongholds.
translation:
  language: ru
  text: Я уничтожу города твоей земли и разрушу все твои крепости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Я уничтожу
  rationale: В породе hифиль глагол כרת означает устранить, истребить, буквально «отсечь». По-русски «отсеку города» звучит неестественно, поэтому «уничтожу» ясно передаёт смысл полного устранения, сохраняя пророческую силу.
- source_word: עָרֵי
  choice: города
  rationale: Обычное и прямое соответствие множественному числу слова עִיר.
- source_word: אַרְצֶךָ
  choice: твоей земли
  rationale: אֶרֶץ здесь обозначает землю как территорию народа; родительный оборот естественно передаёт связь городов с этой землёй.
- source_word: וְהָרַסְתִּי
  choice: и разрушу
  rationale: Глагол הרס обозначает снос или разрушение сооружений; «разрушу» естественно сочетается с крепостями и сохраняет конкретный образ.
- source_word: כָּל
  choice: все
  rationale: Прямое соответствие כָּל перед существительным во множественном числе.
- source_word: מִבְצָרֶיךָ
  choice: твои крепости
  rationale: מִבְצָר означает укреплённое место или крепость; выбранное слово кратко и точно передаёт военно-оборонительный смысл.
