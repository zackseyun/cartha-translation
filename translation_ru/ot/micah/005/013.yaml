  text: וְ/נָתַשְׁתִּ֥י אֲשֵׁירֶ֖י/ךָ מִ/קִּרְבֶּ֑/ךָ וְ/הִשְׁמַדְתִּ֖י עָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/013.yaml
  text: And I will uproot your Asherah poles from your midst[a], and I will destroy your cities.
translation:
  language: ru
  text: Я выкорчую из твоей среды столбы Ашеры[a] и разрушу твои города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твои ашеры»; возможно также: «твои священные столбы». Еврейское слово может обозначать культовые предметы, связанные с богиней Ашерой.'
    reason: Лексическая неоднозначность термина אֲשֵׁירֶיךָ.
lexical_decisions:
- source_word: וְנָתַשְׁתִּי
  choice: Я выкорчую
  rationale: Глагол נתשׁ означает вырывать, исторгать или искоренять; «выкорчую» естественно передаёт образ полного удаления установленных культовых предметов.
- source_word: אֲשֵׁירֶיךָ
  choice: твои столбы Ашеры
  rationale: Форма множественного числа обозначает культовые предметы, связанные с почитанием богини Ашеры. Перевод сохраняет конкретный религиозный термин и не сводит его к общему слову «идолы».
- source_word: מִקִּרְבֶּךָ
  choice: из твоей среды
  rationale: Близко передаёт буквальное значение оборота и сохраняет торжественный пророческий тон.
- source_word: וְהִשְׁמַדְתִּי
  choice: и разрушу
  rationale: В породе хифиль глагол שׁמד выражает причинение гибели или уничтожение; применительно к городам «разрушу» звучит естественно и достаточно сильно.
- source_word: עָרֶיךָ
  choice: твои города
  rationale: Обычное значение עִיר — «город»; суффикс второго лица единственного числа передан притяжательным местоимением «твои».
theological_decisions:
- issue: Значение אֲשֵׁירֶיךָ
  choice: культовые предметы, связанные с Ашерой («столбы Ашеры»)
  alternative: «ашеры» либо «священные столбы»
  rationale: Ближайший контекст говорит об устранении предметов идолопоклонства, поэтому конкретные культовые объекты являются наиболее вероятным референтом. Сноска сохраняет лексическую неоднозначность еврейского слова.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Обращение во втором лице единственного числа сохранено; специфический культовый термин пояснён в сноске.
