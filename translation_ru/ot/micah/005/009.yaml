base_translation:
  language: en
  yaml_path: translation/ot/micah/005/009.yaml
  text: And in that day[a], declares Yahweh, I will cut off your horses from among you, and I will destroy your chariots.
translation:
  language: ru
  text: В тот день, — возвещает Яхве, — Я истреблю твоих коней из твоей среды и уничтожу твои колесницы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохранена обычная пророческая формула будущего события; русское выражение передаёт и глагол וְהָיָה, и временной оборот без излишней тяжеловесности.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Формула обозначает торжественное божественное изречение. «Возвещает» сохраняет пророческую силу, а имя יהוה передано как «Яхве».
- source_word: וְהִכְרַתִּי
  choice: Я истреблю
  rationale: Hiphil глагола כרת выражает решительное устранение. «Истреблю» сохраняет большую силу исходного слова, чем нейтральное «уберу».
- source_word: סוּסֶיךָ מִקִּרְבֶּךָ
  choice: твоих коней из твоей среды
  rationale: Сохранены множественное число и обращение во втором лице единственного числа к народу как к единому целому; מִקֶּרֶב буквально указывает на удаление изнутри сообщества.
- source_word: וְהַאֲבַדְתִּי
  choice: и уничтожу
  rationale: Hiphil глагола אבד означает причинить гибель, уничтожить; перевод ясно передаёт результативное действие.
- source_word: מַרְכְּבֹתֶיךָ
  choice: твои колесницы
  rationale: Прямой перевод обозначения колесниц, в данном контексте связанных с военной силой.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Смысл устранения коней и колесниц
  choice: Конкретное обещание Яхве устранить военные средства
  alternative: Явное осуждение упования на военную мощь или отказа от войны
  rationale: Перевод сохраняет конкретные образы исходного текста и не вносит в сам стих богословское объяснение, которое может следовать из более широкого контекста.
translation_notes:
  register: 'Современный литературный русский язык с торжественным пророческим звучанием. Коллективное обращение к народу сохранено в форме второго лица единственного числа. Различены два близких глагола: כרת передан как решительное устранение («истреблю»), а אבד — как уничтожение.'
