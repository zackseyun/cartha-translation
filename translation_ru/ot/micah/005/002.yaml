  text: לָ/כֵ֣ן יִתְּנֵ֔/ם עַד עֵ֥ת יוֹלֵדָ֖ה יָלָ֑דָה וְ/יֶ֣תֶר אֶחָ֔י/ו יְשׁוּב֖וּ/ן עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/002.yaml
  text: Therefore he will give them up until the time when she who is in labor has given birth[c][b][a]; then the rest of his brothers will return to the sons of Israel.
translation:
  language: ru
  text: Поэтому он отдаст их[a] до того времени, когда женщина в родах родит[b]; тогда остальные его братья возвратятся к сынам Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «передаст их»; или: «оставит их».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст прямо не называет эту женщину. Её понимают как олицетворённый Сион или Иуду, мать обещанного правителя либо иной образ.
    reason: alternative_reading
  - marker: c
    text: 'Или: «детям Израиля». Буквально: «сынам Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Ясно передаёт логическое следствие из предшествующего контекста.
- source_word: יִתְּנֵם
  choice: Он отдаст их
  rationale: Передаёт נתן с местоименным суффиксом в значении передачи во власть или оставления, не усиливая смысл до окончательного отвержения.
- source_word: עַד עֵת
  choice: до того времени
  rationale: Сохраняет более полное временное выражение еврейского текста, а не сводит его к простому «пока».
- source_word: יוֹלֵדָה יָלָדָה
  choice: когда родит женщина в родах
  rationale: Передаёт причастие и последующий глагол рождения, не уточняя личность женщины, которой исходный текст не называет.
- source_word: וְיֶתֶר
  choice: тогда остальные
  rationale: «Остальные» естественно обозначает оставшуюся часть и не вносит возможного специального богословского оттенка слова «остаток».
- source_word: אֶחָיו
  choice: его братья
  rationale: Сохраняет мужской род и семейное обозначение исходного текста без истолковывающего расширения до «соплеменников».
- source_word: יְשׁוּבוּן
  choice: возвратятся
  rationale: Сохраняет пространственный и возможный заветный оттенки глагола שוב.
- source_word: עַל
  choice: к
  rationale: В сочетании с глаголом возвращения и названием группы естественно обозначает направленность или присоединение.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Буквально и понятно передаёт мужское множественное число בנים, сохраняя традиционное имя Израиль.
theological_decisions:
- issue: Кто такая рождающая женщина
  choice: В основном тексте её личность не уточняется.
  alternative: Олицетворённый Сион/Иуда; мать обещанного правителя; иной исторический персонаж.
  rationale: Еврейский текст прямо не отождествляет эту женщину; конкретизация устранила бы подлинную неоднозначность.
- issue: Кого обозначают «его братья»
  choice: Сохранено буквальное семейное обозначение без поясняющего расширения.
  alternative: Соплеменники будущего правителя; израильтяне; члены вновь объединённого народа.
  rationale: Контекст связывает местоимение с правителем, однако точный объём понятия в самом стихе не определён.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» обозначает подразумеваемого в контексте Бога; семейная и родовая образность исходного текста сохранена. Все примечания поставлены непосредственно при соответствующих выражениях.
