  source_fidelity: 'Основной смысл передан точно: указательный субъект из предшествующего контекста, «мир», вторжение Ассирии, семь пастырей и восемь предводителей сохранены. Однако еврейское עָלָיו имеет мужской род и представляет Ассирию как личного противника; «против неё» сглаживает эту существенную деталь. Более нейтральное «вожди из числа людей» также лучше передаёт נְסִיכֵי אָדָם, чем несколько неестественное «князья из людей».'
