  terminology: «Миром» и «пастырями» сохранены как ключевые образы. «Крепости» допустимо для אַרְמוֹן в данном контексте, с вариантом «дворцы» в примечании. «Вожди из числа людей» передаёт предводительский смысл נְסִיכִים и отмеченную, несколько необычную конструкцию с אָדָם без неоправданного догматического или интерпретационного уточнения.
