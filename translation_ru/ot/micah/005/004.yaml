base_translation:
  language: en
  yaml_path: translation/ot/micah/005/004.yaml
  text: And he will be peace[a]. When Assyria comes into our land and treads in our citadels[c][b], then we will raise up against him seven shepherds and eight princes of men.
translation:
  language: ru
  text: И он будет миром.[a] Когда Ассирия[b] придёт в нашу землю и ступит в наши крепости,[c] мы выставим против него семь пастырей и восемь вождей из числа людей.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «этот будет миром». Указательное местоимение отсылает к правителю, о котором говорится выше.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово может означать Ассирию как державу или, собирательно и лично, ассирийского захватчика. Мужское «него» в следующей части строки отражает личное представление противника в еврейском тексте.
    reason: alternative_reading
  - marker: c
    text: 'Или: «дворцы». Еврейское слово может обозначать как царские дворцы, так и укреплённые твердыни.'
    reason: lexical_alternative
  - marker: d
    text: Сочетание «семь … и восемь» может быть древнееврейским числовым оборотом, указывающим на достаточное или многочисленное число, хотя не исключён и буквальный счёт.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה זֶה
  choice: И Он будет
  rationale: Сочетание указывает назад на правителя из ближайшего контекста; пророческая форма передана будущим временем. Личное местоимение делает связь естественной по-русски, а более буквальное «этот» сохранено в примечании.
- source_word: שָׁלוֹם
  choice: миром
  rationale: «Мир» передаёт основное значение שָׁלוֹם, не исключая более широких оттенков благополучия, целостности и безопасности.
- source_word: אַשּׁוּר
  choice: Ассирия
  rationale: Основное географико-политическое значение естественно в сочетании с приходом в землю; возможное личное обозначение ассирийского захватчика отмечено в сноске.
- source_word: כִּי יָבוֹא
  choice: Когда … придёт
  rationale: כִּי в данном параллельном описании вторжения лучше понимать как временной союз, а не как причинный.
- source_word: וְכִי יִדְרֹךְ
  choice: и ступит
  rationale: Сохранён конкретный образ глагола «ступать, попирать» без усиления до явно разрушительного «растопчет».
- source_word: בְאַרְמְנֹתֵינוּ
  choice: в наши крепости
  rationale: В контексте вторжения אַרְמוֹן естественно обозначает укреплённые дворцовые или городские сооружения; вариант «дворцы» дан в примечании.
- source_word: וַהֲקֵמֹנוּ עָלָיו
  choice: мы поставим против неё
  rationale: Hiphil от קום означает «поднять, поставить, назначить». Русское местоимение согласовано с основным чтением «Ассирия», хотя еврейский текст персонифицирует противника мужским местоимением.
- source_word: שִׁבְעָה רֹעִים
  choice: семь пастырей
  rationale: Сохранена буквальная метафора пастырей как правителей или военных руководителей.
- source_word: וּשְׁמֹנָה נְסִיכֵי אָדָם
  choice: и восемь князей из людей
  rationale: נְסִיכִים передано как «князья», то есть поставленные предводители; необычная конструкция с אָדָם сохранена, а не сведена к отвлечённому «человечества».
theological_decisions:
- issue: Кто является субъектом слов «будет миром»
  choice: Личное «Он» относится к обещанному правителю из непосредственно предшествующего контекста.
  alternative: Более формальное «этот» или «этот человек».
  rationale: Связь с предшествующим правителем следует из развития речи, но перевод не добавляет к ней дальнейших догматических определений.
- issue: Образ «он будет миром»
  choice: Сохранено именное выражение без ослабления до «принесёт мир».
  alternative: «Он принесёт мир» или «обеспечит мир».
  rationale: Еврейский текст отождествляет правителя с миром риторически сильнее, чем это передавала бы причинная перефразировка.
- issue: Числовая пара «семь … восемь»
  choice: Числа переведены буквально, а возможная идиоматическая идея достаточного или изобильного числа пояснена в сноске.
  alternative: Понимать числа исключительно как точный подсчёт семи и восьми отдельных лиц.
  rationale: Так сохраняются и буквальная форма текста, и её вероятная древнееврейская риторическая сила без навязывания одного толкования.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Метафоры «быть миром» и «пастыри» сохранены. Заглавное «Он» помогает ясно соотнести местоимение с ожидаемым правителем, не добавляя имени или конфессионального титула.
