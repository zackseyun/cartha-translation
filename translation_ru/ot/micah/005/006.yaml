  text: וְ/הָיָ֣ה שְׁאֵרִ֣ית יַעֲקֹ֗ב בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/טַל֙ מֵ/אֵ֣ת יְהוָ֔ה כִּ/רְבִיבִ֖ים עֲלֵי עֵ֑שֶׂב אֲשֶׁ֤ר לֹֽא יְקַוֶּה֙ לְ/אִ֔ישׁ וְ/לֹ֥א יְיַחֵ֖ל לִ/בְנֵ֥י אָדָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/006.yaml
  text: And the remnant of Jacob will be among many peoples like dew from Yahweh[a], like showers upon the grass[b], which do not wait for a man or delay for the sons of man.
translation:
  language: ru
  text: И будет остаток Иакова среди многих народов, как роса от Яхве, как ливни на траве, которые не ждут человека и не ожидают людей.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Глаголы, переведённые как «ждут» и «ожидают», могут также иметь смысл «надеются»: «которые не надеются на человека и не ожидают людей». Общая мысль состоит в том, что роса и дождь приходят без человеческого участия.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен и более широкий смысл: не на человеческую поддержку полагается остаток Иакова, уподобленный росе и ливням. Буквально в конце стиха: «сынов человеческих», то есть людей.'
    reason: ambiguity
lexical_decisions:
- source_word: וְהָיָה
  choice: И … будет
  rationale: В пророческой речи waw с формой היה вводит будущее или результирующее положение; «будет» естественно передаёт это по-русски.
- source_word: שְׁאֵרִית יַעֲקֹב
  choice: остаток Иакова
  rationale: «Остаток» сохраняет устойчивый пророческий образ уцелевшей части народа, а имя «Иаков» передано буквально, без замены на «Израиль».
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  choice: среди многих народов
  rationale: Так естественно передаётся буквальное «в среде/посреди»; עַמִּים обозначает здесь народы, а не обязательно политические государства.
- source_word: כְּטַל מֵאֵת יְהוָה
  choice: как роса от Яхве
  rationale: Сравнение указывает на божественный источник росы; личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: כִּרְבִיבִים עֲלֵי עֵשֶׂב
  choice: как ливни на траве
  rationale: רְבִיבִים означает обильные дожди или ливни; «трава» сохраняет конкретный сельскохозяйственный образ.
- source_word: לֹא יְקַוֶּה לְאִישׁ
  choice: не ждут человека
  rationale: קוה может означать «ждать» или «надеяться»; в образе росы и дождя значение ожидания лучше выражает независимость от человеческого действия.
- source_word: וְלֹא יְיַחֵל לִבְנֵי אָדָם
  choice: и не медлят ради людей
  rationale: יחל семантически пересекается с קוה. «Не медлят ради» передаёт мысль, что роса и дождь не задерживаются в ожидании человеческого участия, избегая тяжёлого повтора.
theological_decisions:
- issue: К чему относится придаточная часть «которые не ждут…»
  choice: 'К образам росы и ливней: они приходят от Бога независимо от человеческого участия.'
  alternative: 'К остатку Иакова: он не рассчитывает на человеческую поддержку.'
  rationale: Ближайший смысловой предшественник — образы росы и дождя, и сельскохозяйственная метафора естественно подчёркивает действие Бога без человеческой инициативы. Однако еврейский синтаксис допускает более широкую связь с остатком, поэтому эта неоднозначность отмечена в сноске.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного пророческого тона. Синтаксис сделан ясным для обычного читателя; «народы», «остаток» и имя «Иаков» сохраняют ключевую лексику и образность оригинала.
