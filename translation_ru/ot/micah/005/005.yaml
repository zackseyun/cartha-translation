  text: וְ/רָע֞וּ אֶת אֶ֤רֶץ אַשּׁוּר֙ בַּ/חֶ֔רֶב וְ/אֶת אֶ֥רֶץ נִמְרֹ֖ד בִּ/פְתָחֶ֑י/הָ וְ/הִצִּיל֙ מֵֽ/אַשּׁ֔וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֔/נוּ וְ/כִ֥י יִדְרֹ֖ךְ בִּ/גְבוּלֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/005.yaml
  text: They will shepherd the land of Assyria with the sword[a], and the land of Nimrod at its entrances; and he will deliver us from Assyria when he comes into our land[b], and when he treads within our border.
translation:
  language: ru
  text: Они будут пасти мечом землю Ассирии и землю Нимрода — у её входов[a]. И он избавит нас от Ассирии[b], когда Ассирия войдёт в нашу землю и ступит в наши пределы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в её воротах»; буквально: «у её входов (отверстий)».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от ассирийца» — Ассирия может быть представлена здесь как олицетворённый враг.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָעוּ
  choice: будут пасти
  rationale: Основное значение רעה — «пасти, быть пастырем». Сочетание «пасти мечом» передаёт здесь подчинение силой, но сохраняет пастырский образ и его связь с ближайшим контекстом.
- source_word: אֶרֶץ אַשּׁוּר
  choice: землю Ассирии
  rationale: Сохраняет территориальное значение אֶרֶץ и естественно передаёт еврейское сочетание в современном русском языке.
- source_word: בַּחֶרֶב
  choice: мечом
  rationale: Творительный падеж естественно передаёт инструментальное значение предлога בְּ; буквальный образ меча сохранён.
- source_word: אֶרֶץ נִמְרֹד
  choice: землю Нимрода
  rationale: Сохраняет имя Нимрода и историко-географическую аллюзию исходного текста.
- source_word: בִּפְתָחֶיהָ
  choice: у её входов
  rationale: פתח означает «отверстие, вход»; вариант «врата» был бы более интерпретирующим, поскольку обычное еврейское слово для ворот здесь не употреблено.
- source_word: וְהִצִּיל
  choice: и он избавит нас
  rationale: Порода hифиль глагола נצל означает «избавлять, спасать». Единственное число сохранено, несмотря на предшествующее подлежащее во множественном числе.
- source_word: מֵאַשּׁוּר
  choice: от Ассирии
  rationale: Основной текст сохраняет название страны или державы, согласуясь с предшествующим выражением «земля Ассирии»; возможное олицетворение отмечено в сноске.
- source_word: כִּי יָבוֹא בְאַרְצֵנוּ
  choice: когда она войдёт в нашу землю
  rationale: כִּי понято во временном значении. Женское местоимение обусловлено русским названием «Ассирия» и представляет державу как вторгающуюся силу.
- source_word: וְכִי יִדְרֹךְ בִּגְבוּלֵנוּ
  choice: и ступит в наши пределы
  rationale: דרך сохраняет конкретный образ ступания или наступления, а множественное «пределы» естественно обозначает территорию внутри границ.
theological_decisions:
- issue: Переход от множественного числа к единственному
  choice: 'Сохранить переход: «они будут пасти… и он избавит нас»'
  alternative: Согласовать оба действия либо во множественном, либо в единственном числе
  rationale: Еврейский текст переходит от множественного וְרָעוּ к единственному וְהִצִּיל. Это может различать предшествующих пастырей и одного правителя-избавителя; перевод не устраняет напряжение текста.
- issue: Значение אַשּׁוּר в заключительной части
  choice: «Ассирия» с олицетворением вторгающейся державы
  alternative: «ассириец» или «ассирийский враг»
  rationale: Форма может обозначать страну, державу либо олицетворённого врага. Основной текст сохраняет географическое название, а личное истолкование вынесено в сноску.
- issue: Субъект глаголов вторжения
  choice: 'Согласовать его по-русски с «Ассирией»: «когда она войдёт… и ступит»'
  alternative: 'Буквально сохранить мужской род: «когда он войдёт… и ступит»'
  rationale: В еврейском глаголы стоят в мужском роде, однако буквальное «он» в русском могло бы ошибочно отнести вторжение к избавителю. Грамматическое согласование с «Ассирией» ясно передаёт олицетворение вражеской державы, не вводя нового действующего лица.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Необычное выражение «пасти мечом» намеренно сохранено как сквозной пастырский образ; порядок слов слегка перестроен ради естественности. Все сноски поставлены непосредственно при соответствующих выражениях.
