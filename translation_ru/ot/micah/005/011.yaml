base_translation:
  language: en
  yaml_path: translation/ot/micah/005/011.yaml
  text: And I will cut off sorceries from your hand[b][a], and you will have no soothsayers.
translation:
  language: ru
  text: И Я искореню чародейство из твоей руки[a], и не будет у тебя гадателей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «колдовство». Букв. «из твоей руки».'
    reason: Лексическая альтернатива и сохранение буквального образа еврейского текста.
  - marker: b
    text: 'Или: «прорицателей», «толкователей знамений».'
    reason: Еврейское слово допускает несколько близких обозначений людей, занимающихся гаданием и истолкованием знамений.
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: И Я искореню
  rationale: Порода hифиль глагола כרת означает устранить, отсечь, истребить. «Искореню» естественно по-русски передаёт решительное и полное удаление, сохраняя силу пророческого высказывания.
- source_word: כְשָׁפִים
  choice: чародейство
  rationale: Существительное во множественном числе обозначает магические действия или практики. Собирательное «чародейство» ясно и достойно передаёт эту категорию практик, не сужая её до конкретного вида магии.
- source_word: מִיָּדֶךָ
  choice: из твоих рук
  rationale: Сохранён буквальный образ руки как сферы владения, действия или контроля. Множественное число «из рук» естественнее в русском обороте с названием практики и не меняет смысла еврейского единственного числа.
- source_word: וּמְעוֹנְנִים
  choice: прорицателей
  rationale: Причастная форма обозначает людей, занимающихся гаданием или истолкованием знамений. «Прорицатели» достаточно широко передаёт род занятий, не уточняя спорный конкретный способ предсказания.
- source_word: לֹא יִהְיוּ לָךְ
  choice: не будет у тебя
  rationale: Буквальная конструкция «не будут тебе/у тебя» естественно передаётся русским оборотом обладания «не будет у тебя», сохраняя обращение к народу в единственном числе.
theological_decisions:
- issue: Характер осуждаемых занятий
  choice: Стих говорит о магических практиках и людях, занимающихся прорицанием, которых Бог удалит из среды своего народа.
  alternative: מְעוֹנְנִים можно понимать уже — как толкователей знамений, гадателей по временам или заклинателей.
  rationale: Еврейские слова обозначают запрещённые магические и гадательные практики, но сам стих не позволяет уверенно свести второе слово к одному техническому способу. Основной текст сохраняет необходимую широту, а примечания указывают лексические варианты.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавная «Я» подчёркивает речь Бога без добавления имени, которого в данном стихе нет. Формы «твоих», «тебя» сохраняют грамматическое обращение к народу в единственном числе.
