base_translation:
  language: en
  yaml_path: translation/ot/micah/005/003.yaml
  text: And he will stand and shepherd in the strength of Yahweh[a], in the majesty of the name of Yahweh his God. And they will dwell secure[b], for now he will be great to the ends of the earth.
translation:
  language: ru
  text: Он встанет и будет пасти в могуществе Яхве, в величии имени Яхве, своего Бога. И они будут жить в безопасности[a], ибо теперь[b] он будет велик до краёв земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будут обитать» или «будут сидеть». Безопасность подразумевается контекстом.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст: «теперь»; в некоторых переводах — «тогда», чтобы сгладить последовательность пророческих событий.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָמַד
  choice: Он встанет
  rationale: Глагол עמד буквально означает «стоять, встать». Будущее «встанет» сохраняет конкретный образ правителя, занимающего своё место, не заменяя его толкованием «воцарится».
- source_word: וְרָעָה
  choice: и будет пасти
  rationale: רעה обозначает пасти или заботиться о стаде и в данном контексте несёт также образ правителя-пастыря. Глагольная форма сохраняет образ еврейского текста без добавления отсутствующего в нём дополнения.
- source_word: בְּעֹז יְהוָה
  choice: в силе Яхве
  rationale: עֹז означает «сила, могущество», а предлог ב может указывать на сферу или средство действия. Формулировка сохраняет эту ёмкость и параллель с последующим «в величии».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного Божьего имени, а не заменён титулом «Господь».
- source_word: בִּגְאוֹן שֵׁם יְהוָה אֱלֹהָיו
  choice: в величии имени Яхве, своего Бога
  rationale: גאון здесь выражает величие или величавость. Конструкция «имени Яхве, своего Бога» сохраняет связь אֱלֹהָיו с действующим лицом и не устраняет богословское напряжение выражения «своего Бога».
- source_word: וְיָשָׁבוּ
  choice: И они будут жить в безопасности[a]
  rationale: ישב буквально значит «сидеть, обитать, жить». Безопасность подразумевается контекстом мирного пребывания под властью пастыря; она выражена в основном тексте ради естественного русского языка, а буквальный диапазон указан в сноске.
- source_word: כִּי עַתָּה
  choice: ибо теперь[b]
  rationale: כִּי вводит основание, а עַתָּה обычно означает «теперь, ныне». Перевод сохраняет пророческую непосредственность исходного текста, не сглаживая её словом «тогда».
- source_word: יִגְדַּל
  choice: он будет велик
  rationale: גדל здесь выражает величие или возвышенное положение. «Будет велик» естественно по-русски и не привносит обязательного оттенка постепенного роста.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: до краёв земли
  rationale: Устойчивое выражение обозначает самые дальние пределы земли; «до краёв земли» точно и ясно передаёт пространственный охват.
theological_decisions:
- issue: К кому относятся глаголы единственного числа
  choice: Субъект обозначен только местоимением «он» и связан с обещанным правителем из предшествующего контекста.
  alternative: Прямо назвать его Мессией, Христом, царём или будущим правителем.
  rationale: В самом стихе титул отсутствует. Местоименное выражение сохраняет связь с контекстом, не вводя в перевод определённое конфессиональное истолкование.
- issue: Выражение אֱלֹהָיו о Боге правителя
  choice: Сохранено «своего Бога».
  alternative: Перефразировать выражение, чтобы снять возможное христологическое напряжение.
  rationale: Еврейский текст прямо называет Яхве его Богом. Перевод сохраняет формулировку источника и не разрешает возникающий богословский вопрос посредством сглаживания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены конкретный пастырский образ, повтор имени Яхве и пророческое «теперь»; синтаксис сделан ясным без добавления титулов или объекта при глаголе «пасти».
