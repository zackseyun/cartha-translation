  text: וְ/אַתָּ֞ה בֵּֽית לֶ֣חֶם אֶפְרָ֗תָה צָעִיר֙ לִֽ/הְיוֹת֙ בְּ/אַלְפֵ֣י יְהוּדָ֔ה מִמְּ/ךָ֙ לִ֣/י יֵצֵ֔א לִֽ/הְי֥וֹת מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵ֑ל וּ/מוֹצָאֹתָ֥י/ו מִ/קֶּ֖דֶם מִ/ימֵ֥י עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/001.yaml
  text: But you[a], Bethlehem Ephrathah, too small to be among the clans of Judah, from you one will come out for me to be ruler in Israel, whose goings forth are from of old[b], from the days of eternity.
translation:
  language: ru
  text: Но ты, Вифлеем-Ефрафа, слишком мал, чтобы быть среди родов Иуды[a], — из тебя выйдет для Меня тот, кто будет правителем в Израиле; исхождения его — издревле[b], от дней вечности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мал среди тысяч Иуды». Здесь «тысячи» могут обозначать родовые или военно-административные подразделения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его происхождение — с давних времён, с древних дней». Еврейское выражение допускает и более сильное понимание: «из вечности».'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּית לֶחֶם אֶפְרָתָה
  choice: Вифлеем-Ефрафа
  rationale: Сохраняет оба элемента географического наименования и отличает этот Вифлеем от других; дефис делает сочетание естественным для русского топонимического употребления.
- source_word: צָעִיר לִהְיוֹת בְּאַלְפֵי יְהוּדָה
  choice: слишком мал, чтобы быть среди родов Иуды
  rationale: Передаёт значение צָעִיר и инфинитивную конструкцию; אַלְפֵי здесь понимается как родовые или военно-административные подразделения, а не буквально «тысячи».
- source_word: מִמְּךָ לִי יֵצֵא
  choice: из тебя произойдёт для Меня Тот
  rationale: «Произойдёт» естественно передаёт выход или появление из данного места, а «для Меня» прямо сохраняет לִי. Добавленное «Тот» ясно обозначает личного правителя, не называя его прямо Мессией.
- source_word: לִהְיוֹת מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: Кто будет правителем в Израиле
  rationale: Сохраняет личное значение מוֹשֵׁל и предлог ב как «в», не заменяя его более толковательным «над».
- source_word: מוֹצָאֹתָיו
  choice: Его выходы
  rationale: Формально сохраняет связь существительного с идеей выхода и не сводит спорное выражение исключительно к «происхождению»; более естественный вариант дан в примечании.
- source_word: מִקֶּדֶם מִימֵי עוֹלָם
  choice: издревле, со дней вечности
  rationale: «Издревле» передаёт временное значение קֶדֶם, а «со дней вечности» сохраняет широту עוֹלָם — от глубокой древности до вечности — и намеренное напряжение сочетания «дни вечности».
theological_decisions:
- issue: Указывает ли заключительная фраза прямо на вечное предсуществование или лишь на древнее происхождение
  choice: Его выходы — издревле, со дней вечности
  alternative: Его происхождение — с давних времён, с древних дней
  rationale: Еврейский текст допускает как историко-династическое прочтение о глубокой древности, так и более сильное прочтение о вечном предсуществовании. Основной текст сохраняет эту напряжённость и не превращает перевод в догматическое толкование.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейским звучанием. Местоимения, относящиеся к обещанному правителю, написаны с прописной буквы как уважительная русская издательская конвенция; это не заменяет исходную неоднозначность прямым конфессиональным титулом.
