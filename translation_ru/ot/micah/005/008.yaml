base_translation:
  language: en
  yaml_path: translation/ot/micah/005/008.yaml
  text: May your hand be lifted up over your adversaries[a], and may all your enemies be cut off.
translation:
  language: ru
  text: Да вознесётся рука твоя над твоими противниками[a], и да будут истреблены все твои враги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Рука твоя вознесётся над твоими противниками, и все твои враги будут истреблены». Еврейские формы глаголов можно понимать и как утверждение о будущем.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּרֹם
  choice: да вознесётся
  rationale: Qal imperfect 3-го лица женского рода от רום согласован с «рука». Формулировка сохраняет конкретный образ поднятой над врагами руки и допускает желательное значение формы.
- source_word: יָדְךָ
  choice: рука твоя
  rationale: Буквально передаёт еврейский образ руки как силы и могущества; в русском библейском контексте он понятен без поясняющей замены.
- source_word: עַל
  choice: над
  rationale: Передаёт пространственный образ превосходства и победного господства точнее, чем более интерпретирующее «против».
- source_word: צָרֶיךָ
  choice: твоими противниками
  rationale: צַר обозначает противника или притеснителя. «Противники» сохраняет отличие от следующего אֹיְבֶיךָ и естественно звучит по-русски.
- source_word: וְכָל
  choice: и все
  rationale: Прямо сохраняет соединение частей стиха и всеохватность выражения.
- source_word: אֹיְבֶיךָ
  choice: твои враги
  rationale: Обычное и точное соответствие אֹיֵב; сохраняет лёгкое лексическое различие с «противниками».
- source_word: יִכָּרֵתוּ
  choice: да будут истреблены
  rationale: Niphal imperfect от כרת буквально несёт значение «быть отсечёнными». В данном контексте русское «быть истреблёнными» естественно передаёт устранение врагов, не уточняя способ.
theological_decisions:
- issue: Значение имперфектов в пророческом контексте
  choice: 'Желательное значение: «Да вознесётся… и да будут истреблены…»'
  alternative: 'Будущее утверждение: «Рука твоя вознесётся… и все твои враги будут истреблены»'
  rationale: Обе еврейские формы морфологически являются имперфектами и допускают как желательное, так и предсказательное прочтение. Основной текст сохраняет молитвенно-желательный оттенок, а примечание прямо отмечает возможное понимание как пророчества о будущем.
translation_notes:
  register: Современный литературный русский с умеренно торжественным, уместным для пророческой поэзии оборотом «да…». Порядок «рука твоя» поддерживает поэтический ритм; пара «противники / враги» сохраняет параллелизм без ненужного повторения.
