  source_fidelity: 'Перевод точно передаёт все основные элементы еврейского текста: действие Бога («истреблю» для הִכְרַתִּי), два различных вида культовых предметов («резные идолы» и «столбы»), удаление «из твоей среды» и прекращение поклонного склонения перед «делом своих рук». Сохранены второе лицо единственного числа и образное, телесное значение תִשְׁתַּחֲוֶה («кланяться»), а не только обобщённое «поклоняться».'
