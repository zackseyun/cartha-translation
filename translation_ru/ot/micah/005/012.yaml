base_translation:
  language: en
  yaml_path: translation/ot/micah/005/012.yaml
  text: And I will cut off your carved images and your pillars from your midst[b][a], and you will no longer bow down to the work of your hands.
translation:
  language: ru
  text: И Я истреблю из твоей среды твоих резных идолов и твои столбы[a], и ты больше не будешь кланяться[b] делу своих рук.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священные столбы», «поставленные камни». Еврейское слово обозначает вертикально установленные культовые камни, использовавшиеся при поклонении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поклоняться». В еврейском тексте буквально говорится о склонении или простирании перед предметом поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: И Я истреблю
  rationale: Форма хифиль глагола כרת означает «отсечь, устранить, истребить». «Истреблю» естественно передаёт здесь решительное удаление предметов ложного поклонения.
- source_word: פְסִילֶיךָ
  choice: твоих резных идолов
  rationale: פֶּסֶל обозначает высеченное или вырезанное культовое изображение. Сочетание «резные идолы» сохраняет и способ изготовления, и культовый смысл.
- source_word: וּמַצֵּבוֹתֶיךָ
  choice: и твои столбы
  rationale: מַצֵּבָה — поставленный вертикально камень или культовый столб. Краткое «столбы» сохраняет предметность исходного слова, а культовое значение поясняется в сноске.
- source_word: מִקִּרְבֶּךָ
  choice: из твоей среды
  rationale: Буквально передаёт образ удаления изнутри народа или земли и соответствует единственному числу обращения в еврейском тексте.
- source_word: וְלֹא תִשְׁתַּחֲוֶה עוֹד
  choice: и ты больше не будешь кланяться
  rationale: Глагол חוה обозначает склонение или простирание, особенно как действие поклонения. «Кланяться» сохраняет телесный образ, не сводя его к отвлечённому понятию почитания.
- source_word: לְמַעֲשֵׂה יָדֶיךָ
  choice: делу своих рук
  rationale: Передаёт устойчивый библейский образ созданных человеком предметов поклонения и сохраняет единственное число собирательного выражения מַעֲשֵׂה.
theological_decisions:
- issue: Передача различных культовых предметов
  choice: Сохранить различие между «резными идолами» и «столбами».
  alternative: Обобщить оба понятия словом «идолы» или перевести как «идолы и священные камни».
  rationale: Еврейский текст называет два разных вида культовых предметов; их различение сохраняет конкретность пророческого обличения и не добавляет отсутствующего в основном тексте толкования.
- issue: Смысл заключительного действия
  choice: «ты больше не будешь кланяться делу своих рук»
  alternative: «ты больше не будешь поклоняться тому, что сделали твои руки»
  rationale: Выбранная формулировка сохраняет физическое действие склонения, которое в контексте является актом поклонения, и не устраняет заложенную в глаголе образность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Я» написано с прописной буквы как обозначение говорящего Бога; обращение во всём стихе сохранено в единственном числе. Избегнуты архаизмы вроде «истуканы» и «кумиры».
