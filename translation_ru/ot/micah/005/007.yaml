id: MIC.5.7
reference: Micah 5:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָה֩ שְׁאֵרִ֨ית יַעֲקֹ֜ב בַּ/גּוֹיִ֗ם בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/אַרְיֵה֙ בְּ/בַהֲמ֣וֹת יַ֔עַר כִּ/כְפִ֖יר בְּ/עֶדְרֵי צֹ֑אן אֲשֶׁ֧ר אִם עָבַ֛ר וְ/רָמַ֥ס וְ/טָרַ֖ף וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/007.yaml
  text: And the remnant of Jacob will be among the nations[a], in the midst of many peoples, like a lion among the beasts of the forest, like a young lion among flocks of sheep, which, if it passes through, tramples and tears[b], and there is none to rescue.
translation:
  language: ru
  text: 'И остаток Иакова будет среди народов, посреди многих народов, словно лев среди лесных зверей[a], словно молодой лев среди овечьих стад: если он пройдёт, то растопчет и растерзает[b], и никто не спасёт.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди животных леса».'
    reason: Лексема בְּהֵמוֹת допускает как более выразительное «звери», так и нейтральное «животные».
  - marker: b
    text: 'Или: «когда он пройдёт, растопчет и растерзает».'
    reason: Сочетание אֲשֶׁר אִם может в данном обобщающем образе передавать не только условное «если», но и временно-типическое «когда».
lexical_decisions:
- source_word: וְהָיָה
  choice: И … будет
  rationale: Конструкция с waw и перфектом в пророческой речи выражает будущее следствие; русское «будет» ясно сохраняет предсказательный смысл.
- source_word: שְׁאֵרִית יַעֲקֹב
  choice: остаток Иакова
  rationale: «Остаток» — точный и укоренённый в русской библейской речи эквивалент, сохраняющий идею уцелевшей части народа.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם здесь обозначает народы вообще; перевод не вводит более позднее противопоставление иудеев и язычников.
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  choice: посреди многих племён
  rationale: «Посреди» сохраняет пространственный образ בְּקֶרֶב, а «племён» позволяет естественно передать поэтический параллелизм גּוֹיִם / עַמִּים без тяжёлого повтора слова «народы».
- source_word: כְּאַרְיֵה בְּבַהֲמוֹת יַעַר
  choice: словно лев среди лесных зверей
  rationale: Передаёт сравнение и образ льва среди животных леса; «зверей» естественно и выразительно в данном контексте.
- source_word: כִּכְפִיר
  choice: словно молодой лев
  rationale: כְּפִיר обозначает молодого, сильного льва; этот вариант точнее, чем образ маленького львёнка.
- source_word: בְּעֶדְרֵי צֹאן
  choice: среди овечьих стад
  rationale: Передаёт стада мелкого скота как овечьи стада и сохраняет образ беззащитной добычи.
- source_word: אֲשֶׁר אִם עָבַר
  choice: если он пройдёт
  rationale: Сохраняет условную силу אִם и соотносит действие с молодым львом, не усиливая условие до безусловного «когда».
- source_word: וְרָמַס וְטָרַף
  choice: то растопчет и растерзает
  rationale: Глаголы передают последовательные образы попрания и разрывания добычи; «растерзает» естественно выражает действие хищника.
- source_word: וְאֵין מַצִּיל
  choice: и никто не спасёт
  rationale: Кратко и естественно передаёт отсутствие того, кто мог бы вырвать добычу и спасти её.
theological_decisions:
- issue: Образ остатка Иакова как льва среди народов
  choice: Сохранить образ его непреодолимой силы, не уточняя способ и время её проявления.
  alternative: Истолковать образ исключительно как военное завоевание либо только как символическое влияние.
  rationale: Еврейский текст изображает господство через метафору хищного льва, но не определяет его узко как военное, политическое или конкретно эсхатологическое событие.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Синтаксис остаётся ясным для широкого читателя; параллелизм и резкость образа льва сохранены без конфессионально обусловленного толкования.
