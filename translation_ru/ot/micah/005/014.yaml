  text: And I will execute vengeance in anger and wrath on the nations that have not listened[a].
translation:
  language: ru
  text: И совершу в гневе и ярости возмездие над народами, которые не послушали[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не повиновались»; или: «не вняли». Еврейский глагол может означать как слушание, так и послушный отклик.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: И совершу
  rationale: В сочетании с נָקָם широкий глагол עשה образует смысл «совершить, осуществить возмездие»; русский глагол «совершу» естественно сохраняет возвышенный судебный оттенок.
- source_word: בְּאַף
  choice: в гневе
  rationale: אַף здесь идиоматически означает гнев; предложное сочетание точно и естественно передаётся как «в гневе».
- source_word: וּבְחֵמָה
  choice: и ярости
  rationale: חֵמָה усиливает предшествующее обозначение гнева. «Ярость» различает два близких термина и сохраняет напряжённость пророческой речи.
- source_word: נָקָם
  choice: возмездие
  rationale: נָקָם обозначает мщение или воздаяние. «Возмездие» сохраняет карательно-судебный смысл и в данном контексте звучит по-русски естественнее, чем «месть».
- source_word: אֶת הַגּוֹיִם
  choice: над народами
  rationale: Показатель прямого дополнения אֶת при русском сочетании «совершить возмездие» естественно передаётся конструкцией «над народами», ясно обозначающей объект суда.
- source_word: אֲשֶׁר לֹא שָׁמֵעוּ
  choice: которые не послушали
  rationale: שׁמע может означать как слушание, так и послушное откликание. «Не послушали» сохраняет эту смысловую связь и не сводит выражение только к физическому слышанию.
theological_decisions:
- issue: Значение שָׁמֵעוּ применительно к осуждаемым народам
  choice: не послушали
  alternative: не повиновались; не вняли
  rationale: Еврейский שׁמע охватывает слышание, внимание и послушный отклик. Основной текст сохраняет многозначность посредством «не послушали», а более явные оттенки вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с краткой, возвышенной пророческой интонацией. Парные слова «гнев» и «ярость» сохраняют усиление оригинала; «возмездие» передаёт судебно-ретрибутивный смысл без разговорного оттенка.
