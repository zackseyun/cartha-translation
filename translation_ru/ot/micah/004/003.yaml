  text: וְ/שָׁפַ֗ט בֵּ֚ין עַמִּ֣ים רַבִּ֔ים וְ/הוֹכִ֛יחַ לְ/גוֹיִ֥ם עֲצֻמִ֖ים עַד רָח֑וֹק וְ/כִתְּת֨וּ חַרְבֹתֵי/הֶ֜ם לְ/אִתִּ֗ים וַ/חֲנִיתֹֽתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹֽא יִשְׂא֞וּ גּ֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ/ן ע֖וֹד מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/003.yaml
  text: And he will judge between many peoples[a], and will arbitrate for strong nations far away; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[c][b], nor will they learn war anymore.
translation:
  language: ru
  text: И Он будет судить между многими народами и разбирать дела могущественных народов, живущих далеко[a]. Перекуют свои мечи на лемехи[b], а копья — на ножи для обрезки. Не поднимет народ меча против народа, и больше не будут учиться воевать[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и обличать могущественные народы, живущие далеко»; еврейский глагол может также означать выносить решение или разбирать спор.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на плужные ножи».'
    reason: lexical_alternative
  - marker: c
    text: Выражение «учиться воевать» может также означать «обучаться военному делу».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַט בֵּין עַמִּים רַבִּים
  choice: И Он будет судить между многими народами
  rationale: «Судить» сохраняет судебный смысл שׁפט, а «между» прямо передаёт בֵּין. «Народы» естественно обозначает различные этнополитические сообщества.
- source_word: וְהוֹכִיחַ
  choice: и разрешать споры
  rationale: В каузативной форме יכח может означать вынесение решения, обличение или урегулирование дела; параллелизм с «судить» и контекст международного мира поддерживают судебно-посреднический смысл.
- source_word: לְגוֹיִם עֲצֻמִים עַד רָחוֹק
  choice: сильных народов до самых дальних земель
  rationale: «Сильных народов» передаёт גּוֹיִם עֲצֻמִים, а «до самых дальних земель» естественно выражает пространственный охват עַד רָחוֹק, не ограничивая его конкретной территорией.
- source_word: וְכִתְּתוּ חַרְבֹתֵיהֶם לְאִתִּים
  choice: Они перекуют свои мечи на лемехи
  rationale: «Перекуют» естественно передаёт ударную обработку металла ради превращения оружия в земледельческие орудия. «Лемехи» — традиционный и точный русский термин для режущей части плуга.
- source_word: וַחֲנִיתֹתֵיהֶם לְמַזְמֵרוֹת
  choice: а копья — на садовые ножи
  rationale: מַזְמֵרוֹת обозначает орудия для обрезки лоз и ветвей. «Садовые ножи» понятно современному читателю и не навязывает спорную точную форму инструмента.
- source_word: לֹא יִשְׂאוּ גּוֹי אֶל גּוֹי חֶרֶב
  choice: Не поднимет народ меча против народа
  rationale: Сохранён образный еврейский оборот «поднять меч»; единственное число имеет обобщающе-распределительный смысл.
- source_word: וְלֹא יִלְמְדוּן עוֹד מִלְחָמָה
  choice: и больше не будут учиться воевать
  rationale: Так передаётся буквальное «учиться войне» в естественной русской форме, при сохранении возможного оттенка военной подготовки в примечании.
theological_decisions:
- issue: Субъект глаголов единственного числа в начале стиха
  choice: Сохранено местоимение «Он» без прямого именования субъекта
  alternative: Господь; мессианский правитель; персонифицированный Сион или Иерусалим
  rationale: В еврейском тексте субъект здесь не назван явно и восстанавливается из контекста. Перевод не устраняет эту неоднозначность добавлением конкретного богословского отождествления.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и образность оригинала сохранены; редкие сельскохозяйственные реалии пояснены с помощью примечания.
