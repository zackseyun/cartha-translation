revisions:
- from: И Он будет судить между многими народами и разрешать споры сильных народов до самых дальних земель[a]. Они перекуют свои мечи на лемехи[b], а копья — на садовые ножи. Не поднимет народ меча против народа, и больше не будут учиться воевать[c].
  to: И Он будет судить между многими народами и разбирать дела могущественных народов, живущих далеко[a]. Перекуют свои мечи на лемехи[b], а копья — на ножи для обрезки. Не поднимет народ меча против народа, и больше не будут учиться воевать[c].
  rationale: Исправлена связь «далеко» с «могущественными народами» без добавления отсутствующих в оригинале «земель». Уточнено значение мַזְמֵרוֹת как орудий обрезки. Остальные ключевые образы, синтаксическая обобщённость и неопределённость субъекта начальных глаголов сохранены.
