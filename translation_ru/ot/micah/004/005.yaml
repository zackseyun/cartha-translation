id: MIC.4.5
reference: Micah 4:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֚י כָּל הָ֣/עַמִּ֔ים יֵלְכ֕וּ אִ֖ישׁ בְּ/שֵׁ֣ם אֱלֹהָ֑י/ו וַ/אֲנַ֗חְנוּ נֵלֵ֛ךְ בְּ/שֵׁם יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/עוֹלָ֥ם וָ/עֶֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/005.yaml
  text: For all the peoples walk[a], each in the name of his god[c][b], but we will walk in the name of Yahweh our God forever and ever.
translation:
  language: ru
  text: Ведь все народы ходят[a], каждый во имя своего бога[b], а мы будем ходить во имя Яхве, нашего Бога, во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идут». Глагол может обозначать как движение, так и образ жизни и верность избранному божеству.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый во имя своего бога». Слово «каждый» употреблено дистрибутивно применительно ко всем народам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит пояснение или обоснование предшествующего обещания; «ведь» естественно передаёт эту связь по-русски.
- source_word: כָּל הָעַמִּים
  choice: все народы
  rationale: עַמִּים обозначает народы или этнические сообщества; «народы» сохраняет множественное собирательное значение.
- source_word: יֵלְכוּ / נֵלֵךְ
  choice: ходят / будем ходить
  rationale: Сохраняется параллелизм и библейская метафора образа жизни, поведения и религиозной верности, а не только физического движения.
- source_word: אִישׁ
  choice: каждый
  rationale: Здесь слово употреблено дистрибутивно по отношению ко «всем народам» и не выделяет мужчин как отдельную группу.
- source_word: בְּשֵׁם
  choice: во имя
  rationale: Формула может выражать принадлежность, призывание имени и действие под властью; привычное «во имя» сохраняет повтор и смысловую ёмкость оригинала.
- source_word: אֱלֹהָיו
  choice: своего бога
  rationale: Местоимение «своего» естественно связывает единственное число с дистрибутивным «каждый» и сохраняет соответствие еврейской форме.
- source_word: וַאֲנַחְנוּ
  choice: а мы
  rationale: Союз отмечает контраст между прочими народами и общиной говорящих; русское «а» передаёт его без излишнего усиления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לְעוֹלָם וָעֶד
  choice: во веки веков
  rationale: Устойчивая возвышенная русская формула передаёт усиленное указание на непреходящую длительность.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога; форма «Яхве» прямо его передаёт, тогда как «Господь» является традиционной заменой титулом.
- issue: Смысл хождения народов во имя своих богов
  choice: Сохранено прямое утверждение настоящего времени
  alternative: 'Условная или уступительная переформулировка: «пусть все народы ходят»'
  rationale: Масоретский текст содержит формы несовершенного вида, которые в данном противопоставлении естественно понимать как описание обычного поведения народов и решимости общины; перевод не превращает утверждение в разрешение или повеление.
- issue: Дистрибутивное אִישׁ
  choice: каждый
  alternative: каждый человек; каждый мужчина
  rationale: Слово распределяет действие между упомянутыми народами и не утверждает, что речь идёт исключительно о лицах мужского пола.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллелизм двух частей и повтор «ходят/ходить» и «во имя» сохранены. Формула «во веки веков» выбрана как понятная и торжественная.
