base_translation:
  language: en
  yaml_path: translation/ot/micah/004/004.yaml
  text: And each will sit under his vine and under his fig tree[a], and there will be no one to make them afraid[b], for the mouth of Yahweh of Armies has spoken.
translation:
  language: ru
  text: И каждый будет сидеть под своей виноградной лозой и под своей смоковницей[a], и никто не будет внушать им страх, ибо уста Яхве Воинств изрекли это[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «каждый мужчина [будет сидеть] под своей виноградной лозой и под своей смоковницей»; еврейское слово в форме мужского рода употреблено здесь распределительно.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционная передача титула: «Господь Саваоф».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשְׁבוּ
  choice: И каждый будет сидеть
  rationale: Глагол יָשַׁב буквально означает «сидеть», а в данном образе также подразумевает мирную, оседлую жизнь. Конкретный образ сохранён.
- source_word: אִישׁ
  choice: каждый
  rationale: Единственное число мужского рода употреблено дистрибутивно после глагола во множественном числе. Русское «каждый» естественно передаёт распределительное значение, а буквальная форма пояснена в сноске.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: под своей виноградной лозой и под своей смоковницей
  rationale: Сохранён традиционный конкретный образ обеспеченности, мира и безопасности; возвратное «своей» естественно соотносит владение с каждым человеком.
- source_word: וְאֵין מַחֲרִיד
  choice: и никто не будет устрашать их
  rationale: Причастие מַחֲרִיד обозначает того, кто заставляет трепетать или бояться. «Устрашать» передаёт причинное значение и сохраняет торжественный регистр.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание и непреложное подтверждение обещания; «ибо» уместно в торжественной пророческой речи.
- source_word: פִּי יְהוָה צְבָאוֹת דִּבֵּר
  choice: ибо это изрекли уста Яхве Воинств
  rationale: Метафора «уста» сохранена, поскольку подчёркивает божественное происхождение и несомненность слова. «Изрекли» соответствует возвышенной формуле; в русском согласование с «уста» имеет форму множественного числа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Передано собственное заветное имя, прямо стоящее в еврейском тексте, без замены титулом.
- issue: Передача צְבָאוֹת
  choice: Воинств
  alternative: Саваоф
  rationale: Смысл еврейского титула переведён прозрачно, а не транслитерирован; форма оставляет открытым широкий небесно-военный охват слова.
- issue: Распределительное אִישׁ и грамматический род
  choice: каждый
  alternative: каждый мужчина
  rationale: В данном построении אִישׁ имеет распределительное значение. «Каждый» сохраняет мужскую грамматическую форму, не добавляя более узкого биологического акцента, который контекст явно не требует.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Конкретные образы лозы, смоковницы и уст сохранены; архаизация ограничена словами «ибо» и «изрекли», уместными в завершающей формуле.
