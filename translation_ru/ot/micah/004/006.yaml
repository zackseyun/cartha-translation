  - marker: c
    text: 'Или: «которым Я причинил горе». Еврейский текст прямо говорит, что Яхве прежде навёл на них бедствие.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Сохраняет обычную пророческую формулу времени и естественно звучит в современном русском языке.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную формулу пророческого речения; «возвещает» здесь литературно и понятно, а личное имя יְהוָה передано как «Яхве».
- source_word: אֹסְפָה
  choice: Я соберу
  rationale: Прямо передаёт значение אָסַף и соответствует контексту восстановления народа.
- source_word: הַצֹּלֵעָה
  choice: хромающих
  rationale: Причастие женского рода единственного числа имеет собирательное значение; русское множественное число естественно обозначает соответствующую группу людей и сохраняет образ физической слабости.
- source_word: וְהַנִּדָּחָה
  choice: изгнанных
  rationale: Форма от נדח указывает на тех, кого прогнали или удалили; «изгнанных» яснее сохраняет пассивную направленность действия, чем более широкое «отверженных».
- source_word: אֲקַבֵּצָה
  choice: созову
  rationale: Передаёт собирание в единое целое и позволяет в русском тексте сохранить некоторую лексическую разницу с предшествующим אֹסְפָה.
- source_word: וַאֲשֶׁר
  choice: и тех, на кого
  rationale: Естественно присоединяет ещё одну характеристику восстанавливаемых людей, не навязывая выводу искусственного усиления.
- source_word: הֲרֵעֹתִי
  choice: Я навёл бедствие
  rationale: Hiphil от רעע выражает причинение беды или несчастья. Эта формулировка явно сохраняет Божье действие, но не приписывает Ему нравственного зла.
theological_decisions:
- issue: Прямое указание на Божье действие в прежнем бедствии
  choice: «на кого Я навёл бедствие»
  alternative: «которым Я причинил горе»; «которым было причинено бедствие»
  rationale: Еврейская форма первого лица единственного числа прямо приписывает действие Яхве. Перевод сохраняет напряжение между Божьим судом и последующим восстановлением, не смягчая его до простого попущения.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Параллелизм двух глаголов собирания сохранён без тяжеловесного буквального повтора; явная Божья роль в суде не смягчена.
