base_translation:
  language: en
  yaml_path: translation/ot/micah/004/007.yaml
  text: And I will make the lame a remnant[a], and the outcast a strong nation[b]; and Yahweh will reign over them on Mount Zion from now and forever.
translation:
  language: ru
  text: И сделаю Я хромающую остатком, а изгнанную[a] — могучим народом; и Яхве будет царствовать над ними на горе Сионе отныне и навеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уведённую», «удалённую». Еврейское слово обозначает ту, которую заставили уйти; в данном контексте вероятнее всего имеется в виду изгнание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отныне и до вечности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: И сделаю Я
  rationale: 'Глагол שׂוּם означает «поместить, установить, сделать»; при конструкции с לְ естественно передать результат: «сделаю ... остатком / народом». Постпозиция «Я» сохраняет торжественный, но современный библейский строй фразы.'
- source_word: הַצֹּלֵעָה
  choice: хромающую
  rationale: Форма женского рода единственного числа буквально обозначает «хромающую» и, вероятно, олицетворяет пострадавшую общину. Единственное число сохранено без превращения образа в явное множественное число.
- source_word: לִשְׁאֵרִית
  choice: остатком
  rationale: שְׁאֵרִית — характерное для пророческих текстов обозначение остатка, уцелевшего после суда. Творительный падеж естественно выражает результат превращения.
- source_word: הַנַּהֲלָאָה
  choice: изгнанную
  rationale: Причастная форма указывает на ту, которую удалили, изгнали или заставили уйти. «Изгнанную» естественно передаёт контекст изгнания и восстановления, сохраняя женское единственное число.
- source_word: לְגוֹי עָצוּם
  choice: могучим народом
  rationale: גּוֹי означает народ или нацию, а עָצוּם — сильный, могучий, многочисленный. «Могучий народ» сохраняет корпоративный и политический смысл и не сужает прилагательное только до численности.
- source_word: וּמָלַךְ יְהוָה
  choice: и Яхве будет царствовать
  rationale: מלך обозначает царствование или пребывание царём; «будет царствовать» ясно передаёт активное царское правление. Тетраграмматон передан личным именем «Яхве».
- source_word: עֲלֵיהֶם
  choice: над ними
  rationale: При глаголе מלך предлог עַל обозначает власть над людьми; по-русски естественно «царствовать над ними».
- source_word: בְּהַר צִיּוֹן
  choice: на горе Сионе
  rationale: Предлог בְּ здесь указывает место царствования; нормативное русское выражение — «на горе Сионе».
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: отныне и навеки
  rationale: Устойчивое сочетание обозначает начало действия с настоящего времени и его неограниченную продолжительность. «Отныне и навеки» естественно и торжественно звучит по-русски.
theological_decisions:
- issue: Единственное число образов восстановленной общины
  choice: 'Сохранить формы женского рода единственного числа: «хромающую», «изгнанную».'
  alternative: 'Передать явно во множественном числе: «хромых» и «изгнанных».'
  rationale: Еврейский текст олицетворяет поражённую общину формами женского рода единственного числа. Их сохранение не устраняет напряжение между единичным образом и коллективным референтом.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя передано транслитерацией, а не заменено титулом, что различает имя Бога и обозначение «Господь».
- issue: Характер будущего народа
  choice: могучий народ
  alternative: многочисленный народ
  rationale: עָצוּם допускает оттенки силы, могущества и многочисленности. Основной текст сохраняет общий смысл могущества, не сводя обещание исключительно к численному росту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Параллелизм двух частей сохранён; тире во второй части устраняет ненужный повтор глагола. Формы женского рода единственного числа поддерживают олицетворение общины, присутствующее в еврейском тексте.
