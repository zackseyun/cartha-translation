source:
  edition: WLC
  text: וְ/אַתָּ֣ה מִגְדַּל עֵ֗דֶר עֹ֛פֶל בַּת צִיּ֖וֹן עָדֶ֣י/ךָ תֵּאתֶ֑ה וּ/בָאָ֗ה הַ/מֶּמְשָׁלָה֙ הָ/רִ֣אשֹׁנָ֔ה מַמְלֶ֖כֶת לְ/בַ֥ת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/008.yaml
  text: And you[a], tower of the flock, hill of daughter Zion—to you it will come, yes, the former dominion will come[c][b], the kingdom of the daughter of Jerusalem.
translation:
  language: ru
  text: А ты, башня стада[a], холм дочери Сиона[b], — к тебе придёт прежнее владычество[c], и придёт царство для дочери Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мигдал-Эдер» (название места); возможно также: «сторожевая башня стада».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Офел дочери Сиона», если понимать «Офел» как название места, а не как нарицательное слово «холм».'
    reason: alternative_reading
  - marker: c
    text: «Прежнее владычество», вероятно, означает восстановление былой царской власти Иерусалима.
    reason: cross_reference
lexical_decisions:
- source_word: מִגְדַּל עֵדֶר
  choice: башня стада
  rationale: Буквальное сочетание существительных сохраняет пастушеский и сторожевой образ еврейского текста. Возможное употребление в качестве топонима вынесено в примечание.
- source_word: עֹפֶל
  choice: холм
  rationale: Слово обозначает возвышенность или холм, но в иерусалимском контексте может быть топонимом Офел; эта возможность отмечена в сноске.
- source_word: בַּת צִיּוֹן
  choice: дочь Сиона
  rationale: Сохранена характерная для пророков персонификация города, без сведения выражения просто к названию «Сион».
- source_word: עָדֶיךָ תֵּאתֶה
  choice: к тебе придёт
  rationale: Передан направительный смысл עַד и женский род глагола, субъект которого далее раскрывается как «владычество»/«царство».
- source_word: הַמֶּמְשָׁלָה הָרִאשֹׁנָה
  choice: прежнее владычество
  rationale: מֶמְשָׁלָה означает власть или владычество, а רִאשֹׁנָה здесь естественно понимать во временном смысле — «прежнее», а не обязательно «первое».
- source_word: מַמְלֶכֶת לְבַת יְרוּשָׁלִָם
  choice: царство дочери Иерусалима
  rationale: «Царство» сохраняет политико-царственный смысл существительного. Родительный оборот по-русски естественно передаёт принадлежность/соотнесённость, выраженную конструкцией с לְ, не устраняя возможного оттенка предназначения.
theological_decisions:
- issue: Передавать ли начальные обозначения как нарицательные образы или как имена собственные
  choice: 'В основном тексте использованы нарицательные топографические образы: «башня стада» и «холм дочери Сиона»'
  alternative: «Мигдал-Эдер» и/или «Офел дочери Сиона»
  rationale: Еврейские слова сохраняют прозрачное лексическое значение, однако могут обозначать конкретные места. Обе возможности сохранены посредством сносок без навязывания географического или мессианского толкования.
- issue: Отождествлять ли «прежнее владычество» прямо с восстановленной Давидовой монархией
  choice: Сохранить сдержанную формулировку текста без имени Давида
  alternative: «Прежнее Давидово владычество»
  rationale: Контекст указывает на восстановление прежней царской власти Иерусалима, но имя Давида в стихе отсутствует; конкретизация была бы толкованием, а не переводом.
- issue: Синтаксическое соотношение «владычества» и «царства»
  choice: 'Сохранена аппозиция: приходящее прежнее владычество поясняется как царство дочери Иерусалима'
  alternative: Понимать их как два отдельных последовательно приходящих предмета
  rationale: Женская форма תֵּאתֶה и последующее וּבָאָה допускают риторическое предвосхищение и повтор, а «царство» естественно поясняет «прежнее владычество».
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Сохранены обращения, олицетворения «дочь Сиона» и «дочь Иерусалима», а также усилительный повтор «придёт, да, придёт». Порядок сносок приведён в естественную последовательность появления в русском тексте.
