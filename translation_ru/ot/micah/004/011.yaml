  text: וְ/עַתָּ֛ה נֶאֶסְפ֥וּ עָלַ֖יִ/ךְ גּוֹיִ֣ם רַבִּ֑ים הָ/אֹמְרִ֣ים תֶּחֱנָ֔ף וְ/תַ֥חַז בְּ/צִיּ֖וֹן עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/011.yaml
  text: And now many nations have gathered against you[a], saying, “Let her be defiled[b], and let our eyes look on Zion.”
translation:
  language: ru
  text: 'А теперь против тебя собрались многие народы. Они говорят: «Пусть она будет осквернена[a], и пусть наши глаза увидят Сион[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть она станет нечистой»; возможен также смысл «пусть она будет поругана». Еврейский глагол может обозначать нравственное или обрядовое осквернение. Местоимение «она» относится к Сиону, то есть к Иерусалиму.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть наши глаза посмотрят на Сион». В контексте это враждебное желание увидеть унижение Сиона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт и соединительный וְ, и временно-дискурсивное עַתָּה, отмечающее переход к нынешней в пророческой картине ситуации.
- source_word: נֶאֶסְפוּ עָלַיִךְ
  choice: против тебя собрались
  rationale: Нифаль перфекта описывает уже состоявшееся собрание, значимое для настоящего момента; עַל в контексте враждебного выступления означает направленность против Сиона.
- source_word: גּוֹיִם רַבִּים
  choice: многие народы
  rationale: Прямое и естественное обозначение множества этнополитических общностей.
- source_word: הָאֹמְרִים
  choice: Они говорят
  rationale: Еврейское причастие вводит продолжающуюся в данной сцене враждебную речь. Отдельное предложение звучит естественно по-русски.
- source_word: תֶּחֱנָף
  choice: Пусть она будет осквернена
  rationale: Форма выражает пожелание, чтобы Сион подвергся осквернению или оказался осквернённым. Страдательная конструкция сохраняет семантическую широту глагола и женский род подразумеваемого города.
- source_word: וְתַחַז בְּצִיּוֹן עֵינֵינוּ
  choice: и пусть наши глаза увидят Сион
  rationale: Сохранён явный образ «наших глаз», а חזה передано нейтральным «увидят», без добавления прямо не выраженных в тексте торжества или наслаждения зрелищем.
theological_decisions:
- issue: Смена обращения со второго лица на упоминание Сиона в третьем лице женского рода
  choice: 'Сохранить: «против тебя» — затем «пусть она»'
  alternative: Сгладить смену и передать в цитате «пусть ты будешь осквернена»
  rationale: В повествовательной рамке город назван собеседником во втором лице, тогда как в речи народов женская форма указывает на него в третьем лице. Сохранение смены следует еврейскому синтаксису и не устраняет намеренно его напряжение.
- issue: Характер взгляда народов на Сион
  choice: «пусть наши глаза увидят Сион» с пояснением контекста в сноске
  alternative: «пусть наши глаза насладятся видом Сиона» или «поглумятся над Сионом»
  rationale: Контекст несомненно враждебен, однако сам глагол обозначает видение или созерцание и не требует внесения в основной текст более узкого эмоционального оттенка.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Синтаксическая смена «тебя»/«она» намеренно сохранена; эмоциональный смысл враждебного созерцания не усилен сверх еврейского текста.
