base_translation:
  language: en
  yaml_path: translation/ot/micah/004/009.yaml
  text: Why do you cry out so loudly? Is there no king in you? Has your counselor perished[c][b][a], that labor pains have seized you like a woman giving birth?
translation:
  language: ru
  text: Почему ты теперь так громко кричишь?[a] Неужели у тебя нет царя?[b] Неужели погиб твой советник, что тебя схватили[c] родовые муки, как роженицу?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «издаёшь громкий крик»; еврейское выражение обозначает громкий возглас, здесь, вероятно, крик от горя или страха.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Неужели нет царя в тебе?» Адресат выражен формами женского рода; в контексте это олицетворённый город.'
    reason: literal_rendering
  - marker: c
    text: 'Или: «охватили», «овладели тобой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה לָמָּה
  choice: Теперь зачем
  rationale: עַתָּה явно выражает временной или дискурсивный переход («теперь»), а לָמָּה вводит риторический вопрос («зачем/почему»). Здесь «зачем» естественно передаёт вопрос о причине такого крика.
- source_word: תָרִיעִי רֵעַ
  choice: ты так громко кричишь
  rationale: Глагол в породе hifil обозначает громкий крик или возглас, а רֵעַ усиливает характеристику звука; русское «так громко кричишь» передаёт и громкость, и страдальческий оттенок контекста.
- source_word: הֲמֶלֶךְ אֵין בָּךְ
  choice: Разве нет у тебя царя?
  rationale: Еврейское выражение буквально говорит об отсутствии царя «в тебе». По-русски «нет у тебя царя» сохраняет образ обращения к олицетворённому городу и звучит естественнее, не сводя фразу к нейтральному обладанию.
- source_word: יוֹעֲצֵךְ אָבָד
  choice: Или погиб твой советник
  rationale: יוֹעֵץ — тот, кто даёт совет, а אָבַד означает погибнуть, исчезнуть или быть утраченным. «Погиб» сохраняет резкость риторического вопроса, не уточняя способ утраты.
- source_word: הֶחֱזִיקֵךְ חִיל
  choice: тебя схватили муки
  rationale: חִיל в контексте следующего сравнения означает родовые муки, а חזק в hifil — крепко охватить или схватить. Сочетание «схватили муки» естественно для русского языка и сохраняет силу образа.
- source_word: כַּיּוֹלֵדָה
  choice: как роженицу
  rationale: Причастие указывает на женщину, которая рожает. «Как роженицу» кратко и естественно передаёт образ женщины в родах; форма винительного падежа обусловлена русской конструкцией «схватили».
theological_decisions:
- issue: Олицетворение Сиона/Иерусалима как женщины
  choice: Сохранено через обращение во втором лице единственного числа и сравнение с роженицей без добавления имени адресата.
  alternative: Добавить в основной текст «дочь Сиона» или прямо назвать Иерусалим.
  rationale: В самом стихе адресат не назван, хотя женские формы и контекст указывают на олицетворённый город. Добавление имени устранило бы сохраняемую оригиналом неявность.
- issue: Связь царя и советника
  choice: Сохранены два последовательных риторических вопроса без отождествления царя с советником.
  alternative: Истолковать «советника» как поясняющее наименование царя.
  rationale: Синтаксис допускает тесную смысловую связь, но не требует полного отождествления; перевод не должен разрешать эту напряжённость за читателя.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Женский род адресата не навязывается местоимением, но ясно проявляется в образе роженицы. Порядок сносок приведён к обычной последовательности [a], [b], [c], и каждый маркер присутствует в основном тексте.
