id: MIC.4.12
reference: Micah 4:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הֵ֗מָּה לֹ֤א יָֽדְעוּ֙ מַחְשְׁב֣וֹת יְהוָ֔ה וְ/לֹ֥א הֵבִ֖ינוּ עֲצָת֑/וֹ כִּ֥י קִבְּצָ֖/ם כֶּ/עָמִ֥יר גֹּֽרְנָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/012.yaml
  text: But they do not know the thoughts of Yahweh[a], and they do not understand his plan[b], for he has gathered them like sheaves to the threshing floor.
translation:
  language: ru
  text: Но они не знают мыслей Яхве и не понимают Его замысла[a], потому что Он собрал их, словно снопы на гумно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его совета»; «Его намерения».'
    reason: lexical_alternative
  - marker: b
    text: Снопы собирали на гумно для молотьбы; здесь это образ народов, собранных для суда.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Но они
  rationale: Явное местоимение подчёркивает противопоставление предшествующему контексту; союз וְ здесь естественно передаётся противительным «но».
- source_word: יָדְעוּ
  choice: не знают
  rationale: 'Перфект описывает сохраняющееся состояние: народы в данный момент не ведают Божьих мыслей.'
- source_word: מַחְשְׁבוֹת
  choice: мыслей
  rationale: Слово допускает значения «мысли», «замыслы», «намерения». Выбор «мыслей» сохраняет отличие от следующего עֲצָה.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: הֵבִינוּ
  choice: не понимают
  rationale: Глагол выражает понимание или постижение; форма настоящего времени естественно передаёт текущее состояние.
- source_word: עֲצָתוֹ
  choice: Его замысла
  rationale: עֵצָה может означать совет, замысел или намерение. «Замысел» ясно обозначает цель Бога и не сливается с предшествующими «мыслями».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание, раскрывающее неведомый народам Божий замысел.
- source_word: קִבְּצָם
  choice: Он собрал их
  rationale: Подразумеваемый субъект — Яхве, а местоименный суффикс указывает на враждебные народы. Совершенный вид сохраняет результативность еврейского перфекта.
- source_word: כֶּעָמִיר
  choice: словно снопы
  rationale: עָמִיר обозначает сноп или массу сжатого зерна; множественное «снопы» естественно согласуется с собранными народами.
- source_word: גֹּרְנָה
  choice: на гумно
  rationale: Направительный суффикс выражает движение к месту молотьбы; русское «на гумно» передаёт это направление.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Субъект действия «собрал их»
  choice: Яхве собирает народы
  alternative: Неуказанный субъект; Сион
  rationale: Ближайший смысловой субъект — Яхве, о мыслях и замысле Которого говорится непосредственно перед этим; контекст описывает собирание народов для суда.
- issue: Смысл образа гумна
  choice: Образ Божьего суда над собранными народами
  alternative: Только нейтральный образ собирания
  rationale: Последующий контекст развивает образ молотьбы; перевод сохраняет сам образ, а его судебный смысл поясняется в сноске, не вставляясь в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Пара «мысли — замысел» сохраняет различие между מַחְשְׁבוֹת и עֲצָה. Образ снопов и гумна оставлен без развёртывания в основном тексте; пояснение вынесено в сноску. Местоимение «Его» и субъект «Он» написаны с прописной буквы согласно принятой русской библейской традиции.
