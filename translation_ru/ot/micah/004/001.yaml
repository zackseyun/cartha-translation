source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים יִ֠הְיֶה הַ֣ר בֵּית יְהוָ֤ה נָכוֹן֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֥א ה֖וּא מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ עָלָ֖י/ו עַמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/001.yaml
  text: And it will happen in the latter days that the mountain of the house of Yahweh will be established as the chief of the mountains[a], and it will be lifted up above the hills[c][b], and peoples will stream to it.
translation:
  language: ru
  text: 'И будет в последние дни[a]: гора дома Яхве утвердится во главе гор[b], возвысится над холмами, и потекут к ней народы[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в грядущие дни»; выражение может обозначать будущее время, имеющее решающее значение.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «во главе гор»; это может указывать как на положение, так и на высшее значение и первенство.'
    reason: lexical_alternative
  - marker: c
    text: Глагол изображает народы текущими к горе подобно водному потоку.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет характерную пророческую вводную формулу и её направленность в будущее, не прибегая к архаичному обороту «и будет так, что».
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: в последние дни
  rationale: Передаёт устойчивое пророческое выражение, сохраняя его эсхатологическую открытость; возможное более широкое понимание отмечено в сноске.
- source_word: הַר בֵּית יְהוָה
  choice: гора дома Яхве
  rationale: 'Прямо передаёт древнееврейскую сопряжённую конструкцию: гора, связанная с домом, то есть храмом, Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, представленное тетраграмматоном в исходном тексте.
- source_word: נָכוֹן
  choice: утвердится
  rationale: Выражает прочное, незыблемое установление горы и естественно сочетается с будущим пророческим контекстом.
- source_word: בְּרֹאשׁ הֶהָרִים
  choice: во главе гор
  rationale: Сохраняет образ «главы» и допускает как пространственный смысл, так и значение первенства, не сводя выражение лишь к физической высоте.
- source_word: וְנִשָּׂא הוּא מִגְּבָעוֹת
  choice: возвысится над холмами
  rationale: Передаёт состояние возвышенности и сопоставление с холмами, не решая, является ли возвышение топографическим или символическим.
- source_word: וְנָהֲרוּ
  choice: потекут
  rationale: Сохраняет яркую метафору движения народов подобно водному потоку, хотя речь идёт о движении к горе.
- source_word: עַמִּים
  choice: народы
  rationale: Обозначает множество этнических общностей и сохраняет универсальный охват пророчества.
- source_word: עָלָיו
  choice: к ней
  rationale: По контексту местоимение относится к горе; русский предлог «к» естественно выражает направление движения.
theological_decisions:
- issue: Эсхатологический смысл выражения בְּאַחֲרִית הַיָּמִים
  choice: в последние дни
  alternative: в грядущие дни; впоследствии
  rationale: Основной вариант сохраняет традиционную пророческую силу выражения, а сноска не позволяет искусственно ограничить его одной эсхатологической системой.
- issue: Характер возвышения горы
  choice: Сохранены одновременно пространственный образ и смысл первенства
  alternative: Только буквальное топографическое возвышение или только символическое превосходство
  rationale: Параллельные выражения допускают и зрительный образ высоты, и почётное главенство; перевод не устраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краток и ритмичен; ключевые образы исходного текста — гора, возвышение и текущие к ней народы — сохранены без конфессионального истолкования.
