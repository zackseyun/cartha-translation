source:
  edition: WLC
  text: וְֽ/הָלְכ֞וּ גּוֹיִ֣ם רַבִּ֗ים וְ/אָֽמְרוּ֙ לְכ֣וּ וְ/נַעֲלֶ֣ה אֶל הַר יְהוָ֗ה וְ/אֶל בֵּית֙ אֱלֹהֵ֣י יַעֲקֹ֔ב וְ/יוֹרֵ֨/נוּ֙ מִ/דְּרָכָ֔י/ו וְ/נֵלְכָ֖ה בְּ/אֹֽרְחֹתָ֑י/ו כִּ֤י מִ/צִּיּוֹן֙ תֵּצֵ֣א תוֹרָ֔ה וּ/דְבַר יְהוָ֖ה מִ/ירוּשָׁלִָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/002.yaml
  text: And many nations will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For from Zion Torah will go out, and the word of Yahweh from Jerusalem.
translation:
  language: ru
  text: 'И пойдут многие народы и скажут: «Пойдём, взойдём на гору Яхве, к дому Бога Иакова! Он научит нас Своим путям, и мы будем ходить Его стезями». Ведь с Сиона выйдет Тора[a], и слово Яхве — из Иерусалима.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закон» или «наставление».'
    reason: Лексема תּוֹרָה шире узкого понятия закона и может обозначать Божье учение или наставление.
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: пойдут
  rationale: 'Глагол הלך прямо обозначает движение: «идти, пойти». Русское «пойдут» естественно сохраняет исходную перспективу и согласуется с последующим приглашением взойти на гору.'
- source_word: גּוֹיִם רַבִּים
  choice: многие народы
  rationale: Сочетание обозначает множество народов, участвующих в паломничестве к Сиону; перевод сохраняет международный масштаб видения.
- source_word: לְכוּ וְנַעֲלֶה
  choice: Пойдём, взойдём
  rationale: Императив и когортатив передают совместное побуждение. «Взойдём» сохраняет выраженную в еврейском тексте идею восхождения к Иерусалиму.
- source_word: הַר יְהוָה
  choice: гора Яхве
  rationale: הַר передано буквально как «гора», а личное имя יהוה — транслитерацией «Яхве».
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  choice: дом Бога Иакова
  rationale: «Дом» сохраняет библейский образ и не заменяет исходное слово более узким толкованием «храм».
- source_word: וְיוֹרֵנוּ מִדְּרָכָיו
  choice: Он научит нас Своим путям
  rationale: Форма от ירה обозначает наставление; מן в этой конструкции указывает на содержание обучения и не требует буквального русского «из Своих путей».
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  choice: и мы будем ходить Его стезями
  rationale: «Ходить» сохраняет метафору образа жизни, а «стези» передают אֹרְחוֹת и поддерживают поэтический параллелизм с «путями».
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание сказанного; «ведь» ясно и естественно выражает пояснительно-причинную связь в современном русском языке.
- source_word: תּוֹרָה
  choice: Тора
  rationale: Транслитерация сохраняет широкий заветный смысл еврейского понятия, включающего Божье учение и наставление, а не только законодательные нормы.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Прямой перевод сохраняет пророческую формулу и личное имя Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога, поэтому оно передано распространённой научной транслитерацией, а не заменено титулом.
- issue: Передача תּוֹרָה в пророчестве о Сионе
  choice: Тора
  alternative: закон; наставление
  rationale: '«Тора» сохраняет многозначность понятия: это не только закон в узком смысле, но и исходящее от Бога учение. Доступные смысловые соответствия приведены в примечании.'
- issue: Связь וְיוֹרֵנוּ и וְנֵלְכָה с призывом взойти
  choice: «Он научит нас… и мы будем ходить…»
  alternative: «чтобы Он научил нас… чтобы нам ходить…»
  rationale: Еврейские формы допускают оттенок ожидаемого результата или цели. Выбранная русская конструкция естественно передаёт уверенное ожидание народов, не устраняя смысловой связи с их восхождением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Стези» сохранены как понятный поэтический эквивалент, позволяющий отличить אֹרְחוֹת от דְּרָכִים. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции.
