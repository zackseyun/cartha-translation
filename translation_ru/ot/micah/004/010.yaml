reference: Micah 4:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: ח֧וּלִי וָ/גֹ֛חִי בַּת צִיּ֖וֹן כַּ/יּֽוֹלֵדָ֑ה כִּֽי עַתָּה֩ תֵצְאִ֨י מִ/קִּרְיָ֜ה וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה וּ/בָ֤את עַד בָּבֶל֙ שָׁ֣ם תִּנָּצֵ֔לִי שָׁ֚ם יִגְאָלֵ֣/ךְ יְהוָ֔ה מִ/כַּ֖ף אֹיְבָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/010.yaml
  text: Writhe and groan[a], daughter Zion, like a woman giving birth; for now you will go out from the city and dwell in the field, and you will go as far as Babylon. There you will be rescued[b]; there Yahweh will redeem you from the hand of your enemies.
translation:
  language: ru
  text: Корчись и стони[a], дочь Сиона, как роженица, потому что теперь ты выйдешь из города, поселишься в поле и дойдёшь до Вавилона. Там ты будешь спасена[b], там Яхве искупит тебя из руки твоих врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кричи». Еврейский глагол может обозначать крик от боли, что соответствует образу родов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «там ты будешь избавлена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ח֧וּלִי
  choice: Корчись
  rationale: Повелительная форма женского рода в контексте родов передаёт телесные судороги и мучение, не сводя образ только к страху или дрожи.
- source_word: וָ/גֹ֛חִי
  choice: и стони
  rationale: Глагол обозначает болезненный крик или стон; «стони» естественно сочетается с образом роженицы, а вариант «кричи» отмечен в сноске.
- source_word: בַּת צִיּוֹן
  choice: дочь Сиона
  rationale: Сохраняет традиционное и понятное по-русски пророческое олицетворение Сиона/Иерусалима.
- source_word: כַּ/יּֽוֹלֵדָה
  choice: как роженица
  rationale: Кратко и точно передаёт женщину, которая рожает, сохраняя явный образ родовых мук.
- source_word: מִ/קִּרְיָה
  choice: из города
  rationale: В контексте определённый город — Сион/Иерусалим; русский определённость передаёт контекстуально без добавления названия.
- source_word: וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה
  choice: поселишься в поле
  rationale: Сохраняет обычные значения «жить/обитать» и «поле», не добавляя прямо отсутствующего определения «открытом».
- source_word: וּ/בָ֤את עַד בָּבֶל֙
  choice: и дойдёшь до Вавилона
  rationale: Передаёт движение к достигнутому пределу или месту назначения, выраженное сочетанием בוא с עַד.
- source_word: שָׁ֣ם תִּנָּצֵ֔לִי
  choice: Там ты будешь спасена
  rationale: Пассивная форма נצל обозначает избавление от опасности; «будешь спасена» естественно и сохраняет пассивность. Альтернатива указана в сноске.
- source_word: יִגְאָלֵ֣/ךְ
  choice: искупит тебя
  rationale: Сохраняет особый смысл גאל — освобождение и возвращение того, на кого имеется право, — и не смешивает его с предшествующим נצל.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: מִ/כַּ֖ף אֹיְבָֽיִ/ךְ
  choice: из руки твоих врагов
  rationale: Сохраняет еврейскую метафору руки как власти и контроля; она понятна в литературном русском.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Различение נצל и גאל
  choice: «будешь спасена» и «искупит тебя»
  alternative: «будешь избавлена» и «освободит тебя»
  rationale: Разные русские глаголы сохраняют разграничение между избавлением от опасности и искупительно-восстановительным действием, не устраняя богословское напряжение.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сделан плавным, но повтор «там» и метафора «из руки» сохранены. «Дочь Сиона» оставлено как узнаваемое библейское олицетворение; «в поле» не расширено до «в открытом поле».
