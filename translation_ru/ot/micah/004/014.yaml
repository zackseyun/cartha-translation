base_translation:
  language: en
  yaml_path: translation/ot/micah/004/014.yaml
  text: Now muster yourself in troops[a], daughter of troops; a siege is set against us[c][b]. With a rod they strike the judge of Israel on the cheek.
translation:
  language: ru
  text: Теперь соберись в отряды[a], дочь отрядов! Нас осадили. Жезлом бьют[b] по щеке судью Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нанеси себе порезы» — если глагол означает самоповреждение, а не сбор в отряды.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут бить»; еврейский имперфект в пророческом контексте может иметь значение будущего времени.'
    reason: lexical_alternative
  - marker: c
    text: «Судья Израиля» здесь может означать правителя или вождя Израиля; в контексте некоторые также видят мессианское предзнаменование.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתְגֹּדְדִי
  choice: соберись в отряды
  rationale: Возвратная форма допускает значения «собираться в отряды» и «наносить себе порезы». Военный контекст и последующее בַת גְּדוּד делают значение сбора отрядов наиболее вероятным; возвратность сохранена.
- source_word: בַת גְּדוּד
  choice: дочь отрядов
  rationale: Сохранена характерная для еврейского языка персонификация города или общины как «дочери»; גְּדוּד передано военным словом «отряд».
- source_word: מָצוֹר שָׂם עָלֵינוּ
  choice: нас осадили
  rationale: Идиоматическая русская безлично-неопределённая конструкция передаёт осаду и не вводит конкретного деятеля, которого еврейский текст не называет.
- source_word: בַּשֵּׁבֶט
  choice: жезлом
  rationale: שֵׁבֶט может означать жезл, посох или прут. «Жезл» подходит как орудие удара и вместе с тем не устраняет возможный оттенок унижения правителя.
- source_word: יַכּוּ
  choice: бьют
  rationale: Настоящее время придаёт сцене пророческую наглядность; допустимое будущее значение имперфекта отмечено в сноске.
- source_word: עַל הַלְּחִי
  choice: по щеке
  rationale: Так естественно по-русски передаётся удар в лицо и связанное с ним публичное унижение.
- source_word: שֹׁפֵט יִשְׂרָאֵל
  choice: судью Израиля
  rationale: Буквальное значение сохранено, хотя в данном контексте «судья» может обозначать правителя или вождя.
theological_decisions:
- issue: Возможное мессианское значение выражения «судья Израиля»
  choice: Передать неисключительно как «судью Израиля», не отождествляя его прямо с Мессией.
  alternative: Понять как современного Михею правителя Иудеи либо как мессианское предзнаменование в связи со следующим стихом.
  rationale: Сам стих прямо не устанавливает личность этого правителя. Буквальная передача сохраняет связь с контекстом осады и унижения вождя, не устраняя возможного мессианского прочтения.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой, напряжённой военной образности. Выражение «дочь отрядов» намеренно сохраняет необычную еврейскую персонификацию; синтаксис остального текста сделан естественным для современного читателя.
