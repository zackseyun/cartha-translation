base_translation:
  language: en
  yaml_path: translation/ot/micah/004/013.yaml
  text: Rise and thresh[a], daughter Zion, for I will make your horn iron, and I will make your hooves bronze; you will crush many peoples, and I will devote their gain to Yahweh[b], and their wealth to the Lord of all the earth.
translation:
  language: ru
  text: Встань и молоти, дочь Сиона! Ибо Я сделаю твой рог железным, а твои копыта — бронзовыми. Ты сокрушишь многие народы, и Я посвящу[a] Яхве их наживу[b], а их богатство — Владыке всей земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предам заклятию». Еврейский глагол означает безвозвратно посвятить Богу и нередко подразумевает заклятие, связанное с уничтожением.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «доход» или «добычу»; еврейское слово может обозначать прибыль, особенно приобретённую из корысти или неправедным путём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֧וּמִי וָד֣וֹשִׁי
  choice: Встань и молоти
  rationale: Два повелительных глагола женского рода обращены к олицетворённому Сиону. «Молоти» сохраняет образ обмолота зерна посредством попирания, который продолжают копыта и сокрушение народов.
- source_word: בַת צִיּוֹן
  choice: дочь Сиона
  rationale: Традиционный и понятный по-русски пророческий образ олицетворённого Сиона; форма обращения сохранена.
- source_word: קַרְנֵךְ
  choice: твой рог
  rationale: Сохранён буквальный библейский образ силы и наступательной мощи, без истолковывающей замены словом «сила».
- source_word: אָשִׂים בַּרְזֶל
  choice: сделаю ... железным
  rationale: Естественно передаёт наделение рога качеством железа и сохраняет действие Бога.
- source_word: וּפַרְסֹתַיִךְ אָשִׂים נְחוּשָׁה
  choice: а твои копыта — бронзовыми
  rationale: «Копыта» продолжают образ молотьбы животным; «бронза» наиболее вероятно передаёт נְחוּשָׁה в данном образном контексте.
- source_word: וַהֲדִקּוֹת עַמִּים רַבִּים
  choice: Ты сокрушишь многие народы
  rationale: Глагол выражает раздробление или размалывание; «сокрушишь» звучит сильно и естественно, сохраняя связь с молотьбой. עַמִּים передано как «народы».
- source_word: וְהַחֲרַמְתִּי
  choice: Я посвящу
  rationale: Форма первого лица указывает на действие Бога. חרם обозначает безвозвратное посвящение Богу, нередко через заклятие и уничтожение; нейтрально-консекрационный смысл вынесен в основной текст, а более жёсткий оттенок отмечен в сноске.
- source_word: בִּצְעָם
  choice: их добычу
  rationale: В контексте победы и параллели с богатством речь, вероятно, идёт о наживе или добыче. «Добыча» естественна по-русски, а возможный оттенок корыстной наживы сохранён в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, чтобы сохранить различие между יהוה и последующим אֲדוֹן.
- source_word: וְחֵילָם לַאֲדוֹן כָּל הָאָרֶץ
  choice: а их богатство — Владыке всей земли
  rationale: חֵיל в параллели с добычей означает имущество или богатство; אֲדוֹן передано как «Владыка», чтобы отличить титул от имени Яхве.
theological_decisions:
- issue: Значение חרם в контексте победы
  choice: Я посвящу их добычу Яхве
  alternative: Я предам их добычу заклятию для Яхве
  rationale: Прямые дополнения — добыча и богатство, а не сами народы. «Посвящу» сохраняет принадлежность Богу и не утверждает без необходимости, что всё имущество непременно уничтожается; технический оттенок заклятия указан в сноске.
- issue: Различение יהוה и אֲדוֹן
  choice: Яхве ... Владыке всей земли
  alternative: Господу ... Господу всей земли
  rationale: 'Разные еврейские обозначения намеренно различены: первое является личным именем, второе — титулом. Это предотвращает стирание параллели и не добавляет конфессионального толкования.'
- issue: Нравственный оттенок בֶּצַע
  choice: добычу
  alternative: наживу
  rationale: Слово может иметь отрицательный оттенок корыстной или неправедной прибыли, но в данном контексте также допускает более общее значение добычи. Основной текст не разрешает неоднозначность чрезмерно категорично; она отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого звучания. Сельскохозяйственная метафора молотьбы, рога и копыт оставлена без поясняющей перифразы. Заглавные «Я» и «Владыка» используются в соответствии с возвышенным библейским регистром; имя «Яхве» сохраняет различие исходных божественных обозначений.
