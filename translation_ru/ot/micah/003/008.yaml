source:
  edition: WLC
  text: וְ/אוּלָ֗ם אָנֹכִ֞י מָלֵ֤אתִי כֹ֨חַ֙ אֶת ר֣וּחַ יְהוָ֔ה וּ/מִשְׁפָּ֖ט וּ/גְבוּרָ֑ה לְ/הַגִּ֤יד לְ/יַֽעֲקֹב֙ פִּשְׁע֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל חַטָּאתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/008.yaml
  text: But as for me[a], I am filled with power, with the Spirit of Yahweh, and with justice and might[b], to declare to Jacob his transgression and to Israel his sin.
translation:
  language: ru
  text: Но я[a] исполнен силы, Духа Яхве, справедливости и могущества, чтобы возвестить Иакову его преступление[b] и Израилю — его грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но я исполнен силой от Духа Яхве, справедливостью и могуществом». Еврейскую последовательность можно понимать либо как перечисление того, чем исполнен пророк, либо как указание на Духа Яхве как источник его силы.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «мятеж». Еврейское слово может подчёркивать сознательное неповиновение Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם אָנֹכִי
  choice: Но я
  rationale: Передаёт резкое противопоставление лжепророкам из предшествующего контекста и сохраняет подчёркнутое אָנֹכִי без неестественного русского оборота.
- source_word: מָלֵאתִי
  choice: исполнен
  rationale: Выражает наличное состояние как результат наполнения и уместно в возвышенной, но понятной современной речи.
- source_word: כֹחַ
  choice: силы
  rationale: Естественно обозначает данную пророку способность исполнить поручение.
- source_word: אֶת רוּחַ יְהוָה
  choice: Духа Яхве
  rationale: При основном синтаксическом прочтении входит в перечень того, чем исполнен пророк; личное имя יהוה передано как «Яхве».
- source_word: וּמִשְׁפָּט
  choice: справедливости
  rationale: Передаёт нравственно-судебный смысл מִשְׁפָּט в обличительной пророческой речи.
- source_word: וּגְבוּרָה
  choice: мужества
  rationale: В данном контексте слово указывает не только на мощь, но и на отвагу, необходимую для открытого обличения; выбор также избегает неясного повтора «силы».
- source_word: לְהַגִּיד
  choice: чтобы возвестить
  rationale: Сохраняет целевое значение инфинитива и публичный, торжественный характер пророческого провозглашения.
- source_word: פִּשְׁעוֹ
  choice: его преступление
  rationale: Передаёт серьёзное нарушение Божьей воли; оттенок сознательного мятежа отмечен в сноске.
- source_word: חַטָּאתוֹ
  choice: его грех
  rationale: Прямой и естественный эквивалент, сохраняющий параллелизм с «преступлением».
theological_decisions:
- issue: Синтаксическая связь выражения אֶת רוּחַ יְהוָה с «силой» и глаголом «исполнен»
  choice: «исполнен силы, Духа Яхве, справедливости и мужества» — Дух Яхве понимается как один из элементов перечисления
  alternative: «исполнен силой от Духа Яхве, справедливостью и мужеством» — Дух Яхве понимается как источник силы
  rationale: Еврейская последовательность допускает оба понимания; основной текст близко сохраняет её перечислительную форму, а альтернативная причинно-инструментальная связь вынесена в сноску.
- issue: Характер выражения רוּחַ יְהוָה
  choice: «Дух Яхве» с прописной буквы
  alternative: «дух Яхве» как безличное божественное воздействие
  rationale: В контексте пророческого наделения силой выражение естественно обозначает Божьего Духа; прописная буква не устраняет синтаксической неоднозначности стиха.
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим регистром. «Возвестить» и «исполнен» сохраняют достоинство библейской речи, оставаясь понятными; тире во второй параллельной строке устраняет тяжеловесный повтор сказуемого.
