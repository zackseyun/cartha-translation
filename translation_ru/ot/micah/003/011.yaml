  variant: modern literary Russian
source:
  edition: WLC
  text: רָאשֶׁ֣י/הָ בְּ/שֹׁ֣חַד יִשְׁפֹּ֗טוּ וְ/כֹהֲנֶ֨י/הָ֙ בִּ/מְחִ֣יר יוֹר֔וּ וּ/נְבִיאֶ֖י/הָ בְּ/כֶ֣סֶף יִקְסֹ֑מוּ וְ/עַל יְהוָה֙ יִשָּׁעֵ֣נוּ לֵ/אמֹ֔ר הֲ/ל֤וֹא יְהוָה֙ בְּ/קִרְבֵּ֔/נוּ לֹֽא תָב֥וֹא עָלֵ֖י/נוּ רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/011.yaml
  text: Her leaders judge for a bribe[a], and her priests teach for a price, and her prophets practice divination for silver; yet they lean on Yahweh, saying[b], “Is not Yahweh in our midst? No disaster will come upon us.”
translation:
  language: ru
  text: 'Её правители судят за взятку,

    её священники наставляют за плату,

    а её пророки гадают за серебро.

    И всё же они опираются на Яхве[a], говоря:

    «Разве не Яхве среди нас?

    Не постигнет нас бедствие[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полагаются на Яхве». Еврейский глагол передаёт образ человека, опирающегося на кого-либо как на поддержку.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «беда»; еврейское слово может также означать «зло», но здесь речь идёт о грядущем бедствии или суде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֶׁיהָ
  choice: её правители
  rationale: Существительное רֹאשׁ с суффиксом 3-го лица женского рода множественного числа обозначает руководителей города. «Правители» естественно передаёт их общественно-судебную власть, не воспроизводя буквально неидиоматичное здесь «главы».
- source_word: בְּשֹׁחַד יִשְׁפֹּטוּ
  choice: судят за взятку
  rationale: שֹׁחַד означает взятку, а שׁפט — осуществление суда. Предлог בְּ указывает на корыстное вознаграждение, за которое выносится решение.
- source_word: כֹהֲנֶיהָ בִּמְחִיר יוֹרוּ
  choice: её священники наставляют за плату
  rationale: Hифиль יוֹרוּ от ירה обозначает священническое наставление, в том числе в Божьем законе. «Наставляют» сохраняет этот оттенок лучше, чем общее «учат», а «за плату» передаёт מְחִיר и коммерциализацию служения.
- source_word: וּנְבִיאֶיהָ בְּכֶסֶף יִקְסֹמוּ
  choice: а её пророки гадают за серебро
  rationale: קסם обозначает гадание, то есть получение предсказаний оккультным способом; «гадают» ясно отличает это от истинного пророчества. «Серебро» сохраняет конкретный образ כֶּסֶף и параллелизм стиха.
- source_word: וְעַל־יְהוָה יִשָּׁעֵנוּ
  choice: И всё же они опираются на Яхве
  rationale: Нифаль глагола שׁען выражает опору или доверие и сохраняет образ человека, прислоняющегося к поддержке. «И всё же» естественно выявляет иронический контраст с описанной коррупцией, не меняя смысла союза.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а не заменено титулом.
- source_word: הֲלוֹא יְהוָה בְּקִרְבֵּנוּ
  choice: Разве не Яхве среди нас?
  rationale: הֲלוֹא вводит риторический вопрос, выражающий самоуверенность говорящих. «Среди нас» естественно передаёт בְּקִרְבֵּנוּ.
- source_word: לֹא תָבוֹא עָלֵינוּ רָעָה
  choice: Не постигнет нас бедствие
  rationale: В контексте грядущего суда רָעָה обозначает несчастье или бедствие, а не нравственное зло. Глагольное выражение «не постигнет» естественно передаёт буквальное «не придёт на нас».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя Бога. Транслитерация сохраняет имя и не подменяет его титулом.
- issue: Характер доверия коррумпированных вождей Богу
  choice: опираются на Яхве
  alternative: полагаются на Яхве
  rationale: Формулировка сохраняет телесную метафору שׁען и одновременно передаёт ложную религиозную уверенность говорящих, не утверждая, что их доверие истинно или оправданно.
- issue: Значение רָעָה в заключительной реплике
  choice: бедствие
  alternative: беда; зло
  rationale: Контекст пророческого суда указывает на губительное событие. Выбор «бедствие» не превращает фразу в утверждение о нравственном зле, но сноска сохраняет широту еврейского слова.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Трёхчастный параллелизм сохранён; конкретное «серебро» оставлено ради образности. Местоимение «её» соотносится с городом/Сионом в ближайшем контексте. Кавычки и ритмическое членение делают обвинение и самоуверенную реплику ясными для чтения вслух.
