  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/כֵ֞ן לַ֤יְלָה לָ/כֶם֙ מֵֽ/חָז֔וֹן וְ/חָשְׁכָ֥ה לָ/כֶ֖ם מִ/קְּסֹ֑ם וּ/בָ֤אָה הַ/שֶּׁ֨מֶשׁ֙ עַל הַ/נְּבִיאִ֔ים וְ/קָדַ֥ר עֲלֵי/הֶ֖ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/006.yaml
  text: Therefore it will be night for you[a], without vision, and darkness for you, without divination; the sun will go down on the prophets[b], and the day will grow dark over them.
translation:
  language: ru
  text: Поэтому для вас наступит ночь без видений[a], и тьма — без прорицаний; солнце зайдёт над пророками[b], и день померкнет над ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «от видения» и «от прорицания». Древнееврейский предлог здесь, вероятнее всего, указывает на лишение: «без видений» и «без прорицаний».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «солнце придёт на пророков»; применительно к солнцу этот оборот означает, что оно зайдёт.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Связывает приговор с предшествующим обличением и ясно передаёт значение следствия.
- source_word: לַיְלָה לָכֶם
  choice: для вас наступит ночь
  rationale: Безглагольная древнееврейская конструкция в контексте грядущего суда естественно передаётся будущим временем; образ наступающей ночи сохранён.
- source_word: מֵחָזוֹן
  choice: без видений
  rationale: 'Предлог מִן здесь, вероятнее всего, имеет значение лишения: пророки останутся без откровений в видениях. Множественное число естественно для русского языка в данном контексте.'
- source_word: וְחָשְׁכָה לָכֶם
  choice: и тьма
  rationale: Форма חָשְׁכָה может передавать наступление темноты; краткая именная конструкция сохраняет поэтический параллелизм с ночью.
- source_word: מִקְּסֹם
  choice: без прорицаний
  rationale: Предлог вновь понят как указывающий на лишение. «Прорицание» передаёт практику предсказания посредством гадания, не приравнивая её к подлинному пророческому откровению.
- source_word: וּבָאָה הַשֶּׁמֶשׁ עַל הַנְּבִיאִים
  choice: солнце зайдёт над пророками
  rationale: Хотя בוא буквально значит «приходить», в сочетании с солнцем выражение обозначает его заход. «Зайдёт над» сохраняет и естественный русский образ, и предлог עַל.
- source_word: וְקָדַר עֲלֵיהֶם הַיּוֹם
  choice: и день померкнет над ними
  rationale: Глагол קדר выражает потемнение, мрачность. «Померкнет» лаконично и поэтично передаёт угасание света дня.
theological_decisions:
- issue: Смысл образов ночи и тьмы
  choice: Образы прежде всего выражают суд над обличаемыми пророками и лишение их видений и способности давать предсказания.
  alternative: Понимать сказанное только как общественный позор либо как буквальное астрономическое событие.
  rationale: Непосредственный контекст говорит о пророках, видениях и прорицаниях; поэтому образная речь указывает на прекращение доступного им пророческого света, не исключая более широких последствий Божьего суда.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллельные образы ночи, тьмы, заходящего солнца и меркнущего дня сохранены; синтаксис сделан ясным для обычного читателя.
