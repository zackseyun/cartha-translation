  text: ненавидящие добро и любящие зло, сдирающие с них кожу и сдирающие плоть с их костей,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׂנְאֵי טוֹב
  choice: ненавидящие добро
  rationale: Причастие множественного числа продолжает обращение предыдущего стиха; причастная форма естественно сохраняет синтаксис и лаконичный нравственный контраст.
- source_word: וְאֹהֲבֵי רעה
  choice: и любящие зло
  rationale: Параллельная причастная конструкция передаёт прямое противопоставление добра и зла; «зло» здесь уместнее более узкого «вред».
- source_word: גֹּזְלֵי
  choice: сдирающие
  rationale: В сочетании с кожей, плотью и костями глагол обозначает насильственное отнятие; «сдирающие» естественно и ярко передаёт образ разделывания тела.
- source_word: עוֹרָם מֵעֲלֵיהֶם
  choice: с них кожу
  rationale: Русский оборот «сдирать с кого-либо кожу» точно и идиоматично передаёт пространственный и насильственный смысл еврейского выражения.
- source_word: וּשְׁאֵרָם מֵעַל עַצְמוֹתָם
  choice: и плоть — с их костей
  rationale: «Плоть» сохраняет анатомический смысл שְׁאֵר в параллели с кожей и костями; тире подчёркивает параллелизм и делает фразу ясной по-русски.
theological_decisions:
- issue: Образ телесного насилия как описание развращённых правителей
  choice: Сохранить буквальную и шокирующую образность кожи, плоти и костей.
  alternative: 'Передать обобщённо: «жестоко угнетающие народ».'
  rationale: Еврейский текст намеренно изображает угнетение как разделывание человеческого тела. Смягчение устранило бы пророческую силу и нравственное напряжение образа.
translation_notes:
  register: Современный литературный русский язык с высоким, но понятным пророческим регистром. Причастия сохраняют связь с обращением в Мих 3:1; графический образ передан без смягчения. Знак конца выбран как восклицательный для силы обвинения, при сохранении синтаксической незавершённости относительно следующего стиха.
