  text: בֹּנֶ֥ה צִיּ֖וֹן בְּ/דָמִ֑ים וִ/ירוּשָׁלִַ֖ם בְּ/עַוְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/010.yaml
  text: who builds Zion with bloodshed and Jerusalem with injustice[a].
translation:
  language: ru
  text: строящие Сион на крови[a] и Иерусалим — на неправде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кровопролитием»; еврейская форма множественного числа может обозначать пролитую кровь, кровопролитие или вину за кровь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּנֶה
  choice: строящие
  rationale: Причастие мужского рода единственного числа по форме согласуется с ближайшим собирательным обращением предыдущего стиха, но по смыслу описывает нескольких вождей; русское множественное число естественно продолжает перечень адресатов в Мих 3:9 и сохраняет причастную конструкцию.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Устоявшаяся русская передача топонима.
- source_word: בְּדָמִים
  choice: на крови
  rationale: Предлог בְ указывает на основание или средство созидания; множественное דָּמִים может означать пролитую кровь, кровопролитие или вину за кровь. Образное «на крови» звучит естественно и сохраняет напряжённую метафору оригинала.
- source_word: וִירוּשָׁלִַם
  choice: и Иерусалим
  rationale: Сохранены союз и устоявшаяся русская форма топонима.
- source_word: בְּעַוְלָה
  choice: на неправде
  rationale: עַוְלָה обозначает неправду, несправедливость, беззаконие; «неправда» сохраняет широкий нравственный и общественно-судебный смысл и образно параллельна выражению «на крови».
theological_decisions:
- issue: Характер обвинения против руководителей города
  choice: Сион и Иерусалим представлены как созидаемые на пролитой крови и неправде, то есть посредством насилия и несправедливости.
  alternative: 'Перевести разъяснительно: «строящие Сион кровопролитием и Иерусалим несправедливостью».'
  rationale: Фраза не говорит буквально об использовании крови как строительного материала, но пророческая метафора намеренно изображает кровь и неправду основанием города. Перевод сохраняет и идиоматический смысл, и силу образа.
translation_notes:
  register: Современный литературный русский с сохранением лаконичного пророческого параллелизма. Тире во второй строке мысленно восполняет «строящие» и делает синтаксис прозрачным без утраты поэтической сжатости.
