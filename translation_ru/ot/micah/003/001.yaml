  variant: modern literary Russian
source:
  edition: WLC
  text: וָ/אֹמַ֗ר שִׁמְעוּ נָא֙ רָאשֵׁ֣י יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֲ/ל֣וֹא לָ/כֶ֔ם לָ/דַ֖עַת אֶת הַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/001.yaml
  text: 'And I said[a], “Hear now, heads of Jacob and rulers of the house of Israel: is it not for you to know justice?”'
translation:
  language: ru
  text: 'И я сказал: «Послушайте же, главы Иакова и правители дома Израиля! Разве не вам надлежит знать правосудие[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «суд». Еврейское мишпа́т может означать суд, правосудие, справедливость или то, что правильно.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: И я сказал
  rationale: Последовательная форма с ו связывает высказывание с предшествующей речью; союз «и» сохраняет эту связь, не усиливая её до строго временного «тогда».
- source_word: שִׁמְעוּ נָא
  choice: Послушайте же
  rationale: Императив שׁמע передан естественным русским «послушайте», а частица נָא — усилительной частицей «же», выражающей настойчивость пророческого призыва.
- source_word: רָאשֵׁי יַעֲקֹב
  choice: главы Иакова
  rationale: «Главы» сохраняет еврейскую метафору руководителей, а «Иаков» — заветное наименование народа.
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  choice: и правители дома Израиля
  rationale: קצין здесь обозначает лиц, наделённых общественной и судебной властью; «правители» естественно передаёт эту роль. Формула «дом Израиля» сохранена.
- source_word: הֲלוֹא לָכֶם
  choice: разве не вам надлежит
  rationale: Риторический вопрос предполагает утвердительный ответ, а конструкция с ל выражает обязанность и надлежащую ответственность адресатов.
- source_word: לָדַעַת
  choice: знать
  rationale: Базовое значение ידע сохранено; в контексте оно включает практическое понимание и исполнение обязанности правителей.
- source_word: הַמִּשְׁפָּט
  choice: правосудие
  rationale: В обращении к правителям слово обозначает справедливый судебный порядок и правильное осуществление власти; «правосудие» сохраняет юридико-нравственный смысл.
theological_decisions:
- issue: Передача מִשְׁפָּט в контексте ответственности правителей
  choice: правосудие
  alternative: суд; справедливость; то, что справедливо
  rationale: «Правосудие» подчёркивает обязанность руководителей знать и осуществлять справедливый суд, не сводя слово к отдельному судебному приговору. Сноска сохраняет более узкую возможную передачу «суд».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Послушайте же» передаёт настойчивость без архаичного «внемлите», а параллелизм «главы Иакова и правители дома Израиля» сохраняет структуру оригинала.
