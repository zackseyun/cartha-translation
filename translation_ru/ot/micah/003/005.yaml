base_translation:
  language: en
  yaml_path: translation/ot/micah/003/005.yaml
  text: Thus says Yahweh concerning the prophets who lead my people astray[a], who bite with their teeth and cry, “Peace,” but against anyone who does not put something into their mouths[d][c][b], they consecrate war.
translation:
  language: ru
  text: 'Так говорит Яхве о пророках, вводящих Мой народ в заблуждение: они кусают зубами и возвещают: «Мир!» — а против того, кто не кладёт им ничего в рот,[a] они освящают войну.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кто не кладёт на их уста». Вероятно, имеется в виду тот, кто не даёт им пищи или вознаграждения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «объявляют ему священную войну». Древнееврейское выражение буквально означает «освящают войну» и использует культовый язык подготовки к войне.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, представленное тетраграмматоном, посредством принятой русской транслитерации.
- source_word: עַל הַנְּבִיאִים
  choice: о пророках
  rationale: Предлог вводит тему пророческого изречения; осуждающий характер ясно выражен дальнейшим текстом.
- source_word: הַמַּתְעִים אֶת עַמִּי
  choice: которые вводят Мой народ в заблуждение
  rationale: Сохраняет каузативное значение причастия Hiphil от תעה и естественно звучит по-русски.
- source_word: הַנֹּשְׁכִים בְּשִׁנֵּיהֶם
  choice: когда им есть что кусать зубами
  rationale: Сохраняет конкретный образ зубов и одновременно показывает условную связь между получаемой пищей или вознаграждением и благоприятным пророчеством.
- source_word: וְקָרְאוּ שָׁלוֹם
  choice: 'они провозглашают: «Мир!»'
  rationale: קרא обозначает публичное возглашение, а שָׁלוֹם здесь выражает обещание мира, благополучия и безопасности.
- source_word: וַאֲשֶׁר לֹא יִתֵּן עַל פִּיהֶם
  choice: а против того, кто ничего не кладёт им в рот
  rationale: Сохранён телесный образ оригинала; «ничего» естественно восполняет подразумеваемый объект и указывает на пищу либо плату без чрезмерного уточнения.
- source_word: וְקִדְּשׁוּ עָלָיו מִלְחָמָה
  choice: они освящают войну
  rationale: Сохраняет необычную культовую лексику קדשׁ и намеренно не сводит выражение к нейтральному «объявляют войну».
theological_decisions:
- issue: Образ обусловленных вознаграждением пророчеств
  choice: Сохранить образы еды, рта и зубов, сделав условную связь ясной синтаксически
  alternative: 'Передать прямо: «когда их кормят или им платят»'
  rationale: Так сохраняется резкая пророческая метафорика и одновременно остаётся открытым, идёт ли речь буквально о пище, о плате или шире — о материальном содержании.
- issue: Культовый оттенок выражения קדשׁ מלחמה
  choice: «освящают войну»
  alternative: «объявляют священную войну» или «готовятся к войне»
  rationale: 'Формальная передача удерживает напряжение оригинала: религиозное действие используется корыстными пророками как подготовка вражды, не уточняя сверх текста характер войны.'
translation_notes:
  register: Современный литературный русский с торжественным пророческим тоном. Конкретные и намеренно резкие образы оригинала сохранены; двоеточие и тире помогают ясно выразить противопоставление между сытыми пророками и их враждебностью к тому, кто им ничего не даёт.
