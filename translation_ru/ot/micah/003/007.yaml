base_translation:
  language: en
  yaml_path: translation/ot/micah/003/007.yaml
  text: The seers will be put to shame[a], and the diviners will be disgraced; all of them will cover their lips, because there is no answer from God.
translation:
  language: ru
  text: Провидцы будут посрамлены, и гадатели — опозорены; все они прикроют губы[a], потому что нет ответа от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «прикроют губу». Возможны также переводы: «прикроют верхнюю губу» или «прикроют усы». Вероятно, речь идёт о жесте стыда, скорби или ритуальной нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֹשׁוּ
  choice: будут посрамлены
  rationale: Глагол בוש обозначает стыд и посрамление; такая формулировка естественно передаёт итог пророческого суда, не сводя смысл лишь к внутреннему чувству стыда.
- source_word: הַחֹזִים
  choice: провидцы
  rationale: חֹזִים — люди, заявляющие о получении видений. «Провидцы» сохраняет краткий специальный термин и уместно в современном литературном русском.
- source_word: וְחָפְרוּ
  choice: опозорены
  rationale: חפר в данном употреблении выражает стыд и унижение. «Опозорены» передаёт публичную сторону позора и создаёт естественный параллелизм с «посрамлены».
- source_word: הַקֹּסְמִים
  choice: гадатели
  rationale: קֹסְמִים обозначает занимающихся гаданием или прорицанием; «гадатели» — прямой и понятный русский эквивалент с сохраняемой отрицательной окраской контекста.
- source_word: וְעָטוּ עַל שָׂפָם
  choice: прикроют верхнюю губу
  rationale: Фраза буквально изображает закрывание области губы или усов. Перевод сохраняет телесный жест, не определяя однозначно, означает ли он стыд, скорбь или ритуальную нечистоту.
- source_word: כֻּלָּם
  choice: все они
  rationale: Местоименный суффикс усиливает всеобщность; «все они» сохраняет это ударение.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину их посрамления; «потому что» ясно передаёт причинную связь.
- source_word: אֵין מַעֲנֵה אֱלֹהִים
  choice: нет ответа от Бога
  rationale: Именная конструкция означает отсутствие ответа, исходящего от Бога. Перевод сохраняет её сдержанность и не добавляет пояснения о характере ожидаемого откровения.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: Несмотря на формально множественную форму, в данном контексте слово имеет единственное значение и указывает на Бога.
theological_decisions:
- issue: Передавать ли заключительную фразу как молчание Бога или как отсутствие подлинного пророчества
  choice: нет ответа от Бога
  alternative: Бог не отвечает; нет Божьего ответа
  rationale: 'Номинальная формулировка близка к еврейскому тексту и сохраняет смысловую напряжённость: ответ не приходит от Бога, но перевод не уточняет сверх текста, идёт ли речь о намеренном молчании или об отсутствии подлинного откровения.'
translation_notes:
  register: Современный литературный русский с торжественной, но понятной пророческой интонацией. Параллелизм двух первых частей сохранён; неоднозначный древний жест оставлен в основном тексте и пояснён в сноске.
