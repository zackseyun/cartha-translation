  text: שִׁמְעוּ נָ֣א זֹ֗את רָאשֵׁי֙ בֵּ֣ית יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הַֽ/מֲתַעֲבִ֣ים מִשְׁפָּ֔ט וְ/אֵ֥ת כָּל הַ/יְשָׁרָ֖ה יְעַקֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/009.yaml
  text: 'Hear this[a], please, heads of the house of Jacob and rulers of the house of Israel[b], who detest justice and make crooked all that is straight:'
translation:
  language: ru
  text: Послушайте же это, главы дома Иакова и правители дома Израиля, ненавидящие правосудие и искривляющие всё прямое:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «извращающие всё правильное». Буквально в еврейском тексте: «искривляющие всё прямое» — сохранён образный контраст между прямым и кривым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא זֹאת
  choice: Послушайте же это
  rationale: «Послушайте» естественно передаёт повелительное שִׁמְעוּ во множественном числе, а частица «же» выражает настойчивость נָא, не сводя её ни только к просьбе, ни только ко времени.
- source_word: רָאשֵׁי בֵּית יַעֲקֹב
  choice: главы дома Иакова
  rationale: «Главы» сохраняет метафору רָאשֵׁי и хорошо соответствует обозначению руководителей; «дом Иакова» передаёт повторённое בֵּית и сохраняет корпоративный смысл.
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  choice: и правители дома Израиля
  rationale: «Правители» передаёт קְצִינֵי в общественно-судебном контексте и сохраняет параллелизм с «главами».
- source_word: הַמֲתַעֲבִים מִשְׁפָּט
  choice: ненавидящие правосудие
  rationale: Причастная конструкция сохранена. «Ненавидящие» естественно и сильно передаёт отношение, выраженное תעב; «правосудие» подчёркивает судебно-общественный смысл מִשְׁפָּט в обращении к правителям.
- source_word: וְאֵת כָּל הַיְשָׁרָה יְעַקֵּשׁוּ
  choice: и искривляющие всё прямое
  rationale: Парные слова «прямое — искривляющие» сохраняют конкретную метафору и словесное противопоставление еврейского текста, не заменяя его абстрактным толкованием вроде «извращающие всё правильное».
theological_decisions:
- issue: Обозначения народа завета
  choice: дом Иакова ... дом Израиля
  alternative: народ Иакова ... народ Израиля
  rationale: Оба случая בֵּית переданы буквально и параллельно. Это сохраняет корпоративный смысл и не добавляет отсутствующего в тексте пояснения.
- issue: Смысл מִשְׁפָּט
  choice: правосудие
  alternative: суд; справедливость
  rationale: Контекст обличения руководителей указывает прежде всего на отправление справедливого суда. «Правосудие» сохраняет эту институциональную направленность, не исключая более широкого нравственного смысла.
- issue: Образ прямого и кривого
  choice: искривляющие всё прямое
  alternative: извращающие всё правильное
  rationale: Выбран образный перевод, сохраняющий намеренное противопоставление ישר и עקשׁ, без богословского или нравственного разъяснения сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обличения. Синтаксический параллелизм и образ «прямого/кривого» сохранены; двоеточие показывает продолжение речи в следующем стихе.
