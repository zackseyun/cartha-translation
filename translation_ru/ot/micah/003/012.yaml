  terminology: «Сион» и «Иерусалим» переданы нормативно. Буквальное «гора Дома» допустимо как сохранение храмовой идиомы при поясняющей сноске; прописная буква уместна. «Лесистые высоты» сохраняет топографическую, а не обязательно культовую, неоднозначность.
