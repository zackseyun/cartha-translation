base_translation:
  language: en
  yaml_path: translation/ot/micah/003/012.yaml
  text: Therefore[a], because of you, Zion will be plowed like a field, and Jerusalem will become ruins[b], and the mountain of the house will become wooded heights.
translation:
  language: ru
  text: Поэтому из-за вас Сион будет вспахан, как поле; Иерусалим превратится в груды развалин, а гора Дома[a] станет лесистыми высотами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Храмовая гора» или «гора Храма». Буквально: «гора Дома».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лесные высоты», «высоты леса» или «возвышенности в лесу». Вероятно, еврейское выражение рисует Храмовую гору одичавшей и заросшей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и наступающее вследствие грехов правителей пророческое наказание.
- source_word: בִּגְלַלְכֶם
  choice: из-за вас
  rationale: Прямо возлагает вину на тех, к кому обращён пророк, и естественно передаёт причинное значение.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Устоявшаяся русская форма топонима.
- source_word: שָׂדֶה תֵחָרֵשׁ
  choice: будет вспахан, как поле
  rationale: Сохраняет страдательное значение глагола и образ города, обращённого в пахотную землю.
- source_word: וִירוּשָׁלִַם עִיִּין תִּהְיֶה
  choice: Иерусалим превратится в груды развалин
  rationale: עִיִּין обозначает развалины или груды обломков; «превратится» ясно выражает подразумеваемое изменение состояния.
- source_word: וְהַר הַבַּיִת
  choice: а гора Дома
  rationale: Сохраняет буквальное выражение «гора Дома», где «Дом» обозначает Храм, не устраняя образность исходного текста.
- source_word: לְבָמוֹת יָעַר
  choice: в поросшие лесом холмы
  rationale: Естественно передаёт картину некогда священной горы, ставшей дикой, заросшей местностью; множественное число соответствует בָּמוֹת.
theological_decisions:
- issue: Следует ли прямо назвать הַבַּיִת Храмом в основном тексте
  choice: Сохранить выражение «гора Дома»
  alternative: «Храмовая гора» или «гора Храма»
  rationale: В еврейском тексте стоит «Дом» — обычное обозначение Храма. Буквальная формулировка сохраняет пророческую лексику, а ясные толкования приведены в сноске.
- issue: Имеет ли לְבָמוֹת культовый смысл «высоты» или описывает запустение
  choice: Передать как «поросшие лесом холмы»
  alternative: «лесные высоты», «высоты леса» или «возвышенности в лесу»
  rationale: Слово יָעַר («лес») в данном контексте указывает прежде всего на одичание и зарастание Храмовой горы, а не на устройство культовых святилищ. Лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Краткая трёхчастная структура приговора сохранена; формулировки понятны без конфессиональной терминологии.
