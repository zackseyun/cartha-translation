base_translation:
  language: en
  yaml_path: translation/ot/micah/003/004.yaml
  text: Then they will cry out to Yahweh[a], but he will not answer them; he will hide his face from them at that time, because they made their deeds evil.
translation:
  language: ru
  text: Тогда они воззовут к ГОСПОДУ, но Он не ответит им; в то время Он скроет от них Своё лицо, потому что они творили зло в своих делах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что они поступали нечестиво».'
    reason: 'Лексико-синтаксическая альтернатива для כַּאֲשֶׁר הֵרֵעוּ מַעַלְלֵיהֶם: выражение можно передать более идиоматично и обобщённо, без отдельного воспроизведения существительного «дела».'
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временное следствие предшествующего обличения и сохраняет направленность пророчества к грядущему суду.
- source_word: יִזְעֲקוּ
  choice: воззовут
  rationale: Глагол обозначает настойчивый крик о помощи в бедствии; «воззовут» сохраняет силу выражения и уместно в современном литературном библейском регистре.
- source_word: אֶל יְהוָה
  choice: к ГОСПОДУ
  rationale: Предлог передан направительным «к», а имя יהוה — традиционным русским эквивалентом «ГОСПОДЬ».
- source_word: וְלֹא יַעֲנֶה אוֹתָם
  choice: но Он не ответит им
  rationale: 'Союз ו в контексте имеет противительное значение: они будут звать, однако ответа не получат. Русское управление «ответить им» естественно передаёт конструкцию.'
- source_word: וְיַסְתֵּר פָּנָיו מֵהֶם
  choice: Он скроет от них Своё лицо
  rationale: Сохранён образный библейский оборот о Божьем отказе благосклонно внимать людям; он не заменён разъясняющим пересказом.
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Естественная русская временная формула, точно указывающая на время суда.
- source_word: כַּאֲשֶׁר
  choice: потому что
  rationale: В данном контексте частица вводит основание Божьего суда, поэтому причинное значение предпочтительнее сравнительного «как».
- source_word: הֵרֵעוּ מַעַלְלֵיהֶם
  choice: они творили зло своими делами
  rationale: Формулировка сохраняет активную виновность действующих лиц и явное упоминание их дел, но избегает неестественного по-русски буквального выражения «сделали свои дела злыми».
theological_decisions:
- issue: Антропоморфный образ Божьего сокрытия лица
  choice: 'Сохранить: «Он скроет от них Своё лицо»'
  alternative: «Он отвернётся от них» / «Он лишит их Своего благоволения»
  rationale: Исходный текст использует значимый образ Божьего удаления и отказа отвечать. Его сохранение передаёт богословскую напряжённость текста, не сводя образ к одному истолкованию.
- issue: Причина суда и нравственная ответственность
  choice: «потому что они творили зло своими делами»
  alternative: «потому что они поступали нечестиво»
  rationale: Основной текст сохраняет и активный смысл глагола, и существительное «дела», подчёркивая виновность людей; более обобщённое прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, оформлены с прописной буквы; образ «скрыть лицо» сохранён как понятная и значимая метафора. Синтаксис остаётся ясным для широкого читателя.
