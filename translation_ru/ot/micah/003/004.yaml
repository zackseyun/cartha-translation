  terminology: «ГОСПОДУ» последовательно передаёт יהוה в принятом библейском регистре. «Воззовут» и «скроет от них Своё лицо» точны и стилистически уместны. Сноска с маркером [a] остаётся привязанной к спорной/альтернативно передаваемой заключительной клаузе.
