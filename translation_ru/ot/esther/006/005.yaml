base_translation:
  language: en
  yaml_path: translation/ot/esther/006/005.yaml
  text: The king’s attendants said to him[a], “Look, Haman is standing in the court.” And the king said, “Let him come in.”
translation:
  language: ru
  text: 'Царские слуги сказали ему: «Вот Аман стоит во дворе». И царь сказал: «Пусть войдёт».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: царские слуги
  rationale: В обстановке царского дворца נַעַר обозначает служителя или приближённого; «слуги» естественно передаёт их функцию, не акцентируя возраст.
- source_word: הִנֵּה
  choice: вот
  rationale: «Вот» естественно привлекает внимание к присутствию Амана и сохраняет непосредственность еврейского הִנֵּה.
- source_word: עֹמֵד
  choice: стоит
  rationale: Причастие описывает продолжающееся в данный момент положение Амана; «стоит» передаёт это прямо, без добавления толкования «ждёт».
- source_word: בֶּחָצֵר
  choice: во дворе
  rationale: חָצֵר здесь означает двор дворцового комплекса; русское «во дворе» ясно и естественно передаёт пространственное значение.
- source_word: יָבֹא
  choice: пусть войдёт
  rationale: Форма выражает приказ или дозволение царя; «пусть войдёт» сохраняет побудительную силу и подразумеваемое вхождение к царю.
- source_word: הָמָן
  choice: Аман
  rationale: Использована традиционная русская библейская форма имени.
theological_decisions: []
