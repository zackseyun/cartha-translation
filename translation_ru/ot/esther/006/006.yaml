base_translation:
  language: en
  yaml_path: translation/ot/esther/006/006.yaml
  text: So Haman came in[a], and the king said to him, “What should be done for the man whom the king delights to honor?” And Haman said in his heart, “Whom would the king delight to honor more than me?”
translation:
  language: ru
  text: 'И вошёл Аман. Царь сказал ему: «Что следует сделать для человека, которого царь желает почтить?» Аман подумал про себя[a]: «Кого же царь пожелает почтить больше, чем меня?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сказал в своём сердце».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא הָמָן
  choice: И вошёл Аман
  rationale: Форма wayyiqtol продолжает повествование; «вошёл» естественно передаёт появление Амана перед царём.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: Царь сказал ему
  rationale: Сохранено основное значение אָמַר — «сказать», хотя далее следует вопрос.
- source_word: מַה לַעֲשׂוֹת בָּאִישׁ
  choice: Что следует сделать для человека
  rationale: Инфинитивная конструкция выражает надлежащее действие, а בָּאִישׁ в данном контексте естественно передаётся как «для человека».
- source_word: אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: которого царь желает почтить
  rationale: חָפֵץ выражает желание или расположение, а יְקָר здесь обозначает оказываемую честь; русская конструкция передаёт смысл естественно и без избыточной буквальности.
- source_word: וַיֹּאמֶר הָמָן בְּלִבּוֹ
  choice: Аман подумал про себя[a]
  rationale: Еврейская идиома буквально описывает внутреннюю речь как слова «в сердце»; по-русски её естественный смысл передаёт «подумал про себя», а буквальный образ отмечен в сноске.
- source_word: לְמִי יַחְפֹּץ הַמֶּלֶךְ לַעֲשׂוֹת יְקָר
  choice: Кого же царь пожелает почтить
  rationale: Повтор глагола «желать» сохраняет связь с предыдущим חָפֵץ, а «почтить» точно и кратко передаёт לַעֲשׂוֹת יְקָר.
- source_word: יוֹתֵר מִמֶּנִּי
  choice: больше, чем меня
  rationale: Естественная современная русская сравнительная конструкция, ясно передающая самоуверенность Амана.
