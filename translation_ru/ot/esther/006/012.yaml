lexical_decisions:
- source_word: וַיָּשָׁב
  choice: вернулся
  rationale: Глагол שׁוּב в последовательной повествовательной форме обозначает возвращение к прежнему месту; «вернулся» естественно передаёт это значение.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: к царским воротам
  rationale: Сопряжённая конструкция обозначает ворота царского дворцового комплекса. Множественное «ворота» идиоматично в современном русском.
- source_word: נִדְחַף
  choice: поспешил
  rationale: Нифаль от דחף может передавать движение под напором или понуждением. В контексте «поспешил» естественно выражает стремительное удаление Амана, тогда как пассивный оттенок сохранён в примечании.
- source_word: בֵּיתוֹ
  choice: к себе домой
  rationale: Контекст движения к собственному дому естественно передаётся по-русски выражением «к себе домой».
- source_word: אָבֵל
  choice: скорбя
  rationale: Прилагательное описывает состояние скорби и подавленности Амана; деепричастие кратко и естественно передаёт сопутствующее состояние.
- source_word: חֲפוּי רֹאשׁ
  choice: закрыв голову
  rationale: Сохранён конкретный древнееврейский образ покрытия головы как внешнего выражения скорби и унижения без замены его толкованием.
