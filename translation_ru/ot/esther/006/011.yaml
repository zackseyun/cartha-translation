base_translation:
  language: en
  yaml_path: translation/ot/esther/006/011.yaml
  text: So Haman took the robe and the horse[a], clothed Mordecai, led him on horseback through the city square, and proclaimed before him, “Thus shall it be done for the man whom the king delights to honor.”
translation:
  language: ru
  text: 'И взял Аман царское одеяние и коня, облёк Мардохея и устроил, чтобы тот проехал верхом по городской площади[a], и возгласил перед ним: «Так поступают с человеком, которого царь желает почтить!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дал ему ехать верхом по городской площади». Еврейский глагол имеет каузативную форму: Аман сделал так, чтобы Мардохей ехал верхом в публичном шествии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּבוּשׁ
  choice: царское одеяние
  rationale: Определённое существительное отсылает к упомянутому выше царскому одеянию; слово «царское» восполняет ясную контекстуальную связь, а «одеяние» сохраняет достоинство регистра.
- source_word: הַסּוּס
  choice: коня
  rationale: Еврейский текст говорит буквально «коня» с артиклем; царская принадлежность уже ясна из ближайшего контекста и не повторяется.
- source_word: וַיַּלְבֵּשׁ אֶת מָרְדֳּכָי
  choice: облёк Мардохея
  rationale: Каузатив породы hифиль означает, что Аман одел Мардохея в названное одеяние; «облёк» точно и уместно для литературного повествования.
- source_word: וַיַּרְכִּיבֵהוּ
  choice: провёз его верхом
  rationale: Каузатив от רכב означает «велел/дал ему ехать верхом». Формулировка передаёт и верховую езду Мардохея, и роль Амана в публичном шествии, не добавляя отдельного действия «посадил».
- source_word: בִּרְחוֹב הָעִיר
  choice: по городской площади
  rationale: רְחוֹב обозначает широкое открытое общественное пространство, обычно площадь, а не обычную улицу.
- source_word: וַיִּקְרָא לְפָנָיו
  choice: провозглашая перед ним
  rationale: Глагол обозначает публичное возглашение, а «перед ним» сохраняет пространственную формулировку оригинала без лишнего уточнения положения Амана.
- source_word: כָּכָה יֵעָשֶׂה
  choice: Так поступают
  rationale: Настоящее время в русском естественно выражает установленную формулу или обычай, сохраняя безлично-пассивную направленность еврейского выражения.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: желает почтить
  rationale: חפץ может выражать желание или благоволение, а יקר здесь относится к оказываемой чести; выбранная формулировка ясна и не усиливает эмоциональный оттенок сверх необходимого.
