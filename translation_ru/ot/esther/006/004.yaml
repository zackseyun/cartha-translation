    rationale: Еврейское לַחֲצַר обозначает приход во/к внешнему двору; по-русски при вхождении в пространство необходимо «во внешний двор», а не «на внешний двор».
  - severity: low
    issue: «Попросить царя повесить Мардохея» способно приписать царю личное совершение казни.
    rationale: Оригинал выражает цель сказать царю о казни Мардохея, а контекст предполагает царское распоряжение. «Попросить царя распорядиться повесить» устраняет неестественную агентную двусмысленность.
