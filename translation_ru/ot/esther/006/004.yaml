  text: And the king said[a], “Who is in the court?” Now Haman had come into the outer court of the king’s palace to speak to the king about hanging Mordecai on the gallows that he had prepared for him.
translation:
  language: ru
  text: 'И царь спросил: «Кто во дворе?» Аман же пришёл во внешний двор царского дворца, чтобы попросить царя распорядиться повесить Мардохея на деревянном сооружении[a], которое он приготовил для него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на дереве» или «на деревянном столбе». Еврейское עֵץ может обозначать дерево, древесину либо сделанное из дерева орудие казни; его точная конструкция здесь не описана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶחָצֵר / לַחֲצַר
  choice: во дворе / на внешний двор
  rationale: חָצֵר обозначает огороженный двор; по-русски естественно «двор». Во втором случае הַחִיצוֹנָה уточняет, что это внешний двор дворца.
- source_word: וְהָמָן בָּא
  choice: А Аман как раз пришёл
  rationale: Фраза вводит фоновое обстоятельство к вопросу царя; «как раз» естественно передаёт совпадение событий, не превращая его в явно выраженную причинную связь.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царского дворца
  rationale: Буквально «дома царя», но в данном царском контексте בַּיִת означает дворец; родительная конструкция естественна по-русски.
- source_word: לֵאמֹר לַמֶּלֶךְ
  choice: чтобы попросить царя
  rationale: В контексте Аман намерен обратиться к царю с просьбой о казни. «Попросить» естественно связывает цель прихода с последующим инфинитивом, не добавляя содержания самой просьбы.
- source_word: לִתְלוֹת
  choice: повесить
  rationale: Глагол תלה означает подвесить или повесить. Такой перевод сохраняет способ казни на уровне, выраженном глаголом, тогда как точная форма сооружения остаётся неуточнённой.
- source_word: הָעֵץ
  choice: деревянном сооружении
  rationale: עֵץ буквально означает «дерево» или «древесина» и здесь обозначает приготовленное орудие казни. «Деревянное сооружение» сохраняет материальный смысл и не навязывает современную конструкцию виселицы.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: которое он приготовил для него
  rationale: Мужской референт местоимения по контексту — Мардохей. Формулировка сохраняет местоименную связь оригинала без избыточного повторения имени.
