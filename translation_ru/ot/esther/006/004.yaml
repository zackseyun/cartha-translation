translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и умеренно высоким библейским регистром. Сохранён начальный союз «И», характерный для последовательности еврейского повествования. Формулировка избегает как архаичного «древо», так и чрезмерно конкретного «виселица».
