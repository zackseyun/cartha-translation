  yaml_path: translation/ot/esther/006/008.yaml
  text: Let them bring a royal robe that the king has worn[a], and a horse on which the king has ridden, and on whose head a royal crown has been placed.
translation:
  language: ru
  text: Пусть принесут царское одеяние, которое носил царь, и коня, на котором ездил царь и на голову которого возложен царский венец.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и на голову которого возложен царский венец». Местоимение естественнее всего относится к коню, хотя некоторые понимают его как указание на царя.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָבִיאוּ
  choice: Пусть принесут
  rationale: Форма породы хифиль, имперфект 3-го лица множественного числа, в прямой речи передаёт распоряжение; эта конструкция естественно выражает побудительное значение по-русски.
- source_word: לְבוּשׁ מַלְכוּת
  choice: царское одеяние
  rationale: Сопряжённая конструкция обозначает одежду, связанную с царским достоинством. «Одеяние» звучит достойно и указывает на особую торжественную одежду, не сужая значение до конкретного покроя.
- source_word: אֲשֶׁר לָבַשׁ בּוֹ הַמֶּלֶךְ
  choice: которое носил царь
  rationale: Относительное предложение сообщает, что царь действительно носил это одеяние. Буквальное «в котором одевался» неестественно; русский глагол «носил» точно передаёт смысл.
- source_word: וְסוּס
  choice: и коня
  rationale: Существительное вводит второй предмет распоряжения. В русском после «принесут» естествен винительный падеж; выбор «коня» уместен для верхового животного и сохраняет неопределённость еврейского текста.
- source_word: אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ
  choice: на котором ездил царь
  rationale: Передаёт предлог עַל и характеризует коня как того, на котором ездил сам царь.
- source_word: וַאֲשֶׁר נִתַּן
  choice: и ... которого возложен
  rationale: Пассивная форма נִתַּן вместе с בְּרֹאשׁוֹ описывает венец как помещённый на голову. «Возложен» естественно сочетается с венцом и сохраняет пассивную конструкцию.
- source_word: כֶּתֶר מַלְכוּת
  choice: царский венец
  rationale: Сочетание обозначает венец царского достоинства. «Венец» соответствует торжественному регистру и не вносит лишней определённости артиклем, которого в еврейском нет.
- source_word: בְּרֹאשׁוֹ
  choice: на голову которого
  rationale: Ближайшим и наиболее естественным референтом местоименного суффикса мужского рода является конь. Относительная конструкция по-русски ясно передаёт эту связь.
