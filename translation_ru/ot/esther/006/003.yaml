base_translation:
  language: en
  yaml_path: translation/ot/esther/006/003.yaml
  text: Then the king said[a], “What honor and greatness has been bestowed on Mordecai for this?” The king’s young men who attended him said, “Nothing has been done for him.”
translation:
  language: ru
  text: 'Тогда царь спросил: «Какие почести и какое возвышение были оказаны Мардохею за это?» Юноши, служившие царю, ответили: «Для него ничего не сделали».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה נַּעֲשָׂה
  choice: какие ... были оказаны
  rationale: Пассивная форма глагола עשה спрашивает о совершённом действии; в сочетании с «почестями» по-русски естественно сказать «были оказаны».
- source_word: יְקָר
  choice: почести
  rationale: В придворном контексте слово обозначает честь, публично оказанную человеку; множественное «почести» естественно сочетается с глаголом «оказать».
- source_word: וּגְדוּלָּה
  choice: отличие
  rationale: В паре с יְקָר обозначает возвышение или особое признание. «Отличие» сохраняет идею выделения и почётного статуса, не сводя её к должностному повышению.
- source_word: לְמָרְדֳּכַי
  choice: Мардохею
  rationale: Предлог לְ отмечает адресата или получателя оказанных почестей; русский дательный падеж передаёт это прямо.
- source_word: עַל זֶה
  choice: за это
  rationale: Выражение указывает на основание награды — поступок Мардохея, упомянутый ранее.
- source_word: נַעֲרֵי הַמֶּלֶךְ מְשָׁרְתָיו
  choice: служившие царю юноши
  rationale: «Юноши» сохраняет буквальное значение נַעֲרֵי, а причастный оборот «служившие царю» передаёт מְשָׁרְתָיו и придворную функцию этих людей.
- source_word: לֹא נַעֲשָׂה עִמּוֹ דָּבָר
  choice: Для него ничего не было сделано
  rationale: 'Русская формулировка сохраняет отрицательную пассивную конструкцию и передаёт смысл: никаких действий в его пользу не предприняли.'
