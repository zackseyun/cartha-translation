  text: While they were still speaking with him[b][a], the king’s eunuchs arrived and hurried to bring Haman to the banquet that Esther had prepared.
translation:
  language: ru
  text: Пока они ещё говорили с ним, прибыли царские евнухи[a] и поспешили[b] привести Амана на пир, устроенный Есфирью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царские придворные»; еврейское слово может обозначать не только евнухов, но и придворных служителей.'
