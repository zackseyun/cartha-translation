  - marker: b
    text: 'Или: «быстро доставили Амана»; еврейский глагол подчёркивает срочность и поспешность действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדָם מְדַבְּרִים
  choice: пока они ещё говорили
  rationale: Сочетание наречия с причастием обозначает продолжающееся, ещё не завершившееся действие; русская конструкция естественно передаёт одновременность событий.
- source_word: עִמּוֹ
  choice: с ним
  rationale: Предлог עם буквально выражает совместность; «говорили с ним» точно и естественно передаёт еврейскую конструкцию.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: царские евнухи
  rationale: Слово סָרִיס может обозначать как евнуха, так и придворного служителя. Основное значение сохранено в тексте, а более широкое дано в сноске.
- source_word: הִגִּיעוּ
  choice: прибыли
  rationale: Глагол обозначает прибытие к месту действия; «прибыли» соответствует повествовательному и придворному контексту.
- source_word: וַיַּבְהִלוּ לְהָבִיא
  choice: поспешили отвести
  rationale: Конструкция передаёт срочность действий, направленных на доставление Амана к месту пира. «Отвести» естественно с точки зрения исходного места, где находился Аман, и не добавляет идеи насилия.
- source_word: הַמִּשְׁתֶּה
  choice: пир
  rationale: מִשְׁתֶּה обозначает праздничное застолье, нередко с вином; «пир» кратко и уместно звучит в данном повествовательном контексте.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: устроенный Есфирью
  rationale: Буквально «который сделала Есфирь»; по-русски пир обычно «устраивают», поэтому причастный оборот сохраняет смысл и даёт естественную формулировку.
