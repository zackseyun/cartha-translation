base_translation:
  language: en
  yaml_path: translation/ot/esther/006/001.yaml
  text: On that night the king could not sleep[a], so he ordered the book of records, the chronicles, to be brought[b], and they were read before the king.
translation:
  language: ru
  text: В ту ночь царь не мог уснуть[a], и он велел принести книгу памятных записей — летопись[b]. Её читали перед царём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сон царя удалился (или бежал)».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «книгу воспоминаний, анналы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: В ту ночь
  rationale: Естественная русская временная формула, сохраняющая указание на конкретную ночь в повествовании.
- source_word: נָדְדָה שְׁנַת הַמֶּלֶךְ
  choice: сон бежал от царя
  rationale: Сохраняет выразительную персонификацию еврейского текста и при этом понятно означает, что царь не мог уснуть.
- source_word: וַיֹּאמֶר לְהָבִיא
  choice: и он велел принести
  rationale: Глагол буквально означает «сказал», но здесь вводит распоряжение; «велел принести» естественно передаёт речевой акт и инфинитив.
- source_word: סֵפֶר הַזִּכְרֹנוֹת דִּבְרֵי הַיָּמִים
  choice: памятную книгу — летопись
  rationale: «Памятная книга» передаёт назначение записей для сохранения в памяти, а «летопись» естественно выражает поясняющее דִּבְרֵי הַיָּמִים как царские анналы.
- source_word: וַיִּהְיוּ נִקְרָאִים
  choice: Её читали
  rationale: Русская неопределённо-личная конструкция естественно передаёт пассивное продолженное действие; местоимение согласовано с ближайшим цельным обозначением документа — «летопись».
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: перед царём
  rationale: Формально и естественно передаёт чтение в присутствии царя, не добавляя прямо не выраженного «вслух».
