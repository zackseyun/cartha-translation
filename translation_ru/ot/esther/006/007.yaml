  yaml_path: translation/ot/esther/006/007.yaml
  text: And Haman said to the king[a], “For the man whom the king delights to honor—”
translation:
  language: ru
  text: 'И сказал Аман царю: «Для человека, которого царь желает почтить…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; обычная русская библейская повествовательная формула передаёт это естественно и без лишнего толкования.
- source_word: הָמָן
  choice: Аман
  rationale: Традиционная и общепринятая русская передача имени.
- source_word: אֶל־הַמֶּלֶךְ
  choice: царю
  rationale: Русский дательный падеж естественно передаёт адресата речи; определённость титула ясна из контекста.
- source_word: אִישׁ אֲשֶׁר
  choice: для человека, которого
  rationale: אִישׁ обозначает человека мужского пола, но в данной придворной формуле русское «человек» звучит естественнее, чем подчёркнутое «мужчина». Предлог «для» позволяет связать незавершённое начало ответа с продолжением в следующем стихе. Отсутствие артиклей в русском сохраняет возможную неопределённость еврейского выражения.
- source_word: חָפֵץ
  choice: желает
  rationale: Глагол выражает желание, расположение или удовольствие. В сочетании с оказанием чести «желает» естественно передаёт смысл, не сводя его к простому приказу.
- source_word: בִּיקָרוֹ
  choice: почтить
  rationale: Существительное יְקָר с местоименным суффиксом означает честь или почёт, оказываемые этому человеку. Русская глагольная передача «почтить» точно и естественно выражает придворный смысл оборота.
