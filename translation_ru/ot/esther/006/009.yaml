  text: וְ/נָת֨וֹן הַ/לְּב֜וּשׁ וְ/הַ/סּ֗וּס עַל יַד אִ֞ישׁ מִ/שָּׂרֵ֤י הַ/מֶּ֨לֶךְ֙ הַֽ/פַּרְתְּמִ֔ים וְ/הִלְבִּ֨ישׁוּ֙ אֶת הָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֣ץ בִּֽ/יקָר֑/וֹ וְ/הִרְכִּיבֻ֤/הוּ עַל הַ/סּוּס֙ בִּ/רְח֣וֹב הָ/עִ֔יר וְ/קָרְא֣וּ לְ/פָנָ֔י/ו כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/009.yaml
  text: And let the robe and the horse be entrusted to the hand of one of the king’s noble officials, and let them clothe the man whom the king delights to honor, and let them mount him on the horse through the open square of the city, and proclaim before him, ‘Thus shall it be done for the man whom the king delights to honor.’
translation:
  language: ru
  text: 'Пусть одежду и коня передадут одному из знатных сановников царя, пусть облекут в эту одежду человека, которому царь желает оказать почесть, посадят его на коня и провезут по городской площади, возглашая перед ним: «Так поступают с человеком, которому царь желает оказать почесть!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפַּרְתְּמִים
  choice: знатных сановников
  rationale: Редкое обозначение высокопоставленных вельмож или сановников; сочетание передаёт и высокий ранг, и служебное положение без избыточного «самых знатных».
- source_word: חָפֵץ בִּיקָרוֹ
  choice: желает оказать почесть
  rationale: Передаёт желание царя почтить человека; не превращает выражение в утверждение об эмоциональном удовольствии.
- source_word: וְהִרְכִּיבֻהוּ
  choice: посадят его на коня и провезут
  rationale: Глагол каузативно означает посадить верхом/дать ехать; в данном контексте публичного шествия естественное русское «провезут» выражает последующее движение, не подразумевая, что человека ведут пешком.
- source_word: בִּרְחוֹב הָעִיר
  choice: по городской площади
  rationale: רְחוֹב в городской среде обозначает широкое открытое общественное пространство, площадь, а не просто современную улицу.
- source_word: וְקָרְאוּ לְפָנָיו
  choice: возглашая перед ним
  rationale: Сохраняет публичное провозглашение впереди чествуемого во время шествия.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Повелительно-пожелательная последовательность еврейского текста передана повтором «пусть» и далее однородными сказуемыми; формула чествования повторена буквально для сохранения риторического эффекта.
