  text: And it was found written that Mordecai had reported concerning Bigthana and Teresh[a], two of the king’s eunuchs, among those who guarded the threshold[b], who had sought to lay a hand on King Ahasuerus.
translation:
  language: ru
  text: И нашли запись о том, что Мардохей донёс о Бигтане и Тереше[a], двух царских евнухах[b] из числа стражей порога, которые замышляли поднять руку на царя Ахашвероша.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В этом стихе еврейский текст даёт форму имени «Бигтана»; в других местах встречается форма «Бигтан».
    reason: alternative_reading
  - marker: b
    text: 'Или: «царских придворных». Еврейское слово может обозначать как евнухов, так и царских служителей в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא כָתוּב
  choice: нашли запись
  rationale: 'Естественно передаёт безлично-пассивный смысл еврейского оборота: сведения были обнаружены в письменной летописи, без уточнения действующего лица.'
- source_word: הִגִּיד
  choice: донёс
  rationale: В придворном контексте глагол означает официальное сообщение о заговоре; «донёс» здесь передаёт сообщение властям без добавления неодобрительной оценки.
- source_word: עַל
  choice: о
  rationale: Предлог вводит предмет сообщения Мардохея; нейтральное «о» не усиливает значение до «против».
- source_word: בִּגְתָנָא וָתֶרֶשׁ
  choice: Бигфане и Фереше
  rationale: Передаёт формы имён данного стиха в привычной для русской библейской традиции фонетике; отличие формы имени Бигфаны в других местах отмечено в сноске.
- source_word: שְׁנֵי סָרִיסֵי הַמֶּלֶךְ
  choice: двух царских евнухах
  rationale: Основное конкретное значение סָרִיס в обстановке царского двора — «евнух»; более широкое значение «придворный служитель» сохранено в сноске.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: из числа стражей порога
  rationale: «Из числа» передаёт партитивный предлог מִן, а «стражи порога» сохраняет конкретный образ סַף и обозначает охрану царского входа.
- source_word: בִּקְשׁוּ לִשְׁלֹחַ יָד
  choice: замышляли поднять руку
  rationale: «Замышляли» естественно выражает намерение в контексте заговора, не утверждая, что нападение состоялось; «поднять руку на» сохраняет еврейский образ в понятной русской идиоме.
- source_word: בַּמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: на царя Ахашвероша
  rationale: Управление обусловлено русской идиомой «поднять руку на»; имя передано непосредственно с еврейской формы, а титул сохранён.
