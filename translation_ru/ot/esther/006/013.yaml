  text: וַ/יְסַפֵּ֨ר הָמָ֜ן לְ/זֶ֤רֶשׁ אִשְׁתּ/וֹ֙ וּ/לְ/כָל אֹ֣הֲבָ֔י/ו אֵ֖ת כָּל אֲשֶׁ֣ר קָרָ֑/הוּ וַ/יֹּ֩אמְרוּ֩ ל֨/וֹ חֲכָמָ֜י/ו וְ/זֶ֣רֶשׁ אִשְׁתּ֗/וֹ אִ֣ם מִ/זֶּ֣רַע הַ/יְּהוּדִ֡ים מָרְדֳּכַ֞י אֲשֶׁר֩ הַחִלּ֨וֹתָ לִ/נְפֹּ֤ל לְ/פָנָי/ו֙ לֹא תוּכַ֣ל ל֔/וֹ כִּֽי נָפ֥וֹל תִּפּ֖וֹל לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/013.yaml
  text: Then Haman told Zeresh his wife and all his friends everything that had happened to him. Then his wise men and Zeresh his wife said to him[a], “If Mordecai, before whom you have begun to fall, is from the seed of the Jews, you will not prevail against him, for you will surely fall before him.”
translation:
  language: ru
  text: 'И рассказал Аман своей жене Зереш и всем своим друзьям обо всём, что с ним произошло. Тогда его мудрецы и его жена Зереш сказали ему: «Если Мардохей, перед которым ты начал падать, из рода иудеев[a], то тебе его не одолеть — ты непременно падёшь перед ним».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из семени иудеев»; то есть иудейского происхождения.'
    reason: Сохраняет буквальный образ זֶרַע и поясняет его значение в данном контексте.
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: рассказал
  rationale: Глагол ספר в повествовательной форме обозначает изложение случившегося; «рассказал» естественно звучит по-русски.
- source_word: אֹהֲבָיו
  choice: своим друзьям
  rationale: Буквально «тем, кто его любит»; в придворно-социальном контексте речь идёт о близких сторонниках или друзьях, а не о возлюбленных.
- source_word: כָּל אֲשֶׁר קָרָהוּ
  choice: обо всём, что с ним произошло
  rationale: Конструкция обозначает всё случившееся с Аманом; выбран естественный современный русский оборот.
- source_word: חֲכָמָיו
  choice: его мудрецы
  rationale: Сохраняет прямое значение слова и допускает их функцию советников, не подменяя лексему толкованием.
- source_word: אִם מִזֶּרַע הַיְּהוּדִים
  choice: из рода иудеев
  rationale: זֶרַע буквально значит «семя», а здесь выражает происхождение; «из рода» сохраняет образ родовой принадлежности и звучит естественно.
- source_word: הַחִלּוֹתָ לִנְפֹּל לְפָנָיו
  choice: перед которым ты начал падать
  rationale: Сохраняется начинательное значение החל и повтор глагола «падать», связывающий уже начавшееся унижение с предстоящим окончательным поражением.
- source_word: לֹא תוּכַל לוֹ
  choice: тебе его не одолеть
  rationale: יכל с ל в данном состязательном контексте означает неспособность взять верх над противником; русская конструкция передаёт это кратко и естественно.
- source_word: נָפוֹל תִּפּוֹל
  choice: ты непременно падёшь
  rationale: Инфинитив абсолютный при личной форме усиливает уверенность высказывания; «непременно» передаёт эту эмфазу.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Сохранение повторяющегося выражения передаёт мотив поражения и унижения Амана перед Мардохеем.
theological_decisions:
- issue: Связь неизбежного падения Амана с иудейским происхождением Мардохея
  choice: Сохранено как условное высказывание мудрецов и Зереш без пояснения причины
  alternative: Истолковать слова как прямое утверждение о Божьем провидении или неодолимости иудеев
  rationale: Еврейский текст сообщает реплику персонажей, но прямо не называет её богословское основание; перевод не должен устранять эту повествовательную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «иудеи», «Мардохей» и «падёшь» соответствуют привычному русскому библейскому регистру; синтаксис остаётся ясным для обычного читателя.
