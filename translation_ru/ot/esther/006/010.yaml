base_translation:
  language: en
  yaml_path: translation/ot/esther/006/010.yaml
  text: Then the king said to Haman[a], “Hurry, take the robe and the horse, just as you have said, and do so for Mordecai the Jew, who sits at the king’s gate[b]. Leave out nothing from all that you have said.”
translation:
  language: ru
  text: 'Тогда царь сказал Аману: «Поспеши, возьми одеяние и коня, как ты сказал, и сделай так для Мардохея, иудея, который сидит у царских ворот. Не упусти ничего из всего, что ты сказал».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַהֵר
  choice: Поспеши
  rationale: Повелительная форма требует немедленного действия; «поспеши» передаёт настойчивость и сохраняет достойный современный регистр.
- source_word: קַח
  choice: возьми
  rationale: Прямое соответствие основному значению глагола לקח в последовательности повелений.
- source_word: הַלְּבוּשׁ
  choice: одеяние
  rationale: Определённая форма отсылает к царскому одеянию из предыдущего стиха. «Одеяние» естественно в торжественном контексте и не добавляет отсутствующего здесь прилагательного «царское».
- source_word: הַסּוּס
  choice: коня
  rationale: Передаёт простое значение существительного; принадлежность коня царю ясна из контекста, но прямо в этой фразе не выражена.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: как ты говорил
  rationale: Связывает приказ царя с только что высказанным предложением Амана и естественно звучит по-русски.
- source_word: וַעֲשֵׂה כֵן
  choice: и сделай так
  rationale: Кратко и близко передаёт повеление с наречным כֵן.
- source_word: לְמָרְדֳּכַי
  choice: для Мардохея
  rationale: Предлог לְ имеет здесь значение лица, в пользу которого совершается действие; русское «для» ясно передаёт этот смысл.
- source_word: הַיְּהוּדִי
  choice: иудея
  rationale: В повествовании книги Есфирь слово обозначает этнорелигиозную принадлежность Мардохея; «иудей» — традиционное и понятное русское соответствие.
- source_word: הַיּוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: который сидит у царских ворот
  rationale: Причастие описывает известное положение или место Мардохея; относительное предложение звучит естественно, а «царские ворота» идиоматично передаёт единственное собирательное שַׁעַר.
- source_word: אַל תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ
  choice: Не упусти ничего из всего, что ты сказал
  rationale: Еврейский оборот буквально говорит о том, чтобы ничему не дать «упасть», но идиоматически требует не опустить ни одной детали; русский вариант ясно сохраняет полноту приказа.
theological_decisions:
- issue: Значение הַיְּהוּדִי
  choice: Передано как этнорелигиозное обозначение «иудей».
  alternative: Географически ориентированное «уроженец Иудеи» или «иудеянин».
  rationale: В контексте книги это слово прежде всего отмечает принадлежность Мардохея к иудейскому народу, а не только место происхождения; сноска сохраняет лексическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис приказа сохранён энергичным и последовательным; архаизмы и добавление невыраженных в стихе уточнений устранены.
