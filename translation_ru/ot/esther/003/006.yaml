  source_fidelity: 'В целом перевод точно передаёт ход мысли и основные элементы еврейского текста: презрение Амана к расправе только над Мардохеем, сообщённую ему этническую принадлежность Мардохея, замысел уничтожить всех иудеев по всему царству и заключительный повтор «народ Мардохея». «Истребить» адекватно передаёт тяжесть לְהַשְׁמִיד, не добавляя современных технических коннотаций.'
  naturalness: Обороты «поднять руку на», «к какому народу принадлежал» и «замыслил» естественны для современного литературного русского. Однако «счёл слишком ничтожным делом» звучит несколько тяжеловесно и может создать впечатление оценки самого действия как ничтожного, а не презрения к слишком ограниченной цели. «Счёл слишком мелким делом» яснее и естественнее передаёт контекстуальный смысл.
  terminology: Имена «Мардохей» и «Аман» последовательны; «Ахашверош» допустимо передаёт еврейскую форму имени. «Иудеи» верно соответствует יְהוּדִים в контексте книги Есфирь. Заключительное «народ Мардохея» сохраняет намеренный повтор оригинала. Сноска уместно разъясняет, что это не отношение владения.
