base_translation:
  language: en
  yaml_path: translation/ot/esther/003/006.yaml
  text: But it seemed contemptible in his eyes to lay a hand on Mordecai alone[a], because they had told him what people Mordecai belonged to. So Haman sought to destroy all the Jews throughout the whole kingdom of Ahasuerus—the people of Mordecai.
translation:
  language: ru
  text: Но он счёл слишком мелким делом поднять руку на одного лишь Мардохея, потому что ему сообщили, к какому народу принадлежал Мардохей. И Аман замыслил истребить всех иудеев во всём царстве Ахашвероша — народ Мардохея.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «народ Мардохея», то есть народ, к которому принадлежал Мардохей.'
    reason: Поясняет буквальное значение повторённого еврейского выражения и исключает возможное понимание притяжательной конструкции как указания на владение или власть.
lexical_decisions:
- source_word: וַיִּבֶז בְּעֵינָיו
  choice: он счёл слишком ничтожным делом
  rationale: Передаёт презрительную оценку Амана и смысл того, что расправа лишь с одним человеком казалась ему слишком малой целью; избегает русского «недостойным», которое могло бы прозвучать как нравственная оценка.
- source_word: לִשְׁלֹחַ יָד בְּ
  choice: поднять руку на
  rationale: Естественный русский оборот, сохраняющий телесный образ еврейской идиомы и обозначающий насильственное действие против человека.
- source_word: לְבַדּוֹ
  choice: на одного лишь
  rationale: Подчёркивает контраст между Мардохеем как единственной жертвой и всем народом, ставшим целью Амана.
- source_word: כִּי הִגִּידוּ לוֹ
  choice: потому что ему сообщили
  rationale: Ясно выражает причинную связь и предшествующее получение Аманом сведений.
- source_word: אֶת עַם מָרְדֳּכָי
  choice: к какому народу принадлежал Мардохей
  rationale: Передаёт смысл буквального выражения «народ Мардохея» как этническую принадлежность, не создавая впечатления, будто Мардохей владел или правил этим народом.
- source_word: וַיְבַקֵּשׁ
  choice: замыслил
  rationale: В данном контексте глагол выражает целенаправленное намерение; «замыслил» естественно передаёт ещё не осуществлённый злой план.
- source_word: לְהַשְׁמִיד
  choice: истребить
  rationale: Передаёт направленность на полное уничтожение группы сильнее, чем нейтральное «уничтожить», и соответствует контексту массовой расправы.
- source_word: כָּל הַיְּהוּדִים
  choice: всех иудеев
  rationale: В книге Есфирь слово обозначает иудейский народ в Персидской державе, а не только жителей Иудеи.
- source_word: אֲשֶׁר בְּכָל מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: во всём царстве Ахашвероша
  rationale: Кратко и естественно передаёт полный географический охват замысла; имя транслитерировано непосредственно с еврейского.
- source_word: עַם מָרְדֳּכָי
  choice: народ Мардохея
  rationale: Во втором употреблении сохранена краткая форма оригинала как пояснительное приложение к «всех иудеев», чтобы передать риторический повтор.
