  text: וְ/כָל עַבְדֵ֨י הַ/מֶּ֜לֶךְ אֲשֶׁר בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ כֹּרְעִ֤ים וּ/מִֽשְׁתַּחֲוִים֙ לְ/הָמָ֔ן כִּי כֵ֖ן צִוָּה ל֣/וֹ הַ/מֶּ֑לֶךְ וּ/מָ֨רְדֳּכַ֔י לֹ֥א יִכְרַ֖ע וְ/לֹ֥א יִֽשְׁתַּחֲוֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/002.yaml
  text: And all the king’s servants who were at the king’s gate were bowing down and paying homage to Haman[a], for the king had so commanded concerning him[b]. But Mordecai would not bow down or pay homage.
translation:
  language: ru
  text: И все царские слуги, находившиеся у царских ворот, преклоняли колени и кланялись Аману[a], ибо таково было царское повеление о нём[b]. Но Мардохей не преклонял колен и не кланялся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «падали ниц перед Аманом». Еврейский глагол может также означать «поклоняться», когда речь идёт о поклонении Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ибо так царь повелел ему». Однако вероятнее, что местоимение относится к Аману, то есть царский приказ касался почестей, которые следовало ему оказывать.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: царские слуги
  rationale: В придворном контексте עֶבֶד обозначает людей на царской службе; «слуги» сохраняет широту еврейского слова, не преувеличивая зависимый статус и не сужая значение до должностных лиц.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: у царских ворот
  rationale: Фраза обозначает конкретное общественно-административное место при дворце; «у царских ворот» естественно звучит по-русски и сохраняет образ исходного текста.
- source_word: כֹּרְעִים
  choice: преклоняли колени
  rationale: Причастная форма передаёт обычное или повторяющееся действие. Выражение обозначает телесный жест почтения и в сочетании со следующим глаголом звучит естественно.
- source_word: וּמִשְׁתַּחֲוִים
  choice: кланялись
  rationale: Глагол может означать земной поклон, выражение почтения или поклонение — в зависимости от объекта и контекста. Здесь объектом является Аман, поэтому «кланялись» передаёт придворное почтение, не навязывая религиозного смысла.
- source_word: לְהָמָן
  choice: Аману
  rationale: Дательный падеж естественно передаёт лицо, которому оказывается почтение.
- source_word: כִּי כֵן צִוָּה לוֹ הַמֶּלֶךְ
  choice: потому что так повелел царь относительно него
  rationale: 'Местоимение לוֹ вероятнее всего относится к Аману: царский приказ касался почестей, которые следовало ему оказывать. Формулировка сохраняет эту синтаксическую неоднозначность достаточно близко к источнику.'
- source_word: וּמָרְדֳּכַי
  choice: Но Мардохей
  rationale: Хотя союз формально означает «и», здесь он вводит явное противопоставление поведению всех остальных, поэтому по-русски естественно «но».
- source_word: לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  choice: не преклонял колен и не кланялся
  rationale: Имперфекты описывают устойчивый отказ Мардохея. Русский несовершенный вид естественно передаёт повторяющееся поведение; сохранён параллелизм двух отрицаний.
theological_decisions:
- issue: Следует ли передавать הִשְׁתַּחֲוָה явно религиозным словом «поклоняться»
  choice: кланяться
  alternative: поклоняться; падать ниц
  rationale: Этот еврейский глагол употребляется как для поклонения Богу, так и для почтительного поклона человеку. Поскольку здесь действие направлено к Аману, слово «кланяться» не вносит не выраженного прямо утверждения о религиозном поклонении; возможный более сильный телесный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Несовершенный вид передаёт обычные действия придворных и устойчивый отказ Мардохея. Терминология избегает как архаичной тяжеловесности, так и преждевременного религиозного истолкования жеста.
