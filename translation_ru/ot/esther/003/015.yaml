base_translation:
  language: en
  yaml_path: translation/ot/esther/003/015.yaml
  text: The couriers went out[a], hurried by the king’s command, and the decree was issued in Susa the citadel. And the king and Haman sat down to drink[b], but the city of Susa was thrown into confusion.
translation:
  language: ru
  text: Гонцы поспешно отправились по царскому повелению, и указ[a] был издан в цитадели Сузы. Царь и Аман сели пить, а город Сузы был в смятении[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «закон был дан в цитадели Сузы». В персидском административном контексте דָּת может означать как «закон», так и «указ».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «был в замешательстве»; «был охвачен тревогой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: гонцы
  rationale: В персидском административном контексте речь идёт о царских доставщиках указов; «гонцы» естественно и точно передаёт их официальную функцию.
- source_word: דְחוּפִים
  choice: поспешно
  rationale: Передаёт настойчиво заданную извне срочность, не утяжеляя русскую фразу буквальным «подгоняемые».
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: по царскому повелению
  rationale: דבר здесь означает властное распоряжение; «повеление» сохраняет официальный и повествовательно возвышенный регистр.
- source_word: הַדָּת נִתְּנָה
  choice: указ был издан
  rationale: В персидской административной среде דָּת обозначает правовой указ, а буквальное «был дан» идиоматически означает его официальное издание.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: в крепости Сузы
  rationale: בִּירָה обозначает укреплённый дворцовый комплекс или цитадель; «крепость Сузы» понятно современному читателю и сохраняет отличие от города в последней части стиха.
- source_word: יָשְׁבוּ לִשְׁתּוֹת
  choice: сели пить
  rationale: Прямая передача еврейского оборота сохраняет резкий контраст между губительным указом и безмятежным поведением царя и Амана.
- source_word: נָבוֹכָה
  choice: был в смятении
  rationale: Форма выражает состояние растерянности, тревоги и общественного замешательства; «в смятении» кратко охватывает эти оттенки.
- source_word: וְ
  choice: же … а
  rationale: Хотя союзы формально означают «и», русское противопоставление ясно передаёт повествовательный контраст между пирующими правителями и смятённым городом.
