translation_notes:
  register: Современный литературный русский язык, ясный и dignified по тону. Сохранены чужеземное слово «пур» и его данное самим текстом пояснение. Имя царя передано как «Ахашверош», ближе к еврейскому оригиналу. Синтаксическая неоднозначность заключительной календарной формулы не скрыта и пояснена в сноске.
