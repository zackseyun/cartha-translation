base_translation:
  language: en
  yaml_path: translation/ot/esther/003/007.yaml
  text: In the first month[a], that is, the month of Nisan, in the twelfth year of King Ahasuerus, Pur—that is, the lot—was cast before Haman, from day to day and from month to month, until the twelfth month, that is, the month of Adar.
translation:
  language: ru
  text: В первом месяце, то есть в месяце нисане, в двенадцатый год царя Ахашвероша, перед Аманом был брошен пур, то есть жребий, изо дня в день и из месяца в месяц, до двенадцатого месяца, то есть месяца адара.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «изо дня в день и из месяца в месяц — двенадцать, то есть месяц адар». Конечная часть еврейской фразы синтаксически сжата; перевод «до двенадцатого месяца» передаёт её наиболее вероятный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: В первом месяце
  rationale: Естественно передаёт временную конструкцию с בְּ и сохраняет календарное обрамление стиха.
- source_word: הוּא חֹדֶשׁ נִיסָן
  choice: то есть в месяце нисане
  rationale: Передаёт пояснительную аппозицию с הוּא; название месяца оформлено по нормам современного русского языка.
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: в двенадцатый год царя Ахашвероша
  rationale: Идиоматичная русская формула датировки по годам царствования; имя транслитерировано с еврейской формы.
- source_word: הִפִּיל פּוּר
  choice: бросали пур
  rationale: Глагол в единственном числе допускает неопределённого деятеля; русская неопределённо-личная конструкция не вводит отсутствующего в тексте субъекта и естественно передаёт метание жребия.
- source_word: פּוּר הוּא הַגּוֹרָל
  choice: пур, то есть жребий
  rationale: Сохранено персидское заимствование, которое сам еврейский текст немедленно поясняет обычным словом «жребий»; это также поддерживает связь с названием праздника Пурим.
- source_word: לִפְנֵי הָמָן
  choice: перед Аманом
  rationale: Точно и естественно передаёт значение «перед, в присутствии».
- source_word: מִיּוֹם לְיוֹם וּמֵחֹדֶשׁ לְחֹדֶשׁ
  choice: определяя день за днём и месяц за месяцем
  rationale: Формулы последовательности сохранены, а добавленное «определяя» делает по-русски понятной функцию жеребьёвки, не устраняя синтаксическую трудность оригинала.
- source_word: שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: вплоть до двенадцатого месяца, то есть месяца адара
  rationale: Контекстуально выражает конечный месяц календарного перебора; степень экспликации отмечена сноской из-за сжатого и трудного еврейского синтаксиса.
