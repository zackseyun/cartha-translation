  yaml_path: translation/ot/esther/003/014.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made known to all the peoples[b], so that they would be ready for this day.
translation:
  language: ru
  text: Копия письменного указа должна была быть издана в качестве закона в каждой области[a] и доведена до сведения всех народов, чтобы они были готовы к этому дню[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в каждой области и области»; повтор в еврейском тексте подчёркивает, что речь идёт о каждой области без исключения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к тому дню», то есть к дню, назначенному указом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן
  choice: копия
  rationale: Персидское заимствование обозначает копию или список официального документа; «копия» естественно для современного русского административного контекста.
- source_word: הַכְּתָב
  choice: документа
  rationale: Буквально «письменный документ, текст»; юридическая сила далее прямо выражена словами «как закон», поэтому нейтральное «документ» не создаёт избыточного повтора «указ... как закон».
- source_word: לְהִנָּתֵן דָּת
  choice: должна была быть обнародована как закон
  rationale: Пассивный инфинитив נתן в административном контексте указывает на официальное издание или опубликование, а דָּת — на обязательную юридическую норму.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: в каждой области
  rationale: Повтор существительного имеет дистрибутивное значение — «в каждой без исключения области»; буквальное повторение по-русски неестественно, поэтому оттенок отмечен в сноске.
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: объявлена всем народам
  rationale: גָּלוּי выражает публичную известность или открытое оглашение; «объявлена» естественно передаёт официальное доведение документа до всех этнических групп империи.
- source_word: לִהְיוֹת עֲתִדִים
  choice: чтобы они были готовы
  rationale: 'Инфинитивная конструкция с прилагательным выражает цель: народы должны были находиться в готовности.'
- source_word: לַיּוֹם הַזֶּה
  choice: к этому дню
  rationale: Формально указательное выражение означает «к этому дню»; по контексту речь идёт о дне, назначенном указом, что отражено в сноске.
