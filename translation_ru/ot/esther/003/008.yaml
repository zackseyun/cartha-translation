  register: Современный литературный русский язык с достоинством придворной речи. Сохранена обвинительная риторика Амана и парность определений «рассеянный и обособленный». Имя אֲחַשְׁוֵרוֹשׁ передано как «Ахашверош», близко к еврейской форме, без замены на греко-латинское «Артаксеркс» или традиционное «Ассур».
