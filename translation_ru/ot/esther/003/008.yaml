  text: וַ/יֹּ֤אמֶר הָמָן֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ יֶשְׁנ֣/וֹ עַם אֶחָ֗ד מְפֻזָּ֤ר וּ/מְפֹרָד֙ בֵּ֣ין הָֽ/עַמִּ֔ים בְּ/כֹ֖ל מְדִינ֣וֹת מַלְכוּתֶ֑/ךָ וְ/דָתֵי/הֶ֞ם שֹׁנ֣וֹת מִ/כָּל עָ֗ם וְ/אֶת דָּתֵ֤י הַ/מֶּ֨לֶךְ֙ אֵינָ֣/ם עֹשִׂ֔ים וְ/לַ/מֶּ֥לֶךְ אֵין שֹׁוֶ֖ה לְ/הַנִּיחָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/008.yaml
  text: Then Haman said to King Ahasuerus[a], “There is a certain people, scattered and separated among the peoples in all the provinces of your kingdom. Their laws are different from those of every other people, and they do not keep the king’s laws, so it is not in the king’s interest to let them remain.”
translation:
  language: ru
  text: 'Тогда Аман сказал царю Ахашверошу: «Есть один народ, рассеянный и обособленный среди других народов во всех областях твоего царства. Их законы отличаются от законов любого другого народа; законов царя они не исполняют, и царю невыгодно оставлять их в покое[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позволять им оставаться»; также возможно: «терпеть их». Еврейский глагол может означать оставить кого-либо в покое или позволить ему оставаться без вмешательства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשְׁנוֹ עַם אֶחָד
  choice: Есть один народ
  rationale: Сохраняет буквальное אֶחָד («один») и вместе с тем естественно вводит неопределённый, но конкретный народ в речи Амана.
- source_word: מְפֻזָּר וּמְפֹרָד
  choice: рассеянный и обособленный
  rationale: 'Передаёт оба причастия: первое указывает на территориальную рассеянность, второе — на отделённость или особое положение среди прочих народов, не утверждая внутренней раздробленности.'
- source_word: בֵּין הָעַמִּים
  choice: среди других народов
  rationale: «Народы» соответствует этническим группам империи; «других» естественно выражает подразумеваемое противопоставление названному народу.
- source_word: בְּכֹל מְדִינוֹת מַלְכוּתֶךָ
  choice: во всех областях твоего царства
  rationale: В книге Есфирь מְדִינוֹת обозначает административные области; формулировка ясна и естественна для современного русского языка.
- source_word: דָתֵיהֶם שֹׁנוֹת מִכָּל עָם
  choice: Их законы отличаются от законов любого другого народа
  rationale: Дָּת в персидском придворном контексте имеет юридический смысл. Повтор «законов» делает явным объект сравнения, уже подразумеваемый еврейским текстом.
- source_word: וְאֶת דָּתֵי הַמֶּלֶךְ אֵינָם עֹשִׂים
  choice: законов царя они не исполняют
  rationale: Сочетание עָשָׂה с «законами» означает исполнять или соблюдать их; «исполняют» сохраняет юридический регистр обвинения.
- source_word: וְלַמֶּלֶךְ אֵין שֹׁוֶה
  choice: и царю невыгодно
  rationale: Кратко передаёт значение отсутствия пользы или целесообразности для царя, сохраняя корыстный характер довода Амана.
- source_word: לְהַנִּיחָם
  choice: оставлять их в покое
  rationale: Каузативная форма נוח здесь означает позволить им быть, не трогать их или оставить их без вмешательства; выбор сохраняет широту выражения и не сводит его только к физическому пребыванию.
