base_translation:
  language: en
  yaml_path: translation/ot/esther/003/009.yaml
  text: If it seems good to the king[a], let it be written that they be destroyed, and I will weigh out ten thousand talents of silver into the hands of those who do the work[c][b], to bring it into the king’s treasuries.
translation:
  language: ru
  text: 'Если царю угодно[a], пусть будет написано: уничтожить их. А я отвешу десять тысяч талантов серебра[b] в руки тех, кто выполняет эту работу[c], чтобы внести серебро в царские сокровищницы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если это угодно царю».'
    reason: lexical_alternative
  - marker: b
    text: Таланты — мера веса; десять тысяч талантов серебра составляли чрезвычайно большое количество серебра, а не число чеканных монет.
    reason: cultural_note
  - marker: c
    text: 'Или: «через тех, кто выполняет эту работу», то есть при посредстве людей, которым она поручена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Если царю угодно
  rationale: Устойчивое придворное выражение передаёт просьбу о царском одобрении естественным и достойным современным русским языком.
- source_word: יִכָּתֵב
  choice: пусть будет написано
  rationale: Сохранено буквальное значение нифаля от כתב; придворный контекст подразумевает официальный письменный указ, но это не добавляется в основной текст.
- source_word: לְאַבְּדָם
  choice: уничтожить их
  rationale: Инфинитив с местоименным суффиксом выражает содержание предписания и недвусмысленно передаёт намерение лишить их жизни.
- source_word: כִּכַּר כֶּסֶף
  choice: талантов серебра
  rationale: Сохранена древняя весовая единица без предположительного пересчёта в современные меры или денежные суммы.
- source_word: אֶשְׁקוֹל
  choice: я отвешу
  rationale: Глагол שקל буквально обозначает взвешивание; здесь речь о выдаче серебра, которое учитывали по весу.
- source_word: עַל יְדֵי
  choice: в руки
  rationale: Сохранён конкретный образ еврейского выражения; при этом сноска отмечает возможный смысл посредничества или действия через исполнителей.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: тех, кто исполнит это дело
  rationale: Формулировка не уточняет сверх еврейского текста, кем именно были эти люди, но по-русски ясно указывает на порученное им дело.
- source_word: לְהָבִיא
  choice: чтобы внести
  rationale: Целевой инфинитив передан без явного указания субъекта действия, благодаря чему сохраняется некоторая синтаксическая открытость оригинала.
- source_word: גִּנְזֵי הַמֶּלֶךְ
  choice: царские сокровищницы
  rationale: Сохранено множественное число еврейского существительного; выражение естественно звучит в русском повествовании.
