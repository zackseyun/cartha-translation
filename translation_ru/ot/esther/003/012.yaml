  text: וַ/יִּקָּרְאוּ֩ סֹפְרֵ֨י הַ/מֶּ֜לֶךְ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֣ר יוֹם֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה הָמָ֡ן אֶ֣ל אֲחַשְׁדַּרְפְּנֵֽי הַ֠/מֶּלֶךְ וְֽ/אֶל הַ/פַּח֞וֹת אֲשֶׁ֣ר עַל מְדִינָ֣ה וּ/מְדִינָ֗ה וְ/אֶל שָׂ֤רֵי עַם֙ וָ/עָ֔ם מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ בְּ/שֵׁ֨ם הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרֹשׁ֙ נִכְתָּ֔ב וְ/נֶחְתָּ֖ם בְּ/טַבַּ֥עַת הַ/מֶּֽלֶךְ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/012.yaml
  text: Then the king’s scribes were summoned in the first month[a], on the thirteenth day of it, and it was written exactly as Haman commanded to the king’s satraps, to the governors who were over each province, and to the officials of each people, to every province in its own script and to every people in its own language[b]. It was written in the name of King Ahasuerus and sealed with the king’s signet ring.
translation:
  language: ru
  text: В первый месяц, в тринадцатый день месяца, были созваны царские писцы, и было написано всё, как повелел Аман, царским сатрапам, наместникам каждой области и начальникам каждого народа — для каждой области её письменностью[a] и для каждого народа на его языке. Написано было от имени царя Ахашвероша и скреплено царским перстнем-печатью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть системой письма, принятой в данной области.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  choice: были созваны царские писцы
  rationale: Нифаль передаёт пассивное действие; «созваны» естественно звучит в официально-административном контексте, а «писцы» сохраняет название придворной должности.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: в первый месяц, в тринадцатый день месяца
  rationale: Сохранена последовательность еврейского текста, при этом местоименная отсылка בּוֹ раскрыта словом «месяца» ради ясного современного русского синтаксиса.
- source_word: וַיִּכָּתֵב כְּכָל אֲשֶׁר צִוָּה הָמָן
  choice: они записали всё в точности по приказу Амана
  rationale: Безлично-пассивная еврейская конструкция по-русски естественно передана активной формой с ближайшим явно названным деятелем — писцами; כְּכָל выражает полное соответствие приказу.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: царским сатрапам
  rationale: «Сатрапы» — точный и общеупотребительный исторический термин для персидской административной должности.
- source_word: הַפַּחוֹת אֲשֶׁר עַל מְדִינָה וּמְדִינָה
  choice: наместникам каждой области
  rationale: «Наместники» отличает эту должность от сатрапов и передаёт управление отдельными областями; дистрибутивное повторение выражено словом «каждой».
- source_word: שָׂרֵי עַם וָעָם
  choice: начальникам каждого народа
  rationale: שָׂרִים имеет широкий смысл руководителей или должностных лиц; «начальники» сохраняет официальный характер, не придавая им обязательно княжеского статуса.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: в каждую область её письменностью
  rationale: כְּתָב обозначает используемую систему письма; «письменность» точнее русского «письмо» и не смешивается с посланием как документом.
- source_word: וְעַם וָעָם כִּלְשׁוֹנוֹ
  choice: каждому народу на его языке
  rationale: לָשׁוֹן здесь означает язык; перевод сохраняет дистрибутивность и естественен для современного русского.
- source_word: וְנֶחְתָּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: скреплено царским перстнем с печатью
  rationale: טַבַּעַת в данном контексте — перстень-печать; развёрнутая формулировка ясно передаёт и предмет, и его функцию.
