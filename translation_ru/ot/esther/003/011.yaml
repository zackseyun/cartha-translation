lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; традиционное русское «И сказал» естественно сохраняет связь с предыдущим контекстом.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное передано обычным русским титулом; имя правителя не подставляется, поскольку в еврейском тексте стоит титул.
- source_word: לְהָמָן
  choice: Аману
  rationale: Предлог לְ обозначает адресата речи; имя передано в принятой русской библейской форме.
- source_word: הַכֶּסֶף
  choice: Серебро[a]
  rationale: כֶּסֶף буквально означает «серебро», а по расширению — «деньги». Основной текст сохраняет конкретный образ, а сноска отмечает контекстуально возможный смысл.
- source_word: נָתוּן לָךְ
  choice: отдаётся тебе
  rationale: Страдательное причастие выражает передачу серебра в распоряжение Амана. Настоящее время по-русски передаёт совершаемое царём распоряжение и не усиливает его до безусловного владения.
- source_word: וְהָעָם
  choice: и народ
  rationale: Союз соединяет народ с серебром как ещё один предмет царского распоряжения; добавление «также» не требуется в русском синтаксисе.
- source_word: לַעֲשׂוֹת בּוֹ
  choice: чтобы ты поступил с ним
  rationale: Инфинитив выражает цель или предоставленную возможность действия. Местоимение בּוֹ грамматически единственного числа и согласуется с собирательным הָעָם, поэтому естественное русское «с ним» сохраняет форму оригинала.
- source_word: כַּטּוֹב בְּעֵינֶיךָ
  choice: так, как тебе угодно
  rationale: Еврейская идиома означает действие по собственному усмотрению, буквально — согласно тому, что хорошо в чьих-либо глазах. Естественная русская передача сохраняет смысл без тяжеловесного калькирования.
theological_decisions:
- issue: Характер передачи серебра и народа Аману
  choice: 'Сохранено параллельное распоряжение: «Серебро отдаётся тебе, и народ…»'
  alternative: «Оставь серебро себе, а с народом поступи…»
  rationale: Еврейская конструкция допускает контекстуальные толкования, но буквально ставит серебро и народ в зависимость от царского решения. Перевод не уточняет финансовый смысл сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного стиля. Синтаксис близок к еврейскому, но идиома כַּטּוֹב בְּעֵינֶיךָ передана естественно по-русски. Единственная сноска отмечена в основном тексте.
