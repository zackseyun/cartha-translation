  text: Then the king said to Haman[a], “The silver is given to you, and the people also[b], to do with them as seems good in your eyes.”
translation:
  language: ru
  text: 'И сказал царь Аману: «Серебро[a] и народ отданы тебе, чтобы ты поступил с ним, как тебе угодно».'
  philosophy: optimal-equivalence
  footnotes:
