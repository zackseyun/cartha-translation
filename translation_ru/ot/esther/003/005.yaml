  yaml_path: translation/ot/esther/003/005.yaml
  text: When Haman saw that Mordecai was neither bowing down nor prostrating himself before him[a], Haman was filled with rage.
translation:
  language: ru
  text: Когда Аман увидел, что Мардохей не преклоняет колен и не падает ниц перед ним[a], Аман исполнился ярости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не кланяется и не воздаёт ему почестей». В еврейском тексте употреблены два близких, но различных глагола, обозначающих жесты почтения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Когда Аман увидел
  rationale: Последовательная форма с וַ продвигает повествование, а в данном контексте естественно передаётся временной конструкцией «когда… увидел».
- source_word: כִּי אֵין מָרְדֳּכַי
  choice: что Мардохей не…
  rationale: אֵין с причастными формами выражает продолжающееся отсутствие действия; настоящее время в русском передаёт его обычное, повторяющееся поведение.
- source_word: כֹּרֵעַ
  choice: преклоняет колен
  rationale: כרע обозначает сгибание колена или поклон; выражение сохраняет телесный характер действия и уместно в придворном контексте.
- source_word: וּמִשְׁתַּחֲוֶה
  choice: и не простирается
  rationale: השתחוה обозначает земной поклон, простирание ниц или выражение почтения; «простирается» отличает это действие от преклонения колен, не сводя его только к внутреннему почтению.
- source_word: לוֹ
  choice: перед ним
  rationale: Буквально «ему», но при описании телесного поклона по-русски естественнее указать направленность словами «перед ним».
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: Аман исполнился ярости
  rationale: Сохраняется образное выражение «наполнился яростью» в естественной для литературного русского форме.
- source_word: חֵמָה
  choice: ярость
  rationale: Слово передаёт сильный, бурный гнев Амана без смягчения интенсивности исходного חֵמָה.
