  text: So the king took his signet ring from his hand and gave it to Haman son of Hammedatha the Agagite[a], the enemy of the Jews.
translation:
  language: ru
  text: И снял царь со своей руки перстень с печатью и отдал его Аману, сыну Амадафы, агагитянину, врагу иудеев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евреев». Еврейское יְהוּדִים может обозначать иудейский народ в широком смысле, а в некоторых контекстах — выходцев или жителей Иудеи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: снял
  rationale: Глагол означает «удалить, снять»; в сочетании с перстнем на руке русское «снял» точно и естественно передаёт действие.
- source_word: טַבַּעְתּוֹ
  choice: перстень с печатью
  rationale: В придворном контексте это перстень, служивший официальной печатью и знаком передаваемой власти; формулировка понятна современному читателю.
- source_word: מֵעַל יָדוֹ
  choice: со своей руки
  rationale: Сохраняет конкретный образ еврейского текста и естественно сочетается с глаголом «снял».
- source_word: וַיִּתְּנָהּ
  choice: отдал его
  rationale: Передаёт נתן и указывает на передачу перстня Аману; местоимение согласовано с русским словом «перстень».
- source_word: לְהָמָן
  choice: Аману
  rationale: Традиционная и узнаваемая русская передача имени הָמָן.
- source_word: בֶּן הַמְּדָתָא
  choice: сыну Амадафы
  rationale: Патронимическая конструкция передана буквально; имя дано в устоявшейся русской библейской форме.
- source_word: הָאֲגָגִי
  choice: агагитянину
  rationale: Сохраняет обозначение происхождения или рода, связанное с Агагом, не уточняя сверх того, что выражено в исходном тексте.
- source_word: צֹרֵר
  choice: врагу
  rationale: Причастная форма обозначает враждующего, противника; «враг» естественно и выразительно передаёт смысл в данном контексте.
- source_word: הַיְּהוּדִים
  choice: иудеев
  rationale: В книге Есфирь слово обозначает преследуемый народ; «иудеи» — точный и привычный русский библейский эквивалент, при сохранении возможной широты значения в сноске.
- source_word: וַ
  choice: И
  rationale: Союз продолжает последовательное повествование; русское «И» сохраняет форму и естественный библейский нарративный ритм.
