base_translation:
  language: en
  yaml_path: translation/ot/esther/003/001.yaml
  text: After these things[a], King Ahasuerus promoted Haman son of Hammedatha the Agagite, exalted him[c][b], and set his throne above all the officials who were with him.
translation:
  language: ru
  text: 'После этих событий[a] царь Ахашверош возвысил Амана, сына Аммедаты, агагитянина[b]: он возвеличил его и поставил его престол выше всех сановников, которые были при нём[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «После этих вещей»; также возможно: «После этого».'
    reason: lexical_alternative
  - marker: b
    text: «Агагитянин» — еврейское обозначение, которое может указывать на происхождение, род или иную связь с Агагом.
    reason: cultural_note
  - marker: c
    text: 'Вероятнее всего, речь идёт о сановниках, находившихся при царе. Еврейский текст буквально говорит: «которые были при нём».'
    reason: referent_ambiguity
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: После этих событий
  rationale: Естественная современная передача повествовательной формулы; דְּבָרִים здесь может обозначать события, а не только слова или вещи.
- source_word: גִּדַּל
  choice: возвысил
  rationale: В придворном контексте глагол означает повышение статуса и положения Амана.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: царь Ахашверош
  rationale: Сохранена еврейская форма имени и естественный для русского языка порядок титула и имени.
- source_word: הָמָן בֶּן הַמְּדָתָא
  choice: Амана, сына Аммедаты
  rationale: Имена транслитерированы с еврейского; патроним явно сохранён.
- source_word: הָאֲגָגִי
  choice: агагитянина
  rationale: Обозначение сохранено без разрешения вопроса о том, указывает ли оно на происхождение, род или иную связь с Агагом.
- source_word: וַיְנַשְּׂאֵהוּ
  choice: возвеличил его
  rationale: Передаёт повторное усиление идеи высокого положения, не сливая этот глагол полностью с предшествующим גִּדַּל.
- source_word: וַיָּשֶׂם אֶת כִּסְאוֹ
  choice: поставил его престол
  rationale: כִּסֵּא буквально означает престол или место власти; формулировка сохраняет придворный образ ранга.
- source_word: מֵעַל כָּל הַשָּׂרִים
  choice: выше престолов всех сановников
  rationale: Слово «престолов» добавлено как подразумеваемое русским сравнением положения мест; שָׂרִים в данном контексте естественно передано как придворные сановники.
- source_word: אֲשֶׁר אִתּוֹ
  choice: которые были при нём
  rationale: Суффикс допускает ближайшую отсылку к царю; русский оборот сохраняет местоименную неоднозначность, поясняемую в примечании.
theological_decisions:
- issue: Возможная связь обозначения «агагитянин» с Агагом и амаликитянами
  choice: Не конкретизировать эту связь в основном тексте
  alternative: Передать как прямое указание на амаликитянское происхождение
  rationale: Еврейский текст даёт обозначение הָאֲגָגִי, но сам стих не объясняет его историческую или родословную природу.
- issue: Референт местоименного суффикса в אֲשֶׁר אִתּוֹ
  choice: Сохранить местоимение «при нём» и отметить наиболее вероятную отсылку к царю
  alternative: Явно написать «при царе»
  rationale: Контекст поддерживает отсылку к царю, однако формальная местоименная конструкция не называет его повторно.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным регистром. Сохранены придворная образность «престола» и различие двух глаголов возвышения; неоднозначности обозначения «агагитянин» и местоименной отсылки не устранены без примечаний.
