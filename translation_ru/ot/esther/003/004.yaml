base_translation:
  language: en
  yaml_path: translation/ot/esther/003/004.yaml
  text: And when they spoke to him day after day and he would not listen to them[a], they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew.
translation:
  language: ru
  text: И когда они изо дня в день говорили ему, а он их не слушал, они сообщили Аману, чтобы посмотреть, устоят ли слова Мардохея[a], потому что он сказал им, что он иудей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «устоят ли слова Мардохея». Это может означать как «окажется ли состоятельным объяснение Мардохея», так и «сумеет ли он сохранить свою позицию под давлением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְאָמְרָם אֵלָיו
  choice: И когда они… говорили ему
  rationale: Конструкция וַיְהִי с בְּ и инфинитивом вводит временное придаточное. Такой перевод естественно передаёт переход в повествовании, не воспроизводя буквально формулу «и было».
- source_word: יוֹם וָיוֹם
  choice: изо дня в день
  rationale: Повтор существительного выражает регулярно повторявшееся действие и настойчивость придворных.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: а он их не слушал
  rationale: שׁמע с אֶל означает «слушать, внимать». В данном контексте несовершенный вид передаёт продолжавшийся отказ прислушаться к их словам.
- source_word: וַיַּגִּידוּ לְהָמָן
  choice: они донесли Аману
  rationale: Порода Hiphil глагола נגד означает «сообщить, донести». «Донесли» естественно передаёт сообщение вышестоящему лицу и оттенок жалобы, возникающий из контекста.
- source_word: לִרְאוֹת
  choice: чтобы посмотреть
  rationale: Инфинитив выражает цель, что в современном русском естественно передаётся союзом «чтобы».
- source_word: הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי
  choice: устоят ли слова Мардохея
  rationale: 'Перевод сохраняет метафору עמד («стоять, устоять») и намеренно не устраняет неоднозначность: речь может идти как о состоятельности объяснения Мардохея, так и о том, сохранит ли он заявленную позицию под давлением.'
- source_word: כִּי הִגִּיד לָהֶם
  choice: потому что он сказал им
  rationale: 'כִּי указывает причину, по которой придворные сообщили об этом Аману: Мардохей уже открыл им своё происхождение.'
- source_word: אֲשֶׁר הוּא יְהוּדִי
  choice: что он иудей
  rationale: יְהוּדִי — обозначение этнорелигиозной принадлежности. Существительное «иудей» прямо соответствует еврейской именной конструкции и уместно в историческом контексте книги.
