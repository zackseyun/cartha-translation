  text: וְ/נִשְׁל֨וֹחַ סְפָרִ֜ים בְּ/יַ֣ד הָ/רָצִים֮ אֶל כָּל מְדִינ֣וֹת הַ/מֶּלֶךְ֒ לְ/הַשְׁמִ֡יד לַ/הֲרֹ֣ג וּ/לְ/אַבֵּ֣ד אֶת כָּל הַ֠/יְּהוּדִים מִ/נַּ֨עַר וְ/עַד זָקֵ֜ן טַ֤ף וְ/נָשִׁים֙ בְּ/י֣וֹם אֶחָ֔ד בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֣דֶשׁ אֲדָ֑ר וּ/שְׁלָלָ֖/ם לָ/בֽוֹז־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/013.yaml
  text: Letters were sent by the hand of the couriers to all the provinces of the king[a], to destroy, to kill, and to annihilate all the Jews, from young man to old man, children and women, in one day, on the thirteenth day of the twelfth month, that is, the month Adar[d][c][b], and to plunder their spoil.
translation:
  language: ru
  text: 'И разослали письма с гонцами[a] во все царские области: истребить, убить и уничтожить[b] всех иудеев — от юноши до старца[c], детей и женщин — в один день, в тринадцатый день двенадцатого месяца, то есть месяца Адара, и их имущество разграбить[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукою бегунов», то есть царских курьеров.'
    reason: lexical_alternative
  - marker: b
    text: Три близких по значению глагола — «истребить, убить и уничтожить» — намеренно усиливают формулировку еврейского указа.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «от молодых до старых». Буквально: «от юноши до старца»; это выражение охватывает людей всех возрастов.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «их добро взять как добычу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁלוֹחַ סְפָרִים
  choice: И разослали письма
  rationale: Еврейская форма допускает безличное повествование; активная неопределённо-личная конструкция естественна по-русски и сохраняет связь с контекстом. סְפָרִים в административной обстановке — письменные послания, естественно «письма».
- source_word: בְּיַד הָרָצִים
  choice: с гонцами
  rationale: Буквально «рукою бегунов»; речь о царских курьерах. «С гонцами» естественно передаёт средство доставки, а буквальный образ отмечен в сноске.
- source_word: אֶל כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: во все царские области
  rationale: Краткая и естественная передача административных областей царства с сохранением значения всеохватности כָּל.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: истребить, убить и уничтожить
  rationale: Сохранена намеренная трёхчленная цепь близких по значению глаголов, усиливающая тотальный характер указа.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: от юноши до старца
  rationale: Сохранена выраженная в еврейском тексте меризма с мужскими формами единственного числа, распределительно охватывающая людей всех возрастов.
- source_word: טַף וְנָשִׁים
  choice: детей и женщин
  rationale: טַף обозначает детей, малых; ясная современная формулировка подчёркивает включение мирного населения.
- source_word: בְּיוֹם אֶחָד
  choice: в один день
  rationale: Точно передаёт сосредоточение предписанного насилия в пределах одного дня.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: в тринадцатый день двенадцатого месяца, то есть месяца адара
  rationale: Естественно передана еврейская формула даты и пояснительное наименование месяца.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: а их имущество отдать на разграбление
  rationale: Передаёт предназначение имущества жертв для санкционированного грабежа; по-русски звучит естественнее буквального тавтологического «разграбить их добычу».
