base_translation:
  language: en
  yaml_path: translation/ot/esther/003/003.yaml
  text: Then the king’s servants who were at the king’s gate said to Mordecai[a], “Why are you transgressing the king’s command?”
translation:
  language: ru
  text: 'Тогда царские слуги, находившиеся у царских ворот, сказали Мардохею: «Почему ты нарушаешь повеление царя?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Тогда … сказали
  rationale: Последовательная форма wayyiqtol продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: царские слуги
  rationale: עֶבֶד означает «слуга» или «раб»; в данном придворном контексте речь идёт о людях на царской службе, а «слуги» сохраняет значение исходного слова без излишнего уточнения их должности или правового положения.
- source_word: אֲשֶׁר בְּשַׁעַר הַמֶּלֶךְ
  choice: находившиеся у царских ворот
  rationale: Оборот определяет слуг по месту их нахождения. «У царских ворот» естественно по-русски обозначает придворное место службы и не сводит выражение лишь к дверному проёму.
- source_word: לְמָרְדֳּכָי
  choice: Мардохею
  rationale: Дательный падеж естественно передаёт адресата речи; использована традиционная русская форма имени.
- source_word: מַדּוּעַ אַתָּה
  choice: Почему ты
  rationale: Прямой вопрос о причине; местоимение сохраняет личное обращение к Мардохею.
- source_word: עוֹבֵר אֵת
  choice: нарушаешь
  rationale: В сочетании с объектом «повеление» глагол עבר означает преступать или нарушать установленное предписание. «Нарушаешь» ясно и естественно передаёт этот смысл, сохраняя оттенок перехода дозволенной границы.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: повеление царя
  rationale: מִצְוָה здесь обозначает царский приказ, а не специфически религиозную заповедь. «Повеление» сохраняет властный и официальный характер формулировки.
