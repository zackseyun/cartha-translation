  text: So Hathach went out to Mordecai[a], to the open square of the city that was in front of the king's gate.
translation:
  language: ru
  text: И вышел Хатах к Мардохею на городскую площадь[a], расположенную перед царскими воротами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на широкое место города»; еврейское слово обозначает открытую общественную площадь, а не обязательно улицу в современном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: И вышел
  rationale: Форма wayyiqtol передаёт завершённое последовательное действие в прошлом; «вышел» сохраняет направительный оттенок удаления из внутренних покоев.
- source_word: הֲתָךְ
  choice: Хатах
  rationale: Имя передано принятой русской библейской транслитерацией.
- source_word: אֶל מָרְדֳּכָי
  choice: к Мардохею
  rationale: Предлог אֶל в данном повествовательном контексте естественно обозначает движение к человеку.
- source_word: אֶל רְחוֹב הָעִיר
  choice: на городскую площадь
  rationale: רְחוֹב обозначает широкое открытое общественное пространство города; русское «площадь» точнее современного «улица».
- source_word: אֲשֶׁר לִפְנֵי
  choice: расположенную перед
  rationale: Оборот естественно выражает пространственное положение площади относительно ворот; причастная конструкция делает русскую фразу плавной.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: царскими воротами
  rationale: Сочетание передаёт принадлежность ворот царю и согласуется с устойчивой русской библейской лексикой книги Есфирь.
