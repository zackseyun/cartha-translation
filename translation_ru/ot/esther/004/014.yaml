language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י אִם הַחֲרֵ֣שׁ תַּחֲרִישִׁי֮ בָּ/עֵ֣ת הַ/זֹּאת֒ רֶ֣וַח וְ/הַצָּלָ֞ה יַעֲמ֤וֹד לַ/יְּהוּדִים֙ מִ/מָּק֣וֹם אַחֵ֔ר וְ/אַ֥תְּ וּ/בֵית אָבִ֖י/ךְ תֹּאבֵ֑דוּ וּ/מִ֣י יוֹדֵ֔עַ אִם לְ/עֵ֣ת כָּ/זֹ֔את הִגַּ֖עַתְּ לַ/מַּלְכֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/014.yaml
  text: For if you remain silent at this time, relief and deliverance will arise for the Jews from another place, but you and your father's house will perish. And who knows whether you have come to your royal position for a time like this?
translation:
  language: ru
  text: Ведь если ты будешь молчать в это время, облегчение и избавление придут к иудеям из другого места, а ты и дом твоего отца погибнете. И кто знает, не для такого ли времени ты достигла царского положения?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Ведь если
  rationale: Сочетание вводит условное обоснование предыдущего призыва; «ведь если» естественно передаёт и пояснительную, и условную связь.
- source_word: הַחֲרֵשׁ תַּחֲרִישִׁי
  choice: ты будешь молчать
  rationale: Инфинитив абсолютный усиливает личную форму глагола. В русском условная конструкция уже ясно передаёт намеренное продолжение молчания без тяжеловесного «совершенно промолчишь».
- source_word: בָּעֵת הַזֹּאת
  choice: в это время
  rationale: Прямо и естественно обозначает нынешний решающий момент.
- source_word: רֶוַח וְהַצָּלָה
  choice: облегчение и избавление
  rationale: «Облегчение» передаёт передышку от бедствия, а «избавление» — спасение от угрожающего уничтожения, не придавая выражению узкоспециального богословского смысла.
- source_word: יַעֲמֹד
  choice: придут
  rationale: Буквально глагол означает «встанет», но здесь речь о появлении помощи. «Придут» естественно сочетается с двумя однородными существительными в русском языке.
- source_word: לַיְּהוּדִים
  choice: к иудеям
  rationale: В книге Есфирь слово обозначает иудейский народ в Персидской державе; традиционное русское «иудеи» ясно в данном историческом контексте.
- source_word: מִמָּקוֹם אַחֵר
  choice: из другого места
  rationale: Сохраняет намеренно неопределённое указание на иной источник помощи и не называет Бога там, где еврейский текст этого не делает.
- source_word: וְאַתְּ וּבֵית אָבִיךְ
  choice: а ты и дом твоего отца
  rationale: «Дом отца» сохраняет еврейское родственно-династическое выражение и остаётся понятным современному читателю.
- source_word: תֹּאבֵדוּ
  choice: погибнете
  rationale: Передаёт как физическую гибель, так и уничтожение рода, сохраняя широту значения אבד.
- source_word: וּמִי יוֹדֵעַ אִם
  choice: И кто знает, не… ли
  rationale: Русская риторическая конструкция естественно выражает возможность, не превращая её в утверждение.
- source_word: הִגַּעַתְּ לַמַּלְכוּת
  choice: ты обрела царское достоинство
  rationale: Передаёт достижение царского статуса без ошибочного намёка на верховную власть Есфири; «обрела» не уточняет, была ли её роль результатом намерения, обстоятельств или провидения.
theological_decisions:
- issue: Косвенное указание на провидение в выражениях «из другого места» и «для такого времени»
  choice: Сохранить косвенность и не называть Бога прямо
  alternative: «Бог пошлёт иудеям избавление» или «Бог сделал тебя царицей для этого времени»
  rationale: Текст явно допускает мысль о Божьем провидении, но не называет Бога. Перевод сохраняет эту значимую недосказанность.
- issue: Цель или простое совпадение во фразе לְעֵת כָּזֹאת
  choice: «не для такого ли времени»
  alternative: «может быть, именно к такому времени»
  rationale: Предлог לְ допускает целевое прочтение, однако оборот «кто знает» сохраняет вопросительность и не превращает предполагаемое предназначение в прямое утверждение.
translation_notes:
  register: 'Современный литературный русский с торжественной, но понятной библейской интонацией. Синтаксис сохраняет движение еврейского стиха: условное предупреждение, противопоставление и заключительный риторический вопрос. Архаизмы и конфессионально маркированные пояснения не вводятся.'
