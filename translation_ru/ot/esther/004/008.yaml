review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт административный указ, его цель, поручение Хатаху и обращение Эсфири к царю. «Просить его за свой народ» передаёт ходатайство, но в современном русском может быть менее ясно: местоимение «его» легко воспринимается как прямое дополнение к «просить», а не как адресат прошения. «Ходатайствовать перед ним за свой народ» яснее выражает придворное прошение מִלְּפָנָיו עַל־עַמָּהּ.'
  naturalness: Фраза в целом литературна и понятна. «Чтобы тот показал её Эсфири и всё ей объяснил» грамматически возможно, однако «разъяснил ей её содержание» точнее связывает объяснение именно с документом и избегает немного расплывчатого «всё».
  terminology: «Мардохей», «Эсфирь», «Сузы», «царь», «указ» и «милость» уместны. Сноска к «копии» корректно отражает диапазон персидского заимствования פַּתְשֶׁגֶן.
  issues:
  - severity: low
    issue: Не вполне ясная формулировка ходатайства
    rationale: Оборот «просить его за свой народ» допустим, но «ходатайствовать перед ним за свой народ» естественнее и точнее передаёт обращение с просьбой в присутствии царя.
  - severity: low
    issue: «Всё ей объяснил» несколько расширяет и размывает объект сообщения
    rationale: Исходный текст велит показать документ Эсфири и сообщить ей о нём. «Разъяснить ей его содержание» сохраняет естественный русский синтаксис и явно относит объяснение к указу.
  revised_text: Мардохей также дал ему копию[a] письменного указа, изданного в Сузах об их уничтожении, чтобы тот показал её Эсфири, разъяснил ей её содержание и велел ей пойти к царю, умолять его о милости и ходатайствовать перед ним за свой народ.
