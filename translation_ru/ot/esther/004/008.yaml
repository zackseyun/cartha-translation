- from: Мардохей также дал ему копию[a] письменного указа, изданного в Сузах об их уничтожении, чтобы тот показал её Эсфири и всё ей объяснил, а также велел ей пойти к царю, умолять его о милости и просить его за свой народ.
  to: Мардохей также дал ему копию[a] письменного указа, изданного в Сузах об их уничтожении, чтобы тот показал её Эсфири, разъяснил ей её содержание и велел ей пойти к царю, умолять его о милости и ходатайствовать перед ним за свой народ.
