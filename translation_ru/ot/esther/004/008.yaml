  text: וְ/אֶת פַּתְשֶׁ֣גֶן כְּתָֽב הַ֠/דָּת אֲשֶׁר נִתַּ֨ן בְּ/שׁוּשָׁ֤ן לְ/הַשְׁמִידָ/ם֙ נָ֣תַן ל֔/וֹ לְ/הַרְא֥וֹת אֶת אֶסְתֵּ֖ר וּ/לְ/הַגִּ֣יד לָ֑/הּ וּ/לְ/צַוּ֣וֹת עָלֶ֗י/הָ לָ/ב֨וֹא אֶל הַ/מֶּ֧לֶךְ לְ/הִֽתְחַנֶּן ל֛/וֹ וּ/לְ/בַקֵּ֥שׁ מִ/לְּ/פָנָ֖י/ו עַל עַמָּֽ/הּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/008.yaml
  text: He also gave him a copy[a] of the written decree issued in Susa for their destruction, to show it to Esther and explain it to her, and to charge her to go to the king, implore his favor, and plead before him on behalf of her people.
translation:
  language: ru
  text: Мардохей также дал ему копию[a] письменного указа, изданного в Сузах об их уничтожении, чтобы тот показал её Эсфири, разъяснил ей её содержание и велел ей пойти к царю, умолять его о милости и ходатайствовать перед ним за свой народ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Персидское заимствованное слово, переведённое как «копия», может также обозначать текст официального документа.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב
  choice: копию письменного указа
  rationale: Персидское заимствование обозначает официальный документ либо его копию; «копия» естественно в данном повествовательном контексте, а более широкий диапазон отражён в сноске.
- source_word: הַדָּת
  choice: указа
  rationale: В придворном контексте книги Есфирь слово означает официальное царское постановление; «указ» точнее общего «закона».
- source_word: נִתַּן בְּשׁוּשָׁן
  choice: изданного в Сузах
  rationale: Пассивный глагол в административном контексте передаёт обнародование указа; название города дано в принятой русской форме.
- source_word: לְהַשְׁמִידָם
  choice: об их уничтожении
  rationale: Инфинитив с местоименным суффиксом выражает содержание и цель указа; формулировка сохраняет прямой смысл без эвфемизма.
- source_word: לְהַרְאוֹת אֶת אֶסְתֵּר וּלְהַגִּיד לָהּ
  choice: чтобы тот показал её Эсфири и всё ей объяснил
  rationale: В русском явно восстановлен объект «копию»; «всё ей объяснил» естественно передаёт поручение сообщить Эсфири содержание документа.
- source_word: וּלְצַוּוֹת עָלֶיהָ
  choice: а также велел ей
  rationale: «Велел» сохраняет обязательную силу צוה, не придавая Мардохею монаршего или официально-властного статуса.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ
  choice: пойти к царю
  rationale: Естественная современная формулировка; опасность доступа к царю раскрывается контекстом последующих стихов.
- source_word: לְהִתְחַנֶּן לוֹ
  choice: умолять его о милости
  rationale: Порода хитпаэль от חנן обозначает настойчивое моление о благосклонности или милости.
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו עַל עַמָּהּ
  choice: и просить его за свой народ
  rationale: Придворная идиома описывает прошение в присутствии царя; по-русски «просить его за свой народ» ясно передаёт ходатайство от имени народа.
