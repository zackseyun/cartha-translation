  language: ru
  text: И Мардохей пошёл[a] и сделал всё так, как повелела ему Есфирь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пошёл дальше»; буквально еврейский глагол означает «прошёл, перешёл», но здесь, вероятно, речь о том, что Мардохей отправился исполнять поручение Есфири.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: пошёл
  rationale: Глагол עבר буквально обозначает движение мимо, через или дальше; в данном контексте он указывает, что Мардохей отправился исполнять поручение Есфири. «Пошёл» естественно передаёт повествовательный смысл, а сноска сохраняет более буквальную пространственную окраску.
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Обычное значение עשה — «делать». Выбор сохраняет простоту еврейского повествования и не усиливает смысл до более интерпретирующего «исполнил».
- source_word: כְּכֹל אֲשֶׁר
  choice: всё так, как
  rationale: Оборот выражает полное соответствие повелению Есфири. Русское «сделал всё так, как» естественно и сохраняет всеохватность כֹּל.
- source_word: צִוְּתָה
  choice: повелела
  rationale: צוה означает «велеть, повелевать, приказывать». «Повелела» соответствует достоинству библейского регистра и не звучит столь резко, как «приказала».
- source_word: עָלָיו
  choice: ему
  rationale: При צוה предлог על отмечает адресата повеления; в современном русском это естественно передаётся дательным падежом «ему».
- source_word: אֶסְתֵּר
  choice: Есфирь
  rationale: Использована укоренившаяся в русской библейской традиции форма имени.
