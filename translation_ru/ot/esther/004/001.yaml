base_translation:
  language: en
  yaml_path: translation/ot/esther/004/001.yaml
  text: When Mordecai learned all that had been done[a], Mordecai tore his clothes and put on sackcloth and ashes. Then he went out into the midst of the city and cried out with a great and bitter cry.
translation:
  language: ru
  text: Когда Мардохей узнал обо всём, что было сделано, он разодрал свои одежды, возложил на себя вретище и пепел. Затем он вышел в середину города и громко и горько возопил.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «возопил великим и горьким воплем»; глагол и существительное одного корня усиливают выражение.'
    reason: Передаёт формальное усиление в еврейской конструкции וַיִּזְעַק זְעָקָה, не утяжеляя основной русский текст.
lexical_decisions:
- source_word: יָדַע
  choice: узнал
  rationale: В данном контексте глагол означает, что Мардохею стало известно о случившемся; «узнал» естественно передаёт это значение.
- source_word: כָּל אֲשֶׁר נַעֲשָׂה
  choice: обо всём, что было сделано
  rationale: Сохранена пассивная конструкция оригинала и её повествовательная отнесённость к уже совершившимся действиям.
- source_word: וַיִּקְרַע ... אֶת בְּגָדָיו
  choice: разодрал свои одежды
  rationale: Выражение ясно передаёт традиционный жест скорби и сохраняет конкретность еврейского текста.
- source_word: שַׂק וָאֵפֶר
  choice: облачился во вретище и посыпал себя пеплом
  rationale: В русском языке простое «надел вретище и пепел» неестественно; развёрнутая формулировка ясно передаёт два знака скорби, не меняя смысла.
- source_word: בְּתוֹךְ הָעִיר
  choice: на середину города
  rationale: Передаёт движение внутрь, в срединную часть города, не сужая значение до современного понятия «центр города».
- source_word: וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה
  choice: громко и горько возопил
  rationale: Естественная русская формулировка передаёт усиление, создаваемое однокоренными глаголом и существительным, а также значения «сильный/громкий» и «горький».
