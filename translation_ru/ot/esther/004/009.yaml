lexical_decisions:
- source_word: וַיָּב֖וֹא
  choice: пришёл
  rationale: Форма от בוא обозначает приход или прибытие. В контексте Гатах возвращается к Есфири после разговора с Мардохеем, поэтому «пришёл» естественно передаёт перспективу повествования.
- source_word: הֲתָךְ
  choice: Гатах
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: וַיַּגֵּ֣ד
  choice: передал
  rationale: Порода хифиль от נגד означает «сообщить, рассказать, передать». «Передал» естественно сочетается со «словами» и точно описывает посредническую роль Гатаха.
- source_word: לְאֶסְתֵּ֔ר
  choice: Есфири
  rationale: Предлог לְ отмечает адресата сообщения; по-русски это выражено дательным падежом.
- source_word: אֵ֖ת
  choice: '[отдельно не переводится]'
  rationale: Показатель определённого прямого дополнения, не имеющий самостоятельного лексического соответствия в русском языке.
- source_word: דִּבְרֵ֥י
  choice: слова
  rationale: Сопряжённая форма множественного числа от דָּבָר буквально означает «слова»; в данном контексте возможно также значение «сообщение» или «то, что сказал».
- source_word: מָרְדֳּכָֽי
  choice: Мардохея
  rationale: Личное имя передано принятой русской библейской формой; родительный падеж отражает конструкцию принадлежности.
