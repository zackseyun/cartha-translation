  source_fidelity: 'В целом перевод точно передаёт повеления, всеобщность обращения к иудеям в Сузах, полный пост, участие служанок, рискованное обращение к царю и решительное заключение. Однако русское «если погибнуть — погибну» грамматически и стилистически неудачно: инфинитив не воспроизводит повтор первого лица в еврейском אָבַדְתִּי אָבָדְתִּי. Следует: «если погибну — погибну».'
  naturalness: 'Текст современный и ясный. «Я вместе со своими служанками тоже буду поститься» естественнее, чем множественное «будем поститься»: оно позволяет сохранить еврейскую форму глагола в 1-м лице единственного числа при явном указании на участие служанок. «Не по закону» ближе к краткой формуле оригинала и естественно в данном регистре.'
  terminology: «Иудеи», «Сузы», «поститься», «царь» и «служанки» уместны. «Не по закону» передаёт כַּדָּת без неоправданной конкретизации характера закона. Формула «если погибну — погибну» сохраняет повтор корня и принятие риска, не навязывая догматического истолкования.
