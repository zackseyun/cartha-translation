source:
  edition: WLC
  text: לֵךְ֩ כְּנ֨וֹס אֶת כָּל הַ/יְּהוּדִ֜ים הַֽ/נִּמְצְאִ֣ים בְּ/שׁוּשָׁ֗ן וְ/צ֣וּמוּ עָ֠לַ/י וְ/אַל תֹּאכְל֨וּ וְ/אַל תִּשְׁתּ֜וּ שְׁלֹ֤שֶׁת יָמִים֙ לַ֣יְלָה וָ/י֔וֹם גַּם אֲנִ֥י וְ/נַעֲרֹתַ֖/י אָצ֣וּם כֵּ֑ן וּ/בְ/כֵ֞ן אָב֤וֹא אֶל הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר לֹֽא כַ/דָּ֔ת וְ/כַ/אֲשֶׁ֥ר אָבַ֖דְתִּי אָבָֽדְתִּי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/016.yaml
  text: Go[a], gather all the Jews who are found in Susa, and fast for me. Do not eat or drink for three days[b], night and day. I and my young women also will fast in the same way. Then I will go to the king, though it is not according to the law; and if I perish[e][d][c], I perish.
translation:
  language: ru
  text: '«Иди, собери всех иудеев, находящихся в Сузах, и поститесь ради меня[a]: не ешьте и не пейте три дня, ни ночью ни днём. Я вместе со своими служанками тоже буду поститься так же. После этого я пойду к царю, хотя это не по закону[b]. И если погибну — погибну[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поститесь за меня» — то есть в связи со мной и тем, что мне предстоит.'
    reason: Предлог עַל обозначает направленность поста на положение Эсфири; русские варианты «ради меня» и «за меня» передают близкие оттенки.
  - marker: b
    text: 'Буквально: «что не по закону».'
    reason: Сноска сохраняет более формальную структуру краткой еврейской фразы и её связь с персидским законом.
  - marker: c
    text: 'Возможный перевод: «и когда погибну, погибну». Краткое повторение в еврейском тексте выражает решимость Эсфири принять смертельный риск.'
    reason: Союзная конструкция допускает условное или временное понимание; важная неоднозначность сохранена в примечании.
lexical_decisions:
- source_word: לֵךְ כְּנוֹס
  choice: Иди, собери
  rationale: Два повелительных глагола переданы прямо и естественно, с сохранением последовательности еврейского текста.
- source_word: כָּל הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן
  choice: всех иудеев, находящихся в Сузах
  rationale: Причастие הַנִּמְצְאִים сохранено как «находящихся»; форма «Сузы» соответствует современному русскому названию древнего города.
- source_word: וְצוּמוּ עָלַי
  choice: и поститесь ради меня
  rationale: Предлог עַל указывает на пост в связи с Эсфирью и её положением; «ради меня» естественно передаёт эту направленность, не уточняя её сверх текста.
- source_word: וְאַל תֹּאכְלוּ וְאַל תִּשְׁתּוּ
  choice: не ешьте и не пейте
  rationale: Сохранены оба параллельных запрета и повторяющийся союз.
- source_word: שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם
  choice: три дня, ни ночью, ни днём
  rationale: Отрицательная формулировка по-русски ясно связывает «ночью и днём» с запретом есть и пить и подчёркивает непрерывность поста.
- source_word: גַּם אֲנִי וְנַעֲרֹתַי
  choice: Я и мои служанки тоже
  rationale: נַעֲרוֹתַי в дворцовом контексте естественно обозначает молодых женщин-служительниц; «служанки» ясно и современно передаёт их отношение к Эсфири.
- source_word: אָצוּם כֵּן
  choice: будем поститься так же
  rationale: Хотя глагол формально стоит в первом лице единственного числа, подлежащее включает Эсфирь и её служанок; русское множественное число требуется грамматически, а כֵּן отсылает к описанному посту.
- source_word: וּבְכֵן
  choice: После этого
  rationale: Оборот обозначает переход к действию после указанного поста; выбранный вариант передаёт последовательность без излишнего истолкования причинности.
- source_word: אֲשֶׁר לֹא כַדָּת
  choice: хотя это и против закона
  rationale: В контексте относительная конструкция имеет уступительный смысл; «против закона» кратко передаёт לֹא כַדָּת — «не согласно закону».
- source_word: וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי
  choice: И если погибнуть — погибну
  rationale: Терсая повторная формула выражает принятие смертельного риска. Русская конструкция сохраняет повтор корня, решительность и контекстуально вероятный условный оттенок.
theological_decisions:
- issue: Наличие молитвы или прямого обращения к Богу
  choice: Не добавлять молитву и не упоминать Бога
  alternative: Пояснить пост как пост и молитву перед Богом
  rationale: В еврейском тексте этого стиха Бог и молитва прямо не названы; добавление устранило бы характерную для книги Эсфирь сдержанность и вышло бы за пределы источника.
- issue: Степень предопределённости гибели в заключительной формуле
  choice: 'Сохранить условно-решительный смысл: «если погибнуть — погибну»'
  alternative: «Когда погибну, погибну» или безусловное «я погибну»
  rationale: כַאֲשֶׁר допускает оттенки «как», «когда» и в контексте «если»; риск реален, но исход не объявлен неизбежным. Формулировка сохраняет напряжение, не превращая слова Эсфири ни в пророчество, ни в простую вероятность.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи и без архаизмов. Повеления звучат решительно, заключение — кратко и афористично. Все примечания отмечены в основном тексте.
