- source_word: וּבְכָל מְדִינָה וּמְדִינָה
  choice: в каждой области
  rationale: Повтор существительного выражает distributive значение; по-русски оно естественно передаётся словом «каждой».
- source_word: מְקוֹם אֲשֶׁר
  choice: куда
  rationale: В сочетании с глаголом движения «доходили» кратко и естественно передаёт значение «всякое место, до которого».
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: слово царя и его указ
  rationale: «Слово» сохраняет конкретную лексику דָּבָר, а «указ» передаёт юридический характер דָּת в придворном контексте книги Есфирь.
- source_word: מַגִּיעַ
  choice: доходили
  rationale: Передаёт распространение царского сообщения и указа по областям; множественное число согласовано с двумя однородными подлежащими по нормам русского языка.
- source_word: אֵבֶל גָּדוֹל
  choice: великий траур
  rationale: אֵבֶל обозначает выраженный, в том числе обрядовый, траур; «великий» сохраняет силу определения גָּדוֹל и торжественный регистр.
- source_word: לַיְּהוּדִים
  choice: среди иудеев
  rationale: Передаёт иудеев как сообщество, охваченное трауром.
- source_word: וְצוֹם וּבְכִי וּמִסְפֵּד
  choice: с постом, плачем и причитаниями
  rationale: Перечень передаёт формы траура; «причитания» обозначают выраженное вслух оплакивание и отличают מִסְפֵּד от более общего «плача».
- source_word: שַׂק וָאֵפֶר
  choice: вретище и пепел
  rationale: Сохраняется традиционная библейская пара образов траура; «вретище» точно обозначает грубую ткань и соответствует достоинству регистра.
- source_word: יֻצַּע לָרַבִּים
  choice: многие лежали на
  rationale: Буквально пассивная форма означает «было постлано для многих». Контекстуальная русская передача связывает постланные вретище и пепел с теми, кто на них лежал, при этом буквальная конструкция и её неоднозначность отмечены в сноске.
