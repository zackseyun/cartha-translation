base_translation:
  language: en
  yaml_path: translation/ot/esther/004/004.yaml
  text: Esther’s young women and her eunuchs came and told her[a], and the queen was greatly distressed. She sent garments to clothe Mordecai and to remove his sackcloth from him[c][b], but he did not accept them.
translation:
  language: ru
  text: Молодые женщины, служившие Есфири[a], и её евнухи[b] пришли и сообщили ей. Царица была глубоко потрясена. Она послала одежду, чтобы одеть Мардохея и снять с него вретище[c], но он её не принял.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «молодые женщины»; в данном дворцовом контексте имеются в виду женщины, служившие Есфири.'
    reason: lexical_alternative
  - marker: b
    text: Слово «евнухи» в некоторых контекстах может обозначать царских придворных вообще, однако в обстановке дворца, описанной в книге Есфирь, вероятнее более конкретное значение.
    reason: cultural_note
  - marker: c
    text: Вретище — грубая одежда, которую носили в знак скорби, горя или унижения.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹת
  choice: молодые служанки
  rationale: Сочетание передаёт и обычное значение слова — молодых женщин, и их роль при Есфири в дворцовом контексте.
- source_word: וְסָרִיסֶיהָ
  choice: и её евнухи
  rationale: В царском дворце סָרִיס прежде всего обозначает евнуха, хотя иногда слово может употребляться шире — о придворном чиновнике.
- source_word: וַיַּגִּידוּ לָהּ
  choice: пришли и рассказали ей обо всём
  rationale: 'Передано повествовательное движение: женщины и евнухи пришли к Есфири и сообщили ей о происходящем; «обо всём» естественно восполняет подразумеваемое содержание сообщения.'
- source_word: וַתִּתְחַלְחַל
  choice: была глубоко потрясена
  rationale: Глагол выражает сильнейшее внутреннее смятение или содрогание; русское выражение ясно передаёт интенсивность без неоправданного сведения смысла к физической дрожи.
- source_word: בְּגָדִים
  choice: одежду
  rationale: Современное собирательное существительное естественно обозначает посланные предметы одежды и соответствует придворному контексту.
- source_word: לְהַלְבִּישׁ אֶת מָרְדֳּכַי
  choice: чтобы одеть Мардохея
  rationale: 'Сохранено целевое значение инфинитива и каузативный смысл: одежда предназначалась для того, чтобы Мардохея одели.'
- source_word: וּלְהָסִיר שַׂקּוֹ מֵעָלָיו
  choice: и снять с него вретище
  rationale: Формулировка сохраняет конкретное действие удаления траурного одеяния и звучит естественно по-русски.
- source_word: שַׂקּוֹ
  choice: вретище
  rationale: Традиционный точный русский термин для грубой одежды, которую носили в знак скорби; культурное значение пояснено в сноске.
- source_word: וְלֹא קִבֵּל
  choice: но он её не принял
  rationale: Подразумеваемым объектом являются посланные предметы одежды; местоимение женского рода согласуется с русским собирательным словом «одежда» и ясно передаёт отказ Мардохея.
