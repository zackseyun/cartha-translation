  text: Тогда Эсфирь сказала Гатаху и велела ему пойти к Мардохею[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и велела ему к Мардохею». В еврейском тексте после «велела ему» опущен глагол движения; по контексту подразумевается: «пойти к Мардохею».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Тогда Эсфирь сказала
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию, а אמר сохраняется обычным русским «сказала».
- source_word: לַהֲתָךְ
  choice: Гатаху
  rationale: Предлог ל обозначает адресата речи. Имя הֲתָךְ передано в принятой русской библейской форме «Гатах».
- source_word: וַתְּצַוֵּהוּ
  choice: и велела ему
  rationale: Пиэль צוה выражает распоряжение или повеление; «велела» естественно и достаточно сильно передаёт его здесь. Местоименный суффикс относится к Гатаху.
- source_word: אֶל מָרְדֳּכָי
  choice: передать Мардохею
  rationale: Буквально стоит лишь направление «к Мардохею», без выраженного глагола. В контексте обмена сообщениями подразумевается поручение обратиться к Мардохею; «передать» делает русскую фразу завершённой, не добавляя содержания самого сообщения.
