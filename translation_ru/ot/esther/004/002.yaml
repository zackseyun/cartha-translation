lexical_decisions:
- source_word: וַיָּבֹא
  choice: Он дошёл
  rationale: Глагол בוא в повествовательной форме описывает приближение Мардохея; «дошёл» естественно сочетается с עַד и подчёркивает достигнутый предел движения.
- source_word: עַד לִפְנֵי
  choice: до места перед
  rationale: Сочетание обозначает движение лишь до точки непосредственно перед воротами, без входа внутрь. Формулировка сохраняет и предел, и пространственный смысл.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: царские ворота
  rationale: Естественная русская передача сочетания со значением принадлежности царю; множественное число «ворота» соответствует современной русской норме.
- source_word: כִּי אֵין לָבוֹא
  choice: потому что … нельзя было входить
  rationale: Конструкция אֵין с инфинитивом здесь выражает невозможность или запрет. Безличное «нельзя было» передаёт это, не добавляя явно не названного субъекта.
- source_word: אֶל שַׁעַר הַמֶּלֶךְ
  choice: в царские ворота
  rationale: Предлог אֶל допускает направительное значение «к/в»; по контексту имеется в виду вход в ворота или через них.
- source_word: בִּלְבוּשׁ שָׂק
  choice: в одежде из мешковины
  rationale: Формулировка близко передаёт буквальное «в одежде из мешковины» и ясно обозначает траурное одеяние, не уточняя сверх текста его вид или количество.
