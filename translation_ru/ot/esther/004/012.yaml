  text: וַ/יַּגִּ֣ידוּ לְ/מָרְדֳּכָ֔י אֵ֖ת דִּבְרֵ֥י אֶסְתֵּֽר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/012.yaml
  text: And they told Mordecai Esther’s words[a].
translation:
  language: ru
  text: И передали Мардохею слова Есфири[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сообщение Есфири»; или: «ответ Есфири».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: И передали
  rationale: Повествовательная форма вводит следующее действие, а подлежащее остаётся неопределённым множественным. «Передали» естественно описывает передачу ответа через посредников.
- source_word: לְמָרְדֳּכָי
  choice: Мардохею
  rationale: Предлог לְ отмечает адресата; в русском это естественно передаётся дательным падежом. Имя дано в принятой русской библейской форме.
- source_word: אֵת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия; его функция выражена синтаксисом.
- source_word: דִּבְרֵי
  choice: слова
  rationale: Форма сопряжённого множественного числа от דָּבָר допускает значения «слова», «сообщение» или по контексту «ответ». «Слова» наиболее прозрачно следует еврейскому тексту и сохраняет связь с речью Есфири.
- source_word: אֶסְתֵּר
  choice: Есфири
  rationale: Сопряжённая конструкция передана родительным падежом; использована принятая русская форма имени.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, естественным повествовательным синтаксисом. Союз «И» сохраняет последовательность еврейского рассказа; «слова» оставляет лексическую широту דִּבְרֵי, а контекстуальные варианты вынесены в примечание.
