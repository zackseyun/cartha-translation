  yaml_path: translation/ot/esther/004/005.yaml
  text: Then Esther called for Hathach[a], one of the king’s eunuchs, whom he had appointed to attend her, and commanded him concerning Mordecai, to learn what this was and why it was.
translation:
  language: ru
  text: 'Тогда Есфирь позвала Гафа́ха[a], одного из царских евнухов, которого царь назначил состоять при ней, и велела ему разузнать о Мардохее: что случилось и почему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одного из царских придворных». Еврейское слово может обозначать как евнуха, так и, в некоторых контекстах, царского придворного или чиновника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא
  choice: Тогда Есфирь позвала
  rationale: Форма wayyiqtol продолжает последовательность повествования; «тогда» естественно передаёт переход к следующему действию, а «позвала» — вызов человека к себе.
- source_word: לַהֲתָךְ
  choice: Гата́ха
  rationale: Личное имя передано традиционной русской библейской формой; ударение отмечено для удобства чтения.
- source_word: מִסָּרִיסֵי הַמֶּלֶךְ
  choice: одного из царских евнухов
  rationale: סָרִיס обычно обозначает евнуха при царском дворе, хотя слово может употребляться и шире в значении придворного служащего; эта возможность сохранена в сноске.
- source_word: אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ
  choice: которого царь приставил служить ей
  rationale: Подразумеваемый субъект каузативного глагола — царь; выражение передаёт официальное назначение состоять при Есфири, не воспроизводя неестественно буквальное «поставил перед ней».
- source_word: וַתְּצַוֵּהוּ עַל מָרְדֳּכָי
  choice: и велела ему разузнать о Мардохее
  rationale: Глагол сохраняет значение распоряжения, а сочетание с עַל указывает на Мардохея как предмет порученного расспроса. В русском цель поручения естественно включается в конструкцию с «разузнать».
- source_word: לָדַעַת
  choice: разузнать
  rationale: Инфинитив выражает цель поручения; «разузнать» естественно обозначает получение сведений через посланника.
- source_word: מַה זֶּה וְעַל מַה זֶּה
  choice: что случилось и почему
  rationale: Парная формула спрашивает о сущности происходящего и его причине. Идиоматическая русская передача сохраняет различие между двумя вопросами, не уточняя сверх текста, что именно произошло.
