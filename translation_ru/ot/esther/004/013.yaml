  yaml_path: translation/ot/esther/004/013.yaml
  text: Then Mordecai said to reply to Esther, “Do not imagine that you alone of all the Jews will escape in the king’s house.
translation:
  language: ru
  text: 'И Мардохей велел ответить Есфири: «Не думай, что ты одна спасёшься в доме царя, в отличие от всех иудеев».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מָרְדֳּכַי לְהָשִׁיב
  choice: И Мардохей велел ответить
  rationale: Конструкция буквально означает «сказал, чтобы ответить», но в данном контексте естественно передаёт распоряжение дать Есфири ответ, не добавляя отсутствующего в масоретском тексте местоимения «им».
- source_word: אַל תְּדַמִּי בְנַפְשֵׁךְ
  choice: Не думай
  rationale: Идиома означает «не воображай/не считай про себя»; краткое русское выражение естественно передаёт внутреннюю уверенность, от которой Мардохей предостерегает Есфирь.
- source_word: לְהִמָּלֵט
  choice: спасёшься
  rationale: Нифаль инфинитива מלט обозначает избавление, ускользание от опасности; «спасёшься» ясно и уместно в контексте угрозы уничтожения.
- source_word: בֵּית הַמֶּלֶךְ
  choice: в царском доме
  rationale: Сохраняет образ исходного текста и допускает значение царского дворца или принадлежности к царскому двору.
- source_word: מִכָּל הַיְּהוּדִים
  choice: одна из всех иудеев
  rationale: 'Предлог מן допускает сравнительно-исключительный смысл: Есфирь не должна считать, будто именно она, в отличие от всех остальных иудеев, избежит участи народа.'
theological_decisions:
- issue: Объём обещанного избавления
  choice: ты одна из всех иудеев спасёшься
  alternative: спасёшься больше всех иудеев
  rationale: Выбранный вариант передаёт контекстуальный смысл сравнения, не превращая слова Мардохея ни в обещание общего спасения, ни в утверждение о степени безопасности.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Сохранено традиционное написание имён «Мардохей» и «Есфирь»; синтаксис сделан естественным без добавления невыраженного адресата-посредника.
