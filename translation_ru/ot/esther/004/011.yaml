source:
  edition: WLC
  text: כָּל עַבְדֵ֣י הַ/מֶּ֡לֶךְ וְ/עַם מְדִינ֨וֹת הַ/מֶּ֜לֶךְ יֽוֹדְעִ֗ים אֲשֶׁ֣ר כָּל אִ֣ישׁ וְ/אִשָּׁ֡ה אֲשֶׁ֣ר יָבֽוֹא אֶל הַ/מֶּלֶךְ֩ אֶל הֶ/חָצֵ֨ר הַ/פְּנִימִ֜ית אֲשֶׁ֣ר לֹֽא יִקָּרֵ֗א אַחַ֤ת דָּת/וֹ֙ לְ/הָמִ֔ית לְ֠/בַד מֵ/אֲשֶׁ֨ר יֽוֹשִׁיט ל֥/וֹ הַ/מֶּ֛לֶךְ אֶת שַׁרְבִ֥יט הַ/זָּהָ֖ב וְ/חָיָ֑ה וַ/אֲנִ֗י לֹ֤א נִקְרֵ֨אתי֙ לָ/ב֣וֹא אֶל הַ/מֶּ֔לֶךְ זֶ֖ה שְׁלוֹשִׁ֥ים יֽוֹם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/011.yaml
  text: 'All the king’s servants and the people of the king’s provinces know that for any man or woman who goes to the king in the inner court without being summoned[a], there is one law for him: to be put to death, except for the one to whom the king extends the golden scepter, so that he may live. But as for me[b], I have not been summoned to go in to the king these thirty days.'
translation:
  language: ru
  text: '«Все слуги царя и жители царских областей знают: если какой-либо мужчина или женщина войдёт к царю во внутренний двор без вызова[a], закон для него один: предать смерти. Исключение — лишь тот, кому царь протянет золотой скипетр и кто останется жив. А меня вот уже тридцать дней не вызывали войти к царю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будучи позван». Еврейская форма означает, что человек не был официально вызван к царю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: слуги царя
  rationale: Сохраняет широкий смысл людей на царской службе и не сужает его до чиновников или придворных.
- source_word: וְעַם מְדִינוֹת הַמֶּלֶךְ
  choice: и жители царских областей
  rationale: עַם здесь обозначает население по всей империи; «жители» естественнее русского буквального «народ областей», а «области» ясно передаёт административные единицы.
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: для всякого мужчины или женщины
  rationale: Сохраняет явное упоминание обоих полов и распределительное значение כָּל.
- source_word: יָבוֹא אֶל הַמֶּלֶךְ אֶל הֶחָצֵר הַפְּנִימִית
  choice: войдёт к царю во внутренний двор
  rationale: Передаёт как приближение к царю, так и вход в ограниченную внутреннюю часть дворца.
- source_word: אֲשֶׁר לֹא יִקָּרֵא
  choice: без вызова
  rationale: Естественно передаёт официальное приглашение или вызов к царю в рамках дворцового протокола.
- source_word: אַחַת דָּתוֹ לְהָמִית
  choice: закон один — смерть
  rationale: Сжато сохраняет еврейскую идиому «один у него закон» и ясно выражает установленную смертную кару.
- source_word: לְבַד מֵאֲשֶׁר
  choice: исключение лишь для того, кому
  rationale: Ясно обозначает единственное исключение из общего правила.
- source_word: יוֹשִׁיט לוֹ הַמֶּלֶךְ
  choice: кому царь протянет
  rationale: «Протянет» естественно описывает направленное к человеку движение скипетра.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: золотой скипетр
  rationale: Устоявшееся и точное русское обозначение царского знака власти.
- source_word: וְחָיָה
  choice: тот останется жив
  rationale: 'Передаёт результат царского жеста: человек избегает предусмотренной законом смерти.'
- source_word: זֶה שְׁלוֹשִׁים יוֹם
  choice: вот уже тридцать дней
  rationale: Естественно выражает длительность состояния вплоть до момента речи.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством дворцовой речи. Синтаксис разделён на ясные смысловые отрезки; формула «закон один — смерть» сохраняет резкость и юридическую безусловность оригинала. Местоименная форма в последнем предложении передана без отдельной сноски, поскольку присланная английская сноска [b] по содержанию относится к идиоме אַחַת דָּתוֹ, а не к וַאֲנִי; русская формулировка передаёт эту идиому непосредственно.
