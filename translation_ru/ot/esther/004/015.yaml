- source_word: אֶסְתֵּר
  choice: Есфирь
  rationale: Традиционная и общепонятная русская форма имени.
- source_word: לְהָשִׁיב
  choice: передать ... ответ
  rationale: Каузативный инфинитив от שוב буквально выражает возвращение ответа; в данном контексте естественное русское соответствие — «передать ответ».
- source_word: אֶל
  choice: Мардохею
  rationale: Направление, выраженное предлогом אֶל, естественно передано русским дательным падежом при «передать».
- source_word: מָרְדֳּכָי
  choice: Мардохей
  rationale: Традиционная и общепонятная русская форма имени; в тексте употреблён дательный падеж «Мардохею».
