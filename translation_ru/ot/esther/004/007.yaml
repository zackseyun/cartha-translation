    issue: «в царскую казну» передаёт множественное число как единственное.
    rationale: Еврейское גִּנְזֵי стоит во множественном числе и обозначает царские сокровищницы или хранилища. В данном месте сохранение множественного числа возможно без потери естественности.
  - severity: medium
    issue: «за истребление иудеев» не вполне прозрачно передаёт целевой инфинитив.
    rationale: Лְאַבְּדָם обозначает цель предложенного взноса — чтобы уничтожить иудеев. «За» в русском может читаться как плата за результат или вознаграждение; придаточное цели точнее.
  - severity: low
