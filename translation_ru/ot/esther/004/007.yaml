    text: 'Или: «подробностях о деньгах» или «сумме денег». Еврейское выражение обозначает названную Аманом сумму, которую он предлагал внести.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: рассказал
  rationale: Глагол в породе hифиль означает «сообщить, рассказать»; этот вариант естественен для современного русского повествования.
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  choice: обо всём, что с ним произошло
  rationale: Передаёт и полноту выражения, и местоименный суффикс «с ним».
- source_word: פָּרָשַׁת הַכֶּסֶף
  choice: точную сумму денег
  rationale: В контексте выражение указывает на конкретно названную сумму, предложенную Аманом; такой перевод ясен и соответствует последующему упоминанию взвешивания денег.
- source_word: אָמַר ... לִשְׁקוֹל
  choice: обещал отвесить
  rationale: Буквально конструкция означает «сказал отвесить»; по контексту это предложение или обещание платежа. «Отвесить» сохраняет образ определения серебра по весу.
- source_word: עַל גִּנְזֵי הַמֶּלֶךְ
  choice: в царскую казну
  rationale: Передаёт направление платежа в хранилища царя; единственное число «казна» идиоматично по-русски, хотя в еврейском стоит множественное число.
- source_word: ביהודיים לְאַבְּדָם
  choice: за истребление иудеев
  rationale: Передаёт цель предложенного платежа и объект действия; «истребление» выражает каузативно-интенсивное значение формы אבד без дополнительного усиления.
