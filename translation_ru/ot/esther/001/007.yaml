  rationale: Убрано неявно добавленное «все», сохранён характерный повтор «сосуды», а заключительная еврейская идиома передана более естественно и прозрачно. Смысл и регистр исходного текста сохранены; с английским POB согласуются разнообразие сосудов, обилие царского вина и царская щедрость.
