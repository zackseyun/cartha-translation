  yaml_path: translation/ot/esther/001/007.yaml
  text: Drinks were served in vessels of gold, with vessels differing from vessel to vessel, and royal wine in abundance, according to the king’s bounty.
translation:
  language: ru
  text: Напитки подавали в золотых сосудах; сосуды отличались один от другого, а царского вина было в изобилии — по щедрости царя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשְׁקוֹת
  choice: Напитки подавали
  rationale: Инфинитивная форма в контексте перечисления устройства пира естественно передаётся русской глагольной конструкцией; «напитки» сохраняет общее значение, хотя далее особо названо вино.
- source_word: וְכֵלִים מִכֵּלִים שׁוֹנִים
  choice: причём все сосуды отличались друг от друга
  rationale: Передаёт идиоматический смысл буквального «сосуды от сосудов различались» естественным современным русским языком.
- source_word: וְיֵין מַלְכוּת
  choice: Царского вина
  rationale: Сочетание обозначает вино из царских запасов или вино, предоставленное царём; краткое определение сохраняет связь с царём без лишнего уточнения.
- source_word: רָב כְּיַד הַמֶּלֶךְ
  choice: было в изобилии — с царской щедростью
  rationale: רָב означает большое количество, а идиома כְּיַד הַמֶּלֶךְ указывает на щедрость или достаток, соответствующий возможностям царя. Тире ясно связывает изобилие с царской щедростью.
