base_translation:
  language: en
  yaml_path: translation/ot/esther/001/001.yaml
  text: It happened in the days of Ahasuerus—the Ahasuerus who reigned from India to Cush[b][a], over one hundred twenty-seven provinces—
translation:
  language: ru
  text: Это было во дни Ахашвероша[a] — того самого Ахашвероша, который царствовал от Индии до Куша[b] над ста двадцатью семью областями —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Ксеркса», если передавать имя согласно принятому историческому отождествлению персидского царя, а не транслитерировать еврейскую форму.
    reason: alternative_reading
  - marker: b
    text: 'Куш — древнее название области; в некоторых переводах: «Эфиопия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Это было
  rationale: Стандартное повествовательное вступление передано естественно для современного русского языка; «это» служит русской синтаксической опорой и не добавляет отдельного смыслового утверждения.
- source_word: בִּימֵי
  choice: во дни
  rationale: Устойчивое и понятное литературное обозначение времени, близкое форме еврейского выражения.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ахашверош
  rationale: Имя транслитерировано непосредственно с еврейской формы, без подмены историческим отождествлением.
- source_word: הוּא אֲחַשְׁוֵרוֹשׁ
  choice: того самого Ахашвероша
  rationale: Передаёт уточняющую, идентифицирующую силу местоимения הוּא и повторённого имени естественным русским оборотом.
- source_word: הַמֹּלֵךְ
  choice: который царствовал
  rationale: Причастие описывает Ахашвероша через его правление; придаточное предложение звучит по-русски естественно.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: от Индии до Куша
  rationale: Ходду традиционно понимается как Индия, а древний топоним Куш сохранён без отождествления с современным государством Эфиопия.
- source_word: שֶׁבַע וְעֶשְׂרִים וּמֵאָה
  choice: ста двадцатью семью
  rationale: Число передано в обычном русском порядке и поставлено в требуемый управлением творительный падеж.
- source_word: מְדִינָה
  choice: областями
  rationale: В контексте Персидской державы слово обозначает административно-территориальные единицы; «области» понятно современному читателю и не навязывает более узкое отождествление с сатрапиями.
