  text: while he displayed the riches of the glory of his kingdom and the splendor of the honor of his greatness for many days—one hundred and eighty days.
translation:
  language: ru
  text: показывая богатство славы своего царства и блеск великолепия своего величия в течение многих дней — ста восьмидесяти дней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּהַרְאֹתוֹ
  choice: Он… показывал
  rationale: Инфинитивная конструкция обозначает продолженное действие царя; в контексте предыдущего стиха естественно передана личной формой.
- source_word: עֹשֶׁר כְּבוֹד מַלְכוּתוֹ
  choice: богатство славы своего царства
  rationale: 'Сохранена накопительная именная конструкция оригинала: материальное богатство служит проявлением славы царства.'
- source_word: יְקָר תִּפְאֶרֶת גְּדוּלָּתוֹ
  choice: великолепие, свидетельствующее о величии его могущества
  rationale: יְקָר передаёт ценность, почёт и великолепие, תִּפְאֶרֶת — блеск и красоту, а גְּדֻלָּה в царском контексте — могущество/величие. Формулировка сохраняет различие с כָּבוֹד и избегает неестественной цепочки родительных падежей.
- source_word: יָמִים רַבִּים שְׁמוֹנִים וּמְאַת יוֹם
  choice: много дней — сто восемьдесят дней
  rationale: Сохранены и общее указание на длительность, и последующее точное число; тире передаёт пояснительное присоединение.
