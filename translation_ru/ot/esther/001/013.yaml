  text: Then the king said to the wise men who knew the times—for this was the king’s procedure before all who knew law and judgment—
translation:
  language: ru
  text: 'Тогда царь сказал мудрецам, знавшим времена,[a] — ибо таков был порядок у царя: его дело представляли всем, кто знал закон и суд, —'
  philosophy: optimal-equivalence
  footnotes:
