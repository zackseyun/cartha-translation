    text: 'Буквально: «знавшим времена». Выражение неоднозначно; оно может обозначать людей, сведущих в сроках и подходящих случаях, а также в календарных или астрологических расчётах.'
    reason: Сохраняет буквальное необычное выражение оригинала и поясняет его возможные значения, не выбирая одно из них.
lexical_decisions:
- source_word: יֹדְעֵי הָעִתִּים
  choice: знавшим времена
  rationale: Сохраняет необычное и допускающее разные понимания выражение оригинала; примечание поясняет возможный смысл, не сводя его исключительно к астрологии или календарным знаниям.
- source_word: כִּי כֵן דְּבַר הַמֶּלֶךְ לִפְנֵי
  choice: ведь царские дела по установленному порядку рассматривались перед
  rationale: Передаёт эллиптическую формулу как описание принятой царской процедуры; «рассматривались» восполняет подразумеваемое действие и естественно связывается с לִפְנֵי — «перед».
- source_word: דָּת וָדִין
  choice: закона и суда
  rationale: 'Сохраняет парность понятий: установленный закон и судебное разбирательство/решение, не заменяя второе отвлечённым конфессионально окрашенным понятием справедливости.'
