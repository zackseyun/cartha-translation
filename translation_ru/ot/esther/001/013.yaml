  naturalness: «Знавшим времена» уместно сохраняет необычность оригинала и в сочетании с примечанием понятно. Исправленная формулировка более прямо и естественно передаёт придворную процедуру, не превращая её в утверждение о том, что дела именно рассматривались.
  terminology: '«Закон и суд» адекватно передаёт דָּת וָדִין и сохраняет парность терминов. Пояснение к «временам» следует оставить нейтральным: «придворные установления» не является прямым значением этого выражения.'
