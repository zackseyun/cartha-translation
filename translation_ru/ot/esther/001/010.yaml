base_translation:
  language: en
  yaml_path: translation/ot/esther/001/010.yaml
  text: On the seventh day[a], when the king’s heart was merry with wine, he told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar[b], and Karkas—the seven eunuchs who attended King Ahasuerus—
translation:
  language: ru
  text: В седьмой день, когда сердцу царя было весело от вина[a], он сказал Мехуману, Бизте, Харбоне, Бигте, Авагте, Зетару и Каркасу — семи евнухам[b], служившим при царе Ахашвероше, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда сердце царя было весело от вина». Эти слова прямо не утверждают, что царь был пьян.'
    reason: lexical_alternative
  - marker: b
    text: Слово «евнухи» в некоторых контекстах может обозначать придворных служителей или чиновников вообще.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: В седьмой день
  rationale: Естественная русская передача обстоятельства времени; уточнение «пира» в самом стихе отсутствует.
- source_word: כְּטוֹב לֵב הַמֶּלֶךְ בַּיָּיִן
  choice: когда сердце царя развеселилось от вина
  rationale: Сохраняет образ еврейской идиомы и причинную связь с вином, не усиливая смысл до прямого утверждения об опьянении.
- source_word: אָמַר
  choice: он сказал
  rationale: Основное значение глагола — «сказал». Содержание сказанного появляется лишь в следующем стихе, поэтому перевод не добавляет отсутствующего здесь повеления.
- source_word: לִמְהוּמָן בִּזְּתָא חַרְבוֹנָא בִּגְתָא וַאֲבַגְתָא זֵתַר וְכַרְכַּס
  choice: Мехуману, Бизте, Харбоне, Бигте, Авагте, Зетару и Каркасу
  rationale: Имена переданы русской транслитерацией, близкой к их масоретскому звучанию, с падежными окончаниями по нормам современного русского языка.
- source_word: שִׁבְעַת הַסָּרִיסִים
  choice: семи евнухам
  rationale: «Евнухи» — прямое и контекстуально уместное значение слова סָרִיס при царском дворе; более широкое значение «придворные чиновники» отмечено в сноске.
- source_word: הַמְשָׁרְתִים אֶת פְּנֵי
  choice: служившим при
  rationale: Естественно передаёт придворное служение в личном присутствии царя, выраженное оборотом «служившие перед лицом».
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: царе Ахашвероше
  rationale: Имя передано непосредственно по еврейской форме, без подстановки исторической идентификации; титул и имя оформлены естественно для русского предложения.
