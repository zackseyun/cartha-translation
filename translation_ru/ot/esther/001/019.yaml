  text: אִם עַל הַ/מֶּ֣לֶךְ ט֗וֹב יֵצֵ֤א דְבַר מַלְכוּת֙ מִ/לְּ/פָנָ֔י/ו וְ/יִכָּתֵ֛ב בְּ/דָתֵ֥י פָֽרַס וּ/מָדַ֖י וְ/לֹ֣א יַעֲב֑וֹר אֲשֶׁ֨ר לֹֽא תָב֜וֹא וַשְׁתִּ֗י לִ/פְנֵי֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וּ/מַלְכוּתָ/הּ֙ יִתֵּ֣ן הַ/מֶּ֔לֶךְ לִ/רְעוּתָ֖/הּ הַ/טּוֹבָ֥ה מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/019.yaml
  text: 'If it seems good to the king[a], let a royal decree go out from before him and be written among the laws of Persia and Media, so that it may not be revoked: that Vashti is not to come before King Ahasuerus[c][b], and let the king give her royal position to another woman better than she.'
translation:
  language: ru
  text: 'Если царю угодно[a], пусть от него выйдет царский указ и будет внесён в законы Персии и Мидии, чтобы его нельзя было отменить[b]: Вастии не являться перед царём Ахашверошем, а её царское положение[c] пусть царь передаст другой женщине, которая лучше неё.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если царю это представляется правильным».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «чтобы его нельзя было изменить» или «чтобы его нельзя было нарушить». Еврейский оборот подчёркивает неизменную юридическую силу указа.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «её царство», «её царская власть» или «её царствование»; здесь имеется в виду её положение царицы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Если царю угодно
  rationale: Придворная формула почтительного предложения; по-русски естественно передаёт зависимость решения от царского одобрения.
- source_word: יֵצֵא דְבַר מַלְכוּת מִלְּפָנָיו
  choice: пусть от него выйдет царский указ
  rationale: דְבַר מַלְכוּת обозначает официальное царское постановление, а מִלְּפָנָיו — его исхождение от царя и его власти.
- source_word: וְיִכָּתֵב בְּדָתֵי פָרַס וּמָדַי
  choice: и будет внесён в законы Персии и Мидии
  rationale: Речь идёт не просто о записи текста, а о включении указа в признанный свод законов; сохранён порядок названий в еврейском тексте.
- source_word: וְלֹא יַעֲבוֹר
  choice: чтобы его нельзя было отменить
  rationale: В юридическом контексте оборот указывает на неизменную силу постановления; буквальное «не пройдёт» по-русски неясно.
- source_word: אֲשֶׁר לֹא תָבוֹא וַשְׁתִּי
  choice: Вастии не являться
  rationale: Русская конструкция с инфинитивом кратко и ясно выражает содержание официального запрета.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ахашверош
  rationale: Передаёт еврейскую форму имени непосредственно, не подменяя её традиционным, но неточным отождествлением с Артаксерксом.
- source_word: וּמַלְכוּתָהּ
  choice: её царское достоинство
  rationale: Здесь מַלְכוּת означает статус и положение Вастии как царицы, а не территориальное царство.
- source_word: לִרְעוּתָהּ
  choice: другой женщине
  rationale: В контексте замены Вастии слово обозначает другую женщину; буквальные варианты «подруге» или «ближней» могли бы ошибочно подразумевать личные отношения.
- source_word: הַטּוֹבָה מִמֶּנָּה
  choice: которая лучше неё
  rationale: Сохранено открытое оценочное сравнение без добавления не названных в тексте нравственных или социальных качеств.
