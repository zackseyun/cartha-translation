base_translation:
  language: en
  yaml_path: translation/ot/esther/001/015.yaml
  text: According to the law[c][b][a], what is to be done with Queen Vashti because she did not carry out the command of King Ahasuerus delivered by the eunuchs?
translation:
  language: ru
  text: «Как, согласно закону[a], следует поступить с царицей Вашти за то, что она не исполнила повеления царя Ахашвероша, переданного через евнухов[b][c]?»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по установленному порядку».'
    reason: lexical_alternative
  - marker: b
    text: Древнееврейское слово может обозначать также придворных служителей, хотя более прямой перевод — «евнухи».
    reason: cultural_note
  - marker: c
    text: 'Буквально: «рукой евнухов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדָת
  choice: по закону
  rationale: Слово דָּת в книге Есфирь обычно обозначает закон или официальное установление персидского двора; выражение «по закону» сохраняет юридический характер вопроса.
- source_word: מַה לַּעֲשׂוֹת בַּמַּלְכָּה וַשְׁתִּי
  choice: как следует поступить с царицей Вашти
  rationale: Русская безличная конструкция естественно передаёт совещательный и юридический оттенок оборота, а предлог «с» не усиливает враждебность действия.
- source_word: עַל אֲשֶׁר לֹא עָשְׂתָה אֶת מַאֲמַר
  choice: за то, что она не исполнила повеления
  rationale: Оборот указывает основание для предполагаемой меры. «Не исполнила повеления» естественно передаёт буквальное «не сделала повеления», не подменяя его более толковательным «не повиновалась».
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: царя Ахашвероша
  rationale: Царский титул переведён, а древнееврейская форма имени передана транслитерацией с учётом русской фонетики.
- source_word: בְּיַד הַסָּרִיסִים
  choice: переданного через евнухов
  rationale: Буквальное «рукой евнухов» является идиомой посредничества; «переданного через евнухов» ясно выражает их роль в доставке царского повеления.
