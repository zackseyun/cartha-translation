lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Устойчивое повествовательное обозначение времени, сохраняющее указательное значение еврейского выражения.
- source_word: כְּשֶׁבֶת
  choice: когда … сидел
  rationale: Предлог כְּ с инфинитивом образует временную конструкцию; русский оборот естественен и не превращает образ сидения на престоле в более толковательное «царствовал».
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: царь Ахашверош
  rationale: Имя передано прямой транслитерацией еврейской формы, а титул поставлен перед именем по нормам русского языка.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: на своём царском престоле
  rationale: Естественно передаёт буквальное «на престоле своего царства/царствования» и сохраняет притяжательный суффикс.
- source_word: בְּשׁוּשַׁן
  choice: в … Сузах
  rationale: Использовано принятое в современном русском языке название древнего города; предложная форма включена в конструкцию «в крепости Сузы».
- source_word: הַבִּירָה
  choice: крепости
  rationale: Слово обозначает укреплённый дворцово-административный комплекс или цитадель; «крепость» понятно современному читателю и уместно в сочетании с названием города.
