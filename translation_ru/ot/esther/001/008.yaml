base_translation:
  language: en
  yaml_path: translation/ot/esther/001/008.yaml
  text: 'And the drinking was according to the law: there was no compulsion[c][b][a], for so the king had instructed every official of his household to do according to the desire of each man.'
translation:
  language: ru
  text: 'Питьё происходило по установленному правилу[a]: принуждения не было[b], потому что царь предписал всем распорядителям своего дома поступать по желанию каждого[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по закону» либо «по предписанию»; еврейское слово может обозначать закон, указ или установленное правило.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «принуждения не было»; то есть никого не заставляли пить.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «по желанию человека и человека»; повторительное еврейское выражение означает, что учитывалось желание каждого отдельного человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁתִיָּה
  choice: Пили
  rationale: Еврейское существительное обозначает питьё как часть пира. Глагольная передача естественна для современного русского языка и не расширяет смысл до всего пиршества.
- source_word: כַדָּת
  choice: по установленному правилу
  rationale: דָּת может означать закон, указ или предписание; здесь речь идёт о порядке, установленном для пира, поэтому «правило» точнее контекстуального «закона».
- source_word: אֵין אֹנֵס
  choice: никого не принуждали
  rationale: Фраза буквально утверждает отсутствие принуждения. Личная безличная конструкция по-русски ясно передаёт, что никого не заставляли пить.
- source_word: כִּי כֵן
  choice: потому что
  rationale: 'Передаёт причинную связь: отсутствие принуждения объясняется распоряжением царя.'
- source_word: יִסַּד
  choice: повелел
  rationale: Основное значение глагола связано с учреждением или установлением, но в административном контексте он выражает данное царём обязательное распоряжение.
- source_word: עַל כָּל רַב בֵּיתוֹ
  choice: всем распорядителям своего дома
  rationale: רַב здесь означает начальника или ответственного служащего. «Распорядители» естественно соответствует дворцовому контексту, а «дом» сохраняет образ исходного текста.
- source_word: לַעֲשׂוֹת כִּרְצוֹן
  choice: поступать по желанию
  rationale: 'Сохраняет широкую формулировку исходного текста: распорядители должны были действовать в соответствии с предпочтением каждого участника.'
- source_word: אִישׁ וָאִישׁ
  choice: каждого
  rationale: Повтор существительного образует дистрибутивное выражение — каждого отдельного человека. Русское «каждого» передаёт эту функцию без неестественного буквального повтора.
