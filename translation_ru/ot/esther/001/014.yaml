base_translation:
  language: en
  yaml_path: translation/ot/esther/001/014.yaml
  text: And those closest to him were Carshena[a], Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan[b], the seven officials of Persia and Media who saw the king’s face and sat first in the kingdom.
translation:
  language: ru
  text: Ближайшими к нему были Каршена, Шетар, Адмата, Таршиш, Мерес, Марсена и Мемухан — семь сановников Персии и Мидии, которые видели лицо царя[a] и занимали первые места в царстве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «видели лицо царя» — придворное выражение, означающее, что они имели непосредственный доступ к царю.'
    reason: cultural_note
  - marker: b
    text: 'Или: «занимали высшее положение в царстве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקָּרֹב אֵלָיו
  choice: А ближе всех к нему были
  rationale: Хотя קָרוֹב формально стоит в единственном числе, оборот вводит перечень семи лиц и имеет собирательное значение. Русское множественное число естественно согласуется с последующим списком; «ближе всех» передаёт их особую приближённость к царю.
- source_word: כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן
  choice: Каршена, Шетар, Адмата, Таршиш, Мерес, Марсена и Мемухан
  rationale: Личные имена переданы транслитерацией, с формами, естественными для русской библейской ономастики и близкими к масоретскому тексту.
- source_word: שִׁבְעַת שָׂרֵי
  choice: семь сановников
  rationale: שָׂרֵי обозначает высокопоставленных придворных или государственных лиц. «Сановники» ясно передаёт высокий ранг, не предполагая наследственного княжеского титула.
- source_word: פָּרַס וּמָדַי
  choice: Персии и Мидии
  rationale: Фраза обозначает две составные части державы; принятые русские географико-политические названия сохраняют форму исходного сочетания.
- source_word: רֹאֵי פְּנֵי הַמֶּלֶךְ
  choice: которые видели лицо царя
  rationale: Сохранён буквальный придворный образ, обозначающий право непосредственного доступа к царю; его культурный смысл разъяснён в сноске.
- source_word: הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת
  choice: и занимали первые места в царстве
  rationale: Перевод сохраняет образ места и передаёт первенство этих лиц в придворной и государственной иерархии; возможное более отвлечённое понимание указано в сноске.
