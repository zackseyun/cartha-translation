base_translation:
  language: en
  yaml_path: translation/ot/esther/001/016.yaml
  text: Then Memucan said before the king and the officials[a], “Queen Vashti has done wrong not against the king alone, but against all the officials and all the peoples who are in all the provinces of King Ahasuerus.”
translation:
  language: ru
  text: 'Тогда Мемухан сказал в присутствии царя и сановников: «Царица Вашти поступила неправильно не только по отношению к царю, но и по отношению ко всем сановникам и всем народам, которые находятся во всех областях царя Ахашвероша».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма глагола продолжает повествование; «тогда» естественно передаёт развитие событий.
- source_word: מומכן
  choice: Мемухан
  rationale: Имя передано транслитерацией с еврейского.
- source_word: לִפְנֵי
  choice: в присутствии
  rationale: Предлог обозначает, что Мемухан говорил перед царём и сановниками, то есть в их присутствии.
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: Слово обозначает высокопоставленных правителей или придворных должностных лиц; «сановники» соответствует придворному контексту и сохраняет достойный литературный регистр.
- source_word: לֹא עַל הַמֶּלֶךְ לְבַדּוֹ … כִּי עַל
  choice: не только перед царём, но и перед
  rationale: 'Русская парная конструкция естественно передаёт еврейское отрицание с последующим расширением: ущерб, по словам Мемухана, нанесён не одному царю, а также другим.'
- source_word: עָוְתָה
  choice: провинилась
  rationale: Глагол означает поступить неправильно или превратно. «Провинилась» сохраняет нравственно-правовую оценку, не сводя её к личному оскорблению.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: царица Вашти
  rationale: Титул поставлен перед именем согласно естественному русскому порядку; имя транслитерировано с еврейского.
- source_word: עַל כָּל הַשָּׂרִים וְעַל כָּל הָעַמִּים
  choice: перед всеми сановниками и всеми народами
  rationale: Повтор «всеми» сохраняет параллелизм и полноту охвата; множественное «народами» передаёт многонациональный состав державы.
- source_word: מְדִינוֹת
  choice: области
  rationale: В книге Есфирь слово называет административные части Персидской державы; «области» — ясный современный эквивалент.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ахашверош
  rationale: Царское имя передано непосредственно с еврейского, без отождествления с иным именем из традиционных переводов.
