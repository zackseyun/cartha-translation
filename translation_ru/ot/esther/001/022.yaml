  text: And he sent letters to all the provinces of the king[a], to each province in its own script and to each people in its own language[d][c][b], that every man should be master in his own house and speak the language of his own people.
translation:
  language: ru
  text: Он разослал письма во все царские области — в каждую область согласно её письменности и к каждому народу согласно его языку[a], — чтобы каждый мужчина господствовал в своём доме[b] и говорил на языке своего народа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в каждую область по её письменности и к каждому народу по его языку»; указ рассылали в форме, соответствовавшей письменности каждой области и языку каждого народа.'
    reason: cultural_note
  - marker: b
    text: 'Или: «чтобы каждый муж правил в своём доме». В еврейском тексте стоит «каждый мужчина», но в данном контексте речь может идти о власти мужа в семье.'
    reason: lexical_alternative
  - marker: c
    text: 'Заключительную фразу можно понимать буквально: каждый мужчина должен был говорить на языке своего народа. Её связь с предписанием о домашней власти не вполне ясна; возможно и более широкое понимание, связанное с языком, принятым в доме.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: И разослал он письма
  rationale: Глагол продолжает основную повествовательную линию; «разослал» естественно передаёт отправку множества официальных писем по всей державе.
- source_word: כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: по всем царским областям
  rationale: «Царские области» — естественная русская передача областей, входивших во владения царя.
- source_word: אֶל מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: в каждую область её письменностью
  rationale: Повтор существительного имеет распределительное значение, а כְּתָב обозначает принятую в области систему письма; формулировка сохраняет административный колорит оригинала.
- source_word: וְאֶל עַם וָעָם כִּלְשׁוֹנוֹ
  choice: и каждому народу на его языке
  rationale: Распределительная конструкция указывает на каждую этноязыковую группу; «народ» и «язык» здесь точны и понятны современному читателю.
- source_word: לִהְיוֹת כָּל אִישׁ שֹׂרֵר בְּבֵיתוֹ
  choice: чтобы каждый мужчина был господином в своём доме
  rationale: אִישׁ буквально означает «мужчина», хотя по контексту возможен смысл «муж»; שֹׂרֵר выражает господство или власть. Перевод сохраняет прямоту и несколько резкий тон указа.
- source_word: וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ
  choice: и говорил на языке своего народа
  rationale: Передан наиболее прямой синтаксический смысл трудной заключительной фразы без попытки устранить её смысловую неоднозначность.
theological_decisions:
- issue: Относится ли כָּל אִישׁ ко всякому мужчине или конкретно к мужу в браке
  choice: каждый мужчина
  alternative: каждый муж
  rationale: Лексически אִישׁ означает «мужчина/человек», тогда как контекст указа о семейной власти допускает значение «муж». Основной текст сохраняет более буквальное обозначение, а контекстуальная возможность вынесена в примечание.
- issue: Смысл заключения о языке народа
  choice: 'буквально: мужчина должен говорить на языке своего народа'
  alternative: домашний порядок должен соответствовать языковой принадлежности мужа
  rationale: Еврейская фраза допускает прямое языковое предписание, но её связь с господством в доме не вполне ясна. Перевод не сглаживает эту трудность.
translation_notes:
  register: Современный литературный русский с достоинством официально-повествовательного стиля. «Разослал», «царские области» и «господином в своём доме» передают имперский административный контекст без архаизации; неоднозначность семейного и языкового предписания сохранена в примечаниях.
