base_translation:
  language: en
  yaml_path: translation/ot/esther/001/021.yaml
  text: The matter pleased the king and the officials[b][a], and the king did according to the word of Memucan.
translation:
  language: ru
  text: Предложение понравилось царю и сановникам[a], и царь поступил по слову Мемухана[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это дело показалось хорошим царю и сановникам».'
    reason: lexical_alternative
  - marker: b
    text: То есть поступил в соответствии с советом Мемухана.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב ... בְּעֵינֵי
  choice: понравилось
  rationale: Еврейская идиома буквально означает «было хорошим в глазах»; «понравилось» естественно передаёт её оценочный смысл по-русски.
- source_word: הַדָּבָר
  choice: предложение
  rationale: דָּבָר имеет широкий смысл («слово, дело, нечто»), а здесь обозначает только что высказанный совет Мемухана; «предложение» ясно передаёт контекст.
- source_word: וְהַשָּׂרִים
  choice: и сановникам
  rationale: שָׂרִים — высокопоставленные правители или придворные; «сановники» точно соответствует обстановке царского двора и остаётся понятным современному читателю.
- source_word: וַיַּעַשׂ
  choice: поступил
  rationale: В сочетании с כִּדְבַר естественное русское «поступил по слову» передаёт совершение царём предложенного действия.
- source_word: כִּדְבַר
  choice: по слову
  rationale: Сохраняет близкую к еврейскому формулировку «согласно слову» и не сужает значение до одного лишь «совета», хотя в данном контексте речь идёт о совете.
- source_word: מְמוּכָן
  choice: Мемухана
  rationale: Имя передано традиционной русской транслитерацией; падежная форма обусловлена синтаксисом.
