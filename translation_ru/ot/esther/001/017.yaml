base_translation:
  language: en
  yaml_path: translation/ot/esther/001/017.yaml
  text: For the queen’s matter will go out to all women, causing them to despise their husbands in their eyes, when they say, ‘King Ahasuerus said to bring Queen Vashti before him, but she did not come.’
translation:
  language: ru
  text: 'Ибо известие о деле царицы дойдёт до всех женщин, так что в глазах женщин их мужья окажутся достойными презрения, когда они скажут: «Царь Ахашверош сказал привести к нему царицу Вашти, а она не пришла».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר הַמַּלְכָּה
  choice: весть о поступке царицы
  rationale: דבר здесь допускает значения «дело», «слово», «сообщение». В контексте речь о том, что известие о конкретном поступке царицы станет широко известно; формулировка сохраняет связь и с событием, и с его оглаской.
- source_word: יֵצֵא ... עַל כָּל הַנָּשִׁים
  choice: разойдётся среди всех женщин
  rationale: Естественно передаёт идиому распространения вести; עַל в данном контексте обозначает охват всех женщин.
- source_word: לְהַבְזוֹת בַּעְלֵיהֶן בְּעֵינֵיהֶן
  choice: они станут презирать своих мужей
  rationale: Передаёт каузативно-результативный смысл конструкции. Буквальное «в своих глазах» в русском избыточно, поскольку значение внутреннего отношения уже выражено глаголом «презирать».
- source_word: אָמַר לְהָבִיא
  choice: велел привести
  rationale: Конструкция «сказал привести» в контексте царского распоряжения естественно означает приказ, хотя в оригинале употреблён глагол «сказал», а не специальный глагол «приказал».
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ахашверош
  rationale: Передаёт еврейскую форму имени ближе к WLC и последовательно отличает её от греческой формы «Артаксеркс».
