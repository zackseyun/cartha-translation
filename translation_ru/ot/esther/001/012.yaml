base_translation:
  language: en
  yaml_path: translation/ot/esther/001/012.yaml
  text: But Queen Vashti refused to come at the king’s command by the hand of the eunuchs[a], and the king became very angry[b], and his wrath burned within him.
translation:
  language: ru
  text: Но царица Вашти отказалась прийти по повелению царя, переданному через евнухов[a]. Тогда царь сильно разгневался, и его ярость запылала в нём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которое было в руке евнухов»; это оборот со значением передачи повеления через них.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и ярость его горела в нём». В еврейском тексте гнев образно представлен как огонь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמָאֵן
  choice: отказалась
  rationale: Прямо передаёт осознанное нежелание исполнить требование, выраженное глаголом מאן.
- source_word: הַמַּלְכָּה וַשְׁתִּי
  choice: царица Вашти
  rationale: Естественное для русского языка сочетание титула и имени, сохраняющее и положение, и личность Вашти.
- source_word: לָבוֹא
  choice: прийти
  rationale: В контексте царского вызова обычное значение בוא «прийти» звучит точнее и естественнее, чем «войти».
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: по повелению царя
  rationale: דבר здесь обозначает царское распоряжение; «повеление» сохраняет придворный регистр и властную силу выражения.
- source_word: אֲשֶׁר בְּיַד הַסָּרִיסִים
  choice: переданному через евнухов
  rationale: 'Оборот «в руке» выражает посредничество: евнухи передали царское повеление. Перевод передаёт смысл идиомы без неестественной русской кальки.'
- source_word: וַיִּקְצֹף מְאֹד
  choice: сильно разгневался
  rationale: Сочетание глагола קצף с усилителем מְאֹד обозначает наступление сильного гнева; эта формулировка естественна в современном литературном русском.
- source_word: וַחֲמָתוֹ בָּעֲרָה בוֹ
  choice: ярость запылала в нём
  rationale: Сохраняет метафору огня в глаголе בער и внутреннюю направленность местоименного оборота בוֹ.
