base_translation:
  language: en
  yaml_path: translation/ot/esther/001/005.yaml
  text: And when these days were completed[a], the king gave a banquet for all the people who were present in Susa the citadel, from great to small, for seven days[d][c][b], in the court of the garden of the king’s palace.
translation:
  language: ru
  text: Когда эти дни завершились, царь устроил семидневный пир[a] для всех людей, находившихся в Сузах, в цитадели[b], — от великого до малого[c], — во дворе сада царского дворца[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает пир, нередко с особым акцентом на употреблении вина.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в цитадели Сузы»; еврейское слово также может означать «крепость».'
    reason: lexical_alternative
  - marker: c
    text: То есть людей всякого положения — от самых знатных до самых простых.
    reason: idiom_explanation
  - marker: d
    text: Последнее слово можно также перевести как «павильон» или «дом»; в данном царском контексте выбрано «дворец».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאות הַיָּמִים הָאֵלֶּה
  choice: Когда эти дни завершились
  rationale: 'Конструкция с ב и инфинитивом מלא выражает время: «когда эти дни завершились». Формулировка естественна по-русски и прямо связывает стих с предыдущим периодом.'
- source_word: עָשָׂה ... מִשְׁתֶּה
  choice: устроил ... пир
  rationale: Сочетание עשה с משתה идиоматически означает «устроить пир». «Пир» сохраняет праздничный и связанный с питьём оттенок, не перегружая основной текст.
- source_word: לְכָל הָעָם הַנִּמְצְאִים
  choice: для всего народа, находившегося
  rationale: עם здесь обозначает всех людей в данном месте, а нифальское причастие מצא — тех, кто там находился.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: в крепости Сузы
  rationale: בירה обозначает укреплённую царскую цитадель или крепость. Родительная конструкция звучит естественно по-русски и сохраняет пространственный смысл.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: от великого до малого
  rationale: Сохранён образный еврейский оборот, охватывающий людей любого положения; его идиоматический смысл пояснён в сноске.
- source_word: שִׁבְעַת יָמִים
  choice: семидневный
  rationale: Прилагательное естественно передаёт длительность пира и позволяет избежать тяжеловесной последовательности обстоятельств.
- source_word: בַּחֲצַר גִּנַּת בִּיתַן הַמֶּלֶךְ
  choice: во дворе сада царского дворца
  rationale: Перевод сохраняет цепочку сопряжённых существительных и пространственную вложенность исходного выражения; для персидского заимствования ביתן по контексту выбрано «дворец».
