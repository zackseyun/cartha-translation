    issue: «в крепости Сузы»
    rationale: Формулировка несколько сужает и переоформляет библейское «в Сузах, цитадели». Более прозрачное «в Сузах, в цитадели» сохраняет аппозиционный характер исходного выражения и не создаёт впечатления, что речь непременно идёт об отдельной крепости внутри города.
  - severity: low
    issue: «для всего народа»
    rationale: Русское «народ» может быть понято этнически или политически. В этом контексте עָם означает совокупность всех присутствующих людей; «для всех людей» точнее и нейтральнее.
  - severity: low
    issue: Сноска b содержит осторожное предположение о том, что имеется в виду укреплённая царская часть города.
    rationale: Значение בִּירָה как цитадели/крепости достаточно для сноски; дополнительное предположение не требуется и может создавать ненужную историческую конкретизацию.
