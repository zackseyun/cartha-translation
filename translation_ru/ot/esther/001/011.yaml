base_translation:
  language: en
  yaml_path: translation/ot/esther/001/011.yaml
  text: to bring Queen Vashti before the king with the royal crown[a], to show the peoples and the officials her beauty[c][b], for she was beautiful in appearance.
translation:
  language: ru
  text: чтобы привести царицу Вашти к царю в царском венце[a] и показать народам[b] и сановникам её красоту, потому что она была прекрасна собой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с царским венцом». Еврейский предлог допускает оба варианта; выражение «в царском венце» подразумевает, что царица должна была явиться в нём.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «народам» — форма множественного числа, которая может указывать на многочисленные народы империи.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «хороша видом» — еврейское выражение, означающее внешнюю красоту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: чтобы привести
  rationale: Каузативный инфинитив породы hифиль от בוא обозначает действие «сделать так, чтобы пришла»; по-русски в данном контексте естественно «привести».
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: царицу Вашти
  rationale: Титул и имя переданы естественным для русского языка сочетанием; винительный падеж обусловлен глаголом «привести».
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: к царю
  rationale: Оборот буквально означает «пред лицо царя», то есть в его присутствие; «к царю» ясно и естественно передаёт направленность движения.
- source_word: בְּכֶתֶר מַלְכוּת
  choice: в царском венце
  rationale: Предлог ב допускает значение сопутствующего обстоятельства. Русское «в царском венце» сохраняет формулировку источника, не вводя отдельного глагола «надев» или «в венце на голове».
- source_word: לְהַרְאוֹת
  choice: и показать
  rationale: Инфинитив hифиль от ראה выражает цель — дать увидеть, показать; союз «и» естественно связывает две цели приказа.
- source_word: הָעַמִּים
  choice: народам
  rationale: Сохранено множественное число еврейского текста, уместное в многонациональной Персидской державе.
- source_word: וְהַשָּׂרִים
  choice: и сановникам
  rationale: שׂרים здесь обозначает высокопоставленных правителей или придворных должностных лиц; «сановники» точно передаёт статус и соответствует литературному повествованию.
- source_word: יָפְיָהּ
  choice: её красоту
  rationale: Прямое и прозрачное соответствие отвлечённому существительному יֳפִי с суффиксом третьего лица женского рода.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину желания показать царицу и в современном русском естественно передаётся причинным оборотом.
- source_word: טוֹבַת מַרְאֶה
  choice: прекрасна собой
  rationale: Буквально «хороша видом» — идиома, обозначающая внешнюю красоту. «Прекрасна собой» сохраняет акцент на внешности и звучит естественно и достойно.
