base_translation:
  language: en
  yaml_path: translation/ot/esther/001/018.yaml
  text: And today the noblewomen of Persia and Media who have heard the queen’s word will say the same to all the king’s officials[c][b][a], and there will be enough contempt and wrath.
translation:
  language: ru
  text: Сегодня же знатные женщины[a] Персии и Мидии, услышавшие слово царицы[b], скажут об этом всем сановникам царя — и будет вдоволь презрения и гнева[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «княгини». Еврейское слово обозначает женщин высокого положения, не обязательно царских дочерей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «известие о царице» или «дело царицы». Буквально: «слово царицы»; выражение может означать как её слова, так и известие о её поступке.'
    reason: lexical_alternative
  - marker: c
    text: 'Заключительная фраза в еврейском тексте эллиптична: буквально — «и вдоволь презрения и гнева». Слово «будет» добавлено для ясности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹם הַזֶּה
  choice: Уже сегодня
  rationale: Передаёт непосредственность предсказанного последствия; «уже» естественно выражает подразумеваемое «в этот самый день», не перегружая фразу.
- source_word: תֹּאמַרְנָה
  choice: станут говорить об этом
  rationale: Форма означает «скажут / станут говорить». Дополнение «об этом» восстановлено из контекста, поскольку в еврейском объект высказывания подразумевается.
- source_word: שָׂרוֹת
  choice: знатные женщины
  rationale: Слово обозначает женщин высокого положения, но не обязательно царских дочерей; этот вариант передаёт общественный статус без лишнего династического оттенка.
- source_word: פָּרַס וּמָדַי
  choice: Персии и Мидии
  rationale: Употреблены общепринятые русские названия стран; зависимость от שָׂרוֹת естественно выражена родительным падежом.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: услышавшие
  rationale: Перфект описывает уже состоявшееся получение известия; русское причастие кратко и естественно связывает его с последующей реакцией.
- source_word: אֶת דְּבַר הַמַּלְכָּה
  choice: о деле царицы
  rationale: דָּבָר может означать слово, сообщение, дело или происшествие. В данном контексте речь, вероятно, идёт о ставшем известным поступке царицы, однако неоднозначность отмечена в сноске.
- source_word: לְכֹל שָׂרֵי הַמֶּלֶךְ
  choice: всем сановникам царя
  rationale: שָׂרִים — высокопоставленные правители и придворные. «Сановники» соответствует дворцовому контексту и не создаёт ошибочного впечатления, будто все они царевичи.
- source_word: וּכְדַי
  choice: и будет вдоволь
  rationale: Краткая еврейская конструкция эллиптична и выражает достаточность или изобилие; для ясной русской фразы добавлено «будет».
- source_word: בִּזָּיוֹן
  choice: презрения
  rationale: Существительное обозначает презрение, пренебрежение или унижение; «презрение» сохраняет направленность отношения, не сводя смысл лишь к позору.
- source_word: וָקָצֶף
  choice: и гнева
  rationale: קֶצֶף обозначает сильный гнев. Нейтрально-возвышенное «гнев» соответствует придворному регистру и не уточняет, чьим именно будет этот гнев.
