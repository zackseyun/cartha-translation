- from: Белые хлопчатые и синие полотнища были прикреплены шнурами из тонкого льна и пурпурной ткани к серебряным кольцам[a] на мраморных колоннах. Золотые и серебряные ложа[b] стояли на полу, выложенном алебастром, мрамором, перламутром и драгоценными камнями[c].
  to: Белые хлопчатые и синие полотнища были прикреплены шнурами из тонкого льна и пурпура к серебряным кольцам[a] и мраморным колоннам. Золотые и серебряные ложа[b] стояли на полу, выложенном порфиром, мрамором, перламутром и драгоценными камнями[c].
  rationale: Исправлена синтаксическая связь, чтобы серебряные крепления и колонны оставались однородными элементами еврейского описания, а не чтобы кольца были помещены на колонны. Формулировка о пурпуре сделана более компактной без сужения значения. Перечень материалов пола и сноска переработаны так, чтобы сохранить установленную лексическую неопределённость редких названий камня.
