base_translation:
  language: en
  yaml_path: translation/ot/esther/001/006.yaml
  text: There were hangings of white cotton and blue[a], fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl[c][b], and precious stones.
translation:
  language: ru
  text: Белые хлопчатые и синие полотнища были прикреплены шнурами из тонкого льна и пурпура к серебряным кольцам[a] и мраморным колоннам. Золотые и серебряные ложа[b] стояли на полу, выложенном порфиром, мрамором, перламутром и драгоценными камнями[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «к серебряным стержням». Еврейское слово может обозначать различные округлые или цилиндрические серебряные крепления.'
    reason: lexical_alternative
  - marker: b
    text: Имеются в виду пиршественные ложа, на которых возлежали за трапезой, а не обычные кровати.
    reason: cultural_note
  - marker: c
    text: Точные значения названий материалов в этом перечне не установлены. «Порфир», «мрамор», «перламутр» и «драгоценные камни» — распространённые отождествления; возможны и другие, в том числе алебастр, белый мрамор и тёмный камень.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּר כַּרְפַּס וּתְכֵלֶת
  choice: белые хлопчатые и синие полотнища
  rationale: חוּר естественнее понимать как обозначение белого цвета, כַּרְפַּס — как хлопчатую ткань, а תְכֵלֶת — как престижный синий или сине-пурпурный цвет. Слово «полотнища» ясно передаёт декоративные ткани, подразумеваемые контекстом.
- source_word: אָחוּז בְּחַבְלֵי בוּץ וְאַרְגָּמָן
  choice: были прикреплены шнурами из тонкого льна и пурпурной ткани
  rationale: Пассивное причастие אָחוּז описывает закрепление тканей. בּוּץ обозначает тонкий лён, а אַרְגָּמָן — дорогой пурпурный материал или цвет; формулировка сохраняет материальный характер обоих определений.
- source_word: גְּלִילֵי כֶסֶף
  choice: серебряные кольца
  rationale: Существительное обозначает округлый или свёрнутый предмет; в контексте крепления занавесей кольца дают наиболее понятный конкретный образ, хотя точная форма предметов неясна.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: мраморные колонны
  rationale: Здесь שֵׁשׁ обозначает белый камень, вероятно мрамор или алебастр. «Мраморные колонны» — естественное архитектурное выражение.
- source_word: מִטּוֹת
  choice: ложа
  rationale: В пиршественном контексте речь идёт о ложах, на которых возлежали за трапезой, а не об обычных кроватях.
- source_word: רִצְפַת
  choice: пол, выложенный
  rationale: Слово обозначает устроенную поверхность пола. Такая конструкция естественно вводит перечень отделочных камней и не навязывает представление о мозаике.
- source_word: בַּהַט וָשֵׁשׁ וְדַר וְסֹחָרֶת
  choice: алебастром, мрамором, перламутром и драгоценными камнями
  rationale: Это распространённые контекстуальные отождествления роскошных материалов, однако точное значение нескольких редких слов остаётся спорным; неопределённость отмечена в сноске.
