base_translation:
  language: en
  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
translation:
  language: ru
  text: На третий год своего царствования он устроил пир[a] для всех своих сановников и слуг — для войска Персии и Мидии[b], знатных вельмож и сановников областей, бывших перед ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праздничное застолье». Еврейское слово часто обозначает пир, сопровождавшийся питьём и весельем.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «военная сила Персии и Мидии». Еврейское слово может означать войско, военную силу, мощь или богатство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: На третий год своего царствования
  rationale: Естественное русское обозначение времени, сохраняющее порядковое значение и относящее его ко времени царствования.
- source_word: עָשָׂה מִשְׁתֶּה
  choice: устроил пир
  rationale: Сочетание означает проведение праздничного застолья; «устроил пир» естественно для царского контекста и сохраняет праздничный оттенок.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: для всех своих сановников и слуг
  rationale: «Сановники» передаёт высокий служебный ранг שָׂרִים, а «слуги» сохраняет широкий смысл עֲבָדִים без неоправданного уточнения их должностей или правового положения.
- source_word: חֵיל פָּרַס וּמָדַי
  choice: войско Персии и Мидии
  rationale: В данном придворно-политическом перечне חֵיל естественно понимать как совокупную военную силу; «войско» сохраняет коллективное значение и не превращает выражение в более узкое «военачальники».
- source_word: הַפַּרְתְּמִים
  choice: знатные вельможи
  rationale: Персидское заимствование обозначает представителей высшей знати; сочетание понятно современному читателю и отличает их от прочих сановников.
- source_word: וְשָׂרֵי הַמְּדִינוֹת
  choice: и правители областей
  rationale: Передаёт управленческую функцию שָׂרֵי и административное значение מְּדִינוֹת, не приписывая им чрезмерно конкретного официального титула.
- source_word: לְפָנָיו
  choice: Перед ним были
  rationale: Сохраняет буквальный пространственно-придворный образ «перед ним» и ясно выражает присутствие перечисленных групп при царе.
