  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Длинная еврейская конструкция разделена на два предложения ради ясности; выражение «перед ним» сохранено буквально как придворное указание на присутствие у царя. Подлинная многозначность חֵיל отмечена в сноске.
