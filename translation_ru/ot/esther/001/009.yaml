  text: Queen Vashti also gave a feast for the women in the royal house that belonged to King Ahasuerus[a][b].
translation:
  language: ru
  text: Царица Вашти также устроила пир для женщин в царском дворце царя Ахашвероша[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праздничную трапезу»; еврейское слово обозначает пир, нередко сопровождавшийся употреблением вина.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в царском доме», то есть во дворце.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: также
  rationale: Передаёт добавление к предшествующему рассказу о пире царя.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: царица Вашти
  rationale: Естественный для русского языка порядок титула и имени; имя передано принятой русской библейской транслитерацией.
- source_word: עָשְׂתָה
  choice: устроила
  rationale: Идиоматично сочетается со словом «пир» и точно передаёт значение «сделала, провела» в данном контексте.
- source_word: מִשְׁתֵּה
  choice: пир
  rationale: Обозначает праздничную трапезу, часто с употреблением вина; краткое и естественное соответствие в повествовании.
- source_word: נָשִׁים
  choice: для женщин
  rationale: Прямо указывает, для кого был устроен пир, не добавляя социального статуса участниц.
- source_word: בֵּית הַמַּלְכוּת
  choice: в царском дворце
  rationale: Естественно передаёт буквальное «дом царства/царской власти» как дворцовый комплекс; буквальная образность отмечена в сноске.
- source_word: אֲשֶׁר לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: царя Ахашвероша
  rationale: Русский родительный оборот естественно выражает принадлежность дворца царю, не требуя тяжеловесного относительного предложения.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ахашверош
  rationale: Форма близко передаёт еврейское אֲחַשְׁוֵרוֹשׁ и сохраняет связь перевода с оригинальным именованием.
