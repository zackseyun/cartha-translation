base_translation:
  language: en
  yaml_path: translation/ot/esther/001/020.yaml
  text: And when the king’s decree that he makes is heard throughout all his kingdom—for it is vast—all the women will give honor to their husbands[b][a], from great to small.
translation:
  language: ru
  text: И когда царский указ[a], который он издаст, услышат по всему его царству — ведь оно огромно, — все женщины будут оказывать уважение[b] своим мужьям — от великого до малого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царское постановление». Еврейское слово обозначает официальное царское решение или повеление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «воздавать честь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַע
  choice: И когда ... услышат
  rationale: Безличная активная конструкция естественна для современного русского языка и передаёт пассивное значение нифаля, а союз «когда» ясно выражает обстоятельство, вслед за которым ожидается результат.
- source_word: פִּתְגָם
  choice: указ
  rationale: В контексте персидского двора слово обозначает официальное царское постановление; «указ» точно и естественно передаёт этот смысл.
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: который он издаст
  rationale: Хотя עשה буквально значит «делать», в сочетании с официальным постановлением по-русски естественно сказать «издать указ».
- source_word: בְּכָל מַלְכוּתוֹ
  choice: по всему его царству
  rationale: Формулировка передаёт распространение известия в пределах всего царства.
- source_word: כִּי רַבָּה הִיא
  choice: ведь оно огромно
  rationale: Прилагательное רבה здесь указывает на обширность царства; «огромно» передаёт пространственный масштаб естественнее, чем общее «велико».
- source_word: וְכָל הַנָּשִׁים
  choice: все женщины
  rationale: Сохранено общее множественное обозначение исходного текста; дальнейшее упоминание мужей уточняет семейный контекст.
- source_word: יִתְּנוּ יְקָר
  choice: будут оказывать уважение
  rationale: Русское выражение ясно передаёт идиому «давать честь/почёт» и звучит естественно в отношении супругов.
- source_word: לְבַעְלֵיהֶן
  choice: своим мужьям
  rationale: Хотя בעל может означать также владельца или господина, в данном семейном контексте речь идёт о мужьях.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: от великого до малого
  rationale: Сохранена краткая социальная меризма исходного текста, охватывающая людей любого положения, без добавления пояснений в основной текст.
