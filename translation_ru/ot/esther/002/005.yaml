lexical_decisions:
- source_word: אִישׁ יְהוּדִי
  choice: иудей
  rationale: В персидском контексте обозначает принадлежность к иудейскому народу; современное русское «иудей» передаёт это без сведения смысла лишь к месту происхождения или только к религии.
- source_word: הָיָה
  choice: жил
  rationale: При введении нового персонажа русское повествовательное «жил» естественно передаёт экзистенциальную конструкцию, не добавляя существенного смысла.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: в крепости Сузы
  rationale: הַבִּירָה обозначает укреплённый царский комплекс; конструкция сохраняет связь крепости с городом Сузы и звучит естественно по-русски.
- source_word: וּשְׁמוֹ מָרְדֳּכַי
  choice: по имени Мардохей
  rationale: Естественная русская формула представления персонажа, точно передающая сообщение его имени.
- source_word: בֶּן יָאִיר בֶּן שִׁמְעִי בֶּן קִישׁ
  choice: сын Иаира, сына Шимея, сына Киша
  rationale: Сохраняется генеалогическая цепочка с формальным «сын»; сноска отмечает, что еврейское слово может обозначать и более далёкого потомка.
- source_word: אִישׁ יְמִינִי
  choice: из племени Вениамина
  rationale: Идиоматично и ясно передаёт племенную принадлежность, не создавая впечатления, будто речь просто о человеке по имени Вениамин.
