  text: וְ/יַפְקֵ֨ד הַ/מֶּ֣לֶךְ פְּקִידִים֮ בְּ/כָל מְדִינ֣וֹת מַלְכוּת/וֹ֒ וְ/יִקְבְּצ֣וּ אֶת כָּל נַעֲרָֽה בְ֠תוּלָה טוֹבַ֨ת מַרְאֶ֜ה אֶל שׁוּשַׁ֤ן הַ/בִּירָה֙ אֶל בֵּ֣ית הַ/נָּשִׁ֔ים אֶל יַ֥ד הֵגֶ֛א סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וְ/נָת֖וֹן תַּמְרוּקֵי/הֶֽן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/003.yaml
  text: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
translation:
  language: ru
  text: Пусть царь назначит чиновников во всех областях своего царства, и пусть они соберут всех красивых молодых девственниц в цитадель Сузы, в дом женщин[a], в ведение Гегая, царского евнуха, смотрителя за женщинами, и пусть им выдадут косметические средства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в гарем». Буквально по-еврейски: «в дом женщин».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть им предоставят средства или процедуры для ухода за внешностью». Еврейское слово может обозначать как косметические средства, так и процедуры по уходу за внешностью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַפְקֵד
  choice: назначит
  rationale: Порода hифиль глагола פקד в данном административном контексте означает назначение людей для выполнения поручения.
- source_word: פְּקִידִים
  choice: уполномоченных
  rationale: Речь идёт о царских служащих, которым поручается конкретное дело; это слово передаёт функцию, не приписывая им военного звания.
- source_word: מְדִינוֹת מַלְכוּתוֹ
  choice: областях своего царства
  rationale: מדינות обозначает административные области империи; «области» естественно звучит в современном русском языке.
- source_word: וְיִקְבְּצוּ
  choice: пусть они соберут
  rationale: Форма продолжает ряд пожеланий-предложений, обращённых к царю, и сохраняет побудительный оттенок.
- source_word: כָּל נַעֲרָה בְתוּלָה
  choice: всех молодых девственниц
  rationale: 'Перевод сохраняет оба смысловых компонента: молодость, выраженную נערה, и девственность, выраженную בתולה.'
- source_word: טוֹבַת מַרְאֶה
  choice: красивых внешностью
  rationale: Оборот буквально характеризует внешний вид; выбранная формулировка сохраняет зрительный акцент и естественна по-русски.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: в крепость Сузы
  rationale: הבירה здесь обозначает укреплённый царский комплекс или цитадель в Сузах; «крепость Сузы» кратко передаёт это значение.
- source_word: בֵּית הַנָּשִׁים
  choice: женский дом
  rationale: Формулировка близко передаёт буквальное значение еврейского выражения, тогда как «гарем» является уместным, но более истолковывающим вариантом.
- source_word: אֶל יַד הֵגֶא
  choice: под надзор Гегая
  rationale: Идиома «в руку» означает передачу под власть, ответственность или попечение; «под надзор» естественно выражает это в контексте царского двора.
- source_word: סְרִיס
  choice: евнуха
  rationale: Хотя слово может шире обозначать придворного чиновника, основное значение «евнух» особенно уместно в контексте женских покоев.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: хранителя женщин
  rationale: Причастное наименование передаёт официальную роль Гегая и остаётся близким к форме исходного текста.
- source_word: וְנָתוֹן תַּמְרוּקֵיהֶן
  choice: и пусть им выдадут косметические средства
  rationale: תמרוקים может обозначать косметические составы, притирания или шире процедуры ухода за красотой; основной перевод ясен современному читателю, а более широкий оттенок сохранён в примечании.
