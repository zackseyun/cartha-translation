revisions:
- from: Пусть царь назначит уполномоченных во всех областях своего царства, и пусть они соберут всех молодых девственниц, красивых внешностью, в крепость Сузы, в женский дом[a], под надзор Гегая, царского евнуха, хранителя женщин, и пусть им выдадут косметические средства[b].
  to: Пусть царь назначит чиновников во всех областях своего царства, и пусть они соберут всех красивых молодых девственниц в цитадель Сузы, в дом женщин[a], в ведение Гегая, царского евнуха, смотрителя за женщинами, и пусть им выдадут косметические средства[b].
  rationale: Правка устраняет неестественные русские обороты и уточняет административное значение идиомы «в руку Гегая», сохраняя все смысловые компоненты еврейского текста и побудительную последовательность. Сноски остаются привязанными к соответствующим выражениям и передают допустимые лексические варианты без навязывания истолкования.
