  - severity: low
    issue: Не вполне ясно, кто должен «взять с собой».
    rationale: В русском целевой инфинитив после «давали ей» лучше раскрыть придаточным с явным субъектом; это не меняет смысла еврейского לָבוֹא עִמָּהּ («идти с ней»).
