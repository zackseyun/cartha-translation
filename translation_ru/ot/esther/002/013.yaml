- from: 'И вот как молодая женщина входила к царю: всё, что она просила[a], давали ей, чтобы взять с собой из дома женщин[b] в царский дом.'
  to: 'Так молодая женщина приходила к царю: всё, что она просила[a], давали ей, чтобы она взяла это с собой из дома женщин[b] в царский дом.'
  rationale: Небольшая правка устраняет излишнюю конкретизацию глагола движения и делает русскую синтаксическую связь яснее. «Это» анафорически относится к «всё, что она просила» и передаёт подразумеваемые предметы, которые должны были сопровождать её.
