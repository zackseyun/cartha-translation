    text: 'Буквально: «всё, что она скажет». По контексту речь идёт обо всём, что она попросит взять с собой.'
    reason: lexical_alternative
  - marker: b
    text: «Дом женщин» — буквальная передача еврейского выражения; имеются в виду женские покои.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָזֶה
  choice: И вот как
  rationale: Оборот вводит описанный порядок действий; «И вот как» естественно передаёт переход и процедурный смысл.
- source_word: הַנַּעֲרָה
  choice: молодая женщина
  rationale: נַעֲרָה обозначает молодую особу женского пола; этот вариант современен и не звучит ни слишком по-детски, ни архаично.
- source_word: בָּאָה אֶל־הַמֶּלֶךְ
  choice: входила к царю
  rationale: בוא с אֶל означает движение к кому-либо; в данном дворцовом контексте «входила к царю» естественно передаёт прибытие на встречу с ним.
- source_word: אֵת כָּל אֲשֶׁר תֹּאמַר
  choice: всё, что она просила
  rationale: Буквально сказано «всё, что она скажет», но контекст показывает, что речь идёт о запрошенных ею вещах; смысл явно выражен в тексте, а буквальная форма отмечена в сноске.
- source_word: יִנָּתֵן לָהּ
  choice: давали ей
  rationale: Нифаль передаёт пассивное действие, а имперфект здесь имеет обычное, процедурное значение; русское неопределённо-личное «давали ей» звучит естественно.
- source_word: לָבוֹא עִמָּהּ
  choice: чтобы взять с собой
  rationale: Буквально предметам позволено «идти с ней»; по-русски цель и сопровождение естественно передаются выражением «взять с собой».
- source_word: מִבֵּית הַנָּשִׁים
  choice: из дома женщин
  rationale: Формальный перевод сохраняет еврейское выражение и не вводит отсутствующее в оригинале культурно нагруженное слово «гарем».
- source_word: עַד בֵּית הַמֶּלֶךְ
  choice: в царский дом
  rationale: Сохраняется лексический образ «дома царя»; при направлении движения русское «в царский дом» естественнее буквального «до царского дома».
