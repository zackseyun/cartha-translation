lexical_decisions:
- source_word: וַיְבֻקַּשׁ הַדָּבָר
  choice: Когда это дело расследовали
  rationale: Пассивная форма בקש в данном контексте обозначает официальное расследование сообщения о заговоре; русская неопределённо-личная конструкция естественно передаёт этот смысл.
- source_word: וַיִּמָּצֵא
  choice: и всё подтвердилось
  rationale: Форма указывает, что сообщённое было признано соответствующим действительности. Такой перевод ясно и естественно передаёт подразумеваемый результат проверки.
- source_word: וַיִּתָּלוּ שְׁנֵיהֶם עַל עֵץ
  choice: обоих повесили на дереве
  rationale: תלה означает «вешать, подвешивать», а עֵץ — «дерево» или деревянное сооружение. Основной текст сохраняет буквальную широту выражения, не уточняя спорный способ казни.
- source_word: וַיִּכָּתֵב
  choice: Об этом записали
  rationale: Естественная русская неопределённо-личная конструкция передаёт еврейский пассив «было записано» и ясно связывает запись с расследованием и казнью.
- source_word: בְּסֵפֶר דִּבְרֵי הַיָּמִים
  choice: в летописи
  rationale: Выражение обозначает официальную книгу придворных хроник; «летопись» кратко и понятно передаёт функцию документа.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: в присутствии царя
  rationale: Буквальное значение לִפְנֵי — «перед, в присутствии»; выбранный вариант сохраняет придворный контекст и не предполагает, что запись была адресована царю.
