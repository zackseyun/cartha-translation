  text: When the matter was investigated and found to be so[a], both of them were hanged on a tree, and it was written in the book of the chronicles in the presence of the king.
translation:
  language: ru
  text: Дело расследовали, и оно подтвердилось. Обоих повесили на дереве[a], а запись об этом внесли в книгу летописей в присутствии царя.
