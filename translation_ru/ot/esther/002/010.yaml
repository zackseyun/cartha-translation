  text: Esther had not disclosed her people or her kindred[a], because Mordecai had commanded her not to disclose it.
translation:
  language: ru
  text: Есфирь не сообщила о своём народе и происхождении[a], потому что Мардохей велел ей не сообщать об этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о её родовой принадлежности». Еврейское слово может обозначать родство, происхождение, родовую принадлежность или место происхождения; здесь, вероятнее всего, имеется в виду происхождение Есфири.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידָה
  choice: не открыла
  rationale: Глагол в породе хифиль означает «сообщить, объявить, сделать известным». В контексте сокрытия происхождения естественное русское «не открыла» передаёт намеренное неразглашение; прошедшее совершенного вида соответствует повествовательному контексту.
- source_word: עַמָּהּ
  choice: из какого она народа
  rationale: עַם обозначает народ как этническую или национальную общность. Такая конструкция естественна по-русски и не сужает смысл до гражданства.
- source_word: מוֹלַדְתָּהּ
  choice: из какого она рода
  rationale: מוֹלֶדֶת может обозначать родство, происхождение, родовую принадлежность или место происхождения. В сочетании с «народом» слово «род» хорошо передаёт семейно-родовую линию, сохраняя некоторую широту исходного термина.
- source_word: צִוָּה עָלֶיהָ
  choice: велел ей
  rationale: צוה выражает распоряжение или повеление. «Велел ей» сохраняет обязательную силу и звучит естественнее в современном русском повествовании, чем более тяжёлое «повелел ей».
- source_word: אֲשֶׁר לֹא תַגִּיד
  choice: не открывать этого
  rationale: Придаточная конструкция передаёт содержание повеления. Местоимение «этого» относится к её народу и роду, а повтор глагола сохраняет лексическую связь с первой частью стиха.
- source_word: אֶסְתֵּר
  choice: Есфирь
  rationale: Использована устоявшаяся русская библейская форма имени.
