  variant: modern literary Russian
source:
  edition: WLC
  text: בָּ/עֶ֣רֶב הִ֣יא בָאָ֗ה וּ֠/בַ/בֹּקֶר הִ֣יא שָׁבָ֞ה אֶל בֵּ֤ית הַ/נָּשִׁים֙ שֵׁנִ֔י אֶל יַ֧ד שַֽׁעֲשְׁגַ֛ז סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/פִּֽילַגְשִׁ֑ים לֹא תָב֥וֹא עוֹד֙ אֶל הַ/מֶּ֔לֶךְ כִּ֣י אִם חָפֵ֥ץ בָּ֛/הּ הַ/מֶּ֖לֶךְ וְ/נִקְרְאָ֥ה בְ/שֵֽׁם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/014.yaml
  text: In the evening she would go in[a], and in the morning she would return to the second house of the women, into the care of Shaashgaz, the king’s eunuch, keeper of the concubines[b]. She would not go in again to the king unless the king delighted in her and she was summoned by name.
translation:
  language: ru
  text: Вечером она входила к царю[a], а утром возвращалась во второй дом женщин[b], под надзор Шаашгаза, царского евнуха, смотрителя наложниц. Больше она не входила к царю, кроме тех случаев, когда царь желал её и её вызывали по имени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Входить к царю» — еврейское выражение, означающее вход в царские покои или к царю; в данном контексте подразумевается половая близость, хотя прямо об этом не говорится.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «во второй дом женщин»; по смыслу речь идёт о втором помещении гарема.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֶרֶב הִיא בָאָה
  choice: Вечером она входила к царю
  rationale: Буквально глагол означает «приходила», но в данном контексте подразумевается вход к царю; форма передаёт повторявшийся порядок действий.
- source_word: וּבַבֹּקֶר הִיא שָׁבָה
  choice: а утром возвращалась
  rationale: Глагол שׁוב означает «возвращаться»; союз «а» естественно обозначает временную смену вечера утром, не усиливая противопоставление.
- source_word: בֵּית הַנָּשִׁים שֵׁנִי
  choice: во второй дом женщин
  rationale: Сохранён буквальный и намеренно несколько необычный образ «второго дома женщин»; перевод «второй гарем» был бы более истолковательным.
- source_word: אֶל יַד
  choice: под надзор
  rationale: Идиома «в руку» здесь обозначает пребывание под ответственностью и управлением назначенного смотрителя.
- source_word: שַׁעֲשְׁגַז
  choice: Шаашгаз
  rationale: Имя передано транслитерацией, отражающей еврейскую форму.
- source_word: סְרִיס הַמֶּלֶךְ
  choice: царского евнуха
  rationale: В придворном контексте סריס, вероятнее всего, обозначает евнуха, хотя в иных контекстах слово может обозначать сановника.
- source_word: שֹׁמֵר הַפִּילַגְשִׁים
  choice: смотрителя наложниц
  rationale: Причастие обозначает человека, охраняющего других или отвечающего за них; «смотритель» естественно передаёт придворную должность.
- source_word: לֹא תָבוֹא עוֹד אֶל הַמֶּלֶךְ
  choice: Больше она не входила к царю
  rationale: Сохранена еврейская идиома «входить к царю», не выражающая прямо подразумеваемую контекстом половую близость.
- source_word: כִּי אִם חָפֵץ בָּהּ הַמֶּלֶךְ
  choice: кроме тех случаев, когда царь желал её
  rationale: כִּי אִם вводит исключение, а חפץ ב обозначает желание, расположение или удовольствие от кого-либо; «желал её» сохраняет уместную здесь смысловую широту.
- source_word: וְנִקְרְאָה בְשֵׁם
  choice: и её вызывали по имени
  rationale: Сохранены пассивность действия и указание на персональный вызов по имени.
