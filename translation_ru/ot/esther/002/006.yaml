  text: who had been taken into exile from Jerusalem with the exiles who had been taken into exile with Jeconiah king of Judah[a], whom Nebuchadnezzar king of Babylon had taken into exile.
translation:
  language: ru
  text: который был уведён из Иерусалима в изгнание вместе с изгнанниками, уведёнными в изгнание вместе с Иехонией, царём Иудеи[a], которого Навуходоносор, царь Вавилона, увёл в изгнание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который» может относиться к Кису, предку Мардохея, а не к самому Мардохею, поскольку изгнание Иехонии произошло несколькими поколениями ранее.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение сохраняет связь с предшествующим личным антецедентом; возможная отсылка к Кису отмечена в сноске.
- source_word: הָגְלָה
  choice: был уведён ... в изгнание
  rationale: Передаёт каузативно-пассивный смысл глагола גלה и подчёркивает принудительное удаление, не сводя изгнание непременно к заключению в плен.
- source_word: מִירוּשָׁלַיִם
  choice: из Иерусалима
  rationale: Прямо передаёт предлог מן и название города.
- source_word: עִם הַגֹּלָה
  choice: вместе с изгнанниками
  rationale: הַגֹּלָה обозначает здесь сообщество переселённых людей; конкретное множественное число естественно по-русски.
- source_word: אֲשֶׁר הָגְלְתָה
  choice: уведёнными
  rationale: Причастный оборот естественно согласуется с русским множественным «изгнанниками» и передаёт повторение корня גלה без тяжеловесного повторения слова «изгнание».
- source_word: יְכָנְיָה
  choice: Иехония
  rationale: Устоявшаяся русская передача данного еврейского имени; не заменяется альтернативной формой имени царя.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Естественная современная русская передача сопряжённой конструкции.
- source_word: אֲשֶׁר הֶגְלָה
  choice: которого ... увёл в изгнание
  rationale: Сохраняет относительную конструкцию, называет Навуходоносора действующим лицом и повторяет ключевую лексику изгнания.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Навуходоносор
  rationale: Устоявшаяся и широко узнаваемая русская форма имени в библейской традиции.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Стандартная русская передача сопряжённой конструкции.
theological_decisions:
- issue: Антецедент относительного предложения в Есфирь 2:6
  choice: В основном тексте «который» синтаксически относится к Мардохею из предыдущего стиха.
  alternative: Относительное предложение может относиться к Кису, предку Мардохея, поскольку изгнание Иехонии произошло несколькими поколениями ранее.
  rationale: Поверхностная последовательность еврейского текста позволяет связать предложение с Мардохеем, однако хронология делает отсылку к Кису серьёзной возможностью. Неоднозначность не устраняется, а отмечается сноской.
- issue: Антецедент заключительного אֲשֶׁר
  choice: «которого» относится к Иехонии.
  alternative: Относительное местоимение можно было бы понимать шире в связи со всем сообществом изгнанников.
  rationale: Непосредственный личный антецедент — Иехония, царь Иудеи; мужской объектный оборот естественно и ясно передаётся русским «которого».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранена цепочка относительных и причастных конструкций исходного текста, но пунктуация и порядок слов сделаны естественными для русского. Лексика «изгнание / изгнанники / уведён» сохраняет мотив принудительного переселения без архаичного «пленение».
