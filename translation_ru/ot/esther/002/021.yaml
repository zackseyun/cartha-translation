base_translation:
  language: en
  yaml_path: translation/ot/esther/002/021.yaml
  text: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
translation:
  language: ru
  text: В те дни, когда Мардохей сидел у царских ворот, Бигтан и Тереш, двое царских евнухов[a] из стражей у входа, разгневались и стали искать случая поднять руку на царя[b] Ахашвероша.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царских придворных». Древнееврейское слово может обозначать царских служащих вообще, хотя в обстановке этого двора вероятно значение «евнухи».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «простереть руку против царя»; то есть напасть на него или убить его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Естественно передаёт обычную древнееврейскую формулу времени, не уточняя период сверх сказанного в тексте.
- source_word: יֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: сидел у царских ворот
  rationale: Причастие обозначает продолжающееся обстоятельство; «царские ворота» здесь — место при дворцовом комплексе и царской администрации.
- source_word: קָצַף
  choice: разгневались
  rationale: Стоящий перед составным подлежащим глагол имеет форму единственного числа, но по смыслу относится к обоим названным лицам.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: царских евнухов
  rationale: В обстановке персидского двора конкретное значение «евнухи» наиболее вероятно, хотя слово может обозначать и придворных служащих шире; эта неоднозначность отмечена в сноске.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: охранявших вход
  rationale: Буквально речь идёт об охраняющих порог; в данном контексте это служба у входа, что по-русски естественно передаётся словом «вход».
- source_word: וַיְבַקְשׁוּ
  choice: замыслили
  rationale: В сочетании с последующим выражением глагол обозначает намерение совершить враждебное действие; «замыслили» естественно передаёт этот смысл, не утверждая, что покушение уже состоялось.
- source_word: לִשְׁלֹחַ יָד
  choice: поднять руку на
  rationale: Русская идиома близко сохраняет образ древнееврейского выражения и передаёт намерение применить насилие, не сводя его безусловно к одному конкретному способу.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ахашверош
  rationale: Имя передано по древнееврейской форме, без замены на историческое отождествление «Ксеркс».
