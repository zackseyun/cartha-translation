  to: В те дни, когда Мардохей сидел у царских ворот, Бигтан и Тереш, двое царских евнухов[a] из стражей у входа, разгневались и стали искать случая поднять руку на царя[b] Ахашвероша.
  rationale: Правка сохраняет придворный и повествовательный регистр, точнее передаёт «искали/стремились» в וַיְבַקְשׁוּ и явнее выражает, что названные лица были из числа стражей у входа. Якорь сноски перенесён к поясняемой идиоме.
