  source_fidelity: Смысл передан в целом точно. Однако וַיְבַקְשׁוּ означает «стали искать / стремились», а «замыслили» несколько сильнее вводит оттенок уже сложившегося заговора. Оборот מִשֹּׁמְרֵי הַסַּף лучше явно передать как принадлежность к стражам у входа, а не просто как причастное определение.
  naturalness: Текст литературен и естественен. Формула «из стражей у входа» ясна в повествовательном контексте и точнее отражает синтаксическую связь оригинала.
  terminology: «Мардохей», «Бигтан», «Тереш» и «Ахашверош» последовательно передают еврейские формы. «Евнухи» допустимо как основное значение סָרִיס в данном придворном контексте; более широкое значение корректно сохранено в сноске.
