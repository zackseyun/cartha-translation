    rationale: В оригинале сказано, что они «искали/стремились» поднять руку на царя; это обозначает намерение, но не обязательно сформулированный заговор.
  - severity: low
    issue: Сноска b поставлена после имени царя, а не у выражения, которое поясняет.
    rationale: Примечание разъясняет идиому «поднять руку на», поэтому её якорь должен следовать непосредственно за этой идиомой.
