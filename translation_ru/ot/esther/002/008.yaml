  source_fidelity: Перевод точно передаёт временную конструкцию, различие между царским повелением и указом, собрание многих молодых женщин в Шушанскую крепость/цитадель, идиому передачи «в руку» Гегая и пассивное «была взята» об Эсфири. «Под надзор Гегая» уместно передаёт административно-принудительный оттенок אֶל־יַד, не утверждая степень физического насилия.
