source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִשָּׁמַ֤ע דְּבַר הַ/מֶּ֨לֶךְ֙ וְ/דָת֔/וֹ וּֽ/בְ/הִקָּבֵ֞ץ נְעָר֥וֹת רַבּ֛וֹת אֶל שׁוּשַׁ֥ן הַ/בִּירָ֖ה אֶל יַ֣ד הֵגָ֑י וַ/תִּלָּקַ֤ח אֶסְתֵּר֙ אֶל בֵּ֣ית הַ/מֶּ֔לֶךְ אֶל יַ֥ד הֵגַ֖י שֹׁמֵ֥ר הַ/נָּשִֽׁים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/008.yaml
  text: And when the king’s command and his decree were heard[a], and when many young women were gathered to Susa the citadel into the custody of Hegai, Esther also was taken into the king’s house, into the custody of Hegai[b], keeper of the women.
translation:
  language: ru
  text: Когда повеление царя и его указ стали известны и многие молодые женщины были собраны в крепость Сузы под надзор Гегая[a], Эсфирь тоже была взята в царский дом[b] под надзор Гегая, хранителя женщин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руку Гегая»; также возможно: «в ведение Гегая».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в царский дворец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַמֶּלֶךְ
  choice: повеление царя
  rationale: В сочетании с официальным указом דְּבַר обозначает царское распоряжение; «повеление» сохраняет официальный и повествовательный регистр.
- source_word: דָתוֹ
  choice: его указ
  rationale: В персидском придворном контексте דָת означает установленное властями постановление; «указ» естественен по-русски и не предполагает непременно постоянного закона.
- source_word: בְּהִשָּׁמַע
  choice: стали известны
  rationale: Пассивная конструкция буквально говорит о том, что повеление и указ были услышаны. «Стали известны» естественно передаёт распространение вести, не добавляя прямо отсутствующего глагола «обнародовать».
- source_word: נְעָרוֹת רַבּוֹת
  choice: многие молодые женщины
  rationale: נְעָרוֹת указывает на молодых женщин брачного возраста, но само по себе в этом стихе не означает «девственницы»; רַבּוֹת передано обычным словом «многие».
- source_word: שׁוּשַׁן הַבִּירָה
  choice: крепость Сузы
  rationale: הַבִּירָה обозначает укреплённый царский комплекс или цитадель. «Крепость Сузы» понятно современному читателю и сохраняет отличие от города вообще.
- source_word: אֶל יַד
  choice: под надзор
  rationale: Буквально «в руку» здесь означает передачу под власть, попечение или ведение должностного лица. «Под надзор» уместно в придворной и несвободной обстановке рассказа.
- source_word: וַתִּלָּקַח
  choice: была взята
  rationale: Пассивная форма не изображает Эсфирь инициатором действия. «Была взята» сохраняет эту пассивность и возможный оттенок принуждения, не усиливая его до явного насильственного захвата.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дом
  rationale: Буквально это «дом царя»; в контексте имеется в виду царский дворцовый комплекс или хозяйство. «Царский дом» сохраняет образ исходного текста, а более контекстное «дворец» дано в сноске.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: хранитель женщин
  rationale: Причастие שֹׁמֵר обозначает того, кто хранит, охраняет и ведает порученными ему людьми. «Хранитель» близко к форме оригинала и не приписывает ему чрезмерно благожелательную роль.
- source_word: וַיְהִי בְּהִשָּׁמַע ... וּבְהִקָּבֵץ
  choice: Когда ... стали известны и ... были собраны
  rationale: Парные временные конструкции объединены одним естественным русским придаточным предложением и сохраняют последовательность обстоятельств, ведущих к тому, что Эсфирь была взята.
theological_decisions:
- issue: Степень добровольности участия Эсфири
  choice: Сохранить пассивное «была взята»
  alternative: «была приведена» или «пришла»
  rationale: Еврейская пассивная форма подчёркивает действие над Эсфирью, но не уточняет степень применённого принуждения. Перевод сохраняет эту напряжённость и не делает её участие ни явно добровольным, ни прямо насильственным.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис передаёт длинное временное построение еврейского текста, оставаясь понятным. Архаизмы вроде «девы» и «чертог» не используются.
