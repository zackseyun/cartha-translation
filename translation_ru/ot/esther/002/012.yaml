base_translation:
  language: en
  yaml_path: translation/ot/esther/002/012.yaml
  text: 'When the turn of each young woman came to go in to King Ahasuerus, after she had been under the regulation for the women for twelve months—for in this way the days of their beauty treatments were completed: six months with oil of myrrh, and six months with spices and with the cosmetics for women—'
translation:
  language: ru
  text: 'Когда для каждой девушки наступала очередь войти к царю Ахашверошу, после того как она в течение двенадцати месяцев проходила предписанный для женщин уход, — ибо так завершался срок их ухода: шесть месяцев с мирровым маслом и шесть месяцев с благовониями и косметическими средствами для женщин, —'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹּר
  choice: очередь
  rationale: Передаёт установленную последовательность, в которой девушек приводили к царю.
- source_word: כְּדָת הַנָּשִׁים
  choice: предписанное женщинам
  rationale: דָּת обозначает установленное правило или предписание; формулировка сохраняет официальный характер порядка, не делая русский текст канцелярским.
- source_word: יְמֵי מְרוּקֵיהֶן
  choice: время их приготовлений
  rationale: מְרוּקִים здесь относится к косметическому очищению и уходу; «приготовления» естественно охватывает весь описанный процесс, не сводя его только к украшению.
- source_word: שֶׁמֶן הַמֹּר
  choice: мирровое масло
  rationale: Точно обозначает масло из мирры и соответствует современному литературному употреблению.
- source_word: בַּבְּשָׂמִים
  choice: с благовониями
  rationale: Передаёт ароматические вещества, применявшиеся в уходе.
- source_word: בְתַמְרוּקֵי הַנָּשִׁים
  choice: с женскими притираниями
  rationale: Сохраняет отдельное упоминание косметических средств для женщин и стилистически соответствует историческому контексту.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно исторической окраской. Имя אֲחַשְׁוֵרוֹשׁ передано как «Ахашверош», близко к еврейской форме. Синтаксическая незавершённость стиха сохранена конечным тире и запятой, поскольку предложение продолжается в следующем стихе.
