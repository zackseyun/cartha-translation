  text: When the matter became known to Mordecai[a], he told Queen Esther[c][b], and Esther told the king in Mordecai's name.
translation:
  language: ru
  text: Когда Мардохею стало известно об этом[a], он рассказал царице Есфири, а Есфирь сообщила царю от имени Мардохея[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда Мардохея известили об этом». Еврейская пассивная форма может подчёркивать как то, что сведения стали ему известны, так и то, что кто-то ему их сообщил.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть Есфирь представила сообщение как исходящее от Мардохея; возможно также: «сославшись на Мардохея».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּדַע הַדָּבָר
  choice: об этом стало известно
  rationale: Пассивная форма נודע передаёт поступление сведений к Мардохею, не называя того, кто его известил; русская безличная конструкция естественна и сохраняет эту неопределённость.
- source_word: לְמָרְדֳּכַי
  choice: Мардохею
  rationale: Дательный падеж естественно отражает лицо, которому стало известно происходящее.
- source_word: וַיַּגֵּד
  choice: он сообщил
  rationale: Глагол נגד в породе hифиль означает «сообщить, рассказать»; «сообщил» соответствует контексту передачи важного донесения.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: царице Есфири
  rationale: Так естественно по-русски передаётся еврейское приложение «Есфири, царице» с сохранением её титула.
- source_word: וַתֹּאמֶר
  choice: передала это
  rationale: Буквально глагол означает «сказала», но в данном контексте речь идёт о передаче царю полученного сообщения; местоимение «это» отсылает к заговору из предыдущего контекста, не добавляя новых сведений.
- source_word: בְּשֵׁם מָרְדֳּכָי
  choice: от имени Мардохея
  rationale: Формулировка близко передаёт идиому בשם и сохраняет указание на Мардохея как на названный источник сообщения.
