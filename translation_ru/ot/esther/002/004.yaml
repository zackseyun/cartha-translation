  text: And let the young woman who pleases the king become queen instead of Vashti[a]. The proposal pleased the king[c][b], and he did so.
translation:
  language: ru
  text: И пусть та молодая женщина, которая понравится царю, станет царицей вместо Вашти[a]. Это предложение понравилось царю[b], и он так и сделал.
