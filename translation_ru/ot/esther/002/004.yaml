lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: молодая женщина
  rationale: Передаёт возрастное значение נַעֲרָה естественным современным русским языком, не создавая слишком юного оттенка слова «девочка» и избегая архаичного «дева».
- source_word: אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ
  choice: которая понравится царю
  rationale: Естественно передаёт еврейскую идиому «будет хороша в глазах царя», то есть окажется угодной его оценке.
- source_word: תִּמְלֹךְ
  choice: станет царицей
  rationale: Глагол буквально означает «царствовать», однако в контексте выбора преемницы Вашти речь идёт о том, что женщина займёт положение царицы; выбранная формулировка ясна и естественна по-русски, а буквальное значение отмечено в сноске.
- source_word: תַּחַת וַשְׁתִּי
  choice: вместо Вашти
  rationale: תַּחַת здесь выражает замещение, а не пространственное положение.
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ
  choice: Это предложение понравилось царю
  rationale: דָּבָר в данном контексте обозначает предложенный план действий; повторяющаяся идиома естественно передана глаголом «понравилось».
- source_word: וַיַּעַשׂ כֵּן
  choice: и он так и сделал
  rationale: Естественная современная передача повествовательной формулы, сообщающей, что царь осуществил предложенное.
