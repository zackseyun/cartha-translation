lexical_decisions:
- source_word: וּבְהִקָּבֵץ
  choice: Когда … собрали
  rationale: Предлог בְּ с инфинитивом в нифале вводит придаточное времени; русская неопределённо-личная конструкция естественно передаёт пассивное значение «были собраны».
- source_word: בְּתוּלוֹת
  choice: девственниц
  rationale: Слово прямо указывает на девственность девушек; более общее «девушек» утратило бы этот смысл, существенный в контексте отбора при дворе.
- source_word: שֵׁנִית
  choice: во второй раз
  rationale: Передаёт буквальное значение наречия и яснее, чем возможное «снова».
- source_word: וּמָרְדֳּכַי
  choice: Мардохей
  rationale: Использована традиционная русская форма библейского имени.
- source_word: יֹשֵׁב
  choice: сидел
  rationale: Причастие обозначает продолжающееся состояние; русское прошедшее несовершенного вида сохраняет длительность.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: у царских ворот
  rationale: Русское «ворота» грамматически имеет форму множественного числа; выражение естественно обозначает место у входа в царский дворцовый комплекс.
