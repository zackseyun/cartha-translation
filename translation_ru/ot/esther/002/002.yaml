lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Тогда ... сказали
  rationale: Последовательный вав продвигает повествование; «тогда» естественно передаёт развитие событий.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: молодые люди царя
  rationale: Сохраняет основное значение נַעַר и не смешивает его с последующим מְשָׁרְתָיו, которое прямо указывает на служение царю.
- source_word: מְשָׁרְתָיו
  choice: служившие ему
  rationale: Причастие от שׁרת описывает личное служение при царе; относительный оборот звучит естественно по-русски.
- source_word: יְבַקְשׁוּ
  choice: пусть ... разыщут
  rationale: Сохраняет активную форму и побудительное значение еврейского глагола, не называя подразумеваемых исполнителей.
- source_word: לַמֶּלֶךְ
  choice: для царя
  rationale: Прямо передаёт дательный значения пользы или назначения без дополнительных толкований.
- source_word: נְעָרוֹת בְּתוּלוֹת
  choice: молодых девственниц
  rationale: 'Передаёт оба элемента сочетания: молодой возраст и девственность; избегает архаичного «дев» и возможной детской коннотации слова «девочек».'
- source_word: טוֹבוֹת מַרְאֶה
  choice: красивых собой
  rationale: Естественный современный русский эквивалент идиомы «хороших видом», сохраняющий указание на внешность.
