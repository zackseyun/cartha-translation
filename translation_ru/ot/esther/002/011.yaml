  yaml_path: translation/ot/esther/002/011.yaml
  text: And every single day Mordecai would walk back and forth in front of the courtyard of the women’s house, to learn how Esther was doing and what would be done with her.
translation:
  language: ru
  text: Каждый день Мардохей ходил взад и вперёд перед двором женских покоев, чтобы узнать, как поживает Есфирь и что с ней сделают.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל־יוֹם וָיוֹם
  choice: Каждый день
  rationale: 'Еврейское распределительное выражение подчёркивает регулярность: изо дня в день; естественный русский эквивалент — «каждый день».'
- source_word: מִתְהַלֵּךְ
  choice: ходил взад и вперёд
  rationale: Форма передаёт повторяющееся хождение; в данном пространственном контексте выражение естественно описывает беспокойное прохаживание перед двором.
- source_word: בֵּית הַנָּשִׁים
  choice: женского дома
  rationale: Буквальное обозначение отдельной части дворцового комплекса, где находились женщины; сохранено устройство исходного образа без добавления слова «гарем».
- source_word: לָדַעַת אֶת־שְׁלוֹם אֶסְתֵּר
  choice: чтобы узнать, как поживает Есфирь
  rationale: Идиома с שָׁלוֹם означает узнать о состоянии или благополучии человека; современная русская формулировка передаёт смысл естественно.
- source_word: וּמַה־יֵּעָשֶׂה בָּהּ
  choice: и что с ней будет
  rationale: Неопределённо-личная пассивная конструкция буквально означает «что будет сделано с ней»; выбранный вариант естественен по-русски и сохраняет неопределённость дальнейшей судьбы Есфири.
