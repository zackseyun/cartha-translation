  source_fidelity: 'Основной смысл передан точно: очередь Есфири, её происхождение и опека Мардохея, вход к царю, роль Гегая и благосклонность видевших её сохранены. Однако «снискала» выражает завершённый результат, тогда как конструкция וַתְּהִי ... נֹשֵׂאת חֵן описывает её продолжающееся обретение/наличие благосклонности в ходе повествования.'
