base_translation:
  language: en
  yaml_path: translation/ot/esther/002/015.yaml
  text: When Esther’s turn came—the daughter of Abihail[a], the uncle of Mordecai, who had taken her as his own daughter—to go in to the king, she asked for nothing except what Hegai, the king’s eunuch, keeper of the women, advised[b]. And Esther was gaining favor in the eyes of all who saw her.
translation:
  language: ru
  text: Когда настал черёд Есфири, дочери Авихаила, дяди Мардохея, которую Мардохей взял к себе как дочь[a], войти к царю, она не просила ничего, кроме того, что посоветовал ей Гегай, царский евнух[b], смотритель женщин. Есфирь пользовалась расположением всех, кто её видел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принял её как дочь». Еврейское выражение означает, что Мардохей принял Есфирь под свою дочернюю опеку.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово иногда может означать придворного служителя вообще, но здесь, в контексте царского женского дома, вероятнее значение «евнух».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַגִּיעַ תֹּר
  choice: Когда настал черёд
  rationale: Сочетание предлога с инфинитивом вводит придаточное времени, а תֹּר обозначает установленную очередь женщины предстать перед царём.
- source_word: דֹּד מָרְדֳּכַי
  choice: дяди Мардохея
  rationale: В данном родословном контексте דֹּד обозначает дядю; это согласуется с уже указанным в Есфирь 2:7 родством.
- source_word: אֲשֶׁר לָקַח לוֹ לְבַת
  choice: которую Мардохей взял себе в дочери
  rationale: Формулировка передаёт принятие Есфири под дочернюю опеку, не утверждая сверх текста наличие формальной юридической процедуры усыновления.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: войти к царю
  rationale: Сохранена сдержанная придворная формула исходного текста без дополнительного уточнения подразумеваемого брачного или сексуального контекста.
- source_word: לֹא בִקְשָׁה דָּבָר כִּי אִם
  choice: не просила ничего, кроме
  rationale: Прямо передаёт отрицание и последующее исключение.
- source_word: אֵת אֲשֶׁר יֹאמַר
  choice: того, что указал
  rationale: Глагол буквально связан с речью, но здесь слова Гегая определяют, что Есфири следует взять; «указал» естественно передаёт функцию высказывания, не превращая её в приказ.
- source_word: סְרִיס
  choice: евнух
  rationale: В контексте царского женского дома конкретное значение «евнух» вероятнее более широкого «придворный служитель».
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: смотритель женщин
  rationale: Сохранено обозначение должности Гегая как человека, которому были вверены женщины, без добавления отсутствующих в стихе «покоев» или «гарема».
- source_word: וַתְּהִי אֶסְתֵּר נֹשֵׂאת חֵן בְּעֵינֵי
  choice: Есфирь снискала расположение
  rationale: Еврейская идиома «нести благосклонность в глазах» естественно выражена по-русски как приобретение расположения.
- source_word: כָּל רֹאֶיהָ
  choice: всех, кто её видел
  rationale: Точно и естественно передаёт субстантивированное причастие с обобщающим כָּל.
