  terminology: Имена «Есфирь», «Авихаил», «Мардохей» и «Гегай» переданы последовательно. «Царский евнух, смотритель женщин» сохраняет и термин סָרִיס, и должностное определение שֹׁמֵר הַנָּשִׁים. Сноска b корректно отмечает более широкую возможную семантику «евнух», не устраняя предпочтительное здесь значение.
