revisions:
- from: Мардохей воспитывал Гадассу, то есть Есфирь, дочь своего дяди[a], потому что у неё не было ни отца, ни матери. Эта девушка была красива станом и привлекательна лицом. После смерти её отца и матери Мардохей взял её к себе как дочь[b].
  to: Мардохей воспитывал Гадассу, то есть Есфирь, дочь дяди Мардохея[a], потому что у неё не было ни отца, ни матери. Эта девушка была прекрасного телосложения и привлекательной внешности. Когда умерли её отец и мать, Мардохей взял её к себе как дочь[b].
  rationale: Правка устраняет сужение значения «внешность» до «лица», снимает русскую двусмысленность в обозначении родства и точнее передаёт временной оборот. Сноски сохранены на тех же местах; их формулировки приведены к естественному русскому оформлению.
  reviewer_model: gpt-5.6-terra
