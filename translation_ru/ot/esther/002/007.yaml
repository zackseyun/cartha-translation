    issue: «привлекательна лицом» сужает значение מַרְאֶה.
    rationale: Еврейское слово обозначает внешний вид/облик, а не исключительно лицо. «Привлекательной внешности» сохраняет объём исходного выражения.
  - severity: low
    issue: «дочь своего дяди» двусмысленно в русском контексте.
    rationale: Возвратное «своего» может быть прочитано как относящееся к Гадассе, хотя суффикс в בַּת דֹּדוֹ относится к Мардохею. «Дочь дяди Мардохея» устраняет двусмысленность.
  - severity: low
    issue: «После смерти» несколько сильнее выражает последовательность, чем исходный временной оборот.
    rationale: «Когда умерли её отец и мать» прямо и нейтрально передаёт обстоятельство времени.
