base_translation:
  language: en
  yaml_path: translation/ot/esther/002/007.yaml
  text: He was bringing up Hadassah—that is[a], Esther—the daughter of his uncle, because she had neither father nor mother. The young woman was beautiful in form and attractive in appearance, and when her father and her mother died[b], Mordecai took her as his own daughter.
translation:
  language: ru
  text: Мардохей воспитывал Гадассу, то есть Есфирь, дочь дяди Мардохея[a], потому что у неё не было ни отца, ни матери. Эта девушка была прекрасного телосложения и привлекательной внешности. Когда умерли её отец и мать, Мардохей взял её к себе как дочь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть его двоюродную сестру.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «удочерил её». В еврейском тексте буквально: «взял её себе в дочь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמֵן
  choice: воспитывал
  rationale: Причастие описывает продолжительную заботу Мардохея о Есфири и её воспитание; этот вариант естественен по-русски и не вводит более узкого юридического понятия опекунства.
- source_word: הֲדַסָּה הִיא אֶסְתֵּר
  choice: Гадассу, то есть Есфирь
  rationale: Местоименная конструкция отождествляет два имени одной женщины; «то есть» ясно и естественно передаёт пояснительное приложение.
- source_word: בַּת דֹּדוֹ
  choice: дочь своего дяди
  rationale: Сохранена буквальная форма родства исходного текста, из которой следует, что она была двоюродной сестрой Мардохея.
- source_word: כִּי אֵין לָהּ אָב וָאֵם
  choice: потому что у неё не было ни отца, ни матери
  rationale: Перевод прямо воспроизводит отсутствие обоих родителей, не заменяя формулировку выводом «она была сиротой».
- source_word: הַנַּעֲרָה
  choice: эта девушка
  rationale: Современное и естественное обозначение молодой незамужней женщины в данном повествовательном контексте.
- source_word: יְפַת תֹּאַר
  choice: красива станом
  rationale: Фраза относится к телосложению или фигуре; «станом» передаёт это значение кратко и в достойном литературном регистре.
- source_word: טוֹבַת מַרְאֶה
  choice: привлекательна лицом
  rationale: מַרְאֶה означает вид или внешность; в паре с описанием стана «лицом» естественно сохраняет двухчастное описание физической красоты, хотя несколько конкретизирует его.
- source_word: וּבְמוֹת אָבִיהָ וְאִמָּהּ
  choice: После смерти её отца и матери
  rationale: Предлог с формой מוֹת обозначает временное обстоятельство; русский оборот естественно передаёт последовательность событий.
- source_word: לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת
  choice: Мардохей взял её к себе как дочь
  rationale: Передаёт буквальный образ «взял её себе в дочь», не навязывая формально-юридического смысла современного усыновления.
