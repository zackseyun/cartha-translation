  text: וַ/תִּיטַ֨ב הַ/נַּעֲרָ֣ה בְ/עֵינָי/ו֮ וַ/תִּשָּׂ֣א חֶ֣סֶד לְ/פָנָי/ו֒ וַ֠/יְבַהֵל אֶת תַּמְרוּקֶ֤י/הָ וְ/אֶת מָנוֹתֶ֨/הָ֙ לָ/תֵ֣ת לָ֔/הּ וְ/אֵת֙ שֶׁ֣בַע הַ/נְּעָר֔וֹת הָ/רְאֻי֥וֹת לָֽ/תֶת לָ֖/הּ מִ/בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְשַׁנֶּ֧/הָ וְ/אֶת נַעֲרוֹתֶ֛י/הָ לְ/ט֖וֹב בֵּ֥ית הַ/נָּשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/009.yaml
  text: The young woman pleased him and found favor before him[a], and he quickly provided her with her beauty treatments and her portions, and with seven young women suitable to be given to her from the king’s palace; and he transferred her and her young women to the best place in the women’s house.
translation:
  language: ru
  text: Девушка понравилась ему и обрела его благосклонность. Он без промедления предоставил ей средства для ухода за собой и положенные ей порции, а также семь подходящих служанок из царского дворца. Затем он перевёл её вместе со служанками в лучшее место женского дома[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в лучшие покои женского дома». Имеется в виду особо хорошее место в царских женских покоях, которые нередко называют гаремом.'
    reason: Лаконичная конструкция לְטוֹב допускает передачу как «в лучшее место», так и «в лучшие покои»; слово «гарем» поясняет исторический контекст, но более интерпретативно, чем еврейское выражение.
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: девушка
  rationale: נַעֲרָה обозначает молодую женщину; «девушка» естественно звучит в современном русском повествовании и соответствует контексту незамужней Эсфири.
- source_word: וַתִּיטַב ... בְעֵינָיו
  choice: понравилась ему
  rationale: Так естественно передаётся древнееврейская идиома «была хороша в его глазах» без добавления романтического или сексуального оттенка.
- source_word: וַתִּשָּׂא חֶסֶד לְפָנָיו
  choice: обрела его благосклонность
  rationale: В придворном контексте חֶסֶד означает благосклонное расположение и благоприятное отношение; формулировка сохраняет направленность выражения на данного человека.
- source_word: וַיְבַהֵל ... לָתֵת לָהּ
  choice: без промедления распорядился выдать ей
  rationale: Глагол выражает поспешность, а инфинитив לָתֵת — предоставление перечисленного; русская формулировка естественно передаёт оба компонента.
- source_word: תַּמְרוּקֶיהָ
  choice: всё необходимое для ухода за собой
  rationale: Слово обозначает средства или процедуры косметического ухода и подготовки. Выбор понятен современному читателю и не сужает значение исключительно до косметики либо мазей.
- source_word: מָנוֹתֶיהָ
  choice: положенные ей порции
  rationale: מָנוֹת — назначенные доли, вероятнее всего продовольственные; «порции» сохраняет предметную неопределённость исходного текста.
- source_word: שֶׁבַע הַנְּעָרוֹת הָרְאֻיוֹת
  choice: семь подходящих служанок
  rationale: Контекст показывает, что молодые женщины назначаются Эсфири в услужение; הָרְאֻיוֹת передано нейтральным «подходящих», без предположения о формальной процедуре отбора.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: из царского дворца
  rationale: В царском контексте בֵּית הַמֶּלֶךְ естественно означает дворец или дворцовое хозяйство, а не обычный дом.
- source_word: וַיְשַׁנֶּהָ
  choice: перевёл её
  rationale: Порода piel глагола שנה выражает изменение положения или места. «Перевёл» передаёт перемещение внутри учреждения, не утверждая прямо формального повышения.
- source_word: לְטוֹב בֵּית הַנָּשִׁים
  choice: в лучшую часть женского дома
  rationale: Краткая древнееврейская конструкция указывает на лучшее место или отделение внутри женских покоев; основной текст сохраняет образ «дома», не подменяя его более интерпретативным словом «гарем».
