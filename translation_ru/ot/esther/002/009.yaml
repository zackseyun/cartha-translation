  to: Девушка понравилась ему и обрела его благосклонность. Он без промедления предоставил ей средства для ухода за собой и положенные ей порции, а также семь подходящих служанок из царского дворца. Затем он перевёл её вместе со служанками в лучшее место женского дома[a].
