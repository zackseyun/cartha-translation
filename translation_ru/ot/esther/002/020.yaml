base_translation:
  language: en
  yaml_path: translation/ot/esther/002/020.yaml
  text: Esther had not made known her family line or her people[a], just as Mordecai had commanded her; and Esther kept doing what Mordecai said[b], as when she was under his care.
translation:
  language: ru
  text: Есфирь не сообщала ни о своём происхождении[a], ни о своём народе, как повелел ей Мардохей; и Есфирь поступала по слову Мардохея, как в те дни, когда он воспитывал её[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о своём роде». Еврейское слово может обозначать происхождение, род или родство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда она находилась на его попечении». Еврейское выражение напоминает о том времени, когда Мардохей растил Есфирь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין אֶסְתֵּר מַגֶּדֶת
  choice: Есфирь не рассказывала
  rationale: 'Сочетание отрицательной частицы с причастием обозначает продолжавшееся положение дел: Есфирь по-прежнему не сообщала этих сведений. Русское несовершенное прошедшее естественно передаёт эту длительность.'
- source_word: מוֹלַדְתָּהּ
  choice: о своём происхождении
  rationale: Слово охватывает происхождение, родство и родовую принадлежность. «Происхождение» понятно современному читателю и не сужает значение до одного лишь места рождения.
- source_word: עַמָּהּ
  choice: о своём народе
  rationale: Обычное значение עַם — «народ»; здесь имеется в виду народная принадлежность Есфири.
- source_word: כַּאֲשֶׁר צִוָּה עָלֶיהָ מָרְדֳּכָי
  choice: как повелел ей Мардохей
  rationale: Глагол צוה выражает не простой совет, а властное распоряжение; «повелел» сохраняет эту силу и соответствует достоинству повествовательного регистра.
- source_word: מַאֲמַר מָרְדֳּכַי
  choice: то, что говорил Мардохей
  rationale: מַאֲמַר может означать слово, высказывание или распоряжение. Контекст ясно показывает послушание, а формулировка не устраняет лексическую широту слова и избегает тяжёлого повтора «повеление».
- source_word: עֹשָׂה
  choice: продолжала делать
  rationale: Причастие представляет действие как продолжающееся или обычное. «Продолжала делать» передаёт устойчивое послушание Есфири.
- source_word: כַּאֲשֶׁר הָיְתָה בְאָמְנָה אִתּוֹ
  choice: как и в то время, когда он её воспитывал
  rationale: Форма от אמן указывает на воспитание или попечение Мардохея в прежние годы Есфири; русская активная конструкция естественно выражает ту же связь.
