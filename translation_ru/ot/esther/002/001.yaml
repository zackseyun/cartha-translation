  text: אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כְּ/שֹׁ֕ךְ חֲמַ֖ת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ זָכַ֤ר אֶת וַשְׁתִּי֙ וְ/אֵ֣ת אֲשֶׁר עָשָׂ֔תָה וְ/אֵ֥ת אֲשֶׁר נִגְזַ֖ר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/001.yaml
  text: After these things[a], when the anger of King Ahasuerus had subsided, he remembered Vashti, what she had done[b], and what had been decreed against her.
translation:
  language: ru
  text: После этих событий, когда утих гнев царя Ахашвероша, он вспомнил Вашти, то, что она сделала, и то, что было постановлено против неё.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: После этих событий
  rationale: Обычная временная формула, вводящая следующую сцену. «Событий» естественнее по-русски, чем буквальное «вещей», и сохраняет связь с предшествующим повествованием.
- source_word: כְּשֹׁךְ חֲמַת
  choice: когда утих гнев
  rationale: שׁכך передаёт ослабление и прекращение сильной эмоции; «утих гнев» — естественное и точное русское выражение.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: царя Ахашвероша
  rationale: Царский титул и имя переданы в обычном русском синтаксисе; форма «Ахашверош» непосредственно отражает еврейское имя.
- source_word: זָכַר
  choice: он вспомнил
  rationale: Прямое соответствие глаголу со значением «помнить, вспоминать» без добавления мотивов или оценки.
- source_word: אֶת וַשְׁתִּי
  choice: Вашти
  rationale: Имя транслитерировано непосредственно с еврейского; служебный показатель прямого дополнения отдельно не переводится.
- source_word: וְאֵת אֲשֶׁר עָשָׂתָה
  choice: то, что она сделала
  rationale: Передаёт относительную конструкцию и сохраняет ретроспективный смысл в естественном русском виде.
- source_word: וְאֵת אֲשֶׁר נִגְזַר עָלֶיהָ
  choice: то, что было постановлено о ней
  rationale: Пассивная форма נִגְזַר указывает на вынесенное решение или постановление. «О ней» сохраняет возможную нейтральность предлога עַל, тогда как контекст допускает более явно неблагоприятное «против неё».
