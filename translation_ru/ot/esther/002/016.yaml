base_translation:
  language: en
  yaml_path: translation/ot/esther/002/016.yaml
  text: So Esther was taken to King Ahasuerus[a], into his royal palace, in the tenth month, which is the month Tebeth[b], in the seventh year of his reign.
translation:
  language: ru
  text: И Есфирь была взята к царю Ахашверошу[a], в его царский дворец, в десятом месяце — месяце Тевет[b], на седьмом году его царствования.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «была приведена к царю Ахашверошу». Древнееврейский глагол стоит в страдательной форме, подчёркивая, что Есфирь была объектом действия.'
    reason: lexical_alternative
  - marker: b
    text: Тевет — вавилонское название десятого месяца.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּלָּקַח
  choice: была взята
  rationale: Пассивная форма нифаля от לקח подчёркивает, что действие совершается над Есфирью; перевод сохраняет эту особенность повествования.
- source_word: אֶל הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: к царю Ахашверошу
  rationale: Предлог אֶל выражает направленность движения, а порядок «царь Ахашверош» естественен для современного русского библейского повествования.
- source_word: אֶל בֵּית מַלְכוּתוֹ
  choice: в его царский дворец
  rationale: Буквально «в дом его царства/царской власти»; в данном контексте речь идёт о царской резиденции. Предлог «в» передаёт движение внутрь.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: в десятом месяце
  rationale: Прямое и естественное соответствие временному выражению оригинала.
- source_word: הוּא חֹדֶשׁ טֵבֵת
  choice: то есть в месяце тевете
  rationale: Оборот передаёт пояснительно-отождествляющую функцию древнееврейской конструкции и естественно звучит по-русски.
- source_word: טֵבֵת
  choice: тевете
  rationale: Название месяца передано принятой русской транслитерацией «тевет» и поставлено в предложном падеже после слова «месяце».
- source_word: בִּשְׁנַת שֶׁבַע לְמַלְכוּתוֹ
  choice: на седьмом году его царствования
  rationale: Естественная русская формула для обозначения года правления, точно передающая смысл מלכות в этом контексте.
