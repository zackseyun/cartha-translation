base_translation:
  language: en
  yaml_path: translation/ot/esther/002/017.yaml
  text: The king loved Esther more than all the women[a], and she found favor and kindness before him more than all the virgins[b]. So he placed the royal crown on her head and made her queen instead of Vashti.
translation:
  language: ru
  text: Царь полюбил Есфирь больше всех женщин, и она снискала у него благоволение и милость[a] больше всех девственниц[b]. Он возложил ей на голову царскую корону и сделал её царицей вместо Вашти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «понесла благоволение и милость перед ним» — еврейский идиоматический оборот.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь употреблено более узкое слово, чем «женщины» в начале стиха.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: полюбил
  rationale: Глагол אהב прямо выражает любовь или привязанность; «полюбил» сохраняет этот смысл, не ослабляя его до простого предпочтения.
- source_word: מִכָּל הַנָּשִׁים
  choice: больше всех женщин
  rationale: Сравнительная конструкция с מִן и כָּל передана явно; נָשִׁים — обычное обозначение женщин, более широкое, чем последующее בְּתוּלֹת.
- source_word: וַתִּשָּׂא חֵן וָחֶסֶד
  choice: снискала у него благоволение и милость
  rationale: Буквальное «понесла благоволение и милость» является еврейской идиомой. «Снискала» естественно передаёт приобретённое расположение, а два существительных сохранены раздельно.
- source_word: לְפָנָיו
  choice: у него
  rationale: В данном обороте буквальное «перед ним» означает расположение в его глазах; «у него» звучит по-русски естественно и сохраняет направленность благоволения царя.
- source_word: מִכָּל הַבְּתוּלֹת
  choice: больше всех девственниц
  rationale: בְּתוּלֹת — более узкий термин, чем ранее употреблённое «женщины»; перевод сохраняет различие исходного текста.
- source_word: וַיָּשֶׂם כֶּתֶר מַלְכוּת
  choice: возложил ей на голову царскую корону
  rationale: «Царская корона» естественно передаёт «корону царствования/царского достоинства», а «возложил» соответствует торжественному действию в контексте.
- source_word: וַיַּמְלִיכֶהָ
  choice: сделал её царицей
  rationale: Каузативная форма глагола מלך означает сделать царём или царицей, поставить на царство.
- source_word: תַּחַת וַשְׁתִּי
  choice: вместо Вашти
  rationale: 'В контексте преемства תַּחַת обозначает замену: Есфирь становится царицей на месте Вашти.'
