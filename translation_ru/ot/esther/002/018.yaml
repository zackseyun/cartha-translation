  text: Then the king gave a great banquet for all his officials and servants—the banquet of Esther—and he granted relief to the provinces and gave gifts according to the king’s bounty[a][b].
translation:
  language: ru
  text: И устроил царь великий пир для всех своих сановников и слуг — пир Есфири; он также даровал областям послабление[a] и раздал дары с царской щедростью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устроил для областей праздник»; возможно также: «даровал областям освобождение от повинностей». Еврейское слово может означать отдых, облегчение или освобождение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сообразно руке царя» — то есть в мере, соответствующей царским возможностям или щедрости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתֶּה גָדוֹל
  choice: великий пир
  rationale: מִשְׁתֶּה обозначает пир с питьём или торжественное угощение; «пир» естественно звучит в придворном повествовании, а גָדוֹל передано как «великий».
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: для всех своих сановников и слуг
  rationale: שָׂרִים в придворном контексте — высокопоставленные лица, поэтому выбрано современное «сановники»; עֲבָדִים сохранено как «слуги» без излишнего уточнения их функций.
- source_word: אֵת מִשְׁתֵּה אֶסְתֵּר
  choice: пир в честь Есфири
  rationale: Буквально это «пир Есфири», но контекст указывает на пир, связанный с её возвышением; «в честь Есфири» естественно выражает вероятное отношение, не представляя её устроительницей пира.
- source_word: וַהֲנָחָה לַמְּדִינוֹת עָשָׂה
  choice: он также даровал областям облегчение
  rationale: הֲנָחָה допускает значения отдыха, облегчения или освобождения от повинностей. Обобщённое «облегчение» сохраняет широту еврейского выражения, а примечание отмечает более узкие варианты.
- source_word: מַשְׂאֵת
  choice: дары
  rationale: В данном контексте слово обозначает раздаваемые царём подарки или пожалования; «дары» подходит торжественному регистру и не сужает значение.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: с царской щедростью
  rationale: Буквально «сообразно руке царя»; это идиома, указывающая на меру, достойную царских возможностей и щедрости. Русское выражение передаёт смысл естественно, а буквальный образ отмечен в сноске.
- source_word: וַיַּעַשׂ
  choice: устроил
  rationale: Хотя глагол буквально означает «сделал», по-русски пир обычно «устраивают»; это точно передаёт действие в контексте.
