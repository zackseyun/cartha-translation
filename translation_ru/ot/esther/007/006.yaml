  text: And Esther said, “A hostile and enemy man—this evil Haman!” Then Haman was terrified before the king and the queen.
translation:
  language: ru
  text: 'Эсфирь сказала: «Враг и неприятель — вот этот злодей Аман!» И Аман пришёл в ужас перед царём и царицей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ צַר וְאוֹיֵב
  choice: «враг и неприятель»
  rationale: В данном именном восклицании אִישׁ обозначает человека, но отдельное «человек» по-русски звучало бы неестественно. Парные слова צַר и אוֹיֵב переданы двумя близкими по смыслу существительными, сохраняющими риторическое усиление.
- source_word: הָמָן הָרָע הַזֶּה
  choice: «вот этот злодей Аман»
  rationale: Указательное הַזֶּה передано экспрессивным «вот этот», а הָרָע — существительным «злодей», естественно выражающим здесь нравственную характеристику конкретного лица.
- source_word: נִבְעַת
  choice: «пришёл в ужас»
  rationale: Глагол выражает внезапный сильный испуг; формулировка сохраняет результативность и интенсивность состояния.
- source_word: מִלִּפְנֵי הַמֶּלֶךְ וְהַמַּלְכָּה
  choice: «перед царём и царицей»
  rationale: 'Сохраняется пространственно-реляционное выражение исходного текста: Аман охвачен ужасом в их присутствии и перед их лицом.'
