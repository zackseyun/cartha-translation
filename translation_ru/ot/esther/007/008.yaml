base_translation:
  language: en
  yaml_path: translation/ot/esther/007/008.yaml
  text: The king returned from the palace garden to the house of the wine feast, and Haman was falling on the couch where Esther was. Then the king said, “Will he even assault the queen while I am in the house?” As the word went out from the king’s mouth, they covered Haman’s face.
translation:
  language: ru
  text: 'Царь вернулся из дворцового сада в зал винного пира. Аман падал на ложе, на котором была Есфирь. Царь сказал: «Неужели он ещё и на царицу посягнёт при мне, в моём доме?» Едва эти слова слетели с уст царя, как лицо Амана закрыли.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹפֵל
  choice: припал
  rationale: Причастие от נפל буквально описывает падение или простёртое положение. В данном контексте Аман, вероятно, умоляет Есфирь, припав к её ложу; «припал» естественно передаёт позу, не превращая её явно в нападение.
- source_word: לִכְבּוֹשׁ
  choice: посягнёт
  rationale: Глагол כבש означает «подчинить, овладеть, покорить»; в словах царя он получает угрожающий, вероятно сексуальный оттенок. «Посягнёт» сохраняет обвинительный смысл и некоторую присущую оригиналу недосказанность.
- source_word: בֵּית מִשְׁתֵּה הַיַּיִן
  choice: зал винного пира
  rationale: Буквально это «дом/зал пира вина». Русское выражение обозначает помещение, где проходил пир с вином, и звучит естественнее буквального «дом винного пира».
- source_word: וּפְנֵי הָמָן חָפוּ
  choice: лицо Амана закрыли
  rationale: Еврейская пассивная форма не называет исполнителей. Неопределённо-личная русская конструкция сохраняет это умолчание.
theological_decisions:
- issue: Характер обвинения царя против Амана
  choice: «на царицу посягнёт» с пояснением диапазона значения
  alternative: «изнасилует царицу» или «нападёт на царицу»
  rationale: Контекст допускает обвинение в сексуальном насилии, но сам глагол шире и буквально связан с покорением или овладением. Перевод не должен устранять эту напряжённую двусмысленность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. «Слетели с уст» передаёт быстроту реакции и сохраняет образ выхода слова из уст царя; неопределённо-личное «закрыли» не добавляет отсутствующего в еврейском тексте исполнителя.
