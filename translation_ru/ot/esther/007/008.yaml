  to: 'Царь вернулся из дворцового сада в зал винного пира. Аман падал на ложе, на котором была Есфирь. Царь сказал: «Неужели он ещё и на царицу посягнёт при мне, в моём доме?» Едва эти слова слетели с уст царя, как лицо Амана закрыли.'
