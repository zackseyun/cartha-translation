  terminology: «Народ», «истребить, убить и погубить», «рабы и рабыни» и «враг» уместны. «Возместит ущерб, нанесённый царю» является осторожной контекстуальной передачей трудной идиомы; сноска должна прямо отмечать, что возможен также смысл несоразмерности/нестоящего ущерба.
