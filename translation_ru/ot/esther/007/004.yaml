  source_fidelity: 'Начало стиха передано точно: пассивная метафора «проданы», отождествление Эсфири с её народом и тройное выражение угрозы сохранены. «В рабы и рабыни» верно передаёт явное различение полов. В заключении, однако, «не смог бы» неоправданно подчиняет фразу условию; еврейское «враг не [есть] равен/соответствует ущербу царя» сформулировано как самостоятельное настоящее утверждение и остаётся идиоматически трудным.'
