base_translation:
  language: en
  yaml_path: translation/ot/esther/007/004.yaml
  text: For we have been sold[a], I and my people, to be destroyed, to be killed, and to perish. But if we had been sold as male servants and female servants, I would have kept silent, for the adversary is not worth the damage to the king.
translation:
  language: ru
  text: Ведь мы проданы — я и мой народ, — чтобы нас истребить, убить и погубить. Если бы нас продали в рабы и рабыни, я промолчала бы, ведь враг не возместит ущерба, нанесённого царю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза трудна. Буквально: «враг не равен ущербу царя»; возможно также: «враг не стоит того ущерба, который понесёт царь». Слово נֵזֶק может означать ущерб, вред или материальный убыток.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְכַּרְנוּ
  choice: мы проданы
  rationale: Сохраняет торговую метафору еврейского пассива и подготавливает последующее упоминание буквальной продажи в рабство.
- source_word: עַמִּי
  choice: мой народ
  rationale: Естественно передаёт этническую и общинную принадлежность Эсфири, не сужая значение до политического термина «нация».
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: чтобы нас истребить, убить и погубить
  rationale: Сохраняет риторическое нагромождение трёх близких по смыслу глаголов и явно выражает направленность указа против Эсфири и её народа.
- source_word: וְאִלּוּ
  choice: если бы
  rationale: Передаёт контрфактическое условие; противопоставление ясно из перехода от действительной угрозы уничтожения к гипотетической продаже в рабство.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: в рабы и рабыни
  rationale: Передаёт принудительный статус и сохраняет явное различение мужской и женской форм.
- source_word: הֶחֱרַשְׁתִּי
  choice: я промолчала бы
  rationale: Естественная русская передача идиомы и контрфактического значения формы в условном высказывании.
- source_word: הַצָּר
  choice: враг
  rationale: В придворной речи обозначает враждебного виновника бедствия; современное «враг» звучит естественнее, чем книжное «супостат», и не добавляет толкования.
- source_word: שֹׁוֶה בְּנֵזֶק הַמֶּלֶךְ
  choice: не смог бы возместить царю этот ущерб
  rationale: Передаёт значение эквивалентности или соответствия в трудной еврейской идиоме как невозможность покрыть царский ущерб; указательное «этот» связывает ущерб с описанной гипотетической продажей народа.
theological_decisions:
- issue: Смысл трудной заключительной фразы שֹׁוֶה בְּנֵזֶק הַמֶּלֶךְ
  choice: враг не смог бы возместить царю этот ущерб
  alternative: враг не стоит того ущерба, который понесёт царь
  rationale: Еврейская конструкция допускает понимание через эквивалентность, компенсацию или сопоставление ценности. Основной текст выражает распространённый контекстуальный смысл, а примечание сохраняет более буквальную альтернативу, не снимая неопределённости.
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Тире выделяют пояснительное «я и мой народ», а три однородных инфинитива сохраняют напряжённую риторику оригинала. Формулировка избегает смягчения рабства и не устраняет неоднозначность заключительной идиомы.
