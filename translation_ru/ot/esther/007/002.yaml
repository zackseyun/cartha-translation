base_translation:
  language: en
  yaml_path: translation/ot/esther/007/002.yaml
  text: And the king said to Esther on the second day also[a], at the banquet of wine, “What is your petition, Queen Esther? It will be granted to you. And what is your request? Even to half the kingdom[b], it shall be done.”
translation:
  language: ru
  text: 'И во второй день, на винном пиру, царь сказал Эсфири: «Какова твоя просьба, царица Эсфирь? Она будет исполнена. И каково твоё желание? Даже до половины царства — оно будет исполнено».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם בַּיּוֹם הַשֵּׁנִי
  choice: И во второй день
  rationale: 'Передаёт продолжение событий: царь обращается к Эсфири и на второй день. Русское «и» естественно выражает значение גַּם в данном контексте.'
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: во время пира с вином
  rationale: Сохраняет прямое упоминание вина и обозначает обстановку пиршества без архаичного или неестественного оборота.
- source_word: מַה שְּׁאֵלָתֵךְ
  choice: О чём ты просишь
  rationale: Естественно передаёт вопрос о прошении в придворном контексте, сохраняя прямое обращение.
- source_word: וְתִנָּתֵן לָךְ
  choice: Тебе будет дано
  rationale: Сохраняет пассивную форму и близко следует буквальному смыслу еврейского выражения.
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: Чего ты желаешь
  rationale: Передаёт близкое, но несколько иначе выраженное второе обозначение просьбы, отражая лексическое варьирование исходного текста.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: до половины царства
  rationale: Сохраняет предел, выраженный предлогом עַד, и не добавляет отсутствующее в еврейском тексте притяжательное местоимение «моего».
- source_word: וְתֵעָשׂ
  choice: это будет исполнено
  rationale: Естественная русская формулировка для исполнения царём высказанного желания; пассивная конструкция сохраняет форму исходного текста.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: царица Эсфирь
  rationale: Соответствует обычному русскому порядку титула и имени и сохраняет торжественное обращение.
