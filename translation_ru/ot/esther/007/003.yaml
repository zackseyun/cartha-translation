base_translation:
  language: en
  yaml_path: translation/ot/esther/007/003.yaml
  text: Then Queen Esther answered and said[a], “If I have found favor in your eyes, O king, and if it pleases the king, let my life be given me at my petition, and my people at my request.”
translation:
  language: ru
  text: 'Царица Есфирь ответила: «Если я обрела благосклонность в твоих глазах, царь, и если царю угодно, пусть по моей просьбе мне будет дарована жизнь, а по моему прошению — моему народу.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть по моей просьбе мне будет дана моя жизнь, а по моему прошению — мой народ»; смысл второй части: пусть будет сохранена жизнь моему народу.'
    reason: Уточняет сохранённую пассивную конструкцию и эллипсис еврейского параллелизма, не устраняя его из основного текста.
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַר
  choice: ответила
  rationale: В повествовательном введении речи сочетание двух еврейских глаголов естественно передаётся одним русским глаголом; буквальное «ответила и сказала» звучало бы тяжеловесно.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: царица Есфирь
  rationale: Сохраняет царский титул и соответствует естественному порядку слов в современном русском языке.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Если я обрела благосклонность в твоих глазах
  rationale: Сохраняет образность придворной формулы и передаёт חֵן как расположение или благосклонность, а не как богословски нагруженную «благодать».
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Функционально это почтительное прямое обращение; форма без «о» современнее и при этом сохраняет достоинство речи.
- source_word: וְאִם עַל הַמֶּלֶךְ טוֹב
  choice: и если царю угодно
  rationale: Естественный русский эквивалент идиомы, обозначающей царское одобрение.
- source_word: תִּנָּתֶן לִי נַפְשִׁי
  choice: пусть ... мне будет дарована жизнь
  rationale: Сохраняет пассивную форму просьбы и верно передаёт נֶפֶשׁ в контексте смертельной угрозы как «жизнь», а не «душу».
- source_word: בִּשְׁאֵלָתִי ... בְּבַקָּשָׁתִי
  choice: по моей просьбе ... по моему прошению
  rationale: Передаёт параллелизм и небольшое лексическое варьирование двух близких еврейских существительных.
- source_word: וְעַמִּי
  choice: а ... моему народу
  rationale: В эллиптической второй части подразумевается то же действие — дарование жизни; дательный падеж естественно связан с сохранённой пассивной конструкцией.
