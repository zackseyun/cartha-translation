base_translation:
  language: en
  yaml_path: translation/ot/esther/007/007.yaml
  text: Then the king rose in his wrath from the wine banquet and went into the palace garden[a], but Haman remained to beg Queen Esther for his life[c][b], for he saw that the evil against him had been determined by the king.
translation:
  language: ru
  text: И царь в гневе поднялся с винного пира и вышел в дворцовый сад[a]. Аман же остался просить царицу Есфирь сохранить ему жизнь, ибо видел, что беда, направленная против него, уже предрешена царём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в сад битана». Слово «битан» может обозначать дворец, павильон или часть дворцового комплекса.'
    reason: cultural_note
  - marker: b
    text: 'Еврейское выражение можно также передать: «что беда против него уже была решена царём» или «что бедствие, исходящее от царя, уже было окончательно определено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲמָתוֹ
  choice: в ярости
  rationale: Передаёт интенсивность חֵמָה как пылающего гнева и естественно звучит в современном русском повествовании.
- source_word: מִמִּשְׁתֵּה הַיַּיִן
  choice: покинул пир с вином
  rationale: Сохраняет и значение מִשְׁתֶּה — пир, и прямое упоминание вина, не создавая неестественного сочетания «винный пир».
- source_word: גִּנַּת הַבִּיתָן
  choice: дворцовый сад
  rationale: Естественно передаёт сад при дворце или дворцовом комплексе; возможная отсылка בִּיתָן к павильону отмечена в сноске.
- source_word: עָמַד
  choice: остался
  rationale: 'В контексте противопоставлено уходу царя: Аман не просто встал, а остался в помещении, чтобы просить за жизнь.'
- source_word: לְבַקֵּשׁ עַל נַפְשׁוֹ
  choice: молить ... о своей жизни
  rationale: Передаёт идиоматический смысл отчаянной просьбы сохранить ему жизнь, сохраняя связь נֶפֶשׁ с жизнью.
- source_word: מֵאֶסְתֵּר הַמַּלְכָּה
  choice: царицу Есфирь
  rationale: Русский порядок титула и имени естественен; управление глагола «молить» позволяет точно указать адресата просьбы.
- source_word: כִּי כָלְתָה אֵלָיו הָרָעָה
  choice: уже решил обречь его на беду
  rationale: Передаёт завершённость, окончательность решения в כָלְתָה и направленную против Амана беду в הָרָעָה, не сводя выражение к отвлечённому «злу».
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: царь ... решил
  rationale: Источник решения выражен в русском активной конструкцией, которая естественно передаёт исходящее от царя окончательное осуждение.
