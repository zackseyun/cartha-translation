  text: So they hanged Haman on the gallows that he had prepared for Mordecai[a], and the king’s wrath subsided.
translation:
  language: ru
  text: И повесили Амана на дереве[a], которое он приготовил для Мардохея. А ярость царя утихла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на деревянном столбе (коле)»; традиционно: «на виселице». Еврейское עֵץ означает «дерево, древесина; деревянный столб», а глагол תלה — «вешать, подвешивать». Поэтому точный способ казни остаётся спорным; возможно также понимание «посадили на кол».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְלוּ
  choice: повесили
  rationale: Глагол תלה означает «вешать, подвешивать». Русское «повесили» естественно передаёт основной смысл, не утверждая с полной определённостью конкретный способ казни.
- source_word: הָמָן
  choice: Амана
  rationale: Имя передано в принятой русской библейской форме «Аман» и поставлено в винительный падеж.
- source_word: עַל הָעֵץ
  choice: на том деревянном сооружении
  rationale: עֵץ буквально обозначает дерево или древесину и здесь относится к заранее приготовленному орудию казни. Формулировка избегает чрезмерно узкого «виселица» и не навязывает спорную реконструкцию как кол или дерево.
- source_word: אֲשֶׁר הֵכִין לְמָרְדֳּכָי
  choice: которое он приготовил для Мардохея
  rationale: 'Сохраняет значение הכין «приготовить, устроить» и повествовательную иронию: Аман подвергся участи, предназначенной им Мардохею.'
- source_word: וַחֲמַת הַמֶּלֶךְ
  choice: Тогда ярость царя
  rationale: חֵמָה выражает сильный гнев; «ярость» передаёт интенсивность и звучит естественно в современном литературном русском. «Тогда» ясно связывает последующее успокоение царя с казнью Амана.
- source_word: שָׁכָכָה
  choice: утихла
  rationale: Глагол שׁכך значит «утихать, спадать». «Утихла» кратко и идиоматично сочетается с существительным «ярость».
theological_decisions:
- issue: Точный способ казни Амана
  choice: В основном тексте сохранено общее «повесили» с нейтральным обозначением деревянного сооружения.
  alternative: «Посадили на кол», «повесили на виселице» или «повесили на дереве».
  rationale: Сочетание תלה и עֵץ допускает подвешивание на деревянном орудии, в том числе возможное посажение на кол, но еврейский текст не позволяет бесспорно установить технический способ казни. Неопределённость сохранена и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным синтаксисом. Традиционные формы имён сохранены. Выражение «деревянное сооружение» выбрано ради точности и сохранения лексической неоднозначности, хотя оно менее традиционно, чем «виселица».
