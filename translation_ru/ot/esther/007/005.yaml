  text: וַ/יֹּ֨אמֶר֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וַ/יֹּ֖אמֶר לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֑ה מִ֣י ה֥וּא זֶה֙ וְ/אֵֽי זֶ֣ה ה֔וּא אֲשֶׁר מְלָא֥/וֹ לִבּ֖/וֹ לַ/עֲשׂ֥וֹת כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/005.yaml
  text: Then King Ahasuerus said to Esther the queen[a], “Who is he, and where is he[b], who has filled his heart to do this?”
translation:
  language: ru
  text: 'Тогда царь Ахашверош обратился к царице Эсфири и спросил: «Кто он такой и где он[a] — тот, кто осмелился[b] сделать это?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, менее вероятно: «и кто именно он?» — если вопрос относится не к местонахождению, а к точному установлению личности.'
    reason: alternative_reading
  - marker: b
    text: Буквально — «чьё сердце наполнило его [решимостью] сделать это»; это идиома со значением «кто осмелился» или «кто дерзнул».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: обратился ... и спросил
  rationale: Двойное «сказал ... сказал» перед вопросом передано естественной русской формулой, сохраняющей и обращение к собеседнице, и вопросительный характер реплики.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: царь Ахашверош
  rationale: Имя передано транслитерацией с еврейского, без отождествления с иным царским именем; титул поставлен перед именем по нормам русского языка.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: к царице Эсфири
  rationale: Еврейское приложение «Эсфирь, царица» передано естественным русским сочетанием титула и традиционной формы имени.
- source_word: מִי הוּא זֶה
  choice: кто он такой
  rationale: Оборот передаёт усиленный вопрос о личности; русское «кто он такой» сохраняет эту выразительность, не добавляя слова «человек».
- source_word: וְאֵי זֶה הוּא
  choice: и где он
  rationale: אֵי обычно имеет местное значение «где?». Менее вероятное понимание как вопроса о том, который именно это человек, отмечено в сноске.
- source_word: אֲשֶׁר מְלָאוֹ לִבּוֹ
  choice: тот, кто осмелился
  rationale: Еврейская идиома буквально связывает решимость с сердцем и означает, что человек дерзнул или решился на поступок. В основном тексте дан её естественный русский смысл, а образ сердца сохранён в сноске.
- source_word: לַעֲשׂוֹת כֵּן
  choice: сделать это
  rationale: כֵּן отсылает к только что описанному замыслу; «сделать это» ясно сохраняет данную связь.
