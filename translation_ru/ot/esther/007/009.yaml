  text: Then Harbonah[a], one of the eunuchs before the king, said, “Also, behold, the gallows that Haman made for Mordecai, who spoke good for the king, is standing at Haman’s house, fifty cubits high.” And the king said[c][b], “Hang him on it.”
translation:
  language: ru
  text: 'Тогда Харбона, один из евнухов, служивших перед царём, сказал: «И вот ещё: у дома Амана стоит деревянное сооружение[a] высотой в пятьдесят локтей, которое Аман приготовил для Мардохея, говорившего во благо царя[b]». Царь приказал: «Повесь его[c] на нём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дерево». Речь идёт о деревянном сооружении для казни; это могла быть виселица или столб.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сказавшего доброе о царе»; возможно также: «говорившего в пользу царя».'
    reason: lexical_alternative
  - marker: c
    text: 'Или, возможно: «Посади его на кол». Еврейское выражение означает подвешивание на деревянном сооружении, но не позволяет точно установить способ казни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבוֹנָה
  choice: Харбона
  rationale: Имя передано принятой русской библейской транслитерацией.
- source_word: הַסָּרִיסִים
  choice: евнухов
  rationale: В контексте персидского царского двора слово прямо обозначает евнухов, хотя может употребляться и шире о придворных служителях.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: служивших перед царём
  rationale: Передаёт принадлежность к придворным, находящимся при царе, и звучит естественнее буквального «перед царём».
- source_word: גַּם הִנֵּה
  choice: Вот ещё
  rationale: Сохраняет добавочное значение גַּם и указательно-эмфатическую силу הִנֵּה в современном русском языке.
- source_word: הָעֵץ
  choice: деревянное сооружение
  rationale: Буквально «дерево; древесина». Контекст указывает на сооружение для казни, однако его точный вид — виселица, столб или иная деревянная конструкция — не определён.
- source_word: עָשָׂה ... לְמָרְדֳּכַי
  choice: приготовил для Мардохея
  rationale: «Приготовил» естественно выражает создание сооружения с целью казнить Мардохея.
- source_word: דִּבֶּר טוֹב עַל הַמֶּלֶךְ
  choice: сказавшего царю то, что было ему во благо
  rationale: 'Передаёт неоднозначный оборот: речь Мардохея принесла царю пользу, поскольку он сообщил о заговоре, без ненужного уточнения самой ситуации.'
- source_word: עֹמֵד בְּבֵית הָמָן
  choice: у дома Амана стоит
  rationale: Сохраняет значение наличного состояния и допускает расположение сооружения на территории дома Амана, а не обязательно внутри здания.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: высотой в пятьдесят локтей
  rationale: Древняя мера сохранена ради точности; форма естественна для русского библейского повествования.
- source_word: תְּלֻהוּ עָלָיו
  choice: Повесьте Амана на нём
  rationale: Местоименный объект раскрыт именем «Амана» для ясности. Глагол может обозначать подвешивание тела или казнь на деревянной конструкции и не устанавливает точной техники.
