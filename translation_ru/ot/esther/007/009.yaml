  source_fidelity: 'Основной смысл передан точно: Харбона сообщает о приготовленном Аманом сооружении для казни Мардохея, его местонахождении и высоте, после чего царь велит казнить на нём Амана. Однако в еврейском тексте заключительное повеление стоит в единственном числе; русское «Повесьте» необоснованно меняет адресата на множественное число. Формулировку о Мардохее лучше приблизить к неоднозначному דִּבֶּר טוֹב עַל הַמֶּלֶךְ, не превращая её в прямую речь Мардохея, обращённую к царю.'
  naturalness: «И вот ещё» более естественно и стилистически ровнее, чем разговорное «Вот ещё» после двоеточия. «Говорившего во благо царя» сохраняет сжатость и формальную неоднозначность исходного оборота. Единственное число «Повесь его» естественно передаёт царское распоряжение, обращённое к Харбоне.
  terminology: «Евнухи», «локти», «Аман», «Мардохей» и «Харбона» уместны. «Деревянное сооружение» корректно не предрешает, была ли это виселица, столб или иная конструкция; примечание надлежащим образом объясняет буквальное значение הָעֵץ. Примечание к глаголу казни следует согласовать с единственным числом повеления.
