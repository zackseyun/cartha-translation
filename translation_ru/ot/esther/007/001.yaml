  text: И царь и Аман пришли пить с царицей Есфирью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришли
  rationale: Форма wayyiqtol от בוא продолжает повествование и обозначает прибытие. Множественное число естественно в русском при составном подлежащем «царь и Аман».
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Обычный русский эквивалент מֶלֶךְ; определённость понятна из контекста и не требует отдельного выражения.
- source_word: וְהָמָן
  choice: и Аман
  rationale: Союз передан прямо; имя дано в принятой русской библейской форме.
- source_word: לִשְׁתּוֹת
  choice: пировать
  rationale: Буквально инфинитив означает «пить», однако в контексте книги Есфирь речь идёт о царском пире. «Пировать» естественно передаёт ситуацию по-русски, тогда как буквальное «пить» может создать нежелательный оттенок; буквальная форма сохранена в примечании.
- source_word: עִם
  choice: с
  rationale: Прямой и естественный эквивалент предлога совместности.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: с царицей Есфирью
  rationale: Еврейское приложение буквально имеет порядок «Есфирь, царица»; современный русский естественно ставит титул перед именем. Творительный падеж обусловлен предлогом «с».
- source_word: וַ
  choice: И
  rationale: Начальный повествовательный союз сохранён, чтобы ясно связать стих с предыдущим эпизодом.
