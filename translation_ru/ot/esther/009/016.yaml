  text: וּ/שְׁאָ֣ר הַ/יְּהוּדִ֡ים אֲשֶׁר֩ בִּ/מְדִינ֨וֹת הַ/מֶּ֜לֶךְ נִקְהֲל֣וּ וְ/עָמֹ֣ד עַל נַפְשָׁ֗/ם וְ/נ֨וֹחַ֙ מֵ/אֹ֣יְבֵי/הֶ֔ם וְ/הָרֹג֙ בְּ/שֹׂ֣נְאֵי/הֶ֔ם חֲמִשָּׁ֥ה וְ/שִׁבְעִ֖ים אָ֑לֶף וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָֽׁלְח֖וּ אֶת יָדָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/016.yaml
  text: And the rest of the Jews who were in the king’s provinces gathered themselves together and stood for their lives[a], and had relief from their enemies, and killed seventy-five thousand of those who hated them[b]; but they did not lay a hand on the plunder.
translation:
  language: ru
  text: А остальные иудеи, жившие в царских областях, собрались, чтобы встать на защиту своей жизни[a]. Они добились покоя от своих врагов и убили семьдесят пять тысяч тех, кто их ненавидел; но к добыче[b] руки не протянули.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постоять за свою жизнь».'
    reason: Более буквальный вариант еврейского выражения, обозначающего действие в защиту собственной жизни.
  - marker: b
    text: 'Или: «к трофеям».'
    reason: Слово בִּזָּה обозначает имущество, захваченное после военного столкновения; возможны русские соответствия «добыча» и «трофеи».
lexical_decisions:
- source_word: וּשְׁאָר הַיְּהוּדִים
  choice: А остальные иудеи
  rationale: שְׁאָר обозначает оставшуюся часть и противопоставляет этих иудеев жителям Суз из предыдущего контекста. «Иудеи» естественно передаёт название народа в книге Есфирь.
- source_word: אֲשֶׁר בִּמְדִינוֹת הַמֶּלֶךְ
  choice: жившие в царских областях
  rationale: מְדִינוֹת — административные области державы; причастная конструкция по-русски звучит естественнее буквального «которые были».
- source_word: נִקְהֲלוּ
  choice: собрались
  rationale: Глагол обозначает совместное собрание иудеев в ответ на угрозу; возвратная русская форма сохраняет корпоративный оттенок.
- source_word: וְעָמֹד עַל נַפְשָׁם
  choice: чтобы постоять за свою жизнь
  rationale: Передаёт образ «стоять за свою жизнь» и ясно указывает на самозащиту, не превращая выражение в отвлечённое «постоять за себя».
- source_word: וְנוֹחַ מֵאֹיְבֵיהֶם
  choice: добились покоя от своих врагов
  rationale: נוּחַ здесь означает обретение покоя или избавления от вражеского давления. Формулировка сохраняет мотив покоя и понятна современному читателю.
- source_word: וְהָרֹג בְּשֹׂנְאֵיהֶם
  choice: и убили ... тех, кто их ненавидел
  rationale: Прямо передаёт насильственное действие и обозначение противников, не смягчая и не усиливая текст.
- source_word: חֲמִשָּׁה וְשִׁבְעִים אָלֶף
  choice: семьдесят пять тысяч
  rationale: Число приведено в обычном для современного русского языка порядке.
- source_word: וּבַבִּזָּה לֹא שָׁלְחוּ אֶת יָדָם
  choice: но к добыче руки не протянули
  rationale: Русский оборот сохраняет еврейский образ протянутой руки и ясно выражает отказ присваивать военную добычу; союз передан противительно по контексту.
theological_decisions:
- issue: Нравственная рамка действий иудеев
  choice: постоять за свою жизнь
  alternative: защищать себя; выступить против врагов
  rationale: Еврейское выражение прямо связывает их действия с сохранением жизни. Перевод сохраняет рамку самозащиты, при этом не скрывает последующего убийства противников.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис разделён на два предложения ради ясности; образные выражения «постоять за жизнь» и «руки не протянули» сохранены.
