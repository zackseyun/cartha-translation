  text: לְ/קַיֵּם֮ עֲלֵי/הֶם֒ לִ/הְי֣וֹת עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר וְ/אֵ֛ת יוֹם חֲמִשָּׁ֥ה עָשָׂ֖ר בּ֑/וֹ בְּ/כָל שָׁנָ֖ה וְ/שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/021.yaml
  text: to establish among them that they should observe the fourteenth day of the month Adar[a], and the fifteenth day of it, year after year,
translation:
  language: ru
  text: чтобы обязать их ежегодно отмечать четырнадцатый день месяца адара и пятнадцатый день того же месяца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְקַיֵּם עֲלֵיהֶם
  choice: чтобы обязать их
  rationale: В данном административно-правовом контексте сочетание выражает установление для общины обязательного порядка. «Обязать их» естественно передаёт как каузативное значение לְקַיֵּם, так и оттенок возложения, присущий עֲלֵיהֶם.
- source_word: לִהְיוֹת עֹשִׂים
  choice: отмечать
  rationale: Буквально «быть делающими»; применительно к памятным дням современное русское «отмечать» естественно передаёт регулярное соблюдение установленного празднования.
- source_word: אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: четырнадцатый день месяца адара
  rationale: Сохранена формальная календарная конструкция оригинала; название месяца дано со строчной буквы по нормам современного русского языка.
- source_word: וְאֵת יוֹם חֲמִשָּׁה עָשָׂר בּוֹ
  choice: и пятнадцатый день того же месяца
  rationale: Местоименное בּוֹ отсылает к месяцу адару. Явное «того же месяца» по-русски яснее и естественнее буквального «в нём».
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: ежегодно
  rationale: Повтор слова «год» имеет распределительное значение и подчёркивает регулярность. «Ежегодно» кратко и идиоматично передаёт это значение в русском языке.
