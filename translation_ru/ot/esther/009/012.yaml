base_translation:
  language: en
  yaml_path: translation/ot/esther/009/012.yaml
  text: Then the king said to Esther the queen[a], “In Susa the citadel the Jews have killed and destroyed five hundred men, along with the ten sons of Haman. What then have they done in the rest of the king’s provinces? Now what is your petition? It will be granted to you. And what is your further request? It will be done.”
translation:
  language: ru
  text: 'Тогда царь сказал царице Эсфири: «В Сузах, в цитадели, иудеи убили и истребили пятьсот мужчин, а также десятерых сыновей Амана. Что же[a] они сделали в остальных царских областях? Какова теперь твоя просьба? Она будет удовлетворена. И какова твоя дополнительная просьба? Она будет исполнена».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или проще: «Что они сделали в остальных царских областях?» Частица «же» в основном тексте передаёт подразумеваемый вывод царя из сообщения о событиях в Сузах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: В Сузах, в крепости
  rationale: Сохраняет название города и значение בִּירָה как укреплённого царского комплекса, не сужая его до одного дворца.
- source_word: הָרְגוּ ... וְאַבֵּד
  choice: убили и истребили
  rationale: Передаёт оба еврейских глагола и их совокупную усилительную силу.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: пятьсот мужчин
  rationale: Прямо передаёт אִישׁ в вероятном контексте вооружённого столкновения, не заменяя его нейтральным обозначением.
- source_word: וְאֵת עֲשֶׂרֶת בְּנֵי הָמָן
  choice: а также десятерых сыновей Амана
  rationale: Ясно выражает присоединение второго прямого дополнения и естественно звучит по-русски.
- source_word: בִּשְׁאָר מְדִינוֹת הַמֶּלֶךְ
  choice: в остальных царских областях
  rationale: «Области» естественно обозначают административные единицы Персидской империи; «остальных» передаёт שְׁאָר.
- source_word: מֶה עָשׂוּ
  choice: Что же они сделали
  rationale: Частица «же» передаёт подразумеваемый вывод царя из сообщения о событиях в Сузах, не превращая его в прямое утверждение.
- source_word: שְּׁאֵלָתֵךְ
  choice: твоя просьба
  rationale: В придворном контексте речь идёт о просьбе, обращённой к царю; современное «просьба» естественнее более канцелярского «прошение».
- source_word: וְיִנָּתֵן לָךְ
  choice: Она будет удовлетворена
  rationale: Идиоматично передаёт пассивную конструкцию со значением удовлетворения обращённой к царю просьбы.
- source_word: בַּקָּשָׁתֵךְ עוֹד
  choice: твоё дальнейшее пожелание
  rationale: «Пожелание» сохраняет отличие от предшествующего שְׁאֵלָה, а «дальнейшее» передаёт עוֹד как указание на дополнительную просьбу.
- source_word: וְתֵעָשׂ
  choice: Оно будет исполнено
  rationale: Сохраняет пассивный смысл обещания привести пожелание в исполнение.
