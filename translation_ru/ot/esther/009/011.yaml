lexical_decisions:
- source_word: בָּא
  choice: дошло
  rationale: Буквально «пришло»; в сочетании с сообщением о числе естественно по-русски передаётся как «дошло до царя», без добавления отсутствующего в еврейском тексте пассивного «было сообщено».
- source_word: שׁוּשַׁן הַבִּירָה
  choice: крепости Сузы
  rationale: הַבִּירָה обозначает укреплённый дворцово-административный центр; «крепость Сузы» сохраняет различие между цитаделью и городом в более широком смысле.
- source_word: מִסְפַּר הַהֲרוּגִים
  choice: число убитых
  rationale: Прямо и точно передаёт счёт погибших от насильственной смерти, не уточняя субъект действия сверх текста.
