base_translation:
  language: en
  yaml_path: translation/ot/esther/009/015.yaml
  text: The Jews who were in Susa also assembled on the fourteenth day of the month of Adar[a], and they killed three hundred men in Susa; but they did not lay a hand on the plunder.
translation:
  language: ru
  text: Иудеи, находившиеся в Сузах, собрались также в четырнадцатый день месяца Адара и убили в Сузах триста человек, но добычи не тронули[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не протянули руки к добыче».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: собрались
  rationale: Передаёт целенаправленное совместное действие группы и естественно звучит по-русски.
- source_word: הַיְּהוּדִים
  choice: иудеи
  rationale: В книге Есфирь обозначает еврейский народ как этнорелигиозную общность в персидском рассеянии; традиционное и понятное русское соответствие.
- source_word: אֲשֶׁר בְּשׁוּשָׁן
  choice: находившиеся в Сузах
  rationale: Точно выделяет ту часть иудеев, которая жила в городе Сузы.
- source_word: גַּם
  choice: также
  rationale: 'Сохраняет добавочное значение: собрание произошло и в этот день, после событий предыдущего дня.'
- source_word: בְּיוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: в четырнадцатый день месяца адара
  rationale: Сохраняет полную календарную формулу еврейского текста и естественный русский порядок слов.
- source_word: וַיַּהַרְגוּ
  choice: убили
  rationale: Прямое современное соответствие обычному древнееврейскому глаголу со значением убийства, без эвфемизма или архаизации.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: триста человек
  rationale: В числовой конструкции אִישׁ имеет счётно-дистрибутивную функцию; русское «триста человек» точно и естественно, тогда как «триста мужчин» в данном контексте неоправданно подчёркивало бы пол.
- source_word: וּבַבִּזָּה
  choice: но добычи
  rationale: בִּזָּה обозначает военную добычу; союз передан противительным «но», поскольку фраза противопоставляет убийство отказу присвоить имущество.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: не тронули
  rationale: Естественно передаёт смысл идиомы — они не стали брать или присваивать добычу; буквальный образ сохранён в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис близок к древнееврейскому, но не буквалистичен; идиома о руке передана естественно, а её буквальная форма вынесена в сноску. Маркер сноски поставлен у относящейся к нему фразы о добыче.
