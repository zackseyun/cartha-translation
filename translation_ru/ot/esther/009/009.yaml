lexical_decisions:
- source_word: פַּרְמַשְׁתָּא
  choice: Пар Машту
  rationale: Нет, слитное имя передано как «Пар машта»? Для публикационного текста выбрана форма «Пар машту» в винительном падеже, поскольку повторяемая частица אֵת маркирует прямое дополнение в продолжающемся перечне.
- source_word: אֲרִיסַי
  choice: Арисая
  rationale: Собственное имя транслитерировано и поставлено в винительный падеж как одушевлённое прямое дополнение.
- source_word: אֲרִדַי
  choice: Аридая
  rationale: Собственное имя транслитерировано и поставлено в винительный падеж согласно синтаксической функции אֵת.
- source_word: וַיְזָתָא
  choice: Вайзату
  rationale: Собственное имя передано близко к масоретской огласовке; форма винительного падежа отражает функцию прямого дополнения.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: перечень через запятые с союзом «и» перед последним именем
  rationale: Многократное וְאֵת вводит каждый элемент продолжающегося перечня. В естественном русском повтор союза можно свернуть, сохранив его в примечании.
