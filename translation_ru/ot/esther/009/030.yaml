base_translation:
  language: en
  yaml_path: translation/ot/esther/009/030.yaml
  text: And he sent letters to all the Jews in the one hundred twenty-seven provinces of the kingdom of Ahasuerus[a], words of peace and truth[c][b],
translation:
  language: ru
  text: И он разослал письма всем иудеям в ста двадцати семи провинциях царства Ахашвероша[a] со словами мира и истины[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ахашверош — еврейская форма царского имени; исторически его часто отождествляют с Ксерксом I.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «слова мира и истины»; возможный перевод: «послание о мире и истине».'
    reason: lexical_alternative
  - marker: c
    text: Слово «истина» здесь может также иметь значение «верность» или «надёжность».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И он разослал
  rationale: Повествовательная форма продолжает последовательность событий; «разослал» естественно передаёт отправку множества писем многочисленным адресатам, а местоимение сохраняет мужской род глагола в еврейском тексте.
- source_word: סְפָרִים
  choice: письма
  rationale: В персидском административном контексте речь идёт о письменных посланиях, рассылаемых по царству; «письма» — наиболее ясный современный эквивалент.
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: всем иудеям
  rationale: Фраза обозначает всех представителей народа как совокупность адресатов.
- source_word: אֶל שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה
  choice: в ста двадцати семи областях
  rationale: Второе אֶל указывает на географический охват адресатов; русский предложный оборот ясно показывает, что иудеи находились во всех этих административных областях.
- source_word: מְדִינָה
  choice: областях
  rationale: Слово обозначает административные части Персидского царства; «область» понятно современному читателю и не вводит более узкий специальный термин «сатрапия».
- source_word: מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: царства Ахашвероша
  rationale: Прямо передаёт еврейскую конструкцию принадлежности, не добавляя отсутствующего здесь титула «царь».
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ахашверош
  rationale: Сохранена транслитерация еврейской формы имени; возможное историческое отождествление вынесено в примечание.
- source_word: דִּבְרֵי שָׁלוֹם וֶאֱמֶת
  choice: со словами мира и истины
  rationale: Сохранены ключевые существительные исходного выражения. Предлог «со» делает связь с письмами естественной по-русски, не превращая выражение в отдельную прямую речь.
