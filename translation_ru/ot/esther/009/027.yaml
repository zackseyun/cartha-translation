base_translation:
  language: en
  yaml_path: translation/ot/esther/009/027.yaml
  text: 'the Jews established and accepted for themselves[a], for their offspring, and for all who joined them, that it should not fail: to observe these two days according to what was written for them and at their appointed time[b], year after year.'
translation:
  language: ru
  text: Иудеи установили и приняли на себя, на своих потомков и на всех присоединяющихся к ним[a] обязательство, чтобы соблюдение этих двух дней не прекращалось[b], — соблюдать их из года в год согласно их письменному предписанию и в установленное для них время.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на всех, кто к ним примкнул». Еврейское выражение обозначает тех, кто присоединяется к иудеям или связывает себя с ними.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и чтобы не прошло». В данном контексте выражение означает, что соблюдение этих дней не должно прекращаться или оставляться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִיְּמוּ וְקִבְּלוּ
  choice: постановили и приняли обязательство
  rationale: Первый глагол передаёт утверждение установления, а второй — принятие его на себя. Такая пара сохраняет юридико-обязывающий смысл еврейской формулы и естественно звучит по-русски.
- source_word: עֲלֵיהֶם וְעַל זַרְעָם
  choice: за себя, за своих потомков
  rationale: Предлог עַל обозначает распространение принятого обязательства на самих иудеев и последующие поколения. «Потомки» яснее и естественнее буквального «семя».
- source_word: כָּל הַנִּלְוִים עֲלֵיהֶם
  choice: всех, кто к ним присоединится
  rationale: Причастие от לוה обозначает людей, присоединяющихся к иудеям; будущее время уместно, поскольку установление распространяется и на последующих присоединившихся.
- source_word: וְלֹא יַעֲבוֹר
  choice: не допускать, чтобы этот обычай прекратился
  rationale: Буквальный образ «не пройдёт» в данном контексте означает, что соблюдение не должно прерваться или выйти из употребления. Слово «обычай» эксплицирует подразумеваемое соблюдение, не превращая его в отдельный предмет установления.
- source_word: לִהְיוֹת עֹשִׂים
  choice: соблюдать
  rationale: Буквально «быть делающими» выражает продолжающееся исполнение; в контексте установленных памятных дней естественный русский эквивалент — «соблюдать».
- source_word: כִּכְתָבָם
  choice: согласно написанному о них
  rationale: Сохраняется отсылка к письменному предписанию без излишней конкретизации документа; местоименный суффикс соотнесён с двумя днями.
- source_word: וְכִזְמַנָּם
  choice: в назначенное для них время
  rationale: זמן обозначает установленный срок; местоименный суффикс сохранён как «для них», то есть для этих дней.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: из года в год
  rationale: Русский оборот естественно передаёт усиленную еврейскую формулу ежегодного повторения.
