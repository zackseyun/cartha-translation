    reason: cross_reference
lexical_decisions:
- source_word: וְ/אֵת
  choice: и (с именем в винительном падеже)
  rationale: Сочетание וְ с показателем прямого дополнения אֵת вводит каждое следующее имя в продолжающемся перечне. В русском אֵת отдельно не передаётся, а зависимость от подразумеваемого глагола «убили» выражается винительным падежом; повтор союза «и» сохраняет структуру еврейского текста.
- source_word: פּוֹרָתָא
  choice: Порату
  rationale: Личное имя передано транслитерацией «Пората» и поставлено в винительный падеж как прямое дополнение к глаголу, подразумеваемому из Есфирь 9:7.
- source_word: אֲדַלְיָא
  choice: Адалию
  rationale: Личное имя транслитерировано как «Адалия» и поставлено в винительный падеж в соответствии с русским синтаксисом.
- source_word: אֲרִידָתָא
  choice: Аридату
  rationale: Личное имя транслитерировано как «Аридата» и поставлено в винительный падеж в соответствии с русским синтаксисом.
