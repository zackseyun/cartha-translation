  source_fidelity: 'Основной смысл передан верно: это придворная просьба Эсфири о том, чтобы иудеям в Сузах разрешили также действовать на следующий день по действующему на этот день указу, а с десятью сыновьями Амана совершили действие, выраженное глаголом «повесить». Однако «деревянное сооружение» не является прямой и естественной передачей עֵץ («дерево; древесина») и неоправданно заменяет образ оригинала техническим описанием.'
  naturalness: Фраза в целом литературна, но сочетание «повесят на деревянном сооружении» звучит канцелярски и неестественно. «Повесят на дереве» — естественно, точно и сохраняет древний образ; возможное значение «столб/виселица» следует вынести в сноску.
  terminology: «Эсфирь», «Сузы», «иудеи», «Аман» и придворная формула «Если царю угодно» удачны. «Указ» приемлемо передаёт דָּת в данном контексте. Сноска должна отмечать лексическую неоднозначность עֵץ, не утверждая способ казни или посмертного выставления как факт данного стиха.
