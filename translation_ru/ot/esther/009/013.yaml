base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
translation:
  language: ru
  text: 'Эсфирь сказала: «Если царю угодно, пусть иудеям, которые в Сузах, будет позволено завтра также поступить по нынешнему указу, а десятерых сыновей Амана пусть повесят на дереве[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на дереве». Древнееврейское слово может также обозначать деревянный столб, виселицу или иной деревянный предмет; точный вид сооружения не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Если царю угодно
  rationale: Придворная формула выражает благосклонность и одобрение царя, а не нравственную оценку; русский оборот естественен и сохраняет почтительный регистр.
- source_word: יִנָּתֵן
  choice: пусть ... будет позволено
  rationale: Пассивно-пожелательная форма в контексте передаёт просьбу об официальном разрешении.
- source_word: גַּם מָחָר
  choice: и завтра
  rationale: Передаёт продление действующего разрешения ещё на следующий день.
- source_word: לַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: иудеям, которые в Сузах
  rationale: Сохраняет значение адресатов разрешения и относительную конструкцию оригинала.
- source_word: לַעֲשׂוֹת כְּדָת הַיּוֹם
  choice: поступить по нынешнему указу
  rationale: דָּת в книге Есфирь обозначает официальный указ; широкий глагол «поступить» не уточняет сверх оригинала конкретные действия.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: десятерых сыновей Амана
  rationale: Естественная русская передача древнееврейской сопряжённой конструкции.
- source_word: יִתְלוּ עַל־הָעֵץ
  choice: пусть повесят на деревянном сооружении
  rationale: תלה означает «вешать», а עֵץ буквально обозначает дерево или древесину и в данном контексте — деревянное сооружение для публичной казни либо выставления тел; основной текст избегает неоправданно узкой реконструкции.
theological_decisions:
- issue: Характер повешения сыновей Амана
  choice: Не уточнять в основном тексте, была ли это казнь или посмертное выставление тел
  alternative: Передать как непосредственную казнь через повешение или посажение на кол
  rationale: Предыдущий рассказ уже сообщает о гибели сыновей Амана (Есф. 9:10), поэтому здесь, вероятно, имеется в виду публичное выставление тел, однако сам данный стих прямо этого не поясняет.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным придворным регистром. Синтаксис близок к древнееврейскому, но естественен по-русски; неоднозначность עֵץ и способа обращения с телами сохранена в сноске.
