base_translation:
  language: en
  yaml_path: translation/ot/esther/009/005.yaml
  text: So the Jews struck all their enemies with the stroke of the sword[a], and with slaughter and destruction[b], and they did to those who hated them as they pleased.
translation:
  language: ru
  text: Иудеи поразили всех своих врагов ударом меча, убийством и уничтожением; с ненавидевшими их они поступили, как им было угодно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по своему желанию». Буквально: «согласно их желанию (воле)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: поразили
  rationale: Глагол נכה обозначает нанесение удара или поражение; «поразили» сохраняет широту значения, тогда как последующие существительные уточняют смертельный характер действий.
- source_word: הַיְּהוּדִים
  choice: иудеи
  rationale: В книге Есфирь יְהוּדִים называет еврейский народ в персидской диаспоре; «иудеи» — традиционное и литературно естественное русское обозначение в данном историческом контексте.
- source_word: בְּכָל אֹיְבֵיהֶם
  choice: всех своих врагов
  rationale: Передаёт полный охват, выраженный כָּל, естественным русским оборотом.
- source_word: מַכַּת חֶרֶב
  choice: ударами меча
  rationale: Конструкция буквально означает «удар меча». Множественное число по-русски естественно при множественном объекте и сохраняет образ непосредственного поражения мечом.
- source_word: וְהֶרֶג וְאַבְדָן
  choice: убивая и истребляя их
  rationale: Два еврейских существительных означают убийство и уничтожение. Русские деепричастия естественно присоединяют их к глаголу «поразили», сохраняя нарастание тяжести без ослабления насилия.
- source_word: בְשֹׂנְאֵיהֶם
  choice: с ненавидевшими их
  rationale: Субстантивированное причастие от שׂנא буквально обозначает тех, кто их ненавидел; это сохраняет отличие от «врагов» в первой части стиха.
- source_word: כִּרְצוֹנָם
  choice: по своей воле
  rationale: Буквально «согласно их желанию/воле». Формулировка сохраняет смысл свободы действий и не уточняет мотив сверх исходного текста.
theological_decisions:
- issue: Передача описания насилия без смягчения или усиления
  choice: Сохранено прямое описание поражения мечом, убийства и истребления.
  alternative: Обобщить как «победили» либо усилить до полного «уничтожили» без сохранения отдельных членов ряда.
  rationale: Еврейский текст намеренно накапливает обозначения смертельного насилия; перевод воспроизводит эту суровость, не добавляя утверждения о полном истреблении всех врагов.
- issue: Значение כִּרְצוֹנָם
  choice: по своей воле
  alternative: как им было угодно
  rationale: Более буквальная формулировка сохраняет возможный диапазон между добровольным решением, желанием и усмотрением, не придавая выражению излишне эмоциональной окраски.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис приближен к еврейскому нарастанию действий, но адаптирован к естественной русской речи.
