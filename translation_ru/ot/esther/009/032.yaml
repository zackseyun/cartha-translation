    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲמַר
  choice: повеление
  rationale: Существительное обозначает здесь властное распоряжение Эсфири, а не просто произнесённое слово; «повеление» передаёт его официальный и действенный характер.
- source_word: אֶסְתֵּר
  choice: Эсфири
  rationale: Имя передано в принятой русской библейской форме; родительный падеж отражает конструкцию «повеление Эсфири».
- source_word: קִיַּם
  choice: утвердило
  rationale: Глагол означает «сделать твёрдым, установить, подтвердить»; при подлежащем «повеление» форма «утвердило» естественно передаёт юридико-административный оттенок.
- source_word: דִּבְרֵי
  choice: постановления
  rationale: דְּבָרִים может означать не только слова, но также дела, положения или установления. В контексте официального закрепления Пурима «постановления» передаёт содержание предписаний, не сводя их к устной речи.
- source_word: הַפֻּרִים הָאֵלֶּה
  choice: об этих днях Пурима
  rationale: Название праздника сохранено как «Пурим», а указательное слово הָאֵלֶּה передано словом «этих». Добавление «днях» ясно выражает связь постановлений с празднованием, однако альтернативное более формальное прочтение отмечено в сноске.
- source_word: וְנִכְתָּב
  choice: и это было записано
  rationale: Нифаль передан страдательной конструкцией. «Записано» в данном контексте естественнее русского «написано» и сохраняет возможность официальной фиксации.
- source_word: בַּסֵּפֶר
  choice: в книге
  rationale: סֵפֶר может обозначать книгу, свиток или письменный документ. «В книге» — прямой эквивалент, не уточняющий неизвестный из самого стиха вид документа.
