base_translation:
  language: en
  yaml_path: translation/ot/esther/009/022.yaml
  text: as the days on which the Jews had rest from their enemies[a], and as the month that had been turned for them from sorrow to gladness and from mourning to a good day, to make them days of feasting and gladness, and of sending portions, each man to his neighbor[c][b], and gifts to the poor.
translation:
  language: ru
  text: как дни, в которые иудеи обрели покой от своих врагов, и как месяц, который для них превратился из скорби в радость и из траура в праздничный день[a], чтобы сделать эти дни днями пира и радости, днями, когда посылают угощения[b] друг другу[c] и дарят подарки бедным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в хороший день»; по смыслу — в день праздника или торжества.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «посылать доли (порции)»; вероятно, имеются в виду порции еды как праздничные дары.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «каждый своему ближнему» — распределительное выражение взаимного дарения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחוּ
  choice: обрели покой
  rationale: Глагол נוח обозначает наступление покоя или избавление от давления. «Обрели покой» естественно передаёт завершившееся избавление от врагов.
- source_word: מֵאֹיְבֵיהֶם
  choice: от своих врагов
  rationale: Предлог מִן выражает удаление или избавление от угрозы; русское «покой от врагов» сохраняет эту связь.
- source_word: נֶהְפַּךְ
  choice: обратившийся
  rationale: Форма нифаль от הפך выражает совершившуюся перемену. Причастный оборот естественно согласуется со словом «месяц» и сохраняет мотив переворота участи.
- source_word: יָגוֹן
  choice: скорбь
  rationale: Слово обозначает глубокую печаль; «скорбь» образует ясный контраст с радостью.
- source_word: שִׂמְחָה
  choice: радость
  rationale: Передаёт как внутреннюю радость, так и праздничное ликование и естественно звучит в обоих случаях.
- source_word: אֵבֶל
  choice: плач
  rationale: В данном параллелизме слово указывает на выраженное траурное состояние. «Плач» отличает его от более общего יָגוֹן — «скорби».
- source_word: לְיוֹם טוֹב
  choice: в праздничный день
  rationale: Буквально выражение означает «в хороший день», но в контексте пира и радости имеет значение дня празднования. Буквальная форма отмечена в сноске.
- source_word: לַעֲשׂוֹת אוֹתָם
  choice: чтобы сделать их
  rationale: Сохраняется прямое значение инфинитива и местоименная связь с упомянутыми днями; выражение вводит установленный характер памятных дней.
- source_word: יְמֵי מִשְׁתֶּה
  choice: днями пира
  rationale: מִשְׁתֶּה означает пир или праздничное застолье, нередко с питьём. «Пир» передаёт праздничность без ненужного акцента на алкоголе.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: посылать угощения
  rationale: מָנוֹת буквально означает «доли, порции»; в праздничном контексте речь, вероятнее всего, идёт о порциях еды, посылаемых в дар. «Угощения» естественно выражает этот обычай, а буквальный смысл указан в сноске.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: друг другу
  rationale: Буквальная распределительная конструкция «каждый своему ближнему» обозначает взаимное дарение. «Друг другу» точно и естественно передаёт её функцию в современном русском языке.
- source_word: מַתָּנוֹת לָאֶבְיוֹנִים
  choice: дарить подарки бедным
  rationale: אֶבְיוֹנִים — люди бедные или нуждающиеся. Формулировка сохраняет прямой социально-нравственный смысл.
theological_decisions:
- issue: Распределительное выражение אִישׁ לְרֵעֵהוּ
  choice: друг другу
  alternative: каждый своему ближнему
  rationale: Мужской род в еврейской идиоме служит обычной распределительной формой и в контексте не ограничивает обычай только мужчинами. Русское взаимное местоимение сохраняет смысл, не добавляя такого ограничения; буквальная форма вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены параллельные контрасты «из скорби в радость» и «из плача в праздничный день», а культурно обусловленные выражения пояснены сносками.
