source:
  edition: WLC
  text: כִּי֩ הָמָ֨ן בֶּֽן הַמְּדָ֜תָא הָֽ/אֲגָגִ֗י צֹרֵר֙ כָּל הַ/יְּהוּדִ֔ים חָשַׁ֥ב עַל הַ/יְּהוּדִ֖ים לְ/אַבְּדָ֑/ם וְ/הִפִּ֥יל פּוּר֙ ה֣וּא הַ/גּוֹרָ֔ל לְ/הֻמָּ֖/ם וּֽ/לְ/אַבְּדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/024.yaml
  text: For Haman son of Hammedatha the Agagite[a], the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur—that is[b], the lot—to crush them and to destroy them.
translation:
  language: ru
  text: Ведь Аман, сын Аммедаты, агагитянин, враг всех иудеев, замыслил погубить иудеев и бросил пур[a], то есть жребий, чтобы привести их в смятение[b] и погубить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пур — заимствованное слово, которое сам текст поясняет как «жребий»; оно сохранено ради связи с названием праздника Пурим.
    reason: cultural_note
  - marker: b
    text: 'Или: «ввергнуть их в панику», «повергнуть их в замешательство»; возможен также более сильный оттенок: «сокрушить их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение установления праздника в окружающем контексте; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: הָמָן בֶּן הַמְּדָתָא הָאֲגָגִי
  choice: Аман, сын Аммедаты, агагитянин
  rationale: Имена переданы непосредственно с древнееврейской формы; определение «агагитянин» сохранено без уточнения спорной этнической или династической природы обозначения.
- source_word: צֹרֵר כָּל הַיְּהוּדִים
  choice: враг всех иудеев
  rationale: Причастие обозначает враждебно действующего противника; «враг» ясно и естественно передаёт смысл, а «всех» сохраняет всеохватность выражения.
- source_word: חָשַׁב עַל הַיְּהוּדִים
  choice: замыслил … иудеев
  rationale: В данном контексте сочетание выражает злонамеренный замысел против иудеев; объект по-русски естественно связан с последующим инфинитивом «погубить».
- source_word: לְאַבְּדָם
  choice: погубить их
  rationale: Каузативная форма означает обречь на гибель или уничтожить; «погубить» сохраняет силу глагола и звучит естественно в повествовании.
- source_word: וְהִפִּיל פּוּר
  choice: и бросил пур
  rationale: Сохранено заимствованное слово «пур», чтобы не утратить его связь с названием праздника Пурим; действие жребия передано буквально и понятно.
- source_word: הוּא הַגּוֹרָל
  choice: то есть жребий
  rationale: Текст сам поясняет чужое слово «пур» обычным словом «жребий».
- source_word: לְהֻמָּם
  choice: чтобы привести их в смятение
  rationale: Глагол допускает оттенки смятения, паники, замешательства и сокрушительного поражения. «Привести в смятение» сохраняет основную смысловую широту и не сводит выражение исключительно к физическому уничтожению, названному далее отдельно.
- source_word: וּלְאַבְּדָם
  choice: и погубить
  rationale: Повтор глагола уничтожения сохранён, как и усиление злого намерения в древнееврейском тексте.
