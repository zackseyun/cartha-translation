  yaml_path: translation/ot/esther/009/020.yaml
  text: Then Mordecai wrote these things and sent letters to all the Jews who were in all the provinces of King Ahasuerus[a], both near and far.
translation:
  language: ru
  text: Мардохей записал всё это[a] и разослал письма всем иудеям во всех областях царя Ахашвероша — и близким, и далёким.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эти слова». Еврейское выражение может относиться как к только что описанным событиям, так и к словам, которыми Мардохей изложил их письменно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: записал
  rationale: Глагол כתב означает письмо или письменную фиксацию; «записал» естественно передаёт здесь составление письменного изложения уже описанных событий.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: всё это
  rationale: דְּבָרִים может обозначать слова, дела, события или обстоятельства. «Всё это» сохраняет широкую отсылку к предшествующему рассказу, не исключая значения написанных слов.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: разослал письма
  rationale: В данном административном контексте סְפָרִים — письменные сообщения; «разослал письма» естественно передаёт отправку множества посланий адресатам по всей империи.
- source_word: כָּל הַיְּהוּדִים
  choice: всем иудеям
  rationale: Прямое обозначение этнорелигиозной общины; дательный падеж обусловлен русским управлением глагола «разослал».
- source_word: בְּכָל מְדִינוֹת
  choice: во всех областях
  rationale: מְדִינוֹת обозначает административные единицы империи. «Области» — ясный и естественный русский эквивалент.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: царя Ахашвероша
  rationale: Передаёт титул и имя в естественном русском порядке; форма «Ахашверош» следует еврейскому имени אֲחַשְׁוֵרוֹשׁ.
- source_word: הַקְּרוֹבִים וְהָרְחוֹקִים
  choice: и близким, и далёким
  rationale: Парные субстантивированные прилагательные относятся к иудеям и образуют меризм, охватывающий адресатов независимо от расстояния.
- source_word: וַ
  choice: последовательность передана без отдельного союза
  rationale: Начальный waw-consecutive продолжает повествовательную цепь; в современном русском последовательность естественно выражается порядком предложений без обязательного «и» или «затем».
