base_translation:
  language: en
  yaml_path: translation/ot/esther/009/028.yaml
  text: And these days are remembered and observed in every generation[a], every family, every province, and every city; and these days of Purim shall not pass away from among the Jews[c][b], and their remembrance shall not cease from their offspring.
translation:
  language: ru
  text: И эти дни будут помнить и соблюдать в каждом поколении[a], в каждой семье, в каждой области и в каждом городе[b]. Эти дни Пурима не исчезнут из среды евреев, и память о них не исчезнет у их потомков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из поколения в поколение».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст повторяет существительные в единственном числе: «семья за семьёй, область за областью и город за городом», подчёркивая всеобщность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְכָּרִים
  choice: должны быть памятны
  rationale: Нифаль от זכר представляет эти дни как сохраняемые в памяти; формулировка передаёт также нормативный оттенок контекста установления праздника.
- source_word: וְנַעֲשִׂים
  choice: и соблюдаться
  rationale: Буквально глагол означает «делаться», но применительно к праздничным дням указывает на практическое исполнение установленных обычаев.
- source_word: בְּכָל דּוֹר וָדוֹר
  choice: из поколения в поколение
  rationale: Повтор существительного выражает распределительность и непрерывную смену поколений.
- source_word: מִשְׁפָּחָה וּמִשְׁפָּחָה
  choice: в каждой семье
  rationale: Повтор единственного числа имеет распределительное значение; по-русски оно естественно передаётся словом «каждой».
- source_word: מְדִינָה וּמְדִינָה
  choice: в каждой области
  rationale: В книге Есфирь מְדִינָה обозначает административную единицу Персидской державы; «область» понятно современному читателю и сохраняет этот смысл.
- source_word: וְעִיר וָעִיר
  choice: и в каждом городе
  rationale: Распределительный повтор передан естественной русской конструкцией «в каждом городе».
- source_word: יְמֵי הַפּוּרִים
  choice: дни Пурима
  rationale: Сохранено традиционное название праздника и конструкция, обозначающая его праздничные дни.
- source_word: לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים
  choice: не исчезнут из жизни иудеев
  rationale: Оборот означает, что эти дни не уйдут и не перестанут соблюдаться внутри общины; «из жизни» естественно раскрывает подразумеваемую общественную практику.
- source_word: וְזִכְרָם
  choice: и память о них
  rationale: Суффикс относится к дням Пурима; русская конструкция ясна и сохраняет поминально-коммеморативный смысл.
- source_word: לֹא יָסוּף מִזַּרְעָם
  choice: не угаснет среди их потомков
  rationale: יסוף означает прекращение или окончание, а זרע здесь — потомство; образ «не угаснет» естественно относится к памяти и сохраняет торжественный тон.
