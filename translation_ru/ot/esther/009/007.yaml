lexical_decisions:
- source_word: וְאֵת
  choice: не передаётся отдельно; выражено перечислением и союзом «и»
  rationale: Частица אֵת отмечает определённое прямое дополнение, а повторяющееся וְאֵת связывает имена в перечень, зависящий от глагола «убили» в предыдущем стихе. В современном русском отдельный перевод этой частицы не требуется.
- source_word: פַּרְשַׁנְדָּתָא
  choice: Паршандату
  rationale: Персидское личное имя передано транслитерацией и поставлено в винительный падеж как прямое дополнение к глаголу «убили» из стиха 6.
- source_word: דַּלְפוֹן
  choice: Далфона
  rationale: Личное имя передано транслитерацией и поставлено в винительный падеж в соответствии с синтаксическим продолжением предыдущего стиха.
- source_word: אַסְפָּתָא
  choice: Аспату
  rationale: Личное имя передано транслитерацией и поставлено в винительный падеж как элемент перечня прямых дополнений.
