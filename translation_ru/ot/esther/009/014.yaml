  text: So the king said that it should be done so. A decree was issued in Susa[a], and the ten sons of Haman were hanged.
translation:
  language: ru
  text: И царь сказал сделать так. В Сузах был издан указ, а десятерых сыновей Амана повесили[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвесили на столбе». Еврейский глагол может обозначать подвешивание тела на дереве или столбе, а не обязательно казнь через повешение за шею в современном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: велел
  rationale: Основное значение глагола — «сказал», но в данном контексте царское высказывание разрешает и предписывает исполнить просьбу; по-русски «велел» естественно передаёт силу речевого акта без добавления отдельного формального указа.
- source_word: לְהֵעָשׂוֹת כֵּן
  choice: исполнить это
  rationale: Инфинитивная конструкция означает, что просьба должна быть выполнена; «исполнить это» ясно и естественно передаёт значение, не утяжеляя фразу буквальным «чтобы было сделано так».
- source_word: וַתִּנָּתֵן דָּת
  choice: был издан указ
  rationale: Сочетание נתן с דת является административной формулой персидского периода; «издать указ» — современный русский эквивалент, точнее по контексту, чем буквальное «дать закон».
- source_word: בְּשׁוּשָׁן
  choice: в Сузах
  rationale: «Сузы» — установившаяся в русском языке форма названия древнего города; предложный падеж — «в Сузах».
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: десятерых сыновей Амана
  rationale: Прямое и естественное воспроизведение еврейской сопряжённой конструкции с винительным падежом одушевлённого существительного.
- source_word: תָּלוּ
  choice: повесили
  rationale: Глагол תלה обозначает подвешивание на дереве, столбе или иной конструкции; «повесили» сохраняет традиционное и достаточно широкое обозначение, а возможное значение выставления тел на столбе отмечено в сноске.
