  text: וּ/בִ/שְׁנֵים֩ עָשָׂ֨ר חֹ֜דֶשׁ הוּא חֹ֣דֶשׁ אֲדָ֗ר בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֥ר יוֹם֙ בּ֔/וֹ אֲשֶׁ֨ר הִגִּ֧יעַ דְּבַר הַ/מֶּ֛לֶךְ וְ/דָת֖/וֹ לְ/הֵעָשׂ֑וֹת בַּ/יּ֗וֹם אֲשֶׁ֨ר שִׂבְּר֜וּ אֹיְבֵ֤י הַ/יְּהוּדִים֙ לִ/שְׁל֣וֹט בָּ/הֶ֔ם וְ/נַהֲפ֣וֹךְ ה֔וּא אֲשֶׁ֨ר יִשְׁלְט֧וּ הַ/יְּהוּדִ֛ים הֵ֖מָּה בְּ/שֹׂנְאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/001.yaml
  text: 'In the twelfth month[a], that is, the month Adar, on the thirteenth day of it, when the king’s word and his decree were to be carried out, on the day when the enemies of the Jews had hoped to rule over them, the opposite happened: the Jews themselves ruled over those who hated them.'
translation:
  language: ru
  text: 'В двенадцатом месяце, то есть в месяце адаре, в тринадцатый день этого месяца, когда слово царя и его указ должны были быть исполнены, в день, когда враги иудеев надеялись господствовать над ними, всё повернулось иначе[a]: сами иудеи господствовали над теми, кто их ненавидел.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё перевернулось» или «всё обернулось наоборот».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: В двенадцатом месяце
  rationale: Предлог ב передаёт временное значение; начальный ו служит повествовательной связкой и не требует отдельного «и» в естественном русском изложении.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: то есть в месяце адаре
  rationale: Конструкция поясняет название двенадцатого месяца. Название месяца дано в нормативной русской форме и склонении.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: в тринадцатый день этого месяца
  rationale: Явно сохранена отсылка местоименного суффикса к месяцу, но выражена естественно по-русски.
- source_word: אֲשֶׁר הִגִּיעַ דְּבַר הַמֶּלֶךְ וְדָתוֹ לְהֵעָשׂוֹת
  choice: когда слово царя и его указ должны были быть исполнены
  rationale: Контекстуально הִגִּיעַ указывает на наступление назначенного срока исполнения. «Слово» и «указ» сохраняют различие между דָּבָר и דָּת.
- source_word: בַּיּוֹם אֲשֶׁר
  choice: в тот самый день, когда
  rationale: Повтор слова «день» сохранён, а «самый» естественно подчёркивает совпадение момента и последовавший контраст.
- source_word: שִׂבְּרוּ
  choice: надеялись
  rationale: Глагол обозначает ожидание или надежду; форма прошедшего времени передаёт предшествовавшее ожидание врагов без перегруженной русской конструкции.
- source_word: לִשְׁלֹט בָּהֶם
  choice: одолеть их
  rationale: שׁלט означает получить власть или верх над кем-либо. В контексте вооружённого противостояния «одолеть» естественно передаёт достижение превосходства, не вводя идею длительного политического правления.
- source_word: וְנַהֲפוֹךְ הוּא
  choice: всё обернулось наоборот
  rationale: Идиоматическая русская передача резкого переворота обстоятельств; сохраняет яркость и допускаемую еврейским выражением образность.
- source_word: אֲשֶׁר יִשְׁלְטוּ הַיְּהוּדִים הֵמָּה
  choice: сами иудеи одолели
  rationale: «Сами» передаёт эмфатическое הֵמָּה и подчёркивает смену ролей; повтор «одолели» отражает тот же глагол שׁלט по отношению к обеим сторонам.
- source_word: בְּשֹׂנְאֵיהֶם
  choice: тех, кто их ненавидел
  rationale: Сохранена глагольная сила причастия שֹׂנְאֵי, а не заменена более общим существительным «враги».
