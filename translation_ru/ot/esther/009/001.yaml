  to: 'В двенадцатом месяце, то есть в месяце адаре, в тринадцатый день этого месяца, когда слово царя и его указ должны были быть исполнены, в день, когда враги иудеев надеялись господствовать над ними, всё повернулось иначе[a]: сами иудеи господствовали над теми, кто их ненавидел.'
  rationale: Исправлен эквивалент повторённого שׁלט на «господствовать над», чтобы не сводить текст к описанию боевой победы. Сноска очищена от политически окрашенного «переворот» и предлагает нейтральные передачи וְנַהֲפוֹךְ הוּא. Убрано невыраженное в оригинале усиление «самый».
