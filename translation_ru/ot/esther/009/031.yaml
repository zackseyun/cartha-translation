base_translation:
  language: en
  yaml_path: translation/ot/esther/009/031.yaml
  text: to establish these days of Purim at their appointed times[a], just as Mordecai the Jew and Esther the queen had established for them[b], and just as they had established for themselves and for their offspring the matters of the fasts and their cry.
translation:
  language: ru
  text: чтобы утвердить эти дни Пурима в назначенные для них сроки[a], как установили для них Мардохей, иудей, и царица Есфирь, и как они приняли на себя и на своих потомков обязательства относительно постов и своего вопля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «закрепить». Один и тот же еврейский глагол далее передан словами «установили» и «приняли… обязательства»; речь идёт об официальном закреплении соблюдения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «крика»; возможно также: «стенания». Вероятно, имеются в виду крики, сопровождавшие посты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: утвердить
  rationale: Пиэль глагола קום здесь означает официально закрепить или установить соблюдение праздничных дней; «утвердить» естественно передаёт юридико-административный оттенок.
- source_word: יְמֵי הַפֻּרִים הָאֵלֶּה
  choice: эти дни Пурима
  rationale: Прямо передаёт конструкцию и сохраняет указательное выделение уже названных праздничных дней.
- source_word: בִּזְמַנֵּיהֶם
  choice: в назначенные для них сроки
  rationale: זְמָן обозначает установленное время; «сроки» уместны для ежегодно закреплённых дат празднования.
- source_word: כַּאֲשֶׁר קִיַּם עֲלֵיהֶם
  choice: как установили для них
  rationale: Передаёт обязательное установление для общины, не усиливая смысл до принуждения.
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: Мардохей-иудей
  rationale: Традиционная и понятная передача этнического обозначения; дефисная конструкция сохраняет приложение исходного текста.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: царица Есфирь
  rationale: Естественный для современного литературного русского порядок титула и имени.
- source_word: וְכַאֲשֶׁר קִיְּמוּ עַל נַפְשָׁם וְעַל זַרְעָם
  choice: и как они приняли на себя и на своих потомков обязательства
  rationale: Сочетание קים с עַל в данном контексте выражает принятие обязательства; נֶפֶשׁ имеет возвратный смысл, а זֶרַע означает последующие поколения.
- source_word: דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם
  choice: относительно постов и своего вопля
  rationale: דִּבְרֵי вводит предмет обязательств, а זַעֲקָה обозначает сильный коллективный крик, связанный с постами, не уточняя, был ли это плач или молитвенное воззвание.
