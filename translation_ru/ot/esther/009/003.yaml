base_translation:
  language: en
  yaml_path: translation/ot/esther/009/003.yaml
  text: And all the officials of the provinces[a], the satraps, the governors, and those doing the king’s work were supporting the Jews, because the fear of Mordecai had fallen on them.
translation:
  language: ru
  text: И все начальники областей, сатрапы, наместники и те, кто занимался царскими делами, поддерживали[a] иудеев, потому что на них пал страх перед Мардохеем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помогали иудеям»; еврейский глагол может также означать «поднимали» или «возвышали» их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: начальники областей
  rationale: שָׂרִים обозначает правителей или высоких должностных лиц; «начальники областей» естественно передаёт административный смысл и не смешивает эту группу с последующими титулами.
- source_word: אֲחַשְׁדַּרְפְּנִים
  choice: сатрапы
  rationale: Персидский административный термин сохранён в его общепринятой исторической форме.
- source_word: פַּחוֹת
  choice: наместники
  rationale: Титул передан отдельно от «сатрапов»; «наместники» ясно обозначает региональных правителей и подходит историческому контексту.
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר לַמֶּלֶךְ
  choice: исполнявшие царские дела
  rationale: Передаёт буквальный образ людей, выполнявших принадлежавшую царю работу, и естественно указывает на царских служащих без излишнего уточнения их должностей.
- source_word: מְנַשְּׂאִים אֶת הַיְּהוּדִים
  choice: поддерживали иудеев
  rationale: Каузативная форма от נָשָׂא допускает значения «поднимать», «возвышать», «поддерживать»; в контексте практического содействия «поддерживали» наиболее ясно и не преувеличивает социальное возвышение иудеев.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину поддержки и в современном русском ясно выражается сочетанием «потому что».
- source_word: נָפַל פַּחַד מָרְדֳּכַי עֲלֵיהֶם
  choice: на них пал страх перед Мардохеем
  rationale: Сохранена яркая еврейская метафора страха, павшего на людей; «страх перед Мардохеем» естественно передаёт объективный смысл сочетания.
- source_word: מָרְדֳּכַי
  choice: Мардохей
  rationale: Использована традиционная русская библейская форма имени.
