  variant: modern literary Russian
source:
  edition: WLC
  text: עַל כֵּ֡ן קָֽרְאוּ֩ לַ/יָּמִ֨ים הָ/אֵ֤לֶּה פוּרִים֙ עַל שֵׁ֣ם הַ/פּ֔וּר עַל כֵּ֕ן עַל כָּל דִּבְרֵ֖י הָ/אִגֶּ֣רֶת הַ/זֹּ֑את וּ/מָֽה רָא֣וּ עַל כָּ֔כָה וּ/מָ֥ה הִגִּ֖יעַ אֲלֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/026.yaml
  text: Therefore they called these days Purim[a], after the name of Pur. Therefore, because of all the words of this letter, and what they had seen concerning this matter, and what had happened to them[b],
translation:
  language: ru
  text: Поэтому они назвали эти дни Пуримом[a] — по имени Пур. Поэтому, ввиду всего сказанного в этом письме, того, что они увидели в связи с этим, и того, что с ними произошло[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пуримом — от слова „Пур“»; буквально: «по имени Пур».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «что постигло их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: назвали
  rationale: В контексте наречения праздника форма глагола קרא естественно передаётся русским «назвали».
- source_word: לַיָּמִים הָאֵלֶּה
  choice: эти дни
  rationale: Указательное выражение относится к конкретным праздничным дням, о которых идёт речь.
- source_word: פוּרִים
  choice: Пуримом
  rationale: Сохраняется общепринятое русское название праздника; творительный падеж требуется после «назвали».
- source_word: עַל שֵׁם הַפּוּר
  choice: по имени Пур
  rationale: Передаёт этимологическую формулу «по имени Пур» близко к еврейскому тексту и связывает название праздника со словом פּוּר.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Сохраняется причинно-следственное значение и заметный повтор выражения в стихе.
- source_word: עַל כָּל דִּבְרֵי הָאִגֶּרֶת הַזֹּאת
  choice: ввиду всего сказанного в этом письме
  rationale: דִּבְרֵי может обозначать слова или содержание; этот вариант естественен по-русски и сохраняет причинное значение עַל.
- source_word: וּמָה רָאוּ עַל כָּכָה
  choice: того, что они увидели в связи с этим
  rationale: Сохраняет буквальное значение ראה «видеть», а עַל כָּכָה передаёт без излишнего уточнения как «в связи с этим».
- source_word: וּמָה הִגִּיעַ אֲלֵיהֶם
  choice: того, что с ними произошло
  rationale: Идиоматично передаёт значение «достигло их / постигло их», не конкретизируя характер пережитого.
