  text: the ten sons of Haman son of Hammedatha[a], the enemy of the Jews, they killed; but they did not lay a hand on the plunder.
translation:
  language: ru
  text: десятерых сыновей Амана, сына Амадафы, врага иудеев, они убили, но к добыче не притронулись.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: десятерых сыновей Амана
  rationale: Конструктивное сочетание обозначает десять сыновей Амана; винительный падеж обусловлен переходным глаголом «убили».
- source_word: בֶּן הַמְּדָתָא
  choice: сына Амадафы
  rationale: Приложение уточняет происхождение Амана; использована традиционная русская форма имени, понятная читателю библейского текста.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: врага иудеев
  rationale: צֹרֵר обозначает враждебного противника; «враг» точно и естественно передаёт смысл.
- source_word: הָרָגוּ
  choice: они убили
  rationale: Прямое современное соответствие форме qatal 3-го лица множественного числа от הרג.
- source_word: וּבַבִּזָּה
  choice: но к добыче
  rationale: בִּזָּה означает захваченное имущество, «добычу»; союз передан противительным «но», поскольку предложение подчёркивает контраст между убийством врагов и отказом присвоить их имущество.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: не притронулись
  rationale: Буквально «не протянули свою руку»; в данном контексте это идиома, означающая, что они не взяли и не присвоили добычу. Русское «не притронулись» естественно сохраняет образ физического действия.
