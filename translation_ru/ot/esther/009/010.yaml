  source_fidelity: 'Текст точно передаёт еврейский оригинал: названы десять сыновей Амана, его происхождение («сына Амадафы») и определение «врага иудеев»; глагол הָרָגוּ верно передан как «убили». Заключительная идиома «не простёрли руки к добыче» адекватно и естественно передана как «к добыче не притронулись», то есть не стали её присваивать. Противительный союз «но» уместно выражает контраст контекста, хотя в еврейском стоит waw.'
