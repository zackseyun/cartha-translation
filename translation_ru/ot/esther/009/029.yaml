    text: 'Или: «со всей силой»; возможно также: «со всей полнотой власти». Еврейское выражение подчёркивает официальную силу и обязательность послания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: написали
  rationale: Форма глагола в еврейском тексте стоит в единственном числе и буквально относится прежде всего к Есфири, однако далее к ней присоединён Мардохей как участник составления письма. В русском языке при таком однородном подлежащем естественно множественное число; повествовательное ו передано союзом «и».
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: царица Есфирь
  rationale: Естественная для современного русского языка передача приложения с сохранением царского титула.
- source_word: בַת אֲבִיחַיִל
  choice: дочь Авихаила
  rationale: Формально сохранено родословное уточнение, служащее идентификации Есфири.
- source_word: וּמָרְדֳּכַי הַיְּהוּדִי
  choice: и Мардохей, иудей
  rationale: יהודי обозначает этническую принадлежность в персидском контексте; «иудей» является традиционным и естественным русским соответствием.
- source_word: אֶת כָּל תֹּקֶף
  choice: со всей полнотой власти
  rationale: תֹּקֶף выражает силу, действенность или властные полномочия. В контексте официального послания перевод подчёркивает его авторитетную и обязательную силу, не сводя выражение к физической мощи.
- source_word: לְקַיֵּם
  choice: чтобы утвердить
  rationale: 'Инфинитив обозначает цель написания: подтвердить и придать установленную силу предписаниям о празднике.'
- source_word: אִגֶּרֶת הַפּוּרִים הַזֹּאת הַשֵּׁנִית
  choice: это второе послание о Пуриме
  rationale: «Послание» соответствует официальному характеру אִגֶּרֶת; «о Пуриме» естественно передаёт отношение конструкта к предмету письма, а указательное местоимение и порядковое определение сохранены.
