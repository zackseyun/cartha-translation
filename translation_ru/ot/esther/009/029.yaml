  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
translation:
  language: ru
  text: И царица Есфирь, дочь Авихаила, вместе с Мардохеем, иудеем, написала со всей властью[a], чтобы утвердить это второе послание о Пуриме.
  philosophy: optimal-equivalence
  footnotes:
