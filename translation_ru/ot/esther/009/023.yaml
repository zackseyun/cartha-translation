lexical_decisions:
- source_word: וְקִבֵּל
  choice: приняли на себя
  rationale: В данном контексте קבל означает принятие на себя установления или обязательства. Такой перевод естественно передаёт активное согласие иудеев соблюдать установленный обычай.
- source_word: הַיְּהוּדִים
  choice: иудеи
  rationale: Определённое этнорелигиозное обозначение; «иудеи» соответствует контексту книги Есфирь и литературной русской библейской традиции.
- source_word: אֵת אֲשֶׁר הֵחֵלּוּ לַעֲשׂוֹת
  choice: продолжать то, что уже начали делать
  rationale: Буквально — «то, что начали делать». Слово «продолжать» эксплицирует подразумеваемый результат принятия уже начатой практики, не меняя временной последовательности.
- source_word: וְאֵת אֲשֶׁר כָּתַב מָרְדֳּכַי אֲלֵיהֶם
  choice: и исполнять то, о чём написал им Мардохей
  rationale: Второй אֵת вводит ещё один объект глагола «приняли на себя». Добавление «исполнять» делает синтаксическую связь ясной по-русски; «о чём написал» естественно передаёт содержание письменного предписания.
- source_word: מָרְדֳּכַי
  choice: Мардохей
  rationale: Традиционная и узнаваемая русская передача имени.
