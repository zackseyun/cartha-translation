revisions:
- from: Это было в тринадцатый день месяца адара[a]. На четырнадцатый день того же месяца они обрели покой и сделали его днём пира и радости.
  to: В тринадцатый день месяца Адара, а в четырнадцатый день они отдыхали и сделали его днём пира и радости.[a]
  rationale: Убрано невыраженное в оригинале «Это было», восстановлена последовательность датировки и действий, нормализовано написание имени месяца и выбран более естественный русский глагол для נוח. Смысл, повествовательная связь с контекстом и именная формула «день пира и радости» сохранены.
