  text: on the thirteenth day of the month of Adar[a], and resting on the fourteenth day of it[b], and making it a day of feasting and gladness.
translation:
  language: ru
  text: В тринадцатый день месяца Адара, а в четырнадцатый день они отдыхали и сделали его днём пира и радости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Адар — месяц еврейского календаря, приблизительно соответствующий февралю—марту.
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם שְׁלֹשָׁה עָשָׂר
  choice: в тринадцатый день
  rationale: Предлог בְּ обозначает время, а количественное числительное в формуле датировки естественно передаётся по-русски порядковым числительным.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: месяца адара
  rationale: Сохранена еврейская формула датировки; название месяца передано принятой русской транслитерацией и склоняется по нормам современного русского языка.
- source_word: וְנוֹחַ
  choice: они обрели покой
  rationale: Инфинитив абсолютный от נוח в данном повествовательном контексте продолжает цепь завершённых действий. Выражение указывает на прекращение вооружённого противостояния, а не обязательно на обычный отдых.
- source_word: בְּאַרְבָּעָה עָשָׂר בּוֹ
  choice: на четырнадцатый день того же месяца
  rationale: Местоименный элемент בּוֹ отсылает к месяцу адару; явное «того же месяца» естественно и недвусмысленно передаёт эту связь по-русски.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: и сделали его
  rationale: Инфинитив абсолютный в последовательности повествовательных действий передан личной формой прошедшего времени; местоимение относится к четырнадцатому дню.
- source_word: יוֹם מִשְׁתֶּה
  choice: днём пира
  rationale: מִשְׁתֶּה обозначает пир или праздничное застолье, нередко с вином; «пир» кратко и достойно сохраняет праздничный смысл.
- source_word: וְשִׂמְחָה
  choice: и радости
  rationale: Существительное שִׂמְחָה передано существительным «радость», что сохраняет именной параллелизм исходного выражения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Эллиптическая связь с предыдущим стихом раскрыта нейтральным вводным «Это было», а подразумеваемое из контекста множественное подлежащее выражено местоимением «они». Термин «обрели покой» сохраняет библейскую торжественность, оставаясь понятным современному читателю.
