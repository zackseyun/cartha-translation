source:
  edition: WLC
  text: עַל כֵּ֞ן הַ/יְּהוּדִ֣ים ה/פרוזים הַ/יֹּשְׁבִים֮ בְּ/עָרֵ֣י הַ/פְּרָזוֹת֒ עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר שִׂמְחָ֥ה וּ/מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וּ/מִשְׁל֥וֹחַ מָנ֖וֹת אִ֥ישׁ לְ/רֵעֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/019.yaml
  text: Therefore the Jews of the villages[a], who live in the rural towns, make the fourteenth day of the month of Adar a day of gladness and feasting and a holiday, and of sending portions[b], each man to his neighbor.
translation:
  language: ru
  text: Поэтому иудеи, живущие в неукреплённых городах[a], отмечают четырнадцатый день месяца адара как день радости и пиршества, как праздничный день, посылая друг другу угощения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в городах и поселениях, не окружённых крепостными стенами.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «порции»; вероятно, порции еды или праздничные дары.'
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим повествованием.
- source_word: הַיְּהוּדִים
  choice: иудеи
  rationale: В книге Есфирь обозначает еврейский народ как этнорелигиозную общность в Персидской империи; «иудеи» соответствует принятому библейскому регистру и остаётся понятным современному читателю.
- source_word: הפרוזים הַיֹּשְׁבִים בְּעָרֵי הַפְּרָזוֹת
  choice: живущие в неукреплённых городах
  rationale: Сочетание описывает жителей открытых, не окружённых стенами поселений и противопоставляет их жителям укреплённого города в следующем контексте. Русская формулировка избегает неясного буквального «иудеи открытых мест».
- source_word: עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: празднуют четырнадцатый день месяца адара
  rationale: Глагол עשה применительно к дню означает соблюдать или отмечать его; «празднуют» естественно связано с последующим описанием торжества.
- source_word: שִׂמְחָה וּמִשְׁתֶּה וְיוֹם טוֹב
  choice: как день радости, пиршества и веселья
  rationale: «Радость» передаёт שִׂמְחָה, «пиршество» — праздничную трапезу מִשְׁתֶּה без излишнего уточнения о вине, а «веселье» естественно выражает идиоматическое יוֹם טוֹב, буквально «добрый день», то есть праздничный день.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: посылают ... угощения
  rationale: מָנוֹת буквально означает «доли, порции»; в праздничном контексте речь, вероятнее всего, о порциях еды. «Угощения» естественно по-русски, а буквальный оттенок сохранён в примечании.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: друг другу
  rationale: Русское взаимное выражение естественно передаёт дистрибутивную конструкцию «каждый своему ближнему/товарищу» и не создаёт ошибочного впечатления, будто обычай относился только к мужчинам.
theological_decisions:
- issue: Род и охват выражения אִישׁ לְרֵעֵהוּ
  choice: друг другу
  alternative: каждый своему ближнему
  rationale: Хотя в еврейском употреблены грамматически мужские формы единственного числа, конструкция имеет обобщённо-взаимное значение. Русское «друг другу» сохраняет общинный охват, не добавляя богословского или социального ограничения по полу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён по сравнению с еврейской цепочкой именных конструкций, но противопоставление неукреплённых поселений и праздничные действия сохранены. Название месяца дан со строчной буквы по современной русской орфографической норме.
