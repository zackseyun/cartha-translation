lexical_decisions:
- source_word: וּ/בְ/שׁוּשַׁן
  choice: И в Сузах
  rationale: Союз ו связывает стих с предшествующим повествованием, а предлог ב передаёт местонахождение. «Сузы» — принятое русское название города.
- source_word: הַ/בִּירָה
  choice: в крепости
  rationale: בִּירָה обозначает укреплённый дворцово-административный комплекс или цитадель. «Крепость» понятно современному читателю и не сужает значение до одного лишь царского дворца.
- source_word: הָרְגוּ
  choice: убили
  rationale: Глагол הרג прямо означает лишение жизни; «убили» точно и естественно в современном русском языке.
- source_word: הַ/יְּהוּדִים
  choice: иудеи
  rationale: В контексте книги Есфирь это обозначение этнорелигиозного народа; «иудеи» соответствует традиционному и современному русскому библейскому словоупотреблению.
- source_word: וְ/אַבֵּד
  choice: и уничтожили
  rationale: Пиэль глагола אבד означает причинить гибель, уничтожить. Отдельный перевод сохраняет еврейское сочетание двух глаголов, не сводя его к одному действию.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: пятьсот мужчин
  rationale: Буквально это счётная конструкция «пятьсот мужчин». Выбор сохраняет мужское обозначение אִישׁ, не заменяя его более общим «человек».
