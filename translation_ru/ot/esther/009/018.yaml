  text: But the Jews who were in Susa assembled on the thirteenth day of it and on the fourteenth day of it[a], and rested on the fifteenth day of it[b], and made it a day of feasting and gladness.
translation:
  language: ru
  text: Но иудеи, находившиеся в Сузах, собрались тринадцатого и четырнадцатого числа этого месяца[a], а пятнадцатого отдыхали и сделали этот день днём пиршества и радости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тринадцатого в нём, четырнадцатого в нём ... пятнадцатого в нём»; из контекста ясно, что «в нём» относится к месяцу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «днём пира и веселья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: Но иудеи, находившиеся в Сузах
  rationale: Союз וְ передаёт противопоставление иудеям в областях, о которых говорится в предыдущем стихе, поэтому выбран русский союз «но». Относительный оборот естественно обозначает иудеев, живших в Сузах.
- source_word: נִקְהֲלוּ
  choice: собирались
  rationale: Нифаль глагола קהל означает собираться вместе. Несовершенный вид по-русски естественно охватывает собрания в оба названных дня, не добавляя цели или мотива.
- source_word: בִּשְׁלֹשָׁה עָשָׂר בּוֹ וּבְאַרְבָּעָה עָשָׂר בּוֹ
  choice: тринадцатого и четырнадцатого числа этого месяца
  rationale: Местоименный суффикс в обоих выражениях буквально отсылает к месяцу, понятному из контекста. Добавление слов «числа этого месяца» делает даты ясными и естественными по-русски.
- source_word: וְנוֹחַ בַּחֲמִשָּׁה עָשָׂר בּוֹ
  choice: а пятнадцатого отдыхали
  rationale: נוח обозначает прекращение действий и наступивший после борьбы покой. «Отдыхали» сохраняет конкретную последовательность повествования; союз «а» естественно отмечает переход от собрания к отдыху.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: и сделали этот день
  rationale: Оборот с עשה здесь означает, что упомянутому дню придали определённый праздничный характер. Указание «этот день» устраняет неясность русского местоимения, не меняя смысла.
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: днём пиршества и радости
  rationale: מִשְׁתֶּה означает пир или праздничное застолье, а שִׂמְחָה — радость или веселье. Выбранная формулировка близка структуре оригинала и сохраняет его торжественный тон.
