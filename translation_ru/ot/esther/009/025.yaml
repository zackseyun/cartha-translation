base_translation:
  language: en
  yaml_path: translation/ot/esther/009/025.yaml
  text: But when she came before the king[a], he commanded by letter that his evil scheme which he had devised against the Jews should return on his own head[b], and they hanged him and his sons on the gallows.
translation:
  language: ru
  text: Но когда она предстала перед царём, он письменно[a] повелел, чтобы злой замысел, который тот задумал против иудеев, обратился на его же голову; и его самого и его сыновей повесили на деревянном столбе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сказал с письмом (или документом)»; по смыслу царь издал письменное распоряжение.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может также означать казнь через насаживание на кол; слово «дерево» может обозначать столб или деревянный шест. Точный способ казни неясен.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹאָהּ לִפְנֵי הַמֶּלֶךְ
  choice: когда она предстала перед царём
  rationale: Суффикс женского рода естественно отсылает к Есфири; выражение «предстала перед царём» передаёт появление в царском присутствии и звучит естественно по-русски.
- source_word: אָמַר עִם הַסֵּפֶר
  choice: он письменно повелел
  rationale: Сжатое еврейское выражение буквально связано с речью «с письмом/документом», а в контексте означает издание царём письменного распоряжения.
- source_word: יָשׁוּב מַחֲשַׁבְתּוֹ הָרָעָה
  choice: чтобы злой замысел… обратился
  rationale: Сохраняется образ возмездия, при котором замысел обращается против самого злоумышленника.
- source_word: אֲשֶׁר חָשַׁב עַל הַיְּהוּדִים
  choice: который тот задумал против иудеев
  rationale: «Задумал» передаёт смысл планирования, а «против» — враждебное значение предлога עַל. Указательное «тот» помогает отличить Амана от царя без внесения имени, отсутствующего в стихе.
- source_word: עַל רֹאשׁוֹ
  choice: на его же голову
  rationale: Естественная русская передача устойчивого образа воздаяния, обрушивающегося на виновника.
- source_word: וְתָלוּ אֹתוֹ וְאֶת־בָּנָיו עַל הָעֵץ
  choice: его самого и его сыновей повесили на деревянном столбе
  rationale: Глагол означает подвешивание, а הָעֵץ — дерево или деревянное сооружение. «Деревянный столб» лучше исторического контекста, чем современная виселица, при этом возможная казнь через посажение на кол отмечена в сноске.
