translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным библейским звучанием. Сохранён образ «поднять руку на»; менее естественная для русского языка калька «страх пал на» заменена прозрачным выражением «охватил страх». Все примечания привязаны к соответствующим словам и расположены в порядке появления маркеров.
