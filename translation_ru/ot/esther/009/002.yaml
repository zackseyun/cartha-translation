  source_fidelity: 'Русский текст точно передаёт синтаксис и смысл еврейского оригинала: организованное собрание иудеев в их городах во всех административных областях царя Ахашвероша, враждебно направленное действие против ищущих им зла, невозможность сопротивления и всеобщий страх перед ними. «Поднять руку на» адекватно передаёт идиому לִשְׁלֹחַ יָד, не излишне конкретизируя её как убийство.'
