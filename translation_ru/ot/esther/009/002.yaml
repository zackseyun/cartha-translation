  text: נִקְהֲל֨וּ הַ/יְּהוּדִ֜ים בְּ/עָרֵי/הֶ֗ם בְּ/כָל מְדִינוֹת֙ הַ/מֶּ֣לֶךְ אֳחַשְׁוֵר֔וֹשׁ לִ/שְׁלֹ֣חַ יָ֔ד בִּ/מְבַקְשֵׁ֖י רָֽעָתָ֑/ם וְ/אִישׁ֙ לֹא עָמַ֣ד לִ/פְנֵי/הֶ֔ם כִּֽי נָפַ֥ל פַּחְדָּ֖/ם עַל כָּל הָ/עַמִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/002.yaml
  text: The Jews assembled in their cities throughout all the provinces of King Ahasuerus to lay hands on those seeking their harm[a], and no one could stand before them[c][b], because the fear of them had fallen on all the peoples.
translation:
  language: ru
  text: Иудеи собрались в своих городах по всем областям царя Ахашвероша, чтобы поднять руку на тех, кто стремился причинить им зло[a]. Никто не мог устоять перед ними[b], потому что все народы[c] охватил страх перед ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы напасть на тех, кто стремился причинить им зло»; буквально еврейский оборот означает «простереть (послать) руку против».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Никто не мог противостоять им».'
    reason: lexical_alternative
  - marker: c
    text: Под «народами», вероятно, имеются в виду различные этнические группы и группы населения Персидской державы, а не один народ.
    reason: cultural_note
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: собрались
  rationale: Нифаль глагола קהל обозначает совместное собирание; возвратная форма естественно передаёт организованное действие самих иудеев.
- source_word: בְּעָרֵיהֶם
  choice: в своих городах
  rationale: עִיר обычно означает «город», а местоименное выражение «своих» ясно соотносится с подлежащим.
- source_word: בְּכָל מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ
  choice: по всем областям царя Ахашвероша
  rationale: מְדִינוֹת — административные области Персидской державы; предлог «по» естественно передаёт распределённость действия по всей их совокупности.
- source_word: לִשְׁלֹחַ יָד
  choice: чтобы поднять руку на
  rationale: Русский оборот сохраняет образ еврейской идиомы «простереть/послать руку» и ясно выражает враждебное действие.
- source_word: בִּמְבַקְשֵׁי רָעָתָם
  choice: на тех, кто стремился причинить им зло
  rationale: Причастная конструкция буквально описывает «ищущих их зла»; выбранная формулировка естественна по-русски и сохраняет целенаправленную враждебность.
- source_word: וְאִישׁ לֹא עָמַד לִפְנֵיהֶם
  choice: Никто не мог устоять перед ними
  rationale: Буквально «и человек не стоял перед ними»; в данном контексте выражение означает неспособность противостоять им.
- source_word: כִּי נָפַל פַּחְדָּם עַל כָּל הָעַמִּים
  choice: потому что все народы охватил страх перед ними
  rationale: Перестройка порядка слов даёт современную русскую фразу, сохраняя причинную связь, значение страха и его распространение на все названные группы населения.
- source_word: אֳחַשְׁוֵרוֹשׁ
  choice: Ахашверош
  rationale: Транслитерация непосредственно передаёт еврейскую форму имени и не подменяет её традиционным именованием из иной текстовой традиции.
