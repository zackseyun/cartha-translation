base_translation:
  language: en
  yaml_path: translation/ot/esther/009/004.yaml
  text: For Mordecai was great in the king’s house[a], and the report about him was spreading through all the provinces[b], for the man Mordecai was becoming greater and greater.
translation:
  language: ru
  text: Ведь Мардохей занимал высокое положение при царском дворе, и молва о нём распространялась по всем областям, ибо Мардохей становился всё более значительным.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек Мардохей шёл и становился великим» — еврейский оборот, обозначающий непрестанное возрастание его значительности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит поясняющее основание к предшествующему контексту и естественно передаёт это значение по-русски.
- source_word: גָדוֹל בְּבֵית הַמֶּלֶךְ
  choice: был влиятелен при царском дворе
  rationale: Прилагательное указывает на высокое положение и влияние, а буквально «в доме царя» в данном контексте означает придворно-дворцовую сферу.
- source_word: שָׁמְעוֹ
  choice: молва о нём
  rationale: Слово допускает значения «весть», «слух», «слава»; «молва» сохраняет сочетание распространяющейся вести и растущей известности.
- source_word: הוֹלֵךְ בְּכָל הַמְּדִינוֹת
  choice: распространялась по всем областям
  rationale: При подлежащем «молва» причастие הלך выражает продолжающееся распространение; «области» соответствует административному контексту Персидской державы.
- source_word: הָאִישׁ מָרְדֳּכַי
  choice: Мардохей
  rationale: Буквальное «человек Мардохей» в современном русском здесь звучит неестественно; имя само по себе ясно обозначает лицо, тогда как акцент сохраняется повтором имени.
- source_word: הוֹלֵךְ וְגָדוֹל
  choice: становился всё более и более влиятельным
  rationale: Еврейская идиома обозначает непрерывное возрастание положения или значимости; русский оборот передаёт прогрессивное усиление.
theological_decisions: []
