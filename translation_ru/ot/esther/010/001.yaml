  yaml_path: translation/ot/esther/010/001.yaml
  text: King Ahasuerus imposed tribute on the land and the islands of the sea[a][b].
translation:
  language: ru
  text: Царь Ахашверош обложил данью страну и морские острова[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «морские побережья». Еврейское слово может обозначать как острова, так и приморские земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подать» или «налог». В некоторых контекстах еврейское слово также может означать трудовую повинность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: обложил
  rationale: В сочетании שׂוּם מַס עַל глагол обозначает возложение дани или подати. Русское «обложил данью» естественно передаёт административное действие и сохраняет образ исходного выражения.
- source_word: הַמֶּלֶךְ אחשרש
  choice: царь Ахашверош
  rationale: Титул с именем естественно передаётся по-русски как «царь Ахашверош». Форма имени «Ахашверош» непосредственно отражает еврейское אֲחַשְׁוֵרוֹשׁ и соответствует принятой русской библейской передаче.
- source_word: מַס
  choice: данью
  rationale: מַס может означать дань, подать, налог или трудовую повинность. В контексте обширных сухопутных и морских владений «дань» лучше сохраняет имперско-политический оттенок, не исключая более общего фискального смысла.
- source_word: הָאָרֶץ
  choice: страну
  rationale: Здесь הָאָרֶץ обозначает подвластную территорию, а не всю землю как мир. «Страну» естественно в русском контексте и не требует уточнения конкретных границ.
- source_word: וְאִיֵּי הַיָּם
  choice: и морские острова
  rationale: אִיֵּי הַיָּם буквально указывает на острова моря, но אִיִּים может также обозначать приморские земли. «Морские острова» передаёт явный смысл текста, а возможное значение «побережья» отмечено в сноске.
