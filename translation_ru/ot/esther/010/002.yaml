  text: וְ/כָל מַעֲשֵׂ֤ה תָקְפּ/וֹ֙ וּ/גְב֣וּרָת֔/וֹ וּ/פָרָשַׁת֙ גְּדֻלַּ֣ת מָרְדֳּכַ֔י אֲשֶׁ֥ר גִּדְּל֖/וֹ הַ/מֶּ֑לֶךְ הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֨פֶר֙ דִּבְרֵ֣י הַ/יָּמִ֔ים לְ/מַלְכֵ֖י מָדַ֥י וּ/פָרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/002.yaml
  text: And all the acts of his power and might[a], and the full account of the greatness of Mordecai, to which the king raised him—are they not written in the Book of the Chronicles of the Kings of Media and Persia?
translation:
  language: ru
  text: А все проявления его власти и могущества и подробное описание величия, до которого царь возвысил Мардохея, — разве не записаны они в Книге летописей царей Мидии и Персии?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Книге анналов царей Мидии и Персии».'
    reason: Лексическая альтернатива для סֵפֶר דִּבְרֵי הַיָּמִים; «анналы» подчёркивает характер официальных записей.
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: деяния
  rationale: Передаёт широкий смысл совершённых дел и сохраняет возвышенный, летописный стиль.
- source_word: תָקְפּוֹ
  choice: его власть
  rationale: В царском контексте слово указывает на действенную силу и властное могущество; «власть» подчёркивает политический оттенок.
- source_word: גְבוּרָתוֹ
  choice: могущество
  rationale: В паре с תָקְפּוֹ передаёт силу и мощь, не сводя выражение к физической крепости или воинской доблести.
- source_word: וּפָרָשַׁת
  choice: и подробное описание
  rationale: Слово обозначает развёрнутое, обстоятельное изложение; этот вариант естественен для официальной летописи.
- source_word: גְּדֻלַּת מָרְדֳּכַי
  choice: величия Мардохея
  rationale: Сохраняет формальную конструкцию и допускает присущий контексту смысл высокого положения Мардохея.
- source_word: אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ
  choice: до которого возвысил его царь
  rationale: Порода пиэль глагола גדל означает сделать великим, возвысить; формулировка сохраняет относительную связь с «величием».
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: разве не записаны они
  rationale: Сохраняет традиционную для библейской историографии форму риторического вопроса.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Книге летописей
  rationale: Естественное русское обозначение официального хронологического свода; альтернативное «анналов» вынесено в сноску.
- source_word: לְמַלְכֵי מָדַי וּפָרָס
  choice: царей Мидии и Персии
  rationale: В названии источника предлог לְ указывает на принадлежность летописи царям или на её содержание; русский родительный падеж передаёт это естественно.
