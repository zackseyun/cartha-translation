  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י מָרְדֳּכַ֣י הַ/יְּהוּדִ֗י מִשְׁנֶה֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וְ/גָדוֹל֙ לַ/יְּהוּדִ֔ים וְ/רָצ֖וּי לְ/רֹ֣ב אֶחָ֑י/ו דֹּרֵ֥שׁ טוֹב֙ לְ/עַמּ֔/וֹ וְ/דֹבֵ֥ר שָׁל֖וֹם לְ/כָל זַרְעֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/003.yaml
  text: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
translation:
  language: ru
  text: Ибо иудей Мардохей был вторым после царя Ахашвероша, велик среди иудеев и пользовался расположением большинства своих братьев[a]. Он искал блага для своего народа и говорил слова мира всему его потомству[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «множеством своих братьев». Под «братьями» здесь, вероятно, понимаются соплеменники Мардохея — иудеи, а не только его родные братья.'
    reason: Слово רֹב может обозначать как большинство, так и множество; родственный термин имеет более широкое общинное значение.
  - marker: b
    text: 'Или: «всем его потомкам». Слово «его» может относиться к Мардохею или к его народу; еврейское слово «потомство» имеет собирательное значение.'
    reason: В оригинале возможна неоднозначность антецедента местоименного суффикса, а זֶרַע обозначает потомков как совокупность.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит заключительное объяснение выдающегося положения Мардохея и сохраняет связь с предыдущим изложением.
- source_word: הַיְּהוּדִי
  choice: иудей
  rationale: В книге Есфирь слово обозначает этнорелигиозную принадлежность Мардохея в персидском окружении; «иудей» — ясный и традиционно понятный русский эквивалент.
- source_word: מִשְׁנֶה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: был вторым после царя Ахашвероша
  rationale: Передаёт второй ранг Мардохея при царе, не вводя отсутствующего в еврейском тексте точного названия должности.
- source_word: וְגָדוֹל לַיְּהוּדִים
  choice: велик среди иудеев
  rationale: Сохраняет краткость и возвышенный регистр оригинала; речь идёт о высоком положении Мардохея среди его народа.
- source_word: וְרָצוּי לְרֹב אֶחָיו
  choice: пользовался расположением большинства своих братьев
  rationale: Естественно передаёт общественное одобрение; רֹב допускает понимание как «большинство» и как «множество», а «братья» в контексте обозначает соплеменников.
- source_word: דֹּרֵשׁ טוֹב לְעַמּוֹ
  choice: искал блага для своего народа
  rationale: Передаёт деятельное стремление приносить народу добро, оставаясь близко к образу исходного выражения.
- source_word: וְדֹבֵר שָׁלוֹם
  choice: говорил слова мира
  rationale: Сохраняет глагол речи и широкое значение שָׁלוֹם — мир, благополучие и целостность — в понятной русской формулировке.
- source_word: לְכָל זַרְעוֹ
  choice: всему его потомству
  rationale: זֶרַע — собирательное обозначение потомства; местоимение «его» сохраняет возможную соотнесённость как с Мардохеем, так и с его народом.
theological_decisions:
- issue: К кому относится суффикс в לְכָל זַרְעוֹ («его потомству»)?
  choice: Сохранено неоднозначное «его потомству».
  alternative: «всем потомкам его народа» или «всем потомкам Мардохея»
  rationale: Грамматика допускает соотнесение местоименного суффикса с Мардохеем либо с названным непосредственно перед этим народом; контекст не требует устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным за счёт разделения на два предложения; подлинные лексические и референциальные неоднозначности отмечены в сносках.
