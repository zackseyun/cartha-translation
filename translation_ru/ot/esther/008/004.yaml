  text: Then the king held out the golden scepter to Esther[a], and Esther rose and stood before the king.
translation:
  language: ru
  text: Тогда царь протянул Эсфири золотой скипетр[a], и Эсфирь поднялась и встала перед царём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёр к Эсфири золотой скипетр».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֶׁט
  choice: протянул
  rationale: Глагол означает «протянуть, вытянуть». «Протянул» естественно передаёт направленное к Эсфири движение скипетра и соответствует придворному контексту.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: золотой скипетр
  rationale: Естественное русское обозначение определённого царского скипетра, уже известного из контекста; оно допускает как материал, так и золотой вид предмета.
- source_word: וַתָּקָם
  choice: поднялась
  rationale: Передаёт значение «встать, подняться» и сохраняет отличие от следующего глагола «встала».
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: встала перед царём
  rationale: Точно и естественно передаёт положение Эсфири перед царём, то есть в его присутствии, сохраняя официальный придворный оттенок.
- source_word: וַ
  choice: Тогда / и
  rationale: Начальное «Тогда» ясно передаёт последовательность событий, а второе «и» сохраняет связность еврейского повествования.
- source_word: לְאֶסְתֵּר
  choice: Эсфири
  rationale: Русский дательный падеж естественно передаёт адресата, к которому царь протянул скипетр.
