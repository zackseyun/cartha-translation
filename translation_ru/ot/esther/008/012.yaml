base_translation:
  language: en
  yaml_path: translation/ot/esther/008/012.yaml
  text: on one day in all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, that is, the month Adar.
translation:
  language: ru
  text: в один день во всех областях царя Ахашвероша — в тринадцатый день двенадцатого месяца, то есть месяца Адара.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם אֶחָד
  choice: в один день
  rationale: Предлог בְּ имеет временное значение, а אֶחָד передаётся без усиления как «один»; формулировка сохраняет связь с предшествующим указанием о совершении действий в один установленный день.
- source_word: בְּכָל מְדִינוֹת
  choice: во всех областях
  rationale: מְדִינָה обозначает административную область державы; «во всех областях» точно и естественно передаёт локативную конструкцию.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: царя Ахашвероша
  rationale: Конструкция указывает на принадлежность областей царю. Форма «Ахашверош» непосредственно передаёт еврейское אֲחַשְׁוֵרוֹשׁ и склоняется по нормам русского языка.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר
  choice: в тринадцатый день
  rationale: Количественное числительное в формуле даты по-русски естественно передаётся порядковым; слово «день» восстанавливается из датирующего контекста.
- source_word: לְחֹדֶשׁ שְׁנֵים עָשָׂר
  choice: двенадцатого месяца
  rationale: Буквально «месяца двенадцать»; русская формула даты требует родительного падежа и порядкового числительного.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: то есть месяца адара
  rationale: הוּא вводит пояснительное приложение. «То есть» ясно передаёт пояснение, а родительный оборот продолжает русскую формулу даты.
