    issue: «вынести, видя»
    rationale: Оборот толкует «мочь увидеть» как «вынести зрелище». Такое толкование возможно по эмоциональному контексту и отражено в английском аудите, но русский перевод может без потери силы сохранить более прямую и менее интерпретирующую формулировку.
  - severity: low
    issue: Формулировка сноски недостаточно ясно обозначает альтернативу «люди моего происхождения/родня».
    rationale: Текущий текст говорит в общем о людях, связанных рождением, но не предлагает читателю ясного альтернативного чтения и несколько неуклюж по-русски.
