    text: 'Или: «гибель моей родни» или «гибель людей моего происхождения». Еврейское слово может обозначать родню или людей, связанных общим происхождением, а не только место рождения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание предшествующей просьбы Есфири; «ведь» естественно передаёт причинно-пояснительную связь в русском контексте.
- source_word: אֵיכָכָה אוּכַל וְרָאִיתִי
  choice: как я смогу вынести, видя
  rationale: Риторический вопрос выражает не простую физическую возможность, а эмоциональную невозможность стать свидетелем бедствия. Формулировка сохраняет значение יכל и естественно связывает его с ראיתי.
- source_word: בָּרָעָה
  choice: бедствие
  rationale: В данном контексте слово обозначает грозящее народу несчастье или calamity, а не нравственное зло.
- source_word: אֲשֶׁר יִמְצָא
  choice: которое постигнет
  rationale: Буквально «которое найдёт»; в этом еврейском обороте глагол означает, что бедствие выпадет на долю народа, то есть постигнет его.
- source_word: עַמִּי
  choice: мой народ
  rationale: Точно передаёт принадлежность Есфири к своему народу и сохраняет обычное значение עַם.
- source_word: בְּאָבְדַן
  choice: гибель
  rationale: Отглагольное существительное от אבד обозначает уничтожение или погибель. «Гибель» звучит естественно и не сужает смысл до конкретного способа уничтожения.
- source_word: מוֹלַדְתִּי
  choice: моих сородичей
  rationale: Слово указывает на людей, связанных с говорящей происхождением или рождением. «Сородичи» сохраняет как родственную, так и этническую составляющую, не сводя смысл к месту рождения.
