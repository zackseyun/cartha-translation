review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: причинная связь כִּי, риторическое «как я смогу», грядущее бедствие для «моего народа» и параллельная гибель родственных по происхождению людей сохранены. Однако «вынести, видя» вводит явный оттенок перенесения/терпения, которого в еврейском тексте нет: יכל означает «мочь», а וראיתי — «увидеть/смотреть».'
  naturalness: «Ведь как я смогу вынести, видя...» понятно, но деепричастный оборот несколько тяжеловесен и ослабляет намеренный параллелизм. Повтор «как я смогу смотреть на...» естественен в современном литературном русском и лучше воспроизводит форму оригинала.
  terminology: «Бедствие», «мой народ», «гибель» и «сородичи» уместны. «Сородичи» удачно передаёт מוֹלַדְתִּי как людей общего происхождения, не сводя слово к географическому месту рождения. Сноску следует уточнить, чтобы она прямо отражала возможные значения слова.
  issues:
