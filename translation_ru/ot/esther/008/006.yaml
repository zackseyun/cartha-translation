  text: For how could I bear to see the disaster that will come upon my people? And how could I bear to see the destruction of my kindred?[a]
translation:
  language: ru
  text: Ибо как я смогу смотреть на бедствие, которое постигнет мой народ? И как я смогу смотреть на гибель моих сородичей?[a]
  philosophy: optimal-equivalence
  footnotes:
