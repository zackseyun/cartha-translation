- from: Ведь как я смогу вынести, видя бедствие, которое постигнет мой народ? И как я смогу вынести, видя гибель моих сородичей?[a]
  to: Ибо как я смогу смотреть на бедствие, которое постигнет мой народ? И как я смогу смотреть на гибель моих сородичей?[a]
  rationale: Замена «вынести, видя» на «смотреть на» ближе к сочетанию «могу — и увижу/буду смотреть» в еврейском тексте, сохраняет эмоциональный риторический вопрос без добавления значения терпения и делает оба члена параллелизма прозрачными. «Ибо» ясно маркирует обоснование предшествующей просьбы и соответствует литературному регистру.
