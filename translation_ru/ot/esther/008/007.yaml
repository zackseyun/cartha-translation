base_translation:
  language: en
  yaml_path: translation/ot/esther/008/007.yaml
  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
translation:
  language: ru
  text: 'Тогда царь Ахашверош сказал царице Эсфири и иудею Мардохею: «Вот, дом Амана я отдал Эсфири, а его самого повесили на дереве[a] за то, что он поднял руку на иудеев».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на дереве». Здесь имеется в виду деревянное сооружение для казни; возможны переводы «на виселице» или «на столбе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: царь Ахашверош
  rationale: Титул перед именем соответствует современному русскому употреблению; имя передано непосредственно по еврейской форме.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: царице Эсфири
  rationale: Естественный русский порядок слов сохраняет имя и царский титул.
- source_word: וּלְמָרְדֳּכַי הַיְּהוּדִי
  choice: и иудею Мардохею
  rationale: Определение הַיְּהוּדִי обозначает этническую принадлежность; «иудей» естественно для контекста книги Эсфирь.
- source_word: הִנֵּה
  choice: Вот
  rationale: «Вот» кратко и естественно сохраняет указательно-эмфатическую силу частицы.
- source_word: בֵית הָמָן
  choice: дом Амана
  rationale: Буквально «дом Амана»; в контексте выражение может охватывать имущество и владение, не требуя сужающего пояснения в основном тексте.
- source_word: נָתַתִּי
  choice: я отдал
  rationale: Совершенный вид передаёт завершённое действие, результат которого сохраняется в момент речи.
- source_word: וְאֹתוֹ תָּלוּ
  choice: а его самого повесили
  rationale: Безлично-личная русская конструкция сохраняет неопределённого деятеля еврейской формы третьего лица множественного числа; «самого» передаёт вынесенное дополнение אֹתוֹ.
- source_word: עַל הָעֵץ
  choice: на дереве
  rationale: Сохранено буквальное и намеренно широкое значение עֵץ — «дерево, древесина, деревянное сооружение»; контекст исполнения казни разъяснён в сноске без преждевременного выбора между виселицей и столбом.
- source_word: עַל אֲשֶׁר
  choice: за то, что
  rationale: Оборот вводит основание наказания; русское «за то, что» естественно связывает проступок с последствием.
- source_word: שָׁלַח יָדוֹ
  choice: поднял руку на
  rationale: Русская идиома передаёт враждебное действие или намерение причинить вред, сохраняя образ руки.
- source_word: ביהודיים
  choice: на иудеев
  rationale: Предлог при глагольной идиоме передаёт направленность враждебного действия; этноним согласован с употреблением в книге.
