  text: בַּ/יּ֣וֹם הַ/ה֗וּא נָתַ֞ן הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרוֹשׁ֙ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה אֶת בֵּ֥ית הָמָ֖ן צֹרֵ֣ר ה/יהודיים וּ/מָרְדֳּכַ֗י בָּ֚א לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ כִּֽי הִגִּ֥ידָה אֶסְתֵּ֖ר מַ֥ה הוּא לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/001.yaml
  text: On that day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews, and Mordecai came before the king, because Esther had told what he was to her.
translation:
  language: ru
  text: В тот день царь Ахашверош отдал царице Эсфири дом Амана, врага иудеев. А Мардохей предстал перед царём, потому что Эсфирь рассказала, кем он ей приходится.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הָמָן
  choice: дом Амана
  rationale: 'Сохраняет широкий смысл еврейского בַּיִת: не только жилище, но и имущество или владение Амана; контекст не требует сужать значение в основном тексте.'
- source_word: צֹרֵר הַיְּהוּדִים
  choice: врага иудеев
  rationale: Причастие צֹרֵר обозначает враждебного противника; естественный русский эквивалент здесь — «враг».
- source_word: בָּא לִפְנֵי הַמֶּלֶךְ
  choice: предстал перед царём
  rationale: Придворная формула означает получение доступа к царю или явление в его присутствие; «предстал перед царём» естественно передаёт официальный оттенок.
- source_word: מַה הוּא לָהּ
  choice: кем он ей приходится
  rationale: Идиома выражает характер родственной или личной связи, не называя его прямо; перевод сохраняет эту неопределённость.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ахашверош
  rationale: Передаёт еврейскую форму имени ближе к WLC и соответствует принципу перевода прежде всего с оригинала.
theological_decisions:
- issue: Причинная связь כִּי
  choice: потому что
  alternative: так как / ибо
  rationale: Союз прямо объясняет, почему Мардохей получил доступ к царю; нейтральное «потому что» ясно сохраняет эту связь.
- issue: Неопределённость выражения מַה הוּא לָהּ
  choice: не уточнять родство в основном тексте
  alternative: назвать Мардохея родственником, двоюродным братом или приёмным отцом
  rationale: Сам стих говорит лишь о том, кем он ей приходится; конкретизация из более широкого повествования здесь устранила бы подлинную неопределённость формулировки.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным тоном. Два самостоятельных предложения облегчают чтение, не меняя синтаксической связи исходного текста. Имена переданы как «Эсфирь», «Аман», «Мардохей» и «Ахашверош»; последнее следует еврейской форме, а не греко-латинской традиции «Артаксеркс».
