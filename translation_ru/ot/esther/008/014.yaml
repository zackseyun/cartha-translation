review_pass:
  verdict: revise
  source_fidelity: В целом переданы гонцы, их конные животные, срочность, царское распоряжение, обнародование указа и место действия. Однако «их торопил и подгонял приказ царя» несколько тяжеловесно и превращает два причастия, описывающие гонцов как спешащих и понуждаемых, в развёрнутое причинное пояснение. Формулировка «поспешно отправились, подгоняемые царским приказом» ближе к исходной конструкции и естественнее.
  naturalness: Современный литературный регистр сохранён. Уточнённый вариант делает первую фразу более плавной, не ослабляя её срочности. «В Сузах, в крепости» яснее передаёт apposition «Сузы-крепость/цитадель», чем прилагательное «Сузская»; последнее может пониматься как отдельная крепость, а не как обозначение самого города-цитадели.
  terminology: «Гонцы» и «указ был обнародован» удачны. «Царские скакуны» — допустимая контекстуальная передача редких и не до конца определённых названий животных, если неопределённость отмечена в сноске. Сноска должна формулировать альтернативу как альтернативный способ передачи сочетания, а не как уверенное историческое отождествление с «конным заводом».
  issues:
  - severity: low
    issue: Не вполне прозрачная передача «в Сузской крепости».
    rationale: Еврейское בְּשׁוּשַׁן הַבִּירָה называет Сузы с их статусом/частью «цитадель». «В Сузах, в крепости» точнее сохраняет эту структуру и не создаёт впечатления, что речь только о безымянном сооружении.
  - severity: low
    issue: Сноска чрезмерно конкретизирует альтернативу как «кони из царского конного завода».
    rationale: Значение редкого персидского заимствования спорно; «конный завод» — современная институциональная конкретизация, которой текст не требует. Следует сохранить указание на возможных племенных или отборных царских коней как на неуверенную альтернативу.
  revised_text: Гонцы верхом на царских скакунах[a] поспешно отправились в путь, подгоняемые царским приказом. Указ был обнародован в Сузах, в крепости.
