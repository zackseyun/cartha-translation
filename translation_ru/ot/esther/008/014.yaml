revisions:
- from: Гонцы верхом на царских скакунах[a] отправились в путь — их торопил и подгонял приказ царя. Указ был обнародован в Сузской крепости.
  to: Гонцы верхом на царских скакунах[a] поспешно отправились в путь, подгоняемые царским приказом. Указ был обнародован в Сузах, в крепости.
  rationale: Исправлены только ясность синтаксиса, передача топонима с обозначением цитадели и формулировка сноски. Неопределённость редких названий животных сохранена, без утверждения их точного вида или породы.
  reviewer_model: gpt-5.6-terra
