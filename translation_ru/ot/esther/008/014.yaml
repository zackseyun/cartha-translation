base_translation:
  language: en
  yaml_path: translation/ot/esther/008/014.yaml
  text: The couriers[a], mounted on the royal steeds, went out hastened and pressed on by the king’s command, and the decree was issued in Susa the citadel.
translation:
  language: ru
  text: Гонцы верхом на царских скакунах[a] поспешно отправились в путь, подгоняемые царским приказом. Указ был обнародован в Сузах, в крепости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на скакунах, царских племенных конях». Древнееврейские названия этих животных редки, и их точное значение неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: гонцы
  rationale: В контексте персидской царской почты слово обозначает не просто бегущих людей, а официальных доставщиков царских посланий; «гонцы» естественно передаёт эту функцию.
- source_word: רֹכְבֵי הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים
  choice: верхом на царских скакунах
  rationale: Оборот описывает ездовых животных царской курьерской службы. Два редких наименования не позволяют уверенно определить точную породу или вид, поэтому выбран понятный контекстуальный эквивалент с примечанием об альтернативе.
- source_word: יָצְאוּ
  choice: отправились в путь
  rationale: В данном повествовательном контексте это естественная передача выхода гонцов для исполнения поручения.
- source_word: מְבֹהָלִים וּדְחוּפִים בִּדְבַר הַמֶּלֶךְ
  choice: их торопил и подгонял приказ царя
  rationale: Формулировка сохраняет два усиливающих друг друга пассивных понятия — гонцов торопят и понуждают двигаться быстрее — и связывает эту срочность с царским приказом.
- source_word: וְהַדָּת נִתְּנָה
  choice: указ был обнародован
  rationale: В административном контексте буквальное «был дан» означает официальное издание и доведение указа до сведения.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: в Сузской крепости
  rationale: Передаёт название места и הַבִּירָה как укреплённую царскую часть Суз в естественной современной русской форме.
