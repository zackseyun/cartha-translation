base_translation:
  language: en
  yaml_path: translation/ot/esther/008/015.yaml
  text: And Mordecai went out from the presence of the king in royal clothing of blue and white[a], with a large crown of gold and a robe of fine linen and purple[e][d][c][b]; and the city of Susa shouted and rejoiced.
translation:
  language: ru
  text: Мардохей вышел от царя в царском одеянии из синей[a] и белой ткани, в большом золотом венце и мантии из тонкого льна и пурпурной ткани. А город Сузы ликовал и радовался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сине-пурпурной». Еврейское слово обозначает дорогой краситель или ткань оттенка от синего до сине-пурпурного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא מִלִּפְנֵי הַמֶּלֶךְ
  choice: вышел от царя
  rationale: Кратко и естественно передаёт движение от царского присутствия; буквальное «из-перед лица царя» по-русски неестественно.
- source_word: לְבוּשׁ מַלְכוּת
  choice: царское одеяние
  rationale: Передаёт официальную и придворную торжественность одежды без архаической тяжеловесности.
- source_word: תְּכֵלֶת
  choice: синяя ткань
  rationale: Слово обозначает престижный краситель или окрашенную им ткань синего либо сине-пурпурного оттенка; основной текст сохраняет традиционное краткое обозначение, а неоднозначность отмечена в сноске.
- source_word: חוּר
  choice: белая ткань
  rationale: В паре с תְּכֵלֶת обозначает белый цвет или белый материал; добавление «ткань» делает описание одежды естественным по-русски.
- source_word: עֲטֶרֶת זָהָב גְּדוֹלָה
  choice: большой золотой венец
  rationale: «Венец» точно передаёт торжественный головной убор, а прилагательное «большой» сохраняет גְּדוֹלָה без усилительного переосмысления.
- source_word: תַכְרִיךְ
  choice: мантия
  rationale: Существительное обозначает обёртывающую верхнюю одежду; «мантия» естественна в царском контексте и сохраняет достоинство регистра.
- source_word: בּוּץ
  choice: тонкий лён
  rationale: Обозначает высококачественный тонкий лён; формулировка сохраняет указание на материал и его ценность.
- source_word: אַרְגָּמָן
  choice: пурпурная ткань
  rationale: Термин может обозначать пурпурный краситель или окрашенную ткань; в описании мантии «пурпурная ткань» звучит ясно и конкретно.
- source_word: הָעִיר שׁוּשָׁן
  choice: город Сузы
  rationale: Передаёт название שׁוּשָׁן в принятой русской библейской форме «Сузы» и сохраняет указание на город.
- source_word: צָהֲלָה וְשָׂמֵחָה
  choice: ликовал и радовался
  rationale: 'Сохраняет два координированных глагола: первый выражает явное, громкое ликование, второй — радость; согласование с «город» в русском мужского рода.'
