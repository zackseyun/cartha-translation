base_translation:
  language: en
  yaml_path: translation/ot/esther/008/013.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made public to all the peoples[d][c][b], and so that the Jews would be ready on that day to avenge themselves on their enemies.
translation:
  language: ru
  text: Копию письменного указа следовало издать как закон в каждой области[a] и обнародовать среди всех народов[b], чтобы к этому дню[c] иудеи были готовы отомстить своим врагам[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в каждой области и области» — еврейский способ сказать «в каждой без исключения области».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «открыто выставить перед всеми народами».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «к этому дню»; имеется в виду установленная указом дата.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «совершить возмездие над своими врагами». Перевод «защититься от своих врагов» передаёт более широкий контекст, но смягчает значение употреблённого здесь глагола.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּתְשֶׁגֶן
  choice: копию
  rationale: Персидское заимствование обозначает копию или список официального документа, а не его оригинал.
- source_word: הַכְּתָב
  choice: письменного указа
  rationale: Буквально «написанного / письменного документа»; в царском административном контексте естественно передать как «письменный указ».
- source_word: לְהִנָּתֵן דָּת
  choice: следовало издать как закон
  rationale: Оборот говорит об официальном обнародовании документа с приданием ему силы закона.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: в каждой области
  rationale: Повтор существительного образует еврейскую дистрибутивную конструкцию «в каждой без исключения области»; по-русски её естественно передать без буквального повтора.
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: обнародовать для всех народов
  rationale: גָּלוּי указывает на открытость и публичность документа, а множественное עַמִּים — на разные народы Персидской державы.
- source_word: הַיְּהוּדִים
  choice: иудеи
  rationale: В книге Есфирь слово обозначает еврейский народ в Персидской державе; «иудеи» соответствует принятому русскому библейскому именованию и остаётся понятным современному читателю.
- source_word: עֲתוּדִים
  choice: готовы
  rationale: Точно и естественно передаёт значение «подготовленные, готовые».
- source_word: לַיּוֹם הַזֶּה
  choice: в назначенный день
  rationale: Буквально «к этому дню»; речь идёт о ранее назначенной указом дате, что выражено естественным русским оборотом без ложного впечатления о текущем дне.
- source_word: לְהִנָּקֵם מֵאֹיְבֵיהֶם
  choice: отомстить своим врагам
  rationale: Nifal глагола נקם означает «отомстить, совершить возмездие»; перевод не смягчает его до общего «защититься».
theological_decisions:
- issue: Возможное смягчение языка возмездия
  choice: отомстить своим врагам
  alternative: защититься от своих врагов
  rationale: Хотя более широкий контекст включает самооборону, глагол נקם непосредственно означает месть или возмездие. Перевод сохраняет эту напряжённость исходного текста.
translation_notes:
  register: 'Современный литературный русский с достоинством официально-административного повествования. Еврейский дистрибутивный повтор передан естественной русской конструкцией, а уточнение вынесено в примечание. Синтаксис упрощён без потери двух целей указа: всеобщего обнародования и подготовки иудеев к назначенному дню.'
