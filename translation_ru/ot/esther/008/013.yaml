  naturalness: Современный литературный русский в целом естественен. Формулировка «обнародовать для всех народов» менее обычна, чем «обнародовать среди всех народов». Перестройка завершающей цели устраняет синтаксическую неоднозначность и точнее отражает еврейскую конструкцию.
  terminology: «Иудеи», «письменный указ», «закон», «область» и «отомстить своим врагам» приемлемы в данном повествовательном и административном контексте. «Отомстить» сохраняет значение נָקַם; не следует заменять его словом «защититься».
