lexical_decisions:
- source_word: לַיְּהוּדִים
  choice: Для иудеев
  rationale: Предлог ל здесь обозначает отнесённость или обладание. «Для иудеев» естественно сохраняет еврейскую конструкцию, не сводя её однозначно к притяжательному выражению.
- source_word: הָיְתָה
  choice: настали
  rationale: В сочетании с вынесенной вперёд предложной группой форма היה выражает наступление нового положения. «Настали» естественно по-русски передаёт перемену участи, хотя буквально возможно «были».
- source_word: אוֹרָה
  choice: свет
  rationale: Слово сохраняет образ света, который в контексте указывает на избавление и благополучие, без поясняющего истолкования в основном тексте.
- source_word: שִׂמְחָה
  choice: радость
  rationale: Обычный и точный русский эквивалент; он отличается от следующего שָׂשׂוֹן, переданного словом «ликование».
- source_word: שָׂשׂוֹן
  choice: ликование
  rationale: Передаёт оттенок бурной, торжествующей радости и сохраняет накопление близких, но не тождественных понятий.
- source_word: יְקָר
  choice: почёт
  rationale: В данном контексте слово обозначает общественное уважение и высокое положение иудеев после перемены их участи; «почёт» естественнее, чем ориентированное на внешний блеск «великолепие».
