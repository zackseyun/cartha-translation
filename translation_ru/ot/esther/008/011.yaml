  text: אֲשֶׁר֩ נָתַ֨ן הַ/מֶּ֜לֶךְ לַ/יְּהוּדִ֣ים אֲשֶׁ֣ר בְּ/כָל עִיר וָ/עִ֗יר לְ/הִקָּהֵל֮ וְ/לַ/עֲמֹ֣ד עַל נַפְשָׁ/ם֒ לְ/הַשְׁמִיד֩ וְ/לַ/הֲרֹ֨ג וּ/לְ/אַבֵּ֜ד אֶת כָּל חֵ֨יל עַ֧ם וּ/מְדִינָ֛ה הַ/צָּרִ֥ים אֹתָ֖/ם טַ֣ף וְ/נָשִׁ֑ים וּ/שְׁלָלָ֖/ם לָ/בֽוֹז׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/011.yaml
  text: that the king granted the Jews in every single city to assemble and to stand for their lives[a], to destroy, to kill, and to annihilate every armed force of any people or province that might attack them, including children and women[b], and to plunder their spoil.
translation:
  language: ru
  text: в которых царь разрешил иудеям, находившимся в каждом городе, собираться и встать на защиту своей жизни, чтобы истребить, убить и погубить все вооружённые силы любого народа или области, которые нападут на них[a], включая детей и женщин[b], и разграбить их имущество.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые враждуют с ними». Еврейское причастие может обозначать тех, кто действует как враг; перевод «нападут на них» выражает подразумеваемое в данном контексте враждебное действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «детей и женщин». В формулировке указа они прямо включены в описанную вражескую группу.'
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר נָתַן
  choice: которым царь разрешил
  rationale: Относительное предложение продолжает формулировку указа; глагол נתן в административном контексте выражает предоставленное царём право, поэтому «разрешил» естественнее буквального «дал».
- source_word: בְּכָל עִיר וָעִיר
  choice: в каждом городе
  rationale: Повтор существительного имеет распределительное значение; русское «в каждом городе» передаёт полноту охвата без неестественного калькирования.
- source_word: לְהִקָּהֵל
  choice: собраться
  rationale: Нифаль обозначает совместное собирание; возвратная форма естественна по-русски.
- source_word: וְלַעֲמֹד עַל נַפְשָׁם
  choice: встать на защиту своей жизни
  rationale: Выражение буквально говорит о том, чтобы «стоять за свою жизнь»; выбранная формулировка сохраняет образ решительного противостояния и ясно передаёт цель самозащиты.
- source_word: לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד
  choice: истребить, убить и погубить
  rationale: Сохранены все три накопительных глагола и суровость юридической формулы без смягчения до общего «победить».
- source_word: כָּל חֵיל
  choice: все вооружённые силы
  rationale: חֵיל здесь обозначает военную силу или вооружённые отряды, а не богатство; множественное число по-русски естественно сочетается с последующим причастным оборотом.
- source_word: עַם וּמְדִינָה
  choice: любого народа или области
  rationale: Пара охватывает этнические и административно-территориальные объединения империи; «любого» выражает всеобщий объём указа.
- source_word: הַצָּרִים אֹתָם
  choice: которые нападут на них
  rationale: Причастие от צרר обозначает враждебное действие; в оборонительном контексте указа «нападут» естественно раскрывает его смысл, а сноска сохраняет более широкую лексическую возможность.
- source_word: טַף וְנָשִׁים
  choice: включая детей и женщин
  rationale: טַף обозначает малых детей или зависимых членов семей. «Включая» показывает синтаксическую принадлежность этой группы к объекту разрешённого уничтожения, не скрывая нравственной тяжести текста.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: и разграбить их имущество
  rationale: Русская формула естественно передаёт разрешение захватить добычу; «имущество» ясно обозначает предмет разграбления и избегает тавтологии.
theological_decisions:
- issue: Насилие в формулировке царского указа
  choice: Прямо передать тройную формулу уничтожения, сохранив оборонительный контекст.
  alternative: Смягчить её до «победить» либо свести всё предложение к разрешению защищаться.
  rationale: Еврейский текст недвусмысленно разрешает смертоносное насилие и захват имущества. Перевод не должен смягчать эту суровость, но выражения о защите жизни и нападающих сохраняют контекст самозащиты.
- issue: Сфера действия слов «детей и женщин»
  choice: Открыто включить детей и женщин в названную в указе вражескую группу.
  alternative: Затемнить, опустить или иным образом этически смягчить эту фразу.
  rationale: Синтаксис естественнее всего относит эту группу к объекту перечисленных действий. Нравственное напряжение исходного текста следует сохранить, а не разрешать посредством перефразирования.
translation_notes:
  register: Современный литературный русский язык с торжественно-деловым оттенком царского указа. Сохранена резкая накопительная формула насилия; синтаксис сделан понятным обычному читателю без конфессиональной интерпретации.
