  yaml_path: translation/ot/esther/008/009.yaml
  text: Then the king’s scribes were summoned at that time[a], in the third month, that is, the month of Sivan, on its twenty-third day; and it was written exactly as Mordecai commanded, to the Jews and to the satraps, the governors, and the officials of the provinces from India to Cush, one hundred and twenty-seven provinces, to each province in its own script, to each people in its own language[b], and also to the Jews in their own script and their own language.
translation:
  language: ru
  text: 'В то время, в третий месяц, то есть в месяце сиване, в двадцать третий день месяца, были созваны царские писцы. И было написано согласно всему, что повелел Мардохей, — иудеям, сатрапам, наместникам и правителям областей от Индии до Куша[a], ста двадцати семи областей: для каждой области — на письме, соответствующем ей, и для каждого народа — на его языке, а также для иудеев — их письмом и на их языке.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до Эфиопии». Куш — древнее название территории к югу от Египта, не вполне совпадающей с современной Эфиопией.'
    reason: lexical_alternative
