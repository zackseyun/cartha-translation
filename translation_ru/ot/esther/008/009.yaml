  terminology: «Сатрапы», «наместники», «правители областей», «Индия» и «Куш» приемлемы. «Письмо» в значении системы письма исторически и контекстуально уместно; формула «на письме, соответствующем каждой области» исключает ошибочное понимание как личного послания.
