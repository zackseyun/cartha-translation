  source_fidelity: 'Основной смысл передан верно: созыв писцов, дата, распоряжение Мардохея, административные адресаты, географический охват и различие между письмом и языком сохранены. Однако «в каждую область её письменностью» не передаёт нормативно конструкцию «каждой области по её письму» и по-русски синтаксически неудачно. Кроме того, «было написано всё, как повелел» менее точно отражает כְּכָל אֲשֶׁר, чем «было написано согласно всему, что повелел».'
