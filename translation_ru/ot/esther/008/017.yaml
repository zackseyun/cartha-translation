base_translation:
  language: en
  yaml_path: translation/ot/esther/008/017.yaml
  text: And in every province and province, and in every city and city, wherever the king’s word and his decree reached, there was joy and gladness for the Jews, a feast and a good day. And many from the peoples of the land were becoming Jews, because the fear of the Jews had fallen on them.
translation:
  language: ru
  text: И в каждой области, и в каждом городе, повсюду, куда доходили слово царя и его указ, у иудеев были радость и ликование, пир и праздничный день. И многие из народов страны становились иудеями, потому что на них пал страх перед иудеями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְדִינָה וּמְדִינָה / עִיר וָעִיר
  choice: в каждой области / в каждом городе
  rationale: Повтор существительного в дистрибутивной конструкции естественно передаётся по-русски словом «каждый», без неестественного буквального удвоения.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: слово царя и его указ
  rationale: Сохраняется различие между царским словом и официальным постановлением; «указ» естественно передаёт административно-правовой смысл דָּת.
- source_word: שִׂמְחָה וְשָׂשׂוֹן
  choice: радость и ликование
  rationale: Передаёт усиленную парную формулу двумя различимыми, естественными русскими словами.
- source_word: מִשְׁתֶּה וְיוֹם טוֹב
  choice: пир и праздничный день
  rationale: מִשְׁתֶּה обозначает пиршество, а יוֹם טוֹב — день праздника или торжества; перевод сохраняет оба элемента.
- source_word: מִתְיַהֲדִים
  choice: становились иудеями
  rationale: Редкая форма допускает смысл принятия иудейской идентичности или присоединения к иудеям; выбран прямой перевод без уточнения обряда или глубины обращения.
- source_word: נָפַל פַּחַד הַיְּהוּדִים עֲלֵיהֶם
  choice: на них напал страх перед иудеями
  rationale: 'Сохраняется образ страха, охватившего людей, и объективное понимание родительного оборота: страх перед иудеями.'
theological_decisions:
- issue: Характер присоединения народов к иудеям
  choice: становились иудеями
  alternative: выдавали себя за иудеев / принимали иудейскую веру
  rationale: Еврейская форма не уточняет ни притворство, ни формальную религиозную процедуру; перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Дистрибутивные повторы исходного текста переданы естественной русской конструкцией «в каждой… в каждом…», а парные выражения и причинная связь сохранены.
