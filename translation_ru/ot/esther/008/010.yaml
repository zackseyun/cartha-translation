base_translation:
  language: en
  yaml_path: translation/ot/esther/008/010.yaml
  text: He wrote in the name of King Ahasuerus[a], sealed it with the king’s signet ring, and sent letters by couriers on horses, riding the royal steeds bred from swift stock.
translation:
  language: ru
  text: Он написал от имени царя Ахашвероша, скрепил написанное царским перстнем и отправил письма с конными гонцами, ехавшими на скакунах — ахаштранах, потомках раммахов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские названия коней в конце стиха редки, и их точное значение неясно. Буквально: «на скакунах — ахаштранах, сынах раммахов». Возможно, речь идёт об отборных животных царского конного завода или царской почтовой службы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Он написал
  rationale: Последовательная повествовательная форма передана естественным русским прошедшим временем; местоимение сохраняет подразумеваемого в контексте Мардохея.
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: от имени царя Ахашвероша
  rationale: Устойчиво передаёт действие на основании официальной царской власти.
- source_word: וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: скрепил написанное царским перстнем
  rationale: Глагол в единственном числе позволяет понимать объект собирательно как написанный указ; «перстень» естественно обозначает царский перстень-печать.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: отправил письма
  rationale: В данном контексте סְפָרִים — официальные письменные послания; «письма» ясно и не перегружено канцеляризмами.
- source_word: בְּיַד הָרָצִים בַּסּוּסִים
  choice: с конными гонцами
  rationale: Идиома בְּיַד обозначает посредство, а сочетание с «на конях» показывает, что речь идёт о царских курьерах; компактная русская формулировка сохраняет оба смысла.
- source_word: רֹכְבֵי הָרֶכֶשׁ
  choice: ехавшими на царских скакунах
  rationale: Причастная конструкция относится к гонцам; редкое רֶכֶשׁ обозначает отборных верховых животных, а «царских» оправдано дворцово-почтовым контекстом.
- source_word: הָאֲחַשְׁתְּרָנִים בְּנֵי הָרַמָּכִים
  choice: выведенных от породистых кобылиц
  rationale: Оба термина редки и не вполне ясны. Формулировка передаёт происхождение животных и вероятную связь с царским конным заводом, не добавляя прямо не выраженной в тексте быстроты.
