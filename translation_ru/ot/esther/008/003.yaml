base_translation:
  language: en
  yaml_path: translation/ot/esther/008/003.yaml
  text: Then Esther spoke again before the king. She fell before his feet[a], wept, and pleaded with him to avert the evil of Haman the Agagite and his scheme that he had devised against the Jews.
translation:
  language: ru
  text: И Есфирь снова заговорила перед царём. Она пала к его ногам, заплакала и стала умолять его устранить[a] зло Амана-агагитянина и его замысел, который он задумал против иудеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удалить», «отвести» либо «упразднить». Еврейский глагол означает сделать так, чтобы зло и замысел Амана прошли, были устранены или утратили силу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף אֶסְתֵּר וַתְּדַבֵּר
  choice: И Есфирь снова заговорила
  rationale: Сочетание יסף с последующим личным глаголом передаёт повторение или продолжение действия. «Снова заговорила» естественно выражает это по-русски.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: перед царём
  rationale: 'Сохранено пространственно-придворное значение: Есфирь говорит в присутствии царя.'
- source_word: וַתִּפֹּל לִפְנֵי רַגְלָיו
  choice: Она пала к его ногам
  rationale: Выражение описывает телесное преклонение в позе просительницы; русский оборот «пасть к ногам» точен и естественен для торжественного повествования.
- source_word: וַתֵּבְךְּ וַתִּתְחַנֶּן לוֹ
  choice: заплакала и стала умолять его
  rationale: בכה означает плакать, а хитпаэль חנן — настойчиво просить о милости. Конструкция «стала умолять» передаёт продолжительное, настойчивое прошение.
- source_word: לְהַעֲבִיר
  choice: устранить
  rationale: Хифиль от עבר здесь означает заставить пройти, удалить или упразднить. «Устранить» может относиться и ко злу, и к замыслу, не сводя выражение исключительно к отмене указа.
- source_word: אֶת רָעַת הָמָן הָאֲגָגִי
  choice: зло Амана-агагитянина
  rationale: רָעָה допускает значения зла, бедствия и причиняемого вреда. Буквально широкое «зло» сохраняет отличие от следующего слова «замысел» и не сужает смысл до одного лишь плана.
- source_word: וְאֵת מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב
  choice: и его замысел, который он задумал
  rationale: Однокоренные существительное и глагол в еврейском тексте создают намеренный повтор. Русская формулировка сохраняет этот повтор и подчёркивает обдуманный характер замысла.
- source_word: עַל הַיְּהוּדִים
  choice: против иудеев
  rationale: В контексте враждебного замысла предлог עַל имеет направленное против кого-либо значение.
