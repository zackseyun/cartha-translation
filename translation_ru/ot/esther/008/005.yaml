  text: וַ֠/תֹּאמֶר אִם עַל הַ/מֶּ֨לֶךְ ט֜וֹב וְ/אִם מָצָ֧אתִי חֵ֣ן לְ/פָנָ֗י/ו וְ/כָשֵׁ֤ר הַ/דָּבָר֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/טוֹבָ֥ה אֲנִ֖י בְּ/עֵינָ֑י/ו יִכָּתֵ֞ב לְ/הָשִׁ֣יב אֶת הַ/סְּפָרִ֗ים מַחֲשֶׁ֜בֶת הָמָ֤ן בֶּֽן הַמְּדָ֨תָא֙ הָ/אֲגָגִ֔י אֲשֶׁ֣ר כָּתַ֗ב לְ/אַבֵּד֙ אֶת הַ/יְּהוּדִ֔ים אֲשֶׁ֖ר בְּ/כָל מְדִינ֥וֹת הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/005.yaml
  text: And she said[a], “If it seems good to the king, and if I have found favor before him, and if the matter is proper before the king, and if I am pleasing in his eyes, let it be written to revoke the letters devised by Haman son of Hammedatha the Agagite[b], which he wrote to destroy the Jews who are in all the provinces of the king.”
translation:
  language: ru
  text: 'И сказала она: «Если царю угодно, если я обрела его благосклонность, если это дело представляется царю правильным и если я угодна в его глазах, пусть будет написано отменить[a] письма, составленные по замыслу Амана, сына Аммедаты, агагитянина[b], которые он написал, чтобы погубить иудеев во всех его областях».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратить вспять». Еврейский глагол может означать «повернуть назад» или, в данном административном контексте, «отменить».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «письма — замысел Амана». Перевод «письма, составленные по замыслу Амана» поясняет эллиптическую еврейскую конструкцию: письма служили осуществлению его замысла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Если царю угодно
  rationale: Естественная русская придворная формула, точно передающая почтительное условие без излишней буквальности.
- source_word: מָצָאתִי חֵן לְפָנָיו
  choice: я обрела благосклонность перед ним
  rationale: «Благосклонность» соответствует חֵן в контексте обращения к царю; «перед ним» сохраняет образность לְפָנָיו.
- source_word: וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ
  choice: это дело представляется царю правильным
  rationale: כָשֵׁר обозначает нечто надлежащее, подходящее или правильное; формулировка сохраняет оценку царя и звучит естественно по-русски.
- source_word: וְטוֹבָה אֲנִי בְּעֵינָיו
  choice: я угодна в его глазах
  rationale: Сохраняется личный характер одобрения и еврейская идиома «в его глазах», понятная в литературном русском языке.
- source_word: יִכָּתֵב
  choice: пусть будет написано
  rationale: Сохранены пассивная форма и просительный оттенок официального обращения; добавлять слово «указ» исходный текст прямо не требует.
- source_word: לְהָשִׁיב
  choice: отменить
  rationale: В административном контексте речь идет об аннулировании силы прежних царских писем; при этом возможное буквальное значение «повернуть вспять» отмечено в сноске.
- source_word: הַסְּפָרִים מַחֲשֶׁבֶת הָמָן
  choice: письма, воплощавшие замысел Амана
  rationale: Передает тесную связь писем с замыслом Амана, не создавая неестественного русского сочетания «письма замысла»; буквальная конструкция отмечена в сноске.
- source_word: הָאֲגָגִי
  choice: агагитянина
  rationale: Формально передает этнонимическое или родовое обозначение, не пытаясь разрешить его историческую природу.
- source_word: לְאַבֵּד
  choice: погубить
  rationale: Точно выражает намеренное уничтожение людей и соответствует высокому, но современно понятному повествовательному регистру.
- source_word: הַיְּהוּדִים אֲשֶׁר בְּכָל מְדִינוֹת הַמֶּלֶךְ
  choice: иудеев во всех областях царя
  rationale: Естественно передает распространение угрозы на все царские области, не меняя ее охвата.
