  register: 'Современный литературный русский язык с достоинством придворной речи. Повтор условного «если» сохранен как элемент настойчивой и почтительной риторики Есфири; синтаксис слегка упорядочен для ясности. Имена переданы прямой транслитерационной традицией исходного текста: Аман, Аммедата, агагитянин.'
