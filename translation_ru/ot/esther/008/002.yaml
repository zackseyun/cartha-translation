base_translation:
  language: en
  yaml_path: translation/ot/esther/008/002.yaml
  text: Then the king removed his signet ring[a], which he had taken away from Haman, and gave it to Mordecai. And Esther appointed Mordecai over the house of Haman.
translation:
  language: ru
  text: Тогда царь снял свой перстень-печатку, который он забрал у Амана, и отдал его Мардохею. А Эсфирь поставила Мардохея над домом Амана[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хозяйством Амана»; возможно также: «имуществом Амана».'
    reason: Лексема בַּיִת здесь может охватывать не только жилище, но весь дом как хозяйство или владение.
lexical_decisions:
- source_word: וַיָּסַר
  choice: снял
  rationale: В породе хифиль глагол означает «удалить, убрать». В связи с перстнем естественное русское соответствие — «снял».
- source_word: טַבַּעְתּוֹ
  choice: свой перстень с печатью
  rationale: В придворном контексте книги Эсфирь это царский перстень, служивший для заверения указов; перевод передаёт его функцию.
- source_word: אֲשֶׁר הֶעֱבִיר מֵהָמָן
  choice: который он отобрал у Амана
  rationale: Хифиль глагола עבר здесь обозначает удаление или передачу перстня от Амана; «отобрал» ясно передаёт конфискацию после падения Амана.
- source_word: וַיִּתְּנָהּ לְמָרְדֳּכָי
  choice: и отдал его Мардохею
  rationale: Местоименный суффикс относится к перстню; «отдал» естественно выражает передачу царём знака полномочий.
- source_word: וַתָּשֶׂם אֶסְתֵּר אֶת מָרְדֳּכַי עַל
  choice: А Эсфирь поставила Мардохея управлять
  rationale: Сочетание שׂוּם с עַל означает поставить кого-либо над определённой областью ответственности; добавление «управлять» делает административный смысл ясным по-русски.
- source_word: בֵּית הָמָן
  choice: домом Амана
  rationale: Слово בַּיִת может обозначать дом, домочадцев, хозяйство или всё имущество. Основной перевод сохраняет широкое и привычное библейское выражение, а варианты отмечены в сноске.
