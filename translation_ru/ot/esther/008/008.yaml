  text: וְ֠/אַתֶּם כִּתְב֨וּ עַל הַ/יְּהוּדִ֜ים כַּ/טּ֤וֹב בְּ/עֵֽינֵי/כֶם֙ בְּ/שֵׁ֣ם הַ/מֶּ֔לֶךְ וְ/חִתְמ֖וּ בְּ/טַבַּ֣עַת הַ/מֶּ֑לֶךְ כִּֽי כְתָ֞ב אֲשֶׁר נִכְתָּ֣ב בְּ/שֵׁם הַ/מֶּ֗לֶךְ וְ/נַחְתּ֛וֹם בְּ/טַבַּ֥עַת הַ/מֶּ֖לֶךְ אֵ֥ין לְ/הָשִֽׁיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/008.yaml
  text: But you may write concerning the Jews as seems good in your eyes[a], in the king’s name, and seal it with the king’s signet ring[b], for a document that is written in the king’s name and sealed with the king’s signet ring cannot be revoked.
translation:
  language: ru
  text: А вы напишите об иудеях так, как сочтёте нужным[a], от имени царя и скрепите написанное царским перстнем-печатью, ибо указ, написанный от имени царя и скреплённый царским перстнем-печатью, отменить нельзя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как хорошо в ваших глазах». То есть по вашему усмотрению.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нельзя отозвать» или «нельзя обратить вспять». Речь о невозможности отменить или аннулировать царский указ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: А вы
  rationale: Союз с явно выраженным местоимением создаёт контраст с предшествующим утверждением о невозможности отменить прежний указ; «А вы» естественно передаёт этот переход и сохраняет множественное число.
- source_word: כִּתְבוּ
  choice: напишите
  rationale: Форма представляет собой повелительное наклонение множественного числа. В контексте царской речи это одновременно повеление и предоставление полномочия; русское «напишите» не ослабляет грамматическую форму.
- source_word: עַל הַיְּהוּדִים
  choice: о иудеях
  rationale: Предлог עַל обозначает предмет документа. «О иудеях» сохраняет широту выражения, не уточняя сверх текста, что указ составляется именно в их пользу.
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  choice: так, как сочтёте нужным
  rationale: Еврейская идиома буквально говорит о том, что хорошо в глазах адресатов, то есть соответствует их усмотрению. Выбран естественный современный русский эквивалент; буквальный образ отмечен в сноске.
- source_word: בְּשֵׁם הַמֶּלֶךְ
  choice: от имени царя
  rationale: Устойчивое русское выражение точно передаёт действие под царским именем и властью, сохраняя лексему «имя».
- source_word: וְחִתְמוּ בְּטַבַּעַת הַמֶּלֶךְ
  choice: и скрепите написанное царским перстнем с печатью
  rationale: Глагол означает запечатать или скрепить печатью. טַבַּעַת здесь — царский перстень, служащий печатью; развёрнутое обозначение делает административную функцию понятной современному читателю.
- source_word: כְתָב
  choice: указ
  rationale: Хотя существительное может обозначать письменный документ вообще, контекст царских распоряжений поддерживает естественное русское «указ».
- source_word: אֲשֶׁר נִכְתָּב ... וְנַחְתּוֹם
  choice: написанный ... и скреплённый
  rationale: Два пассивных определения переданы параллельными причастиями, что сохраняет синтаксическую связь и характер общего юридического правила.
- source_word: אֵין לְהָשִׁיב
  choice: отменить нельзя
  rationale: Буквально выражение означает невозможность вернуть или обратить действие документа. В административном контексте «отменить нельзя» ясно передаёт невозможность отзыва или аннулирования.
