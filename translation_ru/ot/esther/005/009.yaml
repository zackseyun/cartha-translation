base_translation:
  language: en
  yaml_path: translation/ot/esther/005/009.yaml
  text: Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king’s gate[a], and that he did not rise or tremble before him, Haman was filled with rage against Mordecai.
translation:
  language: ru
  text: В тот день Аман вышел радостный и довольный. Но когда Аман увидел Мардохея у царских ворот и заметил, что тот не встал и не дрогнул перед ним[a], он исполнился ярости на Мардохея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не встал и не выказал перед ним страха».'
    reason: Лексическое значение זוע допускает как образ дрожи или содрогания, так и более общее проявление страха.
lexical_decisions:
- source_word: שָׂמֵחַ וְטוֹב לֵב
  choice: радостный и довольный
  rationale: Парное выражение описывает приподнятое, благодушное состояние. Такой перевод естественен по-русски и сохраняет два согласованных определения, не прибегая к буквальному, но тяжеловесному «с добрым сердцем».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача определённого указания на день.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: у царских ворот
  rationale: Предлог ב допускает пространственное значение «у/в». Русское «у царских ворот» естественно обозначает место при дворцовом входе и не навязывает точного положения внутри воротного комплекса.
- source_word: וְלֹא קָם
  choice: не встал
  rationale: Глагол קום обозначает вставание как жест почтения; краткая формулировка сохраняет этот социальный смысл в контексте.
- source_word: וְלֹא זָע מִמֶּנּוּ
  choice: не дрогнул перед ним
  rationale: Редкий глагол זוע может означать дрожь, содрогание или движение от страха. «Не дрогнул перед ним» сохраняет образную неоднозначность между внешней реакцией и проявлением страха.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: исполнился ярости
  rationale: Формула буквально выражает наполнение сильным гневом. «Исполнился ярости» передаёт интенсивность и соответствует dignified literary register без архаической тяжеловесности.
- source_word: עַל מָרְדֳּכַי
  choice: на Мардохея
  rationale: При обозначении гнева עַל указывает на его объект; сочетание «ярость на кого-либо» естественно в современном русском литературном языке.
theological_decisions: []
