translation_notes:
  register: Современный литературный русский с достоинством придворного повествования. Архаическое «и было» опущено как ненужное в русском нарративе; «облачилась» сохраняет торжественный оттенок, оставаясь понятным. Повтор слова «дворец» частично сохраняет повтор בַּיִת в исходном тексте, но первое упоминание внутренних помещений передано как «царские покои» ради естественности и ясности пространственной сцены.
