base_translation:
  language: en
  yaml_path: translation/ot/esther/005/001.yaml
  text: On the third day[a], Esther put on her royal robes and stood in the inner court of the king’s palace, opposite the king’s house, while the king was sitting on his royal throne in the royal house[b], opposite the entrance of the house.
translation:
  language: ru
  text: На третий день Эсфирь облачилась в царские одежды[a] и стала во внутреннем дворе царского дворца, напротив царского дворца. Царь сидел на своём царском престоле в царском дворце[b], напротив входа во дворец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «облеклась в царственность», то есть надела царское облачение или регалии.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово «дом» в данном придворном контексте может означать дворец.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: На третий день
  rationale: Нарративная конструкция וַיְהִי вводит очередное событие и в современном русском не требует отдельного архаического соответствия вроде «и было».
- source_word: וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת
  choice: Эсфирь облачилась в царские одежды
  rationale: Буквально מַלְכוּת означает «царственность, царское достоинство, царство», но в сочетании с глаголом «надевать» подразумевает царское облачение. «Облачилась» уместно передаёт торжественный придворный контекст.
- source_word: בַּחֲצַר בֵּית־הַמֶּלֶךְ הַפְּנִימִית
  choice: во внутреннем дворе царского дворца
  rationale: В данном придворном контексте בֵּית־הַמֶּלֶךְ обозначает дворец или дворцовый комплекс, а не обычный дом.
- source_word: נֹכַח בֵּית הַמֶּלֶךְ
  choice: напротив царских покоев
  rationale: נֹכַח выражает пространственное положение напротив или лицом к чему-либо. «Царские покои» естественно обозначают внутреннюю дворцовую часть, перед которой находилась Эсфирь.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: Царь же сидел
  rationale: Причастная конструкция описывает одновременную фоновую сцену; частица «же» естественно переводит смену фокуса на царя.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: на своём царском престоле
  rationale: Идиоматическое русское соответствие выражению «престол его царства/царственности», сохраняющее принадлежность престола царю.
- source_word: בְּבֵית הַמַּלְכוּת
  choice: в царском дворце
  rationale: Буквально «в доме царства/царственности»; в контексте речь идёт о царском дворце. Перевод не уточняет помещение как тронный зал, поскольку такого уточнения в еврейском тексте нет.
- source_word: נֹכַח פֶּתַח הַבָּיִת
  choice: напротив входа во дворец
  rationale: Сохраняется пространственная ориентация престола относительно входа; «дворец» передаёт контекстуальное значение הַבָּיִת.
