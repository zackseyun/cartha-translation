  yaml_path: translation/ot/esther/005/012.yaml
  text: Then Haman said[a], “Indeed, Queen Esther brought no one with the king to the banquet she prepared except me[b]; and tomorrow also I am invited by her together with the king.”
translation:
  language: ru
  text: 'И сказал Аман: «Более того, царица Есфирь никого, кроме меня, не привела вместе с царём на пир[a], который устроила. И завтра я также приглашён ею[b] вместе с царём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на пиршество». Еврейское מִשְׁתֶּה обозначает пир или праздничную трапезу, часто с вином.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «позван ею». По смыслу здесь: «приглашён ею».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ передвигает повествование вперёд; традиционная русская повествовательная связка здесь естественна.
- source_word: אַף לֹא
  choice: Более того, ... никого
  rationale: אַף усиливает и добавляет новый повод для хвастовства Амана, а לֹא выражает отрицание; сочетание передано естественной русской конструкцией.
- source_word: הֵבִיאָה
  choice: не привела
  rationale: Сохранено конкретное значение каузативной формы глагола «вводить, приводить», а не подставлено более контекстуальное «не пригласила».
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: царица Есфирь
  rationale: Таков естественный для русского языка порядок титула и имени.
- source_word: עִם הַמֶּלֶךְ
  choice: вместе с царём
  rationale: Передано совместное присутствие Амана и царя без добавочного истолкования их ролей.
- source_word: אֶל הַמִּשְׁתֶּה
  choice: на пир
  rationale: מִשְׁתֶּה обозначает праздничную трапезу, нередко с вином; «пир» кратко и уместно передаёт придворную обстановку.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: который устроила
  rationale: Буквально «который сделала»; по-русски пир обычно «устраивают».
- source_word: כִּי אִם אוֹתִי
  choice: никого, кроме меня
  rationale: Конструкция выражает исключение и подчёркивает исключительное положение, которым хвалится Аман.
- source_word: וְגַם לְמָחָר
  choice: И завтра ... снова
  rationale: «Снова» естественно передаёт добавочную силу וְגַם в связи с повторным приглашением на следующий день.
- source_word: קָרוּא
  choice: приглашён
  rationale: Пассивное причастие буквально означает «позван»; в контексте пира речь идёт о приглашении.
- source_word: לָהּ
  choice: к ней
  rationale: Сохранена форма с предлогом לְ и не устранена возможная оттеночная двусмысленность между направленностью приглашения «к ней» и его источником «ею».
