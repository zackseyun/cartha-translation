base_translation:
  language: en
  yaml_path: translation/ot/esther/005/011.yaml
  text: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
translation:
  language: ru
  text: И Аман рассказал им о великолепии своего богатства[a], о множестве своих сыновей и обо всём, чем царь возвеличил его[b], и о том, как он возвысил его над сановниками и царскими слугами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о блеске своего богатства». Еврейское выражение подчёркивает впечатляющее великолепие его богатства.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обо всём, что царь сделал, чтобы возвысить его»; возможен смысл: «обо всём, чем царь повысил его».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «над сановниками и царскими служащими».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: рассказал
  rationale: Обычное повествовательное значение глагола ספר; современное русское слово естественно вводит перечисление Амана.
- source_word: כְּבוֹד עָשְׁרוֹ
  choice: великолепие своего богатства
  rationale: כָּבוֹד в сочетании с богатством указывает на его впечатляющее великолепие и блеск, а не только на отвлечённую «славу».
- source_word: רֹב בָּנָיו
  choice: множество своих сыновей
  rationale: רֹב выражает многочисленность, а בָּנָיו означает именно «его сыновья», поэтому родовое «дети» не используется.
- source_word: גִּדְּלוֹ
  choice: возвеличил его
  rationale: Пиэль от גדל передаёт каузативное возвышение или придание величия; «возвеличил» сохраняет образ исходного текста и роль царя.
- source_word: נִשְּׂאוֹ עַל
  choice: возвысил над
  rationale: Оборот означает повышение положения по сравнению с другими и ясно передаёт придворную иерархию.
- source_word: הַשָּׂרִים
  choice: начальниками
  rationale: שָׂרִים обозначает высокопоставленных руководителей или должностных лиц; «начальники» понятно современному читателю и не предполагает наследственного титула.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: царскими слугами
  rationale: В придворном контексте речь идёт о людях на царской службе; этот вариант естественнее буквального «рабами царя» и сохраняет служебную зависимость.
