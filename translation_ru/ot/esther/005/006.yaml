base_translation:
  language: en
  yaml_path: translation/ot/esther/005/006.yaml
  text: And the king said to Esther at the wine banquet[a], “What is your petition? It will be granted to you. And what is your request? Even up to half the kingdom[b], it will be done.”
translation:
  language: ru
  text: 'И сказал царь Есфири во время пира с вином: «Какова твоя просьба? Она будет удовлетворена[a]. И каково твоё желание? Даже до половины царства[b] — оно будет исполнено».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и будет дано тебе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-еврейски: «до половины царства»; слово «моего» в тексте прямо не выражено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: во время пира с вином
  rationale: מִשְׁתֶּה обозначает пир, связанный с питьём, а הַיַּיִן прямо уточняет, что речь о вине. Формулировка сохраняет обе составляющие и звучит понятно по-русски.
- source_word: שְּׁאֵלָתֵךְ
  choice: твоя просьба
  rationale: В данном придворном контексте существительное означает просимое, а не вопрос. «Просьба» естественно передаёт смысл обращения к царю.
- source_word: וְיִנָּתֵן לָךְ
  choice: она будет удовлетворена
  rationale: Буквально выражение означает «и будет дано тебе», но в контексте царского обещания речь об удовлетворении просьбы. Местоимение «она» связывает обещание с предшествующим словом «просьба».
- source_word: בַּקָּשָׁתֵךְ
  choice: твоё желание
  rationale: Так сохраняется небольшой смысловой и стилистический контраст со שְׁאֵלָה, уже переданным словом «просьба», без искусственной канцелярской тяжеловесности.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: даже до половины царства
  rationale: «Даже до» передаёт усилительную силу царской гиперболы; определённое «царства» сохраняет отсутствие в еврейском тексте явного притяжательного местоимения «моего».
- source_word: וְתֵעָשׂ
  choice: оно будет исполнено
  rationale: Форма выражает заверение, что желание будет осуществлено. «Будет исполнено» естественно для русского придворного контекста и сохраняет пассивное выражение исходного текста.
