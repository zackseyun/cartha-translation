  text: But Haman restrained himself and went to his house[b][a]. Then he sent and brought in his friends and Zeresh his wife.
translation:
  language: ru
  text: Но Аман сдержался[a] и пошёл к себе домой[b]. Затем он послал за своими друзьями и женой Зереш и привёл их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «овладел собой», «удержался».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пошёл в свой дом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַפַּק
  choice: сдержался
  rationale: Порода хитпаэль передаёт самообладание и сдерживание гнева; возвратная форма «сдержался» естественна по-русски и сохраняет смысл.
- source_word: וַיָּבֹא אֶל־בֵּיתוֹ
  choice: пошёл к себе домой
  rationale: Оборот обозначает движение к собственному дому. Русское «пошёл к себе домой» естественно передаёт направление, не воспроизводя контекстуально неуместное «пришёл».
- source_word: וַיִּשְׁלַח
  choice: послал за
  rationale: Объект посылания в еврейском подразумевается, а следующий каузативный глагол сообщает результат. По-русски «послал за» ясно и кратко передаёт созыв людей.
- source_word: וַיָּבֵא
  choice: и те пришли
  rationale: 'Хифиль буквально значит «велел прийти / привёл». В сочетании с «послал за» естественная русская конструкция передаёт каузативную связь через результат: он вызвал их, и они пришли.'
- source_word: אֹהֲבָיו
  choice: своими друзьями
  rationale: Субстантивированная форма от אהב в данном социальном контексте обозначает друзей или близких сторонников; «друзья» — наиболее естественный современный эквивалент.
- source_word: זֶרֶשׁ אִשְׁתּוֹ
  choice: своей женой Зереш
  rationale: Русский порядок слов с приложением после слова «женой» звучит естественно и однозначно указывает на отношение Зереш к Аману.
- source_word: וַ
  choice: Но / Затем
  rationale: Первый повествовательный waw в контексте противопоставляет самообладание Амана только что упомянутой ярости; далее «затем» естественно обозначает последовательность событий.
