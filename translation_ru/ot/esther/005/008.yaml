  text: אִם מָצָ֨אתִי חֵ֜ן בְּ/עֵינֵ֣י הַ/מֶּ֗לֶךְ וְ/אִם עַל הַ/מֶּ֨לֶךְ֙ ט֔וֹב לָ/תֵת֙ אֶת שְׁאֵ֣לָתִ֔/י וְ/לַ/עֲשׂ֖וֹת אֶת בַּקָּשָׁתִ֑/י יָב֧וֹא הַ/מֶּ֣לֶךְ וְ/הָמָ֗ן אֶל הַ/מִּשְׁתֶּה֙ אֲשֶׁ֣ר אֶֽעֱשֶׂ֣ה לָ/הֶ֔ם וּ/מָחָ֥ר אֶֽעֱשֶׂ֖ה כִּ/דְבַ֥ר הַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
translation:
  language: ru
  text: Если я обрела благосклонность в глазах царя[a] и если царю угодно удовлетворить моё прошение и исполнить мою просьбу, пусть царь с Аманом придут на пир, который я устрою для них, и завтра я поступлю по слову царя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «обрела благосклонность царя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и завтра я поступлю по слову царя». Вероятно, Эсфирь имеет в виду, что ответит на предложение царя назвать своё прошение; еврейское выражение остаётся несколько недосказанным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  choice: обрела благосклонность в глазах
  rationale: Сохраняет образность устойчивого еврейского выражения и естественно звучит в почтительной придворной речи; «благосклонность» уместнее богословски окрашенной «благодати».
- source_word: עַל הַמֶּלֶךְ טוֹב
  choice: царю угодно
  rationale: Естественная русская придворная формула, точно передающая значение приемлемости и желания царя.
- source_word: לָתֵת אֶת שְׁאֵלָתִי
  choice: удовлетворить моё прошение
  rationale: Передаёт смысл дарования просимого и сохраняет официальный тон обращения к царю.
- source_word: וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  choice: исполнить мою просьбу
  rationale: Естественно передаёт сочетание глагола «делать» с просьбой и сохраняет различие между двумя близкими существительными.
- source_word: שְׁאֵלָתִי / בַּקָּשָׁתִי
  choice: прошение / просьба
  rationale: Два близких, но различных русских слова отражают лексическое варьирование еврейского текста и торжественный регистр речи Эсфири.
- source_word: יָבֹא
  choice: пусть ... придут
  rationale: Передаёт юссивную силу формы как вежливое приглашение, а согласование во множественном числе естественно для русского составного подлежащего.
- source_word: הַמִּשְׁתֶּה
  choice: пир
  rationale: Краткое и традиционное, но понятное современному читателю обозначение царского застолья; контекст допускает присутствие вина без необходимости вносить это в основной текст.
- source_word: אֲשֶׁר אֶעֱשֶׂה לָהֶם
  choice: который я устрою для них
  rationale: Русское «устроить пир» естественно передаёт еврейское «сделать пир».
- source_word: וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ
  choice: и завтра я поступлю по слову царя
  rationale: Сохраняет эллиптичность и некоторую смысловую открытость оригинала, не сводя выражение прямо к ответу или объявлению просьбы.
theological_decisions:
- issue: Смысл заключительной фразы
  choice: Сохранить выражение «поступлю по слову царя» в его эллиптической форме.
  alternative: «Завтра я изложу свою просьбу, как велел царь».
  rationale: Контекст указывает на обещание Эсфири ответить на царское приглашение назвать просьбу, однако еврейский текст прямо этого не формулирует; перевод не должен устранять подлинную недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно торжественной придворной интонацией. Сохранены параллелизм «прошение / просьба» и образ «в глазах царя», а заключительная фраза намеренно не истолкована сверх текста.
