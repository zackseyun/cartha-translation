  - marker: b
    text: Слово «иудей» можно также передать как «житель Иудеи»; здесь оно, вероятнее всего, подчёркивает этническую принадлежность Мардохея при персидском дворе.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל זֶה
  choice: Но всё это
  rationale: Союз וְ в данном контексте противопоставляет эти слова предыдущему перечислению почестей Амана; «но» естественно передаёт этот контраст, а כָל זֶה — «всё это».
- source_word: אֵינֶנּוּ שֹׁוֶה לִי
  choice: для меня ничего не значит
  rationale: Оборот с שׁוה выражает отсутствие ценности или пользы для говорящего. Выбранная формулировка естественна в современном русском и передаёт субъективную оценку Амана, не сводя смысл только к материальной выгоде.
- source_word: בְּ/כָל עֵת אֲשֶׁר
  choice: пока
  rationale: 'Буквально выражение означает «всякий раз, когда». В контексте жалобы Амана оно допускает продолжительное понимание: все почести ничего для него не значат, пока он продолжает видеть Мардохея у ворот. Буквальный повторительный оттенок сохранён в примечании.'
- source_word: רֹאֶה
  choice: я вижу
  rationale: Причастие с אֲנִי обозначает продолжающееся или повторяющееся действие; настоящее время по-русски передаёт оба возможных оттенка.
- source_word: מָרְדֳּכַי
  choice: Мардохея
  rationale: Использована традиционная русская библейская форма имени, поставленная в винительный падеж согласно синтаксису предложения.
- source_word: הַיְּהוּדִי
  choice: иудея
  rationale: יְהוּדִי может означать как представителя иудейского народа, так и выходца из Иудеи. В персидском придворном контексте книги Есфирь здесь, вероятнее всего, подчёркнута этническая принадлежность Мардохея.
- source_word: יוֹשֵׁב
  choice: сидящим
  rationale: Причастие прямо описывает положение Мардохея и согласуется с дополнением «Мардохея» в конструкции «вижу ... сидящим».
- source_word: בְּ/שַׁעַר הַמֶּלֶךְ
  choice: у царских ворот
  rationale: Речь идёт о воротах царского дворца как месте придворной и административной деятельности. Русское «у царских ворот» естественно обозначает нахождение в этой зоне.
