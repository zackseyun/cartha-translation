  text: Then the king said[a], "Hurry, bring Haman, so that Esther's word may be done." So the king and Haman came to the banquet that Esther had prepared.
translation:
  language: ru
  text: 'Тогда царь сказал: «Поторопитесь, приведите Амана, чтобы исполнить просьбу Есфири». И царь с Аманом пришли на пир, который устроила Есфирь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַהֲרוּ אֶת־הָמָן
  choice: Поторопитесь, приведите Амана
  rationale: Форма множественного числа повелительного наклонения обращена к слугам и требует немедленного действия. Глагол «приведите» естественно передаёт подразумеваемое распоряжение доставить Амана.
- source_word: לַעֲשׂוֹת אֶת־דְּבַר אֶסְתֵּר
  choice: чтобы исполнить просьбу Есфири
  rationale: 'Буквально: «чтобы сделать слово Есфири». В придворном контексте דָּבָר обозначает высказанную просьбу или пожелание; «исполнить просьбу» естественно и точно передаёт смысл сочетания.'
- source_word: וַיָּבֹא
  choice: пришли
  rationale: 'Хотя форма глагола стоит в единственном числе перед составным подлежащим, по-русски требуется множественное число: царь и Аман пришли к месту пира.'
- source_word: הַמִּשְׁתֶּה
  choice: пир
  rationale: מִשְׁתֶּה означает пир или праздничное угощение, нередко с вином. «Пир» соответствует царской обстановке и принятой русской библейской лексике, оставаясь понятным современному читателю.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: который устроила Есфирь
  rationale: Глагол עשה применительно к пиру означает приготовить или устроить его. «Устроила» естественно описывает организацию пира.
