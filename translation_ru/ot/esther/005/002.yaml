base_translation:
  language: en
  yaml_path: translation/ot/esther/005/002.yaml
  text: And when the king saw Esther the queen standing in the court[a], she found favor in his sight, and the king extended to Esther the golden scepter that was in his hand[c][b]. Then Esther came near and touched the top of the scepter.
translation:
  language: ru
  text: И когда царь увидел царицу Эсфирь, стоявшую во дворе[a], она снискала благоволение в его глазах[b]. Царь протянул Эсфири золотой скипетр, который был у него в руке. Тогда Эсфирь подошла и коснулась верхушки скипетра[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во внутреннем дворе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «несла благоволение в его глазах»; еврейская идиома, означающая, что царь отнёсся к ней благосклонно.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «головы скипетра»; возможно также: «конца скипетра».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹת
  choice: Когда ... увидел
  rationale: Конструкция וַיְהִי с инфинитивом вводит придаточное времени; русское «когда» естественно передаёт повествовательный переход без буквального и тяжеловесного «и было».
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: царицу Эсфирь
  rationale: В русском сочетание титула с именем в этой синтаксической позиции естественно ставится как «царицу Эсфирь», при этом сохраняются и имя, и царский статус.
- source_word: עֹמֶדֶת בֶּחָצֵר
  choice: стоявшую во дворе
  rationale: Причастный оборот передаёт положение Эсфири; חָצֵר обозначает двор или внутренний двор дворцового комплекса.
- source_word: נָשְׂאָה חֵן בְּעֵינָיו
  choice: она обрела благосклонность в его глазах
  rationale: Сохранён образ еврейской идиомы «в его глазах», а «обрела благосклонность» ясно передаёт благоприятное отношение царя.
- source_word: וַיּוֹשֶׁט
  choice: протянул
  rationale: Глагол обозначает движение предмета по направлению к кому-либо; «протянул» естественно и точно в контексте царского жеста.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: золотой скипетр
  rationale: Устоявшееся русское обозначение царской регалии.
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: который был у него в руке
  rationale: Относительное придаточное прямо передаёт уточнение еврейского текста, не добавляя, что царь непременно держал скипетр каким-либо особым образом.
- source_word: וַתִּקְרַב
  choice: Тогда Эсфирь подошла
  rationale: «Подошла» естественно передаёт приближение Эсфири в ответ на жест царя; «тогда» обозначает последовательность действий.
- source_word: וַתִּגַּע בְּרֹאשׁ הַשַּׁרְבִיט
  choice: коснулась конца скипетра
  rationale: רֹאשׁ буквально означает «голова», но применительно к скипетру по-русски естественно «конец»; это не уточняет форму окончания сверх исходного текста.
