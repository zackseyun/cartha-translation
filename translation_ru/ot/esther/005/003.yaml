  text: Then the king said to her[a], “What is it[c][b], Queen Esther? And what is your request? Up to half the kingdom—it will be given to you.”
translation:
  language: ru
  text: 'Царь сказал ей: «Что с тобой, царица Эсфирь? Какова твоя просьба? До половины царства — будет дано тебе».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «до половины царства» — принятая царская формула щедрого обещания; они не обязательно означают буквальное предложение разделить царство.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהּ הַמֶּלֶךְ
  choice: Царь сказал ей
  rationale: Последовательная форма глагола продолжает повествование; в русском естественный порядок слов и контекст позволяют передать её простым прошедшим временем без обязательного «тогда».
- source_word: מַה לָּךְ
  choice: Что с тобой
  rationale: Еврейская идиома буквально означает «что тебе?» и спрашивает, что случилось или что заботит Эсфирь. Русское «Что с тобой?» кратко и естественно, не уточняя сверх текста характер её тревоги.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: царица Эсфирь
  rationale: Сохраняет имя и царский титул в обычном русском порядке.
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: О чём ты просишь?
  rationale: בַּקָּשָׁה — просьба или прошение. Глагольная формулировка звучит естественно в современном русском и сохраняет смысл вопроса.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: хоть до половины царства
  rationale: Передаёт предел щедрого царского обещания и естественно сочетается с подразумеваемым приглашением высказать просьбу.
- source_word: וְיִנָּתֵן לָךְ
  choice: и будет дано тебе
  rationale: Пассивная форма обещания сохранена близко к еврейскому тексту; подразумеваемый предмет определяется просьбой Эсфири.
