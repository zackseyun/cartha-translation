  yaml_path: translation/ot/esther/005/004.yaml
  text: Esther said[a], “If it pleases the king[b], let the king and Haman come today to the banquet that I have prepared for him.”
translation:
  language: ru
  text: 'Есфирь сказала: «Если царю угодно, пусть царь и Аман придут сегодня на пир, который я устроила для него[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «для него»; местоимение стоит в единственном числе и, вероятнее всего, относится к царю, хотя приглашён также Аман.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Если царю угодно
  rationale: Естественная русская формула почтительной просьбы, точно передающая придворный оборот со значением благосклонного одобрения царя.
- source_word: יָבוֹא
  choice: пусть ... придут
  rationale: Форма глагола в данном контексте выражает вежливое приглашение-пожелание. В русском языке при составном подлежащем «царь и Аман» требуется множественное число.
- source_word: הַמֶּלֶךְ וְהָמָן
  choice: царь и Аман
  rationale: Сохранено повторение титула «царь», характерное для придворной речи; имя царя, отсутствующее в еврейском тексте, не добавляется.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямой и естественный современный эквивалент, сохраняющий безотлагательность приглашения.
- source_word: הַמִּשְׁתֶּה
  choice: пир
  rationale: В царском повествовательном контексте «пир» естественно передаёт праздничную трапезу, при которой подразумевается и питьё, не выдвигая последнее на первый план.
- source_word: אֲשֶׁר עָשִׂיתִי לוֹ
  choice: который я устроила для него
  rationale: С пиром глагол עָשָׂה по-русски естественно передаётся как «устроила». Единственное число местоимения сохранено и не сглажено до «для них».
