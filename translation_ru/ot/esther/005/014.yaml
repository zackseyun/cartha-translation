  text: וַ/תֹּ֣אמֶר ל/וֹ֩ זֶ֨רֶשׁ אִשְׁתּ֜/וֹ וְ/כָל אֹֽהֲבָ֗י/ו יַֽעֲשׂוּ עֵץ֮ גָּבֹ֣הַּ חֲמִשִּׁ֣ים אַמָּה֒ וּ/בַ/בֹּ֣קֶר אֱמֹ֣ר לַ/מֶּ֗לֶךְ וְ/יִתְל֤וּ אֶֽת מָרְדֳּכַי֙ עָלָ֔י/ו וּ/בֹֽא עִם הַ/מֶּ֥לֶךְ אֶל הַ/מִּשְׁתֶּ֖ה שָׂמֵ֑חַ וַ/יִּיטַ֧ב הַ/דָּבָ֛ר לִ/פְנֵ֥י הָמָ֖ן וַ/יַּ֥עַשׂ הָ/עֵֽץ־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/014.yaml
  text: Then Zeresh his wife and all his friends said to him[a], “Let a gallows fifty cubits high be made, and in the morning tell the king to have Mordecai hanged on it. Then go with the king to the banquet rejoicing.” The matter pleased Haman[c][b], and he made the gallows.
translation:
  language: ru
  text: 'Тогда его жена Зерешь и все его друзья сказали ему: «Пусть сделают деревянный столб[a] высотой в пятьдесят локтей[b], а утром скажи царю, чтобы на нём повесили[c] Мардохея. После этого радостно иди с царём на пир». Это предложение понравилось Аману, и он сделал этот столб.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «деревянное сооружение», «дерево» либо «виселица». Еврейское слово עֵץ может обозначать дерево, древесину, столб или деревянное сооружение для казни; его точная форма неизвестна.'
    reason: lexical_alternative
  - marker: b
    text: Пятьдесят локтей — примерно 23 метра.
    reason: cultural_note
  - marker: c
    text: 'Или: «посадили Мардохея на кол». Здесь может подразумеваться подвешивание тела или казнь на деревянном столбе; точный способ казни остаётся неясным.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבָיו
  choice: его друзья
  rationale: Буквально — «любящие его»; в придворном повествовании речь идёт о близких людях и сторонниках Амана. «Друзья» естественно передаёт смысл по-русски.
- source_word: יַעֲשׂוּ עֵץ
  choice: пусть сделают деревянный столб
  rationale: Форма глагола выражает совет или предложение, а עֵץ обозначает дерево либо деревянное сооружение. «Деревянный столб» не предполагает позднейшую конструкцию виселицы с перекладиной и сохраняет неопределённость формы.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: высотой в пятьдесят локтей
  rationale: Сохранена древняя единица измерения; современный приблизительный эквивалент дан в примечании.
- source_word: וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו
  choice: чтобы на нём повесили Мардохея
  rationale: Неопределённое множественное число естественно передано безличной конструкцией. Глагол תלה означает подвешивание; возможное насаживание на кол отмечено в примечании.
- source_word: וּבֹא עִם־הַמֶּלֶךְ אֶל־הַמִּשְׁתֶּה שָׂמֵחַ
  choice: после этого радостно иди с царём на пир
  rationale: «Пир» естественно соответствует מִשְׁתֶּה в царском контексте, а שָׂמֵחַ передано как обстоятельство состояния Амана.
- source_word: וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן
  choice: это предложение понравилось Аману
  rationale: Русская идиоматическая передача еврейского выражения «это было хорошо в глазах Амана».
- source_word: וַיַּעַשׂ הָעֵץ
  choice: он велел сделать столб
  rationale: Хотя буквально сказано «он сделал», в контексте высокопоставленный Аман, вероятно, распорядился изготовить сооружение. Каузативная русская формулировка естественна, но не уточняет исполнителей.
