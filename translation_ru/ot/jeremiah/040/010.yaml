  text: וַ/אֲנִ֗י הִנְ/נִ֤י יֹשֵׁב֙ בַּ/מִּצְפָּ֔ה לַֽ/עֲמֹד֙ לִ/פְנֵ֣י הַ/כַּשְׂדִּ֔ים אֲשֶׁ֥ר יָבֹ֖אוּ אֵלֵ֑י/נוּ וְ/אַתֶּ֡ם אִסְפוּ֩ יַ֨יִן וְ/קַ֜יִץ וְ/שֶׁ֗מֶן וְ/שִׂ֨מוּ֙ בִּ/כְלֵי/כֶ֔ם וּ/שְׁב֖וּ בְּ/עָרֵי/כֶ֥ם אֲשֶׁר תְּפַשְׂתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/010.yaml
  text: As for me[a], behold, I am staying at Mizpah to stand before the Chaldeans who come to us. But you, gather wine, summer fruit, and oil, put them in your containers[b], and dwell in your cities that you have taken.
translation:
  language: ru
  text: А я — вот, остаюсь в Мицпе, чтобы стоять перед[b] халдеями[a], которые будут приходить к нам. Вы же собирайте вино, летние плоды и масло, складывайте всё это в свои сосуды и живите в городах, которые вы заняли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вавилонянами».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «стоять перед» может также подразумевать официальное служение перед ними или представительство перед ними.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי יֹשֵׁב
  choice: я остаюсь
  rationale: Сочетание вводит подчёркнутое заявление говорящего о его пребывании в Мицпе. Русское «я остаюсь» естественно передаёт длительное пребывание; отдельное «вот» здесь звучало бы тяжеловесно.
- source_word: לַעֲמֹד לִפְנֵי
  choice: стоять перед
  rationale: 'Сохранена образная еврейская формула и её смысловая открытость: она может обозначать как явление перед властью, так и официальное служение или представительство.'
- source_word: הַכַּשְׂדִּים
  choice: халдеями
  rationale: Это прямое соответствие еврейскому этнониму; общеупотребительное историческое отождествление с вавилонянами вынесено в примечание.
- source_word: יָבֹאוּ אֵלֵינוּ
  choice: которые будут приходить к нам
  rationale: Будущее время и несовершенный вид естественно передают ожидаемые, возможно неоднократные визиты халдеев.
- source_word: אִסְפוּ
  choice: собирайте
  rationale: Императив передан повелительной формой несовершенного вида, подходящей для продолжительного сезонного сбора перечисленных продуктов.
- source_word: קַיִץ
  choice: летние плоды
  rationale: Сохраняется сезонное значение существительного без неоправданного сужения до одного вида плодов, например инжира.
- source_word: שִׂימוּ בִּכְלֵיכֶם
  choice: складывайте всё это в свои сосуды
  rationale: «Сосуды» достаточно широко передаёт כְּלִי, не уточняя материал и форму; «всё это» естественно связывает действие со всем перечнем.
- source_word: וּשְׁבוּ
  choice: живите
  rationale: В данном контексте ישב означает проживание, а не буквальное сидение; современное «живите» ясно и естественно.
- source_word: תְּפַשְׂתֶּם
  choice: которыми вы овладели
  rationale: Формулировка передаёт вступление во владение городами, не добавляя отсутствующей в тексте конкретики о способе их захвата.
theological_decisions:
- issue: Официальный смысл выражения לַעֲמֹד לִפְנֵי
  choice: В основном тексте сохранено буквальное «стоять перед».
  alternative: «представлять вас перед» или «служить перед».
  rationale: Контекст допускает административное представительство перед халдейской властью, однако сама еврейская формула не требует однозначно закреплять только этот смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; архаизмы устранены, но этноним «халдеи» и широкое слово «сосуды» сохранены ради точности.
