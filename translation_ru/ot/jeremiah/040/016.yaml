  choice: «ложь»
  rationale: Существительное прямо обозначает ложь; такая передача сохраняет резкость обвинения и соответствует синтаксису исходного текста.
- source_word: דֹבֵר אֶל־יִשְׁמָעֵאל
  choice: «говоришь … об Измаиле»
  rationale: Предлог אֶל в данном контексте указывает на лицо, о котором сделано сообщение; «об Измаиле» естественно передаёт смысл по-русски.
