base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/009.yaml
  text: Gedaliah son of Ahikam[a], son of Shaphan, swore to them and to their men, saying, “Do not be afraid to serve the Chaldeans. Live in the land and serve the king of Babylon, and it will go well for you.”
translation:
  language: ru
  text: 'Гедалия, сын Ахикама, сына Шафана, поклялся им и их людям: «Не бойтесь служить халдеям[a]. Живите в этой земле и служите царю Вавилона — и вам будет хорошо».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вавилонянам». В еврейском тексте сказано «халдеям»; это название часто обозначает правящую силу Вавилона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: поклялся
  rationale: Форма нифаль глагола שׁבע означает принести клятву; «поклялся» кратко и естественно передаёт обязательную силу сказанного.
- source_word: לָהֶם ... וּלְאַנְשֵׁיהֶם
  choice: им и их людям
  rationale: Сохраняет широкое значение אַנְשֵׁי — людей, связанных с адресатами, — не сужая его без необходимости до «воинов».
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В современном русском отдельное «говоря» здесь стилистически избыточно; функцию еврейского показателя цитаты естественно передаёт оформление прямой речи.
- source_word: אַל תִּירְאוּ מֵעֲבֹד הַכַּשְׂדִּים
  choice: Не бойтесь служить халдеям
  rationale: Естественная русская конструкция после глагола страха; дательный при «служить» идиоматично передаёт политическое подчинение.
- source_word: הַכַּשְׂדִּים
  choice: халдеям
  rationale: Сохранено конкретное историко-этническое обозначение исходного текста, которое в данном контексте относится к вавилонской власти.
- source_word: שְׁבוּ בָאָרֶץ
  choice: Живите в этой земле
  rationale: ישׁב допускает значения «жить, обитать, оставаться»; «живите» ясно и современно, а указательное «этой» естественно указывает на уже известную землю.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: и служите царю Вавилона
  rationale: Передаёт политическое подчинение царю, не ослабляя его до обычной работы.
- source_word: וְיִיטַב לָכֶם
  choice: и всё у вас будет хорошо
  rationale: Естественно передаёт еврейскую идиому о благоприятном исходе и благополучии.
