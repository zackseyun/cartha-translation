  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו הֲ/יָדֹ֤עַ תֵּדַע֙ כִּ֞י בַּעֲלִ֣יס מֶ֣לֶךְ בְּנֵֽי עַמּ֗וֹן שָׁלַח֙ אֶת יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה לְ/הַכֹּתְ/ךָ֖ נָ֑פֶשׁ וְ/לֹא הֶאֱמִ֣ין לָ/הֶ֔ם גְּדַלְיָ֖הוּ בֶּן אֲחִיקָֽם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/014.yaml
  text: And they said to him[b][a], “Do you really know that Baalis king of the Ammonites has sent Ishmael son of Nethaniah to strike you down?” But Gedaliah son of Ahikam did not believe them.
translation:
  language: ru
  text: 'И они сказали ему: «Знаешь ли ты наверняка[a], что Ваалис, царь аммонитян, послал Исмаила, сына Нафании, убить тебя[b]?» Но Гедалия, сын Ахикама, не поверил им.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Действительно ли ты знаешь…?» В еврейском тексте абсолютный инфинитив употреблён вместе с личной формой глагола для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поразить тебя в жизнь [душу]» — еврейское выражение со значением «убить, лишить жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדֹעַ תֵּדַע
  choice: Знаешь ли ты наверняка
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает значение ידע. Наречие «наверняка» естественно передаёт это усиление, не добавляя оттенка недоверчивого ожидания ответа, который могло бы внести «разве».
- source_word: בַּעֲלִיס
  choice: Ваалис
  rationale: Передача личного имени русской библейской транслитерацией.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: царь аммонитян
  rationale: Естественная русская передача конструкции «царь сынов Аммона», обозначающей аммонитский народ.
- source_word: שָׁלַח
  choice: послал
  rationale: Простое прошедшее время естественно передаёт завершённое действие, сохраняющее значение для текущей ситуации.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Исмаила, сына Нафании
  rationale: Традиционная русская передача имён и ясное обозначение родства с помощью приложения.
- source_word: לְהַכֹּתְךָ נָפֶשׁ
  choice: убить тебя
  rationale: Еврейское выражение буквально связано с поражением чьей-либо жизни, но в данном контексте является идиомой убийства. «Убить тебя» точно и естественно передаёт смысл угрозы.
- source_word: הֶאֱמִין לָהֶם
  choice: не поверил им
  rationale: Здесь форма глагола אמן означает признать сообщение достоверным; «не поверил им» точнее контекстуального «не доверился им».
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם
  choice: Гедалия, сын Ахикама
  rationale: Передача имён и сыновнего обозначения в форме, естественной для современного русского библейского текста.
