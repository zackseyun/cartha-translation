  text: וַ/יָּשֻׁ֣בוּ כָל הַ/יְּהוּדִ֗ים מִ/כָּל הַ/מְּקֹמוֹת֙ אֲשֶׁ֣ר נִדְּחוּ שָׁ֔ם וַ/יָּבֹ֧אוּ אֶֽרֶץ יְהוּדָ֛ה אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑תָ/ה וַ/יַּאַסְפ֛וּ יַ֥יִן וָ/קַ֖יִץ הַרְבֵּ֥ה מְאֹֽד־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/012.yaml
  text: Then all the Judeans returned from all the places where they had been driven[a], and they came to the land of Judah, to Gedaliah at Mizpah[c][b], and gathered a very great abundance of wine and summer fruit.
translation:
  language: ru
  text: Тогда все иудеи вернулись из всех мест, куда их изгнали[a], и пришли в землю Иудеи, к Гедалии в Мицпу, и собрали очень много вина и летних плодов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «куда их вытеснили»; еврейский глагол может также подразумевать рассеяние.'
    reason: lexical_alternative
  - marker: b
    text: «Летние плоды» — сезонные плоды, созревавшие летом или ко времени позднего сбора урожая.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: вернулись
  rationale: Глагол שוב в данной повествовательной последовательности обозначает физическое возвращение.
- source_word: כָל הַיְּהוּדִים
  choice: все иудеи
  rationale: В данном историческом контексте речь идёт о людях Иудеи; «иудеи» естественно передаёт как территориально-этнический смысл, так и связь с землёй Иудеи.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר נִדְּחוּ שָׁם
  choice: из всех мест, куда их изгнали
  rationale: Форма Niphal глагола נדח выражает насильственное удаление или изгнание; русское «куда их изгнали» ясно сохраняет пассивный смысл еврейской формы.
- source_word: וַיָּבֹאוּ אֶרֶץ יְהוּדָה
  choice: и пришли в землю Иудеи
  rationale: Передаёт направленное движение на территорию Иудеи естественным русским оборотом.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּתָה
  choice: к Гедалии в Мицпу
  rationale: Направительное окончание при названии Мицпы показывает место, куда они пришли к Гедалии.
- source_word: וַיַּאַסְפוּ
  choice: собрали
  rationale: Нейтрально передаёт אסף и не сужает значение до собственно сбора урожая.
- source_word: יַיִן וָקַיִץ
  choice: вина и летних плодов
  rationale: יין обычно означает вино, а קיץ — сезонные плоды летнего времени или позднего сбора.
- source_word: הַרְבֵּה מְאֹד
  choice: очень много
  rationale: Естественно и точно передаёт усиленное указание на большое количество.
