  text: וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖ה הַ/מִּצְפָּ֑תָ/ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡הוּ וְ/יוֹחָנָ֣ן וְ/יוֹנָתָ֣ן בְּנֵֽי קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת וּ/בְנֵ֣י עופי הַ/נְּטֹפָתִ֗י וִֽ/יזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/008.yaml
  text: Then Ishmael son of Nethaniah[a], and Johanan and Jonathan the sons of Kareah, and Seraiah son of Tanhumeth, and the sons of Ephai the Netophathite[b], and Jezaniah son of the Maacathite—they and their men—came to Gedaliah at Mizpah.
translation:
  language: ru
  text: Тогда пришли к Гедалии в Мицпу Измаил, сын Нефании, Иоханан и Ионафан, сыновья Карея, Сераия, сын Танхумета, сыновья Ефая[a] из Нетофы и Иезания[b], сын маахатянина, — они и их люди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское имя עופי допускает и другую передачу, например «Офай»; его точное чтение и транслитерация не вполне ясны.
    reason: lexical_alternative
  - marker: b
    text: Имя можно также передать как «Иезаниягу»; возможно, оно связано с формой имени «Яазания».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: тогда пришли
  rationale: Форма wayyiqtol продолжает повествование и обозначает завершённое действие; «пришли» естественно передаёт движение к Гедалии.
- source_word: אֶל גְּדַלְיָה הַמִּצְפָּתָה
  choice: к Гедалии в Мицпу
  rationale: Направительный суффикс в הַמִּצְפָּתָה указывает на движение в Мицпу; русский порядок слов ясно связывает прибытие и с Гедалией, и с местом.
- source_word: בְּנֵי קָרֵחַ
  choice: сыновья Карея
  rationale: Множественное сопряжённое сочетание относится к обоим предшествующим именам — Иоханану и Ионафану.
- source_word: בְנֵי עופי
  choice: сыновья Ефая
  rationale: Передаёт множественное число בְנֵי и традиционно распознаваемую форму личного имени; неуверенность в огласовке/передаче имени отмечена в сноске.
- source_word: הַנְּטֹפָתִי
  choice: из Нетофы
  rationale: Современная русская географическая конструкция естественно передаёт обозначение происхождения, не вводя неясного этнонима.
- source_word: וִיזַנְיָהוּ בֶּן הַמַּעֲכָתִי
  choice: Иезания, сын маахатянина
  rationale: Сохраняется личное имя и буквальная патронимическая связь; артикль при הַמַּעֲכָתִי показывает, что отец назван по происхождению, а его личное имя не приводится.
- source_word: הֵמָּה וְאַנְשֵׁיהֶם
  choice: они и их люди
  rationale: Сохраняет эмфатическое подведение итога списка и обозначение сопровождавших их людей.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Длинный именной перечень сохранён, но пунктуационно упорядочен; географическое происхождение передано понятной конструкцией «из Нетофы». Все сноски относятся к действительно спорным формам имён.
