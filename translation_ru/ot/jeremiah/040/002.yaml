  text: Then the captain of the guard took Jeremiah and said to him[b][a], “Yahweh your God spoke this disaster against this place.”
translation:
  language: ru
  text: 'Тогда начальник стражи[a] взял Иеремию и сказал ему: «Яхве, твой Бог, сказал об этом бедствии[b] против этого места».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально титул означает «начальник палачей»; здесь это вавилонский чиновник, командовавший стражей.
    reason: cultural_note
  - marker: b
    text: 'Или: «это несчастье». Еврейское רָעָה в зависимости от контекста может означать зло, вред, несчастье или бедствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Устойчивый вавилонский придворно-военный титул; буквальное значение связано с палачами, но в данном контексте естественно передаётся как «начальник стражи».
- source_word: וַיִּקַּח
  choice: взял
  rationale: Сохраняет широкое основное значение глагола לקח и не уточняет без достаточных оснований, взял ли он Иеремию под стражу, за руку или привёл к себе.
- source_word: לְיִרְמְיָהוּ
  choice: Иеремию
  rationale: Стандартная русская форма библейского личного имени в требуемом винительном падеже.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет прямое обращение к Иеремии и местоименный суффикс второго лица единственного числа.
- source_word: דִּבֶּר
  choice: изрёк
  rationale: В контексте ранее возвещённого суда «изрёк» естественно передаёт торжественное объявление, оставаясь близким к значению «сказал/возвестил».
- source_word: הָרָעָה הַזֹּאת
  choice: это бедствие
  rationale: В контексте речь идёт о постигшем город губительном суде, а не о нравственном зле; «бедствие» сохраняет отрицательный и судебный смысл.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: против этого места
  rationale: Предлог אֶל при речи о суде выражает направленность возвещённого бедствия; «против» сохраняет эту судебно-враждебную направленность.
theological_decisions:
- issue: Значение רָעָה в высказывании о Божьем суде
  choice: это бедствие
  alternative: это зло; это несчастье
  rationale: Контекст указывает на губительное бедствие, возвещённое Иерусалиму. Такой перевод не приписывает Богу нравственного зла, но и не смягчает утверждение о том, что суд был изречён Яхве.
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, непосредственно присутствующее в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Изрёк» подчёркивает характер объявленного суда, не делая фразу архаичной в целом. Все примечания отмечены в основном тексте.
