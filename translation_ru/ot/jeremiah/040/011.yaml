  text: וְ/גַ֣ם כָּֽל הַ/יְּהוּדִ֡ים אֲשֶׁר בְּ/מוֹאָ֣ב וּ/בִ/בְנֵֽי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וַ/אֲשֶׁ֤ר בְּ/כָל הָֽ/אֲרָצוֹת֙ שָֽׁמְע֔וּ כִּֽי נָתַ֧ן מֶֽלֶךְ בָּבֶ֛ל שְׁאֵרִ֖ית לִֽ/יהוּדָ֑ה וְ/כִי֙ הִפְקִ֣יד עֲלֵי/הֶ֔ם אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֥ם בֶּן שָׁפָֽן־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/011.yaml
  text: Also[a], all the Judeans who were in Moab, among the Ammonites, in Edom, and in all the other lands heard that the king of Babylon had left a remnant for Judah and had appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: ru
  text: Также все иудеи, находившиеся в Моаве, среди аммонитян, в Эдоме и во всех землях, услышали, что царь Вавилона оставил Иудее остаток[a] и поставил над ними Гедалию, сына Ахикама, сына Шафана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уцелевших». Еврейское слово может в общем смысле обозначать тех, кто остался в живых после бедствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: И
  rationale: В данном повествовательном контексте сочетание продолжает рассказ и присоединяет ещё одну группу; русское «И» естественно передаёт эту связь, тогда как «И также» звучало бы тяжеловесно.
- source_word: כָּל הַיְּהוּדִים
  choice: все иудеи
  rationale: «Иудеи» здесь обозначает людей, связанных с Иудеей, и лучше соответствует историко-территориальному контексту, чем более позднее и широкое обозначение «евреи».
- source_word: אֲשֶׁר בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדוֹם
  choice: находившиеся в Моаве, среди аммонитян, в Эдоме
  rationale: Географические выражения переданы естественно по-русски; בְּנֵי עַמּוֹן обозначает народ аммонитян, поэтому «среди аммонитян» сохраняет смысл исходного текста без буквализма «среди сынов Аммона».
- source_word: וַאֲשֶׁר בְּכָל הָאֲרָצוֹת
  choice: и во всех других землях
  rationale: «Других» естественно показывает расширение перечня за пределы уже названных мест, не меняя его смысла; «землях» соответствует древнему контексту лучше, чем современное «странах».
- source_word: שָׁמְעוּ
  choice: услышали
  rationale: Прямое и естественное обозначение получения известия, после которого следует изъяснительное придаточное.
- source_word: כִּי נָתַן מֶלֶךְ בָּבֶל שְׁאֵרִית לִיהוּדָה
  choice: что царь Вавилона оставил остаток для Иудеи
  rationale: Хотя נָתַן буквально означает «дал», здесь по контексту оно указывает на оставление в живых части народа. «Остаток» сохраняет ключевую лексику пророческой традиции и её возможный богословский оттенок, а «для Иудеи» формально сохраняет неоднозначную конструкцию לִיהוּדָה.
- source_word: וְכִי הִפְקִיד עֲלֵיהֶם
  choice: и поставил над ними
  rationale: Глагол в породе hифиль означает назначение лица, наделённого властью; «поставил над ними» ясно и естественно передаёт административное подчинение.
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: Гедалию, сына Ахикама, сына Шафана
  rationale: Имена транслитерированы в принятой русской библейской форме, а родословная цепочка сохранена полностью и ясно.
theological_decisions:
- issue: Передача שְׁאֵרִית
  choice: остаток
  alternative: уцелевших
  rationale: Слово может обозначать людей, оставшихся в живых после бедствия. «Остаток» сохраняет каноническую и пророческую лексическую связь, но сам текст не требует развивать её как отдельную богословскую тему; буквальный исторический смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным и доступным; исторические этнонимы и традиционные формы имён сохранены. Формулировка «остаток для Иудеи» удерживает семантическую и богословскую напряжённость оригинала, не снимая её толкованием.
