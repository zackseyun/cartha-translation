revisions:
- from: Когда все военачальники, находившиеся за городом[a], и их люди услышали, что царь Вавилона поставил Гедалию, сына Ахикама, правителем страны и вверил ему мужчин, женщин, детей и часть беднейшего населения страны[b] — тех, кого не увели в плен в Вавилон[c], —
  to: Когда все военачальники, находившиеся в открытой местности[a], и их люди услышали, что царь Вавилона поставил Гедалию, сына Ахикама, правителем страны и вверил ему мужчин, женщин, детей и некоторых из беднейших жителей страны[b] — тех, кого не увели в плен в Вавилон[c], —
