  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים אֲשֶׁ֣ר בַּ/שָּׂדֶ֗ה הֵ֚מָּה וְ/אַנְשֵׁי/הֶ֔ם כִּֽי הִפְקִ֧יד מֶֽלֶךְ בָּבֶ֛ל אֶת גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם בָּ/אָ֑רֶץ וְ/כִ֣י הִפְקִ֣יד אִתּ֗/וֹ אֲנָשִׁ֤ים וְ/נָשִׁים֙ וָ/טָ֔ף וּ/מִ/דַּלַּ֣ת הָ/אָ֔רֶץ מֵ/אֲשֶׁ֥ר לֹֽא הָגְל֖וּ בָּבֶֽלָ/ה־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/007.yaml
  text: When all the commanders of the forces who were in the open country[a], they and their men, heard that the king of Babylon had appointed Gedaliah son of Ahikam over the land, and that he had entrusted to him men, women, children, and some of the poorest of the land, from those who had not been exiled to Babylon[c][b],
translation:
  language: ru
  text: Когда все военачальники, находившиеся в открытой местности[a], и их люди услышали, что царь Вавилона поставил Гедалию, сына Ахикама, правителем страны и вверил ему мужчин, женщин, детей и некоторых из беднейших жителей страны[b] — тех, кого не увели в плен в Вавилон[c], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в поле»; возможно также: «в сельской местности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «некоторых из бедняков страны».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «кого не переселили в Вавилон».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: военачальники
  rationale: Сочетание обозначает руководителей военных отрядов; «военачальники» естественно и без неоправданного уточнения передаёт их положение.
- source_word: בַּשָּׂדֶה
  choice: за городом
  rationale: Буквально «в поле»; в данном повествовательном контексте речь идёт о местности вне городского центра и его контроля.
- source_word: וְאַנְשֵׁיהֶם
  choice: и их люди
  rationale: Буквальное и естественное обозначение людей, находившихся под началом военачальников; военный контекст сохраняется.
- source_word: הִפְקִיד ... בָּאָרֶץ
  choice: поставил ... правителем страны
  rationale: Первое употребление глагола означает официальное назначение с властью над страной; дополнение «правителем» ясно выражает подразумеваемую функцию.
- source_word: הִפְקִיד אִתּוֹ
  choice: вверил ему
  rationale: Во втором употреблении тот же глагол относится к передаче людей под ответственность Гедалии, поэтому уместна иная русская передача.
- source_word: אֲנָשִׁים וְנָשִׁים וָטָף
  choice: мужчин, женщин, детей
  rationale: טָף здесь обозначает малолетних детей; современное «детей» ясно и естественно.
- source_word: מִדַּלַּת הָאָרֶץ
  choice: часть беднейшего населения страны
  rationale: Передаёт как партитивное מִן, так и социально-экономическое значение דַּלַּת; «население» естественнее буквального «бедняки земли».
- source_word: מֵאֲשֶׁר לֹא הָגְלוּ בָּבֶלָה
  choice: тех, кого не увели в плен в Вавилон
  rationale: Сохраняет активную форму с неопределённым субъектом и исторический смысл насильственного переселения.
- source_word: וַיִּשְׁמְעוּ
  choice: Когда ... услышали
  rationale: Форма продвигает повествование, а незавершённая синтаксическая конструкция продолжается в следующем стихе; «когда» естественно это показывает.
