base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/005.yaml
  text: But since he still had not gone back[a], he said, “Go back to Gedaliah son of Ahikam, son of Shaphan, whom the king of Babylon has appointed over the cities of Judah, and live with him among the people[c][b]; or go wherever it seems right in your eyes to go.” Then the captain of the guard gave him provisions and a gift and sent him away.
translation:
  language: ru
  text: 'Но он всё ещё не вернулся.[a] Тогда начальник стражи сказал ему: «Возвратись к Гедалии, сыну Ахикама, внуку Шафана, которого царь Вавилона поставил над городами Иудеи, и живи с ним среди народа; или иди туда, куда считаешь правильным». Затем начальник стражи дал ему припасы[b] и подарок[c] и отпустил его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало стиха на еврейском синтаксически неясно. Возможно также: «Пока он ещё не возвратился, [он сказал:] „Возвратись к Гедалии…“»'
    reason: alternative_reading
  - marker: b
    text: 'Или: «паёк».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «дар», «выдачу» или «долю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹדֶנּוּ לֹא יָשׁוּב
  choice: Но Иеремия всё ещё не возвращался
  rationale: Начало стиха синтаксически затруднено и эллиптично. Имя Иеремии уточняет подразумеваемого участника из контекста, а несовершенный вид передаёт ещё не совершившееся возвращение; альтернативное понимание отмечено в сноске.
- source_word: וְשֻׁבָה
  choice: Возвратись
  rationale: Повелительная форма שוב означает возвращение; «возвратись» естественно и сохраняет связь с предшествующим глаголом.
- source_word: אֶל גְּדַלְיָה בֶן אֲחִיקָם בֶּן שָׁפָן
  choice: к Гедалии, сыну Ахикама, внуку Шафана
  rationale: Русское «внуку» ясно и естественно передаёт последовательность родства «сын Ахикама, сына Шафана», не изменяя генеалогии.
- source_word: אֲשֶׁר הִפְקִיד מֶלֶךְ בָּבֶל בְּעָרֵי יְהוּדָה
  choice: которого царь Вавилона поставил над городами Иудеи
  rationale: Hiphil הפקיד здесь обозначает назначение на административную должность; «над городами» передаёт власть, а не только местонахождение.
- source_word: וְשֵׁב אִתּוֹ בְּתוֹךְ הָעָם
  choice: и живи с ним среди народа
  rationale: ישב в данном контексте означает постоянное пребывание или жизнь, а не буквальное сидение.
- source_word: אוֹ אֶל כָּל הַיָּשָׁר בְּעֵינֶיךָ לָלֶכֶת לֵךְ
  choice: или иди туда, куда считаешь правильным
  rationale: Еврейская идиома «правильно в твоих глазах» естественно передана по-русски без изменения смысла личного выбора.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Устойчивый контекстуальный перевод вавилонского военного титула; буквальное «начальник палачей» могло бы ошибочно сузить функции должностного лица.
- source_word: אֲרֻחָה
  choice: припасы
  rationale: Слово обозначает пищевое обеспечение или паёк; «припасы» хорошо соответствует ситуации отправления в путь.
- source_word: וּמַשְׂאֵת
  choice: подарок
  rationale: Слово может обозначать дар, долю или выдачу; рядом с дорожными припасами «подарок» наиболее естественно передаёт дополнительное пожалование, при сохранении альтернатив в сноске.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: и отпустил его
  rationale: Глагол означает отослать или отпустить; в контексте освобождения «отпустил» звучит естественно и точно.
