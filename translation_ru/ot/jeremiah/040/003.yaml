  text: וַ/יָּבֵ֥א וַ/יַּ֛עַשׂ יְהוָ֖ה כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּֽי חֲטָאתֶ֤ם לַֽ/יהוָה֙ וְ/לֹֽא שְׁמַעְתֶּ֣ם בְּ/קוֹל֔/וֹ וְ/הָיָ֥ה לָ/כֶ֖ם דבר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/003.yaml
  text: And Yahweh has brought it about and has done just as he said[a], because you sinned against Yahweh and did not listen to his voice[b]; therefore this thing has happened to you.
translation:
  language: ru
  text: И Яхве осуществил это и сделал так, как сказал, потому что вы согрешили против Яхве и не послушали его голоса[a]. Поэтому это случилось с вами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не повиновались ему». Еврейский оборот «слушать чей-либо голос» часто подразумевает повиновение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «это бедствие постигло вас». Еврейское выражение «это дело (событие)» может здесь конкретно обозначать только что описанное бедствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: навёл бедствие
  rationale: Глагол בוא в каузативной форме означает, что Яхве навёл уже описанное бедствие. В еврейском объект подразумевается контекстом; в русском его уместно назвать для ясности.
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Сохраняет простое значение עשה и параллелизм с предшествующим глаголом, указывая на исполнение ранее сказанного.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: так, как говорил
  rationale: Естественно по-русски выражает точное исполнение прежде произнесённого слова.
- source_word: כִּי
  choice: потому что
  rationale: В данном контексте союз вводит причину суда.
- source_word: חֲטָאתֶם לַיהוָה
  choice: вы согрешили против Яхве
  rationale: Русское управление «согрешить против» ясно передаёт направленность проступка против Яхве.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלוֹ
  choice: и не послушали его голоса
  rationale: Сохраняет образ слышания голоса и одновременно естественно передаёт подразумеваемое неповиновение.
- source_word: וְהָיָה לָכֶם דבר הַזֶּה
  choice: поэтому вот что произошло с вами
  rationale: Передаёт результативную связь и сохраняет широкое значение דבר как «то, что произошло», не сужая его безусловно до бедствия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет это различие.
- issue: Степень явности повиновения в שׁמע בקולו
  choice: не послушали его голоса
  alternative: не повиновались ему
  rationale: Выбранный вариант сохраняет еврейский образ и присущую обороту связь между слушанием и повиновением, не сводя его только к одному оттенку.
- issue: Конкретизация דבר הזה
  choice: вот что произошло с вами
  alternative: это бедствие постигло вас
  rationale: Бедствие явно подразумевается контекстом, однако широкое слово דבר само по себе допускает более общее обозначение случившегося; эта неоднозначность сохранена в основном тексте и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической структурой. Начальное «И» сохраняет повествовательную связь с предыдущим стихом. Местоимение в выражении «его голоса» написано со строчной буквы согласно обычной современной издательской норме.
