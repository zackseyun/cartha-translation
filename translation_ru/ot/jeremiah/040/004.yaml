base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/004.yaml
  text: And now, look, today I have freed you from the chains on your hands. If you want to come with me to Babylon, come, and I will look after you[a]. But if you do not want to come with me to Babylon, do not. Look, the whole land is before you; go wherever seems good and right to you[b][c].
translation:
  language: ru
  text: 'А теперь смотри: сегодня я освободил тебя от оков на твоих руках. Если хочешь пойти со мной в Вавилон — иди, и я буду заботиться о тебе[a]. Но если не хочешь идти со мной в Вавилон — не иди. Смотри, вся земля перед тобой; иди туда, куда сочтёшь хорошим и правильным пойти[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обращу свой глаз на тебя» — оборот, выражающий здесь благосклонную заботу или защиту.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «если хорошо/плохо в твоих глазах» и «к хорошему и правильному в твоих глазах»; эти обороты обозначают желание и личную оценку.'
    reason: lexical_alternative
  - marker: c
    text: 'В конце древнееврейского текста буквально: «чтобы идти туда — иди»; эта конструкция подчёркивает разрешение свободно выбрать, куда идти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִתַּחְתִּיךָ
  choice: я освободил тебя
  rationale: Глагол буквально означает «открыть», но при указании на оковы выражает освобождение от уз; по-русски естественно «освободил».
- source_word: הָאזִקִּים אֲשֶׁר עַל־יָדֶךָ
  choice: оков на твоих руках
  rationale: הָאזִקִּים обозначает узы или оковы заключённого, а יָד может означать руку без точного уточнения её части; перевод сохраняет эту широту.
- source_word: אִם־טוֹב בְּעֵינֶיךָ / וְאִם־רַע בְּעֵינֶיךָ
  choice: если хочешь / если не хочешь
  rationale: Повторяющийся древнееврейский оборот буквально говорит «хорошо/плохо в твоих глазах», а здесь выражает личное желание и выбор.
- source_word: וְאָשִׂים אֶת־עֵינִי עָלֶיךָ
  choice: я буду заботиться о тебе
  rationale: Буквально «обращу/положу свой глаз на тебя»; в данном контексте это благосклонный надзор, забота и защита, а не угрожающее наблюдение.
- source_word: חֲדָל
  choice: не иди
  rationale: Повелительная форма означает воздержаться от названного действия; подразумеваемое «идти со мной в Вавилон» естественно восполнено по-русски.
- source_word: כָּל־הָאָרֶץ לְפָנֶיךָ
  choice: вся земля перед тобой
  rationale: Прямой и естественный русский оборот, передающий свободу передвижения и выбора.
- source_word: אֶל־טוֹב וְאֶל־הַיָּשָׁר בְּעֵינֶיךָ
  choice: туда, куда тебе кажется хорошим и правильным
  rationale: Сохраняются оба оценочных слова — «хорошее» и «правильное» — и их связь с личным решением адресата.
- source_word: לָלֶכֶת שָׁמָּה לֵךְ
  choice: иди туда
  rationale: Сочетание инфинитива с императивом подчёркивает разрешение идти в выбранное место; по-русски это естественно выражает императив с указанием направления.
