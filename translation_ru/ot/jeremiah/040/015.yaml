revisions:
- from: 'И тогда Иоханан, сын Кареаха, тайно сказал Годолии в Мицпе: «Позволь мне пойти и убить Измаила, сына Нафании, так что никто не узнает. Зачем ему лишать тебя жизни? Ведь тогда все иудеи, собравшиеся к тебе, рассеются, и остаток Иудеи погибнет».'
  to: 'И тогда Иоханан, сын Карея, тайно сказал Годолии в Мицпе: «Позволь мне пойти и убить Измаила, сына Нафании, и никто не узнает. Зачем ему лишать тебя жизни? Тогда рассеются все иудеи, собравшиеся к тебе, и погибнет остаток Иуды».'
  rationale: 'Исправлены русское оформление имени Карея и обозначение уцелевшей общины: «остаток Иуды» не смешивает народ с территорией. Основные лексические решения сохранены: «тайно», «Позволь мне пойти», «убить», «никто не узнает», «лишать тебя жизни», «рассеются». Смысл последствий сохранён как предупреждение Иоханана, а не как утверждение о намерении Измаила.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:14:31Z'
