source:
  edition: WLC
  text: וְ/יוֹחָנָ֣ן בֶּן קָרֵ֡חַ אָמַ֣ר אֶל גְּדַלְיָהוּ֩ בַ/סֵּ֨תֶר בַּ/מִּצְפָּ֜ה לֵ/אמֹ֗ר אֵ֤לְכָה נָּא֙ וְ/אַכֶּה֙ אֶת יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וְ/אִ֖ישׁ לֹ֣א יֵדָ֑ע לָ֧/מָּה יַכֶּ֣/כָּה נֶּ֗פֶשׁ וְ/נָפֹ֨צוּ֙ כָּל יְהוּדָ֔ה הַ/נִּקְבָּצִ֣ים אֵלֶ֔י/ךָ וְ/אָבְדָ֖ה שְׁאֵרִ֥ית יְהוּדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/015.yaml
  text: Then Johanan son of Kareah said privately to Gedaliah at Mizpah[a], saying, “Please let me go and strike down Ishmael son of Nethaniah, and no one will know. Why should he take your life, so that all the Judahites who are gathered to you would be scattered[c][b], and the remnant of Judah would perish?”
translation:
  language: ru
  text: 'И тогда Иоханан, сын Карея, тайно сказал Годолии в Мицпе: «Позволь мне пойти и убить Измаила, сына Нафании, и никто не узнает. Зачем ему лишать тебя жизни? Тогда рассеются все иудеи, собравшиеся к тебе, и погибнет остаток Иуды».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַסֵּתֶר
  choice: тайно
  rationale: Сочетание с предлогом обозначает речь втайне, без посторонних; наречие естественно передаёт обстоятельственный смысл.
- source_word: בַמִּצְפָּה
  choice: в Мицпе
  rationale: Название места передано традиционной русской транслитерацией; предлог «в» естественен при названии населённого пункта.
- source_word: אֵלְכָה נָּא
  choice: Позволь мне пойти
  rationale: Когортатив с נָא выражает почтительную, но настойчивую просьбу-предложение.
- source_word: וְאַכֶּה
  choice: и убить
  rationale: Хотя נכה буквально означает «поразить», в данном контексте речь прямо идёт о тайном убийстве; русский глагол ясно передаёт предполагаемый результат.
- source_word: וְאִישׁ לֹא יֵדָע
  choice: так что никто не узнает
  rationale: אִישׁ употреблено обобщённо; «никто» — естественный и точный современный русский эквивалент. Союз передаёт предполагаемое сопутствующее следствие.
- source_word: לָמָּה יַכֶּכָּה נֶפֶשׁ
  choice: Зачем ему лишать тебя жизни?
  rationale: Сжатый еврейский оборот буквально связывает удар с жизнью; идиома «лишать жизни» ясно передаёт угрозу убийства, не меняя её направленности.
- source_word: וְנָפֹצוּ
  choice: рассеются
  rationale: Форма обозначает ожидаемое рассеяние как последствие гибели Годолии.
- source_word: כָּל יְהוּדָה
  choice: все иудеи
  rationale: Здесь Иуда обозначает народ, а не территорию; «иудеи» понятно передаёт этнополитическую общность данного исторического периода.
- source_word: הַנִּקְבָּצִים אֵלֶיךָ
  choice: собравшиеся к тебе
  rationale: Причастный оборот сохраняет состояние уже собравшихся людей и направительное значение אֵלֶיךָ.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: остаток Иудеи
  rationale: «Остаток» — точный и привычный библейский эквивалент שְׁאֵרִית, обозначающий уцелевшую часть народа.
- source_word: וְאָבְדָה
  choice: погибнет
  rationale: Глагол передаёт окончательную гибель уцелевшей общины и естественно сочетается с подлежащим «остаток».
theological_decisions:
- issue: Связь между убийством Годолии и рассеянием народа
  choice: «Ведь тогда… рассеются»
  alternative: «чтобы… рассеялись»
  rationale: Союзная последовательность понимается как предвидимое следствие, а не как цель Измаила; это сохраняет аргумент Иоханана без приписывания убийце явно сформулированного намерения уничтожить общину.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Имена переданы в привычной русской библейской форме. Формульное לֵאמֹר не воспроизведено отдельным «сказав», поскольку после глагола речи и двоеточия это было бы тяжеловесно и избыточно.
