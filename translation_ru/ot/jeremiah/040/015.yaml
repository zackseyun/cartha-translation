    rationale: 'Форма выглядит как механически перенесённое еврейское окончание и не соответствует нормальному русскому оформлению имени в конструкции «сын ...». Безопасная русская форма: «сын Карея».'
  - severity: medium
    issue: «остаток Иудеи»
    rationale: «Иудея» в русском прежде всего называет землю; исходный контекст и параллель «все ... собравшиеся к тебе» указывают на оставшуюся общину. «Остаток Иуды» сохраняет традиционный библейский термин и референт.
  - severity: low
