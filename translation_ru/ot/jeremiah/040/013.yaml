base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/013.yaml
  text: And Johanan son of Kareah[a], and all the commanders of the forces who were in the open country, came to Gedaliah at Mizpah.
translation:
  language: ru
  text: Иоханан, сын Кареаха, и все военачальники отрядов, находившиеся в сельской местности[a], пришли к Гедалии в Мицпу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в поле». Древнееврейское выражение может обозначать поле или, шире, открытую либо сельскую местность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֽוֹחָנָן
  choice: И Иоханан
  rationale: Союз וְ сохранён как «и», чтобы передать непрерывность повествования без уточнения временного оттенка; имя передано транслитерацией с древнееврейского.
- source_word: בֶּן קָרֵחַ
  choice: сын Кареаха
  rationale: Обычная древнееврейская патронимическая конструкция; имя קָרֵחַ передано как «Кареах» и поставлено в родительный падеж.
- source_word: וְ/כָל שָׂרֵי הַ/חֲיָלִים
  choice: и все военачальники отрядов
  rationale: שָׂרֵי обозначает военных начальников, а חֲיָלִים в данном контексте — находившиеся под их началом вооружённые силы или отряды. Формулировка естественна для современного русского повествования.
- source_word: אֲשֶׁר בַּ/שָּׂדֶה
  choice: находившиеся в сельской местности
  rationale: בַּשָּׂדֶה буквально связано с полем, но также может обозначать открытую местность или территорию вне населённого пункта. Выбран широкий географический смысл, а буквальный вариант отмечен в сноске.
- source_word: בָּ֥אוּ אֶל גְּדַלְיָהוּ
  choice: пришли к Гедалии
  rationale: בוא передаёт прибытие, а אֶל указывает на лицо, к которому направились; «пришли к» естественно отражает это движение.
- source_word: הַ/מִּצְפָּתָ/ה
  choice: в Мицпу
  rationale: Направительное окончание -ָה указывает на движение в сторону Мицпы. Русский винительный падеж после «в» ясно передаёт пункт назначения.
theological_decisions: []
