base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/006.yaml
  text: So Jeremiah went to Gedaliah son of Ahikam at Mizpah[a], and he lived with him among the people who were left in the land.
translation:
  language: ru
  text: Иеремия пришёл к Гедалии, сыну Ахикама, в Мицпе и жил вместе с ним среди людей, оставшихся в стране.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставленных в стране». Еврейская форма допускает смысл как тех, кто остался, так и тех, кого оставили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: В повествовательном контексте בוא обозначает прибытие к Гедалии; русское «пришёл» естественно передаёт направленность к указанному лицу и месту.
- source_word: גְּדַלְיָה בֶן אֲחִיקָם
  choice: к Гедалии, сыну Ахикама
  rationale: Сохранена обычная для современного русского языка передача еврейских имён и патронимическая конструкция «сын Ахикама».
- source_word: הַמִּצְפָּתָה
  choice: в Мицпу
  rationale: Направительный суффикс у названия места указывает на движение в Мицпу. Русская конструкция «пришёл к Гедалии… в Мицпу» сохраняет это значение без искусственной перестройки.
- source_word: וַיֵּשֶׁב
  choice: жил
  rationale: В данном контексте ישב означает проживание или пребывание, а не буквальное сидение. «Жил» не уточняет без основания, было ли пребывание временным или постоянным.
- source_word: אִתּוֹ
  choice: вместе с ним
  rationale: Комитативное значение передано ясно и естественно; местоимение относится к Гедалии.
- source_word: בְּתוֹךְ הָעָם
  choice: среди людей
  rationale: Буквальное «среди народа» возможно, но сочетание с последующим причастием во множественном числе по-русски естественнее передать как «среди людей», сохраняя собирательный смысл עָם.
- source_word: הַנִּשְׁאָרִים
  choice: оставшихся
  rationale: Причастие нифаля от שׁאר описывает тех, кто остался или был оставлен. «Оставшихся» сохраняет описательный характер выражения и не превращает его в богословский термин «остаток».
- source_word: בָּאָרֶץ
  choice: в стране
  rationale: «В стране» естественно передаёт הָאָרֶץ в данном политико-географическом контексте, не добавляя прямо не названное в стихе уточнение «Иудее».
theological_decisions:
- issue: Возможное богословское переосмысление הַנִּשְׁאָרִים как технического термина «остаток»
  choice: людей, оставшихся в стране
  alternative: остатка народа в стране
  rationale: В еврейском тексте употреблено причастное описание, а не существительное с однозначно выраженным техническим значением. Описательный перевод сохраняет смысл и не привносит дополнительной богословской нагрузки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным и естественным; архаизмы и конфессионально нагруженное слово «остаток» не используются.
