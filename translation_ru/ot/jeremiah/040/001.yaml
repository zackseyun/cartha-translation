base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/001.yaml
  text: 'The word that came to Jeremiah from Yahweh after Nebuzaradan[a], the captain of the guard, had sent him away from Ramah, when he had taken him while he was bound in chains among all the exiles of Jerusalem and Judah who were being exiled to Babylon:'
translation:
  language: ru
  text: 'Слово, пришедшее к Иеремии от Яхве после того, как Навузардан, начальник стражи[a], отпустил его из Рамы, взяв его скованным цепями среди всех изгнанников из Иерусалима и Иудеи, которых уводили в Вавилон:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальник палачей». Еврейское название должности буквально связано с теми, кто убивает или совершает казни; вероятно, так назывался начальник царской стражи, отвечавший также за казни.'
    reason: 'Лексическая альтернатива: буквальный смысл титула רַב טַבָּחִים отличается от его вероятного придворно-военного значения.'
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: Слово, которое было к Иеремии
  rationale: Сохраняет характерную пророческую формулу и формальную образность еврейского текста; «слово» здесь означает пришедшее от Бога откровение.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: Передаёт источник слова и воспроизводит личное имя יהוה, не заменяя его титулом.
- source_word: אַחַר שַׁלַּח אֹתוֹ
  choice: после того, как … отпустил его
  rationale: В данном повествовательном контексте שׁלח означает освобождение или дозволение уйти; «отпустил» естественно по-русски и не подразумевает поручения.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Передаёт функцию высокого вавилонского придворного чиновника понятным современным выражением; буквальный оттенок должности отмечен в сноске.
- source_word: מִן הָרָמָה
  choice: из Рамы
  rationale: Предлог מן обозначает исходный пункт, а название места передано принятой русской формой.
- source_word: בְּקַחְתּוֹ אֹתוֹ
  choice: Навузардан забрал его
  rationale: ב с инфинитивной конструкцией вводит сопутствующее или временное обстоятельство. Повтор имени устраняет неизбежную для русского двусмысленность местоимений, а «забрал» передаёт взятие Иеремии под контроль.
- source_word: וְהוּא אָסוּר בָּאזִקִּים
  choice: когда тот был скован цепями
  rationale: Передаёт состояние Иеремии в момент, когда его взяли; «скован цепями» звучит естественно и сохраняет конкретный образ оков.
- source_word: בְּתוֹךְ כָּל גָּלוּת יְרוּשָׁלִַם וִיהוּדָה
  choice: среди всех пленников из Иерусалима и Иудеи
  rationale: גָּלוּת употреблено собирательно о депортируемых людях. «Пленники» ясно передаёт их положение, а «из» естественно указывает происхождение.
- source_word: הַמֻּגְלִים בָּבֶלָה
  choice: которых уводили в Вавилон
  rationale: Причастие имеет пассивно-продолженное значение и описывает происходившую депортацию; «уводили» сохраняет принудительный характер происходящего.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, то есть личное имя Бога. Форма «Яхве» прямо передаёт это имя и не подменяет его титулом.
- issue: Связь вступительной формулы с последующим пророчеством
  choice: Сохранено двоеточие в конце стиха
  alternative: Завершить стих точкой
  rationale: Стих служит заголовочной формулой к слову Яхве, содержание которого следует далее; двоеточие сохраняет эту незавершённость, не добавляя отсутствующего содержания.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой формулы. Длинная еврейская конструкция разделена на два предложения ради ясности; двоеточие удерживает связь с последующим пророческим словом. Личные и географические имена даны в традиционных русских библейских формах.
