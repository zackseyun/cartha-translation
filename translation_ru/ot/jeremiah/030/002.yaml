  text: כֹּֽה אָמַ֧ר יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כְּתָב לְ/ךָ֗ אֵ֧ת כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבַּ֥רְתִּי אֵלֶ֖י/ךָ אֶל סֵֽפֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Write for yourself in a scroll all the words that I have spoken to you.'
translation:
  language: ru
  text: 'Так говорит Яхве, Бог Израиля: «Запиши себе в свиток[a] все слова, которые Я сказал тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в книгу»; еврейское סֵפֶר означает письменный документ, в данной исторической обстановке обычно свиток.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула; настоящее время естественно передаёт действующую силу возвещения, хотя אָמַר морфологически имеет форму перфекта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Точно и естественно передаёт сопряжённую конструкцию.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Здесь слово вводит прямую речь; в современном русском его функцию естественно выполняет двоеточие.
- source_word: כְּתָב לְךָ
  choice: Запиши себе
  rationale: «Запиши» в данном контексте естественнее простого «пиши», а «себе» сохраняет личный дательный לְךָ без избыточного истолкования.
- source_word: כָּל הַדְּבָרִים
  choice: все слова
  rationale: В контексте Божьей речи, которую следует записать, דְּבָרִים точнее передать как «слова», а не как «дела» или «всё».
- source_word: אֲשֶׁר דִּבַּרְתִּי אֵלֶיךָ
  choice: которые Я сказал тебе
  rationale: Естественно передаёт завершённую предшествующую речь Бога, обращённую к Иеремии.
- source_word: אֶל־סֵפֶר
  choice: в свиток
  rationale: סֵפֶר обозначает письменный документ; в исторической обстановке это, вероятнее всего, свиток. Предлог אֶל при глаголе записи идиоматически передан русским «в».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет личное имя Бога. Транслитерация сохраняет его отличие от титула אֲדֹנָי и не вносит конфессионального истолкования.
translation_notes:
  register: Современный литературный русский с сохранением торжественной краткости пророческой формулы. Прямая речь оформлена по нормам русской пунктуации; местоимение «Я» написано с прописной буквы как элемент благоговейного библейского регистра.
