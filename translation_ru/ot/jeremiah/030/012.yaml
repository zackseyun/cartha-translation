  text: 'For thus says Yahweh: Your fracture is incurable[a]; your wound is grievous.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве:


    «Неисцелим твой перелом,

    тяжела твоя рана»ᵃ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объясняющее или обосновывающее пророческое высказывание и сохраняет связь с предшествующим контекстом.
- source_word: כֹה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохранена традиционная формула пророческого вестника и передано личное имя Бога.
- source_word: אָנושׁ
  choice: неисцелим
  rationale: В медицинском образе слово указывает на состояние, не поддающееся исцелению; мужской род согласован с «перелом».
- source_word: לְשִׁבְרֵךְ
  choice: твой перелом
  rationale: Конкретное значение «перелом, повреждение, сокрушение» сохраняет телесно-медицинский образ рядом с «раной».
- source_word: נַחְלָה
  choice: тяжела
  rationale: Форма описывает рану как тяжёлую, мучительную или серьёзную; «тяжела» естественно по-русски и не повторяет «неисцелим».
- source_word: מַכָּתֵךְ
  choice: твоя рана
  rationale: В данном медицинском контексте «рана» наиболее естественно передаёт повреждение от удара.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и соответствует предоставленному проектному решению.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Краткий параллелизм и медицинская метафора оригинала сохранены; обращение во втором лице единственного числа имеет форму женского рода в «твоя рана», как и в еврейском обращении к олицетворённому народу/городу.
