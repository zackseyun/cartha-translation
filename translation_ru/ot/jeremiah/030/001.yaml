lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: В пророческой формуле דָּבָר обозначает слово или весть от Бога; «слово» сохраняет традиционную формулу и не сужает значения.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: которое было к
  rationale: Близко передаёт еврейскую формулу получения откровения и естественно звучит в современном литературном библейском стиле; вариант «которое пришло к» более идиоматичен, но менее формален.
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Общепринятая русская форма имени в требуемом дательном падеже.
- source_word: מֵאֵת
  choice: от
  rationale: Передаёт источник и происхождение слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени, представленного тетраграмматоном; не заменяет имя титулом.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит следующую прямую речь. В русском двоеточие естественно выполняет ту же дискурсивную функцию и избегает тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя YHWH. «Яхве» сохраняет его как имя, тогда как «Господь» заменяет его титулом; «Иегова» отражает более позднюю смешанную форму произношения.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы. Двоеточие связывает стих с прямой речью следующего стиха; маркер сноски поставлен непосредственно после имени.
