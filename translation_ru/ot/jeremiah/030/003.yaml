source:
  edition: WLC
  text: כִּ֠י הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ֠/שַׁבְתִּי אֶת שְׁב֨וּת עַמִּ֧/י יִשְׂרָאֵ֛ל וִֽ/יהוּדָ֖ה אָמַ֣ר יְהוָ֑ה וַ/הֲשִׁבֹתִ֗י/ם אֶל הָ/אָ֛רֶץ אֲשֶׁר נָתַ֥תִּי לַ/אֲבוֹתָ֖/ם וִֽ/ירֵשֽׁוּ/הָ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/003.yaml
  text: For look, days are coming, declares the LORD, when I will restore the fortunes of my people Israel and Judah, says the LORD, and I will bring them back to the land that I gave to their fathers, and they will possess it.
translation:
  language: ru
  text: Ибо вот, наступают дни, — возвещает ГОСПОДЬ, — когда Я восстановлю благополучие[a] Моего народа, Израиля и Иуды, — говорит ГОСПОДЬ. — Я возвращу их в землю, которую дал их предкам, и они овладеют ею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изменю участь»; возможно также: «возвращу из плена».'
    reason: Еврейская идиома שׁוּב שְׁבוּת допускает более широкое значение восстановления судьбы и более буквальное понимание в связи с пленом.
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ибо вот
  rationale: Сохраняет причинно-пояснительное כִּי и вводное, привлекающее внимание הִנֵּה в естественной для пророческой речи форме.
- source_word: נְאֻם יהוה / אָמַר יהוה
  choice: возвещает ГОСПОДЬ / говорит ГОСПОДЬ
  rationale: Передаёт два близких, но различных глагольных оборота исходного текста; тетраграмматон по принятой русской библейской традиции передан как ГОСПОДЬ.
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  choice: Я восстановлю благополучие
  rationale: Идиома означает поворот судьбы и восстановление прежнего благополучия; буквальная связь с пленом остаётся возможной и отмечена в сноске.
- source_word: אֶל הָאָרֶץ
  choice: в землю
  rationale: 'Определённость понятна из последующего придаточного: это земля, данная предкам.'
- source_word: לַאֲבוֹתָם
  choice: их предкам
  rationale: Современное нейтральное обозначение родоначальников народа; точнее по объёму смысла, чем исключительно мужское современное «отцы».
- source_word: וִירֵשׁוּהָ
  choice: и они овладеют ею
  rationale: Передаёт значение ירשׁ — вступить во владение и удерживать как наследственное достояние.
theological_decisions:
- issue: Объём обещанного восстановления
  choice: Сохранено прямое обещание Израилю и Иуде о возвращении в данную предкам землю.
  alternative: Истолковать обещание как исключительно духовное или перенести его непосредственно на иную общность.
  rationale: Стих прямо называет Израиль и Иуду и землю предков; перевод не должен заранее разрешать дальнейшие богословские вопросы исполнения пророчества.
- issue: Значение שׁוּב שְׁבוּת
  choice: «восстановлю благополучие» с указанием буквальной альтернативы в сноске
  alternative: «возвращу из плена»
  rationale: Выражение допускает связь с пленением, но как идиома шире и обозначает восстановление судьбы или благополучия; следующий глагол отдельно и ясно говорит о возвращении в землю.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Пунктуация оформляет двукратную формулу божественного речения, не сглаживая её повтор. Местоимения, относящиеся к Богу, даны с прописной буквы в соответствии с распространённой русской библейской практикой.
