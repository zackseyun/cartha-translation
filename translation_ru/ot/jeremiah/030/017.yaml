source:
  edition: WLC
  text: כִּי֩ אַעֲלֶ֨ה אֲרֻכָ֥ה לָ֛/ךְ וּ/מִ/מַּכּוֹתַ֥יִ/ךְ אֶרְפָּאֵ֖/ךְ נְאֻם יְהוָ֑ה כִּ֤י נִדָּחָה֙ קָ֣רְאוּ לָ֔/ךְ צִיּ֣וֹן הִ֔יא דֹּרֵ֖שׁ אֵ֥ין לָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/017.yaml
  text: 'For I will bring healing to you[a], and I will heal you from your wounds, declares Yahweh, because they have called you an outcast: ‘It is Zion[c][b]; no one cares for her.’'
translation:
  language: ru
  text: '«Ибо Я принесу тебе исцеление[a] и исцелю тебя от ран твоих, — возвещает Яхве, — потому что тебя называли отверженной[b]: „Это Сион — никто о ней не заботится[c]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я восстановлю твоё здоровье». Буквально еврейская идиома означает: «Я взращу (подниму) для тебя исцеление».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изгнанницей», «той, кого отвергли». Еврейское слово обозначает прогнанную или отринутую.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «нет у неё того, кто ищет её», то есть того, кто справляется о ней, заботится о ней или приходит ей на помощь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַעֲלֶה אֲרֻכָה
  choice: Я принесу тебе исцеление
  rationale: Передаёт каузативную еврейскую идиому — буквально «взращу/подниму для тебя исцеление» — естественно по-русски, сохраняя образ даруемого Богом выздоровления.
- source_word: וּמִמַּכּוֹתַיִךְ אֶרְפָּאֵךְ
  choice: и исцелю тебя от ран твоих
  rationale: 'מַכָּה может обозначать удар, поражение или рану; в контексте исцеления уместно «раны». Сохранены личный объект и конструкция с מן: «исцелю тебя от…».'
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественно и естественно передаёт устойчивую пророческую формулу נְאֻם; тетраграмматон передан личным именем «Яхве».
- source_word: נִדָּחָה
  choice: отверженной
  rationale: Страдательное причастие означает ту, которую прогнали, отвергли или оставили. «Отверженная» сохраняет женский род обращения к Сиону и выражает общественное отвержение.
- source_word: קָרְאוּ לָךְ
  choice: тебя называли
  rationale: Перфект обобщает сложившуюся уничижительную характеристику; русское прошедшее несовершенного вида естественно передаёт повторявшееся или принятое именование.
- source_word: צִיּוֹן הִיא
  choice: Это Сион
  rationale: Сохраняет краткую назывную реплику и указательное местоимение женского рода, относящееся к Сиону.
- source_word: דֹּרֵשׁ אֵין לָהּ
  choice: никто о ней не заботится
  rationale: 'Буквально: «нет у неё ищущего/спрашивающего о ней». В данном контексте глагол подразумевает проявление внимания, попечения и помощи; естественный русский эквивалент — «никто о ней не заботится».'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Характер обещанного восстановления
  choice: телесно-медицинская метафора исцеления сохранена без сужения её смысла
  alternative: явно истолковать как национальное или духовное восстановление
  rationale: Контекст допускает переносное применение к восстановлению Сиона, но сам стих говорит языком здоровья и ран; перевод не должен устранять эту образную и богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «ран твоих» слегка приподнимает регистр, не делая текст архаичным. Прямая речь оформлена ясно; все маркеры сносок помещены непосредственно при соответствующих выражениях.
