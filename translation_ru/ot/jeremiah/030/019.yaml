  yaml_path: translation/ot/jeremiah/030/019.yaml
  text: From them will come thanksgiving and the sound of those who rejoice[a]; I will multiply them, and they will not be few; I will honor them[b], and they will not be insignificant.
translation:
  language: ru
  text: Из них будут исходить благодарение и голос ликующих[a]. Я умножу их, и они не будут малочисленны; Я возвеличу их[b], и они не будут малозначимы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «голос веселящихся (играющих)»: еврейское слово может обозначать праздничный смех, игру или веселье.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я сделаю их почитаемыми, и они не будут малы». Еврейские слова могут указывать как на почёт и значимость, так и на малость или незначительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵהֶם
  choice: От них будут исходить
  rationale: Сочетание обозначает источник того, что исходит от восстановленного народа; будущее время соответствует пророческому контексту. Множественное «будут исходить» естественно согласует два однородных подлежащих в русском переводе.
- source_word: תּוֹדָה
  choice: благодарение
  rationale: В данном контексте слово обозначает благодарственную хвалу, а не обязательно конкретную жертву.
- source_word: וְקוֹל מְשַׂחֲקִים
  choice: и голоса ликующих
  rationale: קוֹל передаёт слышимое выражение праздника, а причастие שׂחק может обозначать смех, игру и праздничное веселье. «Голоса ликующих» звучит естественно и сохраняет контекст общей радости.
- source_word: וְהִרְבִּתִים
  choice: Я умножу их
  rationale: 'Порода Hiphil выражает причинение многочисленности: Бог сделает народ многочисленным.'
- source_word: וְלֹא יִמְעָטוּ
  choice: и их не станет мало
  rationale: Глагол מעט здесь в параллели с обещанием умножения имеет прежде всего количественный смысл.
- source_word: וְהִכְבַּדְתִּים
  choice: Я возвеличу их
  rationale: Hiphil от כבד может означать наделение весом, честью и значимостью. «Возвеличу» передаёт повышение достоинства и положения, не сводя смысл лишь к субъективному почитанию.
- source_word: וְלֹא יִצְעָרוּ
  choice: и они не будут ничтожны
  rationale: צער может означать малость или незначительность; в антитезе к כבד наиболее вероятен смысл общественной значимости, при сохранении в примечании буквальной альтернативы.
theological_decisions:
- issue: Характер обещанных благ восстановления
  choice: Передать конкретное восстановление общины через благодарение, ликование, численный рост и возвеличение.
  alternative: Истолковать благословение исключительно духовно либо исключительно как национально-политическое возвышение.
  rationale: Еврейский текст называет ощутимые стороны восстановления, но не уточняет позднейшую экклезиологическую или эсхатологическую схему; перевод не должен добавлять такую конкретизацию.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Синтаксический параллелизм оригинала сохранён; лексическая многозначность שׂחק, כבד и צער отмечена в сносках.
