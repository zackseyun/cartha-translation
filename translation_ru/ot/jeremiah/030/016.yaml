  text: לָ/כֵ֞ן כָּל אֹכְלַ֨יִ/ךְ֙ יֵאָכֵ֔לוּ וְ/כָל צָרַ֥יִ/ךְ כֻּלָּ֖/ם בַּ/שְּׁבִ֣י יֵלֵ֑כוּ וְ/הָי֤וּ שֹׁאסַ֨יִ/ךְ֙ לִ/מְשִׁסָּ֔ה וְ/כָל בֹּזְזַ֖יִ/ךְ אֶתֵּ֥ן לָ/בַֽז־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/016.yaml
  text: Therefore all who devour you will be devoured[a], and all your adversaries, every one of them, will go into captivity; those who plunder you will become plunder, and all who prey on you I will give up to prey.
translation:
  language: ru
  text: Поэтому все, кто пожирает тебя, будут пожраны, и все твои враги — все до единого — пойдут в плен. Разоряющие тебя сами будут разорены, и всех грабящих тебя Я отдам на разграбление.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт следственный переход от предшествующего обетования и суда.
- source_word: אֹכְלַיִךְ / יֵאָכֵלוּ
  choice: все, кто пожирает тебя, будут пожраны
  rationale: Сохраняет яркую метафору поедания как губительного насилия и её зеркальный повтор в пассивной форме.
- source_word: צָרַיִךְ
  choice: твои враги
  rationale: Естественный современный русский эквивалент для обозначения враждебных противников; контекст не требует более отвлечённого «притеснители».
- source_word: כֻּלָּם
  choice: все до единого
  rationale: Передаёт усиление после «все твои враги», не оставляя исключений.
- source_word: בַּשְּׁבִי יֵלֵכוּ
  choice: пойдут в плен
  rationale: Кратко и идиоматично передаёт переход врагов в состояние пленников.
- source_word: שֹׁאסַיִךְ / לִמְשִׁסָּה
  choice: разоряющие тебя сами будут разорены
  rationale: Сохраняет судебную взаимность и словесный повтор, одновременно отличая эту пару от следующей пары с корнем בזז.
- source_word: בֹּזְזַיִךְ / אֶתֵּן לָבַז
  choice: всех грабящих тебя Я отдам на разграбление
  rationale: Передаёт близкородственные термины корня בזז/בז и конструкцию «отдать как добычу» естественной русской формулой.
theological_decisions:
- issue: Образность возмездия
  choice: Сохранить образы пожирания, плена, разорения и разграбления как зеркального суда над врагами.
  alternative: Заменить их общим утверждением о наказании врагов.
  rationale: Богословский смысл выражен через соответствие преступления и воздаяния; обобщение ослабило бы заложенную в еврейском тексте напряжённость.
- issue: Адресат в женском роде
  choice: Сохранить формы «тебя» без поясняющего добавления имени адресата.
  alternative: Явно назвать Сион, Иерусалим или народ.
  rationale: Еврейский текст использует обращение во втором лице женского рода, а непосредственное наименование адресата в самом стихе отсутствует; его не следует вносить в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм и последовательные образы возмездия сохранены; архаизмы вроде «супостаты» и «добыча врагам» не использованы.
