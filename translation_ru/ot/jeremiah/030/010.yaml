  text: וְ/אַתָּ֡ה אַל תִּירָא֩ עַבְדִּ֨/י יַעֲקֹ֤ב נְאֻם יְהֹוָה֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁיעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲקֹ֛ב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/010.yaml
  text: But as for you[a], do not fear, my servant Jacob, declares Yahweh, and do not be dismayed, Israel; for behold, I am saving you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
translation:
  language: ru
  text: А ты, Мой раб Иаков, не бойся, — возвещает Яхве, — и не падай духом, Израиль! Ибо вот, Я спасу тебя[a] издалека и потомков твоих — из земли их плена[b]. Иаков вернётся, обретёт покой и будет жить безмятежно; никто не устрашит его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я спасаю тебя». Еврейское причастие после «вот, Я» может выражать начинающееся, близкое или несомненное будущее действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «из земли, где они находятся в плену»; по смыслу также: «из земли изгнания».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и нет устрашающего». Возможный перевод: «и никто не будет наводить на него страх».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Сочетание союза с самостоятельным местоимением вводит подчёркнутое, вероятно контрастное обращение; «А ты» естественно передаёт это в русском.
- source_word: אַל תִּירָא
  choice: не бойся
  rationale: Прямой и естественный русский запрет, сохраняющий значение ירא.
- source_word: עַבְדִּי
  choice: раб Мой
  rationale: В данном контексте это почётное обозначение Иакова как принадлежащего Богу и служащего Ему; традиционное «раб Мой» уместно в возвышенной пророческой речи.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную пророческую формулу и сохраняет личное имя יְהוָה.
- source_word: וְאַל תֵּחַת
  choice: и не трепещи
  rationale: Nifal от חתת выражает испуг, смятение или сокрушённость. «Не трепещи» отличает этот глагол от предшествующего «не бойся» и естественно звучит в пророческом обращении.
- source_word: כִּי הִנְנִי מוֹשִׁיעֲךָ
  choice: Ведь вот, Я спасу тебя
  rationale: הִנְנִי придаёт высказыванию наглядность и уверенность, а причастие מוֹשִׁיע может обозначать предстоящее или несомненное действие. Русское будущее здесь звучит естественнее буквального «Я спасающий тебя».
- source_word: מֵרָחוֹק
  choice: из далёкой земли
  rationale: Буквально выражение означает «издалека». В параллели с землёй плена подразумевается удалённое место; добавление «земли» делает русский текст естественным, не меняя пространственного смысла.
- source_word: זַרְעֲךָ
  choice: твоих потомков
  rationale: Здесь זרע — собирательное обозначение потомства; «потомки» ясно и естественно передаёт смысл.
- source_word: מֵאֶרֶץ שִׁבְיָם
  choice: из земли их плена
  rationale: Близко передаёт еврейскую конструкцию, сохраняя возможность понимать שְׁבִי как состояние плена, а не только более широкое изгнание.
- source_word: וְשָׁב
  choice: вернётся
  rationale: Прямо передаёт значение שוב в контексте возвращения и восстановления.
- source_word: וְשָׁקַט וְשַׁאֲנַן
  choice: будет жить спокойно и безмятежно
  rationale: Пара глаголов описывает покой, безопасность и отсутствие тревоги. Добавленное «жить» позволяет естественно оформить два состояния по-русски.
- source_word: וְאֵין מַחֲרִיד
  choice: и никто не устрашит его
  rationale: Активно передаёт конструкцию «нет устрашающего» и сохраняет образ отсутствия внешней угрозы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога и не подменяет его титулом.
- issue: Иаков и Израиль как параллельные имена
  choice: Сохранить оба имени
  alternative: Унифицировать как «Израиль»
  rationale: Исходный текст намеренно использует оба имени в параллельном обращении; их сохранение передаёт литературную и богословскую фактуру текста.
- issue: Временное значение причастия מוֹשִׁיע
  choice: Я спасу тебя
  alternative: Я спасаю тебя
  rationale: Причастие после הִנְנִי может выражать ближайшее или несомненное будущее. Русское будущее естественно передаёт обещание, не исключая оттенка его неизбежности.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; сохранены параллельные имена Иаков/Израиль, формула пророческого возвещения и смысловые оттенки обещанного возвращения, покоя и безопасности.
