  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אֶשְׁבֹּ֤ר עֻלּ/וֹ֙ מֵ/עַ֣ל צַוָּארֶ֔/ךָ וּ/מוֹסְרוֹתֶ֖י/ךָ אֲנַתֵּ֑ק וְ/לֹא יַעַבְדוּ ב֥/וֹ ע֖וֹד זָרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/008.yaml
  text: And it shall happen in that day[a], declares Yahweh of Armies, that I will break his yoke from off your neck, and I will tear off your bonds[b], and foreigners shall no longer make him their servant.
translation:
  language: ru
  text: В тот день, — возвещает Яхве Воинств, — Я сломаю его ярмо с твоей шеи и разорву твои путы; чужеземцы больше не будут порабощать его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Еврейская заключительная фраза синтаксически сжата. По контексту «его» относится к Иакову, то есть Израилю; смысл — освобождение от чужеземного порабощения.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохранена обычная пророческая формула будущего события; выражение звучит торжественно, но не архаично.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Яхве Воинств
  rationale: נְאֻם передано как формула авторитетного пророческого заявления; имя יהוה передано как «Яхве», а צְבָאוֹת — буквально и прозрачно как «Воинств».
- source_word: אֶשְׁבֹּר עֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: Я сломаю его ярмо у тебя на шее
  rationale: Сохранены образ ярма, мужской суффикс «его» и обращение во втором лице «у тебя». Такая русская конструкция естественнее буквального «сверху твоей шеи».
- source_word: וּמוֹסְרוֹתֶיךָ אֲנַתֵּק
  choice: и разорву твои путы
  rationale: מוֹסְרוֹת обозначает узы или ремни, удерживающие в подчинении; נת״ק выражает разрыв и освобождение.
- source_word: וְלֹא יַעַבְדוּ בוֹ עוֹד זָרִים
  choice: и чужеземцы больше не будут порабощать его
  rationale: В контексте ярма и пут глагол עבד с предлогом ב передаёт принудительное использование человека как раба. Сохранён мужской единственный суффикс, а синтаксическая сжатость отмечена в примечании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Передано собственное заветное имя, присутствующее в еврейском тексте, без замены титулом.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Сил; Саваоф
  rationale: «Воинств» сохраняет военный и небесно-космический диапазон титула и остаётся понятным современному читателю.
- issue: Смысл עבד в заключительной части
  choice: порабощать его
  alternative: пользоваться его трудом; заставлять его служить
  rationale: Образы ярма и пут делают значение принудительного служения наиболее вероятным, однако возможные оттенки не скрыты и указаны в примечании.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого тона. Параллельные образы ярма и пут переданы конкретно; неоднозначность местоимений и заключительной конструкции не устранена молча, а вынесена в примечание.
