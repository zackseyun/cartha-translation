  text: שַׁאֲלוּ נָ֣א וּ/רְא֔וּ אִם יֹלֵ֖ד זָכָ֑ר מַדּוּעַ֩ רָאִ֨יתִי כָל גֶּ֜בֶר יָדָ֤י/ו עַל חֲלָצָי/ו֙ כַּ/יּ֣וֹלֵדָ֔ה וְ/נֶהֶפְכ֥וּ כָל פָּנִ֖ים לְ/יֵרָקֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/006.yaml
  text: 'Ask now[a], and see: does a male give birth? Why then do I see every man with his hands on his loins like a woman in labor, and every face turned pale?'
translation:
  language: ru
  text: 'Спросите же и посмотрите: разве мужчина рожает? Почему же я вижу, что каждый мужчина держит руки на пояснице, словно роженица, и все лица побледнели[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и все лица приобрели болезненный зеленовато-жёлтый оттенок». Еврейское слово обозначает нездоровую бледность с зеленоватым или желтоватым оттенком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲלוּ נָא
  choice: Спросите же
  rationale: Частица נָא при повелительном наклонении выражает настойчивое побуждение; «же» естественно передаёт его в современном русском без излишней церемонности.
- source_word: וּרְאוּ
  choice: и посмотрите
  rationale: Повелительная форма ראה приглашает убедиться в очевидности сказанного; «посмотрите» естественно продолжает риторический призыв.
- source_word: אִם יֹלֵד זָכָר
  choice: разве мужчина рожает?
  rationale: Вопрос риторический, а זָכָר подчёркивает биологический контраст. Русское «разве» ясно передаёт ожидаемый отрицательный ответ.
- source_word: מַדּוּעַ רָאִיתִי
  choice: Почему же я вижу
  rationale: Перфект רָאִיתִי допускает живое настоящее в пророческом описании; «же» подчёркивает логический переход от невозможного образа к наблюдаемой картине.
- source_word: כָל גֶּבֶר
  choice: каждый мужчина
  rationale: גֶּבֶר обозначает взрослого мужчину, нередко с оттенком силы. Здесь важно противопоставление мужской силы мукам роженицы; нейтральное «мужчина» сохраняет его без добавления значения «воин».
- source_word: יָדָיו עַל חֲלָצָיו
  choice: держит руки на пояснице
  rationale: חֲלָצַיִם означает область чресел, бёдер или поясницы. «На пояснице» понятно современному читателю и сохраняет телесный образ боли, избегая архаизма «чресла».
- source_word: כַּיּוֹלֵדָה
  choice: словно роженица
  rationale: Форма женского рода прямо обозначает рожающую женщину. «Роженица» кратко, ясно и образно передаёт сравнение.
- source_word: וְנֶהֶפְכוּ כָל־פָּנִים לְיֵרָקוֹן
  choice: и все лица побледнели
  rationale: Оборот буквально описывает изменение цвета всех лиц. «Побледнели» естественно передаёт состояние страха или мучения, а необычный цветовой оттенок יֵרָקוֹן сохранён в сноске.
