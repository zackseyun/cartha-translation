lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: вы будете
  rationale: Форма היה с союзом ו здесь имеет пророческое будущее значение; современное русское «будете» ясно передаёт эту временную направленность.
- source_word: לִי לְעָם
  choice: Моим народом
  rationale: Буквальная конструкция «для Меня народом» в формуле завета естественно и точно передаётся по-русски притяжательным сочетанием «Моим народом».
- source_word: וְאָנֹכִי
  choice: а Я
  rationale: Самостоятельное местоимение אָנֹכִי подчёркивает взаимность двух частей высказывания; «а Я» естественно сохраняет это смысловое выделение без чрезмерной тяжеловесности.
- source_word: אֶהְיֶה
  choice: буду
  rationale: Имперфект היה выражает будущее и сохраняет параллелизм с «вы будете».
- source_word: לָכֶם לֵאלֹהִים
  choice: вашим Богом
  rationale: В контексте формулы завета конструкция с ל идиоматически обозначает принадлежность и взаимные отношения; אֱלֹהִים относится к Богу Израиля.
