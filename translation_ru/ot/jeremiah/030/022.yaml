  choice: И вы будете Моим народом, а Я буду вашим Богом.
  alternative: И будете для Меня народом, и Я буду для вас Богом.
  rationale: Выбранный вариант естественен для современного русского языка и сохраняет будущее время, взаимную принадлежность и сбалансированность формулы, не добавляя к ней конфессионального толкования.
