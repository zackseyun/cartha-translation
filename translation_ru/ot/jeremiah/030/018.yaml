revisions:
- from: 'Так говорит Яхве: «Вот, Я возвращаю благополучие шатрам Иакова[a] и помилую его жилища. Город будет отстроен на своём холме, и дворец займёт подобающее ему место».'
  to: 'Так говорит Яхве: «Вот, Я восстанавливаю благополучие шатров Иакова[a] и смилуюсь над его жилищами. Город будет отстроен на своём холме, и дворец займёт подобающее ему место».'
  rationale: Исправлена неестественная русская сочетаемость в передаче שָׁב שְׁבוּת, без сужения идиомы до одного только возвращения из плена. Сноска сохраняет связанное с пленом альтернативное понимание, не вводя отсутствующее в оригинале направление движения. Замена «помилую» на «смилуюсь над» точнее выражает сострадание глагола אֲרַחֵם и сохраняет образность оригинала.
