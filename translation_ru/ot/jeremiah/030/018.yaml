source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי שָׁב֙ שְׁבוּת֙ אָהֳלֵ֣י יַֽעֲק֔וֹב וּ/מִשְׁכְּנֹתָ֖י/ו אֲרַחֵ֑ם וְ/נִבְנְתָ֥ה עִיר֙ עַל תִּלָּ֔/הּ וְ/אַרְמ֖וֹן עַל מִשְׁפָּט֥/וֹ יֵשֵֽׁב׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/018.yaml
  text: 'Thus says Yahweh: Behold[a], I am restoring the fortunes of the tents of Jacob, and I will have compassion on his dwellings. The city will be rebuilt on its mound, and the palace will stand in its proper place.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Вот, Я восстанавливаю благополучие шатров Иакова[a] и смилуюсь над его жилищами. Город будет отстроен на своём холме, и дворец займёт подобающее ему место».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвращаю пленников из шатров Иакова»; или: «возвращаю Иакова из плена». Еврейский оборот может означать как возвращение из плена, так и более широкое восстановление благополучия.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, сохраняя его заветный характер и принятую в проекте форму.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет указательную и эмфатическую силу еврейского оборота, оставаясь естественным для торжественной пророческой речи.
- source_word: שָׁב שְׁבוּת
  choice: возвращаю благополучие
  rationale: Передаёт идиому как восстановление прежнего доброго состояния, не ограничивая её только буквальным возвращением пленников; возможный смысл возвращения из плена отмечен в сноске.
- source_word: אָהֳלֵי יַעֲקֹב
  choice: шатрам Иакова
  rationale: Сохраняет конкретный образ шатров и собирательное обозначение народа Иакова.
- source_word: מִשְׁכְּנֹתָיו
  choice: его жилища
  rationale: Точное и современное обозначение мест проживания без привнесения культового значения слова «скиния».
- source_word: אֲרַחֵם
  choice: помилую
  rationale: Кратко и достойно передаёт проявление милосердия и сострадания в заветном контексте.
- source_word: וְנִבְנְתָה עִיר
  choice: Город будет отстроен
  rationale: Контекст указывает на известный город, вероятнее всего Иерусалим; «отстроен» естественно выражает восстановление разрушенного города.
- source_word: עַל תִּלָּהּ
  choice: на своём холме
  rationale: תֵּל может обозначать возвышенность или холм, в том числе образованный руинами; «холм» читается естественно, а принадлежность передана местоимением «своём».
- source_word: אַרְמוֹן
  choice: дворец
  rationale: Наиболее прямое обозначение значительного царского или знатного здания без излишнего акцента на военной функции.
- source_word: עַל מִשְׁפָּטוֹ יֵשֵׁב
  choice: займёт подобающее ему место
  rationale: Передаёт идиоматический смысл восстановления дворца на его установленном, надлежащем месте; буквальное «сядет по своему установлению» по-русски неясно.
theological_decisions:
- issue: Объём восстановления в שָׁב שְׁבוּת
  choice: Широкое восстановление благополучия Иакова, включающее, но не обязательно исчерпывающееся возвращением из плена.
  alternative: Буквальное возвращение пленников или возвращение Иакова из плена.
  rationale: Идиома допускает оба оттенка. Упоминание шатров, жилищ, города и дворца указывает на целостное восстановление, однако связанный с пленом смысл сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified пророческой торжественностью. Синтаксис ясен для широкого круга читателей; сохранены конкретные образы шатров, жилищ, города и дворца. Сноска [a] поставлена непосредственно после спорной идиомы.
