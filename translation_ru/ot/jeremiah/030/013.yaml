lexical_decisions:
- source_word: אֵין
  choice: некому / нет
  rationale: Отрицательная экзистенциальная частица в первой части относится к действующему лицу и естественно передаётся как «некому», а во второй — как «нет».
- source_word: דָּן
  choice: отстаивать
  rationale: Причастие от דין употреблено в юридическом контексте рядом с דִּינֵךְ. «Отстаивать дело» естественно передаёт значение ведения дела в чью-либо защиту, не устраняя возможного оттенка судебного разбирательства.
- source_word: דִּינֵךְ
  choice: твоё дело
  rationale: Существительное обозначает судебное дело или тяжбу; «дело» сохраняет юридический образ и понятно современному читателю.
- source_word: לְמָזוֹר
  choice: о твоей ране
  rationale: מָזוֹר означает рану или язву. Предлог ל здесь передан как указание на предмет дела — «о ране»; необычная связь юридического и медицинского образов сохранена.
- source_word: רְפֻאוֹת
  choice: исцеление
  rationale: Формально множественное существительное может иметь собирательное значение. Единственное число «исцеление» звучит по-русски естественно и выражает отсутствие всякой возможности выздоровления.
- source_word: תְּעָלָה
  choice: лекарство
  rationale: Редкое слово в контексте лечения раны допускает понимание как лечебного средства, повязки или нарастания новой ткани. «Лекарство» ясно передаёт общий медицинский смысл, а более конкретные варианты отмечены в сноске.
- source_word: אֵין לָךְ
  choice: нет для тебя
  rationale: Оборот выражает отсутствие чего-либо у адресата или для него. «Нет для тебя» сохраняет направленность высказывания и его суровый пророческий тон.
