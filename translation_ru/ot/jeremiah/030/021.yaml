  text: וְ/הָיָ֨ה אַדִּיר֜/וֹ מִמֶּ֗/נּוּ וּ/מֹֽשְׁל/וֹ֙ מִ/קִּרְבּ֣/וֹ יֵצֵ֔א וְ/הִקְרַבְתִּ֖י/ו וְ/נִגַּ֣שׁ אֵלָ֑/י כִּי֩ מִ֨י הוּא זֶ֜ה עָרַ֧ב אֶת לִבּ֛/וֹ לָ/גֶ֥שֶׁת אֵלַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/021.yaml
  text: His ruler will be one of them[a], and his governor will come out from his midst. I will bring him near, and he will approach me[c][b], for who is this who has pledged his heart to approach me? declares Yahweh.
translation:
  language: ru
  text: Его вождь будет из его же народа[a], и его правитель выйдет из его среды[b]. Я приближу его, и он приблизится ко Мне. Ибо кто же тот, кто отдал своё сердце в залог, чтобы приблизиться ко Мне?[c] — возвещает ГОСПОДЬ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его знатный» либо «его могущественный предводитель». Еврейское слово может обозначать знатного, могущественного или выдающегося человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из него» и «из его среды»; речь идёт о том, что правитель произойдёт из самого народа.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «кто отважился бы в своём сердце приблизиться ко Мне?» Еврейское выражение буквально говорит о том, чтобы отдать сердце в залог или поручиться им.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַדִּירוֹ
  choice: его вождь
  rationale: אַדִּיר может обозначать могущественного, знатного или видного человека. Параллель с מֹשְׁלוֹ указывает здесь на руководителя; «вождь» передаёт это значение, не устраняя оттенка высокого положения.
- source_word: מִמֶּנּוּ
  choice: из его же народа
  rationale: Буквально форма означает «из него», но коллективный контекст указывает, что предводитель происходит из самого народа. Такой перевод естественен по-русски и сохраняет акцент на его внутреннем происхождении.
- source_word: מֹשְׁלוֹ
  choice: его правитель
  rationale: Причастная форма от משל обозначает того, кто управляет. «Правитель» точно передаёт властную функцию и поддерживает параллелизм с «вождём».
- source_word: מִקִּרְבּוֹ
  choice: из его среды
  rationale: קֶרֶב означает внутренность или среду. Выражение сохраняет образ правителя, выходящего изнутри сообщества.
- source_word: וְהִקְרַבְתִּיו
  choice: Я приближу его
  rationale: Каузативная форма глагола קרב подчёркивает, что доступ этого правителя дарует сам ГОСПОДЬ.
- source_word: וְנִגַּשׁ אֵלַי
  choice: и он приблизится ко Мне
  rationale: נגשׁ означает приближаться или приступать и может иметь оттенок торжественного либо культового доступа. Повтор корня «приближу — приблизится» отражает словесную связь оригинала.
- source_word: עָרַב אֶת־לִבּוֹ
  choice: отдал своё сердце в залог
  rationale: ערב может означать отдавать в залог или выступать поручителем. Перевод сохраняет необычную метафору оригинала и выраженную ею решительную самоотдачу, не сводя её только к смелости.
- source_word: לָגֶשֶׁת אֵלַי
  choice: чтобы приблизиться ко Мне
  rationale: Повтор глагола נגשׁ передан последовательно, сохраняя возможный оттенок доступа к Божьему присутствию.
- source_word: נְאֻם יְהוָה
  choice: возвещает ГОСПОДЬ
  rationale: Устойчивая пророческая формула передана современно и торжественно; имя יהוה обозначено традиционным «ГОСПОДЬ».
theological_decisions:
- issue: Характер доступа правителя к Богу
  choice: Текст говорит о правителе из самого народа, которого ГОСПОДЬ Сам приближает к Себе; формулировка допускает особый, в том числе культовый, оттенок доступа, но прямо не называет его священником или Мессией.
  alternative: Понимать правителя исключительно как мессианского царя, послепленного наместника или царя-священника.
  rationale: В еврейском тексте подчёркнуты происхождение правителя изнутри народа и дарованный Богом доступ. Перевод сохраняет эту богословскую напряжённость и не вносит более узкого отождествления.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Параллелизм и повтор глагола «приблизить/приблизиться» сохранены; необычная метафора сердца, отданного в залог, оставлена в основном тексте и пояснена в сноске.
