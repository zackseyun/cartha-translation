base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/020.yaml
  text: His children will be as in former times[a], and his congregation will be established before me[d][c][b]; and I will punish all his oppressors.
translation:
  language: ru
  text: Его дети[a] будут как прежде[b], и его община[c] прочно утвердится предо Мною[d]; Я накажу всех его притеснителей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его сыновья»; здесь слово может собирательно означать детей или потомков.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как в древности», «как раньше».'
    reason: lexical_alternative
  - marker: c
    text: 'Также можно перевести: «собрание» или «сообщество».'
    reason: lexical_alternative
  - marker: d
    text: Единственное число «его», вероятно, относится к Иакову/Израилю, представленному как единое целое.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיוּ
  choice: будут
  rationale: Форма совершенного вида с союзом в пророческом контексте продолжает ряд обещаний о будущем восстановлении.
- source_word: בָנָיו
  choice: его дети
  rationale: Буквально «его сыновья», однако בנים может собирательно обозначать детей или потомков; «дети» естественно передаёт этот смысл, не вводя излишнего ограничения по полу.
- source_word: כְּקֶדֶם
  choice: как прежде
  rationale: Кратко и естественно передаёт сравнение с прежним состоянием; возможен также оттенок «как в древности».
- source_word: וַעֲדָתוֹ
  choice: его община
  rationale: עֵדָה обозначает собравшееся или организованное сообщество. «Община» сохраняет корпоративный смысл и понятно современному читателю.
- source_word: לְפָנַי תִּכּוֹן
  choice: утвердится предо Мною
  rationale: Нифаль от כון выражает обретение прочности и устойчивого положения; возвратная русская форма естественно сохраняет результативный оттенок без уточнения действующего лица.
- source_word: וּפָקַדְתִּי
  choice: Я накажу
  rationale: Хотя פקד имеет широкий диапазон значений, сочетание с עַל и указанием на притеснителей в контексте суда ясно выражает наказание.
- source_word: עַל כָּל לֹחֲצָיו
  choice: всех его притеснителей
  rationale: Причастие от לחץ обозначает тех, кто теснит или угнетает; «притеснители» точно и лаконично передаёт значение.
theological_decisions:
- issue: К кому относятся местоименные суффиксы единственного числа («его дети», «его община», «его притеснители»)
  choice: Сохранить формы единственного числа «его», не раскрывая референта в основном тексте.
  alternative: Истолковать их как указание на Иакова/Израиль как собирательное целое и перевести формами множественного числа либо прямо назвать Израиль.
  rationale: Еврейский текст последовательно употребляет суффиксы мужского рода единственного числа. Вероятно, народ Иакова/Израиля представлен как единое лицо, но сохранение грамматики источника не устраняет заложенную в тексте неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Форма «предо Мною» сохраняет достоинство прямой речи Бога, оставаясь понятной; синтаксис краток и близок к параллелизму еврейского текста.
