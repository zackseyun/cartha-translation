source:
  edition: WLC
  text: מַה תִּזְעַק֙ עַל שִׁבְרֵ֔/ךְ אָנ֖וּשׁ מַכְאֹבֵ֑/ךְ עַ֣ל רֹ֣ב עֲוֺנֵ֗/ךְ עָֽצְמוּ֙ חַטֹּאתַ֔יִ/ךְ עָשִׂ֥יתִי אֵ֖לֶּה לָֽ/ךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/015.yaml
  text: Why do you cry out over your injury? Your pain is incurable[a]. Because your iniquity is great, because your sins are many[b], I have done these things to you.
translation:
  language: ru
  text: Почему ты кричишь из-за своей раны?[a] Твоя боль неизлечима.[b] Из-за великого беззакония твоего, из-за множества твоих грехов Я сделал с тобой всё это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за своего поражения» либо «из-за своего сокрушения». Еврейское слово может обозначать перелом, рану, разрушение или сокрушительное бедствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «твоя боль тяжела» / «безнадёжна». Еврейское прилагательное описывает крайне тяжёлое состояние, которое может считаться не поддающимся исцелению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תִּזְעַק
  choice: Почему ты кричишь
  rationale: В сочетании с глаголом несовершенного вида מַה вводит риторический вопрос о причине. «Кричишь» передаёт громкий вопль в бедствии, выражаемый זעק.
- source_word: עַל שִׁבְרֵךְ
  choice: из-за своей раны
  rationale: עַל указывает на причину вопля, а שֶׁבֶר может обозначать перелом, рану, поражение или сокрушение. «Рана» естественно сохраняет телесную метафору бедствия.
- source_word: אָנושׁ מַכְאֹבֵךְ
  choice: Твоя боль неизлечима
  rationale: מַכְאוֹב означает боль или страдание; אָנושׁ описывает крайне тяжёлое состояние, не поддающееся исцелению. Перестановка слов соответствует естественному русскому синтаксису.
- source_word: עַל רֹב עֲוֺנֵךְ
  choice: Из-за великого беззакония твоего
  rationale: עַל здесь вводит основание суда; רֹב выражает величину или изобилие, а עָוֹן в контексте обозначает нравственное беззаконие.
- source_word: עָצְמוּ חַטֹּאתַיִךְ
  choice: из-за множества твоих грехов
  rationale: Глагол עצם может означать силу, величину или многочисленность. В параллели с רֹב עֲוֺנֵךְ речь естественно понимается как множество грехов; причинная конструкция сделана явной по-русски.
- source_word: עָשִׂיתִי אֵלֶּה לָךְ
  choice: Я сделал с тобой всё это
  rationale: Форма первого лица עָשִׂיתִי прямо сохраняет действие говорящего; אֵלֶּה — множественное указательное местоимение, естественно переданное по-русски сочетанием «всё это».
theological_decisions:
- issue: Деятель суда
  choice: «Я сделал с тобой всё это» — говорящий прямо приписывает совершённый суд Себе.
  alternative: 'Безличное выражение: «всё это случилось с тобой».'
  rationale: В еврейском тексте стоит явная форма первого лица единственного числа עָשִׂיתִי. Безличный перевод неоправданно смягчил бы утверждение о Божьем действии.
- issue: Причина суда
  choice: Суд связан с великим беззаконием и множеством грехов адресата.
  alternative: Понимать עָוֹן преимущественно как уже понесённую вину или наказание.
  rationale: Параллель с חַטֹּאתַיִךְ («твои грехи») указывает прежде всего на нравственные проступки как основание суда, не устраняя более широкого смыслового поля עָוֹן.
translation_notes:
  register: Современный литературный русский язык с dignified пророческой интонацией. Сохранены риторический вопрос, образ раны и прямое указание на действие Бога; инверсия в причинных оборотах («беззакония твоего») умеренно возвышает стиль, не делая его архаичным.
