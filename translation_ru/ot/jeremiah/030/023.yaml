base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/023.yaml
  text: Look[a], Yahweh’s storm of wrath has gone out, a sweeping tempest[b]; it will whirl down on the head of the wicked.
translation:
  language: ru
  text: Вот[a] буря ярости Яхве вырвалась — буря, несущаяся вихрем; она обрушится на головы нечестивых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст сжато сополагает слова «буря Яхве» и «ярость»; возможна передача: «Вот, буря Яхве — ярость — вышла». Нагромождение слов, обозначающих бурю, усиливает образ.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительный еврейский глагол труден для истолкования; возможны переводы: «закружится над головами нечестивых» или «падёт на головы нечестивых».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательную силу и живую непосредственность пророческого возгласа естественным современным русским словом.
- source_word: סַעֲרַת יְהוָה
  choice: буря Яхве
  rationale: 'Сохраняет конструкцию принадлежности или происхождения: это буря, принадлежащая Яхве либо посланная Им.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, непосредственно стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: חֵמָה
  choice: ярость
  rationale: В данном пророческом контексте обозначает сильный Божий гнев, проявляющийся в суде; «ярость» также естественно сочетается с образом вырвавшейся бури.
- source_word: יָצְאָה
  choice: вырвалась наружу
  rationale: Передаёт совершенное действие, уже приведённое в движение, и усиливает образ неудержимой стихии.
- source_word: סַעַר מִתְגּוֹרֵר
  choice: бушующий вихрь
  rationale: Сохраняет накопление близких образов бури и передаёт деятельное, неистовое движение стихии без тяжеловесной буквальности.
- source_word: עַל רֹאשׁ רְשָׁעִים
  choice: на головы нечестивых
  rationale: Сохраняет конкретный образ суда, обрушивающегося на человека, при этом употребляет естественное для русского языка согласование с множественным числом.
- source_word: יָחוּל
  choice: обрушится
  rationale: Точный оттенок трудного глагола неясен; в контексте бури «обрушится» выражает её грядущее сильное воздействие, не вводя чрезмерно конкретной траектории движения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе употреблено собственное Божье имя; его транслитерация сохраняет различие между именем и титулом.
- issue: Связь ярости с бурей Яхве
  choice: Сохранить образ ярости как вырвавшейся бури без поясняющего добавления «Его»
  alternative: «Вырвалась Его ярость»
  rationale: Еврейский текст сополагает слова о буре и ярости, но не содержит местоимения. Выбранная формулировка сохраняет эту напряжённую образность и не делает синтаксическую связь определённее, чем в источнике.
- issue: Значение заключительного יָחוּל
  choice: он обрушится
  alternative: он закружится / разразится
  rationale: Форма допускает разные толкования, связанные с кружением, движением или падением бури. Основной текст передаёт воздействие суда, а примечание сохраняет лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой энергией. Краткие части фразы и тире сохраняют стремительное нагромождение образов в еврейском тексте; архаизмы избегаются.
