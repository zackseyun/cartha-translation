  to: Ибо Я с тобой, — возвещает Яхве, — чтобы спасти тебя.[a] Я полностью истреблю все народы, куда Я рассеял тебя, но тебя полностью не истреблю. Я буду наказывать тебя по справедливости и без наказания тебя не оставлю.[b]
