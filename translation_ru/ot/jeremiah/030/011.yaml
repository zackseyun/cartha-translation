  text: כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הֽוֹשִׁיעֶ֑/ךָ כִּי֩ אֶעֱשֶׂ֨ה כָלָ֜ה בְּ/כָֽל הַ/גּוֹיִ֣ם אֲשֶׁ֧ר הֲפִצוֹתִ֣י/ךָ שָּׁ֗ם אַ֤ךְ אֹֽתְ/ךָ֙ לֹֽא אֶעֱשֶׂ֣ה כָלָ֔ה וְ/יִסַּרְתִּ֨י/ךָ֙ לַ/מִּשְׁפָּ֔ט וְ/נַקֵּ֖ה לֹ֥א אֲנַקֶּֽ/ךָּ־־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/011.yaml
  text: For I am with you—oracle of Yahweh—to save you[a]. For I will make a full end of all the nations where I have scattered you, but of you I will not make a full end. I will discipline you with justice[b], and I will by no means leave you unpunished.
translation:
  language: ru
  text: Ибо Я с тобой, — возвещает Яхве, — чтобы спасти тебя.[a] Я полностью истреблю все народы, куда Я рассеял тебя, но тебя полностью не истреблю. Я буду наказывать тебя по справедливости и без наказания тебя не оставлю.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изречение Яхве». Еврейское נְאֻם יְהוָה — устойчивая пророческая формула.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская усилительная конструкция; также: «ни в коем случае не оправдаю тебя» или «не признаю тебя невиновным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: נְאֻם יְהוָה
  choice: слово Яхве
  rationale: Естественная для современного русского пророческая формула, сохраняющая значение авторитетного изречения; возможный более динамичный вариант указан в сноске.
- source_word: לְהוֹשִׁיעֶךָ
  choice: чтобы спасти тебя
  rationale: Инфинитив породы hифиль от ישׁע выражает спасение или избавление; «спасти» сохраняет широкий смысл.
- source_word: כָלָה
  choice: полностью истреблю
  rationale: В сочетании с עשׂה слово обозначает доведение до полного конца, вплоть до уничтожения. Одинаковая формулировка в обеих частях сохраняет риторический контраст.
- source_word: הֲפִצוֹתִיךָ
  choice: рассеял тебя
  rationale: Глагол породы hифиль от פוץ описывает рассеяние народа среди других народов и естественно звучит в контексте изгнания.
- source_word: אַךְ
  choice: но
  rationale: Передаёт резкий контраст между участью народов и участью адресата.
- source_word: וְיִסַּרְתִּיךָ
  choice: Я буду наказывать тебя
  rationale: יסר обозначает строгое исправительное воздействие. «Наказывать» понятно современному читателю и не ослабляет суровость контекста, хотя оттенок исправления сохраняется в связи со справедливой мерой.
- source_word: לַמִּשְׁפָּט
  choice: по справедливости
  rationale: Передаёт мысль о справедливой, соразмерной мере суда или наказания, не утверждая отсутствия наказания.
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  choice: и без наказания тебя не оставлю
  rationale: 'Отрицательная конструкция с инфинитивом абсолютным усиливает утверждение: Бог ни в коем случае не признает адресата свободным от последствий. Русская идиома передаёт это естественно; буквальный судебный оттенок отмечен в сноске.'
theological_decisions:
- issue: Соотношение спасения, сохранения народа и обязательного суда над ним
  choice: 'Сохранён контраст: Яхве спасёт адресата и не истребит его полностью, однако подвергнет справедливому наказанию.'
  alternative: 'Передать последнюю фразу только в судебных терминах: «не оправдаю тебя».'
  rationale: Ближайший контекст связывает финальную формулу с יסר, то есть с наказанием, имеющим исправительный оттенок. Вместе с тем перевод не смягчает категоричность суда и не превращает обещание спасения в освобождение от ответственности.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Повтор «полностью истреблю / полностью не истреблю» намеренно сохраняет параллелизм и напряжение оригинала. Единственное число «тебя» оставлено, поскольку еврейский текст обращается к народу как к одному лицу.
