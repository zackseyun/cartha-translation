  text: ה֗וֹי כִּ֥י גָד֛וֹל הַ/יּ֥וֹם הַ/ה֖וּא מֵ/אַ֣יִן כָּמֹ֑/הוּ וְ/עֵֽת צָרָ֥ה הִיא֙ לְ/יַֽעֲקֹ֔ב וּ/מִמֶּ֖/נָּה יִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/007.yaml
  text: Alas! For that day is great[a]; there is none like it. It is a time of distress for Jacob[c][b], yet he will be saved out of it.
translation:
  language: ru
  text: Увы[a]! Ведь велик тот день — нет подобного ему. Это время бедствия для Иакова[b], но он будет спасён из него[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Горе!»; начальное междометие выражает тревогу или скорбь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «время скорби для Иакова».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будет избавлен от него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: О горе!
  rationale: Междометие выражает тревогу и скорбь. «О горе!» передаёт восклицательную силу, не превращая фразу в формулу проклятия.
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего возгласа; «ибо» естественно сохраняет пояснительную связь и соответствует достоинству пророческой речи.
- source_word: גָדוֹל
  choice: велик
  rationale: Основное значение — большой, великий по масштабу. Контекст передаёт грозный характер дня, поэтому нет необходимости добавлять в само прилагательное значение «ужасен».
- source_word: הַיּוֹם הַהוּא
  choice: тот день
  rationale: Устойчивое пророческое обозначение определённого дня или периода с сохранением указательного акцента.
- source_word: מֵאַיִן כָּמֹהוּ
  choice: нет подобного ему
  rationale: Естественная русская передача еврейского идиоматического выражения несравненности.
- source_word: וְעֵת צָרָה
  choice: Это время бедствия
  rationale: עֵת обозначает время или пору, а צָרָה — бедствие, тесноту, тяжёлое положение. «Время бедствия» точно и понятно передаёт сочетание.
- source_word: לְיַעֲקֹב
  choice: для Иакова
  rationale: Сохранено собственное имя, как в еврейском тексте; вероятное собирательное значение не подменяется толкованием в основном тексте.
- source_word: וּמִמֶּנָּה
  choice: но ... из него
  rationale: Местоименный суффикс отсылает к грамматически женскому עֵת или к беде; по-русски местоимение согласовано со словом «время». Союз «но» естественно выражает контраст между бедствием и последующим спасением.
- source_word: יִוָּשֵׁעַ
  choice: он будет спасён
  rationale: Нифаль глагола ישׁע означает быть спасённым или избавленным. «Будет спасён» сохраняет широкую библейскую лексику спасения, а «из него» уточняет непосредственный контекст.
theological_decisions:
- issue: Кого обозначает «Иаков»
  choice: В основном тексте сохранено имя «Иаков», допускающее собирательное обозначение народа.
  alternative: «Израиль», «потомки Иакова» или «Божий народ».
  rationale: Еврейский текст прямо называет Иакова. Замена имени толкованием сузила бы образ и ослабила бы заветно-пророческую окраску.
- issue: Смысл יִוָּשֵׁעַ в данном контексте
  choice: «Он будет спасён» с уточнением «из него».
  alternative: «Он будет избавлен» или «он спасётся».
  rationale: Страдательная форма указывает на получаемое спасение, не называя действующего лица. Такая передача сохраняет богословскую насыщенность глагола, а контекст не позволяет свести его исключительно к вечному спасению.
- issue: Связь последней части стиха
  choice: Контраст передан союзом «но».
  alternative: Буквальное присоединение союзом «и».
  rationale: Еврейский ו допускает контекстуально-противительное значение. Здесь обещание спасения противопоставлено времени бедствия, однако характер и источник спасения не уточняются.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Сохранены имя «Иаков», образ «того дня» и неоднозначность спасения; архаизация ограничена уместным причинным союзом «ибо».
