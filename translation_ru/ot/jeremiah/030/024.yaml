base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/024.yaml
  text: The burning anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart. In the latter days you will understand it.
translation:
  language: ru
  text: Пылающий гнев Яхве не отступит, пока Он не совершит этого и не осуществит намерений Своего сердца. В последние дни[a] вы поймёте это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в грядущие дни»; букв. «в конце дней». Еврейское выражение может указывать на будущее завершение Божьих замыслов, не определяя точно его время.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרוֹן אַף
  choice: пылающий гнев
  rationale: Сохраняет образ жара, заключённый в еврейском сочетании, и естественно звучит по-русски.
- source_word: יָשׁוּב
  choice: не отступит
  rationale: Передаёт буквальную идею поворота вспять и в данном контексте означает, что гнев не прекратится до исполнения цели.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: עַד עֲשֹׂתוֹ
  choice: пока Он не совершит задуманного
  rationale: Глагольный оборот указывает на доведение действия до конца; дополнение в еврейском подразумевается, а «задуманного» естественно связывает его с последующими намерениями сердца.
- source_word: הֲקִימוֹ
  choice: не осуществит
  rationale: Hiphil от קום здесь означает привести в исполнение, сделать действенным; по-русски «осуществить намерения» естественнее буквального «утвердить».
- source_word: מְזִמּוֹת לִבּוֹ
  choice: намерений Своего сердца
  rationale: Передаёт обдуманные замыслы и сохраняет библейский образ сердца как средоточия воли и решения.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: В грядущие дни
  rationale: Естественно передаёт широкий пророческий смысл будущего времени, не навязывая узкой эсхатологической схемы.
- source_word: תִּתְבּוֹנְנוּ בָהּ
  choice: вы поймёте это
  rationale: Передаёт достижение понимания через внимательное осмысление; местоимение сохраняет неопределённую отсылку женского суффикса.
theological_decisions:
- issue: Временное выражение בְּאַחֲרִית הַיָּמִים
  choice: В грядущие дни
  alternative: В последние дни; в конце дней
  rationale: Выражение может иметь эсхатологический оттенок, но также обозначает будущее осуществление Божьих замыслов без точного указания срока. Основной текст сохраняет широту смысла, а примечание отмечает более буквальные варианты.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Образность еврейского текста сохранена в выражениях «пылающий гнев» и «намерения Своего сердца»; синтаксис слегка сглажен для ясности.
