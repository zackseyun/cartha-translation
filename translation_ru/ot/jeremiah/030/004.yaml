  text: וְ/אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל יִשְׂרָאֵ֖ל וְ/אֶל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/004.yaml
  text: And these are the words that Yahweh spoke concerning Israel and Judah:[a]
translation:
  language: ru
  text: И вот слова, которые Яхве сказал об Израиле и Иудее:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Израилю и Иудее». Еврейский предлог допускает такое более буквальное прочтение, однако здесь, вероятно, вводит пророчество об обоих народах.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: И вот
  rationale: Союз וְ сохраняет связь с предыдущим контекстом, а «вот» естественно передаёт указательное и вводное значение אֵלֶּה в русском повествовании.
- source_word: הַדְּבָרִים
  choice: слова
  rationale: В формуле, вводящей пророческую речь, דְּבָרִים обозначает прежде всего произнесённые слова, а не дела или события.
- source_word: אֲשֶׁר דִּבֶּר
  choice: которые … сказал
  rationale: Так в современном русском естественно передаётся относительное предложение и глагол דִּבֶּר; вариант «произнёс» был бы стилистически более тяжеловесным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога, обозначенное тетраграмматоном, передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: אֶל יִשְׂרָאֵל וְאֶל יְהוּדָה
  choice: об Израиле и Иудее
  rationale: В данном заголовке אֶל, вероятно, вводит тему последующего пророчества — Израиль и Иудею. Более буквальное понимание «Израилю и Иудее» сохраняется в примечании, поскольку еврейская конструкция допускает его.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения, не подменяя имя титулом.
- issue: Значение אֶל перед «Израилем» и «Иудеей»
  choice: об Израиле и Иудее
  alternative: Израилю и Иудее
  rationale: Контекст вводного заголовка позволяет понимать последующую речь как пророчество об обоих народах, однако предлог может также обозначать адресатов. Эта неоднозначность отмечена, а не устранена без пояснения.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формула пророческого введения. Начальное «И вот» сохраняет связь с предшествующим текстом без излишней архаизации.
