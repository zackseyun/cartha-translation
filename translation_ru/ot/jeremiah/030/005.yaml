  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה ק֥וֹל חֲרָדָ֖ה שָׁמָ֑עְנוּ פַּ֖חַד וְ/אֵ֥ין שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/005.yaml
  text: 'For thus says Yahweh: “We have heard a sound of trembling[a], of fear[b], and there is no peace.”'
translation:
  language: ru
  text: 'Ибо так говорит Яхве:


    «Мы услышали звук трепета:

    страх — и нет мира».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет пояснительную связь с предшествующим контекстом и соответствует возвышенному, но понятному пророческому стилю.
- source_word: כֹה אָמַר
  choice: так говорит
  rationale: Устойчивая формула речи Божьего вестника; настоящее время естественно передаёт действенность пророческого провозглашения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: קוֹל
  choice: голос
  rationale: Слово может означать голос, звук или шум. «Голос смятения» естественно обозначает слышимое выражение всеобщей тревоги и сохраняет образность оригинала.
- source_word: חֲרָדָה
  choice: смятение
  rationale: Передаёт состояние сильной тревоги, сопровождаемой внутренней дрожью; по-русски сочетание «голос смятения» звучит естественнее буквального «голос дрожи».
- source_word: שָׁמָעְנוּ
  choice: слышен
  rationale: Безличная русская конструкция естественно передаёт сообщаемое восприятие звука, хотя формально еврейский глагол стоит в первом лице множественного числа; эта особенность отмечена в сноске.
- source_word: פַּחַד
  choice: страх
  rationale: Прямо передаёт широкий смысл страха или ужаса и вместе со «смятением» усиливает картину бедствия.
- source_word: וְאֵין
  choice: и нет
  rationale: Сохраняет простое еврейское соединение и экзистенциальное отрицание, не вводя дополнительного противопоставления.
- source_word: שָׁלוֹם
  choice: мира
  rationale: В данном контексте означает отсутствие мира, безопасности и благополучия; традиционное «мир» сохраняет ёмкость еврейского понятия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст употребляет тетраграмматон как личное Божье имя; транслитерация «Яхве» сохраняет это различие без замены титулом.
- issue: Говорящий в словах «слышен голос»
  choice: Не уточнять субъект переживания
  alternative: «Мы услышали» с явным первым лицом множественного числа
  rationale: Еврейский текст имеет «мы услышали», но не называет, кто входит в это «мы». Безличная русская конструкция сохраняет неопределённость сцены и не приписывает слова конкретной группе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены краткость, параллелизм и напряжённость еврейской строки; неоднозначность слова קוֹל и формальное первое лицо множественного числа отмечены в сноске.
