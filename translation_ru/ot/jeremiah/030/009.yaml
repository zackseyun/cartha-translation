  yaml_path: translation/ot/jeremiah/030/009.yaml
  text: They will serve Yahweh their God and David their king[a], whom I will raise up for them.
translation:
  language: ru
  text: И будут служить Яхве, своему Богу, и Давиду, своему царю[a], которого Я воздвигну для них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будущему царю из рода Давида». Многие толкователи понимают здесь имя «Давид» как пророческое указание на Мессию, а не на самого Давида.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבְדוּ
  choice: И будут служить
  rationale: Глагол עבד обозначает служение и в контексте завета может включать поклонение; «служить» сохраняет весь диапазон значения. Союз ו передан явно как «и».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֵיהֶם
  choice: своему Богу
  rationale: Возвратное «своему» естественно по-русски соотносит Бога с подразумеваемым подлежащим «они» и передаёт значение суффикса «их».
- source_word: דָּוִד מַלְכָּם
  choice: Давиду, своему царю
  rationale: Имя Давид сохранено буквально; מֶלֶךְ передано как «царь», что удерживает конкретно царский и династический смысл. Приложение обособлено для ясности.
- source_word: אֲשֶׁר אָקִים לָהֶם
  choice: которого Я поставлю над ними
  rationale: Каузативная форма קום может означать «воздвигнуть», «поставить» или «утвердить». В отношении царя русское «поставлю над ними» естественно передаёт назначение правителя; לָהֶם в таком контексте допускает смысл установления царя для народа и над ним.
theological_decisions:
- issue: Кого обозначает выражение «Давид, их царь»
  choice: В основном тексте сохранено буквальное имя «Давид».
  alternative: Будущий царь из рода Давида; в мессианском прочтении — Мессия.
  rationale: Еврейский текст прямо называет Давида, но в пророческом контексте имя может обозначать будущего царя Давидовой линии. Перевод не разрешает эту смысловую напряжённость внутри основного текста, а отмечает её в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским звучанием. Повтор «своему» делает отношения обоих дополнений с подлежащим ясными и естественными.
