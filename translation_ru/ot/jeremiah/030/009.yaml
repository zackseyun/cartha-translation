  source_fidelity: 'Основной смысл передан верно: народ будет служить Яхве, своему Богу, и Давиду, своему царю. Однако «поставлю над ними» добавляет значение власти «над ними», которого в еврейском לָהֶם нет; текст говорит, что Бог воздвигнет/поставит царя «для них».'
