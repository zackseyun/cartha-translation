  text: כָּל מְאַהֲבַ֣יִ/ךְ שְׁכֵח֔וּ/ךְ אוֹתָ֖/ךְ לֹ֣א יִדְרֹ֑שׁוּ כִּי֩ מַכַּ֨ת אוֹיֵ֤ב הִכִּיתִי/ךְ֙ מוּסַ֣ר אַכְזָרִ֔י עַ֚ל רֹ֣ב עֲוֺנֵ֔/ךְ עָצְמ֖וּ חַטֹּאתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/014.yaml
  text: All your lovers have forgotten you[a]; they do not seek you. For I have struck you with the wound of an enemy, with cruel discipline, because of the greatness of your iniquity[b]; your sins are numerous.
translation:
  language: ru
  text: 'Все твои любовники забыли тебя[a], никто из них не ищет тебя. Ведь Я поразил тебя ударом врага, жестоким наказанием[b], за тяжесть твоей вины: твои грехи умножились.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «союзники». Буквально: «любовники»; у Иеремии этот образ может обозначать чужеземные политические и духовные привязанности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «суровым взысканием» или «жестоким наказанием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַהֲבַיִךְ
  choice: твои любовники
  rationale: Сохраняет буквальную брачно-сексуальную метафору Иеремии; в контексте она также может обозначать чужеземных союзников, на которых Иуда полагалась.
- source_word: שְׁכֵחוּךְ
  choice: забыли тебя
  rationale: Прямо передаёт значение שכח, не усиливая его до толковательного «покинули».
- source_word: אוֹתָךְ לֹא יִדְרֹשׁוּ
  choice: никто из них не ищет тебя
  rationale: דרש значит «искать, разыскивать, справляться о ком-либо»; добавление «никто из них» естественно передаёт множественное подлежащее из предыдущей части.
- source_word: מַכַּת אוֹיֵב הִכִּיתִיךְ
  choice: Я поразил тебя, как поражает враг
  rationale: Естественная русская передача внутреннего повтора существительного и глагола от נכה; сравнительный оборот сохраняет образ вражеского удара, не приписывая действие другому субъекту.
- source_word: מוּסַר אַכְזָרִי
  choice: жестокому наказанию
  rationale: מוּסָר охватывает исправление, взыскание и наказание, а אַכְזָרִי подчёркивает беспощадную суровость. «Наказание» здесь естественно для современного русского и не скрывает тяжести суда.
- source_word: עַל רֹב עֲוֺנֵךְ
  choice: за множество твоих беззаконий
  rationale: רֹב выражает многочисленность или обилие, а עָוֹן — беззаконие и связанную с ним вину. Множественное число по-русски естественно согласуется с параллельным упоминанием грехов.
- source_word: עָצְמוּ חַטֹּאתָיִךְ
  choice: так многочисленны твои грехи
  rationale: עצם может указывать на силу, разрастание или многочисленность. В параллелизме с רֹב наиболее естествен смысл многочисленности; формулировка не привносит явно выраженного процесса возрастания.
theological_decisions:
- issue: Кто наносит удар суда
  choice: 'Сохранено прямое Божье действие: «Я поразил тебя».'
  alternative: Представить поражение лишь как действие врага или как безличное последствие.
  rationale: В еврейском тексте Бог прямо назван субъектом формы הִכִּיתִיךְ. Сравнение с врагом описывает характер удара, а не заменяет действующего.
- issue: Основание суда
  choice: Суд прямо связан с множеством беззаконий и грехов народа.
  alternative: Смягчить причинную связь или передать עָוֹן только как уже понесённое наказание.
  rationale: Предлог עַל в контексте и параллельная заключительная часть указывают на грех как основание суда; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение ведётся к Сиону/Иуде как к женщине, поэтому сохранены формы женского рода. Метафора «любовники» оставлена в основном тексте, а политический смысл пояснён в сноске.
