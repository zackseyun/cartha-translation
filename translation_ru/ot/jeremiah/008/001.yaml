id: JER.8.1
reference: Jeremiah 8:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֣יא נְאֻם יְהוָ֡ה ו/יציאו אֶת עַצְמ֣וֹת מַלְכֵֽי יְהוּדָ֣ה וְ/אֶת עַצְמוֹת שָׂרָי/ו֩ וְ/אֶת עַצְמ֨וֹת הַ/כֹּהֲנִ֜ים וְ/אֵ֣ת עַצְמ֣וֹת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת עַצְמ֥וֹת יוֹשְׁבֵֽי יְרוּשָׁלִָ֖ם מִ/קִּבְרֵי/הֶֽם־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/001.yaml
  text: At that time, declares Yahweh, they will bring out the bones of the kings of Judah, the bones of its officials, the bones of the priests, the bones of the prophets, and the bones of the inhabitants of Jerusalem from their graves.
translation:
  language: ru
  text: В то время, — возвещает Яхве, — вынесут из могил кости царей Иудеи, кости её сановников, кости священников, кости пророков и кости жителей Иерусалима.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Устойчивое временное выражение, естественно передающее указание на грядущее событие.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественную пророческую формулу; настоящее время уместно для вводной формулы прямого божественного речения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וְיֹצִיאוּ
  choice: вынесут
  rationale: Каузативная форма означает извлечение костей наружу; неопределённый субъект множественного числа естественно передан русской неопределённо-личной конструкцией.
- source_word: עַצְמוֹת
  choice: кости
  rationale: Конкретное значение и повтор существительного сохранены ради выразительности и нарастающего эффекта перечня.
- source_word: מַלְכֵי יְהוּדָה
  choice: царей Иудеи
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: שָׂרָיו
  choice: её сановников
  rationale: שׂרים обозначает высокопоставленных правителей или должностных лиц; «сановники» соответствует историческому и возвышенному контексту. Местоименный суффикс отнесён к Иудее.
- source_word: הַכֹּהֲנִים
  choice: священников
  rationale: Стандартное обозначение культового служения.
- source_word: הַנְּבִיאִים
  choice: пророков
  rationale: Стандартный эквивалент без необходимости контекстуального уточнения.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִָם
  choice: жителей Иерусалима
  rationale: Естественно передаёт субстантивированное причастие со значением постоянных жителей.
- source_word: מִקִּבְרֵיהֶם
  choice: из могил
  rationale: Предлог מן при глаголе движения передан русским «из»; «могилы» — ясный общий эквивалент קבר.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Повтор слова עַצְמוֹת
  choice: Повторить «кости» перед каждой группой
  alternative: Упомянуть «кости» один раз перед общим перечнем
  rationale: Пятикратный повтор в еврейском тексте усиливает ощущение всеохватного посмертного поругания и потому сохранён.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой речи. Неопределённо-личное «вынесут» сохраняет не названного в оригинале исполнителя. Порядок дополнений слегка приспособлен к русскому синтаксису: «из могил» поставлено перед длинным перечнем, не меняя смысла.'
