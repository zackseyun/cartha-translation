  text: אָסֹ֥ף אֲסִיפֵ֖/ם נְאֻם יְהֹוָ֑ה אֵין֩ עֲנָבִ֨ים בַּ/גֶּ֜פֶן וְ/אֵ֧ין תְּאֵנִ֣ים בַּ/תְּאֵנָ֗ה וְ/הֶֽ/עָלֶה֙ נָבֵ֔ל וָ/אֶתֵּ֥ן לָ/הֶ֖ם יַעַבְרֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/013.yaml
  text: I will surely gather them[a], declares Yahweh. There are no grapes on the vine, and no figs on the fig tree; even the leaf has withered[b], and what I gave them will pass away from them.
translation:
  language: ru
  text: «Я непременно соберу их[a], — возвещает Яхве. — Нет винограда на лозе, нет инжира на смоковнице; даже лист увял, и то, что Я дал им, уйдёт от них[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Я совершенно смету их» или «Я непременно истреблю их». В еврейском тексте употреблена усиленная форма глагола «собирать», которая в контексте суда может подразумевать удаление или гибель.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная часть стиха в еврейском тексте трудна для понимания. Возможно также: «то, что Я дал им, будет у них отнято» или близкое по смыслу выражение.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֲסִיפֵם
  choice: Я непременно соберу их
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает действие. «Соберу» сохраняет основное значение корня אסף, а контекст суда позволяет услышать оттенок удаления или истребления, не закрепляя его однозначно.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную пророческую формулу и сохраняет личное имя Бога, выраженное тетраграмматоном.
- source_word: אֵין עֲנָבִים בַּגֶּפֶן
  choice: Нет винограда на лозе
  rationale: Прямая и естественная передача еврейской бытийной конструкции; «лоза» в контексте однозначно обозначает виноградную лозу.
- source_word: וְאֵין תְּאֵנִים בַּתְּאֵנָה
  choice: нет инжира на смоковнице
  rationale: Сохраняется параллелизм с предыдущей строкой; названия плода и дерева переданы привычными литературными словами.
- source_word: וְהֶעָלֶה נָבֵל
  choice: даже лист увял
  rationale: Единственное число сохранено как собирательный или образный сингуляр; результативное состояние естественно передано прошедшим временем «увял».
- source_word: וָאֶתֵּן לָהֶם
  choice: то, что Я дал им
  rationale: Нейтральная передача широкого по значению נתן не уточняет, идёт ли речь о дарах, установлениях, земле или благословениях.
- source_word: יַעַבְרוּם
  choice: уйдёт от них
  rationale: Трудная и сжатая форма передана через идею удаления, связанную с корнем עבר. Формулировка остаётся читаемой и не превращает неясный текст в слишком определённое «будет отнято».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Смысл усиленного אָסֹף אֲסִיפֵם в контексте суда
  choice: Я непременно соберу их
  alternative: Я совершенно смету их; Я непременно истреблю их
  rationale: Основной текст сохраняет лексический образ собирания, тогда как разрушительный оттенок, вероятный в контексте, отмечен как возможное толкование.
- issue: Смысл заключительной трудной формы יַעַבְרוּם
  choice: то, что Я дал им, уйдёт от них
  alternative: то, что Я дал им, будет у них отнято
  rationale: Выбрана близкая к образу движения формулировка, не устраняющая неясность еврейского синтаксиса и не уточняющая субъект или механизм утраты.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксический параллелизм сельскохозяйственных образов сохранён; архаизмы и конфессионально окрашенные уточнения не вводились. Местоимение «Я» написано с прописной буквы как реплика Бога в принятой русской библейской издательской традиции.
