base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/004.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh: Do people fall and not rise again? Does one turn away and not return?’'
translation:
  language: ru
  text: 'Скажи им: «Так говорит Яхве: разве, упав, не встают? Разве тот, кто отвернулся, не возвращается?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве кто-нибудь повернётся и не вернётся?» В еврейском тексте в этой части дважды употреблён один и тот же глагол, который может означать «поворачиваться» и «возвращаться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Скажи им
  rationale: Перфект с וְ в пророческом поручении передаёт прямое повеление; начальный союз по-русски естественно опустить.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена устойчивая формула речи вестника и личное имя, переданное тетраграмматоном.
- source_word: הֲיִפְּלוּ וְלֹא יָקוּמוּ
  choice: разве, упав, не встают?
  rationale: Риторический вопрос передан естественной русской безлично-обобщённой конструкцией; קום обозначает вставание после падения.
- source_word: אִם יָשׁוּב וְלֹא יָשׁוּב
  choice: Разве, свернув с пути, не возвращаются?
  rationale: אִם здесь вводит параллельный риторический вопрос. Два употребления שוב имеют контекстуально различимые оттенки — отклониться и возвратиться; их формальное повторение отмечено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Смысл повторения שוב
  choice: свернув с пути — возвращаются
  alternative: повернув назад — возвращаются; отвратившись — обращаются
  rationale: Перевод сохраняет напряжение между отклонением от пути и последующим возвращением, не сводя фразу исключительно к богословскому обращению.
translation_notes:
  register: Современный литературный русский язык; краткая, риторически выразительная пророческая речь. Обобщённый субъект оставлен невыраженным, что естественно для русского и соответствует общему смыслу формы множественного числа.
