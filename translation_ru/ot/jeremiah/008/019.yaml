  text: הִנֵּה ק֞וֹל שַֽׁוְעַ֣ת בַּת עַמִּ֗/י מֵ/אֶ֨רֶץ֙ מַרְחַקִּ֔ים הַֽ/יהוָה֙ אֵ֣ין בְּ/צִיּ֔וֹן אִם מַלְכָּ֖/הּ אֵ֣ין בָּ֑/הּ מַדּ֗וּעַ הִכְעִס֛וּ/נִי בִּ/פְסִלֵי/הֶ֖ם בְּ/הַבְלֵ֥י נֵכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/019.yaml
  text: 'Look—the cry of the daughter of my people from a distant land: “Is Yahweh not in Zion? Is her King not in her?” Why have they provoked me to anger with their carved images[c][b][a], with foreign idols?'
translation:
  language: ru
  text: 'Вот, слышен вопль[a] дочери Моего народа из далёкой земли[b]:


    «Разве Яхве нет на Сионе?

    Разве в Сионе нет её царя?»


    Почему они прогневили Меня своими резными изваяниями,

    чужеземными идолами[c]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «голос вопля дочери Моего народа».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из земли далей», то есть из очень далёкой земли.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чужеземными ничтожествами». Еврейское выражение высмеивает идолов как пустых и ничего не стоящих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт внезапное привлечение внимания и сохраняет возвышенный, но понятный современному читателю тон.
- source_word: קוֹל שַׁוְעַת
  choice: доносится вопль
  rationale: Буквально сочетание означает «звук/голос вопля». Русское «доносится вопль» естественно передаёт и слышимый голос, и отчаянный крик о помощи.
- source_word: בַּת עַמִּי
  choice: дочь Моего народа
  rationale: Сохранена пророческая поэтическая метафора общины как дочери, без сведения её к общему выражению «Мой народ».
- source_word: מֵאֶרֶץ מַרְחַקִּים
  choice: из далёкой земли
  rationale: Форма множественного числа מַרְחַקִּים идиоматически подчёркивает большую удалённость; естественный русский эквивалент — «из далёкой земли».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֵין בְּצִיּוֹן
  choice: Разве Яхве нет на Сионе?
  rationale: Отрицательная экзистенциальная конструкция передана как естественный русский риторический вопрос.
- source_word: אִם מַלְכָּהּ אֵין בָּהּ
  choice: Разве Царя Сиона нет в нём?
  rationale: אִם вводит второй параллельный вопрос. Притяжательный суффикс относится к Сиону; повтор названия вместо местоимения «её» устраняет неестественную для русского языка смену грамматического рода, а «в нём» сохраняет пространственный образ.
- source_word: הִכְעִסוּנִי
  choice: прогневили Меня
  rationale: 'Русский каузативный глагол ясно передаёт значение породы hифиль: они вызвали Божий гнев.'
- source_word: בִּפְסִלֵיהֶם
  choice: своими резными изваяниями
  rationale: Сохраняется конкретное значение פֶּסֶל — вырезанное или высеченное культовое изображение, а не только более общее «идол».
- source_word: בְּהַבְלֵי נֵכָר
  choice: чужеземными идолами
  rationale: В полемике против идолопоклонства הֶבֶל обозначает нечто пустое и ничтожное и метонимически — идолов; основной текст делает предмет ясным, а сноска сохраняет уничижительный образ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула и не добавляет конфессионально обусловленной замены.
- issue: Кто назван «Царём» Сиона
  choice: «Царь» с прописной буквы как параллельное обозначение Яхве
  alternative: «царь» со строчной буквы как возможное указание на земного правителя
  rationale: Параллелизм вопросов — «Яхве ... на Сионе?» и «Царя Сиона ... в нём?» — наиболее естественно указывает на одного и того же божественного Правителя. При этом перевод не добавляет Его имени во второй строке.
- issue: Разграничение голосов в стихе
  choice: Вопросы народа и ответ Бога оформлены отдельными кавычками
  alternative: Считать весь фрагмент одной непрерывной речью
  rationale: Переход к первому лицу «Меня» после вопросов о Яхве естественно сигнализирует ответ Бога. Пунктуация показывает смену говорящего, не вводя пояснительных слов, отсутствующих в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой поэтичности. Инверсия сведена к минимуму; «доносится вопль» естественно связывает слышимый крик с далёкой землёй. Прописные буквы в «Моего», «Меня» и «Царя» помогают различать божественного говорящего и референта, не заменяя прямых образов исходного текста.
