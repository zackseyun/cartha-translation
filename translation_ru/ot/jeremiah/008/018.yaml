lexical_decisions:
- source_word: מַבְלִיגִיתִי
  choice: нет мне облегчения
  rationale: Редкая и трудная форма связана с представлением об облегчении, утешении или восстановлении сил. Отрицательная формулировка естественно передаёт в контексте плача отсутствие желанного облегчения, не сводя значение к одной узкой метафоре.
- source_word: עֲלֵי יָגוֹן
  choice: от скорби
  rationale: Предлог עֲלֵי буквально означает «на/над», но в этой сжатой поэтической фразе связь со скорбью допускает передачу причины или состояния. «От скорби» ясно выражает источник душевного страдания.
- source_word: עָלַי לִבִּי דַוָּי
  choice: сердце моё болит во мне
  rationale: דַוָּי обозначает болезненное, немощное состояние; применительно к сердцу русское «болит» сохраняет и образ болезни, и глубокую внутреннюю муку. עָלַי передано идиоматически как «во мне».
