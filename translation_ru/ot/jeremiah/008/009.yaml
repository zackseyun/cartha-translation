id: JER.8.9
reference: Jeremiah 8:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֹבִ֣ישׁוּ חֲכָמִ֔ים חַ֖תּוּ וַ/יִּלָּכֵ֑דוּ הִנֵּ֤ה בִ/דְבַר יְהוָה֙ מָאָ֔סוּ וְ/חָכְמַֽת מֶ֖ה לָ/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/009.yaml
  text: The wise men are put to shame; they are dismayed and captured. Look[a], they have rejected the word of Yahweh, so what wisdom do they have?
translation:
  language: ru
  text: Мудрецы опозорены, повергнуты в смятение и пойманы[a]. Вот, они отвергли слово Яхве — какая же у них мудрость?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «схвачены»; еврейский глагол может означать захват или попадание в ловушку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: опозорены
  rationale: Форма передаёт публичное посрамление и разоблачение несостоятельности мудрецов, а не только внутреннее чувство стыда.
- source_word: חֲכָמִים
  choice: мудрецы
  rationale: Существительное обозначает признанных мудрых наставников или представителей круга мудрецов; «мудрецы» естественно и точно передаёт это значение по-русски.
- source_word: חַתּוּ
  choice: повергнуты в смятение
  rationale: Глагол выражает утрату мужества, потрясение и растерянность; выбранная формулировка сохраняет силу образа и звучит естественно в пророческой речи.
- source_word: וַיִּלָּכֵדוּ
  choice: и пойманы[a]
  rationale: Глагол לכד может означать захват или попадание в ловушку. «Пойманы» сохраняет оба смысловых оттенка; альтернативы указаны в сноске.
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательная частица привлекает внимание к следующему объяснению и естественно передаётся современным русским «вот».
- source_word: בִדְבַר יְהוָה
  choice: слово Яхве
  rationale: דבר в пророческом контексте означает данное Богом слово или весть; «слово» сохраняет устойчивую библейскую формулировку, а имя יהוה передано как «Яхве».
- source_word: מָאָסוּ
  choice: отвергли
  rationale: מאס обозначает сознательное отвержение или отказ, а не простую неприязнь.
- source_word: וְחָכְמַת מֶה לָהֶם
  choice: какая же у них мудрость?
  rationale: Риторический вопрос ставит под сомнение саму мудрость тех, кто отверг слово Яхве. Частица «же» естественно выражает вывод и укор.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл заключительного риторического вопроса
  choice: какая же у них мудрость?
  alternative: что для них мудрость?
  rationale: Выбранный вариант сохраняет риторическое отрицание их притязаний на мудрость, не добавляя утверждения, будто у них вообще отсутствуют знания или способности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Краткие параллельные формулировки сохраняют резкость обличения; архаизмы и конфессионально окрашенные добавления исключены.
