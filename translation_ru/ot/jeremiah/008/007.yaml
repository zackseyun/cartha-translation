  text: גַּם חֲסִידָ֣ה בַ/שָּׁמַ֗יִם יָֽדְעָה֙ מֽוֹעֲדֶ֔י/הָ וְ/תֹ֤ר ו/סוס וְ/עָג֔וּר שָׁמְר֖וּ אֶת עֵ֣ת בֹּאָ֑/נָה וְ/עַמִּ֕/י לֹ֣א יָֽדְע֔וּ אֵ֖ת מִשְׁפַּ֥ט יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/007.yaml
  text: Even the stork in the heavens knows her appointed times, and the turtledove, the swift, and the crane keep the time of their coming; but my people do not know the judgment of the LORD.
translation:
  language: ru
  text: Даже аист в небесах знает свои сроки, и горлица, стриж[a] и журавль не пропускают срока своего прилёта; а мой народ не знает суда ГОСПОДА[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Точная идентификация названной здесь птицы не вполне ясна; возможен также перевод: «ласточка».'
    reason: Еврейское סוּס как название птицы редкое и допускает разные идентификации.
  - marker: b
    text: 'Или: «установления ГОСПОДА»; еврейское слово может означать также Его правосудие или судебное решение.'
    reason: Сохраняет смысловую широту מִשְׁפָּט и не сводит выражение только к одному богословскому толкованию.
lexical_decisions:
- source_word: חֲסִידָה
  choice: аист
  rationale: Обычное и надёжно засвидетельствованное значение еврейского названия перелётной птицы.
- source_word: מוֹעֲדֶיהָ
  choice: свои сроки
  rationale: Передаёт множественное число и смысл назначенных, регулярно наступающих времён миграции.
- source_word: תֹר
  choice: горлица
  rationale: Устойчивое соответствие названию этой перелётной птицы.
- source_word: סוס
  choice: стриж
  rationale: По контексту обозначает перелётную птицу; перевод «стриж» следует принятой здесь идентификации, хотя точный вид спорен.
- source_word: עָגוּר
  choice: журавль
  rationale: Традиционная и контекстуально уместная идентификация птицы, при некоторой лексикографической неуверенности.
- source_word: שָׁמְרוּ אֶת־עֵת בֹּאָנָה
  choice: соблюдают время своего прилёта
  rationale: Сохраняет образ птиц, придерживающихся установленного времени возвращения; «прилёт» естественен по-русски в контексте миграции.
- source_word: מִשְׁפַּט יְהוָה
  choice: суда ГОСПОДА
  rationale: '«Суд» сохраняет широту מִשְׁפָּט: судебное решение, справедливый порядок или требование Бога; передача יהוה как «ГОСПОДЬ» соответствует принятой русской библейской традиции.'
theological_decisions:
- issue: Значение מִשְׁפַּט יְהוָה
  choice: суда ГОСПОДА
  alternative: установления ГОСПОДА / правосудия ГОСПОДА
  rationale: Контекст допускает как Божье решение и грядущий суд, так и установленный Им справедливый порядок. «Суд» не устраняет эту богословскую напряжённость, а примечание раскрывает диапазон.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм оригинала сохранён; «в небе» и «время своего прилёта» выбраны как естественные русские формулировки. Имя יהוה передано традиционным «ГОСПОДЬ» прописными буквами.
