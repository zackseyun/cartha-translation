  source_fidelity: 'Основной смысл передан точно: аист знает назначенные сроки, перечисленные птицы соблюдают срок своего прихода, тогда как народ не знает מִשְׁפַּט יהוה. Однако «в небе» в русском несколько менее естественно для местонахождения птицы, чем «в небесах», а глагол «соблюдают» применительно к птицам может звучать так, будто речь идёт о сознательном исполнении правила. «Хранят/соблюдают срок» буквально возможно, но «не пропускают времени» передаёт образ естественно и сохраняет метафорическое противопоставление.'
