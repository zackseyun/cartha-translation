id: JER.8.11
reference: Jeremiah 8:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יְרַפּ֞וּ אֶת שֶׁ֤בֶר בַּת עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/011.yaml
  text: They have treated the wound of the daughter of my people lightly[a], saying, ‘Peace[b], peace,’ when there is no peace.
translation:
  language: ru
  text: 'Они лечат рану дочери моего народа лишь поверхностно[a], говоря: «Мир[b], мир», — хотя мира нет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несерьёзно», «словно это пустяк».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово шалом может также означать благополучие, целостность и безопасность.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַפּוּ
  choice: лечат
  rationale: Глагол רפא буквально означает «исцелять, лечить». Настоящее время естественно передаёт продолжающееся обличение, а «лечат» сохраняет медицинский образ, не утверждая, что исцеление действительно достигнуто.
- source_word: שֶׁבֶר
  choice: рана
  rationale: Слово может обозначать перелом, сокрушение, бедствие или ущерб. В сочетании с רפא на первый план выходит образ телесного повреждения; «рана» звучит естественно и сохраняет метафору.
- source_word: בַּת עַמִּי
  choice: дочь моего народа
  rationale: 'Сохранено пророческое олицетворение народа как дочери; в косвенном падеже: «дочери моего народа».'
- source_word: עַל נְקַלָּה
  choice: лишь поверхностно
  rationale: Оборот указывает на несерьёзное, поверхностное отношение к тяжёлой ране. Частица «лишь» подчёркивает недостаточность такого лечения.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Естественно вводит содержание ложного заверения.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: Мир, мир
  rationale: Сохранены ключевое слово и его повтор, придающий заверению характер настойчивого лозунга.
- source_word: וְאֵין שָׁלוֹם
  choice: хотя мира нет
  rationale: Передаёт резкое несоответствие между провозглашённым заверением и действительностью; возможен и более буквальный противительный вариант «но мира нет».
theological_decisions:
- issue: Сохранение пророческого олицетворения
  choice: «дочь моего народа» сохранено в основном тексте
  alternative: «мой народ» или «мой дорогой народ»
  rationale: Образ дочери несёт эмоциональную и пророческую выразительность исходного текста; его устранение неоправданно сгладило бы метафору.
- issue: Передача שָׁלוֹם
  choice: «мир» в основном тексте
  alternative: «благополучие», «безопасность» или «всё хорошо»
  rationale: «Мир» сохраняет традиционное основное значение и повтор исходного текста, тогда как более широкий смысл слова отмечен в сноске без сужения богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Медицинская метафора и олицетворение сохранены; синтаксис сделан естественным для современного читателя. Местоимение «моего» дано со строчной буквы в соответствии с нейтральной современной издательской нормой.
