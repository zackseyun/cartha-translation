  text: וּ/שְׁטָחוּ/ם֩ לַ/שֶּׁ֨מֶשׁ וְ/לַ/יָּרֵ֜חַ וּ/לְ/כֹ֣ל צְבָ֣א הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר אֲהֵב֜וּ/ם וַ/אֲשֶׁ֤ר עֲבָדוּ/ם֙ וַֽ/אֲשֶׁר֙ הָלְכ֣וּ אַֽחֲרֵי/הֶ֔ם וַ/אֲשֶׁ֣ר דְּרָשׁ֔וּ/ם וַ/אֲשֶׁ֥ר הִֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם לֹ֤א יֵאָֽסְפוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְיֽוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/002.yaml
  text: And they will spread them out before the sun and the moon and all the host of the heavens[a], which they loved and which they served and after which they walked and which they sought and to which they bowed down. They will not be gathered, and they will not be buried[c][b]; they will become dung on the surface of the ground.
translation:
  language: ru
  text: И разложат их перед солнцем, луной и всем небесным воинством — теми, кого они любили, кому служили, за кем следовали, кого искали[a] и перед кем преклонялись. Их не соберут и не похоронят; они станут навозом на поверхности земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «к которым обращались» или «которых вопрошали»; речь может идти о религиозном обращении к небесным телам за ответом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на лице земли».'
    reason: literal_rendering
lexical_decisions:
- source_word: וּשְׁטָחוּם
  choice: и разложат их
  rationale: 'Глагол שׁטח передаёт конкретный образ: останки разложат и оставят открытыми. «Разложат» естественно по-русски и не сводит действие к простому разбрасыванию.'
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: перед солнцем, луной
  rationale: Предлог ל здесь обозначает выставление останков перед небесными телами, а не движение к ним.
- source_word: וּלְכֹל צְבָא הַשָּׁמַיִם
  choice: и всем воинством небесным
  rationale: «Воинство небесное» сохраняет образ צבא и ясно указывает на совокупность небесных тел как предметов почитания.
- source_word: אֲשֶׁר אֲהֵבוּם וַאֲשֶׁר עֲבָדוּם
  choice: которые они любили, которым служили
  rationale: Различие между любовью и служением сохранено; «служили» допускает культовый смысл, не подменяя его следующим глаголом поклонения.
- source_word: וַאֲשֶׁר הָלְכוּ אַחֲרֵיהֶם
  choice: за которыми следовали
  rationale: Естественно передаёт еврейскую идиому «ходить вслед за», то есть следовать в верности или преданности.
- source_word: וַאֲשֶׁר דְּרָשׁוּם
  choice: которых искали
  rationale: Сохраняет широкое значение דרשׁ — искать, обращаться с вопросом, вопрошать — без ограничения смысла исключительно гадательной практикой; варианты разъяснены в сноске.
- source_word: וַאֲשֶׁר הִשְׁתַּחֲווּ לָהֶם
  choice: и перед которыми преклонялись
  rationale: Передаёт телесный жест почитания и сохраняет его отличие от ранее названного служения.
- source_word: לֹא יֵאָסְפוּ וְלֹא יִקָּבֵרוּ
  choice: их не соберут и не похоронят
  rationale: В погребальном контексте אָסף относится к собиранию останков; активная неопределённо-личная конструкция звучит естественно по-русски и сохраняет смысл пассива.
- source_word: לְדֹמֶן
  choice: навозом
  rationale: Прямое и резкое обозначение нечистоты и бесчестия, соответствующее пророческому образу.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: на поверхности земли
  rationale: Естественная русская передача идиомы «на лице земли»; буквальная форма отмечена в сноске.
theological_decisions:
- issue: Последовательность глаголов, описывающих почитание небесных тел
  choice: 'Сохранить отдельные действия: любили / служили / следовали / искали / преклонялись'
  alternative: Объединить несколько глаголов общим словом «поклонялись»
  rationale: Накопление разных глаголов подчёркивает всеохватную преданность народа небесным телам. Их разграничение сохраняет силу обвинения и не сглаживает текст.
- issue: Значение צְבָא הַשָּׁמַיִם
  choice: всё воинство небесное
  alternative: все небесные светила
  rationale: Выбранная передача сохраняет исходный образ «воинства» и не ограничивает обозначение только видимыми светилами.
- issue: Значение דְּרָשׁוּם в культовом контексте
  choice: которых искали
  alternative: к которым обращались / которых вопрошали
  rationale: Основной текст сохраняет возможную многозначность между религиозным стремлением и обращением за ответом; более узкие варианты приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический повтор сохранён ради риторической силы, но формулировки остаются понятными современному читателю. «Воинство небесное» оставлено как прозрачный библейский образ; резкое «навозом» не смягчено.
