  source_fidelity: 'Основной текст точно передаёт последовательность действий по отношению к небесным телам и образ посмертного бесчестия: останки будут выставлены перед небесными объектами, не будут собраны или погребены и окажутся навозом на земле. «Разложат», «служили», «следовали», «искали» и «преклонялись» удачно сохраняют различия еврейских глаголов. «Навозом» соответствует לְדֹמֶן и не смягчает образ.'
