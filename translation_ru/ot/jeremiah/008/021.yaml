  yaml_path: translation/ot/jeremiah/008/021.yaml
  text: For the brokenness of the daughter of my people I am broken[a]; I mourn[c][b]; horror has seized me.
translation:
  language: ru
  text: Из-за сокрушения дочери моего народа[a] я сокрушён[b]; я мрачен[c], ужас объял меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дочь моего народа» — пророческая персонификация народа; этот образ сохранён, а не заменён пересказом «мой народ».
    reason: cultural_note
  - marker: b
    text: 'Или: «я разбит». В еврейском тексте слова «сокрушение» и «я сокрушён» образованы от одного корня, создавая намеренный повтор.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «я скорблю» или «я хожу в скорби». Еврейский глагол связан с образом потемнения, выражающим скорбь и уныние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: из-за
  rationale: Предлог вводит причину скорби говорящего; «из-за» естественно и ясно передаёт причинное значение.
- source_word: שֶׁבֶר
  choice: сокрушение
  rationale: Слово обозначает разрушение, перелом или крушение. «Сокрушение» передаёт бедствие народа и позволяет сохранить корневой повтор со сказуемым «я сокрушён».
- source_word: בַּת עַמִּי
  choice: дочь моего народа
  rationale: Сохранена традиционная пророческая персонификация народа как дочери, без поясняющей подмены метафоры.
- source_word: הָשְׁבָּרְתִּי
  choice: я сокрушён
  rationale: Форма от того же корня, что и שֶׁבֶר; русский корневой повтор «сокрушение — сокрушён» воспроизводит намеренную игру слов и выражает состояние говорящего.
- source_word: קָדַרְתִּי
  choice: я помрачён
  rationale: Глагол соединяет образ потемнения с состоянием скорби. «Помрачён» сохраняет образ и остаётся понятным в контексте плача.
- source_word: שַׁמָּה
  choice: ужас
  rationale: Здесь существительное обозначает потрясение и оцепеняющий ужас, охвативший говорящего.
- source_word: הֶחֱזִקַתְנִי
  choice: объял меня
  rationale: Каузативная форма חזק передаёт то, что ужас властно овладел говорящим; «объял меня» звучит естественно, выразительно и достойно.
theological_decisions:
- issue: К кому относится выражение «дочь моего народа»
  choice: Сохранить коллективную персонификацию без уточнения референта в основном тексте.
  alternative: Передать как «мой народ» или прямо назвать Иудею/Израиль.
  rationale: Еврейский текст представляет народ в образе дочери; конкретизирующая парафраза устранила бы поэтический образ и могла бы сузить сохраняемую текстом референцию.
translation_notes:
  register: Современный литературный русский с достоинством пророческого плача. Корневой повтор «сокрушение — сокрушён» сохраняет поэтическую связь оригинала; «помрачён» удерживает образ тьмы, не делая строку непонятной.
