base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/017.yaml
  text: For behold[a], I am sending among you snakes, vipers that cannot be charmed, and they will bite you[b], declares Yahweh.
translation:
  language: ru
  text: Ибо вот, Я посылаю в вашу среду змей — гадюк[a], на которых не действует заклинание[b]; они укусят вас, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово обозначает ядовитую змею; точный вид неясен. Возможный перевод: «аспидов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для которых нет заговора (или заклинания)»; смысл в том, что на таких змей не действует заклинание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет причинно-пояснительную связь с предшествующим контекстом и соответствует возвышенному, но современному пророческому стилю.
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Передаёт указательную и усилительную функцию конструкции без излишне архаичного оборота.
- source_word: מְשַׁלֵּחַ
  choice: посылаю
  rationale: Причастная форма при הִנְנִי выражает близкое и несомненное действие; настоящее время естественно передаёт эту силу по-русски.
- source_word: בָּכֶם
  choice: в вашу среду
  rationale: 'Сохраняет пространственный смысл: змеи будут пущены внутрь сообщества; при этом контекст суда не требуется дополнительно разъяснять.'
- source_word: נְחָשִׁים
  choice: змей
  rationale: Прямое и общепонятное современное соответствие.
- source_word: צִפְעֹנִים
  choice: ядовитых гадюк
  rationale: Слово обозначает опасных ядовитых змей, но точный биологический вид неясен; «гадюк» естественно передаёт образ, а «ядовитых» явно выражает угрозу.
- source_word: אֲשֶׁר אֵין לָהֶם לָחַשׁ
  choice: которые не поддаются заговорам
  rationale: Буквально речь идёт об отсутствии действенного заговора или заклинания; формулировка передаёт невозможность укротить змей таким способом, не устраняя культурный образ.
- source_word: וְנִשְּׁכוּ אֶתְכֶם
  choice: и они укусят вас
  rationale: Глагол נָשַׁךְ конкретно означает укус; будущее время передаёт предстоящее последствие Божьего действия.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет весомую пророческую формулу и непосредственно передаёт личное имя יהוה как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет явленное личное имя, не смешивая его с титулом.
- issue: Характер угрозы в образе змей
  choice: Неустранимость угрозы выражена как неподвластность заговорам
  alternative: Невозможность приручить или заклясть змей
  rationale: Текст использует конкретное слово לַחַשׁ, связанное с заговором или заклинанием; перевод сохраняет этот образ и не сводит его к общему понятию неконтролируемости.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Ибо вот» сохраняет связь с контекстом и торжественную настоятельность; «в вашу среду» несколько формальнее разговорного «к вам», зато точнее передаёт בָּכֶם. Заглавная буква в «Я» отражает прямую речь Бога по принятой русской издательской традиции.
