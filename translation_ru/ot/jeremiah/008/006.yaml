  text: הִקְשַׁ֤בְתִּי וָֽ/אֶשְׁמָע֙ לוֹא כֵ֣ן יְדַבֵּ֔רוּ אֵ֣ין אִ֗ישׁ נִחָם֙ עַל רָ֣עָת֔/וֹ לֵ/אמֹ֖ר מֶ֣ה עָשִׂ֑יתִי כֻּלֹּ֗/ה שָׁ֚ב ב/מרצות/ם כְּ/ס֥וּס שׁוֹטֵ֖ף בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/006.yaml
  text: 'I have paid attention and listened: they do not speak rightly[a]. No man repents of his evil, saying, ‘What have I done?’ Every one turns in his own course[c][b], like a horse rushing into battle.'
translation:
  language: ru
  text: 'Я внимал и слушал: не так они говорят[a]. Никто[b] не раскаивается в своём зле, говоря: «Что я сделал?» Каждый вновь устремляется по своему пути[c], как конь, несущийся в сражение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они не говорят того, что правильно». Буквально: «не так они говорят».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «нет человека». Еврейское слово имеет форму мужского рода, но употреблено здесь обобщённо.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Каждый возвращается к своему бегу» или «на свой путь». Еврейское выражение связано с бегом и изображает неудержимое следование избранному пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשַׁבְתִּי וָאֶשְׁמָע
  choice: Я внимательно прислушивался и слушал
  rationale: Первый глагол выражает напряжённое внимание, а второй — слушание или слышание. Сочетание двух русских глаголов сохраняет усиление оригинала, не сводя его к простому восприятию звука.
- source_word: לוֹא כֵן יְדַבֵּרוּ
  choice: не так они говорят
  rationale: 'Буквальное и намеренно открытое выражение: оно может указывать как на неправильность содержания их речи, так и на отсутствие ожидаемых слов покаяния. Более истолковывающее «они не говорят правды» в основной текст не внесено.'
- source_word: אֵין אִישׁ
  choice: Никто
  rationale: Идиоматическое русское соответствие отрицательной конструкции с אישׁ. Еврейское существительное имеет форму мужского рода, но в данном обобщении обозначает любого человека; это отмечено в сноске.
- source_word: נִחָם עַל רָעָתוֹ
  choice: не раскаивается в своём зле
  rationale: נחם в этом нравственном контексте означает сожаление и перемену отношения к содеянному, а רעה — зло или дурной поступок, а не бедствие.
- source_word: לֵאמֹר מֶה עָשִׂיתִי
  choice: 'говоря: «Что я сделал?»'
  rationale: Сохранён прямой вопрос самообличения без добавления слова «плохого», которого нет в оригинале.
- source_word: כֻּלֹּה שָׁב בְמְרוּצוֹתָם
  choice: Каждый возвращается к своему бегу
  rationale: Передана распределительная сила «каждый», многозначность שׁוב как возвращения и образ מרוצה — бега, стремительного движения или избранного хода. Лёгкая необычность русского оборота поддерживает последующее сравнение с конём.
- source_word: כְּסוּס שׁוֹטֵף בַּמִּלְחָמָה
  choice: как конь, несущийся в битву
  rationale: Причастие שׁוֹטֵף изображает бурное, неудержимое движение; «несущийся» естественно по-русски и сохраняет силу сравнения.
theological_decisions:
- issue: Смысл покаяния в נִחָם
  choice: раскаивается
  alternative: сожалеет
  rationale: Контекст говорит не только о чувстве сожаления, но и о нравственном отвращении от собственного зла. При этом перевод не добавляет утверждения о состоявшемся исправлении поведения.
- issue: Обобщающее אישׁ в форме мужского рода
  choice: Никто
  alternative: Ни один человек / ни один мужчина
  rationale: В этой отрицательной обобщающей конструкции אישׁ имеет представительное значение. «Никто» точно и естественно передаёт объём высказывания, тогда как «ни один мужчина» ошибочно сузило бы его по полу.
- issue: Направленность שָׁב
  choice: возвращается к своему бегу
  alternative: сворачивает на свой путь
  rationale: Сохранено основное значение «возвращаться», однако контекст ясно отличает это возвращение к прежнему стремительному пути от покаянного обращения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «прислушивался и слушал» и несколько необычное «к своему бегу» намеренно сохраняют риторическую настойчивость и образность еврейского текста; пунктуация делает длинную фразу доступной при чтении вслух.
