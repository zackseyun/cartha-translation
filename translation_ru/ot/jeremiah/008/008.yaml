source:
  edition: WLC
  text: אֵיכָ֤ה תֹֽאמְרוּ֙ חֲכָמִ֣ים אֲנַ֔חְנוּ וְ/תוֹרַ֥ת יְהוָ֖ה אִתָּ֑/נוּ אָכֵן֙ הִנֵּ֣ה לַ/שֶּׁ֣קֶר עָשָׂ֔ה עֵ֖ט שֶׁ֥קֶר סֹפְרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/008.yaml
  text: How can you say[a], ‘We are wise, and the law of Yahweh is with us’? But look, the lying pen of the scribes has made it into a lie.
translation:
  language: ru
  text: 'Как вы можете говорить: «Мы мудры, и Закон Яхве с нами»? Но вот: лживое перо писцов сделало ложью.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза очень сжата; прямой объект глагола не выражен и по контексту может относиться к Закону Яхве. Возможны также переводы: «Но вот, перо писцов создало ложь» или «лживое перо писцов действовало лживо».'
    reason: Лексические и синтаксические связи в выражении לַשֶּׁקֶר עָשָׂה עֵט שֶׁקֶר סֹפְרִים допускают несколько способов передать обвинение в фальсификации.
lexical_decisions:
- source_word: אֵיכָה
  choice: Как вы можете
  rationale: Передаёт не просто вопрос «как?», а возмущённое недоверие говорящего и естественно звучит по-русски.
- source_word: חֲכָמִים אֲנַחְנוּ
  choice: Мы мудры
  rationale: Сохраняет прямое заявление о мудрости без более узкого и стилистически маркированного слова «мудрецы».
- source_word: תּוֹרַת יְהוָה
  choice: Закон Яхве
  rationale: תורה может означать «наставление» или «учение», однако здесь выражение имеет также заветный и письменный смысл; «Закон» сохраняет эту смысловую связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אִתָּנוּ
  choice: с нами
  rationale: Буквально и без излишнего истолкования передаёт заявление говорящих о наличии у них Закона Яхве.
- source_word: אָכֵן הִנֵּה
  choice: Но вот
  rationale: Передаёт и резкий поворот к опровержению, и призыв обратить внимание; соответствует современному литературному русскому.
- source_word: לַשֶּׁקֶר
  choice: в ложь
  rationale: Передаёт возможный результативный смысл конструкции и сохраняет повтор мотива лжи.
- source_word: עָשָׂה
  choice: превратило
  rationale: В сочетании «превратило его в ложь» естественно выражает результативное значение «сделало ложью».
- source_word: עֵט שֶׁקֶר סֹפְרִים
  choice: лживое перо писцов
  rationale: Сохраняет сжатый образ письменного орудия писцов, охарактеризованного ложью; иные способы синтаксического членения отмечены в сноске.
theological_decisions:
- issue: Передача תּוֹרַת יְהוָה в пророческом обличении
  choice: Закон Яхве
  alternative: учение Яхве; наставление Яхве
  rationale: Контекст связывает тору Яхве с деятельностью писцов и заветным авторитетом. «Закон» сохраняет оба оттенка, а сноска не требуется, поскольку альтернативы не меняют основного обвинения.
- issue: Неявный объект глагола עָשָׂה
  choice: его — Закон Яхве
  alternative: 'Не указывать объект: «перо писцов действовало лживо»'
  rationale: В основном тексте местоимение проясняет наиболее вероятную контекстуальную связь с Законом, но сжатость еврейской конструкции и иные её прочтения сохранены в сноске.
translation_notes:
  register: Современный литературный русский с ясной, но достойной пророческой интонацией. «Но вот» предпочтено архаизирующему «но вот, воистину» или «се». Кавычки и прописная буква в слове «Закон» помогают ясно представить цитируемое притязание и конкретный авторитетный корпус наставления.
