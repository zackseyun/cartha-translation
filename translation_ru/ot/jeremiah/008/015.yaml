  text: קַוֵּ֥ה לְ/שָׁל֖וֹם וְ/אֵ֣ין ט֑וֹב לְ/עֵ֥ת מַרְפֵּ֖ה וְ/הִנֵּ֥ה בְעָתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/015.yaml
  text: We hoped for peace[a], but there was no good; for a time of healing, but behold[c][b], terror.
translation:
  language: ru
  text: Мы надеялись на мир[a], но добра не было; на время исцеления — но вот ужас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мы ждали мира» / «Мы ожидали мира». Слово также может означать благополучие и целостность, а не только отсутствие войны.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «смятение», «испуг».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֵּה
  choice: Мы надеялись
  rationale: Форма сама по себе допускает неоднозначность, однако в контексте это коллективный плач от первого лица; прошедшее время естественно передаёт несбывшееся ожидание.
- source_word: לְשָׁלוֹם
  choice: на мир
  rationale: שָׁלוֹם означает мир, благополучие и целостность. «Мир» кратко и естественно сохраняет основной смысл, а его более широкий объём отмечен в сноске.
- source_word: וְאֵין טוֹב
  choice: но добра не было
  rationale: 'Буквально: «и нет добра». Союз «но» передаёт очевидное противопоставление ожидания и действительности, не добавляя нового содержания.'
- source_word: לְעֵת מַרְפֵּה
  choice: на время исцеления
  rationale: מַרְפֵּה может обозначать исцеление, выздоровление или восстановление; выбранный вариант сохраняет временную конструкцию и широту метафоры.
- source_word: וְהִנֵּה
  choice: но вот
  rationale: הִנֵּה внезапно предъявляет противоположную реальность. Русское «но вот» естественно передаёт и указательность, и резкий поворот.
- source_word: בְעָתָה
  choice: ужас
  rationale: Существительное обозначает ужас, испуг или смятение. «Ужас» звучит весомо и создаёт резкий контраст с ожидаемым исцелением.
