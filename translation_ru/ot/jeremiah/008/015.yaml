  source_fidelity: 'Текст точно передаёт две параллельные части еврейского плача: несбывшееся ожидание мира/блага и исцеления, за которым обнаруживается ужас. Прошедшее «Мы надеялись» оправдано контекстом коллективного плача; «но» уместно выражает контраст, хотя в еврейском стоит союз ו. «Но вот» адекватно передаёт внезапно-предъявляющее וְהִנֵּה.'
