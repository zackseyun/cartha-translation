base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/005.yaml
  text: Why has this people turned away—Jerusalem—with a perpetual turning away? They hold fast to deceit[c][b][a]; they refuse to return.
translation:
  language: ru
  text: Почему этот народ — Иерусалим[c] — отвернулся, навеки отступив?[a][b] Они цепляются за обман и отказываются вернуться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в постоянном отступлении», «с непреходящим отступлением».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте повторяются родственные формы со значениями «отворачиваться, отступать, возвращаться»: народ отвернулся и отказывается вернуться.'
    reason: lexical_alternative
  - marker: c
    text: 'Слово «Иерусалим» можно также понимать как обращение: «Почему этот народ отвернулся, Иерусалим?..»'
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Почему
  rationale: Естественно передаёт вопросительное наречие, вводящее риторический вопрос.
- source_word: שׁוֹבְבָה
  choice: отворачивается
  rationale: Передаёт отступление народа и позволяет сохранить связь с повторяющимся корнем שוב, не прибегая к узкоконфессиональной лексике.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Прямой и естественный эквивалент, сохраняющий пророческий тон.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Имя понято как приложение, отождествляющее этот народ с Иерусалимом; возможное обращение отмечено в сноске.
- source_word: מְשֻׁבָה נִצַּחַת
  choice: всё дальше отворачиваясь
  rationale: Передаёт упорное, продолжающееся отступление естественным русским оборотом и поддерживает игру слов; более буквальные варианты приведены в сноске.
- source_word: הֶחֱזִיקוּ בַּתַּרְמִית
  choice: крепко держатся за обман
  rationale: Сохраняет образ намеренного, цепкого удержания обмана.
- source_word: מֵאֲנוּ
  choice: отказываются
  rationale: Точно выражает сознательное нежелание.
- source_word: לָשׁוּב
  choice: вернуться
  rationale: Сохраняет основной смысл שוב и словесный контраст с отворачиванием, не разворачивая значение до богословски более конкретного «покаяться».
theological_decisions:
- issue: Повтор форм корня שוב и существительного מְשׁוּבָה
  choice: Передать сочетанием «отворачивается / отворачиваясь / вернуться».
  alternative: «Отступил / вечное отступничество / покаяться».
  rationale: Выбранный ряд сохраняет риторический контраст движения прочь и отказа возвратиться, не усиливая текст термином «отступничество» или истолковывающим «покаяться».
- issue: Синтаксическая роль יְרוּשָׁלִַם
  choice: Понять «Иерусалим» как приложение к словам «этот народ» и выделить тире.
  alternative: 'Понять как обращение: «Почему этот народ отворачивается, Иерусалим?»'
  rationale: Приложение естественно отождествляет народ с Иерусалимом, однако грамматически возможное обращение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «отворачивается — отворачиваясь» намеренно сохраняет настойчивую игру слов оригинала; «всё дальше» естественно выражает устойчивое продолжение действия.
