  text: הֹבִ֕שׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵבֹ֗שׁוּ וְ/הִכָּלֵם֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֣וּ בַ/נֹּפְלִ֗ים בְּ/עֵ֧ת פְּקֻדָּתָ֛/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/012.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time of their punishment they will stumble, says Yahweh.
translation:
  language: ru
  text: Постыдились ли они того, что совершили мерзость? Нет, они нисколько не стыдились и даже не знали стыда. Поэтому они падут среди павших; когда настанет время взыскать с них[a], они преткнутся, — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во время их наказания»; буквально возможен смысл «во время их посещения». Еврейское слово может обозначать время, когда Бог приходит, чтобы призвать людей к ответу и совершить суд.'
    reason: Лексическая многозначность פְּקֻדָּה.
lexical_decisions:
- source_word: הֹבִשׁוּ
  choice: Постыдились ли они
  rationale: Форма понята как риторический вопрос, что соответствует последующему усиленному отрицанию и параллели в Иер 6:15; перевод сохраняет смысл стыда, а не внешнего унижения.
- source_word: כִּי תוֹעֵבָה עָשׂוּ
  choice: того, что совершили мерзость
  rationale: כִּי передаёт основание ожидаемого стыда, а «мерзость» сохраняет сильную нравственно-религиозную окраску תוֹעֵבָה.
- source_word: גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  choice: Нет, они нисколько не стыдились
  rationale: Сочетание инфинитива абсолютного с личной формой глагола усиливает отрицание; «нисколько» естественно передаёт эту эмфазу.
- source_word: וְהִכָּלֵם לֹא יָדָעוּ
  choice: и даже не знали стыда
  rationale: Выражение обозначает утрату способности испытывать стыд; буквальная образность «краснеть» в русском здесь менее естественна, чем устойчивое «не знать стыда».
- source_word: יִפְּלוּ בַנֹּפְלִים
  choice: они падут среди павших
  rationale: Перевод сохраняет повтор корня «падать» и допускает смысл общей участи с прочими павшими.
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: когда настанет время взыскать с них
  rationale: פקדה в контексте суда означает посещение с целью призвать к ответу или наказать; формулировка сохраняет судебный смысл, не сводя многозначность лишь к наказанию.
- source_word: יִכָּשְׁלוּ
  choice: они преткнутся
  rationale: Сохраняется метафора спотыкания и падения, связанная с предыдущей строкой.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Настоящее время естественно передаёт пророческую формулу, а личное имя «Яхве» представляет тетраграмматон как имя, а не титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; «Яхве» прямо передаёт личное имя и не заменяет его титулом.
- issue: Смысл פְּקֻדָּה в контексте суда
  choice: время взыскать с них
  alternative: время их наказания; время их посещения
  rationale: Выбранный вариант передаёт призвание к ответу и грядущий суд, сохраняя смысловой диапазон слова лучше, чем исключительно карательное «наказание» или неясное современному читателю «посещение».
translation_notes:
  register: Современный литературный русский, торжественный, но доступный. Сохранены риторический вопрос, усиленное отрицание и словесная перекличка между падением и преткновением; архаизмы сведены к уместному библейскому «преткнутся».
