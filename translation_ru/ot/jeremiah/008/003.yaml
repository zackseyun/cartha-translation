base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/003.yaml
  text: And death will be chosen rather than life by all the remnant who remain from this evil family[a], in all the places where the remnant remain, where I have driven them—declares Yahweh of hosts.
translation:
  language: ru
  text: И весь остаток — все, кто уцелел от этого злого рода, — предпочтёт смерть жизни во всех оставшихся местах, куда Я их изгнал[a], — возвещает Яхве Воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во всех оставшихся местах, куда Я изгнал их, там». Повтор слов со значением «оставаться» и заключительное «там» подчёркивают рассеяние уцелевших по местам изгнания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִבְחַר מָוֶת מֵחַיִּים
  choice: предпочтёт смерть жизни
  rationale: Нифаль глагола בחר допускает пассивное «будет избрана», однако по-русски при названной далее группе естественнее передать смысл предпочтения активной конструкцией. Сравнительное מִן после בחר выражает выбор смерти вместо жизни.
- source_word: לְכֹל הַשְּׁאֵרִית הַנִּשְׁאָרִים
  choice: весь остаток — все, кто уцелел
  rationale: «Остаток» сохраняет характерный для пророческой речи термин שְׁאֵרִית, а пояснение «все, кто уцелел» передаёт однокоренное הַנִּשְׁאָרִים и делает фразу понятной современному читателю.
- source_word: מִן הַמִּשְׁפָּחָה הָרָעָה הַזֹּאת
  choice: от этого злого рода
  rationale: «Род» естественно передаёт מִשְׁפָּחָה как родственную общность, не сужая значение до отдельной домашней семьи; «злого» прямо передаёт הָרָעָה.
- source_word: בְּכָל הַמְּקֹמוֹת הַנִּשְׁאָרִים
  choice: во всех оставшихся местах
  rationale: Сохранено необычное согласование причастия «оставшихся» с «местами», чтобы не устранять отмеченную в еврейском тексте неоднозначность и повтор корня שׁאר.
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: куда Я изгнал их
  rationale: Порода Hiphil глагола נדח выражает принудительное удаление или рассеяние. «Изгнал» передаёт действие суда; русское «куда» естественно включает локативное שָׁם.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Яхве Воинств
  rationale: «Возвещает» передаёт торжественную пророческую формулу נְאֻם; личное имя יְהוָה транслитерировано как «Яхве», а צְבָאוֹת сохранено как титул «Воинств».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Смысл «остатка» в контексте суда
  choice: сохранить термин «остаток» и пояснить его словами «все, кто уцелел»
  alternative: только «уцелевшие»
  rationale: 'Так сохраняется пророческая окраска שְׁאֵרִית и напряжение контекста: здесь остаток не представлен как уже спасённое и благополучное сообщество, а продолжает терпеть суд.'
- issue: Пассивная или активная форма выбора смерти
  choice: «остаток … предпочтёт смерть жизни»
  alternative: «смерть будет избрана вместо жизни всем остатком»
  rationale: Активная русская конструкция ясно выражает тот же выбор и избегает тяжеловесности, не добавляя причины или нравственной оценки этого предпочтения.
translation_notes:
  register: Современный литературный русский язык с торжественностью пророческой речи. Синтаксис слегка приподнят, но остаётся понятным; пояснительная конструкция после слова «остаток» сохраняет повтор еврейского корня без неестественной русской тавтологии.
