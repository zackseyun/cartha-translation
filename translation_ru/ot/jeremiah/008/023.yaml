base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/023.yaml
  text: Oh[a], that my head were water, and my eyes a fountain of tears, so that I might weep day and night for the slain of the daughter of my people.
translation:
  language: ru
  text: О, если бы[a] голова моя была водой, а глаза — источником слёз, чтобы я мог плакать день и ночь об убитых дочери моего народа!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Кто даст: голова моя — вода, а мой глаз — источник слёз?» Это еврейская формула горячего желания; слово «глаз» в оригинале стоит в единственном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: О, если бы
  rationale: Еврейское выражение буквально имеет форму «Кто даст…?», но служит формулой горячего желания или скорбного возгласа. «О, если бы» естественно передаёт его смысл и эмоциональную силу по-русски.
- source_word: רֹאשִׁי מַיִם
  choice: голова моя стала водой
  rationale: Сохранён смелый телесный и поэтический образ оригинала; глагол «стала» естественно восполняет подразумеваемую связку в русском языке.
- source_word: וְעֵינִי
  choice: а глаза
  rationale: В еврейском тексте стоит грамматически единственное число «мой глаз», однако русский язык в таком телесном образе естественно употребляет множественное число «глаза».
- source_word: מְקוֹר דִּמְעָה
  choice: источником слёз
  rationale: מְקוֹר обозначает источник или родник. «Источник слёз» сохраняет метафору и звучит естественно в современной литературной русской речи.
- source_word: וְאֶבְכֶּה
  choice: Тогда я плакал бы
  rationale: Когортатив после формулы желания выражает желаемое следствие. «Тогда я плакал бы» ясно связывает плач с предшествующим пожеланием.
- source_word: יוֹמָם וָלַיְלָה
  choice: день и ночь
  rationale: Устойчивое русское выражение точно передаёт меризм непрерывного плача.
- source_word: חַלְלֵי
  choice: по убитым
  rationale: В данном контексте слово означает павших, убитых, вероятно жертв войны. Предлог «по» естественно сочетается в русском языке с глаголом «плакать» при обозначении умерших.
- source_word: בַת עַמִּי
  choice: дочери моего народа
  rationale: Сохранено пророческое олицетворение общины как дочери; перевод не сводит образ к нейтральному «моему народу».
theological_decisions:
- issue: Следует ли устранять олицетворение בַת עַמִּי
  choice: Сохранить как «дочери моего народа»
  alternative: «моего народа» или «моего дорогого народа»
  rationale: Оборот является поэтическим олицетворением народа, а не особым доктринальным титулом. Его сохранение удерживает образность и напряжение плача, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Образность оригинала сохранена без архаизмов; порядок «голова моя» слегка приподнимает регистр и поддерживает ритм плача.
