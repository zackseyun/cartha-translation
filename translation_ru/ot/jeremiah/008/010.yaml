source:
  edition: WLC
  text: לָ/כֵן֩ אֶתֵּ֨ן אֶת נְשֵׁי/הֶ֜ם לַ/אֲחֵרִ֗ים שְׂדֽוֹתֵי/הֶם֙ לְ/י֣וֹרְשִׁ֔ים כִּ֤י מִ/קָּטֹן֙ וְ/עַד גָּד֔וֹל כֻּלֹּ֖/ה בֹּצֵ֣עַ בָּ֑צַע מִ/נָּבִיא֙ וְ/עַד כֹּהֵ֔ן כֻּלֹּ֖/ה עֹ֥שֶׂה שָּֽׁקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/010.yaml
  text: Therefore I will give their wives to others[a], their fields to those who will possess them; for from the least even to the greatest, every one of them is greedy for unjust gain; from prophet even to priest[c][b], every one of them practices falsehood.
translation:
  language: ru
  text: Поэтому Я отдам их жён другим[a], а их поля — тем, кто завладеет ими. Ведь от малого до великого — каждый жаждет неправедной наживы[b]; от пророка до священника — каждый поступает лживо[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «другим»; речь идёт о передаче жён другим людям в результате суда.'
    reason: Сохраняется неопределённость еврейского выражения без добавления «мужчинам» или «чужеземцам».
  - marker: b
    text: 'Или: «жадно ищет наживы». В данном контексте выражение подразумевает нечестную, неправедную прибыль.'
    reason: Лексическое выражение допускает более общее значение прибыли, хотя контекст придаёт ему отрицательный смысл.
  - marker: c
    text: 'Или: «творит ложь», «действует обманом».'
    reason: Сохраняются возможные оттенки устойчивого еврейского выражения עֹשֶׂה שָּׁקֶר.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Сохраняет причинно-следственную связь с предшествующим обличением и вводит объявление суда.
- source_word: אֶתֵּן
  choice: Я отдам
  rationale: Имперфект 1-го лица ед. числа в контексте пророчества о суде естественно передаётся будущим временем.
- source_word: נְשֵׁיהֶם
  choice: их жён
  rationale: В данном контексте притяжательная форма указывает именно на жён, а не просто на женщин.
- source_word: לַאֲחֵרִים
  choice: другим
  rationale: Передаёт неопределённое «другим», не добавляя отсутствующего в еврейском тексте уточнения.
- source_word: שְׂדוֹתֵיהֶם לְיוֹרְשִׁים
  choice: их поля — тем, кто завладеет ими
  rationale: Глагольная основа ירשׁ может обозначать наследование или вступление во владение; в контексте суда речь идёт о новых владельцах.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: от малого до великого
  rationale: Сохраняет меризм, охватывающий людей любого общественного положения.
- source_word: כֻּלֹּה
  choice: каждый
  rationale: 'Передаёт дистрибутивный смысл: никто не является исключением.'
- source_word: בֹּצֵעַ בָּצַע
  choice: жаждет неправедной наживы
  rationale: Однокоренная конструкция выражает настойчивое стремление к прибыли, имеющей в пророческом контексте нечестный характер.
- source_word: מִנָּבִיא וְעַד כֹּהֵן
  choice: от пророка до священника
  rationale: Сохраняет второй меризм, прямо называющий религиозных руководителей.
- source_word: עֹשֶׂה שָּׁקֶר
  choice: поступает лживо
  rationale: Передаёт деятельное и привычное участие во лжи и обмане, а не только отдельное ложное высказывание.
theological_decisions:
- issue: Характер объявленного лишения жён и полей
  choice: 'Передать его как прямое действие Божьего суда: «Я отдам».'
  alternative: Описать это лишь как неизбежную военную утрату.
  rationale: Форма первого лица אֶתֵּן представляет утрату семьи и собственности как совершаемый Богом суд, не уточняя способы его осуществления.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллельные конструкции «от малого до великого» и «от пророка до священника» сохранены; тире подчёркивает ритм и всеохватность обвинения.
