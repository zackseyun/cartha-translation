  text: עַל מָה֙ אֲנַ֣חְנוּ יֹֽשְׁבִ֔ים הֵֽאָסְפ֗וּ וְ/נָב֛וֹא אֶל עָרֵ֥י הַ/מִּבְצָ֖ר וְ/נִדְּמָה שָּׁ֑ם כִּי֩ יְהוָ֨ה אֱלֹהֵ֤י/נוּ הֲדִמָּ֨/נוּ֙ וַ/יַּשְׁקֵ֣/נוּ מֵי רֹ֔אשׁ כִּ֥י חָטָ֖אנוּ לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/014.yaml
  text: Why are we sitting still? Gather yourselves[a], and let us enter the fortified cities and perish there, for Yahweh our God has doomed us and given us poisoned water to drink[b], because we have sinned against Yahweh.
translation:
  language: ru
  text: Зачем мы сидим? Соберитесь! Войдём в укреплённые города и погибнем там[a], ведь Яхве, наш Бог, обрёк нас на гибель и напоил отравленной водой[b], потому что мы согрешили против Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и умолкнем там»; еврейский глагол может выражать молчание, неподвижность или гибель.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «водой яда» или «водой ядовитого растения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: сидим
  rationale: Сохраняет конкретный образ сидения и в риторическом вопросе естественно передаёт бездействие.
- source_word: הֵאָסְפוּ
  choice: собирайтесь
  rationale: Возвратная форма естественно передаёт призыв людям собраться вместе и сохраняет настойчивость повеления.
- source_word: עָרֵי הַמִּבְצָר
  choice: укреплённые города
  rationale: Точно и понятно передаёт города, защищённые укреплениями.
- source_word: וְנִדְּמָה
  choice: и погибнем там
  rationale: В контексте суда и надвигающейся гибели корень דמה вероятнее всего указывает на уничтожение или конец; присущая ему неоднозначность между молчанием, неподвижностью и гибелью отмечена в сноске.
- source_word: הֲדִמָּנוּ
  choice: обрёк нас на гибель
  rationale: Каузативная форма того же корня передаёт действие Яхве, предавшего народ гибели; повтор слова «гибель» отражает связь двух форм в еврейском тексте.
- source_word: מֵי רֹאשׁ
  choice: отравленной водой
  rationale: רֹאשׁ обозначает ядовитое либо горькое вещество или растение; перевод передаёт конкретный образ ясно для современного читателя, а буквальная форма дана в сноске.
- source_word: חָטָאנוּ לַיהוָה
  choice: мы согрешили против Яхве
  rationale: Предлог передаёт направленность проступка против Яхве; такая конструкция естественна по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Значение форм от корня דמה в описании суда
  choice: Народ признаёт, что Яхве обрёк его на гибель, и ожидает погибнуть в укреплённых городах.
  alternative: Народ предлагает умолкнуть или безмолвно оставаться там, а Яхве заставил его умолкнуть.
  rationale: Контекст укреплённых городов, отравленной воды, греха и Божьего суда поддерживает значение гибели, но лексическая возможность молчания или неподвижности остаётся подлинной и потому вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с краткими, настойчивыми побудительными фразами. Сохранены риторический вопрос, образ укреплённых городов, повтор мотива гибели и личное имя Яхве.
