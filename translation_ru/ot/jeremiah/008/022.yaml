source:
  edition: WLC
  text: הַ/צֳרִי֙ אֵ֣ין בְּ/גִלְעָ֔ד אִם רֹפֵ֖א אֵ֣ין שָׁ֑ם כִּ֗י מַדּ֨וּעַ֙ לֹ֣א עָֽלְתָ֔ה אֲרֻכַ֖ת בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/022.yaml
  text: Is there no balm in Gilead? Is there no physician there? Why then has the healing of the daughter of my people not come about?[a][b]
translation:
  language: ru
  text: Разве нет бальзама в Галааде? Разве нет там врача? Почему же не наступило исцеление дочери моего народа?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «целебной смолы». Еврейское слово обозначает лекарственную смолу, которой славился Галаад.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выздоровление» либо «восстановление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֳרִי
  choice: бальзам
  rationale: Слово обозначает целебную смолу, которой славился Галаад. «Бальзам» естественно передаёт медицинский смысл и сохраняет выразительность образа; возможны также «смола» и «бальзамическая смола».
- source_word: אֵין
  choice: разве нет
  rationale: Частица выражает отсутствие, а в данном контексте образует риторический вопрос. «Разве нет» естественно передаёт ожидаемый утвердительный ответ.
- source_word: בְּגִלְעָד
  choice: в Галааде
  rationale: Прямое обозначение места с общепринятой русской формой топонима.
- source_word: אִם
  choice: разве (во втором самостоятельном вопросе)
  rationale: Здесь אִם вводит параллельный риторический вопрос, а не условную конструкцию; это отражено отдельным вопросительным предложением.
- source_word: רֹפֵא
  choice: врач
  rationale: Причастная форма обозначает того, кто лечит. «Врач» ясно и естественно продолжает медицинский образ, не добавляя иных коннотаций.
- source_word: שָׁם
  choice: там
  rationale: Наречие отсылает к ранее названному Галааду.
- source_word: כִּי מַדּוּעַ
  choice: почему же
  rationale: 'Сочетание связывает заключительный вопрос с двумя предыдущими и выражает вывод: если лекарство и врач имеются, почему исцеление не произошло.'
- source_word: לֹא עָלְתָה
  choice: не наступило
  rationale: Хотя עלה буквально связано с движением вверх, в сочетании с אֲרֻכָה речь идёт о том, что исцеление не возникло или не осуществилось. «Не наступило» естественно выражает этот результативный смысл.
- source_word: אֲרֻכַת
  choice: исцеление
  rationale: Существительное означает исцеление, выздоровление или восстановление здоровья. «Исцеление» сохраняет связь с бальзамом и врачом и не сужает образ до одного лишь процесса выздоровления.
- source_word: בַּת עַמִּי
  choice: дочери моего народа
  rationale: Сохранена пророческая персонификация народа, важная для поэтической и скорбной интонации стиха.
theological_decisions:
- issue: Следует ли сохранять образное выражение «дочь моего народа» или заменить его прямым обозначением народа
  choice: Сохранить «дочери моего народа»
  alternative: «моего народа» или «моего народа Израиля»
  rationale: Дословный образ является персонификацией с плачевной, эмоциональной окраской. Его сохранение передаёт литературную и богословскую напряжённость текста, не вводя уточнений, которых нет в еврейском.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллельные риторические вопросы переданы симметрично; медицинская образность и персонификация народа сохранены. Все сноски отмечены в основном тексте.
