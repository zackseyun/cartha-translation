base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/020.yaml
  text: The harvest has passed[a], the summer has ended, and we have not been saved.
translation:
  language: ru
  text: Жатва прошла, лето кончилось, а мы не спасены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не избавлены»: еврейский глагол может означать «быть спасённым» или «быть избавленным от опасности или бедствия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבַר
  choice: прошла
  rationale: Форма qal perfect указывает на завершившееся событие; «прошла» естественно передаёт, что жатва уже миновала.
- source_word: קָצִיר
  choice: жатва
  rationale: Существительное обозначает жатву или время жатвы; в поэтическом параллелизме краткое «жатва» звучит естественно и сохраняет образ сезона.
- source_word: כָּלָה
  choice: кончилось
  rationale: Глагол qal perfect выражает завершение; «кончилось» ясно и естественно передаёт исчерпанность ожидаемого времени.
- source_word: קַיִץ
  choice: лето
  rationale: В параллели с жатвой наиболее уместно обычное сезонное значение; возможная связь с летними плодами здесь не требует отдельного выражения.
- source_word: וַאֲנַחְנוּ
  choice: а мы
  rationale: Хотя waw обычно соединяет части высказывания, здесь контекст создаёт явное противопоставление между прошедшими сроками и отсутствием спасения; русское «а» естественно передаёт эту связь.
- source_word: לֹא נוֹשָׁעְנוּ
  choice: не спасены
  rationale: Niphal perfect 1-го лица множественного числа от ישׁע обозначает результат — спасение или избавление не состоялось. Краткая форма «не спасены» сохраняет пассивно-результативный смысл и поэтическую силу.
theological_decisions:
- issue: Передача ישׁע в контексте народного плача
  choice: спасены
  alternative: избавлены
  rationale: «Спасены» прямо передаёт широкий смысл божественного спасения и не ограничивает его вечным спасением; в данном контексте речь идёт о неосуществившемся избавлении от бедствия. Альтернатива «избавлены» также лексически возможна.
translation_notes:
  register: Современный литературный русский язык; краткий ритмичный плач с сохранением сезонного параллелизма. Союз «а» естественно выражает подразумеваемое противопоставление. Маркер сноски поставлен после соответствующего выражения.
