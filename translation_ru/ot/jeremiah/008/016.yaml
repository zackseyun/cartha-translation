id: JER.8.16
reference: Jeremiah 8:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מִ/דָּ֤ן נִשְׁמַע֙ נַחְרַ֣ת סוּסָ֗י/ו מִ/קּוֹל֙ מִצְהֲל֣וֹת אַבִּירָ֔י/ו רָעֲשָׁ֖ה כָּל הָ/אָ֑רֶץ וַ/יָּב֗וֹאוּ וַ/יֹּֽאכְלוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/016.yaml
  text: From Dan is heard the snorting of his horses[a]; at the sound of the neighing of his stallions the whole land quakes. They come and devour the land and its fullness[c][b], the city and those who dwell in it.
translation:
  language: ru
  text: Из Дана слышно фырканье его коней; от ржания его могучих коней[a] содрогается вся земля[b]. Они приходят и пожирают землю и всё, что её наполняет[c], город и его жителей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его жеребцов». Еврейское слово может обозначать могучих, сильных коней; в данном контексте речь идёт о боевых конях.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вся страна». Еврейское אֶרֶץ может означать как землю вообще, так и конкретную страну; здесь контекст говорит о вторжении и разорении страны.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Буквально: «землю и её полноту», то есть всё, что её наполняет.'
    reason: literal_rendering
lexical_decisions:
- source_word: מִדָּן
  choice: Из Дана
  rationale: Предлог מִן указывает на источник звука; Дан — северная пограничная область, откуда приближается вторжение.
- source_word: נִשְׁמַע נַחְרַת סוּסָיו
  choice: слышно фырканье его коней
  rationale: Передаёт страдательное значение נִשְׁמַע и яркий звукоподражательный образ נַחְרַת; местоимение «его» сохраняет форму суффикса 3-го лица единственного числа, не уточняя личность врага.
- source_word: מִצְהֲלוֹת אַבִּירָיו
  choice: от ржания его могучих коней
  rationale: מִצְהֲלוֹת обозначает конское ржание, а אַבִּירָיו в данном контексте — сильных боевых коней. Такой перевод сохраняет оттенок силы, не вводя более узкое значение пола животного.
- source_word: רָעֲשָׁה כָּל הָאָרֶץ
  choice: содрогается вся земля
  rationale: Глагол רָעַשׁ выражает сильное сотрясение; настоящее время поддерживает пророческую наглядность. «Земля» сохраняет возможную двусмысленность между страной и землёй в широком смысле.
- source_word: וַיָּבֹאוּ וַיֹּאכְלוּ
  choice: Они приходят и пожирают
  rationale: Настоящее время передаёт живо разворачивающееся пророческое видение; «пожирают» сохраняет насильственную метафору глагола אָכַל.
- source_word: אֶרֶץ וּמְלוֹאָהּ
  choice: землю и всё, что её наполняет
  rationale: Передаёт מְלוֹאָהּ естественно по-русски и вместе с тем сохраняет образ всего, чем наполнена земля.
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  choice: город и его жителей
  rationale: Краткий и естественный русский эквивалент, сохраняющий город в единственном числе и всех живущих в нём.
theological_decisions:
- issue: К кому относится местоименный суффикс в סוּסָיו и אַבִּירָיו
  choice: Сохранено «его» без явного называния владельца коней
  alternative: «кони врага» или «их кони»
  rationale: Еврейский текст грамматически употребляет мужской род единственного числа, но ближайший стих не называет референта прямо; уточнение «врага» сняло бы сохранённую в оригинале недосказанность.
translation_notes:
  register: Современный литературный русский язык с сохранением напряжённой пророческой образности. Настоящее время передаёт непосредственность видения; синтаксис остаётся компактным и ритмичным.
