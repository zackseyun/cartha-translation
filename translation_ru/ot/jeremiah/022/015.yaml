base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/015.yaml
  text: Do you reign because you compete in cedar? Did not your father eat and drink and do justice and righteousness? Then it was well with him[a][b].
translation:
  language: ru
  text: Разве ты царствуешь потому, что соперничаешь из-за кедра[a]? Разве твой отец не ел и не пил, не осуществлял правосудие и не поступал праведно[b]? Тогда ему было хорошо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение редко и допускает разные понимания: «соперничаешь из-за кедра», «стремишься к кедру» или «усердствуешь ради кедра». Вероятно, оно связано с царским соперничеством, проявлявшимся в использовании кедра при дворцовом строительстве.'
    reason: lexical_alternative
  - marker: b
    text: Слова «правосудие и поступал праведно» можно также передать как «суд и праведность», «правосудие и правду» или «правосудие и то, что правильно».
    reason: alternative_reading
lexical_decisions:
- source_word: הֲתִמְלֹךְ
  choice: Разве ты царствуешь
  rationale: 'Вопросительная частица и форма 2-го лица передают риторический вызов: основанием царской власти не может служить показная роскошь.'
- source_word: כִּי
  choice: потому, что
  rationale: Союз вводит предполагаемое основание царствования, которое пророк отвергает.
- source_word: מְתַחֲרֶה בָאָרֶז
  choice: стараешься превзойти других в кедровом убранстве
  rationale: Редкое выражение, вероятно, обозначает соперничество в использовании кедра при строительстве и отделке дворца. Формулировка передаёт состязательность и остаётся понятной современному читателю; неоднозначность отмечена в сноске.
- source_word: אָכַל וְשָׁתָה
  choice: ел и не пил
  rationale: В составе русского риторического вопроса повтор частицы «не» естественно связывает однородные сказуемые. Выражение обозначает обычную жизнь и пользование её благами, без намёка на излишество.
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: вершил правосудие и творил правду
  rationale: 'Сохранена двучленная пророческая формула: מִשְׁפָּט передан как осуществление правосудия, а צְדָקָה — как нравственная и заветная правота, выраженная традиционным, но понятным оборотом «творить правду».'
- source_word: אָז טוֹב לוֹ
  choice: И тогда ему было хорошо
  rationale: «Тогда» сохраняет результативно-временную связь אָז, а безличный оборот естественно передаёт טוֹב לוֹ.
theological_decisions:
- issue: Передача пары מִשְׁפָּט וּצְדָקָה
  choice: вершил правосудие и творил правду
  alternative: поступал справедливо и праведно
  rationale: Выбранный вариант сохраняет два различных существительных и устойчивую библейскую связь общественного правосудия с нравственной правотой, не сводя оба понятия к одному слову «справедливость».
- issue: Связь благополучия отца с его правлением
  choice: И тогда ему было хорошо
  alternative: И потому ему было хорошо
  rationale: «Тогда» ближе к אָז и сохраняет некоторую открытость между временным следованием и результатом, не превращая высказывание в упрощённую формулу гарантированного воздаяния.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Риторические вопросы сохранены; редкая кедровая метафора умеренно раскрыта в основном тексте и оговорена в сноске. Оборот «творить правду» сохраняет пророческий регистр, оставаясь понятным современному читателю.
