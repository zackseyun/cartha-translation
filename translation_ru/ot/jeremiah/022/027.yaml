  yaml_path: translation/ot/jeremiah/022/027.yaml
  text: But to the land to which they lift up their soul to return[a], there they will not return.
translation:
  language: ru
  text: Что же до земли, куда они всей душой стремятся вернуться[a], туда они не вернутся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «о земле, к которой они возносят свою душу, чтобы вернуться туда; туда они не вернутся». Это еврейское выражение означает сильное желание, страстное стремление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הָאָרֶץ
  choice: А в ту землю
  rationale: וְ вводит контраст с предыдущим утверждением, а עַל при направленном стремлении к возвращению естественно передаётся по-русски как «в». Указательное «ту» связывает существительное с последующим определительным придаточным.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте изгнания и возвращения אֶרֶץ означает конкретную землю, родину, а не всю землю как мир.
- source_word: אֲשֶׁר
  choice: куда
  rationale: Относительное слово относится к месту назначения и в сочетании с «вернуться» естественно передаётся наречием направления «куда».
- source_word: הֵם
  choice: они
  rationale: Явно выраженное местоимение сохранено как субъект придаточного предложения.
- source_word: מְנַשְּׂאִים אֶת־נַפְשָׁם
  choice: всей душой стремятся
  rationale: Буквально выражение означает «поднимают свою душу» и передаёт сильное желание. «Всей душой стремятся» сохраняет образ души в понятной современной русской идиоме и не делает буквальную кальку неясной.
- source_word: לָשׁוּב שָׁם
  choice: вернуться
  rationale: שׁוּב означает «вернуться»; שָׁם семантически выражено направительным «куда», поэтому отдельное «туда» в придаточном создало бы ненужный повтор.
- source_word: שָׁמָּה לֹא יָשׁוּבוּ
  choice: они не вернутся
  rationale: Финальная форма повторяет корень שׁוּב и содержит простое отрицание будущего. Место назначения уже ясно из вынесенного оборота «в ту землю», поэтому по-русски дополнительное «туда» необязательно.
