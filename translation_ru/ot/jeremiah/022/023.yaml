base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/023.yaml
  text: You who dwell in Lebanon[a], who nest in the cedars, how you will groan when pangs come upon you[b], pain like that of a woman giving birth.
translation:
  language: ru
  text: Живущая в Ливане[a], гнездящаяся среди кедров! Как ты застонешь[b], когда тебя охватят схватки — мука, как у роженицы!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ливан и кедры, вероятно, напоминают о царском дворце, построенном из ливанского кедра, и изображают царский дом пребывающим в возвышенной безопасности.
    reason: cultural_note
  - marker: b
    text: 'Или: «как тебя пожалеют». Значение еврейского глагола не вполне ясно: его понимают либо как указание на стоны, либо как указание на сострадание к страдающей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ישבתי
  choice: живущая
  rationale: По контексту это обращение к олицетворённому Иерусалиму или царскому дому в форме женского рода. Значение корня ישב здесь — «жить, обитать», а не буквально «сидеть».
- source_word: בַּלְּבָנוֹן
  choice: на Ливане
  rationale: Сохранено прямое географическое обозначение с естественным для русского языка предлогом. Образ, вероятно, также намекает на царский дворец из ливанского кедра, но это не внесено в основной текст.
- source_word: מקננתי
  choice: свившая гнездо
  rationale: Метафора гнездования передаёт пребывание в высоком и кажущемся безопасным месте; причастный оборот естественно согласован с адресатом женского рода.
- source_word: בָּאֲרָזִים
  choice: среди кедров
  rationale: Сохранён образ множества кедров без сведения его исключительно к кедровой древесине или дворцовым постройкам.
- source_word: מַה
  choice: как
  rationale: Частица вводит эмоциональное восклицание о силе предстоящего страдания, а не обычный вопрос.
- source_word: נֵּחַנְתְּ
  choice: ты застонешь
  rationale: Форма трудна для истолкования. В контексте родовых схваток значение «стонать» хорошо передаёт телесную муку, однако возможное понимание «тебя пожалеют» отмечено в сноске.
- source_word: בְּבֹא לָךְ
  choice: когда тебя охватят
  rationale: Инфинитивная конструкция обозначает наступление события; русский оборот передаёт внезапное приближение и воздействие страдания.
- source_word: חֲבָלִים
  choice: схватки
  rationale: В сочетании с последующим сравнением с роженицей слово обозначает родовые боли; «схватки» ясно и современно передаёт образ.
- source_word: חִיל
  choice: мука
  rationale: Слово обозначает мучительную боль, дрожь или корчи. «Мука» сохраняет интенсивность и допускает приложение к предыдущему образу схваток.
- source_word: כַּיֹּלֵדָה
  choice: как у роженицы
  rationale: Краткий и естественный русский оборот точно сохраняет сравнение с женщиной во время родов.
