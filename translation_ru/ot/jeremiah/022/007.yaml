source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֥י עָלֶ֛י/ךָ מַשְׁחִתִ֖ים אִ֣ישׁ וְ/כֵלָ֑י/ו וְ/כָֽרְתוּ֙ מִבְחַ֣ר אֲרָזֶ֔י/ךָ וְ/הִפִּ֖ילוּ עַל הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/007.yaml
  text: And I will set apart destroyers against you[a], each with his weapons[c][b]; they will cut down the choicest of your cedars and cast them into the fire.
translation:
  language: ru
  text: И Я отделю для суда губителей против тебя[a], каждого со своим оружием[b]. Они срубят лучшие из твоих кедров и бросят их в огонь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «освящу губителей против тебя». Здесь глагол «освятить» означает отделить исполнителей для совершения суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «каждого со своими орудиями». Еврейское слово может обозначать оружие, орудия или иное снаряжение.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на огонь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  choice: И Я отделю для суда
  rationale: Глагол קדשׁ обычно выражает освящение или отделение для особой цели. Добавление «для суда» проясняет функцию губителей в данном пророчестве, не приписывая им нравственной святости и сохраняя необычный сакральный оттенок еврейского слова.
- source_word: מַשְׁחִתִים
  choice: губителей
  rationale: Причастная форма обозначает тех, кто несёт разрушение. «Губители» кратко, естественно для пророческого регистра и передаёт образ действующих лиц.
- source_word: עָלֶיךָ
  choice: против тебя
  rationale: Предлог עַל при враждебном действии имеет значение «против».
- source_word: אִישׁ וְכֵלָיו
  choice: каждого со своим оружием
  rationale: אִישׁ после множественного обозначения лиц имеет распределительное значение «каждый». כְּלִי может означать предметы, орудия, снаряжение или оружие; военный контекст поддерживает «оружие», хотя более широкое значение отмечено в сноске.
- source_word: וְכָרְתוּ
  choice: Они срубят
  rationale: В отношении деревьев כרת означает рубить или валить; «срубят» ясно и естественно по-русски.
- source_word: מִבְחַר אֲרָזֶיךָ
  choice: лучшие из твоих кедров
  rationale: מִבְחַר обозначает избранное, лучшее; формулировка сохраняет конкретный образ кедров и его превосходную оценку.
- source_word: וְהִפִּילוּ עַל הָאֵשׁ
  choice: и бросят их в огонь
  rationale: Буквально конструкция говорит о том, что кедры повергнут «на огонь»; по-русски результат действия естественно выражается как «бросят в огонь».
theological_decisions:
- issue: Сакральная лексика в пророчестве о суде
  choice: «отделю для суда» с примечанием о буквальном «освящу»
  alternative: «назначу» или «освящу»
  rationale: «Назначу» устраняет сакральный оттенок קדשׁ, тогда как буквальное «освящу губителей» может быть ошибочно понято как утверждение об их нравственной святости. Основной текст сохраняет идею особого предназначения Богом, а сноска — подлинное напряжение исходной формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавное «Я» помогает ясно обозначить речь Господа в изолированном стихе. Синтаксис разделён на два предложения для естественной русской читаемости; образ кедров оставлен без истолковывающего расширения.
