  text: כִּ֤י אִם עָשׂוֹ֙ תַּֽעֲשׂ֔וּ אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הַ/בַּ֣יִת הַ/זֶּ֡ה מְלָכִים֩ יֹשְׁבִ֨ים לְ/דָוִ֜ד עַל כִּסְא֗/וֹ רֹֽכְבִים֙ בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֔ים ה֥וּא ו/עבד/ו וְ/עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/004.yaml
  text: For if you truly do this thing[a], then kings sitting on David’s throne will enter through the gates of this house, riding in chariots and on horses—he, his servants[b], and his people.
translation:
  language: ru
  text: Ибо если вы действительно исполните это[a], то через ворота этого дома въедут цари, восседающие на престоле Давида, — на колесницах и верхом на конях, каждый со своими слугами[b] и своим народом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это дело», «это слово». Еврейское דָּבָר может означать слово, дело, вопрос или предмет речи.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «он, его слуги и его народ». Единственное число употреблено распределительно после слова «цари»: каждый царь — со своими слугами и своим народом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Ибо если
  rationale: Сохраняет логическую связь с предыдущим повелением и условный характер последующего обещания.
- source_word: עָשׂוֹ תַּעֲשׂוּ
  choice: действительно исполните
  rationale: Инфинитив абсолютный усиливает личную форму глагола; «действительно» естественно передаёт это усиление, а «исполните» подходит к подразумеваемому повелению.
- source_word: הַדָּבָר הַזֶּה
  choice: это повеление
  rationale: דָּבָר допускает значения «слово», «дело» и «вопрос»; здесь выражение отсылает к только что возвещённому требованию, поэтому «повеление» ясно передаёт контекст, а неоднозначность отмечена в сноске.
- source_word: וּבָאוּ בְשַׁעֲרֵי הַבַּיִת הַזֶּה
  choice: в ворота этого дома будут въезжать
  rationale: Глагол обозначает прибытие или вход; с упоминанием колесниц и коней русское «въезжать» естественно передаёт движение через ворота. «Дом» сохраняет формальный образ еврейского текста, вероятно обозначающий царский дворец.
- source_word: מְלָכִים יֹשְׁבִים לְדָוִד עַל כִּסְאוֹ
  choice: цари, восседающие на престоле Давида
  rationale: Передаёт династическое преемство без добавления прямого мессианского толкования; возвышенное «восседающие» уместно для царского престола.
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  choice: на колесницах и конях
  rationale: Краткая естественная русская формулировка передаёт царское шествие; единственное число «колесница» в еврейском понимается собирательно.
- source_word: הוּא וַעֲבָדָיו וְעַמּוֹ
  choice: каждый со своими слугами и своим народом
  rationale: Еврейские местоимения стоят в единственном числе после множественного «цари» и имеют распределительное значение. «Каждый» сохраняет эту особенность и устраняет неестественное для русского несогласование.
theological_decisions:
- issue: Династическое обещание в выражении о престоле Давида
  choice: Передать продолжение царской линии Давида без уточнения, что речь прямо идёт о Мессии.
  alternative: Эксплицировать «цари из рода Давида» либо истолковать стих как непосредственно мессианский.
  rationale: В ближайшем контексте говорится о сохранении династии Давида при условии послушания. Формулировка сохраняет исторический и богословский потенциал текста, не разрешая его сверх сказанного.
- issue: Условность обещания
  choice: Сохранить явную конструкцию «если… то».
  alternative: Ослабить условие до общего призыва или передать продолжение династии как безусловное.
  rationale: כִּי אִם вводит условное заверение, связанное с предшествующим требованием; эту напряжённость необходимо сохранить.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксис остаётся ясным для широкого читателя; «восседающие» поддерживает достоинство царского образа, а распределительное «каждый» точно и естественно передаёт смену числа в еврейском тексте.
