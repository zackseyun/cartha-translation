  text: הַ/עֶ֨צֶב נִבְזֶ֜ה נָפ֗וּץ הָ/אִ֤ישׁ הַ/זֶּה֙ כָּנְיָ֔הוּ אִ֨ם כְּלִ֔י אֵ֥ין חֵ֖פֶץ בּ֑/וֹ מַדּ֤וּעַ הֽוּטֲלוּ֙ ה֣וּא וְ/זַרְע֔/וֹ וְ/הֻ֨שְׁלְכ֔וּ עַל הָ/אָ֖רֶץ אֲשֶׁ֥ר לֹא יָדָֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/028.yaml
  text: Is this man Coniah a despised[a], broken vessel[b], or a vessel in which there is no delight? Why have he and his offspring been hurled out and cast into a land that they did not know?
translation:
  language: ru
  text: Неужели этот человек, Кония[b], — презренный, разбитый сосуд[a] или сосуд, который никому не желан? Почему он и его потомки были выброшены и брошены в страну, которой они не знали?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «презренное разбитое изваяние (идол)». Еврейское עֶצֶב может обозначать изготовленный предмет, в том числе изваяние или идола; параллель с «сосудом» и слово «разбитый» позволяют понимать здесь глиняный предмет.'
    reason: lexical_alternative
  - marker: b
    text: Кония — краткая форма имени царя, известного также как Иехония (ср. Иер. 24:1; 27:20).
    reason: cross_reference
lexical_decisions:
- source_word: הַעֶצֶב
  choice: сосуд
  rationale: Существительное обозначает изготовленный предмет и может относиться к изваянию или идолу; в данном контексте параллель с כְּלִי («сосуд») и определение נָפוּץ («разбитый») поддерживают образ разбитого предмета, вероятно глиняного. В сноске сохранено лексическое другое прочтение.
- source_word: נִבְזֶה נָפוּץ
  choice: презренный разбитый
  rationale: «Презренный» сохраняет значение отверженности и позора, а «разбитый» передаёт состояние предмета в рамках образа сосуда, не усиливая текст до «раздробленный вдребезги».
- source_word: כָּנְיָהוּ
  choice: Кония
  rationale: Передана именно краткая форма царского имени, употреблённая в еврейском тексте данного стиха.
- source_word: אִם
  choice: или
  rationale: В риторическом вопросе частица вводит альтернативное сопоставление; русское «или» естественно передаёт эту функцию.
- source_word: כְּלִי אֵין חֵפֶץ בּוֹ
  choice: сосуд, который никому не желан
  rationale: Формулировка передаёт отсутствие желания или расположения к предмету и звучит естественно по-русски, не добавляя прямого суждения о его бесполезности.
- source_word: הוּטֲלוּ ... וְהֻשְׁלְכוּ
  choice: вышвырнули и бросили
  rationale: Русская неопределённо-личная конструкция естественно передаёт два еврейских пассива и сохраняет силу насильственного удаления и повторение двух близких глаголов.
- source_word: הוּא וְזַרְעוֹ
  choice: его и его потомков
  rationale: זֶרַע здесь относится к родовой линии; «потомки» понятно передаёт смысл без неестественного буквального «семя».
- source_word: עַל הָאָרֶץ אֲשֶׁר לֹא יָדָעוּ
  choice: в страну, которой они не знали
  rationale: В контексте насильственного переселения הָאָרֶץ означает чужую страну назначения. Множественное «они» соответствует Конии и его потомкам.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторический вопрос сохранён; «вышвырнули» передаёт резкость исходного образа, а близкие глаголы не сведены в один. Все варианты, существенные для неоднозначного עֶצֶב, вынесены в сноску.
