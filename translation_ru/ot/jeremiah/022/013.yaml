base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/013.yaml
  text: Woe to him who builds his house without righteousness[a], and his upper rooms without justice[c][b], who makes his neighbor work for nothing and does not give him his wages.
translation:
  language: ru
  text: Горе тому, кто строит свой дом не по правде и верхние комнаты — не по справедливости; кто заставляет своего ближнего работать даром и не отдаёт ему платы за труд[c][a][b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без справедливости». Еврейские слова צֶדֶק и מִשְׁפָּט близки по значению и могут частично совпадать.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть помещения верхнего этажа; возможный перевод: «верхние покои».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «его труд (работу)»; в данном контексте имеется в виду причитающаяся работнику плата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе тому
  rationale: Передаёт силу пророческого обличения и естественно вводит в русском языке описание осуждаемого человека.
- source_word: בֹּנֶה בֵיתוֹ
  choice: кто строит свой дом
  rationale: Причастие передано придаточным с настоящим временем; בַּיִת сохранено как «дом», без контекстуального сужения до «дворца».
- source_word: בְּלֹא צֶדֶק
  choice: не по правде
  rationale: Сохраняет нравственный смысл צֶדֶק и позволяет отличить его от близкого по значению מִשְׁפָּט в следующей строке.
- source_word: וַעֲלִיּוֹתָיו
  choice: а верхние комнаты
  rationale: Обозначает помещения в верхней части большого дома; союз «а» естественно оформляет параллельную конструкцию по-русски.
- source_word: בְּלֹא מִשְׁפָּט
  choice: не по справедливости
  rationale: В данном социально-нравственном контексте выражение указывает на нарушение справедливого права работника; перевод не сужает смысл до судебного разбирательства.
- source_word: בְּרֵעֵהוּ יַעֲבֹד
  choice: заставляет своего ближнего работать
  rationale: Синтаксическая конструкция означает использование другого человека как работника; «ближний» сохраняет широкий смысл человека, состоящего с ним в общественных отношениях.
- source_word: חִנָּם
  choice: даром
  rationale: Кратко и естественно выражает труд без вознаграждения.
- source_word: וּפֹעֲלוֹ לֹא יִתֶּן לוֹ
  choice: и не отдаёт ему платы за труд
  rationale: По контексту פֹּעַל обозначает причитающееся за работу вознаграждение; глагольная конструкция сохранена без избыточного усиления.
theological_decisions:
- issue: Передача парных понятий צֶדֶק и מִשְׁפָּט
  choice: не по правде … не по справедливости
  alternative: без справедливости … без правосудия
  rationale: Выбраны два близких, но не тождественных выражения, чтобы сохранить смысловой параллелизм и напряжение между нравственной правотой и справедливым обращением, не превращая второй термин исключительно в судебно-правовой.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой и торжественной формы пророческого обличения. Формулировки понятны широкому читателю; архитектурный образ и социальная конкретность эксплуатации сохранены.
