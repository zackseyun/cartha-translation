source:
  edition: WLC
  text: קְבוּרַ֥ת חֲמ֖וֹר יִקָּבֵ֑ר סָח֣וֹב וְ/הַשְׁלֵ֔ךְ מֵ/הָ֖לְאָה לְ/שַׁעֲרֵ֥י יְרוּשָׁלִָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/019.yaml
  text: He will be buried with the burial of a donkey—dragged off and thrown out beyond the gates of Jerusalem[a][b].
translation:
  language: ru
  text: 'Его похоронят, как осла: оттащат и выбросят за ворота Иерусалима[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «погребением осла будет он погребён»; возможно также: «его погребут ослиным погребением».'
    reason: lexical_alternative
  - marker: b
    text: Этот образ означает позорное удаление тела за пределы города вместо почётного погребения.
    reason: cultural_note
lexical_decisions:
- source_word: קְבוּרַת חֲמוֹר
  choice: похоронят, как осла
  rationale: Еврейское сочетание буквально означает «погребением осла». Сравнительная русская конструкция естественно передаёт образ участи, подобной участи осла, не сглаживая намеренно резкого выражения.
- source_word: יִקָּבֵר
  choice: его похоронят
  rationale: Нифаль имперфекта от קבר выражает пассивное действие. Неопределённо-личная русская конструкция естественно передаёт будущую пассивную форму.
- source_word: סָחוֹב
  choice: оттащат
  rationale: Инфинитив абсолютный изображает волочение тела прочь; «оттащат» передаёт и движение, и унизительный характер действия.
- source_word: וְהַשְׁלֵךְ
  choice: и выбросят
  rationale: Форма от שלך означает бросить или выбросить. В данном контексте «выбросят» естественно выражает насильственное удаление тела за пределы города.
- source_word: מֵהָלְאָה לְשַׁעֲרֵי
  choice: за ворота
  rationale: Сочетание указывает на место по ту сторону ворот, вне города. «За ворота» кратко и естественно передаёт пространственный смысл.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалима
  rationale: Общепринятая русская форма библейского топонима.
theological_decisions:
- issue: Характер сравнения с погребением осла
  choice: Позорное удаление тела, подобное тому, как избавляются от трупа осла, а не почётное человеческое погребение.
  alternative: Понимать выражение лишь как буквальное указание на способ погребения, не подчёркивая бесчестия.
  rationale: Последующие слова об оттаскивании и выбрасывании тела за ворота показывают, что речь идёт о лишении достойного погребения. Перевод сохраняет этот смысл, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, суровая и понятная. Двоеточие раскрывает, в чём именно состоит уподобление участи осла.
