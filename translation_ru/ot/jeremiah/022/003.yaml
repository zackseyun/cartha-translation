  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲשׂ֤וּ מִשְׁפָּט֙ וּ/צְדָקָ֔ה וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עָשׁ֑וֹק וְ/גֵר֩ יָת֨וֹם וְ/אַלְמָנָ֤ה אַל תֹּנוּ֙ אַל תַּחְמֹ֔סוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֥וֹם הַ/זֶּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/003.yaml
  text: 'Thus says Yahweh: Do justice and righteousness[a], and deliver the robbed person from the hand of the oppressor. Do not oppress the resident foreigner, the fatherless, or the widow, and do not do violence[c][b], and do not shed innocent blood in this place.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Вершите правосудие и поступайте праведно[a]; спасайте ограбленного из власти притеснителя. Не угнетайте чужеземца[b], сироту и вдову; не совершайте насилия[c] и не проливайте невинной крови на этом месте».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делайте суд и праведность». Два еврейских слова вместе призывают к справедливому общественному устройству и нравственно правильным поступкам.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово обозначает неуроженца, поселившегося среди израильтян и нередко находившегося в социально уязвимом положении; традиционный перевод — «пришелец».
    reason: cultural_note
  - marker: c
    text: 'Возможен также перевод: «не притесняйте и не подвергайте насилию чужеземца, сироту и вдову». Еврейская конструкция допускает отнесение второго запрета к перечисленным лицам, но не требует этого однозначно.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена обычная формула пророческой речи; личное имя יְהוָה передано как «Яхве».
- source_word: עֲשׂוּ מִשְׁפָּט וּצְדָקָה
  choice: Вершите правосудие и поступайте праведно
  rationale: 'Естественная русская формулировка сохраняет два взаимосвязанных, но различных понятия: справедливое общественно-судебное действие и нравственную правоту.'
- source_word: וְהַצִּילוּ גָזוּל
  choice: спасайте ограбленного
  rationale: Каузативный императив נצל требует деятельного избавления пострадавшего; גָזוּל обозначает человека, которого ограбили или лишили принадлежащего ему.
- source_word: מִיַּד עָשׁוֹק
  choice: из рук притеснителя
  rationale: Сохранён образ руки как власти, при этом русское множественное «из рук» является естественной идиомой; עָשׁוֹק передано по контексту как притеснитель.
- source_word: גֵר
  choice: живущий среди вас чужеземец
  rationale: Передаёт не просто иностранца, а неуроженца, постоянно живущего в обществе Израиля и находящегося в уязвимом положении.
- source_word: יָתוֹם וְאַלְמָנָה
  choice: сирота и вдова
  rationale: Естественные русские обозначения традиционно названных уязвимых групп; יָתוֹם может особо подразумевать ребёнка без отца, но в данном контексте «сирота» звучит яснее.
- source_word: אַל תֹּנוּ אַל תַּחְמֹסוּ
  choice: не угнетайте и не подвергайте насилию
  rationale: 'Оба запрета сохранены раздельно: первый указывает на притеснение и эксплуатацию, второй — на насильственное беззаконие.'
- source_word: וְדָם נָקִי אַל תִּשְׁפְּכוּ
  choice: не проливайте невинной крови
  rationale: Сохранены исходный образ и смысл запрета на убийство невиновных.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: на этом месте
  rationale: Буквальная и естественная передача пространственного указания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Соотношение מִשְׁפָּט и צְדָקָה
  choice: Вершите правосудие и поступайте праведно
  alternative: Поступайте справедливо
  rationale: 'Два еврейских понятия не сведены к одному: сохранено напряжение между общественно-правовой справедливостью и праведным поведением.'
- issue: Объекты двух запретительных глаголов
  choice: Оба запрета относятся к чужеземцу, сироте и вдове
  alternative: Второй запрет понимать как самостоятельный общий запрет насилия
  rationale: Три вынесенных вперёд существительных естественно служат объектами обоих следующих запретов; синтаксическая компактность оригинала допускает некоторую неоднозначность, но параллельное прочтение лучше передаётся по-русски.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Архаичные формулы вроде «творите суд и правду» заменены естественными выражениями без утраты двухчленной структуры оригинала.
