lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим высказыванием и естественно звучит по-русски.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: там, куда
  rationale: В сочетании с глаголом перемещения естественно обозначает место назначения, не утяжеляя русскую фразу буквальным «в том месте, куда».
- source_word: הִגְלוּ אֹתוֹ
  choice: его увели в изгнание
  rationale: Каузативная форма глагола גלה означает принудительное удаление в изгнание; неопределённый субъект во множественном числе сохранён формой «увели».
- source_word: שָׁם
  choice: там ... и
  rationale: 'Конструкция «там ... и» сохраняет эмфатическое повторение места: именно в месте изгнания он умрёт.'
- source_word: יָמוּת
  choice: он и умрёт
  rationale: Будущее время прямо передаёт несовершенный вид в пророческом высказывании, а частица «и» подчёркивает שָׁם.
- source_word: וְאֶת־הָאָרֶץ הַזֹּאת
  choice: и ... этой земли
  rationale: В контексте אֶרֶץ обозначает родную землю Иудеи; «земля» сохраняет библейскую и территориальную окраску.
- source_word: לֹא יִרְאֶה עוֹד
  choice: больше не увидит
  rationale: Естественная русская передача отрицания с עוֹד, выражающая окончательность разлуки.
