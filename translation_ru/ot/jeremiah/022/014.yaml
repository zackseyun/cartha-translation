  yaml_path: translation/ot/jeremiah/022/014.yaml
  text: who says[a], ‘I will build myself a spacious house with roomy upper chambers,’ and cuts out windows for it, paneling it with cedar and painting it red.
translation:
  language: ru
  text: 'который говорит: «Построю себе просторный дом и обширные верхние покои», — прорубает в нём окна, обшивает его кедром и красит красной краской.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «красит киноварью» — дорогим красным пигментом; возможно, имеется в виду пигмент на основе минерала киновари.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: который говорит
  rationale: Субстантивированное причастие с артиклем продолжает характеристику человека из предыдущего стиха; оборот естественно связывается с контекстом горестного возгласа.
- source_word: אֶבְנֶה לִּי
  choice: Построю себе
  rationale: Предлог ל с местоименным суффиксом выражает строительство для собственной пользы; русское «себе» передаёт это кратко и естественно.
- source_word: בֵּית מִדּוֹת
  choice: просторный дом
  rationale: Сочетание указывает на внушительные размеры дома; «просторный» сохраняет смысл, не вводя более конкретного понятия «дворец» или «особняк».
- source_word: וַעֲלִיּוֹת מְרֻוָּחִים
  choice: обширные верхние покои
  rationale: עֲלִיּוֹת — помещения верхнего этажа, а מְרֻוָּחִים указывает на простор; «покои» уместно в контексте богатого дома и остаётся понятным современному читателю.
- source_word: וְקָרַע לוֹ חַלּוֹנָי
  choice: прорубает в нём окна
  rationale: קָרַע буквально передаёт резкое раскрытие или рассечение проёмов; «прорубает» сохраняет яркий строительный образ. Местоименный элемент передан как относящийся к дому.
- source_word: וְסָפוּן בָּאָרֶז
  choice: обшивает его кедром
  rationale: Архитектурный термин означает покрытие или облицовку; «обшивает кедром» естественно передаёт роскошную деревянную отделку без неоправданного ограничения только потолком.
- source_word: וּמָשׁוֹחַ בַּשָּׁשַׁר
  choice: красит красной краской
  rationale: שָׁשַׁר обозначает красный пигмент, традиционно связываемый с киноварью; нейтральный основной текст передаёт цвет, а более точная, но не вполне бесспорная идентификация вынесена в сноску.
