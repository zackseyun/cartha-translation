id: JER.22.16
reference: Jeremiah 22:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: דָּ֛ן דִּין עָנִ֥י וְ/אֶבְי֖וֹן אָ֣ז ט֑וֹב הֲ/לוֹא הִ֛יא הַ/דַּ֥עַת אֹתִ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/016.yaml
  text: He defended the cause of the poor and needy[a]; then it was well[b]. Is not that what it means to know me? declares Yahweh.
translation:
  language: ru
  text: Он защищал права бедного и нуждающегося[a]; тогда было хорошо. Разве не это значит знать Меня?[b] — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разбирал дело бедного и нуждающегося». В еврейском тексте употреблена судебная идиома, означающая поддержку их законного дела.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Разве не это — знание Меня?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן דִּין
  choice: защищал права
  rationale: 'Сочетание глагола и однокоренного существительного представляет собой судебную идиому: речь идёт о том, что царь поддерживал законное дело социально уязвимых. Русское «защищал права» естественно передаёт этот смысл, не сводя действие к простому рассмотрению дела.'
- source_word: עָנִי וְאֶבְיוֹן
  choice: бедного и нуждающегося
  rationale: Единственное число сохранено вслед за еврейским текстом. «Бедный» передаёт социальную угнетённость и материальную бедность עָנִי, а «нуждающийся» отличает אֶבְיוֹן как человека, испытывающего острую нужду.
- source_word: אָז טוֹב
  choice: тогда было хорошо
  rationale: «Тогда» сохраняет временно-следственный оттенок אָז, а безличное «было хорошо» кратко и естественно передаёт предикативное טוֹב без добавления не выраженного в тексте подлежащего.
- source_word: הֲלוֹא הִיא הַדַּעַת אֹתִי
  choice: Разве не это значит знать Меня?
  rationale: Риторический вопрос ожидает согласия. Формулировка естественно передаёт субстантивированное «знание Меня», сохраняя связь познания Бога с конкретным справедливым поступком.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современно и литературно; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Смысл знания Яхве в данном контексте
  choice: Знание Бога проявляется в защите прав бедного и нуждающегося
  alternative: Понимать «знать» лишь как интеллектуальное знание о Боге либо считать, что эта фраза полностью исчерпывает содержание богопознания социальной этикой
  rationale: Стих прямо связывает подлинное знание Яхве со справедливым отношением к уязвимым, однако перевод не утверждает, что этим исчерпывается всё богопознание.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Судебная идиома передана понятно для широкого читателя; синтаксическая сжатость оригинала по возможности сохранена.
