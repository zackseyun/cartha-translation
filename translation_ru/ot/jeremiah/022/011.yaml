base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/011.yaml
  text: 'For thus says Yahweh concerning Shallum son of Josiah[a], king of Judah, who reigned in place of Josiah his father, who went out from this place: He shall never return there again.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве о Шаллуме, сыне Иосии[a], царе Иудеи, который царствовал вместо Иосии, своего отца, и покинул это место: он никогда больше не вернётся туда.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Шаллуму, сыну Иосии»; еврейский предлог допускает прямое обращение, но здесь, вероятнее всего, указывает, о ком произносится пророчество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Ибо так говорит
  rationale: כִּי связывает изречение с предшествующим контекстом как основание или пояснение; כֹה אָמַר — устойчивая пророческая формула. Настоящее время естественно для русского библейского повествования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֶל
  choice: о
  rationale: Хотя предлог может означать «к», здесь после формулы речи он, вероятнее всего, вводит тему пророчества. Возможность прямого обращения сохранена в сноске.
- source_word: שַׁלֻּם בֶּן יֹאשִׁיָּהוּ
  choice: Шаллуме, сыне Иосии
  rationale: Имя транслитерировано, родственная связь передана прямо.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царе Иудеи
  rationale: Обычный царский титул, синтаксически оформленный как приложение к имени.
- source_word: הַמֹּלֵךְ תַּחַת יֹאשִׁיָּהוּ אָבִיו
  choice: который царствовал вместо своего отца Иосии
  rationale: Причастие с תַּחַת обозначает царствование на месте другого; «вместо» сохраняет этот оттенок точнее, чем простое «после».
- source_word: אֲשֶׁר יָצָא מִן הַמָּקוֹם הַזֶּה
  choice: и ушёл отсюда
  rationale: יָצָא буквально обозначает выход, но в данном контексте естественное русское «ушёл отсюда» ясно выражает отбытие из указанного места.
- source_word: לֹא יָשׁוּב שָׁם עוֹד
  choice: он больше никогда сюда не вернётся
  rationale: Отрицание с עוֹד выражает окончательность невозвращения. Наречие שָׁם соотнесено с местом, обозначенным ранее с позиции говорящего как «это место»; по-русски последовательная дейктика требует «сюда».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Относится ли אֶל к теме пророчества или вводит прямое обращение
  choice: о Шаллуме
  alternative: Шаллуму
  rationale: В контексте речь, вероятнее всего, сообщается как пророчество о царе, однако грамматически возможно и прямое обращение; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис несколько упрощён ради ясности, без устранения значимой неоднозначности предлога אֶל; формула «Ибо так говорит» сохраняет связь с предыдущим стихом.
