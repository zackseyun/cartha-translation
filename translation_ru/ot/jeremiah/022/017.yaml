base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/017.yaml
  text: But your eyes and your heart are set on nothing except your dishonest gain[a], on shedding innocent blood, and on practicing oppression and extortion.
translation:
  language: ru
  text: Но твои глаза и сердце устремлены лишь к неправедной наживе, к пролитию невинной крови и к тому, чтобы угнетать и творить насилие[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «...угнетать и совершать жестокие злодеяния». Еврейское слово, переведённое как «насилие», встречается редко и может в более широком смысле обозначать безжалостное или насильственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... כִּי אִם
  choice: лишь к
  rationale: Отрицательно-исключительная конструкция выражает единственную направленность внимания и намерений; краткое «лишь к» естественно передаёт эту силу по-русски.
- source_word: עֵינֶיךָ וְלִבְּךָ
  choice: твои глаза и сердце устремлены
  rationale: Сохранён исходный образ глаз и сердца как внимания, желаний и воли; «устремлены» делает метафору естественной для современного русского языка.
- source_word: בִּצְעֶךָ
  choice: неправедной наживе
  rationale: Слово обозначает прибыль, особенно добытую корыстным или несправедливым путём. «Неправедная нажива» сохраняет как материальный, так и нравственный смысл.
- source_word: דַּם הַנָּקִי לִשְׁפּוֹךְ
  choice: к пролитию невинной крови
  rationale: Передана устойчивая библейская формула о крови невиновных; инфинитив «пролить» естественно преобразован в отглагольное существительное внутри однородного ряда.
- source_word: הָעֹשֶׁק
  choice: к угнетению
  rationale: Существительное охватывает притеснение, эксплуатацию и несправедливое обращение; «угнетение» сохраняет широкий общественный смысл.
- source_word: הַמְּרוּצָה
  choice: насилию
  rationale: Редкое и не вполне ясное слово в данном контексте указывает на жестокое, насильственное или безжалостное злодеяние. Основной текст использует широкое «насилие», а неопределённость отмечена в сноске.
- source_word: לַעֲשׂוֹת
  choice: передано построением «к угнетению и насилию»
  rationale: Значение совершения этих действий естественно выражено русскими отглагольными существительными; отдельное «делать» создало бы тяжеловесную конструкцию.
