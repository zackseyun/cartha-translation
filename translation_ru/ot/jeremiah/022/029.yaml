base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/029.yaml
  text: Land[a], land, land, hear the word of Yahweh.
translation:
  language: ru
  text: Земля[a], земля, земля! Слушай слово Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Страна, страна, страна!» Еврейское слово может означать как страну, то есть землю определённого народа, так и землю в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ / אָרֶץ
  choice: земля
  rationale: Еврейское слово может обозначать как землю или страну, так и землю в широком смысле. Русское «земля» сохраняет эту многозначность и естественно звучит в троекратном пророческом обращении; в контексте вероятнее всего имеется в виду земля Иудеи.
- source_word: שִׁמְעִי
  choice: слушай
  rationale: Форма представляет собой повелительное наклонение женского рода единственного числа и согласуется с обращением «земля». «Слушай» естественно передаёт призыв внимательно принять пророческое слово, не сужая смысл до одного лишь послушания.
- source_word: דְּבַר
  choice: слово
  rationale: В сочетании «слово Яхве» это традиционная и точная передача пророческой формулы; «весть» была бы более истолковывающим вариантом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между Божьим именем и титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией «Яхве», а не заменено титулом.
- issue: К кому обращено троекратное אֶרֶץ
  choice: земля — с сохранением лексической широты
  alternative: страна; вся земля
  rationale: Контекст допускает прежде всего обращение к земле Иудеи, однако само слово шире и может означать также землю вообще. Перевод не ограничивает адресата сильнее, чем исходный текст.
translation_notes:
  register: Краткое, возвышенное пророческое обращение. Троекратный повтор и резкий переход к повелению сохранены; восклицательный знак передаёт настойчивость призыва без добавления нового содержания.
