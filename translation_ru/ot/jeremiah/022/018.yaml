base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/018.yaml
  text: 'Therefore thus says Yahweh concerning Jehoiakim son of Josiah[a], king of Judah: They will not lament for him, saying, “Alas, my brother!” or “Alas, sister!” They will not lament for him, saying, “Alas, lord!” or “Alas[d][c][b], his majesty!”'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве об Иоакиме, сыне Иосии, царе Иудеи: «Не будут оплакивать[a] его: „Увы, брат мой! Увы, сестра![b]“ Не будут оплакивать его: „Увы, господин![c] Увы, его величие![d]“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будут совершать по нему погребальный плач». Древнееврейский глагол часто обозначает именно обрядовое оплакивание умершего.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сестра»; в отличие от выражения «брат мой», притяжательное местоимение здесь не выражено.'
    reason: source_form
  - marker: c
    text: 'Или: «владыка». Древнееврейское слово может обозначать господина, правителя или вышестоящего.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «Увы, великолепие его!» Речь идёт о царственном величии или блеске.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего пророческого обличения и сохраняет логическую связь.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет устойчивую пророческую формулу в естественной для современного русского языка форме и передаёт личное имя Бога.
- source_word: אֶל
  choice: об
  rationale: В данном контексте предлог вводит того, о ком произносится пророчество, а не адресата прямой речи.
- source_word: יְהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Иоаким, сын Иосии, царь Иудеи
  rationale: Использованы традиционные русские формы библейских имён; полное царское обозначение сохранено.
- source_word: לֹא יִסְפְּדוּ לוֹ
  choice: Не будут оплакивать его
  rationale: Глагол ספד обозначает прежде всего публичное, в особенности погребальное, оплакивание; русский глагол сохраняет этот оттенок.
- source_word: הוֹי
  choice: Увы
  rationale: Междометие выражает скорбный возглас в погребальном плаче; «увы» соответствует возвышенному, но понятному регистру.
- source_word: אָחִי
  choice: брат мой
  rationale: Сохранён явно выраженный древнееврейский суффикс первого лица единственного числа.
- source_word: אָחוֹת
  choice: сестра
  rationale: В древнееврейском слове нет притяжательного суффикса, в отличие от предшествующего «брат мой»; асимметрия сохранена.
- source_word: אָדוֹן
  choice: господин
  rationale: Слово обозначает господина, властителя или вышестоящего; «господин» естественно передаёт обращение к земному царю без отождествления с божественным титулом.
- source_word: הֹדֹה
  choice: его величие
  rationale: הוֹד означает величие, великолепие или блеск; местоименный суффикс третьего лица сохранён.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Смысл погребальных возгласов
  choice: Сохранить четыре отдельные формулы плача без уточнения личности плакальщиков
  alternative: Истолковать их как слова родственников или подданных царя
  rationale: Текст противопоставляет семейные и статусные возгласы, но не называет говорящих; перевод не вводит отсутствующего в оригинале толкования.
- issue: Передача הֹדֹה
  choice: его величие
  alternative: его великолепие; слава его; Его Величество
  rationale: Выбор сохраняет царственный оттенок и местоименный суффикс, не превращая абстрактное существительное в однозначный официальный титул.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Повтор синтаксической формулы и краткие возгласы сохранены как элементы погребального плача. Пунктуация помогает ясно различить четыре цитируемых возгласа, не сглаживая необычную параллельность древнееврейского текста.
