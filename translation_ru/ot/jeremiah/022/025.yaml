source:
  edition: WLC
  text: וּ/נְתַתִּ֗י/ךָ בְּ/יַד֙ מְבַקְשֵׁ֣י נַפְשֶׁ֔/ךָ וּ/בְ/יַ֛ד אֲשֶׁר אַתָּ֥ה יָג֖וֹר מִ/פְּנֵי/הֶ֑ם וּ/בְ/יַ֛ד נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/בְ/יַ֥ד הַ/כַּשְׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/025.yaml
  text: And I will give you into the hand of those who seek your life[a], into the hand of those before whom you are afraid, into the hand of Nebuchadnezzar king of Babylon[b], and into the hand of the Chaldeans.
translation:
  language: ru
  text: И отдам тебя в руки тех, кто ищет твоей смерти, в руки тех, кого ты боишься, в руки Навуходоносора, царя Вавилона[a], и в руки халдеев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская форма имени здесь ближе к варианту «Навуходреццар».
    reason: lexical_alternative
  - marker: b
    text: В данном контексте «халдеи» может означать также вавилонян или вавилонские войска.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  choice: И отдам тебя
  rationale: В сочетании с повторяющимся בְיַד глагол נתן означает передачу человека под чужую власть; «отдам тебя в руки» естественно передаёт и смысл, и образ исходного текста.
- source_word: בְּיַד
  choice: в руки
  rationale: Сохраняет конкретный древнееврейский образ передачи под власть другого и риторический повтор трёх однородных оборотов.
- source_word: מְבַקְשֵׁי נַפְשֶׁךָ
  choice: тех, кто ищет твоей смерти
  rationale: נפש здесь обозначает жизнь человека, а всё выражение — намерение лишить его жизни. Русское «ищет твоей смерти» сохраняет образный характер оборота и ясно передаёт угрозу убийства.
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  choice: тех, кого ты боишься
  rationale: יגור в данном контексте выражает страх; такой перевод естественен по-русски и не утяжеляет фразу буквальным воспроизведением конструкции מִפְּנֵי.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносора
  rationale: Использована устоявшаяся в русской библейской и исторической традиции форма имени; вариант исходного еврейского написания отмечен в сноске.
- source_word: מֶלֶךְ בָּבֶל
  choice: царя Вавилона
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: הַכַּשְׂדִּים
  choice: халдеев
  rationale: Сохраняет этноним исходного текста; в данном контексте он может шире обозначать вавилонян или вавилонские войска, что отмечено в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного ритма и трёхкратного повтора «в руки». Обращение передано в единственном числе, как в еврейском тексте. Выражение «ищет твоей смерти» выбрано вместо двусмысленного для современного читателя «ищет твоей души».
