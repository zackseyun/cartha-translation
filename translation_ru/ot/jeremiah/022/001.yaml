    text: 'Или: «эту весть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет узнаваемую формулу пророческого послания и передаёт личное имя יהוה как «Яхве».
- source_word: רֵד
  choice: сойди
  rationale: Императив передаёт направленное движение вниз; «сойди» естественно и точно в данном повествовательном контексте.
- source_word: בֵּית מֶלֶךְ יְהוּדָה
  choice: во дворец царя Иудеи
  rationale: Буквально сказано «в дом царя Иудеи», однако здесь сочетание обозначает царскую резиденцию; «дворец» предотвращает ошибочное понимание как династии или обычного жилища.
- source_word: וְדִבַּרְתָּ שָׁם
  choice: и передай там
  rationale: Последовательная форма после императива продолжает повеление. В сочетании с «слово» глагол «передай» естественно выражает поручение сообщить пророческое послание, не усиливая его до «провозгласи».
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: это слово
  rationale: Сохраняет единственное число и характерное для пророческой речи обозначение Божьего сообщения; возможное значение «весть, послание» отмечено в сноске.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом, не добавляя в основной текст замену, которой в исходнике нет.
- issue: Характер речи, которую должен передать пророк
  choice: это слово
  alternative: эту весть
  rationale: Дословная формулировка сохраняет пророческую категорию «слова», не исключая более широкого значения «весть».
translation_notes:
  register: Современный литературный русский с торжественной, но не архаичной пророческой интонацией. Двоеточие в конце вводит речь, следующую в следующем стихе.
