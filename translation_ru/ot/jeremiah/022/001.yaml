base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/001.yaml
  text: 'Thus says Yahweh: Go down to the house of the king of Judah[c][b][a], and speak there this word:'
translation:
  language: ru
  text: 'Так говорит Яхве[a]: «Сойди во дворец царя Иудеи[b] и скажи там это слово[c]:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот что говорит Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в дом царя Иудеи»; по смыслу, вероятно, имеется в виду царский дворец.'
