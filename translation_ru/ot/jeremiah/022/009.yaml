  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹֽהֵי/הֶ֑ם וַ/יִּֽשְׁתַּחֲו֛וּ לֵ/אלֹהִ֥ים אֲחֵרִ֖ים וַ/יַּעַבְדֽוּ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/009.yaml
  text: And they will say[b][a], ‘Because they abandoned the covenant of Yahweh their God and bowed down to other gods and served them.’
translation:
  language: ru
  text: 'И скажут: «За то, что они оставили[a] завет Яхве, своего Бога, поклонялись другим богам[b] и служили им».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покинули»; здесь имеется в виду отказ от верности завету.'
    reason: lexical_alternative
  - marker: b
    text: Буквально глагол может обозначать, что они склонялись или простирались перед другими богами; вместе со словами «служили им» он описывает идолопоклонство.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: И скажут
  rationale: Будущая форма естественно продолжает вопрос и предсказание предыдущего стиха; союз «и» сохраняет связь с еврейским текстом.
- source_word: עַל אֲשֶׁר
  choice: За то, что
  rationale: Оборот вводит причину суда и по-русски естественно отвечает на вопрос «за что?» из предыдущего стиха.
- source_word: עָזְבוּ
  choice: они оставили
  rationale: Передаёт отказ от верности завету, не добавляя отсутствующего в тексте глагола «нарушили».
- source_word: בְּרִית
  choice: завет
  rationale: Стандартное и уместное обозначение отношений, установленных между Богом и его народом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵיהֶם
  choice: своего Бога
  rationale: Несмотря на морфологически множественную форму, в формуле завета слово обозначает единого Бога Израиля; возвратное местоимение естественно для русского языка при подлежащем «они».
- source_word: וַיִּשְׁתַּחֲווּ לֵאלֹהִים אֲחֵרִים
  choice: поклонялись другим богам
  rationale: Глагол обозначает поклон или простирание перед кем-либо и в данном контексте выражает религиозное поклонение.
- source_word: וַיַּעַבְדוּם
  choice: и служили им
  rationale: Сохраняет различие между двумя еврейскими глаголами и передаёт служение как культовую преданность другим богам.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; «Яхве» передаёт его как имя и не подменяет титулом.
- issue: Соотношение поклонения и служения другим богам
  choice: поклонялись другим богам и служили им
  alternative: поклонялись другим богам
  rationale: 'Сохранены оба глагола исходного текста: вместе они описывают идолопоклонство, но их смысловые оттенки не сливаются в одно действие.'
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным библейским звучанием. Синтаксис сохраняет причинный ответ на вопрос предыдущего стиха, а два глагола идолопоклонства переданы раздельно.
