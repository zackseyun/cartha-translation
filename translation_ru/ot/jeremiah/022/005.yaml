base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/005.yaml
  text: But if you do not listen to these words[a], I swear by myself, declares Yahweh, that this house will become a ruin.
translation:
  language: ru
  text: Но если вы не послушаете этих слов, клянусь Собой, — возвещает Яхве, — что этот дом превратится в развалины[a].
  philosophy: optimal-equivalence
  footnotes:
