    text: 'Или: «этот дворец». В данном контексте под «домом», вероятно, подразумевается царский дом — дворец царя Иудеи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Но если … не
  rationale: Условная конструкция противопоставлена предшествующему обещанию; «но если» естественно передаёт этот контраст.
- source_word: תִשְׁמְעוּ
  choice: послушаете
  rationale: Глагол שׁמע здесь означает не просто физически услышать, а внять сказанному. «Послушаете» сохраняет связь со слухом и подразумевает отклик, не заменяя значение прямым «повинуетесь».
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: этих слов
  rationale: В контексте пророческой речи דְּבָרִים естественно означает «слова».
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: клянусь Собой
  rationale: Формула клятвы означает, что Яхве клянётся Самим Собой. Настоящее время по-русски передаёт перформативную силу древнееврейского перфекта; прописная буква у возвратного местоимения соответствует торжественному упоминанию Бога.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современно и достойно; личное имя יְהוָה транслитерировано как «Яхве».
- source_word: לְחָרְבָּה
  choice: в развалины
  rationale: חָרְבָּה обозначает разорённое, опустошённое место. Множественное «развалины» в русском языке естественно сочетается с «превратится» и ясно выражает итог разрушения.
- source_word: יִהְיֶה הַבַּיִת הַזֶּה
  choice: этот дом превратится
  rationale: Буквально «этот дом будет»; с результативным дополнением по-русски естественнее «превратится». Слово «дом» сохранено ввиду смысловой широты בַּיִת.
theological_decisions:
- issue: Временная форма и характер божественной клятвы
  choice: клянусь Собой
  alternative: Я поклялся Собой
  rationale: Древнееврейский перфект в формуле прямой клятвы допускает перформативное понимание. Настоящее время сохраняет непосредственность и торжественность предупреждения, не меняя его содержания.
- issue: Референт выражения «этот дом»
  choice: этот дом
  alternative: этот дворец
  rationale: Контекст указывает на царский дом, вероятно дворец царя Иудеи, однако בַּיִת буквально и намеренно шире. Основной текст сохраняет эту неоднозначность, а контекстуальное значение поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Порядок реплик и тире делают формулу клятвы ясной, не сглаживая её напряжённости. Личное имя Бога передано как «Яхве».
