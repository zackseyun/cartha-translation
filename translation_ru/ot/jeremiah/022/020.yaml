base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/020.yaml
  text: Go up to Lebanon and cry out[a]; raise your voice in Bashan; cry out from Abarim[b], for all your lovers are shattered.
translation:
  language: ru
  text: Поднимись на Ливан и кричи; в Васане подай голос; кричи из Аварима[a], потому что сокрушены все твои любовники[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с переправ» или «из областей по ту сторону». Здесь, в ряду с Ливаном и Васаном, еврейское выражение, вероятно, является названием горной области Аварим.'
    reason: lexical_alternative
  - marker: b
    text: «Любовники» — пророческий образ чужеземных союзников и политических партнёров Иудеи.
    reason: cultural_note
lexical_decisions:
- source_word: עֲלִי
  choice: Поднимись
  rationale: Форма повелительного наклонения женского рода единственного числа от עלה; передаёт движение вверх и обращение к олицетворённому Иерусалиму или Иудее.
- source_word: וּצְעָקִי / וְצַעֲקִי
  choice: и кричи / кричи
  rationale: Повтор глагола צעק сохранён ради параллелизма и настойчивости; «кричи» не уточняет без необходимости, идёт ли речь о вопле, плаче или призыве.
- source_word: וּבַבָּשָׁן
  choice: на Васане
  rationale: Васан — географическая область; русское «на Васане» естественно для названия территории и сохраняет географический ряд.
- source_word: תְּנִי קוֹלֵךְ
  choice: подай голос
  rationale: Близкая и понятная передача еврейской идиомы «дай свой голос», обозначающей громкий возглас.
- source_word: מֵעֲבָרִים
  choice: с Аварима
  rationale: В контексте Ливана и Васана вероятнее всего обозначает горную область Аварим; возможность нарицательного понимания отмечена в сноске.
- source_word: נִשְׁבְּרוּ
  choice: сокрушены
  rationale: Нифаль перфекта от שבר передаёт постигший их разгром; «сокрушены» сохраняет образ слома и звучит естественно в пророческой поэзии.
- source_word: מְאַהֲבָיִךְ
  choice: твои любовники
  rationale: Сохранена резкая пророческая метафора, вероятно относящаяся к чужеземным политическим союзникам Иудеи; интерпретирующее «союзники» оставлено для сноски.
theological_decisions:
- issue: Кого обозначают «любовники»
  choice: Сохранить метафору «твои любовники» в основном тексте.
  alternative: Передать прямо как «твои союзники».
  rationale: Пророческая речь изображает политические связи Иудеи как неверную любовь. Прямая метафора сохраняет литературное и богословское напряжение, тогда как её политический смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Женские формы повелительных глаголов сохранены как обращение к олицетворённому Иерусалиму или Иудее; географический параллелизм и повтор «кричи» воспроизведены.
