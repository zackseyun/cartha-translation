  naturalness: Современный литературный регистр в целом выдержан. «Поднимись на Ливан», «подай голос» и «сокрушены» уместны в пророческой поэзии. Исправление предлогов делает географические указания более естественными и точными.
  terminology: «Ливан», «Васан», «Аварим» переданы последовательно. «Любовники» обоснованно сохраняет пророческую метафору; пояснение о чужеземных союзниках не подменяет основной текст. Сноска к Авариму должна яснее обозначать альтернативное нарицательное прочтение, не выдавая его за установленное.
