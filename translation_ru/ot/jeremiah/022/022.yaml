base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/022.yaml
  text: All your shepherds the wind will shepherd[a], and your lovers will go into captivity[b]; then you will surely be ashamed and humiliated because of all your evil.
translation:
  language: ru
  text: Всех твоих пастырей будет пасти ветер[a], и твои возлюбленные пойдут в плен[b]. Тогда ты постыдишься и будешь посрамлена из-за всего твоего зла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всех твоих вождей ветер развеет». В еврейском тексте слова «пастырей» и «пасти» происходят от одного корня, создавая ироническую игру слов.'
    reason: lexical_alternative
  - marker: b
    text: «Возлюбленные» — пророческий образ политических союзников Иудеи и её неверных привязанностей.
    reason: cultural_note
lexical_decisions:
- source_word: רֹעַיִךְ
  choice: твои пастыри
  rationale: Сохраняет буквальный пастушеский образ и его переносное указание на правителей; слово «руководители» преждевременно сняло бы метафору.
- source_word: תִּרְעֶה רוּחַ
  choice: будет пасти ветер
  rationale: Повтор глагольного корня רעה передан словами «пастырей… пасти», что сохраняет намеренную иронию оригинала. Необычность выражения соответствует необычности еврейского оборота; вероятный смысл — ветер унесёт или рассеет их.
- source_word: מְאַהֲבַיִךְ
  choice: твои возлюбленные
  rationale: Сохраняет пророческую метафору неверных привязанностей Иудеи и её политических союзников, не заменяя образ прямым толкованием.
- source_word: בַּשְּׁבִי יֵלֵכוּ
  choice: пойдут в плен
  rationale: Близко передаёт буквальную конструкцию «пойдут в плен» и естественно звучит по-русски.
- source_word: כִּי אָז
  choice: тогда
  rationale: В контексте вводит следующий за судом результат; «тогда» ясно и естественно выражает последовательность.
- source_word: תֵּבֹשִׁי וְנִכְלַמְתְּ
  choice: ты постыдишься и будешь посрамлена
  rationale: 'Различает два близких понятия: пережитый стыд и постигшее публичное посрамление. Женский род соответствует обращению к олицетворённой стране/столице.'
- source_word: מִכֹּל רָעָתֵךְ
  choice: из-за всего твоего зла
  rationale: Предлог מִן здесь естественно понимается как указание на причину стыда; «зло» сохраняет широту רָעָה.
theological_decisions:
- issue: Метафорическое описание правителей и неверных связей Иудеи
  choice: Сохранить в основном тексте образы «пастырей» и «возлюбленных».
  alternative: Передать их пояснительно как «правителей» и «союзников».
  rationale: Исходный текст обличает Иудею посредством многозначных пророческих образов. Их сохранение удерживает политический и духовно-нравственный уровни смысла, не сводя стих к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Намеренно сохранён необычный оборот «пастырей будет пасти ветер», поскольку он воспроизводит корневой повтор и иронию еврейского текста; более прозрачный смысл дан в сноске. Формы женского рода отражают обращение к олицетворённой Иудее/Иерусалиму.
