  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: חַי אָנִי֮ נְאֻם יְהוָה֒ כִּ֣י אִם יִהְיֶ֞ה כָּנְיָ֤הוּ בֶן יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה חוֹתָ֖ם עַל יַ֣ד יְמִינִ֑/י כִּ֥י מִ/שָּׁ֖ם אֶתְּקֶֽ/נְךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/024.yaml
  text: As I live[a], declares Yahweh, even if Coniah son of Jehoiakim, king of Judah, were a signet ring on my right hand[b], even from there I would tear you off.
translation:
  language: ru
  text: «Живу Я, — возвещает Яхве, — даже если бы Кония[a], сын Иоакима, царь Иудеи, был перстнем-печаткой[b] на Моей правой руке, Я и оттуда сорвал бы тебя».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кония — краткая форма имени царя, в других местах также называемого Иехонией.
    reason: alternative_name_form
  - marker: b
    text: 'Или: «печатью». Речь идёт о личной печати, которую носили на руке как знак власти и особой ценности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: Живу Я
  rationale: Сохранена краткая и торжественная древнееврейская формула божественной клятвы; контекст ясно передаёт её клятвенную силу без добавления отсутствующего в тексте глагола «клянусь».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Пророческая формула передана современно и весомо; «возвещает» лучше отражает торжественное провозглашение, чем нейтральное «говорит».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, присутствующее в еврейском тексте, без замены титулом.
- source_word: כִּי אִם יִהְיֶה
  choice: даже если бы ... был
  rationale: Условно-уступительная конструкция выражает предельно сильное допущение, которое всё равно не отменяет последующего приговора.
- source_word: כָּנְיָהוּ
  choice: Кония
  rationale: Сохранена конкретная краткая форма имени, употреблённая в данном стихе, без гармонизации с формой «Иехония».
- source_word: חוֹתָם
  choice: перстень-печатка
  rationale: Выражение передаёт и печать как знак власти, и носимый на руке предмет, соответствуя образу в контексте.
- source_word: עַל יַד יְמִינִי
  choice: на Моей правой руке
  rationale: Естественно передан еврейский образ близости, ценности и власти.
- source_word: כִּי מִשָּׁם
  choice: Я и оттуда
  rationale: Частица «и» подчёркивает, что даже столь почётное и близкое положение не защитило бы адресата от удаления.
- source_word: אֶתְּקֶנְךָּ
  choice: сорвал бы тебя
  rationale: Глагол נתַק обозначает резкое, насильственное отделение; «сорвал» естественно продолжает образ предмета, снятого с руки.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст прямо употребляет Тетраграмматон; личное имя сохранено, а не заменено титулом.
- issue: Форма имени כָּנְיָהוּ
  choice: Кония
  alternative: Иехония
  rationale: Перевод сохраняет именно ту форму имени, которая стоит в этом стихе; более полная форма отмечена в сноске.
- issue: Переход от третьего лица ко второму
  choice: Кония ... тебя
  alternative: Кония ... его
  rationale: 'Сохранён резкий риторический переход оригинала: сначала царь назван в третьем лице, затем Бог обращается непосредственно к нему.'
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис сохраняет форму божественной клятвы, сильное уступительное условие и намеренный переход от упоминания царя к прямому обращению. «Перстень-печатка» понятно современному читателю и точно поддерживает образ предмета на правой руке.
