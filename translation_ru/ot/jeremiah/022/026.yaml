  text: וְ/הֵֽטַלְתִּ֣י אֹתְ/ךָ֗ וְ/אֶֽת אִמְּ/ךָ֙ אֲשֶׁ֣ר יְלָדַ֔תְ/ךָ עַ֚ל הָ/אָ֣רֶץ אַחֶ֔רֶת אֲשֶׁ֥ר לֹֽא יֻלַּדְתֶּ֖ם שָׁ֑ם וְ/שָׁ֖ם תָּמֽוּתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/026.yaml
  text: And I will hurl you and your mother who gave birth to you into another land[a], where you were not born, and there you will die.
translation:
  language: ru
  text: И Я брошу тебя и твою мать, которая родила тебя, в другую землю[a], где вы не родились, и там вы умрёте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте обращение переходит от единственного числа («тебя») к множественному («вы не родились», «вы умрёте»), поскольку далее речь идёт о царе вместе с его матерью.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  choice: И Я брошу
  rationale: Порода hифиль передаёт принудительное, резкое перемещение. «Брошу» естественно звучит по-русски и сохраняет силу образа суда; «извергну» было бы менее прозрачным и стилистически более архаичным.
- source_word: אֹתְךָ וְאֶת אִמְּךָ
  choice: тебя и твою мать
  rationale: Прямо передаёт два согласованных дополнения; далее множественное число относится к царю и его матери вместе.
- source_word: אֲשֶׁר יְלָדַתְךָ
  choice: которая родила тебя
  rationale: Относительное предложение относится к матери. Такой вариант точен, ясен и естественен в современном русском языке.
- source_word: עַל הָאָרֶץ אַחֶרֶת
  choice: в другую землю
  rationale: При глаголе бросания предлог עַל выражает направленность перемещения. «В другую землю» идиоматично передаёт насильственную высылку, сохраняя территориальный смысл אֶרֶץ.
- source_word: אֲשֶׁר לֹא יֻלַּדְתֶּם שָׁם
  choice: где вы не родились
  rationale: Форма глагола во множественном числе охватывает царя и его мать. Русское «вы» явно сохраняет этот переход числа.
- source_word: וְשָׁם תָּמֽוּתוּ
  choice: и там вы умрёте
  rationale: Множественное число продолжает совместное обращение к царю и его матери; будущее время естественно передаёт определённость пророческого суда.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавное «Я» обозначает говорящего Господа по контексту. Переход от «тебя» к «вы» сохранён в основном тексте и пояснён сноской.
