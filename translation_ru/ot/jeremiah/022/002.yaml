  text: וְ/אָֽמַרְתָּ֙ שְׁמַ֣ע דְּבַר יְהוָ֔ה מֶ֣לֶךְ יְהוּדָ֔ה הַ/יֹּשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד אַתָּ֤ה וַ/עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֔ הַ/בָּאִ֖ים בַּ/שְּׁעָרִ֥ים הָ/אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/002.yaml
  text: and say[a], ‘Hear the word of Yahweh, O king of Judah, who sits on the throne of David—you, your servants, and your people who enter through these gates.’
translation:
  language: ru
  text: 'И скажи: «Слушай слово Яхве, царь Иудеи, сидящий на престоле Давида, — ты, твои слуги[a] и твой народ, входящие через эти ворота».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твои придворные»; букв. «твои слуги».'
    reason: В царском контексте עֲבָדִים может обозначать служащих или должностных лиц царя, но еврейское слово шире этого значения.
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: и скажи
  rationale: Продолжает данное в предыдущем стихе повеление и естественно вводит прямую речь.
- source_word: שְׁמַע
  choice: Слушай
  rationale: Императив выражает пророческий призыв внимательно принять весть; «слушай» естественно в современном русском и не сужает значение до одного лишь послушания.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и вес существительного דָּבָר.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно представленное тетраграмматоном.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: В прямой речи словосочетание имеет звательную функцию, ясно передаваемую русской интонацией без архаического «о».
- source_word: הַיֹּשֵׁב עַל כִּסֵּא דָוִד
  choice: сидящий на престоле Давида
  rationale: Причастный оборот относится к царю в единственном числе и сохраняет династический образ престола Давида.
- source_word: אַתָּה וַעֲבָדֶיךָ וְעַמְּךָ
  choice: ты, твои слуги и твой народ
  rationale: Самостоятельное местоимение подчёркивает, что призыв обращён не только к царю, но также к его подчинённым и народу; «слуги» сохраняет широту עֲבָדִים.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: входящие через эти ворота
  rationale: Передаёт причастную конструкцию и естественное для русского обозначение движения через ворота.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Оттенок глагола שׁמע
  choice: Слушай
  alternative: Повинуйся
  rationale: Контекст требует принятия пророческого слова, однако сам глагол допускает смысловой диапазон от слушания до послушания; перевод не устраняет эту напряжённость толкованием.
translation_notes:
  register: Современный литературный русский с торжественностью пророческой речи. Синтаксис сохраняет расширенное обращение и подчёркнутое «ты», а пунктуация помогает показать, что царь, слуги и народ вместе должны слушать слово.
