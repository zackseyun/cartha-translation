  naturalness: «Я непременно сделаю тебя пустыней, городами необитаемыми» сохраняет пророческую образность и грамматическую шероховатость оригинала; без пояснения это всё же понятно в современном литературном русском. Разбивка строк уместна.
  terminology: «Яхве», «дом царя Иудеи», «Галаад» и «Ливан» употреблены последовательно и корректно. «Сделаю» ближе к שׂים, чем «превращу», не меняя смысла.
