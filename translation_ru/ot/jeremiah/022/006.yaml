  to: 'Ибо так говорит Яхве о доме царя Иудеи:


    «Ты для Меня — Галаад,

    вершина Ливана;

    Я непременно сделаю тебя пустыней,

    городами необитаемыми».[a]'
  rationale: Удалён не выраженный в оригинале союз «но». «Сделаю тебя пустыней, городами необитаемыми» ближе воспроизводит соположенные образы еврейского текста и не устраняет его синтаксическую шероховатость посредством излишнего толкования. Сноска поясняет конструкцию, не расширяя её контекстуальными выводами.
