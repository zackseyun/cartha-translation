base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/006.yaml
  text: 'For thus says Yahweh concerning the house of the king of Judah: You are Gilead to me[a], the summit of Lebanon; surely I will make you a wilderness[c][b], cities not inhabited.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве о доме царя Иудеи:


    «Ты для Меня — Галаад,

    вершина Ливана;

    Я непременно сделаю тебя пустыней,

    городами необитаемыми».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пустыней, городами необитаемыми». Последнее сочетание стоит рядом с «пустыней» и описывает запустение: города остаются без жителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: עַל בֵּית מֶלֶךְ יְהוּדָה
  choice: о доме царя Иудеи
  rationale: «О» естественно вводит предмет пророчества, не вкладывая в предлог враждебность; «дом» сохраняет возможную широту значения — дворец, царский двор или династический дом.
- source_word: גִּלְעָד אַתָּה לִי
  choice: Ты для Меня — Галаад
  rationale: Сохраняет метафорическое отождествление и дательный оттенок отношения или оценки в לִי.
- source_word: רֹאשׁ הַלְּבָנוֹן
  choice: вершина Ливана
  rationale: В географическом образе רֹאשׁ означает верх или вершину; такой перевод естественен по-русски и сохраняет образ возвышенности.
- source_word: אִם לֹא
  choice: но Я непременно
  rationale: Конструкция имеет клятвенно-усилительное, а не обычное условное значение. «Непременно» передаёт уверенность приговора; «но» естественно выражает резкий смысловой поворот, хотя отдельного противительного союза в еврейском нет.
- source_word: אֲשִׁיתְךָ מִדְבָּר
  choice: превращу тебя в пустыню
  rationale: В сочетании с предикативным существительным שׂים обозначает приведение в состояние; «превращу» звучит естественно и ясно передаёт результат опустошения.
- source_word: עָרִים לֹא נוֹשָׁבָה
  choice: в необитаемые города
  rationale: 'Передаёт стоящее в приложении описание результата суда: города останутся без жителей; смена числа сохраняет неровность образа оригинала.'
theological_decisions:
- issue: Почётный географический образ и последующий приговор
  choice: Сохранить прямое сопоставление царского дома с Галаадом и вершиной Ливана, затем без смягчения передать неизбежность опустошения.
  alternative: Понять названия мест преимущественно как указание на богатые кедром области, связанные с устройством дворца.
  rationale: Текст намеренно ставит рядом образ ценности и величия и клятвенно подтверждённый приговор; перевод не сводит эту напряжённость к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим ритмом. Синтаксис разбит на строки для сохранения параллелизма и резкого перехода от величия к запустению.
