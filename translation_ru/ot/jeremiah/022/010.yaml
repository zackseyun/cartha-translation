  text: אַל תִּבְכּ֣וּ לְ/מֵ֔ת וְ/אַל תָּנֻ֖דוּ ל֑/וֹ בְּכ֤וּ בָכוֹ֙ לַֽ/הֹלֵ֔ךְ כִּ֣י לֹ֤א יָשׁוּב֙ ע֔וֹד וְ/רָאָ֖ה אֶת אֶ֥רֶץ מוֹלַדְתּֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/010.yaml
  text: Do not weep for the dead[a], and do not mourn for him. Weep bitterly for the one going away[b], for he will never return or see the land of his birth.
translation:
  language: ru
  text: Не плачьте об умершем и не скорбите о нём. Горько плачьте об уходящем[a], потому что он больше не вернётся и не увидит землю, где родился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном контексте «уходящий» — правитель, которого уводят в изгнание.
    reason: cultural_note
lexical_decisions:
- source_word: תִּבְכּוּ
  choice: плачьте
  rationale: Глагол בכה обычно означает «плакать»; это естественное и уместное слово в контексте оплакивания.
- source_word: לְמֵת
  choice: об умершем
  rationale: Форма מֵת обозначает умершего человека; русский субстантивированный оборот сохраняет краткость и допускает как конкретное, так и обобщённое прочтение.
- source_word: תָּנֻדוּ לוֹ
  choice: скорбите о нём
  rationale: В контексте плача נוד может означать выражение скорби или соболезнование; перевод не конкретизирует возможный жест.
- source_word: בְּכוּ בָכוֹ
  choice: горько плачьте
  rationale: Сочетание императива с абсолютным инфинитивом усиливает повеление; наречие «горько» естественно передаёт эту интенсивность по-русски.
- source_word: לַהֹלֵךְ
  choice: об уходящем
  rationale: Буквально — «о том, кто уходит». Выбор сохраняет словесный образ и не вводит прямо понятие ссылки, хотя контекст указывает на насильственное удаление правителя.
- source_word: לֹא יָשׁוּב עוֹד
  choice: уже не вернётся
  rationale: 'Сочетание отрицания с עוֹד выражает окончательность: он больше не вернётся. «Уже не вернётся» естественно звучит в данном пророческом контексте.'
- source_word: וְרָאָה
  choice: и не увидит
  rationale: Вторая глагольная форма находится в сфере предшествующего отрицания; явное повторение «не» необходимо для ясного и естественного русского синтаксиса.
- source_word: אֶרֶץ מוֹלַדְתּוֹ
  choice: землю, где родился
  rationale: מוֹלֶדֶת означает родную землю или место рождения. Описательный оборот понятен современному читателю и сохраняет конкретное значение אֶרֶץ — «земля, страна».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной интонацией. Параллелизм двух запретов и усиленного повеления сохранён; контекстуальное уточнение об изгнании вынесено в примечание, чтобы не сужать буквальный образ основного текста.
