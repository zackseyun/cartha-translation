base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/021.yaml
  text: I spoke to you in your prosperity[a], but you said, ‘I will not listen.’ This has been your way from your youth[b], for you have not listened to my voice.
translation:
  language: ru
  text: 'Я говорил тебе в дни твоего благополучия[a], но ты сказала: «Не стану слушать». Таков твой путь с юности[b], ибо ты не слушала Моего голоса.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в твоём покое»; еврейское слово может обозначать спокойствие, безопасность или благополучие.'
    reason: lexical_alternative
  - marker: b
    text: «Слушать» здесь и далее может также означать «повиноваться»; в данном контексте еврейский глагол совмещает оба смысла.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּרְתִּי אֵלַיִךְ
  choice: Я говорил с тобой
  rationale: Передаёт прямое обращение Яхве к адресату женского рода; русское «говорил с тобой» здесь естественнее буквального «говорил к тебе».
- source_word: בְּשַׁלְוֺתַיִךְ
  choice: когда ты жила спокойно и благополучно
  rationale: שַׁלְוָה охватывает значения покоя, безопасности и благополучия. Сочетание сохраняет широту смысла, не привнося более сильного оттенка самодовольства.
- source_word: לֹא אֶשְׁמָע
  choice: Не стану слушать
  rationale: שׁמע может означать как слушание, так и послушание. «Слушать» сохраняет образ восприятия голоса и не устраняет подразумеваемого отказа повиноваться.
- source_word: זֶה דַרְכֵּךְ
  choice: Таков был твой путь
  rationale: Безглагольная фраза характеризует устойчивый образ поведения; прошедшее «был» естественно сочетается с последующим «с юности».
- source_word: מִנְּעוּרַיִךְ
  choice: с юности
  rationale: Краткий и естественный русский эквивалент выражения о давнем, устойчивом поведении.
- source_word: לֹא שָׁמַעַתְּ בְּקוֹלִי
  choice: ты не слушала Моего голоса
  rationale: Сохраняет повтор корня שׁמע и еврейский образ «слушать голос», в котором слышится также смысл повиновения.
theological_decisions:
- issue: Адресат в женском роде
  choice: Сохранить обращение на «ты» с формами женского рода, не называя адресата прямо
  alternative: 'Уточнить в тексте: «Иерусалим», «Иудея» или «царский дом»'
  rationale: Еврейский текст использует формы 2-го лица женского рода, но сам стих не называет адресата; уточнение сняло бы сохраняемую контекстом неоднозначность.
- issue: Смысл глагола שׁמע
  choice: Передать как «слушать» с примечанием о значении послушания
  alternative: Перевести как «повиноваться»
  rationale: В контексте завета глагол совмещает слушание и послушание. Основной текст сохраняет звуковой образ и лексический повтор, а примечание раскрывает второй смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род сохранён по еврейскому тексту. Заглавная буква в «Моего» соответствует принятой русской библейской орфографии для речи Бога.
