  text: וְ/עָֽבְרוּ֙ גּוֹיִ֣ם רַבִּ֔ים עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אָֽמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/עִ֥יר הַ/גְּדוֹלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/008.yaml
  text: And many nations will pass by this city[a], and each man will say to his neighbor[b], ‘Why has Yahweh done thus to this great city?’
translation:
  language: ru
  text: 'И многие народы будут проходить мимо этого города[a], и каждый будет говорить своему ближнему: «Почему Яхве так поступил с этим великим городом?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проходить возле этого города». Еврейское сочетание допускает представление о движении рядом с городом или мимо него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבְרוּ ... עַל הָעִיר הַזֹּאת
  choice: будут проходить мимо этого города
  rationale: Глагольная форма в пророческом контексте передаёт будущее действие, а сочетание עבר с עַל здесь естественно описывает движение мимо города, состояние которого видят проходящие.
- source_word: גּוֹיִם רַבִּים
  choice: многие народы
  rationale: «Народы» сохраняет международный и собирательный смысл גּוֹיִם, не привнося более позднего противопоставления «язычников» Израилю.
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: друг другу
  rationale: 'Это естественная русская передача дистрибутивной идиомы «каждый своему ближнему»: отдельные люди обращаются один к другому. Буквальное «каждый своему ближнему» в данном контексте звучало бы тяжеловесно.'
- source_word: עַל מֶה
  choice: почему
  rationale: Кратко и идиоматично передаёт вопрос о причине.
- source_word: עָשָׂה ... כָּכָה
  choice: так поступил
  rationale: Передаёт действие и его наблюдаемый результат естественным современным русским языком; «сделал так» здесь менее выразительно и менее ясно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, явно стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: לָעִיר הַגְּדוֹלָה הַזֹּאת
  choice: с этим великим городом
  rationale: Предлог «с» обусловлен русским управлением глагола «поступить»; «великий» сохраняет указание не только на размеры, но и на значительность города.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. «Яхве» сохраняет это имя и наиболее прямо отражает принятую научную реконструкцию произношения, тогда как «Господь» является заменяющим титулом.
- issue: Род и обобщающий характер выражения אִישׁ אֶל רֵעֵהוּ
  choice: говорить друг другу
  alternative: каждый будет говорить своему ближнему
  rationale: Еврейская конструкция является дистрибутивной идиомой взаимного общения. Русское «друг другу» точно передаёт её функцию, не утверждая сверх текста, что речь идёт исключительно о мужчинах.
translation_notes:
  register: Современный литературный русский язык с dignified пророческим тоном. Синтаксис оставлен ясным и устным по звучанию; прямая речь оформлена по нормам русской пунктуации. Английские сноски в консультационном слое были прикреплены к несоответствующим маркерам, поэтому в русском проекте маркер поставлен непосредственно после спорного выражения о движении мимо города.
