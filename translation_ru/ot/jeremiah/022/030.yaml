  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה כִּתְב֞וּ אֶת הָ/אִ֤ישׁ הַ/זֶּה֙ עֲרִירִ֔י גֶּ֖בֶר לֹא יִצְלַ֣ח בְּ/יָמָ֑י/ו כִּי֩ לֹ֨א יִצְלַ֜ח מִ/זַּרְע֗/וֹ אִ֚ישׁ יֹשֵׁב֙ עַל כִּסֵּ֣א דָוִ֔ד וּ/מֹשֵׁ֥ל ע֖וֹד בִּ/יהוּדָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/030.yaml
  text: 'Thus says Yahweh: Write this man down as childless[a], a man who will not prosper in his days; for none of his offspring will prosper[b] to sit on the throne of David and rule again in Judah.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Запишите этого человека как бездетного[a], как человека, который не преуспеет во дни свои, ибо никому из его потомков не удастся[b] взойти на престол Давида и вновь править в Иудее».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «запишите этого человека не имеющим наследника». В еврейском тексте сказано «бездетным», но продолжение показывает, что речь прежде всего о династическом преемстве: ни один из его потомков не добьётся успеха как правитель на престоле Давида.'
    reason: lexical_alternative
  - marker: b
    text: То есть ни один потомок Иехонии не будет успешно царствовать в Иудее как царь из дома Давида.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, без замены его титулом.
- source_word: כִּתְבוּ
  choice: Запишите
  rationale: Множественное повелительное наклонение имеет здесь оттенок официальной записи или регистрации; «запишите» естественно передаёт этот смысл.
- source_word: עֲרִירִי
  choice: бездетным
  rationale: Сохраняет прямое лексическое значение, тогда как последующая часть стиха поясняет его династическую направленность.
- source_word: לֹא יִצְלַח בְּיָמָיו
  choice: которому не будет успеха во дни его
  rationale: Передаёт значение צלח как достижения успеха и сохраняет образное временное выражение «во дни его».
- source_word: מִזַּרְעוֹ
  choice: из его потомков
  rationale: Естественно передаёт собирательное זרע применительно к потомству и династическим наследникам.
- source_word: אִישׁ יֹשֵׁב עַל כִּסֵּא דָוִד וּמֹשֵׁל עוֹד בִּיהוּדָה
  choice: никому из его потомков не удастся воссесть на престоле Давида и вновь править в Иудее
  rationale: Отрицание со словом «человек» идиоматично выражено как «никому»; царские действия связаны с глаголом успеха, не превращаясь в отдельное категорическое утверждение об отсутствии любых потомков.
theological_decisions:
- issue: Смысл определения עֲרִירִי при наличии у Иехонии потомков
  choice: В основном тексте сохранено «бездетным», а сноска указывает на возможный династико-правовой смысл.
  alternative: Перевести непосредственно как «не имеющим наследника».
  rationale: Следующая часть стиха сосредоточена на отсутствии успешного преемника на престоле Давида. Сохранение буквального слова вместе с пояснением не устраняет напряжение текста.
- issue: Характер суда над потомством Иехонии
  choice: Высказывание относится к успешному воцарению его потомка на престоле Давида и дальнейшему правлению в Иудее.
  alternative: Понимать стих как отрицание существования потомков вообще или как два полностью раздельных запрета — сидеть на престоле и править.
  rationale: Синтаксис связывает отсутствие успеха с царским положением и правлением; контекст говорит о династическом преемстве.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Формы «Яхве», «во дни его», «воссесть на престоле» сохраняют достоинство и библейскую образность, оставаясь понятными современному читателю.
