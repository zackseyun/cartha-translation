  variant: modern literary Russian
source:
  edition: WLC
  text: גְּדֹל֙ הָֽ/עֵצָ֔ה וְ/רַ֖ב הָ/עֲלִֽילִיָּ֑ה אֲשֶׁר עֵינֶ֣י/ךָ פְקֻח֗וֹת עַל כָּל דַּרְכֵי֙ בְּנֵ֣י אָדָ֔ם לָ/תֵ֤ת לְ/אִישׁ֙ כִּ/דְרָכָ֔י/ו וְ/כִ/פְרִ֖י מַעֲלָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/019.yaml
  text: great in counsel and mighty in deed[a], whose eyes are open upon all the ways of the sons of man, to give to each man according to his ways and according to the fruit of his deeds.
translation:
  language: ru
  text: великий в замыслах и могучий в делах! Твои глаза открыты на все пути сынов человеческих[a], чтобы воздать каждому по его путям и по плоду его дел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть всех людей; еврейское выражение «сыны человеческие» имеет собирательное значение.
    reason: Пояснение собирательного значения בְּנֵי אָדָם.
lexical_decisions:
- source_word: גְּדֹל הָעֵצָה
  choice: великий в замыслах
  rationale: עֵצָה может означать совет, замысел или намерение. «В замыслах» естественно по-русски передаёт Божью мудрость и целенаправленность, не сводя выражение лишь к совету как речи.
- source_word: רַב הָעֲלִילִיָּה
  choice: могучий в делах
  rationale: עֲלִילִיָּה обозначает деяние, действие или свершение. Формулировка сохраняет параллелизм между замыслом и его действенным осуществлением.
- source_word: עֵינֶיךָ פְקֻחוֹת
  choice: Твои глаза открыты
  rationale: Сохранён конкретный антропоморфный образ исходного текста; он выражает непрестанное Божье внимание, не заменяясь отвлечённым богословским термином.
- source_word: עַל כָּל דַּרְכֵי בְּנֵי אָדָם
  choice: на все пути сынов человеческих
  rationale: «Пути» обозначают образ жизни и поступки. בְּנֵי אָדָם — собирательное обозначение людей; традиционно понятное русское выражение сохраняет образную форму еврейского текста, а примечание поясняет его объём.
- source_word: לָתֵת לְאִישׁ
  choice: чтобы воздать каждому
  rationale: Буквально «чтобы дать каждому». В контексте оценки человеческих путей глагол имеет смысл соответствующего воздаяния; «воздать» естественно передаёт этот смысл без уточнения, награда это или наказание.
- source_word: כִּדְרָכָיו
  choice: по его путям
  rationale: Сохранены множественное число и повтор ключевого образа «путей», относящегося к образу жизни и поведению человека.
- source_word: וְכִפְרִי מַעֲלָלָיו
  choice: и по плоду его дел
  rationale: Сохранена метафора плода как результата или последствия поступков, а מַעֲלָלִים передано словом «дела» с присущим контексту нравственным оттенком.
theological_decisions:
- issue: Антропоморфное описание Божьего всеведения
  choice: Сохранить выражение «Твои глаза открыты»
  alternative: «Ты видишь все пути людей»
  rationale: Исходный текст говорит о Божьем знании посредством телесного образа. Его сохранение передаёт литературную силу стиха и не подменяет образ систематическим богословским определением.
- issue: Собирательное мужское обозначение человечества
  choice: «сыны человеческие» с пояснением в сноске
  alternative: «все люди» или «человечество»
  rationale: Еврейское בְּנֵי אָדָם является собирательным выражением и охватывает всех людей. Основной текст сохраняет его форму, а сноска предотвращает ошибочное ограничение смысла только мужчинами.
- issue: Характер воздаяния
  choice: «воздать каждому» без уточнения награды или наказания
  alternative: «наказать каждого» или «наградить каждого»
  rationale: Фраза לָתֵת לְאִישׁ сама по себе не ограничивает воздаяние одной стороной суда; последующая норма — пути и плод дел человека. Перевод сохраняет эту широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены параллелизм, образы открытых глаз, путей и плода дел; архаические формы и излишне отвлечённые богословские формулировки не использованы.
