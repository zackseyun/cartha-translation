source:
  edition: WLC
  text: כִּ֧י עַל אַפִּ֣/י וְ/עַל חֲמָתִ֗/י הָ֤יְתָה לִּ/י֙ הָ/עִ֣יר הַ/זֹּ֔את לְ/מִן הַ/יּוֹם֙ אֲשֶׁ֣ר בָּנ֣וּ אוֹתָ֔/הּ וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה לַ/הֲסִירָ֖/הּ מֵ/עַ֥ל פָּנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/031.yaml
  text: For this city has been to me a cause of my anger and my wrath from the day they built it even to this day[b][a], so that I should remove it from before my face.
translation:
  language: ru
  text: Ведь этот город со дня, когда его построили, и доныне вызывал у Меня гнев и ярость, так что Я удалю его от лица Моего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Моего присутствия». Буквально: «от лица Моего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Вводит объяснение предшествующего приговора; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: עַל אַפִּי וְעַל חֲמָתִי
  choice: вызывал у Меня гнев и ярость
  rationale: Буквальная конструкция «на Мой гнев и на Мою ярость» в данном контексте идиоматически указывает на то, что город постоянно навлекал или вызывал Божий гнев.
- source_word: אַפִּי
  choice: гнев
  rationale: אַף буквально означает «нос», но регулярно служит метонимией гнева.
- source_word: חֲמָתִי
  choice: ярость
  rationale: חֵמָה обозначает пылающий, сильный гнев; «ярость» сохраняет интенсивность и хорошо сочетается со словом «гнев».
- source_word: הָיְתָה לִּי
  choice: вызывал у Меня
  rationale: В сочетании с עַל אַפִּי וְעַל חֲמָתִי передаёт длительное отношение города к Богу как причины Его гнева; русская форма несовершенного вида согласуется с периодом от основания до настоящего дня.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּנוּ אוֹתָהּ
  choice: со дня, когда его построили
  rationale: Сохраняет исходную точку времени и неопределённое множественное число еврейского глагола, не уточняя строителей.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: и доныне
  rationale: Кратко и естественно выражает непрерывность вплоть до настоящего момента.
- source_word: לַהֲסִירָהּ
  choice: так что Я удалю его
  rationale: Инфинитив с ל допускает оттенок результата или цели. «Так что» сохраняет следственный оттенок, а будущее время естественно выражает предстоящее удаление города.
- source_word: מֵעַל פָּנַי
  choice: от лица Моего
  rationale: Сохраняет конкретный антропоморфный образ еврейского выражения и в достойном библейском регистре обозначает изгнание из Божьего присутствия.
theological_decisions:
- issue: Антропоморфный язык Божьего гнева и присутствия
  choice: Сохранены выражения «гнев и ярость» и «от лица Моего».
  alternative: «вызывал Моё негодование… из Моего присутствия»
  rationale: Исходный текст использует телесно-конкретный язык для описания Божьего гнева и присутствия; перевод не устраняет эту образность и связанную с ней богословскую напряжённость.
- issue: Цель или результат в לַהֲסִירָהּ
  choice: «так что Я удалю его» — результативное прочтение
  alternative: «чтобы удалить его» — целевое прочтение
  rationale: Предлог ל с инфинитивом допускает оба оттенка; в контексте многолетнего возбуждения гнева естественна связь с итоговым приговором, при этом формулировка не превращает эту грань в отдельное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Идиома о гневе передана естественно, а антропоморфный образ «лица» сохранён. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
