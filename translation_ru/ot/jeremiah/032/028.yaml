  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנְ/נִ֣י נֹתֵן֩ אֶת הָ/עִ֨יר הַ/זֹּ֜את בְּ/יַ֣ד הַ/כַּשְׂדִּ֗ים וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/028.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am giving this city into the hand of the Chaldeans and into the hand of Nebuchadnezzar king of Babylon, and he will capture it.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве: «Вот, Я отдаю этот город в руки халдеев и в руки Навуходоносора[a], царя Вавилона, и он захватит его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь форма имени, более точно передаваемая как «Навуходреццар»; «Навуходоносор» — традиционная русская форма.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод или следствие из предшествующего Божьего обличения.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет торжественную пророческую формулу в естественной для современного русского языка форме и передаёт личное имя Бога.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Передаёт указательное и эмфатическое введение к Божьему заявлению, не устраняя выраженное первое лицо.
- source_word: נֹתֵן
  choice: отдаю
  rationale: Причастная форма представляет действие как уже решённое и близкое; «отдаю» естественно выражает передачу города под чужую власть.
- source_word: הָעִיר הַזֹּאת
  choice: этот город
  rationale: Прямо и естественно передаёт существительное с указательным местоимением.
- source_word: בְּיַד
  choice: в руки
  rationale: Русский устойчивый оборот передаёт древнееврейскую идиому власти и контроля; множественное число естественно по-русски, хотя в источнике стоит единственное «в руку».
- source_word: הַכַּשְׂדִּים
  choice: халдеев
  rationale: Сохраняет этноним источника, не заменяя его более широким обозначением «вавилоняне».
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносора
  rationale: Использована традиционная и узнаваемая русская форма имени; более близкая к данной древнееврейской форме передача отмечена в сноске.
- source_word: מֶלֶךְ בָּבֶל
  choice: царя Вавилона
  rationale: Естественно передаёт древнееврейское сопряжённое сочетание.
- source_word: וּלְכָדָהּ
  choice: и он захватит его
  rationale: Сохраняет мужской род подлежащего и женский объектный суффикс, относящийся к слову «город» в древнееврейском; по-русски местоимение согласовано с существительным мужского рода «город».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблено личное имя Бога; «Яхве» передаёт его как имя, не подменяя титулом.
- issue: Подлежащее при וּלְכָדָהּ
  choice: личное «он», относящееся к Навуходоносору
  alternative: безличное «город будет захвачен» или коллективное указание на халдеев
  rationale: Глагол имеет форму 3-го лица мужского рода единственного числа, а ближайший явно названный референт в единственном числе — царь Навуходоносор. Такая передача сохраняет грамматику, хотя действие подразумевает и его войско.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «так говорит Яхве» и вводное «Вот» сохраняют торжественность, а «отдаю… в руки» остаётся понятным современному читателю.
