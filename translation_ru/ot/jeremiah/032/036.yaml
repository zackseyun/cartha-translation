  text: וְ/עַתָּ֕ה לָ/כֵ֛ן כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אֶל הָ/עִ֨יר הַ/זֹּ֜את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִתְּנָה֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל בַּ/חֶ֖רֶב וּ/בָ/רָעָ֥ב וּ/בַ/דָּֽבֶר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/036.yaml
  text: 'Now therefore[a], thus says Yahweh, the God of Israel, concerning this city of which you say, ‘It has been given into the hand of the king of Babylon by the sword, by famine[b], and by pestilence’:'
translation:
  language: ru
  text: 'Итак, теперь так говорит Яхве, Бог Израиля, об этом городе, о котором вы говорите: «Он отдан в руки царя Вавилона мечом, голодом и мором[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эпидемией»; еврейское слово обозначает повальную смертоносную болезнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  choice: И теперь, поэтому
  rationale: 'Оба связующих элемента сохранены: וְעַתָּה вводит новый этап речи, а לָכֵן обозначает вывод из предшествующего.'
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Устоявшаяся и естественная по-русски формула пророческого вестника.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача еврейской сопряжённой конструкции.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: об этом городе
  rationale: Предлог אֶל при глаголе речи здесь естественно указывает на тему высказывания.
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: о котором вы говорите
  rationale: Сохраняет относительную конструкцию и обращение во втором лице множественного числа.
- source_word: נִתְּנָה
  choice: Он отдан
  rationale: Нифаль перфекта передан кратким страдательным причастием; оно сохраняет результативность формы, не исключая того, что сдача города ещё разворачивается или считается неизбежной.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: в руки царя Вавилона
  rationale: Обычный русский библейский идиоматический эквивалент передачи под чью-либо власть.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  choice: мечом, голодом и мором
  rationale: Сохраняет традиционную трёхчастную формулу бедствий и конкретность исходных слов.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Временной и аспектуальный смысл נִתְּנָה
  choice: отдан
  alternative: отдаётся / был отдан
  rationale: Еврейский перфект допускает результативное прочтение, тогда как контекст может представлять передачу города как уже решённую и фактически совершающуюся. Русская краткая форма сохраняет эту напряжённость лучше, чем однозначно прошедшее или прогрессивное выражение.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Формула «так говорит Яхве» и образ «в руки» сохранены как понятные библейские обороты; чрезмерно архаичные формы устранены.
