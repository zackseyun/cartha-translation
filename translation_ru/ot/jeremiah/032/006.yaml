lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательной формой глагола продолжает повествование; русское «И сказал» естественно передаёт эту связь, не усиливая её до явно временного «тогда».
- source_word: יִרְמְיָהוּ
  choice: Иеремия
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: הָיָה דְּבַר יְהוָה אֵלַי
  choice: Было ко мне слово Яхве
  rationale: Формулировка близко передаёт еврейскую пророческую формулу и сохраняет глагол היה («было»), не добавляя образ движения, хотя по-русски возможно также «пришло ко мне слово».
- source_word: דְּבַר
  choice: слово
  rationale: «Слово» сохраняет основной смысл существительного и традиционную связь с пророческой формулой; «весть» было бы более истолковывающим вариантом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой в современной научной русской транслитерацией, а не заменено титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Прямо передаёт предлог с суффиксом первого лица единственного числа.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Еврейский инфинитив вводит содержание последующей речи. В современном русском эту функцию естественнее передать двоеточием, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет различие между именем и титулом; традиционный вариант «Господь» указан в примечании.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранена формальная конструкция «Было ко мне слово», а לֵאמֹר передано русской пунктуацией, поскольку далее следует содержание откровения.
