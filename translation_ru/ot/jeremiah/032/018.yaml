  text: showing steadfast love to thousands[a], and repaying the iniquity of fathers into the lap of their children after them—the great, mighty God, Yahweh of Armies[b], is his name.
translation:
  language: ru
  text: Ты являешь милость тысячам[a] и воздаёшь за беззаконие отцов в лоно их детей после них. Великий и могучий Бог, Яхве Воинств[b] — имя Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тысячам поколений» — в свете сходных заветных выражений в других местах; буквально по-еврейски здесь: «тысячам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Господь воинств»; традиционно: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה חֶסֶד
  choice: являешь милость
  rationale: Причастная конструкция продолжает обращённое к Богу описание из предыдущего стиха. «Являешь милость» естественно передаёт устойчивое сочетание и сохраняет смысл деятельной, верной любви.
- source_word: לַאֲלָפִים
  choice: тысячам
  rationale: В еврейском тексте буквально сказано «тысячам» без выраженного существительного «поколения»; краткая формулировка сохраняет эту неоднозначность.
- source_word: וּמְשַׁלֵּם
  choice: и воздаёшь
  rationale: Глагол обозначает отплату или воздаяние и параллелен первому причастию; форма второго лица согласована с продолжающимся обращением Иеремии к Богу.
- source_word: עֲוֺן
  choice: за беззаконие
  rationale: Слово может обозначать беззаконие, вину или её последствие. Русская конструкция «воздаёшь за беззаконие» передаёт нравственную тяжесть выражения, не уточняя сверх текста точный характер воздаяния.
- source_word: אָבוֹת
  choice: отцов
  rationale: Сохранено конкретное мужское обозначение исходного текста, а не более общее «предков» или «родителей».
- source_word: אֶל חֵיק
  choice: в лоно
  rationale: 'Сохранён телесно-пространственный образ еврейской идиомы: воздаяние приходит непосредственно к человеку как положенное ему в лоно. «Лоно» соответствует возвышенному регистру, хотя в современной речи встречается редко.'
- source_word: בְּנֵיהֶם אַחֲרֵיהֶם
  choice: их детей после них
  rationale: בנים здесь естественно понимать в представительном смысле как «детей»; «после них» сохраняет явно выраженную последовательность поколений.
- source_word: הָאֵל הַגָּדוֹל הַגִּבּוֹר
  choice: Великий и могучий Бог
  rationale: Естественный русский порядок слов сохраняет торжественное титульное описание и оба определения.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией «Яхве», а צבאות — как «Воинств», что сохраняет традиционную торжественность и образ небесных сил, не сужая его до одних человеческих армий.
theological_decisions:
- issue: Межпоколенческое воздаяние
  choice: Сохранено прямое утверждение о воздаянии за беззаконие отцов в лоно их детей после них.
  alternative: Истолковать выражение лишь как естественные общественные последствия родительского греха либо как наказание невиновных детей.
  rationale: Сам стих утверждает межпоколенческое измерение воздаяния. Перевод не сглаживает его и не разрешает здесь напряжение с библейскими текстами об индивидуальной ответственности.
- issue: Значение לַאֲלָפִים
  choice: «тысячам» с примечанием о возможном подразумеваемом слове «поколений».
  alternative: Внести «тысячам поколений» непосредственно в основной текст.
  rationale: Сходные заветные формулы допускают подразумеваемое «поколений», однако в данном еврейском тексте это слово отсутствует; неоднозначность сохранена.
- issue: Божественный титул יְהוָה צְבָאוֹת
  choice: «Яхве Воинств».
  alternative: «Господь Саваоф» или «Господь воинств».
  rationale: Передача сохраняет личное имя и смысл титула, избегая непрозрачной для многих современных читателей транслитерации «Саваоф».
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Второе лицо («являешь», «воздаёшь») сохраняет синтаксическую связь с молитвенным обращением предыдущего стиха. Метафора «в лоно» намеренно сохранена как образная и возвышенная; божественное имя передано как «Яхве».
