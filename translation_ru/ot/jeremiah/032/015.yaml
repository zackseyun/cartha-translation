base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/015.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Houses and fields and vineyards will again be bought in this land.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве Воинств, Бог Израиля: «В этой земле снова будут покупаться дома, поля и виноградники».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Вводит объяснение предшествующего символического действия; «ибо» ясно передаёт причинно-пояснительную связь и соответствует достоинству пророческой речи.
- source_word: כֹה אָמַר
  choice: так говорит
  rationale: Естественная русская формула пророческой вести; настоящее время уместно передаёт действующее Божье провозглашение, несмотря на перфект в еврейском.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя Бога и широкий смысл титула צְבָאוֹת, не сужая его только до земных армий.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо и естественно передаёт конструкцию принадлежности и заветное самоопределение Бога.
- source_word: עוֹד
  choice: снова
  rationale: В контексте восстановления указывает на возобновление обычной жизни и сделок после их прекращения.
- source_word: יִקָּנוּ
  choice: будут покупать
  rationale: Неопределённо-личная русская конструкция естественно выражает возобновление сделок с недвижимостью; формально пассивный оттенок еврейского нифаля отмечен в сноске.
- source_word: בָתִּים וְשָׂדוֹת וּכְרָמִים
  choice: дома, поля и виноградники
  rationale: Точные и общеупотребительные соответствия, подходящие контексту купли земельной собственности.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: в этой земле
  rationale: Сохраняет конкретное указание на землю и её важный для книги Иеремии заветный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет открытое Израилю личное имя Бога и не заменяет его титулом.
- issue: Залог формы יִקָּנוּ (нифаль)
  choice: Неопределённо-личное «будут покупать» с пояснением в сноске
  alternative: Пассивное «будут куплены» или «будут покупаться»
  rationale: Русская неопределённо-личная форма звучит естественно и сосредоточивает внимание на возобновлении сделок, тогда как сноска сохраняет формальную пассивность еврейской формы и не скрывает грамматический оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «так говорит» и титул «Яхве Воинств» сохраняют библейскую торжественность; основное обещание передано естественной для русского языка неопределённо-личной конструкцией.
