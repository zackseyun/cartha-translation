  text: וָ/אֶתְפַּלֵּ֖ל אֶל יְהוָ֑ה אַחֲרֵ֤י תִתִּ/י֙ אֶת סֵ֣פֶר הַ/מִּקְנָ֔ה אֶל בָּר֥וּךְ בֶּן נֵרִיָּ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/016.yaml
  text: After I had given the deed of purchase to Baruch son of Neriah[a], I prayed to Yahweh, saying,
translation:
  language: ru
  text: 'После того как я передал документ о покупке Варуху, сыну Нирии, я помолился Яхве[a], сказав:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (יהוה); традиционная передача — «Господь».'
    reason: Уточнение формы Божьего имени и распространённой альтернативы перевода.
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל
  choice: я помолился
  rationale: Возвратная форма глагола פלל обычно означает «молиться»; перевод не добавляет отсутствующей в тексте усилительности.
- source_word: אֶל יְהוָה
  choice: Яхве
  rationale: Предлог אֶל обозначает направленность молитвы, а личное имя יהוה передано как «Яхве», что отражает тетраграмматон, а не заменяет его титулом.
- source_word: אַחֲרֵי תִתִּי
  choice: После того как я передал
  rationale: Оборот выражает действие, завершившееся прежде основной молитвы; русская конструкция ясно сохраняет последовательность событий.
- source_word: סֵפֶר הַמִּקְנָה
  choice: документ о покупке
  rationale: סֵפֶר здесь означает письменный документ, а הַמִּקְנָה — совершённую покупку. Формулировка понятна современному читателю и не вводит более узкой юридической категории, чем допускает еврейский текст.
- source_word: אֶל בָּרוּךְ בֶּן נֵרִיָּה
  choice: Варуху, сыну Нирии
  rationale: Сохраняются традиционные русские формы имён и патронимическая связь исходного текста.
- source_word: לֵאמֹר
  choice: 'сказав:'
  rationale: Инфинитив вводит содержание молитвы, следующее в последующем стихе; двоеточие естественно подготавливает прямую речь.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога — тетраграмматон יהוה. «Яхве» сохраняет различие между именем и титулом, при этом традиционный вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Документ о покупке» избран вместо более архаичной «купчей грамоты»; синтаксис сохраняет временную последовательность и формальное введение последующей молитвы.
