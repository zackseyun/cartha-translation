  text: וָֽ/אֶקְנֶה֙ אֶת הַ/שָּׂדֶ֔ה מֵ/אֵ֛ת חֲנַמְאֵ֥ל בֶּן דֹּדִ֖/י אֲשֶׁ֣ר בַּ/עֲנָת֑וֹת וָֽ/אֶשְׁקֲלָ/ה לּ/וֹ֙ אֶת הַ/כֶּ֔סֶף שִׁבְעָ֥ה שְׁקָלִ֖ים וַ/עֲשָׂרָ֥ה הַ/כָּֽסֶף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/009.yaml
  text: 'So I bought the field from Hanamel the son of my uncle[a], who was at Anathoth[b], and I weighed out the silver to him: seventeen shekels of silver.'
translation:
  language: ru
  text: И купил я поле у Ханамела, сына моего дяди, который находился в Анафофе[a], и отвесил ему серебро — семнадцать сиклей серебра[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также смысл: «поле, находившееся в Анафофе». Еврейская относительная конструкция может относиться как к Ханамелу, так и к полю.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально по-еврейски: «семь сиклей и десять серебра», то есть семнадцать сиклей серебра.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְנֶה
  choice: И купил я
  rationale: Форма wayyiqtol продолжает повествование и обозначает завершённое действие в прошлом; «купил» передаёт обычный торговый смысл קנה.
- source_word: הַשָּׂדֶה
  choice: поле
  rationale: שׂדה обозначает поле или участок земли; в данном контексте естественно и точно русское «поле».
- source_word: מֵאֵת חֲנַמְאֵל
  choice: у Ханамела
  rationale: Предлог указывает на продавца, у которого приобретено поле. Конструкция «купил у» естественна для современного русского языка.
- source_word: בֶּן דֹּדִי
  choice: сына моего дяди
  rationale: Сохранено прямое обозначение родства в еврейском тексте, а не более обобщённое «моего двоюродного брата».
- source_word: אֲשֶׁר בַּעֲנָתוֹת
  choice: который находился в Анафофе
  rationale: Относительное местоимение мужского рода допускает связь как с Ханамелом, так и с полем. Основной текст следует ближайшему личному референту, а неоднозначность отмечена в сноске.
- source_word: וָאֶשְׁקֲלָה לּוֹ אֶת הַכֶּסֶף
  choice: и отвесил ему серебро
  rationale: Глагол שקל буквально описывает взвешивание платы; «отвесил» сохраняет конкретную древнюю торговую практику лучше, чем общее «заплатил».
- source_word: שִׁבְעָה שְׁקָלִים וַעֲשָׂרָה הַכָּסֶף
  choice: семнадцать сиклей серебра
  rationale: Буквальная последовательность «семь сиклей и десять серебра» идиоматически означает семнадцать сиклей серебра. Нормальный русский порядок делает сумму понятной, а буквальная форма отмечена в сноске.
