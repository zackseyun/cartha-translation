id: JER.32.40
reference: Jeremiah 32:40
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית עוֹלָ֔ם אֲשֶׁ֤ר לֹֽא אָשׁוּב֙ מֵ/אַ֣חֲרֵי/הֶ֔ם לְ/הֵיטִיבִ֖/י אוֹתָ֑/ם וְ/אֶת יִרְאָתִ/י֙ אֶתֵּ֣ן בִּ/לְבָבָ֔/ם לְ/בִלְתִּ֖י ס֥וּר מֵ/עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/040.yaml
  text: I will make with them an everlasting covenant[a], that I will not turn away from them, to do them good. And I will put the fear of me in their hearts[b], so that they will not turn away from me.
translation:
  language: ru
  text: 'Я заключу с ними вечный завет[a]: не отвернусь от них и буду делать им добро. Я вложу в их сердца страх передо Мной[b], чтобы они не отступали от Меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непреходящий завет»; также возможно: «завет навеки».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Мой страх», то есть страх, обращённый к Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי
  choice: заключу
  rationale: Русское «заключить завет» естественно передаёт древнееврейскую идиому, буквально означающую «срезать завет», без неуместного буквализма.
- source_word: בְּרִית עוֹלָם
  choice: вечный завет
  rationale: «Вечный» естественно и точно передаёт длительность и непреходящий характер завета; возможен также оттенок «непреложный, постоянный».
- source_word: אֲשֶׁר לֹא אָשׁוּב מֵאַחֲרֵיהֶם
  choice: не отвернусь от них
  rationale: Эта формулировка передаёт смысл обещания Бога не отступать от народа и не прекращать Своего благого отношения к нему.
- source_word: לְהֵיטִיבִי אוֹתָם
  choice: и буду делать им добро
  rationale: Сочинительная конструкция по-русски ясно выражает содержание Божьего неизменного действия; оборот сохраняет конкретный смысл «благотворить им».
- source_word: יִרְאָתִי
  choice: страх передо Мной
  rationale: Форма с суффиксом первого лица означает страх, направленный к Богу. «Передо Мной» звучит естественно и не создаёт двусмысленности, будто речь идёт о страхе, испытываемом Самим Богом.
- source_word: בִּלְבָבָם
  choice: в их сердца
  rationale: «Сердце» сохраняет библейское представление о центре воли, мысли и внутренней направленности человека.
- source_word: לְבִלְתִּי סוּר מֵעָלָי
  choice: чтобы они не отступали от Меня
  rationale: Передаёт цель или предполагаемый результат Божьего действия, не усиливая грамматику до отдельного догматического утверждения о механизме стойкости.
theological_decisions:
- issue: Продолжительность завета
  choice: вечный завет
  alternative: непреходящий завет; завет навеки
  rationale: Перевод утверждает непреходящую длительность завета, но не привязывает выражение к какой-либо поздней богословской системе.
- issue: Значение страха по отношению к Богу
  choice: страх передо Мной
  alternative: страх Мой; благоговение передо Мной
  rationale: Сохранено сильное и широкое библейское слово «страх», включающее благоговейное отношение, без сведения его только к ужасу или только к почтению.
- issue: Связь Божьего действия и верности народа
  choice: чтобы они не отступали от Меня
  alternative: так что они не отступят от Меня
  rationale: Конструкция לְבִלְתִּי естественно выражает цель и предотвращение. Выбранный перевод сохраняет заложенную в тексте связь, не разрешая сверх грамматики вопрос о модальности результата.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Заключу завет», «делать им добро» и «отступали от Меня» понятны широкому читателю. Прописные местоимения при обращении к Богу использованы последовательно в рамках стилистической нормы проекта.
