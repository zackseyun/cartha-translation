    rationale: Смысл «одного сердца и одного пути» действительно допускает несколько аспектов, но текст сноски выходит за пределы краткой лексической альтернативы. Альтернатива «единый путь» относится непосредственно к דרך אחד и может быть дана без сужения смысла.
