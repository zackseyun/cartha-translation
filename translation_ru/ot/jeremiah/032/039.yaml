lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И дам
  rationale: Форма с союзом в пророческом контексте выражает будущее обещание; «дам» прямо и естественно передаёт נתן.
- source_word: לֵב אֶחָד
  choice: одно сердце
  rationale: Буквальный образ сохраняет возможные оттенки общей внутренней направленности и неразделённой преданности, не сужая смысл.
- source_word: וְדֶרֶךְ אֶחָד
  choice: и один путь
  rationale: דרך может обозначать как путь, так и образ жизни; «один путь» сохраняет метафору и её смысловую широту.
- source_word: לְיִרְאָה אֹתִי
  choice: чтобы они боялись Меня
  rationale: Инфинитив с ל здесь выражает цель; глагол «бояться» сохраняет библейское понятие благоговейного страха перед Богом.
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Передаёт буквальное выражение длительности, подразумевающее постоянство на протяжении жизни.
- source_word: לְטוֹב לָהֶם
  choice: ко благу им
  rationale: Сохраняет значение пользы и благополучия, выраженное сочетанием ל и טוב.
- source_word: וְלִבְנֵיהֶם אַחֲרֵיהֶם
  choice: и их детям после них
  rationale: «Детям» прямо передаёт בנים; оборот распространяет названное благо на следующее поколение.
theological_decisions:
- issue: Значение выражения «одно сердце и один путь»
  choice: Сохранены буквальные метафоры, допускающие как единство народа, так и цельность внутренней преданности и общий образ жизни.
  alternative: Истолковать выражение исключительно как общинное единство либо исключительно как неразделённую личную преданность.
  rationale: Еврейский текст допускает оба смысловых аспекта, поэтому перевод не устраняет эту богословскую многозначность.
- issue: Смысл слов «боялись Меня»
  choice: Сохранён глагол «бояться», который в контексте завета обозначает благоговейный страх, проявляющийся в верности Богу.
  alternative: Передать как «почитали Меня» или понять как простой ужас.
  rationale: Парафраз «почитали» сгладил бы исходный образ, а значение простого ужаса не соответствует контексту обещанного восстановления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис краток и ясен; исходные метафоры сохранены. Прописная буква в «Меня» следует принятой русской традиции при местоименной отсылке к Богу.
