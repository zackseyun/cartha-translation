  text: And I will give them one heart and one way[a], so that they may fear me all their days[b], for their good and for the good of their children after them.
translation:
  language: ru
  text: И дам им одно сердце и один путь[a], чтобы они боялись Меня во все дни, для их блага и для блага их детей после них.
  philosophy: optimal-equivalence
  footnotes:
