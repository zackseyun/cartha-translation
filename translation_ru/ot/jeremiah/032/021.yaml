base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/021.yaml
  text: And you brought your people Israel out of the land of Egypt with signs and wonders[a], with a strong hand and an outstretched arm, and with great terror.
translation:
  language: ru
  text: Ты вывел Свой народ, Израиль, из земли Египта знамениями и чудесами, крепкой рукой и простёртой мышцей, и великим ужасом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и великим трепетом». Еврейское выражение может обозначать страх, ужас или благоговейный трепет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּצֵא
  choice: Ты вывел
  rationale: Порода hифиль глагола יצא имеет каузативное значение «вывести»; это естественная русская формула исхода.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: Свой народ, Израиль
  rationale: Сохранены обращение к Богу, притяжательное значение и приложение «Израиль», уточняющее, о каком народе идёт речь.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Передаёт исход из страны; форма «земля Египетская» естественна для возвышенного библейского повествования и понятна современному читателю.
- source_word: בְּאֹתוֹת וּבְמוֹפְתִים
  choice: знамениями и чудесами
  rationale: Предлог ב передан творительным падежом со значением средства; устойчивая пара сохраняет различие между знаками и необычайными деяниями.
- source_word: וּבְיָד חֲזָקָה
  choice: сильной рукой
  rationale: Буквально и ясно передаёт חֲזָקָה, не ослабляя образ проявленной силы.
- source_word: וּבְאֶזְרֹעַ נְטוּיָה
  choice: простёртой рукой
  rationale: В данном параллелизме אֶזְרוֹעַ буквально означает «рука, мышца»; «простёртая рука» звучит естественно и сохраняет образ решительного действия.
- source_word: וּבְמוֹרָא גָּדוֹל
  choice: и великим ужасом
  rationale: מוֹרָא допускает значения страха, ужаса и благоговейного трепета. «Великим ужасом» сохраняет объективно устрашающий характер Божьих деяний при исходе.
theological_decisions:
- issue: Значение וּבְמוֹרָא גָּדוֹל в формуле исхода
  choice: и великим ужасом
  alternative: и великим трепетом
  rationale: Контекст допускает как ужас перед грозными деяниями Бога, так и благоговейный трепет. В основном тексте выбран «ужас» как более конкретное обозначение внушаемого ими страха, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксический параллелизм и повтор инструментального значения сохранены без архаизации; «земля Египетская» и «простёртая рука» поддерживают возвышенный регистр.
