revisions:
- from: Поля будут покупать за серебро; купчие будут составлять, запечатывать и удостоверять при свидетелях[a] в земле Вениамина, в окрестностях Иерусалима, в городах Иудеи, в городах Нагорья, в городах Шефелы[b] и в городах Негева, потому что Я возвращу их из плена[c], — возвещает Яхве.
  to: Поля будут покупать за серебро; будут составлять документы о покупке, запечатывать их и привлекать свидетелей[a] в земле Вениамина, в окрестностях Иерусалима, в городах Иудеи, в городах Нагорья, в городах Шефелы[b] и в городах Негева, потому что Я изменю их участь[c], — возвещает Яхве.
  rationale: Правка устраняет ложную субъектность у «купчих», яснее передаёт юридическую формулу о свидетелях и сохраняет широту идиоматического обещания восстановления. Географические обозначения, имя Яхве, порядок местностей и образ серебра как средства оплаты сохранены.
