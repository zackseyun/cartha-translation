base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/044.yaml
  text: Fields will be bought with silver[a], and deeds will be written in a scroll and sealed and witnessed by witnesses in the land of Benjamin, around Jerusalem, and in the cities of Judah, in the cities of the hill country, in the cities of the lowland, and in the cities of the Negeb; for I will restore their fortunes[c][b], declares Yahweh.
translation:
  language: ru
  text: Поля будут покупать за серебро; будут составлять документы о покупке, запечатывать их и привлекать свидетелей[a] в земле Вениамина, в окрестностях Иерусалима, в городах Иудеи, в городах Нагорья, в городах Шефелы[b] и в городах Негева, потому что Я изменю их участь[c], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дать свидетелям засвидетельствовать»; это юридическая формула официального удостоверения сделки.'
    reason: lexical_alternative
  - marker: b
    text: Шефела — низменная холмистая область Иудеи между Нагорьем и прибрежной равниной.
    reason: cultural_note
  - marker: c
    text: 'Или: «Я возвращу их из плена»; буквально: «Я возвращу их пленение». Еврейское выражение может означать как возвращение из плена, так и более широкое восстановление.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂדוֹת בַּכֶּסֶף יִקְנוּ
  choice: Поля будут покупать за серебро
  rationale: Еврейская активная форма буквально означает «будут покупать». Неопределённо-личная русская конструкция естественна и сохраняет активность оригинала; «за серебро» передаёт конкретное средство платежа.
- source_word: וְכָתוֹב בַּסֵּפֶר
  choice: купчие будут составлять
  rationale: סֵפֶר в данном контексте обозначает письменный документ о покупке земли. «Купчие» кратко и понятно обозначает документы сделки, а «составлять» естественно передаёт их письменное оформление.
- source_word: וְחָתוֹם
  choice: запечатывать
  rationale: Сохраняет юридическую последовательность действий и параллельную форму однородных сказуемых.
- source_word: וְהָעֵד עֵדִים
  choice: удостоверять при свидетелях
  rationale: Передаёт каузативную юридическую формулу привлечения свидетелей для официального засвидетельствования сделки, избегая неестественного русского повтора «свидетельствовать свидетелями».
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: в земле Вениамина
  rationale: Сохраняет обычное библейское обозначение племенной территории.
- source_word: וּבִסְבִיבֵי יְרוּשָׁלִַם
  choice: в окрестностях Иерусалима
  rationale: Естественно передаёт окружающую город местность.
- source_word: וּבְעָרֵי יְהוּדָה
  choice: в городах Иудеи
  rationale: Передаёт повторяющуюся географическую формулу и привычное русское название региона.
- source_word: הָהָר
  choice: Нагорье
  rationale: Это региональное обозначение гористой части Иудеи, а не одной горы; прописная буква показывает функцию географического названия.
- source_word: הַשְּׁפֵלָה
  choice: Шефела
  rationale: Транслитерация сохраняет название конкретной области Иудеи; значение пояснено в сноске.
- source_word: הַנֶּגֶב
  choice: Негев
  rationale: В ряду географических областей слово обозначает конкретный южный регион, поэтому сохранено как топоним.
- source_word: אָשִׁיב אֶת שְׁבוּתָם
  choice: Я возвращу их из плена
  rationale: Формула допускает оттенки возвращения пленников и общего восстановления. Выбранный вариант сохраняет прямую связь с пленом и естественно звучит по-русски; более широкое значение отмечено в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал прямо употребляет тетраграмматон; транслитерация сохраняет личное имя, не заменяя его титулом.
- issue: Значение формулы אָשִׁיב אֶת שְׁבוּתָם
  choice: Я возвращу их из плена
  alternative: Я восстановлю их благополучие
  rationale: Выбранная передача удерживает тему исторического плена, но не исключает более широкого восстановления; присущая выражению неоднозначность явно сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Юридическая последовательность передана ясными терминами без архаической перегруженности; географические названия сохранены как названия конкретных областей.
