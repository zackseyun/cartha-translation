  text: וְ/שַׂשְׂתִּ֥י עֲלֵי/הֶ֖ם לְ/הֵטִ֣יב אוֹתָ֑/ם וּ/נְטַעְתִּ֞י/ם בָּ/אָ֤רֶץ הַ/זֹּאת֙ בֶּ/אֱמֶ֔ת בְּ/כָל לִבִּ֖/י וּ/בְ/כָל נַפְשִֽׁ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/041.yaml
  text: I will rejoice over them to do them good[a], and I will plant them in this land in faithfulness, with all my heart and with all my soul.
translation:
  language: ru
  text: Я буду радоваться им, чтобы творить им добро, и насажу их на этой земле в верности[a] — всем Моим сердцем и всей Моей душой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в истине»; также: «поистине» или «истинно».'
    reason: 'Лексическая многозначность בֶּאֱמֶת: слово может обозначать верность, истину или подлинность; в данном контексте основной вариант передаёт надёжность Божьего намерения.'
lexical_decisions:
- source_word: וְשַׂשְׂתִּי עֲלֵיהֶם
  choice: Я буду радоваться о них
  rationale: Глагол שׂושׂ выражает сильную радость, а עַל указывает на тех, о ком радуются. Формулировка сохраняет личный и эмоциональный характер Божьего отношения.
- source_word: לְהֵיטִיב אוֹתָם
  choice: делая им добро
  rationale: Инфинитив יטב выражает цель или сопутствующий результат радости Бога. Русский деепричастный оборот естественно передаёт связь, не сводя её однозначно только к цели.
- source_word: וּנְטַעְתִּים
  choice: и насажу их
  rationale: Сохранена земледельческая метафора נטע, значимая для темы восстановления у Иеремии; «насажу» звучит в данном контексте достойно и естественно.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: на этой земле
  rationale: אֶרֶץ здесь обозначает обещанную землю; русское «на этой земле» соответствует обычному словоупотреблению.
- source_word: בֶּאֱמֶת
  choice: в верности
  rationale: אֱמֶת может означать истину, подлинность и верность. В обещании восстановить народ «в верности» подчёркивает надёжность Божьего намерения, не исключая иных оттенков, указанных в сноске.
- source_word: בְּכָל לִבִּי וּבְכָל נַפְשִׁי
  choice: всем Моим сердцем и всей Моей душой
  rationale: Сохранён выразительный еврейский оборот о всецелой внутренней преданности; русская конструкция естественна и удерживает антропоморфный образ исходного текста.
theological_decisions:
- issue: Антропоморфное описание Божьей решимости
  choice: Сохранить «всем Моим сердцем и всей Моей душой»
  alternative: «всем Моим существом» или «со всей решимостью»
  rationale: Исходный текст прямо прилагает к Богу язык всецелой личной преданности. Его сохранение передаёт силу обещания и не превращает образ в отвлечённое утверждение.
- issue: Значение בֶּאֱמֶת в обещании восстановления
  choice: «в верности» в основном тексте
  alternative: «поистине» или «истинно»
  rationale: Контекст подчёркивает надёжность Божьего обещания, однако семантическая многозначность слова сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены метафора насаждения и смелый антропоморфный оборот. Заглавные буквы в местоимениях, относящихся к Богу, использованы последовательно в рамках стиха.
