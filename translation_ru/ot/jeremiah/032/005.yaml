  text: וּ/בָבֶ֞ל יוֹלִ֤ךְ אֶת צִדְקִיָּ֨הוּ֙ וְ/שָׁ֣ם יִֽהְיֶ֔ה עַד פָּקְדִ֥/י אֹת֖/וֹ נְאֻם יְהוָ֑ה כִּ֧י תִֽלָּחֲמ֛וּ אֶת הַ/כַּשְׂדִּ֖ים לֹ֥א תַצְלִֽיחוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/005.yaml
  text: And he will take Zedekiah to Babylon, and there he will remain until I attend to him, declares the LORD. Though you fight against the Chaldeans, you will not succeed.
translation:
  language: ru
  text: И он уведёт Седекию в Вавилон, и там он будет, пока Я не посещу его, — возвещает ГОСПОДЬ. Хотя вы будете сражаться с халдеями, успеха не добьётесь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹלִךְ
  choice: уведёт
  rationale: Каузативная форма передаёт принудительное перемещение Седекии в Вавилон; подлежащее подразумевается из контекста.
- source_word: עַד פָּקְדִי אֹתוֹ
  choice: пока Я не обращусь к нему
  rationale: Глагол פקד многозначен и может обозначать Божье вмешательство, посещение или обращение с кем-либо. Нейтральная формулировка сохраняет неопределённость относительно милости или суда.
- source_word: נְאֻם יְהוָה
  choice: возвещает ГОСПОДЬ
  rationale: Устойчивая пророческая формула; тетраграмматон передан традиционным титулом прописными буквами.
- source_word: הַכַּשְׂדִּים
  choice: халдеями
  rationale: Исторически и библейски закреплённое русское обозначение нововавилонских войск.
- source_word: לֹא תַצְלִיחוּ
  choice: успеха не добьётесь
  rationale: Естественно передаёт значение отсутствия успеха в военном сопротивлении.
theological_decisions:
- issue: Характер Божьего действия в выражении פקד
  choice: пока Я не обращусь к нему
  alternative: пока Я не взыщу с него / пока Я не позабочусь о нём
  rationale: Контекст не требует однозначно понимать действие как наказание или благоволение; перевод сохраняет богословское напряжение исходного выражения.
- issue: Связь заключительного придаточного с предыдущим утверждением
  choice: Хотя вы будете сражаться с халдеями
  alternative: Если вы будете сражаться с халдеями
  rationale: כִּי допускает контекстуальные оттенки. Уступительное прочтение соответствует неизбежности сопротивления и его безуспешности, не превращая пророчество в условное.
translation_notes:
  register: 'Современный литературный русский язык с торжественным пророческим оттенком. Местоимение «тот» устраняет возможную двусмысленность русского «он»: в Вавилоне останется Седекия, тогда как уведёт его подразумеваемый в контексте царь Вавилона.'
