  text: עַל֩ כָּל רָעַ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אֲשֶׁ֤ר עָשׂוּ֙ לְ/הַכְעִסֵ֔/נִי הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם כֹּהֲנֵי/הֶ֖ם וּ/נְבִֽיאֵי/הֶ֑ם וְ/אִ֣ישׁ יְהוּדָ֔ה וְ/יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/032.yaml
  text: because of all the evil of the sons of Israel and the sons of Judah that they did to provoke me to anger—they[a], their kings, their officials, their priests, and their prophets[c][b], and the men of Judah and the inhabitants of Jerusalem.
translation:
  language: ru
  text: 'за всё зло, которое совершили сыны Израиля и сыны Иуды[a], чтобы разгневать Меня[b], — они сами: их цари, их сановники, их священники и их пророки, люди Иуды[c] и жители Иерусалима.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ Израиля и народ Иуды». Буквально: «сыны Израиля и сыны Иуды».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вызывая Мой гнев».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «человек Иуды»; единственное число здесь употреблено собирательно. Возможно также: «каждый человек Иуды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כָּל רָעַת
  choice: за всё зло
  rationale: Предлог עַל в продолжении мысли предыдущего стиха указывает на причину суда; רָעָה здесь означает нравственное зло, а כָּל придаёт выражению всеохватность.
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  choice: сыны Израиля и сыны Иуды
  rationale: Сохраняется образное и грамматически мужское выражение оригинала «сыны», при этом формулировка остаётся узнаваемой в литературном русском языке.
- source_word: אֲשֶׁר עָשׂוּ
  choice: которое совершили
  rationale: Глагол עשה передан естественным русским сочетанием «совершили зло» без добавления более узкого толкования.
- source_word: לְהַכְעִסֵנִי
  choice: вызывая Мой гнев
  rationale: Каузативная форма передаёт действие, вызывающее гнев Бога; деепричастный оборот естественно связывает его с предшествующим действием.
- source_word: הֵמָּה
  choice: они сами
  rationale: Самостоятельное местоимение имеет подчёркнутый характер и возобновляет подлежащее перед перечнем виновных групп.
- source_word: שָׂרֵיהֶם
  choice: их сановники
  rationale: שָׂרִים обозначает высокопоставленных правителей и должностных лиц; «сановники» уместно в историческом контексте и не приписывает им царского происхождения.
- source_word: וְאִישׁ יְהוּדָה
  choice: весь народ Иуды
  rationale: Единственное число אִישׁ употреблено собирательно и охватывает население Иуды; русский вариант передаёт коллективный смысл, а формальная особенность отмечена в сноске.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: и жители Иерусалима
  rationale: Естественная русская передача субстантивированного причастия со значением постоянных жителей города.
theological_decisions:
- issue: Гендерно маркированное собирательное выражение בְּנֵי
  choice: Сохранить «сыны Израиля и сыны Иуды»
  alternative: «народ Израиля и народ Иуды»
  rationale: Так сохраняется форма исходного текста и её представительный мужской характер, а сноска поясняет собирательное значение.
- issue: Антропопатическое выражение о Божьем гневе
  choice: «вызывая Мой гнев»
  alternative: «разгневали Меня»
  rationale: Выбранный вариант сохраняет каузативную силу еврейского глагола и не ослабляет прямое указание на Божий гнев.
- issue: Собирательное значение אִישׁ יְהוּדָה
  choice: «весь народ Иуды»
  alternative: «каждый муж Иуды»
  rationale: Контекст перечисляет общественные группы в целом; собирательная передача естественна по-русски, а буквальная форма сохранена в сноске как возможный нюанс.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Слово «сыны» сохранено ради формальной прозрачности оригинала; «сановники» ясно обозначает высокопоставленных служащих древней монархии. Синтаксический ряд и тире сохраняют эмфатическое возобновление подлежащего в еврейском тексте.
