  text: הִנֵּ֣ה חֲנַמְאֵ֗ל בֶּן שַׁלֻּם֙ דֹּֽדְ/ךָ֔ בָּ֥א אֵלֶ֖י/ךָ לֵ/אמֹ֑ר קְנֵ֣ה לְ/ךָ֗ אֶת שָׂדִ/י֙ אֲשֶׁ֣ר בַּ/עֲנָת֔וֹת כִּ֥י לְ/ךָ֛ מִשְׁפַּ֥ט הַ/גְּאֻלָּ֖ה לִ/קְנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/007.yaml
  text: Look[a], Hanamel son of Shallum, your uncle, is coming to you, saying, ‘Buy my field that is in Anathoth, for the right of redemption to buy it belongs to you.’
translation:
  language: ru
  text: 'Вот, Ханамел, сын Шаллума, твоего дяди, придёт к тебе и скажет: «Купи себе моё поле в Анафофе, ибо тебе принадлежит право выкупа[a] этого поля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ибо тебе принадлежит право выкупа, чтобы купить». Речь идёт об основанном на родстве праве выкупить семейную землю; возможный перевод: «право обратной покупки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную силу и непосредственность еврейского вводного слова, оставаясь естественным для современного литературного русского языка.
- source_word: חֲנַמְאֵל
  choice: Ханамел
  rationale: Транслитерация личного имени с опорой на еврейскую форму.
- source_word: בֶּן שַׁלֻּם דֹּדְךָ
  choice: сын твоего дяди Шаллума
  rationale: Связь родительного оборота допускает понимание Шаллума как дяди Иеремии; такая передача естественна и соответствует семейно-правовому контексту.
- source_word: בָּא אֵלֶיךָ לֵאמֹר
  choice: идёт к тебе и скажет
  rationale: Причастие передаёт приближающееся действие, а לֵאמֹר вводит содержание предстоящей речи; русская конструкция выражает близкое будущее без тяжеловесного буквального «говоря».
- source_word: קְנֵה לְךָ
  choice: Купи себе
  rationale: Прямо передаёт императив קנה и этический дательный לְךָ.
- source_word: שָׂדִי
  choice: моё поле
  rationale: Сохраняет конкретное обозначение земельного владения.
- source_word: בַּעֲנָתוֹת
  choice: в Анафофе
  rationale: Использована укоренившаяся русская библейская форма географического названия.
- source_word: מִשְׁפַּט הַגְּאֻלָּה
  choice: право выкупа
  rationale: Передаёт юридически признанное право близкого родственника выкупить семейную землю, не придавая выражению отвлечённо-духовного смысла.
- source_word: לִקְנוֹת
  choice: купить его
  rationale: Инфинитив поясняет содержание права выкупа; местоимение «его» явно соотнесено с полем.
- source_word: כִּי לְךָ
  choice: потому что тебе принадлежит
  rationale: Естественно выражает основание повеления и принадлежность соответствующего права адресату.
theological_decisions:
- issue: Значение גְּאֻלָּה в законе о земле
  choice: Юридический «выкуп» родового имущества
  alternative: «Искупление» или более общее «возвращение собственности»
  rationale: Контекст говорит о родственном праве выкупить семейный земельный участок; перевод не переносит сюда духовно-сотериологическое значение.
- issue: Право или обязанность родственника
  choice: Сохранено нейтральное «право выкупа»
  alternative: «Обязанность выкупить»
  rationale: מִשְׁפַּט может охватывать установленное законом притязание или полномочие, тогда как стих прямо не требует сводить его исключительно к обязанности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Вот» сохраняет живость пророческого сообщения; юридический термин передан понятно, без конфессиональной нагрузки.
