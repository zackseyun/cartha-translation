  source_fidelity: 'Родственная связь передана в целом верно: Ханамел — сын Шаллума, который назван дядей Иеремии. Однако сочетание «идёт к тебе и скажет» неоправданно смешивает настоящее и будущее. Еврейская конструкция с בָּא ... לֵאמֹר в пророческом сообщении естественно передаётся будущим: «придёт ... и скажет». Заключительный инфинитив относится к праву выкупа поля; в русском его лучше передать без неестественного повтора «право выкупа — купить его».'
