  terminology: «Право выкупа» точно передаёт מִשְׁפַּט הַגְּאֻלָּה в контексте родового земельного имущества. Не следует заменять его на «искупление». Сноску следует привязать непосредственно к этому выражению; вариант «право обратной покупки» возможен как пояснительный, но не является предпочтительным основным термином.
