source:
  edition: WLC
  text: אֲשֶׁ֣ר כְּלָא֔/וֹ צִדְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָ֖ה לֵ/אמֹ֑ר מַדּוּעַ֩ אַתָּ֨ה נִבָּ֜א לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י נֹתֵ֜ן אֶת הָ/עִ֥יר הַ/זֹּ֛את בְּ/יַ֥ד מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/003.yaml
  text: 'because Zedekiah king of Judah had confined him[a], saying, “Why do you prophesy, saying, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will capture it’?”'
translation:
  language: ru
  text: 'потому что Седекия, царь Иудеи, заключил его под стражу[a], сказав: «Почему ты пророчествуешь: „Так говорит Яхве: вот, Я отдаю этот город в руки царя Вавилона, и он захватит его“?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «запер его»; «заключил его в темницу».'
    reason: 'Лексическая альтернатива: כלא может обозначать содержание взаперти или заключение в тюрьму.'
lexical_decisions:
- source_word: אֲשֶׁר
  choice: потому что
  rationale: В контексте частица связывает этот стих с предыдущим и вводит причину, по которой Иеремия находился во дворе стражи.
- source_word: כְּלָאוֹ
  choice: заключил его под стражу
  rationale: Глагол обозначает лишение свободы или содержание взаперти; выражение естественно по-русски и соответствует описанному заключению.
- source_word: מַדּוּעַ אַתָּה נִבָּא
  choice: Почему ты пророчествуешь
  rationale: Прямая передача вопроса царя; форма сохраняет повторяющийся или актуальный характер пророческой речи.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняется узнаваемая формула посланнической речи пророка и личное имя יְהוָה.
- source_word: הִנְנִי נֹתֵן
  choice: вот, Я отдаю
  rationale: «Вот» передаёт торжественную указательность הִנְנִי, а настоящее время «отдаю» — живость и несомненность предстоящего действия.
- source_word: בְּיַד
  choice: в руки
  rationale: Сохраняет древнееврейский образ передачи города под власть противника и естественно звучит по-русски.
- source_word: וּלְכָדָהּ
  choice: и он захватит его
  rationale: Глагол לכד точно обозначает военный захват города; местоимение относится к городу, а субъектом естественно выступает царь Вавилона.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное Божье имя; транслитерация сохраняет это различие и не заменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Начальное «потому что» намеренно сохраняет синтаксическую связь с предыдущим стихом; вложенная цитата оформлена русскими кавычками второго уровня.
