  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ אֵלַ/י֙ אֲדֹנָ֣/י יְהוִ֔ה קְנֵֽה לְ/ךָ֧ הַ/שָּׂדֶ֛ה בַּ/כֶּ֖סֶף וְ/הָעֵ֣ד עֵדִ֑ים וְ/הָ/עִ֥יר נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/025.yaml
  text: Yet you yourself said to me[a], Lord Yahweh[b], ‘Buy the field for yourself with silver and call witnesses,’ though the city has been given into the hand of the Chaldeans.
translation:
  language: ru
  text: 'Но Ты Сам сказал мне, Владыка Яхве: «Купи себе поле за серебро и позови свидетелей», хотя город уже отдан в руки халдеев.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «между тем как город отдан в руки халдеев». Еврейский союз можно передать и проще: «и»; перевод «хотя» подчёркивает противопоставление в словах Иеремии. Халдеи здесь — вавилоняне.'
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  choice: Но Ты Сам
  rationale: Союз и самостоятельное местоимение создают контраст и подчёркивают, что повеление исходило от самого Бога; русское «Но Ты Сам» естественно передаёт этот акцент.
- source_word: אָמַרְתָּ אֵלַי
  choice: сказал мне
  rationale: Простое прошедшее время естественно для ретроспективного обращения Иеремии к Богу.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное Божье имя יהוה и избегает неестественного сочетания «Господь Господь».
- source_word: קְנֵה לְךָ הַשָּׂדֶה
  choice: купи себе это поле
  rationale: «Купи» прямо передаёт императив, «себе» отражает לְךָ; указательное «это» уместно по контексту уже известного поля.
- source_word: בַּכֶּסֶף
  choice: за серебро
  rationale: Сохраняется конкретное значение כֶּסֶף и одновременно ясно выражается плата при покупке.
- source_word: וְהָעֵד עֵדִים
  choice: и позови свидетелей
  rationale: 'Передаёт юридический смысл каузативной формы: обеспечить присутствие свидетелей при сделке.'
- source_word: וְהָעִיר
  choice: хотя город
  rationale: В контексте жалобы союз выражает уступительное противопоставление между Божьим повелением и положением города; более буквальное «и/между тем» отмечено в сноске.
- source_word: נִתְּנָה
  choice: уже отдан
  rationale: Перфект обозначает состоявшуюся передачу с наличным результатом; «уже» делает контекстуальное напряжение ясным, не меняя характера действия.
- source_word: בְּיַד
  choice: в руки
  rationale: Сохранён библейский образ передачи во власть кого-либо; по-русски устойчиво выражение «отдать в руки».
- source_word: הַכַּשְׂדִּים
  choice: халдеев
  rationale: Это прямое соответствие этнониму; здесь он обозначает вавилонские силы.
theological_decisions:
- issue: Передача составного обращения אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, не подменяя имя общим титулом и не создавая повтора.
- issue: Характер связи последней части стиха с повелением
  choice: уступительное «хотя»
  alternative: сочинительное или временное «и / между тем как»
  rationale: Контекст молитвы Иеремии подчёркивает парадокс покупки поля при фактической передаче города врагу; поскольку еврейский ו допускает более простую связь, она сохранена как вариант в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Заглавные местоимения в обращении к Богу сохраняют традиционный русский религиозный регистр. Синтаксис сделан ясным для чтения вслух, при этом сохранены юридическая конкретность сделки и напряжение между повелением и осадой города.
