  yaml_path: translation/ot/jeremiah/032/026.yaml
  text: Then the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: ru
  text: 'И слово Яхве пришло к Иеремии[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ); имя также передают как «Иегова».
    reason: Указать еврейский тетраграмматон и распространённый альтернативный вариант передачи имени.
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма וַיְהִי продолжает повествовательную последовательность; «И было» естественно сочетается с устойчивой пророческой формулой и не добавляет отсутствующего в еврейском тексте наречия времени.
- source_word: דְּבַר
  choice: слово
  rationale: В формуле דְּבַר יְהוָה слово «слово» сохраняет прямой смысл и традиционную весомость пророческого выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, обозначенное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает направленность Божьего слова к Иеремии; в данной русской формуле естественно «к».
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Имя передано в принятой русской библейской форме и поставлено в дательном падеже после предлога «к».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Еврейский инфинитив вводит содержание последующей речи. В современном русском это естественно и точно выражается двоеточием без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя יהוה. Форма «Яхве» прямо передаёт его как имя; титул «Господь» скрывает это различие, а «Иегова» представляет альтернативную традиционную форму.
translation_notes:
  register: Современный литературный русский с сохранением краткой и торжественной пророческой формулы. לֵאמֹר передано пунктуационно, поскольку дословное «говоря» здесь звучало бы неестественно.
