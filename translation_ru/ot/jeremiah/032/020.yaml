source:
  edition: WLC
  text: אֲשֶׁר שַׂ֠מְתָּ אֹת֨וֹת וּ/מֹפְתִ֤ים בְּ/אֶֽרֶץ מִצְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וּ/בְ/יִשְׂרָאֵ֖ל וּ/בָֽ/אָדָ֑ם וַ/תַּעֲשֶׂה לְּ/ךָ֥ שֵׁ֖ם כַּ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/020.yaml
  text: who set signs and wonders in the land of Egypt[a], and in Israel and among mankind to this day, and made a name for yourself, as it is this day.
translation:
  language: ru
  text: Ты явил знамения и чудеса в земле Египта, в Израиле и среди людей[a] — до нынешнего дня; Ты сделал себе имя, как в этот день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «среди человека»; еврейское слово אָדָם здесь употреблено собирательно и означает человеческий род, людей.'
    reason: Поясняет собирательное употребление אָדָם и более буквальную форму еврейского выражения.
lexical_decisions:
- source_word: שַׂמְתָּ
  choice: явил
  rationale: Буквальное «поставил» с сочетанием «знамения и чудеса» по-русски неестественно. «Явил» передаёт совершение и открытое проявление чудесных знамений, не сводя их лишь к абстрактным действиям.
- source_word: אֹתוֹת וּמֹפְתִים
  choice: знамения и чудеса
  rationale: 'Устойчивое и понятное соответствие традиционной еврейской паре: первое слово подчёркивает указующий смысл, второе — необычайность и вызываемое изумление.'
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египетской
  rationale: Сохраняется явное אֶרֶץ («земля»), при этом используется естественное для русского библейского регистра географическое наименование.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: вплоть до нынешнего дня
  rationale: Современное и ясное выражение продолжительности до настоящего времени; его положение в русском предложении позволяет отнести его ко всему ряду мест и человеческих сообществ.
- source_word: וּבְיִשְׂרָאֵל
  choice: в Израиле
  rationale: Прямо передаёт пространственно-социальное значение предлога בְּ без ненужного уточнения, идёт ли речь о земле или народе.
- source_word: וּבָאָדָם
  choice: среди людей
  rationale: אָדָם употреблено собирательно и означает человеческий род; «среди людей» естественно передаёт это значение в данном ряду.
- source_word: וַתַּעֲשֶׂה לְּךָ שֵׁם
  choice: и сделал Себе имя
  rationale: Русский оборот «сделать себе имя» естественно выражает приобретение известности и сохраняет образ еврейского текста.
- source_word: כַּיּוֹם הַזֶּה
  choice: известное и сегодня
  rationale: 'Передаёт наблюдаемый в настоящее время результат: имя, созданное Божьими деяниями, остаётся известным теперь.'
theological_decisions:
- issue: Собирательное значение אָדָם
  choice: среди людей
  alternative: среди человечества
  rationale: «Людей» ясно обозначает всех людей как совокупность и звучит конкретнее и естественнее, чем абстрактное «человечество», не ограничивая смысл мужчинами.
- issue: Объём временного выражения עַד הַיּוֹם הַזֶּה
  choice: отнести к ряду «в земле Египетской, в Израиле и среди людей»
  alternative: связать только с Египтом
  rationale: Порядок слов допускает тесную связь с Египтом, однако общий смысл и параллельное итоговое כַּיּוֹם הַזֶּה указывают на сохраняющуюся до настоящего времени известность Божьих знамений во всех названных сферах. Перевод не добавляет отдельного продолжающегося совершения чудес.
- issue: Значение выражения «сделать Себе имя»
  choice: сохранить образ имени
  alternative: «прославился» или «приобрёл известность»
  rationale: Образ «имени» богословски и литературно значим, но здесь означает известность и славу, приобретённые деяниями; русский идиоматический оборот позволяет сохранить обе стороны.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формы «явил», «земле Египетской» и прописные местоимения поддерживают достоинство молитвенной речи, но избегаются устаревшие «доныне», «сего дня» и «стяжал».
