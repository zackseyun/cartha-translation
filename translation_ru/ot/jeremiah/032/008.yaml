  text: וַ/יָּבֹ֣א אֵ֠לַ/י חֲנַמְאֵ֨ל בֶּן דֹּדִ֜/י כִּ/דְבַ֣ר יְהוָה֮ אֶל חֲצַ֣ר הַ/מַּטָּרָה֒ וַ/יֹּ֣אמֶר אֵלַ֡/י קְנֵ֣ה נָ֠א אֶת שָׂדִ֨/י אֲשֶׁר בַּ/עֲנָת֜וֹת אֲשֶׁ֣ר בְּ/אֶ֣רֶץ בִּנְיָמִ֗ין כִּֽי לְ/ךָ֞ מִשְׁפַּ֧ט הַ/יְרֻשָּׁ֛ה וּ/לְ/ךָ֥ הַ/גְּאֻלָּ֖ה קְנֵה לָ֑/ךְ וָ/אֵדַ֕ע כִּ֥י דְבַר יְהוָ֖ה הֽוּא־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/008.yaml
  text: Then Hanamel the son of my uncle came to me in the court of the guard[a], according to the word of Yahweh, and he said to me, “Please buy my field that is at Anathoth, in the land of Benjamin, for the right of inheritance is yours and the redemption is yours. Buy it for yourself.” Then I knew that this was the word of Yahweh.
translation:
  language: ru
  text: 'И пришёл ко мне Ханамел, сын моего дяди, во двор стражи, как и сказал Яхве. Он сказал мне: «Купи, пожалуйста, моё поле в Анатоте, в земле Вениамина, потому что тебе принадлежит право наследования и право выкупа[a]. Купи его себе». Тогда я понял, что это было слово Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выкуп принадлежит тебе». Речь идёт о праве или обязанности ближайшего родственника выкупить семейную землю.'
    reason: Уточнение юридического значения הַגְּאֻלָּה и сохранение заложенного в нём сочетания права и родственной обязанности.
lexical_decisions:
- source_word: כִּדְבַר יְהוָה
  choice: как и сказал Яхве
  rationale: Конструкция כְּ с דָּבָר указывает на соответствие ранее сказанному; естественная русская формулировка сохраняет связь с предшествующим Божьим возвещением.
- source_word: חֲצַר הַמַּטָּרָה
  choice: двор стражи
  rationale: Выражение обозначает охраняемый двор, где содержался Иеремия; перевод сохраняет место и его стражный характер, не приравнивая его прямо к тюрьме.
- source_word: קְנֵה נָא
  choice: Купи, пожалуйста
  rationale: קנה в контексте сделки значит «купить», а נָא смягчает повеление и передаёт просьбу.
- source_word: שָׂדִי
  choice: моё поле
  rationale: Прямое и естественное соответствие שָׂדֶה в контексте продажи земельного участка.
- source_word: בַּעֲנָתוֹת
  choice: в Анатоте
  rationale: Предлог ב указывает на местонахождение поля; «в Анатоте» естественно для русского названия населённого пункта.
- source_word: מִשְׁפַּט הַיְרֻשָּׁה
  choice: право наследования
  rationale: מִשְׁפָּט здесь означает законное право или притязание, а יְרֻשָּׁה — наследование либо наследственное владение.
- source_word: הַגְּאֻלָּה
  choice: право выкупа
  rationale: Хотя буквально стоит «выкуп», в контексте семейного земельного права существительное обозначает принадлежавшее родственнику право или обязанность выкупить имущество; явное добавление «право» делает юридический смысл понятным.
- source_word: קְנֵה לָךְ
  choice: Купи его себе
  rationale: לָךְ передаёт значение приобретения для себя; местоимение «его» естественно указывает на поле.
- source_word: וָאֵדַע כִּי דְבַר יְהוָה הוּא
  choice: Тогда я понял, что это было слово Яхве
  rationale: Событие дало Иеремии уверенность, что прежнее возвещение действительно исходило от Яхве; «понял» здесь естественно передаёт результат узнавания и убеждения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте употреблён тетраграмматон; транслитерация «Яхве» передаёт личное имя, не заменяя его титулом.
- issue: Юридический смысл הַגְּאֻלָּה
  choice: право выкупа
  alternative: выкуп; обязанность выкупа
  rationale: Термин относится к родственной системе возвращения семейной земли и может включать как право, так и ответственность. В основном тексте выбран понятный юридический эквивалент, а двойственный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка упрощён ради ясности; юридические термины сохранены. Имя Ханамел передано близко к еврейской форме, топоним — в привычной русской форме «Анатот».
