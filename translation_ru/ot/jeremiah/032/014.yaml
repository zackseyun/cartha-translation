source:
  edition: WLC
  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָק֣וֹחַ אֶת הַ/סְּפָרִ֣ים הָ/אֵ֡לֶּה אֵ֣ת סֵפֶר֩ הַ/מִּקְנָ֨ה הַ/זֶּ֜ה וְ/אֵ֣ת הֶ/חָת֗וּם וְ/אֵ֨ת סֵ֤פֶר הַ/גָּלוּי֙ הַ/זֶּ֔ה וּ/נְתַתָּ֖/ם בִּ/כְלִי חָ֑רֶשׂ לְמַ֥עַן יַעַמְד֖וּ יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/014.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Take these documents, this deed of purchase, both the sealed copy and this open copy, and put them in an earthenware vessel[b], so that they may last for many days.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств, Бог Израиля: «Возьми эти документы[a] — эту купчую, запечатанный экземпляр и этот открытый экземпляр[b], — и положи их в глиняный сосуд, чтобы они сохранялись долгое время».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эти свитки». Еврейское слово может обозначать разные письменные документы; здесь речь идёт о документах, связанных с юридической сделкой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «этот незапечатанный документ». Еврейский текст противопоставляет его запечатанному экземпляру.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя Бога и передаёт устойчивый титул, выражающий Его власть над небесными и земными силами.
- source_word: לָקוֹחַ
  choice: Возьми
  rationale: Инфинитив употреблён как повелительное указание; по-русски естественно передаётся формой повелительного наклонения.
- source_word: הַסְּפָרִים הָאֵלֶּה
  choice: эти документы
  rationale: В данном контексте סְפָרִים обозначает письменные документы, относящиеся к юридической сделке, а не только свитки как материальную форму текста.
- source_word: סֵפֶר הַמִּקְנָה
  choice: эту купчую
  rationale: Речь идёт о юридическом документе, удостоверяющем покупку земли; «купчая» точно и кратко передаёт его назначение.
- source_word: הֶחָתוּם
  choice: запечатанный экземпляр
  rationale: Прилагательное указывает на запечатанную форму купчей; слово «экземпляр» добавлено для ясной и естественной связи с открытым документом.
- source_word: סֵפֶר הַגָּלוּי
  choice: этот открытый экземпляр
  rationale: גָּלוּי противопоставлено запечатанному документу и означает открытый, то есть незапечатанный, экземпляр.
- source_word: בִּכְלִי חָרֶשׂ
  choice: в глиняный сосуд
  rationale: Выражение обозначает сосуд из обожжённой глины, предназначенный здесь для длительного хранения документов.
- source_word: לְמַעַן יַעַמְדוּ יָמִים רַבִּים
  choice: чтобы они сохранялись долгое время
  rationale: Глагол עמד здесь выражает продолжительное существование и сохранность, а не буквальное стояние; русский оборот естественно передаёт цель действия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблено личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Юридический термин «купчая» выбран ради точности и краткости; синтаксис упрощён для ясного чтения без устранения различия между запечатанным и открытым документами.
