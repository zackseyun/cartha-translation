  text: כִּֽי הָי֨וּ בְנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אַ֣ךְ עֹשִׂ֥ים הָ/רַ֛ע בְּ/עֵינַ֖/י מִ/נְּעֻרֹֽתֵי/הֶ֑ם כִּ֣י בְנֵֽי יִשְׂרָאֵ֗ל אַ֣ךְ מַכְעִסִ֥ים אֹתִ֛/י בְּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/030.yaml
  text: For the sons of Israel and the sons of Judah have done only what was evil in my eyes from their youth[a], for the sons of Israel have only provoked me by the work of their hands[b], declares Yahweh.
translation:
  language: ru
  text: Ибо сыны Израиля и сыны Иуды с юности своей делали лишь зло в Моих глазах[a]; ибо сыны Израиля лишь гневили Меня делами своих рук[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне» и «иудеи» (либо «народ Израиля» и «народ Иуды»). Буквально: «сыны Израиля» и «сыны Иуды».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «делами своих рук» может относиться и непосредственно к изготовленным ими идолам.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет буквальное корпоративное обозначение и параллелизм с «сынами Иуды»; возможное более естественное понимание пояснено в сноске.
- source_word: וּבְנֵי יְהוּדָה
  choice: и сыны Иуды
  rationale: Сохраняет синтаксическую параллель и различение двух исторических общностей.
- source_word: אַךְ
  choice: лишь
  rationale: 'Передаёт ограничительно-усилительное значение: их поведение характеризовалось злом и постоянным вызовом Божьему гневу.'
- source_word: עֹשִׂים הָרַע בְּעֵינַי
  choice: делали лишь зло в Моих глазах
  rationale: Сохраняет еврейский образ Божьей нравственной оценки и звучит понятно по-русски.
- source_word: מִנְּעֻרֹתֵיהֶם
  choice: с юности своей
  rationale: Естественно передаёт давность устойчивого поведения и допускает корпоративный смысл — с ранней истории народа.
- source_word: מַכְעִסִים אֹתִי
  choice: гневили Меня
  rationale: 'Передаёт каузативный смысл глагола: своими поступками они вызывали Божий гнев; русская форма также выражает повторяемость действия.'
- source_word: בְּמַעֲשֵׂה יְדֵיהֶם
  choice: делами своих рук
  rationale: 'Сохраняет образ оригинала и его намеренную широту: это могут быть как поступки вообще, так и изготовленные ими идолы.'
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную пророческую формулу и сохраняет личное имя Бога.
theological_decisions:
- issue: Объём значения второго בְנֵי יִשְׂרָאֵל
  choice: Повторить «сыны Израиля», не заменяя выражение местоимением и не добавляя Иуду.
  alternative: «они» или «Израиль и Иуда»
  rationale: Так сохраняется риторическое повторение и возможное намеренное сужение либо собирательное употребление названия Израиля, не разрешая неоднозначность за текст.
- issue: Значение «дел своих рук»
  choice: Оставить широкое выражение в основном тексте и отметить возможную отсылку к идолам в сноске.
  alternative: Перевести прямо как «идолами, которых они изготовили»
  rationale: Контекст допускает идолопоклонство, но сама фраза может обозначать человеческие дела шире; конкретизация в основном тексте устранила бы подлинную смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Буквальные корпоративные обозначения «сыны Израиля» и «сыны Иуды» сохранены ради структуры и богословской напряжённости оригинала; местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с традиционным русским библейским регистром.
