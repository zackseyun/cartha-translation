  text: וַ/יָּבֹ֜אוּ וַ/יִּֽרְשׁ֣וּ אֹתָ֗/הּ וְ/לֹֽא שָׁמְע֤וּ בְ/קוֹלֶ֨/ךָ֙ ו/ב/תרות/ך לֹא הָלָ֔כוּ אֵת֩ כָּל אֲשֶׁ֨ר צִוִּ֧יתָה לָ/הֶ֛ם לַ/עֲשׂ֖וֹת לֹ֣א עָשׂ֑וּ וַ/תַּקְרֵ֣א אֹתָ֔/ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/023.yaml
  text: They came in and took possession of it[a], but they did not listen to your voice, and they did not walk in your law. They did not do all that you commanded them to do[b], and you brought upon them all this disaster.
translation:
  language: ru
  text: Они вошли в неё и овладели ею, но не слушались Твоего голоса и не поступали по Твоему Закону[a]. Они не сделали всего, что Ты повелел им делать, и Ты навёл на них всё это бедствие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по Твоему наставлению». Еврейское слово тора может означать как закон, так и наставление; здесь имеется в виду данное Богом учение завета.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально еврейский текст: «Ты призвал их всё это бедствие»; это необычный оборот со значением навести на кого-либо бедствие или суд.'
    reason: source_idiom
lexical_decisions:
- source_word: וַיָּבֹאוּ וַיִּרְשׁוּ אֹתָהּ
  choice: Они вошли в неё и овладели ею
  rationale: Глагол בוא передаёт вхождение в землю, а ירשׁ в контексте земли — вступление во владение ею; местоимение женского рода соотнесено с землёй из контекста.
- source_word: וְלֹא שָׁמְעוּ בְקוֹלֶךָ
  choice: но не слушались Твоего голоса
  rationale: Сохранён образ «голоса», а возвратная форма «слушались» естественно выражает не просто слышание, а повиновение.
- source_word: וּבְתוֹרָתְךָ לֹא הָלָכוּ
  choice: и не поступали по Твоему Закону
  rationale: Русское «поступали по» естественно передаёт еврейскую метафору хождения как образа поведения. «Закон» соответствует заветному контексту, при сохранении в сноске значения «наставление».
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתָה לָהֶם לַעֲשׂוֹת לֹא עָשׂוּ
  choice: Они не исполняли всего, что Ты повелел им исполнить
  rationale: Передана всеохватность כָּל и повтор корня «делать/исполнять» без неестественного для русского буквального синтаксиса.
- source_word: וַתַּקְרֵא אֹתָם אֵת כָּל הָרָעָה הַזֹּאת
  choice: и Ты навёл на них всё это бедствие
  rationale: קרא в данной конструкции идиоматически означает призвать или навлечь бедствие на кого-либо. «Навёл» ясно передаёт причинённое наказание, а «бедствие» выражает контекстуальное значение רָעָה как пагубы, а не нравственного зла.
theological_decisions:
- issue: Значение תּוֹרָה в контексте завета
  choice: Твоему Закону
  alternative: Твоему наставлению
  rationale: Речь идёт об обязательствах народа в дарованной земле; «Закон» уместно передаёт установленное Богом заветное учение, а более широкое значение «наставление» отмечено в сноске.
- issue: Значение הָרָעָה применительно к Божьему суду
  choice: бедствие
  alternative: зло; несчастье
  rationale: Здесь слово обозначает постигшее народ пагубное событие как суд за непослушание, а не нравственное зло. Перевод не устраняет утверждение, что бедствие было наведено Богом.
- issue: Образ хождения в выражении הָלַךְ בְּתוֹרָה
  choice: не поступали по Твоему Закону
  alternative: не ходили по Твоему Закону
  rationale: Передан смысл поведения согласно Божьему учению; буквальное «ходили» в современном русском может ошибочно восприниматься как физическое движение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Обращённые к Богу местоимения написаны с прописной буквы. Сохранён образ Божьего «голоса», тогда как метафора хождения передана естественным русским выражением «поступать по».
