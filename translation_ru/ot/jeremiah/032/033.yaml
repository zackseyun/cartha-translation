lexical_decisions:
- source_word: וַיִּפְנוּ אֵלַי עֹרֶף וְלֹא פָנִים
  choice: Они поворачивались ко Мне спиной, а не лицом
  rationale: Сохранён резкий древнееврейский образ противопоставления спины и лица, выражающий отвержение Бога. Несовершенный вид «поворачивались» передаёт устойчивое, повторяющееся поведение в данном контексте.
- source_word: וְלַמֵּד אֹתָם הַשְׁכֵּם וְלַמֵּד
  choice: Я же учил их, с раннего утра не переставая учить
  rationale: Формула, характерная для Иеремии, буквально содержит образ раннего вставания и обозначает усердное, постоянное действие. Перевод сохраняет образ и одновременно делает его идиоматический смысл ясным по-русски.
- source_word: וְאֵינָם שֹׁמְעִים
  choice: но они не слушали
  rationale: Передано продолжающееся нежелание внимать Божьему учению, а не единичный случай непослушания.
- source_word: לָקַחַת מוּסָר
  choice: принимали наставления
  rationale: Слово מוּסָר охватывает наставление, исправление и дисциплинирующее вразумление. «Принимать наставление» естественно звучит по-русски и не сужает значение до одного лишь наказания.
