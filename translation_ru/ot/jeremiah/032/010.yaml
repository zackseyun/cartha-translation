base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/010.yaml
  text: So I wrote it in the deed[a], sealed it, called witnesses, and weighed out the silver on the scales.
translation:
  language: ru
  text: И я записал это в купчей[a], запечатал её, пригласил свидетелей и отвесил серебро на весах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в свитке»; или: «в документе». Еврейское סֵפֶר — общее обозначение письменного документа; здесь, вероятно, имеется в виду купчая.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶכְתֹּב
  choice: И я записал
  rationale: Последовательная повествовательная форма Qal wayyiqtol 1-го лица ед. числа от כתב; «И я записал» естественно продолжает рассказ и сохраняет его синтаксическую связь с контекстом.
- source_word: בַּסֵּפֶר
  choice: в купчей
  rationale: סֵפֶר — общее обозначение письменного документа, свитка или книги; в контексте покупки земли «купчая» точно и естественно передаёт юридическую функцию документа, а сноска сохраняет более широкое значение слова.
- source_word: וָאֶחְתֹּם
  choice: запечатал её
  rationale: חתם в юридическом контексте означает скрепить документ печатью. Местоимение «её» естественно восполняет подразумеваемое дополнение и соотносится с «купчей».
- source_word: וָאָעֵד עֵדִים
  choice: пригласил свидетелей
  rationale: Порода Hiphil глагола עוד с עֵדִים здесь означает привлечь свидетелей для удостоверения сделки. «Пригласил свидетелей» понятно современному читателю и не добавляет того, что они уже дали показания.
- source_word: וָאֶשְׁקֹל
  choice: отвесил
  rationale: שקל обозначает взвешивание металла при расчёте. «Отвесил» кратко и естественно выражает измерение причитающегося количества серебра.
- source_word: הַכֶּסֶף
  choice: серебро
  rationale: כֶּסֶף буквально означает «серебро» и может обозначать деньги. Упоминание весов указывает на серебро как взвешиваемое платёжное средство, поэтому сохранена историческая конкретность.
- source_word: בְּמֹאזְנָיִם
  choice: на весах
  rationale: מֹאזְנַיִם — весы с чашами; «на весах» является естественным современным русским выражением и сохраняет материальный образ расчёта.
