lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: И я повелел
  rationale: Глагол צוה означает «повелевать», «приказывать», а также «давать наставление». «Повелел» передаёт торжественный и обязательный характер публичного распоряжения; союз ו и форма глагола выражены прошедшим повествовательным оборотом «И я повелел».
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель прямого дополнения; отдельного соответствия в русском языке не требует.
- source_word: בָּרוּךְ
  choice: Варуху
  rationale: Имя передано в принятой русской библейской форме «Варух» и поставлено в дательном падеже после глагола «повелел».
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Буквально «перед их глазами». Русский оборот «у них на глазах» естественно сохраняет наглядность еврейской идиомы и подчёркивает публичность распоряжения перед свидетелями.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Инфинитив вводит последующую прямую речь. «Сказав» близко передаёт еврейскую конструкцию и естественно предваряет двоеточие.
