  text: הִנֵּה֙ אֲנִ֣י יְהוָ֔ה אֱלֹהֵ֖י כָּל בָּשָׂ֑ר הֲֽ/מִמֶּ֔/נִּי יִפָּלֵ֖א כָּל דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/027.yaml
  text: Behold[a], I am Yahweh, the God of all flesh. Is anything too difficult for me?
translation:
  language: ru
  text: Вот, Я — Яхве, Бог всякой плоти. Есть ли что-нибудь для Меня невозможное?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «будет ли для Меня что-либо слишком дивным?» Еврейский глагол может обозначать нечто необычайное, дивное или превосходящее чьи-либо возможности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественный для современного литературного русского торжественный указатель, привлекающий внимание к Божьему самообъявлению.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Именная конструкция передана с тире, естественно выражающим самоидентификацию в русском языке; личное имя Бога сохранено.
- source_word: אֱלֹהֵי כָּל בָּשָׂר
  choice: Бог всякой плоти
  rationale: Близко передаёт еврейскую конструкцию и сохраняет её широкую, намеренно не суженную отсылку ко всему смертному творению, прежде всего к людям.
- source_word: הֲמִמֶּנִּי יִפָּלֵא כָּל דָּבָר
  choice: Есть ли что-нибудь для Меня невозможное?
  rationale: 'Риторический вопрос естественно звучит по-русски и передаёт контекстуальный смысл Niphal פלא: нечто находящееся за пределами чьей-либо силы. Оттенок необычайного или дивного сохранён в примечании.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо содержит тетраграмматон; транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Объём выражения כָּל בָּשָׂר
  choice: всякой плоти
  alternative: всего человечества; всех живых существ
  rationale: Сохранён широкий еврейский образ без молчаливого сужения только до людей или расширяющего истолкования как всех живых существ.
- issue: Смысл יִפָּלֵא в риторическом вопросе
  choice: невозможное
  alternative: слишком трудное; слишком дивное
  rationale: В данном контексте вопрос утверждает безграничность Божьей силы. Примечание сохраняет присущую глаголу смысловую напряжённость между необычайностью и превышением чьих-либо возможностей.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. «Вот» и «всякой плоти» сохраняют возвышенность и образность оригинала; вопрос сформулирован естественно для русского читателя.
