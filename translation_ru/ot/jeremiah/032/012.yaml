base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/012.yaml
  text: Then I gave the deed of purchase to Baruch son of Neriah[a], son of Mahseiah, in the sight of Hanamel my uncle, and in the sight of the witnesses who had written in the deed of purchase[e][d][c][b], in the sight of all the Judeans who were sitting in the court of the guard.
translation:
  language: ru
  text: И я отдал купчую грамоту Варуху, сыну Нирии, сыну Махсеии, в присутствии[a] Ханамела, моего дяди[b], в присутствии свидетелей, писавших в купчей грамоте[c], и в присутствии всех иудеев, сидевших во дворе стражи[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на глазах у»; также возможно: «перед». Эта формула в стихе повторяется трижды.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь сказано «мой дядя», хотя в других стихах этой главы Ханамел назван сыном дяди Иеремии, то есть его двоюродным братом.
    reason: cross_reference
  - marker: c
    text: 'Буквально: «свидетелей, пишущих в купчей грамоте». Возможно, имеются в виду свидетели, поставившие на ней свои подписи.'
    reason: lexical_alternative
  - marker: d
    text: 'Также возможно: «во дворе караула» или «во дворе темницы»; речь идёт о месте, где Иеремия находился под стражей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: И я отдал
  rationale: Форма wayyiqtol продолжает последовательное повествование; союз «и» сохраняет связь с предыдущими действиями, а прошедшее время естественно для русского рассказа.
- source_word: סֵפֶר הַמִּקְנָה
  choice: купчая грамота
  rationale: В данном юридическом контексте это письменный документ, удостоверяющий приобретение земли; традиционное русское выражение точно и понятно передаёт функцию документа.
- source_word: בָּרוּךְ בֶּן נֵרִיָּה בֶּן מַחְסֵיָה
  choice: Варух, сын Нирии, сын Махсеии
  rationale: Сохранена двойная родословная конструкция еврейского текста; имена переданы в привычной русской библейской форме.
- source_word: לְעֵינֵי
  choice: в присутствии
  rationale: Буквально выражение связано с «глазами», но в юридической формуле означает открытое совершение действия перед свидетелями. Повтор фразы сохранён во всех трёх случаях.
- source_word: חֲנַמְאֵל דֹּדִי
  choice: Ханамела, моего дяди
  rationale: דּוֹד обычно обозначает дядю. Непосредственная формулировка стиха сохранена, а её напряжение с указанием родства в других стихах разъяснено в сноске.
- source_word: הָעֵדִים הַכֹּתְבִים בְּסֵפֶר הַמִּקְנָה
  choice: свидетелей, внёсших записи в купчую грамоту
  rationale: Передаёт активное значение причастия «пишущие» и юридический контекст, не уточняя сверх текста, шла ли речь именно о подписях.
- source_word: כָּל הַיְּהוּדִים
  choice: всех иудеев
  rationale: «Иудеи» естественно обозначает здесь жителей и представителей Иудеи в исторической обстановке книги.
- source_word: הַיֹּשְׁבִים
  choice: сидевших
  rationale: Прямое значение причастия уместно для собравшихся во дворе людей и не требует более общего «находившихся».
- source_word: חֲצַר הַמַּטָּרָה
  choice: двор стражи
  rationale: חָצֵר означает двор, а מַטָּרָה здесь связано с местом содержания под стражей; формулировка сохраняет краткость и конкретность оригинала.
theological_decisions:
- issue: Степень родства Ханамела с Иеремией
  choice: Сохранить непосредственное «мой дядя» в основном тексте
  alternative: Передать «мой родственник» или согласовать с другими стихами как «мой двоюродный брат»
  rationale: 'Нельзя молча устранять внутреннее напряжение: в данном стихе стоит דֹּדִי («мой дядя»), тогда как в других местах главы Ханамел назван сыном дяди Иеремии. Основной текст следует локальной формулировке, а сноска сообщает читателю контекст.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Юридическая формула и трёхкратный повтор «в присутствии» сохранены; синтаксис сделан ясным для обычного читателя без устранения неоднозначностей исходного текста.
