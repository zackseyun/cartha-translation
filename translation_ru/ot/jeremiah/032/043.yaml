  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: будущее возобновление приобретения полей, указание на эту землю, оценку её как опустошённой и лишённой людей и скота, а также передачу во власть халдеев. «Будут покупать поля» естественно передаёт пассивную форму נִקְנָה и собирательное единственное число הַשָּׂדֶה, не внося невыраженное «снова».'
  naturalness: Перевод звучит естественно на современном литературном русском. Перестановка с вынесением обстоятельства и цитаты перед главным сообщением допустима и выразительно сохраняет контраст между настоящим разорением и будущими сделками. Формулы «ни людей, ни скота» и «отдана в руки халдеев» идиоматичны и соответствуют умеренно библейскому регистру.
  terminology: «Земля», «поля», «скот» и «халдеи» выбраны удачно. «Халдеи» сохраняет обозначение исходного текста; сноска корректно поясняет историческую соотнесённость с вавилонянами. «Людей» в формуле отсутствия верно передаёт обобщённое אָדָם без искусственного буквального калькирования.
