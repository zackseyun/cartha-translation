id: JER.32.43
reference: Jeremiah 32:43
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/נִקְנָ֥ה הַ/שָּׂדֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים שְׁמָמָ֥ה הִיא֙ מֵ/אֵ֤ין אָדָם֙ וּ/בְהֵמָ֔ה נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/043.yaml
  text: Fields will be bought in this land of which you say[a], ‘It is a desolation, without man or beast[b]; it has been given into the hand of the Chaldeans.’
translation:
  language: ru
  text: 'На этой земле, о которой вы говорите: «Она опустошена; нет в ней ни людей, ни скота[a]; она отдана в руки халдеев[b]», — будут покупать поля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «без человека и скота».'
    reason: lexical_alternative
  - marker: b
    text: То есть вавилонян.
    reason: historical_clarification
lexical_decisions:
- source_word: וְנִקְנָה הַשָּׂדֶה
  choice: будут покупать поля
  rationale: Форма נִקְנָה пассивна, а единственное число הַשָּׂדֶה может иметь собирательный смысл. Неопределённо-личная конструкция естественно передаёт по-русски возобновление земельных сделок, не добавляя отсутствующего в еврейском тексте слова «снова».
- source_word: בָּאָרֶץ הַזֹּאת
  choice: на этой земле
  rationale: «Земля» сохраняет территориальный и библейский оттенок; предлог «на» в данном контексте естественнее для русского языка.
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: о которой вы говорите
  rationale: Точно и естественно вводит данную народом оценку земли.
- source_word: שְׁמָמָה הִיא
  choice: она опустошена
  rationale: Передаёт состояние разорённой, обезлюдевшей земли современным литературным русским языком, хотя еврейское שְׁמָמָה формально является существительным.
- source_word: מֵאֵין אָדָם וּבְהֵמָה
  choice: нет в ней ни людей, ни скота
  rationale: Передаёт отсутствие человеческих жителей и домашних животных естественной русской формулой; «скот» здесь точнее контекстуального смысла, чем общее «животные».
- source_word: נִתְּנָה בְּיַד
  choice: она отдана в руки
  rationale: Сохраняет прозрачный еврейский образ передачи во власть противника и выражает сохраняющийся результат совершившегося действия.
- source_word: הַכַּשְׂדִּים
  choice: халдеев
  rationale: Сохраняет конкретное историко-этническое обозначение исходного текста; в данном контексте речь идёт о вавилонянах.
theological_decisions:
- issue: Передача אָדָם в формуле отсутствия жителей
  choice: людей
  alternative: человека
  rationale: Здесь אָדָם обозначает людей вообще, а не мужчину как представителя пола. Русское «ни людей, ни скота» ясно и идиоматично выражает всеобщую безлюдность, не меняя антропологического смысла текста.
- issue: Подразумеваемое восстановление земельных сделок
  choice: не добавлять «снова»
  alternative: «снова будут покупать поля»
  rationale: Контекст главы подразумевает восстановление, однако отдельного слова «снова» в данном стихе нет; перевод оставляет этот вывод контексту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок частей предложения перестроен ради естественности русского синтаксиса; смысловая напряжённость между нынешним разорением и будущими покупками земли сохранена.
