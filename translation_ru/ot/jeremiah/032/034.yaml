lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Они поставили
  rationale: Глагол שׂים обозначает конкретное действие помещения или установления чего-либо; «поставили» естественно передаёт завершённое действие в повествовании.
- source_word: שִׁקּוּצֵיהֶם
  choice: свои мерзости
  rationale: שִׁקּוּץ обозначает нечто отвратительное в религиозно-нравственном смысле, нередко связанное с идолопоклонством. «Мерзости» сохраняет широту значения и не сужает его до одних только идолов.
- source_word: בַּבַּיִת
  choice: в доме
  rationale: Буквальное значение בַּיִת — «дом»; здесь по контексту имеется в виду храм. Основной текст сохраняет еврейское словоупотребление, а пояснение дано в сноске.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: который назван Моим именем
  rationale: Эта формула выражает принадлежность Богу и посвящённость Ему. Перевод сохраняет образ исходного текста и остаётся понятным по-русски.
- source_word: לְטַמְּאוֹ
  choice: чтобы осквернить его
  rationale: Инфинитив может выражать цель или результат; «чтобы осквернить» естественно передаёт намерение либо следствие и сохраняет культовую и нравственную серьёзность טמא.
theological_decisions:
- issue: Перевод בַּבַּיִת как «дом» или как «храм»
  choice: дом
  alternative: храм
  rationale: Слово «дом» формально соответствует еврейскому тексту и сохраняет библейское обозначение святилища; сноска проясняет, что речь идёт о храме, не подменяя исходную формулировку толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены конкретность глагола «поставили», традиционно понятное «мерзости» и библейская формула «назван Моим именем»; прописная буква в «Моим» обозначает речь Бога.
