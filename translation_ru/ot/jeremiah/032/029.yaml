  text: וּ/בָ֣אוּ הַ/כַּשְׂדִּ֗ים הַ/נִּלְחָמִים֙ עַל הָ/עִ֣יר הַ/זֹּ֔את וְ/הִצִּ֜יתוּ אֶת הָ/עִ֥יר הַ/זֹּ֛את בָּ/אֵ֖שׁ וּ/שְׂרָפ֑וּ/הָ וְ/אֵ֣ת הַ/בָּתִּ֡ים אֲשֶׁר֩ קִטְּר֨וּ עַל גַּגּֽוֹתֵי/הֶ֜ם לַ/בַּ֗עַל וְ/הִסִּ֤כוּ נְסָכִים֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֖עַן הַכְעִסֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/029.yaml
  text: And the Chaldeans who are fighting against this city will come and set this city on fire and burn it[a], along with the houses on whose rooftops they burned incense to Baal and poured out drink offerings to other gods, to provoke me to anger.
translation:
  language: ru
  text: И придут халдеи, сражающиеся против этого города, подожгут его и сожгут вместе с домами, на крышах которых воскуряли благовония Ваалу и возливали возлияния другим богам, чтобы вызвать Мой гнев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вавилоняне». В еврейском тексте — «халдеи»; этим словом нередко обозначаются войска Нововавилонского царства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכַּשְׂדִּים
  choice: халдеи
  rationale: Прямое соответствие еврейскому этнониму; в данном контексте так названы войска Нововавилонского царства. Контекстуальный вариант указан в сноске.
- source_word: הַנִּלְחָמִים עַל
  choice: сражающиеся против
  rationale: Причастная форма передаёт продолжающееся военное действие, а предлог עַל — его направленность против города.
- source_word: וְהִצִּיתוּ ... בָּאֵשׁ וּשְׂרָפוּהָ
  choice: подожгут его и сожгут
  rationale: Естественная русская передача последовательных глаголов «поджечь огнём» и «сжечь»; местоимение относится к слову «город».
- source_word: וְאֵת הַבָּתִּים
  choice: вместе с домами
  rationale: Второй прямой объект уточняет, что огонь уничтожит не только город в целом, но и дома, связанные с идолопоклонством.
- source_word: אֲשֶׁר קִטְּרוּ עַל גַּגּוֹתֵיהֶם
  choice: на крышах которых воскуряли благовония
  rationale: Передаёт относительное придаточное и культовое значение קטר; «воскуряли благовония» звучит понятно и сохраняет ритуальный оттенок.
- source_word: לַבַּעַל
  choice: Ваалу
  rationale: Дательный падеж естественно обозначает божество, которому совершали воскурение.
- source_word: וְהִסִּכוּ נְסָכִים
  choice: возливали возлияния
  rationale: Сохраняет культовый термин и внутреннюю фигуру еврейского выражения; сочетание традиционно и понятно в библейском регистре.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямая передача אַחֵרִים без интерпретирующего уточнения «чужим» или «иноземным».
- source_word: לְמַעַן הַכְעִסֵנִי
  choice: чтобы вызвать Мой гнев
  rationale: 'Передаёт целевое или результативное значение לְמַעַן и каузативную силу глагола: действия людей вызывают гнев говорящего Бога.'
theological_decisions:
- issue: Передача реакции Бога на идолопоклонство
  choice: чтобы вызвать Мой гнев
  alternative: чтобы разгневать Меня
  rationale: Формулировка сохраняет личный и судебный характер Божьего гнева, прямо выраженный еврейским текстом, не смягчая и не усиливая его.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет поступательное движение еврейского предложения. Прописная буква в «Мой» указывает на речь Бога. Маркер сноски поставлен в основном тексте.
