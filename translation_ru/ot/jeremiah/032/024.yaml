source:
  edition: WLC
  text: הִנֵּ֣ה הַ/סֹּלְל֗וֹת בָּ֣אוּ הָ/עִיר֮ לְ/לָכְדָ/הּ֒ וְ/הָ/עִ֣יר נִתְּנָ֗ה בְּ/יַ֤ד הַ/כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים עָלֶ֔י/הָ מִ/פְּנֵ֛י הַ/חֶ֥רֶב וְ/הָ/רָעָ֖ב וְ/הַ/דָּ֑בֶר וַ/אֲשֶׁ֥ר דִּבַּ֛רְתָּ הָיָ֖ה וְ/הִנְּ/ךָ֥ רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/024.yaml
  text: Look[a], the siege ramps have come up against the city to capture it, and the city has been given into the hand of the Chaldeans who are fighting against it, because of the sword and the famine and the plague. What you spoke has happened, and look[c][b], you see it.
translation:
  language: ru
  text: Вот, осадные насыпи[a] уже подступили к городу, чтобы взять его, и город отдан в руки халдеев[b], которые сражаются против него, — из-за меча, голода и мора[c]. То, что Ты сказал, исполнилось, и вот, Ты видишь это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осадные сооружения»; буквально речь идёт о земляных насыпях, возводимых при осаде для приступа к городу.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть вавилонян: в еврейском тексте — «халдеев», народа, связанного с Нововавилонским царством.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «эпидемии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: вот
  rationale: Указательная частица привлекает внимание и придаёт речи живую непосредственность; «вот» естественно и уместно в современном литературном русском.
- source_word: הַסֹּלְלוֹת
  choice: осадные насыпи
  rationale: В контексте осады слово обозначает земляные сооружения, возводимые для приступа к городу; «осадные насыпи» конкретно и понятно передаёт значение.
- source_word: בָּאוּ ... הָעִיר
  choice: уже подступили к городу
  rationale: Глагольная конструкция описывает приближение осадных сооружений к городским стенам; «подступили» естественно выражает военный контекст, а «уже» передаёт результативность перфекта в данной ситуации.
- source_word: לְלָכְדָהּ
  choice: чтобы взять его
  rationale: לכד обычно означает захват города. В русском «взять город» — точное и устойчивое военное выражение.
- source_word: נִתְּנָה בְּיַד
  choice: отдан в руки
  rationale: Сохранён прозрачный древнееврейский образ передачи во власть противника; русская формула «отдан в руки» понятна и стилистически естественна.
- source_word: הַכַּשְׂדִּים
  choice: халдеи
  rationale: Передан непосредственно употреблённый в еврейском тексте этноним; исторически здесь имеются в виду силы Нововавилонского царства.
- source_word: הַנִּלְחָמִים עָלֶיהָ
  choice: которые сражаются против него
  rationale: Причастная форма обозначает продолжающееся в момент речи военное действие; перевод сохраняет как процесс, так и направленность против города.
- source_word: מִפְּנֵי
  choice: из-за
  rationale: 'Предлог вводит причины или обстоятельства, ведущие к падению города: меч, голод и мор. «Из-за» ясно передаёт причинное значение.'
- source_word: הַחֶרֶב וְהָרָעָב וְהַדָּבֶר
  choice: меч, голод и мор
  rationale: Сохранена традиционная трёхчастная формула бедствий. «Мор» в библейском контексте кратко и ёмко обозначает губительную эпидемию, оставаясь понятным современному читателю.
- source_word: וַאֲשֶׁר דִּבַּרְתָּ הָיָה
  choice: То, что Ты сказал, исполнилось
  rationale: Фраза указывает на осуществление ранее произнесённого Божьего слова. «Исполнилось» естественно сохраняет мотив исполнения предсказанного.
- source_word: וְהִנְּךָ רֹאֶה
  choice: и вот, Ты видишь это
  rationale: Перевод сохраняет повторную указательную частицу и подчёркивает непосредственное созерцание Богом совершившегося.
theological_decisions:
- issue: Формула исполнения Божьего слова
  choice: То, что Ты сказал, исполнилось
  alternative: То, что Ты говорил, произошло
  rationale: Выбранная формулировка передаёт осуществление прежде сказанного Богом, не добавляя догматического толкования и не устраняя напряжения между Божьим предведением, судом и историческими событиями.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены повтор «вот», образ «отдан в руки» и этноним «халдеи»; военная лексика сделана понятной без архаизации. Местоимение «Ты» пишется с прописной буквы как обращение к Богу в принятой русской издательской традиции.
