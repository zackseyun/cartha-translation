source:
  edition: WLC
  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה אֶֽל יִרְמְיָ֨הוּ֙ מֵ/אֵ֣ת יְהוָ֔ה ב/שנת הָ/עֲשִׂרִ֔ית לְ/צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הִ֧יא הַ/שָּׁנָ֛ה שְׁמֹנֶֽה עֶשְׂרֵ֥ה שָׁנָ֖ה לִ/נְבֽוּכַדְרֶאצַּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/001.yaml
  text: The word that came to Jeremiah from Yahweh in the tenth year of Zedekiah king of Judah[a], which was the eighteenth year of Nebuchadnezzar.
translation:
  language: ru
  text: Слово, которое пришло к Иеремии от Яхве[a] в десятый год правления Седекии, царя Иудеи, — это был восемнадцатый год правления Навуходоносора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ); традиционный перевод — «Господь».
    reason: Указывает исходную форму божественного имени и широко распространённый вариант его передачи.
lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: В пророческих вводных формулах דָּבָר обозначает божественное возвещение; «Слово» сохраняет устойчивую библейскую формулу, не превращая её в пересказ.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: которое пришло к
  rationale: Еврейская формула буквально говорит о слове, «бывшем к» пророку; по-русски естественный и традиционно понятный эквивалент — «пришло к».
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: מֵאֵת указывает на источник сообщения, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: בשנת הָעֲשִׂרִית לְצִדְקִיָּהוּ
  choice: в десятый год правления Седекии
  rationale: В формуле датировки לְ указывает на отсчёт по царствованию Седекии; слово «правления» добавлено для ясного и естественного русского выражения подразумеваемого смысла.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Титул находится в приложении к имени Седекии и прямо передан обычной русской конструкцией.
- source_word: הִיא הַשָּׁנָה שְׁמֹנֶה עֶשְׂרֵה שָׁנָה לִנְבוּכַדְרֶאצַּר
  choice: это был восемнадцатый год правления Навуходоносора
  rationale: Фраза соотносит десятый год Седекии с восемнадцатым годом Навуходоносора. Повтор слова «год» в еврейской числовой формуле по-русски не воспроизводится, а подразумеваемое царское правление выражено явно.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит собственное имя יהוה, поэтому в основном тексте сохранено личное имя «Яхве». Традиционная замена «Господь» отмечена в сноске, без смешения имени с титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой формулы. Синтаксис слегка упрощён ради ясности, но связь двух систем царской датировки сохранена; добавление «правления» выражает подразумеваемый смысл формулы, не вводя новой исторической информации.
