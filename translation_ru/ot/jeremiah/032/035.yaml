  text: וַ/יִּבְנוּ֩ אֶת בָּמ֨וֹת הַ/בַּ֜עַל אֲשֶׁ֣ר בְּ/גֵ֣יא בֶן הִנֹּ֗ם לְ֠/הַעֲבִיר אֶת בְּנֵי/הֶ֣ם וְ/אֶת בְּנוֹתֵי/הֶם֮ לַ/מֹּלֶךְ֒ אֲשֶׁ֣ר לֹֽא צִוִּיתִ֗י/ם וְ/לֹ֤א עָֽלְתָה֙ עַל לִבִּ֔/י לַ/עֲשׂ֖וֹת הַ/תּוֹעֵבָ֣ה הַ/זֹּ֑את לְמַ֖עַן החטי אֶת יְהוּדָֽה־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/035.yaml
  text: They built the high places of Baal that are in the Valley of Ben-hinnom[a], to make their sons and their daughters pass through the fire to Molech—something I had not commanded them, nor had it entered my heart that they should do this abomination[c][b], causing Judah to sin.
translation:
  language: ru
  text: Они построили высоты Ваала, которые находятся в долине Бен-Хинном[a], чтобы проводить своих сыновей и дочерей к Молоху[b]. Я не повелевал им этого, и Мне не приходило на сердце, чтобы они совершали эту мерзость[c], чтобы ввести Иудею в грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в долине сына Хиннома».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «проводить своих сыновей и своих дочерей». Это культовое выражение обозначает принесение детей в жертву; в других местах оно расширено словами «через огонь».'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «и не поднималось на Моё сердце»; возможно также: «не возникало в Моих мыслях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּמוֹת הַבַּעַל
  choice: высоты Ваала
  rationale: Сохраняет устойчивое библейское обозначение культовых мест и имя божества; «капища» было бы более интерпретирующим.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: в долине Бен-Хинном
  rationale: Передаёт топоним транслитерацией и не использует анахроничное для данного контекста «геенна».
- source_word: לְהַעֲבִיר אֶת־בְּנֵיהֶם וְאֶת־בְּנוֹתֵיהֶם
  choice: проводить своих сыновей и дочерей
  rationale: Сохраняет еврейскую культовую формулу. Слова «через огонь» в данном стихе в еврейском тексте отсутствуют, поэтому смысл жертвоприношения пояснён в сноске, а не внесён в основной текст.
- source_word: לַמֹּלֶךְ
  choice: к Молоху
  rationale: В данном культовом контексте מֹלֶךְ понято как имя Молоха; предлог передан направительным «к», без устранения оттенка посвящения.
- source_word: וְלֹא עָלְתָה עַל־לִבִּי
  choice: и Мне не приходило на сердце
  rationale: Сохранён яркий антропоморфный образ оригинала, а не заменён отвлечённым выражением «не возникало в мыслях».
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: эту мерзость
  rationale: Передаёт сильную нравственно-культовую оценку תּוֹעֵבָה естественным современным русским словом.
- source_word: לְמַעַן הַחֲטִיא אֶת־יְהוּדָה
  choice: тем самым вводя Иудею в грех
  rationale: Передаёт каузативное значение глагола חטא и допускаемый контекстом оттенок результата, не приписывая народу явно сформулированной цели сделать Иудею грешной.
theological_decisions:
- issue: Характер выражения о детях и Молохе
  choice: Сохранить формулу «проводить своих сыновей и дочерей к Молоху», пояснив её в сноске как указание на детское жертвоприношение.
  alternative: «Проводить своих сыновей и дочерей через огонь к Молоху» или «приносить своих детей в жертву Молоху».
  rationale: Еврейский текст данного стиха не содержит слова «огонь». Основной текст поэтому не расширен, но культовый смысл формулы сообщён читателю в примечании.
- issue: Антропоморфное высказывание Бога
  choice: «Мне не приходило на сердце».
  alternative: «Мне не приходило в голову» или «не возникало в Моём замысле».
  rationale: Буквенный образ оригинала сохранён без догматического объяснения или сглаживания возникающего богословского напряжения.
- issue: Цель или результат в заключительной фразе
  choice: «тем самым вводя Иудею в грех».
  alternative: «чтобы ввести Иудею в грех».
  rationale: לְמַעַן обычно выражает цель, но здесь фраза может характеризовать итог отвратительного поступка. Выбранная формулировка естественна по-русски и не утверждает однозначно, что грех Иудеи был сознательной целью совершающих обряд.
translation_notes:
  register: Современный литературный русский язык с сохранением dignified библейского регистра. Термин «высоты» оставлен как традиционное обозначение культовых мест; редкая формула о проведении детей пояснена сноской. Антропоморфизм оригинала сохранён.
