  text: Then I took the deed of purchase[a], the sealed copy, containing the terms and conditions[b], and the open copy.
translation:
  language: ru
  text: 'Тогда я взял документ о покупке[a]: запечатанный экземпляр с условиями и положениями и незапечатанный экземпляр[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при более буквальном понимании трудной юридической формулы: «запечатанный [экземпляр], предписание и установления». Еврейские термины, вероятно, обозначают условия и правовые положения документа о покупке.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «открытый». То есть незапечатанный, доступный для ознакомления экземпляр, в отличие от запечатанного.'
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Тогда я взял
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт очередность действия.
- source_word: סֵפֶר הַמִּקְנָה
  choice: купчую
  rationale: В контексте сделки с землёй выражение обозначает официальный документ о покупке; «купчая» — точный и понятный русский юридико-исторический термин.
- source_word: הֶחָתוּם
  choice: запечатанный экземпляр
  rationale: Страдательное причастие означает «запечатанный» и противопоставлено הַגָּלוּי; слово «экземпляр» естественно восполняет подразумеваемое обозначение документа.
- source_word: הַמִּצְוָה וְהַחֻקִּים
  choice: условия и положения
  rationale: В данном юридическом контексте сочетание, буквально связанное с предписанием и установлениями, вероятнее всего обозначает договорные условия и правовые положения документа.
- source_word: הַגָּלוּי
  choice: открытый экземпляр
  rationale: Слово означает «открытый, незапечатанный» и образует прямой контраст с запечатанным документом; «открытый экземпляр» сохраняет этот образ без избыточного пояснения в тексте.
