  text: הִנְ/נִ֤י מְקַבְּצָ/ם֙ מִ/כָּל הָ֣/אֲרָצ֔וֹת אֲשֶׁ֨ר הִדַּחְתִּ֥י/ם שָׁ֛ם בְּ/אַפִּ֥/י וּ/בַ/חֲמָתִ֖/י וּ/בְ/קֶ֣צֶף גָּד֑וֹל וַ/הֲשִֽׁבֹתִי/ם֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה וְ/הֹשַׁבְתִּ֖י/ם לָ/בֶֽטַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/037.yaml
  text: Behold[a], I am gathering them from all the lands where I drove them in my anger and in my wrath and in great indignation[b], and I will bring them back to this place and make them dwell in safety.
translation:
  language: ru
  text: Вот, Я собираю их[a] из всех стран, куда изгнал их в гневе Моём, в ярости Моей и в великом негодовании[b]. Я приведу их обратно в это место и поселю их в безопасности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот, Я соберу их». Еврейская конструкция может указывать на близкое или несомненное будущее действие.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь употреблено третье слово, обозначающее гнев; череда близких по смыслу слов усиливает выражение Божьего суда.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי מְקַבְּצָם
  choice: Вот, Я собираю их
  rationale: Конструкция הִנְנִי с причастием придаёт обещанию подчёркнутую непосредственность и может обозначать действие как начинающееся, близкое или несомненное. Настоящее время сохраняет форму оригинала, не исключая будущего исполнения.
- source_word: מִכָּל הָאֲרָצוֹת
  choice: из всех стран
  rationale: Во множественном числе אֲרָצוֹת обозначает страны и земли рассеяния; «страны» естественно звучит по-русски и не создаёт космического смысла.
- source_word: הִדַּחְתִּים
  choice: изгнал их
  rationale: Глагол выражает принудительное удаление; «изгнал» ясно сохраняет суровость действия и Божью субъектность.
- source_word: בְּאַפִּי וּבַחֲמָתִי וּבְקֶצֶף גָּדוֹל
  choice: в гневе Моём, в ярости Моей и в великом негодовании
  rationale: Три различных обозначения гнева переданы тремя русскими словами, чтобы сохранить накопление и усиление, не приписывая каждому слову отдельного технического богословского значения.
- source_word: וַהֲשִׁבֹתִים
  choice: Я возвращу их
  rationale: Каузативная форма שוב в контексте изгнания означает привести обратно; русский переходный глагол «возвращу» передаёт это кратко и естественно.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: на это место
  rationale: Прямо передаёт указание на конкретное место возвращения, не заменяя его более узким толкованием «земля» или «Иерусалим».
- source_word: וְהֹשַׁבְתִּים לָבֶטַח
  choice: поселю их здесь в безопасности
  rationale: Каузатив ישׁב передан глаголом «поселю», а לָבֶטַח — естественным русским выражением «в безопасности». «Здесь» делает связь с «этим местом» прозрачной без изменения смысла.
theological_decisions:
- issue: Видо-временное значение הִנְנִי с причастием
  choice: Вот, Я собираю их
  alternative: Вот, Я соберу их
  rationale: Еврейская конструкция допускает оттенок близкого или несомненного будущего, но грамматически представляет действие как непосредственно совершаемое. Основной текст сохраняет эту напряжённость, а сноска отмечает допустимый будущий перевод.
- issue: Последовательность трёх обозначений Божьего гнева
  choice: гнев / ярость / великое негодование
  alternative: гнев / пыл / великий гнев
  rationale: Различение русских слов сохраняет риторическое нагнетание суда, но не превращает близкие по смыслу еврейские термины в строго разграниченные богословские категории.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Начальное «Вот» сохраняет эмфатическую формулу; заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому регистру. Формулировки ясны для широкого читателя и не вводят конфессионально специфических толкований.
