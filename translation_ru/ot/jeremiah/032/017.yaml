  text: אֲהָהּ֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֣ה אַתָּ֣ה עָשִׂ֗יתָ אֶת הַ/שָּׁמַ֨יִם֙ וְ/אֶת הָ/אָ֔רֶץ בְּ/כֹֽחֲ/ךָ֙ הַ/גָּד֔וֹל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה לֹֽא יִפָּלֵ֥א מִמְּ/ךָ֖ כָּל דָּבָֽר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/017.yaml
  text: Ah, Lord GOD! Look, you yourself made the heavens and the earth by your great power and by your outstretched arm. Nothing is too difficult for you.
translation:
  language: ru
  text: О, Владыка ГОСПОДЬ! Вот, Ты сотворил небо и землю Своей великой силой и простёртой рукой. Для Тебя нет ничего слишком трудного.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲהָהּ
  choice: О
  rationale: Междометие вводит эмоциональное молитвенное обращение; «О» естественно и достойно передаёт его в современном русском.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  rationale: Сочетание сохраняет различие между титулом אֲדֹנָי и именем יהוה; написание «ГОСПОДЬ» следует принятой русской библейской передаче тетраграмматона.
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательно-эмфатическая частица естественно передаётся словом «вот».
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: небо и землю
  rationale: Устойчивая русская формула передаёт меризм, обозначающий весь сотворённый мир.
- source_word: בִזְרֹעֲךָ הַנְּטוּיָה
  choice: простёртой рукой
  rationale: Сохраняется конкретный библейский образ проявленной могущественной силы; «простёртой» соответствует причастию נְטוּיָה.
- source_word: לֹא יִפָּלֵא מִמְּךָ כָּל דָּבָר
  choice: Для Тебя нет ничего невозможного
  rationale: 'Идиоматически передаёт смысл: никакое дело не является для Бога недостижимым или чрезмерно трудным.'
theological_decisions:
- issue: Передача Божьего имени в сочетании אֲדֹנָי יְהוִה
  choice: Владыка ГОСПОДЬ
  alternative: Господь Бог / Владыка Яхве
  rationale: Выбранная форма различает титул и тетраграмматон, не вводя конфессионально спорную вокализацию имени и не смешивая יהוה с אֱלֹהִים.
- issue: Смысл заключительного утверждения
  choice: Для Тебя нет ничего невозможного
  alternative: Ничто не слишком трудно для Тебя / Никакое дело не сокрыто от Тебя
  rationale: В данном контексте творческой силы глагол פלא выражает невозможность или непосильность, а не главным образом сокрытость; перевод сохраняет утверждение о Божьем всемогуществе без дополнительных уточнений.
translation_notes:
  register: Современный литературный русский с возвышенным молитвенным тоном. Синтаксис ясен для широкого читателя; традиционная библейская образность сохранена без архаических форм.
