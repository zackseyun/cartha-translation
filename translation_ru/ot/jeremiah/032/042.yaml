base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/042.yaml
  text: 'For thus says Yahweh: Just as I brought on this people all this great disaster[b][a], so I will bring on them all the good that I am speaking concerning them.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве: «Как Я навёл на этот народ всё это великое бедствие[a], так Я наведу на них всё то добро, о котором Я говорю в отношении них[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё это великое несчастье». Еврейское слово может означать «зло» или «бедствие»; здесь речь идёт о постигшей народ катастрофе как о суде.'
    reason: lexical_alternative
  - marker: b
    text: 'По смыслу также: «которое Я обещаю им». Буквально: «о котором Я говорю относительно них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт пояснительную связь с предшествующим контекстом и сохраняет достоинство пророческой речи.
- source_word: כֹה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Естественная русская форма стандартной пророческой формулы; имя завета передано транслитерацией.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Как ... так
  rationale: Сохраняет явное сопоставление совершившегося суда и обещанного блага.
- source_word: הֵבֵאתִי ... מֵבִיא
  choice: Я навёл ... Я наведу
  rationale: Глагол в каузативной форме выражает действие Бога, направленное на народ; будущая форма естественно передаёт пророческое обещание в данном контексте.
- source_word: כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: всё это великое бедствие
  rationale: רָעָה здесь обозначает постигшую народ катастрофу как суд, а не нравственное зло; «бедствие» точно и естественно в современном русском.
- source_word: כָּל הַטּוֹבָה
  choice: всё то добро
  rationale: Сохраняет широкое значение обещанного благополучия и благ, не сужая его до материального процветания.
- source_word: אֲשֶׁר אָנֹכִי דֹּבֵר עֲלֵיהֶם
  choice: о котором говорю им
  rationale: Передаёт буквальный глагол «говорить» и естественно выражает направленность Божьих слов к народу, не заменяя его более толковательным «обещаю».
theological_decisions:
- issue: Значение רָעָה применительно к Божьему действию
  choice: бедствие
  alternative: зло
  rationale: В контексте суда слово обозначает катастрофическое бедствие. Такой перевод не снимает утверждения о Божьей действенности, но не приписывает Ему нравственное зло.
- issue: Степень интерпретации דֹּבֵר
  choice: говорю
  alternative: обещаю
  rationale: Сохранён явный смысл еврейского глагола; обещательный характер речи понятен из контекста, но не внесён непосредственно в перевод.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Синтаксический параллелизм оригинала сохранён; архаизмы сведены к уместному связующему «ибо».
