  yaml_path: translation/ot/jeremiah/032/038.yaml
  text: And they will be my people[a], and I will be their God.
translation:
  language: ru
  text: И они будут Моим народом[a], а Я буду их Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они будут для Меня народом, а Я буду для них Богом» — древнееврейская формула завета, выражающая взаимную принадлежность и отношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: И они будут
  rationale: Форма Qal perfect с союзом в контексте последовательности пророческих обетований имеет будущее значение; перевод сохраняет простой смысл глагола היה.
- source_word: לִי לְעָם
  choice: Моим народом
  rationale: Буквально «для Меня народом»; в древнееврейской формуле завета сочетание היה с ל естественно передаётся по-русски формой принадлежности и взаимных отношений.
- source_word: וַאֲנִי
  choice: а Я
  rationale: Русское «а» естественно связывает две взаимно соответствующие части формулы, не внося противопоставления по существу.
- source_word: אֶהְיֶה
  choice: буду
  rationale: Имперфект 1-го лица единственного числа выражает будущее обязательство в рамках заветного обетования и сохраняет параллель с первой частью.
- source_word: לָהֶם לֵאלֹהִים
  choice: их Богом
  rationale: Буквально «для них Богом»; творительный падеж с притяжательным местоимением естественно передаёт по-русски определённые отношения завета, а не значение «одним из богов».
theological_decisions:
- issue: Передача формулы завета
  choice: И они будут Моим народом, а Я буду их Богом.
  alternative: И будут они для Меня народом, а Я буду для них Богом.
  rationale: Выбранный вариант ясно и естественно передаёт взаимную принадлежность и отношения завета, сохраняя параллелизм исходного текста. Более буквальное построение отмечено в сноске, чтобы не скрывать форму древнееврейского выражения.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная формулировка. Прописные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому стилю.
