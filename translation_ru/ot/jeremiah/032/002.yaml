source:
  edition: WLC
  text: וְ/אָ֗ז חֵ֚יל מֶ֣לֶךְ בָּבֶ֔ל צָרִ֖ים עַל יְרוּשָׁלִָ֑ם וְ/יִרְמְיָ֣הוּ הַ/נָּבִ֗יא הָיָ֤ה כָלוּא֙ בַּ/חֲצַ֣ר הַ/מַּטָּרָ֔ה אֲשֶׁ֖ר בֵּֽית מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/002.yaml
  text: At that time the army of the king of Babylon was besieging Jerusalem[a], and Jeremiah the prophet was confined in the court of the guard[b], which was in the house of the king of Judah.
translation:
  language: ru
  text: В то время войско царя Вавилона осаждало Иерусалим[a], а пророк Иеремия находился под стражей во дворе стражи[b], расположенном при дворце царя Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «держало Иерусалим в осаде».'
    reason: lexical_alternative
  - marker: b
    text: «Двор стражи» — охраняемый двор в составе дворцового комплекса, где содержали заключённых.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אָז
  choice: В то время
  rationale: Естественно передаёт временной указатель, вводящий историческую обстановку.
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: войско царя Вавилона
  rationale: «Войско» точно передаёт собирательное обозначение военной силы и сохраняет царский титул.
- source_word: צָרִים עַל
  choice: осаждало
  rationale: Причастная форма описывает продолжавшуюся осаду; согласование в единственном числе соответствует собирательному существительному «войско».
- source_word: וְ/יִרְמְיָהוּ הַ/נָּבִיא
  choice: а пророк Иеремия
  rationale: Союз «а» естественно сопоставляет одновременно происходившие обстоятельства, не меняя смысл простой еврейской координации; титул сохранён.
- source_word: הָיָה כָלוּא
  choice: находился под стражей
  rationale: Передаёт состояние несвободы, не создавая излишне конкретного образа тюремной камеры.
- source_word: בַּ/חֲצַר הַ/מַּטָּרָה
  choice: во дворе стражи
  rationale: Сохраняет традиционно узнаваемое наименование охраняемого двора и не отождествляет его безоговорочно с обычной тюрьмой.
- source_word: אֲשֶׁר בֵּית מֶלֶךְ יְהוּדָה
  choice: расположенном при дворце царя Иудеи
  rationale: Краткая еврейская конструкция по контексту локализует двор в царском дворцовом комплексе; «дворец» передаёт значение בֵּית в данном контексте естественнее буквального «дом».
