source:
  edition: WLC
  text: וַ/תִּתֵּ֤ן לָ/הֶם֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את אֲשֶׁר נִשְׁבַּ֥עְתָּ לַ/אֲבוֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/022.yaml
  text: And you gave them this land[a], which you swore to their fathers to give them, a land flowing with milk and honey.
translation:
  language: ru
  text: И Ты дал им эту землю, которую поклялся дать их отцам[a], — землю, где течёт молоко и мёд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их предкам». В еврейском тексте буквально: «их отцам»; имеются в виду праотцы Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: И Ты дал
  rationale: Обычное значение נתן — «дать». Союз «и» сохраняет повествовательную связь, а форма второго лица — обращение к Богу в молитве.
- source_word: הָאָרֶץ הַזֹּאת
  choice: эту землю
  rationale: В контексте заветного обетования אֶרֶץ обозначает конкретную обещанную землю.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ
  choice: которую поклялся
  rationale: Глагол נשבע прямо указывает на клятву; «поклялся» сохраняет силу заветного обязательства, не сводя его к простому обещанию.
- source_word: לַאֲבוֹתָם
  choice: их отцам
  rationale: Буквально «их отцам»; здесь имеются в виду праотцы Израиля. Основной текст сохраняет мужское родственное обозначение оригинала, а возможное более широкое понимание поясняется в сноске.
- source_word: לָתֵת לָהֶם
  choice: дать их отцам
  rationale: 'В русском языке местоименное дополнение естественно раскрыто через «их отцам», поскольку буквальное «дать им» рядом с первым «им» могло бы создать неясность. При этом сохранён повтор корня נתן: «дал… дать».'
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: землю, где течёт молоко и мёд
  rationale: Естественная современная передача устойчивого древнееврейского образа плодородия и изобилия; образ «течения» сохранён.
theological_decisions:
- issue: Передача патриархальной лексики в формуле обетования
  choice: их отцам
  alternative: их предкам / их праотцам
  rationale: Слово אבות буквально означает «отцы» и в данном контексте указывает на праотцев Израиля. Буквальная форма сохранена в тексте, а объём значения пояснён сноской, без устранения патриархального оттенка оригинала.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Заглавное «Ты» маркирует почтительное обращение к Богу. Тире помогает естественно оформить пояснительное приложение о земле.
