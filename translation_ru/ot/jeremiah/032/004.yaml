base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/004.yaml
  text: And Zedekiah king of Judah will not escape from the hand of the Chaldeans[a], for he will surely be given into the hand of the king of Babylon, and he will speak mouth to mouth with him[b], and his eyes will see his eyes.
translation:
  language: ru
  text: И Седекия, царь Иудеи, не спасётся от руки халдеев, ибо непременно будет отдан в руку царя Вавилона; он будет говорить с ним лицом к лицу[a] и увидит его своими глазами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его уста будут говорить с его устами», то есть при непосредственной личной встрече.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его глаза увидят его глаза», то есть он увидит царя Вавилона прямо перед собой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלֵט
  choice: не спасётся
  rationale: Нифаль глагола מלט здесь означает избежать захвата, спастись; это естественная русская формулировка в контексте военного поражения и плена.
- source_word: מִיַּד הַכַּשְׂדִּים
  choice: от руки халдеев
  rationale: Сохранён прозрачный для русского библейский образ «руки» как власти и контроля; этноним «халдеи» точно передаёт еврейское обозначение.
- source_word: הִנָּתֹן יִנָּתֵן
  choice: непременно будет отдан
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает уверенность предсказания; «непременно» передаёт эту эмфазу, а страдательная конструкция сохранена.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: в руку царя Вавилона
  rationale: Сохранены образ руки и титул מֶלֶךְ בָּבֶל; выражение означает передачу под власть вавилонского царя.
- source_word: וְדִבֶּר פִּיו עִם פִּיו
  choice: он будет говорить с ним лицом к лицу
  rationale: 'Буквально: «его уста будут говорить с его устами». Русское «лицом к лицу» естественно выражает непосредственную личную встречу, не устраняя конкретный смысл образа; буквальная форма отмечена в сноске.'
- source_word: וְעֵינָיו אֶת־עֵינוֹ תִּרְאֶינָה
  choice: увидит его своими глазами
  rationale: 'Буквально: «его глаза увидят его глаза». Выбранная русская формулировка сохраняет зрительную конкретность и подчёркивает непосредственность встречи; буквальный взаимный образ дан в сноске.'
- source_word: צִדְקִיָּהוּ
  choice: Седекия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: הַכַּשְׂדִּים
  choice: халдеи
  rationale: Передан конкретный этнополитический термин исходного текста без замены более общим словом «вавилоняне».
