source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַל יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹא יִֽהְיֶה לּ֥/וֹ יוֹשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד וְ/נִבְלָת/וֹ֙ תִּֽהְיֶ֣ה מֻשְׁלֶ֔כֶת לַ/חֹ֥רֶב בַּ/יּ֖וֹם וְ/לַ/קֶּ֥רַח בַּ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/030.yaml
  text: 'Therefore this is what Yahweh says concerning Jehoiakim king of Judah: He will have no one to sit on the throne of David[a], and his dead body will be thrown out to the heat by day and to the frost by night.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве об Иоакиме, царе Иудеи: «Не будет у него никого, кто будет сидеть на престоле Давида, а его труп будет выброшен на дневной зной[a] и ночной мороз».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на дневную сушь». Еврейское слово может означать как зной, так и сухость или засуху.'
    reason: Лексическая многозначность חֹרֶב.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт причинно-следственный переход от предшествующего поступка Иоакима к объявленному суду.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет устойчивую пророческую формулу и передаёт личное имя יהוה как «Яхве».
- source_word: עַל יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: об Иоакиме, царе Иудеи
  rationale: Предлог עַל здесь вводит того, о ком произносится приговор; «об» не усиливает значение до «против».
- source_word: לֹא יִהְיֶה לּוֹ יוֹשֵׁב עַל כִּסֵּא דָוִד
  choice: Не будет у него никого, кто сядет на престол Давида
  rationale: Естественно передаёт еврейскую конструкцию, не добавляя прямо слова «потомок», хотя династический смысл подразумевается контекстом.
- source_word: נִבְלָתוֹ
  choice: его труп
  rationale: Точно и ясно передаёт мёртвое тело и сохраняет оттенок бесчестия, связанный с отсутствием погребения.
- source_word: מֻשְׁלֶכֶת
  choice: будет выброшен
  rationale: Передаёт пассивное действие и унизительное обращение с телом современным, но достойным языком.
- source_word: לַחֹרֶב בַּיּוֹם
  choice: под дневной зной
  rationale: В данном параллелизме חֹרֶב естественно обозначает иссушающий жар; лексическая возможность значения «засуха, сушь» отмечена в сноске.
- source_word: לַקֶּרַח בַּלָּיְלָה
  choice: под ночной мороз
  rationale: קֶרַח обозначает мороз или лёд; «ночной мороз» сохраняет конкретный образ и параллель с дневным зноем.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» прямо сохраняет личное имя, не заменяя его титулом.
- issue: Характер обещанного прекращения династического правления Иоакима
  choice: не будет у него никого, кто сядет на престол Давида
  alternative: ни один его потомок не сядет на престол Давида
  rationale: Исходная фраза буквально говорит об отсутствии у него сидящего на престоле; перевод не вводит существительное «потомок», тем самым сохраняя формальную широту выражения и его династическое напряжение.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной краткости пророческого приговора. Синтаксис сделан понятным для широкого читателя; образ непогребённого тела и параллелизм «дневной зной — ночной мороз» сохранены.
