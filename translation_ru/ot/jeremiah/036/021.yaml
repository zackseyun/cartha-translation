base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/021.yaml
  text: Then the king sent Jehudi to get the scroll[a], and he took it from the chamber of Elishama the scribe[d][c][b]. And Jehudi read it in the hearing of the king and in the hearing of all the officials standing beside the king.
translation:
  language: ru
  text: Тогда царь послал Иегудия принести свиток. Иегудий взял его из комнаты писца Елишамы[a] и прочитал вслух царю и всем сановникам, стоявшим рядом с царём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое «писец», в царском административном контексте также может означать «секретарь».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «стоявшим над царём»; по смыслу — находившимся при нём или рядом с ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычный повествовательный эквивалент формы от שׁלח.
- source_word: יְהוּדִי
  choice: Иегудий
  rationale: Личное имя передано традиционной русской библейской формой.
- source_word: לָקַחַת
  choice: принести
  rationale: После глагола «послал» инфинитив выражает цель; в данном контексте естественно передаёт поручение сходить за свитком и доставить его царю.
- source_word: הַמְּגִלָּה
  choice: свиток
  rationale: מְגִלָּה обозначает свёрнутый письменный документ; «свиток» — ясный современный эквивалент.
- source_word: וַיִּקָּחֶהָ
  choice: взял его
  rationale: Местоимение относится к свитку; русский мужской род согласован с выбранным существительным.
- source_word: מִלִּשְׁכַּת
  choice: из комнаты
  rationale: לִשְׁכָּה — отдельное помещение, здесь, вероятно, служебная комната при царском дворе; нейтральное «комната» не добавляет невыраженной специализации.
- source_word: אֱלִישָׁמָע
  choice: Елишама
  rationale: Личное имя передано транслитерацией, близкой к еврейской форме.
- source_word: הַסֹּפֵר
  choice: писец
  rationale: סֹפֵר может означать писца или царского секретаря; основной текст сохраняет прямой лексический эквивалент, а административный оттенок отмечен в сноске.
- source_word: וַיִּקְרָאֶהָ
  choice: прочитал вслух
  rationale: קרא при письменном объекте означает «читать»; выражение בְּאָזְנֵי ясно показывает, что чтение было вслух.
- source_word: בְּאָזְנֵי
  choice: царю и всем сановникам
  rationale: Буквально «в уши»; русский дательный после «прочитал вслух» естественно передаёт значение «так, чтобы они слышали».
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: В придворном контексте שׂרים — высокопоставленные должностные лица; «сановники» точнее передаёт их ранг, чем общее «чиновники», и не создаёт впечатления, будто речь о царских сыновьях.
- source_word: הָעֹמְדִים מֵעַל הַמֶּלֶךְ
  choice: стоявшим рядом с царём
  rationale: Буквально «стоявшим над/при царе»; контекстуально это придворные, находившиеся возле царя, без смысла превосходства над ним.
