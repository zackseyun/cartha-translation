translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис слегка разгружен делением на два предложения. Формула «прочитал вслух царю» естественно передаёт еврейское «прочитал в уши царя». Все сноски обозначены в основном тексте.
