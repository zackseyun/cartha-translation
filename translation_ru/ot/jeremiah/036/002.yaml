source:
  edition: WLC
  text: קַח לְ/ךָ֮ מְגִלַּת סֵפֶר֒ וְ/כָתַבְתָּ֣ אֵלֶ֗י/הָ אֵ֣ת כָּל הַ/דְּבָרִ֞ים אֲשֶׁר דִּבַּ֧רְתִּי אֵלֶ֛י/ךָ עַל יִשְׂרָאֵ֥ל וְ/עַל יְהוּדָ֖ה וְ/עַל כָּל הַ/גּוֹיִ֑ם מִ/יּ֞וֹם דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ מִ/ימֵ֣י יֹאשִׁיָּ֔הוּ וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/002.yaml
  text: Take for yourself a scroll[a], and write on it all the words that I have spoken to you concerning Israel and concerning Judah and concerning all the nations, from the day I spoke to you, from the days of Josiah until this day.
translation:
  language: ru
  text: Возьми себе свиток и запиши на нём все слова, которые Я говорил тебе об Израиле, об Иудее и обо всех народах, начиная с того дня, когда Я заговорил с тобой, — со времён Иосии и до сегодняшнего дня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против Израиля, против Иудеи и против всех народов». Еврейский предлог в пророческой речи допускает оба значения.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח לְךָ
  choice: Возьми себе
  rationale: Императив с дательным לְךָ передаёт личную вовлечённость адресата; русское «возьми себе» сохраняет этот оттенок естественно.
- source_word: מְגִלַּת סֵפֶר
  choice: свиток
  rationale: Сочетание обозначает письменный свиток; буквальное «свиток книги» в современном русском неестественно.
- source_word: וְכָתַבְתָּ אֵלֶיהָ
  choice: и запиши в нём
  rationale: Перфект с союзом после императива продолжает повеление. В русском о тексте на свитке естественно сказать «запиши в нём».
- source_word: אֵת כָּל הַדְּבָרִים
  choice: все слова
  rationale: В контексте записи пророческого откровения דְּבָרִים прежде всего означает произнесённые слова, а не просто события или дела.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֵלֶיךָ
  choice: которые Я говорил тебе
  rationale: Несовершенный вид естественно охватывает неоднократную речь Бога на протяжении указанного периода.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה וְעַל כָּל הַגּוֹיִם
  choice: об Израиле, об Иудее и обо всех народах
  rationale: עַל при глаголе речи допускает значения «о» и «против». Нейтральное «об» не сужает совокупность пророчеств до одних возвещений суда; альтернативный смысл отмечен в сноске.
- source_word: מִיּוֹם דִּבַּרְתִּי אֵלֶיךָ
  choice: начиная с того дня, когда Я заговорил с тобой
  rationale: מִן задаёт исходную точку периода; «заговорил» ясно обозначает начало Божьего обращения к пророку.
- source_word: מִימֵי יֹאשִׁיָּהוּ וְעַד הַיּוֹם הַזֶּה
  choice: со времён Иосии и до сего дня
  rationale: Передаёт историческую начальную точку и конечную границу периода, сохраняя достоинство библейского регистра.
theological_decisions:
- issue: Значение עַל в перечислении тех, о ком или против кого были произнесены пророчества
  choice: об Израиле, об Иудее и обо всех народах
  alternative: против Израиля, против Иудеи и против всех народов
  rationale: Стих обобщает все Божьи слова, данные Иеремии, а не только пророчества суда. Основной текст сохраняет более широкое значение, а реальная возможность направленного «против» вынесена в сноску.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавная «Я» обозначает говорящего Бога. Повтор предлога «об» сохраняет ритм еврейского перечисления; «до сего дня» оставлено как понятная традиционная формула.
