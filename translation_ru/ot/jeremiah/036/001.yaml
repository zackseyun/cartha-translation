base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/001.yaml
  text: In the fourth year of Jehoiakim son of Josiah[a], king of Judah, this word came to Jeremiah from Yahweh, saying,
translation:
  language: ru
  text: 'В четвёртый год правления Иоакима, царя Иудеи и сына Иосии, к Иеремии пришло от Яхве[a] такое слово:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יְהוָה (ЙХВХ) — личное имя Бога; здесь передано как «Яхве».
    reason: Пояснение передачи божественного имени.
lexical_decisions:
- source_word: וַיְהִי
  choice: В
  rationale: Нарративная форма вводит новое временное обстоятельство; в современном русском её связующая функция естественно передаётся началом обстоятельственного оборота без архаичного «и было».
- source_word: בַּשָּׁנָה הָרְבִיעִת לִיהוֹיָקִים
  choice: В четвёртый год правления Иоакима
  rationale: Добавление «правления» ясно передаёт подразумеваемый отсчёт царских лет и естественно звучит по-русски.
- source_word: בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: сына Иосии, царя Иудеи
  rationale: Сохраняются родственная связь и царский титул; пунктуация устраняет двусмысленность русской конструкции.
- source_word: הָיָה הַדָּבָר הַזֶּה אֶל יִרְמְיָהוּ
  choice: к Иеремии пришло ... такое слово
  rationale: Пророческая формула передана естественным русским оборотом, а «слово» сохраняет смысл דבר как данного Богом откровения; «такое» указывает на следующую далее речь.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: Предлог передаёт источник слова, а личное имя יְהוָה транслитерируется как «Яхве».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит прямую речь следующего стиха и передаёт функцию еврейского инфинитива «сказать», не создавая тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное божественное имя, а не титул; транслитерация сохраняет это различие.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксис сделан естественным для русского читателя; архаичное «и было» не используется, а формула введения речи завершается двоеточием.
