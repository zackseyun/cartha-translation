source:
  edition: WLC
  text: וְ/עַל יְהוֹיָקִ֤ים מֶֽלֶךְ יְהוּדָה֙ תֹּאמַ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה אַ֠תָּה שָׂרַ֜פְתָּ אֶת הַ/מְּגִלָּ֤ה הַ/זֹּאת֙ לֵ/אמֹ֔ר מַדּוּעַ֩ כָּתַ֨בְתָּ עָלֶ֜י/הָ לֵ/אמֹ֗ר בֹּֽא יָב֤וֹא מֶֽלֶךְ בָּבֶל֙ וְ/הִשְׁחִית֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/הִשְׁבִּ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/029.yaml
  text: 'And concerning Jehoiakim king of Judah[a], you shall say, ‘Thus says Yahweh: You have burned this scroll, saying, “Why have you written on it, saying, ‘The king of Babylon will surely come and destroy this land, and cut off from it man and beast’?”’'
translation:
  language: ru
  text: 'А об Иоакиме, царе Иудеи, скажи: «Так говорит Яхве: ты сжёг этот свиток, сказав: „Почему ты написал в нём: ‘Царь Вавилона непременно придёт, разорит эту землю и истребит из неё людей и животных[a]’?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человека и скот». Это устойчивое выражение означает полное опустошение — гибель людей и животных.'
    reason: Сноска сохраняет буквальную форму и поясняет собирательный, всеохватный смысл еврейского выражения.
lexical_decisions:
- source_word: וְעַל יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: А об Иоакиме, царе Иудеи
  rationale: עַל при глаголе речи вводит тему пророчества; «об» естественно передаёт это значение, не исключая обличительного характера речи.
- source_word: תֹּאמַר
  choice: скажи
  rationale: Имперфект 2-го лица ед. числа имеет здесь побудительную силу; русский императив передаёт её ясно и естественно.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена традиционная формула пророческого вестника, а тетраграмматон передан личным именем «Яхве».
- source_word: שָׂרַפְתָּ אֶת הַמְּגִלָּה הַזֹּאת
  choice: ты сжёг этот свиток
  rationale: Перфект обозначает завершённое действие Иоакима; מְגִלָּה — свёрнутый письменный документ, то есть свиток.
- source_word: לֵאמֹר
  choice: и сказал
  rationale: В данном контексте инфинитив вводит содержание слов Иоакима; сочинительная конструкция естественна по-русски.
- source_word: כָּתַבְתָּ עָלֶיהָ
  choice: ты написал в нём
  rationale: Хотя עַל буквально может означать «на нём», по-русски о содержании свитка обычно говорят «написал в свитке».
- source_word: בֹּא יָבוֹא
  choice: непременно придёт
  rationale: Инфинитив абсолютный перед личной формой усиливает утверждение; «непременно» сохраняет эмфатическую уверенность.
- source_word: וְהִשְׁחִית אֶת הָאָרֶץ הַזֹּאת
  choice: разорит эту землю
  rationale: В отношении страны Hiphil שׁחת означает привести к разорению, опустошить; «разорит» передаёт смысл без неестественного буквального «уничтожит землю».
- source_word: וְהִשְׁבִּית מִמֶּנָּה אָדָם וּבְהֵמָה
  choice: и истребит на ней людей и животных
  rationale: השבית здесь означает прекратить существование или устранить; русское «истребит» передаёт полноту опустошения. Собирательные אָדָם и בְּהֵמָה естественно переданы множественным числом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Формула אָדָם וּבְהֵמָה
  choice: людей и животных
  alternative: человека и скот; человека и животное
  rationale: Это меризм, выражающий всеобщее опустошение. Множественное число звучит естественно в современном русском и сохраняет охват людей и животного мира, не сужая אָדָם до мужчины.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Вложенные цитаты размечены разными видами кавычек; синтаксис слегка упрощён ради ясности, но обвинительная формула, усиление בֹּא יָבוֹא и масштаб опустошения сохранены.
