id: JER.36.10
reference: Jeremiah 36:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א בָר֥וּךְ בַּ/סֵּ֛פֶר אֶת דִּבְרֵ֥י יִרְמְיָ֖הוּ בֵּ֣ית יְהוָ֑ה בְּ/לִשְׁכַּ֡ת גְּמַרְיָהוּ֩ בֶן שָׁפָ֨ן הַ/סֹּפֵ֜ר בֶּ/חָצֵ֣ר הָ/עֶלְי֗וֹן פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הֶֽ/חָדָ֔שׁ בְּ/אָזְנֵ֖י כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/010.yaml
  text: And Baruch read from the scroll the words of Jeremiah in the house of Yahweh[a], in the chamber of Gemariah son of Shaphan the scribe, in the upper court, at the entrance of the new gate of the house of Yahweh, in the hearing of all the people.
translation:
  language: ru
  text: И Варух прочитал из свитка слова Иеремии в доме Яхве[a], в комнате Гемарии, сына Шафана-писца, на верхнем дворе, у входа в Новые ворота дома Яхве, так, чтобы слышал весь народ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храме Яхве».'
    reason: «Дом Яхве» буквально передаёт древнееврейское выражение, которым здесь назван храмовый комплекс.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: прочитал
  rationale: В сочетании с בַּסֵּפֶר глагол означает чтение вслух по письменному тексту; публичность дополнительно выражена в конце стиха.
- source_word: בַּסֵּפֶר
  choice: из свитка
  rationale: סֵפֶר обозначает письменный документ; в данном историческом контексте естественно и точно «свиток», а ב при קרא передаёт чтение из него.
- source_word: דִּבְרֵי יִרְמְיָהוּ
  choice: слова Иеремии
  rationale: Прямо передаёт древнееврейскую сопряжённую конструкцию и сохраняет пророческую лексику.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома» и передаёт личное имя יהוה как «Яхве»; по контексту речь о храмовом комплексе.
- source_word: בְּלִשְׁכַּת
  choice: в комнате
  rationale: לִשְׁכָּה — помещение при храме, в том числе служебная комната. Современное «комната» понятно и не добавляет неуказанной функции.
- source_word: גְּמַרְיָהוּ בֶן שָׁפָן הַסֹּפֵר
  choice: писца Гемарии, сына Шафана
  rationale: Естественный русский порядок связывает титул הַסֹּפֵר с Гемарией, как наиболее вероятно по синтаксису; патроним сохранён.
- source_word: בֶּחָצֵר הָעֶלְיוֹן
  choice: на верхнем дворе
  rationale: חָצֵר обозначает двор храмового комплекса; русский предложный оборот «на дворе» здесь естественен.
- source_word: פֶּתַח שַׁעַר ... הֶחָדָשׁ
  choice: у входа в новые ворота
  rationale: Передаёт расположение у входа; שַׁעַר в русском архитектурном употреблении естественно передавать множественным «ворота», а חָדָשׁ — «новые».
- source_word: בְּאָזְנֵי כָּל הָעָם
  choice: вслух всему народу
  rationale: Естественно передаёт древнееврейскую идиому «в уши всего народа», то есть так, чтобы все слышали.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное имя Бога, поэтому транслитерация «Яхве» сохраняет его характер как имени, не заменяя титулом.
- issue: К кому относится титул הַסֹּפֵר
  choice: к Гемарии
  alternative: к Шафану
  rationale: Артикль при титуле и типичное обозначение владельца комнаты поддерживают чтение «комната Гемарии… писца», хотя из-за положения после имени Шафана возможна синтаксическая неоднозначность.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Сохранён библейский образ «дом Яхве», а архитектурные обозначения переданы общеупотребительно. Формула «вслух всему народу» естественно выражает публичное чтение.
