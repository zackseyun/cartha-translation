base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/023.yaml
  text: And whenever Yehudi had read three or four columns[a], he would cut it off with the scribe’s knife and throw it into the fire that was in the brazier[b], until the entire scroll was consumed in the fire that was in the brazier.
translation:
  language: ru
  text: И всякий раз, когда Иегуди прочитывал три или четыре столбца[a], их отрезали ножом писца и бросали в огонь, горевший в жаровне[b], пока весь свиток не сгорел в огне, горевшем в жаровне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «три или четыре створки»; здесь имеются в виду части свитка, вероятно столбцы текста.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «очаг» или «сосуд с огнём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּקְרֹא
  choice: всякий раз, когда ... прочитывал
  rationale: 'Сочетание כ с инфинитивом и последовательность действий в контексте передают повторяемость: после прочтения очередного отрывка следовали разрезание и сожжение.'
- source_word: יְהוּדִי
  choice: Иегуди
  rationale: Имя передано транслитерацией, близкой к еврейской форме и принятой русской библейской традиции.
- source_word: שָׁלֹשׁ דְּלָתוֹת וְאַרְבָּעָה
  choice: три или четыре столбца
  rationale: Буквально דְּלָתוֹת означает «двери, створки», но здесь обозначает последовательные части исписанного свитка, вероятнее всего столбцы текста.
- source_word: יִקְרָעֶהָ
  choice: отрезал их
  rationale: Обычно קרע значит «разрывать», однако упоминание писцового ножа указывает на разрезание. Местоимение передано множественным числом по естественному русскому согласованию со «столбцами».
- source_word: בְּתַעַר הַסֹּפֵר
  choice: писцовым ножом
  rationale: תַּעַר — режущее лезвие или бритва; в данном контексте естественно «нож». Сочетание «писцовый нож» обозначает принадлежность или тип орудия, не добавляя нового действующего лица.
- source_word: וְהַשְׁלֵךְ
  choice: и бросал
  rationale: Форма продолжает ряд повторяющихся действий; «бросал» естественно и точно передаёт удаление отрезанных частей в огонь.
- source_word: הָאָח
  choice: жаровня
  rationale: אָח обозначает очаг либо сосуд для огня; в зимнем помещении из ближайшего контекста «жаровня» наиболее наглядно передаёт переносное или комнатное устройство с огнём.
- source_word: עַד תֹּם כָּל הַמְּגִלָּה
  choice: пока весь свиток не сгорел
  rationale: Буквально выражение означает достижение конца всего свитка; результат сожжения ясно подразумевается повторяющимся бросанием частей в огонь и естественно выражается по-русски.
- source_word: הַמְּגִלָּה
  choice: свиток
  rationale: מְגִלָּה — обычное обозначение письменного свитка.
- source_word: אֶל הָאֵשׁ אֲשֶׁר אֶל הָאָח / עַל הָאֵשׁ אֲשֶׁר עַל הָאָח
  choice: в огонь, горевший в жаровне / в огне, горевшем в жаровне
  rationale: Еврейский текст варьирует предлоги «к/в» и «на», однако речь идёт об огне, находившемся в жаровне. Русская формулировка передаёт пространственный смысл без неестественного буквализма.
theological_decisions:
- issue: Неявный субъект глаголов יִקְרָעֶהָ и וְהַשְׁלֵךְ
  choice: сохранено местоимение «он» без отождествления с царём или Иегуди
  alternative: «царь отрезал» или «Иегуди отрезал»
  rationale: В еврейском стихе субъект прямо не назван; контекст допускает соотнесение с царём, но перевод не должен устранять формальную неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повтор «в огне, горевшем в жаровне» сохранён вслед за повтором исходного текста. Неявный субъект не уточнён, чтобы не устранять неоднозначность еврейского текста.
