- from: И всякий раз, когда Иегуди прочитывал три или четыре столбца[a], он отрезал их писцовым ножом и бросал в огонь, горевший в жаровне[b], пока весь свиток не сгорел в огне, горевшем в жаровне.
  to: И всякий раз, когда Иегуди прочитывал три или четыре столбца[a], их отрезали ножом писца и бросали в огонь, горевший в жаровне[b], пока весь свиток не сгорел в огне, горевшем в жаровне.
  rationale: Исправление устраняет невольное отнесение действий разрезания и бросания к Иегуди. Неопределённо-личная конструкция в русском не называет исполнителя и тем самым сохраняет формальную невыраженность субъекта, не добавляя отождествления с царём из контекста. В остальном сохранены повторяемость действий, образ свитка, ножа и жаровни, а также намеренный повтор заключительной формулы.
