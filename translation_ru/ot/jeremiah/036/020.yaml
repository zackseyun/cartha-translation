  text: Then they went to the king in the court[a], and they deposited the scroll in the chamber of Elishama the scribe[b], and they reported all the words in the hearing of the king.
translation:
  language: ru
  text: Тогда они пришли к царю во двор, а свиток оставили на хранение в помещении писца Элишамы. Они сообщили царю всё сказанное.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־הַמֶּלֶךְ חָצֵרָה
  choice: Тогда они пошли к царю во дворец
  rationale: Форма וַיָּבֹאוּ продолжает повествовательную последовательность, а направительное חָצֵרָה указывает на движение во двор/дворцовый комплекс. Русское «во дворец» естественно передаёт место пребывания царя и направление движения.
- source_word: וְאֶת־הַמְּגִלָּה הִפְקִדוּ
  choice: а свиток оставили на хранение
  rationale: מְגִלָּה — письменный свиток; каузативная форма от פקד здесь означает передать или оставить для сохранности. «Оставили на хранение» яснее передаёт этот оттенок, чем нейтральное «положили».
- source_word: בְּלִשְׁכַּת אֱלִישָׁמָע הַסֹּפֵר
  choice: в комнате писца Элишамы
  rationale: לִשְׁכָּה обозначает отдельную комнату или служебное помещение; «комната» понятно современному читателю и не навязывает более узкого значения «кабинет». סֹפֵר передано традиционным «писец», хотя в придворном контексте возможен смысл секретаря.
- source_word: וַיַּגִּידוּ בְּאָזְנֵי הַמֶּלֶךְ אֵת כָּל־הַדְּבָרִים
  choice: Они передали царю всё, что было сказано
  rationale: Идиома «в уши царя» естественно передаётся адресной конструкцией «царю». דְּבָרִים допускает значения «слова» и «дела/сведения»; в данном контексте речь идёт обо всём сообщённом при чтении свитка, что выражено естественным русским оборотом.
