base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/008.yaml
  text: And Baruch son of Neriah did according to all that Jeremiah the prophet had commanded him, to read from the scroll the words of the LORD in the house of the LORD.
translation:
  language: ru
  text: 'И Варух, сын Нирии, сделал всё, что повелел ему пророк Иеремия: читал в доме ГОСПОДА из свитка слова ГОСПОДА.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ ... כְּכֹל אֲשֶׁר צִוָּהוּ
  choice: сделал всё, что повелел ему
  rationale: Естественно передаёт еврейскую конструкцию со значением полного исполнения повеления.
- source_word: לִקְרֹא
  choice: прочитал
  rationale: Инфинитив указывает на содержание повеления; в русском завершённая форма естественно описывает его исполнение Варухом.
- source_word: בַסֵּפֶר
  choice: из свитка
  rationale: סֵפֶר здесь обозначает рукописный свиток, из которого читали вслух.
- source_word: בֵּית יְהוָה
  choice: в доме ГОСПОДА
  rationale: Буквально сохраняет храмовое обозначение и повтор божественного имени в стихе.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона; прописные буквы отличают его от обычного титула.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Сохраняет принятую в русской библейской речи замену божественного имени без внесения конфессионального толкования.
- issue: Связь инфинитива לִקְרֹא с повелением и исполнением
  choice: двоеточие и личная форма «прочитал»
  alternative: «чтобы прочитать» / «читать»
  rationale: Контекст сообщает, что Варух действительно исполнил поручение; русский синтаксис ясно передаёт содержание исполнения, хотя еврейский текст формально употребляет инфинитив.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно торжественное. Сохранены имя и отчество-патроним, титул пророка, образ свитка и двукратное упоминание ГОСПОДА.
