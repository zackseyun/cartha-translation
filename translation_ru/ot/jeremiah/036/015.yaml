  text: And they said to him[a], “Please sit down and read it in our hearing.” So Baruch read it in their hearing.
translation:
  language: ru
  text: 'Они сказали ему: «Пожалуйста, сядь и прочитай его нам вслух». И Варух прочитал им вслух.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Они сказали ему
  rationale: Вав с последовательной формой продвигает повествование; в русском отдельный союз не требуется, поскольку последовательность ясна из контекста.
- source_word: שֵׁב נָא
  choice: Пожалуйста, сядь
  rationale: Императив שֵׁב здесь означает приглашение сесть, а частица נָא придаёт просьбе вежливый оттенок.
- source_word: וּקְרָאֶנָּה
  choice: и прочитай … этот свиток
  rationale: В контексте קרא означает чтение письменного текста; местоименный суффикс женского рода указывает на ранее упомянутый свиток, поэтому референт выражен явно для естественности русского текста.
- source_word: בְּאָזְנֵינוּ
  choice: нам … вслух
  rationale: Буквально «в наши уши» — еврейская идиома, означающая чтение так, чтобы присутствующие слышали; «нам вслух» естественно передаёт её смысл.
- source_word: וַיִּקְרָא בָרוּךְ
  choice: И Варух прочитал
  rationale: Союз «и» сохраняет последовательное развитие повествования и не усиливает причинно-следственную связь.
- source_word: בְּאָזְנֵיהֶם
  choice: им вслух
  rationale: Повтор той же еврейской идиомы передан последовательно и естественно по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит вежливо и естественно. Буквальная идиома «в наши/их уши» передана функционально как «нам/им вслух», без сноски, поскольку буквальная форма в русском была бы неясной.
