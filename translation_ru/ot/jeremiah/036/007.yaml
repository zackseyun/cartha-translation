base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/007.yaml
  text: Perhaps their plea will fall before Yahweh[a], and each man will turn from his evil way[c][b], for great is the anger and the wrath that Yahweh has spoken against this people.
translation:
  language: ru
  text: Может быть, их мольба предстанет перед Яхве[a], и каждый отвернётся от своего злого пути[b], ведь велики гнев и ярость, которые Яхве изрёк этому народу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их мольба падёт перед Яхве»; это образное выражение означает, что просьба будет представлена ему или дойдёт до него.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и обратится каждый человек от своего злого пути». Мужская форма единственного числа употреблена в распределительном значении: каждый в отдельности.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «которые Яхве изрёк против этого народа». Предлог буквально означает «к, этому»; в контексте он может передавать направленность слов суда на народ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Может быть
  rationale: Передаёт надежду или возможность, а не уверенность; это естественное современное русское выражение.
- source_word: תִּפֹּל תְּחִנָּתָם לִפְנֵי יְהוָה
  choice: их мольба предстанет перед Яхве
  rationale: Еврейский оборот буквально говорит, что мольба «падёт перед» Яхве. Русское «предстанет перед» сохраняет образ обращения, представленного Богу, но не звучит как случайное падение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וְיָשֻׁבוּ
  choice: и ... отвернётся
  rationale: Глагол שׁוב обозначает поворот или возвращение. Сочетание «отвернётся от ... пути» естественно по-русски, сохраняет метафору перемены направления и не подменяет её отвлечённым богословским термином «покается».
- source_word: אִישׁ
  choice: каждый
  rationale: 'Передаёт распределительное значение единственного числа: речь идёт о каждом человеке в отдельности. В русском мужская форма «каждый» соответствует форме исходного текста без тяжеловесного «каждый мужчина».'
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: от своего злого пути
  rationale: Сохраняет библейскую метафору пути как образа поведения; «злого» прямо передаёт רָעָה.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание для призыва отвернуться и естественно связывает части русского предложения.
- source_word: גָדוֹל הָאַף וְהַחֵמָה
  choice: велики гнев и ярость
  rationale: Сохраняет оба близких по смыслу обозначения сильного Божьего негодования и согласует составное подлежащее по нормам современного русского языка.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל הָעָם הַזֶּה
  choice: о которых Яхве возвестил этому народу
  rationale: Делает фразу естественной по-русски и сохраняет формальное направление אֶל — «этому народу». «Возвестил» передаёт торжественный и угрожающий характер пророческого слова, не превращая предлог без оговорки в «против».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Значение שׁוב в контексте нравственной перемены
  choice: отвернётся от своего злого пути
  alternative: покается; вернётся со своего злого пути
  rationale: Выбранный вариант сохраняет пространственную метафору исходного текста и ясно выражает отказ от дурного поведения, не вводя более специализированный термин.
- issue: Направленность слов суда в אֶל הָעָם הַזֶּה
  choice: возвестил этому народу
  alternative: возвестил против этого народа
  rationale: Предлог אֶל буквально указывает направление «к, этому», тогда как контекст позволяет понять слова как направленный против народа приговор. Основной текст сохраняет формальную конструкцию, а контекстуальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Мольба», «Яхве» и «возвестил» поддерживают достоинство пророческой речи; синтаксис остаётся ясным для широкого читателя. Пара «гнев и ярость» намеренно сохраняет усиление исходного текста.
