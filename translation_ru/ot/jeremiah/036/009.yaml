    issue: Страдательный залог вместо неопределённо-личного множественного
    rationale: «Был объявлен пост» не называет деятеля, но также стирает множественное число קָרְאוּ. Русское «объявили пост» оставляет деятеля неназванным, сохраняя грамматический профиль оригинала.
  revised_text: В пятый год правления Иоакима, сына Иосии, царя Иудеи, в девятый месяц объявили пост пред Яхве для всего народа, находившегося в Иерусалиме, и для всех, кто пришёл в Иерусалим из городов Иудеи.
