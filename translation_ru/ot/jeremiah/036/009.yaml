source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/שָּׁנָ֣ה הַ֠/חֲמִשִׁית לִ/יהוֹיָקִ֨ים בֶּן יֹאשִׁיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ בַּ/חֹ֣דֶשׁ הַ/תְּשִׁעִ֔י קָרְא֨וּ צ֜וֹם לִ/פְנֵ֧י יְהוָ֛ה כָּל הָ/עָ֖ם בִּ/ירֽוּשָׁלִָ֑ם וְ/כָל הָ/עָ֗ם הַ/בָּאִ֛ים מֵ/עָרֵ֥י יְהוּדָ֖ה בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/009.yaml
  text: And it happened in the fifth year of Jehoiakim son of Josiah[a], king of Judah, in the ninth month, that they proclaimed a fast before Yahweh for all the people in Jerusalem and all the people coming from the cities of Judah into Jerusalem.
translation:
  language: ru
  text: В пятый год правления Иоакима, сына Иосии, царя Иудеи, в девятый месяц объявили пост пред Яхве для всего народа, находившегося в Иерусалиме, и для всех, кто пришёл в Иерусалим из городов Иудеи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: В ... был объявлен
  rationale: Еврейская повествовательная формула вводит датированное событие; в современном русском её функцию естественно передаёт сама конструкция предложения без буквального «и случилось».
- source_word: בַשָּׁנָה הַחֲמִשִׁית לִיהוֹיָקִים
  choice: в пятый год правления Иоакима
  rationale: В царской формуле датировки ל указывает на год царствования; добавление «правления» ясно и естественно выражает смысл.
- source_word: בַּחֹדֶשׁ הַתְּשִׁעִי
  choice: в девятый месяц
  rationale: Сохранена краткая календарная формула оригинала без добавления отсутствующего слова «года».
- source_word: קָרְאוּ צוֹם
  choice: был объявлен пост
  rationale: Идиома означает публично назначить или провозгласить пост. Пассивная конструкция сохраняет неопределённость неназванного множественного субъекта קָרְאוּ и не приписывает объявление самому народу.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי обозначает пребывание или действие перед лицом Бога; «пред» сохраняет достоинство и культовый оттенок, а имя יהוה передано как «Яхве».
- source_word: כָּל הָעָם בִּירוּשָׁלָם
  choice: для всего народа, находившегося в Иерусалиме
  rationale: Предлог ב обозначает местонахождение; причастный оборот исключает ошибочное понимание как «народ, происходящий из Иерусалима».
- source_word: וְכָל הָעָם הַבָּאִים מֵעָרֵי יְהוּדָה בִּירוּשָׁלָם
  choice: и для всех, кто пришёл в Иерусалим из городов Иудеи
  rationale: Причастие הַבָּאִים передано естественным русским придаточным; направление движения, подразумеваемое сочетанием «приходить» и названия города, выражено винительным падежом.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» отличает личное имя от титула и соответствует предоставленному актуальному решению проекта.
- issue: Отношение поста к Яхве
  choice: пост пред Яхве
  alternative: пост для Яхве / пост в присутствии Яхве
  rationale: Формулировка сохраняет пространственно-реляционный образ לִפְנֵי и не сводит его однозначно ни к посвящению поста, ни только к осознанию Божьего присутствия.
- issue: Кто объявил пост
  choice: был объявлен пост
  alternative: они объявили пост
  rationale: Множественный субъект глагола в оригинале не назван. Безлично-пассивная русская конструкция сохраняет эту неопределённость и не отождествляет объявивших пост со всем собравшимся народом.
translation_notes:
  register: 'Современный литературный русский с умеренно высоким библейским регистром. Имена переданы в традиционной русской форме: Иоаким, Иосия, Иудея. Форма «пред Яхве» торжественна, но понятна; синтаксис упрощён относительно еврейской цепочки, при этом сохранены датировка, неопределённый деятель и две группы участников.'
