lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: велел
  rationale: Порода пиэль глагола צוה выражает распоряжение; «велел» сохраняет директивную силу и естественно звучит в современном русском.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В русском стандартный еврейский вводитель речи естественно передаётся синтаксически, без тяжеловесного «сказав».
- source_word: עָצוּר
  choice: не могу выйти отсюда
  rationale: Контекстуальное динамическое выражение передаёт, что Иеремия удержан или ограничен, не уточняя причины; неоднозначность отмечена в сноске.
- source_word: לֹא אוּכַל לָבוֹא
  choice: не могу ... прийти
  rationale: Передаёт прямо выраженную невозможность войти в указанное место; «прийти» соответствует движению к дому Яхве.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный библейский образ «дома», не заменяя его интерпретирующим «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя заветного Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; «Яхве» сохраняет личное имя и соответствует принятому проектом решению.
- issue: Характер ограничения Иеремии
  choice: не уточнять причину невозможности выйти
  alternative: «я заключён» или «я под стражей»
  rationale: עָצוּר не устанавливает однозначно, был ли Иеремия заключён, задержан, ритуально ограничен или удержан иным обстоятельством; конкретизация сняла бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Прямая речь оформлена естественно; архаическое «сказав» опущено как избыточное. Формулировка сохраняет неопределённость עָצוּר.
