  text: וַ/יַּגֵּ֤ד לָ/הֶם֙ מִכָ֔יְהוּ אֵ֥ת כָּל הַ/דְּבָרִ֖ים אֲשֶׁ֣ר שָׁמֵ֑עַ בִּ/קְרֹ֥א בָר֛וּךְ בַּ/סֵּ֖פֶר בְּ/אָזְנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/013.yaml
  text: And Micaiah told them all the words that he had heard when Baruch read the scroll in the hearing of the people[a].
translation:
  language: ru
  text: И Михей передал им все слова, которые услышал, когда Варух читал свиток вслух народу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, что услышал, когда Варух читал свиток перед народом».'
    reason: Сочетание כָּל הַדְּבָרִים может обозначать как «все слова», так и всё содержание услышанного; בְּאָזְנֵי הָעָם допускает естественную передачу «перед народом».
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: передал
  rationale: Порода hифиль глагола נגד обозначает сообщение или доведение сведений до других. «Передал» естественно для повествования и не придаёт речи излишней официальности.
- source_word: לָהֶם
  choice: им
  rationale: Местоименное косвенное дополнение, относящееся к упомянутым в контексте сановникам.
- source_word: מִכָיְהוּ
  choice: Михей
  rationale: Традиционная и узнаваемая русская форма библейского имени.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: все слова
  rationale: Сохраняет прямое значение דְּבָרִים и характерный для книги Иеремии акцент на произнесённых и записанных словах; по смыслу выражение может также означать «всё».
- source_word: אֲשֶׁר שָׁמֵעַ
  choice: которые услышал
  rationale: Завершённое действие предшествует тому, как Михей передал услышанное; русская форма прошедшего времени ясно выражает эту последовательность без тяжеловесности.
- source_word: בִּקְרֹא
  choice: когда ... читал
  rationale: Предлог ב с инфинитивом-сопряжённым выражает временное обстоятельство; «когда» естественно передаёт его в современном русском.
- source_word: בָרוּךְ
  choice: Варух
  rationale: Традиционная русская передача личного имени.
- source_word: בַּסֵּפֶר
  choice: читал свиток
  rationale: סֵפֶר может означать книгу, документ или свиток; в Иер 36 речь идёт именно о свитке, записанном со слов Иеремии. Русский глагол «читать» допускает прямое дополнение без добавления отсутствующего в еврейском тексте предлога «из».
- source_word: בְּאָזְנֵי הָעָם
  choice: вслух народу
  rationale: Буквально «в уши народа» — идиома публичного чтения в пределах слышимости. «Вслух народу» передаёт её смысл ясно и естественно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Имена даны в традиционных русских формах; буквальная еврейская идиома «в уши народа» передана естественным выражением «вслух народу».
