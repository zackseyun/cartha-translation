  text: Then the officials said to Baruch, “Go, hide yourself, you and Jeremiah, and let no one know where you are.”
translation:
  language: ru
  text: 'Тогда сановники сказали Варуху: «Ступай, спрячься вместе с Иеремией, и пусть никто не знает, где вы».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: В данном царско-административном контексте речь идёт о высокопоставленных должностных лицах; «сановники» естественно передаёт их положение и не создаёт ошибочного впечатления, будто все они князья по происхождению.
- source_word: לֵךְ
  choice: Ступай
  rationale: Форма единственного числа обращена непосредственно к Варуху. «Ступай» передаёт повеление естественно и соответствует достоинству повествовательной речи.
- source_word: הִסָּתֵר אַתָּה וְיִרְמְיָהוּ
  choice: спрячьтесь с Иеремией
  rationale: Хотя повелительная форма грамматически единственного числа и к ней присоединены «ты и Иеремия», по-русски естественно употребить множественное число, поскольку скрыться должны оба. Конструкция сохраняет прямое обращение к Варуху и участие Иеремии.
- source_word: וְאִישׁ אַל יֵדַע
  choice: и пусть никто не знает
  rationale: אִישׁ при отрицании имеет обобщённое значение «никто»; такая формулировка естественно передаёт запретительную конструкцию.
- source_word: אֵיפֹה אַתֶּם
  choice: где вы
  rationale: Местоимение множественного числа относится к Варуху и Иеремии; краткая русская формулировка точно передаёт вопрос о месте их пребывания.
- source_word: וַיֹּאמְרוּ
  choice: Тогда ... сказали
  rationale: Форма продвигает последовательное повествование; «тогда» ясно и естественно выражает переход к следующему действию.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным регистром. «Сановники» выбрано вместо архаизирующего или потенциально неточного «князья»; обращение передано естественной русской конструкцией без утраты смысла.
