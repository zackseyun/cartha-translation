    text: 'Еврейский текст начинается с формы, буквально означающей «вернись»; вместе со следующим повелением она идиоматически выражает повторение действия: «снова» или «ещё раз возьми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּב קַח לְךָ
  choice: Снова возьми себе
  rationale: 'שׁוּב перед повелительным קַח употреблено наречно: «снова, ещё раз». לְךָ передано явным «себе», что сохраняет личную направленность повеления.'
- source_word: מְגִלָּה אַחֶרֶת
  choice: другой свиток
  rationale: מְגִלָּה обозначает письменный свиток, а אַחֶרֶת — другой, то есть новый взамен прежнего.
- source_word: וּכְתֹב עָלֶיהָ
  choice: и напиши на нём
  rationale: Прямо передаёт продолжение повеления и обычное русское обозначение поверхности, на которой пишут.
- source_word: אֵת כָּל הַדְּבָרִים הָרִאשֹׁנִים
  choice: все прежние слова
  rationale: דְּבָרִים здесь означает словесное содержание свитка; הָרִאשֹׁנִים указывает на ранее записанные слова.
- source_word: אֲשֶׁר הָיוּ עַל הַמְּגִלָּה הָרִאשֹׁנָה
  choice: которые были на первом свитке
  rationale: Относительное предложение прямо связывает слова с первоначальным свитком; הָרִאשֹׁנָה естественно передано как «первом».
- source_word: אֲשֶׁר שָׂרַף יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: сожжённом Иоакимом, царём Иудеи
  rationale: Причастная конструкция позволяет ясно отнести действие к свитку и избежать цепочки русских относительных предложений; שָׂרַף передано без добавочного усиления.
