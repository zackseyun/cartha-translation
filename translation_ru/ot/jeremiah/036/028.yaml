  text: Take for yourself another scroll and write on it all the former words that were on the first scroll[a], which Jehoiakim king of Judah burned.
translation:
  language: ru
  text: Снова возьми себе другой свиток[a] и напиши на нём все прежние слова, которые были на первом свитке, сожжённом Иоакимом, царём Иудеи.
  philosophy: optimal-equivalence
  footnotes:
