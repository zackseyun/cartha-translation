base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/031.yaml
  text: And I will punish him and his offspring and his servants for their iniquity[a], and I will bring on them, on the inhabitants of Jerusalem, and on the men of Judah all the disaster that I spoke against them, but they did not listen.
translation:
  language: ru
  text: И Я призову к ответу его, его потомков и его слуг за их вину и наведу на них, на жителей Иерусалима и на каждого жителя Иудеи[a], всё бедствие, о котором Я говорил им, но они не послушали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к каждому человеку Иудеи». Единственное число имеет распределительное значение; грамматически это слово мужского рода. В данном контексте выражение может передаваться также как «на жителей Иудеи» или «на народ Иудеи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלָיו
  choice: И Я взыщу с него
  rationale: В контексте суда פקד с עַל означает призвать к ответу, подвергнуть наказанию. «Взыщу с него» естественно передаёт судебно-карательный смысл и сохраняет конструкцию с лицом, несущим ответственность.
- source_word: זַרְעוֹ
  choice: его потомков
  rationale: Здесь זֶרַע обозначает потомство, а не буквальное семя; русское множественное число естественно передаёт собирательное значение.
- source_word: עֲבָדָיו
  choice: его слуг
  rationale: В окружении царского двора עֶבֶד естественно понимать как слуг или подчинённых; указания на необходимость более узкого «рабов» нет.
- source_word: אֶת עֲוֺנָם
  choice: за их беззаконие
  rationale: עָוֹן здесь обозначает виновное зло, за которое следует наказание. «Беззаконие» сохраняет нравственную и судебную тяжесть слова.
- source_word: וְהֵבֵאתִי עֲלֵיהֶם
  choice: и наведу на них
  rationale: Оборот הביא על означает навлечь или навести бедствие на кого-либо; «наведу на них» идиоматично по-русски и близко к образу исходного текста.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: жителей Иерусалима
  rationale: Причастная конструкция буквально обозначает живущих в Иерусалиме; «жители» — ясный современный эквивалент.
- source_word: אֶל אִישׁ יְהוּדָה
  choice: на каждого из мужей Иудеи
  rationale: אִישׁ имеет форму единственного числа и здесь, вероятно, употреблено дистрибутивно. Формулировка сохраняет значение «каждый мужчина/муж» и при этом звучит по-русски естественнее буквального «на каждого мужа Иудеи».
- source_word: כָּל הָרָעָה
  choice: всё бедствие
  rationale: В пророческом контексте רָעָה означает несчастье или бедствие как суд, а не нравственное зло.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיהֶם
  choice: о котором Я говорил им
  rationale: Предлог אֶל обычно передаёт направленность речи к адресатам. Контекст угрозы уже очевиден, поэтому нет необходимости усиливать выражение до «изрёк против них».
- source_word: וְלֹא שָׁמֵעוּ
  choice: но они не послушали
  rationale: שׁמע включает не только слышание, но и принятие сказанного к исполнению. «Не послушали» сохраняет обе стороны значения; союз «но» естественно выражает контекстуальное противопоставление.
theological_decisions:
- issue: Объём ответственности в выражении אֶת עֲוֺנָם
  choice: за их беззаконие
  alternative: за их вину / наказание за их беззаконие
  rationale: Перевод оставляет עָוֹן обозначением виновного проступка, не смешивая сам грех с его наказанием, хотя древнееврейское слово может охватывать и последствия вины.
- issue: Дистрибутивное и гендерное значение אִישׁ יְהוּדָה
  choice: на каждого из мужей Иудеи
  alternative: на жителей Иудеи / на народ Иудеи
  rationale: Исходный текст использует грамматически мужское אִישׁ в единственном числе, вероятно дистрибутивно. Основной текст сохраняет это значение, не заменяя его более широким гендерно-нейтральным коллективом; возможное более обобщённое понимание отмечено в сноске.
- issue: Смысл שׁמע как слышания или повиновения
  choice: не послушали
  alternative: не услышали / не повиновались
  rationale: '«Не послушали» сохраняет продуктивную неоднозначность: они услышали предупреждение, но не вняли ему и не подчинились.'
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Заглавное «Я» обозначает говорящего Бога. Синтаксический ряд намеренно сохраняет накопление адресатов суда в еврейском тексте; «взыщу» и «беззаконие» относятся к возвышенной, но понятной библейской лексике.
