  text: Царь сидел в зимнем доме в девятом месяце, а перед ним горела жаровня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосуд с огнём»; еврейское слово обозначает ёмкость с углями или огнём, которую использовали для обогрева.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Царь
  rationale: Начальное ו связывает предложение с контекстом, но в русском повествовании не требует обязательного отдельного «и»; определённость передана контекстуально.
- source_word: יוֹשֵׁב
  choice: сидел
  rationale: Причастие обозначает продолжающееся состояние; русская форма прошедшего времени естественно передаёт фоновое действие.
- source_word: בֵּית הַחֹרֶף
  choice: в зимнем доме
  rationale: Буквально «в доме зимы»; выражение означает сезонное, зимнее помещение или резиденцию. «Дом» сохраняет образ еврейского текста, не уточняя его как дворец без прямого основания.
- source_word: בַּחֹדֶשׁ הַתְּשִׁיעִי
  choice: в девятом месяце
  rationale: Прямое и естественное обозначение времени без подстановки названия месяца, которого в тексте нет.
- source_word: וְאֶת הָאָח לְפָנָיו מְבֹעָרֶת
  choice: а перед ним горела жаровня
  rationale: Сочетание описывает сопутствующее обстоятельство. «А» естественно вводит вторую часть картины, а «жаровня» обозначает сосуд с горящими углями или огнём для обогрева.
