base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/027.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after the king had burned the scroll and the words that Baruch had written from the mouth of Jeremiah, saying,
translation:
  language: ru
  text: 'Тогда, после того как царь сжёг свиток и слова, которые Варух записал со слов Иеремии[a], к Иеремии пришло слово Яхве:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из уст Иеремии»; возможно также: «под диктовку Иеремии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֶל יִרְמְיָהוּ
  choice: к Иеремии было слово Яхве
  rationale: Сохранена устойчивая пророческая формула со словом «слово», передающим откровение Бога; «тогда» естественно обозначает следующий этап повествования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом.
- source_word: אַחֲרֵי שְׂרֹף הַמֶּלֶךְ
  choice: после того как царь сжёг
  rationale: Предлог с инфинитивом образует временную конструкцию; русский совершенный вид ясно показывает, что сожжение предшествовало новому слову Яхве.
- source_word: הַמְּגִלָּה וְאֶת הַדְּבָרִים
  choice: свиток и слова
  rationale: Сохранено различие между материальным свитком и записанными пророческими словами.
- source_word: אֲשֶׁר כָּתַב בָּרוּךְ
  choice: которые Варух записал
  rationale: Глагол «записал» в данном контексте естественнее общего «написал» и указывает на письменную фиксацию произнесённых слов.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: со слов Иеремии
  rationale: Естественный русский оборот сохраняет значение устного источника, не утверждая жёстче оригинала формальную диктовку.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит прямую речь, начинающуюся в следующем стихе, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Формула דְבַר יְהוָה
  choice: слово Яхве
  alternative: весть Яхве; Яхве обратился
  rationale: «Слово» сохраняет характерную пророческую формулу и её богословскую насыщенность, не сводя её только к сообщению или действию речи.
- issue: Характер передачи слов Варухом
  choice: со слов Иеремии
  alternative: под диктовку Иеремии; из уст Иеремии
  rationale: Оригинал указывает на Иеремию как устный источник, но сам по себе не требует технического понимания процесса как формальной диктовки.
translation_notes:
  register: Современный литературный русский с сохранением достоинства пророческой формулы. Начальное «тогда» передаёт повествовательную последовательность; порядок слов слегка приближен к русской норме, а двоеточие вводит речь следующего стиха.
