  text: Yet even Elnathan[a], Delaiah, and Gemariah urged the king not to burn the scroll, but he did not listen to them.
translation:
  language: ru
  text: Однако даже Элнатан, Делая и Гемария настойчиво просили царя не сжигать свиток, но он не послушал их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: И всё же
  rationale: Сочетание выражает добавление с контрастным оттенком в данном контексте; «И всё же» естественно передаёт продолжение повествования и противопоставление намерению царя.
- source_word: הִפְגִּעוּ בַמֶּלֶךְ
  choice: убеждали царя
  rationale: Hiphil глагола פגע с ב обозначает настойчивое обращение или просьбу к царю. «Убеждали царя» естественно сочетается с последующим инфинитивом и сохраняет оттенок настойчивости.
- source_word: לְבִלְתִּי שְׂרֹף
  choice: не сжигать
  rationale: Конструкция выражает просьбу или побуждение не совершать действие; русский отрицательный инфинитив после «убеждали» передаёт её естественно.
- source_word: הַמְּגִלָּה
  choice: свиток
  rationale: מְגִלָּה обозначает письменный свиток и в контексте главы является конкретным ранее упомянутым свитком.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: но он их не послушал
  rationale: Союз передан противительным «но» по контексту; «не послушал» ясно выражает отказ царя внять их просьбе.
