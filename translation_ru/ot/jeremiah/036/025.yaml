translation_notes:
  register: Современный литературный русский язык; изложение краткое и достойное, имена переданы в формах, привычных для русской библейской традиции. Неоднозначность הִפְגִּיעוּ между настойчивым убеждением и мольбой сохранена нейтральным глаголом «убеждали» без конфессионального истолкования.
