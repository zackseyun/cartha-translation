base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/016.yaml
  text: And when they heard all the words[a], each man turned in fear to his companion, and they said to Baruch, “We must surely tell the king all these words.”
translation:
  language: ru
  text: 'Когда они услышали все слова, то в страхе посмотрели друг на друга[a] и сказали Варуху: «Мы непременно сообщим царю все эти слова».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «испугались — каждый к своему ближнему». Возможно также: «в страхе повернулись друг к другу». Еврейское выражение описывает их общую испуганную реакцию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: Когда они услышали
  rationale: Нарративная конструкция с וַיְהִי и временным כְּ естественно передаётся придаточным времени без буквального «и было».
- source_word: אֶת כָּל הַדְּבָרִים
  choice: все эти слова
  rationale: В контексте чтения свитка דְּבָרִים означает произнесённые слова; «эти» естественно указывает на только что прочитанное, хотя в первой фразе указательного местоимения в еврейском тексте нет.
- source_word: פָּחֲדוּ אִישׁ אֶל רֵעֵהוּ
  choice: в страхе посмотрели друг на друга
  rationale: Буквально необычная конструкция означает взаимную испуганную реакцию. Русская формулировка передаёт страх и направленность участников друг к другу, не представляя подразумеваемый взгляд как несомненную деталь.
- source_word: וַיֹּאמְרוּ אֶל בָּרוּךְ
  choice: и сказали Варуху
  rationale: Прямое и естественное соответствие повествовательной конструкции.
- source_word: הַגֵּיד נַגִּיד
  choice: мы непременно сообщим
  rationale: 'Инфинитив абсолютный при форме первого лица множественного числа усиливает решимость: «непременно сообщим», а не повеление Варуху.'
- source_word: לַמֶּלֶךְ
  choice: царю
  rationale: Определённый адресат ясен из контекста; русский язык естественно употребляет существительное без отдельного показателя определённости.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: Сохраняется повтор слова דְּבָרִים и явно выраженное указательное הָאֵלֶּה.
