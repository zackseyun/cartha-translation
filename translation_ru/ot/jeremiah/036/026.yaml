  text: וַ/יְצַוֶּ֣ה הַ֠/מֶּלֶךְ אֶת יְרַחְמְאֵ֨ל בֶּן הַ/מֶּ֜לֶךְ וְ/אֶת שְׂרָיָ֣הוּ בֶן עַזְרִיאֵ֗ל וְ/אֶת שֶֽׁלֶמְיָ֨הוּ֙ בֶּֽן עַבְדְּאֵ֔ל לָ/קַ֨חַת֙ אֶת בָּר֣וּךְ הַ/סֹּפֵ֔ר וְ/אֵ֖ת יִרְמְיָ֣הוּ הַ/נָּבִ֑יא וַ/יַּסְתִּרֵ֖/ם יְהוָֽה־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/026.yaml
  text: Then the king commanded Jerahmeel the king’s son[a], and Seraiah son of Azriel, and Shelemiah son of Abdeel, to seize Baruch the scribe and Jeremiah the prophet[b], but Yahweh hid them.
translation:
  language: ru
  text: Тогда царь приказал Иерахмеилу, сыну царя, Сераии, сыну Азриила, и Шелемии, сыну Авдеила, схватить[a] писца Варуха и пророка Иеремию. Но Яхве скрыл их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взять»; по контексту — схватить или задержать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: приказал
  rationale: Глагол צוה обозначает властное распоряжение; «приказал» естественно передаёт его силу в повествовательном контексте.
- source_word: יְרַחְמְאֵל בֶּן הַמֶּלֶךְ
  choice: Иерахмеилу, сыну царя
  rationale: Конструкция буквально указывает на родство с царём. Перевод сохраняет это значение, не заменяя его более широким титулом «царевич» или «князь».
- source_word: שְׂרָיָהוּ בֶן עַזְרִיאֵל
  choice: Сераии, сыну Азриила
  rationale: Имена переданы в принятой русской библейской форме, а патронимическая конструкция בן — словом «сын».
- source_word: שֶׁלֶמְיָהוּ בֶּן עַבְדְּאֵל
  choice: Шелемии, сыну Авдеила
  rationale: Имена переданы в принятой русской библейской форме; родственная связь выражена прямо.
- source_word: לָקַחַת
  choice: схватить
  rationale: Хотя основное значение לקח — «взять», здесь царские посланники должны силой захватить Варуха и Иеремию. «Схватить» передаёт контекст, не привнося современного юридического понятия ареста.
- source_word: בָּרוּךְ הַסֹּפֵר
  choice: писца Варуха
  rationale: סֹפֵר может означать писца или секретаря; «писец» непосредственно соответствует роли Варуха в данном повествовании.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: пророка Иеремию
  rationale: Прямой и традиционно понятный перевод титула נביא.
- source_word: וַיַּסְתִּרֵם
  choice: укрыл их
  rationale: Форма глагола סתר означает, что Яхве сделал их скрытыми. «Укрыл их» естественно выражает намеренную защиту и сокрытие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое обозначение Бога в еврейском тексте, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не традиционной заменой титулом.
- issue: Характер сокрытия Варуха и Иеремии
  choice: Яхве укрыл их
  alternative: они скрылись
  rationale: Подлежащее еврейского глагола — Яхве; перевод сохраняет явное утверждение о Божьем действии и не переносит инициативу на людей.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён до естественного русского порядка слов, при этом сохранены все названные лица, их родственные определения, роли Варуха и Иеремии и явное действие Яхве.
