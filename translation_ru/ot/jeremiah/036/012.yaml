  text: וַ/יֵּ֤רֶד בֵּית הַ/מֶּ֨לֶךְ֙ עַל לִשְׁכַּ֣ת הַ/סֹּפֵ֔ר וְ/הִ֨נֵּה שָׁ֔ם כָּל הַ/שָּׂרִ֖ים יֽוֹשְׁבִ֑ים אֱלִישָׁמָ֣ע הַ/סֹּפֵ֡ר וּ/דְלָיָ֣הוּ בֶן שְׁ֠מַעְיָהוּ וְ/אֶלְנָתָ֨ן בֶּן עַכְבּ֜וֹר וּ/גְמַרְיָ֧הוּ בֶן שָׁפָ֛ן וְ/צִדְקִיָּ֥הוּ בֶן חֲנַנְיָ֖הוּ וְ/כָל הַ/שָּׂרִֽים־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/012.yaml
  text: 'he went down to the king''s house, to the scribe''s chamber, and behold, all the officials were sitting there: Elishama the scribe, Delaiah son of Shemaiah, Elnathan son of Achbor, Gemariah son of Shaphan, Zedekiah son of Hananiah, and all the officials.'
translation:
  language: ru
  text: 'Он спустился в царский дворец, в комнату писца, и вот там сидели все сановники: писец Елишама, Делая, сын Шемаии, Элнатан, сын Ахбора, Гемария, сын Шафана, Цедекия, сын Ханании, и все сановники.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дворец
  rationale: Буквально «дом царя»; в данном административном контексте естественное русское обозначение царской резиденции — «царский дворец».
- source_word: לִשְׁכַּת הַסֹּפֵר
  choice: в комнату писца
  rationale: לִשְׁכָּה обозначает отдельную комнату или служебное помещение; «комната» ясно и естественно, не уточняя без основания её функцию как канцелярии.
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: Здесь речь идёт о высокопоставленных царских должностных лицах; «сановники» точнее контекста, чем широкое «князья» или современно-бюрократическое «чиновники».
- source_word: וְהִנֵּה שָׁם
  choice: Там
  rationale: Еврейское הִנֵּה вводит увиденную сцену; в современном русском повествовании это естественно передано новой фразой без архаического «вот».
- source_word: וְכָל הַשָּׂרִים
  choice: и все остальные сановники
  rationale: Повтор после перечня имён по смыслу охватывает прочих присутствовавших сановников; «остальные» делает русскую фразу понятной, не меняя референцию.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования; имена переданы в традиционной русской библейской форме. Синтаксис разделён на два предложения для ясности, при сохранении последовательности еврейского текста.
