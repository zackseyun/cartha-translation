  text: וַ֠/יִּשְׁמַ֗ע מִכָ֨יְהוּ בֶן גְּמַרְיָ֧הוּ בֶן שָׁפָ֛ן אֶת כָּל דִּבְרֵ֥י יְהוָ֖ה מֵ/עַ֥ל הַ/סֵּֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/011.yaml
  text: And Micaiah son of Gemariah[a], son of Shaphan, heard all the words of Yahweh from the scroll.
translation:
  language: ru
  text: И Михей, сын Гемарии, сына Шафана, услышал все слова Яхве[a] при чтении со свитка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH; традиционная передача — «Господь».
    reason: Указана форма оригинала и традиционный вариант передачи Божьего имени.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Глагол שׁמע обозначает восприятие звучащего чтения; повествовательная форма передаёт завершённое событие в прошлом.
- source_word: מִכָיְהוּ
  choice: Михей
  rationale: Использована устоявшаяся русская библейская форма имени, соответствующая еврейскому מִכָיְהוּ.
- source_word: בֶן גְּמַרְיָהוּ בֶן שָׁפָן
  choice: сын Гемарии, сына Шафана
  rationale: Сохранена последовательность патронимов и однозначно передана родословная связь.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: все слова Яхве
  rationale: כָּל передано словом «все», а דִּבְרֵי — формально близким «слова», без сведения выражения к пересказу содержания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: מֵעַל הַסֵּפֶר
  choice: прочитанные из свитка
  rationale: Буквальное «со свитка» в контексте означает, что слова звучали при чтении письменного свитка; явное «прочитанные» делает эту связь естественной по-русски, а «свиток» соответствует древнему виду документа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя, поэтому оно сохранено в основном тексте; сноска сообщает традиционную замену титулом, не навязывая её самому переводу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис родословной цепочки сохранён, но выражение о свитке передано естественно и ясно. Маркер сноски поставлен непосредственно после имени Яхве, к которому относится примечание.
