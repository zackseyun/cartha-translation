source:
  edition: WLC
  text: אוּלַ֤י יִשְׁמְעוּ֙ בֵּ֣ית יְהוּדָ֔ה אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י חֹשֵׁ֖ב לַ/עֲשׂ֣וֹת לָ/הֶ֑ם לְמַ֣עַן יָשׁ֗וּבוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֔ה וְ/סָלַחְתִּ֥י לַ/עֲוֺנָ֖/ם וּ/לְ/חַטָּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/003.yaml
  text: Perhaps the house of Judah will hear of all the disaster that I am planning to bring on them[a], so that each man may turn from his evil way[b], and I will forgive their iniquity and their sin.
translation:
  language: ru
  text: Может быть, дом Иуды услышит обо всём бедствии, которое Я намерен причинить им[a], чтобы каждый отвернулся от своего злого пути[b] и Я простил их беззаконие и их грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обо всём несчастье». Еврейское слово может означать «зло» или «бедствие»; здесь речь идёт о суде, грозящем Иуде, а не о нравственном зле со стороны Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый человек от своего злого пути». Единственное число имеет распределительное значение и относится к людям Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Может быть
  rationale: Передаёт надежду на возможный отклик, не превращая его в уверенность.
- source_word: יִשְׁמְעוּ
  choice: услышит
  rationale: Сохраняет основной смысл глагола שמע; ожидаемый отклик выражен последующей целевой конструкцией.
- source_word: בֵּית יְהוּדָה
  choice: дом Иуды
  rationale: Сохраняет корпоративное и заветное обозначение народа, а не сводит его к территории.
- source_word: אֵת כָּל הָרָעָה
  choice: обо всём бедствии
  rationale: В контексте грозящего суда רעה означает бедствие, а не нравственное зло.
- source_word: חֹשֵׁב לַעֲשׂוֹת לָהֶם
  choice: которое Я замышляю навести на них
  rationale: Передаёт намерение, выраженное причастием с инфинитивом; «навести» естественно сочетается с «бедствием».
- source_word: לְמַעַן יָשׁוּבוּ
  choice: и каждый отвернётся
  rationale: В данном русском построении союз «и» передаёт ожидаемую цель услышанного предупреждения; «отвернётся» определяется дополнением «от злого пути» и не вводит отвлечённого термина «покается».
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: каждый отвернётся от своего злого пути
  rationale: «Каждый» естественно передаёт распределительное איש и сохраняет личную ответственность; «злой путь» удерживает пророческий образ поведения.
- source_word: וְסָלַחְתִּי
  choice: тогда Я прощу
  rationale: '«Тогда» естественно раскрывает последовательность: обращение народа и последующее прощение, подразумеваемую контекстом.'
- source_word: לַעֲוֺנָם וּלְחַטָּאתָם
  choice: их беззаконие и их грех
  rationale: Сохраняет два разных обозначения вины и греха, не сливая их в одно.
theological_decisions:
- issue: Значение רָעָה применительно к Божьему суду
  choice: бедствие
  alternative: зло; несчастье
  rationale: Речь идёт о карающем событии, которое Бог намерен навести на Иуду, а не о нравственном зле со стороны Бога.
- issue: Репрезентативное единственное число אִישׁ
  choice: каждый
  alternative: каждый человек; каждый мужчина
  rationale: Русское «каждый» сохраняет распределительный единственный смысл и охватывает членов дома Иуды без неуместного ограничения только взрослыми мужчинами.
- issue: Связь обращения и прощения
  choice: тогда Я прощу
  alternative: и Я прощу
  rationale: Наречие «тогда» явно передаёт подразумеваемую последовательность, не утверждая сверх текста исчерпывающую формулу покаяния и прощения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Корпоративное выражение «дом Иуды» и образ «злого пути» сохранены; синтаксис сделан естественным для обычного читателя.
