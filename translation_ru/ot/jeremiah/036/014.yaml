  text: וַ/יִּשְׁלְח֨וּ כָל הַ/שָּׂרִ֜ים אֶל בָּר֗וּךְ אֶת יְהוּדִ֡י בֶּן נְ֠תַנְיָהוּ בֶּן שֶׁלֶמְיָ֣הוּ בֶן כּוּשִׁי֮ לֵ/אמֹר֒ הַ/מְּגִלָּ֗ה אֲשֶׁ֨ר קָרָ֤אתָ בָּ/הּ֙ בְּ/אָזְנֵ֣י הָ/עָ֔ם קָחֶ֥/נָּה בְ/יָדְ/ךָ֖ וָ/לֵ֑ךְ וַ֠/יִּקַּח בָּר֨וּךְ בֶּן נֵרִיָּ֤הוּ אֶת הַ/מְּגִלָּה֙ בְּ/יָד֔/וֹ וַ/יָּבֹ֖א אֲלֵי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/014.yaml
  text: Then all the officials sent Jehudi son of Nethaniah[a], son of Shelemiah, son of Cushi, to Baruch, saying, “Take in your hand the scroll from which you read in the hearing of the people, and come.” So Baruch son of Neriah took the scroll in his hand and came to them.
translation:
  language: ru
  text: 'Тогда все сановники послали к Варуху Иегудия, сына Нетании, сына Шелемии, сына Куши, и велели: «Возьми свиток, по которому ты читал вслух народу, в руки и приходи[a]». Варух, сын Нирии, взял свиток в руки и пришёл к ним.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв. «иди». В русском приглашении к месту говорящих естественно: «приходи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: В придворно-государственном контексте слово обозначает высокопоставленных царских служащих; «сановники» естественно передаёт их статус и не подразумевает буквальных князей царского рода.
- source_word: אֶת יְהוּדִי ... אֶל בָּרוּךְ
  choice: послали к Варуху Иегудия
  rationale: Винительный показатель отмечает Иегудия как посланца, а предлог אֶל — Варуха как адресата; порядок слов выбран по нормам литературного русского языка.
- source_word: יְהוּדִי
  choice: Иегудия
  rationale: Цепочка родословия показывает, что это личное имя, а не обозначение иудея; использована традиционная русская библейская передача имени.
- source_word: הַמְּגִלָּה
  choice: свиток
  rationale: מְגִלָּה обозначает свёрнутый письменный текст; «свиток» — ясный современный эквивалент.
- source_word: קָרָאתָ בָּהּ
  choice: по которому ты читал
  rationale: Глагол קרא с предлогом ב обозначает чтение вслух по письменному тексту; русский оборот «читать по свитку» естественно указывает на источник чтения.
- source_word: בְּאָזְנֵי הָעָם
  choice: вслух народу
  rationale: Еврейская идиома буквально указывает на чтение «в уши» народа и подчёркивает слышимость; «вслух народу» передаёт это естественно и ясно.
- source_word: קָחֶנָּה בְיָדְךָ
  choice: Возьми свиток
  rationale: Женский объектный суффикс относится к свитку. В русском повтор существительного ясен и естественен; буквальное «возьми в свою руку» здесь звучало бы тяжеловесно.
- source_word: וָלֵךְ
  choice: и приходи
  rationale: Буквально употреблён глагол «иди», но в прямой речи призыв двигаться к говорящим по-русски естественно выражается словом «приходи».
- source_word: בְּיָדוֹ
  choice: взял свиток в руки
  rationale: Формула сохраняет образ личного несения свитка и перекликается с приказом; русское множественное «в руки» идиоматично.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: и пришёл к ним
  rationale: Форма обозначает прибытие Варуха к сановникам; «пришёл к ним» точно и естественно передаёт движение к месту назначения.
