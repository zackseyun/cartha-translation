translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Имена переданы в привычной русской библейской форме. Синтаксис сделан ясным для широкого читателя без устранения родословной цепочки и без внесения богословских уточнений, отсутствующих в источнике.
