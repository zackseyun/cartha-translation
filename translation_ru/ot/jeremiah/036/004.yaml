base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/004.yaml
  text: So Jeremiah called Baruch son of Neriah[a], and Baruch wrote on a scroll all the words of Yahweh from Jeremiah’s mouth[b], which he had spoken to him.
translation:
  language: ru
  text: Иеремия позвал Варуха, сына Нирии, и Варух записал на свитке[b] со слов Иеремии[a] все слова Яхве, которые Он сказал ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из уст Иеремии»; то есть Иеремия диктовал.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на свитке книги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: В данном контексте קרא означает позвать или призвать к себе; «позвал» естественно звучит по-русски и не усиливает значение до официального «вызвал».
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  choice: Варуха, сына Нирии
  rationale: Имена переданы в традиционной русской библейской форме; приложение оформлено естественно для современного литературного русского языка.
- source_word: וַיִּכְתֹּב
  choice: записал
  rationale: В контексте записи продиктованной речи русский глагол «записал» естественнее простого «написал» и точно передаёт действие.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: со слов Иеремии
  rationale: Буквально «из уст Иеремии»; русская идиома «со слов» ясно передаёт устную передачу текста, не вводя сверх текста специальный термин «под диктовку».
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: все слова Яхве
  rationale: Сохраняется конкретное «слова», важное в повествовании о письменной фиксации пророчества, а личное имя יְהוָה передаётся как «Яхве».
- source_word: אֲשֶׁר דִּבֶּר אֵלָיו
  choice: которые Он сказал ему
  rationale: Относительное предложение наиболее естественно относится к Яхве, говорившему Иеремии. Местоимения сохраняют формальную неоднозначность референтов; прописная буква у «Он» помогает чтению, принятому из ближайшего контекста.
- source_word: עַל מְגִלַּת סֵפֶר
  choice: на книжном свитке
  rationale: Сочетание буквально означает «на свитке книги» и обозначает свиток как письменный документ; «книжный свиток» сохраняет оба элемента выражения без чрезмерной буквальности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Референты местоимений в אֲשֶׁר דִּבֶּר אֵלָיו
  choice: «Он» — Яхве, «ему» — Иеремия
  alternative: Оставить оба местоимения без графического уточнения; истолковать речь как произнесённую через Иеремию
  rationale: Синтаксис естественно указывает на слова Яхве, сказанные Иеремии. Перевод «через него» добавил бы посредническое значение, которого предлог אֶל сам по себе не выражает.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Порядок слов сделан естественным для русского: обстоятельство «со слов Иеремии» стоит при глаголе записи, а место записи — в конце. Все маркеры сносок присутствуют в основном тексте.'
