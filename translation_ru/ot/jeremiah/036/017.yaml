  text: וְ/אֶ֨ת בָּר֔וּךְ שָׁאֲל֖וּ לֵ/אמֹ֑ר הַגֶּד נָ֣א לָ֔/נוּ אֵ֗יךְ כָּתַ֛בְתָּ אֶת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה מִ/פִּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/017.yaml
  text: And they asked Baruch[a], saying, “Please tell us, how did you write all these words from his mouth?”
translation:
  language: ru
  text: 'И они спросили Варуха: «Скажи нам, пожалуйста, как ты записал все эти слова с его слов[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из его уст», то есть Варух записывал устную речь Иеремии под его диктовку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲלוּ
  choice: спросили
  rationale: Обычный глагол со значением «спрашивать»; естественно вводит следующий прямой вопрос.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Стандартный древнееврейский ввод прямой речи передан двоеточием, что естественно для современного русского языка и не требует тяжеловесного «сказав».
- source_word: הַגֶּד נָא לָנוּ
  choice: Скажи нам, пожалуйста
  rationale: Императив הַגֶּד передан как «скажи», а частица נָא — вежливым «пожалуйста»; местоименный суффикс сохранён словом «нам».
- source_word: אֵיךְ
  choice: как
  rationale: Прямой вопрос об образе действия.
- source_word: כָּתַבְתָּ
  choice: ты записал
  rationale: Совершенный вид передаёт уже завершённое записывание; «записал» точнее контекста устной речи, заносимой в свиток, чем нейтральное «написал».
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: Хотя דְּבָרִים может означать также «дела» или «вещи», здесь речь идёт о произнесённом и записанном тексте.
- source_word: מִפִּיו
  choice: с его слов[a]
  rationale: Русское выражение естественно передаёт получение текста из устной речи говорящего, сохраняя местоименную неопределённость оригинала; буквальный образ и смысл диктовки пояснены в сноске.
- source_word: וְאֶת בָּרוּךְ
  choice: И они спросили Варуха
  rationale: Фронтированный объект естественно перестроен согласно русскому порядку слов; начальное «И» сохраняет повествовательную связь.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной, достойной повествовательной интонацией. Древнееврейская формула введения прямой речи передана русской пунктуацией; образное מִפִּיו выражено естественным оборотом «с его слов», а буквальная формулировка сохранена в сноске.
