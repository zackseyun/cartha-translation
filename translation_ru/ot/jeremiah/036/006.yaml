  text: וּ/בָאתָ֣ אַתָּ֡ה וְ/קָרָ֣אתָ בַ/מְּגִלָּ֣ה אֲשֶׁר כָּתַֽבְתָּ מִ/פִּ/י֩ אֶת דִּבְרֵ֨י יְהוָ֜ה בְּ/אָזְנֵ֥י הָ/עָ֛ם בֵּ֥ית יְהוָ֖ה בְּ/י֣וֹם צ֑וֹם וְ/גַ֨ם בְּ/אָזְנֵ֧י כָל יְהוּדָ֛ה הַ/בָּאִ֥ים מֵ/עָרֵי/הֶ֖ם תִּקְרָאֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/006.yaml
  text: So you yourself must go and read from the scroll that you wrote from my mouth—the words of Yahweh—in the hearing of the people in the house of Yahweh on a day of fasting[b][a]; and you must also read them in the hearing of all Judah who come from their cities.
translation:
  language: ru
  text: Итак, пойди сам и прочитай вслух народу в доме Яхве[b] в день поста слова Яхве из свитка, который ты записал с моих слов[a]. Прочитай их также всему народу Иудеи, пришедшему из своих городов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который ты написал из моих уст»; то есть записал под мою диктовку.'
    reason: lexical_alternative
  - marker: b
    text: «Дом Яхве» — храм.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאתָ אַתָּה
  choice: Итак, пойди сам
  rationale: Форма с союзом продолжает повеление в данном контексте, а отдельное местоимение אַתָּה подчёркивает, что пойти должен именно Варух. Русское «пойди» естественно передаёт требуемое движение к храму.
- source_word: וְקָרָאתָ בַמְּגִלָּה
  choice: и прочитай вслух … из свитка
  rationale: При письменном объекте קרא означает чтение; публичная обстановка требует чтения вслух. Предлог ב обозначает документ, по которому читают.
- source_word: אֲשֶׁר כָּתַבְתָּ מִפִּי
  choice: который ты записал с моих слов[a]
  rationale: Буквально выражение означает «который ты написал из моих уст». «Записал с моих слов» естественно по-русски передаёт устный источник текста, не уточняя сверх оригинала способ записи.
- source_word: בְּאָזְנֵי הָעָם
  choice: вслух народу
  rationale: Еврейская идиома «в уши народа» обозначает чтение так, чтобы народ слышал. Выбранная формулировка сохраняет слуховой и публичный характер действия.
- source_word: בֵּית יְהוָה
  choice: в доме Яхве[b]
  rationale: Сохранён буквальный образ «дома»; в примечании поясняется, что здесь имеется в виду храм.
- source_word: בְּיוֹם צוֹם
  choice: в день поста
  rationale: Фраза указывает на день соблюдения поста, не определяя его как конкретный ежегодный праздник.
- source_word: בְּאָזְנֵי כָל יְהוּדָה
  choice: всему народу Иудеи
  rationale: «Вся Иудея» здесь обозначает жителей Иудеи как коллектив, поэтому по-русски смысл ясно передан через «народ Иудеи».
- source_word: הַבָּאִים מֵעָרֵיהֶם
  choice: пришедшему из своих городов
  rationale: Причастие описывает жителей Иудеи, которые прибывают из принадлежащих им городов; согласование в единственном числе соответствует собирательному слову «народ».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога — тетраграмматон יהוה. Транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
translation_notes:
  register: 'Современный литературный русский язык с ясной, dignified библейской интонацией. Порядок слов слегка перестроен ради естественности и устранения двусмысленности: «слова Яхве» непосредственно связано с чтением из свитка. Повтор глагола «прочитай» отражает повтор תִּקְרָאֵם в еврейском тексте.'
