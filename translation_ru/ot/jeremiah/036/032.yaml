  text: וְ/יִרְמְיָ֜הוּ לָקַ֣ח מְגִלָּ֣ה אַחֶ֗רֶת וַֽ/יִּתְּנָ/הּ֮ אֶל בָּר֣וּךְ בֶּן נֵרִיָּהוּ֮ הַ/סֹּפֵר֒ וַ/יִּכְתֹּ֤ב עָלֶ֨י/הָ֙ מִ/פִּ֣י יִרְמְיָ֔הוּ אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר שָׂרַ֛ף יְהוֹיָקִ֥ים מֶֽלֶךְ יְהוּדָ֖ה בָּ/אֵ֑שׁ וְ/ע֨וֹד נוֹסַ֧ף עֲלֵי/הֶ֛ם דְּבָרִ֥ים רַבִּ֖ים כָּ/הֵֽמָּה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/032.yaml
  text: Then Jeremiah took another scroll and gave it to Baruch son of Neriah[a], the scribe, and he wrote on it from the mouth of Jeremiah all the words of the scroll that Jehoiakim king of Judah had burned in the fire; and many similar words were added to them besides.
translation:
  language: ru
  text: Тогда Иеремия взял другой свиток и отдал его писцу Баруху, сыну Нерии. Тот записал на нём из уст Иеремии[a] все слова свитка, который Иоаким, царь Иудеи, сжёг в огне; и к ним было добавлено ещё много подобных слов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под диктовку Иеремии». Буквально: «из уст Иеремии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגִלָּה אַחֶרֶת
  choice: другой свиток
  rationale: «Свиток» конкретно и исторически точно обозначает письменный свиток; אַחֶרֶת означает «другой, ещё один».
- source_word: וַיִּתְּנָהּ אֶל בָּרוּךְ
  choice: отдал его … Баруху
  rationale: Нейтрально передаёт действие נתן с адресатом; местоимение относится к свитку.
- source_word: הַסֹּפֵר
  choice: писцу
  rationale: Передаёт профессиональную роль человека, записывающего текст, не внося современного бюрократического оттенка слова «секретарь».
- source_word: וַיִּכְתֹּב עָלֶיהָ
  choice: Тот записал на нём
  rationale: «Тот» ясно указывает на Баруха как ближайшего участника, а «на нём» сохраняет образ свитка как поверхности для письма.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: из уст Иеремии
  rationale: Сохранён буквальный и выразительный еврейский оборот, означающий устную передачу текста под запись; идиоматический смысл указан в сноске.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: все слова свитка
  rationale: Хотя סֵפֶר может означать «книга», в данном контексте речь идёт о конкретном свитке, который был сожжён и заменён другим.
- source_word: אֲשֶׁר שָׂרַף ... בָּאֵשׁ
  choice: который … сжёг в огне
  rationale: Относительное предложение отнесено к свитку; формулировка близко передаёт еврейский текст и естественна по-русски.
- source_word: וְעוֹד נוֹסַף עֲלֵיהֶם
  choice: и к ним было добавлено ещё
  rationale: Сохранены пассивная конструкция нифаля и значение дополнительности, выраженное וְעוֹד.
- source_word: דְּבָרִים רַבִּים כָּהֵמָּה
  choice: много подобных слов
  rationale: Передаёт количество и сравнительное значение כָּהֵמָּה — «подобных им, таких же» — естественным современным русским выражением.
