  text: Yet neither the king nor any of his servants who heard all these words were afraid[b][a], nor did they tear their garments.
translation:
  language: ru
  text: Но ни царь, ни все его слуги, слышавшие все эти слова, не испугались и не разодрали на себе одежду[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Раздирание одежды на себе было на древнем Ближнем Востоке общепринятым знаком скорби, ужаса или раскаяния.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא פָחֲדוּ
  choice: не испугались
  rationale: Глагол פחד выражает страх или ужас; «не испугались» естественно передаёт повествовательный контекст, не усиливая степень страха.
- source_word: וְלֹא קָרְעוּ אֶת־בִּגְדֵיהֶם
  choice: не разорвали на себе одежд
  rationale: Оборот обозначает ритуальный жест скорби, ужаса или раскаяния. Формулировка «разорвали на себе одежды» узнаваема, сохраняет культурный образ и звучит достойно в современном русском языке.
- source_word: הַמֶּלֶךְ וְכָל־עֲבָדָיו
  choice: ни царь, ни его слуги — все
  rationale: Повторное отрицание относится к царю и всей группе его придворных слуг. Конструкция с «ни… ни» естественно передаёт совокупное отрицание и не допускает ошибочного смысла «не все слуги».
- source_word: הַשֹּׁמְעִים
  choice: кто слышал
  rationale: Причастие определяет царя и его слуг как тех, кто слышал чтение; придаточная конструкция ясна и естественна по-русски.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: В контексте чтения свитка דְּבָרִים указывает именно на произнесённые слова. Русское «эти слова» естественно охватывает всё услышанное без обязательного воспроизведения квантора «все» после пояснительного «все, кто».
