lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם בָּרוּךְ
  choice: Тогда Варух ответил им
  rationale: Глагол אמר буквально означает «сказал», но здесь речь Варуха является ответом на вопрос из предыдущего стиха; «ответил» естественно передаёт контекст, а «тогда» — последовательность повествования.
- source_word: מִפִּיו יִקְרָא אֵלַי
  choice: Он произносил мне
  rationale: קרא обычно значит «читать», «возглашать», «произносить»; в данном контексте слова устно сообщались Варуху для записи. «Произносил мне» сохраняет лексическую широту и не делает подразумеваемую диктовку единственным возможным смыслом. Отдельное «своими устами» в современном русском избыточно, поскольку устный характер действия уже выражен глаголом.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: Здесь דְּבָרִים обозначает пророческие слова, которые были произнесены и записаны.
- source_word: וַאֲנִי כֹּתֵב
  choice: а я записывал их
  rationale: Причастная форма כֹּתֵב описывает сопровождавшее, продолжавшееся действие. Русское несовершенное прошедшее естественно передаёт этот аспект; местоимение «их» делает связь со «словами» ясной.
- source_word: עַל הַסֵּפֶר
  choice: в свиток
  rationale: סֵפֶר в контексте главы обозначает письменный свиток. По-русски естественно говорить «записывать в свиток», хотя еврейское עַל буквально имеет значение «на».
- source_word: בַּדְּיוֹ
  choice: чернилами
  rationale: Предлог בְּ имеет здесь инструментальное значение; творительный падеж естественно передаёт средство письма.
