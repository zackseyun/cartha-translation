  text: Then Baruch said to them[a], “He would recite all these words to me with his mouth, and I was writing them on the scroll with ink.”
translation:
  language: ru
  text: 'Тогда Варух сказал им: «Он произносил мне вслух все эти слова, а я записывал их на свитке чернилами».[a]'
  philosophy: optimal-equivalence
  footnotes:
