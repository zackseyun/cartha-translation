  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֵלַ֖/י שֵׁנִ֥ית לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/003.yaml
  text: And the word of Yahweh came to me a second time[a], saying,
translation:
  language: ru
  text: 'И во второй раз ко мне пришло слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה (ЙХВХ); традиционно переводится как «Господь».
    reason: Указывает еврейскую форму божественного имени и традиционный вариант его передачи.
lexical_decisions:
- source_word: וַיְהִי
  choice: пришло
  rationale: В устойчивой пророческой формуле ויהי דבר־יהוה אלי глагольная форма естественно передаётся по-русски как «ко мне пришло слово», а не буквально и тяжеловесно «и было».
- source_word: דְבַר
  choice: слово
  rationale: «Слово» прямо передаёт еврейское דָּבָר и сохраняет принятую библейскую формулу божественного откровения, не сужая значение до «сообщения».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог с суффиксом первого лица обозначает направленность слова к Иеремии; «ко мне» — точная и естественная русская передача.
- source_word: שֵׁנִית
  choice: во второй раз
  rationale: Эта формулировка явно указывает на повторное обращение и точнее передаёт наречие, чем менее конкретное «снова».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском эту функцию естественно выполняет двоеточие; буквальное «говоря» здесь звучало бы неестественно.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» сохраняет имя и не подменяет его титулом; традиционная замена указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранена традиционная формула «пришло слово», а вводящее прямую речь לֵאמֹר передано двоеточием без неестественного причастного оборота.
