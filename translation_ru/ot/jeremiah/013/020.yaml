  text: Подними глаза и посмотри на тех, кто идёт с севера. Где стадо, данное тебе, твои великолепные овцы[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стадо твоей красы» или «стадо твоей славы». Еврейское слово может означать красоту, великолепие или славу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאִי עֵינֵיכֶם
  choice: Подними глаза
  rationale: Сочетание глагола נשׂא с «глазами» означает поднять взгляд. Женское единственное число повелительного наклонения передано обращением к олицетворённому городу; необычное множественное местоименное окончание при «глазах» нельзя естественно воспроизвести по-русски без искажения смысла.
- source_word: וּרְאִי
  choice: и посмотри
  rationale: Женская форма повелительного наклонения от ראה продолжает прямое обращение. «Посмотри» естественно сочетается с указанием на приближающихся людей.
- source_word: הַבָּאִים מִצָּפוֹן
  choice: на тех, кто идёт с севера
  rationale: Субстантивированное причастие сохраняет значение происходящего приближения; кто именно идёт, текст стиха прямо не уточняет.
- source_word: הָעֵדֶר נִתַּן לָךְ
  choice: стадо, данное тебе
  rationale: 'Сохранены пастушеский образ и пассивная форма: стадо было дано адресату или вверено ему.'
- source_word: צֹאן תִּפְאַרְתֵּךְ
  choice: твои великолепные овцы
  rationale: צֹאן конкретизирует образ стада, а תפארת обозначает великолепие, красоту или славу. «Великолепные» звучит естественно и передаёт ценность овец, не устраняя более буквальные оттенки, отмеченные в сноске.
theological_decisions:
- issue: Кого обозначает стадо
  choice: Сохранить пастушескую метафору без пояснения её референта в основном тексте.
  alternative: Прямо назвать стадом народ Иудеи, жителей Иерусалима или подданных его правителей.
  rationale: Еврейский текст сам не раскрывает метафору в этом стихе; конкретизация сузила бы её возможный смысл.
- issue: Адресат женского рода
  choice: Передать повелительные формы в женском единственном числе.
  alternative: Использовать множественное число из-за местоименного окончания в עֵינֵיכֶם.
  rationale: Обе повелительные формы и суффиксы далее в стихе указывают на обращение к адресату женского рода, вероятно к олицетворённому Иерусалиму; текстовую нерегулярность при слове «глаза» не следует превращать в смену адресата.
translation_notes:
  register: Современный литературный русский язык с сохранением прямого, торжественно-пророческого обращения. Метафора стада оставлена без истолкования; синтаксис сделан ясным для обычного читателя.
