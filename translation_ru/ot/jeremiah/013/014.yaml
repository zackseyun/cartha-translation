  source_fidelity: 'Черновик в целом передаёт насильственный образ נפץ, именование Яхве, мужские термины родства и тройное отрицание. Однако «человека — о его брата, отцов и сыновей — вместе» синтаксически неверно: «человека» не может быть согласованной расшифровкой «их», а «отцов и сыновей» остаётся без ясной синтаксической функции. Финальное «уничтожу их» передаёт итоговый смысл, но превращает зависимый оборот מֵהַשְׁחִיתָם в отдельное, более категорично оформленное предложение.'
  naturalness: 'Предлагаемая редакция сохраняет сжатый пророческий регистр, но делает распределительную конструкцию понятной по-русски: «каждого — о его брата». Оборот «чтобы не уничтожить их» естественно выражает, что трижды отрицаемые пощада и жалость не побудят Яхве отказаться от уничтожения.'
