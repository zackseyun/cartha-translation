source:
  edition: WLC
  text: וְ/נִפַּצְתִּי/ם֩ אִ֨ישׁ אֶל אָחִ֜י/ו וְ/הָ/אָב֧וֹת וְ/הַ/בָּנִ֛ים יַחְדָּ֖ו נְאֻם יְהוָ֑ה לֹֽא אֶחְמ֧וֹל וְ/לֹֽא אָח֛וּס וְ/לֹ֥א אֲרַחֵ֖ם מֵ/הַשְׁחִיתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/014.yaml
  text: And I will smash them against each other[a], man against his brother, fathers and sons together, declares Yahweh. I will not spare, nor will I pity, nor will I have compassion[b], from destroying them.
translation:
  language: ru
  text: 'И Я разобью их друг о друга[a]: каждого — о его брата, и отцов с сыновьями — вместе, — возвещает Яхве. Не пощажу, не пожалею и не помилую, чтобы не уничтожить их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокрушу их друг о друга»; возможен также образ людей, которых с силой ударяют друг о друга.'
    reason: Лексическая альтернатива для נפץ и пояснение конкретного образа.
lexical_decisions:
- source_word: וְנִפַּצְתִּים
  choice: И Я разобью их
  rationale: Глагол נפץ обозначает сильный удар, разбивание или сокрушение. «Разобью» сохраняет конкретность и жестокую силу образа.
- source_word: אִישׁ אֶל אָחִיו
  choice: человека — о его брата
  rationale: Сохранены распределительная конструкция в единственном числе и родственное обозначение; предлог «о» естественно сочетается по-русски с образом удара одного человека о другого.
- source_word: וְהָאָבוֹת וְהַבָּנִים יַחְדָּו
  choice: отцов и сыновей — вместе
  rationale: Переданы прямо названные в еврейском тексте мужские родственные связи и подчёркнуто совместное бедствие близких родственников.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: «Возвещает» естественно передаёт торжественную пророческую формулу, а имя יהוה транслитерировано как «Яхве».
- source_word: לֹא אֶחְמֹל וְלֹא אָחוּס וְלֹא אֲרַחֵם
  choice: Не пощажу, не пожалею и не помилую
  rationale: Три близких по смыслу глагола переданы тремя различными русскими словами с сохранением риторического накопления и повторного отрицания.
- source_word: מֵהַשְׁחִיתָם
  choice: уничтожу их
  rationale: В контексте три отрицания означают, что сострадание не удержит Бога от уничтожения. Самостоятельная итоговая фраза передаёт этот смысл естественно по-русски, не воспроизводя неуклюжую кальку «от уничтожения их».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Гендерно маркированные названия родства
  choice: человека — о его брата, отцов и сыновей
  alternative: друг о друга, родителей и детей
  rationale: Еврейский текст прямо употребляет формы мужского рода и называет братьев, отцов и сыновей; их обобщение устранило бы конкретные семейные связи.
- issue: Связь מֵהַשְׁחִיתָם с тремя отрицаниями
  choice: отдельное заключение «уничтожу их»
  alternative: «не удержусь от их уничтожения»; буквально «от уничтожения их»
  rationale: מִן с инфинитивом указывает на действие, от которого милость не удержит. Выбранная формулировка сохраняет неизбежность суда и звучит ясно, не превращая фразу в логически двусмысленную конструкцию с отрицанием.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены резкость образа, мужские термины родства и трёхчленная формула отсутствия пощады; финальный оборот передан естественно, без синтаксической кальки.
