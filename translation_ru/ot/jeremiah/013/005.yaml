source:
  edition: WLC
  text: וָ/אֵלֵ֕ךְ וָ/אֶטְמְנֵ֖/הוּ בִּ/פְרָ֑ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אוֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/005.yaml
  text: So I went and hid it by the Euphrates[a], as Yahweh had commanded me.
translation:
  language: ru
  text: И я пошёл и спрятал его у Евфрата[a], как повелел мне Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Перат; обычно это название понимают как «Евфрат», но некоторые считают его местным топонимом Перат.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵלֵךְ
  choice: И я пошёл
  rationale: Форма wayyiqtol от הלך последовательно развивает повествование; русское «И я пошёл» естественно передаёт связь с предшествующим повелением.
- source_word: וָאֶטְמְנֵהוּ
  choice: и спрятал его
  rationale: Глагол טמן означает «прятать, скрывать»; местоименный суффикс мужского рода относится к предмету из предыдущего контекста. «Спрятал» не уточняет без достаточных оснований, был ли предмет закопан.
- source_word: בִּפְרָת
  choice: у Евфрата[a]
  rationale: פְרָת обычно обозначает Евфрат. Предлог ב здесь естественно передаётся как «у», поскольку речь идёт о месте, где был спрятан предмет; возможное понимание как местного топонима «Перат» отмечено в сноске.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Передаёт образ действия и соответствие ранее данному повелению.
- source_word: צִוָּה
  choice: повелел
  rationale: «Повелел» естественно и достойно передаёт значение צוה в контексте Божьего распоряжения; временная последовательность в русском ясна без плюсквамперфекта.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, уместная в современном литературном библейском тексте.
- source_word: אוֹתִי
  choice: мне
  rationale: После русского глагола «повелеть» лицо, которому дано повеление, нормативно выражается дательным падежом.
theological_decisions:
- issue: Отождествление פְרָת
  choice: Евфрат
  alternative: Перат как не переведённый или местный топоним
  rationale: Обычное лексическое значение פְרָת — Евфрат, поэтому оно принято в основном тексте. Возможность местного топонима сохраняется в сноске, чтобы не устранять реальную географическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с традиционно-библейским достоинством. Синтаксис прост и понятен; «спрятал» сохраняет широту исходного глагола, а сноска — неоднозначность топонима.
