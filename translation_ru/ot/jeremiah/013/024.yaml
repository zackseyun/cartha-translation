source:
  edition: WLC
  text: וַ/אֲפִיצֵ֖/ם כְּ/קַשׁ עוֹבֵ֑ר לְ/ר֖וּחַ מִדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/024.yaml
  text: So I will scatter them like chaff passing away before the desert wind[a].
translation:
  language: ru
  text: И Я развею их, как солому, уносимую ветром пустыни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как жнивьё, проносящееся перед ветром пустыни».'
    reason: 'Сохраняет лексические альтернативы: קַשׁ может означать жнивьё, עובר — «проходящее, проносящееся», а לְרוּחַ допускает образ движения перед ветром.'
lexical_decisions:
- source_word: וַאֲפִיצֵם
  choice: И Я развею их
  rationale: Глагол в породе хифиль с субъектом первого лица единственного числа и объектом третьего лица множественного числа означает «рассею, развею». Будущее время естественно передаёт предстоящее пророческое наказание; союз ו передан нейтральным «и», не усиливая причинно-следственную связь сверх явно выраженного.
- source_word: כקש
  choice: как солому
  rationale: קַשׁ обозначает сухие остатки злаков — солому или жнивьё; в русском «солома» естественно сочетается с образом материала, уносимого ветром, не сводя значение непременно к мякине.
- source_word: עובר
  choice: уносимую
  rationale: Причастие от עבר буквально описывает то, что проходит или проносится. В данном образе русское «уносимую» ясно передаёт движение сухой соломы под действием ветра, хотя причинность в еврейском выражена лишь контекстом.
- source_word: לרוח מדבר
  choice: ветром пустыни
  rationale: Сочетание ל с רוּחַ в контексте обозначает движение, обусловленное ветром или происходящее перед ним; מִדְבָּר здесь естественно передать как «пустыня». Русский творительный падеж создаёт ясный и естественный образ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза краткая и образная, с достоинством пророческой речи. Заглавная буква в «Я» подчёркивает речь Бога без добавления конфессионально специфической терминологии.
