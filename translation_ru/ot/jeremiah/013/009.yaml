  text: כֹּ֖ה אָמַ֣ר יְהוָ֑ה כָּ֠כָה אַשְׁחִ֞ית אֶת גְּא֧וֹן יְהוּדָ֛ה וְ/אֶת גְּא֥וֹן יְרוּשָׁלִַ֖ם הָ/רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/009.yaml
  text: 'Thus says Yahweh: In this way I will ruin the pride of Judah and the great pride of Jerusalem[a][b].'
translation:
  language: ru
  text: 'Так говорит Яхве: «Так Я погублю[a] гордость Иуды и великую гордость Иерусалима[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уничтожу», «испорчу». Еврейский глагол может означать порчу, разрушение или приведение в негодность; здесь он перекликается с образом испорченного пояса.'
    reason: lexical_alternative
  - marker: b
    text: Слово «гордость» можно также понять как «высокомерие» или, менее вероятно в данном контексте, как «величие».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного русского языка пророческая формула, сохраняющая торжественный характер речи.
- source_word: כָּכָה
  choice: Так
  rationale: Кратко и естественно указывает на образ действия, показанный через испорченный пояс; повтор с начальной формулой отражает повторение כֹּה / כָּכָה в еврейском тексте.
- source_word: אַשְׁחִית
  choice: погублю
  rationale: Hiphil глагола שׁחת допускает значения порчи, разрушения и приведения в негодность. «Погублю» естественно применимо к абстрактной «гордости» и сохраняет связь с погубленным поясом, не сводя действие только к физическому уничтожению.
- source_word: גְּאוֹן
  choice: гордость
  rationale: Сохраняет возможный диапазон между высокомерием и предметом возвышения или величия; контекст суда прежде всего придаёт слову отрицательный оттенок.
- source_word: גְּאוֹן יְהוּדָה
  choice: гордость Иуды
  rationale: Прямая передача сопряжённой конструкции, сохраняющая параллелизм со следующей фразой.
- source_word: גְּאוֹן יְרוּשָׁלִַם הָרָב
  choice: великую гордость Иерусалима
  rationale: הָרָב усиливает существительное גְּאוֹן; перевод сохраняет порядок и параллельную структуру исходного текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя יְהוָה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение גְּאוֹן
  choice: гордость
  alternative: высокомерие; величие
  rationale: В контексте суда вероятен отрицательный смысл, однако более широкое «гордость» сохраняет возможную связь как с высокомерием, так и с тем, чем Иуда и Иерусалим гордятся.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной пророческой интонацией. Кавычки разграничивают вводную формулу и прямую речь Яхве. Повтор «Так... Так...» намеренно сохраняет риторическое повторение исходного текста.
