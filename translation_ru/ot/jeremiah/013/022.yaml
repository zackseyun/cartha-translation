source:
  edition: WLC
  text: וְ/כִ֤י תֹאמְרִי֙ בִּ/לְבָבֵ֔/ךְ מַדּ֖וּעַ קְרָאֻ֣/נִי אֵ֑לֶּה בְּ/רֹ֧ב עֲוֺנֵ֛/ךְ נִגְל֥וּ שׁוּלַ֖יִ/ךְ נֶחְמְס֥וּ עֲקֵבָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/022.yaml
  text: And if you say in your heart[a], ‘Why have these things happened to me?’—because of the greatness of your iniquity your skirts have been uncovered[b], your heels have been violated.
translation:
  language: ru
  text: 'И если ты скажешь в своём сердце: «Почему всё это постигло меня?»[a] — то из-за множества твоих беззаконий обнажён подол твоей одежды, твои пятки подверглись насилию[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему всё это пришло на меня?»'
    reason: Лексическое значение קרא в этой конструкции допускает более буквальный образ бедствий, пришедших на человека.
  - marker: b
    text: 'Выражение продолжает образ унизительного обнажения; еврейский текст можно также понимать шире: «с тобой жестоко обошлись».'
    reason: Глагол חמס допускает как оттенок надругательства, так и более общее значение насильственного, жестокого обращения.
lexical_decisions:
- source_word: וְכִי
  choice: И если
  rationale: Сочетание вводит предполагаемое возражение и сохраняет связь с предшествующей речью; условное значение здесь предпочтительнее строго временного.
- source_word: תֹאמְרִי בִּלְבָבֵךְ
  choice: ты скажешь в своём сердце
  rationale: Сохранён еврейский образ внутренней речи; выражение понятно в современном литературном русском и поддерживает возвышенный регистр.
- source_word: קְרָאֻנִי אֵלֶּה
  choice: всё это постигло меня
  rationale: В данной конструкции קרא передаёт не буквальное «позвало», а наступление бедствий. «Постигло меня» естественно и сохраняет оттенок пришедшего несчастья.
- source_word: בְּרֹב עֲוֺנֵךְ
  choice: из-за множества твоих беззаконий
  rationale: Предлог בְּ выражает причину, רֹב — многочисленность или величину, а עָוֹן несёт нравственный смысл беззакония и вины. Русское множественное число естественно передаёт собирательную силу выражения.
- source_word: נִגְלוּ שׁוּלַיִךְ
  choice: подняты края твоей одежды
  rationale: שׁוּלַיִם обозначает нижние края, подол одежды. Формулировка сохраняет образ принудительного обнажения и публичного унижения, не создавая неестественного русского выражения «обнажены подолы».
- source_word: נֶחְמְסוּ עֲקֵבָיִךְ
  choice: над твоими пятками совершено насилие
  rationale: Нифаль глагола חמס указывает на насилие, жестокое обращение или надругательство. Необычный образ «пяток» сохранён, а формулировка не сводит его ни только к обнажению, ни к конкретному виду физического или сексуального насилия.
theological_decisions:
- issue: Пророческий образ позорящего обнажения и насилия
  choice: Сохранить телесный образ унижения и насилия, не смягчая его до простого смущения и не уточняя, что речь непременно идёт о конкретном сексуальном действии.
  alternative: Передать образ обобщённо как «ты обнажена и опозорена» либо истолковать его как прямое описание сексуального насилия.
  rationale: Еврейский текст изображает суд над Иерусалимом как над женщиной, подвергнутой позорному обнажению и жестокому обращению. Перевод сохраняет тяжесть метафоры и вместе с тем её подлинную недосказанность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Женский род обращения сохранён по еврейскому тексту. Необычная телесная образность передана прямо, но без добавления деталей, которых нет в источнике.
