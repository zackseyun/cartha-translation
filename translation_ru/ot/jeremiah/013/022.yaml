revisions:
- from: 'И если ты скажешь в своём сердце: «Почему всё это постигло меня?»[a] — то из-за множества твоих беззаконий подняты края твоей одежды, над твоими пятками совершено насилие[b].'
  to: 'И если ты скажешь в своём сердце: «Почему всё это постигло меня?»[a] — то из-за множества твоих беззаконий обнажён подол твоей одежды, твои пятки подверглись насилию[b].'
  rationale: Исправлено «подняты» на «обнажён», чтобы передать נִגְלוּ как состояние открытости, а не добавлять действие подъёма. «Подол» точнее передаёт нижний край одежды. Вторая образная строка перестроена для более естественного русского синтаксиса без смягчения, догматического истолкования или излишней конкретизации насилия.
