base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/027.yaml
  text: Your adulteries[a], your lustful neighings, the depravity of your prostitution on the hills in the field—I have seen your abominations. Woe to you, Jerusalem! Will you not be made clean?[d][c][b] How long will it still be?
translation:
  language: ru
  text: Твои прелюбодеяния, твоё похотливое ржание, разврат твоего блуда — на холмах, в открытом поле — Я видел твои мерзости. Горе тебе, Иерусалим! Неужели ты не очистишься?[b] И долго ещё?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или, как утверждение: «Ты не очистишься». Еврейскую форму можно также понимать как «станешь чистой» или «будешь очищена».'
    reason: alternative_reading
  - marker: c
    text: 'Еврейская фраза предельно кратка: буквально «после какого времени ещё?»; по смыслу: «сколько это ещё будет продолжаться?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִאֻפַיִךְ
  choice: твои прелюбодеяния
  rationale: Сохраняет множественное число и конкретный образ супружеской неверности, применённый к Иерусалиму.
- source_word: וּמִצְהֲלוֹתַיִךְ
  choice: твоё похотливое ржание
  rationale: Передаёт намеренно резкий образ конского ржания, выражающего половую страсть; собирательное единственное число звучит по-русски естественнее формального множественного.
- source_word: זִמַּת זְנוּתֵךְ
  choice: распутство твоего блуда
  rationale: זִמָּה здесь обозначает постыдную распущенность, а זְנוּת — блуд или проституцию; формулировка сохраняет нравственную и сексуальную силу образа без излишней вульгарности.
- source_word: עַל גְּבָעוֹת בַּשָּׂדֶה
  choice: на холмах, в открытом поле
  rationale: Локативная фраза отнесена к последующему «Я видел», что соответствует еврейскому членению и сохраняет место совершения мерзостей.
- source_word: רָאִיתִי שִׁקּוּצָיִךְ
  choice: Я видел твои мерзости
  rationale: Прошедшее время естественно передаёт перфект; «мерзости» сохраняет пророческий регистр и возможный культовый оттенок שִׁקּוּץ.
- source_word: אוֹי לָךְ
  choice: горе тебе
  rationale: Устойчивый русский эквивалент пророческой формулы скорби и суда.
- source_word: לֹא תִטְהֲרִי
  choice: неужели ты не очистишься?
  rationale: Риторический вопрос естественно связывается с последующей репликой; возвратная форма передаёт значение состояния или становления чистой, не уточняя внешнего деятеля.
- source_word: אַחֲרֵי מָתַי עוֹד
  choice: и долго ещё?
  rationale: Сохраняет краткость и эллиптичность необычного еврейского оборота, подразумевающего продолжение нечистоты или отказа очиститься.
theological_decisions:
- issue: Сексуальные образы как метафора неверности и идолопоклонства
  choice: Сохранены прямые образы прелюбодеяния, похотливого ржания и блуда.
  alternative: Обобщить как «неверность» или «безнравственность».
  rationale: Резкая телесная образность принадлежит самому пророческому обвинению; её смягчение ослабило бы текст и внесло бы толкование в перевод.
- issue: Сила формы לֹא תִטְהֲרִי
  choice: 'Риторический вопрос: «Неужели ты не очистишься?»'
  alternative: 'Утверждение: «Ты не очистишься».'
  rationale: Отсутствие вопросительной частицы допускает утверждение, однако следующий эллиптический вопрос естественно поддерживает чтение как скорбного призыва-вопроса. Альтернатива отмечена в сноске.
- issue: Кто совершает очищение
  choice: «ты не очистишься» — без явного указания деятеля
  alternative: «тебя не очистят» или «ты не будешь очищена».
  rationale: Nifal допускает значение состояния, становления чистой или пассивного очищения; русская возвратная форма не навязывает однозначного богословского решения.
translation_notes:
  register: Современный литературный русский с сохранением высокого пророческого тона и намеренно резкой сексуальной метафорики. Синтаксис разделён тире, чтобы ясно представить перечень обвинений и затем место, где Бог видел мерзости. Заглавное «Я» обозначает речь Бога по принятой русской библейской традиции, не добавляя имени говорящего.
