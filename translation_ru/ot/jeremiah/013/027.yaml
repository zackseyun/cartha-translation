  terminology: «Прелюбодеяния», «блуд», «мерзости» и «горе тебе» соответствуют пророческому регистру и сохраняют культово-нравственный оттенок еврейского текста. В сноске к b следует точнее и грамотнее описать два возможных оттенка формы nifal, не создавая искусственной формулировки «как становление чистой».
