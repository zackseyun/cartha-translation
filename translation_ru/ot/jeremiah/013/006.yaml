source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ יָמִ֣ים רַבִּ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֚וּם לֵ֣ךְ פְּרָ֔תָ/ה וְ/קַ֤ח מִ/שָּׁם֙ אֶת הָ֣/אֵז֔וֹר אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/טָמְנ/וֹ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/006.yaml
  text: And it happened after many days that Yahweh said to me[a], “Arise, go to Perath[c][b], and take from there the waistband that I commanded you to hide there.”
translation:
  language: ru
  text: 'И спустя много дней Яхве сказал мне: «Встань, пойди в Перат[a] и возьми оттуда пояс[b], который Я велел тебе там спрятать[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перат может обозначать Евфрат; в основном тексте еврейское название передано транслитерацией.
    reason: alternative_reading
  - marker: b
    text: 'Или: «набедренную повязку», «кушак» либо «опоясание». Еврейское слово обозначает предмет, носимый вокруг талии.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «закопать». Еврейский глагол может означать «спрятать, скрыть», в том числе спрятав в земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И
  rationale: Нарративная форма вводит следующий эпизод; в современном русском её функцию естественно передаёт союз «И» вместе с временным оборотом, без архаичного «и было».
- source_word: מִקֵּץ יָמִים רַבִּים
  choice: спустя много дней
  rationale: Передаёт временное значение буквально близко и при этом естественно для современного русского; вариант «по прошествии многих дней» звучит более книжно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: קוּם לֵךְ
  choice: Встань, пойди
  rationale: Сохраняет два последовательных повеления и их энергичный характер; «отправляйся» было бы более свободным объединением.
- source_word: פְּרָתָה
  choice: в Перат
  rationale: Сохранено еврейское географическое название с направительным значением; возможное отождествление с Евфратом не внесено безоговорочно в основной текст.
- source_word: וְקַח מִשָּׁם
  choice: и возьми оттуда
  rationale: Прямо передаёт повеление и указание на место; более конкретное «забери» добавляло бы оттенок возвращения вещи себе.
- source_word: הָאֵזוֹר
  choice: пояс
  rationale: Общее и естественное русское обозначение предмета, носимого вокруг талии, без чрезмерного уточнения его формы.
- source_word: אֲשֶׁר צִוִּיתִיךָ
  choice: который Я велел тебе
  rationale: Естественно передаёт относительное предложение и властный характер прежнего указания; русское «велел» здесь требует последующего инфинитива.
- source_word: לְטָמְנוֹ שָׁם
  choice: там спрятать
  rationale: Сохраняет широкое значение глагола «прятать, скрывать», не навязывая более узкого понимания «закопать».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя, не заменяя его титулом и не принимая позднюю форму «Иегова».
translation_notes:
  register: Современный литературный русский с ясным повествовательным ритмом и сдержанно возвышенной прямой речью. Сохранены последовательные повеления и три реальные лексико-географические неоднозначности.
