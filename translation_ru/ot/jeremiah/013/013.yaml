  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י מְמַלֵּ֣א אֶת כָּל יֹשְׁבֵ֣י הָ/אָ֪רֶץ הַ/זֹּ֟את וְ/אֶת הַ/מְּלָכִ֣ים הַ/יֹּשְׁבִים֩ לְ/דָוִ֨ד עַל כִּסְא֜/וֹ וְ/אֶת הַ/כֹּהֲנִ֣ים וְ/אֶת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת כָּל יֹשְׁבֵ֥י יְרוּשָׁלִָ֖ם שִׁכָּרֽוֹן־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/013.yaml
  text: 'Then you shall say to them[a], ‘Thus says Yahweh: Behold, I am about to fill all the inhabitants of this land—and the kings who sit on David’s throne, and the priests, and the prophets[b], and all the inhabitants of Jerusalem—with drunkenness.’'
translation:
  language: ru
  text: 'И скажи им: «Так говорит Яхве: вот, Я наполню всех жителей этой земли — и царей, восседающих на престоле Давида[a], и священников, и пророков, и всех жителей Иерусалима — опьянением[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «царей, восседающих для Давида на его престоле»; необычная еврейская формулировка подчёркивает, что они являются преемниками Давида как цари его династии.'
    reason: lexical_alternative
  - marker: b
    text: «Опьянение» здесь, вероятно, образ ниспосланных Богом смятения и суда, однако сам конкретный образ намеренно сохранён.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: И скажи им
  rationale: Союз продолжает последовательность наставлений из предыдущего стиха, а форма глагола в данном контексте передаёт повеление пророку. Русское «скажи» естественнее тяжеловесного «ты скажешь».
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена традиционная пророческая формула и передано непосредственно стоящее в еврейском тексте личное имя Бога.
- source_word: הִנְנִי מְמַלֵּא
  choice: вот, Я наполню
  rationale: «Вот» сохраняет эмфатический указательный элемент הִנְנִי, а будущее совершенного вида естественно передаёт предстоящее решительное действие, выраженное причастием.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: всех жителей этой земли
  rationale: В контексте речь идёт о конкретной земле Иудеи, поэтому «земля», а не «мир»; יֹשְׁבֵי естественно передаётся словом «жители».
- source_word: הַמְּלָכִים הַיֹּשְׁבִים לְדָוִד עַל כִּסְאוֹ
  choice: царей, восседающих на престоле Давида
  rationale: Формулировка естественно выражает династическую преемственность царей Давиду; необычное לְדָוִד отмечено в сноске без создания неясной русской конструкции в основном тексте.
- source_word: הַכֹּהֲנִים וְאֶת הַנְּבִיאִים
  choice: священников, и пророков
  rationale: Прямое обозначение двух общественно-религиозных групп; текст не уточняет и не оценивает истинность названных пророков.
- source_word: כָּל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: всех жителей Иерусалима
  rationale: Последовательно передаёт повторяющееся יֹשְׁבֵי словом «жители».
- source_word: שִׁכָּרוֹן
  choice: опьянением
  rationale: «Опьянение» точно передаёт состояние, вызванное вином, хорошо сочетается с глаголом «наполню» и сохраняет конкретный образ окружающего контекста; «пьянство» могло бы ошибочно обозначать привычное поведение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; форма «Яхве» передаёт его непосредственно и не заменяет титулом.
- issue: Характер образа שִׁכָּרוֹן
  choice: Сохранить конкретный образ опьянения
  alternative: оцепенение; смятение
  rationale: В контексте образ связан с вином и служит выражением ниспосланного Богом суда и дезориентации. Основной текст не сводит многозначный пророческий образ к одному отвлечённому следствию.
- issue: Отношение царей к Давиду в выражении לְדָוִד עַל כִּסְאוֹ
  choice: на престоле Давида
  alternative: для Давида на его престоле; вместо Давида на его престоле
  rationale: Основной перевод передаёт династическую преемственность без искусственной русской формулы, а буквальная необычность и возможный оттенок представительства сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Формула «Так говорит Яхве» и частица «вот» сохраняют торжественность оригинала; перечисление и конечное «опьянением» воспроизводят риторическое напряжение еврейской фразы.
