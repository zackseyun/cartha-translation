base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/021.yaml
  text: What will you say when he appoints over you those whom you yourself taught to be leaders over you? Will not labor pains seize you like a woman giving birth?[a][b]
translation:
  language: ru
  text: Что ты скажешь, когда он поставит над тобой тех, кого ты сама приучила господствовать над тобой?[a][b] Не охватят ли тебя родовые муки, словно женщину в родах?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда он посетит тебя / накажет тебя». Еврейский глагол может означать «обратить внимание, посетить, наказать, назначить»; в данном контексте вероятно значение поставления правителей над Иудеей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «начальниками» либо «близкими друзьями». Еврейское слово может обозначать родовых вождей, начальников или близких людей; здесь, вероятно, имеются в виду те, чьего расположения Иуда добивалась и кто теперь стал властвовать над ней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֹּאמְרִי
  choice: Что ты скажешь
  rationale: Риторический вопрос обращён к олицетворённой Иудее в женском роде; несовершенный вид передан будущим временем.
- source_word: כִּי יִפְקֹד עָלַיִךְ
  choice: когда он поставит над тобой
  rationale: У פקד широкий диапазон значений, однако последующее указание на вождей и начальство поддерживает здесь значение назначения или поставления; субъект в еврейском тексте не назван.
- source_word: וְאַתְּ לִמַּדְתְּ אֹתָם
  choice: тех, кого ты сама приучила
  rationale: Порода пиэль глагола למד означает учить, обучать или приучать; самостоятельное местоимение וְאַתְּ подчёркнуто передано словом «сама».
- source_word: עָלַיִךְ אַלֻּפִים לְרֹאשׁ
  choice: быть твоими вождями
  rationale: Сочетание указывает на положение главенства над Иудеей; «вожди» сохраняет политический оттенок и вместе с тем допускает более широкий смысл слова אַלֻּפִים.
- source_word: הֲלוֹא חֲבָלִים יֹאחֱזוּךְ
  choice: Не схватят ли тебя муки
  rationale: הֲלוֹא вводит риторический вопрос с ожидаемым утвердительным ответом; образ родов однозначно задаёт значение родовых мук, а אחז передаёт внезапно охватывающую силу боли.
- source_word: כְּמוֹ אֵשֶׁת לֵדָה
  choice: как роженицу
  rationale: Краткое и естественное русское выражение для женщины, находящейся в родах.
theological_decisions:
- issue: Кто является подразумеваемым субъектом יִפְקֹד
  choice: Сохранено неопределённое «он»
  alternative: Господь; вражеский царь; чужеземный властитель
  rationale: Еврейский текст не называет субъекта. Уточнение могло бы преждевременно разрешить напряжение между действием Бога и действием чужеземной силы.
- issue: Характер отношений Иудеи с будущими правителями
  choice: «кого ты сама приучила быть твоими вождями»
  alternative: «которых ты сделала своими близкими друзьями»
  rationale: Контекст допускает мысль о взращённых Иудеей союзниках, ставших её начальниками; основной текст передаёт политическое подчинение, а лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение последовательно дано в женском роде. Формулировка сохраняет неназванного деятеля и лексическую неоднозначность ключевых слов в сносках.
