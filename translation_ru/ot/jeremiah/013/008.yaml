lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма с последовательным waw продолжает повествование; «И было» естественно вводит традиционную пророческую формулу и не добавляет отсутствующего в оригинале наречия времени.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: «Слово» сохраняет основное значение דָּבָר и устойчивый характер пророческой формулы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста, не заменяя имя титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица означает направление речи к пророку; по-русски в этой формуле естественно «ко мне».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив «говоря» вводит последующую прямую речь; в современном русском его функцию естественнее передать двоеточием без тяжеловесного буквального оборота.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и лаконизма пророческой формулы. Синтаксис близок к оригиналу, но לֵאמֹר передано русской пунктуацией, поскольку далее следует содержание речи.
