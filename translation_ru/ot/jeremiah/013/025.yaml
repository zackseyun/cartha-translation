id: JER.13.25
reference: Jeremiah 13:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: זֶ֣ה גוֹרָלֵ֧/ךְ מְנָת מִדַּ֛יִ/ךְ מֵֽ/אִתִּ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֙ שָׁכַ֣חַתְּ אוֹתִ֔/י וַֽ/תִּבְטְחִ֖י בַּ/שָּֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/025.yaml
  text: This is your lot[a], the portion measured out to you from me, declares Yahweh[b], because you have forgotten me and trusted in falsehood.
translation:
  language: ru
  text: Вот твой жребий[a], отмеренная тебе доля от Меня, — возвещает Яхве, — потому что ты забыла Меня и полагалась на ложь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «участь», «назначенная тебе доля». Еврейский текст сочетает слова «жребий» и «доля», подчёркивая то, что было ей назначено.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на обман». Еврейское слово может означать ложь, неправду или обман.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה גוֹרָלֵךְ
  choice: Вот твой жребий
  rationale: Указательное זֶה вводит судебное объявление, а גוֹרָל обозначает жребий и назначенную по жребию участь. «Вот» естественно передаёт предъявление результата.
- source_word: מְנָת מִדַּיִךְ
  choice: отмеренная тебе доля
  rationale: Сочетание מְנָה с формой от меры подчёркивает назначенную и отмеренную долю; перевод сохраняет образ меры и избегает буквального, но неясного «доля твоих мер».
- source_word: מֵאִתִּי
  choice: от Меня
  rationale: 'Предлог указывает на источник назначенной доли: приговор исходит от говорящего Бога.'
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Пророческая формула передана торжественным, но понятным современным глаголом; личное имя יהוה транслитерировано как «Яхве».
- source_word: אֲשֶׁר
  choice: потому что
  rationale: В данном контексте частица вводит основание объявленного суда.
- source_word: שָׁכַחַתְּ אוֹתִי
  choice: ты забыла Меня
  rationale: Сохранены женский род и единственное число прямого обращения к олицетворённой Иудее или Иерусалиму без добавления отсутствующего в стихе имени.
- source_word: וַתִּבְטְחִי בַּשָּׁקֶר
  choice: и полагалась на ложь
  rationale: בטח выражает доверие или опору, а שקר допускает значения лжи, обмана и ложного основания. «Полагалась на ложь» сохраняет широту обвинения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Адресат форм женского рода единственного числа
  choice: Сохранено прямое обращение «ты забыла… полагалась»
  alternative: Добавить «Иуда» или «Иерусалим»
  rationale: Еврейские формы ясно маркируют женский род и единственное число, но имя адресата в самом стихе не названо; его добавление неоправданно устранило бы контекстуальную открытость.
- issue: Смысл בַּשָּׁקֶר
  choice: на ложь
  alternative: на обман; на ложное
  rationale: Общее существительное не уточняет, идёт ли речь о лживых утверждениях, обманчивых объектах доверия или ложном культе; широкий перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией пророческого приговора. Женский род обращения сохранён. Заглавная буква в «Меня» используется как уважительное написание местоимения, относящегося к Богу.
