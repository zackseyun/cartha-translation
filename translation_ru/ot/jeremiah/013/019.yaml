base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/019.yaml
  text: The cities of the Negev are shut up[a], with no one to open them; all Judah has been carried away into exile[c][b], wholly carried away into exile.
translation:
  language: ru
  text: Города Негева заперты[a], и некому открыть их. Вся Иудея уведена в изгнание[b] — уведена в изгнание полностью[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «города юга». «Негев» может означать конкретную южную область Иудеи.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Иудея изгнана, вся она; изгнана полностью». Страдательная форма указывает на вынужденное переселение.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «уведена в изгнание с миром», однако в данном контексте выражение, вероятнее всего, подчёркивает полноту изгнания.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָרֵי הַנֶּגֶב
  choice: города Негева
  rationale: נֶגֶב может обозначать как юг вообще, так и конкретную засушливую южную область Иудеи. Географическое название «Негев» сохраняет эту конкретность, не исключая более широкого понимания.
- source_word: סֻגְּרוּ
  choice: заперты
  rationale: 'Страдательная форма описывает наступившее состояние: города закрыты и недоступны. «Заперты» сохраняет яркий образ и хорошо сочетается с последующим «открыть».'
- source_word: וְאֵין פֹּתֵחַ
  choice: и некому открыть их
  rationale: Так естественно по-русски передаётся отсутствие того, кто мог бы открыть запертые города; местоимение «их» ясно восстанавливает подразумеваемое дополнение.
- source_word: הָגְלָת
  choice: уведена в изгнание
  rationale: Хофал от גלה выражает вынужденное действие над Иудеей, а не добровольный уход. Формулировка передаёт насильственное изгнание и сохраняет страдательность.
- source_word: יְהוּדָה כֻּלָּהּ
  choice: вся Иудея
  rationale: Кратко и естественно передаёт охват всей Иудеи, выраженный כֻּלָּהּ.
- source_word: הָגְלָת שְׁלוֹמִים
  choice: уведена полностью
  rationale: Повтор глагола сохранён ради еврейского усиления, а שְׁלוֹמִים передано наречием полноты. Это поддерживает параллелизм с «вся Иудея» и не вносит маловероятную здесь идею мирного изгнания.
theological_decisions:
- issue: Значение שְׁלוֹמִים в формуле изгнания
  choice: 'обстоятельственное значение полноты: «полностью»'
  alternative: «с миром» или «мирно»
  rationale: Хотя слово связано с שלום, повтор формулы изгнания и параллель с כֻּלָּהּ указывают прежде всего на полноту суда. Возможность значения «с миром» сохраняется в примечании, поскольку форма допускает такое прочтение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Сохранены страдательные конструкции, повтор глагола и напряжение между основным прочтением שְׁלוֹמִים как указанием на полноту и возможным значением «с миром».
