base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/012.yaml
  text: 'So you shall say to them this word: Thus says the LORD, the God of Israel, ‘Every jar will be filled with wine.’ And they will say to you, ‘Do we not certainly know that every jar will be filled with wine?’'
translation:
  language: ru
  text: 'И скажи им вот что: «Так говорит ГОСПОДЬ, Бог Израиля: „Каждый кувшин наполнится вином“». Они скажут тебе: «Разве мы не знаем наверняка, что каждый кувшин наполнится вином?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵבֶל
  choice: кувшин
  rationale: Обозначает сосуд, здесь предназначенный для вина; «кувшин» естественно и понятно передаёт образ без излишнего уточнения материала или формы.
- source_word: יִמָּלֵא
  choice: наполнится
  rationale: Форма выражает будущее/модальное утверждение; возвратная форма по-русски естественно передаёт «будет наполнен» и сохраняет повтор формулы.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона титулом в прописном написании, отличающем его от обычного «Господь».
- source_word: הֲיָדֹעַ לֹא נֵדַע
  choice: Разве мы не знаем
  rationale: Инфинитив абсолютный с личной формой усиливает глагол; русская риторическая конструкция уже естественно выражает уверенность говорящих, не требуя тяжеловесного «доподлинно».
theological_decisions:
- issue: Передача имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Выбран общеупотребительный в русской библейской традиции эквивалент; он не привносит конфессионального толкования и графически указывает на особое Божье имя.
- issue: Характер ответа слушателей
  choice: Риторический вопрос, выражающий очевидность сказанного
  alternative: «Мы ведь наверняка знаем…»
  rationale: Еврейская вопросительная частица и отрицание сохранены; ответ звучит как возражение на самоочевидное утверждение, не раскрывая заранее смысл последующего пророческого образа.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой формулой. Сохранены прямое обращение, повтор слов о каждом кувшине и риторический характер ответа.
