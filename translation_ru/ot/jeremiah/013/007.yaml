base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/007.yaml
  text: So I went to Perath[a], and dug, and took the waistband from the place where I had hidden it. And behold, the waistband was ruined[b]; it was good for nothing.
translation:
  language: ru
  text: И пошёл я в Перат[a], раскопал землю и взял пояс[b] с того места, где спрятал его. И вот, пояс истлел и стал совершенно непригоден.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перат, возможно, означает Евфрат; в еврейском тексте стоит географическое название «Перат».
    reason: alternative_reading
  - marker: b
    text: 'Или: «опоясание», «набедренная повязка» либо «кушак». Еврейское слово обозначает предмет одежды, носимый вокруг талии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָתָה
  choice: в Перат
  rationale: Сохранено еврейское географическое название без отождествления его в основном тексте с Евфратом; направительное окончание передано предлогом «в».
- source_word: אֵזוֹר
  choice: пояс
  rationale: Слово обозначает предмет одежды, носимый вокруг талии. «Пояс» — естественный и достаточно широкий русский эквивалент, не уточняющий без основания его форму.
- source_word: טְמַנְתִּיו
  choice: где спрятал его
  rationale: Глагол означает «прятать, скрывать», нередко в земле. Поскольку действие раскапывания уже названо, перевод не дублирует его словом «закопал».
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт указательно-эмфатическую функцию частицы и привлекает внимание к неожиданному состоянию найденного пояса.
- source_word: נִשְׁחַת
  choice: истлел
  rationale: В данном предметном контексте форма описывает порчу и разрушение спрятанного пояса; «истлел» естественно указывает на его физическое разрушение.
- source_word: לֹא יִצְלַח לַכֹּל
  choice: стал совершенно непригоден
  rationale: Русская формулировка передаёт полную бесполезность предмета; לַכֹּל в отрицательной конструкции усиливает значение «ни на что не годен».
- source_word: וָאֵלֵךְ ... וָאֶחְפֹּר ... וָאֶקַּח
  choice: И пошёл я ... раскопал ... и взял
  rationale: Последовательность повествовательных форм передана цепью совершенных глаголов, обозначающих сменяющие друг друга действия.
