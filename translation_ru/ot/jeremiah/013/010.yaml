base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/010.yaml
  text: This evil people[a], who refuse to hear my words, who walk in the stubbornness of their heart, and who go after other gods to serve them and to bow down to them, will become like this waistband, which is good for nothing.
translation:
  language: ru
  text: Этот злой народ, который отказывается слушать Мои слова, следует упрямству своего сердца и идёт вслед за другими богами, чтобы служить им и поклоняться им, станет как этот пояс[a], ни на что не годный.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «набедренная повязка». Еврейское אֵזוֹר обозначает предмет одежды, который носили вокруг талии; в данном повествовании его можно понимать как пояс или набедренную повязку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם הַזֶּה הָרָע
  choice: этот злой народ
  rationale: Существительное עָם обозначает здесь народ Иудеи и Иерусалима как единое целое; רַע сохраняет суровую нравственную оценку «злой».
- source_word: הַמֵּאֲנִים לִשְׁמוֹעַ אֶת־דְּבָרַי
  choice: который отказывается слушать Мои слова
  rationale: מָאֵן выражает сознательный отказ, а не простую неспособность услышать; множественное число «слова» сохранено.
- source_word: הַהֹלְכִים בִּשְׁרִרוּת לִבָּם
  choice: живёт по упрямству своего сердца
  rationale: Буквальное «ходит в упрямстве» по-русски неестественно; «живёт по» передаёт постоянный образ действий, а «упрямство» — смысл שְׁרִרוּת. Единственное число согласовано с собирательным «народ».
- source_word: וַיֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: идёт вслед за другими богами
  rationale: Оборот сохраняет образ следования за чужими богами и в контексте описывает продолжающееся отступничество народа.
- source_word: לְעָבְדָם
  choice: чтобы служить им
  rationale: עבד обозначает служение и преданность божествам; отдельный глагол позволяет не смешивать его со следующим обозначением поклонения.
- source_word: וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: и поклоняться им
  rationale: השתחוה обозначает земной поклон или простирание перед кем-либо; «поклоняться» естественно передаёт это действие в современном русском языке.
- source_word: וִיהִי כָּאֵזוֹר הַזֶּה
  choice: станет как этот пояс
  rationale: «Станет» передаёт переход к предсказанному состоянию; אֵזוֹר — предмет одежды, носимый вокруг талии, поэтому выбрано общее слово «пояс».
- source_word: אֲשֶׁר לֹא יִצְלַח לַכֹּל
  choice: ни на что не годный
  rationale: Русский идиоматический оборот точно выражает полную бесполезность предмета.
theological_decisions:
- issue: Различение двух действий в идолопоклонстве
  choice: «служить им и поклоняться им»
  alternative: Передать оба глагола одним общим понятием «поклоняться»
  rationale: 'В еврейском тексте употреблены два разных глагола — עבד и השתחוה. Их различение сохраняет полноту обвинения: служение чужим богам и поклонение перед ними.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис упрощён лишь настолько, чтобы длинная цепочка характеристик оставалась понятной; собирательное «народ» последовательно требует единственного числа.
