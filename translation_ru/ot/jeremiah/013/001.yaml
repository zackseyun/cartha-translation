source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֵלַ֗/י הָל֞וֹךְ וְ/קָנִ֤יתָ לְּ/ךָ֙ אֵז֣וֹר פִּשְׁתִּ֔ים וְ/שַׂמְתּ֖/וֹ עַל מָתְנֶ֑י/ךָ וּ/בַ/מַּ֖יִם לֹ֥א תְבִאֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/001.yaml
  text: 'Thus Yahweh said to me: “Go and buy yourself a linen waistband[a], and put it on your waist, but do not put it in water.”'
translation:
  language: ru
  text: 'Так сказал мне Яхве: «Пойди, купи себе льняной пояс[a] и надень его на талию, но в воду его не клади».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «льняной кушак», «льняная повязка»; возможно, «льняная набедренная повязка». Еврейское אֵזוֹר обозначает предмет одежды, который носили вокруг талии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так сказал
  rationale: Сохраняет торжественную пророческую формулу и естественно звучит в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, не заменяя его титулом.
- source_word: הָלוֹךְ וְקָנִיתָ לְּךָ
  choice: Пойди, купи себе
  rationale: Императивно передаёт идиоматическую силу инфинитива הָלוֹךְ с последующим глаголом и сохраняет возвратный оттенок לְּךָ.
- source_word: אֵזוֹר פִּשְׁתִּים
  choice: льняной пояс
  rationale: Пִשְׁתִּים обозначает лён, а אֵזוֹר — предмет одежды, носимый вокруг талии; «пояс» естественен по-русски, но не устраняет лексическую неоднозначность, отмеченную в сноске.
- source_word: וְשַׂמְתּוֹ עַל מָתְנֶיךָ
  choice: и надень его на талию
  rationale: По отношению к предмету одежды русское «надень» естественнее буквального «положи»; מָתְנַיִם здесь обозначает область талии/чресел.
- source_word: וּבַמַּיִם לֹא תְבִאֵהוּ
  choice: но в воду его не клади
  rationale: Передаёт каузативное значение формы בוא — не вводить и не помещать предмет в воду — без уточнения, что речь непременно идёт о погружении или стирке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным тоном пророческой речи. Синтаксис прост и понятен; неоднозначность вида поясного предмета одежды сохранена в сноске.
