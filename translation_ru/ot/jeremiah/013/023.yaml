  text: הֲ/יַהֲפֹ֤ךְ כּוּשִׁי֙ עוֹר֔/וֹ וְ/נָמֵ֖ר חֲבַרְבֻּרֹתָ֑י/ו גַּם אַתֶּם֙ תּוּכְל֣וּ לְ/הֵיטִ֔יב לִמֻּדֵ֖י הָרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/023.yaml
  text: Can a Cushite change his skin[b][a], or a leopard its spots? Then you also can do good—you who are trained in evil.
translation:
  language: ru
  text: Может ли кушит[a] изменить свою кожу, а леопард — свои пятна? Тогда и вы сможете делать добро — вы, приученные ко злу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эфиоп». В еврейском тексте буквально: «кушит», то есть человек из земли Куш.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «наученные злу»; речь идёт о тех, кто привык ко злу и укоренился в нём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: кушит
  rationale: Прямо передаёт еврейский этноним и не подменяет его более поздним географическим названием «эфиоп».
- source_word: הֲיַהֲפֹךְ
  choice: может ли… изменить
  rationale: В риторическом вопросе глагол означает изменение природного свойства; такая формулировка естественна по-русски.
- source_word: עוֹרוֹ
  choice: свою кожу
  rationale: Точный и естественный русский эквивалент; возвратное местоимение ясно соотносит кожу с кушитом.
- source_word: נָמֵר
  choice: леопард
  rationale: Стандартное лексическое соответствие.
- source_word: חֲבַרְבֻּרֹתָיו
  choice: свои пятна
  rationale: Передаёт характерные отметины леопарда и сохраняет традиционный, понятный образ.
- source_word: גַּם אַתֶּם תּוּכְלוּ
  choice: Тогда и вы сможете
  rationale: 'Сохраняет ироническое следствие: адресаты смогут делать добро лишь в том случае, если возможны названные прежде невозможные изменения.'
- source_word: לְהֵיטִיב
  choice: делать добро
  rationale: Кратко и естественно передаёт значение «поступать хорошо, делать добро».
- source_word: לִמֻּדֵי הָרֵעַ
  choice: приученные ко злу
  rationale: Сохраняет пассивный оттенок формы и выражает укоренившуюся привычку к злу, не сводя выражение лишь к интеллектуальному обучению.
theological_decisions:
- issue: Нравственная неспособность, выраженная риторическим сравнением
  choice: Стих говорит об укоренившейся привычке адресатов ко злу через сравнение с невозможностью изменить природные признаки.
  alternative: Понимать стих как универсальное систематическое утверждение о полной неспособности всех людей либо как простую гиперболу без реального указания на нравственную неспособность.
  rationale: Еврейский текст связывает способность делать добро с двумя риторически невозможными изменениями. Перевод сохраняет силу этого образа, не расширяя его до доктринального тезиса, выходящего за пределы контекста.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Риторическая сила исходного образа и его намеренная ирония сохранены; архаизмы и конфессионально окрашенные формулировки не использованы.
