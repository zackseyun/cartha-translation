  text: תְּנוּ֩ לַ/יהוָ֨ה אֱלֹהֵי/כֶ֤ם כָּבוֹד֙ בְּ/טֶ֣רֶם יַחְשִׁ֔ךְ וּ/בְ/טֶ֛רֶם יִֽתְנַגְּפ֥וּ רַגְלֵי/כֶ֖ם עַל הָ֣רֵי נָ֑שֶׁף וְ/קִוִּיתֶ֤ם לְ/אוֹר֙ וְ/שָׂמָ֣/הּ לְ/צַלְמָ֔וֶת ישית לַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/016.yaml
  text: Give glory to Yahweh your God before he brings darkness[a], and before your feet stumble on the mountains at twilight. Then you will hope for light, but he will make it deep darkness; he will turn it into gloom.
translation:
  language: ru
  text: Воздайте славу Господу, вашему Богу, прежде чем Он наведёт тьму и прежде чем ваши ноги споткнутся на горах в сумерках. А вы будете надеяться на свет, но Он обратит его в глубокую тьму[a] и во мрак.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному переводу: «в тень смерти». Еврейское слово может означать как смертную тьму, так и очень глубокую тьму.'
    reason: Сохраняет лексическую неоднозначность צַלְמָוֶת и привязано непосредственно к его передаче в основном тексте.
lexical_decisions:
- source_word: תְּנוּ ... כָּבוֹד
  choice: Воздайте славу
  rationale: Устойчивая и достойная русская передача идиомы «дать/воздать славу», сохраняющая повелительное наклонение и смысл признания Божьей чести.
- source_word: לַיהוָה
  choice: Господу
  rationale: Традиционная русская передача тетраграмматона יהוה, естественная для библейского регистра.
- source_word: אֱלֹהֵיכֶם
  choice: вашему Богу
  rationale: Точно передаёт существительное с суффиксом второго лица множественного числа.
- source_word: יַחְשִׁךְ
  choice: Он наведёт тьму
  rationale: Сохраняет вероятную каузативную силу формы и Божье действие как источник грядущего суда; прописная буква ясно указывает на Господа.
- source_word: יִתְנַגְּפוּ רַגְלֵיכֶם
  choice: ваши ноги споткнутся
  rationale: Естественно передаёт образ ног, ударяющихся о препятствие в темноте.
- source_word: עַל הָרֵי נָשֶׁף
  choice: на горах в сумерках
  rationale: Передаёт נָשֶׁף как сумерки и не превращает сочетание в не засвидетельствованное географическое название.
- source_word: וְקִוִּיתֶם לְאוֹר
  choice: Вы будете надеяться на свет
  rationale: Сохраняет значение ожидания с надеждой; отдельное предложение естественно выражает развитие предупреждения.
- source_word: וְשָׂמָהּ לְצַלְמָוֶת
  choice: но Он обратит его в глубокую тьму
  rationale: Местоимение отнесено к свету; צַלְמָוֶת передано как предельно густая тьма без навязывания спорной этимологии «тень смерти».
- source_word: יָשִׁית לַעֲרָפֶל
  choice: превратит его во мрак
  rationale: Передаёт параллельное усиление образа тьмы и сохраняет объект — ожидаемый свет.
theological_decisions:
- issue: Божье участие в наступлении тьмы
  choice: Господь активно наводит тьму и обращает ожидаемый свет во мрак.
  alternative: Наступление тьмы понимается как безличный или естественный процесс.
  rationale: Каузативная форма יַחְשִׁךְ и последующие глаголы с подразумеваемым божественным субъектом поддерживают прямое указание на Божий суд.
- issue: Значение צַלְמָוֶת
  choice: глубокая тьма
  alternative: тень смерти
  rationale: Слово может обозначать смертную или чрезвычайно густую тьму. Основной текст передаёт контекстуальный образ, а традиционная формулировка сохранена в примечании, не устраняя лексической неоднозначности.
translation_notes:
  register: Современный литературный русский с достоинством пророческого призыва. «Воздайте славу» сохраняет узнаваемый библейский регистр без архаизации; синтаксис разделён на два предложения ради ясности. Местоимение «Он» относится к Господу.
