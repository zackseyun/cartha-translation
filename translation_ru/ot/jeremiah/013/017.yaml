source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א תִשְׁמָע֔וּ/הָ בְּ/מִסְתָּרִ֥ים תִּבְכֶּֽה נַפְשִׁ֖/י מִ/פְּנֵ֣י גֵוָ֑ה וְ/דָמֹ֨עַ תִּדְמַ֜ע וְ/תֵרַ֤ד עֵינִ/י֙ דִּמְעָ֔ה כִּ֥י נִשְׁבָּ֖ה עֵ֥דֶר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/017.yaml
  text: But if you will not listen[a], my soul will weep in secret because of pride; my eyes will weep bitterly and run down with tears[e][d][c][b], because the flock of Yahweh has been taken captive.
translation:
  language: ru
  text: Но если вы не послушаетесь[a], душа моя будет плакать втайне[b] из-за гордыни[c]; глаза мои будут плакать и плакать[d], и слёзы потекут из них, потому что стадо Яхве[e] уведено в плен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не послушаетесь её». Женский суффикс, вероятно, относится к сказанному предостережению; глагол может означать также «не услышите» или «не станете слушаться».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в укромных местах».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «из-за высокомерия».'
    reason: lexical_alternative
  - marker: d
    text: 'Еврейская конструкция усиливает действие: буквально «плача, будет плакать».'
    reason: lexical_alternative
  - marker: e
    text: 'Или, при традиционной замене Божьего имени титулом: «стадо Господа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁמָעוּהָ
  choice: не послушаетесь
  rationale: Глагол שׁמע может означать «слышать», «слушать» и «слушаться». В контексте призыва внять пророческому предостережению «послушаетесь» естественно соединяет восприятие речи с повиновением; женский объектный суффикс отмечен в сноске, поскольку его референт в русском тексте без добавочного существительного выразить затруднительно.
- source_word: בְּמִסְתָּרִים
  choice: втайне
  rationale: Буквально множественное число означает «в укромных местах»; наречие «втайне» естественно передаёт скрытый характер плача.
- source_word: תִּבְכֶּה נַפְשִׁי
  choice: душа моя будет плакать
  rationale: Сохранены существительное נֶפֶשׁ и поэтическое олицетворение внутреннего страдания пророка.
- source_word: מִפְּנֵי גֵוָה
  choice: из-за гордыни
  rationale: Предлог выражает причину, а גֵוָה здесь обозначает гордость или высокомерие народа. «Гордыня» уместно передаёт порочную, упорную гордость без уточнения, отсутствующего в тексте.
- source_word: וְדָמֹעַ תִּדְמַע
  choice: будет плакать и плакать
  rationale: Инфинитив абсолютный при личной форме усиливает действие. Повтор по-русски сохраняет формальную интенсивность и плачевную интонацию еврейского выражения.
- source_word: וְתֵרַד עֵינִי דִּמְעָה
  choice: глаз мой … будет истекать слезами
  rationale: Сохранён поэтический единственный «глаз мой». Идиома «истекать слезами» естественно передаёт образ непрерывно текущих слёз.
- source_word: נִשְׁבָּה
  choice: уведено в плен
  rationale: Нифаль глагола שׁבה означает быть захваченным или уведённым в плен; формулировка отражает как пленение, так и удаление стада.
- source_word: עֵדֶר יְהוָה
  choice: стадо Яхве
  rationale: Сохранены пастушеский образ народа, принадлежащего Богу, и личное имя יְהוָה в транслитерации.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
theological_decisions:
- issue: Референт женского суффикса в תִשְׁמָעוּהָ
  choice: Не уточнять референт в основном тексте и отметить суффикс в сноске
  alternative: «не послушаетесь её», понимая под «ней» речь или весть
  rationale: Контекст указывает на только что произнесённое пророческое предостережение, однако еврейский текст не называет его существительным. Русское «её» без явного антецедента было бы неясным, а добавление «вести» чрезмерно конкретизировало бы референт.
- issue: Голос плача
  choice: Сохранить первое лицо без определения, принадлежит ли скорбь только Иеремии или также передаёт скорбь Бога через пророка
  alternative: Явно истолковать плач как плач одного Иеремии либо самого Яхве
  rationale: Грамматически говорит пророк, но пророческая речь допускает звучание божественной скорби. Перевод сохраняет эту богословскую глубину, не разрешая напряжение.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной пророческой образности. Инверсия «душа моя», «глаз мой» поддерживает поэтический строй, оставаясь понятной. Повтор «плакать и плакать» намеренно передаёт еврейское усиление; имя Яхве употреблено последовательно.
