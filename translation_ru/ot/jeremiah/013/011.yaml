source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ יִדְבַּ֨ק הָ/אֵז֜וֹר אֶל מָתְנֵי אִ֗ישׁ כֵּ֣ן הִדְבַּ֣קְתִּי אֵ֠לַ/י אֶת כָּל בֵּ֨ית יִשְׂרָאֵ֜ל וְ/אֶת כָּל בֵּ֤ית יְהוּדָה֙ נְאֻם יְהוָ֔ה לִֽ/הְי֥וֹת לִ/י֙ לְ/עָ֔ם וּ/לְ/שֵׁ֥ם וְ/לִ/תְהִלָּ֖ה וּ/לְ/תִפְאָ֑רֶת וְ/לֹ֖א שָׁמֵֽעוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/011.yaml
  text: For as the waistband clings to a man's waist[a], so I made the whole house of Israel and the whole house of Judah cling to me, declares Yahweh, to be for me a people, a name, a praise, and a glory[c][b], but they did not listen.
translation:
  language: ru
  text: «Ибо как пояс прилегает к пояснице человека[a], так Я сделал, чтобы весь дом Израиля и весь дом Иуды прилепились ко Мне, — говорит Яхве, — чтобы быть Мне народом, именем, хвалой и славой. Но они не послушали[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к пояснице человека». Слово, переведённое как «пояс», может также обозначать кушак или, возможно, набедренную повязку; «поясница» также может передаваться как «бёдра».'
    reason: Лексические варианты для הָאֵזוֹר и מָתְנֵי אִישׁ; сохраняет родовое значение единственного числа אִישׁ.
  - marker: b
    text: «Не послушали» может также означать «не повиновались».
    reason: Смысловой диапазон еврейского שׁמע.
lexical_decisions:
- source_word: הָאֵזוֹר
  choice: пояс
  rationale: «Пояс» естественно обозначает предмет, носимый вокруг поясницы, не сужая значение до набедренной повязки и не придавая ему обязательно декоративного характера.
- source_word: יִדְבַּק / הִדְבַּקְתִּי
  choice: прилегает / сделал, чтобы … прилепился
  rationale: 'Сохраняется повтор одного еврейского корня: сначала физическое плотное прилегание пояса, затем близкая, обусловленная Богом связь народа с Ним. Развёрнутая каузативная конструкция передаёт форму гифиль без неестественного русского «прилепил».'
- source_word: מָתְנֵי אִישׁ
  choice: к пояснице человека
  rationale: מָתְנַיִם обозначает область поясницы или бёдер; «поясница» непосредственно соответствует образу пояса. «Человек» естественно передаёт родовое употребление единственного числа אִישׁ в русском языке.
- source_word: אֵלַי
  choice: ко Мне
  rationale: Передаёт направленность и близкую связь с говорящим Богом.
- source_word: כָּל בֵּית יִשְׂרָאֵל וְאֶת כָּל בֵּית יְהוּדָה
  choice: весь дом Израиля и весь дом Иуды
  rationale: Сохранено корпоративно-родовое слово «дом» и повторённое значение כָּל, выраженное по-русски при каждом однородном члене.
- source_word: נְאֻם יְהוָה
  choice: говорит Яхве
  rationale: Естественная торжественная пророческая формула; личное имя יהוה передано как «Яхве».
- source_word: לִהְיוֹת לִי לְעָם
  choice: чтобы быть Мне народом
  rationale: Сохранены целевая конструкция и оттенок принадлежности, не заменённые более истолковывающим «чтобы быть Моим народом».
- source_word: לְשֵׁם וְלִתְהִלָּה וּלְתִפְאָרֶת
  choice: именем, хвалой и славой
  rationale: Сохранён компактный ряд существительных и его напряжённая буквальная образность; «слава» естественно передаёт широкий диапазон תִּפְאֶרֶת — великолепие, честь, слава.
- source_word: וְלֹא שָׁמֵעוּ
  choice: Но они не послушали
  rationale: «Не послушали» по-русски удерживает и значение отказа слушать, и подразумеваемое неповиновение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное заветное имя יהוה; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Кто является целью ряда «народом, именем, хвалой и славой»
  choice: Сохранить единый ряд дополнений при «быть Мне»
  alternative: Развернуть как «Моим народом, Моей славой и предметом хвалы»
  rationale: Буквальная структура сохраняет богословски насыщенную сжатость оригинала и не решает за читателя, как именно соотносятся «имя», «хвала» и «слава» с Яхве и народом.
- issue: Причинное значение הִדְבַּקְתִּי
  choice: сделал, чтобы … прилепился
  alternative: прилепил к Себе; привязал к Себе
  rationale: Выбранная форма ясно передаёт действие Бога и одновременно сохраняет глагол тесного прилепления, не превращая образ в физическое насилие или иную метафору.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Сохранены образ пояса, повтор мотива тесного прилегания, названия «дом Израиля» и «дом Иуды», а также намеренно сжатый ряд «народом, именем, хвалой и славой». Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской издательской норме.
