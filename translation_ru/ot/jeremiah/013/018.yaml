base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/018.yaml
  text: Say to the king and to the queen mother[a], ‘Humble yourselves; sit down[b], for your glorious crown has come down from your heads.’
translation:
  language: ru
  text: 'Скажи царю и царице-матери[a]: «Смиритесь, сядьте, ибо с ваших голов сошёл ваш великолепный венец[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское גְּבִירָה — придворный титул, который здесь, вероятнее всего, обозначает мать царя, а не его жену.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «венец вашего великолепия» или «венец вашей славы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Скажи
  rationale: Форма повелительного наклонения единственного числа вводит пророческое поручение передать слова двум царственным адресатам.
- source_word: לַמֶּלֶךְ
  choice: царю
  rationale: Определённое существительное с предлогом прямо обозначает царствующего царя.
- source_word: וְלַגְּבִירָה
  choice: и царице-матери
  rationale: В придворном контексте גְּבִירָה является титулом высокопоставленной царственной женщины и часто обозначает мать царя, а не его супругу.
- source_word: הַשְׁפִּילוּ שֵׁבוּ
  choice: Смиритесь и сядьте пониже
  rationale: Сочетание двух повелительных форм передаёт как утрату высокого положения, так и образ физического перемещения на более низкое место. Русская формулировка сохраняет оба оттенка и звучит естественно.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание для предшествующего повеления; «ибо» соответствует сжатому и торжественному пророческому стилю.
- source_word: יָרַד
  choice: сошёл
  rationale: Глагол буквально выражает движение вниз. Выбор сохраняет образ, не уточняя без основания, упал ли венец или был снят.
- source_word: מַרְאֲשׁוֹתֵיכֶם
  choice: с ваших голов
  rationale: Хотя форма может обозначать место у изголовья, упоминание венца ясно указывает здесь на головы, на которых он находился.
- source_word: עֲטֶרֶת תִּפְאַרְתְּכֶם
  choice: ваш великолепный венец
  rationale: Естественная русская передача конструкции «венец вашего великолепия/славы», сохраняющая царственный предмет и значение красоты, величия и почёта.
