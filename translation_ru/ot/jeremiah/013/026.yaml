  yaml_path: translation/ot/jeremiah/013/026.yaml
  text: So I myself have also lifted up your skirts over your face[c][b][a], and your shame has been seen.
translation:
  language: ru
  text: И Я также сам подниму подол твоей одежды тебе на лицо[a], и станет виден твой позор[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обнажу края твоей одежды поверх твоего лица». Образ изображает насильственное публичное обнажение и унижение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и твой позор станет видимым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: И
  rationale: Связывает стих с продолжающейся речью о суде; добавочное значение частицы גם передано общим усилением конструкции «Я сам», поскольку буквальное «и также Я» звучит по-русски тяжеловесно.
- source_word: אֲנִי
  choice: Я сам
  rationale: Отдельное местоимение при личной форме глагола эмфатично и подчёркивает, что действие совершает сам Господь.
- source_word: חָשַׂפְתִּי
  choice: подниму
  rationale: Глагол означает «обнажить, открыть»; применительно к подолу одежды естественное русское «подниму» сохраняет конкретный образ насильственного обнажения. Перфект допускает пророческое представление будущего суда как решённого; в русском контексте естественно будущее время.
- source_word: שׁוּלַיִךְ
  choice: подол твоей одежды
  rationale: Форма обозначает нижние края или полы одежды; единственное собирательное «подол одежды» понятно современному читателю и не создаёт лишней ассоциации с несколькими юбками.
- source_word: עַל פָּנַיִךְ
  choice: до самого лица
  rationale: 'Передаёт пространственный образ: одежда поднята поверх, вплоть до лица. Частица «самого» усиливает наглядность, не добавляя нового содержания.'
- source_word: וְנִרְאָה
  choice: и все увидят
  rationale: Нифаль буквально выражает, что позор станет видимым. Активная безлично-обобщённая конструкция естественнее по-русски и сохраняет смысл публичного обнаружения.
- source_word: קְלוֹנֵךְ
  choice: твой позор
  rationale: Слово обозначает публичное бесчестье и унижение; «позор» точнее «стыда» передаёт социальную, видимую сторону образа.
theological_decisions:
- issue: Образ публичного обнажения как Божьего суда
  choice: Сохранить конкретный образ поднятого подола и ставшего видимым позора.
  alternative: Смягчить образ до общего указания на бесчестье.
  rationale: Еврейский текст намеренно использует резкий образ насильственного публичного унижения Иерусалима. Смягчение ослабило бы пророческое обличение.
- issue: Временная форма пророческого суда
  choice: 'Передать еврейский перфект русским будущим временем: «подниму… увидят».'
  alternative: 'Передать совершённым видом прошедшего времени: «поднял… стал виден».'
  rationale: В контексте угроза суда провозглашается как предстоящее, но твёрдо решённое действие. Русское будущее яснее выражает контекстуальную временную отнесённость, сохраняя категоричность пророчества.
translation_notes:
  register: Современный литературный русский язык; тон резкий и торжественный, соответствующий пророческой речи. Женский род местоимений сохранён как обращение к Иерусалиму. Конкретность образа не смягчена, но формулировка избегает архаизмов и неестественного буквального синтаксиса.
