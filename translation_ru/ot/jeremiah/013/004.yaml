base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/004.yaml
  text: Take the waistband that you bought[a], which is on your waist, and arise, go to Perath, and hide it there in a crevice of the rock.
translation:
  language: ru
  text: Возьми пояс, который ты купил, — тот, что у тебя на талии; встань, иди к Перату[a] и спрячь его там, в расщелине скалы».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перат традиционно отождествляют с Евфратом; поэтому во многих переводах здесь стоит «к Евфрату».
    reason: alternative_reading
lexical_decisions:
- source_word: אֵזוֹר
  choice: пояс
  rationale: Обозначает предмет, носимый вокруг талии. «Пояс» — естественное современное русское соответствие, не уточняющее без необходимости, был ли это ремень, кушак или набедренная повязка.
- source_word: קָנִיתָ
  choice: ты купил
  rationale: Глагол может означать «приобрести» или «купить»; ближайший контекст повеления раздобыть этот предмет допускает конкретное и естественное «купил».
- source_word: עַל מָתְנֶיךָ
  choice: у тебя на талии
  rationale: Передаёт положение предмета на пояснице/талии современным русским языком без архаического «на чреслах».
- source_word: וְקוּם
  choice: встань
  rationale: Прямое соответствие повелительной форме; сохраняет последовательность энергичных указаний и звучит естественно по-русски.
- source_word: פְּרָתָה
  choice: в Перат
  rationale: Сохранено как транслитерированное географическое название, поскольку его отождествление с Евфратом традиционно, но не бесспорно.
- source_word: טָמְנֵהוּ
  choice: спрячь его
  rationale: Глагол означает сокрытие и не требует более узкого «закопай», которое добавило бы прямо не названный способ действия.
- source_word: נְקִיק
  choice: расщелина
  rationale: Точно и естественно передаёт трещину или углубление в скале, пригодное для сокрытия предмета.
- source_word: הַסָּלַע
  choice: скала
  rationale: В данном сочетании «расщелина скалы» естественно передаёт סֶלַע как массивную скальную породу или утёс.
theological_decisions:
- issue: Отождествление פְּרָתָה
  choice: В основном тексте передать как географическое название «Перат»
  alternative: Евфрат
  rationale: 'Еврейская форма допускает традиционное понимание как Евфрат, однако географическая идентификация обсуждается. Поэтому неоднозначность сохраняется: название транслитерировано в тексте, а традиционный вариант дан в сноске.'
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным тоном. Последовательность повелений сохранена. Кавычка в конце отражает завершение прямой речи в контексте стиха.
