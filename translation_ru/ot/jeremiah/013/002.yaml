  yaml_path: translation/ot/jeremiah/013/002.yaml
  text: So I bought the loincloth according to the word of Yahweh[a], and put it on my waist.
translation:
  language: ru
  text: И я купил пояс[a], как повелел Яхве, и обвязал им поясницу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «набедренную повязку» или «кушак»; еврейское слово обозначает предмет одежды, носимый вокруг пояса близко к телу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְנֶה
  choice: И я купил
  rationale: Форма wayyiqtol от קנה продолжает последовательное повествование; «купил» прямо передаёт значение глагола.
- source_word: הָאֵזוֹר
  choice: пояс[a]
  rationale: אֵזוֹר обозначает предмет одежды, которым опоясывались; в данном контексте возможны также более конкретные понимания — набедренная повязка или кушак. Основной вариант сохраняет широту значения еврейского слова.
- source_word: כִּדְבַר יְהוָה
  choice: как повелел Яхве
  rationale: Буквально «согласно слову Яхве»; в контексте исполнения ранее данного указания естественный русский эквивалент — «как повелел Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: וָאָשִׂם עַל מָתְנָי
  choice: и обвязал им поясницу
  rationale: Буквально «и поместил на мои бёдра/поясницу». С учётом предмета одежды глагол «обвязал» естественно передаёт способ ношения, а «поясницу» сохраняет телесную конкретность מָתְנַיִם.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык; повествование передано ясно и достойно. Формулировка «как повелел» естественно раскрывает идиому исполнения слова, а примечание сохраняет лексическую неоднозначность אֵזוֹר.
