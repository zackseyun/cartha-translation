lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Повелительная форма множественного числа от שׁמע. «Слушайте» естественно передаёт призыв услышать и сохраняет его отдельно от следующего, усиливающего повеления.
- source_word: וְהַאֲזִינוּ
  choice: и внимайте
  rationale: Порода hифиль от אזן призывает внимательно прислушаться. «Внимайте» сохраняет риторическое удвоение и оттенок сосредоточенного внимания, оставаясь уместным в возвышенной пророческой речи.
- source_word: אַל תִּגְבָּהוּ
  choice: не превозноситесь
  rationale: Запрет с глаголом גבהּ, буквально связанным с высотой, здесь означает высокомерное самовозвышение. «Не превозноситесь» передаёт образ и нравственный смысл без чрезмерного истолкования.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для повеления; «потому что» ясно выражает причинную связь в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: דִּבֵּר
  choice: сказал
  rationale: Перфект от דבר обозначает завершённое речевое действие. В данном пророческом контексте естественное русское «сказал» передаёт, что основанием призыва служит уже произнесённое слово Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Смысл תִּגְבָּהוּ
  choice: не превозноситесь
  alternative: не гордитесь; не будьте высокомерны
  rationale: Глагол допускает буквальный образ «становиться высоким» и переносный смысл надменности. Основной вариант сохраняет образ самовозвышения, а примечание показывает нравственные оттенки, не сводя многозначность к одному из них.
translation_notes:
  register: Современный литературный русский с достоинством пророческого призыва. Пара «слушайте и внимайте» намеренно сохраняет риторическое удвоение исходного текста; «внимайте» слегка возвышенно, но понятно и органично для библейской речи.
