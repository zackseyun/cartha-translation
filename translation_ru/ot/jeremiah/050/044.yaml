source:
  edition: WLC
  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤עָה ארוצ/ם מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יוֹעִדֶ֔/נִּי וּ/מִֽי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/044.yaml
  text: Look[a], like a lion he comes up from the thicket of the Jordan against a secure pasture; for in an instant I will make them run from it, and I will appoint over it whoever is chosen. For who is like me[c][b], and who can summon me? What shepherd can stand before me?
translation:
  language: ru
  text: Вот, словно лев, он поднимается из зарослей у Иордана[a] на надёжное пастбище. Ибо в одно мгновение Я заставлю их бежать оттуда[b] и поставлю над ним избранного. Ибо кто подобен Мне? Кто призовёт Меня к ответу[c]? И какой пастух устоит предо Мной?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из величия Иордана»; вероятно, имеются в виду густые, пышные заросли по берегам Иордана.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я прогоню их оттуда».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Кто назначит Мне срок?» Еврейское выражение может означать назначение времени встречи или вызов к ответу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный и вместе с тем торжественный указательный маркер, вводящий яркую пророческую картину.
- source_word: כְּאַרְיֵה יַעֲלֶה
  choice: словно лев, он поднимается
  rationale: Сохраняет сравнение, мужской субъект и живописный настоящий вид пророческого описания.
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  choice: из зарослей у Иордана
  rationale: В сочетании с Иорданом גאון, вероятно, обозначает пышные густые заросли поймы; буквальный образ отмечен в сноске.
- source_word: אֶל נְוֵה אֵיתָן
  choice: на надёжное пастбище
  rationale: נוה обозначает место обитания или пастбище стада, а איתן — прочность и устойчивость; выбор поддерживает образ льва и пастуха.
- source_word: כִּי אַרְגִּיעָה
  choice: Ибо в одно мгновение
  rationale: Передаёт внезапность действия, выраженную формой от רגע.
- source_word: ארוצם מֵעָלֶיהָ
  choice: Я заставлю их бежать оттуда
  rationale: Сохраняет лексическое значение רוץ «бежать» и каузативный смысл контекста; местоименный суффикс передан естественным русским наречием места.
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  choice: и поставлю над ним избранного
  rationale: Сжатая еврейская конструкция передана без уточнения личности избранного; פקד здесь означает назначение или поставление.
- source_word: כִּי מִי כָמוֹנִי
  choice: Ибо кто подобен Мне?
  rationale: Формально сохраняет риторический вопрос о несравненности Бога.
- source_word: וּמִי יוֹעִדֶנִּי
  choice: Кто призовёт Меня к ответу?
  rationale: В данном вызове יעד может выражать назначение встречи или вызов; русская формулировка естественно передаёт невозможность обязать Бога явиться на суд, а более буквальный вариант дан в сноске.
- source_word: וּמִי זֶה רֹעֶה אֲשֶׁר יַעֲמֹד לְפָנָי
  choice: И какой пастух устоит предо Мной?
  rationale: Сохраняет пастушеский образ и передаёт יעמד לפני как способность противостоять.
theological_decisions:
- issue: Соотношение образа льва и речи Бога от первого лица
  choice: Сохранён переход от «он поднимается» к словам Бога «Я заставлю… поставлю», без прямого отождествления льва с Богом или только с земным правителем.
  alternative: Явно назвать льва вторгшимся правителем либо непосредственно Господом.
  rationale: Еврейский текст сам оставляет образное соотношение неразъяснённым, одновременно подчёркивая верховную власть Бога над грядущим судом.
- issue: Смысл וּמִי יוֹעִדֶנִּי
  choice: «Кто призовёт Меня к ответу?»
  alternative: «Кто назначит Мне срок?»
  rationale: Основной текст передаёт риторический судебный оттенок контекста, однако многозначность глагола יעד сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. «Вот» и «предо Мной» поддерживают достоинство регистра без чрезмерной архаизации; синтаксис остаётся понятным широкому читателю.
