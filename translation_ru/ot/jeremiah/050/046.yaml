lexical_decisions:
- source_word: מִקּוֹל
  choice: От звука
  rationale: Передаёт причинно-исходное значение предлога מִן и сохраняет образ звука, вызванного падением Вавилона.
- source_word: נִתְפְּשָׂה בָבֶל
  choice: взятия Вавилона
  rationale: Форма Niphal выражает захват города; русское отглагольное существительное естественно сочетается с «от звука».
- source_word: נִרְעֲשָׁה הָאָרֶץ
  choice: содрогнётся земля
  rationale: Глагол обозначает сильное сотрясение; «содрогнётся» сохраняет интенсивность и поэтическую выразительность.
- source_word: וּזְעָקָה בַּגּוֹיִם נִשְׁמָע
  choice: и крик будет слышен среди народов
  rationale: Сохраняет пассивную конструкцию и широкое значение זְעָקָה — громкий крик или вопль; בַּגּוֹיִם естественно передано как «среди народов».
