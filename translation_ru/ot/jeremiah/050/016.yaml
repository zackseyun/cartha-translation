source:
  edition: WLC
  text: כִּרְת֤וּ זוֹרֵ֨עַ֙ מִ/בָּבֶ֔ל וְ/תֹפֵ֥שׂ מַגָּ֖ל בְּ/עֵ֣ת קָצִ֑יר מִ/פְּנֵי֙ חֶ֣רֶב הַ/יּוֹנָ֔ה אִ֤ישׁ אֶל עַמּ/וֹ֙ יִפְנ֔וּ וְ/אִ֥ישׁ לְ/אַרְצ֖/וֹ יָנֻֽסוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/016.yaml
  text: Cut off from Babylon the sower[a], and the one who handles the sickle at the time of harvest. Because of the sword of the oppressor, each man will turn to his own people, and each will flee to his own land.
translation:
  language: ru
  text: Истребите в Вавилоне сеятеля и того, кто держит серп во время жатвы. Из-за меча угнетателя[a] каждый обратится к своему народу, и каждый убежит на свою землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «меч притеснителя». Это еврейское выражение также понимают как «жестокий меч»; буквальный, но менее вероятный вариант — «меч голубя».'
    reason: Лексическая неоднозначность выражения חֶרֶב הַיּוֹנָה.
lexical_decisions:
- source_word: כִּרְתוּ
  choice: Истребите
  rationale: Императив множественного числа от כרת в контексте суда означает устранить, отсечь; «истребите» естественно передаёт уничтожение людей, не создавая неясного русского оборота «отсеките из Вавилона».
- source_word: זוֹרֵעַ
  choice: сеятеля
  rationale: Субстантивированное причастие обозначает человека, который сеет; традиционное и понятное русское существительное сохраняет образ.
- source_word: מִבָּבֶל
  choice: в Вавилоне
  rationale: После русского «истребите» местное значение выражено естественнее, чем буквальное «из Вавилона»; результатом действия остаётся устранение сеятеля из Вавилона.
- source_word: וְתֹפֵשׂ מַגָּל
  choice: и того, кто берётся за серп
  rationale: תפשׂ буквально выражает хватание или удерживание; оборот сохраняет образ серпа и ясно указывает на жнеца.
- source_word: בְּעֵת קָצִיר
  choice: во время жатвы
  rationale: Прямой и естественный временной оборот современного русского языка.
- source_word: מִפְּנֵי
  choice: Спасаясь от
  rationale: Предлог указывает на угрозу, из-за которой люди обращаются в бегство; деепричастный оборот естественно связывает причину с последующими действиями.
- source_word: חֶרֶב הַיּוֹנָה
  choice: меча угнетателя
  rationale: הַיּוֹנָה вероятнее связано с корнем ינה «угнетать» и обозначает угнетающего или разоряющего врага; буквальная возможность «меч голубя» сохраняется в сноске как реальная лексическая неоднозначность.
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  choice: каждый вернётся к своему народу
  rationale: איש употреблено дистрибутивно, а פנה в контексте бегства означает обратиться или возвратиться к своим; «каждый» передаёт функцию формы без неестественного повторения слова «мужчина».
- source_word: וְאִישׁ לְאַרְצוֹ יָנֻסוּ
  choice: каждый убежит в свою землю
  rationale: נוס означает бежать или спасаться бегством, а ארץ здесь — родная земля; повтор «каждый» сохраняет параллелизм.
theological_decisions:
- issue: Дистрибутивное значение אִישׁ
  choice: каждый
  alternative: каждый мужчина / каждый человек
  rationale: Мужская форма в еврейском здесь служит дистрибутивным обозначением отдельных людей. Русское «каждый» точно и естественно передаёт это значение, не вводя утверждения, что речь только о мужчинах.
- issue: Неоднозначность חֶרֶב הַיּוֹנָה
  choice: меч угнетателя
  alternative: жестокий меч / меч голубя
  rationale: Контекст нашествия и возможная связь с глагольным корнем «угнетать» поддерживают основной перевод, однако необычная форма допускает и иные толкования, поэтому они отмечены в сноске без догматического разрешения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены сельскохозяйственные образы, параллелизм двух заключительных частей и неопределённость редкого еврейского выражения посредством сноски.
