base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/043.yaml
  text: The king of Babylon has heard the report about them[a], and his hands have gone limp; distress has seized him, anguish like a woman in labor.
translation:
  language: ru
  text: Вавилонский царь услышал весть о них[a]; руки у него опустились. Беда охватила его; он мучился, как роженица.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «известие о них». Буквально: «их весть»; в контексте речь идёт о вести о наступающем войске.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: услышал
  rationale: Перфект Qal, 3-е лицо, мужской род, единственное число. В русском повествовании естественно передаётся прошедшим совершенного вида; последующие слова показывают результат услышанного.
- source_word: מֶלֶךְ בָּבֶל
  choice: вавилонский царь
  rationale: Сопряжённое сочетание обозначает царя Вавилона; прилагательная конструкция естественна для современного русского языка.
- source_word: שִׁמְעָם
  choice: весть о них
  rationale: Существительное שֵׁמַע означает «весть, слух, известие», а местоименный суффикс здесь указывает на тех, о ком пришла весть, то есть на наступающее войско. Сноска сохраняет более буквальную форму.
- source_word: וְרָפוּ יָדָיו
  choice: и руки у него опустились
  rationale: Русское устойчивое выражение сохраняет телесный образ еврейской идиомы и передаёт утрату силы и мужества.
- source_word: צָרָה
  choice: беда
  rationale: Слово обозначает бедствие, тесноту или тяжёлое положение. «Беда» кратко и выразительно передаёт постигшее царя несчастье и страх.
- source_word: הֶחֱזִיקַתְהוּ
  choice: его охватила
  rationale: Hiphil от חזק в данном контексте означает «схватить, овладеть». «Охватила» естественно сочетается с обозначением беды и внутренней муки.
- source_word: חִיל
  choice: муки
  rationale: В контексте родов слово обозначает мучительную, судорожную боль; множественное «муки» по-русски естественно связано с образом роженицы.
- source_word: כַּיּוֹלֵדָה
  choice: как роженицу
  rationale: Форма обозначает женщину, рожающую или находящуюся в родах. Сравнение синтаксически отнесено к тому, как муки охватили царя.
