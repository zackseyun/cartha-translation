base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/031.yaml
  text: Behold[a], I am against you, O arrogant one, declares the Lord GOD of hosts, for your day has come[b], the time when I will punish you.
translation:
  language: ru
  text: «Вот Я — против тебя, Гордец[a], — возвещает Господь Яхве Воинств, — ибо настал твой день, время, когда Я взыщу с тебя[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Надменный», «Дерзкий». Еврейское слово обозначает высокомерного, самонадеянного; здесь это обращение к Вавилону.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «время, когда Я посетил тебя». В контексте суда «посетить» означает призвать к ответу, взыскать или наказать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלֶיךָ
  choice: Вот Я — против тебя
  rationale: Сочетание הִנְנִי с אֵלֶיךָ в контексте суда выражает торжественно объявленное враждебное выступление Бога, а не просто движение или обращение «к тебе».
- source_word: זָדוֹן
  choice: Гордыня
  rationale: Абстрактное существительное обозначает самонадеянную, дерзкую гордость и здесь служит олицетворённым именованием Вавилона. Прописная буква передаёт функцию прозвища, не устраняя смысловой связи с пороком.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт устойчивую пророческую формулу авторитетного Божьего изречения естественным и торжественным современным русским языком.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: Владыка Яхве Воинств
  rationale: «Владыка» передаёт אֲדֹנָי, «Яхве» сохраняет собственное Божье имя, а «Воинств» — образ небесных и иных сил под Его властью, не заменяя его более широким толкованием «Всемогущий».
- source_word: בָּא יוֹמְךָ
  choice: настал твой день
  rationale: Перфект представляет назначенный день как уже наступивший с пророческой уверенностью и непосредственностью.
- source_word: עֵת פְּקַדְתִּיךָ
  choice: время, когда Я призову тебя к ответу
  rationale: פקד в данном контексте означает Божье посещение ради суда и взыскания. «Призову к ответу» ясно выражает судебный смысл, сохраняя оттенок отчёта за содеянное.
theological_decisions:
- issue: Передача Божьего имени в сочетании אֲדֹנָי יְהוִה צְבָאוֹת
  choice: Владыка Яхве Воинств
  alternative: Владыка Господь Воинств; Владыка Яхве, Всемогущий
  rationale: Текст непосредственно содержит тетраграмматон, поэтому собственное имя сохранено как «Яхве». צְבָאוֹת переведено буквально как «Воинств», чтобы не сводить образ к отвлечённому атрибуту всемогущества.
- issue: Характер Божьего действия в פְּקַדְתִּיךָ
  choice: призову тебя к ответу
  alternative: посещу тебя; накажу тебя
  rationale: 'Контекст несомненно судебный, однако глагол פקד шире простого «накажу»: он может обозначать посещение, внимание, взыскание и привлечение к ответу. Выбранная формулировка передаёт суд, не сужая его до одной формы кары.'
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Инверсия «настал твой день» и краткие параллельные части сохраняют ритм угрозы. Олицетворённое прозвище «Гордыня» отмечено прописной буквой; местоимения, относящиеся к Богу, также даны с прописной по принятой русской библейской норме.
