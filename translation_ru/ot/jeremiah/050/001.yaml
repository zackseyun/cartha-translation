id: JER.50.1
reference: Jeremiah 50:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל בָּבֶ֖ל אֶל אֶ֣רֶץ כַּשְׂדִּ֑ים בְּ/יַ֖ד יִרְמְיָ֥הוּ הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/001.yaml
  text: 'The word that Yahweh spoke concerning Babylon[a], concerning the land of the Chaldeans[b], by the hand of Jeremiah the prophet:'
translation:
  language: ru
  text: 'Слово, которое Яхве изрёк о Вавилоне[a], о земле халдеев, через пророка Иеремию[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против Вавилона, против земли халдеев». Еврейский предлог может вводить пророчество, направленное против народа, но в заголовке может шире указывать на предмет пророчества.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «рукой пророка Иеремии» — еврейское выражение со значением «через пророка Иеремию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: В пророческом заголовке דָּבָר обозначает слово или весть от Бога; традиционное «Слово» сохраняет формулу оригинала и остаётся понятным.
- source_word: דִּבֶּר
  choice: изрёк
  rationale: Глагол означает «говорил, сказал». «Изрёк» передаёт торжественный пророческий регистр, не добавляя значения провозглашения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל בָּבֶל אֶל אֶרֶץ כַּשְׂדִּים
  choice: о Вавилоне, о земле халдеев
  rationale: В заголовке אֶל может обозначать предмет пророчества. «О» сохраняет более широкое значение; возможное «против» отмечено в сноске.
- source_word: בְּיַד יִרְמְיָהוּ הַנָּבִיא
  choice: через пророка Иеремию
  rationale: Буквально «рукой Иеремии-пророка»; это еврейская идиома посредничества или орудия действия. Естественное русское «через» точно передаёт её смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение אֶל в пророческом заголовке
  choice: о Вавилоне, о земле халдеев
  alternative: против Вавилона, против земли халдеев
  rationale: Хотя далее следует пророчество суда, сам предлог допускает более общее указание на предмет речи. Перевод «о» не предрешает направленность высказывания; вариант «против» сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого заголовка. «Изрёк» поддерживает торжественный тон; буквальная еврейская идиома «рукой» вынесена в сноску ради естественности основного текста.
