  text: הִנֵּ֛ה עַ֥ם בָּ֖א מִ/צָּפ֑וֹן וְ/ג֤וֹי גָּדוֹל֙ וּ/מְלָכִ֣ים רַבִּ֔ים יֵעֹ֖רוּ מִ/יַּרְכְּתֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/041.yaml
  text: Behold[a], a people is coming from the north[b], and a great nation and many kings will be stirred up from the farthest parts of the earth.
translation:
  language: ru
  text: Вот, с севера идёт народ; великий народ и многие цари будут приведены в движение[a] из дальних краёв земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут пробуждены», «будут подняты»; еврейский глагол выражает пробуждение или мобилизацию к действию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из отдалённых областей земли», «с концов земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный русский указательный маркер, сохраняющий призыв обратить внимание и возвышенный пророческий тон без архаического «се».
- source_word: עַם
  choice: народ
  rationale: Передаёт общность людей и соответствует обычному значению עַם.
- source_word: בָּא
  choice: идёт
  rationale: Перфект после הִנֵּה имеет здесь живое значение разворачивающегося или близкого будущего события; настоящее время «идёт» естественно передаёт эту пророческую наглядность.
- source_word: מִצָּפוֹן
  choice: с севера
  rationale: Прямое и естественное обозначение направления происхождения движения.
- source_word: גּוֹי גָּדוֹל
  choice: великий народ
  rationale: В библейском контексте «народ» естественнее современного политико-социологического «нация»; повтор слова сохраняет параллельные, но не обязательно тождественные обозначения עַם и גּוֹי.
- source_word: וּמְלָכִים רַבִּים
  choice: и многие цари
  rationale: Точно и естественно передаёт множественность правителей.
- source_word: יֵעֹרוּ
  choice: будут подняты
  rationale: Страдательная конструкция сохраняет нифаль и образ пробуждения или мобилизации к действию, не называя действующего лица.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: от дальних краёв земли
  rationale: Передаёт удалённые, крайние области земли; «дальние» сохраняет пространственный смысл без излишнего усиления до абсолютной превосходной степени.
theological_decisions:
- issue: Неуказанный деятель при יֵעֹרוּ
  choice: Сохранена страдательная формулировка «будут подняты» без указания деятеля.
  alternative: «Поднимутся» или явное указание, что их поднимет Бог.
  rationale: Еврейский текст не называет деятеля; перевод не должен устранять эту неопределённость или добавлять прямое богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Вот» сохраняет риторическое выделение без архаизма «се»; страдательное «будут подняты» намеренно сохраняет грамматическую и богословскую неопределённость оригинала.
