  text: עִרְכ֨וּ עַל בָּבֶ֤ל סָבִיב֙ כָּל דֹּ֣רְכֵי קֶ֔שֶׁת יְד֣וּ אֵלֶ֔י/הָ אַֽל תַּחְמְל֖וּ אֶל חֵ֑ץ כִּ֥י לַֽ/יהוָ֖ה חָטָֽאָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/014.yaml
  text: Draw up against Babylon all around, all you who bend the bow; shoot at her; do not spare an arrow, for she has sinned against Yahweh.
translation:
  language: ru
  text: Выстройтесь против Вавилона со всех сторон, все, кто натягивает лук! Стреляйте в него, не жалейте стрел, потому что он согрешил против Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִרְכוּ עַל־בָּבֶל סָבִיב
  choice: Выстройтесь против Вавилона со всех сторон
  rationale: Военный контекст глагола ערך требует значения «занять боевой строй»; עַל передаёт направленность против неприятеля, а סָבִיב — окружение со всех сторон.
- source_word: כָּל־דֹּרְכֵי קֶשֶׁת
  choice: все, кто натягивает лук
  rationale: Буквальный образ «ступающих по луку» обозначает воинов, сгибающих тугой лук при натяжении. Перевод сохраняет конкретный образ и остаётся понятным по-русски.
- source_word: יְדוּ אֵלֶיהָ
  choice: Стреляйте в него
  rationale: В данном контексте ידה означает стрельбу из лука. Женский суффикс в еврейском относится к персонифицированному Вавилону, но русское название «Вавилон» грамматически мужского рода, поэтому естественно «в него».
- source_word: אַל־תַּחְמְלוּ אֶל־חֵץ
  choice: не жалейте стрел
  rationale: Запрет требует не беречь и не удерживать стрелы. Русское множественное число естественно передаёт собирательное значение еврейского единственного חֵץ.
- source_word: כִּי לַיהוָה חָטָאָה
  choice: потому что он согрешил против Яхве
  rationale: כִּי вводит основание приказа, а ל при חטא обозначает того, против кого совершён грех. Совершенный вид передаёт уже совершённое преступление Вавилона.
- source_word: יהוה
  choice: Яхве
  rationale: Передана форма личного Божьего имени, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя Бога.
- issue: Значение לַיהוָה при глаголе חטא
  choice: согрешил против Яхве
  alternative: согрешил перед Яхве
  rationale: В сочетании с חטא предлог ל указывает на того, против кого направлен грех. «Против» ясно передаёт нравственно-богословский смысл, не добавляя конфессионального толкования.
- issue: Род персонифицированного Вавилона
  choice: он; в него
  alternative: она; в неё
  rationale: В еврейском Вавилон представлен формами женского рода, однако в русском собственное имя «Вавилон» мужского рода. Согласование по нормам русского языка сохраняет референт и не меняет содержания.
translation_notes:
  register: Современный литературный русский язык с энергичным военно-пророческим звучанием. Синтаксис сохраняет последовательность повелений и заключительное обоснование; архаизмы и чрезмерно буквальные обороты исключены.
