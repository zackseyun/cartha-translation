  text: יָקֹ֨שְׁתִּי לָ֤/ךְ וְ/גַם נִלְכַּדְתְּ֙ בָּבֶ֔ל וְ/אַ֖תְּ לֹ֣א יָדָ֑עַתְּ נִמְצֵאת֙ וְ/גַם נִתְפַּ֔שְׂתְּ כִּ֥י בַֽ/יהוָ֖ה הִתְגָּרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/024.yaml
  text: I set a trap for you[a], and you also were caught, Babylon, and you did not know it; you were found and also seized[c][b], because you contended against Yahweh.
translation:
  language: ru
  text: Я устроил тебе западню[a], и ты также попалась, Вавилон, сама того не зная. Ты была обнаружена и также схвачена[b], потому что вступила в борьбу с Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поставил тебе силок».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ты была найдена и захвачена»; два глагола усиливают картину падения Вавилона.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «бросила вызов Яхве». Традиционно имя Яхве передают словом «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: יָקֹשְׁתִּי לָךְ
  choice: Я устроил тебе западню
  rationale: Глагол יקשׁ обозначает установку силка или западни. Эта формулировка сохраняет конкретный образ ловушки и естественно звучит по-русски.
- source_word: וְגַם נִלְכַּדְתְּ
  choice: и ты попалась
  rationale: Нифаль глагола לכד означает «быть пойманной, захваченной»; «попалась» продолжает образ западни. Женский род соответствует персонифицированному Вавилону.
- source_word: וְאַתְּ לֹא יָדָעַתְּ
  choice: сама того не зная
  rationale: Еврейский текст не называет объект знания. Русская идиома передаёт эту неопределённость местоимением «того», относящимся к попаданию в западню.
- source_word: נִמְצֵאת וְגַם נִתְפַּשְׂתְּ
  choice: Ты была обнаружена и схвачена
  rationale: Последовательность двух пассивных глаголов передаёт сначала обнаружение, затем насильственный захват; второй וְגַם усиливает описание поражения.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину пленения Вавилона.
- source_word: בַיהוָה הִתְגָּרִית
  choice: вступила в борьбу с Яхве
  rationale: Hitpael глагола גרה выражает враждебное выступление, противоборство или вызов. «Вступила в борьбу» сохраняет противительный смысл, не сводя его лишь к словесному вызову.
- source_word: יהוה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно присутствующее в еврейском тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон как личное имя; форма «Яхве» сохраняет это различие, тогда как «Господь» отражает традицию замещения имени титулом.
- issue: Характер противостояния Вавилона Богу
  choice: вступила в борьбу с Яхве
  alternative: бросила вызов Яхве
  rationale: Глагол допускает оттенки вызова, противоборства и враждебного выступления. Основной текст сохраняет более широкое значение, а не уточняет способ противостояния.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Вавилон персонифицирован и последовательно обозначен формами женского рода. Образ западни и нарастание «обнаружена и схвачена» сохранены.
