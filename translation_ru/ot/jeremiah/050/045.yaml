  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל בָּבֶ֔ל וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל אֶ֣רֶץ כַּשְׂדִּ֑ים אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נָוֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/045.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Babylon[a], and his thoughts that he has devised against the land of the Chaldeans: Surely the little ones of the flock will drag them away[c][b]; surely he will make their pasture desolate.'
translation:
  language: ru
  text: 'Итак, выслушайте замысел Яхве, который Он замыслил против Вавилона, и Его намерения, которые Он задумал против земли халдеев: истинно, молодняк стада утащит их[a]; истинно, Он опустошит их обиталище[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самые незначительные из стада». Вероятно, это образное обозначение самых слабых или малозначительных среди нападающих на Вавилон.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их пастбище». Еврейское слово может означать пастбище, обиталище или место жительства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Итак
  rationale: Передаёт вывод из предшествующего пророчества естественным русским связующим словом.
- source_word: שִׁמְעוּ
  choice: выслушайте
  rationale: Форма множественного числа и призыв к внимательному восприятию сохранены; «выслушайте» здесь естественнее буквального «услышьте».
- source_word: עֲצַת יְהוָה אֲשֶׁר יָעַץ
  choice: замысел Яхве, который Он замыслил
  rationale: Сохраняется однокоренная связь существительного и глагола, а также личное имя יהוה.
- source_word: וּמַחְשְׁבוֹתָיו אֲשֶׁר חָשַׁב
  choice: и Его намерения, которые Он задумал
  rationale: Передаёт параллельную мысль о продуманном намерении, не сливая её полностью с предыдущим «замыслом».
- source_word: אֶל בָּבֶל / אֶל אֶרֶץ כַּשְׂדִּים
  choice: против Вавилона / против земли халдеев
  rationale: В контексте враждебного пророчества אֶל имеет направленность «против»; выражение «земля халдеев» передано прозрачно.
- source_word: אִם לֹא
  choice: истинно
  rationale: В обеих фразах это клятвенно-усилительная формула, а не обычное условие «если не».
- source_word: יִסְחָבוּם
  choice: утащат их
  rationale: Сохраняет множественное подлежащее, множественное дополнение и значение насильственного волочения или удаления.
- source_word: צְעִירֵי הַצֹּאן
  choice: малые из стада
  rationale: Сохраняет образ исходного текста и допускает значения малых, молодых или наименее значительных членов стада.
- source_word: יַשִּׁים עֲלֵיהֶם נָוֶה
  choice: Он опустошит их пастбище
  rationale: Естественно передаёт результативно-каузативный смысл и относит место к тем, кого постигнет суд; неоднозначность נָוֶה отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Передано личное имя, стоящее в еврейском тексте, без замены титулом.
- issue: Образ צְעִירֵי הַצֹּאן
  choice: Сохранить метафору «малые из стада»
  alternative: Явно истолковать как самых слабых или незначительных нападающих
  rationale: Сам текст не раскрывает образ однозначно; перевод не должен устранять его метафорическую напряжённость.
- issue: Субъект последнего действия
  choice: «Он» — Яхве
  alternative: Безличная или пассивная конструкция
  rationale: Мужская форма единственного числа יַשִּׁים естественно возвращает к Яхве как действующему лицу, тогда как предшествующее יִסְחָבוּם имеет множественное подлежащее.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Однокоренные пары «замысел — замыслил» и «намерения — задумал» поддерживают параллелизм оригинала; архаизмы по возможности исключены.
