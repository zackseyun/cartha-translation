reference: Jeremiah 50:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֥י פֹקֵ֛ד אֶל מֶ֥לֶךְ בָּבֶ֖ל וְ/אֶל אַרְצ֑/וֹ כַּ/אֲשֶׁ֥ר פָּקַ֖דְתִּי אֶל מֶ֥לֶךְ אַשּֽׁוּר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/018.yaml
  text: 'Therefore thus says Yahweh of hosts[a], the God of Israel: Behold, I am about to punish the king of Babylon and his land, just as I punished the king of Assyria.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве Воинств, Бог Израиля: «Вот, Я накажу[a] царя Вавилона и его землю, как наказал царя Ассирии».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взыщу с царя Вавилона и с его земли… как взыскал с царя Ассирии». Древнееврейский глагол פקד может означать «посетить», «обратить внимание», «призвать к ответу» или «взыскать»; здесь контекст указывает на наказание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего пророчества и естественно связывает этот стих с контекстом.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Сохраняет устойчивую пророческую формулу в ясном и торжественном современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: В составе титула «Яхве Воинств» сохраняет широкое значение организованных небесных и земных сил, не сужая его до одной человеческой армии.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо и естественно передаёт древнееврейское сочетание в форме сопряжения.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» сохраняет функцию привлечения внимания; будущее «накажу» передаёт предстоящее действие, выраженное конструкцией с причастием.
- source_word: פֹקֵד / פָּקַדְתִּי
  choice: накажу / наказал
  rationale: В пророчестве о суде над Вавилоном и при сопоставлении с судьбой Ассирии глагол פקד имеет карательный смысл; одинаковая передача обеих форм сохраняет параллелизм.
- source_word: אֶל
  choice: прямое дополнение при «накажу»
  rationale: Хотя предлог буквально направительный, в сочетании с פקד и в данном контексте русский глагол «наказать» естественно требует беспредложного винительного дополнения.
- source_word: מֶלֶךְ בָּבֶל
  choice: царя Вавилона
  rationale: Прямой перевод сочетания; родительный падеж естественно обозначает правителя страны.
- source_word: אַרְצוֹ
  choice: его землю
  rationale: Сохраняет связь территории с царём Вавилона и библейскую конкретность слова אֶרֶץ.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Естественно вводит прямое сопоставление грядущего суда над Вавилоном с прежним судом над Ассирией.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царя Ассирии
  rationale: Прямая и общепонятная передача географического названия и титула.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет это имя и не подменяет его титулом.
- issue: Смысл פקד в пророчестве о суде
  choice: наказать
  alternative: посетить; взыскать; призвать к ответу
  rationale: Контекст прямо сопоставляет грядущую участь Вавилона с уже совершившимся судом над Ассирией, поэтому карательное значение наиболее ясно; более широкая лексическая возможность отмечена в сноске.
- issue: Объект суда — царь и земля
  choice: царь Вавилона и его земля
  alternative: только политическая власть Вавилона
  rationale: Перевод сохраняет оба прямо названных объекта и не сводит «землю» к отвлечённому политическому институту.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы. «Яхве Воинств» намеренно сохраняет структуру древнееврейского божественного титула; «вот» передаёт эмфатическое הִנְנִי без архаического «се». Прямая речь оформлена русскими кавычками.
