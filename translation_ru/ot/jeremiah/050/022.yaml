lexical_decisions:
- source_word: קוֹל
  choice: Шум
  rationale: В контексте войны קוֹל обозначает слышимый шум или грохот; «шум» естественно передаёт внезапное пророческое восклицание.
- source_word: מִלְחָמָה
  choice: войны
  rationale: מִלְחָמָה может означать войну или битву; здесь широкий контекст суда над Вавилоном поддерживает значение «война».
- source_word: בָּאָרֶץ
  choice: в стране
  rationale: אֶרֶץ здесь относится к территории Вавилона, поэтому «страна» яснее, чем возможные «земля» или «мир».
- source_word: וְשֶׁבֶר
  choice: и великое разрушение
  rationale: שֶׁבֶר буквально связано с сокрушением и может обозначать грохот, крушение, бедствие или разорение. В данном пророческом контексте «разрушение» естественно передаёт итог военного сокрушения, а примечание сохраняет звуковую альтернативу.
- source_word: גָּדוֹל
  choice: великое
  rationale: גָּדוֹל прямо указывает на значительность и масштаб; «великое» сохраняет возвышенный пророческий регистр.
