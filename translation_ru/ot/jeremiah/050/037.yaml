base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/037.yaml
  text: A sword against his horses and against his chariots[a], and against all the mixed people in her midst, and they will become women. A sword against her treasuries[b], and they will be plundered.
translation:
  language: ru
  text: Меч против его коней и против его колесниц, против всего смешанного народа в её среде[a], — и станут они женщинами[b]. Меч против её сокровищниц — и будут они разграблены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против всех чужеземных наёмников»; или: «против всего смешанного множества». Вероятно, еврейское выражение обозначает смешанное население Вавилона либо находившиеся в нём вспомогательные войска.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «станут женщинами». Это древний военный оборот, означающий, что они испугаются или утратят мужество в бою.'
    reason: cultural_note
lexical_decisions:
- source_word: חֶרֶב
  choice: Меч — на
  rationale: 'Сохранена краткая эллиптическая формула пророческого суда: подразумевается нападение, направленное против названных далее сил и богатств.'
- source_word: סוּסָיו
  choice: его коней
  rationale: Мужской суффикс передан буквально; в контексте он относится к олицетворённому Вавилону.
- source_word: רִכְבּוֹ
  choice: его колесницы
  rationale: Собирательное единственное число обозначает колесничные силы; множественное число естественно по-русски.
- source_word: כָּל הָעֶרֶב
  choice: весь разноплемённый народ
  rationale: עֶרֶב обозначает смешанное население или чужеземные вспомогательные силы. «Разноплемённый народ» сохраняет основной смысл, не уточняя предположительно, что речь именно о наёмниках.
- source_word: בְּתוֹכָהּ
  choice: среди неё
  rationale: Женский суффикс сохраняет образ Вавилона как олицетворённого города и не сглаживает смену грамматического рода в еврейском тексте.
- source_word: וְהָיוּ לְנָשִׁים
  choice: и станут они женщинами
  rationale: Дословно сохранён древний гендерный военный оборот; его подразумеваемый смысл объяснён в сноске, а не внесён в основной текст.
- source_word: אוֹצְרֹתֶיהָ
  choice: её сокровищницы
  rationale: Форма во множественном числе указывает на хранилища или запасы богатства; «сокровищницы» соответствует контексту их захвата.
- source_word: וּבֻזָּזוּ
  choice: и будут они разграблены
  rationale: Сохранены страдательный залог и естественная отсылка к сокровищницам.
theological_decisions:
- issue: Передача гендерного оборота לְנָשִׁים
  choice: и станут они женщинами
  alternative: и упадут духом / и станут боязливыми
  rationale: Основной текст сохраняет явную формулировку древнееврейского оригинала и связанную с ней историко-культурную напряжённость; идиоматический военный смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческого изречения. Смена мужских местоименных форм («его») на женские («неё», «её») намеренно сохранена вслед за древнееврейским текстом, где Вавилон представлен то как царство, то как олицетворённый город.
