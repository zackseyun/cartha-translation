  text: הָרִ֨יעוּ עָלֶ֤י/הָ סָבִיב֙ נָתְנָ֣ה יָדָ֔/הּ נָֽפְלוּ֙ אשויתי/ה נֶהֶרְס֖וּ חֽוֹמוֹתֶ֑י/הָ כִּי֩ נִקְמַ֨ת יְהוָ֥ה הִיא֙ הִנָּ֣קְמוּ בָ֔/הּ כַּ/אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/015.yaml
  text: Raise a shout against her all around[a]; she has given her hand; her foundations have fallen, her walls are torn down. For it is the vengeance of Yahweh—take vengeance on her; as she has done[b], do to her.
translation:
  language: ru
  text: Поднимите против неё боевой клич со всех сторон! Она сдалась[a]; пали её устои[b], разрушены её стены. Ведь это — мщение Яхве. Отомстите ей; как она поступила, так поступите и с ней!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «она дала свою руку»; древнееврейский оборот, вероятно, означает: «она сдалась» или «покорилась».'
    reason: lexical_alternative
  - marker: b
    text: 'Значение древнееврейского слова не вполне ясно; возможны также переводы: «основания», «опоры», «укрепления» или «контрфорсы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִיעוּ עָלֶיהָ סָבִיב
  choice: Поднимите против неё боевой клич со всех сторон
  rationale: Военный контекст и форма повелительного наклонения указывают на боевой возглас против окружённого города. «Со всех сторон» передаёт осадный оттенок סָבִיב.
- source_word: נָתְנָה יָדָהּ
  choice: она подала руку
  rationale: Сохранён образный оборот «дать/подать руку», который в контексте означает покорность или капитуляцию; значение поясняется в сноске, чтобы не устранить образ из основного текста.
- source_word: אשויתיה
  choice: её устои
  rationale: Редкое и не вполне ясное слово обозначает, вероятно, основания, опоры либо оборонительные сооружения. «Устои» естественно сочетаются с глаголом «пали» и не приписывают термину чрезмерно точного архитектурного значения.
- source_word: נֶהֶרְסוּ חוֹמוֹתֶיהָ
  choice: разрушены её стены
  rationale: Страдательная форма נֶהֶרְסוּ означает, что стены снесены или разрушены; краткая конструкция сохраняет параллелизм древнееврейской строки.
- source_word: נִקְמַת יְהוָה הִיא
  choice: это — мщение Яхве
  rationale: Фраза прямо называет происходящее возмездием Яхве. Личное имя יהוה передано как «Яхве», а не заменено титулом.
- source_word: הִנָּקְמוּ בָהּ
  choice: Отомстите ей
  rationale: Повелительная форма множественного числа требует совершить над Вавилоном ответное возмездие.
- source_word: כַּאֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ
  choice: как она поступала, так и вы поступите с ней
  rationale: Формулировка сохраняет краткость, взаимность и принцип воздаяния, выраженный в древнееврейском тексте.
theological_decisions:
- issue: Передача идиомы נָתְנָה יָדָהּ
  choice: Сохранить в основном тексте образ «она подала руку», пояснив капитуляцию в сноске.
  alternative: «Она сдалась» или «она покорилась».
  rationale: Прямая идиоматическая передача была бы яснее, но устранила бы выразительный и не вполне прозрачный образ исходного текста. Сноска позволяет сохранить и форму, и вероятный смысл.
- issue: Толкование редкого אשויתיה
  choice: Передать как «устои» и отметить лексическую неопределённость.
  alternative: «основания», «опоры», «укрепления» или «контрфорсы».
  rationale: Контекст осады указывает на несущие либо оборонительные части города, однако точное архитектурное значение слова спорно. Обобщённое «устои» не снимает эту неопределённость.
- issue: Характер мщения в стихе
  choice: Сохранить прямые выражения «мщение Яхве» и «отомстите ей».
  alternative: Смягчить как «воздаяние» или развернуть как судебное наказание.
  rationale: Исходный текст намеренно связывает приказ нападающим с мщением Яхве и принципом ответного воздаяния; перевод не должен ни смягчать, ни дополнительно систематизировать это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественным, энергичным ритмом пророческой речи. Сохранены военная образность, краткие параллельные фразы и личное имя «Яхве». Все сноски размещены непосредственно при словах, которые они поясняют.
