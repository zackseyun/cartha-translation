  text: צִיּ֣וֹן יִשְׁאָ֔לוּ דֶּ֖רֶךְ הֵ֣נָּה פְנֵי/הֶ֑ם בֹּ֚אוּ וְ/נִלְו֣וּ אֶל יְהוָ֔ה בְּרִ֥ית עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/005.yaml
  text: 'They will ask the way to Zion[a], with their faces turned toward it: ‘Come[b], let us join ourselves to Yahweh in an everlasting covenant that will not be forgotten.’'
translation:
  language: ru
  text: 'Они будут спрашивать дорогу на Сион, обратив к нему лица: «Пойдём же и присоединимся[a] к Яхве в вечном завете, который не будет забыт[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будем присоединены». Форма еврейского глагола допускает как возвратный смысл («присоединимся»), так и более пассивный («будем присоединены»).'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вечным заветом, который не забудется». Подчёркивается непреходящий завет, в противоположность прежней неверности народа.'
    reason: cultural_note
lexical_decisions:
- source_word: צִיּוֹן
  choice: Сион
  rationale: Традиционная и общепонятная русская форма географического названия.
- source_word: יִשְׁאָלוּ דֶּרֶךְ
  choice: будут спрашивать дорогу
  rationale: Передаёт будущее значение имперфекта שאל и конкретный смысл דֶּרֶךְ; направление выражено сочетанием «дорогу на Сион».
- source_word: הֵנָּה פְנֵיהֶם
  choice: обратив лица туда
  rationale: Сохраняет образ лиц, направленных к названному месту, и естественно передаёт направительное значение הֵנָּה.
- source_word: בֹּאוּ וְנִלְווּ
  choice: Пойдём и примкнём
  rationale: Передаёт совместный призыв в прямой речи и значение присоединения у Niphal формы לוה. Русское «пойдём» естественно в контексте движения к Сиону.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Имя יהוה передано как «Яхве», чтобы сохранить личное заветное имя Бога, а предлог אֶל — направленность присоединения.
- source_word: בְּרִית עוֹלָם
  choice: вечным заветом
  rationale: Творительный падеж естественно выражает способ или основание присоединения; עוֹלָם указывает на непреходящий, постоянный характер завета.
- source_word: לֹא תִשָּׁכֵחַ
  choice: который не будет забыт
  rationale: Сохраняет пассивное значение Niphal и согласование с существительным «завет», не заменяя «забыт» более толковательным «нарушен» или «оставлен».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя יהוה; транслитерация сохраняет его отличие от титула «Господь».
- issue: Характер присоединения к Яхве
  choice: примкнём к Яхве вечным заветом
  alternative: будем присоединены к Яхве вечным заветом
  rationale: Контекст совместного призыва поддерживает возвратно-деятельное понимание, однако форма Niphal допускает и более пассивную передачу; эта неоднозначность отмечена в сноске.
- issue: Значение «не будет забыт»
  choice: сохранён буквальный образ забвения
  alternative: не будет оставлен / нарушен
  rationale: Текст прямо говорит о завете, который не забудется. Более конкретные формулировки могли бы преждевременно снять смысловое напряжение между памятью о завете и верностью ему.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены конкретные образы дороги, обращённых лиц и незабытого завета; синтаксис слегка упорядочен для ясности. Прямая речь оформлена как совместный призыв.
