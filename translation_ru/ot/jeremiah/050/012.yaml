  - severity: medium
    issue: «Степью» для וַעֲרָבָה
    rationale: Русская «степь» может быть плодородной или просто травянистой и не обязательно обозначает засушливую местность. «Пустынная равнина» точнее сохраняет образ аридного ландшафта.
