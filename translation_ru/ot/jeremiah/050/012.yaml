  source_fidelity: Первая строка черновика («будет жестоко опозорена») вносит оттенок внешнего насильственного унижения, тогда как בּוֹשָׁה прежде всего означает «испытывать стыд, быть пристыженной». Кроме того, «степь» не обязательно передаёт засушливую пустынную равнину עֲרָבָה. Остальные ключевые элементы — материнская метафора, будущее значение пророческих перфектов, эмфатическое «Вот» и неоднозначность אַחֲרִית גּוֹיִם — переданы верно.
  naturalness: Исправленный текст сохраняет современный литературный русский и поэтический параллелизм. «Глубоко устыжена» естественно в возвышенно-пророческом регистре; «та, что родила вас» яснее, чем субстантивированное «родившая вас».
  terminology: «Пустынная равнина» точнее передаёт עֲרָבָה, не смешивая её с מִדְבָּר («пустыня») и צִיָּה («безводная земля»). В сноске «наименьшей» точнее и нейтральнее, чем «ничтожнейшей», для альтернативного значения выражения.
