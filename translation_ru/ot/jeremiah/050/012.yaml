  text: בּ֤וֹשָׁה אִמְּ/כֶם֙ מְאֹ֔ד חָפְרָ֖ה יֽוֹלַדְתְּ/כֶ֑ם הִנֵּה֙ אַחֲרִ֣ית גּוֹיִ֔ם מִדְבָּ֖ר צִיָּ֥ה וַ/עֲרָבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/012.yaml
  text: Your mother will be utterly ashamed; she who gave birth to you will be disgraced. Behold[a], she will be the last of the nations, a wilderness, a dry land, and a desert.
translation:
  language: ru
  text: 'Ваша мать будет глубоко устыжена,

    та, что родила вас, — посрамлена.

    Вот, она станет последней среди народов[a] —

    пустыней, безводной землёй и пустынной равниной.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наименьшей среди народов». Еврейское выражение может указывать на конечное, униженное положение Вавилона среди народов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשָׁה
  choice: будет жестоко опозорена
  rationale: Перфект в контексте пророческого суда передан будущим временем. Глагол выражает стыд и позор; пассивная формулировка естественна по-русски и передаёт постигшее Вавилон унижение.
- source_word: אִמְּכֶם
  choice: ваша мать
  rationale: Сохранён буквальный образ матери, олицетворяющий Вавилон, без поясняющей подстановки «город-мать» или «родина».
- source_word: מְאֹד
  choice: жестоко
  rationale: Наречие усиливает меру позора; «жестоко опозорена» звучит естественно и выразительно в современном литературном русском.
- source_word: חָפְרָה
  choice: будет посрамлена
  rationale: Сохранён параллельный, но не тождественный первому обозначению стыда глагол; будущее время соответствует функции пророческого перфекта.
- source_word: יֽוֹלַדְתְּכֶם
  choice: родившая вас
  rationale: Причастный оборот прямо передаёт женский образ той, которая родила адресатов, и сохраняет поэтический параллелизм.
- source_word: הִנֵּה
  choice: вот
  rationale: Передаёт эмфатическое привлечение внимания, сохраняя пророческую торжественность без архаичного оттенка слова «се».
- source_word: אַחֲרִית גּוֹיִם
  choice: последней среди народов
  rationale: Передаёт как положение в конце ряда, так и итоговое униженное состояние Вавилона; возможное значение «ничтожнейшей» сохранено в сноске.
- source_word: מִדְבָּר
  choice: пустыней
  rationale: В контексте суда слово обозначает безлюдную, опустошённую местность.
- source_word: צִיָּה
  choice: безводной землёй
  rationale: Передаёт значение сухости и иссушенности, не смешивая слово с соседними обозначениями пустынной местности.
- source_word: וַעֲרָבָה
  choice: и степью
  rationale: «Степь» передаёт сухую пустынную равнину и позволяет сохранить трёхчастное нагнетание образов, не повторяя «пустыня».
theological_decisions:
- issue: Олицетворение Вавилона как матери и родившей женщины
  choice: Материнский образ сохранён непосредственно в основном тексте
  alternative: Передать как «город-мать» или «родина»
  rationale: Еврейский текст использует поэтическое олицетворение; его прямое сохранение не подменяет перевод толкованием.
- issue: Временное значение пророческих перфектов
  choice: 'Будущее время: «будет… опозорена», «будет посрамлена»'
  alternative: 'Настоящее или результативное прошедшее: «опозорена», «посрамлена»'
  rationale: В пророчестве о суде перфекты представляют грядущее событие как несомненное; будущее время яснее всего передаёт эту функцию по-русски.
- issue: Значение выражения אַחֲרִית גּוֹיִם
  choice: «последней среди народов» с указанием альтернативы в сноске
  alternative: «ничтожнейшей среди народов»
  rationale: Формулировка сохраняет смысловую напряжённость между конечным положением и низшим статусом, не устраняя лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Сохранены параллелизм первых двух строк, материнское олицетворение и трёхчастный образ опустошённой земли; архаизм «се» заменён ясным «вот».
