  yaml_path: translation/ot/jeremiah/050/042.yaml
  text: They seize bow and javelin; they are cruel and will show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Babylon.
translation:
  language: ru
  text: Они берут в руки лук и копьё; они жестоки и не знают жалости. Их гул подобен морскому рёву; они едут на конях, выстроившись, словно один человек[a], для битвы против тебя, дочь Вавилона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «словно человек (мужчина)»; возможно также: «словно воин». Выражение может подчёркивать единство боевого строя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: лук
  rationale: Единственное число имеет собирательно-инструментальное значение и естественно передаётся русским «лук».
- source_word: כִידֹן
  choice: копьё
  rationale: Слово обозначает древковое колющее или метательное оружие; «копьё» понятно современному читателю и не создаёт излишней точности там, где различие между копьём и дротиком не вполне определённо.
- source_word: יַחֲזִיקוּ
  choice: берут в руки
  rationale: В данном военном контексте форма глагола передаёт взятие и удержание оружия в готовности; выражение звучит естественно по-русски.
- source_word: אַכְזָרִי הֵמָּה
  choice: они жестоки
  rationale: Прямо передаёт характеристику нападающих, не смешивая её со следующим утверждением об отсутствии жалости.
- source_word: וְלֹא יְרַחֵמוּ
  choice: и не знают жалости
  rationale: Естественная русская идиома, точно выражающая отсутствие сострадания и беспощадность.
- source_word: קוֹלָם
  choice: шум их
  rationale: В образе приближающегося войска קוֹל означает совокупный звук или гул, а не только человеческий голос.
- source_word: כַּיָּם יֶהֱמֶה
  choice: ревёт, как море
  rationale: Глагол описывает громкий, волнующийся гул; образ морского рёва сохраняет поэтическую силу еврейского текста.
- source_word: וְעַל סוּסִים יִרְכָּבוּ
  choice: они скачут на конях
  rationale: Передаёт конное продвижение войска живым и литературно естественным русским выражением.
- source_word: עָרוּךְ
  choice: выстроившись
  rationale: Причастие указывает на упорядоченное боевое построение или готовность; деепричастная форма естественно связывает описание с движением конницы.
- source_word: כְּאִישׁ
  choice: словно один человек
  rationale: В военном контексте единственное איש может описывать согласованное построение всего войска. Поскольку слово «один» в еврейском тексте прямо не выражено, буквальный вариант отмечен в сноске.
- source_word: לַמִּלְחָמָה
  choice: для битвы
  rationale: Передаёт непосредственную боевую готовность в данном контексте точнее и естественнее, чем более широкое «для войны».
- source_word: בַּת בָּבֶל
  choice: дочь Вавилона
  rationale: Сохраняет поэтическое олицетворение города и прямое обращение без добавления отсутствующих в оригинале определений.
theological_decisions:
- issue: Значение мужского единственного числа в сравнении כְּאִישׁ
  choice: словно один человек
  alternative: буквально «словно человек (мужчина)»; возможно также «словно воин»
  rationale: Основной вариант естественно выражает вероятный образ единого строя, но сноска сохраняет грамматическую форму и лексическую неоднозначность оригинала, не превращая возможное толкование в бесспорное.
