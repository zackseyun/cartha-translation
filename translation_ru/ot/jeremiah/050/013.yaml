  source_fidelity: 'Основной смысл передан верно: מִן־קֶצֶף выражает причину, יהוה корректно передано «Яхве», а формы женского рода относятся к Вавилону. Однако «превратится в пустыню» может в русском языке обозначать именно природную пустыню, тогда как שְׁמָמָה означает состояние полного запустения. Связка «при виде» несколько эксплицирует отношение, которое в оригинале выражено предлогом עַל («над/из-за»).'
