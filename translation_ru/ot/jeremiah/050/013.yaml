base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/013.yaml
  text: Because of the wrath of Yahweh[a], it will not be inhabited, but will become a complete desolation. Everyone who passes by Babylon will be appalled and will hiss over all her wounds.
translation:
  language: ru
  text: Из-за ярости Яхве она не будет населена, но вся станет сплошным запустением. Каждый, кто будет проходить мимо Вавилона, ужаснётся и засвищет[a] над всеми её ранами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зашипит». Еврейский глагол может обозначать свист или шипение; здесь это реакция потрясения или насмешки над разорением Вавилона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֶּצֶף יְהוָה
  choice: Из-за ярости Яхве
  rationale: Предлог מִן выражает причину, а קֶצֶף — сильный гнев, ярость. Имя יהוה передано как личное имя «Яхве».
- source_word: לֹא תֵשֵׁב
  choice: она не будет населена
  rationale: Форма женского рода соотносится с Вавилоном как городом; в данном контексте ישׁב означает, что город не будет обитаем.
- source_word: וְהָיְתָה שְׁמָמָה כֻּלָּהּ
  choice: но вся превратится в пустыню
  rationale: שְׁמָמָה обозначает опустошённое, безлюдное место, а כֻּלָּהּ подчёркивает полноту разорения. «Превратится в пустыню» естественно передаёт результат суда, не предполагая буквальную смену природной зоны.
- source_word: כֹּל עֹבֵר עַל בָּבֶל
  choice: Каждый, кто будет проходить мимо Вавилона
  rationale: Оборот обозначает прохожих, наблюдающих разрушенный город.
- source_word: יִשֹּׁם
  choice: ужаснётся
  rationale: Глагол שׁמם здесь передаёт потрясение и ужас при виде опустошения.
- source_word: וְיִשְׁרֹק
  choice: и засвищет
  rationale: שרק может обозначать свист или шипение как реакцию на увиденное; основной текст сохраняет конкретный образ свиста, а неоднозначность отмечена в сноске.
- source_word: עַל כָּל מַכּוֹתֶיהָ
  choice: при виде всех её ран
  rationale: מַכּוֹתֶיהָ буквально говорит о нанесённых ей ударах или ранах. «Раны» сохраняют олицетворение Вавилона и образ последствий суда.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Образ полного запустения Вавилона
  choice: вся превратится в пустыню
  alternative: вся станет местом запустения
  rationale: Перевод сохраняет категоричность пророческого суда и усиление כֻּלָּהּ, не добавляя объяснения о сроке или характере исполнения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Женский род сохраняет олицетворение Вавилона как города; неоднозначность глагола שרק вынесена в сноску.
