lexical_decisions:
- source_word: חֶרֶב אֶל
  choice: Меч — на
  rationale: Краткая эллиптическая формула возвещения суда передаёт буквальный образ меча и враждебную направленность предлога אֶל, не добавляя отсутствующего в еврейском тексте глагола.
- source_word: הַבַּדִּים
  choice: гадателей
  rationale: Слово может обозначать лжецов или обманщиков, но в контексте обличения Вавилона вероятен смысл людей, изрекающих ложные предсказания. Альтернатива сохранена в сноске.
- source_word: וְנֹאָלוּ
  choice: и они станут глупцами
  rationale: 'Передан результативный смысл формы нифаль: они сделаются или окажутся глупыми. Формулировка сохраняет пророческую иронию и не усиливает значение до безумия.'
- source_word: גִּבּוֹרֶיהָ
  choice: её воинов
  rationale: В военном контексте גִּבּוֹר обозначает сильного бойца или воина; современное «воины» естественно и точно.
- source_word: וָחָתּוּ
  choice: и они придут в ужас
  rationale: Глагол חתת может описывать ужас, смятение или сокрушение. В данном контексте выбран психологический оттенок поражения, а более вещественный смысл указан в сноске.
