  text: נֻ֚דוּ מִ/תּ֣וֹךְ בָּבֶ֔ל וּ/מֵ/אֶ֥רֶץ כַּשְׂדִּ֖ים יצאו וִ/הְי֕וּ כְּ/עַתּוּדִ֖ים לִ/פְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/008.yaml
  text: Flee from the midst of Babylon[a], and go out from the land of the Chaldeans; and be like male goats before the flock.
translation:
  language: ru
  text: Бегите из Вавилона, уходите из земли халдеев и будьте как козлы, идущие впереди стада.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֻדוּ
  choice: Бегите
  rationale: В данном контексте повелительная форма призывает срочно покинуть обречённый Вавилон; «бегите» естественно передаёт эту настоятельность.
- source_word: מִתּוֹךְ בָּבֶל
  choice: из Вавилона
  rationale: Предлог указывает на выход изнутри города; по-русски краткое «из Вавилона» ясно и естественно выражает это значение без утраты смысла.
- source_word: וּמֵאֶרֶץ כַּשְׂדִּים יצאו
  choice: уходите из земли халдеев
  rationale: Форма יצאו в последовательности призывов имеет повелительную силу. «Земля халдеев» сохраняет явную формулировку оригинала.
- source_word: וִהְיוּ
  choice: и будьте
  rationale: Сохраняется сочинительная последовательность повелений и прямой смысл глагола «быть».
- source_word: כְּעַתּוּדִים
  choice: как козлы
  rationale: עַתּוּדִים обозначает взрослых самцов коз; русское «козлы» точно и естественно в образе стада.
- source_word: לִפְנֵי צֹאן
  choice: идущие впереди стада
  rationale: Буквально «перед стадом»; причастный оборот естественно передаёт пространственный образ в контексте призыва первыми выйти из страны, не утверждая сверх текста формального предводительства.
