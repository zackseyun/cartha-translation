  text: הַשְׁמִ֣יעוּ אֶל בָּבֶ֣ל רַ֠בִּים כָּל דֹּ֨רְכֵי קֶ֜שֶׁת חֲנ֧וּ עָלֶ֣י/הָ סָבִ֗יב אַל יְהִי פְּלֵטָ֔ה שַׁלְּמוּ לָ֣/הּ כְּ/פָעֳלָ֔/הּ כְּ/כֹ֛ל אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָ֑/הּ כִּ֧י אֶל יְהוָ֛ה זָ֖דָה אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/029.yaml
  text: Summon many against Babylon[a], all who bend the bow; encamp around her on every side; let there be no escape. Repay her according to her work; according to all that she has done, do to her. For she has acted arrogantly against Yahweh, against the Holy One of Israel.
translation:
  language: ru
  text: Созовите против Вавилона многих — всех, кто натягивает лук. Разбейте стан вокруг него со всех сторон; пусть не будет спасения[a]. Воздайте ему по его делам; по всему, что он сделал, поступите с ним. Ибо он дерзко вознёсся против Яхве, против Святого Израилева.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть не останется спасшихся» или «пусть не будет возможности бежать». Еврейское פְּלֵטָה может означать спасение или бегство, а также тех, кто спасся.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁמִיעוּ
  choice: Созовите
  rationale: Каузативный императив שמע в военном контексте выражает призыв и сбор сил; «созовите» передаёт это естественно по-русски.
- source_word: רַבִּים
  choice: многих
  rationale: Субстантивированное прилагательное обозначает множество нападающих; нейтральное «многих» не усиливает значение до «полчищ».
- source_word: כָּל דֹּרְכֵי קֶשֶׁת
  choice: всех, кто натягивает лук
  rationale: Сохранён конкретный воинский образ буквального выражения о тех, кто натягивает или сгибает лук; по смыслу это лучники.
- source_word: חֲנוּ עָלֶיהָ סָבִיב
  choice: Разбейте стан вокруг него со всех сторон
  rationale: Формулировка передаёт приказ полностью окружить город при осаде. В русском «Вавилон» грамматически мужского рода, поэтому местоимение согласовано с названием.
- source_word: אַל יְהִי פְּלֵטָה
  choice: пусть не будет выхода
  rationale: פְּלֵטָה может обозначать спасение, бегство либо уцелевших беглецов. «Не будет выхода» сохраняет логику полного окружения и не вводит однозначно идею отсутствия выживших.
- source_word: שַׁלְּמוּ לָהּ
  choice: Воздайте ему
  rationale: Порода Piel глагола שלם здесь выражает возмездие; «воздайте» сохраняет судебно-поэтический оттенок и остаётся понятным современному читателю.
- source_word: כְּפָעֳלָהּ
  choice: по его делам
  rationale: פֹּעַל означает дело или содеянное. Множественное «по делам» естественно в русском и сохраняет отличие от следующего развёрнутого предложения.
- source_word: כְּכֹל אֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ
  choice: поступите с ним так же, как он поступал
  rationale: Передан принцип ответного воздаяния и повтор глагольной идеи, без тяжеловесной буквальной конструкции.
- source_word: זָדָה
  choice: дерзко выступил
  rationale: Глагол обозначает надменное, самонадеянное или дерзкое поведение. Выражение передаёт и внутреннюю гордыню, и действие, направленное против Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом «Господь».
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святого Израилева
  rationale: Сохранён узнаваемый пророческий титул; традиционная поэтическая форма естественна для достойного русского библейского регистра.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя сохранено транслитерацией без замены титулом.
- issue: Значение פְּלֵטָה в пророчестве о суде
  choice: не будет выхода
  alternative: не будет уцелевших; никто не спасётся
  rationale: Контекст осады поддерживает значение невозможности бегства, тогда как еврейское слово допускает также указание на уцелевших. Основной текст не усиливает высказывание до недвусмысленного полного истребления.
- issue: Грамматический род олицетворённого Вавилона
  choice: мужской род по норме русского языка
  alternative: женский род с олицетворением города
  rationale: Еврейский текст говорит о Вавилоне в женском роде, но последовательные русские формы «него», «ему», «он» естественно согласуются с названием города и не меняют богословского смысла.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным пророческим звучанием. Военная образность и последовательность императивов сохранены; синтаксис слегка упорядочен ради естественного чтения.
