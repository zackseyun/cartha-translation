source:
  edition: WLC
  text: גֹּאֲלָ֣/ם חָזָ֗ק יְהוָ֤ה צְבָאוֹת֙ שְׁמ֔/וֹ רִ֥יב יָרִ֖יב אֶת רִיבָ֑/ם לְמַ֨עַן֙ הִרְגִּ֣יעַ אֶת הָ/אָ֔רֶץ וְ/הִרְגִּ֖יז לְ/יֹשְׁבֵ֥י בָבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/034.yaml
  text: Their Redeemer is strong[a]; Yahweh of Armies is his name. He will surely plead their case[d][c][b], so that he may give rest to the earth and bring unrest to the inhabitants of Babylon.
translation:
  language: ru
  text: Их Искупитель силён[a]; имя Его — Яхве Воинств[b]. Он непременно будет вести их тяжбу[c], чтобы дать покой земле[d] и привести в смятение жителей Вавилона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Их родич-защитник могуч». Еврейское слово обозначает родственника, который выкупает, избавляет или защищает права близкого.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Господь Саваоф» или «Господь Воинств».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Он непременно вступится за них» или «будет отстаивать их дело». В еврейском тексте однокоренные глагол и существительное создают усиление и сохраняют образ судебного спора.'
    reason: lexical_alternative
  - marker: d
    text: Еврейское слово можно также перевести как «стране».
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּאֲלָם
  choice: их Искупитель
  rationale: גאל обозначает избавителя и защитника, первоначально связанного семейно-правовой обязанностью; «Искупитель» кратко сохраняет богословский и юридический оттенки.
- source_word: חָזָק
  choice: силён
  rationale: Прямо передаёт силу и могущество; естественно сочетается со словом «Искупитель».
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יְהוָה как «Яхве», а צְבָאוֹת — прозрачным для современного читателя словом «Воинств», сохраняя традиционную форму божественного титула.
- source_word: רִיב יָרִיב אֶת רִיבָם
  choice: Он непременно вступится за них на суде
  rationale: Сочетание инфинитива абсолютного с личной формой глагола усиливает утверждение; повтор корня ריב имеет судебный смысл. Русская формулировка передаёт и решительность, и защиту их дела.
- source_word: הִרְגִּיעַ אֶת הָאָרֶץ
  choice: дать покой земле
  rationale: Каузативная форма выражает установление покоя. הָאָרֶץ допускает значения «земля» и «страна»; неоднозначность отмечена в сноске.
- source_word: וְהִרְגִּיז לְיֹשְׁבֵי בָבֶל
  choice: а жителей Вавилона лишить покоя
  rationale: Контрастная русская формулировка естественно противопоставляет покой земли тревоге, которую Яхве наведёт на жителей Вавилона; וְהִרְגִּיז означает причинить волнение, смятение или трепет.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Значение הָאָרֶץ
  choice: земле
  alternative: стране
  rationale: Оба значения возможны. В контрасте с жителями Вавилона более широкий смысл «земля» уместен, но локальное прочтение не исключается.
- issue: Судебный образ ריב
  choice: вступится за них на суде
  alternative: будет твёрдо вести их тяжбу
  rationale: Выбранная формулировка понятна современному читателю и сохраняет юридический образ божественной защиты, не сводя его только к обвинению или только к военному противостоянию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис компактный; параллелизм «дать покой — лишить покоя» передаёт резкий риторический контраст оригинала. Заглавная буква в местоимении «Ему» употреблена как уважительная издательская норма.
