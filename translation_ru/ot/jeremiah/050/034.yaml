  source_fidelity: 'Основной смысл передан верно: גֹּאֲלָם — «Их Искупитель», חָזָק — «силён», титул «Яхве Воинств», судебная защита Израиля и противопоставление покоя земле смятению Вавилона сохранены. Однако «вступится за них на суде» несколько сужает רִיב יָרִיב אֶת־רִיבָם до конкретного судебного заседания и ослабляет намеренно повторённый юридический корень. «Лишить покоя» передаёт контраст, но не прямо выраженное причинение волнения/смятения.'
