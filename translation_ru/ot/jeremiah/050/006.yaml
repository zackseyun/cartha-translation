source:
  edition: WLC
  text: צֹ֤אן אֹֽבְדוֹת֙ היה עַמִּ֔/י רֹעֵי/הֶ֣ם הִתְע֔וּ/ם הָרִ֖ים שובבים מֵ/הַ֤ר אֶל גִּבְעָה֙ הָלָ֔כוּ שָׁכְח֖וּ רִבְצָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/006.yaml
  text: My people have been lost sheep[a]; their shepherds have led them astray, turning them away on the mountains. They have gone from mountain to hill[b]; they have forgotten their resting place.
translation:
  language: ru
  text: Мой народ был стадом потерянных овец[a]. Их пастухи сбили их с пути, заставив скитаться по горам[b]. Они переходили от горы к холму[c] и забыли своё место отдыха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «потерянными овцами». Слово от корня אבד может также означать гибнущих или пропавших.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение трудно для истолкования. Возможно и более формальное понимание: «их пастухи сбили их с пути; горы уводили их прочь».'
    reason: textual_or_syntactic_ambiguity
  - marker: c
    text: Переход «от горы к холму» может также напоминать о служении на высотах — распространённом у Иеремии образе отступничества.
    reason: cross_reference
lexical_decisions:
- source_word: צֹאן אֹבְדוֹת
  choice: стадом потерянных овец
  rationale: Сохраняет пастушеский образ и значение причастия от אבד — «потерянные, пропавшие», не усиливая его до окончательной гибели. Слово «стадо» естественно передаёт собирательное צֹאן.
- source_word: היה עַמִּי
  choice: Мой народ был
  rationale: Передаёт именную конструкцию с формой прошедшего времени היה и сохраняет заветное выражение «Мой народ».
- source_word: רֹעֵיהֶם
  choice: их пастухи
  rationale: Сохраняет буквальную метафору руководителей как пастухов; замена на «вожди» или «руководители» неоправданно устранила бы образ.
- source_word: הִתְעוּם
  choice: сбили их с пути
  rationale: Каузативная форма от תעה выражает ответственность пастухов за то, что народ заблудился; русское выражение естественно и точно передаёт этот смысл.
- source_word: הָרִים שובבים
  choice: заставив скитаться по горам
  rationale: Синтаксис и форма שובבים трудны. Контекстуальная передача связывает выражение с вызванным пастухами беспорядочным движением овец по горам, а неоднозначность отмечена в сноске.
- source_word: מֵהַר אֶל גִּבְעָה הָלָכוּ
  choice: Они переходили от горы к холму
  rationale: Сохраняет субъект «овцы/народ», направление движения и различие между הַר («гора») и גִּבְעָה («холм»). «Переходили» естественно передаёт повторяющееся беспокойное движение, не добавляя прямо мотива идолопоклонства.
- source_word: שָׁכְחוּ רִבְצָם
  choice: забыли своё место отдыха
  rationale: רִבְצָם обозначает место, где животные ложатся и отдыхают. «Место отдыха» понятно современному читателю и сохраняет пастушеский образ, не сужая значение до загона.
theological_decisions:
- issue: Возможный намёк на идолопоклонство на горах и холмах
  choice: Сохранить географический и пастушеский образ в основном тексте, оставив возможный намёк неявным.
  alternative: Передать «гора» и «холм» как культовые высоты и тем самым прямо обозначить отступничество.
  rationale: У Иеремии горы и холмы могут быть связаны с незаконным культом, однако непосредственный образ здесь — заблудившиеся овцы. Явное упоминание идолопоклонства в основном тексте устранило бы намеренную образную многозначность.
- issue: Синтаксическая неоднозначность הָרִים שובבים
  choice: Передать выражение как вызванное пастухами блуждание овец по горам.
  alternative: Понять слова более формально как «горы, уводящие в сторону» либо связать שובבים непосредственно с горами.
  rationale: Формальная конструкция трудна и допускает разные связи слов. Выбранный вариант лучше соответствует параллельным действиям пастухов и овец, а альтернативная структура сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно возвышенный. Пастушеская метафора сохранена последовательно; трудная еврейская конструкция передана естественно, но её неоднозначность не скрыта и вынесена в сноску.
