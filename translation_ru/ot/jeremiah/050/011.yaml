source:
  edition: WLC
  text: כִּ֤י תשמחי כִּ֣י תעלזי שֹׁסֵ֖י נַחֲלָתִ֑/י כִּ֤י תפושי כְּ/עֶגְלָ֣ה דָשָׁ֔ה ו/תצהלי כָּ/אֲבִּרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/011.yaml
  text: Because you rejoice[a], because you exult, plunderers of my inheritance, because you frolic like a threshing heifer and neigh like stallions[b],
translation:
  language: ru
  text: Потому что ты радуешься[a], потому что ликуешь, о грабители Моего наследия[b], потому что резвишься, как телица, молотящая зерно, и ржёшь, как могучие кони[c], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Хотя ты радуешься». Еврейское כִּי обычно означает «потому что», но здесь возможно и уступительное понимание.'
    reason: lexical_alternative
  - marker: b
    text: «Моё наследие» — народ и/или земля, принадлежащие Господу.
    reason: referential_ambiguity
  - marker: c
    text: 'Буквально: «как могучие». По упоминанию ржания имеются в виду сильные кони; возможно также: «как жеребцы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: за то, что
  rationale: Повторяющаяся частица естественно вводит основание последующего суда и сохраняет причинный смысл; повтор передан ради пророческой выразительности.
- source_word: תשמחי / תעלזי
  choice: ты радуешься / ликуешь
  rationale: 'Два близких глагола разграничены: второй выражает более бурное торжество. Формы женского рода единственного числа отражены обращением на «ты» к олицетворённому Вавилону.'
- source_word: שֹׁסֵי נַחֲלָתִי
  choice: о грабители Моего наследия
  rationale: Причастие обозначает тех, кто грабит и разоряет; звательная частица «о» ясно показывает обращение. «Наследие» сохраняет смысл принадлежащих Господу народа и/или земли.
- source_word: תפושי
  choice: резвишься
  rationale: Глагол передаёт живое, необузданное движение; «резвишься» естественно сочетается с образом телицы и насмешливым тоном.
- source_word: כְּעֶגְלָה דָשָׁה
  choice: как телица, молотящая зерно
  rationale: Развёрнутая формулировка понятнее современному читателю, чем специальное выражение «молотильная телица», и сохраняет земледельческий образ.
- source_word: ותצהלי כָּאֲבִּרִים
  choice: и ржёшь, как могучие кони
  rationale: צהל в данном животном образе означает ржание. אַבִּירִים буквально указывает на сильных, могучих; контекст позволяет понять их как коней, не вынуждая более узкое «жеребцы».
theological_decisions:
- issue: Значение повторяющегося כִּי
  choice: 'Причинное: «за то, что»'
  alternative: 'Уступительное: «хотя»'
  rationale: Причинное прочтение соответствует обычному значению частицы и связывает злорадство Вавилона с объявляемым далее судом, однако грамматика допускает уступительное понимание, отмеченное в сноске.
- issue: Адресат форм женского рода единственного числа
  choice: Олицетворённый Вавилон, к которому обращаются на «ты»
  alternative: Жители города как собирательный адресат
  rationale: Женские формы глаголов естественно относятся к Вавилону как олицетворённому городу; стоящее внутри обращения множественное «грабители» одновременно выводит на первый план его жителей, и это напряжение сохранено.
- issue: Объём понятия נַחֲלָתִי
  choice: «Моё наследие» без уточнения
  alternative: Только земля Иудеи или только народ Израиля
  rationale: В контексте слово может охватывать и народ, и землю, принадлежащие Господу; перевод не сужает референцию.
translation_notes:
  register: Современный литературный русский с возвышенной пророческой интонацией. Повтор «за то, что» сохраняет анафору оригинала. Необычный переход от единственного «ты» к множественному обращению «грабители» оставлен намеренно как отражение олицетворённого Вавилона и его жителей. Конечное тире показывает, что синтаксическая мысль продолжается в следующем стихе.
