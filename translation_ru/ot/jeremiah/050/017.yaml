source:
  edition: WLC
  text: שֶׂ֧ה פְזוּרָ֛ה יִשְׂרָאֵ֖ל אֲרָי֣וֹת הִדִּ֑יחוּ הָ/רִאשׁ֤וֹן אֲכָל/וֹ֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/זֶ֤ה הָ/אַחֲרוֹן֙ עִצְּמ֔/וֹ נְבוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/017.yaml
  text: Israel is a scattered sheep[a]; lions have driven him away. First the king of Assyria devoured him[c][b], and this last one—Nebuchadnezzar king of Babylon—has gnawed his bones.
translation:
  language: ru
  text: Израиль — рассеянная овца[a]; львы прогнали его. Сначала его пожрал царь Ассирии, а этот последний — Навуходоносор[b], царь Вавилона, — обглодал ему кости[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассеянный ягнёнок».'
    reason: lexical_alternative
  - marker: b
    text: Еврейская форма имени здесь ближе к «Навуходреццар»; в русском языке традиционно употребляется «Навуходоносор».
    reason: lexical_alternative
  - marker: c
    text: Еврейский глагол может означать «обглодал ему кости», «обнажил его кости» или, более широко, «сокрушил его».
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: овца
  rationale: Существительное обозначает животное из мелкого скота и может переводиться как «овца» или «ягнёнок». «Овца» естественно передаёт образ беззащитного Израиля как собирательного целого; альтернативное значение отмечено в сноске.
- source_word: פְזוּרָה
  choice: рассеянная
  rationale: Форма описывает овцу как разогнанную, отбившуюся или оказавшуюся вдали от стада. «Рассеянная» сохраняет связь с темой рассеяния Израиля.
- source_word: אֲרָיוֹת הִדִּיחוּ
  choice: львы прогнали
  rationale: Порода Hифиль глагола передаёт понуждение уйти, изгнание или обращение в бегство. «Прогнали» естественно продолжает образ хищников и добычи.
- source_word: אֲכָלוֹ
  choice: пожрал его
  rationale: Буквально «съел его». Глагол «пожрал» сохраняет хищническую метафору и её насильственную выразительность.
- source_word: וְזֶה הָאַחֲרוֹן
  choice: а теперь этот, последний
  rationale: Указательное местоимение и прилагательное противопоставляют последнего, более позднего угнетателя первому. «Теперь» делает временное противопоставление естественным по-русски, не устраняя указательное «этот».
- source_word: עִצְּמוֹ
  choice: обглодал ему кости
  rationale: Редкий глагол связан с костями и допускает значения «обглодать кости», «обобрать кости» или шире «сокрушить». Выбрано яркое значение, продолжающее образ львов; неоднозначность отмечена в сноске.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Употреблена укоренившаяся русская форма имени; более близкое к написанию еврейского текста «Навуходреццар» отмечено в сноске.
- source_word: מֶלֶךְ אַשּׁוּר / מֶלֶךְ בָּבֶל
  choice: царь Ассирии / царь Вавилона
  rationale: Естественная русская передача обеих сопряжённых конструкций.
theological_decisions:
- issue: Образ Израиля и грамматическое число
  choice: Израиль представлен как одна овца, а далее обозначен местоимением единственного числа «его».
  alternative: Передать Израиль как стадо и использовать множественное число.
  rationale: В еврейском тексте образ и местоименные суффиксы стоят в единственном числе. Это сохраняет олицетворение народа как единой беззащитной жертвы.
- issue: Степень конкретности последнего глагола
  choice: 'Сохранён телесный хищнический образ: «обглодал ему кости».'
  alternative: Обобщить как «сокрушил его».
  rationale: Конкретная передача удерживает развитие метафоры от изгнания добычи к её пожиранию и костям, не превращая образ в отвлечённое утверждение.
translation_notes:
  register: Современный литературный русский язык с сохранением напряжённой пророческой образности. Инверсия «Сначала пожрал его царь Ассирии» умеренно возвышенна и близка к порядку слов оригинала. Формы «пожрал» и «обглодал» намеренно резки, поскольку поддерживают сквозной образ львов и их добычи.
