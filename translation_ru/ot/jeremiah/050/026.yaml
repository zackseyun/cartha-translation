  text: בֹּֽאוּ לָ֤/הּ מִ/קֵּץ֙ פִּתְח֣וּ מַאֲבֻסֶ֔י/הָ סָלּ֥וּ/הָ כְמוֹ עֲרֵמִ֖ים וְ/הַחֲרִימ֑וּ/הָ אַל תְּהִי לָ֖/הּ שְׁאֵרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/026.yaml
  text: Come against her from the farthest border[a]; open her storehouses; pile her up like heaps, and devote her to destruction[c][b]; let no remnant remain to her.
translation:
  language: ru
  text: Идите против неё с края[a]; откройте её хранилища[b], сгребите её в груды и предайте её заклятию[c]; пусть у неё не останется и остатка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от предела», «от самого дальнего края». Еврейское выражение может указывать на самые дальние пределы страны или территории.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зернохранилища», «амбары». Еврейское слово буквально может обозначать кормушки или места кормления, а здесь, вероятно, употреблено в более широком смысле — о местах хранения припасов.'
    reason: lexical_alternative
  - marker: c
    text: Еврейский глагол означает предать под заклятие, то есть предназначить для полного уничтожения.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ לָהּ
  choice: Идите против неё
  rationale: Форма повелительного наклонения во множественном числе призывает вражеские силы выступить против Вавилона; предлог ל־ в данном контексте передаёт враждебную направленность.
- source_word: מִקֵּץ
  choice: от самых окраин
  rationale: קֵץ означает «конец, край, предел». Множественное «окраин» естественно по-русски передаёт призыв идти из самых отдалённых пределов, не уточняя прямо, о пределах какой территории идёт речь.
- source_word: מַאֲבֻסֶיהָ
  choice: её хранилища
  rationale: Слово может буквально обозначать кормушки или места кормления, но здесь, в сцене разграбления Вавилона, вероятнее подразумевает места хранения припасов. Общее «хранилища» не сужает образ до одних лишь зернохранилищ.
- source_word: סָלּוּהָ כְמוֹ עֲרֵמִים
  choice: сгребите её в груды
  rationale: Глагол סלל здесь имеет значение «наваливать, складывать в кучу», а עֲרֵמִים — «груды, кучи». Формулировка сохраняет резкий образ превращённого в груды Вавилона, не уточняя, идёт ли речь о городе или его содержимом.
- source_word: וְהַחֲרִימוּהָ
  choice: и предайте её заклятию
  rationale: Глагол חרם в породе Hiphil означает предать под запрет/заклятие, то есть предназначить для полного уничтожения. «Предайте заклятию» сохраняет особый судебно-сакральный оттенок, а сноска разъясняет его.
- source_word: אַל תְּהִי לָהּ שְׁאֵרִית
  choice: пусть у неё не останется и остатка
  rationale: שְׁאֵרִית может обозначать остаток или уцелевшую часть. Русская формулировка сохраняет ключевой образ остатка и подчёркивает полноту суда.
theological_decisions:
- issue: Передача החרים в пророчестве о суде
  choice: предайте её заклятию
  alternative: полностью уничтожьте её
  rationale: Выбранный вариант сохраняет не только идею истребления, но и присущий еврейскому глаголу оттенок посвящения объекта необратимому уничтожению по приговору. Сноска делает этот смысл понятным без внесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным ритмом пророческого призыва. Сохранены повелительные формы, военный контекст и намеренно резкий образ Вавилона, сгребаемого в груды. Техническое «предать заклятию» пояснено в сноске.
