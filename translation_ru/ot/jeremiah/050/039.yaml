base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/039.yaml
  text: Therefore desert creatures will dwell there with hyenas[a], and ostriches will dwell in her; she will never again be inhabited forever[c][b], nor will she be lived in from generation to generation.
translation:
  language: ru
  text: Поэтому звери пустыни будут обитать там вместе с гиенами[a], и страусы[b] будут обитать в ней[c]. Она уже никогда не будет населена, и никто не будет жить в ней из рода в род.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с шакалами» или «с воющими зверями». Точно определить, каких животных обозначают эти древнееврейские слова, невозможно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дочери страуса», то есть страусы. В некоторых старых переводах: «совы».'
    reason: lexical_alternative
  - marker: c
    text: В древнееврейском тексте город Вавилон олицетворён как женщина, поэтому сказано «в ней» и далее употреблены формы женского рода.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт обычное значение частицы, вводящей следствие возвещённого суда над Вавилоном.
- source_word: צִיִּים
  choice: звери пустыни
  rationale: Обобщённое обозначение животных, связанных с пустынными местами и развалинами; точный вид определить невозможно.
- source_word: אֶת
  choice: вместе с
  rationale: Здесь частица употреблена в значении совместности и связывает две группы пустынных животных.
- source_word: אִיִּים
  choice: гиенами
  rationale: Вероятно, имеются в виду дикие животные-падальщики, обитающие среди развалин; конкретная зоологическая идентификация остаётся неясной, поэтому варианты приведены в сноске.
- source_word: בְּנוֹת יַעֲנָה
  choice: страусы
  rationale: Буквально «дочери страуса»; это древнееврейское обозначение страусов. Традиционный вариант «совы» менее вероятен.
- source_word: בָהּ
  choice: в ней
  rationale: Суффикс женского рода относится к Вавилону как к олицетворённому городу.
- source_word: לֹא תֵשֵׁב עוֹד לָנֶצַח
  choice: Она больше не будет заселена вовеки
  rationale: Сохранены и значение «больше не», и отдельное усиление לָנֶצַח «вовеки», выражающие окончательность запустения.
- source_word: לֹא תִשְׁכּוֹן
  choice: не будет обитаема
  rationale: Передаёт смысл отсутствия жителей и сохраняет город в качестве грамматического субъекта женского рода.
- source_word: עַד דּוֹר וָדוֹר
  choice: из рода в род
  rationale: Устойчивое русское выражение, передающее продолжительность на протяжении последовательных поколений.
