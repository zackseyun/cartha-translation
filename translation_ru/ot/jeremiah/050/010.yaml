source:
  edition: WLC
  text: וְ/הָיְתָ֥ה כַשְׂדִּ֖ים לְ/שָׁלָ֑ל כָּל שֹׁלְלֶ֥י/הָ יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/010.yaml
  text: And Chaldea will become plunder[a]; all who plunder her will have their fill[b], declares Yahweh.
translation:
  language: ru
  text: И Халдея станет добычей[a]; все, кто будет грабить её, насытятся[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «халдеи». Еврейское слово имеет форму множественного числа, но здесь, вероятно, обозначает страну или державу Халдею, на что указывает последующее «её».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «получат вдоволь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: И ... станет
  rationale: Перфект с союзом в пророческом контексте передаёт будущее следствие; «станет» подчёркивает переход в состояние добычи.
- source_word: כַשְׂדִּים
  choice: Халдея
  rationale: Хотя форма морфологически множественного числа может обозначать халдеев, женский суффикс в שֹׁלְלֶיהָ указывает здесь на страну или державу как единое целое.
- source_word: לְשָׁלָל
  choice: добычей
  rationale: В военном контексте слово обозначает имущество или богатство, захватываемое победителями; русское «добыча» естественно сохраняет этот смысл.
- source_word: כָּל שֹׁלְלֶיהָ
  choice: все, кто будет грабить её
  rationale: Относительная конструкция естественно передаёт причастие с женским суффиксом, относящимся к Халдее, и сохраняет активный характер действия.
- source_word: יִשְׂבָּעוּ
  choice: насытятся
  rationale: Глагол означает «насытиться, получить достаточно». Выбор сохраняет образ полноты и не уточняет сверх текста, идёт ли речь только о богатстве.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Формула вводит авторитетное божественное изречение; «возвещает» звучит современно и достойно, а личное имя передаётся как «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Объект обозначения כַשְׂדִּים
  choice: Халдея как страна/держава
  alternative: халдеи как народ
  rationale: Форма допускает этническое прочтение, однако последующий суффикс женского рода единственного числа («её») лучше согласуется с обозначением страны или державы. Альтернатива сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким пророческим ритмом. «Добычей» и «грабить» ясны обычному читателю; «насытятся» сохраняет конкретный образ еврейского глагола и его смысловую открытость.
