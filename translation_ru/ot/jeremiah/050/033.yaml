  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֲשׁוּקִ֛ים בְּנֵי יִשְׂרָאֵ֥ל וּ/בְנֵי יְהוּדָ֖ה יַחְדָּ֑ו וְ/כָל שֹֽׁבֵי/הֶם֙ הֶחֱזִ֣יקוּ בָ֔/ם מֵאֲנ֖וּ שַׁלְּחָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/033.yaml
  text: 'Thus says Yahweh of hosts: The sons of Israel and the sons of Judah alike are oppressed[a]; all their captors hold them fast[b]; they refuse to let them go.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Сыны Израиля и сыны Иуды одинаково угнетены[a]; все взявшие их в плен крепко удерживают их и отказываются отпустить их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сыны Израиля угнетены, и вместе с ними — сыны Иуды».'
    reason: В еврейском тексте наречие יַחְדָּו допускает как общее отнесение к обеим группам, так и более тесную связь со вторым членом конструкции.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая и естественная для современного русского языка пророческая формула, сохраняющая торжественный характер оригинала.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יְהוָה как «Яхве», а צְבָאוֹת — через широкое по значению «Воинств», не ограничивая титул только земными армиями.
- source_word: עֲשׁוּקִים
  choice: угнетены
  rationale: Страдательное причастие описывает нынешнее состояние Израиля и Иуды; краткая форма «угнетены» естественна по-русски и сохраняет пассивное значение.
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  choice: Сыны Израиля и сыны Иуды
  rationale: Сохраняет параллельную сыновнюю формулу בְּנֵי для обеих групп; «сыны» уместно в торжественном библейском регистре и понятно современному читателю.
- source_word: יַחְדָּו
  choice: все
  rationale: В данном положении слово подчёркивает общность участи обеих названных групп; «все» естественно выражает, что и Израиль, и Иуда одинаково находятся под гнётом.
- source_word: שֹׁבֵיהֶם
  choice: пленившие их
  rationale: Действительное причастие от שׁבה обозначает тех, кто захватил и увёл людей в плен; эта формулировка точнее контекстуально, чем более общее «захватчики».
- source_word: הֶחֱזִיקוּ בָם
  choice: крепко держат их
  rationale: Передаёт устойчивое сочетание со значением твёрдого удержания пленников, а не простого прикосновения или первоначального захвата.
- source_word: מֵאֲנוּ שַׁלְּחָם
  choice: отказываются отпускать
  rationale: Совершенный вид מֵאֲנוּ описывает установившееся нежелание, а שׁלח в контексте плена означает освобождение; настоящее время естественно передаёт продолжающееся положение.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Передача בְּנֵי в названиях двух народных групп
  choice: сыны Израиля ... сыны Иуды
  alternative: народ Израиля ... народ Иуды
  rationale: Буквальная сыновняя формула сохраняет образ и параллелизм оригинала, не вводя дополнительного конфессионального толкования.
- issue: Синтаксическая связь יַחְדָּו
  choice: Обе группы одинаково охвачены одним состоянием угнетения
  alternative: Сыны Иуды угнетены вместе с сынами Израиля
  rationale: Положение наречия допускает оттенок «вместе с ними», но наиболее прямо оно объединяет Израиль и Иуду в общей участи. Альтернативная синтаксическая расстановка сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим регистром. Формы «сыны» и «Воинств» сохраняют достоинство и образность исходного текста, тогда как синтаксис и глагольные выражения остаются понятными обычному современному читателю.
