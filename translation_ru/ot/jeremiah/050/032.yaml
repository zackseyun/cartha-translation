source:
  edition: WLC
  text: וְ/כָשַׁ֤ל זָדוֹן֙ וְ/נָפַ֔ל וְ/אֵ֥ין ל֖/וֹ מֵקִ֑ים וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/עָרָ֔י/ו וְ/אָכְלָ֖ה כָּל סְבִיבֹתָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/032.yaml
  text: And the arrogant one will stumble and fall[a], with no one to raise him up; and I will kindle a fire in his cities[b], and it will consume all around him.
translation:
  language: ru
  text: И споткнётся гордец[a], и падёт, и некому будет поднять его. Я зажгу огонь в его городах[b], и он пожрёт всё вокруг него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гордость», «дерзость». Еврейское זָדוֹן часто обозначает отвлечённое качество, но здесь последующие глаголы и местоименные формы мужского рода единственного числа позволяют понимать его как олицетворённого гордеца.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в его городах». Вавилон здесь олицетворён как фигура мужского рода в единственном числе.'
    reason: cultural_note
lexical_decisions:
- source_word: זָדוֹן
  choice: гордец
  rationale: Существительное может означать «гордость», «дерзость» или «высокомерие», однако мужской род последующих глаголов и местоименных суффиксов позволяет передать здесь олицетворённого носителя гордыни — Вавилон.
- source_word: כָשַׁל
  choice: споткнётся
  rationale: В пророческом контексте форма обозначает предстоящее падение; глагол сохраняет образ утраты опоры и естественно сочетается с последующим «падёт».
- source_word: נָפַל
  choice: и падёт
  rationale: 'Сохранены последовательность и усиление исходного текста: сначала гордец спотыкается, затем падает.'
- source_word: מֵקִים
  choice: поднять его
  rationale: Причастие породы hифиль от קום означает того, кто заставляет упавшего встать; перевод сохраняет прямой образ, не сужая его до политического восстановления.
- source_word: הִצַּתִּי אֵשׁ
  choice: Я зажгу огонь
  rationale: Идиома передана с сохранением явно названного в еврейском тексте «огня»; прошедшая по форме глагольная конструкция в пророчестве выражает решительно предстоящее действие.
- source_word: בְּעָרָיו
  choice: в его городах
  rationale: Местоименный суффикс имеет мужской род и единственное число; формулировка сохраняет последовательное олицетворение Вавилона.
- source_word: וְאָכְלָה
  choice: и он пожрёт
  rationale: Глагол буквально рисует огонь как пожирающую силу. Русское «пожрёт» сохраняет яркость образа; местоимение «он» согласовано с существительным «огонь».
- source_word: כָּל סְבִיבֹתָיו
  choice: всё вокруг него
  rationale: Естественная русская формулировка передаёт полноту уничтожения всего, что окружает олицетворённого Вавилона, и сохраняет мужской род ссылки.
theological_decisions:
- issue: Олицетворение Вавилона посредством форм мужского рода единственного числа
  choice: Сохранить личное обозначение «гордец» и последовательные ссылки «его», «него»
  alternative: Передать זָדוֹן отвлечённо как «гордость» или говорить о Вавилоне безлично
  rationale: Еврейская грамматика последовательно представляет объект суда как мужскую фигуру в единственном числе. Такой перевод сохраняет образ и не превращает его без необходимости в отвлечённое понятие.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Будущие формы естественно передают пророческий смысл; пара «споткнётся — падёт» сохраняет ритм и нарастание исходного текста. «Пожрёт» выбрано как живое, но не разговорное выражение традиционного образа всепоглощающего огня.
