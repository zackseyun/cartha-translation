  yaml_path: translation/ot/jeremiah/050/030.yaml
  text: Therefore her young men will fall in her streets[a], and all her warriors will be silenced on that day, declares Yahweh.
translation:
  language: ru
  text: Поэтому её юноши падут на её улицах, и все её воины умолкнут[a] в тот день, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «погибнут». Еврейский глагол может означать «умолкнуть» или «стать неподвижными»; в данном контексте он может подразумевать смерть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие, вводимые еврейской причинно-следственной частицей.
- source_word: יִפְּלוּ
  choice: падут
  rationale: Сохраняет образ глагола נפל «падать»; в контексте военного суда подразумевается гибель, но она не выражена более определённо, чем в оригинале.
- source_word: בַחוּרֶיהָ
  choice: её юноши
  rationale: בחור обозначает молодых мужчин в расцвете сил, нередко способных участвовать в войне. «Юноши» естественно и не добавляет отсутствующего в тексте значения «избранные».
- source_word: בִּרְחֹבֹתֶיהָ
  choice: на её улицах
  rationale: רחובות может обозначать широкие городские улицы или площади; в данном городском контексте «улицах» звучит естественно и сохраняет пространственный смысл.
- source_word: אַנְשֵׁי מִלְחַמְתָּהּ
  choice: все её воины
  rationale: Кратко и естественно передаёт буквальное выражение «люди её войны», сохраняя его военный смысл.
- source_word: יִדַּמּוּ
  choice: умолкнут
  rationale: Нифаль глагола דמם передаёт безмолвие или неподвижность; в контексте суда и войны может подразумевать смерть. «Умолкнут» сохраняет исходный образ и не снимает смысловую напряжённость.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная современная передача обычной пророческой формулы времени.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт пророческую формулу торжественно, но понятно современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного Божьего имени сохраняет его отличие от титула «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. «Яхве» непосредственно передаёт имя, не заменяя его титулом.
- issue: Следует ли явно выразить значение смерти в יִדַּמּוּ
  choice: умолкнут
  alternative: погибнут; будут уничтожены
  rationale: Глагол буквально сохраняет образ безмолвия или неподвижности, тогда как военный контекст позволяет услышать намёк на смерть. Основной текст сохраняет эту неоднозначность, а явное значение гибели вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Синтаксис остаётся ясным и близким к структуре еврейского стиха; повтор притяжательного местоимения сохранён. Маркер примечания поставлен непосредственно после слова «умолкнут», к которому относится лексическая альтернатива.
