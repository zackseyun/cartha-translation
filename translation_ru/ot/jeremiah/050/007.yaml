source:
  edition: WLC
  text: כָּל מוֹצְאֵי/הֶ֣ם אֲכָל֔וּ/ם וְ/צָרֵי/הֶ֥ם אָמְר֖וּ לֹ֣א נֶאְשָׁ֑ם תַּ֗חַת אֲשֶׁ֨ר חָטְא֤וּ לַֽ/יהוָה֙ נְוֵה צֶ֔דֶק וּ/מִקְוֵ֥ה אֲבֽוֹתֵי/הֶ֖ם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/007.yaml
  text: All who found them devoured them[a], and their adversaries said, “We are not guilty, because they sinned against Yahweh, the habitation of righteousness[b], the hope of their fathers—Yahweh.”
translation:
  language: ru
  text: 'Все, кто находил их, пожирали их, а их враги говорили: «Мы не виновны, потому что они согрешили против Яхве, обители праведности и надежды их отцов, — Яхве».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹצְאֵיהֶם
  choice: все, кто находил их
  rationale: Субстантивированное причастие обозначает всякого, кто встречал или обнаруживал их; такая формулировка естественна по-русски и сохраняет обобщение כָּל.
- source_word: אֲכָלוּם
  choice: пожирали их
  rationale: Буквально глагол означает «ели», но здесь метафорически описывает хищническое уничтожение; «пожирали» сохраняет образ.
- source_word: צָרֵיהֶם
  choice: их враги
  rationale: Слово обозначает враждебных противников. «Враги» ясно и естественно, не сужая смысл до одних лишь военных сил.
- source_word: לֹא נֶאְשָׁם
  choice: мы не виновны
  rationale: Передаёт заявление противников об отсутствии на них вины; форма прямой речи сохранена.
- source_word: תַּחַת אֲשֶׁר
  choice: потому что
  rationale: Оборот указывает на основание, которым враги оправдывают себя.
- source_word: חָטְאוּ לַיהוָה
  choice: согрешили против Яхве
  rationale: Сочетание חטא с ל выражает направленность греха против Бога; русское «согрешить против» передаёт это естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Сохранено личное имя Бога, представленное тетраграмматоном, а не заменено титулом.
- source_word: נְוֵה צֶדֶק
  choice: обитель праведности
  rationale: נְוֵה может означать пастбище, жилище или обитель. В данном приложении к Яхве «обитель праведности» звучит естественно и сохраняет метафорическую открытость; пастбищный оттенок отмечен в сноске.
- source_word: מִקְוֵה אֲבוֹתֵיהֶם
  choice: надежда их отцов
  rationale: מִקְוֶה здесь наиболее связно понимается как «надежда» или «ожидание» и выступает именованием Яхве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст дважды употребляет личное имя. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Отнесение נְוֵה צֶדֶק וּמִקְוֵה אֲבוֹתֵיהֶם
  choice: 'Обе фразы понимаются как приложения к Яхве: «обители праведности и надежды их отцов»'
  alternative: Понимать נְוֵה צֶדֶק как землю или место пребывания Израиля
  rationale: Синтаксическое положение после «согрешили против Яхве» и повтор имени Яхве в конце поддерживают чтение обеих фраз как именований Бога, хотя образ נְוֵה допускает пастбищный оттенок.
- issue: Повтор имени Яхве в конце высказывания
  choice: 'Сохранить повтор: «— против Яхве»'
  alternative: Опустить повтор как стилистически избыточный
  rationale: Повтор присутствует в еврейском тексте и создаёт риторическое обрамление; добавление предлога в русском проясняет синтаксическую связь, не меняя референта.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены образ «пожирания», приложения к имени Яхве и заключительный повтор божественного имени; архаичные обороты избегаются.
