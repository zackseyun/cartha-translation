  source_fidelity: 'Основные элементы еврейского текста переданы верно: двойная временная формула, имя Яхве, отдельное упоминание Израиля и Иуды, их совместность, плач и поиск Бога. Однако в исходном тексте связь «сыны Израиля — они и сыны Иуды вместе» синтаксически неудачна, а повтор глагола движения в основной строке сглажен сильнее, чем требуется при заявленной оптимальной эквивалентности.'
  naturalness: Предлагаемая редакция сохраняет умеренно торжественный, современный литературный регистр. Формула «они и сыны Иуды вместе» несколько отмечена порядком слов, но понятна и оправданна как близкое отражение эмфатического местоимения в оригинале.
  terminology: «Яхве», «сыны Израиля», «сыны Иуды» и «своего Бога» корректны. Не следует заменять эти наименования обобщающими обозначениями, поскольку стих намеренно различает две общности.
