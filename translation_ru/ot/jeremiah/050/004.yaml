  text: בַּ/יָּמִ֨ים הָ/הֵ֜מָּה וּ/בָ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל הֵ֥מָּה וּ/בְנֵֽי יְהוּדָ֖ה יַחְדָּ֑ו הָל֤וֹךְ וּ/בָכוֹ֙ יֵלֵ֔כוּ וְ/אֶת יְהוָ֥ה אֱלֹהֵי/הֶ֖ם יְבַקֵּֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/004.yaml
  text: In those days and at that time[a], declares Yahweh, the children of Israel will come, they and the children of Judah together. Going and weeping, they will go[b], and they will seek Yahweh their God.
translation:
  language: ru
  text: В те дни и в то время, — возвещает Яхве, — придут сыны Израиля, они и сыны Иуды вместе. Идя и плача, они будут идти и искать Яхве, своего Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה וּבָעֵת הַהִיא
  choice: В те дни и в то время
  rationale: Сохранено двойное указание времени, характерное для пророческой речи; оно не сведено к одному выражению.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная и естественная для современного русского пророческая формула; личное имя передано напрямую.
- source_word: יָבֹאוּ
  choice: придут
  rationale: Передаёт простое будущее и оставляет место назначения неуточнённым, как в еврейском тексте.
- source_word: בְנֵי יִשְׂרָאֵל ... וּבְנֵי יְהוּדָה
  choice: сыны Израиля ... сыны Иуды
  rationale: Сохранён семейно-корпоративный образ оригинала и явное различение двух общностей.
- source_word: הֵמָּה ... יַחְדָּו
  choice: они вместе с
  rationale: Местоимение הֵמָּה отражено, а יַחְדָּו ясно передаёт совместное движение и восстановленное единство.
- source_word: הָלוֹךְ וּבָכוֹ יֵלֵכוּ
  choice: Плача, они будут идти
  rationale: Естественно переданы продолжительное движение и сопровождающий его плач; буквальный повтор глагола движения пояснён в сноске.
- source_word: וְאֶת יְהוָה אֱלֹהֵיהֶם יְבַקֵּשׁוּ
  choice: и искать Яхве, своего Бога
  rationale: «Искать» сохраняет как прямой смысл, так и религиозно-заветный оттенок обращения к Богу; возвратное «своего» естественно передаёт אֱלֹהֵיהֶם.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохранено личное заветное имя, прямо стоящее в еврейском тексте, без замены титулом.
- issue: Совместное восстановление Израиля и Иуды
  choice: Обе общности названы отдельно и представлены идущими вместе
  alternative: Обобщить как «весь Израиль» либо дать позднейшее богословское истолкование
  rationale: Перевод сохраняет историко-заветное различие и одновременно выраженное в стихе единство, не разрешая его через привнесённую систему толкования.
- issue: Характер плача
  choice: Оставлен без уточнения причины
  alternative: Истолковать как плач покаяния, скорби или радости
  rationale: Контекст может наводить на богословское понимание плача, однако сам стих его причину прямо не называет.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим звучанием. Синтаксис сохраняет заметный акцент оригинала на совместном приходе Израиля и Иуды, но остаётся понятным обычному читателю.
