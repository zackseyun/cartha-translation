  language: ru
  text: Как срублен и разбит молот всей земли! Как Вавилон стал пустыней среди народов![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «боевой молот всей земли». Еврейская метафора изображает Вавилон сокрушающим орудием, обращённым против народов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стал среди народов предметом ужаса». Еврейское слово может указывать и на запустение, и на потрясение, вызываемое этим разорением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Как
  rationale: Вводит риторическое восклицание, выражающее потрясение, а не вопрос; русское «как» естественно сохраняет эту силу.
- source_word: נִגְדַּע
  choice: срублен
  rationale: Нифаль от גדע означает «быть срубленным, отсечённым». «Срублен» сохраняет пассивность и образ низвержения прежней силы.
- source_word: וַיִּשָּׁבֵר
  choice: и разбит
  rationale: Форма от שבר передаёт состояние сломанного или разбитого предмета; «разбит» естественно сочетается с образом молота, не усиливая значение до «раздроблен».
- source_word: פַּטִּישׁ
  choice: молот
  rationale: Прямое и ясное соответствие еврейскому названию молота; метафора Вавилона как сокрушающего орудия сохранена без поясняющей подмены.
- source_word: כָּל הָאָרֶץ
  choice: всей земли
  rationale: В контексте международного господства Вавилона и упоминания народов «земля» лучше сохраняет широкий масштаб, чем «страна».
- source_word: הָיְתָה לְשַׁמָּה
  choice: стал … опустошением
  rationale: שַׁמָּה допускает значения опустошения и вызывающего ужас зрелища; основной текст передаёт состояние разорения, а второе значение отмечено в сноске.
- source_word: בָּבֶל
  choice: Вавилон
  rationale: Устоявшаяся русская форма названия.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: В данном геополитическом контексте גוים обозначает народы или нации вообще; «народы» звучит естественно и не вносит позднейшего специального смысла слова «язычники».
theological_decisions:
- issue: Метафорическое представление Вавилона как «молота всей земли»
  choice: Сохранить прямую метафору «молот всей земли».
  alternative: Передать толкованием «сокрушитель всей земли» или уточнением «боевой молот всей земли».
  rationale: 'Образ существен для риторики суда: орудие, сокрушавшее другие народы, само срублено и разбито. Прямая метафора не сужает заложенный в тексте смысл.'
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Параллельные восклицания сохранены; синтаксис остаётся понятным обычному читателю.
