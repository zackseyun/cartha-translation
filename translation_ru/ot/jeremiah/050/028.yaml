source:
  edition: WLC
  text: ק֥וֹל נָסִ֛ים וּ/פְלֵטִ֖ים מֵ/אֶ֣רֶץ בָּבֶ֑ל לְ/הַגִּ֣יד בְּ/צִיּ֗וֹן אֶת נִקְמַת֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ נִקְמַ֖ת הֵיכָלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/028.yaml
  text: The sound of fugitives and escapees from the land of Babylon[a], to declare in Zion the vengeance of Yahweh our God[c][b], the vengeance for his temple.
translation:
  language: ru
  text: Голос[a] бегущих и спасшихся[b] из земли Вавилона — возвестить на Сионе возмездие Яхве, нашего Бога, возмездие за Его храм[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звук»; возможен смысл: «слышен голос».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «уцелевших»; буквально речь идёт о тех, кому удалось вырваться или избежать гибели.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «возмездие Его храма»; вероятный смысл — возмездие за зло, причинённое храму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: голос
  rationale: קוֹל может означать «голос», «звук» или «шум». «Голос» сохраняет образ вести, которую приносят вышедшие из Вавилона, и не добавляет отсутствующего в еврейском тексте личного глагола.
- source_word: נָסִים
  choice: бегущих
  rationale: Причастие от נוס обозначает тех, кто бежит или спасается бегством. Субстантивированное «бегущих» передаёт действие без современных юридических оттенков слова «беглецы».
- source_word: וּפְלֵטִים
  choice: и спасшихся
  rationale: Слово обозначает тех, кому удалось избежать гибели или вырваться. «Спасшихся» естественно по-русски и сохраняет отличие от предшествующего «бегущих».
- source_word: מֵאֶרֶץ בָּבֶל
  choice: из земли Вавилона
  rationale: Сохраняется явно выраженное אֶרֶץ, то есть территория Вавилона, а не только город.
- source_word: לְהַגִּיד
  choice: возвестить
  rationale: Инфинитив с לְ выражает цель; «возвестить» передаёт публичное объявление и соответствует возвышенному пророческому контексту.
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: Предлог ב означает место возвещения. В русском библейском и литературном употреблении естественно «на Сионе».
- source_word: נִקְמַת
  choice: возмездие
  rationale: נקמה означает отмщение или воздаяние. «Возмездие» сохраняет судебно-карательную силу слова, но звучит естественнее и достойнее в современном русском тексте, чем повторяемая «месть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Сохранён суффикс первого лица множественного числа и исповедальное выражение принадлежности.
- source_word: נִקְמַת הֵיכָלוֹ
  choice: возмездие за Его храм
  rationale: Конструкция буквально допускает «возмездие Его храма», но по смыслу обозначает воздаяние за зло, причинённое храму. Предлог «за» естественно выражает эту связь, не уточняя сверх текста конкретный характер осквернения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет это имя и не превращает его в титул.
- issue: Связь возмездия с храмом
  choice: возмездие за Его храм
  alternative: возмездие Его храма; отмщение за Его храм
  rationale: Еврейская сопряжённая конструкция кратка и допускает формально более буквальное чтение, однако контекст указывает на воздаяние за совершённое над храмом. Выбранная формулировка сохраняет повтор слова «возмездие» и не снимает его карательного смысла.
translation_notes:
  register: Современный литературный русский с сохранением лаконичного, почти заголовочного строя еврейской пророческой строки. Тире удерживает безглагольность первой части и целевое значение инфинитива, хотя такая конструкция намеренно остаётся поэтически напряжённой. Повтор «возмездие» сохранён как риторически и богословски значимый.
