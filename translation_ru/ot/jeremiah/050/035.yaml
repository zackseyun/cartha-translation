  text: חֶ֥רֶב עַל כַּשְׂדִּ֖ים נְאֻם יְהוָ֑ה וְ/אֶל יֹשְׁבֵ֣י בָבֶ֔ל וְ/אֶל שָׂרֶ֖י/הָ וְ/אֶל חֲכָמֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/035.yaml
  text: A sword is against the Chaldeans[a], declares Yahweh, and against the inhabitants of Babylon, and against her officials[b], and against her wise men.
translation:
  language: ru
  text: Меч против халдеев[a], возвещает Яхве, и против жителей Вавилона, и против его правителей[b], и против его мудрецов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вавилонян».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его князей»; также возможно: «его сановников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב עַל
  choice: Меч — на
  rationale: Безглагольная формула пророческого суда передана кратко и выразительно; предлог сохраняет направленность враждебного действия, не добавляя отсутствующего в еврейском тексте глагола.
- source_word: כַּשְׂדִּים
  choice: халдеев
  rationale: Сохранён конкретный этноним исходного текста; в данном контексте он обозначает вавилонян, что отмечено в сноске.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана современно и торжественно, а тетраграмматон — личным именем «Яхве».
- source_word: יֹשְׁבֵי בָבֶל
  choice: жителей Вавилона
  rationale: Естественная русская передача буквального выражения «живущие в Вавилоне».
- source_word: שָׂרֶיהָ
  choice: его правителей
  rationale: Широкое значение שׂרים здесь указывает на представителей властной верхушки; местоимение согласовано в русском языке с названием «Вавилон» мужского рода.
- source_word: חֲכָמֶיהָ
  choice: его мудрецов
  rationale: Прямая передача названия вавилонской учёной и советнической среды без сужения смысла до одной официальной функции.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное Божье имя; транслитерация «Яхве» сохраняет это отличие от титула.
- issue: Образ меча как объявления суда
  choice: Сохранён буквальный образ «Меч — на…»
  alternative: «Война против…» или «Меч обрушится на…»
  rationale: Буквальный образ сохраняет пророческую напряжённость и не сводит многозначный символ суда исключительно к войне.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческого изречения. Повтор «и на» сохраняет структуру и нарастающий охват суда в еврейском тексте.
