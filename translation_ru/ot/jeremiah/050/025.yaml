id: JER.50.25
reference: Jeremiah 50:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: פָּתַ֤ח יְהוָה֙ אֶת א֣וֹצָר֔/וֹ וַ/יּוֹצֵ֖א אֶת כְּלֵ֣י זַעְמ֑/וֹ כִּי מְלָאכָ֣ה הִ֗יא לַֽ/אדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בְּ/אֶ֥רֶץ כַּשְׂדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/025.yaml
  text: Yahweh has opened his storehouse and brought out the weapons of his wrath[d][c][b][a], for this is a work of the Lord GOD of Armies in the land of the Chaldeans.
translation:
  language: ru
  text: Яхве открыл Своё хранилище[a] и вынес оружие[b] Своего гнева, ведь это — дело Владыки Яхве Воинств[c] в земле халдеев[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «сокровищницу»; по контексту возможно также «арсенал».
    reason: lexical_alternative
  - marker: b
    text: Или «орудия»; еврейское слово широко обозначает предметы, принадлежности или орудия, но здесь, вероятно, имеет военный смысл.
    reason: lexical_alternative
  - marker: c
    text: 'Традиционно: «Господа Бога Воинств».'
    reason: lexical_alternative
  - marker: d
    text: Или «в Халдее».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: פָּתַח
  choice: открыл
  rationale: Совершенный вид естественно передаёт завершённое действие еврейского qatal в повествовательно-пророческом контексте.
- source_word: אֹצָרוֹ
  choice: Своё хранилище
  rationale: '«Хранилище» сохраняет широкий смысл существительного: склад или сокровищница; «арсенал» было бы более узким истолкованием по контексту.'
- source_word: וַיּוֹצֵא
  choice: и вынес
  rationale: Глагол означает вывести или вынести наружу; здесь речь идёт о содержимом открытого хранилища.
- source_word: כְּלֵי
  choice: оружие
  rationale: Слово может обозначать сосуды, принадлежности, орудия или оружие; военный контекст суда над Вавилоном делает значение «оружие» наиболее вероятным.
- source_word: זַעְמוֹ
  choice: Своего гнева
  rationale: Передаёт сильное негодование, связанное с Божьим судом, и естественно сочетается с «оружием» в современном русском языке.
- source_word: כִּי
  choice: ведь
  rationale: Вводит пояснение или основание предыдущего утверждения и звучит естественно в данном контексте.
- source_word: מְלָאכָה
  choice: дело
  rationale: Сохраняет широкий смысл — работа, задача, предприятие — не уточняя сверх текста характер совершаемого суда.
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: Владыки Яхве Воинств
  rationale: «Владыка» передаёт אֲדֹנָי, «Яхве» сохраняет личное имя, а «Воинств» оставляет широкий смысл צְבָאוֹת и привычно звучит как часть божественного титула.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: в земле халдеев
  rationale: Следует буквальному этнографическому выражению еврейского текста; географическое «в Халдее» дано как допустимая альтернатива.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יְהוָה, не заменяя тетраграмматон словом «Бог» и не создавая сочетания «Господь Господь».
- issue: Передача צְבָאוֹת в божественном титуле
  choice: Воинств
  alternative: армий
  rationale: «Воинств» сохраняет возможную широту обозначения небесных и земных сил; «армий» понятнее буквально, но может неоправданно сузить смысл до земных вооружённых сил.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным звучанием. Синтаксис остаётся близким к еврейскому образу открытого хранилища и вынесенного из него оружия; двоеточия и поясняющие добавления не вводятся.
