  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/שֹׁבַבְתִּ֤י אֶת יִשְׂרָאֵל֙ אֶל נָוֵ֔/הוּ וְ/רָעָ֥ה הַ/כַּרְמֶ֖ל וְ/הַ/בָּשָׁ֑ן וּ/בְ/הַ֥ר אֶפְרַ֛יִם וְ/הַ/גִּלְעָ֖ד תִּשְׂבַּ֥ע נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/019.yaml
  text: And I will bring Israel back to his pasture[a], and he will graze on Carmel and Bashan; and on the hill country of Ephraim and Gilead his appetite will be satisfied.
translation:
  language: ru
  text: Я возвращу Израиль на его пастбище; он будет пастись на Кармиле и в Васане, и на нагорье Ефрема и в Галааде он насытится[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «насытится его душа».'
    reason: Лексическая альтернатива для תִּשְׂבַּע נַפְשׁוֹ; сноска сохраняет буквальный образ еврейского текста.
lexical_decisions:
- source_word: וְשֹׁבַבְתִּי
  choice: Я возвращу
  rationale: Порода глагола выражает причинение возвращения. «Возвращу» естественно передаёт и конкретное возвращение Израиля на пастбище, и смысл восстановления.
- source_word: נָוֵהוּ
  choice: на его пастбище
  rationale: נָוֶה может означать обиталище, загон или пастбище. Следующий глагол «пастись» указывает здесь на пастбище и поддерживает пастушеский образ.
- source_word: וְרָעָה
  choice: он будет пастись
  rationale: 'Глагол употреблён в непереходном значении: Израиль, представленный как единое стадо, пасётся в плодородных областях.'
- source_word: הַכַּרְמֶל
  choice: на Кармиле
  rationale: Название местности передано в принятой русской форме; предлог выбран по нормам русского географического словоупотребления.
- source_word: הַבָּשָׁן
  choice: в Васане
  rationale: Название области передано в традиционной русской библейской форме.
- source_word: וּבְהַר אֶפְרַיִם
  choice: и на нагорье Ефрема
  rationale: הַר в обозначении области означает гористую или холмистую местность, поэтому «нагорье» точнее русского «гора Ефрема».
- source_word: וְהַגִּלְעָד
  choice: и в Галааде
  rationale: Название области передано в традиционной русской форме и снабжено естественным для русского языка предлогом.
- source_word: תִּשְׂבַּע נַפְשׁוֹ
  choice: он насытится
  rationale: Буквально сказано «насытится его душа», но в контексте кормления נֶפֶשׁ обозначает самого живого человека, его желание пищи или аппетит. «Он насытится» естественно передаёт смысл, а буквальная форма сохранена в сноске.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Имя народа представлено в еврейском тексте как единое лицо, что отражено формами мужского рода единственного числа.
theological_decisions:
- issue: Олицетворение Израиля и грамматическое число
  choice: 'Сохранить единственное число: «его», «он»'
  alternative: 'Передать собирательный народ формами множественного числа: «их», «они»'
  rationale: Еврейский текст последовательно представляет Израиль как единое лицо и использует формы единственного числа. Их сохранение удерживает образ и грамматику источника.
- issue: Значение נֶפֶשׁ в контексте насыщения
  choice: В основном тексте передать выражением «он насытится»
  alternative: 'Буквально: «насытится его душа»'
  rationale: В пастушеском и пищевом контексте נֶפֶשׁ не требует понимания как отдельной нематериальной части человека, а обозначает живое существо или его аппетит. Буквальный вариант дан в сноске, чтобы сохранить лексическую прозрачность и не устранить возможную смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Пастушеский образ и олицетворение Израиля сохранены; географические названия даны в традиционных русских формах.
