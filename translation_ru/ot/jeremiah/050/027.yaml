source:
  edition: WLC
  text: חִרְבוּ֙ כָּל פָּרֶ֔י/הָ יֵרְד֖וּ לַ/טָּ֑בַח ה֣וֹי עֲלֵי/הֶ֔ם כִּֽי בָ֥א יוֹמָ֖/ם עֵ֥ת פְּקֻדָּתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/027.yaml
  text: Slay all her bulls; let them go down to the slaughter. Woe to them[a], for their day has come, the time of their punishment.
translation:
  language: ru
  text: Перебейте всех её быков — пусть сойдут на заклание! Горе им, ведь пришёл их день, время их наказания.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «время их посещения» либо «взыскания с них». Еврейское слово может обозначать посещение, надзор, привлечение к ответу или наказание; здесь контекст указывает на карающий суд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִרְבוּ
  choice: Перебейте
  rationale: Повелительная форма в контексте военного суда требует явно насильственного значения. «Перебейте» естественно по-русски и согласуется с последующим образом заклания.
- source_word: כָּל פָּרֶיהָ
  choice: всех её быков
  rationale: Сохранён буквальный образ быков, метафорически обозначающих сильных людей Вавилона; толкование не подставлено вместо образа.
- source_word: יֵרְדוּ לַטָּבַח
  choice: пусть сойдут на заклание
  rationale: Имперфект передан как юссив, а глагол ירד — через «сойдут». «На заклание» сохраняет образ массового убоя и возвышенный пророческий регистр.
- source_word: הוֹי עֲלֵיהֶם
  choice: Горе им
  rationale: Обычная русская формула пророческого плача и объявления суда.
- source_word: כִּי בָא יוֹמָם
  choice: ведь пришёл их день
  rationale: Перфект בָא передан как уже наступившее событие; выражение «их день» сохраняет мысль о назначенном времени гибели.
- source_word: עֵת פְּקֻדָּתָם
  choice: время их наказания
  rationale: В данном контексте פְּקֻדָּה обозначает карающее взыскание. Основной текст передаёт ясный контекстуальный смысл, а более широкая семантика отмечена в сноске.
theological_decisions:
- issue: Передача судебного термина פְּקֻדָּה
  choice: наказания
  alternative: посещения; взыскания; расплаты
  rationale: Пророчество возвещает суд над Вавилоном, поэтому значение наказания здесь наиболее вероятно. Сноска сохраняет присущую еврейскому слову смысловую широту, не превращая её в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Сохранены метафора быков, движение «сойдут» и образ заклания; синтаксис сделан ясным и пригодным для публичного чтения.
