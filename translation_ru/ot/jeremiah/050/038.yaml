  text: חֹ֥רֶב אֶל מֵימֶ֖י/הָ וְ/יָבֵ֑שׁוּ כִּ֣י אֶ֤רֶץ פְּסִלִים֙ הִ֔יא וּ/בָ/אֵימִ֖ים יִתְהֹלָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/038.yaml
  text: A drought is against her waters[a], and they will dry up, for it is a land of carved idols[b], and they are mad over terrifying things.
translation:
  language: ru
  text: Засуха обрушится на её воды[a], и они высохнут, потому что это земля резных идолов, а её жители помешаны на страшилищах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Меч — на её воды, и они высохнут». Еврейское חֹרֶב может означать «засуха, сухость» или «меч»; возможно, здесь намеренно слышны оба значения.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «безумствуют из-за устрашающих вещей»; возможно также: «исступляются из-за страшных идолов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹרֶב
  choice: засуха
  rationale: Непосредственное упоминание вод, которые высохнут, поддерживает значение «засуха, сухость». Возможное значение «меч» сохранено в сноске, поскольку формула суда у Иеремии допускает намеренную игру значений.
- source_word: אֶל מֵימֶיהָ
  choice: поразит её воды
  rationale: Предлог אֶל при слове, обозначающем бедствие, передан естественной русской конструкцией; местоимение женского рода сохраняет олицетворение Вавилона.
- source_word: וְיָבֵשׁוּ
  choice: и они высохнут
  rationale: Форма Qal имеет здесь непереходное значение, а подлежащим служат «воды».
- source_word: אֶרֶץ פְּסִלִים
  choice: земля резных идолов
  rationale: Пְּסִלִים обозначает именно высеченные или вырезанные культовые изображения; «резные идолы» конкретно и понятно передаёт этот смысл.
- source_word: וּבָאֵימִים
  choice: из-за ужасов
  rationale: אֵימִים буквально означает «ужасы, устрашающие вещи». Передача не уточняет без достаточных оснований, идёт ли речь непосредственно об устрашающих идолах или шире — о предметах ужаса.
- source_word: יִתְהֹלָלוּ
  choice: безумствуют
  rationale: Возвратно-интенсивная форма выражает безумное, исступлённое поведение; «безумствуют» сохраняет силу глагола и звучит естественно в современном литературном русском.
theological_decisions:
- issue: Значение חֹרֶב применительно к водам Вавилона
  choice: 'В основном тексте: «засуха»'
  alternative: «меч»
  rationale: Контекст высыхающих вод особенно благоприятствует значению «засуха», однако та же еврейская форма может означать «меч» и перекликаться с повторяющейся в пророчестве формулой «меч на…». Подлинная неоднозначность сохранена в сноске.
- issue: Референт אֵימִים
  choice: Нейтральное «ужасы»
  alternative: «устрашающие идолы» или «страшилища»
  rationale: Контекст идолопоклонства позволяет понимать слово как обозначение внушающих страх изображений, но само слово не требует однозначно отождествлять их с идолами.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Выражение «поразит её воды» делает краткую еврейскую формулу естественной по-русски; «её жители» проясняет подразумеваемого множественного деятеля и не позволяет ошибочно отнести безумие к самим идолам.
