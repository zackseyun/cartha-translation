  text: בַּ/יָּמִ֣ים הָ/הֵם֩ וּ/בָ/עֵ֨ת הַ/הִ֜יא נְאֻם יְהוָ֗ה יְבֻקַּ֞שׁ אֶת עֲוֺ֤ן יִשְׂרָאֵל֙ וְ/אֵינֶ֔/נּוּ וְ/אֶת חַטֹּ֥את יְהוּדָ֖ה וְ/לֹ֣א תִמָּצֶ֑אינָה כִּ֥י אֶסְלַ֖ח לַ/אֲשֶׁ֥ר אַשְׁאִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/020.yaml
  text: In those days and at that time, declares the LORD, the guilt of Israel will be sought, but there will be none, and the sins of Judah, but they will not be found; for I will forgive those whom I leave as a remnant.
translation:
  language: ru
  text: В те дни и в то время, — возвещает Господь, — станут искать вину Израиля, но её не будет; станут искать грехи Иуды, но их не найдут, потому что Я прощу тех, кого оставлю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲוֹן
  choice: вина
  rationale: В данном контексте слово обозначает вину за беззаконие; этот вариант естественно сочетается с последующим утверждением, что её больше не будет вследствие прощения.
- source_word: נְאֻם יְהוָה
  choice: возвещает Господь
  rationale: Устойчивая пророческая формула передана современно и торжественно; традиционное русское обозначение Божьего имени сохранено как «Господь».
- source_word: לַאֲשֶׁר אַשְׁאִיר
  choice: тех, кого оставлю в живых
  rationale: Глагол שׁאר выражает оставление уцелевших; перевод сохраняет действие Бога и не добавляет в основной текст отвлечённое существительное «остаток».
theological_decisions:
- issue: Смысл отсутствия вины и грехов
  choice: Сохранена причинная связь с Божьим прощением
  alternative: Понять сказанное как утверждение, что Израиль и Иуда никогда не грешили
  rationale: 'Заключительное כִּי אֶסְלַח прямо объясняет, почему искомые вина и грехи не будут найдены: Бог простит уцелевших.'
- issue: Кого Бог прощает
  choice: «тех, кого оставлю в живых»
  alternative: «остаток, который Я оставлю»
  rationale: Личная конструкция оригинала сохранена без навязывания специального богословского значения термину «остаток».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Парная конструкция «станут искать... но...» сохраняет риторический параллелизм еврейского текста; различие единственного числа «вина» и множественного «грехи» также сохранено.
