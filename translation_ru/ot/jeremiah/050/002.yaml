base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/002.yaml
  text: Declare among the nations and proclaim[a]; lift up a banner. Proclaim; do not hide it. Say, “Babylon is captured; Bel is put to shame; Merodach is shattered. Her images are put to shame[b]; her idols are shattered.”
translation:
  language: ru
  text: 'Возвестите среди народов, провозгласите, поднимите знамя! Провозгласите, не скрывайте этого! Скажите: «Вавилон взят, Бел опозорен, Меродах сокрушён[a]. Её изваяния опозорены, её мерзкие идолы сокрушены[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Меродах — еврейская форма имени вавилонского бога, более известного как Мардук. Слово, переведённое как «сокрушён», может также означать «объят ужасом» или «повержен».
    reason: historical_and_lexical_alternative
  - marker: b
    text: Еврейское слово, переведённое как «мерзкие идолы», имеет резко презрительную окраску и связывает идолов с чем-то нечистым и отвратительным.
    reason: lexical_nuance
lexical_decisions:
- source_word: הַגִּידוּ בַגּוֹיִם
  choice: Возвестите среди народов
  rationale: Публичный, торжественный характер Hiphil от נגד передан глаголом «возвестите», а בַגּוֹיִם — естественным русским оборотом «среди народов».
- source_word: וְהַשְׁמִיעוּ / הַשְׁמִיעוּ
  choice: провозгласите
  rationale: Повтор Hiphil от שמע сохранён как риторическое настойчивое требование сделать весть всеобщей.
- source_word: וּשְׂאוּ נֵס
  choice: поднимите знамя
  rationale: נֵס обозначает заметный знак или знамя для созыва и оповещения; русский образ сохранён.
- source_word: אַל תְּכַחֵדוּ
  choice: не скрывайте
  rationale: Форма от כחד запрещает утаивать или замалчивать весть; «не скрывайте» звучит современно и прямо.
- source_word: נִלְכְּדָה בָבֶל
  choice: Вавилон взят
  rationale: Niphal perfect сообщает о захвате как о совершившемся факте; краткая форма соответствует стилю победной вести.
- source_word: הֹבִישׁ / הֹבִישׁוּ
  choice: опозорен / опозорены
  rationale: Hiphil от בוש выражает постыдное поражение и утрату чести; русская пассивно-результативная форма передаёт этот смысл.
- source_word: בֵּל
  choice: Бел
  rationale: Имя божества транслитерировано в принятой русской форме.
- source_word: חַת / חַתּוּ
  choice: сокрушён / сокрушены
  rationale: חתת допускает значения ужаса, смятения и сокрушения. В параллелизме с падением Вавилона и унижением его богов «сокрушён» естественно передаёт полный крах, не сводя выражение только к физическому разрушению.
- source_word: מְרֹדָךְ
  choice: Меродах
  rationale: Сохранена форма имени, отражённая в еврейском тексте; более известная форма «Мардук» указана в примечании.
- source_word: עֲצַבֶּיהָ
  choice: его изваяния
  rationale: עֲצַבִּים обозначает изготовленные изображения божеств. «Изваяния» отличает этот термин от следующего, более уничижительного גִּלּוּלִים. Местоимение мужского рода согласовано с русским названием города «Вавилон».
- source_word: גִּלּוּלֶיהָ
  choice: его мерзкие идолы
  rationale: גִּלּוּלִים — резко уничижительное обозначение идолов. Определение «мерзкие» сохраняет оценочную силу исходного слова в основном тексте.
theological_decisions:
- issue: Передача имён вавилонских божеств
  choice: Бел и Меродах
  alternative: Бел и Мардук либо пояснительная идентификация божеств в основном тексте
  rationale: Транслитерация сохраняет историческую форму имён в еврейском тексте, не внося истолкование в основной текст; общеизвестная форма имени сообщается в примечании.
- issue: Значение חתת применительно к Меродаху и идолам
  choice: сокрушён / сокрушены
  alternative: объят ужасом / объяты ужасом; повержен / повержены
  rationale: Корень может обозначать ужас, смятение или сокрушительный крах. Контекст падения Вавилона поддерживает «сокрушён», однако семантическая неоднозначность отмечена в примечании.
- issue: Уничижительная окраска גִּלּוּלִים
  choice: мерзкие идолы
  alternative: идолы; навозные идолы
  rationale: Выбранный вариант сохраняет презрительную оценку оригинала, оставаясь понятным и литературным; буквальная этимологическая резкость поясняется в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным, пророческим ритмом. Повторы оригинала сохранены. Краткие пассивные формы подчёркивают характер публичного сообщения о свершившемся падении. Женские местоименные суффиксы еврейского текста относятся к Вавилону как к персонифицированному городу; по нормам русского языка они переданы мужским местоимением «его», согласованным с названием «Вавилон».
