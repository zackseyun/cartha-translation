base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/040.yaml
  text: As when God overthrew Sodom and Gomorrah and their neighboring towns[a], declares Yahweh, no man will live there[b], and no son of man will dwell in her.
translation:
  language: ru
  text: Подобно тому, как Бог ниспроверг Содом и Гоморру и соседние с ними города[a], — возвещает Яхве, — так никто не поселится там и ни один человек не будет жить в ней[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «её соседей»; то есть соседние города или поселения, связанные с Содомом и Гоморрой.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и не будет жить в ней сын человеческий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: Как при ниспровержении Богом
  rationale: Предлог כְּ вводит сравнение, а מַהְפֵּכָה обозначает катастрофическое ниспровержение. Такая конструкция сохраняет образ и естественно звучит по-русски.
- source_word: סְדֹם וְעֲמֹרָה
  choice: Содома и Гоморры
  rationale: Устоявшиеся в русском библейском употреблении формы названий с требуемым здесь родительным падежом.
- source_word: שְׁכֵנֶיהָ
  choice: соседних с ними городов
  rationale: Буквально — «её соседей». По контексту подразумеваются соседние с Содомом и Гоморрой населённые места; слово «городов» делает этот смысл ясным, а сноска сохраняет формальную особенность еврейского текста.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Стандартная пророческая формула передана весомо и естественно; личное имя יהוה транслитерировано как «Яхве».
- source_word: לֹא יֵשֵׁב שָׁם אִישׁ
  choice: никто не поселится там
  rationale: В формуле запустения ישׁב означает обосноваться или поселиться. Местоимение «никто» естественно передаёт обобщённое אִישׁ, не ограничивая смысл только мужчинами.
- source_word: וְלֹא יָגוּר בָּהּ בֶּן אָדָם
  choice: и ни один человек не будет жить в ней
  rationale: גור может означать временно или постоянно проживать; нейтральное «жить» не устраняет эту широту. בֶּן־אָדָם здесь означает человека как представителя человеческого рода и образует поэтический параллелизм с אִישׁ.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя Бога. Форма «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Референт женского местоимения בָּהּ
  choice: в ней
  alternative: там
  rationale: Сохранён женский род еврейского местоимения, вероятно отсылающего к подразумеваемой земле или к Вавилонии/стране, хотя ближайшая формулировка допускает некоторую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет сравнение и параллелизм оригинала; архаизмы сведены к минимуму. Все сноски отмечены в основном тексте.
