  text: כִּ֣י הִנֵּ֣ה אָנֹכִ֡י מֵעִיר֩ וּ/מַעֲלֶ֨ה עַל בָּבֶ֜ל קְהַל גּוֹיִ֤ם גְּדֹלִים֙ מֵ/אֶ֣רֶץ צָפ֔וֹן וְ/עָ֣רְכוּ לָ֔/הּ מִ/שָּׁ֖ם תִּלָּכֵ֑ד חִצָּי/ו֙ כְּ/גִבּ֣וֹר מַשְׁכִּ֔יל לֹ֥א יָשׁ֖וּב רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/009.yaml
  text: For behold[a], I am stirring up and bringing against Babylon an assembly of great nations from the land of the north. They will array themselves against her; from there she will be captured. Their arrows are like those of a skilled warrior[b]; none returns empty-handed.
translation:
  language: ru
  text: 'Ибо вот, Я подниму и приведу против Вавилона собрание великих народов из земли на севере. Они выстроятся против него, и оттуда он будет взят.[a] Его стрелы — как стрелы искусного воина: ни одна не вернётся без результата.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Оттуда» — вероятно, с того места, где народы выстроятся против Вавилона.
    reason: Уточнение возможного пространственного соотнесения наречия מִשָּׁם.
  - marker: b
    text: 'Еврейское сравнение выражено сжато: буквально «его стрелы — как искусный воин; не возвращается пустым». Точное соотнесение слов «стрелы», «воин» и «не возвращается пустым» неоднозначно.'
    reason: Сохранение лексико-синтаксической неоднозначности древнееврейского сравнения.
lexical_decisions:
- source_word: מֵעִיר
  choice: подниму
  rationale: Причастие породы hифиль от עור выражает побуждение к действию; будущее время естественно передаёт предстоящее действие Бога в данном пророческом контексте.
- source_word: וּמַעֲלֶה
  choice: приведу
  rationale: В военном контексте hифиль от עלה означает привести или направить войско против места; перевод сохраняет каузативное значение.
- source_word: קְהַל גּוֹיִם גְּדֹלִים
  choice: собрание великих народов
  rationale: Кְהַל обозначает собранное множество, а גְּדֹלִים может указывать на величие, многочисленность или силу; прямой перевод не сужает смысл до одной характеристики.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: из северной земли
  rationale: Естественный русский эквивалент устойчивого пророческого географического выражения, без лишнего уточнения.
- source_word: וְעָרְכוּ לָהּ
  choice: они выстроятся против него
  rationale: ערך в военном употреблении означает построиться или расположиться в боевом порядке. Местоимение мужского рода согласовано с русским названием «Вавилон», тогда как в древнееврейском городе соответствует женский род.
- source_word: מִשָּׁם תִּלָּכֵד
  choice: оттуда он будет взят
  rationale: Сохранено пространственное наречие «оттуда» и страдательное значение нифаля от לכד — быть взятым, захваченным.
- source_word: חִצָּיו
  choice: их стрелы
  rationale: Древнееврейский суффикс формально единственного числа соотносится с «собранием» как собирательным целым; в русском множественное «их» естественно связывает стрелы с народами, не вводя отдельного личного деятеля.
- source_word: כְּגִבּוֹר מַשְׂכִּיל
  choice: как у искусного воина
  rationale: Сжатое сравнение развёрнуто минимально. מַשְׂכִּיל здесь может обозначать искусного, умелого или успешного; «искусный» хорошо соответствует военному контексту.
- source_word: לֹא יָשׁוּב רֵיקָם
  choice: ни одна не вернётся без результата
  rationale: 'Буквально: «не вернётся пустой». Формулировка сохраняет образ возвращающейся стрелы и передаёт отсутствие промаха или безрезультатности без разговорного «с пустыми руками».'
theological_decisions:
- issue: Деятельность Бога в нашествии народов
  choice: Бог представлен как Тот, кто поднимает и приводит народы против Вавилона.
  alternative: Понять стих лишь как безличное предсказание нашествия.
  rationale: Местоимение первого лица и две каузативные формы прямо выражают Божье действие; это следует из грамматики текста, а не из привнесённой богословской системы.
- issue: Соотнесение образа стрел и искусного воина
  choice: Стрелы уподоблены стрелам искусного воина, и последующая фраза отнесена к стрелам.
  alternative: 'Понимать буквально-сжато: «его стрелы — как искусный воин, который не возвращается пустым».'
  rationale: Древнееврейская конструкция допускает сжатое сравнение и не вполне однозначное соотнесение последней фразы. Основной текст выбран ради ясности, а формальная альтернатива сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя; сохранены военная образность, Божья каузативная роль и неоднозначность заключительного сравнения. Род местоимений адаптирован к русскому слову «Вавилон».
