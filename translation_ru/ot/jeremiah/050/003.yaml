source:
  edition: WLC
  text: כִּ֣י עָלָה֩ עָלֶ֨י/הָ גּ֜וֹי מִ/צָּפ֗וֹן הֽוּא יָשִׁ֤ית אֶת אַרְצָ/הּ֙ לְ/שַׁמָּ֔ה וְ/לֹֽא יִהְיֶ֥ה יוֹשֵׁ֖ב בָּ֑/הּ מֵ/אָדָ֥ם וְ/עַד בְּהֵמָ֖ה נָ֥דוּ הָלָֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/003.yaml
  text: For a nation has come up against her from the north; it will make her land a desolation[a], and there will be no inhabitant in it. From man to beast, they have fled; they have gone away.
translation:
  language: ru
  text: Ибо с севера выступил против неё народ. Он превратит её землю в запустение[a], и никто не будет жить в ней. И люди, и скот разбежались, ушли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пустошь».'
    reason: Еврейское לְשַׁמָּה обозначает состояние или место полного опустошения; «запустение» передаёт основное значение, а «пустошь» — возможную конкретную передачу результата.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего призыва возвестить падение Вавилона; «ибо» сохраняет пояснительно-причинную связь и достойный пророческий регистр.
- source_word: עָלָה עָלֶיהָ
  choice: выступил против неё
  rationale: Сочетание עלה с על здесь обозначает вражеское военное продвижение; «выступил против» естественно передаёт этот смысл.
- source_word: גּוֹי
  choice: народ
  rationale: В данном контексте речь идёт о народе как политической и военной силе; русское «народ» естественно и не сужает значение до государства.
- source_word: מִצָּפוֹן
  choice: с севера
  rationale: Прямо передаёт направление, откуда приходит вторжение.
- source_word: הוּא יָשִׁית אֶת אַרְצָהּ לְשַׁמָּה
  choice: Он превратит её землю в пустыню
  rationale: Глагол с результативным дополнением означает привести землю в состояние опустошения; женское местоимение сохраняет олицетворение Вавилона.
- source_word: וְלֹא יִהְיֶה יוֹשֵׁב בָּהּ
  choice: и никто не будет жить в ней
  rationale: Естественная русская передача буквального «не будет в ней жителя», выражающая полное обезлюдение.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: И люди, и скот
  rationale: Еврейская конструкция «от человека и до скота» выражает совокупную полноту; по-русски парная конструкция ясно включает всех людей и животных.
- source_word: נָדוּ הָלָכוּ
  choice: разбежались, ушли
  rationale: 'Сохраняются два последовательных глагола: первый передаёт бегство или рассеяние под угрозой, второй — окончательный уход.'
theological_decisions:
- issue: Обобщающее значение אָדָם в выражении מֵאָדָם וְעַד בְּהֵמָה
  choice: люди
  alternative: человек
  rationale: Здесь אָדָם обозначает человеческих обитателей вообще, в противопоставлении скоту. Множественное «люди» естественно согласуется с последующими глаголами во множественном числе и не вводит дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранено олицетворение Вавилона в женском роде и параллельное действие двух заключительных глаголов; еврейская формула всеохватности передана естественной русской конструкцией.
