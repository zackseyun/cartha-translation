base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/021.yaml
  text: Go up against the land of Merathaim[a], against it, and against the inhabitants of Pekod. Put them to the sword and devote them to destruction after them, declares Yahweh[c][b], and do all that I have commanded you.
translation:
  language: ru
  text: Выступи против земли Мератаим[a], против неё и против жителей Пекода[b]. Порази их мечом и предай заклятию вслед за ними[c], — возвещает Яхве, — и сделай всё, что Я повелел тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Мератаим» — вероятно, символическое название Вавилонии, созвучное выражению «двойной мятеж» или, возможно, «двойная горечь».
    reason: lexical_alternative
  - marker: b
    text: Пекод — название местности или народа; оно может также перекликаться с еврейским корнем со значением «взыскать», «покарать» или «посетить».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «вслед за ними» или «после них». «Предай заклятию» передаёт еврейское слово, обозначающее посвящение на полное уничтожение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְרָתַיִם
  choice: Мератаим
  rationale: Слово употреблено как название земли, поэтому передано транслитерацией. Возможная символическая игра значений сохранена в сноске.
- source_word: עֲלֵה עָלֶיהָ
  choice: выступи против неё
  rationale: В военном контексте עלה על означает выступить или двинуться против кого-либо; русский вариант естественно передаёт военный приказ.
- source_word: יוֹשְׁבֵי פְּקוֹד
  choice: жители Пекода
  rationale: Причастие ישב обозначает живущих в данной местности, а פקוד синтаксически выступает как собственное имя.
- source_word: חֲרֹב
  choice: предай их мечу
  rationale: Краткая и сильная военная формула передаёт повеление убивать мечом, не смягчая суровости текста.
- source_word: וְהַחֲרֵם
  choice: полностью уничтожь
  rationale: Порода hифиль глагола חרם выражает предание заклятию, ведущему к уничтожению. Основной текст передаёт результат понятным современным языком, а культово-военный оттенок отмечен в сноске.
- source_word: אַחֲרֵיהֶם
  choice: преследуя их
  rationale: Буквально выражение означает «за ними/вслед за ними». В данном военном контексте оно, вероятно, указывает на преследование, однако буквальная неоднозначность отмечена в сноске.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохранена торжественная пророческая формула; личное имя יהוה передано как «Яхве».
- source_word: וַעֲשֵׂה כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: и сделай всё, что Я повелел тебе
  rationale: Формулировка естественно и полно передаёт требование исполнить всё повелённое.
theological_decisions:
- issue: Передача военной лексики суда
  choice: Сохранить прямые выражения «предай мечу» и «полностью уничтожь».
  alternative: Смягчить их до «победи» или общего «разгроми».
  rationale: Еврейский текст употребляет резкие термины убийства мечом и предания уничтожению. Смягчение скрыло бы напряжённость и суровость пророчества.
- issue: Статус названий Мератаим и Пекод
  choice: Оставить их собственными именами, пояснив возможную игру слов в сносках.
  alternative: Перевести их как «Двойной мятеж» и «Наказание».
  rationale: Грамматически это географические или групповые названия, но одновременно возможны символические созвучия. Транслитерация не устраняет эту неоднозначность.
- issue: Значение אַחֲרֵיהֶם
  choice: Передать контекстуально как «преследуя их», указав буквальный смысл в сноске.
  alternative: Оставить в основном тексте неясное «вслед за ними».
  rationale: Военный контекст допускает значение преследования, однако буквальная форма недостаточно определённа; поэтому альтернативу следует сохранить для читателя.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией пророческого военного приказа. Собственные имена транслитерированы; архаичные слова исключены из основного текста, но технический смысл חרם сохранён в сноске.
