  text: דְּרָשׁ נָ֤א בַעֲדֵ֨/נוּ֙ אֶת יְהוָ֔ה כִּ֛י נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל נִלְחָ֣ם עָלֵ֑י/נוּ אוּלַי֩ יַעֲשֶׂ֨ה יְהוָ֤ה אוֹתָ֨/נוּ֙ כְּ/כָל נִפְלְאֹתָ֔י/ו וְ/יַעֲלֶ֖ה מֵ/עָלֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/002.yaml
  text: Please inquire of Yahweh on our behalf[a], because Nebuchadnezzar king of Babylon is fighting against us. Perhaps Yahweh will act for us according to all his wondrous acts[c][b], so that he will withdraw from us.
translation:
  language: ru
  text: «Вопроси, пожалуйста, Яхве за нас,[a] потому что Навуходоносор,[b] царь Вавилона, воюет против нас. Может быть, Яхве совершит для нас такие же чудесные дела, как прежде, и Навуходоносор отступит от нас».[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о нас». Еврейский предлог может обозначать просьбу к Богу в интересах говорящих, то есть за них.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское написание имени здесь ближе к форме «Навуходреццар».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и он поднимется от нас». В данном военном контексте речь идёт о том, что нападающий царь прекратит осаду или нападение и отступит.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָשׁ נָא
  choice: Прошу, вопроси
  rationale: Глагол דרש с частицей נא выражает вежливую просьбу обратиться к Яхве за ответом; «вопроси» сохраняет религиозно-пророческий смысл и остаётся понятным в возвышенной современной речи.
- source_word: בַעֲדֵנוּ
  choice: о нас
  rationale: В данном контексте בעד обозначает действие в интересах просителей; «вопроси … о нас» естественно передаёт просьбу обратиться к Богу от их имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, без замены титулом.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Употреблена традиционная и легко узнаваемая русская форма имени; еврейское написание в этом месте ближе к форме «Навуходреццар», что отмечено в сноске.
- source_word: נִלְחָם עָלֵינוּ
  choice: воюет против нас
  rationale: Причастная форма выражает продолжающееся военное действие; русский вариант передаёт его прямо и естественно.
- source_word: אוּלַי
  choice: Может быть
  rationale: Сохраняет надежду и вместе с тем подлинную неопределённость просьбы.
- source_word: יַעֲשֶׂה יְהוָה אוֹתָנוּ
  choice: Яхве поступит с нами
  rationale: Формально близко передаёт конструкцию «сделает нас/с нами», не уточняя сверх текста, будет ли это действие «для нас»; благоприятный смысл задаётся контекстом и последующим сравнением.
- source_word: כְּכָל נִפְלְאֹתָיו
  choice: по всем Своим чудесным деяниям
  rationale: נפלאות означает необычайные, вызывающие изумление деяния Бога; оборот сохраняет отсылку к образцу Его прежних чудесных действий.
- source_word: וְיַעֲלֶה מֵעָלֵינוּ
  choice: и тот отступит от нас
  rationale: Буквально говорится «и он поднимется/уйдёт от нас»; в военном контексте речь идёт о снятии нападения или осады. Указательное «тот» ясно связывает подразумеваемого субъекта с Навуходоносором, не приписывая это действие Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Смысл יַעֲשֶׂה יְהוָה אוֹתָנוּ
  choice: поступит с нами
  alternative: действует ради нас; сотворит с нами
  rationale: Выбранный вариант сохраняет широкую и несколько напряжённую формулировку оригинала, тогда как благоприятное ожидание следует из контекста, а не вносится непосредственно в глагольную конструкцию.
- issue: Подразумеваемый субъект וְיַעֲלֶה
  choice: Навуходоносор отступит
  alternative: 'буквально и двусмысленно: «и он уйдёт от нас»'
  rationale: Контекст осады делает Навуходоносора естественным субъектом. «Тот» обеспечивает ясность по-русски, а сноска сохраняет буквальную форму и её местоименную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Прошу» передаёт вежливость частицы נא; «вопроси» выбрано как краткий и уместный для пророческого обращения глагол. Прописные местоимения при обращении к Богу не используются, но притяжательное «Своим» написано с прописной по принятой издательской традиции; при необходимости общего стилевого выравнивания возможно «своим».
