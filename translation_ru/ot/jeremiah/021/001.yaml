base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/001.yaml
  text: The word that came to Jeremiah from Yahweh when King Zedekiah sent to him Pashhur son of Malchiah and Zephaniah son of Maaseiah the priest[a], saying,
translation:
  language: ru
  text: 'Слово, которое пришло к Иеремии от Яхве, когда царь Седекия послал к нему Пасхора, сына Малхии, и священника Софонию, сына Маасеи[a], с такими словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Софонию, сына священника Маасеи». Еврейский порядок слов допускает такое понимание; однако в Иер 52:24 Софония прямо назван вторым священником.'
    reason: Сохраняет грамматическую неоднозначность того, к кому относится определение הַכֹּהֵן («священник»), и точно указывает на контекстуальное свидетельство.
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל
  choice: Слово, которое пришло к
  rationale: Сохраняет устойчивую пророческую формулу и образ Божьего слова, достигающего пророка; по-русски звучит ясно и естественно.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: Предлог указывает на источник слова, а личное имя יהוה передано как «Яхве», без замены титулом.
- source_word: בִּשְׁלֹחַ
  choice: когда … послал
  rationale: Инфинитив с בְּ имеет временное значение; придаточное с «когда» естественно передаёт эту связь.
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: царь Седекия
  rationale: Обычный порядок титула и имени в современном русском библейском повествовании.
- source_word: פַּשְׁחוּר בֶּן מַלְכִּיָּה
  choice: Пасхора, сына Малхии
  rationale: Использованы традиционные русские формы имён; בֶּן передано прозрачной родственной формулой «сын».
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: священника Софонию, сына Маасеи
  rationale: Контекст книги прямо называет Софонию священником; при этом возможная синтаксическая отнесённость титула к Маасее отмечена в сноске.
- source_word: לֵאמֹר
  choice: 'с такими словами:'
  rationale: Естественно вводит прямую речь, начинающуюся в следующем стихе, и соответствует функции еврейского оборота.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно сохранено в транслитерации, а не заменено титулом.
- issue: К кому относится обозначение «священник»
  choice: к Софонии
  alternative: к Маасее
  rationale: Порядок слов допускает отнесение к ближайшему имени Маасеи, однако Иер 29:25; 37:3; 52:24 однозначно свидетельствуют, что Софония был священником. Неустранимая синтаксическая возможность отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой формулы. Традиционные русские формы личных имён сочетаются с прямой передачей имени Яхве. Двоеточие показывает, что фраза продолжается прямой речью в следующем стихе.
