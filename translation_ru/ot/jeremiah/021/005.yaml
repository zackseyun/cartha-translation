  text: וְ/נִלְחַמְתִּ֤י אֲנִי֙ אִתְּ/כֶ֔ם בְּ/יָ֥ד נְטוּיָ֖ה וּ/בִ/זְר֣וֹעַ חֲזָקָ֑ה וּ/בְ/אַ֥ף וּ/בְ/חֵמָ֖ה וּ/בְ/קֶ֥צֶף גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/005.yaml
  text: And I myself will fight against you with an outstretched hand and a strong arm[b][a], and with anger and wrath and great fury.
translation:
  language: ru
  text: И Я сам буду сражаться против вас простёртой рукой и крепкой мышцей[a] — в гневе, ярости и великом гневе.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Простёртая рука и крепкая мышца» — устойчивый библейский образ решительной Божьей силы, часто встречающийся в повествовании об исходе; здесь эта сила обращена на суд.
    reason: cross_reference
  - marker: b
    text: 'Или: «и в великой ярости»; еврейские слова в конце стиха образуют нарастающий ряд близких обозначений гнева.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְחַמְתִּי
  choice: И ... буду сражаться
  rationale: Нифаль глагола לחם здесь выражает враждебное действие в будущем; «буду сражаться» естественно и точно передаёт смысл.
- source_word: אֲנִי
  choice: Я Сам
  rationale: Самостоятельное местоимение при уже выраженном в глаголе лице имеет эмфатическую функцию; «Я Сам» сохраняет акцент на непосредственном действии Бога.
- source_word: אִתְּכֶם
  choice: против вас
  rationale: При נלחם предлог אֵת обозначает противника, а не совместное действие; контекст суда над Иерусалимом подтверждает значение «против».
- source_word: בְּיָד נְטוּיָה
  choice: простёртой рукой
  rationale: Сохранён устойчивый антропоморфный образ решительного действия Бога и его библейские переклички.
- source_word: וּבִזְרֹעַ חֲזָקָה
  choice: и крепкой мышцей
  rationale: «Мышца» сохраняет различие между יָד («рука») и זְרוֹעַ («мышца, рука от плеча») и соответствует возвышенному пророческому регистру; חֲזָקָה передано как «крепкой».
- source_word: וּבְאַף
  choice: в гневе
  rationale: Буквально אַף означает «нос», но здесь это устойчивое обозначение гнева; перевод передаёт идиоматический смысл.
- source_word: וּבְחֵמָה
  choice: ярости
  rationale: חֵמָה обозначает пылающую, сильную ярость; этот выбор сохраняет нарастание ряда и не повторяет «гнев».
- source_word: וּבְקֶצֶף גָּדוֹל
  choice: и великом негодовании
  rationale: קֶצֶף выражает сильный гнев или негодование, а גָּדוֹל усиливает его; «великое негодование» сохраняет кульминацию и лексическое различие трёх близких терминов.
theological_decisions:
- issue: Антропоморфный язык Божьего действия
  choice: Сохранить образы «простёртой руки» и «крепкой мышцы» как обозначение прямого и могущественного действия Бога в суде.
  alternative: 'Передать обобщённо: «Своей великой силой».'
  rationale: Еврейский текст намеренно использует телесную образность, известную по контекстам исхода, но здесь обращённую на суд. Её сохранение поддерживает межтекстовую связь и не устраняет богословское напряжение.
- issue: Тройное обозначение Божьего гнева
  choice: 'Передать тремя различными словами: «гнев, ярость и великое негодование».'
  alternative: Сгладить ряд до одного или двух обозначений либо повторить слово «гнев».
  rationale: Накопление אַף, חֵמָה и קֶצֶף создаёт риторическое усиление. Различные русские соответствия сохраняют как близость значений, так и кульминационный эффект.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Эмфаза אֲנִי передана как «Я Сам»; исходная образность сохранена без поясняющего парафраза. Тире отделяет орудийно-образное описание силы от ряда слов, обозначающих гнев.
