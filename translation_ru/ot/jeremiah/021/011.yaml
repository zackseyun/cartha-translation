  footnotes:
  - marker: a
    text: 'Или: «А о доме царя Иудеи». Еврейский предлог может вводить новое обращение к царскому дому или обозначать его как тему речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית
  choice: А дому
  rationale: ו связывает этот раздел с предыдущим, а ל обозначает адресата. «Дом» сохраняет образ царского дома как двора, семьи или династии, не сужая его до дворца.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Естественно передаёт еврейскую сопряжённую конструкцию и сохраняет официальное обозначение царя.
- source_word: שִׁמְעוּ
  choice: слушайте
  rationale: Форма повелительного наклонения множественного числа обращена к царскому дому как к группе; «слушайте» естественно выражает требование не просто услышать, но принять пророческое слово.
- source_word: דְּבַר
  choice: слово
  rationale: Сохраняет устойчивую пророческую формулу и непосредственный характер Божьего сообщения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: К кому или о ком вводится речь
  choice: «дому царя Иудеи» как адресату
  alternative: «о доме царя Иудеи» как теме речи
  rationale: Предлог ל допускает направленность речи к царскому дому и, в данном переходе, значение речи о нём. Основной текст сохраняет наиболее непосредственное понимание адресата, а альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной пророческой формулой. Двоеточие обозначает переход к прямому повелению. Множественное число «слушайте» сохранено.
