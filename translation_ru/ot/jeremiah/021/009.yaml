base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/009.yaml
  text: The one who stays in this city will die by the sword[a], by famine, and by pestilence; but the one who goes out and defects to the Chaldeans who are besieging you will live[b], and his life will be to him as plunder.
translation:
  language: ru
  text: Кто останется в этом городе, тот погибнет от меча, голода и мора; а кто выйдет и перейдёт[a] к халдеям, осаждающим вас, тот будет жить, и жизнь его будет ему добычей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «падёт на [халдеев]». Эта еврейская военная идиома означает перейти на сторону противника или сдаться ему.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «жизнь его будет ему добычей» — то есть из бедствия он унесёт с собой только собственную жизнь.'
    reason: idiom_explanation
lexical_decisions:
- source_word: הַיֹּשֵׁב
  choice: кто останется
  rationale: Причастие от ישׁב в условиях осады означает пребывание или оставание в городе, а не буквальное сидение.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  choice: от меча, голода и мора
  rationale: Сохранена характерная для Иеремии трёхчастная формула суда; «меч» передаёт конкретный образ חרב, а «мор» — смертоносную эпидемию, обозначенную דבר.
- source_word: וְהַיּוֹצֵא וְנָפַל עַל
  choice: а кто выйдет и перейдёт к
  rationale: Военно-политическая идиома נפל על означает переход на сторону осаждающего противника. «Перейдёт к» естественно звучит по-русски, не добавляя прямо отсутствующего в тексте слова «сдастся».
- source_word: הַכַּשְׂדִּים
  choice: халдеям
  rationale: Сохранён употреблённый в еврейском тексте этноним, а не заменён исторически поясняющим названием «вавилоняне».
- source_word: הַצָּרִים עֲלֵיכֶם
  choice: осаждающим вас
  rationale: Причастие от צור в данном контексте обозначает военную осаду.
- source_word: יִחְיֶה
  choice: будет жить
  rationale: Передано прямое значение глагола; смысл физического спасения проясняется заключительной идиомой.
- source_word: וְהָיְתָה לּוֹ נַפְשׁוֹ לְשָׁלָל
  choice: и жизнь его будет ему добычей
  rationale: 'Сохранена метафора добычи: среди всеобщей гибели человек унесёт с собой лишь собственную жизнь.'
- source_word: נַפְשׁוֹ
  choice: жизнь его
  rationale: Здесь נֶפֶשׁ обозначает жизнь человека, а не отдельно мыслимую нематериальную душу.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ в идиоме спасения
  choice: «жизнь его»
  alternative: «душа его»
  rationale: Контекст говорит о физическом выживании при осаде. Вариант «душа» мог бы привнести отсутствующее здесь утверждение о нематериальной душе.
- issue: Характер перехода к халдеям
  choice: «перейдёт к халдеям»
  alternative: «сдастся халдеям» или «перебежит к халдеям»
  rationale: Идиома допускает смысл сдачи или перехода на сторону врага, но нейтральное «перейдёт к» сохраняет эту смысловую широту и не усиливает нравственную оценку поступка.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксический параллелизм противопоставляет оставшегося в городе тому, кто выйдет к осаждающим. Метафора добычи сохранена в основном тексте и пояснена в сноске.
