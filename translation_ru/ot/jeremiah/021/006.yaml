  source_fidelity: 'Смысл в целом передан верно: сохранены первое лицо Бога, удар по населению города, включение людей и животных и смерть от דֶּבֶר. Однако «скот» может неоправданно сузить בְּהֵמָה до домашних сельскохозяйственных животных, тогда как в данной формуле слово обозначает животных в более широком смысле. «Жестокого» допустимо, но несколько интерпретирует גָּדוֹל; «тяжёлого» точнее передаёт тяжесть бедствия без добавочного оттенка.'
