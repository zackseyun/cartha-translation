  text: וְ/הִכֵּיתִ֗י אֶת יֽוֹשְׁבֵי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת הָ/אָדָ֖ם וְ/אֶת הַ/בְּהֵמָ֑ה בְּ/דֶ֥בֶר גָּד֖וֹל יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/006.yaml
  text: And I will strike the inhabitants of this city, both man and beast; they will die by a great pestilence.
translation:
  language: ru
  text: И поражу жителей этого города, людей и животных; они умрут от тяжёлого мора.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: И поражу
  rationale: 'Hiphil глагола נכה выражает прямое действие Бога: «поражу». Эта форма сохраняет торжественно-пророческий регистр, не прибегая к архаичному «сокрушу» и не предвосхищая явно смерть, названную далее.'
- source_word: יֹשְׁבֵי הָעִיר הַזֹּאת
  choice: жителей этого города
  rationale: Причастная конструкция от ישב обозначает живущих в городе; «жители» — точный, естественный и понятный современный русский эквивалент.
- source_word: הָאָדָם
  choice: людей
  rationale: Собирательное אָדָם здесь противопоставлено животным и обозначает людей как категорию. Русское множественное «людей» естественно согласуется с «жителей» и не сужает смысл до мужчин.
- source_word: הַבְּהֵמָה
  choice: скот
  rationale: בְּהֵמָה часто обозначает крупных домашних животных или скот. В контексте городского населения «скот» передаёт обычный диапазон слова точнее, чем широкое «животных», хотя последнее также возможно.
- source_word: בְּדֶבֶר גָּדוֹל
  choice: от жестокого мора
  rationale: דֶּבֶר означает эпидемическое бедствие, мор. Прилагательное גָּדוֹל здесь естественно выражает тяжесть бедствия; «жестокого» по-русски яснее передаёт интенсивность, чем буквальное «великого».
- source_word: יָמֻתוּ
  choice: они умрут
  rationale: Qal imperfect в данном пророческом объявлении передаёт будущее следствие Божьего удара; простое «они умрут» звучит естественно и точно.
- source_word: וְאֶת הָאָדָם וְאֶת הַבְּהֵמָה
  choice: и людей, и скот
  rationale: Повтор союза и показателя прямого дополнения подчёркивает включение обеих групп. Русская конструкция «и …, и …» сохраняет этот охват.
theological_decisions:
- issue: Передача אָדָם в паре с בְּהֵמָה
  choice: людей
  alternative: человека
  rationale: В формуле суда слово אָדָם имеет собирательное значение и противопоставляет человеческое население животным. «Людей» сохраняет человеческо-животный контраст, не создавая впечатления, будто речь идёт об одном человеке или только о мужчинах.
- issue: Характер выраженного суда
  choice: Прямое Божье действие сохранено формой «И поражу»
  alternative: И будут поражены
  rationale: Еврейская форма первого лица называет Бога непосредственным субъектом действия; пассивная передача ослабила бы этот богословски значимый акцент.
translation_notes:
  register: 'Современный литературный русский с достоинством пророческой речи. Синтаксис остаётся компактным и близким к еврейскому: Божье действие, охват людей и скота, затем смертельный итог. «Мор» сохраняет библейский регистр, оставаясь понятным современному читателю.'
