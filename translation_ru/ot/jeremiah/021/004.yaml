source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֣י מֵסֵב֮ אֶת כְּלֵ֣י הַ/מִּלְחָמָה֮ אֲשֶׁ֣ר בְּ/יֶדְ/כֶם֒ אֲשֶׁ֨ר אַתֶּ֜ם נִלְחָמִ֣ים בָּ֗/ם אֶת מֶ֤לֶךְ בָּבֶל֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים הַ/צָּרִ֣ים עֲלֵי/כֶ֔ם מִ/ח֖וּץ לַֽ/חוֹמָ֑ה וְ/אָסַפְתִּ֣י אוֹתָ֔/ם אֶל תּ֖וֹךְ הָ/עִ֥יר הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/004.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Behold, I am turning back the weapons of war that are in your hands, with which you are fighting against the king of Babylon and against the Chaldeans who are besieging you outside the wall, and I will gather them into the midst of this city.'
translation:
  language: ru
  text: 'Так говорит Яхве, Бог Израиля: «Вот, Я поверну назад орудия войны, которые у вас в руках и которыми вы сражаетесь с царём Вавилона и халдеями, осаждающими вас за городской стеной, и соберу их[a] внутри этого города».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Их» может относиться к царю Вавилона и халдеям: тогда смысл в том, что Бог введёт вражеские силы в город. Возможно также отнесение к орудиям войны.'
    reason: Сохраняется грамматическая и контекстуальная неоднозначность еврейского местоимения אוֹתָם.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет торжественное пророческое указание на близкое и решительное действие Бога.
- source_word: מֵסֵב
  choice: поверну назад
  rationale: Передаёт значение разворота оружия защитников и сохраняет военный образ; русское будущее естественно выражает предстоящее действие, обозначенное причастной формой в контексте пророчества.
- source_word: כְּלֵי הַמִּלְחָמָה
  choice: орудия войны
  rationale: Сохраняет множественное число и широкий смысл военного снаряжения или оружия, не сводя выражение к одному конкретному виду вооружения.
- source_word: בְּיֶדְכֶם
  choice: которые у вас в руках
  rationale: Сохраняет конкретный еврейский образ оружия, которым защитники располагают и пользуются.
- source_word: נִלְחָמִים בָּם
  choice: которыми вы сражаетесь
  rationale: Естественно передаёт инструментальное значение предлога и продолжающееся действие.
- source_word: הַכַּשְׂדִּים
  choice: халдеями
  rationale: Сохраняет этноисторическое наименование исходного текста, не заменяя его более общим словом «вавилоняне».
- source_word: הַצָּרִים עֲלֵיכֶם
  choice: осаждающими вас
  rationale: В контексте укреплённого города глагольная форма обозначает именно осаду, а не просто нападение.
- source_word: מִחוּץ לַחוֹמָה
  choice: за городской стеной
  rationale: Естественно по-русски обозначает расположение осаждающих вне стены; уточнение «городской» устраняет возможную пространственную неясность.
- source_word: וְאָסַפְתִּי אוֹתָם
  choice: и соберу их
  rationale: Буквально сохраняет глагол «собирать» и местоименную неоднозначность исходного текста относительно того, что именно Бог соберёт в городе.
- source_word: אֶל תּוֹךְ הָעִיר הַזֹּאת
  choice: внутри этого города
  rationale: Передаёт движение во внутреннее пространство города естественным современным русским выражением.
theological_decisions:
- issue: К чему относится местоимение «их» во фразе «соберу их внутри этого города»
  choice: Не уточнять референт в основном тексте и сохранить местоимение «их».
  alternative: Оно может относиться либо к царю Вавилона и халдеям, которых Бог введёт в город, либо к орудиям войны, которые Он обратит назад и соберёт в городе.
  rationale: 'Мужское множественное местоимение грамматически допускает обе связи: с כְּלֵי הַמִּלְחָמָה («орудиями войны») и с совокупностью царя Вавилона и халдеев. Ближайший контекст и ход осады позволяют понимать его как вражеские силы, тогда как структура начатого высказывания допускает возврат к оружию. Перевод не должен без необходимости устранять эту подлинную неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис близок к исходному высказыванию, но остаётся понятным обычному читателю. Форма «Яхве» сохраняет личное Божье имя; «халдеи» сохраняет историческую лексику текста.
