base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/014.yaml
  text: And I will punish you according to the fruit of your deeds[a], declares Yahweh, and I will kindle a fire in her forest[b], and it will consume all that is around her.
translation:
  language: ru
  text: Я накажу вас по плодам ваших дел[a], — возвещает Яхве, — и разожгу огонь в её лесу[b], и он поглотит всё вокруг неё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взыщу с вас», «призову вас к ответу». Еврейский глагол имеет более широкий смысловой диапазон, но в данном контексте суда прежде всего обозначает наказание.'
    reason: lexical_alternative
  - marker: b
    text: «Её лес» вероятно служит поэтическим обозначением Иерусалима либо его дворцовых построек и укреплений; еврейский текст сохраняет образ леса.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיכֶם
  choice: Я взыщу с вас
  rationale: Глагол פקד имеет широкий диапазон значений — «посетить», «обратить внимание», «призвать к ответу», «покарать». В контексте суда оборот «взыщу с вас» естественно передаёт ответственность и воздаяние, не сводя значение исключительно к наказанию.
- source_word: כִּפְרִי מַעַלְלֵיכֶם
  choice: по плодам ваших дел
  rationale: Предлог כ выражает соответствие, а «плод» сохраняет еврейскую метафору результата поступков. «Дела» точно и понятно передаёт нравственно окрашенное מַעֲלָלִים.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: «Возвещает» передаёт устойчивую пророческую формулу авторитетного божественного изречения; тетраграмматон передан личным именем «Яхве».
- source_word: וְהִצַּתִּי אֵשׁ
  choice: и разожгу огонь
  rationale: Каузативная форма יצת означает зажечь или разжечь; русский оборот естественен и сохраняет образ.
- source_word: בְּיַעְרָהּ
  choice: в её лесу
  rationale: Существительное יער прямо означает «лес», а суффикс женского рода сохранён как «её», без внесения предполагаемого референта в основной текст.
- source_word: וְאָכְלָה
  choice: и он пожрёт
  rationale: Глагол אכל буквально связан с поеданием и при огне выражает уничтожение. «Пожрёт» сохраняет яркую персонифицированную метафору.
- source_word: כָּל סְבִיבֶיהָ
  choice: всё вокруг неё
  rationale: Фраза означает всё находящееся вокруг обозначенного существительным женского рода референта; местоименная связь сохранена.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Характер действия, выраженного פקד
  choice: взыщу с вас
  alternative: накажу вас; посещу вас; призову вас к ответу
  rationale: Контекст несомненно судебный, однако «взыщу» сохраняет более широкую идею посещения ради отчёта и соответствующего воздаяния, не устраняя лексическую многозначность.
- issue: Референт суффиксов женского рода
  choice: сохранить «её» без прямого отождествления
  alternative: явно указать Иерусалим, дворец или укрепления
  rationale: Грамматика указывает на олицетворённый объект женского рода, вероятнее всего город, но сам стих не называет его здесь прямо. Перевод сохраняет литературную неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены метафоры «плод дел», «лес» и огонь, который «пожрёт»; синтаксис сделан ясным для обычного читателя. Все примечания отмечены в основном тексте.
