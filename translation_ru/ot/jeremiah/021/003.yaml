lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Форма с последовательным וַ продолжает повествование; в естественном русском повторяющийся союз можно не передавать.
- source_word: יִרְמְיָהוּ
  choice: Иеремия
  rationale: Традиционная русская форма библейского личного имени.
- source_word: אֲלֵיהֶם
  choice: им
  rationale: Предлог אֶל с суффиксом 3-го лица множественного числа обозначает адресатов речи; дательный падеж естественно передаёт это по-русски.
- source_word: כֹּה
  choice: так
  rationale: Слово вводит содержание официально передаваемого сообщения; «так» кратко и естественно сохраняет формулу посланника.
- source_word: תֹאמְרֻן
  choice: скажите
  rationale: Форма 2-го лица мужского рода множественного числа имеет здесь директивное значение; русский императив ясно передаёт поручение группе посланников.
- source_word: אֶל
  choice: Седекии
  rationale: Предлог отмечает адресата сообщения и естественно выражается русским дательным падежом без отдельного предлога.
- source_word: צִדְקִיָּהוּ
  choice: Седекия
  rationale: Традиционная русская форма имени царя; в данном контексте употреблён дательный падеж «Седекии».
