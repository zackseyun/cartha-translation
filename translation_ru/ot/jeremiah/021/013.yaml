base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/013.yaml
  text: Behold[a], I am against you, O inhabitant of the valley, O rock of the plain, declares Yahweh—you who say, “Who will come down against us[b], and who will enter into our dwellings?”
translation:
  language: ru
  text: '«Вот, Я против тебя, ты, живущая в долине, — скала равнины, — возвещает Яхве, — вы, говорящие: „Кто сойдёт против нас[a] и кто войдёт в наши жилища[b]?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто спустится против нас?» Еврейская глагольная форма здесь трудна; по смыслу жители считают свой город недоступным для нападения.'
    reason: lexical_alternative
  - marker: b
    text: Евр. «обиталища»; возможно, подразумеваются защищённые жилища или убежища.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: Вот Я против тебя
  rationale: В контексте суда сочетание означает враждебное выступление Бога против адресата; «вот» сохраняет торжественную пророческую вводную формулу.
- source_word: יֹשֶׁבֶת הָעֵמֶק
  choice: живущая в долине
  rationale: Причастие женского рода поддерживает олицетворение города и естественно передаётся русским обращением.
- source_word: צוּר הַמִּישֹׁר
  choice: скала равнины
  rationale: Сохранён буквальный и несколько напряжённый топографический образ, без истолковывающей замены на «крепость».
- source_word: נְאֻם יְהוָה
  choice: говорит Яхве
  rationale: Естественная русская передача устойчивой пророческой формулы с воспроизведением личного имени Бога.
- source_word: הָאֹמְרִים
  choice: против вас, говорящих
  rationale: Множественное число в еврейском тексте сохранено как переход от олицетворённого города в единственном числе к его жителям во множественном; повтор «против» делает этот переход понятным, не устраняя грамматического напряжения.
- source_word: מִי יֵחַת עָלֵינוּ
  choice: Кто спустится на нас
  rationale: Передаёт вероятный военно-топографический смысл трудной глагольной формы и сохраняет предлог со значением движения против цели.
- source_word: וּמִי יָבוֹא בִּמְעוֹנוֹתֵינוּ
  choice: и кто войдёт в наши жилища
  rationale: При сочетании глагола движения с предлогом בְּ русское «войдёт в» естественно; «жилища» не привносит возможное, но не обязательное значение укреплений.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте и соответствует указанной проектной установке, не подменяя его титулом.
- issue: Женский единственный адресат и множественное число говорящих
  choice: Сохранить обращение к олицетворённому городу в женском единственном числе и затем перейти к его жителям во множественном
  alternative: Полностью выровнять обращение либо по единственному, либо по множественному числу
  rationale: Так воспроизводится риторическое напряжение еврейского текста без искусственного сглаживания.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Буквальные образы «скала равнины» и «спустится на нас» сохранены, а их неочевидность пояснена в сносках. Пунктуация подчёркивает вложенную прямую речь и переход от города к его жителям.
