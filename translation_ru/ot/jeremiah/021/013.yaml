  source_fidelity: 'Основной смысл передан, включая женское единственное обращение к городу и последующее множественное число говорящих. Однако добавленное «против вас» перед «говорящих» отсутствует в еврейском тексте и меняет синтаксис: נְאֻם יהוה относится ко всему предшествующему изречению, а הָאֹמְרִים продолжает характеристику адресата. Кроме того, «скала равнины» в русском без оформления как приложение звучит неясно; тире помогает сохранить буквальный образ и обращение.'
  naturalness: «Живущая в долине, скала равнины» тяжеловесно и синтаксически не вполне прозрачно. Вариант «ты, живущая в долине, — скала равнины» естественнее, но сохраняет намеренно напряжённый топографический образ. «Говорит Яхве» допустимо, но «возвещает Яхве» лучше передаёт формульное נְאֻם יהוה в современном литературном русском.
  terminology: «Яхве» последовательно передаёт יהוה. «Жилища» — нейтральный и точный эквивалент מְעוֹנוֹת; сноска корректно отмечает возможный оттенок защищённости. Для трудного יֵחַת следует сохранить осторожную передачу «сойдёт/спустится против нас», не утверждая больше, чем допускает текст.
