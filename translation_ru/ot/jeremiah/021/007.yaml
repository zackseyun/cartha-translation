  text: וְ/אַחֲרֵי כֵ֣ן נְאֻם יְהוָ֡ה אֶתֵּ֣ן אֶת צִדְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֣ה וְ/אֶת עֲבָדָ֣י/ו וְ/אֶת הָ/עָ֡ם וְ/אֶת הַ/נִּשְׁאָרִים֩ בָּ/עִ֨יר הַ/זֹּ֜את מִן הַ/דֶּ֣בֶר מִן הַ/חֶ֣רֶב וּ/מִן הָ/רָעָ֗ב בְּ/יַד֙ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וּ/בְ/יַד֙ אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/הִכָּ֣/ם לְ/פִי חֶ֔רֶב לֹֽא יָח֣וּס עֲלֵי/הֶ֔ם וְ/לֹ֥א יַחְמֹ֖ל וְ/לֹ֥א יְרַחֵֽם־־־־־׀־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/007.yaml
  text: And after that[a], declares Yahweh, I will give Zedekiah king of Judah, his servants, the people, and those left in this city from the plague, from the sword, and from the famine into the hand of Nebuchadnezzar king of Babylon, into the hand of their enemies, and into the hand of those seeking their life; and he will strike them down with the edge of the sword. He will not spare them or have pity or compassion.
translation:
  language: ru
  text: 'А после этого, — возвещает Яхве, — Я отдам Седекию, царя Иудеи, его слуг, народ и уцелевших в этом городе от мора, от меча и от голода, в руки Навуходоносора[a], царя Вавилона, в руки их врагов и в руки тех, кто покушается на их жизнь. Он поразит их остриём меча: не пощадит их, не пожалеет и не проявит к ним милосердия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит форма имени «Навуходреццар»; «Навуходоносор» — традиционная русская передача этого имени.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: А после этого
  rationale: Передаёт временной переход и последовательность по отношению к предшествующим бедствиям, сохраняя присоединительное וְ.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественную силу устойчивой пророческой формулы; «возвещает» в современном русском звучит естественнее буквального «изречение Яхве».
- source_word: אֶתֵּן ... בְּיַד
  choice: Я отдам ... в руки
  rationale: Глагол «отдам» в сочетании с «в руки» естественно передаёт буквальное «дам в руку» и смысл передачи во власть врага.
- source_word: עֲבָדָיו
  choice: его слуг
  rationale: Широкое обозначение царских служителей; слово не сужено до «сановников», поскольку еврейский термин допускает более общее значение.
- source_word: הַנִּשְׁאָרִים ... מִן הַדֶּבֶר מִן הַחֶרֶב וּמִן הָרָעָב
  choice: тех, кто уцелеет ... от мора, от меча и от голода
  rationale: Причастие передано как люди, оставшиеся в живых; повтор «от» сохраняет трёхчастный ритм оригинала. «Мор» — понятное и стилистически уместное обозначение смертоносной эпидемии в библейском контексте.
- source_word: בְּיַד ... וּבְיַד ... וּבְיַד
  choice: в руки ... в руки ... и в руки
  rationale: Повтор сохранён как риторическое усиление полной передачи уцелевших во власть неприятелей.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: тех, кто покушается на их жизнь
  rationale: Еврейская идиома буквально говорит об ищущих их жизнь; русский оборот передаёт намерение убить без неестественного буквализма.
- source_word: וְהִכָּם לְפִי חֶרֶב
  choice: Он поразит их остриём меча
  rationale: Передаёт насильственную смерть от меча; «остриём меча» сохраняет образ оружия, не воспроизводя неестественное для русского буквальное «устами меча».
- source_word: לֹא יָחוּס ... וְלֹא יַחְמֹל וְלֹא יְרַחֵם
  choice: не пощадит их, не пожалеет и не проявит к ним милосердия
  rationale: Три отрицательных глагола переданы раздельно, чтобы сохранить нарастающее тройное утверждение об отсутствии пощады, жалости и милосердия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале стоит собственное имя Бога, тетраграмматон יהוה; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Субъект единственного числа в וְהִכָּם
  choice: Он — Навуходоносор
  alternative: 'Безличное или собирательное понимание: «их поразят»'
  rationale: Еврейский глагол имеет форму мужского рода единственного числа; ближайший явно названный деятель в единственном числе — царь Навуходоносор. Русское «Он» сохраняет грамматику оригинала, не добавляя имени повторно.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Синтаксис сделан ясным для устного чтения; при этом сохранены повтор «в руки», трёхчастные перечни бедствий и отрицаний, а также образ меча. Архаизирующее «мор» оставлено как краткий и узнаваемый библейский термин, тогда как остальные формулировки современны.
