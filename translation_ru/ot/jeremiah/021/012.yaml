  source_fidelity: 'Нужна правка заключительного местоимения: в представленном согласном тексте מַעַלְלֵיהֶם означает «их дел», тогда как вариант «ваших дел» отражает масоретское чтение (кере) и не должен быть выбран в основном тексте без сохранения этой текстовой альтернативы. «С раннего утра» также неоправданно усиливает לַבֹּקֶר, означающее «утром».'
  naturalness: «Утром вершите суд» — современная литературная и ясная формула для царского судебного повеления. «Гнев Мой выйдет, как огонь, и разгорится» сохраняет образ оригинала без экспрессивного добавления, содержащегося в «вырвется».
  terminology: «Дом Давида», «Яхве», «суд», «избавляйте», «притеснитель» и «гнев» точно передают адресат, имя Бога и юридико-пророческий регистр. Единственное число «из руки притеснителя» сохраняет еврейскую идиому; ее смысл пояснен в сноске.
