id: JER.21.12
reference: Jeremiah 21:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בֵּ֣ית דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה דִּ֤ינוּ לַ/בֹּ֨קֶר֙ מִשְׁפָּ֔ט וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עוֹשֵׁ֑ק פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מעללי/הם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/012.yaml
  text: 'House of David[a], thus says Yahweh: Administer justice in the morning, and deliver the one who has been robbed from the hand of the oppressor, lest my wrath go out like fire and burn with no one to quench it[c][b], because of the evil of their deeds.'
translation:
  language: ru
  text: 'Дом Давида! Так говорит Яхве: утром вершите суд и избавляйте ограбленного из руки притеснителя[a], иначе гнев Мой выйдет, как огонь, и разгорится — и некому будет погасить его[b] — из-за зла их дел.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из руки притеснителя»; то есть из-под его власти.'
    reason: cultural_note
  - marker: b
    text: 'Или: «гнев Мой выйдет, как огонь».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском согласном тексте: «их дел»; масоретское чтение (кере): «ваших дел».'
    reason: textual_variant
lexical_decisions:
- source_word: בֵּית דָּוִד
  choice: Дом Давида
  rationale: Конструктивное сочетание употреблено как обращение к царскому дому, то есть династии и правящей семье Давида; традиционная формулировка сохраняет образ исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: דִּינוּ לַבֹּקֶר מִשְׁפָּט
  choice: с раннего утра творите правосудие
  rationale: Императив דין в сочетании с מִשְׁפָּט требует осуществлять справедливый суд; לַבֹּקֶר буквально указывает на утро, а в контексте также может подразумевать своевременность или регулярность.
- source_word: וְהַצִּילוּ גָזוּל
  choice: и спасайте ограбленного
  rationale: Причастная форма גָזוּל обозначает человека, которого лишили имущества или прав; глагол נצל требует деятельного избавления.
- source_word: מִיַּד עוֹשֵׁק
  choice: из рук притеснителя
  rationale: Сохранена понятная и по-русски естественная библейская идиома, где «рука» означает власть или контроль.
- source_word: פֶּן
  choice: иначе
  rationale: Вводит грозящее последствие неповиновения; современное «иначе» естественно передаёт предупредительную силу частицы.
- source_word: תֵּצֵא כָאֵשׁ חֲמָתִי
  choice: ярость Моя вырвется, как огонь
  rationale: Сохранены субъект «ярость Моя», глагольный образ выхода и прямое сравнение с огнём; «вырвется» естественно выражает внезапное распространение огня и гнева.
- source_word: וּבָעֲרָה וְאֵין מְכַבֶּה
  choice: и будет пылать — никто не погасит её
  rationale: Продолжен образ огня без добавления объекта уничтожения; женское местоимение может относиться к ярости, представленной как огонь.
- source_word: מִפְּנֵי רֹעַ מעלליהם
  choice: из-за зла ваших дел
  rationale: Кетив מעלליהם означает «их дел», тогда как обращение всего стиха поддерживает традиционное чтение/понимание «ваших дел»; расхождение отмечено в сноске.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя сохраняется в транслитерации без конфессиональной подмены титулом.
- issue: Смысл царского повеления דִּינוּ ... מִשְׁפָּט
  choice: творите правосудие
  alternative: судите суд; выносите справедливый приговор
  rationale: Формулировка охватывает как судебное решение, так и обязанность правящей династии обеспечивать справедливость, не сводя повеление к частной судебной процедуре.
- issue: Адресат заключительной фразы
  choice: ваших дел
  alternative: их дел
  rationale: Масоретская традиция и контекст прямого обращения допускают второе лицо, однако согласный текст указывает на третье лицо; неоднозначность не устранена молча и вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены обращение «Дом Давида», личное имя «Яхве» и образ неугасимого огня. Формула «творите правосудие» возвышенна, но понятна; «иначе» естественнее архаического «дабы не».
