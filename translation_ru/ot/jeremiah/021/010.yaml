base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/010.yaml
  text: For I have set my face against this city for harm and not for good[a], declares Yahweh. It will be given into the hand of the king of Babylon[b], and he will burn it with fire.
translation:
  language: ru
  text: Ибо Я обратил Своё лицо против этого города — на беду, а не во благо[a], — возвещает Яхве. Этот город будет отдан в руки царя Вавилона[b], и тот сожжёт его огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на погибель». Буквально: «во зло». Еврейское רָעָה здесь обозначает бедствие, пагубу как следствие суда, а не нравственное зло со стороны Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в руку царя Вавилона»; то есть под его власть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתִּי פָנַי
  choice: Я обратил лицо Моё против
  rationale: Сохраняет образ еврейской идиомы «положить/обратить лицо» и передаёт решительную направленность против города; «против» ясно следует из контекста суда.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: во зло, а не во благо
  rationale: Сохраняет резкую и намеренно широкую антитезу רָעָה и טוֹבָה. В данном контексте «зло» означает бедствие и пагубный исход, а не нравственное зло со стороны Бога; это пояснено в сноске.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественно и естественно передаёт устойчивую пророческую формулу, сохраняя личное имя יהוה как «Яхве».
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: в руку царя Вавилона
  rationale: Сохраняет библейский образ исходного выражения; по смыслу речь идёт о передаче города под власть царя.
- source_word: תִּנָּתֵן
  choice: Он будет отдан
  rationale: Передаёт пассивную форму; местоимение относится к слову «город», мужского рода в русском языке.
- source_word: וּשְׂרָפָהּ בָּאֵשׁ
  choice: и тот сожжёт его огнём
  rationale: Передаёт активную форму с подразумеваемым субъектом мужского рода — царём Вавилона либо его войском; «тот» устраняет двусмысленность русских местоимений.
theological_decisions:
- issue: Значение לְרָעָה в речи о Божьем суде
  choice: во зло
  alternative: на погибель / к бедствию
  rationale: Буквально и симметрично передаёт противопоставление «зло — благо», не снимая напряжения текста. Сноска уточняет, что здесь имеется в виду бедствие как суд, а не нравственное зло, совершаемое Богом.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи и ключевых еврейских образов. Формула «во зло, а не во благо» намеренно сохраняет лаконичную антитезу оригинала; возможное недоразумение снимается сноской.
