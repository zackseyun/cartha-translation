base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/008.yaml
  text: 'And to this people you shall say[a], ‘Thus says Yahweh: Behold, I am setting before you the way of life and the way of death.’'
translation:
  language: ru
  text: 'А этому народу скажи: «Так говорит Яхве: вот, Я ставлю перед вами[a] путь жизни и путь смерти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «даю перед вами»; в этом обороте имеется в виду, что Яхве ставит перед людьми две возможности.'
    reason: 'Лексическая альтернатива: сохранена буквальная семантика נתן и пояснено идиоматическое значение сочетания.'
lexical_decisions:
- source_word: וְאֶל הָעָם הַזֶּה
  choice: А этому народу
  rationale: Союз וְ связывает повеление с предыдущим контекстом, а עָם в единственном числе обозначает народ как единое целое.
- source_word: תֹּאמַר
  choice: скажи
  rationale: Форма выражает обращённое к Иеремии повеление; русский императив естественно и точно передаёт его силу.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена торжественная формула пророческого посланника и личное имя יְהוָה.
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Частица подчёркивает непосредственность и торжественность Божьего заявления; оборот «вот, Я» естественен для возвышенной современной русской речи.
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: ставлю перед вами
  rationale: Глагол נתן буквально означает «давать», но в сочетании с לִפְנֵי выражает представление людям двух возможностей; причастие передаёт актуальное действие.
- source_word: דֶּרֶךְ הַחַיִּים
  choice: путь жизни
  rationale: דֶּרֶךְ здесь метафорически обозначает образ действий или направление, ведущее к определённому исходу; חַיִּים имеет отвлечённое значение «жизнь».
- source_word: דֶּרֶךְ הַמָּוֶת
  choice: путь смерти
  rationale: Сохранены симметрия и резкое противопоставление жизни и смерти в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, а не титул; «Яхве» передаёт тетраграмматон транслитерацией, не заменяя его толкованием.
- issue: Характер «пути жизни» и «пути смерти»
  choice: Сохранить образ двух путей без поясняющего толкования
  alternative: Передать как прямой выбор между жизнью и смертью
  rationale: Стих сам по себе не раскрывает здесь конкретное содержание каждого пути; метафора и её напряжение сохраняются для разъяснения последующим контекстом.
translation_notes:
  register: Современный литературный русский с сохранением торжественного пророческого звучания. Синтаксис краток и соответствует параллелизму оригинала; архаизмы не используются.
