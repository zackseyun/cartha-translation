  text: וַ/יְהִ֗י כִּ/רְא֤וֹת כָּל הָ/עָם֙ אֲשֶׁ֣ר אֶת יִשְׁמָעֵ֔אל אֶת יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/אֵ֛ת כָּל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וַ/יִּשְׂמָֽחוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/013.yaml
  text: And when all the people who were with Ishmael saw Johanan son of Kareah and all the commanders of the forces who were with him[a], they rejoiced.
translation:
  language: ru
  text: Когда все люди, бывшие с Измаилом, увидели Иоханана, сына Карея, и всех военачальников, бывших с ним, они обрадовались.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Когда ... увидели
  rationale: Нарративная формула וַיְהִי вместе с инфинитивной конструкцией כִּרְאוֹת вводит временное обстоятельство. В современном русском естественно передать её придаточным с «когда», не используя архаическое «и было».
- source_word: כָּל הָעָם
  choice: все люди
  rationale: Здесь עָם обозначает конкретную группу людей, ранее уведённых Измаилом. «Все люди» точно и естественно передаёт собирательное значение.
- source_word: אֲשֶׁר אֶת יִשְׁמָעֵאל
  choice: бывшие с Измаилом
  rationale: Эллиптическая относительная конструкция с комитативным אֵת означает людей, находившихся вместе с Измаилом; причастный оборот сохраняет структуру и не добавляет невыраженного статуса.
- source_word: יֽוֹחָנָן בֶּן קָרֵחַ
  choice: Иоханана, сына Карея
  rationale: Имена переданы в принятой русской библейской форме; патроним בֶּן передан прямо как «сын».
- source_word: שָׂרֵי הַחֲיָלִים
  choice: военачальников
  rationale: В данном военном контексте сочетание обозначает начальников вооружённых отрядов. «Военачальники» ясно и компактно передаёт обе части выражения.
- source_word: אֲשֶׁר אִתּוֹ
  choice: бывших с ним
  rationale: Местоимение естественнее всего относится к Иоханану как ближайшему руководителю группы; русский текст сохраняет местоименную отсылку и возможную формальную неоднозначность.
- source_word: וַיִּשְׂמָחוּ
  choice: они обрадовались
  rationale: Форма глагола שׂמח описывает наступившую радость в ответ на увиденное. «Обрадовались» естественнее в современном русском повествовании, чем более приподнятое «возрадовались».
