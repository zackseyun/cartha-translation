  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּ֣שְׁבְּ יִ֠שְׁמָעֵאל אֶת כָּל שְׁאֵרִ֨ית הָ/עָ֜ם אֲשֶׁ֣ר בַּ/מִּצְפָּ֗ה אֶת בְּנ֤וֹת הַ/מֶּ֨לֶךְ֙ וְ/אֶת כָּל הָ/עָם֙ הַ/נִּשְׁאָרִ֣ים בַּ/מִּצְפָּ֔ה אֲשֶׁ֣ר הִפְקִ֗יד נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֑ם וַ/יִּשְׁבֵּ/ם֙ יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וַ/יֵּ֕לֶךְ לַ/עֲבֹ֖ר אֶל בְּנֵ֥י עַמּֽוֹן׀־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/010.yaml
  text: Then Ishmael took captive all the remnant of the people who were in Mizpah—the king’s daughters and all the people who were left in Mizpah[a], whom Nebuzaradan the captain of the guard had entrusted to Gedaliah son of Ahikam[b]. Ishmael son of Nethaniah took them captive and went to cross over to the Ammonites.
translation:
  language: ru
  text: 'Тогда Измаил увёл в плен[a] весь остаток народа, находившийся в Мицпе: дочерей царя и всех людей, оставшихся в Мицпе, которых Навузардан, начальник стражи, поручил Гедалии, сыну Ахикама. Измаил, сын Нетании, увёл их в плен и отправился, чтобы перейти к аммонитянам[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «захватил в плен». Еврейский глагол подчёркивает насильственное пленение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к сынам Аммона», то есть к аммонитянам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּ / וַיִּשְׁבֵּם
  choice: увёл в плен / увёл их в плен
  rationale: Глагол שׁבה обозначает насильственное взятие людей в плен. Повтор сохраняет выразительное повторение еврейского текста.
- source_word: שְׁאֵרִית הָעָם
  choice: остаток народа
  rationale: Передаёт не просто остальных людей, а уцелевшую часть народа — значимый для книги Иеремии оттенок.
- source_word: בַּמִּצְפָּה
  choice: в Мицпе
  rationale: Предлог בְּ здесь указывает на местонахождение; название передано принятой русской транслитерацией.
- source_word: בְּנוֹת הַמֶּלֶךְ
  choice: дочерей царя
  rationale: Прямо и естественно передаёт буквальное выражение «дочери царя», не заменяя его более толковательным словом «царевны».
- source_word: הַנִּשְׁאָרִים
  choice: оставшихся
  rationale: Причастие от שׁאר обозначает людей, которые остались; русское причастие сохраняет синтаксис и смысл.
- source_word: הִפְקִיד ... אֶת גְּדַלְיָהוּ
  choice: поручил Гедалии
  rationale: В данном контексте форма הפקיד означает, что Навузардан передал этих людей под надзор и ответственность Гедалии.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Это понятная современному читателю передача вавилонского военного придворного звания; буквальная калька «начальник палачей» могла бы создать неверное представление о его должности.
- source_word: לַעֲבֹר אֶל
  choice: чтобы перейти к
  rationale: Сохраняет значение направленного движения и возможный оттенок перехода через местность, не добавляя прямо не выраженной идеи политического перехода на чью-либо сторону.
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитянам
  rationale: Естественная русская передача этнонима, буквально означающего «сыновья Аммона».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинным повествовательным стилем. Сохранены повтор глагола «увёл в плен», тематическое выражение «остаток народа» и буквальное «дочери царя». Имена переданы в формах, близких к еврейскому источнику и понятных русскому читателю.
