source:
  edition: WLC
  text: וַ/יִּשְׁמַע֙ יוֹחָנָ֣ן בֶּן קָרֵ֔חַ וְ/כָל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֵ֤ת כָּל הָֽ/רָעָה֙ אֲשֶׁ֣ר עָשָׂ֔ה יִשְׁמָעֵ֖אל בֶּן נְתַנְיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/011.yaml
  text: When Johanan son of Kareah, and all the commanders of the forces who were with him, heard of all the evil that Ishmael son of Nethaniah had done,
translation:
  language: ru
  text: Когда Иоханан, сын Кареаха, и все военачальники, бывшие с ним, услышали обо всём зле, которое совершил Измаил, сын Нефании,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Когда ... услышали
  rationale: Последовательная форма с וַ вводит очередное событие повествования, однако синтаксически стих образует придаточную временную часть, продолжение которой следует в ст. 12. Множественное «услышали» естественно согласуется в русском с составным подлежащим.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: военачальники
  rationale: Сочетание обозначает начальников военных отрядов; «военачальники» передаёт это кратко, ясно и в достойном современном регистре.
- source_word: אֲשֶׁר אִתּוֹ
  choice: бывшие с ним
  rationale: Причастный оборот естественно передаёт относительное придаточное и указывает на сопровождавших Иоханана начальников.
- source_word: אֵת כָּל הָרָעָה
  choice: обо всём зле
  rationale: רָעָה здесь охватывает злодеяния и причинённый ими вред; «зло» сохраняет нравственную оценку исходного слова, не сводя смысл лишь к бедствию.
- source_word: עָשָׂה
  choice: совершил
  rationale: В данном контексте нейтральный еврейский глагол «делать» относится к тяжким злодеяниям; русское «совершил» естественно сочетается со словом «зло», не уточняя сверх текста характер каждого действия.
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: Иоханан, сын Кареаха
  rationale: Имена переданы в принятой русской библейской форме, а родственная связь выражена приложением.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Измаил, сын Нефании
  rationale: Имена переданы в принятой русской библейской форме, а родственная связь выражена приложением.
