base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/006.yaml
  text: Then Ishmael son of Nethaniah went out from Mizpah to meet them[a], going and weeping. When he met them, he said to them, “Come to Gedaliah son of Ahikam.”
translation:
  language: ru
  text: 'Тогда Измаил, сын Нефании, вышел из Мицпы навстречу им. Он шёл и плакал[a]. Встретив их, он сказал им: «Идите к Гедалии, сыну Ахикама».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «шёл, всё шёл и плакал»; еврейский повтор подчёркивает продолжительность действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Тогда ... вышел
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: לִקְרָאתָם
  choice: навстречу им
  rationale: Устойчивое сочетание обозначает движение с целью встретить приближающихся людей.
- source_word: מִן הַמִּצְפָּה
  choice: из Мицпы
  rationale: Предлог מן указывает на исходную точку движения; географическое название передано традиционной русской формой.
- source_word: הֹלֵךְ הָלֹךְ וּבֹכֶה
  choice: Он шёл и плакал
  rationale: Сочетание причастия с абсолютным инфинитивом выражает продолжающееся действие. Отдельное предложение естественно передаёт длительность и сопутствующий плач, не воспроизводя еврейский повтор буквально.
- source_word: וַיְהִי כִּפְגֹשׁ אֹתָם
  choice: Встретив их
  rationale: Обычная временная конструкция передана современной русской деепричастной формой без тяжеловесного буквального «и было».
- source_word: בֹּאוּ אֶל
  choice: Идите к
  rationale: В данном контексте говорящий направляет людей к Гедалии. Русское «идите к» естественнее пространственно неоднозначного «приходите к» и не добавляет отсутствующего в тексте значения входа.
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם
  choice: Гедалии, сыну Ахикама
  rationale: Имена переданы принятыми русскими библейскими формами, а патроним — прямо и ясно.
