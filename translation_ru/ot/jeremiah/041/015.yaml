source:
  edition: WLC
  text: וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֗ה נִמְלַט֙ בִּ/שְׁמֹנָ֣ה אֲנָשִׁ֔ים מִ/פְּנֵ֖י יֽוֹחָנָ֑ן וַ/יֵּ֖לֶךְ אֶל בְּנֵ֥י עַמּֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/015.yaml
  text: But Ishmael son of Nethaniah escaped from Johanan with eight men and went to the Ammonites[a][b][c].
translation:
  language: ru
  text: Но Измаил, сын Нафании, вместе с восемью людьми спасся от Иоанана[b] и ушёл к аммонитянам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Буквально: «от лица Иоанана» — то есть ушёл от него или избежал его преследования.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «к сынам Аммона», то есть к аммонитянам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: Но Измаил
  rationale: 'Союз ו формально может означать «и», однако здесь «но» естественно передаёт противопоставление предшествующему рассказу: несмотря на действия Иоанана, Измаил спасся.'
- source_word: בֶּן נְתַנְיָה
  choice: сын Нафании
  rationale: Обычная еврейская патронимическая конструкция; передана формально и естественно по-русски.
- source_word: נִמְלַט
  choice: спасся
  rationale: Нифаль глагола מלט здесь обозначает успешное избавление от опасности или преследования; «спасся» звучит естественно в данном повествовательном контексте.
- source_word: בִּ/שְׁמֹנָה אֲנָשִׁים
  choice: вместе с восемью людьми
  rationale: 'Предлог ב при обозначении лиц имеет сопроводительное значение: Измаила сопровождали восемь человек.'
- source_word: מִ/פְּנֵי יֽוֹחָנָן
  choice: от Иоанана[b]
  rationale: Буквально «от лица/присутствия Иоанана»; это идиома, обозначающая уход от его присутствия или преследования.
- source_word: וַ/יֵּלֶךְ
  choice: и ушёл
  rationale: Последовательная форма повествования обозначает следующее действие; «ушёл» в сочетании с направлением естественнее русского «пошёл» после сообщения о бегстве.
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: к аммонитянам[c]
  rationale: Выражение בני עמון, буквально «сыны Аммона», является обычным этнонимом и естественно передаётся как «аммонитяне».
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с ясным повествовательным синтаксисом. Слово «людьми» сохраняет нейтральность אֲנָשִׁים, хотя по контексту речь идёт о сторонниках или воинах Измаила. Маркер [a] не введён: вариант «Но» отражён непосредственно в тексте и не требует примечания; все использованные маркеры [b] и [c] присутствуют в основном тексте.'
