  source_fidelity: 'Перевод точно передаёт временную конструкцию: «На второй день после убийства Гедалии». Отглагольное существительное не добавляет в этот стих явно не выраженного исполнителя убийства и поэтому уместно сохраняет синтаксическую сдержанность еврейского текста. «Когда об этом ещё никто не знал» естественно передаёт фоновое обстоятельство וְאִישׁ לֹא יָדָע; «об этом» правомерно уточняет подразумеваемый объект знания. Начальная повествовательная формула וַיְהִי в русском адекватно отражена временным вводом, особенно ввиду продолжающегося предложения в следующем стихе.'
