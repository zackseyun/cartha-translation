  text: And it happened on the second day after he had killed Gedaliah[a], when no man yet knew it,
translation:
  language: ru
  text: На второй день после убийства Гедалии, когда об этом[a] ещё никто не знал,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и никто не знал». Слова «об этом», то есть об убийстве Гедалии, подразумеваются в еврейском тексте и добавлены для ясности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: На второй день…
  rationale: Еврейская повествовательная формула вводит следующее событие, выраженное далее в стихе 5. В русском начало временным оборотом естественно передаёт развитие повествования без архаичного «и было».
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: На второй день
  rationale: Сохранено явное порядковое числительное еврейского текста, а не заменено более расплывчатым «на следующий день».
- source_word: לְהָמִית אֶת גְּדַלְיָהוּ
  choice: после убийства Гедалии
  rationale: Инфинитив с לְ задаёт временную точку отсчёта. Отглагольное существительное естественно по-русски и не требует вводить прямо не названное здесь подлежащее убийства.
- source_word: גְּדַלְיָהוּ
  choice: Гедалии
  rationale: Личное имя передано в принятой русской библейской форме и поставлено в родительном падеже по синтаксису перевода.
- source_word: וְאִישׁ לֹא יָדָע
  choice: когда об этом ещё никто не знал
  rationale: «Никто» естественно передаёт обобщённое אִישׁ с отрицанием. «Когда» связывает фоновое обстоятельство с последующим событием, а «ещё» передаёт сохранявшееся на тот момент незнание; подразумеваемый объект знания выражен словами «об этом».
