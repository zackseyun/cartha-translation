  text: וַ/עֲשָׂרָ֨ה אֲנָשִׁ֜ים נִמְצְאוּ בָ֗/ם וַ/יֹּאמְר֤וּ אֶל יִשְׁמָעֵאל֙ אַל תְּמִתֵ֔/נוּ כִּֽי יֶשׁ לָ֤/נוּ מַטְמֹנִים֙ בַּ/שָּׂדֶ֔ה חִטִּ֥ים וּ/שְׂעֹרִ֖ים וְ/שֶׁ֣מֶן וּ/דְבָ֑שׁ וַ/יֶּחְדַּ֕ל וְ/לֹ֥א הֱמִיתָ֖/ם בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/008.yaml
  text: But ten men were found among them[a], and they said to Ishmael, “Do not put us to death, for we have hidden stores in the field—wheat and barley[b], oil and honey.” So he refrained and did not put them to death among their brothers.
translation:
  language: ru
  text: 'Но среди них нашлись десять человек. Они сказали Измаилу: «Не убивай нас, потому что у нас спрятаны в поле запасы: пшеница, ячмень, масло и мёд». Тогда он удержался и не убил их среди их братьев.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Братья» здесь, вероятно, означает других людей из их группы, которых убивали; слово может также подразумевать соплеменников.
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲשָׂרָה אֲנָשִׁים נִמְצְאוּ בָם
  choice: Но среди них нашлись десять человек
  rationale: Союз ו здесь вводит исключение из описанного ранее убийства, поэтому естественное русское «но» передаёт контекстуальное противопоставление. Нифаль נִמְצְאוּ передан возвратной конструкцией «нашлись», а בָם — «среди них».
- source_word: אַל תְּמִתֵנוּ
  choice: Не убивай нас
  rationale: Хифиль глагола מות означает причинение смерти. В современном русском прямое «не убивай нас» естественнее громоздкого «не предавай нас смерти» и точно передаёт просьбу сохранить жизнь.
- source_word: כִּי יֵשׁ לָנוּ מַטְמֹנִים בַּשָּׂדֶה
  choice: потому что у нас спрятаны в поле запасы
  rationale: מַטְמֹנִים буквально обозначает спрятанные вещи или тайники; перечисление зерна, масла и мёда показывает, что речь идёт о скрытых запасах продовольствия, а не о сокровищах вообще.
- source_word: חִטִּים וּשְׂעֹרִים וְשֶׁמֶן וּדְבָשׁ
  choice: пшеница, ячмень, масло и мёд
  rationale: Перечень передан без добавлений. В данном историческом контексте שֶׁמֶן, вероятно, оливковое масло, однако исходный текст не уточняет это прямо, поэтому сохранено общее «масло».
- source_word: וַיֶּחְדַּל
  choice: Тогда он остановился
  rationale: חדל значит «перестать, прекратить, воздержаться». В контексте Измаил прекратил намерение или действие по отношению к этим десяти; «остановился» звучит естественно и не добавляет невыраженного объекта.
- source_word: וְלֹא הֱמִיתָם בְּתוֹךְ אֲחֵיהֶם
  choice: и не убил их вместе с их братьями
  rationale: Повторный хифиль מות передан тем же корнем «убил». בְּתוֹךְ указывает на нахождение среди группы; русское «вместе с» естественно выражает, что их не постигла участь остальных. אֲחֵיהֶם сохранено буквально как «их братьями», а вероятный контекстуальный смысл пояснён в сноске.
