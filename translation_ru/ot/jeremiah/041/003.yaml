base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/003.yaml
  text: And Ishmael struck down all the Judeans who were with Gedaliah at Mizpah[c][b][a], and the Chaldeans who were found there—the men of war.
translation:
  language: ru
  text: И Измаил сразил всех иудеев[a], бывших с Годолией в Мицпе, а также халдеев[b], находившихся там, — воинов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «евреев». Еврейское слово здесь обозначает людей Иудеи.
    reason: lexical_alternative
  - marker: b
    text: 'Или «вавилонян». В еврейском тексте: «халдеев».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «людей войны», то есть воинов или солдат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְּהוּדִים
  choice: иудеев
  rationale: В историческом контексте слово обозначает людей Иудеи; «иудеи» сохраняет эту связь, а сноска указывает возможный более общий эквивалент.
- source_word: אִתּוֹ אֶת גְּדַלְיָהוּ
  choice: бывших с Годолией
  rationale: Местоименный суффикс относится к Годолии, чьё имя далее уточняет референта; по-русски естественно назвать его один раз.
- source_word: בַּמִּצְפָּה
  choice: в Мицпе
  rationale: Предлог и форма названия естественно передают пребывание в городе; «Мицпа» близко передаёт еврейское название.
- source_word: הַכַּשְׂדִּים
  choice: халдеев
  rationale: Сохранено конкретное историческое наименование оригинала, а не более широкое «вавилонян».
- source_word: נִמְצְאוּ שָׁם
  choice: находившихся там
  rationale: Передаёт значение пассивной формы מצא в данном контексте естественным современным русским выражением.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: воинов
  rationale: Кратко и естественно передаёт буквальное «людей войны», сохраняя указание на их военный статус.
- source_word: הִכָּה
  choice: сразил
  rationale: В повествовательном контексте глагол означает смертельное поражение; «сразил» сохраняет и насильственный характер действия, и его результат.
