base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/018.yaml
  text: because of the Chaldeans[a], for they were afraid of them, because Ishmael son of Nethaniah had struck down Gedaliah son of Ahikam[c][b], whom the king of Babylon had appointed over the land.
translation:
  language: ru
  text: 'из-за халдеев[a], потому что они боялись их: ведь Исмаил, сын Нетании, убил[b] Гедалию, сына Ахикама, которого царь Вавилона поставил управлять землёй[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вавилонян».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поразил»; здесь речь идёт об убийстве.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «которого царь Вавилона назначил над землёй»; буквально возможно также: «поставил в земле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי הַכַּשְׂדִּים
  choice: из-за халдеев
  rationale: Оборот מִפְּנֵי здесь выражает причину, а этноним כַּשְׂדִּים передан традиционным русским словом «халдеи», сохраняющим форму и пророческий колорит оригинала.
- source_word: כִּי יָרְאוּ מִפְּנֵיהֶם
  choice: потому что они боялись их
  rationale: Первое כִּי вводит объяснение, а сочетание ירא с מִפְּנֵי естественно передаётся по-русски как «бояться кого-либо».
- source_word: כִּי הִכָּה
  choice: ведь ... убил
  rationale: Второе כִּי продолжает причинное объяснение. Глагол נכה буквально означает «ударить, поразить», но в данном контексте обозначает смертельное поражение; «убил» ясно передаёт результат, а буквальная образность отмечена в сноске.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Исмаил, сын Нетании
  rationale: Имена переданы в привычной русской библейской форме, а конструкция родства — прямо и естественно.
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם
  choice: Гедалию, сына Ахикама
  rationale: Сохранены традиционные русские формы имён; падежное оформление ясно обозначает прямое дополнение и родство.
- source_word: אֲשֶׁר הִפְקִיד מֶלֶךְ בָּבֶל בָּאָרֶץ
  choice: которого царь Вавилона поставил управлять этой землёй
  rationale: Hiphil הפקיד выражает назначение и вверение полномочий. Развёрнутая формулировка естественно передаёт административный смысл, тогда как בָּאָרֶץ буквально допускает «в земле».
