translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Стих синтаксически продолжает предыдущий; поэтому начало дано со строчной буквы. Два причинных כִּי разграничены словами «потому что» и «ведь», чтобы сохранить ход объяснения без тяжёлого повтора.
