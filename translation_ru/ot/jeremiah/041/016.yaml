base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/016.yaml
  text: 'Then Yohanan son of Kareah[a], and all the commanders of the forces who were with him, took all the remnant of the people whom he had recovered from Ishmael son of Nethaniah, from Mizpah, after he had struck down Gedaliah son of Ahikam: the soldiers, the men of war, and the women, and the little children, and the court officials[b], whom he had brought back from Gibeon.'
translation:
  language: ru
  text: 'Тогда Иоханан, сын Карея, и все начальники отрядов, бывшие с ним, взяли весь остаток народа, который Иоханан вернул от Измаила, сына Нафании, из Мицпы после того, как тот убил Гедалию, сына Ахикама: мужчин, воинов, женщин, малых детей и придворных[a], которых Иоханан вернул из Гаваона.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евнухов». Еврейское слово סָרִיסִים может обозначать как евнухов, так и царских или придворных служащих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Тогда ... взяли
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию. Составное подлежащее требует в русском множественного числа.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: начальники отрядов
  rationale: שָׂרֵי обозначает военачальников, а חֲיָלִים здесь — вооружённые подразделения; выражение естественно для современной русской повествовательной прозы.
- source_word: שְׁאֵרִית הָעָם
  choice: остаток народа
  rationale: Сохраняет смысл уцелевшей части народа и характерную для пророческих книг лексику.
- source_word: הֵשִׁיב מֵאֵת יִשְׁמָעֵאל
  choice: отбил у Измаила
  rationale: Каузатив שוב буквально означает «вернуть»; в данном контексте речь о возвращении людей из-под власти Измаила. «Отбил» ясно передаёт контекст освобождения, не добавляя отсутствующего в тексте образа «руки».
- source_word: מִן הַמִּצְפָּה
  choice: тех, кого тот увёл из Мицпы
  rationale: Предлог מִן указывает на исходный пункт. Перестройка устраняет в русском ложную привязку «из Мицпы» к месту освобождения и согласуется с ближайшим контекстом 41:10, где Измаил уводит пленников из Мицпы.
- source_word: אַחַר הִכָּה
  choice: после того, как убил
  rationale: Хотя נכה буквально шире («поразить»), контекст однозначно сообщает о смерти Гедалии; в современной русской прозе «убил» передаёт результат без неясности.
- source_word: גְּבָרִים אַנְשֵׁי הַמִּלְחָמָה
  choice: мужчин, воинов
  rationale: 'Сохранены оба элемента еврейского перечисления: גְּבָרִים — мужчины, אַנְשֵׁי הַמִּלְחָמָה — люди войны, то есть воины. Пунктуация оставляет возможной как координацию, так и пояснительную связь.'
- source_word: טַף
  choice: малых детей
  rationale: Передаёт значение маленьких детей и оттенок их уязвимости.
- source_word: סָרִסִים
  choice: придворных
  rationale: Слово может обозначать как евнухов, так и дворцовых должностных лиц. В основном тексте выбран естественный контекстуальный вариант, а реальная лексическая неоднозначность сохранена в примечании.
- source_word: אֲשֶׁר הֵשִׁיב מִגִּבְעוֹן
  choice: кого Иоханан вернул из Гаваона
  rationale: Снова передаёт каузатив שוב как «вернул» и сохраняет значение исходного пункта у מִן. Имя Иоханана повторено ради ясности русского синтаксиса.
- source_word: יוֹחָנָן; קָרֵחַ; יִשְׁמָעֵאל; נְתַנְיָה; גְּדַלְיָה; אֲחִיקָם; הַמִּצְפָּה; גִּבְעוֹן
  choice: Иоханан; Карей; Измаил; Нафания; Гедалия; Ахикам; Мицпа; Гаваон
  rationale: Использованы узнаваемые русские библейские формы имён и топонимов, при этом «Иоханан» ближе передаёт יוֹחָנָן, чем традиционное «Иоанан».
