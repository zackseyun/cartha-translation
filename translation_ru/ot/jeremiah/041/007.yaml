lexical_decisions:
- source_word: וַיְהִי כְּבוֹאָם
  choice: Когда они вошли
  rationale: Временная конструкция вводит следующее событие повествования. Русское «Когда они вошли» естественно передаёт её смысл без буквального и тяжеловесного «И было, когда они вошли».
- source_word: אֶל תּוֹךְ הָעִיר
  choice: в город
  rationale: Выражение буквально указывает на внутренность города; по-русски направление внутрь естественно и достаточно точно передаётся сочетанием «в город».
- source_word: וַיִּשְׁחָטֵם
  choice: зарезал их
  rationale: Глагол שׁחט обозначает заклание или перерезание горла и здесь подчёркивает жестокий характер убийства; «зарезал» передаёт это точнее, чем общее «убил».
- source_word: אֶל תּוֹךְ הַבּוֹר
  choice: и бросил в цистерну
  rationale: 'В еврейском тексте второй глагол не выражен: буквально жертвы «зарезаны в цистерну». По контексту оборот подразумевает, что тела оказались внутри неё; добавление «бросил» делает эту эллиптическую конструкцию понятной по-русски.'
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: вместе с людьми, бывшими с ним
  rationale: Оборот называет Исмаила и сопровождавших его людей совместными исполнителями; такая формулировка сохраняет этот акцент и естественно связывается с подлежащим.
- source_word: בּוֹר
  choice: цистерна
  rationale: Слово может означать яму или цистерну для воды. В данном повествовательном контексте конкретное значение «цистерна» наиболее вероятно.
