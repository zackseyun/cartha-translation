translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Два последовательных предложения устраняют тяжеловесность длинной цепочки с союзом «и». Неоднозначность обозначения водного объекта сохранена в основном тексте и пояснена в сноске.
