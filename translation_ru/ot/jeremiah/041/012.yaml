  text: וַ/יִּקְחוּ֙ אֶת כָּל הָ֣/אֲנָשִׁ֔ים וַ/יֵּ֣לְכ֔וּ לְ/הִלָּחֵ֖ם עִם יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֑ה וַ/יִּמְצְא֣וּ אֹת֔/וֹ אֶל מַ֥יִם רַבִּ֖ים אֲשֶׁ֥ר בְּ/גִבְעֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/012.yaml
  text: They took all the men and went to fight against Ishmael son of Nethaniah[a], and they found him by the great waters that are in Gibeon.
translation:
  language: ru
  text: Они взяли с собой всех мужчин и пошли сразиться с Измаилом, сыном Нефании. Они нашли его у больших вод[a], что в Гаваоне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у обильных вод», или: «у большого водоёма в Гаваоне». Буквально по-еврейски: «у многих (или больших) вод, которые в Гаваоне».'
    reason: Лексическое выражение מַיִם רַבִּים допускает буквальное «многие/большие воды» и более контекстуальное понимание как крупного водоёма или водохранилища.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: взяли с собой
  rationale: В контексте Иоханан и военачальники берут мужчин с собой в поход; добавление «с собой» естественно передаёт подразумеваемое совместное движение, не придавая глаголу значения захвата.
- source_word: כָּל הָאֲנָשִׁים
  choice: всех мужчин
  rationale: אֲנָשִׁים прямо обозначает мужчин; «воинов» было бы более узким и интерпретирующим переводом.
- source_word: לְהִלָּחֵם עִם
  choice: сразиться с
  rationale: Нифаль глагола לחם с עִם обозначает вступление в бой с кем-либо; эта формулировка естественна в современном русском повествовании.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Измаилом, сыном Нефании
  rationale: Сохранена обычная русская библейская передача имён и еврейская патронимическая конструкция.
- source_word: וַיִּמְצְאוּ אֹתוֹ
  choice: Они нашли его
  rationale: מצא обычно значит «найти»; в контексте преследования это прямой и естественный перевод.
- source_word: אֶל מַיִם רַבִּים
  choice: у больших вод
  rationale: Предлог אֶל здесь указывает на место, где преследователи настигли Измаила, а מַיִם רַבִּים буквально означает «многие/большие воды». Перевод сохраняет образ и не сводит неоднозначный объект к конкретному водоёму.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: что в Гаваоне
  rationale: Относительное придаточное определяет местонахождение вод; «в Гаваоне» естественно передаёт בְּ с названием населённого пункта.
