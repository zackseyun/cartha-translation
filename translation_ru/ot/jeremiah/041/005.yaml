base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/005.yaml
  text: Then eighty men came from Shechem[a], from Shiloh, and from Samaria, with their beards shaved, their clothes torn, and gashing themselves[c][b], with grain offerings and frankincense in their hands to bring to the house of Yahweh.
translation:
  language: ru
  text: И пришли восемьдесят человек из Сихема, Силома и Самарии — с обритыми бородами, в разорванной одежде, наносившие себе порезы[a]. В руках они несли хлебное приношение[b] и ладан, чтобы принести их в дом Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и резали себя»; речь идёт о нанесении себе порезов в знак скорби.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дар», «приношение». Еврейское слово «минха» в культовом контексте часто означает хлебное приношение.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «дом Яхве». После разрушения Иерусалима эти слова могут обозначать место святилища, а не обязательно уцелевшее здание храма.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: И пришли
  rationale: Форма с повествовательным וַ продолжает последовательность событий; русское «И пришли» естественно связывает стих с предыдущим повествованием.
- source_word: אֲנָשִׁים ... שְׁמֹנִים אִישׁ
  choice: восемьдесят человек
  rationale: В данном контексте речь о мужчинах, однако нормативное русское сочетание после числительного — «восемьдесят человек»; упоминание бород сохраняет конкретность описания.
- source_word: מִשְּׁכֶם מִשִּׁלוֹ וּמִשֹּׁמְרוֹן
  choice: из Сихема, Силома и Самарии
  rationale: Использованы традиционные русские формы библейских топонимов; повтор предлога перед каждым названием необязателен в естественной русской речи.
- source_word: מְגֻלְּחֵי זָקָן
  choice: бороды у них были обриты
  rationale: Передаёт пассивное состояние, описанное еврейским причастием, и признаки траура.
- source_word: וּקְרֻעֵי בְגָדִים
  choice: одежда разорвана
  rationale: Сохраняет конкретный образ траурного обряда и параллельную структуру описания.
- source_word: וּמִתְגֹּדְדִים
  choice: они наносили себе порезы
  rationale: Возвратная порода глагола обозначает намеренное нанесение себе порезов, здесь как траурный обычай; формулировка не ослабляет действия, но звучит естественно по-русски.
- source_word: וּמִנְחָה
  choice: хлебное приношение
  rationale: В культовом контексте מִנְחָה обозначает приношение из продуктов земледелия; традиционное «хлебное приношение» понятно и не сводит состав исключительно к зерну.
- source_word: וּלְבוֹנָה
  choice: ладан
  rationale: לְבוֹנָה обозначает именно ладан, а не благовоние вообще.
- source_word: בְּיָדָם
  choice: В руках они несли
  rationale: Сохранён конкретный образ еврейского текста, выраженный оборотом «в их руке».
- source_word: לְהָבִיא
  choice: чтобы принести
  rationale: Инфинитив передаёт цель прихода и ношения приношений.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Буквально передаёт בֵּית, не уточняя, идёт ли речь о сохранившемся здании храма или о месте святилища после разрушения; личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон; форма «Яхве» передаёт личное имя и не заменяет его титулом.
- issue: Значение בֵּית יְהוָה после разрушения Иерусалима
  choice: дом Яхве
  alternative: храм Яхве
  rationale: Буквальная формулировка сохраняет напряжение контекста и допускает как храмовый комплекс, так и священное место, не утверждая, что здание оставалось целым.
- issue: Число и характер מִנְחָה
  choice: хлебное приношение
  alternative: хлебные приношения; дар
  rationale: Еврейское существительное стоит в единственном числе и может иметь собирательное значение. Единственное число сохранено, а культовый контекст отражён словом «приношение».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён для ясности, но последовательность образов исходного текста сохранена. Траурные действия названы прямо, без эвфемизации; термин «дом Яхве» намеренно сохраняет историко-богословскую неоднозначность.
