source:
  edition: WLC
  text: וְ/הַ/בּ֗וֹר אֲשֶׁר֩ הִשְׁלִ֨יךְ שָׁ֤ם יִשְׁמָעֵאל֙ אֵ֣ת כָּל פִּגְרֵ֣י הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר הִכָּה֙ בְּ/יַד גְּדַלְיָ֔הוּ ה֗וּא אֲשֶׁ֤ר עָשָׂה֙ הַ/מֶּ֣לֶךְ אָסָ֔א מִ/פְּנֵ֖י בַּעְשָׁ֣א מֶֽלֶךְ יִשְׂרָאֵ֑ל אֹת֗/וֹ מִלֵּ֛א יִשְׁמָעֵ֥אל בֶּן נְתַנְיָ֖הוּ חֲלָלִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/009.yaml
  text: The cistern into which Ishmael had thrown all the corpses of the men whom he had struck down because of Gedaliah was the one that King Asa had made because of Baasha king of Israel[b][a]. Ishmael son of Nethaniah filled it with the slain.
translation:
  language: ru
  text: А цистерна, в которую Измаил бросил все трупы мужчин, которых он убил из-за Годолии[a], была той самой цистерной, которую царь Аса соорудил из-за Ваасы, царя Израиля[b]. Измаил, сын Нафании, заполнил её телами убитых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которых он убил вместе с Годолией». Еврейское выражение буквально связано с «рукой» или «стороной» Годолии и в данном контексте допускает разные толкования.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «из страха перед Ваасой, царём Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹר
  choice: водоём
  rationale: Слово בּוֹר может обозначать яму или искусственный резервуар для воды. Поскольку объект был сооружён царём Асой, «водоём» естественно передаёт рукотворное водохранилище и не создаёт впечатления обычной ямы.
- source_word: הִשְׁלִיךְ שָׁם
  choice: бросил ... куда
  rationale: Глагол означает «бросать, кидать»; относительная конструкция «куда ... бросил» естественно передаёт направление действия и значение שָׁם.
- source_word: פִּגְרֵי
  choice: трупы
  rationale: פֶּגֶר обозначает мёртвое тело; «трупы» сохраняет прямую и мрачную силу исходного слова.
- source_word: הָאֲנָשִׁים
  choice: мужчин
  rationale: В исходном тексте употреблено конкретное существительное мужского рода во множественном числе, поэтому выбран не обобщённый вариант «людей», а «мужчин».
- source_word: הִכָּה
  choice: убил
  rationale: В данном смертельном контексте נכה означает «поразить насмерть, убить». Русское «убил» ясно и естественно выражает результат действия.
- source_word: בְּיַד גְּדַלְיָהוּ
  choice: из-за Годолии
  rationale: Буквально трудное выражение «при/рукой Годолии» здесь не может естественно означать, что убийцей был Годолия. «Из-за Годолии» сохраняет широкую причинно-ситуативную связь, а возможные прочтения отмечены в сноске.
- source_word: הוּא אֲשֶׁר עָשָׂה
  choice: был тем самым водоёмом, который ... соорудил
  rationale: Возобновляющая конструкция отождествляет упомянутый водоём с сооружённым Асой; «тем самым» ясно передаёт это отождествление.
- source_word: מִפְּנֵי בַּעְשָׁא
  choice: из-за Ваасы
  rationale: מִפְּנֵי допускает значения «из-за», «ввиду» и «из страха перед». Основной перевод намеренно остаётся широким, а более конкретный вариант вынесен в сноску.
- source_word: מִלֵּא
  choice: наполнил
  rationale: 'Прямое соответствие породе пиэль глагола מלא: «наполнять».'
- source_word: חֲלָלִים
  choice: убитыми
  rationale: חֲלָלִים означает павших или убитых насильственной смертью; субстантивированное «убитыми» кратко и точно сохраняет этот смысл.
theological_decisions:
- issue: Смысл выражения בְּיַד גְּדַלְיָהוּ
  choice: из-за Годолии
  alternative: вместе с Годолией; рядом с Годолией
  rationale: Еврейское выражение синтаксически и контекстуально трудно. Основной текст не приписывает убийство Годолии и сохраняет связь гибели этих мужчин с ним, а сноска открыто сообщает о другой возможной связи — совместной гибели.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Имена переданы в привычной русской библейской форме: Измаил, Годолия, Аса, Вааса, Нафания. Повтор «водоём» сохранён ради ясного отождествления, а не заменён местоимением. Все маркеры сносок размещены непосредственно после соответствующих неоднозначных выражений.'
