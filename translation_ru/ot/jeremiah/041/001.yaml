  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֣ה בֶן אֱלִישָׁמָ֣ע מִ/זֶּ֣רַע הַ֠/מְּלוּכָה וְ/רַבֵּ֨י הַ/מֶּ֜לֶךְ וַ/עֲשָׂרָ֨ה אֲנָשִׁ֥ים אִתּ֛/וֹ אֶל גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם הַ/מִּצְפָּ֑תָ/ה וַ/יֹּ֨אכְלוּ שָׁ֥ם לֶ֛חֶם יַחְדָּ֖ו בַּ/מִּצְפָּֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/001.yaml
  text: In the seventh month[a], Ishmael son of Nethaniah, son of Elishama, of the royal line and one of the chief officers of the king, came with ten men to Gedaliah son of Ahikam at Mizpah[c][b], and they ate bread there together in Mizpah.
translation:
  language: ru
  text: В седьмом месяце Измаил, сын Нетании, сына Елишамы, принадлежавший к царскому роду[a] и к числу царских сановников[b], пришёл с десятью людьми в Мицпу, к Гедалии, сыну Ахикама. Там, в Мицпе, они вместе ели хлеб[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из царского семени».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «из царских вельмож».'
    reason: lexical_alternative
  - marker: c
    text: Выражение «есть хлеб» означает принимать пищу, участвовать в трапезе.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיְהִי בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: В седьмой месяц
  rationale: Повествовательная формула וַיְהִי вводит событие и не требует отдельного слова «теперь»; временное выражение передано прямо и естественно.
- source_word: בָּא
  choice: пришёл
  rationale: Обычный глагол движения к Гедалии и в Мицпу; «пришёл» сохраняет перспективу еврейского текста.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: принадлежавший к царскому роду
  rationale: זֶרַע здесь обозначает происхождение и династическую родословную, а не буквальное «семя».
- source_word: וְרַבֵּי הַמֶּלֶךְ
  choice: и к числу царских сановников
  rationale: Выражение указывает на принадлежность Измаила к кругу высокопоставленных людей царя; такая формулировка естественно согласует еврейское множественное обозначение группы с одним лицом.
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: с десятью людьми
  rationale: Кратко и естественно передаёт сопровождение Измаила без избыточного русского повтора «с ним».
- source_word: אֶל גְּדַלְיָהוּ ... הַמִּצְפָּתָה
  choice: в Мицпу, к Гедалии, сыну Ахикама
  rationale: Направительная форма названия города выражает движение в Мицпу, а אֶל — движение к Гедалии; русский порядок ясно сохраняет оба элемента.
- source_word: וַיֹּאכְלוּ שָׁם לֶחֶם יַחְדָּו
  choice: Там ... они вместе ели хлеб
  rationale: Сохранён явно названный «хлеб» и совместный характер трапезы; отдельное предложение делает длинную еврейскую фразу понятнее по-русски.
- source_word: בַּמִּצְפָּה
  choice: в Мицпе
  rationale: Повтор названия места сохранён как элемент повествовательного обрамления исходного текста.
