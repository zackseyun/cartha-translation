translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имена переданы в форме «Измаил, Нетания, Елишама, Гедалия, Ахикам»; топоним — «Мицпа». Длинное еврейское предложение разделено на два ради ясности, при этом повтор «Мицпа» и буквальный образ хлеба сохранены.
