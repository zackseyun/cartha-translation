  yaml_path: translation/ot/jeremiah/041/017.yaml
  text: So they went and stayed at Geruth Chimham[a], which is beside Bethlehem[b], intending to go on into Egypt.
translation:
  language: ru
  text: Они пошли и остановились в Герут-Кимгаме[a][b], который находится близ Вифлеема, намереваясь отправиться в Египет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на стоянке Кимгама». Еврейское слово, переданное как «Герут», вероятно, служит здесь названием места, но может обозначать место временного пребывания или стоянку, связанную с Кимгамом.'
    reason: lexical_alternative
  - marker: b
    text: Письменная форма имени в представленном еврейском тексте необычна. Контекст и древние переводы подтверждают чтение «Кимгам»; это имя известно из 2 Царств 19:37–40 и связано с местностью близ Вифлеема.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Они пошли
  rationale: Последовательная глагольная форма продолжает повествование и обозначает следующее действие.
- source_word: וַיֵּשְׁבוּ
  choice: и остановились
  rationale: В контексте пути ישׁב означает временно остаться или расположиться, а не просто сесть.
- source_word: בְּגֵרוּת
  choice: в Герут-Кимгаме
  rationale: Слово, вероятнее всего, является частью названия места, хотя его нарицательное значение, связанное с временным пребыванием или стоянкой, отражено в сноске.
- source_word: כמו/הם
  choice: Кимгаме
  rationale: По контексту и известному имени из 2 Царств 19 здесь следует читать имя Кимгам; буквальное понимание данной письменной формы как «подобно им» в этом контексте не имеет смысла.
- source_word: אֲשֶׁר אֵצֶל בֵּית לָחֶם
  choice: что близ Вифлеема
  rationale: Предлог אֵצֶל обозначает непосредственную близость; «близ» кратко и естественно передаёт пространственное отношение.
- source_word: לָלֶכֶת לָבוֹא מִצְרָיִם
  choice: намереваясь идти дальше, в Египет
  rationale: Сочетание инфинитивов выражает цель последующей остановки и движение к Египту с намерением войти в страну; формулировка сохраняет этот целевой оттенок без утверждения, что намерение уже было осуществлено.
- source_word: מִצְרָיִם
  choice: Египет
  rationale: Общепринятое русское название страны.
