- from: Тогда весь народ, который Измаил увёл в плен[a] из Мицпы, повернул обратно и пошёл к Иоханану, сыну Кареаха.
  to: Тогда весь народ, который Измаил взял в плен из Мицпы[a], повернул назад, вернулся и пошёл к Иоханану, сыну Кареаха.
  rationale: Правка восстанавливает три последовательных глагола движения оригинала, не устраняя намеренный смысловой повтор. Выражение «взял в плен» передаёт основной смысл שבה без дополнительного акцента на уводе. Сноска сохранена у соответствующего выражения и уточнена стилистически.
