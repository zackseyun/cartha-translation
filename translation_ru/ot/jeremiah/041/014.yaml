    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: повернул обратно
  rationale: Глагол סבב здесь обозначает физическую перемену направления. Единственное число согласовано с собирательным существительным «народ».
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Определённое собирательное сочетание с כָּל естественно передаётся как «весь народ»; по контексту речь идёт о группе людей, захваченных Измаилом.
- source_word: אֲשֶׁר שָׁבָה יִשְׁמָעֵאל
  choice: который Измаил увёл в плен
  rationale: Qal глагола שבה означает «взять в плен». Выражение «увёл в плен» естественно по-русски и одновременно передаёт пленение и перемещение людей.
- source_word: מִן הַמִּצְפָּה
  choice: из Мицпы
  rationale: Предлог מִן указывает исходный пункт движения; с названием города по-русски естественно «из Мицпы».
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ אֶל
  choice: и пошёл к
  rationale: В сочетании с предшествующим «повернул обратно» значение שוב уже выражено словом «обратно»; «и пошёл к» передаёт последующее движение к Иоханану без неестественного повтора.
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: Иоханану, сыну Кареаха
  rationale: Имена переданы транслитерацией, а родственное обозначение сохранено в явном виде в соответствии с еврейской повествовательной формой.
