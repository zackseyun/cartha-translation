  text: Then all the people whom Ishmael had taken captive from Mizpah turned around and went back to Johanan son of Kareah[a].
translation:
  language: ru
  text: Тогда весь народ, который Измаил взял в плен из Мицпы[a], повернул назад, вернулся и пошёл к Иоханану, сыну Кареаха.
  philosophy: optimal-equivalence
  footnotes:
