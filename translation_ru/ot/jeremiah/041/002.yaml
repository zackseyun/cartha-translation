base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/002.yaml
  text: Then Ishmael son of Nethaniah rose up with the ten men who were with him[a], and they struck down Gedaliah son of Ahikam, son of Shaphan, with the sword, and killed him—the one whom the king of Babylon had appointed over the land.
translation:
  language: ru
  text: Тогда Исмаил, сын Нефании, встал вместе с десятью людьми, которые были с ним; они поразили мечом Годолию, сына Ахикама, сына Шафана, а затем он убил его[a] — того, кого царь Вавилона поставил над землёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «они поразили Годолию… мечом, а он убил его». После глагола во множественном числе следует глагол в единственном; вероятнее всего, его субъектом является Исмаил.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַיָּקָם
  choice: поднялся
  rationale: 'Глагол קום начинает враждебное действие: Измаил встаёт, чтобы совершить нападение. «Поднялся» сохраняет повествовательную силу, не добавляя прямо отсутствующего в тексте «восстал против».'
- source_word: וַעֲשֶׂרֶת הָאֲנָשִׁים אֲשֶׁר הָיוּ אִתּוֹ
  choice: вместе с десятью людьми, которые были с ним
  rationale: Оборот естественно передаёт участие известной группы спутников Измаила и устраняет неестественное для русского сочетание единственного сказуемого с последующим множественным подлежащим.
- source_word: וַיַּכּוּ
  choice: они поразили
  rationale: נכה обозначает нанесение насильственного, здесь смертельного, удара. «Поразили» сохраняет отдельность нападения от следующего сообщения о смерти.
- source_word: בַּחֶרֶב
  choice: мечом
  rationale: Предлог ב употреблён инструментально; русский творительный падеж естественно передаёт средство нападения.
- source_word: וַיָּמֶת אֹתוֹ
  choice: и убили его
  rationale: 'Каузативная форма מות сообщает о смертельном исходе: Годолия был убит. Множественное число в основном тексте естественно связывает действие с названной группой; грамматический переход к единственному числу в еврейском отмечен в сноске.'
- source_word: אֲשֶׁר הִפְקִיד
  choice: которого ... поставил
  rationale: В административном контексте הפקיד означает назначить или поставить во главе. «Поставил» понятно современному читателю и сочетается с указанием области власти.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Так естественно и точно передаётся еврейская сопряжённая конструкция.
- source_word: בָּאָרֶץ
  choice: над этой землёй
  rationale: При глаголе назначения выражение указывает на территорию полномочий Годолии, а не только на место его пребывания. Указательное «этой» естественно отсылает к уже известной из контекста стране.
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם בֶּן שָׁפָן
  choice: Годолию, сына Ахикама, сына Шафана
  rationale: Сохранена полная родословная цепочка, служащая точной идентификации Годолии; имена переданы в традиционной русской библейской форме.
