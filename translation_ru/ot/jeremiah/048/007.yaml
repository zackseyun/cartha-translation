  verdict: approve
  source_fidelity: Русский текст точно передаёт причинное основание, доверие Моава своим делам и сокровищам, предстоящее пленение, а также изгнание Хамоса с его священниками и вельможами. Женский род во втором лице корректно отражает персонифицированный Моав. «В изгнание» адекватно передаёт בַּגּוֹלָה; «вместе со своими…» передаёт יַחַד без смысловой потери.
  naturalness: Формулировка звучит естественно на современном литературном русском и сохраняет сжатый пророческий регистр. «За то, что» ясно и идиоматично выражает усиленную причинную связь כִּי יַעַן. Пассив «будешь захвачена» понятен и уместен в контексте военного поражения.
  terminology: «Хамос» — допустимая и традиционная русская передача имени Chemosh. «Священники» точно передаёт כֹּהֲנָיו; «вельможи» является приемлемым широким соответствием שָׂרָיו и соответствует возвышенному регистру. Сноски корректно отражают заявленные лексические альтернативы и культурную справку.
