source:
  edition: WLC
  text: כִּ֠י יַ֣עַן בִּטְחֵ֤/ךְ בְּ/מַעֲשַׂ֨יִ/ךְ֙ וּ/בְ/א֣וֹצְרוֹתַ֔יִ/ךְ גַּם אַ֖תְּ תִּלָּכֵ֑דִי וְ/יָצָ֤א כמיש בַּ/גּוֹלָ֔ה כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יחד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/007.yaml
  text: Because you trusted in your works and in your treasures[a], you also will be captured; and Chemosh will go out into exile[e][d][c][b], his priests and his officials together.
translation:
  language: ru
  text: За то, что ты полагалась на свои дела и свои сокровища[a], ты тоже будешь захвачена. И Хамос[b] отправится в изгнание[c] вместе со своими священниками и вельможами[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на свои деяния» или «на то, что ты сделала». Еврейское слово может обозначать дела, поступки или созданное человеком.'
    reason: lexical_alternative
  - marker: b
    text: Хамос — национальный бог Моава.
    reason: cultural_note
  - marker: c
    text: 'Или: «в плен».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «князьями», «правителями» или «сановниками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יַעַן
  choice: За то, что
  rationale: Сочетание выражает усиленную причинную связь. Русское «за то, что» естественно передаёт основание предстоящего суда без неуклюжего удвоения союзов.
- source_word: בִּטְחֵךְ
  choice: ты полагалась
  rationale: Форма 2-го лица женского рода обращена к Моаву как к олицетворённой стране; прошедшее время передаёт уже проявленное упование.
- source_word: בְּמַעֲשַׂיִךְ
  choice: на свои дела
  rationale: מַעֲשֶׂה может обозначать дело, деяние или сделанное; «дела» сохраняет широту значения и не уточняет без основания, идёт ли речь о достижениях, действиях или произведённом.
- source_word: וּבְאֹצְרוֹתַיִךְ
  choice: и свои сокровища
  rationale: אֹצָר может означать сокровище, казну или хранилище. В контексте ложной уверенности «сокровища» наиболее естественно обозначает накопленные богатства и ресурсы.
- source_word: גַּם אַתְּ
  choice: ты тоже
  rationale: Передаёт подчёркнутое включение Моава в грядущий суд.
- source_word: תִּלָּכֵדִי
  choice: будешь захвачена
  rationale: Пассивная форма от לכד в контексте поражения означает, что олицетворённый Моав будет взят или захвачен.
- source_word: וְיָצָא
  choice: отправится
  rationale: В пророческой последовательности форма имеет будущее значение; «отправится» естественно сочетается с направлением «в изгнание» и передаёт вынужденный уход по контексту.
- source_word: כמיש
  choice: Хамос
  rationale: Передача традиционного русского имени моавитского божества; имя не заменяется описанием.
- source_word: בַּגּוֹלָה
  choice: в изгнание
  rationale: Выражение обозначает насильственное удаление и депортацию; «в изгнание» ясно передаёт направленность движения.
- source_word: כֹּהֲנָיו
  choice: со своими священниками
  rationale: Местоименный суффикс мужского рода соотнесён с персонифицированным Хамосом.
- source_word: וְשָׂרָיו
  choice: и вельможами
  rationale: שַׂר охватывает значения князя, сановника, правителя или должностного лица. «Вельможи» уместно передаёт высокопоставленных представителей моавитской власти, не сводя их к современным чиновникам.
- source_word: יַחַד
  choice: вместе
  rationale: Показывает совместное изгнание Хамоса, его священников и вельмож.
theological_decisions:
- issue: Референт и статус Хамоса
  choice: Хамос передан как названное по имени моавитское божество, образно отправляющееся в изгнание вместе со своими служителями и вельможами.
  alternative: Понимать Хамоса как географическое название или династический титул.
  rationale: Контекст указывает на национального бога Моава и изображает его поражение и депортацию. Прямая передача имени сохраняет полемическую силу текста, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным пророческим звучанием. Женский род («полагалась», «захвачена») сохраняет обращение к Моаву как к олицетворённой стране. Порядок последней части слегка перестроен ради естественного русского синтаксиса, при этом совместное изгнание всех названных участников сохранено.
