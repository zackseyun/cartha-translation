    text: 'Или: «Моав будет хлопать (или ударять) руками в своей рвоте». Еврейский глагол допускает такое более буквальное понимание, однако в данном контексте образ пьяного унижения лучше передаётся словом «барахтаться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁכִּירֻהוּ
  choice: Напоите его допьяна
  rationale: Повелительная форма породы хифиль с местоименным дополнением 3-го лица мужского рода выражает требование довести Моав до опьянения как образ суда.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину повеления и естественно передаётся причинной конструкцией.
- source_word: עַל יְהוָה הִגְדִּיל
  choice: он превознёсся над Яхве
  rationale: Сочетание הגדיל с על обозначает надменное самовозвышение, направленное против Яхве; «превознёсся над» сохраняет образ величия и враждебную направленность.
- source_word: וְסָפַק
  choice: Пусть ... барахтается
  rationale: В сочетании с «в своей блевотине» глагол уместно понимать как движение или возню в состоянии пьяного унижения; при этом буквальная возможность «хлопать/ударять руками» сохранена в сноске.
- source_word: בְּקִיאוֹ
  choice: в своей блевотине
  rationale: Конкретный и намеренно унизительный образ передан прямо; предлог בְּ соответствует «в».
- source_word: וְהָיָה לִשְׂחֹק
  choice: станет посмешищем
  rationale: Естественная современная передача состояния публичного осмеяния.
- source_word: גַּם הוּא
  choice: и сам
  rationale: 'Передаёт добавочное и эмфатическое значение: Моав тоже окажется предметом насмешек.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Характер самовозвышения Моава
  choice: превознёсся над Яхве
  alternative: восстал против Яхве / хвалился перед Яхве
  rationale: Формулировка сохраняет метафору самовозвеличивания и направленность против Бога, не сводя выражение только к хвастовству или мятежу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи; грубый образ блевотины сохранён без эвфемизма, поскольку он существен для картины суда и унижения. Местоимение «его» относится к Моаву, названному далее.
