  text: Make him drunk[a], because he has magnified himself against Yahweh; and Moab shall wallow in his vomit, and he too shall become a laughingstock.
translation:
  language: ru
  text: Напоите его допьяна[a], потому что он превознёсся против Яхве; и Моав будет барахтаться в своей рвоте и тоже станет посмешищем.
  philosophy: optimal-equivalence
  footnotes:
