base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/030.yaml
  text: I know his wrath[a], declares Yahweh, and it is not so; his boasts have accomplished nothing.
translation:
  language: ru
  text: «Я знаю его ярость, — возвещает Яхве, — но это не так; его хвастливые речи ни к чему не привели»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его ложные слова — не таковы; они не сделали этого»; возможно также: «его пустые речи ни к чему не привели». Заключительная фраза в еврейском тексте сжата и трудна для однозначного понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Я знаю
  rationale: Перфект qal 1-го лица ед. числа выражает здесь твёрдое, актуальное знание Яхве о Моаве, а не только действие в прошлом.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественную силу обычной пророческой формулы и передаёт личное имя יְהוָה как «Яхве».
- source_word: עֶבְרָתוֹ
  choice: его ярость
  rationale: עֶבְרָה обычно обозначает сильный, переполняющий гнев; «ярость» естественно передаёт интенсивность слова в контексте суда над Моавом.
- source_word: וְלֹא כֵן
  choice: но это не так
  rationale: Кратко и непосредственно передаёт отрицание, содержащееся в כֵן («так»), не уточняя насильно, к какому именно утверждению оно относится.
- source_word: בַּדָּיו
  choice: его хвастливые речи
  rationale: בַּדִּים может обозначать ложные, пустые или хвастливые слова. Контекст гордости Моава поддерживает значение «хвастливые речи», при этом слово «речи» сохраняет оттенок пустых заявлений.
- source_word: לֹא כֵן עָשׂוּ
  choice: ничего не достигли
  rationale: Буквально выражение означает «не так сделали», но фраза сжата и трудна. Выбранная передача естественно выражает мысль о безрезультатности хвастливых речей, а буквальная неопределённость отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация «Яхве» сохраняет личное заветное имя Бога и не смешивает его с титулом «Господь».
- issue: Толкование сжатой фразы בַּדָּיו לֹא כֵן עָשׂוּ
  choice: его хвастливые речи ничего не достигли
  alternative: его ложь — неправда; они не сделали так; его пустые речи ни к чему не привели
  rationale: Контекст обличения гордости Моава позволяет понимать בַּדָּיו как хвастливые заявления, однако синтаксис заключительной части стиха остаётся неоднозначным; поэтому альтернативы не исключаются и приводятся в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксическая сжатость оригинала частично сохранена; неоднозначность заключительной фразы не устранена без оговорки.
