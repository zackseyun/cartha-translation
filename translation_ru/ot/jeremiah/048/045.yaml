  text: בְּ/צֵ֥ל חֶשְׁבּ֛וֹן עָמְד֖וּ מִ/כֹּ֣חַ נָסִ֑ים כִּֽי אֵ֞שׁ יָצָ֣א מֵ/חֶשְׁבּ֗וֹן וְ/לֶֽהָבָה֙ מִ/בֵּ֣ין סִיח֔וֹן וַ/תֹּ֨אכַל֙ פְּאַ֣ת מוֹאָ֔ב וְ/קָדְקֹ֖ד בְּנֵ֥י שָׁאֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/045.yaml
  text: In the shadow of Heshbon the fugitives stand without strength[a], for a fire has gone out from Heshbon, and a flame from the midst of Sihon[d][c][b]; it has consumed the corner of Moab and the crown of the head of the sons of tumult.
translation:
  language: ru
  text: В тени Хешбона стояли беглецы, лишившиеся сил[a], ибо из Хешбона вышел огонь и пламя — из среды Сихона[b]; оно пожрало край Моава[c] и темя сыновей смятения[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стояли без сил» или «стояли из-за недостатка сил»; еврейская форма может обозначать совершившееся действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из меж Сихона». Имя Сихона здесь может обозначать связанный с ним город или владение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «угол Моава». Еврейское слово — поэтический образ края или оконечности.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «темя сыновей шума»; возможный смысл — «темя буйных» или «тех, кто производит шум».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵל חֶשְׁבּוֹן
  choice: В тени Хешбона
  rationale: Сохраняется конкретный поэтический образ צֵל («тень, сень») и местное значение предлога בְּ; название места передано транслитерацией.
- source_word: עָמְדוּ מִכֹּחַ נָסִים
  choice: остановились беглецы, обессилевшие
  rationale: Перфект עָמְדוּ естественно передан прошедшим временем; נָסִים обозначает бегущих, а מִכֹּחַ в данном контексте — отсутствие сил. Причастная конструкция звучит естественно и не устраняет лексическую неоднозначность, отмеченную в сноске.
- source_word: כִּי
  choice: Но
  rationale: В контексте цитаты, близкой к Чис 21:28, частица вводит резкий переход от остановившихся беглецов к наступающему из Хешбона уничтожению. Русское «но» естественно передаёт этот поворот; возможное причинное чтение не навязывается.
- source_word: אֵשׁ יָצָא מֵחֶשְׁבּוֹן
  choice: из Хешбона вышел огонь
  rationale: Сохранены исходный порядок образов и значение יצא — «выйти»; прошедшее время согласуется с последовательностью еврейских форм.
- source_word: וְלֶהָבָה מִבֵּין סִיחוֹן
  choice: и пламя — из среды Сихона
  rationale: Эллипсис восполнен тире, а מִבֵּין передано буквально как «из среды». Имя Сихона может метонимически обозначать связанную с ним область или город, что поясняется сноской.
- source_word: וַתֹּאכַל
  choice: оно пожрало
  rationale: Глагол אכל буквально означает «есть, пожирать» и в сочетании с огнём образно описывает уничтожение; местоимение среднего рода соотносится с ближайшим русским существительным «пламя».
- source_word: פְּאַת מוֹאָב
  choice: край Моава
  rationale: פֵּאָה может означать угол, сторону или край. «Край» естественен по-русски и сохраняет возможность как территориального, так и телесно-поэтического образа.
- source_word: וְקָדְקֹד בְּנֵי שָׁאוֹן
  choice: и темя сыновей смятения
  rationale: קָדְקֹד точно передано словом «темя». Буквальная конструкция «сыновья смятения» сохраняет необычную поэтическую формулу и неоднозначность שָׁאוֹן («шум, грохот, смятение»).
