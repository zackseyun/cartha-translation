  text: שַׁאֲנַ֨ן מוֹאָ֜ב מִ/נְּעוּרָ֗י/ו וְ/שֹׁקֵ֥ט הוּא֙ אֶל שְׁמָרָ֔י/ו וְ/לֹֽא הוּרַ֤ק מִ/כְּלִי֙ אֶל כֶּ֔לִי וּ/בַ/גּוֹלָ֖ה לֹ֣א הָלָ֑ךְ עַל כֵּ֗ן עָמַ֤ד טַעְמ/וֹ֙ בּ֔/וֹ וְ/רֵיח֖/וֹ לֹ֥א נָמָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/011.yaml
  text: Moab has been at ease from his youth[a], and he has been undisturbed on his dregs; he has not been poured from vessel to vessel, and he has not gone into exile. Therefore his taste has remained in him, and his scent has not changed.
translation:
  language: ru
  text: Моав с юности жил безмятежно и оставался в покое на своём осадке[a]. Его не переливали из сосуда в сосуд, и в изгнание он не уходил. Поэтому вкус его сохранился, и аромат его не изменился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально — «на своих осадках». Здесь используется образ вина, которое долго оставляли на осадке, не переливая в другой сосуд.
    reason: Пояснение непривычного винодельческого образа и формы множественного числа в еврейском тексте.
lexical_decisions:
- source_word: שַׁאֲנַן
  choice: жил безмятежно
  rationale: Передаёт длительное состояние спокойствия и безопасности, которое в пророческом контексте подразумевает отсутствие потрясений, а не просто внутреннее чувство покоя.
- source_word: מִנְּעוּרָיו
  choice: с юности
  rationale: Естественно передаёт временное значение и сохраняет олицетворение Моава как лица мужского рода.
- source_word: שֹׁקֵט הוּא אֶל שְׁמָרָיו
  choice: оставался в покое на своём осадке
  rationale: Сохраняет образ вина, долго стоящего на осадке, и одновременно выражает невозмутимое, не нарушаемое внешними событиями состояние Моава.
- source_word: הוּרַק מִכְּלִי אֶל כֶּלִי
  choice: не переливали из сосуда в сосуд
  rationale: Глагол в пассивной форме и контекст виноделия указывают на переливание вина; формулировка ясна и сохраняет конкретный образ.
- source_word: וּבַגּוֹלָה לֹא הָלָךְ
  choice: в изгнание он не уходил
  rationale: Передаёт изгнание или переселение и сохраняет активную конструкцию и олицетворение оригинала.
- source_word: עָמַד טַעְמוֹ בּוֹ
  choice: вкус его сохранился
  rationale: Идиома означает, что вкус остался прежним; русский глагол «сохранился» естественно выражает устойчивость без излишнего истолкования.
- source_word: וְרֵיחוֹ לֹא נָמָר
  choice: аромат его не изменился
  rationale: В винном образе רֵיחַ обозначает запах или аромат, а נמר — изменение. «Аромат» здесь естественнее нейтрального «запах» и продолжает образ вина.
theological_decisions:
- issue: Олицетворение Моава формами мужского рода единственного числа
  choice: 'Сохранить мужской род и единственное число: «его», «он»'
  alternative: Передать Моав как страну формами женского рода либо заменить местоимения названием народа
  rationale: В еврейском тексте Моав последовательно представлен как единичное лицо мужского рода. Сохранение этого приёма передаёт литературную форму источника и не добавляет толкования.
- issue: Соотношение исторического покоя Моава и винодельческого образа
  choice: Сохранить оба смысловых слоя без прямого объяснения в основном тексте
  alternative: Развернуть метафору как утверждение о самодовольстве или неизменности характера Моава
  rationale: Текст сопоставляет отсутствие переселений с вином, которое не переливали, но прямо не сводит этот образ к одной богословской характеристике. Перевод сохраняет напряжение образа, а пояснение ограничено сноской.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Метафора вина сохранена последовательно; редкий образ «на своём осадке» пояснён сноской. Маркер [a] поставлен непосредственно при выражении, к которому относится примечание.
