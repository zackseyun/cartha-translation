  text: וְ/עַ֧ל קִרְיָתַ֛יִם וְ/עַל בֵּ֥ית גָּמ֖וּל וְ/עַל בֵּ֥ית מְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/023.yaml
  text: and against Kiriathaim[a], and against Beth-gamul, and against Beth-meon—
translation:
  language: ru
  text: и против Кирьятаима[a], и против Бейт-Гамула, и против Бейт-Меона —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте слова «и против» повторяются перед названием каждого города, сохраняя ритм пророчества о суде.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: и против
  rationale: В контексте пророчества о суде предлог עַל выражает направленность враждебного действия. Повтор «и против» перед каждым названием сохраняет синтаксис и ритм еврейского перечня.
- source_word: קִרְיָתַיִם
  choice: Кирьятаим
  rationale: Географическое название передано транслитерацией с еврейского; внешне двойственное окончание является частью топонима и не переводится отдельно.
- source_word: בֵּית גָּמוּל
  choice: Бейт-Гамул
  rationale: Составной топоним передан транслитерацией, а не буквальным переводом «дом Гамула»; дефис отражает его составное строение.
- source_word: בֵּית מְעוֹן
  choice: Бейт-Меон
  rationale: Составной топоним передан транслитерацией; дефис сохраняет связь компонентов בֵּית и מְעוֹן и делает название удобочитаемым.
theological_decisions: []
translation_notes:
