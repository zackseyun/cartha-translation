  text: עַל כֵּ֞ן לִבִּ֤/י לְ/מוֹאָב֙ כַּ/חֲלִלִ֣ים יֶהֱמֶ֔ה וְ/לִבִּ/י֙ אֶל אַנְשֵׁ֣י קִֽיר חֶ֔רֶשׂ כַּ/חֲלִילִ֖ים יֶהֱמֶ֑ה עַל כֵּ֛ן יִתְרַ֥ת עָשָׂ֖ה אָבָֽדוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/036.yaml
  text: Therefore my heart moans for Moab like flutes, and my heart moans like flutes for the men of Kir-heres, because the abundance he made has perished.
translation:
  language: ru
  text: Поэтому сердце моё стонет о Моаве, словно свирели; сердце моё стонет, словно свирели, о жителях Кир-Хереса, потому что пропало нажитое им.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבִּי ... יֶהֱמֶה
  choice: сердце моё стонет
  rationale: Глагол יהמה передаёт гул, стон или скорбное звучание; в сочетании с сердцем и сравнением со свирелями естественно русское «стонет».
- source_word: כַחֲלִלִים
  choice: словно свирели
  rationale: חֲלִילִים — духовые инструменты, вероятно свирели или флейты; «свирели» сохраняет древний поэтический образ и погребально-скорбный оттенок.
- source_word: אַנְשֵׁי קִיר חֶרֶשׂ
  choice: жители Кир-Харесета
  rationale: Буквально «люди Кир-Хереса»; в данном контексте речь о населении города. Употреблена традиционно узнаваемая форма топонима «Кир-Харесет».
- source_word: יִתְרַת עָשָׂה
  choice: нажитое им
  rationale: יִתְרַת обозначает остаток, избыток или накопленное имущество, а עָשָׂה буквально означает «он сделал». «Нажитое им» естественно передаёт накопленные плоды его труда, сохраняя местоименную форму единственного числа.
- source_word: אָבָדוּ
  choice: пропало
  rationale: Форма множественного числа согласуется по смыслу с совокупностью накоплений; по-русски собирательное «нажитое» требует сказуемого в единственном числе.
theological_decisions:
- issue: Кому принадлежит голос скорби в словах «сердце моё»
  choice: Не уточнять говорящего сверх текста
  alternative: Явно приписать слова Иеремии или Господу
  rationale: Контекст допускает обсуждение говорящего, но сам стих его прямо не называет; перевод сохраняет эту неоднозначность.
- issue: Число и референт в עָשָׂה
  choice: «нажитое им»
  alternative: «нажитое ими» или «их богатство»
  rationale: Масоретский текст содержит глагол мужского рода единственного числа «он сделал»; перевод сохраняет это число, не исправляя его по предполагаемому коллективному субъекту.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Параллелизм двух строк сохранён; архаизирующие обороты сведены к минимуму, при этом образ свирелей оставлен поэтичным и ясным.
