  yaml_path: translation/ot/jeremiah/048/016.yaml
  text: The disaster of Moab is near to come[b][a], and his calamity is hurrying very quickly.
translation:
  language: ru
  text: Близка гибель Моава, она вот-вот придёт, и бедствие его стремительно приближается.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרוֹב
  choice: близка
  rationale: Предикативное прилагательное указывает на неизбежность и скорое наступление события; «близка» естественно звучит по-русски.
- source_word: אֵיד
  choice: гибель
  rationale: В контексте пророческого суда слово обозначает губительное бедствие или крах; «гибель» передаёт тяжесть предстоящего Моаву разрушения.
- source_word: מוֹאָב
  choice: Моав
  rationale: Традиционная русская передача названия страны и народа.
- source_word: לָבוֹא
  choice: она вот-вот придёт
  rationale: Инфинитив с ל при קָרוֹב выражает близость наступления; русская конструкция «вот-вот придёт» ясно и естественно передаёт эту непосредственную угрозу.
- source_word: רָעָתוֹ
  choice: бедствие его
  rationale: רָעָה здесь означает несчастье или бедствие, а не нравственное зло. Местоимение мужского рода сохраняет грамматическое соотнесение с Моавом.
- source_word: מִהֲרָה
  choice: стремительно приближается
  rationale: Форма выражает поспешность, быстрое наступление; «стремительно приближается» сохраняет динамику и уместно в современном литературном русском.
- source_word: מְאֹד
  choice: стремительно
  rationale: Интенсивность наречия передана сильным русским наречием; это позволяет избежать менее естественного сочетания «очень быстро спешит».
