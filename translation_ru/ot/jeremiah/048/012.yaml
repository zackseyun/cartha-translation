  text: לָ/כֵ֞ן הִנֵּ֖ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּחְתִּי ל֥/וֹ צֹעִ֖ים וְ/צֵעֻ֑/הוּ וְ/כֵלָ֣י/ו יָרִ֔יקוּ וְ/נִבְלֵי/הֶ֖ם יְנַפֵּֽצוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/012.yaml
  text: Therefore behold[a], days are coming, declares Yahweh, when I will send to him pourers, and they will pour him out[c][b]; they will empty his vessels and shatter their jars.
translation:
  language: ru
  text: 'Поэтому: вот, наступают дни, — возвещает Яхве, — когда Я пошлю к нему тех, кто будет переливать[a], и они перельют его[b]; они опустошат его сосуды и разобьют их кувшины[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наклоняющих сосуды», «переливающих вино». Еврейское слово редкое; контекст переливания, опустошения сосудов и разбивания кувшинов указывает на людей, переливающих вино.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заставят его скитаться». Еврейский глагол допускает такое понимание, но окружающий образ вина и сосудов поддерживает перевод «перельют его».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально по еврейскому тексту: «их кувшины». По смыслу некоторые ожидают «его кувшины», то есть кувшины Моава, однако масоретский текст имеет форму множественного числа «их».'
    reason: textual_variant
