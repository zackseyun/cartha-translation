- source_word: וְשִׁלַּחְתִּי לוֹ
  choice: Я пошлю к нему
  rationale: Предлог ל с местоименным суффиксом обозначает направление к Моаву; враждебный характер действия раскрывается дальнейшим образом.
- source_word: צֹעִים
  choice: переливальщиков
  rationale: Редкое слово истолковано в свете винодельческого образа предыдущего стиха и последующих действий с сосудами; русское слово обозначает тех, кто переливает содержимое из сосуда.
- source_word: וְצֵעֻהוּ
  choice: они перельют его
  rationale: Контекст вина, сосудов и кувшинов поддерживает значение переливания; местоименный объект сохраняет олицетворение Моава.
- source_word: וְכֵלָיו יָרִיקוּ
  choice: опустошат его сосуды
  rationale: Передаёт каузативное значение ריק и продолжает образ полного удаления содержимого.
- source_word: וְנִבְלֵיהֶם יְנַפֵּצוּ
  choice: разобьют их кувшины
  rationale: Сохраняет масоретское местоимение третьего лица множественного числа «их» и конкретный образ уничтожаемой тары.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте и не подменяет его титулом.
- issue: Смысл редких слов צֹעִים и צעה
  choice: переливальщики; перельют его
  alternative: скитальцы; заставят его скитаться
  rationale: Винный образ Иер 48:11 и параллельные упоминания опустошения сосудов и разбивания кувшинов склоняют к значению переливания, однако иная этимологическая трактовка остаётся возможной и отмечена в сносках.
- issue: Местоименный суффикс в נִבְלֵיהֶם
  choice: их кувшины
  alternative: его кувшины
  rationale: Сохранено чтение масоретского текста, даже несмотря на смысловое ожидание единственного числа с отсылкой к Моаву.
