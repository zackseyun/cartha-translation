source:
  edition: WLC
  text: אָר֗וּר עֹשֶׂ֛ה מְלֶ֥אכֶת יְהוָ֖ה רְמִיָּ֑ה וְ/אָר֕וּר מֹנֵ֥עַ חַרְבּ֖/וֹ מִ/דָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/010.yaml
  text: Cursed is the one who does the work of Yahweh negligently[a], and cursed is the one who holds back his sword from blood.
translation:
  language: ru
  text: Проклят тот, кто небрежно исполняет дело Яхве[a], и проклят тот, кто удерживает свой меч от крови.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «коварно». Еврейское слово רְמִיָּה может обозначать обман или вероломство, но здесь, вероятно, означает нерадивое, недобросовестное исполнение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Предикативная форма выражает формулу проклятия или суда; «проклят» естественно и точно передаёт её силу.
- source_word: עֹשֶׂה
  choice: тот, кто… исполняет
  rationale: Причастие употреблено субстантивированно и обобщённо; такая конструкция ясно передаёт значение действующего лица.
- source_word: מְלֶאכֶת יְהוָה
  choice: дело Яхве
  rationale: מְלָאכָה означает работу, дело или поручение; в контексте речь идёт о совершении суда над Моавом как о порученном Яхве деле.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, соответствующее тетраграмматону, а не заменяющий его титул.
- source_word: רְמִיָּה
  choice: небрежно
  rationale: В данном контексте слово, вероятно, указывает на вялое, недобросовестное исполнение поручения; возможное значение «коварно» сохранено в сноске.
- source_word: מֹנֵעַ
  choice: удерживает
  rationale: Глагол означает удерживать или не допускать; «удерживает свой меч» сохраняет образ сознательного отказа довести суд до конца.
- source_word: חַרְבּוֹ
  choice: свой меч
  rationale: Возвратное притяжательное местоимение естественно передаёт суффикс третьего лица в русской конструкции с тем же субъектом.
- source_word: מִדָּם
  choice: от крови
  rationale: Буквальная передача предлога מן и существительного דָּם сохраняет резкий конкретный образ исходного текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Передача насильственного образа суда
  choice: удерживает свой меч от крови
  alternative: удерживает свой меч от кровопролития
  rationale: Конкретный и суровый образ крови сохранён без смягчения и без добавочного богословского оправдания.
- issue: Смысл רְמִיָּה
  choice: небрежно
  alternative: коварно
  rationale: Контекст порученного дела поддерживает значение недобросовестного или нерадивого исполнения, однако подлинная лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая параллельная структура и суровая риторика проклятия сохранены. Выражение «дело Яхве» передаёт контекст порученного суда, а «от крови» намеренно сохраняет конкретность еврейского образа.
