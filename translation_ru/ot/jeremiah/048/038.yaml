  text: עַ֣ל כָּל גַּגּ֥וֹת מוֹאָ֛ב וּ/בִ/רְחֹבֹתֶ֖י/הָ כֻּלֹּ֣/ה מִסְפֵּ֑ד כִּֽי שָׁבַ֣רְתִּי אֶת מוֹאָ֗ב כִּ/כְלִ֛י אֵֽין חֵ֥פֶץ בּ֖/וֹ נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/038.yaml
  text: On all the rooftops of Moab and in her squares[a], everywhere there is mourning; for I have broken Moab like a vessel in which there is no delight, declares Yahweh.
translation:
  language: ru
  text: На всех крышах Моава и на его площадях — повсюду плач, потому что Я разбил Моав, как сосуд, который никому не нужен[a], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как сосуд, в котором нет отрады»; возможно также: «которого никто не желает».'
    reason: Лексема חֵפֶץ может выражать удовольствие, расположение или желание; буквальный оборот по-русски менее естественен, чем контекстуальный перевод в основном тексте.
lexical_decisions:
- source_word: גַּגּוֹת
  choice: крыши
  rationale: Речь идёт о плоских крышах домов, служивших в древности местом повседневной жизни и публичного плача; «крыши» естественно и конкретно передаёт образ.
- source_word: רְחֹבֹתֶיהָ
  choice: его площади
  rationale: Слово обозначает широкие открытые места, часто городские площади. Местоимение согласовано с мужским родом русского названия «Моав», хотя в еврейском стоит форма женского рода.
- source_word: כֻּלֹּה מִסְפֵּד
  choice: повсюду плач
  rationale: Сжатая еврейская конструкция выражает всеохватность скорби; этот перевод естественно передаёт и общий охват, и слышимое проявление траура.
- source_word: שָׁבַרְתִּי
  choice: Я разбил
  rationale: Перфект представляет действие Яхве как совершившееся; «разбил» сохраняет образ уничтоженного сосуда.
- source_word: כִּכְלִי
  choice: как сосуд
  rationale: כְּלִי — общее обозначение сосуда, ёмкости или предмета; контекст разрушения поддерживает перевод «сосуд» без неоправданного уточнения материала или формы.
- source_word: אֵין חֵפֶץ בּוֹ
  choice: который никому не нужен
  rationale: Идиоматический русский перевод передаёт смысл отсутствия желания, расположения или ценности, не сводя широкое חֵפֶץ только к эстетическому удовольствию.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современным и достойным русским выражением, сохраняющим авторитет божественного высказывания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Образ Моава как нежеланного сосуда
  choice: который никому не нужен
  alternative: в котором нет отрады
  rationale: Выбранное чтение передаёт наиболее естественный контекстуальный смысл, но сноска сохраняет буквальную семантику חֵפֶץ и не устраняет её широту.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Тире выделяют всеохватный плач и заключительную формулу речи. Род местоимения приведён в соответствие с русским словом «Моав».
