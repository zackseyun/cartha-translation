lexical_decisions:
- source_word: אֵיךְ תֹּאמְרוּ
  choice: Как вы можете говорить
  rationale: Передаёт форму риторического вопроса с оттенком недоверия и укоризны; множественное число обращения сохранено.
- source_word: גִּבּוֹרִים
  choice: могучие воины
  rationale: В военном контексте слово обозначает сильных, прославленных бойцов; сочетание сохраняет как значение мощи, так и военную направленность.
- source_word: אֲנָחְנוּ
  choice: Мы —
  rationale: Самостоятельное местоимение подчёркивает хвастливое самоутверждение; тире естественно оформляет именную конструкцию по-русски.
- source_word: וְאַנְשֵׁי חַיִל
  choice: доблестные
  rationale: В данном военном контексте конструкция означает людей силы и доблести. Субстантивированное прилагательное избегает тяжеловесного повтора слова «воины».
- source_word: לַמִּלְחָמָה
  choice: в бою
  rationale: Передаёт отношение доблести к сражению естественным современным русским выражением; буквально возможно также «для битвы».
