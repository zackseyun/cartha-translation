base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/004.yaml
  text: Moab is shattered; her little ones have made a cry heard.
translation:
  language: ru
  text: Моав сокрушён; его малые подняли крик.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשְׁבְּרָה
  choice: сокрушён
  rationale: Глагол שׁבר в нифале передаёт состояние полного поражения или разрушения. В русском название «Моав» грамматически мужского рода, поэтому согласование дано в мужском роде, хотя в еврейском стоит форма женского рода.
- source_word: הִשְׁמִיעוּ זְּעָקָה
  choice: подняли крик
  rationale: Каузативная форма буквально означает «дали услышать крик». Русское устойчивое выражение естественно передаёт громкий, ставший слышным вопль.
- source_word: צעורי/ה
  choice: его малые
  rationale: 'Передаёт масоретское понимание формы как «её малые»: младшие, юные или слабые жители Моава. Слово «малые» сохраняет широту значения и не сужает его без достаточных оснований до одних только детей.'
theological_decisions:
- issue: Кого обозначают «малые» Моава
  choice: Сохранено обобщённое «его малые».
  alternative: «его дети» или «его юные»
  rationale: Еврейское обозначение допускает возрастной и социальный оттенки; контекст не требует догматического или более узкого толкования.
translation_notes:
  register: Современный литературный русский язык; краткая пророческая фраза сохранена энергичной и торжественной. Грамматический род местоимения согласован с русским «Моав», а не механически с женским родом еврейской формы.
