base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/013.yaml
  text: And Moab will be put to shame because of Chemosh[a], just as the house of Israel was put to shame because of Bethel[b], their confidence.
translation:
  language: ru
  text: И Моав будет посрамлён из-за Кемоша[a], как дом Израиля был посрамлён из-за Вефиля[b], который был их упованием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устыдится Кемоша». Буквальнее еврейское выражение можно передать как «будет в стыде от Кемоша»: упование Моава на своего бога обернётся позором.'
    reason: lexical_alternative
  - marker: b
    text: 'Вефиль — северный израильский культовый центр, связанный с поклонением тельцу. Буквальнее: «от Вефиля, их упования».'
    reason: cultural_note
lexical_decisions:
- source_word: וּבֹשׁ
  choice: И … будет посрамлён
  rationale: Глагол בוש здесь выражает итоговый позор и крушение надежд в контексте суда; форма «будет посрамлён» передаёт публичное унижение, не сводя смысл к внутреннему чувству стыда.
- source_word: מוֹאָב
  choice: Моав
  rationale: Устоявшаяся русская передача названия народа и страны; грамматически согласуется как мужской род.
- source_word: מִכְּמוֹשׁ
  choice: из-за Кемоша
  rationale: Предлог מִן после בוש может обозначать то, в связи с чем наступает позор. Эта передача естественно выражает, что упование Моава на Кемоша обернётся для него позором, сохраняя параллель с Вефилем.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Естественно вводит прямое сравнение будущего позора Моава с уже пережитым позором Израиля.
- source_word: בֹּשׁוּ
  choice: был посрамлён
  rationale: Сохраняет лексическую параллель с וּבֹשׁ и передаёт результирующий позор; единственное число естественно при собирательном выражении «дом Израиля».
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Формально сохраняет обычное древнееврейское собирательное обозначение народа с его национально-заветным оттенком.
- source_word: מִבֵּית אֵל
  choice: из-за Вефиля
  rationale: В контексте имеется в виду культовый центр Вефиль, на который полагался Израиль; топоним сохраняет историческую отсылку и параллель с Кемошем.
- source_word: מִבְטֶחָם
  choice: на который он уповал
  rationale: Существительное обозначает предмет или основание доверия. Относительная конструкция ясно связывает его с Вефилем и по-русски звучит естественнее буквального приложения «их упование»; местоимение в единственном числе согласовано с собирательным «дом Израиля».
theological_decisions:
- issue: Значение Вефиля
  choice: Вефиль передан как северный израильский культовый центр, на который полагался Израиль.
  alternative: Понять בֵּית־אֵל как нарицательное «дом Бога».
  rationale: Сопоставление упования Моава на Кемоша с упованием Израиля на Вефиль указывает на исторический культовый центр. Перевод «дом Бога» скрыл бы полемическую отсылку и мог бы ошибочно создать впечатление, что речь идёт об уповании на истинного Бога.
- issue: Характер позора Моава и Израиля
  choice: Использована формулировка «будет/был посрамлён», подчёркивающая крушение религиозного упования и последующий позор.
  alternative: «Устыдится/стыдился», с акцентом на внутреннем переживании.
  rationale: בוש допускает оба оттенка, однако контекст пророческого суда и названные предметы упования поддерживают результирующее значение. Возможная более буквальная передача отмечена в сноске, чтобы не устранить лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «посрамлён» сохраняет риторическую параллель оригинала; конструкция «на который он уповал» делает отношение слова מִבְטֶחָם к Вефилю прозрачным без конфессионального истолкования.
