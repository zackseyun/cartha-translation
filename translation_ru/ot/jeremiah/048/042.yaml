  text: וְ/נִשְׁמַ֥ד מוֹאָ֖ב מֵ/עָ֑ם כִּ֥י עַל יְהוָ֖ה הִגְדִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/042.yaml
  text: And Moab will be destroyed as a people[a], because he magnified himself against Yahweh.
translation:
  language: ru
  text: И Моав будет уничтожен как народ, потому что превознёсся над Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁמַד
  choice: будет уничтожен
  rationale: Нифаль перфекта שׁמד в пророческом контексте передаёт будущее как несомненный итог; пассивная конструкция сохранена без усиления до значения полного истребления.
- source_word: מוֹאָב
  choice: Моав
  rationale: Устоявшаяся русская передача названия народа и страны.
- source_word: מֵעָם
  choice: как народ
  rationale: 'Предлог מִן при עַם обозначает устранение из состояния или категории: Моав перестанет существовать как отдельный народ.'
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину суда; русское «потому что» ясно передаёт причинную связь.
- source_word: עַל
  choice: над
  rationale: В сочетании с הִגְדִּיל выражает направленное против Яхве высокомерное самовозвышение; «превознёсся над» естественно передаёт этот образ по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано транслитерацией, а не заменено титулом.
- source_word: הִגְדִּיל
  choice: превознёсся
  rationale: Хифиль от גדל здесь означает высокомерно возвысить себя. «Превознёсся» сохраняет возвратный смысл и отрицательную оценку контекста.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Характер вины Моава
  choice: превознёсся над Яхве
  alternative: величался против Яхве
  rationale: Формулировка сохраняет направленность горделивого самовозвышения против Бога, не сводя значение лишь к словам хвастовства.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественный пророческий стиль. Синтаксис близок к еврейскому, но естественен для обычного читателя; подлинная образность самовозвышения сохранена.
