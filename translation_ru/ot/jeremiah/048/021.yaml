base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/021.yaml
  text: And judgment has come upon the land of the plateau—upon Holon[a], and upon Jahzah[b], and upon Mephaath—
translation:
  language: ru
  text: И суд пришёл на землю плоскогорья[a] — на Холон, на Яхцу[b] и на Мефаат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
