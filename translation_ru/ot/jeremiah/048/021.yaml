lexical_decisions:
- source_word: וּמִשְׁפָּט
  choice: И пришёл суд
  rationale: «Суд» сохраняет юридический смысл מִשְׁפָּט и в контексте пророчества обозначает уже совершающийся Божий приговор, не сводя его ни к отвлечённой справедливости, ни только к наказанию.
- source_word: בָּא
  choice: пришёл
  rationale: Прошедшее время естественно передаёт qatal; в пророческой речи оно также сохраняет оттенок несомненности возвещённого события.
- source_word: אֶל אֶרֶץ הַמִּישֹׁר
  choice: на землю плоскогорья
  rationale: מִישֹׁר здесь обозначает ровную возвышенную местность Моава; «плоскогорье» точнее передаёт топографию, чем потенциально двусмысленная «равнина».
- source_word: חֹלֹון
  choice: Холон
  rationale: Название города передано транслитерацией, близкой к еврейской форме.
- source_word: יַהְצָה
  choice: Яхца
  rationale: Транслитерация отражает еврейскую форму названия; в косвенном падеже основного текста употреблено «Яхцу».
- source_word: מופעת
  choice: Мефаат
  rationale: Название моавитского города передано современной русской транслитерацией, близкой к еврейскому звучанию.
- source_word: וְעַל
  choice: и на
  rationale: Повтор предлога поддерживает ритм перечня мест, на которые распространяется суд, без ненужного усиления значением «против».
theological_decisions:
- issue: Характер суда
  choice: суд
  alternative: наказание
  rationale: Перевод сохраняет более широкий судебный образ исходного слова и не сужает его до одного последствия приговора.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Начальное «И» и заключительное тире сохраняют связь стиха с окружающим перечнем; топонимы переданы последовательно и без архаизации.
