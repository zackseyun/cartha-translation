  text: וְ/נֶאֶסְפָ֨ה שִׂמְחָ֥ה וָ/גִ֛יל מִ/כַּרְמֶ֖ל וּ/מֵ/אֶ֣רֶץ מוֹאָ֑ב וְ/יַ֨יִן֙ מִ/יקָבִ֣ים הִשְׁבַּ֔תִּי לֹֽא יִדְרֹ֣ךְ הֵידָ֔ד הֵידָ֖ד לֹ֥א הֵידָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/033.yaml
  text: Joy and gladness have been gathered from the orchard land and from the land of Moab[a]; I have made wine cease from the winepresses. No one will tread with a shout[c][b]; the shout is no shout.
translation:
  language: ru
  text: Унесены радость и ликование с плодородной земли и из земли Моава[a]. Я сделал так, что в виноградных давильнях иссякло вино. Никто не будет топтать виноград с возгласом[b]; возглас — не возглас[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с возделанной земли». Еврейское слово здесь означает плодородную, обработанную землю, а не гору Кармил.'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду громкий возглас, которым сопровождали топтание винограда и сбор урожая.
    reason: cultural_note
  - marker: c
    text: 'По-еврейски заключение предельно кратко: «возглас, возглас — не возглас». Вероятно, смысл в том, что ожидаемого радостного крика при сборе винограда больше не слышно; формулировка может также намекать на крик иного рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֶסְפָה
  choice: унесены
  rationale: Нифаль глагола אסף здесь выражает устранение, исчезновение радости. Буквальное «собраны» по-русски могло бы ошибочно означать накопление радости; «унесены» сохраняет образ изъятия и смысл контекста.
- source_word: שִׂמְחָה וָגִיל
  choice: радость и ликование
  rationale: Два близких существительных переданы разными естественными русскими словами; «ликование» сохраняет оттенок открытого праздничного торжества у גיל.
- source_word: כַּרְמֶל
  choice: плодородная земля
  rationale: Здесь כרמל — нарицательное обозначение плодородной, возделанной земли, а не собственное имя Кармил. Выбор достаточно широк и не ограничивает смысл садами или виноградниками.
- source_word: אֶרֶץ מוֹאָב
  choice: земля Моава
  rationale: Сохранено явное географическое существительное «земля».
- source_word: וְיַיִן מִיקָבִים הִשְׁבַּתִּי
  choice: Я сделал так, что в виноградных давильнях иссякло вино
  rationale: Передана каузативная форма הִשְׁבַּתִּי и первое лицо говорящего. Русская конструкция естественно выражает прекращение производства вина, не вводя нового действующего лица.
- source_word: יִדְרֹךְ
  choice: будет топтать виноград
  rationale: В данном сельскохозяйственном контексте подразумевается топтание винограда; явное дополнение необходимо для ясности современному русскому читателю.
- source_word: הֵידָד
  choice: возглас
  rationale: Слово обозначает громкий крик, здесь связанный с топтанием винограда. «Возглас» позволяет естественно сохранить повтор и риторическую игру заключительной фразы.
- source_word: הֵידָד הֵידָד לֹא הֵידָד
  choice: с возгласом; возглас — уже не возглас
  rationale: Сохранены эллиптичность, повтор и напряжённое отрицание еврейского текста; пояснение не внесено в основной текст, чтобы не устранить возможную двусмысленность.
theological_decisions:
- issue: Кто говорит в первом лице в הִשְׁבַּתִּי
  choice: Сохранено прямое «Я» без добавленного наименования говорящего
  alternative: Прямо назвать говорящего Господом
  rationale: В контексте пророческого изречения это речь Господа, однако сам стих содержит лишь форму первого лица. Перевод сохраняет её, не добавляя отсутствующего здесь имени.
- issue: Смысл заключительного отрицания возгласа
  choice: Сохранена эллиптическая формула «возглас — уже не возглас»
  alternative: 'Уточнить: «это не радостный возглас»'
  rationale: Уточнение о радости правдоподобно в контексте сбора винограда, но еврейская формула намеренно кратка и может противопоставлять ожидаемый праздничный крик иному крику. Основной текст не устраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Избегнуты как архаические «точила» и «восклицание», так и разговорные выражения. Синтаксическая резкость последней фразы намеренно сохранена ради еврейской риторики.
