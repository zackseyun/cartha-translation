  yaml_path: translation/ot/jeremiah/048/027.yaml
  text: Was Israel not a laughingstock to you? Was he found among thieves[a], that whenever you spoke of him, you shook your head?
translation:
  language: ru
  text: Разве Израиль не был для тебя посмешищем? Разве его нашли среди воров, что ты всякий раз, говоря о нём, качал головой[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты мотал головой». Еврейский глагол может обозначать покачивание или мотание головой; здесь, вероятно, имеется в виду жест насмешки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂחֹק
  choice: посмешищем
  rationale: Существительное обозначает предмет насмешек; «посмешище» естественно и точно передаёт унизительную публичную насмешку.
- source_word: הָיָה לְךָ
  choice: был для тебя
  rationale: Сохранена конструкция с לְ, выражающая то, чем Израиль являлся в глазах Моава.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Употреблена традиционная русская форма имени; в дальнейшем оно согласуется в мужском роде по нормам русского языка.
- source_word: אִם בְּגַנָּבִים נִמְצָאָה
  choice: Разве его нашли среди воров
  rationale: Сохранён риторический вопрос и образ Израиля, будто обнаруженного в обществе преступников; «нашли» не усиливает значение до однозначного «поймали».
- source_word: כִּי מִדֵּי
  choice: что всякий раз, когда
  rationale: Передана связь со следующим повторявшимся действием без превращения כִּי в отдельное причинное утверждение.
- source_word: דְבָרֶיךָ בּוֹ
  choice: когда ты говорил о нём
  rationale: Идиома передана нейтрально как речь об Израиле; возможный в контексте враждебный оттенок не внесён прямо в текст.
- source_word: תִּתְנוֹדָד
  choice: ты качал головой
  rationale: В контексте насмешки глагол, обозначающий колебательное или покачивающее движение, вероятно описывает презрительный жест; конкретизация отмечена сноской.
