  text: מִ/בְּכִ֨י יַעְזֵ֤ר אֶבְכֶּה לָּ/ךְ֙ הַ/גֶּ֣פֶן שִׂבְמָ֔ה נְטִֽישֹׁתַ֨יִ/ךְ֙ עָ֣בְרוּ יָ֔ם עַ֛ד יָ֥ם יַעְזֵ֖ר נָגָ֑עוּ עַל קֵיצֵ֥/ךְ וְ/עַל בְּצִירֵ֖/ךְ שֹׁדֵ֥ד נָפָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/032.yaml
  text: With the weeping of Jazer I weep for you[a], vine of Sibmah; your branches crossed the sea; they reached as far as Jazer[c][b]. Upon your summer fruit and upon your grape harvest the destroyer has fallen.
translation:
  language: ru
  text: С плачем Иазера я плачу о тебе[a], виноградная лоза Сивмы! Твои побеги простёрлись за море; они достигли моря Иазера[b]. На твои летние плоды и на сбор твоего винограда обрушился опустошитель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Больше, чем плачем Иазера, я плачу о тебе»; начальный предлог может иметь сравнительное значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по еврейскому тексту: «они достигли моря Иазера». Иазер находился вдали от моря, поэтому выражение понимают как поэтическую гиперболу; другие предполагают исправление текста: «они достигли Иазера».'
    reason: textual_variant
lexical_decisions:
- source_word: מִבְּכִי
  choice: С плачем
  rationale: Предлог מִ при בְּכִי допускает трудную для однозначного истолкования связь — сопутствие или сравнение. Основной текст передаёт поэтическое соединение двух плачей, не устраняя возможного сравнительного оттенка, который отмечен в сноске.
- source_word: אֶבְכֶּה לָּךְ
  choice: я плачу о тебе
  rationale: Имперфект в контексте поэтического плача естественно передан настоящим временем; לְ обозначает объект оплакивания.
- source_word: הַגֶּפֶן שִׂבְמָה
  choice: виноградная лоза Сивмы
  rationale: Сохранены обращение и метафорический образ города как виноградной лозы; восклицательный знак делает звательную функцию ясной по-русски.
- source_word: נְטִישֹׁתַיִךְ
  choice: твои побеги
  rationale: Слово обозначает раскинувшиеся отростки лозы; «побеги» точнее сохраняет виноградарский образ, чем общее «ветви».
- source_word: עָבְרוּ יָם
  choice: простёрлись за море
  rationale: Глагол עבר буквально выражает переход через море, а применительно к побегам лозы естественное русское «простёрлись за море» сохраняет гиперболический образ распространения.
- source_word: עַד יָם יַעְזֵר נָגָעוּ
  choice: они достигли моря Иазера
  rationale: Перевод следует консонантному масоретскому тексту и не вносит предполагаемую эмендацию, несмотря на географическую трудность выражения.
- source_word: קֵיצֵךְ
  choice: твои летние плоды
  rationale: קֵיץ обозначает созревающие летом плоды или летний урожай; выбран буквальный и понятный образ.
- source_word: בְּצִירֵךְ
  choice: сбор твоего винограда
  rationale: בָּצִיר — именно сбор винограда; формулировка ясна современному читателю и отличает его от летних плодов.
- source_word: שֹׁדֵד נָפָל
  choice: обрушился опустошитель
  rationale: שֹׁדֵד называет разорителя или опустошителя, а נפל с עַל рисует внезапно обрушившееся бедствие. Порядок слов сделан естественным для русского языка.
theological_decisions:
- issue: Следует ли исправлять трудное выражение «море Иазера»
  choice: Сохранить масоретское чтение «они достигли моря Иазера» в основном тексте
  alternative: 'Перевести по предполагаемому исправлению: «они достигли Иазера»'
  rationale: Так сохраняется засвидетельствованный еврейский текст и его подлинная географическая или поэтическая трудность, а conjectural resolution не вводится без обозначения.
- issue: Сопутствующий или сравнительный смысл начального מִ
  choice: В основном тексте передать «С плачем Иазера»
  alternative: «Сильнее, чем об Иазере» или «Больше, чем плачут об Иазере»
  rationale: Еврейская конструкция неоднозначна. Основной вариант сохраняет связь плачей без чрезмерного уточнения, а сравнительное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной лексикой пророческого плача. Сохранены параллелизм, образ лозы и резкая персонификация разорения; архаические «винтаж», «губитель» и искусственная буквальность избегаются.
