lexical_decisions:
- source_word: אוֹי לְךָ
  choice: Горе тебе
  rationale: Устойчиво передаёт возглас скорби и суда; сохраняет силу пророческой речи.
- source_word: מוֹאָב
  choice: Моав
  rationale: Традиционная русская передача географического и этнического имени.
- source_word: אָבַד
  choice: погиб
  rationale: Передаёт завершившуюся гибель собирательного субъекта, не добавляя явно выраженного деятеля.
- source_word: עַם כְּמוֹשׁ
  choice: народ Хамоса
  rationale: Формально передаёт еврейскую сопряжённую конструкцию и связь Моава с его национальным божеством.
- source_word: כִּי
  choice: ведь
  rationale: Естественно вводит основание предшествующего возгласа и утверждения.
- source_word: לֻקְּחוּ בָנֶיךָ בַּשֶּׁבִי
  choice: твоих сыновей увели в плен
  rationale: Передаёт пассивный смысл и состояние плена естественной современной русской конструкцией, не называя захватчиков.
- source_word: וּבְנֹתֶיךָ בַּשִּׁבְיָה
  choice: и твоих дочерей — в неволю
  rationale: Сохраняет параллелизм сыновей и дочерей, а близкозначное «неволю» отражает небольшое лексическое варьирование еврейского текста.
theological_decisions:
- issue: Связь Моава с Хамосом
  choice: народ Хамоса
  alternative: народ, принадлежащий Хамосу
  rationale: Краткая сопряжённая конструкция сохраняет принадлежность или посвящённость, выраженную оригиналом, не уточняя характер этой связи и не сглаживая полемический смысл.
translation_notes:
  register: Современный литературный русский язык с dignified пророческой интонацией. Традиционные библейские имена сохранены; синтаксис сделан понятным обычному читателю без устранения поэтического параллелизма.
