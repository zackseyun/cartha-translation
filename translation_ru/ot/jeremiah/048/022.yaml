base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/022.yaml
  text: and against Dibon[a], and against Nebo, and against Beth-diblathaim—
translation:
  language: ru
  text: и на Дивон, и на Нево, и на Бет-Дивлатаим[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможная передача: «Бет-Дивлатайим»; окончание еврейского названия можно транслитерировать более явно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: и на
  rationale: Повторяющееся сочетание союза וְ с предлогом עַל продолжает перечень мест, на которые обрушивается суд. В данном контексте русское «и на» естественно связывает стих с предыдущей фразой и сохраняет анафорический повтор.
- source_word: דִּיבוֹן
  choice: Дивон
  rationale: Географическое название передано принятой русской транслитерацией, без перевода.
- source_word: נְבוֹ
  choice: Нево
  rationale: Здесь слово обозначает город в Моаве, поэтому передано как географическое название, без истолкования возможных иных ассоциаций имени.
- source_word: בֵּית דִּבְלָתַיִם
  choice: Бет-Дивлатаим
  rationale: Составное географическое название транслитерировано; первый элемент בֵּית не переведён как «дом», поскольку всё сочетание функционирует как имя собственное. Дефис наглядно передаёт составной характер названия.
