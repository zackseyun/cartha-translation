  yaml_path: translation/ot/jeremiah/048/017.yaml
  text: 'Mourn for him[a], all you around him, and all who know his name, say: “How the mighty scepter is broken[c][b], the staff of splendor!”'
translation:
  language: ru
  text: 'Оплачьте его[a], все, кто вокруг него, и все, кто знает его имя[b]. Скажите: «Как сломлен жезл силы, посох славы[c]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Покачайте головами над ним» или «Скорбите о нём»; еврейский глагол может обозначать плач и скорбь, порой выражаемые покачиванием головы.'
    reason: lexical_alternative
  - marker: b
    text: «Знает его имя» может также означать «знает о его славе» или «знает его репутацию».
    reason: lexical_alternative
  - marker: c
    text: Еврейские слова могут означать «жезл», «скипетр», «посох» или «палка»; этот образ, вероятно, выражает ныне сокрушённые могущество и славу Моава.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻדוּ לּוֹ
  choice: Посочувствуйте ему
  rationale: Императив נוד с ל может призывать к участливому выражению скорби, иногда сопровождаемому покачиванием головы. «Посочувствуйте» естественно передаёт обращённый к окружающим призыв, не сводя значение только к физическому жесту.
- source_word: כָּל סְבִיבָיו
  choice: все, кто вокруг него
  rationale: Сохраняет обращение ко всем окружающим Моав и мужской род персонифицированного Моава.
- source_word: וְכֹל יֹדְעֵי שְׁמוֹ
  choice: и все, кто знает его имя
  rationale: 'Буквальная формулировка сохраняет возможную двусмысленность שֵׁם: имя либо известность и слава.'
- source_word: אֵיכָה נִשְׁבַּר
  choice: Как сломан
  rationale: «Как» сохраняет форму скорбного восклицания, а краткое страдательное причастие передаёт совершившееся разрушение и его нынешний результат.
- source_word: מַטֵּה עֹז
  choice: могучий жезл
  rationale: מַטֶּה обозначает посох, жезл или скипетр; в образе могущества Моава «жезл» естественно соединяет представления о силе и власти. עֹז передано прилагательным «могучий».
- source_word: מַקֵּל תִּפְאָרָה
  choice: великолепный посох
  rationale: מַקֵּל — посох или палка, а תִּפְאָרָה — великолепие, слава, красота. Прилагательное даёт естественную русскую поэтическую строку и сохраняет параллелизм с «могучим жезлом».
