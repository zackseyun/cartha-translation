  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה הִנֵּ֥ה כַ/נֶּ֖שֶׁר יִדְאֶ֑ה וּ/פָרַ֥שׂ כְּנָפָ֖י/ו אֶל מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/040.yaml
  text: 'For thus says the LORD: Look, like an eagle he swoops down and spreads his wings over Moab.'
translation:
  language: ru
  text: 'Ибо так говорит ГОСПОДЬ: «Вот, он летит, как орёл, и расправляет крылья над Моавом».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Ибо так говорит
  rationale: Сохраняет причинно-пояснительное כִּי и обычную пророческую формулу כֹה אָמַר.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Передаёт тетраграмматон принятой в русской библейской традиции формой, выделенной прописными буквами.
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-привлекающую внимание функцию частицы без отдельной сноски.
- source_word: כַנֶּשֶׁר
  choice: как орёл
  rationale: נֶשֶׁר здесь обозначает крупную хищную птицу; «орёл» естественно соответствует образу налетающего завоевателя.
- source_word: יִדְאֶה
  choice: парит
  rationale: Глагол דאה описывает полёт или парение; выбор не добавляет отсутствующее в еврейском тексте направление «вниз».
- source_word: וּפָרַשׂ כְּנָפָיו
  choice: и расправляет крылья
  rationale: Прямо передаёт образ раскрывания или простирания крыльев.
- source_word: אֶל מוֹאָב
  choice: над Моавом
  rationale: В контексте распростёртых крыльев русское «над» естественно выражает направленность на Моав, не устраняя угрожающего образа.
theological_decisions:
- issue: Личность того, кто летит подобно орлу
  choice: Сохранено местоимение «он» без уточнения личности
  alternative: «враг» или имя конкретного завоевателя
  rationale: Еврейский текст не называет действующее лицо в самом стихе; добавление конкретизации преждевременно разрешило бы референциальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис остаётся ясным для широкого читателя; образность и неоднозначность исходного текста сохранены.
