  text: תְּנוּ צִ֣יץ לְ/מוֹאָ֔ב כִּ֥י נָצֹ֖א תֵּצֵ֑א וְ/עָרֶ֨י/הָ֙ לְ/שַׁמָּ֣ה תִֽהְיֶ֔ינָה מֵ/אֵ֥ין יוֹשֵׁ֖ב בָּ/הֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/009.yaml
  text: Give a wing to Moab[a], for she will surely flee away; and her cities will become a desolation[b], with no inhabitant in them.
translation:
  language: ru
  text: Дайте Моаву крыло[a], ибо он непременно уйдёт; его города станут запустением, и никто не будет жить в них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дайте Моаву цветок (или розетку)». Еврейское слово צִיץ чаще означает «цветок» или «украшение»; в данном контексте его также можно понимать как «крыло», хотя последующий глагол буквально означает «уйдёт» или «выйдет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Дайте
  rationale: Форма повелительного наклонения во множественном числе передана прямо и естественно.
- source_word: צִיץ
  choice: крыло
  rationale: Хотя обычно слово означает «цветок», «соцветие» или украшение, в данном контексте образ крыла лучше связан с последующим уходом Моава; единственное число оригинала сохранено.
- source_word: לְמוֹאָב
  choice: Моаву
  rationale: Дательный падеж естественно передаёт значение предлога ל при глаголе «дать».
- source_word: נָצֹא תֵּצֵא
  choice: он непременно улетит
  rationale: Сочетание инфинитива абсолютного с личной формой выражает усиление. «Улетит» поддерживает образ крыла, хотя базовое значение глагола — «выйти, уйти».
- source_word: וְעָרֶיהָ
  choice: его города
  rationale: Местоименный суффикс согласуется в еврейском с грамматически женским образом Моава; в русском название «Моав» мужского рода, поэтому употреблено «его».
- source_word: לְשַׁמָּה תִהְיֶינָה
  choice: станут пустыней
  rationale: Результативная конструкция выражает превращение городов в опустошённое место; «пустыней» звучит естественно и сохраняет пророческую образность.
- source_word: מֵאֵין יוֹשֵׁב בָּהֵן
  choice: никто не будет жить в них
  rationale: Естественная современная формулировка, точно передающая полное отсутствие жителей.
