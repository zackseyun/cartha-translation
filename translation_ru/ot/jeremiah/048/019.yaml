  text: אֶל דֶּ֛רֶךְ עִמְדִ֥י וְ/צַפִּ֖י יוֹשֶׁ֣בֶת עֲרוֹעֵ֑ר שַׁאֲלִי נָ֣ס וְ/נִמְלָ֔טָה אִמְרִ֖י מַה נִּֽהְיָֽתָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/019.yaml
  text: Stand by the road and watch, inhabitant of Aroer; ask the man who flees and the woman who escapes, “What has happened?”
translation:
  language: ru
  text: 'Встань у дороги и смотри, жительница Ароэра! Спроси бегущего и спасшуюся: «Что случилось?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִמְדִי וְצַפִּי
  choice: Встань у дороги и смотри
  rationale: Женские формы повелительного наклонения согласованы с олицетворённым городом; צפה передано естественным «смотри» в значении наблюдения за дорогой.
- source_word: יוֹשֶׁבֶת עֲרוֹעֵר
  choice: жительница Ароэра
  rationale: Причастие женского рода в единственном числе сохранено; обращение может олицетворять население или сам город.
- source_word: נָס וְנִמְלָטָה
  choice: бегущего и спасшуюся
  rationale: 'Сохранено различие рода исходных форм: נָס — мужской род, נִמְלָטָה — женский; второе слово обозначает ту, которой удалось спастись или вырваться.'
- source_word: מַה נִּהְיָתָה
  choice: Что случилось?
  rationale: Естественная русская передача вопроса о происшедшем; форма נִהְיָתָה отражает случившееся событие.
