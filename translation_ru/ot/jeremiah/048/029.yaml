- from: Мы слышали о гордыне Моава — как же он горд! — о его надменности, гордости, высокомерии и превозношении его сердца.[a]
  to: Мы слышали о гордыне Моава — он чрезвычайно горд — о его надменности, гордости, высокомерии и высокомерии его сердца.[a]
  rationale: Заменено экспрессивное «как же он горд!» на нейтральное усиленное утверждение, соответствующее גֵּאֶה מְאֹד. «Превозношение его сердца» заменено на естественное «высокомерие его сердца». Сноска исправлена так, чтобы предлагать более буквальные образы высоты без неестественного выражения «высокое сердце».
