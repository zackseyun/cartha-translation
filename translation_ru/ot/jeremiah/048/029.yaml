base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/029.yaml
  text: We have heard of the pride of Moab—he is exceedingly proud—of his haughtiness[a], his pride, his arrogance, and the loftiness of his heart.
translation:
  language: ru
  text: Мы слышали о гордыне Моава — он чрезвычайно горд — о его надменности, гордости, высокомерии и высокомерии его сердца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мы слышали о гордыне Моава — он чрезвычайно горд — о его возвышении, гордости, высокомерии и высоте его сердца».'
    reason: Лексически более буквальная передача образов высоты в גָּבְהוֹ и רֻם לִבּוֹ.
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: Мы слышали
  rationale: Перфект 1-го лица множественного числа передаёт уже полученное и известное свидетельство; в русском контексте естественно звучит прошедшее совершенного вида.
- source_word: גְאוֹן מוֹאָב
  choice: о гордыне Моава
  rationale: В контексте суда גְאוֹן означает не нейтральное величие, а предосудительную гордость; «гордыня» ясно передаёт отрицательную оценку.
- source_word: גֵּאֶה מְאֹד
  choice: как же он горд!
  rationale: Естественная русская передача усиленного прилагательного с מְאֹד, сохраняющая отдельное эмфатическое замечание о Моаве.
- source_word: גָּבְהוֹ
  choice: о его надменности
  rationale: Буквальная идея высоты здесь метафорически обозначает заносчивость; «надменность» сохраняет нравственно отрицательный смысл.
- source_word: וּגְאוֹנוֹ
  choice: гордости
  rationale: Повтор близкой лексики сохранён, поскольку еврейский текст намеренно нагнетает ряд обозначений гордыни.
- source_word: וְגַאֲוָתוֹ
  choice: высокомерии
  rationale: Передаёт ещё один оттенок того же смыслового поля, не сводя накопительный ряд к одному слову.
- source_word: וְרֻם לִבּוֹ
  choice: превозношении его сердца
  rationale: Сохраняет образ возвышения и слово «сердце», при этом по-русски ясно выражает внутреннюю заносчивость.
