  text: and against Kerioth[a], and against Bozrah, and against all the cities of the land of Moab, far and near.
translation:
  language: ru
  text: и против Кериота, и против Боцры, и против всех городов земли Моава — дальних и близких[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдалённых и близлежащих»; имеются в виду все города Моава без исключения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: и против
  rationale: Повторяющийся предлог עַל с союзом וְ вводит очередные объекты направленного против них суда; «и против» естественно передаёт это значение по-русски и сохраняет анафору.
- source_word: קְרִיּוֹת
  choice: Кериота
  rationale: В данном перечне это название города; форма родительного падежа обусловлена предлогом «против». Название передано транслитерацией, а не переведено как нарицательное «города».
- source_word: בָּצְרָה
  choice: Боцры
  rationale: Это моавитский топоним; форма родительного падежа обусловлена предлогом «против». Передача «Боцра» близко отражает еврейское звучание.
- source_word: כָּל עָרֵי אֶרֶץ מוֹאָב
  choice: всех городов земли Моава
  rationale: Сохранена структура еврейской сопряжённой цепочки; по-русски выражение звучит естественно и ясно.
- source_word: הָרְחֹקוֹת וְהַקְּרֹבוֹת
  choice: дальних и близких
  rationale: Прилагательные женского рода множественного числа относятся к городам и образуют меризм, охватывающий все города без исключения. Русские формы согласованы с родительным падежом слова «городов».
theological_decisions: []
