    reason: lexical_alternative
lexical_decisions:
- source_word: אֲיֵלִיל
  choice: буду рыдать
  rationale: Форма глагола ילל обозначает громкое скорбное причитание. «Буду рыдать» естественно звучит по-русски и сохраняет силу выражения.
- source_word: אֶזְעָק
  choice: вопить
  rationale: Глагол זעק передаёт громкий крик, часто вызванный бедствием. «Вопить» сохраняет отличие от «рыдать» и соответствует контексту плача.
- source_word: כֻּלֹּה
  choice: обо всём
  rationale: В сочетании с «Моавом» слово охватывает весь народ или всю страну; форма «обо всём Моаве» передаёт собирательный смысл.
- source_word: אֶל
  choice: о
  rationale: В контексте плача предлог указывает на тех, о ком скорбят. Русское «о» естественно сочетается с глаголом «стонет».
- source_word: אַנְשֵׁי קִיר חֶרֶשׂ
  choice: жителях Кир-Хереса
  rationale: Конструкция אַנְשֵׁי с названием города естественно означает его жителей. «Жители» в современном русском точнее и естественнее буквального, но здесь двусмысленного «мужчины».
- source_word: יֶהְגֶּה
  choice: кто-то стонет
  rationale: Глагол הגה может обозначать тихий скорбный звук, стон или сетование. Еврейская форма стоит в третьем лице единственного числа, но её субъект не назван; «кто-то» сохраняет эту неопределённость, не отождествляя говорящего с субъектом.
theological_decisions:
- issue: Неопределённый субъект заключительного глагола
  choice: кто-то стонет
  alternative: я стону; он стонет; стонут
  rationale: Масоретский текст имеет третье лицо единственного числа без явного подлежащего, тогда как предшествующие глаголы стоят в первом лице. Перевод не исправляет это напряжение молча и отмечает возможные понимания в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной лексикой плача. Повтор «Моаве» сохранён как риторическая черта оригинала; неясность субъекта последнего глагола не устранена.
