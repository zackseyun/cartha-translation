  yaml_path: translation/ot/jeremiah/048/047.yaml
  text: Yet I will restore the fortunes of Moab in the latter days[a], declares Yahweh. Thus far is the judgment of Moab.
translation:
  language: ru
  text: Но в последние дни Я восстановлю благополучие Моава[a], — возвещает Яхве. На этом завершается суд над Моавом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верну Моава из плена». Еврейское выражение может означать как возвращение из плена, так и более широкое восстановление благополучия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי שְׁבוּת
  choice: Но... Я восстановлю благополучие
  rationale: Устойчивое сочетание с שוב выражает возвращение из плена или, шире, восстановление прежнего благополучия. «Но» естественно передаёт контекстуальный переход от суда к обещанию восстановления.
- source_word: מוֹאָב
  choice: Моав
  rationale: Традиционная русская передача названия народа и страны.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: в последние дни
  rationale: Сохраняет временную открытость и возможный эсхатологический оттенок еврейского выражения, не уточняя его сверх сказанного в стихе.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная и естественная для современного русского языка передача пророческой формулы; имя יהוה передано как «Яхве».
- source_word: עַד הֵנָּה
  choice: На этом завершается
  rationale: В данном месте формула отмечает конец пророчества о Моаве; функциональная передача яснее буквального «до сих пор».
- source_word: מִשְׁפַּט מוֹאָב
  choice: суд над Моавом
  rationale: Здесь מִשְׁפַּט обозначает вынесенный Моаву судебный приговор и связанное с ним пророчество, а не отвлечённую справедливость.
theological_decisions:
- issue: Характер и время обещанного восстановления Моава
  choice: Передать как подлинное обещание будущего восстановления, сохранив выражение «в последние дни».
  alternative: Истолковать исключительно как политическое возвращение из плена либо как однозначно эсхатологическое принятие народов.
  rationale: Стих обещает Моаву восстановление, но не определяет его механизм и полный богословский смысл; перевод не должен устранять эту открытость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан ясным для обычного читателя; формула окончания раздела передана функционально.
