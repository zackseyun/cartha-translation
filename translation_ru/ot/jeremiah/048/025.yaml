source:
  edition: WLC
  text: נִגְדְּעָה֙ קֶ֣רֶן מוֹאָ֔ב וּ/זְרֹע֖/וֹ נִשְׁבָּ֑רָה נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/025.yaml
  text: The horn of Moab is cut off[a], and his arm is broken, declares Yahweh.
translation:
  language: ru
  text: Отсечён рог Моава[a], и рука его сломлена, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Рог» и «рука» — образы силы и могущества.
    reason: Пояснение сохранённых древнееврейских метафор.
lexical_decisions:
- source_word: נִגְדְּעָה
  choice: отсечён
  rationale: Нифаль от גדע означает «быть отсечённым, срубленным». «Отсечён» естественно сочетается с образом рога и передаёт устранение силы.
- source_word: קֶרֶן
  choice: рог
  rationale: Сохранён буквальный поэтический образ; в пророческой речи рог символизирует силу и могущество.
- source_word: מוֹאָב
  choice: Моав
  rationale: Традиционная русская форма названия народа и страны.
- source_word: וּזְרֹעוֹ
  choice: и рука его
  rationale: זְרוֹעַ буквально означает «рука» и метафорически обозначает силу или могущество. Мужской суффикс сохранён в соответствии с олицетворением Моава.
- source_word: נִשְׁבָּרָה
  choice: сломлена
  rationale: Нифаль от שבר означает «быть сломанным». Форма «сломлена» сохраняет пассивную конструкцию и возвышенный поэтический регистр.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — торжественная пророческая формула, здесь естественно переданная глаголом «возвещает»; тетраграмматон передан личным именем «Яхве».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон; форма «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Толкование образов рога и руки
  choice: Сохранить метафоры в основном тексте и пояснить их в сноске
  alternative: Передать прямо как «сила» и «могущество»
  rationale: Образы ясны в контексте параллелизма и принадлежат поэтической форме оригинала; пояснение позволяет не сводить образность к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены параллелизм, олицетворение Моава и телесные метафоры оригинала.
