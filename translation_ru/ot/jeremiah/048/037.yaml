base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/037.yaml
  text: For every head is bald[a], and every beard is cut off; on all the hands are gashes[b], and on the waist is sackcloth.
translation:
  language: ru
  text: Ведь каждая голова обрита, и каждая борода острижена; на всех руках — порезы[a], а на поясе — рубище[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на каждой руке — надрезы». Древнееврейское выражение может подразумевать также предплечья, покрытые траурными порезами.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на чреслах». Имеется в виду рубище, обёрнутое вокруг пояса, в знак скорби.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт объяснительно-причинную связь с предшествующим плачем естественным современным русским союзом.
- source_word: כָל רֹאשׁ קָרְחָה
  choice: каждая голова обрита
  rationale: В контексте траура קָרְחָה обозначает плешь или обривание головы; результативная формулировка сохраняет образ намеренного траурного знака, не утяжеляя русский текст.
- source_word: וְכָל זָקָן גְּרֻעָה
  choice: и каждая борода острижена
  rationale: Глагольная форма от גרע выражает уменьшение или удаление; «острижена» естественно передаёт обрезание бороды как знак скорби, не утверждая непременно полное сбривание.
- source_word: עַל כָּל יָדַיִם גְּדֻדֹת
  choice: на всех руках — порезы
  rationale: גְּדֻדֹת — ритуальные надрезы или порезы в знак траура. «На всех руках» близко следует древнееврейскому выражению; примечание отмечает возможный более широкий охват рук и предплечий.
- source_word: וְעַל מָתְנַיִם שָׂק
  choice: а на бёдрах — рубище
  rationale: מָתְנַיִם обозначает область чресел, поясницы или бёдер; «на бёдрах» сохраняет телесный образ и сочетается с надетым в знак скорби рубищем. שָׂק передано традиционным и понятным библейским словом «рубище».
