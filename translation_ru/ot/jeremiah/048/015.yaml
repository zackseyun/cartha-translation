base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/015.yaml
  text: Moab is devastated[a], and her cities have gone up; the choicest of her young men have gone down to the slaughter, declares the King[b], whose name is Yahweh of Armies.
translation:
  language: ru
  text: Моав разорён, и на его города совершено нападение[a]; лучшие из его юношей сошли на заклание, — возвещает Царь, имя которому — Яхве Воинств[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст краток и синтаксически труден: буквально «и на его города поднялся [кто-то]». Вероятно, речь идёт о нападающем, выступившем против городов Моава.'
    reason: alternative_reading
  - marker: b
    text: 'Традиционно: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁדַּד
  choice: разорён
  rationale: Пуаль глагола שׁדד обозначает насильственное опустошение или разграбление. «Разорён» естественно передаёт итог бедствия, не сводя смысл только к захвату добычи.
- source_word: וְעָרֶיהָ עָלָה
  choice: и на его города поднялся враг
  rationale: 'Еврейская конструкция предельно сжата: глагол עלה стоит в мужском роде единственного числа, тогда как «города» — во множественном. Поэтому подразумеваемым подлежащим, вероятнее всего, является нападающий. Слово «враг» добавлено для ясности, а неоднозначность отмечена в сноске.'
- source_word: מִבְחַר בַּחוּרָיו
  choice: лучшие из его юношей
  rationale: מִבְחַר указывает на отборное, лучшее, а בַּחוּרָיו — на молодых мужчин Моава. Конструкция «лучшие из» звучит естественно и сохраняет выделительный смысл.
- source_word: יָרְדוּ לַטָּבַח
  choice: сошли на убой
  rationale: «Сошли» сохраняет образ движения вниз в ירד, а «на убой» кратко и сильно передаёт предназначенную им насильственную смерть.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт устойчивую пророческую формулу как торжественное авторитетное изречение, оставаясь понятным современному читателю.
- source_word: הַמֶּלֶךְ
  choice: Царь
  rationale: В сочетании с последующим Божьим именем слово выступает как божественный титул; прописная буква отражает эту функцию.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: «Яхве» передаёт личное имя יהוה, не заменяя его титулом. «Воинств» сохраняет широкий военный и небесный смысл צְבָאוֹת и звучит по-русски торжественно.
- source_word: שְׁמוֹ
  choice: имя которому
  rationale: Так номинальная формула естественно связывается по-русски с предшествующим титулом «Царь».
theological_decisions:
- issue: Передача Божьего имени יהוה в титуле יהוה צבאות
  choice: Яхве Воинств
  alternative: Господь Саваоф
  rationale: В тексте стоит собственное имя יהוה, поэтому оно передано как «Яхве». צבאות переведено смысловым словом «Воинств», а традиционная русская форма приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены образы движения («поднялся», «сошли») и резкость приговора; неясная синтаксическая конструкция разъяснена минимально и отмечена сноской.
