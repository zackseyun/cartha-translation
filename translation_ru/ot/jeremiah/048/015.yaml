review_pass:
  verdict: revise
  source_fidelity: 'Основной текст преждевременно определяет невыраженное в еврейском тексте подлежащее как «враг». В וְעָרֶיהָ עָלָה глагол стоит в ед. числе, а конструкция синтаксически сжата и допускает разные объяснения; перевод не должен представлять один из них как бесспорный. Остальные смысловые элементы переданы верно: опустошение Моава, отборные юноши, нисхождение на смерть и божественная формула сохранены.'
  naturalness: «Разорён», «лучшие из его юношей», «возвещает Царь» и «Яхве Воинств» соответствуют современному литературному русскому и торжественному пророческому регистру. «Совершено нападение» позволяет по-русски передать военный смысл трудной конструкции без введения конкретного действующего лица. «Сошли на заклание» естественнее в данном высоком регистре, чем разговорно-прикладное «сошли на убой».
  terminology: «Яхве Воинств» точно передаёт יהוה צבאות и согласуется с принятой передачей Тетраграмматона. «Царь» уместно с прописной буквы как божественный титул. Традиционная форма «Господь Саваоф» может быть сохранена в сноске как лексическая альтернатива.
