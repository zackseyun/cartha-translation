- from: Моав разорён, и на его города поднялся враг[a]; лучшие из его юношей сошли на убой, — возвещает Царь, имя которому — Яхве Воинств[b].
  to: Моав разорён, и на его города совершено нападение[a]; лучшие из его юношей сошли на заклание, — возвещает Царь, имя которому — Яхве Воинств[b].
  rationale: Исправление устраняет неоправданное введение конкретного «врага» и уточняет сноску, сохраняя вероятный военный смысл, но не снимая неоднозначности исходной конструкции. Замена «на убой» на «на заклание» поддерживает образность ירדו לטבח и высокий литературный регистр, не меняя смысла.
