source:
  edition: WLC
  text: וְ/יָבֹ֨א שֹׁדֵ֜ד אֶל כָּל עִ֗יר וְ/עִיר֙ לֹ֣א תִמָּלֵ֔ט וְ/אָבַ֥ד הָ/עֵ֖מֶק וְ/נִשְׁמַ֣ד הַ/מִּישֹׁ֑ר אֲשֶׁ֖ר אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/008.yaml
  text: And the destroyer will come against every city[a], and no city will escape; the valley will perish, and the plain will be destroyed, as Yahweh has said.
translation:
  language: ru
  text: Опустошитель придёт в каждый город, и ни один город не спасётся; долина погибнет, и плоскогорье[a] будет уничтожено, как сказал Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «равнина», «равнинная возвышенность». Еврейское слово обозначает ровную местность и в Моаве может относиться к возвышенному плато.'
    reason: Лексическая и географическая неоднозначность слова הַמִּישֹׁר.
lexical_decisions:
- source_word: שֹׁדֵד
  choice: опустошитель
  rationale: Причастие, употреблённое как существительное, обозначает того, кто разоряет и опустошает; этот вариант естественен в современном русском языке и подходит к контексту суда.
- source_word: וְיָבֹא
  choice: придёт
  rationale: Префиксальная форма в пророческой речи передана будущим временем, сохраняющим предсказательный смысл.
- source_word: אֶל כָּל עִיר
  choice: в каждый город
  rationale: Предлог אֶל обозначает направленное движение; в сочетании с «опустошителем» русский оборот ясно подразумевает вражеское вторжение, не перегружая перевод толкованием.
- source_word: וְעִיר לֹא תִמָּלֵט
  choice: и ни один город не спасётся
  rationale: Единственное число после распределительного выражения имеет обобщающий смысл; русский вариант естественно передаёт всеобщность бедствия.
- source_word: הָעֵמֶק
  choice: долина
  rationale: Обычное значение עֵמֶק; определённость может указывать на долинную область Моава.
- source_word: וְאָבַד
  choice: погибнет
  rationale: Глагол выражает гибель или разорение; «погибнет» сохраняет краткость и силу пророческой речи.
- source_word: הַמִּישֹׁר
  choice: плоскогорье
  rationale: Слово обозначает ровную местность и применительно к Моаву может называть возвышенную равнинную область; «плоскогорье» отличает её от упомянутой долины.
- source_word: וְנִשְׁמַד
  choice: будет уничтожено
  rationale: Нифаль глагола שׁמד выражает подвергание уничтожению; страдательная конструкция точно передаёт форму и смысл оригинала.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: как сказал Яхве
  rationale: Оборот передаёт формулу подтверждения пророчества Божьим словом, а личное имя יְהוָה сохраняется как «Яхве».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Синтаксический параллелизм оригинала сохранён; архаизмы и конфессионально окрашенные добавления исключены.
