base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/039.yaml
  text: How shattered she is! Wail! How Moab has turned her back in shame! So Moab has become a laughingstock and a horror to all around her[a][b].
translation:
  language: ru
  text: Как сокрушён Моав! Рыдайте! Как он, устыдившись, отступил[b]! Моав стал посмешищем и предметом ужаса для всех вокруг него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зрелищем, вызывающим потрясение»; возможен также смысл «предметом смятения».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «повернул затылок» (тыльную сторону шеи); этот еврейский оборот выражает отступление или уход в стыде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Как
  rationale: Сохраняет восклицательный характер плача и естественно звучит в современной русской поэтической прозе.
- source_word: חַתָּה
  choice: сокрушён
  rationale: Передаёт гибельный слом и крушение Моава; не сводит значение лишь к психологическому смятению.
- source_word: הֵילִילוּ
  choice: Рыдайте
  rationale: Форма множественного числа передаёт обращённый к присутствующим призыв к громкому плачу.
- source_word: הִפְנָה עֹרֶף
  choice: обратился в бегство
  rationale: Естественно передаёт буквальный образ повёрнутого затылка, то есть позорное отступление; буквальность отмечена в сноске.
- source_word: מוֹאָב
  choice: Моав
  rationale: Традиционная русская передача топонима и названия народа; грамматически согласуется как мужской род.
- source_word: בּוֹשׁ
  choice: постыдно
  rationale: Передаёт состояние позора, сопровождающее отступление, и естественно соединяется с русским оборотом «обратился в бегство».
- source_word: וְהָיָה
  choice: стал
  rationale: Передаёт наступившее в результате суда состояние, ярко изображённое как уже совершившееся.
- source_word: לִשְׂחֹק
  choice: посмешищем
  rationale: Точно и идиоматично обозначает объект насмешек.
- source_word: לִמְחִתָּה
  choice: ужасом
  rationale: Сохраняет широкое значение бедствия или зрелища, вызывающего ужас и потрясение; возможная смысловая альтернатива указана в сноске.
- source_word: לְכָל סְבִיבָיו
  choice: для всех, кто вокруг него
  rationale: Не сужает значение до соседних народов и сохраняет мужское местоименное согласование еврейского текста.
