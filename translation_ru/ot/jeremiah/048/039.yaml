  rationale: Редакция убирает неоправданное уточнение «в бегство», сохраняя смысл позорного отступления и поясняя буквальный образ в сноске. «Предметом ужаса» лучше передаёт значение מְחִתָּה как объекта ужаса или потрясения. Маркеры сносок перенесены к непосредственно поясняемым словам.
