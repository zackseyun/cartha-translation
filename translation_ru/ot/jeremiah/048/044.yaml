source:
  edition: WLC
  text: ה/ניס מִ/פְּנֵ֤י הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עֹלֶה֙ מִן הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אָבִ֨יא אֵלֶ֧י/הָ אֶל מוֹאָ֛ב שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/044.yaml
  text: He who flees from the terror will fall into the pit[a], and he who comes up from the pit will be caught in the snare; for I will bring upon her, upon Moab, the year of their punishment, declares Yahweh.
translation:
  language: ru
  text: Кто побежит от ужаса, тот упадёт в яму, а кто выберется из ямы, тот попадётся в западню. Ибо Я наведу на неё, на Моав, год их наказания[a], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «год их взыскания»; букв. также возможно: «год их посещения».'
    reason: Лексема פְּקֻדָּה может означать посещение, взыскание или наказание; в данном контексте посещение имеет характер суда.
lexical_decisions:
- source_word: הניס
  choice: кто побежит
  rationale: Субстантивированное причастие обозначает всякого, кто пытается спастись бегством; русская конструкция «кто… тот…» естественно передаёт обобщённый смысл.
- source_word: הפחד
  choice: от ужаса
  rationale: פַּחַד здесь означает сильный страх, ужас перед бедствием, а не просто внутреннюю боязнь.
- source_word: הפחת
  choice: в яму / из ямы
  rationale: פַּחַת — яма, в том числе ловчая; краткое «яма» сохраняет отчётливый образ и словесную цепочку угроз.
- source_word: והעלה מן הפחת
  choice: а кто выберется из ямы
  rationale: Буквально «поднимающийся из ямы»; «выберется» естественно по-русски передаёт выход из неё, не добавляя нового способа спасения.
- source_word: ילכד בפח
  choice: тот попадётся в западню
  rationale: לכד с בְּפַח описывает поимку в ловушку; «западня» отличает этот образ от предшествующей ямы и сохраняет нарастание образов неизбежной гибели.
- source_word: כי אביא אליה אל מואב
  choice: Ибо Я наведу на неё, на Моав
  rationale: Повтор направления передаёт Моав как адресата бедствия; женское местоимение сохранено, а последующее «на Моав» выступает поясняющим приложением.
- source_word: שנת פקדתם
  choice: год расплаты с ними
  rationale: פְּקֻדָּה в контексте суда означает назначенное взыскание или кару. «Расплата» ясно передаёт судебно-карательный смысл, а множественный суффикс ם отражён словами «с ними».
- source_word: נאם יהוה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современным литературным оборотом; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Значение פְּקֻדָּה в пророчестве о суде
  choice: расплата
  alternative: посещение; взыскание; наказание
  rationale: Контекст неизбежного бедствия требует карательного смысла, однако более широкая семантика слова сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Конструкция «кто… тот…» делает стих ясным и сохраняет его афористический ритм; образы ужаса, ямы и западни оставлены различными.
