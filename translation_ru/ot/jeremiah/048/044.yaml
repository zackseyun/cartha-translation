    rationale: 'Форма «с ними» может означать, что расплата производится с Моавом как участником действия, тогда как еврейский суффикс в פקדתם — притяжательный: «год их посещения/наказания». «Расплата» также несколько менее нейтральна и точна для פְּקֻדָּה, чем «наказание» в контексте оракула суда.'
