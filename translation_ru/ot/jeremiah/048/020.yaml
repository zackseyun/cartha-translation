  text: הֹבִ֥ישׁ מוֹאָ֛ב כִּֽי חַ֖תָּה הילילי ו/זעקי הַגִּ֣ידוּ בְ/אַרְנ֔וֹן כִּ֥י שֻׁדַּ֖ד מוֹאָֽב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/020.yaml
  text: 'Moab is put to shame[a], for she is shattered[c][b]. Wail and cry out! Declare it by the Arnon: Moab is devastated.'
translation:
  language: ru
  text: 'Моав опозорен, потому что сокрушён. Рыдай и кричи! Возвестите у Арнона: «Моав разорён!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֹבִישׁ
  choice: опозорен
  rationale: Хифиль от בוש здесь выражает состояние постигшего позора; краткая пассивная форма естественна по-русски и сохраняет результативный оттенок.
- source_word: מוֹאָב
  choice: Моав
  rationale: Устоявшаяся русская передача названия народа и страны.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину позора Моава; явная причинная связь естественна и понятна современному читателю.
- source_word: חַתָּה
  choice: сокрушён
  rationale: Форма от חתת допускает значения сломленности, крушения и ужаса. «Сокрушён» сохраняет как образ разгрома, так и оттенок полной сломленности, не сводя смысл только к эмоции.
- source_word: הילילי
  choice: Рыдайте
  rationale: Повелительная форма женского рода единственного числа, вероятно обращённая к олицетворённому Моаву; русское множественное число согласовано с последующим הַגִּידוּ и звучит как публичный призыв к плачу.
- source_word: ו/זעקי
  choice: и вопите
  rationale: זעק обозначает громкий крик бедствия; «вопите» образует естественную пророческую пару с «рыдайте».
- source_word: הַגִּידוּ
  choice: Возвестите
  rationale: Повелительное множественное число требует публично сообщить весть; «возвестите» сохраняет возвышенный пророческий регистр без архаической непонятности.
- source_word: בְ/אַרְנוֹן
  choice: у Арнона
  rationale: בְ допускает локативную передачу; Арнон — река и ущелье, поэтому «у Арнона» естественно обозначает местность возле неё, не навязывая более узкую локализацию.
- source_word: שֻׁדַּד
  choice: разорён
  rationale: Пуаль от שדד означает подвергнуться опустошению, разорению или разграблению. «Разорён» передаёт общий итог бедствия, не ограничивая его только грабежом.
