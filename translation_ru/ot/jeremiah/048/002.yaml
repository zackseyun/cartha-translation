base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/002.yaml
  text: 'There is no more praise for Moab[a]. In Heshbon they have devised evil against her: ‘Come, let us cut her off from being a nation.’ You too, Madmen, will be silenced[b]; the sword will go after you.'
translation:
  language: ru
  text: 'Больше нет славы Моава[a]. В Хешбоне замыслили против него зло: «Идёмте, истребим его, чтобы он перестал быть народом». И ты, Мадмен, умолкнешь[b]; вслед за тобой пойдёт меч.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте название «Хешбон» созвучно глаголу «замыслили», что создаёт игру слов.
    reason: lexical_alternative
  - marker: b
    text: «Мадмен», вероятно, название города. По-еврейски оно созвучно слову «умолкнешь», так что суд подчёркнут игрой слов.
    reason: cultural_note
lexical_decisions:
- source_word: תְּהִלַּת
  choice: славы
  rationale: Существительное может означать хвалу, славу или известность. В контексте суда «слава» естественно передаёт утрату прежней прославленности Моава.
- source_word: בְּחֶשְׁבּוֹן חָשְׁבוּ
  choice: В Хешбоне замыслили
  rationale: 'Предлог ב понят локально: замысел возник в Хешбоне. Глагол «замыслили» передаёт враждебное намерение; еврейское созвучие топонима и глагола поясняется в сноске.'
- source_word: רָעָה
  choice: беду
  rationale: רעה допускает значения «зло», «вред», «бедствие». Здесь речь идёт о задуманном уничтожении, поэтому «беду» сохраняет смысл причиняемого зла, не устраняя лексическую многозначность полностью.
- source_word: לְכוּ וְנַכְרִיתֶנָּה מִגּוֹי
  choice: Идёмте, истребим его, чтобы он перестал быть народом
  rationale: Императив и когортатив переданы как призыв. Hiphil כרת означает «отсечь, истребить», а מִגּוֹי указывает на прекращение существования Моава как народа.
- source_word: מַדְמֵן תִּדֹּמִּי
  choice: Мадмен, умолкнешь
  rationale: מַדְמֵן принят как название моавитского города, а דמם передан прямым значением «умолкнуть». Созвучие названия и глагола отмечено в сноске.
- source_word: אַחֲרַיִךְ תֵּלֶךְ חָרֶב
  choice: вслед за тобой пойдёт меч
  rationale: Сохранены олицетворение меча и близкий к еврейскому порядок образов; женский род местоимения относится к городу Мадмен.
- source_word: אֵין עוֹד
  choice: Не стало больше
  rationale: Оборот выражает прекращение прежнего состояния и по-русски звучит естественно в пророческом объявлении суда.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Моав передан местоимением мужского рода по нормам русского языка; Мадмен как подразумеваемый город — также мужского рода. Кавычки оформляют прямую речь заговорщиков.
