  text: Flee! Escape with your lives[b][a], and be like a juniper in the wilderness.
translation:
  language: ru
  text: Бегите! Спасайте свою жизнь и будьте как можжевельник[a][b] в пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «и будьте как Ароэр в пустыне». Еврейское עֲרוֹעֵר можно понять как название места или как название пустынного растения; сравнение и слова «в пустыне» допускают здесь понимание как образа растения.'
    reason: alternative_reading
  - marker: b
    text: Какое именно растение обозначено словом עֲרוֹעֵר, точно неизвестно; среди возможных переводов — «можжевельник», «тамариск» или, в более общем смысле, «пустынный куст».
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻסוּ
  choice: Бегите!
  rationale: Повелительная форма множественного числа от נוס передаёт прямой и настоятельный призыв к бегству.
- source_word: מַלְּטוּ נַפְשְׁכֶם
  choice: Спасайте свои жизни
  rationale: В контексте бегства נֶפֶשׁ означает жизнь или самого человека, а не отделённую от тела «душу»; сочетание передаёт призыв сохранить жизнь.
- source_word: וְתִהְיֶינָה
  choice: и станьте подобны
  rationale: Форма היה продолжает ряд побудительных высказываний. «Станьте подобны» естественно вводит последующее сравнение.
- source_word: כַּעֲרוֹעֵר
  choice: можжевельнику
  rationale: Контекст пустыни допускает понимание עֲרוֹעֵר как названия пустынного растения; «можжевельник» — традиционный и понятный вариант, хотя точный вид растения не установлен и возможно прочтение как топонима.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; «в пустыне» здесь ясно и естественно по-русски.
