id: JER.48.1
reference: Jeremiah 48:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לְ/מוֹאָ֡ב כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל ה֤וֹי אֶל נְבוֹ֙ כִּ֣י שֻׁדָּ֔דָה הֹבִ֥ישָׁה נִלְכְּדָ֖ה קִרְיָתָ֑יִם הֹבִ֥ישָׁה הַ/מִּשְׂגָּ֖ב וָ/חָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/001.yaml
  text: 'Concerning Moab: Thus says Yahweh of hosts[a], the God of Israel: Woe to Nebo, for it is devastated. Kiriathaim is put to shame; it is captured[b]. The stronghold is put to shame and shattered.'
translation:
  language: ru
  text: 'О Моаве[a]. Так говорит Яхве Воинств, Бог Израиля:


    «Горе Нево — он разорён!

    Кирьятаим опозорен и захвачен.

    Крепость[b] опозорена и сокрушена».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Против Моава».'
    reason: alternative_reading
  - marker: b
    text: 'Или, если это название места: «Мисгав».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמוֹאָב
  choice: О Моаве
  rationale: Предлог לְ в заголовке пророчества имеет широкое значение; «о Моаве» естественно передаёт тему пророчества, не усиливая само заглавие до явно враждебного «против Моава».
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יְהוָה передано как «Яхве», а צְבָאוֹת — как «Воинств», что сохраняет форму божественного титула и мысль о владычестве над небесными и земными силами.
- source_word: הוֹי אֶל נְבוֹ
  choice: Горе Нево
  rationale: הוֹי сочетает плач и провозглашение суда; русское «горе» естественно выражает обе стороны. נְבוֹ передано как название города Нево.
- source_word: כִּי שֻׁדָּדָה
  choice: он разорён
  rationale: Пассивная форма от שׁדד обозначает опустошение, разорение или разграбление. «Разорён» передаёт итог насильственного опустошения без чрезмерного уточнения способа.
- source_word: הֹבִישָׁה
  choice: опозорен / опозорена
  rationale: Каузативная форма указывает на то, что города или крепость были приведены к позору, а не только испытали внутренний стыд.
- source_word: נִלְכְּדָה
  choice: захвачен
  rationale: В военном контексте Niphal глагола לכד означает, что город взят или захвачен.
- source_word: קִרְיָתָיִם
  choice: Кирьятаим
  rationale: Название города транслитерировано в форме, близкой к древнееврейскому звучанию и понятной русскому читателю.
- source_word: הַמִּשְׂגָּב
  choice: Крепость
  rationale: 'Артикль и обычное значение существительного поддерживают понимание слова как нарицательного: укреплённое, безопасное место. Возможное прочтение как топонима сохранено в сноске.'
- source_word: וָחָתָּה
  choice: и сокрушена
  rationale: חתת может обозначать как разрушение, так и состояние поверженности или ужаса. «Сокрушена» сохраняет образ поражения и допускает как вещественный, так и переносный оттенок.
theological_decisions:
- issue: Значение לְ в заголовке пророчества о суде
  choice: О Моаве
  alternative: Против Моава
  rationale: Хотя содержание главы направлено против Моава, сам предлог шире явно враждебного значения. Основной текст сохраняет эту широту, а возможное контекстуальное прочтение указано в сноске.
- issue: Нарицательное или собственное значение הַמִּשְׂגָּב
  choice: Крепость
  alternative: Мисгав
  rationale: Наличие артикля и общеупотребительное лексическое значение благоприятствуют переводу как нарицательного существительного, но топонимическое понимание остаётся возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной пророческой интонацией. Параллельные краткие строки сохраняют ритм судебного изречения; архаизм «Саваоф» не использован, чтобы сделать значение титула прозрачнее.
