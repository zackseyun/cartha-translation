base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/034.yaml
  text: From the cry of Heshbon to Elealeh[a], as far as Jahaz, they raise their voice; from Zoar to Horonaim, to Eglath-shelishiyah. For even the waters of Nimrim will become desolations.
translation:
  language: ru
  text: От крика Хешбона до Элеале, до самого Яхаца, они возвышают голос; от Цоара до Хоронаима, до Эглат-Шелишии[a]. Ведь даже воды Нимрима обратятся в запустение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «трёхлетняя телица». Еврейское выражение עֶגְלַת שְׁלִשִׁיָּה допускает описательное понимание, однако в данном ряду, вероятнее всего, является названием места.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזַּעֲקַת
  choice: От крика
  rationale: זַעֲקָה обозначает крик бедствия, а מִן здесь открывает географический диапазон, по которому он распространяется.
- source_word: עַד
  choice: до / до самого
  rationale: Повторяющееся עַד отмечает предел распространения крика; усиленное «до самого» естественно передаёт протяжённость ряда, не меняя его смысла.
- source_word: נָתְנוּ קוֹלָם
  choice: они возвышают голос
  rationale: Сохранена активная форма еврейской идиомы «дают свой голос», то есть громко кричат; настоящее время передаёт живость поэтического описания.
- source_word: מִצֹּעַר
  choice: от Цоара
  rationale: Предлог מִן начинает второй географический отрезок; название передано транслитерацией с еврейского.
- source_word: חֹרֹנַיִם
  choice: Хоронаим
  rationale: Географическое название передано современной русской транслитерацией с еврейского.
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  choice: Эглат-Шелишия
  rationale: В последовательности географических названий выражение вероятнее всего обозначает местность. Транслитерация сохраняет эту интерпретацию, а возможное описательное значение вынесено в сноску.
- source_word: כִּי גַּם
  choice: Ведь даже
  rationale: «Ведь» передаёт пояснительную функцию כִּי, а «даже» — усилительное значение גַּם.
- source_word: מֵי נִמְרִים
  choice: воды Нимрима
  rationale: Прямо передана конструкция сопряжённого состояния с географическим названием без уточнения типа водоёма, которого нет в тексте.
- source_word: לִמְשַׁמּוֹת
  choice: в пустошь
  rationale: Русское собирательное единственное число естественно выражает состояние полного запустения; буквальное множественное «в пустоши» здесь звучало бы неестественно.
- source_word: יִהְיוּ
  choice: превратятся
  rationale: Сочетание היה с לְ и существительным результата выражает переход в новое состояние, поэтому выбрано «превратятся», а не статическое «будут».
