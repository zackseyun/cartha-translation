    reason: alternative_reading
lexical_decisions:
- source_word: מַעֲלֵה הַלֻּחוֹת
  choice: на подъёме к Лухиту
  rationale: מַעֲלֵה обозначает подъём или восходящую дорогу; הַלֻּחוֹת в данном контексте — топоним. Предлог «к» естественно передаёт направление подъёма к месту.
- source_word: בִּבְכִי יַעֲלֶה בֶּכִי
  choice: поднимаются с плачем — плачут
  rationale: Сохранён усилительный повтор существительного בֶּכִי, но второй элемент передан глаголом ради ясного и естественного русского синтаксиса. Формально единственное число יַעֲלֶה понято собирательно или безлично в отношении бегущих моавитян.
- source_word: בְּמוֹרַד חוֹרֹנַיִם
  choice: на спуске к Хоронаиму
  rationale: מוֹרַד — спуск, нисходящая дорога; перевод сохраняет топографическое противопоставление подъёму в первой строке.
- source_word: צָרֵי צַעֲקַת שֶׁבֶר
  choice: мучительный крик о гибели
  rationale: Трудная форма צָרֵי понята как характеристика крика — тягостного, мучительного. שֶׁבֶר в пророческом контексте передано как «гибель», то есть сокрушительное бедствие или разрушение.
- source_word: שָׁמֵעוּ
  choice: услышали
  rationale: Сохранены совершенный вид и множественное число еврейского перфекта; субъект в исходном тексте не назван.
