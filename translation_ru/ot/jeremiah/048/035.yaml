  text: וְ/הִשְׁבַּתִּ֥י לְ/מוֹאָ֖ב נְאֻם יְהוָ֑ה מַעֲלֶ֣ה בָמָ֔ה וּ/מַקְטִ֖יר לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/035.yaml
  text: And I will put an end in Moab—oracle of Yahweh—to the one who goes up to the high place and burns incense to his god[a].
translation:
  language: ru
  text: И Я положу конец в Моаве тому, кто восходит на высоту и воскуряет своему богу, — возвещает Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: И Я положу конец
  rationale: Каузативная форма глагола שׁבת означает «заставить прекратиться». Выражение «положу конец» естественно по-русски и сохраняет решительность действия.
- source_word: לְמוֹאָב
  choice: в Моаве
  rationale: Предлог לְ здесь указывает на сферу, в пределах которой будет прекращено культовое действие.
- source_word: נְאֻם יְהוָה
  choice: слово Яхве
  rationale: Устойчивая пророческая формула передана кратко и торжественно, с сохранением именного характера נְאֻם и личного имени Бога.
- source_word: מַעֲלֶה בָמָה
  choice: тем, кто восходит на высоту
  rationale: Причастие עלה буквально обозначает восхождение, а בָמָה — культовую высоту. Русское собирательно-обобщающее «тем, кто» естественно передаёт родовое значение еврейского единственного числа.
- source_word: וּמַקְטִיר
  choice: и воскуряет
  rationale: В культовом контексте каузативная форма קטר означает возжигание благовоний или жертвенного дыма; «воскуряет» сохраняет культовый смысл и высокий регистр без излишнего уточнения объекта.
- source_word: לֵאלֹהָיו
  choice: своему богу
  rationale: Форма אֱלֹהִים с суффиксом 3-го лица мужского рода единственного числа здесь, вероятнее всего, обозначает одного бога; возвратное «своему» естественно соотносит его с действующим лицом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это имя и не заменяет его титулом.
- issue: Что именно прекращается в Моаве
  choice: тем, кто восходит на высоту и воскуряет своему богу
  alternative: поклонение на высотах вообще
  rationale: В еврейском тексте стоят два причастия мужского рода единственного числа, описывающие типичного поклоняющегося. Перевод сохраняет личную конструкцию, но естественное русское «тем, кто» выражает её обобщающий характер.
- issue: Значение וּמַקְטִיר
  choice: воскуряет
  alternative: сжигает благовония; возносит жертвенный дым
  rationale: Глагол допускает более широкое культовое значение, чем только курение фимиама. Непереходное «воскуряет» сохраняет эту некоторую неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. «Высота» употреблена в библейском культовом смысле; «воскуряет» сохраняет религиозный регистр и неоднозначность между благовониями и жертвенным дымом.
