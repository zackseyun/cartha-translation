  source_fidelity: 'Смысл в целом передан верно: Яхве прекращает в Моаве деятельность человека, восходящего на культовую высоту и совершающего воскурение своему богу. Однако исходные причастия стоят в мужском роде единственного числа; конструкция «тем, кто» без необходимости заменяет это единственное число множественным.'
  naturalness: «Положу конец ... тем, кто» грамматически возможно, но стилистически менее точно и несколько тяжеловесно в сочетании с единственным числом оригинала. Пророческая формула «слово Яхве» в данном месте звучит как буквальная калька; «возвещает Яхве» — естественная современная русская передача формулы נְאֻם יְהוָה.
  terminology: «Яхве», «высота» и «воскуряет» уместны. «Высота» сохраняет принятый библейский культовый термин, а «воскуряет» не сужает значение מקטיר до одного лишь фимиама.
