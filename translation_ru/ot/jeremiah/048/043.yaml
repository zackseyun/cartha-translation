  text: פַּ֥חַד וָ/פַ֖חַת וָ/פָ֑ח עָלֶ֛י/ךָ יוֹשֵׁ֥ב מוֹאָ֖ב נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/043.yaml
  text: Terror and the pit and the snare are upon you[a], inhabitant of Moab[b], declares Yahweh.
translation:
  language: ru
  text: Над тобой — ужас, яма и западня[a], житель Моава, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эта тройная формула — «ужас, яма и западня» — перекликается с Ис 24:17.
    reason: cross_reference
lexical_decisions:
- source_word: פַּחַד
  choice: ужас
  rationale: Существительное обозначает сильный страх или ужас; в контексте пророческого суда «ужас» передаёт силу выражения и сохраняет трёхчастную формулу.
- source_word: פַחַת
  choice: яма
  rationale: Здесь имеется в виду ловчая яма, куда падает жертва. Краткое «яма» естественно по-русски и соответствует параллельной формуле в Ис 24:17.
- source_word: פָח
  choice: западня
  rationale: Слово обозначает ловушку или силок. «Западня» ясно отличается от ямы и подходит к образу неизбежной опасности.
- source_word: עָלֶיךָ
  choice: для тебя
  rationale: Буквально предлог означает «на тебе/над тобой», но в бессвязочной именной конструкции возвещается угроза, ожидающая адресата. «Для тебя» естественно передаёт этот смысл, не добавляя явного глагола движения.
- source_word: יוֹשֵׁב מוֹאָב
  choice: житель Моава
  rationale: Причастие в единственном числе употреблено как обращение к населению Моава в собирательном лице; русский вариант сохраняет представительное единственное число.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула требует торжественного, но современного выражения. «Возвещает» передаёт авторитетность изречения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в еврейском тексте и не заменяет имя титулом.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; «Яхве» непосредственно передаёт тетраграмматон, тогда как «Господь» является традиционной заменой имени титулом.
- issue: Характер угрозы в עָלֶיךָ
  choice: для тебя
  alternative: обрушатся на тебя
  rationale: Еврейский текст не содержит выраженного глагола движения. Выбранный вариант сохраняет сжатость и не уточняет, уже постигли опасности адресата или вот-вот постигнут.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Аллитерацию трёх близкозвучных еврейских слов полностью воспроизвести невозможно; сохранены краткость, ритмическая трёхчастность и различие образов.
