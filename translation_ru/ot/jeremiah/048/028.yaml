base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/028.yaml
  text: Leave the cities and dwell in the rock[a], inhabitants of Moab, and be like a dove that nests on the sides of the mouth of a pit.
translation:
  language: ru
  text: Оставьте города и поселитесь в скале, жители Моава! Будьте подобны голубке, которая вьёт гнездо по сторонам отверстия ямы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ловчей ямы», «западни»; еврейское слово может обозначать яму, служащую ловушкой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ עָרִים
  choice: Оставьте города
  rationale: Форма множественного числа повелительного наклонения требует покинуть городские поселения Моава. «Оставьте» естественно передаёт силу приказа, не усиливая её до оттенка окончательного отречения.
- source_word: וְשִׁכְנוּ בַּסֶּלַע
  choice: и поселитесь среди скал
  rationale: שׁכן означает жить или обосноваться, а סלע — скалу, утёс, скалистое место. Русское «среди скал» естественно описывает укрытие в скалистой местности и не создаёт неуместного образа проживания внутри камня.
- source_word: יֹשְׁבֵי מוֹאָב
  choice: жители Моава
  rationale: Причастный оборот служит прямым обращением к населению Моава; краткая русская формулировка ясна и сохраняет пророческий регистр.
- source_word: וִהְיוּ כְיוֹנָה
  choice: Станьте подобны голубке
  rationale: Императив היה допускает «будьте» и «станьте». «Станьте подобны» естественно вводит последующий образ и передаёт призыв изменить образ жизни ради бегства и укрытия.
- source_word: תְּקַנֵּן
  choice: которая вьёт гнездо
  rationale: Форма женского рода согласуется с «голубкой». Относительное предложение ясно передаёт действие и звучит естественно по-русски.
- source_word: בְּעֶבְרֵי פִי פָחַת
  choice: по краям устья пропасти
  rationale: עברי указывает на стороны или края, פי буквально означает «устье, рот, отверстие», а פחת — яму или ловчую яму. Формулировка сохраняет пространственный и опасный образ, не сводя его к одному бесспорному виду углубления.
