  verdict: revise
  source_fidelity: В целом переданы повелительные формы, обращение к жителям Моава и образ голубки. Однако «пропасть» существенно конкретизирует פַּחַת («яма», возможно ловчая яма), а «станьте подобны» вносит оттенок становления, которого повелительное «будьте» не требует. «Среди скал» также заменяет единственное число «в скале/скалистом убежище» множественным числом.
  naturalness: Текст звучит литературно, но сочетание «устье пропасти» несколько неестественно для образа гнезда и создаёт образ огромной бездны. «По сторонам отверстия ямы» ясно и естественно передаёт пространственную конструкцию.
  terminology: «Голубка» и «жители Моава» удачны. «Яма» — нейтральное основное значение פַּחַת; возможность значения ловчей ямы следует оставить в сноске. «В скале» сохраняет образ исходного текста без неоправданного уточнения.
