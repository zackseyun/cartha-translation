base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/018.yaml
  text: Come down from your glory and sit in thirst[a], O inhabitant, daughter of Dibon, for the destroyer of Moab has come up against you[b]; he has destroyed your fortresses.
translation:
  language: ru
  text: Сойди со своей славы и сядь, мучаясь от жажды[a], о жительница, дочь Дивона[b], потому что разоритель Моава выступил против тебя и разрушил твои крепости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «сядь в иссохшем месте» или «поселись в иссохшем месте». Еврейское выражение может указывать как на саму жажду, так и на сухую землю, до которой будет низведён Дивон.'
    reason: lexical_alternative
  - marker: b
    text: «Дочь Дивона» — обычное для пророческой речи олицетворение города и его жителей в образе женщины.
    reason: cultural_note
lexical_decisions:
- source_word: רְדִי מִכָּבוֹד
  choice: Сойди со своей славной высоты
  rationale: Повелительная форма женского рода обращена к олицетворённому городу. כָּבוֹד означает «слава, величие, почёт»; добавление «высоты» естественно передаёт по-русски образ нисхождения из возвышенного положения, не сводя его лишь к физическому перемещению.
- source_word: ישבי בַצָּמָא
  choice: сядь на иссохшей земле
  rationale: צָמָא может обозначать жажду или сухость, в том числе иссохшее место. Основной вариант передаёт участь лишённого благополучия города естественным русским языком, а смысл «томиться от жажды» сохранён в сноске.
- source_word: יֹשֶׁבֶת בַּת דִּיבוֹן
  choice: жительница, дочь Дивона
  rationale: Формы женского рода представляют Дивон и его население как женщину. «Жительница» сохраняет причастное обозначение обитающей там женщины, а «дочь Дивона» — обычное для пророческой речи олицетворение города.
- source_word: שֹׁדֵד מוֹאָב
  choice: разоритель Моава
  rationale: שֹׁדֵד обозначает того, кто опустошает, разоряет или грабит. «Разоритель» сохраняет военный контекст и не предрешает, идёт ли речь преимущественно о разграблении или уничтожении.
- source_word: עָלָה בָךְ
  choice: выступил против тебя
  rationale: Сочетание עלה с ב описывает наступление врага. Русское «выступил против тебя» естественно передаёт направленное военное движение, не превращая его без необходимости в уже завершившееся нападение.
- source_word: שִׁחֵת מִבְצָרָיִךְ
  choice: разрушил твои крепости
  rationale: שׁחת здесь означает погубить или разрушить, а מִבְצָר — укреплённое место. Выбор прямо и ясно передаёт результат вражеского разорения.
