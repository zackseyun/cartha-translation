id: JER.48.41
reference: Jeremiah 48:41
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: נִלְכְּדָה֙ הַ/קְּרִיּ֔וֹת וְ/הַ/מְּצָד֖וֹת נִתְפָּ֑שָׂה וְֽ֠/הָיָה לֵ֞ב גִּבּוֹרֵ֤י מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא כְּ/לֵ֖ב אִשָּׁ֥ה מְצֵרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/041.yaml
  text: Kerioth has been captured[a], and the strongholds have been seized; and the heart of Moab’s warriors will be on that day like the heart of a woman in labor.
translation:
  language: ru
  text: Кериот взят[a], и крепости захвачены. В тот день сердце воинов Моава будет как сердце женщины в родовых муках.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, если הַקְּרִיּוֹת понимать как нарицательное существительное: «Города взяты».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַקְּרִיּוֹת
  choice: Кериот
  rationale: В контексте перечисления моавитских городов форму предпочтительно понимать как название города Кериот; при этом возможное нарицательное значение сохранено в сноске.
- source_word: נִלְכְּדָה
  choice: взят
  rationale: Пассив породы нифаль от לכד обозначает взятие или захват; «взят» естественно сочетается с названием укреплённого города и передаёт свершившийся характер пророческого сообщения.
- source_word: הַמְּצָדוֹת נִתְפָּשָׂה
  choice: крепости захвачены
  rationale: מְצָדוֹת обозначает укреплённые места, а пассив תפשׂ — их захват. Русское множественное число требуется естественным согласованием, несмотря на необычное формальное согласование в масоретском тексте.
- source_word: לֵב גִּבּוֹרֵי מוֹאָב
  choice: сердце воинов Моава
  rationale: «Сердце» сохраняет исходный образ внутреннего состояния и мужества, а «воины» передаёт военное значение גִּבּוֹרֵי без архаизма.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача устойчивого пророческого указания времени.
- source_word: כְּלֵב אִשָּׁה מְצֵרָה
  choice: как сердце женщины в родовых муках
  rationale: Передаёт сравнение с внутренним состоянием рожающей женщины и сохраняет образ сильнейшего страдания и страха, не заменяя его пояснительным пересказом.
