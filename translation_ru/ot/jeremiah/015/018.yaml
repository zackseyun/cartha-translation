base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/018.yaml
  text: Why has my pain become perpetual[a], and my wound incurable, refusing to be healed? Will you indeed be to me like a deceptive brook, like waters that are not reliable?
translation:
  language: ru
  text: 'Почему моя боль стала непрестанной,

    а рана — неизлечима

    и не хочет заживать?

    Неужели Ты и вправду будешь для меня

    словно обманчивый поток[a],

    словно воды, на которые нельзя положиться?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пересыхающий поток». Имеется в виду поток, который обещает воду, но оказывается ненадёжным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְאֵבִי
  choice: моя боль
  rationale: כאב обозначает боль или страдание; «боль» естественно передаёт как телесную, так и душевную сторону плача Иеремии.
- source_word: נֶצַח
  choice: непрестанной
  rationale: В данном контексте слово выражает непрерывную длительность, а не отвлечённую вечность; «непрестанной» сохраняет этот смысл.
- source_word: מַכָּתִי אֲנוּשָׁה
  choice: рана — неизлечимой
  rationale: Метафора раны поддерживается последующим упоминанием исцеления, а אֲנוּשָׁה в этом контексте указывает на состояние, не поддающееся лечению.
- source_word: מֵאֲנָה הֵרָפֵא
  choice: отказываясь заживать
  rationale: Перевод сохраняет олицетворение раны, которая словно отказывается исцеляться, и звучит естественно по-русски.
- source_word: הָיוֹ תִהְיֶה לִי
  choice: Неужели Ты и вправду станешь для меня
  rationale: Инфинитив при личной форме усиливает глагол; сочетание «неужели… и вправду» передаёт настойчивый и недоверчивый тон риторического вопроса.
- source_word: אַכְזָב
  choice: обманчивый поток
  rationale: Слово описывает поток, который обманывает ожидания, оказываясь ненадёжным; «обманчивый поток» сохраняет и образ, и обвинительную силу выражения.
- source_word: מַיִם לֹא נֶאֱמָנוּ
  choice: воды, на которые нельзя положиться
  rationale: Так передаётся буквальная ненадёжность воды и оттенок доверия, связанный с корнем אמן, без неестественного русского выражения «неверные воды».
theological_decisions:
- issue: Прямое обращение к Богу в плаче
  choice: Сохранён резкий риторический вопрос, в котором Иеремия уподобляет Бога ненадёжному потоку.
  alternative: Смягчить жалобу, чтобы она не звучала как обвинение Бога в ненадёжности.
  rationale: Еврейский текст прямо сохраняет напряжённость плача и смелость обращения к Богу; перевод не должен устранять это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с поэтической разбивкой строк. Тон личного плача сохранён без архаизмов и без смягчения обвинительного вопроса. Прописная буква в «Ты» отмечает прямое обращение к Богу согласно распространённой русской библейской традиции.
