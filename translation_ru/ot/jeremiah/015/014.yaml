base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/014.yaml
  text: And I will make your enemies pass into a land you have not known[a], for a fire has been kindled in my anger; it will burn against you.
translation:
  language: ru
  text: И Я проведу твоих врагов в незнакомую тебе страну[a], ибо в гневе Моём разгорелся огонь — он будет пылать против вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно некоторым древним переводам и параллельному месту в Иер 17:4: «И заставлю тебя служить твоим врагам в незнакомой тебе стране». В еврейском согласном тексте здесь стоит «твоих врагов», однако в основе другого чтения могла лежать иная огласовка или иной древний текст.'
    reason: textual_variant
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  choice: И Я проведу
  rationale: Каузативная порода глагола עבר означает «заставить перейти, провести». «Проведу» сохраняет движение в указанную далее страну и не устраняет необычность еврейской формулировки.
- source_word: אֶת אֹיְבֶיךָ
  choice: твоих врагов
  rationale: Масоретский текст прямо ставит «твоих врагов» в качестве дополнения; это чтение сохранено в основном тексте, несмотря на вариант древних переводов.
- source_word: בְּאֶרֶץ לֹא יָדָעְתָּ
  choice: в незнакомую тебе страну
  rationale: При глаголе движения ב передаёт направленность «в». Оборот «незнакомую тебе» естественно выражает страну, которой адресат прежде не знал.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание объявленного суда; «ибо» уместен в современном литературном пророческом регистре.
- source_word: אֵשׁ קָדְחָה בְאַפִּי
  choice: в гневе Моём разгорелся огонь
  rationale: Сохранён образ огня и идиоматическое значение אַף — «гнев». «Разгорелся» передаёт совершившееся воспламенение без неестественного русского пассива.
- source_word: עֲלֵיכֶם תּוּקָד
  choice: он будет пылать против вас
  rationale: Будущая длительность горения передана глаголом «пылать», а עֲלֵיכֶם в контексте суда — сочетанием «против вас». Множественное число суффикса сохранено.
theological_decisions:
- issue: Переход от единственного числа во фразах «твоих врагов», «тебе» к множественному «против вас»
  choice: Сохранить смену числа
  alternative: Унифицировать все обращения в единственном или множественном числе
  rationale: Еврейский текст переходит от обращения к одному лицу или собирательному адресату к обращению ко многим. Перевод не должен устранять эту содержательную напряжённость.
- issue: Текстовый вариант в первой половине стиха
  choice: Следовать масоретскому чтению «проведу твоих врагов»
  alternative: «Заставлю тебя служить врагам»
  rationale: Основной текст WLC содержит אֹיְבֶיךָ, «твоих врагов». Альтернативное чтение засвидетельствовано древними версиями и параллелью Иер 17:4, поэтому вынесено в примечание, а не подменяет исходное чтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Заглавные буквы в «Я» и «Моём» обозначают речь Бога. Необычный смысл первого оборота и смена числа адресата намеренно сохранены.
