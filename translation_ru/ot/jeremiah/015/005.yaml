base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/005.yaml
  text: For who will have compassion on you[a], Jerusalem? And who will mourn for you? And who will turn aside to ask about your welfare?
translation:
  language: ru
  text: Ибо кто пожалеет тебя, Иерусалим? Кто посочувствует тебе? Кто свернёт с пути, чтобы спросить о твоём благополучии?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто сжалится над тобой… кто станет скорбеть о тебе… кто остановится, чтобы справиться о твоём благополучии?»'
    reason: Лексические варианты для חמל, נוד и идиомы שאל לשלום, сохраняющие оттенки сострадания, скорби и заботы о благополучии.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предшествующему пророчеству о суде; «ибо» сохраняет эту связь и соответствует достоинству пророческой речи.
- source_word: מִי
  choice: кто
  rationale: Трижды повторённое вопросительное местоимение сохранено для передачи риторического нарастания.
- source_word: יַחְמֹל עָלַיִךְ
  choice: пожалеет тебя
  rationale: Глагол חמל с предлогом על выражает жалость или сострадание; естественное русское соответствие здесь — «пожалеть».
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Использована общепринятая русская форма имени города; обращение к нему передано как к лицу женского рода согласно контексту еврейского текста.
- source_word: יָנוּד לָךְ
  choice: посочувствует тебе
  rationale: נוד в данном контексте обозначает выражение участия, соболезнования или скорби. «Посочувствует» ясно передаёт смысл, не навязывая спорный буквальный жест.
- source_word: יָסוּר
  choice: свернёт с пути
  rationale: סור рисует человека, который отклоняется от своего пути ради Иерусалима; добавление «с пути» естественно раскрывает подразумеваемый образ.
- source_word: לִשְׁאֹל לְשָׁלֹם לָךְ
  choice: чтобы спросить, как ты поживаешь
  rationale: Идиома со שָׁלוֹם означает осведомиться о состоянии или благополучии человека. Русская формула передаёт бытовой смысл вопроса, тогда как примечание сохраняет более явную связь с благополучием.
