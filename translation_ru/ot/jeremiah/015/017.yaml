  text: לֹֽא יָשַׁ֥בְתִּי בְ/סוֹד מְשַׂחֲקִ֖ים וָֽ/אֶעְלֹ֑ז מִ/פְּנֵ֤י יָֽדְ/ךָ֙ בָּדָ֣ד יָשַׁ֔בְתִּי כִּֽי זַ֖עַם מִלֵּאתָֽ/נִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/017.yaml
  text: I did not sit in the company of those who laugh[a], nor did I rejoice; because of your hand I sat alone[c][b], for you filled me with indignation.
translation:
  language: ru
  text: Я не сидел среди веселящихся[a] и не ликовал; из-за руки Твоей[b] я сидел один, потому что Ты наполнил меня негодованием[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди смеющихся»; или: «в кругу предающихся веселью».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от лица Твоей руки»; также возможно: «из-за Твоей руки». Оборот может указывать на воздействие Божьей руки, не уточняя его характера.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «гневом»; или: «яростью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: я не сидел / я сидел
  rationale: Конкретный образ еврейского глагола «сидеть, обитать, оставаться» естественно звучит по-русски и сохраняет повтор в обеих частях стиха.
- source_word: בְסוֹד
  choice: среди
  rationale: Здесь סוֹד обозначает близкий круг или общество людей, а не обязательно формальный совет; «среди» передаёт социальную сопричастность без излишнего уточнения.
- source_word: מְשַׂחֲקִים
  choice: веселящихся
  rationale: Причастие может обозначать смеющихся, играющих или предающихся веселью. «Веселящихся» хорошо соответствует противопоставлению последующему «не ликовал», не сужая смысл до насмешников.
- source_word: וָאֶעְלֹז
  choice: и не ликовал
  rationale: עלז выражает бурную радость или ликование. Отрицание из первой части по смыслу распространяется и на этот глагол.
- source_word: מִפְּנֵי יָדְךָ
  choice: под тяжестью руки Твоей
  rationale: Буквально выражение связано с пребыванием «перед/из-за руки». Выбранная формулировка сохраняет образ Божьей руки и передаёт её давящее, побуждающее воздействие, не сводя метафору к одному толкованию.
- source_word: בָּדָד
  choice: один
  rationale: Кратко и непосредственно передаёт одиночество и отделённость пророка.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину одиночества пророка; причинная связь в русском выражена явно и естественно.
- source_word: זַעַם
  choice: негодованием
  rationale: Слово может означать негодование, гнев или ярость, нередко Божью. «Негодование» сохраняет серьёзность и допускает напряжение между Божьим гневом и переживаемым пророком бременем.
- source_word: מִלֵּאתָנִי
  choice: Ты наполнил меня
  rationale: Прямая передача глагола מלא сохраняет активное действие Бога и образ наполнения.
theological_decisions:
- issue: Значение образа «Твоя рука» в связи с одиночеством Иеремии
  choice: Сохранён образ Божьей руки, причём оборот «под тяжестью» передаёт её властное воздействие.
  alternative: «из-за руки Твоей», «пред рукой Твоей» или толкование руки как защиты либо присутствия
  rationale: Контекст связывает отделённость пророка с Божьим воздействием и бременем его призвания, но метафора не раскрывается до узкого догматического утверждения.
- issue: Смысл זַעַם
  choice: «негодование»
  alternative: «гнев», «ярость»
  rationale: Слово допускает значение Божьего гнева, однако синтаксис говорит, что Бог наполнил им Иеремию. «Негодование» сохраняет напряжение между Божьим судом и внутренним переживанием пророка.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены повтор «сидел», антропоморфный образ руки и неоднозначность слова זַעַם; местоимения, относящиеся к Богу, даны с прописной буквы согласно распространённой русской библейской традиции.
