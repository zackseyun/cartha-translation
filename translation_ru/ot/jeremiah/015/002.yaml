base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/002.yaml
  text: 'And it shall be[a], when they say to you, ‘Where shall we go?’ then you shall say to them, ‘Thus says Yahweh: Those for death, to death; and those for the sword, to the sword; and those for famine, to famine; and those for captivity[b], to captivity.’'
translation:
  language: ru
  text: 'И будет так: когда они скажут тебе: «Куда нам идти?» — ты скажешь им: «Так говорит Яхве: кто на смерть — на смерть[a]; кто под меч — под меч; кто на голод — на голод; кто в плен[b] — в плен».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь предельно краток и повторен буквально: «кто на смерть — на смерть». Подразумевается неизбежная участь, но слово «обречён» в оригинале отсутствует.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в изгнание». Еврейское слово может обозначать плен и связанную с ним насильственную высылку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 'И будет так: когда'
  rationale: Передаёт вводную пророческую формулу и ожидаемое, а не условное обстоятельство; по-русски звучит естественнее буквального «и будет, когда».
- source_word: אָנָה נֵצֵא
  choice: Куда нам идти?
  rationale: Вопрос направленности передан естественно для современного русского языка. Глагол יצא буквально означает «выйти», но здесь по контексту обозначает уход и не требует отдельного «наружу».
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет стандартную пророческую формулу и передаёт тетраграмматон личным именем, а не титулом.
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת
  choice: кто на смерть — на смерть
  rationale: Сохраняет предельно краткую, повторную и суровую формулу еврейского текста, не добавляя слов «обречён» или «предназначен».
- source_word: חֶרֶב
  choice: меч
  rationale: Сохраняет конкретный пророческий образ гибели от войны, не заменяя его абстрактным словом «война».
- source_word: רָעָב
  choice: голод
  rationale: В данном контексте обозначает массовый голод как бедствие и категорию суда.
- source_word: שְׁבִי / שֶּׁבִי
  choice: плен
  rationale: Передаёт состояние и участь уведённых в неволю и позволяет сохранить параллелизм «в плен — в плен»; «изгнание» остаётся возможным контекстуальным переводом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Повторная формула категорий суда
  choice: кто на смерть — на смерть; кто под меч — под меч; кто на голод — на голод; кто в плен — в плен
  alternative: кому суждено умереть — умрёт; кому погибнуть от меча — погибнет; кому умереть от голода — умрёт; кому попасть в плен — попадёт
  rationale: Выбранный вариант сохраняет намеренную резкость, повтор и неуточнённость исходного текста, не объясняя, кем именно люди назначены к каждой участи.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы. Эллиптическая конструкция в перечне намеренно оставлена резкой и ритмичной, чтобы передать синтаксис и тяжесть еврейского оригинала.
