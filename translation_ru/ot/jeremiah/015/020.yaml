  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: обещание сделать Иеремию стеной по отношению к этому народу, образ укреплённой бронзовой стены, предстоящее противостояние без успеха противников, Божье присутствие, спасение и избавление, а также пророческую формулу נְאֻם יְהוָה. «Для этого народа» сохраняет нейтральную направленность לָעָם, не добавляя прямо выраженного в русском «против», хотя конфликт далее явно назван.'
