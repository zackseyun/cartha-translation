id: JER.15.20
reference: Jeremiah 15:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/נְתַתִּ֜י/ךָ לָ/עָ֣ם הַ/זֶּ֗ה לְ/חוֹמַ֤ת נְחֹ֨שֶׁת֙ בְּצוּרָ֔ה וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הוֹשִֽׁיעֲ/ךָ֥ וּ/לְ/הַצִּילֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/020.yaml
  text: And I will make you to this people a fortified wall of bronze; they will fight against you[a], but they will not prevail over you, for I am with you to save you and to deliver you, declares Yahweh.
translation:
  language: ru
  text: И Я сделаю тебя для этого народа укреплённой стеной из бронзы[a]. Они будут сражаться против тебя, но не одолеют тебя, потому что Я с тобой, чтобы спасти и избавить тебя, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неприступной бронзовой стеной».'
    reason: Слово בְּצוּרָה может подчёркивать как укреплённость, так и недоступность, неприступность стены; возможен и более компактный порядок определений.
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  choice: И Я сделаю тебя
  rationale: В конструкции с לְ и именной частью сказуемого נתן означает не просто «дать» или «поставить», а «сделать кем-либо/чем-либо».
- source_word: לָעָם הַזֶּה
  choice: для этого народа
  rationale: Передаёт отношение Иеремии к народу без внесения отсутствующего в предлоге значения прямого противостояния; последующая строка поясняет, что народ будет сражаться против него.
- source_word: לְחוֹמַת נְחֹשֶׁת בְּצוּרָה
  choice: укреплённой стеной из бронзы
  rationale: Сохраняет образ стены, материал נְחֹשֶׁת и значение защищённости/неприступности у בְּצוּרָה; конструкция «из бронзы» естественна в современном русском.
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  choice: Они будут сражаться против тебя
  rationale: לחם с אֶל здесь обозначает направленное против кого-либо противоборство.
- source_word: וְלֹא יוּכְלוּ לָךְ
  choice: но не одолеют тебя
  rationale: Буквально выражает неспособность добиться успеха против Иеремии; «не одолеют» естественно передаёт идиоматический смысл.
- source_word: כִּי אִתְּךָ אֲנִי
  choice: потому что Я с тобой
  rationale: כִּי вводит основание обещанного исхода, а порядок слов подчёркивает присутствие Бога.
- source_word: לְהוֹשִׁיעֲךָ וּלְהַצִּילֶךָ
  choice: чтобы спасти и избавить тебя
  rationale: 'Сохраняет два близких, но различных глагола: ישע — «спасти», נצל — «избавить, вырвать из опасности»; общий объект естественно ставится после однородных инфинитивов.'
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — весомая пророческая формула, а имя יהוה передано как «Яхве» согласно прямому употреблению Божьего имени в исходном тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя יהוה; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Характер Божьего обещания Иеремии
  choice: народ будет сражаться против него, но не сможет его одолеть
  alternative: обещание отсутствия нападений или страданий
  rationale: Текст прямо сохраняет напряжение между реальностью противостояния и обещанием Божьего присутствия, спасения и избавления; он не обещает отсутствия борьбы.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным пророческим звучанием. Метафора сохранена без поясняющего расширения; местоимение «Я» написано с прописной буквы как обозначение говорящего Бога.
