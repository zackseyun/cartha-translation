  yaml_path: translation/ot/jeremiah/015/021.yaml
  text: And I will deliver you from the hand of evil men[c][b][a], and I will redeem you from the grasp of the ruthless.
translation:
  language: ru
  text: И Я избавлю тебя от руки злых людей[a] и выкуплю тебя из рук жестоких людей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от руки нечестивых».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «насильников»; также возможно: «безжалостных людей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  choice: И Я избавлю тебя
  rationale: Порода hифиль глагола נצל выражает спасение или избавление от непосредственной опасности; «избавлю» естественно звучит в современном русском и сохраняет пророческий регистр.
- source_word: מִיַּד
  choice: от руки
  rationale: Сохранён буквальный образ «руки» как власти и контроля; по-русски выражение понятно и соответствует параллельной образности стиха.
- source_word: רָעִים
  choice: злых людей
  rationale: Прилагательное мужского рода множественного числа употреблено субстантивно и обозначает нравственно злых человеческих противников; добавление «людей» делает смысл ясным.
- source_word: וּפְדִתִיךָ
  choice: и выкуплю тебя
  rationale: Глагол פדה означает освобождение посредством выкупа или избавление из чужой власти. «Выкуплю» сохраняет отличительный смысл корня и не сливает его с предшествующим נצל.
- source_word: מִכַּף
  choice: из хватки
  rationale: כף буквально означает ладонь или кисть, а в данном обороте — удерживающую власть. «Из хватки» естественно передаёт конкретный образ враждебного захвата.
- source_word: עָרִצִים
  choice: жестоких
  rationale: עָרִיץ обозначает безжалостного, насильственного и внушающего страх угнетателя. Субстантивированное «жестоких» передаёт качество противников, не сужая смысл до политических «тиранов».
theological_decisions:
- issue: Передача мужского множественного רָעִים
  choice: злых людей
  alternative: злых / нечестивых
  rationale: Контекст указывает на человеческих противников, а форма мужского рода позволяет прямо сказать «людей», не превращая выражение в абстрактное зло.
- issue: Различение נצל и פדה
  choice: избавлю… и выкуплю
  alternative: спасу… и освобожу
  rationale: Разные русские глаголы сохраняют смысловой параллелизм и особый оттенок פדה — освобождение из чужой власти, — не навязывая здесь разработанную доктрину искупления.
translation_notes:
  register: 'Современный литературный русский с достоинством пророческой речи. Местоимение «Я» написано с прописной буквы как речь Бога. Сохранены параллелизм и два разных образа власти: «рука» и «хватка».'
