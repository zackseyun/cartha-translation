  text: הֲ/יָרֹ֨עַ בַּרְזֶ֧ל בַּרְזֶ֛ל מִ/צָּפ֖וֹן וּ/נְחֹֽשֶׁת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/012.yaml
  text: Can iron break iron from the north[b][a], and bronze?
translation:
  language: ru
  text: Может ли железо сломать железо с севера[a] и бронзу[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Может ли железо разбить северное железо и бронзу?» Еврейская фраза очень сжата; слова «железо с севера» могут быть единым выражением, обозначающим особенно прочное железо.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «медь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָרֹעַ
  choice: Может ли … сломать
  rationale: Вопросительная частица הֲ и глагол от רעע образуют риторический вопрос. Применительно к металлу глагол означает физически «сломать, разбить», а не «сделать зло».
- source_word: בַּרְזֶל
  choice: железо
  rationale: Обычное русское соответствие названию металла.
- source_word: בַּרְזֶל מִצָּפוֹן
  choice: железо с севера
  rationale: Передаёт конструкцию буквально и сохраняет возможность понимать её как обозначение особо прочного железа, связанного с севером.
- source_word: וּנְחֹשֶׁת
  choice: и бронзу
  rationale: נְחֹשֶׁת может обозначать медь или бронзу; в данном контексте традиционное и вероятное значение — «бронза». Союз сохранён, как в сжатой еврейской формулировке.
