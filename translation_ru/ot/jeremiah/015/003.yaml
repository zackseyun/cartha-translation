base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/003.yaml
  text: 'And I will appoint over them four kinds[a], declares Yahweh: the sword to kill, the dogs to drag away[b], and the birds of the heavens and the beasts of the earth to devour and destroy.'
translation:
  language: ru
  text: «И Я поставлю против них четыре рода[a], — возвещает Яхве, — меч — чтобы убивать, псов — чтобы уволакивать, птиц небесных и зверей земных — чтобы пожирать и уничтожать».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «четыре семейства»; это слово здесь образно обозначает четыре рода орудий суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיהֶם
  choice: И Я поставлю над ними
  rationale: Глагол פקד с предлогом עַל здесь обозначает назначение или поставление враждебных сил над кем-либо. Такой перевод сохраняет образ Божьего распоряжения, не сводя выражение к более толковательному «накажу».
- source_word: אַרְבַּע מִשְׁפָּחוֹת
  choice: четыре рода[a]
  rationale: מִשְׁפָּחוֹת буквально означает «семейства, роды», но здесь образно обозначает четыре разряда орудий суда. «Рода» сохраняет метафору и при этом понятно как классификационное обозначение; буквальный оттенок пояснён в сноске.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современным литературным выражением «возвещает», а тетраграмматон — личным именем «Яхве».
- source_word: הַחֶרֶב לַהֲרֹג
  choice: меч, чтобы убивать
  rationale: Инфинитив цели передан явно. Простое «убивать» точно и естественно передаёт הרג.
- source_word: הַכְּלָבִים לִסְחֹב
  choice: псов, чтобы уволакивать
  rationale: סחב означает тащить или волочить; «уволакивать» естественно передаёт действие псов над телами, не добавляя отсутствующей в тексте идеи разрывания.
- source_word: עוֹף הַשָּׁמַיִם
  choice: птиц небесных
  rationale: Сохранён традиционно возвышенный, но понятный оборот, близкий к буквальному «птицы небес»; контекст допускает хищных или питающихся падалью птиц, однако это не уточняется в переводе.
- source_word: בֶּהֱמַת הָאָרֶץ
  choice: зверей земных
  rationale: Выражение передаёт животных суши как участников суда. «Звери» лучше соответствует грозному контексту, не вводя прямого уточнения «дикие», которого нет в еврейском тексте.
- source_word: לֶאֱכֹל וּלְהַשְׁחִית
  choice: чтобы пожирать и уничтожать
  rationale: В контексте אכל имеет усиленный смысл поедания жертв, поэтому выбрано «пожирать»; השחית сохранено отдельным однородным инфинитивом «уничтожать».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Характер действия, выраженного פקד с עַל
  choice: поставлю над ними
  alternative: накажу их / пошлю против них
  rationale: Формулировка сохраняет одновременно властное назначение четырёх сил и их враждебную направленность, не превращая многозначный глагол в однозначное обозначение наказания.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого звучания. Синтаксический параллелизм перечня и инфинитивы цели сохранены; подразумеваемое слово «губители» в основной текст не добавлено.
