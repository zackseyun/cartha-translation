  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֻמְלְלָ֞ה יֹלֶ֣דֶת הַ/שִּׁבְעָ֗ה נָפְחָ֥ה נַפְשָׁ֛/הּ באה שִׁמְשָׁ֛/הּ בְּ/עֹ֥ד יוֹמָ֖ם בּ֣וֹשָׁה וְ/חָפֵ֑רָה וּ/שְׁאֵֽרִיתָ֗/ם לַ/חֶ֧רֶב אֶתֵּ֛ן לִ/פְנֵ֥י אֹיְבֵי/הֶ֖ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/009.yaml
  text: She who bore seven has withered away[a]; she has breathed out her life. Her sun has gone down while it was still day. She is ashamed and humiliated. And the remnant of them I will give to the sword before their enemies[c][b], declares Yahweh.
translation:
  language: ru
  text: Изнемогла родившая семерых[a], испустила дух[b]. Солнце её зашло ещё среди дня[c]. Она постыжена и посрамлена. А остаток их Я отдам мечу перед их врагами, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мать семерых». В еврейском образе женщина с семью детьми считалась достигшей полноты материнского благословения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выдохнула свою душу (жизнь)».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «её солнце зашло, когда был ещё день» — поэтический образ преждевременного конца.'
    reason: cultural_note
lexical_decisions:
- source_word: אֻמְלְלָה
  choice: изнемогла
  rationale: Передаёт состояние полного упадка и угасания, выраженное глаголом, и естественно звучит в современной русской поэтической речи.
- source_word: יֹלֶדֶת הַשִּׁבְעָה
  choice: родившая семерых
  rationale: Сохраняет краткость и образность еврейского выражения; число семь подразумевает полноту плодовитости и прежнего благополучия.
- source_word: נָפְחָה נַפְשָׁהּ
  choice: испустила дух
  rationale: Естественная русская идиома смерти, сохраняющая образ последнего дыхания; буквальная телесность выражения отмечена в сноске.
- source_word: באה שִׁמְשָׁהּ בְּעוֹד יוֹמָם
  choice: Солнце её зашло ещё среди дня
  rationale: Сохраняет исходную метафору преждевременного конца и необычный личный образ «её солнца».
- source_word: בּוֹשָׁה וְחָפֵרָה
  choice: постыжена и посрамлена
  rationale: 'Передаёт парное усиление: переживание стыда и публичное бесчестие, не сводя два еврейских глагола к одному.'
- source_word: וּשְׁאֵרִיתָם
  choice: остаток их
  rationale: Сохраняет коллективный смысл уцелевшей части народа и заметный в оригинале переход от единственного числа женского образа к множественному.
- source_word: לַחֶרֶב אֶתֵּן
  choice: Я отдам мечу
  rationale: Точно воспроизводит устойчивую пророческую формулу суда и остаётся понятным по-русски.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: перед их врагами
  rationale: Сохраняет буквальное пространственное выражение и смысл беззащитной выдачи во власть врагов.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную пророческую формулу и непосредственно воспроизводит личное имя Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет его отличие от титула «Господь».
- issue: Переход от образа женщины к множественному числу
  choice: Сохранить «её», затем «их»
  alternative: Унифицировать местоимения как относящиеся к одной женщине или одному народу
  rationale: Исходный текст намеренно допускает напряжение между олицетворённой матерью и народом, чьи уцелевшие будут преданы мечу; перевод не устраняет этот переход.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой торжественности и поэтических образов. Формы «постыжена», «посрамлена» и «отдам мечу» слегка возвышенны, но понятны; архаические синтаксические обороты не используются.
