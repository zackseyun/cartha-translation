base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/004.yaml
  text: And I will make them a horror to all the kingdoms of the earth[a], because of Manasseh son of Hezekiah, king of Judah, because of what he did in Jerusalem.
translation:
  language: ru
  text: И Я сделаю их предметом ужаса для всех царств земли[a] из-за Манассии, сына Езекии, царя Иудеи, — за то, что он сделал в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ужасом»; также возможно: «тем, что внушает страх». Еврейское существительное обозначает то, что вызывает содрогание, страх или ужас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: И Я сделаю их
  rationale: В конструкции с последующим именным дополнением и ל глагол נתן передаёт значение «сделать, превратить в», а не просто «дать».
- source_word: לְזַוֲעָה
  choice: предметом ужаса
  rationale: Существительное обозначает то, что вызывает содрогание, страх или ужас. Такое выражение ясно показывает, что речь идёт о впечатлении, которое они будут производить на другие царства.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: для всех царств земли
  rationale: Предлог ל обозначает здесь отношение к царствам, в глазах которых они станут предметом ужаса.
- source_word: בִּגְלַל
  choice: из-за
  rationale: Предлог прямо указывает на причину грядущего суда.
- source_word: מְנַשֶּׁה בֶן יְחִזְקִיָּהוּ
  choice: Манассии, сына Езекии
  rationale: Имена переданы в принятой русской библейской форме, а родственная связь выражена непосредственно.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Естественная русская передача стандартного царского титула.
- source_word: עַל אֲשֶׁר עָשָׂה
  choice: за то, что он сделал
  rationale: Оборот конкретизирует причину суда, указывая на совершённые Манассией поступки.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места с традиционной русской формой топонима.
theological_decisions:
- issue: Суд над народом связан с грехами Манассии
  choice: Сохранена прямая причинная связь между грядущим судом и поступками Манассии.
  alternative: Представить Манассию лишь как исторический фон, не называя его поступки причиной суда.
  rationale: Еврейский текст дважды выражает причинность и тем самым прямо связывает участь народа с тем, что царь сделал в Иерусалиме. Перевод сохраняет эту богословскую напряжённость, не пытаясь её разрешить.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка «предметом ужаса» несколько формальна, но точна и понятна; она сохраняет причинный характер обеих еврейских конструкций и не сглаживает напряжённость коллективного суда.
