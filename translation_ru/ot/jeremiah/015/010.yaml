  text: אֽוֹי לִ֣/י אִמִּ֔/י כִּ֣י יְלִדְתִּ֗/נִי אִ֥ישׁ רִ֛יב וְ/אִ֥ישׁ מָד֖וֹן לְ/כָל הָ/אָ֑רֶץ לֹֽא נָשִׁ֥יתִי וְ/לֹא נָֽשׁוּ בִ֖/י כֻּלֹּ֥/ה מְקַלְלַֽו/נִי־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/010.yaml
  text: Woe to me[a], my mother, because you bore me, a man of strife and a man of contention to all the land. I have not lent, nor have they lent to me[b], yet every one of them curses me.
translation:
  language: ru
  text: Горе мне, мать моя, что ты родила меня человеком распри и раздора для всей страны![a] Я никому не давал взаймы и ни у кого не брал взаймы,[b] однако все проклинают меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вся земля».'
    reason: alternative_reading
  - marker: b
    text: 'Речь, вероятно, идёт о займах и долговых отношениях: Иеремия говорит, что не давал обычного житейского повода для такой вражды.'
    reason: cultural_note
lexical_decisions:
- source_word: אֽוֹי לִי
  choice: Горе мне
  rationale: Сильное восклицание скорби и бедствия; естественно и торжественно передаёт еврейское אוי с дательным местоимением.
- source_word: אִמִּי
  choice: мать моя
  rationale: Сохранено прямое обращение, придающее жалобе пророка личную и эмоциональную силу.
- source_word: כִּי יְלִדְתִּנִי
  choice: что ты родила меня
  rationale: После русского «горе мне» союз «что» естественно вводит причину плача и не утяжеляет фразу.
- source_word: אִישׁ רִיב וְאִישׁ מָדוֹן
  choice: человеком, с которым спорит и враждует
  rationale: Два близких существительных обозначают тяжбу, спор и противостояние. Предикативная передача по-русски яснее буквального «человеком спора и человеком раздора» и не представляет Иеремию непременно зачинщиком конфликтов.
- source_word: לְכָל הָאָרֶץ
  choice: вся страна
  rationale: В контексте Иеремии הָאָרֶץ вероятнее означает страну, то есть землю Иудеи; конструкция ל выражает отношение противостояния между пророком и её жителями.
- source_word: לֹא נָשִׁיתִי וְלֹא נָשׁוּ בִי
  choice: Я никому не давал взаймы и ни у кого не брал взаймы
  rationale: 'Симметрично передана лексика долговых отношений: пророк не был ни кредитором, ни должником, а значит, не дал обычного повода для вражды.'
- source_word: כֻּלֹּה מְקַלְלַוּנִי
  choice: однако все проклинают меня
  rationale: «Все» естественно передаёт совокупность жителей страны, а настоящее время отражает продолжающийся или обычный характер действия причастия.
theological_decisions:
- issue: Объём значения הָאָרֶץ
  choice: вся страна
  alternative: вся земля
  rationale: Контекст указывает прежде всего на Иудею, но возможное более широкое значение не исключается и отмечено в сноске; богословская универсализация не вносится.
- issue: Роль Иеремии в ריב и מדון
  choice: человек, с которым спорит и враждует вся страна
  alternative: человек спора и человек раздора для всей страны
  rationale: Еврейская именная конструкция допускает описание пророка как средоточия конфликта, не уточняя, что он сам виновен в распре. Выбранная формулировка соответствует последующему утверждению о всеобщих проклятиях и не снимает напряжения его служения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого плача. Синтаксис сделан естественным для широкой аудитории; параллелизм долговых выражений и сила заключительного обвинения сохранены.
