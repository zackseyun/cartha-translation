base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/006.yaml
  text: You have forsaken me[a], declares Yahweh; you keep going backward. So I have stretched out my hand against you and destroyed you[b]; I am weary of relenting.
translation:
  language: ru
  text: «Ты покинула Меня, — говорит Яхве, — ты всё идёшь вспять[a]. Я простёр Свою руку против тебя и погубил тебя; Я устал смягчать кару[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «назад идёшь». Образ движения вспять выражает продолжающееся отступление от Яхве.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отменять наказание», «передумывать». Еврейский глагол здесь означает отказываться от осуществления объявленного суда.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתְּ אֹתִי
  choice: Ты покинула Меня
  rationale: Глагол נטשׁ означает «оставить, покинуть, бросить». Форма женского рода сохранена, поскольку обращение направлено к олицетворённому народу или городу.
- source_word: נְאֻם יְהוָה
  choice: говорит Яхве
  rationale: נְאֻם — формула божественного речения; «говорит» естественно передаёт её в современном русском, а имя יְהוָה передано как «Яхве».
- source_word: אָחוֹר תֵּלֵכִי
  choice: продолжаешь идти назад
  rationale: 'Буквально: «назад идёшь». Несовершенный вид выражает продолжающееся или характерное действие; пространственный образ отступничества сохранён.'
- source_word: וָאַט אֶת־יָדִי עָלַיִךְ
  choice: Поэтому Я простёр на тебя руку
  rationale: נטה означает «простирать, протягивать», а рука, направленная на адресата, здесь служит образом враждебного суда. Союз передан следственным «поэтому» по контексту.
- source_word: וָאַשְׁחִיתֵךְ
  choice: и погубил тебя
  rationale: Hiphil от שׁחת означает «губить, разрушать». «Погубил» сохраняет силу высказывания и естественно относится как к народу, так и к городу.
- source_word: נִלְאֵיתִי הִנָּחֵם
  choice: Я устал отступать от кары
  rationale: לאה выражает утомление, а נחם в данном контексте — отказ от осуществления объявленного бедствия. Формулировка не приписывает Богу нравственного раскаяния, но сохраняет напряжение между судом и прежним смягчением кары.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Смысл הִנָּחֵם применительно к Богу
  choice: отступать от кары
  alternative: раскаиваться; передумывать; отменять наказание
  rationale: В пророческом контексте речь идёт о том, что Бог отказывается осуществлять или смягчает объявленный суд, а не раскаивается в нравственном проступке. Выбранный вариант сохраняет смысл и не устраняет напряжение текста.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Женский род обращения сохранён по еврейскому тексту. Образ простёртой руки и метафора движения назад оставлены без конфессионального истолкования.
