    rationale: В еврейском тексте стоит обычный повествовательный союз при глаголе; хотя связь с предшествующим обвинением очевидна, эксплицитное «поэтому» несколько усиливает причинно-следственную связь, не выраженную непосредственно.
  - severity: medium
    issue: «Простёр на тебя руку»
    rationale: Конструкция עַל в этом контексте обозначает направленность враждебного действия против адресата. «Простёр Свою руку против тебя» точнее передаёт образ и естественнее по-русски.
  - severity: medium
    issue: «Устал отступать от кары»
    rationale: Формула может быть понята как отступление от самой кары, но звучит менее ясно. «Устал смягчать кару» естественно выражает релентацию от объявленного наказания, не приписывая Богу нравственного раскаяния.
