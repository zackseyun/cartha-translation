id: JER.15.1
reference: Jeremiah 15:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אִם יַעֲמֹ֨ד מֹשֶׁ֤ה וּ/שְׁמוּאֵל֙ לְ/פָנַ֔/י אֵ֥ין נַפְשִׁ֖/י אֶל הָ/עָ֣ם הַ/זֶּ֑ה שַׁלַּ֥ח מֵֽ/עַל פָּנַ֖/י וְ/יֵצֵֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/001.yaml
  text: Then Yahweh said to me[a], “Even if Moses and Samuel were to stand before me, my soul would not be toward this people. Send them away from before me[b], and let them go out.”
translation:
  language: ru
  text: 'И сказал мне Яхве: «Даже если Моисей и Самуил предстанут предо Мною, душа Моя не будет расположена к этому народу[a]. Отошли их от лица Моего[b], и пусть они уйдут».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «Я не буду расположен к этому народу» или «Я не проявлю благосклонности к этому народу».'
    reason: Лексическая альтернатива для буквального антропоморфного выражения «душа Моя».
  - marker: b
    text: То есть «из Моего присутствия».
    reason: Пояснение буквального еврейского выражения «от лица Моего».
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом «Господь».
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: И сказал мне
  rationale: Сохраняет повествовательную последовательность еврейской формы и естественно звучит по-русски.
- source_word: אִם יַעֲמֹד
  choice: Даже если ... предстанут
  rationale: «Даже если» передаёт уступительно-гипотетическую силу אִם; множественное число в русском согласовано с двумя названными лицами.
- source_word: יַעֲמֹד ... לְפָנַי
  choice: предстанут предо Мною
  rationale: Сохраняет образ стояния перед Богом и возможный намёк на ходатайство, не вводя слово «ходатайствовать», которого в тексте нет.
- source_word: מֹשֶׁה וּשְׁמוּאֵל
  choice: Моисей и Самуил
  rationale: Употреблены традиционные и общеизвестные русские формы библейских имён.
- source_word: אֵין נַפְשִׁי אֶל־הָעָם הַזֶּה
  choice: душа Моя не будет расположена к этому народу
  rationale: Слово «душа» сохраняет антропоморфный образ נַפְשִׁי, а «не будет расположена к» естественно передаёт направленность личного отношения, выраженную אֶל.
- source_word: שַׁלַּח
  choice: Отошли их
  rationale: Передаёт повеление удалить народ; местоимение «их» необходимо для ясности по-русски и восстанавливает подразумеваемый из контекста объект.
- source_word: מֵעַל פָּנַי
  choice: от лица Моего
  rationale: Сохраняет конкретный еврейский образ; более идиоматический смысл указан в сноске.
- source_word: וְיֵצֵאוּ
  choice: и пусть они уйдут
  rationale: Передаёт побудительно-желательную силу формы после повеления и не уточняет сверх текста, откуда именно народ должен уйти.
theological_decisions:
- issue: Антропоморфное выражение נַפְשִׁי применительно к Яхве
  choice: 'Сохранено слово «душа»: «душа Моя не будет расположена к этому народу».'
  alternative: «Я не буду благосклонен к этому народу» или «Я не стану внимать этому народу».
  rationale: Так сохраняется яркая образность исходного текста без догматических выводов о природе Бога; при этом русская фраза остаётся понятной.
- issue: Возможный ходатайственный смысл стояния Моисея и Самуила перед Яхве
  choice: «предстанут предо Мною»
  alternative: «будут ходатайствовать предо Мною» или «станут умолять Меня»
  rationale: Моисей и Самуил известны как ходатаи, однако еврейский текст прямо говорит лишь о стоянии перед Богом. Перевод сохраняет подразумеваемый смысл, не превращая его в явное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «предо Мною» и «от лица Моего» сохраняют параллельную образность לְפָנַי / מֵעַל פָּנַי, а остальная фраза построена естественно и понятно для современного читателя.
