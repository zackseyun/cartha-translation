base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/007.yaml
  text: I winnowed them with a winnowing fork at the gates of the land[a]; I bereaved, I destroyed my people[b]; they did not turn back from their ways.
translation:
  language: ru
  text: Я провеял их веяльной лопатой у ворот страны[a]; Я оставил их без детей, погубил Мой народ; они не отступили от своих путей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у ворот земли». Еврейское слово может означать как конкретную страну, так и землю вообще; здесь контекст указывает прежде всего на страну Иудеи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не раскаялись в своих поступках». Буквально говорится о том, что они не повернули назад, не оставили своих путей; в пророческой речи это может означать покаяние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶזְרֵם
  choice: Я провеял их
  rationale: Глагол זרה обозначает веяние зерна и его рассеивание; «провеял» сохраняет земледельческий образ и естественно сочетается с названным далее орудием.
- source_word: בְּמִזְרֶה
  choice: веяльной лопатой
  rationale: מִזְרֶה — орудие для веяния зерна. «Веяльная лопата» передаёт конкретный образ понятнее, чем устаревшее «веяло».
- source_word: בְּשַׁעֲרֵי הָאָרֶץ
  choice: у ворот страны
  rationale: «У ворот» естественно передаёт местное значение предлога; הָאָרֶץ в контексте суда над Иудеей вероятнее означает страну, хотя возможно и более широкое «земля».
- source_word: שִׁכַּלְתִּי
  choice: оставил без детей
  rationale: Глагол выражает причинение утраты детей, то есть лишение потомства; такая формулировка ясна по-русски и не добавляет неуказанного объекта.
- source_word: אִבַּדְתִּי
  choice: погубил
  rationale: Каузативное значение от אבד прямо выражает уничтожение или причинение гибели; «погубил» естественно в контексте Божьего суда.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Прямое соответствие еврейскому заветному выражению; прописная буква в притяжательном местоимении указывает на говорящего Бога согласно русской библейской издательской норме.
- source_word: מִדַּרְכֵיהֶם
  choice: от своих путей
  rationale: «Пути» сохраняют еврейскую метафору образа жизни; возвратное «своих» естественно соотносит пути с подлежащим русского предложения.
- source_word: לֹא שָׁבוּ
  choice: не отвернулись
  rationale: שׁוּב означает повернуть назад или возвратиться и в пророческой речи может подразумевать покаяние. «Не отвернулись от своих путей» сохраняет образ поворота и его нравственный смысл, не заменяя его богословским термином.
theological_decisions:
- issue: Следует ли передавать שׁוּב прямо как покаяние
  choice: они не отвернулись от своих путей
  alternative: они не раскаялись в своих поступках
  rationale: Исходный глагол шире специального понятия покаяния и сохраняет метафору поворота. Основной текст передаёт эту образность, а нравственно-покаянный оттенок отмечен в сноске.
- issue: Как понимать הָאָרֶץ в формуле «ворота земли/страны»
  choice: у ворот страны
  alternative: у ворот земли
  rationale: Непосредственный контекст суда над народом Иудеи поддерживает значение «страна», но семантическая широта слова не устраняется и отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены земледельческий образ веяния, резкие параллельные глаголы суда и метафора нравственного поворота; синтаксис остаётся сжатым, без конфессиональной конкретизации.
