  terminology: «Яхве» последовательно передаёт тетраграмматон. «Бедствие» и «скорбь» приемлемо передают רָעָה и צָרָה в данном контексте, не превращая их в обозначения морального зла. Сноски точно представляют существенные альтернативы без конфессионального истолкования.
