source:
  edition: WLC
  text: אָמַ֣ר יְהוָ֔ה אִם לֹ֥א שרות/ך לְ/ט֑וֹב אִם ל֣וֹא הִפְגַּ֣עְתִּֽי בְ/ךָ֗ בְּ/עֵ֥ת רָעָ֛ה וּ/בְ/עֵ֥ת צָרָ֖ה אֶת הָ/אֹיֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/011.yaml
  text: Yahweh said[a], “Surely I have set you free for good[b]; surely I have made the enemy plead with you in a time of disaster and in a time of distress.”
translation:
  language: ru
  text: 'Яхве сказал: «Воистину, Я освободил тебя во благо[a]; воистину, Я заставил врага обратиться к тебе с мольбой во время бедствия и во время скорби[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст первой части неясен. Возможны переводы: «Воистину, Я отпустил тебя во благо» или, при ином понимании формы, «Воистину, Я укрепил остаток во благо».'
    reason: textual_variant
  - marker: b
    text: 'Или: «Воистину, Я заступился за тебя перед врагом во время бедствия и во время скорби».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога принятой в современной русской библеистике формой, не заменяя его титулом.
- source_word: אִם לֹא ... אִם לוא
  choice: воистину ... воистину
  rationale: В данном контексте сочетание частиц выражает усиленное, близкое к клятвенному заверение, а не обычное условие «если не».
- source_word: שרותך
  choice: Я освободил тебя
  rationale: Форма трудна и допускает разные толкования; выбранное чтение передаёт вероятный смысл освобождения или избавления Иеремии, не скрывая неопределённости, отмеченной в сноске.
- source_word: לְטוֹב
  choice: во благо
  rationale: Кратко и естественно выражает благой результат или цель действия.
- source_word: הִפְגַּעְתִּי בְךָ
  choice: Я заставил ... обратиться к тебе с мольбой
  rationale: Каузативная форма פגע в этом контексте может обозначать побуждение врага просить или умолять Иеремию; выражение передано естественным современным русским языком.
- source_word: אֶת הָאֹיֵב
  choice: врага
  rationale: Сохраняет определённое существительное в единственном числе, которое может иметь собирательный смысл.
- source_word: בְּעֵת רָעָה
  choice: во время бедствия
  rationale: Здесь רָעָה обозначает пагубные обстоятельства, а не нравственное зло.
- source_word: וּבְעֵת צָרָה
  choice: и во время скорби
  rationale: Передаёт беду, тесноту и тяжёлое положение, сохраняя параллелизм с «бедствием».
theological_decisions:
- issue: Толкование трудного и текстуально спорного обещания Иеремии
  choice: Стих передан как заверение Бога, что Он освободил Иеремию ему во благо и побудил врага обратиться к нему с мольбой во время бедствия.
  alternative: Первая часть может означать «Я укрепил остаток во благо»; вторая — «Я заступился за тебя перед врагом».
  rationale: Выбранное чтение согласуется с контекстом будущего оправдания Иеремии, однако еврейский текст действительно допускает иные разборы, поэтому они сохранены в сносках без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной речью. Повтор «воистину» сохраняет усиленное заверение оригинала; подлинная неопределённость трудных еврейских форм вынесена в сноски.
