  source_fidelity: 'Передача следует вероятному смыслу трудных форм масоретского текста: усилительное אִם־לֹא адекватно передано повтором «воистину», לְטוֹב — как благоприятный результат, а הִפְגַּעְתִּי ... אֶת־הָאֹיֵב — как побуждение врага обратиться с мольбой. Подлинная неопределённость первого глагола и альтернативное понимание второй части не устранены, а отражены в сносках.'
