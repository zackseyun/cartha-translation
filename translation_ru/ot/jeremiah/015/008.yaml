base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/008.yaml
  text: Their widows have become more numerous to me than the sand of the seas. I have brought against them, against the mother of a young man, a destroyer at noon; I have suddenly made city and terrors fall upon her.
translation:
  language: ru
  text: Вдов у них стало у Меня больше, чем песка в морях. Я навёл на них, на мать юноши, разорителя среди бела дня; внезапно Я обрушил на неё город[a] и ужасы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по масоретскому тексту: «город». Смысл выражения неясен; предлагаемые переводы вроде «мука» основаны на исправлении или ином истолковании еврейского текста.'
    reason: Необычное сочетание «обрушил на неё город и ужасы» требует обозначить подлинную текстовую и смысловую трудность, не устраняя её из основного перевода.
lexical_decisions:
- source_word: עָצְמוּ לִי
  choice: стало предо Мною больше
  rationale: Передаёт непереходное значение «стали многочисленны, умножились» и сохраняет обращённость к говорящему в לִי, не превращая Бога прямо в грамматического виновника умножения вдов.
- source_word: מֵחוֹל יַמִּים
  choice: чем песка в морях
  rationale: Естественное русское выражение для сравнительной конструкции; множественное число «морях» соответствует יַמִּים.
- source_word: עַל אֵם בָּחוּר
  choice: на мать юноши
  rationale: Сохраняет синтаксически трудное, но ясное буквальное чтение масоретского текста, не подменяя единственное число собирательным.
- source_word: שֹׁדֵד בַּצָּהֳרָיִם
  choice: разорителя среди бела дня
  rationale: «Разоритель» передаёт действующее лицо от שׁדד, а «среди бела дня» естественно выражает неожиданность нападения в полдень.
- source_word: עִיר וּבֶהָלוֹת
  choice: город и ужасы
  rationale: Основной текст сохраняет вокализацию WLC עִיר «город», несмотря на трудность сочетания; неоднозначность отмечена сноской.
theological_decisions:
- issue: Божье действие и человеческое бедствие
  choice: 'Сохранить формы первого лица: «Я навёл», «Я обрушил»'
  alternative: Передать безлично или ослабить до Божьего попущения
  rationale: Еврейский текст прямо приписывает эти судебные действия говорящему; перевод не должен смягчать богословское напряжение.
- issue: Неясный объект внезапно обрушиваемого суда
  choice: «город и ужасы» с пояснительной сноской
  alternative: «муку и ужасы» либо «волнение и ужасы»
  rationale: Масоретская огласовка означает «город»; конъектуральное исправление ради гладкости не следует молча вводить в основной текст.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. «Предо Мною» выбрано как умеренно возвышенная, но понятная форма; «среди бела дня» — естественный современный оборот. Необычность последней строки намеренно сохранена из-за трудности масоретского текста.
