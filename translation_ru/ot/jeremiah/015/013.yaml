base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/013.yaml
  text: Your wealth and your treasures I will give as plunder[a], without price, because of all your sins[b], throughout all your territory.
translation:
  language: ru
  text: Твоё богатство и твои сокровища Я отдам на разграбление, без всякой платы[a], за все твои грехи[b], по всей твоей земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не за цену», то есть без оплаты или возмещения.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст буквально: «во всех твоих грехах и во всех твоих пределах». Здесь первый оборот передан как указание на причину суда, а второй — как указание на то, что он охватит всю землю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילְךָ
  choice: твоё богатство
  rationale: חַיִל может означать силу, войско или материальные средства; параллелизм с «сокровищами» и контекст их захвата указывают здесь на богатство.
- source_word: וְאוֹצְרוֹתֶיךָ
  choice: и твои сокровища
  rationale: Слово обозначает накопленные ценности либо сокровищницы; в данном контексте речь идёт о ценностях, отдаваемых врагу.
- source_word: לָבַז
  choice: на разграбление
  rationale: Сочетание с נתן означает отдать как добычу, позволить разграбить; выбран естественный русский оборот.
- source_word: אֶתֵּן
  choice: Я отдам
  rationale: Имперфект 1-го лица единственного числа в пророческом возвещении передаёт будущее действие; «отдам» также выражает передачу во власть захватчика.
- source_word: לֹא בִמְחִיר
  choice: без платы
  rationale: Буквально «не за цену»; смысл — без выкупа, оплаты или возмещения.
- source_word: וּבְכָל חַטֹּאותֶיךָ
  choice: за все твои грехи
  rationale: Предлог ב в контексте суда естественно понимается как указывающий на причину; «за» кратко передаёт связь наказания с грехами.
- source_word: וּבְכָל גְּבוּלֶיךָ
  choice: по всей твоей земле
  rationale: גְּבוּל обозначает границу, пределы или ограниченную ими территорию; здесь имеется в виду вся земля Иудеи.
theological_decisions:
- issue: Значение заключительных предложных оборотов в пророчестве о суде
  choice: Утрата богатства происходит за грехи и охватывает всю землю адресата.
  alternative: 'Более буквально: «и со всеми твоими грехами, и во всех твоих пределах», без явного обозначения причинной связи.'
  rationale: Контекст пророчества о суде допускает причинное значение ב, однако неоднозначность еврейской конструкции отмечена в сноске, а не устранена без оговорки.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной пророческой интонацией. Сохранено обращение во 2-м лице единственного числа и подчёркнутое «Я» говорящего.
