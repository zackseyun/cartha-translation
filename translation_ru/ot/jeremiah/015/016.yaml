  source_fidelity: 'Основные соответствия исходному тексту сохранены: множественное «слова», пассивное «были найдены», буквальная метафора «съел их», повтор «слова» и имя «Яхве». Однако «твоё имя наречено надо мной» в современном русском не является удачным или ясным способом передать еврейскую формулу; глагол «наречь» обычно требует лица, которому дают имя, и эта конструкция может быть понята неверно.'
  naturalness: «Были найдены» и «съел их» допустимо сохраняют намеренную буквальность. «Ликование моего сердца» возможно, но звучит несколько приподнято и менее точно передаёт внутреннюю «радость/отраду». Формула «надо мной провозглашено твоё имя» сохраняет пространственный образ עָלַי и в то же время естественнее по-русски.
  terminology: '«Яхве» последовательно передаёт тетраграмматон. «Бог воинств» следует писать со строчной буквы во втором слове: это нарицательное существительное в составе титула, а не собственное имя. Сноска должна предлагать идиоматический вариант, не закрепляя интерпретацию формулой «то есть».'
  issues:
