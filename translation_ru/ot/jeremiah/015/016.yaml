base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/016.yaml
  text: Your words were found[a], and I ate them, and your words became for me a joy and the delight of my heart, for your name is called over me, O Yahweh, God of hosts.
translation:
  language: ru
  text: Твои слова были найдены, и я съел их; твои слова стали для меня радостью и отрадой моего сердца, потому что надо мной провозглашено твоё имя[a], Яхве, Бог воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «я назван твоим именем».'
    reason: Передаёт естественный русский смысл еврейской формулы, тогда как основной текст сохраняет её образ «имя ... надо мной».
lexical_decisions:
- source_word: נִמְצְאוּ
  choice: были найдены
  rationale: Сохраняет пассивную форму нифаля и не добавляет отсутствующего в тексте указания на того, кто нашёл слова.
- source_word: דְבָרֶיךָ
  choice: твои слова
  rationale: Передаёт множественное число еврейского существительного и его повтор в стихе.
- source_word: וָאֹכְלֵם
  choice: я съел их
  rationale: Сохраняет яркую метафору буквального вкушения Божьих слов, не заменяя её толкованием.
- source_word: וַיְהִי דְבָרֶיךָ לִי
  choice: твои слова стали для меня
  rationale: «Стали» передаёт результат или переход к новому переживанию; «для меня» естественно выражает личный опыт пророка.
- source_word: לְשָׂשׂוֹן
  choice: радостью
  rationale: Естественная передача значения сильной радости без излишней архаизации.
- source_word: וּלְשִׂמְחַת לְבָבִי
  choice: и ликованием моего сердца
  rationale: Передаёт внутреннюю сердечную радость и позволяет сохранить параллельные, но не тождественные обозначения радости.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит причину радости Иеремии.
- source_word: נִקְרָא שִׁמְךָ עָלַי
  choice: твоё имя наречено надо мной
  rationale: Сохраняет пассивную конструкцию и пространственный образ עַל, обозначающий принадлежность и отождествление, не сводя его сразу к одному толкованию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бог Воинств
  rationale: Сохраняет широту традиционного библейского титула и не ограничивает צְבָאוֹת только земными армиями.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Заветная формула נִקְרָא שִׁמְךָ עָלַי
  choice: твоё имя наречено надо мной
  alternative: я назван твоим именем
  rationale: Основной текст сохраняет образную и грамматическую форму еврейского выражения, а более ясное идиоматическое значение приводится в сноске, чтобы не устранить многозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Метафора вкушения сохранена буквально; архаизирующее «наречено» оставлено в устойчивой сакральной формуле, поскольку оно точно и кратко передаёт пассивную конструкцию. Обращение передано без междометия «о», которое в современном русском звучало бы неестественно.
