source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה אִם תָּשׁ֤וּב וַ/אֲשִֽׁיבְ/ךָ֙ לְ/פָנַ֣/י תַּֽעֲמֹ֔ד וְ/אִם תּוֹצִ֥יא יָקָ֛ר מִ/זּוֹלֵ֖ל כְּ/פִ֣/י תִֽהְיֶ֑ה יָשֻׁ֤בוּ הֵ֨מָּה֙ אֵלֶ֔י/ךָ וְ/אַתָּ֖ה לֹֽא תָשׁ֥וּב אֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/019.yaml
  text: 'Therefore[a], this is what Yahweh says: If you return, I will restore you, and you will stand before me. If you bring out the precious from the worthless, you will be as my mouth. They will turn to you[c][b], but you must not turn to them.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве: «Если ты вернёшься, Я восстановлю тебя, и ты будешь стоять предо Мной. Если ты извлечёшь драгоценное из ничтожного[a], то будешь как Мои уста[b]. Они обратятся к тебе, а ты не возвращайся к ним».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вероятно, речь идёт о том, чтобы извлекать достойные слова из недостойных; ср. продолжение: «будешь как Мои уста».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будешь Моим глашатаем». Буквально: «будешь как Мои уста».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт логический вывод и сохраняет торжественный пророческий тон.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет устойчивую формулу пророческой речи; личное имя יהוה передано транслитерацией «Яхве».
- source_word: אִם תָּשׁוּב וַאֲשִׁיבְךָ
  choice: Если ты вернёшься, Я восстановлю тебя
  rationale: Повтор корня שׁוב частично сохраняется смысловой связью «вернёшься — восстановлю»; первая форма оставляет открытым оттенок возвращения или покаяния, а каузативная вторая указывает на восстановление Богом.
- source_word: לְפָנַי תַּעֲמֹד
  choice: будешь стоять предо Мной
  rationale: Буквально сохраняет образ стояния перед Богом, не сводя его явно к служению или принятию.
- source_word: וְאִם תּוֹצִיא יָקָר מִזּוֹלֵל
  choice: Если ты отделишь драгоценное от ничтожного
  rationale: Глагол буквально означает «выведешь/извлечёшь»; «отделишь» естественно передаёт образ извлечения ценного из негодного, не ограничивая его только речью.
- source_word: כְּפִי תִהְיֶה
  choice: будешь как Мои уста
  rationale: Сохранена яркая буквальная метафора уполномоченной Божьей речи.
- source_word: יָשֻׁבוּ הֵמָּה אֵלֶיךָ
  choice: Они обратятся к тебе
  rationale: Имперфект понят как обещание; «обратятся» передаёт направленное к Иеремии изменение без излишнего уточнения.
- source_word: וְאַתָּה לֹא תָשׁוּב אֲלֵיהֶם
  choice: но ты не обращайся к ним
  rationale: Повелительная формулировка естественно передаёт запрет и подчёркивает контраст с обращением народа к пророку.
theological_decisions:
- issue: Характер возвращения Иеремии и его восстановления
  choice: Сохранить широкое «вернёшься» и Божье «восстановлю тебя».
  alternative: Передать как прямой призыв к покаянию либо исключительно как повторное призвание к пророческому служению.
  rationale: Контекст допускает как исправление настроя и речи Иеремии, так и восстановление его пророческого положения; текст не должен искусственно выбирать лишь один оттенок.
- issue: Смысл отделения драгоценного от ничтожного
  choice: Сохранить метафору в основном тексте и пояснить вероятную связь с речью в сноске.
  alternative: 'Перевести толковательно: «если будешь говорить достойное, а не пустое» или отнести слова к отделению праведных от нечестивых.'
  rationale: Следующая фраза о Божьих устах поддерживает речевой смысл, однако еврейский образ шире и не требует его полного разрешения в переводе.
- issue: «Будешь как Мои уста»
  choice: Сохранить буквальный образ.
  alternative: «Будешь Моим глашатаем».
  rationale: Буквальная метафора выражает уполномоченную пророческую речь и сохраняет образность оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Формы «предо Мной» и «Мои уста» сохраняют достоинство и образность, оставаясь понятными современному читателю. Местоимения, относящиеся к Богу, написаны с прописной буквы в рамках принятой русской библейской традиции.
