source:
  edition: WLC
  text: אַתָּ֧ה יָדַ֣עְתָּ יְהוָ֗ה זָכְרֵ֤/נִי וּ/פָקְדֵ֨/נִי֙ וְ/הִנָּ֤קֶם לִ/י֙ מֵ/רֹ֣דְפַ֔/י אַל לְ/אֶ֥רֶךְ אַפְּ/ךָ֖ תִּקָּחֵ֑/נִי דַּ֕ע שְׂאֵתִ֥/י עָלֶ֖י/ךָ חֶרְפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/015.yaml
  text: You know[a], O Yahweh; remember me and attend to me, and take vengeance for me on my persecutors. In your patience do not take me away[d][c][b]; know that for your sake I bear reproach.
translation:
  language: ru
  text: 'Ты знаешь, Яхве! Вспомни меня, обрати на меня внимание[a] и отомсти за меня моим гонителям[b]. В долготерпении Твоём не забери меня[c]. Знай: ради Тебя я терплю поношение[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «посети меня», «призри на меня» или «позаботься обо мне». Еврейский глагол פקד может означать внимание, попечение или деятельное вмешательство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отомсти за меня тем, кто меня преследует».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «Не забери меня при долготе Твоего гнева». «Долгота гнева» — еврейская идиома, означающая долготерпение, медленность на гнев. Возможный смысл: «Не допусти, чтобы из-за Твоего долготерпения я погиб».'
    reason: idiom_and_ambiguity
  - marker: d
    text: 'Или: «Знай, что из-за Тебя я терплю поношение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом «Господь».
- source_word: זָכְרֵנִי
  choice: вспомни меня
  rationale: Сохраняет прямую форму мольбы; в данном контексте «вспомнить» подразумевает также действие в пользу молящегося, но этот смысл не развёрнут в переводе.
- source_word: וּפָקְדֵנִי
  choice: обрати на меня внимание
  rationale: Глагол פקד здесь выражает просьбу о деятельном внимании и вмешательстве Бога. Выбранная формулировка естественна по-русски и не сужает значение до одного из оттенков — «посетить» или «позаботиться».
- source_word: וְהִנָּקֶם לִי מֵרֹדְפַי
  choice: отомсти за меня моим гонителям
  rationale: Сохраняет явный смысл божественного возмездия в נקם и направленность действия против преследующих Иеремию, не смягчая просьбу до общего оправдания пророка.
- source_word: מֵרֹדְפַי
  choice: моим гонителям
  rationale: רדף буквально связано с преследованием; «гонители» естественно передаёт враждебное преследование в контексте пророческой жалобы.
- source_word: אַל לְאֶרֶךְ אַפְּךָ תִּקָּחֵנִי
  choice: В долготерпении Твоём не забери меня
  rationale: «Долготерпение» передаёт идиому אֶרֶךְ אַף — букв. «долгота гнева», то есть медленность на гнев. «Не забери меня» сохраняет образ глагола לקח и возможный смысл преждевременной гибели, не уточняя его сверх текста.
- source_word: דַּע
  choice: знай
  rationale: Сохраняет прямой императив и смысловую перекличку с начальным «Ты знаешь».
- source_word: שְׂאֵתִי
  choice: я терплю
  rationale: Форма от נשׂא здесь означает несение или перенесение поношения; «терплю» звучит естественно в современном русском и передаёт продолжающееся страдание.
- source_word: עָלֶיךָ חֶרְפָּה
  choice: ради Тебя я терплю поношение
  rationale: Передаёт связь поношения пророка с Яхве, сохраняя традиционную и понятную формулу; возможный причинный оттенок «из-за Тебя» отмечен в сноске.
theological_decisions:
- issue: Характер просьбы Иеремии о возмездии
  choice: Прямая просьба «отомсти за меня» сохранена как обращение к Божьему суду.
  alternative: «Защити мою правоту» или «оправдай меня»
  rationale: Еврейский נקם явно обозначает возмездие или отмщение. Перевод не смягчает нравственно и богословски напряжённую просьбу и в то же время не превращает её в призыв Иеремии к личной мести.
- issue: Связь Божьего долготерпения с угрозой жизни пророка
  choice: Сохранена сжатая формулировка «В долготерпении Твоём не забери меня».
  alternative: «Не допусти, чтобы из-за Твоего долготерпения меня погубили»
  rationale: 'Еврейская конструкция неоднозначна: грамматически Бог является субъектом «не забери», однако по смыслу задержка суда над гонителями угрожает пророку. Основной текст сохраняет эту напряжённость, а сноска поясняет идиому и вероятный смысл.'
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис остаётся кратким и настойчивым, как в еврейском плаче. Заглавные местоимения при обращении к Богу использованы как русская благоговейная издательская конвенция; имя Яхве передано непосредственно.
