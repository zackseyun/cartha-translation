id: JER.17.26
reference: Jeremiah 17:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בָ֣אוּ מֵ/עָרֵֽי יְ֠הוּדָה וּ/מִ/סְּבִיב֨וֹת יְרוּשָׁלִַ֜ם וּ/מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מִן הַ/שְּׁפֵלָ֤ה וּ/מִן הָ/הָר֙ וּ/מִן הַ/נֶּ֔גֶב מְבִאִ֛ים עוֹלָ֥ה וְ/זֶ֖בַח וּ/מִנְחָ֣ה וּ/לְבוֹנָ֑ה וּ/מְבִאֵ֥י תוֹדָ֖ה בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/026.yaml
  text: And they will come from the cities of Judah and from the areas around Jerusalem[a], and from the land of Benjamin, and from the lowland, and from the hill country, and from the Negeb, bringing burnt offerings and sacrifices, grain offerings and frankincense[c][b], and bringing thank offerings to the house of Yahweh.
translation:
  language: ru
  text: И будут приходить из городов Иудеи, из окрестностей Иерусалима, из земли Вениамина, из Шефелы[a], из горной области и из Негева[b], принося всесожжения и жертвы, хлебные приношения и ладан, и принося благодарственные жертвы в дом Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шефела — холмистая предгорная низменность Иудеи.
    reason: geographical_note
  - marker: b
    text: 'Или: «юга»; Негев — название южной области Иудеи.'
    reason: lexical_alternative
  - marker: c
    text: То есть в храм Яхве.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאוּ
  choice: И будут приходить
  rationale: Перфект с союзом в данном пророческом контексте передаёт будущее действие; «и» сохраняет связь с предшествующим обещанием.
- source_word: מֵעָרֵי יְהוּדָה
  choice: из городов Иудеи
  rationale: Передаёт обычное значение עָרִים и ясно указывает на города области Иудеи.
- source_word: וּמִסְּבִיבוֹת יְרוּשָׁלַם
  choice: из окрестностей Иерусалима
  rationale: סְבִיבוֹת обозначает окружающую местность; «окрестности» естественно и точно звучит по-русски.
- source_word: וּמֵאֶרֶץ בִּנְיָמִן
  choice: из земли Вениамина
  rationale: אֶרֶץ здесь означает территорию, связанную с коленом Вениамина; сохранена традиционная библейская формулировка.
- source_word: הַשְּׁפֵלָה
  choice: Шефела
  rationale: В географическом перечне это название Иудейской предгорной низменности; транслитерация сохраняет топонимический характер, а сноска поясняет значение.
- source_word: הָהָר
  choice: горная область
  rationale: В региональном перечне слово обозначает гористую область Иудеи, а не отдельную гору.
- source_word: הַנֶּגֶב
  choice: Негев
  rationale: Сохранено название южной области; сноска отмечает также буквальное пространственное значение.
- source_word: מְבִאִים
  choice: принося
  rationale: Причастие описывает действие, сопровождающее приход людей, и естественно связывает его с перечнем даров.
- source_word: עוֹלָה
  choice: всесожжения
  rationale: Культовый термин обозначает жертву, целиком сжигаемую на жертвеннике; единственное число в еврейском имеет собирательное значение.
- source_word: זֶבַח
  choice: жертвы
  rationale: Обозначает закалываемые жертвы как отдельную категорию; множественное число естественно при множестве приносящих.
- source_word: מִנְחָה
  choice: хлебные приношения
  rationale: В культовом перечне слово обозначает приношения из муки или зерна; «хлебные приношения» — понятный и традиционно уместный русский термин.
- source_word: לְבוֹנָה
  choice: ладан
  rationale: Точное русское название ароматической смолы, употреблявшейся при богослужении.
- source_word: תּוֹדָה
  choice: благодарственные жертвы
  rationale: В храмовом контексте слово обозначает приношение в знак благодарности, а не только словесную благодарность.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, тетраграмматон; форма «Яхве» прямо передаёт имя и не заменяет его титулом.
- issue: Значение בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: Основной текст сохраняет буквальный и богословски значимый образ «дома», а сноска поясняет, что речь идёт о храме.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Географический перечень сохранён без упрощения, культовые термины переданы понятно, но точно. Все сноски поставлены непосредственно при поясняемых словах.
