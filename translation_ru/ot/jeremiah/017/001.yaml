base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/001.yaml
  text: The sin of Judah is written with an iron stylus[a]; with a diamond point it is engraved on the tablet of their heart and on the horns of your altars.
translation:
  language: ru
  text: Грех Иуды записан железным резцом; остриём из чрезвычайно твёрдого вещества[a] он высечен на скрижали их сердец и на рогах ваших жертвенников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «алмазным остриём» или «остриём из адаманта». Точное значение еврейского слова שָׁמִיר неизвестно; оно обозначает исключительно твёрдое вещество, пригодное для высекания надписей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: грех
  rationale: В контексте пророческого обличения речь идёт о нравственном грехе Иуды, а не о жертве за грех.
- source_word: כְּתוּבָה
  choice: записан
  rationale: 'Передаёт результирующее состояние, выраженное страдательным причастием: грех уже запечатлён письменно.'
- source_word: עֵט בַּרְזֶל
  choice: железным резцом
  rationale: «Резец» естественно передаёт орудие для нанесения надписи на твёрдую поверхность и сохраняет образ железного инструмента.
- source_word: צִפֹּרֶן שָׁמִיר
  choice: алмазным остриём
  rationale: צִפֹּרֶן здесь обозначает острый конец орудия, а שָׁמִיר — исключительно твёрдое вещество; точная минералогическая идентификация неясна и отмечена в сноске.
- source_word: חֲרוּשָׁה
  choice: высечен
  rationale: Глагольная форма усиливает образ записи, указывая на глубокое, стойкое начертание.
- source_word: לוּחַ לִבָּם
  choice: на скрижали их сердца
  rationale: «Скрижаль» сохраняет метафору поверхности для письма; единственное число «сердца» отражает собирательную форму еврейского текста.
- source_word: קַרְנוֹת מִזְבְּחוֹתֵיכֶם
  choice: на рогах ваших жертвенников
  rationale: Сохраняется общепринятое библейское обозначение выступов жертвенника и форма второго лица множественного числа.
theological_decisions:
- issue: Переход от третьего лица ко второму
  choice: «их сердца» … «ваших жертвенников»
  alternative: «их сердца» … «их жертвенников»
  rationale: Масоретский текст переходит от речи об Иуде к прямому обращению; этот переход сохранён ради пророческой выразительности и точности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Резец», «высечен», «скрижаль» и «рога жертвенников» сохраняют цельный образ неизгладимой надписи; необычная смена местоименного лица намеренно не сглажена.
