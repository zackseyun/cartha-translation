  text: Как их дети помнят их жертвенники и ашеры[a] у зеленеющих деревьев, на высоких холмах,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столбы Ашеры»; возможно, «священные столбы». Еврейское слово обозначает культовые предметы, связанные с Ашерой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּזְכֹּר
  choice: Как … помнят
  rationale: כִּי с инфинитивом זְכֹּר вводит обстоятельственную или пояснительную конструкцию. «Как … помнят» сохраняет связь с предыдущим стихом и не превращает её однозначно в причинную.
- source_word: בְּנֵיהֶם
  choice: дети их
  rationale: בָּנִים может означать как сыновей, так и детей или потомков вообще; контекст не требует сужать значение до лиц мужского пола.
- source_word: מִזְבְּחוֹתָם
  choice: их жертвенники
  rationale: Прямое обозначение культовых жертвенников с сохранением притяжательного суффикса.
- source_word: וַאֲשֵׁרֵיהֶם
  choice: ашеры
  rationale: 'Транслитерированное название сохраняет неоднозначность: речь идёт о культовых предметах, связанных с Ашерой, точный вид которых из самого слова не всегда ясен.'
- source_word: עַל עֵץ רַעֲנָן
  choice: у зеленеющих деревьев
  rationale: עַל здесь естественно передаёт расположение рядом, а единственное число עֵץ может иметь собирательное значение. «Зеленеющих» выражает свежесть и пышность растительности без добавления отсутствующего в еврейском тексте слова «всякий».
- source_word: עַל גְּבָעוֹת הַגְּבֹהוֹת
  choice: на высоких холмах
  rationale: Передаёт и пространственный смысл, и традиционную связь возвышенностей с культовыми местами, не добавляя толкования.
theological_decisions:
- issue: Значение אֲשֵׁרִים в контексте идолопоклонства
  choice: ашеры
  alternative: столбы Ашеры; священные столбы
  rationale: Еврейское слово может обозначать различные культовые предметы, связанные с богиней Ашерой, нередко деревянные столбы. Транслитерация в основном тексте не навязывает спорную материальную реконструкцию, а примечание поясняет возможные значения.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью. Инверсия «дети их» слегка приподнимает регистр и помогает различить детей и принадлежащие прежнему поколению культовые предметы. Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
