base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/009.yaml
  text: The heart is more deceitful than anything else[c][b][a], and desperately sick—who can know it?
translation:
  language: ru
  text: Сердце лукавее всего[c][a], и оно неизлечимо больно[b] — кто может познать его?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сердце лукаво превыше всего».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тяжело болеет». Еврейское слово может обозначать крайне тяжёлое или неизлечимое состояние.'
    reason: lexical_alternative
  - marker: c
    text: В библейском еврейском языке «сердце» — это внутренний человек, включая мысли, волю и желания, а не только чувства.
    reason: cultural_note
lexical_decisions:
- source_word: עָקֹב
  choice: лукаво
  rationale: Передаёт нравственную обманчивость и изворотливость сердца; это естественное и ёмкое соответствие в современном литературном русском.
- source_word: הַלֵּב
  choice: сердце
  rationale: Сохраняет библейский образ внутреннего человека — его мыслей, воли и желаний, — не сужая значение до одних эмоций.
- source_word: מִכֹּל
  choice: более всего
  rationale: 'Передаёт сравнительно-превосходную силу конструкции מן + כֹּל, сохраняя возможную неоднозначность: сердце лукавее всего или лукаво превыше всего.'
- source_word: וְאָנֻשׁ
  choice: и неизлечимо больно
  rationale: Сохраняет образ тяжёлой болезни и явный оттенок безнадёжности/неизлечимости, не подменяя его толкованием «крайне испорчено».
- source_word: הוּא
  choice: сердце … больно
  rationale: Местоименная связка естественно выражена продолжением составного сказуемого без отдельного русского «оно».
- source_word: מִי
  choice: кто
  rationale: Прямо сохраняет краткость и риторическую силу еврейского вопросительного местоимения.
- source_word: יֵדָעֶנּוּ
  choice: может познать его
  rationale: Передаёт ידע как глубокое знание и распознавание истинной природы сердца; «познать» здесь естественнее и глубже, чем нейтральное «знать».
theological_decisions:
- issue: Антропологический смысл слова «сердце»
  choice: Сохранить «сердце» как обозначение внутреннего человека.
  alternative: разум; внутреннее «я»
  rationale: Так сохраняется библейская антропология без сведения сердца только к эмоциям; пояснение вынесено в сноску.
- issue: Значение אָנֻשׁ
  choice: Передать как «неизлечимо больно».
  alternative: тяжело больно; крайне испорчено
  rationale: Еврейское слово обозначает тяжёлое, порой неизлечимое состояние. Перевод сохраняет метафору болезни и не превращает её в отвлечённую нравственную характеристику.
- issue: Сравнение מִכֹּל
  choice: «более всего» с сохранением широты сравнения.
  alternative: лукавее всего; превыше всего лукаво
  rationale: Еврейская конструкция допускает как прямое сравнение со всем остальным, так и превосходную формулировку; основная строка и сноска не устраняют эту неоднозначность.
translation_notes:
  register: Современный литературный русский с кратким, торжественным ритмом. «Лукаво» сохраняет библейскую выразительность, оставаясь понятным; «познать» соответствует возвышенному риторическому вопросу. Все примечания отмечены в основном тексте.
