id: JER.17.13
reference: Jeremiah 17:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מִקְוֵ֤ה יִשְׂרָאֵל֙ יְהוָ֔ה כָּל עֹזְבֶ֖י/ךָ יֵבֹ֑שׁוּ יסור/י בָּ/אָ֣רֶץ יִכָּתֵ֔בוּ כִּ֥י עָזְב֛וּ מְק֥וֹר מַֽיִם חַיִּ֖ים אֶת יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/013.yaml
  text: O Yahweh[a], the hope of Israel, all who forsake you will be put to shame; those who turn away from you will be written in the earth, because they have forsaken Yahweh[c][b], the fountain of living waters.
translation:
  language: ru
  text: Яхве, надежда Израиля! Все, кто оставляет Тебя, будут посрамлены; отступающие от Меня[a] будут записаны на земле[b], потому что они оставили Яхве — источник живой воды[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отступающие от Тебя». Еврейский текст в этом месте труден; основной текст сохраняет масоретское чтение от первого лица.'
    reason: textual_variant
  - marker: b
    text: 'Или: «в стране». Возможно, имеется в виду недолговечная запись на земле, противопоставленная непреходящей памяти.'
    reason: lexical_alternative
  - marker: c
    text: «Живая вода» — свежая, текущая вода из источника, в отличие от стоячей воды.
    reason: cultural_note
lexical_decisions:
- source_word: מִקְוֵה יִשְׂרָאֵל
  choice: надежда Израиля
  rationale: В обращении к Яхве מִקְוֵה употреблено в переносном смысле — «надежда, предмет упования», а не в конкретном значении места скопления воды.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: עֹזְבֶיךָ
  choice: все, кто оставляет Тебя
  rationale: Причастие обозначает людей, для которых характерно оставление Яхве; глагол «оставлять» сохраняет прямой и заветный оттенок исходного слова.
- source_word: יֵבֹשׁוּ
  choice: будут посрамлены
  rationale: Форма выражает итог суда — позор и крушение надежд, а не только внутреннее чувство стыда.
- source_word: יסורי
  choice: отступающие от Меня
  rationale: Сохранено трудное чтение с первым лицом, засвидетельствованное масоретской традицией; оно не согласовывается искусственно с предшествующим обращением во втором лице.
- source_word: בָּאָרֶץ יִכָּתֵבוּ
  choice: будут записаны на земле
  rationale: Пассивная конструкция и образ записи сохранены; «земля» не сужена без необходимости до «праха» или политико-географической «страны».
- source_word: מְקוֹר מַיִם חַיִּים
  choice: источник живой воды
  rationale: «Источник» естественно передаёт родник или исходную точку воды, а «живая вода» сохраняет буквальный образ свежей, текущей воды и его богословскую выразительность.
theological_decisions:
- issue: Смена лица в выражении יסורי
  choice: отступающие от Меня
  alternative: отступающие от Тебя
  rationale: Первое лицо сохраняет текстовую и смысловую напряжённость масоретского чтения; перевод не определяет однозначно, говорит ли здесь Яхве непосредственно или пророк как Его представитель.
- issue: Передача образа מַיִם חַיִּים
  choice: живая вода
  alternative: проточная вода
  rationale: Буквальный образ важен для богословских и межтекстовых связей, тогда как его бытовой смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской религиозно-издательской норме. Синтаксис сохраняет поэтический параллелизм и резкую смену лица исходного текста.
