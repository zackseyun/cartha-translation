  text: יֵבֹ֤שׁוּ רֹדְפַ/י֙ וְ/אַל אֵבֹ֣שָׁה אָ֔נִי יֵחַ֣תּוּ הֵ֔מָּה וְ/אַל אֵחַ֖תָּה אָ֑נִי הָבִ֤יא עֲלֵי/הֶם֙ י֣וֹם רָעָ֔ה וּ/מִשְׁנֶ֥ה שִׁבָּר֖וֹן שָׁבְרֵֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/018.yaml
  text: Let my pursuers be put to shame[a], but let me not be put to shame; let them be dismayed, but let me not be dismayed. Bring upon them a day of disaster[c][b], and shatter them with double destruction.
translation:
  language: ru
  text: Пусть мои преследователи будут посрамлены[a], а я — не буду посрамлён; пусть они придут в смятение, а я — не приду в смятение. Наведи на них день бедствия[b] и сокруши их двойным сокрушением[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опозорены». Еврейский глагол может обозначать стыд, позор или крушение надежд.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «день несчастья». Здесь речь идёт о бедствии и гибели, а не о нравственном зле.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «сокруши их двойным сокрушением». Такое сочетание однокоренных слов подчёркивает полноту и тяжесть разрушения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ / אֵבֹשָׁה
  choice: будут посрамлены / не буду посрамлён
  rationale: בושׁ обозначает переживание стыда, позора или крушения надежд. «Посрамлены» передаёт публичное унижение и сохраняет параллелизм между участью преследователей и просьбой пророка о собственной защите.
- source_word: רֹדְפַי
  choice: мои преследователи
  rationale: Причастие от רדף буквально означает «те, кто гонится за мной». «Преследователи» естественно звучит по-русски и сохраняет конкретный образ погони без лишней конфессиональной окраски.
- source_word: יֵחַתּוּ / אֵחַתָּה
  choice: ужаснутся / не ужаснусь
  rationale: В нифале חתת может означать быть сокрушённым духом, устрашённым или приведённым в смятение. «Ужаснуться» естественно передаёт сильный страх и внутреннее потрясение, не превращая эту строку в описание физического разрушения.
- source_word: הָבִיא עֲלֵיהֶם
  choice: Наведи на них
  rationale: Каузативная форма בוא с עַל выражает просьбу сделать так, чтобы бедствие пришло на адресатов. «Наведи на них» сохраняет прямое обращение к Богу и привычно сочетается с «бедствием».
- source_word: יוֹם רָעָה
  choice: день бедствия
  rationale: רָעָה здесь означает беду, несчастье или гибель, а не нравственное зло. Выражение «день бедствия» передаёт наступление суда и разорения, сохраняя библейскую образность.
- source_word: מִשְׁנֶה
  choice: двойным
  rationale: מִשְׁנֶה обозначает двойную меру или удвоение. При творительном обороте «двойным сокрушением» кратко и формально отражает еврейское усиление.
- source_word: שִׁבָּרוֹן / שָׁבְרֵם
  choice: сокрушением / сокруши их
  rationale: Сочетание однокоренных существительного и глагола буквально говорит о «сокрушении» и «сокрушить». Русская однокоренная передача сохраняет намеренную риторическую фигуру и силу образа.
theological_decisions:
- issue: Просьба пророка о суде над преследователями
  choice: Сохранить прямую молитвенную просьбу о посрамлении, ужасе и сокрушении врагов.
  alternative: Смягчить текст до общей просьбы об оправдании или защите пророка.
  rationale: Еврейский текст использует формы пожелания и прямые повелительные обращения к Богу. Перевод сохраняет напряжение между личной защитой пророка и суровым призывом к Божьему суду, не оправдывая и не ослабляя его.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-пророческой речи. Синтаксический параллелизм оригинала сохранён; «пусть» ясно передаёт пожелательные формы, а «наведи» и «сокруши» — прямые обращения к Богу. Однокоренное сочетание «сокруши… сокрушением» намеренно оставлено ради риторической силы еврейского текста.
