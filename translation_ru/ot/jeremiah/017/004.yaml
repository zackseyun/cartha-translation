base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/004.yaml
  text: And you[a] yourself will let go of your inheritance that I gave you, and I will make you serve your enemies in a land that you have not known; for you have kindled a fire in my anger[d][c][b]—it will burn forever.
translation:
  language: ru
  text: И ты сам оставишь своё наследие, которое Я дал тебе,[a] и Я заставлю тебя служить твоим врагам в стране, незнакомой тебе. Ведь вы[b] разожгли огонь в Моём гневе[c] — он будет гореть вечно.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отпустишь (оставишь) своё наследие». Еврейский глагол рисует образ того, как нечто отпускают или от него отказываются.'
    reason: lexical_alternative
  - marker: b
    text: 'Здесь еврейский текст переходит от единственного числа («ты») к множественному («вы»): обращение к Иуде как к единому целому сменяется обращением ко всему народу.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «в Моём носу (ноздре)»; это еврейское образное выражение гнева. Возможный перевод: «в Моей ярости».'
    reason: lexical_alternative
  - marker: d
    text: Еврейское עוֹלָם может обозначать вечность, непрестанность или неопределённо долгий век — в зависимости от контекста.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַטְתָּה וּבְךָ מִנַּחֲלָתְךָ
  choice: И ты сам выпустишь из рук своё наследие
  rationale: שׁמט передаёт образ отпускания, выпускания или оставления. Русское «выпустишь из рук» сохраняет конкретный образ и в данном контексте допускает смысл утраты. «Сам» передаёт усиление, выраженное трудным оборотом וּבְךָ, не превращая его в однозначное указание на добровольность или вину как непосредственную причину.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: которое Я дал тебе
  rationale: Прямой и естественный перевод относительного оборота; сохраняет первого говорящего и личное обращение.
- source_word: וְהַעֲבַדְתִּיךָ אֶת אֹיְבֶיךָ
  choice: и Я заставлю тебя служить твоим врагам
  rationale: Каузативная форма עבד означает «заставить/побудить служить». Формулировка ясно передаёт подчинение врагам, не усиливая её до прямого «порабощу».
- source_word: בָּאָרֶץ אֲשֶׁר לֹא יָדָעְתָּ
  choice: в стране, которой ты не знал
  rationale: ידע здесь обозначает знание или знакомство с чужой страной. Прошедшее время сохраняет форму и смысл еврейского перфекта.
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание объявленного суда. «Ведь» естественно связывает причину с предыдущим предложением и сохраняет пророческую аргументацию.
- source_word: אֵשׁ קְדַחְתֶּם
  choice: вы разожгли огонь
  rationale: Сохраняется метафора разожжённого огня и грамматически значимый переход от единственного числа к множественному.
- source_word: בְּאַפִּי
  choice: в Моём гневе
  rationale: אַף буквально означает «нос/ноздря», но устойчиво обозначает гнев. Предлог בְּ передан как «в», чтобы не свести неоднозначную связь к более истолковывающему «огонь Моего гнева».
- source_word: עַד עוֹלָם תּוּקָד
  choice: он будет гореть вечно
  rationale: Местоимение относится к огню; форма глагола передаёт продолжающееся горение. עוֹלָם в этом пророческом контексте естественно переводится «вечно», а его возможная смысловая широта отмечена в сноске.
theological_decisions:
- issue: Переход от обращения в единственном числе к множественному в обвинении
  choice: Сохранены «ты/тебя» в первой части и «вы разожгли» во второй.
  alternative: Согласовать всё предложение в единственном числе или во множественном числе.
  rationale: 'Масоретский текст явно меняет число: сначала Иуда представлен как единый адресат, затем обвинение обращено к людям во множественном числе. Сглаживание устранило бы риторическое напряжение текста.'
- issue: Продолжительность суда в выражении עַד עוֹלָם
  choice: вечно
  alternative: долго; на века; непрестанно
  rationale: Основной текст сохраняет сильную, открытую по длительности формулу суда. При этом сноска не делает עוֹלָם техническим термином с неизменно одинаковой длительностью во всех контекстах.
- issue: Связь огня с Божьим гневом в בְּאַפִּי
  choice: огонь в Моём гневе
  alternative: огонь Моего гнева; огонь из-за Моего гнева
  rationale: Более буквальная предложная связь сохраняет образ и не решает без необходимости, является ли огонь самим гневом, действует в сфере гнева или вызван им.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Образ «выпустишь из рук» понятен широкому читателю и сохраняет конкретность исходного глагола. Заглавные буквы в местоимениях, относящихся к Богу, следуют принятой русской библейской издательской традиции; обращения к человеку оставлены со строчной буквы. Намеренно сохранён резкий переход от «ты» к «вы».
