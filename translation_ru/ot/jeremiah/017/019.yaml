base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/019.yaml
  text: 'Thus Yahweh said to me: Go and stand in the gate of the people[a], by which the kings of Judah enter and by which they go out, and in all the gates of Jerusalem.'
translation:
  language: ru
  text: 'Так сказал мне Яхве: «Пойди и встань у ворот народа[a], через которые входят и выходят цари Иудеи, и у всех ворот Иерусалима».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ворота сынов народа»; возможно, это название определённых ворот — «Ворота народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה אֵלַי
  choice: Так сказал мне Яхве
  rationale: Сохраняет краткую пророческую формулу речи и передаёт тетраграмматон как личное имя «Яхве».
- source_word: הָלֹךְ וְעָמַדְתָּ
  choice: Пойди и встань
  rationale: Инфинитив абсолютный при личной форме здесь выражает прямое повеление; последовательность двух действий сохранена.
- source_word: בְּשַׁעַר בְּנֵי עָם
  choice: у ворот народа
  rationale: Естественная русская формулировка, сохраняющая неясную связь ворот с народом без отождествления с определённым известным названием; буквальная структура пояснена в сноске.
- source_word: אֲשֶׁר יָבֹאוּ בוֹ מַלְכֵי יְהוּדָה וַאֲשֶׁר יֵצְאוּ בוֹ
  choice: через которые входят и выходят цари Иудеи
  rationale: Передаёт ворота как путь входа и выхода. Повтор относительной конструкции свёрнут ради естественного русского синтаксиса без потери смысла.
- source_word: וּבְכֹל שַׁעֲרֵי יְרוּשָׁלִָם
  choice: а затем — у всех ворот Иерусалима
  rationale: Контекстуально подразумеваемое продолжение повеления выражено по-русски явно; «у ворот» естественно обозначает место публичного провозглашения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо содержит тетраграмматон; транслитерация сохраняет личное Божье имя, не заменяя его титулом.
- issue: Неясное обозначение ворот בְּנֵי עָם
  choice: ворота народа с буквальным пояснением в сноске
  alternative: Народные ворота; ворота сынов народа
  rationale: Не устанавливает как несомненное ни собственное название ворот, ни конкретную социальную группу и тем самым сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Императив сформулирован прямо; синтаксис сделан естественным, а подлинная неясность названия ворот сохранена посредством сноски.
