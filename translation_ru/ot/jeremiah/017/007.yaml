source:
  edition: WLC
  text: בָּר֣וּךְ הַ/גֶּ֔בֶר אֲשֶׁ֥ר יִבְטַ֖ח בַּֽ/יהוָ֑ה וְ/הָיָ֥ה יְהוָ֖ה מִבְטַחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/007.yaml
  text: Blessed is the man who trusts in Yahweh[b][a], and whose trust is Yahweh.
translation:
  language: ru
  text: Благословен человек, который уповает на Яхве и чьё упование — Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и для которого Яхве — опора». Еврейское существительное может обозначать того, на кого возлагают надежду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Передаёт значение страдательного причастия/прилагательного и сохраняет богословскую весомость выражения; «счастлив» было бы более субъективным.
- source_word: הַגֶּבֶר
  choice: человек
  rationale: Еврейское существительное мужского рода употреблено здесь обобщённо. Русское «человек» естественно передаёт эту общеотносительную, афористическую формулировку, не превращая её в указание исключительно на взрослого мужчину.
- source_word: יִבְטַח
  choice: уповает
  rationale: Глагол בטח означает доверять, полагаться, возлагать надежду. «Уповает» естественно сочетается с именем Бога и позволяет сохранить связь с существительным מִבְטָח.
- source_word: בַּיהוָה
  choice: на Яхве
  rationale: После глагола בטח предлог ב обозначает того, на кого возлагают доверие; по-русски это естественно передаётся конструкцией «уповать на».
- source_word: וְהָיָה יְהוָה מִבְטַחוֹ
  choice: и чьё упование — Яхве
  rationale: Относительная перестройка естественна по-русски и передаёт состояние, описанное еврейским וְהָיָה. «Упование» сохраняет корневую перекличку יִבְטַח / מִבְטַחוֹ и допускает значение объекта доверия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл מִבְטַחוֹ
  choice: чьё упование — Яхве
  alternative: для кого Яхве — опора
  rationale: Основной вариант сохраняет намеренную связь с предшествующим глаголом «уповает» и не устраняет напряжение формулировки, в которой Яхве назван самим упованием человека. Альтернатива яснее выражает значение объекта доверия, но ослабляет словесную перекличку.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Формула «Благословен человек» сохраняет афористичность; «уповает / упование» воспроизводит корневую перекличку оригинала.
