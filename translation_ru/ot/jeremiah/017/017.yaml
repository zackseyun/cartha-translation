source:
  edition: WLC
  text: אַל תִּֽהְיֵה לִ֖/י לִ/מְחִתָּ֑ה מַֽחֲסִ/י אַ֖תָּה בְּ/י֥וֹם רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/017.yaml
  text: Do not be a terror to me[b][a]; you are my refuge in the day of disaster.
translation:
  language: ru
  text: Не будь для меня ужасом[a]; ты — моё убежище в день бедствия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «причиной смятения», «предметом страха» или «погибелью».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «бедствие» означает несчастье, беду или тяжёлое испытание, а не нравственное зло.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיֵה
  choice: Не будь
  rationale: 'Отрицательная частица с формой имперфекта выражает молитвенную просьбу: говорящий просит Бога не становиться для него источником ужаса. Краткое «не будь» естественно передаёт эту силу.'
- source_word: לִי לִמְחִתָּה
  choice: для меня ужасом
  rationale: Предлог לִי обозначает отношение к говорящему, а מְחִתָּה может означать ужас, смятение или сокрушительную гибель. «Ужасом» сохраняет эмоциональную силу и некоторую многозначность исходного слова.
- source_word: מַחֲסִי
  choice: моё убежище
  rationale: Слово מַחֲסֶה обозначает безопасное место, укрытие или убежище. «Убежище» ясно и естественно для современного русского читателя.
- source_word: אַתָּה
  choice: ты
  rationale: 'Самостоятельное местоимение имеет смысловое ударение. В русском именная конструкция с тире естественно передаёт: «ты — моё убежище».'
- source_word: בְּיוֹם רָעָה
  choice: в день бедствия
  rationale: В данном контексте רָעָה обозначает несчастье, беду или катастрофическое бедствие, а не нравственное зло. Выражение «в день бедствия» сохраняет временной образ оригинала.
theological_decisions:
- issue: Следует ли понимать רָעָה как нравственное зло или как постигшее человека бедствие
  choice: бедствия
  alternative: зла; беды; несчастья
  rationale: Контекст молитвы об убежище указывает на время бедствия и суда, а не на нравственное качество. Перевод «бедствия» не приписывает слову здесь значения морального зла.
- issue: Означает ли מְחִתָּה внутренний ужас, причину ужаса или гибель
  choice: ужасом
  alternative: причиной смятения; предметом страха; погибелью
  rationale: Исходное слово допускает оттенки ужаса, смятения и сокрушения. Основной текст сохраняет сильный и лаконичный образ, а примечание показывает реальную лексическую неоднозначность, не устраняя её догматически.
translation_notes:
  register: Современный литературный русский язык с краткой, молитвенно-напряжённой интонацией. Сохранён параллелизм двух частей стиха; архаизмы и конфессионально окрашенные уточнения не добавлялись.
