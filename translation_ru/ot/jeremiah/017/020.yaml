source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲ֠לֵי/הֶם שִׁמְע֨וּ דְבַר יְהוָ֜ה מַלְכֵ֤י יְהוּדָה֙ וְ/כָל יְהוּדָ֔ה וְ/כֹ֖ל יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם הַ/בָּאִ֖ים בַּ/שְּׁעָרִ֥ים הָ/אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/020.yaml
  text: And say to them[a], “Hear the word of Yahweh, you kings of Judah, and all Judah, and all the inhabitants of Jerusalem who enter through these gates.”
translation:
  language: ru
  text: 'И скажи им: «Слушайте слово Яхве[a], цари Иудеи, вся Иудея и все жители Иерусалима, входящие через эти ворота».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (יהוה); традиционно переводится «Господь».'
    reason: Указывает традиционный вариант передачи тетраграмматона и поясняет форму «Яхве» в основном тексте.
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: И скажи им
  rationale: Форма с союзом продолжает предыдущее пророческое повеление; русский совершенный вид естественно передаёт последовательное указание.
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Повелительное наклонение множественного числа. «Слушайте» в современном русском яснее передаёт призыв внять провозглашаемому слову, чем буквальное «услышьте».
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена устойчивая пророческая формула и личное имя, представленное тетраграмматоном.
- source_word: מַלְכֵי יְהוּדָה
  choice: цари Иудеи
  rationale: 'Прямое обращение передано без дополнительной частицы: форма обращения ясна из повелительного глагола и перечисления адресатов.'
- source_word: וְכָל יְהוּדָה
  choice: вся Иудея
  rationale: Сохранена краткая метонимия оригинала, где название страны обозначает её народ, без пояснительного добавления.
- source_word: וְכֹל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: и все жители Иерусалима
  rationale: Причастное еврейское выражение естественно передано обычным русским обозначением постоянных жителей города.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: входящие через эти ворота
  rationale: Причастие сохранено; предлог «через» ясно выражает прохождение посредством ворот, а указательное местоимение передаёт הָאֵלֶּה.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Тетраграмматон передаёт личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом. Традиционный вариант указан в сноске.
- issue: Метонимия «вся Иудея»
  choice: сохранить формулировку «вся Иудея»
  alternative: весь народ Иудеи
  rationale: Оригинал допускает и географическое, и метонимическое восприятие; краткая форма не устраняет эту смысловую напряжённость добавлением слова «народ».
translation_notes:
  register: Современный литературный русский с достоинством пророческого воззвания. Синтаксис близок к оригиналу, но «Слушайте» выбрано как естественная современная форма призыва внять слову. Маркер сноски поставлен непосредственно после имени Яхве, к которому относится примечание.
