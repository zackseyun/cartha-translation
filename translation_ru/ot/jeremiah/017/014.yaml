lexical_decisions:
- source_word: רְפָאֵנִי
  choice: Исцели меня
  rationale: Прямо передаёт повелительную форму רפא с суффиксом 1-го лица и сохраняет как буквальный, так и переносный смысл исцеления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: וְאֵרָפֵא
  choice: и я исцелюсь
  rationale: Передаёт ожидаемый результат действия Яхве и сохраняет параллелизм следующего полустишия.
- source_word: הוֹשִׁיעֵנִי
  choice: спаси меня
  rationale: Сохраняет широкий смысл ישׁע — спасение или избавление — не сужая его до одной конкретной опасности.
- source_word: וְאִוָּשֵׁעָה
  choice: и я буду спасён
  rationale: Страдательная конструкция естественно передаёт нифаль и поддерживает словесный параллелизм «спаси — буду спасён».
- source_word: כִּי
  choice: ведь
  rationale: Естественно вводит основание просьбы в современной русской поэтической речи.
- source_word: תְהִלָּתִי
  choice: моя хвала
  rationale: Буквально сохраняет краткую и выразительную именную метафору древнееврейского текста, не сводя её к одному истолкованию.
- source_word: אָתָּה
  choice: Ты
  rationale: Ударное самостоятельное местоимение сохранено; прописная буква соответствует принятому благоговейному русскому употреблению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Объём значения ישׁע
  choice: спаси меня
  alternative: избавь меня
  rationale: «Спаси» сохраняет широкий диапазон значения — от избавления в конкретной беде до спасения в более полном смысле; лексическая альтернатива отмечена в сноске.
- issue: Смысл выражения תְהִלָּתִי אָתָּה
  choice: Ты — моя хвала
  alternative: Тебя я восхваляю
  rationale: Буквальная метафора может указывать и на предмет хвалы, и на основание хваления; основной текст сохраняет эту богословскую и поэтическую ёмкость.
translation_notes:
  register: Современный литературный русский язык с лаконичным молитвенно-поэтическим ритмом. Повторы исходного текста сохранены как смысловой параллелизм; тире подчёркивают уверенность в результате Божьего действия.
