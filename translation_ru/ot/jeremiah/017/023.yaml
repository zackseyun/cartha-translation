  text: וְ/לֹ֣א שָֽׁמְע֔וּ וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֣י שומע וּ/לְ/בִלְתִּ֖י קַ֥חַת מוּסָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/023.yaml
  text: But they did not listen[a], and they did not incline their ear[c][b], but stiffened their neck so as not to hear and not to accept discipline.
translation:
  language: ru
  text: Но они не слушали и не склоняли уха, а ожесточили свою шею, чтобы не слушать и не принимать наставление.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исправление», «вразумление». Еврейское слово может обозначать как наставление, так и исправляющее воздействие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: не слушали
  rationale: Глагол שׁמע может означать слышать, слушать или повиноваться. Здесь параллель с выражением «склонять ухо» указывает на сознательное внимание и отклик; «слушали» передаёт это, не усиливая смысл до прямого «повиновались».
- source_word: הִטּוּ אֶת אָזְנָם
  choice: не склоняли уха
  rationale: Сохранён понятный по-русски древнееврейский образ внимательного слушания; единственное число «уха» соответствует собирательному употреблению оригинала и естественно для устойчивого оборота.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: сделали свою шею непокорной
  rationale: Буквальный телесный образ сохранён, но русское «непокорной» яснее раскрывает значение упрямого сопротивления, чем не вполне естественное «сделали шею жёсткой».
- source_word: לְבִלְתִּי שומע
  choice: чтобы не слушать
  rationale: לְבִלְתִּי передаёт цель или следствие отказа; «чтобы не слушать» естественно связывает оборот с предшествующим образом сознательного сопротивления.
- source_word: מוּסָר
  choice: наставления
  rationale: מוּסָר объединяет значения наставления, исправления и дисциплинарного воздействия. В данном контексте «наставления» звучит естественно и сохраняет педагогический аспект; более строгие оттенки отмечены в сноске.
theological_decisions:
- issue: Передача образа упрямства
  choice: 'Сохранён телесный образ: «сделали свою шею непокорной».'
  alternative: '«упрямились»; «стали упрямы»; буквально: «сделали свою шею жёсткой».'
  rationale: Образ имеет устойчивое значение сознательного сопротивления и важен для языка пророческого обличения. Формулировка сохраняет метафору, одновременно делая её понятной современному читателю.
- issue: Смысл שׁמע в пророческом обличении
  choice: В обоих случаях переведено «слушать».
  alternative: «слышать» или «повиноваться».
  rationale: Контекст подразумевает не только физическое слышание, но и готовность откликнуться. Однако перевод «повиноваться» чрезмерно сужал бы многозначность глагола; повтор «слушать» сохраняет лексическую связь оригинала.
- issue: Смысл מוּסָר
  choice: «наставление» с указанием альтернатив в сноске.
  alternative: «исправление»; «вразумление»; «наказание»; «дисциплина».
  rationale: Слово охватывает и обучение, и исправляющее воздействие. Основной текст не должен однозначно сводить его ни к наказанию, ни к нейтральному обучению, поэтому диапазон отражён сноской.
translation_notes:
  register: Современный литературный русский с сохранением прозрачных древнееврейских образов. Точка с запятой разграничивает отказ слушать и последующее описание сознательного упрямства. Лексика dignified, но не архаизированная; «склоняли уха» сохраняет библейскую образность и остаётся понятным оборотом.
