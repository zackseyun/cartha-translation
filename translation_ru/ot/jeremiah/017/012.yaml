  yaml_path: translation/ot/jeremiah/017/012.yaml
  text: A glorious throne[a], exalted from the beginning, is the place of our sanctuary.
translation:
  language: ru
  text: Престол славы[a], возвышенный от начала, — место нашего святилища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Престол славы на высоте от начала — место нашего святилища»; возможно также обращение: «О престол славы, возвышенный от начала, место нашего святилища!» Еврейский текст предельно сжат и допускает несколько синтаксических прочтений.'
