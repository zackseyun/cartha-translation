lexical_decisions:
- source_word: כִּסֵּא
  choice: престол
  rationale: Слово обозначает царский трон, место правления; «престол» сохраняет царственный и богословский оттенок образа.
- source_word: כָבוֹד
  choice: славы
  rationale: Существительное передано родительным падежом в сочетании «престол славы», что близко воспроизводит еврейскую именную конструкцию כִּסֵּא כָבוֹד и её возвышенное звучание.
- source_word: מָרוֹם
  choice: возвышенный
  rationale: Слово связано с высотой и здесь может быть понято как характеристика престола; «возвышенный» передаёт одновременно высоту и величие, не исключая пространственного смысла.
- source_word: מֵרִאשׁוֹן
  choice: от начала
  rationale: Буквальная и ёмкая передача временного значения, указывающего на изначальность или древность.
- source_word: מְקוֹם
  choice: место
  rationale: Сохранено основное значение существительного без добавления толкования вроде «обиталище».
- source_word: מִקְדָּשֵׁנוּ
  choice: нашего святилища
  rationale: «Святилище» естественно передаёт значение святого, культового места, а форма родительного падежа отражает суффикс первого лица множественного числа в составе русского сочетания.
theological_decisions:
- issue: Синтаксическая связь кратких безглагольных частей стиха
  choice: Стих оформлен как именное высказывание, отождествляющее возвышенный от начала престол славы с местом нашего святилища.
  alternative: 'Возможны понимание מָרוֹם как «на высоте» и обращение: «О престол славы, возвышенный от начала, место нашего святилища!»'
  rationale: Еврейский текст предельно сжат и не содержит явной связки, поэтому допускает несколько синтаксических разборов. Основной текст следует распространённому прочтению, а примечание сохраняет подлинную неоднозначность и не устраняет богословское напряжение образа.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранены лаконичность еврейского оригинала, образ «престола славы» и его синтаксическая неоднозначность.
