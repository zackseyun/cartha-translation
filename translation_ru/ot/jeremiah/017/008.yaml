id: JER.17.8
reference: Jeremiah 17:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/עֵ֣ץ שָׁת֣וּל עַל מַ֗יִם וְ/עַל יוּבַל֙ יְשַׁלַּ֣ח שָֽׁרָשָׁ֔י/ו וְ/לֹ֤א ירא כִּֽי יָבֹ֣א חֹ֔ם וְ/הָיָ֥ה עָלֵ֖/הוּ רַֽעֲנָ֑ן וּ/בִ/שְׁנַ֤ת בַּצֹּ֨רֶת֙ לֹ֣א יִדְאָ֔ג וְ/לֹ֥א יָמִ֖ישׁ מֵ/עֲשׂ֥וֹת פֶּֽרִי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/008.yaml
  text: He will be like a tree planted by water[a], that sends out its roots by a stream; it does not fear when heat comes, and its leaf remains green. In a year of drought it is not anxious[b], and it does not cease from bearing fruit.
translation:
  language: ru
  text: Он будет как дерево, посаженное у воды, которое протягивает свои корни к потоку[a]. Оно не боится, когда приходит зной, и листва его остаётся свежей и зелёной[b]. В засушливый год оно не тревожится и не перестаёт приносить плод.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к водному руслу»; יוּבַל может обозначать поток, водоток или канал.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское прилагательное может также означать «свежая», «сочная» или «пышная» и включает представление о неувядающей зелени.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֵץ
  choice: как дерево
  rationale: Предлог сравнения כְּ передаёт прямое уподобление; «как дерево» естественно звучит по-русски и сохраняет образ.
- source_word: שָׁתוּל
  choice: посаженное
  rationale: Страдательное причастие описывает дерево, намеренно посаженное в определённом месте; «посаженное» точно и естественно передаёт этот смысл.
- source_word: עַל מַיִם
  choice: у воды
  rationale: В данном пространственном контексте עַל указывает на близость к источнику воды; русское «у воды» передаёт это без ненужного буквализма.
- source_word: יוּבַל
  choice: поток
  rationale: Слово обозначает поток или русло с текущей водой, возможно также водный канал. «Поток» сохраняет образ текущей воды и подходит современному литературному русскому.
- source_word: יְשַׁלַּח שָׁרָשָׁיו
  choice: протягивает свои корни
  rationale: Порода пиэль глагола שׁלח здесь выражает распространение корней наружу. «Протягивает» передаёт движение и естественно сочетается с русским словом «корни».
- source_word: לֹא ירא
  choice: не боится
  rationale: В контексте образа олицетворённого дерева выражение передано как отсутствие страха перед наступающим зноем.
- source_word: כִּי יָבֹא חֹם
  choice: когда приходит зной
  rationale: כִּי имеет здесь временное значение. «Зной» точнее обычного «тепла» передаёт угрожающую жару в противопоставлении воде и засухе.
- source_word: עָלֵהוּ רַעֲנָן
  choice: листва его остаётся свежей и зелёной
  rationale: Единственное число «лист» употреблено собирательно; «листва» естественна по-русски. רַעֲנָן объединяет оттенки свежести, сочности и зелени, а контекст указывает на сохранение этого состояния при зное.
- source_word: וּבִשְׁנַת בַּצֹּרֶת
  choice: В засушливый год
  rationale: Краткая русская формулировка естественно передаёт год, отмеченный засухой, и сохраняет обобщённый характер сравнения.
- source_word: לֹא יִדְאָג
  choice: не тревожится
  rationale: דאג обозначает тревожную заботу или беспокойство; «не тревожится» сохраняет олицетворение дерева и отличается по оттенку от предшествующего «не боится».
- source_word: לֹא יָמִישׁ מֵעֲשׂוֹת פֶּרִי
  choice: не перестаёт приносить плод
  rationale: Сочетание глагола מוּשׁ с מן и инфинитивом выражает непрекращение действия. Русская формулировка точна, понятна и сохраняет длительный характер плодоношения.
