translation_notes:
  register: Современный литературный русский язык с достоинством поэтического пророческого образа. Синтаксис сделан плавным и общедоступным; олицетворение дерева, параллелизм «не боится / не тревожится» и напряжение между зноем, засухой и непрерывным плодоношением сохранены.
