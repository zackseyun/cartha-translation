  text: קֹרֵ֤א דָגַר֙ וְ/לֹ֣א יָלָ֔ד עֹ֥שֶׂה עֹ֖שֶׁר וְ/לֹ֣א בְ/מִשְׁפָּ֑ט בַּ/חֲצִ֤י ימ/ו יַעַזְבֶ֔/נּוּ וּ/בְ/אַחֲרִית֖/וֹ יִהְיֶ֥ה נָבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/011.yaml
  text: 'Like a partridge that gathers a brood it did not hatch[a], so is one who makes wealth unjustly: in the middle of his days it will leave him, and in his end he will be a fool.'
translation:
  language: ru
  text: 'Как куропатка, собирающая птенцов, которых она не вывела[a], таков тот, кто наживает богатство не по праву: посреди своих дней оно оставит его, и на исходе жизни он окажется глупцом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как куропатка, высиживающая яйца, которых она не снесла». Какое именно поведение птицы подразумевает эта пословица, точно неизвестно; смысл образа в том, что неправедно присвоенное не останется у присвоившего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא
  choice: куропатка
  rationale: В контексте птичьего выводка слово обозначает птицу, традиционно понимаемую как куропатка; значение «зовущий» здесь не подходит.
- source_word: דָגַר
  choice: собирающая птенцов
  rationale: Глагол связан с высиживанием или собиранием птичьего выводка. Такой перевод сохраняет образ, не утверждая как несомненное конкретное поведение птицы.
- source_word: וְלֹא יָלָד
  choice: которых она не вывела
  rationale: Применительно к птице «вывела» естественно передаёт значение рождения потомства и согласуется с образом птенцов.
- source_word: עֹשֶׂה עֹשֶׁר
  choice: наживает богатство
  rationale: Передаёт активное приобретение богатства и звучит естественно по-русски; в сочетании с наречием может иметь этическую окраску контекста.
- source_word: וְלֹא בְמִשְׁפָּט
  choice: неправедно
  rationale: Кратко и ясно передаёт отсутствие справедливости и правомерности в способе приобретения богатства.
- source_word: בַּחֲצִי יָמָיו
  choice: в середине его дней
  rationale: Сохраняет образное выражение оригинала о времени до завершения полной жизни, не сводя его строго к современному понятию среднего возраста.
- source_word: יַעַזְבֶנּוּ
  choice: оно оставит его
  rationale: 'Форма естественно допускает богатство как подлежащее: неправедно нажитое богатство покинет человека. Русское местоимение среднего рода делает эту связь ясной.'
- source_word: וּבְאַחֲרִיתוֹ
  choice: в конце своём
  rationale: Сохраняет личный суффикс «его» и возможную отсылку к завершению жизненного пути, не добавляя отсутствующее в тексте слово «жизнь».
- source_word: נָבָל
  choice: глупцом
  rationale: В поэтическом и мудростном употреблении это не просто недостаток ума, а нравственная и духовная безрассудность; «глупец» остаётся ёмким и традиционно понятным соответствием.
theological_decisions:
- issue: Смысл образа куропатки
  choice: Птица присваивает или собирает выводок, который не является её собственным; это уподоблено неправедно нажитому богатству, которое не останется у человека.
  alternative: Куропатка высиживает яйца, которых сама не снесла.
  rationale: Точное представление древних о поведении птицы неясно. Основной текст сохраняет образ чужого потомства, а сноска отмечает другую лексически возможную конкретизацию, не превращая спорную зоологическую деталь в богословский вывод.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, пословичным звучанием. Синтаксический параллелизм и местоименная связь богатства с его уходом сохранены; спорная деталь поведения птицы вынесена в сноску.
