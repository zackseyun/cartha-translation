base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/021.yaml
  text: 'Thus says Yahweh: Take care for yourselves[b][a], and do not carry a load on the Sabbath day or bring it in through the gates of Jerusalem.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Берегите себя[a] и не носите ношу[b] в субботний день и не вносите её через ворота Иерусалима».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «берегите свои души (или жизни)»; то есть внимательно следите за собой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «груз». Речь, вероятно, о переносимых в субботу вещах или товарах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая и естественная по-русски формула пророческого возвещения, сохраняющая торжественность оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление Божьего имени в еврейском тексте.
- source_word: הִשָּׁמְרוּ בְּנַפְשׁוֹתֵיכֶם
  choice: Берегите себя
  rationale: Еврейская конструкция буквально упоминает «ваши души/жизни», но идиоматически призывает внимательно следить за собой; выбранная формулировка естественна и сохраняет рефлексивный смысл.
- source_word: וְאַל תִּשְׂאוּ
  choice: и не носите
  rationale: В сочетании с מַשָּׂא глагол означает переносить или нести груз; несовершенный вид естественно выражает общий запрет.
- source_word: מַשָּׂא
  choice: ноши
  rationale: «Ноша» обозначает конкретный переносимый груз и при этом сохраняет традиционную смысловую широту слова.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: в субботний день
  rationale: Ясная современная передача временного выражения с сохранением слова «день».
- source_word: וַהֲבֵאתֶם
  choice: не вносите её
  rationale: Вторая часть продолжает отрицательный запрет; местоимение явно отсылает к ноше, а «вносить» передаёт движение внутрь города.
- source_word: בְּשַׁעֲרֵי יְרוּשָׁלִָם
  choice: через ворота Иерусалима
  rationale: Предлог при существительном «ворота» в данном контексте обозначает путь, по которому груз вносится в город.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Смысл נֶפֶשׁ в выражении самопредостережения
  choice: себя
  alternative: свои жизни; свои души
  rationale: Здесь נֶפֶשׁ входит в идиому внимательного отношения к себе. Буквальная передача «души» могла бы необоснованно сузить смысл до нематериальной части человека; альтернативы сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык с краткой торжественной пророческой формулой. Обращение передано во множественном числе; запрет сформулирован ясно, без архаизмов. Прямая речь оформлена кавычками для естественности русского текста.
