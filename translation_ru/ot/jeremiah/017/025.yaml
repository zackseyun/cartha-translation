  text: וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הָ/עִ֣יר הַ/זֹּ֡את מְלָכִ֣ים וְ/שָׂרִ֡ים יֹשְׁבִים֩ עַל כִּסֵּ֨א דָוִ֜ד רֹכְבִ֣ים בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֗ים הֵ֚מָּה וְ/שָׂ֣רֵי/הֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/יָשְׁבָ֥ה הָֽ/עִיר הַ/זֹּ֖את לְ/עוֹלָֽם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/025.yaml
  text: then kings and officials will enter through the gates of this city[a], sitting on the throne of David, riding in chariots and on horses—they and their officials, the men of Judah and the inhabitants of Jerusalem—and this city will be inhabited forever.
translation:
  language: ru
  text: тогда через ворота этого города войдут цари и сановники, восседающие на престоле Давида, едущие в колесницах и верхом на конях, — они и их сановники, мужи Иудеи[a] и жители Иерусалима, — и этот город будет населён вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «муж Иудеи»; форма единственного числа употреблена собирательно.'
    reason: 'Лексическая альтернатива: еврейская форма мужского рода единственного числа имеет коллективное значение.'
lexical_decisions:
- source_word: וּבָאוּ בְשַׁעֲרֵי הָעִיר הַזֹּאת
  choice: тогда воротами этого города будут входить
  rationale: Союз продолжает условное следствие предыдущего стиха, поэтому «тогда» естественно обозначает результат. При בוא с בְּ и упоминании ворот речь идёт о входе через них; русское «воротами» кратко и идиоматично передаёт этот образ.
- source_word: מְלָכִים וְשָׂרִים
  choice: цари и вельможи
  rationale: שָׂרִים обозначает высокопоставленных руководителей и придворных сановников. «Вельможи» сохраняет государственно-придворный контекст и не сужает значение до наследных царевичей, как могло бы слово «князья».
- source_word: יֹשְׁבִים עַל כִּסֵּא דָוִד
  choice: сидящие на престоле Давида
  rationale: Сохранён конкретный образ пребывания на Давидовом престоле и его династическое значение без истолковывающей перифразы.
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  choice: едущие на колесницах и конях
  rationale: Еврейское רֶכֶב имеет здесь собирательное значение. Русское множественное «колесницах» естественно; общий глагол «едущие» применим и к колесницам, и к коням.
- source_word: הֵמָּה וְשָׂרֵיהֶם
  choice: они и их вельможи
  rationale: Усилительное местоимение возобновляет перечисление царской процессии; одинаковый перевод שָׂרִים и שָׂרֵיהֶם обеспечивает лексическую последовательность.
- source_word: אִישׁ יְהוּדָה
  choice: жители Иудеи
  rationale: Буквально выражение имеет форму единственного числа «муж Иуды/Иудеи», но употреблено собирательно. «Жители Иудеи» ясно передаёт обозначение населения области; буквальная форма отмечена в сноске.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלָ͏ִם
  choice: и жители Иерусалима
  rationale: Обычное собирательное обозначение населения города, естественное для современного литературного русского языка.
- source_word: וְיָשְׁבָה הָעִיר הַזֹּאת
  choice: и этот город будет населён
  rationale: Когда подлежащим при ישב выступает город, глагол означает, что он населён или остаётся обитаемым; русская пассивная конструкция точно передаёт смысл.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Передаёт неограниченную длительность в формуле заветного благословения и соответствует достоинству пророческой речи, оставаясь понятным современному читателю.
theological_decisions:
- issue: Династический смысл выражения «престол Давида»
  choice: Сохранить прямое выражение «престол Давида».
  alternative: Передать обобщённо как «законная царская власть» или истолковать мессиански.
  rationale: Исходный текст прямо указывает на Давидов престол и тем самым на продолжение династического царствования. Перевод сохраняет этот смысл, не добавляя христологического или иного конфессионального толкования.
- issue: Объём обозначения אִישׁ יְהוּדָה
  choice: Передать собирательно как «жители Иудеи» и отметить буквальную форму в сноске.
  alternative: «мужи Иудеи» или «народ Иудеи».
  rationale: Форма אִישׁ грамматически мужская и единственная, но в данном перечислении функционирует собирательно. Основной текст передаёт референт естественно по-русски, а сноска сохраняет доступ к форме оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Синтаксическое перечисление и образы ворот, престола, колесниц и коней сохранены; тире помогают ясно обозначить развернутый состав участников процессии.
