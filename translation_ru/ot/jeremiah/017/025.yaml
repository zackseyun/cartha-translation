  verdict: revise
  source_fidelity: Смысл условного следствия, вход через городские ворота, Давидов престол, процессия на колесницах и конях, а также итоговое обещание постоянной населённости переданы верно. Однако «жители Иудеи» сглаживает мужскую форму אִישׁ в основном тексте, хотя английская контрольная версия сохраняет её как «men of Judah»; это безопасно исправить как собирательное «мужи Иудеи».
  naturalness: «Воротами этого города будут входить» возможно, но менее естественно, чем «через ворота этого города войдут». «В колесницах и верхом на конях» яснее передаёт два способа передвижения. «Сановники» современнее и точнее для שָׂרִים, чем «вельможи», которое может чрезмерно оттенять знатность.
  terminology: «Престол Давида» сохранён точно и без конфессионального расширения. «Сановники» последовательно передаёт שָׂרִים / שָׂרֵיהֶם. «Мужи Иудеи» сохраняет отмеченную в источнике мужскую форму и коллективный смысл; сноска поясняет форму единственного числа.
