  text: אֲנִ֧י יְהוָ֛ה חֹקֵ֥ר לֵ֖ב בֹּחֵ֣ן כְּלָי֑וֹת וְ/לָ/תֵ֤ת לְ/אִישׁ֙ כ/דרכ/ו כִּ/פְרִ֖י מַעֲלָלָֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/010.yaml
  text: I[a], Yahweh, search the heart[b], testing the kidneys, to give to each man according to his way, according to the fruit of his deeds.
translation:
  language: ru
  text: Я, Яхве, исследую сердце и испытываю почки[a], чтобы дать каждому по его пути, по плоду его дел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «почки»; в древнееврейской речи это образ самых сокровенных мыслей, чувств и побуждений человека.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: חֹקֵר
  choice: исследую
  rationale: Причастие обозначает глубокое, проникающее исследование; настоящее время естественно передаёт постоянное действие.
- source_word: לֵב
  choice: сердце
  rationale: Сохранён библейский антропологический образ внутреннего человека, охватывающий мысли, волю и намерения.
- source_word: בֹּחֵן
  choice: испытываю
  rationale: Глагол выражает проверяющее, оценивающее исследование и образует смысловой параллелизм с «исследую».
- source_word: כְּלָיוֹת
  choice: почки
  rationale: Сохранён конкретный древнееврейский образ; его переносное значение разъяснено в сноске.
- source_word: וְלָתֵת
  choice: чтобы воздать
  rationale: Инфинитив передаёт цель или результат исследования. «Воздать» естественно выражает обусловленное поступками воздаяние, подразумеваемое сочетанием с последующими оборотами.
- source_word: לְאִישׁ
  choice: каждому
  rationale: Мужской род единственного числа имеет здесь распределительное и представительное значение; «каждому» естественно охватывает всякого человека без необоснованного ограничения только мужчинами.
- source_word: כִדְרָכוֹ
  choice: по его пути
  rationale: Сохранена метафора пути как образа жизненного поведения.
- source_word: כִפְרִי מַעֲלָלָיו
  choice: по плоду его дел
  rationale: Сохранены единственное число «плод» и метафора поступков как приносимого жизнью плода.
theological_decisions:
- issue: Антропологические образы сердца и почек
  choice: Сохранить в основном тексте «сердце» и «почки».
  alternative: 'Передать абстрактно: «разум» и «сокровенные чувства».'
  rationale: Конкретные образы показывают всестороннее знание Богом внутренней жизни человека и не подменяют древнееврейскую антропологию современной психологической терминологией.
- issue: Характер воздаяния
  choice: «Чтобы воздать каждому по его пути, по плоду его дел».
  alternative: «Чтобы дать каждому согласно его поведению и поступкам».
  rationale: Формулировка сохраняет образы пути и плода, не уточняя сверх текста, является ли воздаяние благоприятным или карающим.
- issue: Представительное значение לְאִישׁ
  choice: «каждому»
  alternative: «каждому мужчине» или «каждому человеку»
  rationale: В контексте мужская форма имеет обобщающее значение. Выбор не ограничивает суд только мужчинами и при этом сохраняет форму единственного числа.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и ключевые образы оригинала сохранены; неестественное для современного русского слово «почки» пояснено сноской.
