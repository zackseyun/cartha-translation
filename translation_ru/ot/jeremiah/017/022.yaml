source:
  edition: WLC
  text: וְ/לֹא תוֹצִ֨יאוּ מַשָּׂ֤א מִ/בָּֽתֵּי/כֶם֙ בְּ/י֣וֹם הַ/שַּׁבָּ֔ת וְ/כָל מְלָאכָ֖ה לֹ֣א תַֽעֲשׂ֑וּ וְ/קִדַּשְׁתֶּם֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת כַּ/אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/022.yaml
  text: Do not carry a load out of your houses on the Sabbath day[a], and do not do any work, but sanctify the Sabbath day[b], just as I commanded your fathers.
translation:
  language: ru
  text: Не выносите ношу из ваших домов в субботний день[a] и не делайте никакой работы, но освящайте субботний день, как Я повелел вашим отцам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не выносите груз из ваших домов в субботний день».'
    reason: lexical_alternative
  - marker: b
    text: «Вашим отцам» — прежним поколениям Израиля, которым Бог дал эту заповедь.
    reason: cultural_note
lexical_decisions:
- source_word: תוֹצִיאוּ
  choice: выносите
  rationale: Порода hифиль глагола יצא означает «заставлять выйти, выносить»; с מַשָּׂא и указанием исходной точки естественно передаётся русским «выносить».
- source_word: מַשָּׂא
  choice: ношу
  rationale: Здесь существительное обозначает конкретный предмет или груз, который несут. «Ноша» сохраняет связь с переноской и не вносит излишне торгового оттенка слова «груз».
- source_word: מִבָּתֵּיכֶם
  choice: из ваших домов
  rationale: Предлог מן указывает на исходную точку; сочетание «выносить из домов» естественно в русском языке.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: в субботний день
  rationale: Передаёт и временное значение предлога בְּ, и явно присутствующее в еврейском тексте слово «день».
- source_word: מְלָאכָה
  choice: работы
  rationale: В контексте заповеди о субботе слово обозначает запрещённую в этот день работу; общеупотребительное «работа» ясно и точно.
- source_word: וְקִדַּשְׁתֶּם
  choice: но освящайте
  rationale: Пиэль от קדש означает выделять как святое, освящать. «Освящайте» прямо передаёт значение исходного глагола и сохраняет возвышенный, но понятный регистр; союз передан как «но», поскольку по-русски здесь естественно выражено противопоставление запрета и положительного повеления.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Естественно вводит соответствие ранее данному Божьему повелению; усиление «точно так же» исходным контекстом не требуется.
- source_word: צִוִּיתִי
  choice: Я повелел
  rationale: Точно передаёт форму первого лица единственного числа глагола צוה и соответствует речи Бога в dignified русском регистре.
- source_word: אֲבוֹתֵיכֶם
  choice: вашим отцам
  rationale: Сохраняет мужской род и конкретную родственную лексику еврейского текста; значение прежних поколений Израиля пояснено в сноске.
theological_decisions:
- issue: Передача повеления освящать субботу
  choice: освящайте субботний день
  alternative: соблюдайте святость субботнего дня; почитайте субботний день святым
  rationale: Форма «освящайте» наиболее прямо сохраняет действие קדש — отделять и признавать святым — не сводя его лишь к соблюдению правил.
- issue: Обозначение прежних поколений Израиля
  choice: вашим отцам
  alternative: вашим предкам
  rationale: «Отцам» формально соответствует אֲבוֹתֵיכֶם и сохраняет библейскую родовую формулировку; сноска устраняет возможную неясность референции.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Императив множественного числа сохранён; местоимение «Я» написано с прописной буквы как указание на говорящего Бога. Все маркеры сносок присутствуют в основном тексте.
