base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/005.yaml
  text: 'Thus says Yahweh: Cursed is the man who trusts in man and makes flesh his strength[b][a], whose heart turns away from Yahweh.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Проклят человек, который надеется на человека[a], делает плоть своей опорой[b] и чьё сердце отступает от Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «человек» в этом стихе передают еврейские существительные мужского рода в единственном числе, употреблённые здесь в общем, представительном смысле.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «делает плоть своей мышцей (рукой)». В библейском языке «мышца» или «рука» часто означает силу либо средство, на которое полагаются; «плоть» здесь подчёркивает человеческую смертность и немощь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена торжественная пророческая формула; личное имя יהוה передано транслитерацией «Яхве».
- source_word: אָרוּר הַגֶּבֶר
  choice: Проклят человек
  rationale: «Проклят» сохраняет судебно-заветную силу אָרוּר, а «человек» естественно передаёт здесь представительное единственное число גֶּבֶר.
- source_word: אֲשֶׁר יִבְטַח בָּאָדָם
  choice: который надеется на человека
  rationale: Глагол בטח обозначает уверенное упование; сочетание «надеется на» естественно по-русски и сохраняет противопоставление человеческой и божественной опоры.
- source_word: וְשָׂם בָּשָׂר זְרֹעוֹ
  choice: делает плоть своей опорой
  rationale: 'Буквально: «делает плоть своей рукой». «Опора» передаёт идиоматический смысл זְרוֹעַ как силы и средства, на которое полагаются, а «плоть» сохраняет образ смертной человеческой немощи.'
- source_word: וּמִן יְהוָה יָסוּר לִבּוֹ
  choice: и сердцем отступает от Яхве
  rationale: Формулировка сохраняет координацию еврейского текста и передаёт сердце как средоточие воли и верности, не сводя его лишь к чувствам.
theological_decisions:
- issue: Представительное мужское единственное число
  choice: человек
  alternative: мужчина; тот, кто
  rationale: גֶּבֶר и אָדָם имеют формы мужского рода, однако предупреждение носит общий характер. Русское «человек» сохраняет единственное число и не ограничивает смысл только мужчинами.
- issue: Образ «плоти» и «руки»
  choice: делает плоть своей опорой
  alternative: делает плоть своей рукой; полагается на силу смертного человека
  rationale: Сохранено многозначное «плоть» без привнесения значения греховной природы; метафорическая «рука» передана по смыслу как опора, чтобы фраза оставалась ясной и естественной.
- issue: Связь между упованием на человека и удалением от Яхве
  choice: и сердцем отступает от Яхве
  alternative: чьё сердце отступает от Яхве
  rationale: Союзная конструкция ближе к синтаксису оригинала и представляет отступление сердца как сопутствующую сторону ложного упования, не уточняя сверх текста причинную связь.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис сделан ясным для обычного читателя; ключевые библейские образы «плоть» и «сердце» сохранены. Все сноски отмечены в основном тексте.
