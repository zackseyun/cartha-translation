base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/003.yaml
  text: My mountain in the field—your wealth[a], all your treasures[c][b], and your high places because of sin throughout all your territory—I will give as plunder.
translation:
  language: ru
  text: Мою гору в поле[a], твоё богатство[b], все твои сокровища и твои высоты — за грех на всей твоей земле[c] — Я отдам на разграбление.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно для понимания; возможно также: «О Моя гора в поле!» Вероятно, имеется в виду Сион, то есть Иерусалим, как гора Господа.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «твоя сила»; менее вероятно здесь: «твоё войско».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможны также переводы: «за грех на всей твоей территории» или «в грехе на всей твоей земле». Связь этого выражения с предыдущими словами не вполне ясна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָרִי בַּשָּׂדֶה
  choice: Моя гора среди равнины
  rationale: 'Буквально: «моя гора в поле». «Среди равнины» естественно передаёт пространственный контраст горы и открытой местности, сохраняя трудность и образность еврейской фразы; вероятно, речь идёт о Сионе/Иерусалиме.'
- source_word: חֵילְךָ
  choice: твоё богатство
  rationale: חַיִל может означать силу, имущество или войско. Параллель с сокровищами и контекст разграбления указывают прежде всего на богатство.
- source_word: כָל אוֹצְרוֹתֶיךָ
  choice: все твои сокровища
  rationale: В данном контексте речь вероятнее о ценностях, отдаваемых на разграбление, хотя существительное может также обозначать хранилища или сокровищницы.
- source_word: לָבַז אֶתֵּן
  choice: Я отдам на разграбление
  rationale: Естественная русская передача устойчивого выражения о предании имущества врагу как добычи.
- source_word: בָּמֹתֶיךָ
  choice: твои высоты
  rationale: Имеются в виду культовые места на возвышенностях. Традиционное «высоты» кратко и сохраняет библейский культовый оттенок.
- source_word: בְּחַטָּאת
  choice: за грех
  rationale: 'Предлог בְּ допускает причинное понимание: имущество и высоты отдаются врагу в наказание за грех. Синтаксическая связь остаётся не вполне однозначной.'
- source_word: בְּכָל גְּבוּלֶיךָ
  choice: по всей твоей земле
  rationale: גְּבוּל может обозначать границу либо территорию. Здесь выражение указывает на всю область Иудеи; «по всей твоей земле» естественно передаёт распределительное значение.
theological_decisions:
- issue: К чему относится «моя гора среди равнины»
  choice: Сохранено буквальное обозначение, вероятно относящееся к Сиону/Иерусалиму как горе Господа
  alternative: Обращение «О Моя гора среди равнины!» либо указание на горную область страны
  rationale: Еврейская конструкция трудна. Притяжательное окончание первого лица поддерживает связь с принадлежащей Господу горой, однако перевод не заменяет образ прямым названием Иерусалима.
- issue: Связь выражения «за грех по всей твоей земле»
  choice: Передано как основание суда над всем перечисленным
  alternative: «Твои высоты за грех по всей твоей земле» либо «твои высоты вместе с грехом по всей твоей земле»
  rationale: Причинное понимание хорошо соответствует контексту суда, но пунктуация и сноска сохраняют реальную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Инверсия и тире сохраняют фронтированное перечисление объектов суда. Заглавное «Я» обозначает говорящего Господа. Термин «высоты» оставлен как краткое библейское обозначение культовых мест.
