source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִשְׁמְע֜וּ אֵלַ֗/י לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת וּ/לְ/בִלְתִּ֣י שְׂאֵ֣ת מַשָּׂ֗א וּ/בֹ֛א בְּ/שַׁעֲרֵ֥י יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/הִצַּ֧תִּי אֵ֣שׁ בִּ/שְׁעָרֶ֗י/הָ וְ/אָֽכְלָ֛ה אַרְמְנ֥וֹת יְרוּשָׁלִַ֖ם וְ/לֹ֥א תִכְבֶּֽה־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/027.yaml
  text: But if you do not listen to me[a], to keep the Sabbath day holy, and not to carry a load and bring it in through the gates of Jerusalem on the Sabbath day, then I will kindle a fire in its gates, and it will consume the palaces of Jerusalem[b], and it will not be quenched.
translation:
  language: ru
  text: Но если вы не послушаетесь Меня и не будете свято хранить субботний день, не будете носить ноши и проносить их через ворота Иерусалима в субботний день, тогда Я зажгу огонь в его воротах. Он пожрёт дворцы Иерусалима и не погаснет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשְׁמְעוּ אֵלַי
  choice: послушаетесь Меня
  rationale: Сочетание שׁמע с אֶל означает слушать, внимать и в данном контексте подразумевает повиновение. Русское «послушаетесь» естественно передаёт оба оттенка.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: свято хранить субботний день
  rationale: Пиэль קדשׁ означает отделять как святыню, почитать святым. Формулировка сохраняет идею святости и звучит естественно в современном литературном русском.
- source_word: וּלְבִלְתִּי שְׂאֵת מַשָּׂא
  choice: станете носить ноши
  rationale: Сочетание נשא и מַשָּׂא буквально обозначает поднятие или перенос ноши; контекст указывает на переносимые грузы, но не требует сужать значение до торговли.
- source_word: וּבֹא בְּשַׁעֲרֵי יְרוּשָׁלִַם
  choice: внося их в ворота Иерусалима
  rationale: Инфинитив בוא координирован с несением нош; множественное местоимение естественно отсылает к русскому «ноши» и ясно выражает внесение в город через ворота.
- source_word: וְהִצַּתִּי אֵשׁ
  choice: тогда Я зажгу огонь
  rationale: Хифиль יצת означает зажечь или разжечь. «Тогда» явно передаёт следствие условной конструкции.
- source_word: בִּשְׁעָרֶיהָ
  choice: в его воротах
  rationale: Суффикс женского рода относится к Иерусалиму; в русском название города грамматически мужского рода, поэтому используется «его».
- source_word: וְאָכְלָה אַרְמְנוֹת יְרוּשָׁלִַם
  choice: Он пожрёт дворцы Иерусалима
  rationale: Глагол אכל при огне образно означает пожирать. אַרְמְנוֹת может обозначать дворцы или укреплённые знатные здания; «дворцы» сохраняет основное значение без лишнего уточнения.
- source_word: וְלֹא תִכְבֶּה
  choice: и не погаснет
  rationale: Форма qal от כבה означает «погаснуть, быть потушенным». Русское «не погаснет» сохраняет неопределённость относительно того, будет ли огонь невозможно потушить или никто его не потушит.
theological_decisions:
- issue: Передача субботней терминологии
  choice: субботний день
  alternative: суббота
  rationale: В еврейском тексте явно присутствует יוֹם, «день»; его сохранение точнее отражает источник и не добавляет конфессионального толкования.
- issue: Условная структура суда
  choice: тогда Я зажгу огонь
  alternative: и Я зажгу огонь
  rationale: «Тогда» естественно обозначает аподосис после וְאִם и ясно показывает, что суд является следствием непослушания.
- issue: Неугасимость огня
  choice: не погаснет
  alternative: не будет потушен
  rationale: Выбранный вариант сохраняет формальную непереходность еврейского глагола и не уточняет, идёт ли речь о невозможности потушить огонь или об отсутствии того, кто его потушит.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис условного предупреждения сделан прозрачным; сохранены повтор «субботний день», образ пожирающего огня и неоднозначность заключительного глагола.
