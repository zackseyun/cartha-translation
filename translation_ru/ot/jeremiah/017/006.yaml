base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/006.yaml
  text: He will be like a shrub in the desert[a], and he will not see when good comes. He will dwell in parched places in the wilderness[c][b], in a salt land that is not inhabited.
translation:
  language: ru
  text: 'И будет он как куст[a] в пустынной степи[c]: он не увидит, когда придёт благо[b], и будет обитать в иссохших местах пустыни, на солончаковой земле, где никто не живёт.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как можжевельник», «как тамариск» или «как голый куст»; какое именно растение названо в еврейском тексте, неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не заметит, когда наступит благополучие». Буквально: «не увидит, когда придёт благо».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в Араве», если это слово понимается как название конкретной географической области, а не пустынной степи вообще.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּעַרְעָר
  choice: как куст
  rationale: Название пустынного растения точно не установлено; общее «куст» сохраняет образ и не навязывает спорную ботаническую идентификацию.
- source_word: בָּעֲרָבָה
  choice: в пустыне
  rationale: עֲרָבָה может обозначать как Араву, так и засушливую степь или пустыню; в поэтическом контексте естественнее общее значение.
- source_word: וְלֹא יִרְאֶה כִּי יָבוֹא טוֹב
  choice: не увидит, когда придёт благо
  rationale: Формулировка сохраняет еврейский образ «увидеть» и широкое значение טוֹב, не сужая его до материального благополучия.
- source_word: וְשָׁכַן
  choice: и поселится
  rationale: Глагол שׁכן означает жить, обитать или поселяться; «поселится» естественно передаёт будущее время и продолжает образ места обитания.
- source_word: חֲרֵרִים
  choice: в иссохших местах
  rationale: Слово обозначает выжженные, сухие или бесплодные места; «иссохшие места» ясно передаёт природную безжизненность.
- source_word: בַּמִּדְבָּר
  choice: в безлюдье
  rationale: מִדְבָּר обозначает пустынную, необитаемую местность. «Безлюдье» избегает близкого повтора слова «пустыня» и сохраняет мотив необитаемости.
- source_word: אֶרֶץ מְלֵחָה
  choice: на солончаковой земле
  rationale: Выражение обозначает засолённую и потому бесплодную землю; «солончаковая земля» — точная и естественная русская формулировка.
- source_word: וְלֹא תֵשֵׁב
  choice: где никто не живёт
  rationale: Форма согласуется с «землёй» и буквально говорит, что она не населена; придаточное предложение естественно звучит по-русски.
