source:
  edition: WLC
  text: וְ֠/הָיָה אִם שָׁמֹ֨עַ תִּשְׁמְע֤וּ/ן אֵלַ/י֙ נְאֻם יְהוָ֔ה לְ/בִלְתִּ֣י הָבִ֣יא מַשָּׂ֗א בְּ/שַׁעֲרֵ֛י הָ/עִ֥יר הַ/זֹּ֖את בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וּ/לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת לְ/בִלְתִּ֥י עֲשֽׂוֹת ב/ה כָּל מְלָאכָֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/024.yaml
  text: And it shall be[a], if you truly listen to me, declares Yahweh, by not bringing a load through the gates of this city on the Sabbath day, and by keeping the Sabbath day holy, by not doing any work on it[b],
translation:
  language: ru
  text: 'И будет: если вы действительно будете слушать Меня[a], — возвещает Яхве, — не будете проносить ношу[b] через ворота этого города в субботний день, будете освящать субботний день и не будете делать в этом городе никакой работы,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если, слушая, будете слушать Меня». Повтор глагола усиливает высказывание; в этом контексте слушание подразумевает и послушание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «груз», «бремя». В данном контексте имеется в виду переносимая через городские ворота ноша.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет так
  rationale: Сохраняет вводную формулу будущего условия и естественно звучит по-русски; незавершённость условного периода, продолжающегося в следующем стихе, передана конечной запятой.
- source_word: אִם שָׁמֹעַ תִּשְׁמְעוּן אֵלַי
  choice: если вы действительно будете слушаться Меня
  rationale: Повтор глагольного корня усиливает высказывание. «Действительно» передаёт эмфазу, а «слушаться» сохраняет связь со слушанием и одновременно выражает подразумеваемое послушание.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу весомо и без архаической тяжеловесности.
- source_word: לְבִלְתִּי הָבִיא מַשָּׂא
  choice: не будете проносить ношу
  rationale: В контексте речь идёт о переносимом грузе. Личная глагольная форма естественно продолжает русское условное предложение и раскрывает содержание послушания.
- source_word: בְּשַׁעֲרֵי הָעִיר הַזֹּאת
  choice: через ворота этого города
  rationale: Предлог передаёт движение груза через городские ворота, подразумеваемое контекстом.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: в субботний день
  rationale: Сохраняет явно выраженное в еврейском тексте слово «день» и звучит естественно по-русски.
- source_word: וּלְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: будете освящать субботний день
  rationale: Прямо передаёт значение קדשׁ — выделять день как святой, не подменяя его более узким толкованием.
- source_word: לְבִלְתִּי עֲשׂוֹת בָהּ כָּל מְלָאכָה
  choice: не будете делать в него никакой работы
  rationale: Естественно передаёт запрет всякой работы; местоимение отнесено к субботнему дню.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное заветное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: 'Значение שׁמע: слушать или повиноваться'
  choice: будете слушаться Меня
  alternative: будете слушать Меня; будете повиноваться Мне
  rationale: Русское «слушаться» удерживает образ слушания и одновременно естественно выражает присущую контексту идею послушания, не сводя глагол только к одному из оттенков.
- issue: Характер освящения субботы
  choice: будете освящать субботний день
  alternative: будете свято чтить субботний день; будете соблюдать святость субботнего дня
  rationale: Выбрана лексически прямая формулировка, сохраняющая богословски значимую идею отделения дня как святого без добавления конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным для русского читателя, при этом сохранены условная структура, параллельные требования и незавершённость стиха, поскольку следствие условия следует в Иер. 17:25.
