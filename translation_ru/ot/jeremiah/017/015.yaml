  text: 'Вот[a], они говорят мне: «Где слово Яхве? Пусть же оно придёт!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весть от Яхве». Еврейское выражение — обычная пророческая формула, обозначающая божественное слово или пророческое изречение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественное для современного литературного русского указательное междометие, привлекающее внимание к происходящему.
- source_word: הֵמָּה אֹמְרִים
  choice: они говорят
  rationale: Самостоятельное местоимение сохраняется, а причастие передаёт продолжающееся действие; контекст допускает повторяемость, но не требует добавления «всё».
- source_word: אֵלַי
  choice: мне
  rationale: Передаёт направленность речи к Иеремии без усилительного истолкования «против меня».
- source_word: אַיֵּה דְבַר יְהוָה
  choice: Где слово Яхве?
  rationale: Сохраняет стандартную пророческую формулу דְבַר יְהוָה и прямую передачу личного имени Яхве.
- source_word: יָבוֹא נָא
  choice: Пусть же оно исполнится!
  rationale: Имперфект имеет побудительно-желательное значение, а נָא усиливает насмешливый вызов. В отношении пророческого слова русское «исполнится» естественно передаёт требование, чтобы предсказанное наступило, хотя буквально глагол означает «придёт».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон, поэтому личное имя сохраняется, а не заменяется титулом.
- issue: Смысл выражения «слово Яхве»
  choice: слово Яхве
  alternative: весть от Яхве
  rationale: «Слово» сохраняет устойчивую пророческую формулу и не сводит её смысл только к сообщению.
- issue: Передача יָבוֹא применительно к пророческому слову
  choice: исполнится
  alternative: придёт
  rationale: В контексте насмешники требуют наступления предсказанного; «исполнится» ясно выражает этот смысл, не превращая форму в простое будущее.
translation_notes:
  register: Современный литературный русский язык; краткая, энергичная реплика с оттенком насмешливого вызова. Архаическое «се» не используется.
