  text: וַ/אֲנִ֞י לֹא אַ֣צְתִּי מֵ/רֹעֶ֣ה אַחֲרֶ֗י/ךָ וְ/י֥וֹם אָנ֛וּשׁ לֹ֥א הִתְאַוֵּ֖יתִי אַתָּ֣ה יָדָ֑עְתָּ מוֹצָ֣א שְׂפָתַ֔/י נֹ֥כַח פָּנֶ֖י/ךָ הָיָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/016.yaml
  text: But as for me[a], I did not hurry away from being a shepherd after you, and I did not desire the day of disaster; you know. What came from my lips was before your face.
translation:
  language: ru
  text: 'А я не спешил оставлять служение пастыря, следуя за Тобой, и не желал дня бедствия[a]. Ты знаешь: то, что исходило из моих уст, было перед Твоим лицом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тяжкого (или неисцелимого) дня»; возможно также: «дня беды» или «дня несчастья».'
    reason: Лексема אָנושׁ сохраняет оттенки тяжести, мучительности и неисцелимости, которые невозможно полностью передать одним русским словом.
lexical_decisions:
- source_word: אַצְתִּי
  choice: не уклонялся
  rationale: Глагол אוץ означает «торопиться, спешить, понуждать»; в конструкции с מִן контекстуально передаёт мысль о поспешном отходе или уклонении от порученной роли. «Не уклонялся» естественно выражает смысл по-русски, не добавляя отказа, которого прямо нет в форме глагола.
- source_word: מֵרֹעֶה אַחֲרֶיךָ
  choice: от того, чтобы быть пастырем, следуя за Тобой
  rationale: Сохраняется образ רֹעֶה — «пастырь», а אַחֲרֶיךָ передаётся как следование за Богом. Такое построение яснее буквального, но неестественного по-русски «быть пастырем после Тебя».
- source_word: יוֹם אָנ֛וּשׁ
  choice: день бедствия
  rationale: אָנושׁ буквально описывает нечто тяжкое, неисцелимое, мучительное; в сочетании с «днём» речь идёт о дне тяжёлого бедствия, вероятно суда. В русском «день болезни» мог бы ошибочно восприниматься как обычная физическая болезнь.
- source_word: הִתְאַוֵּיתִי
  choice: не желал
  rationale: Порода hitpael глагола אוה выражает сильное желание или стремление. «Не желал» точно и естественно передаёт отрицание.
- source_word: מוֹצָא שְׂפָתַי
  choice: всё, что исходило из моих уст
  rationale: Сохраняется конкретный образ «выходящего» из уст, то есть произнесённых слов; добавленное «всё» естественно оформляет относительную конструкцию и не меняет её объёма.
- source_word: נֹכַח פָּנֶיךָ
  choice: перед Твоим лицом
  rationale: Передаёт образную буквальность еврейского выражения и одновременно означает открытость слов Божьему присутствию и знанию.
- source_word: אַתָּה יָדָעְתָּ
  choice: Ты знаешь
  rationale: Перфект в прямом обращении выражает установленное знание Бога; настоящее время естественно в современном русском.
theological_decisions:
- issue: Образ пастыря в самоописании Иеремии
  choice: Сохранить слово «пастырь» как метафору служения Иеремии под водительством Бога.
  alternative: Передать как «пророк» либо обобщённо «служитель».
  rationale: В еврейском тексте прямо употреблён образ пастыря. Замена его названием должности сузила бы образ и внесла бы толкование в основной текст.
- issue: Значение выражения «день тяжкий/неисцелимый»
  choice: Передать как «день бедствия», сохранив более буквальные оттенки в сноске.
  alternative: «День болезни», «тяжкий день» или «день неисцелимого бедствия».
  rationale: Контекст указывает на грядущее бедствие или суд, которого пророк не желал; перевод не уточняет сверх текста, относится ли это только к суду или шире к катастрофе.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Образ «пастыря» и выражение «перед Твоим лицом» сохранены ради исходной образности; синтаксис слегка сглажен для ясности. Местоимения при обращении к Богу написаны с прописной буквы согласно распространённой русской библейской традиции.
