id: JER.10.23
reference: Jeremiah 10:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יָדַ֣עְתִּי יְהוָ֔ה כִּ֛י לֹ֥א לָ/אָדָ֖ם דַּרְכּ֑/וֹ לֹֽא לְ/אִ֣ישׁ הֹלֵ֔ךְ וְ/הָכִ֖ין אֶֽת צַעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/023.yaml
  text: I know[a], O Yahweh, that a man's way is not his own[b]; it is not for a man who walks to direct his steps.
translation:
  language: ru
  text: 'Знаю я, Яхве: путь человека не в его власти[a], идущему не дано направлять[b] свои шаги.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не человеку — путь его»; возможно также: «путь человека не в нём самом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «утверждать», «устанавливать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Знаю я
  rationale: Форма qal perfect 1-го лица ед. числа выражает здесь утвердившееся осознание или признание; настоящее время естественно передаёт исповедальный, обобщающий смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: לָאָדָם
  choice: человека
  rationale: אָדָם употреблено обобщённо и обозначает человека как такового; русское «человек» сохраняет этот смысл без ненужного сужения до мужчины.
- source_word: דַּרְכּוֹ
  choice: его путь
  rationale: דֶּרֶךְ обозначает как дорогу, так и жизненный путь или ход жизни; «путь» сохраняет образ и широту значения.
- source_word: לֹא לָאָדָם דַּרְכּוֹ
  choice: путь человека не в его власти
  rationale: Эллиптическое еврейское выражение буквально звучит примерно как «не человеку — путь его». Русская формулировка ясно передаёт отсутствие у человека окончательной власти над собственным жизненным путём, не утверждая сверх того полного отсутствия человеческой воли.
- source_word: לְאִישׁ הֹלֵךְ
  choice: идущему
  rationale: Причастие הֹלֵךְ сохраняет образ человека, находящегося в пути. Субстантивированное «идущему» звучит кратко и естественно в параллельной поэтической строке.
- source_word: וְהָכִין
  choice: направлять
  rationale: Hiphil глагола כון может означать «утверждать», «устанавливать», «готовить» или «направлять». При дополнении «шаги» слово «направлять» естественно выражает определение хода движения, а альтернативное значение отмечено в сноске.
- source_word: אֶת צַעֲדוֹ
  choice: свои шаги
  rationale: Хотя в еврейском стоит форма единственного числа с притяжательным суффиксом, русское множественное «шаги» идиоматично передаёт последовательность поступков и направление жизненного пути.
theological_decisions:
- issue: Соотношение человеческой деятельности и Божьего владычества
  choice: Стих утверждает, что человек не обладает окончательной властью над своим жизненным путём и не может сам полностью определить его ход.
  alternative: Считать стих исчерпывающим утверждением о полном отсутствии у человека какой-либо способности выбирать или действовать.
  rationale: Еврейский текст подчёркивает человеческую ограниченность и зависимость, но не излагает законченную метафизическую систему и не отменяет прямо человеческую ответственность. Перевод сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным ритмом молитвенного признания. Инверсия «Знаю я» подчёркивает личное исповедание, не создавая архаического звучания; образ пути и шагов сохранён.
