  yaml_path: translation/ot/jeremiah/010/007.yaml
  text: Who would not fear you[a], O King of the nations? For this is your due; for among all the wise men of the nations and in all their kingdoms[b], there is none like you.
translation:
  language: ru
  text: Кто не убоится Тебя[a], Царь народов? Ведь Тебе подобает страх, ибо среди всех мудрецов народов и во всех их царствах нет подобного Тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто не должен бояться Тебя?» Еврейский риторический вопрос может выражать как ожидаемую реакцию, так и то, что должно быть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרָאֲךָ
  choice: не убоится Тебя
  rationale: Риторическая конструкция מִי לֹא с имперфектом допускает оттенки «кто не станет?» и «кто не должен?». «Не убоится» сохраняет значение страха и благоговейного трепета, не сводя его к одному лишь почтению.
- source_word: מֶלֶךְ הַגּוֹיִם
  choice: Царь народов
  rationale: Прямо передаёт конструкцию сопряжённого состояния и сохраняет обращение к Богу как к Царю всех народов.
- source_word: יָאָתָה
  choice: это подобает Тебе
  rationale: Глагол обозначает то, что уместно, приличествует или по праву принадлежит. Безличная русская конструкция естественно выражает мысль о том, что страх перед Богом является должным ответом.
- source_word: חַכְמֵי הַגּוֹיִם
  choice: мудрецы народов
  rationale: «Мудрецы» естественно обозначает мудрых людей, советников или знатоков и сохраняет связь с народами.
- source_word: מַלְכוּתָם
  choice: их царствах
  rationale: В данном контексте существительное означает царства или владения; форма множественного числа с притяжательным суффиксом прямо передана как «их царствах».
- source_word: מֵאֵין כָּמוֹךָ
  choice: нет подобного Тебе
  rationale: Естественная русская передача еврейского идиоматического утверждения о несравненности Бога.
- source_word: כִּי ... כִּי
  choice: ведь ... ибо
  rationale: 'Оба союза передают обоснование: сначала почему Бога надлежит бояться, затем — основание этого утверждения в Его несравненности. Вариация союзов делает русский текст естественным, не меняя логики.'
theological_decisions:
- issue: Божественное царствование над народами
  choice: Царь народов
  alternative: Царь над народами
  rationale: Еврейский текст прямо обращается к Богу как к Царю народов; перевод сохраняет утверждение о Его всеобщей царской власти без пояснительного расширения.
- issue: Значение страха перед Богом
  choice: убоится Тебя
  alternative: будет благоговеть перед Тобой
  rationale: Перевод сохраняет напряжение между страхом и благоговением, присущее ירא, и не ослабляет его до простого почтения.
- issue: Модальность риторического вопроса
  choice: Кто не убоится Тебя?
  alternative: Кто не должен бояться Тебя?
  rationale: Еврейский вопрос может указывать и на ожидаемую реакцию, и на должный ответ. Основной текст сохраняет естественную риторическую форму, а примечание отмечает модальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Заглавные местоимения в обращении к Богу соответствуют русской издательской традиции. «Убоится» выбрано как понятное, но возвышенное слово, сохраняющее библейскую силу глагола; синтаксис остаётся ясным для современного читателя.
