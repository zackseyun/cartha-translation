base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/016.yaml
  text: Not like these is the Portion of Jacob[a], for he is the Former of all things, and Israel is the tribe of his inheritance[b]; Yahweh of hosts is his name.
translation:
  language: ru
  text: 'Не таков Удел Иакова[a]: он — Творец всего, а Израиль — племя, составляющее его наследие[b]. Яхве Воинств — его имя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или со строчной буквы: «удел Иакова». Смысл выражения в том, что Бог Израиля не подобен описанным выше идолам.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «племя», может также означать «жезл» или «скипетр»; здесь «племя» лучше соответствует мысли об Израиле как о народе, принадлежащем Яхве.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא כְאֵלֶּה
  choice: Не таков
  rationale: Местоименное выражение указывает на описанных выше идолов, не называя их прямо; единственное число согласовано с последующим «Удел Иакова».
- source_word: חֵלֶק יַעֲקֹב
  choice: Удел Иакова
  rationale: «Удел» передаёт значение доли или части, доставшейся кому-либо, и в контексте обозначает Бога Израиля в противопоставлении идолам. Прописная буква сохраняет квазититульное употребление.
- source_word: יוֹצֵר הַכֹּל
  choice: Творец всего
  rationale: Причастие יוֹצֵר означает того, кто формирует или создаёт. «Творец всего» естественно и ёмко передаёт как действие, так и всеохватность הַכֹּל.
- source_word: שֵׁבֶט נַחֲלָתוֹ
  choice: племя его наследия
  rationale: 'Основное значение שֵׁבֶט здесь понято как «племя»: Израиль — народ, принадлежащий Богу как его наследие. Буквальность формулы сохранена, а иные значения слова отмечены в сноске.'
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией «Яхве», а צְבָאוֹת — широким по охвату словом «Воинств», без ограничения только земными или только небесными силами.
- source_word: שְׁמוֹ
  choice: имя его
  rationale: Сохранена краткая торжественная именная формула древнееврейского текста.
theological_decisions:
- issue: Кого обозначает выражение «Удел Иакова»
  choice: Яхве как удел Иакова, то есть Бог, принадлежащий Израилю в рамках заветных отношений и противопоставленный идолам
  alternative: 'Абстрактное понимание: «доля Иакова»'
  rationale: Ближайший контекст противопоставляет бессильных идолов живому Богу; перевод сохраняет это противопоставление, не добавляя толкования в основной текст.
- issue: Значение שֵׁבֶט применительно к Израилю
  choice: «племя» — Израиль как принадлежащий Богу народ
  alternative: «жезл» или «посох» его наследия
  rationale: Значение «племя» наиболее связно сочетается с Израилем и понятием Божьего наследия, однако многозначность древнееврейского слова сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским ритмом. Местоимения, относящиеся к Богу, даны со строчной буквы по обычной современной орфографии; имя Яхве и квазититульное «Удел» выделены прописной.
