base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/004.yaml
  text: They decorate it with silver and with gold[b][a]; they fasten it with nails and with hammers so that it will not totter.
translation:
  language: ru
  text: Серебром и золотом украшают его; гвоздями и молотками закрепляют их[a], чтобы оно не шаталось[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «закрепляют их»; глагол имеет множественное объектное окончание, хотя до и после речь идёт об одном изображении.'
    reason: textual_grammatical_ambiguity
  - marker: b
    text: 'Или: «чтобы оно не сдвигалось»; возможно также: «чтобы оно не колебалось».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: серебром и золотом
  rationale: Предлог בְּ обозначает материал или средство украшения. Творительный падеж естественно передаёт это значение и сохраняет параллельное упоминание обоих металлов.
- source_word: יְיַפֵּהוּ
  choice: украшают его
  rationale: Пиэль от יפה означает «делать красивым, украшать». Современное «украшают» ясно передаёт изготовление культового изображения; местоимение сохраняет единственное число непосредственного объекта.
- source_word: בְּמַסְמְרוֹת וּבְמַקָּבוֹת
  choice: гвоздями и молотками
  rationale: מסמרות — гвозди или крепёжные штыри, а מקבות — молотки или колотушки. В данном ремесленном контексте наиболее понятны обычные русские названия инструментов.
- source_word: יְחַזְּקוּם
  choice: закрепляют
  rationale: Пиэль от חזק здесь означает «делать прочным, надёжно закреплять». Объект не повторён в основном тексте, чтобы по-русски естественно продолжить описание того же изображения; необычное множественное объектное окончание еврейского текста отмечено в сноске.
- source_word: וְלֹא יָפִיק
  choice: чтобы он не шатался
  rationale: Сочетание после закрепления естественно выражает цель или результат. יפיק в контексте передаёт неустойчивость — колебание, шатание или смещение; «не шатался» сохраняет наглядную сатиру над предметом, который требуется удерживать на месте.
theological_decisions:
- issue: Сатирическое изображение идола как изготовленного людьми предмета
  choice: Сохранено прямое описание украшения и физического закрепления предмета, который иначе будет шататься.
  alternative: Передать стих как нейтральное техническое описание изготовления культовой статуи.
  rationale: Контекст Иер 10:3–5 подчёркивает беспомощность рукотворных изображений. Перевод сохраняет эту заложенную в тексте иронию, не добавляя внешних богословских утверждений.
- issue: Число объекта при יְחַזְּקוּם
  choice: В связном русском описании подразумевается тот же единичный предмет, а формальная особенность вынесена в сноску.
  alternative: Передать буквально «закрепляют их», допустив переход к множеству идолов или иной множественный референт.
  rationale: Непосредственно перед этим стоит единственное объектное местоимение «его», и последующий глагол יפיק также имеет форму единственного числа. Однако масоретское множественное объектное окончание не исправляется молча, а явно отмечается.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным синтаксисом. Начальная позиция слов «серебром и золотом» сохраняет порядок и акцент еврейской строки; лексика понятна широкому читателю и остаётся достаточно торжественной для библейского текста.
