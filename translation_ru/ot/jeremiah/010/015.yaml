  text: הֶ֣בֶל הֵ֔מָּה מַעֲשֵׂ֖ה תַּעְתֻּעִ֑ים בְּ/עֵ֥ת פְּקֻדָּתָ֖/ם יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/015.yaml
  text: They are vanity, a work of mockery; at the time of their punishment they will perish.
translation:
  language: ru
  text: Они — пустота, творение, достойное насмешки[a]; во время их наказания[b] они погибнут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «творение заблуждения»; еврейское выражение редкое и может указывать как на обман, так и на нечто достойное осмеяния.'
    reason: Сохраняет лексическую неоднозначность תַּעְתֻּעִים, не отдавая предпочтение одному спорному оттенку без оговорки.
  - marker: b
    text: 'Буквально: «во время их посещения (взыскания)».'
    reason: Показывает более широкий смысл פְּקֻדָּה и объясняет контекстуальный перевод «наказания».
lexical_decisions:
- source_word: הֶבֶל
  choice: пустота
  rationale: Передаёт образ тщетности, ничтожности и бесполезности идолов; в данном контексте естественнее и точнее, чем отвлечённая «суета».
- source_word: מַעֲשֵׂה תַּעְתֻּעִים
  choice: дело насмешки
  rationale: Редкое выражение допускает смысл того, что достойно осмеяния или служит предметом насмешки; выбран вариант, согласующийся с контекстом полемики против идолов, при сохранении иной возможности в сноске.
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: когда придёт время их наказания
  rationale: פְּקֻדָּה может означать посещение, взыскание или наказание; здесь последующая гибель ясно указывает на карательное взыскание. Развёрнутая конструкция звучит естественно по-русски.
- source_word: יֹאבֵדוּ
  choice: они погибнут
  rationale: Прямо передаёт значение утраты существования или уничтожения в данном контексте суда.
theological_decisions:
- issue: К кому относится местоимение «их» в выражении פְּקֻדָּתָם
  choice: Сохранено «их», естественно относимое к идолам.
  alternative: Понять как время наказания изготовителей или почитателей идолов.
  rationale: Грамматически ближайший референт — сами идолы, названные «они»; русский текст сохраняет эту связь, не добавляя неявного толкования.
- issue: Характер Божьего действия в слове פְּקֻדָּה
  choice: «наказание»
  alternative: «посещение» или «взыскание»
  rationale: Контекст гибели требует судебного оттенка, но сноска отмечает более буквальную широту исходного слова.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная и торжественная формулировка. «Пустота» понятна обычному читателю и сохраняет пророческую оценку идолов. Конструкция «когда придёт время» естественно передаёт временной оборот без архаизации.
