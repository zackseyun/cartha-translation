  text: וּ/בְ/אַחַ֖ת יִבְעֲר֣וּ וְ/יִכְסָ֑לוּ מוּסַ֥ר הֲבָלִ֖ים עֵ֥ץ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/008.yaml
  text: But together they are stupid and foolish[b][a]; the instruction of idols is wood.
translation:
  language: ru
  text: Но все они одинаково неразумны и глупы[a]; наставление идолов[b] — это дерево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И все как один они неразумны и глупы»; начальное выражение идиоматично и может означать «все вместе», «все одинаково» или «в одном отношении».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «суеты»; у пророков это слово часто обозначает идолов или нечто ничтожное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַחַת
  choice: Но все они одинаково
  rationale: Трудное идиоматическое выражение при глаголах во множественном числе, вероятнее всего, подчёркивает общность или одинаковость. Союз «но» естественно передаёт контраст с предыдущим стихом.
- source_word: יִבְעֲרוּ
  choice: неразумны
  rationale: Здесь בער означает умственную и нравственную тупость, а не «гореть». «Неразумны» ясно и достойно передаёт смысл без излишне грубой окраски.
- source_word: וְיִכְסָלוּ
  choice: и глупы
  rationale: כסל означает «быть глупым». Краткое однородное сказуемое сохраняет параллелизм еврейского текста.
- source_word: מוּסַר
  choice: наставление
  rationale: מוּסָר охватывает значения наставления, обучения и вразумления; «наставление» здесь наиболее широко и естественно.
- source_word: הֲבָלִים
  choice: идолов
  rationale: Буквально слово обозначает «суеты», «пустоты», но в пророческой полемике часто служит обозначением идолов как ничтожных, лишённых реальности предметов почитания.
- source_word: עֵץ הוּא
  choice: — дерево
  rationale: Краткая именная фраза резко подчёркивает материальную природу идола. Сжатая формулировка сохраняет силу и некоторую намеренную шероховатость оригинала.
theological_decisions:
- issue: Смысл заключительной фразы в полемике против идолов
  choice: Предполагаемое наставление от идолов в конечном счёте оказывается деревом.
  alternative: Деревянный идол сам выступает наставником; либо речь идёт о безжизненности такого наставления.
  rationale: Еврейская фраза предельно сжата и допускает разные синтаксические связи. Перевод сохраняет прямое сопоставление наставления с деревом и контекстуальную насмешку над идолами, не развивая её в более определённое богословское утверждение.
translation_notes:
  register: Современный литературный русский язык; тон краткий и обличительный. Необычная формула «наставление от идолов — дерево» намеренно сохраняет сжатость и смысловую напряжённость еврейского текста.
