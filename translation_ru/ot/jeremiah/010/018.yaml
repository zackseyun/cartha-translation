  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י קוֹלֵ֛עַ אֶת יוֹשְׁבֵ֥י הָ/אָ֖רֶץ בַּ/פַּ֣עַם הַ/זֹּ֑את וַ/הֲצֵר֥וֹתִי לָ/הֶ֖ם לְמַ֥עַן יִמְצָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/018.yaml
  text: 'For thus says Yahweh: Behold[a], I am slinging out the inhabitants of the land at this time[c][b], and I will press them hard so that they may be found.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве: «Вот, Я на этот раз метну жителей страны, словно из пращи[a], и причиню им бедствие, чтобы они нашли[c]».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «метну из пращи»; еврейский глагол передаёт образ метания с помощью пращи. Возможные переводы: «швырну» или «выброшу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жителей земли»; при более широком понимании — «обитателей мира».'
    reason: alternative_reading
  - marker: c
    text: 'Заключительные слова трудны для понимания: в еврейском тексте буквально «чтобы они нашли», но не сказано, что именно. Возможно также: «чтобы они это почувствовали», «чтобы их нашли» или «чтобы они оказались застигнуты».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, не заменяя его титулом.
- source_word: הִנְנִי
  choice: Вот, ... Я
  rationale: Частица с местоименным элементом подчёркивает непосредственность и решительность предстоящего действия; «вот» сохраняет пророческую выразительность.
- source_word: קוֹלֵעַ
  choice: вышвырну из пращи
  rationale: Глагол вызывает конкретный образ метания из пращи. Такая формулировка сохраняет резкость метафоры и идею насильственного удаления.
- source_word: יוֹשְׁבֵי הָאָרֶץ
  choice: жителей этой земли
  rationale: В ближайшем контексте речь идёт о жителях страны Иуды; указательное «этой» естественно передаёт определённость и контекстуальную соотнесённость выражения.
- source_word: בַּפַּעַם הַזֹּאת
  choice: на этот раз
  rationale: Естественно передаёт данное конкретное наступление суда, сохраняя временно-ситуативное значение оборота.
- source_word: וַהֲצֵרוֹתִי
  choice: стесню их
  rationale: Каузативная форма выражает причинение тесноты, давления или бедствия. «Стесню» сохраняет одновременно образ сжатия и смысл тяжёлого положения, не уточняя без необходимости способ бедствия.
- source_word: לְמַעַן יִמְצָאוּ
  choice: чтобы они нашли
  rationale: В масоретском тексте глагол имеет активную форму «найдут», но прямое дополнение не выражено. Намеренно краткая формулировка сохраняет грамматическую и смысловую трудность исходного текста, а возможные истолкования вынесены в примечание.
theological_decisions:
- issue: Объём значения הָאָרֶץ
  choice: этой земли
  alternative: земли / мира
  rationale: Контекст указывает прежде всего на страну и её жителей, поэтому перевод не превращает местный суд над Иудой в недвусмысленно всемирный.
- issue: Неясность לְמַעַן יִמְצָאוּ
  choice: чтобы они нашли
  alternative: чтобы они это почувствовали; чтобы их нашли; чтобы они оказались застигнуты
  rationale: В еврейском тексте при активном глаголе «найти» отсутствует названный объект. Перевод не добавляет «Меня», «это» или иной объект и не устраняет трудность догматически либо контекстуально мотивированной догадкой.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой пророческой образности. Необычная незавершённость последней фразы намеренна и отражает трудность еврейского текста; пояснение дано в сноске.
