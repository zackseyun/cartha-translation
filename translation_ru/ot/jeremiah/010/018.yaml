  source_fidelity: 'Основной смысл передан верно: Яхве возвещает насильственное изгнание жителей страны и последующее бедствие. Однако «вышвырну из пращи» по-русски означает, что жителей выбрасывают из самой пращи, тогда как קוֹלֵעַ рисует их как предмет, метаемый пращой. Указательное «этой» не выражено в еврейском тексте. Активная и намеренно неполная форма «чтобы они нашли» удачно сохраняет трудность יִמְצָאוּ.'
