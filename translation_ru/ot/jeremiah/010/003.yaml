base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/003.yaml
  text: For the customs of the peoples are vanity[a], for a tree is cut from the forest, the work of the hands of a craftsman with an axe.
translation:
  language: ru
  text: 'Ибо обычаи народов — пустота: дерево рубят в лесу, и мастер своими руками делает из него изделие с помощью топора[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «теслом». Древнееврейское слово обозначает орудие для рубки или обработки дерева; точный вид инструмента неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקּוֹת
  choice: обычаи
  rationale: В контексте языческих культовых практик слово обозначает укоренившиеся обычаи и обряды, а не формальные законы.
- source_word: הָעַמִּים
  choice: народов
  rationale: Сохраняет множественное число и этнокультурный смысл древнееврейского עַמִּים.
- source_word: הֶבֶל
  choice: суета
  rationale: Передаёт образ пустоты, тщетности и ничтожности, сохраняя традиционную библейскую многозначность слова.
- source_word: עֵץ מִיַּעַר
  choice: дерево срубают в лесу
  rationale: Сохраняет конкретный образ дерева, взятого из леса, и естественно передаёт действие כְּרָתוֹ по-русски.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: это дело рук мастера
  rationale: Передаёт конструкцию, подчёркивающую человеческое изготовление предмета, в естественной русской форме.
- source_word: בַּמַּעֲצָד
  choice: орудующего топором
  rationale: «Топор» понятен современному читателю и подходит для обработки дерева; точный вид древнего инструмента остаётся неясным и отмечен в сноске.
theological_decisions:
- issue: Передача полемики против идолопоклонства без внесения позднейшей богословской терминологии
  choice: обычаи народов — суета
  alternative: установления народов ничтожны
  rationale: Формулировка сохраняет осуждение пустоты языческих обычаев и акцент на рукотворности предмета, не добавляя отсутствующих в стихе доктринальных уточнений.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, с сохранением образности и полемического напряжения оригинала. Повтор כִּי передан причинно-пояснительной связью после двоеточия, чтобы избежать тяжеловесного повторения «ибо».
