lexical_decisions:
- source_word: אִסְפִּי
  choice: Собери
  rationale: Повелительная форма женского рода единственного числа от אסף; естественно передаёт приказ собрать вещи перед уходом.
- source_word: מֵאֶרֶץ
  choice: с земли
  rationale: אֶרֶץ допускает значения «земля», «страна», «почва». В сочетании с собиранием узла конкретное «с земли» естественно, хотя возможно и «из страны».
- source_word: כִּנְעָתֵךְ
  choice: свой узел
  rationale: Редкое слово обозначает имущество, пожитки или свёрток. «Узел» сохраняет единственное число и образ вещей, собранных в дорогу.
- source_word: ישבתי
  choice: жительница
  rationale: По контексту это обращение к адресату женского рода; «жительница» сохраняет род и лаконичный характер еврейского обращения.
- source_word: בַּמָּצוֹר
  choice: осаждённого города
  rationale: מָצוֹר может обозначать осаду, укреплённое или осаждённое место. Такая передача даёт по-русски понятное обращение, не сводя выражение лишь к отвлечённому состоянию.
