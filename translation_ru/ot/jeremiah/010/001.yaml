  text: שִׁמְע֣וּ אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה עֲלֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/001.yaml
  text: Hear the word that Yahweh has spoken concerning you[a], O house of Israel.
translation:
  language: ru
  text: Слушайте слово, которое Яхве изрёк о вас, дом Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения множественного числа передаёт обращение ко всему сообществу и призыв внимательно принять пророческое слово.
- source_word: הַדָּבָר
  choice: слово
  rationale: Сохраняет обычное для пророческой речи значение דָּבָר и естественно сочетается с глаголом «изрёк».
- source_word: אֲשֶׁר דִּבֶּר
  choice: которое ... изрёк
  rationale: Относительное придаточное передаёт еврейскую конструкцию, а «изрёк» сохраняет достоинство пророческого регистра и завершённость действия перфекта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, не заменяя его титулом «Господь».
- source_word: עֲלֵיכֶם
  choice: о вас
  rationale: Предлог עַל здесь допускает значение речи, касающейся адресатов. «О вас» сохраняет эту направленность, не усиливая её до «против вас» и не сводя к «вам».
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет устойчивое пророческое обозначение Израиля как единого сообщества; форма обращения ясна без добавления частицы «о».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное Божье имя. «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом.
- issue: Направленность слова в עֲלֵיכֶם
  choice: о вас
  alternative: против вас; к вам
  rationale: Контекст вводного призыва ещё не требует однозначно враждебного смысла. «О вас» сохраняет смысловую открытость еврейского предлога.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Слушайте» звучит естественно для обращения к множеству адресатов; «изрёк» поддерживает возвышенный, но понятный библейский регистр.
