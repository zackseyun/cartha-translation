  text: כִּ֤י נִבְעֲרוּ֙ הָֽ/רֹעִ֔ים וְ/אֶת יְהוָ֖ה לֹ֣א דָרָ֑שׁוּ עַל כֵּן֙ לֹ֣א הִשְׂכִּ֔ילוּ וְ/כָל מַרְעִיתָ֖/ם נָפֽוֹצָה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/021.yaml
  text: For the shepherds have become stupid[a], and they have not sought Yahweh; therefore they have not acted wisely[c][b], and all their flock is scattered.
translation:
  language: ru
  text: Ибо пастыри стали неразумными[a] и не искали Яхве; поэтому они не поступали благоразумно[c], и всё их стадо рассеялось[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отупели»; «стали бессмысленными».'
    reason: lexical_alternative
  - marker: b
    text: «Пастыри» здесь, вероятно, образно обозначают руководителей народа, а «стадо» — вверенный им народ.
    reason: cultural_note
  - marker: c
    text: 'Или: «не преуспели». Еврейский глагол может указывать как на благоразумные действия, так и на достигаемый благодаря им успех.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעֲרוּ
  choice: обезумели
  rationale: Nifal от בער обозначает состояние неразумия, бесчувственной глупости. «Обезумели» передаёт резкость пророческого обличения естественным литературным русским языком.
- source_word: הָרֹעִים
  choice: пастыри
  rationale: Сохранена буквальная пастушеская метафора; в контексте Иеремии она указывает на руководителей народа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, стоящее в еврейском тексте, а не замещающий титул.
- source_word: דָרָשׁוּ
  choice: искали
  rationale: Глагол דרש применительно к Богу может означать искать Его, обращаться к Нему и вопрошать Его; «искали» сохраняет эту широту.
- source_word: עַל־כֵּן
  choice: поэтому
  rationale: Естественно выражает причинно-следственную связь между тем, что пастыри не искали Яхве, и последующим результатом.
- source_word: הִשְׂכִּילוּ
  choice: не поступали благоразумно
  rationale: Hiphil от שכל может обозначать разумное поведение и обусловленный им успех. Основной текст передаёт смысл благоразумного действия, а примечание сохраняет оттенок успеха.
- source_word: מַרְעִיתָם
  choice: всё их стадо
  rationale: Хотя существительное может обозначать пастбище или предмет пастырского попечения, сочетание с пастырями и глаголом «рассеялось» естественно указывает на стадо как собирательное целое.
- source_word: נָפוֹצָה
  choice: рассеялось
  rationale: Глагол פוץ обозначает рассеяние; форма женского рода единственного числа согласуется с собирательным מַרְעִיתָם.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон. «Яхве» сохраняет личное заветное имя и наиболее вероятное произношение, не заменяя его титулом.
- issue: Кого обозначают пастыри
  choice: Сохранить метафору «пастыри»
  alternative: руководители; правители
  rationale: Контекстуально речь, вероятно, о руководителях народа, однако буквальная метафора значима и не должна быть истолкована вместо читателя; пояснение дано в сноске.
- issue: Значение הִשְׂכִּילוּ
  choice: не поступали благоразумно
  alternative: не преуспели
  rationale: Глагол допускает как смысл разумного поведения, так и смысл достигаемого благодаря ему успеха. Основной перевод сохраняет этический оттенок, а сноска отмечает альтернативу.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи и пастушеской метафоры. «Пастыри» выбрано вместо более бытового «пастухи», поскольку речь идёт о руководителях народа; архаизмы вне этой устойчивой библейской метафоры не используются.
