base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/005.yaml
  text: They are like a scarecrow in a cucumber field[a], and they cannot speak; they must be carried, because they cannot walk. Do not fear them, for they cannot do harm[b], nor can they do good.
translation:
  language: ru
  text: Они — словно пугало на огуречной грядке[a] и не могут говорить; их приходится носить, потому что они не могут ходить. Не бойтесь их, ибо они не могут ни причинить вреда, ни сделать добра[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно столб на бахче». Еврейский образ труден; его понимают как пугало или как вертикально поставленный столб в овощном саду.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и делать добро — не в них [не в их силах]».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹמֶר מִקְשָׁה
  choice: словно пугало на огуречной грядке
  rationale: Трудный еврейский образ допускает понимание תֹמֶר как вертикально стоящего предмета, а מִקְשָׁה — как огородной бахчи или грядки. В контексте неподвижных идолов «пугало» естественно передаёт образ, а альтернативу следует сохранить в сноске.
- source_word: וְלֹא יְדַבֵּרוּ
  choice: и не могут говорить
  rationale: В контексте последовательно подчёркивается бессилие идолов, поэтому отрицание передано как неспособность, а не только как отсутствие действия.
- source_word: נָשׂוֹא יִנָּשׂוּא
  choice: их непременно носят
  rationale: Инфинитив абсолютный при личной форме усиливает пассивное значение. «Непременно носят» сохраняет усиление и не добавляет явно выраженной модальности долженствования.
- source_word: כִּי לֹא יִצְעָדוּ
  choice: потому что сами они не ходят
  rationale: צעד означает ступать, идти. Добавление «сами» естественно противопоставляет их переноске и собственной неподвижности, не меняя смысла.
- source_word: אַל תִּירְאוּ מֵהֶם
  choice: Не бойтесь их
  rationale: Прямой и естественный русский эквивалент запретительного повеления.
- source_word: כִּי לֹא יָרֵעוּ
  choice: они не могут причинить зла
  rationale: Порода hифиль указывает на причинение зла или вреда; выражение передаёт контекстуальную мысль о неспособности идолов навредить.
- source_word: וְגַם הֵיטֵיב אֵין אוֹתָם
  choice: и не могут сделать добра
  rationale: Буквально оборот отрицает наличие у них способности делать добро. Прямая русская формулировка естественна; более буквальный вариант отмечен в сноске.
theological_decisions:
- issue: Характер полемики против идолов
  choice: 'Последовательно передать полное бессилие идолов: они не способны говорить, самостоятельно ходить, причинять зло или делать добро.'
  alternative: 'Передать глаголы как простое отрицание действий: «не говорят», «не причинят зла».'
  rationale: Контекст изображает идолов безжизненными рукотворными предметами. При этом перевод не утверждает ничего сверх содержащейся в стихе полемики.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Синтаксис сохраняет ритм пророческой насмешки; трудный образ не сглажен без указания альтернативы.
