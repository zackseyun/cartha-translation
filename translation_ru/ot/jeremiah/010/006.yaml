  text: There is none like you[a], O Yahweh; you are great, and your name is great in might.
translation:
  language: ru
  text: Нет подобного Тебе, Яхве[a]! Ты велик, и велико имя Твоё в могуществе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH — Божественное имя, переданное здесь как «Яхве»; традиционно передаётся как «Господь».'
    reason: Уточнение исходной формы, передачи имени в тексте и традиционного варианта.
lexical_decisions:
- source_word: מֵאֵין כָּמוֹךָ
  choice: Нет подобного Тебе
  rationale: Еврейское выражение отрицает существование кого-либо или чего-либо, сравнимого с Яхве. Эта формулировка сохраняет широкий смысл и звучит естественно и торжественно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божественное имя, обозначенное тетраграмматоном, а не заменяющий его титул.
- source_word: גָּדוֹל אַתָּה
  choice: Ты велик
  rationale: Сохраняет прямое обращение и утверждение о величии Яхве в естественном русском порядке слов.
- source_word: וְגָדוֹל שִׁמְךָ
  choice: и велико имя Твоё
  rationale: Сохраняет поэтический параллелизм предыдущей части; «имя» может включать славу и известность, но в основном тексте оставлено исходное слово.
- source_word: בִּגְבוּרָה
  choice: могуществом
  rationale: Творительный падеж естественно передаёт аспект или проявление величия имени; «могущество» сохраняет значение силы и мощи и не требует пояснительного развертывания.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем и титулом, а традиционная замена указана в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим строем. Заглавные буквы в местоимениях прямого обращения к Богу поддерживают достоинство регистра, не меняя смысла.
