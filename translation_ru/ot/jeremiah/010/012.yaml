  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/012.yaml
  text: He made the earth by his power[a]; he established the world by his wisdom[b], and by his understanding he stretched out the heavens.
translation:
  language: ru
  text: Он создал[a] землю силой Своей, утвердил мир[b] мудростью Своей и разумом Своим распростёр небеса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте первые два действия выражены причастиями: возможно также «Он создаёт землю… утверждает мир…» или «Создатель земли…». Здесь они переданы прошедшим временем в соответствии с поэтическим рядом.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может обозначать землю как устроенный или обитаемый мир.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂה
  choice: создал
  rationale: Еврейское причастие допускает значения «создающий» и «Создатель», однако в данном поэтическом ряду естественное русское прошедшее время согласуется с заключительным נָטָה и ясно передаёт речь о творении.
- source_word: אֶרֶץ
  choice: землю
  rationale: Космический контекст и параллель с миром и небесами требуют значения «земля», а не «страна».
- source_word: בְּכֹחוֹ
  choice: силой Своей
  rationale: Предлог ב имеет инструментальное значение; «силой» естественно передаёт средство проявления божественной творческой мощи.
- source_word: מֵכִין
  choice: утвердил
  rationale: Порода Hiphil глагола כון выражает установление и придание устойчивости; «утвердил» сохраняет образ упорядоченного творения.
- source_word: תֵּבֵל
  choice: мир
  rationale: Слово обозначает землю как устроенный, нередко обитаемый мир. «Мир» звучит естественно, а смысловой оттенок уточняется в сноске.
- source_word: בְּחָכְמָתוֹ
  choice: мудростью Своей
  rationale: Сохранено инструментальное значение предлога и традиционное различение мудрости и разума.
- source_word: וּבִתְבוּנָתוֹ
  choice: и разумом Своим
  rationale: «Разум» передаёт תבונה отдельно от חכמה, не сводя оба понятия к одному слову.
- source_word: נָטָה
  choice: распростёр
  rationale: Глагол передаёт образ разворачивания или простирания небес; «распростёр» точен и соответствует возвышенному поэтическому регистру.
- source_word: שָׁמָיִם
  choice: небеса
  rationale: Форма и космический контекст естественно передаются русским множественным «небеса».
theological_decisions:
- issue: Божественный субъект подразумевается, но прямо не назван в стихе
  choice: Местоимение «Он» продолжает контекст без добавления имени или титула.
  alternative: «Бог создал…» или «Господь создал…»
  rationale: В еврейском стихе отдельное наименование субъекта отсутствует; местоимение сохраняет связность контекста и не вносит отсутствующего здесь имени.
- issue: Временная сила начальных причастий
  choice: Передать их глаголами прошедшего времени в едином рассказе о творении.
  alternative: «Он создаёт землю… утверждает мир…» или «Создающий землю…»
  rationale: Причастная форма допускает настоящее или характеризующее значение, но последующий перфект נָטָה и контекст творения позволяют естественный ряд прошедшего времени; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «силой Своей / мудростью Своей / разумом Своим» поддерживает ритм и параллелизм, не затемняя смысла.
