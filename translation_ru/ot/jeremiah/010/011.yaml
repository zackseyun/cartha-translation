  text: כִּ/דְנָה֙ תֵּאמְר֣וּן לְ/ה֔וֹם אֱלָ֣הַיָּ֔/א דִּֽי שְׁמַיָּ֥/א וְ/אַרְקָ֖/א לָ֣א עֲבַ֑דוּ יֵאבַ֧דוּ מֵֽ/אַרְעָ֛/א וּ/מִן תְּח֥וֹת שְׁמַיָּ֖/א אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/011.yaml
  text: 'Thus you shall say to them: “The gods that did not make the heavens and the earth will perish from the earth and from under these heavens.”[a][b]'
translation:
  language: ru
  text: 'Так скажите им: «Боги, которые не сотворили небо и землю, исчезнут с земли и из-под этих небес».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «погибнут»; возможно также: «будут уничтожены». Арамейский глагол может означать гибель, уничтожение или исчезновение.'
    reason: lexical_alternative
  - marker: b
    text: Слово «боги» может обозначать идолов, мнимых божеств или и тех и других; полемическая формулировка текста остаётся широкой.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּדְנָה
  choice: Так
  rationale: Арамейское указательное наречие вводит точную формулу речи; «Так» естественно и сохраняет значение «таким образом».
- source_word: תֵּאמְרוּן לְהוֹם
  choice: скажите им
  rationale: Форма 2-го лица множественного числа в данном контексте передаёт прямое повеление; русское повелительное наклонение звучит естественнее буквального будущего времени.
- source_word: אֱלָהַיָּא
  choice: Боги
  rationale: Определённая форма множественного числа обозначает богов, которым противопоставлен истинный Творец; формулировка не уточняет, имеются ли в виду идолы, мнимые божества или и то и другое.
- source_word: שְׁמַיָּא וְאַרְקָא
  choice: небо и землю
  rationale: Это устойчивое библейское обозначение всего сотворённого мира. В русском языке естественна формула «небо и землю», хотя арамейское слово «небеса» имеет форму множественного числа.
- source_word: לָא עֲבַדוּ
  choice: не сотворили
  rationale: Глагол означает «сделали»; в контексте происхождения неба и земли «сотворили» точно и естественно выражает созидательное действие без добавления доктринальных деталей.
- source_word: יֵאבַדוּ
  choice: исчезнут
  rationale: Глагол אבד допускает значения гибели, уничтожения или исчезновения. «Исчезнут» сохраняет непереходный характер формы и хорошо сочетается с удалением с земли и из-под небес.
- source_word: מֵאַרְעָא
  choice: с земли
  rationale: Предлог выражает удаление от или с поверхности; ввиду космического контекста אַרְעָא означает именно землю, а не отдельную страну.
- source_word: וּמִן תְּחוֹת שְׁמַיָּא אֵלֶּה
  choice: и из-под этих небес
  rationale: Перевод сохраняет предлог «из-под» и указательное אֵלֶּה — «этих»; повтор «небо/небес» отражает формулировку оригинала.
theological_decisions:
- issue: Кого обозначают «боги»
  choice: Сохранено широкое обозначение «боги»
  alternative: «идолы» или «ложные боги»
  rationale: Оригинал говорит именно о «богах» и не ограничивает референцию материальными изображениями; добавление «ложные» истолковало бы полемику прямо в основном тексте.
- issue: Характер их конца
  choice: «исчезнут»
  alternative: «погибнут» или «будут уничтожены»
  rationale: Арамейский глагол допускает эти оттенки. Основной текст сохраняет непереходное значение, а примечание отмечает возможные варианты, не уточняя, кто именно осуществляет уничтожение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повелительное «скажите» передаёт инструкцию естественно; знакомая формула «небо и землю» сочетается с более буквальным «этих небес» во второй части. Маркеры обоих примечаний помещены в основном тексте.
