id: JER.10.13
reference: Jeremiah 10:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּעֲלֶ֥ה נְשִׂאִ֖ים מִ/קְצֵ֣ה ארץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יּ֥וֹצֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/013.yaml
  text: At the sound of his voice[a], there is a roar of waters in the heavens, and he makes clouds rise from the ends of the earth; he makes lightning for the rain[b], and brings out the wind from his storehouses.
translation:
  language: ru
  text: Когда Он подаёт голос,[a] на небесах раздаётся гул вод. Он поднимает облака[b] от краёв земли, создаёт молнии для дождя[c] и выводит ветер из Своих хранилищ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при звуке того, как Он даёт [голос]»; еврейское выражение предельно сжато.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «испарения», «туманы».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «молнии с дождём»; точная связь молний и дождя в еврейской фразе не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  choice: Когда Он подаёт голос
  rationale: Сжатая еврейская конструкция буквально говорит о «звуке, когда Он даёт [голос]». Русское «подаёт голос» естественно передаёт личное действие Бога и сохраняет образ Его голоса.
- source_word: הֲמוֹן מַיִם
  choice: гул вод
  rationale: הֲמוֹן может обозначать множество, шум или грохот. В контексте бури «гул вод» сохраняет звуковой образ и не исключает представления об их обилии.
- source_word: בַּשָּׁמַיִם
  choice: на небесах
  rationale: שָׁמַיִם здесь обозначает небесное пространство; «на небесах» сохраняет возвышенный и космический масштаб текста.
- source_word: וַיַּעֲלֶה נְשִׂאִים
  choice: Он поднимает облака
  rationale: Каузативная форма עלה означает «поднимать, заставлять подниматься», а נְשִׂאִים в метеорологическом контексте — облака или испарения.
- source_word: מִקְצֵה אֶרֶץ
  choice: от краёв земли
  rationale: Передан устойчивый образ самых дальних пределов земли без сужения אֶרֶץ до отдельной страны.
- source_word: בְּרָקִים לַמָּטָר עָשָׂה
  choice: создаёт молнии для дождя
  rationale: Формулировка сохраняет предлог ל и намеренно не уточняет точную связь молний с дождём, которая в еврейском выражена сжато.
- source_word: וַיּוֹצֵא רוּחַ
  choice: и выводит ветер
  rationale: В метеорологическом контексте רוּחַ означает «ветер», а каузативный глагол изображает его выход из Божьих хранилищ.
- source_word: מֵאֹצְרֹתָיו
  choice: из Своих хранилищ
  rationale: אֹצָר — хранилище или сокровищница; «хранилища» естественно передаёт образ мест, где содержатся силы природы.
theological_decisions:
- issue: Личная власть Бога над явлениями бури
  choice: 'Сохранена последовательная личная субъектность: «Он подаёт», «Он поднимает», «создаёт», «выводит».'
  alternative: Передать стих как обезличенное описание природных процессов.
  rationale: Еврейский текст прямо приписывает Богу управление водами, облаками, молниями и ветром; перевод не ослабляет и не расширяет это утверждение.
- issue: Антропоморфный образ Божьего голоса
  choice: Сохранено выражение «Он подаёт голос».
  alternative: Передать как «когда гремит гром».
  rationale: Отождествление голоса исключительно с громом сделало бы явным то, что в тексте остаётся образным и допускает более широкое понимание Божьего повеления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены конкретные поэтические образы и параллельная цепочка Божьих действий; архаизмы вроде «изводит» и «сокровищницы ветра» не использованы. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
