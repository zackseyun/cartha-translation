id: JER.10.20
reference: Jeremiah 10:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אָהֳלִ֣/י שֻׁדָּ֔ד וְ/כָל מֵיתָרַ֖/י נִתָּ֑קוּ בָּנַ֤/י יְצָאֻ֨/נִי֙ וְ/אֵינָ֔/ם אֵין נֹטֶ֥ה עוֹד֙ אָהֳלִ֔/י וּ/מֵקִ֖ים יְרִיעוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/020.yaml
  text: My tent is destroyed[a], and all my ropes are torn away. My sons have gone from me, and they are no more[d][c][b]. There is no one left to stretch out my tent again and set up my curtains.
translation:
  language: ru
  text: Шатёр мой разорён[a], и все мои верёвки оборваны[b]. Сыновья мои ушли от меня, и больше их нет[c]. Некому больше раскинуть мой шатёр и поднять его полотнища[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опустошён» или «разграблен». Еврейский глагол может обозначать как насильственное разорение, так и разграбление.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть верёвки, которыми закрепляли шатёр; возможный перевод: «все мои шнуры порваны».'
    reason: lexical_alternative
  - marker: c
    text: «Сыновья» могут означать как детей в прямом смысле, так и, в образной речи, жителей или народ, покинувших город либо землю. Слова «их нет» указывают на отсутствие и не обязательно означают смерть.
    reason: cultural_note
  - marker: d
    text: 'Или: «Некому больше поставить мой шатёр и установить его полотнища».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלִי
  choice: шатёр мой / мой шатёр
  rationale: Сохраняет буквальный образ переносного жилища, который последовательно развивается упоминанием верёвок и полотнищ.
- source_word: שֻׁדָּד
  choice: разорён
  rationale: Передаёт как разрушение, так и насильственное опустошение; подходит к плачевному тону и не ограничивает смысл только разграблением имущества.
- source_word: מֵיתָרַי
  choice: мои верёвки
  rationale: Речь идёт о верёвках шатра; общеупотребительное слово ясно современному читателю и сохраняет цельность образа.
- source_word: נִתָּקוּ
  choice: оборваны
  rationale: Глагол обозначает отсоединение или разрыв. В отношении верёвок «оборваны» звучит естественно и передаёт результат разрушения.
- source_word: בָּנַי
  choice: сыновья мои
  rationale: Сохраняет мужской род и множественное число еврейского слова, не подменяя его более широким «дети».
- source_word: יְצָאֻנִי
  choice: ушли от меня
  rationale: Естественно передаёт удаление от говорящего и чувство утраты, не уточняя сверх текста, было ли это бегство, пленение или изгнание.
- source_word: וְאֵינָם
  choice: и больше их нет
  rationale: Сохраняет утверждение об отсутствии, не утверждая однозначно, что сыновья умерли.
- source_word: אֵין נֹטֶה עוֹד אָהֳלִי
  choice: некому больше раскинуть мой шатёр
  rationale: «Раскинуть шатёр» — естественное русское выражение для его установки; «больше» передаёт עוֹד и подчёркивает прекратившуюся возможность.
- source_word: יְרִיעוֹתַי
  choice: его полотнища
  rationale: «Полотнища» обозначает составляющие шатёр куски ткани; местоимение «его» естественно связывает их с уже названным шатром.
- source_word: וּמֵקִים
  choice: и поднять
  rationale: Передаёт каузативный смысл — привести полотнища в стоячее, установленное положение — без тяжеловесного «воздвигнуть».
theological_decisions:
- issue: Кого обозначают «сыновья» в олицетворённом плаче
  choice: Сохранено буквальное «сыновья мои» с пояснением возможного образного смысла в сноске.
  alternative: Передать как «мои жители» или «мой народ».
  rationale: Контекст допускает, что говорит олицетворённый Иерусалим или земля и «сыновья» — её жители, но сам еврейский текст сохраняет родственный образ. Перевод не должен молча устранять эту многозначность.
- issue: Смысл выражения «их нет»
  choice: 'Передано как отсутствие: «больше их нет».'
  alternative: 'Уточнить как смерть: «они погибли».'
  rationale: Еврейская конструкция может выражать отсутствие в нынешнем положении говорящего и сама по себе не требует вывода о смерти; контекст допускает уход или изгнание.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Инверсия «Шатёр мой» и «Сыновья мои» умеренно возвышает речь, но остаётся понятной. Сквозной образ разрушенного шатра сохранён; архаизмы вроде «скиния», «растянуть кущу» и конфессионально окрашенные уточнения не использованы.
