source:
  edition: WLC
  text: שְׁפֹ֣ךְ חֲמָתְ/ךָ֗ עַל הַ/גּוֹיִם֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ךָ וְ/עַל֙ מִשְׁפָּח֔וֹת אֲשֶׁ֥ר בְּ/שִׁמְ/ךָ֖ לֹ֣א קָרָ֑אוּ כִּֽי אָכְל֣וּ אֶֽת יַעֲקֹ֗ב וַ/אֲכָלֻ֨/הוּ֙ וַ/יְכַלֻּ֔/הוּ וְ/אֶת נָוֵ֖/הוּ הֵשַֽׁמּוּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/025.yaml
  text: Pour out your wrath on the nations that do not know you[a], and on the clans that do not call on your name; for they have devoured Jacob, they have devoured him and consumed him, and they have laid waste his habitation.
translation:
  language: ru
  text: Излей ярость Твою на народы, которые не знают Тебя, и на племена, которые не призывают имени Твоего, ибо они пожрали Иакова, пожрали его и уничтожили его, а его жилище опустошили[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его пастбище».'
    reason: Еврейское נָוֶה может обозначать как жилище или место обитания, так и пастбище.
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: Излей
  rationale: Повелительная форма и метафора излияния сохранены естественным для русской молитвенной речи глаголом.
- source_word: חֲמָתְךָ
  choice: ярость Твою
  rationale: חֵמָה обозначает сильный, пылающий гнев; «ярость» передаёт напряжённость просьбы, не смягчая её.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: Речь идёт о чужеземных народах, враждебных Иакову; слово не получает более позднего специального значения «язычники».
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: которые не знают Тебя
  rationale: Сохранена прямая формулировка еврейского текста; возможный оттенок признания Бога не превращён в пояснительный парафраз.
- source_word: מִשְׁפָּחוֹת
  choice: племена
  rationale: Слово обозначает родственные объединения; «племена» естественно сочетается с параллельным «народы» и не сводит смысл к отдельным домашним семьям.
- source_word: בְּשִׁמְךָ לֹא קָרָאוּ
  choice: которые не призывают Твоего имени
  rationale: Передан устойчивый оборот со значением обращения к Богу и поклонения Ему.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание для предшествующей просьбы; «ибо» соответствует достоинству молитвенной речи.
- source_word: אָכְלוּ אֶת יַעֲקֹב וַאֲכָלֻהוּ
  choice: они пожрали Иакова, пожрали его
  rationale: Метафора насильственного поглощения и намеренный повтор одного корня сохранены.
- source_word: וַיְכַלֻּהוּ
  choice: и уничтожили его
  rationale: 'Форма от כלה усиливает предыдущее: враги довели разрушение до конца. «Уничтожили» ясно передаёт эту кульминацию.'
- source_word: נָוֵהוּ
  choice: жилище его
  rationale: נָוֶה допускает значения жилища и пастбища. В данном контексте «жилище» естественно обозначает землю или место обитания Иакова; конкретный образ пастбища сохранён в примечании.
- source_word: הֵשַׁמּוּ
  choice: опустошили
  rationale: Каузативная форма означает сделать безлюдным, разорить; «опустошили» кратко и точно передаёт результат.
theological_decisions:
- issue: Просьба об излиянии Божьей ярости на чужие народы
  choice: Сохранить прямую молитвенную просьбу без смягчения
  alternative: Передать стих лишь как предсказание суда или заменить ярость общим неодобрением
  rationale: Еврейский текст содержит именно напряжённую просьбу о Божьем воздаянии за истребление Иакова; перевод не должен устранять эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому стилю. Повтор «пожрали» намеренно сохранён как риторическое усиление оригинала.
