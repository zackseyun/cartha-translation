base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/022.yaml
  text: The sound of a report—look, it is coming!—a great commotion from the land of the north, to make the cities of Judah a desolation, a haunt of jackals.
translation:
  language: ru
  text: 'Слышен звук вести: вот, она приближается! Великий грохот идёт из земли на севере, чтобы превратить города Иудеи в пустынное запустение, в обиталище шакалов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֤וֹל שְׁמוּעָה֙
  choice: Слышен слух
  rationale: Буквально сочетание означает «звук/голос вести (слуха)». Русское «слышен слух» сохраняет звуковой образ и внезапность сообщения, не превращая его просто в абстрактную «весть».
- source_word: הִנֵּ֣ה בָאָ֔ה
  choice: вот, он приближается
  rationale: הִנֵּה передано естественным указательным «вот», а причастная форма בָאָה — как разворачивающееся приближение; женский род в еврейском согласуется со שְׁמוּעָה, тогда как в русском местоимение согласуется со словом «слух».
- source_word: רַ֥עַשׁ גָּד֖וֹל
  choice: великий грохот
  rationale: רַעַשׁ обозначает сильный шум, грохот или сотрясение. «Грохот» хорошо передаёт угрожающий слуховой образ приближающегося войска, не уточняя его сверх текста.
- source_word: מֵ/אֶ֣רֶץ צָפ֑וֹן
  choice: из северной земли
  rationale: Сохранена буквальная географическая формулировка «из земли севера» без добавления названия конкретной державы.
- source_word: שְׁמָמָ֖ה
  choice: в пустыню
  rationale: Существительное указывает на опустошённое, безлюдное место. В конструкции «превратить ... в пустыню» передаётся результат разорения городов.
- source_word: מְע֥וֹן תַּנִּים
  choice: в логово шакалов
  rationale: מְעוֹן — место обитания, жилище или логово; תַּנִּים в данном контексте традиционно и зоологически правдоподобно передаётся как «шакалы», образ обитаемой дикими зверями разрухи.
