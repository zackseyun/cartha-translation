  to: 'Слышен звук вести: вот, она приближается! Великий грохот идёт из земли на севере, чтобы превратить города Иудеи в пустынное запустение, в обиталище шакалов.'
  rationale: Исправлены две безопасные смысловые и стилистические проблемы. «Звук вести» точно передаёт кוֹל שְׁמוּעָה и позволяет сохранить женский род глагола/местоимения, соотносящийся с «вестью». «Пустынное запустение» передаёт שְׁמָמָה как результат разорения, а «обиталище шакалов» — מְעוֹן תַּנִּים. Пунктуация сохраняет резкое, нарастающее пророческое сообщение.
