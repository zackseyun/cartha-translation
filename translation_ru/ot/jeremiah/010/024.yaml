    text: 'Буквально: «сделать меня малым»; также возможно: «уменьшить меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְּרֵנִי
  choice: Вразуми меня
  rationale: Пиэль глагола יסר обозначает исправляющее наставление или наказание. «Вразуми» естественно и достойно передаёт просьбу об исправлении, не ограничивая смысл одним лишь словесным наставлением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое обращение еврейского текста.
- source_word: אַךְ
  choice: но
  rationale: 'Частица ограничивает просьбу: исправление допускается, но только справедливым образом.'
- source_word: בְּמִשְׁפָּט
  choice: по справедливости
  rationale: מִשְׁפָּט может означать суд, справедливость или должную меру; здесь выражение противопоставлено исправлению в гневе и указывает на правое, соразмерное действие.
- source_word: בְּאַפְּךָ
  choice: в гневе Твоём
  rationale: אַף в данном контексте обозначает гнев; предложная конструкция описывает образ действия.
- source_word: פֶּן
  choice: чтобы… не
  rationale: Естественно передаёт предостережение о нежелательном результате.
- source_word: תַּמְעִיטֵנִי
  choice: умалить меня
  rationale: Хифиль от מעט буквально означает «сделать малым, уменьшить». «Умалить» сохраняет образ и не усиливает его до полного уничтожения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя; транслитерация сохраняет его, не заменяя титулом.
- issue: Смысл בְּמִשְׁפָּט в просьбе об исправлении
  choice: по справедливости
  alternative: по суду; в должной мере
  rationale: Формулировка сохраняет напряжение между необходимым Божьим исправлением и опасностью гнева, не превращая просьбу ни в отказ от суда, ни в требование одной лишь мягкости.
- issue: Степень умаления в תַּמְעִיטֵנִי
  choice: умалить меня
  alternative: свести меня к ничтожеству
  rationale: Еврейский глагол прямо говорит об уменьшении или делании малым; более сильный вариант возможен по контексту, но вводит идею полного уничтожения явнее, чем это делает форма сама по себе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской молитвы. Синтаксис остаётся близким к еврейскому параллелизму; «вразуми» и «умалить» слегка возвышенны, но понятны современному читателю.
