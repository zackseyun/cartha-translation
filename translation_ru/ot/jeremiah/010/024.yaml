  yaml_path: translation/ot/jeremiah/010/024.yaml
  text: Discipline me[a], Yahweh, but with justice, not in your anger[c][b], lest you diminish me.
translation:
  language: ru
  text: Исправь меня[a], Яхве, но по справедливости[b], не в гневе Твоём, иначе Ты умалишь меня[c].
  philosophy: optimal-equivalence
  footnotes:
