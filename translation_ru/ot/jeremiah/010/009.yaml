id: JER.10.9
reference: Jeremiah 10:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֶּ֣סֶף מְרֻקָּ֞ע מִ/תַּרְשִׁ֣ישׁ יוּבָ֗א וְ/זָהָב֙ מֵֽ/אוּפָ֔ז מַעֲשֵׂ֥ה חָרָ֖שׁ וִ/ידֵ֣י צוֹרֵ֑ף תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ לְבוּשָׁ֔/ם מַעֲשֵׂ֥ה חֲכָמִ֖ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/009.yaml
  text: Beaten silver is brought from Tarshish[a], and gold from Uphaz, the work of a craftsman and of the hands of a goldsmith. Blue and purple are their clothing; all of them are the work of skilled men.
translation:
  language: ru
  text: Серебро, выкованное в листы, доставляется из Фарсиса, а золото — из Уфаза[a]; это работа ремесленника, дело рук ювелира. Синие и пурпурные ткани — их одежда; все они — изделия искусных мастеров.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Уфаз — чтение еврейского текста; некоторые считают это название вариантом имени Офир.
    reason: Сохраняется масоретское чтение אוּפָז, при этом отмечается распространённое отождествление или вариант с Офиром.
lexical_decisions:
- source_word: כֶּסֶף מְרֻקָּע
  choice: серебро, выкованное в листы
  rationale: כֶּסֶף обозначает серебро как материал, а страдательное причастие מְרֻקָּע — металл, расплющенный ударами в тонкие листы. Формулировка передаёт и материал, и способ обработки яснее, чем неоднозначное «кованое серебро».
- source_word: מִתַּרְשִׁישׁ יוּבָא
  choice: привозят из Фарсиса
  rationale: Гофал יוּבָא имеет страдательно-каузативное значение «приносится/привозится». «Привозят» естественно передаёт торговый контекст, а топоним תַּרְשִׁישׁ дан в принятой русской библейской форме «Фарсис».
- source_word: וְזָהָב מֵאוּפָז
  choice: а золото — из Уфаза
  rationale: Масоретский текст прямо читает אוּפָז, поэтому в основном тексте сохранён топоним «Уфаз», без замены на предполагаемый Офир.
- source_word: מַעֲשֵׂה חָרָשׁ
  choice: работа ремесленника
  rationale: מַעֲשֵׂה указывает на изготовленное изделие или работу, а חָרָשׁ — на умелого работника. «Ремесленник» точно и без излишнего уточнения передаёт общий термин.
- source_word: וִידֵי צוֹרֵף
  choice: дело рук ювелира
  rationale: Сохранён образ человеческих рук. צוֹרֵף может означать плавильщика, очистителя металла или ювелира; в контексте изготовления предмета из серебра и золота естественно «ювелир».
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: синие и пурпурные ткани
  rationale: Слова обозначают дорогие окрашенные материалы или соответствующие цвета. Добавление «ткани» естественно в связи с одеждой и не сводит выражение только к отвлечённым цветам.
- source_word: לְבוּשָׁם
  choice: их одежда
  rationale: Существительное לְבוּשׁ употреблено в единственном числе с местоименным суффиксом множественного числа и собирательно обозначает одежду идолов.
- source_word: מַעֲשֵׂה חֲכָמִים כֻּלָּם
  choice: все они — изделия искусных мастеров
  rationale: חֲכָמִים в ремесленном контексте означает не мудрецов, а искусных изготовителей. «Мастеров» сохраняет грамматически мужскую форму и профессиональный смысл; «все они» сохраняет отсылку к изготовленным идолам.
theological_decisions:
- issue: Передача חֲכָמִים в ремесленном контексте
  choice: искусных мастеров
  alternative: умелых работников / искусных ремесленников
  rationale: Еврейское слово имеет форму мужского рода множественного числа, но здесь характеризует профессиональное умение, а не духовную или нравственную мудрость. Выбранная формулировка сохраняет мужскую форму и не вносит дополнительного богословского смысла.
- issue: Референт כֻּלָּם («все они»)
  choice: сохранить местоименную отсылку к идолам
  alternative: развернуть как «все эти идолы»
  rationale: Мужская форма כֻּלָּם естественно отсылает к идолам из контекста, тогда как названия тканей не дают такого согласования. Местоимение сохраняет связь с контекстом и не добавляет отсутствующего в стихе существительного.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Использованы понятные ремесленные термины; синтаксис сохраняет параллелизм еврейского текста. Маркер примечания поставлен непосредственно после «Уфаза», к которому относится примечание.
