  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֶל דֶּ֤רֶךְ הַ/גּוֹיִם֙ אַל תִּלְמָ֔דוּ וּ/מֵ/אֹת֥וֹת הַ/שָּׁמַ֖יִם אַל תֵּחָ֑תּוּ כִּֽי יֵחַ֥תּוּ הַ/גּוֹיִ֖ם מֵ/הֵֽמָּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/002.yaml
  text: 'Thus says Yahweh: Do not learn the way of the nations[a], and do not be dismayed at the signs of the heavens, because the nations are dismayed at them.'
translation:
  language: ru
  text: 'Так говорит Яхве:


    «Не перенимайте образ жизни народов[a]

    и не страшитесь знамений на небе,

    потому что их страшатся народы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не учитесь пути народов»; то есть не усваивайте их образ действий и обычаи.'
    reason: Еврейское выражение «учиться пути» образно обозначает усвоение образа действий. Примечание сохраняет буквальный образ оригинала, тогда как основной текст передаёт его естественным современным русским языком.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая и естественная для современного русского языка пророческая формула, сохраняющая торжественный регистр оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: דֶּרֶךְ הַגּוֹיִם
  choice: пути народов
  rationale: 'Сохраняет образное и несколько широкое значение: речь может идти об образе жизни, обычаях и религиозных практиках окружающих народов.'
- source_word: אַל תִּלְמָדוּ
  choice: не учитесь
  rationale: Близко передаёт обычное значение למד; в сочетании с «путём» подразумевается усвоение и перенимание чужих обычаев, но это не раскрывается в основном тексте сверх сказанного оригиналом.
- source_word: אֹתוֹת הַשָּׁמַיִם
  choice: небесных знамений
  rationale: «Знамения» передаёт знаки, воспринимаемые как предвестия, а «небесных» естественно и кратко воспроизводит связь с небесами.
- source_word: תֵּחָתּוּ / יֵחַתּוּ
  choice: не страшитесь / страшатся
  rationale: В данном контексте глагол обозначает состояние страха и смятения перед небесными знамениями. «Страшиться» сохраняет силу выражения и звучит достойно и понятно.
- source_word: כִּי
  choice: потому что
  rationale: 'Ясно передаёт причинную связь: Израилю не следует бояться этих знамений лишь потому, что их боятся другие народы.'
- source_word: מֵהֵמָּה
  choice: их
  rationale: Местоимение отсылает к небесным знамениям; русское управление «страшиться их» естественно передаёт эту связь.
theological_decisions:
- issue: Значение גּוֹיִם в осуждении чужеземных религиозных практик
  choice: народы
  alternative: язычники
  rationale: «Народы» непосредственно и нейтрально передаёт широкий смысл еврейского слова и не сужает его до конфессионально окрашенного обозначения.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал содержит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер небесных אֹתוֹת
  choice: знамения
  alternative: знаки
  rationale: В контексте страха народов слово имеет оттенок предзнаменований, однако перевод «знамения» не утверждает, что этим явлениям действительно присуща предсказательная сила.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксический параллелизм и повтор слова «народы» сохранены; устаревшие и чрезмерно церковнославянские формы не используются.
