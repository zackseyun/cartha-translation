id: JER.10.14
reference: Jeremiah 10:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צוֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/014.yaml
  text: Every man is stupid[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is a lie[c][b], and there is no breath in them.
translation:
  language: ru
  text: Всякий человек неразумен из-за недостатка знания; всякий мастер по металлу посрамлён своим идолом, потому что его литой образ — ложь[a], и нет в них дыхания[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обман»; также возможно: «его литой образ ложен».'
    reason: Слово שֶׁקֶר может обозначать как ложь или обман, так и ложность, ненадёжность самого образа.
  - marker: b
    text: Слово «дыхание» может также означать «дух». Множественное число «в них» относится к идолам как к целому классу.
    reason: Сохраняются лексическая многозначность רוּחַ и переход оригинала от единственного числа к множественному.
lexical_decisions:
- source_word: נִבְעַר
  choice: неразумен
  rationale: Форма от בער выражает огрубелую бессмысленность, а не просто недостаток сведений. «Неразумен» передаёт резкость обличения, оставаясь естественным и достойным в современном русском языке.
- source_word: כָּל אָדָם
  choice: всякий человек
  rationale: אָדָם обозначает человека как представителя человечества; русское «всякий человек» сохраняет обобщающий и дистрибутивный смысл כָּל без неоправданного ограничения только мужчинами.
- source_word: מִדַּעַת
  choice: лишён знания
  rationale: 'Предлог מִן при абстрактном существительном имеет здесь привативный оттенок: человек оказывается без знания. Формулировка также допускает причинное понимание — неразумие вследствие недостатка знания.'
- source_word: הֹבִישׁ
  choice: посрамлён
  rationale: Hiphil от בוש в данном контексте выражает постыдное разоблачение мастера посредством или из-за изготовленного идола. Пассивная русская конструкция хорошо соответствует смыслу.
- source_word: צוֹרֵף
  choice: мастер по металлу
  rationale: Причастие обозначает человека, который плавит, очищает и обрабатывает металл. Широкое обозначение точнее контекста, чем узкие «ювелир» или «золотых дел мастер».
- source_word: מִפָּסֶל
  choice: своим идолом
  rationale: פֶּסֶל — изготовленное культовое изображение; в полемическом контексте «идол» ясно передаёт его функцию. Предлог מִן допускает инструментальный или причинный оттенок, выраженный творительным падежом.
- source_word: שֶׁקֶר
  choice: ложь
  rationale: Существительное означает ложь, обман или ложность. Предикативное «образ — ложь» сохраняет яркую метафору пророческого обличения.
- source_word: נִסְכּוֹ
  choice: его литой образ
  rationale: Слово обозначает образ, изготовленный литьём. Местоименный суффикс сохранён как «его» и естественно соотносится с мастером, хотя конструкция находится рядом с упоминанием идола.
- source_word: וְלֹא רוּחַ בָּם
  choice: и нет в них дыхания
  rationale: רוּחַ может означать дыхание, дух или ветер. В обличении идолов «дыхание» непосредственно указывает на отсутствие жизни; множественное «в них» сохранено вслед за еврейским текстом.
theological_decisions:
- issue: Объём обличения человека
  choice: Сохранено обобщающее «всякий человек», но стих не превращён в отвлечённое утверждение о человечестве во всех отношениях.
  alternative: Истолковать слова как универсальное догматическое суждение о полной неразумности каждого человека вне непосредственной темы идолопоклонства.
  rationale: Ближайший контекст связывает человеческое неразумие с изготовлением идолов и упованием на них; перевод сохраняет широкую формулировку оригинала, не добавляя к ней более узкого или более широкого богословского вывода.
- issue: Безжизненность идолов
  choice: רוּחַ передано как «дыхание», подчёркивая, что изготовленные образы неживы.
  alternative: Передать как «дух» и тем самым сделать акцент на духовной или метафизической природе идолов.
  rationale: В данном противопоставлении изготовленного образа живому существу «дыхание» наиболее прямо передаёт смысл, при этом возможное значение «дух» отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм двух обобщающих утверждений сохранён; редкие или архаичные слова вроде «истукан» и «плавильщик» не использованы. «Посрамлён» оставлено как уместное библейское слово, понятное современному читателю.
