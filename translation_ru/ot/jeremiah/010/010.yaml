id: JER.10.10
reference: Jeremiah 10:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אֱלֹהִים֙ אֱמֶ֔ת הֽוּא אֱלֹהִ֥ים חַיִּ֖ים וּ/מֶ֣לֶךְ עוֹלָ֑ם מִ/קִּצְפּ/וֹ֙ תִּרְעַ֣שׁ הָ/אָ֔רֶץ וְ/לֹֽא יָכִ֥לוּ גוֹיִ֖ם זַעְמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/010.yaml
  text: But Yahweh is the true God[a]; he is the living God and the everlasting King. At his wrath the earth quakes[c][b], and the nations cannot endure his indignation.
translation:
  language: ru
  text: Но Яхве[a] — истинный Бог[b]; Он — живой Бог и вечный Царь[c]. От Его гнева содрогается земля, и народы не могут выдержать Его ярости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «И Яхве»; в контексте союз, вероятно, выражает противопоставление идолам.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Бог истины».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Царь навеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Но Яхве
  rationale: Имя יהוה передано как «Яхве». Союз וְ в данном контексте выражает противопоставление Яхве идолам, описанным выше, поэтому естественно переведён как «но».
- source_word: אֱלֹהִים אֱמֶת
  choice: истинный Бог
  rationale: Сочетание указывает на подлинность Яхве как Бога в противоположность ложным богам; буквальное «Бог истины» также грамматически возможно.
- source_word: הוּא אֱלֹהִים חַיִּים
  choice: Он — живой Бог
  rationale: Сохранено эмфатическое местоимение הוּא и противопоставление живого Бога безжизненным идолам.
- source_word: וּמֶלֶךְ עוֹלָם
  choice: и вечный Царь
  rationale: עוֹלָם обозначает неограниченную длительность; «вечный Царь» естественно и точно передаёт непреходящее царствование.
- source_word: מִקִּצְפּוֹ
  choice: От Его гнева
  rationale: 'Предлог מִן указывает здесь на причину или источник: земля содрогается вследствие Божьего гнева.'
- source_word: תִּרְעַשׁ הָאָרֶץ
  choice: содрогается земля
  rationale: רעש означает сильное сотрясение; «земля» соответствует универсальному масштабу высказывания лучше, чем «страна».
- source_word: וְלֹא יָכִלוּ גוֹיִם
  choice: и народы не могут выдержать
  rationale: יכל с последующим объектом выражает неспособность вынести или выдержать воздействие; גוֹיִם передано обычным коллективным словом «народы».
- source_word: זַעְמוֹ
  choice: Его ярости
  rationale: זַעַם обозначает сильный, карающий гнев. «Ярость» сохраняет интенсивность и помогает отличить это слово от קֶצֶף в предыдущей строке.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблено имя יהוה; транслитерация «Яхве» сохраняет его как личное заветное имя и не заменяет титулом.
- issue: Значение начального союза וְ
  choice: Но
  alternative: И
  rationale: Хотя союз сам по себе часто означает «и», ближайший контекст противопоставляет Яхве созданным людьми идолам, поэтому противительное значение здесь наиболее вероятно.
- issue: Смысл אֱלֹהִים אֱמֶת
  choice: истинный Бог
  alternative: Бог истины
  rationale: Контекст подчёркивает, что Яхве подлинно является Богом, в отличие от ложных богов; альтернативная конструкция возможна и отмечена, чтобы не скрывать неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксический параллелизм еврейского текста сохранён; различие между קֶצֶף и זַעַם передано словами «гнев» и «ярость».
