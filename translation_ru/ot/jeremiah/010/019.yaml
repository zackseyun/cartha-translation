  - marker: b
    text: 'Или: «Моя рана болезненна» или «Моя рана тяжела». Еврейское слово описывает состояние слабости, болезни или тяжести.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «это моя болезнь, и я должен снести её». Форма еврейского глагола допускает как простое будущее, так и оттенок решимости или необходимости.'
