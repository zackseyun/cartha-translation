lexical_decisions:
- source_word: א֥וֹי לִי
  choice: Горе мне
  rationale: Передаёт сильный возглас скорби естественным и достойным современным русским языком.
- source_word: עַל שִׁבְרִי
  choice: из-за моего сокрушения
  rationale: שבר может обозначать перелом, повреждение, крушение или разорение; «сокрушение» сохраняет образ телесной травмы и допускает более широкий смысл бедствия.
- source_word: נַחְלָה מַכָּתִי
  choice: Тяжела моя рана
  rationale: נַחְלָה описывает рану как болезненную, слабую или тяжёлую; «тяжела» передаёт серьёзность состояния, не усиливая значение до «неисцелима».
- source_word: אַךְ
  choice: Поистине
  rationale: Вводит твёрдое, исполненное смирения признание говорящего.
- source_word: זֶה חֳלִי
  choice: это моя болезнь
  rationale: Сохраняет медицинскую метафору и притяжательное значение формы חֳלִי.
- source_word: וְאֶשָּׂאֶנּוּ
  choice: и я понесу её
  rationale: Буквально сохраняет значение נשא «нести» и намеренно не устраняет неоднозначность между простым будущим, решимостью и вынужденным претерпеванием.
theological_decisions:
- issue: 'Оттенок последней фразы: будущее, решимость или необходимость'
  choice: «и я понесу её»
  alternative: «и я должен снести её»
  rationale: Еврейский имперфект допускает простое будущее и контекстуальный оттенок смиренной решимости или необходимости; основной текст сохраняет эту напряжённость без её догматического разрешения.
translation_notes:
