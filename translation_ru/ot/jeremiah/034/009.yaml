  text: לְ֠/שַׁלַּח אִ֣ישׁ אֶת עַבְדּ֞/וֹ וְ/אִ֧ישׁ אֶת שִׁפְחָת֛/וֹ הָ/עִבְרִ֥י וְ/הָ/עִבְרִיָּ֖ה חָפְשִׁ֑ים לְ/בִלְתִּ֧י עֲבָד בָּ֛/ם בִּ/יהוּדִ֥י אָחִ֖י/הוּ אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/009.yaml
  text: that each man should set free his male servant and each man his female servant[a], the Hebrew man and the Hebrew woman, so that no one should enslave a Jew, his brother, among them.
translation:
  language: ru
  text: чтобы каждый отпустил на свободу своего раба-еврея и свою рабыню-еврейку, чтобы никто из них не держал в рабстве иудея, своего брата[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жителя Иудеи, своего брата». Еврейское слово может означать как иудея в этнорелигиозном смысле, так и, в данном историческом контексте, жителя Иудеи.'
    reason: Сохранение подлинной лексической и исторической неоднозначности слова יְהוּדִי.
lexical_decisions:
- source_word: לְשַׁלַּח ... חָפְשִׁים
  choice: отпустил на свободу
  rationale: Сочетание глагола «отпустить» с предикативным «свободными» описывает юридическое освобождение из рабства; русское выражение передаёт и действие, и его результат.
- source_word: עַבְדּוֹ
  choice: своего раба
  rationale: В контексте обязательного освобождения речь идёт о подневольном состоянии, поэтому «раб» точнее нейтрального «слуга».
- source_word: שִׁפְחָתוֹ
  choice: свою рабыню
  rationale: Слово обозначает женщину в рабском или зависимом положении; «рабыня» ясно сохраняет социальный статус и контраст с формой мужского рода.
- source_word: הָעִבְרִי וְהָעִבְרִיָּה
  choice: еврея и еврейку
  rationale: Парные формы мужского и женского рода обозначают этническую принадлежность освобождаемых и естественно передаются по-русски существительными «еврей» и «еврейка».
- source_word: לְבִלְתִּי עֲבָד בָּם
  choice: чтобы никто не держал в рабстве
  rationale: Конструкция выражает цель, а עבד с предлогом ב в данном контексте означает пользоваться человеком как рабом или держать его в рабстве.
- source_word: בִּיהוּדִי אָחִיהוּ אִישׁ
  choice: иудея, своего брата
  rationale: Сохранены обозначение принадлежности к Иудее/иудеям и родственный язык общности; отрицательное «никто» естественно передаёт дистрибутивное אִישׁ.
theological_decisions:
- issue: Передача обозначений подневольного статуса
  choice: «раб» и «рабыня»
  alternative: «слуга» и «служанка»
  rationale: Сюжет касается освобождения людей из реальной зависимости; более мягкие слова могли бы скрыть юридический и социальный смысл повеления.
- issue: Значение יְהוּדִי
  choice: «иудей» в основном тексте
  alternative: «житель Иудеи»
  rationale: В эпоху Иеремии слово может указывать прежде всего на принадлежность к Иудее, но также лежит в основе позднейшего этнорелигиозного обозначения. Основной текст сохраняет традиционно понятное «иудей», а примечание уточняет историческую альтернативу.
- issue: Родственные отношения внутри общины
  choice: сохранено «своего брата»
  alternative: «соплеменника»
  rationale: Буквальное «брата» сохраняет богословски и общественно значимый язык родства, не сводя его заранее только к этнической связи.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-заветного контекста. «Отпустил на свободу» и «держал в рабстве» понятны широкому читателю и не архаичны; парные формы «еврея и еврейку» сохраняют выраженное в источнике различие по полу.
