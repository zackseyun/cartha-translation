base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/021.yaml
  text: And I will give Zedekiah king of Judah and his officials into the hand of their enemies[a], into the hand of those who seek their life, and into the hand of the army of the king of Babylon, which has withdrawn from you.
translation:
  language: ru
  text: И Седекию, царя Иудеи, и его сановников Я отдам в руки их врагов, в руки тех, кто ищет их смерти, и в руки войска царя Вавилона, отступившего от вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отступающего от вас». Буквально: «поднимающегося от вас/с вас»; выражение описывает войско, отходящее от осаждённого города.'
    reason: Лексико-временная неоднозначность еврейского причастия и пояснение пространственной идиомы.
lexical_decisions:
- source_word: צִדְקִיָּהוּ
  choice: Цедекию
  rationale: Устоявшаяся русская передача имени; винительный падеж обусловлен глаголом «отдам».
- source_word: שָׂרָיו
  choice: его сановников
  rationale: שַׂר обозначает высокопоставленных царских служителей, правителей или военачальников; «сановники» естественно передаёт придворно-государственный статус, не сужая значение до военного чина.
- source_word: אֶתֵּן בְּיַד
  choice: Я отдам в руки
  rationale: Сочетание נתן с בְּיַד означает передачу под чужую власть. Формулировка сохраняет образ руки и повтор, оставаясь естественной по-русски.
- source_word: אֹיְבֵיהֶם
  choice: их врагов
  rationale: Прямая передача существительного во множественном числе с местоименным суффиксом третьего лица множественного числа.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: тех, кто ищет их смерти
  rationale: Буквально выражение говорит об ищущих их נֶפֶשׁ, то есть стремящихся лишить их жизни. Русский оборот «искать чьей-либо смерти» сохраняет образ исходного выражения и ясно передаёт смертельную угрозу.
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: войска вавилонского царя
  rationale: חַיִל в данном военном контексте означает войско; конструкция принадлежности естественно передана родительным падежом.
- source_word: הָעֹלִים מֵעֲלֵיכֶם
  choice: которое отступило от вас
  rationale: Буквально — «поднимающееся/уходящее от вас»; в контексте речь о снятии осады и удалении вавилонского войска. «Отступило» ясно передаёт идиоматический смысл, а временная неоднозначность причастия отмечена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Тройное «в руки» сохраняет риторический повтор еврейского текста; заглавное «Я» подчёркивает смену порядка слов и речь Бога без добавления конфессиональной интерпретации.
