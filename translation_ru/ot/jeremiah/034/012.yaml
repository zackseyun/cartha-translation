lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Ваййиктоль от היה отмечает новое развитие повествования; в сочетании с דְבַר יְהוָה естественно образует традиционную пророческую формулу без архаического «и случилось».
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: «Слово» сохраняет устойчивую пророческую формулу и непосредственную связь с откровением, не сужая значение до более толковательного «послание».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в еврейском тексте; примечание сообщает традиционную замену титулом.
- source_word: אֶל יִרְמְיָהוּ
  choice: к Иеремии
  rationale: Предлог אֶל обозначает адресата откровения; русская конструкция «слово ... к» сохраняет формальное устройство исходной формулы.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: מֵאֵת указывает на источник; повтор имени, хотя стилистически необычен, прямо присутствует в масоретском тексте и потому сохранён.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив לאמר вводит последующую прямую речь. В современном русском двоеточие естественно выполняет эту функцию без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст дважды употребляет тетраграмматон как личное имя. Транслитерация сохраняет это, а традиционный вариант указан в примечании.
- issue: Повтор «Яхве ... от Яхве»
  choice: сохранить повтор
  alternative: сгладить как «слово Яхве пришло к Иеремии»
  rationale: 'Повтор засвидетельствован WLC и создаёт реальную, хотя необычную конструкцию: слово Яхве приходит от Яхве. Его устранение молча изменило бы форму исходного текста.'
translation_notes:
  register: Современный литературный русский с сохранением краткой и торжественной пророческой формулы. Необычный повтор Божьего имени оставлен вслед за еврейским текстом; לֵאמֹר передано пунктуационно, поскольку содержание речи следует в следующем стихе.
