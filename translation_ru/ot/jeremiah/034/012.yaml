  text: 'И слово Яхве пришло к Иеремии от Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: יהוה (YHWH) — имя Бога, традиционно передаваемое как «Господь».'
