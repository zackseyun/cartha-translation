base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/018.yaml
  text: And I will hand over the men who transgressed my covenant[a], who did not uphold the words of the covenant that they made before me[c][b], the calf that they cut in two and passed between its pieces.
translation:
  language: ru
  text: И Я предам тех людей, которые преступили Мой завет[a] и не исполнили слов завета[b], заключённого ими предо Мной, как тельца, которого они рассекли надвое и прошли между его частями[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые нарушили Мой завет». Еврейский глагол буквально связан со значением «переходить» и намеренно перекликается с последующим «прошли между его частями».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «слов завета», то есть его постановлений или условий.'
    reason: lexical_alternative
  - marker: c
    text: 'Рассечение животного и прохождение между его частями было обрядом заключения завета: нарушитель тем самым призывал на себя подобную участь (ср. Бытие 15:9–17). В еврейском тексте перед словом «телец» нет слова «как»; заключительная фраза сжата, а сопоставление подразумевается контекстом.'
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И Я отдам
  rationale: נתן буквально означает «дать», а в контексте суда — отдать кого-либо во власть врагов или на погибель. Дополнение раскрывается в следующем стихе, поэтому здесь сохранено лаконичное «отдам».
- source_word: הָאֲנָשִׁים
  choice: тех людей
  rationale: אֲנָשִׁים обозначает конкретных участников завета. В русском «людей» естественно и не устраняет того, что еврейская форма грамматически мужского рода.
- source_word: הָעֹבְרִים אֶת־בְּרִיתִי
  choice: которые преступили Мой завет
  rationale: עבר с прямым дополнением «завет» означает нарушить, преступить его. «Преступили» также позволяет в примечании отметить игру с повторным עבר — «прошли» между частями тельца.
- source_word: לֹא הֵקִימוּ אֶת דִּבְרֵי הַבְּרִית
  choice: не исполнили слов завета
  rationale: הקים в данном сочетании означает подтвердить делом, исполнить или соблюсти установления. Сохранено буквальное «слов завета», а не только истолковывающее «условий».
- source_word: אֲשֶׁר כָּרְתוּ לְפָנָי
  choice: заключённого ими предо Мной
  rationale: כרת ברית — устойчивое выражение «заключить завет» (буквально «рассечь завет»). Пассивная конструкция естественно связывает относительное предложение с «заветом» и сохраняет торжественное «предо Мной».
- source_word: הָעֵגֶל אֲשֶׁר כָּרְתוּ לִשְׁנַיִם
  choice: тельце, которого они рассекли надвое
  rationale: עגל — телец, молодое животное крупного рогатого скота; כרתו לשנים описывает буквальное рассечение на две части. «Рассекли надвое» точно и уместно для ритуального контекста.
- source_word: וַיַּעַבְרוּ בֵּין בְּתָרָיו
  choice: и прошли между его частями
  rationale: Здесь עבר обозначает буквальное прохождение. «Части» ясно передаёт בתרים и сохраняет словесную перекличку с нарушением завета, поясняемую в сноске.
theological_decisions:
- issue: Связь заключительной фразы о тельце с заветом и людьми, подлежащими суду
  choice: 'Передать её как уточнение обряда заключения завета: «завета при тельце, которого…»'
  alternative: 'Считать «тельца» прямым приложением к «людям» либо вставить явное сравнение: «отдам их, как тельца»'
  rationale: Еврейский синтаксис сжат и допускает ощущение приложения, однако отождествление людей с тельцом по форме фразы неестественно по-русски, а явное «как» отсутствует в тексте. Формулировка связывает тельца с названным заветом и сохраняет подразумеваемое ритуальное основание суда, не перенося в этот стих полностью сформулированное последствие из дальнейшего контекста.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. Заглавные местоимения сохраняют речь Бога; «предо Мной» выбрано вместо разговорного «передо Мной» ради достоинства регистра. Сжатый еврейский финал слегка прояснён как указание на обряд, без добавления отсутствующего сравнительного союза.
