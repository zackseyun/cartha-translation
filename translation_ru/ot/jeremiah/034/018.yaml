  rationale: Исправление устраняет добавленное в черновике выражение «завета при тельце» и возвращает заключительной фразе её связь с людьми, нарушившими завет. Союз «как» необходим для грамматической связности русского предложения, но его отсутствие в еврейском тексте отмечено в примечании, чтобы не скрывать сжатость и спорность синтаксиса оригинала. Смысл суда не расширяется за пределы подразумеваемого ритуального соответствия.
