  terminology: «Предам» точно передаёт судебное значение נתן. «Преступили завет», «не исполнили слов завета», «заключённого ими предо Мной», «телец» и «рассекли надвое» сохранены. Примечание о ритуале перенесено к словам, которые оно непосредственно поясняет, и уточнено с учётом текстуальной сжатости.
