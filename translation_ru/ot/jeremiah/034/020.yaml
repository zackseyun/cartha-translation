base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/020.yaml
  text: And I will give them into the hand of their enemies and into the hand of those who seek their life[c][b][a], and their dead bodies will become food for the birds of the sky and for the beasts of the earth.
translation:
  language: ru
  text: Я отдам их в руки их врагов и в руки тех, кто покушается на их жизнь[a]. Их трупы станут пищей небесным птицам и земным зверям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тех, кто ищет их душу» или «тех, кто ищет их жизнь», то есть стремится убить их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אוֹתָם בְּיַד
  choice: Я отдам их в руки
  rationale: Сочетание נתן с בְּיַד означает передачу под чужую власть. Русское «отдам в руки» естественно сохраняет конкретный образ еврейского выражения.
- source_word: אֹיְבֵיהֶם
  choice: врагов
  rationale: Прямое и обычное соответствие; притяжательное значение передано местоимением «их» при глаголе и ясно из контекста.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: тех, кто покушается на их жизнь
  rationale: Еврейская идиома буквально говорит о тех, кто «ищет» чью-либо жизнь, то есть стремится убить. Выбранная формулировка естественна для современного русского языка и сохраняет образ угрозы жизни; буквальная форма отмечена в сноске.
- source_word: וְהָיְתָה נִבְלָתָם
  choice: Их трупы станут
  rationale: נְבֵלָה обозначает мёртвое тело, оставленное без погребения. «Трупы» точно и без смягчения передаёт суровый образ, а «станут» выражает наступающий результат.
- source_word: לְמַאֲכָל
  choice: пищей
  rationale: Творительный падеж после «станут» естественно передаёт предикативное значение «станут пищей».
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: небесным птицам
  rationale: Так сохраняется связь птиц с небом при естественном русском словопорядке.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: и земным зверям
  rationale: בהמה здесь обозначает наземных животных. «Земные звери» сохраняет торжественный и грозный регистр формулы суда и образует параллель с «небесными птицами».
theological_decisions:
- issue: Образ непогребённых тел, пожираемых животными, как часть Божьего суда
  choice: Сохранить конкретный и суровый образ без смягчения
  alternative: Передать лишь общий смысл гибели от рук врагов
  rationale: Текст подчёркивает не только смерть, но и посмертное бесчестие оставленных без погребения тел; это существенная часть образа суда.
- issue: Значение идиомы «искать жизнь/душу»
  choice: Передать как «покушаться на жизнь», снабдив буквальной альтернативой
  alternative: 'Буквально: «искать их душу» или «искать их жизнь»'
  rationale: В данном контексте идиома означает намерение убить, однако сноска сохраняет доступ к конкретному еврейскому образу и его лексической многозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно библейским ритмом. Формула «отдам в руки» сохраняет исходную метафору власти; «трупы» не смягчает сцену суда. Все предложения ясны обычному современному читателю.
