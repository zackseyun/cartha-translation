id: JER.34.4
reference: Jeremiah 34:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַ֚ךְ שְׁמַ֣ע דְּבַר יְהוָ֔ה צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ עָלֶ֔י/ךָ לֹ֥א תָמ֖וּת בֶּ/חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/004.yaml
  text: 'Yet hear the word of Yahweh, Zedekiah king of Judah: Thus says Yahweh concerning you, You shall not die by the sword.'
translation:
  language: ru
  text: 'Но выслушай слово Яхве, Седекия, царь Иудеи. Так говорит Яхве о тебе: «Ты не умрёшь от меча».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Частица вводит контрастное, утешительное уточнение после предшествующего приговора; «но» естественно передаёт этот переход по-русски.
- source_word: שְׁמַע
  choice: выслушай
  rationale: Повелительная форма призывает не просто услышать звук, а принять обращённое к царю пророческое слово; «выслушай» ясно и естественно передаёт это значение.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и конкретное существительное «слово», не заменяя его более толковательным «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: צִדְקִיָּהוּ
  choice: Седекия
  rationale: Использована устоявшаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Прямая и естественная передача сопряжённой конструкции, обозначающей царское достоинство и страну.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет торжественную и устойчивую формулу пророческого посланника.
- source_word: עָלֶיךָ
  choice: о тебе
  rationale: Предлог עַל при глаголе речи обозначает содержание высказывания — то, что относится к судьбе Седекии; нейтральное «о тебе» не вносит враждебного оттенка «против тебя».
- source_word: לֹא תָמוּת
  choice: Ты не умрёшь
  rationale: Отрицание с имперфектом выражает предсказанный будущий исход; русское будущее время передаёт его прямо и торжественно без архаизации.
- source_word: בֶּחָרֶב
  choice: от меча
  rationale: Устойчивое русское выражение сохраняет образ насильственной смерти от оружия и не сужает смысл до гибели именно в сражении.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Характер обещания לֹא תָמוּת בֶּחָרֶב
  choice: «Ты не умрёшь от меча» как предсказание способа смерти
  alternative: Общее обещание, что Седекия не умрёт
  rationale: 'Оборот בֶּחָרֶב ограничивает отрицание: речь идёт не об избавлении от смерти вообще, а о том, что царь не погибнет от меча; дальнейший контекст стиха 5 согласуется с таким прочтением.'
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого регистра. Синтаксис близок к еврейскому, но естественен по-русски; обращение выделено запятыми, а непосредственное пророчество оформлено прямой речью.
