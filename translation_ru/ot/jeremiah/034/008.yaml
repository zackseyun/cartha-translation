base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/008.yaml
  text: 'The word that came to Jeremiah from Yahweh after King Zedekiah had made a covenant with all the people who were in Jerusalem[b][a], to proclaim liberty to them:'
translation:
  language: ru
  text: 'Слово, которое пришло к Иеремии от Яхве после того, как царь Седекия заключил завет[a] со всем народом, находившимся в Иерусалиме, чтобы объявить им освобождение[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рассёк завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «свободу», «отпуск на волю». Еврейское слово обозначает официальное освобождение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל
  choice: Слово, которое пришло к
  rationale: Сохраняет устойчивую пророческую формулу и естественно передаёт идиому היה אל как получение пророком откровения.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: Передаёт источник откровения и непосредственно воспроизводит личное имя, обозначенное тетраграмматоном.
- source_word: אַחֲרֵי כְּרֹת ... בְּרִית
  choice: после того, как ... заключил завет
  rationale: Естественный русский эквивалент древнееврейской идиомы «резать завет»; сохраняет формальный и богословский вес слова בְּרִית.
- source_word: אֶת כָּל הָעָם אֲשֶׁר בִּירוּשָׁלִַם
  choice: со всем народом, находившимся в Иерусалиме
  rationale: Сохраняет всеохватность כָּל и относительное придаточное исходного текста.
- source_word: לִקְרֹא לָהֶם דְּרוֹר
  choice: чтобы объявить им освобождение
  rationale: קרא с דְּרוֹר обозначает официальное провозглашение, а «освобождение» в данном юридическом контексте точнее указывает на отпуск из рабства, чем более общее «свобода».
- source_word: צִדְקִיָּהוּ
  choice: Седекия
  rationale: Традиционная и узнаваемая русская форма библейского имени.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Юридический смысл דְּרוֹר
  choice: освобождение
  alternative: свобода; отпуск на волю
  rationale: В контексте завета об освобождении рабов слово обозначает формальное дарование вольности. «Освобождение» сохраняет юридический оттенок, не сужая формулировку до пояснительного пересказа.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой формулы. Синтаксис сохраняет структуру вводного предложения, продолжающегося в следующих стихах; двоеточие указывает на дальнейшее содержание вести.
