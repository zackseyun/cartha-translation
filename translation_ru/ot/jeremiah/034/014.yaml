  text: מִ/קֵּ֣ץ שֶׁ֣בַע שָׁנִ֡ים תְּֽשַׁלְּח֡וּ אִישׁ֩ אֶת אָחִ֨י/ו הָ/עִבְרִ֜י אֲשֶֽׁר יִמָּכֵ֣ר לְ/ךָ֗ וַ/עֲבָֽדְ/ךָ֙ שֵׁ֣שׁ שָׁנִ֔ים וְ/שִׁלַּחְתּ֥/וֹ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ וְ/לֹֽא שָׁמְע֤וּ אֲבֽוֹתֵי/כֶם֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/014.yaml
  text: At the end of seven years[a], each of you shall send away his Hebrew brother who has been sold to you and has served you six years; you shall send him away free from you[c][b]. But your fathers did not listen to me or incline their ear.
translation:
  language: ru
  text: «По истечении семи лет[a] каждый из вас пусть отпустит своего брата-еврея[b], который был продан тебе[c] и служил тебе шесть лет; отпусти его от себя на свободу». Но ваши отцы не слушали Меня и не склоняли уха своего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Через семь лет». Еврейское выражение указывает на завершение семилетнего периода.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своего соплеменника-еврея». Слово «брат» здесь может обозначать не только родного брата, но и человека из того же народа.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «который продаст себя тебе». В этом правовом контексте еврейскую форму можно понимать и как пассивную, и как возвратную.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: По истечении семи лет
  rationale: Передаёт завершение указанного периода, не уточняя сверх текста способ календарного исчисления.
- source_word: תְּשַׁלְּחוּ אִישׁ
  choice: каждый из вас пусть отпустит
  rationale: Глагол שלח в данном правовом контексте означает освобождение, а אִישׁ при форме множественного числа имеет распределительное значение.
- source_word: אָחִיו הָעִבְרִי
  choice: своего брата-еврея
  rationale: Сохраняет мужской род, единственное число и родственно-заветную лексику אָח, не исключая более широкого значения соплеменника.
- source_word: אֲשֶׁר יִמָּכֵר לְךָ
  choice: который будет продан тебе
  rationale: Прямо передаёт наиболее очевидное пассивное значение нифаля; возможное возвратное понимание вынесено в примечание.
- source_word: וַעֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: и прослужит тебе шесть лет
  rationale: Внутри цитируемого правового предписания русское будущее время естественно обозначает завершившийся к моменту освобождения срок службы.
- source_word: וְשִׁלַּחְתּוֹ חָפְשִׁי מֵעִמָּךְ
  choice: отпусти его от себя на свободу
  rationale: Повтор глагола «отпустить» отражает повтор שלח, а выражение «на свободу» ясно передаёт חָפְשִׁי.
- source_word: וְלֹא שָׁמְעוּ אֲבוֹתֵיכֶם אֵלַי וְלֹא הִטּוּ אֶת אָזְנָם
  choice: Но ваши отцы не слушали Меня и не склоняли уха своего
  rationale: Сохраняет как смысл неповиновения, так и образ внимательного слушания, выраженный упоминанием уха.
theological_decisions:
- issue: Заветно-родственное значение אָח при мужском единственном числе
  choice: своего брата-еврея
  alternative: своего соплеменника-еврея
  rationale: Основной текст сохраняет семейную риторику оригинала и его грамматический род, а более широкое общественное значение отмечено в сноске.
- issue: Характер продажи в долговое служение
  choice: который будет продан тебе
  alternative: который продаст себя тебе
  rationale: Пассивное прочтение непосредственно соответствует форме нифаля и не определяет без необходимости, кто совершил продажу; возвратное прочтение остаётся возможным.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сохраняет переход от обращения во множественном числе к распределительному единственному числу. Образ «склонять ухо» оставлен ради связи с еврейским текстом; он понятен, хотя слегка возвышен.
