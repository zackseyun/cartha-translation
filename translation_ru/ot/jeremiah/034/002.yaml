  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָלֹךְ֙ וְ/אָ֣מַרְתָּ֔ אֶל צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י נֹתֵ֜ן אֶת הָ/עִ֤יר הַ/זֹּאת֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וּ/שְׂרָפָ֖/הּ בָּ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Go and speak to Zedekiah king of Judah, and say to him, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will burn it with fire.’'
translation:
  language: ru
  text: 'Так говорит Яхве, Бог Израиля: «Пойди к Седекии, царю Иудеи, и скажи ему: „Так говорит Яхве: вот, Я отдаю этот город в руки[a] царя Вавилона, и он сожжёт его огнём“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во власть».'
    reason: Поясняет идиоматическое значение выражения «в руки», не устраняя его образ из основного текста.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет устойчивую формулу пророческого посланничества и её торжественное звучание, оставаясь естественной для современного русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача еврейской сопряжённой конструкции.
- source_word: הָלֹךְ
  choice: Пойди
  rationale: Инфинитив абсолютный употреблён с повелительной силой; форма «пойди» естественно вводит поручение.
- source_word: וְאָמַרְתָּ ... וְאָמַרְתָּ אֵלָיו
  choice: к ... и скажи ему
  rationale: Русская конструкция не воспроизводит дословно повтор одного и того же глагола, но ясно сохраняет движение к адресату и передачу ему последующего пророчества.
- source_word: צִדְקִיָּהוּ
  choice: Седекия
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Естественная русская передача приложения к имени правителя.
- source_word: הִנְנִי
  choice: вот, Я
  rationale: «Вот» передаёт торжественную непосредственность и подчёркнутую решимость говорящего без излишней архаизации.
- source_word: נֹתֵן
  choice: отдаю
  rationale: Настоящее время передаёт форму причастия и подчёркивает несомненность объявленного Богом предстоящего действия.
- source_word: הָעִיר הַזֹּאת
  choice: этот город
  rationale: Прямая и естественная передача определённого существительного с указательным местоимением.
- source_word: בְּיַד
  choice: в руки
  rationale: Сохраняет образ передачи в чьи-либо руки, но использует естественную для русского языка форму устойчивого выражения; смысловой вариант дан в сноске.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Прямая передача царского титула и названия государства.
- source_word: וּשְׂרָפָהּ בָּאֵשׁ
  choice: и он сожжёт его огнём
  rationale: Сохраняет мужской субъект, естественно относящийся к царю Вавилона, местоименное указание на город и явное упоминание огня.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте дважды стоит тетраграмматон. Передача «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Образное выражение בְּיַד
  choice: в руки
  alternative: во власть
  rationale: Основной текст сохраняет метафору исходника, тогда как сноска поясняет, что речь идёт о передаче города под власть вавилонского царя.
- issue: Подлежащее при וּשְׂרָפָהּ
  choice: он — царь Вавилона
  alternative: город будет сожжён
  rationale: Глагол стоит в мужском роде и естественно продолжает упоминание царя Вавилона; перевод не заменяет активную конструкцию безличной или страдательной.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы. Синтаксис слегка упрощён ради ясности, но последовательность поручения и прямой речи сохранена. Формы «царь» и «сожжёт огнём» поддерживают библейское достоинство речи без чрезмерной архаики.
