  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/תָּשֻׁ֨בוּ אַתֶּ֜ם הַ/יּ֗וֹם וַ/תַּעֲשׂ֤וּ אֶת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י לִ/קְרֹ֥א דְר֖וֹר אִ֣ישׁ לְ/רֵעֵ֑/הוּ וַ/תִּכְרְת֤וּ בְרִית֙ לְ/פָנַ֔/י בַּ/בַּ֕יִת אֲשֶׁר נִקְרָ֥א שְׁמִ֖/י עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/015.yaml
  text: And you yourselves had turned back today and had done what was right in my eyes[a], by proclaiming liberty, each man to his neighbor[b]; and you had cut a covenant before me in the house that is called by my name.
translation:
  language: ru
  text: Сегодня вы сами вернулись и поступили правильно в Моих глазах, объявив свободу каждый своему ближнему; и заключили[a] завет предо Мной в доме, который носит Моё имя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рассекли завет» — так по-еврейски говорили о заключении завета, возможно, в связи с сопровождавшим его обрядом рассечения жертвенного животного.'
    reason: lexical_alternative
  - marker: b
    text: То есть в храме в Иерусалиме.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: вы сами обратились
  rationale: Глагол שׁוב означает поворот или возвращение. В данном контексте речь идёт о возвращении к правильному поступку, без утверждения о полноте внутреннего покаяния; местоимение אַתֶּם передаёт усиление «вы сами».
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямое и естественное обозначение времени, сохраняющее непосредственность еврейского текста.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: правильно в Моих глазах
  rationale: Сохранён еврейский образ нравственной оценки с Божьей точки зрения; оборот понятен в современном русском языке.
- source_word: לִקְרֹא דְרוֹר
  choice: объявив свободу
  rationale: דְּרוֹר здесь обозначает публично провозглашённое освобождение, особенно освобождение рабов; «объявив свободу» естественно передаёт юридически значимый акт.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: каждый своему ближнему
  rationale: Сохранены распределительное значение и личная взаимосвязь выражения. Русское «каждый» естественно охватывает участников действия, тогда как контекст уточняет освобождение мужчин и женщин из рабства.
- source_word: וַתִּכְרְתוּ בְרִית
  choice: заключили завет
  rationale: Буквально еврейская идиома означает «рассекли завет», однако нормативное русское выражение «заключить завет» ясно передаёт торжественный акт; буквальная образность отмечена в сноске.
- source_word: לְפָנַי
  choice: предо Мной
  rationale: Передаёт совершение завета в присутствии Бога и сохраняет торжественный библейский регистр без архаической перегруженности.
- source_word: בַּבַּיִת אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: в доме, который носит Моё имя
  rationale: Естественно передаёт еврейскую формулу принадлежности и посвящённости Богу. Слово «дом» сохранено в основном тексте, а его референт пояснён в сноске.
theological_decisions:
- issue: Передача идиомы כרת ברית
  choice: заключили завет
  alternative: 'буквально: «рассекли завет»'
  rationale: Идиоматичный русский вариант сохраняет смысл официального и торжественного установления завета, а сноска удерживает жертвенно-ритуальную образность исходного выражения, существенную в ближайшем контексте.
- issue: Степень покаянного смысла глагола וַתָּשֻׁבוּ
  choice: обратились
  alternative: раскаялись; вернулись
  rationale: «Обратились» передаёт изменение направления поведения, не утверждая однозначно глубокого внутреннего покаяния, которое последующий отказ от освобождения ставит под сомнение.
- issue: Выражение אִישׁ לְרֵעֵהוּ
  choice: каждый своему ближнему
  alternative: каждый мужчина своему ближнему
  rationale: Русское распределительное «каждый» точно и естественно передаёт конструкцию; добавление «мужчина» было бы стилистически тяжёлым и могло бы ошибочно исключить упомянутых в контексте рабынь.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «Моих», «Мной», «Моё» пишутся с прописной буквы как местоименные обозначения Бога. Синтаксис сохраняет последовательность еврейских действий, но избегает неестественного для русского плюсквамперфекта.
