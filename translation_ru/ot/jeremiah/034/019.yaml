  naturalness: 'Форма «весь народ земли — всех, кто прошёл» в современном русском грамматически сбивчива: после единственного коллективного существительного возникает винительное множественное «всех». Причастный оборот при «народе» устраняет проблему и сохраняет структуру оригинала.'
