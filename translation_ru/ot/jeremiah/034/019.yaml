base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/019.yaml
  text: the officials of Judah and the officials of Jerusalem[a], the court officials and the priests, and all the people of the land who passed between the pieces of the calf—
translation:
  language: ru
  text: правителей Иудеи и правителей Иерусалима, придворных чиновников[a], священников и весь народ земли, прошедший между частями разрубленного телёнка, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евнухов». Еврейское слово может обозначать и евнухов, и придворных должностных лиц.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: правителей
  rationale: Слово שַׂר обозначает правителя или высокопоставленного должностного лица. «Правители» естественно передаёт статус обеих названных групп и согласуется с управлением предыдущего стиха.
- source_word: יְהוּדָה
  choice: Иудеи
  rationale: Общепринятая русская форма географического названия; родительный падеж обусловлен сочетанием «правителей Иудеи».
- source_word: יְרוּשָׁלִַם
  choice: Иерусалима
  rationale: Общепринятая русская форма названия города; родительный падеж обусловлен сочетанием «правителей Иерусалима».
- source_word: הַסָּרִסִים
  choice: придворных
  rationale: סָרִיס может обозначать как евнуха, так и придворного служащего. В перечне общественных групп функциональное значение вероятно, а лексическая неоднозначность сохранена в сноске.
- source_word: הַכֹּהֲנִים
  choice: священников
  rationale: Стандартный и точный русский эквивалент כֹּהֲנִים; винительный падеж продолжает перечисление из предыдущего стиха.
- source_word: כֹל עַם הָאָרֶץ
  choice: весь народ земли
  rationale: Сохраняет коллективный охват и библейское общественное выражение עַם הָאָרֶץ, не добавляя спорного уточнения «простой народ».
- source_word: הָעֹבְרִים
  choice: всех, кто прошёл
  rationale: Причастие относится ко всем перечисленным участникам обряда. Русская относительная конструкция ясно выражает этот широкий охват и завершённое действие.
- source_word: בֵּין
  choice: между
  rationale: Прямой и естественный эквивалент предлога в описании обряда заключения завета.
- source_word: בִּתְרֵי
  choice: частями рассечённого
  rationale: בֶּתֶר означает отделённую, рассечённую часть. Формулировка передаёт как сами части, так и подразумеваемое рассечение животного.
- source_word: הָעֵגֶל
  choice: телёнка
  rationale: עֵגֶל обычно означает телёнка; это согласуется с непосредственно предшествующим описанием разрубленного надвое животного.
theological_decisions:
- issue: Значение סָרִיסִים в перечне общественных групп
  choice: В основном тексте — «придворных»
  alternative: «евнухов»
  rationale: Еврейское слово допускает как указание на физический статус евнухов, так и обозначение придворных должностных лиц. Контекст перечня групп, участвовавших в завете, благоприятствует административному значению, однако подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формы винительного падежа продолжают синтаксис предыдущего стиха. Тире в конце сохраняет незавершённость предложения, которое продолжается в следующем стихе.
