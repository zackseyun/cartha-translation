id: JER.34.1
reference: Jeremiah 34:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה וּ/נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֣ל וְ/כָל חֵיל֡/וֹ וְ/כָל מַמְלְכ֣וֹת אֶרֶץ֩ מֶמְשֶׁ֨לֶת יָד֜/וֹ וְ/כָל הָ/עַמִּ֗ים נִלְחָמִ֧ים עַל יְרוּשָׁלִַ֛ם וְ/עַל כָּל עָרֶ֖י/הָ לֵ/אמֹֽר־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], when Nebuchadnezzar king of Babylon and all his army, and all the kingdoms of the earth under the dominion of his hand, and all the peoples, were fighting against Jerusalem and against all its cities, saying[b],
translation:
  language: ru
  text: 'Слово, которое пришло к Иеремии от Яхве, когда Навуходоносор[a], царь Вавилона, всё его войско, все царства земли[b], подвластные его руке, и все народы воевали против Иерусалима и всех его городов, гласило:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь форма имени «Навуходреццар»; «Навуходоносор» — его традиционная русская форма.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «царства страны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: Сохраняет принятую в пророческих книгах формулу, вводящую Божье откровение.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: которое пришло к
  rationale: Естественно передаёт устойчивую древнееврейскую формулу о слове, данном пророку.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: Передаёт источник слова и прямо воспроизводит личное имя Бога, стоящее в еврейском тексте.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Употреблена узнаваемая и закрепившаяся в русском языке форма имени; особенность еврейского написания отмечена в сноске.
- source_word: חֵילוֹ
  choice: всё его войско
  rationale: В контексте осады חַיִל обозначает вооружённые силы; «войско» соответствует достоинству библейского повествования и понятно современному читателю.
- source_word: מַמְלְכוֹת אֶרֶץ
  choice: царства земли
  rationale: Сохраняет широкий смысл אֶרֶץ, не устраняя возможное прочтение «страны»; альтернатива отмечена в сноске.
- source_word: מֶמְשֶׁלֶת יָדוֹ
  choice: подвластные его руке
  rationale: Передаёт и значение господства, и конкретный образ руки как символа власти.
- source_word: הָעַמִּים
  choice: народы
  rationale: Передаёт множественное число и этнополитический смысл עַמִּים без неуместной конкретизации.
- source_word: נִלְחָמִים עַל
  choice: воевали против
  rationale: Передаёт продолжающееся военное действие причастной формы и направленность против Иерусалима.
- source_word: כָּל עָרֶיהָ
  choice: всех его городов
  rationale: Местоимение соотнесено с Иерусалимом как главным городом и центром окружающей территории; עָרִים передано обычным словом «города».
- source_word: לֵאמֹר
  choice: 'гласило:'
  rationale: Естественно вводит последующую прямую речь в русском языке и сохраняет связь всего заголовочного предложения со словами следующего стиха.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как личное имя Бога; «Яхве» непосредственно передаёт его, не заменяя титулом.
- issue: Грамматическая связь לֵאמֹר с последующим пророчеством
  choice: 'гласило:'
  alternative: 'говоря; со словами:'
  rationale: Еврейская конструкция вводит прямую речь следующего стиха. Русское «гласило» делает эту функцию ясной, не добавляя нового говорящего и не разрешая содержание речи заранее.
translation_notes:
  register: Современный литературный русский с достоинством пророческой прозы. Синтаксис сохраняет длинную вводную конструкцию оригинала, но завершение «гласило:» естественно подводит к прямой речи следующего стиха.
