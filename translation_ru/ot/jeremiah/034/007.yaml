  text: while the army of the king of Babylon was fighting against Jerusalem and against all the remaining cities of Judah[a], against Lachish and against Azekah, for these alone remained among the cities of Judah as fortified cities.
translation:
  language: ru
  text: а войско вавилонского царя в это время сражалось против Иерусалима и против всех ещё остававшихся городов Иудеи[a] — против Лахиша и Азеки, потому что из укреплённых городов Иудеи оставались только они.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а именно против Лахиша и Азеки». Еврейский текст допускает понимание, при котором здесь уточняется, какие именно города Иудеи ещё оставались и против каких велись военные действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: войско
  rationale: В данном военном контексте слово обозначает вооружённые силы; «войско» естественно сочетается с указанием на царя и сохраняет собирательное значение.
- source_word: נִלְחָמִים
  choice: сражалось
  rationale: Причастие выражает продолжавшееся военное действие. В русском языке сказуемое согласуется с собирательным существительным «войско» в единственном числе.
- source_word: הַנּוֹתָרוֹת
  choice: ещё остававшихся
  rationale: Форма указывает на города, которые к тому времени ещё не были взяты; «ещё» ясно передаёт временной и контрастный оттенок.
- source_word: אֶל לָכִישׁ וְאֶל עֲזֵקָה
  choice: против Лахиша и Азеки
  rationale: Повтор направления военного действия сохраняет явный еврейский синтаксис и не устраняет возможную неоднозначность связи этой фразы с предшествующим упоминанием оставшихся городов.
- source_word: כִּי הֵנָּה
  choice: потому что… только они
  rationale: Женское местоимение относится к двум названным городам; ограничительное «только» не выражено отдельной частицей, но следует из поясняющего контекста.
- source_word: נִשְׁאֲרוּ
  choice: оставались
  rationale: Глагол обозначает, что эти города продолжали оставаться невзятыми, в отличие от других городов.
- source_word: בְּעָרֵי יְהוּדָה עָרֵי מִבְצָר
  choice: из укреплённых городов Иудеи
  rationale: 'Русская партитивная конструкция естественно передаёт смысл: среди иудейских укреплённых городов оставались именно эти два.'
