  terminology: «Сановники», «завет», «раб», «рабыня» и «держать в рабстве» уместны в современном литературном русском и точно отражают историко-правовой характер текста. Распределительное «каждый» сохранено, без ошибочного предположения, будто второе אִישׁ говорит о женщине-владельце.
