base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/010.yaml
  text: So all the officials and all the people who had entered into the covenant to send away[a], each man his male servant and each man his female servant, free, so as not to make them serve any longer[b], obeyed and sent them away.
translation:
  language: ru
  text: И все сановники и весь народ, вступившие в завет, отпустить на свободу — каждый своего раба и каждый свою рабыню, — чтобы впредь не держать их в рабстве, послушались[a] — послушались и отпустили их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «услышали» или «выслушали». Здесь глагол, повторённый в еврейском тексте, означает, что они повиновались принятому обязательству.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ ... וַיִּשְׁמְעוּ
  choice: послушались ... послушались
  rationale: В данном контексте שׁמע означает не просто восприятие на слух, а повиновение условиям завета, подтверждённое последующим освобождением рабов. Повтор глагола сохранён как повествовательное усиление.
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: Слово обозначает представителей правящей верхушки и власти; «сановники» естественно для исторического повествования и не предполагает, что все они были князьями по титулу.
- source_word: בָּאוּ בַבְּרִית
  choice: вступившие в завет
  rationale: Передаёт еврейскую идиому участия в формально заключённом завете естественным современным русским выражением.
- source_word: לְשַׁלַּח ... וַיְשַׁלֵּחוּ
  choice: отпустить на свободу ... отпустили
  rationale: В контексте освобождения от подневольного состояния שׁלח означает отпустить; добавление «на свободу» в первом случае ясно выражает юридико-социальный смысл, а заключительный глагол передан кратко.
- source_word: אִישׁ ... וְאִישׁ
  choice: каждый ... и каждый
  rationale: Сохранена явная распределительная конструкция оригинала, относящая обязанность отдельно к владельцу раба и владелице либо владельцу рабыни без нейтрализации повторения.
- source_word: עַבְדּוֹ וְאִישׁ אֶת שִׁפְחָתוֹ
  choice: своего раба и ... свою рабыню
  rationale: В правовом контексте освобождения речь идёт о подневольном статусе, поэтому «раб» и «рабыня» точнее, чем более мягкие «слуга» и «служанка», и сохраняют различение пола.
- source_word: חָפְשִׁים
  choice: на свободу
  rationale: Предикативное состояние освобождаемых естественно выражено по-русски сочетанием «отпустить на свободу».
- source_word: לְבִלְתִּי עֲבָד בָּם עוֹד
  choice: чтобы больше не держать их в рабстве
  rationale: Передаёт цель освобождения и продолжавшуюся принудительную зависимость; формулировка ясна и не сводит смысл лишь к отдельным работам.
theological_decisions:
- issue: Терминология рабства в контексте освобождения
  choice: «раб» и «рабыня»
  alternative: «слуга» и «служанка»
  rationale: Заветное обязательство касается прекращения подневольного статуса, поэтому прямые термины сохраняют социальную и нравственную остроту текста, не смягчая её.
- issue: Значение שׁמע в заветном контексте
  choice: «послушались»
  alternative: «услышали» или «выслушали»
  rationale: Последующее действие показывает, что речь идёт о выполнении принятого обязательства. Сноска сохраняет доступ к буквальному диапазону значения.
- issue: Повтор וַיִּשְׁמְעוּ
  choice: 'сохранить оба употребления: «послушались; они послушались»'
  alternative: сгладить до одного глагола
  rationale: Повтор присутствует в еврейском тексте и подчёркивает фактическое повиновение; его сохранение не разрешает авторское риторическое напряжение путём стилистического сокращения.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-пророческого повествования. Тире выделяют распределительное пояснение, а точка с запятой помогает сохранить необычный еврейский повтор без чрезмерной тяжеловесности.
