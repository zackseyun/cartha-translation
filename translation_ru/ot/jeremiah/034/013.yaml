id: JER.34.13
reference: Jeremiah 34:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אָנֹכִ֗י כָּרַ֤תִּֽי בְרִית֙ אֶת אֲב֣וֹתֵי/כֶ֔ם בְּ/י֨וֹם הוֹצִאִ֤/י אוֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בֵּ֥ית עֲבָדִ֖ים לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/013.yaml
  text: 'Thus says Yahweh, the God of Israel: I myself made a covenant with your fathers on the day I brought them out from the land of Egypt, from the house of servants, saying,'
translation:
  language: ru
  text: 'Так говорит Яхве, Бог Израиля: «Я сам заключил завет[a] с вашими отцами в тот день, когда вывел их из земли Египта, из дома рабства[b], сказав:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разрезал завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из дома рабов»; возможно также: «из дома неволи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула; сохраняет торжественный посланнический характер и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача сочетания, сохраняющая заветное самоопределение.
- source_word: אָנֹכִי
  choice: Я сам
  rationale: Самостоятельное местоимение при уже выраженном в глаголе лице допускает смысловое выделение; русское «Я сам» передаёт его без чрезмерного усиления.
- source_word: כָּרַתִּי בְרִית
  choice: заключил завет
  rationale: Естественный русский эквивалент древнееврейской идиомы «разрезал завет»; буквальный образ отмечен в сноске.
- source_word: אֶת אֲבֹתֵיכֶם
  choice: с вашими отцами
  rationale: Сохраняет явно мужское множественное число исходного текста и историческую связь с поколением исхода.
- source_word: בְּיוֹם
  choice: в тот день, когда
  rationale: Передаёт временную формулу полно и естественно, не сводя её к одному союзу «когда».
- source_word: הוֹצִיאִי אוֹתָם
  choice: вывел их
  rationale: Обычная передача каузативной формы יצא в повествованиях об исходе; сохраняет межтекстовую формулу.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египта
  rationale: Сохраняет полное географическое выражение и избегает ненужной архаизации формы «земли Египетской».
- source_word: מִבֵּית עֲבָדִים
  choice: из дома рабства
  rationale: Устойчивая и ясная русская формула, точно выражающая место порабощения; буквальное «дом рабов» приведено в сноске.
- source_word: לֵאמֹר
  choice: 'сказав:'
  rationale: Вводит содержание заветного повеления в следующем стихе; двоеточие показывает продолжение прямой речи.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное заветное имя в основном тексте и не подменяет его титулом.
- issue: Степень подчёркивания אָנֹכִי
  choice: Я сам
  alternative: Я
  rationale: Исходный текст использует самостоятельное местоимение наряду с личной формой глагола. «Я сам» сохраняет возможный акцент, не исключая обычной функции местоимения.
- issue: Передача עֲבָדִים в формуле исхода
  choice: рабство
  alternative: рабы; служение
  rationale: Контекст говорит о реальном порабощении в Египте. «Рабство» не смягчает эту реальность и естественно сочетается с русским выражением «дом рабства»; конкретное буквальное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим регистром. Сохранены личное имя Яхве, формула завета и связь с исходом. Открывающая кавычка оставлена незакрытой, поскольку прямая речь продолжается в следующем стихе.
