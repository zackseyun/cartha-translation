  terminology: «Яхве» корректно передаёт тетраграмматон. «Благовония» допустимо как экспликация вероятного смысла מִשְׂרֵפוֹת, если сопровождается сноской, уточняющей, что буквально говорится об обрядовых сожжениях и что это не сожжение тела. «Государь» адекватно передаёт почтительное обращение к царю.
