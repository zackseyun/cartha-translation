  text: בְּ/שָׁל֣וֹם תָּמ֗וּת וּֽ/כְ/מִשְׂרְפ֣וֹת אֲ֠בוֹתֶי/ךָ הַ/מְּלָכִ֨ים הָ/רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ כֵּ֚ן יִשְׂרְפוּ לָ֔/ךְ וְ/ה֥וֹי אָד֖וֹן יִסְפְּדוּ לָ֑/ךְ כִּֽי דָבָ֥ר אֲנִֽי דִבַּ֖רְתִּי נְאֻם יְהוָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/005.yaml
  text: You will die in peace[a]. And as spices were burned for your fathers, the former kings who were before you, so they will burn spices for you, and they will lament for you, saying, “Alas, lord!” For I have spoken the word[b], declares Yahweh.
translation:
  language: ru
  text: 'Ты умрёшь мирно. И как сжигали благовония в честь твоих отцов — царей, бывших прежде тебя, — так будут сжигать благовония и в твою честь[a]. Тебя будут оплакивать, восклицая: «Увы, государь!»[b] Ибо Я изрёк это слово, — возвещает Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как устраивали сожжения для твоих отцов… так устроят сожжение для тебя». Речь, вероятно, об обрядовом сожжении благовоний в честь умерших царей, а не о сожжении тела.'
    reason: cultural_note
  - marker: b
    text: 'Или: «О господин!» Это установленный возглас плача по умершему правителю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׁלוֹם תָּמוּת
  choice: Ты умрёшь с миром
  rationale: Сохраняет еврейский оборот и обещание ненасильственной, спокойной смерти, не сводя смысл лишь к внутреннему умиротворению.
- source_word: וּכְמִשְׂרְפוֹת
  choice: И как сжигали благовония
  rationale: В контексте царских похорон речь идёт о почётном обрядовом сожжении ароматических веществ, а не о кремации тела; конкретизация делает смысл понятным современному читателю.
- source_word: אֲבוֹתֶיךָ הַמְּלָכִים הָרִאשֹׁנִים אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: твоих отцов — прежних царей, которые были до тебя
  rationale: «Отцов» передаёт буквальное значение, а поясняющее приложение указывает, что имеются в виду царственные предшественники.
- source_word: כֵּן יִשְׂרְפוּ לָךְ
  choice: так будут сжигать их и в твою честь
  rationale: Местоимение отсылает к благовониям; выражение «в твою честь» естественно передаёт дательный оборот и погребально-почётный характер действия.
- source_word: וְהוֹי אָדוֹן יִסְפְּדוּ לָךְ
  choice: 'Тебя будут оплакивать, восклицая: «Увы, государь!»'
  rationale: Глагол обозначает обрядовый плач, הוֹי — возглас скорби, а אָדוֹן здесь служит почтительным обращением к умершему царю.
- source_word: כִּי דָבָר אֲנִי דִבַּרְתִּי
  choice: Ибо Я изрёк это слово
  rationale: Сохраняет сочетание существительного и глагола одного смыслового поля и подчёркивает непреложность Божьего обещания.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу и прямо воспроизводит личное имя Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» передаёт личное имя, не заменяя его титулом.
- issue: Характер царского сожжения
  choice: обрядовое сожжение благовоний в честь умершего царя
  alternative: погребальный костёр; неопределённое «сожжение»
  rationale: Контекст обещает почётные царские похороны. Такое прочтение не создаёт ошибочного впечатления, будто речь идёт о кремации царского тела.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; слова «ибо» и «изрёк» поддерживают достоинство формулы, не делая текст чрезмерно архаичным.
