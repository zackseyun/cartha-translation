- from: 'Ты умрёшь с миром. И как сжигали благовония в честь твоих отцов — прежних царей, которые были до тебя, — так будут сжигать их и в твою честь[a]. Тебя будут оплакивать, восклицая: «Увы, государь!»[b] Ибо Я изрёк это слово, — возвещает Яхве.'
  to: 'Ты умрёшь мирно. И как сжигали благовония в честь твоих отцов — царей, бывших прежде тебя, — так будут сжигать благовония и в твою честь[a]. Тебя будут оплакивать, восклицая: «Увы, государь!»[b] Ибо Я изрёк это слово, — возвещает Яхве.'
  rationale: Правка устраняет неестественное «с миром», облегчает тяжёлую кальку о прежних царях и повторяет «благовония» во второй части сравнения ради ясности. Экспликация остаётся ограниченной и отмечена сноской как вероятное культурно-историческое значение; текст не утверждает кремацию тела и не навязывает спорного толкования.
