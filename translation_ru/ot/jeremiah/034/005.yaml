  source_fidelity: 'Смысл передан в целом точно: обещаны мирная смерть, почётный погребальный обряд, плач по царю и подтверждение словом Яхве. Однако «с миром» в современном русском прежде всего связано с формулой ухода («идти с миром») и менее ясно передаёт обстоятельство смерти. Формулировку второго действия лучше сделать явной, не оставляя местоимение «их» с несколько тяжёлым и потенциально неясным соотнесением.'
