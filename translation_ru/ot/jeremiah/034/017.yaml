  text: לָ/כֵן֮ כֹּה אָמַ֣ר יְהוָה֒ אַתֶּם֙ לֹֽא שְׁמַעְתֶּ֣ם אֵלַ֔/י לִ/קְרֹ֣א דְר֔וֹר אִ֥ישׁ לְ/אָחִ֖י/ו וְ/אִ֣ישׁ לְ/רֵעֵ֑/הוּ הִנְ/נִ֣י קֹרֵא֩ לָ/כֶ֨ם דְּר֜וֹר נְאֻם יְהוָ֗ה אֶל הַ/חֶ֨רֶב֙ אֶל הַ/דֶּ֣בֶר וְ/אֶל הָ/רָעָ֔ב וְ/נָתַתִּ֤י אֶתְ/כֶם֙ ל/זועה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/017.yaml
  text: 'Therefore thus says Yahweh: You have not listened to me[a], to proclaim liberty, each man to his brother and each man to his neighbor. Behold, I am proclaiming liberty for you, declares Yahweh—to the sword, to the pestilence[c][b], and to the famine—and I will make you a horror to all the kingdoms of the earth.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве: «Вы не послушали Меня и не провозгласили освобождения — каждый своему брату и каждый своему ближнему. Вот, Я провозглашаю вам освобождение[a] — возвещает Яхве — к мечу, мору и голоду[b], и сделаю вас ужасом[c] для всех царств земли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово также можно перевести как «свобода» или «отпущение». В этом стихе оно повторено дважды, создавая намеренную иронию.
    reason: lexical_alternative
  - marker: b
    text: То есть Яхве «освобождает» их, отдавая мечу, мору и голоду как орудиям суда.
    reason: cultural_note
  - marker: c
    text: 'Или: «предметом ужаса»; возможный смысл: «тем, что наводит страх».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма «Яхве» укоренилась в современной русской библеистической речи.
- source_word: שְׁמַעְתֶּם אֵלַי
  choice: послушали Меня
  rationale: Сохраняет образ слушания и одновременно допускает подразумеваемое значение повиновения, не сводя выражение только к «повиновались».
- source_word: לִקְרֹא דְרוֹר / דְּרוֹר
  choice: провозгласить освобождение / освобождение
  rationale: 'В контексте речь идёт о публичном освобождении рабов. Повтор одного русского слова сохраняет намеренную иронию: отказавшиеся освободить ближних сами получают «освобождение» к орудиям суда.'
- source_word: אִישׁ לְאָחִיו וְאִישׁ לְרֵעֵהוּ
  choice: каждый своему брату и каждый своему ближнему
  rationale: Сохраняет повтор и распределительное значение אִישׁ, а также различие между «братом» и «ближним».
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Передаёт торжественное введение близкого и решительного Божьего действия естественным современным русским оборотом.
- source_word: קֹרֵא לָכֶם דְּרוֹר
  choice: Я провозглашаю вам освобождение
  rationale: Настоящее время передаёт живое, непосредственно наступающее действие причастной формы; формулировка сохраняет повтор ключевого слова.
- source_word: אֶל הַחֶרֶב אֶל הַדֶּבֶר וְאֶל הָרָעָב
  choice: к мечу, мору и голоду
  rationale: Сохраняет повторно подразумеваемое направление אֶל и резкую иронию исходного текста, не раскрывая её прямо внутри перевода. «Мор» — традиционное, но понятное обозначение массовой смертоносной эпидемии в пророческом контексте.
- source_word: לְזַוֲעָה
  choice: ужасом
  rationale: Передаёт значение того, что вызывает ужас и потрясение; творительный падеж естественно сочетается с «сделаю вас».
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: всех царств земли
  rationale: Передаёт широкий международный охват выражения, а не ограничивает его землёй Иудеи.
theological_decisions:
- issue: Иронический повтор דְּרוֹר
  choice: «освобождение» в обеих частях стиха
  alternative: 'Во второй части пояснить: «отдам вас во власть меча, мора и голода»'
  rationale: Одинаковое слово сохраняет богословски значимую меру воздаяния и словесную иронию исходного текста, тогда как поясняющий вариант устранил бы напряжение.
- issue: Смысл выражения «к мечу, мору и голоду»
  choice: Сохранить направительную конструкцию и пояснить её в сноске
  alternative: 'Внести толкование непосредственно в текст: «освобождаю вас для меча, мора и голода» или «отдаю вас во власть...»'
  rationale: 'Еврейская формулировка намеренно резка: даруемое Богом «освобождение» оказывается передачей ослушавшихся силам суда. Сноска делает смысл доступным, не стирая риторического напряжения.'
- issue: Распределительная мужская формула אִישׁ ... אִישׁ
  choice: «каждый своему брату и каждый своему ближнему»
  alternative: «все своим ближним»
  rationale: Выбранный вариант сохраняет грамматическую форму, юридико-социальный контекст и выразительный повтор оригинала, не вводя дополнительных уточнений.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксический повтор «каждый... и каждый...» и повтор «освобождение» намеренно сохранены. «Возвещает Яхве» передаёт формулу נְאֻם יְהוָה без архаического «речение»; «мор» поддерживает библейский регистр, оставаясь понятным из сочетания с мечом и голодом.
