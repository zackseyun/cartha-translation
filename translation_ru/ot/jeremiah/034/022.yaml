base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/022.yaml
  text: Behold[a], I am commanding, declares Yahweh, and I will bring them back to this city, and they will fight against it and capture it and burn it with fire. And I will make the cities of Judah a desolation[b], without inhabitant.
translation:
  language: ru
  text: «Вот, Я отдаю повеление, — возвещает Яхве, — и возвращу их в этот город[a]. Они будут сражаться против него, захватят его и сожгут огнём. А города Иудеи Я предам запустению[b], так что в них не останется жителей».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приведу их обратно в этот город». Древнееврейская форма имеет каузативный смысл: Яхве вернёт к Иерусалиму отступившие вражеские войска.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сделаю пустынными, без жителей». Древнееврейское выражение подчёркивает полное разорение и обезлюдение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сочетание הִנֵּה с местоименным суффиксом вводит торжественное и непосредственное Божье заявление. «Вот, Я» сохраняет пророческий акцент и понятно современному читателю.
- source_word: מְצַוֶּה
  choice: повелеваю
  rationale: Причастная форма передаёт действие, объявляемое как непосредственное и уже исходящее от Бога. Настоящее время естественно выражает это по-русски.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана торжественно, но естественно; личное имя יהוה транслитерировано как «Яхве».
- source_word: וַהֲשִׁבֹתִים
  choice: и возвращу их
  rationale: 'Hiphil глагола שוב имеет каузативное значение: Бог вернёт к городу вражеские войска, ранее отступившие от него. Местоимение «их» сохраняет отсылку к предшествующему контексту.'
- source_word: וְנִלְחֲמוּ עָלֶיהָ
  choice: Они будут сражаться против него
  rationale: Передаёт военное действие, направленное против города, не сужая значение до одного штурма.
- source_word: וּלְכָדוּהָ
  choice: захватят его
  rationale: В контексте осады לכד означает взятие города военной силой.
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  choice: сожгут огнём
  rationale: Сохраняется выразительная древнееврейская конструкция с указанием средства уничтожения.
- source_word: אֶתֵּן שְׁמָמָה
  choice: превращу в ... пустошь
  rationale: 'Конструкция נתן со שְׁמָמָה описывает результат: города станут опустошённым, разорённым местом.'
- source_word: מֵאֵין יֹשֵׁב
  choice: безлюдную
  rationale: Кратко и естественно передаёт отсутствие жителей, выраженное древнееврейской идиомой.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога — тетраграмматон יהוה. Транслитерация «Яхве» сохраняет различие между личным именем и титулом «Господь».
- issue: Кто возвращается в город
  choice: Вражеские войска, обозначенные местоимением «их»
  alternative: Явно назвать в тексте халдейское войско
  rationale: Непосредственный контекст указывает на войско вавилонского царя, однако сам стих использует только местоименный суффикс. Перевод сохраняет эту контекстуальную отсылку и не добавляет отсутствующее в стихе название.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис разделён на ясные фразы, при этом сохранены последовательность действий, торжественная формула речи Яхве и образ сожжения огнём.
