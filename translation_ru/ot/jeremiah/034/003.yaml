  text: וְ/אַתָּ֗ה לֹ֚א תִמָּלֵט֙ מִ/יָּד֔/וֹ כִּ֚י תָּפֹ֣שׂ תִּתָּפֵ֔שׂ וּ/בְ/יָד֖/וֹ תִּנָּתֵ֑ן וְֽ֠/עֵינֶי/ךָ אֶת עֵינֵ֨י מֶֽלֶךְ בָּבֶ֜ל תִּרְאֶ֗ינָה וּ/פִ֛י/הוּ אֶת פִּ֥י/ךָ יְדַבֵּ֖ר וּ/בָבֶ֥ל תָּבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/003.yaml
  text: And you will not escape from his hand[a], for you will surely be captured and given into his hand. Your eyes will see the eyes of the king of Babylon, and his mouth will speak to your mouth, and you will go to Babylon.
translation:
  language: ru
  text: 'И ты не спасёшься от его руки: тебя непременно схватят и отдадут в его руки. Твои глаза увидят глаза царя Вавилона, он будет говорить с тобой лицом к лицу[a], и ты пойдёшь в Вавилон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его уста будут говорить с твоими устами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמָּלֵט מִיָּדוֹ
  choice: не спасёшься от его руки
  rationale: Глагол מלט с оборотом «из/от его руки» означает избавление от чужой власти. Перевод сохраняет образ руки как власти и остаётся понятным по-русски.
- source_word: כִּי תָּפֹשׂ תִּתָּפֵשׂ
  choice: тебя непременно схватят
  rationale: Сочетание абсолютного инфинитива с личной формой того же корня усиливает утверждение и подчёркивает неизбежность пленения; «непременно» передаёт эту эмфазу.
- source_word: וּבְיָדוֹ תִּנָּתֵן
  choice: и отдадут в его руки
  rationale: Пассивная форма נתן с упоминанием руки обозначает передачу под чью-либо власть. Русское устойчивое выражение «отдать в руки» естественно передаёт смысл, хотя в еврейском тексте стоит единственное число.
- source_word: וְעֵינֶיךָ אֶת־עֵינֵי מֶלֶךְ בָּבֶל תִּרְאֶינָה
  choice: Твои глаза увидят глаза царя Вавилона
  rationale: Сохранён конкретный и выразительный повтор «глаза… глаза», подчёркивающий непосредственную личную встречу Седекии с вавилонским царём.
- source_word: וּפִיהוּ אֶת־פִּיךָ יְדַבֵּר
  choice: он будет говорить с тобой лицом к лицу
  rationale: Необычный буквальный оборот «его уста будут говорить с твоими устами» означает непосредственный разговор. Основной текст передаёт этот смысл естественным современным русским выражением, а буквальный образ сохранён в сноске.
- source_word: וּבָבֶל תָּבוֹא
  choice: и ты пойдёшь в Вавилон
  rationale: בוא допускает передачу глаголами «прийти» и «пойти» в зависимости от точки зрения. В обращённом к Седекии предсказании по-русски естественно «пойдёшь в Вавилон».
