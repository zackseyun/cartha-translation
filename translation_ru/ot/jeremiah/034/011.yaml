base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/011.yaml
  text: But afterward they turned back and brought back the male servants and the female servants whom they had set free[a], and they forced them into slavery as male and female servants.
translation:
  language: ru
  text: Но затем они передумали, забрали обратно рабов и рабынь, которых отпустили на свободу, и силой вновь обратили их в рабство[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и подчинили их как рабов и рабынь».'
    reason: Сноска сохраняет более формальное соответствие глаголу כָּבַשׁ и заключительной конструкции, тогда как основной текст ясно выражает подразумеваемое контекстом насильственное повторное порабощение.
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: они отступились
  rationale: Глагол שוב здесь обозначает поворот назад после совершённого освобождения. «Отступились» естественно передаёт отказ от прежнего поступка, не сводя значение лишь к физическому возвращению.
- source_word: אַחֲרֵי כֵן
  choice: затем
  rationale: 'Кратко и естественно передаёт временную последовательность: «после этого».'
- source_word: וַיָּשִׁבוּ
  choice: вернули
  rationale: Каузативная форма שוב означает, что они заставили освобождённых вернуться или возвратили их в прежнее положение; «вернули» сохраняет эту каузативность и хорошо звучит по-русски.
- source_word: הָעֲבָדִים וְהַשְּׁפָחוֹת
  choice: рабов и рабынь
  rationale: Контекст повторного порабощения требует значения «рабы», а не более мягкого «слуги»; раздельные названия сохраняют выраженное в еврейском тексте различие по полу.
- source_word: שִׁלְּחוּ חָפְשִׁים
  choice: отпустили на свободу
  rationale: Устойчивое и понятное русское выражение для освобождения от рабской зависимости.
- source_word: וַיִּכְבְּשׁוּם לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: силой вновь обратили их в рабство
  rationale: כָּבַשׁ выражает подчинение и принуждение, а последующая конструкция указывает на итоговый статус рабов и рабынь. Формулировка передаёт насильственный характер повторного порабощения без тяжеловесного повтора.
