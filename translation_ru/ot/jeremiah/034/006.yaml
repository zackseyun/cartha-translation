  text: И пророк Иеремия сказал Седекии, царю Иудеи, все эти слова в Иерусалиме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … передал
  rationale: Последовательная форма с וַ продолжает повествование. В данном контексте דִּבֵּר обозначает сообщение ранее приведённого пророчества; «передал … слова» естественно по-русски и сохраняет связь с прямым дополнением.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: пророк Иеремия
  rationale: Сохраняется явный титул הַנָּבִיא, а русское расположение титула перед именем звучит естественно и достойно.
- source_word: אֶל צִדְקִיָּהוּ
  choice: Седекии
  rationale: При глаголе «передал» адресат естественно выражается дательным падежом. «Седекия» — устоявшаяся русская библейская форма имени.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царю Иудеи
  rationale: Конструктивная цепь передана приложением в дательном падеже; «царь» соответствует традиционному и современно понятному обозначению монарха, а «Иудея» — устоявшаяся русская форма топонима.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: דְּבָרִים здесь относится к только что приведённому пророческому сообщению, поэтому «слова» точнее, чем более широкие «дела» или «вещи»; כָּל и הָאֵלֶּה сохранены.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Локатив передан прямо и оставлен в конце предложения, как в еврейском тексте.
