reference: Jeremiah 34:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/תָּשֻׁ֨בוּ֙ וַ/תְּחַלְּל֣וּ אֶת שְׁמִ֔/י וַ/תָּשִׁ֗בוּ אִ֤ישׁ אֶת עַבְדּ/וֹ֙ וְ/אִ֣ישׁ אֶת שִׁפְחָת֔/וֹ אֲשֶׁר שִׁלַּחְתֶּ֥ם חָפְשִׁ֖ים לְ/נַפְשָׁ֑/ם וַ/תִּכְבְּשׁ֣וּ אֹתָ֔/ם לִֽ/הְי֣וֹת לָ/כֶ֔ם לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָחֽוֹת־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/016.yaml
  text: 'But you turned back and profaned my name: each of you made his male servant and his female servant return, though you had set them free to go where they wished; then you subjugated them to be your male and female servants.'
translation:
  language: ru
  text: 'Но вы повернули вспять и осквернили Моё имя: каждый из вас заставил вернуться своего раба и свою рабыню, которых вы отпустили на свободу, предоставив им распоряжаться собой; затем вы подчинили их себе, сделав своими рабами и рабынями.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: вы отступили
  rationale: Глагол שׁוב обозначает поворот назад и здесь — отказ от только что принятого решения. «Отступили» сохраняет образ перемены направления и естественно передаёт нарушение обязательства.
- source_word: וַתְּחַלְּלוּ אֶת־שְׁמִי
  choice: осквернили Моё имя
  rationale: В породе пиэль חלל означает сделать священное несвятым, осквернить; сочетание с Божьим именем имеет устойчивый сакральный смысл.
- source_word: וַתָּשִׁיבוּ
  choice: заставил вернуться
  rationale: 'Хифиль выражает причинное действие: освобождённых не просто приняли обратно, а вынудили вернуться.'
- source_word: אִישׁ ... וְאִישׁ
  choice: каждый из вас
  rationale: Повтор אִישׁ имеет распределительное значение. Русское «каждый из вас» ясно относит обвинение ко всем владельцам и избегает тяжеловесного повтора.
- source_word: עַבְדּוֹ וְ... שִׁפְחָתוֹ
  choice: своего раба и свою рабыню
  rationale: Контекст освобождения и повторного порабощения требует прямого обозначения рабского статуса; грамматический контраст мужского и женского рода сохранён.
- source_word: שִׁלַּחְתֶּם חָפְשִׁים
  choice: вы отпустили на свободу
  rationale: Выражение означает не просто позволить уйти, а юридически освободить от рабского состояния.
- source_word: לְנַפְשָׁם
  choice: чтобы они жили по своей воле
  rationale: Буквально выражение связано с их собственной жизнью или волей; в контексте освобождения оно указывает на право самостоятельно распоряжаться собой.
- source_word: וַתִּכְבְּשׁוּ אֹתָם
  choice: вы подчинили их себе
  rationale: כבש обозначает насильственное подчинение и установление власти. «Подчинили их себе» передаёт принуждение без добавления отсутствующих в тексте подробностей.
- source_word: לִהְיוֹת לָכֶם לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: сделав своими рабами и рабынями
  rationale: Оборот выражает итоговый статус порабощённых. Деепричастная конструкция естественно связывает подчинение с его результатом.
theological_decisions:
- issue: Передача терминов рабства в контексте освобождения и насильственного возвращения
  choice: раб / рабыня
  alternative: слуга / служанка
  rationale: Речь идёт о юридическом освобождении и последующем принудительном возвращении в зависимость, поэтому более мягкие слова «слуга» и «служанка» скрыли бы центральный смысл обвинения.
- issue: Осквернение Божьего имени
  choice: осквернили Моё имя
  alternative: обесчестили Моё имя
  rationale: «Осквернили» сохраняет сакральную силу חלל и не сводит обвинение лишь к ущербу репутации.
- issue: Степень свободы освобождённых в לְנַפְשָׁם
  choice: чтобы они жили по своей воле
  alternative: для самих себя
  rationale: Выбранный вариант естественно выражает самостоятельность освобождённых, не уточняя, куда именно они могли пойти и как именно распорядиться жизнью.
translation_notes:
  register: 'Современный литературный русский язык, ясный и dignified: прямое обвинение сохранено, термины рабства не смягчены, причинное значение формы וַתָּשִׁיבוּ передано явно. Синтаксис с двоеточием и точкой с запятой воспроизводит последовательность от отступления и осквернения имени к принудительному возвращению и повторному подчинению.'
