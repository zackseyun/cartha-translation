base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/012.yaml
  text: They have denied Yahweh and said, “He is not there, and no disaster will come upon us; we will not see sword or famine.”
translation:
  language: ru
  text: 'Они отреклись от Яхве и сказали: «Его нет[a]. Не постигнет нас бедствие, и мы не увидим ни меча, ни голода».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не Он», «Он ничего не сделает» или «Его здесь нет». Еврейское выражение кратко и допускает разные понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּחֲשׁוּ בַּיהוָה
  choice: отреклись от Яхве
  rationale: Глагол כחשׁ с предлогом ב может означать отрицать, отвергать или поступать вероломно по отношению к кому-либо. Здесь дальнейшая речь отвергает действенное присутствие и суд Яхве, поэтому «отреклись» естественно передаёт сознательное отрицание, не сводя его к простой лжи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное заветное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: לֹא הוּא
  choice: Нет Его
  rationale: 'Краткое и эллиптическое еврейское выражение сохранено кратким и допускающим несколько оттенков отрицания: существования, присутствия или действия Яхве. Иные возможные понимания вынесены в примечание.'
- source_word: רָעָה
  choice: бедствие
  rationale: В контексте пророческого суда слово обозначает несчастье или катастрофу, а не нравственное зло.
- source_word: חֶרֶב
  choice: меч
  rationale: Конкретный образ насильственного суда сохранён без замены на более общее «война».
- source_word: רָעָב
  choice: голод
  rationale: В формуле суда обозначает массовый голод как бедствие.
- source_word: לֹא נִרְאֶה
  choice: не увидим мы
  rationale: Сохранена еврейская идиома «увидеть» в значении испытать или пережить; по-русски она понятна в данном контексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст употребляет тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие.
- issue: Толкование эллиптической фразы לֹא הוּא
  choice: Нет Его
  alternative: Не Он; Он ничего не сделает; Его здесь нет
  rationale: Фраза предельно кратка и может отрицать существование, присутствие или действенное вмешательство Яхве. Основной текст не уточняет то, чего не уточняет оригинал, а примечание сохраняет варианты.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «не увидим мы» поддерживает ритм и подчёркивает самоуверенность говорящих; конструкция «ни меча, ни голода» естественна и сохраняет конкретные образы оригинала.
