  text: יְהֹוָ֗ה עֵינֶי/ךָ֮ הֲ/ל֣וֹא לֶ/אֱמוּנָה֒ הִכִּ֤יתָה אֹתָ/ם֙ וְֽ/לֹא חָ֔לוּ כִּלִּיתָ֕/ם מֵאֲנ֖וּ קַ֣חַת מוּסָ֑ר חִזְּק֤וּ פְנֵי/הֶם֙ מִ/סֶּ֔לַע מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/003.yaml
  text: O Yahweh[a], are not your eyes on faithfulness? You struck them, but they did not feel pain; you consumed them, but they refused to accept discipline. They made their faces harder than rock[b]; they refused to return.
translation:
  language: ru
  text: Господи, разве Твои глаза не обращены к верности? Ты поражал их, но они не чувствовали боли[a]; Ты истреблял их, но они отказывались принимать вразумление. Они сделали свои лица твёрже скалы; они отказались вернуться[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но они не ослабели», «но они не заболели». Еврейский глагол может обозначать боль, слабость или болезнь.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть обратиться к Богу, покаяться. Буквально: «вернуться» — распространённый у пророков образ возвращения к Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Господи
  rationale: Русская звательная форма естественно передаёт прямое обращение к YHWH и сохраняет достоинство библейского стиля.
- source_word: עֵינֶיךָ הֲלוֹא לֶאֱמוּנָה
  choice: разве не верности ищут Твои глаза?
  rationale: Сохранён конкретный образ глаз; אֱמוּנָה передано как «верность», а направленность Божьего взгляда естественно выражена глаголом «ищут».
- source_word: הִכִּיתָה אֹתָם
  choice: Ты поражал их
  rationale: «Поражал» передаёт действие суда и согласуется с последующим описанием многократного упорства народа.
- source_word: וְלֹא חָלוּ
  choice: но они не чувствовали боли
  rationale: В контексте удара חלה может указывать на боль, слабость или болезнь; основной текст передаёт наиболее понятный контекстуальный смысл, а неоднозначность отмечена в сноске.
- source_word: כִּלִּיתָם
  choice: Ты истреблял их
  rationale: Piel כלה выражает доведение до конца, уничтожение или истощение; «истреблял» сохраняет силу нарастающего Божьего суда, не утверждая полного исчезновения народа.
- source_word: מֵאֲנוּ קַחַת מוּסָר
  choice: они отказывались принимать вразумление
  rationale: מוּסָר объединяет исправление, наставление и дисциплинарное наказание; «вразумление» естественно передаёт исправительную цель.
- source_word: חִזְּקוּ פְנֵיהֶם מִסֶּלַע
  choice: Они сделали свои лица твёрже скалы
  rationale: Сохранены телесный образ и сравнительная конструкция, выражающие бесстыдное и непреклонное упорство.
- source_word: מֵאֲנוּ לָשׁוּב
  choice: они отказались вернуться
  rationale: Буквальное «вернуться» сохраняет пророческий образ возвращения к Богу и не сводит его заранее к одному богословскому термину.
theological_decisions:
- issue: Пророческое употребление שׁוּב в нравственно-религиозном контексте
  choice: вернуться
  alternative: покаяться, обратиться
  rationale: Основной текст сохраняет буквальный и заветный образ возвращения; подразумеваемое покаяние разъясняется в сноске, а не подменяет образ.
- issue: Смысл אֱמוּנָה как объекта Божьего взгляда
  choice: верность
  alternative: истина, надёжность
  rationale: «Верность» соответствует нравственному контексту главы, сохраняя присущую слову идею устойчивости и надёжности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим тоном. Сохранены конкретные еврейские образы глаз, лица, скалы и возвращения; синтаксис сделан ясным для обычного читателя.
