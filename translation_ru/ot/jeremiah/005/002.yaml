lexical_decisions:
- source_word: וְאִם
  choice: И даже если
  rationale: 'Условная конструкция сохраняется; «даже» естественно передаёт уступительный оттенок в контексте: несмотря на правильную формулу клятвы, сама клятва ложна.'
- source_word: חַי יְהוָה
  choice: Жив Господь!
  rationale: Сохранена традиционная формула клятвы и передано имя יהוה принятым в русском библейском стиле словом «Господь».
- source_word: לָכֵן
  choice: всё равно
  rationale: 'В данном противопоставлении слово имеет уступительно-результативный смысл: даже произнося эту формулу, они тем не менее клянутся ложно.'
- source_word: לַשֶּׁקֶר יִשָּׁבֵעוּ
  choice: клянутся ложно
  rationale: Прямо передаёт значение ложной или неискренней клятвы, сохраняя настоящее/обычное действие исходной формы.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбрана устойчивая русская библейская передача, соответствующая предоставленному консультационному тексту; смысл формулы клятвы не меняется.
- issue: Отношение правильного исповедания к ложной клятве
  choice: 'Сохранено прямое напряжение: они призывают имя Господа, но всё равно клянутся ложно.'
  alternative: Истолковать слова как заведомо ложное утверждение о жизни Господа.
  rationale: Исходный текст осуждает ложность их клятвы, не объясняя её точный механизм; перевод не добавляет конфессионального толкования.
translation_notes:
