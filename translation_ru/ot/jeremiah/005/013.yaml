source:
  edition: WLC
  text: וְ/הַ/נְּבִיאִים֙ יִֽהְי֣וּ לְ/ר֔וּחַ וְ/הַ/דִּבֵּ֖ר אֵ֣ין בָּ/הֶ֑ם כֹּ֥ה יֵעָשֶׂ֖ה לָ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/013.yaml
  text: And the prophets will become wind[a], and the word is not in them; thus it will be done to them.
translation:
  language: ru
  text: И пророки станут ветром[a], и слова нет в них; так будет сделано с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духом» либо «дыханием». Еврейское слово רוּחַ может иметь любое из этих значений; здесь, вероятно, имеется в виду, что пророки пусты и неосновательны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּבִיאִים
  choice: И пророки
  rationale: Определённое существительное во множественном числе с союзом передано без добавочного усиления, которого нет в еврейском тексте.
- source_word: יִהְיוּ לְרוּחַ
  choice: станут ветром
  rationale: Конструкция היה с לְ выражает становление; «ветром» естественно передаёт полемический образ пустоты и неосновательности, сохраняя буквальный образ.
- source_word: וְהַדִּבֵּר
  choice: и слова
  rationale: Субстантивированная форма от דבר здесь обозначает слово или речённое послание. «Слово» сохраняет краткость и не уточняет сверх текста, о каком именно слове идёт речь.
- source_word: אֵין בָּהֶם
  choice: нет в них
  rationale: Прямо сохраняет еврейскую экзистенциальную конструкцию и её намеренную неопределённость.
- source_word: כֹּה יֵעָשֶׂה לָהֶם
  choice: так будет сделано с ними
  rationale: Сохраняет безлично-пассивную форму нифаля и не называет подразумеваемого деятеля.
theological_decisions:
- issue: Значение רוּחַ в обличении пророков
  choice: ветром
  alternative: духом; дыханием
  rationale: В сочетании с утверждением, что в пророках нет слова, «ветер» передаёт образ пустоты и неосновательности, не вводя прямой ссылки на Святого Духа. Семантическая широта еврейского слова сохранена в примечании.
- issue: Кому принадлежит реплика в стихе
  choice: Не уточнять говорящего в самом переводе
  alternative: Явно представить слова как речь народа или противников Иеремии
  rationale: В данном стихе грамматически не обозначен говорящий; добавление субъекта преждевременно устранило бы контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Синтаксический параллелизм и зловещий безличный пассив оригинала сохранены.
