base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/005.yaml
  text: I will go to the great men and speak to them[a], for they know the way of Yahweh, the justice of their God. But they too, together, have broken the yoke; they have torn off the bonds.
translation:
  language: ru
  text: Пойду к знатным и обращусь к ним, ведь они знают путь Яхве, право своего Бога[a]. Но и они все вместе сломали ярмо, разорвали узы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правосудие своего Бога», «суд своего Бога», «установление своего Бога» или «требование своего Бога». Еврейское слово может обозначать право, правосудие, судебное решение или установленное требование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֲכָה לִּי
  choice: Пойду
  rationale: Когортатив с этическим дательным выражает решительное намерение; русское «Пойду» естественно передаёт этот оттенок.
- source_word: הַגְּדֹלִים
  choice: к знатным
  rationale: В противопоставлении бедным из предыдущего контекста речь идёт о людях высокого общественного положения; «знатные» точно и естественно передаёт этот смысл без сужения до официальных руководителей.
- source_word: וַאֲדַבְּרָה אוֹתָם
  choice: и поговорю с ними
  rationale: Форма выражает намерение обратиться к ним; «поговорю с ними» естественно передаёт прямое общение.
- source_word: דֶּרֶךְ יְהוָה
  choice: путь Яхве
  rationale: Сохранена прозрачная библейская метафора пути как воли, образа действий или установленного Богом порядка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: מִשְׁפַּט אֱלֹהֵיהֶם
  choice: установление своего Бога
  rationale: מִשְׁפָּט здесь рядом с «путём Яхве» может обозначать установленную Богом норму или требование. «Установление» сохраняет юридико-нормативный смысл; другие возможные значения отмечены в сноске.
- source_word: אַךְ
  choice: Но
  rationale: Союз вводит резкий контраст между ожиданием пророка и действительным поведением знатных.
- source_word: הֵמָּה יַחְדָּו
  choice: и они все вместе
  rationale: Сочетание подчёркивает, что исключения среди них не оказалось и они действовали сообща.
- source_word: שָׁבְרוּ עֹל
  choice: сломали ярмо
  rationale: Сохранён конкретный образ насильственного отказа от подчинения или обязательства без его догматического истолкования.
- source_word: נִתְּקוּ מוֹסֵרוֹת
  choice: разорвали узы
  rationale: «Узы» естественно передают связывающие путы и сохраняют поэтический параллелизм с ярмом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Значение מִשְׁפַּט אֱלֹהֵיהֶם
  choice: установление своего Бога
  alternative: правосудие своего Бога; суд своего Бога; требование своего Бога
  rationale: Широкий диапазон слова допускает этико-юридическое и нормативное понимание. В основном тексте выбрано контекстуально уместное «установление», а неоднозначность сохранена в сноске.
- issue: Образ ярма и уз
  choice: Сохранить метафоры без поясняющей конкретизации
  alternative: Передать как прямой отказ от Божьего закона или завета
  rationale: Образы могут подразумевать моральное и заветное неповиновение, однако сам стих не сводит их к одному истолкованию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировки доступны широкому читателю; конкретные метафоры и смысловая неоднозначность מִשְׁפַּט сохранены.
