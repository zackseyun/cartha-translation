lexical_decisions:
- source_word: שִׁמְעוּ נָא זֹאת
  choice: Послушайте же это
  rationale: Множественное повелительное שִׁמְעוּ передаёт прямой пророческий призыв; частица «же» естественно выражает усиление и настойчивость נָא, не превращая её в формулу вежливости; «это» сохраняет указательное זֹאת без добавления толкования.
- source_word: עַם סָכָל
  choice: неразумный народ
  rationale: סָכָל обозначает нравственную и духовную неразумность, а не только недостаток интеллекта. «Неразумный» звучит достойно и сохраняет обличительный смысл.
- source_word: וְאֵין לֵב
  choice: лишённый понимания
  rationale: לֵב здесь обозначает внутреннюю способность понимать и различать. Идиоматический перевод передаёт смысл, тогда как буквальное «без сердца» в современном русском могло бы быть понято прежде всего как бессердечие.
- source_word: עֵינַיִם לָהֶם וְלֹא יִרְאוּ
  choice: глаза у них есть, но они не видят
  rationale: 'Сохранены контраст и самостоятельная структура еврейской фразы: наличие физического зрения противопоставлено фактической неспособности видеть.'
- source_word: אָזְנַיִם לָהֶם וְלֹא יִשְׁמָעוּ
  choice: уши у них есть, но они не слышат
  rationale: Параллелизм с предыдущей частью сохранён; «слышат» также поддерживает смысловую перекличку с начальным призывом «Послушайте».
theological_decisions:
- issue: Антропологическая идиома לֵב
  choice: лишённый понимания
  alternative: без сердца
  rationale: В данном обличении «сердце» обозначает способность к пониманию и различению. Идиоматический вариант передаёт духовно-нравственную нечуткость народа, не сводя выражение к эмоциональной бессердечности.
- issue: Коллективное единственное число עַם
  choice: неразумный народ
  alternative: неразумные люди
  rationale: «Народ» сохраняет коллективное обращение к Иудее и грамматическое единственное число исходного текста, не индивидуализируя упрёк.
- issue: Слепота и глухота как образ духовной нечуткости
  choice: сохранить прямые формулировки «не видят» и «не слышат»
  alternative: разъяснить как «не понимают» и «не повинуются»
  rationale: Исходный текст сохраняет образную напряжённость между физическими органами и отсутствием восприятия; перевод не должен подменять образ его богословским истолкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обращения. «Послушайте же» передаёт настойчивость без архаического «внемлите». Двоеточие и точка с запятой ясно оформляют еврейский параллелизм.
