  text: Hear this now[a], foolish people without understanding, who have eyes but do not see, who have ears but do not hear.
translation:
  language: ru
  text: 'Послушайте же это, неразумный народ, лишённый понимания[a]: глаза у них есть, но они не видят; уши у них есть, но они не слышат.'
