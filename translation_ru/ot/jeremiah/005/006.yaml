id: JER.5.6
reference: Jeremiah 5:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַל כֵּן֩ הִכָּ֨/ם אַרְיֵ֜ה מִ/יַּ֗עַר זְאֵ֤ב עֲרָבוֹת֙ יְשָׁדְדֵ֔/ם נָמֵ֤ר שֹׁקֵד֙ עַל עָ֣רֵי/הֶ֔ם כָּל הַ/יּוֹצֵ֥א מֵ/הֵ֖נָּה יִטָּרֵ֑ף כִּ֤י רַבּוּ֙ פִּשְׁעֵי/הֶ֔ם עָצְמ֖וּ משבותי/הם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/006.yaml
  text: Therefore a lion from the forest strikes them down[a]; a wolf of the deserts devastates them; a leopard keeps watch over their cities. Everyone who goes out from them will be torn apart, because their transgressions are many[b]; their apostasies have grown strong.
translation:
  language: ru
  text: 'Поэтому лев из леса поражает их,

    волк из пустынных степей[a] опустошает их;

    леопард подстерегает у их городов.

    Всякий, кто выйдет из них, будет растерзан,

    потому что многочисленны их преступления

    и усилились их отступления[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечерний волк». Сочетание זְאֵב עֲרָבוֹת иногда связывают с вечерним выходом хищника на охоту; здесь עֲרָבוֹת понято как пустынные равнины, степи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их отступничества» или «их отпадения». Еврейское слово обозначает неоднократный отход от верности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּם
  choice: поражает их
  rationale: Глагол נכה обозначает сильный, нередко смертельный удар. Настоящее время передаёт живую картину суда и согласует действие льва с последующим причастием, не ослабляя угрозу до общего «нападает».
- source_word: אַרְיֵה מִיַּעַר
  choice: лев из леса
  rationale: Сохраняется конкретный образ хищника и указанное в еврейском тексте место его появления.
- source_word: זְאֵב עֲרָבוֹת
  choice: волк из пустынных степей
  rationale: עֲרָבוֹת естественно понимается как засушливые равнины или степные области. Формулировка сохраняет географический образ и по-русски звучит яснее, чем буквальное «волк пустынь».
- source_word: יְשָׁדְדֵם
  choice: опустошает их
  rationale: שדד выражает насильственное разорение и опустошение; выбранный глагол подходит как к нападению хищника, так и к образу грядущего суда.
- source_word: נָמֵר
  choice: барс
  rationale: Обычное и понятное русское название крупного пятнистого хищника, традиционно употребляемое для נָמֵר.
- source_word: שֹׁקֵד עַל
  choice: подстерегает у
  rationale: Причастие от שקד передаёт неусыпную бдительность. В контексте хищника это враждебное наблюдение; «подстерегает» делает контекстуальный смысл ясным и не создаёт ложного впечатления, будто зверь охраняет города.
- source_word: עָרֵיהֶם
  choice: их городов
  rationale: עִיר может означать город или поселение; «города» естественно для картины общенародного суда.
- source_word: כָּל־הַיּוֹצֵא מֵהֵנָּה
  choice: Всякий, кто выйдет из них
  rationale: Передаётся распределительное значение כָּל с причастием и сохраняется множественное местоимение, относящееся к городам.
- source_word: יִטָּרֵף
  choice: будет растерзан
  rationale: Нифаль от טרף рисует человека добычей зверя. «Будет растерзан» кратко и выразительно сохраняет этот образ.
- source_word: פִּשְׁעֵיהֶם
  choice: их преступления
  rationale: פשע обозначает нарушение и мятеж против законной власти. «Преступления» ясно передаёт виновность, тогда как оттенок сознательного отхода поддерживается следующим параллельным словом.
- source_word: רַבּוּ
  choice: многочисленны
  rationale: Передаётся результативное состояние — преступлений стало много; именная конструкция естественна в русском поэтическом параллелизме.
- source_word: עָצְמוּ
  choice: усилились
  rationale: עצם выражает усиление или возрастание мощи. Здесь речь не только о числе, но и об укоренившемся характере отступлений.
- source_word: משבותיהם (ср. מְשׁוּבוֹתֵיהֶם)
  choice: их отступления
  rationale: Слово обозначает повторяющиеся повороты прочь от верности Богу. Множественное «отступления» сохраняет форму и образ исходного текста, не вводя более узкий конфессиональный термин.
theological_decisions:
- issue: Характер неверности в משבותיהם / מְשׁוּבוֹתֵיהֶם
  choice: их отступления
  alternative: их отступничества; их отпадения
  rationale: «Отступления» сохраняет множественность и идею неоднократного уклонения от верности завету. Более сильное «отступничества» возможно, но может восприниматься как уже систематизированный богословский термин; примечание указывает этот смысл без его навязывания основному тексту.
translation_notes:
  register: Современный литературный русский язык с краткими параллельными строками, соответствующими поэтическому строю пророческой речи. Образы хищников сохранены конкретными и угрожающими; архаизмы и узкоконфессиональная терминология по возможности исключены.
