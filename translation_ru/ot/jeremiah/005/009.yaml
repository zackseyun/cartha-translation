  yaml_path: translation/ot/jeremiah/005/009.yaml
  text: Shall I not punish for these things? declares Yahweh[a]. And on a nation such as this[b], shall I not avenge myself?
translation:
  language: ru
  text: «Неужели Я не накажу за это? — возвещает Яхве. — И такому народу неужели не отомстит душа Моя[a]?»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее начало второго вопроса можно передать: «И если такому народу — неужели не отомстит душа Моя?» Союз וְאִם буквально означает «и если», но здесь вводит второй риторический вопрос. Выражение «душа Моя» ярко обозначает Самого Яхве.'
    reason: лексическая альтернатива и пояснение еврейского образа
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: Неужели ... за это?
  rationale: Вопросительная частица с עַל образует риторический вопрос с причинным значением. Русское «неужели… за это?» естественно передаёт и укор, и связь с перечисленными ранее преступлениями.
- source_word: אֶפְקֹד
  choice: взыщу
  rationale: В данном контексте פקד означает призвать к ответу и подвергнуть наказанию. «Взыщу» сохраняет судебно-карательный смысл и торжественный пророческий регистр.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана торжественно и понятно; личное имя יהוה транслитерировано как «Яхве».
- source_word: וְאִם
  choice: И
  rationale: Здесь сочетание вводит второй усиливающий риторический вопрос, а не реальное условие. Буквальный оттенок «и если» отмечен в сноске.
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: такому народу
  rationale: Предлог ב с נקם обозначает объект возмездия. Дательный падеж при русском «отомстить» естественно передаёт эту связь; «такому» сохраняет указательно-сравнительный смысл.
- source_word: תִתְנַקֵּם נַפְשִׁי
  choice: не отомстит душа Моя
  rationale: Сохранены грамматический субъект «душа Моя» и возвратное/среднее значение глагола נקם. Такая формулировка удерживает яркое личностное самообозначение Бога, не сводя его к пояснительному «Я Сам».
theological_decisions:
- issue: Антропопатическое самообозначение Бога в נַפְשִׁי
  choice: сохранить «душа Моя» в основном тексте
  alternative: «Я Сам» или «Я не отомщу»
  rationale: Еврейский текст намеренно говорит о «Моей душе» как о Самом Яхве в живом личностном выражении. Буквальный образ сохраняет напряжение исходного текста; сноска предупреждает, что речь не обязательно идёт о составе Божьего естества.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога, стоящее в еврейском тексте, и соответствует заданному проектному решению.
- issue: Соотношение наказания и возмездия
  choice: сохранить параллель «взыщу» / «отомстит душа Моя»
  alternative: унифицировать оба выражения как «накажу»
  rationale: Разные еврейские глаголы פקד и נקם создают смысловое усиление от привлечения к ответу к личному возмездию; их не следует сглаживать.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. «Взыщу» несколько возвышенно, но понятно и уместно в судебном контексте. Инверсия «душа Моя» сохраняет библейскую выразительность без чрезмерной архаизации.
