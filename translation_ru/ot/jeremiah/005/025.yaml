  yaml_path: translation/ot/jeremiah/005/025.yaml
  text: Your iniquities have turned these away[b][a], and your sins have withheld the good from you.
translation:
  language: ru
  text: Ваши беззакония отвратили от вас это[a], и ваши грехи лишили вас добра[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эти вещи»; речь идет о том, что упомянуто выше.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺנוֹתֵיכֶם
  choice: ваши беззакония
  rationale: «Беззакония» передаёт виновное, нравственно порочное поведение и сохраняет отличие от следующего חַטֹּאותֵיכֶם — «грехи».
- source_word: הִטּוּ
  choice: отвели от вас
  rationale: Глагол נטה в данной конструкции означает отвести или уклонить в сторону. Добавление «от вас» делает подразумеваемое направление ясным по-русски и соответствует смыслу лишения народа ранее названных благ.
- source_word: אֵלֶּה
  choice: всё это
  rationale: Указательное местоимение отсылает к непосредственно предшествующему контексту, не уточняя референт внутри самого стиха. «Всё это» естественно передаёт такую анафорическую отсылку по-русски.
- source_word: וְחַטֹּאותֵיכֶם
  choice: и ваши грехи
  rationale: «Грехи» — ясный и обычный эквивалент חַטָּאת; он сохраняет лексическое различие с «беззакониями» в первой части.
- source_word: מָנְעוּ
  choice: не дали
  rationale: מנע выражает удержание или недопущение. В сочетании с «вам добра» оборот «не дали» звучит естественно и передаёт лишение, вызванное грехами.
- source_word: הַטּוֹב
  choice: добра
  rationale: Субстантивированное единственное число с артиклем может обозначать добро вообще либо совокупность благ. «Добра» сохраняет эту смысловую широту.
- source_word: מִכֶּם
  choice: вам
  rationale: Предлог מן здесь обозначает удаление или лишение; при русском обороте «не дали» тот же смысл естественно выражается дательным падежом.
theological_decisions:
- issue: Следует ли прямо назвать референт «всего этого» дождями или благословениями из предыдущего контекста
  choice: Сохранить в основном тексте указательную отсылку «всё это».
  alternative: 'Передать как «эти блага» или конкретизировать: «дожди».'
  rationale: Еврейский текст оставляет референт невыраженным и отсылает читателя к предыдущим стихам. Конкретизация в основном тексте устранила бы подлинную контекстуальную имплицитность.
translation_notes:
  register: Современный литературный русский язык с кратким, параллельным построением фразы. «Беззакония» и «грехи» сохраняют торжественный библейский регистр без архаической грамматики; формулировка не уточняет сверх текста, какие именно блага были отняты.
