  text: שָׁמְנ֣וּ עָשְׁת֗וּ גַּ֚ם עָֽבְר֣וּ דִבְרֵי רָ֔ע דִּ֣ין לֹא דָ֔נוּ דִּ֥ין יָת֖וֹם וְ/יַצְלִ֑יחוּ וּ/מִשְׁפַּ֥ט אֶבְיוֹנִ֖ים לֹ֥א שָׁפָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/028.yaml
  text: They have grown fat[a]; they are sleek. They also have gone beyond evil words. They do not judge with justice the case of the fatherless, so that they might prosper[c][b], and they do not uphold the justice of the poor.
translation:
  language: ru
  text: Они разжирели, лоснятся; даже перешли всякую меру в злых делах[a]. Они не разбирают дела — дела сирот[b], а сами преуспевают[c]; прав бедняков они не защищают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перешли слова (или дела, обстоятельства) зла»; возможный перевод: «превзошли всякое зло».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может точнее обозначать ребёнка, оставшегося без отца.
    reason: lexical_alternative
  - marker: c
    text: 'Смысл этой краткой фразы не вполне ясен. Возможны также переводы: «и всё же они преуспевают», «хотя они преуспевают» или «чтобы они преуспевали».'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְנוּ
  choice: разжирели
  rationale: Глагол обозначает полноту как образ достатка и самодовольства. «Разжирели» сохраняет конкретный и обличительный образ еврейского текста.
- source_word: עָשְׁתוּ
  choice: лоснятся
  rationale: Редкий глагол в паре с שָׁמְנוּ описывает холёный, откормленный внешний вид. «Лоснятся» естественно передаёт этот яркий образ.
- source_word: גַּם עָבְרוּ דִבְרֵי רָע
  choice: даже перешли всякую меру в злых делах
  rationale: עבר выражает переход границы, а דבר может означать слово, дело, обстоятельство или нечто вообще. Перевод передаёт образ превышения пределов и наиболее вероятное контекстуальное значение всей фразы; буквальная неоднозначность отмечена в сноске.
- source_word: דִּין לֹא דָנוּ דִּין יָתוֹם
  choice: не разбирают по справедливости дело сироты
  rationale: Сочетание однокоренных существительного и глагола имеет судебный смысл. Формулировка сохраняет и юридическое «дело», и этическое требование справедливого суда.
- source_word: וְיַצְלִיחוּ
  choice: чтобы преуспевать
  rationale: Сжатая еврейская конструкция допускает целевое понимание, при котором речь идёт о преуспевании нечестивых. Неопределённость связи и возможного субъекта сохранена в сноске.
- source_word: וּמִשְׁפַּט אֶבְיוֹנִים לֹא שָׁפָטוּ
  choice: не защищают права бедняков
  rationale: מִשְׁפָּט здесь может обозначать судебное дело, справедливость или законное право. «Не защищают права» естественно выражает отказ обеспечить бедным справедливый суд.
theological_decisions:
- issue: Значение יָתוֹם
  choice: сирота
  alternative: оставшийся без отца
  rationale: В библейском правовом контексте слово обозначает уязвимого ребёнка, лишённого отца. Современное русское «сирота» звучит естественно, а более буквальная конкретизация дана в сноске.
- issue: Связь и субъект וְיַצְלִיחוּ
  choice: 'целевая связь с поступком нечестивых: «чтобы преуспевать»'
  alternative: «и всё же они преуспевают»; либо «чтобы дело сироты имело успех»
  rationale: Синтаксис краток и допускает несколько толкований. Основной текст следует целевому прочтению консультационного слоя, а сноска сохраняет реальные альтернативы, не устраняя нравственного напряжения текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой обличительной речи. Конкретные образы «разжирели, лоснятся» сохранены; юридическая лексика передана понятно для обычного читателя. Архаизмы и конфессионально окрашенные формулы исключены.
