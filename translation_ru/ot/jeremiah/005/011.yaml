  yaml_path: translation/ot/jeremiah/005/011.yaml
  text: For the house of Israel and the house of Judah have dealt very treacherously with me[a], declares Yahweh.
translation:
  language: ru
  text: Ибо дом Израиля и дом Иуды вероломно предали Меня[a], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершенно Мне изменили»; или: «поступили со Мной крайне вероломно». В еврейском тексте абсолютный инфинитив употреблён вместе с личной формой того же глагола для усиления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего обвинения или суда; «ибо» естественно передаёт пояснительно-причинную связь и сохраняет торжественный пророческий регистр.
- source_word: בָגֹוד בָּגְדוּ
  choice: вероломно предали
  rationale: Глагол בגד обозначает вероломство, измену или нарушение верности, а абсолютный инфинитив при личной форме усиливает его. Наречие «вероломно» передаёт как характер поступка, так и эмфазу конструкции.
- source_word: בִּי
  choice: Меня
  rationale: При בגד предлог בְּ указывает на того, против кого или по отношению к кому совершено вероломство. Русская конструкция «предали Меня» естественно выражает личную направленность измены.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено коллективное библейское выражение «дом», обозначающее народ как единую общность.
- source_word: וּבֵית יְהוּדָה
  choice: и дом Иуды
  rationale: Сохранены параллелизм еврейского текста и различение двух общностей.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — устойчивая торжественная пророческая формула. «Возвещает» звучит естественно и весомо, не превращая формулу в существительное «изречение».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Характер нарушения верности в בָגֹוד בָּגְדוּ
  choice: вероломно предали
  alternative: совершенно изменили Мне; поступили со Мной крайне вероломно
  rationale: Выбранная формулировка сохраняет личный и заветный характер измены, но не уточняет сверх текста её конкретную форму. Примечание оставляет доступными другие оттенки многозначного בגד.
- issue: Передача тетраграмматона
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное имя יהוה; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены параллельные выражения «дом Израиля» и «дом Иуды»; эмфаза еврейской конструкции передана наречием «вероломно» и пояснена в сноске.
