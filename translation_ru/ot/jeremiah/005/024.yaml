base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/024.yaml
  text: They did not say in their heart[a], ‘Let us now fear Yahweh our God, who gives rain in its season, both the early rain and the latter rain, who keeps for us the appointed weeks of the harvest.’
translation:
  language: ru
  text: 'И они не сказали в сердце своём: «Будем же бояться Яхве, нашего Бога, Который даёт дождь в своё время — ранний дождь и поздний дождь — и хранит для нас назначенные недели жатвы».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא אָמְרוּ
  choice: Но они не сказали
  rationale: Союз וְ в контексте продолжает обличение и по-русски естественно передаётся противительным «но».
- source_word: בִלְבָבָם
  choice: в своём сердце
  rationale: Сохранён еврейский собирательно-распределительный оборот с единственным числом «сердце», относящийся к множественному субъекту.
- source_word: נִירָא נָא
  choice: Убоимся же
  rationale: Когортатив выражает призыв, а частица נָא придаёт ему настойчивость; «же» естественно передаёт этот оттенок без значения вежливой просьбы.
- source_word: אֶת יְהוָה אֱלֹהֵינוּ
  choice: Яхве, нашего Бога
  rationale: Тетраграмматон передан личным именем «Яхве»; приложение сохраняет заветную формулу исходного текста.
- source_word: הַנֹּתֵן גֶּשֶׁם
  choice: Который даёт дождь
  rationale: Причастие передано естественным русским определительным придаточным и сохраняет значение постоянного действия.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: и ранний, и поздний
  rationale: Сохранена парная относительная характеристика двух сезонных дождей; существительное «дождь» ясно восстанавливается из контекста.
- source_word: בְּעִתּוֹ
  choice: в своё время
  rationale: Форма единственного числа естественно относится к дождю как совокупному Божьему дару и сохраняет исходный порядок.
- source_word: שְׁבֻעוֹת חֻקּוֹת קָצִיר
  choice: назначенные недели жатвы
  rationale: חֻקּוֹת обозначает установленные, определённые сроки; формулировка передаёт устойчивый порядок земледельческого цикла.
- source_word: יִשְׁמָר לָנוּ
  choice: сохраняет для нас
  rationale: Глагол שמר здесь означает оберегать и обеспечивать сохранность установленных недель жатвы; настоящее время согласовано с описанием постоянного действия Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Значение богобоязненности в נִירָא
  choice: убоимся
  alternative: будем чтить; будем благоговеть перед
  rationale: «Убоимся» сохраняет прямое значение корня ירא и присущее фразе богословское напряжение между страхом, почтением и благоговением, не сводя его лишь к одному оттенку.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Убоимся же» сохраняет достоинство и призывный характер речи; синтаксис остаётся ясным для широкого читателя.
