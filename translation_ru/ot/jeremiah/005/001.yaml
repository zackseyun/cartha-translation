  text: שׁוֹטְט֞וּ בְּ/חוּצ֣וֹת יְרוּשָׁלִַ֗ם וּ/רְאוּ נָ֤א וּ/דְעוּ֙ וּ/בַקְשׁ֣וּ בִ/רְחוֹבוֹתֶ֔י/הָ אִם תִּמְצְא֣וּ אִ֔ישׁ אִם יֵ֛שׁ עֹשֶׂ֥ה מִשְׁפָּ֖ט מְבַקֵּ֣שׁ אֱמוּנָ֑ה וְ/אֶסְלַ֖ח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/001.yaml
  text: Roam through the streets of Jerusalem[a], and please look and know, and search in her squares, whether you can find a man, whether there is one who does justice, who seeks faithfulness[b], and I will forgive her.
translation:
  language: ru
  text: 'Обойдите улицы Иерусалима, посмотрите внимательно и разузнайте, поищите на его площадях: найдёте ли вы хоть одного человека[a], который поступает справедливо и стремится к верности[b]? Тогда Я прощу Иерусалим.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужчину»; здесь речь о том, найдётся ли хотя бы один такой человек.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к истине» либо «к правдивости». Еврейское אֱמוּנָה может означать верность, надёжность или истинность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹטְטוּ בְּחוּצוֹת יְרוּשָׁלִַם
  choice: Обойдите улицы Иерусалима
  rationale: Императив שׁוֹטְטוּ выражает движение по всему городу в поисках; «обойдите» естественно передаёт целенаправленное хождение по его улицам.
- source_word: וּרְאוּ נָא וּדְעוּ
  choice: посмотрите внимательно и разузнайте
  rationale: Частица נָא придаёт настойчивость просьбе, а сочетание ראה и ידע требует не просто увидеть, но установить действительное положение вещей.
- source_word: וּבַקְשׁוּ בִרְחוֹבוֹתֶיהָ
  choice: поищите на его площадях
  rationale: רְחֹבוֹת — широкие общественные места, площади. Местоимение относится к Иерусалиму; в современном русском название города грамматически мужского рода.
- source_word: אִם תִּמְצְאוּ אִישׁ אִם יֵשׁ
  choice: найдёте ли вы хоть одного человека
  rationale: Двойная условно-вопросительная конструкция подчёркивает поиск хотя бы одного человека; «хоть одного» сохраняет её риторическую силу.
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: который поступает справедливо
  rationale: Выражение означает осуществлять справедливость в своём поведении; русский глагольный оборот звучит естественно и не сужает смысл до судебной деятельности.
- source_word: מְבַקֵּשׁ אֱמוּנָה
  choice: стремится к верности
  rationale: אֱמוּנָה охватывает верность, надёжность и правдивость. «Верность» сохраняет этическое и relationalное измерение, а возможное значение «истина/правда» отмечено в сноске.
- source_word: וְאֶסְלַח לָהּ
  choice: Тогда Я прощу его
  rationale: Союз выражает следствие поставленного условия. Суффикс женского рода относится к олицетворённому Иерусалиму; по нормам русского согласования это передано мужским местоимением.
theological_decisions:
- issue: Единственное число אִישׁ
  choice: хоть одного человека
  alternative: мужчину; кого-нибудь
  rationale: Существительное אִישׁ имеет форму мужского рода, однако в данном контексте обозначает отдельного представителя жителей города. «Человек» сохраняет единственное число и не превращает условие в утверждение исключительно о взрослых мужчинах.
- issue: Значение אֱמוּנָה
  choice: верность
  alternative: истина; правдивость; надёжность
  rationale: Контекст допускает как устойчивую верность, так и правдивость. Основной текст сохраняет нравственно-реляционную широту слова, а подлинная лексическая неоднозначность отражена в сноске.
- issue: Прощение олицетворённого Иерусалима
  choice: Я прощу его
  alternative: Я прощу её
  rationale: В еврейском город олицетворён в женском роде, тогда как в литературном русском «Иерусалим» требует мужского согласования. Референт и условный характер обещания сохранены.
translation_notes:
  register: Современный литературный русский, с достоинством и без архаизмов. Последовательность повелений передана энергично, но естественно; риторический поиск хотя бы одного праведного человека и условное обещание прощения сохранены.
