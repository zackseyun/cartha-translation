    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁפָּתוֹ
  choice: колчан у них
  rationale: אַשְׁפָּה означает колчан. Суффикс формально имеет форму 3-го лица мужского рода единственного числа («его»), но относится к упомянутому в контексте народу как к собирательному целому; оборот «колчан у них» естественно передаёт это согласование по смыслу, не скрывая коллективного референта.
- source_word: כְּקֶבֶר פָּתוּחַ
  choice: как открытая могила
  rationale: כְ выражает сравнение, קֶבֶר означает могилу или гробницу, а פָּתוּחַ описывает её как открытую. «Открытая могила» — прямой, яркий и естественный русский образ.
- source_word: כֻּלָּם
  choice: все они
  rationale: Форма подчёркивает полноту группы; «все они» ясно и естественно сохраняет это значение.
- source_word: גִּבּוֹרִים
  choice: могучие воины
  rationale: Слово обозначает сильных, доблестных мужей и в данном военном контексте — воинов. Сочетание «могучие воины» сохраняет как значение силы, так и военную отнесённость, избегая возможного современного оттенка прославления у слова «герои».
theological_decisions:
- issue: Смысл и род формы גִּבּוֹרִים
  choice: могучие воины
  alternative: сильные мужи; богатыри; герои
  rationale: Контекст говорит о вооружённых мужчинах вторгшегося народа. «Могучие воины» передаёт мужскую военную группу и значение силы без внесения особого богословского толкования.
translation_notes:
  register: Современный литературный русский язык; краткий параллелизм и угрожающий образ оригинала сохранены. Тире передаёт именной характер еврейских предложений и делает стих естественным для русского чтения.
