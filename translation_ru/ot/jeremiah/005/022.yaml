  text: הַ/אוֹתִ֨/י לֹא תִירָ֜אוּ נְאֻם יְהֹוָ֗ה אִ֤ם מִ/פָּנַ/י֙ לֹ֣א תָחִ֔ילוּ אֲשֶׁר שַׂ֤מְתִּי חוֹל֙ גְּב֣וּל לַ/יָּ֔ם חָק עוֹלָ֖ם וְ/לֹ֣א יַעַבְרֶ֑/נְהוּ וַ/יִּֽתְגָּעֲשׁוּ֙ וְ/לֹ֣א יוּכָ֔לוּ וְ/הָמ֥וּ גַלָּ֖י/ו וְ/לֹ֥א יַעַבְרֻֽ/נְהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/022.yaml
  text: Do you not fear me? declares Yahweh[a]. Do you not tremble before me, he who set the sand as a boundary for the sea, an everlasting decree that it cannot cross? Though its waves toss, they cannot prevail; though they roar[b], they cannot cross it.
translation:
  language: ru
  text: «Неужели вы не боитесь Меня? — возвещает Яхве. — Неужели не трепещете передо Мной — Тем, Кто положил песок границей для моря, вечным установлением, которого оно не переступит? Хотя его волны бушуют, они не могут одолеть; хотя ревут, они не переступят его».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹתִי לֹא תִירָאוּ
  choice: Неужели вы не боитесь Меня?
  rationale: Риторический вопрос передан естественной русской конструкцией с «неужели»; «бояться» сохраняет сочетание страха и благоговейного почтения.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Пророческая формула передана торжественно и современно; тетраграмматон сохранён как личное имя «Яхве».
- source_word: אִם מִפָּנַי לֹא תָחִילוּ
  choice: Неужели не трепещете предо Мною
  rationale: חיל в параллели с «бояться» обозначает трепет; «предо Мною» естественно передаёт מִפָּנַי и поддерживает возвышенный регистр.
- source_word: אֲשֶׁר שַׂמְתִּי
  choice: поставившим
  rationale: Причастный оборот грамматически связывает деяние с говорящим Богом и избегает неестественного перехода к третьему лицу.
- source_word: חוֹל גְּבוּל לַיָּם
  choice: песок границей морю
  rationale: Сохраняется образ песка как назначенной морю границы без лишнего уточнения.
- source_word: חָק עוֹלָם
  choice: вечным установлением
  rationale: «Установление» передаёт חָק как незыблемо установленный порядок, а «вечное» — его непреходящую силу.
- source_word: וְלֹא יַעַבְרֶנְהוּ
  choice: которого оно не переступит
  rationale: Повтор глагола עבר передан одинаковым «переступить»; местоимение допускает связь с установленной границей/установлением, как и образ исходного текста.
- source_word: וַיִּתְגָּעֲשׁוּ וְלֹא יוּכָלוּ
  choice: Пусть бушуют его волны — они бессильны
  rationale: געש передаёт бурное волнение, а абсолютное יכל — неспособность волн преодолеть положенный предел.
- source_word: וְהָמוּ גַלָּיו
  choice: пусть ревут
  rationale: המה обозначает шум и рёв; повтор подлежащего опущен по нормам русского параллелизма.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет его отличие от титула «Господь».
- issue: Отнесение אֲשֶׁר שַׂמְתִּי к говорящему
  choice: поставившим
  alternative: Я поставил
  rationale: Форма первого лица в еврейском ясно указывает на самого говорящего; русское причастие сохраняет синтаксическую связь с «предо Мною», не переходя к третьему лицу.
- issue: Сила морских волн
  choice: они бессильны
  alternative: они не смогут одолеть
  rationale: В оригинале יכל употреблено без выраженного дополнения; перевод сохраняет эту недосказанность, а контекст показывает, что речь о невозможности преодолеть границу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Архаизирующее «предо Мною» оставлено ради торжественного ритма; в остальном использована общеупотребительная лексика. Синтаксическая неоднозначность относительного оборота разрешена в пользу грамматически явного первого лица еврейского текста.
