source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת יַ֚עַן דַּבֶּרְ/כֶ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה הִנְ/נִ֣י נֹתֵן֩ דְּבָרַ֨/י בְּ/פִ֜י/ךָ לְ/אֵ֗שׁ וְ/הָ/עָ֥ם הַ/זֶּ֛ה עֵצִ֖ים וַ/אֲכָלָֽתַ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/014.yaml
  text: 'Therefore thus says Yahweh[a], the God of hosts: Because you speak this word, behold, I am making my words in your mouth fire, and this people wood[c][b], and it will consume them.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве, Бог воинств: «За то, что вы говорите это слово[a], вот, Я сделаю так, что Мои слова в твоих устах станут огнём[b], а этот народ — дровами[c]; огонь пожрёт их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «За то, что вы сказали это слово». Еврейское причастие допускает значение настоящего времени или недавнего прошлого.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально глагол означает «даю»; смысл конструкции: «делаю Мои слова в твоих устах огнём».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «этот народ — древесиной» или «топливом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и связь провозглашаемого суда с предшествующим контекстом.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная для русского языка формула пророческого вестника с настоящим временем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бог Воинств
  rationale: Сохраняет ёмкий образ воинств, не уточняя без достаточных оснований, земные они или небесные.
- source_word: דַּבֶּרְכֶם אֶת־הַדָּבָר הַזֶּה
  choice: вы говорите это слово
  rationale: Сохраняет множественное число адресатов, возможную настоящую силу причастия и лексическую связь со «словами» Бога далее в стихе.
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Сохраняет торжественную непосредственность формулы объявления.
- source_word: נֹתֵן ... לְאֵשׁ
  choice: превращаю ... в огонь
  rationale: Естественно передаёт предикативную конструкцию и функцию Божьих слов как огня, хотя буквально глагол означает «даю».
- source_word: דְּבָרַי בְּפִיךָ
  choice: Мои слова в твоих устах
  rationale: Сохраняет множественное число «слов», конкретный образ уст и единственное число обращения к Иеремии.
- source_word: הָעָם הַזֶּה עֵצִים
  choice: этот народ — в дрова
  rationale: «Дрова» естественно выражает древесину как горючий материал в развёрнутом образе огня.
- source_word: וַאֲכָלָתַם
  choice: и огонь пожрёт их
  rationale: Повтор существительного устраняет неясность рода в русском языке и сохраняет сильный образ уничтожающего огня; суффикс «их» относится к народу как совокупности людей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: Смена числа адресата
  choice: «вы говорите» — множественное число; «в твоих устах» — единственное число
  alternative: Сгладить оба выражения до одного числа
  rationale: Еврейский текст явно переходит от множественного суффикса к единственному; вероятнее всего, сначала имеются в виду говорящие среди народа, а затем лично пророк Иеремия. Смена сохранена без догматического уточнения в самом тексте.
- issue: Образ суда огнём
  choice: Слова Бога в устах пророка становятся огнём, а народ — дровами
  alternative: Истолковать огонь как конкретное историческое бедствие непосредственно в переводе
  rationale: Метафора сохранена без преждевременного сведения к одному историческому или богословскому толкованию.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Сохранены повтор корня «слово», конкретный образ уст, личное имя Яхве и заметная в еврейском смена множественного обращения на единственное. «Пожрёт» выбрано как сильный, но понятный глагол для образа уничтожающего огня.
