source:
  edition: WLC
  text: כִּ/כְלוּב֙ מָ֣לֵא ע֔וֹף כֵּ֥ן בָּתֵּי/הֶ֖ם מְלֵאִ֣ים מִרְמָ֑ה עַל כֵּ֥ן גָּדְל֖וּ וַֽ/יַּעֲשִֽׁירוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/027.yaml
  text: Like a cage full of birds[a], so their houses are full of deceit[b]; therefore they have become great and grown rich.
translation:
  language: ru
  text: Как клетка, полная птиц[a], так и их дома полны обмана[b]; поэтому они возвысились и разбогатели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «корзина» или «садок»; еврейское слово обозначает вместилище, в котором держат птиц.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «коварство» или «мошенничество» и охватывает разные виды нечестного и корыстного поведения.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלוּב
  choice: клетка
  rationale: Слово обозначает вместилище для птиц; «клетка» естественно передаёт образ пойманных и собранных птиц, хотя возможны и более общие значения.
- source_word: מָלֵא עוֹף
  choice: полная птиц
  rationale: עוֹף — широкое обозначение птиц или летающих существ; «птиц» ясно и естественно в данном образе.
- source_word: כֵּן
  choice: так и
  rationale: Сочетание «как… так и…» ясно передаёт сравнительную конструкцию еврейского текста.
- source_word: בָּתֵּיהֶם
  choice: их дома
  rationale: Сохранён конкретный образ домов и хозяйств, наполненных добытым нечестным путём.
- source_word: מְלֵאִים מִרְמָה
  choice: полны обмана
  rationale: מִרְמָה охватывает обман, коварство и мошенничество; «обман» сохраняет широкое нравственное значение и не ограничивает речь финансовым преступлением.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: 'Передаёт выраженное в тексте следствие: возвышение и богатство стали результатом описанного обмана.'
- source_word: גָּדְלוּ
  choice: возвысились
  rationale: Глагол буквально говорит о том, что они «стали велики»; в контексте «возвысились» естественно передаёт рост общественного положения, не сводя его только к политической власти.
- source_word: וַיַּעֲשִׁירוּ
  choice: и разбогатели
  rationale: Точно и естественно передаёт значение «стали богатыми», не усиливая форму до «обогатили себя».
