  source_fidelity: В целом перевод точно передаёт обвинение против пророков, священников и народа, а также заключительный риторический вопрос. Однако «по их указанию» чрезмерно конкретизирует трудное עַל־יְדֵיהֶם как руководство со стороны пророков; буквальный образ «их руками» и смысловая связь остаются спорными. Основной текст лучше сделать менее определённым и сохранить варианты в сноске.
  naturalness: '«Пророки пророчествуют ложно» и «священники властвуют» естественны для современного литературного русского, хотя «лживо пророчествуют» несколько компактнее. «Мой» в середине фразы следует писать со строчной буквы: это обычная современная русская орфография для притяжательного местоимения, относимого к Богу. «Чтобы так и было» естественно передаёт одобрение народом описанного порядка.'
  terminology: «Пророки», «священники» и «пророчествуют» переданы верно и в подходящем регистре. «Властвуют» допустимо для רדה. Для עַל־יְדֵיהֶם предпочтительнее в основном тексте «действуют через них», поскольку это сохраняет связь с пророками, не утверждая без достаточных оснований, что священники подчинены их указаниям.
