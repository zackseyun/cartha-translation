base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/031.yaml
  text: The prophets prophesy falsely[a], and the priests rule by their authority, and my people love it so[b]. But what will you do when its end comes?
translation:
  language: ru
  text: Пророки пророчествуют лживо, священники властвуют через них[a], и мой народ любит, чтобы так и было. Но что вы будете делать, когда всему этому придёт конец[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их руками». Еврейское выражение трудно; возможны также переводы: «по их указанию», «с их помощью» или «под их властью».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «при её конце». Суффикс женского рода может относиться к описанному положению, земле или городу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְּאוּ בַשֶּׁקֶר
  choice: пророчествуют ложно
  rationale: Сочетание глагола «пророчествовать» с בַשֶּׁקֶר означает пророчествовать во лжи или ложно. Настоящее время естественно передаёт продолжающееся положение дел, описанное еврейскими перфектами.
- source_word: יִרְדּוּ
  choice: властвуют
  rationale: Глагол רדה обозначает господство или осуществление власти. «Властвуют» сохраняет обвинительный оттенок и уместно в отношении священников.
- source_word: עַל יְדֵיהֶם
  choice: по их указанию
  rationale: Буквально выражение связано с «их рукой» и допускает разные понимания зависимости или посредничества. В контексте наиболее вероятна власть священников, осуществляемая под руководством пророков; неоднозначность отмечена в сноске.
- source_word: כֵן
  choice: чтобы так и было
  rationale: Передаёт одобрение народом именно такого положения дел и звучит естественно по-русски.
- source_word: לְאַחֲרִיתָהּ
  choice: когда всему этому придёт конец
  rationale: אַחֲרִית может обозначать конец или исход. Формулировка сохраняет предупреждение о завершении описанного порядка, не навязывая конкретный женский антецедент; грамматическая неоднозначность вынесена в сноску.
- source_word: וּמַה תַּעֲשׂוּ
  choice: Но что вы будете делать
  rationale: Союз вводит резкий риторический поворот от описания порочного порядка к предупреждению о его исходе.
theological_decisions:
- issue: К кому или чему относится местоименный суффикс женского рода в לְאַחֲרִיתָהּ
  choice: 'Передать как конец всего описанного положения дел: «когда всему этому придёт конец»'
  alternative: «при её конце», где «её» может относиться к земле или городу
  rationale: В еврейском тексте явный антецедент не назван. Нейтральная русская формулировка сохраняет риторическое предупреждение, а возможные конкретные референты указаны в сноске.
- issue: Характер связи между пророками и священниками в עַל יְדֵיהֶם
  choice: Священники властвуют «по их указанию»
  alternative: Священники властвуют «с их помощью» или «их руками»
  rationale: Трудное выражение указывает на зависимость власти священников от пророков, но точный вид этой зависимости неясен; поэтому альтернативы сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Настоящее время подчёркивает устойчивый, продолжающийся характер обвинения; вопрос в конце сохраняет резкий переход к предупреждению.
