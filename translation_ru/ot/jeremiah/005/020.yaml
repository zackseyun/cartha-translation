  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Объявите
  rationale: Форма повелительного наклонения множественного числа от נגד требует открытого, публичного сообщения; «объявите» передаёт это лучше, чем более разговорное «скажите».
- source_word: זֹאת
  choice: это
  rationale: Указательное местоимение женского рода относится к следующему далее сообщению; по-русски естественно передаётся нейтральным «это».
- source_word: בְּבֵית יַעֲקֹב
  choice: дому Иакова
  rationale: «Дом Иакова» — собирательное обозначение потомков Иакова, то есть народа Израиля. В данном контексте ב допускает адресатное понимание, а русский дательный падеж естественно выражает адресата объявления.
- source_word: וְהַשְׁמִיעוּהָ
  choice: и возвестите
  rationale: Побудительная порода глагола שמע буквально означает «сделайте так, чтобы это услышали». «Возвестите» сохраняет публичный и торжественный характер повеления; отдельное местоимение объекта в русском не требуется, поскольку объект уже выражен словом «это».
- source_word: בִיהוּדָה
  choice: в Иудее
  rationale: Предлог ב имеет обычное местное значение; «в Иудее» ясно обозначает пространство распространения вести.
- source_word: לֵאמֹר
  choice: 'говоря:'
  rationale: Стандартная формула, вводящая содержание речи в следующем стихе; двоеточие показывает её вводную функцию.
