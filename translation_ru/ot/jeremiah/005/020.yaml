  source_fidelity: Во втором повелении еврейский глагол וְהַשְׁמִיעוּהָ содержит суффикс прямого дополнения («сделайте так, чтобы это было услышано»). В черновике содержание второго объявления подразумевается, но не выражено. Кроме того, בְּבֵית יַעֲקֹב в данном параллелизме лучше передать как сферу/среду провозглашения, а не дательным адресата.
