- source_word: אִישׁ
  choice: каждый
  rationale: Слово употреблено дистрибутивно и указывает на каждого мужчину по отдельности.
- source_word: אֶל אֵשֶׁת רֵעֵהוּ
  choice: по жене своего ближнего
  rationale: С глаголом «ржать» предлог выражает направленное вожделение; «ближнего» сохраняет обычное значение רֵעַ без излишнего сужения до непосредственного соседа.
- source_word: יִצְהָלוּ
  choice: ржал
