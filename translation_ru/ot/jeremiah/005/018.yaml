  text: וְ/גַ֛ם בַּ/יָּמִ֥ים הָ/הֵ֖מָּה נְאֻם יְהֹוָ֑ה לֹֽא אֶעֱשֶׂ֥ה אִתְּ/כֶ֖ם כָּלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/018.yaml
  text: Yet even in those days[a], declares Yahweh, I will not make a full end of you.
translation:
  language: ru
  text: Но и в те дни, — возвещает Яхве, — Я не истреблю вас до конца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «не сделаю с вами полного конца»; то есть не уничтожу вас полностью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Но и
  rationale: 'Сочетание сохраняет связь с предыдущим контекстом и передаёт уступительно-усилительный оттенок: несмотря на объявленный суд.'
- source_word: בַּיָּמִים הָהֵמָּה
  choice: в те дни
  rationale: Естественное русское соответствие устойчивому пророческому обозначению обсуждаемого времени.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная формула пророческого речения; глагол «возвещает» звучит достойно и современно, отличая эту формулу от простого «говорит».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: לֹא אֶעֱשֶׂה אִתְּכֶם כָּלָה
  choice: Я не истреблю вас до конца
  rationale: 'Русская идиома естественно передаёт смысл выражения буквально «не сделаю с вами полного конца»: грядущий суд не приведёт к полному уничтожению народа.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет в русском тексте личное имя Бога, не заменяя его титулом.
- issue: Степень обещанного суда
  choice: Я не истреблю вас до конца
  alternative: Я не положу вам полного конца
  rationale: 'Выбранная формулировка ясно и естественно сохраняет напряжение текста: суд будет тяжёлым, но не станет полным уничтожением.'
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Порядок вставной формулы сохраняет ритм исходного высказывания; архаичные обороты не используются.
