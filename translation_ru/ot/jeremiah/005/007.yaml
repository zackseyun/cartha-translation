base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/007.yaml
  text: How can I forgive you for this? Your children have forsaken me and have sworn by those that are not gods[a]. When I had fed them to the full[b], they committed adultery and crowded into a prostitute’s house.
translation:
  language: ru
  text: Как Мне простить тебя за это? Твои дети оставили Меня и клялись теми, кто не боги. Я насытил их[a], а они прелюбодействовали и толпами собирались в доме блудницы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я заставил их поклясться». Еврейскую форму можно связать либо с глаголом «насыщать», либо с глаголом «клясться»; в данном контексте вероятнее первое.'
    reason: лексическая неоднозначность
  - marker: b
    text: 'Или: «собирались толпами у дома блудницы».'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: אֵי לָזֹאת אסלוח לָךְ
  choice: Как Мне простить тебя за это?
  rationale: Риторический вопрос выражает недоумение и почти невозможность прощения при названных обстоятельствах; обращение во 2-м лице единственного числа женского рода сохранено.
- source_word: בָּנַיִךְ עֲזָבוּנִי
  choice: Твои дети оставили Меня
  rationale: בנים здесь обозначает принадлежащий адресату народ; «дети» сохраняет образ и не ограничивает речь мужчинами. «Оставили» естественно передаёт заветную неверность без архаизации.
- source_word: וַיִּשָּׁבְעוּ בְּלֹא אֱלֹהִים
  choice: и клялись теми, кто не боги
  rationale: Формулировка сохраняет полемическое отрицание божественности объектов клятвы, не подменяя его пояснением «идолами».
- source_word: וָאַשְׂבִּיעַ אוֹתָם
  choice: Я насытил их
  rationale: Форма естественно понимается как каузатив от שבע — «насыщать». Краткая формулировка передаёт Божье изобильное обеспечение; морфологически возможное понимание, связанное с клятвой, отмечено в сноске.
- source_word: וַיִּנְאָפוּ
  choice: а они прелюбодействовали
  rationale: Прямой эквивалент сохраняет намеренную возможность как буквального, так и заветно-метафорического прочтения.
- source_word: וּבֵית זוֹנָה יִתְגֹּדָדוּ
  choice: и толпами сходились в дом блудницы
  rationale: Редкий глагол передаёт сбор толпой или группами. «Дом блудницы» сохраняет форму единственного числа и звучит естественно в достойном библейском регистре.
theological_decisions:
- issue: Буквальное или метафорическое прелюбодеяние
  choice: Сохранить прямое «прелюбодействовали» без уточнения.
  alternative: Явно истолковать как идолопоклонство либо исключительно как половую распущенность.
  rationale: У Иеремии половая и заветная неверность могут намеренно накладываться друг на друга; перевод не должен устранять эту напряжённость.
- issue: Кем являются «те, кто не боги»
  choice: Сохранить отрицательную формулу исходного текста.
  alternative: Передать как «ложными богами» или «идолами».
  rationale: Исходная формула не просто оценивает эти божества как ложные, а отрицает их божественность; это различие сохранено.
- issue: Отношение Божьего насыщения к неверности народа
  choice: 'Передать последовательность с контрастом: «Я насытил их, а они…»'
  alternative: «Хотя Я насытил их…» или «Когда Я насытил их…».
  rationale: Союзная последовательность допускает контраст, который ясен из контекста, но перевод не вводит более узкую временную или уступительную связь.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют распространённой русской библейской традиции. «Блудница» выбрано вместо более разговорного «проститутка», поскольку оно естественно для библейского регистра и сохраняет связь с образом духовной неверности.
