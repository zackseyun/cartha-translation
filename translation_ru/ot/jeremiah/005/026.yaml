    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт объяснительную или причинную связь с предшествующим обличением и сохраняет торжественный, но понятный библейский регистр.
- source_word: נִמְצְאוּ בְעַמִּי
  choice: среди Моего народа нашлись
  rationale: Нифаль от מצא указывает на обнаружение или наличие нечестивцев внутри общины; русский порядок слов естественен и сохраняет смысл еврейской конструкции.
- source_word: רְשָׁעִים
  choice: нечестивцы
  rationale: Обозначает людей, виновных в нравственном зле; существительное мужского рода во множественном числе соответствует форме источника.
- source_word: יָשׁוּר כְּשַׁךְ יְקוּשִׁים
  choice: Они подстерегают, словно затаившиеся птицеловы
  rationale: Трудная еврейская фраза изображает скрытно ожидающих ловцов птиц. Перевод сохраняет сравнение и хищнический характер действия, не превращая неясную деталь позы в однозначное «присели».
- source_word: הִצִּיבוּ מַשְׁחִית
  choice: ставят губительную западню
  rationale: Глагол естественно сочетается с орудием ловли, а определение «губительную» сохраняет заложенное в מַשְׁחִית значение разрушения или гибели, не сводя слово только к нейтральной ловушке.
- source_word: אֲנָשִׁים יִלְכֹּדוּ
  choice: ловят людей
  rationale: Сохраняет образ охоты и прямо передаёт людей как жертв; настоящее время по-русски естественно выражает их обычное поведение.
theological_decisions:
- issue: Принадлежность нечестивцев к народу Бога
  choice: среди Моего народа
  alternative: в Моём народе
  rationale: 'Формулировка сохраняет напряжение текста: зло обнаруживается внутри народа, названного Богом Своим, без вывода о духовном состоянии каждого его представителя.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Ибо» и «нечестивцы» поддерживают достоинство регистра, а «подстерегают», «западню» и «ловят людей» остаются понятными современному читателю. Заглавная буква в «Моего» обозначает речь Бога согласно русской издательской традиции.
