id: JER.5.15
reference: Jeremiah 5:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הִנְ/נִ֣י מֵבִיא֩ עֲלֵי/כֶ֨ם גּ֧וֹי מִ/מֶּרְחָ֛ק בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהֹוָ֑ה גּ֣וֹי אֵיתָ֣ן ה֗וּא גּ֤וֹי מֵ/עוֹלָם֙ ה֔וּא גּ֚וֹי לֹא תֵדַ֣ע לְשֹׁנ֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע מַה יְדַבֵּֽר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/015.yaml
  text: Look[a], I am bringing against you a nation from far away, O house of Israel, declares Yahweh. It is a mighty nation; it is an ancient nation[b], a nation whose language you do not know[c], and whose speech you do not understand.
translation:
  language: ru
  text: Вот, Я навожу на вас издалека народ, дом Израиля, — возвещает Яхве. Это могучий[a] народ, древний[b] народ, языка которого ты не знаешь и речи которого не понимаешь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильный народ» или «стойкий народ».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «народ, существующий издревле».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «языка которого ты не знаешь и не слышишь, что он говорит». Здесь «слышать» означает понимать услышанное.'
    reason: literal_rendering
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» естественно вводит торжественное Божье возвещение и сохраняет указательно-презентативную силу еврейского оборота.
- source_word: מֵבִיא עֲלֵיכֶם
  choice: навожу на вас
  rationale: Причастная форма передаёт действие как уже предстоящее и неотвратимое; «на вас» естественно выражает враждебную направленность в контексте суда.
- source_word: גּוֹי
  choice: народ
  rationale: В данном контексте речь идёт об этнополитической общности; повтор слова сохранён ради риторического усиления.
- source_word: מִמֶּרְחָק
  choice: издалека
  rationale: Кратко и естественно передаёт пространственную удалённость грозящего народа.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено традиционное библейское обозначение народа Израиля и его звательная функция.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу как авторитетное Божье объявление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: גּוֹי אֵיתָן
  choice: могучий народ
  rationale: אֵיתָן может обозначать силу, крепость или устойчивость; в контексте вторжения «могучий» ясно передаёт грозную мощь, не устраняя иных оттенков, отмеченных в сноске.
- source_word: גּוֹי מֵעוֹלָם
  choice: древний народ
  rationale: מֵעוֹלָם здесь указывает на давнее существование народа, а не на вечность.
- source_word: לֹא תֵדַע לְשֹׁנוֹ
  choice: языка которого ты не знаешь
  rationale: Сохранены образ «языка» и переход от множественного «вас» к собирательному единственному «ты» при обращении к дому Израиля.
- source_word: וְלֹא תִשְׁמַע מַה יְדַבֵּר
  choice: и речи которого не понимаешь
  rationale: שׁמע в этом контексте означает не просто слышать звуки, а понимать сказанное; буквальная форма приведена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Число при обращении к Израилю
  choice: «на вас» с последующим «ты»
  alternative: Последовательное «на тебя… ты» или «на вас… вы»
  rationale: В еврейском тексте сначала стоит множественное число עֲלֵיכֶם, а затем единственное תֵדַע и תִשְׁמַע при собирательном обращении «дом Израиля». Смена числа сохранена как особенность исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Повтор слова «народ» сохранён. Формула «дом Израиля» оставлена как понятное библейское собирательное обращение; исходная смена множественного числа на единственное не сглажена.
