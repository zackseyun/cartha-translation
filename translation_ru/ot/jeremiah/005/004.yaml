id: JER.5.4
reference: Jeremiah 5:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/אֲנִ֣י אָמַ֔רְתִּי אַךְ דַּלִּ֖ים הֵ֑ם נוֹאֲל֕וּ כִּ֣י לֹ֤א יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/004.yaml
  text: But I said[a], “Surely these are only the poor; they are foolish, for they do not know the way of Yahweh, the justice of their God.”
translation:
  language: ru
  text: 'Но я сказал: «Это лишь бедняки; они неразумны, потому что не знают пути Яхве, правосудия своего Бога[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «суд», «установление» или «закон» своего Бога.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי אָמַרְתִּי
  choice: Но я сказал
  rationale: Союз с выраженным местоимением обозначает переход к размышлению пророка и допускает лёгкий противительный оттенок. Глагол אָמַרְתִּי буквально означает «сказал» и может вводить внутреннюю речь.
- source_word: אַךְ דַּלִּים הֵם
  choice: Это лишь бедняки
  rationale: אַךְ здесь имеет ограничительный оттенок, а явное הֵם придаёт высказыванию эмфазу. דַּלִּים обозначает бедных, слабых или людей низкого общественного положения; «бедняки» естественно звучит в данном контексте.
- source_word: נוֹאֲלוּ
  choice: они неразумны
  rationale: 'Форма выражает глупость или отсутствие разумения. Состояние «неразумны» хорошо связано с последующим объяснением: они не знают пути Бога.'
- source_word: דֶּרֶךְ יְהוָה
  choice: пути Яхве
  rationale: Сохранён библейский образ пути как воли, образа действий и установленного Богом порядка; личное имя יְהוָה передано как «Яхве».
- source_word: מִשְׁפַּט אֱלֹהֵיהֶם
  choice: правосудия своего Бога
  rationale: מִשְׁפָּט охватывает значения справедливого суда, правосудия, решения и установленного требования. «Правосудие» сохраняет судебно-нравственный смысл, не сводя выражение только к отдельному закону или постановлению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие.
- issue: Смысл מִשְׁפַּט применительно к Богу
  choice: правосудие
  alternative: суд; установление; закон
  rationale: Контекст допускает как нравственно-судебный смысл, так и значение Божьего требования или установления. Основной текст передаёт широкий судебно-нравственный оттенок, а примечание сохраняет альтернативы.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Синтаксис остаётся близким к еврейскому оригиналу, но звучит естественно; подлинная многозначность מִשְׁפַּט вынесена в примечание.
