base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/010.yaml
  text: Go up through her vine-rows and destroy[a], but do not make a full end. Remove her branches[b], for they are not Yahweh’s.
translation:
  language: ru
  text: Поднимайтесь по её виноградным рядам и разоряйте[a], но не истребляйте до конца. Удалите её ветви[b], потому что они не принадлежат Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Взбирайтесь на её стены и разрушайте». Соответствующее еврейское слово трудно для истолкования: некоторые понимают этот образ не как виноградник, а как городские укрепления.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Удалите её побеги (усики лозы)». Еврейское слово может продолжать образ виноградника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ
  choice: Поднимайтесь
  rationale: Повелительное множественного числа от עלה передаёт движение нападающих вверх, не добавляя отсутствующего в тексте уточнения «против неё».
- source_word: בְשָׁרוֹתֶיהָ
  choice: по её виноградным рядам
  rationale: Редкое и трудное слово допускает архитектурное понимание, однако ближайшее упоминание ветвей поддерживает образ виноградника; предлог ב здесь естественно передан как движение по рядам.
- source_word: וְשַׁחֵתוּ
  choice: и разоряйте
  rationale: Форма от שׁחת выражает сильное разрушительное действие; «разоряйте» естественно сочетается с виноградником и не предполагает полного уничтожения, которое тут же запрещено.
- source_word: וְכָלָה אַל תַּעֲשׂוּ
  choice: но не истребляйте до конца
  rationale: Идиома с כלה и עשה означает доведение уничтожения до полного конца; русский перевод сохраняет ограничение предшествующего повеления.
- source_word: הָסִירוּ
  choice: Удалите
  rationale: Каузативное повеление означает убрать или отделить; нейтральное «удалите» применимо к ветвям и не усиливает образ сверх исходного текста.
- source_word: נְטִישׁוֹתֶיהָ
  choice: её ветви
  rationale: Слово может обозначать побеги или усики лозы; «ветви» понятно современному читателю и сохраняет вероятную метафору виноградника.
- source_word: כִּי לֹא לַיהוָה הֵמָּה
  choice: потому что они не принадлежат Яхве
  rationale: Конструкция с ל выражает принадлежность или отношение; явное «не принадлежат» естественно по-русски, а множественное местоимение соотнесено с ветвями.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Соотношение повелений о разорении и сохранении остатка
  choice: «разоряйте, но не истребляйте до конца»
  alternative: «разрушайте, но не совершайте полного уничтожения»
  rationale: Перевод сохраняет напряжение между судом и прямым запретом доводить уничтожение до конца, не объясняя его доктринально.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формы множественного числа сохраняют обращение к нападающим. Основной текст следует вероятному образу виноградника, а подлинная лексическая неоднозначность отмечена в сносках.
