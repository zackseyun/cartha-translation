  source_fidelity: 'В целом перечисление объектов и смена числа у глаголов переданы точно: единственное число сохраняется в первом, третьем, четвёртом и заключительном действиях, множественное — при «сыновьях и дочерях». Однако «пожрёт/пожрут» применительно к сыновьям и дочерям в современном русском слишком прямо вызывает представление о людоедстве. Еврейское אָכַל сохраняет образ всеохватного поглощения, но в данном контексте описывает разорение захватчиком, а не утверждает каннибализм.'
