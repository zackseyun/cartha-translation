base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/017.yaml
  text: And they will consume your harvest and your bread[a]; they will consume your sons and your daughters; they will consume your flock and your herd; they will consume your vine and your fig tree; they will destroy your fortified cities, in which you trust[b], with the sword.
translation:
  language: ru
  text: Он поглотит твой урожай и твой хлеб[a]; они поглотят твоих сыновей и твоих дочерей[b]; он поглотит твой мелкий и крупный скот; он поглотит твою виноградную лозу и твою смоковницу; он разорит мечом твои укреплённые города, на которые ты полагаешься.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «съест»; тот же глагол повторяется далее во всём перечислении.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте глаголы переходят от единственного числа («он поглотит») к множественному («они поглотят»), а затем снова к единственному. Вероятно, вражеский народ представлен то как единое целое, то как множество его воинов.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַל / יֹאכְלוּ / יֹאכַל
  choice: пожрёт / пожрут
  rationale: Глагол אָכַל буквально означает «есть», а здесь описывает полное уничтожение урожая, людей, скота и насаждений. «Пожрёт» естественно сочетается со всеми перечисленными объектами и сохраняет повтор одного глагола и суровый образ суда.
- source_word: קְצִירְךָ וְלַחְמֶךָ
  choice: твой урожай и твой хлеб
  rationale: «Урожай» передаёт собранные плоды земли, а конкретное «хлеб» сохраняет образ еврейского לֶחֶם, не расширяя его до общего «пища».
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: твоих сыновей и твоих дочерей
  rationale: Сохранены оба прямо названных элемента еврейской парной формулы, а также повтор притяжательного местоимения для ритма и ясности.
- source_word: צֹאנְךָ וּבְקָרֶךָ
  choice: твой мелкий и крупный скот
  rationale: צֹאן обозначает прежде всего овец и коз как мелкий скот, а בָּקָר — крупный рогатый скот. Такой перевод точно и понятно сохраняет различие категорий.
- source_word: גַּפְנְךָ וּתְאֵנָתֶךָ
  choice: твою виноградную лозу и твою смоковницу
  rationale: Единственное число исходного текста сохранено как собирательно-представительное; «виноградная лоза» ясно передаёт גֶּפֶן, а «смоковница» соответствует dignified biblical register without being obsolete.
- source_word: יְרֹשֵׁשׁ
  choice: разорит
  rationale: Редкий глагол выражает доведение до разорения или опустошения. «Разорит» передаёт результат военного нападения, не сводя значение только к физическому разрушению стен.
- source_word: עָרֵי מִבְצָרֶיךָ
  choice: твои укреплённые города
  rationale: Прямое и естественное обозначение городов, защищённых укреплениями.
- source_word: אֲשֶׁר אַתָּה בּוֹטֵחַ בָּהֵנָּה
  choice: на которые ты надеешься
  rationale: בָּטַח с предлогом ב выражает опору и уверенность в чём-либо. Русское «надеешься на» естественно передаёт ложное упование на укрепления.
- source_word: בֶּחָרֶב
  choice: мечом
  rationale: Творительный падеж естественно передаёт средство разрушения и сохраняет конкретный военный образ.
theological_decisions:
- issue: Чередование единственного и множественного числа у глаголов, описывающих захватчика
  choice: «Он пожрёт… они пожрут… он пожрёт… разорит»
  alternative: 'Выровнять всё перечисление по множественному числу: «они пожрут… они разорят»'
  rationale: 'Еврейский текст действительно переходит от единственного числа к множественному и вновь к единственному. Перевод сохраняет это напряжение: вражеский народ представлен и как единое целое, и как множество его сил, не определяя referent точнее, чем позволяет текст.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом пророческого суда. Обращение к Иудее передано формами единственного числа, как в еврейском тексте. Повтор «пожрёт» намеренно сохранён для передачи анафорической силы оригинала.
