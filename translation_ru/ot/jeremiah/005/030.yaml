  yaml_path: translation/ot/jeremiah/005/030.yaml
  text: An appalling and horrible thing has happened in the land:[a]
translation:
  language: ru
  text: Ужасное и чудовищное произошло в стране:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нечто ужасное и потрясающее случилось в стране».'
    reason: Лексические варианты для שַׁמָּה и שַׁעֲרוּרָה; «случилось» — естественная событийная передача נִהְיְתָה.
lexical_decisions:
- source_word: שַׁמָּה
  choice: ужасное
  rationale: Существительное обозначает нечто, вызывающее ужас и потрясение. В паре со следующим словом естественно передаётся субстантивированным прилагательным, без более узкого значения «опустошение».
- source_word: וְשַׁעֲרוּרָה
  choice: и чудовищное
  rationale: Слово описывает нечто чудовищное, возмутительное и потрясающее. «Чудовищное» сохраняет усиление в паре с «ужасное» и звучит естественно в современном литературном русском.
- source_word: נִהְיְתָה
  choice: творится
  rationale: Форма от היה сообщает о возникшем и происходящем положении дел. Настоящее «творится» по-русски естественно передаёт констатацию вопиющего явления, хотя буквально возможно «произошло».
- source_word: בָּאָרֶץ
  choice: в этой земле
  rationale: Определённая форма указывает на известную из контекста землю, то есть землю Иудеи. «В этой земле» ясно передаёт контекстуальную определённость, не расширяя значение до всей земли как мира.
