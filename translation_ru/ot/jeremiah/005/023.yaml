  language: ru
  text: Но у этого народа строптивое и непокорное сердце; они уклонились и ушли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵב סוֹרֵר וּמוֹרֶה
  choice: строптивое и непокорное сердце
  rationale: 'Сохранена парная характеристика сердца: סוֹרֵר передаёт упорное своеволие и строптивость, а מוֹרֶה — непокорность и сопротивление.'
- source_word: סָרוּ וַיֵּלֵכוּ
  choice: они уклонились и ушли
  rationale: 'Сохранены два последовательных глагола: сначала уклонение с должного пути, затем уход.'
- source_word: הָיָה לֵב
  choice: у этого народа … сердце
  rationale: Еврейская конструкция обладания с היה и ל естественно передана по-русски конструкцией «у … сердце»; форма прошедшего времени здесь не требует искусственного «было» или «имелось».
theological_decisions:
- issue: Характер отступления народа
  choice: Сохранить образ нравственного уклонения и последующего ухода без уточнения объекта.
  alternative: Добавить «от Бога» или «с Его пути».
  rationale: В данном стихе объект прямо не назван; такое уточнение сузило бы сохраняемую оригиналом формулировку.
translation_notes:
  register: Современный литературный русский язык с достойной библейской интонацией. «Строптивое» выразительно, но понятно; параллелизм и краткость еврейской фразы сохранены.
