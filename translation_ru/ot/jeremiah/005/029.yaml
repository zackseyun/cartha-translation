  to: «Неужели Я не взыщу за это? — возвещает Яхве. — Неужели душа Моя не совершит возмездия над таким народом?»[a]
  rationale: Заменено двусмысленное «отомстит такому народу» на «совершит возмездия над таким народом», чтобы ясно передать, что народ является объектом кары. Сноска перенесена к выражению, которое она поясняет; отдельная сноска к «взыщу» не нужна, поскольку основной вариант уже сохраняет судебную многозначность פקד.
