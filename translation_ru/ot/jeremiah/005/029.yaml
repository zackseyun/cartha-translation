base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/029.yaml
  text: Shall I not punish for these things? declares Yahweh[b][a]. Shall my soul not avenge itself on a nation such as this?
translation:
  language: ru
  text: «Неужели Я не взыщу за это? — возвещает Яхве. — Неужели душа Моя не совершит возмездия над таким народом?»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Неужели душа Моя не отомстит над таким народом?» Здесь «душа Моя» выражает личную решимость Яхве; по смыслу возможно: «Неужели Я Сам не совершу возмездия над таким народом?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה לֹא אֶפְקֹד
  choice: Неужели Я не взыщу за это?
  rationale: Риторический вопрос передаёт уверенность в неизбежном вмешательстве. «Взыщу» сохраняет судебный смысл פקד и, в отличие от более узкого «накажу», допускает значение привлечения к ответу.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Пророческая формула передана торжественно и естественно; личное имя יהוה сохранено как «Яхве».
- source_word: אִם ... לֹא
  choice: Неужели ... не
  rationale: В параллельном риторическом вопросе אִם имеет усилительную, близкую к клятвенной, функцию, а не обычное условное значение «если».
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: такому народу
  rationale: Дательный оборот после «отомстить» естественен по-русски и точно обозначает объект возмездия; «такому» сохраняет указательно-оценочную силу כָּזֶה.
- source_word: תִתְנַקֵּם נַפְשִׁי
  choice: душа Моя не отомстит
  rationale: Сохранены и явный субъект נַפְשִׁי, и возвратно-среднее значение Hitpael נקם. Формулировка подчёркивает личную решимость говорящего, не сводя выражение к простому «Я не отомщу».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация «Яхве» отличает его от титула «Господь» и соответствует предоставленному решению проекта.
- issue: Антропопатическое выражение נַפְשִׁי
  choice: душа Моя
  alternative: Я Сам; Я
  rationale: Буквальный образ сохранён как значимое выражение личной решимости Яхве. Он не истолковывается как техническое учение о составе Божьего существа.
translation_notes:
  register: Современный литературный русский с пророческой торжественностью. Параллелизм двух риторических вопросов сохранён. «Возвещает» поддерживает высокий, но понятный регистр; «взыщу» сохраняет судебную многозначность исходного глагола.
