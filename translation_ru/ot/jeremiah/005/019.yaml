base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/019.yaml
  text: And when you say[a], ‘Why has Yahweh our God done all these things to us?’ then you shall say to them, ‘Just as you have forsaken me and served foreign gods in your land, so you shall serve foreigners in a land not yours.’
translation:
  language: ru
  text: 'И когда вы скажете: «За что Яхве, наш Бог, сделал с нами всё это?» — тогда скажи им: «Как вы оставили Меня и служили чужим богам в вашей земле, так будете служить чужеземцам[a] в земле, которая не ваша».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужим людям», «иноземцам». Еврейское זָרִים здесь обозначает чужеземцев, в отличие от упомянутых ранее «чужих богов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Еврейская формула вводит ожидаемую будущую ситуацию; «И когда» естественно передаёт временно-условный смысл.
- source_word: תַּחַת מֶה
  choice: За что
  rationale: Вопрос касается причины постигшего народ суда. Русское «За что?» естественно звучит в устах тех, кто спрашивает о причине наказания.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: עָשָׂה ... אֶת כָּל אֵלֶּה
  choice: сделал с нами всё это
  rationale: Сохраняет конкретную отсылку к перечисленным бедствиям и естественно сочетается в русском языке с вопросом «За что?».
- source_word: עֲזַבְתֶּם אוֹתִי
  choice: вы оставили Меня
  rationale: Передаёт разрыв верности Богу без добавления конфессионально окрашенной терминологии.
- source_word: וַתַּעַבְדוּ
  choice: служили
  rationale: Глагол עבד обозначает служение и применим как к богам, так и к людям; одинаковый корень в обеих частях стиха сохраняет смысловую параллель.
- source_word: אֱלֹהֵי נֵכָר
  choice: чужим богам
  rationale: «Чужие боги» ясно обозначает богов, не принадлежащих заветному народу, и подготавливает игру значений со словом «чужеземцы».
- source_word: זָרִים
  choice: чужеземцам
  rationale: Здесь слово обозначает иностранных людей, а не богов; дательный падеж обусловлен русским управлением глагола «служить».
- source_word: בְּאֶרֶץ לֹא לָכֶם
  choice: в земле, которая не ваша
  rationale: Близко передаёт контраст между «своей землёй» и чужой землёй, не уточняя сверх текста характер изгнания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст называет Бога личным именем; транслитерация сохраняет это отличие от титула «Господь».
- issue: Значение עבד в параллельных частях стиха
  choice: служили / будете служить
  alternative: поклонялись / будете рабами
  rationale: 'Единое «служить» сохраняет намеренную меру за меру: служение чужим богам в своей земле оборачивается служением чужеземцам в чужой земле, не устраняя смыслового напряжения.'
translation_notes:
  register: 'Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Смена множественного «вы» на единственное «ты» сохранена: народ задаёт вопрос, а Бог поручает пророку ответить ему. Сравнительная конструкция «как… так…» воспроизводит еврейскую риторическую симметрию.'
