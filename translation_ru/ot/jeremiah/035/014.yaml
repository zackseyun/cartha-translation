  text: הוּקַ֡ם אֶת דִּבְרֵ֣י יְהוֹנָדָ֣ב בֶּן רֵ֠כָב אֲשֶׁר צִוָּ֨ה אֶת בָּנָ֜י/ו לְ/בִלְתִּ֣י שְׁתֽוֹת יַ֗יִן וְ/לֹ֤א שָׁתוּ֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י שָֽׁמְע֔וּ אֵ֖ת מִצְוַ֣ת אֲבִי/הֶ֑ם וְ/אָ֨נֹכִ֜י דִּבַּ֤רְתִּי אֲלֵי/כֶם֙ הַשְׁכֵּ֣ם וְ/דַבֵּ֔ר וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/014.yaml
  text: The words of Jehonadab son of Rechab[a], which he commanded his sons—not to drink wine—have been upheld, and they have not drunk wine to this day, because they have obeyed the command of their father. But I have spoken to you, rising early and speaking[b], and you have not listened to me.
translation:
  language: ru
  text: 'Слова Иегонадава, сына Рехава[a], который велел своим сыновьям не пить вина, были соблюдены: они не пили вина до сего дня, потому что послушались повеления своего отца. А Я говорил вам, вставая рано и говоря[b], но вы не послушали Меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ионадав» — сокращённая форма имени «Иегонадав».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение «вставая рано и говоря» означает настойчивое, многократное обращение.
    reason: cultural_note
lexical_decisions:
- source_word: הוּקַם אֶת דִּבְרֵי
  choice: слова… исполняются
  rationale: Пассивная форма קום здесь означает, что наставление сохраняет силу и осуществляется на деле. Настоящее время естественно передаёт продолжающееся соблюдение, подтверждённое словами «до сего дня».
- source_word: יְהוֹנָדָב בֶּן רֵכָב
  choice: Ионадава, сына Рехава
  rationale: Использованы узнаваемые русские библейские формы имён; более полная передача первого имени отмечена в сноске.
- source_word: צִוָּה
  choice: велел
  rationale: Глагол выражает властное наставление. «Велел» ясно и естественно в речи об отцовском предписании.
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן
  choice: не пить вина
  rationale: Прямая и естественная передача запрета без добавочного толкования.
- source_word: וְלֹא שָׁתוּ עַד הַיּוֹם הַזֶּה
  choice: они до сего дня не пьют его
  rationale: Русское настоящее время выражает непрерывное воздержание вплоть до настоящего момента; местоимение однозначно отсылает к вину.
- source_word: שָׁמְעוּ אֵת מִצְוַת אֲבִיהֶם
  choice: слушаются повеления своего отца
  rationale: При существительном «повеление» שמע означает не только слышание, но и послушание. «Слушаются» сохраняет связь между слушанием и исполнением.
- source_word: וְאָנֹכִי
  choice: Я же
  rationale: Частица «же» подчёркивает контраст между послушанием потомков Ионадава и отказом адресатов слушать Бога.
- source_word: הַשְׁכֵּם וְדַבֵּר
  choice: неустанно говорил вам с раннего утра
  rationale: Переданы и образ раннего вставания, и идиоматический смысл настойчивого, многократного обращения; буквальная форма пояснена в сноске.
- source_word: וְלֹא שְׁמַעְתֶּם אֵלָי
  choice: но вы Меня не слушали
  rationale: 'Сохранено ключевое повторение корня שמע: одни слушаются отца, другие не слушают Бога. Заглавная буква в местоимении указывает на говорящего Бога согласно русской издательской традиции.'
theological_decisions:
- issue: Контраст между послушанием рехавитов отцу и непослушанием народа Богу
  choice: Сохранить повтор глагола «слушаться/слушать», не усиливая фразу словами о завете или мятеже
  alternative: Передать второе выражение как «вы Мне не повиновались»
  rationale: Еврейский текст строит богословский контраст посредством повторения שמע. Русские «слушаются» и «не слушали» сохраняют одновременно смысл послушания и словесную связь, не добавляя отсутствующих в стихе категорий.
- issue: Идиома раннего вставания и речи
  choice: Передать как настойчивое обращение с сохранением образа раннего утра и дать сноску
  alternative: 'Буквально: «вставая рано и говоря»'
  rationale: Буквальная калька в современном русском неясна и может быть понята как описание единичного распорядка дня. Основной текст передаёт настойчивость Божьих обращений, а сноска сохраняет образ исходного текста.
translation_notes:
  register: 'Современный литературный русский с достоинством библейской речи. Оборот «до сего дня» намеренно сохраняет умеренно возвышенный регистр, оставаясь понятным. Синтаксис слегка перестроен ради ясности: содержание заповеди вынесено после двоеточия. Все сноски отмечены в основном тексте.'
