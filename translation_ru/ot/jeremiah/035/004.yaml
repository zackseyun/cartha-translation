  text: וָ/אָבִ֤א אֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל לִשְׁכַּ֗ת בְּנֵ֛י חָנָ֥ן בֶּן יִגְדַּלְיָ֖הוּ אִ֣ישׁ הָ/אֱלֹהִ֑ים אֲשֶׁר אֵ֨צֶל֙ לִשְׁכַּ֣ת הַ/שָּׂרִ֔ים אֲשֶׁ֣ר מִ/מַּ֗עַל לְ/לִשְׁכַּ֛ת מַעֲשֵׂיָ֥הוּ בֶן שַׁלֻּ֖ם שֹׁמֵ֥ר הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/004.yaml
  text: So I brought them into the house of Yahweh[a], into the chamber of the sons of Hanan son of Igdaliah, the man of God, which was beside the chamber of the officials, which was above the chamber of Maaseiah son of Shallum[c][b], the keeper of the threshold.
translation:
  language: ru
  text: И я привёл их в дом Яхве[a], в комнату сыновей Ханана[b], сына Игдалии, человека Божьего, которая находилась рядом с комнатой сановников, находившейся над комнатой Маасеи, сына Шаллума, хранителя порога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храм Яхве». Буквально: «в дом Яхве».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «сыновья Ханана» может означать его потомков, домочадцев или связанную с ним группу.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «привратника». Буквально: «хранителя порога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבִא
  choice: И я привёл
  rationale: Форма wayyiqtol продолжает последовательное повествование; «и» естественно передаёт связь с предыдущим действием, не усиливая причинный оттенок.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома» и прямо передаёт личное имя יהוה; в данном контексте речь идёт о храме.
- source_word: לִשְׁכַּת
  choice: комнату
  rationale: לשכה обозначает отдельное помещение, в частности храмовую комнату; современное «комната» яснее обычному читателю, чем книжное «палата».
- source_word: בְּנֵי חָנָן
  choice: сыновей Ханана
  rationale: 'Формально сохраняет еврейское выражение и его неоднозначность: это могут быть непосредственные сыновья, потомки, домочадцы или связанная с Хананом группа.'
- source_word: אִישׁ הָאֱלֹהִים
  choice: человека Божьего
  rationale: Передаёт устойчивое почётное обозначение איש האלהים без уточнения роли, не названной в тексте.
- source_word: אֵצֶל
  choice: рядом с
  rationale: Естественно передаёт пространственную близость помещений.
- source_word: הַשָּׂרִים
  choice: сановников
  rationale: В данном административно-храмовом контексте שרים обозначает высокопоставленных должностных лиц; «сановники» не предполагает, что они были царскими сыновьями.
- source_word: מִמַּעַל לְ
  choice: над
  rationale: Передаёт вертикальное расположение одной комнаты выше другой.
- source_word: שֹׁמֵר הַסַּף
  choice: хранителя порога
  rationale: Сохраняет буквальный образ и официальное наименование должности; по функции это мог быть привратник.
- source_word: חָנָן ... יִגְדַּלְיָהוּ ... מַעֲשֵׂיָהוּ ... שַׁלֻּם
  choice: Ханан ... Игдалия ... Маасея ... Шаллум
  rationale: Имена переданы русской библейской транслитерацией с учётом форм еврейского текста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон — личное имя Бога; «Яхве» сохраняет различие между именем и титулом.
- issue: Статус Ханана в выражении אִישׁ הָאֱלֹהִים
  choice: человек Божий
  alternative: пророк
  rationale: Перевод сохраняет данное в тексте почётное обозначение и не отождествляет его без прямого основания с более узким служением пророка.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Длинное еврейское предложение разделено на два для ясности; местоимение «она» однозначно относится к комнате сыновей Ханана. Все смысловые и пространственные связи исходного текста сохранены.
