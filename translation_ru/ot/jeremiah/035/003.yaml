base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/003.yaml
  text: So I took Jaazaniah son of Jeremiah[a], son of Habazziniah, and his brothers, and all his sons[b], and the whole house of the Rechabites.
translation:
  language: ru
  text: И я взял[a] Яазанию, сына Иеремии, сына Хаваццинии, его братьев, всех его сыновей и весь дом[b] рехавитов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «Тогда я взял» или «Итак, я взял». Еврейская повествовательная форма обозначает следующее действие в последовательности, но сама по себе не уточняет оттенок связи.'
    reason: lexical_alternative
  - marker: b
    text: «Дом» здесь означает не здание, а весь род или общину рехавитов.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: И взял я
  rationale: Форма wayyiqtol от לקח продолжает последовательное повествование. Инверсия «взял я» естественна для достойного русского библейского повествования и сохраняет связь с предыдущим контекстом.
- source_word: יַאֲזַנְיָה
  choice: Иазанию
  rationale: Личное имя передано принятой русской библейской транслитерацией; винительный падеж обусловлен глаголом «взял».
- source_word: בֶן יִרְמְיָהוּ בֶן חֲבַצִּנְיָה
  choice: сына Иеремии, сына Хавацинии
  rationale: 'Сохранена прямая родословная цепочка: Иазания — сын Иеремии, а Иеремия — сын Хавацинии.'
- source_word: אֶחָיו
  choice: его братьев
  rationale: Передано обычное конкретное значение אח; контекст не требует расширять его до «родственников».
- source_word: כָּל בָּנָיו
  choice: всех его сыновей
  rationale: Сохранено грамматически мужское и контекстуально уместное значение בנים, без замены на более широкое «детей» или «потомков».
- source_word: כָּל בֵּית הָרֵכָבִים
  choice: весь дом рехавитов
  rationale: «Дом» сохраняет семейно-корпоративную библейскую идиому, а «рехавиты» естественно передаёт название этой родовой общины.
