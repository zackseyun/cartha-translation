  text: וַ/יֹּאמְר֖וּ לֹ֣א נִשְׁתֶּה יָּ֑יִן כִּי֩ יוֹנָדָ֨ב בֶּן רֵכָ֜ב אָבִ֗י/נוּ צִוָּ֤ה עָלֵ֨י/נוּ֙ לֵ/אמֹ֔ר לֹ֧א תִשְׁתּוּ יַ֛יִן אַתֶּ֥ם וּ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/006.yaml
  text: But they said[a], “We will not drink wine, for Jonadab son of Rechab, our father, commanded us, saying, ‘You shall not drink wine, you or your sons[c][b], forever.’”
translation:
  language: ru
  text: 'Но они ответили[a]: «Мы не будем пить вина, потому что Ионадав, сын Рехава, наш отец[b], повелел нам: „Не пейте вина ни вы, ни ваши сыновья[c] — вовек“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «И они сказали». Еврейский повествовательный союз допускает оба варианта; «но» подчёркивает контраст с предшествующим предложением выпить вина.'
    reason: lexical_alternative
  - marker: b
    text: То есть наш предок, родоначальник. Ионадав жил задолго до описываемых событий.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «сыновья» — речь именно о потомках мужского пола, а не о детях вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Но они ответили
  rationale: Последовательный союз продвигает повествование, однако в данном контексте ответ противопоставлен предшествующему предложению выпить вина; «ответили» естественно передаёт реплику в диалоге.
- source_word: לֹא נִשְׁתֶּה יָּיִן
  choice: Мы не будем пить вина
  rationale: Имперфект выражает решительный отказ; родительный падеж после отрицания естественен в современном литературном русском языке.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину отказа.
- source_word: יוֹנָדָב בֶּן רֵכָב
  choice: Ионадав, сын Рехава
  rationale: Имена переданы в принятой русской библейской форме, а патронимическая конструкция сохранена прямо.
- source_word: אָבִינוּ
  choice: наш отец
  rationale: Сохраняет буквальный родовой термин; в контексте речь идёт о предке, что пояснено сноской.
- source_word: צִוָּה עָלֵינוּ
  choice: повелел нам
  rationale: Естественно передаёт обязательную силу еврейской конструкции.
- source_word: לֵאמֹר
  choice: 'повелел нам:'
  rationale: Русское двоеточие естественно вводит содержание повеления без тяжеловесного буквального «говоря».
- source_word: לֹא תִשְׁתּוּ יַיִן
  choice: Не пейте вина
  rationale: Отрицательный императив точно и естественно передаёт запрет.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: ни вы, ни ваши сыновья
  rationale: Повторная отрицательная конструкция ясно охватывает обе группы и сохраняет конкретное значение «сыновья», а не обобщённое «дети».
- source_word: עַד עוֹלָם
  choice: вовек
  rationale: Краткое и dignified русское выражение передаёт бессрочную, продолжающуюся силу родового установления.
