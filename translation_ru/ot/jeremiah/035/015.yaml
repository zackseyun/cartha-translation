source:
  edition: WLC
  text: וָ/אֶשְׁלַ֣ח אֲלֵי/כֶ֣ם אֶת כָּל עֲבָדַ֣/י הַ/נְּבִאִ֣ים הַשְׁכֵּ֣ים וְ/שָׁלֹ֣חַ לֵ/אמֹ֡ר שֻׁבוּ נָ֡א אִישׁ֩ מִ/דַּרְכּ֨/וֹ הָ/רָעָ֜ה וְ/הֵיטִ֣יבוּ מַֽעַלְלֵי/כֶ֗ם וְ/אַל תֵּ֨לְכ֜וּ אַחֲרֵ֨י אֱלֹהִ֤ים אֲחֵרִים֙ לְ/עָבְדָ֔/ם וּ/שְׁבוּ֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תִּי לָ/כֶ֖ם וְ/לַ/אֲבֹֽתֵי/כֶ֑ם וְ/לֹ֤א הִטִּיתֶם֙ אֶֽת אָזְנְ/כֶ֔ם וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/015.yaml
  text: And I sent to you all my servants the prophets[a], rising early and sending them, saying, ‘Please turn back, each man from his evil way, and make your deeds good, and do not go after other gods to serve them[d][c][b]. Then dwell in the land that I gave to you and to your fathers.’ But you did not incline your ear or listen to me.
translation:
  language: ru
  text: 'Я посылал к вам всех Моих слуг — пророков, снова и снова посылал, говоря: «Прошу, отвернитесь — каждый от своего злого пути, исправьте свои дела и не ходите вслед за другими богами, чтобы служить им. Тогда живите на земле, которую Я дал вам и вашим предкам». Но вы не приклонили уха и не послушали Меня.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Я посылал
  rationale: Русское прошедшее несовершенного вида естественно передаёт повторявшееся в прошлом действие в сочетании с последующим идиоматическим выражением о настойчивой посылке пророков.
- source_word: עֲבָדַי הַנְּבִאִים
  choice: всех Моих слуг — пророков
  rationale: 'Тире ясно передаёт приложение: пророки названы слугами Бога.'
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  choice: посылал настойчиво
  rationale: Буквальное «вставая рано и посылая» в современном русском может быть ошибочно понято как указание только на время суток; перевод передаёт идиоматический смысл постоянства и усердия.
- source_word: שֻׁבוּ נָא
  choice: Прошу, отвернитесь
  rationale: «Отвернитесь» согласуется с дополнением «от своего злого пути» и сохраняет образ нравственного поворота; נָא передано словом «прошу».
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: каждый от своего злого пути
  rationale: Передаёт распределительное значение אִישׁ применительно к каждому человеку, не создавая в русском неестественной гендерной маркированности.
- source_word: וְהֵיטִיבוּ מַעַלְלֵיכֶם
  choice: исправьте свои дела
  rationale: Естественно передаёт каузативное «сделайте хорошими» применительно к поступкам, не сужая смысл до отдельных действий.
- source_word: וְאַל תֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: не ходите вслед за другими богами
  rationale: Сохраняет образ следования за богами, связанный с отступничеством.
- source_word: לְעָבְדָם
  choice: чтобы служить им
  rationale: «Служить» сохраняет широкий смысл עבד, включающий поклонение, но не ограниченный одним обрядовым действием.
- source_word: וּשְׁבוּ אֶל הָאֲדָמָה
  choice: Тогда живите на земле
  rationale: יָשַׁב здесь означает жить или оставаться; «тогда» естественно выражает обусловленную предшествующими повелениями последовательность.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבֹתֵיכֶם
  choice: которую Я дал вам и вашим предкам
  rationale: «Предкам» точно и понятно передаёт идиоматическое אָבוֹת в значении прежних поколений.
- source_word: וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם וְלֹא שְׁמַעְתֶּם אֵלָי
  choice: Но вы не преклонили уха и не послушали Меня
  rationale: Сохраняется яркий еврейский образ внимательного слушания и параллельное усиление второй фразой.
theological_decisions:
- issue: Призыв שׁוּב к нравственному обращению
  choice: отвернитесь каждый от своего злого пути
  alternative: покайтесь; возвратитесь
  rationale: Выбранный вариант сохраняет пространственный образ поворота, прямо связанный в тексте со злым путём, и не заменяет его более систематизированным богословским термином.
- issue: Характер служения другим богам
  choice: служить им
  alternative: поклоняться им
  rationale: «Служить» сохраняет лексическую широту עבד и одновременно в контексте ясно обозначает идолопоклонство.
- issue: Связь послушания с жизнью на данной Богом земле
  choice: Тогда живите на земле
  alternative: и живите на земле; чтобы вам жить на земле
  rationale: «Тогда» передаёт контекстуальную результативность, не превращая повеление в однозначно сформулированное обещание или формальное условное предложение.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены библейские образы «ходить вслед» и «преклонить ухо», тогда как непрозрачная для большинства читателей идиома о раннем вставании передана смысловым выражением «посылал настойчиво». Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции.
