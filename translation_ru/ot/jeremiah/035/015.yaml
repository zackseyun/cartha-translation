  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: посылание пророков, призыв оставить злые пути, исправить дела, не служить иным богам и жить на данной земле сохранены. Однако «не преклонили уха» не является обычным русским соответствием еврейской идиомы; нормативное библейское выражение — «не приклонили уха».'
  naturalness: Текст в целом современный и литературный. «Посылал настойчиво» понятно, но несколько сглаживает повторный характер еврейской конструкции; «снова и снова посылал» передаёт его яснее и естественнее. Для распределительного «каждый» полезна пунктуационная маркировка, чтобы устранить шероховатость.
  terminology: «Слуги — пророки», «злой путь», «исправьте свои дела», «ходить вслед за другими богами», «служить им» и «предки» уместны. «Приклонили уха» сохраняет библейский образ и естественно сочетается с последующим «не послушали Меня».
  issues:
