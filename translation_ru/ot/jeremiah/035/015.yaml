    issue: «Не преклонили уха»
    rationale: В русском библейском и литературном употреблении для значения «склонить/обратить ухо, чтобы слушать» употребляется «приклонить ухо». «Преклонить» обычно значит склониться в почтении и здесь звучит лексически неточно.
  - severity: low
    issue: Передача הַשְׁכֵּים וְשָׁלֹחַ как «посылал настойчиво»
    rationale: Передаёт усердие, но менее отчётливо выражает неоднократное, постоянное посылание. «Снова и снова посылал» сохраняет этот аспект без неясного буквального образа раннего вставания.
