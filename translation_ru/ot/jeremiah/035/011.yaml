  yaml_path: translation/ot/jeremiah/035/011.yaml
  text: But when Nebuchadnezzar king of Babylon came up against the land[a], we said, ‘Come[b], and let us go to Jerusalem because of the army of the Chaldeans and because of the army of Aram.’ So we settled in Jerusalem.
translation:
  language: ru
  text: 'Но когда Навуходоносор, царь Вавилона, вторгся в страну, мы сказали: «Пойдём в Иерусалим, спасаясь от войска халдеев[a] и от войска Арама[b]». Так мы поселились в Иерусалиме.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть вавилонян.
    reason: lexical_alternative
  - marker: b
    text: Арам традиционно также называется Сирией.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּעֲלוֹת
  choice: Но когда … выступил против
  rationale: Сочетание вводит временное обстоятельство с лёгким противопоставлением предыдущему контексту; в военной обстановке עלה означает наступление или выступление против страны.
- source_word: נְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל
  choice: Навуходоносор, царь Вавилона
  rationale: Использована общепринятая русская форма имени и сохранён титул исходного текста.
- source_word: הָאָרֶץ
  choice: эта земля
  rationale: Определённое «земля» в контексте указывает на землю Иудеи; указательное слово делает эту отсылку естественной по-русски, не подменяя её названием.
- source_word: בֹּאוּ וְנָבוֹא
  choice: Идёмте, уйдём
  rationale: Императив и когортатив передают совместный призыв и решение отправиться в безопасное место; «уйдём» естественно выражает удаление от наступающих войск.
- source_word: מִפְּנֵי
  choice: от
  rationale: Предлог обозначает удаление и поиск убежища перед лицом военной угрозы, что кратко и естественно передаётся русским «от».
- source_word: חֵיל הַכַּשְׂדִּים
  choice: войско халдеев
  rationale: חֵיל здесь означает вооружённые силы, а «халдеи» сохраняет этнополитическое обозначение оригинала.
- source_word: חֵיל אֲרָם
  choice: войско Арама
  rationale: Сохранено собственное имя אֲרָם и конструкция принадлежности; традиционное «Сирия» отмечено в сноске.
- source_word: וַנֵּשֶׁב
  choice: Так мы и стали жить
  rationale: Глагол ישב обозначает проживание или пребывание. Формулировка передаёт наступившее вследствие решения состояние, не приписывая ему обязательно постоянный характер.
