  yaml_path: translation/ot/jeremiah/035/010.yaml
  text: So we have lived in tents[b][a], and we have obeyed and done all that Jonadab our father commanded us.
translation:
  language: ru
  text: Мы жили в шатрах, слушались и исполняли всё, что повелел нам Ионадав, наш отец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: живём
  rationale: Глагол ישׁב здесь обозначает проживание; настоящее время естественно передаёт продолжающийся уклад жизни рехавитов в контексте их ответа.
- source_word: בָּאֳהָלִים
  choice: в шатрах
  rationale: Форма без артикля описывает образ жизни вообще, а «шатры» — естественное и достойное обозначение переносных жилищ.
- source_word: וַנִּשְׁמַע
  choice: слушаемся
  rationale: В сочетании с повелением שׁמע означает не просто слышать, а внимать с послушанием; «слушаемся» сохраняет связь со значением слышания и выражает покорность.
- source_word: וַנַּעַשׂ
  choice: исполняя
  rationale: Глагол עשׂה указывает на практическое выполнение повеления; деепричастная конструкция по-русски естественно связывает послушание с действием, не устраняя различия двух еврейских глаголов.
- source_word: כְּכֹל אֲשֶׁר
  choice: всё, что
  rationale: Идиома выражает полное соответствие всему содержанию повеления и естественно передаётся по-русски как «всё, что».
- source_word: צִוָּנוּ
  choice: повелел нам
  rationale: צוה — обычный глагол властного повеления; «повелел» сохраняет его силу и соответствует высокому, но современному библейскому регистру.
- source_word: יוֹנָדָב
  choice: Ионадав
  rationale: Традиционная русская библейская передача имени יוֹנָדָב.
- source_word: אָבִינוּ
  choice: наш отец
  rationale: Буквальное значение — «наш отец»; в контексте речь идёт о предке рода, однако буквальная формулировка ясна и сохраняет семейный язык оригинала.
theological_decisions:
- issue: Значение שׁמע применительно к повелению
  choice: слушаемся
  alternative: слушаем / слышим
  rationale: Контекст говорит о соблюдении распоряжений Ионадава, поэтому глагол подразумевает послушный отклик. Выбор «слушаемся» передаёт это значение, сохраняя слышимую связь с буквальным «слушать».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Координация еврейских форм передана естественной русской фразой; смысл продолжающейся практики выражен настоящим временем.
