base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/001.yaml
  text: The word that came to Jeremiah from Yahweh in the days of Jehoiakim son of Josiah[a], king of Judah, saying,
translation:
  language: ru
  text: 'Слово, которое пришло к Иеремии от Яхве[a] во дни Иоакима, сына Иосии, царя Иудеи:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. YHWH — личное имя Бога; традиционная передача: «Господь».'
    reason: Пояснение передачи тетраграмматона и традиционного варианта.
lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: Сохраняет традиционную пророческую формулу и широкий смысл דָּבָר — «слово, весть, дело».
- source_word: אֲשֶׁר הָיָה אֶל
  choice: которое было к
  rationale: Формально передаёт устойчивую формулу получения пророческого откровения; оборот понятен в возвышенном библейском регистре.
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Общепринятая русская форма имени с требуемым падежным оформлением.
- source_word: מֵאֵת
  choice: от
  rationale: В данной конструкции обозначает источник слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя YHWH транслитерацией, а не заменяет его титулом.
- source_word: בִּימֵי
  choice: во дни
  rationale: Сохраняет буквальный временной оборот и его летописно-пророческий характер.
- source_word: יְהוֹיָקִים
  choice: Иоакима
  rationale: Общепринятая русская библейская форма имени.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: сына Иосии
  rationale: Прямо и естественно передаёт родословное обозначение.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Естественная русская аппозиция, определяющая положение Иоакима.
- source_word: לֵאמֹר
  choice: 'Оно гласило:'
  rationale: Естественно вводит содержание откровения, следующее в следующем стихе, и избегает тяжеловесного причастия «говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; «Яхве» сохраняет это различие, тогда как «Господь» заменяет имя титулом.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и формульности пророческого вступления. Оборот «было к» намеренно сохраняет характер еврейской формулы; «Оно гласило» делает переход к последующей речи естественным.
