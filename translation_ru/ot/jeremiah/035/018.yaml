  naturalness: 'В исходном варианте видовое сочетание «послушались … соблюдали … поступали» несколько неровно: первое действие выражено совершенным видом, тогда как два последующих — несовершенным, хотя еврейские формы перечисляют совершившееся послушание. Совершенный вид делает перечисление более связным и естественным в данном контексте.'
