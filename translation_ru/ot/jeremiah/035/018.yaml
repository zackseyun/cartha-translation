  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/לְ/בֵ֨ית הָ/רֵכָבִ֜ים אָמַ֣ר יִרְמְיָ֗הוּ כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֚עַן אֲשֶׁ֣ר שְׁמַעְתֶּ֔ם עַל מִצְוַ֖ת יְהוֹנָדָ֣ב אֲבִי/כֶ֑ם וַֽ/תִּשְׁמְרוּ֙ אֶת כָּל מִצְוֺתָ֔י/ו וַֽ/תַּעֲשׂ֔וּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖ה אֶתְ/כֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/018.yaml
  text: 'And to the house of the Rechabites Jeremiah said[a], “Thus says Yahweh of hosts, the God of Israel: Because you have obeyed the command of Jehonadab your father, and have kept all his commands, and have done according to all that he commanded you,”'
translation:
  language: ru
  text: 'А роду рехавитов Иеремия сказал: «Так говорит Яхве Воинств, Бог Израиля: поскольку вы послушались повеления Иегонадава[a], вашего отца, соблюли все его повеления и во всём поступили так, как он вам повелел, —»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Иегонадав; это имя также передают как Ионадав.
    reason: Указание формы имени в еврейском тексте и распространённого варианта передачи.
lexical_decisions:
- source_word: וּלְבֵית הָרֵכָבִים
  choice: А роду рехавитов
  rationale: בֵּית здесь обозначает не здание, а семейно-родовую общность. «Роду» естественно передаёт этот смысл по-русски, не сводя выражение лишь к живущим в одном доме.
- source_word: אָמַר יִרְמְיָהוּ
  choice: Иеремия сказал
  rationale: Прямое и естественное соответствие обычной формуле введения речи.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет торжественную пророческую формулу в ясной современной форме.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией «Яхве», а צְבָאוֹת — традиционно понятным и достаточно широким словом «Воинств», не ограничивающим смысл только земными армиями.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо передаёт еврейское сопряжённое сочетание.
- source_word: יַעַן אֲשֶׁר
  choice: поскольку
  rationale: Вводит основание для следующего, находящегося в ст. 19, Божьего заявления и сохраняет незавершённость синтаксиса данного стиха.
- source_word: שְׁמַעְתֶּם עַל מִצְוַת
  choice: вы послушались повеления
  rationale: שׁמע с עַל означает деятельное послушание, а не только восприятие на слух.
- source_word: יְהוֹנָדָב אֲבִיכֶם
  choice: Иегонадава, вашего отца
  rationale: «Иегонадав» передаёт полную форму имени в данном еврейском тексте; «отца» сохраняет буквальный родовой язык оригинала, хотя речь идёт о предке рехавитов.
- source_word: וַתִּשְׁמְרוּ אֶת כָּל מִצְוֺתָיו
  choice: соблюдали все его повеления
  rationale: שׁמר применительно к предписаниям означает хранить и соблюдать их; повтор «повеления» отражает повтор מִצְוָה в оригинале.
- source_word: וַתַּעֲשׂוּ כְּכֹל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: и во всём поступали так, как он вам повелел
  rationale: 'Передаёт сравнительно-нормативную силу כְּ: действия соответствовали всему велённому, а не просто совпадали с перечнем приказов.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, поэтому транслитерация сохраняет его отличие от титула «Господь».
- issue: Значение אֲבִיכֶם применительно к Иегонадаву
  choice: вашего отца
  alternative: вашего предка
  rationale: Буквальное «отца» сохраняет библейский родовой способ выражения; контекст рода рехавитов позволяет понимать его как праотца, не устраняя исходную формулировку.
- issue: Незавершённая причинная конструкция
  choice: сохранить продолжение мысли с помощью конечного тире
  alternative: завершить стих самостоятельным предложением
  rationale: יַעַן אֲשֶׁר вводит основание, а главное следствие появляется в следующем стихе. Искусственное завершение здесь ослабило бы связь стихов 18–19.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Формула «Так говорит» и титул «Яхве Воинств» сохраняют торжественность, тогда как синтаксис остаётся понятным. Конечное тире показывает, что причинное придаточное получает завершение в следующем стихе.
