source:
  edition: WLC
  text: הָלוֹךְ֮ אֶל בֵּ֣ית הָ/רֵכָבִים֒ וְ/דִבַּרְתָּ֣ אוֹתָ֔/ם וַ/הֲבִֽאוֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל אַחַ֖ת הַ/לְּשָׁכ֑וֹת וְ/הִשְׁקִיתָ֥ אוֹתָ֖/ם יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/002.yaml
  text: Go to the house of the Rechabites[a], and speak to them, and bring them to the house of Yahweh, into one of the chambers, and give them wine to drink.
translation:
  language: ru
  text: «Пойди к роду рехавитов, поговори с ними, приведи их в дом Яхве[a], в одну из комнат, и дай им выпить вина».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «храм Яхве». Буквально: «дом Яхве».'
    reason: Лексическая альтернатива поясняет, что буквальное еврейское выражение в данном контексте обозначает храм.
lexical_decisions:
- source_word: הָלוֹךְ
  choice: Пойди
  rationale: Императив הלך передаёт прямое повеление; «пойди» естественно и точно звучит в данной последовательности распоряжений.
- source_word: בֵּית הָרֵכָבִים
  choice: к роду рехавитов
  rationale: בֵּית здесь обозначает не здание, а дом в смысле рода или семейно-клановой общности. «Род рехавитов» сохраняет социальный смысл и не создаёт ложного впечатления, будто речь идёт об их жилище.
- source_word: וְדִבַּרְתָּ אֹתָם
  choice: поговори с ними
  rationale: Конструкция דבר с אֵת допускает значение разговора или обращения к людям. «Поговори с ними» естественно передаёт формулировку, не уточняя не названное в тексте содержание речи.
- source_word: וַהֲבִיאוֹתָם
  choice: приведи их
  rationale: Порода hифиль глагола בוא выражает побуждение или содействие приходу; в контексте естественный русский эквивалент — «приведи».
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Перевод сохраняет буквальный образ «дома» и передаёт тетраграмматон личным именем «Яхве»; значение «храм» указано в сноске как контекстуальная альтернатива.
- source_word: אַחַת הַלְּשָׁכוֹת
  choice: одну из комнат
  rationale: לשכה обозначает отдельное помещение, в том числе при храме. Современное «комната» понятно читателю и не привносит лишней архитектурной конкретики.
- source_word: וְהִשְׁקִיתָ אֹתָם יָיִן
  choice: дай им выпить вина
  rationale: Hифиль שקה означает дать пить или напоить. Эта формулировка передаёт каузативный смысл, но сама по себе не предполагает принуждения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула.
- issue: Значение בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: Основной текст сохраняет буквальную лексику оригинала, тогда как сноска поясняет очевидное в контексте храмовое значение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет последовательность повелений оригинала. «Род рехавитов» устраняет пространственную двусмысленность русского выражения «дом рехавитов», а «комната» предпочтена более архаичному «покою».
