  source_fidelity: Текст точно передаёт последовательность действий, адресатов, оба вида сосудов и прямое повеление еврейского текста. «Поставил перед» хорошо соответствует וָאֶתֵּן לִפְנֵי; «сыновья дома рехавитов» сохраняет формулировку בְּנֵי בֵית без неоправданного сведения её к просто «членам».
