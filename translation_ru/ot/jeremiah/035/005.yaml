  text: וָ/אֶתֵּ֞ן לִ/פְנֵ֣י בְּנֵ֣י בֵית הָ/רֵכָבִ֗ים גְּבִעִ֛ים מְלֵאִ֥ים יַ֖יִן וְ/כֹס֑וֹת וָ/אֹמַ֥ר אֲלֵי/הֶ֖ם שְׁתוּ יָֽיִן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/005.yaml
  text: Then I set before the sons of the house of the Rekabites bowls full of wine and cups[a], and I said to them, “Drink wine.”
translation:
  language: ru
  text: 'И поставил я перед сыновьями дома рехавитов чаши, полные вина, и кубки, и сказал им: «Пейте вино».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן לִפְנֵי
  choice: И поставил я перед
  rationale: В сочетании с לִפְנֵי и названиями сосудов נתן естественно означает «поставить перед кем-либо»; начальное «и» сохраняет повествовательную связь.
- source_word: בְּנֵי בֵית הָרֵכָבִים
  choice: сыновьями дома рехавитов
  rationale: Сохраняет буквальный семейно-родовой образ еврейского выражения и передаёт название группы в принятой русской библейской форме.
- source_word: גְּבִעִים
  choice: чаши
  rationale: Слово обозначает округлые сосуды, вероятно чаши или миски; «чаши» естественно в контексте вина и не вводит лишней роскоши.
- source_word: מְלֵאִים יַיִן
  choice: полные вина
  rationale: Прямо передаёт конструкцию с прилагательным «полные» и её дополнением.
- source_word: וְכֹסוֹת
  choice: и кубки
  rationale: Передаёт второй, отличный от чаш, вид сосудов и сохраняет указанное в еврейском тексте различие.
- source_word: וָאֹמַר אֲלֵיהֶם
  choice: и сказал им
  rationale: Прямой и естественный эквивалент повествовательной формулы.
- source_word: שְׁתוּ יָיִן
  choice: Пейте вино
  rationale: Сохраняет множественное число повелительного наклонения и краткость исходной команды без добавления «немного».
