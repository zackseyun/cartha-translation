lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Стандартная повествовательная формула вводит новое событие; «И было» естественно сочетается в русском библейском стиле с устойчивым выражением «слово Яхве» без архаического «и было так».
- source_word: דְּבַר
  choice: слово
  rationale: В пророческой формуле דְּבַר יְהוָה обозначает данное Богом откровение; «слово» сохраняет повторяющуюся формулу и её смысловую насыщенность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста, не заменяя её титулом «Господь».
- source_word: אֶל
  choice: к
  rationale: В сочетании «слово было к кому-либо» предлог «к» точно передаёт направление божественного обращения и сохраняет пророческую формулу.
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Использована укоренившаяся в современном русском языке форма библейского имени «Иеремия», поставленная в дательном падеже после «к».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском его функцию естественно передаёт двоеточие, тогда как буквальное «говоря» здесь звучало бы тяжеловесно.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и не подменяет его титулом; «Иегова» отражает более позднюю гибридную традицию чтения.
translation_notes:
