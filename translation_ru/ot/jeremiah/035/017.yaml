base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/017.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the God of Israel: Behold, I am bringing on Judah and on all the inhabitants of Jerusalem all the disaster that I have spoken against them, because I spoke to them and they did not listen, and I called to them and they did not answer.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве, Бог воинств, Бог Израиля: «Вот, Я наведу на Иудею и на всех жителей Иерусалима всё бедствие[a], которое Я объявил против них, потому что Я говорил им, но они не слушали; Я звал их, но они не отвечали».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё несчастье». Еврейское слово רָעָה в других контекстах может означать также «зло», но здесь оно обозначает объявленное бедствие — суд над Иудеей и Иерусалимом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт логический вывод из предшествующего противопоставления послушания рехавитов непослушанию Иудеи.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Устоявшаяся и естественная по-русски формула пророческого посланника.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бог воинств
  rationale: Сохраняет широкий смысл צְבָאוֹת и конструкцию с אֱלֹהֵי, не сводя выражение исключительно к земным армиям.
- source_word: הִנְנִי מֵבִיא
  choice: Вот, Я наведу
  rationale: «Вот» сохраняет торжественное указание הִנְנִי, а «наведу» естественно выражает наступление объявленного суда.
- source_word: אֶל יְהוּדָה וְאֶל כָּל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: на Иудею и на всех жителей Иерусалима
  rationale: В контексте суда предлог אֶל обозначает направленность бедствия на названных людей и страну.
- source_word: כָּל הָרָעָה
  choice: всё бедствие
  rationale: Здесь רָעָה обозначает губительное несчастье как наказание, а не нравственное зло; «бедствие» естественно в русском пророческом контексте.
- source_word: אֲשֶׁר דִּבַּרְתִּי עֲלֵיהֶם
  choice: которое предрёк им
  rationale: Передаёт смысл заранее объявленного против них бедствия без тяжеловесного буквального оборота «говорил против них».
- source_word: יַעַן דִּבַּרְתִּי אֲלֵיהֶם וְלֹא שָׁמֵעוּ
  choice: потому что Я говорил им, но они не слушали
  rationale: Сохраняет причинную связь и обычный для библейского иврита смысл שׁמע как внимать и повиноваться, не добавляя это толкование прямо в текст.
- source_word: וָאֶקְרָא לָהֶם וְלֹא עָנוּ
  choice: Я звал их, но они не отвечали
  rationale: Прямо сохраняет параллель между Божьим призывом и отсутствием ответа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Значение רָעָה в высказывании о Божьем суде
  choice: бедствие
  alternative: зло; несчастье
  rationale: Контекст говорит о предсказанном наказании Иудеи и Иерусалима. Выбор «бедствие» не снимает суровости суда, но не создаёт ложного впечатления, будто речь идёт о совершаемом Богом нравственном зле.
- issue: Смысл «не слушали»
  choice: не слушали
  alternative: не повиновались
  rationale: Буквальная формулировка сохраняет одновременно отказ внимать Божьим словам и подразумеваемое непослушание, не устраняя смысловую многослойность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохранён достаточно близко к еврейскому, но тяжеловесные кальки устранены; параллелизм «говорил — не слушали; звал — не отвечали» сохранён.
