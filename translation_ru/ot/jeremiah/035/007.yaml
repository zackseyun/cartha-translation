  text: וּ/בַ֣יִת לֹֽא תִבְנ֗וּ וְ/זֶ֤רַע לֹֽא תִזְרָ֨עוּ֙ וְ/כֶ֣רֶם לֹֽא תִטָּ֔עוּ וְ/לֹ֥א יִֽהְיֶ֖ה לָ/כֶ֑ם כִּ֠י בָּ/אֳהָלִ֤ים תֵּֽשְׁבוּ֙ כָּל יְמֵי/כֶ֔ם לְמַ֨עַן תִּֽחְי֜וּ יָמִ֤ים רַבִּים֙ עַל פְּנֵ֣י הָ/אֲדָמָ֔ה אֲשֶׁ֥ר אַתֶּ֖ם גָּרִ֥ים שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/007.yaml
  text: You must not build a house[a], and you must not sow seed, and you must not plant a vineyard, nor shall you have one; but you shall live in tents all your days, so that you may live many days on the face of the land where you are residing there.
translation:
  language: ru
  text: Домов не стройте, семян не сейте и виноградников не разводите; и пусть виноградника у вас не будет. Живите в шатрах всю свою жизнь, чтобы вам долго жить на земле, где вы живёте как пришельцы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «где вы временно проживаете». Еврейский глагол указывает на проживание в качестве пришельцев, без постоянного укоренения.'
    reason: Сохраняется социальный и временный оттенок еврейского גָּרִים, который нельзя полностью выразить одним естественным русским словом.
lexical_decisions:
- source_word: וּבַיִת לֹא תִבְנוּ
  choice: Домов не стройте
  rationale: В данном контексте בַּיִת означает физический дом и противопоставлен жизни в шатрах. Русское множественное число естественно выражает общий запрет, не меняя смысла еврейского единственного числа.
- source_word: וְזֶרַע לֹא תִזְרָעוּ
  choice: семян не сейте
  rationale: Сохранён конкретный образ «семени» и обычное земледельческое значение глагола זרע без уточнения вида культуры.
- source_word: וְכֶרֶם לֹא תִטָּעוּ
  choice: виноградников не разводите
  rationale: כֶּרֶם — виноградник; «разводить виноградники» в современном русском естественнее буквального «сажать виноградник» и точно передаёт создание насаждений.
- source_word: וְלֹא יִהְיֶה לָכֶם
  choice: и пусть виноградника у вас не будет
  rationale: Конструкция существования с לָכֶם передаёт отсутствие владения. Явное повторение «виноградника» делает вероятную отсылку понятной по-русски.
- source_word: בָּאֳהָלִים תֵּשְׁבוּ
  choice: Живите в шатрах
  rationale: В контексте места обитания ישב означает «жить, обитать». «Живите» — современная и ясная передача; «шатры» сохраняют отличие от постоянных домов.
- source_word: כָּל יְמֵיכֶם
  choice: во все ваши дни
  rationale: Близкая к форме оригинала и понятная русская формулировка, подчёркивающая пожизненный характер предписания.
- source_word: לְמַעַן תִּחְיוּ יָמִים רַבִּים
  choice: чтобы вам долго жить
  rationale: לְמַעַן выражает цель; идиоматическое «долго жить» передаёт буквальное «жить многие дни» без неестественного оборота.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: на земле
  rationale: В данном контексте выражение обозначает поверхность или территорию земли; краткая русская форма естественна и не добавляет толкования.
- source_word: אֲשֶׁר אַתֶּם גָּרִים שָׁם
  choice: где вы живёте как пришельцы
  rationale: גור обозначает проживание человека, не имеющего постоянного местного статуса. Формулировка сохраняет эту существенную социальную окраску и устраняет избыточное для русского повторение «там».
theological_decisions:
- issue: Оттенок גָּרִים и положение рехавитов на земле
  choice: живёте как пришельцы
  alternative: временно проживаете; странствуете
  rationale: «Как пришельцы» сохраняет идею проживания без постоянного укоренения или полноправного местного статуса, не превращая её ни в простое путешествие, ни в утверждение о полном отсутствии места жительства.
- issue: Отсылка в וְלֹא יִהְיֶה לָכֶם
  choice: и пусть виноградника у вас не будет
  alternative: и ничего такого у вас пусть не будет; и он не будет принадлежать вам
  rationale: Ближайший грамматически подходящий антецедент — единственное число «виноградник». Перевод следует этой наиболее вероятной связи, хотя еврейская конструкция сама по себе не называет предмет повторно.
translation_notes:
  register: Современный литературный русский с достоинством библейского наставления. Повелительные формы передают запреты и положительное предписание без архаизмов; параллелизм оригинала сохранён, но чрезмерная цепочка союзов слегка сглажена ради естественного русского синтаксиса.
