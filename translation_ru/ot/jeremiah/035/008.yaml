source:
  edition: WLC
  text: וַ/נִּשְׁמַ֗ע בְּ/ק֨וֹל יְהוֹנָדָ֤ב בֶּן רֵכָב֙ אָבִ֔י/נוּ לְ/כֹ֖ל אֲשֶׁ֣ר צִוָּ֑/נוּ לְ/בִלְתִּ֤י שְׁתֽוֹת יַ֨יִן֙ כָּל יָמֵ֔י/נוּ אֲנַ֣חְנוּ נָשֵׁ֔י/נוּ בָּנֵ֖י/נוּ וּ/בְנֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/008.yaml
  text: 'So we have obeyed the voice of Jehonadab son of Rechab[a], our father, in everything that he commanded us: not to drink wine all our days—we, our wives, our sons[b], and our daughters.'
translation:
  language: ru
  text: 'И мы повиновались Иегонадаву[a], сыну Рехава, нашему отцу, во всём, что он повелел нам: не пить вина во все дни нашей жизни — ни нам, ни нашим жёнам, ни нашим сыновьям, ни нашим дочерям.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Иегонадав также передаётся как «Ионадав»; это сокращённая форма того же имени.
    reason: alternative_reading
lexical_decisions:
- source_word: וַנִּשְׁמַע בְּקוֹל
  choice: И мы слушались
  rationale: Сочетание שׁמע с בְּקוֹל означает не просто услышать голос, а внимать и повиноваться. Русское «слушались» естественно передаёт этот устойчивый смысл, не требуя буквального «слушали голос».
- source_word: יְהוֹנָדָב
  choice: Ионадав
  rationale: Традиционная и узнаваемая русская передача полного древнееврейского имени; начальный теофорный элемент в русской библейской ономастике обычно передаётся как «Ио-».
- source_word: בֶּן־רֵכָב
  choice: сына Рехава
  rationale: Стандартная передача родословной конструкции; имя רֵכָב транслитерировано как «Рехав».
- source_word: אָבִינוּ
  choice: нашего отца
  rationale: Сохранён библейский родовой язык оригинала. Здесь «отец» может обозначать предка, а не непосредственного родителя.
- source_word: לְכֹל אֲשֶׁר צִוָּנוּ
  choice: во всём, что он нам повелел
  rationale: Передаёт всеохватность לְכֹל и содержание повеления естественным современным русским синтаксисом.
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן
  choice: не пить вина
  rationale: Инфинитивная конструкция указывает на содержание повеления; родительный падеж «вина» после отрицания естественен для литературного русского языка.
- source_word: כָּל יָמֵינוּ
  choice: во все дни нашей жизни
  rationale: Передаёт пожизненный характер запрета яснее, чем буквальное, но менее естественное «во все наши дни».
- source_word: אֲנַחְנוּ נָשֵׁינוּ בָּנֵינוּ וּבְנֹתֵינוּ
  choice: ни нам, ни нашим жёнам, ни нашим сыновьям, ни нашим дочерям
  rationale: Повтор «ни» естественно связывает весь перечень с отрицательным повелением и сохраняет явное упоминание каждой группы домочадцев.
theological_decisions:
- issue: Значение אָבִינוּ применительно к Ионадаву
  choice: нашего отца
  alternative: нашего предка
  rationale: Оригинал использует родовой термин «отец», который в данном контексте включает смысл предка. Сохранение формы не устраняет эту библейскую родовую перспективу и не привносит дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан ясным для чтения вслух; идиома «слушаться» передаёт повиновение, а конструкция с повторным «ни» естественно охватывает весь перечисленный род.
