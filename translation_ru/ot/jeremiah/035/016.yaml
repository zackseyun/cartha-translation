id: JER.35.16
reference: Jeremiah 35:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י הֵקִ֗ימוּ בְּנֵי֙ יְהוֹנָדָ֣ב בֶּן רֵכָ֔ב אֶת מִצְוַ֥ת אֲבִי/הֶ֖ם אֲשֶׁ֣ר צִוָּ֑/ם וְ/הָ/עָ֣ם הַ/זֶּ֔ה לֹ֥א שָׁמְע֖וּ אֵלָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/016.yaml
  text: For the sons of Jehonadab son of Rechab have kept the command of their father that he commanded them[b][a], but this people have not listened to me.
translation:
  language: ru
  text: Ибо потомки[a] Ионадава, сына Рехава, исполнили повеление своего отца[b], которое он им дал, а этот народ Меня не послушал[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья»; здесь — члены рода, потомки.'
    reason: lexical_alternative
  - marker: b
    text: То есть своего предка; в еврейском тексте — «отца».
    reason: lexical_alternative
  - marker: c
    text: «Не послушал» здесь также имеет смысл «не повиновался».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего утверждения; «ибо» сохраняет пояснительно-причинную связь и соответствует достоинству пророческой речи.
- source_word: הֵקִימוּ
  choice: исполнили
  rationale: Форма Hiphil глагола קום в сочетании с מִצְוַת идиоматически означает соблюсти или исполнить повеление, то есть дать ему силу в своих поступках.
- source_word: בְּנֵי יְהוֹנָדָב בֶּן רֵכָב
  choice: потомки Ионадава, сына Рехава
  rationale: בְּנֵי буквально означает «сыновья», но в контексте рода рехавитов обозначает потомков; русский вариант «потомки» не создаёт ошибочного впечатления, будто речь идёт только о непосредственных сыновьях.
- source_word: מִצְוַת
  choice: повеление
  rationale: מִצְוָה означает обязательное предписание. «Повеление» ясно передаёт властный характер слов человеческого предка и не ограничивает термин религиозно-культовым употреблением слова «заповедь».
- source_word: אֲבִיהֶם
  choice: своего отца
  rationale: Еврейский текст буквально говорит «их отца». Возвратное «своего» естественно по-русски при соотнесении с подлежащим, а «отца» сохраняет прямую семейную лексику и риторический контраст.
- source_word: אֲשֶׁר צִוָּם
  choice: которое он им дал
  rationale: Относительное придаточное уточняет повеление. По-русски «дал повеление» естественно передаёт глагол צוה без тяжеловесного повтора «повелел повеление».
- source_word: וְהָעָם הַזֶּה
  choice: а этот народ
  rationale: וְ здесь выражает резкий контраст между послушанием рехавитов и непослушанием народа; «а» передаёт его естественно, сохраняя указательное и несколько отчуждённое «этот народ».
- source_word: לֹא שָׁמְעוּ אֵלָי
  choice: Меня не послушал
  rationale: שׁמע с אֶל буквально выражает слушание, подразумевающее повиновение. «Не послушал» сохраняет обе стороны значения; единственное число требуется русским согласованием с собирательным существительным «народ».
theological_decisions:
- issue: Родственная лексика применительно к рехавитам
  choice: потомки … своего отца
  alternative: сыновья … своего предка
  rationale: '«Потомки» передаёт реальный родовой охват בְּנֵי в данном контексте, тогда как «отца» сохраняет намеренную библейскую риторику: они исполнили слово человеческого отца, а народ не послушал Бога.'
- issue: Смысл שׁמע в отношении ответа народа Богу
  choice: Меня не послушал
  alternative: Мне не повиновался
  rationale: 'Перевод не сводит многозначность глагола только к повиновению: народ и не внял Божьим словам, и не подчинился им. Примечание делает подразумеваемый оттенок явным, не заменяя основной образ.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим тоном. Синтаксис остаётся ясным для широкого читателя; сохранены контраст, указательная дистанция выражения «этот народ» и смысловая связь между слушанием и повиновением. Местоимение «Меня», относящееся к Богу, написано с прописной буквы по принятой русской библейской издательской традиции.
