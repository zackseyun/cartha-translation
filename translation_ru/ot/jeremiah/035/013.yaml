base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/013.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: Go and say to the men of Judah and to the inhabitants of Jerusalem, ‘Will you not receive instruction by listening to my words? declares the LORD.’'
translation:
  language: ru
  text: 'Так говорит Господь Воинств, Бог Израиля: «Пойди и скажи людям Иудеи и жителям Иерусалима: „Неужели вы не примете наставления, чтобы внимать Моим словам? — возвещает Господь“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Господь Воинств
  rationale: Передаёт традиционное понимание божественного титула и сохраняет его военную образность; личное имя представлено принятой в русском библейском стиле заменой «Господь».
- source_word: לְאִישׁ יְהוּדָה
  choice: мужам Иудеи
  rationale: Коллективное употребление אִישׁ здесь обозначает людей/мужей Иудеи; «мужам» сохраняет достоинство и формальную окраску обращения.
- source_word: מוּסָר
  choice: наставления
  rationale: Слово может включать наставление, исправление и дисциплину; «наставление» естественно в данном призыве внять словам Господа, не исключая исправительного оттенка.
- source_word: לִשְׁמֹעַ אֶל דְּבָרַי
  choice: и не послушаете Моих слов
  rationale: שׁמע אל означает внимать и слушаться; русский глагол «послушаться» передаёт требуемый отклик, а сочинение с предшествующим глаголом естественно выражает тесно связанные действия.
- source_word: נְאֻם יְהוָה
  choice: возвещает Господь
  rationale: Устойчивая пророческая формула передана в настоящем времени и отличается от вводного «Так говорит», сохраняя функцию божественного подтверждения.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» соответствует устойчивой русской библейской традиции и аудированной консультационной версии; при этом текст не добавляет конфессионального толкования имени.
- issue: Связь «принять наставление» и «слушать слова»
  choice: 'Два тесно связанных призыва: «примете наставления и не послушаете»'
  alternative: 'Целевая/средственная связь: «примете наставление, слушая Мои слова»'
  rationale: Инфинитив לִשְׁמֹעַ допускает связь цели или пояснения, однако естественная еврейская конструкция также позволяет видеть требуемое послушание как содержание принятия наставления. Сочинительная передача сохраняет оба элемента без утверждения узкой причинно-средственной связи.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Вложенные кавычки ясно разграничивают слова Господа, поручение Иеремии и цитируемое обращение. Прописная буква в «Моих» соблюдает распространённую русскую издательскую традицию для речи Бога.
