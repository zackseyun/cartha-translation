base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/019.yaml
  text: 'Therefore thus says Yahweh of hosts[b][a], the God of Israel: Jonadab the son of Rechab shall never lack a man standing before me all the days.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве Воинств, Бог Израиля: «У Ионадава, сына Рехава, никогда не переведётся человек, стоящий предо Мной во все дни».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «не будет отсечён у Ионадава, сына Рехава, человек, стоящий предо Мной во все дни». Выражение «стоять предо Мной» может обозначать служение в присутствии Бога, но конкретная должность здесь не названа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод, следующий из предшествующего повествования.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Сохраняет традиционную пророческую формулу в ясном современном русском языке.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя Бога транслитерацией, а צְבָאוֹת — широким словом «Воинств», не ограничивающим смысл только земными армиями.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача сопряжённой конструкции.
- source_word: לֹא יִכָּרֵת אִישׁ לְיוֹנָדָב
  choice: у Ионадава никогда не переведётся тот
  rationale: Естественная русская идиома передаёт смысл непрекращающейся линии представителей; буквальный образ «не будет отсечён» дан в сноске.
- source_word: יוֹנָדָב בֶּן־רֵכָב
  choice: Ионадав, сын Рехава
  rationale: Устоявшаяся русская библейская передача имён.
- source_word: עֹמֵד לְפָנַי
  choice: кто стоит предо Мной
  rationale: Сохраняет причастное значение и намеренно не уточняет, идёт ли речь о священническом, храмовом или более широком служении.
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Формально близко передаёт еврейское выражение и не устраняет неоднозначность его временного охвата.
theological_decisions:
- issue: Смысл обещания о человеке, стоящем перед Богом
  choice: Сохранена широкая формулировка «кто стоит предо Мной», подразумевающая присутствие или служение перед Богом без указания должности.
  alternative: Истолковать как обещание вечного священнического или храмового служения либо только продолжения рода.
  rationale: Сам стих не называет конкретного установления или должности, поэтому перевод не должен сужать смысл.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. «Предо Мной» выбрано как умеренно возвышенное и естественное для прямой речи Бога; местоимение написано с прописной буквы по русской издательской традиции.
