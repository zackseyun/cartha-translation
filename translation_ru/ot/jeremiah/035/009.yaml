  text: וּ/לְ/בִלְתִּ֛י בְּנ֥וֹת בָּתִּ֖ים לְ/שִׁבְתֵּ֑/נוּ וְ/כֶ֧רֶם וְ/שָׂדֶ֛ה וָ/זֶ֖רַע לֹ֥א יִֽהְיֶה לָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/009.yaml
  text: and not to build houses for us to live in[a]; and vineyard and field and seed have not been ours.
translation:
  language: ru
  text: и не строить домов, чтобы жить в них; и виноградника, поля и семян у нас не будет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и виноградника, и поля, и семени не будет у нас».'
    reason: Сноска отражает порядок слов и конструкцию обладания в еврейском тексте; «семени» передаёт единственное число собирательного זֶרַע.
lexical_decisions:
- source_word: וּלְבִלְתִּי
  choice: и не
  rationale: Союз וּ продолжает перечень предписаний, а לְבִלְתִּי выражает отрицание зависимого инфинитива; в современном русском естественно «и не».
- source_word: בְּנוֹת בָּתִּים
  choice: строить домов
  rationale: Инфинитив בנה и множественное בָּתִּים прямо обозначают строительство домов. Родительный падеж после отрицания естественен для русского языка.
- source_word: לְשִׁבְתֵּנוּ
  choice: чтобы жить в них
  rationale: Инфинитив ישׁב с суффиксом первого лица множественного числа указывает на назначение домов. Формулировка ясна и сохраняет значение «для нашего проживания».
- source_word: וְכֶרֶם וְשָׂדֶה וָזֶרַע
  choice: ни виноградника, ни поля, ни семян
  rationale: Сохранены все три конкретных сельскохозяйственных понятия. Повторение «ни» естественно передаёт отрицательный перечень; собирательное זֶרַע передано русским «семян».
- source_word: לֹא יִהְיֶה לָּנוּ
  choice: чтобы у нас не было
  rationale: Еврейская конструкция «не будет у нас» выражает отсутствие владения или наличия. Русская конструкция «чтобы у нас не было» естественно связывает её с продолжающимся изложением заповеди и не усиливает значение до юридического «не принадлежало».
