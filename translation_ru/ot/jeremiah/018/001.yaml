lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: В пророческой формуле דָּבָר обозначает данное Богом слово или весть; «слово» сохраняет прямую связь с пророческой речью и естественно звучит в библейском русском.
- source_word: אֲשֶׁר
  choice: которое
  rationale: Относительное местоимение естественно вводит определительное придаточное в современном русском языке.
- source_word: הָיָה אֶל
  choice: было к
  rationale: Оборот сохраняет характерную древнееврейскую формулу получения откровения, не сводя её лишь к передаче обычного сообщения.
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Использована традиционная русская форма имени, укоренённая в литературном и библейском употреблении.
- source_word: מֵאֵת
  choice: от
  rationale: Предлог указывает на источник слова; «от» точно и естественно передаёт это значение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В данном контексте инфинитив вводит прямую речь следующего стиха; двоеточие естественно выполняет эту функцию по-русски без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога. «Яхве» передаёт имя напрямую и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и узнаваемой пророческой формулы. Конечное לֵאמֹר передано двоеточием, поскольку прямая речь начинается в следующем стихе.
