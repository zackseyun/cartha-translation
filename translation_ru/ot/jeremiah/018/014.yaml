  yaml_path: translation/ot/jeremiah/018/014.yaml
  text: Does the snow of Lebanon leave the rock of the open country? Or are cold[b][a], flowing foreign waters ever uprooted?
translation:
  language: ru
  text: Разве покидает снег Ливана утёс в открытой местности?[a] Разве бывают вырваны холодные, текущие чужие воды?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение неясно; возможно также: «скалу в поле», «утёс среди открытой местности» или сходное по смыслу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чужие воды». Это может означать воды, приходящие издалека или из иного источника. Глагол «бывают вырваны» передаёт необычный образ еврейского текста; возможны также «бывают оторваны» или «бывают вырваны с корнем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲזֹב
  choice: Разве ... исчезает
  rationale: Риторический вопрос передан частицей «разве». В природном образе עזב означает, что снег покидает место или пропадает; «исчезает» естественно по-русски и не придаёт снегу излишнего олицетворения.
- source_word: מִצּוּר שָׂדַי
  choice: с утёса в открытой местности
  rationale: צוּר — «скала, утёс», а трудная форма שָׂדַי связана с полем или открытой местностью. Перевод сохраняет конкретный горный образ, не отождествляя неясное выражение непосредственно с Ливаном.
- source_word: שֶׁלֶג לְבָנוֹן
  choice: снег Ливана
  rationale: Прямо передаёт сочетание существительных и сохраняет географический образ.
- source_word: אִם
  choice: Разве
  rationale: В поэтическом параллелизме вводит второй риторический вопрос, а не условие.
- source_word: יִנָּתְשׁוּ
  choice: иссякают
  rationale: Буквально форма глагола נטש может означать «быть вырванными/оторванными», но применительно к воде образ необычен. «Иссякают» естественно выражает прекращение постоянного потока; буквальная метафора отмечена в сноске.
- source_word: מַיִם זָרִים
  choice: текущие издалека воды
  rationale: זָרִים буквально «чужие, чужеземные»; в контексте источников, вероятно, указывает на воду, приходящую из дальнего или иного источника. Формулировка передаёт вероятный пространственный смысл без нравственного оттенка.
- source_word: קָרִים
  choice: холодные
  rationale: Прямое температурное значение соответствует образу горных вод.
- source_word: נוֹזְלִים
  choice: текущие
  rationale: Причастие обозначает воду в движении; «текущие» — естественное и достаточно широкое соответствие.
