  text: לָ/כֵן֩ תֵּ֨ן אֶת בְּנֵי/הֶ֜ם לָ/רָעָ֗ב וְ/הַגִּרֵ/ם֮ עַל יְדֵי חֶרֶב֒ וְ/תִֽהְיֶ֨נָה נְשֵׁי/הֶ֤ם שַׁכֻּלוֹת֙ וְ/אַלְמָנ֔וֹת וְ/אַ֨נְשֵׁי/הֶ֔ם יִֽהְי֖וּ הֲרֻ֣גֵי מָ֑וֶת בַּח֣וּרֵי/הֶ֔ם מֻכֵּי חֶ֖רֶב בַּ/מִּלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/021.yaml
  text: Therefore give their children over to famine[a], and hand them over to the power of the sword. Let their wives become bereaved and widowed, and let their men be slain by death[c][b], their young men struck down by the sword in battle.
translation:
  language: ru
  text: Поэтому отдай их детей[a] голоду и предай их во власть меча[b]. Пусть их жёны лишатся детей и овдовеют; пусть их мужчины погибнут насильственной смертью[c], а их юноши — будут поражены мечом в бою.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их сыновей». Еврейское слово может обозначать как сыновей, так и детей вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на руки меча». Это образное выражение означает предать их силе меча, то есть насильственной смерти.'
    reason: idiom_explanation
  - marker: c
    text: 'Буквально: «убитые смертью». Это трудное еврейское выражение подчёркивает смертельный, окончательный исход.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Сохраняет явную логическую связь этой просьбы с предшествующими словами пророка.
- source_word: תֵּן ... לָרָעָב
  choice: отдай ... голоду
  rationale: Передаёт образ вручения людей губительной силе голода и сохраняет прямую форму просьбы.
- source_word: בְּנֵיהֶם
  choice: их детей
  rationale: בנים может обозначать сыновей, но также употребляется собирательно о детях; более узкое прочтение отмечено в сноске.
- source_word: וְהַגִּרֵם ... עַל יְדֵי חֶרֶב
  choice: предай их во власть меча
  rationale: Передаёт смысл обречения на гибель от меча; выражение עַל יְדֵי буквально содержит образ «рук меча», который по-русски естественно передаётся как власть меча.
- source_word: שַׁכֻּלוֹת וְאַלְמָנוֹת
  choice: лишатся детей и овдовеют
  rationale: 'Ясно выражает обе утраты: смерть детей и смерть мужей; глагольная форма естественно передаёт желательный характер еврейского высказывания.'
- source_word: וְאַנְשֵׁיהֶם
  choice: их мужчины
  rationale: В параллели с жёнами и юношами речь идёт о взрослых мужчинах; «мужья» было бы неоправданным сужением.
- source_word: הֲרֻגֵי מָוֶת
  choice: будут сражены насмерть
  rationale: Сохраняет корень со значением убийства и подчёркивает окончательность гибели, не воспроизводя неестественно буквальное «убитые смертью».
- source_word: בַּחוּרֵיהֶם מֻכֵּי חֶרֶב בַּמִּלְחָמָה
  choice: их юноши — поражены мечом в бою
  rationale: Передаёт молодых мужчин боевого возраста, насильственную смерть от меча и непосредственный контекст сражения.
theological_decisions:
- issue: Просьба пророка к Богу о суде над врагами
  choice: Сохранить прямые повелительно-желательные формы и жестокую конкретику просьбы
  alternative: Передать сказанное как нейтральное предсказание или смягчить образы гибели
  rationale: В еврейском тексте звучат прямая просьба и пожелания. Перевод сохраняет нравственное и богословское напряжение текста, не превращая просьбу в предсказание и не смягчая её.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Параллелизм сохранён; архаизмы и эвфемистическое смягчение насилия не использованы.
