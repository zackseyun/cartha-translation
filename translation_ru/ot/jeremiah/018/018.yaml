source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ לְכ֨וּ וְ/נַחְשְׁבָ֣ה עַֽל יִרְמְיָהוּ֮ מַחֲשָׁבוֹת֒ כִּי֩ לֹא תֹאבַ֨ד תּוֹרָ֜ה מִ/כֹּהֵ֗ן וְ/עֵצָה֙ מֵֽ/חָכָ֔ם וְ/דָבָ֖ר מִ/נָּבִ֑יא לְכוּ֙ וְ/נַכֵּ֣/הוּ בַ/לָּשׁ֔וֹן וְ/אַל נַקְשִׁ֖יבָה אֶל כָּל דְּבָרָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/018.yaml
  text: Then they said[a], “Come, let us devise plans against Jeremiah, for instruction will not perish from the priest, nor counsel from the wise man, nor word from the prophet. Come, let us strike him with the tongue, and let us not pay attention to any of his words.”
translation:
  language: ru
  text: 'Тогда они сказали: «Давайте составим замыслы против Иеремии! Ведь наставление не исчезнет от священника, совет — от мудреца, а слово — от пророка. Давайте поразим его языком[a] и не будем слушать ни одного его слова».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нападём на него языком», то есть своими речами — например, посредством клеветы или обвинений.'
    reason: Лексико-образная неоднозначность выражения בַלָּשׁוֹן («языком»).
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Тогда они сказали
  rationale: Последовательная форма глагола продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: לְכוּ
  choice: Давайте
  rationale: В обоих случаях это побуждение к совместному действию; современное русское «давайте» естественно передаёт его функцию.
- source_word: וְנַחְשְׁבָה ... מַחֲשָׁבוֹת
  choice: замыслим зло
  rationale: Сочетание глагола и однокоренного существительного обозначает намеренное составление враждебного замысла. «Замыслим зло» передаёт недоброжелательность контекста без неестественного повтора.
- source_word: עַל יִרְמְיָהוּ
  choice: против Иеремии
  rationale: В контексте заговора предлог имеет направленное, враждебное значение.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание, которым заговорщики оправдывают своё решение.
- source_word: לֹא תֹאבַד
  choice: не исчезнет
  rationale: Глагол здесь означает прекращение или утрату источника руководства; «не исчезнет» ясно передаёт уверенность говорящих, что служение продолжится и без Иеремии.
- source_word: תּוֹרָה
  choice: наставление
  rationale: В данном параллелизме речь идёт о наставлении, исходящем от священника, а не только о кодифицированном Законе.
- source_word: מִכֹּהֵן
  choice: у священника
  rationale: Русская конструкция «наставление у священника» естественно выражает источник; единственное число имеет обобщающее значение.
- source_word: וְעֵצָה מֵחָכָם
  choice: совет у мудреца
  rationale: Сохраняется параллельная структура трёх традиционных источников руководства и мужское единственное число оригинала.
- source_word: וְדָבָר מִנָּבִיא
  choice: слово у пророка
  rationale: «Слово» сохраняет широту דָבָר и его особую связь с пророческим возвещением.
- source_word: וְנַכֵּהוּ בַלָּשׁוֹן
  choice: поразим его языком
  rationale: 'Буквальный образ понятен по-русски и сохраняет неоднозначность: это может означать словесное нападение, клевету или обвинение.'
- source_word: וְאַל נַקְשִׁיבָה אֶל כָּל דְּבָרָיו
  choice: и не будем слушать ни одного его слова
  rationale: В отрицательной конструкции כָּל естественно передаётся как «ни одного»; фраза выражает сознательный отказ внимать Иеремии.
theological_decisions:
- issue: Обобщающее мужское единственное число в חָכָם
  choice: у мудреца
  alternative: у мудрых
  rationale: 'Оригинал ставит рядом три обобщающие формы мужского рода в единственном числе: священник, мудрец и пророк. Перевод сохраняет эту социально-ролевую параллель.'
- issue: Характер словесного нападения
  choice: поразим его языком
  alternative: оклевещем его / обвиним его
  rationale: Еврейский образ допускает клевету, обвинение и иное словесное нападение. Основной текст не сужает смысл до одного конкретного действия; возможные значения пояснены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Реплика заговорщиков передана энергично и естественно; параллелизм «наставление — совет — слово» сохранён. Маркер сноски поставлен непосредственно после неоднозначного выражения.
