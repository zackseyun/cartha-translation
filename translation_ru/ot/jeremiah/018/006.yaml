base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/006.yaml
  text: Can I not do with you[a], house of Israel, as this potter does? declares Yahweh. Look, like clay in the hand of the potter, so are you in my hand, house of Israel.
translation:
  language: ru
  text: «Разве Я не могу поступить с вами[a], дом Израиля, так же, как этот горшечник? — возвещает Яхве. — Вот, как глина в руке горшечника, так и вы в Моей руке, дом Израиля».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделать с вами». Еврейское выражение имеет широкий смысл и не уточняет здесь характер действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכַיּוֹצֵר הַזֶּה לֹא אוּכַל לַעֲשׂוֹת לָכֶם
  choice: Разве Я не могу поступить с вами… как этот горшечник?
  rationale: Риторический вопрос передаёт способность и власть Яхве. «Поступить с вами» естественно по-русски и сохраняет широту עשה с ל, не уточняя заранее, будет ли действие благоприятным или карающим. Сравнение с горшечником передано без добавления отсутствующего в тексте объекта действия.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено коллективное заветное наименование и торжественный пророческий регистр.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: «Возвещает» передаёт устойчивую пророческую формулу נְאֻם, а «Яхве» сохраняет личное Божье имя יהוה.
- source_word: הִנֵּה
  choice: Вот
  rationale: Обычное современное русское средство привлечения внимания, сохраняющее указательно-эмфатическую функцию слова.
- source_word: כַחֹמֶר בְּיַד הַיּוֹצֵר
  choice: как глина в руке горшечника
  rationale: Прямо сохраняет образ материала, находящегося во власти и работе мастера; отсутствие артикля в русском позволяет естественно передать родовое значение «глина».
- source_word: כֵּן אַתֶּם בְּיָדִי
  choice: так и вы в Моей руке
  rationale: Конструкция «как… так и…» ясно передаёт соответствие, выраженное כֵּן, и сохраняет метафору руки.
theological_decisions:
- issue: Божественная власть в образе горшечника и глины
  choice: Образ сохранён прямо, без его сведения к конкретной системе предопределения.
  alternative: Истолковать образ как утверждение абсолютного детерминизма либо смягчить его до одной лишь заботы и созидания.
  rationale: Стих утверждает власть Яхве поступать с Израилем подобно горшечнику с глиной, но сам по себе не разрешает более широкие богословские споры.
- issue: Характер действия, выраженного לַעֲשׂוֹת לָכֶם
  choice: «поступить с вами»
  alternative: «сделать вам» или «сделать с вами»
  rationale: Выбранная формулировка сохраняет неопределённость относительно благого или карающего характера действия и при этом звучит естественно в современном русском языке.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Обращение «дом Израиля» и повтор в конце сохранены. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому регистру.
