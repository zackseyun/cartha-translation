base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/010.yaml
  text: but if it does what is evil in my sight[a], not listening to my voice[b], then I will relent concerning the good that I said I would do to it.
translation:
  language: ru
  text: Но если он будет делать зло в Моих глазах, не слушаясь Моего голоса, то Я откажусь[a] от блага, которое, как Я сказал, Я окажу ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «передумаю относительно блага». Еврейский глагол может обозначать отказ от ранее объявленного намерения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה הָרָעָה בְּעֵינַי
  choice: но если он станет делать зло в Моих глазах
  rationale: Союз וְ в связи с условным построением предыдущего стиха естественно передан как «но если». Мужской род местоимения сохраняет согласование с «народом» или «царством» из контекста; идиома בְּעֵינַי передана близким русским выражением.
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹלִי
  choice: не слушаясь Моего голоса
  rationale: Оборот обозначает отказ внимать и повиноваться; деепричастная конструкция естественна по-русски и сохраняет образ слушания голоса.
- source_word: וְנִחַמְתִּי עַל הַטּוֹבָה
  choice: то Я отменю то благо
  rationale: נחם здесь означает отказ от объявленного действия или изменение намеченного курса. «Отменю» ясно выражает отмену обещанного благодеяния, не приписывая Богу нравственного раскаяния.
- source_word: אֲשֶׁר אָמַרְתִּי לְהֵיטִיב אוֹתוֹ
  choice: которое обещал ему сделать
  rationale: אמרתי в данном контексте относится к ранее объявленному намерению и естественно передаётся как «обещал»; לְהֵיטִיב אוֹתוֹ буквально означает «сделать ему добро».
theological_decisions:
- issue: Передача применённого к Богу глагола נחם
  choice: Я отменю
  alternative: Я передумаю / Я откажусь от
  rationale: Формулировка сохраняет реальную обусловленность объявленного блага поведением народа, но не создаёт современного смысла покаяния в нравственном проступке.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским регистром. Заглавные буквы в местоимениях, относящихся к Богу, следуют принятой русской издательской традиции.
