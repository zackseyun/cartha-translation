  text: «Встань и спустись в дом горшечника; там Я дам тебе услышать Мои слова».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Встань и спустись в дом горшечника, и там Я сделаю так, что ты услышишь Мои слова».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּם
  choice: Встань
  rationale: Императив קום передан естественным русским повелением, сохраняющим тон пророческого призыва.
- source_word: וְ/יָרַדְתָּ֖
  choice: и спустись
  rationale: Глагол ירד обозначает движение вниз; «спустись» сохраняет направление и уместен с учётом рельефа Иерусалима.
- source_word: בֵּ֣ית הַ/יּוֹצֵ֑ר
  choice: в дом горшечника
  rationale: Конструкция буквально означает «дом горшечника»; контекст работы с глиной подтверждает ремесленное значение יוֹצֵר.
- source_word: וְ/שָׁ֖מָּ/ה
  choice: там
  rationale: Наречие места сохраняет акцент на том, что откровение будет дано именно в указанном месте; союз по-русски можно естественно не воспроизводить после точки с запятой.
- source_word: אַשְׁמִֽיעֲ/ךָ֥
  choice: Я дам тебе услышать
  rationale: Каузативная форма глагола שמע буквально выражает «сделаю так, что ты услышишь»; выбранный оборот сохраняет каузативность без неестественного «заставлю услышать».
- source_word: אֶת דְּבָרָֽ/י
  choice: Мои слова
  rationale: Сохранено множественное число древнееврейского דְּבָרַי без сведения его к более толковательному «Моему посланию».
