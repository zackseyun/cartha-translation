base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/013.yaml
  text: 'Therefore thus says Yahweh: Ask now among the nations[b][a], who has heard such things? Virgin Israel has done a very horrible thing.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве: «Спросите же среди народов: кто слышал о подобном? Дева Израиль совершила нечто поистине ужасное!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод, следующий из предшествующего обличения.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет традиционную пророческую формулу и передаёт личное имя יהוה как «Яхве».
- source_word: שַׁאֲלוּ נָא בַּגּוֹיִם
  choice: Спросите же среди народов
  rationale: Множественное повелительное наклонение сохранено; частица «же» естественно передаёт побудительно-настойчивую силу נָא, а «среди народов» соответствует בַּגּוֹיִם.
- source_word: מִי שָׁמַע כָּאֵלֶּה
  choice: кто слышал о подобном?
  rationale: Естественный русский риторический вопрос, сохраняющий сравнительное значение כָּאֵלֶּה и мысль о неслыханности случившегося.
- source_word: שַׁעֲרֻרִת עָשְׂתָה מְאֹד
  choice: Поистине ужасное дело совершила
  rationale: Редкое существительное обозначает нечто ужасающее или возмутительное; «поистине» передаёт усиление מְאֹד, не создавая неестественного сочетания «очень ужасное дело».
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: дева Израиль
  rationale: Сохраняет женскую персонификацию народа и не добавляет отсутствующего в еврейском тексте слова «дочь».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Персонификация Израиля как девы
  choice: дева Израиль
  alternative: девственный Израиль
  rationale: Женский образ важен для пророческой риторики; вариант «девственный Израиль» ослабил бы персонификацию и изменил грамматический образ.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия в последнем предложении подчёркивает чудовищность поступка, оставаясь понятной современному читателю.
