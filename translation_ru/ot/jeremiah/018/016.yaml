revisions:
- from: чтобы превратить их землю в пустыню, навеки сделать её предметом насмешливого свиста[a]. Каждый, кто проходит мимо неё, ужаснётся и покачает головой[b].
  to: чтобы превратить их землю в опустошение, в вечный предмет свиста[a]. Всякий, кто проходит мимо неё, ужаснётся и покачает головой[b].
  rationale: Перестроена первая часть стиха, чтобы оба результата зависели от одного инфинитива, как в еврейском тексте. «Пустыня» заменена на «опустошение», а «навеки» заменено определением «вечный» при «свисте». Сноска уточнена так, чтобы сохранить лексическую и образную неоднозначность, не утверждая исключительно насмешливый смысл.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:15:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: земля становится объектом опустошения и длительной реакции прохожих; их потрясение и покачивание головой сохранены. Однако в русском тексте добавлен второй инфинитив «сделать её», хотя в еврейском после לָשׂוּם следует ряд именных результатов: «сделать их землю опустошением, предметом вечного свиста». Кроме того, «пустыня» может означать природную пустыню, тогда как שַׁמָּה означает именно опустошение/разорение.'
  naturalness: Фраза «навеки сделать её предметом насмешливого свиста» тяжеловесна и синтаксически разрывает параллельные результаты действия. «Вечным предметом свиста» естественнее; слово «насмешливого» лучше оставить в пояснительной сноске, поскольку оттенок реакции выводится из образа и контекста, а не прямо выражен отдельным прилагательным.
  terminology: «Опустошение» точно передаёт пророческое שַׁמָּה без значения географической пустыни. «Предмет вечного свиста» сохраняет образ שרוקת עוֹלָם и не превращает его в отвлечённое «посмешище». «Ужаснётся» и «покачает головой» приемлемо передают реакцию и жест, не сужая его до одного значения.
  issues:
