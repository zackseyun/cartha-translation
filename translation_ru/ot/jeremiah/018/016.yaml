lexical_decisions:
- source_word: לָשׂוּם
  choice: чтобы превратить
  rationale: Инфинитив с ל выражает цель или результат в продолжение мысли предыдущего стиха; такая формулировка естественно передаёт синтаксическую зависимость.
- source_word: אַרְצָם
  choice: их землю
  rationale: אֶרֶץ обозначает принадлежащую народу землю; прямой эквивалент сохраняет пророческую лексику суда.
- source_word: לְשַׁמָּה
  choice: в пустыню
  rationale: שַׁמָּה здесь означает опустошённое, разорённое место. Русское «превратить землю в пустыню» естественно и ясно передаёт результат разорения.
- source_word: שרוקת עוֹלָם
  choice: навеки сделать её предметом насмешливого свиста
  rationale: Существительное связано с שרק и обозначает свист как реакцию на разорение, вероятно насмешливую либо выражающую изумление. «Навеки» передаёт длительность עוֹלָם без обязательного метафизического оттенка.
- source_word: כֹּל עוֹבֵר עָלֶיהָ
  choice: каждый, кто проходит мимо неё
  rationale: Речь идёт о прохожих, видящих разорённую землю; местоимение женского рода естественно соотносится с русским словом «земля».
- source_word: יִשֹּׁם
  choice: ужаснётся
  rationale: Форма от שמם описывает потрясение или оцепенение при виде разорения. «Ужаснётся» соответствует контексту суда и не сводит реакцию лишь к удивлению.
- source_word: וְיָנִיד בְּרֹאשׁוֹ
  choice: и покачает головой
  rationale: Русский жестовый оборот естественно передаёт идиому נוד בראש, допускающую скорбь, изумление, неодобрение или презрение.
