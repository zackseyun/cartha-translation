  text: רֶ֣גַע אֲדַבֵּ֔ר עַל גּ֖וֹי וְ/עַל מַמְלָכָ֑ה לִ/נְת֥וֹשׁ וְ/לִ/נְת֖וֹץ וּֽ/לְ/הַאֲבִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/007.yaml
  text: At one moment I may speak concerning a nation and concerning a kingdom[a], to uproot and to tear down and to destroy.
translation:
  language: ru
  text: 'В какой-то момент Я могу сказать о народе и о царстве: искоренить, разрушить и уничтожить.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֶגַע
  choice: Иногда
  rationale: 'В сочетании с несовершенным видом глагола и в парной условной формулировке ст. 7–10 слово обозначает отдельный случай во времени: «иногда / в какой-то момент». «Иногда» естественно передаёт общий, повторяемый принцип, не создавая ошибочного смысла внезапности.'
- source_word: אֲדַבֵּר
  choice: Я говорю
  rationale: Имперфект 1-го лица в данном обобщающем контексте выражает возможное в определённых обстоятельствах действие. Русское настоящее время вместе с «иногда» естественно сохраняет этот ситуационный смысл; форма «могу сказать» могла бы ошибочно подчеркнуть способность, а не условность случая.
- source_word: עַל
  choice: о
  rationale: При דבר предлог может вводить тему высказывания — «о, относительно», — хотя последующие глаголы суда допускают и более направленное «против». Основной текст сохраняет более широкое значение, а альтернативное отражено в сноске.
- source_word: גּוֹי
  choice: народ
  rationale: В пророческом политическом контексте גּוֹי обозначает народ как национальное сообщество. «Народ» — естественный и обычный русский эквивалент; политический смысл дополнительно ясен из пары с «царством».
- source_word: מַמְלָכָה
  choice: царство
  rationale: Слово обозначает царство или государственное владение; «царство» точно сохраняет политический смысл и естественно сочетается с «народом».
- source_word: לִנְתוֹשׁ
  choice: искореню
  rationale: Глагол передаёт образ вырывания растения с корнем. «Искореню» сохраняет метафору и хорошо вписывается в обращённую к народу угрозу.
- source_word: לִנְתוֹץ
  choice: разрушу
  rationale: Глагол означает снести или разрушить, особенно сооружение. «Разрушу» — ясный современный эквивалент, сохраняющий образ уничтожения построенного.
- source_word: וּלְהַאֲבִיד
  choice: погублю
  rationale: Каузатив от אבד означает заставить погибнуть, уничтожить. «Погублю» точно передаёт каузативный смысл и образует естественную кульминацию после «искореню, разрушу».
theological_decisions:
- issue: Сила формулы Божьей речи в условном контексте суда
  choice: «Иногда Я говорю… что искореню…»
  alternative: «В какой-то момент Я могу сказать… искоренить…»
  rationale: Стихи 7–10 формулируют общий принцип Божьих объявленных действий в отношении народов. Настоящее время с наречием «иногда» сохраняет повторяемый, ситуативный характер высказывания, не превращая его ни в единичное прошлое событие, ни в отвлечённое утверждение о способности Бога говорить.
- issue: Направленность предлога עַל
  choice: «о каком-либо народе или царстве»
  alternative: «против какого-либо народа или царства»
  rationale: При глаголе «говорить» предлог способен обозначать тему речи, тогда как инфинитивы суда уже ясно выражают враждебное содержание. Более узкое направленное прочтение остаётся возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Необычная для русского языка цепочка еврейских инфинитивов преобразована в придаточное изъяснительное с личными глаголами будущего времени; местоимение «его» добавлено для ясного указания объекта. «Какой-либо» передаёт обобщённый характер единственного числа «народ / царство».
