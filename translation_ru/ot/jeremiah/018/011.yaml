source:
  edition: WLC
  text: וְ/עַתָּ֡ה אֱמָר נָ֣א אֶל אִישׁ יְהוּדָה֩ וְ/עַל יוֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤ר עֲלֵי/כֶם֙ רָעָ֔ה וְ/חֹשֵׁ֥ב עֲלֵי/כֶ֖ם מַֽחֲשָׁבָ֑ה שׁ֣וּבוּ נָ֗א אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וְ/הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַעַלְלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/011.yaml
  text: 'Now therefore[a], say to the men of Judah and to the inhabitants of Jerusalem, saying, ‘Thus says Yahweh: Behold, I am shaping disaster against you and devising a plan against you. Turn back, please, each man from his evil way[c][b], and make your ways and your deeds good.’'
translation:
  language: ru
  text: '«А теперь скажи людям Иудеи и жителям Иерусалима: „Так говорит Яхве: вот, Я готовлю[a] вам бедствие и замышляю против вас замысел. Прошу, пусть каждый из вас отвернётся[b] от своего злого пути[c] и исправьте свои пути и поступки“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Глагол можно передать как «формирую» или «леплю»: он перекликается с образом горшечника в предшествующем отрывке.'
    reason: lexical_alternative
  - marker: b
    text: 'Также: «вернитесь» или «покайтесь». Здесь буквально выражен поворот назад, прочь от дурного пути.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «каждый — от своего злого пути». Единственное число имеет распределительный смысл: призыв обращён к каждому члену сообщества.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт переход от образа горшечника к его применению; в русском контексте следственный оттенок понятен без тяжеловесного «итак, теперь».
- source_word: אֱמָר נָא
  choice: скажи
  rationale: Повеление Иеремии передано прямо; частица נָא естественнее отражена словом «прошу» в призыве Бога к обращению.
- source_word: אֶל אִישׁ יְהוּדָה
  choice: людям Иудеи
  rationale: Единственное אִישׁ здесь имеет собирательное значение. Современное «людям Иудеи» понятно и не создаёт ложного впечатления, будто речь идёт об одном человеке.
- source_word: וְעַל יוֹשְׁבֵי יְרוּשָׁלַם
  choice: и жителям Иерусалима
  rationale: При глаголе речи предлог указывает адресатов; дательный падеж естественен по-русски.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена торжественная пророческая формула и личное имя יהוה передано транслитерацией.
- source_word: הִנֵּה אָנֹכִי
  choice: вот, Я
  rationale: «Вот» вводит торжественное божественное заявление, не добавляя лишнего толкования.
- source_word: יוֹצֵר עֲלֵיכֶם רָעָה
  choice: готовлю вам бедствие
  rationale: «Готовлю» естественно сочетается с «бедствием»; сноска сохраняет связь глагола יוֹצֵר с образом горшечника в ближайшем контексте.
- source_word: וְחֹשֵׁב עֲלֵיכֶם מַחֲשָׁבָה
  choice: и замышляю против вас замысел
  rationale: Корневой повтор «замышляю… замысел» передаёт выразительность еврейской конструкции и намеренный характер грядущего суда.
- source_word: שׁוּבוּ נָא
  choice: Прошу, обратитесь
  rationale: «Обратитесь» сохраняет метафору поворота и допускает как возвращение, так и покаяние; «прошу» передаёт увещевательную частицу נָא.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: каждый отвернитесь от своего злого пути
  rationale: «Каждый» передаёт распределительное единственное число, а «злой путь» сохраняет пророческую метафору образа жизни.
- source_word: וְהֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: и исправьте свои пути и поступки
  rationale: «Исправьте» естественно передаёт призыв сделать поведение добрым; различие между «путями» и «поступками» сохранено.
theological_decisions:
- issue: Значение רָעָה как результата действия Яхве
  choice: бедствие
  alternative: зло; несчастье
  rationale: В данном контексте слово обозначает грядущее наказание или бедствие, а не нравственное зло со стороны Бога.
- issue: Смысл שׁוב в призыве
  choice: обратитесь / отвернитесь
  alternative: вернитесь; покайтесь
  rationale: Формулировка сохраняет пространственную метафору поворота и не сводит её заранее к одному богословскому термину.
- issue: Собирательное и распределительное употребление אִישׁ
  choice: людям Иудеи … каждый
  alternative: мужам Иудеи … каждый мужчина
  rationale: Первое употребление собирательно, второе распределяет призыв между отдельными членами сообщества. Русская передача сохраняет это различие без неоправданного ограничения адресатов только взрослыми мужчинами.
translation_notes:
  register: Современный литературный русский с сохранением достоинства пророческой речи. Устранены неестественные кальки там, где они мешали бы пониманию, но сохранены ключевые образы «пути», обращения и намеренно выразительный корневой повтор «замышляю… замысел».
