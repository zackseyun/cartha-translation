source:
  edition: WLC
  text: וְ/אָמְר֖וּ נוֹאָ֑שׁ כִּֽי אַחֲרֵ֤י מַחְשְׁבוֹתֵ֨י/נוּ֙ נֵלֵ֔ךְ וְ/אִ֛ישׁ שְׁרִר֥וּת לִבּֽ/וֹ הָ/רָ֖ע נַעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/012.yaml
  text: But they will say[a], ‘It is hopeless, for we will follow our own plans, and each of us will act according to the stubbornness of his evil heart.’
translation:
  language: ru
  text: 'Но они скажут[a]: «Нет надежды! Мы будем следовать своим замыслам, и каждый из нас будет поступать по упрямству своего злого сердца».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё напрасно» или «Надежды нет». Еврейское выражение может передавать как отчаяние, так и пренебрежительное утверждение, что призыв пророка бесполезен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹאָשׁ
  choice: Нет надежды
  rationale: Кратко и естественно передаёт значение отчаяния; в данном контексте выражение может также звучать как отмахивание от призыва пророка как бесполезного, поэтому этот оттенок сохранён в сноске.
- source_word: אַחֲרֵי מַחְשְׁבוֹתֵינוּ נֵלֵךְ
  choice: мы будем следовать своим замыслам
  rationale: Идиома «идти вслед за» означает следовать чему-либо, а מַחְשְׁבוֹת здесь обозначает собственные намерения или планы. «Замыслы» сохраняет смысл сознательно избранного направления, не добавляя обязательного оттенка коварства.
- source_word: וְאִישׁ
  choice: и каждый из нас
  rationale: Передаёт дистрибутивное употребление единственного числа — каждый человек из говорящей общности — естественным современным русским языком.
- source_word: שְׁרִרוּת
  choice: упрямство
  rationale: Слово обозначает упорное своеволие и непокорность; «упрямство» ясно передаёт нравственную силу выражения и соответствует повторяющейся формуле у Иеремии.
- source_word: לִבּוֹ הָרָע
  choice: своего злого сердца
  rationale: «Сердце» сохраняет библейское обозначение внутреннего центра воли и мысли, а «злое» прямо передаёт нравственную оценку הָרָע.
- source_word: נַעֲשֶׂה
  choice: будет поступать
  rationale: В сочетании с указанием на упрямство сердца глагол עשה естественно обозначает образ действий; «будет поступать» звучит по-русски яснее, чем буквальное «будет делать».
theological_decisions:
- issue: Передать ответ народа как отчаяние или как пренебрежительное отклонение призыва
  choice: Нет надежды
  alternative: Всё напрасно; Надежды нет
  rationale: Еврейское выражение допускает как смысл безнадёжности, так и признание призыва пророка бесполезным. Основной текст сохраняет резкость отказа, а сноска не позволяет устранить подлинную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис ясен для широкого читателя; образ сердца и нравственная напряжённость исходного текста сохранены без конфессионального истолкования.
