base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/023.yaml
  text: But you[a], O Yahweh, know all their counsel against me for death. Do not cover over their iniquity, and do not blot out their sin from before you. Let them be made to stumble before you; in the time of your anger[c][b], act against them.
translation:
  language: ru
  text: Но Ты, Господи, знаешь все их замыслы против меня — они хотят предать меня смерти.[a] Не покрой их вину[b] и не изгладь их грех из Твоего присутствия. Пусть они будут приведены к падению пред Тобою;[c] во время гнева Твоего поступи с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «против меня на смерть»; возможно также: «чтобы убить меня» или «ради моей смерти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не прости их беззакония». Глагол может означать покрытие вины, совершение очищения или прощение.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально также возможно: «пусть они споткнутся (или падут) пред Тобою». Еврейская форма может подразумевать, что их приведут к падению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: Традиционная и понятная русская передача тетраграмматона в прямом обращении; форма звательного обращения естественно выражается русским «Господи».
- source_word: עֲצָתָם
  choice: все их замыслы
  rationale: В контексте враждебного заговора עֵצָה означает не просто совет, а намерение или замысел; русский вариант сохраняет множественное обобщение с כָּל.
- source_word: עָלַי לַמָּוֶת
  choice: против меня — они хотят предать меня смерти
  rationale: Компактная еврейская фраза буквально связывает направленность против пророка со смертью. Развёрнутая русская формулировка ясно передаёт цель заговора, не уточняя способ убийства.
- source_word: תְּכַפֵּר עַל עֲוֺנָם
  choice: не покрой их вины
  rationale: Сохранён образный смысл כפר «покрывать/совершать очищение», а не только более истолковывающее «не прости»; עָוֺן здесь может обозначать как беззаконие, так и вину.
- source_word: וְחַטָּאתָם מִלְּפָנֶיךָ אַל תֶּמְחִי
  choice: не изгладь их греха пред лицом Твоим
  rationale: «Изгладить» сохраняет метафору מחה — стереть, удалить; «пред лицом Твоим» передаёт пространственно-судебный оборот מִלְּפָנֶיךָ.
- source_word: וְהָיוּ מֻכְשָׁלִים לְפָנֶיךָ
  choice: пусть они будут повержены пред Тобою
  rationale: Форма Hophal выражает состояние или действие, которому подвергаются враги. «Будут повержены» естественно по-русски сохраняет пассивность и идею падения, хотя буквально корень означает «спотыкаться/падать».
- source_word: בְּעֵת אַפְּךָ
  choice: во время гнева Твоего
  rationale: אַף в данном устойчивом употреблении означает гнев; временной оборот передан прямо.
- source_word: עֲשֵׂה בָהֶם
  choice: поступи с ними по заслугам
  rationale: 'Еврейское выражение предельно кратко: «сделай с ними». Контекст требует враждебно-судебного смысла; «по заслугам» делает его естественным по-русски, не определяя конкретной кары.'
theological_decisions:
- issue: Сила молитвы о суде над врагами
  choice: Сохранены прямые просьбы не покрывать вину, не изглаживать грех и поступить с врагами во гневе.
  alternative: Смягчить текст до описания будущего суда или заменить просьбы общим упованием на справедливость.
  rationale: Отрицательные повелительные формы и заключительный императив делают этот стих суровой молитвой о воздаянии. Богословское напряжение исходного текста не следует устранять.
- issue: Значение כפר применительно к вине
  choice: «не покрой их вины»
  alternative: «не прости их беззакония» или «не искупи их вины»
  rationale: Основной текст сохраняет конкретную метафору покрытия и не сводит многозначный культово-богословский глагол исключительно к прощению; более привычное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Формы «пред лицом Твоим», «изгладь» и прописные местоимения обращения к Богу поддерживают достоинство текста; синтаксис остаётся понятным современному читателю.
