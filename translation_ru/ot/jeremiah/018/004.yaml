  text: And the vessel that he was making from the clay was spoiled in the potter’s hand[a], and he turned and made it into another vessel[b], as seemed right in the potter’s eyes to make.
translation:
  language: ru
  text: И сосуд, который он лепил из глины, испортился в руках горшечника[a]. И он снова сделал из него другой сосуд — такой, какой горшечник счёл подходящим сделать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оказался испорченным», «был повреждён». Еврейский глагол указывает, что сосуд стал негодным или дефектным во время работы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как было правильно в глазах горшечника сделать», то есть какой сосуд горшечник счёл подходящим сделать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁחַת
  choice: испортился
  rationale: Нифаль глагола שׁחת здесь описывает сосуд, ставший негодным или дефектным в процессе работы. «Испортился» сохраняет результативный смысл, не уточняя причину сверх текста.
- source_word: הַכְּלִי
  choice: сосуд
  rationale: В контексте гончарной работы כְּלִי естественно означает изготовляемый сосуд.
- source_word: אֲשֶׁר הוּא עֹשֶׂה בַּחֹמֶר
  choice: который он лепил из глины
  rationale: Причастие передаёт незавершённый процесс; «лепил» естественно для ручного формирования глиняного сосуда, а «из глины» ясно обозначает материал.
- source_word: בְּיַד הַיּוֹצֵר
  choice: в руках горшечника
  rationale: Русское множественное «в руках» естественно передаёт еврейский образ непосредственной работы и контроля мастера.
- source_word: וְשָׁב וַיַּעֲשֵׂהוּ
  choice: Тогда он снова сделал из него
  rationale: שׁוּב при следующем глаголе обозначает повторное действие; местоименный суффикс указывает на тот же материал или испорченный сосуд, которому придаётся новая форма.
- source_word: כְּלִי אַחֵר
  choice: другой сосуд
  rationale: Передаёт изменение формы или назначения без утверждения, что был взят новый материал.
- source_word: כַּאֲשֶׁר יָשַׁר בְּעֵינֵי הַיּוֹצֵר לַעֲשׂוֹת
  choice: такой, какой горшечник счёл нужным сделать
  rationale: Естественно передаёт идиому «как было правильно в глазах горшечника сделать», сохраняя его оценку и свободу решения.
theological_decisions:
- issue: Образ горшечника и возможный богословский смысл
  choice: Сохранить конкретную сцену в мастерской, не добавляя в стих явного толкования образа.
  alternative: Передать стих как прямое утверждение о Божьей власти изменять судьбу людей или народов.
  rationale: В данном стихе описана наглядная сцена; её богословское применение раскрывается далее в контексте. Экспликация здесь преждевременно сняла бы образность и напряжение текста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Лепил» конкретизирует ремесленное действие естественным для русского языка образом; «в руках» избегает неестественного буквального единственного числа. Оба маркера сносок присутствуют в основном тексте.
