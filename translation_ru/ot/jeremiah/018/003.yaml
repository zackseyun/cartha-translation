lexical_decisions:
- source_word: וָאֵרֵד
  choice: И я спустился
  rationale: Форма wayyiqtol продолжает повествование, а глагол «спустился» сохраняет пространственное значение ירד.
- source_word: בֵּית הַיּוֹצֵר
  choice: в дом горшечника
  rationale: Естественно передаёт конструкцию «дом горшечника»; יוצר в данном контексте обозначает мастера, формующего глину.
- source_word: וְהִנֵּהוּ
  choice: И вот, он
  rationale: «И вот» сохраняет функцию הִנֵּה, привлекающего внимание к увиденному, а местоимение указывает на горшечника.
- source_word: עֹשֶׂה מְלָאכָה
  choice: работал
  rationale: Естественно передаёт сочетание причастия с существительным — букв. «делал работу», не уточняя, какое именно изделие он изготовлял.
- source_word: עַל הָאָבְנָיִם
  choice: за гончарным кругом
  rationale: В современном русском так естественно называется работа на гончарном устройстве. Двойственное число еврейского слова и более буквальный образ отмечены в сноске.
