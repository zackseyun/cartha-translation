  yaml_path: translation/ot/jeremiah/018/017.yaml
  text: Like an east wind I will scatter them before the enemy[a]; I will show them the back and not the face in the day of their disaster.
translation:
  language: ru
  text: Как восточный ветер, Я рассею их перед врагом; спину, а не лицо, Я покажу им в день их бедствия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я повернусь к ним спиной, а не лицом». Еврейский образ говорит об отказе Господа обратить к ним лицо в день их бедствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּחַ קָדִים
  choice: Словно восточный ветер
  rationale: Сравнительная частица כְּ передаёт значение «словно/как», רוּחַ — «ветер», а קָדִים — разрушительный восточный ветер. Формулировка сохраняет образ, не добавляя отсутствующего в тексте определения «палящий».
- source_word: אֲפִיצֵם
  choice: Я развею их
  rationale: Хифиль глагола פוץ означает «рассеять, разогнать». «Развею» естественно сочетается с образом ветра и сохраняет причинно-активный смысл формы.
- source_word: לִפְנֵי אוֹיֵב
  choice: перед врагом
  rationale: Буквально «перед врагом»; выражение описывает рассеяние народа перед наступающим противником и не требует добавления неопределённости.
- source_word: עֹרֶף וְלֹא פָנִים
  choice: спину, а не лицо
  rationale: עֹרֶף буквально обозначает затылок или обращённую к кому-либо спину и противопоставлено פָנִים, «лицу». Русская формулировка сохраняет конкретный антропоморфный образ; притяжательное «Свою» не добавлено, поскольку в еврейском его нет.
- source_word: אֶרְאֵם
  choice: Я покажу им
  rationale: Форма от ראה допускает здесь понимание «дам им увидеть, покажу им», причём предшествующие «спину, а не лицо» выступают дополнением. Это лучше всего передаёт идиому в данном контексте.
- source_word: בְּיוֹם אֵידָם
  choice: в день их бедствия
  rationale: אֵיד означает бедствие, несчастье, гибельную пору. «В день их бедствия» близко передаёт форму и сохраняет торжественную пророческую речь.
theological_decisions:
- issue: Антропоморфный образ Божьего отвержения
  choice: 'Сохранить буквально: «спину, а не лицо, Я покажу им»'
  alternative: 'Передать отвлечённо: «Я отвернусь от них» или «лишу их благоволения»'
  rationale: Еврейский текст выражает суд через телесный образ удаления Божьего лица. Буквальная передача сохраняет богословскую напряжённость и не сводит метафору к одному истолкованию.
- issue: Неявное притяжательное значение при «спине» и «лице»
  choice: Не добавлять «Свою/Своё» в основной текст
  alternative: «Я покажу им Свою спину, а не Своё лицо»
  rationale: Контекст ясно указывает на говорящего, но явные притяжательные суффиксы в еврейском отсутствуют. Выбранная конструкция остаётся понятной по-русски и точнее отражает формальную неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Образ восточного ветра и противопоставление спины лицу сохранены без поясняющей парафразы; местоимение «Я» написано с прописной буквы как реплика Господа.
