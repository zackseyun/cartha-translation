  text: הַקְשִׁ֥יבָ/ה יְהוָ֖ה אֵלָ֑/י וּ/שְׁמַ֖ע לְ/ק֥וֹל יְרִיבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/019.yaml
  text: Pay attention to me[a], O Yahweh, and hear the voice of my adversaries.
translation:
  language: ru
  text: Обрати на меня внимание, Яхве, и услышь голос моих противников.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «услышь голос моих противников» может означать как «выслушай их обвинения против Иеремии», так и «обрати внимание на их враждебные замыслы».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Внемли
  rationale: Побудительная форма глагола קשׁב выражает просьбу внимательно выслушать и принять к сведению. «Внемли» передаёт настойчивость молитвы и сохраняет возвышенный, но понятный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: אֵלָי
  choice: мне
  rationale: 'Предлог אֶל с суффиксом первого лица буквально указывает направление — «ко мне»; при русском глаголе «внимать» естественно употребляется дательный падеж: «мне».'
- source_word: וּשְׁמַע
  choice: и услышь
  rationale: Императив שׁמע означает «услышь» или «выслушай». «Услышь» сохраняет параллелизм с первым повелением, не повторяя тот же русский глагол.
- source_word: לְקוֹל
  choice: голос
  rationale: קוֹל буквально означает «голос» или «звук». Конкретный образ «голос» сохранён без сведения смысла только к обвинениям или словам.
- source_word: יְרִיבָי
  choice: моих противников
  rationale: Причастная форма от ריב обозначает тех, кто спорит, тяжется или враждует с говорящим. «Противники» сохраняет широкий смысл и не ограничивает его юридическими обвинителями.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Смысл просьбы услышать голос противников
  choice: Сохранена широкая формулировка «услышь голос моих противников»
  alternative: «Выслушай их обвинения» или «обрати внимание на их заговор»
  rationale: Контекст допускает как речь и обвинения против Иеремии, так и враждебные замыслы. Перевод не разрешает эту неоднозначность без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. «Внемли» выбрано ради краткости, настойчивости и параллелизма; остальная лексика проста и общепонятна.
