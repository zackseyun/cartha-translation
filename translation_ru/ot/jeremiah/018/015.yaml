revisions:
- from: Ибо народ Мой забыл Меня и воскуряет пустоте[a]. Их заставили споткнуться на путях их, на древних тропах[c], и пойти по окольным тропам[b], по дороге непроложенной.
  to: Ибо народ Мой забыл Меня и воскуряет пустоте[a]. Их заставили споткнуться на своих путях, на древних тропах[c], чтобы они ходили окольными тропами[b], по дороге, не проложенной.
  rationale: Сохранены «пустота» как неспецифицированный объект ложного поклонения и безличная передача неявного деятеля каузативного глагола. Заменены неестественные инверсии, а инфинитив передан как «чтобы ... ходили», что лучше соответствует образу постоянного уклонения на ложные пути. Примечание c дополнено сведением о каузативной форме, не навязывая идентификацию деятеля.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:15:37Z'
