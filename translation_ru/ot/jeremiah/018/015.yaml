  text: כִּֽי שְׁכֵחֻ֥/נִי עַמִּ֖/י לַ/שָּׁ֣וְא יְקַטֵּ֑רוּ וַ/יַּכְשִׁל֤וּ/ם בְּ/דַרְכֵי/הֶם֙ שְׁבִילֵ֣י עוֹלָ֔ם לָ/לֶ֣כֶת נְתִיב֔וֹת דֶּ֖רֶךְ לֹ֥א סְלוּלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/015.yaml
  text: For my people have forgotten me[a]; they burn incense to emptiness. They have stumbled in their ways, in the ancient paths, to walk on side roads[d][c][b], on a road not built up.
translation:
  language: ru
  text: Ибо народ Мой забыл Меня и воскуряет пустоте[a]. Их заставили споткнуться на своих путях, на древних тропах[c], чтобы они ходили окольными тропами[b], по дороге, не проложенной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тщете», «лжи», «тому, что ложно». Еврейское слово часто обозначает пустое и негодное поклонение; по смыслу здесь могут подразумеваться идолы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по боковым тропам», «по обходным тропам».'
    reason: lexical_alternative
  - marker: c
    text: '«Древние тропы» — образ издавна установленного Богом пути; ср. Иер. 6:16. Еврейский глагол в предшествующей строке имеет каузативное значение: буквально «они заставили их споткнуться»; непосредственный деятель не назван.'
    reason: cross_reference
lexical_decisions:
- source_word: שְׁכֵחֻנִי
  choice: забыл Меня
  rationale: Прямо передаёт qal perfect с суффиксом 1-го лица; сохраняет смысл отказа помнить Бога, не усиливая его толкованием.
- source_word: לַשָּׁוְא
  choice: пустоте
  rationale: שָׁוְא может обозначать пустоту, тщету или ложь; здесь подразумевается негодный объект поклонения, однако слово «идолы» в еврейском тексте отсутствует.
- source_word: יְקַטֵּרוּ
  choice: воскуряет
  rationale: Форма Piel от קטר в данном культовом контексте естественно обозначает воскурение благовоний. Единственное число согласовано с собирательным «народ» в современном русском.
- source_word: וַיַּכְשִׁלוּם
  choice: их заставили споткнуться
  rationale: Hifil с объектным суффиксом 3-го лица множественного числа имеет каузативное значение; безличная конструкция сохраняет неопределённость субъекта действия.
- source_word: בְּדַרְכֵיהֶם
  choice: на путях их
  rationale: Предлог ב передан пространственным «на» в рамках развёрнутого образа пути; постпозиция местоимения поддерживает достоинство пророческой речи.
- source_word: שְׁבִילֵי עוֹלָם
  choice: древних тропах
  rationale: Передаёт образ издавна установленных путей, не превращая עוֹלָם в абстрактную «вечность».
- source_word: נְתִיבוֹת
  choice: окольным тропам
  rationale: В противопоставлении древним установленным путям слово обозначает боковые, уклоняющиеся тропы; «окольные» естественно выражает этот контраст.
- source_word: דֶּרֶךְ לֹא סְלוּלָה
  choice: по дороге непроложенной
  rationale: Сохраняет физический образ дороги, которую не выровняли и не подготовили, в естественной и лаконичной русской форме.
theological_decisions:
- issue: Объект ложного поклонения в לַשָּׁוְא
  choice: пустоте
  alternative: идолам; ложным богам; тщете
  rationale: Контекст подразумевает идолопоклонство, но широкое значение еврейского слова не следует сужать до явно названных идолов.
- issue: Субъект действия в וַיַּכְשִׁלוּם
  choice: Безличное каузативное «их заставили споткнуться»
  alternative: они споткнулись; они заставили их споткнуться
  rationale: Масоретская форма является каузативной и содержит объектный суффикс, но непосредственный субъект в сжатой конструкции не назван; безличная русская форма сохраняет обе особенности.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены метафора пути, краткость обвинения и смысловая напряжённость неявного субъекта каузативного глагола. «Воскуряет» употреблено как понятный культовый термин; инверсия «на путях их» слегка возвышает регистр без архаизации.
