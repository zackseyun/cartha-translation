base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/008.yaml
  text: And if that nation turns from its evil[a], against which I spoke[c][b], then I will relent concerning the disaster that I planned to do to it.
translation:
  language: ru
  text: И если тот народ отвернётся от своего зла[a], о котором Я возвестил этому народу, то Я откажусь[b] от бедствия[c], которое задумал причинить ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повернётся», «вернётся», «раскается». Еврейский глагол буквально означает «повернуться, вернуться».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изменю Своё решение». Это выражение означает, что Бог в ответ на перемену народа отказывается от объявленного суда.'
    reason: alternative_reading
  - marker: c
    text: 'В еврейском тексте слова «зло» и «бедствие» происходят от одного и того же слова: сначала оно обозначает нравственное зло народа, затем — бедствие как суд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: И если ... отвернётся
  rationale: שׁוּב буквально означает «повернуться/вернуться». Условное «если» следует из связи с предыдущим стихом, а «отвернётся от» естественно передаёт нравственную перемену, сохраняя образ поворота.
- source_word: הַגּוֹי הַהוּא
  choice: тот народ
  rationale: גּוֹי обозначает народ или нацию; «тот народ» естественно и точно передаёт указательное словосочетание и собирательного субъекта.
- source_word: מֵרָעָתוֹ
  choice: от своего зла
  rationale: Здесь רָעָה обозначает нравственное зло. «Своего» ясно соотносит зло с народом и сохраняет лексическую связь с последующим употреблением того же слова в значении бедствия.
- source_word: אֲשֶׁר דִּבַּרְתִּי עָלָיו
  choice: о котором Я говорил против него
  rationale: 'Неоднозначная конструкция דִּבֵּר עַל допускает значения «говорить о» и «говорить против». Формулировка сохраняет обе стороны: речь касается зла, а провозглашение направлено против народа.'
- source_word: וְנִחַמְתִּי
  choice: то Я откажусь
  rationale: В данном контексте נחם означает отказ от объявленного бедствия в ответ на перемену народа. «Откажусь от» понятно современному читателю и не приписывает Богу нравственного раскаяния.
- source_word: עַל הָרָעָה
  choice: от бедствия
  rationale: Во втором употреблении רָעָה означает не нравственное зло, а губительное бедствие. Предлог выбран в соответствии с естественным русским управлением «отказаться от».
- source_word: אֲשֶׁר חָשַׁבְתִּי
  choice: которое задумал
  rationale: חָשַׁב здесь передаёт обдуманное намерение или замысел; «задумал» сохраняет прямоту и напряжение исходного текста.
- source_word: לַעֲשׂוֹת לוֹ
  choice: причинить ему
  rationale: Буквальное «сделать ему» в современном русском неестественно; при слове «бедствие» глагол «причинить» ясно передаёт направленное на народ действие.
theological_decisions:
- issue: Передача נִחַם применительно к Богу
  choice: то Я откажусь
  alternative: то Я изменю Своё решение; то Я не стану наводить
  rationale: Текст изображает объявленный суд Бога как отзывчивый к обращению людей. Выбранная формулировка сохраняет реальную условность и отказ от намеченного бедствия, не превращая её ни в нравственное раскаяние Бога, ни в отвлечённое описание.
- issue: Два значения רָעָה в одном стихе
  choice: зло ... бедствие
  alternative: зло ... зло; нечестие ... бедствие
  rationale: Первое употребление нравственное, второе обозначает кару или бедствие. Разные русские слова необходимы для ясности, а примечание отмечает намеренный повтор одного еврейского слова.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Сохранены условный характер высказывания, образ нравственного поворота и богословское напряжение в словах об отказе Бога от задуманного бедствия. Местоимение «Я» написано с прописной буквы как прямая речь Бога.
