  text: וְ/רֶ֣גַע אֲדַבֵּ֔ר עַל גּ֖וֹי וְ/עַל מַמְלָכָ֑ה לִ/בְנֹ֖ת וְ/לִ/נְטֹֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/009.yaml
  text: And at another moment I may speak concerning a nation and concerning a kingdom[a], to build and to plant.
translation:
  language: ru
  text: А в другой момент Я могу сказать о каком-либо народе и о каком-либо царстве[a], что буду созидать и насаждать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И в один момент Я говорю о каком-либо народе и о каком-либо царстве, что буду созидать и насаждать». В еврейском тексте оборот со словом «момент» обрамляет Божьи заявления в ст. 7–10.'
    reason: Лексико-синтаксический вариант, сохраняющий более буквальное значение רֶגַע и формы אֲדַבֵּר.
lexical_decisions:
- source_word: וְרֶגַע
  choice: А в другой момент
  rationale: רֶגַע означает «мгновение, момент». Слово «другой» естественно передаёт противопоставление параллельному высказыванию в ст. 7, не устраняя буквальный образ момента; более буквальный вариант приведён в сноске.
- source_word: אֲדַבֵּר
  choice: Я могу сказать
  rationale: Имперфект в условно-иллюстративном контексте ст. 7–10 обозначает возможное в определённых обстоятельствах действие. «Могу сказать» сохраняет эту обусловленность, хотя не подразумевает неуверенности Бога.
- source_word: עַל
  choice: о
  rationale: В сочетании דבר על предлог указывает на предмет речи. Нейтральное «о» не привносит в положительный контекст значения враждебности.
- source_word: גּוֹי
  choice: народ
  rationale: גּוֹי обозначает народ как совокупность людей или политическое сообщество. В современном русском библейском контексте «народ» звучит естественнее, чем «нация».
- source_word: מַמְלָכָה
  choice: царство
  rationale: מַמְלָכָה означает царство или владение; «царство» — ясный и традиционный, но по-прежнему современно понятный эквивалент.
- source_word: לִבְנֹת
  choice: созидать
  rationale: Инфинитив בנה буквально значит «строить». Применительно к народу и царству «созидать» естественно сохраняет строительную метафору и не сводит её только к восстановлению.
- source_word: וְלִנְטֹעַ
  choice: и насаждать
  rationale: נטע буквально значит «сажать, насаждать». «Насаждать» сохраняет земледельческую метафору и допускает подразумеваемый объект без добавления отсутствующего в еврейском тексте местоимения.
theological_decisions:
- issue: Обусловленность Божьей пророческой речи
  choice: «Я могу сказать» в рамках условного примера
  alternative: «Я говорю» или «Я скажу»
  rationale: Ст. 7–10 описывают Божьи объявления о суде и благословении в связи с откликом народа. Формулировка сохраняет реальную обусловленность этого сценария, но не истолковывает её как неведение или неуверенность Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Повтор «о каком-либо» отражает повтор предлога עַל и обобщающий характер высказывания. Метафоры созидания и насаждения сохранены без добавления прямого дополнения.
