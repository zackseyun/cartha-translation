base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/020.yaml
  text: Should evil be repaid for good? For they have dug a pit for my life[a]. Remember that I stood before you to speak good on their behalf[b], to turn your wrath away from them.
translation:
  language: ru
  text: Разве за добро воздают злом? Ведь они вырыли яму, чтобы погубить меня[a]. Вспомни, как я стоял перед Тобой, чтобы говорить о них доброе[b] и отвратить от них Твой гнев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для моей души»; здесь «душа» означает жизнь или самого человека, находящегося в смертельной опасности.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «говорить ради их блага» или «говорить за них». По смыслу Иеремия заступался за них перед Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְשֻׁלַּם תַּחַת טוֹבָה רָעָה
  choice: Разве за добро воздают злом?
  rationale: Риторический вопрос и пассивное значение формы שׁלם естественно переданы русской неопределённо-личной конструкцией; «за добро… злом» сохраняет резкий нравственный контраст и смысл воздаяния.
- source_word: כָרוּ שׁוּחָה לְנַפְשִׁי
  choice: они вырыли яму, чтобы погубить меня
  rationale: Образ выкопанной ямы сохранён, а נֶפֶשׁ в контексте смертельной угрозы относится к жизни или самому человеку. Целевая конструкция естественно выражает замысел ловушки.
- source_word: זְכֹר עָמְדִי לְפָנֶיךָ
  choice: Вспомни, как я стоял перед Тобой
  rationale: Императив и образ предстояния перед Богом сохранены; русское «вспомни, как» естественно вводит воспоминание о заступничестве.
- source_word: לְדַבֵּר עֲלֵיהֶם טוֹבָה
  choice: говорить им во благо
  rationale: Формулировка сохраняет возможный смысл речи о них ради их блага, не сводя выражение лишь к похвале; альтернативный оттенок отмечен в сноске.
- source_word: לְהָשִׁיב אֶת חֲמָתְךָ מֵהֶם
  choice: отвратить от них Твой гнев
  rationale: «Отвратить» точно и естественно передаёт каузативное значение שׁוב, а «гнев» сохраняет серьёзность Божьего суда без излишне архаичного звучания.
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте заговора
  choice: чтобы погубить меня
  alternative: для моей души; лишить меня жизни
  rationale: Речь идёт об угрозе самому Иеремии и его жизни, а не о противопоставлении души и тела. Сноска сохраняет буквальную форму и смысловую альтернативу.
- issue: Характер речи Иеремии перед Богом
  choice: говорить им во благо
  alternative: говорить о них доброе; ходатайствовать за них
  rationale: Перевод передаёт благожелательное заступничество, но не вводит в основной текст более специальный термин «ходатайствовать», которого в еврейской фразе прямо нет.
- issue: Передача חֲמָה
  choice: гнев
  alternative: ярость
  rationale: «Гнев» ясно передаёт Божье суровое негодование и угрозу суда, не превращая выражение в технический богословский термин.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного плача. Синтаксис остаётся ясным для широкого читателя; обращённые к Богу местоимения написаны с прописной буквы согласно распространённой русской библейской традиции.
