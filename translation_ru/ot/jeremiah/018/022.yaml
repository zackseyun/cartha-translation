source:
  edition: WLC
  text: תִּשָּׁמַ֤ע זְעָקָה֙ מִ/בָּ֣תֵּי/הֶ֔ם כִּֽי תָבִ֧יא עֲלֵי/הֶ֛ם גְּד֖וּד פִּתְאֹ֑ם כִּֽי כָר֤וּ שיחה לְ/לָכְדֵ֔/נִי וּ/פַחִ֖ים טָמְנ֥וּ לְ/רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/022.yaml
  text: Let a cry be heard from their houses when you suddenly bring a raiding band upon them[b][a], for they have dug a pit to capture me and hidden traps for my feet.
translation:
  language: ru
  text: Пусть из их домов донесётся вопль, когда Ты внезапно наведёшь на них отряд налётчиков[a], ведь они вырыли яму, чтобы поймать меня, и тайно расставили силки для моих ног[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воинский отряд»; «шайка налётчиков».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ловушки для моих ног».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשָּׁמַע
  choice: пусть ... донесутся
  rationale: Нифаль выражает пассивное восприятие звука, а контекст молитвы-проклятия требует пожелательного значения. Русское «пусть ... донесутся» естественно передаёт оба оттенка.
- source_word: זְעָקָה
  choice: крики
  rationale: Существительное обозначает крик бедствия. Собирательное единственное число в еврейском естественно передано русским множественным в сочетании с исходящим из нескольких домов плачем.
- source_word: מִבָּתֵּיהֶם
  choice: из их домов
  rationale: 'Сохранён конкретный пространственный образ: крики доносятся из домов.'
- source_word: כִּי (первое)
  choice: когда
  rationale: Здесь союз вводит обстоятельство времени, при котором раздадутся крики.
- source_word: תָבִיא
  choice: Ты ... наведёшь
  rationale: Хифиль глагола בוא означает «привести, навести». «Наведёшь на них» естественно сочетается с вражеским отрядом и сохраняет Бога как подразумеваемого адресата.
- source_word: גְּדוּד
  choice: отряд грабителей
  rationale: Слово может обозначать воинский отряд или шайку, совершающую набег. Выбор передаёт контекст нападения и грабежа, не сводя образ к регулярному войску.
- source_word: פִּתְאֹם
  choice: внезапно
  rationale: Прямой и естественный эквивалент наречия.
- source_word: כִּי (второе)
  choice: ведь
  rationale: Второй союз указывает причину просьбы Иеремии о суде над противниками.
- source_word: כָרוּ שיחה
  choice: они вырыли яму
  rationale: Перфект описывает уже совершённое действие, имеющее значение для настоящей просьбы; «яма» сохраняет образ ловушки.
- source_word: לְלָכְדֵנִי
  choice: чтобы поймать меня
  rationale: Инфинитив выражает цель. «Поймать» естественно поддерживает образ ямы и силков.
- source_word: וּפַחִים טָמְנוּ לְרַגְלָי
  choice: и расставили силки для моих ног
  rationale: פחים — ловушки или силки; טמן буквально связано с сокрытием или тайным устройством. «Расставили силки» — ясное современное выражение, сохраняющее образ ловушки для ног.
theological_decisions:
- issue: Пожелательная сила молитвы Иеремии о воздаянии
  choice: 'Сохранить прямую просьбу: «Пусть ... донесутся»'
  alternative: 'Передать как предсказание: «Из их домов донесутся крики»'
  rationale: В контексте молитвы форма imperfect допускает и наиболее естественно выражает пожелание. Перевод простым будущим временем ослабил бы напряжённую просительную и обличительную силу текста.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией молитвы. Обращение к Богу обозначено прописным «Ты» по принятой русской издательской традиции. Жёсткая сила просьбы о суде не смягчена.
