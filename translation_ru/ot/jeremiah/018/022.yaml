revisions:
- from: Пусть из их домов донесутся крики, когда Ты внезапно наведёшь на них отряд грабителей[a], ведь они вырыли яму, чтобы поймать меня, и расставили силки для моих ног[b].
  to: Пусть из их домов донесётся вопль, когда Ты внезапно наведёшь на них отряд налётчиков[a], ведь они вырыли яму, чтобы поймать меня, и тайно расставили силки для моих ног[b].
  rationale: Исправление явно передаёт сокрытие ловушек, уточняет альтернативное примечание в соответствии с еврейским «для моих ног» и сохраняет единственное число существительного «вопль». Остальная структура стиха, включая прямую пожелательную силу молитвы, сохранена.
