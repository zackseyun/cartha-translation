lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма с последовательным וַ вводит очередное событие повествования; традиционная, но всё ещё понятная русская формула «И было» сохраняет глагольную форму היה без архаичного «и случилось».
- source_word: דְבַר
  choice: слово
  rationale: В пророческой формуле דְבַר־יְהוָה обозначает обращённое к пророку слово или послание; «слово» сохраняет устойчивый библейский образ и конструкцию исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом, поскольку в еврейском тексте непосредственно стоит יְהוָה.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица обозначает направление к говорящему; «ко мне» естественно сочетается по-русски с формулой «было слово».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив לֵאמֹר вводит последующую прямую речь. В современном русском эту функцию естественно и без смысловой потери передаёт двоеточие; буквальное «говоря» здесь звучало бы неестественно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом и не добавляет отсутствующее в еврейском тексте слово «Господь».
translation_notes:
  register: Современный литературный русский с сохранением краткой пророческой формулы. Порядок «ко мне слово Яхве» близок к еврейской структуре и звучит естественно в русском библейском регистре. Двоеточие функционально передаёт לֵאמֹר и связывает стих со следующей прямой речью.
