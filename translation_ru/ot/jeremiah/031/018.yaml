source:
  edition: WLC
  text: שָׁמ֣וֹעַ שָׁמַ֗עְתִּי אֶפְרַ֨יִם֙ מִתְנוֹדֵ֔ד יִסַּרְתַּ֨/נִי֙ וָֽ/אִוָּסֵ֔ר כְּ/עֵ֖גֶל לֹ֣א לֻמָּ֑ד הֲשִׁיבֵ֣/נִי וְ/אָשׁ֔וּבָה כִּ֥י אַתָּ֖ה יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/018.yaml
  text: 'I have surely heard Ephraim grieving: ‘You disciplined me[a], and I was disciplined, like an untrained calf. Restore me, and I will return[b], for you are Yahweh my God.’'
translation:
  language: ru
  text: '«Я действительно слышал, как Ефрем сетует[a]: „Ты вразумлял меня, и я был вразумлён, как телёнок, которого не приучили. Обрати меня, и я обращусь[b], ведь Ты — Яхве, мой Бог“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать, что Ефрем оплакивает себя или беспокойно мечется.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Верни меня, и я вернусь». В еврейском тексте в обеих частях повторяется один глагол со значением обращения или возвращения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹעַ שָׁמַעְתִּי
  choice: Я действительно слышал
  rationale: Сочетание инфинитива абсолютного с личной формой того же глагола усиливает утверждение; «действительно» естественно передаёт это усиление по-русски.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено традиционное русское написание имени; в контексте оно олицетворяет северный народ, но грамматически представлено как одно лицо.
- source_word: מִתְנוֹדֵד
  choice: сетует
  rationale: Форма может обозначать жалобный плач, колебание или беспокойное движение. В покаянном контексте «сетует» естественно передаёт слышимое выражение скорби, не устраняя лексическую неоднозначность, отмеченную в сноске.
- source_word: יִסַּרְתַּנִי … וָאִוָּסֵר
  choice: Ты вразумлял меня, и я был вразумлён
  rationale: Глагол יסר обозначает исправляющее наказание или наставление. «Вразумлял» сохраняет смысл дисциплинарного исправления и повтор корня в двух формах.
- source_word: כְּעֵגֶל לֹא לֻמָּד
  choice: как телёнок, которого не приучили
  rationale: Оборот буквально описывает телёнка, ещё не прошедшего приучения или обучения. Такая формулировка сохраняет сельскохозяйственный образ и звучит естественнее, чем «необученный телёнок», не добавляя отсутствующего в тексте упоминания ярма.
- source_word: הֲשִׁיבֵנִי וְאָשׁוּבָה
  choice: Обрати меня, и я обращусь
  rationale: 'Обе формы происходят от שוב: первая каузативна («сделай так, чтобы я обратился/вернулся»), вторая выражает последующее обращение или возвращение. Повтор «обрати — обращусь» сохраняет словесную связь оригинала.'
- source_word: כִּי אַתָּה יְהוָה אֱלֹהָי
  choice: ведь Ты — Яхве, мой Бог
  rationale: כִּי вводит основание просьбы; личное имя יְהוָה передано как «Яхве», а именная конструкция — прямо и исповедально.
theological_decisions:
- issue: Соотношение Божьего действия и человеческого обращения
  choice: «Обрати меня, и я обращусь»
  alternative: «Верни меня, и я вернусь» / «Восстанови меня, и я вернусь»
  rationale: Каузативная и простая формы одного глагола поставлены рядом, оставляя напряжение между Божьим действием и ответом Ефрема. Перевод не сводит просьбу только к внешнему возвращению или только к внутреннему покаянию.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и соответствует предоставленному доктринальному решению.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены олицетворение Ефрема, повтор корней и прямая молитвенная речь; архаизмы и конфессионально нагруженные пояснения не добавлялись.
