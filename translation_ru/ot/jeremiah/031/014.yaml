  text: וְ/רִוֵּיתִ֛י נֶ֥פֶשׁ הַ/כֹּהֲנִ֖ים דָּ֑שֶׁן וְ/עַמִּ֛/י אֶת טוּבִ֥/י יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/014.yaml
  text: I will satisfy the priests with abundance[a], and my people will be filled with my goodness[c][b], declares Yahweh.
translation:
  language: ru
  text: Я насыщу священников изобилием[a], и народ Мой насытится Моими благами[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «насыщу душу (или потребность) священников туком»; «тук» здесь означает богатство и обилие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «народ Мой насытится Моей благостью»; также возможно: «Моим добром».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרִוֵּיתִי
  choice: Я насыщу
  rationale: Пиэль глагола רוה означает дать напиться досыта и, шире, вполне насытить. «Насыщу» естественно передаёт здесь образ щедрого обеспечения.
- source_word: נֶפֶשׁ הַכֹּהֲנִים
  choice: священников
  rationale: נפש в данном обороте обозначает самих людей в аспекте их жизни или потребности. Прямое дополнение «священников» сохраняет идиоматический смысл без неестественного для современного русского выражения «душу священников».
- source_word: דָּשֶׁן
  choice: изобилием
  rationale: Слово буквально связано с жиром, тучностью и насыщенностью, а переносно означает богатство и обильный достаток. «Изобилием» ясно передаёт контекстуальный смысл.
- source_word: וְעַמִּי
  choice: и народ Мой
  rationale: Прямое воспроизведение заветного притяжательного выражения «Мой народ»; постпозиция местоимения придаёт фразе естественное библейское достоинство без архаизации.
- source_word: אֶת־טוּבִי
  choice: Моими благами
  rationale: טוב может означать доброту, благо, благость или конкретные добрые дары. Множественное «благами» естественно сочетается с «насытится» и сохраняет значение щедрых даров Яхве.
- source_word: יִשְׂבָּעוּ
  choice: насытится
  rationale: Глагол שבע означает насытиться, получить вдоволь. Единственное число согласовано с собирательным существительным «народ».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — устойчивая пророческая формула, переданная литературным «возвещает»; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя в исходном тексте и следует указанной проектной установке, не подменяя его титулом.
- issue: Значение טוּבִי
  choice: Моими благами
  alternative: Моей благостью
  rationale: Контекст насыщения допускает как Божью благость, так и исходящие от Него дары. «Благами» лучше передаёт предметный оттенок щедрого обеспечения, не отрицая их божественного источника.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Синтаксический параллелизм двух строк сохранён; буквальные семитские образы разъяснены в сносках. Все маркеры сносок присутствуют в основном тексте.
