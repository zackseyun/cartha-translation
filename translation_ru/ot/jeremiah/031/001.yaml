source:
  edition: WLC
  text: בָּ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה אֶֽהְיֶה֙ לֵֽ/אלֹהִ֔ים לְ/כֹ֖ל מִשְׁפְּח֣וֹת יִשְׂרָאֵ֑ל וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/001.yaml
  text: At that time[a], declares Yahweh, I will be God to all the families of Israel, and they will be my people.
translation:
  language: ru
  text: В то время, — возвещает Яхве, — Я буду Богом для всех родов[a] Израиля, и они будут Моим народом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семей». Еврейское слово может обозначать большие родственные группы, то есть роды или кланы, внутри Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Естественно передаёт пророческое указание на предстоящий период, не сужая его до одного мгновения.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу как авторитетное провозглашение; личное имя יהוה транслитерировано как «Яхве», а не заменено титулом.
- source_word: אֶהְיֶה לֵאלֹהִים
  choice: Я буду Богом для
  rationale: Сохраняет формулу заветных отношений и естественно звучит по-русски.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשְׂרָאֵל
  choice: для всех родов Израиля
  rationale: «Роды» обозначают составляющие Израиль большие родственные группы; возможное более узкое соответствие «семьи» отмечено в сноске.
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: и они будут Моим народом
  rationale: Естественная русская передача ответной части формулы завета, сохраняющая идею взаимной принадлежности.
theological_decisions:
- issue: Передача формулы завета
  choice: Я буду Богом для всех родов Израиля, и они будут Моим народом
  alternative: Я буду Богом всем семьям Израиля, а они будут для Меня народом
  rationale: Выбранный вариант сохраняет взаимность формулы завета и её богословскую силу, не добавляя толкования и оставаясь естественным для современного русского языка.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное Божье имя, непосредственно присутствующее в еврейском тексте, тогда как «Господь» является традиционной заменой имени титулом.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой формулировкой. Местоимения, относящиеся к Богу, оформлены с прописной буквы в соответствии с принятым русским библейским регистром.
