lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  choice: И будут жить в ней
  rationale: Глагол יָשַׁב здесь передаёт проживание и обитание в восстановленной земле; будущее время естественно следует из контекста. Местоименное «в ней» сохраняет женский суффикс בָהּ и его отсылку к земле.
- source_word: יְהוּדָה וְכָל עָרָיו
  choice: Иуда и все его города
  rationale: «Иуда» обозначает землю или население Иудеи как собирательное целое; мужской суффикс עָרָיו формально и естественно передан как «его».
- source_word: יַחְדָּו
  choice: вместе
  rationale: Прямой и естественный эквивалент наречия совместности.
- source_word: אִכָּרִים
  choice: земледельцы
  rationale: Слово обозначает тех, кто обрабатывает землю; «земледельцы» точно, современно и уместно в литературном библейском регистре.
- source_word: וְנָסְעוּ בָּעֵדֶר
  choice: и те, кто кочует со стадом
  rationale: נָסַע означает сниматься с места, отправляться и переходить дальше. В сочетании со стадом выражение, вероятно, описывает подвижных скотоводов, но не называет их прямо пастухами; относительная конструкция сохраняет эту недосказанность. Настоящее время внутри характеризующей группы естественно по-русски при будущем сказуемом главной части.
