base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/013.yaml
  text: Then the virgin will rejoice in the dance[a], and young men and old men together; and I will turn their mourning into gladness[c][b], and I will comfort them and make them rejoice from their sorrow.
translation:
  language: ru
  text: Тогда дева[a] будет радоваться в танце, и юноши, и старики[b] — все вместе. Я обращу их траур в радость[c], утешу их и обрадую после их печали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «девушка», «молодая женщина». Единственное число, вероятно, представляет молодых женщин всей общины.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «старейшины», если понимать это слово как обозначение общественного положения; однако противопоставление юношам говорит в пользу возрастного значения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в ликование».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Кратко и естественно передаёт временное наречие, связывающее стих с обещанным восстановлением.
- source_word: בְּתוּלָה
  choice: дева
  rationale: Сохраняет единственное число и прямое значение еврейского существительного; в контексте дева, вероятно, представляет молодых женщин общины.
- source_word: בְּמָחוֹל
  choice: в танце
  rationale: Передаёт танец как сферу и вид праздничной радости без неоправданного уточнения его формы.
- source_word: בַחֻרִים וּזְקֵנִים
  choice: юноши со стариками
  rationale: Сохраняет возрастное противопоставление; в данном параллелизме זְקֵנִים скорее означает пожилых мужчин, а не носителей общественной должности.
- source_word: יַחְדָּו
  choice: все вместе
  rationale: Подчёркивает совместную радость разных поколений; слово «все» естественно раскрывает объединяющую силу наречия.
- source_word: אֶבְלָם לְשָׂשׂוֹן
  choice: их скорбь в ликование
  rationale: Передаёт резкую перемену от траурной скорби к открытой, праздничной радости.
- source_word: וְנִחַמְתִּים
  choice: утешу их
  rationale: Точно и доступно передаёт значение породы piel глагола נחם в контексте пережитого горя.
- source_word: וְשִׂמַּחְתִּים מִיגוֹנָם
  choice: обрадую, избавив от печали
  rationale: «Обрадую» сохраняет каузативный смысл формы שׂמח, а оборот с «избавив» естественно передаёт מִן как удаление от состояния печали.
theological_decisions:
- issue: Представительное единственное число בְּתוּלָה
  choice: Сохранено единственное число «дева».
  alternative: 'Передать во множественном числе: «девушки» или «молодые женщины».'
  rationale: Еврейский текст употребляет единственное число, вероятно, как образ представительницы молодых женщин восстановленной общины. Перевод сохраняет эту форму, не утверждая, что речь непременно идёт лишь об одной женщине.
- issue: Значение זְקֵנִים
  choice: «старики» как возрастная группа
  alternative: «старейшины» как общественные руководители
  rationale: Параллель с «юношами» выдвигает на первый план возрастной контраст, поэтому должностное значение здесь менее вероятно.
- issue: Оттенок предлога מִן в מִיגוֹנָם
  choice: Передан как избавление от печали.
  alternative: 'Временно-обстоятельственное понимание: «после их печали».'
  rationale: Предлог допускает оттенок удаления или выхода из состояния; выбранная формулировка сохраняет образ перехода от горя к радости, не вводя дополнительной причинности.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным ритмом. Синтаксис слегка выровнен для естественного чтения, при этом сохранены последовательность образов, представительное единственное число и возрастной контраст оригинала.
