  to: 'Издалека явился мне Яхве[a]:


    «Я любил тебя вечной любовью,


    поэтому Я привлёк тебя неизменной любовью[b]».'
  rationale: Убрано невыраженное уточнение «к Себе». «Я полюбил тебя» заменено на «Я любил тебя», чтобы не вносить оттенок начала любви; вечный характер любви прямо выражен определением «вечной». Сноска a уточнена, а сноска b сохранена с более естественной формулировкой альтернативного понимания.
