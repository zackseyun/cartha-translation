source:
  edition: WLC
  text: מֵ/רָח֕וֹק יְהוָ֖ה נִרְאָ֣ה לִ֑/י וְ/אַהֲבַ֤ת עוֹלָם֙ אֲהַבְתִּ֔י/ךְ עַל כֵּ֖ן מְשַׁכְתִּ֥י/ךְ חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/003.yaml
  text: 'From far away Yahweh appeared to me: “I have loved you with an everlasting love[b][a]; therefore I have drawn you with steadfast love.”'
translation:
  language: ru
  text: 'Издалека явился мне Яхве[a]:


    «Я любил тебя вечной любовью,


    поэтому Я привлёк тебя неизменной любовью[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Издалека» можно связать с глаголом: «Яхве явился мне издалека». В некоторых древних свидетельствах и толкованиях местоимение понимается как «ему».'
    reason: alternative_reading
  - marker: b
    text: 'Еврейское חֶסֶד означает верную, деятельную любовь и благосклонность, нередко связанную с заветом. Это сочетание также можно понимать: «поэтому Я продолжал являть тебе милость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרָחוֹק
  choice: Издалека
  rationale: Передаёт пространственное значение «издали, с далёкого расстояния». Начальная позиция сохраняет выразительность еврейской строки и её синтаксическую неоднозначность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: נִרְאָה לִי
  choice: явился мне
  rationale: Нифаль глагола ראה здесь естественно означает «явился, показался»; местоименный суффикс לִי означает «мне».
- source_word: וְאַהֲבַת עוֹלָם
  choice: Вечной любовью
  rationale: Конструкция буквально говорит о любви «вечности/навсегда». Русское выражение естественно передаёт непреходящую длительность, не исключая давнего начала этой любви.
- source_word: אֲהַבְתִּיךְ
  choice: Я полюбил тебя
  rationale: Совершенная форма обозначает состоявшееся действие с сохраняющейся силой. В сочетании «вечной любовью» русский совершенный вид выражает это естественнее, чем тяжеловесное «Я любил и люблю».
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Сохраняет обычное следственно-выводное значение выражения и связь следующего действия с вечной любовью Яхве.
- source_word: מְשַׁכְתִּיךְ
  choice: Я привлёк тебя к Себе
  rationale: Пиэль משך имеет основное значение «тянуть, влечь, привлекать». Добавление «к Себе» ясно выражает подразумеваемое направление и даёт естественную русскую фразу, не заменяя образ более отвлечённым «продлил милость».
- source_word: חָסֶד
  choice: неизменной любовью
  rationale: חסד обозначает верную, деятельную и часто заветную благосклонность. «Неизменная любовь» отличает его от обычного אַהֲבָה и остаётся понятным без специальной терминологии.
theological_decisions:
- issue: Соотношение אַהֲבָה и חֶסֶד
  choice: 'Передать их родственными, но различными выражениями: «любовь» и «неизменная любовь».'
  alternative: Передать оба слова просто как «любовь» либо перевести חֶסֶד как «верность завету».
  rationale: Различие сохраняет лексику еврейского текста. При этом перевод не сужает многозначное חֶסֶד до одной богословской категории.
- issue: Значение מְשַׁכְתִּיךְ חָסֶד
  choice: «Я привлёк тебя к Себе неизменной любовью».
  alternative: «Я продолжал являть тебе милость» или «Я простёр к тебе милость».
  rationale: Основное значение משך поддерживает образ привлечения, однако сочетание с חֶסֶד допускает понимание продолженного проявления милости; эта напряжённость отмечена в сноске.
- issue: Временной аспект совершенных форм אֲהַבְתִּיךְ и מְשַׁכְתִּיךְ
  choice: Русское прошедшее время в контексте вечной и неизменной любви.
  alternative: 'Эксплицировать продолжающийся результат: «Я всегда любил тебя» и «продолжаю привлекать тебя».'
  rationale: Русское прошедшее не имеет прямого аналога английского present perfect. Контекст и определения любви передают продолжающуюся значимость, не добавляя к еврейским формам явно выраженного настоящего времени.
translation_notes:
  register: Современный литературный русский язык с поэтическим ритмом и dignified библейской интонацией. Обращение имеет форму женского рода в еврейском тексте и в контексте относится к Израилю; русское «тебя» сохраняет это без поясняющей вставки. Имя Яхве передано напрямую.
