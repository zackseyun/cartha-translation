  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם יִמַּ֤דּוּ שָׁמַ֨יִם֙ מִ/לְ/מַ֔עְלָ/ה וְ/יֵחָקְר֥וּ מֽוֹסְדֵי אֶ֖רֶץ לְ/מָ֑טָּה גַּם אֲנִ֞י אֶמְאַ֨ס בְּ/כָל זֶ֧רַע יִשְׂרָאֵ֛ל עַֽל כָּל אֲשֶׁ֥ר עָשׂ֖וּ נְאֻם יְהוָֽה׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/037.yaml
  text: 'Thus says Yahweh: If the heavens above can be measured[a], and the foundations of the earth below can be searched out, then I also will reject all the offspring of Israel for all that they have done, declares Yahweh.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Если можно измерить небеса вверху и исследовать основания земли внизу, тогда и Я отвергну всех потомков Израиля за всё, что они сделали», — возвещает Яхве.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся русская формула пророческой речи, сохраняющая торжественный и официальный характер древнееврейского выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, в соответствии с предоставленным проектным решением и без замены титулом.
- source_word: אִם יִמַּדּוּ
  choice: Если можно измерить
  rationale: Сохраняет условную форму и передаёт пассивное значение нифаля; в контексте условие риторически представлено как недостижимое.
- source_word: שָׁמַיִם מִלְמַעְלָה
  choice: небеса вверху
  rationale: Сохраняет космологический образ и вертикальную параллель с «земли внизу».
- source_word: וְיֵחָקְרוּ
  choice: и исследовать
  rationale: Передаёт тщательное изучение или проникновение до конца, не добавляя интерпретирующего значения «постичь».
- source_word: מוֹסְדֵי אֶרֶץ לְמָטָּה
  choice: основания земли внизу
  rationale: Сохраняет древний космологический образ и пространственное противопоставление «вверху — внизу».
- source_word: גַּם אֲנִי
  choice: тогда и Я
  rationale: Естественно обозначает следствие условия и сохраняет эмфатическое соответствие древнееврейского оборота.
- source_word: אֶמְאַס
  choice: отвергну
  rationale: Точно и естественно передаёт מאס в контексте отношений Бога с Израилем, не усиливая его до эмоционального «возненавижу» или «презрю».
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: всё потомство Израиля
  rationale: Передаёт собирательное значение זֶרַע современным русским выражением без неестественного буквального «семя».
- source_word: עַל כָּל אֲשֶׁר עָשׂוּ
  choice: за всё, что они сделали
  rationale: Передаёт основание возможного отвержения кратко, естественно и близко к форме оригинала.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт формулу божественного изречения в dignified modern Russian и отличает её от начальной формулы «Так говорит».
theological_decisions:
- issue: Смысл условия об отвержении Израиля
  choice: Сохранено прямое условное высказывание, которое в контексте подразумевает невозможность полного отвержения потомства Израиля.
  alternative: 'Явно раскрыть смысл: «Но как невозможно измерить небеса... так Я не отвергну...»'
  rationale: Древнееврейский текст формулирует мысль как условие. Перевод сохраняет эту риторическую форму и не превращает подразумеваемый вывод в прямое утверждение.
- issue: Объём выражения «всё потомство Израиля»
  choice: Сохранено собирательное и всеохватное выражение.
  alternative: Передать как «всех потомков Израиля» или ограничить его верным остатком.
  rationale: Текст говорит בְּכָל זֶרַע יִשְׂרָאֵל и не вводит в самом стихе дополнительного ограничения; перевод не навязывает конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для обычного читателя; сохранены условная структура, космический параллелизм «вверху — внизу» и двукратное употребление имени Яхве.
