  text: הִנְ/נִי֩ מֵבִ֨יא אוֹתָ֜/ם מֵ/אֶ֣רֶץ צָפ֗וֹן וְ/קִבַּצְתִּי/ם֮ מִ/יַּרְכְּתֵי אָרֶץ֒ בָּ֚/ם עִוֵּ֣ר וּ/פִסֵּ֔חַ הָרָ֥ה וְ/יֹלֶ֖דֶת יַחְדָּ֑ו קָהָ֥ל גָּד֖וֹל יָשׁ֥וּבוּ הֵֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/008.yaml
  text: Behold[a], I am bringing them from the land of the north, and I will gather them from the farthest parts of the earth. Among them are the blind and the lame, the pregnant woman and the woman in labor, together; a great assembly will return here.
translation:
  language: ru
  text: Вот, Я приведу их из северной страны и соберу их с самых дальних краёв земли[a]. Среди них — слепые и хромые, беременные и роженицы, все вместе; они возвратятся сюда великим собранием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с самых дальних краёв страны»; еврейское אֶרֶץ в зависимости от контекста может означать как «землю», так и «страну».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» естественно передаёт торжественный пророческий призыв к вниманию; сочетание с местоимением сохраняет личный акцент еврейской конструкции.
- source_word: מֵבִיא
  choice: приведу
  rationale: Причастие при הִנְנִי выражает близкое и несомненное действие. В современном русском будущем времени здесь свойственнее звучание обещания, тогда как буквальное «привожу» было бы менее естественно.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: из северной страны
  rationale: Сохраняет географический образ, не отождествляя прямо эту страну с Вавилоном и не сужая значение контекстуальным толкованием.
- source_word: וְקִבַּצְתִּים
  choice: и соберу их
  rationale: Глагол «соберу» ясно и естественно передаёт восстановительное собирание рассеянного народа.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: с самых дальних краёв земли
  rationale: Передаёт значение удалённых пределов; «земли» допускает широкий географический смысл, а возможное значение «страны» отмечено в сноске.
- source_word: בָּם
  choice: Среди них
  rationale: Естественно вводит перечисление тех, кто входит в состав возвращающегося народа.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: слепой и хромой
  rationale: Сохранены краткость и грамматическое единственное число еврейского текста, употреблённое для представителей этих групп.
- source_word: הָרָה וְיֹלֶדֶת
  choice: беременная и роженица
  rationale: Сохраняются женский род и единственное число исходного текста; «роженица» ёмко обозначает женщину, которая рожает.
- source_word: יַחְדָּו
  choice: все вместе
  rationale: Слово «все» естественно уточняет в русском, что перечисленные люди возвращаются совместно, не исключая наиболее уязвимых.
- source_word: קָהָל גָּדוֹל
  choice: Великое собрание
  rationale: «Собрание» сохраняет корпоративный смысл קָהָל без обязательной церковной окраски, а «великое» соответствует возвышенному регистру пророчества.
- source_word: יָשׁוּבוּ הֵנָּה
  choice: возвратится сюда
  rationale: Передаёт и возвращение, и направительное значение הֵנָּה — движение к месту, обозначенному как «сюда».
theological_decisions:
- issue: Включение уязвимых людей в восстановленный народ
  choice: Слепой, хромой, беременная и роженица прямо названы среди возвращающихся.
  alternative: Считать перечень лишь риторическим обозначением многочисленной толпы.
  rationale: Грамматика представляет этих людей действительными участниками возвращения. Перевод сохраняет эту конкретность, не развивая её в дополнительное доктринальное утверждение.
- issue: Объём значения אֶרֶץ в выражении מִיַּרְכְּתֵי אָרֶץ
  choice: «с самых дальних краёв земли»
  alternative: «с самых дальних краёв страны»
  rationale: Контекст допускает широкий географический охват, однако אֶרֶץ может означать как землю вообще, так и определённую страну; поэтому альтернативу следует сохранить в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Формы «Вот», «великое собрание» и «возвратится» поддерживают достоинство речи, оставаясь понятными; синтаксис перечисления сохраняет лаконичность и напряжение оригинала.
