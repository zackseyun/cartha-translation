  variant: modern literary Russian
source:
  edition: WLC
  text: הֲ/בֵן֩ יַקִּ֨יר לִ֜/י אֶפְרַ֗יִם אִ֚ם יֶ֣לֶד שַׁעֲשֻׁעִ֔ים כִּֽי מִ/דֵּ֤י דַבְּרִ/י֙ בּ֔/וֹ זָכֹ֥ר אֶזְכְּרֶ֖/נּוּ ע֑וֹד עַל כֵּ֗ן הָמ֤וּ מֵעַ/י֙ ל֔/וֹ רַחֵ֥ם אֲֽרַחֲמֶ֖/נּוּ נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/020.yaml
  text: Is Ephraim a precious son to me[a], a child of delight? For as often as I speak of him, I still surely remember him. Therefore my inward parts are stirred for him; I will surely have compassion on him[b], declares Yahweh.
translation:
  language: ru
  text: Разве Ефрем не дорогой Мне сын, не дитя, которым Я радуюсь? Ведь всякий раз, когда Я говорю о нём[a], Я по-прежнему непременно вспоминаю его. Поэтому сердце Моё тоскует по нему[b]; Я непременно смилуюсь над ним, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «когда Я говорю против него». Еврейское выражение может означать речь о нём вообще, но в контексте также может подразумевать слова осуждения.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «Мои внутренности волнуются о нём» — древнееврейский образ глубокого сострадания и сердечного влечения; по смыслу: «сердце Моё тоскует по нему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵן יַקִּיר לִי
  choice: Разве Ефрем не дорогой Мне сын
  rationale: Риторический вопрос и יַקִּיר переданы естественным русским выражением «дорогой Мне сын», сохраняющим значение ценности и сердечной привязанности.
- source_word: אִם יֶלֶד שַׁעֲשֻׁעִים
  choice: не любимое дитя
  rationale: שַׁעֲשֻׁעִים обозначает отраду, наслаждение и особую нежность; «любимое дитя» ясно и достойно передаёт эмоциональный смысл без неестественной кальки.
- source_word: כִּי מִדֵּי דַבְּרִי בוֹ
  choice: Ведь всякий раз, когда Я говорю о нём[a]
  rationale: מִדֵּי имеет повторительное значение «всякий раз, когда», а בּוֹ после דבר допускает нейтральное «о нём». Контекстуальное «против него» сохранено в примечании как реальная возможность.
- source_word: זָכֹר אֶזְכְּרֶנּוּ עוֹד
  choice: Я по-прежнему непременно вспоминаю его
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает глагол; «непременно» передаёт эмфазу, а «по-прежнему» — עוֹד.
- source_word: הָמוּ מֵעַי לוֹ
  choice: всё внутри Меня волнуется о нём[b]
  rationale: Перевод сохраняет телесно-эмоциональный образ מֵעַי, но избегает в современном русском грубого или анатомически неуместного буквального выражения.
- source_word: רַחֵם אֲרַחֲמֶנּוּ
  choice: Я непременно смилуюсь над ним
  rationale: Инфинитив абсолютный передаёт усиление, а «смилуюсь» объединяет оттенки глубокого сострадания и милости.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохранено личное имя יהוה в принятой русской транслитерации; «возвещает» передаёт торжественную пророческую формулу.
theological_decisions:
- issue: Ефрем как сын
  choice: Ефрем представлен как олицетворённый народ, к которому Бог обращён с отеческой любовью
  alternative: Ефрем понимается только как отдельный патриарх или племенной предок
  rationale: Контекст Иеремии 31 указывает на северный народ, олицетворённый в образе сына; перевод не устраняет напряжение между предшествующим обличением и продолжающимся состраданием.
- issue: דַבְּרִי בוֹ — речь о Ефреме или против него
  choice: «говорю о нём» в основном тексте
  alternative: «говорю против него» в смысле слов суда
  rationale: Предлог ב допускает более нейтральное значение «о, относительно» и сам по себе не выражает враждебности. Контекст суда делает альтернативу вероятной, поэтому она отмечена, а не исключена.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Сохранены риторический вопрос, эмоциональная телесная образность и два усилительных оборота. Местоимения, относящиеся к Богу, написаны с прописной буквы.
