revisions:
- from: Разве Ефрем не дорогой Мне сын, не любимое дитя? Ведь всякий раз, когда Я говорю о нём[a], Я по-прежнему непременно вспоминаю его. Поэтому всё внутри Меня волнуется о нём[b]; Я непременно смилуюсь над ним, — возвещает Яхве.
  to: Разве Ефрем не дорогой Мне сын, не дитя, которым Я радуюсь? Ведь всякий раз, когда Я говорю о нём[a], Я по-прежнему непременно вспоминаю его. Поэтому сердце Моё тоскует по нему[b]; Я непременно смилуюсь над ним, — возвещает Яхве.
  rationale: 'Уточнены два эмоционально значимых выражения: «дитя, которым Я радуюсь» ближе к значению «дитя радости/услады», а «сердце Моё тоскует по нему» передаёт направленное к Ефрему сострадательное внутреннее волнение. Альтернативное прочтение «говорю против него» и его привязка [a] сохранены; привязка [b] остаётся непосредственно после соответствующего образа.'
