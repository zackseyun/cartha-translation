id: JER.31.9
reference: Jeremiah 31:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בִּ/בְכִ֣י יָבֹ֗אוּ וּֽ/בְ/תַחֲנוּנִים֮ אֽוֹבִילֵ/ם֒ אֽוֹלִיכֵ/ם֙ אֶל נַ֣חֲלֵי מַ֔יִם בְּ/דֶ֣רֶךְ יָשָׁ֔ר לֹ֥א יִכָּשְׁל֖וּ בָּ֑/הּ כִּֽי הָיִ֤יתִי לְ/יִשְׂרָאֵל֙ לְ/אָ֔ב וְ/אֶפְרַ֖יִם בְּכֹ֥רִ/י הֽוּא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/009.yaml
  text: They will come with weeping, and with pleas for mercy[a] I will lead them; I will guide them to streams of water, on a straight path where they will not stumble. For I am a father to Israel, and Ephraim is my firstborn.
translation:
  language: ru
  text: Они придут с плачем, и с мольбами о милости[a] Я поведу их; Я приведу их к водным потокам по прямому пути, на котором они не споткнутся. Ведь Я — Отец Израиля, и Ефрем — Мой первенец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и с мольбами Я поведу их».'
    reason: Лексически תַחֲנוּנִים означает «мольбы, прошения о милости»; более краткий вариант ближе к форме исходного выражения.
lexical_decisions:
- source_word: בִּבְכִי
  choice: с плачем
  rationale: Предлог ב передаёт образ действия или сопровождение. Перевод сохраняет конкретный образ, не уточняя, вызван ли плач покаянием, скорбью или радостью.
- source_word: יָבֹאוּ
  choice: они придут
  rationale: Прямое и естественное соответствие глаголу בוא в данном контексте.
- source_word: וּבְתַחֲנוּנִים
  choice: и с мольбами о милости
  rationale: תחנונים обычно означает мольбы о благосклонности или милости. Формулировка понятна современному читателю и сохраняет молитвенно-реляционный оттенок.
- source_word: אֹבִילֵם
  choice: Я поведу их
  rationale: Порода hифиль глагола יבל выражает ведение или сопровождение.
- source_word: אֹלִיכֵם
  choice: приведу их
  rationale: Hифиль от הלך выражает каузативное движение. Вариация по отношению к «поведу» устраняет тяжёлый повтор, не меняя смысла.
- source_word: נַחֲלֵי מַיִם
  choice: к потокам вод
  rationale: Сочетание обозначает водные потоки или русла; данная формулировка естественна и сохраняет поэтический образ животворной воды.
- source_word: בְּדֶרֶךְ יָשָׁר
  choice: прямым путём
  rationale: Фраза обозначает прямой, ровный и беспрепятственный путь; русский творительный естественно передаёт маршрут движения.
- source_word: לֹא יִכָּשְׁלוּ בָּהּ
  choice: на котором они не споткнутся
  rationale: Местоименный суффикс относится к пути; формулировка явно сохраняет эту связь.
- source_word: כִּי הָיִיתִי לְיִשְׂרָאֵל לְאָב
  choice: Ведь Я — Отец Израилю
  rationale: Стативный qatal утверждает сложившееся, действующее отношение, а не начало отцовства. Настоящее время естественно для русского именного сказуемого.
- source_word: וְאֶפְרַיִם בְּכֹרִי הוּא
  choice: и Ефрем — Мой первенец
  rationale: בכור обозначает первенца, включая статус и наследственное значение; отдельное местоимение הוּא естественно передано русской именной конструкцией.
theological_decisions:
- issue: Характер плача и мольбы народа
  choice: 'Не уточнять причину плача: «с плачем»'
  alternative: «с покаянным плачем» или «плача от радости»
  rationale: Еврейский текст описывает образ их прихода, но не называет эмоциональную или богословскую причину слёз.
- issue: Значение הָיִיתִי в утверждении об отцовстве
  choice: «Я — Отец Израилю»
  alternative: «Я был Отцом Израилю» или «Я стал Отцом Израилю»
  rationale: Стативная форма утверждает установленное отношение. Вариант «стал» необоснованно вносит идею начала отцовства, а простое прошедшее время может ошибочно представить его как прекратившееся.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены параллелизм, образ пути и водных потоков, а также неоднозначность причины плача. Заглавные буквы в местоимениях Бога соответствуют принятой русской библейской издательской норме.
