  text: כִּ֣י יֶשׁ י֔וֹם קָרְא֥וּ נֹצְרִ֖ים בְּ/הַ֣ר אֶפְרָ֑יִם ק֚וּמוּ וְ/נַעֲלֶ֣ה צִיּ֔וֹן אֶל יְהוָ֖ה אֱלֹהֵֽי/נוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/006.yaml
  text: For there will be a day when watchmen will call out on the hill country of Ephraim[a], ‘Rise up, and let us go up to Zion[b], to Yahweh our God.’
translation:
  language: ru
  text: 'Ибо наступит день, когда стражи возгласят в горной местности Ефрема[a]: «Вставайте, взойдём на Сион — к Яхве[b], нашему Богу!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на горе Ефрема»; это выражение может обозначать гористую область Ефрема.'
    reason: geographical_ambiguity
  - marker: b
    text: Яхве — личное имя Бога, переданное еврейскими согласными יהוה (ЙХВХ); традиционно переводится как «Господь».
    reason: divine_name
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет причинно-пояснительную связь с предшествующим обещанием и соответствует возвышенному пророческому регистру.
- source_word: יֶשׁ יוֹם
  choice: наступит день
  rationale: Передаёт ожидаемое будущее время естественным для современного русского языка способом.
- source_word: קָרְאוּ
  choice: возгласят
  rationale: Перфект в пророческом контексте передаёт будущее как несомненное; глагол обозначает публичный громкий призыв.
- source_word: נֹצְרִים
  choice: стражи
  rationale: Причастие от נצר обозначает тех, кто сторожит или охраняет; «стражи» сохраняет конкретный образ и допускает контекстуальные оттенки.
- source_word: בְּהַר אֶפְרָיִם
  choice: на горах Ефрема
  rationale: Единственное число הַר может собирательно обозначать гористую область; русское множественное «на горах» естественно передаёт регион, не создавая образа одной вершины.
- source_word: קוּמוּ
  choice: Вставайте
  rationale: Передаёт повелительное наклонение множественного числа как призыв отправиться в путь.
- source_word: וְנַעֲלֶה
  choice: взойдём
  rationale: Форма когортатива выражает совместное побуждение; «взойдём» сохраняет и движение вверх, и паломнический оттенок.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Устоявшаяся русская передача топонима с сохранением его библейского звучания.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог передаёт направленность движения, а личное имя Яхве непосредственно представляет тетраграмматон.
- source_word: אֱלֹהֵינוּ
  choice: нашему Богу
  rationale: Точно передаёт притяжательную форму и общинное исповедание принадлежности Богу.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон; «Яхве» сохраняет личное заветное имя, а традиционная передача отмечена в сноске.
- issue: Значение נֹצְרִים
  choice: стражи
  alternative: хранители / дозорные
  rationale: «Стражи» естественно сохраняет образ людей, несущих наблюдение или охрану, без внесения дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Прямая речь оформлена как энергичный общий призыв; сохранены образ стражей, восхождение к Сиону и личное имя Бога.
