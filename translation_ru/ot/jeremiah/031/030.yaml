  yaml_path: translation/ot/jeremiah/031/030.yaml
  text: But each man will die for his own iniquity; every person who eats the sour grapes[a], his teeth will be set on edge.
translation:
  language: ru
  text: Но каждый умрёт за собственное беззаконие; у каждого, кто ест кислый виноград[a], на зубах будет оскомина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «незрелый виноград». Еврейское בֹּסֶר обозначает ещё не созревший и потому кислый виноград.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Но
  rationale: Сочетание вводит противопоставление и исправляет смысл отвергнутой в предыдущем стихе пословицы; «но» естественно передаёт эту функцию.
- source_word: אִישׁ
  choice: каждый
  rationale: 'Единственное число имеет здесь распределительное значение: речь идёт о личной ответственности каждого человека.'
- source_word: בַּעֲוֺנוֹ
  choice: за собственное беззаконие
  rationale: עָוֹן может означать беззаконие, вину или её последствие. В данном контексте выражение указывает на личное виновное деяние как основание смерти; «собственное» передаёт местоименный суффикс.
- source_word: יָמוּת
  choice: умрёт
  rationale: Форма выражает провозглашаемое будущее и естественно передаётся совершенным видом в будущем времени.
- source_word: כָּל הָאָדָם
  choice: у всякого
  rationale: Сочетание имеет обобщённо-распределительное значение. «У всякого» сохраняет единственное число и естественно связывается с последующим образом зубов.
- source_word: הָאֹכֵל
  choice: кто ест
  rationale: Причастие употреблено субстантивированно и по-русски естественно передаётся относительным оборотом.
- source_word: הַבֹּסֶר
  choice: кислый виноград
  rationale: בֹּסֶר обозначает недозрелый и потому кислый виноград. Выбор сохраняет вкусовой образ пословицы, а буквальная лексическая альтернатива вынесена в примечание.
- source_word: תִּקְהֶינָה שִׁנָּיו
  choice: оскомина будет на зубах
  rationale: Выражение описывает действие кислого винограда на зубы. Русский оборот с «оскоминой» ясно и естественно передаёт образ, не превращая его в буквальное утверждение о притуплении зубов.
theological_decisions:
- issue: Личная и коллективная ответственность
  choice: Каждый умирает за собственное беззаконие
  alternative: Чисто пословичное высказывание без акцента на личной ответственности
  rationale: Синтаксис противопоставляет этот принцип отвергнутой пословице предыдущего стиха и подчёркивает личную ответственность, не делая более широких доктринальных выводов за пределами данного текста.
translation_notes:
  register: Современный литературный русский язык; формулировка торжественная, но понятная. Сохранены параллелизм, образ пословицы и причинный смысл личной ответственности.
