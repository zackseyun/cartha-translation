source:
  edition: WLC
  text: וְ/לֹ֧א יְלַמְּד֣וּ ע֗וֹד אִ֣ישׁ אֶת רֵעֵ֜/הוּ וְ/אִ֤ישׁ אֶת אָחִי/ו֙ לֵ/אמֹ֔ר דְּע֖וּ אֶת יְהוָ֑ה כִּֽי כוּלָּ/ם֩ יֵדְע֨וּ אוֹתִ֜/י לְ/מִ/קְטַנָּ֤/ם וְ/עַד גְּדוֹלָ/ם֙ נְאֻם יְהוָ֔ה כִּ֤י אֶסְלַח֙ לַֽ/עֲוֺנָ֔/ם וּ/לְ/חַטָּאתָ֖/ם לֹ֥א אֶזְכָּר עֽוֹד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/034.yaml
  text: And they will no longer teach[a], each man his neighbor and each man his brother, saying, ‘Know Yahweh,’ for they will all know me, from the least of them to the greatest of them, declares Yahweh. For I will forgive their iniquity[c][b], and I will remember their sin no more.
translation:
  language: ru
  text: 'И уже не будут они учить — каждый своего ближнего и каждый своего брата, — говоря: «Познайте Яхве», потому что все они будут знать Меня, от малого до великого, — возвещает Яхве. Ведь Я прощу их беззаконие и больше не вспомню их грех.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְלַמְּדוּ
  choice: будут учить
  rationale: Пиэль глагола למד означает «учить, наставлять»; «учить» прямо и естественно передаёт форму.
- source_word: עוֹד ... לֹא
  choice: уже не будут / больше не
  rationale: 'При отрицании עוֹד обозначает прекращение прежнего положения: «уже не», «больше не».'
- source_word: אִישׁ אֶת־רֵעֵהוּ וְאִישׁ אֶת־אָחִיו
  choice: друг друга — каждый своего ближнего и каждый своего брата
  rationale: «Друг друга» естественно вводит взаимно-распределительную конструкцию, а последующее буквальное уточнение сохраняет мужские формы и лексику еврейского текста.
- source_word: דְּעוּ אֶת־יְהוָה
  choice: Познайте Яхве
  rationale: Императив ידע здесь указывает не только на получение сведений, но и на личное, заветное познание; «познайте» передаёт этот оттенок лучше, чем статичное «знайте».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не замещающий его титул.
- source_word: כּוּלָּם יֵדְעוּ אוֹתִי
  choice: все они будут знать Меня
  rationale: Сохраняется прямой личный объект и смысл личного, заветного знания без догматического расширения.
- source_word: לְמִקְטַנָּם וְעַד גְּדוֹלָם
  choice: от самого малого до самого великого
  rationale: Устойчивая русская меристическая формула естественно охватывает всех членов сообщества, не сводя различие только к возрасту или положению.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественную силу пророческой формулы и звучит литературно по-русски.
- source_word: אֶסְלַח לַעֲוֺנָם
  choice: Я прощу их беззаконие
  rationale: סלח — обычный глагол божественного прощения; עָוֹן здесь обозначает нравственную вину или беззаконие и отличается от следующего חַטָּאת.
- source_word: וּלְחַטָּאתָם לֹא אֶזְכָּר עוֹד
  choice: и больше не вспомню их грех
  rationale: Буквально и естественно передаёт обещание не вспоминать грех впредь, не превращая образ памяти в отвлечённое богословское объяснение.
theological_decisions:
- issue: Характер знания Бога в новом завете
  choice: «будут знать Меня»
  alternative: «признают Меня»; «будут состоять со Мной в спасительных отношениях»
  rationale: ידע имеет личный и заветный объём, однако перевод сохраняет широту и напряжение исходного выражения, не сужая его до одной доктринальной формулы.
- issue: Всеобщность знания и прекращение наставления
  choice: Сохранить обе фразы рядом без поясняющего согласования
  alternative: Уточнить, что прекращается только первоначальное наставление о Боге
  rationale: Текст сам ставит рядом отсутствие взаимного призыва познать Яхве и всеобщее знание Бога; перевод не должен заранее устранять возможное богословское напряжение.
- issue: Передача יְהוָה
  choice: «Яхве»
  alternative: «Господь»; «Иегова»
  rationale: Исходный текст употребляет личное имя YHWH; транслитерация сохраняет его как имя и отличает от титула.
- issue: Распределительные мужские формы
  choice: «каждый своего ближнего и каждый своего брата»
  alternative: «каждый другого»; «один другого»
  rationale: Сохраняются грамматически мужские распределительные формы и семейно-заветное слово «брат», при этом вводное «друг друга» обеспечивает естественность русского синтаксиса.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис слегка упрощён ради ясности, но параллелизм, личное имя Яхве, различие между «беззаконием» и «грехом» и богословская неоднозначность глагола «знать» сохранены.
