  variant: modern literary Russian
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/זָרַעְתִּ֗י אֶת בֵּ֤ית יִשְׂרָאֵל֙ וְ/אֶת בֵּ֣ית יְהוּדָ֔ה זֶ֥רַע אָדָ֖ם וְ/זֶ֥רַע בְּהֵמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/027.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will sow the house of Israel and the house of Judah with the seed of man and the seed of beast.
translation:
  language: ru
  text: Вот, наступают дни, — возвещает Яхве, — и Я засею дом Израиля и дом Иуды семенем человеческим[a] и семенем скота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семенем человека»; здесь имеется в виду человеческое потомство, а параллельное выражение «семя скота» указывает на восстановление населения и поголовья скота.'
    reason: Уточнение родового значения אָדָם и смысла сохранённой метафоры.
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-привлекающую силу пророческого вступления и естественно звучит в современном литературном русском.
- source_word: יָמִים בָּאִים
  choice: наступают дни
  rationale: Передаёт устойчивую пророческую формулу будущего без излишнего осовременивания.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт формулу авторитетного пророческого изречения; «возвещает» уместно для возвышенного, но понятного библейского регистра.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, сохраняя его заветную отнесённость и отличая его от титула «Господь».
- source_word: וְזָרַעְתִּי
  choice: и Я засею
  rationale: Сохраняет буквальный сельскохозяйственный образ глагола זרע и сочинительную связь еврейского текста.
- source_word: בֵּית יִשְׂרָאֵל ... בֵּית יְהוּדָה
  choice: дом Израиля и дом Иуды
  rationale: Сохраняет корпоративно-заветное выражение «дом», не сводя его к одним географическим названиям.
- source_word: זֶרַע אָדָם
  choice: семенем человеческим
  rationale: Сохраняет метафору сеяния и родовое значение אָדָם; форма «человеческим» не ограничивает выражение мужчинами.
- source_word: וְזֶרַע בְּהֵמָה
  choice: и семенем скота
  rationale: Сохраняет параллелизм с «семенем человеческим»; בְּהֵמָה здесь имеет собирательное значение домашних животных, то есть скота.
theological_decisions:
- issue: Образ восстановления и нового заселения
  choice: 'Сохранить буквальный образ сеяния: «Я засею… семенем человеческим и семенем скота».'
  alternative: «Я вновь заселю Израиль и Иуду людьми и животными».
  rationale: Более объяснительный вариант сделал бы смысл явным, но устранил бы сельскохозяйственную метафору и её связь с образами сеяния и насаждения в книге Иеремии.
- issue: Родовое значение אָדָם
  choice: Передать как «человеческим» в выражении «семенем человеческим».
  alternative: «семенем человека» или «людьми».
  rationale: В данном месте אָדָם обозначает человечество в целом, а не мужчину; выбранная форма сохраняет и общий смысл, и образ исходного текста.
- issue: Связь между наступающими днями и действием Яхве
  choice: 'Сохранить еврейское сочинение: «наступают дни… и Я засею».'
  alternative: «наступают дни… когда Я засею».
  rationale: Вариант с «когда» естественно выражает подразумеваемую временную связь, но союз ו формально означает «и»; выбранный текст сохраняет структуру и лёгкую смысловую открытость оригинала.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Синтаксис и повтор «семенем… семенем…» намеренно сохраняют параллелизм и метафорическую напряжённость еврейского текста.
