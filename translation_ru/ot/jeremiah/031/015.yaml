base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/015.yaml
  text: 'Thus says Yahweh: “A voice is heard in Ramah[a], lamentation and bitter weeping—Rachel weeping for her children. She refuses to be comforted for her children[b], because they are no more.”'
translation:
  language: ru
  text: 'Так говорит Яхве:


    «Голос слышен в Раме[a] —

    рыдание и горький плач.


    Рахиль плачет о своих детях

    и не желает утешиться из-за своих детей,

    потому что их больше нет[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рама — город, связанный с землёй Вениамина; Рахиль поэтически представлена здесь как праматерь, оплакивающая своих потомков.
    reason: cultural_note
  - marker: b
    text: 'Или: «потому что его больше нет». В еврейском здесь употреблена форма единственного числа, хотя в контексте речь идёт о детях Рахили как о совокупности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, соответствующей еврейской форме и принятой проектной установке.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного русского языка формула пророческого возвещения, сохраняющая торжественный ритм оригинала.
- source_word: קוֹל בְּרָמָה נִשְׁמָע
  choice: Голос слышен в Раме
  rationale: Сохраняет образ «голоса», пассивную конструкцию и локативное значение предлога.
- source_word: נְהִי בְּכִי תַמְרוּרִים
  choice: плач, горькое рыдание
  rationale: Передаёт два элемента скорбной речи и усилительную семантику תַמְרוּרִים естественными русскими сочетаниями.
- source_word: רָחֵל מְבַכָּה עַל בָּנֶיהָ
  choice: Рахиль плачет о своих детях
  rationale: Настоящее время сохраняет живость поэтической сцены; «дети» уместно передаёт коллективное значение בנים как потомков.
- source_word: מֵאֲנָה לְהִנָּחֵם
  choice: не хочет утешиться
  rationale: Передаёт решительный отказ принять утешение и возвратно-пассивный оттенок инфинитива в естественной русской форме.
- source_word: כִּי אֵינֶנּוּ
  choice: потому что их больше нет
  rationale: Контекстуально согласует единственную еврейскую форму с коллективным предшествующим «дети», сохраняя значение отсутствия или утраты.
theological_decisions:
- issue: Число и референт формы אֵינֶנּוּ после коллективного בָּנֶיהָ
  choice: «потому что их больше нет»
  alternative: «потому что его больше нет»
  rationale: Хотя в еврейском стоит форма единственного числа, ближайший смысловой референт — дети Рахили как совокупность. В основном тексте выбран естественный русский коллективный смысл, а грамматическая неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Поэтическое членение сохраняет параллелизм и нарастание скорби. Лексика ясная и достойная, без намеренной архаизации.
