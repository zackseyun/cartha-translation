base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/040.yaml
  text: And the whole valley of the corpses and the ashes[a], and all the terraces as far as the Kidron Valley, as far as the corner of the Horse Gate toward the east, shall be holy to Yahweh[c][b]. It shall not be uprooted or overthrown again forever.
translation:
  language: ru
  text: И вся долина трупов и пепла, и все террасы[a] до долины Кедрона[b], до угла Конских ворот к востоку — всё это будет святыней для Яхве. Оно уже никогда не будет выкорчевано и разрушено[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поля» либо «склоны». Еврейское слово трудно для истолкования; традиционно его связывают с террасированными участками вокруг Иерусалима.'
    reason: lexical_alternative
  - marker: b
    text: 'Можно также перевести: «до потока Кедрон» или «до русла Кедрона»: еврейское слово обозначает как водный поток, часто сезонный, так и долину или русло, по которому он течёт.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее: «больше не будет вырвано с корнем и разрушено вовеки». Глаголы в еврейском тексте стоят в единственном числе; подразумеваемым предметом может быть город или вся описанная местность как единое целое.'
    reason: ambiguity
lexical_decisions:
- source_word: הָעֵמֶק
  choice: долина
  rationale: Обычное топографическое значение עֵמֶק; естественно в описании границ.
- source_word: הַפְּגָרִים
  choice: трупов
  rationale: Прямо передаёт значение мёртвых тел и сохраняет резкий образ осквернённого места.
- source_word: הַדֶּשֶׁן
  choice: пепла
  rationale: В данном контексте, вероятно, имеются в виду кучи золы от жертвоприношений или отходов, а не буквальный «жир».
- source_word: השרמות
  choice: террасы
  rationale: Трудная форма; вероятно, обозначает террасированные участки или склоны вокруг Иерусалима. Неопределённость отмечена в сноске.
- source_word: נַחַל קִדְרוֹן
  choice: долины Кедрон
  rationale: נחל может означать русло, сезонный поток или его долину; в описании границ «долина Кедрон» звучит ясно и естественно.
- source_word: פִּנַּת שַׁעַר הַסּוּסִים
  choice: угла Конских ворот
  rationale: Сохраняет буквальное пространственное значение פִּנָּה и традиционное название ворот.
- source_word: מִזְרָחָה
  choice: к востоку
  rationale: Кратко и естественно передаёт направительное значение формы.
- source_word: קֹדֶשׁ לַיהוָה
  choice: будут святыней для Яхве
  rationale: Именная конструкция относится ко всей перечисленной местности; «святыней» передаёт посвящённость Богу, не только нравственное качество.
- source_word: לֹא יִנָּתֵשׁ
  choice: не выкорчуют
  rationale: Сохраняет характерную для Иеремии метафору искоренения; множественное «их» естественно соотносит обещание со всеми описанными местами.
- source_word: וְלֹא יֵהָרֵס
  choice: не разрушат
  rationale: Прямо передаёт значение сноса или разрушения и образует ясную пару с «не выкорчуют».
- source_word: עוֹד לְעוֹלָם
  choice: уже никогда
  rationale: Естественный русский способ передать усиленное отрицание «больше — навеки».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное заветное имя, стоящее в еврейском тексте; форма «Яхве» наиболее соответствует современной научной реконструкции и предоставленному консультационному слою.
- issue: Объём освящения
  choice: Вся перечисленная территория будет святыней для Яхве
  alternative: Свят только собственно восстановленный город
  rationale: Синтаксис относит קֹדֶשׁ לַיהוָה ко всей описанной области, включая прежде осквернённые места; этот резкий богословский поворот сохранён.
- issue: Число в заключительном обещании
  choice: «Их ... не выкорчуют и не разрушат»
  alternative: «Её ... не выкорчуют и не разрушат»; безличное «там больше ничего не...»
  rationale: Еврейские глаголы стоят в мужском единственном числе, вероятно, подразумевая город или всю местность как единое целое. Русское множественное местоимение естественно охватывает перечисленные участки, не сужая референцию; возможность более буквального образа отмечена сноской.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены топографическая последовательность, мрачный образ прежнего осквернения и характерная для Иеремии метафора искоренения. Все маркеры сносок размещены непосредственно в основном тексте.
