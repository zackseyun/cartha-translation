  text: הַצִּ֧יבִי לָ֣/ךְ צִיֻּנִ֗ים שִׂ֤מִי לָ/ךְ֙ תַּמְרוּרִ֔ים שִׁ֣תִי לִבֵּ֔/ךְ לַֽ/מְסִלָּ֖ה דֶּ֣רֶךְ הלכתי שׁ֚וּבִי בְּתוּלַ֣ת יִשְׂרָאֵ֔ל שֻׁ֖בִי אֶל עָרַ֥יִ/ךְ אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/021.yaml
  text: Set up road markers for yourself[a]; place guideposts for yourself. Set your heart toward the highway, the way you went. Return, virgin Israel[c][b]; return to these your cities.
translation:
  language: ru
  text: Поставь себе путевые знаки[a], установи себе указатели[b]. Обрати сердце своё к большой дороге — к пути, которым ты шла. Возвратись, дева Израиля[c], возвратись в эти свои города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дорожные отметки».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово встречается редко; в данном контексте оно, вероятно, означает ориентиры или указатели вдоль пути.
    reason: lexical_alternative
  - marker: c
    text: Слово «возвратись» может означать как возвращение из изгнания, так и обращение к Богу в верности завету.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיבִי לָךְ צִיֻּנִים
  choice: Поставь себе путевые знаки
  rationale: Императив женского рода обращён к олицетворённому Израилю; צִיֻּנִים обозначает заметные отметки вдоль пути. «Путевые знаки» ясно передаёт дорожный контекст.
- source_word: שִׂמִי לָךְ תַּמְרוּרִים
  choice: установи себе указатели
  rationale: Редкое תַּמְרוּרִים в параллели с צִיֻּנִים и в контексте возвращения вероятнее всего означает ориентиры или указатели на дороге.
- source_word: שִׁתִי לִבֵּךְ
  choice: Обрати сердце своё
  rationale: Сохранена древнееврейская метафора сердца как средоточия внимания, воли и внутренней направленности; глагол «обрати» естественно выражает ориентацию на путь.
- source_word: לַמְסִלָּה
  choice: к большой дороге
  rationale: מְסִלָּה — устроенная, насыпная или главная дорога. «Большая дорога» понятно современному читателю и не вызывает современных ассоциаций слова «магистраль».
- source_word: דֶּרֶךְ הלכתי
  choice: к пути, по которому ты шла
  rationale: 'Форма הלכתי по контексту понимается как 2-е лицо женского рода: Израиль должен держать в памяти прежний путь изгнания, чтобы вернуться по нему.'
- source_word: שׁוּבִי
  choice: Возвратись
  rationale: «Возвратись» сохраняет одновременно пространственный смысл возвращения из изгнания и возможный заветный призыв обратиться к Богу.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: дева Израиля
  rationale: Сохранено пророческое олицетворение народа без превращения выражения в специальный титул.
- source_word: אֶל עָרַיִךְ אֵלֶּה
  choice: в эти твои города
  rationale: Переданы и указательное местоимение, и суффикс принадлежности; необычный, но ясный порядок слов сохраняет смысловое ударение исходного текста.
theological_decisions:
- issue: Характер возвращения, выраженного глаголом שׁוב
  choice: «Возвратись» без ограничения смысла только географическим возвращением или только покаянием
  alternative: «Вернись из изгнания» / «Покайся»
  rationale: Образы дороги, пути и городов непосредственно говорят о возвращении из изгнания, но употребление שׁוב у Иеремии допускает также заветное обращение. Перевод сохраняет оба смысловых измерения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Женский род последовательно отражает обращение к олицетворённому Израилю. Синтаксический параллелизм императивов сохранён; редкий термин снабжён сноской, а богословская многозначность שוב не устранена.
