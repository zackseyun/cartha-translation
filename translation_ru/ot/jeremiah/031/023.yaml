base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/023.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: They will yet say this word in the land of Judah and in its cities, when I restore their fortunes: “May Yahweh bless you, O habitation of righteousness[b], O holy mountain.”'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств, Бог Израиля: «Ещё будут говорить это изречение в земле Иуды и в её городах, когда Я восстановлю их благополучие[a]: „Да благословит тебя Яхве, обитель праведности[b], святая гора!“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Я верну их пленников»; «когда Я возвращу их из плена». Еврейское выражение может означать как возвращение из изгнания, так и восстановление благополучия вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жилище праведности»; возможен также смысл «пастбище праведности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя Бога и передаёт צְבָאוֹת достаточно широко, не ограничивая смысл только земными армиями.
- source_word: עוֹד יֹאמְרוּ אֶת־הַדָּבָר הַזֶּה
  choice: Ещё будут произносить такие слова
  rationale: Передаёт обещание, что это благословение вновь будет звучать; русское «такие слова» естественно вводит прямую речь.
- source_word: בְּאֶרֶץ יְהוּדָה וּבְעָרָיו
  choice: в земле Иуды и в её городах
  rationale: Местоименный суффикс относится к Иудее как земле; форма женского рода естественна по-русски.
- source_word: בְּשׁוּבִי אֶת־שְׁבוּתָם
  choice: когда Я восстановлю их благополучие
  rationale: Еврейская идиома обозначает перемену бедственного положения и может включать возвращение из плена, не сводясь исключительно к нему.
- source_word: יְבָרֶכְךָ
  choice: Да благословит тебя
  rationale: Передаёт пожелательный, благословляющий смысл формы глагола.
- source_word: נְוֵה צֶדֶק
  choice: обитель праведности
  rationale: «Обитель» сохраняет значение места пребывания и подходит как возвышенное, но понятное наименование восстановленного Сиона; пастбищный оттенок слова остаётся возможным и отмечен в сноске.
- source_word: הַר הַקֹּדֶשׁ
  choice: святая гора
  rationale: Прямо и традиционно передаёт наименование Сиона как посвящённой Богу горы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Смысл идиомы שׁוּב שְׁבוּת
  choice: восстановлю их благополучие
  alternative: верну их пленников; возвращу их из плена
  rationale: Контекст предполагает возвращение после изгнания, однако сама идиома допускает более широкий смысл восстановления; основной текст сохраняет эту широту, а сноска указывает более конкретные варианты.
- issue: Характер выражения נְוֵה צֶדֶק
  choice: обитель праведности
  alternative: обитель справедливости; праведное пастбище
  rationale: Сочетание характеризует Сион как место праведности, не устраняя возможного пастбищного оттенка נָוֶה.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис упрощён ровно настолько, чтобы фраза была ясной при чтении вслух; обращение к Сиону сохранено без добавочного междометия «о».
