  text: כִּ֥י הִרְוֵ֖יתִי נֶ֣פֶשׁ עֲיֵפָ֑ה וְ/כָל נֶ֥פֶשׁ דָּאֲבָ֖ה מִלֵּֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/025.yaml
  text: For I have satisfied the weary soul[b][a], and every faint soul I have filled.
translation:
  language: ru
  text: Ибо Я вдоволь напоил утомлённую душу[a] и всякую изнемогающую душу[b] насытил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утомлённую душу освежил»; еврейский глагол буквально означает «дал напиться вдоволь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «скорбящую душу»; еврейское слово может обозначать того, кто чахнет или изнемогает от горя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт пояснительно-причинную связь с окружающим обетованием и сохраняет возвышенный поэтический регистр.
- source_word: הִרְוֵיתִי
  choice: Я вдоволь напоил
  rationale: Порода хифиль глагола רוה означает дать напиться досыта, обильно напоить. Конкретный образ сохранён, а наречие «вдоволь» выражает полноту действия.
- source_word: נֶפֶשׁ עֲיֵפָה
  choice: утомлённую душу
  rationale: נֶפֶשׁ в поэтическом контексте обозначает живого человека и его внутреннее существо; «душа» сохраняет образ и параллелизм. עֲיֵפָה передаёт изнурённость, усталость.
- source_word: וְכָל נֶפֶשׁ דָּאֲבָה
  choice: и всякую изнемогающую душу
  rationale: דָּאֲבָה может описывать того, кто чахнет или изнемогает, в том числе от скорби. «Изнемогающую» сохраняет телесно-душевную широту слова, не сводя его только к печали.
- source_word: מִלֵּאתִי
  choice: насытил
  rationale: Глагол מלא в пиэле буквально означает «наполнил». В сочетании с נֶפֶשׁ русское «насытил» естественно выражает полноту восполнения и поддерживает параллелизм с «вдоволь напоил».
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ
  choice: В обоих полустишиях переведено как «душа»
  alternative: «человек», «живое существо», «внутреннее существо»
  rationale: Поэтическое «душа» сохраняет повтор и говорит о человеке в его целостной живой и внутренней нужде, не утверждая тем самым жёсткого разделения души и тела.
- issue: Временное значение перфектных форм הִרְוֵיתִי и מִלֵּאתִי
  choice: 'Русское прошедшее время: «напоил… насытил»'
  alternative: 'Будущее время: «напою… насыщу»'
  rationale: Еврейский перфект допускает как представление действия совершившимся, так и уверенное изображение обещанного действия. Прошедшее время формально сохраняет формы исходного текста, не устраняя присущую пророческой речи напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейско-поэтическим звучанием. Конкретная метафора питья сохранена; синтаксис остаётся ясным для обычного читателя.
