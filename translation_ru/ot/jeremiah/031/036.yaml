base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/036.yaml
  text: If these fixed ordinances depart from before me[a], declares Yahweh[c][b], then the offspring of Israel also will cease from being a nation before me forever.
translation:
  language: ru
  text: Если эти установления исчезнут из Моего присутствия[a], — говорит Яхве, — тогда и потомки Израиля[b] перестанут быть народом предо Мною во все времена[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отступят от Меня». В контексте имеются в виду установленные законы мироздания, о которых говорится в предыдущем стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «семя Израиля» — собирательное обозначение его потомков.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «во все дни»; это выражение означает непрерывное существование во времени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמֻשׁוּ
  choice: перестанут действовать
  rationale: В контексте установленного порядка творения глагол означает отступление или устранение с назначенного места; по-русски применительно к установлениям естественно передать утрату их действия.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: эти установления
  rationale: Речь идёт об установленном Богом порядке солнца, луны и моря в предыдущем стихе, а не прежде всего о предписаниях людям.
- source_word: מִלְּפָנַי / לְפָנַי
  choice: предо Мною
  rationale: Сохраняет повтор пространственно-реляционного оборота и его торжественное звучание.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу как весомое божественное провозглашение.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: потомки Израиля
  rationale: Естественно передаёт собирательное значение буквального выражения «семя Израиля».
- source_word: יִשְׁבְּתוּ מִהְיוֹת גּוֹי
  choice: перестанут быть народом
  rationale: Глагол выражает прекращение состояния, а גּוֹי здесь обозначает корпоративную общность Израиля; «народ» по-русски естественнее, не устраняя национального смысла.
- source_word: כָּל הַיָּמִים
  choice: на все времена
  rationale: Передаёт буквальную идиому «все дни» как непрерывную длительность, не используя разговорное выражение.
theological_decisions:
- issue: Неизменность существования потомков Израиля как народа пред Богом
  choice: Сохранено прямое условное сопоставление с устойчивостью порядка творения и выражение «потомки Израиля… быть народом предо Мною».
  alternative: Обобщить обещание как чисто духовную или ненародную преемственность.
  rationale: Еврейский текст прямо говорит о потомках Израиля и их существовании как גּוֹי пред Яхве; перевод не разрешает эту богословскую напряжённость посредством поздней системы толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Форма «предо Мною» поддерживает ритм и повтор исходного текста; имя Яхве передано непосредственно. Все сноски отмечены в основном тексте.
