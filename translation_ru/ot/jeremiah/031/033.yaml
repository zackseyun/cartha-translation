base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/033.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], declares Yahweh: I will put my law within them, and I will write it on their hearts. And I will be their God[c][b], and they shall be my people.'
translation:
  language: ru
  text: 'Ибо таков завет, который Я заключу[a] с домом Израиля после тех дней, — возвещает Яхве: Я вложу[c] Мой закон[b] в них и напишу его на их сердцах. Я буду их Богом, а они будут Моим народом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-древнееврейски: «рассеку завет»; это устойчивое выражение со значением «заключу завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Моё наставление». Древнееврейское слово тора может означать как закон, так и наставление.'
    reason: lexical_alternative
  - marker: c
    text: Форма древнееврейского глагола буквально может быть передана как «Я вложил», но в контексте окружающих обещаний она имеет будущее значение.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: כִּי
