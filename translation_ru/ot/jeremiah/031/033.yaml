  rationale: Передаёт пояснительную связь с предшествующим обещанием и сохраняет торжественный, но понятный регистр.
- source_word: הַבְּרִית ... אֶכְרֹת
  choice: завет, который Я заключу
  rationale: «Завет» сохраняет ключевое библейское понятие, а «заключу» естественно передаёт древнееврейскую идиому «высеку/разрежу завет».
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет корпоративное и заветное обозначение народа, не сводя его просто к имени «Израиль».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу и сохраняет личное имя Бога.
- source_word: נָתַתִּי ... בְּקִרְבָּם
  choice: Я вложу ... внутрь них
  rationale: Будущее время определяется рядом обещаний в будущем; «внутрь них» подчёркивает внутреннее действие и соответствует параллели с сердцами.
- source_word: תּוֹרָתִי
  choice: Мой закон
  rationale: В контексте завета «закон» сохраняет нормативный и межтекстовый смысл תּוֹרָה; более широкое значение «наставление» отмечено в сноске.
- source_word: וְעַל לִבָּם אֶכְתֲּבֶנָּה
  choice: и напишу его на их сердцах
  rationale: Сохраняет образ письма на сердце и явно соотносит местоимение с законом.
theological_decisions:
- issue: Перфект נָתַתִּי в контексте будущего завета
  choice: 'Передать будущим временем: «Я вложу»'
  alternative: «Я вложил»
  rationale: Форма морфологически является перфектом, однако окружающие глаголы и обещание будущего завета задают будущее значение. Сноска сохраняет формальную особенность исходного текста.
- issue: Значение תּוֹרָה в обещании нового завета
  choice: «Мой закон»
  alternative: «Моё наставление»
  rationale: Оба значения лексически возможны. «Закон» лучше сохраняет заветный смысл и связь с Божьей волей, не исключая оттенка наставления, указанного в сноске.
- issue: Передача имени יהוה
  choice: «Яхве»
  alternative: «Господь»
  rationale: Транслитерация сохраняет личное заветное имя в исходном тексте, не подменяя его титулом.
