  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה נֹתֵ֥ן שֶׁ֨מֶשׁ֙ לְ/א֣וֹר יוֹמָ֔ם חֻקֹּ֛ת יָרֵ֥חַ וְ/כוֹכָבִ֖ים לְ/א֣וֹר לָ֑יְלָה רֹגַ֤ע הַ/יָּם֙ וַ/יֶּהֱמ֣וּ גַלָּ֔י/ו יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/035.yaml
  text: 'Thus says Yahweh[a], who gives the sun for light by day, the fixed order of the moon and stars for light by night[b], who stirs up the sea so that its waves roar—Yahweh of hosts is his name:'
translation:
  language: ru
  text: 'Так говорит Яхве, дающий солнце для дневного света, установления луны и звёзд для ночного света[a], приводящий море в волнение, так что ревут его волны[b], — имя Его — Яхве Воинств:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уставы луны и звёзд». Еврейское слово может означать установления, уставы или установленный порядок; здесь оно относится к постоянному порядку небесных светил.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «успокаивающий море». В других контекстах еврейский глагол может иметь такое значение, но продолжение «ревут его волны» здесь говорит в пользу значения «приводящий в волнение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена стандартная пророческая формула в настоящем времени; тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: נֹתֵן שֶׁמֶשׁ לְאוֹר יוֹמָם
  choice: дающий солнце, чтобы оно светило днём
  rationale: Причастная форма передана определительным оборотом, а לְ выражено естественной для русского языка конструкцией цели.
- source_word: חֻקֹּת יָרֵחַ וְכוֹכָבִים
  choice: установивший непреложный порядок луны и звёзд
  rationale: חֻקֹּת в космическом контексте обозначает установленный, устойчивый порядок, а не правовые предписания. Глагол «установивший» делает эллиптическую еврейскую конструкцию ясной по-русски.
- source_word: לְאוֹר לָיְלָה
  choice: чтобы они светили ночью
  rationale: Передана целевая функция луны и звёзд с естественным русским согласованием во множественном числе.
- source_word: רֹגַע הַיָּם
  choice: приводящий море в волнение
  rationale: Хотя глагол допускает значение успокоения, последующее упоминание ревущих волн в данном контексте указывает на возбуждение моря.
- source_word: וַיֶּהֱמוּ גַלָּיו
  choice: так что ревут его волны
  rationale: Связь с предшествующим действием передана как результат; «ревут» сохраняет звуковой и поэтический образ המה.
- source_word: יְהוָה צְבָאוֹת שְׁמוֹ
  choice: Яхве Воинств имя Его
  rationale: Сохранены личное имя и широкий смысл традиционного божественного титула צְבָאוֹת без сужения его до одних земных армий.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Значение רֹגַע применительно к морю
  choice: приводящий море в волнение
  alternative: успокаивающий море
  rationale: Семантическая неоднозначность отмечена в сноске, однако непосредственное продолжение «ревут его волны» поддерживает значение возбуждения моря.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Яхве Сил; Яхве армий
  rationale: «Воинств» сохраняет традиционную широту образа небесных и земных сил и не ограничивает титул только человеческими войсками.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Причастные обороты сохраняют структуру еврейского описания Бога; прописное «Его» соответствует принятому благоговейному регистру. Синтаксис завершается двоеточием, поскольку стих вводит последующее высказывание.
