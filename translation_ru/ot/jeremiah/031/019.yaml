source:
  edition: WLC
  text: כִּֽי אַחֲרֵ֤י שׁוּבִ/י֙ נִחַ֔מְתִּי וְ/אַֽחֲרֵי֙ הִוָּ֣דְעִ֔/י סָפַ֖קְתִּי עַל יָרֵ֑ךְ בֹּ֚שְׁתִּי וְ/גַם נִכְלַ֔מְתִּי כִּ֥י נָשָׂ֖אתִי חֶרְפַּ֥ת נְעוּרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/019.yaml
  text: For after I turned back[a], I repented; and after I was instructed, I struck my thigh. I was ashamed, and also humiliated[c][b], because I bore the disgrace of my youth.
translation:
  language: ru
  text: Ведь после того, как я вернулся[a], я раскаялся; а после того, как был вразумлён, я ударил себя по бедру[b]. Я устыдился и был посрамлён, потому что нёс на себе позор моей юности[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после того, как я обратился». Еврейский текст различает возвращение (שׁוב) и последующее раскаяние (נחם).'
    reason: lexical_alternative
  - marker: b
    text: Ударить себя по бедру — древнееврейский жест скорби, потрясения или раскаяния.
    reason: cultural_note
  - marker: c
    text: 'Или: «поношение моей юности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  choice: я вернулся
  rationale: Глагол שׁוב обозначает возвращение или обращение назад. Перевод сохраняет отличие от следующего נחם и не сводит оба действия к одному понятию покаяния.
- source_word: נִחַמְתִּי
  choice: я раскаялся
  rationale: В данном покаянном контексте форма נחם выражает внутреннее сожаление и раскаяние, последовавшее за возвращением.
- source_word: הִוָּדְעִי
  choice: был вразумлён
  rationale: Нифаль от ידע здесь допускает значение «получить знание, быть наставленным». «Был вразумлён» естественно передаёт исправляющее наставление в контексте признания вины.
- source_word: סָפַקְתִּי עַל יָרֵךְ
  choice: я ударил себя по бедру
  rationale: Сохранён телесный жест скорби, потрясения или раскаяния; возвратное «себя» делает русскую фразу однозначной и естественной.
- source_word: בֹּשְׁתִּי
  choice: мне было стыдно
  rationale: Прямо и естественно передаёт переживание стыда в современном литературном русском языке.
- source_word: נִכְלַמְתִּי
  choice: я был унижен
  rationale: Отдельный перевод сохраняет различие между двумя близкими по смыслу еврейскими глаголами и передаёт более сильное переживание посрамления.
- source_word: נָשָׂאתִי
  choice: нёс на себе
  rationale: Передаёт образ несения бремени позора; добавление «на себе» естественно для русского языка и не меняет смысла.
- source_word: חֶרְפַּת נְעוּרָי
  choice: позор моей юности
  rationale: חֶרְפָּה обозначает позор, бесчестье или поношение. Выбранный вариант естественен и сохраняет ретроспективное признание проступков юности.
- source_word: כִּי
  choice: ведь / потому что
  rationale: Первое כִּי понято как пояснительная связь с предшествующим контекстом, а второе — как указание причины стыда и унижения.
theological_decisions:
- issue: Последовательность возвращения и раскаяния в исповеди Ефрема
  choice: 'Сохранены два связанных, но различных действия: «я вернулся» и затем «я раскаялся».'
  alternative: Передать שׁוב как «я покаялся», тем самым сблизив или слив значение обоих глаголов.
  rationale: В еврейском тексте употреблены разные глаголы, שׁוב и נחם. Их различение сохраняет движение от возвращения к внутреннему раскаянию, не навязывая тексту более позднюю доктринальную схему.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохраняет параллелизм исходного текста; близкие по смыслу глаголы стыда не сведены к одному выражению. Все примечания привязаны к соответствующим словам основного текста.
