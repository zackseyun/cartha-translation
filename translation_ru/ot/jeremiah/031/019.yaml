  source_fidelity: В целом перевод точно передаёт последовательность שׁוּב («вернуться/обратиться») и נחם («раскаяться»), пассивный смысл הִוָּדְעִי («быть вразумлённым») и жест «ударить по бедру». Однако «я был унижен» может пониматься как внешнее унижение кем-то, тогда как נִכְלַמְתִּי в данном параллелизме выражает переживание посрамления/стыда. «Был посрамлён» точнее сохраняет этот оттенок, не смешивая два еврейских глагола стыда.
