base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/007.yaml
  text: 'For thus says Yahweh: Sing aloud with gladness for Jacob[a], and shout at the head of the nations; proclaim, praise, and say, “Save, Yahweh, your people, the remnant of Israel.”'
translation:
  language: ru
  text: 'Ибо так говорит Яхве:


    «Пойте с радостью об Иакове

    и ликуйте во главе народов[a]!

    Возвещайте, воздавайте хвалу и говорите:

    „Спаси, Яхве, твой народ —

    остаток Израиля!“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «среди главных народов» или «перед народами». Еврейское выражение допускает понимание как указания на первенство Израиля среди народов либо на публичное провозглашение перед ними.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, не заменяя его титулом.
- source_word: רָנּוּ לְיַעֲקֹב שִׂמְחָה
  choice: Радостно пойте об Иакове
  rationale: Императив обозначает громкое радостное пение; לְיַעֲקֹב допускает значение предмета торжества — «об Иакове».
- source_word: וְצַהֲלוּ
  choice: и ликуйте
  rationale: Передаёт громкое, публичное выражение торжества и сохраняет отличие от предшествующего призыва петь.
- source_word: בְּרֹאשׁ הַגּוֹיִם
  choice: во главе народов
  rationale: Близко следует буквальному значению «в/на главе народов», не устраняя неясность относительно первенства Израиля или места публичного возглашения.
- source_word: הַשְׁמִיעוּ
  choice: возвещайте
  rationale: Каузативная форма שמע призывает сделать весть услышанной, то есть публично её провозглашать.
- source_word: הַלְלוּ
  choice: воздавайте хвалу
  rationale: Передаёт самостоятельный императив הלל и естественно звучит в последовательности призывов.
- source_word: הוֹשַׁע
  choice: спаси
  rationale: Прямо передаёт императив породы хифиль от ישׁע, обращённый к Яхве.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: остаток Израиля
  rationale: Сохраняет значимый пророческий термин для уцелевшей, сохранённой части народа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Смысл בְּרֹאשׁ הַגּוֹיִם
  choice: во главе народов
  alternative: среди главных народов; перед народами
  rationale: 'Еврейское выражение сжато и неоднозначно: оно может указывать на первенство или на публичную сферу возглашения. Основной текст сохраняет его пространственно-ранговый образ, а варианты вынесены в примечание.'
- issue: Связь לְיַעֲקֹב с призывом к пению
  choice: пойте об Иакове
  alternative: пойте Иакову; пойте ради Иакова
  rationale: Предлог ל допускает несколько отношений. «Об Иакове» естественно выражает Иакова как предмет радости, не определяя адресата пения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Параллелизм императивов сохранён; архаизмы сведены к минимуму. Местоимение «Твой» написано с прописной буквы как принятая форма благоговейного обращения, без изменения смысла исходного текста.
