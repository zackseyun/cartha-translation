base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/012.yaml
  text: They will come and shout for joy on the height of Zion[a], and they will stream to the goodness of Yahweh, to the grain, the new wine, and the fresh oil, and to the young of the flock and the herd. Their life will be like a well-watered garden[d][c][b], and they will never again waste away.
translation:
  language: ru
  text: Они придут и будут ликовать на высоте Сиона; они устремятся[b] к благости Яхве[a] — к зерну, молодому вину и свежему оливковому маслу, к молодняку мелкого и крупного скота. Их жизнь[c] будет как обильно орошаемый сад, и они больше не будут изнывать[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к изобилию Яхве». Еврейское слово «благость» здесь включает блага, которые Он дарует, как показывает следующий далее перечень.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальный образ: «потекут к благости Яхве». Еврейский глагол может изображать движение потоком к благам, которые дарует Яхве.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «их нефеш». Здесь это слово означает их жизнь или всю их личность, а не только нематериальную сторону человека.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «больше не будут скорбеть»; «больше не будут чахнуть». Еврейское выражение может обозначать скорбь, от которой человек угасает.'
    reason: lexical_alternative
