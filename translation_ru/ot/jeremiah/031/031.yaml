  yaml_path: translation/ot/jeremiah/031/031.yaml
  text: Look[a], days are coming, declares Yahweh, when I will make a new covenant with the house of Israel and the house of Judah.
translation:
  language: ru
  text: Вот, наступают дни, — возвещает Яхве, — когда Я заключу с домом Израиля и с домом Иуды новый завет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обновлённый завет». Еврейское прилагательное естественнее всего означает «новый», однако некоторые толкователи, подчёркивая преемственность завета, понимают его как «обновлённый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественное для современного литературного русского средство привлечь внимание к торжественному пророческому объявлению; сохраняет указательную силу еврейского слова без архаизации.
- source_word: יָמִים בָּאִים
  choice: наступают дни
  rationale: Передаёт обычную пророческую формулу о грядущем времени и сохраняет значение приближения, выраженное причастием.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет вес и формульный характер пророческого изречения; «возвещает» точнее и торжественнее простого «говорит».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וְכָרַתִּי
  choice: Я заключу
  rationale: Еврейское выражение буквально означает «разрежу завет», но по-русски устойчивый и точный эквивалент — «заключить завет».
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет корпоративный и родовой образ исходного текста, не сводя его просто к «народу Израиля».
- source_word: בֵּית יְהוּדָה
  choice: дом Иуды
  rationale: Сохраняет параллелизм с «домом Израиля» и корпоративный язык оригинала.
- source_word: בְּרִית חֲדָשָׁה
  choice: новый завет
  rationale: חֲדָשָׁה наиболее естественно означает «новый», а בְּרִית — «завет»; вариант «обновлённый завет» является возможным толкованием, но менее прямым лексически.
theological_decisions:
- issue: Следует ли понимать חֲדָשָׁה как «новый» или как «обновлённый» применительно к завету
  choice: новый завет
  alternative: обновлённый завет
  rationale: Прямое и обычное значение прилагательного — «новый». Перевод «обновлённый» подчёркивает преемственность заветов, но вносит в основной текст богословское истолкование; альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис остаётся ясным для обычного читателя; традиционная библейская лексика «дом» и «завет» сохранена ввиду её смысловой точности.
