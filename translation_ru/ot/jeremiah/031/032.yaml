source:
  edition: WLC
  text: לֹ֣א כַ/בְּרִ֗ית אֲשֶׁ֤ר כָּרַ֨תִּי֙ אֶת אֲבוֹתָ֔/ם בְּ/יוֹם֙ הֶחֱזִיקִ֣/י בְ/יָדָ֔/ם לְ/הוֹצִיאָ֖/ם מֵ/אֶ֖רֶץ מִצְרָ֑יִם אֲשֶׁר הֵ֜מָּה הֵפֵ֣רוּ אֶת בְּרִיתִ֗/י וְ/אָנֹכִ֛י בָּעַ֥לְתִּי בָ֖/ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/032.yaml
  text: not like the covenant that I made with their fathers on the day I took them by the hand to bring them out of the land of Egypt[a], my covenant that they themselves broke, though I was their husband, declares Yahweh.
translation:
  language: ru
  text: не такой, как завет, который Я заключил с их отцами в тот день, когда взял их за руку, чтобы вывести их из земли Египта, — Мой завет, который они сами нарушили, хотя Я был им мужем[a], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хотя Я был их Владыкой»; или: «хотя Я властвовал над ними». Еврейский глагол может обозначать как отношения мужа и жены, так и господство; греческая форма, цитируемая в Послании к Евреям 8:9, отражает второй смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא כַבְּרִית
  choice: не такой, как завет
  rationale: Предлог כ выражает сравнение. Формулировка естественна по-русски и сохраняет смысл «не подобный тому завету».
- source_word: כָּרַתִּי
  choice: Я заключил
  rationale: Буквально употреблена древнееврейская идиома «разрезать завет»; русское «заключить завет» точно и идиоматично передаёт её смысл.
- source_word: אֶת אֲבוֹתָם
  choice: с их отцами
  rationale: «Отцы» сохраняет семейно-историческую лексику оригинала; русское управление глагола «заключить» требует предлога «с».
- source_word: בְּיוֹם הֶחֱזִיקִי בְיָדָם
  choice: в тот день, когда взял их за руку
  rationale: Передаёт образ непосредственного руководства и помощи, выраженный формой Hiphil глагола חזק с ביד, без ненужного огрубления.
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם
  choice: чтобы вывести их из Египетской земли
  rationale: «Вывести» является естественным каузативным соответствием Hiphil глагола יצא и сохраняет связь с исходом.
- source_word: אֲשֶׁר הֵמָּה הֵפֵרוּ אֶת בְּרִיתִי
  choice: Мой завет, который они сами нарушили
  rationale: Самостоятельное местоимение הֵמָּה несёт эмфатическое ударение, переданное словом «сами»; הפר по отношению к завету естественно передаётся как «нарушить».
- source_word: וְאָנֹכִי בָּעַלְתִּי בָם
  choice: хотя Я был им мужем
  rationale: Союз передан уступительно ввиду смыслового контраста. בעל допускает брачное значение, хорошо согласующееся с образностью завета у Иеремии; неоднозначность сохранена в сноске.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Так передана торжественная пророческая формула נְאֻם; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Значение בָּעַלְתִּי בָם в описании завета
  choice: хотя Я был им мужем
  alternative: хотя Я был их Владыкой; хотя Я властвовал над ними
  rationale: Масоретский текст естественно допускает брачный образ, соответствующий пророческому изображению отношений завета. Вместе с тем глагол может выражать господство; этот смысл, отражённый также в греческой форме, цитируемой в Евреям 8:9, вынесен в сноску, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сохраняет развернутую структуру оригинала, а тире помогает обозначить пояснительное возвращение к словам «Мой завет». Божественная речь передана с прописным «Я» по принятой русской библейской традиции.
