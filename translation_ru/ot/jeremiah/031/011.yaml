  language: ru
  text: Ибо Яхве выкупил Иакова и избавил его[a] из руки того, кто сильнее его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и искупил его». Еврейский глагол גאל нередко обозначает действие избавителя — в частности, родственника, который защищает права родича, возвращает утраченное или освобождает попавшего в беду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего обещания; «ибо» естественно передаёт пояснительную связь и сохраняет возвышенный, но современный регистр.
- source_word: פָדָה
  choice: выкупил
  rationale: Глагол обозначает освобождение посредством выкупа или избавление от бедствия. «Выкупил» сохраняет образ освобождения и позволяет отличить его от следующего גאל.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Сохранено прямо названное в тексте имя; его собирательное отношение к народу определяется контекстом и не подменяет имя в переводе.
- source_word: וּגְאָלוֹ
  choice: и избавил его
  rationale: גאל часто обозначает действие избавителя, в том числе родственника-заступника, который возвращает или освобождает попавшего в беду. «Избавил» естественно передаёт спасительное действие и не повторяет «выкупил».
- source_word: מִיַּד
  choice: из руки
  rationale: Сохранена понятная по-русски древнееврейская метафора руки как власти или контроля.
- source_word: חָזָק מִמֶּנּוּ
  choice: того, кто сильнее его
  rationale: Передана сравнительная конструкция и мужской род единственного числа без уточнения личности противника, которой текст не называет.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Соотношение פדה и גאל в поэтическом параллелизме
  choice: выкупил … и избавил
  alternative: искупил … и искупил; выкупил … и выкупил
  rationale: Два близких по смыслу глагола переданы родственными, но разными русскими словами, чтобы сохранить параллелизм и оттенок גאל как действия избавителя, не превращая различие слов в отдельную богословскую схему.
- issue: Референт выражения «сильнее его»
  choice: того, кто сильнее его
  alternative: сильнейшего; того, кто был ему не по силам
  rationale: Сохранено неопределённое личное обозначение и прямое сравнение с Иаковом; противник не идентифицируется сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Метафора «из руки» сохранена как ясный образ власти; синтаксис сделан естественным для русского языка. Маркер сноски помещён непосредственно после соответствующего текста.
