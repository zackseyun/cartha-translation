lexical_decisions:
- source_word: וְיָצָא
  choice: протянется
  rationale: В пророческом контексте форма передаёт будущее действие. Русское «протянется» естественно описывает движение мерного шнура и сохраняет пространственный образ, стоящий за буквальным «выйдет».
- source_word: עוֹד
  choice: дальше
  rationale: В описании расширяющейся границы слово указывает на дальнейшее пространственное продолжение; возможное значение «снова» отмечено в сноске.
- source_word: קוה הַמִּדָּה
  choice: мерный шнур
  rationale: Сочетание обозначает шнур, применяемый при измерении или разметке. Этот вариант ясен современному читателю и сохраняет конкретный образ.
- source_word: נֶגְדּוֹ
  choice: прямо вперёд
  rationale: Так естественно передаётся направление продолжения границы, однако местоименный суффикс «его/неё» в еврейском тексте не выражен в основном переводе и поэтому отмечен сноской.
- source_word: עַל
  choice: до
  rationale: При глаголе пространственного продолжения и названии ориентира «до холма» естественно передаёт достижение обозначенной точки.
- source_word: גִּבְעַת גָּרֵב
  choice: холм Гарев
  rationale: Сочетание представляет собой существительное в сопряжённой форме с географическим названием; название транслитерировано с еврейского.
- source_word: וְנָסַב
  choice: а затем повернёт
  rationale: Глагол означает поворот или огибание. В описании границы «повернёт» звучит кратко и естественно, а «затем» передаёт последовательность.
- source_word: גֹּעָתָה
  choice: к Гоа
  rationale: Географическое название имеет направительный суффикс, который передан предлогом «к».
