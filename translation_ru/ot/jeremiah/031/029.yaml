  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם לֹא יֹאמְר֣וּ ע֔וֹד אָב֖וֹת אָ֣כְלוּ בֹ֑סֶר וְ/שִׁנֵּ֥י בָנִ֖ים תִּקְהֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/029.yaml
  text: In those days they will no longer say[a], ‘The fathers have eaten sour grapes, and the sons’ teeth are set on edge.’
translation:
  language: ru
  text: 'В те дни уже не будут говорить: «Отцы ели кислый виноград, а оскомина на зубах у сыновей».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Отцы ели незрелый виноград, а зубы у сыновей притупляются».'
    reason: Более буквальная передача בֹסֶר и תִּקְהֶינָה.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Устойчивое и естественное соответствие пророческому временному обороту.
- source_word: לֹא יֹאמְרוּ עוֹד
  choice: уже не будут говорить
  rationale: Сохраняет активную форму с неопределённым субъектом во множественном числе и значение прекращения прежней речи.
- source_word: אָבוֹת
  choice: отцы
  rationale: Передаёт конкретное мужское обозначение родства в еврейском тексте, не расширяя его до «предков» или «родителей».
- source_word: אָכְלוּ
  choice: ели
  rationale: Русское прошедшее время естественно звучит в пословичном высказывании и передаёт завершённое действие, последствия которого обсуждаются.
- source_word: בֹסֶר
  choice: кислый виноград
  rationale: Передаёт ощутимую кислость незрелых ягод и естественно сочетается с образом оскомины; буквальное «незрелый виноград» дано в примечании.
- source_word: וְשִׁנֵּי בָנִים
  choice: а ... на зубах у сыновей
  rationale: Сохраняет образ зубов и мужское обозначение «сыновья», одновременно используя естественный русский порядок слов.
- source_word: תִּקְהֶינָה
  choice: оскомина
  rationale: Идиоматически передаёт неприятное ощущение притуплённости зубов от кислого плода, не вводя неясного буквального выражения.
theological_decisions:
- issue: Передача терминов родства в пословице
  choice: Сохранены «отцы» и «сыновья»
  alternative: «родители» и «дети»
  rationale: Еврейский текст употребляет мужские термины родства. Их сохранение точнее передаёт форму пословицы, тогда как её смысл по-прежнему ясно относится к последствиям для следующего поколения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Пословичный образ передан естественным выражением «оскомина на зубах»; синтаксис и мужские термины родства сохранены без архаизации.
