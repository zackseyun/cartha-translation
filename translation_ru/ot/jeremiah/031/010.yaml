  text: שִׁמְע֤וּ דְבַר יְהוָה֙ גּוֹיִ֔ם וְ/הַגִּ֥ידוּ בָ/אִיִּ֖ים מִ/מֶּרְחָ֑ק וְ/אִמְר֗וּ מְזָרֵ֤ה יִשְׂרָאֵל֙ יְקַבְּצֶ֔/נּוּ וּ/שְׁמָר֖/וֹ כְּ/רֹעֶ֥ה עֶדְרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/010.yaml
  text: Hear the word of the LORD, O nations, and declare it in the coastlands far away; say, “He who scattered Israel will gather him and will keep him as a shepherd keeps his flock.”
translation:
  language: ru
  text: 'Слушайте слово ГОСПОДА, народы, и возвестите его на далёких островах; скажите: «Рассеявший Израиль соберёт его и будет хранить его, как пастух своё стадо».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גּוֹיִם
  choice: народы
  rationale: Обращение к множеству народов; современное нейтральное соответствие без устаревшего звательного оборота.
- source_word: אִיִּים
  choice: островах
  rationale: Основное значение — острова; в пророческой речи слово может охватывать далёкие морские земли, однако более конкретный образ исходного текста сохранён.
- source_word: מְזָרֵה
  choice: Рассеявший
  rationale: Причастная форма обозначает того, кто рассеял; субстантивированное причастие естественно передано по-русски.
- source_word: וּשְׁמָרוֹ
  choice: будет хранить его
  rationale: Глагол שׁמר означает беречь, охранять, хранить; «хранить» сохраняет пастырский образ и связь с Израилем в мужском роде.
- source_word: כְּרֹעֶה עֶדְרוֹ
  choice: как пастух своё стадо
  rationale: Кратко и естественно воспроизводит сравнение; притяжательное местоимение отражает суффикс עֶדְרוֹ.
theological_decisions:
- issue: Обозначение Божьего имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Традиционная русская передача тетраграмматона прописными буквами сохраняет различие с обычным титулом «Господь» и подходит для общедоступного межконфессионального текста.
- issue: К кому относится местоимение в יְקַבְּצֶנּוּ וּשְׁמָרוֹ
  choice: 'к Израилю как к собирательному целому: «его»'
  alternative: «их», подразумевая отдельных израильтян
  rationale: Еврейские суффиксы стоят в мужском роде единственного числа и грамматически относятся к имени «Израиль»; собирательность не превращена в явное множественное число.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Императивы переданы прямо; параллелизм и пастырская метафора сохранены. «Возвестите» выбрано как достойное, но понятное соответствие публичному провозглашению.
