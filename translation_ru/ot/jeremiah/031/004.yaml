base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/004.yaml
  text: Again I will build you[a], and you will be built, O virgin Israel[c][b]; again you will adorn yourself with your tambourines and go out in the dance of those who celebrate.
translation:
  language: ru
  text: Снова Я построю тебя — и ты будешь построена[a], дева Израиля[b]! Снова ты украсишь себя своими бубнами и выйдешь в пляске с ликующими[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я снова отстрою тебя — и ты будешь отстроена». В еврейском тексте дважды употреблён один и тот же корень: «Я построю тебя — и ты будешь построена»; по контексту речь идёт о восстановлении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «девица Израиля». Это метафорическое обращение к Израилю.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «выйдешь в пляске с веселящимися».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: снова
  rationale: В контексте восстановления указывает на возобновление прежнего благополучия; повтор слова в обеих частях стиха сохранён.
- source_word: אֶבְנֵךְ וְנִבְנֵית
  choice: Я отстрою тебя — и ты будешь отстроена
  rationale: Однокоренные активная и страдательная формы передают повтор еврейского корня בנה и одновременно ясно выражают восстановление после разорения.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: дева Израиля
  rationale: Сохранено прямое метафорическое обращение к Израилю; слово «дева» звучит в современном литературном русском естественнее, чем буквальное «девственница».
- source_word: תַּעְדִּי תֻפַּיִךְ
  choice: ты украсишь себя своими бубнами
  rationale: Передан образ праздничного убранства с бубнами без замены глагола более общим «возьмёшь».
- source_word: וְיָצָאת בִּמְחוֹל מְשַׂחֲקִים
  choice: выйдешь плясать среди ликующих
  rationale: Естественно передаёт выход для совместной праздничной пляски; причастие משׂחקים понято как обозначение радующихся участников торжества.
theological_decisions:
- issue: Метафорическое обращение «дева Израиля» в пророчестве о восстановлении
  choice: Сохранить метафору без разъясняющего расширения.
  alternative: «дочь Израиля» или истолковывающее описание восстановленного Израиля
  rationale: Еврейский текст прямо называет Израиль «девой»; перевод сохраняет пророческий образ восстановленной молодости, чистоты и радости, не превращая его в буквальное утверждение о девственности.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Обращение оформлено без архаического «о»; восклицательный знак обозначает звательный характер сочетания. Лексика «бубны», «плясать», «ликующие» доступна современному читателю и сохраняет праздничный образ.
