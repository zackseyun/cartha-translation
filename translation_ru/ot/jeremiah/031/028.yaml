  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֞ה כַּ/אֲשֶׁ֧ר שָׁקַ֣דְתִּי עֲלֵי/הֶ֗ם לִ/נְת֧וֹשׁ וְ/לִ/נְת֛וֹץ וְ/לַ/הֲרֹ֖ס וּ/לְ/הַאֲבִ֣יד וּ/לְ/הָרֵ֑עַ כֵּ֣ן אֶשְׁקֹ֧ד עֲלֵי/הֶ֛ם לִ/בְנ֥וֹת וְ/לִ/נְט֖וֹעַ נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/028.yaml
  text: And it shall be that[a], just as I watched over them to uproot and to tear down and to overthrow and to destroy and to bring harm, so I will watch over them to build and to plant, declares Yahweh.
translation:
  language: ru
  text: 'И будет так: как Я неусыпно следил за ними, чтобы искоренять и разрушать, сносить и уничтожать, навлекать на них бедствие[a], так Я буду неусыпно следить за ними, чтобы созидать и насаждать, — возвещает Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «причинять вред». Еврейский глагол может означать причинение беды, вреда или несчастья как суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Краткая и естественная для пророческой речи формула вводит будущее событие, не прибегая к архаичному «и будет так».
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: как ... так
  rationale: Сохраняет явное соответствие между прежним судом и грядущим восстановлением.
- source_word: שָׁקַדְתִּי / אֶשְׁקֹד
  choice: неусыпно следил / буду неусыпно следить
  rationale: Передаёт не простое наблюдение, а бдительное, целенаправленное внимание; одинаковая формулировка сохраняет параллелизм суда и восстановления.
- source_word: עֲלֵיהֶם
  choice: за ними
  rationale: Естественное русское управление при глаголе «следить»; контекст показывает, что в первой половине это наблюдение ведёт к суду, а во второй — к восстановлению.
- source_word: לִנְתוֹשׁ
  choice: искоренять
  rationale: Сохраняет образ вырывания с корнем и хорошо соотносится с последующим «насаждать».
- source_word: וְלִנְתּוֹץ
  choice: разрушать
  rationale: Передаёт разбор или разрушение построенного и естественно звучит в современной русской речи.
- source_word: וְלַהֲרֹס
  choice: сносить
  rationale: Позволяет различить этот глагол и последующее הַאֲבִיד, сохраняя накопительный ряд образов разрушения.
- source_word: וּלְהַאֲבִיד
  choice: уничтожать
  rationale: Прямо передаёт каузативное значение «губить, приводить к гибели».
- source_word: וּלְהָרֵעַ
  choice: навлекать бедствие
  rationale: В контексте Божьего суда глагол обозначает причинение беды или несчастья; формулировка не приписывает Богу нравственного зла и сохраняет судебную направленность действия.
- source_word: לִבְנוֹת
  choice: созидать
  rationale: Передаёт восстановительное строительство и образует уместный смысловой контраст с рядом разрушительных действий.
- source_word: וְלִנְטוֹעַ
  choice: насаждать
  rationale: Сохраняет земледельческий образ и прямой контраст с «искоренять».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Естественная современная формула пророческого изречения; личное имя יְהוָה передано транслитерацией «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя Бога; «Яхве» непосредственно передаёт это имя, не заменяя его титулом.
- issue: Значение וּלְהָרֵעַ применительно к Божьему суду
  choice: навлекать бедствие
  alternative: причинять вред; делать зло
  rationale: Формулировка сохраняет значение причиняемого несчастья или бедствия, не снимая тяжести Божьего суда и одновременно не создавая впечатления, будто речь идёт о нравственном зле со стороны Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Пятикратный ряд разрушительных действий и двучленный ряд восстановления сохранены; повтор «неусыпно следил / буду неусыпно следить» подчёркивает намеренный параллелизм исходного текста. Маркер [a] поставлен непосредственно при словах, к которым относится лексическая альтернатива.
