base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/002.yaml
  text: 'Thus says Yahweh: The people who survived the sword found favor in the wilderness; Israel[a], when it went to find rest for him.'
translation:
  language: ru
  text: 'Так говорит Яхве:


    «Народ, уцелевший от меча,

    обрёл благоволение в пустыне;

    Израиль шёл, чтобы обрести покой[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная еврейская фраза трудна и допускает иное понимание: «когда он шёл, чтобы дать ему покой, — Израилю». Неясны подразумеваемое подлежащее и референт слова «ему»; возможна также интерпретация, согласно которой Бог идёт, чтобы дать Израилю покой.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом; соответствует заветному контексту и исходному еврейскому тексту.
- source_word: מָצָא חֵן
  choice: обрёл благоволение
  rationale: Еврейская идиома означает получить чьё-либо расположение или милость. «Обрёл благоволение» естественно и достойно звучит по-русски, не привнося более поздних богословских оттенков слова «благодать».
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר может обозначать пустынную, малонаселённую местность или степь; «пустыня» сохраняет также явную перекличку с исходом.
- source_word: עַם שְׂרִידֵי חָרֶב
  choice: народ, уцелевший от меча
  rationale: Сохраняет образ меча как войны и суда и ясно передаёт значение «остаток/уцелевшие от меча».
- source_word: הָלוֹךְ
  choice: шёл
  rationale: Инфинитив абсолютный в сжатой и трудной конструкции передан личной формой движения, не устраняющей неоднозначность всей заключительной фразы.
- source_word: לְהַרְגִּיעוֹ
  choice: чтобы обрести покой
  rationale: Форма буквально связана с тем, чтобы дать или доставить покой, и содержит местоименный суффикс мужского рода. В основном тексте она передана идиоматически и рефлексивно по отношению к Израилю; буквальная каузативная возможность сохранена в примечании.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятая русская форма имени; поставленная в начале заключительной строки, она поясняет, что названный выше народ — Израиль.
theological_decisions:
- issue: Синтаксис и референт заключительной фразы הָלוֹךְ לְהַרְגִּיעוֹ יִשְׂרָאֵל
  choice: «Израиль шёл, чтобы обрести покой»
  alternative: '«Я шёл, чтобы дать Израилю покой»; буквально также возможно: «Израиль шёл, чтобы дать ему покой»'
  rationale: 'Еврейская фраза синтаксически сжата: неясны подразумеваемое подлежащее инфинитивной конструкции, функция имени «Израиль» и референт суффикса «ему». Основной текст даёт естественное русское прочтение, связывающее движение с Израилем, а примечание сохраняет важную альтернативу, где говорящий Бог даёт Израилю покой.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Поэтическое членение отражает параллелизм и облегчает чтение; архаизмы избегаются. Неоднозначность последней фразы не скрыта, а обозначена примечанием.
