base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/017.yaml
  text: There is hope for your future[a], declares Yahweh[b], and your children will return to their own territory.
translation:
  language: ru
  text: Есть надежда на твоё будущее[a], — возвещает Яхве, — и твои дети[b] вернутся на свою землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «есть надежда на твою последующую участь»; возможно также: «на твой исход».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыновья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ תִּקְוָה
  choice: Есть надежда
  rationale: Естественная русская передача бытийной конструкции; начальный союз не выражен отдельно, поскольку здесь он продолжает утешительное заверение предыдущего стиха и по-русски может быть опущен без потери смысла.
- source_word: לְאַחֲרִיתֵךְ
  choice: на твоё будущее
  rationale: אַחֲרִית может обозначать конец, последующую участь или будущее. В контексте обещанного восстановления современное выражение «на твоё будущее» ясно передаёт направленную вперёд надежду, не исключая смысла конечного исхода.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт весомость устойчивой пророческой формулы и сохраняет личное имя Бога, выраженное тетраграмматоном.
- source_word: וְשָׁבוּ
  choice: вернутся
  rationale: Форма совершенного вида в данном пророческом контексте выражает уверенно обещанное будущее возвращение.
- source_word: בָנִים
  choice: твои дети
  rationale: Формально существительное означает «сыновья», но здесь речь идёт о потомках Рахили, находящихся в изгнании; «дети» естественно передаёт собирательный смысл. Притяжательное «твои» восстанавливает очевидную связь с обращением к Рахили.
- source_word: לִגְבוּלָם
  choice: в свои пределы
  rationale: גְּבוּל означает границу, пределы или территорию. Русское «в свои пределы» сохраняет пространственно-территориальный образ и естественно обозначает возвращение на принадлежащую им землю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Кого обозначает בָנִים
  choice: твои дети
  alternative: сыновья
  rationale: Обращение продолжает олицетворение Рахили как матери изгнанного народа. Выбор «дети» не ограничивает обещание только мужчинами, а буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Женский род местоимения «твоё» соответствует обращению к Рахили в контексте. Формулировка сохраняет двусмысленность אַחֲרִית в сноске и территориальный оттенок גְּבוּל.
