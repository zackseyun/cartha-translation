base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/022.yaml
  text: 'How long will you waver[c][b][a], faithless daughter? For Yahweh has created a new thing in the land: a woman will surround a man.'
translation:
  language: ru
  text: 'Долго ли ты будешь метаться[a], неверная дочь[b]? Ведь Яхве создал нечто новое на земле[c]: женщина окружит мужчину[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будешь отворачиваться» или «будешь ускользать».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своенравная дочь», «отступившая дочь». Еврейское слово указывает на неверность и отступление от отношений завета.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в стране». Еврейское слово может означать и землю вообще, и определённую страну; в данном контексте, вероятно, имеется в виду земля Израиля.'
    reason: lexical_alternative
  - marker: d
    text: 'Последняя фраза трудна и вызывает много споров. Здесь она переведена буквально. Среди возможных толкований: «женщина будет добиваться мужчины», «слабая одолеет сильного» или образ восстановленного Израиля, возвращающегося к Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתְחַמָּקִין
  choice: будешь уклоняться
  rationale: Глагол חמק передаёт уклонение, ускользание или поворот в сторону. «Будешь уклоняться» естественно звучит по-русски и сохраняет как образ движения, так и смысл непостоянства, не сводя его к одному толкованию.
- source_word: הַבַּת הַשּׁוֹבֵבָה
  choice: неверная дочь
  rationale: В книге Иеремии שׁוֹבֵבָה обозначает своенравие и отступничество в отношениях завета. «Неверная дочь» сохраняет женское обращение и его заветный оттенок; возможные более буквальные варианты вынесены в сноску.
- source_word: כִּי
  choice: ведь
  rationale: כִּי вводит основание предшествующего вопроса. Русское «ведь» ясно и естественно передаёт эту логическую связь.
- source_word: בָרָא
  choice: создал
  rationale: Форма qatal представлена русским совершенным видом в прошедшем времени. Так сохраняется грамматическая форма еврейского текста, хотя в пророческой речи возможно и отнесение к будущему.
- source_word: חֲדָשָׁה
  choice: нечто новое
  rationale: Прилагательное употреблено субстантивно. «Нечто новое» естественно по-русски и не уточняет намеренно открытый образ.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: אֶרֶץ может означать как землю вообще, так и определённую страну или землю Израиля. Основной текст сохраняет широкое русское выражение, а контекстуальную возможность отмечает сноска.
- source_word: נְקֵבָה
  choice: женщина
  rationale: Буквальное значение — «особь женского пола», но при человеческом референте современное и достойное русское соответствие — «женщина».
- source_word: תְּסוֹבֵב
  choice: окружит
  rationale: Основное значение סבב — обходить вокруг, окружать. Поскольку смысл всей фразы спорен, перевод сохраняет конкретное лексическое значение и не подменяет его толкованием вроде «станет искать любви» или «защитит».
- source_word: גָּבֶר
  choice: мужчину
  rationale: גֶּבֶר означает взрослого мужчину и иногда несёт оттенок силы. «Мужчину» — прозрачный перевод, не усиливающий этот возможный оттенок до «сильного человека» или «воина».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией «Яхве», а не заменено титулом.
theological_decisions:
- issue: Смысл трудной фразы נְקֵבָה תְּסוֹבֵב גָּבֶר
  choice: 'Сохранить в основном тексте буквальный образ: «женщина окружит мужчину».'
  alternative: 'Возможны толкования: «женщина будет добиваться мужчины», «слабая одолеет сильного», образ возвращения Израиля к Яхве или «женщина защитит мужчину».'
  rationale: Отдельные слова понятны, но смысл сочетания остаётся предметом споров. Буквальный перевод сохраняет подлинную неоднозначность и не закрепляет в тексте одно богословское объяснение.
- issue: Временная сила בָרָא в пророческой речи
  choice: «создал»
  alternative: «создаст» или «создаёт»
  rationale: Еврейская форма qatal прежде всего представляет действие как совершившееся или завершённое. Возможное пророческое указание на будущее не исключается, но не вводится в основной текст принудительно.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краток и доступен; «ведь» естественно связывает обетование с вопросом. Необычность заключительного образа намеренно сохранена, а не сглажена толкованием.
