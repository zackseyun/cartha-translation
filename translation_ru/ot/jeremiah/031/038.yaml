  text: הִנֵּ֛ה יָמִ֥ים נְאֻם יְהוָ֑ה וְ/נִבְנְתָ֤ה הָ/עִיר֙ לַֽ/יהוָ֔ה מִ/מִּגְדַּ֥ל חֲנַנְאֵ֖ל שַׁ֥עַר הַ/פִּנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/038.yaml
  text: Behold[a], days are coming, declares Yahweh, when the city will be rebuilt for Yahweh, from the Tower of Hananel to the Corner Gate.
translation:
  language: ru
  text: Вот, наступают дни, — возвещает Яхве, — когда город будет отстроен[a] для Яхве от башни Хананэла до Угловых ворот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «построен»; еврейская пассивная форма допускает оба значения, хотя контекст восстановления города поддерживает перевод «отстроен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה יָמִים
  choice: Вот, наступают дни
  rationale: Сохраняет указательно-торжественную силу הִנֵּה и естественно передаёт пророческую формулу о грядущем времени.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт формальный и авторитетный характер пророческой формулы, сохраняя личное имя יְהוָה.
- source_word: וְנִבְנְתָה
  choice: будет отстроен
  rationale: Нифаль требует пассивного значения; контекст восстановления Иерусалима поддерживает смысл повторного строительства, однако не исключает более общее «будет построен».
- source_word: הָעִיר
  choice: город
  rationale: В еврейском тексте Иерусалим подразумевается контекстом, но прямо не назван, поэтому уточнение не добавляется.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: 'Предлог ל здесь естественно выражает предназначение или принадлежность: восстановленный город посвящён Яхве.'
- source_word: מִמִּגְדַּל חֲנַנְאֵל
  choice: от башни Хананэла
  rationale: מִן обозначает начальную точку указанного участка; имя собственное передано транслитерацией.
- source_word: שַׁעַר הַפִּנָּה
  choice: до Угловых ворот
  rationale: Предлог «до» естественно восполняет конечную точку диапазона, начатого словом «от»; название городских ворот передано в принятой русской форме.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон — личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Смысл посвящения города в לַיהוָה
  choice: для Яхве
  alternative: Яхве; в честь Яхве
  rationale: Формулировка сохраняет широкий смысл предназначения и принадлежности, не уточняя сверх текста характер посвящения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Пунктуация выделяет формулу божественного речения, не нарушая плавности фразы; топонимические названия оформлены как имена собственные.
