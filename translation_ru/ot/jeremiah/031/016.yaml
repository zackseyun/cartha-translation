    issue: Неестественная передача плача и неудачная альтернативная сноска
    rationale: «Удержи свой голос от плача» формально близко к оригиналу, но в современном русском звучит шероховато; «не давай своему голосу плакать» семантически и стилистически неудачно. «Удержи свой голос от рыданий» сохраняет образ голоса и естественно выражает призыв прекратить плач.
  - severity: low
    issue: «Из земли врага» несколько буквальное
    rationale: Для אֶרֶץ в контексте изгнания «страна» является естественным современным русским эквивалентом. Единственное число «врага» сохранено.
