  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה מִנְעִ֤י קוֹלֵ/ךְ֙ מִ/בֶּ֔כִי וְ/עֵינַ֖יִ/ךְ מִ/דִּמְעָ֑ה כִּי֩ יֵ֨שׁ שָׂכָ֤ר לִ/פְעֻלָּתֵ/ךְ֙ נְאֻם יְהוָ֔ה וְ/שָׁ֖בוּ מֵ/אֶ֥רֶץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/016.yaml
  text: 'Thus says Yahweh: Restrain your voice from weeping and your eyes from tears[a], for there is a reward for your work, declares Yahweh[b], and they will return from the land of the enemy.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Удержи свой голос от рыданий, а глаза — от слёз[а], потому что за твой труд есть награда, — возвещает Яхве, — и они вернутся из страны врага[б]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: 'Или: «Удержи свой голос от плача».'
    reason: lexical_alternative
  - marker: б
    text: Из контекста следует, что «они» — дети Рахили, то есть изгнанники.
    reason: cross_reference
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена традиционная формула пророческой речи; личное имя יְהוָה передано как «Яхве».
- source_word: מִנְעִי
  choice: Удержи
  rationale: Повелительная форма женского рода обращена к олицетворённой Рахили. «Удержи» сохраняет прямой образ сдерживания, не сводя выражение к пересказу «перестань плакать».
- source_word: קוֹלֵךְ מִבֶּכִי
  choice: свой голос от плача
  rationale: Передан конкретный еврейский образ голоса, звучащего в плаче; возвратное «свой» естественно при русском повелительном обращении.
- source_word: וְעֵינַיִךְ מִדִּמְעָה
  choice: и свои глаза — от слёз
  rationale: Сохранены телесный образ и синтаксический параллелизм; тире обозначает естественно опущенный повтор глагола «удержи».
- source_word: כִּי יֵשׁ שָׂכָר
  choice: потому что ... будет награда
  rationale: שָׂכָר допускает значения награды, платы или воздаяния. «Награда» естественна в контексте обещания, а будущее время по-русски ясно выражает направленность обещания.
- source_word: לִפְעֻלָּתֵךְ
  choice: за твой труд
  rationale: «Труд» передаёт деятельность и понесённые усилия, не придавая выражению исключительно коммерческого смысла.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современным литературным выражением, отличимым от начального «Так говорит Яхве».
- source_word: וְשָׁבוּ
  choice: и они вернутся
  rationale: Сохранён неуточнённый субъект третьего лица множественного числа и будущее значение глагольной формы в пророческом контексте.
- source_word: מֵאֶרֶץ אוֹיֵב
  choice: из земли врага
  rationale: Сохранена конструкция с существительным в единственном числе; «враг» может пониматься собирательно или как обозначение враждебной силы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Неявный субъект וְשָׁבוּ
  choice: они вернутся
  alternative: твои дети вернутся; изгнанники вернутся
  rationale: В еврейском тексте субъект не назван. Местоимение «они» сохраняет лаконичность и неоднозначность стиха, тогда как контекст поясняет, что речь идёт о детях Рахили, то есть об изгнанниках.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Образный параллелизм оригинала сохранён без архаизмов; обращение в женском роде ясно из форм и контекста, хотя в русском переводе повелительное «удержи» само по себе рода не выражает.
