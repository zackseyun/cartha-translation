revisions:
- from: 'Так говорит Яхве: «Удержи свой голос от плача и свои глаза — от слёз[а], потому что за твой труд будет награда, — возвещает Яхве, — и они вернутся из земли врага[б]».'
  to: 'Так говорит Яхве: «Удержи свой голос от рыданий, а глаза — от слёз[а], потому что за твой труд есть награда, — возвещает Яхве, — и они вернутся из страны врага[б]».'
  rationale: Исправлена русская идиоматика в первом параллельном члене и в альтернативной сноске, при этом сохранены образ «голоса», призыв удержаться от плача и параллелизм с глазами и слезами. «Страна врага» делает значение אֶרֶץ естественным в контексте возвращения из изгнания. Настоящее «есть награда» ближе к כִּי יֵשׁ שָׂכָר, чем будущее «будет награда».
  reviewer_model: gpt-5.6-terra
