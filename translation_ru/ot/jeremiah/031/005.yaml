  yaml_path: translation/ot/jeremiah/031/005.yaml
  text: Again you will plant vineyards on the mountains of Samaria[a]; planters will plant and enjoy them.
translation:
  language: ru
  text: Ты снова насадишь виноградники на горах Самарии; виноградари будут сажать и пользоваться плодами виноградников.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и сделают обычными»; то есть начнут пользоваться виноградниками и их урожаем в обычной жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: снова
  rationale: В контексте восстановления слово указывает на возобновление прежней мирной жизни.
- source_word: תִּטְּעִי
  choice: ты насадишь
  rationale: Форма 2-го лица женского рода единственного числа сохраняется в русском и относится к олицетворённому Израилю, названному в предыдущем стихе.
- source_word: כְרָמִים
  choice: виноградники
  rationale: Обычное и естественное соответствие еврейскому слову в сельскохозяйственном контексте.
- source_word: בְּהָרֵי שֹׁמְרוֹן
  choice: на горах Самарии
  rationale: Передаёт основное значение הָרִים и сохраняет образ исходного текста.
- source_word: נָטְעוּ נֹטְעִים
  choice: виноградари насадят их
  rationale: Передаёт однокоренное сочетание естественным русским языком; перфект понят как пророческое изображение будущего восстановления.
- source_word: וְחִלֵּלוּ
  choice: и будут пользоваться их плодами
  rationale: В данном сельскохозяйственном контексте глагол означает вводить урожай в обычное употребление; буквальное «осквернят» создало бы ложный культовый смысл.
theological_decisions:
- issue: Адресат глагола женского рода единственного числа
  choice: Сохранено прямое обращение «ты» в женском роде без добавления имени адресата.
  alternative: Повторить из предыдущего стиха обращение «дева Израиля».
  rationale: Грамматика связывает стих с олицетворённым Израилем в ближайшем контексте, однако сам стих не повторяет это наименование.
- issue: Значение וְחִלֵּלוּ
  choice: Обычное использование и вкушение плодов виноградника.
  alternative: Буквально передать как «осквернят» или «сделают обычными».
  rationale: Контекст обещает восстановление нормальной земледельческой жизни. Слово обозначает переход урожая к обычному употреблению, а не ритуальное осквернение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род в «насадишь» сохраняет грамматическое указание на олицетворённый Израиль. Слово «виноградари» естественно обозначает тех, кто насаждает виноградники.
