  yaml_path: translation/ot/jeremiah/037/018.yaml
  text: Then Jeremiah said to King Zedekiah, “What have I sinned against you, against your servants, and against this people, that you have put me into the prison?”
translation:
  language: ru
  text: 'Тогда Иеремия сказал царю Седекии: «Чем я согрешил против тебя, твоих слуг и этого народа, что вы заключили меня в темницу?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶה חָטָאתִי
  choice: Чем я согрешил
  rationale: Естественно передаёт буквальное «что/чем я согрешил», сохраняя обвинительно-риторический характер вопроса.
- source_word: עֲבָדֶיךָ
  choice: твоих слуг
  rationale: В обращении к царю עבד обозначает его служащих или приближённых; «слуги» сохраняет широкий смысл без неоправданного уточнения.
- source_word: בֵּית הַכֶּלֶא
  choice: темницу
  rationale: Устойчивое и понятное обозначение места заключения; родовое בֵּית не требует буквального «дом заключения» по-русски.
- source_word: נְתַתֶּם אֹתִי אֶל
  choice: вы заключили меня в
  rationale: В данном контексте идиоматически выражает передачу человека в место заключения; множественное «вы» сохраняет форму еврейского глагола.
theological_decisions:
- issue: Смысл вопроса о грехе Иеремии
  choice: «Чем я согрешил против тебя…?»
  alternative: «Какой грех я совершил перед тобой…?»
  rationale: Сохраняется лексема «согрешить» и открытый вопрос о вине пророка, без добавления утверждения о полной безгрешности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Темница» уместна для исторического повествования и остаётся понятной современному читателю.
