  text: Then the Chaldeans will return and fight against this city[a], and they will capture it and burn it with fire.
translation:
  language: ru
  text: И халдеи[a] вернутся, будут сражаться против этого города, захватят его и сожгут огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вавилоняне». В еврейском тексте — «халдеи», историческое обозначение, употребляемое во всём данном контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: И ... вернутся
  rationale: Глагол שׁוּב означает «вернуться». Союз וְ естественно передан как «и», сохраняя последовательность пророчества без дополнительного толкования.
- source_word: הַכַּשְׂדִּים
  choice: халдеи
  rationale: Сохранено буквальное историко-этническое обозначение; в данном контексте речь идёт о вавилонянах.
- source_word: וְנִלְחֲמוּ עַל
  choice: будут сражаться против
  rationale: Сочетание נלחם с עַל здесь обозначает военные действия против города; формулировка естественна для современного русского языка.
- source_word: הָעִיר הַזֹּאת
  choice: этого города
  rationale: Указательное местоимение זֹאת имеет значение близости и прямо соответствует русскому «этот».
- source_word: וּלְכָדֻהָ
  choice: захватят его
  rationale: לכד применительно к городу означает овладеть им, захватить его в ходе военных действий.
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  choice: сожгут огнём
  rationale: Передаёт выражение буквально и ясно, сохраняя подчёркнутое упоминание огня.
