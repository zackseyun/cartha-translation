  text: Jeremiah was coming and going among the people[a], for they had not yet put him in the prison house.
translation:
  language: ru
  text: Иеремия свободно ходил среди народа, потому что его ещё не заключили в темницу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в дом заключения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא וְיֹצֵא
  choice: свободно ходил
  rationale: Парное выражение буквально означает «входил и выходил» и передаёт возможность беспрепятственно передвигаться и появляться среди людей. Русское «свободно ходил» естественно выражает этот смысл в данном контексте.
- source_word: בְּתוֹךְ הָעָם
  choice: среди народа
  rationale: Передаёт пространственное значение «посреди, среди» естественным современным русским выражением.
- source_word: וְלֹא נָתְנוּ אֹתוֹ
  choice: потому что его ещё не заключили
  rationale: Союз וְ в контексте вводит объяснение того, почему Иеремия мог свободно ходить среди народа. «Ещё» контекстуально указывает, что заключение последовало позднее, хотя отдельного соответствующего слова в еврейском тексте нет.
- source_word: בֵּית הַכְּלִיא
  choice: в темницу
  rationale: Естественное русское обозначение места заключения; буквальный образ «дом заключения» сохранён в сноске.
- source_word: וְיִרְמְיָהוּ
  choice: Иеремия
  rationale: Начальный וְ служит связкой повествования и не требует отдельного русского слова в этом предложении.
