lexical_decisions:
- source_word: וַיְהִי
  choice: Тогда ... было
  rationale: Конструкция продолжает повествовательную последовательность; «тогда» естественно передаёт переход к следующему событию, а оборот «было слово» сохраняет пророческую формулу.
- source_word: דְּבַר
  choice: слово
  rationale: В устойчивой формуле דְּבַר יְהוָה слово «слово» прозрачно передаёт обозначение божественного откровения, не сужая его до простого сообщения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает направленность слова к Иеремии; по-русски в формуле «было слово ... к» естественно употребить «к».
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Использована общепринятая русская форма библейского имени в требуемом дательном падеже.
- source_word: הַנָּבִיא
  choice: пророку
  rationale: Существительное с артиклем обозначает служение Иеремии; приложение естественно включено в сочетание «к пророку Иеремии».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит содержание следующей прямой речи; в современном русском эту функцию естественно и без смысловой потери передаёт двоеточие.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением узнаваемой пророческой формулы. Порядок «к пророку Иеремии» естественен по-русски; двоеточие функционально передаёт לֵאמֹר и вводит речь в следующем стихе.
