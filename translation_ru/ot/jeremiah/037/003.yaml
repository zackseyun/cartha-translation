  text: וַ/יִּשְׁלַח֩ הַ/מֶּ֨לֶךְ צִדְקִיָּ֜הוּ אֶת יְהוּכַ֣ל בֶּן שֶֽׁלֶמְיָ֗ה וְ/אֶת צְפַנְיָ֤הוּ בֶן מַֽעֲשֵׂיָה֙ הַ/כֹּהֵ֔ן אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹ֑ר הִתְפַּלֶּל נָ֣א בַעֲדֵ֔/נוּ אֶל יְהוָ֖ה אֱלֹהֵֽי/נוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/003.yaml
  text: Then King Zedekiah sent Jehucal son of Shelemiah and Zephaniah son of Maaseiah the priest to Jeremiah the prophet[a], saying, “Please pray to Yahweh our God for us.”
translation:
  language: ru
  text: 'И послал царь Седекия Иегухала, сына Шелемии, и священника Софонию, сына Маасеи, к пророку Иеремии сказать: «Прошу, помолись за нас Яхве, нашему Богу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Форма wayyiqtol продолжает повествование; традиционное русское «И послал» естественно связывает стих с предшествующим контекстом.
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: царь Седекия
  rationale: Естественный русский порядок титула и имени.
- source_word: יְהוּכַל
  choice: Иегухал
  rationale: Передаёт полную древнееврейскую форму имени в этом стихе, не заменяя её сокращённой формой, встречающейся в родственном контексте.
- source_word: בֶּן שֶׁלֶמְיָה
  choice: сын Шелемии
  rationale: Обычная русская передача родственного обозначения.
- source_word: צְפַנְיָהוּ בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: священника Софонию, сына Маасеи
  rationale: Артикль и контекст указывают, что «священник» относится к Софонии; перестановка устраняет возможную для русского текста ошибочную связь с Маасеей.
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: к пророку Иеремии
  rationale: Естественный современный русский порядок слов, точно сохраняющий титул.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Инфинитив вводит прямую речь; «сказать» кратко и естественно передаёт эту функцию.
- source_word: הִתְפַּלֶּל נָא
  choice: Прошу, помолись
  rationale: Императив передан прямо, а частица נָא — вежливой и настойчивой просьбой «прошу».
- source_word: בַעֲדֵנוּ
  choice: о нас
  rationale: В данном контексте обозначает ходатайственную молитву за говорящих; по-русски нормативно «молиться о нас».
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Яхве, нашему Богу
  rationale: Личное имя передано транслитерацией «Яхве», а приложение «нашему Богу» сохранено; падеж определяется управлением русского глагола «молиться».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом, не внося конфессиональной замены.
- issue: К кому относится הַכֹּהֵן («священник»)
  choice: к Софонии
  alternative: к Маасее
  rationale: Синтаксис допускает поверхностную неоднозначность, однако определённое приложение после всей именной группы и сведения контекста наиболее естественно идентифицируют Софонию как священника; русский порядок слов делает эту связь ясной.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имена переданы в привычных русских библейских формах там, где они устойчивы (Седекия, Софония, Иеремия), а יְהוּכַל — близко к полной форме исходного текста. Маркеры сносок не добавлены, поскольку в русском тексте не требуется пояснять вариант английской транслитерации.
