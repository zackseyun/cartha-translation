  source_fidelity: 'Текст верно передаёт все основные элементы еврейского оригинала: сильный гнев сановников, избиение Иеремии, его помещение под стражу в доме писца Ионафана и пояснение, что этот дом был превращён в тюрьму. «Заключили под стражу» несколько менее конкретно, чем «поместили в дом заключения», однако в сочетании с указанием дома и заключительной клаузой точно передаёт смысл.'
