source:
  edition: WLC
  text: וַ/יִּקְצְפ֧וּ הַ/שָּׂרִ֛ים עַֽל יִרְמְיָ֖הוּ וְ/הִכּ֣וּ אֹת֑/וֹ וְ/נָתְנ֨וּ אוֹת֜/וֹ בֵּ֣ית הָ/אֵס֗וּר בֵּ֚ית יְהוֹנָתָ֣ן הַ/סֹּפֵ֔ר כִּֽי אֹת֥/וֹ עָשׂ֖וּ לְ/בֵ֥ית הַ/כֶּֽלֶא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/015.yaml
  text: And the officials were enraged at Jeremiah[a], and they beat him and put him in the prison house, in the house of Jehonathan the scribe[b], for they had made it a prison.
translation:
  language: ru
  text: И разгневались начальники на Иеремию[a], избили его и заключили под стражу в доме писца Ионафана[b], потому что его превратили в тюрьму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «князья разгневались на Иеремию».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в доме заключения, в доме писца Ионафана»; дом Ионафана был приспособлен под тюрьму.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְצְפוּ
  choice: разгневались
  rationale: Глагол קצף выражает сильный гнев или негодование; «разгневались» естественно и достойно передаёт эту интенсивность.
- source_word: הַשָּׂרִים
  choice: начальники
  rationale: שׂרים здесь обозначает высокопоставленных представителей власти; «начальники» не создаёт ошибочного впечатления, будто речь непременно о царских сыновьях.
- source_word: וְהִכּוּ אֹתוֹ
  choice: избили его
  rationale: В данном контексте נכה означает физическое насилие; «избили» лучше передаёт не единичный удар, а жестокое обращение.
- source_word: וְנָתְנוּ אֹתוֹ בֵּית הָאֵסוּר
  choice: заключили под стражу
  rationale: Буквально конструкция означает, что его поместили в «дом заключения»; русский оборот ясно передаёт факт помещения под стражу, не добавляя иной меры наказания.
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  choice: в доме писца Ионафана
  rationale: Повтор בֵּית уточняет место заключения как дом Ионафана; «писец» сохраняет обычное и достаточно широкое значение סֹפֵר как писца или чиновника-секретаря.
- source_word: כִּי
  choice: потому что
  rationale: 'Союз вводит объяснение: дом Ионафана использовали для заключения, поскольку его переоборудовали в тюрьму.'
- source_word: אֹתוֹ עָשׂוּ לְבֵית הַכֶּלֶא
  choice: его превратили в тюрьму
  rationale: עשה с לְ выражает превращение или назначение чего-либо во что-либо; местоимение отсылает к дому Ионафана.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Ионафан» выбрано как устоявшаяся русская библейская форма имени יְהוֹנָתָן. Конкретный еврейский образ «дом заключения» раскрыт в сноске, тогда как основной текст избегает неестественного русского повтора.
