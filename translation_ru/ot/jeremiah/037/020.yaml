base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/020.yaml
  text: So now[a], please hear, my lord the king; please let my plea fall before you, and do not send me back to the house of Jehonathan the scribe, lest I die there.
translation:
  language: ru
  text: И теперь выслушай, прошу, господин мой, царь! Пусть моя мольба предстанет перед тобой[a]; не возвращай меня в дом писца Иегонафана, чтобы я там не умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть моя мольба падёт перед тобой» — древнееврейский оборот, означающий обращение с прошением.'
    reason: Сноска сохраняет образность глагола נפל («падать»), тогда как основной текст передаёт смысл оборота естественным русским языком.
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительную силу וְ и вводит настоятельную просьбу естественным для русского языка образом.
- source_word: שְׁמַע נָא
  choice: выслушай, прошу
  rationale: Императив שׁמע передан глаголом «выслушай», подходящим для просьбы принять слова просителя; частица נָא выражена вежливым и настоятельным «прошу».
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: мой господин царь
  rationale: Передаёт и почтительное обращение с притяжательным элементом, и царский титул, не вводя дополнительной интерпретации.
- source_word: תִּפָּל נָא תְחִנָּתִי לְפָנֶיךָ
  choice: Пусть моя мольба предстанет перед тобой
  rationale: Это естественная русская передача устойчивого древнееврейского оборота о представлении просьбы вышестоящему лицу. Буквальный образ падения сохранён в сноске.
- source_word: תְחִנָּתִי
  choice: моя мольба
  rationale: «Мольба» передаёт настойчивое, смиренное прошение и сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: וְאַל תְּשִׁבֵנִי
  choice: не возвращай меня
  rationale: Каузативная форма שוב означает «не заставляй/не делай так, чтобы я вернулся»; в контексте заключения естественно сказать «не возвращай меня».
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  choice: дом писца Иегонафана
  rationale: «Дом» сохраняет прямое значение בַּיִת, хотя по контексту он служит местом заключения. Форма «Иегонафан» отражает полную древнееврейскую форму имени יְהוֹנָתָן, а «писец» — должность סֹפֵר.
- source_word: וְלֹא אָמוּת שָׁם
  choice: чтобы мне не умереть там
  rationale: Передаёт опасаемое следствие возвращения без излишнего усиления до категорического утверждения «иначе я умру».
