  text: וַ/יֵּצֵ֤א יִרְמְיָ֨הוּ֙ מִ/יר֣וּשָׁלִַ֔ם לָ/לֶ֖כֶת אֶ֣רֶץ בִּנְיָמִ֑ן לַ/חֲלִ֥ק מִ/שָּׁ֖ם בְּ/ת֥וֹךְ הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/012.yaml
  text: Jeremiah went out from Jerusalem to go to the land of Benjamin[a], to receive his portion there among the people.
translation:
  language: ru
  text: Иеремия вышел из Иерусалима, чтобы пойти в землю Вениамина и получить там свою долю среди народа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы заявить там о своём праве на долю среди народа». Значение еврейского לַחֲלִק здесь неясно: речь может идти о получении выделенной доли, разделе имущества или предъявлении права на долю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Глагол יצא обычно означает «выходить»; здесь форма повествовательного прошедшего времени передаёт движение из Иерусалима.
- source_word: מִירוּשָׁלִַם
  choice: из Иерусалима
  rationale: Предлог מִן обозначает движение из города.
- source_word: לָלֶכֶת
  choice: чтобы пойти
  rationale: Инфинитив выражает цель; такой перевод естественно передаёт целевое значение и не добавляет оттенка длительного путешествия.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: землю Вениамина
  rationale: אֶרֶץ здесь обозначает территорию колена Вениамина; традиционное «земля Вениамина» сохраняет регионально-племенной смысл.
- source_word: לַחֲלִק
  choice: получить там свою долю
  rationale: Редкий и трудный в данном контексте инфинитив от חלק, вероятно, связан с долей или разделом имущества. Основной текст передаёт вероятный смысл, не связывая действие с последующим обвинением Иеремии.
- source_word: מִשָּׁם
  choice: там
  rationale: Буквально форма может передавать «оттуда», однако при глагольном выражении получения доли по-русски естественнее указать место словом «там».
- source_word: בְּתוֹךְ הָעָם
  choice: среди народа
  rationale: Буквально «посреди народа»; «среди народа» — естественный русский эквивалент. Перевод «среди воинов» был бы неоправданно конкретным.
