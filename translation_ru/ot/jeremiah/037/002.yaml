base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/002.yaml
  text: But he and his servants and the people of the land did not listen to the words of Yahweh that he spoke through Jeremiah the prophet[a][b][c].
translation:
  language: ru
  text: Но ни он, ни его слуги, ни народ страны не слушали слов Яхве, которые Он возвестил через пророка Иеремию.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не повиновались словам Яхве». Еврейский глагол может означать «слышать», «слушать» или, по смыслу, «повиноваться».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «народ земли»; это выражение может обозначать население вообще или простой народ.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «рукой пророка Иеремии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: Но ... не слушали
  rationale: Сочетание союза с отрицанием продолжает повествование с оттенком противопоставления. Единственное число еврейского сказуемого при составном перечислении естественно передаётся по-русски множественным числом. «Не слушали» сохраняет диапазон между слушанием и повиновением.
- source_word: הוּא וַעֲבָדָיו
  choice: ни он, ни его слуги
  rationale: Повтор «ни» естественно оформляет в русском языке перечисление при общем отрицании. «Слуги» сохраняет широкое значение עֲבָדִים, которое в царском контексте может включать придворных и должностных лиц.
- source_word: וְעַם הָאָרֶץ
  choice: ни народ страны
  rationale: Буквальная форма устойчивого еврейского выражения сохранена в основном тексте; возможное значение «простонародье» поясняется в сноске.
- source_word: דִּבְרֵי יְהוָה
  choice: слов Яхве
  rationale: Множественное число דִּבְרֵי передано как «слов», а личное имя יהוה — транслитерацией «Яхве».
- source_word: אֲשֶׁר דִּבֶּר
  choice: которые Он говорил
  rationale: Относительное местоимение относится к «словам», а субъектом глагола остаётся Яхве. Заглавная буква в «Он» помогает избежать мнимой отсылки к царю, не меняя синтаксического смысла.
- source_word: בְּיַד
  choice: через
  rationale: Буквально «рукой»; в данном пророческом контексте оборот обозначает посредничество и естественно передаётся предлогом «через».
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: пророка Иеремию
  rationale: Такой порядок слов наиболее естественен для современного литературного русского языка и точно передаёт имя и статус.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога, поэтому оно сохраняется в форме «Яхве», а не заменяется титулом.
- issue: Смысл שׁמע в отношении слов Яхве
  choice: не слушали
  alternative: не повиновались
  rationale: «Не слушали» сохраняет подлинную смысловую широту глагола — от слышания и внимательного восприятия до послушания — не сводя её только к повиновению.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Отрицательное перечисление оформлено конструкцией «ни ... ни ... ни», а смысловая неоднозначность שׁמע и идиомы עם הארץ сохранена и пояснена сносками.
