lexical_decisions:
- source_word: וְאַיּוֹ
  choice: И где же
  rationale: Союз сохраняет связь с предыдущей речью, а частица «же» естественно передаёт остроту риторического вопроса.
- source_word: נְבִיאֵיכֶם
  choice: ваши пророки
  rationale: Прямо передаёт форму множественного числа с притяжательным суффиксом второго лица множественного числа.
- source_word: אֲשֶׁר נִבְּאוּ לָכֶם
  choice: которые пророчествовали вам
  rationale: Сохраняет относительное придаточное и указание на прежние пророческие заявления.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Обычная формула введения прямой речи, естественная и в современном русском.
- source_word: לֹא יָבֹא
  choice: не придёт
  rationale: Отрицание с имперфектом в передаваемом предсказании выражает будущее действие.
- source_word: מֶלֶךְ בָּבֶל
  choice: Царь Вавилона
  rationale: Прозрачно передаёт еврейскую сопряжённую конструкцию; заглавная буква уместна в начале цитаты.
- source_word: עֲלֵיכֶם
  choice: против вас
  rationale: При глаголе движения предлог עַל обозначает направленное враждебное наступление; «против» ясно передаёт военный контекст.
- source_word: וְעַל הָאָרֶץ הַזֹּאת
  choice: и против этой земли
  rationale: Сохраняет повтор предлога, союз וְ и указательное местоимение; «и» формально следует еврейскому тексту, не заменяя его на логически более привычное русское «ни».
