  text: And where are your prophets who prophesied to you[a], saying, ‘The king of Babylon will not come against you or against this land’?”
translation:
  language: ru
  text: 'И где же ваши пророки, которые пророчествовали вам, говоря: «Царь Вавилона не придёт против вас и против этой земли»[a]?'
