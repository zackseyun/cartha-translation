base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/014.yaml
  text: But Jeremiah said[a], “That is a lie; I am not defecting to the Chaldeans.” But he would not listen to him[c][b], and Irijah seized Jeremiah and brought him to the officials.
translation:
  language: ru
  text: 'Но Иеремия сказал: «Ложь! Я не перехожу на сторону халдеев[a][b]». Но Ирийя не послушал его и схватил Иеремию и привёл его к сановникам[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не перебегаю к халдеям».'
    reason: lexical_alternative
  - marker: b
    text: Халдеями здесь названы вавилонские войска.
    reason: cultural_note
  - marker: c
    text: 'Или: «к правителям»; еврейское слово обозначает высокопоставленных правителей или должностных лиц.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: Ложь!
  rationale: Краткое восклицательное опровержение естественно передаёт резкость еврейского существительного, употреблённого как самостоятельная реплика.
- source_word: אֵינֶנִּי נֹפֵל עַל הַכַּשְׂדִּים
  choice: Я не перехожу на сторону халдеев
  rationale: В данном военно-политическом контексте נפל על означает переход на сторону противника, а не буквальное падение. Формулировка сохраняет смысл обвинения, не уточняя сверх текста, был ли это замысел, измена или бегство.
- source_word: הַכַּשְׂדִּים
  choice: халдеев
  rationale: Сохранено этнополитическое наименование исходного текста; в этом контексте оно обозначает вавилонские силы.
- source_word: וְלֹא שָׁמַע אֵלָיו
  choice: Однако тот не послушал его
  rationale: Выражение передаёт отказ принять объяснение Иеремии, а местоимение «тот» естественно указывает на Иерею из предыдущего стиха.
- source_word: וַיִּתְפֹּשׂ
  choice: схватил
  rationale: Передаёт насильственное задержание, не добавляя более узкого юридического значения глагола «арестовал».
- source_word: הַשָּׂרִים
  choice: сановникам
  rationale: В контексте книги Иеремии речь идёт о высокопоставленных властных лицах. «Сановники» передаёт их положение и не создаёт ложного впечатления, будто все они были царскими сыновьями.
- source_word: וַיְבִאֵהוּ אֶל
  choice: привёл его к
  rationale: Прямой и естественный русский эквивалент каузативной формы בוא в данном повествовательном контексте.
