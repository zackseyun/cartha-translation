  yaml_path: translation/ot/jeremiah/037/009.yaml
  text: 'Thus says Yahweh: Do not deceive yourselves[a], saying[c][b], ‘The Chaldeans will surely go away from us,’ for they will not go away.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Не обманывайте самих себя[a], говоря: „Халдеи непременно уйдут от нас“[b], — потому что они не уйдут».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не обольщайте себя». Еврейский оборот буквально упоминает «ваши души», но здесь означает самообман или ложную уверенность.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская конструкция усиливает утверждение: «непременно уйдут». Халдеями здесь названы вавилонские войска.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена традиционная пророческая формула в естественной для современного русского языка форме; тетраграмматон передан личным именем «Яхве».
- source_word: אַל תַּשִּׁיאוּ נַפְשֹׁתֵיכֶם
  choice: Не обманывайте самих себя
  rationale: Еврейский оборот с נֶפֶשׁ здесь предостерегает от самообмана и ложной уверенности; буквальное упоминание «душ» не передало бы контекстуального смысла по-русски.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Причастный оборот прямо вводит содержание самообмана и сохраняет структуру исходного текста без излишнего уточнения причинной связи.
- source_word: הָלֹךְ יֵלְכוּ
  choice: непременно отступят
  rationale: Сочетание абсолютного инфинитива с личной формой глагола выражает усиление. В военном контексте «отступят» естественно передаёт уход осаждающих войск.
- source_word: מֵעָלֵינוּ
  choice: от нас
  rationale: Передаёт движение прочь от находящихся под военной угрозой жителей Иудеи; оттенок прекращения враждебного давления раскрывается глаголом «отступят».
- source_word: הַכַּשְׂדִּים
  choice: Халдеи
  rationale: Сохранено конкретное историческое обозначение исходного текста, а не заменено более общим «вавилоняне».
- source_word: כִּי לֹא יֵלֵכוּ
  choice: потому что они не отступят
  rationale: כִּי вводит основание предостережения; повтор того же русского глагола сохраняет резкое риторическое опровержение.
theological_decisions:
- issue: Передача тетраграмматона יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога в соответствии с исходным еврейским текстом и не заменяет его титулом.
