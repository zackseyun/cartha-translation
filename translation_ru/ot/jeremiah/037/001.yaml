base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/001.yaml
  text: And King Zedekiah son of Josiah reigned in place of Coniah son of Jehoiakim[b][a], whom Nebuchadnezzar king of Babylon had made king in the land of Judah.
translation:
  language: ru
  text: И воцарился царь Седекия, сын Иосии, вместо Конии[a], сына Иоакима, которого Навуходоносор[b], царь Вавилона, поставил царём в земле Иуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кония — краткая форма имени Иехония.
    reason: alternative_reading
  - marker: b
    text: Еврейское написание имени ближе к форме «Навуходреццар»; в русском тексте употреблена традиционная форма «Навуходоносор».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלָךְ
  choice: воцарился
  rationale: Глагол מלך в повествовательной форме обозначает вступление на царство; «воцарился» естественно и точно передаёт смену правителя.
- source_word: מֶלֶךְ צִדְקִיָּהוּ
  choice: Седекия
  rationale: Слово מֶלֶךְ при глаголе «воцарился» не повторено как титул, чтобы избежать неестественного русского «воцарился царь»; царское достоинство ясно из сказуемого.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: сын Иосии
  rationale: Прямо сохранено указание на происхождение.
- source_word: תַּחַת
  choice: вместо
  rationale: В контексте престолонаследия предлог указывает на замещение одного царя другим.
- source_word: כָּנְיָהוּ
  choice: Конии
  rationale: Передана именно краткая форма имени, употреблённая в еврейском тексте, без молчаливой унификации с формой «Иехония».
- source_word: בֶּן יְהוֹיָקִים
  choice: сына Иоакима
  rationale: Сохранено прямое указание на отца Конии.
- source_word: אֲשֶׁר הִמְלִיךְ
  choice: поставил его царём
  rationale: Каузативная форма מלך означает «сделать царём»; местоимение «его» явно указывает на Седекию, подразумеваемого относительной конструкцией.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Использована закрепившаяся в современном русском библейском и историческом употреблении форма; особенность еврейского написания отмечена в сноске.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Естественная русская передача еврейской сопряжённой конструкции.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: в земле Иудейской
  rationale: Сохраняет явное слово «земля» и местное значение предлога ב, оставаясь понятным и литературным.
