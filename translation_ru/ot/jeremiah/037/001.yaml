    rationale: Относительное אֲשֶׁר в исходной фразе относится к Конии, сыну Иоакима, а не к Седекии. Разделение предложения и ввод местоимения изменили синтаксическую связь оригинала.
  - severity: medium
    issue: Сноска b неверно передаёт еврейскую форму имени.
    rationale: Написание נְבוּכַדְרֶאצַּר отражает форму, приблизительно передаваемую как «Навуходреццар», а не «Навуходоросор».
  - severity: low
    issue: Опущен явно присутствующий титул «царь» при Седекии.
    rationale: Хотя «воцарился Седекия» понятно, в оригинале титул מֶלֶךְ выражен явно; его можно естественно сохранить как «воцарился царь Седекия».
