source:
  edition: WLC
  text: כִּ֣י אִם הִכִּיתֶ֞ם כָּל חֵ֤יל כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים אִתְּ/כֶ֔ם וְ/נִ֨שְׁאֲרוּ בָ֔/ם אֲנָשִׁ֖ים מְדֻקָּרִ֑ים אִ֤ישׁ בְּ/אָהֳל/וֹ֙ יָק֔וּמוּ וְ/שָֽׂרְפ֛וּ אֶת הָ/עִ֥יר הַ/זֹּ֖את בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/010.yaml
  text: For even if you were to strike down the whole army of the Chaldeans who are fighting against you[a], and only wounded men remained among them, each in his tent[b], they would rise up and burn this city with fire.
translation:
  language: ru
  text: Ибо даже если бы вы разбили всё войско халдеев[a], сражающееся против вас, и среди них остались бы одни раненые[b], то и они поднялись бы, каждый в своём шатре, и сожгли бы этот город огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вавилонян». В еврейском тексте стоит «халдеев» — этническое название, которым в книге Иеремии обычно обозначаются вавилонские войска.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пронзённые люди» или «люди, пронзённые насквозь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Ибо даже если бы
  rationale: Передаёт пояснительную силу כִּי и усиленное гипотетически-уступительное условие, выраженное אִם.
- source_word: הִכִּיתֶם
  choice: вы разбили
  rationale: В военном контексте נכה обозначает нанесение поражения; условное наклонение передаёт нереальную гипотезу без архаизма.
- source_word: כָּל חֵיל כַּשְׂדִּים
  choice: всё войско халдеев
  rationale: חֵיל здесь означает военную силу или войско, а כַּשְׂדִּים сохранено как исходный этноним.
- source_word: הַנִּלְחָמִים אִתְּכֶם
  choice: сражающееся против вас
  rationale: В данном враждебном военном контексте сочетание לחם с אֵת выражает противостояние.
- source_word: וְנִשְׁאֲרוּ בָם
  choice: и среди них остались бы одни
  rationale: Передаёт значение оставшегося остатка и подразумеваемую ограничительность ситуации.
- source_word: אֲנָשִׁים מְדֻקָּרִים
  choice: раненые
  rationale: Естественное русское обозначение выведенных из строя воинов; буквальный образ пронзённых сохранён в сноске.
- source_word: אִישׁ בְּאָהֳלוֹ
  choice: каждый в своём шатре
  rationale: Сохраняет распределительное значение אִישׁ и конкретный образ личного шатра.
- source_word: יָקֻמוּ
  choice: они поднялись бы
  rationale: Продолжает гипотетическое следствие и сохраняет буквальный образ вставших для действия людей.
- source_word: וְשָׂרְפוּ אֶת הָעִיר הַזֹּאת בָּאֵשׁ
  choice: и сожгли бы этот город огнём
  rationale: Сохраняет и действие, и усилительную инструментальную фразу «огнём».
