  to: 'Тогда царь Седекия послал за Иеремией и велел привести его. Царь тайно спросил его у себя в доме: «Есть ли слово от Яхве?» Иеремия ответил: «Есть». Затем он сказал: «Ты будешь отдан в руки царя Вавилона».'
