base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/017.yaml
  text: Then King Zedekiah sent and had him brought[a], and the king questioned him privately in his house, and said, “Is there any word from Yahweh?” Jeremiah said, “There is.” Then he said[b], “You will be given into the hand of the king of Babylon.”
translation:
  language: ru
  text: 'Тогда царь Седекия послал за Иеремией и велел привести его. Царь тайно спросил его у себя в доме: «Есть ли слово от Яхве?» Иеремия ответил: «Есть». Затем он сказал: «Ты будешь отдан в руки царя Вавилона».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקָּחֵהוּ
  choice: послал за Иеремией и велел привести его
  rationale: 'Сочетание двух глаголов передаёт последовательность действий: царь посылает людей, чтобы Иеремию доставили к нему. Имя заменяет местоимение для ясности вне широкого контекста.'
- source_word: בְּבֵיתוֹ
  choice: у себя во дворце
  rationale: Буквально «в своём доме»; применительно к царю בַּיִת может обозначать царскую резиденцию. «Во дворце» естественно по-русски, а буквальное значение сохранено в примечании.
- source_word: בַּסֵּתֶר
  choice: тайно
  rationale: 'Передаёт обстоятельственное значение: разговор происходил скрытно, без посторонних.'
- source_word: דָּבָר מֵאֵת יְהוָה
  choice: слово от Яхве
  rationale: «Слово» сохраняет характерное для пророческой речи обозначение Божьего сообщения, не сужая значение до более пояснительного «весть».
- source_word: יֵשׁ
  choice: Есть
  rationale: Краткий ответ воспроизводит лаконичность и напряжённость еврейского текста.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: в руки царя Вавилона
  rationale: Русское выражение «отдать в руки» естественно передаёт еврейскую идиому власти и сохраняет её образность.
- source_word: תִּנָּתֵן
  choice: ты будешь отдан
  rationale: Страдательная форма точно передаёт нифаль глагола נתן и не уточняет подразумеваемого исполнителя действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Неуказанный деятель в תִּנָּתֵן
  choice: сохранена страдательная конструкция «будешь отдан»
  alternative: «Я отдам тебя» или «Бог отдаст тебя»
  rationale: Еврейская форма не называет деятеля прямо; перевод не устраняет эту грамматическую и богословскую недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Краткость ответа Иеремии сохранена; архаизмы и избыточно церковная лексика не используются.
