base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/005.yaml
  text: Pharaoh’s army had come out from Egypt[a], and when the Chaldeans who were besieging Jerusalem heard the report about them[c][b], they withdrew from Jerusalem.
translation:
  language: ru
  text: Войско фараона вышло из Египта, и когда халдеи, осаждавшие Иерусалим, услышали весть о нём[a], они отступили от Иерусалима[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «услышали весть о них», то есть о войске фараона.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поднялись от Иерусалима»; здесь имеется в виду, что осаждавшие войска отошли от города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל פַּרְעֹה
  choice: войско фараона
  rationale: חֵיל в данном военном контексте обозначает вооружённые силы; «войско» естественно и точно передаёт смысл.
- source_word: יָצָא מִמִּצְרָיִם
  choice: вышло из Египта
  rationale: Форма qatal сообщает исходное событие перед последующей цепью действий; русское повествовательное прошедшее не требует плюсквамперфекта.
- source_word: הַכַּשְׂדִּים
  choice: халдеи
  rationale: Прямое соответствие еврейскому этнониму; «вавилоняне» возможно как контекстуальное пояснение, но менее буквально.
- source_word: הַצָּרִים עַל יְרוּשָׁלִַם
  choice: осаждавшие Иерусалим
  rationale: Причастие от צור в военном контексте означает осаду города и передаёт продолжающееся действие.
- source_word: אֶת שִׁמְעָם
  choice: весть о нём
  rationale: שֵׁמַע означает «весть, известие, слух»; местоименный суффикс множественного числа относится по смыслу к силам фараона. В русском собирательное «войско» требует единственного числа.
- source_word: וַיֵּעָלוּ מֵעַל יְרוּשָׁלִָם
  choice: они отступили от Иерусалима
  rationale: Буквально выражение говорит, что они «ушли от/с Иерусалима»; в контексте осады оно означает отход осаждавших войск, не обязательно окончательное снятие осады.
