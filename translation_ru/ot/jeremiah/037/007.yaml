base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/007.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Thus you shall say to the king of Judah, who sent you to me to inquire of me, ‘Behold, Pharaoh’s army, which came out to help you, has returned to its own land[c][b], Egypt.’'
translation:
  language: ru
  text: 'Так говорит Яхве, Бог Израиля: так скажите царю Иудеи, который послал вас ко Мне вопросить Меня[a]: «Вот, войско фараона, выступившее вам на помощь[b], вернулось в свою страну, в Египет[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искать Меня» или «обратиться ко Мне за ответом»; здесь имеется в виду обращение к Богу за ответом через Иеремию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выступающее вам на помощь». В еврейском тексте употреблено причастие; его временное значение определяется контекстом.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «повернуло назад в землю Египта». Еврейская форма — перфект; в пророческом контексте она может представлять предсказанное событие как уже совершившееся.'
    reason: textual_or_temporal_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» соответствует принятой современной русской транслитерации.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохранена устойчивая формула пророческой речи с естественным для русского языка настоящим временем.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо передаёт определённую именную конструкцию с именем собственным.
- source_word: כֹּה תֹאמְרוּ
  choice: Так скажите
  rationale: Повелительная форма естественно передаёт обращённое к посланникам указание.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם אֵלַי
  choice: который послал вас ко Мне
  rationale: Причастие отнесено к уже совершённому в повествовательной ситуации действию царя.
- source_word: לְדָרְשֵׁנִי
  choice: вопросить Меня
  rationale: Глагол דרשׁ здесь обозначает обращение за божественным ответом через пророка; сохранены первое лицо Божьей речи и достойный пророческий регистр.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественно и выразительно привлекает внимание к объявляемому повороту событий.
- source_word: חֵיל פַּרְעֹה
  choice: войско фараона
  rationale: В данном контексте חֵיל означает военную силу, то есть войско.
- source_word: הַיֹּצֵא לָכֶם לְעֶזְרָה
  choice: выступившее вам на помощь
  rationale: Причастие описывает египетское войско, уже выступившее ради помощи Иудее; «выступившее» сохраняет военный оттенок.
- source_word: שָׁב
  choice: вернётся
  rationale: Хотя еврейская форма формально представляет действие как совершившееся, в контексте пророческого предсказания она выражает несомненный будущий уход египетского войска.
- source_word: לְאַרְצוֹ מִצְרַיִם
  choice: в свою землю — в Египет
  rationale: Возвратное местоимение передаёт суффикс при «земле», а тире ясно оформляет «Египет» как уточнение.
theological_decisions:
- issue: Временное значение שָׁב в пророческом изречении
  choice: вернётся
  alternative: вернулось / возвращается
  rationale: Контекст главы указывает на предсказание дальнейшего ухода египетского войска, однако совершенная еврейская форма подчёркивает определённость объявленного события; альтернативу сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Формулы «Так говорит» и «Вот» сохраняют библейский регистр без излишней архаизации; «вопросить» выбрано как понятное, но возвышенное обозначение обращения за Божьим ответом.
