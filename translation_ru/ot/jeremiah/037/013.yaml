  text: וַ/יְהִי ה֞וּא בְּ/שַׁ֣עַר בִּנְיָמִ֗ן וְ/שָׁם֙ בַּ֣עַל פְּקִדֻ֔ת וּ/שְׁמ/וֹ֙ יִרְאִיָּ֔יה בֶּן שֶֽׁלֶמְיָ֖ה בֶּן חֲנַנְיָ֑ה וַ/יִּתְפֹּ֞שׂ אֶֽת יִרְמְיָ֤הוּ הַ/נָּבִיא֙ לֵ/אמֹ֔ר אֶל הַ/כַּשְׂדִּ֖ים אַתָּ֥ה נֹפֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/013.yaml
  text: And when he was at the Benjamin Gate[a], there was a captain of the guard there whose name was Irijah son of Shelemiah, son of Hananiah, and he seized Jeremiah the prophet, saying, “You are deserting to the Chaldeans!”
translation:
  language: ru
  text: 'Когда он был у Вениаминовых ворот, там находился начальник стражи по имени Иреия, сын Шелемии, сына Ханании. Он схватил пророка Иеремию и сказал: «Ты перебегаешь к халдеям!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты переходишь на сторону халдеев!» Буквально по-еврейски: «Ты падаешь к халдеям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁעַר בִּנְיָמִן
  choice: у Вениаминовых ворот
  rationale: Название городских ворот передано естественно для русского языка; предлог «у» ясно обозначает местонахождение возле ворот.
- source_word: בַּעַל פְּקִדֻת
  choice: начальник стражи
  rationale: Буквально выражение обозначает человека, наделённого надзором или ответственностью. В контексте городских ворот речь, вероятнее всего, идёт о начальнике караула или стражи; выбранный вариант краток и понятен.
- source_word: יִרְאִיָּה
  choice: Иреия
  rationale: Имя передано транслитерацией с еврейского; форма позволяет отличить его от имени Иеремия.
- source_word: וַיִּתְפֹּשׂ
  choice: схватил
  rationale: Глагол выражает энергичное физическое задержание; «схватил» не привносит формальной юридической процедуры, подразумеваемой словом «арестовал».
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: пророка Иеремию
  rationale: Естественный русский порядок слов сохраняет титул и имя.
- source_word: אֶל הַכַּשְׂדִּים אַתָּה נֹפֵל
  choice: Ты перебегаешь к халдеям!
  rationale: В военно-политическом контексте идиома נפל אל означает переход на сторону противника. «Перебегаешь» ясно передаёт обвинение, сохраняя настоящее время и эмоциональную непосредственность реплики.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Имена переданы в формах, близких к еврейскому тексту; этноним «халдеи» сохранён. Маркер сноски поставлен непосредственно после реплики, к которой относится пояснение идиомы.
