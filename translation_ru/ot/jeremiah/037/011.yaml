lexical_decisions:
- source_word: וְהָיָה
  choice: Когда
  rationale: Нарративная формула вводит новое обстоятельство и вместе со следующей временной конструкцией естественно передаётся по-русски придаточным с «когда», без архаичного «и было».
- source_word: בְּהֵעָלוֹת
  choice: отошло
  rationale: Форма с בְּ задаёт временное обстоятельство. Глагол עלה буквально связан с движением вверх, но в сочетании с מֵעַל и в военном контексте обозначает уход осаждавшего войска, то есть снятие осады.
- source_word: חֵיל
  choice: войско
  rationale: Здесь слово обозначает организованную военную силу; «войско» естественно и точно в данном историческом повествовании.
- source_word: הַכַּשְׂדִּים
  choice: халдеев
  rationale: Сохранён непосредственно употреблённый в еврейском тексте этноним, а не контекстуальное обозначение «вавилонян».
- source_word: מֵעַל יְרוּשָׁלִָם
  choice: от Иерусалима
  rationale: Буквально выражение означает движение «от/с того, что над Иерусалимом»; в контексте осады это уход с позиций у города.
- source_word: מִפְּנֵי
  choice: из-за
  rationale: Предлог указывает здесь на причину ухода — появление войска фараона.
- source_word: חֵיל פַּרְעֹה
  choice: войска фараона
  rationale: Конструкция выражает принадлежность и естественно передаётся русским родительным оборотом.
