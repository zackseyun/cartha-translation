lexical_decisions:
- source_word: כִּי
  choice: Итак
  rationale: В данном контексте союз вводит поясняющее обстоятельство, подводя итог описанию заключения Иеремии; «итак» естественно передаёт эту связь в русском повествовании, не превращая её в чисто временную.
- source_word: בָא
  choice: попал
  rationale: Глагол בוא с אֶל обозначает прибытие или вхождение; в контексте заключения русское «попал в» естественно выражает перемещение Иеремии в место заточения.
- source_word: בֵּית הַבּוֹר
  choice: подземную темницу
  rationale: Буквально выражение означает «дом ямы/цистерны». В тюремном контексте «подземная темница» сохраняет представление об углублённом месте заключения и звучит понятно по-русски.
- source_word: הַחֲנֻיוֹת
  choice: камеры
  rationale: Редкое слово, вероятно, обозначает отдельные замкнутые помещения внутри тюрьмы. «Камеры» — ясный современный эквивалент; неопределённость архитектурного смысла отмечена в сноске.
- source_word: וַיֵּשֶׁב שָׁם
  choice: пробыл там
  rationale: ישב может означать «сидеть», «жить» или «оставаться». В рассказе о заключении «пробыл там» естественно передаёт длительность пребывания, не сводя значение к позе.
- source_word: יָמִים רַבִּים
  choice: много дней
  rationale: Близко передаёт еврейское выражение и сохраняет его конкретную меру времени.
