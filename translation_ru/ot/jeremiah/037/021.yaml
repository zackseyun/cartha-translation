base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/021.yaml
  text: So King Zedekiah gave orders[a], and they committed Jeremiah to the court of the guard, and gave him a loaf of bread daily from the bakers’ street, until all the bread from the city was gone. So Jeremiah remained in the court of the guard.
translation:
  language: ru
  text: И царь Седекия приказал поместить Иеремию во двор стражи и выдавать ему по буханке хлеба в день с улицы пекарей[a], пока не иссяк весь хлеб в городе. Так Иеремия оставался во дворе стражи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с улицы (или внешнего места) пекарей»; вероятно, имеется в виду улица либо городской участок, где пекари работали и продавали хлеб.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: приказал
  rationale: Глагол означает отдать повеление; «приказал» естественно передаёт царское распоряжение.
- source_word: וַיַּפְקִדוּ
  choice: поместили
  rationale: В данном контексте глагол обозначает официальное помещение Иеремии под стражу; неопределённо-личная конструкция сохраняет неназванных исполнителей.
- source_word: חֲצַר הַמַּטָּרָה
  choice: двор стражи
  rationale: Выражение обозначает охраняемый двор, служивший местом заключения, без отождествления его с отдельным тюремным зданием.
- source_word: וְנָתוֹן לוֹ
  choice: ему выдавали
  rationale: Особая глагольная форма продолжает содержание царского распоряжения и указывает на регулярную выдачу пайка.
- source_word: כִכַּר לֶחֶם
  choice: по буханке хлеба
  rationale: כִּכָּר здесь означает отдельную, вероятно круглую, буханку; русская конструкция с «по» естественно выражает ежедневную норму.
- source_word: לַיּוֹם
  choice: в день
  rationale: Передаёт регулярную ежедневную выдачу хлеба.
- source_word: מִחוּץ הָאֹפִים
  choice: с улицы пекарей
  rationale: חוּץ может обозначать улицу или внешнее открытое место; в сочетании с «пекарями» вероятнее всего имеется в виду улица либо городской участок, где они работали и продавали хлеб.
- source_word: עַד תֹּם כָּל הַלֶּחֶם מִן הָעִיר
  choice: пока в городе не кончился весь хлеб
  rationale: Естественно передаёт продолжительность выдачи до полного истощения городского запаса хлеба.
- source_word: וַיֵּשֶׁב
  choice: оставался
  rationale: В контексте заключения глагол означает продолжать находиться в указанном месте.
- source_word: יִרְמְיָהוּ
  choice: Иеремия
  rationale: Принятая русская библейская форма имени.
- source_word: צִדְקִיָּהוּ
  choice: Седекия
  rationale: Принятая русская библейская форма имени.
