- from: И царь Седекия приказал, и Иеремию поместили во дворе стражи. Ему выдавали по буханке хлеба в день с улицы пекарей[a], пока в городе не кончился весь хлеб. Так Иеремия оставался во дворе стражи.
  to: И царь Седекия приказал поместить Иеремию во двор стражи и выдавать ему по буханке хлеба в день с улицы пекарей[a], пока не иссяк весь хлеб в городе. Так Иеремия оставался во дворе стражи.
