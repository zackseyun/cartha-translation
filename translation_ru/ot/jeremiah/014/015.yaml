source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַֽל הַ/נְּבִאִ֞ים הַ/נִּבְּאִ֣ים בִּ/שְׁמִ/י֮ וַ/אֲנִ֣י לֹֽא שְׁלַחְתִּי/ם֒ וְ/הֵ֨מָּה֙ אֹֽמְרִ֔ים חֶ֣רֶב וְ/רָעָ֔ב לֹ֥א יִהְיֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את בַּ/חֶ֤רֶב וּ/בָֽ/רָעָב֙ יִתַּ֔מּוּ הַ/נְּבִאִ֖ים הָ/הֵֽמָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/015.yaml
  text: 'Therefore thus says Yahweh concerning the prophets who prophesy in my name though I did not send them[a], and who say, ‘Sword and famine will not be in this land’: by sword and by famine those prophets will be consumed.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве о пророках, которые пророчествуют от Моего имени, хотя Я их не посылал, и говорят: «Не будет ни меча, ни голода в этой земле»[a]: от меча и голода погибнут эти пророки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Война и голод не придут в эту землю». Буквально: «Меча и голода не будет в этой земле».'
    reason: 'Лексическая альтернатива: «меч» может метонимически обозначать войну, а еврейскую конструкцию существования можно передать как «не придут».'
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего контекста и сохраняет явную логическую связь.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет торжественную пророческую формулу и передаёт личное имя יְהוָה как «Яхве».
- source_word: עַל
  choice: о
  rationale: Вводит тему Божьего изречения о пророках, не усиливая предлог до значения «против».
- source_word: הַנְּבִאִים הַנִּבְּאִים
  choice: о пророках, которые пророчествуют
  rationale: Сохраняет однокоренную конструкцию еврейского текста и остаётся естественной по-русски.
- source_word: בִּשְׁמִי
  choice: от Моего имени
  rationale: Естественно передаёт заявление о выступлении с якобы полученными от Бога полномочиями; выражение «от имени» в русском языке идиоматичнее буквального «в имени».
- source_word: וַאֲנִי לֹא שְׁלַחְתִּים
  choice: хотя Я их не посылал
  rationale: «Хотя» ясно выражает противопоставление между заявленными полномочиями пророков и отсутствием Божьего поручения.
- source_word: וְהֵמָּה אֹמְרִים
  choice: и говорят
  rationale: Передаёт причастную форму прямо, не добавляя обязательно повторительного оттенка.
- source_word: חֶרֶב וְרָעָב
  choice: ни меча, ни голода
  rationale: «Меч» сохраняет буквальный образ и характерную для пророческой речи метонимию войны; конструкция с «ни» естественна при русском отрицании.
- source_word: לֹא יִהְיֶה בָּאָרֶץ הַזֹּאת
  choice: не будет ... в этой земле
  rationale: Близко воспроизводит еврейскую экзистенциальную конструкцию, оставаясь понятной в современном русском.
- source_word: בַּחֶרֶב וּבָרָעָב
  choice: от меча и голода
  rationale: Русский предлог «от» естественно выражает причину гибели и сохраняет параллель с названными бедствиями.
- source_word: יִתַּמּוּ
  choice: погибнут
  rationale: В контексте суда глагол означает, что пророки придут к концу, будут уничтожены; «погибнут» ясно и естественно передаёт результат, не внося образа поглощения.
- source_word: הַנְּבִאִים הָהֵמָּה
  choice: эти пророки
  rationale: Указывает именно на только что описанных пророков и передаёт дейктическую силу выражения.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Образ חֶרֶב как орудие суда
  choice: меч
  alternative: война
  rationale: Буквальный образ «меча» сохраняет язык Иеремии и допускает его метонимическое понимание как войны, не устраняя образность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Сохранены формула «так говорит», однокоренная пара «пророки — пророчествуют» и образ меча. Местоимения, относящиеся к Богу в прямой речи, написаны с прописной буквы согласно распространённой русской библейской практике.
