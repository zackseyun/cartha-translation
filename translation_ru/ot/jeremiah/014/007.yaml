id: JER.14.7
reference: Jeremiah 14:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִם עֲוֺנֵ֨י/נוּ֙ עָ֣נוּ בָ֔/נוּ יְהוָ֕ה עֲשֵׂ֖ה לְמַ֣עַן שְׁמֶ֑/ךָ כִּֽי רַבּ֥וּ מְשׁוּבֹתֵ֖י/נוּ לְ/ךָ֥ חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/007.yaml
  text: Though our iniquities testify against us[a], O Yahweh, act for your name’s sake; for our apostasies are many[b]; against you we have sinned.
translation:
  language: ru
  text: Хотя наши беззакония свидетельствуют против нас[a], Яхве, действуй ради имени Твоего, ведь многочисленны наши отступления[b]; против Тебя мы согрешили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если наши беззакония свидетельствуют против нас». Еврейское אִם может иметь как условное («если»), так и уступительное («хотя») значение; в этой молитве контекст благоприятствует уступительному смыслу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наши отпадения». Еврейское слово обозначает неоднократное отворачивание от Яхве и неверность Ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Хотя
  rationale: 'В контексте молитвы частица имеет уступительное значение: народ признаёт вину и всё же просит Бога действовать. Условное «если» сохраняется в сноске как грамматически возможное.'
- source_word: עֲוֺנֵינוּ
  choice: наши беззакония
  rationale: Слово обозначает нравственную испорченность и виновность, а не только отдельные проступки; «беззакония» передаёт эту тяжесть естественным для библейской русской речи образом.
- source_word: עָנוּ בָנוּ
  choice: свидетельствуют против нас
  rationale: Сочетание глагола ענה с ב допускает судебный оттенок свидетельства или ответа против кого-либо.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: עֲשֵׂה
  choice: действуй
  rationale: Широкий императив в этой молитве просит Бога предпринять действие, не уточняя его характера.
- source_word: לְמַעַן שְׁמֶךָ
  choice: ради имени Твоего
  rationale: Еврейский оборот апеллирует к Божьей славе, репутации и открытой Им сущности; формулировка сохраняет идиому без лишнего истолкования.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание признания и мольбы; «ведь» естественно связывает части русского предложения.
- source_word: רַבּוּ
  choice: многочисленны
  rationale: Форма выражает нынешнюю многочисленность отступлений; выбранное слово сохраняет сжатость и возвышенный регистр.
- source_word: מְשׁוּבֹתֵינוּ
  choice: наши отступления
  rationale: Существительное обозначает случаи или состояние отворачивания от Яхве и нарушения верности Ему. «Отступления» понятно современному читателю и не делает термин более техническим, чем в еврейском.
- source_word: לְךָ חָטָאנוּ
  choice: против Тебя мы согрешили
  rationale: При חטא предлог указывает на того, против кого направлен грех; совершенная форма выражает признание совершённого греха с сохраняющейся значимостью.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение מְשׁוּבֹתֵינוּ
  choice: наши отступления
  alternative: наши отпадения; наше вероломство
  rationale: «Отступления» передаёт повторяющееся отворачивание и неверность в отношениях с Яхве, не навязывая более позднего узкотехнического смысла слова «апостасия».
- issue: Уступительное или условное значение אִם
  choice: Хотя
  alternative: Если
  rationale: 'Контекст исповедальной молитвы благоприятствует уступительному прочтению: вина несомненна, но народ всё же взывает о действии ради Божьего имени. Подлинная грамматическая неоднозначность отмечена в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Синтаксис близок к еврейскому, но естественен по-русски; прописные местоимения в обращении к Богу поддерживают традиционный почтительный регистр. Все смысловые неоднозначности, существенные для перевода, сохранены либо отмечены в сносках.
