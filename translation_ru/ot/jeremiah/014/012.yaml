id: JER.14.12
reference: Jeremiah 14:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י יָצֻ֗מוּ אֵינֶ֤/נִּי שֹׁמֵ֨עַ֙ אֶל רִנָּתָ֔/ם וְ/כִ֧י יַעֲל֛וּ עֹלָ֥ה וּ/מִנְחָ֖ה אֵינֶ֣/נִּי רֹצָ֑/ם כִּ֗י בַּ/חֶ֨רֶב֙ וּ/בָ/רָעָ֣ב וּ/בַ/דֶּ֔בֶר אָנֹכִ֖י מְכַלֶּ֥ה אוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/012.yaml
  text: Though they fast[a], I do not hear their cry; and though they offer up burnt offering and grain offering, I do not accept them. Rather, by the sword, by famine[d][c][b], and by pestilence I am consuming them.
translation:
  language: ru
  text: Хотя они постятся, Я не слышу их вопля; и хотя они приносят всесожжение и хлебное приношение, Я не принимаю их. Но мечом, голодом и мором Я погублю их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поветрием», «эпидемией». Еврейское слово обозначает смертоносную болезнь, распространяющуюся среди людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָצֻמוּ
  choice: Даже если они будут поститься
  rationale: כִּי в данном контексте имеет уступительное значение, а имперфект יָצֻמוּ естественно передаётся условно-уступительной конструкцией.
- source_word: אֵינֶנִּי שֹׁמֵעַ אֶל רִנָּתָם
  choice: Я не услышу их вопля
  rationale: Оборот שׁמע אל означает не просто физически слышать, а внимать зову; «не услышу» в русском библейском контексте естественно выражает отказ откликнуться. רִנָּה здесь — громкий зов или вопль.
- source_word: יַעֲלוּ עֹלָה וּמִנְחָה
  choice: принесут всесожжение и хлебное приношение
  rationale: עלה в породе Hiphil с жертвенными терминами означает «вознести/принести». עֹלָה — всесожжение, а מִנְחָה в культовом сочетании — хлебное, то есть растительное, приношение.
- source_word: אֵינֶנִּי רֹצָם
  choice: Я не приму их
  rationale: רצה в жертвенном контексте означает благосклонно принять. Местоименный суффикс мужского рода множественного числа допускает отнесение как к приношениям, так и шире к приносящим, поэтому русский текст сохраняет местоименную неоднозначность.
- source_word: כִּי
  choice: Нет
  rationale: 'Заключительное כִּי вводит противопоставленный исход: вместо принятия обрядов последует суд. «Нет» естественно передаёт этот резкий поворот без излишнего разъяснения.'
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  choice: мечом, голодом и мором
  rationale: 'Традиционная и точная формула трёх бедствий: война, голод и смертоносная эпидемия.'
- source_word: אָנֹכִי מְכַלֶּה אוֹתָם
  choice: Я истреблю их
  rationale: Причастие מְכַלֶּה выражает решительное действие Бога по доведению до конца, уничтожению; русский футурум естественен в пророческом объявлении суда.
theological_decisions:
- issue: Отказ Бога принять пост и жертвы во время суда
  choice: Обе уступительные части отвергают надежду народа добиться ответа постом и жертвами; последняя часть объявляет Божий суд.
  alternative: Понимать отказ как относящийся только к молитвенному воплю либо смягчить объявление суда.
  rationale: Параллельная структура прямо охватывает и вопль постящихся, и жертвенные приношения, после чего называет три средства суда.
- issue: Референт местоимения в אֵינֶנִּי רֹצָם
  choice: Сохранено «Я не приму их», допускающее ближайшее отнесение к жертвам и более широкое — к людям.
  alternative: Явно написать «не приму эти жертвы» или «не окажу им благоволения».
  rationale: Мужской суффикс множественного числа формально не согласуется напрямую с двумя существительными женского рода единственного числа и потому может иметь более широкий референт. Уточнение сняло бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Всесожжение», «хлебное приношение» и «мор» сохранены как точные и узнаваемые термины; сноски поясняют неоднозначность местоимения и менее частотное слово «мор».
