  - severity: medium
    issue: «Нет, мечом...»
    rationale: «Нет» здесь не является естественным русским соответствием заключительному כִּי и может восприниматься как отдельное отрицание. «Но» сохраняет контраст между отвергнутым богослужением и объявленным судом без лишнего толкования.
