revisions:
- from: Даже если они будут поститься, Я не услышу их вопля; и даже если они принесут всесожжение и хлебное приношение, Я не приму их[a]. Нет, мечом, голодом и мором[b] Я истреблю их.
  to: Хотя они постятся, Я не слышу их вопля; и хотя они приносят всесожжение и хлебное приношение, Я не принимаю их. Но мечом, голодом и мором Я погублю их.[a]
  rationale: Убраны избыточно гипотетическое «даже если» и неестественное в данном месте «Нет». Перевод сохраняет уступительный параллелизм исходного текста, неоднозначность «их» в выражении «не принимаю их» и пророческую определённость заключительного суда. Сноска о «море» сохранена и уточнена; сноска к «не принимаю их» не обязательна, поскольку русская формулировка уже сохраняет исходную неоднозначность, а предложенное в черновике «не благоволю к ним» является скорее интерпретационным, чем равным по форме вариантом.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:13:58Z'
