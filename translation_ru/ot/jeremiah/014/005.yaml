  yaml_path: translation/ot/jeremiah/014/005.yaml
  text: For even the doe in the field gives birth and abandons her young[a], because there is no grass.
translation:
  language: ru
  text: Ведь даже лань в поле рожает и оставляет детёныша[a], потому что нет травы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и оставляет его». В еврейском тексте дополнение прямо не названо; по смыслу речь идёт о новорождённом детёныше, которого лань оставляет из-за отсутствия корма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит пояснение к предшествующему плачу; «ведь» естественно передаёт эту связь в русском повествовании.
- source_word: גַם
  choice: даже
  rationale: 'Частица усиливает образ: бедствие затронуло не только людей и домашних животных, но даже диких зверей.'
- source_word: אַיֶּלֶת
  choice: лань
  rationale: Слово обозначает самку оленя; «лань» точно, кратко и уместно в современном литературном русском.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямо сохраняет конкретный пространственный образ исходного текста.
- source_word: יָלְדָה
  choice: рожает
  rationale: Глагол означает рождение потомства. Настоящее время передаёт живую поэтическую картину продолжающейся засухи.
- source_word: וְעָזוֹב
  choice: и бросает детёныша
  rationale: עזב может означать «оставлять, покидать, бросать». Объект в еврейском тексте не назван, но по контексту подразумевается новорождённый детёныш; он выражен в переводе ради ясности.
- source_word: כִּי לֹא הָיָה
  choice: потому что нет
  rationale: Оборот указывает причину поступка лани; настоящее время согласуется с живым описанием бедствия.
- source_word: דֶּשֶׁא
  choice: трава
  rationale: Существительное обозначает молодую траву или свежую зелень; «трава» ясно и лаконично передаёт образ отсутствующего корма.
