  source_fidelity: 'Смысл передан точно: Иеремия обращается к Богу и пересказывает пророческие заверения, произнесённые от первого лица Бога. Образы меча и голода сохранены, как и «истинный мир». Однако בַּמָּקוֹם הַזֶּה обозначает нахождение «в этом месте», а не «на этом месте». Начальное וָאֹמַר в данном повествовательном контексте естественно передать «Тогда я сказал».'
  naturalness: Торжественная интонация и вложенная прямая речь уместны для современного литературного библейского русского. «В этом месте» здесь и естественнее, и точнее, чем «на этом месте».
  terminology: '«Владыка Господь» последовательно передаёт сочетание אֲדֹנָי יְהוִה без искусственного удвоения «Господь Господь». «Меч», «голод» и «истинный мир» сохранены без доктринального истолкования. Первое лицо «дам Я вам» следует оставить: оно отражает притязание пророков говорить от имени Бога.'
