  text: Then I said, “Ah, Lord GOD, look, the prophets are saying to them, ‘You will not see the sword, and famine will not come upon you, for I will give you true peace in this place.’”
translation:
  language: ru
  text: 'Тогда я сказал: «О, Владыка Господь! Вот, пророки говорят им: „Не увидите вы меча, и голода у вас не будет, ибо истинный мир дам Я вам в этом месте“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲהָהּ
  choice: О
  rationale: Передаёт краткое восклицание скорби и тревоги естественным современным русским междометием.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Сохраняет сочетание титула Адонай с божественным именем, избегая неестественного повтора «Господь Господь».
- source_word: לֹא תִרְאוּ חֶרֶב
  choice: Не увидите вы меча
  rationale: Близко передаёт идиому о том, что народ не столкнётся с войной; образ меча сохранён.
- source_word: שְׁלוֹם אֱמֶת
  choice: истинный мир
  rationale: 'Сохраняет неоднозначное сочетание существительных: мир, характеризуемый как подлинный или надёжный.'
- source_word: בַּמָּקוֹם הַזֶּה
  choice: на этом месте
  rationale: Прямое и естественное обозначение данного места.
theological_decisions:
- issue: Ложное пророчество изложено от первого лица Бога
  choice: Сохранено «дам Я вам» внутри прямой речи пророков
  alternative: «Бог даст вам»
  rationale: Еврейский текст представляет пророков говорящими от имени Бога; перевод не должен заранее смягчать их притязание.
- issue: Передача тетраграмматона в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Господь
  alternative: Владыка Яхве
  rationale: Выбрана укоренённая русская передача, различающая титул и имя типографически и лексически без введения конфессионально спорного произношения.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Инверсия «Не увидите вы» и «дам Я вам» подчёркивает пророческую прямую речь, не делая её архаичной.
