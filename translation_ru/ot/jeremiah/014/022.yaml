source:
  edition: WLC
  text: הֲ/יֵ֨שׁ בְּ/הַבְלֵ֤י הַ/גּוֹיִם֙ מַגְשִׁמִ֔ים וְ/אִם הַ/שָּׁמַ֖יִם יִתְּנ֣וּ רְבִבִ֑ים הֲ/לֹ֨א אַתָּה ה֜וּא יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ וּ֨/נְקַוֶּה לָּ֔/ךְ כִּֽי אַתָּ֥ה עָשִׂ֖יתָ אֶת כָּל אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/022.yaml
  text: Are there any among the idols of the nations that bring rain? Or can the heavens give showers? Is it not you[a], O Yahweh our God? And we wait for you[c][b], for you have made all these things.
translation:
  language: ru
  text: Есть ли среди идолов народов[a] такие, что посылают дождь? Или могут небеса дать ливни? Не Ты ли, Яхве, Бог наш? Мы уповаем на Тебя[b], ведь Ты создал всё это[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «среди суетных (или ничтожных) вещей народов»; имеются в виду их ложные боги, идолы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мы ждём Тебя». Еврейский глагол означает ожидание с надеждой.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Ты совершил всё это».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֵשׁ בְּהַבְלֵי הַגּוֹיִם
  choice: Есть ли среди идолов народов
  rationale: Риторический вопрос передан естественной русской конструкцией. הבלים буквально означает «дуновения, суета, ничтожества», но в данном полемическом контексте обозначает ложных богов народов; это отражено в основном тексте, а буквальный образ сохранён в сноске.
- source_word: מַגְשִׁמִים
  choice: такие, что посылают дождь
  rationale: Причастная каузативная форма указывает на тех, кто вызывает дождь. «Посылают дождь» естественно по-русски и сохраняет представление об активном источнике дождя.
- source_word: וְאִם הַשָּׁמַיִם יִתְּנוּ רְבִבִים
  choice: Или могут небеса дать ливни?
  rationale: וְאִם вводит вторую часть риторической альтернативы, поэтому передано как «или». רְבִבִים обозначает дождевые потоки или ливни; глагол נתן сохранён посредством «дать».
- source_word: הֲלֹא אַתָּה הוּא
  choice: Не Ты ли это
  rationale: Местоименная конструкция имеет усилительное и отождествляющее значение. «Не Ты ли это» сохраняет её подчёркнутый характер, не добавляя слова «единственный», которого в тексте нет.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом, чтобы отразить форму исходного текста.
- source_word: וּנְקַוֶּה לָּךְ
  choice: Мы уповаем на Тебя
  rationale: קוה выражает ожидание, соединённое с надеждой. «Уповаем» естественно для возвышенной молитвенной речи и передаёт доверительное ожидание; возможный более буквальный вариант отмечен в сноске.
- source_word: כִּי אַתָּה עָשִׂיתָ אֶת כָּל אֵלֶּה
  choice: ведь Ты создал всё это
  rationale: כִּי вводит основание надежды. עשה допускает значения «делать» и «создавать»; в контексте небес и дождя «создал» ясно выражает Божью власть над названным, тогда как более широкая возможность «совершил» отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Характер надежды в וּנְקַוֶּה לָּךְ
  choice: Мы уповаем на Тебя
  alternative: Мы ждём Тебя
  rationale: Основной вариант передаёт доверие и ожидающую надежду одновременно. Сноска сохраняет конкретный оттенок ожидания, не сводя значение лишь к отвлечённой надежде.
- issue: Значение עָשִׂיתָ применительно ко «всему этому»
  choice: Ты создал всё это
  alternative: Ты совершил всё это
  rationale: Контекст природных явлений поддерживает значение созидательной власти, однако многозначность обычного глагола עשה сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-пророческим звучанием. Риторические вопросы сохранены; архаичные обороты избегаются. Заглавные буквы в местоимениях при обращении к Богу поддерживают принятый русский библейский регистр, не изменяя смысла.
