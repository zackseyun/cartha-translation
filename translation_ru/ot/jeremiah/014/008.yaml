  text: מִקְוֵה֙ יִשְׂרָאֵ֔ל מֽוֹשִׁיע֖/וֹ בְּ/עֵ֣ת צָרָ֑ה לָ֤/מָּה תִֽהְיֶה֙ כְּ/גֵ֣ר בָּ/אָ֔רֶץ וּ/כְ/אֹרֵ֖חַ נָטָ֥ה לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/008.yaml
  text: O Hope of Israel[a], his Savior in time of distress, why should you be like a foreigner in the land[b], like a traveler who turns aside to spend the night?
translation:
  language: ru
  text: О Надежда Израиля, его Спаситель во время бедствия! Почему Ты как чужеземец в земле[a], как путник, остановившийся на ночлег?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как пришелец в земле»; или: «как временный житель в земле».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как путник, остановившийся только на ночлег».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוֵה
  choice: Надежда
  rationale: В обращении к Богу существительное обозначает Того, на Кого надеется Израиль. «Надежда» естественно передаёт этот смысл и сохраняет силу божественного именования.
- source_word: מוֹשִׁיעוֹ
  choice: его Спаситель
  rationale: Суффикс 3-го лица мужского рода единственного числа относится к Израилю как собирательному единственному; «его Спаситель» сохраняет грамматику исходного текста.
- source_word: בְּעֵת צָרָה
  choice: во время бедствия
  rationale: Сочетание обозначает пору тяжёлого кризиса; «бедствие» передаёт серьёзность צָרָה современным литературным языком.
- source_word: לָמָּה תִהְיֶה
  choice: Почему Ты словно
  rationale: Имперфект входит в риторический вопрос с оттенком скорбного недоумения. Русская конструкция с «почему» и «словно» естественно передаёт сопоставление, не превращая его в утверждение.
- source_word: כְּגֵר בָּאָרֶץ
  choice: словно пришелец в этой земле
  rationale: גֵר — живущий среди местного населения человек без статуса коренного жителя. «Пришелец» сохраняет отчуждённость и библейскую торжественность; указательное «этой» естественно выражает определённость בָּאָרֶץ в контексте земли Израиля.
- source_word: וּכְאֹרֵחַ
  choice: словно путник
  rationale: אֹרֵחַ обозначает находящегося в пути человека; «путник» — ясное, литературное и не чрезмерно архаичное соответствие.
- source_word: נָטָה לָלוּן
  choice: свернувший с дороги лишь переночевать
  rationale: Фраза описывает временную остановку на ночлег. «Свернувший с дороги» передаёт движение נָטָה, а «лишь переночевать» — кратковременность пребывания, подразумеваемую контекстом.
theological_decisions:
- issue: Обращение к Богу и титульная функция начальных существительных
  choice: 'Передать начало как прямое обращение: «Надежда Израиля, его Спаситель во время бедствия!»'
  alternative: «Надежда Израиля и спаситель его во время беды»
  rationale: Контекст представляет молитвенное обращение к Господу. Такая передача сохраняет титульную и богословскую силу выражений, не добавляя позднейших доктринальных уточнений.
- issue: Образ Божьего присутствия в земле
  choice: Сохранить риторическое сравнение Бога с пришельцем и временным путником
  alternative: Истолковать вопрос как утверждение, что Бог покинул землю
  rationale: Исходный текст выражает напряжённый вопрос-плач, а не прямое учение об отсутствии Бога; перевод сохраняет эту неоднозначность и напряжение.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью. Заглавные «Ты» и «Спаситель» уместны в прямом обращении к Богу. Синтаксис сохраняет риторический вопрос и параллелизм еврейской строки; лексика избегает как просторечия, так и излишней церковнославянской архаики.
