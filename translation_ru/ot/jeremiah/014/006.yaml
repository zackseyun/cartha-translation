lexical_decisions:
- source_word: וּפְרָאִים
  choice: И дикие ослы
  rationale: פְרָאִים обозначает диких ослов, или онагров; современное «дикие ослы» точно и понятно передаёт название животного.
- source_word: עָמְדוּ
  choice: стоят
  rationale: Хотя в еврейском употреблена перфектная форма, настоящее время естественно передаёт живую картину продолжающейся засухи.
- source_word: עַל שְׁפָיִם
  choice: на голых высотах
  rationale: שְׁפָיִם — открытые, лишённые растительности возвышенности; «голые высоты» передаёт и рельеф, и бесплодие местности.
- source_word: שָׁאֲפוּ רוּחַ
  choice: жадно втягивают воздух
  rationale: Сочетание буквально описывает втягивание ветра или воздуха; в условиях засухи оно передаёт тяжёлое, отчаянное дыхание животных, не сводя образ к единственному возможному толкованию.
- source_word: כַּתַּנִּים
  choice: словно шакалы
  rationale: В данном контексте пустынной местности תַּנִּים наиболее естественно обозначает шакалов, характерных обитателей запустелых мест.
- source_word: כָּלוּ עֵינֵיהֶם
  choice: Глаза их гаснут
  rationale: Оборот выражает ослабевание и помутнение глаз от истощения; «гаснут» сохраняет образность и естественно звучит по-русски.
- source_word: כִּי אֵין עֵשֶׂב
  choice: потому что нет травы
  rationale: עֵשֶׂב здесь означает траву, служащую пищей пасущимся животным.
