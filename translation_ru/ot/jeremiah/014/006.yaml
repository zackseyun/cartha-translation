  text: And the wild donkeys stand on the bare heights[a]; they pant for air like jackals. Their eyes fail[c][b], because there is no grass.
translation:
  language: ru
  text: И дикие ослы стоят на голых высотах; они втягивают воздух[a], словно шакалы. Глаза их гаснут, потому что нет травы.
