reference: Jeremiah 14:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/עָ֣ם הַ/זֶּ֗ה כֵּ֤ן אָֽהֲבוּ֙ לָ/נ֔וּעַ רַגְלֵי/הֶ֖ם לֹ֣א חָשָׂ֑כוּ וַ/יהוָה֙ לֹ֣א רָצָ֔/ם עַתָּה֙ יִזְכֹּ֣ר עֲוֺנָ֔/ם וְ/יִפְקֹ֖ד חַטֹּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/010.yaml
  text: 'Thus says Yahweh concerning this people: Thus they have loved to wander[a]; they have not restrained their feet. Therefore Yahweh does not accept them[c][b]. Now he will remember their iniquity and punish their sins.'
translation:
  language: ru
  text: 'Так говорит Яхве об этом народе: «Так они любят скитаться[a] и не удерживают своих ног. Поэтому Яхве не принимает их[b]. Теперь Он вспомнит их беззаконие и взыщет с них за их грехи[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «любят блуждать»; буквально: «они полюбили скитаться».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не благоволит к ним».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее: «посетит их грехи» — еврейское выражение, означающее призвать к ответу и подвергнуть суду за грехи.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לָעָם הַזֶּה
  choice: об этом народе
  rationale: 'Предлог ל здесь естественно понимать как указание на предмет высказывания: речь идёт об этом народе.'
- source_word: כֵּן אָהֲבוּ לָנוּעַ
  choice: Они любят скитаться
  rationale: Конструкция אָהַב с инфинитивом выражает склонность и расположение к действию; настоящее время по-русски естественно передаёт устойчивое поведение. כֵּן не вынесено в отдельное «так», поскольку в русском оно создавало бы тяжеловесный повтор и не добавляло бы ясности.
- source_word: לָנוּעַ
  choice: скитаться
  rationale: Слово передаёт беспокойное перемещение и в контексте имеет нравственный оттенок уклонения, не сводясь только к физическому движению.
- source_word: רַגְלֵיהֶם לֹא חָשָׂכוּ
  choice: не удерживают ног своих
  rationale: Сохранён конкретный еврейский образ ног и смысл отсутствия самоограничения; порядок слов придаёт фразе достоинство без архаической неясности.
- source_word: לֹא רָצָם
  choice: не принимает их
  rationale: רצה здесь обозначает благосклонное принятие; перевод не ограничивает смысл лишь эмоциональным недовольством.
- source_word: יִזְכֹּר עֲוֺנָם
  choice: вспомнит их беззаконие
  rationale: Сохранён глагол «вспомнит», имеющий здесь судебный смысл, и различие между עָוֺן и последующим חַטָּאת.
- source_word: וְיִפְקֹד חַטֹּאתָם
  choice: взыщет с них за грехи
  rationale: В контексте суда פקד означает привлечь к ответу и наказать; русская идиома «взыскать за» передаёт это, сохраняя оттенок судебного посещения лучше, чем буквальное «посетит».
theological_decisions:
- issue: Смысл לֹא רָצָם как выражения Божьего отношения к народу
  choice: Яхве не принимает их
  alternative: Яхве не благоволит к ним
  rationale: «Не принимает» сохраняет возможный заветно-культовый оттенок благосклонного принятия, не сводя выражение к эмоции.
- issue: Судебная идиома יִזְכֹּר ... וְיִפְקֹד
  choice: вспомнит их беззаконие и взыщет с них за грехи
  alternative: вспомнит их вину и посетит их грехи
  rationale: Перевод сохраняет активное Божье воздаяние и образ судебного памятования, но не вводит дополнительной догматической схемы. Более буквальное значение פקד отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены имя Яхве, образ неудерживаемых ног и судебное «вспомнит»; неясная для современного читателя буквальная идиома с פקד передана естественным выражением и пояснена в сноске.
