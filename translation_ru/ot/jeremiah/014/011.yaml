  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י אַל תִּתְפַּלֵּ֛ל בְּעַד הָ/עָ֥ם הַ/זֶּ֖ה לְ/טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/011.yaml
  text: Then Yahweh said to me[a], “Do not pray for the welfare of this people.”
translation:
  language: ru
  text: 'Тогда Яхве сказал мне: «Не молись о благе этого народа».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Вав с последовательной формой продвигает повествование; «тогда» естественно передаёт последовательность событий по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֵלָי
  choice: мне
  rationale: Естественная русская передача предлога с суффиксом первого лица при глаголе речи.
- source_word: אַל תִּתְפַּלֵּל
  choice: не молись
  rationale: Сочетание אַל с соответствующей глагольной формой выражает прямой запрет; «молиться» сохраняет основное значение התפלל без излишнего уточнения «ходатайствовать».
- source_word: בְּעַד הָעָם הַזֶּה
  choice: о ... этого народа
  rationale: בְּעַד обозначает действие в пользу или от имени кого-либо. Русская конструкция «молиться о благе этого народа» естественно выражает ходатайственный смысл и сохраняет собирательное единственное число הָעָם.
- source_word: לְטוֹבָה
  choice: о благе
  rationale: Форма обозначает благо, пользу или благополучие как цель молитвы; «о благе» кратко и близко передаёт смысл, не сужая его до материального благосостояния.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон. «Яхве» сохраняет личное имя; «Господь» заменяет его титулом, а «Иегова» основано на более позднем смешанном чтении.
- issue: Характер запрещённой молитвы
  choice: «Не молись о благе этого народа»
  alternative: «Не ходатайствуй за этот народ»
  rationale: Глагол означает «молиться», а בְּעַד и לְטוֹבָה уточняют, что речь идёт о молитве ради пользы народа. Выбранный вариант сохраняет это ограничение и не превращает запрет в безусловное запрещение любого упоминания народа в молитве.
translation_notes:
  register: 'Современный литературный русский язык с dignified библейской краткостью. Порядок компонентов слегка перестроен ради естественного управления: «молиться о благе народа» передаёт одновременно בְּעַד и לְטוֹבָה. Смысловая неоднозначность לְטוֹבָה между благом, пользой и благополучием сохранена словом «благо».'
