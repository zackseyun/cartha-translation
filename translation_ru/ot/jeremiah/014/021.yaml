  text: אַל תִּנְאַץ֙ לְמַ֣עַן שִׁמְ/ךָ֔ אַל תְּנַבֵּ֖ל כִּסֵּ֣א כְבוֹדֶ֑/ךָ זְכֹ֕ר אַל תָּפֵ֥ר בְּרִֽיתְ/ךָ֖ אִתָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/021.yaml
  text: Do not spurn us for the sake of your name; do not dishonor your glorious throne[a]. Remember; do not break your covenant with us.
translation:
  language: ru
  text: Не отвергай нас ради имени Твоего; не бесчести престол славы Твоей[a]. Вспомни; не нарушай завета Твоего с нами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «престол славы Твоей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנְאַץ
  choice: не отвергай нас
  rationale: Глагол נאץ выражает презрительное отвержение, а не просто нейтральный отказ. В русском «не отвергай нас» естественно звучит в молитвенном обращении; дополнение «нас» подразумевается контекстом и заключительными словами «с нами».
- source_word: לְמַעַן שִׁמְךָ
  choice: ради имени Твоего
  rationale: Устойчиво и ясно передаёт обращение к Божьему имени — Его чести, явленному характеру и репутации — как основанию просьбы.
- source_word: תְּנַבֵּל
  choice: не бесчести
  rationale: Порода piel здесь означает подвергать бесчестию или позору. «Бесчестить» сохраняет силу выражения и не привносит более узкого значения ритуального осквернения.
- source_word: כִּסֵּא כְבוֹדֶךָ
  choice: престола славы Твоей
  rationale: Формальная конструкция «престол славы Твоей» близко воспроизводит еврейское сочетание и сохраняет его возвышенность и возможную многозначность.
- source_word: זְכֹר
  choice: Вспомни
  rationale: Прямой императив к Богу. «Вспомни» передаёт язык заветной молитвы, где речь не обязательно о забывчивости, а о призыве принять завет во внимание и действовать соответственно.
- source_word: תָּפֵר
  choice: не нарушай
  rationale: פרר применительно к завету означает нарушать, расторгать или делать недействительным. Русское «нарушать завет» ясно и идиоматично.
- source_word: בְּרִיתְךָ אִתָּנוּ
  choice: завета Твоего с нами
  rationale: Точно сохраняет существительное «завет» и предложное сочетание «с нами», не добавляя отсутствующего в тексте глагола «заключил».
theological_decisions:
- issue: К чему относится выражение «престол славы Твоей»
  choice: Оставлено без уточнения как «престол славы Твоей».
  alternative: Можно понимать как храм/Сион — земное место Божьего престола — либо как небесный престол Бога.
  rationale: Еврейское выражение допускает многослойное прочтение. Перевод не разрешает эту богословскую неоднозначность в пользу одного референта.
- issue: Императив זְכֹר, обращённый к Богу
  choice: 'Передан буквально: «Вспомни».'
  alternative: «Помни» или «прими во внимание».
  rationale: Форма «Вспомни» сохраняет напряжённую настойчивость молитвы и традиционный язык завета, не предполагая непременно, что Бог буквально забыл.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенно-пророческим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы как редакционная норма. Синтаксис сохраняет краткие настойчивые повелительные формы оригинала.
