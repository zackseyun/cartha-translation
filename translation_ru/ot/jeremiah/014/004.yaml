id: JER.14.4
reference: Jeremiah 14:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בַּ/עֲב֤וּר הָ/אֲדָמָה֙ חַ֔תָּה כִּ֛י לֹא הָיָ֥ה גֶ֖שֶׁם בָּ/אָ֑רֶץ בֹּ֥שׁוּ אִכָּרִ֖ים חָפ֥וּ רֹאשָֽׁ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/004.yaml
  text: Because the ground is dismayed[a], since there has been no rain in the land, the farmers are ashamed[b]; they cover their heads.
translation:
  language: ru
  text: Оттого что земля растрескалась[a], ибо не было дождя в стране, земледельцы посрамлены; они покрывают головы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земля в смятении» либо «земля сокрушена». Еврейский глагол может обозначать как смятение, так и сокрушение; в контексте засухи, вероятно, имеется в виду растрескавшаяся почва.'
    reason: lexical_alternative
  - marker: b
    text: Покрывать голову было знаком стыда, скорби или траура.
    reason: cultural_note
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: Оттого что
  rationale: Передаёт причинную связь с последующим состоянием земли и естественно звучит по-русски.
- source_word: הָאֲדָמָה
  choice: земля
  rationale: Здесь имеется в виду возделываемая почва, пострадавшая от засухи; в данном контексте русское «земля» естественно и достаточно точно.
- source_word: חַתָּה
  choice: растрескалась
  rationale: Глагол может означать сокрушение или смятение, но при отсутствии дождя наиболее вероятен конкретный образ иссохшей, растрескавшейся земли; неоднозначность отмечена в сноске.
- source_word: כִּי
  choice: ибо
  rationale: Вводит объяснение причины и позволяет избежать повтора конструкции «оттого что».
- source_word: גֶשֶׁם
  choice: дождь
  rationale: Прямой и обычный русский эквивалент.
- source_word: בָּאָרֶץ
  choice: в стране
  rationale: Обозначает территорию, поражённую засухой, вероятно землю Иудеи; «в стране» отличает это значение от предшествующей возделываемой земли.
- source_word: בֹּשׁוּ
  choice: посрамлены
  rationale: Сохраняет значение стыда, унижения и несбывшегося ожидания земледельцев, не сводя его лишь к внутреннему чувству.
- source_word: אִכָּרִים
  choice: земледельцы
  rationale: Точный, современный и достойный эквивалент для людей, обрабатывающих землю.
- source_word: חָפוּ רֹאשָׁם
  choice: они покрывают головы
  rationale: Сохраняет конкретный культурный жест скорби, стыда или траура, не подменяя его толкованием.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Земля» и «страна» разграничивают возделываемую почву и территорию. Конкретное «растрескалась» выбрано по контексту засухи, а присущая еврейскому глаголу образная неоднозначность сохранена в сноске.
