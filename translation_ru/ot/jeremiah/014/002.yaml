- source_word: קָדְרוּ לָאָרֶץ
  choice: мрачно поникли к земле
  rationale: Сочетание сохраняет траурную темноту קדר и передаёт связанную с לָאָרֶץ картину унижения и подавленности; буквальная конструкция по-русски была бы неясна.
- source_word: צִוְחַת
  choice: вопль
  rationale: Передаёт сильный крик бедствия и соответствует высокому, но понятному регистру пророческой поэзии.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалима
  rationale: Устоявшаяся русская форма имени собственного в родительном падеже.
- source_word: עָלָתָה
  choice: возносится
  rationale: Сохраняет образ движения кверху и естественно сочетается с «воплем» в русском литературном языке.
