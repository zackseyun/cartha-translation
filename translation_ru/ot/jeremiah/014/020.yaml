id: JER.14.20
reference: Jeremiah 14:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יָדַ֧עְנוּ יְהוָ֛ה רִשְׁעֵ֖/נוּ עֲוֺ֣ן אֲבוֹתֵ֑י/נוּ כִּ֥י חָטָ֖אנוּ לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/020.yaml
  text: We acknowledge[a], O Yahweh, our wickedness, the iniquity of our fathers, for we have sinned against you.
translation:
  language: ru
  text: Мы признаём, Яхве, наше нечестие, беззаконие наших отцов[a], ибо мы согрешили против тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наших предков». Буквально: «наших отцов».'
    reason: Лексема может обозначать отцов, праотцов или предков; основной текст сохраняет буквальную форму.
lexical_decisions:
- source_word: יָדַעְנוּ
  choice: мы признаём
  rationale: Глагол буквально означает «знать», но в покаянном контексте передаёт осознание и открытое признание вины. «Признаём» сохраняет и смысл осознания, и исповедальный оттенок, не усиливая его до формулы «исповедуем».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: רִשְׁעֵנוּ
  choice: наше нечестие
  rationale: Абстрактное существительное обозначает порочность или виновное зло. «Нечестие» естественно передаёт нравственный смысл и не сливается со следующим עָוֹן.
- source_word: עֲוֺן
  choice: беззаконие
  rationale: Слово может обозначать беззаконие, вину или её последствия. Здесь «беззаконие» сохраняет нравственную тяжесть термина и параллелизм с «нечестием».
- source_word: אֲבוֹתֵינוּ
  choice: наших отцов
  rationale: Еврейский текст буквально говорит «наших отцов». Эта формулировка сохранена в основном тексте, а более широкое контекстуальное значение «предков» отмечено в сноске.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание признания. «Ибо» естественен для возвышенной молитвенной речи и ясно выражает причинную связь.
- source_word: חָטָאנוּ
  choice: мы согрешили
  rationale: Совершенный вид передаёт совершённое действие, сохраняющее значение для настоящего покаянного признания.
- source_word: לָךְ
  choice: против тебя
  rationale: При глаголе «грешить» предлог указывает на того, против кого совершён грех; по-русски это естественно передаётся сочетанием «согрешить против».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Передача אֲבוֹתֵינוּ
  choice: наших отцов
  alternative: наших предков
  rationale: Основной текст сохраняет грамматически мужскую и буквальную формулировку источника. Возможное более широкое родовое значение не исключается и указано в сноске.
- issue: Соотношение нечестия народа и беззакония отцов
  choice: сохранены два отдельных выражения без поясняющего перефразирования
  alternative: объединить их как общую или наследуемую вину
  rationale: Стих сополагает «наше нечестие» и «беззаконие наших отцов», но не разъясняет точный характер связи между ними. Перевод не вводит учение о наследуемой вине и не устраняет возможную коллективно-историческую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным тоном. Обращение «Яхве» выделено запятыми. Местоимение «тебя» дано со строчной буквы по общим современным орфографическим нормам; это не выражает меньшего почтения.
