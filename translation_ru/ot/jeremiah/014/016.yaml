  text: וְ/הָ/עָ֣ם אֲשֶׁר הֵ֣מָּה נִבְּאִ֣ים לָ/הֶ֡ם יִֽהְי֣וּ מֻשְׁלָכִים֩ בְּ/חֻצ֨וֹת יְרוּשָׁלִַ֜ם מִ/פְּנֵ֣י הָ/רָעָ֣ב וְ/הַ/חֶ֗רֶב וְ/אֵ֤ין מְקַבֵּר֙ לָ/הֵ֔מָּה הֵ֣מָּה נְשֵׁי/הֶ֔ם וּ/בְנֵי/הֶ֖ם וּ/בְנֹֽתֵי/הֶ֑ם וְ/שָׁפַכְתִּ֥י עֲלֵי/הֶ֖ם אֶת רָעָתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/016.yaml
  text: And the people to whom they are prophesying will be thrown out into the streets of Jerusalem because of the famine and the sword[a], with no one to bury them—them, their wives, their sons, and their daughters. And I will pour out on them their evil.
translation:
  language: ru
  text: А народ, которому они пророчествуют, будет выброшен на улицы Иерусалима из-за голода и меча, и некому будет похоронить ни их самих, ни их жён, ни сыновей, ни дочерей. Я изолью на них их зло[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их нечестие»; либо: «причитающееся им бедствие» или «их несчастье». Еврейское слово может обозначать как нравственное зло, так и вызванное им бедствие.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִבְּאִים לָהֶם
  choice: которому они пророчествуют
  rationale: Передаёт направленность пророческой речи к народу и продолжающийся характер действия; по-русски звучит естественно.
- source_word: מֻשְׁלָכִים בְּחֻצוֹת יְרוּשָׁלִַם
  choice: будет брошен на улицах Иерусалима
  rationale: Форма Hophal выражает действие, совершаемое над народом; «брошен» передаёт позорную оставленность тел, а предлог ב естественнее всего отражён как местонахождение — «на улицах».
- source_word: מִפְּנֵי הָרָעָב וְהַחֶרֶב
  choice: из-за голода и меча
  rationale: מִפְּנֵי имеет причинное значение. Образ «меча» сохранён, а не заменён более общим словом «война».
- source_word: וְאֵין מְקַבֵּר לָהֵמָּה
  choice: и некому будет похоронить их
  rationale: Экзистенциальная конструкция с причастием указывает на отсутствие того, кто совершил бы погребение; будущее время согласовано с контекстом пророчества.
- source_word: הֵמָּה נְשֵׁיהֶם וּבְנֵיהֶם וּבְנֹתֵיהֶם
  choice: их самих, их жён, сыновей и дочерей
  rationale: Повторное הֵמָּה имеет усилительно-возобновляющую функцию; «их самих» сохраняет акцент и вводит перечень членов семей.
- source_word: וְשָׁפַכְתִּי
  choice: Я изолью
  rationale: Сохраняется устойчивый библейский образ излияния суда, при этом русский глагол имеет достойный литературный регистр.
- source_word: אֶת רָעָתָם
  choice: их зло
  rationale: Буквальное соответствие сохраняет неоднозначность רָעָה между нравственным злом и постигшим их бедствием; варианты пояснены в сноске.
theological_decisions:
- issue: Значение רָעָתָם в формуле Божьего суда
  choice: их зло
  alternative: их нечестие; причитающееся им бедствие; их несчастье
  rationale: Еврейское выражение допускает понимание как совершённого ими зла, которое возвращается на них, так и бедствия, постигшего их в качестве суда. Основной текст не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены конкретный образ меча и метафора излияния суда; синтаксис упрощён лишь настолько, чтобы стих был понятен обычному читателю.
