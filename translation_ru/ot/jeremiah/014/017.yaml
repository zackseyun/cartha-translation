source:
  edition: WLC
  text: וְ/אָמַרְתָּ֤ אֲלֵי/הֶם֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה תֵּרַ֨דְנָה עֵינַ֥/י דִּמְעָ֛ה לַ֥יְלָה וְ/יוֹמָ֖ם וְ/אַל תִּדְמֶ֑ינָה כִּי֩ שֶׁ֨בֶר גָּד֜וֹל נִשְׁבְּרָ֗ה בְּתוּלַת֙ בַּת עַמִּ֔/י מַכָּ֖ה נַחְלָ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/017.yaml
  text: 'And you shall say to them this word: ‘Let my eyes run down with tears night and day[a], and let them not cease, for the virgin daughter of my people is broken with a great breaking[c][b], with a very grievous wound.’'
translation:
  language: ru
  text: 'И скажи им это слово: «Пусть мои глаза изливают слёзы ночью и днём и не перестают[a], потому что дева, дочь моего народа[b], сокрушена великим сокрушением[c], поражена жестокой раной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не умолкают» / «и не знают покоя»; еврейский глагол может означать прекращение, затихание или наступление покоя.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дева, дочь моего народа» — поэтическое изображение народа в образе молодой женщины.'
    reason: cultural_note
  - marker: c
    text: 'В еврейском тексте употреблены однокоренные слова: буквально «сокрушена великим сокрушением»; повтор усиливает мысль.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: И скажи им
  rationale: Пророческое указание передано естественным русским повелительным оборотом; соединительный וְ сохранён посредством «И».
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: это слово
  rationale: Сохраняется единственное число דָּבָר и торжественная библейская формула без поясняющей парафразы «весть».
- source_word: תֵּרַדְנָה עֵינַי דִּמְעָה
  choice: Пусть мои глаза изливают слёзы
  rationale: В русском дословное «пусть глаза стекают слезой» неестественно; «изливают слёзы» сохраняет образ непрерывного потока и глаза как грамматический субъект.
- source_word: לַיְלָה וְיוֹמָם
  choice: ночью и днём
  rationale: Естественный русский меризм, обозначающий непрерывность плача.
- source_word: וְאַל תִּדְמֶינָה
  choice: и не перестают
  rationale: В данном контексте דמה означает прекращаться или затихать; форма согласуется с глазами, а по смыслу подразумевает непрестанные слёзы.
- source_word: כִּי
  choice: потому что
  rationale: Ясно передаёт причинную связь между плачем и бедствием народа.
- source_word: שֶׁבֶר גָּדוֹל נִשְׁבְּרָה
  choice: сокрушена великим сокрушением
  rationale: Однокоренные «сокрушена — сокрушением» воспроизводят эмфатическую внутреннюю фигуру еврейского выражения, хотя оборот намеренно сохраняет поэтическую необычность.
- source_word: בְּתוּלַת בַּת־עַמִּי
  choice: дева, дочь моего народа
  rationale: Сохраняется поэтическая персонификация народа молодой незамужней женщиной; запятая помогает естественно прочитать сочетание двух образных наименований.
- source_word: מַכָּה נַחְלָה מְאֹד
  choice: поражена жестокой раной
  rationale: «Жестокая рана» естественно передаёт крайнюю тяжесть поражения, не сужая спорный оттенок נַחְלָה до однозначно «неисцелимой».
theological_decisions:
- issue: Поэтическая персонификация בְּתוּלַת בַּת־עַמִּי
  choice: дева, дочь моего народа
  alternative: народ Иудеи / дочь Сиона
  rationale: Образ сохранён без сведения его к географическому или буквальному толкованию; так удерживаются поэтическая скорбь и неоднозначность исходного текста.
- issue: Степень тяжести раны в נַחְלָה
  choice: жестокой раной
  alternative: неисцелимой раной
  rationale: Контекст допускает оттенок тяжёлой, мучительной или неисцелимой раны. Основной текст не утверждает более узкое богословски значимое значение «неисцелимая», которого сама форма здесь не требует однозначно.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис остаётся доступным, а намеренно необычный однокоренной оборот сохранён ради поэтического усиления оригинала; его буквальность пояснена сноской.
