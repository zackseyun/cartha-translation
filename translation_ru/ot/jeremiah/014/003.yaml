id: JER.14.3
reference: Jeremiah 14:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַדִּ֣רֵי/הֶ֔ם שָׁלְח֥וּ צעורי/הם לַ/מָּ֑יִם בָּ֣אוּ עַל גֵּבִ֞ים לֹא מָ֣צְאוּ מַ֗יִם שָׁ֤בוּ כְלֵי/הֶם֙ רֵיקָ֔ם בֹּ֥שׁוּ וְ/הָכְלְמ֖וּ וְ/חָפ֥וּ רֹאשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/003.yaml
  text: Their nobles send their servants for water[a]; they come to the cisterns and find no water. They return with their containers empty; they are ashamed and humiliated[c][b], and they cover their heads.
translation:
  language: ru
  text: Их вельможи посылают слуг за водой[a]. Те приходят к водоёмам[b], но воды не находят; возвращаются с пустыми сосудами. Они пристыжены и посрамлены и покрывают головы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молодых людей», «младших»; еврейское слово допускает возрастное и социальное понимание, а контекст поручения благоприятствует значению «слуги».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к ямам», «к бассейнам», «к цистернам».'
    reason: lexical_alternative
  - marker: c
    text: Покрывать голову было знаком стыда, скорби или тяжёлого бедствия.
    reason: cultural_note
lexical_decisions:
- source_word: אַדִּירֵיהֶם
  choice: их вельможи
  rationale: Слово обозначает знатных, влиятельных или могущественных людей; «вельможи» естественно передаёт их высокий общественный статус.
- source_word: צְעוּרֵיהֶם
  choice: слуг
  rationale: Буквально слово может указывать на младших или молодых, но здесь, вероятно, означает подчинённых, которых вельможи посылают за водой; неоднозначность сохранена в сноске.
- source_word: לַמָּיִם
  choice: за водой
  rationale: При глаголе «посылать» сочетание выражает цель поручения.
- source_word: גֵּבִים
  choice: водоёмам
  rationale: 'Слово обозначает места, где собирают или удерживают воду: ямы, бассейны либо цистерны. Общее «водоёмы» не уточняет искусственность сооружений сверх еврейского текста.'
- source_word: שָׁבוּ כְלֵיהֶם רֵיקָם
  choice: возвращаются с пустыми сосудами
  rationale: Естественная русская формулировка передаёт возвращение людей, чьи ёмкости для воды остались пустыми.
- source_word: בֹּשׁוּ וְהָכְלְמוּ
  choice: они пристыжены и посрамлены
  rationale: Два близких глагола сохранены как усилительная пара, выражающая стыд и унижение.
- source_word: וְחָפוּ רֹאשָׁם
  choice: и покрывают головы
  rationale: Прямо передаёт жест скорби, стыда или бедствия, не сводя его к одному толкованию.
