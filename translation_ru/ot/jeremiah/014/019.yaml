source:
  edition: WLC
  text: הֲ/מָאֹ֨ס מָאַ֜סְתָּ אֶת יְהוּדָ֗ה אִם בְּ/צִיּוֹן֙ גָּעֲלָ֣ה נַפְשֶׁ֔/ךָ מַדּ֨וּעַ֙ הִכִּיתָ֔/נוּ וְ/אֵ֥ין לָ֖/נוּ מַרְפֵּ֑א קַוֵּ֤ה לְ/שָׁלוֹם֙ וְ/אֵ֣ין ט֔וֹב וּ/לְ/עֵ֥ת מַרְפֵּ֖א וְ/הִנֵּ֥ה בְעָתָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/019.yaml
  text: Have you utterly rejected Judah? Does your soul loathe Zion? Why have you struck us so that there is no healing for us? We hoped for peace[a], but there was no good, and for a time of healing, but behold[b], terror.
translation:
  language: ru
  text: Неужели Ты совсем отверг Иудею? Или[a] Твоя душа[b] питает отвращение к Сиону? Почему Ты поразил нас, так что нам нет исцеления? Мы надеялись на мир, но не было ничего доброго; ждали времени исцеления — но вот ужас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейскую частицу можно также понять как начало самостоятельного вопроса: «Неужели Твоя душа питает отвращение к Сиону?»'
    reason: lexical_alternative
  - marker: b
    text: «Твоя душа» — древнееврейское образное выражение, означающее внутреннее существо или всю личность.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמָאֹס מָאַסְתָּ
  choice: Неужели Ты совсем отверг
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает действие. «Совсем отверг» естественно передаёт эту эмфазу по-русски.
- source_word: אִם
  choice: Или
  rationale: Частица может связывать второй вопрос с первым как разделительную альтернативу; эта связь сохранена в основном тексте, а возможное самостоятельное вопросительное прочтение отмечено в сноске.
- source_word: גָּעֲלָה נַפְשֶׁךָ
  choice: Твоя душа возгнушалась
  rationale: «Возгнушалась» сохраняет сильный оттенок отвращения в געל, а «Твоя душа» — яркое древнееврейское обозначение внутреннего существа или всей личности.
- source_word: הִכִּיתָנוּ
  choice: Ты поразил нас
  rationale: Конкретное значение נכה — «ударить, поразить»; русский глагол сохраняет образ нанесённой раны и связь с последующим отсутствием исцеления.
- source_word: מַרְפֵּא
  choice: исцеление
  rationale: Одинаковый перевод в обоих случаях сохраняет повтор и метафору выздоровления после удара.
- source_word: קַוֵּה לְשָׁלוֹם
  choice: Мы надеялись на мир
  rationale: Форма קַוֵּה в данном обороте выражает ожидание; прошедшее время естественно передаёт контраст между надеждой и наступившим бедствием.
- source_word: טוֹב
  choice: ничего доброго
  rationale: Широкое значение טוֹב не сужено до благополучия или процветания; отрицательная конструкция естественно оформлена по-русски.
- source_word: בְעָתָה
  choice: ужас
  rationale: Слово обозначает ужас, смятение или потрясение; «ужас» кратко и сильно завершает поэтический контраст.
theological_decisions:
- issue: Речь о Божьем отвержении Иудеи и отвращении к Сиону
  choice: Сохранить прямые и резкие вопросы молитвенного плача без смягчения.
  alternative: Истолковать их как временное оставление или лишь как заветное наказание.
  rationale: Сам стих не разрешает напряжение между избранием народа и переживаемым судом. Перевод не должен подменять вопрос богословским объяснением.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного плача. Сохранены поэтические параллели, повтор «исцеление» и резкий финальный контраст; архаичное по оттенку «возгнушалась» оправдано сильной эмоциональной окраской исходного глагола.
