  to: Неужели Ты совсем отверг Иудею? Или[a] Твоя душа[b] питает отвращение к Сиону? Почему Ты поразил нас, так что нам нет исцеления? Мы надеялись на мир, но не было ничего доброго; ждали времени исцеления — но вот ужас.
  rationale: Правка устраняет неестественное «на время исцеления», ясно передавая ожидание времени исцеления, и заменяет архаичное «возгнушалась» на современное литературное выражение с тем же значением отвращения. Союз «так что» естественно связывает удар с отсутствием исцеления, не добавляя нового смысла. Сохранены вопросительная форма, сила жалобы, повтор мотива исцеления и неоднозначность частицы אִם в сноске.
