  text: אִם יָצָ֣אתִי הַ/שָּׂדֶ֗ה וְ/הִנֵּה֙ חַלְלֵי חֶ֔רֶב וְ/אִם֙ בָּ֣אתִי הָ/עִ֔יר וְ/הִנֵּ֖ה תַּחֲלוּאֵ֣י רָעָ֑ב כִּֽי גַם נָבִ֧יא גַם כֹּהֵ֛ן סָחֲר֥וּ אֶל אֶ֖רֶץ וְ/לֹ֥א יָדָֽעוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/018.yaml
  text: If I go out into the field[a], look—those slain by the sword! And if I enter the city[b], look—those sick with famine! For both prophet and priest wander through the land and do not know what to do.
translation:
  language: ru
  text: Если я выйду в поле — вот сражённые мечом! Если войду в город — вот изнурённые голодом! Ведь и пророк, и священник ходят по стране и не знают.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная фраза в еврейском тексте трудна. Глагол, переданный как «ходят», может иметь и оттенок торгового занятия: «и пророк, и священник занимаются торговлей в стране, но не понимают». Возможен также смысл: «они ушли в незнакомую землю». Буквально последние слова: «и не знают».'
    reason: Сохраняет лексическую и синтаксическую неоднозначность סָחֲרוּ אֶל־אֶרֶץ וְלֹא יָדָעוּ, не добавляя в основной текст отсутствующий объект глагола «знают».
lexical_decisions:
- source_word: אִם יָצָאתִי הַשָּׂדֶה
  choice: Если я выхожу в поле
  rationale: Условная конструкция передана настоящим временем, сохраняющим живое описание повторяющегося наблюдения; «поле» естественно противопоставлено городу и может обозначать открытую местность.
- source_word: וְהִנֵּה
  choice: там
  rationale: В данном восклицательном построении «там» естественно указывает на открывающуюся взору картину, передавая дейктическую силу הִנֵּה без архаичного «вот» в каждой половине стиха.
- source_word: חַלְלֵי חֶרֶב
  choice: сражённые мечом
  rationale: Передаёт людей, убитых или смертельно поражённых оружием, и сохраняет образ меча.
- source_word: תַּחֲלוּאֵי רָעָב
  choice: изнурённые голодом
  rationale: Фраза обозначает видимых жертв голода и параллельна «сражённым мечом»; «изнурённые» звучит естественно и не ограничивает смысл конкретной болезнью.
- source_word: כִּי גַם נָבִיא גַם כֹּהֵן
  choice: Ведь и пророк, и священник
  rationale: «Ведь» передаёт пояснительную силу כִּי, а повтор «и... и...» сохраняет эмфазу גַם...גַם.
- source_word: סָחֲרוּ אֶל אֶרֶץ
  choice: скитаются по земле
  rationale: Передаёт движение по стране и растерянность контекста, но трудное выражение допускает также торговый или направительный смысл, отмеченный в сноске.
- source_word: וְלֹא יָדָעוּ
  choice: и не знают, что делать
  rationale: В еврейском объект не назван; русское дополнение делает фразу естественной и выражает практическую беспомощность, при этом буквальная неопределённость и иные разборы указаны в сноске.
theological_decisions:
- issue: Положение пророка и священника среди бедствия
  choice: Они изображены скитающимися и не знающими, что делать.
  alternative: Они могут заниматься торговлей либо уйти в незнакомую землю.
  rationale: Основной текст сохраняет картину растерянности религиозных руководителей, не утверждая сверх текста ни их особую вину, ни положительное решение; неоднозначность трудной заключительной фразы вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык; краткие параллельные восклицания передают резкость увиденного. Лексика понятна широкому читателю и сохраняет достоинство пророческой речи. Единственный маркер [a] стоит непосредственно при трудной заключительной фразе.
