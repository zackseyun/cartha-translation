  rationale: Убрано интерпретирующее дополнение «что делать» и смягчено «скитаются» до «ходят», чтобы основной текст не разрешал спорную еврейскую конструкцию. Условные формы «выйду/войду» естественно передают живое гипотетическое наблюдение. Сноска сохранена у заключительной трудной фразы и уточнена, чтобы альтернативы не выглядели более определёнными, чем исходный текст.
