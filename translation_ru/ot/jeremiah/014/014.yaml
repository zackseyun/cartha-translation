base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/014.yaml
  text: And Yahweh said to me[a], “The prophets are prophesying lies in my name. I did not send them, nor did I command them, nor did I speak to them. They are prophesying to you a false vision, divination, emptiness, and the deceit of their own heart.”
translation:
  language: ru
  text: 'И сказал мне Яхве: «Пророки пророчествуют ложь от Моего имени. Я не посылал их, не давал им повелений и не говорил с ними. Они пророчествуют вам ложное видение, гадания, пустоту[a] и обман их собственного сердца».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «никчёмность» или «идол»; древнееврейское слово в других контекстах может иметь и эти значения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом; форма понятна современному русскому читателю и соответствует исходному тексту.
- source_word: שֶׁקֶר / חֲזוֹן שֶׁקֶר
  choice: ложь / ложные видения
  rationale: Сохраняет общий смысловой ряд ложности и обмана, при этом естественно звучит в обеих русских конструкциях.
- source_word: הַנְּבִאִים נִבְּאִים
  choice: пророки пророчествуют
  rationale: Сохраняет намеренный корневой повтор и значение продолжающегося действия.
- source_word: בִּשְׁמִי
  choice: от Моего имени
  rationale: Естественная русская формула для притязания на Божье полномочие; не сводит выражение лишь к произнесению имени.
- source_word: לֹא שְׁלַחְתִּים וְלֹא צִוִּיתִים וְלֹא דִבַּרְתִּי אֲלֵיהֶם
  choice: Я не посылал их, не давал им повелений и не говорил с ними
  rationale: Сохраняет трёхчастное отрицание Божьего поручения, повеления и обращения к пророкам.
- source_word: קֶסֶם
  choice: гадания
  rationale: Обозначает мантическую практику; общеупотребительное слово яснее, чем более специальное «дивинация».
- source_word: אֱלִיל
  choice: пустоту
  rationale: В данном перечислении передаёт ничтожность и бессодержательность ложного пророчества; возможные значения «никчёмность» и «идол» отмечены в сноске.
- source_word: תַּרְמוּת לִבָּם
  choice: обман собственного сердца
  rationale: Передаёт внутренний, порождённый самими пророками источник обмана, сохраняя собирательное единственное число «сердце».
- source_word: הֵמָּה מִתְנַבְּאִים לָכֶם
  choice: Они пророчествуют вам
  rationale: Сохраняет подчёркнутое местоимение и прямо называет адресатов ложного пророчества.
theological_decisions:
- issue: Источник и характер вести ложных пророков
  choice: Перевод прямо отрицает Божье поручение и представляет их весть как ложь, гадание, пустоту и обман их собственного сердца.
  alternative: Перечень можно понимать не как четыре строго отдельные категории, а как накопление близких характеристик ложного пророчества.
  rationale: Перевод сохраняет перечисление и не навязывает ему технической классификации, оставляя открытым соотношение его элементов.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Корневой повтор «пророки пророчествуют» сохранён как значимый элемент оригинала; синтаксис трёх Божьих отрицаний сделан плавным и ясным. Маркер сноски поставлен непосредственно после слова, к которому относится.
