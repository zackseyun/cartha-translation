  variant: modern literary Russian
source:
  edition: WLC
  text: לָ֤/מָּה תִֽהְיֶה֙ כְּ/אִ֣ישׁ נִדְהָ֔ם כְּ/גִבּ֖וֹר לֹא יוּכַ֣ל לְ/הוֹשִׁ֑יעַ וְ/אַתָּ֧ה בְ/קִרְבֵּ֣/נוּ יְהוָ֗ה וְ/שִׁמְ/ךָ֛ עָלֵ֥י/נוּ נִקְרָ֖א אַל תַּנִּחֵֽ/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/009.yaml
  text: Why should you be like a stunned man[a], like a warrior who cannot save? Yet you are in our midst, O Yahweh, and your name is called over us; do not forsake us.
translation:
  language: ru
  text: Почему Ты словно ошеломлённый человек, словно воин, не способный спасти? Но ведь Ты среди нас, Яхве, и мы названы Твоим именем[a]. Не оставляй нас!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Твоё имя призывается над нами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה תִהְיֶה
  choice: Почему Ты словно
  rationale: Вопросительное לָמָּה с имперфектом היה выражает протест и мольбу, а не простой вопрос о будущем. Естественная русская конструкция передаёт модальный оттенок без тяжеловесного «почему Ты должен быть».
- source_word: כְּאִישׁ נִדְהָם
  choice: словно человек, оцепеневший от изумления
  rationale: Нифальная форма נִדְהָם обозначает человека, поражённого, ошеломлённого и потому словно лишённого способности действовать. Развёрнутая формулировка сохраняет оттенок изумления и параллель с бессильным воином.
- source_word: כְּגִבּוֹר
  choice: словно воин
  rationale: גִּבּוֹר здесь обозначает сильного воина; военный образ непосредственно связан с последующей неспособностью спасти.
- source_word: לֹא יוּכַל לְהוֹשִׁיעַ
  choice: не способный спасти
  rationale: יכול с инфинитивом выражает неспособность, а הושיע — спасение или избавление. Причастная конструкция естественно продолжает русское сравнение.
- source_word: וְאַתָּה בְקִרְבֵּנוּ
  choice: Но ведь Ты среди нас
  rationale: 'וְ получает контрастное значение; частица «ведь» передаёт основание мольбы: присутствие Бога среди народа противоречит образам оцепенения и бессилия.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» укоренена в современной русской библеистической передаче.
- source_word: וְשִׁמְךָ עָלֵינוּ נִקְרָא
  choice: и имя Твоё наречено над нами
  rationale: Сохранён буквальный образ призывания имени «над» народом, выражающий принадлежность и Божье притязание на него; более идиоматическое значение пояснено в сноске.
- source_word: אַל תַּנִּחֵנוּ
  choice: Не оставляй нас!
  rationale: Отрицательная волевая форма выражает настойчивую мольбу. «Не оставляй» современно и естественно передаёт значение не покидать и не предоставлять самим себе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; передача личным именем сохраняет его отличие от титула.
- issue: Заветная формула וְשִׁמְךָ עָלֵינוּ נִקְרָא
  choice: имя Твоё наречено над нами
  alternative: мы носим Твоё имя
  rationale: Основной текст сохраняет необычный, но понятный древнееврейский образ, не сводя его только к одному толкованию; сноска сообщает естественный русский эквивалент принадлежности.
- issue: Сравнение Бога с оцепеневшим человеком и бессильным воином
  choice: сохранить как риторический вопрос-мольбу
  alternative: смягчить как утверждение о кажущемся отсутствии Бога
  rationale: 'Текст молитвы намеренно сохраняет богословское напряжение: молящиеся говорят о кажущемся бездействии Бога, одновременно исповедуя Его присутствие среди них.'
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного плача. Заглавные местоимения при обращении к Богу поддерживают принятый русский религиозный регистр. Синтаксис сохраняет параллелизм двух сравнений и резкий переход к исповеданию Божьего присутствия.
