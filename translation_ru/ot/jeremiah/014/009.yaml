  source_fidelity: 'Смысл и риторическая структура переданы верно: вопросительная мольба сохраняет два параллельных сравнения, противопоставление Божьему присутствию и заключительную просьбу. «Оцепеневший от изумления» несколько сужает נִדְהָם до причины оцепенения; более нейтральное «ошеломлённый» точнее сохраняет диапазон «поражённый, ошеломлённый, приведённый в замешательство».'
  naturalness: '«Имя Твоё наречено над нами» формально отражает образ оригинала, но в современном литературном русском звучит архаично и не вполне прозрачно: «наречь» обычно означает дать имя. Идиоматическое «мы названы Твоим именем» естественно передаёт формулу принадлежности; буквальный образ уместно сохранить в сноске.'
  terminology: «Яхве» правильно передаёт יהוה. «Воин», «спасти», «среди нас» и «Не оставляй нас» соответствуют контексту и регистру. Заглавные местоимения допустимы в молитвенном литературном регистре.
