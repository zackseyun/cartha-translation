lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֶל יִרְמְיָהוּ
  choice: Слово Яхве, которое было к Иеремии
  rationale: Сохранена традиционная для пророческих заголовков конструкция «слово… было к», естественная в современном литературном русском и близкая к еврейской формуле.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: עַל דִּבְרֵי
  choice: о
  rationale: В данном заголовке сочетание идиоматически обозначает тему пророческого слова; краткое русское «о» передаёт смысл без буквального, но неестественного «о делах».
- source_word: הַבַּצָּרוֹת
  choice: засухах
  rationale: Слово обозначает засухи или вызванные ими бедствия; множественное число оригинала сохранено.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале употреблено собственное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский с достоинством пророческого заголовка. Формула «слово… было к» сохраняет библейский характер речи, оставаясь понятной; множественное число «засухах» отражает форму оригинала.
