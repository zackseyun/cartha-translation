base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/001.yaml
  text: And when Jeremiah had finished speaking to all the people all the words of Yahweh their God[a], with which Yahweh their God had sent him to them—all these words—
translation:
  language: ru
  text: И когда Иеремия закончил говорить всему народу все слова Яхве, их Бога, с которыми Яхве, их Бог, послал его к ним, — все эти слова[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст повторяет: «все эти слова», усиливая сказанное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И когда
  rationale: Нарративная формула с וַ передаёт переход к следующему событию; в современном русском она естественно включается во временную конструкцию без архаичного «и было».
- source_word: כְּכַלּוֹת יִרְמְיָהוּ לְדַבֵּר
  choice: когда Иеремия закончил говорить
  rationale: כְּ с инфинитивом כַּלּוֹת обозначает завершённое действие, предшествующее дальнейшему повествованию. Формулировка сохраняет глагол речи и звучит естественно по-русски.
- source_word: כָּל הָעָם
  choice: всему народу
  rationale: Речь идёт обо всех собравшихся адресатах Иеремии, а не о народе как отвлечённом политическом целом.
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: все слова Яхве
  rationale: Конкретное «слова» сохраняет форму пророческой речи и подготавливает заключительное повторение той же лексемы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אֱלֹהֵיהֶם
  choice: их Бога
  rationale: Несмотря на морфологически множественную форму אֱלֹהִים, сочетание с Яхве имеет здесь однозначно единственное значение.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם אֲלֵיהֶם
  choice: с которыми Яхве, их Бог, послал его к ним
  rationale: Относительная конструкция отнесена к «словам»; объектный суффикс у שְׁלָחוֹ обозначает Иеремию, а אֲלֵיהֶם — народ как адресатов. Оборот «с которыми» сохраняет связь между посланником и порученными ему словами.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: Повтор «слов» уместен в ближайшем контексте пророческой речи и сохраняет подчёркнутую избыточность еврейского текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не вносит конфессиональной замены.
translation_notes:
  register: Современный литературный русский с сохранением торжественного повествовательного ритма. Заключительные тире оставлены, поскольку синтаксическое предложение продолжается в следующем стихе. Повтор имени Яхве, слов «их Бог» и «все слова» намеренно сохранён как значимая особенность оригинала.
