source:
  edition: WLC
  text: ו/בא/ה וְ/הִכָּ֖ה אֶת אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁ֧ר לַ/מָּ֣וֶת לַ/מָּ֗וֶת וַ/אֲשֶׁ֤ר לַ/שְּׁבִי֙ לַ/שֶּׁ֔בִי וַ/אֲשֶׁ֥ר לַ/חֶ֖רֶב לֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/011.yaml
  text: 'He will come and strike the land of Egypt: those for death[a], to death; those for captivity, to captivity; and those for the sword, to the sword.'
translation:
  language: ru
  text: 'Он придёт и поразит землю Египта: кому суждено умереть — умрёт, кому попасть в плен — попадёт в плен, а кому пасть от меча — падёт от меча.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «кто на смерть — на смерть, кто в плен — в плен, кто под меч — под меч». В еврейском тексте употреблена краткая повторяющаяся формула приговора.'
    reason: Сохранение буквальной альтернативы и пояснение необычной еврейской конструкции.
lexical_decisions:
- source_word: וּבָאָה
  choice: Он придёт
  rationale: Форма мужского рода единственного числа в пророческой последовательности имеет будущее значение; местоимение сохраняет отсылку к царю Вавилона из ближайшего контекста, не добавляя его имени в сам стих.
- source_word: וְהִכָּה
  choice: и поразит
  rationale: Глагол נכה имеет широкое значение «ударить, поразить»; «поразит» естественно звучит по-русски и не уточняет способ нападения сверх исходного текста.
- source_word: אֶת־אֶרֶץ מִצְרַיִם
  choice: землю Египта
  rationale: Перевод сохраняет существительное אֶרֶץ и тем самым подчёркивает страну и её территорию как объект удара.
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת
  choice: кому суждено умереть — умрёт
  rationale: Естественная русская передача краткой распределительной формулы; она сохраняет неизбежность приговора и повтор понятия смерти, не вводя конкретной причины смерти.
- source_word: וַאֲשֶׁר לַשְּׁבִי לַשֶּׁבִי
  choice: кому попасть в плен — попадёт в плен
  rationale: שְׁבִי обозначает плен или состояние пленника; повтор «в плен» передаёт параллелизм и акцент исходного текста.
- source_word: וַאֲשֶׁר לַחֶרֶב לֶחָרֶב
  choice: кому пасть от меча — падёт от меча
  rationale: Сохранён буквальный образ меча как обозначение насильственной смерти; повтор поддерживает трёхчастный ритм еврейского текста.
theological_decisions:
- issue: К кому относится подлежащее в единственном числе
  choice: «Он» — царь Вавилона, выступающий орудием суда в данном контексте
  alternative: Безличная передача либо явное добавление имени Навуходоносора
  rationale: Еврейские глаголы стоят в мужском роде единственного числа, а непосредственный контекст указывает на царя Вавилона. Местоимение сохраняет форму исходного стиха и не вносит в него отсутствующее имя.
- issue: Характер трёхчастной формулы суда
  choice: 'Сохранена распределительная неизбежность: каждому достанется назначенная ему участь'
  alternative: Понять перечисление лишь как три возможных последствия войны без оттенка предопределённого приговора
  rationale: Повтор конструкции לַמָּוֶת לַמָּוֶת и параллельных ей выражений подчёркивает соответствие между назначенной участью и её исполнением; перевод не уточняет, кем именно она назначена.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Трёхчастный параллелизм сохранён, но предельно буквальная и по-русски неясная конструкция раскрыта глаголами; её форма приведена в сноске.
