  text: וְ/שִׁבַּ֗ר אֶֽת מַצְּבוֹת֙ בֵּ֣ית שֶׁ֔מֶשׁ אֲשֶׁ֖ר בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אֶת בָּתֵּ֥י אֱלֹהֵֽי מִצְרַ֖יִם יִשְׂרֹ֥ף בָּ/אֵֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/013.yaml
  text: He will shatter the pillars of Beth-shemesh that is in the land of Egypt[b][a], and he will burn the temples of the gods of Egypt with fire.
translation:
  language: ru
  text: Он сокрушит священные столбы в Бет-Шемеше[a], в земле Египта, а храмы богов Египта сожжёт огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бет-Шемеш означает «Дом солнца»; вероятно, имеется в виду египетский город, известный под греческим названием Гелиополь.
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁבַּר
  choice: Он сокрушит
  rationale: Глагол שׁבר означает разбить, сокрушить; «сокрушит» естественно передаёт решительное уничтожение в контексте суда.
- source_word: מַצְּבוֹת
  choice: священные столбы
  rationale: מַצֵּבָה обозначает культовые вертикально поставленные камни или столбы. Уточнение «священные» передаёт культовый смысл и не позволяет понять их как обычные архитектурные колонны.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Бет-Шемеша
  rationale: Название места передано транслитерацией, без подмены вероятным египетским или греческим названием; его значение и вероятная идентификация вынесены в примечание.
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  choice: что в земле Египетской
  rationale: Относительное придаточное естественно отнесено к Бет-Шемешу и сохраняет уточнение о его местонахождении в Египте.
- source_word: בָּתֵּי אֱלֹהֵי מִצְרַיִם
  choice: храмы египетских богов
  rationale: Буквально «дома богов Египта»; в культовом контексте современное русское «храмы» ясно и точно передаёт референт.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: сожжёт огнём
  rationale: Формулировка сохраняет явно названное в еврейском тексте слово «огонь» и эмфатический характер выражения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Порядок частей слегка адаптирован для естественного русского синтаксиса; союз וְ перед второй частью передан как «а», подчёркивая переход от разрушения столбов к сожжению храмов. Культовое значение מַצְּבוֹת раскрыто в основном тексте, поэтому отдельное лексическое примечание не требуется.
