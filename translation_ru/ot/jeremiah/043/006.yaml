  source_fidelity: Список лиц и титул Навузардана переданы верно. Однако в русском тексте придаточное с «которых» синтаксически недостаточно отчётливо отделено от следующих самостоятельных дополнений — Иеремии и Баруха. В еврейском тексте относительное предложение относится к «всем людям», тогда как Иеремия и Барух присоединены как отдельные объекты основного, продолжающегося из предыдущего стиха действия.
  naturalness: «С Гедалией» возможно как буквальная калька, но по-русски не вполне естественно в значении оставления под чьей-либо опекой. Кроме того, цепочка «сыном Ахикама, сына Шафана» создаёт нежелательную синтаксическую неясность. Явное относительное уточнение делает родословие ясным и сохраняет современный литературный строй фразы.
  terminology: «Начальник стражи» — удачная, устоявшаяся и понятная передача רב־טבחים; поясняющая сноска сохраняет буквальный оттенок титула. Имена оставлены в привычной русской библейской передаче.
