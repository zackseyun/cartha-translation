  text: אֶֽת הַ֠/גְּבָרִים וְ/אֶת הַ/נָּשִׁ֣ים וְ/אֶת הַ/טַּף֮ וְ/אֶת בְּנ֣וֹת הַ/מֶּלֶךְ֒ וְ/אֵ֣ת כָּל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר הִנִּ֨יחַ֙ נְבוּזַרְאֲדָ֣ן רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֣ם בֶּן שָׁפָ֑ן וְ/אֵת֙ יִרְמְיָ֣הוּ הַ/נָּבִ֔יא וְ/אֶת בָּר֖וּךְ בֶּן נֵרִיָּֽהוּ־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/006.yaml
  text: the men[a], the women, the little children, the king’s daughters, and every person whom Nebuzaradan the captain of the guard had left with Gedaliah son of Ahikam, son of Shaphan, and Jeremiah the prophet[c][b], and Baruch son of Neriah—
translation:
  language: ru
  text: мужчин, женщин, малых детей[a], дочерей царя и всех людей[b], которых Навузардан, начальник стражи[c], оставил у Гедалии, сына Ахикама, который был сыном Шафана, а также пророка Иеремию и Баруха, сына Нерии, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей»; еврейское טַף может обозначать как малых детей, так и детей-иждивенцев в более широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всякую душу». В данном случае «душа» — еврейский способ обозначить человека.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «начальник убивающих (палачей)»; так называлась должность, обычно передаваемая как «начальник стражи».'
    reason: cultural_note
lexical_decisions:
- source_word: הַגְּבָרִים
  choice: мужчин
  rationale: В перечне вместе с женщинами и детьми слово обозначает взрослых мужчин; нейтральное «мужчин» точно и естественно.
- source_word: הַנָּשִׁים
  choice: женщин
  rationale: Контекст требует общего обозначения женщин, а не более узкого «жён».
- source_word: הַטַּף
  choice: малых детей
  rationale: טַף обозначает маленьких детей либо детей-иждивенцев; «малых детей» сохраняет указание на младших членов семейной группы, а более широкая возможность отмечена в сноске.
- source_word: בְּנוֹת הַמֶּלֶךְ
  choice: дочерей царя
  rationale: Передаёт явную форму еврейского выражения без интерпретирующей замены на «царевен».
- source_word: כָּל הַנֶּפֶשׁ
  choice: всех людей
  rationale: נֶפֶשׁ здесь означает людей, а не нематериальную душу; множественное «всех людей» естественно по-русски и соответствует собирательно-дистрибутивному смыслу.
- source_word: הִנִּיחַ
  choice: оставил
  rationale: Глагол в данном контексте означает, что Навузардан оставил этих людей при Гедалии.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Это придворно-воинский титул; традиционно понятная передача должности предпочтительнее буквального, но вводящего в заблуждение «начальник палачей».
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: с Гедалией, сыном Ахикама, сына Шафана
  rationale: После הִנִּיחַ частица אֶת указывает на лицо, при котором были оставлены люди; «с Гедалией» сохраняет краткость и естественность.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: пророка Иеремию
  rationale: Сохраняются имя и явно выраженный титул; падеж обусловлен продолжающимся перечнем прямых объектов.
- source_word: בָּרוּךְ בֶּן נֵרִיָּהוּ
  choice: Баруха, сына Нерии
  rationale: Обычная русская передача имени и еврейского патронима.
