base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/002.yaml
  text: Azariah son of Hoshaiah, Johanan son of Kareah, and all the arrogant men said to Jeremiah, “You are speaking a lie. The LORD our God has not sent you to say, ‘You must not go to Egypt to sojourn there.’”
translation:
  language: ru
  text: 'Азария, сын Осаии, Иоханан, сын Карея, и все дерзкие люди сказали Иеремии: «Ты говоришь неправду! Господь, наш Бог, не посылал тебя сказать: „Не идите в Египет, чтобы жить там пришельцами“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַזֵּדִים
  choice: дерзкие
  rationale: Передаёт значение сознательной самонадеянности и непокорности; в данном контексте естественнее современного русского «надменные» и точнее, чем общее «злые».
- source_word: שֶׁקֶר אַתָּה מְדַבֵּר
  choice: Ты говоришь ложь
  rationale: Сохраняет прямое обвинение пророка во лжи и близко следует еврейской конструкции.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Господь, Бог наш
  rationale: Передаёт тетраграмматон принятой русской библейской формой «Господь» и сохраняет присоединённое исповедание «Бог наш».
- source_word: לָגוּר שָׁם
  choice: чтобы поселиться там как пришельцы
  rationale: Глагол גור обозначает проживание вне своей земли в положении пришельца; добавление «как пришельцы» сохраняет эту смысловую грань.
theological_decisions:
- issue: Приписываемое Иеремии запрещение идти в Египет
  choice: Не ходите в Египет
  alternative: Вы не должны идти в Египет
  rationale: Прямой запрет естественно передаёт לֹא תָבֹאוּ, не усиливая модальность сверх выраженной в еврейском тексте.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная русская передача остаётся понятной широкой аудитории и не привносит конфессионально маркированного предпочтения.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Реплика передана резко и прямо; синтаксис имён и отчеств сохраняет ясность при нескольких действующих лицах.
