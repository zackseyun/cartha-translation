base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/007.yaml
  text: So they entered the land of Egypt[a], for they did not listen to the voice of Yahweh, and they came as far as Tahpanhes.
translation:
  language: ru
  text: И вошли они в землю Египта, потому что не послушались голоса Яхве[a], и дошли до Тахпанхеса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не повиновались Яхве». Еврейское выражение «не слушать голоса» может означать отказ повиноваться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: вошли
  rationale: 'С дополнением «землю Египетскую» глагол בוא естественно передаётся как движение внутрь территории: «вошли».'
- source_word: אֶרֶץ מִצְרַיִם
  choice: землю Египетскую
  rationale: Сохранено явно выраженное в еврейском тексте слово אֶרֶץ («земля, страна»); форма естественна для dignified Russian biblical narrative.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину совершённого действия; «потому что» ясно передаёт причинную связь.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: не послушали голоса
  rationale: Передача сохраняет образ еврейской идиомы «слушать голос», не сводя её молча только к понятию повиновения, хотя этот смысл здесь подразумевается.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменено титулом.
- source_word: וַיָּבֹאוּ עַד
  choice: дошли до
  rationale: Сочетание בוא с עַד обозначает достижение предела или пункта назначения; по-русски это естественно выражается словами «дошли до».
- source_word: תַּחְפַּנְחֵס
  choice: Тахпанхес
  rationale: Название места передано транслитерацией, близкой к еврейской форме, без отождествления с альтернативным греческим названием.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; его передача как «Яхве» сохраняет различие между именем и титулом.
- issue: Смысл идиомы שׁמע בקול
  choice: не послушали голоса
  alternative: не повиновались
  rationale: Основной текст сохраняет конкретный образ исходного выражения, а значение отказа повиноваться указано в сноске, чтобы не устранять смысловую ёмкость идиомы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным строем. Синтаксис сохраняет последовательность двух действий и причинное пояснение исходного текста; архаические формы и конфессионально обусловленные замены избегаются.
