  text: וְ/הִצַּ֣תִּי אֵ֗שׁ בְּ/בָתֵּי֙ אֱלֹהֵ֣י מִצְרַ֔יִם וּ/שְׂרָפָ֖/ם וְ/שָׁבָ֑/ם וְ/עָטָה֩ אֶת אֶ֨רֶץ מִצְרַ֜יִם כַּ/אֲשֶׁר יַעְטֶ֤ה הָֽ/רֹעֶה֙ אֶת בִּגְד֔/וֹ וְ/יָצָ֥א מִ/שָּׁ֖ם בְּ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/012.yaml
  text: And he will set fire to the temples of the gods of Egypt[a], and he will burn them and carry them away. He will wrap himself in the land of Egypt as a shepherd wraps himself in his garment[b], and he will go out from there in peace.
translation:
  language: ru
  text: Я разожгу огонь в храмах богов Египта[a]; он сожжёт их и возьмёт их в плен[b]. Он закутается в землю Египта, как пастух закутывается в свою одежду, и выйдет оттуда с миром.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В дальнейшем контексте действующим лицом выступает царь Вавилона, поэтому возможно понимание: «Он разожжёт огонь в храмах богов Египта». Однако еврейская форма здесь буквально означает: «Я разожгу огонь».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «унесёт их как добычу». Речь может идти о богах Египта, их изображениях либо храмовых ценностях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: Я подожгу
  rationale: 'Масоретская форма — 1-е лицо единственного числа: «Я подожгу». Перевод сохраняет грамматическую форму исходного текста, хотя далее следуют глаголы в 3-м лице, относящиеся к царю Вавилона.'
- source_word: בְּבָתֵּי אֱלֹהֵי מִצְרַיִם
  choice: храмы богов Египта
  rationale: Буквально «дома богов Египта»; применительно к божествам בָּתִּים обозначает их святилища, поэтому «храмы» ясно и естественно передаёт смысл.
- source_word: וּשְׂרָפָם
  choice: он сожжёт их
  rationale: Сохраняется прямое значение глагола «сжечь» и неоднозначность местоименного объекта, которым могут быть храмы либо связанные с богами изображения.
- source_word: וְשָׁבָם
  choice: и уведёт их в плен
  rationale: Глагол שבה обычно означает «брать в плен, уводить пленными». Формулировка сохраняет образ пленения богов или их изображений, не подменяя его более узким понятием разграбления.
- source_word: וְעָטָה אֶת אֶרֶץ מִצְרַיִם
  choice: Он закутается в землю Египта
  rationale: Глагол עטה описывает покрывание или облачение. Возвратная конструкция естественно передаёт образ овладения Египтом столь же легко, как человек закутывается в одежду.
- source_word: כַּאֲשֶׁר יַעְטֶה הָרֹעֶה אֶת בִּגְדוֹ
  choice: как пастух закутывается в свою одежду
  rationale: Повтор «закутается — закутывается» отражает повтор одного еврейского глагола и сохраняет сравнение земли с одеждой.
- source_word: וְיָצָא מִשָּׁם בְּשָׁלוֹם
  choice: и выйдет оттуда с миром
  rationale: '«С миром» сохраняет широкое значение בְּשָׁלוֹם: мирно, благополучно и невредимым.'
theological_decisions:
- issue: Смена лица между וְהִצַּתִּי («Я подожгу») и последующими глаголами в 3-м лице
  choice: В основном тексте сохранить 1-е лицо исходной масоретской формы, а затем естественную смену на 3-е лицо.
  alternative: «Он подожжёт храмы богов Египта» — с царём Вавилона как единым действующим лицом всей последовательности.
  rationale: Исходный текст прямо даёт форму 1-го лица, тогда как ближайший контекст связывает последующие действия с царём Вавилона. Сохранение этой напряжённости не скрывает ни грамматику текста, ни контекстуально возможное понимание.
- issue: Объект местоименных суффиксов в וּשְׂרָפָם וְשָׁבָם
  choice: Оставить местоимение «их» без уточнения и пояснить возможные референты в сноске.
  alternative: Явно назвать богов, их изображения, храмы или храмовые сокровища.
  rationale: Еврейские местоименные суффиксы допускают несколько связанных референтов; конкретизация в основном тексте неоправданно устранила бы неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Слово «храмы» употреблено вместо буквального «дома» ради ясности; образ закутывания и выражение «с миром» сохранены без рационализирующего пересказа.
