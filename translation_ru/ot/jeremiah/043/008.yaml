  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма wayyiqtol от היה вводит новое событие повествования; «И было» естественно сочетается в русском с устойчивой пророческой формулой и сохраняет структуру исходного текста.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: «Слово» сохраняет формальную и богословскую значимость стандартной пророческой формулы, не сужая её до более толковательного «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени соответствует непосредственно представленному в еврейском тексте имени.
- source_word: אֶל יִרְמְיָהוּ
  choice: к Иеремии
  rationale: Предлог אֶל обозначает адресата божественного слова; русский оборот «слово ... к Иеремии» сохраняет направление речи и библейскую формулу.
- source_word: בְּתַחְפַּנְחֵס
  choice: в Тафнисе
  rationale: Предлог בְּ обозначает место; используется принятая русская форма египетского топонима Тафнис.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит содержание последующей прямой речи; в современном русском эту функцию естественно и без потери смысла передаёт двоеточие.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит тетраграмматон как собственное имя; транслитерация сохраняет это различие и не заменяет имя титулом.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и узнаваемой пророческой формулы. Порядок слов слегка приближен к еврейскому, но остаётся естественным; לֵאמֹר передано пунктуационно, поскольку далее следует содержание речи.
