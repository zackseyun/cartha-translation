base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/003.yaml
  text: For Baruch son of Neriah is inciting you against us[a], in order to give us into the hand of the Chaldeans[c][b], to put us to death and to carry us away into exile to Babylon.
translation:
  language: ru
  text: Ведь Варух, сын Нирии, подстрекает тебя против нас[a], чтобы предать нас в руки халдеев[b], убить нас и увести нас в изгнание в Вавилон[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «настраивает тебя против нас»; «подбивает тебя выступить против нас».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дать нас в руку халдеев», то есть отдать нас под их власть.'
    reason: cultural_note
  - marker: c
    text: 'Или: «угнать нас в плен в Вавилон»; «депортировать нас в Вавилон».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит обоснование предыдущего обвинения и естественно связывает стих с контекстом.
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  choice: Варух, сын Нирии
  rationale: Традиционная русская передача имён с естественным оформлением патронима.
- source_word: מַסִּית
  choice: подстрекает
  rationale: 'Передаёт каузативный и враждебный оттенок: Варуха обвиняют в том, что он настраивает Иеремию против говорящих.'
- source_word: אֹתְךָ בָּנוּ
  choice: тебя против нас
  rationale: Сохраняет направленность предполагаемого воздействия против говорящих.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Ясно и естественно выражает цель.
- source_word: תֵּת אֹתָנוּ בְיַד הַכַּשְׂדִּים
  choice: предать нас в руки халдеев
  rationale: Русский библейский идиом сохраняет образ руки и передаёт смысл отдачи во власть врага.
- source_word: לְהָמִית אֹתָנוּ
  choice: на смерть
  rationale: В сочетании с «предать» кратко и точно выражает цель — умертвить говорящих.
- source_word: וּלְהַגְלוֹת אֹתָנוּ בָּבֶל
  choice: на изгнание в Вавилон
  rationale: Передаёт принудительное переселение и направление движения, не сужая значение до современного административного термина «депортация».
