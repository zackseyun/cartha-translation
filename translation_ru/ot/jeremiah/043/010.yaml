source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י שֹׁלֵ֨חַ֙ וְ֠/לָקַחְתִּי אֶת נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עַבְדִּ֔/י וְ/שַׂמְתִּ֣י כִסְא֔/וֹ מִ/מַּ֛עַל לָ/אֲבָנִ֥ים הָ/אֵ֖לֶּה אֲשֶׁ֣ר טָמָ֑נְתִּי וְ/נָטָ֥ה אֶת שפרור/ו עֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/010.yaml
  text: 'And say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am sending and will take Nebuchadnezzar king of Babylon, my servant, and I will set his throne above these stones that I have hidden, and he will spread his canopy over them.’'
translation:
  language: ru
  text: 'И скажи им: «Так говорит Яхве Воинств, Бог Израиля: вот, Я пошлю и возьму Навуходоносора, царя Вавилона, Моего слугу, и поставлю его престол над этими камнями, которые Я спрятал; он раскинет над ними свой царский шатёр[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свой навес», «свой павильон»; значение редкого еврейского слова точно не установлено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя Бога передано транслитерацией «Яхве», а צְבָאוֹת — традиционным и достаточно понятным «Воинств», без замены имени титулом.
- source_word: הִנְנִי שֹׁלֵחַ וְלָקַחְתִּי
  choice: вот, Я пошлю и возьму
  rationale: «Вот» сохраняет торжественную силу пророческого объявления; сочетание причастия и последующего глагола передано как близкое будущее, при этом необычная последовательность действий исходного текста не сглажена.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносора
  rationale: Использована закрепившаяся в современном русском библейском и историческом употреблении форма имени.
- source_word: עַבְדִּי
  choice: Моего слугу
  rationale: В данном контексте слово обозначает царя как орудие Божьей воли; «слуга» сохраняет это значение, не подразумевая его нравственного одобрения или верности завету.
- source_word: כִסְאוֹ
  choice: его престол
  rationale: Царский контекст требует значения «престол», а не общего «сиденье».
- source_word: מִמַּעַל לָאֲבָנִים הָאֵלֶּה
  choice: над этими камнями
  rationale: Передано пространственное расположение престола над спрятанными камнями без уточнения, отсутствующего в тексте.
- source_word: טָמָנְתִּי
  choice: Я спрятал
  rationale: Сохранено первое лицо масоретского текста внутри речи Бога, хотя непосредственно камни прячет Иеремия; возможная агентность не разъясняется в основном тексте.
- source_word: שפרורו
  choice: свой царский шатёр
  rationale: Редкое и не вполне ясное слово, вероятно, обозначает царское покрытие, шатёр или павильон. «Царский шатёр» естественно передаёт образ установления царской ставки, а неопределённость отмечена в сноске.
- source_word: וְנָטָה
  choice: он раскинет
  rationale: Глагол означает «простирать, раскидывать» и естественно сочетается по-русски с шатром.
theological_decisions:
- issue: Навуходоносор назван עַבְדִּי, «Моим слугой»
  choice: Сохранено прямое обозначение «Моего слугу».
  alternative: «Моего раба» или пояснительное «Моё орудие».
  rationale: '«Слуга» удерживает напряжение текста: языческий царь действует как подчинённое Богу орудие суда, однако это не означает духовной верности или нравственного одобрения. Пояснительная перифраза чрезмерно истолковала бы текст.'
- issue: 'Бог говорит о камнях: טָמָנְתִּי, «Я спрятал»'
  choice: 'Сохранено первое лицо: «которые Я спрятал».'
  alternative: «которые ты спрятал» или «которые были спрятаны».
  rationale: WLC имеет первое лицо; его исправление по ближайшему повествовательному контексту устранило бы реальную текстовую особенность и возможную идею действия пророка как действия по Божьему повелению.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Синтаксический параллелизм исходного текста в основном сохранён; редкое שפרורו передано читаемо, а его неопределённость вынесена в сноску. Маркер [a] поставлен непосредственно после слова, к которому относится примечание.
