  yaml_path: translation/ot/jeremiah/043/009.yaml
  text: Take large stones in your hand and hide them in the mortar[a], in the brick pavement that is at the entrance of Pharaoh’s house in Tahpanhes[c][b], before the eyes of the Jewish men.
translation:
  language: ru
  text: Возьми в руки большие камни и спрячь их[a] в строительном растворе кирпичной площадки[b], которая находится у входа в дом фараона в Тахпанхесе, на глазах у иудейских мужчин[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закопай их». Еврейский глагол может означать сокрытие предмета путём помещения его в землю или внутрь сооружения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кирпичной кладки», «кирпичной мостовой», «кирпичной террасы»; возможно также: «печи для обжига кирпича». Еврейское слово встречается редко, и его точное архитектурное значение неизвестно.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможный перевод: «еврейских мужчин» или «мужчин из Иудеи». Еврейское определение может обозначать как иудеев в этническом смысле, так и людей из Иудеи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח בְּיָדְךָ
  choice: возьми в руки
  rationale: Передаёт повеление и личное физическое действие; множественное «в руки» естественно по-русски при нескольких больших камнях, хотя в еврейском стоит единственное «рука».
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: большие камни
  rationale: Прямой и естественный современный эквивалент, сохраняющий указание на размер.
- source_word: וּטְמַנְתָּם
  choice: спрячь их
  rationale: Глагол טמן означает скрыть, поместив вне поля зрения, нередко в землю или внутрь сооружения; «спрячь» сохраняет более широкий смысл, чем «закопай».
- source_word: בַּמֶּלֶט
  choice: в строительном растворе
  rationale: В данном строительном контексте מֶלֶט вероятнее всего обозначает связующий раствор; уточнение «строительный» делает русское выражение однозначным и не вносит анахроничного «цемента».
- source_word: בַּמַּלְבֵּן
  choice: кирпичной площадки
  rationale: Редкое слово מַלְבֵּן имеет неясное архитектурное значение. У входа в царский дом вероятна вымощенная кирпичом площадка, однако неопределённость отмечена в сноске.
- source_word: אֲשֶׁר בְּפֶתַח בֵּית פַּרְעֹה
  choice: которая находится у входа в дом фараона
  rationale: Сохраняет буквальное «дом фараона», не заменяя его толковательным «дворец», и естественно передаёт местоположение у входа.
- source_word: בְּתַחְפַּנְחֵס
  choice: в Тахпанхесе
  rationale: Транслитерация топонима, близкая к еврейской форме תַחְפַּנְחֵס.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Естественный русский оборот, сохраняющий зримость и публичность действия.
- source_word: אֲנָשִׁים יְהוּדִים
  choice: у мужчин-иудеев
  rationale: Сохраняет явно выраженное существительное мужского рода אֲנָשִׁים и историческое обозначение יְהוּדִים, не устраняя его этническую и географическую неоднозначность.
