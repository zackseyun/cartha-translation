base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/005.yaml
  text: Then Johanan son of Kareah[a], and all the commanders of the forces, took all the remnant of Judah who had returned from all the nations where they had been driven away[b], to sojourn in the land of Judah—
translation:
  language: ru
  text: Тогда Иоханан, сын Кареаха, и все военачальники взяли весь остаток Иудеи — тех, кто вернулся из всех народов, куда они были изгнаны[a], чтобы жить[b] в земле Иудеи —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «куда они были рассеяны». Еврейский глагол может означать изгнание, вытеснение или рассеяние.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может обозначать проживание в качестве временного или зависимого жителя.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Тогда ... взяли
  rationale: Последовательный вав продвигает повествование; «тогда» естественно передаёт переход к следующему событию, а множественное число согласуется с составным подлежащим в русском языке.
- source_word: יוֹחָנָן בֶּן־קָרֵחַ
  choice: Иоханан, сын Кареаха
  rationale: Имена переданы принятой русской библейской транслитерацией; отчество-патроним сохранено буквально.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: все военачальники
  rationale: Сочетание обозначает руководителей военных сил. «Военачальники» кратко, ясно и естественно для современного литературного русского языка.
- source_word: כָּל שְׁאֵרִית יְהוּדָה
  choice: весь остаток Иудеи
  rationale: «Остаток» сохраняет как прямой смысл оставшейся части народа, так и важный для книги Иеремии тематический оттенок; «Иудея» здесь обозначает народ/царство Иуды в родительном обороте.
- source_word: אֲשֶׁר שָׁבוּ
  choice: тех, кто вернулся
  rationale: Уточняющая конструкция устраняет неестественное согласование с собирательным словом «остаток» и ясно показывает, что возвращение предшествовало основному действию.
- source_word: מִכָּל הַגּוֹיִם
  choice: из всех народов
  rationale: Прямо и естественно передаёт происхождение возвращавшихся из среды различных народов.
- source_word: אֲשֶׁר נִדְּחוּ שָׁם
  choice: куда они были изгнаны
  rationale: Nifal глагола נדח выражает вынужденное удаление или рассеяние. «Были изгнаны» сохраняет оттенок принуждения, не исключая значения рассеяния, отмеченного в сноске.
- source_word: לָגוּר
  choice: чтобы поселиться
  rationale: Инфинитив цели передан целевой конструкцией. «Поселиться» звучит естественно по-русски; возможный оттенок временного или зависимого проживания сохранён в сноске.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: в земле Иудеи
  rationale: Передаёт территориальное обозначение «земля Иуды» в привычной и понятной русской форме.
theological_decisions: []
