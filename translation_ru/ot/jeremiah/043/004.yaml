  text: וְ/לֹֽא שָׁמַע֩ יוֹחָנָ֨ן בֶּן קָרֵ֜חַ וְ/כָל שָׂרֵ֧י הַ/חֲיָלִ֛ים וְ/כָל הָ/עָ֖ם בְּ/ק֣וֹל יְהוָ֑ה לָ/שֶׁ֖בֶת בְּ/אֶ֥רֶץ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/004.yaml
  text: But Johanan son of Kareah[a], and all the commanders of the forces, and all the people, did not listen to the voice of Yahweh, to remain in the land of Judah.
translation:
  language: ru
  text: Но Иоханан, сын Кареаха, все военачальники и весь народ не послушались голоса Яхве, повелевавшего им остаться в земле Иуды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: Но ... не послушались
  rationale: Сочетание שׁמע с בְּקוֹל означает не просто физически услышать, а внять сказанному. Русское «не послушались голоса» сохраняет образ голоса и одновременно передаёт подразумеваемое неповиновение; «но» естественно выражает контраст с предшествующим повелением.
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: Иоханан, сын Кареаха
  rationale: Имена переданы принятой русской библейской транслитерацией; патроним выражен естественной конструкцией «сын Кареаха».
- source_word: שָׂרֵי הַחֲיָלִים
  choice: военачальники
  rationale: В данном военном контексте краткое русское слово точно обозначает руководителей вооружённых отрядов, не предполагая единой регулярной армии.
- source_word: כָל הָעָם
  choice: весь народ
  rationale: Прямое и естественное соответствие собирательному выражению с כָּל.
- source_word: בְּקוֹל יְהוָה
  choice: голоса Яхве
  rationale: Сохраняется конкретный древнееврейский образ «голоса», а личное имя יהוה передаётся транслитерацией «Яхве».
- source_word: לָשֶׁבֶת בְּאֶרֶץ יְהוּדָה
  choice: и не остались в земле Иуды
  rationale: 'Инфинитив поясняет содержание повеления, которому они не вняли: оставаться в Иудее. Координированная русская конструкция ясно передаёт результат отказа и звучит естественнее буквального «не послушались... оставаться».'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Значение שׁמע בְּקוֹל
  choice: не послушались голоса
  alternative: не повиновались
  rationale: Основной вариант сохраняет как смысл неповиновения, так и образ голоса, не сводя выражение только к абстрактному послушанию.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Перечень участников упрощён в соответствии с нормальным русским синтаксисом без утраты повторяющегося כָל; формулировка избегает тяжёлой кальки с древнееврейского инфинитива.
