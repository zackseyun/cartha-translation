  text: נִשְׁכְּבָ֣ה בְּ/בָשְׁתֵּ֗/נוּ וּֽ/תְכַסֵּ/נוּ֮ כְּלִמָּתֵ/נוּ֒ כִּי֩ לַ/יהוָ֨ה אֱלֹהֵ֜י/נוּ חָטָ֗אנוּ אֲנַ֨חְנוּ֙ וַ/אֲבוֹתֵ֔י/נוּ מִ/נְּעוּרֵ֖י/נוּ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א שָׁמַ֔עְנוּ בְּ/ק֖וֹל יְהֹוָ֥ה אֱלֹהֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/025.yaml
  text: Let us lie down in our shame[a], and let our disgrace cover us, for we have sinned against Yahweh our God—we and our fathers—from our youth even to this day, and we have not obeyed the voice of Yahweh our God.
translation:
  language: ru
  text: Ляжем в своём стыде, и пусть наш позор покроет нас, ибо мы согрешили против Яхве, нашего Бога, — мы и наши отцы[a] — с нашей юности и до нынешнего дня и не послушались голоса Яхве, нашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши предки». Буквально: «наши отцы».'
    reason: Лексема אָבוֹת буквально означает «отцы», но в данном исповедании может обозначать предшествующие поколения народа.
lexical_decisions:
- source_word: נִשְׁכְּבָה
  choice: Ляжем же
  rationale: Когортатив 1-го лица множественного числа передаёт побуждение и сохраняет образ лежащих, поверженных собственным стыдом.
- source_word: בְּבָשְׁתֵּנוּ
  choice: в своём стыде
  rationale: Предлог ב обозначает состояние или сферу; «в своём стыде» естественно передаёт этот образ по-русски.
- source_word: וּתְכַסֵּנוּ כְּלִמָּתֵנוּ
  choice: и пусть покроет нас наш позор
  rationale: Форма глагола в параллели с когортативом имеет побудительно-желательное звучание; «позор» отличает כְּלִמָּה от стоящего рядом בֹּשֶׁת «стыд».
- source_word: חָטָאנוּ לַיהוָה
  choice: мы согрешили против Яхве
  rationale: При глаголе חטא предлог ל указывает на того, против кого совершён грех.
- source_word: אֲנַחְנוּ וַאֲבוֹתֵינוּ
  choice: мы и наши отцы
  rationale: Перевод сохраняет прямое значение אָבוֹת; более широкое «предки» отмечено в сноске.
- source_word: מִנְּעוּרֵינוּ וְעַד הַיּוֹם הַזֶּה
  choice: с юности нашей и до этого дня
  rationale: Сохраняется временной диапазон от раннего периода жизни народа до настоящего момента.
- source_word: וְלֹא שָׁמַעְנוּ בְּקוֹל
  choice: и не слушались голоса
  rationale: Выражение שמע בקול означает не просто слышать, а слушаться и повиноваться; русский оборот сохраняет и образ голоса, и смысл непослушания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога — тетраграмматон יהוה; транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достойным покаянным тоном. Синтаксический параллелизм и образность еврейского текста сохранены без архаизмов; союз «же» естественно подчёркивает побудительную силу когортатива.
