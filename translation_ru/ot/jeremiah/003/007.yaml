base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/007.yaml
  text: And I said[a], ‘After she had done all these things, she will return to me,’ but she did not return[c][b]; and her treacherous sister Judah saw it.
translation:
  language: ru
  text: 'И Я сказал[a]: «После того как она сделала всё это, она вернётся ко Мне». Но она не вернулась[b], и это увидела её вероломная[c] сестра Иудея.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский имперфект может выражать ожидаемое будущее относительно момента в прошлом; возможна передача: «Я сказал, что после всего этого она вернётся ко Мне».'
    reason: lexical_alternative
  - marker: b
    text: «Вернуться» можно также передать как «обратиться»; в контексте завета слово включает смысл возвращения к Богу и покаяния.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «неверная». Еврейское слово может подчёркивать как неверность, так и предательство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: И Я сказал
  rationale: Форма wayyiqtol продолжает повествование и вводит слова Господа; простое «И Я сказал» сохраняет ход еврейского текста.
- source_word: אַחֲרֵי עֲשׂוֹתָהּ אֶת כָּל אֵלֶּה
  choice: После того как она сделала всё это
  rationale: Предлог с инфинитивом и суффиксом естественно передаётся по-русски придаточным времени.
- source_word: אֵלַי תָּשׁוּב
  choice: она вернётся ко Мне
  rationale: שׁוב означает возвращение и в данном контексте также допускает заветный смысл обращения к Господу; «вернётся» сохраняет оба оттенка, не сводя выражение только к покаянию.
- source_word: וְלֹא שָׁבָה
  choice: Но она не вернулась
  rationale: Повтор глагола «вернуться» воспроизводит лексический повтор исходного текста и подчёркивает несбывшееся ожидание.
- source_word: וַתֵּרֶא
  choice: и это увидела
  rationale: Объект в еврейском тексте подразумевается; местоимение «это» необходимо для естественной русской фразы и отсылает к только что описанному.
- source_word: בָּגוֹדָה
  choice: вероломная
  rationale: Слово от корня בגד обозначает предательство и неверность; «вероломная» передаёт резкую характеристику заветной измены.
- source_word: אֲחוֹתָהּ יְהוּדָה
  choice: её сестра Иудея
  rationale: Сохраняется пророческий образ родства между Израилем и Иудеей; название יְהוּדָה в данном контексте относится к стране и народу Иудеи.
theological_decisions:
- issue: Заветный смысл שׁוּב
  choice: вернуться
  alternative: обратиться; покаяться
  rationale: «Вернуться» сохраняет одновременно образ движения назад и заветного обращения к Богу, не устраняя смысловую напряжённость в пользу одного богословского толкования.
- issue: Характеристика Иудеи словом בָּגוֹדָה
  choice: вероломная сестра
  alternative: неверная сестра; изменница
  rationale: «Вероломная» сохраняет оттенок сознательного предательства, присущий корню בגד, и уместна в достойном литературном регистре.
- issue: Модальность תָּשׁוּב после глагола речи в прошлом
  choice: она вернётся
  alternative: она вернулась бы; она должна была вернуться
  rationale: Имперфект выражает ожидаемое будущее с точки зрения прошлого момента. Русское будущее внутри прямой речи естественно сохраняет перспективу говорящего.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Прописные местоимения «Я», «Мне» обозначают Господа. Порядок заключительной части слегка перестроен ради естественного русского синтаксиса без изменения смысла.
