lexical_decisions:
- source_word: הֲלוֹא
  choice: Разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: מֵעַתָּה
  choice: только что
  rationale: В сочетании с формой обращения передаёт недавний призыв Иудеи к Богу; возможное значение «отныне» сохранено в сноске.
- source_word: קראתי
  choice: взывала ты
  rationale: Следует контекстуальному чтению как форме 2-го лица женского рода, обращённой к олицетворённой Иудее. «Взывать» естественно передаёт обращение к Богу и не добавляет оценки его искренности.
- source_word: לִי
  choice: ко Мне
  rationale: Передаёт адресата взывания; прописная буква соответствует принятому русскому оформлению местоимений, относящихся к Богу.
- source_word: אָבִי
  choice: Отец мой
  rationale: Прямое обращение к Богу; порядок слов сохраняет торжественность, оставаясь понятным современному читателю.
- source_word: אַלּוּף
  choice: друг
  rationale: В данном контексте обозначает близкого спутника или друга; значение руководителя или наставника возможно и отмечено в сноске.
- source_word: נְעֻרַי
  choice: моей юности
  rationale: Естественно передаёт конструкцию принадлежности и связь, восходящую к юным годам говорящей.
- source_word: אָתָּה
  choice: Ты —
  rationale: Самостоятельное местоимение выражает именное сказуемое; тире естественно передаёт его по-русски.
theological_decisions:
- issue: Говорящий и адресат риторического вопроса
  choice: Господь обращается к олицетворённой Иудее как к женщине и цитирует её недавнее обращение к Нему.
  alternative: Цитируемые слова можно понимать как обещание обращаться к Богу отныне; в контексте они также могут обличать поверхностное раскаяние.
  rationale: Женский род глагольной формы по принятому контекстуальному чтению и контекст Иеремии 3 указывают на олицетворённую Иудею. Перевод не решает за читателя, было ли её обращение искренним.
translation_notes:
  register: Современный литературный русский язык с достойной библейской интонацией. Женский род «взывала» делает явным обращение к олицетворённой Иудее. Формулировка сохраняет риторический характер и не определяет степень искренности её слов.
