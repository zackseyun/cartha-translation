  text: הֲ/יִנְטֹ֣ר לְ/עוֹלָ֔ם אִם יִשְׁמֹ֖ר לָ/נֶ֑צַח הִנֵּ֥ה דברתי וַ/תַּעֲשִׂ֥י הָ/רָע֖וֹת וַ/תּוּכָֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/005.yaml
  text: Will he be angry forever? Will he keep it to the end? Look[a], you have spoken, and you have done evil things[c][b], and you have prevailed.
translation:
  language: ru
  text: Неужели Он вечно будет таить гнев? Неужели будет хранить его без конца?[a] Вот, ты говорила[b], и совершала злые дела, и преуспела в этом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Неужели Он будет хранить гнев вовеки? Неужели будет удерживать его навсегда?»'
    reason: lexical_alternative
  - marker: b
    text: Согласные еврейского слова можно также прочитать как «я говорил»; контекст благоприятствует чтению «ты говорила», обращённому к Иудее.
    reason: textual_variant
  - marker: c
    text: 'Или: «и смогла»; вероятный смысл — ты упорно и успешно продолжала делать зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִנְטֹר
  choice: Неужели Он вечно будет таить гнев
  rationale: Глагол נטר означает сохранять гнев или неприязнь, затаивать обиду. «Таить гнев» передаёт образ удерживаемого гнева и естественно звучит в риторическом вопросе.
- source_word: לְעוֹלָם
  choice: вечно
  rationale: Здесь עוֹלָם обозначает неограниченно долгую продолжительность; «вечно» сохраняет силу вопроса.
- source_word: אִם יִשְׁמֹר לָנֶצַח
  choice: Неужели будет хранить его без конца?
  rationale: אִם вводит второй параллельный вопрос, а שׁמר буквально означает «хранить, удерживать». Местоимение «его» относится к подразумеваемому гневу; «без конца» передаёт לָנֶצַח и сохраняет параллелизм без дословного повтора.
- source_word: הִנֵּה
  choice: Вот
  rationale: «Вот» — естественный современный указательный маркер, привлекающий внимание к несоответствию между словами Иудеи и её поступками.
- source_word: דברתי
  choice: ты говорила
  rationale: Контекст продолжает прямое обращение к Иудее, представленной как женщина. Согласные допускают чтение «я говорил», поэтому эта возможность отмечена в сноске.
- source_word: וַתַּעֲשִׂי הָרָעוֹת
  choice: и совершала злые дела
  rationale: Форма женского рода обращена к Иудее; субстантивированное множественное הָרָעוֹת указывает на конкретные злые поступки. Союз передан без добавления явно противительного значения.
- source_word: וַתּוּכָל
  choice: и добивалась своего
  rationale: יכל может означать «быть в силах, суметь, одолеть». В данном обвинительном контексте выражение передаёт успешное и упорное осуществление зла, не превращая это в похвалу.
theological_decisions:
- issue: Кто говорит в форме דברתי и к кому относится заключительное обвинение
  choice: 'Заключительная часть целиком обращена к Иудее: «ты говорила… совершала… добивалась».'
  alternative: Читать דברתי как «я говорил», то есть отнести первый глагол к Господу, а последующие — к Иудее.
  rationale: Ближайший контекст приводит слова Иудеи и затем обличает её поступки; женские формы וַתַּעֲשִׂי и וַתּוּכָל явно обращены к ней. При этом неоднозначность согласного текста דברתי сохранена в сноске.
- issue: Подразумеваемый объект глаголов נטר и שׁמר
  choice: 'Передать его как гнев: «таить гнев… хранить его».'
  alternative: «Хранить обиду» или оставить объект полностью невыраженным.
  rationale: Параллельные глаголы описывают продолжительное удерживание гнева или неприязни. Уточнение объекта по контексту делает русский текст ясным, не утверждая особого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Риторический параллелизм двух вопросов сохранён; женский род отражает обращение к Иудее. Повтор союза «и» удерживает последовательность обвинений еврейского текста.
