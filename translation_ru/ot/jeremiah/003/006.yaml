base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/006.yaml
  text: And the LORD said to me in the days of King Josiah, “Have you seen what faithless Israel has done? She went up on every high hill and under every green tree, and there she prostituted herself.”
translation:
  language: ru
  text: 'И сказал мне ГОСПОДЬ во дни царя Иосии: «Видел ли ты, что сделала Израиль-отступница? Она ходила на всякую высокую гору и под всякое зелёное дерево и там блудила».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Передаёт тетраграмматон традиционным русским библейским соответствием, выделенным прописными буквами.
- source_word: מְשֻׁבָה יִשְׂרָאֵל
  choice: отступница — Израиль
  rationale: Мְשֻׁבָה здесь характеризует олицетворённый Израиль как отвернувшийся от Бога; существительное «отступница» сохраняет женский род и связь с последующими формами женского рода.
- source_word: הֹלְכָה
  choice: ходила
  rationale: В контексте повторяющегося культового поведения естественное русское прошедшее несовершенного вида точнее, чем одноразовое «пошла».
- source_word: עַל כָּל הַר גָּבֹהַּ
  choice: на всякую высокую гору
  rationale: Сохраняет пространственный образ мест языческого культа без пояснительного расширения.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: под всякое зеленеющее дерево
  rationale: רַעֲנָן обозначает пышную, свежую растительность; «зеленеющее» звучит естественно и не сужает образ до породы дерева.
- source_word: וַתִּזְנִי
  choice: блудодействовала
  rationale: Сохраняет резкую метафору неверности и её двойную, культовую и супружескую, окраску; не уточняет её как буквальную проституцию.
theological_decisions:
- issue: Характер неверности Израиля
  choice: Сохранена брачно-сексуальная метафора словом «блудодействовала».
  alternative: «занималась проституцией» или «изменяла»
  rationale: Еврейский глагол זנה допускает буквальный и метафорический планы; в пророческом контексте речь прежде всего об идолопоклонстве как неверности Богу. Выбранная формулировка сохраняет оба смысловых слоя, не разрешая напряжение однозначно.
- issue: Именование Бога
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Традиционное русское соответствие тетраграмматону обеспечивает узнаваемость и достоинство, не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис близок к еврейскому, но остаётся естественным; олицетворение Израиля и резкость пророческой метафоры сохранены.
