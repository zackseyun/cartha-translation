id: JER.3.23
reference: Jeremiah 3:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אָכֵ֥ן לַ/שֶּׁ֛קֶר מִ/גְּבָע֖וֹת הָמ֣וֹן הָרִ֑ים אָכֵן֙ בַּ/יהֹוָ֣ה אֱלֹהֵ֔י/נוּ תְּשׁוּעַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/023.yaml
  text: Surely[a], from the hills comes only falsehood, the tumult on the mountains; surely in Yahweh our God is the salvation of Israel.
translation:
  language: ru
  text: Воистину, с холмов приходит лишь обман — шум на горах[a]; воистину, в Яхве, нашем Боге, — спасение Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гул на горах»; евр. выражение допускает также понимание «суматоха на горах» или «множество гор».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: воистину
  rationale: Эмфатическая частица вводит и затем подтверждает исповедальное противопоставление; повтор сохранён.
- source_word: לַשֶּׁקֶר
  choice: лишь обман
  rationale: שֶׁקֶר означает ложь или обман; при эллиптическом строе фразы выражает тщетность надежды на помощь с холмов.
- source_word: מִגְּבָעוֹת
  choice: с холмов
  rationale: Сохраняет исходный образ возвышенностей и не добавляет прямо не названных в стихе идолов или святилищ.
- source_word: הָמוֹן הָרִים
  choice: шум на горах
  rationale: הָמוֹן может обозначать шум, гул, суматоху или множество. «Шум на горах» естественно передаёт вероятный смысл, а неоднозначность отмечена в сноске.
- source_word: בַּיהוָה
  choice: в Яхве
  rationale: Предлог ב передаёт нахождение истинного спасения в Яхве и сохраняет контраст с ложной надеждой на холмы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֵינוּ
  choice: нашем Боге
  rationale: Сохранено исповедальное обозначение отношений Бога с народом.
- source_word: תְּשׁוּעַת יִשְׂרָאֵל
  choice: спасение Израиля
  rationale: Близко передаёт конструкцию принадлежности и оставляет открытым оттенок спасения, принадлежащего Израилю или предназначенного для него.
theological_decisions:
- issue: Противопоставление холмов и гор Яхве как истинному источнику спасения
  choice: Холмы дают лишь обман, тогда как спасение Израиля — в Яхве.
  alternative: Понять הָמוֹן הָרִים буквально как «множество гор», не связывая выражение с шумом богослужения на возвышенностях.
  rationale: Контекст Иеремии связывает холмы и горы с отступническим поклонением, однако перевод не добавляет отсутствующих в тексте слов «идолы» или «высоты».
translation_notes:
  register: Современный литературный русский язык с торжественным исповедальным тоном. Эллиптическая структура второй половины сохранена с помощью тире; повтор «воистину» отражает композицию еврейского текста.
