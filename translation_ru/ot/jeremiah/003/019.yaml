base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/019.yaml
  text: And I said[a], ‘How I would set you among the sons and give you a desirable land, the most beautiful inheritance of the nations' armies.’ And I said, ‘You will call me[b], “My Father,” and you will not turn away from following me.’
translation:
  language: ru
  text: 'И Я сказал: «Как бы Мне поместить тебя среди сыновей[a] и дать тебе желанную землю — прекраснейшее наследие среди народов[b]!» И Я сказал: «Ты будешь обращаться ко Мне: „Отец мой“ и не перестанешь следовать за Мной[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более широком смысле: «среди детей»; буквально по-еврейски: «среди сыновей».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение здесь сжато и трудно для однозначного разбора. Возможны также переводы: «прекрасное наследие сонмов народов» или «краса наследий народов»; слово צבאות может означать «сонмы, воинства».'
    reason: alternative_reading
  - marker: c
    text: 'В написанном еврейском тексте (кетив) здесь стоят формы множественного числа: «вы будете обращаться… и не перестанете следовать». Традиционное масоретское чтение (кере) имеет формы женского единственного числа, которому следует основной текст.'
    reason: textual_variant
lexical_decisions:
- source_word: אֵיךְ
  choice: Как бы Мне
  rationale: Передаёт размышление с восклицательно-вопросительным оттенком, не превращая фразу в утверждение о невозможности.
- source_word: אֲשִׁיתֵךְ בַּבָּנִים
  choice: поставить тебя среди сыновей
  rationale: Сохраняет значение שׁית «ставить, помещать» и мужской род множественного числа בנים; обращение при этом относится к Израилю/Иудее в женском роде.
- source_word: אֶרֶץ חֶמְדָּה
  choice: землю желанную
  rationale: חמדה обозначает желанное, драгоценное и доставляющее радость; такой порядок слов звучит торжественно и естественно в русском библейском регистре.
- source_word: נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם
  choice: прекраснейшее наследие среди народов
  rationale: Сжатая и трудная конструкция. Передача выражает превосходную красоту наследия и его положение среди народов, не вводя в основной текст маловероятный для контекста образ военных армий.
- source_word: אָבִי תקראו לִי
  choice: 'Ты будешь называть Меня: «Отец мой»'
  rationale: Кетив תקראו формально допускает множественное число, но масоретское чтение и контекст обращения к женскому единственному числу поддерживают форму «ты будешь называть»; לִי понимается как обозначение обращения к Богу.
- source_word: וּמֵאַחֲרַי לֹא תשובו
  choice: и не отступишь от следования за Мной
  rationale: Передаёт идиому «отойти от того, чтобы идти вслед за кем-либо», сохраняя образ следования и согласуя число с масоретским чтением.
theological_decisions:
- issue: Родственная образность в בַּבָּנִים
  choice: среди сыновей
  alternative: среди детей
  rationale: В основном тексте сохранено прямо выраженное мужское множественное число, а более широкое контекстуальное значение отмечено в сноске.
- issue: Толкование נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם
  choice: прекраснейшее наследие среди народов
  alternative: прекрасное наследие сонмов народов / краса наследий народов
  rationale: Еврейская конструкция синтаксически неоднозначна. Основной текст предлагает естественное контекстуальное прочтение, а сноска сохраняет конкурирующие возможности, включая буквальное значение צבאות.
- issue: Число глаголов תקראו и תשובו
  choice: 'единственное число: «ты будешь… не отступишь»'
  alternative: 'множественное число: «вы будете… не отступите»'
  rationale: Консонантный текст выглядит как множественное число, тогда как масоретское чтение предполагает формы женского единственного числа, согласующиеся с предшествующим обращением к персонифицированному Израилю/Иудее.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Неоднозначности трудной именной цепочки и различие между кетивом и масоретским чтением не разрешены догматически.
