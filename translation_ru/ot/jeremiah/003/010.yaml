  source_fidelity: 'Смысл передан в целом верно: וְגַם בְּכָל זֹאת — уступительно («Но и после всего этого»); שָׁבָה אֵלַי — «не вернулась ко Мне»; בְּכָל לִבָּהּ — «всем сердцем»; כִּי אִם בְּשֶׁקֶר — «лишь лживо / во лжи». Однако синтаксис черновика делает возможным ошибочное прочтение, будто Иудея всё-таки вернулась, но неполно: «вернулась ко Мне не всем сердцем». В еврейском отрицание לֹא относится к самому возвращению: она «не вернулась ко Мне всем сердцем», а «лишь лживо».'
