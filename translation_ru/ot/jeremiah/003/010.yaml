  text: וְ/גַם בְּ/כָל זֹ֗את לֹא שָׁ֨בָה אֵלַ֜/י בָּגוֹדָ֧ה אֲחוֹתָ֛/הּ יְהוּדָ֖ה בְּ/כָל לִבָּ֑/הּ כִּ֥י אִם בְּ/שֶׁ֖קֶר נְאֻם יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/010.yaml
  text: Yet in spite of all this[a], faithless Judah, her sister did not return to me with all her heart, but only in falsehood[b], declares Yahweh.
translation:
  language: ru
  text: Но и после всего этого её неверная[a] сестра Иудея не вернулась ко Мне всем сердцем, а лишь лживо[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вероломная». Еврейское слово может подчёркивать предательство или нарушение верности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «во лжи»; то есть её возвращение было неискренним, а не совершённым всем сердцем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם בְּכָל זֹאת
  choice: Но даже после всего этого
  rationale: Сочетание вводит дополнительный контрастный вывод и отсылает к предшествующим предостережениям и суду; русская уступительная конструкция естественно передаёт смысл.
- source_word: שָׁבָה אֵלַי
  choice: вернулась ко Мне
  rationale: Глагол שׁוב здесь обозначает возвращение к Богу и сохраняет одновременно пространственный, личностный и заветный оттенки, не разворачивая их в толкование.
- source_word: בָּגוֹדָה
  choice: неверная
  rationale: Слово указывает на нарушение верности и предательство отношений завета. «Неверная» естественно сочетается с образом сестры и оставляет метафору супружеской и заветной неверности контексту.
- source_word: אֲחוֹתָהּ יְהוּדָה
  choice: её неверная сестра Иудея
  rationale: Сохранены женская персонификация Иудеи и родственная метафора, связывающая её с Израилем из предыдущего контекста; порядок слов естественен для современного русского языка.
- source_word: בְּכָל לִבָּהּ
  choice: всем сердцем
  rationale: Точно и идиоматично передаёт цельность и искренность обращения.
- source_word: כִּי אִם בְּשֶׁקֶר
  choice: а лишь притворно
  rationale: Ограничительно-противительная конструкция противопоставляет внешнее, неискреннее возвращение возвращению всем сердцем. Наречная передача естественна по-русски, а буквальная образность отмечена в сноске.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественный характер устойчивой пророческой формулы, а личное имя יהוה передано транслитерацией «Яхве».
theological_decisions:
- issue: Заветный смысл возвращения Иудеи
  choice: «вернулась ко Мне» без поясняющего добавления о покаянии
  alternative: «обратилась ко Мне»
  rationale: В контексте שׁוב подразумевает обращение и восстановление верности, однако буквальное «вернулась» сохраняет личностно-заветную многозначность и не превращает перевод в толкование.
- issue: Пророческая персонификация Иудеи как сестры
  choice: Женский род и образ сестры сохранены
  alternative: Передать Иудею только как народ или царство без родственной метафоры
  rationale: Сестринский образ существен для сопоставления Иудеи с северным Израилем и для обвинения обеих в неверности.
- issue: Характер мнимого возвращения
  choice: «лишь притворно»
  alternative: «во лжи»
  rationale: Контраст со словами «всем сердцем» показывает неискренность возвращения. Перевод выражает это прямо, а сноска сохраняет буквальную лексическую форму и её возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Заглавная буква в «Мне» отражает устойчивую русскую практику при обращении к Богу. Имя יהוה передано как «Яхве».
