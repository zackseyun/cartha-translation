  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא יִקְרְא֤וּ לִ/ירוּשָׁלִַ֨ם֙ כִּסֵּ֣א יְהוָ֔ה וְ/נִקְוּ֨וּ אֵלֶ֧י/הָ כָֽל הַ/גּוֹיִ֛ם לְ/שֵׁ֥ם יְהוָ֖ה לִ/ירוּשָׁלִָ֑ם וְ/לֹא יֵלְכ֣וּ ע֔וֹד אַחֲרֵ֕י שְׁרִר֖וּת לִבָּ֥/ם הָ/רָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/017.yaml
  text: At that time they will call Jerusalem ‘the throne of Yahweh,’ and all the nations will gather to it[a], to Jerusalem, for the name of Yahweh[b]. They will no longer walk after the stubbornness of their evil heart.
translation:
  language: ru
  text: В то время Иерусалим назовут престолом Яхве[b], и все народы соберутся к нему[a], в Иерусалим, ради имени Яхве. Они больше не будут следовать упорству своего злого сердца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут собраны к нему»; возможно также: «устремятся к нему». Употреблённый здесь еврейский глагол труден для толкования; в данном контексте речь идёт о том, что народы сходятся к Иерусалиму.'
    reason: lexical_alternative
  - marker: b
    text: Образ престола указывает на Иерусалим как на место царственного правления Яхве.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Естественно передаёт обычную пророческую формулу времени и сохраняет указание на будущий период.
- source_word: יִקְרְאוּ לִירוּשָׁלַם כִּסֵּא יְהוָה
  choice: Иерусалим назовут престолом Яхве
  rationale: Неопределённо-личная русская конструкция точно передаёт активную форму множественного числа без названного деятеля; כִּסֵּא передано буквально как «престол».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: וְנִקְוּוּ אֵלֶיהָ
  choice: и все народы соберутся к нему
  rationale: Редкая форма קוה в данном контексте обозначает совместное движение или собирание к Иерусалиму. Местоимение согласовано в русском с мужским родом названия «Иерусалим»; лексическая неоднозначность отмечена в сноске.
- source_word: כָל הַגּוֹיִם
  choice: все народы
  rationale: Здесь גּוֹיִם означает народы вообще; вариант «язычники» был бы более узким и интерпретирующим.
- source_word: לְשֵׁם יְהוָה
  choice: ради имени Яхве
  rationale: «Ради» естественно выражает направленность собрания к имени Яхве или почтение к нему, не уточняя сверх текста цель паломничества.
- source_word: לִירוּשָׁלָם
  choice: в Иерусалим
  rationale: Повтор топонима сохранён, как в еврейском тексте; предлог передаёт движение к городу.
- source_word: וְלֹא יֵלְכוּ עוֹד אַחֲרֵי
  choice: Они больше не будут следовать
  rationale: Русское «следовать» естественно передаёт идиому «ходить вслед за», сохраняя смысл избранного образа действий.
- source_word: שְׁרִרוּת לִבָּם הָרָע
  choice: упорству своего злого сердца
  rationale: שְׁרִרוּת означает упрямство или своеволие. Единственное число «сердца» сохраняет еврейский собирательный оборот с местоименным суффиксом множественного числа.
theological_decisions:
- issue: Иерусалим как «престол Яхве»
  choice: Образ сохранён прямо, без пояснения его как только символического или обязательно буквального престола.
  alternative: Истолковать выражение как символ Божьего правления либо как конкретную будущую интронизацию.
  rationale: Текст отождествляет Иерусалим с престолом Яхве в картине восстановления, но не определяет точный эсхатологический механизм.
- issue: Собрание народов к Иерусалиму
  choice: Передано как собирание народов к городу ради имени Яхве.
  alternative: Уточнить это как богослужебное паломничество, обращение народов или политическое подчинение.
  rationale: Еврейский текст выражает направленное к Иерусалиму собрание, но не требует одной из более узких богословских трактовок.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Синтаксис сделан естественным для русского; повтор «Иерусалим» и образ «злого сердца» сохранены ради близости к еврейскому тексту.
