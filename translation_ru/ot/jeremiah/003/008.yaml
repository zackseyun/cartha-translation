  text: וָ/אֵ֗רֶא כִּ֤י עַל כָּל אֹדוֹת֙ אֲשֶׁ֤ר נִֽאֲפָה֙ מְשֻׁבָ֣ה יִשְׂרָאֵ֔ל שִׁלַּחְתִּ֕י/הָ וָ/אֶתֵּ֛ן אֶת סֵ֥פֶר כְּרִיתֻתֶ֖י/הָ אֵלֶ֑י/הָ וְ/לֹ֨א יָֽרְאָ֜ה בֹּֽגֵדָ֤ה יְהוּדָה֙ אֲחוֹתָ֔/הּ וַ/תֵּ֖לֶךְ וַ/תִּ֥זֶן גַּם הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/008.yaml
  text: And I saw that because backsliding Israel had committed adultery in all these matters[a], I had sent her away and given her a certificate of divorce. Yet her treacherous sister Judah did not fear[c][b], but she too went and prostituted herself.
translation:
  language: ru
  text: И Я увидел, что за всё то, в чём отступница Израиль прелюбодействовала, Я отослал её и дал ей разводное письмо[a]. Но её вероломная сестра Иудея не испугалась, а она тоже пошла и предалась блуду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разводный документ». Буквально: «документ о разводе»; речь идёт об официальном документе, оформляющем расторжение брака.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пошла и тоже предалась проституции». Этот образ обозначает неверность завету как супружескую и половую измену.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: И Я увидел
  rationale: Сохраняет первое лицо и последовательность пророческого повествования; заглавная буква указывает на говорящего Бога в данном контексте.
- source_word: עַל כָּל אֹדוֹת אֲשֶׁר
  choice: за всё то, в чём
  rationale: Передаёт причинное значение сочетания עַל ... אֹדוֹת и совокупный смысл כָּל, избегая неестественной русской конструкции.
- source_word: נִאֲפָה
  choice: прелюбодействовала
  rationale: Сохраняет явную брачную метафору нарушения завета.
- source_word: מְשֻׁבָה יִשְׂרָאֵל
  choice: отступница Израиль
  rationale: Мְשֻׁבָה обозначает отступление, поворот прочь; существительное «отступница» естественно согласуется с олицетворением Израиля как женщины и сохраняет связь с темой возвращения.
- source_word: שִׁלַּחְתִּיהָ
  choice: Я отослал её
  rationale: В брачно-правовом контексте передаёт действие мужа, расторгающего брак, и сочетается с упоминанием разводного документа.
- source_word: סֵפֶר כְּרִיתֻתֶיהָ
  choice: разводное письмо
  rationale: Ясное современное обозначение официального документа о разводе; юридический смысл пояснён в сноске.
- source_word: וְלֹא יָרְאָה
  choice: не испугалась
  rationale: Сохраняет прямое значение ירא — «бояться», не подменяя его толкованием «не вняла предостережению».
- source_word: בֹּגֵדָה יְהוּדָה
  choice: вероломная ... Иудея
  rationale: «Вероломная» передаёт предательство и коварную неверность בגד, сохраняя отличие от מְשֻׁבָה.
- source_word: אֲחוֹתָהּ
  choice: её ... сестра
  rationale: Сохраняет олицетворение Израиля и Иудеи как сестёр.
- source_word: וַתֵּלֶךְ וַתִּזֶן
  choice: пошла и тоже стала блудить
  rationale: Передаёт последовательность глаголов и сильную сексуальную метафору זנה естественным, но достойным современным русским языком.
theological_decisions:
- issue: Сохранение брачной и сексуальной метафоры неверности завету
  choice: «прелюбодействовала», «отослал», «разводное письмо», «стала блудить»
  alternative: Обобщить как «изменила», «отверг», «была неверна» или прямо заменить метафору указанием на идолопоклонство
  rationale: Еврейский текст намеренно соединяет супружескую измену, развод и блуд; смягчение скрыло бы силу пророческого образа и его правовую сторону.
- issue: Различение מְשֻׁבָה и בֹּגֵדָה
  choice: «отступница» для Израиля и «вероломная» для Иудеи
  alternative: Передать оба слова одинаково как «неверная»
  rationale: Разные русские слова сохраняют риторически значимое различие между отступлением Израиля и предательским поведением Иудеи.
- issue: Значение וְלֹא יָרְאָה
  choice: «не испугалась»
  alternative: «не вняла предостережению»
  rationale: Буквальное значение сохраняет нравственно-богословскую напряжённость текста и не сводит страх лишь к извлечению урока из судьбы Израиля.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены женское олицетворение Израиля и Иудеи, брачно-правовая образность и различие ключевых обвинительных терминов. Формулировка «за всё то, в чём» отражает сжатый причинно-относительный синтаксис еврейского текста, не делая русский стих чрезмерно тяжеловесным.
