  text: וְ/נָתַתִּ֥י לָ/כֶ֛ם רֹעִ֖ים כְּ/לִבִּ֑/י וְ/רָע֥וּ אֶתְ/כֶ֖ם דֵּעָ֥ה וְ/הַשְׂכֵּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/015.yaml
  text: And I will give you shepherds after my own heart[c][b][a], and they will shepherd you with knowledge and understanding.
translation:
  language: ru
  text: И дам вам пастухов[a] по сердцу Моему[b], и они будут пасти вас со знанием и разумением[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пастырей». Буквально: «пастухов». Здесь это образ тех, кто заботится о Божьем народе и ведёт его; слово не обязательно обозначает особую церковную должность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «согласно Моему сердцу», то есть в согласии с Божьей волей и желанием.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «со знанием и проницательностью»; последнее слово также можно передать как «благоразумие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И дам
  rationale: Форма с союзом в пророческом контексте выражает будущее обещание; краткое «И дам» естественно передаёт связь с предыдущей речью и обещание Бога.
- source_word: לָכֶם
  choice: вам
  rationale: Предлог ל обозначает косвенный объект; русское «дам вам» точно и идиоматично.
- source_word: רֹעִים
  choice: пастырей
  rationale: Слово буквально обозначает пастухов, но здесь метафорически относится к руководителям Божьего народа. «Пастыри» сохраняет образ и звучит достойно, не ограничивая смысл конкретной церковной должностью.
- source_word: כְּלִבִּי
  choice: по сердцу Моему
  rationale: Буквально «согласно Моему сердцу»; русское выражение сохраняет образ и передаёт соответствие Божьей воле и желанию, не сводя смысл лишь к эмоциональной симпатии.
- source_word: וְרָעוּ
  choice: и они будут пасти
  rationale: Глагол רעה охватывает заботу, водительство и кормление стада. Повтор корня в «пастырей… будут пасти» сохраняет цельную метафору оригинала.
- source_word: אֶתְכֶם
  choice: вас
  rationale: Показатель прямого дополнения с местоименным суффиксом второго лица множественного числа прямо передаётся как «вас».
- source_word: דֵּעָה
  choice: со знанием
  rationale: Существительное означает знание; предложная конструкция естественно выражает то, чем будет характеризоваться пастырское служение.
- source_word: וְהַשְׂכֵּיל
  choice: и пониманием
  rationale: Форма связана с разумением, проницательностью и благоразумием. «Понимание» ясно для современного читателя и сохраняет отличие от предшествующего «знания».
theological_decisions:
- issue: Кого обозначают обещанные пастыри
  choice: Богом данные руководители народа, представленные через образ пастырей
  alternative: Пасторы как носители строго определённой поздней церковной должности либо исключительно цари и правители
  rationale: Контекст Иеремии допускает широкий смысл руководства Божьим народом. Сохранение пастырского образа не вводит поздней конфессиональной структуры и не сужает круг руководителей без основания.
- issue: Смысл выражения «по сердцу Моему»
  choice: Пастыри, соответствующие Божьей воле, намерению и нравственному желанию
  alternative: Люди, к которым Бог лишь испытывает особую эмоциональную привязанность
  rationale: Еврейская идиома указывает прежде всего на согласие с Божьим сердцем как центром воли и намерения, при этом перевод сохраняет образ и его содержательную широту.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Пастыри» и «по сердцу Моему» сохраняют ключевые еврейские образы; синтаксис остаётся ясным и естественным. Заглавная буква в «Моему» указывает на Бога в рамках принятого русского библейского оформления.
