source:
  edition: WLC
  text: לֵ/אמֹ֡ר הֵ֣ן יְשַׁלַּ֣ח אִ֣ישׁ אֶת אִשְׁתּ/וֹ֩ וְ/הָלְכָ֨ה מֵ/אִתּ֜/וֹ וְ/הָיְתָ֣ה לְ/אִישׁ אַחֵ֗ר הֲ/יָשׁ֤וּב אֵלֶ֨י/הָ֙ ע֔וֹד הֲ/ל֛וֹא חָנ֥וֹף תֶּחֱנַ֖ף הָ/אָ֣רֶץ הַ/הִ֑יא וְ/אַ֗תְּ זָנִית֙ רֵעִ֣ים רַבִּ֔ים וְ/שׁ֥וֹב אֵלַ֖/י נְאֻם יְהֹוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/001.yaml
  text: It is said[a], ‘If a man sends away his wife, and she goes from him and becomes another man’s, will he return to her again? Would not that land be utterly polluted? But you have prostituted yourself with many lovers[b], and would you return to me?’ declares Yahweh.
translation:
  language: ru
  text: 'Говорят: «Если мужчина разведётся с женой, а она уйдёт от него и станет женой другого, разве он снова вернётся к ней? Не будет ли та земля совершенно осквернена? Ты же предавалась блуду со многими любовниками — и после этого вернёшься ко Мне?»[a] — возвещает Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «и всё же вернись ко Мне», если понимать последние слова как призыв, а не как риторический вопрос.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֵאמֹר
  choice: Говорят
  rationale: Инфинитив от אמר употреблён как вводная формула. Безличное «Говорят» естественно вводит общеизвестное правовое положение, сохраняя некоторую необычность еврейского начала.
- source_word: הֵן
  choice: Если
  rationale: В данном правовом предположении частица вводит условную ситуацию; русское «если» передаёт её естественно и ясно.
- source_word: יְשַׁלַּח ... אֶת אִשְׁתּוֹ
  choice: мужчина разведётся с женой
  rationale: В брачном контексте שלח означает отослать жену, то есть расторгнуть брак. «Разведётся с женой» ясно передаёт юридический смысл без двусмысленности русского «отпустит».
- source_word: וְהָלְכָה מֵאִתּוֹ
  choice: а она уйдёт от него
  rationale: Сохраняется выраженный в еврейском тексте образ ухода от первого мужа.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: и станет женой другого
  rationale: Еврейское выражение буквально эллиптично — «станет [принадлежащей] другому мужчине»; в контексте речь идёт о новом браке, который по-русски следует назвать прямо.
- source_word: הֲיָשׁוּב אֵלֶיהָ עוֹד
  choice: разве он снова вернётся к ней?
  rationale: Риторический вопрос и повторность действия переданы словами «разве» и «снова».
- source_word: הֲלוֹא חָנוֹף תֶּחֱנַף הָאָרֶץ הַהִיא
  choice: Не будет ли та земля совершенно осквернена?
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает значение חנף. «Совершенно осквернена» передаёт и культово-нравственный оттенок, и усиление.
- source_word: וְאַתְּ זָנִית
  choice: Ты же предавалась блуду
  rationale: Глагол זנה обозначает половую распущенность и служит пророческим образом неверности Яхве. Выражение достаточно сильное и при этом сохраняет достойный литературный регистр.
- source_word: רֵעִים רַבִּים
  choice: со многими любовниками
  rationale: Хотя רֵעִים может означать друзей или спутников, сексуальная метафора в ближайшем контексте требует значения «любовники».
- source_word: וְשׁוֹב אֵלַי
  choice: и после этого вернёшься ко Мне?
  rationale: Фраза понята как продолжение цепи возмущённых риторических вопросов. «После этого» естественно выражает контекстуальный оттенок, не снимая альтернативного понимания как призыва, отмеченного в сноске.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современным литературным оборотом, отличающим её от обычного глагола речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
theological_decisions:
- issue: Является ли וְשׁוֹב אֵלַי повелительным призывом вернуться или риторическим вопросом?
  choice: 'Риторический вопрос: «и после этого вернёшься ко Мне?»'
  alternative: 'Повелительное приглашение: «и всё же вернись ко Мне»'
  rationale: Ближайший контекст представляет собой последовательность риторических вопросов, основанных на правовой аналогии развода, поэтому вопросительное прочтение хорошо сохраняет резкость обвинения. Однако форма допускает неожиданное приглашение к возвращению; эта богословски значимая возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Правовая аналогия выражена ясно, а сексуальная метафора сохранена без эвфемистического ослабления и без нарочито архаичной грубости.
