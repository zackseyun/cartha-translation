  yaml_path: translation/ot/jeremiah/003/009.yaml
  text: And because of the lightness of her prostitution[b][a], she polluted the land and committed adultery with stone and wood.
translation:
  language: ru
  text: И из-за того, что она легкомысленно предавалась блуду[a], она осквернила землю и прелюбодействовала с камнем и деревом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно для однозначного понимания. Буквально оно может означать: «из-за голоса, шума или молвы о её блуде». Возможен смысл, что её блуд стал широко известен; другое распространённое понимание — что она относилась к своему блуду легкомысленно, как к пустяку.'
    reason: lexical_alternative
  - marker: b
    text: «Камень и дерево» — метонимическое обозначение идолов, изготовленных из этих материалов.
    reason: cultural_note
lexical_decisions:
- source_word: מִקֹּל זְנוּתָהּ
  choice: своим вопиющим блудом
  rationale: Буквально выражение связано с «голосом/звуком» блуда, однако еврейский оборот труден. «Вопиющий блуд» естественно по-русски передаёт его явный, громкий, скандальный характер, сохраняя образ «голоса» и причинно-инструментальную связь с осквернением земли; неоднозначность отмечена в сноске.
- source_word: וַתֶּחֱנַף
  choice: она осквернила
  rationale: При дополнении «землю» глагол חנף обозначает её ритуально-нравственное осквернение; «осквернила» точно и уместно в пророческом контексте.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте речь, вероятнее всего, идёт о земле Иуды, а не обо всей земле как мире; русский определённый контекст не требует отдельного артиклевого уточнения.
- source_word: וַתִּנְאַף
  choice: прелюбодействовала
  rationale: Сохраняет прямую брачно-сексуальную метафору covenantной неверности и не ослабляет её до общего «изменила».
- source_word: אֶת־הָאֶבֶן וְאֶת־הָעֵץ
  choice: с камнем и деревом
  rationale: 'Сохраняет резкую метонимию оригинала: материалы названы вместо изготовленных из них идолов. Пояснение вынесено в сноску.'
theological_decisions:
- issue: Пророческая сексуальная метафора идолопоклонства
  choice: Сохранить в основном тексте слова «блуд» и «прелюбодействовала».
  alternative: Передать обобщённо как неверность или отступничество.
  rationale: Иеремия намеренно описывает нарушение завета брачно-сексуальным языком; смягчение устранило бы существенное богословское напряжение образа.
- issue: Неявное указание на идолов в словах «камень и дерево»
  choice: Не добавлять слово «идолы» в основной текст.
  alternative: «Прелюбодействовала с идолами из камня и дерева».
  rationale: Еврейский текст называет сами материалы и предоставляет читателю распознать метонимию; сноска обеспечивает понятность без раскрытия образа внутри перевода.
translation_notes:
  register: Современный литературный русский с кратким, торжественно-пророческим строем. «Вопиющий блуд» сохраняет суровую образность и отзвук буквального «голоса/шума», но трудность еврейского оборота не скрывается и подробно обозначена в сноске. Формы «осквернила» и «прелюбодействовала» намеренно сохраняют высокий библейский регистр без архаической грамматики.
