  text: הָלֹ֡ךְ וְ/קָֽרָאתָ֩ אֶת הַ/דְּבָרִ֨ים הָ/אֵ֜לֶּה צָפ֗וֹנָ/ה וְ֠/אָמַרְתָּ שׁ֣וּבָ/ה מְשֻׁבָ֤ה יִשְׂרָאֵל֙ נְאֻם יְהוָ֔ה לֽוֹא אַפִּ֥יל פָּנַ֖/י בָּ/כֶ֑ם כִּֽי חָסִ֤יד אֲנִי֙ נְאֻם יְהוָ֔ה לֹ֥א אֶטּ֖וֹר לְ/עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/012.yaml
  text: 'Go and proclaim these words toward the north[a], and say: Return, faithless Israel, declares Yahweh. I will not look on you in anger, for I am faithful, declares Yahweh; I will not stay angry forever.'
translation:
  language: ru
  text: 'Иди и провозгласи эти слова к северу и скажи: «Вернись, неверный Израиль, — возвещает Яхве. — Я не буду смотреть на вас в гневе, ибо Я милосерден[a], — возвещает Яхве, — не буду гневаться вечно».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верен», «предан». Еврейское слово может выражать милосердие, верность завету или преданную доброту.'
    reason: Лексическая многозначность חָסִיד.
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  choice: Иди и провозгласи
  rationale: Инфинитив абсолютный הָלֹךְ усиливает повелительный характер поручения, а קרא в пророческом контексте означает публично возвестить.
- source_word: צָפוֹנָה
  choice: в сторону севера
  rationale: Передаёт направительное значение формы с локативным ה; вероятно, речь обращена к изгнанному северному Израилю, но это не внесено прямо в текст.
- source_word: שׁוּבָה מְשֻׁבָה יִשְׂרָאֵל
  choice: Вернись, неверный Израиль
  rationale: שוב сохраняет смысл возвращения и обращения, а מְשֻׁבָה обозначает отступничество и неверность в отношениях завета.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современно и с сохранением личного имени יהוה.
- source_word: לֹא אַפִּיל פָּנַי בָּכֶם
  choice: Я не буду смотреть на вас в гневе
  rationale: Буквальный образ падения лица на кого-либо является еврейской идиомой враждебного, гневного выражения; смысл передан ясно без затемнения образной калькой.
- source_word: חָסִיד אֲנִי
  choice: Я верен
  rationale: חָסִיד применительно к Яхве выражает верность и преданную милость в рамках завета; возможный оттенок милосердия сохранён в сноске.
- source_word: לֹא אֶטּוֹר לְעוֹלָם
  choice: Я не буду гневаться вечно
  rationale: נטר здесь означает сохранять гнев или неприязнь. Русская формулировка естественно передаёт длительность состояния, не добавляя объекта вроде «обиды».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохранено личное имя Бога, непосредственно стоящее в древнееврейском тексте.
- issue: Значение חָסִיד применительно к Яхве
  choice: верен
  alternative: милосерден; предан; исполнен милости
  rationale: Основной текст подчёркивает верность завету, а реальная лексическая возможность значения милосердия отмечена в сноске, чтобы не устранять смысловое напряжение.
- issue: Переход от единственного числа к множественному в обращении
  choice: «Вернись» в единственном числе и «на вас» во множественном
  alternative: Сгладить всё до одного числа
  rationale: 'Сохранено формальное колебание древнееврейского текста: Израиль персонифицирован и призывается в единственном числе, затем речь охватывает народ во множественном.'
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Синтаксис сделан ясным для обычного читателя; сохранены повтор формулы «возвещает Яхве», направленность к северу и смена грамматического числа.
