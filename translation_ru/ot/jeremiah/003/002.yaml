  text: שְׂאִֽי עֵינַ֨יִ/ךְ עַל שְׁפָיִ֜ם וּ/רְאִ֗י אֵיפֹה֙ לֹ֣א שגלת עַל דְּרָכִים֙ יָשַׁ֣בְתְּ לָ/הֶ֔ם כַּ/עֲרָבִ֖י בַּ/מִּדְבָּ֑ר וַ/תַּחֲנִ֣יפִי אֶ֔רֶץ בִּ/זְנוּתַ֖יִ/ךְ וּ/בְ/רָעָתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/002.yaml
  text: 'Lift up your eyes to the bare heights and see: where have you not been lain with? By the roads you sat waiting for them[a], like an Arab in the wilderness[b], and you have polluted the land with your prostitution and with your wickedness.'
translation:
  language: ru
  text: 'Подними глаза на голые высоты и посмотри: где с тобой не ложились? При дорогах ты сидела, поджидая их, словно араб в пустыне[a], и осквернила землю своим блудом и своим злом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сравнение, вероятно, рисует человека, который подстерегает путников на пустынных дорогах; речь идёт о намеренном ожидании, а не об этнической характеристике.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂאִי עֵינַיִךְ
  choice: Подними глаза
  rationale: Естественно передаёт еврейское повеление в женском роде и сохраняет образ поднятого взгляда.
- source_word: עַל שְׁפָיִם
  choice: на голые высоты
  rationale: Сохраняет топографический смысл безлесных, открытых возвышенностей и возможную ассоциацию с местами неверности, не превращая её в явное толкование.
- source_word: שגלת
  choice: с тобой не ложились
  rationale: Передаёт грубый сексуальный смысл глагола и его страдательную форму, но не вносит отсутствующую в оригинале идею насилия.
- source_word: עַל דְּרָכִים יָשַׁבְתְּ לָהֶם
  choice: У дорог ты сидела, поджидая их
  rationale: Русское «поджидая» естественно раскрывает значение дательного местоимения и образ намеренного ожидания у путей.
- source_word: כַּעֲרָבִי בַּמִּדְבָּר
  choice: словно аравитянин в пустыне
  rationale: «Аравитянин» точно и нейтрально передаёт этноним в библейском контексте; смысл сравнения пояснён в сноске.
- source_word: וַתַּחֲנִיפִי אֶרֶץ
  choice: и осквернила землю
  rationale: Передаёт нравственное и культовое загрязнение земли в естественной русской библейской лексике.
- source_word: בִּזְנוּתַיִךְ
  choice: своим блудом
  rationale: Сохраняет резкий сексуальный образ заветной неверности и звучит естественно и весомо по-русски.
- source_word: וּבְרָעָתֵךְ
  choice: и своим злом
  rationale: Буквально и широко передаёт רעה, не сужая его до определённого вида нечестия.
theological_decisions:
- issue: Пророческая сексуальная метафора заветной неверности
  choice: Сохранить сексуальный образ непосредственно в основном тексте.
  alternative: Заменить образ прямым указанием на идолопоклонство.
  rationale: Еврейский текст намеренно говорит резко и образно; явная замена на «идолопоклонство» устранила бы риторическое напряжение и внесла толкование в перевод.
- issue: Характер сексуального действия в שגלת
  choice: Не обозначать действие как насильственное.
  alternative: «Где тебя не насиловали?»
  rationale: Глагол груб и унизителен, но сам по себе не требует идеи принуждения; контекст последующего намеренного ожидания также не оправдывает её добавление.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой пророческой образности. Женский род последовательно отражает обращение к Иудее. «Аравитянин» избран вместо современного «араб», чтобы обозначить древний библейский контекст и избежать неуместного современного обобщения.
