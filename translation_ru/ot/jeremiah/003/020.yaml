  source_fidelity: 'Основная мысль и синтаксическое сопоставление переданы точно: emphatic אָכֵן, обобщающее настоящее в первой части, совершённое действие Израиля во второй, адресат «дом Израиля» и пророческая формула сохранены. Однако «близкий» как субстантивированное существительное здесь менее точно и естественно передаёт רֵעַ, чем «спутник»; последнее сохраняет широту «товарищ / спутник» и не навязывает значение «муж».'
