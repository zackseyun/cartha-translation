  text: אָכֵ֛ן בָּגְדָ֥ה אִשָּׁ֖ה מֵ/רֵעָ֑/הּ כֵּ֣ן בְּגַדְתֶּ֥ם בִּ֛/י בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/020.yaml
  text: Surely[a], as a woman betrays her companion, so you have betrayed me, O house of Israel, declares Yahweh.
translation:
  language: ru
  text: Поистине, как женщина предаёт своего спутника[a], так и вы предали Меня, дом Израиля, — возвещает ГОСПОДЬ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «как жена предаёт своего мужа». Буквально в еврейском тексте: «женщина» и «её спутник (близкий человек)»; более широкий контекст главы использует образ супружеской неверности Израиля.'
    reason: Сохраняет контекстуально вероятное брачное прочтение, не внося его в основной текст как единственно возможное.
lexical_decisions:
- source_word: אָכֵן
  choice: Поистине
  rationale: Передаёт усилительное, торжественное утверждение, не превращая его в противопоставление, которого контекст не требует однозначно.
- source_word: בָּגְדָה / בְּגַדְתֶּם
  choice: вероломно поступает / вероломно поступили
  rationale: Корень בגד обозначает измену доверию, неверность или предательство в отношениях. Одинаковая русская формулировка сохраняет прямое сопоставление поведения женщины с неверностью Израиля; настоящее время в первой части придаёт сравнению обобщённый характер.
- source_word: אִשָּׁה
  choice: женщина
  rationale: Слово может означать как женщину, так и жену. Более широкое значение сохраняет недосказанность еврейского текста, тогда как брачный оттенок отмечен в сноске.
- source_word: מֵרֵעָהּ
  choice: со своим близким
  rationale: 'רֵעַ имеет широкий смысл: близкий, товарищ, спутник. «Близкий» естественно по-русски и не уточняет отношения как супружеские без достаточного лексического основания.'
- source_word: כֵּן
  choice: так и
  rationale: Ясно и естественно отмечает соответствие между сравнением и поступком Израиля.
- source_word: בִּי
  choice: со Мной
  rationale: При глаголе בגד предлог указывает на того, против кого или по отношению к кому совершена измена. Оборот «вероломно поступили со Мной» естественен в выбранной русской конструкции.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет коллективное и заветное обозначение народа; форма обращения передана без архаизирующей частицы «о».
- source_word: נְאֻם יְהוָה
  choice: возвещает ГОСПОДЬ
  rationale: Передаёт торжественную пророческую формулу; имя יהוה по принятой русской библейской традиции обозначено словом «ГОСПОДЬ».
theological_decisions:
- issue: Характер отношений в сравнении
  choice: Женщина вероломно поступает со своим близким; супружеская связь прямо не уточняется.
  alternative: Жена изменяет своему мужу.
  rationale: В третьей главе Иеремии развёрнут образ супружеской неверности Израиля, поэтому брачное прочтение вероятно. Однако в самом стихе стоят более широкие слова אִשָּׁה и רֵעַ, а не однозначное обозначение мужа; основной текст сохраняет эту смысловую широту, а контекстуально возможное прочтение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Повтор «вероломно поступает / поступили» намеренно сохраняет лексическую связь двух частей сравнения. Обращение «дом Израиля» оставлено без частицы «о», чтобы избежать ненужной архаизации.
