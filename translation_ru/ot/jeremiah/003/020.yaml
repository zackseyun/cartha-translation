- from: Поистине, как женщина вероломно поступает со своим близким[a], так и вы вероломно поступили со Мной, дом Израиля, — возвещает ГОСПОДЬ.
  to: Поистине, как женщина предаёт своего спутника[a], так и вы предали Меня, дом Израиля, — возвещает ГОСПОДЬ.
  rationale: Заменены менее естественные «вероломно поступает со своим близким / поступили со Мной» на прямой параллельный ряд «предаёт своего спутника / предали Меня». Это сохраняет значение בגד как предательства и неверности, сохраняет неопределённость характера отношений в первой части и улучшает современную русскую идиоматику. Сноска уточнена в соответствии с новым основным вариантом и по-прежнему не превращает контекстуально вероятное супружество в утверждение текста.
