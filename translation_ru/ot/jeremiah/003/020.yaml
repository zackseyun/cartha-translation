  terminology: «ГОСПОДЬ», «дом Израиля», «Поистине» и благоговейное написание «Меня» уместны для выбранного торжественного регистра. Сноска должна отражать именно контекстуально возможное уточнение «жена / муж», не выдавая его за буквальное значение главного текста.
