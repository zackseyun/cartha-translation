id: JER.3.18
reference: Jeremiah 3:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔מָּה יֵלְכ֥וּ בֵית יְהוּדָ֖ה עַל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/יָבֹ֤אוּ יַחְדָּו֙ מֵ/אֶ֣רֶץ צָפ֔וֹן עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר הִנְחַ֖לְתִּי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/018.yaml
  text: In those days the house of Judah will go with the house of Israel[b][a], and they will come together from the land of the north to the land that I gave as an inheritance to your fathers.
translation:
  language: ru
  text: В те дни дом Иуды пойдёт вместе с домом Израиля[a], и вместе они придут из северной земли в землю, которую Я дал в наследие вашим отцам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дом Иуды пойдёт к дому Израиля». Еврейский предлог допускает более буквальную передачу, однако здесь, вероятно, выражает присоединение Иуды к Израилю в восстановленном единстве.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «вашим предкам». Буквально: «вашим отцам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה
  choice: В те дни
  rationale: Устойчивое пророческое временное выражение; естественно звучит по-русски и сохраняет возвышенный регистр.
- source_word: יֵלְכוּ ... עַל בֵּית יִשְׂרָאֵל
  choice: пойдёт вместе с домом Израиля
  rationale: Глагол הלך означает «идти», а עַל здесь, судя по контексту восстановления и последующему יַחְדָּו, вероятнее всего передаёт присоединение Иуды к Израилю. Русское «пойдёт вместе с» сохраняет движение и идею единства.
- source_word: בֵית יְהוּדָה / בֵּית יִשְׂרָאֵל
  choice: дом Иуды / дом Израиля
  rationale: Сохранена значимая для пророческой речи корпоративная формула «дом».
- source_word: וְיָבֹאוּ יַחְדָּו
  choice: и вместе они придут
  rationale: Передаёт как действие «придут», так и наречие «вместе», избегая неестественного повтора конструкции.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: из северной земли
  rationale: Прямо передаёт географически-пророческий образ возвращения из земли на севере; по-русски естественнее, чем «из земли севера».
- source_word: עַל הָאָרֶץ
  choice: в землю
  rationale: При глаголе движения предлог עַל здесь обозначает направление к земле; русский винительный с «в» естественно выражает прибытие в неё.
- source_word: אֲשֶׁר הִנְחַלְתִּי
  choice: которую Я дал в наследие
  rationale: Hiphil от נחל означает дать кому-либо владение как наследие; формулировка сохраняет и дар, и наследственный характер владения.
- source_word: אֶת אֲבוֹתֵיכֶם
  choice: вашим отцам
  rationale: Сохраняет явно мужскую форму исходного текста и традиционный библейский смысл праотцов; более широкое «предкам» отмечено в сноске.
theological_decisions:
- issue: Образ восстановления Иуды и Израиля
  choice: Иуда идёт вместе с Израилем, что подчёркивает воссоединение разделённого народа.
  alternative: «Дом Иуды пойдёт к дому Израиля» или более буквально «на дом Израиля».
  rationale: Контекст восстановления и слова «вместе они придут» поддерживают значение присоединения, а не враждебного выступления или господства одного дома над другим.
- issue: Передача אֲבוֹתֵיכֶם
  choice: вашим отцам
  alternative: вашим предкам
  rationale: Основной текст сохраняет грамматически мужское и исторически конкретное обозначение праотцов, не исключая более широкого понимания, указанного в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены формулы «дом Иуды», «дом Израиля» и «дал в наследие»; синтаксис сделан ясным для обычного читателя.
