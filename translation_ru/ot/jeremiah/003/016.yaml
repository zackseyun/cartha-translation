  text: וְ/הָיָ֡ה כִּ֣י תִרְבּוּ֩ וּ/פְרִיתֶ֨ם בָּ/אָ֜רֶץ בַּ/יָּמִ֤ים הָ/הֵ֨מָּה֙ נְאֻם יְהוָ֔ה לֹא יֹ֣אמְרוּ ע֗וֹד אֲרוֹן֙ בְּרִית יְהוָ֔ה וְ/לֹ֥א יַעֲלֶ֖ה עַל לֵ֑ב וְ/לֹ֤א יִזְכְּרוּ ב/וֹ֙ וְ/לֹ֣א יִפְקֹ֔דוּ וְ/לֹ֥א יֵעָשֶׂ֖ה עֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/016.yaml
  text: And it shall be[a], when you have multiplied and been fruitful in the land in those days, declares Yahweh, they will no longer say, ‘The ark of the covenant of Yahweh.’ It will not come to mind, and they will not remember it or miss it[b], nor will it be made again.
translation:
  language: ru
  text: 'И когда в те дни вы станете многочисленными и будете плодовиты в стране, — возвещает Яхве, — уже не будут говорить: «Ковчег завета Яхве». Он больше не придёт им на ум; о нём не будут вспоминать и не станут его искать[a], и другого уже не сделают[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не станут обращать на него внимания», «не будут о нём заботиться» или «не будут по нему скучать». Еврейский глагол имеет несколько близких значений; здесь, вероятно, имеется в виду, что отсутствие ковчега больше не будут ощущать и его не станут разыскивать.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и больше не будет сделан». В еврейском тексте страдательная форма оставляет объект невыраженным; по смыслу речь, вероятно, о том, что новый ковчег взамен прежнего не изготовят.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Оборот вводит будущую временную ситуацию. По-русски «И когда» естественно передаёт пророческую последовательность без архаичного «и будет».
- source_word: תִרְבּוּ וּפְרִיתֶם
  choice: станете многочисленными и будете плодиться
  rationale: Сохраняется различие между רבה, «становиться многочисленными», и פרה, «плодиться, приносить плод», а также узнаваемое библейское сочетание этих понятий.
- source_word: בָּאָרֶץ
  choice: на этой земле
  rationale: В контексте речь идёт о земле Израиля/Иудеи, а не обо всей земле как мире. Указательное «этой» в русском ясно выражает контекстуально определённую землю, хотя в еврейском стоит артикль.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: в те дни
  rationale: Устойчивое и понятное пророческое обозначение будущего времени.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную формулу пророческого изречения; имя יהוה транслитерировано как «Яхве».
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: Ковчег завета Яхве
  rationale: Прямо передаёт цепочку сопряжённых существительных и сохраняет выражение как цитируемое наименование.
- source_word: וְלֹא יַעֲלֶה עַל לֵב
  choice: Он больше не придёт им на ум
  rationale: Еврейская идиома буквально говорит о восхождении на сердце; русский оборот «прийти на ум» естественно передаёт смысл.
- source_word: וְלֹא יִזְכְּרוּ בוֹ
  choice: о нём не будут вспоминать
  rationale: Предлог ב при זכר допускает передачу «вспоминать о»; местоимение отнесено к ковчегу.
- source_word: וְלֹא יִפְקֹדוּ
  choice: не станут его искать
  rationale: 'פקד имеет широкий диапазон значений: обращать внимание, посещать, разыскивать, недосчитываться. В данном контексте «искать» выражает отсутствие потребности разыскивать утраченный ковчег, при этом неоднозначность отмечена в сноске.'
- source_word: וְלֹא יֵעָשֶׂה עוֹד
  choice: и другого такого уже не сделают
  rationale: Еврейская пассивная форма оставляет предмет действия невыраженным. Русская формулировка естественно связывает её с ковчегом и передаёт отсутствие будущей замены, а сноска отмечает буквальную неопределённость.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон. «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Будущий статус ковчега
  choice: Ковчег перестанет быть предметом упоминания, воспоминания, поисков и восстановления
  alternative: Текст говорит лишь о физической утрате ковчега; текст отменяет всякое значение прежнего завета
  rationale: Перевод сохраняет конкретную последовательность отрицаний в стихе и не выводит из неё более широкого догматического заключения, которого сам стих прямо не формулирует.
- issue: Неявный объект в וְלֹא יֵעָשֶׂה עוֹד
  choice: другой такой ковчег
  alternative: это больше не будет сделано
  rationale: По контексту подразумевается ковчег, однако пассивная конструкция грамматически не называет объект; это отражено сноской.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Избегаются как церковнославянизмы («паки», «взыдет на сердце»), так и разговорные обороты. Последовательность отрицаний оригинала сохранена, а неоднозначность פקד и пассивной финальной формы вынесена в сноски.
