id: JER.3.11
reference: Jeremiah 3:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י צִדְּקָ֥ה נַפְשָׁ֖/הּ מְשֻׁבָ֣ה יִשְׂרָאֵ֑ל מִ/בֹּגֵדָ֖ה יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/011.yaml
  text: And Yahweh said to me[a], “Faithless Israel has shown herself more righteous than treacherous Judah.”
translation:
  language: ru
  text: 'И сказал мне Яхве: «Отступница[a] Израиль оказалась праведнее изменницы Иудеи».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неверная». Еврейское слово обозначает ту, которая отвернулась или отступила.'
    reason: Лексически возможен как акцент на отступничестве, так и на неверности в отношениях завета.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога принятой в современном русском библейском употреблении транслитерацией, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Обычная повествовательная форма глагола אמר; простой русский эквивалент естественен в данном прозаическом контексте.
- source_word: אֵלַי
  choice: мне
  rationale: Естественно передаёт направление речи к рассказчику от первого лица.
- source_word: צִדְּקָה נַפְשָׁהּ
  choice: оказалась праведнее
  rationale: Идиома буквально говорит о том, что она сама оказалась права или праведна; сравнительная конструкция указывает не на безусловную невиновность Израиля, а на его относительное положение рядом с Иудеей.
- source_word: מְשֻׁבָה
  choice: Отступница
  rationale: Существительное обозначает ту, которая отвернулась или отступила. Женская форма сохраняет олицетворение Израиля и хорошо сочетается с параллельным обозначением Иудеи.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Традиционная русская форма названия северного царства; в контексте оно олицетворено как женщина.
- source_word: מִבֹּגֵדָה
  choice: изменницы
  rationale: Предлог מן имеет сравнительное значение «чем», выраженное русской сравнительной степенью «праведнее»; בגד передаёт вероломную измену отношениям завета.
- source_word: יְהוּדָה
  choice: Иудеи
  rationale: Традиционная русская форма названия южного царства, здесь олицетворённого как женщина.
theological_decisions:
- issue: Относительная праведность Израиля по сравнению с Иудеей
  choice: «Израиль оказалась праведнее Иудеи» как сравнительная оценка
  alternative: «Израиль оправдала себя перед Иудеей» или утверждение об абсолютной праведности Израиля
  rationale: Еврейский текст сопоставляет два виновных народа. Формулировка сохраняет неожиданную сравнительную оценку, не объявляя Израиль безусловно невиновным перед Богом.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной библейской интонацией. Формы «отступница Израиль» и «изменница Иудея» сохраняют женское олицетворение обоих царств в еврейском тексте.
