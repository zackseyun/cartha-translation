  text: שׁ֚וּבוּ בָּנִ֣ים שׁוֹבָבִ֔ים אֶרְפָּ֖ה מְשׁוּבֹֽתֵי/כֶ֑ם הִנְ/נוּ֙ אָתָ֣נוּ לָ֔/ךְ כִּ֥י אַתָּ֖ה יְהֹוָ֥ה אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/022.yaml
  text: Return[a], O backsliding children; I will heal your backslidings. Behold, we come to you[b], for you are Yahweh our God.
translation:
  language: ru
  text: «Вернитесь, отступившие сыновья[a], — Я исцелю ваши отступления». «Вот, мы пришли к тебе[b], потому что ты — Яхве, наш Бог».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «заблудшие сыновья», «неверные дети». В еврейском тексте слова «вернитесь», «отступившие» и «отступления» образуют смысловую перекличку вокруг ухода и возвращения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вот мы, идём к тебе». Еврейская форма может быть передана как уже совершившееся приближение или как непосредственный отклик на призыв.'
    reason: translation_nuance
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Вернитесь
  rationale: Повелительная форма глагола שוב призывает вновь обратиться к Яхве; «вернитесь» передаёт как движение назад, так и восстановление отношений, не сводя смысл лишь к внутреннему раскаянию.
- source_word: בָּנִים שׁוֹבָבִים
  choice: отступившие сыновья
  rationale: בָּנִים буквально означает «сыновья», а שׁוֹבָבִים характеризует их как уклонившихся, отступивших. Такая формулировка сохраняет мужской образ и связь с последующим «отступления».
- source_word: אֶרְפָּה
  choice: Я исцелю
  rationale: Глагол רפא означает «исцелять»; сохранён конкретный образ исцеления нравственного и духовного отпадения.
- source_word: מְשׁוּבֹתֵיכֶם
  choice: ваши отступления
  rationale: Форма множественного числа обозначает случаи или проявления отпадения. «Отступления» естественно по-русски и поддерживает корневую перекличку с «отступившие».
- source_word: הִנְנוּ
  choice: Вот мы
  rationale: 'Частица с местоименным суффиксом выражает готовность и непосредственный отклик народа: «вот мы».'
- source_word: אָתָנוּ לָךְ
  choice: мы пришли к тебе
  rationale: Перфект первого лица множественного числа указывает на совершившееся приближение к Яхве; по контексту это немедленный ответ на призыв.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передано личное заветное имя Бога, присутствующее в еврейском тексте, а не заменено титулом.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Стандартное заветное выражение с суффиксом первого лица множественного числа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и отличает его от титула אֲדֹנָי.
- issue: Передача בָּנִים
  choice: сыновья
  alternative: дети
  rationale: Еврейское существительное имеет форму мужского рода множественного числа. «Сыновья» сохраняет образ текста, хотя обращение относится к народу как целому.
- issue: Смена говорящего внутри стиха
  choice: Две отдельные реплики в кавычках
  alternative: Единый текст без графического разграничения
  rationale: Первая реплика принадлежит Яхве, а «Вот мы…» представляет ответ народа. Кавычки делают смену говорящего понятной, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Повтор «Вот мы, мы пришли» намеренно сохраняет эмфатическое הִנְנוּ и следующую глагольную форму. Строчные местоимения «тебе», «ты» следуют обычной современной издательской норме и не снижают почтительности.
