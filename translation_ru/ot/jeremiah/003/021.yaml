source:
  edition: WLC
  text: ק֚וֹל עַל שְׁפָיִ֣ים נִשְׁמָ֔ע בְּכִ֥י תַחֲנוּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֤י הֶעֱוּוּ֙ אֶת דַּרְכָּ֔/ם שָׁכְח֖וּ אֶת יְהֹוָ֥ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/021.yaml
  text: A voice is heard on the bare heights[a], the weeping and pleas for mercy of the sons of Israel, because they have made their way crooked[c][b]; they have forgotten Yahweh their God.
translation:
  language: ru
  text: На голых высотах слышится голос — плач и мольбы сынов Израиля[a], потому что они искривили свой путь[b]; они забыли Яхве[c], своего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей Израиля»; по смыслу также: «народа Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «извратили свой путь», «сделали свой путь кривым».'
    reason: lexical_alternative
  - marker: c
    text: 'Евр. ЙХВХ; традиционно: «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: ק֚וֹל
  choice: голос
  rationale: קול означает «голос» или «звук»; «голос» сохраняет яркое введение и естественно поясняется следующими словами о плаче и мольбах.
- source_word: עַל שְׁפָיִ֣ים
  choice: на голых высотах
  rationale: שׁפיים обозначает открытые, безлесные или бесплодные возвышенности. «Голые высоты» передаёт и рельеф, и обнажённость местности, не превращая выражение в специальное обозначение культовых мест.
- source_word: נִשְׁמָ֔ע
  choice: слышится
  rationale: Нифаль глагола שמע имеет пассивное значение. Русское «слышится» естественно сочетается с «голосом» и сохраняет сцену происходящего.
- source_word: בְּכִ֥י
  choice: плач
  rationale: Существительное בכי прямо означает плач; оно выступает пояснением того, какой голос слышится.
- source_word: תַחֲנוּנֵ֖י
  choice: мольбы
  rationale: תחנונים — настойчивые просьбы о милости. «Мольбы» передают серьёзность и покаянный оттенок без тяжеловесности слова «прошения».
- source_word: בְּנֵ֣י יִשְׂרָאֵ֑ל
  choice: сынов Израиля
  rationale: Формально сохраняется мужская множественная конструкция בני ישראל; коллективное значение «народ Израиля» отмечено в сноске.
- source_word: כִּ֤י
  choice: потому что
  rationale: כי вводит причину плача и мольбы; «потому что» ясно выражает причинную связь.
- source_word: הֶעֱוּוּ֙ אֶת דַּרְכָּ֔ם
  choice: они искривили свой путь
  rationale: Хифиль עוה означает делать кривым, искажать. «Искривили свой путь» сохраняет конкретную метафору нравственного уклонения.
- source_word: שָׁכְח֖וּ
  choice: забыли
  rationale: Перфект передаёт совершившееся отступление, объясняющее нынешний плач.
- source_word: יְהֹוָ֥ה
  choice: Яхве
  rationale: Передача личного имени, стоящего в еврейском тексте, сохраняет его отличие от титула «Господь».
- source_word: אֱלֹהֵי/הֶֽם
  choice: своего Бога
  rationale: Возвратное «своего» естественно по-русски соотносит Бога с подлежащим «они» и подчёркивает трагизм забвения их собственного Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В основном тексте сохранено личное Божье имя, а традиционная русская передача указана в сноске; это не устраняет различие между именем и титулом.
- issue: Коллективное значение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: дети Израиля; народ Израиля
  rationale: Основной текст формально сохраняет мужскую форму источника, а сноска показывает допустимое коллективное понимание, не ограничивающее смысл только непосредственными сыновьями патриарха.
- issue: Образ нравственного отступления в הֶעֱוּוּ אֶת דַּרְכָּם
  choice: искривили свой путь
  alternative: извратили свой путь
  rationale: Сохранена образность кривого пути без усиления до более абстрактного или потенциально неоднозначного современного слова «извратили».
translation_notes:
  register: Современный литературный русский язык с возвышенным, но доступным библейским звучанием. Тире оформляет пояснительное приложение «плач и мольбы», а точка с запятой сохраняет тесную связь двух причинно связанных признаний. Метафора пути и личное имя Бога сохранены явно.
