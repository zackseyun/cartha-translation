base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/003.yaml
  text: Therefore the showers were withheld[a], and there was no spring rain; yet you had the forehead of a prostitute—you refused to be ashamed.
translation:
  language: ru
  text: Поэтому дожди были удержаны, и не было весеннего дождя[a]. Но у тебя был лоб блудницы — ты отказалась стыдиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позднего дождя». Имеется в виду сезонный дождь, выпадавший весной перед жатвой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּנְעוּ
  choice: прекратились
  rationale: Нифаль глагола מנע указывает на прекращение или удержание дождей. В сочетании с «ливнями» естественное русское «прекратились» передаёт результат, не уточняя явно действующее лицо.
- source_word: רְבִבִים
  choice: ливни
  rationale: Существительное обозначает обильные дождевые потоки или сильные дожди; «ливни» кратко и естественно передаёт образ.
- source_word: מַלְקוֹשׁ
  choice: весенний дождь
  rationale: Это поздний сезонный дождь, выпадающий весной перед жатвой. Такой перевод понятен современному читателю; традиционная альтернатива приведена в сноске.
- source_word: מֵצַח
  choice: лоб
  rationale: Сохранён буквальный телесный образ, выражающий вызывающую бесстыдность.
- source_word: אִשָּׁה זוֹנָה
  choice: блудница
  rationale: «Блудница» сохраняет прямую пророческую метафору и соответствует достоинству библейского регистра, не переходя к грубой лексике.
- source_word: הָיָה לָךְ
  choice: у тебя был
  rationale: Еврейская конструкция с היה и ל выражает обладание; по-русски естественно «у тебя был».
- source_word: מֵאַנְתְּ
  choice: ты отказалась
  rationale: Глагол מאן выражает сознательный отказ, а не просто отсутствие желания.
- source_word: הִכָּלֵם
  choice: стыдиться
  rationale: Инфинитив передаёт переживание стыда; после «отказалась» естественна форма «стыдиться».
theological_decisions:
- issue: Образ проституции как обозначение неверности завету
  choice: 'Сохранить прямой образ: «у тебя был лоб блудницы»'
  alternative: «ты была бесстыдна» или «ты стала наглой»
  rationale: Пророческая речь намеренно связывает идолопоклонство Иуды с супружеской неверностью. Конкретный образ следует сохранить, не сводя его к отвлечённой характеристике.
- issue: Агент прекращения дождей
  choice: 'Не называть действующее лицо: «ливни прекратились»'
  alternative: «ливни были удержаны» или «Бог удержал ливни»
  rationale: Еврейская форма не называет агента. Контекст подразумевает Божий суд, однако перевод не должен добавлять выраженное подлежащее и тем самым устранять грамматическую недосказанность.
translation_notes:
  register: Современный литературный русский с сохранением резкой пророческой метафоры. Женский род («отказалась») отражает обращение к олицетворённой Иудее. Синтаксис краткий и ритмичный; лексика не архаизирована, кроме уместного библейского слова «блудница».
