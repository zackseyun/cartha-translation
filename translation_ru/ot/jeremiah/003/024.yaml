base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/024.yaml
  text: But shame has devoured the labor of our fathers from our youth—their flocks and their herds[a], their sons and their daughters.
translation:
  language: ru
  text: 'Но постыдное[a] пожрало плоды труда наших отцов с нашей юности: их мелкий и крупный скот, их сыновей и дочерей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стыд». Возможно, это уничижительное обозначение Ваала или идолопоклонства.'
    reason: Сохраняется альтернативное понимание הַבֹּשֶׁת как абстрактного «стыда» либо метонимического обозначения постыдного идола и связанного с ним культа.
lexical_decisions:
- source_word: וְהַבֹּשֶׁת
  choice: А постыдное
  rationale: Субстантивированное «постыдное» сохраняет уничижительную и намеренно не вполне определённую еврейскую формулировку, которая может метонимически указывать на Ваала или идолопоклонство. Союз передан как «А», естественно продолжающее исповедание.
- source_word: אָכְלָה
  choice: пожирало
  rationale: Глагол буквально означает «есть»; применительно к достоянию «пожирало» сохраняет яркую метафору полного уничтожения.
- source_word: יְגִיעַ
  choice: плоды труда
  rationale: Слово обозначает нажитое или приобретённое трудом, а последующий перечень уточняет состав этого достояния. «Плоды труда» точнее, чем одно «труд», и не сужает смысл до урожая.
- source_word: אֲבוֹתֵינוּ
  choice: наших отцов
  rationale: Прямо передаёт мужское множественное число и естественно звучит в данном историческом контексте.
- source_word: מִנְּעוּרֵינוּ
  choice: с самой нашей юности
  rationale: Передаёт отсчёт от раннего времени и длительность происходившего; усилительное «самой» естественно выражает этот временной охват по-русски.
- source_word: צֹאנָם וְאֶת בְּקָרָם
  choice: их мелкий и крупный скот
  rationale: צֹאן обозначает овец и коз как мелкий скот, а בָּקָר — крупный рогатый скот. Такая парная формулировка точна и естественна по-русски.
- source_word: בְּנֵיהֶם וְאֶת בְּנוֹתֵיהֶם
  choice: их сыновей и дочерей
  rationale: Сохраняет намеренно названные отдельно мужскую и женскую группы потомков.
theological_decisions:
- issue: Возможное метонимическое употребление הַבֹּשֶׁת как обозначения Ваала или идолопоклонства
  choice: 'В основном тексте: «постыдное»'
  alternative: «стыд»; либо пояснительное «Ваал» / «идолопоклонство»
  rationale: «Постыдное» сохраняет олицетворённый образ и уничижительный оттенок исходного слова, не устанавливая прямо его референт. Возможная связь с Ваалом или идолопоклонством вынесена в сноску, чтобы сохранить смысловую и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Образ «пожирало» сохранён; перечень оформлен через двоеточие как пояснение к «плодам труда». Маркер [a] помещён непосредственно после неоднозначного выражения.
