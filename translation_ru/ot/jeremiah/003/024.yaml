  source_fidelity: 'Смысл в целом передан точно: הַבֹּשֶׁת оставлено неоднозначным и снабжено уместной сноской; «плоды труда» хорошо передаёт יְגִיעַ; перечень скота и детей сохранён. Однако перфект אָכְלָה в данном исповедальном контексте естественнее передать совершенным видом («пожрало»), как уже отражено в английском аудите «has devoured».'
