source:
  edition: WLC
  text: שׁ֣וּבוּ בָנִ֤ים שׁוֹבָבִים֙ נְאֻם יְהוָ֔ה כִּ֥י אָנֹכִ֖י בָּעַ֣לְתִּי בָ/כֶ֑ם וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶחָ֣ד מֵ/עִ֗יר וּ/שְׁנַ֨יִם֙ מִ/מִּשְׁפָּחָ֔ה וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/014.yaml
  text: Return[a], O faithless children, declares Yahweh, for I am your master; and I will take you, one from a city and two from a clan, and I will bring you to Zion.
translation:
  language: ru
  text: «Вернитесь, неверные сыновья, — возвещает Яхве, — ведь Я ваш господин[a]. Я возьму вас — одного из города и двоих из рода — и приведу вас на Сион».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь Я ваш муж»; возможно также: «ведь Я вступил с вами в брак». Еврейский глагол может выражать и господство, и брачные отношения.'
    reason: Сохранение лексической многозначности בָּעַלְתִּי и связанного с ней богословского напряжения.
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Вернитесь
  rationale: Повелительная форма глагола שוב призывает возвратиться к Яхве и к отношениям завета; «вернитесь» сохраняет как пространственный, так и relationalный образ, не сужая смысл до одного лишь «покайтесь».
- source_word: בָנִים שׁוֹבָבִים
  choice: неверные сыновья
  rationale: בָנִים буквально означает «сыновья», а שׁוֹבָבִים описывает тех, кто отвернулся и нарушил верность. Формулировка сохраняет мужской образ исходного текста и тему неверности завету.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана естественным для современного литературного русского языка глаголом «возвещает»; личное имя יהוה транслитерировано как «Яхве».
- source_word: כִּי אָנֹכִי בָּעַלְתִּי בָכֶם
  choice: ведь Я ваш господин[a]
  rationale: Глагол בעל допускает смысл господства и одновременно брачно-супружеский смысл. Основной текст ясно выражает власть Яхве, а примечание сохраняет брачную метафору и не устраняет намеренную многозначность.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: Я возьму вас
  rationale: Прямое значение לקח уместно в последующем образе собирания и возвращения народа.
- source_word: אֶחָד מֵעִיר וּשְׁנַיִם מִמִּשְׁפָּחָה
  choice: одного из города и двоих из рода
  rationale: Передана числовая и синтаксическая конкретность еврейской фразы без добавления отсутствующего в тексте слова «каждого». מִשְׁפָּחָה здесь обозначает расширенную родственную группу, поэтому выбрано «род», а не узкое «семья».
- source_word: וְהֵבֵאתִי אֶתְכֶם צִיּוֹן
  choice: и приведу вас на Сион
  rationale: Обычная русская конструкция для движения к месту назначения; «Сион» сохранён как традиционное географическое и богословски значимое имя.
theological_decisions:
- issue: Как передать совмещение значения господства и брачного отношения в בָּעַלְתִּי
  choice: 'В основном тексте: «Я ваш господин»; брачные варианты — в примечании.'
  alternative: «Я ваш муж» или «Я взял вас Себе в жёны».
  rationale: Контекст главы использует брачный образ отношений Яхве с народом, тогда как непосредственное обращение сформулировано как «сыновья». Основной вариант сохраняет утверждение власти, а примечание открыто отмечает супружеский смысл, не разрешая неоднозначность односторонне.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Синтаксис и тире помогают ясно отделить формулу речи и перечисление; архаизмы и конфессионально специфическая терминология не используются.
