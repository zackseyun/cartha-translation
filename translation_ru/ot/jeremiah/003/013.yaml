  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַ֚ךְ דְּעִ֣י עֲוֺנֵ֔/ךְ כִּ֛י בַּ/יהוָ֥ה אֱלֹהַ֖יִ/ךְ פָּשָׁ֑עַתְּ וַ/תְּפַזְּרִ֨י אֶת דְּרָכַ֜יִ/ךְ לַ/זָּרִ֗ים תַּ֚חַת כָּל עֵ֣ץ רַעֲנָ֔ן וּ/בְ/קוֹלִ֥/י לֹא שְׁמַעְתֶּ֖ם נְאֻם יְהֹוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/013.yaml
  text: Only acknowledge your guilt[a], that you have rebelled against Yahweh your God and scattered your ways among strangers under every green tree, and you have not obeyed my voice[b], declares Yahweh.
translation:
  language: ru
  text: 'Только признай свою вину[a]: ты восстала против Яхве, твоего Бога, и рассеивала свои пути среди чужих под каждым зеленеющим деревом; а голоса Моего вы не слушались[b], — возвещает Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своё беззаконие». Еврейское слово может обозначать как сам грех, так и связанную с ним виновность.'
    reason: alternative_reading
  - marker: b
    text: Выражение «под каждым зеленеющим деревом» часто обозначает места недозволенного богослужения. В конце стиха еврейский текст переходит от обращения к одной женщине («ты») к обращению ко многим («вы»).
    reason: cultural_and_textual_note
lexical_decisions:
- source_word: אַךְ דְּעִי עֲוֺנֵךְ
  choice: Только признай свою вину
  rationale: Ограничительная частица אַךְ сосредоточивает внимание на необходимом признании; דְּעִי буквально «знай», но с объектом «вина» естественно означает «признай».
- source_word: פָּשָׁעַתְּ
  choice: ты восстала
  rationale: Форма обращена к женщине в единственном числе; פשע передаёт сознательный мятеж против законной власти, а не просто проступок.
- source_word: בַּיהוָה אֱלֹהַיִךְ
  choice: против Яхве, твоего Бога
  rationale: Предлог при פשע имеет значение направленности мятежа против кого-либо; тетраграмматон передан как личное имя Яхве.
- source_word: וַתְּפַזְּרִי אֶת דְּרָכַיִךְ לַזָּרִים
  choice: и расточала свои пути чужим
  rationale: Сохраняется необычный еврейский образ рассеивания или расточения своих путей и слово «чужие», не уточняющее прямо, люди это или чужие боги.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: под каждым зеленеющим деревом
  rationale: רַעֲנָן обозначает пышную, свежую зелень; выражение сохраняет конкретный образ мест недозволенного поклонения.
- source_word: וּבְקוֹלִי לֹא שְׁמַעְתֶּם
  choice: а голоса Моего вы не слушались
  rationale: Сочетание «слушать голос» включает послушание. Множественное «вы» сохраняет заметный переход исходного текста от женского единственного числа к множественному.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современно и весомо.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет личное заветное имя; транслитерация «Яхве» отличает его от титула и не заменяет имени.
- issue: Значение לַזָּרִים в метафоре неверности
  choice: чужим
  alternative: чужим богам; чужеземцам
  rationale: Контекст связывает выражение с идолопоклонством и супружеской неверностью, однако существительное «богам» в еврейском тексте отсутствует. Основной текст сохраняет двусмысленность.
- issue: Переход от единственного числа к множественному
  choice: ты восстала… вы не слушались
  alternative: ты… не слушалась
  rationale: Масоретский текст действительно переходит от форм женского единственного числа к форме второго лица множественного числа; выравнивание устранило бы значимую текстовую особенность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род сохраняет олицетворение Израиля как неверной женщины; прописная буква в «Моего» отмечает речь Бога по устойчивой русской библейской традиции. Необычное «расточала свои пути чужим» намеренно удерживает образность и двусмысленность оригинала.
