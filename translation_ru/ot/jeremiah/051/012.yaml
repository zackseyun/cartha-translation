id: JER.51.12
reference: Jeremiah 51:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֶל חוֹמֹ֨ת בָּבֶ֜ל שְׂאוּ נֵ֗ס הַחֲזִ֨יקוּ֙ הַ/מִּשְׁמָ֔ר הָקִ֨ימוּ֙ שֹֽׁמְרִ֔ים הָכִ֖ינוּ הָ/אֹֽרְבִ֑ים כִּ֚י גַּם זָמַ֣ם יְהוָ֔ה גַּם עָשָׂ֕ה אֵ֥ת אֲשֶׁר דִּבֶּ֖ר אֶל יֹשְׁבֵ֥י בָבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/012.yaml
  text: Against the walls of Babylon[a], lift up a signal; strengthen the watch; station watchmen; prepare the ambushes[c][b]. For Yahweh has both planned and done what he spoke against the inhabitants of Babylon.
translation:
  language: ru
  text: Против стен Вавилона[a] поднимите сигнальное знамя[b]; усильте охрану, расставьте стражей, приготовьте засады[c]. Ведь Яхве и замыслил, и исполнил то, что говорил жителям Вавилона[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «К стенам Вавилона». Предлог может обозначать направление к стенам; в военном контексте возможен смысл действия против них.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поднимите боевое знамя» или «поднимите сигнал». Еврейское נֵס обозначает поднятый военный знак, видимый издали.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «приготовьте сидящих в засаде». Еврейское выражение может обозначать как самих воинов, так и устроенные ими засады.'
    reason: lexical_alternative
  - marker: d
    text: 'Или по смыслу: «говорил против жителей Вавилона». Буквально: «говорил жителям Вавилона»; в контексте речь идёт о слове суда над ними.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל חוֹמֹת בָּבֶל
  choice: Против стен Вавилона
  rationale: Предлог אֶל обычно обозначает направление «к», но в ряду военных повелений естественно передаёт направленность враждебного действия против стен; неоднозначность отмечена в сноске.
- source_word: שְׂאוּ נֵס
  choice: поднимите сигнальное знамя
  rationale: נֵס — поднятый и видимый издали знак, в данном контексте военный. Сочетание «сигнальное знамя» сохраняет и предметный образ, и его функцию.
- source_word: הַחֲזִיקוּ הַמִּשְׁמָר
  choice: усильте охрану
  rationale: Порода hифиль глагола חזק выражает усиление, а מִשְׁמָר здесь означает охрану или караул. Перевод краток и естественен для военного приказа.
- source_word: הָקִימוּ שֹׁמְרִים
  choice: расставьте стражей
  rationale: הקים со словом «стражи» означает поставить или разместить их на постах.
- source_word: הָכִינוּ הָאֹרְבִים
  choice: приготовьте засады
  rationale: Форма от ארב может обозначать как людей, сидящих в засаде, так и сами засады; основной текст выбирает естественное русское выражение, а альтернатива вынесена в сноску.
- source_word: כִּי גַּם זָמַם יְהוָה גַּם עָשָׂה
  choice: Ведь Яхве и замыслил, и исполнил
  rationale: Парная конструкция גַּם…גַּם передана повтором «и… и». זמם означает обдумать или замыслить, а עשה в данном контексте — осуществить задуманное.
- source_word: אֵת אֲשֶׁר דִּבֶּר אֶל יֹשְׁבֵי בָבֶל
  choice: то, что говорил жителям Вавилона
  rationale: Основной перевод сохраняет обычное направительное значение אֶל («жителям»), не устраняя напряжение между грамматической формой и контекстом суда; контекстуальный вариант «против жителей» дан в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано общепринятой современной русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Направленность слова Яхве к жителям Вавилона
  choice: говорил жителям Вавилона
  alternative: говорил против жителей Вавилона
  rationale: אֶל обычно значит «к/кому», тогда как содержание пророчества представляет собой суд над Вавилоном. Основной текст сохраняет грамматическую направленность, а сноска поясняет контекстуальное прочтение, не снимая неоднозначности.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным ритмом последовательных военных приказов. Синтаксический параллелизм «и замыслил, и исполнил» передаёт подчёркнутую парность еврейской конструкции. Лексика понятна широкому читателю и сохраняет торжественный библейский регистр без архаизации.
