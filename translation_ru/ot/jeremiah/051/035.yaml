base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/035.yaml
  text: “My violence and my flesh be upon Babylon,” says the inhabitant of Zion[b][a]. “And my blood be upon the inhabitants of Chaldea,” says Jerusalem.
translation:
  language: ru
  text: «Насилие, причинённое мне и моей плоти[a], — на Вавилоне[b]!» — скажет жительница Сиона. «И кровь моя — на жителях Халдеи!» — скажет Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моему телу». Еврейское слово традиционно понимают здесь как обозначение плоти или тела; предлагались и другие толкования его происхождения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на Вавилоне». Это краткая обвинительная формула: вина за содеянное и воздаяние за него должны лечь на Вавилон. Такой же подразумеваемый смысл присутствует в словах о жителях Халдеи.'
    reason: implicit_imprecatory_sense
lexical_decisions:
- source_word: חֲמָסִי
  choice: насилие надо мной
  rationale: חָמָס обозначает насилие, злодеяние или несправедливость. В контексте жалобы Сиона суффикс первого лица указывает на насилие, которому она подверглась, а не на совершённое ею насилие.
- source_word: וּשְׁאֵרִי
  choice: и моя плоть
  rationale: Традиционное понимание слова — «плоть»; оно образует телесную параллель с «моей кровью» во второй части стиха. Русское «плоть» сохраняет образ и допускает присущую еврейскому тексту сжатость.
- source_word: עַל בָּבֶל
  choice: на Вавилоне
  rationale: Предлог עַל в бессказуемой формуле выражает возложение ответственности или кары на Вавилон. Сжатая конструкция сохраняет судебно-проклятийный оттенок оригинала, который разъясняется в сноске.
- source_word: תֹּאמַר
  choice: скажет
  rationale: Имперфект передаёт пророческое введение прямой речи; в русском контексте естественна форма будущего времени.
- source_word: יֹשֶׁבֶת צִיּוֹן
  choice: жительница Сиона
  rationale: Причастие женского рода в единственном числе персонифицирует общину Сиона как женщину. «Жительница Сиона» прямо передаёт форму текста, не подменяя её выражением «дочь Сиона».
- source_word: וְדָמִי
  choice: и кровь моя
  rationale: דָּם с суффиксом первого лица естественно означает пролитую кровь Иерусалима и продолжает телесную образность первой части.
- source_word: אֶל יֹשְׁבֵי כַשְׂדִּים
  choice: на жителях Халдеи
  rationale: Хотя אֶל буквально значит «к, по направлению к», параллель с первой строкой подразумевает, что ответственность за кровь обращена на жителей Халдеи. Русская бессказуемая конструкция сохраняет этот параллелизм.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Употреблено общепринятое русское написание имени; город персонифицирован и сам произносит обвинение.
theological_decisions:
- issue: Проклятийный или судебный смысл бессказуемых выражений עַל בָּבֶל и אֶל יֹשְׁבֵי כַשְׂדִּים
  choice: Сохранить сжатые формулы «на Вавилоне» и «на жителях Халдеи», пояснив подразумеваемую ответственность в сноске.
  alternative: 'Передать развёрнуто: «пусть Вавилон ответит» и «пусть жители Халдеи ответят».'
  rationale: Развёрнутый вариант яснее, но однозначно вводит сказуемое и сглаживает поэтическую напряжённость оригинала. Выбранный текст сохраняет как обвинение, так и пожелание воздаяния, не сводя фразу только к одному из этих оттенков.
translation_notes:
  register: Современный литературный русский с сохранением высокой поэтической сжатости. Персонификация Сиона и Иерусалима передана формами женского рода; архаическое «да будет» не вводится, а необычная бессказуемая формула оригинала сохранена и пояснена.
