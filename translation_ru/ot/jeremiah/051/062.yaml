  text: וְ/אָמַרְתָּ֗ יְהוָה֙ אַתָּ֨ה דִבַּ֜רְתָּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ לְ/הַכְרִית֔/וֹ לְ/בִלְתִּ֤י הֱיֽוֹת בּ/וֹ֙ יוֹשֵׁ֔ב לְ/מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה כִּֽי שִׁמְמ֥וֹת עוֹלָ֖ם תִּֽהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/062.yaml
  text: and say[a], ‘O Yahweh, you yourself have spoken concerning this place, to cut it off so that no inhabitant will be in it, from man to beast[c][b]; for it will become everlasting desolations.’
translation:
  language: ru
  text: 'И скажи: «О Яхве, Ты Сам сказал об этом месте, что уничтожишь его[a], так что не будет в нём ни человека, ни животного[b], ибо оно станет вечными запустениями[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отсечёшь его». В данном контексте еврейский глагол означает решительное уничтожение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от человека и до животного» — устойчивое выражение, означающее полное исчезновение и людей, и животных.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «станет вечными запустениями»; возможный перевод: «станет пустыней навсегда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: и скажи
  rationale: Форма с союзом продолжает последовательность повелений; в современном русском естественно передаётся императивом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אַתָּה דִבַּרְתָּ
  choice: Ты Сам сказал
  rationale: Отдельное местоимение אַתָּה при глаголе подчёркивает действующее лицо; «Сам» сохраняет это смысловое ударение.
- source_word: דִבַּרְתָּ אֶל הַמָּקוֹם הַזֶּה
  choice: сказал об этом месте
  rationale: Предлог אֶל буквально может указывать направление речи, однако при слове «место» в данном контексте по-русски естественно выразить предмет сказанного без усиления до «против».
- source_word: לְהַכְרִיתוֹ
  choice: что истребишь его
  rationale: Hiphil от כרת буквально связан с отсечением, но здесь означает решительное уничтожение места; русское «истребишь» сохраняет силу образа и подходит к последующему полному опустошению.
- source_word: לְבִלְתִּי הֱיוֹת בּוֹ יוֹשֵׁב
  choice: так что не останется в нём ни одного обитателя
  rationale: Передаёт значение цели или результата, не устраняя присущую конструкции смысловую близость этих оттенков; «ни одного» ясно выражает полное отсутствие жителей.
- source_word: לְמֵאָדָם וְעַד בְּהֵמָה
  choice: ни человека, ни животного
  rationale: Естественно передаёт меризм «от человека до животного», то есть полное исчезновение людей и животных, сохраняя формы единственного числа.
- source_word: כִּי
  choice: ибо
  rationale: Сохраняет причинно-пояснительную связь и соответствует достоинству пророческой речи.
- source_word: שִׁמְמוֹת עוֹלָם תִּהְיֶה
  choice: оно навеки станет пустыней
  rationale: Передаёт будущий итоговый статус места и длительность עוֹלָם естественным русским оборотом; буквальное множественное число отмечено в сноске.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя, поэтому транслитерация сохраняет его личный и заветный характер, не подменяя титулом.
- issue: Обобщающее значение אָדָם в формуле полного опустошения
  choice: человек
  alternative: люди; человечество
  rationale: Единственное число соответствует исходной формуле и в русском языке естественно обозначает любого представителя человеческого рода.
- issue: Продолжительность запустения в עוֹלָם
  choice: навеки
  alternative: навсегда; на долгие времена
  rationale: Слово обозначает неопределённо-продолжительное, непрекращающееся в пределах пророческой перспективы состояние; перевод сохраняет силу утверждения, не добавляя отдельного догматического толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Синтаксис слегка упорядочен ради естественности; эмфаза местоимения, полнота опустошения и сила формулы о длительном запустении сохранены. Все сноски поставлены непосредственно при соответствующих выражениях.
