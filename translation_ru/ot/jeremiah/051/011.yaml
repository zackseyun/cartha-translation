base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/011.yaml
  text: Sharpen the arrows[a]; fill the shields. Yahweh has stirred up the spirit of the kings of Media, because his plan is against Babylon, to destroy her; for it is the vengeance of Yahweh[b], vengeance for his temple.
translation:
  language: ru
  text: Заострите стрелы, наполните колчаны[a]! Яхве пробудил дух царей Мидии, потому что Его замысел — против Вавилона, чтобы погубить его. Ведь это возмездие Яхве — возмездие за Его храм.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наполните щиты». Значение еврейского слова спорно: обычно его понимают как «щиты», однако в сочетании со стрелами возможно значение «колчаны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבֵרוּ הַחִצִּים
  choice: Заострите стрелы
  rationale: Глагол в контексте подготовки оружия может означать доведение стрел до боевой готовности, в том числе их заострение или полировку; «заострите» естественно передаёт военный смысл.
- source_word: מִלְאוּ הַשְּׁלָטִים
  choice: наполните колчаны
  rationale: Хотя הַשְּׁלָטִים обычно связывают со щитами, сочетание с глаголом «наполните» и непосредственное упоминание стрел поддерживают контекстуальное значение «колчаны»; неоднозначность отмечена в сноске.
- source_word: הֵעִיר ... אֶת רוּחַ
  choice: пробудил дух
  rationale: Сохраняет каузативное значение «возбудил, пробудил к действию» и многозначность רוּחַ как внутреннего побуждения или духа.
- source_word: מַלְכֵי מָדַי
  choice: царей Мидии
  rationale: Естественное русское географическое наименование, соответствующее еврейскому выражению.
- source_word: מְזִמָּתוֹ
  choice: Его замысел
  rationale: Передаёт намеренный план без добавления обязательно отрицательной окраски слова «заговор».
- source_word: לְהַשְׁחִיתָהּ
  choice: чтобы погубить его
  rationale: В русском название «Вавилон» мужского рода, поэтому местоименное согласование естественно передаёт женский суффикс еврейского текста без искусственной персонификации.
- source_word: נִקְמַת יְהוָה
  choice: возмездие Яхве
  rationale: «Возмездие» достойно и ясно передаёт судебно-карательный смысл נְקָמָה; конструкция сохраняет возможный оттенок как принадлежащего Яхве, так и совершаемого Им воздаяния.
- source_word: הֵיכָלוֹ
  choice: Его храм
  rationale: В данном контексте речь идёт о храме Яхве; «храм» является обычным и точным русским соответствием.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Божественная инициатива в выступлении мидийских царей
  choice: Яхве пробудил дух царей Мидии
  alternative: Яхве допустил выступление царей Мидии
  rationale: Каузативный глагол прямо приписывает Яхве побуждение царей к действию; перевод не ослабляет это до простого позволения.
- issue: Характер падения Вавилона
  choice: возмездие Яхве — возмездие за Его храм
  alternative: месть Яхве за Его храм
  rationale: Сохраняется мысль о целенаправленном Божьем воздаянии за храм, при этом «возмездие» в современном русском звучит достойнее и не сводит действие к личной мстительности.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Краткие повеления сохранены; имя Яхве передано транслитерацией. Лексическая неоднозначность הַשְּׁלָטִים не устранена молча, а отражена в сноске.
