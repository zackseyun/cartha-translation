  variant: modern literary Russian
source:
  edition: WLC
  text: פִּתְאֹ֛ם נָפְלָ֥ה בָבֶ֖ל וַ/תִּשָּׁבֵ֑ר הֵילִ֣ילוּ עָלֶ֗י/הָ קְח֤וּ צֳרִי֙ לְ/מַכְאוֹבָ֔/הּ אוּלַ֖י תֵּרָפֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/008.yaml
  text: Suddenly Babylon has fallen and been shattered[a]. Wail over her! Take balm for her pain; perhaps she may be healed.
translation:
  language: ru
  text: Внезапно пал Вавилон и был сокрушён. Рыдайте о нём! Возьмите бальзам[a] от его боли — может быть, он исцелится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «целебную смолу». Еврейское слово обозначает смолистое вещество, употреблявшееся для лечения.'
    reason: Лексическая альтернатива поясняет конкретный медицинский образ.
lexical_decisions:
- source_word: פִּתְאֹם
  choice: Внезапно
  rationale: Наречие передаёт неожиданность и стремительность падения.
- source_word: נָפְלָה
  choice: пал
  rationale: Форма qal перфекта сообщает о падении как о совершившемся событии; русское прошедшее время естественно сохраняет эту выразительность.
- source_word: בָבֶל
  choice: Вавилон
  rationale: Устоявшаяся русская форма названия города и державы.
- source_word: וַתִּשָּׁבֵר
  choice: и был сокрушён
  rationale: Nifal глагола שׁבר обозначает претерпевание разрушения; «сокрушён» передаёт тяжесть катастрофы лучше, чем общее «разбит».
- source_word: הֵילִילוּ
  choice: Рыдайте
  rationale: Повелительное множественного числа призывает к громкому скорбному плачу; «рыдайте» звучит естественно и достойно в современном русском.
- source_word: עָלֶיהָ
  choice: о нём
  rationale: При глаголе плача предлог עַל указывает на предмет скорби. Мужской род обусловлен грамматическим родом русского названия «Вавилон».
- source_word: קְחוּ צֳרִי
  choice: Возьмите бальзам
  rationale: צֳרִי — лечебное смолистое вещество; «бальзам» является кратким и понятным русским соответствием.
- source_word: לְמַכְאוֹבָהּ
  choice: от его боли
  rationale: מַכְאוֹב означает боль или страдание; конструкция «бальзам от боли» естественна по-русски и не сужает образ до буквальной раны.
- source_word: אוּלַי תֵּרָפֵא
  choice: может быть, он исцелится
  rationale: אוּלַי сохраняет неуверенную возможность, а nifal רפא — образ исцеления или восстановления.
theological_decisions:
- issue: Олицетворение Вавилона
  choice: Сохранить образ Вавилона как страдающего существа, но использовать мужские местоимения по грамматическому роду русского названия
  alternative: Ввести женский образ города и местоимения «она/её» либо добавить выражение «дочь Вавилона»
  rationale: В еврейском тексте Вавилон обозначен формами женского рода и олицетворён. В русском слово «Вавилон» мужского рода; искусственная смена рода или добавление отсутствующего в стихе обозначения исказили бы естественную речь. Олицетворение сохраняют слова «боль» и «исцелится».
- issue: Неопределённость возможного исцеления
  choice: «может быть, он исцелится»
  alternative: «он исцелится» или «он сможет исцелиться»
  rationale: Перевод сохраняет выраженную словом אוּלַי неуверенность и не решает заранее, возможно ли восстановление Вавилона.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Краткие повелительные и восклицательные фразы сохраняют резкость и эмоциональную силу еврейского текста; тире естественно связывает попытку лечения с неуверенной надеждой на исцеление.
