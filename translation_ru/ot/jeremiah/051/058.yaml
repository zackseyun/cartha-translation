source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת חֹ֠מוֹת בָּבֶ֤ל הָֽ/רְחָבָה֙ עַרְעֵ֣ר תִּתְעַרְעָ֔ר וּ/שְׁעָרֶ֥י/הָ הַ/גְּבֹהִ֖ים בָּ/אֵ֣שׁ יִצַּ֑תּוּ וְ/יִֽגְע֨וּ עַמִּ֧ים בְּ/דֵי רִ֛יק וּ/לְאֻמִּ֥ים בְּ/דֵי אֵ֖שׁ וְ/יָעֵֽפוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/058.yaml
  text: 'Thus says Yahweh of hosts: Babylon’s broad wall shall be utterly razed[a], and her high gates shall be burned with fire. Peoples labor for emptiness, and nations for the fire[b], and they grow weary.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: широкие стены Вавилона будут полностью разрушены[a], а его высокие ворота будут сожжены огнём. Народы будут трудиться ради пустоты, племена — ради огня[b] и изнемогут.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское глагольное выражение усилено и означает полное разрушение или разорение; применительно к городским стенам оно передано как «будут полностью разрушены». Существительное «стены» в еврейском тексте стоит во множественном числе, тогда как определение «широкая» — в единственном; возможно, множественное число обозначает укрепления как единое целое.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение «ради огня» эллиптично: оно может подразумевать, что плоды труда народов будут уничтожены огнём или послужат для него добычей.'
    reason: ambiguity
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יְהוָה как «Яхве», а צְבָאוֹת — широким по смыслу словом «Воинств», не ограничивая титул только земными армиями.
- source_word: חֹמוֹת בָּבֶל הָרְחָבָה
  choice: широкие стены Вавилона
  rationale: Существительное חֹמוֹת имеет форму множественного числа и обозначает укрепления Вавилона; русское множественное число естественно передаёт эту форму, несмотря на необычное согласование с прилагательным единственного числа в еврейском тексте.
- source_word: עַרְעֵר תִּתְעַרְעָר
  choice: будут до основания разрушены
  rationale: Инфинитив абсолютный при личной форме усиливает действие; корень буквально связан с обнажением или полным разорением, а в отношении стен контекстуально означает их полное разрушение.
- source_word: שְׁעָרֶיהָ הַגְּבֹהִים בָּאֵשׁ יִצַּתּוּ
  choice: его высокие ворота будут сожжены огнём
  rationale: Сохраняет образ высокого городского сооружения и прямое упоминание огня; местоимение согласовано в русском языке с названием города Вавилона.
- source_word: וְיִגְעוּ עַמִּים בְּדֵי רִיק
  choice: Народы трудятся ради пустоты
  rationale: Передаёт труд и изнурительное усилие, итогом которого оказывается пустота и тщета; настоящее время сохраняет обобщённо-пророческий характер заключения.
- source_word: וּלְאֻמִּים בְּדֵי אֵשׁ
  choice: племена — ради огня
  rationale: '«Племена» позволяет сохранить поэтическое различие между עַמִּים и לְאֻמִּים. Эллиптическое «ради огня» не устраняет образную неоднозначность: созданное их трудом обречено огню или становится его добычей.'
- source_word: וְיָעֵפוּ
  choice: и изнемогают
  rationale: Глагол обозначает усталость и истощение; «изнемогают» естественно завершает параллельное высказывание и передаёт результат бесплодного труда.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация «Яхве» сохраняет личное имя в исходном тексте и не заменяет его титулом; форма «Иегова» менее точно отражает общепринятую научную реконструкцию произношения.
- issue: Смысл труда народов «ради огня»
  choice: 'Сохранён эллиптический образ: «ради огня»'
  alternative: «лишь на то, чтобы всё стало добычей огня»; «как топливо для огня»
  rationale: Еврейское выражение кратко и образно. Развёрнутый перевод сделал бы явным одно толкование — что плоды труда будут сожжены, — тогда как исходный текст оставляет эту связь подразумеваемой.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксический параллелизм заключительных строк сохранён; архаизмы и конфессионально окрашенная замена имени יְהוָה избегаются.
