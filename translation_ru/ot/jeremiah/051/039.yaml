base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/039.yaml
  text: When they are heated, I will set out their drink and make them drunk, so that they may exult, then sleep an everlasting sleep and not wake up, declares Yahweh.
translation:
  language: ru
  text: Когда они разгорячатся, Я подам им питьё[a] и опьяню их, чтобы они ликовали и заснули вечным сном[b] и не пробудились, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устрою им пир» (מִשְׁתֵּיהֶם); еврейское слово может означать питьё либо пир с питьём.'
    reason: lexical_alternative
  - marker: b
    text: '«Вечный сон» — еврейский образ необратимой смерти под судом; буквально: «сон навек».'
    reason: cultural_note
lexical_decisions:
- source_word: בְּחֻמָּם
  choice: Когда они разгорячатся
  rationale: Предлог ב с существительным «жар» и суффиксом 3-го лица множественного числа имеет временно-обстоятельственный смысл. «Разгорячатся» естественно передаёт как возбуждение пирующих, так и возможный оттенок опьянения, не сводя образ к буквальной температуре.
- source_word: אָשִׁית אֶת מִשְׁתֵּיהֶם
  choice: Я подам им питьё
  rationale: שׂים означает «положить, поставить», а מִשְׁתֶּה — питьё либо пир с питьём. Русское «подам им питьё» естественно передаёт действие в контексте последующего опьянения.
- source_word: וְהִשְׁכַּרְתִּים
  choice: и опьяню их
  rationale: Каузативная порода от שׁכר означает «сделать пьяными». «Опьяню» сохраняет прямую роль говорящего и соответствует возвышенному пророческому регистру.
- source_word: לְמַעַן יַעֲלֹזוּ
  choice: чтобы они ликовали
  rationale: לְמַעַן выражает цель или результат, а עלז — бурную радость и ликование. Формулировка сохраняет ироническую силу мнимого веселья перед гибелью.
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  choice: а затем уснули вечным сном
  rationale: Буквальный образ — «уснут сном вечности/навек». «Вечным сном» сохраняет метафору необратимой смерти; «а затем» естественно обозначает последовательность связанных действий, подразумеваемую контекстом.
- source_word: וְלֹא יָקִיצוּ
  choice: и не пробудились
  rationale: Глагол קיץ означает пробуждаться. Совершенный вид после «чтобы» по-русски естественно выражает ожидаемый окончательный результат и сохраняет метафору сна.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Стандартная пророческая формула передана весомо и естественно; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон. «Яхве» сохраняет личное заветное имя и соответствует принятой в проекте передаче.
- issue: Смысл שְׁנַת עוֹלָם в контексте суда
  choice: вечным сном
  alternative: непробудным сном; смертью, от которой не пробудятся
  rationale: Сохранена метафора исходного текста, указывающая здесь на необратимую смерть, но не заменённая богословским толкованием о посмертном состоянии.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся ясным для широкого читателя; образность суда, опьянения и вечного сна сохранена без конфессионального уточнения.
