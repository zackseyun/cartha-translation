  text: Babylon also must fall for the slain of Israel[a], just as the slain of all the earth have fallen for Babylon.
translation:
  language: ru
  text: Также Вавилон падёт за убитых израильтян[a], как из-за Вавилона пали убитые по всей земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пал также Вавилон, вы, убитые израильтяне». Синтаксис первой части еврейского текста сжат и допускает несколько толкований.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: и; как
  rationale: Повтор частицы связывает две части стиха взаимным соответствием; по-русски оно естественно передано сочетанием «и… как…».
- source_word: בָּבֶל
  choice: Вавилон
  rationale: Традиционная русская форма названия.
- source_word: לִנְפֹּל
  choice: падёт
  rationale: Сжатая конструкция с инфинитивом описывает предстоящее падение Вавилона; будущее время естественно передаёт пророческий приговор, не добавляя модального «должен».
- source_word: חַלְלֵי יִשְׂרָאֵל
  choice: убитых израильтян
  rationale: חָלָל обозначает павших, прежде всего убитых войной или насилием; такая формулировка яснее современному читателю, чем буквальное «убитых Израиля».
- source_word: לְבָבֶל
  choice: из-за Вавилона
  rationale: Предлог ל здесь передаёт связь погибших с виной или действиями Вавилона; «из-за» ясно выражает причинное отношение.
- source_word: נָפְלוּ
  choice: пали
  rationale: Совершенный вид сохраняет образ падения погибших и соответствует завершённому действию еврейского перфекта.
- source_word: חַלְלֵי כָל הָאָרֶץ
  choice: убитые по всей земле
  rationale: Выражение понимается в широком, всемирном смысле; русский оборот передаёт множество жертв по всей земле естественнее, чем «убитые всей земли».
theological_decisions:
- issue: Синтаксис первой части стиха
  choice: Вавилон падёт в воздаяние за убитых израильтян
  alternative: «Пал и Вавилон, о убитые израильтяне»
  rationale: 'Синтаксис предельно сжат и допускает разные толкования. Основной текст следует параллелизму: как люди по всей земле пали из-за Вавилона, так Вавилон падёт за убитых израильтян; альтернативное прочтение отмечено в сноске.'
- issue: Объём значения הָאָרֶץ
  choice: вся земля, то есть широкий всемирный охват
  alternative: вся страна / вся эта земля
  rationale: Контекст суда над имперским Вавилоном и противопоставление Израиля множеству остальных жертв поддерживают широкий смысл, хотя само слово может обозначать и отдельную страну.
translation_notes:
  register: Современный литературный русский язык; сохранены поэтический параллелизм и образ падения. Формулировка торжественная, но понятная, без конфессионально окрашенной терминологии.
