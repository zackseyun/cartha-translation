  text: And with you I shattered horse and rider[c][b][a]; and with you I shattered chariot and rider.
translation:
  language: ru
  text: И тобою Я сокрушил коня и всадника; и тобою Я сокрушил колесницу и её возничего.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейскую форму можно понимать и как пророческое будущее: «сокрушу».'
    reason: temporal_ambiguity
  - marker: b
    text: 'Или: «разбил вдребезги»; еврейский глагол обозначает насильственное разбивание, раздробление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפַּצְתִּי
  choice: Я сокрушил
  rationale: Пиэль глагола נָפַץ передаёт сильный удар, разбивание или раздробление. «Сокрушил» сохраняет военную образность и естественно звучит в современном литературном русском; повтор передан одинаково.
- source_word: בְךָ
  choice: тобою
  rationale: Предлог בְּ здесь обозначает орудие действия. Творительный падеж естественно передаёт адресата как средство, тогда как действующим лицом остаётся говорящий — «Я».
- source_word: סוּס
  choice: коня
  rationale: Существительное означает «конь, лошадь». Военный контекст очевиден, но определения «боевой» в еврейском тексте нет.
- source_word: רֹכְבוֹ
  choice: всадника
  rationale: Причастная форма от רכב обозначает того, кто едет верхом. В сочетании с конём естественный русский эквивалент — «всадник».
- source_word: רֶכֶב
  choice: колесницу
  rationale: Слово может обозначать как отдельную колесницу, так и колесничное войско; форма единственного числа и параллельная конструкция здесь поддерживают конкретное «колесница».
- source_word: רֹכְבוֹ
  choice: того, кто ею правил
  rationale: Буквально это снова «тот, кто едет/управляет ею». Русское «всадник колесницы» неестественно, а «возница» несколько сужает значение; описательный оборот сохраняет более широкую семантику и связь местоименного суффикса с колесницей.
theological_decisions:
- issue: Адресат как орудие Божьего суда
  choice: «тобою Я сокрушил»
  alternative: «через тебя Я сокрушил» / «при твоей помощи Я сокрушил»
  rationale: Форма первого лица сохраняет Бога как действующего субъекта, а адресата — как орудие действия. Перевод не уточняет личность адресата сверх сказанного в непосредственном тексте.
- issue: Временная отнесённость форм נִפַּצְתִּי
  choice: прошедшее «сокрушил» с примечанием
  alternative: будущее «сокрушу»
  rationale: Еврейская завершённая форма формально допускает прошедшее представление действия, однако в пророческой последовательности может описывать грядущее как решённое. Основной текст следует явной форме, а примечание сохраняет контекстуальную возможность будущего.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. Инверсия «тобою Я» подчёркивает повторяющуюся инструментальную конструкцию оригинала. Во второй паре выбран естественный описательный оборот вместо неидиоматичного «всадник колесницы».
