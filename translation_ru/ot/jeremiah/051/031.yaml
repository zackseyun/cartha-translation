base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/031.yaml
  text: Runner runs to meet runner[a], and messenger to meet messenger[b], to tell the king of Babylon that his city has been captured from end to end.
translation:
  language: ru
  text: 'Гонец бежит навстречу гонцу[a],

    вестник — навстречу вестнику,

    чтобы сообщить царю Вавилона,

    что его город захвачен от края до края[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также можно передать: «Один бегущий бежит навстречу другому бегущему». Повтор однокоренных форм в еврейском тексте передаёт стремительность и непрерывную череду прибывающих гонцов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «захвачен с одного края». Еврейское выражение может указывать на захват, начавшийся с окраины, хотя в данном контексте, вероятно, подразумевается падение всего города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָץ / יָרוּץ
  choice: гонец бежит
  rationale: Сочетание причастия, употреблённого как существительное, с личной формой того же корня создаёт картину спешки. «Гонец бежит» сохраняет этот намеренный повтор смысла и звучит естественно по-русски.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Предлог выражает направленное движение к встрече; русское «навстречу» точно и естественно передаёт эту конструкцию.
- source_word: וּמַגִּיד ... מַגִּיד
  choice: вестник — навстречу вестнику
  rationale: מַגִּיד обозначает того, кто сообщает весть. «Вестник» сохраняет отличие от бегущего гонца в первой строке, а эллипсис воспроизводит параллелизм еврейского текста.
- source_word: לְהַגִּיד
  choice: чтобы сообщить
  rationale: Инфинитив цели указывает, зачем гонцы и вестники сходятся; «сообщить» уместно для официального известия царю.
- source_word: לְמֶלֶךְ בָּבֶל
  choice: царю Вавилона
  rationale: Прямая и естественная передача еврейской генитивной конструкции без добавочного толкования.
- source_word: נִלְכְּדָה
  choice: захвачен
  rationale: 'Нифаль глагола לכד выражает пассивное действие: город взят или захвачен.'
- source_word: עִירוֹ
  choice: его город
  rationale: Сохранён явно выраженный местоименный суффикс третьего лица; слово «столица» не добавляется, поскольку его нет в тексте.
- source_word: מִקָּצֶה
  choice: от края до края
  rationale: Буквально выражение начинается с «от края», но в данном контексте естественно указывает на охват всего города. Основной текст передаёт вероятный общий смысл, а формальная возможность отмечена в сноске.
