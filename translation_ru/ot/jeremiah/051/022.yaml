  text: And with you I will shatter man and woman; and with you I will shatter old man and youth; and with you I will shatter young man and virgin.
translation:
  language: ru
  text: Тобою Я сокрушу мужчину и женщину; тобою сокрушу старика и юношу; тобою сокрушу молодого мужчину и девственницу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִפַּצְתִּי בְךָ
  choice: Тобой Я сокрушу
  rationale: 'Глагол נפץ выражает сильное разбивание или сокрушение, а בְךָ обозначает орудие действия: «тобой». Повтор сохранён для передачи риторической структуры.'
- source_word: אִישׁ וְאִשָּׁה
  choice: мужчину и женщину
  rationale: Прямая и естественная передача парного обозначения полов.
- source_word: זָקֵן וָנָעַר
  choice: старика и юношу
  rationale: Сохраняется возрастной контраст между пожилым человеком и юношей; נַעַר в этом ряду естественно передать как «юноша».
- source_word: בָּחוּר וּבְתוּלָה
  choice: молодого человека и девушку
  rationale: בָּחוּר обозначает молодого мужчину, обычно в расцвете сил; בְּתוּלָה — молодую незамужнюю женщину, часто девственницу. В данном параллельном перечне выбраны естественные русские возрастно-половые обозначения без добавления неявного акцента на семейном положении.
theological_decisions:
- issue: Кто действует и что означает «тобой»
  choice: Сохранить первое лицо Бога и инструментальное «тобой»
  alternative: Перестроить как «среди тебя» или назвать действующее лицо существительным
  rationale: Еврейская конструкция прямо представляет адресата предыдущего контекста как орудие, посредством которого говорящий сокрушает перечисленные группы; субъект выражен формой глагола первого лица.
translation_notes:
  register: Современный литературный русский с торжественной ритмикой. Трёхкратный повтор «тобой сокрушу» сохранён, при первом употреблении местоимение «Я» добавлено для ясности русского синтаксиса; прописная буква отражает божественного говорящего.
