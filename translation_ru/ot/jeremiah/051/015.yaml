id: JER.51.15
reference: Jeremiah 51:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/015.yaml
  text: He made the earth by his power[a], he established the world by his wisdom, and by his understanding he stretched out the heavens.
translation:
  language: ru
  text: Он сотворил землю Своей силой, утвердил мир[a] Своей мудростью и Своим разумом распростёр небеса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обитаемый мир».'
    reason: Лексическая альтернатива для תֵּבֵל, которое может особо обозначать обитаемый, упорядоченный мир.
lexical_decisions:
- source_word: עֹשֵׂה
  choice: сотворил
  rationale: Причастие может обозначать как действие, так и действующего, однако в этой поэтической формуле творения естественный русский прошедший вид согласует первую строку с последующим נָטָה. Глагол «сотворил» ясно передаёт созидательный контекст и сохраняет возвышенный, но современный регистр.
- source_word: אֶרֶץ
  choice: землю
  rationale: Космический контекст и параллель с небесами требуют значения «земля», а не «страна».
- source_word: בְּכֹחוֹ
  choice: Своей силой
  rationale: Предлог ב имеет инструментальное значение; русское творительное без предлога звучит естественно. «Сила» прямо передаёт כֹּחַ.
- source_word: מֵכִין
  choice: утвердил
  rationale: Hiphil от כון выражает установление и придание устойчивости. «Утвердил» сохраняет этот оттенок и поэтическую ёмкость.
- source_word: תֵּבֵל
  choice: мир
  rationale: Слово обозначает упорядоченный, нередко обитаемый мир. «Мир» естественнее в основном тексте, а более явный оттенок обитаемости отмечен в сноске.
- source_word: בְּחָכְמָתוֹ
  choice: Своей мудростью
  rationale: Творительный падеж передаёт инструментальное ב, а «мудрость» является прямым и контекстуально точным соответствием חָכְמָה.
- source_word: וּבִתְבוּנָתוֹ
  choice: и Своим разумом
  rationale: «Разум» сохраняет отличие תְּבוּנָה от предшествующей «мудрости» и естественно обозначает способность понимать и постигать.
- source_word: נָטָה
  choice: распростёр
  rationale: В повествованиях о творении נטה описывает развёртывание или простирание небес. «Распростёр» точно и достойно передаёт образ, не будучи непонятным современному читателю.
- source_word: שָׁמָיִם
  choice: небеса
  rationale: Форма и космический контекст поддерживают множественное «небеса», а не более узкое «небо» в значении видимого небосвода.
theological_decisions:
- issue: Видо-временная передача двух еврейских причастий и последующего перфекта в формуле творения
  choice: 'Все три действия переданы глаголами совершенного вида в прошедшем времени: «сотворил… утвердил… распростёр».'
  alternative: 'Передать причастия настоящим временем: «творит… утверждает…», сохранив затем прошедшее «распростёр», либо истолковать их как наименования Творца.'
  rationale: Еврейские причастия допускают настоящее, обычное или характеризующее действие, но в параллельной поэтической формуле вместе с перфектом נָטָה они естественно описывают Божьи деяния творения. Прошедшее время создаёт связную русскую строку, не добавляя отдельного богословского утверждения; исходная аспектуальная возможность отмечена в решении, а не искусственно внесена в текст.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической интонацией. Порядок слов слегка торжественный, но понятный; местоименные формы с прописной буквы следуют принятому русскому библейскому оформлению. Сноска поставлена непосредственно после слова «мир», к которому относится лексическая альтернатива.
