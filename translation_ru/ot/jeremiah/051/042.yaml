  text: The sea has come up against Babylon[b][a]; she is covered with the multitude of its waves.
translation:
  language: ru
  text: Море нахлынуло на Вавилон; он покрыт множеством его волн.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Море» здесь служит образом неудержимой силы, обрушившейся на Вавилон; метафора оригинала сохранена без замены её толкованием.
    reason: cultural_note
  - marker: b
    text: 'Или: «шумом его волн». Еврейское слово может означать как множество, так и шум, гул или грохот.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עַל
  choice: поднялось на
  rationale: Сочетание передаёт движение моря на Вавилон и сохраняет образ надвигающейся, захлёстывающей силы; предлог «на» естественно выражает здесь враждебную направленность.
- source_word: בָּבֶל
  choice: Вавилон
  rationale: Устоявшееся русское название города; мужской род позволяет естественно передать согласование последующего сказуемого по смыслу русского топонима.
- source_word: הַיָּם
  choice: море
  rationale: Сохранена определённая и метафорическая образность еврейского текста без замены моря истолкованием как войска или иной враждебной силы.
- source_word: בַּהֲמוֹן
  choice: множеством
  rationale: Слово הָמוֹן допускает значения множества, массы, шума и грохота. В сочетании с волнами «множеством» подчёркивает их подавляющее обилие, не исключая альтернативного слухового оттенка.
- source_word: גַּלָּיו
  choice: его волн
  rationale: Местоименный суффикс мужского рода относится к слову «море»; по-русски местоимение «его» грамматически соответствует среднему роду и ясно указывает на море.
- source_word: נִכְסָתָה
  choice: он покрыт
  rationale: 'Нифаль перфекта означает состояние, возникшее в результате покрытия. В еврейском форма женского рода согласована с названием Вавилона, тогда как в русском естественно согласование мужского рода: «Вавилон… он покрыт».'
theological_decisions:
- issue: Образ моря как силы суда над Вавилоном
  choice: Сохранить метафору «море» в основном тексте
  alternative: Передать как «войско» или «вражеская сила»
  rationale: Сам стих не называет референт метафоры прямо; её истолкование в основном тексте неоправданно устранило бы образность и смысловую открытость оригинала.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Повтор местоимений сохранён ради ясности образа; архаизмы и конфессионально окрашенные толкования не используются.
