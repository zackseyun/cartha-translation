base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/041.yaml
  text: How Sheshak has been captured[c][b][a], and the praise of the whole earth seized! How Babylon has become a desolation among the nations!
translation:
  language: ru
  text: Как захвачен Шешах[a] и взята хвала всей земли[b]! Как Вавилон стал ужасом[c] среди народов!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шешах обычно понимают как зашифрованное название Вавилона.
    reason: alternative_reading
  - marker: b
    text: 'Или: «слава всей земли»; возможно также: «предмет гордости всей земли».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «опустошением». Еврейское слово может обозначать как разорение, так и ужас, который оно вызывает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Как
  rationale: Вводит риторическое восклицание, выражающее потрясение, а не вопрос об образе действия.
- source_word: נִלְכְּדָה
  choice: захвачен
  rationale: Нифаль перфекта от לכד означает, что город был взят или захвачен; краткая форма естественна в русском восклицании.
- source_word: שֵׁשַׁךְ
  choice: Шешах
  rationale: Сохраняет данное в еврейском тексте имя; его традиционное понимание как шифрованного названия Вавилона вынесено в примечание.
- source_word: וַתִּתָּפֵשׂ
  choice: взята
  rationale: Глагол תפשׂ передаёт захват; «взята» естественно образует поэтический параллелизм с «захвачен», не добавляя толкования.
- source_word: תְּהִלַּת כָּל הָאָרֶץ
  choice: хвала всей земли
  rationale: 'Формально сохраняет основное значение תְּהִלָּה — «хвала», оставляя открытым также метонимический смысл: предмет славы или похвалы.'
- source_word: הָיְתָה לְשַׁמָּה
  choice: стал ужасом
  rationale: שַׁמָּה может обозначать опустошение, а также ужас и потрясение, вызываемые им; «стал ужасом» сохраняет эту смысловую напряжённость.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם здесь обозначает народы или нации вообще; «народы» естественно и не привносит позднейшего конфессионального оттенка.
