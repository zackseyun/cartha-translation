base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/014.yaml
  text: 'Yahweh of hosts has sworn by himself: Surely I will fill you with men[a], like locusts[c][b], and they will raise over you a shout.'
translation:
  language: ru
  text: 'Яхве Воинств поклялся самим собой[a]: «Непременно Я наполню тебя людьми, словно саранчой[b], и они поднимут над тобой клич[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «своей душой»; возможен также перевод: «своей жизнью». Это древнееврейская формула клятвы, означающая, что Он клянётся самим собой.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «словно молодой саранчой» или «словно полчищем саранчи».'
    reason: lexical_alternative
  - marker: c
    text: Здесь, вероятно, имеется в виду боевой или победный клич, поднятый над Вавилоном; само слово также употреблялось для громких возгласов при сборе урожая.
    reason: cultural_note
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: поклялся
  rationale: Нифаль глагола שׁבע обозначает принесение клятвы; прошедшее совершенного вида естественно передаёт уже данную клятву, сохраняющую силу.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יהוה и сохраняет широту титула צְבָאוֹת, который может относиться как к небесным, так и к земным воинствам.
- source_word: בְּנַפְשׁוֹ
  choice: самим собой
  rationale: Буквально «своей nephesh», но в формуле клятвы выражение означает, что Яхве клянётся собственной личностью или жизнью; по-русски естественно «самим собой».
- source_word: כִּי אִם
  choice: непременно
  rationale: В контексте клятвы сочетание имеет усилительно-утвердительное, а не условное значение.
- source_word: מִלֵּאתִיךְ
  choice: Я наполню тебя
  rationale: Форма обращена к существительному женского рода — Вавилону как городу; в содержании клятвы глагол имеет будущее пророческое значение.
- source_word: אָדָם
  choice: людьми
  rationale: Собирательное существительное обозначает множество людей, здесь — нападающих; творительный падеж обусловлен русским управлением глагола «наполнить».
- source_word: כַּיֶּלֶק
  choice: словно саранчой
  rationale: ילק обозначает саранчу либо один из её видов или этапов развития; собирательное «саранча» естественно передаёт образ бесчисленного полчища.
- source_word: וְעָנוּ ... הֵידָד
  choice: они поднимут ... клич
  rationale: В данном сочетании ענה относится к громкому возгласу, а הֵידָד обозначает крик, возможный как при битве и победе, так и при работе давильщиков; нейтральное «клич» не устраняет контекстуальную многозначность.
theological_decisions:
- issue: Формула божественной клятвы
  choice: Яхве Воинств поклялся самим собой
  alternative: Яхве Воинств поклялся своей жизнью
  rationale: Выбор передаёт идиоматический смысл בְּנַפְשׁוֹ как самоудостоверение клятвы, не превращая nephesh в отдельную составную часть Бога и не добавляя догматического толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Личное имя יהוה передано как «Яхве», а титул צְבָאוֹת — краткой формой «Воинств». Сохранены образ саранчи и некоторая смысловая широта слова הֵידָד; пояснения вынесены в сноски.
