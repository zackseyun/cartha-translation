  text: And the slain will fall in the land of the Chaldeans[b][a], and the pierced in her streets.
translation:
  language: ru
  text: И падут убитые в земле халдеев[a], и пронзённые — на её улицах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Халдее» или «в земле вавилонян». Буквально в еврейском тексте: «в земле халдеев».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на её площадях» или «на её открытых местах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָפְלוּ
  choice: И падут
  rationale: Форма перфекта с союзом в контексте пророческого возвещения передаёт объявленный исход суда; будущее время естественно выражает это по-русски.
- source_word: חֲלָלִים
  choice: убитые
  rationale: Слово обозначает убитых или смертельно поражённых; «убитые» сохраняет собирательный смысл и звучит естественно.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: в земле халдеев
  rationale: Перевод сохраняет прямо названный в еврейском тексте этноним «халдеи», не заменяя его более толковательным «вавилоняне».
- source_word: וּמְדֻקָּרִים
  choice: и пронзённые
  rationale: Пассивная форма от דקר указывает на людей, пронзённых оружием; «пронзённые» сохраняет яркость образа и параллель с «убитыми».
- source_word: בְּחוּצוֹתֶיהָ
  choice: на её улицах
  rationale: חוּצוֹת может обозначать улицы, площади или открытые общественные места. «На её улицах» — наиболее естественный вариант в данном контексте; местоимение женского рода сохраняет олицетворение страны или города.
