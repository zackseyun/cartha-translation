  source_fidelity: 'В еврейском тексте בָּאוּ ... עַל буквально означает «пришли на/против», а не «вошли в». Контекст враждебного вторжения позволяет передать это как «выступили против»; такая формулировка не утверждает проникновение внутрь святынь, которого данный предлог прямо не выражает. Остальные соответствия точны: «пристыжены», «поношение», «позор», множественное «святыни» и «дома ГОСПОДА».'
