  text: בֹּ֚שְׁנוּ כִּֽי שָׁמַ֣עְנוּ חֶרְפָּ֔ה כִּסְּתָ֥ה כְלִמָּ֖ה פָּנֵ֑י/נוּ כִּ֚י בָּ֣אוּ זָרִ֔ים עַֽל מִקְדְּשֵׁ֖י בֵּ֥ית יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/051.yaml
  text: We are ashamed, for we have heard reproach; disgrace has covered our faces, for foreigners have come against the holy places of the house of the LORD.
translation:
  language: ru
  text: Мы пристыжены, потому что услышали поношение; позор покрыл наши лица, потому что чужеземцы выступили против святынь дома ГОСПОДА.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּשְׁנוּ
  choice: Мы пристыжены
  rationale: Форма выражает переживаемый стыд; этот вариант естественно передаёт состояние говорящих и сохраняет связь с последующим «позор покрыл наши лица».
- source_word: חֶרְפָּה
  choice: поношение
  rationale: Передаёт публичное оскорбление и бесчестье, о котором услышали говорящие.
- source_word: כְלִמָּה
  choice: позор
  rationale: Современное и ясное обозначение унижения; не дублирует дословно предыдущее существительное.
- source_word: זָרִים
  choice: чужеземцы
  rationale: В данном контексте речь идёт о людях извне, вторгшихся в храмовые святыни; «чужеземцы» естественно передаёт это значение.
- source_word: בָּאוּ ... עַל
  choice: вошли в
  rationale: Хотя עַל обычно означает «на/против», с глаголом движения и объектом святилища здесь контекстуально указывает на вторжение в священное пространство.
- source_word: מִקְדְּשֵׁי
  choice: святыни
  rationale: Множественное число сохранено и может обозначать священные помещения или части храмового комплекса без ненужного уточнения.
- source_word: יְהוָה
  choice: ГОСПОДА
  rationale: Традиционная русская передача тетраграмматона прописными буквами, отличающая Божье имя от обычного титула.
theological_decisions:
- issue: Направление вторжения чужеземцев по отношению к храмовым святыням
  choice: вошли в святыни
  alternative: пришли против святынь
  rationale: Еврейское בָּאוּ ... עַל допускает буквальное «пришли на/против», но контекст осквернения храма лучше и естественнее передаётся как проникновение чужеземцев внутрь священных мест. Догматического уточнения сверх текста не добавлено.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Сохранены параллелизм, коллективное первое лицо и множественное число «святыни».
