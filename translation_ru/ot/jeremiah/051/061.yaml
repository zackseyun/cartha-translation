  yaml_path: translation/ot/jeremiah/051/061.yaml
  text: And Jeremiah said to Seraiah[a], “When you come to Babylon, see that you read all these words.”
translation:
  language: ru
  text: 'И сказал Иеремия Сераии: «Когда придёшь в Вавилон, проследи, чтобы прочитал все эти слова».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и увидишь, и прочитаешь все эти слова». В данном контексте «увидишь», вероятно, означает «проследи» или «позаботься».'
    reason: Сохраняет буквальную последовательность двух еврейских глаголов и отмечает вероятное идиоматическое значение первого.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная повествовательная форма; «и сказал» сохраняет связь с предшествующим рассказом без лишнего уточнения времени.
- source_word: יִרְמְיָהוּ
  choice: Иеремия
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: אֶל שְׂרָיָה
  choice: Сераии
  rationale: Предлог указывает адресата; имя передано в принятой русской библейской форме и поставлено в дательном падеже.
- source_word: כְּבֹאֲךָ בָבֶל
  choice: Когда придёшь в Вавилон
  rationale: Конструкция с инфинитивом בוא выражает время; форма второго лица мужского рода естественно передана русским будущим временем.
- source_word: וְרָאִיתָ
  choice: проследи, чтобы
  rationale: 'Буквально «и увидишь», однако в данном контексте глагол, вероятно, имеет побудительное значение: позаботиться о выполнении следующего действия.'
- source_word: וְקָרָאתָ
  choice: ты прочитал
  rationale: קרא в контексте письменного свитка означает прочитать, вероятно вслух; формулировка после «проследи, чтобы» естественно передаёт побуждение.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: В контексте записанного пророчества דְּבָרִים обозначает именно слова текста, а не вещи или дела.
