base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/036.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to plead your case and take vengeance for you[c][b]; I will dry up her sea and make her spring dry.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве: «Вот, Я вступлюсь за тебя в твоей тяжбе[a] и отомщу за тебя; Я иссушу её море и высушу её источник[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду вести твою тяжбу»; в еврейском тексте употреблена судебная идиома.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «её родник» либо «её водный источник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего контекста ясным современным союзным словом.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет традиционную пророческую формулу и передаёт личное имя יהוה как «Яхве».
- source_word: הִנְנִי
  choice: Вот, Я буду
  rationale: «Вот» сохраняет дейктическую и торжественную силу формулы; будущее время естественно передаёт предстоящее действие в данном контексте, не усиливая его оборотом «вот-вот».
- source_word: רָב אֶת רִיבֵךְ
  choice: вести твою тяжбу
  rationale: Сохраняет судебно-спорный образ однокоренной конструкции ריב, оставаясь понятным по-русски.
- source_word: וְנִקַּמְתִּי אֶת נִקְמָתֵךְ
  choice: и отомщу за тебя
  rationale: Естественно передаёт однокоренную усилительную конструкцию и смысл возмездия в защиту адресата.
- source_word: וְהַחֲרַבְתִּי אֶת יַמָּהּ
  choice: Я иссушу её море
  rationale: При водном объекте חרב означает лишение воды; женское местоимение сохраняет олицетворение Вавилона.
- source_word: וְהֹבַשְׁתִּי אֶת מְקוֹרָהּ
  choice: и высушу её источник
  rationale: Каузатив יבש передан глаголом «высушу», а מקור — широким словом «источник», допускающим как родник, так и источник вод.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо содержит Тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Характер Божьего действия в выражениях ריב и נקם
  choice: судебное заступничество и возмездие за адресата
  alternative: общее участие в споре и личная месть
  rationale: Юридическая идиома «вести тяжбу» и формула возмездия представлены без сведения их к частной человеческой мести и без добавления конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Женские местоимения относятся к олицетворённому Вавилону. Синтаксический параллелизм двух заключительных действий сохранён.
