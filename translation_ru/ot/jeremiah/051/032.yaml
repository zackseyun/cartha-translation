lexical_decisions:
- source_word: הַמַּעְבָּרוֹת
  choice: переправы
  rationale: מַעְבָּר обозначает место перехода или переправы; в военном контексте речь, вероятно, о стратегических переправах вокруг Вавилона. Русское «переправы» естественно и не сужает значение до бродов.
- source_word: נִתְפָּשׂוּ
  choice: захвачены
  rationale: Нифаль от תפש передаёт пассивное значение взятия или захвата; краткая форма сохраняет результативность сообщения.
- source_word: הָאֲגַמִּים
  choice: болота
  rationale: אֲגַמִּים может обозначать болотистые водоёмы, заводи или заболоченные места. «Болота» соответствует географии Вавилонии и допускает горение болотной растительности, не сводя существительное только к камышу.
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: сожжены огнём
  rationale: В еврейском тексте стоит активная форма неопределённого множественного лица — буквально «сожгли огнём». Русская безлично-пассивная передача естественно продолжает ряд донесений и сохраняет явное בָאֵשׁ «огнём».
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: воины
  rationale: Буквально «люди войны»; «воины» кратко и естественно передаёт обозначение мужчин, участвующих в бою, без тяжеловесного калькирования.
- source_word: נִבְהָלוּ
  choice: охвачены ужасом
  rationale: Нифаль בהל выражает сильную тревогу, смятение или ужас. Оборот «охвачены ужасом» передаёт интенсивность и хорошо звучит в современном литературном русском.
