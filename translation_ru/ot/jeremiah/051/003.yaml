base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/003.yaml
  text: Let not the archer bend his bow[a], and let him not rise up in his armor. Do not spare her young men[c][b]; devote all her army to destruction.
translation:
  language: ru
  text: Пусть лучник не натягивает свой лук[a] и не поднимается в своём панцире[b]. Не щадите её юношей; предайте заклятию всё её войско[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало еврейского текста трудно и содержит повтор. Возможно иное членение, при котором первое слово понимается как «против»: «Против натягивающего лук...»; дальнейший синтаксис остаётся неясным. При запретительном понимании: «Пусть лучник не готовит свой лук к стрельбе».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в своей кольчуге»; еврейское слово обозначает защитный доспех для туловища, вероятно панцирь или кольчугу.'
    reason: lexical_alternative
  - marker: c
    text: Еврейский глагол означает «предать заклятию» — безвозвратно предназначить уничтожению в контексте Божьего суда.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל / וְאֶל / וְאַל
  choice: пусть не / не / не
  rationale: В основном тексте первые две частицы поняты как запретительные формы, параллельные бесспорному וְאַל далее в стихе. Различие между написанием אֶל и ожидаемым אַל отражено в примечании [a].
- source_word: יִדְרֹךְ ... הַדֹּרֵךְ קַשְׁתּוֹ
  choice: лучник не натягивает свой лук
  rationale: Сочетание דרך с קשת означает натянуть, то есть подготовить лук к стрельбе. Существительное «лучник» естественно передаёт субстантивированное причастие; трудность и повторяемость еврейского чтения отмечены в примечании.
- source_word: יִתְעַל
  choice: встаёт
  rationale: Форма породы хитпаэль от עלה передаёт поднятие или приведение себя в готовность. «Встаёт» сохраняет образ без добавления не выраженного прямо значения нападения.
- source_word: בְּסִרְיֹנוֹ
  choice: в своём панцире
  rationale: סִרְיוֹן обозначает защитный доспех для туловища, вероятно чешуйчатый панцирь или подобный ему доспех. «Панцирь» конкретнее общего слова «доспехи», но не требует понимать предмет именно как кольчугу.
- source_word: תַּחְמְלוּ
  choice: не щадите
  rationale: В военном контексте חמל означает пощадить, проявив жалость. Русское «не щадите» прямо и естественно передаёт силу повеления.
- source_word: בַּחֻרֶיהָ
  choice: её юношей
  rationale: בָּחוּר обычно обозначает молодого мужчину в расцвете сил; военное значение следует из контекста и не нуждается во вставке слова «воины».
- source_word: הַחֲרִימוּ
  choice: предайте заклятию
  rationale: Хифиль от חרם означает наложить заклятие, тем самым безвозвратно предназначив людей или имущество уничтожению. Выбранная формулировка сохраняет особый смысл термина, а примечание разъясняет его практическое следствие.
- source_word: כָּל צְבָאָהּ
  choice: всё её войско
  rationale: צָבָא здесь обозначает совокупность военных сил. «Войско» — ясный и стилистически уместный современный эквивалент.
theological_decisions:
- issue: Передача терминологии חרם в пророчестве о суде
  choice: предайте заклятию всё её войско
  alternative: полностью уничтожьте всё её войско; обреките всё её войско на уничтожение
  rationale: «Предайте заклятию» сохраняет связь уничтожения с особым, безвозвратным посвящением Божьему суду, не сводя חרם к обычному военному разгрому. Примечание объясняет термин, не добавляя конфессионального толкования.
- issue: Неоднозначность первых повелительных конструкций
  choice: запрет лучнику натягивать лук и вставать в панцире
  alternative: повеление лучнику выступить против того, кто натягивает лук и встаёт в панцире
  rationale: Вокализация אֶל допускает предлог «против», а повтор формы דרך поддерживает альтернативный синтаксический разбор. Однако параллелизм с וְאַל и традиционное понимание чтения позволяют дать запрет в основном тексте; подлинная неоднозначность сохранена в примечании [a].
translation_notes:
  register: Современный литературный русский язык с краткими, суровыми военными повелениями. Формы «панцирь» и «предать заклятию» сохраняют историко-библейский колорит, оставаясь понятными благодаря примечаниям. Местоименная отсылка «её» сохраняет персонификацию Вавилона из контекста.
