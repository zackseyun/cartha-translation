  yaml_path: translation/ot/jeremiah/051/010.yaml
  text: Yahweh has brought forth our vindication. Come[a], and let us recount in Zion the work of Yahweh our God.
translation:
  language: ru
  text: Яхве явил нашу правоту[a]. Придите, давайте расскажем на Сионе о деянии Яхве, нашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши праведные дела», «нашу справедливость» или «наше оправдание». Еврейское слово во множественном числе может обозначать праведные поступки, проявления справедливости или публичное подтверждение правоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: явил
  rationale: Каузативная форма от יצא буквально передаёт выведение наружу; в данном контексте речь о том, что Яхве сделал правоту своего народа явной и публично её подтвердил.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет различие между именем и титулом.
- source_word: צִדְקֹתֵינוּ
  choice: нашу правоту
  rationale: Форма множественного числа может обозначать праведные дела, проявления справедливости или подтверждение правоты. В контексте суда над Вавилоном естественнее всего говорится о публично подтверждённой правоте народа; русское единственное число здесь идиоматично.
- source_word: בֹּאוּ
  choice: Придите
  rationale: Повелительное наклонение множественного числа передаёт обращённое к группе приглашение присоединиться.
- source_word: וּנְסַפְּרָה
  choice: и возвестим
  rationale: 'Когортатив выражает совместное побуждение: «давайте расскажем/возвестим». «Возвестим» естественно сочетается с публичным свидетельством на Сионе.'
- source_word: בְצִיּוֹן
  choice: на Сионе
  rationale: Для обозначения города или священного места современная русская библейская речь естественно употребляет «на Сионе».
- source_word: מַעֲשֵׂה
  choice: о деянии
  rationale: Существительное в единственном числе обозначает дело или действие. «Деяние» сохраняет собирательную широту и торжественный регистр.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Стандартная передача формы с местоименным суффиксом сохраняет указание на отношения Бога с его народом.
theological_decisions:
- issue: Значение צִדְקֹתֵינוּ в контексте
  choice: нашу правоту
  alternative: наши праведные дела; нашу справедливость; наше оправдание
  rationale: Контекст падения Вавилона указывает на публичное подтверждение правого дела Божьего народа, а не однозначно на его нравственные заслуги. Основной текст передаёт этот судебно-публичный оттенок, а сноска сохраняет реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Формулировка избегает как тяжеловесного буквализма «вывел наши праведности», так и полного устранения смыслового напряжения; неоднозначность отражена в сноске.
