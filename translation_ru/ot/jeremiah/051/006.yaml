  to: Бегите из Вавилона, пусть каждый спасает свою жизнь! Не погибните в беззаконии Вавилона[a], ведь настало время возмездия Яхве; Он воздаёт Вавилону по заслугам.
  rationale: Заменено «за его беззаконие» на «в беззаконии Вавилона», чтобы не сводить неоднозначное еврейское сочетание к одной лишь причинности и не скрывать отсылку к персонифицированному Вавилону за русским мужским местоимением. Примечание уточнено так, чтобы прямо отражать две основные возможности смысла, не выдавая ни одну из них за единственно верную.
