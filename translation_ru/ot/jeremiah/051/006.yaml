source:
  edition: WLC
  text: נֻ֣סוּ מִ/תּ֣וֹךְ בָּבֶ֗ל וּ/מַלְּטוּ֙ אִ֣ישׁ נַפְשׁ֔/וֹ אַל תִּדַּ֖מּוּ בַּ/עֲוֺנָ֑/הּ כִּי֩ עֵ֨ת נְקָמָ֥ה הִיא֙ לַֽ/יהוָ֔ה גְּמ֕וּל ה֥וּא מְשַׁלֵּ֖ם לָֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/006.yaml
  text: Flee from the midst of Babylon[a], and let each man save his life. Do not be cut off in her iniquity, for this is the time of Yahweh's vengeance; he is repaying her what she deserves.
translation:
  language: ru
  text: Бегите из Вавилона, пусть каждый спасает свою жизнь! Не погибните в беззаконии Вавилона[a], ведь настало время возмездия Яхве; Он воздаёт Вавилону по заслугам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «не погибните вместе с Вавилоном в его вине» или «не будьте уничтожены из-за беззакония Вавилона». Еврейское выражение может указывать как на причастность к беззаконию Вавилона, так и на суд, постигающий его за это беззаконие.'
    reason: 'Лексическая и синтаксическая неоднозначность сочетания בַּעֲוֺנָהּ: עָוֹן может означать беззаконие, вину или наказание за вину, а предлог ב допускает несколько смысловых отношений.'
lexical_decisions:
- source_word: נֻסוּ מִתּוֹךְ בָּבֶל
  choice: Бегите из Вавилона
  rationale: Повелительное נֻסוּ передаёт срочный призыв бежать. מִתּוֹךְ указывает на выход изнутри Вавилона; по-русски это естественно выражается сочетанием «из Вавилона» без тяжеловесного «из среды».
- source_word: וּמַלְּטוּ אִישׁ נַפְשׁוֹ
  choice: пусть каждый спасает свою жизнь
  rationale: Еврейская идиома буквально говорит о спасении своей נֶפֶשׁ; в данном контексте речь идёт о сохранении жизни. «Каждый» естественно передаёт распределительное אִישׁ.
- source_word: אַל תִּדַּמּוּ
  choice: не погибните
  rationale: Нифаль глагола דמה в контексте суда означает быть уничтоженными, погибнуть. Русское «не погибните» ясно и естественно сохраняет пассивный результат угрозы.
- source_word: בַּעֲוֺנָהּ
  choice: за его беззаконие
  rationale: עָוֹן охватывает беззаконие, вину и последующее наказание, а предлог ב допускает связь как с участием в грехе, так и с гибелью вследствие него. Основной текст выражает судебную причинность, а примечание сохраняет неоднозначность.
- source_word: עֵת נְקָמָה הִיא לַיהוָה
  choice: настало время возмездия Яхве
  rationale: Конструкция обозначает назначенное время принадлежащего Яхве карательного воздаяния. «Возмездие» в современном русском передаёт справедливую ретрибуцию точнее, чем эмоционально окрашенное «месть».
- source_word: גְּמוּל הוּא מְשַׁלֵּם לָהּ
  choice: Он воздаёт Вавилону по заслугам
  rationale: Сочетание существительного גְּמוּל с причастием מְשַׁלֵּם выражает заслуженное ответное воздаяние. Идиома «воздаёт по заслугам» избегает неестественного повтора и сохраняет смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное заветное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем Бога и титулом «Господь».
- issue: Характер נְקָמָה
  choice: возмездие
  alternative: месть
  rationale: В контексте пророческого суда речь идёт о Божьем справедливом воздаянии Вавилону; «возмездие» передаёт это, не привнося представления о мелочной или личной мстительности.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Грамматический род местоимений согласован с русским словом «Вавилон» (мужской), хотя в еврейском соответствующий суффикс женского рода относится к олицетворённому Вавилону. Пунктуация сохраняет стремительность призыва и затем подчёркивает основание грядущего суда.
