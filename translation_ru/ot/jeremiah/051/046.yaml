base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/046.yaml
  text: And do not let your heart grow faint[a], and do not fear the report heard in the land; a report will come in one year, and after it in the next year another report, and violence in the land[c][b], ruler against ruler.
translation:
  language: ru
  text: 'Пусть же сердце ваше не ослабеет[a], и не бойтесь вести[b], что разнесётся по стране: в один год придёт весть, а вслед за ней в следующий год — другая весть; в стране будет насилие, правитель — против правителя[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как бы сердце ваше не стало мягким». Это выражение означает потерять мужество, пасть духом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слуха», «известия». Еврейское слово שְׁמוּעָה обозначает распространяющуюся весть, независимо от того, подтверждена она или нет.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «правитель над правителем». Еврейское выражение может описывать борьбу правителей, господство одного над другим либо быструю смену власти.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפֶן
  choice: Пусть же ... не
  rationale: Частица פן вводит предостережение со значением «как бы не; чтобы не». В русском прямое отрицательное пожелание-предостережение естественно передаёт её силу и распространяется также на следующее «не бойтесь».
- source_word: יֵרַךְ לְבַבְכֶם
  choice: сердце ваше не ослабеет
  rationale: רכך буквально означает «становиться мягким, слабым»; в сочетании с «сердцем» речь идёт об утрате мужества. Формулировка сохраняет образ и понятна современному читателю.
- source_word: וְתִירְאוּ
  choice: и не бойтесь
  rationale: Глагол ירא в породе qal означает «бояться». Отрицательная предупредительная сила начального פן относится и к этому глаголу.
- source_word: בַּשְּׁמוּעָה הַנִּשְׁמַעַת בָּאָרֶץ
  choice: вести, которая будет слышна в стране
  rationale: שְׁמוּעָה охватывает значения «весть, известие, слух» и не указывает само по себе, достоверна ли информация. Причастие נשׁמעת сохранено через «будет слышна».
- source_word: וּבָא בַשָּׁנָה הַשְּׁמוּעָה
  choice: в один год придёт весть
  rationale: Необычная конструкция буквально говорит о приходе вести «в году». «В один год» естественно вводит последовательность повторяющихся тревожных известий, не привязывая её к конкретному календарному году.
- source_word: וְאַחֲרָיו בַּשָּׁנָה הַשְּׁמוּעָה
  choice: а вслед за ней на следующий год — другая весть
  rationale: אַחֲרָיו может относиться к предыдущей вести или событию; женское «за ней» отражает ближайший референт по смыслу. «Следующий» и «другая» естественно выражают последовательность, подразумеваемую повтором.
- source_word: וְחָמָס בָּאָרֶץ
  choice: в стране будет насилие
  rationale: חָמָס обозначает насилие, беззаконие или жестокую несправедливость. «Насилие» — прямой и контекстуально уместный эквивалент; глагол «будет» добавлен ради полноценного русского предложения.
- source_word: וּמֹשֵׁל עַל מֹשֵׁל
  choice: и правитель восстанет против правителя
  rationale: מֹשֵׁל — «правитель, властитель»; עַל буквально может значить «над», но в обстановке смуты допускает противостояние. Добавленный глагол «восстанет» ясно передаёт эллиптическую конструкцию, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Отношение правителей в выражении וּמֹשֵׁל עַל מֹשֵׁל
  choice: правитель восстанет против правителя
  alternative: правитель сменит правителя / правитель над правителем
  rationale: Контекст насилия и политической смуты благоприятствует значению противостояния, однако предлог עַל допускает также господство или последовательную смену власти; альтернативы не исключены и вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Синтаксис сохраняет нарастающую последовательность слухов и смуты, но избегает архаизмов. Лексическая неоднозначность שְׁמוּעָה и синтаксическая неоднозначность מֹשֵׁל עַל מֹשֵׁל сохранены посредством сносок.
