  text: קַדְּשׁ֨וּ עָלֶ֤י/הָ גוֹיִם֙ אֶת מַלְכֵ֣י מָדַ֔י אֶת פַּחוֹתֶ֖י/הָ וְ/אֶת כָּל סְגָנֶ֑י/הָ וְ/אֵ֖ת כָּל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/028.yaml
  text: Consecrate the nations against her—the kings of Media[a], her governors and all her prefects[c][b], and every land of his dominion.
translation:
  language: ru
  text: Освятите[a] народы для войны против неё — царей Мидии[b], её наместников и всех её сановников, а также все земли, подвластные ему[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Освятите» здесь означает отделить или созвать для войны, понимаемой как священная.
    reason: cultural_note
  - marker: b
    text: 'Или: «царей мидян».'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте сначала сказано «её наместников… её сановников», а затем — «подвластные ему». Последнее местоимение может относиться к правителю Мидии как её представителю; некоторые переводы сглаживают эту смену рода.
    reason: alternative_reading
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: Посвятите … на войну
  rationale: Императив от קדשׁ буквально связан с освящением или отделением для особой цели; в военном контексте он означает сакральное посвящение или созыв на войну. Формулировка сохраняет религиозный оттенок и при этом понятна современному читателю.
- source_word: עָלֶיהָ
  choice: против неё
  rationale: В данном военном контексте предлог עַל выражает враждебную направленность действий против Вавилона.
- source_word: גּוֹיִם
  choice: народы
  rationale: Обычное и уместное обозначение иноземных народов как политико-военных сил.
- source_word: מַלְכֵי מָדַי
  choice: царей Мидии
  rationale: Естественная русская передача названия страны; конструкция также допускает понимание «царей мидян», отмеченное в сноске.
- source_word: פַּחוֹתֶיהָ
  choice: её наместников
  rationale: פֶּחָה обозначает провинциального правителя или губернатора; «наместники» передаёт административный статус и не требует специального термина «сатрапы».
- source_word: סְגָנֶיהָ
  choice: всех её сановников
  rationale: סְגָן обозначает должностных лиц рангом ниже верховных правителей. «Сановники» естественно отличает их от наместников, не задавая чрезмерно узкой должности.
- source_word: כָּל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: все земли его владения
  rationale: Передача сохраняет территориальную совокупность, выраженную כָּל אֶרֶץ, и мужской единственный суффикс в מֶמְשַׁלְתּוֹ, не сглаживая смену рода.
theological_decisions:
- issue: Сакральный оттенок военного призыва
  choice: «Посвятите … на войну»
  alternative: «Приготовьте … к войне» или буквально «Освятите»
  rationale: Простое «приготовьте» утратило бы оттенок посвящения для сакрально осмысленной войны, а отдельное «освятите народы» в современном русском могло бы быть понято как нравственное очищение. Выбранная формулировка удерживает обе стороны смысла.
- issue: Смена рода местоименных суффиксов
  choice: Сохранить «её» при наместниках и сановниках, но «его» при владении
  alternative: Унифицировать все местоимения как «её» либо заменить последнее на «их»
  rationale: В еврейском тексте сначала стоят суффиксы женского рода, затем мужского рода единственного числа. Перевод сохраняет эту напряжённость, не устанавливая однозначно, относится ли последнее местоимение к правителю Мидии как представительному главе или имеет иное коллективно-политическое употребление.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Административные термины переданы понятно и без избыточного исторического жаргона; тире сохраняет структуру перечисления. Местоименная смена женского рода на мужской намеренно не устранена.
