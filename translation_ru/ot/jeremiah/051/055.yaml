source:
  edition: WLC
  text: כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת בָּבֶ֔ל וְ/אִבַּ֥ד מִמֶּ֖/נָּה ק֣וֹל גָּד֑וֹל וְ/הָמ֤וּ גַלֵּי/הֶם֙ כְּ/מַ֣יִם רַבִּ֔ים נִתַּ֥ן שְׁא֖וֹן קוֹלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/055.yaml
  text: For Yahweh is devastating Babylon and destroying from her the great sound[a]. Their waves roar like many waters[b]; the noise of their voice is given.
translation:
  language: ru
  text: 'Ибо Яхве опустошает Вавилон

    и уничтожает в нём громкий шум.


    Их волны[a] ревут, словно множество вод;

    раздаётся гул их голосов[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте не уточняется, к кому относится «их». Вероятно, нападающие на Вавилон уподоблены ревущим морским волнам.
    reason: referential_ambiguity
  - marker: b
    text: 'Буквально: «дан шум их голоса»; это выражение означает, что громкий звук поднимается или раздаётся.'
    reason: idiom
lexical_decisions:
- source_word: שֹׁדֵד
  choice: опустошает
  rationale: Причастие изображает совершающееся или близкое действие; «опустошает» передаёт разрушительный суд над городом, не сужая смысл до разграбления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: וְאִבַּד מִמֶּנָּה קוֹל גָּדוֹל
  choice: и заставляет умолкнуть его громкий гул
  rationale: Буквально речь идёт об уничтожении или удалении из Вавилона «великого звука». Русская формулировка естественно передаёт прекращение громкого городского шума; местоимение согласовано с русским родом названия «Вавилон».
- source_word: וְהָמוּ
  choice: ревут
  rationale: Глагол обозначает громкое, бурное движение; применительно к волнам «ревут» сохраняет одновременно звуковой образ и напор.
- source_word: גַלֵּיהֶם
  choice: их волны
  rationale: Сохранено местоимение третьего лица мужского рода множественного числа и не устранена неясность его отнесения.
- source_word: כְּמַיִם רַבִּים
  choice: словно могучие воды
  rationale: Сочетание изображает огромную, оглушительную массу воды. «Могучие воды» естественно передаёт силу образа; более буквальное «многие воды» в современном русском звучало бы неестественно.
- source_word: נִתַּן שְׁאוֹן קוֹלָם
  choice: грохот их голосов раздаётся
  rationale: Пассивная форма נתן здесь идиоматически означает, что громкий звук производится или поднимается. «Раздаётся» естественно передаёт смысл, а сноска сохраняет буквальную форму.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: К кому относятся «их волны» и «их голоса»
  choice: Сохранить местоимение без явного определения референта
  alternative: 'Уточнить: волны и голоса нападающих'
  rationale: Еврейский текст не называет референт прямо. Контекст допускает понимание нападающих как нахлынувших волн, но перевод не должен молча устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Синтаксис разбит на короткие параллельные строки; избегнуты как архаическое «многие воды», так и чрезмерно буквальное «дан грохот». Неясность местоименных отсылок сохранена и пояснена в сноске.
