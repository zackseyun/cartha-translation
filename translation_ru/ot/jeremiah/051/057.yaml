  variant: modern literary Russian
source:
  edition: WLC
  text: וְ֠/הִשְׁכַּרְתִּי שָׂרֶ֨י/הָ וַ/חֲכָמֶ֜י/הָ פַּחוֹתֶ֤י/הָ וּ/סְגָנֶ֨י/הָ֙ וְ/גִבּוֹרֶ֔י/הָ וְ/יָשְׁנ֥וּ שְׁנַת עוֹלָ֖ם וְ/לֹ֣א יָקִ֑יצוּ נְאֻ֨ם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/057.yaml
  text: And I will make her officials drunk—her wise men[a], her governors, her deputies, and her warriors—and they will sleep an everlasting sleep and not wake up, declares the King[b], whose name is Yahweh of Armies.
translation:
  language: ru
  text: «Я опьяню её правителей и мудрецов, её наместников[a], сановников и воинов. Они уснут вечным сном и не пробудятся, — возвещает Царь, чьё имя — Яхве Воинств[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сатрапов»; еврейское слово шире и обозначает административных правителей областей.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционная передача этого имени и титула: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכַּרְתִּי
  choice: Я опьяню
  rationale: 'Порода хифиль выражает причинное действие: говорящий приведёт перечисленных людей в состояние опьянения. Краткий русский глагол сохраняет и образ, и действие суда.'
- source_word: שָׂרֶיהָ
  choice: её правителей
  rationale: שׂר обозначает начальников, правителей или высокопоставленных должностных лиц; «правителей» ясно передаёт принадлежность к властной верхушке, не сводя их к царским сыновьям.
- source_word: חֲכָמֶיהָ
  choice: мудрецов
  rationale: Существительное обозначает людей, известных мудростью, вероятно придворных советников; «мудрецы» естественно и точно в данном контексте.
- source_word: פַּחוֹתֶיהָ
  choice: её наместников
  rationale: פּחה — административный правитель области. «Наместники» передаёт управленческую функцию и не навязывает более узкий персидский титул «сатрапы».
- source_word: סְגָנֶיהָ
  choice: сановников
  rationale: סגן обозначает должностных лиц или правителей рангом ниже; «сановники» естественно обозначает высокопоставленную административную группу и отличает её от наместников.
- source_word: גִבּוֹרֶיהָ
  choice: воинов
  rationale: В этом перечне вавилонской элиты גבור относится к сильным, доблестным бойцам; «воины» передаёт военный смысл без архаической тяжеловесности.
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  choice: Они уснут вечным сном
  rationale: Сохранена метафора сна, означающая смерть под судом; «вечным сном» передаёт עוֹלָם и не заменяет образ толкованием.
- source_word: וְלֹא יָקִיצוּ
  choice: и не пробудятся
  rationale: Буквально передаёт продолжение метафоры сна и подчёркивает необратимость приговора.
- source_word: נְאֻם
  choice: возвещает
  rationale: Авторитетная пророческая формула передана современным литературным глаголом, подходящим для торжественной речи.
- source_word: הַמֶּלֶךְ
  choice: Царь
  rationale: Определённое существительное служит здесь божественным титулом; прописная буква обозначает титульное употребление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, стоящее в еврейском тексте, а не заменяющий его титул «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет конкретный образ многочисленных небесных или военных сил и узнаваемую библейскую формулу, не используя непрозрачное заимствование без пояснения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблён тетраграмматон. Транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Смысл выражения «вечный сон»
  choice: 'Сохранить метафору: «уснут вечным сном и не пробудятся»'
  alternative: «умрут навеки» или «умрут и никогда не воскреснут»
  rationale: Еврейский текст изображает смерть как непробудный сон. Перевод сохраняет образ и его напряжение, не вводя более определённого утверждения о воскресении или окончательной участи, чем позволяет данный стих.
- issue: Соотношение титула «Царь» и имени
  choice: «Царь, чьё имя — Яхве Воинств»
  alternative: «Царь — Яхве Воинств имя Ему»
  rationale: Относительная конструкция естественна по-русски и сохраняет отнесение заключительной именной формулы к говорящему Царю.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Перечень должностных групп сделан ясным без избыточной исторической конкретизации; образ опьянения и метафора вечного сна сохранены.
