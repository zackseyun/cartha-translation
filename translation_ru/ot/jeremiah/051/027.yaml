  text: שְׂאוּ נֵ֣ס בָּ/אָ֗רֶץ תִּקְע֨וּ שׁוֹפָ֤ר בַּ/גּוֹיִם֙ קַדְּשׁ֤וּ עָלֶ֨י/הָ֙ גּוֹיִ֔ם הַשְׁמִ֧יעוּ עָלֶ֛י/הָ מַמְלְכ֥וֹת אֲרָרַ֖ט מִנִּ֣י וְ/אַשְׁכְּנָ֑ז פִּקְד֤וּ עָלֶ֨י/הָ֙ טִפְסָ֔ר הַֽעֲלוּ ס֖וּס כְּ/יֶ֥לֶק סָמָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/027.yaml
  text: Raise a banner in the land[a]; blow a trumpet among the nations. Consecrate nations against her; summon against her the kingdoms of Ararat, Minni, and Ashkenaz. Appoint a marshal against her[d][c][b]; bring up horses like bristling locusts.
translation:
  language: ru
  text: Поднимите знамя[a] в стране; трубите в рог среди народов. Освятите народы для войны против неё[b]; созовите против неё царства Арарат, Минни и Ашкеназ. Назначьте против неё военачальника[c]; ведите коней, словно щетинистую саранчу[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднимите сигнальный стяг».'
    reason: lexical_alternative
  - marker: b
    text: Глагол «освятите» относится к отделению и подготовке сил для битвы и сохраняет сакральный оттенок военного призыва.
    reason: cultural_note
  - marker: c
    text: 'Еврейское слово редкое; возможно также: «командира» или «военного распорядителя».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «словно волосатую саранчу» либо «словно шершавую саранчу»; еврейское выражение редкое и образное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ נֵס
  choice: Поднимите знамя
  rationale: נֵס — поднятый на видном месте знак, знамя или штандарт, служащий для сбора и военного призыва. «Знамя» естественно по-русски и сохраняет эту функцию.
- source_word: בָּאָרֶץ
  choice: в стране
  rationale: אֶרֶץ может означать «земля» или «страна»; военный контекст здесь позволяет понимать его как область, где подаётся сигнал, не уточняя географию сверх текста.
- source_word: תִּקְעוּ שׁוֹפָר
  choice: трубите в рог
  rationale: שׁוֹפָר — сигнальный рог, применявшийся для тревоги и сбора. «Рог» точнее передаёт предмет, чем современная «труба».
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם обозначает здесь иноземные народы, призываемые к войне.
- source_word: קַדְּשׁוּ עָלֶיהָ גּוֹיִם
  choice: Посвятите народы на войну против неё
  rationale: קדשׁ в военном контексте означает сакральное отделение или посвящение сил для битвы. Добавление «на войну» делает смысл понятным, сохраняя религиозный оттенок глагола.
- source_word: הַשְׁמִיעוּ עָלֶיהָ
  choice: созовите против неё
  rationale: Каузативная форма שמע буквально связана с объявлением или тем, чтобы нечто было услышано; в данном перечне царств речь идёт об их публичном призыве к походу.
- source_word: מַמְלְכוֹת אֲרָרַט מִנִּי וְאַשְׁכְּנָז
  choice: царства Арарат, Минни и Ашкеназ
  rationale: Названия исторических областей переданы принятой русской транслитерацией; конструкция допускает естественное русское сочетание «царства Арарат, Минни и Ашкеназ».
- source_word: פִּקְדוּ עָלֶיהָ טִפְסָר
  choice: Назначьте против неё военачальника
  rationale: טִפְסָר — редкое заимствованное наименование должностного лица, вероятно военного; «военачальник» ясно передаёт вероятную роль, не вводя узкого современного звания.
- source_word: הַעֲלוּ סוּס
  choice: выведите коней
  rationale: Каузатив от עלה в военном контексте означает вывести или двинуть вперёд; единственное число סוּס имеет собирательный смысл.
- source_word: כְּיֶלֶק סָמָר
  choice: словно ощетинившуюся саранчу
  rationale: יֶלֶק — один из видов саранчи, а редкое סָמָר передаёт образ чего-то щетинистого, волосатого или грубого. «Ощетинившаяся» сохраняет необычную и яркую метафору.
theological_decisions:
- issue: Сакральный оттенок военной подготовки в קַדְּשׁוּ
  choice: «Посвятите народы на войну»
  alternative: «Приготовьте народы к войне»
  rationale: Выбранный вариант сохраняет значение освящения или отделения, не превращая его ни в нейтральную мобилизацию, ни в развёрнутое утверждение о «священной войне», которого в тексте прямо нет.
translation_notes:
  register: Современный литературный русский с торжественным ритмом ряда повелений. Сохранены военная образность, сакральный оттенок קדשׁ и необычное сравнение коней с саранчой; редкие слова не переданы искусственными архаизмами.
