  text: וְ/רִנְּנ֤וּ עַל בָּבֶל֙ שָׁמַ֣יִם וָ/אָ֔רֶץ וְ/כֹ֖ל אֲשֶׁ֣ר בָּ/הֶ֑ם כִּ֧י מִ/צָּפ֛וֹן יָבוֹא לָ֥/הּ הַ/שּׁוֹדְדִ֖ים נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/048.yaml
  text: Then heaven and earth[a], and all that is in them, will shout for joy over Babylon, for from the north destroyers will come against her[c][b], declares Yahweh.
translation:
  language: ru
  text: Тогда небо и земля и всё, что в них, возликуют[a] над Вавилоном, потому что с севера придут на него разорители[b], — возвещает Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «громко возрадуются»; глагол подразумевает выраженное голосом ликование.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «придут к нему»; по контексту речь идёт о вражеском наступлении.'
    reason: lexical_alternative
  - marker: c
    text: «Яхве» передаёт еврейское имя Бога יהוה (YHWH).
    reason: alternative_reading
lexical_decisions:
- source_word: וְרִנְנוּ
  choice: возликуют
  rationale: Глагол רנן обозначает громкое, выраженное голосом ликование. «Возликуют» естественно и достойно передаёт радость всего творения, хотя менее явно выражает звуковой оттенок; он отмечен в сноске.
- source_word: עַל בָּבֶל
  choice: о Вавилоне
  rationale: При глаголе ликования עַל может обозначать предмет или повод радости. «О Вавилоне» сохраняет некоторую широту связи, тогда как контекст указывает на ликование по поводу его падения.
- source_word: שָׁמַיִם וָאָרֶץ וְכֹל אֲשֶׁר בָּהֶם
  choice: небо и земля и всё, что в них
  rationale: Сохранён традиционный меризм, охватывающий всё творение, и близкая к еврейскому относительная конструкция.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для ликования и в современном русском естественно передаётся причинной связью.
- source_word: מִצָּפוֹן
  choice: с севера
  rationale: Прямой и естественный перевод направления, сохраняющий повторяющийся у Иеремии образ бедствия, приходящего с севера.
- source_word: יָבוֹא לָהּ
  choice: придут на него
  rationale: Буквально предлог означает движение «к нему/ей», но в сочетании с разорителями контекст явно враждебный. Русское «придут на него» сохраняет направленность и передаёт нападение.
- source_word: הַשּׁוֹדְדִים
  choice: разорители
  rationale: Причастное существительное от שׁדד может обозначать опустошающих, грабящих или разоряющих. «Разорители» сохраняет и разрушительный, и грабительский оттенок лучше, чем более общее «губители».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана торжественно и естественно; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога, а не титул. «Яхве» сохраняет различие между именем и титулом, не привнося конфессионального толкования.
- issue: Радость творения «о Вавилоне»
  choice: сохранить объект ликования без пояснения в основном тексте
  alternative: возликуют из-за падения Вавилона
  rationale: Контекст говорит о суде над Вавилоном, однако слова «падение» в данном стихе нет. Перевод не делает подразумеваемое содержание явным за счёт добавления.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; местоимение «него» согласовано с русским родом названия «Вавилон», хотя в еврейском стоит форма женского рода.
