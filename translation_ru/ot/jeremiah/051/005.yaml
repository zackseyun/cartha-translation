source:
  edition: WLC
  text: כִּ֠י לֹֽא אַלְמָ֨ן יִשְׂרָאֵ֤ל וִֽ/יהוּדָה֙ מֵֽ/אֱלֹהָ֔י/ו מֵֽ/יְהוָ֖ה צְבָא֑וֹת כִּ֤י אַרְצָ/ם֙ מָלְאָ֣ה אָשָׁ֔ם מִ/קְּד֖וֹשׁ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/005.yaml
  text: For Israel and Judah are not widowed from their God[a], from Yahweh of Armies[b], though their land is full of guilt against the Holy One of Israel.
translation:
  language: ru
  text: 'Ибо Израиль и Иуда не овдовели: они не лишились своего Бога[a], Господа Воинств[b], хотя их земля полна вины перед Святым Израилевым[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не овдовели от своего Бога»; сохранена брачная метафора, выражающая, что Бог не оставил их.'
    reason: Пояснение сохранённой брачной метафоры и необычного управления.
  - marker: b
    text: 'Традиционный перевод: «Господа Саваофа».'
    reason: Лексическая альтернатива для יהוה צְבָאוֹת.
  - marker: c
    text: 'Или: «полна вины против Святого Израилева». Еврейский предлог здесь допускает разные оттенки смысла.'
    reason: Сохранение подлинной неоднозначности еврейского предлога.
lexical_decisions:
- source_word: אַלְמָן
  choice: не овдовели, лишившись
  rationale: Сохраняет брачную метафору еврейского слова и одновременно естественно выражает по-русски подразумеваемое отделение от Бога.
- source_word: מֵאֱלֹהָיו מֵיְהוָה צְבָאוֹת
  choice: лишившись своего Бога, Господа Воинств
  rationale: Повторный מִן обозначает отделение; единственное число суффикса передано собирательным «своего». «Господь Воинств» прозрачно передаёт имя יהוה и многозначное צְבָאוֹת без архаического «Саваоф».
- source_word: כִּי
  choice: Ведь
  rationale: Первое כִּי обосновывает предшествующее наставление и естественно вводит пояснение.
- source_word: כִּי
  choice: хотя
  rationale: 'Второе כִּי понято уступительно: вина земли противопоставлена тому, что Бог не оставил Израиль и Иуду.'
- source_word: אַרְצָם
  choice: их земля
  rationale: Прямой и устойчивый эквивалент, обозначающий землю Израиля и Иуды.
- source_word: מָלְאָה אָשָׁם
  choice: полна вины
  rationale: Здесь אָשָׁם означает виновность, а не жертву за вину или наказание.
- source_word: מִקְּדוֹשׁ יִשְׂרָאֵל
  choice: перед Святым Израилевым
  rationale: Передаёт отношение вины к Богу и ответственность перед Ним, не устраняя возможное значение «против»; неоднозначность отмечена в сноске.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израилев
  rationale: Сохраняет традиционно узнаваемый и краткий пророческий титул Бога.
theological_decisions:
- issue: Уступительное или причинное значение второго כִּי
  choice: «хотя их земля полна вины»
  alternative: «ибо их земля полна вины»
  rationale: Уступительное прочтение естественно удерживает напряжение между верностью Бога Своему народу и подлинной виновностью народа; причинное прочтение создавало бы впечатление, будто вина объясняет, почему народ не лишился Бога.
- issue: Значение מִן в сочетании מִקְּדוֹשׁ יִשְׂרָאֵל
  choice: «перед Святым Израилевым»
  alternative: «против Святого Израилева»
  rationale: Предлог допускает отношение или направленность. Основной текст выражает ответственность перед Богом, а сноска сохраняет более направленное понимание вины как совершённой против Него.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Брачная метафора сохранена, но прояснена оборотом «лишившись». Титул «Святой Израилев» выбран как узнаваемый библейский оборот; «Господь Воинств» понятнее современному читателю, чем «Господь Саваоф».
