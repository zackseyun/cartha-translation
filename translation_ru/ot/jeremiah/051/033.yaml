source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בַּת בָּבֶ֕ל כְּ/גֹ֖רֶן עֵ֣ת הִדְרִיכָ֑/הּ ע֣וֹד מְעַ֔ט וּ/בָ֥אָה עֵֽת הַ/קָּצִ֖יר לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/033.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: The daughter of Babylon is like a threshing floor at the time it is trodden; yet a little while, and the time of harvest will come for her.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве Воинств, Бог Израиля:


    «Дочь Вавилона — словно гумно в пору, когда его утаптывают[a]. Ещё немного — и придёт для неё время жатвы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «в пору, когда топчут её»; в еврейском тексте действующее лицо не названо, а местоименный суффикс стоит в женском роде и может относиться к дочери Вавилона.'
    reason: Сохранение грамматической неоднозначности еврейского текста и указание более буквальной синтаксической возможности.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя Бога передано как «Яхве», а צְבָאוֹת — традиционно и достаточно широко как «Воинств», без сужения смысла только до земных армий.
- source_word: בַּת בָּבֶל
  choice: Дочь Вавилона
  rationale: Сохранено пророческое олицетворение города и державы; замена на простое «Вавилон» ослабила бы образ.
- source_word: כְּגֹרֶן
  choice: словно гумно
  rationale: Сравнительная частица и конкретный земледельческий образ сохранены; «гумно» обозначает место, где обмолачивают зерно.
- source_word: עֵת הִדְרִיכָהּ
  choice: в пору, когда его утаптывают
  rationale: Передаёт утаптывание гумна перед молотьбой естественным русским оборотом. Неопределённый деятель сохранён безлично; расхождение в грамматическом роде и буквальная возможность «топтать её» отмечены в сноске.
- source_word: עוֹד מְעַט
  choice: Ещё немного
  rationale: Краткое естественное выражение передаёт близость назначенного события и сохраняет пророческую напряжённость.
- source_word: וּבָאָה עֵת הַקָּצִיר לָהּ
  choice: и придёт для неё время жатвы
  rationale: Сохранены образ жатвы, глагол прихода назначенного срока и местоименное указание на Вавилон.
theological_decisions:
- issue: Смысл образов гумна и жатвы
  choice: Сохранить земледельческие образы без поясняющего слова «суд» в основном тексте.
  alternative: Прямо истолковать жатву как наступающий Божий суд над Вавилоном.
  rationale: В контексте пророчества образы указывают на близкий суд, однако сам стих выражает это метафорически; перевод не должен устранять образ или добавлять толкование.
- issue: Референт местоименного суффикса в הִדְרִיכָהּ
  choice: В основном тексте согласовать местоимение с русским словом «гумно», а буквальную форму отметить в сноске.
  alternative: Передать «когда топчут её», связывая суффикс непосредственно с олицетворённым Вавилоном.
  rationale: Еврейская форма допускает наложение образа гумна на женски олицетворённый Вавилон. Русское «когда его утаптывают» понятно и естественно, а сноска сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. «Гумно» сохранено как точный библейско-земледельческий термин; структура второй фразы сделана краткой, чтобы передать близость суда.
