  terminology: «Изваяния» допустимо для פְּסִילִים и сохраняет конкретность изготовленных культовых образов. «Покараю» прямо передаёт судебно-карательный смысл פקד על, не вводя толкования о поклонниках или божествах. «Убитые» адекватно передаёт חֲלָלִים.
