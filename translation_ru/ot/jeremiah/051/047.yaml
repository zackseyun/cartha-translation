  rationale: 'Исправлена только неудачная передача וּפָקַדְתִּי עַל: «покараю» ясно выражает направленный на изваяния суд и сохраняет олицетворённую форму оригинала. Пунктуация объединена точкой с запятой, чтобы удержать единое пророческое высказывание и его параллельную структуру. Мужской род русских местоимений допустим, поскольку «Вавилон» в русском языке обычно мужского рода; смысл еврейских женских суффиксов как отсылки к Вавилону/его земле не утрачен.'
