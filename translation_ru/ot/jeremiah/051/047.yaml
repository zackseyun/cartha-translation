  language: en
  yaml_path: translation/ot/jeremiah/051/047.yaml
  text: Therefore, look, days are coming when I will punish the carved images of Babylon, and all her land will be put to shame, and all her slain will fall in her midst.
translation:
  language: ru
  text: Поэтому вот, наступают дни, когда Я покараю изваяния Вавилона; вся его земля будет посрамлена, и все его убитые падут посреди него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим пророчеством.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет пророческий указательный возглас и привлекает внимание к грядущему.
- source_word: וּפָקַדְתִּי עַל
  choice: Я взыщу с
  rationale: В данном контексте פקד על означает привлечь к ответу и подвергнуть суду; формула «взыщу с» сохраняет судебный оттенок.
- source_word: פְּסִילֵי בָבֶל
  choice: изваяний Вавилона
  rationale: פְּסִילִים — изготовленные, высеченные культовые изображения; «изваяния» естественно и достаточно точно передаёт значение.
- source_word: תֵּבוֹשׁ
  choice: будет опозорена
  rationale: Форма выражает пережитый позор/посрамление; пассивная русская конструкция соответствует пророческому контексту суда.
- source_word: חֲלָלֶיהָ
  choice: его убитые
  rationale: חָלָל обозначает павшего, обычно насильственно убитого; «убитые» ясно передаёт смысл.
- source_word: בְתוֹכָהּ
  choice: посреди него
  rationale: Местоименный суффикс относится к земле Вавилона; по-русски при референции к Вавилону естественно мужское местоимение.
theological_decisions:
- issue: Объект Божьего взыскания
  choice: «взыщу с изваяний»
  alternative: «накажу идолов»
  rationale: Сохранена олицетворённая формулировка оригинала, в которой суд направлен непосредственно на культовые изображения; не добавлено толкование о стоящих за ними божествах или поклонниках.
- issue: Род местоимений при Вавилоне и его земле
  choice: «Вавилона… его земля… его убитые… посреди него»
  alternative: «Вавилона… вся её земля… её убитые… посреди неё»
  rationale: В еврейском суффиксы женского рода грамматически согласуются с בָּבֶל/אֶרֶץ в контексте; современный русский требует естественного согласования названия «Вавилон» в мужском роде. Смысл принадлежности территории и павших Вавилону сохранён.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис слегка разделён на два предложения ради ясности, при этом последовательность образов и параллелизм оригинала сохранены.
