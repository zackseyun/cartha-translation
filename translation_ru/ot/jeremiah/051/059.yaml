  terminology: Имена Иеремия, Сераия, Нирия, Махсеия и Седекия переданы последовательно. «Распорядитель остановок» — допустимая осторожная функциональная передача редкого титула; примечание не должно выдавать «царские покои» за равнозначное или уверенно установленное значение.
