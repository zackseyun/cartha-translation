base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/059.yaml
  text: This is the word that Jeremiah the prophet commanded Seraiah son of Neriah[a], son of Mahseiah, when he went with Zedekiah king of Judah to Babylon, in the fourth year of his reign. Now Seraiah was the quartermaster.
translation:
  language: ru
  text: Вот повеление, которое пророк Иеремия дал Сераии, сыну Нирии, сыну Махсеии, когда Сераия отправился с Седекией, царём Иудеи, в Вавилон, в четвёртый год его царствования. Сераия был распорядителем остановок[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение редкого еврейского титула שַׂר מְנוּחָה не вполне ясно. Возможны передачи: «распорядитель размещения», «придворный чиновник»; вероятно, речь идёт о должностном лице, связанном с местами отдыха, размещением или дорожными остановками.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר צִוָּה
  choice: Вот поручение, которое ... дал
  rationale: דָּבָר здесь обозначает сообщаемое Сераии поручение, а צוה — властное повеление или поручение. Такая передача естественна по-русски и сохраняет силу исходного выражения.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: пророк Иеремия
  rationale: Естественный для современного русского порядок слов при сохранении титула.
- source_word: שְׂרָיָה בֶן נֵרִיָּה בֶּן מַחְסֵיָה
  choice: Сераии, сыну Нирии, сыну Махсеии
  rationale: Обе генеалогические связи переданы явно и последовательно.
- source_word: בְּלֶכְתּוֹ אֶת צִדְקִיָּהוּ מֶלֶךְ יְהוּדָה בָּבֶל
  choice: когда тот отправился с Седекией, царём Иудеи, в Вавилон
  rationale: Местоимение «тот» снимает возможную русскую двусмысленность относительно субъекта; אֶת имеет сопроводительное значение, а Вавилон выступает целью движения.
- source_word: בִּשְׁנַת הָרְבִעִית לְמָלְכוֹ
  choice: в четвёртый год его царствования
  rationale: Устоявшаяся и ясная передача формулы датировки по годам правления царя.
- source_word: שַׂר מְנוּחָה
  choice: распорядитель остановок
  rationale: Редкий титул буквально связан с покоем или местом отдыха и, вероятно, обозначает придворного, отвечавшего за места остановок либо дорожное размещение. Перевод сохраняет связь с контекстом путешествия, не выдавая спорное точное значение за несомненное.
