base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/043.yaml
  text: Her cities have become a desolation[a], a dry land and a desert, a land where no one lives[c][b], and through which no son of man passes.
translation:
  language: ru
  text: Её города стали пустошью[a], иссохшей землёй и пустынной равниной[b] — землёй, где никто не живёт; через них не проходит ни один человек[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стали местом запустения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «иссохшей землёй и степью».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «никакой человек не живёт в них, и сын человека не проходит через них»; оба выражения здесь относятся к людям вообще, а «в них» и «через них» — к городам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֶיהָ
  choice: её города
  rationale: Суффикс 3-го лица женского рода единственного числа указывает на Вавилон, олицетворённый как женщина; местоимение «её» сохраняет это олицетворение.
- source_word: לְשַׁמָּה
  choice: превратились в пустошь
  rationale: שַׁמָּה обозначает опустошённое, разорённое место; «пустошь» естественно передаёт результат суда, не сводя значение лишь к чувству ужаса.
- source_word: אֶרֶץ צִיָּה
  choice: иссохшая земля
  rationale: צִיָּה выражает сухость, иссушенность; «иссохшая земля» ясно и образно передаёт состояние местности.
- source_word: וַעֲרָבָה
  choice: и пустынная равнина
  rationale: עֲרָבָה может означать засушливую степь или пустынную равнину; выбранный вариант отличает её от предшествующей «иссохшей земли» и остаётся понятным современному читателю.
- source_word: אֶרֶץ לֹא יֵשֵׁב בָּהֵן כָּל אִישׁ
  choice: земля, где никто не живёт
  rationale: Отрицание с כָּל אִישׁ имеет обобщающий смысл «никто»; такой перевод естественен по-русски. Множественное בָּהֵן формально соотносится с городами, но в построении стиха следует за «землёй»; относительная конструкция сохраняет общий смысл без неестественного согласования.
- source_word: וְלֹא יַעֲבֹר בָּהֵן בֶּן אָדָם
  choice: и через которую не проходит ни один человек
  rationale: בֶּן אָדָם здесь является общим обозначением человека, а не титулом; «ни один человек» сохраняет усиленное отрицание и ясно передаёт отсутствие путников.
- source_word: הָיוּ
  choice: превратились
  rationale: Перфект описывает наступившее состояние после разорения; «превратились» передаёт переход к этому состоянию.
theological_decisions:
- issue: Значение выражения בֶּן אָדָם
  choice: ни один человек
  alternative: сын человеческий
  rationale: В данном параллелизме выражение обозначает любого представителя человеческого рода, а не особый пророческий или мессианский титул; буквальная калька могла бы создать в русском тексте ложную богословскую ассоциацию.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Олицетворение Вавилона сохранено посредством «её». Лексика конкретна и понятна; калька «сын человеческий» вынесена в примечание, чтобы не создавать неуместной титульной ассоциации.
