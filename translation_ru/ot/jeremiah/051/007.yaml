  text: כּוֹס זָהָ֤ב בָּבֶל֙ בְּ/יַד יְהוָ֔ה מְשַׁכֶּ֖רֶת כָּל הָ/אָ֑רֶץ מִ/יֵּינָ/הּ֙ שָׁת֣וּ גוֹיִ֔ם עַל כֵּ֖ן יִתְהֹלְל֥וּ גוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/007.yaml
  text: Babylon was a golden cup in the hand of Yahweh[a], making all the earth drunk. Nations drank from her wine[b]; therefore the nations have gone mad.
translation:
  language: ru
  text: Вавилон был золотой чашей в руке Яхве[a], опьянявшей всю землю. Народы пили её вино; поэтому народы обезумели[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст содержит Божье имя יהוה (YHWH), здесь переданное как «Яхве». Традиционный вариант: «Господь».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «поэтому народы безумствуют»; возможен также смысл «ведут себя как безумные». Еврейский глагол в контексте опьянения обозначает безумие или исступление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס זָהָב
  choice: золотой чашей
  rationale: Естественно передаёт образ «золотой чаши» и сохраняет метафору Вавилона как орудия опьянения и суда.
- source_word: בְּיַד יְהוָה
  choice: в руке Яхве
  rationale: Сохраняет еврейскую идиому, указывающую на обладание и использование Вавилона как орудия, а также передаёт личное Божье имя.
- source_word: מְשַׁכֶּרֶת
  choice: опьянявшей
  rationale: Причастная форма передаёт продолжающееся воздействие чаши; глагол сохраняет яркость метафоры опьянения.
- source_word: כָּל הָאָרֶץ
  choice: всю землю
  rationale: Упоминание народов в следующей части указывает на широкий, международный охват, поэтому «землю» предпочтительнее более узкого «страну».
- source_word: מִיֵּינָהּ שָׁתוּ גוֹיִם
  choice: Народы пили её вино
  rationale: Так по-русски естественно передаётся еврейская конструкция с מִן; местоимение женского рода относится к олицетворённому Вавилону или к чаше, не устраняя образную многослойность.
- source_word: יִתְהֹלְלוּ
  choice: обезумели
  rationale: В контексте вина и опьянения форма от הלל обозначает безумие или исступление, а не хвалу. Совершенный вид естественно выражает наступивший результат, хотя еврейская форма допускает описание продолжающегося безумного поведения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное Божье имя. Транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Образ опьяняющей чаши
  choice: Вавилон представлен как орудие в руке Яхве, опьяняющее народы
  alternative: Вавилон лишь как политическая сила, ввергающая народы в смятение
  rationale: Слова «в руке Яхве» прямо связывают действие Вавилона с Божьей властью; перевод сохраняет и роль Вавилона, и верховенство Яхве, не добавляя объяснений сверх текста.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным библейским ритмом. Образы чаши, вина, опьянения и безумия сохранены без пояснительного расширения.
