id: JER.51.53
reference: Jeremiah 51:53
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי תַעֲלֶ֤ה בָבֶל֙ הַ/שָּׁמַ֔יִם וְ/כִ֥י תְבַצֵּ֖ר מְר֣וֹם עֻזָּ֑/הּ מֵ/אִתִּ֗/י יָבֹ֧אוּ שֹׁדְדִ֛ים לָ֖/הּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/053.yaml
  text: Though Babylon should ascend to the heavens[a], and though she should fortify her lofty stronghold, destroyers will come to her from me[b], declares Yahweh.
translation:
  language: ru
  text: Пусть даже Вавилон взойдёт на небеса и укрепит свою высокую твердыню[b], от Меня придут к нему разорители[a], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грабители». Еврейское слово может обозначать тех, кто опустошает, разоряя и грабя.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «высоту своей силы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי ... וְכִי
  choice: Пусть даже ... и
  rationale: 'Повторяющиеся частицы вводят уступительные, а не условные придаточные: никакая высота и укреплённость не спасут Вавилон от суда.'
- source_word: תַעֲלֶה ... הַשָּׁמַיִם
  choice: взойдёт на небеса
  rationale: Сохраняет гиперболический образ восхождения Вавилона до небес и возвышенный поэтический строй.
- source_word: תְבַצֵּר
  choice: укрепит
  rationale: Порода пиэль глагола בצר передаёт действие укрепления или превращения места в неприступное.
- source_word: מְרוֹם עֻזָּהּ
  choice: свою высокую твердыню
  rationale: Контекст укрепления допускает конкретизацию עֹז как оплота или твердыни; русский оборот естественен, а более буквальное значение сохранено в сноске.
- source_word: מֵאִתִּי
  choice: от Меня
  rationale: Прямо передаёт источник появления разорителей, не уточняя сверх текста способ их посылания.
- source_word: שֹׁדְדִים
  choice: разорители
  rationale: Причастное существительное обозначает тех, кто опустошает и грабит; «разорители» сохраняет оба смысловых оттенка лучше, чем узкое «грабители».
- source_word: לָהּ
  choice: к нему
  rationale: Местоимение относится к Вавилону; в русском языке название города мужского рода, поэтому грамматический род естественно изменён.
- source_word: נְאֻם
  choice: возвещает
  rationale: Формула пророческого изречения передана современным торжественным глаголом без архаичного «речение».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное имя Бога, без замены титулом; форма «Яхве» соответствует принятой современной русской транслитерации.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой речи. Уступительная конструкция передана естественным оборотом «пусть даже». Маркеры сносок поставлены при тех словах, к которым относятся: [a] при «разорители», [b] при «твердыню».'
