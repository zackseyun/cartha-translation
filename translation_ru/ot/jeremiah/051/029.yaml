  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт структуру и образность стиха: земля реагирует судорожно, замыслы Яхве направлены против Вавилона, а итогом становится полное обезлюдение его земли. Однако «в пустыню» сужает שַׁמָּה до географической пустыни, тогда как слово означает разорение, запустение, опустошённость.'
  naturalness: Фраза звучит современно и литературно. «Земля корчится» намеренно резка, но оправдана персонифицированным, мучительным образом חול. «Поднялись против» несколько естественнее, чем «восстали против», поскольку последнее может вызвать представление о мятеже самих замыслов.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Замыслы» удачно передаёт מַחְשְׁבוֹת. «Запустение» точнее «пустыни» для לְשַׁמָּה и сохраняет пророческий регистр.
