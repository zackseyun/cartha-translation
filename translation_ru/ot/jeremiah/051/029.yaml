revisions:
- from: И содрогается земля и корчится, потому что замыслы Яхве восстали против Вавилона, чтобы превратить землю Вавилона в пустыню, где никто не живёт.
  to: И содрогается земля и корчится, потому что замыслы Яхве поднялись против Вавилона, чтобы превратить землю Вавилона в запустение, где никто не живёт.
  rationale: 'Исправлены две точки: «в пустыню» заменено на «в запустение», чтобы не сужать значение שַׁמָּה, а «восстали» — на «поднялись», чтобы сохранить образ קָמָה без русской коннотации мятежа. Остальная формулировка сохраняет исходную образность, различение между «землёй» в начале и «землёй Вавилона» далее, а также настоящее время пророческого описания.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:16:40Z'
