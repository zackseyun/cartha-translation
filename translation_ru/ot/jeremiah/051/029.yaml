  - severity: low
    issue: «Замыслы Яхве восстали против Вавилона»
    rationale: «Восстали» в русском обычно означает мятеж или бунт. Глагол קוּם сохраняет образ того, что замыслы поднялись/выступили против Вавилона; «поднялись против» передаёт его без лишней коннотации.
  revised_text: И содрогается земля и корчится, потому что замыслы Яхве поднялись против Вавилона, чтобы превратить землю Вавилона в запустение, где никто не живёт.
