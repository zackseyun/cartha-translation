  text: וַ/תִּרְעַ֥שׁ הָ/אָ֖רֶץ וַ/תָּחֹ֑ל כִּ֣י קָ֤מָה עַל בָּבֶל֙ מַחְשְׁב֣וֹת יְהוָ֔ה לָ/שׂ֞וּם אֶת אֶ֧רֶץ בָּבֶ֛ל לְ/שַׁמָּ֖ה מֵ/אֵ֥ין יוֹשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/029.yaml
  text: And the earth quakes and writhes, for the plans of Yahweh have arisen against Babylon, to make the land of Babylon a desolation, without inhabitant.
translation:
  language: ru
  text: И содрогается земля и корчится, потому что замыслы Яхве поднялись против Вавилона, чтобы превратить землю Вавилона в запустение, где никто не живёт.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: содрогается
  rationale: Передаёт сильное сотрясение земли в контексте суда и сохраняет живую образность пророческого повествования.
- source_word: וַתָּחֹל
  choice: корчится
  rationale: Сохраняет телесный, судорожный образ глагола חול, который может описывать муки, подобные родовым, а не просто дрожь.
- source_word: הָאָרֶץ
  choice: земля
  rationale: 'В первой части речь представлена широко: сама земля содрогается и корчится; это отличается от конкретной «земли Вавилона» далее.'
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит причину содрогания земли.
- source_word: קָמָה
  choice: восстали
  rationale: Сохраняет образ замыслов Яхве, поднявшихся и выступивших против Вавилона, не сводя выражение лишь к осуществлению решения.
- source_word: מַחְשְׁבוֹת
  choice: замыслы
  rationale: В контексте суда обозначает обдуманные намерения и звучит естественно и весомо по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לָשׂוּם
  choice: превратить
  rationale: В конструкции с объектом и обозначением результата глагол שׂוּם выражает приведение земли в состояние запустения.
- source_word: אֶרֶץ בָּבֶל
  choice: землю Вавилона
  rationale: Здесь אֶרֶץ обозначает конкретную территорию Вавилона, а не землю вообще.
- source_word: לְשַׁמָּה
  choice: в пустыню
  rationale: Передаёт результат опустошения как безлюдную, разорённую местность; в современном русском звучит естественнее буквального «в запустение».
- source_word: מֵאֵין יוֹשֵׁב
  choice: где никто не живёт
  rationale: Естественно передаёт идиому об отсутствии жителей, сохраняя её абсолютный характер.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное Божье имя в исходном тексте и не подменяет его титулом.
- issue: Образ исполнения Божьих замыслов
  choice: замыслы Яхве восстали против Вавилона
  alternative: замысел Яхве исполняется над Вавилоном
  rationale: Выбранный вариант сохраняет необычный образ еврейского קָמָה עַל и не устраняет напряжение между Божьим намерением и его действенным выступлением против города.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Настоящее время сохраняет живость еврейской повествовательной последовательности. Выражение «земля корчится» намеренно сохраняет резкую персонифицированную образность оригинала.
