base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/017.yaml
  text: Every man is made brutish[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is falsehood, and there is no breath in them.
translation:
  language: ru
  text: Всякий человек неразумен, лишён знания; каждый мастер по металлу посрамлён из-за идола, потому что его литое изваяние — ложь и в них нет дыхания[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и нет в них духа». Еврейское רוּחַ может означать «дыхание», «ветер» или «дух»; здесь выбрано «дыхание», поскольку речь идёт о безжизненности идолов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעַר
  choice: неразумен
  rationale: Форма нифаля от בער передаёт состояние отупения, неразумия. «Неразумен» сохраняет обличительный смысл и звучит естественно в современном литературном русском языке.
- source_word: כָּל אָדָם
  choice: всякий человек
  rationale: אָדָם здесь обозначает человека вообще; сочетание «всякий человек» сохраняет единственное число и распределительный характер высказывания, оставаясь родовым по смыслу.
- source_word: מִדַּעַת
  choice: лишён знания
  rationale: Предлог מִן при отвлечённом существительном имеет здесь значение отсутствия. Перевод ясно передаёт недостаток знания и естественно дополняет «неразумен».
- source_word: הֹבִישׁ
  choice: посрамлён
  rationale: 'Хифиль от בוש выражает причинение стыда или позора; русская пассивная форма передаёт результат: изделие мастера обнаруживает его несостоятельность.'
- source_word: צֹרֵף
  choice: мастер по металлу
  rationale: Причастие может обозначать плавильщика, ювелира или другого обработчика металла. Контекст изготовления идола требует широкого и понятного обозначения без неоправданного уточнения материала.
- source_word: מִפָּסֶל
  choice: своим идолом
  rationale: פֶּסֶל обозначает изображение, служащее идолом, а מִן указывает на причину или средство посрамления. «Своим» естественно отражает связь идола с изготовившим его мастером, подразумеваемую контекстом.
- source_word: שֶׁקֶר
  choice: ложь
  rationale: Краткое именное сказуемое «ложь» сохраняет резкость пророческого обличения и может обозначать как ложность идола, так и его обманчивость.
- source_word: נִסְכּוֹ
  choice: его литое изваяние
  rationale: Слово относится к изображению, изготовленному отливкой; «литое изваяние» передаёт способ изготовления и не повторяет слово «идол».
- source_word: וְלֹא רוּחַ בָּם
  choice: и нет в них дыхания
  rationale: רוּחַ может означать дыхание, ветер или дух. В полемике против идолов «дыхание» непосредственно подчёркивает их безжизненность; множественное «в них» относится к идолам как к совокупности.
theological_decisions:
- issue: Обобщающее значение אָדָם
  choice: всякий человек
  alternative: все люди; каждый
  rationale: Фраза относится ко всему человечеству, но еврейский текст выражает мысль через существительное в единственном числе. «Всякий человек» сохраняет и форму, и универсальность утверждения.
- issue: Значение רוּחַ в полемике против идолов
  choice: дыхание
  alternative: дух
  rationale: Контекст противопоставляет живое существо безжизненному изделию, поэтому «дыхание» наиболее непосредственно выражает мысль. Возможное значение «дух» сохранено в примечании, чтобы не устранять лексическую многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллельные части разделены точкой с запятой; лексика ясна обычному читателю, но сохраняет резкий обличительный тон оригинала.
