  text: הִנְ/נִ֨י אֵלֶ֜י/ךָ הַ֤ר הַ/מַּשְׁחִית֙ נְאֻם יְהוָ֔ה הַ/מַּשְׁחִ֖ית אֶת כָּל הָ/אָ֑רֶץ וְ/נָטִ֨יתִי אֶת יָדִ֜/י עָלֶ֗י/ךָ וְ/גִלְגַּלְתִּ֨י/ךָ֙ מִן הַ/סְּלָעִ֔ים וּ/נְתַתִּ֖י/ךָ לְ/הַ֥ר שְׂרֵפָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/025.yaml
  text: Behold, I am against you, O destroying mountain, declares Yahweh, which destroys the whole earth. I will stretch out my hand against you, and roll you down from the crags, and make you a burned mountain.
translation:
  language: ru
  text: Вот Я — против тебя, гора-губительница, — возвещает Яхве, — губящая всю землю.[a] Я простру на тебя Свою руку, скатну тебя со скал и превращу тебя в выжженную гору.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю страну». Еврейское אֶרֶץ может означать как землю вообще, так и отдельную страну.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «горой пожара»; «сожжённой горой». Краткое еврейское выражение может подчёркивать либо горение, либо состояние после него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלֶיךָ
  choice: Вот Я — против тебя
  rationale: Сочетание הִנְנִי с אֶל выражает торжественное объявление непосредственного противостояния; «Вот Я» сохраняет пророческую силу формулы.
- source_word: הַר הַמַּשְׁחִית
  choice: гора-губитель
  rationale: Сохраняет метафору горы и активное значение причастия «губящая»; приложение звучит по-русски естественнее, чем тяжеловесное «губящая гора» рядом со следующим причастным оборотом.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу и сохраняет личное имя יהוה.
- source_word: הַמַּשְׁחִית אֶת כָּל הָאָרֶץ
  choice: губящая всю землю
  rationale: Причастный оборот согласован с образом горы и сохраняет активное значение еврейского причастия; הָאָרֶץ здесь передано в широком смысле, но допустим и локальный смысл «страна».
- source_word: וְנָטִיתִי אֶת יָדִי עָלֶיךָ
  choice: Я простру на тебя Мою руку
  rationale: Сохраняет образный язык божественного суда и направление действия, выраженное עַל.
- source_word: וְגִלְגַּלְתִּיךָ מִן הַסְּלָעִים
  choice: скатну тебя со скал
  rationale: Редкое, но нормативное «скатну» точно передаёт каузативный смысл «заставлю катиться»; «со скал» сохраняет горный образ без добавления явно не выраженного направления «вниз».
- source_word: וּנְתַתִּיךָ לְהַר שְׂרֵפָה
  choice: превращу тебя в выжженную гору
  rationale: Передаёт результативную конструкцию נתן לְ и наиболее естественно выражает состояние после сожжения, не устраняя компактности и неоднозначности исходной фразы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Объём значения כָּל הָאָרֶץ
  choice: всю землю
  alternative: всю страну
  rationale: В контексте суда над Вавилоном широкая риторика допускает всемирный охват, однако еврейское אֶרֶץ также может обозначать страну; неоднозначность отмечена в сноске.
- issue: Образ «горы-губителя»
  choice: сохранить метафору без прямого пояснения как Вавилона
  alternative: Вавилон, губитель народов
  rationale: Сам стих обращается к Вавилону посредством метафоры; её истолкование в основном тексте сузило бы и заменило исходный образ.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены обращения, метафора горы и образ простёртой руки; архаизмы ограничены понятным глаголом «простру». Все сноски отмечены в основном тексте.
