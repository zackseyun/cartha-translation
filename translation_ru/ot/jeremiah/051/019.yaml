source:
  edition: WLC
  text: לֹֽא כְ/אֵ֜לֶּה חֵ֣לֶק יַעֲק֗וֹב כִּֽי יוֹצֵ֤ר הַ/כֹּל֙ ה֔וּא וְ/שֵׁ֖בֶט נַחֲלָת֑/וֹ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/019.yaml
  text: Not like these is the Portion of Jacob[a], for he is the one who formed everything, and Israel is the tribe of his inheritance[c][b]; Yahweh of Armies is his name.
translation:
  language: ru
  text: Удел Иакова не подобен этим[a], ибо Он — Создатель всего, а Его народ — племя, составляющее Его наследие[b]. Яхве Воинств[c] — имя Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «удел Иакова». Еврейское выражение допускает понимание Яхве как удела, доставшегося Иакову; менее вероятно в этом контексте, что речь идёт об уделе, которым владеет Иаков.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и племя Его наследия». В еврейском тексте здесь не назван ни Иаков, ни Израиль; по контексту выражение относится к народу, принадлежащему Яхве. В параллельном тексте Иер. 10:16 прямо назван Израиль.'
    reason: alternative_reading
  - marker: c
    text: 'Традиционный перевод: «Господь Саваоф», то есть «Господь Воинств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כְאֵלֶּה
  choice: Не таков
  rationale: 'Форма единственного числа согласуется с «Уделом Иакова», а указательное «эти» относится к идолам из контекста: Удел Иакова не подобен им.'
- source_word: חֵלֶק יַעֲקֹב
  choice: Удел Иакова
  rationale: Конструкцию можно понять как «удел Иакова»; в контексте сам Яхве противопоставлен идолам как принадлежащий Иакову удел. Заглавная буква указывает на употребление выражения как обозначения Бога, не превращая его в отдельное имя.
- source_word: יוֹצֵר הַכֹּל
  choice: Создатель всего
  rationale: Причастие יוֹצֵר обозначает того, кто образует или создаёт. Краткое русское выражение сохраняет противопоставление Творца рукотворным идолам.
- source_word: וְשֵׁבֶט נַחֲלָתוֹ
  choice: а Иаков — племя Его наследия
  rationale: שֵׁבֶט здесь означает племя как народ, принадлежащий Богу, а не царский скипетр. Имя «Иаков» повторено по смыслу для ясности русской эллиптической конструкции; в самом еврейском тексте данной части стиха стоит только «и племя Его наследия».
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יהוה передано как «Яхве», а צְבָאוֹת переведено прозрачным современному читателю словом «Воинств», сохраняющим военный и небесно-космический диапазон выражения.
- source_word: שְׁמוֹ
  choice: имя Его
  rationale: Инверсия придаёт заключительной именной фразе естественное для торжественной русской речи звучание.
theological_decisions:
- issue: Кого обозначает «Удел Иакова»
  choice: Яхве — удел Иакова
  alternative: Иаков обладает неким уделом, не подобным идолам
  rationale: Контраст с идолами и последующее именование Яхве указывают, что речь идёт о самом Боге как уделе Иакова; примечание сохраняет грамматическую возможность более общего прочтения.
- issue: Восстановление подлежащего при וְשֵׁבֶט נַחֲלָתוֹ
  choice: Повторить «Иаков» по смыслу и отметить это в сноске
  alternative: Добавить «Израиль» по параллели с Иеремией 10:16 либо оставить дословный обрыв «и племя Его наследия»
  rationale: Масоретский текст не содержит здесь имени «Израиль», поэтому оно не внесено. Повтор «Иаков» делает эллипсис понятным по-русски, не гармонизируя стих с параллельным местом; сноска открыто показывает форму источника.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация передаёт явное личное имя в еврейском тексте и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Инверсия «имя Его» сохранена как уместная формула именования; архаизмы сведены к минимуму. Заглавные буквы в «Удел», «Создатель» и местоимении «Его» отражают почтительное издательское оформление, не добавляя отдельного богословского утверждения.
