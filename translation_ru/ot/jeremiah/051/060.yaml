  text: וַ/יִּכְתֹּ֣ב יִרְמְיָ֗הוּ אֵ֧ת כָּל הָ/רָעָ֛ה אֲשֶׁר תָּב֥וֹא אֶל בָּבֶ֖ל אֶל סֵ֣פֶר אֶחָ֑ד אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה הַ/כְּתֻבִ֖ים אֶל בָּבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/060.yaml
  text: And Jeremiah wrote in a single scroll all the disaster that would come upon Babylon—all these words written against Babylon[a].
translation:
  language: ru
  text: Иеремия записал в одном свитке всё бедствие, которое постигнет Вавилон, — все эти слова, написанные о Вавилоне[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «написанные против Вавилона». Еврейский предлог может указывать как на предмет этих пророческих слов, так и, в данном контексте суда, на их направленность против Вавилона.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: записал
  rationale: В данном повествовательном контексте כתב обозначает письменную фиксацию пророческих слов; «записал» естественнее по-русски, чем простое «написал» перед указанием на свиток.
- source_word: אֵת כָּל הָרָעָה
  choice: всё бедствие
  rationale: רָעָה здесь означает грядущее несчастье как суд над Вавилоном, а не нравственное зло.
- source_word: אֲשֶׁר תָּבוֹא אֶל בָּבֶל
  choice: которое постигнет Вавилон
  rationale: Буквально бедствие «придёт к Вавилону»; русское «постигнет Вавилон» естественно передаёт неблагоприятный результат, не усиливая образ сверх контекста.
- source_word: אֶל סֵפֶר אֶחָד
  choice: в одном свитке
  rationale: סֵפֶר в исторической обстановке указывает на свиток или письменный документ; אֶחָד подчёркивает, что всё было собрано в одном свитке.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: דְּבָרִים относится к записанным пророческим речениям, поэтому «слова» сохраняет текстовый акцент.
- source_word: הַכְּתֻבִים
  choice: написанные
  rationale: Страдательное причастие непосредственно определяет «слова»; краткая причастная конструкция точно передаёт синтаксис.
- source_word: אֶל בָּבֶל
  choice: о Вавилоне
  rationale: При словах, которые записаны, אֶל обозначает их направленность или предмет. Нейтральное «о Вавилоне» сохраняет широту выражения; контекстуальное «против Вавилона» дано в сноске.
theological_decisions:
- issue: Направленность пророческих слов в выражении הַכְּתֻבִים אֶל־בָּבֶל
  choice: о Вавилоне
  alternative: против Вавилона
  rationale: Предлог אֶל буквально выражает направление «к», а в данном сочетании может указывать на предмет или адресата пророчества. Контекст суда допускает значение «против», однако основной текст не должен без необходимости устранять лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Свиток» сохраняет историческую конкретность, а тире перед присоединительной частью делает длинную фразу ясной для современного читателя.
