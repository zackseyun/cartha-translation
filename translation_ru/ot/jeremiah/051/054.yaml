  text: Вопль из Вавилона, и великое разрушение — из земли халдеев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֥וֹל זְעָקָ֖ה
  choice: Слышен вопль
  rationale: Сочетание буквально означает «звук/голос вопля». Русская безличная конструкция естественно передаёт слышимый крик бедствия и не требует добавления отдельного глагола движения.
- source_word: מִ/בָּבֶ֑ל
  choice: из Вавилона
  rationale: Предлог מִן обозначает источник звука; «из Вавилона» прямо и естественно передаёт эту связь.
- source_word: וְ/שֶׁ֥בֶר
  choice: и великое сокрушение
  rationale: שֶׁבֶר может обозначать сокрушение, крушение, разгром или гибель. «Сокрушение» сохраняет образ разрушительного слома и пророческую торжественность, не сводя слово только к материальным разрушениям.
- source_word: גָּד֖וֹל
  choice: великое
  rationale: Прямо передаёт масштаб бедствия и согласуется с существительным «сокрушение».
- source_word: מֵ/אֶ֥רֶץ כַּשְׂדִּֽים
  choice: из земли халдеев
  rationale: 'Перевод сохраняет этногеографическое выражение оригинала: названа земля народа халдеев, а не отвлечённое географическое имя.'
