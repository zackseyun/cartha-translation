  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּ֥עַל נְשִׂאִ֖ים מִ/קְצֵה אָ֑רֶץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יֹּ֥צֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/016.yaml
  text: At the sound of his voice, a multitude of waters is in the heavens; he makes clouds rise from the ends of the earth; he makes lightning for the rain, and brings out the wind from his storehouses.
translation:
  language: ru
  text: Когда он подаёт голос, в небесах — множество вод; он поднимает облака[a] от краёв земли, создаёт молнии для дождя и выводит ветер из своих хранилищ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испарения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сокровищницы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  choice: Когда он подаёт голос
  rationale: Оборот буквально означает «при подаче им своего голоса». Русское выражение сохраняет образ Божьего голоса и естественно вводит последующее описание бури.
- source_word: הֲמוֹן מַיִם
  choice: гул вод
  rationale: הֲמוֹן может обозначать множество, изобилие или шумную массу. В сочетании с голосом и грозовой картиной «гул вод» естественно передаёт звуковую сторону образа, не сводя воды к обычному дождю.
- source_word: בַּשָּׁמַיִם
  choice: в небесах
  rationale: Хотя в метеорологическом контексте возможно «в небе», форма «в небесах» сохраняет возвышенный поэтический строй и остаётся понятной современному читателю.
- source_word: נְשִׂאִים
  choice: облака
  rationale: Слово может обозначать облака, туман или испарения. В описании грозы «облака» наиболее естественно; иной смысл отмечен в сноске.
- source_word: מִקְצֵה אָרֶץ
  choice: от краёв земли
  rationale: Сохранён пространственный библейский образ самых дальних пределов земли без поясняющей парафразы.
- source_word: בְּרָקִים לַמָּטָר
  choice: молнии для дождя
  rationale: 'Так сохраняется неоднозначная связь, выраженная предлогом ל: молнии связаны с дождём или предназначаются для сопровождающей его бури. Более гладкое «молнии с дождём» сузило бы смысл.'
- source_word: וַיֹּצֵא רוּחַ
  choice: выводит ветер
  rationale: В ряду атмосферных явлений רוּחַ означает ветер. Глагол сохраняет конкретный образ выхода ветра из хранилищ.
- source_word: מֵאֹצְרֹתָיו
  choice: из своих хранилищ
  rationale: אֹצָר обозначает хранилище или сокровищницу. «Хранилища» ясно передаёт образ мест, где удерживается ветер; традиционный вариант дан в сноске.
theological_decisions:
- issue: Поэтическая космология и власть Бога над погодой
  choice: Сохранены воды в небесах, облака, молнии и ветер, выходящий из хранилищ.
  alternative: Свести образность к поясняющей фразе о том, что Бог вызывает грозу.
  rationale: Еврейский текст изображает власть Бога над творением посредством конкретной возвышенной образности. Перевод не превращает поэзию ни в научное описание устройства мира, ни в отвлечённую парафразу.
- issue: Неоднозначность הֲמוֹן מַיִם
  choice: «гул вод»
  alternative: «множество вод» или «обилие воды»
  rationale: Контекст голоса и грозы поддерживает значение шума, однако существительное также допускает количественный оттенок. Выбор сохраняет живую русскую фразу, не меняя воды на дождь.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но не архаичной поэтической интонацией. Структура четырёх погодных образов сохранена; местоимения, относящиеся к Богу, даны со строчной буквы согласно нейтральной современной орфографической практике.
