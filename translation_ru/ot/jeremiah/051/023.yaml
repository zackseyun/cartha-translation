  text: And with you I shattered the shepherd and his flock[a]; and with you I shattered the farmer and his team[c][b]; and with you I shattered governors and deputies.
translation:
  language: ru
  text: И тобою Я сокрушил пастуха и его стадо; и тобою Я сокрушил земледельца и его упряжку[a]; и тобою Я сокрушил областных правителей и их заместителей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его пару»; возможно также: «его ярмо». Речь идёт о паре тягловых животных, запряжённых для земледельческой работы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפַּצְתִּי
  choice: Я сокрушал
  rationale: Глагол נָפַץ выражает сильное, разрушительное действие — разбивать, сокрушать. Несовершенный вид «сокрушал» естественно передаёт ряд совершённых действий в описании Вавилона как неоднократно применявшегося орудия; троекратный повтор сохранён ради еврейского ритма.
- source_word: בְּךָ
  choice: тобою
  rationale: 'Предлог בְּ имеет здесь инструментальное значение: Вавилон выступает орудием действия. «Тобою» передаёт это значение кратко и сохраняет повтор исходного текста.'
- source_word: רֹעֶה
  choice: пастуха
  rationale: В перечне занятий и общественных положений имеется в виду обычный пастух; церковное «пастырь» внесло бы отсутствующую в контексте ассоциацию.
- source_word: עֶדְרוֹ
  choice: его стадо
  rationale: עֵדֶר обозначает стадо или отару. Общее «стадо» понятно современному читателю и естественно сочетается со словом «пастух».
- source_word: אִכָּר
  choice: земледельца
  rationale: Слово обозначает человека, возделывающего землю. «Земледелец» точно и достойно передаёт древний сельскохозяйственный контекст, не сужая значение до одного лишь пахаря.
- source_word: צִמְדּוֹ
  choice: его упряжку
  rationale: צֶמֶד может обозначать пару животных, соединённых для сельскохозяйственной работы, либо их ярмо. «Упряжка» ясно указывает на рабочую пару и не создаёт впечатления, будто речь только о деревянном приспособлении.
- source_word: פַּחוֹת
  choice: правителей
  rationale: פַּחוֹת — множественное число названия областных правителей или губернаторов. «Правители» сохраняет административный смысл без привязки к современной должности.
- source_word: סְגָנִים
  choice: наместников
  rationale: סְגָנִים обозначает должностных лиц или правителей рангом ниже либо рядом с областными правителями. «Наместники» передаёт древний административный оттенок, хотя точная иерархия термина не вполне определённа.
