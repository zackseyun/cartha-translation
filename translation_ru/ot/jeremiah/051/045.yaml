  terminology: «Яхве» корректно передаёт יהוה. «Пылающий гнев» удачно отражает חֲרוֹן אַף. «Каждый» приемлемо передаёт распределительное אִישׁ без неоправданного ограничения адресатов взрослыми мужчинами.
