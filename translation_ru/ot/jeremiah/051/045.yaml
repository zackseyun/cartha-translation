  text: צְא֤וּ מִ/תּוֹכָ/הּ֙ עַמִּ֔/י וּ/מַלְּט֖וּ אִ֣ישׁ אֶת נַפְשׁ֑/וֹ מֵ/חֲר֖וֹן אַף יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/045.yaml
  text: Come out from her midst[a], my people, and let each man save his life from the burning anger of Yahweh.
translation:
  language: ru
  text: Выходите из её среды, мой народ, и пусть каждый спасёт свою жизнь от пылающего гнева Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְאוּ
  choice: Выходите
  rationale: Форма множественного числа повелительного наклонения от יצא выражает настоятельный призыв покинуть город. «Выходите» сохраняет видовое значение призыва к действию и естественно звучит в обращении к людям, составляющим народ.
- source_word: מִתּוֹכָהּ
  choice: из неё
  rationale: Буквально выражение означает «из её среды»; местоимение женского рода отсылает к Вавилону как к персонифицированному городу. В современном русском «из неё» передаёт тот же образ естественнее, чем буквальное «из среды её».
- source_word: עַמִּי
  choice: Мой народ
  rationale: Сохраняет притяжательное значение и силу заветного обращения Яхве к Своему народу.
- source_word: וּמַלְּטוּ אִישׁ אֶת־נַפְשׁוֹ
  choice: и пусть каждый спасает свою жизнь
  rationale: Порода piel глагола מלט с распределительным אִישׁ призывает каждого лично сохранить жизнь. נפש здесь означает жизнь или самого человека, а не отдельно мыслимую нематериальную душу.
- source_word: מֵחֲרוֹן אַף
  choice: от пылающего гнева
  rationale: Устойчивое сочетание передаёт гнев как раскалённый, пылающий. Такой перевод сохраняет исходную метафору и при этом понятен современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Распределительное אִישׁ
  choice: каждый
  alternative: каждый мужчина
  rationale: В данном сочетании אִישׁ имеет распределительное значение «каждый» и относится к отдельным представителям народа. Русское «каждый» сохраняет грамматический мужской род, не сужая обращение до взрослых мужчин.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Множественное «выходите» сохраняет форму еврейского повеления, хотя обращение «Мой народ» имеет единственное число; смысл направлен к людям, составляющим народ. Порядок слов делает срочность призыва ясной без архаизмов.
