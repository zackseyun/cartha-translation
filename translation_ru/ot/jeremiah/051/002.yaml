base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/002.yaml
  text: And I will send strangers against Babylon, and they will winnow her and empty her land, for they will be against her from every side in the day of disaster.
translation:
  language: ru
  text: 'И Я пошлю на Вавилон чужеземцев[a]: они развеют его[b] и опустошат его землю. Ведь в день бедствия[c] они будут против него со всех сторон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужаков». Речь идёт о посторонних, иноземных силах, посланных против Вавилона.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рассеют его». Еврейский глагол может обозначать рассеивание вообще, но, вероятно, сохраняет образ веяния зерна.'
    reason: lexical_alternative
  - marker: c
    text: «В день бедствия» — то есть когда Вавилон постигнет беда; речь не о нравственном зле.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי לְבָבֶל
  choice: И пошлю Я на Вавилон
  rationale: Пророческий перфект передан будущим временем. Предлог לְ обозначает направление посылаемых сил; «на Вавилон» в русском естественно выражает и движение, и враждебную направленность.
- source_word: זָרִים
  choice: чужеземцев
  rationale: Слово обозначает посторонних, иноземцев. «Чужеземцы» ясно передаёт здесь чужеземные силы и звучит уместно в пророческой речи.
- source_word: וְזֵרוּהָ
  choice: они развеют его
  rationale: Глагол זרה вызывает образ веяния зерна и одновременно допускает смысл рассеивания. «Развеют» сохраняет образ и его разрушительную силу.
- source_word: וִיבֹקְקוּ אֶת־אַרְצָהּ
  choice: и опустошат его землю
  rationale: בקק буквально связано с лишением содержимого, а применительно к стране означает её опустошение. Русское «опустошат» естественно передаёт оба оттенка.
- source_word: כִּי הָיוּ עָלֶיהָ
  choice: Ведь … они нападут на него
  rationale: כִּי вводит пояснение. Перфект הָיוּ в пророческом контексте относится к несомненному будущему; сочетание היה על выражает враждебное выступление против кого-либо, поэтому «нападут» яснее буквального «будут против».
- source_word: מִסָּבִיב
  choice: со всех сторон
  rationale: Передаёт окружение и всесторонний натиск.
- source_word: בְּיוֹם רָעָה
  choice: в день бедствия
  rationale: רָעָה здесь означает постигшее Вавилон несчастье, а не нравственное зло.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Родовые местоимения согласованы с русским названием «Вавилон» (мужской род), хотя в еврейском тексте город олицетворён в женском роде. Инверсия «пошлю Я» умеренно подчёркивает говорящего, не создавая архаической тяжеловесности.
