id: JER.51.1
reference: Jeremiah 51:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מֵעִ֣יר עַל בָּבֶ֔ל וְ/אֶל יֹשְׁבֵ֖י לֵ֣ב קָמָ֑י ר֖וּחַ מַשְׁחִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/001.yaml
  text: 'Thus says Yahweh: Behold[a], I am stirring up against Babylon, and against the inhabitants of Leb-kamai[b], a destroying wind.'
translation:
  language: ru
  text: 'Так говорит ГОСПОДЬ: «Вот, Я поднимаю на Вавилон и на жителей Лев-Камая[a] губительный ветер[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Лев-Камай», вероятно, зашифрованное методом атбаш название Халдеи, то есть Вавилонии. Возможно и буквальное понимание: «сердце Моих противников».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «губительный дух». Еврейское слово может означать «ветер», «дух» или «дыхание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача священного имени тетраграмматона прописными буквами; она сохраняет его особый заветный статус, не вводя спорную реконструкцию произношения.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Форма привлекает внимание к близкому и решительному действию Бога; «вот» естественно сохраняет торжественный пророческий регистр.
- source_word: מֵעִיר
  choice: поднимаю
  rationale: Причастие породы hифиль от עור означает побуждение или приведение в действие. В сочетании с образом ветра «поднимаю» звучит естественно и сохраняет значение возбуждения силы суда.
- source_word: עַל / וְאֶל
  choice: на … и на
  rationale: В контексте суда предлоги обозначают враждебную направленность действия. Повтор «на» сохраняет параллельное построение еврейской фразы.
- source_word: בָּבֶל
  choice: Вавилон
  rationale: Устоявшееся русское название города и державы.
- source_word: יֹשְׁבֵי
  choice: жителей
  rationale: Причастная форма обозначает совокупность живущих в данном месте; «жители» — точная и естественная передача.
- source_word: לֵב קָמָי
  choice: Лев-Камая
  rationale: Выражение, вероятнее всего, служит зашифрованным посредством атбаша названием Халдеи. Транслитерация сохраняет особенность исходного текста и параллель с Вавилоном; буквальное понимание вынесено в примечание.
- source_word: רוּחַ
  choice: ветер
  rationale: В данном образе суда и при глаголе «поднимаю» наиболее естественно значение «ветер», однако слово также может означать «дух», поэтому неоднозначность отмечена в примечании.
- source_word: מַשְׁחִית
  choice: губительный
  rationale: Причастие hифиля характеризует ветер по его разрушительному действию. «Губительный» естественно для современного литературного русского и сохраняет активную угрозу образа.
theological_decisions:
- issue: Следует ли понимать רוּחַ как безличный ветер или как дух
  choice: ветер
  alternative: дух
  rationale: Непосредственный контекст говорит о поднятой Богом силе суда над Вавилоном, а сочетание с «поднимаю» поддерживает образ ветра. Вместе с тем личное или духовное понимание лексически возможно и потому не исключается, а указывается в примечании.
- issue: Как понимать לֵב קָמָי
  choice: кодовое географическое имя «Лев-Камай»
  alternative: «сердце Моих противников»
  rationale: Атбаш-соответствие указывает на Халдею, и название синтаксически стоит параллельно Вавилону. Буквальное прочтение еврейских компонентов остаётся возможным и сохранено в примечании.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис сохранён ясным и компактным; прописное «Я» соответствует русской библейской традиции. Маркеры примечаний поставлены непосредственно после слов, к которым относятся.
