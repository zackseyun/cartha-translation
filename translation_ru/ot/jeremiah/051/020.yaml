  yaml_path: translation/ot/jeremiah/051/020.yaml
  text: You are my war club[a], my weapon of battle; with you I shatter nations[b], and with you I destroy kingdoms.
translation:
  language: ru
  text: Ты[b] — Мой молот[a], оружие войны. Тобой Я сокрушаю народы, тобой уничтожаю царства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «боевой топор», «палица»; еврейское слово обозначает сокрушительное орудие.'
    reason: lexical_alternative
  - marker: b
