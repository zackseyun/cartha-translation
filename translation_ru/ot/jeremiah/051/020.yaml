    reason: alternative_reading
lexical_decisions:
- source_word: מַפֵּץ
  choice: боевой молот
  rationale: Существительное обозначает орудие, которым разбивают или сокрушают. «Боевой молот» естественно передаёт образ сокрушительного оружия, не сужая значение до топора.
- source_word: לִי
  choice: Мой
  rationale: Формально «мне/для Меня»; в именной конструкции выражает принадлежность и орудийность, что по-русски естественно передаётся притяжательным местоимением.
- source_word: כְּלֵי מִלְחָמָה
  choice: Моё оружие для битвы
  rationale: Буквально «орудие/снаряжение войны». Единственное число согласовано с единичным адресатом; «оружие для битвы» сохраняет военный смысл и параллелизм.
- source_word: וְנִפַּצְתִּי
  choice: сокрушаю
  rationale: Пиэль выражает сильное разбивание вдребезги. Настоящее время передаёт действенную, торжественную пророческую декларацию и поддерживает связь с образом молота.
- source_word: בְךָ
  choice: Тобой
  rationale: 'Предлог выражает инструментальное значение: адресат служит орудием действия говорящего. Повтор сохранён.'
- source_word: גּוֹיִם
  choice: народы
  rationale: В контексте суда обозначает народы как политические сообщества; «народы» — ясное и традиционно понятное соответствие.
- source_word: וְהִשְׁחַתִּי
  choice: уничтожаю
  rationale: Хифиль от שׁחת означает причинять гибель или разрушение. «Уничтожаю» прямо передаёт усиление в параллельной строке.
- source_word: מַמְלָכוֹת
  choice: царства
  rationale: Слово обозначает царства или владения царей; «царства» точно и естественно сочетается с «народами».
theological_decisions:
- issue: Кто является адресатом единственного числа «ты»
  choice: Сохранить обращение во втором лице единственного числа, не называя адресата в основном тексте.
  alternative: Уточнить адресата как Вавилон, Кира/Мидо-Персию или Израиль/Иакова.
  rationale: Сам стих адресата не называет, а контекст допускает различные толкования. Уточнение в переводе устранило бы подлинную неоднозначность еврейского текста.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Заглавные «Мой», «Моё», «Я» указывают на речь Бога. Краткие параллельные фразы и повтор «Тобой» сохраняют риторику оригинала; двоеточие не добавлено, чтобы не ослаблять образное отождествление.
