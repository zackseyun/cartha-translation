id: JER.51.13
reference: Jeremiah 51:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שכנתי עַל מַ֣יִם רַבִּ֔ים רַבַּ֖ת אֽוֹצָרֹ֑ת בָּ֥א קִצֵּ֖/ךְ אַמַּ֥ת בִּצְעֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/013.yaml
  text: You who dwell by many waters[a], rich in treasures, your end has come[b], the measure of your greed.
translation:
  language: ru
  text: Ты, живущая у многих вод[a], богатая сокровищами, — настал твой конец[b], предел твоей корысти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над многими водами».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «локоть твоей корысти»; вероятно, имеется в виду отмеренный предел неправедной наживы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שכנתי
  choice: Ты, живущая
  rationale: Причастная форма женского рода единственного числа представляет Вавилон как женщину и служит прямым обращением; русский оборот сохраняет и олицетворение города, и продолжающееся состояние.
- source_word: עַל מַיִם רַבִּים
  choice: у многих вод
  rationale: Предлог עַל допускает значения «на, над, у». В контексте города среди реки и каналов выражение «у многих вод» естественно передаёт географический образ, не устраняя более буквального варианта.
- source_word: רַבַּת אֹצָרוֹת
  choice: богатая сокровищами
  rationale: Сочетание выражает изобилие сокровищ; «богатая сокровищами» ясно и естественно передаёт как количество, так и богатство.
- source_word: בָּא קִצֵּךְ
  choice: настал твой конец
  rationale: Перфект обозначает наступивший и несомненный конец; «настал» передаёт прибытие назначенного срока суда.
- source_word: אַמַּת
  choice: предел
  rationale: Буквально слово означает «локоть», меру длины, но здесь метафорически указывает на отмеренную границу или меру; «предел» хорошо согласуется с объявлением конца, а буквальный образ сохранён в сноске.
- source_word: בִּצְעֵךְ
  choice: твоей корысти
  rationale: בצע обозначает корыстное, нередко неправедно или насильственно приобретённое богатство. «Корысть» сохраняет отрицательную нравственную окраску, не сводя значение только к конкретной добыче.
theological_decisions:
- issue: Олицетворённый адресат
  choice: Прямое обращение к Вавилону как к женщине в единственном числе
  alternative: Обращение к отдельной жительнице либо собирательно к населению
  rationale: Женские формы единственного числа соответствуют пророческому олицетворению города; перевод сохраняет грамматику, не добавляя доктринального толкования.
- issue: Связь образа меры с концом Вавилона
  choice: «предел твоей корысти» как приложение, поясняющее наступивший конец
  alternative: Буквальное и неясное «локоть твоей корысти»
  rationale: Еврейская фраза сохраняет напряжённый образ меры, достигшей границы. В основном тексте передан вероятный смысл, а буквальная метафора отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обращения. Женский род последовательно сохраняет олицетворение Вавилона; тире подчёркивает торжественное объявление суда без архаизации.
