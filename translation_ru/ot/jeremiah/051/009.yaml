id: JER.51.9
reference: Jeremiah 51:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: רפאנו אֶת בָּבֶל֙ וְ/לֹ֣א נִרְפָּ֔תָה עִזְב֕וּ/הָ וְ/נֵלֵ֖ךְ אִ֣ישׁ לְ/אַרְצ֑/וֹ כִּֽי נָגַ֤ע אֶל הַ/שָּׁמַ֨יִם֙ מִשְׁפָּטָ֔/הּ וְ/נִשָּׂ֖א עַד שְׁחָקִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/009.yaml
  text: We tried to heal Babylon[a], but she was not healed. Leave her, and let each one go to his own land[c][b], for her judgment has reached to heaven and has been lifted up to the skies.
translation:
  language: ru
  text: Мы пытались исцелить Вавилон[a], но он не был исцелён. Оставьте его, и пойдём — каждый в свою страну[b], потому что суд над ним[c] достиг небес и был вознесён до небесных высот[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мы исцеляли (или исцелили) Вавилон»; из следующей части ясно, что попытка оказалась безуспешной.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «человек — в свою землю».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «приговор ему» или «кара ему». Еврейское слово может обозначать суд, судебное решение или наказание.'
    reason: lexical_alternative
  - marker: d
    text: Еврейское слово обозначает высокие облака или небесные выси.
    reason: cultural_note
lexical_decisions:
- source_word: רפאנו
  choice: мы пытались исцелить
  rationale: Форма буквально означает «мы исцеляли/исцелили», однако последующее «но он не исцелился» показывает безуспешную попытку. Перевод естественно передаёт этот контекстуальный смысл, не утверждая успешного исцеления.
- source_word: בָּבֶל
  choice: Вавилон
  rationale: Традиционное и общепонятное русское название города. В русском языке оно мужского рода, поэтому местоимения согласованы как «он/его», хотя в еврейском названию соответствуют формы женского рода.
- source_word: נִרְפָּתָה
  choice: не исцелился
  rationale: Страдательно-возвратная форма породы нифаль сохраняет параллель с глаголом «исцелить» в первой части.
- source_word: עִזְבוּהָ
  choice: оставьте его
  rationale: Повелительная форма множественного числа с местоименным суффиксом; «оставьте» естественно выражает призыв покинуть Вавилон.
- source_word: וְנֵלֵךְ
  choice: и пойдём
  rationale: Когортатив первого лица множественного числа выражает побуждение говорящих к совместному действию; русское «пойдём» передаёт этот оттенок.
- source_word: אִישׁ לְאַרְצוֹ
  choice: каждый в свою страну
  rationale: 'Буквально: «человек — в свою землю». Дистрибутивное «каждый» точно и естественно передаёт смысл, а «страна» здесь обозначает родную землю каждого.'
- source_word: מִשְׁפָּטָהּ
  choice: суд над ним
  rationale: מִשְׁפָּט охватывает значения суда, судебного решения, приговора и кары. В контексте гибели Вавилона «суд над ним» сохраняет судебный смысл, не сводя его исключительно к преступлению или наказанию.
- source_word: נָגַע אֶל הַשָּׁמַיִם
  choice: достиг небес
  rationale: Глагол נגע с אֶל означает достижение или прикосновение; «достиг небес» естественно передаёт образ.
- source_word: וְנִשָּׂא עַד שְׁחָקִים
  choice: и поднялся до облачных высот
  rationale: Форма нифаль от נשׂא допускает значение «был поднят/вознёсся», а שְׁחָקִים обозначает высокие облака или небесные выси. Формулировка сохраняет вертикальную образность и параллелизм.
theological_decisions:
- issue: Смысл «суда» Вавилона, достигшего небес
  choice: суд над Вавилоном достиг небес
  alternative: его приговор / его кара / его судебное дело достигло небес
  rationale: Контекст говорит о неотвратимом Божьем суде над Вавилоном. При этом широкое значение מִשְׁפָּט не позволяет безоговорочно сузить выражение только до приговора или наказания, поэтому в основном тексте сохранено более ёмкое слово «суд».
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сохраняет резкий переход от безуспешного исцеления к призыву покинуть город. Мужской род местоимений обусловлен грамматическим родом слова «Вавилон» в русском языке.
