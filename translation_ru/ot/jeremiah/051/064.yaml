source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ כָּ֠כָה תִּשְׁקַ֨ע בָּבֶ֤ל וְ/לֹֽא תָקוּם֙ מִ/פְּנֵ֣י הָ/רָעָ֗ה אֲשֶׁ֧ר אָנֹכִ֛י מֵבִ֥יא עָלֶ֖י/הָ וְ/יָעֵ֑פוּ עַד הֵ֖נָּה דִּבְרֵ֥י יִרְמְיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/064.yaml
  text: And you shall say[a], ‘Thus Babylon will sink and will not rise because of the disaster that I am bringing upon her, and they will grow weary.’ Up to this point are the words of Jeremiah.
translation:
  language: ru
  text: 'И скажи: «Так Вавилон погрузится и не поднимется из-за бедствия, которое Я навожу на него; и они изнемогут[a]». До этого места — слова Иеремии.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обессилеют»; «утомятся». В еврейском тексте субъект глагола во множественном числе не назван; вероятно, имеются в виду жители Вавилона.'
    reason: Лексическая вариативность глагола יעף и неоднозначность его подразумеваемого субъекта.
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: И скажи
  rationale: Форма совершенного вида с союзом в последовательности предписаний имеет повелительное значение. По-русски естественно передаётся императивом.
- source_word: כָּכָה
  choice: Так
  rationale: Указательное наречие вводит истолкование символического действия; краткое «так» сохраняет его прямоту и торжественность.
- source_word: תִּשְׁקַע בָּבֶל
  choice: погрузится Вавилон
  rationale: Глагол שׁקע обозначает погружение, уход на дно и отсылает к свитку, брошенному в Евфрат. «Погрузится» ясно передаёт образ, не добавляя отсутствующего в тексте уточнения.
- source_word: וְלֹא תָקוּם
  choice: и больше не поднимется
  rationale: קום здесь противопоставлен погружению. Частица «больше» естественно выражает подразумеваемую окончательность, не меняя смысла отрицания.
- source_word: מִפְּנֵי הָרָעָה
  choice: из-за бедствия
  rationale: מִפְּנֵי выражает причину, а רָעָה в данном контексте означает губительное бедствие, а не нравственное зло.
- source_word: אֲשֶׁר אָנֹכִי מֵבִיא עָלֶיהָ
  choice: которое Я навожу на него
  rationale: Причастие מֵבִיא передаёт предстоящее и уже определённое действие. Русское «наводить бедствие» естественно для контекста суда; местоимение согласовано с русским мужским родом названия «Вавилон».
- source_word: וְיָעֵפוּ
  choice: и они изнемогут
  rationale: Форма 3-го лица множественного числа от יעף означает усталость, бессилие или изнеможение. Неуточнённое «они» сохраняет внезапную смену числа и не навязывает конкретный субъект.
- source_word: עַד הֵנָּה דִּבְרֵי יִרְמְיָהוּ
  choice: До этого места — слова Иеремии
  rationale: Фраза служит заключительной пометой к собранию речений. Такое построение ясно и достойно звучит на современном русском языке.
theological_decisions:
- issue: Значение הָרָעָה в речи о Божьем суде
  choice: бедствие
  alternative: зло; несчастье
  rationale: В контексте суда слово обозначает гибельное бедствие, которое Бог наводит на Вавилон, а не нравственное зло. Перевод сохраняет суровость пророчества, не приписывая тексту иного богословского утверждения.
- issue: Необозначенный субъект וְיָעֵפוּ
  choice: сохранить местоимение «они» без поясняющего существительного
  alternative: «его жители изнемогут»; «вавилоняне изнемогут»
  rationale: Еврейский текст переходит от Вавилона в женском единственном числе к глаголу во множественном числе, не называя субъект прямо. Вероятно, имеются в виду люди Вавилона, однако основной текст не должен устранять эту подлинную неопределённость.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Синтаксис остаётся близким к еврейскому, но не выглядит архаичным. Заглавная буква в «Я» обозначает говорящего Бога согласно русской издательской традиции; грамматический род местоимения при Вавилоне адаптирован к русскому языку.
