    rationale: Хотя формально возможно, в современном русском это преимущественно обозначает буквальную смену статуса/пола. В данном военном пророческом контексте выражение функционирует как древняя сравнительная насмешка об утрате боеспособности; «стали как женщины» передаёт этот смысл без ложной онтологической импликации.
