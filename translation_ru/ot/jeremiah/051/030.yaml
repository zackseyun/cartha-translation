base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/030.yaml
  text: The warriors of Babylon have stopped fighting; they sit in the strongholds[a]. Their strength has failed; they have become like women. Her dwellings are set on fire; her bars are broken.
translation:
  language: ru
  text: Воины Вавилона перестали сражаться, засели в крепостях. Сила их иссякла, они стали как женщины.[a] Её жилища подожгли, её засовы сломаны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть утратили мужество и боевую силу. Это древняя воинская насмешка, отражающая гендерные представления той эпохи.
    reason: Поясняет историческую риторику выражения, не подразумевая буквальной перемены пола.
lexical_decisions:
- source_word: חָדְלוּ גִבּוֹרֵי בָבֶל לְהִלָּחֵם
  choice: Воины Вавилона перестали сражаться
  rationale: Передаёт прекращение боевых действий естественным современным русским языком; גִבּוֹרֵי в военном контексте означает воинов.
- source_word: יָשְׁבוּ בַּמְּצָדוֹת
  choice: засели в крепостях
  rationale: יָשְׁבוּ здесь изображает пассивное укрытие в укреплённых местах; «засели» естественно передаёт этот оттенок, а «крепости» соответствует מְצָדוֹת.
- source_word: נָשְׁתָה גְבוּרָתָם
  choice: Сила их иссякла
  rationale: Глагол обозначает иссякание или истощение; сочетание сохраняет образ полного упадка военной силы и мужества.
- source_word: הָיוּ לְנָשִׁים
  choice: они стали женщинами
  rationale: Формально передаёт древнееврейское выражение без внесения в основной текст сравнительного элемента, отсутствующего явно; исторический риторический смысл пояснён в сноске.
- source_word: הִצִּיתוּ מִשְׁכְּנֹתֶיהָ
  choice: Жилища его подожгли
  rationale: Сохраняет активную форму с неопределённым множественным субъектом. Женский суффикс относится к Вавилону как к городу; по-русски название «Вавилон» мужского рода.
- source_word: נִשְׁבְּרוּ בְרִיחֶיהָ
  choice: засовы его ворот сломаны
  rationale: בְּרִיחִים — запирающие засовы, в данном оборонительном контексте засовы городских ворот; пассивный результат перфекта передан кратким причастием.
theological_decisions:
- issue: Передача הָיוּ לְנָשִׁים
  choice: они стали женщинами
  alternative: они стали как женщины
  rationale: Буквальная формулировка сохраняет резкость древней пророческой насмешки и историческую гендерную образность, обозначающую утрату боевой силы и мужества. Сноска предотвращает ошибочное понимание как буквальной перемены пола.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Засели» выразительно, но не разговорно в данном военном контексте. Местоимения мужского рода согласованы с русским названием города «Вавилон».
