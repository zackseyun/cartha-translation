  source_fidelity: 'Основная последовательность образов и глагольные значения переданы верно: воины прекращают сражаться, остаются в укреплениях, их сила иссякает, жилища поджигают, запоры ломают. Однако «они стали женщинами» в современном русском слишком легко читается как буквальное изменение пола и не передаёт идиоматическую, сравнительно-насмешливую функцию древнееврейского выражения в данном контексте. Женские суффиксы в двух последних членах относятся к персонифицированному Вавилону; их следует сохранить как «её».'
  naturalness: «Засели в крепостях» естественно и уместно в военном контексте. «Стали как женщины» в сочетании со сноской звучит яснее и не создаёт ложного буквального смысла. Формы «её жилища» и «её засовы» литературно естественны при персонификации города, несмотря на мужской грамматический род названия «Вавилон».
  terminology: «Воины», «крепости», «сила», «жилища» и «засовы» адекватны. «Засовы её ворот» обоснованно уточняет оборонительную функцию בְּרִיחֶיהָ, но для более прямого соответствия тексту достаточно «её засовы»; городской контекст уже ясен. Сноска необходима для древней гендерно окрашенной воинской насмешки и не должна навязывать современную оценку.
