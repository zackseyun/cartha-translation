  text: כִּי֩ בָ֨א עָלֶ֤י/הָ עַל בָּבֶל֙ שׁוֹדֵ֔ד וְ/נִלְכְּדוּ֙ גִּבּוֹרֶ֔י/הָ חִתְּתָ֖ה קַשְּׁתוֹתָ֑/ם כִּ֣י אֵ֧ל גְּמֻל֛וֹת יְהוָ֖ה שַׁלֵּ֥ם יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/056.yaml
  text: For a destroyer has come against her[a], against Babylon, and her warriors have been captured; their bows are shattered. For Yahweh is a God of recompense[c][b]; he will surely repay.
translation:
  language: ru
  text: Ибо пришёл на неё, на Вавилон, разоритель[a]; захвачены её воины[b], сокрушены их луки. Ибо Яхве — Бог воздаяния[c]; Он непременно воздаст.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грабитель», «опустошитель».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «её сильные мужи»; здесь имеются в виду воины Вавилона.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Бог возмездия», «Бог отмщения». Еврейское выражение подчёркивает заслуженную отплату.'
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוֹדֵד
  choice: разоритель
  rationale: Причастие обозначает того, кто опустошает, разоряет или грабит. «Разоритель» естественно звучит в военном контексте и не сужает смысл до одного лишь грабежа.
- source_word: בָא עָלֶיהָ עַל בָּבֶל
  choice: пришёл на неё, на Вавилон
  rationale: Повтор предлога עַל сохранён, а пояснительное «на Вавилон» прямо раскрывает, к кому относится местоимение «неё».
- source_word: וְנִלְכְּדוּ
  choice: захвачены
  rationale: 'Форма нифаля передаёт пассивное значение: воины были взяты или пленены.'
- source_word: גִּבּוֹרֶיהָ
  choice: её воины
  rationale: Буквально это «её сильные», но в контексте падения Вавилона речь идёт о его воюющих людях; «воины» ясно передаёт контекстуальный смысл.
- source_word: חִתְּתָה קַשְּׁתוֹתָם
  choice: сокрушены их луки
  rationale: Глагол выражает разрушение или переламывание. «Сокрушены» сохраняет силу военного образа и возвышенный тон.
- source_word: אֵל גְּמֻלוֹת
  choice: Бог воздаяния
  rationale: Существительное указывает на заслуженное ответное возмездие или отплату. «Воздаяние» сохраняет судебно-нравственный смысл, не сводя его к эмоциональной мести.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано русской транслитерацией, а не заменено титулом.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: Он непременно воздаст
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение; наречие «непременно» естественно передаёт эту эмфазу по-русски.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Смысл выражения אֵל גְּמֻלוֹת
  choice: Бог воздаяния
  alternative: Бог отмщения; Бог возмездий
  rationale: Выражение подчёркивает справедливую отплату. Выбранная передача сохраняет широту еврейского понятия и не усиливает без необходимости оттенок мести.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический повтор «на неё, на Вавилон» сохраняет эмфазу и пояснительную структуру еврейского текста; богословская напряжённость понятия справедливого воздаяния не сглажена.
