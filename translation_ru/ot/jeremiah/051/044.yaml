base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/044.yaml
  text: And I will punish Bel in Babylon[a], and I will bring out of his mouth what he has swallowed; nations will no longer stream to him[b]. Even the wall of Babylon has fallen.
translation:
  language: ru
  text: И Я накажу Бела в Вавилоне и исторгну из его уст то, что он поглотил. Народы больше не устремятся к нему потоком[a]. Даже стена Вавилона пала[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальный образ еврейского глагола — движение народов словно водного потока; по смыслу: народы больше не будут стекаться к нему.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стена Вавилона падёт». В пророческой речи еврейский перфект может представлять будущее событие как уже совершившееся, подчёркивая его несомненность.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָקַדְתִּי עַל
  choice: И Я взыщу с
  rationale: В сочетании с עַל глагол פקד в контексте суда означает привлечь к ответу или наказать. «Взыщу с» передаёт судебный смысл и сохраняет достоинство пророческой речи.
- source_word: בֵּל
  choice: Бела
  rationale: Имя-титул вавилонского божества передано традиционной русской транслитерацией «Бел» и поставлено в родительный падеж после «взыщу с».
- source_word: בְּבָבֶל
  choice: в Вавилоне
  rationale: Предлог ב имеет здесь естественное местное значение и указывает на место культа Бела.
- source_word: וְהֹצֵאתִי
  choice: и исторгну
  rationale: Каузативная форма יצא означает заставить выйти, извлечь. «Исторгну» естественно сочетается с образом поглощённого, извлекаемого из уст, и передаёт принудительность действия.
- source_word: אֶת בִּלְעוֹ
  choice: то, что он поглотил
  rationale: בֶּלַע обозначает поглощённое или проглоченное. Развёрнутая передача сохраняет конкретную метафору, не уточняя без основания, идёт ли речь о добыче, дани или пленниках.
- source_word: מִפִּיו
  choice: из его уст
  rationale: Сохранён конкретный образ уст Бела, непосредственно связанный с метафорой поглощения.
- source_word: וְלֹא יִנְהֲרוּ אֵלָיו עוֹד גּוֹיִם
  choice: Народы больше не потекут к нему потоком
  rationale: נהר образно описывает движение народов как поток. Русское выражение сохраняет направление «к нему» и делает водный образ ясно воспринимаемым.
- source_word: גַּם
  choice: Даже
  rationale: Частица вводит дополнительную, кульминационную весть о суде.
- source_word: חוֹמַת בָּבֶל
  choice: стена Вавилона
  rationale: Сохранено единственное число еврейского текста; оно может собирательно обозначать оборонительные стены города.
- source_word: נָפָלָה
  choice: пала
  rationale: 'Форма перфекта передана прошедшим временем как пророческий перфект: будущее событие провозглашается как уже совершившееся ввиду его несомненности.'
theological_decisions:
- issue: К кому относятся местоимения в образах поглощения и движения народов
  choice: Местоимения относятся к Белу, вавилонскому божеству.
  alternative: Их можно шире соотнести с олицетворённым Вавилоном.
  rationale: Ближайший предшествующий референт — Бел; образ извлечения из его уст и последующее «к нему» последовательно развивают обличение божества, одновременно подразумевая падение его культа и города.
- issue: Временное значение נָפָלָה
  choice: «пала» — пророческий перфект.
  alternative: «падёт» — прямое будущее время.
  rationale: Еврейский перфект в пророческой речи может изображать предстоящее событие как несомненно совершившееся. Прошедшее время сохраняет напряжение и риторическую силу оригинала.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Конкретные образы поглощения, уст и потока сохранены; архаичное, но понятное «взыщу с» употреблено ради судебной окраски, а «исторгну» — ради силы принудительного извлечения.
