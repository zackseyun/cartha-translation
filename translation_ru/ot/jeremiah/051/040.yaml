  text: אֽוֹרִידֵ֖/ם כְּ/כָרִ֣ים לִ/טְב֑וֹחַ כְּ/אֵילִ֖ים עִם עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/040.yaml
  text: I will bring them down like lambs to the slaughter[a], like rams with male goats.
translation:
  language: ru
  text: Я сведу их, как ягнят, на заклание[a], как баранов вместе с козлами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как молодых баранов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹרִידֵם
  choice: Я сведу их
  rationale: 'Форма хифиль от ירד выражает побуждение к движению вниз: «свести, привести вниз». «Сведу» сохраняет каузативный и направительный оттенок, не добавляя отсутствующего в тексте указания на способ действия.'
- source_word: כְּכָרִים
  choice: как ягнят
  rationale: כָּרִים может обозначать ягнят или молодых баранов. В основном тексте выбрано естественное русское «ягнят», а более точная возрастно-половая альтернатива сохранена в сноске.
- source_word: לִטְבּוֹחַ
  choice: на заклание
  rationale: Инфинитив от טבח означает убой, заклание. Русское сочетание «свести на заклание» естественно передаёт цель движения и сохраняет торжественно-грозный регистр пророчества.
- source_word: כְּאֵילִים
  choice: как баранов
  rationale: אֵילִים прямо обозначает баранов; возможная ассоциация с силой не вынесена в перевод, поскольку образ животного здесь первичен.
- source_word: עִם עַתּוּדִים
  choice: вместе с козлами
  rationale: עַתּוּדִים обозначает взрослых самцов коз. Русское «козлы» однозначно передаёт это значение, а «вместе с» естественно выражает עִם.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением достоинства и суровой образности пророческой речи. «Заклание» несколько возвышенно, но широко понятно и соответствует жертвенному/убойному образу; при этом перевод не утверждает, что речь идёт именно о культовой жертве.
