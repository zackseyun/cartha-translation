  text: הֶ֣בֶל הֵ֔מָּה מַעֲשֵׂ֖ה תַּעְתֻּעִ֑ים בְּ/עֵ֥ת פְּקֻדָּתָ֖/ם יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/018.yaml
  text: They are vanity[a], a work of delusion[b]; at the time of their punishment they will perish.
translation:
  language: ru
  text: Они — ничтожество, дело обмана[a]; во время их наказания[b] они погибнут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дело заблуждений», «обманчивое изделие» или «предмет насмешки».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «во время их посещения». Здесь «посещение» означает время взыскания и суда над ними.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: ничтожество
  rationale: В полемике против идолов слово обозначает пустоту, тщетность и отсутствие подлинной ценности; «ничтожество» естественно передаёт здесь оценочный смысл, не сводя образ к буквальному «дуновению».
- source_word: הֵמָּה
  choice: они —
  rationale: Самостоятельное местоимение имеет подчёркнутый характер; именная конструкция с тире естественна по-русски.
- source_word: מַעֲשֵׂה תַּעְתֻּעִים
  choice: дело обмана
  rationale: Сочетание характеризует идолов как обманчивое, вводящее в заблуждение изделие; единственное «дело» сохраняет число מַעֲשֵׂה, а отвлечённое «обмана» звучит естественно.
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: во время воздаяния им
  rationale: פְּקֻדָּה в контексте суда означает посещение, оборачивающееся взысканием или наказанием. «Воздаяние им» передаёт судебный смысл и сохраняет местоименный суффикс, не уточняя сверх текста, кто именно является объектом.
- source_word: יֹאבֵדוּ
  choice: они погибнут
  rationale: Глагол אבד здесь имеет непереходный смысл «погибнуть, исчезнуть»; эта формулировка не превращает его в пассивное «будут уничтожены».
theological_decisions:
- issue: Характер полемики против идолов
  choice: Идолы названы ничтожными и обманчивыми изделиями, которым предстоит погибнуть при Божьем взыскании.
  alternative: תַּעְתֻּעִים можно понимать как «насмешка», «заблуждения» или «ошибки», а פְּקֻדָּה — более буквально как «посещение».
  rationale: Контекст Иер 51 и параллель Иер 10:15 поддерживают смысл пустоты идолов и их гибели во время суда, но сноски сохраняют подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Краткий параллелизм и резкость осуждения сохранены; архаичное «суета» не выбрано, поскольку в современном русском оно легко понимается как хлопоты или занятость.
