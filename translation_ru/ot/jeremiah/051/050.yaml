  source_fidelity: 'Основные повеления и обращение переданы верно: פְּלֵטִים מֵחֶרֶב — «спасшиеся от меча», הִלְכוּ — «идите», אַל תַּעֲמֹדוּ — «не останавливайтесь». Имя יְהוָה корректно передано как «Яхве». Однако «Вдали помните Яхве» звучит не вполне естественно и может означать, что Яхве находится вдали, тогда как מֵרָחוֹק характеризует положение адресатов. Формулировка «пусть Иерусалим будет у вас на сердце» передаёт общий смысл, но ослабляет образ движения «взойти/прийти на сердце».'
