base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/050.yaml
  text: You who have escaped the sword[a], go; do not stand still. Remember Yahweh from far away, and let Jerusalem come upon your heart.
translation:
  language: ru
  text: Спасшиеся от меча, идите, не останавливайтесь! Находясь вдали, помните Яхве, и пусть Иерусалим придёт вам на сердце.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть Иерусалим взойдёт на ваше сердце». Это еврейское выражение означает помнить об Иерусалиме и хранить заботу о нём.'
    reason: Пояснение еврейской идиомы и сохранённого образа сердца.
lexical_decisions:
- source_word: פְּלֵטִים מֵחֶרֶב
  choice: Спасшиеся от меча
  rationale: Причастная форма во множественном числе служит прямым обращением к тем, кто избежал гибели от военного насилия; сочетание с «от меча» естественно и близко к еврейскому тексту.
- source_word: הִלְכוּ
  choice: идите
  rationale: Краткий императив передаёт призыв продолжить путь и удалиться от опасности.
- source_word: אַל תַּעֲמֹדוּ
  choice: не останавливайтесь
  rationale: В данном контексте запрет означает не задерживаться и не оставаться на месте; такой перевод естественнее буквального «не стойте».
- source_word: זִכְרוּ מֵרָחוֹק אֶת יְהוָה
  choice: Вдали помните Яхве
  rationale: 'Сохраняется исходный порядок и возможная связь מֵרָחוֹק с призывом помнить: находясь далеко, адресаты должны помнить Бога. «Вдали» звучит по-русски естественно и сохраняет пространственный смысл.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: וִירוּשָׁלִַם
  choice: Иерусалим
  rationale: Употреблена общепринятая русская форма библейского топонима.
- source_word: תַּעֲלֶה עַל לְבַבְכֶם
  choice: пусть Иерусалим будет у вас на сердце
  rationale: Еврейский образ буквально означает, что Иерусалим должен «подняться на сердце». Русская идиома «быть на сердце» сохраняет образ сердца и передаёт внутреннюю память, заботу и озабоченность, не сводя смысл только к мысли.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл выражения об Иерусалиме и сердце
  choice: пусть Иерусалим будет у вас на сердце
  alternative: пусть Иерусалим придёт вам на ум
  rationale: Выбранный вариант сохраняет библейскую антропологическую широту «сердца» — память, привязанность и заботу — и не ограничивает выражение чисто умственным воспоминанием.
translation_notes:
  register: Современный литературный русский язык с краткими повелительными формами и умеренно возвышенным библейским звучанием. Местоимение «вы» не добавлено, поскольку причастное обращение естественно обозначает адресатов. Пунктуация подчёркивает настойчивость призыва.
