  text: אכל/נו הממ/נו נְבוּכַדְרֶאצַּר֮ מֶ֣לֶךְ בָּבֶל֒ הציג/נו כְּלִ֣י רִ֔יק בלע/נו כַּ/תַּנִּ֔ין מִלָּ֥א כְרֵשׂ֖/וֹ מֵֽ/עֲדָנָ֑/י הדיח/נו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/034.yaml
  text: Nebuchadnezzar king of Babylon has devoured me[a]; he has crushed me. He has set me down like an empty vessel; he has swallowed me like a sea monster; he has filled his belly with my delicacies[c][b]; he has cast me out.
translation:
  language: ru
  text: Навуходоносор, царь Вавилона, пожрал меня[c], сокрушил меня; поставил меня, как пустой сосуд; проглотил меня, как морское чудовище[a]; наполнил своё чрево моими лакомствами[b] и изверг меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как огромный змей» или «как дракон». Еврейское слово «таннин» может обозначать огромного змея, драконоподобное существо или морское чудовище; образ проглатывания допускает значение «морское чудовище».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «моими отборными вещами» или «моими усладами».'
    reason: lexical_alternative
  - marker: c
    text: Говорит олицетворённый Сион, или Иерусалим. Некоторые еврейские объектные формы в этой поэтической строке внешне допускают понимание во множественном числе («нас»), однако контекст и форма «моими лакомствами» поддерживают единственное число.
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: אכלנו
  choice: пожрал меня
  rationale: Глагол אכל буквально означает «есть, пожирать». В этой поэтической жалобе «пожрал» сохраняет образ насильственного поглощения.
- source_word: הממנו
  choice: сокрушил меня
  rationale: המם может обозначать смятение, разрушение или опустошение; «сокрушил» естественно передаёт разрушительную силу в данном параллелизме.
- source_word: הציגנו כלי ריק
  choice: поставил меня, словно пустой сосуд
  rationale: Конкретный глагольный образ сохранён без превращения сравнения в отвлечённое утверждение; «словно» делает русскую фразу естественной.
- source_word: בלענו
  choice: проглотил меня
  rationale: Прямое значение בלע — «глотать»; оно продолжает образ пожирания.
- source_word: כתנין
  choice: как морское чудовище
  rationale: תנין может обозначать огромного змея, драконоподобное существо или морское чудовище. В контексте проглатывания выбран широкий и наглядный образ без позднейших сказочных ассоциаций.
- source_word: מלא כרשו
  choice: наполнил своё чрево
  rationale: כרשׂ обозначает брюхо или внутренность. «Чрево» сохраняет телесный, несколько возвышенный поэтический образ.
- source_word: מעדני
  choice: моими лакомствами
  rationale: מעדנים — изысканные яства, драгоценные или приятные вещи; в образе пожирания «лакомства» уместно передают игру метафоры.
- source_word: הדיחנו
  choice: выбросил меня
  rationale: Глагол передаёт удаление или отбрасывание и завершает образ поглощения; «выбросил» не навязывает более узкого физиологического толкования.
theological_decisions:
- issue: Кто говорит и как передать объектные формы
  choice: 'Единственное число: «меня», с пояснением, что говорит олицетворённый Сион/Иерусалим'
  alternative: 'Множественное число: «нас»'
  rationale: Контекст следующего стиха прямо связывает жалобу с жительницей Сиона, а מַעֲדַנַּי имеет форму первого лица единственного числа. При этом формальная особенность ряда объектных окончаний отмечена в сноске, а не устранена молча.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой поэзии. Сохранена последовательность телесных образов: пожирание, проглатывание, наполненное чрево и отбрасывание. «Чрево» выбрано как узнаваемое поэтическое слово; остальная лексика остаётся доступной обычному современному читателю.'
