  text: וְ/שִׁלַּמְתִּ֨י לְ/בָבֶ֜ל וּ/לְ/כֹ֣ל יוֹשְׁבֵ֣י כַשְׂדִּ֗ים אֵ֧ת כָּל רָעָתָ֛/ם אֲשֶׁר עָשׂ֥וּ בְ/צִיּ֖וֹן לְ/עֵֽינֵי/כֶ֑ם נְאֻ֖ם יְהוָֽה׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/024.yaml
  text: And I will repay Babylon and all the inhabitants of Chaldea for all their evil that they have done in Zion before your eyes[a], declares Yahweh.
translation:
  language: ru
  text: Я воздам Вавилону и всем жителям Халдеи за всё зло[a], которое они совершили на Сионе у вас на глазах, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за весь вред, который они причинили». Еврейское слово может обозначать как нравственное зло, так и причинённый вред.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: Я воздам
  rationale: Пиэль глагола שׁלם означает ответное воздаяние за совершённые дела. «Воздам» естественно передаёт судебно-карательный смысл и сохраняет достоинство пророческой речи.
- source_word: לְבָבֶל
  choice: Вавилону
  rationale: Традиционное и общепринятое русское название города; дательный падеж обусловлен глаголом «воздам».
- source_word: וּלְכֹל יוֹשְׁבֵי כַשְׂדִּים
  choice: и всем жителям Халдеи
  rationale: Причастная конструкция означает всех живущих в стране халдеев. «Жители Халдеи» кратко и естественно передаёт территориальный смысл.
- source_word: אֵת כָּל רָעָתָם
  choice: за всё зло
  rationale: רָעָה может обозначать как нравственное зло, так и причинённый вред. В тексте о суде «зло» сохраняет нравственное измерение, а альтернативный смысл отмечен в сноске.
- source_word: אֲשֶׁר עָשׂוּ בְצִיּוֹן
  choice: которое они совершили на Сионе
  rationale: Предлог ב передаётся своим обычным местным значением, без истолковывающей замены на «против Сиона». По-русски применительно к Сиону естественно «на Сионе».
- source_word: לְעֵינֵיכֶם
  choice: у вас на глазах
  rationale: Живой современный русский эквивалент идиомы, подчёркивающей, что адресаты были очевидцами совершённого.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественную силу устойчивой пророческой формулы и ясно представляет последующие слова как божественное изречение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; форма «Яхве» передаёт личное имя, не подменяя его титулом.
- issue: Направленность злодеяния в выражении בְצִיּוֹן
  choice: на Сионе
  alternative: против Сиона
  rationale: Исходный предлог естественно выражает место действия. Хотя контекст подразумевает враждебность к Сиону, перевод не делает эту направленность явной вопреки грамматической форме.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным пророческим звучанием. Синтаксис сохраняет последовательность еврейского высказывания без ненужной архаизации.
