  yaml_path: translation/ot/jeremiah/051/063.yaml
  text: And when you finish reading this scroll[a], tie a stone to it and throw it into the midst of the Euphrates[b],
translation:
  language: ru
  text: И когда ты закончишь читать этот свиток[a], привяжи к нему камень и брось его в середину Евфрата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эту книгу». Еврейское סֵפֶר может обозначать письменный текст или документ вообще; здесь, вероятно, имеется в виду свиток.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּתְךָ לִקְרֹא
  choice: И когда ты закончишь читать
  rationale: Оборот וְהָיָה с כְּ и инфинитивом задаёт будущее временное обстоятельство. Русское «И когда ты закончишь читать» естественно передаёт эту функцию, не воспроизводя буквально еврейскую экзистенциальную формулу.
- source_word: אֶת־הַסֵּפֶר הַזֶּה
  choice: этот свиток
  rationale: Слово סֵפֶר обозначает письменный текст или документ; в данном историческом контексте речь, вероятнее всего, идёт о свитке, а не о книге в современном переплёте.
- source_word: תִּקְשֹׁר עָלָיו אֶבֶן
  choice: привяжи к нему камень
  rationale: Глагол קשר означает «связать, привязать», а עָלָיו указывает на прикрепление камня к свитку. Формулировка ясна и естественна по-русски.
- source_word: וְהִשְׁלַכְתּוֹ
  choice: и брось его
  rationale: Форма породы хифиль от שלך означает «бросить, метнуть». «Брось» сохраняет прямой характер повеления без излишне архаического оттенка.
- source_word: אֶל־תּוֹךְ פְּרָת
  choice: в Евфрат
  rationale: В основном тексте употреблена естественная русская конструкция с названием реки. Более буквальное значение תּוֹךְ — внутреннее пространство или середина — сохранено в примечании.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повеления переданы прямо и просто. Сохранено обращение к одному лицу мужского рода. Конечная запятая исходного фрагмента не воспроизводится, поскольку стих по-русски оформлен как завершённое предложение.
