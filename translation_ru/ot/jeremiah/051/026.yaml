  source_fidelity: 'Смысловая структура передана верно: обращение к олицетворённому Вавилону, отрицание будущего использования его камня в строительстве и итоговое пророчество о постоянном запустении сохранены. Однако «останешься развалинами» предполагает уже наличное состояние и несколько сужает שִׁמְמוֹת («запустение, опустошённость») до материальных руин. «Станешь вечным запустением» точнее передаёт будущее תִּהְיֶה и образ окончательного разорения. «Оснований» сохраняет множественное число מוֹסָדוֹת.'
