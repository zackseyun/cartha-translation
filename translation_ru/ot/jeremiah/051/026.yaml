  terminology: «Яхве» последовательно передаёт יהוה. «Краеугольный камень» сохранён только как допустимая альтернатива, поскольку основной текст не должен превращать менее закреплённое еврейское выражение в технический термин. «Вечное запустение» — устойчивое и точное русское соответствие образу שִׁמְמוֹת עוֹלָם.
