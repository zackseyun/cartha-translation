  text: וְ/לֹֽא יִקְח֤וּ מִמְּ/ךָ֙ אֶ֣בֶן לְ/פִנָּ֔ה וְ/אֶ֖בֶן לְ/מֽוֹסָד֑וֹת כִּֽי שִׁמְמ֥וֹת עוֹלָ֛ם תִּֽהְיֶ֖ה נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/026.yaml
  text: And they will not take from you a stone for a corner or a stone for foundations[a], for you will be everlasting desolations[b], declares Yahweh.
translation:
  language: ru
  text: И не возьмут из тебя ни камня для угла[a], ни камня для оснований, потому что ты станешь вечным запустением[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «краеугольного камня»; буквально: «камня для угла».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вечными запустениями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְחוּ
  choice: возьмут
  rationale: Qal imperfect 3-го лица множественного числа с отрицанием выражает здесь будущее пророческое утверждение.
- source_word: מִמְּךָ
  choice: из тебя
  rationale: Суффикс 2-го лица мужского рода единственного числа сохраняет прямое обращение к олицетворённому Вавилону; «из тебя» естественно передаёт извлечение камня из разрушенного города.
- source_word: אֶבֶן לְפִנָּה
  choice: камня для угла
  rationale: Сохраняет буквальный строительный образ и не сужает выражение до терминологического «краеугольного камня».
- source_word: וְאֶבֶן לְמוֹסָדוֹת
  choice: ни камня для основания
  rationale: В отрицательной русской конструкции повторное «ни» естественно; собирательное «основание» передаёт назначение камня, тогда как буквальное множественное число по-русски звучит менее естественно.
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание предыдущего утверждения.
- source_word: שִׁמְמוֹת עוֹלָם
  choice: навеки останешься развалинами
  rationale: Передаёт длительность עוֹלָם и множественное שִׁמְמוֹת; «развалины» естественно описывает окончательное запустение города.
- source_word: תִּהְיֶה
  choice: останешься
  rationale: В контексте необратимого суда естественно передаёт будущее состояние, не усиливая глагол до однозначного «станешь».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественную пророческую формулу и передаёт личное имя יהוה как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное Божье имя; транслитерация сохраняет это различие.
- issue: Характер окончательного запустения Вавилона
  choice: навеки останешься развалинами
  alternative: станешь вечным запустением
  rationale: Сохранены образ длительного суда и грамматическое множественное число, без добавления более узкого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Парная конструкция «ни… ни…» делает фразу естественной, а прямое обращение к Вавилону и строительный образ оригинала сохранены.
