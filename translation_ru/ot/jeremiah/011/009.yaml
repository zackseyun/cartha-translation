base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/009.yaml
  text: And Yahweh said to me[b][a], “A conspiracy has been found among the men of Judah and among the inhabitants of Jerusalem.”
translation:
  language: ru
  text: 'И сказал мне Яхве: «Среди людей Иудеи и среди жителей Иерусалима обнаружен заговор».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Раскрыт сговор»; слово также может обозначать мятежный или изменнический заговор.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Ваййиктоль от אמר продолжает повествовательную последовательность; союз «и» естественно сохраняет связь с предыдущим контекстом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֵלָי
  choice: мне
  rationale: Естественная русская передача предлога с суффиксом первого лица единственного числа при глаголе речи.
- source_word: נִמְצָא
  choice: обнаружен
  rationale: Нифаль перфекта מצא сообщает об установленном, выявленном факте; краткое страдательное причастие естественно по-русски.
- source_word: קֶשֶׁר
  choice: заговор
  rationale: В пророческом и политическом контексте слово обозначает заговор, сговор или мятежный умысел; «заговор» ясно передаёт основной смысл, не усиливая его до государственной измены.
- source_word: בְּאִישׁ יְהוּדָה
  choice: среди жителей Иудеи
  rationale: Единственное число אִישׁ употреблено собирательно. «Жители Иудеи» передаёт группу людей естественнее, чем буквальное «муж Иудеи», и не ограничивает смысл только взрослыми мужчинами.
- source_word: וּבְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: и жителей Иерусалима
  rationale: Субстантивированное причастие от ישב обозначает живущих в городе; повтор предлога в русском предложении можно опустить без потери параллелизма и смысла.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон. Форма «Яхве» сохраняет личное имя и соответствует наиболее принятой научной реконструкции произношения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Собирательное выражение בְּאִישׁ יְהוּדָה передано гендерно нейтральным и естественным «среди жителей Иудеи»; повтор «жителей» сохраняет параллель между Иудеей и Иерусалимом.
