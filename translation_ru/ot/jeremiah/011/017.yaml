id: JER.11.17
reference: Jeremiah 11:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ הַ/נּוֹטֵ֣עַ אוֹתָ֔/ךְ דִּבֶּ֥ר עָלַ֖יִ/ךְ רָעָ֑ה בִּ֠/גְלַל רָעַ֨ת בֵּֽית יִשְׂרָאֵ֜ל וּ/בֵ֣ית יְהוּדָ֗ה אֲשֶׁ֨ר עָשׂ֥וּ לָ/הֶ֛ם לְ/הַכְעִסֵ֖/נִי לְ/קַטֵּ֥ר לַ/בָּֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/017.yaml
  text: And Yahweh of Armies[a], who planted you, has spoken disaster against you because of the evil of the house of Israel and the house of Judah, which they have done to themselves, provoking me to anger by making offerings to Baal.
translation:
  language: ru
  text: И Яхве Воинств, посадивший тебя, провозгласил бедствие против тебя за зло дома Израиля и дома Иуды, которое они совершили для себя[a], вызывая Мой гнев тем, что воскуряли Ваалу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которое они сделали для себя». Возможны также понимания: «которое они сами совершили» или «которое они совершили себе во вред».'
    reason: Сохраняет неоднозначность дательного местоимения לָהֶם, не закрепляя в основном тексте саморазрушительное следствие.
  - marker: b
    text: 'Или: «приносили Ваалу дымные жертвы». Еврейский глагол означает производить дым при ритуальном приношении и часто относится к воскурению благовоний.'
    reason: Указывает на культовый смысл קטר и возможный более широкий объём значения.
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: И Яхве Воинств
  rationale: Личное имя יהוה передано как «Яхве», а צְבָאוֹת — прозрачным современным титулом «Воинств», обозначающим силы под Его властью.
- source_word: הַנּוֹטֵעַ אוֹתָךְ
  choice: посадивший тебя
  rationale: Сохраняется образ посадки дерева, продолжающий образ маслины в ближайшем контексте.
- source_word: דִּבֶּר עָלַיִךְ רָעָה
  choice: провозгласил бедствие над тобой
  rationale: רָעָה здесь означает грядущее бедствие как суд, а не нравственное зло; глагольный образ произнесённого решения сохранён.
- source_word: רָעַת בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: зло дома Израиля и дома Иуды
  rationale: Во втором употреблении корня רע речь идёт о нравственном зле; «дом» сохраняет родовой и общинный смысл выражения.
- source_word: אֲשֶׁר עָשׂוּ לָהֶם
  choice: которое они совершили себе же во вред
  rationale: Дательный לָהֶם не опущен и передаёт направленность последствий на самих виновных, однако его синтаксическая неоднозначность отмечена в сноске.
- source_word: לְהַכְעִסֵנִי
  choice: вызывая Мой гнев
  rationale: Каузативная форма выражает действие, вызывающее гнев Бога; русский оборот естественен и сохраняет причинную связь.
- source_word: לְקַטֵּר לַבָּעַל
  choice: тем, что воскуряли Ваалу
  rationale: קטר обозначает создание дыма в культовом приношении, часто воскурение благовоний; «воскуряли» точно и лаконично передаёт ритуальный смысл.
theological_decisions:
- issue: Передача имени и титула יהוה צבאות
  choice: Яхве Воинств
  alternative: Господь Саваоф; Господь Воинств
  rationale: Транслитерация сохраняет личное заветное имя, а перевод титула делает его смысл понятным современному читателю без архаического «Саваоф».
- issue: Два значения слов от корня רע
  choice: «бедствие» в первом случае и «зло» во втором
  alternative: «зло» в обоих случаях; «бедствие» и «нечестие»
  rationale: Контекст различает объявленный Богом суд и нравственное зло Израиля и Иуды. Разные русские соответствия передают это различие, не приписывая Богу нравственного зла.
- issue: Значение לָהֶם в אֲשֶׁר עָשׂוּ לָהֶם
  choice: себе же во вред
  alternative: для себя; сами; опустить в гладком переводе
  rationale: Форма допускает дательный заинтересованности или результата. Основной текст передаёт саморазрушительный результат поступка, а сноска сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Метафора посадки и повтор корня רע переданы смыслово; архаизм «Саваоф» не использован.
