  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אָר֣וּר הָ/אִ֔ישׁ אֲשֶׁר֙ לֹ֣א יִשְׁמַ֔ע אֶת דִּבְרֵ֖י הַ/בְּרִ֥ית הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/003.yaml
  text: 'And you shall say to them, ‘Thus says the LORD, the God of Israel: Cursed is the man who does not listen to the words of this covenant,’'
translation:
  language: ru
  text: 'И скажи им: «Так говорит Господь, Бог Израиля: проклят человек, который не слушает слов этого завета».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: И скажи им
  rationale: Форма перфекта с последовательным ו в данном контексте передаёт продолжение повеления; естественный русский императив сохраняет обращение к пророку.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, ясная и уместная для современного литературного библейского текста.
- source_word: אָרוּר הָאִישׁ
  choice: проклят человек
  rationale: Сохраняет формулу проклятия и обобщённое единственное число исходного текста.
- source_word: לֹא יִשְׁמַע
  choice: не слушает
  rationale: שׁמע может включать и слушание, и послушание; буквальное «не слушает» сохраняет эту смысловую широту, не сводя выражение только к исполнению.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: слов этого завета
  rationale: Передаёт конструкцию сопряжённого состояния и сохраняет конкретную отсылку к данному завету.
theological_decisions:
- issue: Смысл глагола שׁמע в отношении завета
  choice: не слушает
  alternative: не повинуется
  rationale: Выбрана формулировка, сохраняющая присущую еврейскому глаголу связь слышания с откликом и послушанием, без преждевременного устранения лексической многозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой формулы. Синтаксис сделан естественным, при этом сохранены торжественная формула речи Господа и юридико-заветная терминология.
