base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/019.yaml
  text: 'But I was like a gentle lamb led to the slaughter[a], and I did not know that they had devised plans against me: ‘Let us destroy the tree with its food, and let us cut him off from the land of the living[b], so that his name will be remembered no more.’'
translation:
  language: ru
  text: 'А я был словно кроткий ягнёнок, которого вели на заклание[a], и не знал, что они замышляли против меня: «Уничтожим дерево вместе с его пищей[b] и отсечём его от земли живых, чтобы имя его больше не вспоминалось».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно ручной ягнёнок» либо «словно ягнёнок, привыкший к людям»; значение еврейского определения здесь не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение неясно; буквально: «дерево с его хлебом/пищей». Вероятно, имеется в виду полное уничтожение дерева вместе с его плодами или тем, что его питает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֶבֶשׂ אַלּוּף
  choice: словно кроткий ягнёнок
  rationale: כֶּבֶשׂ означает «ягнёнок», а трудное אַלּוּף в данном контексте, вероятно, характеризует ручное, смирное или ничего не подозревающее животное. «Кроткий» естественно передаёт беззащитность, не устраняя лексическую неопределённость, отмеченную в сноске.
- source_word: יוּבַל לִטְבוֹחַ
  choice: которого ведут на заклание
  rationale: Пассивная форма יבל с инфинитивом טבח означает «ведут/приводят, чтобы заколоть». «Ведут на заклание» сохраняет образ и звучит естественно и достойно по-русски.
- source_word: וְלֹא יָדַעְתִּי
  choice: и не знал
  rationale: Прямая передача формы первого лица; сохраняет простоту и подчёркивает неведение говорящего.
- source_word: חָשְׁבוּ מַחֲשָׁבוֹת
  choice: они замышляют
  rationale: Однокоренная конструкция подчёркивает намеренное составление враждебного замысла. Русское «замышляют» естественно выражает этот смысл без тяжеловесного повтора.
- source_word: נַשְׁחִיתָה
  choice: Уничтожим
  rationale: Когортатив первого лица множественного числа вводит речь заговорщиков; «уничтожим» передаёт и побуждение, и разрушительный замысел.
- source_word: עֵץ בְּלַחְמוֹ
  choice: дерево вместе с его пищей
  rationale: Буквально выражение содержит «дерево» и «его хлеб/пищу», однако его точный образ неясен. Формулировка сохраняет необычность еврейского текста, а вероятный смысл полного уничтожения разъясняется в сноске.
- source_word: וְנִכְרְתֶנּוּ
  choice: и отсечём его
  rationale: Глагол כרת буквально означает «отсекать». Местоименный суффикс мужского рода допускает переход от образа дерева к самому Иеремии; русское «его» сохраняет этот метафорический переход.
- source_word: מֵאֶרֶץ חַיִּים
  choice: от земли живых
  rationale: Устойчивый древнееврейский оборот обозначает область тех, кто живёт; буквальная и понятная русская формулировка сохраняет образ.
- source_word: וּשְׁמוֹ לֹא יִזָּכֵר עוֹד
  choice: чтобы имя его больше не вспоминалось
  rationale: Нифаль זכר может означать «быть вспоминаемым» или «быть упоминаемым». Выбранный вариант естественно выражает намерение стереть память о человеке, не исключая оттенка упоминания.
theological_decisions:
- issue: Насильственный образ в речи заговорщиков
  choice: Передать как замысел убить Иеремию, сохранив метафору дерева и не вводя в основной текст мессианское истолкование.
  alternative: Передать стих прежде всего как прямое типологическое пророчество о страданиях Христа.
  rationale: Непосредственный контекст говорит о заговоре против самого Иеремии. Возможные позднейшие типологические прочтения относятся к толкованию и не должны добавляться в перевод еврейского текста.
- issue: Неясное выражение עֵץ בְּלַחְמוֹ
  choice: Сохранить формально близкое «дерево вместе с его пищей» и объяснить неясность в сноске.
  alternative: Истолковать как «дерево вместе с его плодами» или иначе конкретизировать образ полного уничтожения.
  rationale: Еврейское לֶחֶם обычно означает «хлеб/пища», а весь оборот остаётся трудным. Сохранение необычного образа не скрывает подлинную неопределённость текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся ясным для широкого читателя; редкое «заклание» сохранено как уместный библейский термин, а подлинные лексические трудности вынесены в сноски.
