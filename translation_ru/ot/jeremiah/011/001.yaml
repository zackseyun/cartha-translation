lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: В пророческой формуле דָּבָר обозначает слово или весть от Бога; «слово» сохраняет традиционную формулу и не сужает смысл.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: которое было к
  rationale: Оборот היה אל буквально выражает то, что слово «было к» пророку. Такая формулировка несколько возвышенна, но понятна и сохраняет характер пророческого вступления; более идиоматично по-русски возможно «которое пришло к».
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Имя передано в принятой русской библейской форме и поставлено в дательном падеже по синтаксису фразы.
- source_word: מֵאֵת
  choice: от
  rationale: 'Предлог указывает на источник слова: оно исходит от Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит прямую речь, продолжающуюся в следующем стихе. В современном русском эту функцию естественно и без потери смысла выполняет двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» сохраняет его как имя, тогда как «Господь» передаёт традиционную замену титулом.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и формульного характера пророческого вступления. Двоеточие естественно вводит речь следующего стиха; оборот «было к» намеренно сохраняет близость к еврейской формуле.
