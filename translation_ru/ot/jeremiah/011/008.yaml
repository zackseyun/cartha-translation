  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹֽא הִטּ֣וּ אֶת אָזְנָ֔/ם וַ/יֵּ֣לְכ֔וּ אִ֕ישׁ בִּ/שְׁרִיר֖וּת לִבָּ֣/ם הָ/רָ֑ע וָ/אָבִ֨יא עֲלֵי/הֶ֜ם אֶֽת כָּל דִּבְרֵ֧י הַ/בְּרִית הַ/זֹּ֛את אֲשֶׁר צִוִּ֥יתִי לַ/עֲשׂ֖וֹת וְ/לֹ֥א עָשֽׂוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/008.yaml
  text: Yet they did not listen or incline their ear[a], but each one walked in the stubbornness of his evil heart; so I brought upon them all the words of this covenant, which I commanded them to do[b], but they did not do them.
translation:
  language: ru
  text: Но они не слушали и не склонили уха своего[a]; каждый поступал по упорству своего злого сердца. Поэтому Я навёл на них все слова этого завета[b], которые Я повелел им исполнить, но они не исполнили их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не слышали»; в данном контексте это выражение также подразумевает отказ повиноваться.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «все слова этого завета». Это выражение может включать не только его повеления, но и объявленные в нём кары за их нарушение.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: не слушали
  rationale: Глагол может означать «слышать», «слушать» или «повиноваться». Здесь сочетание с образом склонённого уха подчёркивает отказ внимать, при этом подразумевая непослушание.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: не склонили уха своего
  rationale: Сохранён понятный по-русски древнееврейский образ внимательного слушания; форма единственного числа соответствует исходному тексту и звучит естественно в устойчивом обороте.
- source_word: וַיֵּלְכוּ אִישׁ
  choice: каждый поступал
  rationale: אִישׁ имеет распределительное значение «каждый», а метафорическое «ходил» естественно передано как образ поведения без ограничения референта мужчинами.
- source_word: בִּשְׁרִירוּת לִבָּם הָרָע
  choice: по упорству своего злого сердца
  rationale: שׁרירות обозначает своевольное упрямство; распределительное «каждый» позволяет естественно передать коллективную форму «их сердце» как «своего сердца».
- source_word: וָאָבִיא עֲלֵיהֶם
  choice: поэтому Я навёл на них
  rationale: Связь передаёт следствие их непослушания; «навёл» естественно сочетается с последующими угрозами и карами завета.
- source_word: כָּל דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: всё, что было сказано в этом завете
  rationale: Буквально «все слова этого завета». Русская формулировка сохраняет широту выражения и позволяет включать как требования, так и объявленные последствия их нарушения.
- source_word: אֲשֶׁר צִוִּיתִי לַעֲשׂוֹת וְלֹא עָשׂוּ
  choice: который Я повелел им исполнять, но они не исполняли
  rationale: Повтор корня עשׂה передан повтором «исполнять», что сохраняет акцент на невыполнении требований завета; местоимение «который» соотнесено с заветом как содержанием предписанного.
theological_decisions:
- issue: Объём выражения «все слова этого завета»
  choice: Сохранить широкое значение посредством «всё, что было сказано в этом завете»
  alternative: «все проклятия этого завета» или «все установления этого завета»
  rationale: Контекст допускает особый акцент на объявленных карах, которые постигли народ, однако еврейский текст говорит о «словах» и не сужает их явно ни до проклятий, ни до заповедей.
- issue: Значение שׁמע в контексте завета
  choice: «не слушали» с примечанием о возможном значении неповиновения
  alternative: «не слышали» или «не повиновались»
  rationale: Так сохраняются одновременно слуховой образ и заложенная в контексте мысль об отказе повиноваться, без устранения смысловой многозначности.
- issue: Распределительное употребление אִישׁ
  choice: «каждый»
  alternative: «каждый мужчина»
  rationale: Слово относится к членам народа распределительно, а не выделяет только взрослых мужчин.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранён образ «склонить ухо», но менее естественное буквальное «ходил» передано глаголом поведения. Местоимение Бога «Я» написано с прописной буквы согласно устойчивой русской библейской практике.
