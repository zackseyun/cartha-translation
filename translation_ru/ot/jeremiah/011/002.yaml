  text: שִׁמְע֕וּ אֶת דִּבְרֵ֖י הַ/בְּרִ֣ית הַ/זֹּ֑את וְ/דִבַּרְתָּ/ם֙ אֶל אִ֣ישׁ יְהוּדָ֔ה וְ/עַל יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/002.yaml
  text: Hear the words of this covenant[a], and speak them to the men of Judah and to the inhabitants of Jerusalem.
translation:
  language: ru
  text: Слушайте слова этого завета и передай эти слова мужчинам Иудеи и жителям Иерусалима.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте первое повеление стоит во множественном числе («слушайте»), а второе — в единственном («передай»). Буквально: «каждому мужчине Иудеи»; это собирательно-распределительное выражение.'
    reason: Сохраняется и поясняется смена грамматического числа, а также распределительное употребление אִישׁ в выражении אִישׁ יְהוּדָה.
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма Qal, повелительное наклонение, 2-е лицо множественного числа. «Слушайте» передаёт призыв не просто услышать звук, а внимательно воспринять сказанное, не сужая значение до «повинуйтесь».
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: слова этого завета
  rationale: Сохраняется прямая конструкция «слова завета» и указательное значение הַזֹּאת — «этого».
- source_word: וְדִבַּרְתָּם
  choice: и передай их
  rationale: Форма Piel, 2-е лицо мужского рода единственного числа, с местоименным суффиксом 3-го лица множественного числа, относящимся к «словам». «Передай их» естественно по-русски выражает повелительное значение речи, адресованной другим, и сохраняет объект.
- source_word: אִישׁ יְהוּדָה
  choice: мужам Иудеи
  rationale: Единственное число אִישׁ здесь имеет собирательно-распределительное значение. «Мужам Иудеи» сохраняет мужскую форму исходного выражения и звучит в dignified literary Russian естественнее буквального «каждому мужу Иудеи».
- source_word: וְעַל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: и жителям Иерусалима
  rationale: При глаголе речи עַל по параллелизму с אֶל обозначает тех, к кому обращены слова; субстантивированное причастие יֹשְׁבֵי передано как «жителям».
theological_decisions:
- issue: Смена числа адресата между שִׁמְעוּ и וְדִבַּרְתָּם
  choice: сохранить переход от множественного «слушайте» к единственному «передай»
  alternative: согласовать оба повеления во множественном числе или истолковать первое как обращение только к Иеремии
  rationale: Масоретский текст действительно меняет число; выравнивание устранило бы подлинную грамматическую напряжённость и могло бы преждевременно решить вопрос об адресатах.
- issue: Мужская собирательная форма אִישׁ יְהוּדָה
  choice: мужам Иудеи
  alternative: народу Иудеи; каждому в Иудее
  rationale: Выбранный вариант сохраняет грамматически мужскую форму и коллективный смысл, не превращая её без указания в полностью обобщённое «народ».
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксическая смена числа намеренно сохранена и объяснена сноской; архаизмы вроде «возвести» и «обитатели» не использованы.
