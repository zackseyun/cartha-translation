base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/006.yaml
  text: 'And Yahweh said to me[a], “Proclaim all these words in the cities of Judah and in the streets of Jerusalem[b], saying: Hear the words of this covenant and do them.”'
translation:
  language: ru
  text: 'И сказал мне Яхве: «Возгласи все эти слова в городах Иудеи и на улицах Иерусалима[a], говоря: „Слушайте[b] слова этого завета и исполняйте их“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на площадях Иерусалима»; еврейское слово обозначает публичные открытые места в городе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «внемлите». В этом контексте глагол может подразумевать послушание, однако следующий призыв — «исполняйте их» — уже прямо требует действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога общепринятой современной русской транслитерацией, а не заменяет его титулом.
- source_word: קְרָא
  choice: возгласи
  rationale: Императив требует публично объявить весть; «возгласи» сохраняет торжественный характер пророческого поручения и естественно звучит в данном контексте.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: В контексте пророческой речи דְּבָרִים означает именно слова или весть; такой перевод также сохраняет связь с последующим выражением «слова этого завета».
- source_word: בְּעָרֵי יְהוּדָה
  choice: в городах Иудеи
  rationale: Прямо передаёт местное значение предлога и географическую конкретность еврейского текста.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִַם
  choice: и на улицах Иерусалима
  rationale: Естественная русская передача публичных открытых мест города; возможное значение «на площадях» отмечено в сноске.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Сохраняет обычную еврейскую формулу, вводящую содержание возглашаемой речи.
- source_word: שִׁמְעוּ
  choice: слушайте
  rationale: Передаёт основное значение глагола и не сливает слушание с исполнением, которое отдельно выражено следующим повелением.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: слова этого завета
  rationale: Сохраняет буквальный образ «слов», лексическую связь с началом стиха и заветный характер речи; «условия завета» было бы более истолковывающим переводом.
- source_word: וַעֲשִׂיתֶם אוֹתָם
  choice: и исполняйте их
  rationale: По-русски ясно выражает требование осуществлять услышанные слова на деле, не утрачивая отдельности второго действия.
theological_decisions:
- issue: Передача заветного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя сохранено как имя, без замены титулом; форма «Яхве» соответствует современной русской научной и литературной передаче.
- issue: Следует ли истолковывать שִׁמְעוּ как прямое повеление повиноваться
  choice: «Слушайте… и исполняйте»
  alternative: «Повинуйтесь словам этого завета»
  rationale: Еврейский текст различает слушание и последующее исполнение. Выбранная формулировка сохраняет эту риторическую и богословскую последовательность, не отрицая того, что слушание в заветном контексте предполагает отклик.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Возгласи» придаёт поручению публичный и торжественный характер, но остаётся понятным; «слушайте» и «исполняйте» ясно сохраняют последовательность двух повелений. Все сноски привязаны к соответствующим словам основного текста.
