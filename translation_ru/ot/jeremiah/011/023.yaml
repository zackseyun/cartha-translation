source:
  edition: WLC
  text: וּ/שְׁאֵרִ֕ית לֹ֥א תִֽהְיֶ֖ה לָ/הֶ֑ם כִּֽי אָבִ֥יא רָעָ֛ה אֶל אַנְשֵׁ֥י עֲנָת֖וֹת שְׁנַ֥ת פְּקֻדָּתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/023.yaml
  text: And no remnant will remain for them[a], for I will bring disaster on the men of Anathoth in the year of their punishment.
translation:
  language: ru
  text: И не останется у них остатка, потому что Я наведу бедствие на мужей Анатота в год их наказания.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в год их посещения». Еврейское слово может означать «посещение» или «взыскание»; здесь речь идёт о посещении с целью наказать.'
    reason: Лексическая многозначность פְּקֻדָּה.
lexical_decisions:
- source_word: וּשְׁאֵרִית לֹא תִהְיֶה לָהֶם
  choice: И не останется у них остатка
  rationale: Существительное שְׁאֵרִית обозначает то, что уцелело, — остаток. Формулировка сохраняет пророчески значимый образ остатка и передаёт идиому с היה естественным русским глаголом «останется».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предшествующего приговора; «потому что» ясно выражает причинную связь в современном русском языке.
- source_word: אָבִיא רָעָה
  choice: Я наведу бедствие
  rationale: В данном контексте רָעָה означает пагубное бедствие как судебное действие, а не нравственное зло. «Наведу» естественно передаёт каузативную форму глагола בוא.
- source_word: אֶל אַנְשֵׁי עֲנָתוֹת
  choice: на мужчин из Анатота
  rationale: אַנְשֵׁי — форма мужского рода со значением «мужчины/люди»; ближайший контекст говорит о мужчинах Анатота, замышлявших против Иеремии. «Из Анатота» звучит по-русски естественнее буквального «мужчин Анатота».
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: в год их наказания
  rationale: פְּקֻדָּה может обозначать посещение, надзор, взыскание или наказание. В этом пророчестве о суде контекст требует карательного смысла, а «год» сохраняет конкретное שְׁנַת.
theological_decisions:
- issue: Значение רָעָה, когда бедствие исходит от Бога
  choice: бедствие
  alternative: зло
  rationale: Контекст говорит о гибельном судебном событии, а не о нравственном зле; перевод не приписывает Богу того, чего еврейский текст здесь не утверждает.
- issue: Объём выражения אַנְשֵׁי עֲנָתוֹת
  choice: мужчины из Анатота
  alternative: жители Анатота
  rationale: Выбранный вариант сохраняет грамматический мужской род и связь с заговорщиками из ближайшего контекста, не расширяя обозначение без текстового основания.
- issue: Смысл פְּקֻדָּה
  choice: наказание
  alternative: посещение
  rationale: Судебный контекст определяет посещение как карательное, однако более широкая семантика слова отмечена в сноске, чтобы не скрывать исходную многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранён термин «остаток» и конкретное временное выражение «в год». Топоним передан непосредственно с еврейского как «Анатот», а не в традиционной русской форме «Анафоф».
