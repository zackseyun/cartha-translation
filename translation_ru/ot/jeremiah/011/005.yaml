  text: לְמַעַן֩ הָקִ֨ים אֶת הַ/שְּׁבוּעָ֜ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֽוֹתֵי/כֶ֗ם לָ/תֵ֤ת לָ/הֶם֙ אֶ֣רֶץ זָבַ֥ת חָלָ֛ב וּ/דְבַ֖שׁ כַּ/יּ֣וֹם הַ/זֶּ֑ה וָ/אַ֥עַן וָ/אֹמַ֖ר אָמֵ֥ן יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/005.yaml
  text: so that I may establish the oath that I swore to your fathers[a], to give them a land flowing with milk and honey, as it is this day.” And I answered and said, “Amen[b], Yahweh.”
translation:
  language: ru
  text: 'чтобы исполнить клятву, которую Я дал вашим отцам[a], — дать им землю, текущую молоком и мёдом, как и по сей день». И я ответил: «Аминь, Яхве[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вашим предкам». Буквально: «вашим отцам».'
    reason: lexical_alternative
  - marker: b
    text: '«Яхве» передаёт еврейское имя יהוה (ЙХВХ); традиционно: «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое значение союза и естественно связывает стих с предшествующим повелением.
- source_word: הָקִים אֶת הַשְּׁבוּעָה
  choice: исполнить клятву
  rationale: В сочетании с «клятвой» каузативная форма קום означает привести поклявшееся в исполнение; по-русски «исполнить клятву» естественнее буквального «утвердить клятву».
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי
  choice: которой Я поклялся
  rationale: Сохраняет повтор корня/смысла «клятва — поклялся», заметный в еврейском тексте.
- source_word: לַאֲבוֹתֵיכֶם
  choice: вашим отцам
  rationale: Формально передаёт мужской род и традиционное заветное обозначение предков; более общее «предкам» вынесено в примечание.
- source_word: לָתֵת לָהֶם
  choice: дать им
  rationale: Прямо передаёт инфинитив, раскрывающий содержание клятвы.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: землю, где текут молоко и мёд
  rationale: Сохраняет образ изобилия и звучит естественно в современном русском языке.
- source_word: כַּיּוֹם הַזֶּה
  choice: как это и есть сегодня
  rationale: Передаёт указание на нынешнюю для говорящего реальность как подтверждение исполнения обещания.
- source_word: וָאַעַן וָאֹמַר
  choice: И я ответил
  rationale: Русский глагол «ответил» уже включает значение речи; буквальное «ответил и сказал» здесь было бы неестественным семитизмом.
- source_word: אָמֵן
  choice: Аминь
  rationale: Сохраняет традиционную форму подтверждения и согласия, не сужая смысл до одного толкования вроде «да будет так».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Значение הָקִים применительно к клятве
  choice: исполнить клятву
  alternative: утвердить клятву
  rationale: Контекст говорит о приведении данного обещания в действие; «утвердить» формальнее, но в современном русском может ошибочно подразумевать лишь подтверждение действительности клятвы.
- issue: Передача לַאֲבוֹתֵיכֶם
  choice: вашим отцам
  alternative: вашим предкам
  rationale: Основной текст сохраняет буквальный и заветный оттенок выражения, а примечание сообщает естественный родовой эквивалент.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит собственное имя Бога. Вариант «Господь» отражает древнюю традицию чтения, но заменяет имя титулом, поэтому приведён в примечании.
- issue: Функция אָמֵן в ответе Иеремии
  choice: Аминь
  alternative: Да будет так
  rationale: Транслитерация сохраняет возможное сочетание согласия, подтверждения и молитвенного пожелания, не разрешая эту смысловую напряжённость однозначно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис упрощён там, где буквальное воспроизведение еврейской формулы было бы неестественно, но сохранены ключевые образы, повтор «клятва — поклялся», личное имя Бога и неоднозначность ответа «Аминь».
