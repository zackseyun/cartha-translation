  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ עַל אַנְשֵׁ֣י עֲנָת֔וֹת הַֽ/מְבַקְשִׁ֥ים אֶֽת נַפְשְׁ/ךָ֖ לֵ/אמֹ֑ר לֹ֤א תִנָּבֵא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/לֹ֥א תָמ֖וּת בְּ/יָדֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/021.yaml
  text: Therefore[a], this is what Yahweh says concerning the men of Anathoth who are seeking your life, saying, “Do not prophesy in the name of Yahweh[c][b], lest you die by our hand.”
translation:
  language: ru
  text: 'Поэтому так говорит Яхве против жителей Анафофа, которые покушаются на твою жизнь[a] и говорят: «Не пророчествуй именем Яхве, иначе погибнешь от наших рук[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ищут твою жизнь»; это еврейский оборот со значением «пытаются убить тебя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и не умрёшь от нашей руки». Отрицательная форма в этом контексте выражает угрозу после запрета.'
    reason: source_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего контекста и естественно связывает изречение с предыдущими стихами.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет узнаваемую пророческую формулу и передаёт личное имя יהוה как «Яхве».
- source_word: עַל אַנְשֵׁי עֲנָתוֹת
  choice: о людях из Анафофа
  rationale: עַל вводит тех, кого касается изречение; אַנְשֵׁי в данном контексте естественно обозначает людей, принадлежащих к этому городу. «Люди из Анафофа» звучит современно и не вносит не подтверждённого текстом уточнения.
- source_word: הַמְבַקְשִׁים אֶת נַפְשְׁךָ
  choice: которые покушаются на твою жизнь
  rationale: Еврейская идиома буквально говорит об «ищущих твою жизнь», но означает намерение убить; русский оборот ясно и естественно передаёт её смысл.
- source_word: לֹא תִנָּבֵא בְּשֵׁם יְהוָה
  choice: Не пророчествуй именем Яхве
  rationale: Форма выражает прямой запрет, а בְּשֵׁם указывает на выступление с властью и от имени Яхве.
- source_word: וְלֹא תָמוּת בְּיָדֵנוּ
  choice: иначе умрёшь от нашей руки
  rationale: В контексте это угроза, присоединённая к запрету. Такая формулировка естественно выражает её прагматический смысл, а буквальная отрицательная форма отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное заветное имя; транслитерация сохраняет различие между именем יהוה и титулом «Господь».
- issue: Отрицательная форма угрозы וְלֹא תָמוּת
  choice: иначе умрёшь
  alternative: и не умрёшь / чтобы тебе не умереть
  rationale: В прямой речи заговорщиков отрицательная конструкция действует как угроза после запрета. Основной текст передаёт речевую силу, а сноска сохраняет формальную неоднозначность.
- issue: אַנְשֵׁי как обозначение участников заговора
  choice: люди из Анафофа
  alternative: мужчины из Анафофа
  rationale: Хотя форма грамматически мужского рода, множественное אֲנָשִׁים может обозначать людей или жителей без обязательного смыслового акцента на поле; русский вариант не расширяет группу и остаётся естественным.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Формула «так говорит Яхве» оставлена краткой и торжественной; идиома о поиске жизни раскрыта естественным русским выражением, а формальная неоднозначность заключительной угрозы сохранена в сноске.
