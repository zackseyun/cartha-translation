  source_fidelity: 'Основной смысл передан верно: речь идёт о жителях Анафофа, стремящихся убить Иеремию и запрещающих ему пророчествовать именем Яхве. Однако עַל в контексте судебного изречения лучше передать как «против», а не нейтральным «о». Заключительная фраза — формально отрицательная, но прагматически угрожающая; «иначе погибнешь от наших рук» естественно передаёт угрозу, не делая «руку» неестественным русским единственным числом.'
