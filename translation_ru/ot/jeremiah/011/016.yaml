revisions:
- from: «Зелёной маслиной, прекрасной, с добрыми плодами» назвал тебя Господь. Но при звуке сильного грохота Он зажёг вокруг неё огонь, и ветви её погибли.
  to: «Зелёной маслиной, прекрасной плодами и обликом» назвал тебя Господь. При звуке великого шума Он поджёг её, и ветви её уничтожены.
  rationale: Устранены добавленный противительный союз и добавленное пространственное значение. Восстановлен смысловой компонент «облик» в трудном описании маслины; итоговый перевод остаётся ясным и литературным, не навязывая спорного синтаксического анализа сверх необходимого.
