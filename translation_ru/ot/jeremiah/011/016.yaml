  text: זַ֤יִת רַֽעֲנָן֙ יְפֵ֣ה פְרִי תֹ֔אַר קָרָ֥א יְהוָ֖ה שְׁמֵ֑/ךְ לְ/ק֣וֹל הֲמוּלָּ֣ה גְדֹלָ֗ה הִצִּ֥ית אֵשׁ֙ עָלֶ֔י/הָ וְ/רָע֖וּ דָּלִיּוֹתָֽי/ו־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/016.yaml
  text: The LORD called your name, ‘A green olive tree, beautiful with good fruit.’ At the sound of a great roar he set fire to it, and its branches are ruined.
translation:
  language: ru
  text: «Зелёной маслиной, прекрасной плодами и обликом» назвал тебя Господь. При звуке великого шума Он поджёг её, и ветви её уничтожены.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַיִת רַעֲנָן
  choice: зелёная маслина
  rationale: Передаёт образ свежего, пышно растущего оливкового дерева; «маслина» естественна для библейского литературного регистра.
- source_word: יְפֵה פְרִי תֹאַר
  choice: прекрасная, с добрыми плодами
  rationale: Масоретская фраза синтаксически трудна. Перевод сохраняет характеристику красоты и качества плода, не вводя отсутствующее в тексте отдельное понятие «формы».
- source_word: לְקוֹל הֲמוּלָּה גְדֹלָה
  choice: при звуке сильного грохота
  rationale: הֲמוּלָּה обозначает громкий шум, гул или грохот; выражение передаёт слуховой образ и масштаб события.
- source_word: הִצִּית אֵשׁ עָלֶיהָ
  choice: Он зажёг вокруг неё огонь
  rationale: Предлог עַל допускает значение «на/против/вокруг»; в русском «зажёг вокруг неё огонь» естественно описывает охват дерева пламенем и не требует неуклюжего «зажёг огонь на ней».
- source_word: וְרָעוּ דָּלִיּוֹתָיו
  choice: и ветви её погибли
  rationale: Редкая форма רָעוּ здесь понимается как повреждение или уничтожение ветвей огнём; «погибли» ясно передаёт результат, сохраняя образ.
theological_decisions:
- issue: Обозначение имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционное русское соответствие тетраграмматону в основном тексте; оно не добавляет конфессионального толкования и остаётся понятным широкому читателю.
- issue: Кто зажигает огонь
  choice: Он — Господь
  alternative: Безличная или неопределённая конструкция
  rationale: Глагол הִצִּית стоит в мужском роде, единственном числе, и ближайший названный деятель — יהוה; местоимение сохраняет эту грамматическую связь.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Смена от обращения «тебя» к описанию дерева в третьем лице сохранена вслед за еврейским текстом; кавычки обозначают данное Господом образное имя.
