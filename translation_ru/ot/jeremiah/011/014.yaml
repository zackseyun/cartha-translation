  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַתָּ֗ה אַל תִּתְפַּלֵּל֙ בְּעַד הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַל תִּשָּׂ֥א בַעֲדָ֖/ם רִנָּ֣ה וּ/תְפִלָּ֑ה כִּ֣י אֵינֶ֣/נִּי שֹׁמֵ֗עַ בְּ/עֵ֛ת קָרְאָ֥/ם אֵלַ֖/י בְּעַ֥ד רָעָתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/014.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, for I am not listening at the time when they call to me because of their disaster.
translation:
  language: ru
  text: А ты не молись за этот народ и не возноси за них ни вопля, ни молитвы, потому что Я не стану слушать, когда они воззовут ко Мне из-за постигшего их бедствия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за их бедствия». Еврейское слово может также означать «зло», но здесь, вероятнее всего, речь идёт о бедствии, которое их постигло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Самостоятельное местоимение с союзом подчёркивает контрастное обращение к Иеремии; по-русски это естественно передаётся сочетанием «А ты».
- source_word: אַל תִּתְפַּלֵּל
  choice: не молись
  rationale: Отрицательная частица с глагольной формой выражает прямой запрет; «молиться» сохраняет широкий смысл глагола, не сужая его до ходатайства.
- source_word: בְּעַד הָעָם הַזֶּה
  choice: за этот народ
  rationale: Предлог указывает на действие в чью-либо пользу или от чьего-либо имени; русское «молиться за» точно и естественно выражает ходатайственный смысл.
- source_word: וְאַל תִּשָּׂא
  choice: и не возноси
  rationale: Глагол נשא буквально означает «поднимать, нести»; в сочетании с воплем и молитвой русское «возносить» сохраняет образ и звучит естественно.
- source_word: בַעֲדָם רִנָּה וּתְפִלָּה
  choice: за них ни вопля, ни молитвы
  rationale: «За них» передаёт ходатайственную направленность, а конструкция «ни… ни…» естественно соответствует русскому отрицательному контексту. רִנָּה здесь означает громкий настойчивый вопль, а не радостную песнь.
- source_word: כִּי אֵינֶנִּי שֹׁמֵעַ
  choice: потому что Я не стану слушать
  rationale: Отрицание с причастием выражает решительный отказ Бога внимать. Будущая форма по-русски естественно соотносится с последующим «когда… воззовут», не сводя смысл к физической неспособности слышать.
- source_word: בְּעֵת קָרְאָם אֵלַי
  choice: когда они воззовут ко Мне
  rationale: בְּעֵת обозначает время действия; русское «когда» передаёт это без тяжеловесности. «Воззовут» соответствует настойчивому обращению к Богу и поддерживает возвышенный, но понятный регистр.
- source_word: בְּעַד רָעָתָם
  choice: из-за постигшего их бедствия
  rationale: רָעָה может обозначать как нравственное зло, так и бедствие. Здесь речь идёт о беде, побуждающей народ взывать; добавление «постигшего их» ясно обозначает обстоятельство бедствия, не приписывая злу принадлежность народу.
theological_decisions:
- issue: Значение רָעָה в заключительной части стиха
  choice: бедствие, постигшее народ
  alternative: их зло или нечестие
  rationale: В непосредственном контексте народ взывает к Богу во время обрушившейся на него беды. Перевод сохраняет тему суда, но не утверждает, будто люди взывают к Богу ради собственного нравственного зла.
- issue: Значение Божьего «неслышания»
  choice: решительный отказ внимать молитве
  alternative: буквальная неспособность слышать
  rationale: В молитвенном контексте שׁמע означает не просто восприятие звука, а благосклонное слушание и ответ. «Не стану слушать» передаёт сознательный отказ, не вводя дополнительного учения о его длительности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Возноси» и «воззовут» сохраняют поэтический параллелизм и молитвенный регистр, оставаясь понятными современному читателю. Местоимение Бога написано с прописной буквы согласно распространённой русской библейской издательской практике.
