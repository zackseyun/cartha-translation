review_pass:
  verdict: revise
  source_fidelity: Основной текст в целом точно передаёт обращение, титул, причастные характеристики Яхве, образ «почек и сердца», молитвенную модальность אֶרְאֶה и юридический смысл רִיב. Однако «как Ты воздашь им» несколько отходит от конструкции «увидеть Твоё возмездие над ними», а вариант в сноске b («вступишься за меня перед ними») не является надёжной лексической альтернативой נִקְמָתְךָ מֵהֶם.
  naturalness: Стиль современный и литературный. Прямая конструкция «дай мне увидеть Твоё возмездие над ними» естественна в возвышенном молитвенно-пророческом регистре и ближе к оригиналу. «Моё дело» допустимо, хотя сноска должна предлагать именно юридические альтернативы, а не «мою правоту».
  terminology: «Яхве Воинств» последовательно передаёт יהוה צבאות. «Почки и сердце» обоснованно сохранены как конкретный древнееврейский образ и пояснены сноской. «Возмездие» передаёт נקמה без ненужного смягчения или конфессиональной интерпретации.
