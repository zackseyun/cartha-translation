    rationale: 'Это не прямой лексический вариант для נִקְמָתְךָ מֵהֶם: существительное נקמה означает месть, отмщение, воздаяние; выражение «перед ними» также не передаёт מֵהֶם в данном контексте.'
  - severity: low
    issue: Сноска c предлагает «мою правоту».
    rationale: רִיב обозначает спор, тяжбу, судебное дело/иск, а не саму по себе правоту говорящего. Альтернатива чрезмерно интерпретирует юридический термин.
  - severity: low
