source:
  edition: WLC
  text: וַֽ/יהוָ֤ה צְבָאוֹת֙ שֹׁפֵ֣ט צֶ֔דֶק בֹּחֵ֥ן כְּלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/020.yaml
  text: But you[a], O Yahweh of hosts, who judge righteously, who test the kidneys and the heart, let me see your vengeance on them[c][b], for to you I have revealed my case.
translation:
  language: ru
  text: Но Ты, Яхве Воинств, судящий праведно, испытывающий почки и сердце[a], дай мне увидеть Твоё возмездие над ними[b], ибо Тебе я открыл моё дело[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «почки и сердце» — древнееврейский образ сокровенных мыслей, желаний и побуждений человека.'
    reason: cultural_note
  - marker: b
    text: 'Или: «Твою месть им»; «Твоё отмщение им».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «мою тяжбу», «мой спор».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: Но Ты, Яхве Воинств
  rationale: Союз ו передаёт противопоставление контексту; местоимение «Ты» естественно выражает прямое обращение. Имя Яхве передано транслитерацией, а צְבָאוֹת — широким по смыслу титулом «Воинств».
- source_word: שֹׁפֵט צֶדֶק
  choice: судящий праведно
  rationale: Причастная конструкция обозначает постоянное действие и качество Яхве; наречие сохраняет смысл צֶדֶק как праведного, справедливого суда.
- source_word: בֹּחֵן כְּלָיוֹת וָלֵב
  choice: испытывающий почки и сердце
  rationale: 'Сохранён конкретный древнееврейский образ: Бог исследует сокровенные мысли, желания и побуждения человека. Его значение пояснено в сноске.'
- source_word: אֶרְאֶה
  choice: дай мне увидеть
  rationale: Форма имперфекта в молитвенном контексте естественно понимается как просьба, а не как простое предсказание будущего.
- source_word: נִקְמָתְךָ מֵהֶם
  choice: как Ты воздашь им
  rationale: Глагольная формулировка естественна по-русски и передаёт Божье справедливое возмездие, не сводя נקם к человеческой мстительности. Возможен более буквальный вариант, указанный в сноске.
- source_word: כִּי אֵלֶיךָ גִּלִּיתִי אֶת רִיבִי
  choice: ведь Тебе я открыл моё дело
  rationale: «Ведь» вводит основание просьбы; порядок слов сохраняет смысловое выделение адресата. רִיב передан юридически окрашенным словом «дело».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя и отличает его от титула «Господь».
- issue: Образ «почки и сердце»
  choice: сохранить конкретный древнееврейский образ в основном тексте
  alternative: передать смысл как «сокровенные мысли и побуждения»
  rationale: Буквальный образ обеспечивает прозрачность по отношению к оригиналу, а сноска делает его понятным современному читателю.
- issue: Значение נקמה
  choice: воздать
  alternative: совершить возмездие / отомстить
  rationale: Контекст говорит о справедливом Божьем ответе на зло. «Воздать» сохраняет эту судебную направленность, тогда как допустимая более буквальная передача отмечена в сноске.
- issue: Модальность אֶרְאֶה
  choice: 'просьба: «дай мне увидеть»'
  alternative: 'утверждение: «я увижу»'
  rationale: Обращение к Яхве и последующее обоснование благоприятствуют волитивному прочтению, хотя сама форма допускает оттенок будущего.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-пророческой речи. Заглавные буквы в местоимениях прямого обращения к Богу поддерживают традиционный русский почтительный регистр; синтаксис остаётся ясным для обычного читателя.
