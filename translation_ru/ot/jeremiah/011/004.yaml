  text: אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבֽוֹתֵי/כֶ֡ם בְּ/י֣וֹם הוֹצִיאִֽ/י אוֹתָ֣/ם מֵ/אֶֽרֶץ מִצְרַיִם֩ מִ/כּ֨וּר הַ/בַּרְזֶ֜ל לֵ/אמֹ֗ר שִׁמְע֤וּ בְ/קוֹלִ/י֙ וַ/עֲשִׂיתֶ֣ם אוֹתָ֔/ם כְּ/כֹ֥ל אֲשֶׁר אֲצַוֶּ֖ה אֶתְ/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/004.yaml
  text: which I commanded your fathers on the day I brought them out from the land of Egypt[a], from the iron furnace, saying, ‘Listen to my voice and do them, according to all that I command you; and you shall be my people[c][b], and I will be your God,’
translation:
  language: ru
  text: 'который Я заповедал вашим отцам[a] в день, когда вывел их из земли Египта, из железной печи[b], сказав: «Слушайтесь Моего голоса[c] и исполняйте всё, что Я заповедую вам; и вы будете Моим народом, а Я буду вашим Богом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вашим предкам». Буквально: «вашим отцам».'
    reason: lexical_alternative
  - marker: b
    text: «Железная печь» — образ Египта как места тяжёлого угнетения и страдания.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «слушайте Мой голос»; это еврейское выражение подразумевает послушание услышанному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר צִוִּיתִי
  choice: который Я заповедал
  rationale: Относительное местоимение связывает стих с «заветом» в предыдущем стихе; «заповедал» сохраняет властный и заветный характер צוה.
- source_word: אֲבוֹתֵיכֶם
  choice: вашим отцам
  rationale: Буквально передаёт мужское множественное число; в контексте речь идёт о прежних поколениях Израиля.
- source_word: בְּיוֹם הוֹצִיאִי
  choice: когда вывел
  rationale: Еврейское «в день, когда» здесь естественно функционирует как временное указание на исход; русский оборот «когда вывел» точен и не создаёт ненужного ограничения одним календарным днём.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохраняет полную формулу исхода и звучит естественно в достойном современном библейском регистре.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: из железной печи
  rationale: Сохраняет исходную метафору Египта как места жестокого угнетения; пояснение вынесено в сноску.
- source_word: שִׁמְעוּ בְקוֹלִי
  choice: Слушайтесь Моего голоса
  rationale: Конструкция שמע בְּקול обозначает не только слышание, но и отклик послушанием. «Слушайтесь» естественно выражает это значение, а дополнение «голоса» сохраняет образ исходного текста.
- source_word: וַעֲשִׂיתֶם אוֹתָם כְּכֹל אֲשֶׁר אֲצַוֶּה אֶתְכֶם
  choice: и исполняйте всё, что Я заповедую вам
  rationale: Еврейское местоимение множественного числа относится к повелениям или словам. По-русски явное «исполняйте их» было бы неясно без названного антецедента, поэтому смысл точно и естественно выражен через «всё, что».
- source_word: וִהְיִיתֶם לִי לְעָם וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  choice: Тогда вы будете Моим народом, а Я буду вашим Богом
  rationale: Передаёт стандартную формулу заветных отношений. «Тогда» выражает следственную связь формы וְ с предшествующим повелением, не превращая её в отдельное богословское утверждение; «а» естественно сопоставляет обе стороны формулы.
theological_decisions:
- issue: Обозначение предков мужским существительным
  choice: вашим отцам
  alternative: вашим предкам
  rationale: Исходный текст прямо говорит «отцам». Основной текст сохраняет эту форму, а сноска поясняет, что она может обозначать предков или прежние поколения.
- issue: Значение שִׁמְעוּ בְקוֹלִי
  choice: Слушайтесь Моего голоса
  alternative: Слушайте Мой голос
  rationale: В данной конструкции слышание обычно предполагает послушный отклик. Выбранный вариант передаёт эту прагматическую силу, сохраняя упоминание голоса; сноска отмечает буквальную сторону выражения.
- issue: Связь между повелением и формулой завета
  choice: Тогда вы будете Моим народом
  alternative: и вы будете Моим народом
  rationale: Форма וִהְיִיתֶם после повелений допускает следственный оттенок. «Тогда» делает синтаксическую связь понятной, но не уточняет сверх текста природу или основание завета.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены заветная формула и метафора «железной печи»; синтаксис сделан понятным без устранения смысловых оттенков оригинала.
