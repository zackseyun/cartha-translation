  text: שָׁ֩בוּ֩ עַל עֲוֺנֹ֨ת אֲבוֹתָ֜/ם הָ/רִֽאשֹׁנִ֗ים אֲשֶׁ֤ר מֵֽאֲנוּ֙ לִ/שְׁמ֣וֹעַ אֶת דְּבָרַ֔/י וְ/הֵ֣מָּה הָלְכ֗וּ אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָ֑/ם הֵפֵ֤רוּ בֵֽית יִשְׂרָאֵל֙ וּ/בֵ֣ית יְהוּדָ֔ה אֶת בְּרִיתִ֕/י אֲשֶׁ֥ר כָּרַ֖תִּי אֶת אֲבוֹתָֽ/ם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/010.yaml
  text: They have returned to the iniquities of their first fathers[a], who refused to hear my words, and they themselves have gone after other gods to serve them[c][b]. The house of Israel and the house of Judah have broken my covenant that I made with their fathers.
translation:
  language: ru
  text: Они вернулись к беззакониям своих давних предков[a], которые отказывались слушать Мои слова[b], а сами они пошли вслед за другими богами, чтобы служить им. Дом Израиля и дом Иуды нарушили Мой завет, который Я заключил[c] с их предками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «своих первых (или прежних) отцов»; имеются в виду более ранние поколения предков.'
    reason: lexical_alternative
  - marker: b
    text: «Слушать» здесь может включать смысл «внимать и повиноваться».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально древнееврейская идиома: «рассёк завет»; по-русски естественно: «заключил завет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ עַל עֲוֺנֹת
  choice: возвратились к беззакониям
  rationale: Сочетание שוב על здесь обозначает возвращение к прежнему образу поведения. «Беззакония» передаёт нравственную тяжесть עָוֹן точнее, чем общее «грехи».
- source_word: אֲבוֹתָם הָרִאשֹׁנִים
  choice: своих древних предков
  rationale: Буквально выражение означает «их первых/прежних отцов», то есть давние поколения предков. Выбран естественный современный русский эквивалент, а буквальная особенность отмечена в сноске.
- source_word: מֵאֲנוּ לִשְׁמֹעַ אֶת דְּבָרַי
  choice: отказывались слушать Мои слова
  rationale: מָאֵן означает сознательный отказ, а שׁמע допускает как буквальное слушание, так и подразумеваемое послушание. «Слушать» сохраняет эту смысловую широту.
- source_word: וְהֵמָּה
  choice: И сами они
  rationale: Самостоятельное местоимение при уже выраженном субъекте несёт эмфатическую силу; русское «сами они» передаёт это выделение.
- source_word: הָלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: пошли вслед за другими богами
  rationale: Сохранён образ следования за кем-либо, выражающий приверженность и религиозную верность.
- source_word: לְעָבְדָם
  choice: чтобы служить им
  rationale: עבד применительно к божествам включает культовое служение и поклонение; «служить» является прямым соответствием и не сужает значение.
- source_word: בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: Дом Израиля и дом Иуды
  rationale: Повтор слова «дом» сохраняет значимую корпоративную и заветную формулировку оригинала.
- source_word: הֵפֵרוּ אֶת בְּרִיתִי
  choice: нарушили Мой завет
  rationale: В контексте завета Hiphil глагола פרר означает нарушить или расторгнуть. «Нарушили» естественно передаёт действие без предположения, что завет окончательно упразднён.
- source_word: אֲשֶׁר כָּרַתִּי אֶת אֲבוֹתָם
  choice: который Я заключил с их предками
  rationale: Русское устойчивое выражение «заключить завет» естественно соответствует древнееврейской идиоме «срезать завет»; אֵת здесь означает совместность — «с».
theological_decisions:
- issue: Преемственность заветной ответственности нынешнего поколения и предков
  choice: Нынешнее поколение представлено как вернувшееся к беззакониям предков и нарушившее завет, заключённый Богом с предками.
  alternative: Понимать упоминание завета только как историческую справку, не связывающую его с нынешним поколением.
  rationale: Еврейский текст прямо соединяет нынешнее отступничество с грехами прежних поколений и с заветом, заключённым с «их предками». Перевод сохраняет эту связь, не вводя более поздней богословской системы.
- issue: Значение «слушать» как возможное послушание
  choice: Сохранено слово «слушать», допускающее в контексте оттенок послушания.
  alternative: Перевести прямо как «повиноваться».
  rationale: שׁמע нередко включает отклик и послушание, однако формулировка «слушать Мои слова» сохраняет подлинную лексическую широту и не устраняет образ речи и слышания.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Сохранены формулы «Дом Израиля», «дом Иуды» и «Мой завет». Божественные местоимения написаны с прописной буквы в соответствии с принятой русской библейской издательской традицией. Неестественное буквальное «первые отцы» вынесено в сноску.
