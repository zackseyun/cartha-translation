source:
  edition: WLC
  text: מֶ֣ה לִֽ/ידִידִ֞/י בְּ/בֵיתִ֗/י עֲשׂוֹתָ֤/הּ הַֽ/מְזִמָּ֨תָ/ה֙ הָֽ/רַבִּ֔ים וּ/בְשַׂר קֹ֖דֶשׁ יַעַבְר֣וּ מֵֽ/עָלָ֑יִ/ךְ כִּ֥י רָעָתֵ֖/כִי אָ֥ז תַּעֲלֹֽזִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/015.yaml
  text: What right has my beloved in my house[c][b][a], when she has done her many wicked schemes? Can holy flesh remove your evil from you? Then you rejoice!
translation:
  language: ru
  text: Что Моей возлюбленной делать в Моём доме[a], когда она осуществляет свои многочисленные злые замыслы? Разве священное мясо[b] отведёт от тебя зло? И тогда ты ликуешь![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Какое право имеет Моя возлюбленная находиться в Моём доме?» Под «домом» здесь подразумевается храм Господа.'
    reason: lexical_alternative
  - marker: b
    text: «Священное мясо» — вероятно, мясо жертв, которое употребляли во время священной трапезы.
    reason: cultural_note
  - marker: c
    text: 'Еврейский текст этой части стиха труден; более буквально: «И священное мясо пройдёт от тебя; ибо твоё зло — тогда ты ликуешь». Связь между частями фразы не вполне ясна.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֶה לִידִידִי בְּבֵיתִי
  choice: Что Моей возлюбленной делать в Моём доме
  rationale: Оборот מֶה לְ... בְּ... выражает не простой вопрос «что?», а риторическое «что ей здесь делать?/какое она имеет право?». Русская формулировка передаёт эту силу, сохраняя буквальное «дом», которое в контексте означает храм Господа.
- source_word: לִידִידִי
  choice: Моей возлюбленной
  rationale: Слово יְדִיד обозначает любимого, дорогого человека. Женский род согласован с коллективным образом Иудеи или Иерусалима; сохраняется напряжённая, ироническая близость заветных отношений.
- source_word: עֲשׂוֹתָהּ הַמְזִמָּתָה הָרַבִּים
  choice: когда она осуществляет свои многочисленные злые замыслы
  rationale: Синтаксис еврейской фразы труден. מְזִמָּה может означать замысел или умысел и здесь имеет отрицательную нравственную окраску; רַבִּים передано как «многочисленные».
- source_word: וּבְשַׂר קֹדֶשׁ
  choice: священное мясо
  rationale: Буквально речь идёт о «святой плоти», вероятнее всего о мясе жертв. «Священное мясо» естественнее по-русски и сохраняет культовый образ без замены его общим словом «обряд».
- source_word: יַעַבְרוּ מֵעָלָיִךְ
  choice: отведёт от тебя
  rationale: Обычно עבר означает «проходить, удаляться». В трудном контексте вопрос передаёт предполагаемую, но отвергаемую способность жертвенного мяса удалить зло; образ движения «от тебя» сохранён глаголом «отведёт».
- source_word: רָעָתֵכִי
  choice: зло
  rationale: רָעָה допускает значения нравственного зла и бедствия. Контекст обвинения в злых замыслах делает нравственный смысл наиболее вероятным, однако широкое слово «зло» не устраняет полностью присущую слову неоднозначность.
- source_word: אָז תַּעֲלֹזִי
  choice: И тогда ты ликуешь!
  rationale: Глагол עלז обозначает бурную радость, ликование. Настоящее время и восклицание передают резкий, иронический финал; אָז отражено словом «тогда».
theological_decisions:
- issue: Кого называют «Моей возлюбленной»
  choice: Иуда или Иерусалим как женский коллективный образ народа завета, названный возлюбленной с горькой иронией
  alternative: Отдельная поклонница либо храмовая община без подчёркнутой иронии
  rationale: Женские формы местоимений и глаголов указывают на коллективный образ Иудеи/Иерусалима. Само слово «возлюбленная» сохранено, чтобы не сгладить напряжение между близостью завета и совершённым злом.
- issue: Смысл упоминания жертвенного мяса
  choice: Священная трапеза или участие в жертве не может устранить нравственное зло народа
  alternative: Общее осуждение храмового ритуала; либо слишком повреждённый текст, не позволяющий уверенно определить связь частей
  rationale: Соседство «священного мяса» и «твоего зла» поддерживает полемику против надежды на ритуал при продолжающемся нечестии. Вопросительная форма сохраняет риторический характер, а примечание отмечает трудность текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные буквы в «Моей» и «Моём» обозначают речь Господа, но не добавляют к тексту имени. Риторические вопросы и финальное восклицание сохраняют обвинительный и иронический тон.
