base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/018.yaml
  text: And Yahweh made it known to me[a], and I knew; then you showed me their deeds.
translation:
  language: ru
  text: И Яхве дал мне знать, и я узнал; тогда Ты[a] показал мне их дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте происходит переход от упоминания Яхве в третьем лице к прямому обращению: «Ты показал мне». В некоторых переводах этот переход сглажен: «Он показал мне».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: И Яхве
  rationale: Союз ו передан как «И», а личное имя יְהוָה — как «Яхве», с сохранением имени Бога в исходном тексте.
- source_word: הוֹדִיעַנִי
  choice: дал мне знать
  rationale: 'Порода hифиль глагола ידע выражает каузативное значение: Яхве сделал так, чтобы пророк узнал; эта формулировка также не конкретизирует подразумеваемый объект.'
- source_word: וָאֵדָעָה
  choice: и я узнал
  rationale: Сохраняется простое соединение частей союзом и факт обретения знания без добавления явно не выраженной причинной связи.
- source_word: אָז
  choice: тогда
  rationale: Прямо передаёт временное наречие и последовательность откровения.
- source_word: הִרְאִיתַנִי
  choice: Ты показал мне
  rationale: Каузатив глагола ראה естественно передаётся глаголом «показал»; второе лицо сохранено как прямое обращение к Яхве.
- source_word: מַעַלְלֵיהֶם
  choice: их дела
  rationale: «Дела» передаёт поступки с возможной нравственной окраской, не добавляя отсутствующего здесь определения «злые».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом.
- issue: Переход от упоминания Бога в третьем лице к обращению во втором лице
  choice: «Яхве дал… Ты показал»
  alternative: 'Сгладить переход: «Яхве дал… Он показал»'
  rationale: В еврейском тексте глагол הִרְאִיתַנִי стоит во втором лице мужского рода единственного числа; сохранение перехода передаёт риторическую форму оригинала и не устраняет его напряжение.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественный. Заглавная буква в «Ты» отмечает прямое обращение к Богу, не меняя грамматического лица оригинала.
