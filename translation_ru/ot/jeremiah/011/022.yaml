    text: 'Или: «Вот, Я накажу их». Буквально: «Я посещаю их»; в данном судебном контексте этот еврейский оборот означает призвать к ответственности и совершить суд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего контекста естественным современным русским союзом.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Сохраняет устойчивую пророческую формулу в ясной и торжественной форме.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יהוה транслитерацией и сохраняет широкое значение צְבָאוֹת, не сужая его только до человеческих армий.
- source_word: הִנְנִי פֹקֵד עֲלֵיהֶם
  choice: Вот, Я призову их к ответу
  rationale: הִנְנִי подчёркивает решительное предстоящее действие, а פקד על в данном контексте обозначает судебное взыскание; выражение «призову к ответу» ясно передаёт этот смысл, не сводя его лишь к наказанию.
- source_word: הַבַּחוּרִים
  choice: их юноши
  rationale: Обозначает молодых мужчин, вероятно способных носить оружие; «юноши» естественно сохраняет возрастную характеристику.
- source_word: יָמֻתוּ בַחֶרֶב
  choice: погибнут от меча
  rationale: Сохраняет традиционный образ насильственной смерти от войны или нападения и звучит естественно по-русски.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: их сыновья и дочери
  rationale: Сохраняет явное различение сыновей и дочерей в еврейском тексте.
- source_word: יָמֻתוּ בָּרָעָב
  choice: умрут от голода
  rationale: רָעָב здесь означает голод как бедствие; русское выражение передаёт его непосредственно и естественно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит тетраграмматон; форма «Яхве» сохраняет личное Божье имя без замены титулом.
- issue: Смысл הִנְנִי פֹקֵד עֲלֵיהֶם
  choice: Вот, Я призову их к ответу
  alternative: Вот, Я накажу их; вот, Я наведу на них суд
  rationale: 'Формулировка сохраняет судебный смысл פקד על и некоторую широту глагола: Бог обращает внимание на виновных, чтобы взыскать с них, не вводя более узкого толкования, чем требует контекст.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «так говорит» и слово «вот» сохраняют торжественную интонацию; архаичные и малопонятные обороты избегаются.
