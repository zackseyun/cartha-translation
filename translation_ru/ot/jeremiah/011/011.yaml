  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֤יא אֲלֵי/הֶם֙ רָעָ֔ה אֲשֶׁ֥ר לֹֽא יוּכְל֖וּ לָ/צֵ֣את מִמֶּ֑/נָּה וְ/זָעֲק֣וּ אֵלַ֔/י וְ/לֹ֥א אֶשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/011.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am bringing on them a disaster from which they will not be able to escape; and they will cry out to me, but I will not listen to them.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве: «Вот, Я наведу на них бедствие[a], от которого они не смогут спастись. И они воззовут ко Мне, но Я их не услышу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несчастье», «катастрофу». Здесь еврейское רָעָה означает губительное бедствие как суд, а не нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие из предшествующего обличения естественным современным русским союзом.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет торжественную пророческую формулу в естественном русском порядке слов и передаёт тетраграмматон личным именем.
- source_word: הִנְנִי
  choice: Вот
  rationale: Передаёт указательное и эмфатическое введение к торжественному Божьему объявлению без архаизации.
- source_word: מֵבִיא אֲלֵיהֶם רָעָה
  choice: Я наведу на них бедствие
  rationale: Причастная конструкция с הִנְנִי выражает близкое и несомненное действие; русское будущее здесь звучит естественно. «Навести бедствие» ясно передаёт направленный суд.
- source_word: רָעָה
  choice: бедствие
  rationale: В данном контексте слово обозначает губительное несчастье как суд, а не нравственное зло; «бедствие» сохраняет смысл и достоинство регистра.
- source_word: אֲשֶׁר לֹא יוּכְלוּ לָצֵאת מִמֶּנָּה
  choice: от которого они не смогут спастись
  rationale: Буквально речь о невозможности «выйти из» бедствия; «спастись» естественно передаёт идиоматический смысл избавления, не уточняя способ.
- source_word: וְזָעֲקוּ אֵלַי
  choice: Тогда они воззовут ко Мне
  rationale: זעק обозначает настойчивый крик о помощи; «воззовут» сохраняет интенсивность и уместный пророческий регистр. Связка «тогда» естественно показывает последующее действие.
- source_word: וְלֹא אֶשְׁמַע אֲלֵיהֶם
  choice: но Я их не услышу
  rationale: В контексте мольбы «не услышу» означает отказ внять и ответить; противительный союз естественно раскрывает контраст.
theological_decisions:
- issue: Значение רָעָה в объявлении Божьего суда
  choice: бедствие
  alternative: зло; несчастье; calamity/катастрофа
  rationale: Контекст говорит о разрушительном последствии заветного суда, а не о нравственном зле. Выбор не устраняет тяжёлой богословской мысли о том, что бедствие направлено Богом.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Смысл לֹא אֶשְׁמַע
  choice: Я их не услышу
  alternative: Я не стану их слушать; Я им не отвечу
  rationale: 'Формулировка сохраняет семантическую широту שׁמע: речь не о физической неспособности слышать, а об отказе внять мольбе, однако явное «не отвечу» было бы более узким толкованием.'
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. «Воззовут» и формула «так говорит» поддерживают библейский регистр, не делая весь стих архаичным. Прямая речь оформлена русскими кавычками; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской религиозной издательской практике.
