source:
  edition: WLC
  text: וְ/הָֽלְכ֞וּ עָרֵ֣י יְהוּדָ֗ה וְ/יֹשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם וְ/זָֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֛ר הֵ֥ם מְקַטְּרִ֖ים לָ/הֶ֑ם וְ/הוֹשֵׁ֛עַ לֹֽא יוֹשִׁ֥יעוּ לָ/הֶ֖ם בְּ/עֵ֥ת רָעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/012.yaml
  text: Then the cities of Judah and the inhabitants of Jerusalem will go and cry out to the gods to whom they burn incense[a], but they will certainly not save them in the time of their trouble.
translation:
  language: ru
  text: Тогда города Иудеи и жители Иерусалима пойдут и воззовут к богам, которым они воскуряют благовония, но те никак не спасут их во время их бедствия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во время их несчастья»; возможно также: «во время их беды».'
    reason: Лексема רָעָה в данном контексте допускает близкие значения переживаемого бедствия, несчастья или беды.
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: Тогда ... пойдут
  rationale: Форма с ו продолжает пророческую последовательность и в контексте обозначает последующее действие; «тогда» естественно передаёт связь со сказанным ранее.
- source_word: עָרֵי יְהוּדָה
  choice: города Иудеи
  rationale: Прямая передача древнееврейской сопряжённой конструкции.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: и жители Иерусалима
  rationale: Причастная форма обозначает всё население города; «жители» — естественное современное соответствие.
- source_word: וְזָעֲקוּ אֶל
  choice: и воззовут к
  rationale: זעק обозначает настойчивый, отчаянный крик о помощи; «воззовут» сохраняет силу обращения и уместный библейский регистр.
- source_word: הָאֱלֹהִים
  choice: к богам
  rationale: 'Множественное число определяется контекстом: речь идёт о божествах, которым жители совершают культовое воскурение.'
- source_word: אֲשֶׁר הֵם מְקַטְּרִים לָהֶם
  choice: которым они воскуряют благовония
  rationale: Глагол קטר здесь обозначает культовое сжигание благовоний; добавление «благовония» делает смысл глагола ясным по-русски, не расширяя содержания.
- source_word: וְהוֹשֵׁעַ לֹא יוֹשִׁיעוּ לָהֶם
  choice: но те никак не спасут их
  rationale: Инфинитив абсолютный при личной форме усиливает отрицание. «Никак не спасут» естественно передаёт эмфазу и одновременно устраняет возможную неясность местоименного отнесения.
- source_word: בְּעֵת רָעָתָם
  choice: во время бедствия
  rationale: רָעָה здесь означает переживаемое несчастье или бедствие, а не нравственное зло; «бедствие» соответствует серьёзности угрожающего кризиса.
theological_decisions:
- issue: К кому относится הָאֱלֹהִים
  choice: ложные боги, которым жители Иудеи и Иерусалима воскуряют благовония
  alternative: бог или божество в собирательном смысле
  rationale: Относительное придаточное о воскурении и ближайший контекст полемики с идолопоклонством указывают на множественное число; перевод «боги» передаёт это без добавления конфессиональной интерпретации.
- issue: Степень усиления отрицания в הוֹשֵׁעַ לֹא יוֹשִׁיעוּ
  choice: «никак не спасут»
  alternative: «не спасут»
  rationale: Сочетание инфинитива абсолютного с личной формой того же корня при отрицании имеет эмфатическую силу, которую важно сохранить, не превращая её в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. «Воззовут» и «воскуряют благовония» понятны из контекста и сохраняют достоинство культовой и пророческой речи; синтаксис остаётся ясным для обычного читателя.
