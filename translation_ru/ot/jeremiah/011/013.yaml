  text: כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָ֑ה וּ/מִסְפַּ֞ר חֻצ֣וֹת יְרוּשָׁלִַ֗ם שַׂמְתֶּ֤ם מִזְבְּחוֹת֙ לַ/בֹּ֔שֶׁת מִזְבְּח֖וֹת לְ/קַטֵּ֥ר לַ/בָּֽעַל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/013.yaml
  text: For your gods[a], O Judah, have become as numerous as your cities; and as numerous as the streets of Jerusalem, you have set up altars to Shame[b], altars to make offerings to Baal.
translation:
  language: ru
  text: Ибо сколько у тебя городов, столько у тебя и богов, Иуда; и сколько улиц в Иерусалиме, столько жертвенников вы поставили Позору[a] — жертвенников, чтобы воскурять Ваалу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Позору». Это уничижительное наименование языческого божества, вероятно Ваала.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол означает возносить приношение в дым и часто относится к курению благовоний.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предшествующему контексту; «ибо» естественно передаёт эту связь в литературной русской речи.
- source_word: מִסְפַּר ... מִסְפַּר
  choice: сколько … столько
  rationale: 'Русская соотносительная конструкция естественно передаёт числовое соответствие: богов столько же, сколько городов, а жертвенников — сколько улиц.'
- source_word: עָרֶיךָ
  choice: у тебя городов
  rationale: Сохраняется обращение к Иуде как к единому лицу во втором лице единственного числа.
- source_word: הָיוּ אֱלֹהֶיךָ יְהוּדָה
  choice: столько и богов у тебя, Иуда
  rationale: Передаёт итоговое множество богов и сохраняет «Иуда» как прямое обращение.
- source_word: חֻצוֹת
  choice: улиц
  rationale: В данном городском контексте слово обозначает улицы или открытые общественные пространства; «улицы» — наиболее ясный современный эквивалент.
- source_word: שַׂמְתֶּם
  choice: вы поставили
  rationale: Глагол во втором лице множественного числа описывает установку жертвенников и сохраняет переход от олицетворённого Иуды к его жителям.
- source_word: מִזְבְּחוֹת
  choice: жертвенников
  rationale: Обычный русский эквивалент для культовых сооружений, предназначенных для жертв или курений.
- source_word: לַבֹּשֶׁת
  choice: Позору
  rationale: Буквальное значение — «позор, стыд»; заглавная буква передаёт употребление слова как уничижительного наименования божества, не подменяя его сразу именем Ваала.
- source_word: לְקַטֵּר
  choice: воскурять
  rationale: Глагол обозначает вознесение приношения в дым и нередко относится к благовониям; «воскурять» сохраняет культовый характер действия, не добавляя отсутствующий в еврейском тексте прямой объект.
- source_word: לַבָּעַל
  choice: Ваалу
  rationale: Передаёт имя ханаанского божества и направленность культового действия.
theological_decisions:
- issue: Переход от обращения к Иуде в единственном числе к глаголу во множественном числе
  choice: «у тебя … Иуда» и затем «вы поставили»
  alternative: Сгладить всё обращение до единственного или множественного числа
  rationale: Еврейский текст сначала олицетворяет Иуду как одно лицо, а затем обращается ко множеству его жителей. Смена числа сохранена как значимая особенность текста.
- issue: Значение לַבֹּשֶׁת
  choice: «Позору» в основном тексте с пояснением в сноске
  alternative: Сразу перевести как «Ваалу» или «позорному идолу»
  rationale: Так сохраняется пророческая игра на буквальном значении «позор» и вероятная отсылка к Ваалу, не устраняя полемическую двусмысленность.
- issue: Точная природа действия לְקַטֵּר
  choice: «воскурять» с пояснением семантического диапазона
  alternative: «сжигать благовония» или обобщённое «приносить жертвы»
  rationale: Еврейский глагол связан с превращением приношения в дым и часто означает курение благовоний, но прямой объект здесь не назван. Выбранный вариант сохраняет как культовую конкретность, так и некоторую неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Парная конструкция «сколько … столько» делает числовое сопоставление ясным. Смена единственного числа на множественное намеренно сохранена. Слова «Позор» и «воскурять» поддерживают пророческую полемику и культовую лексику оригинала.
