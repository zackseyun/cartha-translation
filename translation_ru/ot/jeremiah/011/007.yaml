  yaml_path: translation/ot/jeremiah/011/007.yaml
  text: For I solemnly warned your fathers in the day I brought them up from the land of Egypt[a], and to this day, rising early and warning them, saying, ‘Listen to my voice.’
translation:
  language: ru
  text: 'Ведь Я настойчиво предостерегал ваших отцов с того дня, когда вывел их из земли Египетской, и доныне, вновь и вновь предостерегая: «Слушайте Мой голос».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Повинуйтесь Моему голосу». Еврейское выражение может означать слушание, предполагающее послушание, особенно в контексте завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Вводит обоснование предшествующего повеления и естественно передаёт пояснительную связь в современном русском.
- source_word: הָעֵד הַעִדֹתִי
  choice: настойчиво предостерегал
  rationale: Инфинитив абсолютный при личной форме усиливает глагольное значение; в контексте речь идёт о торжественном и неоднократном предостережении в рамках завета.
- source_word: בַּאֲבוֹתֵיכֶם
  choice: ваших отцов
  rationale: Сохраняет буквальный семейно-исторический образ и лексику заветной преемственности.
- source_word: בְּיוֹם הַעֲלוֹתִי אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: с того дня, когда вывел их из земли Египетской
  rationale: В сочетании с «и доныне» временное выражение указывает на исходную точку продолжавшегося предостережения; Hiphil עלה передан естественным для русского повествования об исходе глаголом «вывел».
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: и доныне
  rationale: Кратко и литературно передаёт непрерывность действия до времени пророка.
- source_word: הַשְׁכֵּם וְהָעֵד
  choice: вновь и вновь предостерегая
  rationale: Идиома с השׁכם обозначает усердное, постоянное и повторяемое действие; буквальное «вставая рано» в современном русском могло бы ошибочно восприниматься лишь как указание времени суток.
- source_word: לֵאמֹר
  choice: 'предостерегая:'
  rationale: Содержание речи естественно вводится двоеточием; отдельное «говоря» по-русски избыточно.
- source_word: שִׁמְעוּ בְּקוֹלִי
  choice: Слушайтесь Моего голоса
  rationale: Русское «слушаться голоса» сохраняет слуховой образ и одновременно передаёт присущий заветному контексту смысл повиновения.
theological_decisions:
- issue: Заветный смысл שִׁמְעוּ בְּקוֹלִי
  choice: Слушайтесь Моего голоса
  alternative: Слушайте Мой голос
  rationale: Глагол שׁמע с בְּקוֹל обычно подразумевает не только восприятие речи, но и послушание. Выбранная формулировка сохраняет образ голоса и передаёт этот смысл, а более буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Доныне» и «земля Египетская» поддерживают достоинство стиля; идиома השׁכם передана по смыслу, чтобы избежать неестественной буквальности. Маркер сноски поставлен непосредственно после цитаты, к которой относится.
