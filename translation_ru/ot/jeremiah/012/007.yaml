  text: עָזַ֨בְתִּי֙ אֶת בֵּיתִ֔/י נָטַ֖שְׁתִּי אֶת נַחֲלָתִ֑/י נָתַ֛תִּי אֶת יְדִד֥וּת נַפְשִׁ֖/י בְּ/כַ֥ף אֹיְבֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/007.yaml
  text: I have forsaken my house[a]; I have abandoned my inheritance[c][b]; I have given the beloved of my soul into the hand of her enemies.
translation:
  language: ru
  text: 'Я оставил Мой дом,

    покинул Моё наследие,

    отдал ту, кого любит душа Моя[a],

    в руки её врагов[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мою возлюбленную», «дорогую душе Моей». Еврейское выражение передаёт глубокую личную привязанность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в ладонь её врагов»; это образное выражение означает передачу под их власть. Женское «её» может относиться к наследию, к олицетворённым Иудее или Иерусалиму либо к той, кого любит душа Бога; точный референт не назван.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָזַבְתִּי
  choice: Я оставил
  rationale: Qal perfect, 1-е лицо ед. числа, обозначает совершённое действие. «Оставил» точно передаёт основное значение и позволяет отличить этот глагол от следующего נטש.
- source_word: בֵּיתִי
  choice: Мой дом
  rationale: Сохраняет широкое значение בַּיִת и не сужает его заранее до храма, царского дома или народа как Божьего дома.
- source_word: נָטַשְׁתִּי
  choice: покинул
  rationale: Передаёт усиленный параллелизм с עזב естественным современным русским языком без механического повтора.
- source_word: נַחֲלָתִי
  choice: Моё наследие
  rationale: Сохраняет язык заветной принадлежности, применимый к земле и народу, не устраняя контекстуальную многозначность.
- source_word: נָתַתִּי
  choice: отдал
  rationale: В сочетании с «в руки врагов» естественно выражает передачу под чужую власть, оставаясь близким к обычному значению נתן.
- source_word: יְדִדוּת נַפְשִׁי
  choice: возлюбленную души Моей
  rationale: Сохраняет интимный и поэтический характер выражения, а также грамматический женский род, важный для последующего суффикса.
- source_word: בְּכַף
  choice: в руки
  rationale: כַּף буквально означает «ладонь», но выражение идиоматически обозначает власть или контроль; русское «отдать в руки» передаёт это естественно.
- source_word: אֹיְבֶיהָ
  choice: её врагов
  rationale: Сохраняет женский суффикс 3-го лица ед. числа и не уточняет, относится ли он к наследию, Иудее/Иерусалиму или возлюбленной.
theological_decisions:
- issue: К кому относится женский суффикс в אֹיְבֶיהָ («её врагов»)
  choice: Сохранить женское местоимение «её», не называя референт прямо.
  alternative: «в руки врагов Иудеи», «в руки врагов Иерусалима» или безличное «в руки его врагов».
  rationale: Еврейский текст использует женский род, но не уточняет референт; перевод сохраняет поэтическую и богословскую неоднозначность.
- issue: Что обозначает «Мой дом»
  choice: Оставить образ «Мой дом» без поясняющей конкретизации.
  alternative: «Мой храм» или «Мой народ».
  rationale: Контекст допускает такие ассоциации, однако само слово בֵּיתִי шире; конкретизация внесла бы в основной текст толкование.
translation_notes:
  register: Современный литературный русский с торжественной поэтической интонацией. Инверсия «души Моей» сохраняет достоинство и ритм библейской речи, оставаясь понятной современному читателю. Заглавные буквы в притяжательных формах обозначают речь Бога согласно принятой русской библейской издательской традиции.
