source:
  edition: WLC
  text: זָרְע֤וּ חִטִּים֙ וְ/קֹצִ֣ים קָצָ֔רוּ נֶחְל֖וּ לֹ֣א יוֹעִ֑לוּ וּ/בֹ֨שׁוּ֙ מִ/תְּבוּאֹ֣תֵי/כֶ֔ם מֵ/חֲר֖וֹן אַף יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/013.yaml
  text: They have sown wheat[a], but they have reaped thorns; they have exhausted themselves, but they profit nothing. Be ashamed of your produce because of the burning anger of Yahweh.
translation:
  language: ru
  text: Они сеяли пшеницу, а пожали терния; изнурили себя, но не получили пользы. Постыдитесь[a] своих урожаев из-за пылающего гнева Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И вы устыдитесь своих урожаев», если וּבֹשׁוּ понимать как предсказание, а не как повеление.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָרְעוּ חִטִּים
  choice: сеяли пшеницу
  rationale: Форма זָרְעוּ обозначает завершённое сеяние, а חִטִּים — конкретно пшеницу. Русское прошедшее время естественно передаёт пророческое описание результата.
- source_word: וְקֹצִים קָצָרוּ
  choice: а пожали терния
  rationale: Кֹצִים — «колючки, терния»; противительный союз «а» ясно выражает контраст между посевом и урожаем, заложенный в параллелизме.
- source_word: נֶחְלוּ
  choice: изнурили себя
  rationale: В данном контексте форма лучше всего понимается как указание на изнеможение от напрасного труда, а не как производное от נחל «наследовать».
- source_word: לֹא יוֹעִלוּ
  choice: не получили пользы
  rationale: Hифиль от יעל выражает пользу или выгоду. Формулировка естественна по-русски и сохраняет мысль о бесплодности усилий.
- source_word: וּבֹשׁוּ
  choice: Постыдитесь
  rationale: Форма понята как повелительное наклонение во 2-м лице множественного числа; она создаёт характерный для пророческой речи переход от описания к прямому обращению.
- source_word: מִתְּבוּאֹתֵיכֶם
  choice: своих урожаев
  rationale: תְּבוּאָה обозначает урожай, сбор или плоды земли. Множественное «урожаев» передаёт форму исходного текста и согласуется с обращением во 2-м лице множественного числа.
- source_word: מֵחֲרוֹן אַף
  choice: из-за пылающего гнева
  rationale: Устойчивое сочетание חֲרוֹן אַף обозначает яростный, буквально разгорающийся гнев; «пылающий гнев» сохраняет образ и звучит естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие.
- issue: Грамматическое понимание וּבֹשׁוּ
  choice: повелительное «Постыдитесь»
  alternative: предсказательное «вы устыдитесь»
  rationale: Форма естественно согласуется со следующим местоименным суффиксом 2-го лица множественного числа и создаёт резкий переход к прямому обличению. Возможное предсказательное понимание сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Сельскохозяйственный параллелизм и резкий переход к прямому обращению сохранены без архаизации.
