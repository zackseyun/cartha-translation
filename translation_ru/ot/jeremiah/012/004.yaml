  text: עַד מָתַי֙ תֶּאֱבַ֣ל הָ/אָ֔רֶץ וְ/עֵ֥שֶׂב כָּל הַ/שָּׂדֶ֖ה יִיבָ֑שׁ מֵ/רָעַ֣ת יֹֽשְׁבֵי בָ֗/הּ סָפְתָ֤ה בְהֵמוֹת֙ וָ/ע֔וֹף כִּ֣י אָמְר֔וּ לֹ֥א יִרְאֶ֖ה אֶת אַחֲרִיתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/004.yaml
  text: How long will the land mourn, and the grass of every field dry up? Because of the evil of those who dwell in it, beasts and birds are swept away, for they say, “He will not see our end.”
translation:
  language: ru
  text: 'Доколе будет скорбеть земля и сохнуть трава на всех полях? Из-за зла живущих на ней гибнут звери и птицы, потому что они говорят: «Он не увидит, чем всё для нас кончится».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он не увидит нашего конца»; возможное понимание: «Он не увидит, что с нами будет».'
    reason: Еврейское אַחֲרִיתֵנוּ может означать конец, исход или дальнейшую участь; примечание сохраняет диапазон смысла.
lexical_decisions:
- source_word: תֶּאֱבַל
  choice: будет скорбеть
  rationale: Сохраняет олицетворение земли и значение еврейского глагола «скорбеть, быть в трауре».
- source_word: וְעֵשֶׂב כָּל הַשָּׂדֶה
  choice: трава на всех полях
  rationale: Естественная русская передача собирательного выражения; כָּל הַשָּׂדֶה буквально допускает «всего поля», но по смыслу охватывает полевую растительность страны.
- source_word: סָפְתָה
  choice: гибнут
  rationale: Глагол выражает уничтожение или исчезновение; настоящее время по-русски естественно описывает продолжающееся бедствие, не усиливая образ до более конкретного «сметены».
- source_word: אַחֲרִיתֵנוּ
  choice: чем всё для нас кончится
  rationale: Передаёт «наш конец / наш исход, дальнейшую участь» естественно и сохраняет неоднозначность между концом людей и исходом происходящего.
theological_decisions:
- issue: К кому относится подлежащее в יִרְאֶה («он не увидит»)
  choice: Сохранено местоимение «Он» без поясняющего имени; прописная буква указывает на Бога как наиболее вероятного референта в контексте.
  alternative: «Бог не увидит» или «пророк не увидит»
  rationale: Еврейский текст называет лишь «он»; эксплицитная подстановка имени устранила бы формальную неоднозначность. При этом заглавная буква соответствует основному пониманию высказывания как отрицания Божьего видения или участия.
- issue: Смысл אַחֲרִיתֵנוּ
  choice: «чем всё для нас кончится»
  alternative: «нашего конца» / «нашего будущего»
  rationale: 'Фраза не сводит слово исключительно к смерти или далёкому будущему и сохраняет напряжение: нечестивые считают, что Бог не увидит их конечной участи либо исхода их дел.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Начальное «доколе» сохраняет библейскую торжественность, оставаясь понятным; синтаксис упрощён лишь настолько, чтобы стих звучал естественно вслух.
