  text: הַ/עַ֨יִט צָב֤וּעַ נַחֲלָתִ/י֙ לִ֔/י הַ/עַ֖יִט סָבִ֣יב עָלֶ֑י/הָ לְכ֗וּ אִסְפ֛וּ כָּל חַיַּ֥ת הַ/שָּׂדֶ֖ה הֵתָ֥יוּ לְ/אָכְלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/009.yaml
  text: Is my inheritance to me a speckled bird of prey? Are the birds of prey against her all around? Go[a], gather all the beasts of the field[b]; bring them to devour.
translation:
  language: ru
  text: Неужели Моё наследие для Меня — пёстрая хищная птица? Хищные птицы окружают её со всех сторон? Идите[a], соберите всех полевых зверей[b], приведите их, чтобы они пожрали её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Придите». Еврейское לְכוּ обычно означает «идите», но в призыве к собранию может иметь значение «придите».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст буквально: «Неужели Моё наследие для Меня — пёстрая хищная птица? Хищная птица вокруг неё». Единственное число «хищная птица» во второй части может употребляться собирательно. Некоторые толкователи понимают первое עַיִט как название хищного зверя, возможно гиены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַיִט
  choice: хищная птица
  rationale: Обычное библейское значение עַיִט — хищная птица или птица-падальщик. Такой перевод сохраняет зоологический образ, не уточняя вид птицы; менее распространённая трактовка «гиена» отмечена в сноске.
- source_word: צָבוּעַ
  choice: пёстрая
  rationale: Причастная форма передаёт необычную, неоднородную окраску. «Пёстрая» естественно звучит по-русски и сохраняет образ птицы, выделяющейся среди других.
- source_word: נַחֲלָתִי
  choice: Моё наследие
  rationale: נַחֲלָה обозначает наследственный удел, владение или достояние. «Наследие» сохраняет широту значения и заветные ассоциации, не определяя прямо, идёт ли речь о народе или земле.
- source_word: לִי
  choice: для Меня
  rationale: Дательный компонент сохранён, но передан естественным русским оборотом «для Меня», удерживающим личную и риторическую силу вопроса.
- source_word: הַעַיִט סָבִיב עָלֶיהָ
  choice: хищные птицы со всех сторон ополчились на него
  rationale: Формально единственное число עַיִט понято собирательно. סָבִיב עָלֶיהָ передаёт окружение и враждебную направленность; «ополчились» делает эту направленность ясной. Русское местоимение согласовано с существительным «наследие».
- source_word: לְכוּ אִסְפוּ
  choice: Ступайте, соберите
  rationale: Два повелительных глагола переданы как прямой призыв. «Ступайте» сохраняет достоинство пророческой речи без архаичной тяжеловесности.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: всех полевых зверей
  rationale: Устойчивый библейский образ диких животных передан кратким и понятным выражением, сохраняющим слово «поле».
- source_word: הֵתָיוּ לְאָכְלָה
  choice: приведите их пожирать
  rationale: Повеление с обозначением цели передано энергично и в соответствии с образом хищников, созванных, чтобы пожрать добычу.
theological_decisions:
- issue: К чему относится выражение «Моё наследие»
  choice: Оставлено обобщённое «Моё наследие» без прямого отождествления
  alternative: Иуда, Иерусалим, земля или народ завета
  rationale: Контекст указывает на народ и/или землю Господа под судом, однако сам стих не сужает референт. Перевод сохраняет эту открытость.
- issue: Образ хищной птицы и окружающих хищников
  choice: Первый עַיִט передан в единственном числе, второй — собирательным множественным
  alternative: Оба употребления передать формально в единственном числе либо истолковать первое как «гиена»
  rationale: Так сохраняются и грамматическая форма первого риторического вопроса, и естественный смысл множества хищных птиц, окружающих наследие.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторические вопросы сохранены; синтаксис слегка сглажен для ясности. Прописные местоимения обозначают говорящего Бога согласно принятой русской библейской традиции. Все маркеры сносок помещены в основном тексте.
