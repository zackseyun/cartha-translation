base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/014.yaml
  text: 'Thus says Yahweh concerning all my wicked neighbors who touch the inheritance that I caused my people Israel to inherit: behold[a], I am about to uproot them from upon their land[b], and I will uproot the house of Judah from among them.'
translation:
  language: ru
  text: 'Так говорит Яхве обо всех моих злых соседях, которые посягают на наследие[a], данное мною в наследство моему народу Израилю: вот, Я собираюсь искоренить их[b] с их земли, и дом Иуды искореню из их среды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «касаются наследия»; в данном контексте речь идёт о враждебном вторжении и посягательстве на него.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вырвать их с корнем». Этот еврейский глагол — повторяющийся у Иеремии образ искоренения как суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена стандартная пророческая формула и непосредственно передано личное имя יְהוָה.
- source_word: שְׁכֵנַי הָרָעִים
  choice: всех моих злых соседях
  rationale: «Соседи» обозначает окружающие народы, а «злые» передаёт их нравственно враждебное поведение без ослабления до «плохих».
- source_word: הַנֹּגְעִים בַּנַּחֲלָה
  choice: которые посягают на наследие[a]
  rationale: Буквальное «касаются наследия» в русском не выражает подразумеваемого контекстом враждебного вторжения; «посягают» естественно передаёт этот смысл, а буквальный образ отмечен в сноске.
- source_word: אֲשֶׁר הִנְחַלְתִּי אֶת עַמִּי אֶת יִשְׂרָאֵל
  choice: данное мною в наследство моему народу Израилю
  rationale: Передан каузатив глагола נחל и сохранена его словесная связь с существительным «наследие».
- source_word: הִנְנִי נֹתְשָׁם
  choice: вот, Я готов искоренить их[b]
  rationale: Оборот הִנְנִי с причастием указывает на подчёркнутое и близкое действие; «готов искоренить» сохраняет значение предстоящего действия и образ удаления с корнем.
- source_word: מֵעַל אַדְמָתָם
  choice: с их земли
  rationale: Естественная русская передача удаления народов с принадлежащей им земли; значение מֵעַל не требует тяжеловесного буквального «с поверхности».
- source_word: וְאֶת בֵּית יְהוּדָה אֶתּוֹשׁ מִתּוֹכָם
  choice: а дом Иуды искореню из их среды
  rationale: Сохранены коллективное наименование «дом Иуды», повтор глагола נתש и значение удаления Иуды из среды соседних народов.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит Тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Временная сила конструкции הִנְנִי + причастие
  choice: вот, Я готов искоренить их
  alternative: вот, Я искореню их; вот, Я уже искореняю их
  rationale: Конструкция подчёркивает близость и определённость Божьего действия, но сама по себе не требует представлять его уже начавшимся.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис упрощён там, где буквальное воспроизведение еврейских конструкций было бы неестественным, но сохранены ключевые повторы «наследие — в наследство» и «искоренить — искореню».
