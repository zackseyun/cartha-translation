id: JER.12.17
reference: Jeremiah 12:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִ֖ם לֹ֣א יִשְׁמָ֑עוּ וְ/נָ֨תַשְׁתִּ֜י אֶת הַ/גּ֥וֹי הַ/ה֛וּא נָת֥וֹשׁ וְ/אַבֵּ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/017.yaml
  text: But if they do not listen[a], then I will uproot that nation, uprooting and destroying it, declares Yahweh.
translation:
  language: ru
  text: Но если они не послушают[a], то Я искореню тот народ — искореню и уничтожу его, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не станут слушаться». Еврейский глагол может означать и «слушать», и «повиноваться» — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Условие противопоставлено обещанию предыдущего стиха; «но» естественно передаёт контрастную силу союза.
- source_word: לֹא יִשְׁמָעוּ
  choice: они не послушают
  rationale: Глагол שׁמע означает как слушание, так и послушание. Русское «не послушают» сохраняет обе смысловые стороны в данном контексте.
- source_word: וְנָתַשְׁתִּי ... נָתוֹשׁ
  choice: Я искореню ... искореню
  rationale: נתשׁ обозначает вырывание с корнем и связано с характерным для Иеремии образом насаждения и искоренения. Повтор передаёт усилительную конструкцию с абсолютным инфинитивом.
- source_word: הַגּוֹי הַהוּא
  choice: тот народ
  rationale: גּוֹי здесь обозначает конкретный народ как политико-этническую общность; «народ» звучит по-русски естественнее, чем «нация», и не добавляет смысла «языческий».
- source_word: וְאַבֵּד
  choice: и уничтожу его
  rationale: Каузативная форма אבד означает привести к гибели, уничтожить; местоимение ясно указывает на упомянутый народ.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана глаголом «возвещает», а тетраграмматон — личным именем «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: 'Смысл שׁמע: слушать или повиноваться'
  choice: не послушают
  alternative: не станут слушаться; не повинуются
  rationale: Форма «не послушают» в русском языке позволяет сохранить присущую еврейскому глаголу связь между слушанием и послушанием, не устраняя смысловую многозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Эмфатическое повторение «искореню» сохранено намеренно, чтобы отразить повтор того же корня в еврейском тексте.
