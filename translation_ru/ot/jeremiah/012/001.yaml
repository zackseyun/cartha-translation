  text: צַדִּ֤יק אַתָּה֙ יְהוָ֔ה כִּ֥י אָרִ֖יב אֵלֶ֑י/ךָ אַ֤ךְ מִשְׁפָּטִים֙ אֲדַבֵּ֣ר אוֹתָ֔/ךְ מַדּ֗וּעַ דֶּ֤רֶךְ רְשָׁעִים֙ צָלֵ֔חָה שָׁל֖וּ כָּל בֹּ֥גְדֵי בָֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/001.yaml
  text: 'You are righteous[a], O Yahweh, when I bring a case before you[c][b]; yet I would speak with you about matters of justice: Why does the way of the wicked prosper? Why are all who deal treacherously at ease?'
translation:
  language: ru
  text: 'Праведен Ты, Яхве, хотя я и веду с Тобой тяжбу[a]. И всё же я хочу поговорить с Тобой о правосудии[b]: почему путь нечестивых благополучен? Почему безмятежны все, кто вероломно поступает[c]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда я представляю Тебе своё дело»; еврейский глагол может означать спор или ведение судебной тяжбы.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «о судах»; речь может идти о вопросах или делах, касающихся справедливости.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «все вероломные вероломством» — усиленное выражение, обозначающее тех, кто поступает крайне вероломно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: Праведен
  rationale: Предикативное прилагательное утверждает праведность и справедливость Яхве; «праведен» сохраняет как богословский, так и судебный оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: כִּי אָרִיב אֵלֶיךָ
  choice: хотя я и вступаю с Тобой в тяжбу
  rationale: Глагол ריב допускает значение спора или ведения судебной тяжбы. Уступительная конструкция естественно передаёт напряжение между признанием Божьей праведности и последующим вопросом.
- source_word: אַךְ
  choice: и всё же
  rationale: Передаёт уступительно-противительный переход к смелому разговору о справедливости.
- source_word: מִשְׁפָּטִים
  choice: о правосудии
  rationale: Множественное число может обозначать судебные вопросы или дела; русское «о правосудии» ёмко сохраняет юридическое и нравственное измерения.
- source_word: דֶּרֶךְ רְשָׁעִים
  choice: путь нечестивых
  rationale: Сохраняет образ жизненного пути и устойчивое библейское обозначение образа жизни.
- source_word: צָלֵחָה
  choice: успешен
  rationale: Форма выражает успех или преуспевание; «успешен» естественно согласуется в русском с существительным «путь».
- source_word: שָׁלוּ
  choice: безмятежны
  rationale: Передаёт состояние покоя, благополучия и отсутствия тревог, не привнося специального заветного смысла слова «мир».
- source_word: בֹּגְדֵי בָגֶד
  choice: все вероломные
  rationale: Когнатная конструкция усиливает понятие вероломства; интенсивность отмечена в сноске, чтобы основной текст оставался естественным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; «Яхве» непосредственно его передаёт.
- issue: Характер обращения Иеремии к Богу
  choice: судебная тяжба, соединённая с признанием Божьей праведности
  alternative: когда я предъявляю Тебе дело; если я спорю с Тобой
  rationale: 'Перевод сохраняет подлинное напряжение: пророк не отрицает Божью праведность, но решается оспаривать видимую несправедливость происходящего.'
translation_notes:
  register: Современный литературный русский язык с достойным, но понятным библейским регистром. Заглавные местоимения в обращении к Богу поддерживают принятую русскую благоговейную норму. Юридическая образность сохранена без излишней канцелярской тяжеловесности.
