source:
  edition: WLC
  text: כִּ֧י גַם אַחֶ֣י/ךָ וּ/בֵית אָבִ֗י/ךָ גַּם הֵ֨מָּה֙ בָּ֣גְדוּ בָ֔/ךְ גַּם הֵ֛מָּה קָרְא֥וּ אַחֲרֶ֖י/ךָ מָלֵ֑א אַל תַּאֲמֵ֣ן בָּ֔/ם כִּֽי יְדַבְּר֥וּ אֵלֶ֖י/ךָ טוֹבֽוֹת־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/006.yaml
  text: For even your brothers and your father’s house—even they have dealt treacherously with you[a]; even they have called out loudly after you. Do not trust them[b], though they speak good things to you.
translation:
  language: ru
  text: Ведь даже твои братья[a] и дом твоего отца — даже они поступили с тобой вероломно; даже они во весь голос кричали тебе вслед[b]. Не доверяй им, даже если они говорят тебе добрые слова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейское слово «братья» стоит в форме мужского рода; в данном контексте речь идёт о близких родственниках Иеремии по мужской линии, тогда как «дом отца» обозначает более широкий круг домашних и родичей.
    reason: cultural_note
  - marker: b
    text: 'Или: «громко звали тебя вслед». Выражение может подразумевать враждебный публичный крик или преследование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֶיךָ
  choice: твои братья
  rationale: Сохраняет прямое значение формы мужского рода множественного числа от אָח; более широкое значение «родственники» возможно, но здесь менее непосредственно.
- source_word: וּבֵית אָבִיךָ
  choice: и дом твоего отца
  rationale: Сохраняет древнееврейское обозначение отцовского рода и всего домашнего сообщества, не сводя его к более общему слову «семья».
- source_word: בָּגְדוּ בָךְ
  choice: поступили с тобой вероломно
  rationale: Передаёт нравственную тяжесть בגד — предательство, неверность и коварство — без сведения выражения к одному конкретному поступку.
- source_word: קָרְאוּ אַחֲרֶיךָ מָלֵא
  choice: во весь голос кричали тебе вслед
  rationale: קרא с אַחֲרֵי означает оклик или крик вслед, а מָלֵא усиливает действие; русский оборот естественно передаёт громкий, вероятно враждебный возглас.
- source_word: אַל תַּאֲמֵן בָּם
  choice: Не доверяй им
  rationale: В данной ситуации породы Hiphil глагол אמן выражает доверие; контекст предостерегает от обманчиво доброжелательной речи.
- source_word: כִּי יְדַבְּרוּ אֵלֶיךָ טוֹבוֹת
  choice: даже если они говорят тебе добрые слова
  rationale: Передаёт уступительный смысл כִּי в контексте запрета и сохраняет образ внешне благожелательной речи в טוֹבוֹת.
