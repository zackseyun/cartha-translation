  text: שָׂמָ/הּ֙ לִ/שְׁמָמָ֔ה אָבְלָ֥ה עָלַ֖/י שְׁמֵמָ֑ה נָשַׁ֨מָּה֙ כָּל הָ/אָ֔רֶץ כִּ֛י אֵ֥ין אִ֖ישׁ שָׂ֥ם עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/011.yaml
  text: They have made it a desolation[a]; it mourns before me, desolate. The whole land is laid waste[c][b], because no one takes it to heart.
translation:
  language: ru
  text: Он обратил её в запустение[a]; опустошённая, она скорбит передо Мной. Вся земля разорена[b], потому что никто не задумывается об этом всерьёз[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он сделал её местом запустения». Еврейский глагол стоит в единственном числе; из предыдущего контекста субъектом также могут подразумеваться разорители, то есть «они».'
    reason: alternative_reading
  - marker: b
    text: «Земля» здесь, вероятно, означает разорённую землю Иуды; слово также можно перевести как «страна».
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «никто не кладёт этого на сердце»; это выражение означает, что никто не принимает этого во внимание и не задумывается об этом всерьёз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמָהּ
  choice: Он превратил её
  rationale: 'Форма глагола — 3-е лицо мужского рода единственного числа с суффиксом 3-го лица женского рода единственного числа: буквально «он сделал/положил её». Русский перевод сохраняет грамматическое единственное число и женский род объекта, относящийся к земле; личность субъекта остаётся контекстуально неуточнённой.'
- source_word: לִשְׁמָמָה
  choice: в пустыню
  rationale: Существительное שְׁמָמָה обозначает опустошённое, безлюдное место. Оборот «превратил её в пустыню» естественно передаёт результативную конструкцию с לְ и сохраняет пророческую образность.
- source_word: אָבְלָה
  choice: она скорбит
  rationale: Глагол אבל означает «скорбеть, быть в трауре». Женское согласование естественно связывает действие с землёй и сохраняет её олицетворение.
- source_word: עָלַי
  choice: предо Мной
  rationale: Буквально предлог может означать «на/надо мной», однако в данном плаче выражение указывает на происходящее перед Богом, в Его присутствии. «Предо Мной» сохраняет возвышенный регистр без излишнего толкования.
- source_word: שְׁמֵמָה
  choice: опустошённая
  rationale: Предикативное прилагательное передано обособленным определением; так сохраняются его связь с землёй и сжатая еврейская последовательность «скорбит… опустошённая».
- source_word: נָשַׁמָּה
  choice: разорена
  rationale: Форма выражает состояние опустошения. «Разорена» — естественный современный русский эквивалент, подходящий для земли, разорённой бедствием.
- source_word: כָּל הָאָרֶץ
  choice: Вся земля
  rationale: אֶרֶץ допускает значения «земля» и «страна». В контексте вероятна земля Иуды, но основной текст сохраняет более широкое и поэтически естественное «земля», а локальное значение отмечено в сноске.
- source_word: כִּי אֵין אִישׁ
  choice: потому что никто
  rationale: אִישׁ здесь употреблено обобщённо и вместе с отрицанием означает отсутствие кого-либо. Русское «никто» точно и естественно передаёт эту конструкцию.
- source_word: שָׂם עַל לֵב
  choice: не принимает этого близко к сердцу
  rationale: Буквально «не кладёт на сердце». Русская идиома «принимать близко к сердцу» сохраняет образ сердца и передаёт смысл серьёзного внутреннего внимания.
theological_decisions:
- issue: Субъект שָׂמָהּ
  choice: Он
  alternative: Они
  rationale: Масоретский текст содержит глагол в мужском роде единственного числа. Хотя контекст может подразумевать разорителей как коллективного субъекта, основной перевод сохраняет формальную неоднозначность, не заменяя единственное число множественным.
- issue: Референт הָאָרֶץ
  choice: земля
  alternative: страна Иуды
  rationale: Ближайший контекст указывает на опустошённую землю Иуды, однако само слово не называет Иуду прямо и может иметь более широкий оттенок. «Земля» сохраняет диапазон исходного слова; вероятный локальный референт поясняется в сноске.
- issue: Говорящий в עָלַי
  choice: Мной с прописной буквы
  alternative: мной
  rationale: В контексте речи Иеремии говорящим является Господь. Прописная буква в русском религиозном тексте ясно обозначает божественного говорящего, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены олицетворение земли, повтор мотивов запустения и грамматическое единственное число первого глагола. Формула «предо Мной» слегка возвышенная, но понятная; прочая лексика современная и общедоступная.
