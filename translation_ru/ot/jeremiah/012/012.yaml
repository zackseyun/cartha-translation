source:
  edition: WLC
  text: עַֽל כָּל שְׁפָיִ֣ם בַּ/מִּדְבָּ֗ר בָּ֚אוּ שֹֽׁדְדִ֔ים כִּ֣י חֶ֤רֶב לַֽ/יהוָה֙ אֹֽכְלָ֔ה מִ/קְצֵה אֶ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ אֵ֥ין שָׁל֖וֹם לְ/כָל בָּשָֽׂר־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/012.yaml
  text: Upon all the bare heights in the wilderness destroyers have come[a], for the sword of Yahweh is devouring from one end of the land to the other end of the land[c][b]; there is no peace for any flesh.
translation:
  language: ru
  text: На все оголённые высоты[a] в пустыне пришли разорители, потому что меч Яхве пожирает от одного края страны до другого края страны[b]; нет мира ни для одного живого существа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безлесные возвышенности»; или: «оголённые холмы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от одного края земли до другого края земли». Еврейское אֶרֶץ может означать как отдельную страну, так и землю вообще.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «ни для какой плоти»; выражение может относиться ко всем людям или живым существам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָיִם
  choice: оголённые высоты
  rationale: Передаёт открытые, лишённые растительности возвышенные места и не создаёт нежелательной ассоциации с культовыми «высотами».
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: В данном поэтическом пейзаже слово обозначает необитаемую пустынную местность; русский вариант остаётся достаточно широким и естественным.
- source_word: שֹׁדְדִים
  choice: разорители
  rationale: Слово обозначает военных грабителей и опустошителей; «разорители» совмещает идеи разграбления и разрушения.
- source_word: חֶרֶב לַיהוָה
  choice: меч Яхве
  rationale: Конструкция указывает на меч, принадлежащий Яхве или служащий орудием его суда; личное имя передано прямо.
- source_word: אֹכְלָה
  choice: пожирает
  rationale: Согласованная с «мечом» форма создаёт яркое олицетворение продолжающегося опустошения.
- source_word: מִקְצֵה אֶרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: от одного края страны до другого
  rationale: В ближайшем контексте речь вероятнее всего идёт об опустошаемой земле Иуды. Формула сохраняет пространственный размах, не делая утверждение непременно всемирным.
- source_word: אֵין שָׁלוֹם
  choice: нет мира
  rationale: «Мир» естественно передаёт отсутствие безопасности и благополучия в контексте войны и суда.
- source_word: לְכָל בָּשָׂר
  choice: ни для кого из живущих
  rationale: Передаёт идиоматическое значение «плоть» как живые существа и естественно сочетается по-русски с отрицанием.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; «Яхве» сохраняет личное заветное имя без замены титулом.
- issue: Объём значения אֶרֶץ
  choice: страна
  alternative: земля
  rationale: Контекст Иер 12 указывает прежде всего на опустошение земли Иуды, однако сноска сохраняет возможное более широкое прочтение.
- issue: Объём выражения לְכָל בָּשָׂר
  choice: ни для кого из живущих
  alternative: ни для какой плоти
  rationale: Выбрана понятная русская передача, не ограничивающая выражение только людьми; буквальный образ сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой образностью. Сохранены олицетворение меча и географический образ; буквальный семитизм «всякая плоть» раскрыт естественной русской формулировкой и пояснён в сноске.
