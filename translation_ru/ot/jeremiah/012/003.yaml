  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָה֙ יְדַעְתָּ֔/נִי תִּרְאֵ֕/נִי וּ/בָחַנְתָּ֥ לִבִּ֖/י אִתָּ֑/ךְ הַתִּקֵ/ם֙ כְּ/צֹ֣אן לְ/טִבְחָ֔ה וְ/הַקְדִּשֵׁ֖/ם לְ/י֥וֹם הֲרֵגָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/003.yaml
  text: But you[a], O Yahweh, know me; you see me, and you test my heart toward you. Pull them out like sheep for slaughter[c][b], and set them apart for the day of killing.
translation:
  language: ru
  text: Но Ты, Яхве, знаешь меня; Ты видишь меня и испытываешь моё сердце — оно с Тобой.[a] Вытащи их, как овец на заклание, и отдели их[b] на день бойни.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испытываешь, каково моё сердце по отношению к Тебе». Еврейская фраза кратка и может говорить о внутренней обращённости Иеремии к Яхве или о его верности Ему.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «посвяти их». Буквально — «отдели их»; здесь они отделяются не для благословения, а для суда.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально также возможно: «на день убийства» или «на день умерщвления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул «Господь».
- source_word: יְדַעְתָּנִי
  choice: знаешь меня
  rationale: Перфект в данном контексте выражает существующее и подтверждённое знание Иеремии Богом; настоящее время естественно передаёт этот смысл по-русски.
- source_word: תִּרְאֵנִי
  choice: видишь меня
  rationale: Глагол обозначает не только физическое зрение, но и проницательное восприятие; краткая формулировка сохраняет параллель с «знаешь».
- source_word: וּבָחַנְתָּ לִבִּי אִתָּךְ
  choice: испытываешь моё сердце — оно с Тобой
  rationale: Сохранены образ испытания сердца и компактная, синтаксически неоднозначная фраза אִתָּךְ. Тире позволяет отнести «с Тобой» к сердцу, не превращая эту связь в чрезмерно определённое толкование.
- source_word: הַתִּקֵם
  choice: Вытащи их
  rationale: Побудительная форма от נתק передаёт удаление посредством вытягивания или вырывания. «Вытащи» сохраняет физическую силу образа, не добавляя отсутствующего в тексте способа действия.
- source_word: כְּצֹאן לְטִבְחָה
  choice: как овец на заклание
  rationale: Устойчивая и понятная русская формула сохраняет образ овец, предназначенных для убоя.
- source_word: וְהַקְדִּשֵׁם
  choice: отдели их
  rationale: Hiphil от קדש буквально означает выделить или посвятить. В контексте речь идёт об отделении для суда, поэтому нейтральное «отдели» не придаёт действию положительного оттенка святости.
- source_word: לְיוֹם הֲרֵגָה
  choice: на день бойни
  rationale: Фраза обозначает назначенный день убийства или массового умерщвления. «День бойни» естественно и сильно передаёт суровость образа, не смягчая его.
theological_decisions:
- issue: Просьба пророка о суде над нечестивыми
  choice: Прямо сохранить образы заклания и бойни
  alternative: Смягчить формулировку до «приготовь их к суду» или понимать казнь только метафорически
  rationale: Еврейский текст недвусмысленно использует лексику заклания и убийства. Перевод не должен ни смягчать просьбу Иеремии, ни добавлять её богословское оправдание.
- issue: Значение אִתָּךְ после «моё сердце»
  choice: «моё сердце — оно с Тобой»
  alternative: «испытываешь, каково моё сердце по отношению к Тебе»
  rationale: Краткая еврейская конструкция допускает значение внутренней обращённости или верности Богу. Основной вариант сохраняет компактность и неоднозначность, а пояснительный вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся кратким и напряжённым; традиционно понятное «на заклание» сочетается с современными глаголами. Местоимения, относящиеся к Богу, написаны с прописной буквы как принятый почтительный издательский выбор.
