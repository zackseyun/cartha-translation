  source_fidelity: 'Перевод точно передаёт основные элементы еврейского текста: Божье знание, видение и испытание сердца Иеремии; просьбу удалить нечестивых, уподобив их овцам на заклание; и выделить их для дня убийства. «Сердце — оно с Тобой» является допустимой передачей сжатой и синтаксически спорной связи לִבִּי אִתָּךְ, а сноска добросовестно сохраняет пояснительную альтернативу.'
