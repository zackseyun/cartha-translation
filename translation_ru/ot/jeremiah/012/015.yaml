  text: וְ/הָיָ֗ה אַֽחֲרֵי֙ נָתְשִׁ֣/י אוֹתָ֔/ם אָשׁ֖וּב וְ/רִֽחַמְתִּ֑י/ם וַ/הֲשִׁבֹתִ֛י/ם אִ֥ישׁ לְ/נַחֲלָת֖/וֹ וְ/אִ֥ישׁ לְ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/015.yaml
  text: And it will happen[a], after I have uprooted them, that I will return and have compassion on them, and I will bring them back[c][b], each man to his inheritance and each man to his land.
translation:
  language: ru
  text: 'И будет: после того как Я вырву их с корнем[a], Я снова обращусь к ним и смилуюсь над ними[b]; Я возвращу их — каждого к его наследственному уделу[c], каждого в его страну.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выкорчую их». Еврейский глагол передаёт образ вырывания с корнем и часто служит у Иеремии образом Божьего суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «помилую их», «проявлю к ним сострадание».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский текст повторяет распределительную форму: «каждого… и каждого», то есть каждого из возвращаемых людей.'
    reason: source_form
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Естественная для русского библейского повествования формула, вводящая будущую ситуацию без архаического «и будет так». В данном контексте двоеточие ясно связывает её со следующей временной конструкцией.
- source_word: נָתְשִׁי
  choice: Я вырву их с корнем
  rationale: 'Передаёт характерный для Иеремии образ суда: не просто удалить, а вырвать, подобно растению, вместе с корнем.'
- source_word: אָשׁוּב
  choice: Я снова обращусь к ним
  rationale: שׁוב здесь употреблено непереходно и выражает новое благосклонное обращение Бога к прежде осуждённым народам. Добавленное «к ним» естественно раскрывает подразумеваемую направленность, не смешивая этот глагол со следующим каузативом того же корня.
- source_word: וְרִחַמְתִּים
  choice: и пожалею их
  rationale: В современном литературном русском «пожалеть» естественно передаёт милосердие и сострадание, выражаемые רחם, без сведения смысла лишь к эмоциональному переживанию.
- source_word: וַהֲשִׁבֹתִים
  choice: Я возвращу их
  rationale: Каузативная форма שׁוב означает, что Бог приведёт изгнанные народы обратно; «возвращу» сохраняет конкретный образ территориального возвращения.
- source_word: אִישׁ ... וְאִישׁ
  choice: каждого ... каждого
  rationale: Повтор сохраняет распределительную конструкцию еврейского текста. Русское «каждого» естественно относится к каждому представителю возвращаемых народов и не создаёт ненужного утверждения, будто речь исключительно о мужчинах.
- source_word: לְנַחֲלָתוֹ
  choice: в его наследственный удел
  rationale: «Наследственный удел» передаёт землю или владение, полученное как наследие, и сохраняет территориально-заветные оттенки נחלה яснее, чем отвлечённое «наследие».
- source_word: לְאַרְצוֹ
  choice: в его землю
  rationale: В контексте возвращения אֶרֶץ обозначает собственную территорию или страну народа; «земля» является прямым и библейски уместным соответствием.
theological_decisions:
- issue: Характер восстановления после суда
  choice: После изгнания как суда Бог вновь проявит сострадание и вернёт народы в их собственные наследственные земли.
  alternative: Понимать обещание как общее духовное восстановление без территориального возвращения.
  rationale: Слова «наследственный удел» и «земля» конкретно указывают на территориальное возвращение. Перевод сохраняет этот прямой смысл, не добавляя дальнейших доктринальных выводов.
- issue: Значение אָשׁוּב перед וַהֲשִׁבֹתִים
  choice: Передать сначала новое обращение Бога к народам, а затем совершённое Им возвращение народов.
  alternative: 'Передать אָשׁוּב наречием «снова» при глаголе милости: «снова пожалею их».'
  rationale: Оба прочтения грамматически близки по смыслу, но отдельное «снова обращусь к ним» сохраняет самостоятельность глагола שׁוב и словесную связь с каузативным «возвращу».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным, но сохранены повтор «каждого» и образ вырывания с корнем. Местоимение «Я» написано с прописной буквы как принятое русское благоговейное оформление речи Бога.
