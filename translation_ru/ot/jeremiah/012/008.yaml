lexical_decisions:
- source_word: נַחֲלָתִי
  choice: Моё наследие
  rationale: נַחֲלָה означает наследие, наследственный удел или владение. «Наследие» сохраняет идею особой принадлежности Господу и естественно звучит по-русски.
- source_word: כְּאַרְיֵה
  choice: словно лев
  rationale: אַרְיֵה — обычное обозначение льва; כְּ вводит сравнение. Женский род местоименных суффиксов обусловлен грамматическим родом נַחֲלָה и не меняет пола животного в образе.
- source_word: בַיַּעַר
  choice: в лесу
  rationale: יַעַר обычно означает лес или лесистую местность; «в лесу» — прямой и естественный эквивалент.
- source_word: נָתְנָה עָלַי בְּקוֹלָהּ
  choice: оно возвысило против Меня свой голос
  rationale: Буквально оборот говорит о том, что наследие «подало/дало против Меня свой голос». Русское «возвысило против Меня свой голос» сохраняет враждебный выкрик и формальную образность; в контексте льва возможен смысл «зарычало на Меня».
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Стандартное выражение следствия, связывающее враждебное выступление наследия с последующей реакцией говорящего.
- source_word: שְׂנֵאתִיהָ
  choice: Я возненавидел его
  rationale: Форма qatal от שׂנא прямо выражает ненависть и наиболее естественно передаётся русским совершенным прошедшим «возненавидел», не смягчая высказывание до «отверг».
- source_word: -הּ (женские местоименные суффиксы)
  choice: оно / его
  rationale: В еврейском суффиксы женского рода согласуются с נַחֲלָה. В русском «наследие» среднего рода, поэтому грамматическое согласование требует «оно/его»; олицетворение сохраняется благодаря самостоятельному действию наследия.
theological_decisions:
- issue: Отношение Бога, выраженное глаголом שְׂנֵאתִיהָ
  choice: Я возненавидел его
  alternative: Я отверг его / Я ненавижу его
  rationale: Прямое значение שׂנא и резкость речи суда сохранены без богословского смягчения. Совершенный вид естественно отражает еврейскую завершённую форму, хотя контекст допускает понимание сохраняющегося состояния.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные местоимения передают речь Бога согласно принятой русской библейской традиции. Средний род «оно/его» обусловлен русским словом «наследие» и не устраняет олицетворения.
