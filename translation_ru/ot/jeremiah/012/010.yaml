base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/010.yaml
  text: Many shepherds have ruined my vineyard[a]; they have trampled my portion[b]; they have made my pleasant portion a desolate wilderness.
translation:
  language: ru
  text: Многие пастухи[a] разорили Мой виноградник, вытоптали Мой надел[b], превратили дорогой Мне надел в безлюдную пустыню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Многие правители» или «Многие руководители»; в еврейском тексте буквально «пастухи» — распространённый пророческий образ тех, кто правит или несёт ответственность за других.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Мой участок»; еврейское слово обозначает выделенную долю или участок земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעִים רַבִּים
  choice: многие пастухи
  rationale: Сохраняет прямой образ еврейского текста; в пророческой речи «пастухи» могут обозначать правителей или иных руководителей, но основной текст не сужает метафору.
- source_word: שִׁחֲתוּ
  choice: разорили
  rationale: Передаёт тяжёлое повреждение и запустение виноградника, не обязательно подразумевая его полное уничтожение.
- source_word: כַרְמִי
  choice: Мой виноградник
  rationale: Прямо сохраняет сельскохозяйственный и одновременно метафорический образ оригинала.
- source_word: בֹּסְסוּ
  choice: вытоптали
  rationale: Естественно по-русски передаёт буквальный образ попрания ногами и хорошо сочетается с земельным участком.
- source_word: חֶלְקָתִי
  choice: Мой надел
  rationale: חֶלְקָה обозначает участок или долю земли; «надел» сохраняет земельный смысл и принадлежность говорящему, не подменяя образ толкованием «народ» или «страна».
- source_word: נָתְנוּ ... לְ
  choice: превратили ... в
  rationale: В данной результативной конструкции буквальное «дали/положили как» естественно передаётся по-русски глаголом «превратили».
- source_word: חֶלְקַת חֶמְדָּתִי
  choice: дорогой Мне надел
  rationale: Передаёт желанность, ценность и личную привязанность, выраженные словом חֶמְדָּה с притяжательным суффиксом, в естественной современной русской форме.
- source_word: לְמִדְבַּר שְׁמָמָה
  choice: в опустошённую пустыню
  rationale: Сохраняет существительное «пустыня» и усиливающий его смысл запустения и разорения.
theological_decisions:
- issue: Следует ли прямо истолковать «пастухов» как политических или духовных руководителей
  choice: Сохранить метафору «пастухи»
  alternative: правители; вожди; руководители
  rationale: Оригинал оставляет образ многозначным; его сохранение не навязывает более узкого понимания.
- issue: Следует ли раскрыть виноградник и надел как Иудею, Израиль, землю или народ
  choice: Сохранить образы «виноградник» и «надел»
  alternative: Моя земля; Моё наследие; Мой народ
  rationale: Буквально-метафорическая земельная образность составляет часть смысла стиха и не должна быть сведена к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой образностью. Заглавные формы «Мой» отражают речь Господа в ближайшем контексте. Ритмический параллелизм трёх действий сохранён.
