  text: וְ/הָיָ֡ה אִם לָמֹ֣ד יִלְמְדוּ֩ אֶת דַּֽרְכֵ֨י עַמִּ֜/י לְ/הִשָּׁבֵ֤עַ בִּ/שְׁמִ/י֙ חַי יְהוָ֔ה כַּ/אֲשֶׁ֤ר לִמְּדוּ֙ אֶת עַמִּ֔/י לְ/הִשָּׁבֵ֖עַ בַּ/בָּ֑עַל וְ/נִבְנ֖וּ בְּ/ת֥וֹךְ עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/016.yaml
  text: And it will happen that if they indeed learn the ways of my people[a], to swear by my name, ‘As Yahweh lives,’ just as they taught my people to swear by Baal[c][b], then they will be built up in the midst of my people.
translation:
  language: ru
  text: 'И если они действительно научатся путям Моего народа: клясться Моим именем: «Жив Яхве!»[b] — как они научили Мой народ клясться Ваалом, то будут утверждены среди Моего народа[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Древнееврейская формула клятвы; по смыслу также: «Клянусь жизнью Яхве».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «будут построены посреди Моего народа»; возможно также: «будут утверждены среди Моего народа».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: И если
  rationale: Сочетание вводит условие и его будущий результат. В русском языке естественная условная конструкция не требует буквального «и будет, если».
- source_word: לָמֹד יִלְמְדוּ
  choice: действительно научатся
  rationale: Инфинитив абсолютный при личной форме усиливает глагол; «действительно» передаёт эмфазу, не добавляя оттенка усердия или полноты.
- source_word: דַּרְכֵי עַמִּי
  choice: путям Моего народа
  rationale: Сохраняет образ «путей» как образа жизни, поведения и богопочитания, не сужая значение до обычаев или обрядов.
- source_word: לְהִשָּׁבֵעַ בִּשְׁמִי
  choice: клясться Моим именем
  rationale: Прямо передаёт формулу принесения клятвы с призыванием Божьего имени.
- source_word: חַי יְהוָה
  choice: «Жив Яхве!»
  rationale: Сохраняет краткую древнееврейскую формулу клятвы и передаёт имя יהוה как «Яхве».
- source_word: כַּאֲשֶׁר לִמְּדוּ אֶת עַמִּי
  choice: как прежде они научили Мой народ
  rationale: Передаёт сравнение с прежним пагубным влиянием этих народов; «прежде» естественно выражает контекстуальную временную противоположность.
- source_word: לְהִשָּׁבֵעַ בַּבָּעַל
  choice: клясться Ваалом
  rationale: Сохраняет синтаксический и богословский параллелизм с клятвой именем Яхве.
- source_word: וְנִבְנוּ
  choice: то будут устроены
  rationale: Передаёт пассивную строительную метафору в естественном русском выражении, не сводя её однозначно к физическому восстановлению, благополучию или этническому включению.
- source_word: בְּתוֹךְ עַמִּי
  choice: среди Моего народа
  rationale: Естественно передаёт пребывание и утверждение внутри сообщества Божьего народа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное заветное имя Бога; транслитерация сохраняет отличие этого имени от титула «Господь».
- issue: Смысл וְנִבְנוּ בְּתוֹךְ עַמִּי
  choice: будут устроены среди Моего народа
  alternative: будут утверждены среди Моего народа; будут восстановлены среди Моего народа
  rationale: Выбранная формулировка сохраняет строительную метафору и допускает смысл принятия и утверждения среди Божьего народа, не уточняя сверх текста характер этого включения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для русского языка, при этом сохранены образ «путей», параллелизм двух клятв и неоднозначная строительная метафора заключительной части.
