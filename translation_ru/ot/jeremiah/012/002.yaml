  yaml_path: translation/ot/jeremiah/012/002.yaml
  text: You planted them; they have even taken root. They grow; they even produce fruit. You are near in their mouth[a], but far from their innermost being.
translation:
  language: ru
  text: Ты насадил их — и они даже укоренились; растут и даже приносят плод. Ты близок на их устах, но далёк от сокровенной глубины их существа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от их почек». В древнееврейском языке «почки» могли обозначать сокровенную внутреннюю жизнь человека — его мысли, побуждения и намерения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַעְתָּם
  choice: Ты насадил их
  rationale: Qal, перфект, 2-е лицо мужского рода единственного числа с суффиксом 3-го лица множественного числа; сохраняется прямое обращение к Богу и образ насаждения.
- source_word: גַּם שֹׁרָשׁוּ
  choice: и они укоренились
  rationale: שׁרשׁ означает «пустить корни, укорениться». Частица גַּם передана присоединительным «и», естественно связывающим ступени земледельческого образа.
- source_word: יֵלְכוּ
  choice: растут
  rationale: Буквально глагол означает «идти», но в последовательности «насадил — укоренились — … — принесли плод» обозначает дальнейшее развитие или преуспевание. «Растут» естественно сохраняет растительный образ, не вводя прямо идеи нравственного благополучия.
- source_word: גַּם עָשׂוּ פֶרִי
  choice: и приносят плод
  rationale: Сочетание עשה с פֶרִי идиоматически означает «приносить плод». Второе גַּם передано присоединительным «и»; настоящее время по-русски живо выражает наблюдаемый результат.
- source_word: קָרוֹב אַתָּה בְּפִיהֶם
  choice: Ты близок на устах у них
  rationale: Буквально «Ты близок в их устах/рту». Русское «на устах» сохраняет телесный образ и ясно указывает на внешнее словесное исповедание.
- source_word: רָחוֹק מִכִּלְיוֹתֵיהֶם
  choice: далёк от их сокровенных мыслей
  rationale: כְּלָיוֹת буквально «почки», а в древнееврейской антропологии — глубинный внутренний мир, включая скрытые мысли, побуждения и намерения. «Сокровенные мысли» естественно выражает противопоставление устам, не подменяя образ словом «сердце».
theological_decisions:
- issue: Антропологический образ כִּלְיוֹתֵיהֶם
  choice: «их сокровенных мыслей» в тексте с буквальным пояснением в сноске
  alternative: «их почек»; «их внутренности»; «их сердца»
  rationale: Речь противопоставляет внешнее упоминание Бога внутренним мыслям и побуждениям людей. Анатомическое «почки» без пояснения в современном русском затемняет смысл, тогда как «сердце» неоправданно заменяет один древнееврейский образ другим. Сноска сохраняет доступ к буквальной форме и смысловому диапазону.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Земледельческая последовательность сохранена; синтаксис сделан плавным и понятным. Единственная сноска отмечена в основном тексте.
