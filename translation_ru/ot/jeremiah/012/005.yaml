  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י אֶת רַגְלִ֥ים רַ֨צְתָּה֙ וַ/יַּלְא֔וּ/ךָ וְ/אֵ֥יךְ תְּתַֽחֲרֶ֖ה אֶת הַ/סּוּסִ֑ים וּ/בְ/אֶ֤רֶץ שָׁלוֹם֙ אַתָּ֣ה בוֹטֵ֔חַ וְ/אֵ֥יךְ תַּעֲשֶׂ֖ה בִּ/גְא֥וֹן הַ/יַּרְדֵּֽן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/005.yaml
  text: If you have run with footmen and they have worn you out[a], then how will you compete with horses? And if in a land of peace you feel secure, then what will you do in the thicket of the Jordan?
translation:
  language: ru
  text: Если ты бежал с пешими и они утомили тебя, как же тебе тягаться с конями? И если в мирной стране ты чувствуешь себя в безопасности, что же ты будешь делать в зарослях Иордана?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в гордости» или «в величии Иордана»; возможно также: «при разливе Иордана». Значение еврейского выражения גְּאוֹן הַיַּרְדֵּן спорно: оно может обозначать густые заросли в пойме Иордана либо, более буквально, его «гордость», «величие» или «разлив».'
    reason: alternative_reading
lexical_decisions:
- source_word: רַגְלִים
  choice: бегущие пешие
  rationale: Буквально слово связано с идущими или бегущими на ногах и здесь противопоставлено коням. Такое выражение сохраняет образ состязания и не сужает смысл до военного контекста.
- source_word: רַצְתָּה
  choice: ты состязался
  rationale: Глагол буквально означает «бежать», однако в сочетании с последующим תְּתַחֲרֶה речь идет о состязании; русский перевод избегает неестественного «бежал с пешими».
- source_word: וַיַּלְאוּךָ
  choice: они тебя утомили
  rationale: Форма от לאה передает доведение до усталости; «утомили» естественно и достаточно близко к еврейскому.
- source_word: תְּתַחֲרֶה
  choice: тебе состязаться
  rationale: Глагол обозначает соперничество или вступление в состязание. Выбор поддерживает образ бега, не уточняя сверх текста, идет ли речь о гонке или борьбе.
- source_word: הַסּוּסִים
  choice: кони
  rationale: Прямое соответствие, сохраняющее возвышенный, но понятный библейский регистр и контраст с пешими.
- source_word: בְאֶרֶץ שָׁלוֹם
  choice: в мирной земле
  rationale: Сохраняются конкретное «земля» и существительное «мир», обозначающее спокойные, безопасные условия.
- source_word: בּוֹטֵחַ
  choice: чувствуешь себя в безопасности
  rationale: בטח может означать доверие или состояние уверенности и безопасности. Контекст указывает прежде всего на спокойствие в благоприятных обстоятельствах, а не прямо на веру в Бога.
- source_word: תַּעֲשֶׂה
  choice: что же ты будешь делать
  rationale: Прямая и естественная передача широкого по значению עשה в риторическом вопросе.
- source_word: גְּאוֹן הַיַּרְדֵּן
  choice: заросли Иордана
  rationale: В данном контексте выражение, вероятно, обозначает опасные густые заросли в пойме Иордана. Поскольку буквальное значение и точный референт спорны, альтернативы сохранены в сноске.
theological_decisions:
- issue: Значение בּוֹטֵחַ в контексте
  choice: ситуативное чувство безопасности
  alternative: доверие, в том числе религиозное упование
  rationale: Стих противопоставляет меньшую трудность большей опасности. Перевод не вводит прямого указания на доверие Богу, которого в контексте не требует еврейский текст.
- issue: Толкование גְּאוֹן הַיַּרְדֵּן
  choice: опасные заросли Иордана
  alternative: «гордость/величие Иордана» или «разлив Иордана»
  rationale: Основной текст передает наиболее вероятный контекстуальный образ, но сноска сохраняет реальную лексическую неоднозначность выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Риторический параллелизм двух вопросов сохранен; неоднозначное выражение о Иордане разъяснено в сноске без догматического разрешения.
