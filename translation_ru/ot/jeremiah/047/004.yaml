source:
  edition: WLC
  text: עַל הַ/יּ֗וֹם הַ/בָּא֙ לִ/שְׁד֣וֹד אֶת כָּל פְּלִשְׁתִּ֔ים לְ/הַכְרִ֤ית לְ/צֹר֙ וּ/לְ/צִיד֔וֹן כֹּ֖ל שָׂרִ֣יד עֹזֵ֑ר כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת פְּלִשְׁתִּ֔ים שְׁאֵרִ֖ית אִ֥י כַפְתּֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/004.yaml
  text: because of the day that is coming to devastate all the Philistines[a], to cut off from Tyre and Sidon every surviving helper. For Yahweh is devastating the Philistines, the remnant of the island of Caphtor.
translation:
  language: ru
  text: Ибо наступает день, когда будут разорены все филистимляне и у Тира и Сидона будет отнят всякий уцелевший помощник. Ведь Яхве разоряет филистимлян — остаток побережья Кафтора[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остаток острова Кафтор».'
    reason: Еврейское אִי может означать как побережье или прибрежную землю, так и остров.
lexical_decisions:
- source_word: עַל הַיּוֹם הַבָּא
  choice: Ибо наступает день
  rationale: עַל вводит причину происходящего в контексте предыдущего стиха, а причастие הַבָּא передано как приближающееся, неизбежное событие. Такая формулировка естественно связывает стих с предшествующим плачем.
- source_word: לִשְׁדֹד
  choice: когда будут разорены
  rationale: שׁדד обозначает насильственное разорение и опустошение; «разорены» передаёт национальную катастрофу, не сужая смысл до ограбления.
- source_word: אֶת כָּל פְּלִשְׁתִּים
  choice: все филистимляне
  rationale: Форма указывает на народ, а не непосредственно на территорию Филистии.
- source_word: לְהַכְרִית לְצֹר וּלְצִידוֹן כֹּל שָׂרִיד עֹזֵר
  choice: у Тира и Сидона будет отнят всякий уцелевший помощник
  rationale: הכרית передаёт устранение или отсечение; конструкция с ל перед названиями городов понята как лишение Тира и Сидона оставшейся помощи. Пассивная русская конструкция ясна и сохраняет связь обоих инфинитивов с наступающим днём.
- source_word: כִּי שֹׁדֵד יְהוָה
  choice: Ведь Яхве разоряет
  rationale: כִּי имеет пояснительно-причинное значение, а причастие שֹׁדֵד изображает действие как уже совершающееся или несомненное.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: שְׁאֵרִית אִי כַפְתּוֹר
  choice: остаток побережья Кафтора
  rationale: שְׁאֵרִית означает «остаток», а אִי может обозначать как остров, так и прибрежную землю. «Побережье» уместно в пророческой географии; иной возможный смысл отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Географический смысл אִי применительно к Кафтору
  choice: побережье Кафтора
  alternative: остров Кафтор
  rationale: Еврейское слово допускает оба значения, поэтому основной текст выбирает естественное географическое обозначение, а подлинная лексическая неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Стих сохранён как причинное продолжение предыдущего контекста; избегнуты архаизмы и конфессионально маркированные формулы.
