  text: ה֗וֹי חֶ֚רֶב לַֽ/יהוָ֔ה עַד אָ֖נָה לֹ֣א תִשְׁקֹ֑טִי הֵאָֽסְפִי֙ אַל תַּעְרֵ֔/ךְ הֵרָגְעִ֖י וָ/דֹֽמִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/006.yaml
  text: Ah, sword of the LORD, how long will you not be quiet? Return to your sheath; rest and be still.
translation:
  language: ru
  text: О, меч Господа! Долго ли ты не успокоишься? Вернись в ножны, утихни и замри.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: О
  rationale: Междометие выражает скорбный, напряжённый возглас; русское «О» сохраняет возвышенный пророческий тон без излишней конкретизации как «увы».
- source_word: חֶרֶב לַיהוָה
  choice: меч Господа
  rationale: Конструкция указывает на меч, принадлежащий Господу или служащий Ему; естественное русское сочетание сохраняет эту ёмкость.
- source_word: עַד־אָנָה לֹא תִשְׁקֹטִי
  choice: Долго ли ты не успокоишься?
  rationale: Идиоматически передаёт буквальное «до каких пор не будешь покоиться?» и сохраняет обращение к мечу в женском роде.
- source_word: הֵאָסְפִי אֶל־תַּעְרֵךְ
  choice: Вернись в ножны
  rationale: Буквально мечу велено «собраться/убраться к своим ножнам»; «вернись» естественно передаёт требование убрать меч обратно, а множественное «ножны» соответствует русской норме.
- source_word: הֵרָגְעִי וָדֹמִּי
  choice: утихни и замри
  rationale: Первый глагол призывает прекратить волнение и обрести покой, второй — безмолвствовать или оставаться неподвижным; выбранная пара передаёт оба взаимодополняющих оттенка.
theological_decisions:
- issue: Смысл оборота לַיהוָה
  choice: «меч Господа»
  alternative: «меч для Господа»
  rationale: Контекст изображает меч как орудие Господнего суда; родительная конструкция по-русски естественна и не уточняет сверх текста, идёт ли речь прежде всего о принадлежности, назначении или посланничестве.
- issue: Персонификация меча
  choice: Сохранено прямое обращение во втором лице
  alternative: Передать как просьбу к Господу убрать меч
  rationale: Еврейский текст прямо обращается к мечу формами женского рода, и эту поэтическую напряжённость следует сохранить.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Обращение к мечу сохранено; архаизмы и конфессионально маркированная передача имени не вводятся.
