source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנֵּה מַ֜יִם עֹלִ֤ים מִ/צָּפוֹן֙ וְ/הָיוּ֙ לְ/נַ֣חַל שׁוֹטֵ֔ף וְ/יִשְׁטְפוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֣שְׁבֵי בָ֑/הּ וְ/זָֽעֲקוּ֙ הָֽ/אָדָ֔ם וְ/הֵילִ֕ל כֹּ֖ל יוֹשֵׁ֥ב הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/002.yaml
  text: 'Thus says the LORD: Behold, waters are rising from the north, and they will become an overflowing torrent; they will overflow the land and its fullness, the city and those who dwell in it. Then mankind will cry out, and every inhabitant of the land will wail.'
translation:
  language: ru
  text: 'Так говорит Господь:

    «Вот, с севера поднимаются воды;

    они станут разливающимся потоком

    и затопят землю и всё, что её наполняет,

    город и его жителей.

    Люди закричат,

    и зарыдает каждый житель земли».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона, соответствующая принятому в английском консультационном тексте LORD.
- source_word: נַחַל שׁוֹטֵף
  choice: разливающийся поток
  rationale: Передаёт образ мощного водного потока, выходящего из берегов; глагольное прилагательное שׁוֹטֵף сохраняет динамику затопления.
- source_word: אֶרֶץ וּמְלוֹאָהּ
  choice: землю и всё, что её наполняет
  rationale: Сохраняет меризм и широкое значение מְלוֹאָהּ, не сводя его только к населению или имуществу.
- source_word: הָאָדָם
  choice: люди
  rationale: В данном собирательном контексте обозначает людей вообще; естественная современная русская передача без искусственного единственного числа.
- source_word: הֵילִל
  choice: зарыдает
  rationale: Передаёт громкий скорбный вопль, сохраняя отличие от предшествующего וְזָעֲקוּ — «закричат».
theological_decisions:
- issue: Образ вод с севера
  choice: Сохранён буквально как «с севера поднимаются воды»
  alternative: Истолковать непосредственно как наступающее войско
  rationale: Текст выражает суд через метафору наводнения; её не следует заменять толкованием, хотя в контексте она может указывать на военное вторжение.
- issue: Объём выражения הָאָדָם
  choice: «Люди» как собирательное обозначение
  alternative: «человек» или «человечество»
  rationale: Форма допускает обобщённое значение; «люди» естественно согласуется с множественным числом сказуемого и не расширяет смысл до всего человечества.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и образность еврейского текста сохранены, при этом устранены неестественные для русского языка кальки.
