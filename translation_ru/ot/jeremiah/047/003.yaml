  text: מִ/קּ֗וֹל שַֽׁעֲטַת֙ פַּרְס֣וֹת אַבִּירָ֔י/ו מֵ/רַ֣עַשׁ לְ/רִכְבּ֔/וֹ הֲמ֖וֹן גַּלְגִּלָּ֑י/ו לֹֽא הִפְנ֤וּ אָבוֹת֙ אֶל בָּנִ֔ים מֵֽ/רִפְי֖וֹן יָדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/003.yaml
  text: At the sound of the stamping of the hooves of his mighty horses[a], at the rumbling of his chariots, at the roar of his wheels, fathers do not turn to their sons because of the helplessness of their hands.
translation:
  language: ru
  text: От топота копыт его могучих коней, от грохота его колесниц, от грохота его колёс отцы не оборачиваются к сыновьям — так обессилели их руки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за слабости рук» — образ охватившего их ужаса и полной утраты сил.'
    reason: Пояснение еврейской идиомы при сохранении телесного образа в основном тексте.
lexical_decisions:
- source_word: מִקּוֹל שַׁעֲטַת פַּרְסוֹת
  choice: От топота копыт
  rationale: Сочетание передаёт слуховой образ и тяжёлый стук конских копыт; отдельное «от звука» по-русски было бы избыточно.
- source_word: אַבִּירָיו
  choice: его могучих коней
  rationale: В сочетании с «копытами» слово обозначает сильных боевых коней; «могучих» сохраняет поэтическую силу исходного наименования.
- source_word: מֵרַעַשׁ לְרִכְבּוֹ
  choice: от грохота его колесниц
  rationale: רַעַשׁ выражает сильный шум, грохот или сотрясение, а רֶכֶב здесь имеет собирательное значение — колесницы или колесничное войско.
- source_word: הֲמוֹן גַּלְגִּלָּיו
  choice: от грохота его колёс
  rationale: הֲמוֹן обозначает громкий шум или гул; повтор «грохота» естественно передаёт нарастающую звуковую картину, а колёса относятся к колесницам.
- source_word: לֹא הִפְנוּ אָבוֹת אֶל בָּנִים
  choice: отцы не оборачиваются к сыновьям
  rationale: Сохранены конкретные мужские термины исходного текста и значение поворота к кому-либо; настоящее время передаёт живое пророческое описание.
- source_word: מֵרִפְיוֹן יָדָיִם
  choice: так обессилели их руки
  rationale: Буквально речь идёт о слабости или вялости рук — телесном образе вызванной ужасом утраты сил. Формулировка сохраняет образ и ясно выражает причинную связь.
theological_decisions:
- issue: Родовые обозначения אָבוֹת и בָּנִים
  choice: отцы ... сыновьям
  alternative: родители ... детям
  rationale: Еврейский текст употребляет именно слова «отцы» и «сыновья»; расширение до гендерно-нейтральных обозначений сняло бы конкретность исходного образа.
- issue: Причина, по которой отцы не обращаются к сыновьям
  choice: так обессилели их руки
  alternative: из-за паники они не в силах помочь сыновьям
  rationale: Перевод сохраняет телесную идиому и не уточняет сверх текста, означает ли поворот попытку помочь, спасти или просто посмотреть на сыновей.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой военной поэзии. Тройное перечисление звуков сохраняет нарастающий ритм; тире перед причиной делает длинную фразу ясной, не устраняя смысловой напряжённости.
