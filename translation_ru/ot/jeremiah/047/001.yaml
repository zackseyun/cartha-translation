base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/001.yaml
  text: This is the word of Yahweh that came to Jeremiah the prophet concerning the Philistines[b][a], before Pharaoh struck Gaza.
translation:
  language: ru
  text: Слово Яхве, которое пришло к пророку Иеремии о филистимлянах[a], прежде чем фараон поразил Газу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против филистимлян». Предлог может обозначать предмет пророчества, а в контексте суда — его враждебную направленность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה
  choice: Слово Яхве, которое было
  rationale: Сохранена относительная конструкция еврейского заголовка и традиционная для русского пророческого стиля формула «слово… было», без добавления отсутствующего в оригинале указательного элемента.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя в соответствии с проектным решением, а не заменяет его титулом.
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: к пророку Иеремии
  rationale: Первое אֶל обозначает адресата откровения; такой порядок слов естественен и достоин в современном русском.
- source_word: אֶל פְּלִשְׁתִּים
  choice: о филистимлянах
  rationale: В заголовке пророчества предлог אֶל может вводить его предмет или объект; «о» сохраняет более широкое значение, не навязывая заранее враждебной направленности.
- source_word: בְּטֶרֶם
  choice: прежде чем
  rationale: Естественно передаёт временное отношение к последующему событию.
- source_word: יַכֶּה
  choice: поразил
  rationale: Глагол נכה в породе hifil означает «ударить, поразить»; «поразил» сохраняет широту значения и не уточняет характер военного действия сверх текста.
- source_word: פַרְעֹה
  choice: фараон
  rationale: Общепринятая русская форма царского титула.
- source_word: עַזָּה
  choice: Газу
  rationale: Общепринятая русская форма географического названия עַזָּה.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Направленность пророчества אֶל פְּלִשְׁתִּים
  choice: о филистимлянах
  alternative: против филистимлян
  rationale: Контекст главы связан с судом, однако сам предлог в пророческом заголовке допускает нейтральное обозначение предмета речи; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис заголовка близок к еврейскому, но остаётся понятным; архаизмы вроде «доколе» и «филистимлянам же» не используются.
