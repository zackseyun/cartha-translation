  text: בָּ֤אָה קָרְחָה֙ אֶל עַזָּ֔ה נִדְמְתָ֥ה אַשְׁקְל֖וֹן שְׁאֵרִ֣ית עִמְקָ֑/ם עַד מָתַ֖י תִּתְגּוֹדָֽדִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/005.yaml
  text: Baldness has come upon Gaza[a]; Ashkelon has been silenced, the remnant of their valley[c][b]. How long will you gash yourself?
translation:
  language: ru
  text: На Газу пришло облысение; Ашкелон умолк[a] — остаток их долины[b]. До каких пор ты будешь наносить себе порезы?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ашкелон истреблён» / «Ашкелон погиб». Еврейский глагол может означать, что кто-либо умолк, был пресечён или уничтожен.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «остаток их долины». Некоторые толкователи, следуя древним переводам или иной огласовке, понимают эту фразу иначе, в том числе как «остаток анакимов».'
    reason: alternative_reading
  - marker: c
    text: Нанесение себе порезов было на древнем Ближнем Востоке обычаем, связанным с трауром.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְחָה
  choice: облысение
  rationale: Существительное обозначает плешь или облысение; в данном контексте это образ траура и постигшего город бедствия. Выбор сохраняет образ, не превращая его в прямо названное действие бритья.
- source_word: בָּאָה ... אֶל עַזָּה
  choice: на Газу пришло
  rationale: Сочетание глагола «приходить» с אֶל передаёт наступление бедствия на Газу; русская конструкция сохраняет олицетворённый и зловещий характер образа.
- source_word: נִדְמְתָה
  choice: умолк
  rationale: Форма нифаля от דמה может означать, что город умолк, был приведён к безмолвию, пресечён или уничтожен. «Умолк» сохраняет основной образ, не устраняя более сильного оттенка гибели в контексте военного суда.
- source_word: שְׁאֵרִית
  choice: остаток
  rationale: Передаёт то, что осталось после разорения, и естественно сочетается с последующим определением.
- source_word: עִמְקָם
  choice: их долины
  rationale: Масоретское чтение естественно понимается как «их долина» с местоименным суффиксом 3-го лица множественного числа. Неясность референта «их» сохранена.
- source_word: עַד מָתַי
  choice: долго ли тебе ещё
  rationale: Современная русская вопросительная формула естественно передаёт значение «до каких пор» и сохраняет обращение к городу.
- source_word: תִּתְגּוֹדָדִי
  choice: наносить себе порезы
  rationale: Возвратная форма обозначает ритуальное самоповреждение при оплакивании. Перевод сохраняет возвратность и конкретность действия без излишне архаичной лексики.
theological_decisions:
- issue: Степень разрушения, выраженная глаголом נִדְמְתָה
  choice: 'В основном тексте сохранён образ безмолвия: «умолк».'
  alternative: «Погиб», «уничтожен» или «истреблён».
  rationale: Еврейский глагол допускает как образ прекращения голоса и деятельности, так и более сильное значение уничтожения. Контекст не требует устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого, поэтического строя пророческого речения. Необычный образ «пришло облысение» оставлен ради близости к еврейскому существительному и его олицетворению; обращение «тебе» сохраняет грамматически единственного адресата, не уточняя, к какому именно городу оно относится.
