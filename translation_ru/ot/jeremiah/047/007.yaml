base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/007.yaml
  text: How can you be quiet when Yahweh has commanded it? Against Ashkelon and against the seacoast—there he has appointed it[a][b].
translation:
  language: ru
  text: Как тебе утихнуть, когда Яхве отдал ей повеление[a]? К Ашкелону и к морскому берегу — туда Он определил её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В древнееврейском тексте после обращения «тебе» стоят формы 3-го лица женского рода: буквально «отдал ей повеление» и «определил её». Они относятся к олицетворённому мечу из предыдущего стиха. Предлог в выражении «к Ашкелону и к морскому берегу» также может по контексту подразумевать направленность против них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ תִּשְׁקֹטִי
  choice: Как можешь ты успокоиться
  rationale: Риторический вопрос передаёт невозможность покоя; форма женского рода сохраняет обращение к олицетворённому «мечу» из предыдущего стиха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном.
- source_word: צִוָּה לָהּ
  choice: повелел тебе
  rationale: Буквально «повелел ей»; поскольку говорящий непосредственно обращается к мечу, русское «тебе» естественно сохраняет и грамматику, и олицетворение.
- source_word: אֶל אַשְׁקְלוֹן וְאֶל חוֹף הַיָּם
  choice: на Ашкелон и на морское побережье
  rationale: Предлог אֶל обозначает направление («к, на»); в контексте направленного меча оборот также подразумевает враждебное действие, не делая его явным сверх текста.
- source_word: שָׁם יְעָדָהּ
  choice: туда Он направил тебя
  rationale: שָׁם имеет местно-направительное значение в данном контексте, а יעד выражает назначение или определение к цели. «Направил» естественно сочетается с мечом и сохраняет идею данного Богом назначения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Референт суффиксов женского рода
  choice: Последовательно передать их обращением «тебе / тебя» к олицетворённому мечу
  alternative: Передать как «ему / его» либо смешать прямое обращение с третьим лицом
  rationale: Суффиксы относятся к слову «меч» из Иер 47:6, которое в древнееврейском языке женского рода. Прямое обращение по-русски позволяет ясно сохранить олицетворение, хотя русское слово «меч» мужского рода.
- issue: Направление или враждебная направленность אֶל
  choice: на Ашкелон и на морское побережье
  alternative: против Ашкелона и против морского побережья
  rationale: «На» сохраняет базовое направительное значение предлога, тогда как враждебный смысл достаточно ясен из контекста меча и суда.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Перестановка «можешь ты» слегка подчёркивает риторический вопрос. Заглавная буква в «Он» используется как уважительное оформление местоимения, относящегося к Яхве.
