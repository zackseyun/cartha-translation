base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/022.yaml
  text: Behold[a], like an eagle he will rise up and swoop down and spread his wings over Bozrah, and the heart of Edom’s warriors on that day will become like the heart of a woman in labor.
translation:
  language: ru
  text: Вот, словно орёл[a], он поднимется, полетит и расправит крылья над Боцрой. В тот день сердце воинов Эдома станет как сердце роженицы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гриф»; еврейское слово может обозначать крупную хищную птицу вообще, хотя здесь традиционно переводится как «орёл».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет пророческий призыв обратить внимание и при этом звучит естественно и торжественно в современном русском языке.
- source_word: כַנֶּשֶׁר
  choice: словно орёл
  rationale: נֶשֶׁר обозначает крупную хищную птицу; «орёл» — традиционный и естественный вариант, а возможное более широкое значение отмечено в сноске.
- source_word: יַעֲלֶה וְיִדְאֶה
  choice: он поднимется, полетит
  rationale: Передаёт последовательность движения без добавления явно не выраженного в еврейском тексте снижения или броска вниз. «Полетит» сохраняет некоторую неопределённость характера полёта.
- source_word: וְיִפְרֹשׂ כְּנָפָיו
  choice: и расправит крылья
  rationale: Естественно передаёт образ распростёртых над городом крыльев и нависшей угрозы.
- source_word: עַל בָּצְרָה
  choice: над Боцрой
  rationale: Предлог «над» соответствует пространственному образу крыльев, распростёртых над городом; «Боцра» непосредственно передаёт еврейское название.
- source_word: לֵב גִּבּוֹרֵי אֱדוֹם
  choice: сердце воинов Эдома
  rationale: Сохранено собирательное единственное число «сердце» и военное значение גִּבּוֹרֵי, без истолковывающей замены на «мужество».
- source_word: וְהָיָה ... כְּלֵב אִשָּׁה מְצֵרָה
  choice: станет как сердце роженицы
  rationale: «Станет» ясно передаёт наступление нового состояния, а «роженица» кратко и естественно выражает образ женщины, испытывающей родовые муки.
theological_decisions:
- issue: Кого изображает нападающий, уподобленный орлу
  choice: Сохранено местоимение «он» без прямого указания личности нападающего.
  alternative: Назвать царя Вавилона, Навуходоносора, Господа или неопределённое войско.
  rationale: Ближайший контекст позволяет связать образ с вавилонским нашествием, однако сам стих прямо не называет действующее лицо. Перевод сохраняет эту литературную и богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим тоном. Короткие, наглядные образы оригинала сохранены; синтаксис разделён на два предложения для ясности без изменения логической связи.
