  text: וְ/הָיְתָ֥ה אֱד֖וֹם לְ/שַׁמָּ֑ה כֹּ֚ל עֹבֵ֣ר עָלֶ֔י/הָ יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכּוֹתֶֽ/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/017.yaml
  text: Edom will become a desolation[b][a]; everyone who passes by her will be appalled and will whistle at all her wounds.
translation:
  language: ru
  text: Эдом превратится в ужасающее запустение[a]; каждый, кто пройдёт мимо него, ужаснётся и присвистнет при виде всех его ран[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станет местом, внушающим ужас». Еврейское слово может обозначать как запустение, так и ужас, который оно вызывает.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «издаст свистящий звук». Такой звук мог выражать изумление или насмешку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: превратится
  rationale: В пророческом контексте форма указывает на будущее итоговое состояние; «превратится» естественно передаёт наступление этого состояния.
- source_word: אֱדוֹם
  choice: Эдом
  rationale: Общепринятая русская передача названия страны и народа.
- source_word: לְשַׁמָּה
  choice: в ужасающее запустение
  rationale: Слово обозначает опустошение и одновременно ужас, который оно вызывает у очевидцев; сочетание сохраняет обе смысловые стороны.
- source_word: כָּל עֹבֵר עָלֶיהָ
  choice: каждый, кто пройдёт мимо него
  rationale: Собирательная конструкция передана естественно по-русски. Хотя еврейский суффикс женского рода представляет страну как женщину, русское название «Эдом» грамматически мужского рода.
- source_word: יִשֹּׁם
  choice: ужаснётся
  rationale: Глагол описывает потрясённую, ужасающуюся реакцию человека при виде разорения.
- source_word: וְיִשְׁרֹק
  choice: присвистнет
  rationale: Глагол обозначает резкий свистящий звук как выражение изумления или насмешки; «присвистнет» ясно передаёт такую реакцию в современном русском языке.
- source_word: עַל כָּל מַכּוֹתֶיהָ
  choice: при виде всех его ран
  rationale: מַכּוֹת буквально означает удары, поражения и вызванные ими раны; «раны» сохраняет яркий образ последствий бедствия, а «при виде» естественно выражает повод для реакции.
