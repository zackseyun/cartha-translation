source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה הִ֠נֵּה אֲשֶׁר אֵ֨ין מִשְׁפָּטָ֜/ם לִ/שְׁתּ֤וֹת הַ/כּוֹס֙ שָׁת֣וֹ יִשְׁתּ֔וּ וְ/אַתָּ֣ה ה֔וּא נָקֹ֖ה תִּנָּקֶ֑ה לֹ֣א תִנָּקֶ֔ה כִּ֥י שָׁתֹ֖ה תִּשְׁתֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/012.yaml
  text: 'For thus says Yahweh: Behold[a], those who were not sentenced to drink the cup will surely drink, and are you the one who will go unpunished? You will not go unpunished[c][b], for you will surely drink.'
translation:
  language: ru
  text: 'Ибо так говорит Господь: «Вот, те, кому не полагалось пить чашу[a][c], непременно выпьют; а ты — неужели останешься без наказания?[b] Нет, без наказания ты не останешься, ибо непременно выпьешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кому по суду не причиталось пить чашу». Еврейское слово מִשְׁפָּט может означать суд, справедливость, законно установленную долю или должное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «неужели будешь оправдан? Нет, оправдан ты не будешь».'
    reason: lexical_alternative
  - marker: c
    text: «Чаша» — пророческий образ суда, который Бог даёт народам испить.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и естественная для русского библейского текста передача тетраграмматона; сохраняет достоинство речи, не навязывая спорную русскую транслитерацию.
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-эмфатическую силу частицы и естественно звучит в современном литературном русском.
- source_word: אֲשֶׁר אֵין מִשְׁפָּטָם לִשְׁתּוֹת הַכּוֹס
  choice: те, кому не полагалось пить эту чашу
  rationale: מִשְׁפָּטָם допускает значения суда, законной доли или должного. «Не полагалось» сохраняет идею не назначенной им участи, не сужая её исключительно до формального приговора.
- source_word: הַכּוֹס
  choice: эту чашу
  rationale: Образ чаши сохранён без поясняющего добавления «гнева» или «суда»; указательное «эту» естественно отсылает к известному из контекста образу.
- source_word: שָׁתוֹ יִשְׁתּוּ
  choice: непременно выпьют
  rationale: Инфинитив абсолютный с личной формой глагола выражает усиление и несомненность действия.
- source_word: וְאַתָּה הוּא נָקֹה תִּנָּקֶה
  choice: а ты — неужели останешься без наказания?
  rationale: Сохраняет усиленное противопоставление и риторический вопрос; в контексте суда נקה естественно означает избежать наказания.
- source_word: לֹא תִנָּקֶה
  choice: Нет, без наказания ты не останешься
  rationale: Прямая отрицательная реплика сохраняет судебно-карательный смысл корня נקה и риторическую силу повтора.
- source_word: כִּי שָׁתֹה תִּשְׁתֶּה
  choice: потому что непременно выпьешь
  rationale: Передаёт причинную связь и эмфатическую конструкцию, подчёркивающую неизбежность.
theological_decisions:
- issue: Значение образа чаши
  choice: Сохранить в основном тексте только «чашу».
  alternative: «чаша гнева» или «чаша суда»
  rationale: В еврейском тексте определение отсутствует. Контекст указывает на ниспосланный Богом суд, но явное добавление разрешило бы метафору за читателя.
- issue: Судебный оттенок נקה
  choice: «остаться без наказания»
  alternative: «быть оправданным»
  rationale: Обе передачи возможны, однако контекст пророчества об участи народов делает значение избегания наказания наиболее естественным, при этом альтернативный судебный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим звучанием. Повторы «без наказания» и «непременно выпьешь» намеренно сохранены как элементы еврейской риторики. Все сноски отмечены в основном тексте.
