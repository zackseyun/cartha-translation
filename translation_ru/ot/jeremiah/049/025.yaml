  language: en
  yaml_path: translation/ot/jeremiah/049/025.yaml
  text: How is the city of praise not abandoned[b][a], the city of my joy?
translation:
  language: ru
  text: Как же не был покинут прославленный город, город моей радости?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «город моей радости»; не вполне ясно, кому принадлежит первое лицо.'
    reason: speaker_ambiguity
lexical_decisions:
- source_word: אֵיךְ
  choice: Как же
  rationale: Вопросительно-восклицательная частица выражает изумление и скорбь; «как же» естественно передаёт эту силу, не сводя вопрос к причинному «почему».
- source_word: לֹא
  choice: не
  rationale: Прямо передаёт отрицание при пассивной форме глагола.
- source_word: עֻזְּבָה
  choice: покинут
  rationale: Пассивная форма женского рода от עזב означает, что город оставлен или покинут. Краткое причастие сохраняет состояние, выраженное еврейской формой, и звучит естественно по-русски.
- source_word: עִיר תהלה
  choice: прославленный город
  rationale: תהלה буквально связано с хвалой, но здесь характеризует Дамаск как знаменитый, восхваляемый город. «Прославленный город» передаёт этот смысл естественнее, чем буквальное «город хвалы».
- source_word: קִרְיַת
  choice: город
  rationale: Конструктивная форма образует параллельное приложение; повтор слова «город» сохраняет поэтическое построение стиха.
- source_word: מְשׂוֹשִׂי
  choice: моей радости
  rationale: Существительное «радость, ликование» имеет суффикс первого лица единственного числа. Перевод сохраняет это лицо, не определяя однозначно, кому принадлежит голос плача.
theological_decisions:
- issue: Кто говорит «моей радости»
  choice: Сохранено первое лицо без указания говорящего
  alternative: Заменить на безличное «город радости» или прямо приписать слова Дамаску либо Богу
  rationale: Еврейский текст содержит суффикс первого лица, однако личность говорящего остаётся спорной. Уточнение в основном тексте устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной поэтической интонацией. «Как же» передаёт плачевное изумление, а повтор «город» сохраняет параллелизм оригинала.
