id: JER.49.2
reference: Jeremiah 49:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/כֵ֡ן הִנֵּה֩ יָמִ֨ים בָּאִ֜ים נְאֻם יְהוָ֗ה וְ֠/הִשְׁמַעְתִּי אֶל רַבַּ֨ת בְּנֵי עַמּ֜וֹן תְּרוּעַ֣ת מִלְחָמָ֗ה וְ/הָֽיְתָה֙ לְ/תֵ֣ל שְׁמָמָ֔ה וּ/בְנֹתֶ֖י/הָ בָּ/אֵ֣שׁ תִּצַּ֑תְנָה וְ/יָרַ֧שׁ יִשְׂרָאֵ֛ל אֶת יֹרְשָׁ֖י/ו אָמַ֥ר יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/002.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when I will cause the battle cry to be heard against Rabbah of the Ammonites, and it will become a desolate mound, and its daughter towns will be set on fire. Then Israel will dispossess those who dispossessed him[c][b], says Yahweh.
translation:
  language: ru
  text: Поэтому вот, наступают дни, — возвещает Яхве, — когда Я сделаю так, что против Раввы аммонитян раздастся боевой клич[a]. Она станет безлюдной грудой развалин, а её дочерние города[b] будут преданы огню. Тогда Израиль лишит владений тех, кто лишил владений его[c], — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «военный крик»; или: «сигнал военной тревоги».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «её дочери» — зависимые от главного города меньшие города и селения.'
    reason: cultural_note
  - marker: c
    text: 'В еврейском тексте здесь игра слов с одним и тем же глаголом: Израиль «лишит владений» тех, кто прежде «лишил владений» его. Этот глагол может также означать «овладеть» или «получить во владение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт логическое следствие из обвинения и приговора в предыдущем контексте.
- source_word: הִנֵּה יָמִים בָּאִים
  choice: вот, наступают дни
  rationale: Сохраняет торжественную пророческую формулу и указательное ударение הִנֵּה, оставаясь естественной для современного русского языка.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую формулу пророческого изречения и отличает её от заключительного אָמַר יְהוָה — «говорит Яхве».
- source_word: וְהִשְׁמַעְתִּי
  choice: Я сделаю так, что … раздастся
  rationale: Сохраняет каузативное значение породы hифиль глагола שׁמע в естественной русской конструкции.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: Равва аммонитян
  rationale: Передаёт название аммонитской столицы и принадлежность её народу Аммона без тяжеловесного буквального «сынов Аммона».
- source_word: תְּרוּעַת מִלְחָמָה
  choice: боевой клич
  rationale: Кратко и ясно передаёт громкий воинский крик или сигнал тревоги; альтернативы отмечены в сноске.
- source_word: וְהָיְתָה לְתֵל שְׁמָמָה
  choice: она станет безлюдной грудой развалин
  rationale: תֵל обозначает холм или груду, оставшуюся от разрушенного поселения, а שְׁמָמָה подчёркивает запустение.
- source_word: וּבְנֹתֶיהָ
  choice: её дочерние города
  rationale: Сохраняет образ «дочерей» и поясняет, что речь идёт о зависимых от Раввы поселениях.
- source_word: בָּאֵשׁ תִּצַּתְנָה
  choice: будут преданы огню
  rationale: Естественно передаёт поджог и уничтожение зависимых городов огнём.
- source_word: וְיָרַשׁ יִשְׂרָאֵל אֶת־יֹרְשָׁיו
  choice: Израиль лишит владений тех, кто лишил владений его
  rationale: Сохраняет повтор одного еврейского корня ירש и корпоративное единственное число, относящееся к Израилю.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст непосредственно употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное Божье имя, не подменяя его титулом.
- issue: Корпоративное единственное число в יֹרְשָׁיו
  choice: его
  alternative: их
  rationale: Израиль представлен как единое лицо мужского рода; «его» сохраняет грамматическое число исходного текста и естественно согласуется с русским названием «Израиль».
- issue: Двукратное употребление корня ירש
  choice: лишит владений тех, кто лишил владений его
  alternative: овладеет владениями своих захватчиков
  rationale: Выбранная формулировка не снимает напряжение между значениями «овладевать», «наследовать» и «лишать владения» и по возможности воспроизводит словесную игру исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис прояснён без устранения образности и словесной игры еврейского текста; архаизмы и конфессионально окрашенные замены Божьего имени не используются.
