  yaml_path: translation/ot/jeremiah/049/013.yaml
  text: For I have sworn by myself, declares the LORD, that Bozrah will become a horror, a reproach, a ruin, and a curse, and all her cities will become everlasting ruins.
translation:
  language: ru
  text: Ибо Я поклялся Собою, — возвещает Господь, — что Боцра станет ужасом, поношением, руиной и проклятием, а все её города станут вечными развалинами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִי נִשְׁבַּעְתִּי
  choice: Мною Самим Я поклялся
  rationale: Передаёт буквальное «Я поклялся Собою» естественной и торжественной русской формулировкой, сохраняя эмфатическое значение местоимения.
- source_word: נְאֻם יְהוָה
  choice: возвещает Господь
  rationale: Пророческая формула передана литературно и понятно; тетраграмматон по принятой русской библейской традиции передан как «Господь».
- source_word: לְשַׁמָּה
  choice: ужасом
  rationale: Слово обозначает состояние опустошения, вызывающее потрясение и ужас; в данном перечне метонимическое «ужас» звучит естественно.
- source_word: לְחֶרְפָּה
  choice: посмешищем
  rationale: Передаёт публичный позор и поношение, которым станет город.
- source_word: לְחֹרֶב
  choice: развалинами
  rationale: Сохраняет конкретный образ разрушенного места; согласуется с родственным множественным חָרְבוֹת далее в стихе.
- source_word: לִקְלָלָה
  choice: проклятием
  rationale: Сохраняет возможность смысла «примером, упоминаемым в проклятии», не разворачивая её в толкование.
- source_word: חָרְבוֹת עוֹלָם
  choice: вечными развалинами
  rationale: Прямо передаёт устойчивый образ длительного, необратимого запустения без ослабления временного определения עוֹלָם.
theological_decisions:
- issue: Божественная клятва Собою
  choice: Мною Самим Я поклялся
  alternative: Я поклялся Собою
  rationale: 'Сохранено необычное богословски значимое утверждение исходного текста: Господь клянётся Самим Собою; формулировка не поясняет и не смягчает его.'
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Использована укоренившаяся русская библейская передача, не вводящая конфессионально маркированного решения; титульное значение обозначено прописной буквой.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет торжественную формулу клятвы и четырёхчастный ряд последствий; архаизмы и избыточные пояснения исключены.
