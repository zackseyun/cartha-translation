  source_fidelity: 'Смысловой ряд передан в целом верно: клятва Господа Собою, Боцра и четыре последствия, а также «вечные развалины» городов сохранены. Однако «Мною Самим Я поклялся» — неестественная русская калька, а «развалинами» в первом перечислении менее точно передаёт единственное число חֹרֶב («руина», «разорение»).'
