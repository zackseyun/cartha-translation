lexical_decisions:
- source_word: מִקּוֹל
  choice: От звука
  rationale: Предлог מִן при קוֹל может указывать на источник или повод; «от звука» естественно передаёт причинно-исходный оттенок и сохраняет образ исходного текста.
- source_word: נִפְלָם
  choice: их падения
  rationale: Форма от נפל означает «падать»; «падение» сохраняет метафору крушения, не усиливая её более толковательным словом «гибель».
- source_word: רָעֲשָׁה
  choice: содрогается
  rationale: Глагол רעשׁ обозначает сильное сотрясение. «Содрогается» звучит естественно и торжественно применительно к земле и передаёт силу катастрофического образа.
- source_word: הָאָרֶץ
  choice: земля
  rationale: אֶרֶץ может означать и конкретную страну, и землю вообще; в формуле о сотрясении «земля» сохраняет возможный широкий, почти космический масштаб.
- source_word: צְעָקָה ... קוֹלָהּ
  choice: их вопль
  rationale: צְעָקָה — громкий крик или вопль, а женский суффикс в קוֹלָהּ отсылает к этому существительному. Местоимение «их» связывает вопль с теми, о чьём падении сказано ранее, без буквального повтора «голос его».
- source_word: בְּיַם סוּף
  choice: у Красного моря
  rationale: Предлог בְּ здесь указывает на место, до которого доносится вопль; по-русски естественно «у». Традиционное географическое название «Красное море» дано в тексте, а буквальная форма отражена в сноске.
- source_word: נִשְׁמַע
  choice: слышен
  rationale: Нифаль от שׁמע выражает пассивное значение «быть услышанным»; краткая форма «слышен» естественно передаёт, что звук доносится до далёкого места.
