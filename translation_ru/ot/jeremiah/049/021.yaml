  text: At the sound of their fall the earth quakes[a]; their cry is heard at the Red Sea.
translation:
  language: ru
  text: От звука их падения содрогается земля, и до Красного моря[a] доносится их вопль.
  philosophy: optimal-equivalence
  footnotes:
