  text: כִּֽי הִנֵּ֥ה קָטֹ֛ן נְתַתִּ֖י/ךָ בַּ/גּוֹיִ֑ם בָּז֖וּי בָּ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/015.yaml
  text: For look, I have made you small among the nations, despised among men.
translation:
  language: ru
  text: Ибо вот, Я сделал тебя малым среди народов, презираемым среди людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ибо вот
  rationale: Сохраняет причинно-пояснительное כִּי и эмфатическое привлечение внимания הִנֵּה в естественной и dignified русской формулировке.
- source_word: קָטֹן נְתַתִּיךָ
  choice: Я сделал тебя малым
  rationale: Конструкция с נתן и предикативным прилагательным передаёт назначение или приведение в состояние; «сделал тебя малым» близко к форме и смыслу оригинала.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם в данном международном контексте означает народы; предлог ב передаёт положение среди них.
- source_word: בָּזוּי בָּאָדָם
  choice: презираемым среди людей
  rationale: Буквально сохраняет пассивное значение בָּזוּי и коллективное употребление אָדָם; «среди людей» естественно по-русски и не сужает референт до мужчин.
theological_decisions:
- issue: Субъект первого лица в пророческой речи
  choice: Сохранено «Я» с прописной буквы как речь Бога по контексту
  alternative: «я» со строчной буквы
  rationale: Контекст определяет говорящего как Господа; прописная буква соответствует принятому русскому библейскому оформлению, не добавляя имени, отсутствующего в стихе.
- issue: Оттенок נְתַתִּיךָ — установление положения или уже совершённое уничижение
  choice: «сделал тебя малым»
  alternative: «поставил тебя малым» / «сделаю тебя малым»
  rationale: Перфект сохранён как прошедшее совершённое действие, а возможное напряжение между установленным статусом и результатом не разъясняется сверх текста.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксический параллелизм оригинала сохранён; архаическое «се» не используется.
