base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/034.yaml
  text: 'The word of Yahweh that came to Jeremiah the prophet concerning Elam[a], at the beginning of the reign of Zedekiah king of Judah, saying:'
translation:
  language: ru
  text: 'Слово Яхве, которое пришло к пророку Иеремии об Эламе[a] в начале царствования Седекии, царя Иудеи:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против Элама». Еврейский предлог в пророческом заглавии может означать как «об», так и «против».'
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
  choice: Слово Яхве
  rationale: Сохраняет характерную для пророческих заглавий формулу и передаёт личное имя יהוה транслитерацией «Яхве».
- source_word: הָיָה ... אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: которое было к пророку Иеремии
  rationale: Формулировка близко передаёт еврейскую конструкцию откровения и остаётся понятной в возвышенном современном русском регистре.
- source_word: אֶל עֵילָם
  choice: об Эламе
  rationale: В пророческом заглавии אֶל может обозначать предмет или адресата пророчества; нейтральное «об» не предрешает, направлено ли оно именно против Элама.
- source_word: בְּרֵאשִׁית מַלְכוּת
  choice: в начале царствования
  rationale: Точно обозначает ранний период правления, а не царство как территорию.
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Седекии, царя Иудеи
  rationale: Использованы традиционные русские формы библейских имён и естественная русская аппозиция.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит последующую прямую речь и передаёт функцию инфинитива לאמר без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Направленность пророчества אֶל עֵילָם
  choice: об Эламе
  alternative: против Элама
  rationale: Предлог допускает обе смысловые возможности. В основном тексте сохранена нейтральная формулировка, а более направленное чтение вынесено в примечание.
translation_notes:
  register: Современный литературный русский с достоинством пророческого заглавия. Синтаксис умеренно формальный; двоеточие естественно связывает заголовок со следующим пророчеством.
