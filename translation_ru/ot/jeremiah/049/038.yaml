base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/038.yaml
  text: And I will set my throne in Elam[a], and I will destroy from there king and officials[b], declares Yahweh.
translation:
  language: ru
  text: Я поставлю Свой престол в Эламе[a] и уничтожу оттуда царя и правителей[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утвержу Свой престол в Эламе». Еврейский глагол может означать «поставить», «поместить» или «утвердить».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «князей» или «вельмож». Еврейское слово обозначает высокопоставленных руководителей и представителей знати.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: И поставлю Я
  rationale: Глагол שׂים означает «класть, ставить, помещать»; «поставлю» естественно сочетается с образом престола и не добавляет идеи окончательного утверждения власти, хотя сам образ её подразумевает.
- source_word: כִסְאִי
  choice: Свой престол
  rationale: כִּסֵּא в царском и судебном контексте означает «престол». Возвратное местоимение «Свой» естественно в русском предложении с подлежащим «Я» и точно передаёт принадлежность говорящему.
- source_word: בְּעֵילָם
  choice: в Эламе
  rationale: Предлог בְּ здесь имеет обычное местное значение «в»; перевод «против Элама» внёс бы отсутствующий в форме противительный оттенок.
- source_word: וְהַאֲבַדְתִּי
  choice: и уничтожу
  rationale: Каузативная порода глагола אבד передаёт значение «погубить, уничтожить». Выбор сохраняет силу пророческого суда и остаётся понятным современному читателю.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Наречное сочетание прямо указывает на удаление из названного места.
- source_word: מֶלֶךְ
  choice: царя
  rationale: Существительное стоит без артикля; русский язык также позволяет употребить его без дополнительного уточнения, не решая, имеется ли в виду конкретный правитель или носитель царской власти как таковой.
- source_word: וְשָׂרִים
  choice: и правителей
  rationale: שָׂרִים обозначает высокопоставленных руководителей, начальников или вельмож. «Правители» понятно современному читателю и сохраняет политико-властный смысл.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана торжественно и естественно; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя Бога. Форма «Яхве» непосредственно сохраняет имя и не заменяет его титулом.
- issue: Образ Божьего престола в Эламе
  choice: сохранить конкретный образ «Свой престол» без поясняющей парафразы
  alternative: Свою власть; Свой судейский престол
  rationale: Текст связывает Божье царственное присутствие и суд с образом престола. Буквенный образ сохраняет как смысл власти, так и возможный судебный оттенок, не сводя его к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Инверсия «поставлю Я» подчёркивает Божье действие, не создавая архаической тяжеловесности. Союзы исходного текста сохранены; метафора престола не истолкована внутри перевода.
