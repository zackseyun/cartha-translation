  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל אֱד֔וֹם וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל יֹשְׁבֵ֣י תֵימָ֑ן אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נְוֵ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/020.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Edom[a], and his thoughts that he has devised against the inhabitants of Teman: Surely the little ones of the flock will drag them away[b]; surely he will make their pasture desolate over them.'
translation:
  language: ru
  text: 'Поэтому выслушайте замысел Яхве, который Он составил против Эдома, и Его намерения, которые Он задумал против жителей Темана: воистину, самые малые из стада[a] уволокут их; воистину, Он обратит их пастбище в запустение из-за них[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самые молодые в стаде» либо «самые незначительные из стада». Вероятно, это образ слабейших или наименее значительных нападающих; образ стада сохранён в тексте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их обиталище», «их жилище» либо «их загон». Еврейское слово может обозначать как пастбище, так и место обитания. Заключительная конструкция в еврейском тексте трудна: предлог может быть понят как «из-за них», а также как «над ними» или «вместе с ними».'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт выводное значение частицы и связь с предшествующим пророчеством.
- source_word: שִׁמְעוּ
  choice: выслушайте
  rationale: Форма множественного числа повелительного наклонения; «выслушайте» естественно передаёт призыв внимательно принять последующее слово.
- source_word: עֲצַת יְהוָה
  choice: замысел Яхве
  rationale: «Замысел» в современном русском лучше, чем двусмысленный «совет», передаёт значение решения или плана; личное имя יהוה передано как «Яхве».
- source_word: יָעַץ אֶל אֱדוֹם
  choice: который Он составил против Эдома
  rationale: Глагол обозначает обдумывание или составление замысла, а אֶל в контексте суда имеет направленно-враждебный смысл «против».
- source_word: מַחְשְׁבוֹתָיו אֲשֶׁר חָשַׁב
  choice: Его намерения, которые Он задумал
  rationale: Сохраняет отличие существительного от עֲצָה и намеренную лексическую перекличку существительного с однокоренным глаголом в еврейском.
- source_word: יֹשְׁבֵי תֵימָן
  choice: жителей Темана
  rationale: Прямой и естественный перевод обозначения населения местности.
- source_word: אִם לֹא
  choice: воистину
  rationale: В обеих фразах сочетание имеет силу клятвенного заверения, а не обычного условия.
- source_word: יִסְחָבוּם
  choice: уволокут их
  rationale: Передаёт резкое, зримое значение насильственного волочения или утаскивания.
- source_word: צְעִירֵי הַצֹּאן
  choice: самые малые из стада
  rationale: 'Сохраняет образ стада и смысловую открытость прилагательного: малые могут пониматься как молодые либо как слабейшие и наименее значительные.'
- source_word: יַשִּׁים
  choice: опустошит
  rationale: 'В данном контексте форма понимается как каузатив от שׁמם: «сделает опустошённым», что соответствует параллельной речи о разорении.'
- source_word: נְוֵהֶם
  choice: их пастбище
  rationale: Слово может обозначать пастбище, жилище или загон; «пастбище» поддерживает образ стада, не исключая переносного смысла обитаемой земли.
- source_word: עֲלֵיהֶם
  choice: над ними
  rationale: Формально сохраняет пространственное значение предлога и не подменяет неоднозначную связь явно причинным «из-за них» либо совместным «вместе с ними».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Кто совершает опустошение в заключительной строке
  choice: Он — Яхве как субъект суда
  alternative: Пастбище само приходит в запустение или ужас
  rationale: Контекст описывает осуществляемый Яхве замысел, а форма יַשִּׁים естественно допускает каузативное понимание «Он опустошит». При этом трудная конструкция не расширена богословским толкованием.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Повтор «воистину» воспроизводит двойное клятвенное заверение; метафора стада и необычное «над ними» сохранены, а неоднозначность пояснена в сносках.
