  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤יעָה אֲרִיצֶ֨/נּוּ מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יֹעִידֶ֔/נִּי וּ/מִי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/019.yaml
  text: Look[a], like a lion he will come up from the thicket of the Jordan against a secure pasture; for in an instant I will make him run from it, and I will appoint over it whomever is chosen. For who is like me[b], and who will summon me? And who is the shepherd who can stand before me?
translation:
  language: ru
  text: Вот, словно лев, он поднимется из зарослей у Иордана[a] на безопасное пастбище. Ибо в одно мгновение Я заставлю его бежать оттуда и поставлю над ним избранного. Ибо кто подобен Мне? Кто призовёт Меня[b]? И какой пастух сможет устоять передо Мной?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из величия» или «гордости Иордана»; вероятно, речь идёт о густых зарослях вдоль Иордана.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Кто назначит Мне срок?»; выражение может иметь судебный смысл: «Кто вызовет Меня на суд?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную силу и живую непосредственность вводного возгласа, оставаясь естественным для современного литературного русского языка.
- source_word: כְּאַרְיֵה
  choice: словно лев
  rationale: Прямо передаёт сравнение и звучит естественно и выразительно.
- source_word: יַעֲלֶה
  choice: он поднимется
  rationale: Сохраняет направленность движения, выраженную глаголом עלה, и образ выходящего из иорданских зарослей хищника.
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  choice: из зарослей у Иордана
  rationale: В данном устойчивом образе Иеремии выражение, буквально связанное с «величием/гордостью Иордана», вероятнее всего обозначает пышные прибрежные заросли, служившие убежищем львам. Буквальный вариант сохранён в примечании.
- source_word: נְוֵה אֵיתָן
  choice: на неприступное пастбище
  rationale: נוה сохраняет пастушеский образ пастбища или обиталища, а איתן передаёт прочность и защищённость. «Неприступное» естественно выражает предполагаемую безопасность места, не устраняя иронического напряжения контекста.
- source_word: כִּי אַרְגִּיעָה
  choice: Но в одно мгновение
  rationale: Форма רגע здесь имеет значение внезапности или краткого мгновения. Союз передан как «но», поскольку в контексте он вводит резкий поворот от нападения льва к действию говорящего.
- source_word: אֲרִיצֶנּוּ מֵעָלֶיהָ
  choice: Я заставлю его бежать оттуда
  rationale: 'Сохраняет каузативное значение глагола: говорящий заставляет названного мужским местоимением участника поспешно удалиться. «Оттуда» естественно передаёт מֵעָלֶיהָ без тяжеловесного повтора.'
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  choice: и поставлю над ним избранного
  rationale: Сжатая еврейская конструкция допускает понимание בָחוּר как «избранный», а פקד — как назначение над землёй или народом. Мужское «над ним» соотносится с подразумеваемым Эдомом; неоднозначность избранного лица не конкретизируется.
- source_word: מִי כָמוֹנִי
  choice: кто подобен Мне
  rationale: Формула несравненности передана прямо, без добавленного богословского пояснения.
- source_word: וּמִי יֹעִידֶנִּי
  choice: Кто призовёт Меня к ответу
  rationale: Передаёт возможный судебный оттенок Hiphil יעד — назначить срок, вызвать или предъявить требование явиться. Формулировка естественно выражает риторический вызов, а более нейтральная альтернатива отмечена в сноске.
- source_word: רֹעֶה
  choice: пастух
  rationale: Сохранён буквальный пастушеский образ, который метафорически может обозначать правителя, без замены образом только одного возможного толкования.
- source_word: יַעֲמֹד לְפָנַי
  choice: устоит предо Мной
  rationale: «Устоит» передаёт не простое нахождение перед говорящим, а способность выдержать противостояние, подразумеваемую риторическим вопросом.
theological_decisions:
- issue: Кто говорит от первого лица
  choice: Сохранена прямая речь от первого лица без добавления имени «Господь».
  alternative: Добавить «говорит Господь» или прямо назвать Бога.
  rationale: Контекст определяет речь как божественную, однако в самом стихе имя Бога отсутствует. Перевод не вносит явного субъекта сверх исходного текста.
- issue: Значение образа пастуха
  choice: Сохранено слово «пастух».
  alternative: Передать метафорически как «правитель» или «вождь».
  rationale: Буквальный образ поддерживает пастбищную метафорику стиха и одновременно оставляет открытым его политический смысл.
- issue: Личность «избранного»
  choice: 'Лицо оставлено неопределённым: «избранного».'
  alternative: Отождествить его с конкретным царём, завоевателем или назначенным Богом правителем.
  rationale: Исходный стих не называет этого человека; конкретизация внесла бы внешнее толкование.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Слова «Вот», «словно», «в одно мгновение» обеспечивают живое повествовательное движение; форма «предо Мной» сохраняет достоинство риторического финала без чрезмерной архаизации. Все местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской издательской норме.
