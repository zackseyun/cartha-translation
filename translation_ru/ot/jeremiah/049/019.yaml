    rationale: В данной конструкции כִּי естественнее передаёт основание/объяснение («ибо», «ведь»), а не противопоставление.
  - severity: medium
    issue: «Поставлю над ним» и обоснование с Эдомом
    rationale: Русское «ним» в черновике мотивировано подразумеваемым Эдомом, хотя еврейские суффиксы в этой фразе женского рода и текст не требует такой конкретизации. Следует соотнести местоимение с явно названным «пастбищем» и убрать внешнее отождествление.
  - severity: low
