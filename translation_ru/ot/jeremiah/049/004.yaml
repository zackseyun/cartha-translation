base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/004.yaml
  text: Why do you boast in the valleys[a], your valley flowing away, O faithless daughter, who trusts in her treasures, saying, ‘Who will come against me?’
translation:
  language: ru
  text: 'Почему ты хвалишься долинами,

    своей долиной, из которой течёт вода[a],

    неверная дочь?


    Ты полагаешься на свои сокровища и говоришь:

    «Кто выступит против меня?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно для перевода. Возможны также: «твоя полноводная долина», «твоя переполненная долина», «твоя плодородная долина» или «твоя долина, из которой утекает вода». Вероятно, речь идёт о природном богатстве долины либо о её защищённости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַלְלִי
  choice: хвалишься
  rationale: Возвратное значение породы хитпаэль здесь передаёт самовосхваление; «хвалишься» естественно звучит по-русски и сохраняет обличительный тон.
- source_word: בָּעֲמָקִים
  choice: долинами
  rationale: Сохранён конкретный географический образ множественного числа, а не истолкование долин как укреплений или источника могущества.
- source_word: זָב עִמְקֵךְ
  choice: своей текущей долиной
  rationale: 'Буквально сохранён образ «текущей» долины, хотя сочетание допускает разные толкования: долина может быть орошаемой, переполненной водой, плодородной либо, в контексте суда, утрачиваемой. Неопределённость отмечена в сноске.'
- source_word: הַבַּת הַשּׁוֹבֵבָה
  choice: неверная дочь
  rationale: «Неверная» передаёт мятежность и отступничество שׁוֹבֵבָה без узкоконфессионального оттенка; обращение «дочь» сохраняет олицетворение.
- source_word: הַבֹּטְחָה בְּאֹצְרֹתֶיהָ
  choice: полагаешься на свои сокровища
  rationale: Переход ко второму лицу естественен в русском прямом обращении. «Сокровища» передают накопленное богатство как ложную опору; возможное значение «хранилища» здесь менее вероятно.
- source_word: מִי יָבֹוא אֵלָי
  choice: Кто выступит против меня?
  rationale: Предлог אֶל буквально означает движение к кому-либо, но в данном враждебном контексте выражение имеет смысл нападения или выступления против адресата.
theological_decisions:
- issue: Олицетворение Аммона в женском роде
  choice: Сохранено обращение «неверная дочь» и формы женского рода.
  alternative: 'Передать истолковательно: «неверный народ».'
  rationale: Еврейский текст прямо изображает страну или её столицу как дочь; сохранение метафоры передаёт пророческую риторику и не нейтрализует грамматический род.
- issue: Характер неверности, выраженный словом שׁוֹבֵבָה
  choice: неверная
  alternative: отступница; мятежная; непокорная
  rationale: Выбранное слово сохраняет смысл измены и непокорности, не уточняя сверх текста, идёт ли речь именно о полном вероотступничестве.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обличения. Поэтическое членение сохраняет риторические обращения и вопрос; добавленное «и говоришь» естественно вводит подразумеваемую самоуверенную речь.
