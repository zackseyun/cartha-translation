source:
  edition: WLC
  text: הֵילִ֨ילִי חֶשְׁבּ֜וֹן כִּ֣י שֻׁדְּדָה עַ֗י צְעַקְנָה֮ בְּנ֣וֹת רַבָּה֒ חֲגֹ֣רְנָה שַׂקִּ֔ים סְפֹ֕דְנָה וְ/הִתְשׁוֹטַ֖טְנָה בַּ/גְּדֵר֑וֹת כִּ֤י מַלְכָּ/ם֙ בַּ/גּוֹלָ֣ה יֵלֵ֔ךְ כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יַחְדָּֽיו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/003.yaml
  text: Wail[a], Heshbon, for Ai is devastated! Cry out, daughters of Rabbah! Put on sackcloth, mourn, and wander about among the walls, for their king will go into exile, together with his priests and his officials.
translation:
  language: ru
  text: Рыдай, Хешбон, потому что Ай разорён! Кричите, дочери Раввы! Наденьте одежды из грубой ткани, плачьте и мечитесь среди оград, потому что их царь[a] пойдёт в изгнание вместе со своими священниками и вельможами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Милком пойдёт в изгнание». Еврейское слово можно понять как имя аммонитского бога, а не как «их царь».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵילִילִי
  choice: Рыдай
  rationale: Повелительная форма женского рода единственного числа от ילל обозначает громкий плач в бедствии; «рыдай» естественно и выразительно передаёт обращение к олицетворённому городу.
- source_word: חֶשְׁבּוֹן
  choice: Хешбон
  rationale: Название города передано транслитерацией с еврейского.
- source_word: שֻׁדְּדָה
  choice: разорён
  rationale: Пассивная форма от שׁדד передаёт насильственное опустошение, нередко сопровождаемое грабежом; «разорён» сохраняет широту значения.
- source_word: עַי
  choice: Ай
  rationale: Масоретский текст содержит топоним Ай; возможные исправления текста в основной перевод не внесены.
- source_word: צְעַקְנָה
  choice: Кричите
  rationale: Повелительная форма женского рода множественного числа от צעק означает громко взывать или кричать; в контексте плача «кричите» звучит естественно.
- source_word: בְּנוֹת רַבָּה
  choice: дочери Раввы
  rationale: Буквальный образ может обозначать жительниц или зависимые поселения Раввы. Сохранение выражения «дочери Раввы» не устраняет эту образную многозначность.
- source_word: חֲגֹרְנָה שַׂקִּים
  choice: Наденьте рубища
  rationale: 'Идиоматическая передача обряда скорби: опоясаться грубой тканью. «Рубища» понятно обозначают траурную одежду и сохраняют возвышенный библейский регистр.'
- source_word: סְפֹדְנָה
  choice: плачьте
  rationale: Глагол ספד обозначает траурный плач; «плачьте» ясно передаёт его значение в последовательности призывов к скорби.
- source_word: וְהִתְשׁוֹטַטְנָה
  choice: мечитесь
  rationale: Форма глагола שׁוט описывает беспокойное движение туда и сюда. «Мечитесь» передаёт не просто хождение, а смятение плачущих.
- source_word: בַּגְּדֵרוֹת
  choice: среди оград
  rationale: גדרות может обозначать стены, ограды или огороженные места. «Среди оград» сохраняет конкретный образ, не уточняя неоправданно, что речь именно о городских стенах или загонах.
- source_word: מַלְכָּם
  choice: их царь
  rationale: Масоретская огласовка даёт значение «их царь»; согласный текст допускает также имя аммонитского божества Милком. Альтернатива отмечена в сноске.
- source_word: בַּגּוֹלָה יֵלֵךְ
  choice: пойдёт в изгнание
  rationale: Устойчивое выражение о насильственном переселении; «пойдёт в изгнание» точно и естественно передаёт формулу.
- source_word: כֹּהֲנָיו וְשָׂרָיו
  choice: со своими священниками и вельможами
  rationale: כֹּהֲנָיו — «его священники», а שָׂרָיו — правители, начальники или сановники. «Вельможи» уместно передаёт высокопоставленных должностных лиц в литературном русском.
theological_decisions:
- issue: Относится ли מַלְכָּם к человеческому царю или к аммонитскому божеству Милкому
  choice: их царь
  alternative: Милком
  rationale: Масоретская огласовка поддерживает чтение «их царь», согласующееся с последующими притяжательными формами «его священники и его вельможи». Однако согласный текст допускает имя божества Милком, особенно уместное в пророчестве об Аммоне, поэтому эта существенная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Краткие повеления сохраняют напряжённый ритм оригинала; топонимы переданы в принятых русских библейских формах. Подлинная неоднозначность מַלְכָּם вынесена в сноску.
