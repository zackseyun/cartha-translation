  yaml_path: translation/ot/jeremiah/049/031.yaml
  text: Rise up[a], go up against a nation at ease, dwelling securely, declares Yahweh, that has no doors or bars[b]; they dwell alone.
translation:
  language: ru
  text: «Встаньте, выступите против народа, который живёт безмятежно и в безопасности и у которого нет ни дверей, ни засова, — возвещает Яхве. Они живут обособленно[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нет дверей и нет у него засова»; образ описывает народ, живущий без обычных оборонительных укреплений. «Безмятежно» также может подразумевать беспечность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ עֲל֗וּ אֶל
  choice: Встаньте, выступите против
  rationale: Два повелительных глагола передают военный призыв. «Выступите против» естественно выражает контекстуальное значение עלה אֶל, не усиливая его до прямого «нападите».
- source_word: גּ֥וֹי
  choice: народ
  rationale: В данном пророчестве слово обозначает этническую общность, служащую объектом похода; русское «народ» здесь естественнее, чем современное политико-государственное «нация».
- source_word: שְׁלֵ֛יו יוֹשֵׁ֥ב לָבֶ֖טַח
  choice: живущего спокойно и беззаботно
  rationale: Передаёт сочетание спокойствия и ощущения безопасности. «Беззаботно» сохраняет возможный оттенок беспечности, не делая его однозначно осуждающим.
- source_word: נְאֻם יְהוָ֑ה
  choice: возвещает Яхве
  rationale: Весомая и естественная по-русски пророческая формула; личное имя Яхве передаёт тетраграмматон непосредственно.
- source_word: לֹא דְלָתַ֧יִם וְלֹֽא בְרִ֛יחַ ל֖וֹ
  choice: у которого нет ни ворот, ни засова
  rationale: В контексте поселения דלתים обозначает входные ворота, а единичное בריח — запирающий их засов. Сохранён конкретный образ неукреплённости.
- source_word: בָּדָ֥ד יִשְׁכֹּֽנוּ
  choice: Они живут обособленно
  rationale: «Обособленно» передаёт пространственную отделённость народа точнее, чем потенциально эмоциональное «одни».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и согласуется с предоставленным актуальным богословским решением.
- issue: Оценочный оттенок שְׁלֵו
  choice: спокойно и беззаботно
  alternative: самодовольно
  rationale: Еврейское слово допускает как нейтральное спокойствие, так и беспечную уверенность. Основной текст не закрепляет более резкое нравственное осуждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены военный призыв, конкретный образ ворот и засова и неоднозначность между спокойствием, безопасностью и беспечностью.
