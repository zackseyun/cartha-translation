base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/027.yaml
  text: And I will kindle a fire in the wall of Damascus[a], and it will consume the palaces of Ben-hadad.
translation:
  language: ru
  text: И Я разожгу огонь в стене Дамаска[a], и он пожрёт дворцы Бен-Хадада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против стены Дамаска». Предлог допускает несколько близких пространственных значений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: И Я разожгу
  rationale: Хифиль перфекта 1-го лица единственного числа от יצת с союзом выражает прямое действие говорящего; в пророческой речи перфект передаёт твёрдо предстоящее действие. «Разожгу» естественно и сохраняет каузативный смысл.
- source_word: אֵשׁ
  choice: огонь
  rationale: В русском языке после «разожгу» существительное естественно употребляется без неопределённого артикля.
- source_word: בְּחוֹמַת
  choice: в стене
  rationale: Предлог ב прежде всего допускает пространственное значение «в»; перевод сохраняет образ возгорания в городской стене, не уточняя его сверх исходного текста.
- source_word: דַּמָּשֶׂק
  choice: Дамаска
  rationale: Общепринятая русская форма географического названия в родительном падеже после «стене».
- source_word: וְאָכְלָה
  choice: и он пожрёт
  rationale: Форма 3-го лица женского рода согласована в еврейском с אֵשׁ; русское местоимение «он» согласуется с «огонь». «Пожрёт» сохраняет олицетворённую силу глагола אכל в образе суда огнём.
- source_word: אַרְמְנוֹת
  choice: дворцы
  rationale: אַרְמוֹן обозначает дворец либо укреплённую царскую резиденцию; «дворцы» уместно передаёт строения, связанные с царским домом Бен-Хадада, сохраняя при этом величие названной цели.
- source_word: בֶּן הֲדָד
  choice: Бен-Хадада
  rationale: Устоявшаяся русская передача составного царского имени; родительный падеж обусловлен сочетанием «дворцы Бен-Хадада».
theological_decisions:
- issue: Неявно названный божественный Говорящий и Его действие суда
  choice: Первое лицо передано прямо как «Я» без добавления «говорит Господь»; местоимение написано с прописной буквы как указание на Бога в данном контексте.
  alternative: Не выделять местоимение отдельно («разожгу») либо добавить обозначение Говорящего.
  rationale: Стих продолжает пророческую речь, в которой говорит Яхве. Перевод сохраняет прямоту исходного текста и не добавляет отсутствующих слов.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. «Пожрёт» сохраняет сильную библейскую метафору огня без архаизации синтаксиса.
