base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/029.yaml
  text: They will take their tents and their flocks; they will carry off their tent curtains and all their goods and their camels[a], and they will cry out against them, “Terror on every side!”
translation:
  language: ru
  text: 'Их шатры и стада заберут; полотнища их шатров, всё их имущество и верблюдов унесут с собой. И возгласят против них[a]: «Ужас со всех сторон!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возгласят над ними» либо «провозгласят о них». Еврейское выражение может обозначать возглас, направленный против них, произнесённый над ними или относящийся к ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלֵיהֶם
  choice: их шатры
  rationale: אֹהֶל обозначает шатёр или переносное жилище; в контексте кочевых жителей Кедара и Хацора «шатры» — точный и естественный русский эквивалент.
- source_word: צֹאנָם
  choice: их стада
  rationale: צֹאן — собирательное обозначение мелкого скота, прежде всего овец и коз; «стада» сохраняет широкий пастушеский смысл.
- source_word: יִקָּחוּ
  choice: заберут
  rationale: לקח буквально означает «брать»; «заберут» естественно передаёт действие в контексте военного разграбления, не усиливая его до более узкого «захватят».
- source_word: יְרִיעוֹתֵיהֶם
  choice: полотнища их шатров
  rationale: יְרִיעָה означает полотнище, занавес или часть покрытия шатра; уточнение «шатров» ясно передаёт кочевой контекст.
- source_word: כָּל־כְּלֵיהֶם
  choice: всё их имущество
  rationale: כְּלִי может обозначать сосуд, орудие, предмет или снаряжение; в перечне добычи собирательное «имущество» не сужает значение до одних сосудов.
- source_word: גְּמַלֵּיהֶם
  choice: их верблюдов
  rationale: Прямой эквивалент множественного числа גָּמָל с притяжательным суффиксом.
- source_word: יִשְׂאוּ לָהֶם
  choice: унесут с собой
  rationale: נשא с לָהֶם здесь передаёт унесение добычи в своё распоряжение; «с собой» естественно выражает присвоение, не создавая тяжеловесного «для себя».
- source_word: וְקָרְאוּ עֲלֵיהֶם
  choice: возгласят против них
  rationale: Сочетание קרא על допускает направленный против кого-либо возглас, а также провозглашение над ним или о нём. Основной текст передаёт вероятный в контексте враждебный смысл, а примечание сохраняет неоднозначность предлога.
- source_word: מָגוֹר מִסָּבִיב
  choice: Ужас со всех сторон!
  rationale: Устойчивая для Иеремии формула означает окружающий со всех сторон страх или ужас; выбранный перевод сохраняет её краткость и силу.
