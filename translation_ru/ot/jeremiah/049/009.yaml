base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/009.yaml
  text: If grape gatherers came to you[a], would they not leave gleanings? If thieves came by night, they would destroy only enough for themselves.
translation:
  language: ru
  text: Если бы к тебе пришли сборщики винограда, разве не оставили бы они после себя хоть немного винограда? Если бы ночью пришли воры, они причинили бы ущерб лишь в той мере, какую сочли бы достаточной.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в конце фразы: «их достаток». Это еврейское идиоматическое выражение означает: «сколько им достаточно»; глагол может означать «губить», «разорять» или «уничтожать».'
    reason: Поясняет идиому דַיָּם и сохраняет диапазон значения הִשְׁחִיתוּ, не выдавая смысловое истолкование за дословный перевод.
lexical_decisions:
- source_word: אִם
  choice: если бы
  rationale: В обеих частях вводит условное сравнение; форма «если бы» естественно передаёт по-русски гипотетический и риторический характер высказывания.
- source_word: בֹּצְרִים
  choice: сборщики винограда
  rationale: Слово обозначает именно тех, кто собирает виноград, а не работников жатвы вообще.
- source_word: בָּאוּ לָךְ
  choice: пришли к тебе
  rationale: Сохраняет прямое значение предлога и обращение к Эдому, не добавляя явно значения «напали», которое и так подразумевается контекстом.
- source_word: לֹא יַשְׁאִירוּ עוֹלֵלוֹת
  choice: разве не оставили бы они немного винограда?
  rationale: Риторический вопрос передаёт ожидаемый утвердительный ответ. עוֹלֵלוֹת — оставшиеся после сбора гроздья или ягоды; естественная русская формулировка сохраняет образ, не вводя малопонятного технического термина.
- source_word: גַּנָּבִים בַּלַּיְלָה
  choice: ночью пришли воры
  rationale: Передаёт воров, действующих скрытно ночью, без усиления до насильственных разбойников.
- source_word: הִשְׁחִיתוּ דַיָּם
  choice: они разграбили бы лишь столько, сколько им нужно
  rationale: 'Буквальное сочетание «погубили/разорили — их достаток» в данном сравнении означает ограниченный ущерб: воры берут столько, сколько считают достаточным. «Разграбили» естественно выражает это в контексте кражи, а «лишь столько» выявляет подразумеваемое противопоставление полному опустошению.'
