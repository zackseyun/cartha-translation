source:
  edition: WLC
  text: לְ/קֵדָ֣ר וּֽ/לְ/מַמְלְכ֣וֹת חָצ֗וֹר אֲשֶׁ֤ר הִכָּה֙ נבוכדראצור מֶֽלֶךְ בָּבֶ֔ל כֹּ֖ה אָמַ֣ר יְהוָ֑ה ק֚וּמוּ עֲל֣וּ אֶל קֵדָ֔ר וְ/שָׁדְד֖וּ אֶת בְּנֵי קֶֽדֶם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/028.yaml
  text: 'Concerning Kedar and the kingdoms of Hazor[a], which Nebuchadnezzar king of Babylon struck down: Thus says Yahweh: Rise up, go up against Kedar[b], and plunder the people of the east.'
translation:
  language: ru
  text: 'О Кедаре и царствах Асора, которые разгромил Навуходоносор[a], царь Вавилона.


    Так говорит Яхве:


    «Встаньте, выступите против Кедара

    и разграбьте жителей Востока[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское написание имени здесь ближе к форме «Навуходреццар»; в переводе употреблена традиционная русская форма «Навуходоносор».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынов Востока» — так называли народы восточных пустынных областей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקֵדָר וּלְמַמְלְכוֹת חָצוֹר
  choice: О Кедаре и царствах Асора
  rationale: Предлог לְ в заголовке пророчества вводит его тему; «о» естественно передаёт это значение. Множественное מַמְלְכוֹת сохранено как «царства», а חָצוֹר передано традиционной русской формой «Асор».
- source_word: אֲשֶׁר הִכָּה
  choice: которые разгромил
  rationale: В военном контексте נכה означает нанести поражение, поразить; «разгромил» ясно передаёт совершившееся военное поражение. Относительное предложение отнесено ко всему сочетанию «Кедар и царства Асора».
- source_word: נבוכדראצור
  choice: Навуходоносор
  rationale: Использована укоренившаяся в русском языке форма имени; особенность еврейского написания отмечена в сноске.
- source_word: קוּמוּ עֲלוּ אֶל קֵדָר
  choice: Встаньте, выступите против Кедара
  rationale: Последовательность повелений и военный контекст требуют призыва двинуться против Кедара; «выступите против» звучит естественно и сохраняет наступательный смысл.
- source_word: וְשָׁדְדוּ
  choice: и разграбьте
  rationale: Глагол שׁדד обозначает разграбление и разорение в ходе войны; «разграбьте» точно и понятно передаёт основное значение.
- source_word: בְּנֵי קֶדֶם
  choice: жителей Востока
  rationale: Буквально «сыны Востока» — устойчивое обозначение восточных, прежде всего пустынных, народов. «Жители Востока» передаёт идиоматический смысл современным русским языком, не превращая выражение в буквальное указание на происхождение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, тетраграмматон יהוה. Форма «Яхве» сохраняет различие между именем и титулом, не добавляя конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Параллельные повеления сохранены; архаизмы вроде «восстаньте» и «опустошите» не использованы.
