  text: וְ/אַחֲרֵי כֵ֗ן אָשִׁ֛יב אֶת שְׁב֥וּת בְּנֵֽי עַמּ֖וֹן נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/006.yaml
  text: But afterward I will restore the fortunes of the people of Ammon[a], declares Yahweh.
translation:
  language: ru
  text: Но после этого Я восстановлю благополучие народа Аммона[a], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верну из плена народ Аммона». Еврейский оборот может обозначать как прекращение плена, так и, шире, восстановление благополучия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Но после этого
  rationale: Оборот אַחֲרֵי כֵן обозначает последующее время — «после этого»; союз וְ передан как «но», поскольку здесь после вести о суде следует контрастное обещание восстановления.
- source_word: אָשִׁיב
  choice: Я восстановлю
  rationale: Порода hифиль глагола שׁוב означает «вернуть, восстановить»; в сочетании со שְׁבוּת естественно передаёт действие, обращающее прежнее бедствие вспять.
- source_word: אֶת שְׁבוּת
  choice: благополучие
  rationale: Формула הֵשִׁיב אֶת־שְׁבוּת может обозначать как возвращение из плена, так и более широкое восстановление прежнего благополучия. Основной текст передаёт идиоматический широкий смысл, а более буквальная возможность отмечена в сноске.
- source_word: בְּנֵי עַמּוֹן
  choice: народа Аммона
  rationale: Буквально «сынов Аммона»; современная формулировка «народ Аммона» ясно сохраняет коллективное этническое и национальное значение без ненужной архаизации.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана литературно и торжественно; личное имя יְהוָה транслитерировано как «Яхве».
theological_decisions:
- issue: Обещание восстановления Аммона после суда
  choice: Передать как подлинное обещание будущего восстановления народа Аммона, не уточняя его форму и пределы.
  alternative: Ограничить обещание исключительно политическим восстановлением либо истолковать его только духовно, в отрыве от названного народа.
  rationale: Еврейский текст обещает народу Аммона будущее восстановление, но не определяет его способ, масштаб и характер; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис прост и понятен; местоимение «Я» написано с прописной буквы как относящееся к Богу. Имя Яхве сохранено как личное имя, а не заменено титулом.
