source:
  edition: WLC
  text: וְ/הַחְתַּתִּ֣י אֶת עֵ֠ילָם לִ/פְנֵ֨י אֹיְבֵי/הֶ֜ם וְ/לִ/פְנֵ֣י מְבַקְשֵׁ֣י נַפְשָׁ֗/ם וְ/הֵבֵאתִ֨י עֲלֵי/הֶ֧ם רָעָ֛ה אֶת חֲר֥וֹן אַפִּ֖/י נְאֻם יְהוָ֑ה וְ/שִׁלַּחְתִּ֤י אַֽחֲרֵי/הֶם֙ אֶת הַ/חֶ֔רֶב עַ֥ד כַּלּוֹתִ֖/י אוֹתָֽ/ם־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/037.yaml
  text: I will shatter Elam before their enemies and before those who seek their life[a]. I will bring disaster on them, my burning anger, declares Yahweh[c][b], and I will send the sword after them until I have consumed them.
translation:
  language: ru
  text: Я сокрушу Элам[a] перед его врагами и перед теми, кто ищет его гибели[b]. Я наведу на них бедствие[c] — пылающий гнев Мой, — говорит Яхве, и пошлю вслед за ними меч, пока не истреблю их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «приведу Элам в ужас», «повергну Элам в смятение». Еврейский глагол может указывать как на ужас и растерянность, так и на сокрушительный крах.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «теми, кто ищет их душу (жизнь)» — то есть стремится убить их.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможный перевод: «несчастье» или «кару». Еврейское слово здесь обозначает губительное бедствие, а не нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחְתַּתִּי
  choice: Я сокрушу
  rationale: Хифиль глагола חתת может обозначать приведение в ужас, смятение или состояние сломленности. «Сокрушу» в контексте военного суда передаёт как психологический крах, так и разгром, не сводя смысл только к страху.
- source_word: עֵילָם
  choice: Элам
  rationale: Традиционная русская передача названия древнего народа и страны.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: перед его врагами
  rationale: לִפְנֵי означает «перед, в присутствии». Местоимение согласовано с собирательным названием «Элам», которое в русском тексте выступает в единственном числе.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: теми, кто ищет его гибели
  rationale: Буквально «ищущими их жизнь/душу»; это еврейская идиома о стремящихся убить. Русское «ищет его гибели» естественно выражает подразумеваемый смысл, а буквальный образ отмечен в сноске.
- source_word: וְהֵבֵאתִי עֲלֵיהֶם רָעָה
  choice: Я наведу на них бедствие
  rationale: רָעָה в пророческом контексте означает губительное бедствие или кару, а не нравственное зло. «Наведу» естественно сочетается в русском языке с «бедствием» и передаёт направленное действие суда.
- source_word: אֶת חֲרוֹן אַפִּי
  choice: пылающий гнев Мой
  rationale: Сочетание сохраняет исходную метафору жара гнева; приложение после тире связывает бедствие с Божьим гневом, не устраняя выразительность оригинала.
- source_word: נְאֻם יְהוָה
  choice: говорит Яхве
  rationale: Естественная и торжественная передача устойчивой пророческой формулы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: וְשִׁלַּחְתִּי אַחֲרֵיהֶם אֶת הַחֶרֶב
  choice: и пошлю вслед за ними меч
  rationale: Сохранён яркий образ меча, посланного преследовать бегущих; אַחֲרֵיהֶם передано буквально и естественно как «вслед за ними».
- source_word: עַד כַּלּוֹתִי אוֹתָם
  choice: пока не истреблю их
  rationale: כלה здесь выражает доведение уничтожения до конца. «Истреблю» ясно передаёт итог суда и звучит естественнее, чем буквальное «покончу с ними».
theological_decisions:
- issue: Значение רָעָה применительно к действию Бога
  choice: бедствие
  alternative: зло; несчастье; кара
  rationale: В данном пророческом контексте речь идёт о губительном суде, а не о нравственном зле. «Бедствие» сохраняет судебный смысл и не вносит чуждого утверждения о совершении Богом морального зла.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале стоит тетраграмматон, поэтому личное имя передано транслитерацией, а не заменено титулом.
- issue: Число местоимений при собирательном названии Элам
  choice: «его» в первой фразе, затем «них»
  alternative: последовательное множественное число «их»
  rationale: Древнееврейский текст переходит от названия народа к местоимениям множественного числа. По-русски «его врагами» грамматически соотносится с названием «Элам», а последующее «на них» естественно указывает на эламитян как народ, сохраняя заложенный в оригинале переход от страны/народа к людям.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Сохранены образ преследующего меча, метафора пылающего гнева и напряжённость судебного высказывания. Инверсия «гнев Мой» придаёт речи достоинство, не делая её архаичной.
