base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/007.yaml
  text: 'Concerning Edom: Thus says Yahweh of hosts: Is there no longer wisdom in Teman? Has counsel perished from the prudent? Has their wisdom become corrupted?[a][b]'
translation:
  language: ru
  text: 'Об Эдоме.


    Так говорит Яхве Воинств:


    «Неужели в Фемане больше нет мудрости?


    Исчез ли совет у разумных?[a]


    Неужели их мудрость испортилась?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у сыновей». Еврейская форма допускает такое понимание; по контексту её обычно относят к людям разумным, понимающим.'
    reason: textual_lexical_ambiguity
  - marker: b
    text: 'Или: «Неужели их мудрость пришла в упадок?» Еврейский глагол описывает нечто испортившееся, утратившее добротность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאֱדוֹם
  choice: Об Эдоме
  rationale: Предлог לְ в заголовке пророчества обозначает его предмет; перевод не добавляет более определённого смысла «против».
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная русская передача устойчивой пророческой формулы в настоящем времени.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יְהוָה как «Яхве» и сохраняет буквальный военный и небесный образ слова צְבָאוֹת.
- source_word: הַאֵין עוֹד חָכְמָה
  choice: Неужели ... больше нет мудрости?
  rationale: Сочетание вопросительной частицы с אֵין עוֹד выражает вопрос о том, не перестало ли нечто существовать; «неужели» естественно передаёт риторический оттенок.
- source_word: בְּתֵימָן
  choice: в Фемане
  rationale: Прямая локативная передача названия города или области в Эдоме; используется укоренившаяся русская библейская форма «Феман».
- source_word: אָבְדָה עֵצָה
  choice: не стало совета
  rationale: Передаёт утрату или исчезновение совета естественным современным русским языком, не ослабляя параллелизма.
- source_word: מִבָּנִים
  choice: у разумных
  rationale: Форма восходит к корню בין «понимать, различать» и обозначает понимающих, рассудительных людей, а не биологических сыновей.
- source_word: נִסְרְחָה
  choice: испортилась
  rationale: Глагол выражает порчу, разложение или утрату доброго качества; русское «испортилась» сохраняет метафору и звучит естественно.
- source_word: חָכְמָתָם
  choice: их мудрость
  rationale: Прямая передача существительного с местоименным суффиксом; отсылка к разумным и шире к носителям эдомской мудрости остаётся контекстуально открытой.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя и соответствует указанной проектной установке, не заменяя его титулом.
- issue: Образ צְבָאוֹת
  choice: Воинств
  alternative: Сил
  rationale: «Воинств» сохраняет неоднозначность между небесными и военными силами и не сводит выражение к отвлечённому всемогуществу.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Три параллельных риторических вопроса сохранены. «Разумных» не снабжено отдельной сноской, поскольку это прямое значение формы от בין, а чтение «сыновей» возникло бы лишь из ошибочного отождествления с другим словом.
