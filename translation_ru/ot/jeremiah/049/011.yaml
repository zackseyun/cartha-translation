base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/011.yaml
  text: Leave your fatherless children; I will keep them alive[a]. And let your widows trust in me.
translation:
  language: ru
  text: Оставь своих детей, лишившихся отца[a], — Я сохраню им жизнь; и пусть твои вдовы уповают на Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сирот». Еврейское слово обозначает прежде всего детей, лишившихся отца.'
    reason: Лексическая альтернатива для יְתֹמֶיךָ; сноска перенесена к слову, к которому относится.
lexical_decisions:
- source_word: עָזְבָה
  choice: Оставь
  rationale: Императив Qal, 2-е лицо мужского рода единственного числа. «Оставь» сохраняет прямую форму обращения и допускает контекстуальный смысл «оставь на Моё попечение», не усиливая глагол до «брось» или «покинь».
- source_word: יְתֹמֶיךָ
  choice: своих детей, лишившихся отца
  rationale: יָתוֹם обозначает прежде всего ребёнка, лишившегося отца. Развёрнутая формулировка естественна по-русски и точнее слова «сироты», которое может подразумевать потерю обоих родителей.
- source_word: אֲנִי
  choice: Я
  rationale: 'Самостоятельное местоимение выражает эмфазу: Сам говорящий обещает действовать. Прописная буква отражает отождествление говорящего с Господом в контексте пророчества.'
- source_word: אֲחַיֶּה
  choice: сохраню им жизнь
  rationale: Пиэль от חיה имеет каузативное значение — дать жить, сохранить в живых. «Сохраню им жизнь» передаёт обещание поддержать их жизнь естественным современным русским языком.
- source_word: וְאַלְמְנֹתֶיךָ
  choice: и пусть твои вдовы
  rationale: 'Существительное означает «вдовы», а союз с последующей формой глагола естественно передаётся как продолжение увещевания: «и пусть…».'
- source_word: עָלַי
  choice: на Меня
  rationale: Предлог עַל при בטח указывает на того, на кого полагаются. Русское «уповать на» сохраняет эту конструкцию и звучит естественно в достойном библейском регистре.
- source_word: תִּבְטָחוּ
  choice: уповают
  rationale: Qal imperfect, 3-е лицо женского рода множественного числа, допускает юссивное прочтение «пусть уповают». Глагол «уповать» передаёт доверие и опору, не добавляя чуждых тексту деталей.
theological_decisions:
- issue: Кто говорит и как выражена забота о беззащитных
  choice: Говорящий — Господь, лично обещающий сохранить жизнь детям, лишившимся отца, и призывающий вдов уповать на Него.
  alternative: Передать фразу как неопределённое обещание защиты, не подчёркивая личность говорящего.
  rationale: Контекст пророчества об Эдоме представляет речь Господа, а эмфатическое אֲנִי подчёркивает Его личное действие. Перевод сохраняет напряжение между судом над Эдомом и милостью к уязвимым, не развивая это в более широкое доктринальное утверждение.
- issue: Модальность תִּבְטָחוּ
  choice: Юссивно-побудительное «пусть… уповают».
  alternative: 'Изъявительное обещание: «твои вдовы будут уповать на Меня».'
  rationale: Форма imperfect допускает обе возможности, однако после императива и с союзом естественно воспринимается как увещевание или дозволение. Выбранный вариант соответствует синтаксическому движению стиха, не превращая доверие вдов в безусловное предсказание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Уповать» выбрано как широко понятное и точное сочетание с «на Меня». Пунктуация подчёркивает эмфатическое обещание «Я сохраню им жизнь», не добавляя отсутствующего в еврейском тексте пояснения «на Моё попечение».
