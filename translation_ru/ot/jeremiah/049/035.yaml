id: JER.49.35
reference: Jeremiah 49:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י שֹׁבֵ֖ר אֶת קֶ֣שֶׁת עֵילָ֑ם רֵאשִׁ֖ית גְּבוּרָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/035.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am breaking the bow of Elam, the chief of their might.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Вот, Я сломаю лук Элама — главную опору их могущества[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «главную часть их силы» или «самое сильное у них».'
    reason: Слово רֵאשִׁית может обозначать начало, главную часть или первенствующее; сочетание допускает понимание лука как основной составляющей либо опоры военной мощи Элама.
lexical_decisions:
- source_word: כֹּה
  choice: Так
  rationale: Обычная формула введения пророческого речения; по-русски естественно звучит в сочетании «Так говорит».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет широту традиционного библейского титула «Яхве Воинств», не ограничивая его смысл только земными армиями.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Передаёт призыв обратить внимание, подчёркнутое личное действие Бога и его близость или несомненность.
- source_word: שֹׁבֵר
  choice: сломаю
  rationale: Причастие после הִנְנִי обозначает близкое и несомненное действие; русское будущее время естественно передаёт это в пророческом контексте. «Сломаю» сохраняет основной смысл глагола без лишнего усиления.
- source_word: קֶשֶׁת
  choice: лук
  rationale: Буквально передаёт название оружия, которое в контексте олицетворяет военную силу Элама.
- source_word: עֵילָם
  choice: Элам
  rationale: Принятая русская передача названия страны и народа.
- source_word: רֵאשִׁית גְּבוּרָתָם
  choice: главную опору их могущества
  rationale: Передаёт лук как важнейшую составляющую и основу военной мощи Элама; сноска сохраняет возможные более буквальные оттенки сочетания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Образ лука Элама
  choice: Сохранён буквальный образ лука с поясняющим приложением
  alternative: Передать только обобщённо как военную мощь Элама
  rationale: Буквальный образ существенен для текста и, вероятно, связан с известностью эламских лучников; перевод не устраняет эту метафорическую напряжённость.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Формула «Так говорит Яхве Воинств» сохраняет библейскую возвышенность, а остальная фраза остаётся ясной для обычного читателя.
