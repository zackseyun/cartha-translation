source:
  edition: WLC
  text: הִנְ/נִי֩ מֵבִ֨יא עָלַ֜יִ/ךְ פַּ֗חַד נְאֻם אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת מִ/כָּל סְבִיבָ֑יִ/ךְ וְ/נִדַּחְתֶּם֙ אִ֣ישׁ לְ/פָנָ֔י/ו וְ/אֵ֥ין מְקַבֵּ֖ץ לַ/נֹּדֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/005.yaml
  text: Behold[a], I am bringing terror upon you from all around you, declares the Lord GOD of hosts, and each man will be driven out before him[b], with no one to gather the fugitive.
translation:
  language: ru
  text: Вот, Я наведу на тебя ужас со всех сторон, — возвещает Владыка, Яхве Воинств, — и вы будете рассеяны, каждый — куда глаза глядят[a], и некому будет собрать бегущих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый перед собой». Краткий еврейский оборот, вероятно, описывает паническое бегство, при котором каждый устремляется вперёд сам по себе, не заботясь о других.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «беглеца» или «скитальца». Еврейское слово может обозначать человека, вынужденного бежать или скитаться.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי מֵבִיא
  choice: Вот, Я наведу
  rationale: Конструкция с הִנְנִי и причастием вводит торжественное объявление о близком действии. Будущее «наведу» естественно по-русски передаёт его неизбежность и непосредственную близость.
- source_word: פַּחַד
  choice: ужас
  rationale: В контексте суда слово обозначает не просто страх, а охватывающий людей ужас и панику.
- source_word: נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  choice: возвещает Владыка Яхве Воинств
  rationale: «Возвещает» сохраняет формулу пророческого изречения; «Владыка» передаёт אֲדֹנָי, «Яхве» — личное имя יְהוִה, а «Воинств» — צְבָאוֹת без введения отсутствующего в еврейском тексте слова.
- source_word: מִכָּל סְבִיבַיִךְ
  choice: со всех сторон
  rationale: Естественное русское выражение, сохраняющее образ угрозы, окружающей адресата.
- source_word: וְנִדַּחְתֶּם
  choice: и вы разбежитесь
  rationale: Форма Niphal передаёт вынужденное рассеяние; в сочетании со следующей фразой «разбежитесь» ясно изображает паническое бегство в разные стороны.
- source_word: אִישׁ לְפָנָיו
  choice: каждый прямо перед собой
  rationale: 'Сохранена краткость и распределительное значение оборота: каждый бежит вперёд сам по себе. Подлинная неоднозначность отмечена в сноске.'
- source_word: וְאֵין מְקַבֵּץ לַנֹּדֵד
  choice: и никто не соберёт беглецов
  rationale: Фраза означает, что рассеянных некому будет вновь собрать. Русское множественное число согласуется с описываемой группой, тогда как значение причастия уточнено в сноске.
theological_decisions:
- issue: Передача имени יְהוִה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя, стоящее в исходном тексте, и отличает его от титула אֲדֹנָי «Владыка».
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф / Повелитель Воинств
  rationale: «Воинств» непосредственно передаёт еврейский титул и не добавляет отдельного слова «Повелитель», которого в данном сочетании нет; традиционное «Саваоф» менее понятно современному читателю.
- issue: Распределительное אִישׁ
  choice: каждый
  alternative: каждый мужчина
  rationale: Здесь אִישׁ действует как распределительное местоименное выражение в обращении к целому народу. «Каждый» сохраняет индивидуализирующий смысл, не вводя необоснованного ограничения только мужчинами.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан ясным и естественным, но образ окружающего ужаса, резкое рассеяние и неоднозначность краткого выражения אִישׁ לְפָנָיו сохранены.
