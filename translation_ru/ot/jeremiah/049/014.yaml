base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/014.yaml
  text: 'I have heard a report from Yahweh[a], and a messenger has been sent among the nations: “Gather yourselves, and come against her[b], and rise up for battle.”'
translation:
  language: ru
  text: 'Я услышал весть от Яхве, и среди народов послан посланник[a]: «Соберитесь, выступите против неё[b] и поднимитесь на войну!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гонец» или «посол».'
    reason: lexical_alternative
  - marker: b
    text: Местоимение «неё» относится к Эдому, который в окружающем контексте олицетворён в женском образе.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁמוּעָה
  choice: весть
  rationale: Существительное обозначает услышанное известие или сообщение; «весть» естественно и уместно в контексте пророческого объявления.
- source_word: שָׁמַעְתִּי
  choice: я услышал
  rationale: Перфект передан завершённым прошедшим временем, естественным для современного русского языка и сохраняющим личное свидетельство пророка.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: מֵאֵת указывает на источник вести, а тетраграмматон передан как личное имя «Яхве».
- source_word: צִיר
  choice: посланник
  rationale: Слово может обозначать посланника, гонца или уполномоченного представителя; «посланник» сохраняет широту значения и хорошо соответствует военному призыву.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Предлог ב передан пространственным выражением «среди», а גּוֹיִם означает окружающие народы без позднейшего богословского оттенка слова «язычники».
- source_word: שָׁלוּחַ
  choice: послан
  rationale: Страдательное причастие описывает посланника как уже отправленного; краткая форма естественна по-русски и сохраняет пассивную конструкцию.
- source_word: הִתְקַבְּצוּ
  choice: соберитесь
  rationale: Возвратный императив множественного числа передан прямым призывом к совместному сбору.
- source_word: וּבֹאוּ עָלֶיהָ
  choice: выступите против неё
  rationale: В военном контексте בוא על выражает враждебное движение против цели; «выступите против» ясно передаёт этот смысл.
- source_word: וְקוּמוּ לַמִּלְחָמָה
  choice: и поднимитесь на битву
  rationale: Перевод сохраняет конкретный глагол קום и боевой характер מִלְחָמָה, не заменяя призыв более толковательным «приготовьтесь».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Женский род местоимения עָלֶיהָ
  choice: против неё
  alternative: против Эдома
  rationale: Сохранён женский род исходного местоимения и олицетворение страны; отсылка к Эдому пояснена в сноске, а не внесена непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся прямым и энергичным; военные повеления переданы без архаизмов, а смысловые неоднозначности слов צִיר и женского местоимения сохранены с пояснениями в сносках.
