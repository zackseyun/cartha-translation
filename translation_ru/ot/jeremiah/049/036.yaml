id: JER.49.36
reference: Jeremiah 49:36
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י אֶל עֵילָ֜ם אַרְבַּ֣ע רוּח֗וֹת מֵֽ/אַרְבַּע֙ קְצ֣וֹת הַ/שָּׁמַ֔יִם וְ/זֵ֣רִתִ֔י/ם לְ/כֹ֖ל הָ/רֻח֣וֹת הָ/אֵ֑לֶּה וְ/לֹֽא יִהְיֶ֣ה הַ/גּ֔וֹי אֲשֶׁ֛ר לֹֽא יָב֥וֹא שָׁ֖ם נִדְּחֵ֥י עולם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/036.yaml
  text: I will bring against Elam the four winds from the four ends of the heavens[a], and I will scatter them to all these winds[b]. There will be no nation to which the outcasts of Elam will not go.
translation:
  language: ru
  text: Я наведу на Элам четыре ветра от четырёх краёв небес[a] и развею эламитов по всем этим ветрам. Не будет народа, к которому не придут изгнанники Элама[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от четырёх концов неба».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рассеянные жители Элама»; также возможно: «изгнанные из Элама».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי אֶל עֵילָם
  choice: Я наведу на Элам
  rationale: В породе хифиль глагол בוא с אֶל означает «привести к/на»; в контексте суда естественное русское «наведу на» ясно передаёт направленное против Элама действие.
- source_word: אַרְבַּע רוּחוֹת
  choice: четыре ветра
  rationale: רוּחוֹת здесь обозначает ветры, связанные со сторонами света; контекст не поддерживает значение «духи».
- source_word: מֵאַרְבַּע קְצוֹת הַשָּׁמַיִם
  choice: от четырёх краёв небес
  rationale: קְצוֹת буквально обозначает края или пределы. Формулировка сохраняет образ еврейского текста и звучит по-русски естественно.
- source_word: וְזֵרִתִים
  choice: и развею эламитов
  rationale: זרה обозначает рассеивание, в том числе образ веяния. «Развею» сохраняет связь с ветрами; местоименный суффикс передан как «эламитов», чтобы в русском ясно обозначить объект.
- source_word: לְכֹל הָרֻחוֹת הָאֵלֶּה
  choice: по всем этим ветрам
  rationale: Сохранён повтор слова «ветры» и образ рассеяния по всем направлениям, без замены метафоры толкованием «стороны света».
- source_word: נִדְּחֵי עֵילָם
  choice: изгнанники Элама
  rationale: נִדְּחֵי обозначает людей, отогнанных, изгнанных или рассеянных. «Изгнанники» естественно передаёт насильственный характер их удаления.
