source:
  edition: WLC
  text: נֻ֤סוּ הָפְנוּ֙ הֶעְמִ֣יקוּ לָ/שֶׁ֔בֶת יֹשְׁבֵ֖י דְּדָ֑ן כִּ֣י אֵ֥יד עֵשָׂ֛ו הֵבֵ֥אתִי עָלָ֖י/ו עֵ֥ת פְּקַדְתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/008.yaml
  text: Flee[a], turn back, dwell deep, inhabitants of Dedan, for I have brought Esau’s calamity upon him[c][b], the time when I punish him.
translation:
  language: ru
  text: Бегите, поверните назад, укройтесь в глубине[a], жители Дедана! Ведь Я навёл на Исава бедствие[b], когда Я накажу его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «углубитесь, чтобы обитать»; то есть уйдите в далёкое или труднодоступное место.'
    reason: lexical_alternative
  - marker: b
    text: «Исав» здесь обозначает Эдом — народ, происходивший от Исава.
    reason: cultural_note
  - marker: c
    text: 'Или: «во время Моего посещения его», то есть посещения судом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻסוּ
  choice: Бегите
  rationale: Форма повелительного наклонения множественного числа от נוס прямо призывает спасаться бегством; «бегите» естественно и уместно в пророчестве о суде.
- source_word: הָפְנוּ
  choice: поверните назад
  rationale: Повелительная форма от פנה в сочетании с призывом бежать означает удаление от опасности, то есть отступление назад.
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  choice: укройтесь в глубине
  rationale: Буквальный образ — «углубитесь, чтобы обитать»; в контексте это призыв уйти в далёкое или труднодоступное место. Выбранная формулировка сохраняет образ глубины и ясно передаёт защитное укрытие.
- source_word: יֹשְׁבֵי דְּדָן
  choice: жители Дедана
  rationale: Естественная и точная передача формы сопряжённого сочетания «жители Дедана».
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предшествующих повелений; «ведь» естественно связывает предупреждение с причиной.
- source_word: אֵיד עֵשָׂו
  choice: бедствие Исава
  rationale: אֵיד обозначает гибельное бедствие. Имя «Исав» сохранено, поскольку именно оно стоит в еврейском тексте, хотя обозначает здесь связанный с ним Эдом.
- source_word: הֵבֵאתִי עָלָיו
  choice: Я навёл на Исава
  rationale: Перфект в пророческой речи представляет объявленный суд как несомненный. Русское прошедшее время «навёл» сохраняет эту завершённую и категоричную подачу; местоимение раскрыто именем ради ясности.
- source_word: עֵת פְּקַדְתִּיו
  choice: настало время взыскать с него
  rationale: פקד в контексте суда означает карательное посещение, привлечение к ответу. «Взыскать с него» сохраняет судебный оттенок, не сводя смысл лишь к общему «наказать».
theological_decisions:
- issue: Значение פקד в пророчестве о суде
  choice: взыскать с него
  alternative: наказать его; посетить его судом
  rationale: Контекст ясно указывает на Божий суд. «Взыскать» передаёт ответственность и наказание, не добавляя конфессионально обусловленного толкования.
- issue: Референт имени «Исав»
  choice: сохранить «Исав» в основном тексте
  alternative: заменить на «Эдом»
  rationale: Еврейский текст прямо называет Исава; метонимическое обозначение Эдома разъясняется в примечании, а не подменяется в переводе.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Краткие повеления сохранены; необычный еврейский образ глубины передан понятно, но без полного устранения метафоры. Заглавная «Я» отражает речь Бога, очевидную из контекста раздела.
