  terminology: «Бедствие» точно передаёт אֵיד; «Исав» следует сохранить в тексте, а его метонимическое употребление для Эдома объяснить в примечании. Для פקד в данном контексте предпочтительно «накажу», с альтернативой «посещу его судом» в примечании.
