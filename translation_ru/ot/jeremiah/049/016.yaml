  text: תִּֽפְלַצְתְּ/ךָ֞ הִשִּׁ֤יא אֹתָ/ךְ֙ זְד֣וֹן לִבֶּ֔/ךָ שֹֽׁכְנִי֙ בְּ/חַגְוֵ֣י הַ/סֶּ֔לַע תֹּפְשִׂ֖י מְר֣וֹם גִּבְעָ֑ה כִּֽי תַגְבִּ֤יהַ כַּ/נֶּ֨שֶׁר֙ קִנֶּ֔/ךָ מִ/שָּׁ֥ם אֽוֹרִידְ/ךָ֖ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/016.yaml
  text: The terror you inspire has deceived you[a], the arrogance of your heart— you who dwell in the clefts of the rock, who occupy the height of the hill. Though you make your nest as high as the eagle, from there I will bring you down[c][b], declares Yahweh.
translation:
  language: ru
  text: Твоя грозная слава — надменность твоего сердца — обманула тебя, тебя, живущего в расселинах скалы[c], занимающего вершину холма. Даже если ты устроишь своё гнездо высоко, подобно орлу, Я низвергну тебя оттуда, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: Расселины скалы напоминают о казавшихся неприступными горных укреплениях Эдома.
    reason: cultural_note
lexical_decisions:
- source_word: תִּפְלַצְתְּךָ
  choice: ужас, который ты внушаешь
  rationale: Слово может обозначать ужас или внушающее ужас свойство. В контексте неприступности Эдома эта формулировка естественно передаёт его устрашающую славу, не скрывая иной возможный смысл в примечании.
- source_word: הִשִּׁיא אֹתָךְ
  choice: обманули тебя
  rationale: Hiphil глагола נשׁא здесь означает «обмануть, ввести в заблуждение». Множественное число в русском согласует сказуемое с двумя однородными основаниями самообмана, выраженными в еврейском бессоюзно.
- source_word: זְדוֹן לִבֶּךָ
  choice: надменность твоего сердца
  rationale: זָדוֹן передаёт гордую самоуверенность, дерзость и высокомерие; образ сердца сохранён как средоточие внутренних установок человека.
- source_word: שֹׁכְנִי בְּחַגְוֵי הַסֶּלַע
  choice: тебя, живущего в расселинах скалы
  rationale: Причастная конструкция обращена к Эдому и описывает его жилище среди труднодоступных скал. Повтор «тебя» делает приложение ясным по-русски.
- source_word: תֹּפְשִׂי מְרוֹם גִּבְעָה
  choice: занимающего вершину холма
  rationale: תפשׂ буквально связано с захватом или удержанием, но в данном описании места естественно означает занятие высокой укреплённой позиции.
- source_word: כִּי תַגְבִּיהַ כַּנֶּשֶׁר קִנֶּךָ
  choice: Даже если ты, подобно орлу, устроишь своё гнездо высоко
  rationale: כִּי имеет уступительное значение, а Hiphil גבה выражает поднятие или устройство на высоте. Русская формулировка сохраняет образ орлиного гнезда и условно-уступительное напряжение.
- source_word: מִשָּׁם אוֹרִידְךָ
  choice: Я низвергну тебя оттуда
  rationale: Hiphil ירד означает заставить спуститься, низвести. «Низвергну» естественно передаёт принудительное свержение с высоты и контраст с самовозвышением.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана современно и торжественно; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя Бога; транслитерация сохраняет это различие.
- issue: Смысл образов недоступной высоты
  choice: Историко-пророческий образ самоуверенности Эдома, основанной на его горных укреплениях
  alternative: Чисто психологическое или отвлечённо-эсхатологическое толкование
  rationale: Расселины скалы, вершина холма и орлиное гнездо непосредственно изображают географическую защищённость Эдома; перевод сохраняет этот образ, не добавляя выводов сверх текста.
- issue: Связь תִּפְלַצְתְּךָ и זְדוֹן לִבֶּךָ
  choice: Два бессоюзно поставленных основания самообмана, соединённые по-русски союзом «и»
  alternative: Понимать «надменность твоего сердца» как приложение, поясняющее «ужас»
  rationale: Еврейская синтаксическая сжатость допускает напряжение между перечислением и пояснением. Основной текст выбирает наиболее ясное русское перечисление, не превращая один образ в другой.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены обращения, горная образность, контраст высоты и низвержения, а также личное имя Яхве.
