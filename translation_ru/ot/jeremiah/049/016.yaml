revisions:
- from: Ужас, который ты внушаешь[a], и надменность твоего сердца[b] обманули тебя — тебя, живущего в расселинах скалы[c], занимающего вершину холма. Даже если ты, подобно орлу, устроишь своё гнездо высоко, Я низвергну тебя оттуда, — возвещает Яхве.
  to: Твоя грозная слава — надменность твоего сердца — обманула тебя, тебя, живущего в расселинах скалы[c], занимающего вершину холма. Даже если ты устроишь своё гнездо высоко, подобно орлу, Я низвергну тебя оттуда, — возвещает Яхве.
  rationale: «Грозная слава» выражает выбранное значение «ужас, который ты внушаешь» более компактно и естественно в составе приложения. Тире оформляют «надменность твоего сердца» как пояснительное приложение, соответствующее единственному числу еврейского глагола; примечания a и b сохраняют лексические альтернативы. Порядок образов и пророческая формула сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:15:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основная проблема — синтаксическая: еврейский глагол הִשִּׁיא стоит в единственном числе. В черновике два существительных («ужас ... и надменность») сделаны двумя подлежащими и потому дано «обманули». Это сглаживает сжатую, вероятно пояснительно-приложную конструкцию оригинала. Исправление сохраняет единственное число и не устраняет намеренную синтаксическую напряжённость текста.'
  naturalness: После исправления текст остаётся современным литературным русским с уместно торжественным пророческим регистром. «Устроишь своё гнездо высоко, подобно орлу» и «Я низвергну тебя оттуда» естественны и передают образ высоты и последующего низвержения.
  terminology: «Яхве» корректно передаёт יהוה согласно заданному решению. «Надменность твоего сердца», «расселины скалы» и «вершина холма» точны по смыслу и регистру. Для תִּפְלַצְתְּךָ выбрана «грозная слава», то есть внушаемый Эдомом ужас/грозная репутация; альтернативы сохранены в примечании.
  issues:
  - severity: medium
    issue: Множественное число «обманули тебя»
    rationale: В оригинале הִשִּׁיא — форма единственного числа. Перевод как двух однородных подлежащих («ужас ... и надменность») является возможной смысловой развёрткой, но меняет синтаксическую форму и ослабляет вероятную приложную связь с «надменностью твоего сердца».
  revised_text: Твоя грозная слава — надменность твоего сердца — обманула тебя, тебя, живущего в расселинах скалы[c], занимающего вершину холма. Даже если ты устроишь своё гнездо высоко, подобно орлу, Я низвергну тебя оттуда, — возвещает Яхве.
