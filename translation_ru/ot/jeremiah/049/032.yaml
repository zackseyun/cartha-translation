  text: וְ/הָי֨וּ גְמַלֵּי/הֶ֜ם לָ/בַ֗ז וַ/הֲמ֤וֹן מִקְנֵי/הֶם֙ לְ/שָׁלָ֔ל וְ/זֵרִתִ֥י/ם לְ/כָל ר֖וּחַ קְצוּצֵ֣י פֵאָ֑ה וּ/מִ/כָּל עֲבָרָ֛י/ו אָבִ֥יא אֶת אֵידָ֖/ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/032.yaml
  text: Their camels will become plunder[a], and their many livestock spoil. I will scatter to every wind those who cut the corners of their hair, and from all sides of them I will bring their disaster[b], declares Yahweh.
translation:
  language: ru
  text: Их верблюды станут добычей, а весь их многочисленный скот — трофеями. Я развею по всем ветрам остриженных по краю[a] и со всех сторон наведу на них бедствие[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто подстригает края волос». Еврейское выражение буквально означает «остриженные по краю» и, вероятно, относится к отличительному обычаю стрижки; точное место и форма стрижки неясны.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отовсюду обрушу на них бедствие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְמַלֵּיהֶם
  choice: их верблюды
  rationale: Существительное прямо обозначает верблюдов; это естественный и достаточно точный русский эквивалент.
- source_word: לָבַז
  choice: станут добычей
  rationale: Оборот означает, что неприятель захватит их как добычу.
- source_word: הֲמוֹן מִקְנֵיהֶם
  choice: множество их скота
  rationale: הֲמוֹן передаёт многочисленность или изобилие, а מִקְנֶה в данном контексте обозначает домашний скот.
- source_word: לְשָׁלָל
  choice: военной добычей
  rationale: Уточнение «военной» естественно передаёт значение שָׁלָל и сохраняет некоторое различие с близким по смыслу בַז.
- source_word: וְזֵרִתִים
  choice: Я развею
  rationale: Глагол описывает рассеяние; «развею» сохраняет образ ветров из следующего оборота.
- source_word: לְכָל רוּחַ
  choice: по всем ветрам
  rationale: Сохранён понятный по-русски буквальный образ рассеяния во все стороны.
- source_word: קְצוּצֵי פֵאָה
  choice: тех, кто подстригает волосы на висках
  rationale: Выражение указывает на характерный обычай подрезать волосы по краям головы; «на висках» ясно передаёт вероятную локализацию, не связывая выражение с бородой.
- source_word: מִכָּל עֲבָרָיו
  choice: со всех сторон
  rationale: Оборот указывает, что бедствие придёт отовсюду; буквальное воспроизведение местоименного суффикса по-русски было бы неестественным.
- source_word: אָבִיא אֶת אֵידָם
  choice: наведу на них бедствие
  rationale: אֵיד — тяжёлое бедствие в контексте суда; конструкция «наведу на них» естественно передаёт каузативный смысл אָבִיא и объект с суффиксом.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохранены торжественность пророческой формулы и личное имя Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; форма «Яхве» непосредственно передаёт личное имя и согласуется с предоставленным слоем консультации.
- issue: Идентификация קְצוּצֵי פֵאָה
  choice: те, кто подстригает волосы на висках
  alternative: остриженные по краям; подрезающие края бороды
  rationale: Контекст обозначает народ через отличительный обычай стрижки, но точная практика не вполне определённа; основной текст даёт вероятный смысл, а примечание сохраняет неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Параллелизм двух видов добычи сохранён, но близкие еврейские слова различены как «добыча» и «военная добыча». Образ рассеяния по ветрам передан непосредственно.
