source:
  edition: WLC
  text: נֻסוּ֩ נֻּ֨דוּ מְאֹ֜ד הֶעְמִ֧יקוּ לָ/שֶׁ֛בֶת יֹשְׁבֵ֥י חָצ֖וֹר נְאֻם יְהוָ֑ה כִּֽי יָעַ֨ץ עֲלֵי/כֶ֜ם נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עֵצָ֔ה וְ/חָשַׁ֥ב עלי/הם מַחֲשָׁבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/030.yaml
  text: Flee! Wander far away! Dwell deep[a], inhabitants of Hazor, declares Yahweh[b], for Nebuchadnezzar king of Babylon has taken counsel against you and devised a plan against you.
translation:
  language: ru
  text: Бегите! Уходите как можно дальше! Заберитесь в глубину, чтобы там поселиться[a], жители Хацора, — возвещает Яхве, — потому что Навуходоносор, царь Вавилона, составил против вас замысел и замыслил против них замысел[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «углубитесь, чтобы жить/поселиться»; имеется в виду удалиться в глухие или скрытые места.'
    reason: cultural_note
  - marker: b
    text: В еврейском тексте здесь происходит переход от «против вас» к «против них».
    reason: textual_variant
lexical_decisions:
- source_word: נֻסוּ
  choice: Бегите!
  rationale: Повелительная форма множественного числа от נוס прямо призывает спасаться бегством; краткая форма передаёт неотложность предупреждения.
- source_word: נֻּדוּ מְאֹד
  choice: Уходите как можно дальше!
  rationale: נוד обозначает удаление или странствие, а מְאֹד усиливает степень; по-русски сочетание естественно выражает требование значительно удалиться, не повторяя дословно предыдущее «бегите».
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  choice: Поселитесь в глубине
  rationale: Буквально выражение призывает «углубить пребывание», то есть укрыться и обосноваться в далёких, труднодоступных местах. Метафора сохранена, а её смысл пояснён в сноске.
- source_word: יֹשְׁבֵי חָצוֹר
  choice: жители Хацора
  rationale: Причастие в сопряжённой конструкции естественно передаётся как «жители»; название חָצוֹר транслитерировано как «Хацор».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана глаголом «возвещает», а личное имя יהוה — формой «Яхве».
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходреццар
  rationale: Передана именно форма имени, засвидетельствованная в данном еврейском стихе, без замены на более привычную гречески опосредованную форму «Навуходоносор».
- source_word: יָעַץ ... עֵצָה
  choice: составил ... замысел
  rationale: Родственная глагольно-именная конструкция подчёркивает обдуманность решения; русский оборот сохраняет значение намеренного планирования без неестественного повтора.
- source_word: וְחָשַׁב ... מַחֲשָׁבָה
  choice: задумал ... злое
  rationale: Вторая родственная глагольно-именная конструкция означает разработку враждебного намерения. «Злое» естественно передаёт подразумеваемый объект замысла, избегая тяжёлого повтора слова «замысел».
- source_word: עֲלֵיכֶם ... עליהם
  choice: против вас ... против них
  rationale: Сохранён переход масоретского текста от второго лица множественного числа к третьему, несмотря на возникающую стилистическую шероховатость.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Смена лица в конце стиха
  choice: Сохранить «против вас ... против них»
  alternative: Согласовать оба выражения как «против вас»
  rationale: Масоретский текст действительно переходит от прямого обращения к упоминанию адресатов в третьем лице. Эта неоднозначность сохранена, а не устранена редакторским согласованием.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Краткие повеления сохраняют срочность исходного текста; буквальная пространственная метафора оставлена в основном тексте и пояснена сноской. Необычная смена лица намеренно не сглажена.
