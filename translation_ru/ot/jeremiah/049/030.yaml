  - severity: low
    issue: Неудачная передача הֶעְמִיקוּ לָשֶׁבֶת
    rationale: «Поселитесь в глубине» не вполне естественно и недостаточно явно выражает движение в укрытое, удалённое место с целью поселиться там.
  - severity: low
    issue: Форма имени менее употребительна в современном русском
    rationale: «Навуходоносор» является общепринятой русской библейской формой имени в данном контексте; замена не затрагивает смысл или текстологическую вариативность.
