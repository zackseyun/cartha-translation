  source_fidelity: 'Смысл повелений, имя Яхве и переход от «вас» к «ним» переданы верно. Однако «задумал против них злое» добавляет к еврейскому тексту оценочное содержание («злое»), которого в данной формулировке нет: исходник говорит о замысле/плане.'
  naturalness: «Поселитесь в глубине» понятно, но по-русски звучит несколько неестественно как срочное повеление об укрытии. «Заберитесь в глубину, чтобы там поселиться» яснее передаёт пространственную метафору и инфинитив цели.
  terminology: «Яхве» соответствует принятому решению о передаче тетраграмматона. «Навуходоносор» — обычная современная русская библейская форма имени; она не меняет референта. Сноска о смене лица необходима и должна оставаться привязанной к «них».
