base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/033.yaml
  text: Hazor will become a haunt of jackals[a], a desolation forever; no man will dwell there[b], and no son of man will sojourn in it.
translation:
  language: ru
  text: И станет Хацор обиталищем шакалов[a], запустением навеки; никто не будет жить там, и ни один человек не поселится в нём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жилищем шакалов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «там не будет жить мужчина, и не будет пребывать в нём сын человеческий»; то есть там не будет жить ни один человек.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: и станет
  rationale: В пророческом контексте форма выражает будущий результат и переход в новое состояние.
- source_word: חָצוֹר
  choice: Хацор
  rationale: Название места передано транслитерацией, отражающей еврейскую форму.
- source_word: לִמְעוֹן
  choice: обиталищем
  rationale: מָעוֹן означает место обитания; слово естественно сочетается с образом диких животных среди развалин.
- source_word: תַּנִּים
  choice: шакалов
  rationale: В пророческих картинах запустения термин обычно обозначает шакалов, а не мифических драконов.
- source_word: שְׁמָמָה עַד עוֹלָם
  choice: вечной пустыней
  rationale: Передаёт состояние полного запустения и длительность עַד עוֹלָם естественным современным русским выражением.
- source_word: לֹא יֵשֵׁב שָׁם אִישׁ
  choice: никто не будет жить там
  rationale: יָשַׁב здесь означает постоянное проживание; русское «никто» естественно передаёт родовое употребление אִישׁ.
- source_word: וְלֹא יָגוּר בָּהּ בֶּן אָדָם
  choice: и ни один человек не поселится в нём
  rationale: גוּר отличается от יָשַׁב и может обозначать проживание пришельца или временное поселение; «поселится» сохраняет различие без архаизма. בֶּן אָדָם здесь идиоматически означает человека.
theological_decisions:
- issue: Родовое обозначение человека в אִישׁ и בֶּן אָדָם
  choice: «никто ... ни один человек»
  alternative: «ни один муж ... ни один сын человеческий»
  rationale: Обе еврейские формы в данном параллелизме обозначают любого человека, а не только мужчин и не титул «Сын Человеческий». Идиоматический русский перевод сохраняет смысл и параллельную усилительную конструкцию.
- issue: Степень окончательности עַד עוֹלָם
  choice: «вечной»
  alternative: «навеки» или «на неопределённо долгое время»
  rationale: В формуле пророческого суда выражение подчёркивает непрекращающееся запустение; «вечной» сохраняет силу текста, не добавляя пояснительного ограничения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллельные глаголы יֵשֵׁב и יָגוּר различены как «будет жить» и «поселится». Местоимение «в нём» согласовано с названием города Хацор.
