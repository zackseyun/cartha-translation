source:
  edition: WLC
  text: כִּֽי אֲנִ֞י חָשַׂ֣פְתִּי אֶת עֵשָׂ֗ו גִּלֵּ֨יתִי֙ אֶת מִסְתָּרָ֔י/ו וְ/נֶחְבָּ֖ה לֹ֣א יוּכָ֑ל שֻׁדַּ֥ד זַרְע֛/וֹ וְ/אֶחָ֥י/ו וּ/שְׁכֵנָ֖י/ו וְ/אֵינֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/010.yaml
  text: For I have stripped Esau bare[a]; I have uncovered his hiding places, and he will not be able to hide himself. His offspring, his brothers, and his neighbors are destroyed[b], and he is no more.
translation:
  language: ru
  text: Ведь Я обнажил Исава[a], открыл его тайные убежища, и он не сможет укрыться. Его потомки, братья и соседи разорены[b], и его больше нет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Исав» здесь обозначает произошедший от Исава народ — Едом.
    reason: cross_reference
  - marker: b
    text: 'Или: «разграблены»; также возможно: «опустошены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предшествующего приговора; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: חָשַׂפְתִּי
  choice: Я обнажил
  rationale: Глагол описывает снятие покрова и полное выставление напоказ; «обнажил» сохраняет конкретный образ и звучит естественно по-русски.
- source_word: עֵשָׂו
  choice: Исава
  rationale: Сохранено прямо названное в еврейском тексте имя; в данном пророчестве оно метонимически обозначает Едом.
- source_word: גִּלֵּיתִי אֶת־מִסְתָּרָיו
  choice: открыл его тайные убежища
  rationale: Сочетание обозначает обнаружение мест, служивших для укрытия, а не раскрытие отвлечённых тайн.
- source_word: וְנֶחְבָּה לֹא יוּכָל
  choice: и он не сможет укрыться
  rationale: Личная конструкция сохраняет мужской единственный субъект, относящийся к Исаву/Едому, и точно передаёт невозможность скрыться.
- source_word: שֻׁדַּד
  choice: разорены
  rationale: Глагол может означать разграбление, опустошение или разорение. «Разорены» сохраняет насильственный характер бедствия, не сужая значение только до грабежа и не усиливая его до буквального полного уничтожения.
- source_word: זַרְעוֹ
  choice: его потомки
  rationale: Собирательное «семя» в контексте означает потомство; «потомки» — современная и ясная русская передача.
- source_word: אֶחָיו וּשְׁכֵנָיו
  choice: братья и соседи
  rationale: Сохранены конкретные родственные и пространственные обозначения исходного текста без истолкования их как союзных народов.
- source_word: וְאֵינֶנּוּ
  choice: и его больше нет
  rationale: Устойчивая русская формула передаёт исчезновение и торжественную окончательность еврейского оборота.
theological_decisions:
- issue: Кого обозначает имя «Исав» в пророчестве против Едома
  choice: Сохранить имя «Исав», пояснив его национальный референт в сноске.
  alternative: Перевести истолковательно как «Едом».
  rationale: В исходном тексте прямо стоит имя Исав. Его употребление в значении народа Едома важно сохранить, не подменяя текст толкованием.
- issue: Объём действия глагола שֻׁדַּד в заключительной части стиха
  choice: 'Передать его как общий сказуемый при потомках, братьях и соседях: «разорены».'
  alternative: Связать форму непосредственно лишь с собирательным «потомство», а остальные члены оставить эллиптическими.
  rationale: Еврейская форма стоит в единственном числе и непосредственно следует перед «потомством», однако ряд однородных зависимых групп допускает общее смысловое распространение приговора. Русская множественная форма ясно и естественно передаёт этот ряд, не устраняя лексической неоднозначности самого действия, отмеченной в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Конкретные образы обнажения, убежищ и разорения сохранены; архаизмы и конфессионально окрашенная лексика не используются.
