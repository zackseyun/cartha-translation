  text: לִ/בְנֵ֣י עַמּ֗וֹן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/בָנִ֥ים אֵין֙ לְ/יִשְׂרָאֵ֔ל אִם יוֹרֵ֖שׁ אֵ֣ין ל֑/וֹ מַדּ֗וּעַ יָרַ֤שׁ מַלְכָּ/ם֙ אֶת גָּ֔ד וְ/עַמּ֖/וֹ בְּ/עָרָ֥י/ו יָשָֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/001.yaml
  text: 'Concerning the sons of Ammon[a], thus says Yahweh: Does Israel have no sons? Does he have no heir? Why then has Milcom taken possession of Gad, and his people settled in its cities?'
translation:
  language: ru
  text: 'О сыновьях Аммона. Так говорит Яхве:


    «Разве у Израиля нет сыновей?

    Разве нет у него наследника?

    Почему же Милком[a] завладел Гадом,

    а его народ поселился в городах Гада?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейскую форму, переданную как «Милком», можно также прочитать как «их царь»: «Почему же их царь завладел Гадом…?»'
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי עַמּוֹן
  choice: О сыновьях Аммона
  rationale: Предлог לְ здесь вводит тему пророчества. Формулировка сохраняет образное еврейское обозначение народа и остаётся понятной по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הֲבָנִים ... לְיִשְׂרָאֵל
  choice: Разве у Израиля нет сыновей?
  rationale: «Сыновья» точно передаёт בנים и сохраняет связь следующего вопроса с правом наследования.
- source_word: אִם יוֹרֵשׁ אֵין לוֹ
  choice: Разве нет у него наследника?
  rationale: אִם в контексте продолжает риторическое вопрошание; местоимение относится к Израилю.
- source_word: מַדּוּעַ יָרַשׁ
  choice: Почему же ... завладел
  rationale: Глагол ירש здесь означает вступление во владение землёй; «завладел» естественно передаёт захват территории и сохраняет наследственную образность контекста.
- source_word: מַלְכָּם
  choice: Милком
  rationale: Огласовка и контекст допускают понимание формы как имени аммонитского божества; неоднозначность с чтением «их царь» сохранена в сноске.
- source_word: אֶת גָּד
  choice: Гадом
  rationale: Сохранено краткое собственное имя; в контексте оно обозначает землю колена Гада.
- source_word: וְעַמּוֹ בְּעָרָיו יָשָׁב
  choice: а его народ поселился в городах Гада
  rationale: «Его народ» сохраняет мужской суффикс, относящийся при основном чтении к Милкому. Повтор «Гада» естественно уточняет, что речь идёт о городах захваченной области, и устраняет неясность русского местоимения.
theological_decisions:
- issue: Чтение מַלְכָּם
  choice: Милком — аммонитское божество
  alternative: их царь
  rationale: Еврейская форма допускает оба прочтения. Имя божества хорошо соответствует контексту пророчества против Аммона, однако альтернативное чтение нельзя исключить, поэтому оно приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторический параллелизм сохранён; синтаксис сделан естественным для чтения вслух. Маркер сноски помещён после заголовочной фразы, как в предоставленном консультационном тексте.
