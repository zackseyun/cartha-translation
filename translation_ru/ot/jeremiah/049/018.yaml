base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/018.yaml
  text: As when Sodom and Gomorrah and their neighboring towns were overthrown[a], says Yahweh, no man will dwell there[b], and no son of man will sojourn in her.
translation:
  language: ru
  text: Подобно тому, как были ниспровергнуты Содом, Гоморра и соседние с ними города[a], — говорит Яхве, — так никто не поселится там, и ни один человек не будет жить в ней как пришелец[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Подобно ниспровержению Содома, Гоморры и окрестных городов».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может обозначать проживание в качестве пришельца или временного поселенца.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת
  choice: Как при ниспровержении
  rationale: Предлог כְּ выражает сравнение, а מַהְפֵּכָה — катастрофическое ниспровержение. Такая формулировка сохраняет образ и естественно звучит по-русски.
- source_word: סְדֹם וַעֲמֹרָה וּשְׁכֵנֶיהָ
  choice: Содома и Гоморры и соседних с ними городов
  rationale: Существительное со значением «соседи» здесь относится к окружающим поселениям; добавление «городов» ясно передаёт подразумеваемый смысл.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Настоящее время соответствует устойчивой пророческой формуле, а имя יהוה передано как «Яхве».
- source_word: יֵשֵׁב שָׁם אִישׁ
  choice: никто не поселится там
  rationale: В контексте запустения ישׁב означает обосноваться, поселиться. Русское «никто» естественно передаёт обобщённое отрицание при אִישׁ.
- source_word: יָגוּר בָּהּ
  choice: не будет жить в ней как пришелец
  rationale: Глагол גור обозначает проживание пришельца или временного поселенца и отличается по оттенку от ישׁב; местоимение женского рода сохранено как «в ней».
- source_word: בֶּן אָדָם
  choice: ни один человек
  rationale: В данном немессианском контексте это еврейское обозначение человеческого существа; буквальное «сын человеческий» в современном русском могло бы ошибочно восприниматься как титул.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Значение בֶּן אָדָם
  choice: ни один человек
  alternative: ни один сын человеческий
  rationale: Здесь выражение входит в формулу полного запустения и означает обычного смертного, а не мессианский титул.
- issue: Род местоимения בָּהּ
  choice: в ней
  alternative: там
  rationale: Форма женского рода допускает отсылку к подразумеваемой земле или местности; её сохранение передаёт образность оригинала, не уточняя референт сверх текста.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Архаичное «сын человеческий» заменено контекстуально точным «человек», а различие между ישׁב и גור сохранено через «поселиться» и «жить как пришелец».
