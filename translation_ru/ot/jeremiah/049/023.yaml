base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/023.yaml
  text: 'Concerning Damascus: Hamath and Arpad are put to shame[a], for they have heard bad news; they melt away. There is anxiety like the sea; it cannot be quiet.'
translation:
  language: ru
  text: 'О Дамаске.


    Хамат и Арпад посрамлены,


    потому что услышали недобрую весть;


    они пали духом.


    Тревога — словно море[a]:


    оно не может успокоиться.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза трудна; буквально: «в море — тревога; [оно] не может успокоиться». Возможно также понимание: «В море тревога, и оно не может успокоиться». Основной текст передаёт распространённое истолкование: тревога подобна неспокойному морю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדַמֶּשֶׂק
  choice: О Дамаске
  rationale: Предлог לְ в заголовке пророчества естественно передаётся нейтральным «о»; это не усиливает значение до «против», хотя контекст содержит суд.
- source_word: בּוֹשָׁה
  choice: посрамлены
  rationale: Форма женского рода единственного числа при паре топонимов отражает собирательное согласование. «Посрамлены» передаёт публичный позор и соответствует множественному смыслу составного подлежащего.
- source_word: חֲמָת וְאַרְפָּד
  choice: Хамат и Арпад
  rationale: Географические названия переданы принятой русской библейской транслитерацией.
- source_word: שְׁמֻעָה רָעָה
  choice: недобрую весть
  rationale: Выражение обозначает весть о бедствии. «Недобрая весть» звучит естественно и сохраняет сдержанность исходного выражения.
- source_word: נָמֹגוּ
  choice: пали духом
  rationale: Глагол буквально рисует таяние или растворение, а метафорически — утрату мужества. Русское «пали духом» ясно передаёт контекстуальный смысл без неестественного буквального образа «растаяли».
- source_word: בַּיָּם דְּאָגָה
  choice: Тревога — словно море
  rationale: Трудная еврейская конструкция наиболее связно понимается как сравнение тревоги с неспокойным морем; неоднозначность отмечена в сноске.
- source_word: הַשְׁקֵט לֹא יוּכָל
  choice: оно не может успокоиться
  rationale: Местоимение отнесено к морю в принятом сравнительном прочтении; глагольная конструкция выражает невозможность быть спокойным или утихнуть.
