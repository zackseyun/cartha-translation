base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/039.yaml
  text: But in the latter days I will restore the fortunes of Elam[a], declares Yahweh.
translation:
  language: ru
  text: Но в последние дни Я восстановлю благополучие Элама[a], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верну пленников Элама» либо «положу конец пленению Элама». Еврейская формула может означать как возвращение из плена, так и более широкое восстановление благополучия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Но
  rationale: Союз и вводная форма отмечают переход от предшествующего суда к будущему восстановлению; «Но» естественно передаёт этот смысловой поворот, не утяжеляя фразу буквальным «и будет».
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: в последние дни
  rationale: Устойчивое пророческое выражение, указывающее на будущее и допускающее эсхатологический оттенок; перевод сохраняет его вес, не уточняя сроки.
- source_word: אשוב אֶת שבית
  choice: Я восстановлю благополучие
  rationale: В составе устойчивой формулы глагол שׁוב и существительное שְׁבוּת/שבית могут обозначать возвращение из плена или, шире, перемену участи и восстановление народа. Основной перевод естественно передаёт широкий смысл, а более узкое понимание вынесено в сноску.
- source_word: עֵילָם
  choice: Элама
  rationale: Традиционная и узнаваемая русская передача названия народа и области; падежная форма обусловлена синтаксисом.
- source_word: נְאֻם
  choice: возвещает
  rationale: Сохраняет торжественную силу стандартной пророческой формулы и звучит естественно в современном литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Пророческий и возможный эсхатологический смысл בְּאַחֲרִית הַיָּמִים
  choice: в последние дни
  alternative: в грядущие дни; впоследствии
  rationale: Выбранная формулировка сохраняет пророческую и потенциально эсхатологическую окраску, но не связывает стих с какой-либо конкретной схемой последних событий.
- issue: Смысл формулы אשוב אֶת שבית עֵילָם
  choice: широкое восстановление благополучия Элама
  alternative: возвращение пленников Элама или освобождение Элама из плена
  rationale: Еврейская формула допускает как конкретное возвращение из плена, так и более широкую перемену участи после суда. Основной текст не сужает смысл, а сноска сохраняет более буквальную возможность.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной пророческой интонацией. Сохранены традиционное название «Элам» и личное имя «Яхве»; формулировка избегает архаической тяжеловесности и конфессионально обусловленных уточнений.
