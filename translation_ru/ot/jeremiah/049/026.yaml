base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/026.yaml
  text: Therefore her young men will fall in her streets[a], and all the men of war will be silenced on that day[c][b], declares Yahweh of Armies.
translation:
  language: ru
  text: Поэтому её юноши падут на её площадях[a], и все воины умолкнут[b] в тот день, — возвещает Яхве Воинств[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на её улицах»; возможный смысл: «на её открытых местах».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «погибнут», «будут истреблены». Древнееврейский глагол может означать «умолкнуть» или «замереть», а в контексте суда — «погибнуть» или «быть уничтоженными».'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционная передача: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод или следствие из предшествующего пророчества о суде.
- source_word: יִפְּלוּ
  choice: падут
  rationale: Сохраняет древнееврейский военный образ падения, подразумевающий гибель, но не поясняет его сверх текста.
- source_word: בַחוּרֶיהָ
  choice: её юноши
  rationale: Слово обозначает молодых мужчин в расцвете сил, в данном контексте — способных сражаться.
- source_word: בִּרְחֹבֹתֶיהָ
  choice: на её площадях
  rationale: רְחוֹב обозначает широкое открытое городское пространство, площадь или широкую улицу; «площадях» естественно передаёт сцену городского поражения.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: воины
  rationale: Естественно и кратко передаёт буквальное выражение «люди войны», то есть участвующие в сражении мужчины.
- source_word: יִדַּמּוּ
  choice: умолкнут
  rationale: Сохраняет образ прекращения звука и деятельности, не устраняя возможный контекстуальный смысл гибели или уничтожения.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Обычная и естественная русская передача пророческой временной формулы.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт формулу, удостоверяющую божественное пророческое изречение, в современном литературном регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет военный смысл божественного титула и его связь с контекстом суда.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет это различие, не превращая имя в титул.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф
  rationale: Выбранная форма раскрывает военный смысл צְבָאוֹת для современного читателя; традиционная форма приведена в примечании.
- issue: Значение יִדַּמּוּ в контексте суда
  choice: умолкнут
  alternative: погибнут
  rationale: Основной текст сохраняет образ безмолвия и остановки, тогда как примечание указывает на более сильный контекстуальный смысл, не устраняя лексической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис остаётся ясным; военные образы и неоднозначность глагола יִדַּמּוּ сохранены.
