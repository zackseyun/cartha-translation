  text: רָפְתָ֥ה דַמֶּ֛שֶׂק הִפְנְתָ֥ה לָ/נ֖וּס וְ/רֶ֣טֶט הֶחֱזִ֑יקָה צָרָ֧ה וַ/חֲבָלִ֛ים אֲחָזַ֖תָּ/ה כַּ/יּוֹלֵדָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/024.yaml
  text: Damascus has become feeble[a]; she has turned to flee, and trembling has seized her. Distress and labor pains have taken hold of her[c][b], like a woman giving birth.
translation:
  language: ru
  text: Дамаск ослабел[a], повернулся, чтобы бежать, и дрожь овладела им[b]. Бедствие и родовые муки[c] охватили его, как женщину при родах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишился мужества» или «изнемог». Еврейский глагол может обозначать как ослабление, так и упадок духа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «трепет» или «ужас овладел им». Еврейское слово буквально обозначает дрожь или содрогание, вероятно от страха.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «муки» или «боли». Последующее сравнение с женщиной при родах указывает на образ родовых болей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָפְתָה
  choice: ослабел
  rationale: Глагол רפה передаёт ослабление сил или утрату мужества; «ослабел» сохраняет широту значения и естественно сочетается с олицетворённым Дамаском.
- source_word: דַמֶּשֶׂק
  choice: Дамаск
  rationale: Устоявшаяся русская форма географического названия; грамматически мужской род определяет местоименное согласование.
- source_word: הִפְנְתָה לָנוּס
  choice: повернулся, чтобы бежать
  rationale: Передаёт значение глагола «повернуться» и инфинитива цели «бежать», не сводя выражение лишь к абстрактному «обратился в бегство».
- source_word: וְרֶטֶט
  choice: но его охватила дрожь
  rationale: רֶטֶט буквально обозначает дрожь, трепет. Союз передан как «но», поскольку в контексте дрожь препятствует намеченному бегству; само телесное изображение сохранено.
- source_word: הֶחֱזִיקָה
  choice: охватила
  rationale: Форма от חזק в данном употреблении означает крепко схватить или овладеть; «охватила» естественно звучит с подлежащим «дрожь».
- source_word: צָרָה
  choice: Скорбь
  rationale: צָרָה обозначает бедствие, тесноту, тяжёлое страдание; «скорбь» здесь передаёт внутреннюю мучительность состояния и поддерживает параллель с родовыми муками.
- source_word: וַחֲבָלִים
  choice: и муки
  rationale: חֲבָלִים может означать мучительные боли, в том числе родовые. Последующее сравнение с роженицей ясно задаёт родовой образ, поэтому краткое «муки» сохраняет поэтическую выразительность.
- source_word: אֲחָזַתָּה
  choice: объяли его
  rationale: אחז означает схватить, охватить. «Объяли» передаёт множественное подлежащее и возвышенный поэтический регистр; местоимение согласовано с русским мужским родом названия «Дамаск».
- source_word: כַּיּוֹלֵדָה
  choice: как роженицу
  rationale: Причастие от ילד обозначает женщину, рожающую или находящуюся в родах; русское «роженица» точно и лаконично передаёт образ.
