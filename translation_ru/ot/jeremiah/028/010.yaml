- source_word: וַיִּקַּח
  choice: снял
  rationale: В сочетании с מֵעַל («с шеи») глагол לקח естественно передаётся по-русски как «снял»; это выражает взятие и удаление предмета, не добавляя оттенка насилия.
- source_word: חֲנַנְיָה
  choice: Ханания
  rationale: Имя передано в принятой русской библейской форме.
- source_word: הַנָּבִיא
  choice: пророк
  rationale: Обычное соответствие נָבִיא; определение сохранено при именах и Ханании, и Иеремии ради ясности и риторического повтора.
- source_word: הַמּוֹטָה
  choice: ярмо
  rationale: Слово מוֹטָה может обозначать деревянную перекладину или брус ярма; в контексте символического действия Иеремии «ярмо» наиболее ясно передаёт предмет, а лексическая неоднозначность отмечена в сноске.
- source_word: מֵעַל צַוַּאר
  choice: с шеи
  rationale: Естественная русская передача буквального «с/от поверхности шеи», сохраняющая физическое снятие предмета.
- source_word: יִרְמְיָה
  choice: Иеремия
  rationale: 'Имя передано в принятой русской библейской форме; после предлога употреблён родительный падеж: «Иеремии».'
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: и сломал его
  rationale: שׁבר означает «ломать, разбивать»; «сломал» точно и без неоправданного усиления передаёт действие, а местоимение мужского рода согласовано с «ярмо».
