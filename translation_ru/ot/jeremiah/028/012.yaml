base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/012.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after Hananiah the prophet had broken the yoke from off the neck of Jeremiah the prophet, saying,
translation:
  language: ru
  text: 'После того как пророк Анания сломал ярмо[a] с шеи пророка Иеремии, слово Яхве пришло к Иеремии:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перекладину ярма»; еврейское слово может обозначать именно деревянную поперечину ярма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֶל יִרְמְיָה
  choice: Тогда … к Иеремии было слово Яхве
  rationale: Сохраняет традиционную пророческую формулу «было слово», а «тогда» естественно передаёт переход к следующему событию повествования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אַחֲרֵי שְׁבוֹר
  choice: после того как … сломал
  rationale: Инфинитивная конструкция обозначает завершённое действие, предшествующее получению Иеремией слова Яхве.
- source_word: חֲנַנְיָה הַנָּבִיא
  choice: пророк Анания
  rationale: Естественный для современного русского порядок слов сохраняет титул и имя.
- source_word: הַמּוֹטָה
  choice: ярмо
  rationale: В контексте это понятное обозначение деревянного ярма — пророческого знака Иеремии; более узкое значение «перекладина ярма» отмечено в сноске.
- source_word: מֵעַל צַוַּאר
  choice: на шее
  rationale: Русская конструкция с глаголом «сломал» естественно обозначает местонахождение ярма; смысл удаления с шеи понятен из действия и контекста.
- source_word: יִרְמְיָה הַנָּבִיא
  choice: пророка Иеремии
  rationale: Сохраняет повтор титула из еврейского текста и подчёркивает столкновение двух пророков.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит по-русски содержание последующей прямой речи, выполняя функцию еврейского לֵאמֹר без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как имя; транслитерация сохраняет это отличие от титула.
translation_notes:
  register: Современный литературный русский с сохранением достоинства пророческой формулы. Обстоятельство времени вынесено вперёд для ясной последовательности событий; двоеточие естественно связывает стих со следующей репликой.
