base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/013.yaml
  text: 'Go and say to Hananiah, saying, ‘Thus says the LORD: You have broken wooden yoke-bars, but you have made iron yoke-bars in their place.’'
translation:
  language: ru
  text: '«Пойди и скажи Анании: „Так говорит ГОСПОДЬ: ты сломал деревянные перекладины ярма, но вместо них сделал железные перекладины ярма“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: Пойди и скажи
  rationale: Естественно передаёт сочетание абсолютного инфинитива с личной формой глагола, выражающее прямое повеление.
- source_word: מֹטֹת עֵץ
  choice: деревянные перекладины ярма
  rationale: מֹטוֹת обозначает перекладины или брусья ярма; уточнение «ярма» ясно передаёт образ в контексте главы.
- source_word: וְעָשִׂיתָ תַחְתֵּיהֶן
  choice: но вместо них сделал
  rationale: Союз וְ в данном противопоставлении естественно передан как «но»; תַחְתֵּיהֶן означает замену сломанных перекладин.
- source_word: מֹטוֹת בַּרְזֶל
  choice: железные
  rationale: Во избежание тяжёлого повтора существительное опущено по нормам русского языка; подразумеваются «перекладины ярма».
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона с типографическим выделением, сохраняющая различие между именем Бога и обычным титулом.
theological_decisions:
- issue: Кто сделал железные перекладины
  choice: 'сохранена форма второго лица: «ты… сделал»'
  alternative: 'безличное или божественное действие: «будут сделаны» / «Я сделаю»'
  rationale: Масоретский текст прямо употребляет וְעָשִׂיתָ, форму 2-го лица мужского рода единственного числа; метафорическую причинность Анании не следует устранять.
translation_notes:
  register: Современный литературный русский язык; речь торжественная, но не архаичная. Формула пророческого послания передана устойчивым оборотом «Так говорит ГОСПОДЬ». Вводное לֵאמֹר не воспроизведено отдельным «говоря», поскольку в русском после «скажи» оно избыточно и естественно выражается двоеточием и прямой речью.
