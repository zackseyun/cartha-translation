source:
  edition: WLC
  text: וְ/אֶת יְכָנְיָ֣ה בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְ֠הוּדָה וְ/אֶת כָּל גָּל֨וּת יְהוּדָ֜ה הַ/בָּאִ֣ים בָּבֶ֗לָ/ה אֲנִ֥י מֵשִׁ֛יב אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה נְאֻם יְהוָ֑ה כִּ֣י אֶשְׁבֹּ֔ר אֶת עֹ֖ל מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/004.yaml
  text: And I will bring back to this place Jeconiah son of Jehoiakim[a], king of Judah, and all the exiles of Judah who came to Babylon, declares Yahweh, for I will break the yoke of the king of Babylon.
translation:
  language: ru
  text: И Иехонию, сына Иоакима, царя Иудеи, и всех изгнанников из Иудеи, прибывших в Вавилон[a], Я возвращу на это место, — возвещает Яхве, — потому что сокрушу ярмо царя Вавилона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приходящих в Вавилон». Еврейское причастие допускает контекстуальный перевод прошедшим временем: «прибывших» или «пришедших в Вавилон».'
    reason: Сохраняется видовременная неоднозначность еврейского причастия; «прибывших» является естественной русской передачей в данном контексте и не вносит пассивного значения.
lexical_decisions:
- source_word: יְכָנְיָה
  choice: Иехония
  rationale: Устоявшаяся русская передача полной формы личного имени; сохраняет отличие от сокращённой формы имени в других местах.
- source_word: גָּלוּת יְהוּדָה
  choice: всех изгнанников из Иудеи
  rationale: Существительное может обозначать как состояние изгнания, так и общину переселённых; последующее определение людей посредством причастия указывает здесь на группу изгнанников.
- source_word: הַבָּאִים בָּבֶלָה
  choice: пришедших в Вавилон
  rationale: Передаёт активное причастие от בוא и направление, выраженное формой בָּבֶלָה, не добавляя отсутствующего в еврейском тексте пассивного значения «приведённых» или «уведённых».
- source_word: מֵשִׁיב
  choice: Я возвращу
  rationale: Каузативная форма от שוב с личными дополнениями и направлением «на это место» означает возвращение людей обратно; русское будущее естественно в контексте обещания.
- source_word: הַמָּקוֹם הַזֶּה
  choice: это место
  rationale: Прямая и естественная передача указательного оборота без преждевременной конкретизации как Иерусалима или Иудеи.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественный характер устойчивой пророческой формулы и звучит естественно в современном литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֶשְׁבֹּר אֶת עֹל מֶלֶךְ בָּבֶל
  choice: сокрушу ярмо царя Вавилона
  rationale: Сохраняет образ ярма как метафору политического господства; «сокрушу» передаёт силу глагола שבר и соответствует возвышенному пророческому регистру.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация сохраняет его статус имени и не подменяет титулом.
- issue: Характер обещанного возвращения
  choice: Я возвращу
  alternative: Я восстановлю; Я приведу обратно
  rationale: Форма מֵשִׁיב допускает оттенок восстановления, но при перечислении людей и указании места прежде всего выражает их возвращение; формулировка не добавляет объяснения способа исполнения пророчества.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Порядок дополнений в начале предложения сохранён для передачи акцента еврейского текста, но сказуемое поставлено так, чтобы фраза оставалась ясной. Образ «ярма» сохранён без поясняющей перефразировки.
