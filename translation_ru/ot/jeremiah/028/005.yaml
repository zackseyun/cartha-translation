id: JER.28.5
reference: Jeremiah 28:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אֶל חֲנַנְיָ֖ה הַ/נָּבִ֑יא לְ/עֵינֵ֤י הַ/כֹּֽהֲנִים֙ וּ/לְ/עֵינֵ֣י כָל הָ/עָ֔ם הָ/עֹמְדִ֖ים בְּ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/005.yaml
  text: Then Jeremiah the prophet said to Hananiah the prophet in the sight of the priests and in the sight of all the people who were standing in the house of Yahweh:[a][b]
translation:
  language: ru
  text: Тогда пророк Иеремия сказал пророку Ханании в присутствии священников и всего народа, стоявшего в доме Яхве:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на глазах у священников и на глазах у всего народа».'
    reason: lexical_alternative
  - marker: b
    text: «Дом Яхве» — то есть храм.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: יִרְמְיָה הַנָּבִיא
  choice: пророк Иеремия
  rationale: Сохраняется имя и определённое обозначение служения; русский порядок слов звучит естественно.
- source_word: אֶל חֲנַנְיָה הַנָּבִיא
  choice: пророку Ханании
  rationale: Повтор титула «пророк», имеющийся в еврейском тексте, сохранён и применён также к Ханании.
- source_word: לְעֵינֵי
  choice: в присутствии
  rationale: Идиома буквально означает «на глазах у» и указывает на публичность речи. Основной вариант естественен по-русски, а буквальный образ и повтор отмечены в сноске.
- source_word: כָל הָעָם
  choice: всего народа
  rationale: עָם здесь обозначает собравшийся народ как общность, а не просто случайную толпу.
- source_word: הָעֹמְדִים
  choice: стоявшего
  rationale: Причастие описывает народ, находившийся там в тот момент. В русском согласование с собирательным существительным «народ» дано в единственном числе.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Сохранено буквальное «дом» и личное имя Бога; по контексту речь идёт о храме.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст прямо содержит тетраграмматон; «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Обозначение Ханании как пророка
  choice: пророку Ханании
  alternative: Ханании, называвшему себя пророком
  rationale: В стихе Ханания прямо назван הַנָּבִיא. Перевод не добавляет оценки истинности его пророчества и сохраняет напряжение повествования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор титула «пророк» сохранён, а тяжеловесный буквальный повтор לְעֵינֵי передан естественной конструкцией и отражён в сноске. Двоеточие указывает на последующую прямую речь.
