source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/הִ֗יא בְּ/רֵאשִׁית֙ מַמְלֶ֨כֶת֙ צִדְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֔ה ב/שנת הָֽ/רְבִעִ֔ית בַּ/חֹ֖דֶשׁ הַ/חֲמִישִׁ֑י אָמַ֣ר אֵלַ֡/י חֲנַנְיָה֩ בֶן עַזּ֨וּר הַ/נָּבִ֜יא אֲשֶׁ֤ר מִ/גִּבְעוֹן֙ בְּ/בֵ֣ית יְהוָ֔ה לְ/עֵינֵ֧י הַ/כֹּהֲנִ֛ים וְ/כָל הָ/עָ֖ם לֵ/אמֹֽר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/001.yaml
  text: And it happened in that year[a], at the beginning of the reign of Zedekiah king of Judah, in the fourth year, in the fifth month, that Hananiah son of Azzur, the prophet from Gibeon, spoke to me in the house of Yahweh, in the sight of the priests and all the people, saying[b],
translation:
  language: ru
  text: 'И вот, в тот год — в начале царствования Седекии, царя Иудеи, в четвёртый год, в пятый месяц[a] — Анания, сын Аззура, пророк из Гаваона, сказал мне в доме Яхве перед священниками и всем народом[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте сказано и «в начале царствования Седекии», и «в четвёртый год». Перевод сохраняет обе формулировки, не устраняя видимого хронологического напряжения.
    reason: textual_note
  - marker: b
    text: 'Буквально: «перед глазами священников и всего народа», то есть открыто, в их присутствии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Естественная для русского библейского повествования формула, вводящая новый эпизод без излишне архаического «и случилось».
- source_word: בַּשָּׁנָה הַהִיא
  choice: в тот год
  rationale: Прямая и естественная передача временного оборота.
- source_word: בְּרֵאשִׁית מַמְלֶכֶת
  choice: в начале царствования
  rationale: מַמְלָכָה в данном сочетании обозначает период царствования, а не царство как территорию.
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Седекии, царя Иудеи
  rationale: Устоявшиеся русские формы имени и титула; приложение выделено запятыми по нормам русского языка.
- source_word: בַּשָּׁנָה הָרְבִעִית בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: в четвёртый год, в пятый месяц
  rationale: Сохраняется точная календарная формулировка исходного текста без пересчёта на современный календарь.
- source_word: אָמַר אֵלַי
  choice: сказал мне
  rationale: Прямой русский эквивалент אמר; двоеточие естественно вводит речь, следующую в продолжении текста.
- source_word: חֲנַנְיָה בֶן עַזּוּר
  choice: Анания, сын Аззура
  rationale: Использованы традиционные русские библейские формы имён; родственная связь передана явно.
- source_word: הַנָּבִיא אֲשֶׁר מִגִּבְעוֹן
  choice: пророк из Гаваона
  rationale: Краткая и естественная передача титула и происхождения без определения подлинности его пророческих притязаний.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняются образ «дома» и личное имя Бога, представленное тетраграмматоном.
- source_word: לְעֵינֵי הַכֹּהֲנִים וְכָל הָעָם
  choice: перед священниками и всем народом
  rationale: Идиома буквально означает «перед глазами» и указывает на открытую речь в присутствии названных людей.
theological_decisions:
- issue: Хронологическое напряжение между «в начале царствования» и «в четвёртый год»
  choice: Сохранить оба выражения без согласования
  alternative: Ослабить значение «начала» либо исправить одну из датировок
  rationale: Оба указания присутствуют в масоретском тексте; перевод не должен скрыто устранять внутреннее напряжение.
- issue: Статус Анании как пророка
  choice: Передать הַנָּבִיא как «пророк»
  alternative: Добавить дистанцирующее «так называемый пророк» или «лжепророк»
  rationale: В этом стихе повествователь прямо называет Ананию пророком; последующее развитие рассказа не следует заранее вносить в перевод.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Передача личного имени сохраняет различие между тетраграмматоном и титулом «Господь».
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сохраняет развернутую временную рамку еврейского текста, но остаётся понятным. Хронологическое напряжение намеренно не сглажено.
