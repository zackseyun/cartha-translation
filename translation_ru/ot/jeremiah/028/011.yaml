base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/011.yaml
  text: 'And Hananiah said in the sight of all the people[a], saying[b], “Thus says Yahweh: In this way I will break the yoke of Nebuchadnezzar king of Babylon from upon the neck of all the nations within two years.” Then Jeremiah the prophet went on his way.'
translation:
  language: ru
  text: 'И Анания сказал перед всем народом[a]: «Так говорит Яхве: вот так[b] Я сокрушу ярмо Навуходоносора, царя Вавилона, с шеи всех народов — не пройдёт и двух лет». И пророк Иеремия пошёл своей дорогой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на глазах у всего народа».'
    reason: lexical_alternative
  - marker: b
    text: 'Слова «вот так» вероятно указывают на символическое действие Анании: он сломал ярмо.'
    reason: cultural_note
lexical_decisions:
- source_word: לְעֵינֵי כָל־הָעָם
  choice: перед всем народом
  rationale: Еврейская идиома буквально связана с глазами, но означает открытое действие в присутствии всех; русский оборот естественно передаёт публичность.
- source_word: כֹּה ... כָּכָה
  choice: Так ... вот так
  rationale: Различение двух указательных наречий сохраняет формулу пророческой речи и вероятную отсылку к только что совершённому символическому действию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֶשְׁבֹּר אֶת־עֹל
  choice: сокрушу ярмо
  rationale: Будущее время соответствует пророческому заявлению; «сокрушу» естественно передаёт физическое ломание ярма и образ уничтожения господства.
- source_word: בְּעוֹד שְׁנָתַיִם יָמִים
  choice: не пройдёт и двух лет
  rationale: Идиоматически выражает срок в пределах двух лет и сохраняет силу обещания, не превращая его в указание на точный момент по истечении двух лет.
- source_word: מֵעַל צַוַּאר כָּל־הַגּוֹיִם
  choice: сняв его с шеи всех народов
  rationale: Сохраняет зримый образ ярма на шее и ясно связывает местоимение с ярмом.
- source_word: וַיֵּלֶךְ ... לְדַרְכּוֹ
  choice: пошёл своей дорогой
  rationale: Естественный русский эквивалент повествовательной идиомы об уходе Иеремии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Статус слов Анании
  choice: переданы как заявление Анании без редакционного подтверждения их истинности
  alternative: формулировка, косвенно удостоверяющая пророчество как Божье слово
  rationale: Стих сообщает, что именно сказал Анания; ближайший контекст оценивает его заявление, поэтому перевод не должен заранее разрешать повествовательное напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прямая речь звучит ясно и публично; буквальные семитизмы сглажены там, где они были бы неестественны, при сохранении образов ярма, шеи и символического действия.
