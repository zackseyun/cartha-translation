  text: וַ/יָּ֛מָת חֲנַנְיָ֥ה הַ/נָּבִ֖יא בַּ/שָּׁנָ֣ה הַ/הִ֑יא בַּ/חֹ֖דֶשׁ הַ/שְּׁבִיעִֽי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/017.yaml
  text: And Hananiah the prophet died in that year[a], in the seventh month.
translation:
  language: ru
  text: И умер пророк Ханания в том году, в седьмом месяце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: И умер
  rationale: Форма Qal wayyiqtol от מוּת передаёт последовательное повествовательное действие; русское «И умер» естественно сохраняет начальную связку.
- source_word: חֲנַנְיָה
  choice: Ханания
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: הַנָּבִיא
  choice: пророк
  rationale: נָבִיא означает «пророк». Хотя контекст разоблачает Хананию, в самом стихе нет определения «лжепророк», поэтому оно не добавляется.
- source_word: בַּשָּׁנָה הַהִיא
  choice: в том году
  rationale: Прямое и естественное соответствие выражению «в тот год» без усилительного «в том же году», которого в еврейском тексте явно нет.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: в седьмом месяце
  rationale: Точно и естественно передаёт предложное сочетание с порядковым числительным.
theological_decisions:
- issue: Следует ли прямо назвать Хананию лжепророком
  choice: Сохранить обозначение «пророк»
  alternative: «лжепророк»
  rationale: Контекст оценивает слова Ханании как ложные, однако данный стих использует обычное слово נָבִיא без отрицательного определения. Перевод не должен вносить отсутствующую в формулировке стиха характеристику.
translation_notes:
  register: 'Современный литературный русский язык; краткая, торжественно-повествовательная формулировка. Порядок «пророк Ханания» звучит естественно и сохраняет титул при имени. Отдельная сноска к «в том году» не нужна: перевод непосредственно воспроизводит исходную формулировку и не требует указания лексической альтернативы.'
