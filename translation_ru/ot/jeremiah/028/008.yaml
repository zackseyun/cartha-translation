revisions:
- from: Пророки, жившие задолго до меня и до тебя[a], пророчествовали против многих стран и великих царств, предрекая войну, бедствие и мор[b].
  to: Пророки, жившие до меня и до тебя издревле[a], пророчествовали о многих странах и великих царствах, предрекая войну, бедствие и моровую язву[b].
  rationale: Редакция непосредственно передаёт временное «издревле» и избегает нивелирования разных еврейских предлогов в спорном обороте. Перечень предсказываемых бедствий остаётся явным, поэтому контекст пророческого суда не утрачен. Сноски сохранены и их маркеры стоят в основном тексте.
  reviewer_model: gpt-5.6-terra
