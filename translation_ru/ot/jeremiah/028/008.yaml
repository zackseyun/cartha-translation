base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/008.yaml
  text: The prophets who were before me and before you from ancient times prophesied against many lands and against great kingdoms[b][a], of war and disaster and plague.
translation:
  language: ru
  text: Пророки, жившие до меня и до тебя издревле[a], пророчествовали о многих странах и великих царствах, предрекая войну, бедствие и моровую язву[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с давних времён». Еврейское выражение здесь указывает на далёкое прошлое, а не обязательно на вечность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мор», «эпидемию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּבִיאִים
  choice: Пророки
  rationale: Определённое существительное во множественном числе; естественная и точная передача.
- source_word: אֲשֶׁר הָיוּ לְפָנַי וּלְפָנֶיךָ
  choice: жившие ... до меня и до тебя
  rationale: Оборот имеет временное значение и указывает на пророков, предшествовавших обоим собеседникам.
- source_word: מִן הָעוֹלָם
  choice: задолго
  rationale: В данном контексте выражение обозначает давнее прошлое, а не вечность; в сочетании «жившие задолго» звучит естественно по-русски.
- source_word: וַיִּנָּבְאוּ
  choice: пророчествовали
  rationale: Стандартная передача глагола נבא в контексте пророческой речи.
- source_word: אֶל אֲרָצוֹת רַבּוֹת וְעַל מַמְלָכוֹת גְּדֹלוֹת
  choice: против многих стран и великих царств
  rationale: Последующий перечень бедствий показывает, что речь идёт о пророчествах суда; «против» естественно передаёт направленность этих речений.
- source_word: לְמִלְחָמָה
  choice: войну
  rationale: Предлог вводит содержание пророчества; после «предрекая» винительный падеж ясно и естественно выражает смысл.
- source_word: וּלְרָעָה
  choice: бедствие
  rationale: В контексте суда רָעָה означает несчастье или бедствие, а не нравственное зло.
- source_word: וּלְדָבֶר
  choice: мор
  rationale: דֶּבֶר обозначает губительную эпидемию. «Мор» — точный, библейски уместный и понятный литературный термин; вариант разъяснён в сноске.
theological_decisions:
- issue: Значение предлогов при пророчестве о суде
  choice: «пророчествовали против многих стран и великих царств»
  alternative: «пророчествовали о многих странах и великих царствах» или «пророчествовали многим странам и против великих царств»
  rationale: Триада «война, бедствие и мор» указывает на враждебные пророчества суда, однако возможное более нейтральное понимание предлогов не меняет самого содержания предсказаний.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Предрекая» добавлено для естественной связи перечня с содержанием пророчества, не меняя смысла. Все сноски отмечены в основном тексте.
