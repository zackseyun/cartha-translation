base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/009.yaml
  text: As for the prophet who prophesies peace[a], when the word of that prophet comes to pass[c][b], then that prophet will be known as one whom Yahweh has truly sent.
translation:
  language: ru
  text: А пророк, который пророчествует о мире[a], будет признан пророком, действительно посланным Яхве, когда исполнится его слово[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о благополучии»; еврейское שָׁלוֹם может означать мир, благополучие и процветание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «когда придёт слово этого пророка». Имеется в виду исполнение пророческого слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא אֲשֶׁר יִנָּבֵא
  choice: пророк, который пророчествует
  rationale: Передаёт определённую конструкцию и обычное значение глагола נבא, сохраняя пророческий регистр.
- source_word: לְשָׁלוֹם
  choice: о мире
  rationale: שָׁלוֹם в данном противопоставлении прежде всего обозначает мирный, благополучный исход; более широкий смысл отмечен в сноске.
- source_word: בְּבֹא דְּבַר הַנָּבִיא
  choice: когда исполнится его слово
  rationale: Буквально говорится о том, что слово пророка «придёт»; в контексте это означает осуществление пророчества. Местоимение устраняет тяжеловесный повтор без потери референта.
- source_word: יִוָּדַע הַנָּבִיא
  choice: будет признан пророком
  rationale: Нифаль ידע выражает установление и признание подлинного статуса пророка; по-русски это естественнее буквального «будет узнан».
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה
  choice: действительно посланным Яхве
  rationale: Относительная конструкция отнесена к пророку; личное имя יהוה передано транслитерацией «Яхве».
- source_word: בֶּאֱמֶת
  choice: действительно
  rationale: Наречие относится к подлинности Божьего посланничества; такое чтение естественно в русском и не исключает более буквального понимания «в истине».
theological_decisions:
- issue: Критерий истинности пророка, возвещающего мир
  choice: Исполнение возвещённого слова служит основанием признать пророка действительно посланным Яхве.
  alternative: 'Более буквально: «когда придёт слово пророка, станет известно, что этого пророка Яхве послал в истине».'
  rationale: Синтаксис связывает исполнение слова с распознанием подлинности пророка, но перевод не превращает этот критерий в более широкое догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Начальное «А» сохраняет противопоставление предыдущему контексту. Перестройка порядка частей делает длинную еврейскую конструкцию ясной по-русски, сохраняя условно-временную связь и богословскую напряжённость.
