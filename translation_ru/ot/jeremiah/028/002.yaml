base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: I have broken the yoke of the king of Babylon.'
translation:
  language: ru
  text: 'Так говорит Яхве, Бог воинств, Бог Израиля: «Я сломал ярмо царя Вавилона».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула передана естественной для современного русского библейского стиля формой настоящего времени, сохраняющей торжественность и авторитетность провозглашения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: В составе титула обозначает силы, находящиеся под властью Бога; традиционное русское «Воинств» сохраняет широту значения, не ограничивая его земными армиями.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: לֵאמֹר
  choice: ': «…»'
  rationale: Инфинитив речи выполняет функцию введения прямой речи; в русском это естественно выражается двоеточием и кавычками.
- source_word: שָׁבַרְתִּי
  choice: Я сломал
  rationale: Еврейский перфект представляет действие как совершившееся и завершённое; русский совершенный вид сохраняет эту силу без добавочного толкования.
- source_word: עֹל
  choice: ярмо
  rationale: Сохранён буквальный образ ярма как метафоры политического подчинения.
- source_word: מֶלֶךְ בָּבֶל
  choice: царя Вавилона
  rationale: Прозрачно передаёт сопряжённую конструкцию и политический титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Совершённость заявления שָׁבַרְתִּי
  choice: Я сломал
  alternative: Я сокрушу; Я уже сломал
  rationale: Форма глагола представляет действие как завершённое в речи Анании. Будущее время истолковало бы форму, а «уже» добавило бы отсутствующий в тексте явный наречный акцент.
translation_notes:
  register: Современный литературный русский с достоинством пророческой формулы. «Ярмо» сохранено как понятный устойчивый библейский образ; прямая речь оформлена русскими кавычками.
