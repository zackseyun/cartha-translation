source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עֹ֣ל בַּרְזֶ֡ל נָתַ֜תִּי עַל צַוַּ֣אר כָּל הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה לַ/עֲבֹ֛ד אֶת נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וַ/עֲבָדֻ֑/הוּ וְ/גַ֛ם אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה נָתַ֥תִּי לֽ/וֹ־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/014.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: I have put an iron yoke on the necks of all these nations, to serve Nebuchadnezzar king of Babylon, and they shall serve him[b]. I have also given him the beasts of the field.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве Воинств, Бог Израиля: «Я возложил железное ярмо на шеи всех этих народов, чтобы они служили Навуходоносору, царю Вавилона, и они будут служить ему. Я отдал ему также и полевых зверей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя Бога и сохраняет смысл устойчивого божественного титула, не сужая «воинства» только до земных или небесных сил.
- source_word: עֹל בַּרְזֶל
  choice: железное ярмо
  rationale: Естественное русское сочетание, сохраняющее образ более сурового и несокрушимого подчинения в контексте главы.
- source_word: נָתַתִּי עַל צַוַּאר
  choice: Я возложил ... на шеи
  rationale: У נתן здесь значение помещения или возложения; множественное «шеи» естественно согласуется со всеми названными народами, не меняя коллективного образа оригинала.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: всех этих народов
  rationale: В контексте речь идёт о народах как политических общностях, подпавших под власть Вавилона.
- source_word: לַעֲבֹד ... וַעֲבָדֻהוּ
  choice: чтобы они служили ... и они будут служить ему
  rationale: Повтор корня עבד сохранён; первая форма выражает цель, а вторая — будущий, непреложный результат пророческого постановления.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Навуходоносору
  rationale: Использована общепринятая в русской библейской традиции форма имени; она соответствует написанию данного стиха и остаётся узнаваемой современному читателю.
- source_word: חַיַּת הַשָּׂדֶה
  choice: полевых зверей
  rationale: Сохраняет обычное библейское выражение и не ограничивает его только дикими животными.
- source_word: נָתַתִּי לוֹ
  choice: Я отдал ему
  rationale: Прямо передаёт נתן как дарование Навуходоносору власти над животным миром; совершенный вид выражает установленное Богом положение.
theological_decisions:
- issue: Божественная власть над народами и творением
  choice: Прямо утверждается, что Яхве возложил ярмо на народы и отдал Навуходоносору полевых зверей.
  alternative: Смягчить формулировку до простого допущения вавилонской власти.
  rationale: Дважды употреблённое נתן представляет господство Вавилона как установленное Богом действие суда; перевод не ослабляет и не расширяет это утверждение.
- issue: Временная и модальная сила глаголов
  choice: «Я возложил ... будут служить ... Я отдал».
  alternative: 'Передать всё простым прошедшим временем: «возложил ... служили ... отдал».'
  rationale: Перфекты с контекстуально будущим результатом выражают уже принятое и потому непреложное божественное решение; русское будущее время во второй клаузе ясно передаёт этот результат.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис близок к еврейскому, но естественен по-русски; сохранены повтор «служить» и напряжение между уже совершённым постановлением Бога и его будущим осуществлением.
