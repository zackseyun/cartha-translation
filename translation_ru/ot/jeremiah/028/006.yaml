  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אָמֵ֕ן כֵּ֖ן יַעֲשֶׂ֣ה יְהוָ֑ה יָקֵ֤ם יְהוָה֙ אֶת דְּבָרֶ֔י/ךָ אֲשֶׁ֣ר נִבֵּ֗אתָ לְ/הָשִׁ֞יב כְּלֵ֤י בֵית יְהוָה֙ וְ/כָל הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל אֶל הַ/מָּק֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/006.yaml
  text: Then Jeremiah the prophet said[a], “Amen! May Yahweh do so; may Yahweh fulfill your words that you have prophesied, to bring back the vessels of the house of Yahweh and all the exiles from Babylon to this place.”
translation:
  language: ru
  text: 'И сказал пророк Иеремия: «Аминь! Да сделает Яхве так! Да исполнит[a] Яхве твои слова, которыми ты предсказал возвращение сосудов дома Яхве и всех изгнанников из Вавилона в это место».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «да подтвердит» или «да утвердит». Еврейский глагол буквально может означать «поставить, сделать стоящими» слова, то есть осуществить сказанное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמֵן
  choice: Аминь
  rationale: 'Сохранена знакомая русская библейская и молитвенная форма, которая здесь выражает согласие-пожелание: «да будет так».'
- source_word: כֵּן יַעֲשֶׂה
  choice: да сделает так
  rationale: 'Форма передаёт желательное, а не утвердительно-будущее значение: Иеремия желает исполнения благоприятного пророчества, но не подтверждает его истинность.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно представленное тетраграмматоном в еврейском тексте.
- source_word: יָקֵם
  choice: да исполнит
  rationale: Каузативная форма от קום буквально выражает действие «поставить, утвердить» слова, то есть сделать так, чтобы оно осуществилось.
- source_word: דְּבָרֶיךָ
  choice: твои слова
  rationale: Сохранён конкретный образ еврейского текста и обращение к Анании во втором лице.
- source_word: נִבֵּאתָ
  choice: которые ты пророчески возвестил
  rationale: Естественная современная русская формулировка ясно указывает на ранее произнесённое пророчество, не вводя оценки его истинности.
- source_word: לְהָשִׁיב
  choice: о возвращении
  rationale: Номинальная русская конструкция естественно связывает содержание пророческих слов сразу с двумя дополнениями — храмовыми сосудами и изгнанниками.
- source_word: כְּלֵי בֵית יְהוָה
  choice: сосудов дома Яхве
  rationale: Сохранены традиционный термин «сосуды» для храмовой утвари и буквальное библейское обозначение храма как дома Яхве.
- source_word: כָל־הַגּוֹלָה
  choice: всех изгнанников
  rationale: Еврейское собирательное существительное естественно передано русским множественным числом, обозначающим всё сообщество уведённых в плен.
- source_word: מִבָּבֶל אֶל־הַמָּקוֹם הַזֶּה
  choice: из Вавилона на это место
  rationale: Сохранены исходная точка и указание на место речи без добавленного уточнения «Иерусалим» или «храм».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст употребляет собственное имя Бога; транслитерация «Яхве» сохраняет это различие.
- issue: Модальность ответа Иеремии
  choice: 'Искреннее пожелание: «Да сделает… Да исполнит…»'
  alternative: 'Утверждение о будущем: «Яхве сделает… Яхве исполнит…»'
  rationale: Сочетание «Аминь» с формами, имеющими побудительно-желательный оттенок, выражает надежду Иеремии, не превращая его слова в признание пророчества Анании истинным.
- issue: Отношение Иеремии к пророчеству Анании
  choice: Сохранена повествовательная напряжённость без явного одобрения или сарказма
  alternative: Передать ответ как иронический либо как безоговорочное согласие
  rationale: Сам стих допускает искреннее желание благоприятного исхода, тогда как оценка достоверности пророчества развивается в последующем контексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены «Аминь», имя «Яхве» и выражение «дом Яхве»; синтаксис слегка перестроен ради ясного и естественного перечисления возвращаемых сосудов и изгнанников.
