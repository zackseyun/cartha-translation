  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מְשַֽׁלֵּֽחֲ/ךָ֔ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה הַ/שָּׁנָה֙ אַתָּ֣ה מֵ֔ת כִּֽי סָרָ֥ה דִבַּ֖רְתָּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/016.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am sending you away from the face of the earth. This year you will die[b], because you have spoken rebellion against Yahweh.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве: «Вот, Я удалю тебя с лица земли[a]. В этом году ты умрёшь, потому что ты говорил против Яхве мятежные речи[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с поверхности земли». Это еврейское выражение означает удаление из числа живых.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ты говорил против Яхве об отступничестве»; возможны также значения «неповиновение» и «дерзкое противление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего обличения и естественно связывает приговор с контекстом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом «Господь».
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Устоявшаяся и понятная по-русски формула пророческой вести, сохраняющая настоящее время исходного выражения.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет эмфатическую функцию указательной частицы и подчёркивает предстоящее действие Бога без архаического оттенка.
- source_word: מְשַׁלֵּחֲךָ
  choice: Я удалю тебя
  rationale: В данном контексте глагол שלח обозначает устранение адресата; будущее время естественно передаёт объявляемое действие, а нейтральное «удалю» не добавляет образа насильственного уничтожения, отсутствующего в самом глаголе.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: с лица земли
  rationale: Сохраняет еврейский образ и одновременно звучит как естественное русское выражение об удалении из числа живых.
- source_word: הַשָּׁנָה אַתָּה מֵת
  choice: В этом году ты умрёшь
  rationale: Именная конструкция с מֵת в контексте пророческого приговора предсказывает близкую смерть; русское будущее время ясно передаёт эту функцию.
- source_word: סָרָה דִבַּרְתָּ אֶל יְהוָה
  choice: ты призывал к мятежу против Яхве
  rationale: סָרָה обозначает отступление, неповиновение или мятеж, а сочетание с דבר описывает речь, побуждающую к такому противлению. Формулировка естественна по-русски и сохраняет направленность против Яхве.
theological_decisions:
- issue: Смысл удаления «с лица земли»
  choice: Смертный приговор, пояснённый словами «В этом году ты умрёшь»
  alternative: Изгнание из страны или с земли проживания
  rationale: Следующая фраза прямо определяет удаление как смерть, поэтому речь идёт не просто о переселении или изгнании.
- issue: Значение סָרָה в обвинении пророка
  choice: Призыв к мятежу против Яхве
  alternative: Отступничество или дерзкое неповиновение Яхве
  rationale: Слово охватывает мятежное уклонение от верности и власти Яхве. Перевод не превращает его в узкий позднейший богословский термин, но сохраняет серьёзность обвинения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной пророческой интонацией. Прямая речь оформлена русскими кавычками; личное имя יְהוָה последовательно передано как «Яхве».
