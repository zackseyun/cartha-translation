base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/015.yaml
  text: 'Then Jeremiah the prophet said to Hananiah the prophet[a], “Listen, please, Hananiah: Yahweh has not sent you[b], and you have made this people trust in a lie.”'
translation:
  language: ru
  text: 'Тогда пророк Иеремия сказал пророку Ханании: «Прошу, послушай, Ханания: Яхве не посылал тебя, а ты побудил этот народ довериться лжи».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: הַנָּבִיא
  choice: пророк / пророку
  rationale: Титул сохранён при именах Иеремии и Ханании, включая заложенное контекстом напряжение вокруг притязаний Ханании на пророческий статус.
- source_word: שְׁמַע נָא
  choice: Послушай
  rationale: Императив передан естественным современным русским словом; частица נָא смягчает или усиливает обращение, но отдельное «пожалуйста» здесь звучало бы неуместно в торжественно-обличительном контексте.
- source_word: לֹא שְׁלָחֲךָ יְהוָה
  choice: не посылал тебя Яхве
  rationale: Русский совершенный глагол с отрицанием прямо передаёт обвинение в отсутствии Божьего поручения и сохраняет порядок смысловых акцентов еврейской фразы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: הִבְטַחְתָּ
  choice: ты внушил ... доверие
  rationale: Каузатив Hiphil от בטח означает, что Ханания побудил народ довериться; формулировка сохраняет причинное значение и звучит естественно по-русски.
- source_word: הָעָם הַזֶּה
  choice: этому народу
  rationale: Сохранено собирательное единственное число и указательное значение.
- source_word: עַל שָׁקֶר
  choice: ко лжи
  rationale: Фраза обозначает ложь как основание или объект внушённого доверия; «доверие ко лжи» естественно передаёт это отношение по-русски, не превращая שָׁקֶר в более общее «заблуждение».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; его передача как «Яхве» сохраняет различие между именем и титулом.
- issue: Статус Ханании как «пророка»
  choice: сохранить титул без поясняющей квалификации
  alternative: «лжепророк Ханания»
  rationale: Еврейский текст называет его הַנָּבִיא и не добавляет здесь слова «ложный»; обличение раскрывает его неподлинность, но перевод не должен заранее разрешать это повествовательное напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для широкого читателя; обращение краткое и обличительное. Маркеры сносок не добавлены, поскольку публикационный текст не нуждается в сносках.
