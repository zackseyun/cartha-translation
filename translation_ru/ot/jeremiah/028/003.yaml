reference: Jeremiah 28:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּ/ע֣וֹד שְׁנָתַ֣יִם יָמִ֗ים אֲנִ֤י מֵשִׁיב֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה אֶֽת כָּל כְּלֵ֖י בֵּ֣ית יְהוָ֑ה אֲשֶׁ֨ר לָקַ֜ח נְבוּכַדנֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה וַ/יְבִיאֵ֖/ם בָּבֶֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/003.yaml
  text: Within two years[a], I will bring back to this place all the vessels of the house of Yahweh[d][c][b], which Nebuchadnezzar king of Babylon took from this place and brought to Babylon.
translation:
  language: ru
  text: Не пройдёт и двух лет[a], как Я верну на это место всю утварь дома Яхве[b], которую Навуходоносор, царь Вавилона, забрал отсюда и увёз в Вавилон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ещё два года дней»; это еврейский оборот со значением «не более чем через два года».'
    reason: lexical_alternative
  - marker: b
    text: Яхве — личное имя Бога; традиционно передаётся как «Господь».
    reason: divine_name
lexical_decisions:
- source_word: בְּעוֹד שְׁנָתַיִם יָמִים
  choice: Не пройдёт и двух лет
  rationale: Оборот בְּעוֹד с обозначением времени указывает на срок, который ещё остаётся; שְׁנָתַיִם יָמִים — идиоматическое «два года». Русская формулировка естественно передаёт смысл «в пределах двух лет», не превращая его в точную дату по истечении двух лет.
- source_word: מֵשִׁיב
  choice: Я верну
  rationale: Причастие породы hифиль от שוב в пророческой речи имеет значение предстоящего действия. Поскольку речь идёт о перемещении храмовых предметов обратно на прежнее место, «верну» точнее и естественнее отвлечённого «восстановлю».
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: на это место
  rationale: Сохранены пространственный смысл и указательное значение; в данном контексте имеется в виду место, откуда была взята храмовая утварь.
- source_word: כָּל כְּלֵי בֵּית יְהוָה
  choice: всю утварь дома Яхве
  rationale: כְּלֵי обозначает совокупность предметов и принадлежностей; «утварь» охватывает это значение лучше, чем более узкое «сосуды». «Дом Яхве» сохраняет образное выражение בֵּית יְהוָה, не заменяя его пояснительным «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֲשֶׁר לָקַח
  choice: которую … забрал
  rationale: Нейтральное «забрал» передаёт לקח в контексте вывоза храмовой утвари, не усиливая его до «разграбил» или «захватил».
- source_word: נְבוּכַדנֶאצַּר
  choice: Навуходоносор
  rationale: Использована укоренившаяся и узнаваемая русская форма имени в соответствии с данной еврейской формой.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Прямо и естественно передаёт сочетание титула с названием государства.
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: отсюда
  rationale: Краткое русское наречие сохраняет указание на то же самое место и избегает тяжеловесного повтора «с этого места».
- source_word: וַיְבִיאֵם בָּבֶל
  choice: и увёз в Вавилон
  rationale: Форма hифиль передаёт каузированное перемещение к месту назначения и содержит явное местоименное дополнение «их». По-русски это естественно выражается переходным глаголом «увёз», объект которого относится к «утвари».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно транслитерировано, а не заменено титулом; сноска помогает читателю, привыкшему к традиционному переводу.
- issue: Говорящий в форме первого лица
  choice: Сохранено «Я верну» без пояснения внутри стиха
  alternative: «Я, Господь, верну»
  rationale: Высказывание продолжается от лица Яхве из предшествующего контекста, однако в самом стихе имя как подлежащее не повторяется. Добавление пояснения сняло бы контекстуальную зависимость исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранено выражение «дом Яхве», а широкое כְּלֵי передано словом «утварь». Формулировка срока намеренно не означает строго «ровно через два года».
