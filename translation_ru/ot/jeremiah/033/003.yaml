  source_fidelity: Текст точно передаёт повеление обратиться к Богу, последующее обещание ответа и сообщения о предметах, ранее неизвестных адресату. «Воззови ко Мне» адекватно передаёт קְרָא אֵלַי в уместном возвышенном регистре. Собирательные формы «о великом и недоступном» естественно передают субстантивированные множественные прилагательные גְּדֹלוֹת וּבְצֻרוֹת, не вводя лишнего существительного. «Прежде не знал» приемлемо отражает перфект לֹא יְדַעְתָּם.
