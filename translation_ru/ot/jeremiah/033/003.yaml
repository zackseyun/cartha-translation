  text: קְרָ֥א אֵלַ֖/י וְ/אֶעֱנֶ֑/ךָּ וְ/אַגִּ֧ידָה לְּ/ךָ֛ גְּדֹל֥וֹת וּ/בְצֻר֖וֹת לֹ֥א יְדַעְתָּֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/003.yaml
  text: Call to me[a], and I will answer you, and I will tell you great and hidden things that you have not known.
translation:
  language: ru
  text: Воззови ко Мне, и Я отвечу тебе и расскажу тебе о великом и недоступном[a], чего ты прежде не знал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокрытом»; буквальный образ — «укреплённом», то есть недоступном обычным путём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא אֵלַי
  choice: Воззови ко Мне
  rationale: Повелительная форма прямо призывает обратиться к Богу. «Воззови» сохраняет силу призыва и возвышенный, но понятный современному читателю регистр; «позови Меня» могло бы звучать как просьба призвать Бога к себе.
- source_word: וְאֶעֱנֶךָ
  choice: и Я отвечу тебе
  rationale: Глагол ענה в данном контексте означает ответ на обращение; русский вариант передаёт личный и прямой характер обещания.
- source_word: וְאַגִּידָה לְּךָ
  choice: и расскажу тебе
  rationale: Порода хифиль глагола נגד означает сообщить, рассказать или объявить. «Расскажу тебе» естественно передаёт личное сообщение, не добавляя оттенка публичного провозглашения.
- source_word: גְּדֹלוֹת
  choice: о великом
  rationale: Субстантивированное прилагательное обозначает великие вещи или дела. Собирательное «великое» по-русски естественно и сохраняет широту значения без добавления существительного, отсутствующего в еврейском тексте.
- source_word: וּבְצֻרוֹת
  choice: и недоступном
  rationale: Слово связано с образом укреплённого или отрезанного от обычного доступа. «Недоступное» сохраняет эту конкретную смысловую основу лучше, чем более истолковывающее «сокрытое».
- source_word: לֹא יְדַעְתָּם
  choice: чего ты прежде не знал
  rationale: Перфект указывает на то, что названное до этого момента не было известно адресату. «Прежде» естественно выражает этот временной оттенок; собирательное относительное местоимение согласуется с русским «великом и недоступном».
theological_decisions:
- issue: Смысл וּבְצֻרוֹת в обещании божественного откровения
  choice: недоступном
  alternative: сокрытом; укреплённом
  rationale: Контекст говорит о знании, которое Бог сообщит пророку, однако само слово сохраняет образ чего-то укреплённого и потому недоступного. Основной текст передаёт недоступность, не сводя смысл только к тайне; буквальный образ и возможный контекстуальный вариант отмечены в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Форма «воззови» сохранена как понятный торжественный императив; синтаксис остаётся прямым и личным. Собирательные формы «о великом и недоступном» позволяют не добавлять отсутствующее в оригинале существительное.
