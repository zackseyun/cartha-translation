  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה אִם לֹ֥א בְרִיתִ֖/י יוֹמָ֣ם וָ/לָ֑יְלָה חֻקּ֛וֹת שָׁמַ֥יִם וָ/אָ֖רֶץ לֹא שָֽׂמְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/025.yaml
  text: 'Thus says Yahweh: If I have not established my covenant with day and night[a], the fixed order of heaven and earth—'
translation:
  language: ru
  text: 'Так говорит Яхве: «Если бы Я не установил моего завета с днём и ночью и установлений неба и земли, —»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена стандартная пророческая формула в естественной для современного русского языка форме; личное имя יְהוָה передано как «Яхве».
- source_word: אִם לֹא
  choice: Если Я не
  rationale: Условная конструкция сохранена, поскольку её продолжение и следствие находятся в следующем стихе.
- source_word: בְרִיתִי
  choice: Моего завета
  rationale: Основное значение בְּרִית — «завет»; важно сохранить заветную лексику, связывающую этот стих с ближайшим контекстом.
- source_word: יוֹמָם וָלָיְלָה
  choice: с днём и ночью
  rationale: Предлог «с» передаёт представленную в еврейском тексте связь завета с днём и ночью и сохраняет олицетворение природного порядка.
- source_word: חֻקּוֹת
  choice: неизменного порядка
  rationale: В космологическом контексте слово обозначает установленные Богом нормы или закономерности; «неизменный порядок» звучит естественно и передаёт идею предписанной устойчивости.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: неба и земли
  rationale: Сохранён обычный библейский меризм, обозначающий весь сотворённый мир.
- source_word: לֹא שָׂמַתִּי
  choice: не установил
  rationale: Глагол שׂים буквально означает «положить, поставить», а здесь — учредить и закрепить космический порядок.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя Бога.
- issue: Связь «завета» с космическим порядком
  choice: Сохранить выражение «завет с днём и ночью», не заменяя его одним лишь «порядком природы»
  alternative: Передать בְרִית как «установленный порядок»
  rationale: Слово בְּרִית намеренно связывает устойчивость творения с заветами, упомянутыми в контексте; замена устранила бы этот богословский образ.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Незавершённость условного предложения отмечена тире и сохраняет переход к следующему стиху.
