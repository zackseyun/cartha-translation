revisions:
- from: 'Так говорит Яхве: «Если Я не заключил Моего завета с днём и ночью и не установил неизменного порядка неба и земли[a], —»'
  to: 'Так говорит Яхве: «Если бы Я не установил моего завета с днём и ночью и установлений неба и земли, —»'
  rationale: Перевод приведён в соответствие с синтаксической параллельностью еврейского текста и с выбором «established» в английском audit trail. Один глагол «установил» охватывает оба дополнения, тогда как незавершённая условная конструкция и тире сохраняют зависимость от следующего стиха. Примечание перенесено к слову «установлений».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:06:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'В черновике верно переданы имя Яхве, заветная лексика и незавершённость условной формулы. Однако глагол «заключил» неоправданно конкретизирует שָׂם («установил, определил»), а синтаксис с двумя разными глаголами («не заключил ... и не установил») скрывает то, что в еврейском тексте один явный глагол относится к двум параллельным понятиям: завету с днём и ночью и установлениям неба и земли. Английский audit trail также предпочитает «established», а не «made/concluded».'
  naturalness: «Если бы Я не установил ...» с незавершённым тире естественно для современного литературного русского и ясно показывает, что аподосис продолжается в следующем стихе. Строчная форма «моего» нормативна в современном издании и не меняет референции.
  terminology: «Завет» следует сохранить для בְּרִית. Для חֻקּוֹת в основном тексте «установления» точнее воспроизводит образ предписанного Богом космического порядка, не превращая его в абстрактный «неизменный порядок»; альтернативу «уставы» уместно вынести в примечание. «Небо и земля» — адекватная передача меризма.
  issues:
  - severity: medium
    issue: «Не заключил Моего завета»
    rationale: В еврейском имеется лишь один явный глагол שָׂמְתִּי, буквально «поставил/установил», стоящий после слов о небесных и земных установлениях. «Заключил» — специальный юридический глагол, которого источник не требует; он также создаёт два самостоятельных действия вместо параллельной конструкции.
  - severity: low
    issue: «Неизменного порядка» как основной эквивалент חֻקּוֹת
    rationale: Передаёт общий смысл, но сглаживает множественное число и нормативно-установительный оттенок חֻקּוֹת. «Установления» сохраняет этот оттенок и остаётся естественным в космологическом контексте.
  revised_text: 'Так говорит Яхве: «Если бы Я не установил моего завета с днём и ночью и установлений неба и земли, —»'
  revised_footnotes:
  - marker: a
    text: 'Или: «уставов неба и земли»; еврейское слово может обозначать установленные Богом законы или неизменный порядок.'
    reason: Передаёт возможные значения חֻקּוֹת, не устраняя основной перевод и не приписывая тексту более узкий смысл.
  revision_rationale: Перевод приведён в соответствие с синтаксической параллельностью еврейского текста и с выбором «established» в английском audit trail. Один глагол «установил» охватывает оба дополнения, тогда как незавершённая условная конструкция и тире сохраняют зависимость от следующего стиха. Примечание перенесено к слову «установлений».
