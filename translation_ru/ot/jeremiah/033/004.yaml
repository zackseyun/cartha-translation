  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל עַל בָּתֵּי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/עַל בָּתֵּ֖י מַלְכֵ֣י יְהוּדָ֑ה הַ/נְּתֻצִ֕ים אֶל הַ/סֹּלְל֖וֹת וְ/אֶל הֶ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/004.yaml
  text: 'For thus says Yahweh, the God of Israel, concerning the houses of this city and the houses of the kings of Judah that are being torn down for the siege ramps and for the sword:'
translation:
  language: ru
  text: 'Ибо так говорит Яхве, Бог Израиля, о домах этого города и о домах царей Иудеи[a], которые сносят для защиты от осадных валов[b] и меча[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о дворцах царей Иудеи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «осадных насыпей» или «осадных сооружений». Буквально: «к осадным валам»; эта конструкция может указывать на цель сноса домов или на противодействие осадным сооружениям.'
    reason: lexical_and_syntactic_ambiguity
  - marker: c
    text: «Меч» — образное обозначение войны или гибели от оружия.
    reason: figure_of_speech
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт причинно-пояснительную связь с предшествующим контекстом и естественно вводит пророческое разъяснение.
- source_word: כֹה אָמַר
  choice: так говорит
  rationale: Устойчивая пророческая формула; настоящее время естественно для торжественной вестнической речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямой и естественный перевод сопряжённой конструкции.
- source_word: עַל
  choice: о
  rationale: Предлог вводит тему последующего высказывания; краткое русское «о» звучит естественно.
- source_word: בָּתֵּי הָעִיר הַזֹּאת
  choice: о домах этого города
  rationale: Сохраняет структуру исходной фразы и контекстуальную отсылку к Иерусалиму без добавления названия.
- source_word: בָּתֵּי מַלְכֵי יְהוּדָה
  choice: о домах царей Иудеи
  rationale: Сохраняет повтор слова «дома»; в царском контексте возможен смысл «дворцы», отмеченный в сноске.
- source_word: הַנְּתֻצִים
  choice: которые разбирают
  rationale: Страдательное причастие от נתץ описывает происходящее разрушение или разборку построек; русская активная неопределённо-личная конструкция естественна и не называет деятеля.
- source_word: אֶל הַסֹּלְלוֹת
  choice: из-за осадных валов
  rationale: Сохраняет возможную направленность/обусловленность действия осадными сооружениями, не утверждая сверх текста, что дома служили материалом для их строительства.
- source_word: וְאֶל הֶחָרֶב
  choice: и меча
  rationale: Сохраняет еврейский военный образ, в котором меч метонимически обозначает войну или гибель.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя без его замены титулом.
- issue: Связь разрушения домов с осадными валами и мечом
  choice: из-за осадных валов и меча
  alternative: для осадных валов и против меча
  rationale: Еврейское אֶל допускает неоднозначность. Ближайший контекст может указывать на разбор домов как оборонительную меру, однако формулировка не должна однозначно утверждать, что дома разбирали именно на материал для осадных сооружений противника.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Повтор «о домах… и о домах» сохранён как значимый элемент еврейской формулировки; неоднозначная связь אֶל не сведена безоговорочно к назначению материала.
