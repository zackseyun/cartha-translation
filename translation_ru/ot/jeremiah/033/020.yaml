base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/020.yaml
  text: 'Thus says Yahweh: If you can break my covenant with the day and my covenant with the night[a], so that day and night will not be at their appointed time[b],'
translation:
  language: ru
  text: 'Так говорит Яхве: «Если вы сможете нарушить Мой завет с днём и Мой завет с ночью[a], так что дня и ночи не будет в назначенное для них время[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если вы нарушите Мой завет с днём и Мой завет с ночью». В еврейском условном обороте слова «сможете» нет; оно передаёт подразумеваемую в контексте невозможность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, более буквально: «так что не будет дня и ночи в их время».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена традиционная пророческая формула в естественной для современного русского языка форме; тетраграмматон передан личным именем «Яхве».
- source_word: אִם תָּפֵרוּ
  choice: Если вы сможете нарушить
  rationale: Глагол הפר в породе хифиль означает «нарушить, расторгнуть, отменить» завет. «Сможете» передаёт риторическую невозможность условия, явную из контекста, а более формальный вариант отмечен в сноске.
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: «Завет» точно сохраняет юридико-богословский смысл ברית и повторён в обеих параллельных частях.
- source_word: הַיּוֹם וְאֶת בְּרִיתִי הַלָּיְלָה
  choice: с днём и Мой завет с ночью
  rationale: Предлог «с» естественно выражает по-русски заветное отношение; пара «день — ночь» сохраняет образ установленного порядка творения.
- source_word: וּלְבִלְתִּי הֱיוֹת יוֹמָם וָלַיְלָה
  choice: так что день и ночь не будут наступать
  rationale: Конструкция передаёт следствие нарушения. «Наступать» естественно описывает регулярное появление дня и ночи по-русски, не вводя идеи прекращения их существования; более буквальная форма дана в сноске.
- source_word: בְּעִתָּם
  choice: в назначенное им время
  rationale: עֵת обозначает установленное или надлежащее время; «назначенное» подчёркивает упорядоченность, не уточняя сверх текста, кем оно назначено.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; личное имя сохраняет заветный характер высказывания и не заменяет его титулом.
- issue: Риторическая сила условия אִם תָּפֵרוּ
  choice: Если вы сможете нарушить
  alternative: Если вы нарушите
  rationale: Ближайший контекст представляет условие как невозможное и тем самым утверждает непреложность Божьего обещания. При этом формально возможная передача без модального глагола сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены параллелизм, повтор слова «завет» и открывающее условие, продолжающееся в следующем стихе. Начальная кавычка оставлена незакрытой, поскольку предложение и прямая речь продолжаются далее.
