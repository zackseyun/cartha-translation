source:
  edition: WLC
  text: וְ/הָ֣יְתָה לִּ֗/י לְ/שֵׁ֤ם שָׂשׂוֹן֙ לִ/תְהִלָּ֣ה וּ/לְ/תִפְאֶ֔רֶת לְ/כֹ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ אֲשֶׁ֨ר יִשְׁמְע֜וּ אֶת כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֤ר אָֽנֹכִי֙ עֹשֶׂ֣ה אֹתָ֔/ם וּ/פָחֲד֣וּ וְ/רָֽגְז֗וּ עַ֤ל כָּל הַ/טּוֹבָה֙ וְ/עַ֣ל כָּל הַ/שָּׁל֔וֹם אֲשֶׁ֥ר אָֽנֹכִ֖י עֹ֥שֶׂה לָּֽ/הּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/009.yaml
  text: And she will be to me a name of joy[a], a praise and a glory before all the nations of the earth, who will hear of all the good that I am doing for them. And they will fear and tremble because of all the good and because of all the peace that I am bringing to her.
translation:
  language: ru
  text: И станет она для Меня именем радости, хвалой и славой пред всеми народами земли, которые услышат обо всём добре, какое Я делаю для них. И устрашатся они и затрепещут от всего добра и от всего мира[a], который Я дарую ей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благополучия», «процветания». Еврейское слово шалом означает мир, благополучие и целостность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לִּי
  choice: И станет она для Меня
  rationale: Женский род глагола и местоимение לָּהּ в конце стиха указывают на Иерусалим, представленный как женщина; «она» сохраняет это олицетворение.
- source_word: לְשֵׁם שָׂשׂוֹן
  choice: именем радости
  rationale: Сохранён еврейский образ имени как известности или доброй славы; сочетание также передаёт радость, которую восстановленный город вызывает у Бога и среди народов.
- source_word: לִתְהִלָּה וּלְתִפְאֶרֶת
  choice: хвалой и славой
  rationale: «Хвала» прямо передаёт תְהִלָּה, а «слава» — публичный почёт и великолепие, выраженные словом תִפְאֶרֶת.
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ
  choice: пред всеми народами земли
  rationale: «Пред» естественно выражает публичную известность города в глазах всех народов.
- source_word: אֶת כָּל הַטּוֹבָה אֲשֶׁר אָנֹכִי עֹשֶׂה אֹתָם
  choice: обо всём добре, какое Я делаю для них
  rationale: Идиома означает благодеяния, совершаемые Богом для народа; «добро» сохраняет конкретный и собирательный характер выражения.
- source_word: וּפָחֲדוּ וְרָגְזוּ
  choice: И устрашатся они и затрепещут
  rationale: Переданы оба глагола — страх и дрожь. Формулировка не сводит реакцию народов ни только к благоговению, ни только к ужасу.
- source_word: וְעַל כָּל הַשָּׁלוֹם
  choice: и от всего мира[a]
  rationale: «Мир» — основное соответствие שָׁלוֹם; сноска сохраняет более широкий смысл благополучия, целостности и процветания.
- source_word: אֲשֶׁר אָנֹכִי עֹשֶׂה לָּהּ
  choice: который Я дарую ей
  rationale: Буквально Бог «делает» это для неё; при слове «мир» русское «дарую» естественно передаёт благодетельное действие, не меняя смысла.
theological_decisions:
- issue: Характер реакции народов на восстановление Иерусалима
  choice: страх и трепет перед Божьими благодеяниями
  alternative: ужас или политическое смятение
  rationale: Причиной названы Божьи добро и мир, однако сами глаголы допускают сильный страх. Перевод сохраняет эту напряжённость и не уточняет, является ли страх преимущественно благоговейным или пугающим.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Олицетворение Иерусалима сохранено женским местоимением; «пред» и «дарую» поддерживают достоинство стиля без архаизации.
