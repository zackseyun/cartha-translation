  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: повторное обращение слова Яхве к Иеремии, продолжающееся содержание пророка под стражей и ввод последующей речи. «Было обращено к Иеремии» — допустимая литературная передача пророческой формулы «слово Яхве было к Иеремии»; «когда он ещё был» адекватно выражает сопутствующее обстоятельство וְהוּא עוֹדֶנּוּ.'
