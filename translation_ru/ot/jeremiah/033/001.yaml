id: JER.33.1
reference: Jeremiah 33:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֶֽל יִרְמְיָ֖הוּ שֵׁנִ֑ית וְ/הוּא֙ עוֹדֶ֣/נּוּ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/001.yaml
  text: And the word of Yahweh came to Jeremiah a second time while he was still confined in the court of the guard[a], saying,
translation:
  language: ru
  text: 'И слово Яхве было обращено к Иеремии во второй раз, когда он ещё был заключён во дворе стражи[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тюремном дворе». Еврейское выражение, вероятно, обозначает охраняемый двор для задержанных или ограду при караульном помещении.'
    reason: Лексическое значение מַטָּרָה в данном сочетании допускает как акцент на страже, так и на месте заключения.
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה
  choice: И слово Яхве было обращено
  rationale: Пророческая формула передана естественно для современного русского языка; «слово» сохраняет её формальную и богословскую значимость, а «было обращено» ясно выражает направленность речи к пророку.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
- source_word: אֶל יִרְמְיָהוּ
  choice: к Иеремии
  rationale: Предлог אֶל обозначает направленность слова к пророку; это нормативная русская конструкция.
- source_word: שֵׁנִית
  choice: во второй раз
  rationale: Передаёт точную последовательность, выраженную наречием, яснее, чем более общее «снова».
- source_word: וְהוּא עוֹדֶנּוּ
  choice: когда он ещё был
  rationale: Естественно передаёт сопутствующее временное обстоятельство и значение продолжавшегося состояния.
- source_word: עָצוּר
  choice: заключён
  rationale: Страдательное причастие означает, что Иеремию удерживали и ограничивали в свободе; выбор не уточняет сверх текста его формальный правовой статус.
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: во дворе стражи
  rationale: חָצֵר означает двор, а מַטָּרָה здесь связано с охраняемым местом содержания; буквальная институциональная формулировка сохраняет некоторую неопределённость устройства этого места.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит последующую прямую речь в русском языке и функционально передаёт стандартное еврейское לֵאמֹר.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой формулы. Синтаксис слегка осовременен посредством «было обращено»; двоеточие вместо буквального «говоря» естественно связывает стих с последующей прямой речью.
