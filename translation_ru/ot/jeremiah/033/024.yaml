reference: Jeremiah 33:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֲ/ל֣וֹא רָאִ֗יתָ מָֽה הָ/עָ֤ם הַ/זֶּה֙ דִּבְּר֣וּ לֵ/אמֹ֔ר שְׁתֵּ֣י הַ/מִּשְׁפָּח֗וֹת אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה בָּ/הֶ֖ם וַ/יִּמְאָסֵ֑/ם וְ/אֶת עַמִּ/י֙ יִנְאָצ֔וּ/ן מִֽ/הְי֥וֹת ע֖וֹד גּ֥וֹי לִ/פְנֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/024.yaml
  text: Have you not seen what this people have spoken[a], saying, ‘The two families that Yahweh chose—he has rejected them’? Thus they despise my people[c][b], so that they should no longer be a nation before them.
translation:
  language: ru
  text: 'Разве ты не видел, что сказал этот народ: «Два рода[a], которые избрал Яхве, — Он отверг их»? И они презирают Мой народ, так что в их глазах он уже не народ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «две семьи», «два клана» или «два дома». Еврейский текст не уточняет, какие именно две группы имеются в виду.'
    reason: Сохранение лексической и референциальной неоднозначности מִשְׁפָּחוֹת.
  - marker: b
    text: 'Буквально: «от того, чтобы ещё быть народом перед ними». Вероятно, речь идёт о презрительной оценке — «в их глазах» или «по их мнению», а не об утверждении, что народ объективно перестал существовать.'
    reason: Пояснение буквального смысла и вероятной силы לִפְנֵיהֶם без снятия синтаксической неоднозначности.
lexical_decisions:
- source_word: הֲלוֹא רָאִיתָ
  choice: Разве ты не видел
  rationale: Риторический вопрос обращён к одному лицу и предполагает утвердительный ответ; эта формулировка естественна для современного русского языка.
- source_word: הָעָם הַזֶּה דִּבְּרוּ לֵאמֹר
  choice: что говорит этот народ
  rationale: В еврейском подлежащее стоит в единственном числе, а сказуемое — во множественном, поскольку речь идёт о людях, составляющих народ. Русское собирательное согласование в единственном числе передаёт смысл естественно; отдельное «говоря» избыточно.
- source_word: שְׁתֵּי הַמִּשְׁפָּחוֹת
  choice: два рода
  rationale: מִשְׁפָּחָה может обозначать семью, род или клан. «Два рода» сохраняет неопределённость относительно конкретных групп и звучит уместно в данном контексте.
- source_word: אֲשֶׁר בָּחַר יְהוָה בָּהֶם
  choice: которые избрал Яхве
  rationale: Глагол בחר с ב здесь идиоматически означает избрание. Имя יהוה передано как «Яхве», то есть как личное имя, а не титул.
- source_word: וַיִּמְאָסֵם
  choice: Он отверг их
  rationale: מָאַס выражает отвержение или отказ; совершенный вид русского глагола передаёт завершённость действия в цитируемом утверждении.
- source_word: וְאֶת עַמִּי יִנְאָצוּן
  choice: И они с презрением относятся к Моему народу
  rationale: נָאַץ означает презирать, отвергать с презрением. Развёрнутая формулировка ясно передаёт отношение говорящих и не смешивает его с предшествующим מָאַס.
- source_word: מִהְיוֹת עוֹד גּוֹי לִפְנֵיהֶם
  choice: уже не считая его народом в своих глазах
  rationale: 'Буквально: «чтобы/от того, чтобы ещё быть народом перед ними». Контекст указывает на оценку презирающих людей; «в своих глазах» естественно передаёт לִפְנֵיהֶם и не утверждает объективного прекращения существования народа.'
theological_decisions:
- issue: Кого обозначают «два рода»
  choice: Референты не названы в основном тексте.
  alternative: Израиль и Иуда либо дом Давида и левитское священство.
  rationale: Еврейский текст этого стиха прямо не определяет два рода. Называть их означало бы разрешить спорный вопрос посредством перевода.
- issue: Статус Божьего народа в заключительной части
  choice: 'Фраза передана как презрительная оценка людей: «не считая его народом в своих глазах».'
  alternative: «Чтобы он больше не был народом перед ними».
  rationale: Так сохраняется связь с глаголом «относятся с презрением» и не создаётся впечатление, будто Бог подтверждает объективное прекращение национального существования Своего народа.
- issue: Высказывание об отвержении
  choice: Слова «Он отверг их» оставлены внутри цитаты народа.
  alternative: Передать их как утверждение самого пророка.
  rationale: Синтаксис показывает, что это содержание речи «этого народа», а не подтверждённое Богом суждение.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Сохранено единственное число обращения к пророку и личное имя «Яхве». Заглавные буквы в местоимениях «Он», «Моему» применены по принятой русской религиозно-издательской норме.
