base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/002.yaml
  text: 'Thus says Yahweh[a], who made it[c][b], Yahweh who formed it to establish it—Yahweh is his name:'
translation:
  language: ru
  text: 'Так говорит Яхве, сотворивший её[a], Яхве, образовавший её, чтобы утвердить её[b]; Яхве — имя Его:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские причастия могут также передавать продолжающееся или характерное действие: «творящий её… образующий её».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте местоименные суффиксы имеют женский род («её»), но их референт в самом стихе прямо не назван.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного русского языка формула пророческого провозглашения, сохраняющая торжественный регистр и настоящее время речевого акта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя YHWH транслитерацией, а не заменяет его титулом; все три употребления имени в стихе сохранены.
- source_word: עֹשָׂהּ
  choice: совершающий это
  rationale: Причастие עשה допускает значение «делающий/совершающий». Указательное «это» не вводит не названный в стихе референт и естественнее по-русски, чем местоимение женского рода без явного антецедента.
- source_word: יוֹצֵר אוֹתָהּ
  choice: придающий этому форму
  rationale: Передаёт יצר как целенаправленное формирование, сохраняя связь с тем же неуточнённым объектом.
- source_word: לַהֲכִינָהּ
  choice: чтобы прочно утвердить это
  rationale: Порода hифиль глагола כון выражает установление, упрочение или приведение в устойчивое состояние; наречие «прочно» делает этот оттенок ясным по-русски.
- source_word: יְהוָה שְׁמוֹ
  choice: Яхве — Его имя
  rationale: Сохраняет торжественное назывное утверждение и порядок смысловых компонентов еврейской фразы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В тексте непосредственно стоит Тетраграмматон; транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: Неуказанный референт суффиксов женского рода
  choice: Передать нейтральным «это», не называя референт
  alternative: «её»; добавление «землю», «город» или иного существительного
  rationale: Еврейские формы имеют суффиксы 3-го лица женского рода, однако сам стих не называет их референт. Конкретизация внесла бы толкование в основной текст; примечание сохраняет грамматическую особенность оригинала.
- issue: Временной аспект причастий עֹשָׂהּ и יוֹצֵר
  choice: 'Настоящее, характеризующее действие: «совершающий… придающий»'
  alternative: 'Результативно-прошедшее: «сотворивший… придавший»'
  rationale: Еврейские причастия могут описывать текущее или характерное действие, но контекст допускает и результативное понимание; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Повтор имени «Яхве» воспроизводит риторическую структуру оригинала. Двоеточие в конце сохранено, поскольку стих вводит последующее повеление.
