  text: גַּם זֶ֣רַע יַעֲקוֹב֩ וְ/דָוִ֨ד עַבְדִּ֜/י אֶמְאַ֗ס מִ/קַּ֤חַת מִ/זַּרְע/וֹ֙ מֹֽשְׁלִ֔ים אֶל זֶ֥רַע אַבְרָהָ֖ם יִשְׂחָ֣ק וְ/יַעֲקֹ֑ב כִּֽי אשוב אֶת שְׁבוּתָ֖/ם וְ/רִחַמְתִּֽי/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/026.yaml
  text: then I would also reject the offspring of Jacob and of David my servant[a], not taking from his offspring rulers over the offspring of Abraham, Isaac, and Jacob[b]. For I will restore their fortunes and have compassion on them.
translation:
  language: ru
  text: то отверг бы Я и потомство Иакова и Давида, раба Моего,[a] и не брал бы из его потомства правителей над потомством Авраама, Исаака и Иакова. Ибо Я восстановлю их благополучие[b] и помилую их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семя Иакова»; далее в стихе также «семя» вместо «потомство». Еврейское זֶרַע — собирательное существительное в единственном числе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возвращу их из плена»; возможно также: «верну их изгнанников». Еврейское выражение может означать как возвращение из изгнания, так и восстановление благополучия в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: то ... и
  rationale: Частица продолжает аподосис нереального условия из предыдущего стиха; сочетание «то ... и» естественно передаёт следствие и добавочное значение.
- source_word: זֶרַע יַעֲקוֹב
  choice: потомство Иакова
  rationale: זֶרַע — собирательное существительное в единственном числе; «потомство» сохраняет эту форму и звучит естественно по-русски.
- source_word: וְדָוִד עַבְדִּי
  choice: и Давида, раба Моего
  rationale: Давид координируется с потомством Иакова как объект глагола «отверг бы»; сохранён заветный титул «раб Мой».
- source_word: אֶמְאַס
  choice: отверг бы Я
  rationale: Модальная форма передаёт зависимость от нереального условия предыдущего стиха; «отвергнуть» точнее контекстуального значения, чем эмоционально более сильное «презреть».
- source_word: מִקַּחַת
  choice: и не брал бы
  rationale: Инфинитив с מ раскрывает следствие или содержание отвержения; русская личная конструкция естественна и сохраняет условную модальность.
- source_word: מִזַּרְעוֹ
  choice: из его потомства
  rationale: Местоименный суффикс мужского рода единственного числа естественнее всего относится к ближайшему антецеденту — Давиду.
- source_word: מֹשְׁלִים
  choice: правителей
  rationale: Причастие во множественном числе обозначает людей, осуществляющих власть; «правители» передаёт это кратко и ясно.
- source_word: אֶל זֶרַע אַבְרָהָם יִשְׂחָק וְיַעֲקֹב
  choice: над потомством Авраама, Исаака и Иакова
  rationale: При משל предлог אֶל обозначает объект или сферу правления; по-русски отношение естественно выражается предлогом «над».
- source_word: כִּי
  choice: Но
  rationale: В данном контексте כִּי вводит решительное опровержение гипотетического отвержения через обещание восстановления. Русское «но» ясно передаёт логический контраст, не превращая условный вывод в утверждение.
- source_word: אשוב אֶת שְׁבוּתָם
  choice: Я восстановлю их благополучие
  rationale: Идиома может обозначать как возвращение из плена, так и более широкое восстановление прежнего положения; основной текст сохраняет широкий смысл, а более узкие варианты отмечены в сноске.
- source_word: וְרִחַמְתִּים
  choice: и помилую их
  rationale: רחם выражает сострадательное милосердие; «помилую» — естественное, ёмкое и достойное русское соответствие.
theological_decisions:
- issue: Условная сила, перенесённая из предыдущего стиха
  choice: 'Глаголы гипотетического следствия переданы с частицей «бы»: «отверг бы», «не брал бы».'
  alternative: 'Передать простым будущим временем: «отвергну», «не буду брать».'
  rationale: Стих синтаксически и логически завершает условную конструкцию предыдущего стиха. Простое будущее могло бы ошибочно прозвучать как обещание отвержения.
- issue: Референт выражения «его потомство»
  choice: Местоимение отнесено к Давиду.
  alternative: Отнести его к Иакову или к Израилю как коллективному целому.
  rationale: Давид — ближайший антецедент мужского рода единственного числа; тема правителей из его рода соответствует контексту обетования дому Давида.
- issue: Связь כִּי с предшествующим нереальным условием
  choice: Передано контрастным «Но», вводящим действительное обещание восстановления.
  alternative: Передать причинным «Ибо» или усилительным «ведь».
  rationale: Буквально כִּי допускает причинное значение, однако в русском «ибо» после гипотетического «отверг бы» может создать ложную причинную связь. «Но» сохраняет богословское напряжение между невозможностью отвержения и несомненностью милости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Инверсия «отверг бы Я» поддерживает достоинство речи и ясно связывает стих с условием в предыдущем контексте. Заглавные местоимения при обращении Бога к Себе сохранены как традиционная русская издательская норма.
