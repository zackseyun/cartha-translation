  text: כֹּֽה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ ע֞וֹד יִֽהְיֶ֣ה בַּ/מָּק֣וֹם הַ/זֶּ֗ה הֶ/חָרֵ֛ב מֵֽ/אֵין אָדָ֥ם וְ/עַד בְּהֵמָ֖ה וּ/בְ/כָל עָרָ֑י/ו נְוֵ֣ה רֹעִ֔ים מַרְבִּצִ֖ים צֹֽאן־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/012.yaml
  text: 'Thus says Yahweh of hosts: Yet again there will be in this place[a], which is desolate, without man or beast, and in all its cities, a pasture of shepherds[c][b], where they make flocks lie down.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: снова будет в этом месте[a], опустошённом, без людей и скота[b], и во всех его городах пастбище[c], где пастухи укладывают стада на отдых.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ещё будет», «ещё раз будет»; עוֹד может означать «ещё», «снова», «вновь».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение «без людей и скота» — устойчивая формула полного обезлюдения и запустения.
    reason: cultural_note
  - marker: c
    text: 'Или: «обиталище пастухов», «место пребывания пастухов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя Бога и широкий смысл צְבָאוֹת, не уточняя, идёт ли речь о небесных или земных воинствах.
- source_word: עוֹד יִהְיֶה
  choice: ещё будет
  rationale: Передаёт обещание нового появления после запустения; краткая русская формула сохраняет оттенки «снова» и «вновь».
- source_word: בַּמָּקוֹם הַזֶּה הֶחָרֵב
  choice: на этом месте, ныне опустошённом
  rationale: Естественно передаёт указание на конкретное место и его текущее состояние; «ныне» проясняет контраст с обещанным восстановлением, не меняя временного смысла контекста.
- source_word: מֵאֵין אָדָם וְעַד בְּהֵמָה
  choice: где нет ни людей, ни скота
  rationale: Современная и ясная передача устойчивой формулы полного обезлюдения; אָדָם здесь обозначает людей вообще, а בְּהֵמָה — домашний скот.
- source_word: וּבְכָל עָרָיו
  choice: и во всех его городах
  rationale: Местоименный суффикс сохранён; он относится к этой местности или краю, в состав которого входят города.
- source_word: נְוֵה רֹעִים
  choice: пастбище пастухов
  rationale: В пастушеском контексте נְוֵה естественно означает пастбище или место пребывания; конструкция с родительным падежом сохраняет связь с רֹעִים.
- source_word: מַרְבִּצִים צֹאן
  choice: укладывающих стада на отдых
  rationale: 'Передаёт каузативное значение причастия: пастухи устраивают стада на лежбище и покой; множественное «стада» естественно выражает собирательное צֹאן.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет различие между личным именем Бога и титулом, не вводя конфессионально обусловленного замещения.
- issue: Значение формулы מֵאֵין אָדָם וְעַד בְּהֵמָה
  choice: где нет ни людей, ни скота
  alternative: без человека и скота
  rationale: Формула описывает полное запустение; множественное «людей» в современном русском ясно передаёт собирательное значение אָדָם и не придаёт стиху дополнительного богословского смысла.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим тоном. Порядок фразы по возможности следует еврейскому тексту, при этом синтаксис сделан естественным для русского читателя.
