source:
  edition: WLC
  text: כִּי כֹ֖ה אָמַ֣ר יְהוָ֑ה לֹֽא יִכָּרֵ֣ת לְ/דָוִ֔ד אִ֕ישׁ יֹשֵׁ֖ב עַל כִּסֵּ֥א בֵֽית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/017.yaml
  text: 'For thus says Yahweh: David shall never lack a man to sit on the throne of the house of Israel[a][b].'
translation:
  language: ru
  text: 'Ибо так говорит Яхве: у Давида никогда не переведётся человек, который будет сидеть на престоле дома Израиля[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не будет отсечён у Давида человек, сидящий на престоле дома Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный более краткий перевод: «на престоле Израиля». В еврейском тексте буквально: «дома Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего обещания; «ибо» естественно передаёт пояснительную связь и сохраняет достойный пророческий регистр.
- source_word: כֹה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохранена обычная пророческая формула в настоящем времени, близкая к форме и функции еврейского выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул, что сохраняет заветный характер формулы.
- source_word: לֹא יִכָּרֵת לְדָוִד
  choice: у Давида никогда не переведётся
  rationale: Буквально глагол означает «не будет отсечён», но в сочетании с לְדָוִד и אִישׁ это идиома отсутствия или прекращения представителей династии. Русское «не переведётся» естественно передаёт непрерывность обещанной линии.
- source_word: אִישׁ
  choice: человек
  rationale: Сохранено прямое значение единственного числа без более узкого толкования «потомок». В контексте царского престола речь идёт о мужчине, однако русское «человек» позволяет избежать неестественного оборота «не переведётся мужчина».
- source_word: יֹשֵׁב
  choice: который будет сидеть
  rationale: Еврейское причастие обозначает постоянную царскую функцию. Будущее время в русском согласует эту функцию с обещанием, не заменяя образ «сидеть» толковательным «царствовать».
- source_word: עַל כִּסֵּא
  choice: на престоле
  rationale: Сохранён конкретный образ царского престола; определённость естественно выражена русской формой существительного в данном контексте.
- source_word: בֵית יִשְׂרָאֵל
  choice: дома Израиля
  rationale: Полностью сохранено заветно-национальное выражение «дом Израиля», а не упрощённое «Израиля».
theological_decisions:
- issue: Династическое обещание Давиду
  choice: Формулировка обещает непрерывность царской линии Давида, не уточняя в самом стихе исторический или мессианский способ исполнения.
  alternative: Истолковать текст либо только как обещание непосредственной исторической преемственности, либо исключительно как предсказание об одном окончательном Мессианском Царе.
  rationale: Еврейский текст говорит о человеке, сидящем на престоле дома Израиля. Перевод сохраняет династическую формулировку и не разрешает заложенное в ней богословское напряжение за читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Оборот «никогда не переведётся» понятен современному читателю и передаёт еврейскую идиому без излишней буквальности; образ престола и выражение «дом Израиля» сохранены.
