id: JER.33.14
reference: Jeremiah 33:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וַ/הֲקִֽמֹתִי֙ אֶת הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבַּ֛רְתִּי אֶל בֵּ֥ית יִשְׂרָאֵ֖ל וְ/עַל בֵּ֥ית יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/014.yaml
  text: Look[a], days are coming, declares Yahweh, when I will fulfill the good word that I spoke to the house of Israel and the house of Judah.
translation:
  language: ru
  text: Вот, наступают дни, — возвещает Яхве, — когда Я исполню то доброе слово[a], которое Я сказал о доме Израиля и о доме Иуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то благое обещание». Буквально: «то доброе слово».'
    reason: Лексема דָּבָר означает «слово, дело, нечто»; в контексте исполнения сказанного она имеет смысл обещания, однако основной текст сохраняет буквальную формулировку.
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественная для современного литературного русского вводная частица, сохраняющая функцию привлечения внимания в пророческом возвещении.
- source_word: יָמִים בָּאִים
  choice: наступают дни
  rationale: Устойчивое и достойное выражение будущего времени; передаёт распространённую пророческую формулу без излишней архаизации.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт весомую формулу божественного изречения; имя יהוה транслитерировано как «Яхве».
- source_word: וַהֲקִמֹתִי
  choice: Я исполню
  rationale: В породе хифиль глагол קום с объектом «слово» означает сделать сказанное действительным, привести его в исполнение.
- source_word: הַדָּבָר הַטּוֹב
  choice: то доброе слово
  rationale: «Слово» сохраняет прямое значение דבר и лексическую связь с последующим «сказал», не подменяя его более истолковывающим «обещанием».
- source_word: דִּבַּרְתִּי
  choice: Я сказал
  rationale: Естественно передаёт обычное значение глагола דבר и сохраняет отличие между самим высказыванием и его исполнением.
- source_word: אֶל בֵּית יִשְׂרָאֵל וְעַל בֵּית יְהוּדָה
  choice: о доме Израиля и о доме Иуды
  rationale: Разные еврейские предлоги אֶל и עַל здесь относятся к содержанию благого слова; единое русское «о» естественно охватывает оба параллельных наименования, сохраняя образ «дома».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон; форма «Яхве» прямо передаёт личное имя, не заменяя его титулом.
- issue: Значение הַדָּבָר הַטּוֹב
  choice: доброе слово
  alternative: благое обещание
  rationale: Контекст явно имеет характер обещания, но буквальное «слово» сохраняет смысловую широту и связь с דִּבַּרְתִּי («сказал»), не устраняя подлинную лексическую неоднозначность.
- issue: Отношение сказанного к Израилю и Иуде
  choice: о доме Израиля и о доме Иуды
  alternative: дому Израиля и дому Иуды
  rationale: 'Предлоги в еврейском различаются: אֶל перед первым домом и עַל перед вторым. В данном контексте «о» естественно понимает оба народа как предмет благого слова, тогда как дательный падеж подчёркивал бы адресатов.'
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Вот» и «наступают дни» сохраняют возвышенность без устаревшего синтаксиса; повтор «дом Израиля… дом Иуды» удерживает библейский национально-заветный образ.
