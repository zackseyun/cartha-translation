  text: And the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: ru
  text: 'И слово Яхве[a] пришло к Иеремии:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH); также передаётся как «Иегова».
    reason: Указывает еврейскую форму Божьего имени и известный альтернативный вариант его передачи.
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма глагола היה вводит очередное пророческое откровение; традиционная, но понятная формула «И было слово…» близко передаёт еврейскую конструкцию.
- source_word: דְּבַר
  choice: слово
  rationale: В устойчивой пророческой формуле דְּבַר יְהוָה слово «слово» сохраняет смысл Божьего речения и не добавляет толкования, присущего варианту «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает адресата речения; в русской формуле «слово было к кому-либо» естественно употребляется «к».
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Использована общепринятая русская библейская форма имени с дательным падежом после предлога «к».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь. В современном русском эту функцию естественно и без смысловой потери выражает двоеточие, а буквальное «говоря» звучало бы тяжеловесно.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя, а не титул. «Яхве» — современная научно обоснованная русская передача; примечание сохраняет сведения о еврейском написании и другом традиционном варианте.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой пророческой формулы. Двоеточие естественно вводит речь, которая следует в следующем стихе; имя «Яхве» пояснено сноской.
