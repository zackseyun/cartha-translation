  text: בָּאִ֗ים לְ/הִלָּחֵם֙ אֶת הַ/כַּשְׂדִּ֔ים וּ/לְ/מַלְאָ/ם֙ אֶת פִּגְרֵ֣י הָ/אָדָ֔ם אֲשֶׁר הִכֵּ֥יתִי בְ/אַפִּ֖/י וּ/בַ/חֲמָתִ֑/י וַ/אֲשֶׁ֨ר הִסְתַּ֤רְתִּי פָנַ/י֙ מֵ/הָ/עִ֣יר הַ/זֹּ֔את עַ֖ל כָּל רָעָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/005.yaml
  text: They are coming to fight against the Chaldeans but only to fill them with the corpses of the men whom I struck down in my anger and in my wrath[c][b][a], and from this city I have hidden my face because of all their evil.
translation:
  language: ru
  text: Они приходят сражаться с халдеями и наполнять их[a] трупами людей, которых Я поразил в Моём гневе и Моей ярости, и от этого города Я скрыл лицо Моё из-за всего их зла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и наполнять их». Местоимение «их», вероятно, относится к домам или осадным укреплениям, упомянутым в предыдущем стихе.'
    reason: Поясняет неявный множественный референт местоименного суффикса, сохраняя его в основном тексте.
lexical_decisions:
- source_word: בָּאִים
  choice: они идут
  rationale: Причастие qal мужского рода множественного числа передаёт происходящее или близкое действие; настоящее время естественно звучит по-русски и сохраняет неопределённый субъект, восстанавливаемый из контекста.
- source_word: לְהִלָּחֵם אֶת הַכַּשְׂדִּים
  choice: сражаться с халдеями
  rationale: Инфинитив выражает цель или направленное действие; русское «сражаться с» ясно обозначает противников.
- source_word: הַכַּשְׂדִּים
  choice: халдеями
  rationale: Сохранён этноним исходного текста, а не исторически поясняющее «вавилонянами».
- source_word: וּלְמַלְאָם
  choice: но лишь наполнят их
  rationale: 'Буквально стоит «и наполнить их» с местоименным суффиксом мужского рода множественного числа. В контексте оборот имеет мрачный результативный смысл: выступающие на бой в итоге наполнят упомянутые ранее строения телами. Неясный референт «их» сохранён и пояснён в сноске.'
- source_word: פִּגְרֵי הָאָדָם
  choice: трупами людей
  rationale: Пִגְרֵי обозначает мёртвые тела, особенно погибших насильственной смертью; собирательное הָאָדָם здесь естественно передаётся словом «людей», не ограничивающим речь только взрослыми мужчинами.
- source_word: אֲשֶׁר הִכֵּיתִי
  choice: которых Я поразил
  rationale: Глагол נכה означает «ударить, поразить» и в данном контексте подразумевает смерть; «поразил» сохраняет образ исходного глагола.
- source_word: בְאַפִּי וּבַחֲמָתִי
  choice: в гневе и ярости Моей
  rationale: Сохранены два близких, но различимых обозначения Божьего гнева и их усилительное сочетание.
- source_word: וַאֲשֶׁר הִסְתַּרְתִּי פָנַי מֵהָעִיר הַזֹּאת
  choice: Я скрыл лицо Моё от этого города
  rationale: Сохранена библейская антропоморфная идиома сокрытия лица как лишения благоволения или присутствия; предлог מִן передан словом «от».
- source_word: עַל כָּל רָעָתָם
  choice: за всё их зло
  rationale: עַל имеет причинное значение, а רָעָה обозначает нравственное зло; «за» естественно выражает основание суда.
theological_decisions:
- issue: Прямое приписывание суда Богу
  choice: «которых Я поразил в гневе и ярости Моей»
  alternative: Смягчить формулировку и представить гибель как безличное бедствие
  rationale: Еврейский текст прямо передаёт речь Бога и приписывает Ему действие суда; перевод не должен устранять эту богословскую напряжённость.
- issue: Антропоморфная идиома сокрытия лица
  choice: «Я скрыл лицо Моё от этого города»
  alternative: «Я оставил этот город» или иное истолкование идиомы
  rationale: Буквальный образ значим в библейском языке и допускает понимание как удаления Божьего благоволения или присутствия без навязывания одного толкования.
- issue: Смысл связи וּלְמַלְאָם с первым инфинитивом
  choice: «но лишь наполнят» как мрачный результат выступления на бой
  alternative: «и наполнить» как простая координация двух целей
  rationale: Союз буквально допускает простое соединение, однако контекст поддерживает результативно-контрастный смысл. Поскольку связь синтаксически неоднозначна, буквальная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены резкость образа трупов, прямое Божье «Я» и идиома «скрыл лицо». Заглавные буквы в местоимениях Божьей речи употреблены согласно принятой русской библейской традиции; смысл от них не зависит.
