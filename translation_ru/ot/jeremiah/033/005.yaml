revisions:
- from: Они идут сражаться с халдеями, но лишь наполнят их трупами людей, которых Я поразил в гневе и ярости Моей.[a][b] Я скрыл лицо Моё от этого города за всё их зло.
  to: Они приходят сражаться с халдеями и наполнять их[a] трупами людей, которых Я поразил в Моём гневе и Моей ярости, и от этого города Я скрыл лицо Моё из-за всего их зла.
  rationale: Убраны интерпретирующие «но лишь» и будущее время «наполнят», чтобы сохранить координацию двух еврейских инфинитивов. Уточнено, что оба слова для гнева относятся к говорящему Богу, и причинная связь последней части передана без двусмысленного оттенка воздаяния. Сноска оставлена только там, где она нужна для неявного референта «их».
