base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/016.yaml
  text: 'In those days Judah will be saved[a], and Jerusalem will dwell securely[b]; and this is what she will be called: ‘Yahweh is our righteousness.’'
translation:
  language: ru
  text: 'В те дни Иуда будет спасён, и Иерусалим будет жить в безопасности; вот имя, которым назовут Иерусалим: «Яхве — наша праведность»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: В Иер. 23:6 близкое по форме именование «Яхве — наша праведность» относится к грядущему царю из рода Давида; здесь грамматика относит его к Иерусалиму, вероятно перекликаясь с тем прежним обещанием.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Естественно передаёт устойчивую пророческую формулу о будущем времени восстановления.
- source_word: תִּוָּשַׁע
  choice: будет спасён
  rationale: Сохраняет страдательную форму нифаля и широкий смысл Божьего спасения или избавления.
- source_word: תִּשְׁכּוֹן לָבֶטַח
  choice: будет жить в безопасности
  rationale: Передаёт и постоянное, мирное пребывание, выраженное глаголом שׁכן, и значение защищённости в לָבֶטַח; формулировка естественна для современного русского языка.
- source_word: וְזֶה אֲשֶׁר יִקְרָא לָהּ
  choice: И вот как назовут его
  rationale: Естественно передаёт еврейскую формулу наречения. Местоименный суффикс женского рода относится к Иерусалиму; в русском употреблено «его», поскольку название города грамматически мужского рода.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: צִדְקֵנוּ
  choice: наша праведность
  rationale: Сохраняет значение существительного צֶדֶק с суффиксом первого лица множественного числа; тире естественно выражает подразумеваемую именную связку в русском.
theological_decisions:
- issue: К кому относится формула наречения в сопоставлении с Иеремией 23:6
  choice: В данном стихе название относится к Иерусалиму
  alternative: Считать эту формулу непосредственно титулом грядущего царя из рода Давида
  rationale: Суффикс женского рода לָהּ грамматически указывает на Иерусалим. Созвучие с Иеремией 23:6 существенно, но не должно отменять синтаксис данного стиха; оно отмечено в сноске.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Будет жить в безопасности» выбрано вместо более архаичного «будет обитать безопасно». Грамматический род Иерусалима в русском требует формы «его», хотя в еврейском местоименный суффикс женского рода согласован с названием города.
