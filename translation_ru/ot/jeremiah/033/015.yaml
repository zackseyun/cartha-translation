  variant: modern literary Russian
source:
  edition: WLC
  text: בַּ/יָּמִ֤ים הָ/הֵם֙ וּ/בָ/עֵ֣ת הַ/הִ֔יא אַצְמִ֥יחַ לְ/דָוִ֖ד צֶ֣מַח צְדָקָ֑ה וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/015.yaml
  text: In those days and at that time I will cause a righteous Branch to sprout for David[b][a], and he will execute justice and righteousness in the land.
translation:
  language: ru
  text: В те дни и в то время Я произращу для Давида праведную Отрасль[b][a], и он будет вершить суд и праведность в земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Отрасль праведности»; возможно также: «справедливую Отрасль».'
    reason: lexical_alternative
  - marker: b
    text: Образ «Отрасли», вероятно, перекликается с обещанием о правителе из рода Давида в Иер. 23:5.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Естественно передаёт стандартную временную формулу, сохраняя предлог и указательное значение.
- source_word: וּבָעֵת הַהִיא
  choice: и в то время
  rationale: Сохраняет параллельное временное выражение исходного текста, не объединяя его с предыдущим.
- source_word: אַצְמִיחַ
  choice: Я взращу
  rationale: Передаёт каузативную форму глагола צמח и сохраняет растительный образ; по-русски звучит естественнее буквального «заставлю произрасти».
- source_word: לְדָוִד
  choice: для Давида
  rationale: Сохраняет значение отношения или предназначения, не добавляя отсутствующего в тексте выражения «дом Давида».
- source_word: צֶמַח
  choice: Отрасль
  rationale: «Отрасль» сохраняет образ нового побега и традиционно пригодна для обозначения обещанного правителя из рода Давида; прописная буква отмечает вероятное титульное употребление, не заменяя метафору толкованием.
- source_word: צְדָקָה
  choice: праведную
  rationale: Естественно передаёт зависимое определение при צמח; неоднозначность между качественным значением и конструкцией «отрасль праведности» отмечена в сноске.
- source_word: וְעָשָׂה
  choice: и Он будет вершить
  rationale: Будущее время обусловлено контекстом пророческого обещания; «вершить» идиоматично сочетается с «судом» и сохраняет деятельный смысл עשה.
- source_word: מִשְׁפָּט
  choice: суд
  rationale: В контексте царского правления обозначает справедливое судебное и управленческое действие; «вершить суд» — естественное русское сочетание.
- source_word: וּצְדָקָה
  choice: и праведность
  rationale: Сохраняет характерную библейскую пару двух разных понятий — משפט и צדקה — без сведения обоих к слову «справедливость».
- source_word: בָּאָרֶץ
  choice: в этой земле
  rationale: Контекст указывает прежде всего на землю Иудеи/Израиля, а не на весь мир; указательное «этой» по-русски помогает передать определённость артикля без пояснительной вставки.
theological_decisions:
- issue: Вероятное мессианское и царское значение צֶמַח
  choice: Передать как «Отрасль» с прописной буквы.
  alternative: «отрасль», «побег» или «росток» со строчной буквы.
  rationale: Близкая параллель Иер 23:5 связывает образ с обещанным правителем из рода Давида. Прописная буква осторожно отмечает титульную функцию, тогда как сноска указывает на перекличку, не делая её явной вставкой в стих.
- issue: Временное значение וְעָשָׂה
  choice: 'Передать будущим временем: «будет вершить».'
  alternative: Формально передать совершенным или прошедшим временем.
  rationale: В пророческом контексте форма продолжает будущее обещание, начатое אַצְמִיחַ; прошедшее время ввело бы русского читателя в заблуждение.
- issue: Соотношение מִשְׁפָּט и צְדָקָה
  choice: Сохранить различие как «суд и праведность».
  alternative: «справедливость и правду» или «правосудие и справедливость».
  rationale: Так сохраняются два отдельных богословски значимых термина и напряжение между справедливым правлением и праведностью, без их синонимического слияния.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены парные временные формулы, растительная метафора и различие между «судом» и «праведностью». Местоимение «Он» дано с прописной буквы в соответствии с вероятным личным и титульным референтом «Отрасли», без добавления имени или явного конфессионального истолкования.
