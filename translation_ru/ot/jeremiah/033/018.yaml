review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: обещана непрерывность левитского священнического служения перед Богом. Однако расположение «предо Мной» в исходном русском тексте может ошибочно характеризовать самого человека, а не его культовое служение; кроме того, «совершает жертвоприношение» менее естественно, чем конкретное «приносит жертву».'
  naturalness: Текст в целом литературен, но «никогда не переведётся предо Мной человек» синтаксически тяжеловесно и допускает неясную связь обстоятельства. Перенос «предо Мной» к ряду служебных действий делает фразу яснее и естественнее.
  terminology: «Священники-левиты», «всесожжение» и «хлебное приношение» удачны и сохраняют культовую терминологию. Для זֶבַח предпочтительно «приносит жертву», а не абстрактное «совершает жертвоприношение». Текстологическая сноска корректна и её якорь сохранён.
  issues:
  - severity: low
    issue: Неоднозначная связь «предо Мной»
    rationale: В еврейском מִלְּפָנַי относится к постоянному наличию священнослужителя в Божьем присутствии. В русском варианте его позиция после «не переведётся» может быть прочитана как характеристика человека; размещение при служении яснее передаёт культовый контекст.
  - severity: low
    issue: Абстрактное «совершает жертвоприношение»
    rationale: זֶבַח — жертва/жертвенное заклание; «приносит жертву» более естественно по-русски и лучше согласуется с конкретными действиями в предшествующем ряду.
  revised_text: И у священников-левитов никогда не переведётся человек, который предо Мной возносит всесожжение, воскуряет хлебное приношение и приносит жертву во все дни[a].
