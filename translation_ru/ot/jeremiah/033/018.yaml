base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/018.yaml
  text: And the Levitical priests will never lack a man before me to offer burnt offerings, burn grain offerings, and make sacrifices continually[a].
translation:
  language: ru
  text: И у священников-левитов никогда не переведётся человек, который предо Мной возносит всесожжение, воскуряет хлебное приношение и приносит жертву во все дни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Иер 33:14–26 отсутствует в древней греческой версии книги Иеремии.
    reason: textual_variant
lexical_decisions:
- source_word: וְלַכֹּהֲנִים הַלְוִיִּם
  choice: И у священников-левитов
  rationale: Предлог לְ передаёт отношение обещания к священникам; сочетание «священники-левиты» сохраняет отождествляющее приложение еврейского текста и естественно звучит по-русски.
- source_word: לֹא יִכָּרֵת אִישׁ
  choice: никогда не переведётся … человек
  rationale: В данном контексте идиома означает, что у священнической линии всегда будет представитель, несущий служение. Русское «не переведётся» передаёт непрерывность рода и не создаёт ошибочного впечатления о бессмертии одного человека.
- source_word: מִלְּפָנָי
  choice: предо Мной
  rationale: Выражение обозначает служение в присутствии Бога; «предо Мной» сохраняет торжественный регистр и пространственно-культовый оттенок.
- source_word: מַעֲלֶה עוֹלָה
  choice: который возносит всесожжение
  rationale: Причастие описывает служащего священника, поэтому передано определительным придаточным, а עֹלָה — традиционным и точным термином «всесожжение».
- source_word: וּמַקְטִיר מִנְחָה
  choice: воскуряет хлебное приношение
  rationale: Глагол означает превращение приношения в дым на алтаре; «воскуряет» сохраняет культовую конкретность. מִנְחָה здесь обозначает приношение из зерна или муки, для чего выбрано понятное библейское выражение «хлебное приношение».
- source_word: וְעֹשֶׂה זֶּבַח
  choice: и совершает жертвоприношение
  rationale: Формулировка естественно передаёт общий жертвенный термин и продолжает ряд действий священника.
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Сохраняет буквальный временной образ и выражает непрерывность служения, не ограничивая обещание отдельным периодом.
theological_decisions:
- issue: Передача идиомы כרת в обещании о непрерывности священнического служения
  choice: никогда не переведётся человек
  alternative: человек не будет отсечён
  rationale: Ближайший контекст говорит о том, что священническая линия не останется без служащего представителя. Буквальное «не будет отсечён» могло бы быть понято как обещание неуязвимости одному человеку; выбранная русская идиома сохраняет родовую и заветную непрерывность.
- issue: Значение הַכֹּהֲנִים הַלְוִיִּם
  choice: священники-левиты
  alternative: священники, левиты
  rationale: Дефисное сочетание ясно обозначает левитов, несущих священническое служение, не вводя позднейших конфессиональных разграничений.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «предо Мной», «всесожжение» и «воскуряет» уместны для храмового контекста; синтаксис остаётся понятным современному читателю.
