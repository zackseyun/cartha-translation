  to: И у священников-левитов никогда не переведётся человек, который предо Мной возносит всесожжение, воскуряет хлебное приношение и приносит жертву во все дни[a].
  rationale: Сохранены идиоматическое значение «не переведётся человек», определительное значение еврейских причастий и временная формула «во все дни». Небольшая перестройка русского порядка слов проясняет, что речь идёт о священническом служении перед Богом, без изменения смысла или устранения текстологической неоднозначности.
