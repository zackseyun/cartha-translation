  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Стандартное повествовательное введение сохранено в естественной для библейского русского формуле; оно вводит событие получения пророческого слова.
- source_word: דְּבַר
  choice: слово
  rationale: В устойчивой пророческой формуле דְּבַר יְהוָה слово «слово» прозрачно передаёт акт и содержание Божьего откровения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает адресата откровения; в русской формуле «слово было к» естественно сочетается с глаголом движения/направленности.
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Использована традиционная русская форма имени в дательном падеже после предлога «к».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь; в современном русском его функцию естественно и без смысловой потери передаёт двоеточие.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблён тетраграмматон как личное имя. «Яхве» сохраняет это имя, не заменяя его титулом; форма «Иегова» менее соответствует принятой научной реконструкции произношения.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой пророческой формулы. Двоеточие вместо буквального «говоря» естественно вводит речь следующего стиха; архаическое «И было слово… к…» здесь сознательно сохранено как dignified формульное выражение.
