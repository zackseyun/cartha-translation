base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/021.yaml
  text: then my covenant with David my servant may also be broken[a], so that he would not have a son reigning on his throne, and with the Levitical priests, my ministers.
translation:
  language: ru
  text: то и Мой завет с Давидом, Моим слугой, может быть нарушен, так что у Давида не будет сына, царствующего на его престоле; также может быть нарушен Мой завет с левитами-священниками, служащими Мне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и с левитами, священниками, служащими Мне»; во второй части подразумевается: «Мой завет может быть нарушен».'
    reason: Сохраняет еврейское приложение и синтаксический эллипсис, которые в основном тексте переданы более естественно по-русски.
lexical_decisions:
- source_word: גַּם
  choice: то и; также
  rationale: 'В контексте частица выражает соответствие предыдущему условию и добавочность: если может быть нарушен установленный Богом порядок, то может быть нарушен и Его завет.'
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: Сохраняет юридический и богословский вес еврейского בְּרִית с суффиксом первого лица.
- source_word: תֻפַר
  choice: может быть нарушен
  rationale: Хофаль от פרר обозначает пассивное нарушение, расторжение или лишение силы; формулировка естественна по-русски и сохраняет условный смысл контекста.
- source_word: אֶת דָּוִד עַבְדִּי
  choice: с Давидом, Моим слугой
  rationale: При слове «завет» אֶת естественно передаёт сторону завета; титул «Мой слуга» сохранён без ослабления.
- source_word: מִהְיוֹת לוֹ
  choice: так что у него не будет
  rationale: 'Предлог מִן с инфинитивом после תֻפַר выражает следствие: нарушение завета привело бы к отсутствию у Давида царствующего сына.'
- source_word: בֵן
  choice: сына
  rationale: Сохраняется конкретное родственное обозначение исходного текста, а не заменяется более общим «потомком» или «наследником».
- source_word: מֹלֵךְ עַל כִּסְאוֹ
  choice: царствующего на его престоле
  rationale: Причастие передано как продолжающееся осуществление царской власти; «на престоле» — естественная русская царская идиома.
- source_word: הַלְוִיִּם הַכֹּהֲנִים
  choice: левитами-священниками
  rationale: Передаёт отождествляющее приложение и ясно обозначает священническую группу из левитов; более буквальный порядок сохранён в примечании.
- source_word: מְשָׁרְתָי
  choice: служащими Мне
  rationale: Причастие от שרת обозначает совершающих служение Богу, особенно храмовое; русская конструкция яснее и естественнее, чем существительное «служители» в данном ряду.
theological_decisions:
- issue: Династическое обещание Давиду
  choice: «сына, царствующего на его престоле»
  alternative: «потомка, царствующего на его престоле» / «наследника на его престоле»
  rationale: Конкретная сыновняя и династическая лексика сохранена без сведения её к отвлечённой царской линии и без привнесения позднейшего толкования.
- issue: Определение священнической группы
  choice: «левитами-священниками»
  alternative: «с левитами, священниками» / «со священниками-левитами»
  rationale: Основной текст остаётся понятным современному читателю, а примечание сохраняет формальную неоднозначность приложения.
- issue: Эллипсис второго упоминания завета
  choice: повторить «может быть нарушен Мой завет»
  alternative: 'сохранить еврейский эллипсис: «и с левитами-священниками»'
  rationale: В еврейском сказуемое и слово «завет» подразумеваются из первой части. Повтор по-русски проясняет синтаксическую связь, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский, торжественный, но общедоступный. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому регистру. Точка с запятой помогает различить две параллельные стороны утверждения.
