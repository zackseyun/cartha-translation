source:
  edition: WLC
  text: אֲשֶׁ֤ר לֹֽא יִסָּפֵר֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/לֹ֥א יִמַּ֖ד ח֣וֹל הַ/יָּ֑ם כֵּ֣ן אַרְבֶּ֗ה אֶת זֶ֨רַע֙ דָּוִ֣ד עַבְדִּ֔/י וְ/אֶת הַ/לְוִיִּ֖ם מְשָׁרְתֵ֥י אֹתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/022.yaml
  text: As the host of heaven cannot be counted and the sand of the sea cannot be measured[d][c][b][a], so I will multiply the offspring of David my servant and the Levites who minister to me.
translation:
  language: ru
  text: Как неисчислимо небесное воинство[a] и неизмерим песок морской, так Я умножу потомство Давида, Моего слуги, и левитов, служащих Мне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Небесное воинство» — еврейское выражение, обозначающее небесное множество, нередко включая звёзды.
    reason: cultural_note
  - marker: b
    text: 'Или: «совершающих служение предо Мной»; еврейское слово может обозначать постоянное богослужебное служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְבָא הַשָּׁמַיִם
  choice: небесное воинство
  rationale: Сохраняет еврейский образ небесного множества, часто включающего звёзды, но не сводит его исключительно к ним.
- source_word: לֹא יִסָּפֵר
  choice: неисчислимо
  rationale: Естественно передаёт значение «невозможно сосчитать» и образ бесчисленного множества.
- source_word: חוֹל הַיָּם
  choice: песок морской
  rationale: Прямое и узнаваемое по-русски обозначение песка у моря как образа огромного количества.
- source_word: לֹא יִמַּד
  choice: неизмерим
  rationale: Сохраняет параллелизм с «неисчислимо» и значение невозможности измерить.
- source_word: כֵּן אַרְבֶּה
  choice: так Я умножу
  rationale: Точно передаёт сравнительную связь и каузативное значение глагола רבה — «сделаю многочисленным».
- source_word: זֶרַע דָּוִד
  choice: потомство Давида
  rationale: Передаёт собирательное значение זֶרַע естественным современным русским словом, не устраняя возможной связи с образом «семени».
- source_word: עַבְדִּי
  choice: Моего слуги
  rationale: В контексте Давида выражает статус назначенного Богом служителя; «раба» могло бы неоправданно выдвинуть на первый план подневольность.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Стандартное русское обозначение представителей колена Левия.
- source_word: מְשָׁרְתֵי אֹתִי
  choice: служащих Мне
  rationale: Причастная форма передаёт постоянное служение Богу; контекст допускает культовое служение, но основной текст не сужает значение сильнее, чем еврейский оригинал.
theological_decisions:
- issue: Соотношение потомства Давида и левитов в обещании
  choice: Обещание умножения относится параллельно и к потомству Давида, и к левитам, служащим Богу.
  alternative: Понимать левитов исключительно как храмовых служителей исторической эпохи Иеремии либо прямо истолковать обещание как указание на позднейшее мессианское исполнение.
  rationale: В еврейском тексте оба оборота являются однородными прямыми дополнениями при «умножу». Перевод сохраняет это построение и не вносит в стих конкретную схему дальнейшего исполнения обещания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Парная конструкция «неисчислимо… неизмерим… так Я умножу» сохраняет поэтический параллелизм оригинала; прописные местоимения при обращении к Богу соответствуют принятой русской библейской издательской традиции.
