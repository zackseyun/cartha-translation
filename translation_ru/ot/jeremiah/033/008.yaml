  text: וְ/טִ֣הַרְתִּ֔י/ם מִ/כָּל עֲוֺנָ֖/ם אֲשֶׁ֣ר חָֽטְאוּ לִ֑/י וְ/סָלַחְתִּ֗י ל/כול עֲוֺנֽוֹתֵי/הֶם֙ אֲשֶׁ֣ר חָֽטְאוּ לִ֔/י וַ/אֲשֶׁ֖ר פָּ֥שְׁעוּ בִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/008.yaml
  text: And I will cleanse them from all their guilt by which they have sinned against me[b][a], and I will forgive all their guilty deeds by which they have sinned against me and by which they have rebelled against me.
translation:
  language: ru
  text: Я очищу их от всей вины за грехи, которыми они согрешили против Меня, и прощу все их беззакония, в которых они согрешили против Меня и восстали против Меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: Я очищу их
  rationale: Пиэль глагола טהר означает очищение. «Очищу» естественно передаёт действие Бога и сохраняет как нравственный, так и культово-заветный оттенок, не сводя смысл только к обрядовой чистоте.
- source_word: מִכָּל עֲוֺנָם
  choice: от всей их вины
  rationale: עָוֹן может обозначать и беззаконие, и обусловленную им вину. После глагола «очищу» слово «вина» ясно выражает состояние виновности и нравственного осквернения.
- source_word: אֲשֶׁר חָטְאוּ לִי
  choice: за то, что они согрешили против Меня
  rationale: Конструкция חטא с ל обозначает грех, направленный против Бога. Оборот «за то, что» естественно связывает вину с совершённым грехом, не добавляя отдельного богословского толкования.
- source_word: וְסָלַחְתִּי
  choice: и прощу им
  rationale: סלח — обычный глагол, обозначающий Божье прощение. Русская конструкция «прощу им» естественна при последующем прямом дополнении «беззакония».
- source_word: לְכָל עֲוֺנוֹתֵיהֶם
  choice: все их беззакония
  rationale: Форма множественного числа עֲוֺנוֹתֵיהֶם указывает на множество виновных проступков. «Беззакония» сохраняет связь с тем же еврейским словом עָוֹן, но позволяет отличить сами проступки от вины, названной в первой части стиха.
- source_word: וַאֲשֶׁר פָּשְׁעוּ בִי
  choice: и восстали против Меня
  rationale: פשע выражает не просто нарушение, но мятеж или сознательное восстание против законной власти. «Восстали против Меня» сохраняет этот сильный личностный и заветный оттенок.
theological_decisions:
- issue: 'Передача трёх пересекающихся обозначений греха: עון, חטא и פשע'
  choice: 'Использованы разные выражения: «вина/беззакония», «согрешили» и «восстали».'
  alternative: Передать все слова общим корнем «грех» либо в обоих случаях переводить עון одинаково как «беззаконие».
  rationale: 'Еврейский текст сочетает близкие, но не тождественные понятия: виновность и виновные деяния, грех против Бога и восстание против Него. Различная передача сохраняет эту смысловую многослойность, не превращая её в законченную догматическую схему.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан понятным для обычного читателя; повтор «против Меня» сохранён, поскольку он подчёркнут и в еврейском тексте. Местоимение «Меня» написано с прописной буквы в соответствии с принятой русской библейской издательской практикой.
