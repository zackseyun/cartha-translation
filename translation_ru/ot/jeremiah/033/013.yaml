source:
  edition: WLC
  text: בְּ/עָרֵ֨י הָ/הָ֜ר בְּ/עָרֵ֤י הַ/שְּׁפֵלָה֙ וּ/בְ/עָרֵ֣י הַ/נֶּ֔גֶב וּ/בְ/אֶ֧רֶץ בִּנְיָמִ֛ן וּ/בִ/סְבִיבֵ֥י יְרוּשָׁלִַ֖ם וּ/בְ/עָרֵ֣י יְהוּדָ֑ה עֹ֣ד תַּעֲבֹ֧רְנָה הַ/צֹּ֛אן עַל יְדֵ֥י מוֹנֶ֖ה אָמַ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/013.yaml
  text: In the cities of the hill country[a], in the cities of the lowland, and in the cities of the Negeb, and in the land of Benjamin, and around Jerusalem, and in the cities of Judah, the flocks will again pass under the hands of the one who counts them[c][b], says Yahweh.
translation:
  language: ru
  text: В городах нагорья, в городах Шефелы[a], в городах Негева[b], в земле Вениамина, в окрестностях Иерусалима и в городах Иудеи стада снова будут проходить под рукой того, кто их считает[c], — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Шефела — холмистая предгорная область Иудеи; возможный перевод: «низменность» или «предгорья».'
    reason: lexical_alternative
  - marker: b
    text: Негев — южная область Иудеи; название также можно передать как «юг».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «под руками считающего». Имеется в виду пастух, считающий животных, когда они проходят мимо него.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּעָרֵי הָהָר
  choice: в городах нагорья
  rationale: הָהָר здесь обозначает горную, возвышенную область Иудеи, а не отдельную гору; «нагорье» кратко и естественно передаёт географический смысл.
- source_word: הַשְּׁפֵלָה
  choice: Шефела
  rationale: Это название конкретной предгорной области Иудеи; транслитерация сохраняет топонимический характер, а сноска поясняет его.
- source_word: הַנֶּגֶב
  choice: Негев
  rationale: Слово обозначает известную южную область; передача как топонима точнее, чем общее «юг».
- source_word: אֶרֶץ בִּנְיָמִן
  choice: земля Вениамина
  rationale: Сохраняет конкретное территориальное обозначение еврейского текста.
- source_word: סְבִיבֵי יְרוּשָׁלִַם
  choice: в окрестностях Иерусалима
  rationale: Естественно передаёт окружающие город местности.
- source_word: עָרֵי יְהוּדָה
  choice: города Иудеи
  rationale: Устоявшееся и понятное географическое выражение, согласованное с повтором «в городах».
- source_word: עֹד
  choice: снова
  rationale: В контексте восстановления указывает на возобновление прежде прекратившейся обычной жизни.
- source_word: תַּעֲבֹרְנָה הַצֹּאן
  choice: стада будут проходить
  rationale: צֹאן — собирательное обозначение мелкого скота; форма глагола поддерживает передачу множественным числом.
- source_word: עַל יְדֵי מוֹנֶה
  choice: под рукой того, кто их считает
  rationale: Сохраняет конкретный пастушеский образ животных, проходящих под рукой при подсчёте, не заменяя его истолкованием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное Божье имя, а не заменяет его титулом.
theological_decisions:
- issue: Образ восстановления через подсчёт стад
  choice: Сохранён буквальный образ стад, проходящих под рукой считающего.
  alternative: 'Передать истолковательно: «стада снова будут под надёжным присмотром» или «их снова пересчитают».'
  rationale: Еврейский текст рисует восстановление повседневной пастушеской жизни; буквальный образ оставляет читателю возможность воспринимать его смысл без добавленного богословского толкования.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; транслитерация сохраняет отличие имени от титула.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Географические названия «Шефела» и «Негев» сохранены как топонимы и пояснены в сносках. Синтаксический повтор исходного перечисления сохранён, но фраза оформлена естественно для русского языка.
