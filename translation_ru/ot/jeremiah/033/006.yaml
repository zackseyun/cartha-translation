source:
  edition: WLC
  text: הִנְ/נִ֧י מַעֲלֶה לָּ֛/הּ אֲרֻכָ֥ה וּ/מַרְפֵּ֖א וּ/רְפָאתִ֑י/ם וְ/גִלֵּיתִ֣י לָ/הֶ֔ם עֲתֶ֥רֶת שָׁל֖וֹם וֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/006.yaml
  text: Behold[a], I am bringing her healing and cure, and I will heal them, and I will reveal to them an abundance of peace and truth.
translation:
  language: ru
  text: Вот, Я принесу ей исцеление и выздоровление, исцелю их и открою им обилие мира и истины[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верности». Еврейское אֱמֶת может означать истину, надёжность или верность.'
    reason: Лексическая альтернатива сохраняет смысловой диапазон исходного слова.
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет указательно-торжественную силу пророческого объявления и естественно звучит в современном литературном русском.
- source_word: מַעֲלֶה
  choice: принесу
  rationale: Передаёт каузативное значение причастия породы hифиль — Бог даст возникнуть исцелению, — не перегружая фразу буквальным «подниму».
- source_word: לָּהּ
  choice: ей
  rationale: Женский род сохраняет образ олицетворённого города, то есть Иерусалима.
- source_word: אֲרֻכָה
  choice: исцеление
  rationale: Слово обозначает заживление раны или восстановление здоровья; выбранное соответствие сохраняет медицинский образ.
- source_word: מַרְפֵּא
  choice: выздоровление
  rationale: В паре с אֲרֻכָה обозначает исцеляющее восстановление; «выздоровление» различает два близких существительных и остаётся естественным по-русски.
- source_word: וּרְפָאתִים
  choice: исцелю их
  rationale: Будущее время соответствует пророческому употреблению перфекта; множественное «их» сохраняет переход от города в женском единственном числе к его жителям.
- source_word: וְגִלֵּיתִי
  choice: и открою
  rationale: Передаёт значение обнаружения или раскрытия и естественно сочетается с тем, что Бог открывает людям обещанное благо.
- source_word: עֲתֶרֶת
  choice: обилие
  rationale: Существительное означает изобилие или полноту; перевод не смешивает его с созвучным словом «венец».
- source_word: שָׁלוֹם
  choice: мир
  rationale: Сохраняет основное значение слова и его широкий пророческий оттенок благополучия и целостности.
- source_word: וֶאֱמֶת
  choice: истины
  rationale: Это прямое и традиционно понятное соответствие, тогда как допустимый оттенок «верности» сохранён в примечании.
theological_decisions:
- issue: Переход от женского единственного числа к множественному
  choice: «ей» относится к олицетворённому городу, а «их» — к его жителям
  alternative: Сгладить оба местоимения, отнеся их только к городу или только к народу
  rationale: Грамматический переход присутствует в еврейском тексте и сохраняет взаимосвязанные образы города и общины.
- issue: Смысловой диапазон אֱמֶת
  choice: В основном тексте — «истина»
  alternative: «верность» или «надёжность»
  rationale: Слово допускает несколько оттенков; основной перевод не устраняет эту неоднозначность, поскольку значимая альтернатива указана в примечании.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис остаётся ясным для широкого читателя; повтор корня «исцеление — исцелю» сохранён как элемент еврейской медицинской образности, а смена числа местоимений не сглажена.
