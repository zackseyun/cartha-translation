base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/010.yaml
  text: 'Thus says the LORD: Yet in this place, of which you say, ‘It is a waste, without man or beast,’ in the cities of Judah and in the streets of Jerusalem that are desolate, without man or inhabitant or beast, there shall again be heard'
translation:
  language: ru
  text: 'Так говорит ГОСПОДЬ: «В этом месте, о котором вы говорите: „Оно опустошено — нет ни людей, ни скота“, — в городах Иудеи и на улицах Иерусалима, которые опустели, где нет ни людей, ни жителей, ни скота, снова будет слышен…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона, ясно отличимая благодаря прописным буквам.
- source_word: חָרֵב
  choice: опустошено
  rationale: Передаёт состояние разорённого и обезлюдевшего места; в контексте согласуется с последующим הַנְשַׁמּוֹת.
- source_word: בְחֻצוֹת יְרוּשָׁלִַם
  choice: на улицах Иерусалима
  rationale: חֻצוֹת здесь естественно обозначает открытые городские пространства, улицы.
- source_word: עוֹד יִשָּׁמַע
  choice: снова будет слышен
  rationale: Сохраняет пассивную конструкцию и незавершённость мысли, которая продолжается в следующем стихе.
