  source_fidelity: 'Смысл передан точно: עוֹד יִשָּׁמַע отражено как «снова будет слышен», а намеренно незавершённая конструкция сохраняет переход к ст. 11. «ГОСПОДЬ» уместно передаёт тетраграмматон. Однако причастие «опустевших» после «на улицах Иерусалима» по-русски может относиться только к улицам, тогда как еврейское определение охватывает и города Иудеи, и улицы Иерусалима.'
