  text: ק֣וֹל שָׂשׂ֞וֹן וְ/ק֣וֹל שִׂמְחָ֗ה ק֣וֹל חָתָן֮ וְ/ק֣וֹל כַּלָּה֒ ק֣וֹל אֹמְרִ֡ים הוֹדוּ֩ אֶת יְהוָ֨ה צְבָא֜וֹת כִּֽי ט֤וֹב יְהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ מְבִאִ֥ים תּוֹדָ֖ה בֵּ֣ית יְהוָ֑ה כִּֽי אָשִׁ֧יב אֶת שְׁבוּת הָ/אָ֛רֶץ כְּ/בָ/רִאשֹׁנָ֖ה אָמַ֥ר יְהוָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/011.yaml
  text: the sound of joy and the sound of gladness[a], the sound of the bridegroom and the sound of the bride, the sound of those saying, ‘Give thanks to Yahweh of hosts, for Yahweh is good, for his steadfast love endures forever,’ and of those bringing a thank offering into the house of Yahweh. For I will restore the fortunes of the land as at first[b], says Yahweh.
translation:
  language: ru
  text: 'голос ликования и голос радости, голос жениха и голос невесты, голос тех, кто говорит: «Благодарите Яхве Воинств, ибо Яхве благ, ибо милость Его вечна[a]», и голос тех, кто приносит благодарственную жертву в дом Яхве. Ведь Я верну этой стране благополучие, какое было прежде[b], — говорит Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «неизменная любовь Его вечна» или «верность Его завету вечна».'
    reason: 'Лексема חֶסֶד обладает широким смысловым диапазоном: милость, преданная любовь и верность обязательствам.'
  - marker: b
    text: 'Или: «Я возвращу из плена жителей этой страны». Древнееврейское выражение может обозначать как возвращение пленников, так и восстановление благополучия в более широком смысле.'
    reason: Формула с שְׁבוּת допускает как буквальное, так и идиоматическое понимание.
lexical_decisions:
- source_word: קוֹל
  choice: голос
  rationale: Слово может обозначать голос, звук или шум. В повторяющейся поэтической формуле «голос» естественно охватывает и человеческую речь, и слышимые звуки праздника.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: ликование и радость
  rationale: Два близких слова переданы разными, но естественными русскими словами; «ликование» выражает более бурную радость и сохраняет поэтический параллелизм.
- source_word: חָתָן וְכַלָּה
  choice: жених и невеста
  rationale: Обычная русская брачная пара, точно соответствующая древнееврейской формуле.
- source_word: הוֹדוּ
  choice: благодарите
  rationale: В литургическом контексте форма глагола ידה призывает воздать благодарность и хвалу; выбор также сохраняет смысловую связь с последующей благодарственной жертвой.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — буквально и образно как «Воинств», без замены титула более общим понятием всемогущества.
- source_word: לְעוֹלָם חַסְדּוֹ
  choice: милость Его вечна
  rationale: חֶסֶד включает милость, неизменную любовь и верность обязательствам. «Милость» здесь естественна в русской формуле хвалы, а примечание сохраняет более широкие оттенки слова.
- source_word: תּוֹדָה
  choice: благодарственная жертва
  rationale: Поскольку её приносят в дом Яхве, здесь вероятен культовый смысл жертвоприношения благодарения, а не только словесная благодарность.
- source_word: אָשִׁיב אֶת שְׁבוּת הָאָרֶץ
  choice: верну этой стране благополучие
  rationale: Устойчивая формула может говорить как о возвращении пленников, так и о более широком восстановлении. Контекст свадеб, поклонения и обновлённой общественной жизни поддерживает широкий смысл.
- source_word: כְּבָרִאשֹׁנָה
  choice: какое было прежде
  rationale: Передаёт сравнение с первоначальным или прежним состоянием страны естественным современным русским выражением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет Тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Смысл חֶסֶד
  choice: милость
  alternative: неизменная любовь; верность завету
  rationale: Слово соединяет милость, преданную любовь и верность. Основной текст не вводит слово «завет», отсутствующее непосредственно в стихе, а альтернативы отмечены в сноске.
- issue: Смысл שְׁבוּת в формуле восстановления
  choice: благополучие страны
  alternative: плен страны; пленники страны
  rationale: Формула допускает буквальную связь с пленом и более широкое значение восстановления. Контекст поддерживает широкое прочтение, но более узкая возможность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Анафора «голос…» сохранена для передачи ритма оригинала; формы «ибо» и «— говорит Яхве» поддерживают торжественный регистр без архаизации синтаксиса.
