base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/007.yaml
  text: And I will restore the fortunes of Judah and the fortunes of Israel[a], and I will rebuild them as at the first.
translation:
  language: ru
  text: И Я восстановлю благополучие Иудеи и благополучие Израиля[a] и отстрою их, как прежде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «возвращу плен Иудеи и плен Израиля»; возможно также: «верну пленников Иудеи и Израиля».'
    reason: 'Лексическая альтернатива: оборот הֵשִׁיב שְׁבוּת допускает как широкое значение восстановления благополучия, так и более прямую отсылку к плену или пленникам.'
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי
  choice: И Я восстановлю
  rationale: Хифиль глагола שׁוב в сочетании со שׁבות выражает возвращение утраченного состояния; «восстановлю» естественно передаёт каузативный и восстановительный смысл.
- source_word: שְׁבוּת
  choice: благополучие
  rationale: В устойчивом обороте הֵשִׁיב שְׁבוּת слово может обозначать широкое восстановление прежнего благополучия, а не только возвращение из плена. Буквальная связь с пленом сохранена в сноске.
- source_word: יְהוּדָה
  choice: Иудеи
  rationale: Традиционная русская форма названия Иуды как страны и народа; родительный падеж обусловлен словом «благополучие».
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Традиционная русская форма национального имени; вместе с Иудеей обозначает восстановление всего народа.
- source_word: וּבְנִתִים
  choice: и отстрою их
  rationale: Глагол בנה значит «строить», а в контексте восстановления после разорения — «отстроить». Местоимение «их» сохраняет множественный объектный суффикс, относящийся к Иудее и Израилю.
- source_word: כְּבָרִאשֹׁנָה
  choice: как прежде
  rationale: Кратко и естественно передаёт сравнение с прежним состоянием, не добавляя идеи полного возвращения к некоторому строго определённому историческому периоду.
theological_decisions:
- issue: Объём значения שְׁבוּת в пророчестве о восстановлении
  choice: восстановлю благополучие
  alternative: возвращу из плена / возвращу пленников
  rationale: Контекст обещает широкое восстановление Иудеи и Израиля, включая их отстройку. Основной текст сохраняет эту широту, а сноска отмечает возможную непосредственную связь выражения с пленом и возвращением пленников.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавное «Я» подчёркивает речь Господа без добавления отсутствующего в стихе имени. «Отстрою» естественно выражает восстановление разрушенного; синтаксис сохраняет параллелизм исходного текста.
