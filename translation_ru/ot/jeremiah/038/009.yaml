id: JER.38.9
reference: Jeremiah 38:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ הֵרֵ֜עוּ הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ אֵ֣ת כָּל אֲשֶׁ֤ר עָשׂוּ֙ לְ/יִרְמְיָ֣הוּ הַ/נָּבִ֔יא אֵ֥ת אֲשֶׁר הִשְׁלִ֖יכוּ אֶל הַ/בּ֑וֹר וַ/יָּ֤מָת תַּחְתָּי/ו֙ מִ/פְּנֵ֣י הָֽ/רָעָ֔ב כִּ֣י אֵ֥ין הַ/לֶּ֛חֶם ע֖וֹד בָּ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/009.yaml
  text: My lord the king[a], these men have done evil in all that they did to Jeremiah the prophet, whom they threw into the cistern, and he will die there because of the famine, for there is no bread left in the city.
translation:
  language: ru
  text: '«Государь мой, царь! Эти люди поступили злодейски во всём, что сделали с пророком Иеремией: они бросили его в водосборную яму[a], и он умрёт там от голода, ведь хлеба в городе больше нет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в яму». Еврейское בּוֹר (бор) может означать яму, темницу или водосборник; в данном контексте лучше всего подходит водосборная яма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Государь мой, царь!
  rationale: Уважительное придворное обращение, сохраняющее и личный почтительный титул, и указание на царское достоинство; формулировка естественна для литературного русского языка.
- source_word: הֵרֵעוּ
  choice: поступили злодейски
  rationale: Форма породы hифиль от רעע выражает нравственно дурной, преступный характер действий; «злодейски» передаёт силу обвинения без смягчения до простого «неправильно».
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: эти люди
  rationale: В данном контексте речь идёт о конкретных мужчинах, ранее названных сановниках; русское «люди» естественно обозначает эту группу и не меняет референта.
- source_word: אֵת כָּל אֲשֶׁר עָשׂוּ לְיִרְמְיָהוּ הַנָּבִיא
  choice: во всём, что сделали с пророком Иеремией
  rationale: Передаёт охват כָּל אֲשֶׁר и сохраняет титул Иеремии; оборот «сделали с» в русском естественно обозначает причинённое человеку дурное обращение.
- source_word: הִשְׁלִיכוּ אֶל הַבּוֹר
  choice: бросили его в водосборную яму[a]
  rationale: בּוֹר может обозначать яму, темницу или водосборник. В ближайшем повествовательном контексте это углубление для хранения воды, на дне которого осталась грязь, поэтому «водосборная яма» точнее общего «яма» и понятнее здесь, чем современное «цистерна».
- source_word: וַיָּמָת תַּחְתָּיו
  choice: и он умрёт там
  rationale: Хотя וַיָּמָת по форме является wayyiqtol, в речи Авдемелеха оно указывает на грозящий Иеремии исход, если его не спасти. «Там» естественно передаёт локальный смысл идиоматического תַּחְתָּיו в данном контексте.
- source_word: מִפְּנֵי הָרָעָב
  choice: от голода
  rationale: Русское «умрёт от голода» непосредственно и естественно передаёт причинное значение выражения; последующее пояснение связывает этот голод с отсутствием хлеба во всём городе.
- source_word: כִּי אֵין הַלֶּחֶם עוֹד בָּעִיר
  choice: ведь хлеба в городе больше нет
  rationale: Сохраняется конкретное «хлеб», а «больше нет» передаёт עוֹד. Союз «ведь» естественно вводит основание сказанного.
theological_decisions:
- issue: Временной и аспектуальный смысл וַיָּמָת
  choice: 'будущее следствие: «он умрёт»'
  alternative: формально-прошедшее «он умер» или процессуальное «он умирает»
  rationale: Иеремия в этот момент ещё жив, поэтому прошедшее время создало бы фактическое противоречие повествованию. Будущее сохраняет смысл предупреждения о неизбежном исходе без добавления богословской интерпретации.
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Синтаксис слегка приподнят, но остаётся понятным; моральная резкость обвинения и угроза скорой смерти сохранены.
