  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ לֹ֣א יִתֵּ֑נוּ שְֽׁמַֽע נָ֣א בְּ/ק֣וֹל יְהוָ֗ה לַ/אֲשֶׁ֤ר אֲנִי֙ דֹּבֵ֣ר אֵלֶ֔י/ךָ וְ/יִ֥יטַב לְ/ךָ֖ וּ/תְחִ֥י נַפְשֶֽׁ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/020.yaml
  text: Jeremiah said[a], “They will not hand you over. Please listen to the voice of Yahweh in what I am speaking to you, so that it may go well with you and your life may be spared.”
translation:
  language: ru
  text: 'Иеремия сказал: «Они не выдадут тебя[a]. Прошу, послушайся голоса Яхве[b] в том, что я говорю тебе, — и тебе будет хорошо, и ты останешься жив[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Они не отдадут»; кого и кому — понятно из контекста.'
    reason: lexical_alternative
  - marker: b
    text: «Послушаться голоса» — еврейское выражение со значением «услышать и последовать сказанному».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и твоя душа (или жизнь) будет жить»; здесь речь идёт о сохранении физической жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִתֵּנוּ
  choice: Они не выдадут тебя
  rationale: Глагол стоит в 3-м лице множественного числа, а дополнение подразумевается из контекста. «Не выдадут тебя» естественно передаёт передачу царя во власть врагов, не превращая активную конструкцию в пассивную.
- source_word: שְׁמַע נָא
  choice: Прошу, … послушайся
  rationale: Частица נָא при повелительном наклонении выражает настойчивую, но вежливую просьбу. «Прошу» передаёт этот оттенок, а «послушайся» в данном контексте включает не только слушание, но и следование услышанному.
- source_word: בְּקוֹל יְהוָה
  choice: голоса Яхве
  rationale: Сохранён еврейский образ «слушаться голоса», подчёркивающий, что передаваемые Иеремией слова исходят от Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: לַאֲשֶׁר אֲנִי דֹּבֵר אֵלֶיךָ
  choice: в том, что я говорю тебе
  rationale: Формулировка сохраняет тесную связь между голосом Яхве и словами, которые Иеремия передаёт царю, не отождествляя пророка с Богом.
- source_word: וְיִיטַב לְךָ
  choice: Тогда тебе будет хорошо
  rationale: Передан благоприятный результат послушания; «тогда» естественно выражает смысловую связь с предшествующим призывом.
- source_word: וּתְחִי נַפְשֶׁךָ
  choice: и ты останешься жив
  rationale: נֶפֶשׁ здесь означает жизнь человека в ситуации физической угрозы. Русская формулировка естественно передаёт обещание сохранения жизни без антропологического уточнения о «душе».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте употреблено собственное имя Бога. Транслитерация «Яхве» сохраняет его как личное имя и не подменяет титулом.
- issue: Смысл נֶפֶשׁ в угрозе смерти
  choice: ты останешься жив
  alternative: твоя душа будет жить; жизнь твоя будет сохранена
  rationale: Контекст говорит о физическом спасении Седекии. Такой перевод не вносит в стих более узкого учения о составе человека и естественно звучит по-русски.
- issue: Связь пророческой речи с голосом Яхве
  choice: в том, что я говорю тебе, послушайся голоса Яхве
  alternative: послушайся Яхве и сделай то, что я говорю тебе
  rationale: 'Выбранная конструкция сохраняет напряжение исходного текста: Иеремия говорит, но через его речь царь слышит голос Яхве. Вариант с «сделай» был бы более разъяснительным, чем оригинал.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан понятным для обычного читателя, при этом сохранены образ «голоса Яхве» и связь слов пророка с Божьей речью. Архаизмы и чрезмерно буквальная формула «душа твоя будет жить» не использованы.
