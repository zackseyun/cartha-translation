  yaml_path: translation/ot/jeremiah/038/010.yaml
  text: Then the king commanded Ebed-melech the Cushite[a], saying, “Take with you from here thirty men[b], and bring Jeremiah the prophet up from the cistern before he dies.”
translation:
  language: ru
  text: 'Тогда царь приказал Эвед-Мелеху, кушиту[a]: «Возьми отсюда с собой тридцать человек и вытащи пророка Иеремию из цистерны[b], прежде чем он умрёт».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эфиопу». В еврейском тексте — «кушиту», то есть человеку из Куша.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из ямы» или «из темницы». Еврейское слово может обозначать яму, цистерну или темницу; здесь по контексту речь идёт о цистерне, на дне которой была грязь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה הַמֶּלֶךְ
  choice: Тогда царь приказал
  rationale: Глагол צוה выражает властное распоряжение царя; «приказал» естественно передаёт его силу. «Тогда» отмечает последовательность повествования.
- source_word: עֶבֶד מֶלֶךְ
  choice: Эвед-Мелех
  rationale: В данном контексте это личное имя; транслитерация сохраняет его как имя, а не переводит как нарицательное сочетание «слуга царя».
- source_word: הַכּוּשִׁי
  choice: кушиту
  rationale: Обозначает человека из Куша. «Кушит» точнее сохраняет древнееврейское этногеографическое наименование, чем традиционное «эфиоп».
- source_word: קַח בְּיָדְךָ מִזֶּה שְׁלֹשִׁים אֲנָשִׁים
  choice: Возьми отсюда с собой тридцать человек
  rationale: Идиома בְּיָדְךָ буквально означает «в твою руку», но здесь указывает на людей, которых следует взять с собой под своё руководство. Русский порядок слов звучит естественно и сохраняет מִזֶּה «отсюда».
- source_word: וְהַעֲלִיתָ
  choice: вытащи
  rationale: Порода hифиль глагола עלה означает заставить подняться, поднять наверх. При извлечении человека из глубокого водосборника «вытащи» ясно и естественно передаёт физическое действие.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: пророка Иеремию
  rationale: Сохранены имя и присутствующий в исходном тексте титул; русский падеж и порядок слов соответствуют синтаксису предложения.
- source_word: מִן הַבּוֹר
  choice: из водосборника
  rationale: בּוֹר может обозначать яму или цистерну. По ближайшему контексту речь идёт о глубоком сооружении для сбора воды, на дне которого была грязь; «водосборник» понятно передаёт эту реалию без современного оттенка сантехнической ёмкости.
- source_word: בְּטֶרֶם יָמוּת
  choice: пока он не умер
  rationale: Оборот задаёт предельный срок для спасения Иеремии. По-русски «пока он не умер» естественно выражает требование успеть до его смерти.
