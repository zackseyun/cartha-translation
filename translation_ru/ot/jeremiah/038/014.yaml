revisions:
- from: 'Тогда царь Седекия послал за пророком Иеремией и велел привести его к себе, к третьему входу в дом Яхве[a]. Царь сказал Иеремии: «Я хочу спросить тебя об одном деле; ничего от меня не скрывай[b]».'
  to: 'Тогда царь Седекия послал за пророком Иеремией и велел привести его к себе, к третьему входу, находившемуся в доме Яхве[a]. Царь сказал Иеремии: «Я хочу спросить тебя кое о чём; ничего от меня не скрывай[b]».'
  rationale: Исправление уточняет, что третий вход находился в доме Яхве, а не является лишь входом «в дом». Выражение דָּבָר передано естественным и неспецифичным «кое о чём». Обе сноски приведены в соответствие с их функцией как лексических альтернатив, без добавления толкования.
