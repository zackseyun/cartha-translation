base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/014.yaml
  text: Then King Zedekiah sent and took Jeremiah the prophet to himself[a], to the third entrance that is in the house of Yahweh, and the king said to Jeremiah, “I am asking you something[b]; do not hide anything from me.”
translation:
  language: ru
  text: 'Тогда царь Седекия послал за пророком Иеремией и велел привести его к себе, к третьему входу, находившемуся в доме Яхве[a]. Царь сказал Иеремии: «Я хочу спросить тебя кое о чём; ничего от меня не скрывай[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храме Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ничего не утаивай от меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקַּח
  choice: послал за ... и велел привести
  rationale: Последовательность глаголов буквально означает «послал и взял», но в данном контексте описывает приказ доставить Иеремию к царю. Русская формулировка передаёт действие естественно, не предполагая, что царь лично привёл пророка.
- source_word: אֵלָיו
  choice: к себе
  rationale: Передаёт направленность движения лично к Седекии и естественно соотносится с подлежащим «царь».
- source_word: מָבוֹא הַשְּׁלִישִׁי
  choice: третий вход
  rationale: מָבוֹא обозначает вход или место доступа; «третий» сохранено буквально без попытки уточнить неизвестное устройство храмового комплекса.
- source_word: בְּבֵית יְהוָה
  choice: в дом Яхве
  rationale: Сохраняется буквальный образ «дома» и личное имя יהוה; по-русски после слова «дом» естественен родительный падеж.
- source_word: שֹׁאֵל אֲנִי אֹתְךָ דָּבָר
  choice: Я хочу спросить тебя об одном деле
  rationale: Причастная конструкция выражает непосредственное намерение царя задать вопрос; דָּבָר здесь означает не просто отдельное слово, а дело или предмет разговора.
- source_word: אַל תְּכַחֵד מִמֶּנִּי דָּבָר
  choice: ничего от меня не скрывай
  rationale: Естественная русская передача запрета; отрицательное местоимение сохраняет всеохватность повторного דָּבָר.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул. Транслитерация сохраняет различие между יהוה и אֲדֹנָי, не привнося конфессионального толкования.
- issue: Значение выражения בְּבֵית יְהוָה
  choice: в дом Яхве
  alternative: в храм Яхве
  rationale: «Дом Яхве» формально отражает בית יהוה и сохраняет библейский образ; контекстуальное понимание как храма отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис слегка разгружен делением на два предложения; приказная каузативность выражена естественным оборотом «велел привести». Все сноски отмечены в основном тексте.
