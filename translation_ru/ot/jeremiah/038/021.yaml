  text: וְ/אִם מָאֵ֥ן אַתָּ֖ה לָ/צֵ֑את זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר הִרְאַ֖/נִי יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/021.yaml
  text: 'But if you refuse to go out[a], this is the word that Yahweh has shown me:'
translation:
  language: ru
  text: 'Но если ты откажешься выйти, то вот что[a] показал мне Яхве:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вот какое слово показал мне Яхве».'
    reason: Слово דָּבָר может означать «слово», «дело» или «то, что»; вариант сохраняет его явное лексическое выражение и пророческий оттенок.
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Сочетание союза с условной частицей вводит противопоставление предыдущему обещанию; «но если» естественно передаёт эту связь.
- source_word: מָאֵן
  choice: откажешься
  rationale: Глагол обозначает сознательный отказ, а не неспособность или простое нежелание.
- source_word: לָצֵאת
  choice: выйти
  rationale: Инфинитив буквально означает «выйти». В контексте речь идёт о выходе к вавилонским военачальникам, однако значение «сдаться» здесь прямо не выражено.
- source_word: זֶה הַדָּבָר
  choice: вот что
  rationale: דָּבָר допускает значения «слово», «дело», «то, что». Русское «вот что» естественно вводит содержание показанного откровения и не устраняет исходную смысловую широту.
- source_word: אֲשֶׁר הִרְאַנִי
  choice: показал мне
  rationale: Каузативная форма глагола ראה буквально передаёт действие «показать, дать увидеть» и сохраняет зрительный оттенок откровения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте употреблён тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер данного Иеремии откровения
  choice: показал мне
  alternative: открыл мне
  rationale: Формулировка сохраняет зрительный оттенок формы הִרְאַנִי, не уточняя сверх текста, было ли это видением или иным способом откровения.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной пророческой формулировкой. «Выйти» оставлено без поясняющего «сдаться», чтобы не добавлять к тексту контекстуальное толкование.
