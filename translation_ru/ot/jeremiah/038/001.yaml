base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/001.yaml
  text: Shephatiah son of Mattan[a], Gedaliah son of Pashhur, Jucal son of Shelemiah, and Pashhur son of Malchiah heard the words that Jeremiah was speaking to all the people, saying,
translation:
  language: ru
  text: 'Шефатия, сын Маттана, Гедалия, сын Пашхура, Юкал[a], сын Шелемии, и Пашхур, сын Малкии, услышали слова, которые Иеремия говорил всему народу:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь в еврейском тексте стоит краткая форма имени «Юкал»; в Иер. 37:3 тот же человек назван более полной формой «Иехукал».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышали
  rationale: Форма единственного числа согласуется с первым членом составного подлежащего по нормам библейского иврита; в естественном русском требуется множественное число, поскольку перечислены четыре человека.
- source_word: שְׁפַטְיָה ... גְדַלְיָהוּ ... יוּכַל ... פַשְׁחוּר
  choice: Шефатия ... Гедалия ... Юхал ... Пашхур
  rationale: Личные имена переданы транслитерацией с древнееврейского; краткая форма יוּכַל сохранена как «Юхал», а не заменена более полной формой из другого стиха.
- source_word: בֶּן
  choice: сын
  rationale: Обычное обозначение происхождения и идентификации по отцу; повторено при каждом имени для ясности.
- source_word: אֶת הַדְּבָרִים
  choice: слова
  rationale: В данном контексте דְּבָרִים обозначает содержание произносимой Иеремией речи; буквальное «слова» естественно и не сужает значение до пересказа или единого «послания».
- source_word: אֲשֶׁר יִרְמְיָהוּ מְדַבֵּר
  choice: которые Иеремия говорил
  rationale: Причастная форма מְדַבֵּר изображает речь как продолжавшуюся в момент, когда эти люди её услышали; русское несовершенное «говорил» передаёт эту длительность.
- source_word: אֶל כָּל הָעָם
  choice: всему народу
  rationale: עָם здесь означает людей, к которым обращался пророк; дательный падеж естественно передаёт адресата речи.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Стандартный древнееврейский вводитель прямой речи естественно передан двоеточием, поскольку содержание слов следует в следующем стихе; громоздкое «говоря» в русском не требуется.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с прямым синтаксисом и без добавочного вводного «И». Перечень имён сохранён полностью, а двоеточие подготавливает продолжение речи в следующем стихе.
