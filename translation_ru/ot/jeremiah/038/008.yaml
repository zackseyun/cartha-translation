lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Форма от יָצָא обозначает движение наружу и продолжает последовательность повествования; «вышел» прямо передаёт это направление.
- source_word: עֶבֶד מֶלֶךְ
  choice: Эвед-Мелех
  rationale: В данном контексте это личное имя. Транслитерация с еврейского сохраняет его как имя собственное, не превращая в нарицательное сочетание.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: из царского дома
  rationale: בַּיִת буквально означает «дом», а конструкция принадлежности естественно передаётся по-русски прилагательным «царский». В контексте возможен смысл «дворец», отмеченный в сноске.
- source_word: וַיְדַבֵּר אֶל הַמֶּלֶךְ לֵאמֹר
  choice: 'и обратился к царю со словами:'
  rationale: Естественная русская формула введения прямой речи передаёт и обращение к царю, и לֵאמֹר, вводящее содержание речи в следующем стихе.
