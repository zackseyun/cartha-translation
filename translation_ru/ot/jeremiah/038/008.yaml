  text: Then Ebed-melech went out from the king’s house and spoke to the king[a], saying,
translation:
  language: ru
  text: 'Тогда Эвед-Мелех вышел из царского дома[a] и обратился к царю со словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из дворца». Буквально по-еврейски: «из дома царя».'
