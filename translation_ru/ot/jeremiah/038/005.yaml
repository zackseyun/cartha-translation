- source_word: הוּא בְּיֶדְכֶם
  choice: он в ваших руках
  rationale: Сохранён образ руки как власти и контроля; это выражение понятно и естественно в современном русском языке.
- source_word: כִּי
  choice: потому что
  rationale: Частица вводит причину, по которой царь уступает требованиям сановников.
- source_word: אֵין הַמֶּלֶךְ יוּכַל
  choice: царь ничего не может сделать
  rationale: Передана неспособность царя действовать; самоназвание в третьем лице сохранено, чтобы не устранять риторическое дистанцирование оригинала.
- source_word: אֶתְכֶם דָּבָר
  choice: против вас
  rationale: Эллиптическая конструкция буквально допускает более широкое «что-либо по отношению к вам», но в контексте означает невозможность воспротивиться им или отменить их решение.
