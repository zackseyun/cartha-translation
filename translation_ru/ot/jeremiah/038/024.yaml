  text: וַ/יֹּ֨אמֶר צִדְקִיָּ֜הוּ אֶֽל יִרְמְיָ֗הוּ אִ֛ישׁ אַל יֵדַ֥ע בַּ/דְּבָֽרִים הָ/אֵ֖לֶּה וְ/לֹ֥א תָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/024.yaml
  text: Then Zedekiah said to Jeremiah[a], “Let no one know about these things[b], and you will not die.”
translation:
  language: ru
  text: 'Тогда Седекия сказал Иеремии: «Пусть никто не узнает об этих делах — и ты не умрёшь[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последнюю часть фразы можно также понять как указание цели или результата: «чтобы ты не умер».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Ваййиктоль продолжает повествовательную последовательность; «тогда» естественно передаёт переход к следующему действию.
- source_word: צִדְקִיָּהוּ
  choice: Седекия
  rationale: Традиционная и узнаваемая русская форма библейского имени.
- source_word: יִרְמְיָהוּ
  choice: Иеремия
  rationale: Традиционная и узнаваемая русская форма библейского имени; после «сказал» употреблён дательный падеж «Иеремии».
- source_word: אִישׁ אַל יֵדַע
  choice: Пусть никто не узнает
  rationale: אִישׁ здесь употреблено обобщённо, а אַל с юссивом выражает запрет. «Никто» естественно и точно передаёт общий смысл в современном русском языке.
- source_word: בַּדְּבָרִים הָאֵלֶּה
  choice: об этих делах
  rationale: דְּבָרִים допускает значения «слова», «дела», «обстоятельства». В контексте речь идёт о только что обсуждённом; «делах» сохраняет широту выражения, не сводя его лишь к словам разговора.
- source_word: וְלֹא תָמוּת
  choice: и ты не умрёшь
  rationale: Сочинительная конструкция сохранена без однозначного уточнения логической связи; она может выражать следствие, обещание или цель.
