base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/027.yaml
  text: Then all the officials came to Jeremiah and questioned him[a], and he told them all these words that the king had commanded. So they were silent before him, for the matter had not been heard.
translation:
  language: ru
  text: Тогда все сановники пришли к Иеремии и стали расспрашивать его. Он сообщил им всё, как повелел царь. И они больше ничего не сказали ему, потому что никто не слышал об этом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «потому что дело (или слово) не было услышано». Возможно также: «потому что об этом деле не стало известно». В контексте речь, вероятно, идёт о разговоре царя с Иеремией, но еврейский текст прямо этого не уточняет.'
    reason: Сноска сохраняет широкое значение הַדָּבָר и пассивную форму נִשְׁמַע, а также отмечает вероятную контекстуальную отсылку, не навязывая её основному тексту.
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: В придворном контексте слово обозначает высокопоставленных царских служащих; «сановники» естественно передаёт их положение, не называя их царевичами или исключительно военачальниками.
- source_word: וַיִּשְׁאֲלוּ אֹתוֹ
  choice: стали расспрашивать его
  rationale: Форма указывает здесь не на один нейтральный вопрос, а на настойчивое выяснение обстоятельств; «расспрашивать» передаёт этот оттенок без излишне юридического «допрашивать».
- source_word: וַיַּגֵּד לָהֶם
  choice: он передал им
  rationale: Hифиль от נגד означает сообщить или сделать известным; в контексте Иеремия воспроизводит предписанный царём ответ.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: всё, что велел ему сказать царь
  rationale: Предлог כ перед כָל указывает на соответствие ответа данным указаниям. Добавленное по смыслу «ему сказать» естественно выражает контекст предыдущего стиха и не превращает эти слова в приказ, адресованный сановникам.
- source_word: וַיַּחֲרִשׁוּ מִמֶּנּוּ
  choice: они больше не стали говорить с ним
  rationale: Идиома передаёт прекращение разговора или молчание по отношению к Иеремии. Такой перевод естественен по-русски и сохраняет направленность, выраженную מִמֶּנּוּ.
- source_word: כִּי לֹא נִשְׁמַע הַדָּבָר
  choice: потому что никто не слышал того разговора
  rationale: 'Буквально: «потому что дело/слово не было услышано». В данном контексте הַדָּבָר, вероятнее всего, обозначает тайный разговор царя с Иеремией; русская неопределённо-личная конструкция ясно передаёт еврейский пассив.'
