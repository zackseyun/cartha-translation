base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/023.yaml
  text: And all your wives and your sons will be brought out to the Chaldeans[a], and you yourself will not escape from their hand, for you will be seized by the hand of the king of Babylon[c][b], and this city will be burned with fire.
translation:
  language: ru
  text: 'И всех твоих жён и сыновей выведут к халдеям[a]. Ты сам не спасёшься от них: ты окажешься во власти царя Вавилона, а этот город сожгут огнём[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к вавилонянам». «Халдеи» — название народа, которое в этом контексте относится к вавилонским завоевателям.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский глагол стоит в женском единственном числе, согласуясь со словом «город». В контексте смысл передан так: город будет сожжён.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֶׁיךָ
  choice: твоих жён
  rationale: В обращении к царю речь естественнее всего идёт о его жёнах; перевод сохраняет множественное число и конкретное значение контекста.
- source_word: בָּנֶיךָ
  choice: сыновей
  rationale: Еврейское слово прямо обозначает сыновей, а не детей вообще.
- source_word: מוֹצִאִים
  choice: выведут
  rationale: Пассивно-каузативное причастие в пророческом контексте имеет будущее значение; неопределённо-личная русская конструкция естественно передаёт неназванных исполнителей действия.
- source_word: הַכַּשְׂדִּים
  choice: халдеям
  rationale: Сохранён исходный этноним; в данном контексте он обозначает вавилонян, что отмечено в сноске.
- source_word: לֹא תִמָּלֵט מִיָּדָם
  choice: не спасёшься от них
  rationale: Еврейская идиома буквально говорит о невозможности уйти «из их руки», то есть из-под их власти; по-русски смысл естественно передаётся без буквального калькирования.
- source_word: בְיַד מֶלֶךְ בָּבֶל תִּתָּפֵשׂ
  choice: царь Вавилона схватит тебя
  rationale: Идиома «рукой царя» обозначает власть или действие царя; активная русская конструкция ясно и естественно передаёт значение пассивного еврейского глагола «будешь схвачен».
- source_word: הָעִיר הַזֹּאת תִּשְׂרֹף
  choice: этот город сожгут
  rationale: Форма глагола женского рода согласуется с существительным «город» в еврейском языке; контекст требует понимать город как объект сожжения, а русская неопределённо-личная конструкция сохраняет неназванного деятеля.
- source_word: בָּאֵשׁ
  choice: огнём
  rationale: Творительный падеж естественно передаёт средство уничтожения и сохраняет конкретный образ огня.
theological_decisions:
- issue: Кто сожжёт город
  choice: 'Исполнитель не назван: «город сожгут»'
  alternative: «ты сожжёшь этот город» или «этот город сгорит»
  rationale: Женская форма תִּשְׂרֹף согласуется с «городом», а не с адресатом-мужчиной; при этом эллиптическая конструкция не требует догматически уточнять деятеля.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Еврейские идиомы со словом «рука» переданы по смыслу, чтобы избежать неестественной кальки; этноним «халдеи» сохранён с пояснением.
