  terminology: «Халдеи» — уместное сохранение этнонима; пояснение «вавилоняне» полезно. «Царь Вавилона» — устоявшееся библейское наименование. Сноска о женской форме глагола уместна, но должна точнее отмечать, что русский перевод передаёт результативный смысл, не превращая грамматическое согласование в бесспорное синтаксическое решение.
