  source_fidelity: 'Первая часть передана точно: «жён», «сыновей», будущее пассивное действие и этноним «халдеи» сохранены. Однако в исходном тексте после «не спасёшься от их руки» следует «ибо будешь схвачен рукой царя Вавилона». Черновик заменяет это на «царь Вавилона схватит тебя», что допустимо по общему смыслу, но утрачивает повтор ключевой идиомы «рука» и пассивную формулировку. Финальное «город сожгут огнём» верно передаёт смысл спорной по синтаксису женской формы глагола, не приписывая действие адресату.'
