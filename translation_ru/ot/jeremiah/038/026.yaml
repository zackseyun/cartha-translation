  source_fidelity: 'Основная передача верна: повеление обращено к Иеремии, мольба адресована царю, а дом Ионафана назван местом, куда его не следует возвращать. Однако «где я могу умереть» превращает еврейский инфинитив цели/ожидаемого последствия («умереть там») в относительное придаточное с модальным значением возможности и несколько ослабляет связь с запретом возвращения.'
