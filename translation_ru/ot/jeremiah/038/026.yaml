    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Тогда скажи им
  rationale: Сочетание союза с формой qatal в последовательном предписании естественно передаётся по-русски словом «тогда» и повелительным наклонением.
- source_word: מַפִּיל אֲנִי תְחִנָּתִי לִפְנֵי הַמֶּלֶךְ
  choice: Я обращался к царю с мольбой
  rationale: Еврейская идиома буквально говорит о том, чтобы «повергнуть мольбу перед» кем-либо, то есть обратиться с настойчивой просьбой. Прошедший несовершенный вид соответствует рассказу о только что состоявшейся беседе.
- source_word: תְחִנָּתִי
  choice: с мольбой
  rationale: Существительное обозначает настойчивую просьбу о милости; «мольба» сохраняет её серьёзность и эмоциональную силу.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: к царю
  rationale: В составе данной идиомы естественное русское управление «обращаться к царю» точнее передаёт смысл, чем буквальное «перед царём».
- source_word: לְבִלְתִּי הֲשִׁיבֵנִי
  choice: чтобы он не отсылал меня обратно
  rationale: Конструкция выражает содержание мольбы; подразумеваемый деятель — царь. «Отсылал обратно» естественно передаёт каузативное значение «возвращать кого-либо».
- source_word: בֵּית יְהוֹנָתָן
  choice: дом Ионафана
  rationale: Прозрачно передаёт конструкцию принадлежности и сохраняет повторяющееся в повествовании обозначение места заключения.
- source_word: לָמוּת שָׁם
  choice: где я могу умереть
  rationale: Инфинитив называет возможный и страшный результат возвращения. Такая формулировка естественна по-русски и не утверждает, что смерть неизбежна.
