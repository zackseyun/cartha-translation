base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/011.yaml
  text: So Ebed-melech took the men with him and went into the king’s house[a], to a place below the storeroom, and from there took worn-out rags and worn-out garments[c][b], and sent them down by ropes to Jeremiah in the cistern.
translation:
  language: ru
  text: И Эвед-Мелех взял людей с собой, вошёл в царский дворец, в помещение под кладовой[a], взял оттуда истёртые лоскутья и изношенную одежду[b] и спустил их на верёвках Иеремии, находившемуся в водосборнике[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под сокровищницей». Еврейское слово אוֹצָר может означать сокровищницу, хранилище или кладовую; в этом контексте вероятнее место хранения вещей.'
    reason: lexical_alternative
  - marker: b
    text: Точное значение редкого еврейского слова מְלָחִים неизвестно. Вероятно, имеются в виду старые предметы одежды или куски ткани, которыми можно было защитить Иеремию от верёвок.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в яму». Еврейское слово בּוֹר может обозначать яму или водосборник; здесь водосборник служил местом заключения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  choice: Эвед-Мелех
  rationale: Личное имя передано транслитерацией, а не переведено как «слуга царя».
- source_word: הָאֲנָשִׁים בְּיָדוֹ
  choice: людей с собой
  rationale: Оборот буквально означает людей «в его руке», то есть сопровождавших его или находившихся под его руководством; выбран естественный русский эквивалент.
- source_word: בֵית הַמֶּלֶךְ
  choice: царский дворец
  rationale: В данном повествовательном контексте «дом царя» обозначает дворцовый комплекс; «царский дворец» ясно и естественно передаёт смысл.
- source_word: אֶל תַּחַת הָאוֹצָר
  choice: в помещение под кладовой
  rationale: תַּחַת указывает на нижнее пространство, а אוֹצָר может означать кладовую, хранилище или сокровищницу. Наличие старой ткани делает «кладовую» наиболее вероятным контекстуальным вариантом.
- source_word: בְּלוֹיֵ הַסְּחָבוֹת
  choice: истёртые лоскутья
  rationale: Передаёт одновременно ветхость предметов и значение обрывков или кусков ткани.
- source_word: וּבְלוֹיֵ מְלָחִים
  choice: изношенную одежду
  rationale: Редкое מְלָחִים точно не определено, но параллелизм и следующий стих указывают на старые тканевые предметы; неопределённость отмечена в сноске.
- source_word: וַיְשַׁלְּחֵם
  choice: спустил их
  rationale: Основное значение глагола — «послал», однако направление к находившемуся в водосборнике Иеремии и упоминание верёвок подразумевают спуск.
- source_word: הַבּוֹר
  choice: водосборник
  rationale: Слово может обозначать яму или водосборную цистерну. В контексте этого рассказа речь идёт о водосборнике, использованном как место заключения.
- source_word: בַּחֲבָלִים
  choice: на верёвках
  rationale: Предлог בְּ обозначает средство действия; русское выражение естественно передаёт инструментальный смысл.
