source:
  edition: WLC
  text: וְ/כִֽי יִשְׁמְע֣וּ הַ/שָּׂרִים֮ כִּֽי דִבַּ֣רְתִּי אִתָּ/ךְ֒ וּ/בָ֣אוּ אֵלֶ֣י/ךָ וְֽ/אָמְר֪וּ אֵלֶ֟י/ךָ הַגִּֽידָ/ה נָּ֨א לָ֜/נוּ מַה דִּבַּ֧רְתָּ אֶל הַ/מֶּ֛לֶךְ אַל תְּכַחֵ֥ד מִמֶּ֖/נּוּ וְ/לֹ֣א נְמִיתֶ֑/ךָ וּ/מַה דִּבֶּ֥ר אֵלֶ֖י/ךָ הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/025.yaml
  text: But if the officials hear that I have spoken with you[a], and they come to you and say to you, ‘Please tell us what you said to the king; do not hide it from us, and we will not put you to death, and what the king said to you,’
translation:
  language: ru
  text: 'Но если сановники[a] услышат, что я говорил с тобой, они придут к тебе и скажут: «Скажи нам, пожалуйста, что ты сказал царю. Не скрывай этого от нас, и мы не предадим тебя смерти. Скажи также, что царь сказал тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «князья»; здесь имеются в виду царские или государственные правители.'
    reason: Лексема שָׂרִים может обозначать князей, начальников или высокопоставленных должностных лиц; примечание сохраняет традиционную альтернативу, не создавая впечатления, будто речь непременно идёт о членах царской семьи.
lexical_decisions:
- source_word: וְכִי
  choice: Если же
  rationale: Сочетание вводит условную ситуацию, продолжая предыдущую речь; частица «же» естественно передаёт связующий и слегка контрастный оттенок.
- source_word: הַשָּׂרִים
  choice: сановники[a]
  rationale: В данном контексте речь идёт о высших придворных или государственных должностных лицах, а не обязательно о царских сыновьях; «сановники» точно и естественно для повествования о царском дворе.
- source_word: דִבַּרְתִּי אִתָּךְ
  choice: я говорил с тобой
  rationale: Так передаётся состоявшийся разговор царя с Иеремией без излишне книжной конструкции.
- source_word: וּבָאוּ אֵלֶיךָ
  choice: то придут к тебе
  rationale: В условной последовательности русское будущее время с соотносительным «то» ясно выражает предполагаемое следствие.
- source_word: הַגִּידָה נָּא לָנוּ
  choice: Расскажи нам, пожалуйста
  rationale: Императив с נָא выражает настойчивую просьбу; эта формулировка естественна в современной русской речи.
- source_word: מַה דִּבַּרְתָּ אֶל־הַמֶּלֶךְ
  choice: о чём ты говорил с царём
  rationale: Русская конструкция «говорить с кем-либо о чём-либо» естественно передаёт содержание разговора; взаимность беседы далее раскрывается отдельным вопросом о словах царя.
- source_word: אַל־תְּכַחֵד מִמֶּנּוּ
  choice: Ничего от нас не скрывай
  rationale: Глагол כחד означает скрывать или утаивать; «ничего» естественно восполняет подразумеваемый объект в русском языке.
- source_word: וְלֹא נְמִיתֶךָ
  choice: и мы не предадим тебя смерти
  rationale: Каузативная форма מות буквально указывает на причинение смерти; выражение сохраняет официальный и угрожающий оттенок.
- source_word: וּמַה דִּבֶּר אֵלֶיךָ הַמֶּלֶךְ
  choice: Расскажи и о том, что царь говорил тебе
  rationale: Повтор глагола «расскажи» делает присоединённое требование ясным по-русски, не меняя содержания еврейского текста.
