base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/006.yaml
  text: So they took Jeremiah and threw him into the cistern of Malkijah the king’s son[a], which was in the court of the guard, and they lowered Jeremiah with ropes. Now there was no water in the cistern, but only mud[c][b], and Jeremiah sank into the mud.
translation:
  language: ru
  text: Тогда они взяли Иеремию и бросили его в водосборную яму[a] Малкии, сына царя, которая находилась во дворе стражи[b]. Они спустили Иеремию на верёвках. В яме не было воды, а только грязь[c], и Иеремия погрузился в грязь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «яму» или «цистерну». Еврейское בור может означать яму или цистерну; отсутствие воды и наличие грязи указывают здесь на водосборную яму.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во дворе заключения». Вероятно, речь идёт об охраняемом месте содержания под стражей.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «жижу» или «ил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: взяли
  rationale: Основное значение לקח естественно передаёт начало действия; «схватили» возможно по контексту, но добавляет оттенок насилия, не выраженный самим глаголом.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ אֶל הַבּוֹר
  choice: бросили его в водосборную яму
  rationale: השליך обозначает бросание, а בור — яму или водосборник. Упоминание отсутствия воды и наличия грязи указывает на водосборную яму, при этом более широкое значение сохранено в сноске.
- source_word: מַלְכִּיָּהוּ בֶן הַמֶּלֶךְ
  choice: Малкии, сына царя
  rationale: Имя передано как «Малкия» по еврейской форме; конструкция בן המלך переведена прямо, без вывода о праве на престол или возрасте человека.
- source_word: אֲשֶׁר בַּחֲצַר הַמַּטָּרָה
  choice: которая находилась во дворе стражи
  rationale: חצר — огороженный двор, а מטרה в книге Иеремии обозначает охраняемое место содержания. «Двор стражи» сохраняет эту связь, не отождествляя его безоговорочно с обычной тюрьмой.
- source_word: וַיְשַׁלְּחוּ אֶת יִרְמְיָהוּ בַּחֲבָלִים
  choice: Иеремию спустили на верёвках
  rationale: Хотя שלח обычно означает «посылать» или «отпускать», сочетание с верёвками и ямой здесь ясно описывает спуск.
- source_word: טִיט
  choice: грязь
  rationale: טיט означает мокрую грязь, топь или ил. «Грязь» — ясный современный эквивалент, а близкая альтернатива приведена в сноске.
- source_word: וַיִּטְבַּע יִרְמְיָהוּ בַּטִּיט
  choice: Иеремия погрузился в грязь
  rationale: טבע передаёт погружение или увязание. «Погрузился» сохраняет направленность движения вниз и серьёзность опасности.
