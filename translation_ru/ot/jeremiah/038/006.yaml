  register: 'Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранена последовательность еврейского текста: Иеремию «бросили» в яму и затем «спустили» на верёвках; кажущееся напряжение между действиями не сглажено. «Водосборная яма» понятнее в данном древнем контексте, чем техническое «цистерна».'
