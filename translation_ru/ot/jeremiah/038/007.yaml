  text: וַ/יִּשְׁמַ֡ע עֶֽבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י אִ֣ישׁ סָרִ֗יס וְ/הוּא֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ כִּֽי נָתְנ֥וּ אֶֽת יִרְמְיָ֖הוּ אֶל הַ/בּ֑וֹר וְ/הַ/מֶּ֥לֶךְ יוֹשֵׁ֖ב בְּ/שַׁ֥עַר בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/007.yaml
  text: Ebed-melech the Cushite[a], a court official who was in the king’s house, heard that they had put Jeremiah into the cistern[c][b], while the king was sitting at the Benjamin Gate.
translation:
  language: ru
  text: Евед-Мелех, кушитянин[a], придворный[c], находившийся в царском дворце, услышал, что Иеремию поместили в водосборник[b]. В это время царь сидел у Вениаминовых ворот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть человек из Куша; в традиционных переводах — «эфиоп».
    reason: cultural_note
  - marker: b
    text: 'Или: «в яму». Еврейское слово может означать яму или водосборник; из дальнейшего контекста видно, что здесь речь идёт о водосборнике.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «евнух». Еврейское слово может обозначать как евнуха, так и царского придворного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Обычное повествовательное значение שׁמע; прямо передаёт получение известия без добавления отсутствующего в оригинале временного наречия.
- source_word: עֶבֶד מֶלֶךְ
  choice: Евед-Мелех
  rationale: В данном контексте это личное имя; оно транслитерировано, а не переведено как нарицательное сочетание «слуга царя».
- source_word: הַכּוּשִׁי
  choice: кушитянин
  rationale: Обозначает человека из Куша и сохраняет древнее этногеографическое наименование без анахроничной замены на «эфиоп».
- source_word: אִישׁ סָרִיס
  choice: придворный
  rationale: סָרִיס может означать как евнуха, так и царского служащего. Контекст ясно указывает на положение при дворе, тогда как физическое значение остаётся возможным и отмечено в сноске.
- source_word: וְהוּא בְּבֵית הַמֶּלֶךְ
  choice: находившийся в царском дворце
  rationale: בֵּית הַמֶּלֶךְ буквально «дом царя», но в данном повествовательном контексте естественно обозначает царский дворец; причастный оборот сохраняет характеристику и местонахождение Евед-Мелеха.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание услышанного.
- source_word: נָתְנוּ אֶת־יִרְמְיָהוּ אֶל־הַבּוֹר
  choice: Иеремию бросили в водосборник
  rationale: בּוֹר допускает значения «яма» и «водосборник». Ближайший контекст главы показывает, что речь о сооружении для сбора воды; «бросили» естественно передаёт насильственное помещение внутрь.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: В это время царь сидел
  rationale: Клауза сообщает сопутствующее обстоятельство. Отдельное предложение делает временную связь ясной и не создаёт впечатления, будто местонахождение царя входит в содержание услышанного.
- source_word: בְּשַׁעַר בִּנְיָמִן
  choice: у Вениаминовых ворот
  rationale: Естественное русское обозначение местонахождения возле названных городских ворот.
