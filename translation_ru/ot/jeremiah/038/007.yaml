translation_notes:
  register: 'Современный литературный русский язык, ясный и сдержанно-достоинственный. Двусмысленность слова סָרִיס не перегружает основной текст: функциональный смысл передан словом «придворный», однако буквальное значение «евнух» следует сохранить для читателя. Поэтому к слову «придворный» нужна дополнительная сноска; с учётом требования о маркерах оптимальная публикационная форма основного текста: «придворный[c]», а текст сноски [c]: «Или: “евнух”. Еврейское слово может обозначать как евнуха, так и царского придворного». В представленном наборе footnotes эта сноска не добавлена только во избежание несовпадения с уже сформированным полем text; перед вёрсткой её следует включить.'
