base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/028.yaml
  text: And Jeremiah remained in the court of the guard until the day Jerusalem was captured[b][a]. And it happened when Jerusalem was captured—
translation:
  language: ru
  text: Иеремия оставался во дворе стражи до того дня, когда Иерусалим был взят[b]. И было, когда Иерусалим был взят —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь обрывается: «И было, когда Иерусалим был взят —». Вероятно, это переход к следующему повествовательному разделу, а не самостоятельное законченное предложение.'
    reason: textual_variant
  - marker: b
    text: 'Или: «захвачен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: оставался
  rationale: В данном контексте ישׁב обозначает продолжающееся пребывание Иеремии под стражей; «оставался» не создаёт впечатления добровольного проживания.
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: во дворе стражи
  rationale: חָצֵר означает двор, а מַטָּרָה здесь указывает на стражу или место содержания под надзором. Перевод сохраняет официально-тюремный контекст и принятую в книге формулировку.
- source_word: עַד יוֹם אֲשֶׁר
  choice: до того дня, когда
  rationale: Конструкция отмечает временной предел пребывания Иеремии и естественно передаётся по-русски этой формулой.
- source_word: נִלְכְּדָה
  choice: был взят
  rationale: Нифаль глагола לכד означает «быть захваченным, взятым»; применительно к городу «был взят» — естественная современная военная формулировка.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Общепринятая русская форма названия города.
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: И когда
  rationale: Фраза служит незавершённым повествовательным переходом. Русское «И когда» сохраняет временную связь и намеренную синтаксическую незавершённость, не добавляя отсутствующего в еврейском тексте завершения.
