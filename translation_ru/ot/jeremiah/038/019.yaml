translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок реплики сделан естественным для русского, а местоимение «те» устраняет двусмысленность: надругаться, по смыслу, должны халдеи, которым перебежчики могут выдать царя.'
