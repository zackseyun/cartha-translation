base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/019.yaml
  text: Then King Zedekiah said to Jeremiah[a], “I am afraid of the Judeans who have defected to the Chaldeans[e][d][c][b], lest they hand me over to them and they mistreat me.”
translation:
  language: ru
  text: 'И сказал царь Седекия Иеремии: «Я боюсь иудеев[a], перешедших на сторону халдеев[b][c]: как бы они не выдали меня халдеям[d], а те не стали надо мной издеваться[e]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «евреев». Здесь еврейское слово обозначает именно людей Иудеи.
    reason: lexical_alternative
  - marker: b
    text: Или «сдавшихся халдеям».
    reason: lexical_alternative
  - marker: c
    text: То есть вавилонян; буквально «халдеев».
    reason: lexical_alternative
  - marker: d
    text: Буквально «отдали меня в их руку», то есть в их власть.
    reason: lexical_alternative
  - marker: e
    text: Или «жестоко обошлись со мной», «дурно со мной обращались».
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹאֵג
  choice: боюсь
  rationale: В данном контексте глагол выражает страх Седекии перед возможными последствиями сдачи; «боюсь» естественно и точно передаёт этот смысл.
- source_word: הַיְּהוּדִים
  choice: иудеев
  rationale: В историческом контексте речь идёт о жителях и подданных Иудеи; «иудеи» точнее, чем более широкое и потенциально анахроничное «евреи».
- source_word: נָפְלוּ אֶל
  choice: перешедших на сторону
  rationale: Военно-политическая идиома означает переход к противнику; выбранная формулировка ясна и не утверждает непременно формальную капитуляцию.
- source_word: הַכַּשְׂדִּים
  choice: халдеев
  rationale: Сохраняет конкретное обозначение исходного текста, обычно относящееся в Иеремии к вавилонским силам.
- source_word: פֶּן
  choice: как бы не
  rationale: Естественно вводит по-русски опасение относительно нежелательного исхода.
- source_word: יִתְּנוּ אֹתִי בְּיָדָם
  choice: они не выдали меня им в руки
  rationale: Сохраняет образ «дать в руку» и одновременно ясно передаёт передачу Седекии во власть халдеев.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: и те не надругались надо мной
  rationale: Передаёт жестокое, унизительное обращение, не сводя значение только к насмешкам; «те» проясняет смену подразумеваемого действующего лица.
