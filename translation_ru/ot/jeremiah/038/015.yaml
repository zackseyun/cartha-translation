base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/015.yaml
  text: Jeremiah said to Zedekiah[a], “If I tell you, will you not surely put me to death? And if I advise you[b], you will not listen to me.”
translation:
  language: ru
  text: 'Иеремия сказал Седекии: «Если я скажу тебе, разве ты не предашь меня непременно смерти[a]? А если дам тебе совет, ты меня не послушаешь[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «непременно умертвишь меня». В еврейском тексте абсолютный инфинитив употреблён вместе с личной формой того же глагола для усиления.'
    reason: lexical_alternative
  - marker: b
    text: «Не послушаешь» здесь может также означать «не прислушаешься» или «не повинуешься».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אַגִּיד לְךָ
  choice: Если я скажу тебе
  rationale: В данном контексте כִּי вводит условное возражение Иеремии, а Hiphil глагола נגד означает «сказать, сообщить, открыть». Такая передача естественно выражает условие по-русски.
- source_word: הֲלוֹא
  choice: разве ты не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; конструкция «разве ты не» сохраняет его вопросительную силу.
- source_word: הָמֵת תְּמִיתֵנִי
  choice: предашь меня смерти
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает неизбежность действия. «Предашь меня смерти» уместно в обращении к царю, который распорядится о казни; усиление пояснено в сноске.
- source_word: וְכִי אִיעָצְךָ
  choice: А если дам тебе совет
  rationale: וְכִי вводит второе параллельное условие, а יעץ означает «советовать, давать совет». Русская формулировка естественна и сохраняет структуру речи.
- source_word: לֹא תִשְׁמַע אֵלַי
  choice: ты всё равно меня не послушаешь
  rationale: שׁמע с אֶל означает слушать кого-либо и может подразумевать принятие сказанного или повиновение. «Не послушаешь» сохраняет эту смысловую широту; «всё равно» естественно передаёт категоричность ответа после условного придаточного.
- source_word: יִרְמְיָהוּ / צִדְקִיָּהוּ
  choice: Иеремия / Седекия
  rationale: Использованы традиционные и общеупотребительные русские формы библейских имён.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи перед царём. Риторический вопрос и параллельные условные конструкции сохранены; неоднозначность שׁמע не сведена исключительно к слушанию или повиновению.
