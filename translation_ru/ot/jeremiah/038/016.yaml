base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/016.yaml
  text: Then King Zedekiah swore secretly to Jeremiah[a], saying, “As Yahweh lives, who made this life for us, I will not put you to death, nor will I give you into the hand of these men who are seeking your life.”
translation:
  language: ru
  text: 'Тогда царь Седекия тайно поклялся Иеремии: «Жив Яхве, сотворивший для нас эту жизнь[a]: я не убью тебя и не отдам тебя в руки этих людей, которые ищут твоей жизни».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даровавший нам эту жизнь». Буквальнее по-еврейски: «сотворивший для нас эту жизнь (душу)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: поклялся
  rationale: Глагол обозначает принесение клятвы; «поклялся» кратко и естественно передаёт торжественный характер речи.
- source_word: בַּסֵּתֶר
  choice: тайно
  rationale: Наречное выражение указывает, что клятва была дана без ведома других; «тайно» точно и естественно в данном контексте.
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Сохранена обычная древнееврейская формула клятвы и передано собственное имя Бога.
- source_word: אֵת אֲשֶׁר עָשָׂה לָנוּ אֶת הַנֶּפֶשׁ הַזֹּאת
  choice: сотворивший для нас эту жизнь
  rationale: «Сотворивший» сохраняет созидательное значение עָשָׂה, а נֶפֶשׁ здесь обозначает жизнь; необычная конструкция оригинала остаётся понятной по-русски.
- source_word: אִם אֲמִיתֶךָ
  choice: я не предам тебя смерти
  rationale: После формулы клятвы אִם имеет подразумеваемую отрицательную силу. Выражение передаёт каузативный глагол «умертвить» в dignified modern Russian.
- source_word: וְאִם אֶתֶּנְךָ בְּיַד
  choice: и не отдам тебя в руки
  rationale: Отрицание восполнено из эллиптической формулы клятвы, а образ «отдать в руки» сохранён как естественный русский библейский оборот.
- source_word: מְבַקְשִׁים אֶת נַפְשֶׁךָ
  choice: ищут твоей жизни
  rationale: Сохранена прозрачная метафора оригинала, означающая стремление убить Иеремию, без её пояснительной замены в основном тексте.
theological_decisions:
- issue: Передача имени יְהוָה в формуле клятвы
  choice: Яхве
  alternative: Господь
  rationale: Оригинал прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл נֶפֶשׁ в выражении о Боге
  choice: жизнь
  alternative: душа
  rationale: В контексте клятвы и параллельного упоминания угрозы жизни слово относится к живой жизни человека, а не однозначно к нематериальной душе.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием царской клятвы. Синтаксис формулы клятвы сохранён, но эллиптическое еврейское отрицание выражено явно для понятности. Маркер сноски поставлен после всей цитаты, к которой относится пояснение.
