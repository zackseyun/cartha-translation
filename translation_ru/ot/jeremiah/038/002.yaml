  text: כֹּה֮ אָמַ֣ר יְהוָה֒ הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יֹּצֵ֤א אֶל הַ/כַּשְׂדִּים֙ יחיה וְ/הָיְתָה לּ֥/וֹ נַפְשׁ֛/וֹ לְ/שָׁלָ֖ל וָ/חָֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/002.yaml
  text: 'Thus says Yahweh: He who remains in this city will die by the sword[a], by famine, and by pestilence; but he who goes out to the Chaldeans will live, and his life will be to him as spoil, and he will live.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Кто останется в этом городе, тот умрёт от меча, голода и мора; а кто выйдет к халдеям, тот будет жить. Его жизнь будет ему добычей[a], и он будет жить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть он унесёт с собой хотя бы собственную жизнь, как добычу, и таким образом спасётся.
    reason: Пояснение древнееврейской военной метафоры, которую основной текст сохраняет буквально.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо представленное тетраграмматоном, в принятой современной русской форме.
- source_word: הַיֹּשֵׁב בָּעִיר הַזֹּאת
  choice: кто останется в этом городе
  rationale: Причастие от ישׁב здесь означает продолжать находиться, оставаться в осаждённом городе, а не буквально «сидеть».
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: от меча, голода и мора
  rationale: Сохраняет характерную для Иеремии тройную формулу бедствий; «мор» передаёт דֶּבֶר как смертоносное повальное бедствие и поддерживает торжественный пророческий регистр.
- source_word: וְהַיֹּצֵא אֶל הַכַּשְׂדִּים
  choice: а кто выйдет к халдеям
  rationale: Сохраняет буквальное «выйдет к», не подменяя его контекстуально подразумеваемым «сдастся», и передаёт этноним הַכַּשְׂדִּים как «халдеи».
- source_word: יִחְיֶה ... וָחָי
  choice: будет жить ... и он будет жить
  rationale: Сохраняет намеренный повтор корня חיה и заключительное усиление исходного текста.
- source_word: וְהָיְתָה לוֹ נַפְשׁוֹ לְשָׁלָל
  choice: его жизнь будет ему добычей
  rationale: נֶפֶשׁ в контексте означает жизнь человека, а не отдельно мыслимую нематериальную душу; «добычей» сохраняет военную метафору שָׁלָל.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет эту референцию без замены титулом.
- issue: Значение נֶפֶשׁ в выражении נַפְשׁוֹ לְשָׁלָל
  choice: его жизнь будет ему добычей
  alternative: его душа будет ему добычей; он спасёт свою жизнь
  rationale: Речь идёт о физическом избавлении от гибели при осаде. «Жизнь» не вносит узкого учения о составе человека, а образ добычи сохраняет напряжённую метафору оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся ясным для обычного читателя; повтор «будет жить» сохранён как риторическая особенность еврейского текста. «Мор» выбран как краткое литературное обозначение смертоносной эпидемии.
