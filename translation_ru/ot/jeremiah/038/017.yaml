  text: וַ/יֹּ֣אמֶר יִרְמְיָ֣הוּ אֶל צִדְקִיָּ֡הוּ כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם יָצֹ֨א תֵצֵ֜א אֶל שָׂרֵ֤י מֶֽלֶךְ בָּבֶל֙ וְ/חָיְתָ֣ה נַפְשֶׁ֔/ךָ וְ/הָ/עִ֣יר הַ/זֹּ֔את לֹ֥א תִשָּׂרֵ֖ף בָּ/אֵ֑שׁ וְ/חָיִ֖תָה אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/017.yaml
  text: 'Then Jeremiah said to Zedekiah[a], “Thus says Yahweh, the God of hosts, the God of Israel: If you indeed go out to the officials of the king of Babylon, your life will be spared, and this city will not be burned with fire[c][b]; and you and your household will live.”'
translation:
  language: ru
  text: 'Тогда Иеремия сказал Седекии: «Так говорит Яхве, Бог воинств, Бог Израиля: если ты непременно выйдешь[a] к сановникам царя Вавилона, то останешься в живых[b], и этот город не будет сожжён огнём; ты и твои домашние[c] останетесь в живых».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «если ты непременно выйдешь». В еврейском тексте абсолютный инфинитив употреблён вместе с личной формой глагола для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твоя душа будет жить». Здесь «душа» означает жизнь или самого человека, то есть его спасение от смерти.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «ты и твой дом будете жить». Под «домом» здесь понимаются семья и домашние, а не только здание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бог Воинств
  rationale: Сохраняет конструкцию «Бог воинств»; слово может охватывать небесные и земные силы, поэтому более узкое «Бог армий» не выбрано.
- source_word: אִם יָצֹא תֵצֵא
  choice: если ты действительно выйдешь
  rationale: Наречие «действительно» естественно передаёт усиление, выраженное сочетанием абсолютного инфинитива с личной формой глагола.
- source_word: אֶל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: к сановникам царя Вавилона
  rationale: שָׂרִים обозначает высокопоставленных должностных лиц и может включать военачальников; «сановники» сохраняет широту значения без неоправданного сужения до военной должности.
- source_word: וְחָיְתָה נַפְשֶׁךָ
  choice: то останешься в живых
  rationale: В данном контексте נֶפֶשׁ означает жизнь или самого человека, которому обещано физическое спасение, а не отдельно мыслимую душу.
- source_word: לֹא תִשָּׂרֵף בָּאֵשׁ
  choice: не будет сожжён огнём
  rationale: Сохраняет пассивную форму и явное упоминание огня в еврейском тексте.
- source_word: וְחָיִתָה אַתָּה וּבֵיתֶךָ
  choice: останетесь в живых ты и твои домашние
  rationale: בַּיִת здесь означает дом как семью и зависимых от царя людей, а не здание; «домашние» естественно передаёт этот смысл.
- source_word: וַיֹּאמֶר יִרְמְיָהוּ אֶל צִדְקִיָּהוּ
  choice: Тогда Иеремия сказал Седекии
  rationale: «Тогда» естественно передаёт продвижение повествования, выраженное последовательной формой с וַ.
theological_decisions:
- issue: Передача божественного имени
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя יהוה; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение נֶפֶשׁ в выражении о спасении
  choice: останешься в живых
  alternative: твоя душа будет жить
  rationale: Контекст говорит о сохранении жизни Седекии при сдаче; такое прочтение не привносит в текст более позднее противопоставление души и тела.
- issue: Объём значения בֵּיתֶךָ
  choice: твои домашние
  alternative: твой дом
  rationale: Речь может идти о семье и людях царского дома. Выбор не сводит обещание к сохранности здания.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет условную структуру оригинала, но избегает неестественного буквализма. Все примечания поставлены непосредственно при соответствующих выражениях.
