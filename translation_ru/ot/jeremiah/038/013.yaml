translation_notes:
  register: 'Современный литературный русский язык с ясной повествовательной формой. Сохранена последовательность двух еврейских глаголов: сначала Иеремию тянут за верёвки, затем окончательно вытаскивают из водосборника. Термин «двор стражи» краток, достоин по регистру и не вносит лишней архитектурной конкретизации.'
