  text: So they pulled Jeremiah up with the ropes and brought him up out of the cistern[b][a], and Jeremiah remained in the court of the guard.
translation:
  language: ru
  text: Они вытянули Иеремию верёвками и подняли его из водосборной ямы[a]. Иеремия остался во дворе стражи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из ямы» или «из цистерны». Еврейское слово может обозначать яму, цистерну или темницу; в данном повествовании речь идёт о водосборной яме.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во дворе караульного помещения» или «во дворе тюрьмы». Еврейское выражение обозначает охраняемое место, где содержали Иеремию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁכוּ
  choice: потянули
  rationale: Глагол משׁך означает «тянуть»; выбранное слово естественно передаёт физическое действие, совершённое при помощи верёвок.
- source_word: בַּחֲבָלִים
  choice: за верёвки
  rationale: חֲבָלִים — «верёвки, канаты»; предлог ב здесь указывает на средство действия. Русское «за верёвки» естественно описывает способ подъёма.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: вытащили его
  rationale: Каузативная форма עלה означает «поднять, вывести наверх». В сочетании с предыдущим «потянули» глагол «вытащили» ясно передаёт завершённое извлечение из глубокой ямы и не создаёт тяжеловесного повтора.
- source_word: מִן הַבּוֹר
  choice: из водосборника
  rationale: בּוֹר может обозначать яму, цистерну или темницу. По контексту речь идёт о вырубленном резервуаре для воды; «водосборник» понятно современному читателю и точнее общего «яма».
- source_word: וַיֵּשֶׁב
  choice: остался
  rationale: ישׁב может означать «сидеть, жить, пребывать». Здесь речь о дальнейшем месте содержания Иеремии, поэтому «остался» передаёт контекстуальный смысл.
- source_word: בַּחֲצַר
  choice: во дворе
  rationale: חָצֵר обозначает двор или внутренний двор; «во дворе» — естественный и точный русский эквивалент.
- source_word: הַמַּטָּרָה
  choice: стражи
  rationale: מַטָּרָה в книге Иеремии обозначает охраняемое место содержания. «Двор стражи» сохраняет связь с охраной и не уточняет без достаточных оснований, что это отдельная тюрьма или караульное здание.
