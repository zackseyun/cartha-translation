  yaml_path: translation/ot/jeremiah/038/012.yaml
  text: Then Ebed-melech the Cushite said to Jeremiah[a], “Please put these worn-out rags and torn clothes under your armpits[c][b], under the ropes.” And Jeremiah did so.
translation:
  language: ru
  text: 'Тогда Эвед-Мелех, кушитянин[a], сказал Иеремии: «Подложи, пожалуйста, себе под мышки, под верёвки, ветхие лоскуты и старую одежду[b][c]». Иеремия так и сделал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эфиоп». В еврейском тексте — «кушитянин», то есть человек из Куша.'
    reason: lexical_alternative
  - marker: b
    text: Еврейские названия этих материалов редки; вероятно, имеются в виду изношенные куски ткани или одежды, которыми можно было защитить тело Иеремии от верёвок.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «под сочленения твоих рук»; по смыслу здесь имеется в виду область под мышками, на которую при подъёме давили бы верёвки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  choice: Эвед-Мелех
  rationale: Личное имя передано транслитерацией, а не переведено как «слуга царя».
- source_word: הַכּוּשִׁי
  choice: кушитянин
  rationale: Прямо передаёт еврейское этногеографическое обозначение человека из Куша; традиционное «эфиоп» более интерпретативно.
- source_word: שִׂים נָא
  choice: Положи, пожалуйста
  rationale: Сохраняет повелительную форму и смягчающую, просительную силу частицы נָא, оставаясь естественным по-русски.
- source_word: בְּלוֹאֵי הַסְּחָבוֹת וְהַמְּלָחִים
  choice: эти ветхие лоскуты и тряпки
  rationale: Оба обозначения относятся к изношенным тканевым вещам; второе слово редкое и не допускает полной лексической уверенности, поэтому выбран конкретный, но не чрезмерно узкий эквивалент.
- source_word: תַּחַת אַצִּלוֹת יָדֶיךָ
  choice: под мышки
  rationale: Буквальное выражение связано с сочленениями или прилегающими частями рук; в сцене подъёма на верёвках речь естественно понимается как область под мышками.
- source_word: מִתַּחַת לַחֲבָלִים
  choice: под верёвки
  rationale: Указывает, что ткань должна служить прокладкой между телом Иеремии и верёвками.
- source_word: וַיַּעַשׂ יִרְמְיָהוּ כֵּן
  choice: Иеремия так и сделал
  rationale: Естественно передаёт обычную древнееврейскую повествовательную формулу исполнения указания.
