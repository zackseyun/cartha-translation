source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא תֵצֵ֗א אֶל שָׂרֵי֙ מֶ֣לֶךְ בָּבֶ֔ל וְ/נִתְּנָ֞ה הָ/עִ֤יר הַ/זֹּאת֙ בְּ/יַ֣ד הַ/כַּשְׂדִּ֔ים וּ/שְׂרָפ֖וּ/הָ בָּ/אֵ֑שׁ וְ/אַתָּ֖ה לֹֽא תִמָּלֵ֥ט מִ/יָּדָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/018.yaml
  text: But if you do not go out to the officials of the king of Babylon[a], then this city will be given into the hand of the Chaldeans, and they will burn it with fire[b], and you will not escape from their hand.
translation:
  language: ru
  text: Но если ты не выйдешь к сановникам вавилонского царя[a], то этот город будет отдан в руки халдеев; они сожгут его, а ты не ускользнёшь из их рук[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к князьям вавилонского царя»; возможно также: «к военачальникам вавилонского царя». Еврейское слово обозначает высокопоставленных должностных лиц и само по себе не уточняет их должность.'
    reason: lexical_alternative
  - marker: b
    text: Выражения «в руки халдеев» и «из их рук» — древнееврейский образ, обозначающий власть одних людей над другими.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא תֵצֵא
  choice: Но если ты не выйдешь
  rationale: Сохраняет буквальное значение глагола «выйти» и условное противопоставление контексту; подразумеваемая сдача не вносится непосредственно в текст.
- source_word: אֶל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: к сановникам вавилонского царя
  rationale: «Сановники» естественно передаёт широкое значение שָׂרִים — высокопоставленные должностные лица, вельможи или военачальники — без неоправданного уточнения их ранга.
- source_word: וְנִתְּנָה הָעִיר הַזֹּאת
  choice: то этот город будет отдан
  rationale: Пассивная конструкция исходного текста сохранена, а «то» естественно обозначает следствие условия по-русски.
- source_word: בְּיַד הַכַּשְׂדִּים
  choice: в руки халдеев
  rationale: Сохраняет прозрачный древнееврейский образ руки как власти и одновременно звучит естественно в современном русском языке.
- source_word: וּשְׂרָפוּהָ בָּאֵשׁ
  choice: они сожгут его
  rationale: Русский глагол «сожгут» уже выражает уничтожение огнём; буквальное «сожгут огнём» было бы стилистически тяжеловесным и не добавляло бы смысла.
- source_word: וְאַתָּה לֹא תִמָּלֵט מִיָּדָם
  choice: а ты не ускользнёшь из их рук
  rationale: Передаёт значение Niphal глагола מלט как личного избавления или бегства и сохраняет повтор образа «руки»; союз «а» подчёркивает переход от участи города к участи царя.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен для широкого читателя; сохранены условная структура, пассивный залог и сквозной образ «рук» как власти. «Вавилонский царь» предпочтён более тяжёлому «царь Вавилона» в составе предложной группы.
