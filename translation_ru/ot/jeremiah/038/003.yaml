  text: כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנָּתֹ֨ן תִּנָּתֵ֜ן הָ/עִ֣יר הַ/זֹּ֗את בְּ/יַ֛ד חֵ֥יל מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/003.yaml
  text: 'Thus says Yahweh: This city will surely be given into the hand of the army of the king of Babylon[a], and he will capture it.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Этот город непременно будет отдан в руки войска вавилонского царя, и царь захватит его».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Естественная для современного русского языка передача пророческой вестнической формулы; настоящее время выражает авторитетно провозглашаемое слово, а личное имя יְהוָה передано как «Яхве».
- source_word: הִנָּתֹן תִּנָּתֵן
  choice: непременно будет отдан
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает утверждение; «непременно» передаёт подчёркнутую неизбежность без архаизации.
- source_word: הָעִיר הַזֹּאת
  choice: этот город
  rationale: Прямая и естественная передача существительного с указательным местоимением.
- source_word: בְּיַד
  choice: в руки
  rationale: Сохранён понятный по-русски древнееврейский образ передачи под власть или контроль противника.
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: войска вавилонского царя
  rationale: В военном контексте חֵיל обозначает войско; русская конструкция естественна и сохраняет зависимость от «царя Вавилона».
- source_word: וּלְכָדָהּ
  choice: и тот захватит его
  rationale: Глагол לכד в отношении города означает «захватить». Указательное местоимение «тот» сохраняет грамматический переход к царю как субъекту и снижает риск ошибочно отнести действие к городу или войску.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерационная форма «Яхве» сохраняет личное заветное имя и следует заданной проектной норме.
- issue: Субъект формы וּלְכָדָהּ
  choice: вавилонский царь, обозначенный словом «тот»
  alternative: войско захватит город
  rationale: Единственное число мужского рода грамматически естественно соотносится с ближайшим мужским существительным «царь», хотя фактическим орудием захвата служит войско. Перевод не устраняет этот переход.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Эмфаза сохранена словом «непременно», а понятная русская метафора «отдан в руки» не требует примечания.
