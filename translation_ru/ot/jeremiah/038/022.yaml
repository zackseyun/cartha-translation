  text: וְ/הִנֵּ֣ה כָל הַ/נָּשִׁ֗ים אֲשֶׁ֤ר נִשְׁאֲרוּ֙ בְּ/בֵ֣ית מֶֽלֶךְ יְהוּדָ֔ה מוּצָא֕וֹת אֶל שָׂרֵ֖י מֶ֣לֶךְ בָּבֶ֑ל וְ/הֵ֣נָּה אֹמְר֗וֹת הִסִּית֜וּ/ךָ וְ/יָכְל֤וּ לְ/ךָ֙ אַנְשֵׁ֣י שְׁלֹמֶ֔/ךָ הָטְבְּע֥וּ בַ/בֹּ֛ץ רַגְלֶ֖/ךָ נָסֹ֥גוּ אָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/022.yaml
  text: And behold[a], all the women who remain in the house of the king of Judah are being brought out to the officials of the king of Babylon, and they are saying, ‘The men at peace with you have misled you and overcome you; your feet have sunk into the mud[b]; they have turned back.’
translation:
  language: ru
  text: 'И вот, всех женщин, оставшихся во дворце царя Иудеи, выводят к сановникам царя Вавилона, и они говорят:


    «Твои друзья[a] ввели тебя в заблуждение

    и одолели тебя;

    твои ноги увязли в грязи[b],

    а твои друзья отступили».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «люди твоего мира» — то есть люди, состоявшие с тобой в дружеских отношениях, твои близкие или союзники.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в трясине».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет указательную и привлекающую внимание силу еврейского оборота, а также живость пророческого видения.
- source_word: נִשְׁאֲרוּ בְּבֵית מֶלֶךְ יְהוּדָה
  choice: оставшихся во дворце царя Иудеи
  rationale: «Дворец» естественно передаёт здесь царский дом как место пребывания женщин, не сводя выражение к обычному жилому зданию.
- source_word: מוּצָאוֹת
  choice: выводят
  rationale: Настоящее время передаёт живописную силу хофального причастия и его пассивно-каузативный смысл в естественной русской форме.
- source_word: שָׂרֵי מֶלֶךְ בָּבֶל
  choice: сановникам царя Вавилона
  rationale: «Сановники» обозначает высокопоставленных царских служащих, не уточняя без достаточных оснований их военный статус или княжеское происхождение.
- source_word: הִסִּיתוּךָ
  choice: ввели тебя в заблуждение
  rationale: Передаёт широкий смысл пагубного склонения или ложного направления, не сужая его до прямого обмана либо подстрекательства к конкретному поступку.
- source_word: וְיָכְלוּ לְךָ
  choice: и одолели тебя
  rationale: 'Кратко и естественно передаёт значение глагола יכל с ל: возобладать над кем-либо, оказаться сильнее.'
- source_word: אַנְשֵׁי שְׁלֹמֶךָ
  choice: твои друзья
  rationale: Естественно передаёт идиому «люди твоего мира», то есть близких или дружественно расположенных к царю людей; буквальный образ сохранён в сноске.
- source_word: הָטְבְּעוּ בַבֹּץ רַגְלֶךָ
  choice: они дали твоим ногам увязнуть в грязи
  rationale: Сохраняет каузативную форму множественного числа и образ беспомощного увязания, одновременно избегая неестественного русского оборота «погрузили твои ноги».
- source_word: נָסֹגוּ אָחוֹר
  choice: а сами отступили
  rationale: «Сами» естественно подчёркивает предательство прежних друзей после того, как царь оказался в беде; «отступили» сохраняет направительный образ исходного текста.
