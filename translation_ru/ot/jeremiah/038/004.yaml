source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הַ/שָּׂרִ֜ים אֶל הַ/מֶּ֗לֶךְ י֣וּמַת נָא֮ אֶת הָ/אִ֣ישׁ הַ/זֶּה֒ כִּֽי עַל כֵּ֡ן הֽוּא מְרַפֵּ֡א אֶת יְדֵי֩ אַנְשֵׁ֨י הַ/מִּלְחָמָ֜ה הַֽ/נִּשְׁאָרִ֣ים בָּ/עִ֣יר הַ/זֹּ֗את וְ/אֵת֙ יְדֵ֣י כָל הָ/עָ֔ם לְ/דַבֵּ֣ר אֲלֵי/הֶ֔ם כַּ/דְּבָרִ֖ים הָ/אֵ֑לֶּה כִּ֣י הָ/אִ֣ישׁ הַ/זֶּ֗ה אֵינֶ֨/נּוּ דֹרֵ֧שׁ לְ/שָׁל֛וֹם לָ/עָ֥ם הַ/זֶּ֖ה כִּ֥י אִם לְ/רָעָֽה־־־־־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/004.yaml
  text: Then the officials said to the king[a], “Please let this man be put to death, for in this way he is weakening the hands of the men of war who remain in this city, and the hands of all the people, by speaking to them words like these. For this man is not seeking the welfare of this people[c][b], but their harm.”
translation:
  language: ru
  text: 'И сказали сановники царю: «Пусть этого человека предадут смерти, потому что такими речами он лишает мужества[a] воинов, оставшихся в этом городе, и весь народ. Ведь этот человек ищет не благополучия[b] для этого народа, а беды».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ослабляет руки» — то есть обескураживает, лишает решимости.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мира». Древнееврейское слово может означать мир, благополучие и благосостояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: Слово обозначает высокопоставленных правителей или придворных должностных лиц; «сановники» естественно для повествования о царском дворе и не уточняет их ранг сверх текста.
- source_word: יוּמַת נָא אֶת־הָאִישׁ הַזֶּה
  choice: Пусть этого человека предадут смерти
  rationale: Пассивно-побудительная форма выражает требование казни, а נָא придаёт ему оттенок настойчивого ходатайства; русское «пусть» передаёт это без излишне вежливого «пожалуйста».
- source_word: מְרַפֵּא אֶת־יְדֵי
  choice: лишает мужества
  rationale: Буквально «ослабляет руки» — древнееврейская идиома со значением «обескураживает, деморализует». Смысл передан естественным современным русским выражением, а образ сохранён в сноске.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: воины
  rationale: Передаёт буквальное «мужи войны» кратко, достойно и без современного оттенка регулярной армии, возможного у слова «солдаты».
- source_word: לְדַבֵּר אֲלֵיהֶם כַּדְּבָרִים הָאֵלֶּה
  choice: такими речами
  rationale: Инфинитив указывает на средство деморализации, а сравнительная частица כ допускает значение «подобные/такие слова». Сжатая русская формулировка сохраняет эту мысль.
- source_word: דֹרֵשׁ לְשָׁלוֹם
  choice: ищет … благополучия
  rationale: שָׁלוֹם здесь может охватывать мир, целость и благополучие. «Благополучие» естественно противопоставляется беде и не сводит обвинение лишь к военному миру.
- source_word: כִּי אִם לְרָעָה
  choice: а беды
  rationale: Конструкция כִּי אִם вводит резкое противопоставление, а רָעָה в данном контексте означает зло, вред или бедствие, направленное против народа.
theological_decisions:
- issue: Объём значения שָׁלוֹם
  choice: благополучие
  alternative: мир
  rationale: Контекст допускает как мир, так и более общее благо народа. Основной текст использует широкое значение, а сноска сохраняет более буквальную альтернативу, не разрешая неоднозначность догматически.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Идиома передана по смыслу ради ясности, а её буквальный образ вынесен в сноску. Синтаксический параллелизм несколько сглажен: повтор «руки воинов… руки народа» заменён естественным русским сочетанием «лишает мужества… и весь народ».'
