  text: וַֽ/יִּשְׁמְע֛וּ הַ/כֹּהֲנִ֥ים וְ/הַ/נְּבִאִ֖ים וְ/כָל הָ/עָ֑ם אֶֽת יִרְמְיָ֔הוּ מְדַבֵּ֛ר אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/בֵ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/007.yaml
  text: And the priests and the prophets and all the people heard Jeremiah speaking these words in the house of Yahweh[a].
translation:
  language: ru
  text: И священники, и пророки, и весь народ слышали, как Иеремия произносил эти слова в доме Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храме Яхве». Буквально: «в доме Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: слышали
  rationale: Глагольная форма продолжает повествование о прошлом; «слышали» передаёт обычное значение שׁמע без добавочного смысла послушания.
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  choice: и священники, и пророки, и весь народ
  rationale: Повтор союза «и» естественно воспроизводит подчёркнутое перечисление трёх групп в еврейском тексте.
- source_word: אֶת יִרְמְיָהוּ מְדַבֵּר
  choice: как Иеремия произносил
  rationale: Конструкция с причастием показывает Иеремию в процессе речи; оборот «слышали, как… произносил» естественен по-русски и сохраняет длительный, одновременный характер действия.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: В контексте произносимой речи דְּבָרִים точнее всего означает «слова».
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняется буквальный образ «дома» как обозначения святилища и личное имя Бога; контекстуальный вариант «в храме Яхве» приведён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Передача בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: Основной текст сохраняет буквальную метафору еврейского выражения, а сноска сообщает ясный контекстуальный эквивалент, не устраняя образ из перевода.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «и» сохраняет ритм исходного перечисления; синтаксис при этом остаётся понятным обычному читателю.
