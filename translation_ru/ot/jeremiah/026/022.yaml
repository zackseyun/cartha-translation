  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֧לֶךְ יְהוֹיָקִ֛ים אֲנָשִׁ֖ים מִצְרָ֑יִם אֵ֣ת אֶלְנָתָ֧ן בֶּן עַכְבּ֛וֹר וַ/אֲנָשִׁ֥ים אִתּ֖/וֹ אֶל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/022.yaml
  text: 'Then King Jehoiakim sent men to Egypt: Elnathan son of Achbor[a], and men with him, to Egypt.'
translation:
  language: ru
  text: 'И послал царь Иоаким людей в Египет: Елнафана, сына Ахбора, и людей с ним — в Египет.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте слова «в Египет» повторены в конце стиха как указание места назначения Елнафана и людей с ним; повтор сохранён в переводе.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Форма от שׁלח обозначает отправление и продолжает повествовательную последовательность; союз «и» сохраняет связь с контекстом без избыточного уточнения.
- source_word: הַמֶּלֶךְ יְהוֹיָקִים
  choice: царь Иоаким
  rationale: Естественная для современного русского передача титула с личным именем.
- source_word: אֲנָשִׁים
  choice: людей
  rationale: В контексте речь идёт о посланных мужчинах, однако русское «людей» естественно обозначает группу исполнителей поручения и соответствует форме прямого дополнения.
- source_word: מִצְרָיִם
  choice: Египет
  rationale: Традиционное и общепринятое русское название страны.
- source_word: אֵת
  choice: ':'
  rationale: Показатель прямого дополнения сам по себе не переводится; двоеточие естественно вводит уточнение состава посланной группы.
- source_word: אֶלְנָתָן בֶּן עַכְבּוֹר
  choice: Елнафана, сына Ахбора
  rationale: Сохраняется традиционная русская передача библейских имён и патронимическая конструкция בן.
- source_word: וַאֲנָשִׁים אִתּוֹ
  choice: и людей с ним
  rationale: Буквально сохраняет отсутствие в еврейском тексте слова «других» и передаёт сопровождавшую Елнафана группу.
- source_word: אֶל מִצְרָיִם
  choice: в Египет
  rationale: Предлог אֶל обозначает направление; повтор названия места назначения сохранён в соответствии с еврейским текстом.
