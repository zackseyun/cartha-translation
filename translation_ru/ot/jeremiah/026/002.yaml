  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲמֹד֮ בַּ/חֲצַ֣ר בֵּית יְהוָה֒ וְ/דִבַּרְתָּ֞ עַל כָּל עָרֵ֣י יְהוּדָ֗ה הַ/בָּאִים֙ לְ/הִשְׁתַּחֲוֺ֣ת בֵּית יְהוָ֔ה אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/דַבֵּ֣ר אֲלֵי/הֶ֑ם אַל תִּגְרַ֖ע דָּבָֽר׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/002.yaml
  text: 'Thus says Yahweh: Stand in the court of the house of Yahweh[a], and speak to all the cities of Judah that come to worship at the house of Yahweh all the words that I have commanded you to speak to them[c][b]; do not hold back a word.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Встань во дворе дома Яхве[a] и говори всем жителям городов Иудеи[b], которые приходят поклониться в доме Яхве, все слова, которые Я повелел тебе сказать им. Не убавь ни слова[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во дворе дома Яхве». Еврейское חָצֵר может означать «двор» или «дворовое пространство».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский предлог при словах «всем городам Иудеи» допускает также понимание «против всех городов Иудеи» или «обо всех городах Иудеи». В основном тексте имеются в виду люди из этих городов, поскольку далее сказано о тех, кто приходит поклониться.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не опусти ни слова» или «не уменьши ни на слово».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет торжественную пророческую формулу и передаёт тетраграмматон как личное имя.
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: во дворе дома Яхве
  rationale: «Двор» естественно передаёт חָצֵר, а «дом Яхве» сохраняет образ и формулировку еврейского текста без замены на «храм».
- source_word: וְדִבַּרְתָּ עַל כָּל עָרֵי יְהוּדָה
  choice: и возвести всем жителям городов Иудеи
  rationale: Форма повеления передана естественным русским глаголом публичного провозглашения. Упоминание жителей делает явным подразумеваемый человеческий адресат при буквальном «всем городам».
- source_word: הַבָּאִים לְהִשְׁתַּחֲוֺת
  choice: которые приходят поклониться
  rationale: Причастие передано относительным оборотом; «поклониться» сохраняет и телесный образ, и культовое значение השתחוה.
- source_word: אֵת כָּל הַדְּבָרִים אֲשֶׁר צִוִּיתִיךָ לְדַבֵּר אֲלֵיהֶם
  choice: все слова, которые Я повелел тебе сказать им
  rationale: Сохраняет акцент на полноте порученного послания и естественно звучит по-русски.
- source_word: אַל תִּגְרַע דָּבָר
  choice: Не убавь ни слова
  rationale: Близко передаёт значение «уменьшать, убавлять» и в данном контексте ясно запрещает опускать какую-либо часть вести.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Адресат пророчества в עַל כָּל עָרֵי יְהוּדָה
  choice: всем жителям городов Иудеи
  alternative: всем городам Иудеи; против всех городов Иудеи; обо всех городах Иудеи
  rationale: Следующий оборот «которые приходят» указывает на людей из этих городов. Сноска сохраняет неоднозначность предлога עַל, не навязывая враждебного смысла.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Формула «Так говорит Яхве» и выражение «дом Яхве» сохраняют характерные повторы оригинала; обращение передано на «ты», как в еврейском единственном числе.
