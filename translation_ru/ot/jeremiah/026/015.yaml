  text: אַ֣ךְ יָדֹ֣עַ תֵּדְע֗וּ כִּ֣י אִם מְמִתִ֣ים אַתֶּם֮ אֹתִ/י֒ כִּי דָ֣ם נָקִ֗י אַתֶּם֙ נֹתְנִ֣ים עֲלֵי/כֶ֔ם וְ/אֶל הָ/עִ֥יר הַ/זֹּ֖את וְ/אֶל יֹשְׁבֶ֑י/הָ כִּ֣י בֶ/אֱמֶ֗ת שְׁלָחַ֤/נִי יְהוָה֙ עֲלֵי/כֶ֔ם לְ/דַבֵּר֙ בְּ/אָזְנֵי/כֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/015.yaml
  text: Only know for certain that if you put me to death[a], you are bringing innocent blood on yourselves, on this city, and on its inhabitants[b]; for in truth Yahweh has sent me to you to speak all these words in your hearing.
translation:
  language: ru
  text: 'Только твёрдо знайте: если вы предадите меня смерти[a], то навлечёте на себя, на этот город и на его жителей вину за невинную кровь; ведь воистину Яхве послал меня к вам, чтобы сказать вам все эти слова[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убьёте меня». Еврейский глагол имеет каузативное значение — «предадите смерти», что соответствует судебному контексту.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «говорить в ваши уши» — еврейское выражение со значением «говорить вам так, чтобы вы услышали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ יָדֹעַ תֵּדְעוּ
  choice: Только твёрдо знайте
  rationale: אַךְ вводит настойчивое предостережение, а сочетание инфинитива абсолютного с личной формой глагола усиливает повеление; формулировка передаёт оба оттенка естественным русским языком.
- source_word: כִּי אִם מְמִתִים אַתֶּם אֹתִי
  choice: если вы предадите меня смерти
  rationale: Причастие породы hифиль от מות имеет каузативное значение; «предадите смерти» соответствует судебному контексту и сохраняет более официальный оттенок, чем «убьёте».
- source_word: דָם נָקִי
  choice: невинную кровь
  rationale: Устойчивое библейское выражение обозначает кровь человека, неправомерно лишённого жизни.
- source_word: נֹתְנִים עֲלֵיכֶם וְאֶל הָעִיר הַזֹּאת וְאֶל יֹשְׁבֶיהָ
  choice: возложите невинную кровь на себя, на этот город и на его жителей
  rationale: Сохраняется образ буквального «возложения» крови и параллельное распространение ответственности на адресатов, город и его жителей.
- source_word: בֶאֱמֶת
  choice: воистину
  rationale: Передаёт торжественное заверение в подлинности пророческого поручения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: שְׁלָחַנִי יְהוָה עֲלֵיכֶם
  choice: Яхве послал меня к вам
  rationale: В контексте пророческого посланничества עַל указывает на направленность миссии к адресатам.
- source_word: לְדַבֵּר בְּאָזְנֵיכֶם
  choice: чтобы я произнёс перед вами
  rationale: Еврейская идиома буквально говорит о произнесении «в ваши уши»; по-русски «перед вами» естественно передаёт прямое публичное обращение к слушателям.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Образ невинной крови и ответственности за неё
  choice: возложите невинную кровь на себя, на этот город и на его жителей
  alternative: навлечёте на себя, на этот город и на его жителей вину за невинную кровь
  rationale: Основной текст сохраняет конкретную метафору оригинала и не сводит её явно к абстрактной юридико-богословской категории, хотя ответственность подразумевается.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. «Твёрдо знайте» передаёт усиленную глагольную конструкцию; «воистину» сохраняет solemnный тон. Все маркеры сносок присутствуют в основном тексте.
