  language: ru
  text: 'И скажи им: «Так говорит Господь: если вы не будете слушаться Меня, жить по Моему наставлению, которое Я положил перед вами,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשְׁמְעוּ אֵלַי
  choice: слушаться Меня
  rationale: В данном контексте שמע с אֶל означает не просто слышать, а внимать с послушанием.
- source_word: לָלֶכֶת בְּתוֹרָתִי
  choice: поступать по Моему наставлению
  rationale: Идиома «ходить в» передаёт образ жизни и поведение; תּוֹרָה здесь означает данное Богом наставление, а не только формальный свод законов.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: Я дал вам
  rationale: Естественно передаёт смысл «поместил/предложил перед вами» применительно к наставлению без ненужного русского буквализма.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона в библейском тексте.
theological_decisions:
- issue: Связь לָלֶכֶת с условием «слушаться»
  choice: «слушаться Меня и поступать»
  alternative: «слушать Меня, чтобы ходить»
  rationale: Сохраняется смысловое единство послушания и образа жизни, без сведения наставления лишь к интеллектуальному восприятию.
translation_notes:
  register: Современный литературный русский язык; торжественная пророческая формула сохранена. Стих оставлен синтаксически незавершённым, поскольку условное предложение продолжается в следующем стихе.
