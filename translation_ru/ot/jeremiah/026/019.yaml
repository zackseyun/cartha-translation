source:
  edition: WLC
  text: הֶ/הָמֵ֣ת הֱ֠מִתֻ/הוּ חִזְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/כָל יְהוּדָ֗ה הֲ/לֹא֮ יָרֵ֣א אֶת יְהוָה֒ וַ/יְחַל֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יִּנָּ֣חֶם יְהוָ֔ה אֶל הָ/רָעָ֖ה אֲשֶׁר דִּבֶּ֣ר עֲלֵי/הֶ֑ם וַ/אֲנַ֗חְנוּ עֹשִׂ֛ים רָעָ֥ה גְדוֹלָ֖ה עַל נַפְשׁוֹתֵֽי/נוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/019.yaml
  text: Did Hezekiah king of Judah and all Judah put him to death? Did he not fear Yahweh and seek the favor of Yahweh[c][b][a], and Yahweh relented concerning the disaster that he had spoken against them? But we are doing great evil against ourselves.
translation:
  language: ru
  text: Разве Езекия, царь Иудеи, и весь Иуда предали его смерти? Разве он не боялся Яхве и не искал благоволения Яхве[a]? И Яхве отказался от бедствия[b], которое Он возвестил против них. А мы причиняем великое зло самим себе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «смягчил лицо Яхве» — еврейская идиома, означающая стремление обрести Его благоволение или обращение к Нему с мольбой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Яхве передумал относительно бедствия».'
    reason: alternative_reading
  - marker: c
    text: 'В еврейском тексте слова «бедствие» и «зло» передают одно и то же слово רָעָה (раа): сначала в значении кары или бедствия, затем — нравственного зла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָמֵת הֱמִתֻהוּ
  choice: предали его смерти
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает глагольную идею. В риторическом вопросе «предали его смерти» естественно передаёт намеренное умерщвление пророка, не сужая смысл до формальной казни.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה וְכָל יְהוּדָה
  choice: Езекия, царь Иудеи, и весь Иуда
  rationale: Имя передано в принятой русской библейской форме. «Весь Иуда» сохраняет собирательное обозначение народа или страны, присутствующее в еврейском тексте.
- source_word: הֲלֹא יָרֵא אֶת יְהוָה
  choice: Разве он не боялся Яхве
  rationale: Глагол ירא в отношении Бога обозначает благоговейный страх; привычное выражение «бояться Яхве» сохраняет его богословскую насыщенность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: וַיְחַל אֶת פְּנֵי יְהוָה
  choice: искал благоволения Яхве
  rationale: Еврейская идиома буквально говорит об умягчении или испрашивании лица Яхве. Выбранная формулировка естественна по-русски и передаёт обращение к Богу с мольбой о благосклонности.
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: Яхве отказался наводить бедствие
  rationale: נחם здесь описывает отказ от объявленного суда. Формулировка сохраняет реальность перемены в Божьем действии, не объясняя её через заранее принятую богословскую систему.
- source_word: אֲשֶׁר דִּבֶּר עֲלֵיהֶם
  choice: о котором говорил против них
  rationale: Сочетание דבר על в пророческом контексте означает произнесение слова суда против людей; перевод сохраняет направленность угрозы.
- source_word: וַאֲנַחְנוּ עֹשִׂים רָעָה גְדוֹלָה עַל נַפְשׁוֹתֵינוּ
  choice: А мы причиняем великое зло самим себе
  rationale: Здесь רעה означает нравственное зло, тогда как ранее то же слово обозначает бедствие. נפשותינו в данном обороте указывает на самих говорящих и на саморазрушительные последствия их поступка.
theological_decisions:
- issue: Антропопатический язык о реакции Бога на страх и мольбу
  choice: Яхве отказался наводить бедствие
  alternative: Яхве передумал наводить бедствие
  rationale: Основной вариант передаёт отказ от объявленного бедствия и не ослабляет повествовательную связь с человеческим откликом. Вариант «передумал» возможен лексически, но сильнее акцентирует изменение решения; он сохранён в примечании, чтобы не устранять заложенное в тексте богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Риторические вопросы переданы через «разве», синтаксис упрощён лишь настолько, чтобы стих был понятен при чтении вслух. Личное имя Яхве и собирательное выражение «весь Иуда» сохранены.
