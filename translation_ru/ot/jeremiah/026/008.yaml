  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִרְמְיָ֗הוּ לְ/דַבֵּר֙ אֵ֣ת כָּל אֲשֶׁר צִוָּ֣ה יְהוָ֔ה לְ/דַבֵּ֖ר אֶל כָּל הָ/עָ֑ם וַ/יִּתְפְּשׂ֨וּ אֹת֜/וֹ הַ/כֹּהֲנִ֧ים וְ/הַ/נְּבִאִ֛ים וְ/כָל הָ/עָ֥ם לֵ/אמֹ֖ר מ֥וֹת תָּמֽוּת׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/008.yaml
  text: And it happened[a], when Yirmeyahu had finished speaking all that Yahweh had commanded him to speak to all the people, that the priests and the prophets and all the people seized him, saying, “You must surely die!”
translation:
  language: ru
  text: 'И вот, когда Йирмеяху закончил говорить всё, что Яхве повелел ему сказать всему народу, священники, пророки и весь народ схватили его со словами: «Ты непременно умрёшь![a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Ты должен умереть!» В древнееврейском тексте абсолютный инфинитив употреблён вместе с личной формой того же глагола для усиления.'
    reason: лексическая альтернатива и пояснение древнееврейской эмфатической конструкции
lexical_decisions:
- source_word: וַיְהִי
  choice: И вот
  rationale: Естественно передаёт древнееврейский повествовательный переход и вводит новое событие без архаичного оборота «и было».
- source_word: כְּכַלּוֹת ... לְדַבֵּר
  choice: когда ... закончил говорить
  rationale: Временная конструкция с инфинитивом כלה указывает, что последующее действие произошло по завершении речи.
- source_word: יִרְמְיָהוּ
  choice: Йирмеяху
  rationale: Имя передано транслитерацией его древнееврейской формы, а не традиционным русским экзонимом «Иеремия».
- source_word: אֵת כָּל אֲשֶׁר
  choice: всё, что
  rationale: Передаёт полноту содержания порученной речи естественным современным русским оборотом.
- source_word: צִוָּה יְהוָה
  choice: Яхве повелел
  rationale: Глагол צוה означает властное поручение или повеление; предшествование повеления завершённой речи ясно из контекста и не требует отдельной формы плюсквамперфекта в русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: לְדַבֵּר אֶל כָּל הָעָם
  choice: сказать всему народу
  rationale: В русском повтор לְדַבֵּר естественно передаётся глаголом «сказать» при сохранении адресата и охвата всего народа.
- source_word: וַיִּתְפְּשׂוּ אֹתוֹ
  choice: схватили его
  rationale: תפשׂ обозначает физическое захватывание; перевод сохраняет силу действия, не уточняя его как формальный арест.
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  choice: священники, пророки и весь народ
  rationale: Перечень трёх групп передан обычным русским сочинением без утраты их совместного участия.
- source_word: לֵאמֹר
  choice: со словами
  rationale: Естественный русский способ ввести прямую речь после глагола «схватили», не добавляя отдельного действия.
- source_word: מוֹת תָּמוּת
  choice: Ты непременно умрёшь!
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает утверждение; «непременно» передаёт подчёркнутую неизбежность смертного приговора или угрозы.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя יהוה; его передача как «Яхве» сохраняет различие между именем и титулом.
- issue: Форма имени пророка יִרְמְיָהוּ
  choice: Йирмеяху
  alternative: Иеремия
  rationale: Выбрана транслитерация древнееврейской формы имени; традиционная русская форма остаётся возможной редакционной альтернативой, но не отражает её столь непосредственно.
- issue: Смысл усиленной конструкции מוֹת תָּמוּת
  choice: Ты непременно умрёшь!
  alternative: Ты должен умереть!
  rationale: Конструкция подчёркивает смерть, но сама по себе допускает оттенки уверенного предсказания, угрозы и требования казни. Основной текст сохраняет прежде всего эмфатическую неизбежность, а возможный деонтический оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Оборот «И вот» сохраняет переход исходного текста без архаизации; прямая речь звучит резко и угрожающе. Имена переданы непосредственно с древнееврейского.
