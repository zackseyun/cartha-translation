base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/010.yaml
  text: When the officials of Judah heard these words[c][b][a], they went up from the king’s house to the house of Yahweh and sat at the entrance of the New Gate of Yahweh.
translation:
  language: ru
  text: Когда правители Иудеи услышали эти слова, они поднялись из царского дворца к дому Яхве и сели у входа в Новые ворота дома Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ворота храмового комплекса, известные как «Новые ворота».
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי יְהוּדָה
  choice: правители Иудеи
  rationale: Слово שָׂרִים обозначает высокопоставленных представителей власти; «правители» передаёт их властный статус, не ограничивая смысл наследственной знатью.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: В контексте речь идёт об услышанном пророческом высказывании Иеремии, поэтому «слова» сохраняет речевой смысл דְּבָרִים.
- source_word: וַיַּעֲלוּ
  choice: они поднялись
  rationale: Сохранено обычное пространственное значение עלה — движение вверх, к храмовому комплексу.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: из царского дворца
  rationale: Буквально выражение означает «из дома царя»; в данном контексте естественное русское соответствие — «из царского дворца».
- source_word: בֵּית יְהוָה
  choice: в дом Яхве
  rationale: Передаёт буквальный образ «дома Яхве» как обозначение храма, не заменяя его пояснительным словом «храм».
- source_word: וַיֵּשְׁבוּ
  choice: и сели
  rationale: Прямое соответствие ישׁב; возможная судебная функция заседания остаётся определяемой контекстом и не вносится в текст.
- source_word: בְּפֶתַח
  choice: у входа
  rationale: Естественно обозначает положение возле входа или проёма ворот.
- source_word: שַׁעַר יְהוָה הֶחָדָשׁ
  choice: Новые ворота дома Яхве
  rationale: Определение «Новые» понимается как название известных храмовых ворот; добавление «дома» по смыслу уточняет принадлежность ворот храмовому комплексу, отмеченную в сжатой еврейской конструкции.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом; это сохраняет различие между именем Бога и обозначением «Господь».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Правители» понятно передаёт высокий государственный статус; «царский дворец» звучит естественнее буквального «дом царя». Название ворот оформлено с прописной буквы.
