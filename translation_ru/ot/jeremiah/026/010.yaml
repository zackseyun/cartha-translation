  source_fidelity: 'Основной смысл передан точно: высокопоставленные лица Иудеи услышали сказанное, направились от царского дворца к храму и сели у входа в известные храмовые ворота. Однако сочетание «поднялись из царского дворца в дом Яхве» в современном русском звучит неестественно и может создавать впечатление входа внутрь здания, тогда как далее они находятся у входа в ворота.'
