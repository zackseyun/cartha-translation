  terminology: «Правители Иудеи» — допустимая передача שָׂרֵי יְהוּדָה. «Дом Яхве» последовательно сохраняет буквальное храмовое обозначение, а «Яхве» верно передаёт тетраграмматон. Сноска уместно поясняет, что речь идёт о воротах храмового комплекса.
