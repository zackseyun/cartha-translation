base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/003.yaml
  text: Perhaps they will listen[a], and each man will turn from his evil way[c][b], and I will relent concerning the disaster that I am planning to bring on them because of the evil of their deeds.
translation:
  language: ru
  text: Может быть, они послушают[a], и каждый из них обратится от своего злого пути[b], а Я откажусь от бедствия[c], которое замышляю навести на них за зло их дел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «услышат», «внемлют»; еврейский глагол может обозначать как слышание, так и послушное внимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «повернёт назад», «раскается»; еврейский глагол буквально означает «повернуться, возвратиться».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «изменю решение о бедствии»; применённый к Богу еврейский глагол описывает Его отказ от осуществления объявленного суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Может быть
  rationale: Передаёт выраженные еврейской частицей возможность и надежду, не устраняя присущего фразе напряжения.
- source_word: יִשְׁמְעוּ
  choice: послушают
  rationale: В пророческом контексте שׁמע означает не только услышать звук, но и внять сказанному.
- source_word: וְיָשֻׁבוּ
  choice: обратится
  rationale: Сохраняет образ поворота и естественно сочетается с выражением «от своего злого пути»; «покается» было бы более истолковывающим переводом.
- source_word: אִישׁ
  choice: каждый
  rationale: 'Передаёт распределительное значение единственного числа: речь идёт о каждом человеке из народа.'
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: от своего злого пути
  rationale: Сохраняет обычную пророческую метафору нравственного образа жизни и местоименную соотнесённость с «каждый».
- source_word: וְנִחַמְתִּי
  choice: Я отступлюсь
  rationale: В контексте объявленного суда נחם обозначает отказ от осуществления угрожавшего наказания; формулировка сохраняет условность высказывания, не приписывая Богу нравственной ошибки.
- source_word: אֶל הָרָעָה
  choice: от бедствия
  rationale: רעה здесь обозначает не нравственное зло, а несчастье или бедствие как суд; предлог передан естественной для русского глагольной конструкции формой.
- source_word: חֹשֵׁב לַעֲשׂוֹת לָהֶם
  choice: которое замышляю навести на них
  rationale: חשב с инфинитивом выражает намерение; «навести на них» естественно передаёт идиому причинения бедствия.
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיהֶם
  choice: за зло их дел
  rationale: 'Кратко и естественно передаёт причинно-воздаятельный смысл: угрожающее бедствие обусловлено нравственным злом их поступков.'
theological_decisions:
- issue: Передача применённого к Богу глагола נחם
  choice: Я отступлюсь от бедствия
  alternative: Я изменю решение о бедствии
  rationale: Выбранный вариант сохраняет реальную условность объявленного суда и образ Бога, удерживающего наказание в ответ на обращение людей, но не внушает, будто Бог раскаивается в нравственном проступке.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся ясным для широкого читателя; метафора «злого пути» сохранена, а два разных употребления רעה разграничены как нравственное «зло» и грозящее «бедствие».
