  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ וְ/כָל הָ/עָ֔ם אֶל הַ/כֹּהֲנִ֖ים וְ/אֶל הַ/נְּבִיאִ֑ים אֵין לָ/אִ֤ישׁ הַ/זֶּה֙ מִשְׁפַּט מָ֔וֶת כִּ֗י בְּ/שֵׁ֛ם יְהוָ֥ה אֱלֹהֵ֖י/נוּ דִּבֶּ֥ר אֵלֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/016.yaml
  text: Then the officials and all the people said to the priests and the prophets[a], “This man does not deserve the sentence of death[b], for he has spoken to us in the name of Yahweh our God.”
translation:
  language: ru
  text: 'Тогда начальники и весь народ сказали священникам и пророкам: «Этот человек не подлежит смертной казни[a], потому что он говорил нам от имени Яхве, нашего Бога[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нет для этого человека приговора смерти»; возможно также: «этот человек не заслуживает смерти».'
    reason: Сохраняет юридическую форму и возможные оттенки еврейского выражения מִשְׁפָּט מָוֶת.
  - marker: b
    text: 'Или: «именем Яхве, нашего Бога».'
    reason: Отмечает более формальное соответствие еврейскому выражению בְּשֵׁם, которое может обозначать речь с полномочием и по поручению.
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: начальники
  rationale: Обозначает представителей власти, участвующих в судебном разбирательстве; «начальники» — ясное и уместное в данном контексте русское соответствие.
- source_word: וְכָל הָעָם
  choice: и весь народ
  rationale: Сохраняет коллективный характер участия народа в вынесении решения.
- source_word: הַכֹּהֲנִים ... הַנְּבִיאִים
  choice: священникам и пророкам
  rationale: Прямые адресаты речи; употреблены общепринятые русские соответствия.
- source_word: אֵין לָאִישׁ הַזֶּה מִשְׁפַּט מָוֶת
  choice: этот человек не подлежит смертной казни
  rationale: 'Передаёт юридический смысл выражения буквально «нет для этого человека приговора смерти»: обвиняемого не следует подвергать смертной казни.'
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание вынесенного решения.
- source_word: בְּשֵׁם יְהוָה אֱלֹהֵינוּ
  choice: от имени Яхве, нашего Бога
  rationale: Предлог בְּשֵׁם указывает на выступление с полномочием и по поручению; тетраграмматон передан личным именем «Яхве».
- source_word: דִּבֶּר אֵלֵינוּ
  choice: он говорил нам
  rationale: Естественная русская передача завершённого речевого действия, на которое ссылаются в судебном решении.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Юридическая сила выражения מִשְׁפַּט מָוֶת
  choice: не подлежит смертной казни
  alternative: не заслуживает смертного приговора; ему не должно быть смертного приговора
  rationale: Контекст представляет формальное разбирательство. Выбранная формулировка ясно выражает отсутствие оснований для применения смертной казни, не сводя фразу лишь к моральной оценке.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-повествовательного контекста. Синтаксис прямой и понятный; юридическое выражение передано естественно, а личное имя Бога сохранено.
