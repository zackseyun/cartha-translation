base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/001.yaml
  text: At the beginning of the reign of Jehoiakim son of Josiah[a], king of Judah, this word came from Yahweh, saying[c][b],
translation:
  language: ru
  text: 'В начале царствования Иоакима, сына Иосии, царя Иудеи, это слово было от Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Господа». В еврейском тексте стоит личное имя Бога — יהוה (Яхве).'
