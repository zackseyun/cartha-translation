lexical_decisions:
- source_word: בְּרֵאשִׁית מַמְלְכוּת
  choice: В начале царствования
  rationale: Сочетание обозначает начальный период правления; этот перевод естественен по-русски и сохраняет временное значение.
- source_word: יְהוֹיָקִים בֶּן יֹאשִׁיָּהוּ
  choice: Иоакима, сына Иосии
  rationale: Использованы принятые в русской библейской традиции формы имён и прямо передана родственная связь.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Приложение относится к Иоакиму; родительный падеж обусловлен конструкцией «царствования Иоакима».
- source_word: הָיָה הַדָּבָר הַזֶּה
  choice: было это слово
  rationale: Формулировка близко передаёт буквальное значение древнееврейского текста и не подменяет его обычной пророческой формулой «пришло слово».
- source_word: דָּבָר
  choice: слово
  rationale: В пророческом контексте означает Божье изречение или весть; «слово» сохраняет библейскую образность и смысловую насыщенность.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: מֵאֵת указывает на источник, а тетраграмматон передан как личное имя Яхве.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит по-русски прямую речь, следующую в следующем стихе, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное божественное имя; транслитерация сохраняет его отличие от титула «Господь».
- issue: Пророческая формула הָיָה הַדָּבָר הַזֶּה
  choice: было это слово
  alternative: пришло это слово
  rationale: Выбрана более формальная передача необычной формулировки данного стиха, чтобы не сглаживать её до более распространённого оборота ויהי דבר־יהוה.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к древнееврейскому, но двоеточие вместо буквального «говоря» естественно связывает вводную формулу с речью следующего стиха.
