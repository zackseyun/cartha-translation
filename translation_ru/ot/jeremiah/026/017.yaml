  text: Then some of the elders of the land stood up and said to all the assembly of the people[a], saying,
translation:
  language: ru
  text: 'Тогда некоторые из старейшин страны встали и обратились ко всему собранию народа со словами:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: встали
  rationale: Форма глагола קום в повествовании обозначает, что участники собрания поднялись, чтобы публично выступить; «встали» естественно передаёт эту ситуацию.
- source_word: אֲנָשִׁים מִזִּקְנֵי הָאָרֶץ
  choice: некоторые из старейшин страны
  rationale: Сочетание אֲנָשִׁים с מן указывает на отдельных мужчин из числа старейшин. По-русски принадлежность к этой группе естественно и точно выражается словом «некоторые»; отдельное «мужчины» было бы тяжеловесным.
- source_word: וַיֹּאמְרוּ
  choice: обратились
  rationale: Глагол אמר вводит публичную речь, направленную ко всему собранию. «Обратились» естественно сочетается с адресатом и последующим «со словами», не меняя смысла.
- source_word: אֶל כָּל קְהַל הָעָם
  choice: ко всему собранию народа
  rationale: קהל обозначает созванное или собравшееся сообщество, а כָּל охватывает всё собрание; формулировка сохраняет официальный публичный характер сцены.
- source_word: לֵאמֹר
  choice: 'со словами:'
  rationale: Инфинитив לאמר вводит содержание речи в следующем стихе. Двоеточие и оборот «со словами» естественно передают эту функцию в современном русском языке.
- source_word: הָאָרֶץ
  choice: страны
  rationale: В данном общественно-политическом контексте «страна» звучит естественнее русского «земля», сохраняя значение территории и её населения.
