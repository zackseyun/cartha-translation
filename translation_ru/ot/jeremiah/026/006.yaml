  yaml_path: translation/ot/jeremiah/026/006.yaml
  text: then I will make this house like Shiloh[b][a], and I will make this city a curse to all the nations of the earth.
translation:
  language: ru
  text: то Я сделаю этот дом подобным Силому[a], а этот город сделаю проклятием для всех народов земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Силом был прежним местом святилища, которое постиг Божий суд; сравнение указывает на разорение и отвержение.
    reason: cultural_note
  - marker: b
    text: 'Или: «сделаю этот город предметом проклятий у всех народов земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־הַבַּיִת הַזֶּה כְּשִׁלֹה
  choice: то Я сделаю с этим домом то же, что с Силомом
  rationale: 'Глагол נתן буквально означает «дать, поставить», но в этой конструкции выражает придание чему-либо определённой участи. Русская сравнительная конструкция естественно передаёт смысл: этот дом постигнет та же участь, что и прежнее святилище в Силоме. «То» отражает следствие условия из предыдущего стиха.'
- source_word: הַבַּיִת הַזֶּה
  choice: этот дом
  rationale: בַּיִת буквально означает «дом». В контексте речь идёт о храме, однако «дом» сохраняет лексику оригинала и значение дома Господнего, не подменяя её пояснением.
- source_word: כְּשִׁלֹה
  choice: что с Силомом
  rationale: Предлог כ־ обозначает сравнение. Название места передано принятой русской формой «Силом»; форма творительного падежа обусловлена русской сравнительной конструкцией.
- source_word: הָעִיר הַזֹּאת
  choice: этот город
  rationale: Прямое соответствие указательной конструкции; в контексте имеется в виду Иерусалим.
- source_word: אֶתֵּן לִקְלָלָה
  choice: сделаю проклятием
  rationale: Сочетание נתן + ל + קללה означает сделать кого-либо или что-либо проклятием либо предметом проклятий. Краткая формулировка сохраняет силу и некоторую образность еврейской идиомы; более развёрнутый смысл отмечен в сноске.
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ
  choice: для всех народов земли
  rationale: 'Здесь גּוֹיֵי הָאָרֶץ естественно обозначает все народы мира, а не только народы данной страны. «Для» передаёт отношение или результат, выраженные предлогом ל: город станет проклятием в глазах и речи всех народов.'
theological_decisions:
- issue: Обозначение Иерусалимского храма
  choice: этот дом
  alternative: этот храм
  rationale: Хотя по контексту речь идёт о храме, оригинал употребляет слово «дом». Его сохранение передаёт образ дома Господнего и не добавляет отсутствующей в тексте конкретизации.
- issue: Смысл формулы суда над городом
  choice: сделаю проклятием
  alternative: сделаю предметом проклятий
  rationale: Еврейская идиома допускает понимание города как самого «проклятия» или как примера, упоминаемого при проклятиях. Основной текст сохраняет краткую формулу оригинала, а сноска раскрывает возможный смысл, не устраняя неоднозначность.
- issue: Сравнение с Силомом
  choice: сделаю с этим домом то же, что с Силомом
  alternative: сделаю этот дом подобным Силому
  rationale: Речь идёт не о внешнем подобии, а о сходной участи святилищ под Божьим судом. Выбранная формулировка естественна по-русски, а исторический смысл сравнения поясняется в сноске без его догматического расширения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Заглавная буква в местоимении «Я» указывает на говорящего Господа по контексту. Союз «а» естественно разделяет два параллельных объявления суда, не вводя смыслового противопоставления.
