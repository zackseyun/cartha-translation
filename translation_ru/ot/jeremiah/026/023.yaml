  text: וַ/יּוֹצִ֨יאוּ אֶת אוּרִיָּ֜הוּ מִ/מִּצְרַ֗יִם וַ/יְבִאֻ֨/הוּ֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹיָקִ֔ים וַ/יַּכֵּ֖/הוּ בֶּ/חָ֑רֶב וַ/יַּשְׁלֵךְ֙ אֶת נִבְלָת֔/וֹ אֶל קִבְרֵ֖י בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/023.yaml
  text: They brought Uriah out of Egypt and brought him to King Jehoiakim[a], and he struck him down with the sword and threw his corpse into the burial places of the common people.
translation:
  language: ru
  text: Они вывели Урию из Египта и привели его к царю Иоакиму, а тот поразил его мечом и бросил его труп в могилы простых людей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могилы народа». Еврейское выражение может более буквально означать могилы, принадлежавшие обычным людям, возможно в противопоставлении почётному погребению.'
    reason: Лексическая неоднозначность выражения קִבְרֵי בְּנֵי הָעָם.
lexical_decisions:
- source_word: וַיּוֹצִיאוּ אֶת־אוּרִיָּהוּ מִמִּצְרַיִם
  choice: вывели Урию из Египта
  rationale: Порода hифиль глагола יצא передаёт понудительное значение «вывести». Русская конструкция «вывели... из Египта» естественна и сохраняет направление движения.
- source_word: וַיְבִאֻהוּ
  choice: привели его
  rationale: Hифиль от בוא с объектным суффиксом означает «принесли/привели его». Для человека в данном контексте естественнее «привели».
- source_word: הַמֶּלֶךְ יְהוֹיָקִים
  choice: царь Иоаким
  rationale: Обычная для современного русского языка форма титула перед именем; имя передано в принятой русской библейской форме.
- source_word: וַיַּכֵּהוּ בֶּחָרֶב
  choice: поразил его мечом
  rationale: Глагол נכה означает «ударить, поразить»; упоминание меча и дальнейшее «его тело» ясно указывают на смертельный исход, не требуя замены образного выражения прямым «убил».
- source_word: נִבְלָתוֹ
  choice: его тело
  rationale: נְבֵלָה обозначает мёртвое тело. «Тело» звучит естественно и достойно, а контекст однозначно показывает, что речь о трупе.
- source_word: קִבְרֵי בְּנֵי הָעָם
  choice: могилы простых людей
  rationale: קִבְרֵי — множественное сопряжённое «могилы»; выражение בְּנֵי הָעָם здесь, вероятно, указывает на обычных людей в противопоставлении почётному погребению.
theological_decisions:
- issue: Смена подлежащего с множественного числа на единственное
  choice: Сохранить множественное «они» при доставке Урии и отнести единственное «тот» к царю Иоакиму при казни и погребении
  alternative: Понять единственное число собирательно как продолжение действий посланников царя
  rationale: В еврейском тексте формы וַיּוֹצִיאוּ и וַיְבִאֻהוּ стоят во множественном числе, а וַיַּכֵּהוּ и וַיַּשְׁלֵךְ — в единственном. Ближайший названный субъект в единственном числе — царь Иоаким. Указательное «а тот» ясно передаёт грамматический переход, не скрывая смену деятеля.
- issue: Социальный смысл выражения בְּנֵי הָעָם
  choice: простые люди
  alternative: народ
  rationale: В контексте позорного, непочётного погребения выражение вероятно обозначает обычных людей, однако буквальное значение шире; поэтому альтернативу отмечает сноска.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Союзно-местоименная конструкция «а тот» естественно обозначает смену субъекта. Сноска поставлена непосредственно после выражения, которое она поясняет.
