  source_fidelity: 'Текст точно передаёт все основные элементы еврейского оригинала: контрастное «А я», презентативное הִנְנִי («вот, я»), идиому нахождения «в ваших руках», повеление, обращённое к группе, и двойной критерий «хорошо и правильно в ваших глазах». Единственное число «рука» в оригинале корректно разъяснено в сноске, тогда как русское множественное число является естественной идиоматической передачей.'
