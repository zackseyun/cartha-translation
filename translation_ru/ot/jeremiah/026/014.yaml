  text: וַ/אֲנִ֖י הִנְ/נִ֣י בְ/יֶדְ/כֶ֑ם עֲשׂוּ לִ֛/י כַּ/טּ֥וֹב וְ/כַ/יָּשָׁ֖ר בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/014.yaml
  text: But as for me[a], here I am in your hand[b]. Do to me what is good and right in your eyes.
translation:
  language: ru
  text: А я — вот, я в ваших руках[a]. Делайте со мной то, что хорошо и правильно в ваших глазах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в вашей руке»; это выражение означает «под вашей властью».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как вы считаете нужным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: 'Самостоятельное местоимение с союзом обозначает контрастный переход: Иеремия от своей защиты переходит к тому, что касается лично его. «А я» естественно передаёт этот оттенок по-русски.'
- source_word: הִנְנִי
  choice: вот, я
  rationale: Указательно-презентативная формула подчёркивает непосредственное присутствие и готовность отдать себя в их распоряжение; «вот, я» сохраняет эту силу без архаичного «се».
- source_word: בְיֶדְכֶם
  choice: в ваших руках
  rationale: Буквально в еврейском стоит единственное число «в вашей руке», но это идиома пребывания под чьей-либо властью. Русское «в ваших руках» сохраняет образ и естественно выражает тот же смысл.
- source_word: עֲשׂוּ לִי
  choice: Делайте со мной
  rationale: Императив множественного числа означает действие, направленное на Иеремию. «Делайте со мной» прямо передаёт форму и не уточняет заранее характер решения.
- source_word: כַטּוֹב וְכַיָּשָׁר
  choice: то, что хорошо и правильно
  rationale: 'Сочетание сохраняет оба оценочных понятия: טוֹב — доброе/хорошее, יָשָׁר — прямое, правильное. «Справедливо» было бы уместно в судебном контексте, но несколько сузило бы значение второго слова.'
- source_word: בְעֵינֵיכֶם
  choice: в ваших глазах
  rationale: Сохранён еврейский образ оценки «в глазах», понятный в современном русском; идиоматический смысл — согласно вашему суждению.
theological_decisions: []
