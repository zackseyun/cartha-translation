  terminology: «В ваших руках» точно передаёт образ власти и контроля; «хорошо и правильно» сохраняет широту טוֹב и יָשָׁר, не сужая второе слово до исключительно юридического «справедливо». Сноска a надёжно поясняет расхождение числа без изменения смысла. Сноска b предлагает естественный идиоматический вариант для «в ваших глазах».
