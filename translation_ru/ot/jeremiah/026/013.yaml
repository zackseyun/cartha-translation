base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/013.yaml
  text: So now[a], make your ways and your deeds good, and listen to the voice of Yahweh your God[c][b], and Yahweh will relent concerning the disaster that he has spoken against you.
translation:
  language: ru
  text: Итак, исправьте свои пути и дела[a] и слушайтесь голоса ГОСПОДА, вашего Бога[b], и ГОСПОДЬ отступится от бедствия[c], которое Он возвестил против вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделайте хорошими свои пути и дела». Возможный перевод: «исправьте свой образ жизни и свои поступки».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «слушайте голос ГОСПОДА, вашего Бога». В этой еврейской идиоме слушание подразумевает послушание.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ГОСПОДЬ изменит решение о бедствии»; более буквально: «ГОСПОДЬ пожалеет о бедствии». Речь идёт об отказе привести в исполнение объявленный суд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт вывод и настоятельный переход к призыву; в данном контексте естественнее буквального «и теперь».
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: исправьте свои пути и дела
  rationale: «Исправьте» естественно передаёт каузативное значение «сделайте хорошими», а «пути и дела» сохраняет еврейскую этическую метафору и различение образа жизни и поступков.
- source_word: וְשִׁמְעוּ בְּקוֹל
  choice: слушайтесь голоса
  rationale: Русское «слушайтесь» выражает подразумеваемое повиновение, а дополнение «голоса» сохраняет образность исходной идиомы.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: ГОСПОДА, вашего Бога
  rationale: Тетраграмматон передан принятой в русской библейской традиции формой «ГОСПОДЬ» с типографическим выделением; притяжательная конструкция сохранена.
- source_word: וְיִנָּחֵם יְהוָה אֶל הָרָעָה
  choice: Тогда ГОСПОДЬ отменит бедствие
  rationale: Форма נחם здесь означает отказ от исполнения объявленного суда. «Отменит бедствие» ясно передаёт практический результат, не приписывая Богу нравственного раскаяния; «тогда» делает явной контекстуальную связь увещания и последующего действия, выраженную соединительным וְ.
- source_word: אֲשֶׁר דִּבֶּר עֲלֵיכֶם
  choice: которое возвестил против вас
  rationale: «Возвестил» соответствует торжественному объявлению суда, а «против вас» сохраняет направленность עֲלֵיכֶם.
theological_decisions:
- issue: Божественное отступление от объявленного суда
  choice: ГОСПОДЬ отменит бедствие
  alternative: ГОСПОДЬ пожалеет о бедствии / изменит решение о бедствии
  rationale: Основной текст сохраняет реальность условной отмены объявленного суда, но не навязывает читателю вывод о нравственном раскаянии Бога. Смысловая напряжённость исходного נחם отражена в примечании с более буквальным вариантом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены образы «пути», «дела» и «голос», но повеление и итог объявленного суда сформулированы естественно для современного читателя.
