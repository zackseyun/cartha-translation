base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/024.yaml
  text: But the hand of Ahikam son of Shaphan was with Jeremiah[b][a], so that he was not given into the hand of the people to put him to death.
translation:
  language: ru
  text: Но Ахикам, сын Шафана, поддержал и защитил Иеремию[a], чтобы его не отдали в руки народа[b] на смерть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рука Ахикама… была с Иеремией»; это выражение означает, что Ахикам поддерживал и защищал Иеремию.'
    reason: lexical_alternative
  - marker: b
    text: «В руки народа» — то есть во власть народа.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Частица выражает противопоставление предшествующей угрозе Иеремии; «но» естественно передаёт этот поворот.
- source_word: יַד אֲחִיקָם ... הָיְתָה אֶת יִרְמְיָהוּ
  choice: рука Ахикама ... была с Иеремией
  rationale: Сохранён образ руки и буквальная структура идиомы, обозначающей деятельную поддержку и защиту; она также образует намеренный контраст с последующим выражением «в руки народа».
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ахикама, сына Шафана
  rationale: Имена переданы традиционной русской библейской транслитерацией, а בן — обычной родословной формулой «сын».
- source_word: לְבִלְתִּי תֵּת אֹתוֹ
  choice: и потому его не отдали
  rationale: Отрицательная целевая или результативная конструкция допускает оба оттенка; «и потому» естественно передаёт итог защиты, не вводя отсутствующего в еврейском тексте действующего лица.
- source_word: בְיַד הָעָם
  choice: в руки народа
  rationale: Сохранена древнееврейская идиома передачи во власть кого-либо и перекличка с «рукой Ахикама»; русское множественное «в руки» звучит естественно.
- source_word: לַהֲמִיתוֹ
  choice: на смерть
  rationale: Кратко и естественно передаёт цель выдачи — умерщвление Иеремии — без добавления более узкого юридического смысла «казнить».
