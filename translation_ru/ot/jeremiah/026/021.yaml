base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/021.yaml
  text: When King Jehoiakim[a], and all his mighty men, and all the officials heard his words, the king sought to put him to death. But when Uriah heard[b], he was afraid and fled and went to Egypt.
translation:
  language: ru
  text: Когда царь Иоаким, все его воины и все сановники услышали слова Урии, царь попытался предать его смерти. Узнав об этом, Урия испугался, бежал и пришёл в Египет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышали / узнав об этом
  rationale: В первом случае глагол передан прямо; во втором подразумеваемый объект слуха восстановлен по контексту естественным русским оборотом, без уточнения способа получения известия.
- source_word: גִּבּוֹרָיו
  choice: его воины
  rationale: В придворном контексте слово обозначает сильных, доблестных людей царя, вероятнее всего его военных слуг; «воины» ясно передаёт эту функцию современному читателю.
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: Слово обозначает высокопоставленных правителей или придворных должностных лиц; «сановники» естественно для царского двора и не подразумевает царских сыновей.
- source_word: דְּבָרָיו
  choice: слова Урии
  rationale: Имя повторено вместо потенциально неясного местоимения «его», поскольку в русском предложении ближайшим мужским референтом был бы царь; это сохраняет подлинный смысл текста.
- source_word: וַיְבַקֵּשׁ הַמֶּלֶךְ הֲמִיתוֹ
  choice: царь стал искать возможности убить его
  rationale: Передаёт сочетание намерения и направленного действия в конструкции «искать + умертвить», избегая неестественного русского «искал убить».
- source_word: וַיִּרָא
  choice: испугался
  rationale: Естественно передаёт возникновение страха как реакцию Урии на услышанное.
- source_word: וַיִּבְרַח
  choice: бежал
  rationale: Кратко и точно передаёт срочное бегство.
- source_word: וַיָּבֹא מִצְרָיִם
  choice: пришёл в Египет
  rationale: Русский глагол движения «пришёл» естественно употребляется при указанном пункте назначения и близко соответствует буквальному значению еврейского בוא.
