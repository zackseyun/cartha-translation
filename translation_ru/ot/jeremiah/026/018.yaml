  - severity: low
    issue: Буквализм «гора Дома»
    rationale: В данном контексте «дом» однозначно означает храм. «Гора храма» сохраняет смысл без неестественной для современного русского капитализированной метонимии; сноска может пояснить, что буквально сказано «гора Дома».
