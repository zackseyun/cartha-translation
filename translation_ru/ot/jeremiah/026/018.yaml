source:
  edition: WLC
  text: מיכיה הַ/מּ֣וֹרַשְׁתִּ֔י הָיָ֣ה נִבָּ֔א בִּ/ימֵ֖י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֶל כָּל עַם֩ יְהוּדָ֨ה לֵ/אמֹ֜ר כֹּֽה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת צִיּ֞וֹן שָׂדֶ֤ה תֵֽחָרֵשׁ֙ וִ/ירוּשָׁלַ֨יִם֙ עִיִּ֣ים תִּֽהְיֶ֔ה וְ/הַ֥ר הַ/בַּ֖יִת לְ/בָמ֥וֹת יָֽעַר־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/018.yaml
  text: 'Micah the Morashtite was prophesying in the days of Hezekiah king of Judah[a], and he said to all the people of Judah, saying, “Thus says Yahweh of Armies: Zion will be plowed as a field, and Jerusalem will become ruins[c][b], and the mountain of the house will become wooded heights.”'
translation:
  language: ru
  text: 'Михей из Морешета пророчествовал во дни Езекии, царя Иудеи, и сказал всему народу Иудеи: «Так говорит Яхве Воинств[a]: Сион будет распахан в поле, Иерусалим станет грудами развалин, а гора храма[b] — лесистыми высотами[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Господь Саваоф».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «гора Дома»; то есть храмовая гора.'
    reason: cultural_note
  - marker: c
    text: 'Или: «высотами, поросшими лесом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מיכיה הַמּוֹרַשְׁתִּי
  choice: Михей из Морешета
  rationale: Имя передано в принятой русской форме «Михей», а обозначение происхождения — естественным современным оборотом «из Морешета», точно передающим еврейский нисбовый эпитет.
- source_word: הָיָה נִבָּא
  choice: пророчествовал
  rationale: Сочетание היה с причастием обозначает продолжавшееся в прошлом действие; русский глагол несовершенного вида сохраняет эту длительность без неестественной перифразы.
- source_word: בִּימֵי
  choice: во дни
  rationale: Сохраняет характерный библейский временной оборот, оставаясь понятным в современном литературном русском.
- source_word: וַיֹּאמֶר אֶל כָּל עַם יְהוּדָה לֵאמֹר
  choice: и сказал всему народу Иудеи
  rationale: Формула לֵאמֹר не воспроизводится отдельным «говоря», поскольку в русском оно было бы избыточным; прямая речь ясно передаёт её функцию.
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  choice: Так говорит Яхве Воинств
  rationale: Личное имя יהוה передано как «Яхве», а צבאות — прозрачным словом «Воинств», сохраняющим множественное число и военный образ исходного титула.
- source_word: צִיּוֹן שָׂדֶה תֵחָרֵשׁ
  choice: Сион будет вспахан, как поле
  rationale: Передаёт пассивную форму и образ священного города, превращённого в обрабатываемую землю; «как поле» естественно выражает предикативное сравнение.
- source_word: עִיִּים
  choice: грудами развалин
  rationale: Множественное число указывает не просто на состояние разрушенности, а на развалины или нагромождения обломков; русский оборот сохраняет конкретность образа.
- source_word: וְהַר הַבַּיִת
  choice: а гора Дома
  rationale: Буквальное выражение «гора Дома» сохранено, поскольку «Дом» в контексте обозначает храм; пояснение дано в сноске, а не внесено в основной текст.
- source_word: לְבָמוֹת יָעַר
  choice: лесистыми высотами
  rationale: 'Сохраняет оба компонента выражения: בָּמוֹת — «высоты», יַעַר — «лес»; фраза рисует храмовую гору как одичавшую и заросшую местность, не уточняя сверх источника характер этих высот.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Передача божественного титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; воинств небесных
  rationale: «Воинств» прямо передаёт конкретный образ и множественное число, тогда как «Саваоф» для многих современных читателей непрозрачно, а добавление «небесных» отсутствует в этом стихе.
- issue: Значение הַבַּיִת
  choice: Дом, то есть храм
  alternative: храм
  rationale: Основной текст сохраняет метонимическое выражение источника и его сакральную весомость; референт поясняется в сноске без подмены формулировки.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Оборот «во дни» и написание «Дом» сохраняют сакральный колорит, но синтаксис остаётся ясным и естественным. Эллиптическая заключительная конструкция оформлена русским тире.
