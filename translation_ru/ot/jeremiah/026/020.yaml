  text: וְ/גַם אִ֗ישׁ הָיָ֤ה מִתְנַבֵּא֙ בְּ/שֵׁ֣ם יְהוָ֔ה אֽוּרִיָּ֨הוּ֙ בֶּֽן שְׁמַעְיָ֔הוּ מִ/קִּרְיַ֖ת הַיְּעָרִ֑ים וַ/יִּנָּבֵ֞א עַל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל הָ/אָ֣רֶץ הַ/זֹּ֔את כְּ/כֹ֖ל דִּבְרֵ֥י יִרְמְיָֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/020.yaml
  text: And there was also a man prophesying in the name of Yahweh[a], Uriah son of Shemaiah from Kiriath-jearim[b], and he prophesied against this city and against this land according to all the words of Jeremiah.
translation:
  language: ru
  text: Был также человек, пророчествовавший от имени Яхве, — Урия, сын Шемаии, из Кириаф-Иарима. Он пророчествовал против этого города и против этой земли[a], согласно всем словам Иеремии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «об этом городе и об этой земле». Еврейский предлог может обозначать тему пророчества вообще, хотя контекст здесь, вероятнее всего, указывает на пророчество суда, направленное против города и земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אִישׁ הָיָה מִתְנַבֵּא
  choice: Был также человек, пророчествовавший
  rationale: Передаёт добавочный характер וְגַם и описательную, продолженную ситуацию конструкции הָיָה с причастием естественным современным русским языком.
- source_word: בְּשֵׁם יְהוָה
  choice: от имени Яхве
  rationale: Русская идиома «от имени» ясно выражает речь, произносимую с притязанием на Божью власть; тетраграмматон передан личным именем «Яхве».
- source_word: אוּרִיָּהוּ בֶּן שְׁמַעְיָהוּ
  choice: Урия, сын Шемаии
  rationale: Имена транслитерированы в формах, естественных для русской библейской ономастики; родственная связь сохранена буквально.
- source_word: מִקִּרְיַת הַיְּעָרִים
  choice: из Кириаф-Иарима
  rationale: Топоним передан традиционной русской библейской формой, а предлог מִ־ — естественным указанием на происхождение «из».
- source_word: וַיִּנָּבֵא
  choice: Он пророчествовал
  rationale: Сохраняет повтор того же еврейского глагольного корня и ясно продолжает повествование.
- source_word: עַל הָעִיר הַזֹּאת וְעַל הָאָרֶץ הַזֹּאת
  choice: против этого города и против этой земли
  rationale: В контексте пророчества о суде עַל имеет вероятный враждебно-направленный оттенок; возможное более общее значение отмечено в сноске.
- source_word: כְּכֹל דִּבְרֵי יִרְמְיָהוּ
  choice: в полном согласии со всеми словами Иеремии
  rationale: 'Передаёт значение соответствия: пророчество Урии совпадало по содержанию с речами Иеремии, не предполагая дословного повторения.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное Божье имя; «Яхве» непосредственно сохраняет это различие без замены титулом.
- issue: Смысл предлога עַל при пророчестве
  choice: против этого города и против этой земли
  alternative: об этом городе и об этой земле
  rationale: Контекст обвинительного пророчества благоприятствует значению «против», однако более нейтральное тематическое значение остаётся языково возможным и потому указано в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис разделён на два предложения ради ясности; лексический повтор «пророчествовавший / пророчествовал» намеренно сохраняет повтор еврейского корня.
