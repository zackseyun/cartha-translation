source:
  edition: WLC
  text: לִ/שְׁמֹ֗עַ עַל דִּבְרֵ֨י עֲבָדַ֣/י הַ/נְּבִאִ֔ים אֲשֶׁ֥ר אָנֹכִ֖י שֹׁלֵ֣חַ אֲלֵי/כֶ֑ם וְ/הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֥א שְׁמַעְתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/005.yaml
  text: to listen to the words of my servants the prophets[a], whom I am sending to you, rising early and sending, though you have not listened,
translation:
  language: ru
  text: чтобы слушать слова Моих слуг — пророков, которых Я вновь и вновь посылаю к вам[a], но вы не слушали,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рано вставая и посылая» — еврейский оборот, обозначающий настойчивое, неоднократное действие.'
    reason: Сохраняет буквальный образ идиомы וְהַשְׁכֵּם וְשָׁלֹחַ и объясняет её смысл.
lexical_decisions:
- source_word: לִשְׁמֹעַ עַל דִּבְרֵי
  choice: слушать слова
  rationale: Инфинитив продолжает условную конструкцию предыдущего стиха. При שׁמע предлог עַל вводит то, к чему следует прислушаться; «слушать слова» сохраняет повтор с заключительным שְׁמַעְתֶּם и не сужает значение до явного «повиноваться».
- source_word: עֲבָדַי הַנְּבִאִים
  choice: Моих слуг — пророков
  rationale: עֶבֶד здесь обозначает состоящих на Божьем служении посланников; «слуги» естественно передаёт этот статус без неуместного акцента на рабском социальном положении. Тире ясно выражает приложение.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אֲלֵיכֶם
  choice: которых Я ... посылаю к вам
  rationale: Причастие שֹׁלֵחַ передаёт продолжающееся или повторяющееся действие; русское настоящее время естественно сохраняет этот оттенок.
- source_word: וְהַשְׁכֵּם וְשָׁלֹחַ
  choice: вновь и вновь посылаю
  rationale: Буквально «рано вставая и посылая»; устойчивое еврейское сочетание подчёркивает настойчивое, неоднократное действие. Идиоматический русский перевод включён в сказуемое, а буквальный образ отмечен в сноске.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: но вы не слушали
  rationale: Союз וְ здесь имеет противительный оттенок на фоне постоянного посылания пророков. Прошедшее несовершенное «не слушали» естественно выражает длительный и повторявшийся отказ.
theological_decisions:
- issue: Антропоморфный оборот וְהַשְׁכֵּם וְשָׁלֹחַ
  choice: вновь и вновь посылаю
  alternative: рано вставая и посылая
  rationale: В данном пророческом обороте образ раннего вставания выражает Божью неустанную и своевременную инициативу, а не сообщает прежде всего о времени суток. Основной текст передаёт функцию идиомы, сноска сохраняет её буквальную форму.
- issue: Значение עֲבָדַי
  choice: Моих слуг
  alternative: Моих рабов
  rationale: В формуле «Мои слуги — пророки» слово обозначает уполномоченных Богом служителей. «Слуги» передаёт контекстуальный смысл, не вводя в центр стиха тему подневольного статуса.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные «Моих», «Я» следуют принятому в русском библейском стиле обозначению речи Бога. Начальное «чтобы» и конечная запятая отражают синтаксическую зависимость стиха от Иер 26:4; повтор «слушать / не слушали» намеренно сохраняет лексическую связь оригинала.
