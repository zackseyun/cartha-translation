base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/011.yaml
  text: Then the priests and the prophets said to the officials and to all the people, saying, “A sentence of death is for this man, because he has prophesied against this city, just as you have heard with your own ears.”
translation:
  language: ru
  text: 'Тогда священники и пророки сказали начальникам и всему народу: «Этот человек подлежит смерти, потому что он пророчествовал против этого города, как вы сами слышали».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: начальникам
  rationale: Обозначает представителей власти, участвующих в разбирательстве; «начальники» естественно и достаточно широко передаёт их положение.
- source_word: מִשְׁפַּט מָוֶת
  choice: подлежит смерти
  rationale: Идиома выражает правовое требование смертного приговора или признание виновным, заслуживающим смерти. Такая формулировка сохраняет юридический оттенок и звучит естественно по-русски.
- source_word: נִבָּא אֶל
  choice: пророчествовал против
  rationale: Хотя предлог אֶל обычно значит «к», в данном контексте речь идёт о неблагоприятном пророчестве, направленном против города.
- source_word: בְּאָזְנֵיכֶם
  choice: вы сами слышали
  rationale: Буквально «своими ушами»; русская идиома «сами слышали» естественно передаёт акцент на непосредственном свидетельстве слушателей.
theological_decisions:
- issue: Основание требования смертного приговора
  choice: Сохранено обвинение в пророчестве против города без оценки его справедливости.
  alternative: Уточнить, что пророчество сочли богохульным или ложным.
  rationale: Еврейский текст не называет здесь более конкретного религиозно-правового основания; такое уточнение было бы толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной и судебной сцены. Формула «сказали…» не дублируется отдельным «говоря», поскольку в русском это тяжеловесно и не добавляет смысла.
