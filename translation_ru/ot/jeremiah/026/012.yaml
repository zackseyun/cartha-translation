base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/012.yaml
  text: Then Yirmeyahu said to all the officials and to all the people, saying, “The LORD sent me to prophesy against this house and against this city all the words that you have heard.”
translation:
  language: ru
  text: 'Тогда Иеремия сказал всем вельможам и всему народу: «Господь послал меня пророчествовать против этого дома и против этого города, возвещая все слова, которые вы слышали».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: вельможам
  rationale: В данном судебно-общественном контексте слово обозначает высокопоставленных руководителей Иудеи; «вельможи» естественно передаёт их статус, не сужая значение до современного чиновничества.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, уместная для общедоступного библейского текста.
- source_word: לְהִנָּבֵא אֶל
  choice: пророчествовать против
  rationale: Хотя предлог אֶל обычно означает направление «к», содержание пророчества в этом контексте обвинительное и направлено против храма и города; такая передача точно выражает прагматический смысл.
- source_word: הַבַּיִת הַזֶּה
  choice: этого дома
  rationale: Сохранено исходное «дом» как контекстуальное обозначение храма без поясняющего расширения в основном тексте.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: возвестить все слова
  rationale: Инфинитив «возвестить» по-русски ясно связывает «все слова» с поручением пророчествовать и устраняет синтаксическую тяжеловесность без изменения смысла.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбрана укоренённая русская библейская форма; она не добавляет конфессионального толкования и сохраняет узнаваемость текста.
- issue: Направленность пророчества
  choice: против этого дома и против этого города
  alternative: об этом доме и об этом городе / к этому дому и к этому городу
  rationale: Ближайший контекст Иер 26:6, 9 показывает, что речь идёт о пророчестве суда. «Против» сохраняет обвинительную силу высказывания, не уточняя сверх контекста характер исполнения суда.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-пророческой сцены. Формульное לֵאמֹר не передано отдельным «говоря», поскольку после глагола речи и двоеточия это было бы неестественно; содержание формулы сохранено прямой речью.
