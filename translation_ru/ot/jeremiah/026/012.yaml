review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан верно: Иеремия обращается ко всем вельможам и народу и утверждает, что Господь послал его пророчествовать против этого дома и города. Однако добавленный после тире самостоятельный инфинитив «возвестить» создает впечатление второго поручения, которого в еврейском тексте нет: «все слова» являются содержанием пророчества.'
  naturalness: Фраза в целом литературна, но конструкция «пророчествовать ... — возвестить» синтаксически неудачна. Деепричастный оборот естественно связывает возвещение слов с действием пророчества.
  terminology: «Господь» — допустимая традиционная передача יהוה. «Вельможам» уместно для שָׂרִים в историческом судебно-общественном контексте. «Против» оправдано ближайшим контекстом судебного пророчества и соответствует английской аудиторской линии.
  issues:
  - severity: medium
    issue: Самостоятельный инфинитив «возвестить» после тире
    rationale: В оригинале имеется один инфинитив «пророчествовать»; «все слова, которые вы слышали» зависит от него как содержание пророчества. Следует избежать представления «возвестить» как отдельной цели послания.
  revised_text: 'Тогда Иеремия сказал всем вельможам и всему народу: «Господь послал меня пророчествовать против этого дома и против этого города, возвещая все слова, которые вы слышали».'
