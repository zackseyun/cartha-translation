base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/009.yaml
  text: Why have you prophesied in the name of the LORD, saying, ‘This house will become like Shiloh, and this city will be laid waste, with no inhabitant’?” Then all the people gathered against Jeremiah in the house of the LORD.
translation:
  language: ru
  text: '«Почему ты пророчествовал от имени Господа, говоря: „Этот дом станет как Силом, а этот город будет разорён и останется без жителей“?» И весь народ собрался против Иеремии в доме Господа.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַדּוּעַ נִבֵּיתָ
  choice: Почему ты пророчествовал
  rationale: Прямо передаёт вопрос и форму совершенного вида; речь идёт о только что произнесённом пророчестве.
- source_word: בְשֵׁם יְהוָה
  choice: от имени Господа
  rationale: Естественная русская формула для действия с заявленной властью Яхве; традиционное «Господь» уместно передаёт тетраграмматон.
- source_word: כְשִׁלוֹ יִהְיֶה הַבַּיִת הַזֶּה
  choice: Этот дом станет как Силом
  rationale: Сохраняет краткое историческое сравнение и значение יִהְיֶה как будущего состояния, не добавляя объяснения участи Силома.
- source_word: תֶּחֱרַב מֵאֵין יוֹשֵׁב
  choice: будет разорён и останется без жителей
  rationale: תֶּחֱרַב означает опустошение или разорение; מֵאֵין יוֹשֵׁב указывает на отсутствие живущих в городе. Русская координация ясно передаёт итоговое состояние.
- source_word: וַיִּקָּהֵל כָּל־הָעָם אֶל־יִרְמְיָהוּ
  choice: И весь народ собрался против Иеремии
  rationale: Предлог אֶל обычно направительный, но контекст враждебного окружения позволяет естественное «против»; это сохраняет силу английского консультационного слоя.
- source_word: בְּבֵית יְהוָה
  choice: в доме Господа
  rationale: Буквально и естественно передаёт место действия без добавленного слова «храм».
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная русская библейская передача тетраграмматона; она не вводит конфессионально-специфического толкования.
- issue: Характер собрания народа вокруг Иеремии
  choice: собрался против Иеремии
  alternative: собрался к Иеремии / вокруг Иеремии
  rationale: Контекст угрозы пророку поддерживает враждебное значение, хотя сам предлог допускает более нейтральное направление. Выбранный вариант естественен и согласуется с непосредственным повествовательным контекстом.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис сохранён компактным; историческая отсылка к Силому намеренно не разъясняется внутри стиха.
