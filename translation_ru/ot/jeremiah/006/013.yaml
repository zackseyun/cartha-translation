  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «каждый» и параллельные обороты «от… до…» сохраняют ритм и всеохватность еврейского обвинения. Лексика понятна широкому читателю; подлинная широта выражений בּוֹצֵעַ בָּצַע и עֹשֶׂה שָּׁקֶר отражена в примечаниях.
