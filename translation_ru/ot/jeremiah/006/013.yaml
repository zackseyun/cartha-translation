base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/013.yaml
  text: For from their least to their greatest[a], every one of them is greedy for unjust gain; and from prophet to priest[c][b], every one of them practices falsehood.
translation:
  language: ru
  text: Ведь от мала до велика среди них[a] каждый жаждет неправедной наживы[b]; от пророка до священника каждый поступает лживо[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от самого малого среди них до самого великого».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «стремится к наживе»; выражение подразумевает алчное стремление к прибыли, вероятно нечестной или неправедной.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «поступает обманно»; «творит ложь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предшествующего обвинения; «ведь» естественно передаёт пояснительно-причинную связь в современном русском языке.
- source_word: מִקְּטַנָּם וְעַד גְּדוֹלָם
  choice: от мала до велика среди них
  rationale: Сохраняет всеохватный меризм и принадлежность к названной группе, оставаясь естественным русским выражением.
- source_word: כֻּלּוֹ
  choice: каждый
  rationale: 'Передаёт собирательно-распределительный смысл формы: обвинение относится ко всем и к каждому в отдельности.'
- source_word: בּוֹצֵעַ בָּצַע
  choice: жаждет неправедной наживы
  rationale: Однокоренная глагольно-именная конструкция выражает сильное корыстное стремление; «неправедная нажива» передаёт отрицательную нравственную окраску, не сводя смысл к нейтральной прибыли.
- source_word: וּמִנָּבִיא וְעַד כֹּהֵן
  choice: от пророка до священника
  rationale: Сохраняет второй меризм, охватывающий религиозных руководителей, и порядок еврейского текста.
- source_word: עֹשֶׂה שָּׁקֶר
  choice: творит обман
  rationale: Буквально и ёмко передаёт устойчивую деятельность, отмеченную ложью и обманом, а не единичное ложное высказывание.
