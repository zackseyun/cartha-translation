  source_fidelity: 'Текст точно передаёт еврейский оригинал: Бог ставит стражей над народом, звучит повеление прислушаться к звуку шофара, затем следует сознательный отказ народа. «Над вами» корректно сохраняет образ поставленных над народом стражей, не превращая его в враждебное «против вас».'
