  text: וַ/הֲקִמֹתִ֤י עֲלֵי/כֶם֙ צֹפִ֔ים הַקְשִׁ֖יבוּ לְ/ק֣וֹל שׁוֹפָ֑ר וַ/יֹּאמְר֖וּ לֹ֥א נַקְשִֽׁיב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/017.yaml
  text: 'I set watchmen over you: ‘Listen to the sound of the trumpet!’ But they said[b][a], ‘We will not listen.’'
translation:
  language: ru
  text: 'И Я поставил[a] над вами стражей: «Слушайте звук рога[b]!» Но они сказали: «Не будем слушать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначил».'
    reason: lexical_alternative
  - marker: b
    text: Евр. шофар — рог, в который трубили, в частности, подавая сигнал тревоги; традиционный перевод — «труба».
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: И Я поставил
  rationale: Порода hiphil глагола קום передаёт значение «поставить, установить, назначить». «Поставил» сохраняет конкретный образ стражей, поставленных над народом, а начальное «и» отражает повествовательную связь с контекстом.
- source_word: עֲלֵיכֶם
  choice: над вами
  rationale: Предлог עַל с местоименным суффиксом обозначает положение стражей по отношению к народу и их надзорную функцию; «над вами» не привносит излишнего оттенка враждебности.
- source_word: צֹפִים
  choice: стражей
  rationale: Причастие от צפה обозначает тех, кто наблюдает и предупреждает. «Стражи» естественно сохраняет как буквальный образ дозорных, так и его возможное пророческое применение.
- source_word: הַקְשִׁיבוּ
  choice: Слушайте
  rationale: Повелительная форма קשב призывает внимательно прислушаться и в данном контексте передаёт настойчивое предупреждение. «Слушайте» также позволяет сохранить словесный повтор в ответе народа.
- source_word: לְקוֹל
  choice: звук
  rationale: קוֹל при названии сигнального инструмента естественно означает его звук; такой перевод не сужает значение до одного конкретного вида сигнала.
- source_word: שׁוֹפָר
  choice: рога
  rationale: שׁוֹפָר — духовой сигнальный инструмент из рога. «Рог» точнее сохраняет исторический образ, а сноска поясняет его функцию для современного читателя.
- source_word: וַיֹּאמְרוּ
  choice: Но они сказали
  rationale: Союз «но» естественно выражает явное противопоставление Божьего предупреждения и отказа народа, подразумеваемое развитием еврейского повествования.
- source_word: לֹא נַקְשִׁיב
  choice: Не будем слушать
  rationale: Отрицание с формой первого лица множественного числа выражает сознательный отказ. Формулировка сохраняет перекличку с повелением «Слушайте».
theological_decisions:
- issue: Кого обозначают стражи и какова их функция
  choice: Сохранён общий образ стражей, поставленных Богом предупреждать народ, без уточнения их личности.
  alternative: Прямо назвать их пророками, военными дозорными или руководителями народа.
  rationale: Еврейский текст не определяет их точнее. Перевод «стражи» сохраняет метафорическую широту и не устраняет богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Повтор «Слушайте — не будем слушать» сохранён как важный риторический элемент. Кавычки разграничивают Божье повеление и ответ народа.
