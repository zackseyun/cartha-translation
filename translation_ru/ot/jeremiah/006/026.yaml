  text: בַּת עַמִּ֤/י חִגְרִי שָׂק֙ וְ/הִתְפַּלְּשִׁ֣י בָ/אֵ֔פֶר אֵ֤בֶל יָחִיד֙ עֲשִׂ֣י לָ֔/ךְ מִסְפַּ֖ד תַּמְרוּרִ֑ים כִּ֣י פִתְאֹ֔ם יָבֹ֥א הַ/שֹּׁדֵ֖ד עָלֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/026.yaml
  text: Daughter of my people[a], put on sackcloth and roll in ashes; make mourning as for an only son, a most bitter lamentation[c][b], for suddenly the destroyer will come upon us.
translation:
  language: ru
  text: Дочь народа моего, опояшься вретищем и катайся в пепле; скорби, как по единственному сыну, и горько рыдай, потому что внезапно придёт на нас разоритель.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת עַמִּי
  choice: Дочь народа моего
  rationale: Сохранены прямое обращение и пророческое олицетворение народа в женском образе.
- source_word: חִגְרִי שָׂק
  choice: опояшься вретищем
  rationale: Глагол буквально означает «опоясаться, обвязаться»; традиционное и понятное в библейском контексте «вретище» точно обозначает одежду скорби.
- source_word: וְהִתְפַּלְּשִׁי בָאֵפֶר
  choice: и валяйся в пепле
  rationale: Возвратная порода передаёт телесное действие — повергаться или кататься в пепле как знак скорби; «валяйся» сохраняет его силу и конкретность.
- source_word: אֵבֶל יָחִיד
  choice: плач, как по единственному сыну
  rationale: В контексте скорби יָחִיד обозначает единственного, обычно единственного сына; сравнительная передача естественно выражает смысл еврейской конструкции.
- source_word: עֲשִׂי לָךְ
  choice: устрой себе
  rationale: Сохранено значение императива с возвратным местоимением без неестественного буквализма.
- source_word: מִסְפַּד תַּמְרוּרִים
  choice: горькое рыдание
  rationale: מִסְפַּד — громкий погребальный плач, а תַּמְרוּרִים выражает крайнюю горечь; «рыдание» передаёт звучащую, телесную сторону скорби.
- source_word: כִּי פִתְאֹם
  choice: потому что внезапно
  rationale: Сохранены причинная связь и наречие внезапности.
- source_word: הַשֹּׁדֵד
  choice: губитель
  rationale: Причастие обозначает разорителя, опустошителя; «губитель» естественно передаёт действующее лицо и широкий разрушительный смысл.
- source_word: עָלֵינוּ
  choice: на нас
  rationale: Точно сохранено первое лицо множественного числа и переход от обращения к народу к включению пророка в общую участь.
theological_decisions:
- issue: Переход от обращения во втором лице женского рода к первому лицу множественного числа
  choice: 'Сохранить: «Дочь народа моего… придёт на нас»'
  alternative: 'Сгладить местоименную смену: «придёт на тебя»'
  rationale: Еврейский текст включает говорящего в грядущее бедствие. Сглаживание устранило бы пророческую солидарность с народом.
- issue: Значение יָחִיד в образе предельной скорби
  choice: «как по единственному сыну»
  alternative: «как по единственному ребёнку» или буквально «плач единственного»
  rationale: Мужской род слова и устойчивое употребление в формулах плача поддерживают значение «единственный сын», не превращая образ в отвлечённое утверждение.
translation_notes:
  register: Современный литературный русский с торжественной библейской окраской. Слова «вретище» и «губитель» выбраны как ёмкие и понятные в контексте; синтаксис сохраняет настойчивую последовательность повелений и резкий переход к общей угрозе.
