revisions:
- from: Дочь народа моего, опояшься вретищем и валяйся в пепле; устрой себе плач, как по единственному сыну[a], горькое рыдание, потому что внезапно придёт на нас губитель.
  to: Дочь народа моего, опояшься вретищем и катайся в пепле; скорби, как по единственному сыну, и горько рыдай, потому что внезапно придёт на нас разоритель.
  rationale: Заменены сниженное «валяйся» и синтаксически неясная именная цепочка. «Скорби, как по единственному сыну, и горько рыдай» естественно передаёт призыв к трауру и усиленный плач, не устраняя образ единственного сына. Первое лицо множественного числа в заключении сохранено. Сноска оставлена у «единственному сыну» и исправлена в соответствии с лексическим различием между אֵבֶל и מִסְפֵּד.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:12:03Z'
review_pass:
  verdict: revise
  source_fidelity: В целом сохранены обращение к «дочери народа моего», повеления скорби, образ единственного сына и существенный переход к «на нас». Однако «валяйся» в современном русском имеет сниженную, нередко неодобрительную окраску, а сочетание «устрой себе плач ... горькое рыдание» синтаксически неясно передаёт параллельные и усилительные элементы еврейской фразы.
  naturalness: Исправленный вариант сохраняет торжественную библейскую окраску, но избегает разговорного оттенка «валяйся» и тяжёлого нанизывания существительных после «устрой себе».
  terminology: «Вретище» уместно как традиционный термин одежды скорби. «Разоритель» точнее передаёт הַשֹּׁדֵד как действующее лицо, разоряющее и опустошающее, чем несколько более общее «губитель». Сноска уточняет, что буквально сказано не «плач», а «скорбь/траур».
  issues:
  - severity: medium
    issue: «Валяйся в пепле» имеет разговорно-сниженную и потенциально пренебрежительную окраску.
    rationale: В данном пророческом призыве требуется передать ритуальное телесное выражение скорби без оттенка упрёка или бытовой небрежности.
  - severity: medium
    issue: «Устрой себе плач, как по единственному сыну, горькое рыдание» синтаксически неясно.
    rationale: «Горькое рыдание» выглядит неприкреплённым приложением; еврейское усиление лучше передать ясной последовательностью повелений.
  - severity: low
    issue: Сноска неточно называет אֵבֶל «плачем».
    rationale: אֵבֶל обозначает скорбь, траур; плач/рыдание относится к מִסְפֵּד.
  revised_text: Дочь народа моего, опояшься вретищем и катайся в пепле; скорби, как по единственному сыну, и горько рыдай, потому что внезапно придёт на нас разоритель.
