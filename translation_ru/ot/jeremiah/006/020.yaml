  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/מָּה זֶּ֨ה לִ֤/י לְבוֹנָה֙ מִ/שְּׁבָ֣א תָב֔וֹא וְ/קָנֶ֥ה הַ/טּ֖וֹב מֵ/אֶ֣רֶץ מֶרְחָ֑ק עֹלֽוֹתֵי/כֶם֙ לֹ֣א לְ/רָצ֔וֹן וְ/זִבְחֵי/כֶ֖ם לֹא עָ֥רְבוּ לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/020.yaml
  text: 'Why is this to me: frankincense comes from Sheba[a], and sweet cane from a distant land? Your burnt offerings are not acceptable[b], and your sacrifices do not please me.'
translation:
  language: ru
  text: К чему Мне ладан из Савы и благовонный тростник[a] из далёкой страны? Ваши всесожжения Мне неугодны, и ваши жертвы Мне не приятны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ароматический тростник»; возможно, имеется в виду аир.'
    reason: Личность растения קָנֶה הַטּוֹב точно не установлена; выражение может обозначать ароматический тростник или аир.
lexical_decisions:
- source_word: לָמָּה זֶּה לִי
  choice: К чему Мне
  rationale: Естественно передаёт риторический вопрос и значение дательного לִי («Мне»), выражая бесполезность этих даров для Бога, но не добавляя пояснений из контекста.
- source_word: לְבוֹנָה
  choice: ладан
  rationale: Слово обозначает именно ладан, а не благовония вообще; русский термин точен и общепонятен.
- source_word: מִשְּׁבָא
  choice: из Савы
  rationale: Сохранено традиционное русское наименование страны Шева/Сава, откуда привозили ценные благовония.
- source_word: תָבֹוא
  choice: из Савы
  rationale: Значение прибытия или доставки естественно выражено русской конструкцией происхождения товара; буквальное «приходит» здесь звучало бы менее естественно.
- source_word: קָנֶה הַטּוֹב
  choice: благовонный тростник
  rationale: Сочетание обозначает ценный ароматический тростник. «Благовонный» передаёт подразумеваемое качество, а «тростник» сохраняет основное значение קָנֶה.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: из далёкой страны
  rationale: Прямо и естественно передаёт указание на географическую отдалённость.
- source_word: עֹלוֹתֵיכֶם
  choice: ваши всесожжения
  rationale: «Всесожжение» — точный и закрепившийся русский термин для жертвы, полностью сжигаемой на жертвеннике.
- source_word: לֹא לְרָצוֹן
  choice: Мне неугодны
  rationale: Передаёт отсутствие благоволения и принятия Богом, характерное для жертвенного контекста.
- source_word: זִבְחֵיכֶם
  choice: ваши жертвы
  rationale: Общее и ясное обозначение жертвоприношений без неоправданного сужения значения.
- source_word: לֹא עָרְבוּ לִי
  choice: Мне не приятны
  rationale: Сохраняет образ приятности и прямое отношение к говорящему, не сводя выражение к тому же слову, которым передано לֹא לְרָצוֹן.
theological_decisions:
- issue: Божье отвержение дорогостоящих предметов культа и жертв
  choice: 'Сохранено прямое риторическое отвержение: дары и жертвы неугодны Богу.'
  alternative: Можно было пояснить, что причина — лицемерное поклонение или непослушание народа.
  rationale: Сам стих утверждает неприемлемость даров и жертв, но не формулирует здесь её причину; перевод не вносит богословское объяснение из более широкого контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторическое «К чему Мне» звучит естественно и сохраняет резкость Божьего отвержения. Заглавное «Мне» обозначает говорящего Бога по принятой русской библейской орфографии.
