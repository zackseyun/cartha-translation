base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/022.yaml
  text: 'Thus says Yahweh: Behold[a], a people is coming from the land of the north, and a great nation is stirred up from the farthest parts of the earth.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Вот, идёт народ из северной страны, и великий народ пробуждается из самых дальних краёв земли[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из краёв земли»; возможно также: «из отдалённых мест страны». Еврейское выражение обозначает удалённые пределы или окраины, а אֶרֶץ может означать как землю вообще, так и страну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена торжественная формула пророческого вестника; настоящее время естественно для устойчивой вводной формулы, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: הִנֵּה
  choice: Вот
  rationale: «Вот» естественно передаёт призыв обратить внимание и живую непосредственность предупреждения без архаичного русского «се».
- source_word: עַם בָּא
  choice: идёт народ
  rationale: עַם обозначает народ как общность, а причастие בָּא выражает разворачивающееся и близкое действие; порядок слов сохраняет выразительность русского пророческого стиля.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: из северной земли
  rationale: 'Переданы оба компонента выражения: это не только направление с севера, но и земля, откуда приходит враг.'
- source_word: וְגוֹי גָּדוֹל
  choice: и великий народ
  rationale: В данном контексте גּוֹי означает крупный народ; «нация» звучала бы по-современному политически и менее уместно в пророческой речи. Повтор слова «народ» предпочтительнее искусственного различения русскими синонимами.
- source_word: יֵעוֹר
  choice: пробуждается
  rationale: Форма от עור передаёт пробуждение или приведение в движение для действия. Русское «пробуждается» сохраняет образ и не уточняет не названного в тексте деятеля.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: из самых дальних краёв земли
  rationale: יַרְכְּתֵי указывает на удалённые пределы или окраины. Формулировка естественна по-русски и сохраняет пространственную широту и возможную гиперболичность выражения.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה, а не титул. «Яхве» сохраняет его как имя и представляет принятую научную транслитерацию, не подменяя титулом.
- issue: Неуказанный деятель при יֵעוֹר
  choice: пробуждается
  alternative: будет пробуждён; поднимается
  rationale: Текст не называет того, кто приводит народ в движение. Возвратная форма сохраняет эту неопределённость и не вводит прямо ни Бога, ни человеческого правителя как деятеля.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Архаизм «се» и современно-политическое слово «нация» не использованы. Кавычки обозначают прямую речь Яхве; сноска поставлена непосредственно при выражении, которое она поясняет.
