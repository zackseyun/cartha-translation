base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/028.yaml
  text: All of them are the most stubborn rebels[a], going about as slanderers; they are bronze and iron[d][c][b]; all of them are corrupters.
translation:
  language: ru
  text: Все они — закоренелые мятежники[a], ходят и разносят клевету[b]. Все они — бронза и железо[c], все они — губители[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мятежники из мятежников»; это усилительное выражение можно также передать: «главные мятежники».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разносят сплетни», «ходят как сплетники» или «ходят как клеветники».'
    reason: lexical_alternative
  - marker: c
    text: Образ «бронзы и железа», вероятно, указывает на их твёрдость, неочищенность или низменность нравов.
    reason: cultural_note
  - marker: d
    text: 'Или: «разрушители»; еврейское слово может обозначать тех, кто губит, разрушает или развращает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: все они
  rationale: Сохраняет всеохватность и повторение еврейского выражения в начале и конце стиха.
- source_word: סָרֵי סוֹרְרִים
  choice: закоренелые мятежники
  rationale: Передаёт усилительный характер сочетания естественным современным русским языком, не сводя его к буквальному и неясному «мятежники из мятежников».
- source_word: הֹלְכֵי רָכִיל
  choice: ходят и разносят клевету
  rationale: Передаёт привычное, продолжающееся поведение и отрицательный смысл רָכִיל — распространение порочащих слухов или клеветы.
- source_word: נְחֹשֶׁת וּבַרְזֶל
  choice: бронза и железо
  rationale: Сохраняет конкретную металлургическую образность источника; נְחֹשֶׁת в данном сочетании естественно передаётся как «бронза».
- source_word: מַשְׁחִיתִים
  choice: несут погибель
  rationale: Передаёт активное значение причастия Hiphil от שׁחת и сохраняет неоднозначность между причинением разорения, гибели и нравственной порчи.
- source_word: הֵמָּה
  choice: они
  rationale: Явное местоимение сохранено в именной конструкции «они — бронза и железо», что передаёт акцент исходного текста.
