  verdict: revise
  source_fidelity: 'Основной смысл передан верно: интенсивная работа мехов, свинец, тщетность переплавки/очистки и неотделение нечестивых. Однако «свинец поглощён огнём» звучит как неестественный русский страдательный результат и несколько чрезмерно конкретизирует спорную связь огня и свинца. Более нейтральное «свинец израсходован огнём» точнее передаёт принятую в английском аудите линию, при сохранении оговорки в сноске.'
