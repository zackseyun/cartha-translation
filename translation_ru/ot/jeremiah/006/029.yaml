  text: נָחַ֣ר מַפֻּ֔חַ מ/אשת/ם עֹפָ֑רֶת לַ/שָּׁוְא֙ צָרַ֣ף צָר֔וֹף וְ/רָעִ֖ים לֹ֥א נִתָּֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/029.yaml
  text: The bellows blow fiercely[a]; the lead is consumed by the fire. In vain the refiner keeps refining[b], but the wicked are not separated out.
translation:
  language: ru
  text: Мехи с силой раздувают огонь[a], свинец израсходован огнём. Напрасно плавильщик продолжает очищать[b], но нечестивые не отделяются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мехи обгорели; от их огня свинец израсходован». Еврейский текст этой части стиха труден; переводы по-разному передают связь мехов, огня и свинца.'
    reason: textual_variant
  - marker: b
    text: 'Или: «злые не удаляются»; в более узком металлургическом смысле: «примеси не удаляются».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחַר
  choice: яростно раздувают
  rationale: Глагол передаёт тяжёлое дыхание, пыхтение или фырканье; при подлежащем «мехи» естественно описывает их усиленную работу. Возможное значение «обгорели» отмечено в сноске из-за трудности еврейского текста.
- source_word: מַפֻּחַ
  choice: мехи
  rationale: В данном металлургическом контексте речь идёт о кузнечных или плавильных мехах, усиливающих огонь.
- source_word: מֵאִשְׁתָּם
  choice: огнём
  rationale: Трудная форма связана с огнём или горением. Творительный падеж естественно передаёт действие огня, не закрепляя спорную реконструкцию формы.
- source_word: עֹפָרֶת
  choice: свинец
  rationale: Существительное обозначает свинец, применявшийся при очистке металла.
- source_word: לַשָּׁוְא
  choice: напрасно
  rationale: Кратко и естественно выражает тщетность процесса, сохраняя пророческую выразительность.
- source_word: צָרַף ... צָרוֹף
  choice: плавильщик всё плавит и плавит
  rationale: Повтор корня усиливает или продлевает действие. Русская повторная конструкция передаёт настойчивость и безрезультатность плавки; действующее лицо ясно восстановлено из металлургического контекста.
- source_word: וְרָעִים
  choice: нечестивые
  rationale: Прилагательное обычно обозначает злых, нечестивых людей. Такой выбор сохраняет нравственный смысл метафоры в контексте Иеремии, тогда как возможный металлургический оттенок указан в сноске.
- source_word: נִתָּקוּ
  choice: не отделяются
  rationale: Форма выражает удаление или отделение. Выбранное соответствие подходит и к очистке металла, и к нравственному образу отделения нечестивых.
theological_decisions:
- issue: Смысл образа неудачной плавки
  choice: 'Неудачная очистка служит образом нравственной неисправимости народа: несмотря на усиленную обработку, нечестивые не отделяются.'
  alternative: Понимать строку лишь как описание неудачного металлургического процесса или перевести רָעִים как «примеси».
  rationale: Ближайший контекст говорит об испытании народа через образ очистки металла. Перевод сохраняет буквальную картину плавки и одновременно её нравственную направленность, не устраняя металлургическую возможность, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский язык с сдержанной пророческой выразительностью. Повтор «всё плавит и плавит» передаёт усиленную форму еврейского глагола; технический образ остаётся понятным без излишне специальной терминологии.
