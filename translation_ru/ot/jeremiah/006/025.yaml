  text: אַל תצאי הַ/שָּׂדֶ֔ה וּ/בַ/דֶּ֖רֶךְ אַל תלכי כִּ֚י חֶ֣רֶב לְ/אֹיֵ֔ב מָג֖וֹר מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/025.yaml
  text: Do not go out into the field[a], and do not walk on the road[b], for the sword of the enemy and terror are on every side.
translation:
  language: ru
  text: Не выходи в поле[a] и не ходи по дороге[b], потому что меч врага и ужас — со всех сторон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в открытую местность».'
    reason: lexical_alternative
  - marker: b
    text: Оба запрета обращены к одному лицу женского рода; вероятно, Иерусалим (или дочь Сиона) представлен здесь как женщина.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תצאי
  choice: Не выходи
  rationale: Отрицательная частица אַל с формой 2-го лица женского рода единственного числа выражает запрет; «не выходи» естественно передаёт движение наружу.
- source_word: הַשָּׂדֶה
  choice: в поле
  rationale: שׂדה обозначает поле или открытую местность; русское «в поле» здесь непосредственно и естественно.
- source_word: וּבַדֶּרֶךְ אַל תלכי
  choice: и не ходи по дороге
  rationale: דרך — дорога или путь, а הלך — идти, ходить. «Ходи по дороге» сохраняет отличие от предшествующего «выходи» и хорошо передаёт предупреждение не отправляться в путь.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание запрета; «потому что» ясно выражает причинную связь.
- source_word: חֶרֶב לְאֹיֵב
  choice: у врага меч
  rationale: 'Конструкция с לְ допускает посессивное понимание: «у врага меч». Такой перевод близок к еврейской конструкции, естественен по-русски и не требует добавлять отсутствующий в тексте глагол нападения.'
- source_word: מָגוֹר מִסָּבִיב
  choice: вокруг — ужас
  rationale: מָגוֹר означает ужас или страх, а מִסָּבִיב — вокруг, со всех сторон. Краткая именная конструкция сохраняет резкость пророческого предупреждения и узнаваемую формулу Иеремии.
theological_decisions:
- issue: Адресат выражен формами женского рода единственного числа
  choice: Сохранить женский род в глаголах «выходи» и «ходи», пояснив вероятную персонификацию в сноске
  alternative: Назвать Иерусалим или дочь Сиона непосредственно в основном тексте
  rationale: Еврейский текст имени адресата в этом стихе не называет. Добавление имени сняло бы сохраняемую текстом подразумеваемость; сноска даёт необходимый контекст без расширения основного текста.
translation_notes:
  register: Современный литературный русский язык с краткой, напряжённой пророческой интонацией. Формулировка «у врага меч» сохраняет посессивную конструкцию оригинала, а тире в «вокруг — ужас» передаёт лаконизм еврейской именной фразы.
