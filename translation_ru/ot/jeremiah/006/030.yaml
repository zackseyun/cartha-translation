  yaml_path: translation/ot/jeremiah/006/030.yaml
  text: They call them rejected silver[a], because Yahweh has rejected them.
translation:
  language: ru
  text: Отвергнутым серебром[a] называют их, потому что Яхве отверг их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «негодным серебром», «презренным серебром». Еврейское выражение продолжает образ очистки металла: после испытания его признали непригодным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף נִמְאָס
  choice: отвергнутое серебро
  rationale: 'Сочетание сохраняет образ очищения металла и повтор корня מאס во второй части стиха: серебро «отвергнуто», потому что Яхве «отверг» народ.'
- source_word: קָרְאוּ לָהֶם
  choice: называют их
  rationale: Форма 3-го лица множественного числа допускает неопределённый субъект; русское «называют» непосредственно передаёт активную конструкцию, не добавляя действующее лицо.
- source_word: כִּי
  choice: потому что
  rationale: Передаёт причинную связь между наименованием и решением Яхве.
- source_word: מָאַס
  choice: отверг
  rationale: Тот же корень מאס стоит в определении נִמְאָס; одинаковый перевод сохраняет намеренный словесный повтор и судебный оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: בָּהֶם
  choice: их
  rationale: При глаголе מאס предлог ב отмечает объект отвержения; по-русски это естественно передаётся прямым дополнением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо употреблён тетраграмматон; «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Связь образа негодного серебра с Божьим решением
  choice: сохранить повтор «отвергнутым — отверг»
  alternative: «негодным серебром — забраковал»
  rationale: 'Повтор одного русского корня отражает повтор מאס и не смягчает богословское напряжение: человеческое наименование обусловлено отвержением со стороны Яхве.'
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной пророческой формулировкой. Инверсия «Отвергнутым серебром называют их» сохраняет акцент на метафорическом наименовании и звучит естественно в возвышенном контексте.
