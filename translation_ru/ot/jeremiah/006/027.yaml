  source_fidelity: 'Перевод точно передаёт основные элементы масоретского текста: назначение Иеремии («Я поставил тебя»), образ испытателя, положение среди Божьего народа, трудный образ «крепости», а также последующее распознавание и испытание «их пути». Целевое «чтобы» для וְתֵדַע уместно; «узнал и испытал» естественно передаёт два глагола, сохраняя повтор корня בחן.'
