  text: בָּח֛וֹן נְתַתִּ֥י/ךָ בְ/עַמִּ֖/י מִבְצָ֑ר וְ/תֵדַ֕ע וּ/בָחַנְתָּ֖ אֶת דַּרְכָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/027.yaml
  text: I have made you a tester among my people[a], a fortress[b], so that you may know and test their way.
translation:
  language: ru
  text: Я поставил тебя испытателем[a] среди Моего народа, крепостью[b], чтобы ты узнал и испытал их путь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем, кто проверяет качество». В окружающем контексте используется образ испытания металла, поэтому возможен более специальный смысл: «пробирщиком».'
    reason: lexical_alternative
  - marker: b
    text: Еврейская фраза здесь предельно сжата и трудна. Масоретский текст буквально содержит слово «крепость» или «укреплённое место»; его точная связь со словом «испытатель» не вполне ясна.
    reason: textual_or_syntactic_difficulty
  - marker: c
    text: «Путь» здесь может означать поведение или образ жизни.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחוֹן
  choice: испытателем
  rationale: Существительное от корня בחן обозначает того, кто проверяет или испытывает; в ближайшем контексте речь идёт об испытании металла. «Испытатель» сохраняет связь с однокоренным глаголом וּבָחַנְתָּ и остаётся понятным современному читателю.
- source_word: נְתַתִּיךָ
  choice: Я поставил тебя
  rationale: Глагол נתן буквально означает «дать» или «поставить», а здесь выражает назначение на определённую роль. «Поставил» естественно передаёт это значение, не превращая назначение в изменение сущности.
- source_word: בְעַמִּי
  choice: среди Моего народа
  rationale: Предлог ב допускает значения «в» и «среди»; «среди Моего народа» естественно описывает положение пророка по отношению к народу.
- source_word: מִבְצָר
  choice: крепостью
  rationale: Обычное значение существительного — «крепость», «укреплённое место». Конкретный образ сохранён, хотя связь этого слова с остальным предложением в масоретском тексте сжата и не вполне ясна.
- source_word: וְתֵדַע
  choice: чтобы ты узнал
  rationale: Сочетание союза с имперфектом здесь может выражать цель или следствие назначения. Целевое «чтобы» естественно связывает поручение пророка с распознаванием состояния народа.
- source_word: וּבָחַנְתָּ
  choice: и испытал
  rationale: Перевод сохраняет повтор корня בחן, уже переданного словом «испытатель», и поддерживает образ проверки качества металла.
- source_word: דַּרְכָּם
  choice: их путь
  rationale: דרך может обозначать как буквальный путь, так и образ жизни или поведение. «Их путь» сохраняет метафору и не устраняет намеренно широкое значение.
