  text: וַֽ/יְרַפְּא֞וּ אֶת שֶׁ֤בֶר עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/014.yaml
  text: They have healed the wound of my people lightly[a], saying, ‘Peace, peace,’ when there is no peace.
translation:
  language: ru
  text: 'Они поверхностно лечили рану Моего народа[a], говоря: «Мир, мир», — а мира нет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «легкомысленно»; возможно также: «словно это пустяк».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַפְּאוּ
  choice: залечивают
  rationale: Глагол רפא означает «исцелять, лечить». В данном обвинении форма «залечивают» сохраняет медицинский образ, но в сочетании с «кое-как» передаёт мнимое, не достигшее цели лечение.
- source_word: שֶׁבֶר
  choice: рана
  rationale: Слово может означать перелом, разрушение или тяжёлое повреждение. «Рана» естественно сочетается с образом лечения и передаёт серьёзность бедствия народа.
- source_word: עַמִּי
  choice: Моего народа
  rationale: Прямо передаёт притяжательную конструкцию и сохраняет силу речи Господа о принадлежащем Ему народе.
- source_word: עַל נְקַלָּה
  choice: кое-как
  rationale: Оборот указывает на легковесное, поверхностное отношение к тяжёлому повреждению. «Кое-как» естественно по-русски передаёт небрежность и недостаточность лечения; возможен смысл «как будто это пустяк».
- source_word: לֵאמֹר
  choice: говоря
  rationale: Обычная передача инфинитива, вводящего прямую речь.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: «Мир, мир»
  rationale: 'Повтор сохранён как выражение настойчивого ложного заверения. «Мир» удерживает широкий смысл שָׁלוֹם: благополучие, безопасность и целостность.'
- source_word: וְאֵין שָׁלוֹם
  choice: а мира нет
  rationale: Кратко и естественно выражает резкое противопоставление ложного заверения действительности, не сужая значение слова שָׁלוֹם.
theological_decisions:
- issue: Пророческое обвинение в ложном успокоении
  choice: Сохранить иронию мнимого лечения и прямое опровержение заявления о мире.
  alternative: Перевести буквально «исцелили... с лёгкостью», что может ошибочно создать впечатление действительного исцеления.
  rationale: Сочетание медицинского образа с עַל נְקַלָּה показывает не настоящее восстановление, а легковесное обращение с тяжёлым состоянием народа. Перевод не уточняет, кто именно действует, поскольку в данном стихе субъект прямо не назван.
translation_notes:
  register: Современный литературный русский язык с кратким, обличительным ритмом. Прописная буква в «Моего» обозначает говорящего Бога по русской библейской издательской традиции. Повтор «Мир, мир» намеренно сохранён.
