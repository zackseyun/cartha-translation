  text: קֶ֣שֶׁת וְ/כִיד֞וֹן יַחֲזִ֗יקוּ אַכְזָרִ֥י הוּא֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת צִיּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/023.yaml
  text: They seize bow and javelin; they are cruel and show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Zion.
translation:
  language: ru
  text: Они держат лук и копьё; они жестоки и не знают жалости. Гул их подобен рёву моря. Они едут на конях, выстроившись как один человек[a] для битвы против тебя, дочь Сиона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выстроившись как воин». Еврейское выражение буквально значит «как человек/муж» и может указывать либо на единый строй войска — «как один человек», либо на его готовность к бою — «как воин».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת וְכִידוֹן יַחֲזִיקוּ
  choice: Они держат лук и копьё
  rationale: Глагол יַחֲזִיקוּ здесь означает держать или иметь наготове оружие. «Держат» точно передаёт форму без излишне конкретного оттенка «хватают». כִידוֹן допускает значения «дротик» и «копьё»; современное «копьё» естественно и не создаёт неоправданно узкой картины.
- source_word: אַכְזָרִי הוּא וְלֹא יְרַחֵמוּ
  choice: они жестоки и не знают жалости
  rationale: Единственное число אַכְזָרִי הוּא относится к собирательно представленному народу, тогда как окружающие глаголы стоят во множественном числе. Русское множественное согласование естественно; «не знают жалости» идиоматично передаёт отсутствие милосердия.
- source_word: קוֹלָם כַיָּם יֶהֱמֶה
  choice: Гул их подобен рёву моря
  rationale: קוֹלָם обозначает совокупный звук войска, а יֶהֱמֶה — шум, гул или рёв. Формулировка сохраняет мощный звуковой образ и избегает неестественного «голос их».
- source_word: וְעַל סוּסִים יִרְכָּבוּ
  choice: Они скачут на конях
  rationale: יִרְכָּבוּ буквально описывает езду верхом. В военном контексте «скачут на конях» звучит живо и естественно, не добавляя нового действия.
- source_word: עָרוּךְ כְּאִישׁ לַמִּלְחָמָה
  choice: выстроившись, как один воин
  rationale: עָרוּךְ имеет военный смысл построенности или готовности к бою. כְּאִישׁ формально значит «как человек/муж», но в контексте может обозначать либо подобие воину, либо единство строя; основной текст естественно выражает второе, а сноска сохраняет первое.
- source_word: עָלַיִךְ בַּת צִיּוֹן
  choice: против тебя, дочь Сиона
  rationale: Сохранены обращение во втором лице женского рода и поэтическая персонификация города. «Дочь Сиона» — понятная и укоренённая русская форма еврейской конструкции.
theological_decisions:
- issue: Персонификация בַּת צִיּוֹן
  choice: дочь Сиона
  alternative: дочь-Сион / дочь Сион
  rationale: Выражение представляет Сион, то есть Иерусалим, как женщину, к которой обращается пророк. Традиционная русская форма сохраняет образ и не вносит дополнительного богословского толкования.
- issue: Неоднозначность כְּאִישׁ
  choice: как один воин
  alternative: как воин
  rationale: Сингулярная форма может подчёркивать единый строй войска или сравнивать его готовность с готовностью воина. Неоднозначность сохранена с помощью сноски, а не устранена молча.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Военная образность передана ясно и энергично; архаизмы сведены к минимуму, а традиционное выражение «дочь Сиона» сохранено ради узнаваемости и точности.
