source:
  edition: WLC
  text: כְּ/הָקִ֥יר בור מֵימֶ֔י/הָ כֵּ֖ן הֵקֵ֣רָה רָעָתָ֑/הּ חָמָ֣ס וָ֠/שֹׁד יִשָּׁ֨מַע בָּ֧/הּ עַל פָּנַ֛/י תָּמִ֖יד חֳלִ֥י וּ/מַכָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/007.yaml
  text: As a well keeps its waters fresh[a], so she keeps her evil fresh. Violence and destruction are heard in her[c][b]; before me continually are sickness and wounds.
translation:
  language: ru
  text: Как колодец сохраняет свои воды свежими, так и она сохраняет свежим своё зло.[a] В ней слышны насилие и разорение;[b] предо Мною постоянно — болезнь и рана.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол здесь труден для истолкования. Возможно также: «Как водоём охлаждает свою воду, так и она охлаждает своё зло» или «Как колодец источает свои воды, так и она источает своё зло».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переведённое как «разорение», может также означать опустошение, разрушение или грабёж.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «перед Моим лицом постоянно — болезнь и рана». Эти слова могут обозначать как видимые страдания, так и образно описывать состояние города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהָקִיר / הֵקֵרָה
  choice: сохраняет ... свежими / свежим
  rationale: 'Одинаковый русский глагольный оборот передаёт параллелизм двух трудных форм еврейского глагола: как колодец постоянно сохраняет воду свежей, так город постоянно сохраняет своё зло. Необычность образа сохранена, а возможные значения «охлаждает» и «источает» отмечены в сноске.'
- source_word: בּוֹר
  choice: колодец
  rationale: Слово может обозначать также водоём или цистерну. «Колодец» естественно сочетается с образом постоянно свежей либо текущей воды и понятно современному читателю.
- source_word: מֵימֶיהָ
  choice: свои воды
  rationale: Сохранено формальное множественное число еврейского מַיִם и принадлежность воды колодцу.
- source_word: רָעָתָהּ
  choice: своё зло
  rationale: Контекст насилия и разорения указывает прежде всего на нравственное зло, а не на бедствие. Широкое слово «зло» не сужает смысл до одного вида нечестия.
- source_word: חָמָס וָשֹׁד
  choice: насилие и разорение
  rationale: «Насилие» передаёт жестокость и притеснение, а «разорение» — опустошение, грабёж или разрушительный ущерб, не ограничивая שֹׁד только одним оттенком.
- source_word: יִשָּׁמַע בָּהּ
  choice: в ней слышны
  rationale: Сохранена пассивная слуховая формулировка и женское олицетворение Иерусалима; русский оборот допускает как непосредственный шум происходящего, так и постоянно звучащие вести о нём.
- source_word: עַל־פָּנַי תָּמִיד
  choice: предо Мною постоянно
  rationale: «Предо Мною» естественно передаёт буквальное «перед Моим лицом» и сохраняет прямую Божью перспективу; «постоянно» выражает непрерывность.
- source_word: חֳלִי וּמַכָּה
  choice: болезнь и рана
  rationale: Сохранены конкретные телесные образы и грамматическое единственное число обоих существительных; перевод не решает за читателя, буквальны они или метафорически описывают состояние города.
theological_decisions:
- issue: Женское олицетворение Иерусалима
  choice: Сохранить женский образ посредством «она» и «в ней»
  alternative: Говорить о городе в мужском роде или использовать безличную конструкцию
  rationale: Еврейские суффиксы женского рода олицетворяют город. Это часть пророческой риторики и не требует добавления конфессионального толкования.
- issue: Характер «болезни и раны»
  choice: Сохранить конкретную телесную лексику без пояснения в основном тексте
  alternative: Передать абстрактно как «бедствие и поражение» либо истолковать исключительно как нравственное состояние
  rationale: Еврейский текст допускает буквальное и метафорическое восприятие образа. Перевод сохраняет это напряжение, а сноска прямо отмечает неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Форма «предо Мною» сохраняет достоинство прямой божественной речи, не делая весь стих архаичным. Необычный образ свежести зла намеренно сохранён, а не сглажен толкованием.
