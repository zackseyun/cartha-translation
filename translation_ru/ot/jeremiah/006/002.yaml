  text: הַ/נָּוָה֙ וְ/הַ/מְּעֻנָּגָ֔ה דָּמִ֖יתִי בַּת צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/002.yaml
  text: I have likened daughter Zion to a lovely and delicate woman[a].
translation:
  language: ru
  text: Я уподобил дочь Сиона прекрасной и нежной женщине[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Я погублю дочь Сиона, прекрасную и нежную». Еврейский глагол здесь труден для истолкования; некоторые понимают его не в значении «уподобил», а в значении уничтожения.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּוָה
  choice: прекрасной
  rationale: Прилагательное נָוָה здесь естественно понимать как обозначение красоты; в сочетании со следующим определением оно описывает женский образ. «Прекрасной» звучит современно и сохраняет поэтический регистр.
- source_word: וְהַמְּעֻנָּגָה
  choice: и нежной
  rationale: Форма от ענג передаёт мягкость, изнеженность или утончённость. «Нежной» сохраняет образ деликатной, не знавшей лишений женщины и не усиливает неодобрительный оттенок, возможный в слове «изнеженной».
- source_word: דָּמִיתִי
  choice: Я уподобил
  rationale: Форма первого лица единственного числа от דמה наиболее прямо понимается здесь в значении «уподобить, сравнить». Русское «уподобил» сохраняет грамматическую форму и возвышенный поэтический тон. Возможное разрушительное значение отражено в сноске.
- source_word: בַּת צִיּוֹן
  choice: дочь Сиона
  rationale: Сохранена обычная для пророческой речи персонификация Сиона как дочери. Такая формулировка ясна по-русски и не устраняет образность оригинала.
- source_word: implicit feminine referent
  choice: женщине
  rationale: Два определения стоят в женском роде и подразумевают женский образ. Для естественного русского сравнения добавлено нейтральное «женщине»; слово «девушка» необоснованно вносило бы указание на возраст.
theological_decisions:
- issue: Толкование центрального образа стиха
  choice: Стих уподобляет дочь Сиона прекрасной и нежной женщине.
  alternative: 'Возможно: «Я погублю дочь Сиона, прекрасную и нежную».'
  rationale: 'Глагол דָּמִיתִי допускает трудное и спорное истолкование: наряду с обычным значением сравнения некоторые понимают его в смысле уничтожения или прекращения. Основной текст следует более прямому значению דמה — «уподоблять», а альтернативное чтение сохранено в сноске без снятия неоднозначности.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой образностью. Синтаксис прост и понятен; традиционная персонификация «дочь Сиона» сохранена.
