    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיהָ
  choice: К ней
  rationale: Сохраняет основное направительное значение אֶל; враждебный характер приближения становится ясен из контекста осады.
- source_word: רֹעִים וְעֶדְרֵיהֶם
  choice: пастухи со своими стадами
  rationale: Сохраняет развёрнутый пастушеский образ, метафорически обозначающий предводителей и их войска.
- source_word: תָּקְעוּ עָלֶיהָ אֹהָלִים סָבִיב
  choice: разобьют вокруг неё шатры
  rationale: Глагол תקע с объектом «шатры» означает их установку; עָלֶיהָ и סָבִיב вместе передают окружение города вражеским лагерем.
- source_word: רָעוּ
  choice: будет пасти
  rationale: Сохраняет пастушескую метафору и допускает подразумеваемый оттенок опустошения захваченной местности.
- source_word: אִישׁ אֶת יָדוֹ
  choice: каждый ... на своём участке
  rationale: Дистрибутивное אִישׁ передано словом «каждый», а трудная идиома «свою руку» — вероятным контекстуальным значением участка, доставшегося каждому.
theological_decisions:
- issue: Метафорическое обозначение захватчиков
  choice: Сохранены буквальные образы пастухов, стад и выпаса
  alternative: Передать прямо как военачальников, войска и разорение
  rationale: Еврейский текст последовательно поддерживает пастушескую метафору; её прямое истолкование в основном тексте устранило бы образность и возможную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного пророческого образа. «Шатры» выбраны как естественное библейское обозначение походных жилищ; синтаксис сделан ясным без устранения необычной пастушеской метафоры.
