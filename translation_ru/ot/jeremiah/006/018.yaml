base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/018.yaml
  text: Therefore hear[a], O nations, and know, O congregation[b], what is among them.
translation:
  language: ru
  text: Поэтому слушайте, народы, и узнай, община[a], что среди них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собрание», «сообщество». Еврейское עֵדָה — собирательное существительное; кого именно оно здесь обозначает, неясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «что в них». Краткое еврейское выражение может указывать на то, что находится внутри них или среди них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт причинно-следственный переход от предшествующего обличения к следующему призыву.
- source_word: שִׁמְעוּ
  choice: слушайте
  rationale: Форма множественного числа повелительного наклонения; «слушайте» естественно выражает призыв не просто услышать, но внимательно воспринять сказанное.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: Нейтрально передаёт גּוֹיִם в пророческом обращении, не привнося более узкого значения «язычники».
- source_word: וּדְעִי
  choice: и знай
  rationale: Сохранены основное значение ידע и женский род единственного числа, согласованный с собирательным существительным עֵדָה; необычная смена числа отражает форму еврейского текста.
- source_word: עֵדָה
  choice: община
  rationale: Современное собирательное обозначение сообщества, позволяющее сохранить обращение в единственном числе; точный адресат остаётся неясным и отмечен в сноске.
- source_word: אֶת אֲשֶׁר בָּם
  choice: что среди них
  rationale: Сохраняет краткость и неопределённость еврейского оборота, не уточняя, что именно находится или происходит среди них.
theological_decisions:
- issue: Синтаксическая роль и адресат עֵדָה
  choice: 'Понять עֵדָה как самостоятельное обращение к собирательному адресату: «община».'
  alternative: Понять его как приложение к «народам» («собрание народов») либо принять конъектуру из-за трудности строки.
  rationale: Масоретская огласовка וּדְעִי указывает на повелительную форму женского рода единственного числа и естественно соотносится с עֵדָה. Такое прочтение сохраняет форму исходного текста и не вводит предположительной поправки.
- issue: Неопределённость выражения אֶת אֲשֶׁר בָּם
  choice: 'Оставить выражение широким: «что среди них».'
  alternative: «Что в них» или контекстуально дополнить подразумеваемое действие либо событие.
  rationale: Еврейская фраза эллиптична. Уточняющее дополнение могло бы преждевременно разрешить подлинную неоднозначность текста.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого обращения. Необычный переход от множественного «слушайте» к единственному «знай» намеренно сохранён как значимая особенность масоретского текста.
