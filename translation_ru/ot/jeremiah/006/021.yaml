  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י נֹתֵ֛ן אֶל הָ/עָ֥ם הַ/זֶּ֖ה מִכְשֹׁלִ֑ים וְ/כָ֣שְׁלוּ בָ֠/ם אָב֨וֹת וּ/בָנִ֥ים יַחְדָּ֛ו שָׁכֵ֥ן וְ/רֵע֖/וֹ יאבדו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/021.yaml
  text: 'Therefore[a], thus says Yahweh: Behold, I am setting stumbling blocks before this people, and they will stumble over them—fathers and sons together[b]; neighbor and his friend will perish.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве: «Вот, Я ставлю на пути этого народа препятствия, и они споткнутся о них — отцы и сыновья вместе; сосед и его друг погибнут».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие из предшествующего обличения.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет традиционную пророческую формулу посланника и передаёт тетраграмматон личным именем.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет указательную и торжественно-предупреждающую силу еврейского выражения, оставаясь понятным по-русски.
- source_word: נֹתֵן אֶל הָעָם הַזֶּה מִכְשֹׁלִים
  choice: Я ставлю перед этим народом препятствия
  rationale: Причастие передано формой настоящего времени с оттенком близкого действия; «препятствия» сохраняет конкретный образ того, обо что можно споткнуться, без добавления отсутствующих в тексте «камней».
- source_word: וְכָשְׁלוּ בָם
  choice: и они споткнутся о них
  rationale: Сохраняет лексическую и образную связь между препятствиями и последующим падением.
- source_word: אָבוֹת וּבָנִים יַחְדָּו
  choice: отцы и сыновья вместе
  rationale: Точно воспроизводит мужские родственные обозначения и совместность постигшего их суда.
- source_word: שָׁכֵן וְרֵעוֹ
  choice: сосед и его друг
  rationale: Различает живущего рядом человека и его друга или товарища.
- source_word: יֹאבֵדוּ
  choice: погибнут
  rationale: Передаёт тяжёлый итог суда, не уточняя способ гибели сверх еврейского текста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие.
- issue: Характер поставленных препятствий
  choice: Сохранён конкретный образ препятствий, вызывающих падение
  alternative: Истолковать их как ловушки, грехи или определённые исторические бедствия
  rationale: Стих представляет их орудием Божьего суда, но не поясняет здесь их точную природу; перевод не снимает эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис сохраняет параллельные семейную и общественную пары; архаизмы вроде «камни преткновения» и конфессионально закреплённая замена имени титулом не используются.
