    rationale: В еврейском тексте יאבדו — множественное число («погибнут»); изменение не требуется и примечание способно дезинформировать читателя.
  - severity: low
    issue: «Перед этим народом» менее идиоматично для образа размещённых препятствий.
    rationale: Формулировка «на пути этого народа» естественно выражает, что препятствия поставлены так, чтобы народ о них споткнулся, и не добавляет толкования.
