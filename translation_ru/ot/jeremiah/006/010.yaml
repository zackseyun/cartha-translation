id: JER.6.10
reference: Jeremiah 6:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַל מִ֨י אֲדַבְּרָ֤ה וְ/אָעִ֨ידָה֙ וְ/יִשְׁמָ֔עוּ הִנֵּה֙ עֲרֵלָ֣ה אָזְנָ֔/ם וְ/לֹ֥א יוּכְל֖וּ לְ/הַקְשִׁ֑יב הִנֵּ֣ה דְבַר יְהוָ֗ה הָיָ֥ה לָ/הֶ֛ם לְ/חֶרְפָּ֖ה לֹ֥א יַחְפְּצוּ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/010.yaml
  text: To whom shall I speak and give warning[a], that they may hear? Look, their ear is uncircumcised, and they are not able to listen. Look, the word of Yahweh has become a reproach to them[b]; they take no delight in it.
translation:
  language: ru
  text: К кому мне говорить и кого предостерегать[a], чтобы они услышали? Вот, ухо у них необрезано[b], и они не могут внимать. Вот, слово Яхве стало у них предметом поношения; они не находят в нём радости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и свидетельствовать им»; еврейский глагол может обозначать торжественное свидетельство, служащее предостережением.'
    reason: lexical_alternative
  - marker: b
    text: «Ухо у них необрезано» — образ духовной невосприимчивости и нежелания слушаться.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדַבְּרָה
  choice: мне говорить
  rationale: Форма в риторическом вопросе передаёт размышление пророка о том, к кому он ещё может обратиться.
- source_word: וְאָעִידָה
  choice: и кого предостерегать
  rationale: Hифиль глагола עוד здесь обозначает торжественное свидетельство-предупреждение; «предостерегать» естественно передаёт его практическую силу, не исключая значения «свидетельствовать».
- source_word: וְיִשְׁמָעוּ
  choice: чтобы они услышали
  rationale: Целевая конструкция естественно связывает речь и предостережение с желаемым результатом — услышать и откликнуться.
- source_word: עֲרֵלָה אָזְנָם
  choice: ухо у них необрезано
  rationale: Сохранена необычная телесно-заветная метафора оригинала и собирательное единственное число «ухо».
- source_word: לְהַקְשִׁיב
  choice: внимать
  rationale: Передаёт не просто физическое слышание, а сосредоточенное слушание с готовностью принять сказанное.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранено устойчивое пророческое выражение, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: הָיָה לָהֶם לְחֶרְפָּה
  choice: стало у них предметом поношения
  rationale: Передаёт то, что слово Яхве воспринимается ими как нечто постыдное и достойное презрения; «у них» естественно выражает их отношение к нему.
- source_word: לֹא יַחְפְּצוּ בוֹ
  choice: они не находят в нём радости
  rationale: Глагол חפץ сочетает оттенки желания, удовольствия и благоволения; формулировка передаёт их внутреннее неприятие слова.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Метафора «необрезанного уха»
  choice: 'сохранить буквально: «ухо у них необрезано»'
  alternative: «их уши закрыты» / «они духовно глухи»
  rationale: Буквальная метафора сохраняет связь с заветной символикой и намеренную резкость пророческой речи; смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены повтор «Вот» и резкая метафора оригинала; «внимать» поддерживает возвышенный, но понятный регистр.
