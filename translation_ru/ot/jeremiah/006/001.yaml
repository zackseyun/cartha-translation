  text: הָעִ֣זוּ בְּנֵ֣י בִניָמִ֗ן מִ/קֶּ֨רֶב֙ יְר֣וּשָׁלִַ֔ם וּ/בִ/תְק֨וֹעַ֙ תִּקְע֣וּ שׁוֹפָ֔ר וְ/עַל בֵּ֥ית הַכֶּ֖רֶם שְׂא֣וּ מַשְׂאֵ֑ת כִּ֥י רָעָ֛ה נִשְׁקְפָ֥ה מִ/צָּפ֖וֹן וְ/שֶׁ֥בֶר גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/001.yaml
  text: Take cover[a], sons of Benjamin, from the midst of Jerusalem! Blow the trumpet in Tekoa, and raise a signal over Beth-haccherem, for disaster is looking down from the north[d][c][b], and great destruction.
translation:
  language: ru
  text: Бегите, спасаясь[a], сыны Вениамина, из Иерусалима! В Фекое трубите в рог, а над Бет-Керемом[b] поднимите сигнальный знак[c], потому что с севера уже видно бедствие[d] и великое разрушение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «бегите в безопасное место» или «собирайтесь бежать». Еврейская форма трудна для истолкования и передаёт настоятельный призыв искать спасения.'
    reason: lexical_alternative
  - marker: b
    text: Бет-Керем — название местности, вероятно возвышенности, откуда можно было передавать предупредительные сигналы между Иерусалимом и Фекоей.
    reason: cultural_note
  - marker: c
    text: 'Возможные переводы: «поднимите сигнальный огонь» или «зажгите маяк». Еврейское слово не уточняет вид сигнала.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «бедствие смотрит вниз с севера». Грядущая катастрофа изображена как живое существо, выглядывающее с высоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִזוּ
  choice: Спасайтесь бегством
  rationale: В данном контексте повелительная форма выражает срочный призыв искать безопасности и покинуть место опасности. Перевод передаёт и бегство, и цель — спасение, не сводя выражение к призыву проявить силу.
- source_word: בְּנֵי בִנְיָמִן
  choice: сыны Вениамина
  rationale: Сохранено родовое обозначение племени через буквально сыновнее выражение. Форма «сыны» уместна в dignified prophetic address and is understood corporately.
- source_word: מִקֶּרֶב יְרוּשָׁלִַם
  choice: из Иерусалима
  rationale: В сочетании с призывом спасаться естественный русский перевод ясно передаёт выход из города; буквальное «из среды Иерусалима» было бы тяжеловесным.
- source_word: שׁוֹפָר
  choice: рог
  rationale: Речь идёт о сигнальном роге, а не о современной трубе. Краткое «рог» естественно в контексте военной тревоги.
- source_word: וְעַל בֵּית הַכֶּרֶם
  choice: над Бет-Керемом
  rationale: Предлог сохраняет представление о поднятом и видимом издалека сигнале; название местности передано транслитерацией.
- source_word: שְׂאוּ מַשְׂאֵת
  choice: поднимите сигнальный знак
  rationale: מַשְׂאֵת обозначает нечто поднятое как сигнал; перевод не уточняет без достаточных оснований, был ли это огонь, маяк или иной знак.
- source_word: רָעָה
  choice: бедствие
  rationale: В пророческом контексте слово обозначает губительную calamity, а не нравственное зло.
- source_word: נִשְׁקְפָה
  choice: надвигается
  rationale: Естественно передаёт появление угрожающего бедствия со стороны севера. Буквальный образ выглядывающего или смотрящего вниз бедствия сохранён в примечании.
- source_word: שֶׁבֶר גָּדוֹל
  choice: великое разрушение
  rationale: Хотя שֶׁבֶר буквально связано с сокрушением или разломом, здесь оно означает масштабную гибель и разорение.
theological_decisions:
- issue: Родовое обращение к колену Вениамина
  choice: сыны Вениамина
  alternative: народ Вениамина; вениамитяне
  rationale: Сохранён мужской филиальный образ исходного текста, функционирующий как коллективное обозначение племени, без нейтрализации и без ограничения обращения только непосредственными сыновьями патриарха.
- issue: Характер грядущего суда
  choice: бедствие и великое разрушение
  alternative: зло и великое сокрушение
  rationale: Слова описывают наступающую катастрофу; перевод не превращает רָעָה в отвлечённое утверждение о нравственном зле и не добавляет невыраженной доктринальной интерпретации.
- issue: Олицетворение бедствия
  choice: надвигается, с буквальным образом в примечании
  alternative: смотрит вниз; выглядывает
  rationale: Основной текст остаётся естественным по-русски, а примечание сохраняет необычное олицетворение и подлинную образность еврейского глагола.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией пророческого предупреждения. Синтаксис энергичный и понятный; традиционно окрашенное «сыны» сохранено ради родового образа, тогда как тяжеловесные буквальные обороты вынесены в примечания.
