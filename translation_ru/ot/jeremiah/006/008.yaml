    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «душа Моя отторгнется от тебя» или «отчуждится от тебя». Еврейский глагол выражает отстранение, отторжение или отчуждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִוָּסְרִי
  choice: Прими вразумление
  rationale: Нифаль, повелительное наклонение, женский род, единственное число от יסר; обращение к Иерусалиму призывает принять исправляющее наставление или взыскание. «Прими вразумление» передаёт и наставительный, и исправительный оттенки.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Традиционная русская форма топонима; здесь прямое обращение.
- source_word: פֶּן
  choice: иначе… и
  rationale: Частица дважды вводит предупреждение о возможном результате. В современном русском повторное «иначе» перед второй тесно связанной угрозой было бы тяжеловесным, поэтому связь естественно выражена союзом «и».
- source_word: תֵּקַע נַפְשִׁי מִמֵּךְ
  choice: душа Моя отвернётся от тебя
  rationale: Сохраняется явно названная «душа Моя» и образ личного отчуждения или отстранения; «отвернётся» естественно передаёт разрыв отношений, не сводя выражение к простому «Я отвернусь».
- source_word: אֲשִׂימֵךְ שְׁמָמָה
  choice: Я превращу тебя в пустыню
  rationale: שׂים с дополнением означает привести Иерусалим в состояние запустения. Русское «превращу… в пустыню» естественно передаёт результат опустошения.
- source_word: אֶרֶץ לֹא נוֹשָׁבָה
  choice: в необитаемую землю
  rationale: 'Близкая и ясная передача усилительного приложения: землю, которая не населена.'
theological_decisions:
- issue: Антропопатическое выражение נַפְשִׁי о Боге
  choice: душа Моя отвернётся от тебя
  alternative: Я отвернусь от тебя
  rationale: В еврейском тексте прямо сказано «душа Моя». Сохранение образа передаёт личный характер Божьего отстранения и не сглаживает богословское напряжение.
- issue: Условный характер предупреждения с פֶּן
  choice: иначе
  alternative: чтобы не / как бы не
  rationale: Контекст содержит призыв принять исправление и предупреждение о последующем суде. «Иначе» ясно сохраняет связь между непринятым вразумлением и угрозой, не утверждая, что исход уже безусловно наступил.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Прямое обращение и антропопатический образ сохранены; архаичные «дабы» и «не населённая» не используются.
