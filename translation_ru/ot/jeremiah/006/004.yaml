base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/004.yaml
  text: Consecrate war against her; rise up[a], and let us go up at noon. Woe to us, for the day is turning away, for the shadows of evening are stretching out.
translation:
  language: ru
  text: «Освятите войну против неё![a] Вставайте, пойдём на неё в полдень! Горе нам, ибо день клонится, ибо вечерние тени вытягиваются!»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Готовьтесь к войне против неё». В еврейском тексте буквально употреблён язык освящения применительно к войне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: Освятите
  rationale: Порода пиэль передаёт посвящение или освящение; в военном контексте выражение означает сакральную подготовку к войне. «Освятите» сохраняет образ исходного текста, а более обычное значение разъясняется в сноске.
- source_word: עָלֶיהָ
  choice: против неё / на неё
  rationale: Предлог עַל при военной лексике обозначает враждебную направленность. Женский суффикс относится к городу; русское местоимение сохраняет это олицетворение.
- source_word: מִלְחָמָה
  choice: войну
  rationale: Широкое значение существительного лучше передаётся словом «война», а не более узким «битва».
- source_word: קוּמוּ
  choice: Вставайте
  rationale: Повелительная форма выражает настойчивый призыв к немедленному действию; «вставайте» естественно звучит в военной речи.
- source_word: וְנַעֲלֶה
  choice: пойдём на неё
  rationale: Глагол עלה буквально значит «подниматься, идти вверх», но часто обозначает военное выступление против города. «Пойдём на неё» сохраняет движение и враждебную направленность без прямой подстановки слова «атакуем».
- source_word: בַצָּהֳרָיִם
  choice: в полдень
  rationale: Прямой и естественный русский эквивалент обозначения середины дня.
- source_word: אוֹי לָנוּ
  choice: Горе нам!
  rationale: Сохраняет тяжесть возгласа бедствия и высокий, но понятный современному читателю регистр.
- source_word: כִּי פָנָה הַיּוֹם
  choice: День уже клонится
  rationale: Фраза описывает поворот дня к вечеру. Русское «день клонится» естественно передаёт этот образ угасания дня, не уточняя прямо «к вечеру» или «к закату».
- source_word: יִנָּטוּ צִלְלֵי עָרֶב
  choice: вечерние тени вытягиваются
  rationale: נטה здесь изображает тени, которые простираются и становятся длиннее; «вытягиваются» сохраняет динамичный пространственный образ.
theological_decisions:
- issue: Сакрально-военная идиома קַדְּשׁוּ ... מִלְחָמָה
  choice: «Освятите войну против неё»
  alternative: «Готовьтесь к войне против неё»
  rationale: Явная лексика освящения сохраняет богословскую напряжённость образа сакрализованной войны, не утверждая при этом, что Бог одобряет намерения говорящих. Идиоматический смысл дан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким пророческим регистром. Реплики оформлены как прямая речь воинов. Необычное сочетание «освятите войну» намеренно сохранено ради исходного сакрального образа и снабжено пояснением.
