source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּרְת֣וּ עֵצָ֔ה וְ/שִׁפְכ֥וּ עַל יְרוּשָׁלִַ֖ם סֹלְלָ֑ה הִ֚יא הָ/עִ֣יר הָפְקַ֔ד כֻּלָּ֖/הּ עֹ֥שֶׁק בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/006.yaml
  text: 'For thus says Yahweh of hosts: “Cut down trees[a], and heap up a siege ramp against Jerusalem. This is the city that must be punished[b]; there is nothing but oppression within her.”'
translation:
  language: ru
  text: 'Ибо так говорит Яхве Воинств: «Рубите деревья и насыпьте осадный вал против Иерусалима. Это город, который должен быть наказан[a]: в нём повсюду угнетение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это город, который будет посещён»; здесь «посещение» означает призвание к ответу и наказание.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя Бога и широту титула צְבָאוֹת, который может подразумевать небесные и земные воинства.
- source_word: כִּרְתוּ עֵצָה
  choice: Рубите деревья
  rationale: Единственное число עֵצָה имеет собирательное значение; русская форма естественно передаёт заготовку древесины для осадных работ.
- source_word: וְשִׁפְכוּ ... סֹלְלָה
  choice: насыпайте осадный вал
  rationale: Буквально глагол означает «выливайте», но в сочетании с סֹלְלָה это военная идиома о сооружении земляной осадной насыпи.
- source_word: עַל יְרוּשָׁלִַם
  choice: против Иерусалима
  rationale: Предлог передаёт направленность враждебных осадных действий.
- source_word: הָפְקַד
  choice: должен быть наказан
  rationale: В контексте осады פקד означает судебное взыскание и наказание, а не нейтральное посещение.
- source_word: כֻּלָּהּ עֹשֶׁק בְּקִרְבָּהּ
  choice: в нём повсюду угнетение
  rationale: Передаёт тотальность краткой еврейской формулы и естественно звучит по-русски, сохраняя внутреннюю локализацию בְּקִרְבָּהּ.
theological_decisions:
- issue: Характер действия, выраженного הָפְקַד
  choice: должен быть наказан
  alternative: подлежит посещению / должен быть призван к ответу
  rationale: В пророческом контексте осады речь идёт о карающем Божьем взыскании. Основной текст ясно выражает судебный смысл, а примечание сохраняет буквальную метафору «посещения».
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Повеления переданы прямо и энергично; синтаксис остаётся понятным широкому кругу читателей.
