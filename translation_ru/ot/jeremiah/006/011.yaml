  to: А я исполнен ярости Яхве[a] и устал сдерживать её. Излей её на ребёнка на улице и на собрание юношей, собравшихся вместе, потому что будут схвачены и мужчина, и женщина, старик вместе с тем, кто достиг полноты дней[b].
