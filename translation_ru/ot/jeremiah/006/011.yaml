id: JER.6.11
reference: Jeremiah 6:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אֵת֩ חֲמַ֨ת יְהוָ֤ה מָלֵ֨אתִי֙ נִלְאֵ֣יתִי הָכִ֔יל שְׁפֹ֤ךְ עַל עוֹלָל֙ בַּ/ח֔וּץ וְ/עַ֛ל ס֥וֹד בַּחוּרִ֖ים יַחְדָּ֑ו כִּֽי גַם אִ֤ישׁ עִם אִשָּׁה֙ יִלָּכֵ֔דוּ זָקֵ֖ן עִם מְלֵ֥א יָמִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/011.yaml
  text: But I am full of the wrath of Yahweh[a]; I am weary of holding it in. Pour it out on the child in the street, and on the company of young men together; for both man and woman will be taken[b], the old man along with the very aged.
translation:
  language: ru
  text: А я исполнен ярости Яхве[a] и устал сдерживать её. Излей её на ребёнка на улице и на собрание юношей, собравшихся вместе, потому что будут схвачены и мужчина, и женщина, старик вместе с тем, кто достиг полноты дней[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гнева Яхве». Еврейское слово означает сильный, пылающий гнев.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «исполненный дней»; то есть достигший глубокой старости.'
    reason: idiom
lexical_decisions:
- source_word: חֲמַת יְהוָה
  choice: ярости Яхве
  rationale: חֵמָה обозначает пылающий, сильный гнев; «ярость» сохраняет интенсивность образа, а имя יהוה передано как «Яхве».
- source_word: מָלֵאתִי
  choice: я исполнен
  rationale: Перфект выражает достигнутое состояние говорящего; «исполнен» естественно и достойно передаёт наполненность.
- source_word: נִלְאֵיתִי הָכִיל
  choice: устал сдерживать её
  rationale: Сочетание передаёт изнеможение от удерживания внутри только что названной ярости; местоимение проясняет подразумеваемый объект.
- source_word: שְׁפֹךְ
  choice: Излей её
  rationale: Форма передана как повеление, а подразумеваемый объект — ярость Яхве — выражен местоимением.
- source_word: עוֹלָל בַּחוּץ
  choice: ребёнка, что на улице
  rationale: עוֹלָל означает малого ребёнка; придаточная конструкция по-русски яснее связывает его с улицей.
- source_word: סוֹד בַּחוּרִים יַחְדָּו
  choice: собравшихся вместе юношей
  rationale: סוֹד здесь обозначает круг или собрание, а не формальный совет; причастная конструкция естественно включает значение יַחְדָּו.
- source_word: יִלָּכֵדוּ
  choice: будут схвачены
  rationale: Нифаль глагола לכד означает быть захваченным или схваченным; выбранный вариант сохраняет как военный, так и более широкий судебный оттенок.
- source_word: אִישׁ עִם אִשָּׁה
  choice: и мужчина, и женщина
  rationale: Сочетание относится к обоим полам и само по себе не означает супружескую пару.
- source_word: זָקֵן עִם מְלֵא יָמִים
  choice: старик и престарелый
  rationale: Различены пожилой человек и человек, достигший глубокой старости; буквальная идиома пояснена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Собственное заветное имя сохранено как имя, а не заменено титулом.
- issue: Синтаксическая роль שְׁפֹךְ и говорящий
  choice: «Излей её» как повелительная реплика в речи пророка
  alternative: «Я изолью её» как продолжение речи от первого лица
  rationale: Масоретская вокализация непосредственно поддерживает повелительную форму; при этом русский текст не уточняет адресата и тем самым не устраняет напряжённость с предшествующей речью пророка.
- issue: Масштаб суда
  choice: перечисление детей, юношей, мужчин, женщин, стариков и престарелых
  alternative: сведение пар к семейным или общественным категориям
  rationale: Сохранена всеохватность перечисления без внесения идеи брака или официального статуса старейшины.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной пророческой интонацией. Повторы и всеохватное перечисление сохранены; тяжёлые буквальные конструкции сглажены лишь там, где это необходимо для ясности.
