  text: שִׁמְעִ֣י הָ/אָ֔רֶץ הִנֵּ֨ה אָנֹכִ֜י מֵבִ֥יא רָעָ֛ה אֶל הָ/עָ֥ם הַ/זֶּ֖ה פְּרִ֣י מַחְשְׁבוֹתָ֑/ם כִּ֤י עַל דְּבָרַ/י֙ לֹ֣א הִקְשִׁ֔יבוּ וְ/תוֹרָתִ֖/י וַ/יִּמְאֲסוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/019.yaml
  text: 'Hear[a], O earth: behold, I am bringing disaster on this people, the fruit of their thoughts, because they have not listened to my words[b], and they have rejected my law.'
translation:
  language: ru
  text: Слушай, земля! Вот, Я навожу бедствие на этот народ — плод их мыслей[a], потому что они не внимали Моим словам и Мой закон[b] отвергли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плод их замыслов»; или: «результат их планов».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Моё наставление». Еврейское слово тора может означать как закон, так и наставление; здесь «закон» сохраняет заветную силу обвинения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעִי הָאָרֶץ
  choice: Слушай, земля!
  rationale: Форма повелительного наклонения женского рода обращена к олицетворённой земле. «Слушай» естественно передаёт пророческий призыв; «земля» здесь уместнее, чем территориальное «страна».
- source_word: הִנֵּה אָנֹכִי מֵבִיא רָעָה
  choice: Вот, Я навожу бедствие
  rationale: «Вот» сохраняет силу торжественного объявления, причастная конструкция передана настоящим временем как уже наступающее действие, а רָעָה означает здесь губительное бедствие как суд, а не нравственное зло.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняет единственное число עָם и указательное значение, а также оттенок пророческого обвинения.
- source_word: פְּרִי מַחְשְׁבוֹתָם
  choice: плод их замыслов
  rationale: Сохранена метафора плода как последствия того, что возникло в их мыслях и намерениях. «Замыслы» звучит естественнее буквального «мысли», не сводя выражение только к конкретным планам.
- source_word: עַל דְּבָרַי לֹא הִקְשִׁיבוּ
  choice: они не внимали Моим словам
  rationale: הקשיב передаёт внимательное слушание. «Не внимали» сохраняет смысл отказа прислушаться, не подменяя его более толковательным «не повиновались».
- source_word: וְתוֹרָתִי וַיִּמְאֲסוּ בָהּ
  choice: а Мой закон отвергли
  rationale: תּוֹרָה передано как «закон» с учётом заветного и обязательного характера Божьего наставления; מאס обозначает решительное отвержение. Противительный союз «а» естественно связывает параллельные обвинения в русском языке.
theological_decisions:
- issue: Передача תּוֹרָה в контексте пророческого обвинения народа завета
  choice: Мой закон
  alternative: Моё наставление / Моё учение
  rationale: «Закон» сохраняет обязательную, заветную силу открытой Богом воли. Вместе с тем более широкое значение «наставление» остаётся допустимым и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified пророческой интонацией. Обращение к земле и метафора плода сохранены; синтаксис сделан ясным без устранения смысловой напряжённости между невниманием к словам Бога и отвержением Его Торы.
