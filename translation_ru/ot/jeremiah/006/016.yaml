  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה עִמְדוּ֩ עַל דְּרָכִ֨ים וּ/רְא֜וּ וְ/שַׁאֲל֣וּ לִ/נְתִב֣וֹת עוֹלָ֗ם אֵי זֶ֨ה דֶ֤רֶךְ הַ/טּוֹב֙ וּ/לְכוּ בָ֔/הּ וּ/מִצְא֥וּ מַרְגּ֖וֹעַ לְ/נַפְשְׁ/כֶ֑ם וַ/יֹּאמְר֖וּ לֹ֥א נֵלֵֽךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/016.yaml
  text: 'Thus says Yahweh: “Stand by the roads and look[a], and ask for the ancient paths, where the good way is; then walk in it, and find rest for your souls. But they said[b], ‘We will not walk in it.’”'
translation:
  language: ru
  text: 'Так говорит Яхве: «Станьте у дорог и посмотрите; расспросите о древних тропах[a]: где добрый путь? Идите по нему и найдите покой для своих душ[b]». Но они сказали: «Не пойдём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о тропах прежних времён»; возможен также перевод «об извечных тропах».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское נֶפֶשׁ может обозначать также самого человека или его жизнь: «покой для самих себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; «Яхве» — общепринятая современная русская транслитерация.
- source_word: עִמְדוּ עַל דְּרָכִים
  choice: Станьте у дорог
  rationale: Сохраняется образ людей, остановившихся у дорог, чтобы осмотреться и выбрать направление; «на перекрёстках» было бы контекстуально возможно, но излишне конкретизировало бы еврейский текст.
- source_word: וּרְאוּ
  choice: и посмотрите
  rationale: Глагол сохраняет как зрительный образ, так и призыв внимательно разобраться.
- source_word: וְשַׁאֲלוּ לִנְתִבוֹת עוֹלָם
  choice: спросите о древних тропах
  rationale: נְתִיבוֹת обозначает тропы или стези, а עוֹלָם здесь вероятнее указывает на давнее прошлое; возможные оттенки длительности отмечены в сноске.
- source_word: אֵי זֶה דֶרֶךְ הַטּוֹב
  choice: где путь добра?
  rationale: Фраза требует определить искомый правильный путь. «Путь добра» сохраняет субстантивированное значение הַטּוֹב и не сводит его лишь к удобному или удачному пути.
- source_word: וּלְכוּ בָהּ
  choice: Идите по нему
  rationale: Предлог ב при глаголе движения указывает на следование этим путём; русское «по нему» естественно сохраняет метафору пути и образа жизни.
- source_word: וּמִצְאוּ מַרְגּוֹעַ
  choice: и найдите покой
  rationale: Сохранена императивная форма еврейского текста. В контексте она одновременно выражает обещанный результат следования добрым путём.
- source_word: לְנַפְשְׁכֶם
  choice: для своих душ
  rationale: Так сохраняется весомость נֶפֶשׁ и знакомое библейское звучание, но сноска указывает, что речь может идти о самих людях или их жизни, а не обязательно о душе как отдельной части человека.
- source_word: וַיֹּאמְרוּ לֹא נֵלֵךְ
  choice: 'Но они сказали: «Не пойдём»'
  rationale: «Но» естественно выражает явное противопоставление призыву Яхве. Объект отказа понятен из контекста, поэтому отсутствующее в еврейской реплике «по нему» не добавлено.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя сохранено как имя, без подмены титулом; это не вносит конфессионального толкования.
- issue: Антропологический диапазон נֶפֶשׁ
  choice: для своих душ
  alternative: для самих себя; для своей жизни
  rationale: Основной текст сохраняет традиционно узнаваемый и контекстуально уместный образ глубокого личного покоя, а сноска не позволяет превращать слово в однозначное утверждение о составе человеческой природы.
- issue: Смысл «древних троп»
  choice: древние тропы
  alternative: извечные тропы; тропы прежних времён
  rationale: Контекст указывает на испытанный с давних времён путь, но семантическая широта עוֹלָם сохранена в сноске без утверждения, что речь непременно идёт о метафизической вечности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краток и ритмичен, дорожный образ сохранён без уточняющего «перекрёстки». Формы «станьте», «идите», «найдите» передают цепь повелений; реплика отказа намеренно лаконична вслед за еврейским текстом.
