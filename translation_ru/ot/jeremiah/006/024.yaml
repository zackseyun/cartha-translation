  text: שָׁמַ֥עְנוּ אֶת שָׁמְע֖/וֹ רָפ֣וּ יָדֵ֑י/נוּ צָרָה֙ הֶחֱזִיקַ֔תְ/נוּ חִ֖יל כַּ/יּוֹלֵדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/024.yaml
  text: We have heard the report of it[a]; our hands hang limp. Distress has seized us[c][b], pain like a woman giving birth.
translation:
  language: ru
  text: Мы услышали весть о нём[a] — руки у нас опустились[b]. Беда охватила нас, мука — как у роженицы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «его весть». Еврейское выражение может означать как весть о враге, так и принесённую им весть; в данном контексте вероятнее первое.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «руки наши ослабели» — образ утраты сил и мужества.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможный перевод: «боль — как у женщины при родах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: мы услышали
  rationale: Перфект Qal, 1-е лицо множественного числа; в русском повествовательном контексте естественно передаётся прошедшим совершенного вида, а продолжающееся воздействие услышанного раскрывается следующими фразами.
- source_word: אֶת שָׁמְעוֹ
  choice: весть о нём
  rationale: שֵׁמַע/שֶׁמַע означает весть, известие, слух; суффикс 3-го лица мужского рода допускает «весть о нём» и «его весть». По контексту речь, вероятнее всего, об известии о наступающем враге.
- source_word: רָפוּ יָדֵינוּ
  choice: руки у нас опустились
  rationale: Устойчивый русский оборот сохраняет телесный образ и передаёт идиоматический смысл утраты сил и мужества.
- source_word: צָרָה
  choice: беда
  rationale: צָרָה обозначает бедствие, тесноту, тяжёлое положение или мучительную тревогу; «беда» здесь звучит естественно и конкретно.
- source_word: הֶחֱזִיקַתְנוּ
  choice: охватила нас
  rationale: Hiphil от חזק в данном сочетании выражает захват или сильное овладение; «охватила» естественно сочетается с подлежащим «беда».
- source_word: חִיל
  choice: мука
  rationale: Слово может обозначать корчи, мучение, дрожь или родовую боль. «Мука» сохраняет широту значения, а последующее сравнение уточняет образ.
- source_word: כַּיּוֹלֵדָה
  choice: как у роженицы
  rationale: Причастие от ילד с כ сравнивает переживаемую муку с состоянием женщины при родах; «роженица» кратко и ясно передаёт этот образ.
