  text: וְ/נָסַ֤בּוּ בָֽתֵּי/הֶם֙ לַ/אֲחֵרִ֔ים שָׂד֥וֹת וְ/נָשִׁ֖ים יַחְדָּ֑ו כִּֽי אַטֶּ֧ה אֶת יָדִ֛/י עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/012.yaml
  text: Their houses will be turned over to others[a], together with their fields and wives; for I will stretch out my hand against the inhabitants of the land[b], declares Yahweh.
translation:
  language: ru
  text: Их дома перейдут к другим — вместе с полями и жёнами[a], потому что Я простру Свою руку против жителей этой земли[b] — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «женщинами». Еврейское נָשִׁים может означать и «жёны», и «женщины»; в перечислении дома, полей и членов семьи вероятнее значение «жёны».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жителей земли» в смысле всего мира. Еврейское הָאָרֶץ может означать как определённую страну, так и землю вообще; здесь контекст указывает прежде всего на землю Иудеи.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָסַבּוּ בָתֵּיהֶם לַאֲחֵרִים
  choice: Их дома перейдут к другим
  rationale: Нифаль глагола סבב здесь обозначает переход имущества в чужие руки. «Перейдут к другим» естественно по-русски передаёт результат лишения собственности, не привнося значения буквального вращения.
- source_word: שָׂדוֹת וְנָשִׁים יַחְדָּו
  choice: вместе с полями и жёнами
  rationale: יַחְדָּו объединяет перечисленные потери. В контексте домов и полей נָשִׁים вероятнее означает «жёны», хотя значение «женщины» также возможно и отмечено в сноске.
- source_word: כִּי אַטֶּה אֶת־יָדִי עַל
  choice: потому что Я простру Свою руку против
  rationale: כִּי вводит основание суда, а נטה יד — устойчивый образ решительного действия. Предлог עַל в данном угрожающем контексте передан как «против».
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: жителей этой земли
  rationale: יֹשְׁבֵי означает жителей, а הָאָרֶץ в ближайшем контексте указывает прежде всего на землю Иудеи. Указательное «этой» естественно выражает определённость еврейской формы, не называя Иудею прямо.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохранена торжественная пророческая формула и передано собственное имя יְהוָה. «Возвещает» звучит достойно и отличает формулу от простого «говорит».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон; форма «Яхве» передаёт его как личное заветное имя, а не заменяет титулом.
- issue: Объём значения הָאָרֶץ
  choice: эта земля
  alternative: земля в смысле всего мира
  rationale: Слово допускает оба значения, но контекст суда над Иудеей поддерживает местное понимание. Возможность более широкого прочтения сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис сделан плавным и понятным; образ простёртой руки сохранён как прозрачная библейская метафора суда.
