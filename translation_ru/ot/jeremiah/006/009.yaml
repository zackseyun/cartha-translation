base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/009.yaml
  text: 'Thus says Yahweh of hosts: They will thoroughly glean the remnant of Israel as a vine[a]; pass your hand over the branches again like a grape-gatherer.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств:


    «Остаток Израиля оберут дочиста,


    словно виноградную лозу.


    Снова проведи рукой по ветвям[a],


    как сборщик винограда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «по побегам» или «по усикам». Еврейское слово встречается редко, и его точное значение спорно; некоторые понимают его как «корзины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, а не заменяет его титулом; соответствует непосредственной форме еврейского текста.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет традиционную и ёмкую форму божественного титула, указывающего на власть Яхве над небесными и земными силами.
- source_word: עוֹלֵל יְעוֹלְלוּ
  choice: оберут дочиста
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает действие; русский оборот передаёт как повторный сбор оставшихся ягод, так и полноту опустошения.
- source_word: כַגֶּפֶן
  choice: словно виноградную лозу
  rationale: Сохраняет прямое сравнение остатка Израиля с лозой, с которой собирают последние гроздья.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: остаток Израиля
  rationale: Точно и естественно передаёт שְׁאֵרִית, не уточняя сверх текста, идёт ли речь о выживших или о том, что ещё осталось для суда.
- source_word: הָשֵׁב יָדְךָ
  choice: снова протяни руку
  rationale: Передаёт повеление повторить движение рукой при сборе винограда; формулировка естественна по-русски и сохраняет образ.
- source_word: כְּבוֹצֵר
  choice: как сборщик винограда
  rationale: Ясно обозначает человека, собирающего виноград, без архаичного или узкопрофессионального слова.
- source_word: עַל סַלְסִלּוֹת
  choice: к ветвям
  rationale: В виноградарском контексте редкое слово вероятнее всего обозначает ветви или побеги лозы; предложная конструкция передана естественно в связи с движением руки. Неуверенность отражена в сноске.
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте и не подменяет его титулом; форма «Яхве» наиболее непосредственно отражает принятую научную реконструкцию произношения.
- issue: Смысл «остатка Израиля» в образе окончательного сбора
  choice: Сохранён образ остатка, который обирают дочиста
  alternative: Явно истолковать остаток как выживших людей или как оставшиеся плоды
  rationale: Еврейский текст соединяет богословски значимое понятие остатка с виноградарской метафорой; перевод не разрешает намеренно сохранённое смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Строковое членение подчёркивает поэтический параллелизм. Образ сбора винограда сохранён без конфессионального истолкования; усилительная конструкция передана выражением «оберут дочиста».
