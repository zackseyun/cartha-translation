  naturalness: Текст в целом естественен для современного литературного русского и сохраняет пророческую силу. Замена «взыщу с них» на «накажу их» снимает оттенок юридического взыскания и делает смысл прозрачным без утраты регистра.
  terminology: «Мерзость» адекватно передаёт תוֹעֵבָה; «Яхве» последовательно передаёт יהוה. Сноска должна сохранять лексическую альтернативу «посещу», не представляя общее «обращать внимание» как равнозначное контекстное значение.
