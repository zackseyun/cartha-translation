  text: הֹבִ֕ישׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵב֗וֹשׁוּ גַּם הַכְלִים֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֧וּ בַ/נֹּפְלִ֛ים בְּ/עֵת פְּקַדְתִּ֥י/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/015.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time I punish them, they will stumble, says Yahweh.
translation:
  language: ru
  text: Стыдились ли они того, что совершили мерзость? Нет, они нисколько не стыдились и даже не умели краснеть. Поэтому они падут среди павших; когда Я накажу их[a], они споткнутся, — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Я посещу их». Еврейский глагол может означать «посещать» или «заниматься кем-либо»; здесь, в контексте суда, он обозначает карательное посещение.'
    reason: Лексическая многозначность глагола פקד.
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: Стыдились ли они
  rationale: 'Контекст поддерживает риторический вопрос: ожидаемый стыд сразу же отрицается следующими фразами. Такая передача сохраняет пророческую иронию, не превращая первую строку в простое утверждение.'
- source_word: תוֹעֵבָה
  choice: мерзость
  rationale: Сильное нравственно-религиозное обозначение отвратительного поступка; «мерзость» сохраняет вес еврейского слова и естественно звучит в русском библейском стиле.
- source_word: גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  choice: они нисколько не стыдились
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает отрицание; «нисколько» ясно передаёт эту эмфазу.
- source_word: גַּם הַכְלִים לֹא יָדָעוּ
  choice: даже не умели краснеть
  rationale: Глагол обозначает переживание или видимое проявление стыда. Русское выражение передаёт не только отсутствие стыда, но и утраченную способность его испытывать.
- source_word: יִפְּלוּ בַנֹּפְלִים
  choice: падут среди павших
  rationale: Сохранены повтор корня «падать» и краткий поэтический образ присоединения к поражённым судом.
- source_word: בְּעֵת פְּקַדְתִּים
  choice: когда Я взыщу с них
  rationale: В данном контексте פקד означает направленное на виновных карающее вмешательство. «Взыщу с них» передаёт судебный смысл, сохраняя больше образности, чем прямое «накажу».
- source_word: יִכָּשְׁלוּ
  choice: они споткнутся
  rationale: Прямое значение глагола сохраняет параллель с падением и образ крушения под судом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация передаёт личное имя в исходном тексте и отличает его от титула «Господь», не добавляя конфессионального толкования.
- issue: Значение פקד в контексте суда
  choice: взыщу с них
  alternative: посещу их
  rationale: Окружающие образы падения и преткновения указывают на карательное посещение. Выбранное выражение ясно передаёт судебную направленность, а буквальная альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторический вопрос, усиленное отрицание и словесная связь между падением и преткновением сохранены; архаизмы ограничены уместным судебным выражением «взыщу с них».
