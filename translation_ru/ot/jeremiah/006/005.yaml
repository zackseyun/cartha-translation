lexical_decisions:
- source_word: ק֚וּמוּ
  choice: Вставайте!
  rationale: Повелительная форма мужского рода множественного числа от קום передаёт прямой и настойчивый призыв к совместному действию; «вставайте» естественно звучит по-русски и сохраняет военную решимость.
- source_word: וְ/נַעֲלֶ֣ה
  choice: Поднимемся
  rationale: 'Когортатив первого лица множественного числа от עלה выражает побуждение: «давайте поднимемся». Глагол «поднимемся» сохраняет пространственный образ еврейского текста и не сводит его значение к истолковывающему «нападём».'
- source_word: בַ/לָּ֔יְלָה
  choice: ночью
  rationale: Предложное сочетание обозначает время действия; русское наречие «ночью» передаёт его кратко и естественно.
- source_word: וְ/נַשְׁחִ֖יתָה
  choice: и разрушим
  rationale: Когортатив первого лица множественного числа в каузативной породе выражает намеренное разрушительное действие. «Разрушим» ясно передаёт смысл и согласуется с призывом к нападению.
- source_word: אַרְמְנוֹתֶֽי/הָ
  choice: её дворцы[a]
  rationale: Существительное во множественном числе с суффиксом третьего лица женского рода указывает на выдающиеся дворцовые либо укреплённые сооружения олицетворённого города. «Дворцы» — естественный основной вариант, а возможный фортификационный оттенок отмечен в сноске.
