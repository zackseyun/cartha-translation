  source_fidelity: Требуется правка. В основном тексте «сокровенные мысли» заменяет конкретный образ כְלָיוֹת («почки»), хотя примечание его фиксирует. Кроме того, «доверил ... тяжбу» несколько смещает значение גִּלִּיתִי («открыл, изложил»).
  naturalness: После сохранения образа «почки и сердце» фраза остаётся литературной и понятной благодаря сноске. «Открыл свою тяжбу» естественно передаёт юридико-петиционный контекст; «Твоё возмездие над ними» точно и плавно звучит по-русски.
  terminology: «Яхве Воинств» сохраняет имя и воинственный титул. «Праведника» — естественная русская субстантивация единственного числа צַדִּיק. «Возмездие» передаёт נִקְמָה без доктринального смягчения.
  issues:
