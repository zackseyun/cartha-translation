    issue: Вместо «почек» в основном тексте поставлены «сокровенные мысли».
    rationale: כְלָיוֹת буквально обозначает «почки» и образует намеренную пару с «сердцем». Смысловое истолкование вносит в текст «мысли», которых в оригинале нет, и устраняет образ, который безопасно пояснить сноской.
  - severity: medium
    issue: «Доверил мою тяжбу» неточно передаёт глагол גִּלִּיתִי.
    rationale: Глагол означает «открыл, раскрыл, изложил», а не собственно «доверил». Юридический смысл רִיב сохраняется в выражении «открыл свою тяжбу».
