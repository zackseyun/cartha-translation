source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ בֹּחֵ֣ן צַדִּ֔יק רֹאֶ֥ה כְלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/012.yaml
  text: But you[a], O Yahweh of Armies, who test the righteous, who see the kidneys and the heart, let me see your vengeance on them[b], for to you I have revealed my case.
translation:
  language: ru
  text: Но Ты, Яхве Воинств, испытывающий праведника, видящий почки и сердце[a], — дай мне увидеть Твоё возмездие над ними, ибо Тебе я открыл свою тяжбу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «почки и сердце». В древнееврейской образности почки считались средоточием глубинных мыслей, побуждений и чувств.'
    reason: cultural_note
  - marker: b
    text: 'Или: «моё дело», «мой спор».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: Но Ты, Яхве Воинств
  rationale: וַ передаёт противопоставление контексту, а форма обращения естественна по-русски. Имя יהוה передано как «Яхве»; צְבָאוֹת — как «Воинств», сохраняя традиционную, но понятную военную образность титула.
- source_word: בֹּחֵן צַדִּיק
  choice: испытывающий праведного
  rationale: Причастие выражает постоянное действие; צַדִּיק здесь допускает собирательное и единичное понимание, которое сохраняет форма «праведного».
- source_word: רֹאֶה כְלָיוֹת וָלֵב
  choice: видящий сокровенные мысли и сердце
  rationale: כְלָיוֹת буквально означает «почки», но в древнееврейской антропологии обозначает глубинные мысли, побуждения и чувства. Функциональный эквивалент делает смысл понятным современному читателю, а буквальный образ сохранён в примечании.
- source_word: אֶרְאֶה נִקְמָתְךָ מֵהֶם
  choice: дай мне увидеть, как Ты отомстишь им
  rationale: Имперфект первого лица в контексте передаёт пожелание или просьбу. נִקְמָתְךָ сохраняет силу Божьего возмездия, а не смягчается до одного лишь оправдания пророка.
- source_word: כִּי אֵלֶיךָ גִּלִּיתִי אֶת רִיבִי
  choice: ведь Тебе я доверил мою тяжбу
  rationale: גלה в сочетании с ריב выражает открытие или вверение Богу своего судебного дела. «Тяжба» сохраняет юридический оттенок רִיב и естественно сочетается с «доверил».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо содержит тетраграмматон; личное имя сохранено без замены титулом.
- issue: Образ כְלָיוֹת וָלֵב
  choice: смысловая передача в тексте с буквальным образом в сноске
  alternative: «почки и сердце» непосредственно в основном тексте
  rationale: Русское «почки» без пояснения прежде всего воспринимается анатомически и затемняет древнееврейскую метафору. «Сокровенные мысли и сердце» передаёт функцию образа, а сноска сохраняет его исходную телесность.
- issue: Характер Божьего ответа в נִקְמָתְךָ
  choice: «как Ты отомстишь им»
  alternative: «Твоё возмездие над ними» или «как Ты оправдаешь меня перед ними»
  rationale: Формулировка сохраняет судебно-карательную силу корня נקם и не сводит её лишь к оправданию Иеремии.
- issue: Значение אֶרְאֶה
  choice: 'пожелание-просьба: «дай мне увидеть»'
  alternative: 'утверждение: «я увижу»'
  rationale: Обращение к Богу и ближайший контекст поддерживают волитивное прочтение, хотя морфологически форма может быть понята и как простое будущее.
translation_notes:
  register: Современный литературный русский с возвышенным, но доступным библейским регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Юридический оттенок רִיב сохранён словом «тяжба»; архаизм «воинств» оставлен только в устойчивом божественном титуле.
