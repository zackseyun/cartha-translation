  text: לָ֤/מָּה זֶּה֙ מֵ/רֶ֣חֶם יָצָ֔אתִי לִ/רְא֥וֹת עָמָ֖ל וְ/יָג֑וֹן וַ/יִּכְל֥וּ בְּ/בֹ֖שֶׁת יָמָֽ/י׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/018.yaml
  text: Why did I come out from the womb to see trouble and sorrow[b][a], and for my days to end in shame?
translation:
  language: ru
  text: Зачем я вышел из утробы, чтобы видеть тяготы и скорбь[a] и чтобы дни мои окончились в позоре?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изнурительный труд и горе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а дни мои прошли в позоре».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: Зачем
  rationale: Передаёт прямой риторический вопрос с усилительной функцией זֶּה; в современном русском «зачем» естественно выражает вопрос о бессмысленности рождения ради последующих страданий.
- source_word: מֵרֶחֶם
  choice: из утробы
  rationale: Сохраняет конкретный образ еврейского текста, не добавляя отсутствующего в нём определения «материнской».
- source_word: יָצָאתִי
  choice: я вышел
  rationale: Буквально передаёт глагол יצא и сохраняет образ выхода из утробы, то есть рождения.
- source_word: לִרְאוֹת
  choice: чтобы видеть
  rationale: Сохраняет буквальное значение ראה, при этом контекст позволяет понимать «видеть» также как «испытывать».
- source_word: עָמָל
  choice: тяготы
  rationale: Слово охватывает бедствие, мучительный труд и страдание; «тяготы» сохраняет эту широту лучше, чем более узкое «труд».
- source_word: יָגוֹן
  choice: скорбь
  rationale: Передаёт глубокое горе и соответствует возвышенному, но понятному регистру плача.
- source_word: וַיִּכְלוּ
  choice: окончились
  rationale: Передаёт значение завершения или исчерпания. Альтернативное понимание «были истощены/прошли» отмечено в сноске.
- source_word: בְּבֹשֶׁת
  choice: в позоре
  rationale: Естественно передаёт בֹּשֶׁת как состояние стыда и бесчестья; «позор» здесь по-русски сочетается с завершением дней.
- source_word: יָמָי
  choice: дни мои
  rationale: Сохраняет поэтическую конкретность еврейского выражения и порядок слов, уместный для литературного русского текста.
theological_decisions: []
