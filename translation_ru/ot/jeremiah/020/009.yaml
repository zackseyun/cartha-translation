reference: Jeremiah 20:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אָמַרְתִּ֣י לֹֽא אֶזְכְּרֶ֗/נּוּ וְ/לֹֽא אֲדַבֵּ֥ר עוֹד֙ בִּ/שְׁמ֔/וֹ וְ/הָיָ֤ה בְ/לִבִּ/י֙ כְּ/אֵ֣שׁ בֹּעֶ֔רֶת עָצֻ֖ר בְּ/עַצְמֹתָ֑/י וְ/נִלְאֵ֥יתִי כַּֽלְכֵ֖ל וְ/לֹ֥א אוּכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/009.yaml
  text: If I say[a], “I will not mention him, or speak any longer in his name,” then in my heart it is like a burning fire, shut up in my bones; I grow weary of holding it in[c][b], and I cannot.
translation:
  language: ru
  text: 'Если я скажу[a]: «Не буду упоминать Его и не стану больше говорить от Его имени[b]», — тогда в сердце моём это словно пылающий огонь, заключённый в костях моих. Я изнемогаю, сдерживая его[c], и не могу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И я сказал». В контексте эти слова также можно понимать как описание принятого Иеремией решения.'
    reason: alternative_reading
  - marker: b
    text: То есть говорить как Его представитель и с данной Им властью.
    reason: cultural_note
  - marker: c
    text: Еврейский текст не называет прямо, что именно Иеремия сдерживает; по смыслу это, вероятно, вверенное ему Божье послание или побуждение возвестить его.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַרְתִּי
  choice: Если я скажу
  rationale: Формально сочетание может означать «и я сказал», но в контексте вводит мысленное, повторяемое решение пророка; условная формулировка естественно передаёт эту функцию.
- source_word: אֶזְכְּרֶנּוּ
  choice: не буду упоминать Его
  rationale: Глагол זכר допускает значения «помнить» и «упоминать»; параллель с последующим «говорить» поддерживает речевое значение, при этом иной вариант отмечен в сноске.
- source_word: אֲדַבֵּר עוֹד בִּשְׁמוֹ
  choice: не стану больше говорить от Его имени
  rationale: Оборот דבר בשם означает выступать как представитель и с полномочиями названного лица. Русское «от Его имени» естественно сохраняет пророческий смысл выражения.
- source_word: וְהָיָה בְלִבִּי
  choice: тогда в сердце моём это словно
  rationale: Мужской субъект глагола прямо не назван. Указательное «это» сохраняет невыраженный референт, не добавляя в основной текст «слово Господа».
- source_word: כְּאֵשׁ בֹּעֶרֶת
  choice: словно пылающий огонь
  rationale: Сохраняет конкретный и напряжённый образ огня, передавая причастие בֹּעֶרֶת современным литературным словом «пылающий».
- source_word: עָצֻר בְּעַצְמֹתָי
  choice: заключённый в костях моих
  rationale: עצר выражает удержание или заключённость; перевод сохраняет телесную силу исходной метафоры без её истолкования.
- source_word: וְנִלְאֵיתִי כַּלְכֵל
  choice: Я изнемогаю, сдерживая его
  rationale: נלאיתי передаёт изнурение, а כלכל в данном контексте — усилие удержать или вместить. Деепричастная конструкция звучит естественно и сохраняет причинную связь.
- source_word: וְלֹא אוּכָל
  choice: и не могу
  rationale: Кратко воспроизводит прямое признание неспособности; подразумеваемое действие не уточняется сверх исходного текста.
theological_decisions:
- issue: Референт местоимений третьего лица
  choice: Сохранить местоимение «Его», не заменяя его именем «Господь» в основном тексте.
  alternative: Явно написать «Господа» и «от имени Господа».
  rationale: Контекст указывает на Господа, однако еврейский текст использует местоименные формы. Их сохранение не вносит отсутствующего уточнения и удерживает непосредственность внутренней речи Иеремии.
- issue: Неявный субъект образа огня
  choice: Передать его нейтральным указательным словом «это», а далее местоимением «его».
  alternative: 'Уточнить: «слово Его в сердце моём — словно пылающий огонь».'
  rationale: В еврейской фразе нет явно названного существительного. Контекст допускает Божье послание или внутреннее принуждение произнести его, поэтому основной текст не должен безоговорочно разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «в сердце моём», «в костях моих» умеренно возвышает регистр и поддерживает поэтический параллелизм, не делая текст архаичным. Заглавная буква в местоимении «Его» служит принятой русской издательской маркировкой референта, но имя в текст не добавлено.
