  source_fidelity: Русский текст точно передаёт условно-повторяемую формулу וְאָמַרְתִּי, речевое значение אֶזְכְּרֶנּוּ («упоминать») и идиому «говорить от Его имени». Неявный референт образа огня не конкретизирован в основном тексте, что соответствует еврейской неоднозначности. Образ удерживаемого, заключённого в костях огня и итоговая невозможность сдерживать его сохранены.
  naturalness: Перевод звучит как современный литературный русский с уместно возвышенным, пророческим регистром. Порядок слов «в сердце моём» и «в костях моих» поэтичен, но не архаичен. Формулировка «Я изнемогаю, сдерживая его» ясна в контексте и передаёт напряжение исходного образа.
  terminology: «От Его имени» верно передаёт בִּשְׁמוֹ без излишнего богословского истолкования. Местоимения с прописной буквы последовательно сохраняют подразумеваемого референта, не вводя имя в основной текст. Сноски уместно поясняют условную форму, смысл идиомы и невыраженный объект сдерживания.
