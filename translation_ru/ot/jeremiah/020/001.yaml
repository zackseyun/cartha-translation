  text: וַ/יִּשְׁמַ֤ע פַּשְׁחוּר֙ בֶּן אִמֵּ֣ר הַ/כֹּהֵ֔ן וְ/הֽוּא פָקִ֥יד נָגִ֖יד בְּ/בֵ֣ית יְהוָ֑ה אֶֽת יִרְמְיָ֔הוּ נִבָּ֖א אֶת הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/001.yaml
  text: Pashhur son of Immer the priest[a], who was chief officer in the house of Yahweh, heard Jeremiah prophesying these words.
translation:
  language: ru
  text: Пасхор, сын Иммера, священник и главный надзиратель в доме Яхве[a], услышал, как Иеремия пророчески возвещал эти слова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храме Яхве»; буквально: «в доме Яхве».'
    reason: Лексема בַּיִת буквально означает «дом», но выражение «дом Яхве» в данном контексте обозначает храм.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Глагол שׁמע здесь сообщает о восприятии речи; «услышал» не приписывает Пасхору намеренного и внимательного слушания.
- source_word: פַּשְׁחוּר בֶּן אִמֵּר
  choice: Пасхор, сын Иммера
  rationale: Использованы традиционные русские формы библейских имён; отчество-патроним передано прямо и естественно.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Определённая форма обозначает известный статус Пасхора; в русском приложении артикль отдельно не выражается.
- source_word: וְהוּא פָקִיד נָגִיד
  choice: который был главным надзирателем
  rationale: Сочетание פקיד и נגיד указывает на назначенного служителя, занимавшего руководящее положение. «Главный надзиратель» передаёт оба компонента без тяжеловесного удвоения должностей.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Сохранён образ «дома», хотя по контексту речь идёт о храме; более явный вариант указан в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: נִבָּא
  choice: пророчествовал
  rationale: Причастная форма описывает действие Иеремии, происходившее в момент, когда Пасхор его услышал; конструкция «услышал, как…» естественно сохраняет эту одновременность.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: В контексте пророческой речи דְּבָרִים обозначает произнесённые слова, к которым отсылает стих.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: К кому относится обозначение «священник»
  choice: к Пасхору
  alternative: к Иммеру
  rationale: Постпозитивное приложение после патронима формально допускает некоторую синтаксическую неясность, однако последующее указание на должность в храме и обычное понимание конструкции поддерживают отнесение титула к Пасхору.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Начальный וַ передан ходом повествования без добавления отдельного вводного слова «и» или «тогда».
