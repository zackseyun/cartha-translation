base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/006.yaml
  text: And you[a], Pashhur, and all who live in your house will go into captivity; and you will come to Babylon, and there you will die, and there you will be buried—you and all your loved ones, to whom you prophesied falsely.
translation:
  language: ru
  text: А ты, Пасхур, и все живущие в твоём доме пойдёте в плен. Ты придёшь в Вавилон, и там умрёшь, и там будешь похоронен — ты и все, кто тебя любит, которым ты пророчествовал ложно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которым ты пророчествовал ложь».'
    reason: Лексическая альтернатива для בַּשָּׁקֶר, допускающего передачу как наречием «ложно», так и существительным «ложь».
lexical_decisions:
- source_word: יֹשְׁבֵי בֵיתֶךָ
  choice: все живущие в твоём доме
  rationale: Передаёт причастную конструкцию естественным современным русским языком и сохраняет охват всего домашнего окружения Пасхура.
- source_word: תֵּלְכוּ בַּשֶּׁבִי
  choice: пойдёте в плен
  rationale: Еврейская идиома указывает на участь пленников; «в плен» точнее, чем более широкое «в изгнание».
- source_word: וּבָבֶל תָּבוֹא
  choice: Ты придёшь в Вавилон
  rationale: Сохраняет значение глагола בוא «прийти/войти» и переход от множественного числа к обращению лично к Пасхуру.
- source_word: וְשָׁם תָּמוּת וְשָׁם תִּקָּבֵר
  choice: и там умрёшь, и там будешь похоронен
  rationale: Повтор «там» сохранён как смысловое и риторическое усиление исходного текста.
- source_word: אֹהֲבֶיךָ
  choice: все, кто тебя любит
  rationale: Буквально передаёт направление любви в причастной форме и не сужает значение до друзей, родственников или союзников.
- source_word: נִבֵּאתָ לָהֶם בַּשָּׁקֶר
  choice: которым ты пророчествовал ложно
  rationale: Сохраняет обвинение в ложности пророчества, не утверждая сверх текста сознательный обман; менее привычный порядок слов допустим ради ясной связи наречия с пророчествованием.
theological_decisions:
- issue: Характер вины Пасхура в пророческой речи
  choice: «ты пророчествовал ложно»
  alternative: «ты пророчествовал ложь»
  rationale: Основной вариант осуждает пророчество как ложное, но не выносит отдельного суждения о субъективном намерении Пасхура. Альтернатива сохраняется в примечании как более предметная передача בַּשָּׁקֶר.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим тоном. Сохранены прямое обращение, смена числа, повтор «там» и смысловая напряжённость обвинения в ложном пророчестве.
