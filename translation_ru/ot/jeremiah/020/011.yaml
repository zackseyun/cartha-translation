source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אוֹתִ/י֙ כְּ/גִבּ֣וֹר עָרִ֔יץ עַל כֵּ֛ן רֹדְפַ֥/י יִכָּשְׁל֖וּ וְ/לֹ֣א יֻכָ֑לוּ בֹּ֤שׁוּ מְאֹד֙ כִּֽי לֹ֣א הִשְׂכִּ֔ילוּ כְּלִמַּ֥ת עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/011.yaml
  text: But Yahweh is with me like a mighty warrior[a]; therefore my persecutors will stumble and will not prevail. They will be utterly ashamed, because they have not acted wisely[c][b]; their everlasting disgrace will not be forgotten.
translation:
  language: ru
  text: Но Яхве со мной, как могучий и грозный воин[a]. Поэтому мои преследователи споткнутся и не одолеют. Они будут глубоко посрамлены, потому что они не поступили разумно[b]. Их вечный позор не забудется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как могучий, грозный воин»; слово עָרִיץ может означать «грозный», «внушающий ужас» или «неодолимый».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «потому что они не поняли» или «потому что они не проявили благоразумия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Но Яхве
  rationale: Союз ו передаёт контраст с предшествующей жалобой Иеремии; тетраграмматон передан личным именем «Яхве».
- source_word: אוֹתִי
  choice: со мной
  rationale: В безглагольной конструкции форма с местоимением выражает присутствие и поддержку Яхве.
- source_word: כְגִבּוֹר עָרִיץ
  choice: как грозный могучий воин
  rationale: גִּבּוֹר обозначает могучего воина, а עָרִיץ добавляет оттенок грозной, внушающей страх силы; оба компонента сохранены в основном тексте.
- source_word: רֹדְפַי
  choice: мои преследователи
  rationale: Причастие от רדף может обозначать как физически преследующих, так и подвергающих гонениям; «преследователи» сохраняет обе возможности.
- source_word: יִכָּשְׁלוּ
  choice: споткнутся
  rationale: Сохранён образ спотыкания, не уточняющий сверх текста степень поражения.
- source_word: וְלֹא יֻכָלוּ
  choice: и не одолеют
  rationale: Буквально «не смогут»; в контексте противоборства речь идёт о неспособности добиться превосходства над пророком.
- source_word: בֹּשׁוּ מְאֹד
  choice: будут жестоко посрамлены
  rationale: Форма בוש допускает переживание стыда и объективное посрамление; «жестоко» естественно передаёт усилитель מְאֹד.
- source_word: כִּי לֹא הִשְׂכִּילוּ
  choice: потому что поступили неразумно
  rationale: Hiphil שׂכל может означать понимание, разумное действие или успешное действие; контекстуально передано отсутствие разумности поступка, а неоднозначность отмечена в сноске.
- source_word: כְּלִמַּת עוֹלָם
  choice: их вечный позор
  rationale: כְּלִמָּה означает позор или бесчестье, а עוֹלָם — непреходящую длительность.
- source_word: לֹא תִשָּׁכֵחַ
  choice: не забудется
  rationale: Женский род глагола соотносится с כְּלִמָּה; русская возвратная форма естественно передаёт еврейский пассив.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон; форма «Яхве» передаёт его как личное заветное имя, не заменяя титулом.
- issue: Характер присутствия Яхве
  choice: со мной, как грозный могучий воин
  alternative: рядом со мной; поддерживает меня как могучий воин
  rationale: Перевод сохраняет образ присутствия и воинской силы, не разворачивая подразумеваемую поддержку в более конкретное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Военная образность и параллелизм сохранены; архаизмы и конфессионально окрашенные формулы не использованы.
