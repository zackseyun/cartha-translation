source:
  edition: WLC
  text: וְ/נָתַתִּ֗י אֶת כָּל חֹ֨סֶן֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת כָּל יְגִיעָ֖/הּ וְ/אֶת כָּל יְקָרָ֑/הּ וְ/אֵ֨ת כָּל אוֹצְר֜וֹת מַלְכֵ֣י יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְזָזוּ/ם֙ וּ/לְקָח֔וּ/ם וֶ/הֱבִיא֖וּ/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/005.yaml
  text: And I will give all the wealth of this city[a], all its gains, all its precious things, and all the treasures of the kings of Judah into the hand of their enemies. They will plunder them, take them[c][b], and bring them to Babylon.
translation:
  language: ru
  text: Я отдам всё богатство этого города, всё нажитое его трудом[a], все его ценности[b] и все сокровища царей Иудеи во власть их врагов[c]. Они разграбят всё это, заберут и унесут в Вавилон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весь его труд» либо «все плоды его труда». Еврейское слово может обозначать и сам труд, и то, что им произведено или нажито.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все его драгоценности» или «всё ценное, что у него есть».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в руку их врагов» — еврейское выражение, означающее передачу под чью-либо власть.'
    reason: cultural_note
lexical_decisions:
- source_word: חֹסֶן
  choice: богатство
  rationale: В перечне имущества, которое будет разграблено и унесено, слово обозначает материальные богатства, а не отвлечённую силу.
- source_word: יְגִיעָהּ
  choice: всё нажитое его трудом
  rationale: Еврейское слово может обозначать как сам труд, так и его плоды. По контексту речь прежде всего о накопленном имуществе, доступном для разграбления; формулировка сохраняет связь с трудом.
- source_word: יְקָרָהּ
  choice: все его драгоценности
  rationale: В контексте изъятия имущества конкретное значение «ценные вещи, драгоценности» вероятнее отвлечённых значений «почёт» или «великолепие».
- source_word: אוֹצְרוֹת מַלְכֵי יְהוּדָה
  choice: все сокровища царей Иудеи
  rationale: Хотя אוֹצָר может обозначать также хранилище или сокровищницу, здесь последующие глаголы указывают на их содержимое.
- source_word: בְּיַד
  choice: во власть
  rationale: Еврейское «в руку» является идиомой передачи под власть или контроль; естественный русский эквивалент передаёт её смысл.
- source_word: אֹיְבֵיהֶם
  choice: их врагов
  rationale: Местоимение во множественном числе сохранено без явного уточнения его референта; ближайший возможный антецедент — цари Иудеи.
- source_word: וּבְזָזוּם
  choice: Они разграбят всё это
  rationale: Глагол обозначает военное разграбление; «всё это» ясно отсылает ко всему перечисленному имуществу.
- source_word: וּלְקָחוּם
  choice: заберут
  rationale: Нейтрально передаёт לקח и не дублирует значение последующего перемещения в Вавилон.
- source_word: וֶהֱבִיאוּם בָּבֶלָה
  choice: унесут в Вавилон
  rationale: В данном контексте неодушевлённой добычи русское «унесут» естественно передаёт доставку захваченного имущества в указанное место.
