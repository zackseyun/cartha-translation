  source_fidelity: 'Смысл в целом передан верно: Пашхур ударил Иеремию-пророка и поместил его в карательное удерживающее устройство. Однако в основном тексте следует яснее отнести определение местоположения к колодкам/приспособлению и к воротам, как это делает еврейская относительная конструкция.'
  naturalness: 'Фраза «у Верхних Вениаминовых ворот, что в доме Яхве» синтаксически неудачна: союзное слово «что» не имеет ясного грамматического соотнесения и может быть ошибочно отнесено к колодкам. Перестройка с причастными оборотами делает фразу современной и однозначной.'
  terminology: «Пашхур», «пророк Иеремия», «колодки» и «Яхве» приемлемы. Сноска должна не называть устройство обобщённо «орудием пытки», поскольку это вносит более конкретную характеристику, чем допускает неопределённый термин מַהְפֶּכֶת; лучше указать возможную «дыбу» и болезненное удержание как возможность.
