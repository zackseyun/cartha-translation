    rationale: В конструкции «у Верхних Вениаминовых ворот, что в доме Яхве» «что» грамматически не согласуется с «ворот» и оставляет неясным, что именно находилось в доме Яхве. В оригинале устройство находилось у верхних Вениаминовых ворот, а ворота — в доме Яхве.
