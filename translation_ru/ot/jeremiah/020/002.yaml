base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/002.yaml
  text: Then Pashhur struck Jeremiah the prophet and put him in the stocks that were at the upper Benjamin Gate[a], which was in the house of Yahweh.
translation:
  language: ru
  text: Тогда Пашхур ударил пророка Иеремию и поместил его в колодки[a], находившиеся у Верхних Вениаминовых ворот, которые были в доме Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, возможно, «дыбу» или другое приспособление для болезненного удержания; точный вид מַהְפֶּכֶת неизвестен.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: ударил
  rationale: Глагол נכה означает «ударить, поразить». «Ударил» сохраняет неопределённость исходного текста относительно того, был ли это один удар или избиение.
- source_word: פַשְׁחוּר
  choice: Пашхур
  rationale: Имя передано принятой русской библейской транслитерацией.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: пророка Иеремию
  rationale: Титул «пророк» сохранён; естественный русский порядок слов передаёт еврейское приложение без потери смысла.
- source_word: וַיִּתֵּן אֹתוֹ עַל
  choice: заключил его в
  rationale: Контекстуально выражение обозначает помещение человека в удерживающее орудие; «заключил в» естественно по-русски и ясно выражает лишение свободы.
- source_word: הַמַּהְפֶּכֶת
  choice: колодки
  rationale: Вероятно, речь идёт о карательном приспособлении, фиксировавшем тело в мучительном положении. Точная конструкция неизвестна, поэтому неопределённость отмечена в сноске.
- source_word: שַׁעַר בִּנְיָמִן הָעֶלְיוֹן
  choice: Верхних Вениаминовых ворот
  rationale: Передаёт название ворот и определение «верхний» естественной русской формой; множественное «ворота» требует согласования во множественном числе.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Буквально сохраняет образ «дома» и передаёт личное имя יהוה как «Яхве», не заменяя его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит Тетраграмматон — личное имя Бога. Форма «Яхве» непосредственно передаёт это имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены краткость стиха, титул Иеремии, буквальный образ «дома Яхве» и лексическая неопределённость названия карательного приспособления.
