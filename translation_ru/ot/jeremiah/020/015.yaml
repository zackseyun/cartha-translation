  text: Cursed be the man who brought my father the news[a], saying[b], “A son has been born to you,” making him very glad.
translation:
  language: ru
  text: 'Проклят тот человек, который принёс моему отцу весть: «У тебя родился сын[a]!» — и очень обрадовал отца[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын, мужского пола».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте усилительная однокоренная конструкция, буквально: «обрадовал его радостью», то есть «очень обрадовал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר הָאִישׁ
  choice: Проклят тот человек
  rationale: Предикативное «проклят» сохраняет силу проклятия; «тот человек» естественно передаёт определённость и указание на конкретного вестника.
- source_word: אֲשֶׁר בִּשַּׂר אֶת אָבִי
  choice: который принёс моему отцу весть
  rationale: Глагол обозначает сообщение вести, нередко радостной. Выражение «принёс … весть» естественно по-русски и не добавляет отсутствующего в контексте богословского оттенка.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартная еврейская формула введения цитаты естественно передаётся в русском языке пунктуационным оформлением прямой речи.
- source_word: יֻלַּד לְךָ
  choice: У тебя родился
  rationale: Пассивная форма с дательным отношением передаёт завершившееся рождение, непосредственно значимое для адресата; русская конструкция «у тебя родился» идиоматична.
- source_word: בֵּן זָכָר
  choice: сын
  rationale: Буквально сочетание означает «сын, мужчина/мужского пола», но в русском слове «сын» мужской пол уже выражен; буквальная полнота отмечена в сноске.
- source_word: שַׂמֵּחַ שִׂמֳּחָהוּ
  choice: очень его обрадовал
  rationale: Инфинитив абсолютный при однокоренном личном глаголе усиливает значение; «очень обрадовал» ясно и естественно передаёт эту эмфазу.
