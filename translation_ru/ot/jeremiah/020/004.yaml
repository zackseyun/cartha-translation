source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַ֣ר יְהוָ֡ה הִנְ/נִי֩ נֹתֶנְ/ךָ֨ לְ/מָג֜וֹר לְ/ךָ֣ וּ/לְ/כָל אֹהֲבֶ֗י/ךָ וְ/נָֽפְל֛וּ בְּ/חֶ֥רֶב אֹיְבֵי/הֶ֖ם וְ/עֵינֶ֣י/ךָ רֹא֑וֹת וְ/אֶת כָּל יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/הִגְלָ֥/ם בָּבֶ֖לָ/ה וְ/הִכָּ֥/ם בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/004.yaml
  text: 'For thus says Yahweh: Behold[a], I am making you a terror to yourself and to all your loved ones, and they will fall by the sword of their enemies while your eyes look on. And I will give all Judah into the hand of the king of Babylon[c][b], and he will carry them away to Babylon and strike them with the sword.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве: «Вот, Я сделаю тебя ужасом для тебя самого и для всех, кто любит тебя.[a] Они падут от меча своих врагов, и ты увидишь это собственными глазами. Всю Иудею Я отдам в руки царя Вавилона; он уведёт их в Вавилон, в изгнание[b], и поразит их мечом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское маго́р означает «ужас» или «страх». Здесь звучит перекличка с именем, данным Пашхуру в предыдущем стихе: «Ужас со всех сторон».'
    reason: cross_reference
  - marker: b
    text: 'Или: «он переселит их в Вавилон». Речь идёт о насильственном изгнании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הִנְנִי
  choice: Вот, Я сделаю
  rationale: «Вот» сохраняет торжественную указательную силу пророческой формулы, а будущее время естественно передаёт близкое и решённое действие.
- source_word: נֹתֶנְךָ לְמָגוֹר לְךָ
  choice: Я сделаю тебя ужасом для тебя самого
  rationale: Глагол נתן в этой конструкции имеет смысл «сделать», а לְךָ указывает, что Пашхур сам будет испытывать ужас; формулировка сохраняет связь с данным ему в контексте именем.
- source_word: אֹהֲבֶיךָ
  choice: всех, кто любит тебя
  rationale: Буквально передаёт причастие от אהב и не сужает круг до друзей, родственников или союзников.
- source_word: וְנָפְלוּ בְּחֶרֶב אֹיְבֵיהֶם
  choice: Они падут от меча своих врагов
  rationale: Сохраняет устойчивый библейский образ гибели от меча без избыточного истолкования.
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: и ты увидишь это собственными глазами
  rationale: Естественно по-русски подчёркивает, что Пашхур лично станет свидетелем гибели близких ему людей.
- source_word: אֶתֵּן בְּיַד
  choice: отдам в руки
  rationale: Сохраняет прозрачный древнееврейский образ передачи во власть другого.
- source_word: וְהִגְלָם בָּבֶלָה
  choice: он уведёт их в изгнание в Вавилон
  rationale: Каузативная форма גלה означает насильственно отправить в изгнание; этот перевод выражает и перемещение, и его характер.
- source_word: וְהִכָּם בֶּחָרֶב
  choice: и поразит их мечом
  rationale: «Поразит» сохраняет широту נכה и не уточняет сверх текста, что каждый из уведённых непременно будет убит.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Смысл לְמָגוֹר לְךָ и его связь с новым именем Пашхура
  choice: ужасом для тебя самого
  alternative: предметом ужаса для самого себя; ужасом вокруг
  rationale: Синтаксис стиха прямо относит ужас к самому Пашхуру, тогда как перекличка с именем «Ужас со всех сторон» отмечена в сноске, а не внесена в основной текст.
- issue: Объём значения אֹהֲבֶיךָ
  choice: все, кто любит тебя
  alternative: твои друзья; твои близкие; твои союзники
  rationale: 'Буквальная формулировка сохраняет неопределённость: речь может идти о близких, друзьях и сторонниках Пашхура.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; сохранены образ «отдать в руки», формула «пасть от меча» и напряжение между изгнанием и поражением мечом. Все маркеры сносок присутствуют в основном тексте.
