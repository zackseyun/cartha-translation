  naturalness: Основной текст литературен и понятен. Оборот «на весь день» в данном контексте по-русски означает скорее назначение на целый день, тогда как כָּל־הַיּוֹם обозначает продолжающееся состояние «весь день». Также предложенный вариант сноски «сколько ни говорю» меняет смысл на уступительный («как бы много я ни говорил»), а не повторительный.
