base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/008.yaml
  text: For whenever I speak[a], I cry out; I proclaim, “Violence and destruction!” For the word of Yahweh has become to me a reproach and a derision all day long.
translation:
  language: ru
  text: 'Ибо всякий раз, когда я говорю[a], я кричу; возвещаю: «Насилие и разорение!» Ибо слово Яхве стало для меня поношением и насмешкой весь день.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как часто я говорю»; еврейский оборот указывает на повторяющееся действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדֵּי אֲדַבֵּר
  choice: всякий раз, когда я говорю
  rationale: Сочетание מִדֵּי с имперфектом выражает повторяющееся действие; этот перевод естественно передаёт значение «когда бы ни / всякий раз, когда».
- source_word: אֶזְעָק
  choice: я кричу
  rationale: Глагол זעק обозначает громкий, настойчивый крик; краткое «кричу» сохраняет силу выражения.
- source_word: חָמָס וָשֹׁד
  choice: Насилие и разорение!
  rationale: חָמָס означает насилие или насильственное беззаконие, а שֹׁד — разрушительное разорение, опустошение или грабёж. Выбранная пара естественна для пророческого возгласа и не сужает שֹׁד до одного лишь грабежа.
- source_word: אֶקְרָא
  choice: возвещаю
  rationale: Здесь קרא вводит содержание публично произносимого возгласа; «возвещаю» отличает его от предшествующего «кричу».
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранено устойчивое пророческое выражение «слово Яхве», а личное имя יהוה передано транслитерацией.
- source_word: לְחֶרְפָּה וּלְקֶלֶס
  choice: поношением и насмешкой
  rationale: Перевод сохраняет параллельные существительные со значениями позора, поругания и осмеяния, не устраняя возможную неоднозначность того, является ли слово объектом насмешки или причиной насмешек над пророком.
- source_word: כָּל הַיּוֹם
  choice: на весь день
  rationale: Передаёт продолжающееся в течение всего дня состояние и сохраняет связь с оборотом «стало для меня».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя, а не заменяет его титулом.
- issue: Отношение «слова Яхве» к поношению и насмешке
  choice: слово Яхве стало для меня поношением и насмешкой
  alternative: из-за слова Яхве меня весь день поносят и высмеивают
  rationale: Более буквальная конструкция сохраняет напряжение и неоднозначность исходного לִי לְחֶרְפָּה וּלְקֶלֶס; развёрнутый вариант яснее указывал бы на переживания пророка, но истолковывал бы синтаксическую связь.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксический параллелизм и повтор «ибо» сохранены; устаревшие и конфессионально окрашенные формулы не использованы.
