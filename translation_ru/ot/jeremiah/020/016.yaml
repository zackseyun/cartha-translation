source:
  edition: WLC
  text: וְ/הָיָה֙ הָ/אִ֣ישׁ הַ/ה֔וּא כֶּֽ/עָרִ֛ים אֲשֶׁר הָפַ֥ךְ יְהוָ֖ה וְ/לֹ֣א נִחָ֑ם וְ/שָׁמַ֤ע זְעָקָה֙ בַּ/בֹּ֔קֶר וּ/תְרוּעָ֖ה בְּ/עֵ֥ת צָהֳרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/016.yaml
  text: Let that man be like the cities that Yahweh overthrew without relenting[b][a], and let him hear a cry in the morning and a battle shout at the time of noon.
translation:
  language: ru
  text: Пусть тот человек будет подобен городам, которые Яхве ниспроверг и не пожалел[b]; пусть он слышит вопль поутру и боевой клич[a] в полдень.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сигнал тревоги» или «звук трубы» (евр. теруа).'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, это отзвук рассказа о городах, ниспровергнутых Яхве в суде, например о Содоме и Гоморре.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: Пусть … станет
  rationale: В контексте проклятия форма выражает пожелание, близкое к юссиву, а не простое сообщение о будущем.
- source_word: הָאִישׁ הַהוּא
  choice: тот человек
  rationale: Указательное местоимение придаёт выражению конкретность и дистанцированность; мужской род сохранён.
- source_word: כֶּעָרִים
  choice: подобен городам
  rationale: Предлог כ выражает сравнение; форма с творительным падежом естественна для современного литературного русского языка.
- source_word: אֲשֶׁר הָפַךְ יְהוָה
  choice: которые Яхве ниспроверг
  rationale: הפך обозначает катастрофическое низвержение и сохраняет вероятный отзвук рассказа о Содоме и Гоморре; «ниспроверг» передаёт силу образа точнее общего «уничтожил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, без замены титулом.
- source_word: וְלֹא נִחָם
  choice: и не смягчился
  rationale: נחם здесь относится к неотменённому суду. Выражение передаёт отсутствие смягчения решения, не создавая впечатления нравственного раскаяния Бога.
- source_word: וְשָׁמַע
  choice: пусть он слышит
  rationale: Продолжает пожелательно-проклинающую конструкцию первого глагола.
- source_word: זְעָקָה
  choice: вопль
  rationale: Слово обозначает громкий крик бедствия; «вопль» сохраняет эмоциональную силу и высокий, но понятный регистр.
- source_word: בַּבֹּקֶר
  choice: поутру
  rationale: Естественное временное обозначение, уместное в поэтическом пророческом контексте.
- source_word: וּתְרוּעָה
  choice: боевой клич
  rationale: תְּרוּעָה может обозначать воинский крик, сигнал тревоги или трубный звук. Контекст внезапного бедствия допускает «боевой клич», а иные значения отмечены в сноске.
- source_word: בְּעֵת צָהֳרָיִם
  choice: в полдень
  rationale: Краткое и естественное русское соответствие выражению «во время полудня», полностью сохраняющее временной смысл.
theological_decisions:
- issue: Описание Божьего суда без намёка на нравственное раскаяние Бога
  choice: и не смягчился
  alternative: и не раскаялся; и не пожалел
  rationale: Выбранный вариант сохраняет смысл окончательности суда и напряжение глагола נחם, но не внушает, будто Бог раскаивался в проступке.
- issue: Передача тетраграмматона
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя в исходном тексте и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Синтаксис сохраняет форму проклятия-пожелания; лексика понятна широкому читателю без конфессионально окрашенных уточнений.
