revisions:
- from: Пусть тот человек станет подобен городам, которые Яхве ниспроверг и не смягчился[b]; пусть он слышит вопль поутру и боевой клич[a] в полдень.
  to: Пусть тот человек будет подобен городам, которые Яхве ниспроверг и не пожалел[b]; пусть он слышит вопль поутру и боевой клич[a] в полдень.
  rationale: Исправлены две формулировки для более точной и естественной передачи русского текста. «Не пожалел» передаёт отсутствие милости или отступления от суда, которое в данном контексте выражает נחם, без богословского истолкования глагола как нравственного раскаяния. Сноска b переформулирована как вероятный литературный отзвук, а не как безоговорочное отождествление.
