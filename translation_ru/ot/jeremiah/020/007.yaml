base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/007.yaml
  text: You persuaded me[a], Yahweh, and I was persuaded; you overpowered me and prevailed. I have become a laughingstock all day long; everyone mocks me.
translation:
  language: ru
  text: Ты убедил меня[a], Яхве, и я поддался; Ты одолел меня и взял верх. Весь день я стал посмешищем — каждый насмехается надо мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты обманул меня, Яхве, и я был обманут». Еврейский глагол может означать «склонить», «увлечь», «убедить» или «обмануть»; жалоба Иеремии намеренно звучит резко.'
    reason: alternative_reading
lexical_decisions:
- source_word: פִּתִּיתַנִי
  choice: Ты убедил меня
  rationale: Глагол פתה допускает значения «склонять, увлекать, убеждать» и «обманывать». В основном тексте выбрано естественное русское «убедил», не устраняющее напряжённости жалобы; более резкое значение сохранено в сноске.
- source_word: וָאֶפָּת
  choice: и я дал себя убедить
  rationale: Возвратно-пассивная формулировка передаёт отклик Иеремии на предшествующее действие и сохраняет параллелизм исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: חֲזַקְתַּנִי
  choice: Ты одолел меня
  rationale: В данном контексте חזק обозначает силу, применённую к Иеремии; «одолел» ясно и естественно передаёт превосходство силы.
- source_word: וַתּוּכָל
  choice: и взял верх
  rationale: Глагол יכל здесь выражает успешное превосходство; выражение «взял верх» современно и сохраняет усиление после «одолел меня».
- source_word: הָיִיתִי לִשְׂחוֹק
  choice: я служу посмешищем
  rationale: Оборот означает, что говорящий стал объектом публичного осмеяния. Русское выражение естественно и сохраняет оттенок унижения.
- source_word: כָּל־הַיּוֹם כֻּלֹּה
  choice: Весь день
  rationale: Русское выражение кратко и естественно передаёт усиленное указание на продолжительность.
- source_word: לֹעֵג לִי
  choice: каждый насмехается надо мной
  rationale: Форма единственного числа после обобщающего выражения имеет распределительное значение; «каждый» сохраняет эту особенность точнее, чем общее «все».
theological_decisions:
- issue: Следует ли передавать פתה в основном тексте как прямое обвинение Бога в обмане
  choice: 'В основном тексте: «Ты убедил меня»; резкий вариант вынесен в сноску'
  alternative: «Ты обманул меня, Яхве, и я был обманут»
  rationale: Это эмоционально острая жалоба, а семантический диапазон еврейского глагола включает как склонение или убеждение, так и обман. Основной текст сохраняет более широкое прочтение, а сноска не скрывает возможного обвинительного смысла.
translation_notes:
  register: Современный литературный русский язык; тон личной и резкой пророческой жалобы сохранён без архаизмов. Обращение «Яхве» и местоимение «Ты» оформлены с прописной буквы как уважительная религиозная норма.
