base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/003.yaml
  text: And it happened the next day[a], when Pashhur brought Jeremiah out of the stocks, that Jeremiah said to him, “Yahweh has not called your name Pashhur, but Terror on Every Side.”
translation:
  language: ru
  text: 'На следующий день, когда Пашхур выпустил Иеремию из колодок, Иеремия сказал ему: «Яхве назвал тебя не Пашхуром, а „Ужасом со всех сторон“[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «Магор-миссавив» — имя-выражение, означающее «ужас со всех сторон» или «ужас кругом».'
    reason: Поясняет еврейское звучание пророческого имени и его смысловую игру.
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: на следующий день
  rationale: Естественно передаёт еврейское временное выражение и последовательность событий.
- source_word: וַיֹּצֵא ... אֶת יִרְמְיָהוּ מִן הַמַּהְפָּכֶת
  choice: Пашхур вывел Иеремию из колодки
  rationale: Каузативная форма глагола יצא означает «вывести» или «дать выйти»; формулировка близка к источнику и естественна по-русски.
- source_word: הַמַּהְפָּכֶת
  choice: колодка
  rationale: Обозначает орудие заключения и мучительного стеснения тела; единственное число соответствует еврейскому тексту, а слово понятно в данном контексте.
- source_word: קָרָא ... שְׁמֶךָ
  choice: назвал тебя
  rationale: Передаёт еврейскую формулу наречения имени без неестественной русской кальки «назвал твоё имя».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כִּי אִם
  choice: не … а
  rationale: Русская парная конструкция точно и естественно выражает противопоставление после отрицания.
- source_word: מָגוֹר מִסָּבִיב
  choice: Ужас со всех сторон
  rationale: Передаёт смысл данного свыше нового имени и сохраняет образ ужаса, окружающего человека отовсюду.
- source_word: פַשְׁחוּר
  choice: Пашхур
  rationale: Современная русская транслитерация личного имени, близкая к еврейскому произношению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе непосредственно употреблено личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Статус выражения מָגוֹר מִסָּבִיב
  choice: 'оформить как новое имя: «Ужас со всех сторон»'
  alternative: 'передать как простое описание: «ужас со всех сторон»'
  rationale: Формула «назвал тебя не … а …» указывает на пророческое переименование, поэтому кавычки и прописная буква уместны, но сама угроза не получает дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён без потери последовательности еврейского текста; пророческое новое имя выделено кавычками.
