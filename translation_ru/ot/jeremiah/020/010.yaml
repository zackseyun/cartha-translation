base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/010.yaml
  text: 'For I have heard the whispering of many: “Terror on every side!” “Report[a], and let us report it!” All the men at peace with me are watching for my stumbling: “Perhaps he will be deceived, and we will prevail against him[b], and we will take our vengeance on him.”'
translation:
  language: ru
  text: 'Ибо я слышал пересуды многих: «Ужас кругом!» — «Сообщите[a], и мы сообщим о нём!» Все, кто со мной в мире, подстерегают, когда я оступлюсь[b]: «Может быть, его удастся обмануть, и мы одолеем его и отомстим ему».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Донесите на него, и мы донесём». Еврейский глагол означает «сообщить, объявить, рассказать», но во враждебном контексте может подразумевать донос или обвинение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально возможно: «следят за моей хромотой» или «наблюдают за моим боком». Вероятно, речь идёт о поиске слабого места, промаха или случая для падения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּת רַבִּים
  choice: пересуды многих
  rationale: Существительное דִּבָּה может обозначать молву, недобрый слух или клеветнические речи. «Пересуды» естественно передаёт скрытые и недоброжелательные разговоры, не сужая значение до официального обвинения.
- source_word: מָגוֹר מִסָּבִיב
  choice: Ужас кругом
  rationale: Кратко и естественно передаёт устойчивое у Иеремии выражение об окружающей со всех сторон угрозе.
- source_word: הַגִּידוּ וְנַגִּידֶנּוּ
  choice: Сообщите, и мы сообщим о нём
  rationale: Глагол נגד в породе hифиль означает «сообщить, объявить, донести». В первом повелении дополнение не выражено, а суффикс во втором глаголе указывает на объект мужского рода; перевод сохраняет эту асимметрию и не исключает враждебного смысла доноса.
- source_word: כֹּל אֱנוֹשׁ שְׁלוֹמִי
  choice: Все, кто со мной в мире
  rationale: Сохраняет образное еврейское выражение «всякий человек моего мира» и передаёт людей, находившихся с говорящим в мирных или дружеских отношениях, не превращая их однозначно в близких друзей.
- source_word: שֹׁמְרֵי צַלְעִי
  choice: подстерегают, когда я оступлюсь
  rationale: Слово צֶלַע может указывать на бок, хромоту или уязвимость. В данном контексте враги следят за промахом или падением говорящего; «подстерегают, когда я оступлюсь» ясно выражает этот смысл, а буквальная образность отмечена в сноске.
- source_word: יְפֻתֶּה
  choice: его удастся обмануть
  rationale: Пассивная форма от פתה допускает значения «быть обманутым, соблазнённым, увлечённым». Здесь заговорщики надеются заманить Иеремию в ловушку; «обмануть» естественно в контексте их замысла и сохраняет пассивную направленность действия.
- source_word: וְנוּכְלָה לוֹ
  choice: и мы одолеем его
  rationale: יכל с ל в состязательном контексте означает оказаться сильнее, взять верх или одолеть. Русское «одолеем его» передаёт враждебное намерение без лишнего уточнения.
- source_word: וְנִקְחָה נִקְמָתֵנוּ מִמֶּנּוּ
  choice: и отомстим ему
  rationale: Естественный русский эквивалент еврейской идиомы «возьмём у него нашу месть»; сохраняет личный и ответный характер вражды.
