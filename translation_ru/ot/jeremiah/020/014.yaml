  yaml_path: translation/ot/jeremiah/020/014.yaml
  text: Cursed be the day on which I was born[a]; the day my mother bore me[b], let it not be blessed.
translation:
  language: ru
  text: Проклят день, в который я родился[a]! День, когда моя мать родила меня[b], да не будет благословен!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да будет проклят день, в который я родился».'
