  - marker: b
    text: 'Или: «день, когда моя мать произвела меня на свет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Предикативное прилагательное от ארר выражает проклятие; краткая форма «проклят» естественно и точно передаёт силу плача.
- source_word: הַיּוֹם אֲשֶׁר יֻלַּדְתִּי בּוֹ
  choice: день, в который я родился
  rationale: Относительная конструкция и בּוֹ переданы естественным русским временным оборотом; пассив ילד соответствует обычному «я родился».
- source_word: יוֹם אֲשֶׁר יְלָדַתְנִי אִּמִי
  choice: День, когда мать родила меня
  rationale: Активная форма ילד с субъектом «моя мать» сохранена конкретным и современным выражением; притяжательность ясна из формы «меня», поэтому русское «моя» можно не повторять.
- source_word: אַל יְהִי
  choice: да не будет
  rationale: Отрицательный юссив выражает пожелание; «да не будет» сохраняет волитивную силу и достоинство библейского плача.
- source_word: בָרוּךְ
  choice: благословен
  rationale: Слово передано в прямом смысловом и риторическом противопоставлении слову «проклят».
