base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/017.yaml
  text: because he did not kill me from the womb[a], so that my mother would have been my grave[c][b], and her womb forever pregnant.
translation:
  language: ru
  text: за то, что он не умертвил меня в утробе[a], — тогда мать моя стала бы мне могилой[b], а её чрево навеки оставалось бы беременным[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от чрева»; в данном контексте: «в утробе, до рождения».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте сжато: «мать моя — могила моя»; если бы Иеремия умер до рождения, материнская утроба стала бы местом его погребения.'
    reason: cultural_note
  - marker: c
    text: 'Или: «вечно беременным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: за то, что
  rationale: В контексте относительная частица вводит причину проклятия, обращённого к вестнику; причинная конструкция естественна по-русски и сохраняет связь с предыдущим стихом.
- source_word: לֹא מוֹתְתַנִי
  choice: не умертвил меня
  rationale: Каузативное значение глагола передано переходной формой; «умертвил» здесь точнее сохраняет смысл намеренного причинения смерти, чем «не дал мне умереть».
- source_word: מֵרָחֶם
  choice: ещё во чреве
  rationale: Контекст требует смерти до рождения. Русское «во чреве» естественно выражает этот смысл, тогда как буквальное «от чрева» было бы неясно; форма оригинала отмечена в сноске.
- source_word: וַתְּהִי לִי
  choice: чтобы ... стала мне
  rationale: 'В контексте нереализованного желания конструкция передана как желаемое следствие: если бы вестник убил Иеремию до рождения, мать стала бы ему могилой.'
- source_word: אִמִּי קִבְרִי
  choice: мать моя стала мне могилой
  rationale: Сохранена резкая, сжатая метафора еврейского текста без поясняющего добавления «утроба» в основном тексте.
- source_word: וְרַחְמָהּ
  choice: а её чрево
  rationale: Здесь слово обозначает материнскую утробу; «чрево» соответствует возвышенно-трагическому регистру и связано с библейским образом рождения.
- source_word: הֲרַת עוֹלָם
  choice: навеки осталось беременным
  rationale: Передано состояние бесконечной беременности; глагол «осталось» делает сжатую именную конструкцию понятной на современном русском, не ослабляя образ.
theological_decisions:
- issue: Контрфактический характер плача
  choice: 'Передать как нереализованное желаемое следствие: «чтобы мать моя стала мне могилой»'
  alternative: 'Буквальное результативное чтение: «и мать моя стала мне могилой»'
  rationale: Окружающий контекст — проклятие дня рождения и вестника — указывает на желание не родиться. При этом перевод не добавляет богословского объяснения причин страдания.
- issue: Образ вечной беременности
  choice: Сохранить буквально и без смягчения
  alternative: Истолковать описательно как «чтобы я никогда не вышел из её утробы»
  rationale: Прямой образ сохраняет трагическую напряжённость и поэтическую резкость оригинала, не подменяя их толкованием.
translation_notes:
  register: Современный литературный русский с достоинством и трагической выразительностью. Формы «мать моя» и «чрево» поддерживают поэтический регистр плача, оставаясь понятными современному читателю; синтаксис причинно-контрфактический и связан с предыдущим стихом.
