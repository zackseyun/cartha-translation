base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/013.yaml
  text: Sing to Yahweh[a]; praise Yahweh[c][b], for he has delivered the life of the poor from the hand of evildoers.
translation:
  language: ru
  text: Пойте Яхве[a], прославляйте Яхве, потому что Он спас жизнь бедного[b] от руки злодеев[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ); традиционный перевод — «Господь».
    reason: alternative_reading
  - marker: b
    text: Евр. נֶפֶשׁ — «душа»; в данном контексте имеется в виду жизнь или сам человек, находящийся в опасности.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «от власти злодеев»; буквально: «от руки злодеев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Пойте
  rationale: Форма повелительного наклонения во множественном числе от שׁיר прямо означает «пойте»; дополнение «хвалу» не требуется, поскольку следующий глагол уже выражает прославление.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает, кому обращено пение; личное имя יהוה передано транслитерацией «Яхве».
- source_word: הַלְלוּ
  choice: прославляйте
  rationale: Пиэль, повелительное наклонение множественного числа от הלל; «прославляйте» естественно и достойно звучит в современном русском богослужебно-поэтическом контексте.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для двух призывов и ясно передаёт причинную связь.
- source_word: הִצִּיל
  choice: избавил
  rationale: Хифиль перфекта от נצל обозначает совершённое спасительное действие; русское прошедшее время естественно передаёт завершённость.
- source_word: נֶפֶשׁ אֶבְיוֹן
  choice: бедного
  rationale: Здесь נֶפֶשׁ обозначает жизнь или самого человека, находящегося в опасности. Русское «избавил бедного» естественно передаёт личностный смысл, не превращая נֶפֶשׁ в технический термин «душа».
- source_word: מִיַּד
  choice: от руки
  rationale: Сохранён яркий еврейский образ руки как власти или контроля; смысловая альтернатива отмечена в сноске.
- source_word: מְרֵעִים
  choice: злодеев
  rationale: Субстантивированное причастие обозначает людей, творящих зло; «злодеи» кратко и весомо передаёт смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте дважды стоит личное имя Бога יהוה. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Значение נֶפֶשׁ в контексте избавления
  choice: сам бедный человек, чья жизнь находится в опасности
  alternative: душа бедного; жизнь бедного
  rationale: Контекст говорит об избавлении от злодеев, поэтому נֶפֶשׁ здесь относится к жизни или личности человека и не требует антропологического противопоставления души телу.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Параллельные повеления сохранены; причинная связь выражена прямо. Метафора «от руки» оставлена в основном тексте, а её смысл пояснён в сноске.
