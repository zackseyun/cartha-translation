  text: Then you will call on me and come and pray to me[b][a], and I will hear you.
translation:
  language: ru
  text: Тогда вы воззовёте ко Мне, придёте и помолитесь Мне[a], и Я услышу вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пойдёте и помолитесь Мне»; еврейский глагол буквально означает «идти, ходить», но здесь, вероятно, подразумевает приближение для молитвы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я выслушаю вас» или «Я внемлю вам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם אֹתִי
  choice: вы воззовёте ко Мне
  rationale: Глагол קרא с личным дополнением означает обращение с призывом; «воззовёте ко Мне» естественно передаёт обращённую к Богу настойчивую молитву и сохраняет возвышенный, но понятный регистр.
- source_word: וַהֲלַכְתֶּם
  choice: придёте
  rationale: הלך буквально означает «идти», однако перед словами о молитве здесь, вероятно, обозначает приближение с целью помолиться. «Придёте» естественно выражает движение к говорящему Богу; буквальный вариант отмечен в сноске.
- source_word: וְהִתְפַּלַּלְתֶּם אֵלַי
  choice: будете молиться Мне
  rationale: Hitpael глагола פלל обозначает молитву, направленную к Богу. Конструкция «молиться Мне» ясна и естественна в современном литературном русском.
- source_word: וְשָׁמַעְתִּי אֲלֵיכֶם
  choice: Я услышу вас
  rationale: שמע с אֶל может означать «услышать», «выслушать» или «внять». «Услышу вас» сохраняет смысловую широту еврейского выражения и не уточняет без необходимости характер Божьего ответа.
theological_decisions:
- issue: Ответ Бога на молитву
  choice: Я услышу вас
  alternative: Я выслушаю вас; Я внемлю вам
  rationale: 'Формулировка сохраняет напряжение между буквальным слышанием и благосклонным откликом: контекст предполагает отзывчивость Бога, но сам глагол не требует сводить значение только к исполнению просьбы.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Синтаксический параллелизм еврейского текста сохранён без неестественного буквального нанизывания союзов.
