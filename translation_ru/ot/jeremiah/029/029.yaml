  language: ru
  text: И священник Софония прочитал это письмо[a] вслух пророку Иеремии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово סֵפֶר может означать книгу, свиток, письменный документ или письмо; здесь по контексту речь идёт о письме Шемаии.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: И ... прочитал
  rationale: Форма Qal от קרא с письменным документом в качестве дополнения означает «прочитал»; союз «И» передаёт последовательность повествования без лишнего смыслового уточнения.
- source_word: צְפַנְיָה
  choice: Софония
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Определённое обозначение служения Софонии передано прямо и естественно по-русски.
- source_word: הַסֵּפֶר הַזֶּה
  choice: это письмо
  rationale: Слово סֵפֶר может обозначать книгу, свиток, письменный документ или письмо; ближайший контекст указывает на письмо Шемаии, поэтому «письмо» точно передаёт референт.
- source_word: בְּאָזְנֵי
  choice: вслух пророку Иеремии
  rationale: Буквально «в уши»; оборот указывает, что документ читали так, чтобы Иеремия его слышал. Русское «прочитал вслух пророку Иеремии» естественно передаёт этот смысл.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: пророку Иеремии
  rationale: Сохранены и устоявшаяся русская форма имени, и явный титул; дательный падеж обусловлен русской конструкцией «прочитать кому».
