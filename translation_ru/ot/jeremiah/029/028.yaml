base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/028.yaml
  text: For this reason he sent to us in Babylon[a], saying, ‘It will be a long time. Build houses and live in them[b], and plant gardens and eat their fruit.’
translation:
  language: ru
  text: 'Ведь он прислал нам в Вавилон весть: «Это надолго.[a] Стройте дома и живите в них,[b] разводите сады и ешьте их плоды».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Долга она». Еврейская фраза эллиптична; подразумевается, что пребывание или изгнание в Вавилоне продлится долго.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и живите»; слова «в них» подразумеваются по смыслу после повеления строить дома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַל כֵּן
  choice: Ведь
  rationale: В данном контексте сочетание обосновывает предшествующую жалобу. Русское «ведь» естественно передаёт причинно-пояснительную связь, не вводя неясного указания «по этой причине».
- source_word: שָׁלַח אֵלֵינוּ בָּבֶל
  choice: он послал нам в Вавилон
  rationale: Еврейская конструкция буквально говорит о посылке к адресатам, находящимся в Вавилоне. Русская формулировка сохраняет эту локализацию; подразумеваемое «послание» не добавлено в основной текст.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Инфинитив вводит прямую речь; в сочетании с «послал» современное русское «послал… сказать» звучит естественно.
- source_word: אֲרֻכָּה הִיא
  choice: Это надолго
  rationale: 'Еврейская фраза эллиптична: не названо то, что будет долгим, но из контекста подразумевается пребывание или изгнание в Вавилоне. «Это надолго» сохраняет краткость и недосказанность, не вставляя слово «изгнание».'
- source_word: בְּנוּ בָתִּים
  choice: Стройте дома
  rationale: Прямая и естественная передача повеления без добавления отсутствующего в еврейском возвратного оттенка.
- source_word: וְשֵׁבוּ
  choice: и живите в них
  rationale: Глагол может означать «сидеть, оставаться, жить». Местоименная группа «в них» подразумевается соседним словом «дома» и делает русский текст ясным.
- source_word: וְנִטְעוּ גַנּוֹת
  choice: разводите сады
  rationale: Глагол означает насаждать, а גַנּוֹת — сады. «Разводите сады» — естественное русское сочетание, не сужающее значение до плодовых садов.
- source_word: וְאִכְלוּ אֶת פְּרִיהֶן
  choice: и ешьте их плоды
  rationale: Формулировка прямо передаёт повеление и сохраняет отсылку местоимения к садам.
