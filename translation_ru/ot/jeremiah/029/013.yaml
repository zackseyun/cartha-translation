translation:
  language: ru
  text: Вы будете искать Меня и найдёте[a], когда будете искать Меня всем сердцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо вы будете искать Меня и найдёте, если будете искать Меня всем сердцем». Еврейский союз כִּי здесь допускает несколько близких по смыслу толкований.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  choice: Вы будете искать
  rationale: Пиэль с союзом в контексте обещания имеет будущее значение. «Искать» естественно передаёт целенаправленное стремление найти Бога.
- source_word: אֹתִי
  choice: Меня
  rationale: Показатель прямого дополнения с суффиксом первого лица единственного числа.
- source_word: וּמְצָאתֶם
  choice: и найдёте
  rationale: Каль с союзом продолжает последовательность будущего обещания; объект «Меня» естественно подразумевается из ближайшего контекста.
- source_word: כִּי
  choice: когда
  rationale: Союз вводит обстоятельство или условие, при котором исполняется обещание. «Когда» естественно звучит по-русски, но еврейское כִּי допускает также причинное или условное понимание, отмеченное в сноске.
- source_word: תִדְרְשֻׁנִי
  choice: станете искать Меня
  rationale: דרשׁ здесь обозначает усердное обращение к Богу и стремление найти Его. Добавление «станете» помогает естественно выразить обстоятельственную связь с будущим обещанием, не усиливая значение сверх исходного текста.
- source_word: בְּכָל לְבַבְכֶם
  choice: всем сердцем
  rationale: Устойчивое русское выражение точно передаёт полноту внутренней устремлённости; «сердце» сохраняет широкий библейский смысл внутреннего человека — разума, воли и чувств.
theological_decisions:
- issue: Связь между поиском Бога и обретением Его
  choice: 'Стих выражает подлинное обещание: ищущие Бога всем сердцем найдут Его, не поясняя более широкий механизм благодати или человеческой способности.'
  alternative: Текст можно понимать преимущественно как утверждение человеческой ответственности либо рассматривать в рамках учения о Божьем содействии.
  rationale: Перевод сохраняет прямую связь обещания и всецелого поиска, не привнося конфессиональных выводов.
- issue: Смысл союза כִּי
  choice: «когда» — обстоятельственное прочтение
  alternative: «потому что/ведь» — причинное прочтение; «если» — условное прочтение
  rationale: Контекст допускает несколько близких логических связей. Основной текст использует естественное русское «когда», а сноска сохраняет реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского обещания. Обращение к Богу передано с прописной буквы по принятой русской библейской традиции. Множественное «вы» сохранено; идиома «всем сердцем» звучит естественно и не сужает смысл до одних эмоций.
