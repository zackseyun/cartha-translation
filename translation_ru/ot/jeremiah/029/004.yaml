base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/004.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, to all the exiles whom I have sent into exile from Jerusalem to Babylon:'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств, Бог Израиля, всем изгнанникам, которых Я отправил в изгнание[a] из Иерусалима в Вавилон:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которых Я изгнал из Иерусалима в Вавилон». Древнееврейский глагол имеет каузативное значение: «заставить уйти в изгнание, переселить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного русского языка пророческая вестническая формула; настоящее время передаёт устойчивую функцию древнееврейской формулы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога транслитерацией, не заменяя его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет традиционное широкое значение титула и не сужает его до одних земных армий.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо и естественно передаёт древнееврейское сопряжённое сочетание.
- source_word: לְכָל הַגּוֹלָה
  choice: всем изгнанникам
  rationale: Коллективное существительное передано русским множественным числом; «изгнанники» обозначает людей, насильственно удалённых с родины, не создавая узкого образа заключённых.
- source_word: הִגְלֵיתִי
  choice: Я отправил в изгнание
  rationale: Передаёт каузативное значение породы hифиль и ясно сохраняет Божье действие; формулировка звучит естественнее буквального «Я изгнал» в данном контексте переселения.
- source_word: מִירוּשָׁלַם בָּבֶלָה
  choice: из Иерусалима в Вавилон
  rationale: Точно передаёт исходную точку и направление движения, выраженное направительным окончанием.
theological_decisions:
- issue: Божье действие в вавилонском изгнании
  choice: «которых Я отправил в изгнание»
  alternative: «которым Я позволил быть уведёнными в изгнание»
  rationale: Первое лицо и каузативный глагол прямо приписывают переселение действию Яхве; текст не следует смягчать до одного лишь Божьего позволения.
- issue: Передача имени יְהוָה
  choice: «Яхве»
  alternative: «Господь» или «Иегова»
  rationale: Транслитерация сохраняет личное имя, присутствующее в древнееврейском тексте, и отличает его от титула.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «Так говорит» и титул «Яхве Воинств» сохраняют библейскую торжественность, тогда как остальная фраза остаётся понятной обычному читателю. Маркер сноски поставлен непосредственно после спорного глагольного выражения.
