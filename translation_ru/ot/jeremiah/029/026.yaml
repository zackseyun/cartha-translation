base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/026.yaml
  text: Yahweh has made you priest in place of Jehoiada the priest[a], to be overseers in the house of Yahweh over every man who is mad and acts as a prophet[c][b], and you should put him into the stocks and the neck iron.
translation:
  language: ru
  text: Яхве поставил тебя священником вместо священника Иодая, чтобы ты был надзирателем[a] в доме Яхве над всяким безумцем, который пророчествует[b], и сажал его в колодки и шейные оковы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «быть надзирателями (или служителями)». В еврейском тексте стоит множественное число, хотя обращение «тебя» — в единственном.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ведёт себя как пророк». Само еврейское слово может быть передано нейтрально как «пророчествует»; презрительное отношение говорящего выражено словом «безумец».'
    reason: alternative_reading
  - marker: c
    text: Точное устройство названного здесь приспособления неизвестно; вероятно, это были железные оковы или зажим для шеи, применявшиеся вместе с колодками.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма естественна и узнаваема в современном русском языке.
- source_word: נְתָנְךָ כֹהֵן
  choice: поставил тебя священником
  rationale: В сочетании с обозначением должности נתן имеет смысл назначения; «поставил» сохраняет образ исходного глагола и звучит естественно.
- source_word: תַּחַת יְהוֹיָדָע הַכֹּהֵן
  choice: вместо священника Иодая
  rationale: תחת здесь указывает на замещение в должности, а не на подчинение.
- source_word: לִהְיוֹת פְּקִדִים
  choice: поручил тебе надзирать
  rationale: Функционально передаёт ответственность за надзор и позволяет получить понятную русскую фразу при необычном сочетании обращения в единственном числе с еврейским существительным во множественном числе; форма оригинала отмечена в сноске.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный древнееврейский образ дома Бога; по контексту речь идёт о храме.
- source_word: מְשֻׁגָּע
  choice: безумец
  rationale: Передаёт резкую, враждебную характеристику говорящего, не превращая её в современный медицинский диагноз.
- source_word: וּמִתְנַבֵּא
  choice: который пророчествует
  rationale: Нейтрально передаёт причастие от נבא и не решает за читателя, истинно или ложно человек выступает как пророк; враждебность уже выражена словом «безумец».
- source_word: וְנָתַתָּה אֹתוֹ
  choice: и заключать такого человека
  rationale: В данном контексте обозначает ожидаемое служебное действие; «такого человека» ясно связывает местоимение с любым человеком описанного типа.
- source_word: הַמַּהְפֶּכֶת
  choice: колодки
  rationale: Обычное и понятное обозначение приспособления, которым человека удерживали и наказывали.
- source_word: הַצִּינֹק
  choice: шейные оковы
  rationale: Передаёт вероятную функцию железного приспособления для ограничения шеи, не утверждая с излишней точностью его конструкцию.
theological_decisions:
- issue: Оценка пророческой деятельности
  choice: который пророчествует
  alternative: который ведёт себя как пророк / выдаёт себя за пророка
  rationale: Нейтральная передача формы מתנבא сохраняет напряжение между враждебной оценкой автора письма и возможной истинностью пророчества, не объявляя человека самозванцем от лица перевода.
- issue: Обобщающее אִישׁ мужского рода
  choice: всяким безумцем ... такого человека
  alternative: каждым человеком, который безумен
  rationale: «Безумец» сохраняет грамматический мужской род и оскорбительную силу исходного выражения; «такого человека» естественно передаёт последующее местоимение мужского рода.
- issue: Статус храма
  choice: дом Яхве
  alternative: храм Яхве
  rationale: Сохранён исходный образ בית יהוה без конфессионального переосмысления; значение храма ясно из контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис слегка упрощён ради естественности, но сохранены храмовая лексика, личное имя Яхве, враждебный тон письма и неопределённость относительно истинности пророчества и устройства оков.
