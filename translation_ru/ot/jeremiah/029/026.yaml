  rationale: Сохранены все смысловые компоненты и сноски, но целевая конструкция приведена ближе к древнееврейскому тексту. Единственное число «надзирателем» требуется русской грамматикой при обращении к одному человеку; необычное множественное число оригинала прозрачно отмечено в сноске. «Сажал его» естественно передаёт предписываемое должностное действие и сохраняет соотнесённость с «всяким безумцем».
