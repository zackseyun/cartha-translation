  source_fidelity: В целом переданы назначение священника, преемство после Иодая, храмовая сфера надзора, враждебное именование пророчествующего «безумцем» и два средства заключения. Однако «поручил тебе надзирать» превращает целевую конструкцию «быть надзирателями/должностными лицами» в несколько более свободное описание действия; также оно неудачно сочетается с последующим инфинитивом «заключать».
