  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַל יַשִּׁ֧יאוּ לָ/כֶ֛ם נְבִֽיאֵי/כֶ֥ם אֲשֶׁר בְּ/קִרְבְּ/כֶ֖ם וְ/קֹֽסְמֵי/כֶ֑ם וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חֲלֹמֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם מַחְלְמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/008.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Do not let your prophets who are among you and your diviners deceive you, and do not listen to your dreams that you are causing to be dreamed.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве Воинств, Бог Израиля: пусть не обманывают вас ваши пророки, которые среди вас, и ваши прорицатели; не прислушивайтесь и к своим снам, которые вы вызываете[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые вы видите». Еврейское выражение необычно: оно может относиться либо к снам, которые видят сами люди, либо к снам, которые они в некотором смысле вызывают или поддерживают.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя יְהוָה и передаёт צְבָאוֹת как традиционно понятный возвышенный титул, не сужая его лишь до земных армий.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо передаёт конструкцию и сохраняет заветное наименование.
- source_word: אַל יַשִּׁיאוּ לָכֶם
  choice: пусть не обманывают вас
  rationale: Передаёт каузативное значение формы Hiphil от נשׁא естественной русской запретительной конструкцией.
- source_word: נְבִיאֵיכֶם אֲשֶׁר בְּקִרְבְּכֶם
  choice: ваши пророки, которые среди вас
  rationale: Сохраняет принадлежность пророков общине и их присутствие внутри неё.
- source_word: קֹסְמֵיכֶם
  choice: ваши прорицатели
  rationale: Обозначает людей, практикующих гадание или прорицание, без внесения более узкой разновидности практики.
- source_word: וְאַל תִּשְׁמְעוּ אֶל
  choice: и не слушайте
  rationale: Ясно и непосредственно передаёт призыв не внимать и не доверять.
- source_word: חֲלֹמֹתֵיכֶם אֲשֶׁר אַתֶּם מַחְלְמִים
  choice: ваших снов, которые вы побуждаете сниться
  rationale: Намеренно сохраняет необычную каузативную форму Hiphil מַחְלְמִים и трудность еврейского выражения; более гладкое «которые вам снятся» устранило бы возможный оттенок содействия или порождения этих снов.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст непосредственно употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Необычная каузативная форма מַחְלְמִים
  choice: которые вы побуждаете сниться
  alternative: которые вам снятся; которые вы видите
  rationale: Выбранная формулировка не снимает напряжение между обычным значением «видеть сны» и морфологически каузативной формой, допускающей мысль о том, что адресаты каким-то образом вызывают или поддерживают эти сны.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Формула «Яхве Воинств» возвышенна, но понятна; заключительная фраза намеренно слегка необычна, поскольку отражает реальную неоднозначность и каузативную форму еврейского текста.
