  yaml_path: translation/ot/jeremiah/029/027.yaml
  text: And now[a], why have you not rebuked Jeremiah the Anathothite, who is prophesying to you?
translation:
  language: ru
  text: И почему же теперь ты не укорил Иеремию из Анатота[a], который пророчествует вам?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «анатотянина» — то есть уроженца или жителя Анатота.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительный וְ и функцию עַתָּה как маркера перехода к следующему пункту обвинения.
- source_word: לָמָּה
  choice: почему
  rationale: Прямое вопросительное слово, требующее назвать причину.
- source_word: לֹא גָעַרְתָּ
  choice: ты не укорил
  rationale: Глагол גער обозначает резкое порицание или обличение; «укорил» естественно передаёт упрёк за отсутствие дисциплинарной реакции, не добавляя прямо не выраженной идеи официального наказания.
- source_word: בְּיִרְמְיָהוּ
  choice: Иеремию
  rationale: Традиционная русская форма имени; предлог בְּ при גער передаёт объект порицания и по-русски отдельно не выражается.
- source_word: הָעֲנְּתֹתִי
  choice: из Анатота
  rationale: Еврейское относительное прилагательное означает уроженца или жителя Анатота. Оборот «из Анатота» понятнее современному русскому читателю, чем искусственное «анатотянин».
- source_word: הַמִּתְנַבֵּא
  choice: который пророчествует
  rationale: Определённое причастие описывает Иеремию как совершающего пророческое действие; настоящее время сохраняет незавершённый, продолжающийся характер.
- source_word: לָכֶם
  choice: вам
  rationale: Предлог לְ с местоименным суффиксом естественно указывает на адресатов пророчества.
