  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֶל אַחְאָ֤ב בֶּן קֽוֹלָיָה֙ וְ/אֶל צִדְקִיָּ֣הוּ בֶן מַֽעֲשֵׂיָ֔ה הַֽ/נִּבְּאִ֥ים לָ/כֶ֛ם בִּ/שְׁמִ֖/י שָׁ֑קֶר הִנְ/נִ֣י נֹתֵ֣ן אֹתָ֗/ם בְּ/יַד֙ נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/הִכָּ֖/ם לְ/עֵינֵי/כֶֽם־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, concerning Ahab son of Kolaiah and Zedekiah son of Maaseiah, who are prophesying a lie to you in my name: Behold, I am giving them into the hand of Nebuchadnezzar king of Babylon, and he will strike them down before your eyes.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств, Бог Израиля, об Ахаве, сыне Колаи, и Седекии, сыне Маасеи, которые от Моего имени пророчествуют вам ложь: «Вот, Я отдам их в руки Навуходоносора[a], царя Вавилона, и он поразит их у вас на глазах».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте имя имеет форму «Навуходреццар»; «Навуходоносор» — его общепринятая русская передача.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет устойчивую формулу пророческого вестника и звучит естественно в современном литературном русском языке.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя Бога транслитерацией «Яхве», а צְבָאוֹת — традиционным и достаточно широким словом «Воинств», не сводя образ только к земным армиям.
- source_word: אֶל
  choice: об
  rationale: Предлог вводит тех, о ком произносится слово, а не адресатов прямого обращения.
- source_word: הַנִּבְּאִים לָכֶם בִּשְׁמִי שָׁקֶר
  choice: которые от Моего имени пророчествуют вам ложь
  rationale: Причастная форма передана как продолжающееся действие; «от Моего имени» выражает притязание на Божье полномочие, а «ложь» сохраняет предметный характер שָׁקֶר.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Передаёт торжественное и emphатическое введение Божьего объявления без архаической тяжеловесности.
- source_word: נֹתֵן אֹתָם בְּיַד
  choice: отдам их в руки
  rationale: Естественный русский эквивалент идиомы, обозначающей передачу людей во власть другого.
- source_word: וְהִכָּם
  choice: и он поразит их
  rationale: Глагол נכה означает нанесение удара или поражение; перевод сохраняет серьёзность суда, не уточняя прямо «убьёт», хотя контекст допускает смертельный исход.
- source_word: לְעֵינֵיכֶם
  choice: у вас на глазах
  rationale: Естественно передаёт смысл открытого совершения события перед очевидцами.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога, не заменяя его титулом.
- issue: Объём значения וְהִכָּם
  choice: он поразит их
  alternative: он убьёт их; он нанесёт им удар
  rationale: Выбрана формулировка, сохраняющая лексическую широту глагола и не делающая смертельный исход явным там, где сам глагол отдельно этого не требует.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «Так говорит» и слово «Вот» сохраняют торжественность оригинала; синтаксис остаётся ясным для широкого круга читателей. Имена переданы в привычных русских библейских формах.
