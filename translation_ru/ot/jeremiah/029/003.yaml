id: JER.29.3
reference: Jeremiah 29:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּ/יַד֙ אֶלְעָשָׂ֣ה בֶן שָׁפָ֔ן וּ/גְמַרְיָ֖ה בֶּן חִלְקִיָּ֑ה אֲשֶׁ֨ר שָׁלַ֜ח צִדְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה אֶל נְבוּכַדְנֶאצַּ֛ר מֶ֥לֶךְ בָּבֶ֖ל בָּבֶ֥לָ/ה לֵ/אמֹֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/003.yaml
  text: 'by the hand of Elasah son of Shaphan and Gemariah son of Hilkiah[a], whom Zedekiah king of Judah sent to Nebuchadnezzar king of Babylon in Babylon[b], saying:'
translation:
  language: ru
  text: 'через[a] Елеасу, сына Шафана, и Гемарию, сына Хелкии, которых Седекия, царь Иудеи, послал в Вавилон к Навуходоносору[b], царю Вавилона, со словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Елеасы… и Гемарии»; это еврейская идиома со значением «через, посредством».'
    reason: lexical_alternative
  - marker: b
    text: Здесь в еврейском тексте стоит форма имени נְבוּכַדְנֶאצַּר (Невухаднецар); «Навуходоносор» — его традиционная русская передача.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיַד
  choice: через
  rationale: 'Буквально «рукой»; здесь это обычное обозначение посредничества: письмо было передано через названных посланников. «Через» естественно передаёт смысл идиомы по-русски.'
- source_word: אֶלְעָשָׂה
  choice: Елеаса
  rationale: Передача личного имени в форме, привычной для русской библейской традиции; винительный падеж обусловлен предлогом «через».
- source_word: וּגְמַרְיָה
  choice: и Гемария
  rationale: Союз и личное имя переданы прямо; винительный падеж имеет ту же синтаксическую функцию, что и имя Елеасы.
- source_word: בֶן
  choice: сын
  rationale: Стандартное обозначение родства; в приложении естественно оформляется как «сына».
- source_word: שָׁפָן
  choice: Шафан
  rationale: Транслитерация личного имени согласно устоявшейся русской библейской форме.
- source_word: חִלְקִיָּה
  choice: Хелкия
  rationale: Транслитерация личного имени согласно устоявшейся русской библейской форме.
- source_word: אֲשֶׁר שָׁלַח
  choice: которых … послал
  rationale: Относительное местоимение относится к двум посланникам; глагол имеет простое значение «послал».
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Седекия, царь Иудеи
  rationale: Имена и титул переданы в принятых русских формах; приложение выделено запятыми для ясности.
- source_word: אֶל נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל בָּבֶלָה
  choice: в Вавилон к Навуходоносору, царю Вавилона
  rationale: Форма בָּבֶלָה выражает направление «в Вавилон», а אֶל указывает адресата — царя. Перестановка предложных групп устраняет по-русски неясное повторение и сохраняет обе составляющие исходного текста.
- source_word: לֵאמֹר
  choice: 'со словами:'
  rationale: Формула вводит последующее содержание письма или речи; «со словами» естественно связывает этот фрагмент с продолжением.
