translation_notes:
  register: 'Современный литературный русский язык с сохранением достоинства библейского повествования. Синтаксис перестроен минимально ради естественного русского порядка слов: направление «в Вавилон» поставлено перед адресатом «к Навуходоносору». Традиционные русские формы библейских имён сохранены, а более точная форма имени в еврейском тексте отмечена в сноске.'
