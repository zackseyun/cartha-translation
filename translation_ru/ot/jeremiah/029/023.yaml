  variant: modern literary Russian
source:
  edition: WLC
  text: יַ֡עַן אֲשֶׁר֩ עָשׂ֨וּ נְבָלָ֜ה בְּ/יִשְׂרָאֵ֗ל וַ/יְנַֽאֲפוּ֙ אֶת נְשֵׁ֣י רֵֽעֵי/הֶ֔ם וַ/יְדַבְּר֨וּ דָבָ֤ר בִּ/שְׁמִ/י֙ שֶׁ֔קֶר אֲשֶׁ֖ר ל֣וֹא צִוִּיתִ֑/ם וְ/אָנֹכִ֛י הו ידע וָ/עֵ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/023.yaml
  text: because they have committed an outrageous act in Israel[a], and have committed adultery with their neighbors’ wives, and have spoken in my name a lie that I did not command them. And I am the one who knows and is a witness[c][b], declares Yahweh.
translation:
  language: ru
  text: за то, что они совершили гнусное дело в Израиле[a], прелюбодействовали с жёнами своих ближних и говорили от Моего имени ложь, говорить которую Я им не повелевал. Я — Тот, Кто знает и является свидетелем[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершили позорный поступок» или «совершили безумие». Еврейское נְבָלָה обозначает нравственно возмутительный, постыдный поступок. Выражение «в Израиле» можно также понять как «среди Израиля».'
    reason: Лексическая и синтаксическая альтернативы.
  - marker: b
    text: 'Или: «И Я знаю и являюсь свидетелем». В еврейском тексте местоимение усилено: буквально по смыслу — «И Я, именно Я, знающий и свидетель».'
    reason: Сохранение эмфатической конструкции и возможной альтернативной передачи.
lexical_decisions:
- source_word: יַעַן אֲשֶר
  choice: за то, что
  rationale: Оборот вводит причину суда, изложенного в предыдущем стихе; «за то, что» естественно связывает этот фрагмент с предшествующим приговором.
- source_word: עָשׂוּ נְבָלָה
  choice: совершили гнусное дело
  rationale: נְבָלָה обозначает нравственно возмутительный и позорный поступок; «гнусное дело» сохраняет силу обвинения и хорошо сочетается с последующим указанием на прелюбодеяние.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Предлог ב прежде всего передан локативно; выражение также допускает понимание «среди Израиля», что отмечено в сноске.
- source_word: וַיְנַאֲפוּ אֶת נְשֵׁי רֵעֵיהֶם
  choice: прелюбодействовали с жёнами своих ближних
  rationale: נאף прямо обозначает прелюбодеяние, а רֵעַ здесь — ближний, соплеменник или член общины, не обязательно близкий друг.
- source_word: וַיְדַבְּרוּ דָבָר בִּשְׁמִי שֶׁקֶר
  choice: говорили от Моего имени ложь
  rationale: Русское «от Моего имени» естественно выражает притязание на Божье полномочие; «ложь» сохраняет конкретное обвинение в ложном пророчестве.
- source_word: אֲשֶׁר לֹא צִוִּיתִם
  choice: которой Я им не повелевал
  rationale: 'Относительное местоимение отнесено к «лжи»: Бог не поручал им произносить такое слово; формулировка сохраняет отсутствие Божьего повеления, не добавляя толкования.'
- source_word: וְאָנֹכִי הוּא יֹדֵעַ וָעֵד
  choice: Я — Тот, Кто знает и является свидетелем
  rationale: Конструкция אָנֹכִי הוּא эмфатична. Перевод сохраняет усиленное самообозначение и судебный оттенок слова «свидетель».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — торжественная пророческая формула, а личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное заветное имя יהוה; транслитерация «Яхве» прямо сохраняет его как имя.
- issue: Бог как знающий и свидетель
  choice: Я — Тот, Кто знает и является свидетелем
  alternative: Я знаю и Я свидетель
  rationale: Выбранный вариант сохраняет эмфатическое אָנֹכִי הוּא и одновременно не устраняет напряжение между знанием Бога и Его судебной ролью свидетеля.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Использованы понятные, но не разговорные слова; местоимения, относящиеся к Богу, оформлены с прописной буквы. Двоеточие показывает, что следующие проступки раскрывают содержание «гнусного дела».
