source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַ֡עַן אֲשֶׁ֣ר אַתָּה֩ שָׁלַ֨חְתָּ בְ/שִׁמְ/כָ֜ה סְפָרִ֗ים אֶל כָּל הָ/עָם֙ אֲשֶׁ֣ר בִּ/ירוּשָׁלִַ֔ם וְ/אֶל צְפַנְיָ֤ה בֶן מַֽעֲשֵׂיָה֙ הַ/כֹּהֵ֔ן וְ/אֶ֥ל כָּל הַ/כֹּהֲנִ֖ים לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/025.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Because you have sent letters in your own name to all the people who are in Jerusalem, and to Zephaniah son of Maaseiah the priest, and to all the priests, saying,'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств, Бог Израиля: «За то, что ты от своего имени[a] послал письма всему народу, находящемуся в Иерусалиме, священнику Софонии, сыну Маасеи, и всем священникам, говоря:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твоим именем». Вероятно, подчёркивается, что Шемая действовал по собственной власти, а не от имени Яхве.'
    reason: Лексический вариант и контекстуальное пояснение выражения בְשִׁמְךָ.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула; сохраняет торжественный тон и естественно звучит в современном русском языке.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя Бога транслитерацией «Яхве», а צְבָאוֹת — широким по смыслу словом «Воинств», не ограничивая образ только земными армиями.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача сочетания в сопряжённой форме.
- source_word: יַעַן אֲשֶׁר
  choice: За то, что
  rationale: В данном контексте вводит основание последующего обличения или суда и естественно связывается с продолжением речи.
- source_word: שָׁלַחְתָּ ... סְפָרִים
  choice: ты ... послал письма
  rationale: Перфект обозначает уже совершённое действие; סְפָרִים в контексте переписки означает «письма».
- source_word: בְשִׁמְךָ
  choice: от своего имени
  rationale: Естественно передаёт действие на основании собственной власти; возвратное «своего» указывает на подлежащее без внесения нового референта.
- source_word: כָּל הָעָם אֲשֶׁר בִּירוּשָׁלִַם
  choice: всему народу, находящемуся в Иерусалиме
  rationale: Сохраняет относительную конструкцию еврейского текста и обозначает находящихся в городе людей.
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: священнику Софонии, сыну Маасеи
  rationale: Сохраняет последовательность имени и отчества по отцу; определение «священник» отнесено к Софонии, что соответствует синтаксису и контексту.
- source_word: וְאֶל כָּל הַכֹּהֲנִים
  choice: и всем священникам
  rationale: Прямая передача сочетания с כל и определённым множественным числом.
- source_word: לֵאמֹר
  choice: 'говоря:'
  rationale: Формула вводит содержание писем, которое следует в следующем стихе; двоеточие показывает незавершённость цитаты.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя יהוה; транслитерация сохраняет его как личное имя, не заменяя титулом.
- issue: Смысл בְשִׁמְךָ
  choice: от своего имени
  alternative: твоим именем / от твоего имени
  rationale: Фраза указывает, что автор писем выступал от собственной власти, а не от имени Яхве; при этом пояснение вынесено в сноску, чтобы не перегружать основной текст толкованием.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет зависимость от продолжения в следующем стихе. Имена переданы в укоренившейся русской библейской форме: Софония, Маасея.'
