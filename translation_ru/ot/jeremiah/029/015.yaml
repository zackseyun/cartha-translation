  text: כִּ֖י אֲמַרְתֶּ֑ם הֵקִ֨ים לָ֧/נוּ יְהוָ֛ה נְבִאִ֖ים בָּבֶֽלָ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/015.yaml
  text: Because you have said[b][a], “Yahweh has raised up prophets for us in Babylon,”
translation:
  language: ru
  text: 'Так как[a] вы сказали: «Яхве поставил[b] нам пророков в Вавилоне»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь вы сказали».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «воздвиг для нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Так как
  rationale: Союз вводит основание для последующего ответа Бога; «так как» ясно передаёт причинную связь, хотя возможно и пояснительное «ведь».
- source_word: אֲמַרְתֶּם
  choice: вы сказали
  rationale: Форма qatal 2-го лица множественного числа указывает на ранее высказанное утверждение; в современном русском естественен простой прошедший вид.
- source_word: הֵקִים
  choice: поставил
  rationale: Hiphil глагола קום здесь означает, что Бог дал или назначил пророков. «Поставил» естественно звучит по-русски и сохраняет значение назначения; образное «воздвиг» отмечено в сноске.
- source_word: לָנוּ
  choice: нам
  rationale: Предлог ל с местоименным суффиксом выражает предназначение или пользу; при глаголе «поставил» по-русски естественно «нам».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: נְבִאִים
  choice: пророков
  rationale: Прямое соответствие множественному числу существительного נָבִיא.
- source_word: בָּבֶלָה
  choice: в Вавилоне
  rationale: Форма с локативным окончанием в данном контексте обозначает место пребывания пророков.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Статус пророков в Вавилоне
  choice: Сохранено утверждение адресатов без оценки его истинности внутри стиха
  alternative: Уточнить, что речь идёт о ложных пророках
  rationale: Сам стих передаёт слова адресатов и не называет этих пророков ложными; такая оценка следует из более широкого контекста, но не должна вноситься непосредственно в перевод.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Начальный причинный союз и завершающая запятая сохранены, поскольку стих синтаксически ведёт к последующему Божьему ответу.
