source:
  edition: WLC
  text: אַחֲרֵ֣י צֵ֣את יְכָנְיָֽה הַ֠/מֶּלֶךְ וְ/הַ/גְּבִירָ֨ה וְ/הַ/סָּרִיסִ֜ים שָׂרֵ֨י יְהוּדָ֧ה וִ/ירוּשָׁלִַ֛ם וְ/הֶ/חָרָ֥שׁ וְ/הַ/מַּסְגֵּ֖ר מִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/002.yaml
  text: after King Jeconiah[a], the queen mother, the court officials, the officials of Judah and Jerusalem[c][b], and the craftsmen and the metalworkers had gone out from Jerusalem—
translation:
  language: ru
  text: после того как царь Иехония, царица-мать, придворные[a], правители Иудеи и Иерусалима[b], ремесленники и кузнецы[c] покинули Иерусалим, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евнухи». Еврейское слово может обозначать как евнухов в собственном смысле, так и царских придворных.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вельможи Иудеи и Иерусалима».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «мастера по металлу». Точное значение еврейского слова не вполне определённо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי צֵאת
  choice: после того как … покинули
  rationale: Временная конструкция с инфинитивом передаётся естественным русским придаточным; действие предшествует отправке письма из контекста стиха 1.
- source_word: יְכָנְיָה הַמֶּלֶךְ
  choice: царь Иехония
  rationale: Сохранена форма имени, соответствующая еврейскому יְכָנְיָה, без унификации с другими вариантами имени; титул поставлен перед именем по нормам русского языка.
- source_word: הַגְּבִירָה
  choice: царица-мать
  rationale: В царском контексте слово обозначает мать царя как носительницу официального придворного статуса.
- source_word: הַסָּרִיסִים
  choice: придворные
  rationale: Термин может обозначать как евнухов, так и царских служащих шире; контекст допускает функциональное обозначение, а неоднозначность отмечена в сноске.
- source_word: שָׂרֵי יְהוּדָה וִירוּשָׁלַם
  choice: правители Иудеи и Иерусалима
  rationale: שׂרים обозначает руководителей или высших должностных лиц; «правители» естественно передаёт их властное положение, не приписывая им царского происхождения.
- source_word: הֶחָרָשׁ
  choice: ремесленники
  rationale: חרש может широко обозначать мастера или ремесленника; общее наименование сохраняет отличие от следующей профессиональной группы.
- source_word: הַמַּסְגֵּר
  choice: кузнецы
  rationale: Редкий термин, вероятно обозначающий мастеров по металлу; традиционное и ясное русское «кузнецы» сохраняет вероятный смысл, а более широкая возможность отмечена в сноске.
- source_word: מִירוּשָׁלָם
  choice: покинули Иерусалим
  rationale: Предлог מן указывает исходную точку движения; глагол «покинули» естественно выражает выход из города, не добавляя прямо не названное здесь принуждение к переселению.
