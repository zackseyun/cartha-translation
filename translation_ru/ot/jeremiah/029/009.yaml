source:
  edition: WLC
  text: כִּ֣י בְ/שֶׁ֔קֶר הֵ֛ם נִבְּאִ֥ים לָ/כֶ֖ם בִּ/שְׁמִ֑/י לֹ֥א שְׁלַחְתִּ֖י/ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/009.yaml
  text: For they are prophesying falsely to you in my name[a]; I did not send them[c][b], declares Yahweh.
translation:
  language: ru
  text: Ведь они ложно[a] пророчествуют вам от Моего имени; Я не посылал их, — говорит Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во лжи»; возможно также: «пророчествуют вам ложь».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское יהוה (YHWH), традиционно передаваемое как «ГОСПОДЬ»; также встречается форма «Иегова».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего предостережения; «ведь» естественно передаёт причинно-пояснительную связь в современном русском языке.
- source_word: בְשֶׁקֶר
  choice: ложно
  rationale: Буквально выражение означает «во лжи»; наречие «ложно» естественно характеризует их пророчествование и не ослабляет обвинения.
- source_word: נִבְּאִים
  choice: пророчествуют
  rationale: Причастная форма обозначает продолжающееся или характерное действие; русское настоящее время передаёт это без тяжеловесной конструкции.
- source_word: לָכֶם
  choice: вам
  rationale: Предлог לְ отмечает адресатов пророческой речи.
- source_word: בִשְׁמִי
  choice: от Моего имени
  rationale: Передаёт заявление о том, что они говорят, якобы имея Божье полномочие; формулировка сохраняет богословски значимый контраст с последующим отрицанием посланничества.
- source_word: לֹא שְׁלַחְתִּים
  choice: Я не посылал их
  rationale: Отрицательная перфектная форма прямо отрицает, что Бог уполномочил этих пророков.
- source_word: נְאֻם יְהוָה
  choice: говорит Яхве
  rationale: Устойчивая пророческая формула передана ясно и торжественно, но без архаизации; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Божественное полномочие пророков
  choice: Пророки ложно говорят от Божьего имени, а Бог прямо отрицает, что посылал их.
  alternative: Понимать ложность лишь как ошибочность содержания без ложной претензии на Божье полномочие.
  rationale: Сочетание «от Моего имени» и «Я не посылал их» подчёркивает как ложность пророчества, так и отсутствие Божьего поручения.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем и титулом и не устраняет традиционный вариант, указанный в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и прямой; сохранён контраст между притязанием говорить от Божьего имени и Божьим отрицанием посланничества.
