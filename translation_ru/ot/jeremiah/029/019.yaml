source:
  edition: WLC
  text: תַּ֛חַת אֲשֶֽׁר לֹא שָׁמְע֥וּ אֶל דְּבָרַ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֩ שָׁלַ֨חְתִּי אֲלֵי/הֶ֜ם אֶת עֲבָדַ֤/י הַ/נְּבִאִים֙ הַשְׁכֵּ֣ם וְ/שָׁלֹ֔חַ וְ/לֹ֥א שְׁמַעְתֶּ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/019.yaml
  text: because they did not listen to my words[a], declares Yahweh, which I sent to them by my servants the prophets, rising early and sending them, and you did not listen[b], declares Yahweh.
translation:
  language: ru
  text: за то, что они не слушали Моих слов, — возвещает Яхве, — ведь Я посылал к ним Моих слуг, пророков, неустанно посылая их. Но вы не слушали, — возвещает Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: за то, что
  rationale: Оборот вводит причину суда, изложенного в предыдущем стихе; по-русски связь с предшествующим наказанием естественно передаётся сочетанием «за то, что».
- source_word: שָׁמְעוּ / שְׁמַעְתֶּם
  choice: не слушали / не слушали
  rationale: Глагол שׁמע с אֶל означает не просто физически слышать, а внимать сказанному. «Не слушали» сохраняет эту смысловую широту, не сужая её до прямого «не повиновались».
- source_word: אֶל דְּבָרַי
  choice: Моих слов
  rationale: Сохранено множественное число еврейского текста и конкретное указание на неоднократные Божьи обращения.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана естественным для современного русского библейского регистра глаголом «возвещает».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: אֲשֶׁר שָׁלַחְתִּי אֲלֵיהֶם אֶת עֲבָדַי הַנְּבִאִים
  choice: которые Я посылал им через Моих слуг-пророков
  rationale: Относительное местоимение соотнесено со «словами», а пророки представлены как посланные Богом служители, через которых эти слова достигали адресатов. «Слуги-пророки» сохраняет тесное приложение двух существительных.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: снова и снова посылая их
  rationale: Еврейская идиома буквально говорит о раннем вставании и посылании, но выражает настойчивое, многократное действие. Русская передача раскрывает идиоматический смысл, а буквальный образ отмечен в сноске.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: Но вы не слушали
  rationale: «Но» естественно выражает контраст в контексте; переход от третьего лица к прямому обращению во втором лице множественного числа сохранён.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это отличие от титула.
- issue: Переход от третьего лица ко второму
  choice: сохранить «они не слушали» и «вы не слушали»
  alternative: согласовать обе части в одном лице
  rationale: Масоретский текст внезапно переходит к прямому обращению. Этот риторический поворот непосредственно вменяет вину слушателям, поэтому его не следует сглаживать.
- issue: Антропоморфная идиома о раннем вставании
  choice: передать смысл как многократное посылание, сохранив буквальный образ в сноске
  alternative: 'буквально: «вставая рано и посылая»'
  rationale: Оборот подчёркивает постоянную и настойчивую инициативу Яхве, а не сообщает о буквальном режиме дня Бога. Сноска позволяет сохранить доступ к исходному образу.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим оттенком. Синтаксис сохраняет причинную связь с предыдущим стихом и резкий переход к прямому обращению, но громоздкая еврейская идиома передана понятно для обычного читателя.
