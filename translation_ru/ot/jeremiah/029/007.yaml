source:
  edition: WLC
  text: וְ/דִרְשׁ֞וּ אֶת שְׁל֣וֹם הָ/עִ֗יר אֲשֶׁ֨ר הִגְלֵ֤יתִי אֶתְ/כֶם֙ שָׁ֔מָּ/ה וְ/הִתְפַּֽלְל֥וּ בַעֲדָ֖/הּ אֶל יְהוָ֑ה כִּ֣י בִ/שְׁלוֹמָ֔/הּ יִהְיֶ֥ה לָ/כֶ֖ם שָׁלֽוֹם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/007.yaml
  text: Seek the welfare of the city where I have sent you into exile[a], and pray to Yahweh on its behalf, for in its welfare you will have welfare.
translation:
  language: ru
  text: Ищите благополучия[a] города, куда Я отправил вас в изгнание, и молитесь Яхве за него, ибо в его благополучии будет и ваше благополучие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мира», «благоденствия». Еврейское слово шалом трижды употреблено в стихе — о городе и об изгнанниках.'
    reason: Лексическая альтернатива и значимый повтор исходного текста.
lexical_decisions:
- source_word: דִרְשׁוּ
  choice: Ищите
  rationale: Императив передаёт настойчивое стремление к благу города, а не просто умственный поиск. «Ищите» сохраняет широту и прямую силу еврейского глагола, не сводя повеление к одной конкретной форме деятельности.
- source_word: שְׁלוֹם
  choice: благополучие
  rationale: Здесь שָׁלוֹם охватывает мир, безопасность, устойчивость и общее процветание города. «Благополучие» естественно передаёт этот широкий смысл и позволяет одинаково перевести повторяющееся слово применительно к городу и изгнанникам.
- source_word: הָעִיר
  choice: города
  rationale: Определённая форма указывает на конкретный город, в котором живут изгнанники; «город» — прямой и естественный русский эквивалент.
- source_word: הִגְלֵיתִי אֶתְכֶם שָׁמָּה
  choice: куда Я отправил вас в изгнание
  rationale: 'Каузативная форма גלה прямо выражает Божье действие: Он отправил адресатов в изгнание. Такое построение естественно по-русски и сохраняет как Божью субъектность, так и вынужденный характер переселения.'
- source_word: הִתְפַּלְלוּ בַעֲדָהּ
  choice: молитесь ... за него
  rationale: Глагол означает «молиться», а בַעַד с местоименным суффиксом — «за него, в его пользу». Русская конструкция «молиться за город» ясна и не сужает смысл до специального термина «ходатайствовать».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией «Яхве», а не заменено титулом.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание предшествующих повелений. «Ибо» кратко и естественно для достоинственного литературного регистра.
- source_word: בִשְׁלוֹמָהּ יִהְיֶה לָכֶם שָׁלוֹם
  choice: в его благополучии будет и ваше благополучие
  rationale: Одинаковый перевод обоих употреблений שָׁלוֹם сохраняет намеренный лексический повтор и взаимосвязь между благом города и благом изгнанников. Частица «и» естественно выявляет эту связь, не сводя её только к материальному процветанию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное Божье имя исходного текста и не вносит конфессионально обусловленной замены титулом.
- issue: Связь благополучия города и изгнанников
  choice: «в его благополучии будет и ваше благополучие»
  alternative: «от его благополучия зависит ваше благополучие»
  rationale: Выбранная формулировка ближе к синтаксису еврейского текста и сохраняет его ёмкую причинно-ситуативную связь, не усиливая её до явно сформулированной зависимости.
translation_notes:
  register: Современный литературный русский язык с достоинственным библейским звучанием. Повеления переданы прямо и понятно; сохранены Божья субъектность в изгнании, личное имя Яхве и тройной повтор ключевого понятия שָׁלוֹם.
