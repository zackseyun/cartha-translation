  text: וְ/רָֽדַפְתִּי֙ אַֽחֲרֵי/הֶ֔ם בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וּ/נְתַתִּ֨י/ם ל/זועה לְ/כֹ֣ל מַמְלְכ֣וֹת הָ/אָ֗רֶץ לְ/אָלָ֤ה וּ/לְ/שַׁמָּה֙ וְ/לִ/שְׁרֵקָ֣ה וּ/לְ/חֶרְפָּ֔ה בְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁר הִדַּחְתִּ֥י/ם שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/018.yaml
  text: And I will pursue them with the sword[a], with famine, and with pestilence, and I will make them a horror to all the kingdoms of the earth, a curse, a desolation, an object of hissing[b], and a reproach among all the nations where I have driven them.
translation:
  language: ru
  text: И я буду преследовать их мечом, голодом и мором. Я сделаю их предметом ужаса[a] для всех царств земли, проклятием, предметом ужасающего запустения, предметом свиста[b] и поруганием среди всех народов, куда я их изгнал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трепетом»; еврейское слово может обозначать ужас, страх или содрогание.'
    reason: lexical_alternative
  - marker: b
    text: То есть предметом презрительного свиста или шипения.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדַפְתִּי אַחֲרֵיהֶם
  choice: И Я буду преследовать их
  rationale: Глагол רדף с אַחֲרֵי передаёт настойчивое преследование. Русское «преследовать» естественно и сохраняет активную силу выражения.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: мечом, голодом и мором
  rationale: Сохранена традиционная пророческая триада суда. Творительный падеж естественно передаёт инструментальное значение предлога ב; «мор» обозначает губительную эпидемию и соответствует возвышенному пророческому регистру.
- source_word: וּנְתַתִּים לְזַוֲעָה
  choice: Я сделаю их ужасом[a]
  rationale: Конструкция נתן ל означает «сделать кем-либо/чем-либо». זועה допускает оттенки ужаса, содрогания и предмета, вызывающего страх; «ужасом» сохраняет краткость формулы, а неоднозначность отмечена в сноске.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: для всех царств земли
  rationale: '«Для» естественно выражает отношение результата: они станут ужасом в глазах всех земных царств.'
- source_word: לְאָלָה
  choice: проклятием
  rationale: אָלָה обозначает проклятие, иногда проклятие в составе клятвы. В данном перечне публичного бесчестия общее «проклятие» наиболее ясно и не сужает смысл без необходимости.
- source_word: וּלְשַׁמָּה
  choice: опустошением
  rationale: שַׁמָּה может указывать на запустение, опустошение или нечто повергающее в ужас. «Опустошением» сохраняет отличие от предшествующего זועה.
- source_word: וְלִשְׁרֵקָה
  choice: предметом насмешливого свиста[b]
  rationale: שְׁרֵקָה обозначает свист или шипение наблюдателей как выражение презрения. Развёрнутая формулировка ясно показывает, что народ станет объектом насмешки.
- source_word: וּלְחֶרְפָּה
  choice: и поруганием
  rationale: חֶרְפָּה выражает публичный позор, поношение или поругание. «Поругание» сохраняет достоинство пророческого стиля и не дублирует «насмешливый свист».
- source_word: בְּכָל הַגּוֹיִם אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: среди всех народов, куда Я их изгнал
  rationale: «Среди» естественно передаёт пребывание рассеянных людей у других народов. Каузативная форма נדח означает, что Бог сам изгнал или рассеял их; «изгнал» сохраняет явную божественную субъектность и силу действия.
theological_decisions:
- issue: Божественная субъектность в суде и изгнании
  choice: 'Сохранены прямые действия Бога: «Я буду преследовать», «Я сделаю», «Я их изгнал».'
  alternative: Передать суд и изгнание безличными или пассивными оборотами.
  rationale: Еврейский текст прямо приписывает Богу преследование, превращение народа в предмет ужаса и прежнее изгнание. Перевод не смягчает это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис разделён на два предложения для ясности, при этом последовательность образов и повтор первого лица сохранены. Все сноски привязаны к соответствующим еврейским словам.
