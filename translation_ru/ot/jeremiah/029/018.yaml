- from: И Я буду преследовать их мечом, голодом и мором. Я сделаю их ужасом[a] для всех царств земли, проклятием, опустошением, предметом насмешливого свиста[b] и поруганием среди всех народов, куда Я их изгнал.
  to: И я буду преследовать их мечом, голодом и мором. Я сделаю их предметом ужаса[a] для всех царств земли, проклятием, предметом ужасающего запустения, предметом свиста[b] и поруганием среди всех народов, куда я их изгнал.
