    issue: Неудачная передача שַׁמָּה как «опустошением».
    rationale: В данной формуле речь о том, чем народ станет для других народов; «опустошение» по-русски преимущественно обозначает процесс или состояние, а не объект публичного ужаса и запустения. «Предметом ужаса» точнее в этом контексте.
  - severity: low
    issue: «Сделаю их ужасом» звучит не вполне естественно.
    rationale: Конструкция «сделаю их предметом ужаса» яснее передаёт, что они станут объектом страха для царств.
  - severity: low
    issue: Прописное «Я» не мотивировано исходным текстом.
    rationale: Еврейский текст выражает первое лицо глагольными формами, но не задаёт русской конфессиональной капитализации; строчное «я» соответствует современному литературному употреблению.
