  yaml_path: translation/ot/jeremiah/029/014.yaml
  text: And I will let myself be found by you[a], declares Yahweh, and I will restore your fortunes and gather you from all the nations and from all the places where I have driven you, declares Yahweh, and I will bring you back to the place from which I sent you into exile.
translation:
  language: ru
  text: Я позволю вам найти Меня, — возвещает Яхве, — и восстановлю ваше благополучие[a], соберу вас из всех народов и из всех мест, куда Я изгнал вас, — возвещает Яхве, — и верну вас в то место, откуда отправил вас в изгнание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я восстановлю ваш плен»; возможен также вариант: «Я верну ваших пленников». Это еврейское выражение — идиома, обозначающая обращение вспять положения изгнания и бедствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִמְצֵאתִי לָכֶם
  choice: Я дам вам найти Меня
  rationale: Нифаль глагола מצא означает «быть найденным». Такая формулировка естественна по-русски, сохраняет образ обретения Бога и одновременно передаёт Его инициативу, не усиливая смысл до «Я откроюсь вам».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула, обозначающая торжественное слово Бога. «Возвещает» сохраняет её весомость и хорошо звучит в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: וְשַׁבְתִּי אֶת שביתכם
  choice: Я восстановлю ваше благополучие
  rationale: Оборот שוב את־שבות/שבית — идиома, обозначающая обращение бедственного положения вспять, здесь включая восстановление после изгнания. Более буквальные варианты сохранены в сноске.
- source_word: וְקִבַּצְתִּי אֶתְכֶם
  choice: соберу вас
  rationale: קבץ в контексте восстановления означает собрать рассеянный народ воедино.
- source_word: מִכָּל הַגּוֹיִם וּמִכָּל הַמְּקוֹמוֹת
  choice: из всех народов и из всех мест
  rationale: Сохраняется параллелизм оригинала и различие между народами и конкретными местами рассеяния.
- source_word: אֲשֶׁר הִדַּחְתִּי אֶתְכֶם שָׁם
  choice: куда Я изгнал вас
  rationale: Порода хифиль глагола נדח выражает принудительное удаление или изгнание; «изгнал» сохраняет оттенок суда.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם
  choice: и верну вас
  rationale: 'Хифиль глагола שוב имеет каузативный смысл: Бог сделает так, что народ возвратится. Русское «верну вас» передаёт это кратко и естественно.'
- source_word: אֲשֶׁר הִגְלֵיתִי אֶתְכֶם מִשָּׁם
  choice: откуда отправил вас в изгнание
  rationale: Хифиль глагола גלה означает отправить или увести в изгнание. Перевод явно сохраняет исторический смысл депортации и Божью роль в суде.
theological_decisions:
- issue: Передача идиомы שׁוּב אֶת־שְׁבוּת/שְׁבִית
  choice: Я восстановлю ваше благополучие
  alternative: Я возвращу вас из плена; Я верну ваших пленников
  rationale: Идиома обозначает изменение постигшей народ бедственной участи, а следующие части стиха уже прямо говорят о собирании и возвращении изгнанников. Основной вариант передаёт широкий смысл без избыточного повтора, а буквальные возможности отмечены в сноске.
- issue: Передача божественной инициативы в וְנִמְצֵאתִי לָכֶם
  choice: Я дам вам найти Меня
  alternative: Я буду найден вами
  rationale: Пассивная форма оригинала оставляет в напряжении человеческое искание и добровольную доступность Бога. Русская формулировка сохраняет обе стороны и не превращает выражение в более толковательное «Я откроюсь вам».
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Синтаксис остаётся ясным для широкого читателя; повтор формулы «возвещает Яхве» и параллелизм исходного текста сохранены. Маркер [a] поставлен непосредственно после выражения, к которому относится сноска.
