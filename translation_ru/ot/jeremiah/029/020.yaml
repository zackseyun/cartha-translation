source:
  edition: WLC
  text: וְ/אַתֶּ֖ם שִׁמְע֣וּ דְבַר יְהוָ֑ה כָּל הַ֨/גּוֹלָ֔ה אֲשֶׁר שִׁלַּ֥חְתִּי מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/020.yaml
  text: But you, all the exiles whom I sent from Jerusalem to Babylon, hear the word of Yahweh.
translation:
  language: ru
  text: А вы, все изгнанники, которых Я отправил из Иерусалима в Вавилон, слушайте слово Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֶּם
  choice: А вы
  rationale: Союз с самостоятельным местоимением обозначает контрастный переход к новой группе адресатов; «А вы» естественно передаёт его по-русски.
- source_word: שִׁמְעוּ
  choice: слушайте
  rationale: Императив означает «слушайте/услышьте». «Слушайте» естественно в прямом обращении и не делает подразумеваемое повиновение явным значением.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: «Слово» сохраняет устойчивую пророческую формулу и богословскую значимость Божьей речи; личное имя передано как «Яхве».
- source_word: כָּל הַגּוֹלָה
  choice: все изгнанники
  rationale: Существительное в единственном числе имеет собирательное значение и обозначает всё сообщество уведённых в изгнание.
- source_word: אֲשֶׁר שִׁלַּחְתִּי
  choice: которых Я отправил
  rationale: Глагол שלח прямо означает «послал/отправил»; перевод не усиливает его до «изгнал» или «выгнал».
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: из Иерусалима в Вавилон
  rationale: Предлог מִן указывает исходный пункт, а направительное окончание в בָּבֶלָה — движение к Вавилону.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. «Яхве» передаёт это имя транслитерацией, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Контрастное обращение передано через «А вы», коллективное הַגּוֹלָה — естественным множественным числом. Заглавная буква в «Я» обозначает говорящего Бога и соответствует принятой русской библейской практике.
