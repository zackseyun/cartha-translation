source:
  edition: WLC
  text: כִּי֩ אָנֹכִ֨י יָדַ֜עְתִּי אֶת הַ/מַּחֲשָׁבֹ֗ת אֲשֶׁ֧ר אָנֹכִ֛י חֹשֵׁ֥ב עֲלֵי/כֶ֖ם נְאֻם יְהוָ֑ה מַחְשְׁב֤וֹת שָׁלוֹם֙ וְ/לֹ֣א לְ/רָעָ֔ה לָ/תֵ֥ת לָ/כֶ֖ם אַחֲרִ֥ית וְ/תִקְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/011.yaml
  text: For I know the plans that I have for you[a], declares Yahweh, plans for peace and not for harm[b], to give you a future and a hope.
translation:
  language: ru
  text: Ибо Я знаю замыслы, которые у Меня для вас, — возвещает Яхве, — замыслы о благополучии[a], а не о бедствии[b], чтобы дать вам будущее и надежду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «о мире»; еврейское шалом может включать мир, целостность, безопасность и благополучие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о несчастье», «о вреде»; употреблённое здесь слово может также означать «зло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего обещания; «ибо» сохраняет причинно-пояснительную связь и соответствует достоинству пророческой речи.
- source_word: יָדַעְתִּי
  choice: Я знаю
  rationale: Перфект глагола состояния выражает твёрдое, наличное знание; русское настоящее время передаёт это естественно.
- source_word: הַמַּחֲשָׁבוֹת ... חֹשֵׁב
  choice: замыслы, которые замышляю
  rationale: Повтор однокоренных существительного и глагола отражает еврейскую словесную связь и подчёркивает целенаправленное намерение, хотя по-русски звучит несколько торжественно.
- source_word: עֲלֵיכֶם
  choice: о вас
  rationale: Предлог обозначает направленность мысли или замысла на адресатов. «О вас» сохраняет это значение, не добавляя прямо отсутствующее в выражении «для вас» толкование.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула; «возвещает» передаёт авторитетность изречения, а личное имя Яхве сохраняется как имя, а не заменяется титулом.
- source_word: מַחְשְׁבוֹת שָׁלוֹם
  choice: замыслы о благополучии
  rationale: В данном противопоставлении бедствию שָׁלוֹם охватывает мир, целостность, безопасность и благополучие. «Благополучие» естественно передаёт широкий смысл по-русски; более буквальное «мир» указано в сноске.
- source_word: לֹא לְרָעָה
  choice: не о бедствии
  rationale: רָעָה здесь противопоставлено שָׁלוֹם и обозначает несчастье или бедствие, а не прежде всего нравственное зло.
- source_word: לָתֵת לָכֶם
  choice: чтобы дать вам
  rationale: Инфинитив выражает цель; перевод сохраняет её прямо и естественно.
- source_word: אַחֲרִית
  choice: будущее
  rationale: Слово может означать конец, исход или последующее будущее. В обещании изгнанникам «будущее» передаёт направленный вперёд смысл без архаизма.
- source_word: תִקְוָה
  choice: надежду
  rationale: Существительное обозначает надежду или ожидаемую перспективу; «надежду» точно и естественно сочетается с «будущим».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл שָׁלוֹם в обещании изгнанникам
  choice: благополучие
  alternative: мир; целостность; благоденствие
  rationale: Контекст говорит о благом исходе после бедствия. Выбор передаёт широкий смысл שָׁלוֹם, не сводя его лишь к отсутствию войны; буквальная и иные смысловые возможности отмечены в сноске.
- issue: Смысл רָעָה в противопоставлении שָׁלוֹם
  choice: бедствие
  alternative: зло; несчастье; вред
  rationale: Здесь речь идёт о неблагоприятной участи или бедствии, а не обязательно о нравственном зле; такая передача сохраняет контекстуальное противопоставление.
translation_notes:
  register: Современный литературный русский с торжественным пророческим оттенком. Однокоренной повтор «замыслы, которые замышляю» намеренно сохраняет риторическую форму еврейского текста. Заглавная буква в местоимении «Я» служит принятой русской формой почтительного обозначения Бога, не меняя смысла исходника.
