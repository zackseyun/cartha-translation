  source_fidelity: Основной смысл передан верно, включая адресатов, Иерусалим как место отправления и Вавилон как место насильственного уведения. Однако «переселённому» способно в современном русском звучать нейтрально или административно и несколько ослабляет каузативное значение הֶגְלָה («увёл в изгнание, депортировал»).
  naturalness: Фраза в целом естественна, но личная конструкция «которых Навуходоносор увёл в изгнание» яснее обозначает действие и виновника. «Изгнанники» также точнее в данном историческом контексте, чем потенциально добровольные «переселенцы».
  terminology: «Пророк Иеремия», «священники», «пророки», «Навуходоносор», «Иерусалим» и «Вавилон» употреблены корректно. Для הַגּוֹלָה выбран термин «изгнанники» как обозначение депортированной общины; сноска сохраняет лексико-синтаксическую неопределённость выражения יֶתֶר זִקְנֵי הַגּוֹלָה.
