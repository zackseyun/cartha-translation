base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/001.yaml
  text: These are the words of the letter that Jeremiah the prophet sent from Jerusalem to the remaining elders of the exiles[a], and to the priests, the prophets[d][c][b], and all the people whom Nebuchadnezzar had carried away from Jerusalem to Babylon.
translation:
  language: ru
  text: Вот слова письма, которое пророк Иеремия послал из Иерусалима оставшимся старейшинам среди изгнанников[a], священникам, пророкам и всему народу, которых Навуходоносор увёл из Иерусалима в Вавилон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остальным старейшинам изгнаннической общины». Еврейское выражение может означать оставшихся старейшин среди изгнанников либо остальных старейшин депортированной общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Естественно вводит содержание документа в современном русском языке; начальное וְ здесь связывает стих с контекстом и не требует отдельного «и».
- source_word: דִּבְרֵי הַסֵּפֶר
  choice: слова письма
  rationale: סֵפֶר обозначает письменный документ, а контекст отправки определённым адресатам поддерживает значение «письмо»; «слова» сохраняет конструкцию оригинала.
- source_word: יִרְמְיָה הַנָּבִיא
  choice: пророк Иеремия
  rationale: Естественный русский порядок слов при сохранении титула.
- source_word: יֶתֶר זִקְנֵי הַגּוֹלָה
  choice: оставшимся старейшинам среди переселенцев
  rationale: יֶתֶר передаёт значение оставшейся части, а הַגּוֹלָה может обозначать общину насильственно переселённых; формулировка избегает неясного сочетания «старейшины изгнания».
- source_word: הַכֹּהֲנִים וְאֶל הַנְּבִיאִים
  choice: священникам, пророкам
  rationale: Стандартные современные соответствия названиям служений.
- source_word: אֲשֶׁר הֶגְלָה
  choice: переселённому ... из Иерусалима в Вавилон
  rationale: Hiphil глагола גלה означает принудительно увести или отправить в изгнание. «Переселённому» ясно передаёт депортацию в контексте, не утяжеляя фразу.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Навуходоносором
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: בָּבֶלָה
  choice: в Вавилон
  rationale: Направительный суффикс передаёт движение к Вавилону.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Переселенцы» и «переселённому» в данном контексте обозначают людей, насильственно уведённых в Вавилон, а не добровольных переселенцев. Маркер [a] помещён непосредственно после неоднозначного выражения.
