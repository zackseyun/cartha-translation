base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/032.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to punish Shemaiah the Nehelamite and his offspring. He will not have a man dwelling among this people, nor will he see the good that I am doing for my people, declares Yahweh[b], because he has spoken rebellion against Yahweh.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве: «Вот, Я накажу Шемаию Нехеламитянина[a] и его потомство. Ни один мужчина из его потомков не останется среди этого народа, и он не увидит того добра, которое Я совершаю для Моего народа, — возвещает Яхве, — потому что он проповедовал мятеж против Яхве[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Шемаию-сновидца». Точное значение обозначения הַנֶּחֱלָמִי неясно; оно может быть связано со сновидениями, поэтому в основном тексте сохранено как имя-прозвание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проповедовал отступничество от Яхве» или «проповедовал бунт против Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и связь грядущего суда с предшествующим пророчеством.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет традиционную пророческую формулу в естественном современном русском языке и передаёт личное имя Бога.
- source_word: הִנְנִי פֹקֵד עַל
  choice: Вот, Я призову к ответу
  rationale: הִנְנִי сохраняется посредством «вот», а судебное значение פקד על передано без излишнего уточнения способа наказания.
- source_word: שְׁמַעְיָה הַנֶּחֱלָמִי
  choice: Шемаию Нехеламитянина
  rationale: Имя транслитерировано; неясное прозвание или обозначение происхождения сохранено как собственное наименование, а возможная связь со сновидениями отмечена в сноске.
- source_word: וְעַל זַרְעוֹ
  choice: и его потомство
  rationale: זֶרַע здесь имеет собирательное значение и обозначает потомков.
- source_word: לֹא יִהְיֶה לוֹ אִישׁ יוֹשֵׁב בְּתוֹךְ הָעָם הַזֶּה
  choice: Не будет у него ни одного мужчины, живущего среди этого народа
  rationale: Сохранены мужской род אִישׁ и образ проживания среди народа; русская конструкция остаётся понятной и не заменяет формулировку более широким «никого».
- source_word: וְלֹא יִרְאֶה בַטּוֹב
  choice: и он не увидит того добра
  rationale: Сохраняет еврейский образ «увидеть добро», естественный и в русском языке.
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה לְעַמִּי
  choice: которое Я совершаю для Моего народа
  rationale: Настоящее время передаёт причастную форму עֹשֶׂה, не исключая разворачивающегося или близкого будущего действия.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая и читаемая передача пророческой формулы, отмечающей божественный источник изречения.
- source_word: כִּי סָרָה דִבֶּר עַל יְהוָה
  choice: потому что он говорил мятежное против Яхве
  rationale: Субстантивированное «мятежное» сохраняет напряжённую конструкцию «говорил мятеж/отступничество», не сводя её ни исключительно к политическому бунту, ни исключительно к вероотступничеству.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное имя заветного Бога, присутствующее в еврейском тексте, без замены титулом.
- issue: Характер вины Шемаии в выражении סָרָה דִבֶּר
  choice: говорил мятежное
  alternative: говорил об отступничестве; проповедовал бунт
  rationale: Формулировка сохраняет возможные оттенки мятежа, отпадения и подстрекательства, не разрешая неоднозначность в пользу одной конфессиональной или политической трактовки.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис умеренно формальный, но понятный широкому читателю; сохранены повтор имени Яхве, образ «увидеть добро» и неоднозначность ключевых эпитетов и обвинения.
