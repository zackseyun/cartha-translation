- from: '«Пошли ко всем изгнанникам сказать: „Так говорит Яхве о Шемаии Нехеламитянине[a]: за то, что Шемая пророчествовал вам, хотя Я не посылал его, и заставил вас поверить лжи…“»'
  to: '«Пошли всем изгнанникам это послание: „Так говорит Яхве о Шемаии Нехеламитянине[a]: за то, что Шемаия пророчествовал вам, хотя Я не посылал его, и побудил вас довериться лжи…“»'
  rationale: 'Исправлены падежная форма имени и неестественная конструкция с «послать сказать». Добавление «это послание» не меняет смысла: в еврейском повелении объект отправки подразумевается и в данном контексте является письмом. Каузативная форма בטח передана без излишнего оттенка принуждения. Незавершённая причинная конструкция и многоточие сохранены, так как приговор продолжается в следующем стихе.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:01:42Z'
