  text: שְׁלַ֤ח עַל כָּל הַ/גּוֹלָה֙ לֵ/אמֹ֔ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה אֶל שְׁמַעְיָ֖ה הַ/נֶּחֱלָמִ֑י יַ֡עַן אֲשֶׁר֩ נִבָּ֨א לָ/כֶ֜ם שְׁמַעְיָ֗ה וַֽ/אֲנִי֙ לֹ֣א שְׁלַחְתִּ֔י/ו וַ/יַּבְטַ֥ח אֶתְ/כֶ֖ם עַל שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/031.yaml
  text: 'Send to all the exiles[a], saying, ‘Thus says Yahweh concerning Shemaiah the Nehelamite: Because Shemaiah has prophesied to you, though I did not send him, and has made you trust in a lie,’'
translation:
  language: ru
  text: '«Пошли всем изгнанникам это послание: „Так говорит Яхве о Шемаии Нехеламитянине[a]: за то, что Шемаия пророчествовал вам, хотя Я не посылал его, и побудил вас довериться лжи…“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, возможно, «Шемаии-сновидце», если это обозначение образовано от слова, связанного со сновидениями, а не является названием места или рода.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח עַל כָּל הַגּוֹלָה
  choice: Пошли ко всем изгнанникам
  rationale: Императив שְׁלַח передан прямым повелением; עַל при глаголе отправки понимается как указание адресатов, а הַגּוֹלָה — как сообщество уведённых в изгнание.
- source_word: לֵאמֹר
  choice: сказать
  rationale: 'Стандартный еврейский показатель вводимой речи естественно соединён с повелением: «пошли… сказать».'
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена пророческая формула и личное имя Бога, представленное тетраграмматоном.
- source_word: אֶל שְׁמַעְיָה הַנֶּחֱלָמִי
  choice: о Шемаии Нехеламитянине
  rationale: אֶל здесь вводит предмет пророческого высказывания, а не его адресата. Неясное обозначение הַנֶּחֱלָמִי передано транслитерационно как вероятное указание на происхождение или принадлежность.
- source_word: יַעַן אֲשֶׁר
  choice: за то, что
  rationale: Выражение вводит основание последующего суда; формула «за то, что» уместна в контексте обвинения и продолжающегося в следующем стихе приговора.
- source_word: נִבָּא לָכֶם
  choice: пророчествовал вам
  rationale: Сохранено прямое значение формы от נבא и направленность речи к изгнанникам.
- source_word: וַאֲנִי לֹא שְׁלַחְתִּיו
  choice: хотя Я не посылал его
  rationale: Союз передан уступительно, подчёркивая противоречие между деятельностью Шемаии и отсутствием Божьего поручения.
- source_word: וַיַּבְטַח אֶתְכֶם עַל שָׁקֶר
  choice: и заставил вас поверить лжи
  rationale: Каузативная форма בטח передана как «заставил… поверить»; שָׁקֶר обозначает ложь как объект или основание ошибочного доверия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом; это сохраняет различие между именем Бога и обозначением «Господь».
- issue: Статус пророчества Шемаии
  choice: «хотя Я не посылал его»
  alternative: «но Я не посылал его»
  rationale: 'Уступительная конструкция ясно сохраняет богословское напряжение: Шемая выступал как пророк без Божьего поручения, а его речь привела людей к доверию лжи.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет незавершённость причинной конструкции, поскольку приговор продолжается в следующем стихе. Имя שְׁמַעְיָה передано как «Шемая», в косвенном падеже — «Шемаии».
