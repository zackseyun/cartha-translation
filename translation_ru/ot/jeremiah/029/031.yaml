  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: приказ адресовать весть изгнанникам, формула «Так говорит Яхве», предмет пророчества о Шемаии, отсутствие Божьего послания и каузативное побуждение к ложному доверию сохранены. Однако исходное «Пошли ко всем изгнанникам сказать» синтаксически неудачно и может означать послать человека; форма имени после «о» также требует исправления.'
  naturalness: Нужна более естественная русская передача эпистолярного повеления и согласование падежной формы имени с предлогом «о». «Побудил вас довериться лжи» передаёт каузатив без оттенка физического принуждения, который может создавать «заставил».
  terminology: «Яхве» последовательно передаёт тетраграмматон. Неопределённое הַנֶּחֱלָמִי сохранено транслитерацией; сноска корректно отмечает альтернативу «сновидец», не выдавая её за установленное значение.
