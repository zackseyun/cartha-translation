    rationale: Для имени «Шемая» предложная форма — «о Шемае». Либо следует употребить традиционную форму «Шемаия», для которой «о Шемаии» грамматически корректно.
  - severity: medium
    issue: Оборот «Пошли ко всем изгнанникам сказать» двусмыслен и тяжеловесен.
    rationale: По-русски он скорее предполагает отправку лица, тогда как еврейское повеление в контексте письма требует отправить сообщение. Явно названное «послание» естественно передаёт подразумеваемый объект.
  - severity: low
    issue: «Заставил вас поверить лжи» может подразумевать принуждение.
    rationale: Hифиль בטח обозначает побуждение/приведение к доверию; «побудил вас довериться лжи» сохраняет каузативное значение более нейтрально.
