source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִי֙ מְשַׁלֵּ֣חַ בָּ֔/ם אֶת הַ/חֶ֖רֶב אֶת הָ/רָעָ֣ב וְ/אֶת הַ/דָּ֑בֶר וְ/נָתַתִּ֣י אוֹתָ֗/ם כַּ/תְּאֵנִים֙ הַ/שֹּׁ֣עָרִ֔ים אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/017.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am sending against them the sword, the famine, and the pestilence, and I will make them like rotten figs that cannot be eaten because of their badness.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Вот, Я посылаю на них меч, голод и мор и сделаю их подобными негодным смоквам[a], которые нельзя есть, настолько они плохи».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плохим смоквам», «испорченным смоквам»; редкое еврейское прилагательное обозначает плоды настолько плохие, что их невозможно есть.'
    reason: Лексическая неоднозначность редкого слова הַשֹּׁעָרִים.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя Бога и широкий смысл צְבָאוֹת — небесные и земные воинства; это также естественная для русского библейского регистра форма титула.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Передаёт указательную и торжественную силу пророческой формулы, не утяжеляя современную русскую речь архаизмом «се».
- source_word: מְשַׁלֵּחַ בָּם
  choice: посылаю на них
  rationale: Конструкция с הִנְנִי и причастием выражает яркое, близкое действие; предлог ב в данном контексте имеет враждебную направленность.
- source_word: הַחֶרֶב אֶת הָרָעָב וְאֶת הַדָּבֶר
  choice: меч, голод и мор
  rationale: Сохраняет конкретную пророческую триаду бедствий. «Мор» кратко и торжественно обозначает губительную эпидемию и естественно сочетается с «мечом» и «голодом».
- source_word: וְנָתַתִּי אוֹתָם
  choice: и сделаю их подобными
  rationale: 'Передаёт идиоматическое значение נתן при сравнительном обороте: привести людей в состояние, уподобленное названному образу.'
- source_word: כַּתְּאֵנִים הַשֹּׁעָרִים
  choice: подобными негодным смоквам
  rationale: «Негодным» сохраняет оценочную широту редкого прилагательного שֹׁעָרִים и в сочетании со следующим пояснением ясно означает испорченные, несъедобные плоды.
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: которые нельзя есть, настолько они плохи
  rationale: Передаёт практическую несъедобность и причинно-качественный смысл מֵרֹעַ без неуместного для плодов морального оттенка слова «зло».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет собственное заветное имя в исходном тексте и не подменяет его титулом; вариант «Иегова» менее точно отражает принятую реконструкцию произношения.
- issue: Объём значения титула צְבָאוֹת
  choice: Воинств
  alternative: небесных воинств; армий
  rationale: Форма без уточнения сохраняет присущую еврейскому титулу смысловую широту и не ограничивает его только небесными силами или земными армиями.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены образ «меча», трёхчастная формула суда и название плода «смоквы», привычное для библейского регистра; архаическое «се» не используется.
