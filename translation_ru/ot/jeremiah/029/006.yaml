base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/006.yaml
  text: Take wives and father sons and daughters[a]; and take wives for your sons, and give your daughters to men, so that they may bear sons and daughters; multiply there[c][b], and do not decrease.
translation:
  language: ru
  text: Берите себе жён и становитесь отцами сыновей и дочерей[a]. Берите жён для своих сыновей, а своих дочерей выдавайте замуж за мужчин[b], чтобы они рожали сыновей и дочерей. Умножайтесь там и не уменьшайтесь числом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «производите на свет сыновей и дочерей»; глагол обращён к мужчинам и означает «становитесь отцами».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отдавайте своих дочерей мужчинам»; в данном контексте речь идёт о замужестве.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не становитесь малочисленными».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ נָשִׁים
  choice: Берите себе жён
  rationale: Еврейское выражение обозначает вступление в брак. Такой перевод сохраняет образ исходного текста и ясно передаёт брачный смысл.
- source_word: וְהוֹלִידוּ
  choice: и пусть у вас рождаются
  rationale: Каузативная форма глагола ילד при подлежащем мужского рода означает «порождать, становиться отцом». Русская конструкция передаёт этот смысл естественно и не приписывает мужчинам действие «рожать».
- source_word: בָּנִים וּבָנוֹת
  choice: сыновья и дочери
  rationale: Сохранено явное упоминание детей обоих полов, а не обобщённое «дети».
- source_word: וּקְחוּ לִבְנֵיכֶם נָשִׁים
  choice: Берите жён для своих сыновей
  rationale: Перевод близко следует еврейской брачной формуле и остаётся понятным в современном русском языке.
- source_word: וְאֶת בְּנוֹתֵיכֶם תְּנוּ לַאֲנָשִׁים
  choice: а дочерей выдавайте замуж
  rationale: Буквально сказано «отдавайте мужчинам», но контекст однозначно говорит о заключении брака; русская идиома естественно выражает этот смысл.
- source_word: וְתֵלַדְנָה
  choice: чтобы они рожали
  rationale: Форма женского рода множественного числа указывает на женщин, а в связи с предшествующими повелениями выражает предполагаемый результат или цель.
- source_word: וּרְבוּ
  choice: Умножайтесь
  rationale: Сохраняется обычное библейское обозначение численного роста народа.
- source_word: שָׁם
  choice: там
  rationale: Наречие указывает на место изгнания, названное в ближайшем контексте.
- source_word: וְאַל תִּמְעָטוּ
  choice: и не уменьшайтесь числом
  rationale: Передан прямой контраст с повелением умножаться и уточнён численный смысл глагола.
