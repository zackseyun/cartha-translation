  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה כִּ֠י לְ/פִ֞י מְלֹ֧את לְ/בָבֶ֛ל שִׁבְעִ֥ים שָׁנָ֖ה אֶפְקֹ֣ד אֶתְ/כֶ֑ם וַ/הֲקִמֹתִ֤י עֲלֵי/כֶם֙ אֶת דְּבָרִ֣/י הַ/טּ֔וֹב לְ/הָשִׁ֣יב אֶתְ/כֶ֔ם אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/010.yaml
  text: 'For this is what Yahweh says: When seventy years for Babylon are completed[a], I will attend to you and fulfill my good word to you[c][b], to bring you back to this place.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве: «Когда для Вавилона истекут семьдесят лет[a], Я обращу на вас внимание[b] и исполню для вас мое доброе слово[c], чтобы вернуть вас в это место».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда исполнятся семьдесят лет для Вавилона». Это может означать срок, назначенный в связи с Вавилоном; древнееврейская формулировка не уточняет характер этой связи.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Я посещу вас». Древнееврейский глагол может означать, что Бог обращает на кого-либо внимание — для суда или для помощи; здесь контекст благоприятный.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «утвержу для вас мое доброе слово». Речь идёт об осуществлении того, что Яхве обещал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, сохраняя его отличие от титула «Господь».
- source_word: כִּי כֹה אָמַר
  choice: Ибо так говорит
  rationale: Естественно передаёт древнееврейскую формулу, вводящую Божье возвещение, и сохраняет причинную связь כִּי с предшествующим контекстом.
- source_word: כִּי לְפִי מְלֹאת לְבָבֶל שִׁבְעִים שָׁנָה
  choice: Когда исполнятся семьдесят лет для Вавилона
  rationale: Сохраняет связь семидесяти лет с Вавилоном, выраженную предлогом לְ, не уточняя, идёт ли речь о сроке вавилонского господства или пребывания изгнанников.
- source_word: אֶפְקֹד אֶתְכֶם
  choice: Я обращу на вас внимание
  rationale: Глагол פקד обозначает обращение действенного внимания на человека — для суда или для помощи; здесь восстановительный контекст указывает на благоприятное действие, но перевод сохраняет широту глагола.
- source_word: וַהֲקִמֹתִי עֲלֵיכֶם אֶת דְּבָרִי הַטּוֹב
  choice: и исполню для вас Моё доброе слово
  rationale: В сочетании с דָּבָר глагол קום в породе Hiphil означает утвердить сказанное, осуществив его. «Доброе слово» сохраняет образ исходного текста и в контексте означает благоприятное обещание.
- source_word: לְהָשִׁיב אֶתְכֶם
  choice: вернув вас
  rationale: 'Передаёт каузативное значение Hiphil от שוב: Бог сделает так, что люди возвратятся.'
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: на это место
  rationale: Сохраняет значение מָקוֹם («место»), не сужая его до Иерусалима и не расширяя до всей земли.
theological_decisions:
- issue: К чему относятся семьдесят лет, связанные с Вавилоном
  choice: Нейтральная формулировка «семьдесят лет для Вавилона»
  alternative: «семьдесят лет в Вавилоне» или «семьдесят лет вавилонского господства»
  rationale: Древнееврейская конструкция связывает срок с Вавилоном, но сама по себе не требует определять его как продолжительность изгнания или господства Вавилона; перевод сохраняет эту неоднозначность.
- issue: Характер Божьего действия, выраженного פקד
  choice: «обращу на вас внимание» с пояснением благоприятного контекста
  alternative: «позабочусь о вас» или «посещу вас»
  rationale: Контекст обещает восстановление, однако сам глагол шире и может обозначать внимание как для помощи, так и для суда. Основной перевод не превращает контекстуальный оттенок в единственное лексическое значение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранены выражения «доброе слово» и «это место», чтобы не заменять образы исходного текста толкованием. Несколько необычная конструкция «для Вавилона» намеренно удерживает смысловую открытость древнееврейского текста; она пояснена сноской.
