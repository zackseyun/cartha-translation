  text: בְּנ֥וּ בָתִּ֖ים וְ/שֵׁ֑בוּ וְ/נִטְע֣וּ גַנּ֔וֹת וְ/אִכְל֖וּ אֶת פִּרְיָֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/005.yaml
  text: Build houses and live in them[a]; plant gardens and eat their fruit.
translation:
  language: ru
  text: Стройте дома и живите в них[a]; разводите сады и ешьте их плоды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обитайте в них». Еврейский глагол может обозначать постоянное, оседлое проживание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוּ בָתִּים
  choice: Стройте дома
  rationale: Прямо передаёт повелительную форму множественного числа בנה и конкретное значение בָּתִּים — «дома», не добавляя отсутствующего в тексте оттенка «домашнего очага».
- source_word: וְשֵׁבוּ
  choice: и живите в них
  rationale: ישב может означать «сидеть», «жить», «обитать», «оставаться». При упоминании домов современное русское «живите в них» естественно выражает длительное проживание; местоимение «в них» необходимо по нормам русского языка и ясно отсылает к домам.
- source_word: וְנִטְעוּ גַנּוֹת
  choice: разводите сады
  rationale: נטע буквально означает «сажать», а גן — «сад». Сочетание «разводите сады» естественно по-русски передаёт создание и насаждение садов, особенно ввиду последующего упоминания их плодов.
- source_word: וְאִכְלוּ אֶת־פִּרְיָן
  choice: и ешьте их плоды
  rationale: Передаёт обычное значение אכל «есть» и פְּרִי «плод». Притяжательное «их» отражает суффикс 3-го лица женского рода множественного числа, отсылающий к садам.
