base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/022.yaml
  text: And from them a curse will be taken up by all the exiles of Judah who are in Babylon[a], saying, “May Yahweh make you like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire.”
translation:
  language: ru
  text: 'Из-за них все изгнанники Иудеи, находящиеся в Вавилоне, будут употреблять такое проклятие: «Пусть Яхве сделает тебя таким, как Седекия и Ахав, которых царь Вавилона изжарил в огне».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сжёг в огне». Еврейский глагол допускает более общее значение «сжечь», но «изжарил» сохраняет его яркую образность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֻקַּח מֵהֶם קְלָלָה
  choice: И от них ... возьмут проклятие
  rationale: Пассивная форма לקח буквально означает, что проклятие будет взято от них; в естественном русском порядке слов агент выражен как «все переселенцы», при этом сохранён образ заимствованной формулы проклятия.
- source_word: לְכֹל גָּלוּת יְהוּדָה אֲשֶׁר בְּבָבֶל
  choice: все переселенцы Иудеи, находящиеся в Вавилоне
  rationale: גָּלוּת здесь обозначает сообщество изгнанников, а не отвлечённое состояние плена. «Переселенцы» понятно современному читателю и передаёт вынужденное пребывание вдали от родины.
- source_word: יְשִׂמְךָ יְהוָה כְּצִדְקִיָּהוּ וּכְאֶחָב
  choice: Пусть Яхве сделает с тобой то же, что с Седекией и Ахавом
  rationale: Форма выражает пожелание-проклятие. Русская конструкция «сделает с тобой то же, что с...» естественно передаёт сравнение и подразумеваемую общность участи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: קָלָם ... בָּאֵשׁ
  choice: которых ... изжарил в огне
  rationale: Piel глагола קלה имеет яркое значение «жарить, испекать»; «изжарил» сохраняет жестокую образность казни, тогда как более общее «сжёг» допустимо как лексическая альтернатива.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Характер высказывания יְשִׂמְךָ
  choice: 'пожелание-проклятие: «Пусть Яхве сделает...»'
  alternative: 'предсказание: «Яхве сделает...»'
  rationale: Контекст прямо называет последующую речь проклятием, а форма допускает волитивное понимание; поэтому русское «пусть» передаёт функцию формулы, не превращая её в прямое пророчество.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис сделан естественным, но сохранены формула проклятия, личное имя Яхве и резкая образность казни.
