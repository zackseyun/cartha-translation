  yaml_path: translation/ot/jeremiah/029/030.yaml
  text: Then the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: ru
  text: 'И было слово Яхве[a] к Иеремии:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон); традиционно передаётся как «Господь».'
