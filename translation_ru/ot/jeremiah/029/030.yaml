lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма продолжает повествовательную последовательность и входит в устойчивую пророческую формулу; краткое «И было» сохраняет её библейскую узнаваемость без архаического «и было так».
- source_word: דְּבַר
  choice: слово
  rationale: В формуле דְּבַר יְהוָה слово «слово» наиболее прозрачно передаёт еврейское выражение и не сужает его до одного лишь «сообщения».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶל
  choice: к
  rationale: Предлог указывает на адресата ниспосланного слова; в русской формуле естественно сочетание «слово ... к Иеремии».
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Использована традиционная русская форма имени Иеремия в дательном падеже.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском эту функцию естественнее передать пунктуационно, не добавляя тяжеловесного «говоря».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом; примечание сообщает традиционный вариант.
translation_notes:
  register: Современный литературный русский с сохранением краткой, торжественной пророческой формулы. «Лֵאמֹר» передано двоеточием как естественным русским способом ввести речь, которая следует в следующем стихе.
