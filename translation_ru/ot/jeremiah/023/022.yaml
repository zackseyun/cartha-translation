base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/022.yaml
  text: But if they had stood in my council[a], then they would have caused my people to hear my words, and they would have turned them from their evil way and from the evil of their deeds.
translation:
  language: ru
  text: Но если бы они были в Моём совете[a], то дали бы Моему народу услышать Мои слова и отвратили бы Мой народ от его злого пути и от зла его поступков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Моём тайном совете», «в Моём доверенном круге» или «в Моём замысле». Еврейское слово סוֹד может обозначать доверительный совет, близкий круг или сокровенный замысел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если бы
  rationale: В контексте союз выражает противопоставление лжепророков истинным пророкам; условная конструкция с «бы» передаёт нереальное условие.
- source_word: עָמְדוּ בְּסוֹדִי
  choice: присутствовали на Моём совете[a]
  rationale: Глагол עמד буквально означает «стоять», но в сочетании с סוֹד обозначает присутствие при совете; такой перевод естественен по-русски и сохраняет образ Божьего совета.
- source_word: וְיַשְׁמִעוּ דְבָרַי אֶת־עַמִּי
  choice: дали бы Моему народу услышать Мои слова
  rationale: Сохраняется каузативное значение породы хифиль глагола שׁמע — «дать услышать», а также множественное число существительного «слова».
- source_word: וִישִׁבוּם
  choice: отвратили бы его
  rationale: Каузативная форма שוב означает, что пророки побудили бы народ отвернуться от зла. Местоимение «его» согласовано с русским существительным «народ», хотя еврейский суффикс имеет множественное число и относится к людям народа.
- source_word: מִדַּרְכָּם הָרָע
  choice: от злого пути
  rationale: Сохранена еврейская метафора пути как образа поведения и прямое значение רַע — «злой».
- source_word: וּמֵרֹעַ מַעַלְלֵיהֶם
  choice: и от зла его поступков
  rationale: Перевод сохраняет различие между отвлечённым существительным «зло» и конкретными «поступками», не сводя выражение к одному определению.
theological_decisions:
- issue: Значение Божьего סוֹד
  choice: Мой совет
  alternative: Мой тайный совет; Мой замысел
  rationale: В пророческом контексте вероятен образ небесного совета, в присутствии которого истинный пророк слышит Божьи слова. Основной текст сохраняет этот образ, а сноска отмечает лексическую многозначность, не сводя её только к собранию или только к замыслу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конструкция «присутствовали на Моём совете» предпочтена буквальному, но неестественному по-русски «стояли в Моём совете»; каузативные значения двух глаголов сохранены.
