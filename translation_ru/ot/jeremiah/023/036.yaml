base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/036.yaml
  text: But you shall no longer mention ‘the burden of Yahweh,’ for each man's own word will become his burden[a], and you have twisted the words of the living God, Yahweh of hosts[b], our God.
translation:
  language: ru
  text: Но «бремя Яхве» больше не упоминайте, потому что бременем для каждого станет его собственное слово[b], и вы извратили слова живого Бога — Яхве Воинств, нашего Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское מַשָּׂא может означать и «бремя», и пророческое «изречение». Здесь, по-видимому, намеренно обыгрываются оба значения.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «бремя будет для каждого его словом». Вероятно, смысл в том, что собственные слова каждого обратятся для него бременем, а не будут истинным словом от Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: бремя
  rationale: 'Еврейское слово означает как тяжёлую ношу, так и пророческое изречение. Повтор слова «бремя» сохраняет намеренную игру значений: употребляемое людьми религиозное выражение оборачивается против них самих.'
- source_word: תִזְכְּרוּ ... לֹא ... עוֹד
  choice: больше не упоминайте
  rationale: При прямом объекте в виде цитируемого выражения глагол זכר означает не просто «помнить», а «упоминать»; сочетание с לֹא ... עוֹד передаёт запрет впредь так говорить.
- source_word: הַמַּשָּׂא יִהְיֶה לְאִישׁ דְּבָרוֹ
  choice: бременем для каждого станет его собственное слово
  rationale: Формулировка близко передаёт сжатую еврейскую конструкцию, сохраняет повтор מַשָּׂא и не устраняет двусмысленность между «бременем» и пророческим «изречением».
- source_word: וַהֲפַכְתֶּם
  choice: вы извратили
  rationale: В данном контексте הפך обозначает виновное искажение Божьих слов; «извратили» естественно и точно звучит в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняется образ צְבָאוֹת — воинств или войск — без истолковывающей замены словом «Всемогущий».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя, присутствующее в еврейском тексте.
- issue: Игра значений מַשָּׂא
  choice: «бремя» в обоих случаях
  alternative: «пророчество» или «изречение» в первом случае
  rationale: 'Одинаковый перевод сохраняет риторическую связь: чужое притязание на слово от Бога становится собственным бременем говорящего, не сводя многозначность к одному толкованию.'
- issue: Связь заключительной части стиха
  choice: сочинительное «и вы извратили»
  alternative: пояснительное «ведь вы извратили»
  rationale: Еврейский союз ו допускает контекстуальное пояснение, однако простое сочинение ближе к форме исходного текста и не усиливает причинную связь сверх явно сказанного.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Синтаксис оставлен достаточно близким к еврейскому, а двусмысленность ключевого слова вынесена в сноску.
