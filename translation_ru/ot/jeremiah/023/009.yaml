source:
  edition: WLC
  text: לַ/נְּבִאִ֞ים נִשְׁבַּ֧ר לִבִּ֣/י בְ/קִרְבִּ֗/י רָֽחֲפוּ֙ כָּל עַצְמוֹתַ֔/י הָיִ֨יתִי֙ כְּ/אִ֣ישׁ שִׁכּ֔וֹר וּ/כְ/גֶ֖בֶר עֲבָ֣ר/וֹ יָ֑יִן מִ/פְּנֵ֣י יְהוָ֔ה וּ/מִ/פְּנֵ֖י דִּבְרֵ֥י קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/009.yaml
  text: 'Concerning the prophets: my heart is broken within me[a]; all my bones tremble. I have become like a drunken man, like a strong man overcome by wine[c][b], because of Yahweh and because of his holy words.'
translation:
  language: ru
  text: 'О пророках[a]:


    Сердце моё разбито во мне,

    все кости мои содрогаются[b].


    Я стал как пьяный,

    как сильный мужчина, которого одолело вино,

    из-за Яхве и из-за Его святых слов[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Против пророков». Еврейский предлог может вводить тему пророчества; контекст допускает и более направленное прочтение.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «дрожат», «трепещут».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «пред Яхве и пред Его святыми словами». Здесь выражение понято как указывающее на причину потрясения пророка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַנְּבִאִים
  choice: О пророках
  rationale: Предлог לְ здесь естественно понимать как вводящий тему следующего пророчества. Вариант «Против пророков» возможен по контексту, но выражает направленность более определённо, чем сама форма.
- source_word: נִשְׁבַּר לִבִּי בְקִרְבִּי
  choice: Сердце моё разбито внутри меня
  rationale: Нифаль глагола שׁבר обозначает состояние сокрушённости или разбитости; перевод сохраняет как образ разбитого сердца, так и выражение בְקִרְבִּי.
- source_word: רָחֲפוּ כָּל עַצְמוֹתַי
  choice: все кости мои содрогаются
  rationale: רחף здесь передаёт дрожь или трепет всего тела. «Содрогаются» естественно звучит по-русски и сохраняет интенсивность образа.
- source_word: הָיִיתִי כְּאִישׁ שִׁכּוֹר
  choice: Я стал как пьяный
  rationale: Перфект הָיִיתִי описывает наступившее состояние. Субстантивированное «пьяный» ясно и естественно передаёт כְּאִישׁ שִׁכּוֹר без лишнего повторения слова «мужчина».
- source_word: וּכְגֶבֶר
  choice: как крепкий мужчина
  rationale: גֶּבֶר обозначает взрослого мужчину и может нести оттенок силы. «Крепкий мужчина» сохраняет этот оттенок и подчёркивает, что даже сильного человека вино лишило устойчивости.
- source_word: עֲבָרוֹ יָיִן
  choice: которого одолело вино
  rationale: Сочетание עבר с יין образно говорит о человеке, захваченном или пересиленном действием вина. «Одолело вино» передаёт смысл ясно и сохраняет олицетворённую силу образа.
- source_word: מִפְּנֵי יְהוָה
  choice: из-за Яхве
  rationale: 'מִפְּנֵי в данном контексте можно понимать причинно: состояние пророка вызвано Яхве и Его словами. Пространственное или реляционное прочтение «пред Яхве» сохранено в примечании.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом, что непосредственно отражает еврейский текст.
- source_word: דִּבְרֵי קָדְשׁוֹ
  choice: Его святых слов
  rationale: Сочетание существительных в сопряжённом состоянии естественно означает слова, принадлежащие Богу и отмеченные Его святостью; русский перевод сохраняет множественное число и притяжательное значение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Причина или положение перед Яхве
  choice: из-за Яхве и из-за Его святых слов
  alternative: пред Яхве и пред Его святыми словами
  rationale: Причинное прочтение מִפְּנֵי лучше связывает заключительную строку с физическим потрясением говорящего, однако грамматически возможный оттенок пребывания «пред» Богом не устранён и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтическим построчным оформлением. Сохранены телесные образы еврейского текста и нарастающее сравнение с опьянением; синтаксис сделан ясным без устранения неоднозначности предлогов לְ и מִפְּנֵי.
