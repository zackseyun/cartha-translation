base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/018.yaml
  text: For who has stood in the council of Yahweh[a], that he should see and hear his word? Who has paid attention to my word and heard it?
translation:
  language: ru
  text: Ибо кто стоял в совете Яхве[a], чтобы видеть и слышать Его слово? Кто внимал Моему слову и услышал его?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тайном совете Яхве» либо «в близком общении с Яхве». Еврейское слово סוֹד может обозначать как собрание или совет, так и доверительный, сокровенный круг общения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит риторическое обоснование предыдущего обвинения и сохраняет связь с контекстом.
- source_word: עָמַד
  choice: стоял
  rationale: Простое прошедшее время естественно передаёт совершённое пребывание или участие в совете.
- source_word: בְּסוֹד
  choice: в совете
  rationale: В пророческом контексте слово может обозначать собрание, допущенное к Божьему замыслу; при этом лексическая неоднозначность отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном.
- source_word: וְיֵרֶא וְיִשְׁמַע
  choice: чтобы видеть и слышать
  rationale: Сохраняет парные глаголы восприятия и естественно выражает цель или результат пребывания в совете.
- source_word: דְּבָרוֹ
  choice: Его слово
  rationale: Сохраняет пророческую и откровенную силу דָּבָר без сужения до значения «сообщение».
- source_word: הִקְשִׁיב
  choice: внимал
  rationale: Передаёт усиленное, внимательное слушание и отличает его от последующего простого «услышал».
- source_word: דְבָרִי
  choice: Моему слову
  rationale: Сохраняет переход к прямой речи Бога от первого лица и связь с предшествующим «Его слово».
- source_word: וַיִּשְׁמָע
  choice: и услышал его
  rationale: Продолжает мотив слышания; местоимение естественно проясняет объект в русском языке, не усиливая значение до «послушался».
theological_decisions:
- issue: Значение סוֹד יְהוָה
  choice: совет Яхве
  alternative: тайный совет Яхве; близкое общение с Яхве; тайна Яхве
  rationale: В полемике о подлинных пророках выражение, вероятно, рисует допуск к небесному совещанию, где пророк слышит Божье слово. Однако еврейское סוֹד допускает значения доверительной тайны и близкого совета, поэтому неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Повтор слова «слово» и переход от «Его» к «Моему» сохранены как в еврейском тексте.
