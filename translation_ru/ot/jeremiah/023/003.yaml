  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/אֲנִ֗י אֲקַבֵּץ֙ אֶת שְׁאֵרִ֣ית צֹאנִ֔/י מִ/כֹּל֙ הָ/אֲרָצ֔וֹת אֲשֶׁר הִדַּ֥חְתִּי אֹתָ֖/ם שָׁ֑ם וַ/הֲשִׁבֹתִ֥י אֶתְ/הֶ֛ן עַל נְוֵ/הֶ֖ן וּ/פָר֥וּ וְ/רָבֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/003.yaml
  text: And I myself will gather the remnant of my flock out of all the lands where I have driven them[a], and I will bring them back to their pasture[b], and they will be fruitful and multiply.
translation:
  language: ru
  text: А Я Сам соберу остаток Моего стада из всех стран, куда Я изгнал их[a], и возвращу их на их пастбища[b]; они будут плодиться и умножаться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «куда Я рассеял их». Еврейский глагол может означать принудительное удаление или рассеяние; вариант «изгнал» сохраняет силу Божьего суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в места их обитания» или «в их загоны». Еврейское слово может обозначать пастбище, жилище либо место покоя; «пастбища» соответствует образу стада.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А Я Сам
  rationale: Самостоятельное местоимение подчёркивает личное действие Бога; «Сам» передаёт эмфазу, а союз по контексту естественно выражен через «А».
- source_word: אֲקַבֵּץ
  choice: соберу
  rationale: Глагол קבץ обычно обозначает собирание рассеянных людей или стада и здесь вводит обещание восстановления.
- source_word: שְׁאֵרִית צֹאנִי
  choice: остаток Моего стада
  rationale: «Остаток» сохраняет характерный для пророческой речи смысл уцелевшей части, а «стадо» поддерживает пастушеский образ контекста.
- source_word: מִכֹּל הָאֲרָצוֹת
  choice: из всех стран
  rationale: Во множественном числе אֲרָצוֹת здесь обозначает территории и страны рассеяния; это естественнее по-русски, чем буквальное «земель».
- source_word: הִדַּחְתִּי
  choice: Я изгнал их
  rationale: Каузативная форма נדח указывает на то, что Бог заставил их удалиться. «Изгнал» ясно сохраняет Божественное действие и силу суда.
- source_word: וַהֲשִׁבֹתִי אֶתְהֶן
  choice: и возвращу их
  rationale: Каузатив שוב означает «сделать так, чтобы вернулись»; русское «возвращу» кратко и естественно передаёт это движение назад.
- source_word: עַל נְוֵיהֶן
  choice: на их пастбища
  rationale: נָוֶה может означать пастбище, место обитания или покоя. Во множественном числе и в образе стада «пастбища» наиболее естественно; עַל сохраняется как «на».
- source_word: וּפָרוּ וְרָבוּ
  choice: они будут плодиться и умножаться
  rationale: Устойчивая библейская пара сохраняет отзвук благословения о плодовитости и численном умножении.
theological_decisions:
- issue: Божественное действие в изгнании и восстановлении
  choice: Сохранить как прямое утверждение Бога о том, что Он изгнал стадо, так и Его обещание собрать и возвратить его.
  alternative: Смягчить действие Бога безличной формой «куда они были рассеяны».
  rationale: Еврейский текст прямо говорит «куда Я изгнал их»; перевод не должен устранять напряжение между Божьим судом и последующим восстановлением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Заглавные местоимения при обращении к Богу соответствуют принятой русской библейской традиции; конструкция остаётся ясной для широкого читателя.
