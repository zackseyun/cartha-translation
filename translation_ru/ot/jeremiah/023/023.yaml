lexical_decisions:
- source_word: הַאֱלֹהֵי מִקָּרֹב אָנִי
  choice: Разве Я Бог только вблизи
  rationale: Вопросительная ה образует риторический вопрос, а именная конструкция требует в русском естественного порядка слов. «Только» делает явным подразумеваемое ограничение, которое отрицает противопоставление «вблизи / вдали»; поскольку это смысловое уточнение, буквальная возможность отмечена в сноске.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана торжественно, но современно. Личное имя יהוה транслитерировано как «Яхве», а не заменено титулом.
- source_word: וְלֹא אֱלֹהֵי מֵרָחֹק
  choice: а не Бог и вдали
  rationale: Русское «а не» естественно передаёт контраст, а «и» выражает подразумеваемое риторическим вопросом включение дальней дали, не превращая Бога в «далёкого» в эмоциональном смысле.
theological_decisions:
- issue: Ограничена ли формулировка Божьей близостью или утверждает также Его присутствие вдали
  choice: Разве Я Бог только вблизи ... а не Бог и вдали?
  alternative: Разве Я Бог вблизи ... а не Бог вдали?
  rationale: Контекст и риторическая форма отрицают пространственную ограниченность Бога. При этом основной образ близости и дали сохранён без уточнения способа Божьего присутствия.
translation_notes:
  register: Современный литературный русский язык с dignified пророческой интонацией. Парные наречия «вблизи / вдали» сохраняют лаконизм и пространственный образ еврейского текста.
