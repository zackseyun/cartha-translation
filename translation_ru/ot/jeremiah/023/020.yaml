source:
  edition: WLC
  text: לֹ֤א יָשׁוּב֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַֽחֲרִית֙ הַ/יָּמִ֔ים תִּתְבּ֥וֹנְנוּ בָ֖/הּ בִּינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/020.yaml
  text: The anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart[c][b]. In the latter days you will understand it clearly.
translation:
  language: ru
  text: Гнев Яхве не обратится вспять[a], пока он не совершит этого и пока не осуществит замыслы своего сердца[b]. В последние дни[c] вы ясно это поймёте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не вернётся»; еврейский образ говорит о гневе Яхве, который не поворачивает назад, пока не исполнено его намерение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «намерения своего сердца».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «В грядущие дни»; буквально: «В конце дней».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף יְהוָה
  choice: гнев Яхве
  rationale: В сочетании с именем Бога אַף обозначает гнев, а не буквально «нос». Передача личного имени יהוה как «Яхве» сохраняет его отличие от титула «Господь».
- source_word: לֹא יָשׁוּב
  choice: не обратится вспять
  rationale: Сохраняет образ гнева, который не поворачивает назад и не отступает до исполнения намерения; не вводит более толковательное «не смягчится».
- source_word: עַד עֲשֹׂתוֹ
  choice: пока он не совершит этого
  rationale: Передаёт широкую, не уточняющую объект формулировку еврейского текста и завершённость действия.
- source_word: וְעַד הֲקִימוֹ מְזִמּוֹת לִבּוֹ
  choice: и пока не осуществит замыслы своего сердца
  rationale: В данной конструкции הקים означает привести намерения в исполнение. «Замыслы» сохраняет смысл обдуманных намерений без непременно отрицательного оттенка, а «сердце» — еврейский образ средоточия воли и намерения.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: В последние дни
  rationale: Сохраняет устойчивое пророческое выражение и его возможный эсхатологический оттенок, не сводя его просто к неопределённому будущему.
- source_word: תִּתְבּוֹנְנוּ בָהּ בִּינָה
  choice: вы ясно это поймёте
  rationale: Глагол понимания вместе с однокоренным существительным создаёт усиление; по-русски оно естественно передаётся наречием «ясно», без тяжеловесного буквального повтора.
theological_decisions:
- issue: Значение пророческого выражения בְּאַחֲרִית הַיָּמִים
  choice: В последние дни
  alternative: В грядущие дни
  rationale: Выбранный вариант удерживает напряжение между общим указанием на будущее и возможным указанием на конечный период истории, не навязывая узкой эсхатологической схемы.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой интонацией. Божественные местоимения даны со строчной буквы по нейтральной современной орфографической практике; личное имя יהוה передано как «Яхве».
