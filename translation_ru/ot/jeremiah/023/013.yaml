base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/013.yaml
  text: 'And among the prophets of Samaria I saw something offensive: they prophesied by Baal and led my people Israel astray[a][b].'
translation:
  language: ru
  text: 'Среди пророков Самарии Я видел нечто возмутительное[a]: они пророчествовали от имени Ваала[b] и сбивали с пути Мой народ — Израиль.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безумие» или «нечто ужасное». Еврейское слово обозначает нечто нравственно или религиозно недопустимое, вопиющее.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможны также переводы: «во имя Ваала», «для Ваала» или «в связи с Ваалом». Смысл в том, что они пророчествовали, ссылаясь на авторитет Ваала или выступая от его имени.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבִנְבִיאֵי שֹׁמְרוֹן
  choice: И у пророков Самарии
  rationale: Предлог ב обозначает сферу, в которой обнаружено осуждаемое явление; по-русски естественно «у пророков». Союз ו передан как «и», сохраняя связь с контекстом.
- source_word: רָאִיתִי
  choice: Я видел
  rationale: Перфект qal, 1-е лицо единственного числа; простое прошедшее время естественно передаёт сообщаемое наблюдение.
- source_word: תִפְלָה
  choice: нечто возмутительное
  rationale: Слово обозначает нравственно или религиозно недопустимое, вопиющее явление. «Возмутительное» сохраняет оценочную силу, не сводя смысл к интеллектуальной глупости.
- source_word: הִנַּבְּאוּ
  choice: они пророчествовали
  rationale: Стандартная передача hitpael глагола נבא, обозначающего пророческую деятельность.
- source_word: בַבַּעַל
  choice: именем Ваала
  rationale: 'Предлог ב здесь указывает на связь и основание пророческой деятельности: пророки выступали от имени Ваала или под его предполагаемой властью. Русское «именем» ясно выражает это без излишней конкретизации.'
- source_word: וַיַּתְעוּ
  choice: и вводили в заблуждение
  rationale: Hiphil от תעה имеет каузативное значение «заставлять блуждать, сбивать с пути». Выражение сохраняет смысл пагубного воздействия на народ.
- source_word: אֶת עַמִּי אֶת יִשְׂרָאֵל
  choice: Мой народ — Израиль
  rationale: 'Повтор показателя прямого дополнения вводит приложение: Израиль уточняет, кто является Божьим народом. Тире естественно передаёт это отношение в русском.'
theological_decisions:
- issue: Характер связи пророчествования с Ваалом в הִנַּבְּאוּ בַבַּעַל
  choice: они пророчествовали именем Ваала
  alternative: они пророчествовали через Ваала / для Ваала
  rationale: Формулировка передаёт, что их пророческая деятельность совершалась с притязанием на авторитет Ваала, не утверждая сверх того, что непосредственно выражено еврейским предлогом.
- issue: Нравственно-религиозная окраска תִפְלָה
  choice: нечто возмутительное
  alternative: безумие / нечто ужасное
  rationale: В контексте осуждается культовая и пророческая порочность, а не просто недостаток рассудительности. Выбранный вариант сохраняет сильную оценку и не устраняет широту значения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Прописные местоимения «Я», «Мой» обозначают говорящего Бога согласно распространённой русской библейской традиции. Синтаксис прямой и доступный; неоднозначность תִפְלָה и בַבַּעַל сохранена в сносках.
