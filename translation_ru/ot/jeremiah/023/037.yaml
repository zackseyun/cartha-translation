  text: כֹּ֥ה תֹאמַ֖ר אֶל הַ/נָּבִ֑יא מֶה עָנָ֣/ךְ יְהוָ֔ה וּ/מַה דִּבֶּ֖ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/037.yaml
  text: 'Thus you shall say to the prophet: ‘What has Yahweh answered you[a], and what has Yahweh spoken?’'
translation:
  language: ru
  text: 'Так скажи пророку: «Что ответил тебе Яхве и что сказал Яхве?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה
  choice: Так
  rationale: Наречие вводит предписанную формулу речи; «так» кратко, естественно и сохраняет указательную силу.
- source_word: תֹאמַר
  choice: скажи
  rationale: Имперфект в предписывающем значении естественно передаётся русским повелительным наклонением.
- source_word: אֶל הַנָּבִיא
  choice: пророку
  rationale: Сохраняется единственное число; русский дательный падеж естественно выражает адресата речи.
- source_word: מֶה עָנָךְ
  choice: что ответил тебе
  rationale: מֶה передано вопросительным «что», а перфект ענה — завершённым действием «ответил»; суффикс второго лица женского рода по форме в русском местоимении не маркируется.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: וּמַה דִּבֶּר
  choice: и что сказал
  rationale: Сохраняются координация двух вопросов и различие между ענה «ответить» и דבר «сказать/говорить»; «сказал» здесь естественнее буквального «говорил».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Пол адресата в עָנָךְ
  choice: не уточнять сверх формы «тебе»
  alternative: явно обозначить адресата как женщину
  rationale: Суффикс формально относится ко второму лицу женского рода, однако русский вариант «тебе» сохраняет это без навязанного уточнения; контекст и необычная форма допускают текстологическую или грамматическую напряжённость.
translation_notes:
  register: Современный литературный русский язык, краткий и dignified библейский регистр без архаизмов. Прямой вопрос и повтор имени «Яхве» сохранены.
