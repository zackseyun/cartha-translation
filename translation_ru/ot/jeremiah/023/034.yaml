  yaml_path: translation/ot/jeremiah/023/034.yaml
  text: And as for the prophet[a], the priest, or the people who say, “The burden of Yahweh,” I will punish that man and his household.
translation:
  language: ru
  text: 'Если пророк, священник или кто-либо из народа скажет: «Бремя Яхве»[a], — Я накажу этого человека и его домашних.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пророческое изречение Яхве». Еврейское слово massa может означать «изречение», но здесь Иеремия, по-видимому, обыгрывает его буквальный смысл — «бремя, ноша».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: пророк
  rationale: Обычный и точный современный эквивалент נָבִיא; определённость передаётся контекстом условно-распределительной конструкции.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Стандартный эквивалент כֹּהֵן, естественный для современного литературного русского языка.
- source_word: הָעָם אֲשֶׁר יֹאמַר
  choice: кто-нибудь из народа скажет
  rationale: Еврейская форма יֹאמַר стоит в единственном числе и указывает на отдельного нарушителя; такая передача естественно согласуется с последующим הָאִישׁ הַהוּא — «этого человека».
- source_word: מַשָּׂא יְהוָה
  choice: Бремя Яхве
  rationale: מַשָּׂא может означать пророческое изречение, но в Иер 23:33–40 намеренно актуализирован буквальный смысл «бремя, ноша»; он сохраняет словесную игру и обличительную силу контекста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: וּפָקַדְתִּי עַל
  choice: Я накажу
  rationale: В данном контексте פקד על обозначает карающее взыскание; «накажу» ясно и непосредственно передаёт смысл.
- source_word: הָאִישׁ הַהוּא
  choice: этого человека
  rationale: Передаёт указательность и индивидуальную направленность приговора, не ограничивая русский текст исключительно мужским полом там, где формулировка действует распределительно.
- source_word: בֵּיתוֹ
  choice: его дом
  rationale: '«Дом» сохраняет библейскую социальную широту בַּיִת: семью и всё домашнее хозяйство, а не только здание.'
theological_decisions:
- issue: Передача מַשָּׂא יְהוָה в полемике Иеремии
  choice: «Бремя Яхве» в основном тексте
  alternative: «Пророчество Яхве» или «изречение Яхве»
  rationale: В других местах מַשָּׂא может быть техническим обозначением пророчества, однако здесь контекст строится на его буквальном значении «бремя». Основной текст сохраняет эту напряжённость, а сноска отмечает лексическую альтернативу.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация передаёт личное имя и не смешивает его с титулом אֲדֹנָי.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Условная конструкция «если же» естественно выражает распределительный смысл еврейского перечисления, а «дом» сохраняет семейно-хозяйственное значение исходного слова.
