source:
  edition: WLC
  text: בְּ/יָמָי/ו֙ תִּוָּשַׁ֣ע יְהוּדָ֔ה וְ/יִשְׂרָאֵ֖ל יִשְׁכֹּ֣ן לָ/בֶ֑טַח וְ/זֶה שְּׁמ֥/וֹ אֲֽשֶׁר יִקְרְא֖/וֹ יְהוָ֥ה צִדְקֵֽ/נוּ־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/006.yaml
  text: 'In his days Judah will be saved[a], and Israel will dwell securely[b]; and this is the name by which he will be called: Yahweh Is Our Righteousness.'
translation:
  language: ru
  text: 'В его дни Иуда будет спасён, а Израиль будет жить в безопасности; и вот имя, которым его назовут: «Яхве — наша праведность»[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Яхве, наша праведность». В еврейской формуле имени глагол-связка отсутствует.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наша справедливость». Еврейское слово может обозначать как праведность, так и справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: В его дни
  rationale: Буквально передаёт еврейское выражение и в контексте указывает на дни обещанного праведного Потомка — царя.
- source_word: תִּוָּשַׁע
  choice: будет спасён
  rationale: Нифаль глагола ישׁע означает «быть спасённым, избавленным». Формулировка не сужает смысл исключительно до военного или духовного спасения.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: будет жить в безопасности
  rationale: Естественно по-русски передаёт как продолжительное, устойчивое проживание, так и состояние защищённости.
- source_word: וְזֶה שְּׁמוֹ אֲשֶׁר יִקְרְאוֹ
  choice: и вот имя, которым его назовут
  rationale: Сохраняет формулу наречения имени. Пассивная конструкция естественна по-русски и не вводит определённого субъекта там, где еврейский текст его не называет.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: צִדְקֵנוּ
  choice: наша праведность
  rationale: Сохраняет широкий смысл צדק, включающий праведность, правоту и справедливость; в формуле имени «праведность» звучит естественно и не ограничивает значение одной лишь судебной справедливостью.
theological_decisions:
- issue: Синтаксис имени יְהוָה צִדְקֵנוּ
  choice: «Яхве — наша праведность»
  alternative: «Яхве, наша праведность»
  rationale: В еврейской именной формуле связка отсутствует. Тире в основном тексте естественно выражает возможное предикативное прочтение, а сноска сохраняет возможность понимать выражение как имя-приложение без явно выраженной связки.
- issue: Значение צֶדֶק в царском и заветном контексте
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» лучше сохраняет заветную и нравственную широту слова, но вариант «справедливость» отмечен, поскольку судебно-общественный оттенок в контексте правления также возможен.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранены параллелизм «Иуда — Израиль», формула наречения имени и смысловая неоднозначность заключительного титула.
