source:
  edition: WLC
  text: וְ/אִם מַשָּׂ֣א יְהוָה֮ תֹּאמֵרוּ֒ לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֧עַן אֲמָרְ/כֶ֛ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה מַשָּׂ֣א יְהוָ֑ה וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תֹאמְר֖וּ מַשָּׂ֥א יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/038.yaml
  text: 'But if you say[a], ‘The burden of Yahweh,’ therefore this is what Yahweh says: Because you have said this word, ‘The burden of Yahweh,’ though I sent to you, saying, ‘You shall not say, “The burden of Yahweh,”’'
translation:
  language: ru
  text: 'Если же вы скажете: «Бремя[a] Яхве», — то так говорит Яхве: за то, что вы произнесли эту фразу: «Бремя Яхве», хотя Я посылал к вам и говорил: «Не говорите: „Бремя Яхве“», —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пророчество Яхве». Еврейское слово «масса» может означать пророческое изречение, но также значит «бремя»; этот перевод сохраняет игру слов.'
    reason: Лексическая альтернатива и сохранение многозначности מַשָּׂא.
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Передаёт условие и одновременно противопоставление предшествующему запрету; по-русски звучит естественно.
- source_word: מַשָּׂא
  choice: бремя
  rationale: Слово может обозначать как тяжёлую ношу, так и пророческое изречение. «Бремя» сохраняет повтор и игру слов, существенные для контекста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохраняет традиционную формулу пророческого вестника и её торжественную краткость.
- source_word: אֲמָרְכֶם אֶת הַדָּבָר הַזֶּה
  choice: вы произнесли эти слова
  rationale: В данном контексте הַדָּבָר указывает на конкретное повторяемое выражение; русское множественное число естественно обозначает цитируемую фразу.
- source_word: וָאֶשְׁלַח אֲלֵיכֶם לֵאמֹר
  choice: хотя Я посылал к вам сказать
  rationale: 'Союзная связь в контексте имеет уступительный оттенок: люди произносили запрещённую формулу вопреки ранее переданному предостережению.'
- source_word: לֹא תֹאמְרוּ
  choice: Не говорите
  rationale: Прямо и естественно передаёт запрет, обращённый ко множеству слушателей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет отличие имени от титула.
- issue: Передача מַשָּׂא в полемическом контексте
  choice: бремя
  alternative: пророчество; изречение
  rationale: Выбор сохраняет смысл тяжести и повторяющуюся игру слов, не исключая технического значения «пророческое изречение», указанного в сноске.
- issue: Незавершённый синтаксис стиха
  choice: сохранить продолжение фразы при помощи конечного тире
  alternative: завершить фразу как самостоятельное предложение
  rationale: В еврейском тексте условно-причинная конструкция получает продолжение в следующем стихе; искусственное завершение здесь сгладило бы структуру оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор ключевой формулы сохранён без стилистического разнообразия, поскольку он риторически значим. Конечное тире показывает, что синтаксическая конструкция продолжается в следующем стихе.
