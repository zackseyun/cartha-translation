  source_fidelity: 'Основной смысл передан верно: сохранены условное «если же», повтор формулы «бремя Яхве», причинное основание и ссылка на прежний запрет. Однако אֶת־הַדָּבָר הַזֶּה стоит в единственном числе; «эту фразу» точнее и естественнее, чем «эти слова».'
