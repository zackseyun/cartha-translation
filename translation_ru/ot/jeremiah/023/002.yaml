  variant: modern literary Russian
source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עַֽל הָ/רֹעִים֮ הָ/רֹעִ֣ים אֶת עַמִּ/י֒ אַתֶּ֞ם הֲפִצֹתֶ֤ם אֶת צֹאנִ/י֙ וַ/תַּדִּח֔וּ/ם וְ/לֹ֥א פְקַדְתֶּ֖ם אֹתָ֑/ם הִנְ/נִ֨י פֹקֵ֧ד עֲלֵי/כֶ֛ם אֶת רֹ֥עַ מַעַלְלֵי/כֶ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/002.yaml
  text: 'Therefore this is what Yahweh[a], the God of Israel, says concerning the shepherds who shepherd my people: You have scattered my flock and driven them away, and you have not attended to them. Behold, I am about to attend to you for the evil of your deeds[b], declares Yahweh.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве, Бог Израиля, о пастырях[a], пасущих Мой народ: «Вы рассеяли Моё стадо, разогнали его и не позаботились о нём. Вот, Я взыщу с вас[b] за зло ваших поступков, — возвещает Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против пастырей». Еврейский предлог может вводить пророчество, направленное против тех, к кому оно обращено.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте здесь повторён тот же глагол, что и выше: «вы не позаботились о нём… Я взыщу с вас». Этот повтор создаёт намеренный переворот: пастыри не исполнили своего долга перед стадом, и теперь Бог обратится к ним с судом.'
    reason: wordplay
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Естественная передача сопряжённой конструкции, указывающей на отношение Яхве к Израилю.
- source_word: עַל
  choice: о
  rationale: Вводит предмет пророчества; возможный в данном контексте враждебный оттенок «против» отмечен в сноске.
- source_word: הָרֹעִים הָרֹעִים אֶת עַמִּי
  choice: пастырях, пасущих Мой народ
  rationale: Сохраняет пастушескую метафору и однокоренной повтор еврейского текста, не подменяя образ толкованием «руководители».
- source_word: הֲפִצֹתֶם
  choice: рассеяли
  rationale: Точно и естественно передаёт каузативное действие применительно к стаду.
- source_word: צֹאנִי
  choice: Моё стадо
  rationale: Передаёт собирательное значение и сохраняет центральный пастушеский образ.
- source_word: וַתַּדִּחוּם
  choice: разогнали его
  rationale: Передаёт причинение удаления стада и естественно сочетается с образом пастырей.
- source_word: וְלֹא פְקַדְתֶּם אֹתָם
  choice: не позаботились о нём
  rationale: В первом контексте פקד обозначает должное внимание и попечение пастырей о стаде.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет торжественный пророческий указатель на близкое и решительное действие Бога.
- source_word: פֹקֵד עֲלֵיכֶם
  choice: взыщу с вас
  rationale: Естественно выражает карательный смысл פקד в этом контексте; повтор еврейского глагола и намеренный смысловой переворот отмечены в сноске.
- source_word: אֶת רֹעַ מַעַלְלֵיכֶם
  choice: за зло ваших поступков
  rationale: Сохраняет еврейскую конструкцию и прямо называет нравственное основание суда.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Достоинная и понятная передача устойчивой пророческой формулы.
theological_decisions:
- issue: Повтор פקד в обвинении пастырей и в объявлении суда
  choice: Передать по смыслу как «не позаботились» и «взыщу», пояснив повтор в сноске.
  alternative: Сохранить один русский глагол в обеих частях, например «не занимались ими… займусь вами».
  rationale: Разные русские соответствия ясно передают заботу в первой части и наказание во второй; сноска сохраняет видимой намеренную двусмысленность и риторический переворот оригинала, не придавая основному тексту разговорного оттенка.
- issue: Образ пастырей
  choice: Сохранить «пастыри», а не истолковывать как «вожди» или «правители».
  alternative: Передать непосредственно как «руководители» или «правители».
  rationale: Пастушеская метафора определяет весь контекст и одновременно оставляет открытым точный круг ответственных лиц.
- issue: Направленность пророчества при עַל
  choice: 'Основной текст: «о пастырях»; вариант «против пастырей» дан в сноске.'
  alternative: «Против пастырей».
  rationale: Предлог допускает как тематическое, так и враждебно направленное понимание; последующий приговор ясно показывает обличительный характер речи, а сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. «Пастыри» сохранено как традиционно понятное, но не архаичное в библейском контексте образное обозначение; формы «Моё», «Я» оформлены с прописной буквы согласно русской религиозно-издательской практике.
