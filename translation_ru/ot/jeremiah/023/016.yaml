  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת אַֽל תִּשְׁמְע֞וּ עַל דִּבְרֵ֤י הַ/נְּבִאִים֙ הַ/נִּבְּאִ֣ים לָ/כֶ֔ם מַהְבִּלִ֥ים הֵ֖מָּה אֶתְ/כֶ֑ם חֲז֤וֹן לִבָּ/ם֙ יְדַבֵּ֔רוּ לֹ֖א מִ/פִּ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/016.yaml
  text: 'Thus says Yahweh of hosts: Do not listen to the words of the prophets who prophesy to you; they are deluding you. They speak a vision of their own heart[a], not from the mouth of Yahweh.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Не слушайте слов пророков, которые пророчествуют вам: они вводят вас в заблуждение[a]. Они возвещают видение собственного сердца, а не то, что исходит из уст Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «они делают вас пустыми (тщетными)». Еврейский глагол выражает мысль о том, что человека приводят к пустоте или обманывают пустыми заверениями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя Бога и широкий смысл титула «Воинств», не сужая его до одних земных армий.
- source_word: אַל תִּשְׁמְעוּ עַל דִּבְרֵי
  choice: Не слушайте слов
  rationale: Естественно передаёт запрет внимать словам пророков, сохраняя множественное число דִּבְרֵי.
- source_word: הַנְּבִאִים הַנִּבְּאִים לָכֶם
  choice: пророков, которые пророчествуют вам
  rationale: Сохраняет однокоренную игру существительного и причастия в еврейском тексте и прямую направленность речи к слушателям.
- source_word: מַהְבִּלִים הֵמָּה אֶתְכֶם
  choice: они вводят вас в заблуждение
  rationale: Передаёт каузативный смысл глагола от הבל — приводить к пустоте, обманывать пустыми утверждениями — без чрезмерно буквального и неясного русского оборота.
- source_word: חֲזוֹן לִבָּם
  choice: видение собственного сердца
  rationale: Сохраняет единственное число «видение» и библейский образ сердца как внутреннего источника мыслей и желаний.
- source_word: יְדַבֵּרוּ
  choice: возвещают
  rationale: В контексте пророческой речи «возвещают» естественно передаёт публичное произнесение сообщения.
- source_word: לֹא מִפִּי יְהוָה
  choice: а не то, что исходит из уст Яхве
  rationale: Сохраняет конкретный образ «из уст Яхве» и одновременно делает синтаксическую связь ясной по-русски.
theological_decisions:
- issue: Воздействие ложных пророков на слушателей
  choice: они вводят вас в заблуждение
  alternative: они внушают вам пустые надежды; они делают вас тщетными
  rationale: Глагол מַהְבִּלִים связан с пустотой и тщетой, но здесь характеризует обманчивое воздействие пророков. Выбранный вариант не уточняет без необходимости, идёт ли речь именно о надеждах, и сохраняет предостережение от ложной речи.
- issue: Источник ложного видения
  choice: видение собственного сердца
  alternative: видение собственного разума
  rationale: «Сердце» сохраняет исходную антропологическую метафору и противопоставляет внутренне порождённое видение слову, исходящему из уст Яхве.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Сохранены имя «Яхве», титул «Воинств» и образ речи, исходящей из Божьих уст; тяжеловесные кальки смягчены там, где они затемняли бы смысл.
