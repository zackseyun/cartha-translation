lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательное слово, вводящее внезапное и живое возвещение, естественно для современного русского языка.
- source_word: סַעֲרַת יְהוָה
  choice: буря Яхве
  rationale: 'Сохраняет образ сильной бури и конструкцию принадлежности или происхождения: буря принадлежит Яхве либо исходит от Него.'
- source_word: חֵמָה
  choice: Его ярость
  rationale: Существительное обозначает ярость, гнев в контексте суда. Местоимение ясно связывает ярость с Яхве; отдельное предложение отражает масоретическое членение, не превращая слово безоговорочно в наречное «в ярости».
- source_word: יָצְאָה
  choice: уже вырвалась
  rationale: Глагол буквально означает «вышла». «Вырвалась» естественно сочетается с яростью и образом бури, а «уже» передаёт совершенный вид как пророческое изображение несомненного суда, уже пришедшего в движение.
- source_word: וְסַעַר מִתְחוֹלֵל
  choice: бушующий вихрь
  rationale: Передаёт добавочное, пояснительное описание бури. «Бушующий» выражает бурное вращательное движение причастия, не перегружая русскую фразу повтором.
- source_word: עַל רֹאשׁ רְשָׁעִים
  choice: на головы нечестивых
  rationale: Еврейское единственное «голову» имеет собирательный смысл при множественном «нечестивых»; русское множественное число ясно и естественно передаёт распределительный смысл.
- source_word: יָחוּל
  choice: обрушится
  rationale: В контексте бури глагол описывает её неистовое движение и удар по нечестивым. «Обрушится» естественно передаёт результат, тогда как возможное «закружится» теснее сохраняет повтор корня с מִתְחוֹלֵל.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя Бога. Транслитерация сохраняет непосредственную референцию и не заменяет имя титулом.
- issue: Временной аспект יָצְאָה
  choice: уже вырвалась
  alternative: вырвется
  rationale: Еврейский перфект представляет грядущий суд как несомненный и уже пришедший в действие; русская форма прошедшего времени с «уже» сохраняет эту пророческую напряжённость.
- issue: Синтаксическая связь חֵמָה
  choice: Его ярость уже вырвалась
  alternative: буря Яхве вырвалась в ярости
  rationale: Масоретическое членение допускает чтение «Вот буря Яхве! Ярость вышла…». Выбранный вариант сохраняет самостоятельную силу существительного «ярость», не исключая смысловой связи ярости с бурей.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой образностью. Короткие фразы сохраняют внезапность предупреждения; архаизмы не используются.
