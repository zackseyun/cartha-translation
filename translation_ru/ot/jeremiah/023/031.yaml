  yaml_path: translation/ot/jeremiah/023/031.yaml
  text: Behold[a], I am against the prophets, declares Yahweh, who take their own tongues and declare, ‘Declaration!’
translation:
  language: ru
  text: 'Вот, Я против пророков, — возвещает Яхве, — которые пользуются своим языком и возвещают: «Изречение!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к буквальному: «которые берут свой язык и возвещают: „Изречение!“» Еврейская фраза кратка и, вероятно, иронична: пророки выдают собственную речь за авторитетное пророческое слово.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי עַל
  choice: Вот, Я против
  rationale: Сочетание вводит торжественное и emphatic божественное заявление о противостоянии и суде; «против» передаёт идиому, а не пространственное значение предлога.
- source_word: הַנְּבִיאִים
  choice: пророков
  rationale: В самом стихе нет определения «ложных», хотя контекст ясно обличает этих пророков; перевод не добавляет отсутствующего обозначения.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу авторитетной речи и сохраняет личное имя יהוה.
- source_word: הַלֹּקְחִים לְשׁוֹנָם
  choice: которые пускают в ход свой язык
  rationale: Буквальное «берут свой язык» по-русски неестественно. Идиома «пускают в ход» сохраняет образ намеренного использования собственного языка и подчёркивает, что речь исходит от них самих.
- source_word: וַיִּנְאֲמוּ נְאֻם
  choice: 'и говорят: «Таково изречение!»'
  rationale: Еврейский текст намеренно повторяет один корень и звучит кратко, формульно и, вероятно, иронически. Русская формулировка сохраняет притязание пророков на авторитетное пророческое слово, хотя корневой повтор полностью воспроизвести естественно нельзя.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное имя без замены титулом.
- issue: Называть ли пророков ложными
  choice: пророков
  alternative: лжепророков; ложных пророков
  rationale: Контекст показывает их ложность, но данный стих говорит только «пророки»; добавление определения сняло бы сохраняемую оригиналом формальную неоднозначность.
- issue: Понимание заключительного נְאֻם
  choice: 'формульное притязание: «Таково изречение!»'
  alternative: «возвещает Яхве»; «изречение»
  rationale: Одиночное נְאֻם не содержит имени Яхве, поэтому его не следует дописывать в основной текст. Резкая именная формула, вероятно, иронически изображает изготовление авторитетно звучащего пророчества.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. «Вот» сохраняет силу вводной формулы; «пускают в ход свой язык» естественнее буквального «берут свой язык», но удерживает конкретный образ и оттенок сознательной манипуляции. Маркер [a] помещён после спорной заключительной формулы.
