  text: וְ/נָתַתִּ֥י עֲלֵי/כֶ֖ם חֶרְפַּ֣ת עוֹלָ֑ם וּ/כְלִמּ֣וּת עוֹלָ֔ם אֲשֶׁ֖ר לֹ֥א תִשָּׁכֵֽחַ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/040.yaml
  text: And I will put on you everlasting reproach and everlasting disgrace[a], which will not be forgotten.
translation:
  language: ru
  text: И Я навлеку на вас вечное поношение и вечный позор[a], который не забудется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непрестанное поношение и непрестанный позор». Еврейское עוֹלָם в зависимости от контекста может обозначать как вечность, так и неопределённо долгую, непрекращающуюся длительность.'
    reason: Лексическая альтернатива для עוֹלָם.
lexical_decisions:
- source_word: וְנָתַתִּי עֲלֵיכֶם
  choice: И Я навлеку на вас
  rationale: Сочетание נתן с עַל и отвлечёнными существительными выражает возложение на адресатов позора и поношения. Русское «навлеку на вас» естественно передаёт причинительный смысл, не добавляя нового содержания.
- source_word: חֶרְפַּת
  choice: поношение
  rationale: חֶרְפָּה обозначает поношение, поругание и публичное бесчестье. «Поношение» сохраняет оттенок общественного осмеяния и отличается от следующего слова «позор».
- source_word: עוֹלָם
  choice: вечное / вечный
  rationale: В данном пророчестве о суде עוֹלָם указывает на непреходящую либо неопределённо долгую продолжительность. «Вечный» передаёт торжественную силу предупреждения; возможный оттенок длительной непрерывности отмечен в сноске.
- source_word: וּכְלִמּוּת
  choice: и вечный позор
  rationale: כְּלִמּוּת означает позор, унижение или бесчестье. «Позор» звучит естественно в современном русском и не сливается полностью по значению с «поношением».
- source_word: אֲשֶׁר לֹא תִשָּׁכֵחַ
  choice: который не забудется
  rationale: Относительная частица вводит определительное придаточное, а форма нифаля תִשָּׁכֵחַ имеет пассивное значение «быть забытым». Женский род в еврейском согласован с כְּלִמּוּת; в русском ближайший эквивалент «позор» требует мужского рода.
theological_decisions:
- issue: Значение עוֹלָם в пророчестве о суде
  choice: вечное / вечный
  alternative: непрестанное / непрестанный; долговечное / долговечный
  rationale: Основной текст сохраняет максимальную силу עוֹלָם и не смягчает предупреждение. При этом сноска отмечает реальную лексическую возможность значения неопределённо долгой или непрестанной длительности, не превращая перевод в догматическое толкование.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. «Навлеку на вас» естественно передаёт еврейскую конструкцию без тяжеловесного буквального «положу на вас»; пара «поношение — позор» сохраняет различие двух близких понятий.
