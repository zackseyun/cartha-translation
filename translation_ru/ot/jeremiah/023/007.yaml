source:
  edition: WLC
  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹא יֹ֤אמְרוּ עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/007.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when they will no longer say, ‘As Yahweh lives, who brought up the sons of Israel from the land of Egypt,’
translation:
  language: ru
  text: 'Поэтому вот, наступают дни, — возвещает Яхве, — когда уже не будут говорить: «Жив Яхве, который вывел сынов Израиля из земли Египта»,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сыны Израиля» — то есть израильтяне, народ Израиля.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт выводное значение связки и сохраняет логическую связь с предшествующим контекстом.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательно-эмфатическую силу пророческой формулы и звучит естественно в современном литературном русском.
- source_word: יָמִים בָּאִים
  choice: наступают дни
  rationale: Естественная русская передача устойчивой пророческой формулы о грядущем времени.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную формулу пророческого изречения; «возвещает» точнее отражает נְאֻם, чем нейтральное «говорит».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: וְלֹא יֹאמְרוּ עוֹד
  choice: когда уже не будут говорить
  rationale: «Уже не» естественно передаёт отрицание с עוֹד как прекращение прежней речевой формулы; неопределённый субъект сохранён.
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Традиционная и узнаваемая русская форма древнееврейской клятвенной формулы.
- source_word: אֲשֶׁר הֶעֱלָה
  choice: Который вывел
  rationale: В контексте исхода каузатив עלה означает вывести народ из страны; буквальное «поднял» по-русски здесь вводило бы в заблуждение.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально сохраняет мужской образ еврейского выражения и его библейскую узнаваемость; идиоматическое значение пояснено в сноске.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Сохраняет упоминание земли, важное для повествования об исходе, в естественной возвышенной русской формулировке.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Объём значения выражения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; народ Израиля
  rationale: Основной текст сохраняет форму исходного выражения, не исключая при этом его обычного собирательного значения — всего народа Израиля, что отмечено в сноске.
- issue: Характер формулы חַי יְהוָה
  choice: Жив Яхве
  alternative: Клянусь жизнью Яхве; так же верно, как жив Яхве
  rationale: Краткая формула сохраняет подлинную форму и торжественное напряжение клятвы, не разворачивая её толкование непосредственно в тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Сохранены формулы «вот», «возвещает Яхве» и «Жив Яхве», но синтаксис остаётся понятным обычному читателю. Знак сноски поставлен после завершённой цитаты.
