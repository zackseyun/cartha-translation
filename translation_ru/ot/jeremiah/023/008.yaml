  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י אִם חַי יְהוָ֗ה אֲשֶׁ֣ר הֶעֱלָה֩ וַ/אֲשֶׁ֨ר הֵבִ֜יא אֶת זֶ֨רַע בֵּ֤ית יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ צָפ֔וֹנָ/ה וּ/מִ/כֹּל֙ הָֽ/אֲרָצ֔וֹת אֲשֶׁ֥ר הִדַּחְתִּ֖י/ם שָׁ֑ם וְ/יָשְׁב֖וּ עַל אַדְמָתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/008.yaml
  text: but[a], ‘As Yahweh lives[d][c][b], who brought up and who brought in the offspring of the house of Israel from the land of the north and from all the lands where I had driven them,’ and they shall dwell on their own soil.
translation:
  language: ru
  text: 'но будут говорить: «Жив Яхве[a], который вывел и привёл потомков дома Израиля из северной земли и из всех земель, куда Я изгнал их», — и они будут жить на своей земле[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Жив Яхве» — древнееврейская формула клятвы. Имя «Яхве» передаёт יהוה; традиционный вариант: «жив Господь».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «на своей почве»; то есть на собственной, родной земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: но
  rationale: В связи с предыдущим стихом оборот вводит новую формулу клятвы взамен прежней; русское «но» естественно продолжает незавершённое противопоставление.
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Устойчивая и торжественная русская передача древнееврейской формулы клятвы; имя יהוה передано транслитерацией «Яхве».
- source_word: הֶעֱלָה וַאֲשֶׁר הֵבִיא
  choice: который вывел и привёл
  rationale: 'Сохраняются два разных глагола и двойной образ: избавление из рассеяния и возвращение на родину. Буквальное «поднял» здесь по-русски не передаёт естественно исходный смысл.'
- source_word: זֶרַע בֵּית יִשְׂרָאֵל
  choice: потомков дома Израиля
  rationale: זֶרַע имеет коллективное значение «потомство, потомки»; «потомки» понятно современному читателю, а «дом Израиля» сохраняет библейское национально-родовое обозначение.
- source_word: מֵאֶרֶץ צָפוֹנָה
  choice: из северной земли
  rationale: Передаёт как географический образ севера, так и существительное «земля», не превращая его в современное политическое понятие «страна».
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: куда Я изгнал их
  rationale: Русское «куда» естественно выражает направленность рассеяния; «изгнал» сохраняет каузативную силу формы, а прошедшее время достаточно ясно обозначает предшествующее действие.
- source_word: וְיָשְׁבוּ
  choice: и они будут жить
  rationale: В контексте обещанного восстановления форма выражает будущее проживание; «жить» современнее и естественнее, чем архаизирующее «обитать».
- source_word: עַל אַדְמָתָם
  choice: на своей земле
  rationale: אֲדָמָה буквально указывает на почву, землю; по-русски «на своей земле» естественно сохраняет территориальный и родной оттенок.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное божественное имя, а не титул; транслитерация сохраняет это различие без внесения конфессионального толкования.
- issue: Образы нового исхода и возвращения
  choice: 'сохранить два действия: «вывел и привёл»'
  alternative: объединить как «возвратил»
  rationale: Два еврейских глагола удерживают напряжение между избавлением из мест рассеяния и приведением обратно; объединение сделало бы образ беднее.
- issue: Смена формулы клятвы относительно стиха 7
  choice: начать с «но»
  alternative: «но будут говорить» или «напротив»
  rationale: Стих синтаксически продолжает предыдущее предложение; краткое «но» сохраняет зависимость от контекста и не добавляет отсутствующий здесь глагол речи.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Сохранена синтаксическая связь со стихом 7, поэтому стих начинается с «но». Избегнуты как ненужная архаизация, так и толковательное расширение.
