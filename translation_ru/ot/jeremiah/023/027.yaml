source:
  edition: WLC
  text: הַ/חֹשְׁבִ֗ים לְ/הַשְׁכִּ֤יחַ אֶת עַמִּ/י֙ שְׁמִ֔/י בַּ/חֲל֣וֹמֹתָ֔/ם אֲשֶׁ֥ר יְסַפְּר֖וּ אִ֣ישׁ לְ/רֵעֵ֑/הוּ כַּ/אֲשֶׁ֨ר שָׁכְח֧וּ אֲבוֹתָ֛/ם אֶת שְׁמִ֖/י בַּ/בָּֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/027.yaml
  text: who plan to make my people forget my name by their dreams that they tell[a], each man to his neighbor[b], just as their fathers forgot my name because of Baal.
translation:
  language: ru
  text: которые замышляют заставить Мой народ забыть Моё имя с помощью своих снов, которые каждый из них рассказывает своему ближнему[a], — подобно тому как их отцы забыли Моё имя из-за Ваала[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своих снах». Еврейский предлог может указывать как на средство, так и на сферу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ради Ваала» или «посредством Ваала». Вероятно, имеется в виду, что почитание Ваала привело их к забвению Моего имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹשְׁבִים
  choice: которые замышляют
  rationale: Причастие от חשׁב в контексте обличения лжепророков передаёт намерение и сознательный замысел, а не просто мыслительный процесс.
- source_word: לְהַשְׁכִּיחַ
  choice: заставить … забыть
  rationale: Порода хифиль придаёт глаголу שׁכח каузативное значение; такая формулировка естественно передаёт его по-русски.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Сохранено прямо выраженное притяжательное значение и заветный характер сочетания.
- source_word: שְׁמִי
  choice: Моё имя
  rationale: Буквальное соответствие сохраняет библейское содержание имени как явленной идентичности Бога, не заменяя его толкованием.
- source_word: בַּחֲלֹמוֹתָם
  choice: с помощью снов
  rationale: Предлог ב может обозначать средство или сферу; в данном контексте сны выступают средством, которым лжепророки стараются заставить народ забыть Божье имя.
- source_word: אֲשֶׁר יְסַפְּרוּ אִישׁ לְרֵעֵהוּ
  choice: пересказываемых ими друг другу
  rationale: Пиэль ספר означает «рассказывать, пересказывать», а идиоматичное «друг другу» естественно передаёт распределительное אִישׁ לְרֵעֵהוּ без утраты взаимного обмена рассказами.
- source_word: כַּאֲשֶׁר
  choice: подобно тому как
  rationale: Ясно вводит сопоставление с отступничеством предыдущего поколения.
- source_word: שָׁכְחוּ אֲבוֹתָם
  choice: их отцы забыли
  rationale: «Отцы» непосредственно передаёт אֲבוֹתָם и сохраняет межпоколенческое сопоставление.
- source_word: בַּבָּעַל
  choice: из-за Ваала
  rationale: 'Передаёт вероятное причинно-ассоциативное значение ב: преданность Ваалу привела отцов к забвению имени Господа; возможны также значения «ради Ваала» и «через Ваала».'
theological_decisions:
- issue: Передача заветного выражения «Моё имя»
  choice: Моё имя
  alternative: Моя слава; кто Я такой
  rationale: Буквальная передача в обоих случаях сохраняет богословскую насыщенность выражения и не подменяет текст пояснительным толкованием.
- issue: Передача אִישׁ לְרֵעֵהוּ
  choice: друг другу
  alternative: каждый своему ближнему
  rationale: Русское взаимное местоимение естественно и точно передаёт распределительную конструкцию; грамматический мужской род древнееврейского оборота здесь имеет обобщающее значение.
- issue: Связь с Ваалом
  choice: из-за Ваала
  alternative: ради Ваала; через Ваала
  rationale: Выбранное чтение показывает, что почитание Ваала стало причиной забвения Божьего имени, при этом неоднозначность предлога отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. «Замышляют» передаёт сознательность намерения, а причастный оборот «пересказываемых ими друг другу» устраняет возможную синтаксическую двусмысленность. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции.
