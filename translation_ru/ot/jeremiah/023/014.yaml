  text: וּ/בִ/נְבִאֵ֨י יְרוּשָׁלִַ֜ם רָאִ֣יתִי שַׁעֲרוּרָ֗ה נָא֞וֹף וְ/הָלֹ֤ךְ בַּ/שֶּׁ֨קֶר֙ וְ/חִזְּקוּ֙ יְדֵ֣י מְרֵעִ֔ים לְ/בִ֨לְתִּי שָׁ֔בוּ אִ֖ישׁ מֵ/רָֽעָת֑/וֹ הָֽיוּ לִ֤/י כֻלָּ/ם֙ כִּ/סְדֹ֔ם וְ/יֹשְׁבֶ֖י/הָ כַּ/עֲמֹרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/014.yaml
  text: 'And among the prophets of Jerusalem I have seen a horrible thing: committing adultery and walking in falsehood[a]; they have strengthened the hands of evildoers, so that no man turns back from his evil. All of them are to me like Sodom[b], and her inhabitants like Gomorrah.'
translation:
  language: ru
  text: 'И среди пророков Иерусалима Я увидел нечто ужасающее: они прелюбодействуют и живут во лжи; они укрепляют руки злодеев, так что никто не отступает от своего зла[a]. Все они стали для Меня как Содом, а жители Иерусалима — как Гоморра.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «так что никто не отворачивается от своего зла». Еврейский глагол может также обозначать обращение, то есть отказ от злого пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְבִיאֵי יְרוּשָׁלִַם
  choice: И среди пророков Иерусалима
  rationale: Предлог ב обозначает здесь среду — «среди»; начальный ו передан союзом «и» без усиления противопоставления.
- source_word: רָאִיתִי שַׁעֲרוּרָה
  choice: Я увидел нечто ужасающее
  rationale: Перфект передан естественным русским прошедшим временем, а редкое существительное שַׁעֲרוּרָה — выражением сильного нравственного потрясения.
- source_word: נָאוֹף
  choice: они прелюбодействуют
  rationale: Абсолютный инфинитив имеет обвинительную, описательную функцию; глагольная форма по-русски ясно передаёт продолжающееся поведение.
- source_word: וְהָלֹךְ בַּשֶּׁקֶר
  choice: и живут во лжи
  rationale: Буквальное «ходят во лжи» сохраняло бы метафору, но в современном русском звучало бы менее естественно; «живут» передаёт образ образа жизни.
- source_word: וְחִזְּקוּ יְדֵי מְרֵעִים
  choice: они укрепляют руки злодеев
  rationale: Сохранён понятный библейский образ поддержки и придания смелости делающим зло.
- source_word: לְבִלְתִּי שָׁבוּ אִישׁ מֵרָעָתוֹ
  choice: так что никто не обращается от своего зла
  rationale: לבלתי передано как отрицательный результат; распределительное אִישׁ естественно выражено местоимением «никто», а שוב — глаголом «обращается», сохраняющим смысл поворота от зла.
- source_word: הָיוּ לִי כֻלָּם כִּסְדֹם
  choice: Все они стали для Меня как Содом
  rationale: Перфект היה допускает результирующее «стали»; לִי сохранено как «для Меня», то есть в Божьей оценке.
- source_word: וְיֹשְׁבֶיהָ כַּעֲמֹרָה
  choice: а жители Иерусалима — как Гоморра
  rationale: Местоименный суффикс женского рода относится к Иерусалиму; повтор названия устраняет неестественное для русского «её жители» и сохраняет референцию.
theological_decisions:
- issue: Значение שוב в контексте нравственного отступления
  choice: обращается от своего зла
  alternative: отворачивается от своего зла; раскаивается в своём зле
  rationale: «Обращается» сохраняет образ поворота и возможный оттенок покаяния, не заменяя его более узким богословским термином.
- issue: Распределительное אִישׁ
  choice: никто
  alternative: ни один человек; каждый — от своего зла
  rationale: В данном отрицательном предложении «никто» точно и естественно передаёт представительное единственное число, относящееся ко всем, без ненужного гендерного сужения.
- issue: Сравнение с Содомом и Гоморрой
  choice: сохранено как Божья нравственная оценка пророков и жителей Иерусалима
  alternative: истолковать сравнение через какой-либо один конкретный грех Содома
  rationale: Текст сам не ограничивает смысл сравнения одним грехом, поэтому перевод не конкретизирует обвинение сверх сказанного.
translation_notes:
  register: Современный литературный русский с торжественным пророческим тоном. Синтаксис сделан ясным для обычного читателя; сохранены сильная нравственная оценка, образ «укреплять руки» и напряжение между буквальным поворотом и покаянием. Маркер [a] помещён непосредственно после соответствующей фразы.
