base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/024.yaml
  text: Can a man hide himself in secret places so that I do not see him? declares Yahweh[b][a]. Do I not fill heaven and earth? declares Yahweh.
translation:
  language: ru
  text: «Может ли человек спрятаться в укромных местах так, что Я не увижу его?»[a] — возвещает Яхве. «Не Я ли наполняю небеса и землю?» — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Если человек спрячется в укромных местах, разве Я не увижу его?»'
    reason: Сохраняет альтернативный условный разбор частицы אִם и следующей части предложения.
lexical_decisions:
- source_word: אִם
  choice: может ли
  rationale: Хотя частица обычно означает «если», здесь она вводит риторический вопрос. Передача «может ли» естественно выражает вызов и подразумеваемый отрицательный ответ, не устраняя возможность условного разбора, отмеченную в сноске.
- source_word: יִסָּתֵר
  choice: укрыться
  rationale: Нифаль допускает возвратно-пассивный оттенок; в данном контексте речь идёт о попытке человека скрыться от Божьего взора, поэтому естественно возвратное «укрыться».
- source_word: אִישׁ
  choice: человек
  rationale: Существительное мужского рода употреблено обобщённо; русское «человек» сохраняет единственное число и универсальный смысл.
- source_word: בַּמִּסְתָּרִים
  choice: в тайных местах
  rationale: 'Переданы определённость по контексту и форма множественного числа: речь о скрытых, недоступных взору местах.'
- source_word: וַאֲנִי לֹא אֶרְאֶנּוּ
  choice: так, что Я не увижу его
  rationale: В составе риторического вопроса сочетание выражает предполагаемый результат попытки укрыться. Формулировка сохраняет отрицание и объектный суффикс «его».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана весомо и современно; «возвещает» лучше сохраняет формульный характер, чем нейтральное «говорит».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом «Господь».
- source_word: הֲלוֹא
  choice: не Я ли
  rationale: Частица вводит риторический вопрос, ожидающий утвердительного ответа; русская конструкция «не Я ли» точно передаёт этот акцент.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: небеса и землю
  rationale: Сохранено множественное «небеса» и традиционная парная формула, обозначающая весь сотворённый мир.
- source_word: מָלֵא
  choice: наполняю
  rationale: Сохранён исходный образ наполнения, выражающий всеохватное Божье присутствие, без замены его отвлечённым богословским термином.
theological_decisions:
- issue: Язык Божьего всеприсутствия
  choice: Не Я ли наполняю небеса и землю?
  alternative: Не присутствую ли Я повсюду на небесах и на земле?
  rationale: Перевод сохраняет конкретную метафору еврейского текста «наполняю», не сводя её к догматическому термину и не уточняя способ Божьего присутствия.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст дважды употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие между именем и титулом.
- issue: Синтаксическая сила אִם в риторическом вопросе
  choice: Может ли человек укрыться… так, что Я не увижу его?
  alternative: Если человек укроется… разве Я не увижу его?
  rationale: Основной вариант естественно передаёт риторический вызов, а сноска сохраняет подлинно возможный условный разбор еврейской конструкции.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор формулы «возвещает Яхве» сохранён; местоимение «Я» написано с прописной буквы по русской библейской традиции. Пунктуация оформляет весь стих как прямую речь Яхве, не добавляя отсутствующих в еврейском тексте пояснений.
