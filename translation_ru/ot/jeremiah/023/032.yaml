source:
  edition: WLC
  text: הִ֠נְ/נִי עַֽל נִבְּאֵ֞י חֲלֹמ֥וֹת שֶׁ֨קֶר֙ נְאֻם יְהוָ֔ה וַֽ/יְסַפְּרוּ/ם֙ וַ/יַּתְע֣וּ אֶת עַמִּ֔/י בְּ/שִׁקְרֵי/הֶ֖ם וּ/בְ/פַחֲזוּתָ֑/ם וְ/אָנֹכִ֨י לֹֽא שְׁלַחְתִּ֜י/ם וְ/לֹ֣א צִוִּיתִ֗י/ם וְ/הוֹעֵ֛יל לֹֽא יוֹעִ֥ילוּ לָֽ/עָם הַ/זֶּ֖ה נְאֻם יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/032.yaml
  text: Behold[a], I am against those who prophesy lying dreams, declares Yahweh, and who tell them and lead my people astray by their lies and by their recklessness, though I did not send them or command them. They do not profit this people at all[b], declares Yahweh.
translation:
  language: ru
  text: Вот, Я — против тех, кто возвещает лживые сны[a], — возвещает Яхве, — кто рассказывает их и вводит Мой народ в заблуждение своей ложью и своей безрассудной дерзостью[b], хотя Я не посылал их и не повелевал им. Никакой пользы этому народу они не приносят, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сны лжи»; возможно также: «ложные сны».'
    reason: 'Лексическая альтернатива: שֶׁקֶר — существительное «ложь, неправда», употреблённое как определение к слову «сны».'
  - marker: b
    text: Слово, переведённое как «безрассудная дерзость», может также означать «опрометчивость», «необузданность», «легкомыслие» или «самонадеянность». Еврейское слово редкое и обозначает безответственное, дерзкое поведение.
    reason: Лексическая альтернатива для פַחֲזוּתָם; маркер поставлен непосредственно после поясняемого выражения.
lexical_decisions:
- source_word: הִנְנִי עַל
  choice: Вот, Я — против
  rationale: Сохраняет торжественную пророческую формулу и ясно передаёт враждебное противостояние и грядущий суд.
- source_word: נִבְּאֵי חֲלֹמוֹת שֶׁקֶר
  choice: тех, кто пророчествует лживые сны
  rationale: Причастная конструкция передана как обозначение людей по их действию; существительное שֶׁקֶר сохранено атрибутивно через «лживые».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Естественная и достойная передача пророческой формулы с сохранением личного имени Яхве.
- source_word: וַיְסַפְּרוּם
  choice: кто пересказывает их
  rationale: Местоимение «их» однозначно отсылает к снам; «пересказывает» естественно обозначает изложение увиденного сна.
- source_word: וַיַּתְעוּ אֶת עַמִּי
  choice: вводит Мой народ в заблуждение
  rationale: 'Передаёт каузативное значение глагола: пророки заставляют народ сбиваться с верного пути.'
- source_word: בְּשִׁקְרֵיהֶם
  choice: своей ложью
  rationale: Инструментальное значение предлога ב передано творительным падежом; собирательное русское «ложь» здесь естественнее множественного числа.
- source_word: וּבְפַחֲזוּתָם
  choice: и своей безрассудной дерзостью
  rationale: Редкое слово обозначает безответственное, необузданное и самонадеянное поведение; сочетание сохраняет широту оттенков, не сводя значение только к легкомыслию или хвастовству.
- source_word: וְאָנֹכִי לֹא שְׁלַחְתִּים וְלֹא צִוִּיתִים
  choice: Я не посылал их и ничего им не повелевал
  rationale: Выделенное אָנֹכִי отражено явным «Я»; «ничего» естественно усиливает параллельное отрицание, не добавляя нового содержания.
- source_word: וְהוֹעֵיל לֹא יוֹעִילוּ
  choice: и они не приносят ... никакой пользы
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает отрицание; «никакой пользы» идиоматично выражает полную бесполезность.
- source_word: לָעָם הַזֶּה
  choice: этому народу
  rationale: Сохраняет значение עָם и указательный, несколько дистанцирующий оборот исходного текста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Характер ложных пророков
  choice: кто пророчествует лживые сны
  alternative: пророки ложных снов
  rationale: Формулировка не предполагает отдельного официального статуса сверх того, что выражено причастием, и сохраняет напряжение между заявленной пророческой деятельностью и её ложностью.
- issue: Основание осуждения
  choice: Я не посылал их и ничего им не повелевал
  alternative: хотя Я не посылал их и не повелевал им
  rationale: Сохраняется прямое божественное отрицание их поручения без добавления конфессиональных представлений о природе пророческого служения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Заглавные местоимения при обращении к Богу сохранены по русской библейской традиции. Повтор «своей ... и своей ...» отражает повтор предлога ב в еврейском тексте. Пунктуация с тире выделяет формулу «возвещает Яхве», не нарушая течения длинного пророческого высказывания.
