id: JER.23.1
reference: Jeremiah 23:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: ה֣וֹי רֹעִ֗ים מְאַבְּדִ֧ים וּ/מְפִצִ֛ים אֶת צֹ֥אן מַרְעִיתִ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/001.yaml
  text: Woe to the shepherds who are destroying and scattering the sheep of my pasture[a], declares Yahweh.
translation:
  language: ru
  text: Горе пастухам, которые губят и рассеивают овец Моего пастбища[a], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стадо Моего пастбища».'
    reason: צֹאן может обозначать как отдельных овец в собирательном смысле, так и стадо.
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Междометие выражает пророческое обличение и угрозу суда; «горе» естественно передаёт эту силу в русском библейском стиле.
- source_word: רֹעִים
  choice: пастухам
  rationale: Сохранён буквальный образ пастухов, метафорически обозначающий правителей и вождей народа; замена на «руководителей» обеднила бы образность текста.
- source_word: מְאַבְּדִים
  choice: губят
  rationale: Причастная форма указывает на продолжающееся действие, а «губят» передаёт серьёзность значения אבד и звучит естественно в сочетании с образом стада.
- source_word: וּמְפִצִים
  choice: и рассеивают
  rationale: Передаёт параллельное продолжающееся действие и сохраняет пастушеский образ разогнанного стада.
- source_word: אֶת צֹאן
  choice: овец
  rationale: צֹאן обозначает мелкий домашний скот или стадо; «овец» делает образ конкретным и согласуется с упоминанием пастухов.
- source_word: מַרְעִיתִי
  choice: Моего пастбища
  rationale: Существительное означает «пастбище, место выпаса», а суффикс первого лица — «Моё»; формулировка сохраняет принадлежность овец Яхве и исходный пасторальный образ.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современно и достойно; «возвещает» сохраняет более весомый оттенок, чем нейтральное «говорит».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Образ пастухов и овец
  choice: Сохранить пасторальную метафору в основном тексте.
  alternative: 'Передать её толкованием: «правители, которые губят и рассеивают Мой народ».'
  rationale: Еврейский текст прямо говорит о пастухах и стаде; этот образ существен для литературного и богословского развития главы и не должен подменяться поясняющим пересказом.
- issue: Принадлежность стада Яхве
  choice: «овец Моего пастбища»
  alternative: «овец, которых Я пасу» или «Мой народ»
  rationale: Выбранный вариант сохраняет грамматический образ исходного текста и не уточняет сверх него, каким именно образом Яхве заботится о стаде.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис краток и обличителен; архаизмы вроде «пастыри» и «речёт» не использованы. Местоимение «Моего», относящееся к Богу, написано с прописной буквы согласно принятой русской библейской традиции.
