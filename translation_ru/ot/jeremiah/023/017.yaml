  text: אֹמְרִ֤ים אָמוֹר֙ לִֽ/מְנַאֲצַ֔/י דִּבֶּ֣ר יְהוָ֔ה שָׁל֖וֹם יִֽהְיֶ֣ה לָ/כֶ֑ם וְ֠/כֹל הֹלֵ֞ךְ בִּ/שְׁרִר֤וּת לִבּ/וֹ֙ אָֽמְר֔וּ לֹֽא תָב֥וֹא עֲלֵי/כֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/017.yaml
  text: 'They keep saying to those who despise me[a], ‘Yahweh has spoken: You will have peace’; and to everyone who walks in the stubbornness of his own heart they say[c][b], ‘No disaster will come upon you.’'
translation:
  language: ru
  text: 'Они без конца говорят тем, кто презирает меня[a]: «Яхве сказал: “У вас будет мир[b]”». И каждому, кто следует упрямству своего сердца, они говорят: «Не постигнет вас бедствие[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем, кто отвергает меня». Местоимение «меня», вероятнее всего, относится к Яхве; возможно также отнесение к Иеремии.'
    reason: лексическая и референциальная неоднозначность
  - marker: b
    text: Слово «мир» может также означать благополучие и безопасность.
    reason: лексическая многозначность
  - marker: c
    text: 'Или: «зло», «несчастье». Здесь имеется в виду бедствие, а не нравственное зло.'
    reason: контекстуальное значение
lexical_decisions:
- source_word: אֹמְרִים אָמוֹר
  choice: без конца говорят
  rationale: Сочетание причастия с абсолютным инфинитивом усиливает глагол и передаёт настойчиво повторяющееся действие; выражение естественно звучит по-русски.
- source_word: לִמְנַאֲצַי
  choice: тем, кто презирает Меня
  rationale: Причастие от נאץ с суффиксом первого лица означает тех, кто презирает или отвергает говорящего; прописная буква отражает наиболее вероятное отнесение местоимения к Яхве, не заменяя самого местоимения толкованием.
- source_word: דִּבֶּר יְהוָה
  choice: Яхве сказал
  rationale: Перфект דבר с именем Яхве представляет притязание лжепророков на уже данное божественное слово; простое прошедшее время естественно для русской прямой речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и согласуется с предоставленным консультационным слоем.
- source_word: שָׁלוֹם
  choice: мир
  rationale: Слово обозначает мир, благополучие и безопасность. «Мир» сохраняет краткость и устойчивое пророческое звучание, а более широкий смысл отмечен в сноске.
- source_word: יִהְיֶה לָכֶם
  choice: будет у вас
  rationale: Естественно передаёт еврейскую конструкцию существования с ל, сохраняя синтаксический акцент на обещанном мире.
- source_word: וְכֹל הֹלֵךְ
  choice: и каждому, кто живёт
  rationale: Буквальное «ходит» представляет нравственный образ жизни; в современном русском «живёт» ясно передаёт этот привычный этический смысл.
- source_word: בִּשְׁרִרוּת לִבּוֹ
  choice: по упрямству своего сердца
  rationale: שְׁרִרוּת означает упрямство или своеволие; оборот сохраняет образ сердца как центра внутренней воли.
- source_word: אָמְרוּ
  choice: они говорят
  rationale: Перфект в контексте продолжающегося обличения естественно передаётся настоящим временем и поддерживает параллелизм с первой частью стиха.
- source_word: לֹא תָבוֹא עֲלֵיכֶם רָעָה
  choice: не постигнет вас бедствие
  rationale: רָעָה здесь означает грядущее несчастье или катастрофу, а не нравственное зло; «постигнет» естественно передаёт идиому движения бедствия на человека.
theological_decisions:
- issue: К кому относится суффикс первого лица в לִמְנַאֲצַי («презирает Меня»)
  choice: К Яхве
  alternative: К Иеремии как пророку
  rationale: Ближайший контекст посвящён отвержению слова Яхве, а далее лжепророки ссылаются на Его речь. Сам перевод сохраняет местоимение и тем самым не разворачивает толкование внутри текста; альтернативная возможность указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Настойчивость ложных заверений передана выражением «без конца говорят»; вложенная прямая речь ясно отделяет притязание «Яхве сказал» от самого ложного обещания. Все сноски имеют маркеры в основном тексте.
