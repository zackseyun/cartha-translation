  text: כִּ֤י מְנָֽאֲפִים֙ מָלְאָ֣ה הָ/אָ֔רֶץ כִּֽי מִ/פְּנֵ֤י אָלָה֙ אָבְלָ֣ה הָ/אָ֔רֶץ יָבְשׁ֖וּ נְא֣וֹת מִדְבָּ֑ר וַ/תְּהִ֤י מְרֽוּצָתָ/ם֙ רָעָ֔ה וּ/גְבוּרָתָ֖/ם לֹא כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/010.yaml
  text: For the land is full of adulterers[a]; because of the curse the land mourns, and the pastures of the wilderness are dried up. Their course is evil[c][b], and their might is not right.
translation:
  language: ru
  text: Ибо земля полна прелюбодеев; из-за проклятия[a] земля скорбит, и высохли пастбища в степи. Их путь[b] зол, и сила их — не такова[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за клятвы»; еврейское слово может обозначать клятву, особенно связанную с призыванием проклятия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их бег» или «их путь»; еврейское слово употреблено метафорически о ходе жизни или поведении.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «их сила — не так». Еврейское выражение кратко и эллиптично; возможны также: «сила их неправедна» или «могущество их не таково».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנָאֲפִים
  choice: прелюбодеев
  rationale: Причастие во множественном числе обозначает людей, совершающих прелюбодеяние. Буквальный перевод сохраняет нравственную резкость и не исключает более широкого оттенка неверности завету.
- source_word: מָלְאָה הָאָרֶץ
  choice: земля полна
  rationale: В контексте пророчества об Иудее אֶרֶץ естественнее понимать как страну/землю, а не весь мир; русское «земля» также поддерживает последующее олицетворение.
- source_word: מִפְּנֵי אָלָה
  choice: из-за проклятия
  rationale: אָלָה может означать клятву, связанную с призыванием проклятия, либо само проклятие. Скорбь земли и засуха указывают здесь прежде всего на действие проклятия.
- source_word: אָבְלָה
  choice: скорбит
  rationale: Глагол буквально выражает скорбь или траур; применительно к земле это намеренное олицетворение, которое следует сохранить.
- source_word: נְאוֹת מִדְבָּר
  choice: пастбища в степи
  rationale: נְאוֹת — места выпаса, а מִדְבָּר в данном природном контексте обозначает скорее необжитую сухую степь, чем песчаную пустыню.
- source_word: מְרוּצָתָם
  choice: их путь
  rationale: Слово буквально связано с бегом и здесь метафорически обозначает ход жизни или поведение. «Путь» понятно современному читателю и сохраняет образ нравственного направления.
- source_word: רָעָה
  choice: зол
  rationale: Прилагательное даёт прямую нравственную оценку их пути.
- source_word: גְבוּרָתָם לֹא כֵן
  choice: сила их направлена не на правое
  rationale: 'Гебраизм краток и эллиптичен: буквально «их сила — не так/не то». Формулировка сохраняет нравственную направленность фразы, не отождествляя силу саму по себе с неправедностью.'
theological_decisions:
- issue: Буквальное или метафорическое значение «прелюбодеев»
  choice: В основном тексте сохранено буквальное «прелюбодеев».
  alternative: «неверных» как указание на нарушение завета
  rationale: Само слово прямо обозначает прелюбодеяние, тогда как контекст может придавать ему дополнительный смысл неверности Богу. Перевод не должен молча заменять прямое значение толкованием.
- issue: Значение אָלָה
  choice: «проклятия»
  alternative: «клятвы» или «клятвенного проклятия»
  rationale: Последующие скорбь земли и высыхание пастбищ лучше согласуются с последствиями проклятия, но реальная лексическая двусмысленность сохранена в примечании.
- issue: Смысл эллиптического выражения גְבוּרָתָם לֹא כֵן
  choice: «сила их направлена не на правое»
  alternative: «сила их — не такова», «могущество их неправедно»
  rationale: Еврейский текст не уточняет пропущенную связь. Основной вариант передаёт нравственное осуждение и одновременно избегает излишне точного догматического истолкования.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сохраняет параллелизм и олицетворение земли; редкие или архаичные слова избегаются. «Степь» выбрана вместо вводящей в заблуждение песчаной «пустыни».
