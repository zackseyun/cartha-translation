  text: הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וַ/הֲקִמֹתִ֥י לְ/דָוִ֖ד צֶ֣מַח צַדִּ֑יק וּ/מָ֤לַךְ מֶ֨לֶךְ֙ וְ/הִשְׂכִּ֔יל וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/005.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will raise up for David a righteous Branch, and he will reign as king and act wisely[b], and he will do justice and righteousness in the land.
translation:
  language: ru
  text: «Вот, наступают дни, — возвещает Яхве, — когда Я воздвигну Давиду праведный Росток[a]. Он будет царствовать как царь, поступать мудро[b] и осуществлять правосудие и справедливость на земле».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведный побег» или «праведная ветвь». Еврейский образ указывает на царственного потомка, который произойдёт из рода Давида.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «действовать благоразумно» или «преуспевать». Еврейский глагол может обозначать и мудрое, умелое действие, и сопутствующий ему успех.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную силу и торжественность пророческого возглашения, оставаясь естественным в современном русском языке.
- source_word: יָמִים בָּאִים
  choice: наступают дни
  rationale: Естественно передаёт устойчивую пророческую формулу о грядущем, назначенном Богом времени.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт авторитетный характер пророческой формулы; имя יהוה воспроизведено как «Яхве».
- source_word: וַהֲקִמֹתִי
  choice: Я воздвигну
  rationale: В царско-династическом контексте каузатив глагола קום означает, что Бог поставит или произведёт обещанного правителя; «воздвигну» сохраняет эту многослойность.
- source_word: לְדָוִד
  choice: Давиду
  rationale: Русский дательный естественно сохраняет краткость еврейского оборота и допускает смысл появления потомка для Давида и в его династической линии без поясняющей вставки в основной текст.
- source_word: צֶמַח צַדִּיק
  choice: праведный Росток
  rationale: «Росток» точно и понятно передаёт образ нового побега, возникающего из династической линии. Заглавная буква отмечает возможное употребление образа как обозначения обещанного царя, не заменяя его словом «Мессия».
- source_word: וּמָלַךְ מֶלֶךְ
  choice: Он будет царствовать как царь
  rationale: Сохраняет усиление, создаваемое сочетанием однокоренных в еврейском контексте глагола и существительного, и ясно относит царствование к Ростку.
- source_word: וְהִשְׂכִּיל
  choice: поступать мудро
  rationale: Передаёт основной смысл разумного и умелого действия; возможный оттенок успеха сохранён в сноске.
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: вершить правосудие и поступать праведно
  rationale: 'Естественно по-русски выражает два взаимосвязанных аспекта царского правления: осуществление справедливого суда и праведное поведение, сохраняя различие между משפט и צדקה.'
theological_decisions:
- issue: Мессианский смысл образа Давидова Ростка
  choice: Сохранить царско-династический образ «Ростка», не называя персонажа прямо Мессией или Христом.
  alternative: Передать образ как обычного потомка либо прямо вставить обозначение «Мессия».
  rationale: Текст изображает обещанного праведного царя из линии Давида и допускает мессианское прочтение, но сам не употребляет слово «Мессия». Образная формулировка сохраняет и межтекстовые связи, и границы сказанного.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное covenantное имя יהוה; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Смысл וְהִשְׂכִּיל
  choice: поступать мудро с указанием в сноске на возможный оттенок успеха
  alternative: преуспевать
  rationale: Глагол способен обозначать как разумное, умелое действие, так и достигаемый благодаря ему успех. Контекст справедливого царского правления поддерживает первое, но не устраняет второе.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим звучанием. Синтаксис сохраняет ритм возглашения, но избегает устаревших форм. Повтор «вершить… и поступать…» выбран ради естественной передачи двух абстрактных существительных; заглавная буква в «Росток» отмечает индивидуализированный царский образ, не вводя прямого конфессионального толкования.
