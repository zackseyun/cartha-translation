base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/035.yaml
  text: Thus each man shall say to his neighbor[a], and each man to his brother, ‘What has Yahweh answered?’ and[b], ‘What has Yahweh spoken?’
translation:
  language: ru
  text: 'Так говорите: каждый своему ближнему и каждый своему брату: «Что ответил Яхве и что сказал Яхве?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה
  choice: Так
  rationale: Вводит предписанный способ речи; кратко и естественно для пророческого наставления.
- source_word: תֹאמְרוּ
  choice: говорите
  rationale: Форма второго лица множественного числа выражает обращённое к слушателям предписание; настоящее в повелительном значении естественно передаёт его по-русски.
- source_word: אִישׁ עַל רֵעֵהוּ
  choice: каждый — своему ближнему
  rationale: Передаёт распределительное значение אִישׁ и адресата речи; «ближний» сохраняет широкий смысл רֵעַ — человек из ближайшего круга общения.
- source_word: וְאִישׁ אֶל אָחִיו
  choice: и каждый — своему брату
  rationale: Сохраняет параллелизм первой части и прямое значение אָחִיו без нейтрализующей замены.
- source_word: מֶה עָנָה
  choice: Что ответил
  rationale: Прямо передаёт вопросительное מֶה и обычное значение ענה — «ответить»; русский совершенный вид уместен для вопроса о данном Богом ответе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וּמַה דִּבֶּר
  choice: и «Что сказал»
  rationale: Сохраняет второй параллельный вопрос; «сказал» естественно передаёт דבר в данном контексте, не добавляя оттенка торжественного провозглашения.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте дважды стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «каждый» и параллелизм двух вопросов сохранены; тире облегчает восприятие синтаксиса без смыслового добавления.
