base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/028.yaml
  text: Let the prophet who has a dream tell the dream[a], but let the one who has my word speak my word truthfully[b]. What is straw to grain? declares Yahweh.
translation:
  language: ru
  text: Пророк, которому приснился сон, пусть расскажет сон; а тот, у кого есть Моё слово, пусть верно говорит Моё слово[a]. Что солома в сравнении с зерном?[b] — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть говорит Моё истинное слово». Еврейский текст может подчёркивать либо верность говорящего, либо истинность самого слова.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Что общего у соломы с зерном?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא אֲשֶׁר אִתּוֹ חֲלוֹם
  choice: Пророк, у которого есть сон
  rationale: Определённый артикль передан родовым обозначением; еврейская идиома «с которым сон» естественно выражена как обладание сном, без уточнения его происхождения.
- source_word: יְסַפֵּר חֲלוֹם
  choice: пусть расскажет сон
  rationale: Пиэль глагола ספר означает «рассказывать, пересказывать»; побудительный оттенок формы передан конструкцией с «пусть».
- source_word: וַאֲשֶׁר דְּבָרִי אִתּוֹ
  choice: а тот, у кого есть Моё слово
  rationale: Союз в контексте выражает противопоставление между сном и словом Яхве; русское «а» передаёт его без чрезмерного усиления.
- source_word: יְדַבֵּר דְּבָרִי אֱמֶת
  choice: пусть верно говорит Моё слово
  rationale: «Верно» естественно передаёт наречное понимание אֱמֶת — говорить правдиво и без искажения; возможное определительное понимание сохранено в сноске.
- source_word: מַה לַתֶּבֶן אֶת הַבָּר
  choice: Что солома в сравнении с зерном?
  rationale: 'Сохранены точные сельскохозяйственные образы: תֶּבֶן — «солома», בָּר — «зерно». Русская сравнительная формула естественно передаёт резкое риторическое противопоставление.'
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современным литературным выражением; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Противопоставление сна и слова Яхве
  choice: Обе части переданы как дозволительно-побудительные, при этом союз «а» и заключительный образ ясно противопоставляют их.
  alternative: Передать союз нейтральным «и» либо прямо назвать сон ложным.
  rationale: Контекст создаёт резкое противопоставление, однако сам стих не утверждает явно, что всякий упомянутый сон ложен; перевод не добавляет такой оценки.
- issue: Синтаксическая роль אֱמֶת
  choice: 'Основной текст понимает слово наречно: «верно говорит Моё слово».'
  alternative: «говорит Моё истинное слово».
  rationale: Еврейский синтаксис допускает акцент либо на верности говорящего, либо на истинности слова. Основной вариант естественнее по-русски, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого тона. Заглавные буквы в «Моё» обозначают принадлежность слова Яхве; образы «солома» и «зерно» оставлены без конкретизации как «мякина» или «пшеница».
