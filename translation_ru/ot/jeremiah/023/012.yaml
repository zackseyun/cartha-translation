source:
  edition: WLC
  text: לָ/כֵן֩ יִֽהְיֶ֨ה דַרְכָּ֜/ם לָ/הֶ֗ם כַּ/חֲלַקְלַקּוֹת֙ בָּֽ/אֲפֵלָ֔ה יִדַּ֖חוּ וְ/נָ֣פְלוּ בָ֑/הּ כִּֽי אָבִ֨יא עֲלֵי/הֶ֥ם רָעָ֛ה שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/012.yaml
  text: Therefore their way will be to them like slippery places in the darkness; they will be driven along and fall in it[a], for I will bring disaster on them in the year of their punishment, declares Yahweh.
translation:
  language: ru
  text: 'Поэтому их путь будет для них как скользкие места во тьме: их погонят, и там они падут, потому что Я наведу на них бедствие в год их наказания[a], — возвещает Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в год их посещения» — то есть когда Бог посетит их для суда и взыскания.'
    reason: Лексема פְּקֻדָּה может обозначать посещение, взыскание или наказание; сноска сохраняет эту смысловую широту.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт прямое следствие из предшествующего обличения и сохраняет логическую связь.
- source_word: יִהְיֶה דַרְכָּם לָהֶם
  choice: их путь станет для них
  rationale: 'Сохраняет метафору пути и значимое לָהֶם: их собственный путь обернётся против них.'
- source_word: כַּחֲלַקְלַקּוֹת בָּאֲפֵלָה
  choice: словно скользкие места во тьме
  rationale: Передаёт множественное число и образ опасных, лишённых опоры мест в условиях темноты.
- source_word: יִדַּחוּ
  choice: их погонят
  rationale: 'Нифаль выражает действие внешней силы: их будут гнать или толкать вперёд; формулировка естественно сочетается с образом опасного пути.'
- source_word: וְנָפְלוּ בָהּ
  choice: и они упадут там
  rationale: Женский суффикс допускает отнесение к тьме или изображённой опасной местности; «там» сохраняет образ, не фиксируя спорный антецедент.
- source_word: רָעָה
  choice: бедствие
  rationale: В контексте Божьего суда означает пагубное несчастье или катастрофу, а не нравственное зло.
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: в год их наказания
  rationale: В данном контексте פְּקֻדָּה обозначает посещение ради суда, то есть наказание или взыскание.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула; личное имя יְהוָה передано как «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Значение רָעָה в высказывании о Божьем суде
  choice: бедствие
  alternative: зло; несчастье
  rationale: Контекст говорит о наказующей катастрофе, которую Бог наведёт на виновных, а не о совершении нравственного зла.
- issue: Значение פְּקֻדָּה
  choice: наказание в основном тексте
  alternative: посещение; взыскание
  rationale: Судебный контекст поддерживает «наказание», однако слово сохраняет оттенок Божьего посещения ради суда, отмеченный в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим тоном. Образ пути, скользких мест и тьмы сохранён; синтаксис слегка упорядочен для ясности без устранения исходной неоднозначности.
