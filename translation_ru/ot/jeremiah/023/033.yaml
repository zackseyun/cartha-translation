  text: וְ/כִי יִשְׁאָלְ/ךָ֩ הָ/עָ֨ם הַ/זֶּ֜ה אֽוֹ הַ/נָּבִ֤יא אֽוֹ כֹהֵן֙ לֵ/אמֹ֔ר מַה מַשָּׂ֖א יְהוָ֑ה וְ/אָמַרְתָּ֤ אֲלֵי/הֶם֙ אֶת מַה מַשָּׂ֔א וְ/נָטַשְׁתִּ֥י אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/033.yaml
  text: And when this people, or a prophet, or a priest asks you, saying, ‘What is the burden of the LORD?’ then you shall say to them, ‘You are the burden, and I will cast you off,’ declares the LORD.
translation:
  language: ru
  text: 'И если этот народ, или пророк, или священник спросит тебя: «Что за бремя ГОСПОДА?» — скажи им: «Вы — бремя[a], и Я сброшу вас», — говорит ГОСПОДЬ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст в этом месте синтаксически труден; буквально возможно: «Какое (или: что за) бремя?» Древние переводы и контекстуальное понимание передают: «Вы — бремя».'
    reason: Сохраняет неоднозначность אֶת־מַה־מַשָּׂא, не выдавая традиционное контекстуальное прочтение за единственно возможный буквальный смысл.
lexical_decisions:
- source_word: מַשָּׂא
  choice: бремя
  rationale: 'Сохраняет ключевую игру слов: מַשָּׂא может обозначать и тяжёлую ношу, и пророческое изречение; русское «бремя» естественно поддерживает образ того, что можно сбросить.'
- source_word: וְנָטַשְׁתִּי אֶתְכֶם
  choice: и Я сброшу вас
  rationale: Глагол נטש означает оставить, покинуть, отвергнуть; в данном контексте «сброшу» сохраняет угрозу отвержения и одновременно продолжает образ бремени.
- source_word: נְאֻם יְהוָה
  choice: говорит ГОСПОДЬ
  rationale: Естественная и достойная формула пророческой речи; тетраграмматон передан традиционным «ГОСПОДЬ».
theological_decisions:
- issue: Неоднозначность фразы אֶת מַה מַשָּׂא
  choice: «Вы — бремя» в основном тексте с примечанием
  alternative: «Какое бремя?» или «Вот какое бремя»
  rationale: Масоретская огласовка буквально трудна и допускает вопросительное понимание, однако древние версии и контекст игры слов поддерживают обращённое к слушателям «Вы — бремя». Неоднозначность не скрыта, а отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Повтор «бремя — сброшу» намеренно сохраняет резкую игру слов оригинала.
