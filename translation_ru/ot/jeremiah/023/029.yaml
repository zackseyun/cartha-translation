source:
  edition: WLC
  text: הֲ/ל֨וֹא כֹ֧ה דְבָרִ֛/י כָּ/אֵ֖שׁ נְאֻם יְהוָ֑ה וּ/כְ/פַטִּ֖ישׁ יְפֹ֥צֵֽץ סָֽלַע־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/029.yaml
  text: Is not my word like fire—oracle of Yahweh—and like a hammer that shatters rock?[a]
translation:
  language: ru
  text: «Разве слово Моё не подобно огню, — изречение Яхве, — и молоту, разбивающему скалу?»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорит Яхве». Еврейская пророческая формула буквально означает «изречение Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: разве ... не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, не превращая его в прямое утверждение.
- source_word: כֹה דְבָרִי כָאֵשׁ
  choice: слово Моё не подобно огню
  rationale: В контексте כֹה вводит сопоставление; русское «подобно» естественно связывает слово с образом огня и сохраняет единственное число דְבָרִי.
- source_word: נְאֻם יְהוָה
  choice: изречение Яхве
  rationale: Сохраняет именную форму устойчивой пророческой формулы и передаёт יהוה личным именем «Яхве», а не титулом.
- source_word: וּכְפַטִּישׁ
  choice: и молоту
  rationale: Передаёт второй сравнительный образ без неоправданного уточнения вида молота.
- source_word: יְפֹצֵץ
  choice: разбивающему
  rationale: Причастная конструкция по-русски естественно передаёт действие молота; глагол сохраняет смысл сильного разрушения.
- source_word: סָלַע
  choice: скалу
  rationale: «Скала» лучше, чем общее «камень», передаёт крупную твёрдую каменную массу, обозначаемую סלע, и силу образа.
theological_decisions:
- issue: Передача пророческой формулы נְאֻם יְהוָה
  choice: изречение Яхве
  alternative: говорит Господь; возвещает Яхве
  rationale: «Изречение» сохраняет номинальный характер נְאֻם и не сводит формулу к обычному глаголу речи; «Яхве» прямо передаёт тетраграмматон.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Риторический вопрос, параллелизм образов огня и молота и вставная формула речи сохранены.
