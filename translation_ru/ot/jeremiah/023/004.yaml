base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/004.yaml
  text: And I will raise up over them shepherds who will shepherd them[a], and they will no longer fear, nor be dismayed, nor will any be missing, declares Yahweh.
translation:
  language: ru
  text: «Я поставлю над ними пастырей, которые будут пасти их. Они больше не будут ни бояться, ни приходить в смятение, и никто из них не пропадёт[a], — возвещает Яхве».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никого из них не будет недоставать»; возможно также: «они не будут терпеть недостатка». Вероятнее всего, еврейская фраза означает, что никто из стада не окажется пропавшим или неучтённым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Я поставлю
  rationale: В данном контексте форма от קום в каузативной породе означает, что Бог поставит или воздвигнет руководителей над народом. «Поставлю» естественно звучит по-русски и ясно передаёт назначение по Божьей инициативе.
- source_word: עֲלֵיהֶם
  choice: над ними
  rationale: Предлог עַל при обозначении руководства выражает власть и ответственность по отношению к народу; буквальное «над ними» сохраняет эту связь.
- source_word: רֹעִים
  choice: пастырей
  rationale: Слово буквально обозначает пастухов, но здесь метафорически относится к руководителям народа. «Пастырей» сохраняет образ и соответствует возвышенному пророческому контексту, не заменяя метафору толкованием «руководители».
- source_word: וְרָעוּם
  choice: которые будут пасти их
  rationale: Однокоренной глагол продолжает образ пастырей. Русское «пасти» сохраняет повтор и не сужает смысл до одного лишь кормления.
- source_word: וְלֹא יִירְאוּ עוֹד
  choice: они больше не будут бояться
  rationale: Передаёт значение страха и временной оттенок עוֹד — прекращение прежнего состояния.
- source_word: וְלֹא יֵחַתּוּ
  choice: ни приходить в смятение
  rationale: Нифаль от חתת может означать быть сокрушённым страхом, устрашённым или приведённым в смятение. Выбранный оборот отличает это состояние от простого страха и естественно сочетается с предыдущей фразой.
- source_word: וְלֹא יִפָּקֵדוּ
  choice: и никто из них не пропадёт
  rationale: Нифаль от פקד здесь, вероятнее всего, означает отсутствие — никто из стада не окажется пропавшим или неучтённым. Формулировка передаёт распределительный смысл, хотя допускает и близкие понимания, отмеченные в сноске.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — устойчивая формула пророческого изречения. «Возвещает» передаёт её торжественный характер, а «Яхве» воспроизводит личное имя יהוה, не заменяя его титулом.
theological_decisions:
- issue: Сохранение образа пастырей
  choice: Оставить слова «пастыри» и «пасти»
  alternative: 'Передать толковательно: «руководители, которые будут заботиться о них»'
  rationale: Образ пастыря связывает стих с ближайшим контекстом о негодных и поставленных Богом руководителях. Его буквальное сохранение не сужает пророческую метафору до одного вида управления.
- issue: Смысл וְלֹא יִפָּקֵדוּ
  choice: «никто из них не пропадёт»
  alternative: «никого из них не будет недоставать» или «они не будут терпеть недостатка»
  rationale: В контексте стада наиболее вероятна мысль о том, что ни один его член не будет отсутствовать или потерян. Сноска сохраняет лексическую неоднозначность и не превращает фразу в специальное богословское утверждение о спасении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Повтор «пастырей… пасти» намеренно сохраняет еврейский образ и однокоренную словесную связь. Местоимение «они» относится к народу, представленному как стадо.
