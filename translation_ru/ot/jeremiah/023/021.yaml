base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/021.yaml
  text: I did not send the prophets[a], yet they ran; I did not speak to them, yet they prophesied.
translation:
  language: ru
  text: Я не посылал пророков, а они побежали[a]; я не говорил им, а они пророчествовали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и они побежали». Еврейский союз может означать простое «и», но в данном контексте выражает резкое противопоставление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַחְתִּי
  choice: посылал
  rationale: Обычное значение глагола — «посылать». В пророческом контексте он подразумевает поручение и полномочия от Бога, но перевод «посылал» сохраняет исходный образ без излишнего толкования.
- source_word: הַנְּבִאִים
  choice: пророков
  rationale: Определённость еврейской формы понятна из контекста; в русском языке «пророков» звучит естественно и не добавляет указательного оттенка «этих».
- source_word: רָצוּ
  choice: побежали
  rationale: Глагол буквально означает «бежать». Здесь образно говорится о поспешном выступлении без Божьего поручения; «побежали» сохраняет яркий образ оригинала.
- source_word: דִבַּרְתִּי אֲלֵיהֶם
  choice: говорил им
  rationale: Еврейское сочетание прямо означает обращённую к ним речь. Русское «говорил им» ясно передаёт отсутствие Божьего откровения, не добавляя иных оттенков.
- source_word: נִבָּאוּ
  choice: пророчествовали
  rationale: Это обычный еврейский глагол для пророческой речи; «пророчествовали» является точным и естественным русским соответствием.
- source_word: וְהֵם
  choice: а они
  rationale: 'Хотя союз ו может означать простое «и», здесь параллельные отрицательные утверждения создают явное противопоставление: Бог не посылал и не говорил, однако они действовали. Союз «а» естественно передаёт этот контраст.'
- source_word: לֹא
  choice: не
  rationale: Отрицание с формами совершенного вида в данном контексте отрицает состоявшееся в прошлом действие; русская конструкция «не посылал / не говорил» передаёт это естественно.
theological_decisions:
- issue: Характер деятельности ложных пророков
  choice: Стих утверждает, что пророки действовали без Божьего поручения и без полученного от Него слова.
  alternative: Слова о том, что они «побежали», можно было бы понять лишь как упрёк в поспешности, не отрицая полностью их призвания.
  rationale: Парные утверждения «Я не посылал» и «Я не говорил им» убедительно указывают на отсутствие Божьих полномочий и откровения. Перевод сохраняет это обвинение, но не развивает его в более широкое учение о пророчестве.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом прямой Божьей речи. Буквенный образ «побежали» сохранён намеренно; местоимение «Я» написано с прописной буквы как часть прямой речи Бога.
