base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/026.yaml
  text: How long will this be in the heart of the prophets who prophesy falsehood[b][a], and who prophesy the deceit of their own heart?
translation:
  language: ru
  text: Доколе это будет[b] в сердце пророков, пророчествующих ложь[a] и возвещающих обман своего сердца?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или короче: «лжепророков».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза эллиптична; более буквально начало стиха можно передать: «Доколе? Есть ли в сердце пророков…?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Доколе
  rationale: Устойчивое литературное выражение вопроса о продолжительности, передающее также Божье негодование.
- source_word: הֲיֵשׁ בְּלֵב
  choice: это будет в сердце
  rationale: 'Еврейская конструкция эллиптична: вопросительная частица с экзистенциальным יֵשׁ буквально дает «есть ли в сердце». В основном тексте подразумеваемое «это» выражено ради связности, а буквальная конструкция отмечена в сноске.'
- source_word: הַנְּבִאִים
  choice: пророков
  rationale: Прямое соответствие существительному во множественном числе.
- source_word: נִבְּאֵי הַשָּׁקֶר
  choice: пророчествующих ложь
  rationale: Сохраняет деятельный, словесный смысл выражения и акцент на ложном содержании пророчества, не сводя его лишь к наименованию «лжепророки».
- source_word: וּנְבִיאֵי תַּרְמִת לִבָּם
  choice: пророков, возвещающих обман собственного сердца
  rationale: Передает параллельное определение пророков и указывает, что источником обмана служит их собственное внутреннее побуждение.
- source_word: תַּרְמִת
  choice: обман
  rationale: 'Передает нравственно отрицательный смысл существительного: обман, коварство, ложь.'
- source_word: לִבָּם
  choice: собственного сердца
  rationale: Сохраняет библейский образ сердца как средоточия мысли, намерения и воли; «собственного» ясно обозначает внутренний источник пророчества.
theological_decisions:
- issue: Антропологический смысл לֵב
  choice: сердце
  alternative: ум; внутреннее существо
  rationale: «Сердце» сохраняет широкий древнееврейский смысл, включающий мысль, намерение и волю, не сужая его до одной интеллектуальной способности.
- issue: Передача נִבְּאֵי הַשָּׁקֶר
  choice: пророчествующих ложь
  alternative: лжепророков
  rationale: Избранная передача сохраняет акцент на действии и содержании их пророчества; краткий вариант дан в сноске как допустимый.
- issue: Эллипсис הֲיֵשׁ בְּלֵב
  choice: это будет в сердце
  alternative: есть ли в сердце
  rationale: 'Основной текст раскрывает подразумеваемый смысл, но не устраняет подлинную синтаксическую неоднозначность: более буквальная форма сохраняется в сноске.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Доколе» уместно передает риторическое негодование; причастие «пророчествующих» сохраняет словесную силу оригинала. Все сноски отмечены в основном тексте.
