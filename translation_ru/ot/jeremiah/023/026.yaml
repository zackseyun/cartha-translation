  terminology: «Пророчествующих ложь», «обман своего сердца» и «сердце» удачно сохраняют словесный характер обвинения, значение תַּרְמִית и древнееврейский антропологический образ. «Своего», а не «собственного», достаточно ясно указывает на источник обмана и звучит менее тяжеловесно.
