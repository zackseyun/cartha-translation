  text: לָ/כֵ֣ן הִנְ/נִ֔י וְ/נָשִׁ֥יתִי אֶתְ/כֶ֖ם נָשֹׁ֑א וְ/נָטַשְׁתִּ֣י אֶתְ/כֶ֗ם וְ/אֶת הָ/עִיר֙ אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם וְ/לַ/אֲבוֹתֵי/כֶ֖ם מֵ/עַ֥ל פָּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/039.yaml
  text: Therefore[a], behold, I will surely lift you up and cast you away, you and the city that I gave to you and to your fathers[b], from before my face.
translation:
  language: ru
  text: 'Поэтому вот: Я непременно подниму вас[a] и отброшу — вас и город, который Я дал вам и вашим предкам, — от лица Моего.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я совершенно забуду вас»; еврейский текст здесь труден. Возможен также смысл: «Я непременно унесу вас».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «из Моего присутствия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие из предшествующего обличения.
- source_word: הִנְנִי
  choice: вот
  rationale: Сохраняет торжественную пророческую указательность выражения, оставаясь естественным в современном литературном русском.
- source_word: וְנָשִׁיתִי ... נָשֹׂא
  choice: Я непременно подниму вас
  rationale: Следует данной масоретской форме и сохраняет связь с образом поднятия или несения, а усилительный инфинитив передаёт словом «непременно». В сочетании с последующим «отброшу прочь» выражение имеет иронический, а не возвышающий смысл. Трудность еврейского текста и чтение «забуду» отмечены в сноске.
- source_word: וְנָטַשְׁתִּי
  choice: и отброшу прочь
  rationale: Передаёт судебное удаление и оставление; «прочь» естественно связывает глагол с последующим «от лица Моего».
- source_word: הָעִיר
  choice: город
  rationale: Сохраняет нарицательное обозначение исходного текста, не подставляя прямо имя Иерусалима.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: который Я дал вам и вашим предкам
  rationale: Точно передаёт дарование города нынешнему поколению и его предкам; «предкам» в современном русском естественнее буквального «отцам» в данном историческом значении.
- source_word: מֵעַל פָּנָי
  choice: от лица Моего
  rationale: Сохраняет антропоморфный образ лица Бога и торжественный регистр; более смысловой вариант дан в сноске.
theological_decisions:
- issue: Лексическая и текстовая неоднозначность וְנָשִׁיתִי ... נָשֹׂא
  choice: Я непременно подниму вас
  alternative: Я совершенно забуду вас; Я непременно унесу вас
  rationale: Основной текст сохраняет трудную форму и возможную игру с корнем נשׂא в контексте спора о «бремени/пророчестве». Поскольку сочетание форм допускает и широко засвидетельствованное понимание от корня со значением «забывать», этот вариант не устраняется, а приводится в сноске.
- issue: Образ удаления מֵעַל פָּנָי
  choice: от лица Моего
  alternative: из Моего присутствия
  rationale: Буквальный образ сохраняет личный и заветный характер Божьего присутствия, а более гладкое смысловое выражение приводится как допустимая альтернатива.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Порядок дополнений и тире сохраняют повторное «вас» и подчёркивают, что приговор относится и к людям, и к городу; архаизирующие элементы ограничены формулой «от лица Моего», необходимой для сохранения исходного образа.
