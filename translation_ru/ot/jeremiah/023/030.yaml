  text: לָ/כֵ֛ן הִנְ/נִ֥י עַל הַ/נְּבִאִ֖ים נְאֻם יְהוָ֑ה מְגַנְּבֵ֣י דְבָרַ֔/י אִ֖ישׁ מֵ/אֵ֥ת רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/030.yaml
  text: Therefore[a], behold, I am against the prophets, declares Yahweh, who steal my words, each from his neighbor.
translation:
  language: ru
  text: «Итак, вот Я — против пророков, — возвещает Яхве, — которые крадут Мои слова — каждый у своего ближнего[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждый у своего товарища».'
    reason: Сохраняет возможный лексический оттенок еврейского רֵעֵהוּ («ближний», «товарищ») без изменения распределительной конструкции оригинала.
lexical_decisions:
- source_word: לָכֵן
  choice: Итак
  rationale: Передаёт вывод и переход к приговору на основании предшествующего обличения; звучит естественно в современной русской пророческой речи.
- source_word: הִנְנִי עַל
  choice: вот Я — против
  rationale: Сохраняет и призыв к вниманию, и подчёркнутое объявление личного противостояния Яхве пророкам.
- source_word: הַנְּבִאִים
  choice: пророков
  rationale: Прямое соответствие форме множественного числа; речь идёт о людях, выдающих свою речь за пророческую.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую формулу божественного изречения с её торжественной силой и сохраняет личное имя יהוה.
- source_word: מְגַנְּבֵי
  choice: которые крадут
  rationale: Причастие характеризует этих пророков постоянным или типичным действием; придаточное предложение естественно по-русски.
- source_word: דְבָרַי
  choice: Мои слова
  rationale: Сохраняет множественное число и не сводит выражение к абстрактному единственному «слово» или толковательному «весть».
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: друг у друга
  rationale: 'Естественно передаёт распределительно-взаимный смысл: каждый пророк присваивает слова другого. Более буквальная форма приведена в сноске.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие без замены имени титулом.
- issue: Смысл обвинения в краже слов
  choice: крадут Мои слова друг у друга
  alternative: каждый крадёт Мои слова у своего ближнего
  rationale: 'Перевод сохраняет намеренную резкость образа: ложные пророки присваивают друг у друга высказывания, представляемые как слова Яхве. Он не уточняет сверх текста, каким именно образом они это делают.'
- issue: Выражение противостояния עַל в формуле הִנְנִי עַל
  choice: вот Я — против
  alternative: вот Я обращусь против; вот Я на
  rationale: В контексте суда предлог выражает враждебную направленность. Настоящая именная конструкция сохраняет напряжённую непосредственность еврейского объявления.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Тире передаёт резкость формулы «вот Я — против», а обрамление слов «возвещает Яхве» отделяет формулу божественного изречения. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
