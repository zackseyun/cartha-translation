  text: לָ/כֵ֞ן כֹּֽה אָמַ֨ר יְהוָ֤ה צְבָאוֹת֙ עַל הַ/נְּבִאִ֔ים הִנְ/נִ֨י מַאֲכִ֤יל אוֹתָ/ם֙ לַֽעֲנָ֔ה וְ/הִשְׁקִתִ֖י/ם מֵי רֹ֑אשׁ כִּ֗י מֵ/אֵת֙ נְבִיאֵ֣י יְרוּשָׁלִַ֔ם יָצְאָ֥ה חֲנֻפָּ֖ה לְ/כָל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/015.yaml
  text: 'Therefore this is what Yahweh of Armies says concerning the prophets: ‘Look[a], I am feeding them wormwood and making them drink poisoned water, because from the prophets of Jerusalem ungodliness has gone out into all the land.’'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве Воинств о пророках:


    «Вот, Я накормлю их полынью

    и напою отравленной водой[a],

    потому что от пророков Иерусалима

    нечестие распространилось по всей земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воды рош». «Рош» обозначает горькое или ядовитое вещество; также возможно: «водой с горечью» или «водой с ядом».'
    reason: Уточняет буквальную форму еврейского выражения и сохраняет неопределённость значения רֹאשׁ.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией «Яхве», а צְבָאוֹת — прозрачным для современного читателя словом «Воинств», сохраняющим образ небесных или военных сил.
- source_word: עַל הַנְּבִאִים
  choice: о пророках
  rationale: Предлог עַל при формуле речи допускает значения «о» и «против». Нейтральное «о» сохраняет эту широту, тогда как осуждение ясно выражено самим пророчеством.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» естественно передаёт эмфатический указательный оборот и торжественное Божье заявление, не добавляя отсутствующего в тексте отдельного наречия времени.
- source_word: מַאֲכִיל אוֹתָם לַעֲנָה
  choice: накормлю их полынью
  rationale: Сохранены каузативное значение глагола и конкретный образ горькой полыни как орудия суда; русское будущее естественно выражает предстоящую угрозу в данном пророческом контексте.
- source_word: וְהִשְׁקִתִים מֵי רֹאשׁ
  choice: и напою отравленной водой
  rationale: Каузативная форма передана глаголом «напою»; רֹאשׁ в этом сочетании обозначает горькое или ядовитое вещество, поэтому «отравленная вода» ясно передаёт смысл.
- source_word: חֲנֻפָּה
  choice: нечестие
  rationale: Слово охватывает безбожие, осквернение и нравственную испорченность; «нечестие» сохраняет религиозно-нравственный оттенок и звучит естественно в литературном русском.
- source_word: יָצְאָה ... לְכָל הָאָרֶץ
  choice: распространилось по всей земле
  rationale: Идиоматическая русская формулировка передаёт исходящее из Иерусалима и охватывающее всю страну влияние; «земля» здесь не обязательно означает весь мир.
theological_decisions:
- issue: Образ Божьего суда над пророками
  choice: Сохранены конкретные образы кормления полынью и поения отравленной водой.
  alternative: 'Передать обобщённо: «Я подвергну их горькому наказанию».'
  rationale: Конкретная образность еврейского текста несёт богословскую силу воздаяния и не должна растворяться в поясняющем пересказе.
- issue: Временная форма Божьей угрозы
  choice: «накормлю… напою»
  alternative: «кормлю… пою» или «собираюсь накормить…»
  rationale: Еврейское הִנְנִי с причастием представляет действие как решительно предстоящее или уже вступающее в силу. Русское совершенное будущее естественно передаёт угрозу, не делая её текущим буквальным действием и не добавляя излишней перифразы.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Синтаксис разбит на поэтические строки; архаизмы сведены к минимуму, при этом сохранены личное имя Бога и конкретные образы исходного текста.
