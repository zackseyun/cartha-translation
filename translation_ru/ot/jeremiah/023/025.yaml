base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/025.yaml
  text: I have heard what the prophets have said[a], those who prophesy lies in my name, saying, ‘I have dreamed! I have dreamed!’
translation:
  language: ru
  text: 'Я слышал, что сказали пророки, которые от Моего имени пророчествуют ложь[a]: «Мне приснилось! Мне приснилось!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые лживо пророчествуют от Моего имени».'
    reason: 'Лексико-синтаксическая альтернатива: שֶׁקֶר может обозначать как содержание пророчества («ложь»), так и его ложный характер («лживо»).'
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Я слышал
  rationale: Перфект qal, 1-е лицо единственного числа. В данном контексте русское прошедшее время естественно передаёт совершившееся восприятие, имеющее значение для нынешнего обличения.
- source_word: אֵת אֲשֶׁר אָמְרוּ
  choice: что говорят
  rationale: Сочетание показателя прямого дополнения с относительной частицей естественно передаётся как «что». Прошедшая форма אָמְרוּ в русском может быть передана настоящим временем внутри продолжающейся характеристики этих пророков.
- source_word: הַנְּבִאִים הַנִּבְּאִים
  choice: пророки, которые… пророчествуют
  rationale: Сохранены существительное «пророки» и приложенный к нему субстантивированный причастный оборот; повтор корня נבא по возможности отражён русскими однокоренными словами.
- source_word: בִּשְׁמִי
  choice: от Моего имени
  rationale: Естественная русская формула для притязания на Божье полномочие; прописная буква ясно указывает на говорящего Господа.
- source_word: שֶׁקֶר
  choice: ложь
  rationale: Конкретное существительное сохраняет обвинительную силу еврейского текста; грамматически возможно также обстоятельственное понимание «лживо».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Обычный ввод прямой речи естественно выражен двоеточием без избыточного «говоря».
- source_word: חָלַמְתִּי חָלָמְתִּי
  choice: Мне приснился сон! Мне приснился сон!
  rationale: Идиоматичная русская передача глагола חלם; повтор и восклицательная выразительность сохранены как подчёркнутая претензия на вещий сон.
theological_decisions:
- issue: Характер ложного пророчества
  choice: пророчествуют ложь от Моего имени
  alternative: лживо пророчествуют от Моего имени
  rationale: Еврейское שֶׁקֶר допускает предметное и обстоятельственное понимание. Основной текст сохраняет конкретное «ложь», а сноска отмечает подлинную синтаксическую неоднозначность, не разрешая её богословски.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Сохранены обвинительная прямота, повтор корня «пророк/пророчествуют» и эмфатическое двукратное заявление о сне.
