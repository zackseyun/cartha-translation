    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим контекстом суда и естественно звучит по-русски.
- source_word: גַם ... גַם
  choice: и ... и
  rationale: Повторение גַם охватывает обе названные группы; русская парная конструкция «и ... и» ясно передаёт этот смысл.
- source_word: נָבִיא
  choice: пророк
  rationale: Обычное и контекстуально точное соответствие еврейскому слову.
- source_word: כֹּהֵן
  choice: священник
  rationale: Стандартное соответствие, уместное в храмовом контексте.
- source_word: חָנֵפוּ
  choice: нечестивы
  rationale: Форма от חנף обозначает нравственно-религиозную испорченность и безбожие; «нечестивы» передаёт это шире и точнее, чем узкое «лицемерны».
- source_word: גַּם
  choice: даже
  rationale: 'Третье גַם усиливает обвинение: зло обнаружено даже в принадлежащем Яхве доме.'
- source_word: בְּבֵיתִי
  choice: в Моём доме
  rationale: Сохраняет буквальный образ еврейского текста; по контексту речь идёт о храме.
- source_word: מָצָאתִי
  choice: Я нашёл
  rationale: Прямо передаёт перфект первого лица, не добавляя отсутствующей в тексте аспектуальной конкретизации.
- source_word: רָעָתָם
  choice: их зло
  rationale: Сохраняет абстрактное единственное число и широкое нравственное значение רָעָה, не сужая его до отдельных проступков.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Естественно передаёт торжественную пророческую формулу заявления, отличая её от простого глагола речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога принятой русской транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; «Яхве» сохраняет имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Характер обвинения в חָנֵפוּ
  choice: нечестивы
  alternative: осквернились; лицемерны; безбожны
  rationale: Выбрано широкое нравственно-религиозное обозначение, чтобы не сводить неоднозначное еврейское слово только к ритуальному осквернению или лицемерию.
translation_notes:
  register: Современный литературный русский язык с торжественностью, подходящей пророческой речи. Синтаксис близок к еврейскому, но естественен для русского читателя; неоднозначность חָנֵפוּ отмечена в сноске.
