base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/010.yaml
  text: If you will indeed remain in this land[a], then I will build you up and not tear you down, and I will plant you and not uproot you[c][b]; for I relent concerning the harm that I did to you.
translation:
  language: ru
  text: Если вы и вправду останетесь в этой земле[a], то Я воздвигну вас, а не разрушу; насажу вас, а не искореню[b], ибо Я сожалею о бедствии, которое причинил вам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская конструкция выражает усиление: «если вы действительно останетесь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «насажу вас и не вырву».'
    reason: lexical_alternative
  - marker: c
    text: 'Также возможно: «Я отступаю от бедствия, которое причинил вам». Еврейское слово здесь означает бедствие или несчастье как Божий суд, а не нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם שׁוֹב תֵּשְׁבוּ
  choice: Если вы и вправду останетесь
  rationale: Условная частица אִם вводит условие, а инфинитив абсолютный שׁוֹב перед личной формой תֵּשְׁבוּ усиливает глагольную мысль. «И вправду останетесь» естественно передаёт это усиление и контекстуальный смысл продолжения жизни в Иудее.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: в этой земле
  rationale: «Земля» сохраняет географический и заветный оттенок אֶרֶץ и звучит естественно в данном контексте.
- source_word: וּבָנִיתִי אֶתְכֶם וְלֹא אֶהֱרֹס
  choice: Я буду созидать вас, а не разрушать
  rationale: Сохранена строительная метафора и резкое противопоставление. «Созидать» применительно к народу естественнее буквального «строить вас» и не добавляет значения повторности, как «восстановлю».
- source_word: וְנָטַעְתִּי אֶתְכֶם וְלֹא אֶתּוֹשׁ
  choice: насаждать вас, а не искоренять
  rationale: Сохранён земледельческий образ Иеремии. «Искоренять» ясно выражает удаление посаженного и образует естественную русскую пару с «насаждать».
- source_word: כִּי נִחַמְתִּי
  choice: потому что Я отказался
  rationale: כִּי вводит основание обещания. Форма נחם с Богом как субъектом здесь указывает на отказ от продолжения совершавшегося суда, а не на признание нравственной вины.
- source_word: אֶל הָרָעָה
  choice: от бедствия
  rationale: רָעָה в контексте означает несчастье или бедствие как суд, а не нравственное зло. «Бедствие» сохраняет серьёзность выражения и избегает ложного смысла.
- source_word: אֲשֶׁר עָשִׂיתִי לָכֶם
  choice: которое навёл на вас
  rationale: Буквально сказано «которое сделал вам»; по-русски «навёл на вас» естественно выражает причинение бедствия, не меняя названного в тексте субъекта действия.
theological_decisions:
- issue: Божественное נחם и совершённое Богом רָעָה
  choice: Я отказался от бедствия, которое навёл на вас
  alternative: Я раскаялся в зле, которое сделал вам
  rationale: 'Контекст говорит об изменении дальнейшего хода суда, а רָעָה обозначает бедствие, не нравственное зло. Формулировка не приписывает Богу моральной вины, но сохраняет напряжённое антропопатическое утверждение текста: Бог сам говорит о бедствии как о том, что Он навёл на народ, и теперь от него отказывается.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм строительного и земледельческого образов сохранён; прописное «Я» употреблено как традиционное обозначение Бога в русском библейском тексте. Все примечания отмечены в основном тексте.
