    rationale: Фраза выражает уже окончательный отказ и меньше передаёт значение сожаления или изменения отношения к бедствию. «Я сожалею о бедствии» ближе к лексическому диапазону נחם и не устраняет антропопатический характер высказывания.
  - severity: low
    issue: Пояснение в примечании a о грамматической конструкции
    rationale: Инфинитив שׁוֹב и личная форма תֵּשְׁבוּ формально не являются формами одного корня; поэтому лучше описать передаваемое конструкцией усиление, не упрощая её морфологический анализ.
  - severity: low
    issue: Видовые формы «буду созидать ... насаждать»
    rationale: Они не искажают смысл, но создают оттенок длительного процесса. Простые будущие формы лучше соответствуют обещанию в пророческой речи и звучат более собранно.
