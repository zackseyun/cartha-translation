  text: וְ/יַגֶּד לָ֨/נוּ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֣ר נֵֽלֶךְ בָּ֑/הּ וְ/אֶת הַ/דָּבָ֖ר אֲשֶׁ֥ר נַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/003.yaml
  text: that Yahweh your God may tell us the way in which we should walk[a], and the thing that we should do.
translation:
  language: ru
  text: чтобы Яхве, твой Бог, указал нам путь, по которому нам идти, и что нам делать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַגֶּד
  choice: чтобы … указал
  rationale: Глагол נגד в породе хифиль означает «сообщить, объявить, дать знать». В сочетании с «путём» русское «указал» естественно передаёт просьбу о Божьем наставлении; союз «чтобы» отражает зависимость этой фразы от просьбы в предыдущем стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является распространённой современной русской транслитерацией тетраграмматона.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Суффикс второго лица мужского рода единственного числа обращён к Иеремии. Прописная буква указывает на Бога Израиля.
- source_word: הַדֶּרֶךְ אֲשֶׁר נֵלֶךְ בָּהּ
  choice: путь, по которому нам идти
  rationale: Сохранён еврейский образ пути как направления поведения и действий. Оборот «по которому нам идти» естественен по-русски и передаёт запрашиваемое руководство, не превращая его в простое предсказание.
- source_word: וְאֶת הַדָּבָר אֲשֶׁר נַעֲשֶׂה
  choice: и что нам делать
  rationale: דבר здесь обозначает дело или требуемое действие, а עשה — «делать». Русская конструкция «что нам делать» точно и естественно передаёт смысл без тяжеловесного буквального «дело, которое нам делать».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» сохраняет имя как имя и ближе к принятой научной реконструкции произношения, тогда как «Господь» заменяет его титулом, а «Иегова» отражает позднюю смешанную форму.
- issue: Модальность просьбы о наставлении
  choice: чтобы … указал; нам идти; нам делать
  alternative: пусть … укажет; мы пойдём; мы сделаем
  rationale: Контекст и формы נֵלֶךְ и נַעֲשֶׂה выражают просьбу узнать надлежащее направление действий, а не обещание или предсказание будущего. Выбранная формулировка сохраняет эту направляющую, но не чрезмерно категоричную модальность.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, с сохранением библейского образа пути. Начальное «чтобы» оставлено со строчной буквы, поскольку стих синтаксически продолжает просьбу предыдущего стиха.
