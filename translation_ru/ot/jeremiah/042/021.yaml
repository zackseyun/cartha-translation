base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/021.yaml
  text: I have told you today[a], but you have not obeyed the voice of Yahweh your God or anything for which he sent me to you.
translation:
  language: ru
  text: Сегодня я сказал вам, но вы не послушались ни голоса Яхве, вашего Бога, ни всего того, с чем Он послал меня к вам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַגִּד
  choice: я сказал
  rationale: Гифиль глагола נגד означает «сообщить, объявить, сказать». В данном контексте естественное русское «я сказал вам» передаёт завершённое возвещение ответа Бога без лишнего уточнения содержания.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Обычное временное значение слова; постановка в начале предложения сохраняет его смысловой акцент и звучит естественно по-русски.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹל
  choice: но вы не послушались голоса
  rationale: Сочетание שמע с בְּקוֹל обозначает не просто слышание, а внимательное слушание, предполагающее повиновение. «Не послушались голоса» сохраняет и образ еврейского текста, и его смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не замещающий его титул.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Точно передаёт форму с местоименным суффиксом второго лица множественного числа.
- source_word: וּלְכֹל אֲשֶׁר שְׁלָחַנִי אֲלֵיכֶם
  choice: не послушались ничего из того, с чем Он послал меня к вам
  rationale: Предлог לְ позволяет отнести эту часть к глаголу «слушать/слушаться». Повтор сказуемого делает связь ясной по-русски, а «с чем Он послал» естественно обозначает порученное пророку послание, не добавляя его содержания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога. Транслитерация сохраняет различие между личным именем и титулом.
- issue: Смысл выражения «слушать голос»
  choice: не послушались
  alternative: не слушали
  rationale: В данном контексте речь идёт о неповиновении возвещённому Божьему слову, однако образ «голоса» сохранён, чтобы не сводить выражение только к исполнению приказа.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «не послушались» выбран ради ясности синтаксиса и сохранения значения повиновения; архаические формы избегаются.
