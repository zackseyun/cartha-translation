  terminology: «Военачальники» адекватно передаёт שָׂרֵי הַחֲיָלִים. Формы «Йоханан», «Кареах», «Йизания», «Хошаия» последовательно ближе к еврейскому тексту. Формула «сын ...» сохранена.
