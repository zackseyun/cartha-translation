  text: וַֽ/יִּגְּשׁוּ֙ כָּל שָׂרֵ֣י הַ/חֲיָלִ֔ים וְ/יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וִֽ/יזַנְיָ֖ה בֶּן הוֹשַֽׁעְיָ֑ה וְ/כָל הָ/עָ֖ם מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/001.yaml
  text: Then all the commanders of the forces approached[a], along with Yohanan son of Kareah and Yizaniah son of Hoshaiah[b], and all the people from the least to the greatest.
translation:
  language: ru
  text: Тогда подошли все военачальники[a], Йоханан, сын Кареаха, Йизания, сын Хошаии, и весь народ — от малого до великого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все начальники войск»; возможно также: «все командиры военных сил».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «от малого до великого» означает всех без исключения, независимо от их положения в обществе.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: подошли
  rationale: Глагол נגשׁ в повествовательной форме обозначает приближение. «Подошли» естественно передаёт движение к Иеремии, понятное из контекста, не добавляя лишних уточнений.
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  choice: все командиры военных отрядов
  rationale: שָׂרֵי — начальники или командиры, а חֲיָלִים здесь обозначает вооружённые силы или отряды. Такой перевод ясно передаёт военный смысл и звучит естественно по-русски.
- source_word: וְיוֹחָנָן בֶּן־קָרֵחַ
  choice: Иоханан, сын Кареаха
  rationale: Имена переданы близко к еврейскому звучанию; формула «сын Кареаха» сохраняет обычное родословное обозначение.
- source_word: וִיזַנְיָה בֶּן־הוֹשַׁעְיָה
  choice: Изания, сын Ошаии
  rationale: Форма «Изания» близко передаёт еврейское יִזַנְיָה и при этом естественна для русского произношения; «Ошаия» отражает еврейское הוֹשַׁעְיָה.
- source_word: וְכָל הָעָם
  choice: и весь народ
  rationale: הָעָם — обычное обозначение народа как сообщества; простой перевод сохраняет собирательный смысл.
- source_word: מִקָּטֹן וְעַד־גָּדוֹל
  choice: от малого до великого
  rationale: Сохранена еврейская меризма, охватывающая всё общество, а не только людей разного возраста или роста.
