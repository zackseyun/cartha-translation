  source_fidelity: 'Смысл и синтаксическое членение в целом переданы верно: וַיִּגְּשׁוּ — «подошли», а מִקָּטֹן וְעַד־גָּדוֹל — меризм «от малого до великого». Однако две формы имён требуют более точной передачи еврейского текста: יוֹחָנָן начинается с йода, а הוֹשַׁעְיָה — с ה, поэтому «Иоханан» и «Ошаия» ослабляют исходную форму.'
