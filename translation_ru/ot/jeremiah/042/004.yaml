  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם יִרְמְיָ֤הוּ הַ/נָּבִיא֙ שָׁמַ֔עְתִּי הִנְ/נִ֧י מִתְפַּלֵּ֛ל אֶל יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כְּ/דִבְרֵי/כֶ֑ם וְֽ/הָיָ֡ה כָּֽל הַ/דָּבָר֩ אֲשֶׁר יַעֲנֶ֨ה יְהוָ֤ה אֶתְ/כֶם֙ אַגִּ֣יד לָ/כֶ֔ם לֹֽא אֶמְנַ֥ע מִ/כֶּ֖ם דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/004.yaml
  text: Then Jeremiah the prophet said to them[a], “I have heard. Behold, I am praying to Yahweh your God according to your words, and whatever Yahweh answers you, I will tell you[b]. I will not withhold a word from you.”
translation:
  language: ru
  text: 'Тогда пророк Иеремия сказал им: «Я вас услышал. Вот, я буду молиться Яхве, вашему Богу, как вы просили[a]. И всё, что Яхве ответит вам, я передам вам. Я не утаю от вас ни слова[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «согласно вашим словам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я ничего не скрою от вас». Буквально: «Я не удержу от вас ни одного слова».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Форма с последовательным waw продвигает повествование; «тогда» естественно передаёт переход к ответу Иеремии.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: пророк Иеремия
  rationale: В русском языке сочетание титула с именем естественно звучит именно в таком порядке.
- source_word: שָׁמַעְתִּי
  choice: Я вас услышал
  rationale: В контексте это ответ на просьбу народа. Добавленное по смыслу «вас» делает реплику естественной по-русски и передаёт принятие просьбы к сведению.
- source_word: הִנְנִי מִתְפַּלֵּל
  choice: Вот, я буду молиться
  rationale: הִנְנִי с причастием обозначает действие, к которому говорящий приступает или намерен приступить. Будущее время в русском естественно передаёт ближайшее намерение, не превращая его в отвлечённое обещание.
- source_word: אֶל יְהוָה אֱלֹהֵיכֶם
  choice: Яхве, вашему Богу
  rationale: Личное имя יהוה передано как «Яхве»; «вашему Богу» сохраняет обращённость слов Иеремии к просителям.
- source_word: כְּדִבְרֵיכֶם
  choice: как вы просили
  rationale: Буквально выражение означает «согласно вашим словам», но в данном контексте речь идёт об их просьбе. Естественный перевод вынесен в текст, буквальная форма отмечена в сноске.
- source_word: כָּל הַדָּבָר אֲשֶׁר יַעֲנֶה יְהוָה אֶתְכֶם
  choice: всё, что Яхве ответит вам
  rationale: דָּבָר здесь входит в конструкцию со значением совокупного содержания ответа; «всё, что» передаёт её естественно, без избыточного повторения слова «слово».
- source_word: אַגִּיד לָכֶם
  choice: я передам вам
  rationale: Hiphil глагола נגד означает сообщить или объявить. «Передам» уместно для точного донесения полученного ответа.
- source_word: לֹא אֶמְנַע מִכֶּם דָּבָר
  choice: Я не утаю от вас ни слова
  rationale: Формулировка близко сохраняет образ еврейского текста и подчёркивает полноту передачи Божьего ответа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте употреблено собственное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: Отношение выражения «вашему Богу» к говорящему
  choice: сохранено буквальное «вашему Богу»
  alternative: нашему Богу
  rationale: Иеремия дословно повторяет формулировку просителей. Текст не следует пояснять так, будто местоимение отрицает или специально утверждает его собственное отношение к Богу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис упрощён лишь там, где буквальная еврейская конструкция звучала бы неестественно; повтор имени Яхве и заключительное «ни слова» сохранены ради смыслового акцента.
