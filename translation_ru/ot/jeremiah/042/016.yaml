source:
  edition: WLC
  text: וְ/הָיְתָ֣ה הַ/חֶ֗רֶב אֲשֶׁ֤ר אַתֶּם֙ יְרֵאִ֣ים מִמֶּ֔/נָּה שָׁ֛ם תַּשִּׂ֥יג אֶתְ/כֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הָ/רָעָ֞ב אֲשֶׁר אַתֶּ֣ם דֹּאֲגִ֣ים מִמֶּ֗/נּוּ שָׁ֣ם יִדְבַּ֧ק אַחֲרֵי/כֶ֛ם מִצְרַ֖יִם וְ/שָׁ֥ם תָּמֻֽתוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/016.yaml
  text: Then the sword that you fear will overtake you there in the land of Egypt[a], and the famine that you dread will follow close after you there in Egypt[b], and there you will die.
translation:
  language: ru
  text: И тогда меч, которого вы боитесь, настигнет вас там, в земле Египта, и голод, о котором вы тревожитесь[a], будет неотступно преследовать вас[b] там, в Египте, и там вы умрёте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о котором вы беспокоитесь».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пристанет вслед за вами» — образ неотступного преследования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: И тогда ... настигнет
  rationale: Конструкция вводит следствие предшествующего предостережения; «и тогда» естественно передаёт связь и предсказательный смысл.
- source_word: הַחֶרֶב
  choice: меч
  rationale: Сохранён конкретный пророческий образ; здесь меч метонимически связан с войной и насильственной смертью, но перевод не раскрывает образ толкованием.
- source_word: יְרֵאִים מִמֶּנָּה
  choice: которого вы боитесь
  rationale: Прямое и естественное соответствие ירא с предлогом מן, без усиления значения.
- source_word: תַּשִּׂיג אֶתְכֶם
  choice: настигнет вас
  rationale: Hiphil глагола נשׂג выражает достижение или настижение убегающего и поддерживает образ неизбежной погони.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: там, в земле Египетской
  rationale: Сохранены и שָׁם «там», и полное географическое обозначение; традиционная форма звучит достойно и понятна современному читателю.
- source_word: הָרָעָב
  choice: голод
  rationale: В контексте речь идёт о бедствии, то есть о голоде как массовом лишении пищи, а не о личном ощущении голода.
- source_word: דֹּאֲגִים מִמֶּנּוּ
  choice: о котором вы тревожитесь
  rationale: דאג обозначает тревогу, беспокойство или озабоченность; перевод сохраняет отличие от ירא «бояться» в первой половине стиха.
- source_word: יִדְבַּק אַחֲרֵיכֶם
  choice: будет неотступно преследовать вас
  rationale: Буквальный образ «прилипнет вслед за вами» обозначает неотвязное следование; естественная русская формулировка передаёт настойчивость погони, а буквальный образ отмечен в сноске.
- source_word: מִצְרַיִם
  choice: там, в Египте
  rationale: 'Повтор места сохранён ради риторического акцента: именно Египет, где ищут безопасности, станет местом бедствия.'
- source_word: וְשָׁם תָּמֻתוּ
  choice: и там вы умрёте
  rationale: Прямо переданы будущее время и повторное emphатическое «там».
theological_decisions:
- issue: Характер образов суда — «меч» и «голод»
  choice: Сохранить конкретные образы «меч» и «голод»
  alternative: 'Передать толковательно: «война» и «голодная смерть»'
  rationale: Еврейский текст употребляет выразительные пророческие образы суда. Их сохранение не сужает и не расширяет смысл конфессиональным толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Повтор «там» и конкретные образы исходного текста сохранены; архаичные синтаксические формы исключены.
