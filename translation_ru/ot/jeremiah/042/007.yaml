lexical_decisions:
- source_word: וַיְהִי מִקֵּץ עֲשֶׂרֶת יָמִים
  choice: Через десять дней
  rationale: Естественно передаёт древнееврейскую повествовательную формулу и завершение указанного десятидневного срока без архаичного оборота «и было».
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и представляет речь как Божье откровение, а не просто общее сообщение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיְהִי ... אֶל יִרְמְיָהוּ
  choice: было к Иеремии
  rationale: Сохраняет традиционную и понятную русскую библейскую формулу, близкую к синтаксису исходного текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное Божье имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Начальная древнееврейская формула передана естественным временным оборотом; формула «слово Яхве было к Иеремии» намеренно сохраняет библейский характер и близость к оригиналу.
