base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/019.yaml
  text: 'Yahweh has spoken concerning you[a], remnant of Judah: Do not go to Egypt. Know for certain that I have warned you today.'
translation:
  language: ru
  text: 'Яхве сказал о вас, остаток Иуды: «Не ходите в Египет. Твёрдо знайте, что сегодня Я предостерёг вас[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «торжественно свидетельствовал против вас». Еврейский глагол может означать как настойчивое предостережение, так и формальное свидетельство против кого-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר
  choice: сказал
  rationale: Перфект обозначает совершившееся высказывание; в современном русском прошедшее совершенного вида естественно передаёт его актуальный результат.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона как имени Бога через титул «Господь» понятна современному читателю и соответствует устойчивому библейскому регистру.
- source_word: עֲלֵיכֶם
  choice: о вас
  rationale: Предлог עַל при דִּבֶּר естественно означает «о, относительно»; вариант «против вас» здесь преждевременно усилил бы враждебный оттенок.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: остаток Иуды
  rationale: «Остаток» сохраняет как непосредственный смысл уцелевшей части народа, так и характерное для пророческой речи богословское звучание.
- source_word: אַל תָּבֹאוּ מִצְרָיִם
  choice: Не ходите в Египет
  rationale: Запрет передан повелительной конструкцией; «ходите» естественно описывает намерение отправиться в страну, тогда как буквальное «не входите» звучало бы менее уместно в контексте.
- source_word: יָדֹעַ תֵּדְעוּ
  choice: Твёрдо знайте
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает высказывание; «твёрдо знайте» передаёт эмфазу кратко и естественно.
- source_word: הַעִידֹתִי בָכֶם
  choice: я предостерёг вас
  rationale: Hiphil глагола עוּד может обозначать торжественное свидетельство или настойчивое предупреждение. В данном контексте «предостерёг» ясно передаёт коммуникативную функцию, а формально-судебный оттенок отражён в примечании.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямой и естественный современный эквивалент временного наречия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбрана укоренённая в русской библейской речи передача, не вводящая конфессионально специфического толкования; при этом слово функционирует как обозначение Бога Израиля.
- issue: Смысл שְׁאֵרִית
  choice: остаток Иуды
  alternative: уцелевшие из Иуды
  rationale: «Остаток» сохраняет намеренную связь конкретной группы уцелевших с более широким пророческим мотивом остатка, не развивая этот мотив сверх текста.
- issue: Характер действия הַעִידֹתִי בָכֶם
  choice: предостерёг вас
  alternative: торжественно свидетельствовал против вас
  rationale: Основной текст передаёт контекстуальный смысл предупреждения, а примечание сохраняет возможный формально-судебный и направленный против адресатов оттенок.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Прямая заповедь выделена кавычками; синтаксис краток и доступен. Эмфаза еврейской конструкции сохранена выражением «твёрдо знайте», а лексическая неоднозначность עוּד — примечанием.
