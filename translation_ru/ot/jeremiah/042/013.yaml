  text: וְ/אִם אֹמְרִ֣ים אַתֶּ֔ם לֹ֥א נֵשֵׁ֖ב בָּ/אָ֣רֶץ הַ/זֹּ֑את לְ/בִלְתִּ֣י שְׁמֹ֔עַ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/013.yaml
  text: But if you say[a], ‘We will not stay in this land,’ not obeying the voice of Yahweh your God—
translation:
  language: ru
  text: 'Но если вы скажете: «Мы не останемся в этой земле», — чтобы не послушаться[a] голоса Яхве, вашего Бога, —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы не слушать голоса Яхве, вашего Бога». Еврейское выражение «слушать голос» часто подразумевает послушание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Сочетание союза с условной частицей вводит противопоставленное предыдущему обещанию условие; «но если» естественно передаёт этот поворот.
- source_word: אֹמְרִים אַתֶּם
  choice: вы скажете
  rationale: Причастие с явно выраженным местоимением в условной конструкции по-русски естественно передаётся личной формой будущего времени.
- source_word: לֹא נֵשֵׁב
  choice: мы не останемся
  rationale: В данном контексте יָשַׁב означает оставаться и жить в земле; «не останемся» точно выражает решение покинуть её.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: в этой земле
  rationale: «Земля» сохраняет географический и заветный оттенок אֶרֶץ.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: чтобы не послушаться
  rationale: לְבִלְתִּי выражает отрицательную цель, а שׁמע в сочетании с «голосом» подразумевает не только слышание, но и отклик послушания.
- source_word: בְּקוֹל
  choice: голоса
  rationale: Сохранён библейский образ голоса, хотя глагол «послушаться» передаёт практический смысл выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, обозначенное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Сохранено обращение к слушателям и заветное притяжательное отношение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст непосредственно употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога.
- issue: Значение שׁמע בְקול в заветном контексте
  choice: послушаться голоса
  alternative: слушать голос; услышать голос
  rationale: Выражение подразумевает действенный отклик и повиновение, но слово «голос» сохраняет образ непосредственной Божьей речи.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Тире в конце показывает, что условная конструкция продолжается в следующем стихе; формулировка «чтобы не послушаться» сохраняет целевое значение еврейского оборота.
