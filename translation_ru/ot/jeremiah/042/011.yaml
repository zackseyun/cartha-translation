  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַל תִּֽירְא֗וּ מִ/פְּנֵי֙ מֶ֣לֶךְ בָּבֶ֔ל אֲשֶׁר אַתֶּ֥ם יְרֵאִ֖ים מִ/פָּנָ֑י/ו אַל תִּֽירְא֤וּ מִמֶּ֨/נּוּ֙ נְאֻם יְהוָ֔ה כִּֽי אִתְּ/כֶ֣ם אָ֔נִי לְ/הוֹשִׁ֧יעַ אֶתְ/כֶ֛ם וּ/לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/011.yaml
  text: Do not fear the king of Babylon[a], before whom you are afraid. Do not fear him, declares Yahweh[b], for I am with you to save you and to deliver you from his hand.
translation:
  language: ru
  text: Не бойтесь царя Вавилона, которого вы боитесь. Не бойтесь его, — возвещает Яхве, — потому что Я с вами, чтобы спасти вас и избавить вас от его руки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּירְאוּ / יְרֵאִים
  choice: бойтесь / боитесь
  rationale: Повтор одного русского корня передаёт настойчивое повторение форм ירא; настоящее время «боитесь» естественно выражает продолжающийся страх.
- source_word: מִפְּנֵי ... מִפָּנָיו
  choice: царя Вавилона, которого вы боитесь
  rationale: После ירא сочетание מן + פנים идиоматически обозначает объект страха. Буквальное «перед лицом которого» в современном русском было бы тяжеловесным и могло бы затемнить смысл.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Обычная и ясная передача еврейской сопряжённой конструкции.
- source_word: מִמֶּנּוּ
  choice: его
  rationale: Предлог после ירא входит в еврейскую конструкцию управления; по-русски естественно «не бойтесь его».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу как торжественное божественное заявление, не превращая её в отдельное существительное «изречение».
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация сохраняет личное имя Бога, непосредственно представленное тетраграмматоном в исходном тексте.
- source_word: כִּי אִתְּכֶם אָנִי
  choice: потому что Я с вами
  rationale: כִּי вводит основание запрета бояться; порядок «Я с вами» сохраняет явное местоимение и звучит естественно по-русски.
- source_word: לְהוֹשִׁיעַ
  choice: чтобы спасти вас
  rationale: Инфинитив с ל выражает цель; «спасти» сохраняет основное значение Hiphil от ישׁע и отличается от следующего глагола.
- source_word: וּלְהַצִּיל
  choice: и избавить вас
  rationale: «Избавить» естественно передаёт נצל и сохраняет смысловое сочетание двух близких, но не тождественных глаголов.
- source_word: מִיָּדוֹ
  choice: от его руки
  rationale: Сохранён понятный библейский образ руки как власти и контроля; он не сводится без необходимости к пояснительному «от его власти».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» сохраняет это имя, тогда как «Господь» передаёт традиционную замену при чтении, а не написанную форму.
- issue: Соотношение לְהוֹשִׁיעַ и וּלְהַצִּיל
  choice: спасти вас и избавить вас
  alternative: спасти и вырвать вас
  rationale: Сохранены два отдельных глагола без догматического разграничения видов спасения; их близость и риторическое усиление остаются видимыми.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Повтор «бойтесь… боитесь… бойтесь» намеренно сохранён. Пунктуация выделяет вводную формулу речи. Архаизмы и конфессионально маркированная замена божественного имени не использованы.
