  text: כִּ֣י התעתי/ם בְּ/נַפְשֽׁוֹתֵי/כֶם֒ כִּֽי אַתֶּ֞ם שְׁלַחְתֶּ֣ם אֹתִ֗/י אֶל יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לֵ/אמֹ֔ר הִתְפַּלֵּ֣ל בַּעֲדֵ֔/נוּ אֶל יְהוָ֖ה אֱלֹהֵ֑י/נוּ וּ/כְ/כֹל֩ אֲשֶׁ֨ר יֹאמַ֜ר יְהוָ֧ה אֱלֹהֵ֛י/נוּ כֵּ֥ן הַגֶּד לָ֖/נוּ וְ/עָשִֽׂינוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/020.yaml
  text: For you have deceived yourselves[a], because you sent me to Yahweh your God, saying, ‘Pray for us to Yahweh our God, and whatever Yahweh our God says, tell us, and we will do it.’
translation:
  language: ru
  text: 'Ибо вы ввели самих себя в заблуждение[a], потому что послали меня к Яхве, вашему Богу, сказав: «Помолись за нас Яхве, нашему Богу, и передай нам всё, что скажет Яхве, наш Бог, — и мы исполним».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «вы совершили ошибку, стоившую вам жизни»; еврейское выражение может подчёркивать губительные последствия их заблуждения.'
    reason: Лексически трудное выражение допускает как рефлексивный смысл самообмана, так и указание на угрозу собственной жизни.
lexical_decisions:
- source_word: התעיתם בְּנַפְשׁוֹתֵיכֶם
  choice: вы обманули самих себя
  rationale: Трудное сочетание каузативной формы תעה с בְּנַפְשׁוֹתֵיכֶם допускает как значение самообмана, так и губительной ошибки. В контексте притворной готовности повиноваться естественное русское выражение «обманули самих себя» передаёт вменяемый им самообман; угроза их жизни отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: הִתְפַּלֵּל בַּעֲדֵנוּ
  choice: помолись о нас
  rationale: Естественно и доступно передаёт молитву в пользу других; более специальное «ходатайствуй» здесь не требуется.
- source_word: וּכְכֹל אֲשֶׁר יֹאמַר
  choice: и … всё, что скажет
  rationale: Передаёт всеохватность буквального оборота «согласно всему, что скажет» естественным русским синтаксисом.
- source_word: הַגֶּד לָנוּ
  choice: передай нам
  rationale: В данном контексте речь о сообщении народу полученного от Бога ответа; «передай» точнее отражает посредническую роль Иеремии.
- source_word: וְעָשִׂינוּ
  choice: и мы исполним
  rationale: Русский глагол «исполнить» естественно выражает обещание повиноваться сообщённому Божьему слову без необходимости добавлять местоименный объект.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Смысл обвинения התעיתם בנפשותיכם
  choice: вы обманули самих себя
  alternative: вы совершили ошибку, стоившую вам жизни; вы погубили себя своим заблуждением
  rationale: Контекст подчёркивает неискренность заявленной готовности слушаться, поэтому в основном тексте отражён самообман. Возможный смысл смертельно опасной ошибки сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Союз «когда» естественно раскрывает основание обвинения через последующий поступок, не устраняя причинной связи. В прямой речи сохранено различие «вашему Богу» в словах Иеремии и «нашему Богу» в цитате народа.
