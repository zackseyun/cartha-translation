  text: וְ/יִֽהְי֣וּ כָל הָ/אֲנָשִׁ֗ים אֲשֶׁר שָׂ֨מוּ אֶת פְּנֵי/הֶ֜ם לָ/ב֤וֹא מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם יָמ֕וּתוּ בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/לֹֽא יִהְיֶ֤ה לָ/הֶם֙ שָׂרִ֣יד וּ/פָלִ֔יט מִ/פְּנֵי֙ הָֽ/רָעָ֔ה אֲשֶׁ֥ר אֲנִ֖י מֵבִ֥יא עֲלֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/017.yaml
  text: Then all the men who have set their faces to go to Egypt to sojourn there shall die by the sword[a], by famine, and by pestilence[b]. None of them shall have a survivor or an escapee from the disaster that I am bringing on them.
translation:
  language: ru
  text: И все мужчины, решившие идти в Египет, чтобы жить там как чужеземцы[a], умрут от меча, голода и моровой язвы. Не останется среди них ни уцелевшего, ни спасшегося[b] от бедствия, которое Я навожу на них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «жить там как пришельцы». Еврейский глагол подразумевает проживание на чужой земле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни оставшегося в живых, ни беглеца». Эта еврейская пара подчёркивает, что никто не уцелеет и никому не удастся спастись бегством.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ ... יָמוּתוּ
  choice: И ... умрут
  rationale: Начальное וְ связывает приговор с предыдущим предупреждением; в русском естественно передать следствие союзом «и», а предсказательный смысл выражен будущим временем «умрут».
- source_word: כָל הָאֲנָשִׁים
  choice: все люди
  rationale: В данном контексте множественное אֲנָשִׁים обозначает всю обсуждаемую группу; русское «люди» естественно и не требует неоправданного ограничения только взрослыми мужчинами.
- source_word: אֲשֶׁר שָׂמוּ אֶת־פְּנֵיהֶם
  choice: решившие
  rationale: Еврейская идиома буквально означает «обратившие/устремившие своё лицо» и выражает твёрдое намерение. «Решившие» ясно передаёт её смысл современному читателю.
- source_word: לָבוֹא מִצְרַיִם
  choice: идти в Египет
  rationale: בוא допускает значения «приходить», «идти», «входить»; здесь направление движения естественно выражается как «идти в Египет».
- source_word: לָגוּר שָׁם
  choice: поселиться там как чужеземцы
  rationale: גור обозначает проживание не на своей земле, в положении пришельца. Основной текст сохраняет эту существенную смысловую грань без архаичного «странствовать».
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: от меча, голода и моровой язвы
  rationale: 'Сохранена характерная для Иеремии тройная формула суда: насильственная смерть, голод и смертоносная эпидемия. «Моровая язва» передаёт דֶּבֶר в торжественном, но понятном библейском регистре.'
- source_word: שָׂרִיד וּפָלִיט
  choice: ни уцелевшего, ни спасшегося
  rationale: Пара различает того, кто остался в живых, и того, кому удалось уйти от бедствия; двойное отрицание передаёт полноту приговора.
- source_word: מִפְּנֵי הָרָעָה
  choice: от бедствия
  rationale: רָעָה здесь означает не нравственное зло, а пагубное событие или calamity; «бедствие» естественно в русском пророческом контексте.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עֲלֵיהֶם
  choice: которое Я навожу на них
  rationale: Причастная форма מֵבִיא представляет действие как надвигающееся или уже приведённое в движение; «навожу» сохраняет непосредственную Божью субъектность и аспект.
theological_decisions:
- issue: Прямая Божья субъектность в суде
  choice: бедствия, которое Я навожу на них
  alternative: бедствия, которое постигнет их
  rationale: Еврейский текст прямо называет Бога действующим субъектом (אֲנִי מֵבִיא). Перевод не смягчает эту формулировку и не превращает суд в безличное событие.
- issue: Объём выражения כָל הָאֲנָשִׁים
  choice: все люди
  alternative: все мужчины
  rationale: Хотя форма грамматически мужского рода, в контексте она может обозначать совокупность людей, решивших переселиться. Русское «люди» сохраняет возможный широкий референт и не навязывает более узкое прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Идиома «поставить лицо» передана по смыслу, тогда как образ «меча» и традиционная тройная формула суда сохранены. Местоимение «Я» написано с прописной буквы как прямая речь Бога.
