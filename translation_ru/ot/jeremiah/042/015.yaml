  text: וְ/עַתָּ֕ה לָ/כֵ֛ן שִׁמְע֥וּ דְבַר יְהוָ֖ה שְׁאֵרִ֣ית יְהוּדָ֑ה כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם אַ֠תֶּם שׂ֣וֹם תְּשִׂמ֤וּ/ן פְּנֵי/כֶם֙ לָ/בֹ֣א מִצְרַ֔יִם וּ/בָאתֶ֖ם לָ/ג֥וּר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/015.yaml
  text: 'Now therefore hear the word of Yahweh[a], O remnant of Judah. Thus says Yahweh of hosts, the God of Israel: If you are determined to go to Egypt and to go to sojourn there,'
translation:
  language: ru
  text: 'Итак, теперь послушайте слово Яхве, остаток Иуды! Так говорит Яхве Воинств, Бог Израиля: «Если вы твёрдо решите отправиться в Египет и придёте жить там как пришельцы,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если вы непременно обратите свои лица, чтобы пойти в Египет, и придёте жить там как пришельцы». Выражение «обратить лицо» означает твёрдо решить что-либо сделать.'
    reason: Сохраняет буквальную еврейскую идиому, усилительную конструкцию и оттенок проживания в качестве пришельцев, которые в основном тексте переданы естественным русским языком.
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  choice: Итак, теперь
  rationale: Передаёт как временной оттенок, так и вывод из предшествующего контекста; по-русски звучит естественно и торжественно.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: слушайте слово Яхве
  rationale: В пророческом призыве שׁמע подразумевает внимательное, ответственное слушание; «слушайте» естественнее современного буквального «услышьте».
- source_word: שְׁאֵרִית יְהוּדָה
  choice: остаток Иуды
  rationale: Сохраняет прямое обращение к уцелевшей части народа и традиционный библейский смысл שְׁאֵרִית.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая формула пророческого возвещения, переданная в настоящем времени согласно её перформативной функции.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного Божьего имени сохраняет отличие тетраграмматона от титула «Господь».
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: «Воинств» сохраняет широту образа צְבָאוֹת — небесных и земных сил — не сводя титул только к человеческим армиям.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямое и естественное соответствие еврейскому сочетанию.
- source_word: אִם אַתֶּם שׂוֹם תְּשִׂימוּן פְּנֵיכֶם
  choice: Если вы твёрдо решили
  rationale: Инфинитив абсолютный с личной формой усиливает действие, а идиома «обратить лицо» здесь выражает твёрдое намерение.
- source_word: לָבוֹא מִצְרַיִם
  choice: отправиться в Египет
  rationale: При указании пункта назначения בוא естественно передаётся как движение туда; «отправиться» подчёркивает принятое решение.
- source_word: וּבָאתֶם לָגוּר שָׁם
  choice: и поселиться там как чужеземцы
  rationale: גור означает проживание в качестве пришельца, без прав коренного жителя; перевод сохраняет этот оттенок яснее, чем архаичное «странствовать».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; «Яхве» непосредственно передаёт тетраграмматон и не заменяет его титулом.
- issue: Значение титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Яхве Сил; Яхве небесных воинств
  rationale: Формулировка сохраняет традиционную широту и некоторую смысловую многозначность צְבָאוֹת, не ограничивая её одной категорией сил.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Прямое обращение выделено восклицательным знаком; условное высказывание оставлено незавершённым, как и в данном стихе, поскольку его следствие продолжается в следующем стихе.
