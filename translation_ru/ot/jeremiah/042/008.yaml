  text: וַ/יִּקְרָ֗א אֶל יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/אֶ֛ל כָּל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וּ/לְ/כָ֨ל הָ/עָ֔ם לְ/מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/008.yaml
  text: Then he called Johanan son of Kareah, all the commanders of the forces who were with him, and all the people, from the least to the greatest,
translation:
  language: ru
  text: Тогда он позвал Иоханана, сына Карея, всех военачальников, которые были с ним, и весь народ — от малого до великого,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Тогда он позвал
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт последовательность, а «позвал» сохраняет обычное значение קרא без усиления до «созвал».
- source_word: יוֹחָנָן בֶּן־קָרֵחַ
  choice: Иоханана, сына Карея
  rationale: Имя и отчество переданы в традиционной русской библейской форме; конструкция «сына Карея» прямо отражает еврейский патроним.
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  choice: всех военачальников
  rationale: В данном военном контексте שָׂרֵי обозначает начальников или командиров, а הַחֲיָלִים — военные силы. Слитное «военачальники» ясно и естественно передаёт выражение по-русски.
- source_word: אֲשֶׁר אִתּוֹ
  choice: которые были с ним
  rationale: Относительное придаточное естественно относится к непосредственно предшествующим военачальникам и обозначает их пребывание вместе с Иохананом.
- source_word: וּלְכָל הָעָם
  choice: и весь народ
  rationale: Предлог לְ отмечает ещё одну группу адресатов; после русского «позвал» прямое дополнение звучит естественно.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: от малого до великого
  rationale: Устойчивое русское библейское выражение передаёт охват всех людей независимо от положения или значимости, а не буквальный физический размер.
