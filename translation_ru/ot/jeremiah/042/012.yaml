base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/012.yaml
  text: And I will show you mercy[a], and he will have mercy on you and restore you to your own land.
translation:
  language: ru
  text: И Я дарую вам милость[a], и он смилостивится над вами и вернёт вас на вашу землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дам вам милость».'
    reason: Сноска сохраняет буквальную конструкцию נתן + רַחֲמִים, которая по-русски менее естественна, но важна для понимания образа исходного текста.
lexical_decisions:
- source_word: וְאֶתֵּן לָכֶם רַחֲמִים
  choice: И Я дарую вам милость
  rationale: Глагол נתן буквально означает «дать»; «дарую» естественно сочетается с отвлечённым существительным и сохраняет образ дара. רַחֲמִים передано словом «милость», подходящим по смыслу и связанным в русском тексте с последующим «смилостивится».
- source_word: וְרִחַם אֶתְכֶם
  choice: и он смилостивится над вами
  rationale: Форма третьего лица сохранена. «Смилостивится» естественно передаёт רחם и поддерживает смысловую перекличку с существительным «милость».
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: и вернёт вас
  rationale: Каузативная форма Hiphil от שוב означает «заставить вернуться / вернуть». Краткое «вернёт» ясно и естественно передаёт каузативный смысл.
- source_word: אֶל אַדְמַתְכֶם
  choice: на вашу землю
  rationale: В контексте возвращения אַדָמָה обозначает принадлежащую народу землю; русское направление естественно выражается сочетанием «вернуть на землю».
theological_decisions:
- issue: Переход от первого лица Бога к глаголам третьего лица мужского рода
  choice: 'Сохранён переход: «Я дарую», затем «он смилостивится… и вернёт»'
  alternative: 'Согласовать все действия с Богом: «Я… смилостивлюсь… и верну»'
  rationale: Масоретский текст явно переходит от первого лица אֶתֵּן к третьему лицу רִחַם и הֵשִׁיב. В ближайшем контексте «он» относится к царю Вавилона как к человеческому исполнителю, на которого воздействует Бог; сглаживание перехода устранило бы особенность исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Начальное «И» и прописное «Я» сохраняют связь со словами Бога в контексте. Формулировка не устраняет намеренный переход к третьему лицу.
