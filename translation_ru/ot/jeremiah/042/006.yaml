  text: אִם ט֣וֹב וְ/אִם רָ֔ע בְּ/ק֣וֹל יְהוָ֣ה אֱלֹהֵ֗י/נוּ אֲשֶׁ֨ר אנו שֹׁלְחִ֥ים אֹתְ/ךָ֛ אֵלָ֖י/ו נִשְׁמָ֑ע לְמַ֨עַן֙ אֲשֶׁ֣ר יִֽיטַב לָ֔/נוּ כִּ֣י נִשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵֽי/נוּ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/006.yaml
  text: Whether it is good or whether it is bad, we will obey the voice of the LORD our God, to whom we are sending you, so that it may go well with us when we obey the voice of the LORD our God.
translation:
  language: ru
  text: Хорошо ли это будет или плохо, мы послушаемся голоса Господа, нашего Бога, к которому посылаем тебя, чтобы нам было хорошо, когда мы послушаемся голоса Господа, нашего Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что мы послушаемся голоса Господа, нашего Бога».'
    reason: Союз כִּי может выражать как временную, так и причинную связь.
lexical_decisions:
- source_word: אִם טוֹב וְאִם רָע
  choice: Хорошо ли это будет или плохо
  rationale: Передаёт противопоставление «хорошее/плохое» без добавления отсутствующего в тексте объекта; местоимение «это» естественно отсылает к ответу Господа.
- source_word: בְּקוֹל ... נִשְׁמָע
  choice: послушаемся голоса
  rationale: В данном обороте שׁמע с ב означает не просто услышать, а повиноваться; сохранён библейский образ «голоса».
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона, соответствующая принятому чтению имени.
- source_word: יִיטַב לָנוּ
  choice: нам было хорошо
  rationale: Естественно передаёт идиому со значением благополучного исхода, сохраняя повтор корня טוב из начала стиха.
theological_decisions:
- issue: Связь повиновения с благополучием в כִּי נִשְׁמַע
  choice: когда мы послушаемся
  alternative: потому что мы послушаемся
  rationale: כִּי допускает временное и причинное понимание. Основной текст следует контекстуальному смыслу условия благополучия, а примечание сохраняет причинную возможность без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи; сохранены ключевые повторы «хорошо» и «голос Господа», а синтаксис слегка упрощён ради ясности.
