base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/022.yaml
  text: Now therefore[a], know for certain that you will die by the sword, by famine, and by pestilence in the place where you desired to go to sojourn there.
translation:
  language: ru
  text: 'Итак, твёрдо знайте: вы умрёте от меча, голода и мора[a] в том месте, куда вы пожелали пойти, чтобы жить там как чужеземцы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от эпидемической болезни». Еврейское слово может обозначать эпидемическую болезнь в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт итоговый, выводный переход от предшествующего предупреждения естественным современным русским выражением.
- source_word: יָדֹעַ תֵּדְעוּ
  choice: твёрдо знайте
  rationale: Инфинитив абсолютный при личной форме усиливает глагол; сочетание передаёт настойчивость и несомненность без тяжеловесного буквализма.
- source_word: כִּי
  choice: ':'
  rationale: В русском содержание знания естественно вводится бессоюзно после двоеточия; смысл еврейского союза сохранён синтаксически.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדֶּבֶר
  choice: от меча, голода и мора
  rationale: Сохраняет краткую и узнаваемую пророческую триаду бедствий; предлог «от» естественно указывает причины смерти.
- source_word: תָּמ֑וּתוּ
  choice: вы умрёте
  rationale: Прямо передаёт предсказание во втором лице множественного числа.
- source_word: בַּמָּקוֹם
  choice: в той земле
  rationale: Хотя буквально стоит «в том месте», контекст говорит о Египте как избранной стране пребывания; «земле» звучит естественно и не меняет референт.
- source_word: אֲשֶׁר חֲפַצְתֶּם
  choice: куда вы пожелали
  rationale: Передаёт волевой оттенок חפץ и подразумеваемое направление движения.
- source_word: לָבוֹא
  choice: пойти
  rationale: По-русски естественно передаёт движение к избранному месту с позиции говорящего.
- source_word: לָגוּר שָׁם
  choice: чтобы жить там как чужеземцы
  rationale: גור обозначает проживание пришельцем или временным поселенцем; формулировка сохраняет этот социальный оттенок и остаётся понятной современному читателю.
theological_decisions:
- issue: Передача формулы суда חרב / רעב / דבר
  choice: от меча, голода и мора
  alternative: от меча, голода и эпидемии
  rationale: «Меч, голод и мор» сохраняет традиционную торжественную форму пророческой триады, не добавляя конфессионального толкования; примечание разъясняет более широкий смысл последнего слова.
translation_notes:
  register: Современный литературный русский с достойным пророческим звучанием. Синтаксис краток и настойчив; устаревшее «жить пришельцами» заменено понятным выражением «жить как чужеземцы», тогда как «мор» сохранён как узнаваемый термин библейской формулы и пояснён в сноске.
