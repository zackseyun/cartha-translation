source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֣ה צְבָאוֹת֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ כַּ/אֲשֶׁר֩ נִתַּ֨ךְ אַפִּ֜/י וַ/חֲמָתִ֗/י עַל יֹֽשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם כֵּ֣ן תִּתַּ֤ךְ חֲמָתִ/י֙ עֲלֵי/כֶ֔ם בְּ/בֹאֲ/כֶ֖ם מִצְרָ֑יִם וִ/הְיִיתֶ֞ם לְ/אָלָ֤ה וּ/לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה וְ/לֹֽא תִרְא֣וּ ע֔וֹד אֶת הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/018.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Just as my anger and my wrath were poured out on the inhabitants of Jerusalem, so my wrath will be poured out on you when you enter Egypt, and you will become an oath, a horror, a curse, and a reproach, and you will never again see this place.'
translation:
  language: ru
  text: 'Ибо так говорит Господь Воинств[a], Бог Израиля: «Как излились мой гнев и моя ярость на жителей Иерусалима, так изольётся моя ярость на вас, когда вы войдёте в Египет. Вы станете заклятием[b], ужасом, проклятием и поношением и больше никогда не увидите этого места».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Яхве Воинств; слово «Воинств» может обозначать небесные и земные силы.
    reason: Передача божественного имени и смысл титула צְבָאוֹת.
  - marker: b
    text: 'Или: «формулой проклятия»; еврейское слово может обозначать клятву, которой призывают проклятие.'
    reason: Сохранение лексической неоднозначности אָלָה и различия с последующим קְלָלָה.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Господь Воинств
  rationale: Тетраграмматон передан традиционным русским «Господь», а צְבָאוֹת — словом «Воинств», сохраняющим широту образа небесных и земных сил; примечание отмечает возможную передачу имени.
- source_word: נִתַּךְ ... תִּתַּךְ
  choice: излились ... изольётся
  rationale: Сохранена метафора ярости как изливаемой жидкости и параллель между совершившимся судом над Иерусалимом и предстоящим судом.
- source_word: אַפִּי וַחֲמָתִי
  choice: Мой гнев и Моя ярость
  rationale: Два близких, но не тождественных обозначения Божьего негодования переданы разными словами, чтобы сохранить риторическое усиление.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: жителей Иерусалима
  rationale: Естественная современная русская передача причастного оборота «живущие в Иерусалиме».
- source_word: בְּבֹאֲכֶם מִצְרָיִם
  choice: когда вы войдёте в Египет
  rationale: Предлог с инфинитивом имеет временное значение; «войдёте в Египет» естественно передаёт направленное движение и контекст предупреждения.
- source_word: לְאָלָה
  choice: проклятием
  rationale: В данном перечислении слово обозначает клятву или формулу, призывающую проклятие; краткое «проклятием» естественно по-русски, а неоднозначность раскрыта в примечании.
- source_word: לְשַׁמָּה
  choice: ужасом
  rationale: Передаёт потрясение и ужас, вызываемые постигшим их опустошением, без архаичного оттенка.
- source_word: לִקְלָלָה
  choice: предметом злословия
  rationale: Так различаются אָלָה и קְלָלָה и выражается смысл людей, которых приводят как пример или формулу при проклятии.
- source_word: לְחֶרְפָּה
  choice: позором
  rationale: Современное и ёмкое русское слово для публичного бесчестья и поношения.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» соответствует устойчивой русской библейской традиции и остаётся понятным широкому читателю; примечание сохраняет информацию о личном имени в еврейском тексте.
- issue: Передача пары אַף и חֵמָה
  choice: Мой гнев и Моя ярость
  alternative: Мой гнев и Моё негодование
  rationale: Сохранены оба синонимических элемента и усиление речи; буквальное антропоморфное значение אַף («нос») здесь является идиомой гнева и не вынесено в текст.
- issue: Связь суда над Иерусалимом с предупреждением бегущим в Египет
  choice: Сохранена прямая конструкция «как... так...»
  alternative: Пояснительная перефразировка причинно-следственной связи
  rationale: Формальная параллель еврейского текста подчёркивает одинаковую реальность Божьего суда и не требует добавочного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксический параллелизм оригинала сохранён; лексика списка бедствий разграничена настолько, насколько это естественно по-русски.
