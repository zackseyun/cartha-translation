    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: говоря
  rationale: Инфинитив вводит содержание решения, продолжая синтаксис предыдущего стиха; «говоря» сохраняет эту связь без добавления нового личного глагола.
- source_word: לֹא כִּי
  choice: Нет, мы
  rationale: «Нет» передаёт решительное отвержение предыдущего призыва; дальнейшее противопоставление по-русски естественно выражается самим заявлением о намерении идти в Египет без обязательного союза «но».
- source_word: אֶרֶץ מִצְרַיִם
  choice: землю Египетскую
  rationale: Сохраняется прямо названное в еврейском тексте слово «земля», а сочетание звучит естественно и торжественно в русском библейском повествовании.
- source_word: נָבוֹא
  choice: мы пойдём
  rationale: בוא при обозначенном месте назначения выражает движение в него; русское «пойдём в землю» естественно передаёт намерение переселиться туда.
- source_word: לֹא נִרְאֶה מִלְחָמָה
  choice: не увидим войны
  rationale: Сохранён конкретный образ исходного текста — буквально «видеть войну», понятный и по-русски.
- source_word: קוֹל שׁוֹפָר
  choice: звук рога
  rationale: שׁוֹפָר обозначает сигнальный рог; перевод сохраняет исторический предмет и военный контекст тревожного сигнала.
- source_word: לֹא נִשְׁמָע
  choice: не услышим
  rationale: Форма передана естественным русским глаголом восприятия от первого лица множественного числа в соответствии с контекстом и параллельными глаголами.
- source_word: וְלַלֶּחֶם לֹא נִרְעָב
  choice: и не будем голодать из-за нехватки хлеба
  rationale: Передаётся значение голода в отношении хлеба; добавление «из-за нехватки» делает непривычную еврейскую конструкцию ясной по-русски, сохраняя конкретный образ хлеба.
- source_word: וְשָׁם נֵשֵׁב
  choice: там мы и будем жить
  rationale: ישׁב здесь обозначает пребывание и жизнь на избранном месте; «будем жить» современно и естественно, а частица «и» подчёркивает итог намерения.
