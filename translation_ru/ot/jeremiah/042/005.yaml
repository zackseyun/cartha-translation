  text: וְ/הֵ֨מָּה֙ אָמְר֣וּ אֶֽל יִרְמְיָ֔הוּ יְהִ֤י יְהוָה֙ בָּ֔/נוּ לְ/עֵ֖ד אֱמֶ֣ת וְ/נֶאֱמָ֑ן אִם לֹ֡א כְּֽ/כָל הַ֠/דָּבָר אֲשֶׁ֨ר יִֽשְׁלָחֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֵלֵ֖י/נוּ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/005.yaml
  text: And they said to Jeremiah[b][a], “May Yahweh be a true and faithful witness against us if we do not act according to all the word that Yahweh your God sends to us through you.”
translation:
  language: ru
  text: 'И они сказали Иеремии: «Пусть Яхве будет истинным и верным свидетелем против нас[a], если мы не поступим согласно всему слову, которое Яхве, твой Бог, передаст нам через тебя[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истинным и верным свидетелем среди нас». Буквально еврейское выражение допускает значение «в нас / среди нас», но в контексте клятвы, вероятно, подразумевается свидетельство против говорящих, если они не исполнят обещания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которым Яхве, твой Бог, пошлёт тебя к нам». В русском переводе подразумеваемое содержание поручения передано явно: Иеремия должен передать народу слово Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Пусть ... будет
  rationale: Юссив היה выражает призыв или пожелание в формуле торжественной клятвы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: בָּנוּ לְעֵד
  choice: свидетелем против нас
  rationale: В контексте клятвы свидетель призывается дать показание против говорящих, если они не исполнят обещанного; неоднозначность בָּנוּ отмечена в сноске.
- source_word: אֱמֶת וְנֶאֱמָן
  choice: истинным и верным
  rationale: Сохраняет оба определения, подчёркивающие истинность и надёжность свидетеля.
- source_word: אִם לֹא
  choice: если мы не
  rationale: Естественно передаёт условие самообязывающей клятвы без искусственного дополнения формулы проклятия.
- source_word: כְּכָל הַדָּבָר
  choice: в точности по всему слову
  rationale: Сохраняет собирательное единственное число דָּבָר и всеохватность כָּל; «в точности» естественно выражает כְּ в обещании полного послушания.
- source_word: יִשְׁלָחֲךָ ... אֵלֵינוּ
  choice: с которым ... пошлёт тебя к нам
  rationale: Следует буквальной синтаксической форме «пошлёт тебя к нам», оставляя подразумеваемое слово/поручение ясным из контекста.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет обращённое к Иеремии местоимение второго лица и не сглаживает его до «наш Бог».
- source_word: כֵּן נַעֲשֶׂה
  choice: мы ... поступим в точности
  rationale: Передаёт обещание действовать именно так, как повелит Бог, в естественной русской конструкции.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохраняется личное имя в форме современной научно принятой русской транслитерации.
- issue: Фраза «твой Бог»
  choice: твой Бог
  alternative: наш Бог
  rationale: Еврейский текст прямо содержит суффикс второго лица мужского рода единственного числа; возможная дистанция в речи народа не устраняется.
- issue: Юридическая направленность свидетельства
  choice: свидетелем против нас
  alternative: свидетелем среди нас
  rationale: Контекст клятвы поддерживает значение свидетельства против нарушителей обещания, однако буквальная пространственная возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем речи. Порядок сносок приведён к последовательному [a], [b]. Формула клятвы сохраняет её юридическую силу и не восполняет отсутствующее в еврейском тексте проклятие.
