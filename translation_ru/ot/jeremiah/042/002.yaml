  to: 'И они сказали пророку Иеремии: «Пожалуйста, пусть наша мольба дойдёт до тебя[a], и помолись Яхве, твоему Богу, за нас — за весь этот остаток; ведь из множества нас осталось лишь немного, как ты видишь своими глазами».'
