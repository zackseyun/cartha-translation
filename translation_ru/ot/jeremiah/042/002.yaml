  - severity: low
    issue: «и помолись о нас Яхве, твоему Богу»
    rationale: При глаголе «молиться» естественнее сначала назвать того, к кому обращена молитва, а просьбу о людях передать «за нас». Это также яснее отражает בַּעֲדֵנוּ.
  - severity: low
