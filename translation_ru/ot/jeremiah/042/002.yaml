base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/002.yaml
  text: And they said to Jeremiah the prophet[a], “Please let our plea come before you, and pray for us to Yahweh your God, for all this remnant, for we are left as few out of many[b], as your eyes see us.”
translation:
  language: ru
  text: 'И они сказали пророку Иеремии: «Пожалуйста, пусть наша мольба дойдёт до тебя[a], и помолись Яхве, твоему Богу, за нас — за весь этот остаток; ведь из множества нас осталось лишь немного, как ты видишь своими глазами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть наша мольба падёт перед тобой» — еврейская формула, означающая настоятельную просьбу, представленную адресату.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפָּל נָא תְחִנָּתֵנוּ לְפָנֶיךָ
  choice: Просим, пусть наша мольба будет принята тобой
  rationale: Буквальный образ «пусть падёт наша мольба перед тобой» представляет собой идиому настоятельного прошения. По-русски естественнее передать её смысл, сохранив почтительность и настойчивость.
- source_word: וְהִתְפַּלֵּל בַּעֲדֵנוּ
  choice: и помолись о нас
  rationale: Прямо и естественно передаёт просьбу молиться или ходатайствовать за говорящих, не усиливая толкование.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не замена его титулом.
- source_word: בְּעַד כָּל הַשְּׁאֵרִית הַזֹּאת
  choice: обо всём этом остатке
  rationale: «Остаток» сохраняет ключевую лексику Иеремии; כָּל при определённом существительном естественно передано как «весь».
- source_word: מְעַט מֵהַרְבֵּה
  choice: от множества нас осталось лишь немного
  rationale: Выражает контраст между прежним множеством и малым числом оставшихся; «лишь» естественно передаёт ограничительный смысл מְעַט в контексте.
- source_word: כַּאֲשֶׁר עֵינֶיךָ רֹאוֹת אֹתָנוּ
  choice: как ты и сам видишь
  rationale: Естественный русский эквивалент буквального «как твои глаза видят нас», сохраняющий обращение к непосредственному наблюдению Иеремии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет это различие.
- issue: Передача שְׁאֵרִית
  choice: остаток
  alternative: уцелевшие
  rationale: «Остаток» сохраняет повторяющийся пророческий термин и не сводит его значение только к физическому выживанию.
- issue: Выражение «твоему Богу»
  choice: сохранить второе лицо
  alternative: нашему Богу
  rationale: Говорящие прямо называют Яхве Богом Иеремии; заменять это на «нашему» значило бы устранять заметную дистанцию исходного текста.
translation_notes:
  register: Современный литературный русский язык с почтительным, но понятным звучанием. Еврейская идиома передана динамически; порядок слов слегка перестроен ради естественности. Слово «остаток» сохранено как значимый термин пророческой книги.
