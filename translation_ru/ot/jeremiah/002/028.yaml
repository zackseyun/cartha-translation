revisions:
- from: Но где же твои боги, которых ты сделал себе? Пусть они встанут и спасут тебя, если смогут, во время твоего бедствия. Ведь сколько у тебя городов, столько и богов, Иуда.
  to: Но где же твои боги, которых ты сделал себе? Пусть они встанут, если смогут спасти тебя во время твоего бедствия. Ведь сколько у тебя городов, столько и богов, Иуда.
  rationale: 'Исправлена только синтаксическая связь во второй фразе, чтобы условное אִם относилось непосредственно к спасению, как в еврейском тексте. Остальные решения сохранены: множественное «боги», «бедствие» и финальное обращение «Иуда» точно и естественно передают оригинал. Английские сноски в предоставленном audit trail, по-видимому, присоединены к неверным местам; для русского текста сноски не требуются, поскольку значение выражено непосредственно.'
