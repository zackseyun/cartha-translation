  text: וְ/אַיֵּ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ לָּ֔/ךְ יָק֕וּמוּ אִם יוֹשִׁיע֖וּ/ךָ בְּ/עֵ֣ת רָעָתֶ֑/ךָ כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/028.yaml
  text: But where are your gods that you made for yourself? Let them arise[a], if they can save you in the time of your trouble. For your gods, Judah[b], are as many as your cities.
translation:
  language: ru
  text: Но где же твои боги, которых ты сделал себе? Пусть они встанут, если смогут спасти тебя во время твоего бедствия. Ведь сколько у тебя городов, столько и богов, Иуда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיֵּה
  choice: Но где же
  rationale: Вопросительное אַיֵּה означает «где?», а וְ в контексте обличения имеет противительный оттенок; частица «же» естественно передаёт риторический вызов.
- source_word: אֱלֹהֶיךָ אֲשֶׁר עָשִׂיתָ לָּךְ
  choice: твои боги, которых ты сделал себе
  rationale: Множественное число указывает на идолов Иуды, а לָּךְ сохраняет значение действия «для себя».
- source_word: יָקוּמוּ אִם יוֹשִׁיעוּךָ
  choice: Пусть они встанут и спасут тебя, если смогут
  rationale: יָקוּמוּ передаёт насмешливый призыв к действию; אִם в этом вызове выражает сомнение в способности богов спасти. Добавление «смогут» раскрывает прагматику, не утверждая её как факт.
- source_word: בְּעֵת רָעָתֶךָ
  choice: во время твоего бедствия
  rationale: רָעָה здесь означает несчастье, бедствие или катастрофу, а не нравственное зло.
- source_word: כִּי מִסְפַּר עָרֶיךָ הָיוּ אֱלֹהֶיךָ
  choice: Ведь сколько у тебя городов, столько и богов
  rationale: Русская соотносительная конструкция «сколько… столько…» естественно и точно передаёт соответствие числу городов; הָיוּ в данном утверждении передано как наличное состояние.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Собственное имя выступает как прямое обращение и помещено в конце фразы согласно естественному русскому порядку слов.
theological_decisions:
- issue: Кого обозначают «твои боги»
  choice: Изготовленные Иудой идолы, то есть ложные боги
  alternative: Господь или неопределённое единственное «бог»
  rationale: Определительное предложение «которых ты сделал себе» и множественное число исключают отнесение к Господу и сохраняют направленную против идолопоклонства иронию.
- issue: Смысл условия אִם יוֹשִׁיעוּךָ
  choice: Риторическое сомнение в способности идолов спасти
  alternative: Нейтральное условие «если они спасут тебя»
  rationale: Контекст пророческого обличения делает фразу насмешливым испытанием силы идолов; «если смогут» передаёт этот оттенок, не снимая формальной условности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторическая насмешка сохранена без архаизмов; обращение «Иуда» относится к народу/царству и грамматически оформлено как звательная вставка.
