source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בֵּ֣ית יַעֲקֹ֑ב וְ/כָֽל מִשְׁפְּח֖וֹת בֵּ֥ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/004.yaml
  text: Hear the word of Yahweh[a], O house of Jacob, and all the clans of the house of Israel.
translation:
  language: ru
  text: Слушайте слово Яхве, дом Иакова и все роды[a] дома Израиля!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семейства»; еврейское слово обозначает родственные объединения внутри Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма Qal, повелительное наклонение, 2-е лицо множественного числа. «Слушайте» передаёт не только восприятие на слух, но и призыв принять возвещаемое к сердцу.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена устойчивая пророческая формула «слово Яхве»; вариант «весть» был бы понятен, но ослабил бы её формульное и богословское звучание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: בֵּית יַעֲקֹב
  choice: дом Иакова
  rationale: Сохранён корпоративный образ «дома» и прямое обращение к народу завета; частица «о» не добавлена, чтобы избежать излишне архаического звучания.
- source_word: וְכָל מִשְׁפְּחוֹת
  choice: и все роды
  rationale: מִשְׁפָּחוֹת обозначает родственные объединения внутри Израиля. «Роды» точнее в данном общественном контексте, чем узкое «семьи» или слишком широкое «племена».
- source_word: בֵּית יִשְׂרָאֵל
  choice: дома Израиля
  rationale: Сохранена параллель с «домом Иакова» и собирательный, заветный смысл выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон — личное имя Бога. «Яхве» непосредственно передаёт это имя, не подменяя его титулом; форма «Иегова» основана на более позднем смешанном чтении.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы. Множественное «Слушайте» следует грамматике еврейского текста; восклицательный знак передаёт силу повелительного призыва. Маркер примечания поставлен при слове «роды», к которому относится лексическая альтернатива.
