  source_fidelity: Текст точно передаёт повелительное множественное שִׁמְעוּ, формулу «слово Яхве», оба корпоративных выражения «дом Иакова» и «дом Израиля», а также מִשְׁפְּחוֹת как родственные группы. Союз «и все» сохранён без неоправданного истолкования отношений между двумя обращениями.
