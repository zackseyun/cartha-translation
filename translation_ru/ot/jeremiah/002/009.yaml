id: JER.2.9
reference: Jeremiah 2:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/כֵ֗ן עֹ֛ד אָרִ֥יב אִתְּ/כֶ֖ם נְאֻם יְהוָ֑ה וְ/אֶת בְּנֵ֥י בְנֵי/כֶ֖ם אָרִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/009.yaml
  text: Therefore I will still contend with you[a], declares Yahweh, and with your children's children I will contend.
translation:
  language: ru
  text: Поэтому Я ещё буду судиться с вами[a], — возвещает Яхве, — и с детьми ваших детей буду судиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду судиться против вас… и против детей ваших детей».'
    reason: 'Лексическая альтернатива: сочетание ריב с אֵת допускает более явно направленную против адресатов передачу.'
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего обличения и сохраняет явную логическую связь.
- source_word: עוֹד
  choice: ещё
  rationale: В данном контексте указывает на продолжающееся либо повторяющееся действие, не снимая этой смысловой подвижности.
- source_word: אָרִיב
  choice: буду судиться
  rationale: Глагол ריב имеет судебно-состязательный оттенок; русский оборот сохраняет как юридический образ, так и противостояние. Повтор глагола сохранён.
- source_word: אִתְּכֶם
  choice: с вами
  rationale: Прямо передаёт еврейскую конструкцию с предлогом אֵת при ריב; направленность против адресатов ясна из самого глагола. В сноске дана допустимая передача «против вас».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Естественная для современного литературного русского передача пророческой формулы, сохраняющая её торжественность и авторитетность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וְאֶת
  choice: и с
  rationale: По смыслу продолжает ту же конструкцию с ריב применительно к следующему поколению.
- source_word: בְּנֵי בְנֵיכֶם
  choice: детьми ваших детей
  rationale: Сохраняет буквальный родственный образ и торжественный ритм оригинала; вариант «внуками» был бы короче, но менее близок к форме еврейского текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Характер Божьего противостояния народу
  choice: буду судиться с вами
  alternative: буду спорить с вами; выступлю против вас с обвинением
  rationale: Судебная метафора заветного разбирательства сохранена без чрезмерного уточнения конкретной процессуальной роли; формулировка не устраняет одновременно юридический и противоборствующий смысл.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Сохранены повтор «буду судиться» и буквальное «дети ваших детей»; инверсия сведена к естественной русской конструкции.
