lexical_decisions:
- source_word: עָלָיו
  choice: на него
  rationale: При глаголе «рычать» предлог עַל передаёт враждебную направленность действия; местоимение сохраняет олицетворение Израиля как мужчины.
- source_word: יִשְׁאֲגוּ
  choice: рычат
  rationale: Естественное русское обозначение угрожающего голоса львов, сохраняющее образ нападения.
- source_word: כְפִרִים
  choice: молодые львы
  rationale: Слово обозначает сильных молодых львов, а не маленьких львят.
- source_word: נָתְנוּ קוֹלָם
  choice: подают свой голос
  rationale: Передаёт еврейскую идиому «дали свой голос» и подчёркивает громкий угрожающий крик, не смешивая его полностью с предшествующим «рычат».
- source_word: וַיָּשִׁיתוּ
  choice: превратили
  rationale: В данном контексте глагол выражает приведение земли в состояние опустошения.
- source_word: אַרְצוֹ
  choice: его землю
  rationale: Сохранено мужское единственное число, продолжающее олицетворение народа.
- source_word: לְשַׁמָּה
  choice: в пустыню
  rationale: Естественно по-русски выражает состояние полного запустения и разорения; не подразумевает буквально природную пустыню.
- source_word: עָרָיו
  choice: его города
  rationale: Прямо передаёт множественное число с местоименным суффиксом мужского рода.
- source_word: נצתה
  choice: сожжены
  rationale: Вероятное контекстуальное значение трудной еврейской формы; более общее понимание «разорены» сохранено в примечании.
- source_word: מִבְּלִי יֹשֵׁב
  choice: остались без жителей
  rationale: Естественно и ясно передаёт отсутствие живущих там людей и коллективный смысл причастия в единственном числе.
