  yaml_path: translation/ot/jeremiah/002/015.yaml
  text: Young lions roar against him; they raise their voice. They make his land a desolation; his cities are burned[a], without inhabitant.
translation:
  language: ru
  text: Молодые львы рычат на него, возвышают свой голос. Они сделали его землю пустошью; его города сожжены[a], без жителей.
  philosophy: optimal-equivalence
  footnotes:
