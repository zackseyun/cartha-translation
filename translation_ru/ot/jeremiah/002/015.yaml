    issue: «Превратили его землю в пустыню»
    rationale: «Пустыня» может быть понята как географическая пустыня, чего еврейское שַׁמָּה не утверждает. Нужна формулировка о разорении/запустении.
  - severity: low
    issue: «подают свой голос» после «рычат»
    rationale: Формально допустимо, но несколько неестественно в современном литературном русском; более идиоматичное «возвышают голос» передаёт еврейскую формулу, не устраняя повторного усиления.
