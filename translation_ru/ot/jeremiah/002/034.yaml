base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/034.yaml
  text: Even on your skirts is found the blood of the lives of innocent poor people[a]. I did not find them in a break-in[c][b], but on account of all these things.
translation:
  language: ru
  text: Даже на полах твоей одежды[a] обнаружена кровь невинных бедняков. Я застал их не при взломе[b], а за всё это[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на твоих крыльях»; применительно к одежде это слово означает её края, полы или подол.'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду кража со взломом — проникновение через подкоп или пролом в стене; ср. правовую норму в Исх. 22:2.
    reason: cross_reference
  - marker: c
    text: 'Заключительная фраза по-еврейски эллиптична и трудна. Буквально: «не при взломе Я застал их, но/ибо за всё это». Возможна передача: «не потому, что Я застал их при взломе, а из-за всего этого».'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּכְנָפַיִךְ
  choice: на полах твоей одежды
  rationale: כָּנָף буквально обозначает «крыло», а применительно к одежде — её край, полу или подол. «На полах твоей одежды» естественно передаёт конкретный образ пятен крови, не создавая в русском ложного образа крыльев.
- source_word: נִמְצְאוּ דַּם נַפְשׁוֹת
  choice: найдена кровь
  rationale: Необычное сочетание буквально означает «кровь жизней/людей»; נֶפֶשׁ здесь указывает на жизнь или самого человека, а не на «душу» как отвлечённую сущность. По-русски «кровь невинных бедняков» сохраняет смысл насильственно отнятой жизни без неестественной кальки. Единственное число сказуемого согласовано с русским словом «кровь», тогда как еврейское сказуемое стоит во множественном числе.
- source_word: אֶבְיוֹנִים נְקִיִּים
  choice: невинных бедняков
  rationale: אֶבְיוֹנִים — нуждающиеся, бедные люди; נְקִיִּים — невиновные, не заслуживающие обвинения или наказания. «Невинные бедняки» кратко и естественно сохраняет социальный и судебно-нравственный смысл.
- source_word: לֹא בַמַּחְתֶּרֶת
  choice: не при взломе
  rationale: מַחְתֶּרֶת обозначает проникновение в дом посредством подкопа или пролома стены. «При взломе» передаёт ситуацию застигнутого на месте преступления в понятной современной форме.
- source_word: מְצָאתִים
  choice: Я застал их
  rationale: 'Масоретский текст содержит форму первого лица единственного числа с местоименным дополнением третьего лица множественного числа: «Я нашёл/застал их». «Застал» лучше связывается с обстоятельством «при взломе» и сохраняет Господа как говорящего.'
- source_word: כִּי עַל כָּל אֵלֶּה
  choice: а из-за всего этого
  rationale: Краткая заключительная фраза синтаксически эллиптична. עַל допускает причинный смысл «из-за, за», а контекст требует противопоставления. Перевод оставляет неуточнённым, как именно «всё это» связано с убийством, а сноска отмечает трудность.
theological_decisions:
- issue: Кто говорит и кого обозначает местоимение в מְצָאתִים
  choice: 'Господь говорит от первого лица: «Я застал их»; «их» относится к убитым невинным беднякам.'
  alternative: 'Исправить или истолковать форму как второе лицо: «ты застала их при взломе».'
  rationale: 'Масоретская огласовка прямо указывает на первое лицо говорящего и дополнение во множественном числе. Сохранение формы WLC не требует конъектуры и поддерживает судебный характер Божьего обвинения: погибшие не были застигнутыми преступниками, чьё убийство могло бы считаться оправданным.'
- issue: Смысл заключения כִּי עַל כָּל אֵלֶּה
  choice: 'Передать причинно-контрастно: «а из-за всего этого», сохранив эллиптичность.'
  alternative: «Но на всём этом» либо «несмотря на всё это».
  rationale: Еврейская фраза трудна и не называет явно пропущенное действие или логическую связь. Поэтому основной текст не разворачивает её в однозначное богословское объяснение, а возможные понимания отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого судебного обвинения. Конкретный образ окровавленной одежды сохранён; архаичные «крылья» и чрезмерно буквальное «кровь жизней» вынесены из основного текста. Трудность последней фразы не устранена догматическим уточнением.
