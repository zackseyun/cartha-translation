base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/008.yaml
  text: The priests did not say[a], ‘Where is Yahweh?’ Those who handle the law did not know me; the shepherds rebelled against me[c][b]; the prophets prophesied by Baal and went after things that do not profit.
translation:
  language: ru
  text: 'Священники не спрашивали: «Где Яхве?» Те, кто имеет дело с Законом[a], не знали Меня; пастыри восстали против Меня; пророки пророчествовали от имени Ваала[b] и пошли вслед за тем, что не приносит пользы[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «те, кто держит, берётся за Закон». Возможны также: «те, кто распоряжается Законом», «те, кто преподаёт Закон».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пророчествовали Ваалом». Или: «пророчествовали именем Ваала», «пророчествовали через Ваала».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «за бесполезным», «за тем, что не помогает». В контексте подразумеваются ложные боги, но прямо они здесь не названы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Прямой и естественный перевод конкретного существительного во множественном числе.
- source_word: לֹא אָמְרוּ אַיֵּה יְהוָה
  choice: 'не спрашивали: «Где Яхве?»'
  rationale: Глагол «говорить» в сочетании с прямым вопросом естественно передаётся по-русски как «спрашивать»; личное имя Яхве сохранено.
- source_word: תֹפְשֵׂי הַתּוֹרָה
  choice: те, кто держит в руках Закон
  rationale: Сохраняет конкретный образ еврейского תפשׂ — «браться, держать, владеть», не сводя обозначение только к учителям.
- source_word: לֹא יְדָעוּנִי
  choice: не знали Меня
  rationale: Сохраняет прямоту обвинения и возможный смысл личного, заветного знания, не заменяя его более узким «не признавали».
- source_word: הָרֹעִים
  choice: пастыри
  rationale: Сохраняет пророческую метафору руководителей, присутствующую в исходном тексте.
- source_word: פָּשְׁעוּ בִי
  choice: восстали против Меня
  rationale: Передаёт сильное значение פשע — мятеж, сознательное неповиновение, а не просто общий грех.
- source_word: הַנְּבִיאִים נִבְּאוּ בַבַּעַל
  choice: пророки пророчествовали силой Ваала
  rationale: Передаёт возможное инструментальное значение предлога ב; альтернативное понимание как пророчество именем Ваала отмечено в сноске.
- source_word: אַחֲרֵי לֹא יוֹעִלוּ הָלָכוּ
  choice: пошли вслед за тем, что не приносит пользы
  rationale: Сохраняет идиому следования и неопределённость подразумеваемого объекта, не добавляя прямо слово «идолы».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное заветное имя; транслитерация «Яхве» позволяет передать его как имя, а не заменять титулом.
- issue: Смысл נִבְּאוּ בַבַּעַל
  choice: пророчествовали силой Ваала
  alternative: пророчествовали именем Ваала
  rationale: Предлог ב допускает значение средства, основания или сферы. Основной текст отражает инструментальное понимание, а сноска сохраняет распространённую альтернативу.
- issue: Подразумеваемый объект в לֹא יוֹעִלוּ
  choice: тем, что не приносит пользы
  alternative: бесполезными идолами
  rationale: Хотя контекст указывает на ложных богов, еврейский текст не называет здесь идолов прямо; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены метафора пастырей, личное имя Яхве и намеренная неопределённость заключительной фразы. Прописные местоимения при обращении Бога к Себе отражают принятую русскую библейскую издательскую традицию.
