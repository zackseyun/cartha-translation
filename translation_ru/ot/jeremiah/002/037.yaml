source:
  edition: WLC
  text: גַּ֣ם מֵ/אֵ֥ת זֶה֙ תֵּֽצְאִ֔י וְ/יָדַ֖יִ/ךְ עַל רֹאשֵׁ֑/ךְ כִּֽי מָאַ֤ס יְהֹוָה֙ בְּ/מִבְטַחַ֔יִ/ךְ וְ/לֹ֥א תַצְלִ֖יחִי לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/037.yaml
  text: From this one too you will go out with your hands on your head[a], for Yahweh has rejected those in whom you trust[d][c][b], and you will not prosper through them.
translation:
  language: ru
  text: Ты уйдёшь и от этого[a], положив руки на голову[b], потому что Яхве отверг тех, на кого ты надеешься[c], и с ними ты не добьёшься успеха[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от этого». Указательное слово, вероятно, относится к только что упомянутой иностранной державе — Египту.'
    reason: alternative_reading
  - marker: b
    text: Руки на голове — знак скорби, стыда или поражения.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «твои доверия»; также возможно: «твои опоры» или «то, чему ты доверяешь». Вероятно, имеются в виду иностранные союзники Иудеи.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «благодаря им ты не преуспеешь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם מֵאֵת זֶה
  choice: И от этого союзника ты тоже
  rationale: גַּם передаёт продолжение мысли («тоже»), а указательное זֶה в контексте относится к Египту как политическому союзнику. Слово «союзник» делает подразумеваемый референт понятным, не называя Египет непосредственно.
- source_word: תֵּצְאִי
  choice: уйдёшь
  rationale: В данном контексте יצא означает уход от союзника после несбывшихся надежд; «уйдёшь» естественно передаёт направленное удаление.
- source_word: וְיָדַיִךְ עַל רֹאשֵׁךְ
  choice: положив руки на голову
  rationale: Сохранён конкретный древнееврейский образ жеста скорби, стыда или поражения; деепричастная конструкция естественна по-русски.
- source_word: מָאַס
  choice: отверг
  rationale: Глагол выражает решительное неприятие и хорошо соответствует политико-богословскому контексту ложных опор Иудеи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: בְּמִבְטַחַיִךְ
  choice: тех, на кого ты надеешься
  rationale: Буквально множественное число означает «твои предметы доверия/опоры»; в контексте речь о державе или державах, на которые Иудея возлагает надежду.
- source_word: וְלֹא תַצְלִיחִי לָהֶם
  choice: и с ними ты не добьёшься успеха
  rationale: הצליח в породе hифиль здесь означает добиться успеха, а לָהֶם обозначает связь с этими союзниками. Формулировка сохраняет возможный смысл «с ними», не усиливая инструментальное значение до однозначного «через них».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя יהוה; «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер Божьего действия по отношению к политическим опорам Иудеи
  choice: отверг тех, на кого ты надеешься
  alternative: презрел твои надежды
  rationale: Формулировка сохраняет направленность глагола מָאַס на множественное בְּמִבְטַחַיִךְ и допускает конкретное понимание иностранных союзников, не вводя дополнительного конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Обращение во втором лице женского рода воспроизводит персонификацию Иудеи/Иерусалима в еврейском тексте. Образ жеста сохранён, а его культурный смысл вынесен в сноску.
