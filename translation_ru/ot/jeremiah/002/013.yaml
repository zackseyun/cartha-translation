id: JER.2.13
reference: Jeremiah 2:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי שְׁתַּ֥יִם רָע֖וֹת עָשָׂ֣ה עַמִּ֑/י אֹתִ֨/י עָזְב֜וּ מְק֣וֹר מַ֣יִם חַיִּ֗ים לַ/חְצֹ֤ב לָ/הֶם֙ בֹּאר֔וֹת בֹּארֹת֙ נִשְׁבָּרִ֔ים אֲשֶׁ֥ר לֹא יָכִ֖לוּ הַ/מָּֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/013.yaml
  text: 'For my people have done two evils: they have forsaken me[a], the fountain of living waters, to dig for themselves cisterns—broken cisterns that cannot hold water.'
translation:
  language: ru
  text: 'Ибо два зла совершил Мой народ: Меня, источник живой воды[a], они оставили и высекли себе водосборные цистерны — треснувшие цистерны, которые не могут удержать воду.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родник живой воды»; «источник проточной (свежей) воды».'
    reason: Лексические варианты для מְקוֹר מַיִם חַיִּים; основной текст сохраняет образ и неоднозначность оригинала.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт причинно-пояснительную связь с предшествующим обвинением и сохраняет достоинство пророческой речи.
- source_word: שְׁתַּיִם רָעוֹת
  choice: два зла
  rationale: Сохраняет числовое противопоставление и нравственную тяжесть еврейского выражения.
- source_word: עָשָׂה עַמִּי
  choice: совершил Мой народ
  rationale: Русское «совершил» естественно сочетается со словом «зло»; единственное число согласовано с собирательным существительным «народ».
- source_word: אֹתִי עָזְבוּ
  choice: Меня… они оставили
  rationale: Сохраняет вынесенное вперёд «Меня» и резкий переход от собирательного «народ» к множественному глаголу, подчёркивающему поступок людей.
- source_word: מְקוֹר
  choice: источник
  rationale: В современном русском обозначает как родник или место выхода воды, так и её начало; естественно сохраняет метафору Бога без поясняющей подмены.
- source_word: מַיִם חַיִּים
  choice: живой воды
  rationale: Устойчивое русское выражение сохраняет буквальный образ свежей, текучей воды и его богословскую многозначность; вещественное «вода» естественно употребляется в единственном числе.
- source_word: לַחְצֹב
  choice: высечь
  rationale: Точнее, чем общее «выкопать», передаёт устройство ёмкости путём вырубания в камне и усиливает контраст с природным источником.
- source_word: לָהֶם
  choice: себе
  rationale: Передаёт возвратное значение дательного и направленность человеческих усилий на собственное обеспечение.
- source_word: בֹּארוֹת
  choice: водоёмы
  rationale: В данном противопоставлении речь идёт об искусственных ёмкостях для хранения воды, а не о колодцах, питаемых подземной водой. «Водоёмы» понятно в контексте, хотя более специальный вариант — «водосборники».
- source_word: בֹּארֹת נִשְׁבָּרִים
  choice: разбитые водоёмы
  rationale: Передаёт повреждённость и непригодность ёмкостей, не ограничивая смысл только мелкими трещинами.
- source_word: אֲשֶׁר לֹא יָכִלוּ הַמָּיִם
  choice: которые не могут удержать воду
  rationale: Естественно выражает неспособность ёмкостей сохранять воду и оставляет буквальный образ прозрачным.
theological_decisions:
- issue: Метафорическое изображение Бога как источника живой воды
  choice: 'Сохранено прямое приложение: «Меня, источник живой воды»'
  alternative: «Меня, источник жизни» или «Меня, дающего живительную воду»
  rationale: Еврейский текст не истолковывает метафору, поэтому перевод сохраняет её природный образ и богословскую напряжённость без поясняющей парафразы.
- issue: Характер двух зол
  choice: Не раскрывать их дополнительными богословскими терминами; первое названо оставлением Бога, второе — изготовлением негодных водоёмов
  alternative: Передать как отступничество и идолопоклонство
  rationale: Такая интерпретация возможна в контексте книги, но сам стих говорит образами; явное называние идолопоклонства сузило бы их смысл.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Инверсия «Меня… они оставили» сохраняет эмфазу оригинала. Заглавная буква в «Мой» следует принятому русскому благоговейному оформлению прямой речи Бога; местоимение «они» помогает естественно передать переход от единственного «народ» к еврейскому множественному сказуемому.
