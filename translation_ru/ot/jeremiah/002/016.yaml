  text: גַּם בְּנֵי נֹ֖ף ו/תחפנס יִרְע֖וּ/ךְ קָדְקֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/016.yaml
  text: Even the sons of Noph and Tahpanhes have grazed your crown.
translation:
  language: ru
  text: Даже жители[a] Нофа[b] и Тахпанхеса обглодали твоё темя[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья». В древнееврейском языке «сыновья» какого-либо места может означать его жителей.'
    reason: lexical_alternative
  - marker: b
    text: Ноф обычно отождествляют с Мемфисом в Египте.
    reason: cultural_note
  - marker: c
    text: Древнееврейский глагол буквально означает «пасти», «кормиться», «объедать». Здесь образно говорится об ущербе, словно скот объедает пастбище; по смыслу его также передают как «обрили» или «разбили».
    reason: lexical_alternative
  - marker: d
    text: 'Или: «макушку твоей головы»; возможно также: «твой скальп».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Даже
  rationale: 'Передаёт усилительное значение частицы в контексте: против Иудеи выступили даже те египтяне, на которых она могла рассчитывать.'
- source_word: בְּנֵי
  choice: жители
  rationale: Буквально «сыновья», однако при названиях мест это обычное обозначение их жителей; естественный русский эквивалент — «жители».
- source_word: נֹף
  choice: Ноф
  rationale: Сохранена древнееврейская форма названия города; обычно его отождествляют с египетским Мемфисом.
- source_word: תחפנס
  choice: Тахпанхес
  rationale: Название места передано транслитерацией, без замены греческими вариантами Дафна или Дафны.
- source_word: יִרְעוּךְ
  choice: паслись на
  rationale: Глагол רעה буквально связан с выпасом и кормлением. Необычная метафора сохранена, а возвратная русская конструкция естественно выражает поедание или опустошение поверхности.
- source_word: קָדְקֹד
  choice: темя
  rationale: Означает верхнюю часть головы, темя; этот вариант точнее общего «голова» и естественнее буквального «макушка головы».
