source:
  edition: WLC
  text: אֵ֣יךְ תֹּאמְרִ֞י לֹ֣א נִטְמֵ֗אתִי אַחֲרֵ֤י הַ/בְּעָלִים֙ לֹ֣א הָלַ֔כְתִּי רְאִ֤י דַרְכֵּ/ךְ֙ בַּ/גַּ֔יְא דְּעִ֖י מֶ֣ה עָשִׂ֑ית בִּכְרָ֥ה קַלָּ֖ה מְשָׂרֶ֥כֶת דְּרָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/023.yaml
  text: How can you say[a], ‘I have not defiled myself; I have not gone after the Baals’? Look at your way in the valley; know what you have done— a swift young she-camel[c][b], twisting her ways.
translation:
  language: ru
  text: 'Как ты можешь говорить: «Я не осквернилась[a], не ходила вслед за Ваалами[b]»? Посмотри на свой путь в долине, осознай, что ты сделала: ты — резвая молодая верблюдица, мечущаяся по своим тропам[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не стала нечистой».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не следовала за Ваалами».'
    reason: lexical_alternative
  - marker: c
    text: Редкий еврейский глагол, возможно, изображает верблюдицу, которая мечется, петляет или пересекает собственные следы; точный оттенок неясен.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְמֵאתִי
  choice: Я не осквернила себя
  rationale: Нифаль глагола טמא выражает состояние или становление нечистой, осквернённой. Возвратная формулировка естественно передаёт самооправдание Иудеи и сохраняет нравственно-религиозный смысл.
- source_word: אַחֲרֵי הַבְּעָלִים ... הָלַכְתִּי
  choice: не ходила вслед за Ваалами
  rationale: Сохранён образ еврейского оборота הלך אחרי — «идти вслед за, следовать» — и множественное число בְּעָלִים, указывающее на различные местные проявления культа Ваала.
- source_word: רְאִי דַרְכֵּךְ
  choice: Посмотри на свой путь
  rationale: דרך может обозначать как буквальный путь, так и образ действий. В сочетании с долиной и последующим сравнением конкретный образ лучше не устранять.
- source_word: בַּגַּיְא
  choice: в долине
  rationale: גיא обозначает долину или ущелье; «в долине» естественно по-русски и не уточняет сверх текста возможное культовое место.
- source_word: דְּעִי
  choice: осознай
  rationale: Императив ידע буквально означает «знай», но в данном призыве требует признать и понять собственные поступки; «осознай» передаёт эту силу естественным современным русским языком.
- source_word: בִּכְרָה קַלָּה
  choice: резвая молодая верблюдица
  rationale: בכרה — молодая самка верблюда; קלה передаёт лёгкость, быстроту и беспокойную подвижность. «Резвая» сохраняет живость образа без тяжеловесности.
- source_word: מְשָׂרֶכֶת דְּרָכֶיהָ
  choice: мечущаяся по своим тропам
  rationale: Редкий глагол שרך в этом контексте, вероятно, изображает беспорядочное, извилистое движение. Выбор передаёт образ, не выдавая спорную точную траекторию за несомненную.
theological_decisions:
- issue: Множественное число בְּעָלִים в обвинении в идолопоклонстве
  choice: Ваалами
  alternative: Ваалом; владыками
  rationale: Сохранено грамматическое множественное число исходного текста, относящееся к различным местным формам или культовым изображениям Ваала; оно не сведено ни к единственному числу, ни к нарицательному титулу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение и формы женского рода сохранены, поскольку олицетворённая Иудея представлена женщиной. Конкретные образы пути, долины и молодой верблюдицы не заменены отвлечённым истолкованием поведения.
