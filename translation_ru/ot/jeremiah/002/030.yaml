base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/030.yaml
  text: In vain I struck your sons[a]; they accepted no correction[c][b]. Your sword devoured your prophets like a destroying lion.
translation:
  language: ru
  text: 'Напрасно Я поразил ваших сыновей[a]: они не приняли вразумления[b]. Ваш меч пожрал ваших пророков, словно лев, несущий гибель[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваших детей». В еврейском тексте буквально: «ваших сыновей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наставления», «исправления» или «наказания». Еврейское מוּסָר может обозначать как дисциплинарное исправление, так и нравственное наставление.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «словно губительный лев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשָּׁוְא
  choice: Напрасно
  rationale: 'Сочетание ל с שָׁוְא имеет здесь наречное значение безрезультатности: наказание не достигло исправительной цели.'
- source_word: הִכֵּיתִי
  choice: Я поражал
  rationale: Глагол נכה в породе хифиль означает «бить, поражать». Несовершенный вид по-русски естественно передаёт имевшее место наказание, не добавляя значения убийства.
- source_word: בְּנֵיכֶם
  choice: ваших сыновей
  rationale: Сохранено буквальное мужское множественное число. В контексте слово может обозначать детей или потомков народа шире, что отмечено в сноске.
- source_word: מוּסָר
  choice: вразумления
  rationale: מוּסָר объединяет оттенки наставления, исправления и дисциплинарного воздействия. «Вразумление» естественно связывает наказание с его предполагаемой исправительной целью.
- source_word: לֹא לָקָחוּ
  choice: они не приняли
  rationale: לקח с מוּסָר идиоматически означает принять или усвоить наставление либо исправление.
- source_word: אָכְלָה
  choice: пожирал
  rationale: Сохранена яркая метафора меча, который «ест» или «пожирает», то есть губит.
- source_word: חַרְבְּכֶם
  choice: Ваш меч
  rationale: Прямо сохранена форма второго лица множественного числа и подразумеваемая ответственность народа за насилие.
- source_word: נְבִיאֵיכֶם
  choice: ваших пророков
  rationale: 'Сохранено притяжательное значение оригинала, подчёркивающее трагическую иронию: народ губил пророков, посланных к нему.'
- source_word: כְּאַרְיֵה מַשְׁחִית
  choice: словно лев-истребитель
  rationale: Образ льва и активная характеристика причастия מַשְׁחִית сохранены без добавления мотива голода или хищности, прямо не выраженного в тексте.
