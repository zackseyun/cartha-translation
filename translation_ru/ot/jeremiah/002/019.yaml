  text: תְּיַסְּרֵ֣/ךְ רָעָתֵ֗/ךְ וּ/מְשֻֽׁבוֹתַ֨יִ/ךְ֙ תּוֹכִחֻ֔/ךְ וּ/דְעִ֤י וּ/רְאִי֙ כִּי רַ֣ע וָ/מָ֔ר עָזְבֵ֖/ךְ אֶת יְהוָ֣ה אֱלֹהָ֑יִ/ךְ וְ/לֹ֤א פַחְדָּתִ/י֙ אֵלַ֔יִ/ךְ נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/019.yaml
  text: Your evil will discipline you[a], and your apostasies will reprove you. So know and see that it is evil and bitter for you to forsake Yahweh your God, and that my fear is not in you[c][b], declares the Lord GOD of hosts.
translation:
  language: ru
  text: 'Твоё зло вразумит тебя, и твоё отступничество[a] обличит тебя. Познай же и увидь: зло и горько тебе то, что ты оставила Яхве, своего Бога, и что нет в тебе страха предо Мной[b], — возвещает Владыка Яхве Воинств.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твои отпадения»; еврейское слово обозначает неоднократное или упорное отступление и неверность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и страха Моего нет в тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּיַסְּרֵךְ
  choice: накажет тебя
  rationale: Пиэль от יסר сочетает исправительное и карательное значения. В данном контексте естественное русское «накажет» ясно выражает то, что собственное зло Иудеи обернётся против неё, не исключая вразумляющей цели.
- source_word: רָעָתֵךְ
  choice: твоё зло
  rationale: Параллель с оставлением Яхве указывает прежде всего на нравственное зло, а не на бедствие.
- source_word: מְשֻׁבוֹתַיִךְ
  choice: твоё отступничество
  rationale: Слово обозначает неверность и отступление от Бога. Русское собирательное единственное число звучит естественнее буквального множественного и сохраняет заветно-религиозный смысл.
- source_word: תּוֹכִחֻךְ
  choice: обличит тебя
  rationale: Глагол יכח в хифиле здесь передаёт выявление и доказательство вины; «обличит» сохраняет судебно-нравственный оттенок.
- source_word: וּדְעִי וּרְאִי
  choice: Познай же и увидь
  rationale: Сохранены оба повелительных глагола, обращённые к Иудее в женском роде; частица «же» естественно связывает призыв с предыдущим утверждением.
- source_word: רַע וָמָר
  choice: как зло и горько
  rationale: Пара передаёт одновременно нравственную порочность и мучительные последствия оставления Бога.
- source_word: עָזְבֵךְ אֶת־יְהוָה אֱלֹהָיִךְ
  choice: то, что ты оставила Яхве, своего Бога
  rationale: Инфинитив с суффиксом передан естественной русской придаточной конструкцией; женский род сохраняет обращение к персонифицированной Иудее.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное божественное имя, а не заменено титулом.
- source_word: וְלֹא פַחְדָּתִי אֵלַיִךְ
  choice: и что нет в тебе страха предо Мной
  rationale: Формулировка сохраняет именную конструкцию «страх Мой», но выражает её естественно по-русски как отсутствие благоговейного страха перед Богом.
- source_word: נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  choice: возвещает Владыка Яхве Воинств
  rationale: «Возвещает» передаёт формулу пророческого изречения; «Владыка Яхве» различает אֲדֹנָי и имя יהוה, а «Воинств» сохраняет традиционную многозначность צְבָאוֹת.
theological_decisions:
- issue: Значение מְשֻׁבוֹתַיִךְ в контексте завета
  choice: твоё отступничество
  alternative: твои отпадения; твоя неверность
  rationale: Выбор подчёркивает отход от Яхве, а не просто нравственную неустойчивость, не уточняя сверх текста форму или окончательность этого отхода.
- issue: Смысл וְלֹא פַחְדָּתִי אֵלַיִךְ
  choice: нет в тебе страха предо Мной
  alternative: Моего страха нет у тебя; ты не боишься Меня
  rationale: Сохранён акцент исходного текста на отсутствии благоговейного страха как внутренней реальности, без сведения выражения лишь к чувству испуга.
- issue: Передача אֲדֹנָי יְהוִה צְבָאוֹת
  choice: Владыка Яхве Воинств
  alternative: Господь Яхве Сил; Владыка Яхве, Бог Воинств
  rationale: Форма сохраняет различие титула и личного имени и не сужает «воинства» исключительно до земных армий или небесных сил.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Женский род («оставила») отражает обращение к Иудее. Архаизирующее «предо Мной» сохранено точечно ради естественного библейского регистра; прочая лексика остаётся общепонятной.
