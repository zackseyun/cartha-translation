  edition: WLC
  text: כִּ֤י אִם תְּכַבְּסִי֙ בַּ/נֶּ֔תֶר וְ/תַרְבִּי לָ֖/ךְ בֹּרִ֑ית נִכְתָּ֤ם עֲוֺנֵ/ךְ֙ לְ/פָנַ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/022.yaml
  text: For though you wash with natron and use much lye[a], your guilt is stained before me[c][b], declares the Lord YHWH.
translation:
  language: ru
  text: Даже если ты вымоешься натроном и используешь много щёлока[a], твоя вина останется пятном предо Мной[b], — возвещает Владыка Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Щёлок — древнее моющее вещество, вероятно растительная щёлочь; это не обязательно мыло в современном смысле.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «твоё беззаконие отмечено предо Мной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Даже если
  rationale: 'Сочетание вводит уступительное условие: какие бы средства очищения ни применялись, последующее утверждение остаётся в силе.'
- source_word: תְּכַבְּסִי
  choice: ты вымоешься
  rationale: Глагол обычно означает стирку или мытьё, но здесь метафорически описывает попытку нравственного очищения; возвратная форма естественна по-русски.
- source_word: בַּנֶּתֶר
  choice: натроном
  rationale: נֶתֶר обозначает минеральное моющее средство, обычно отождествляемое с натроном; точный исторический термин сохраняет конкретный образ.
- source_word: וְתַרְבִּי לָךְ בֹּרִית
  choice: и возьмёшь много щёлока
  rationale: רבה с לָךְ передаёт обильное применение, а בֹּרִית — древнее моющее вещество, вероятно растительную щёлочь; «возьмёшь много» звучит естественно и не модернизирует предмет как современное мыло.
- source_word: נִכְתָּם
  choice: останется пятном
  rationale: Форма выражает стойкую отмеченность или загрязнённость; перевод сохраняет связь с образом мытья и передаёт безуспешность попытки очищения.
- source_word: עֲוֺנֵךְ
  choice: твоя вина
  rationale: עָוֹן может обозначать как беззаконие, так и возникшую вследствие него вину; в контексте невозможности смыть её «вина» естественно передаёт нравственную ответственность.
- source_word: לְפָנַי
  choice: предо Мной
  rationale: Передаёт присутствие, видение и оценку Бога; форма имеет подобающую пророческому тексту торжественность без архаической затемнённости.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: возвещает Владыка Яхве
  rationale: נְאֻם передаёт формулу божественного пророческого изречения; אֲדֹנָי переведено как титул «Владыка», а личное имя יהוה представлено как «Яхве», избегая сочетания «Господь Господь».
theological_decisions:
- issue: Передача עָוֹן как поступка или как вины за него
  choice: твоя вина
  alternative: твоё беззаконие
  rationale: В данном образе несмываемого пятна на первом плане вина, остающаяся перед Богом, однако еврейское слово допускает также значение самого беззакония; эта возможность отмечена в сноске.
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Так сохраняются и титул אֲדֹנָי, и личное имя יהוה, без их слияния и без неестественного повторения слова «Господь».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Женский род глаголов сохранён, поскольку обращение в контексте направлено к Иудее/Иерусалиму. Образы мытья и несмываемого пятна переданы последовательно.
