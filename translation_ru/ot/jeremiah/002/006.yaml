  text: וְ/לֹ֣א אָמְר֔וּ אַיֵּ֣ה יְהוָ֔ה הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַ/מּוֹלִ֨יךְ אֹתָ֜/נוּ בַּ/מִּדְבָּ֗ר בְּ/אֶ֨רֶץ עֲרָבָ֤ה וְ/שׁוּחָה֙ בְּ/אֶ֨רֶץ֙ צִיָּ֣ה וְ/צַלְמָ֔וֶת בְּ/אֶ֗רֶץ לֹֽא עָ֤בַר בָּ/הּ֙ אִ֔ישׁ וְ/לֹֽא יָשַׁ֥ב אָדָ֖ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/006.yaml
  text: They did not say[a], ‘Where is Yahweh, who brought us up from the land of Egypt, who led us through the wilderness, through a land of desert plain and pit, through a land of drought and deep darkness, through a land where no man passed through and no human dwelt?’
translation:
  language: ru
  text: 'Они не говорили: «Где Яхве, Который вывел нас из Египетской земли, Который вёл нас через пустыню, через землю пустынной равнины и ямы, через землю засухи и глубокого мрака[a], через землю, где никто не проходил и где не жил человек?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смертной тени».'
    reason: Лексема צַלְמָוֶת может обозначать как глубокий мрак, так и смертную тень.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом; форма «Яхве» закреплена в современной русской библеистической традиции.
- source_word: הַמַּעֲלֶה אֹתָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: Который вывел нас из Египетской земли
  rationale: Порода хифиль глагола עלה означает «вывести, поднять»; «вывел» естественно передаёт исход из Египта, сохраняя направленность действия.
- source_word: הַמּוֹלִיךְ אֹתָנוּ
  choice: Который вёл нас
  rationale: Хифиль от הלך здесь обозначает ведение или сопровождение; несовершенный вид «вёл» передаёт продолжительное действие в пустыне.
- source_word: בַּמִּדְבָּר
  choice: через пустыню
  rationale: Хотя предлог буквально допускает «в пустыне», при глаголе движения русское «через» естественно выражает прохождение по этой местности.
- source_word: עֲרָבָה וְשׁוּחָה
  choice: пустынных равнин и ям
  rationale: עֲרָבָה обозначает засушливую равнину или степь, а שׁוּחָה — яму или углубление; перевод сохраняет образ суровой и опасной местности.
- source_word: צִיָּה
  choice: засухи
  rationale: Слово выражает сухость и иссушенность земли; «засуха» кратко и понятно передаёт этот образ.
- source_word: צַלְמָוֶת
  choice: глубокого мрака
  rationale: В данном описании местности слово может обозначать густую, угрожающую тьму; возможный традиционный образ «смертной тени» сохранён в примечании.
- source_word: לֹא עָבַר בָּהּ אִישׁ וְלֹא יָשַׁב אָדָם שָׁם
  choice: где никто не проходил и где не жил человек
  rationale: 'Перевод естественно передаёт параллельные отрицания: местность никто не пересекал и человек там не обитал.'
theological_decisions:
- issue: Значение צַלְמָוֶת
  choice: глубокий мрак
  alternative: смертная тень
  rationale: Контекст допускает значение крайней тьмы и опасности без обязательной прямой отсылки к смерти. Традиционное и лексически возможное чтение «смертная тень» дано в примечании, чтобы сохранить смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «через землю» сохраняет ритм и нарастающее описание еврейского текста; синтаксис остаётся понятным для обычного читателя.
