  variant: modern literary Russian
source:
  edition: WLC
  text: הַ/הֵימִ֥יר גּוֹי֙ אֱלֹהִ֔ים וְ/הֵ֖מָּה לֹ֣א אֱלֹהִ֑ים וְ/עַמִּ֛/י הֵמִ֥יר כְּבוֹד֖/וֹ בְּ/ל֥וֹא יוֹעִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/011.yaml
  text: Has a nation changed its gods—though they are not gods? Yet my people have changed their glory for what does not profit[a][b][c].
translation:
  language: ru
  text: Менял ли какой-нибудь народ своих богов, хотя они и не боги? А мой народ сменил свою славу на то, что не приносит пользы[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обменял», «заменил». Еврейский глагол может означать «менять», «обменивать» или «заменять».'
    reason: lexical_alternative
  - marker: b
    text: Под «своей славой», вероятно, подразумевается Господь — истинная слава Израиля; в еврейском тексте Он назван метонимически, без прямого употребления имени.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на бесполезное»; «на то, что не может помочь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵימִיר
  choice: менял / сменил
  rationale: Глагол означает «менять», «обменивать», «заменять». Однокоренные русские формы сохраняют повтор еврейского глагола, а «сменил ... на» естественно передаёт замену одного объекта почитания другим.
- source_word: גּוֹי
  choice: народ
  rationale: В данном риторическом вопросе слово обозначает этническую или национальную общность. «Народ» естественно в русском контексте и позволяет сохранить противопоставление с «мой народ».
- source_word: אֱלֹהִים
  choice: богов
  rationale: Здесь речь идёт о мнимых божествах других народов; множественное число исходного текста передано прямо.
- source_word: וְהֵמָּה לֹא אֱלֹהִים
  choice: хотя они и не боги
  rationale: 'Формулировка естественно передаёт уступительный смысл и сохраняет парадокс: народы держатся даже за тех, кто в действительности не является богами.'
- source_word: וְעַמִּי
  choice: А мой народ
  rationale: Союз «а» ясно выражает контраст между другими народами и Израилем, не усиливая его сверх исходного текста.
- source_word: כְּבוֹדוֹ
  choice: свою славу
  rationale: Буквально это «его славу», где местоименный суффикс относится к собирательному существительному «народ». Возвратное «свою» грамматически естественно по-русски и сохраняет возможную метонимическую отсылку к Господу, не превращая её в явное имя или титул.
- source_word: בְּלֹא יוֹעִיל
  choice: на то, что не приносит пользы
  rationale: Выражение обозначает нечто бесполезное, неспособное помочь или принести благо. Выбранный вариант ясен современному читателю и сохраняет действие глагола «приносить пользу».
theological_decisions:
- issue: К кому или к чему относится «его слава» (כְּבוֹדוֹ)
  choice: «свою славу» — с сохранением метонимической возможности, что речь идёт о Господе как славе Израиля
  alternative: «своего Славного» или прямо «Господа»; либо абстрактно «собственную славу»
  rationale: Контекст противопоставляет ложных богов народов истинному Богу Израиля, поэтому вероятна отсылка к Господу. Однако исходный текст называет «славу», а не прямо Господа; перевод сохраняет эту образность и присущую ей смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторический вопрос и резкий контраст сохранены. Местоимение «мой» и слово «слава» даны со строчной буквы, чтобы не добавлять отсутствующую в еврейском тексте конфессиональную капитализацию и не устранять смысловую неоднозначность.
