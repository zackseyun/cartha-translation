source:
  edition: WLC
  text: פֶּ֣רֶה לִמֻּ֣ד מִדְבָּ֗ר בְּ/אַוַּ֤ת נפש/ו שָׁאֲפָ֣ה ר֔וּחַ תַּאֲנָתָ֖/הּ מִ֣י יְשִׁיבֶ֑/נָּה כָּל מְבַקְשֶׁ֨י/הָ֙ לֹ֣א יִיעָ֔פוּ בְּ/חָדְשָׁ֖/הּ יִמְצָאֽוּ/נְהָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/024.yaml
  text: A wild donkey accustomed to the wilderness[a], in the craving of her appetite sniffs the wind; in her heat, who can turn her back? All who seek her will not weary themselves[c][b]; in her month they will find her.
translation:
  language: ru
  text: 'Дикая ослица, привыкшая к пустыне, в неистовом желании вдыхает ветер[a]. Когда она в течке[b], кто повернёт её назад? Всем, кто ищет её, не придётся утомляться: в её месяц[c] они найдут её.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обнюхивает ветер» либо «жадно втягивает воздух». Еврейское выражение рисует животное, которое в беспокойном влечении ловит запах по ветру.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в пору своего неукротимого влечения». Еврейское слово обозначает состояние или время половой охоты.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в её месяц»; вероятно, имеется в виду период течки или брачного цикла.'
    reason: cultural_note
lexical_decisions:
- source_word: פֶּרֶה
  choice: дикая ослица
  rationale: Слово обозначает дикого осла, онагра. Женский род выбран по последующим формам и образу самки в состоянии половой охоты; это также естественно передаёт метафору, относящуюся к Иудее.
- source_word: לִמֻּד מִדְבָּר
  choice: привыкшая к пустыне
  rationale: Сочетание описывает животное, освоившееся в пустыне и привычное к ней. Русское «привыкшая» точнее и естественнее буквального «обученная».
- source_word: בְּאַוַּת נַפְשׁוֹ
  choice: в неистовом желании
  rationale: Конструкция выражает сильное внутреннее влечение; נֶפֶשׁ здесь связано с желанием и влечением, а не требует буквального «душа». Выражение оставлено достаточно широким, хотя контекст придаёт ему сексуальную окраску.
- source_word: שָׁאֲפָה רוּחַ
  choice: вдыхает ветер
  rationale: Глагол может передавать жадное втягивание воздуха или обнюхивание ветра. «Вдыхает ветер» сохраняет образ и не устраняет его лексическую неоднозначность; пояснение дано в сноске.
- source_word: תַּאֲנָתָהּ
  choice: когда она в течке
  rationale: Редкое существительное обозначает состояние или пору полового влечения животного. «В течке» — современное и зоологически уместное выражение для самки.
- source_word: מִי יְשִׁיבֶנָּה
  choice: кто повернёт её назад?
  rationale: Каузативная форма שוב буквально передаёт возвращение или поворот назад и в контексте подразумевает невозможность удержать животное от избранного пути.
- source_word: כָּל מְבַקְשֶׁיהָ לֹא יִיעָפוּ
  choice: всем, кто ищет её, не придётся утомляться
  rationale: Фраза означает, что преследующим её не нужно изнурять себя поисками, поскольку в надлежащее время её легко найти.
- source_word: בְּחָדְשָׁהּ
  choice: в её месяц
  rationale: Сохранено буквальное и несколько загадочное выражение «в её месяц»; вероятный смысл — период течки или брачного цикла — объяснён в сноске.
- source_word: יִמְצָאוּנְהָ
  choice: они найдут её
  rationale: Прямая передача формы глагола в контексте будущего результата поисков.
theological_decisions:
- issue: Род в образе дикого осла, представляющего Иудею
  choice: 'Последовательно употребить женский род: «дикая ослица», «она», «её»'
  alternative: Передать начальный образ в мужском роде из-за грамматического рода פֶּרֶה и суффикса в נַפְשׁוֹ
  rationale: Последующие глагольные формы и местоименные суффиксы представляют животное как самку, а метафора относится к Иудее. Женский род делает образ связным, не устраняя его обличительной силы.
- issue: Смысл выражения בְּחָדְשָׁהּ
  choice: Сохранить в основном тексте буквальное «в её месяц» и пояснить вероятный смысл в сноске
  alternative: Сразу истолковать как «в пору течки» или «в брачный период»
  rationale: Буквальное выражение допускает связь как с месяцем, так и с физиологическим циклом. Сноска позволяет сообщить вероятный контекстуальный смысл, не превращая толкование в единственно возможный перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Зоологический образ передан ясно, без архаизма «дикая ослица пустыни» и без смягчения сексуальной метафоры. Синтаксис второй половины слегка перестроен ради естественного русского звучания, при этом последовательность мысли и неоднозначность выражения «в её месяц» сохранены.
