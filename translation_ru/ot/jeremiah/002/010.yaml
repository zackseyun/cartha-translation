  text: כִּ֣י עִבְר֞וּ אִיֵּ֤י כִתִּיִּים֙ וּ/רְא֔וּ וְ/קֵדָ֛ר שִׁלְח֥וּ וְ/הִֽתְבּוֹנְנ֖וּ מְאֹ֑ד וּ/רְא֕וּ הֵ֥ן הָיְתָ֖ה כָּ/זֹֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/010.yaml
  text: For cross over to the coasts of Kittim and see[a]; send to Kedar and consider carefully[b]; see whether there has ever been anything like this.
translation:
  language: ru
  text: Переправьтесь к островам Киттима и посмотрите[a]; пошлите в Кедар и внимательно присмотритесь[b]. Посмотрите, бывало ли когда-нибудь что-либо подобное.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к приморским землям Киттима». Киттим, вероятно, означает Кипр или, шире, западные земли за морем.'
    reason: lexical_alternative
  - marker: b
    text: Кедар — арабские племена или их область к востоку и юго-востоку от Иудеи; вместе с Киттимом это создаёт широкий географический охват — от запада до востока.
    reason: cultural_note
lexical_decisions:
- source_word: עִבְרוּ
  choice: переправьтесь
  rationale: Повелительная форма глагола עבר передаёт конкретное движение через пространство; «переправьтесь» естественно сочетается с морскими землями Киттима.
- source_word: אִיֵּי כִתִּיִּים
  choice: островам Киттим
  rationale: אִיִּים может обозначать острова или приморские земли. «Острова» сохраняет основной конкретный образ, а «Киттим» передано как географическое имя без преждевременного отождествления только с Кипром.
- source_word: וּרְאוּ
  choice: и посмотрите
  rationale: Повтор глагола ראה сохранён в обоих случаях как риторический призыв лично удостовериться.
- source_word: וְקֵדָר שִׁלְחוּ
  choice: пошлите в Кедар
  rationale: Как и в еврейском тексте, объект посылки не назван; вероятно, подразумеваются вестники или люди для расследования. Русский перевод сохраняет эту лаконичность.
- source_word: וְהִתְבּוֹנְנוּ מְאֹד
  choice: и тщательно разузнайте
  rationale: Hitpael глагола בין в данном контексте означает внимательное исследование и выяснение, а מְאֹד усиливает действие. «Тщательно разузнайте» естественно связано с поручением послать кого-либо в Кедар.
- source_word: הֵן הָיְתָה כָּזֹאת
  choice: бывало ли когда-нибудь что-либо подобное
  rationale: 'Риторический вопрос выражает изумление: происходило ли нечто такое. «Когда-нибудь» передаёт подразумеваемую широту сравнения, не устраняя вопросительную форму.'
