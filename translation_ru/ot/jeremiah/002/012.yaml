  text: שֹׁ֥מּוּ שָׁמַ֖יִם עַל זֹ֑את וְ/שַׂעֲר֛וּ חָרְב֥וּ מְאֹ֖ד נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/012.yaml
  text: Be appalled at this[a], O heavens; shudder, be utterly desolate, declares Yahweh.
translation:
  language: ru
  text: Ужаснитесь этому, небеса; содрогнитесь и опустейте совершенно[a], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Изумитесь этому, небеса; трепещите и будьте совершенно опустошены». Первый глагол может означать изумление или ужас; второй — содрогание либо образно «встать дыбом»; третий — запустение, разорение или иссыхание.'
    reason: Лексическая неоднозначность ярких поэтических глаголов שמם, שער и חרב.
lexical_decisions:
- source_word: שֹׁמּוּ
  choice: ужаснитесь
  rationale: Повелительная форма множественного числа от שׁמם выражает потрясение и ужас; «ужаснитесь» естественно передаёт силу пророческого призыва.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Небеса непосредственно призываются как свидетели; русская форма обращения сохраняет поэтическое олицетворение.
- source_word: עַל זֹאת
  choice: этому
  rationale: Сочетание указывает на только что описанное отступничество; при глаголе «ужаснитесь» дательный падеж естественно передаёт значение «при виде этого / из-за этого».
- source_word: וְשַׂעֲרוּ
  choice: содрогнитесь
  rationale: Глагол передаёт телесную реакцию ужаса — дрожь или вставшие дыбом волосы; «содрогнитесь» сохраняет этот яркий образ без излишней конкретизации.
- source_word: חָרְבוּ מְאֹד
  choice: опустейте совершенно
  rationale: חרב может обозначать иссыхание, разорение или запустение, а מְאֹד усиливает выражение. Выбор сохраняет образ крайнего опустошения и не сводит его только к иссыханию.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современно и возвышенно; личное имя יְהוָה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие.
- issue: Обращение к небесам
  choice: Сохранено прямое олицетворённое обращение
  alternative: Передать как безличное описание космического потрясения
  rationale: Повелительные формы множественного числа грамматически относятся к שָׁמַיִם; прямое обращение сохраняет роль небес как свидетелей и не объясняет образ сверх текста.
translation_notes:
  register: Современный литературный русский с сохранением торжественного пророческого обращения и резкой последовательности повелительных форм. Необычный образ опустевших небес сохранён, а его лексическая неоднозначность отмечена в сноске.
