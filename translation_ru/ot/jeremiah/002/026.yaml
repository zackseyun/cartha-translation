source:
  edition: WLC
  text: כְּ/בֹ֤שֶׁת גַּנָּב֙ כִּ֣י יִמָּצֵ֔א כֵּ֥ן הֹבִ֖ישׁוּ בֵּ֣ית יִשְׂרָאֵ֑ל הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם וְ/כֹהֲנֵי/הֶ֖ם וּ/נְבִיאֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/026.yaml
  text: As a thief is ashamed when he is found[a], so the house of Israel has been put to shame—they, their kings, their officials, their priests[b], and their prophets.
translation:
  language: ru
  text: Как стыдится вор, когда его обнаруживают[a], так дом Израиля посрамлён — они сами, их цари, их сановники[b], их священники и их пророки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда его найдут»; или: «когда его обнаружат».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их князья»; также возможно: «их начальники».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹשֶׁת גַּנָּב
  choice: Как стыдится вор
  rationale: Именная конструкция сравнения естественно передана по-русски глагольной фразой; сохранены образ вора и мотив стыда.
- source_word: כִּי יִמָּצֵא
  choice: когда его поймают
  rationale: Нифаль от מצא означает, что вора нашли или обнаружили; в данном контексте «поймают» естественно выражает разоблачение вора, а более буквальный вариант отмечен в сноске.
- source_word: כֵּן
  choice: так
  rationale: Передаёт соотносительную конструкцию «как… так» кратко и естественно.
- source_word: הֹבִישׁוּ
  choice: опозорил себя
  rationale: Форма указывает не только на внутреннее чувство стыда, но и на состояние публичного позора. Возвратная конструкция сохраняет причастность Израиля к собственному бесчестью; единственное число продиктовано русским согласованием с собирательным подлежащим «дом».
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранено коллективное заветное обозначение народа, а не заменено простым именем «Израиль».
- source_word: הֵמָּה
  choice: они сами
  rationale: Передаёт усилительное и возобновляющее значение местоимения перед перечислением групп народа.
- source_word: מַלְכֵיהֶם
  choice: их цари
  rationale: Прямое соответствие форме множественного числа с местоименным суффиксом.
- source_word: שָׂרֵיהֶם
  choice: их сановники
  rationale: שׂרים обозначает представителей правящей и должностной верхушки; «сановники» не ограничивает смысл наследственными князьями и соответствует достоинству контекста.
- source_word: כֹהֲנֵיהֶם
  choice: их священники
  rationale: Обычное и точное соответствие כהנים.
- source_word: נְבִיאֵיהֶם
  choice: их пророки
  rationale: Обычное и точное соответствие נביאים.
theological_decisions:
- issue: Круг виновных в поясняющем перечислении
  choice: Обличение относится ко всему дому Израиля, при этом особо названы его ведущие сословия.
  alternative: Считать адресатами обличения только перечисленных руководителей.
  rationale: Сначала назван весь «дом Израиля», затем усилительное הֵמָּה вводит царей, сановников, священников и пророков как явно выделенные группы внутри общего обвинения.
- issue: Характер стыда Израиля
  choice: «Опозорил себя» передаёт как виновность, так и наступившее бесчестье.
  alternative: «Устыдился» могло бы обозначать преимущественно внутреннее переживание; «был посрамлён» могло бы ослабить оттенок собственной ответственности.
  rationale: Контекст сопоставляет Израиль с разоблачённым вором; важно сохранить одновременно публичный позор и виновность, не сводя выражение только к чувству смущения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет еврейское сравнение и выразительное перечисление, но согласование приспособлено к нормам русского языка.
