revisions:
- from: Как стыдится вор, когда его поймают[a], так опозорил себя дом Израиля — они сами, их цари, их сановники[b], их священники и их пророки.
  to: Как стыдится вор, когда его обнаруживают[a], так дом Израиля посрамлён — они сами, их цари, их сановники[b], их священники и их пророки.
  rationale: Исправлены неоправданные смысловые добавления в двух ключевых глагольных выражениях. Результативное «посрамлён» сохраняет семантику публичного позора и не предрешает спорный вопрос о том, выражает ли форма преимущественно переживаемый стыд или пассивно понимаемое посрамление. Сохраняются коллективное «дом Израиля», эмфатическое местоимение и полный перечень названных групп.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:11:24Z'
review_pass:
  verdict: revise
  source_fidelity: Главная поправка нужна в двух местах. «Поймают» конкретизирует יִמָּצֵא как задержание, тогда как глагол означает «будет найден/обнаружен»; следует сохранить более широкий смысл. «Опозорил себя» вводит возвратную причинность («сам себя»), которой в еврейском тексте прямо нет. הֹבִישׁוּ выражает состояние посрамления/стыда дома Израиля; результативное «посрамлён» передаёт публичный характер позора без лишнего указания на механизм.
  naturalness: Предлагаемая формулировка остаётся современной литературной русской речью. «Как стыдится вор, когда его обнаруживают» естественно как обобщённое сравнение; «дом Израиля посрамлён» кратко и выразительно. Перечень после тире ясен и сохраняет эмфатическое «они сами».
  terminology: '«Дом Израиля», «цари», «сановники», «священники» и «пророки» точны и стилистически уместны. «Сановники» хорошо передаёт שָׂרִים; альтернативы «князья» и «начальники» уместно оставить в сноске. Сноску a следует привести в соответствие с основным чтением: буквальное «найден» и альтернатива «обнаружен» не должны описывать основной вариант как будто он иной.'
  issues:
