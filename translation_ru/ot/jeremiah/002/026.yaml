    issue: «Когда его поймают» сужает значение יִמָּצֵא.
    rationale: Нифаль מצא обозначает быть найденным, обнаруженным; задержание вора возможно по контексту, но не выражено самим глаголом.
  - severity: medium
    issue: «Опозорил себя» добавляет возвратную причинность.
    rationale: Еврейское הֹבִישׁוּ в данном контексте описывает посрамление дома Израиля, но не содержит явного эквивалента «себя».
