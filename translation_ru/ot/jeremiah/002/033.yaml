lexical_decisions:
- source_word: מַה תֵּיטִבִי דַּרְכֵּךְ
  choice: Как искусно ты направляешь свой путь
  rationale: מַה придаёт высказыванию восклицательно-риторический оттенок степени, а Hiphil תֵּיטִבִי с דַּרְכֵּךְ описывает умелое устроение или направление своего пути. «Как искусно» передаёт и степень, и горькую иронию.
- source_word: לְבַקֵּשׁ אַהֲבָה
  choice: в поисках любви
  rationale: Сохраняется единственное число абстрактного существительного אַהֲבָה («любовь»), без контекстуально возможного, но более явного уточнения «любовников».
- source_word: לָכֵן גַּם
  choice: Поэтому даже
  rationale: לָכֵן выражает следствие, а גַּם здесь усиливает обвинение и естественно передаётся словом «даже».
- source_word: הָרָעוֹת
  choice: нечестивых женщин
  rationale: Субстантивированная форма женского рода множественного числа в контексте образа неверной женщины наиболее естественно понимается как обозначение порочных женщин. Возможное отвлечённое понимание отмечено в сноске.
- source_word: למדתי
  choice: ты научила
  rationale: По контексту и традиционному чтению это форма 2-го лица женского рода единственного числа, согласованная с обращением к Иудее как к женщине.
- source_word: דְּרָכָיִךְ
  choice: своим путям
  rationale: Сохранены множественное число и метафора путей как образа поведения; русское возвратное местоимение естественно указывает на пути подлежащего.
theological_decisions:
- issue: Значение הָרָעוֹת в образе поисков запретной любви
  choice: 'личное обозначение: «нечестивых женщин»'
  alternative: 'отвлечённое обозначение: «злому» или «злым делам»'
  rationale: 'Женский род множественного числа и окружающий образ Иудеи как неверной женщины поддерживают личное понимание: она настолько искусна в пороке, что учит даже нечестивых женщин. Лексически допустимая отвлечённая трактовка сохранена в сноске.'
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой резкости и иронии. Женский род глаголов отражает обращение к Иудее, представленной в контексте как женщина.
