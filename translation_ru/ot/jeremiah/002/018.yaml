base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/018.yaml
  text: And now[a], what have you to do with the way to Egypt, to drink the waters of Shihor? And what have you to do with the way to Assyria[b], to drink the waters of the River?
translation:
  language: ru
  text: И теперь что тебе до пути в Египет — пить воды Шихора[a]? И что тебе до пути в Ассирию — пить воды Реки[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шихор — вероятно, название Нила или одного из его восточных рукавов.
    reason: lexical_alternative
  - marker: b
    text: То есть Евфрата.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет и соединительный союз, и временной переход к прямому риторическому обличению.
- source_word: מַה לָּךְ לְדֶרֶךְ
  choice: зачем тебе дорога
  rationale: Естественный русский риторический оборот, передающий порицание и сохраняющий конкретный образ дороги, не сводя выражение к нейтральному вопросу о причине поездки.
- source_word: מִצְרַיִם
  choice: Египет
  rationale: Общепринятое русское название страны.
- source_word: לִשְׁתּוֹת
  choice: пить
  rationale: Инфинитив цели сохранён; тире естественно связывает цель с риторическим вопросом.
- source_word: מֵי שִׁחוֹר
  choice: воды Шихора
  rationale: Собственное имя передано транслитерацией, а вероятное отождествление с Нилом вынесено в сноску, чтобы не устранять неоднозначность исходного текста.
- source_word: אַשּׁוּר
  choice: Ассирия
  rationale: Общепринятое русское название страны.
- source_word: מֵי נָהָר
  choice: воды Реки
  rationale: Сохранено буквальное и контекстуально определённое обозначение «Река»; вероятное указание на Евфрат пояснено в сноске.
theological_decisions:
- issue: Образ питья вод Египта и Ассирии
  choice: Сохранить образ дороги и питья чужих вод без прямого пояснения его политического смысла в основном тексте.
  alternative: 'Передать смысл прямо: «зачем тебе искать помощи у Египта и Ассирии».'
  rationale: Контекст допускает понимание образа как обличения надежды на чужеземные державы, но сам стих выражает это метафорически. Перевод сохраняет образ и его богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «зачем тебе дорога» сохраняет параллелизм еврейского текста; тире делает инфинитив цели естественным по-русски.
