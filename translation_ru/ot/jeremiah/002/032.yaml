base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/032.yaml
  text: Does a virgin forget her jewelry[b][a], or a bride her ornaments? Yet my people have forgotten me for days without number.
translation:
  language: ru
  text: Разве забудет девушка свои украшения[a], а невеста — своё убранство[b]? Но Мой народ забыл Меня — дней без числа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своё убранство».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово, вероятно, обозначает связанные или завязываемые детали свадебного убранства: возможно, ленты, пояса или другие украшения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִשְׁכַּח
  choice: Разве забудет
  rationale: Частица הֲ вводит риторический вопрос, ожидающий отрицательного ответа; «разве» естественно передаёт эту силу по-русски.
- source_word: בְּתוּלָה
  choice: девушка
  rationale: В данном сопоставлении речь идёт о незамужней молодой женщине. Русское «девушка» естественно и сохраняет противопоставление невесте, не сводя значение слова к физиологическому признаку.
- source_word: עֶדְיָהּ
  choice: свои украшения
  rationale: Слово обозначает личное украшение или убранство. Множественное число по-русски естественно передаёт собирательный смысл еврейской формы.
- source_word: כַּלָּה
  choice: невеста
  rationale: Прямое и естественное соответствие еврейскому обозначению невесты.
- source_word: קִשֻּׁרֶיהָ
  choice: свадебные повязки
  rationale: Редкое слово связано с тем, что завязывают или повязывают, вероятно с элементами наряда невесты. Выбор сохраняет предметный образ, а неопределённость уточняется в сноске.
- source_word: וְעַמִּי
  choice: Но Мой народ
  rationale: Союз выражает резкий контраст между немыслимым поведением девушки или невесты и фактическим поведением Божьего народа.
- source_word: שְׁכֵחוּנִי
  choice: забыл Меня
  rationale: Совершенный вид передаёт совершившееся и сохраняющее силу забвение, не усиливая его до прямо не названного в тексте отречения.
- source_word: יָמִים אֵין מִסְפָּר
  choice: уже дней без числа
  rationale: Сохраняет образный еврейский оборот о неисчислимо долгом времени; «уже» делает длительное состояние ясным и естественным по-русски.
theological_decisions:
- issue: Заветный смысл слов «Мой народ» и обвинения в забвении Бога
  choice: Сохранено прямое «Мой народ забыл Меня» без поясняющего усиления.
  alternative: «Мой народ оставил/отрёкся от Меня»
  rationale: Контекст подразумевает неверность в отношениях с Богом, однако сам стих говорит именно о забвении. Перевод сохраняет метафору и богословское напряжение исходного текста.
translation_notes:
  register: Современный литературный русский с поэтической сжатостью пророческой речи. Риторический параллелизм сохранён; формула «дней без числа» намеренно оставлена образной и близкой к еврейскому тексту.
