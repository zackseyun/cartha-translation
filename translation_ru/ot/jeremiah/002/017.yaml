lexical_decisions:
- source_word: הֲלוֹא זֹאת תַּעֲשֶׂה לָּךְ
  choice: Не ты ли сама навлекла это на себя
  rationale: Риторический вопрос ожидает утвердительного ответа. Хотя буквально конструкция означает «не это ли сделало тебе», контекст и последующее עָזְבֵךְ позволяют естественно передать мысль о бедствии, которое Иудея навлекла на себя. Женский род сохраняет обращение к персонифицированной Иудее/общине.
- source_word: עָזְבֵךְ
  choice: оставив
  rationale: Инфинитивная конструкция с суффиксом называет причину происходящего; деепричастие по-русски кратко и естественно передаёт «тем, что ты оставила».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהַיִךְ
  choice: своего Бога
  rationale: Возвратное притяжательное местоимение естественно при совпадении обладателя с адресатом и сохраняет заветное отношение.
- source_word: בְּעֵת מוֹלִיכֵךְ
  choice: когда Он вёл тебя
  rationale: Временная конструкция и причастная форма указывают на действие, происходившее в тот период; несовершенный вид «вёл» сохраняет его длительность.
- source_word: בַּדָּרֶךְ
  choice: по пути
  rationale: Естественное русское выражение сохраняет образ пути и не исключает его нравственного или заветного смысла.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом.
- issue: Кто является причиной бедствия
  choice: Иудея сама навлекла его на себя, оставив Бога
  alternative: «Не это ли сделало тебе…»
  rationale: Идиоматический перевод раскрывает подразумеваемую причинность, но сноска сохраняет формальную неоднозначность еврейской конструкции.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение передано в женском роде в соответствии с еврейскими формами, относящимися к персонифицированному народу; прописное «Он» применено как русская почтительная норма.
