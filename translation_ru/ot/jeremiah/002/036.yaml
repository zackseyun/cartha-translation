base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/036.yaml
  text: Why do you go about so much[a], changing your way? You will also be put to shame by Egypt[b], as you were put to shame by Assyria.
translation:
  language: ru
  text: Почему ты так мечешься[a], меняя свой путь? Ты также постыдишься Египта[b], как постыдилась Ассирии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему ты столько скитаешься, меняя свой путь?» Еврейское выражение может подчёркивать беспокойные поиски новых союзов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ты будешь посрамлена Египтом… как была посрамлена Ассирией». Еврейский глагол может обозначать стыд, посрамление или разочарование в ненадёжной опоре.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֵּזְלִי מְאֹד
  choice: Почему ты так мечешься
  rationale: Риторическое מַה передаёт укор и естественно выражается словом «почему». Редкий глагол в данном контексте указывает на беспокойные перемещения и поиски иной опоры; «мечешься» сохраняет образ движения и не сводит его лишь к физическому хождению.
- source_word: לְשַׁנּוֹת אֶת דַּרְכֵּךְ
  choice: меняя свой путь
  rationale: '«Путь» сохраняет широту דֶּרֶךְ: речь может идти как о политическом курсе Иудеи, так и о её поведении в более широком нравственно-духовном смысле.'
- source_word: גַּם מִמִּצְרַיִם תֵּבֹשִׁי
  choice: Египет тоже посрамит тебя
  rationale: Так передаётся Египет как источник предстоящего стыда и сохраняется добавочное значение גַּם. Активная русская конструкция звучит естественнее буквального «от Египта ты будешь постыжена», не устраняя оттенка разочарования в ненадёжной опоре.
- source_word: כַּאֲשֶׁר בֹּשְׁתְּ מֵאַשּׁוּר
  choice: как посрамила тебя Ассирия
  rationale: Сохраняются временное противопоставление будущего и прошлого и синтаксический параллелизм двух держав как источников унижения.
theological_decisions:
- issue: Смысл выражения «свой путь» в пророческом обличении
  choice: Оставлено широкое «свой путь».
  alternative: «свой политический курс» или «своё поведение»
  rationale: Ближайший контекст говорит о поиске иностранных союзов, однако образ пути несёт также нравственно-духовный смысл. Перевод не ограничивает его только одной сферой.
- issue: Стыд из-за Египта и Ассирии
  choice: Передано как публичное посрамление со стороны держав, на которые возлагалась надежда.
  alternative: «ты постыдишься Египта… как постыдилась Ассирии» или «ты разочаруешься в Египте…»
  rationale: בושׁ может обозначать и стыд, и разочарование вследствие рухнувшей надежды. Основной текст подчёркивает унижение, а примечание сохраняет вторую смысловую грань.
translation_notes:
  register: Современный литературный русский язык с пророческой выразительностью без архаизации. Женский род обращения отражает персонифицированную Иудею/Иерусалим в контексте. «Мечешься» передаёт беспокойную смену внешнеполитических опор, а «путь» сохраняет более широкий нравственный смысл.
