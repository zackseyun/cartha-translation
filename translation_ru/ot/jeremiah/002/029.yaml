source:
  edition: WLC
  text: לָ֥/מָּה תָרִ֖יבוּ אֵלָ֑/י כֻּלְּ/כֶ֛ם פְּשַׁעְתֶּ֥ם בִּ֖/י נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/029.yaml
  text: Why do you contend with me? All of you have rebelled against me[b][a], declares Yahweh.
translation:
  language: ru
  text: Почему вы спорите со Мной?[a] Все вы восстали против Меня[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему вы судитесь со Мной?» Еврейский глагол может означать спор, тяжбу или предъявление обвинения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «преступили против Меня». Еврейский глагол часто имеет более сильный смысл — восстание, мятеж или нарушение верности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Почему
  rationale: Естественно передаёт риторический вопрос о причине поведения народа.
- source_word: תָרִיבוּ אֵלָי
  choice: вы спорите со Мной
  rationale: Глагол ריב может означать спор, тяжбу или предъявление претензий; «спорите со Мной» сохраняет как конфликтный, так и возможный судебный оттенок, не делая его чрезмерно специальным.
- source_word: כֻּלְּכֶם
  choice: Все вы
  rationale: Передаёт эмфатическое обращение ко всему народу и звучит естественно по-русски.
- source_word: פְּשַׁעְתֶּם בִּי
  choice: восстали против Меня
  rationale: פשע обозначает не просто проступок, а мятеж, нарушение верности и открытое неповиновение; сочетание с בִּי указывает, против кого направлено восстание.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт весомую пророческую формулу и сохраняет личное имя יְהוָה в форме «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет Тетраграмматон; транслитерация сохраняет явленное заветное имя, не подменяя его титулом.
- issue: Сила обвинения в פְּשַׁעְתֶּם
  choice: восстали
  alternative: согрешили / преступили
  rationale: «Восстали» сохраняет заложенный в פשע смысл мятежа и нарушения верности, не сводя обвинение к общему обозначению греха.
translation_notes:
  register: Современный литературный русский язык; краткая, весомая пророческая речь. Заглавные буквы в местоимениях «Мной/Меня» использованы как традиционный русский знак почтительного обращения к Богу. Синтаксис сохраняет риторический вопрос и усиленное «Все вы».
