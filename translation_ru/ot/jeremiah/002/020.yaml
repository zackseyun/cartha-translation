id: JER.2.20
reference: Jeremiah 2:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י מֵ/עוֹלָ֞ם שָׁבַ֣רְתִּי עֻלֵּ֗/ךְ נִתַּ֨קְתִּי֙ מוֹסְרֹתַ֔יִ/ךְ וַ/תֹּאמְרִ֖י לֹ֣א אעבד כִּ֣י עַֽל כָּל גִּבְעָ֞ה גְּבֹהָ֗ה וְ/תַ֨חַת֙ כָּל עֵ֣ץ רַעֲנָ֔ן אַ֖תְּ צֹעָ֥ה זֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/020.yaml
  text: For long ago I broke your yoke[a]; I tore off your bonds. But you said, “I will not serve.” Indeed, on every high hill and under every green tree[c][b], you sprawled out as a prostitute.
translation:
  language: ru
  text: 'Ведь давным-давно Я сломал твоё ярмо[a], разорвал твои путы. Но ты сказала: «Не буду служить». И правда, на каждом высоком холме и под каждым зеленеющим деревом[b] ты ложилась[c], как блудница.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «издревле». Еврейское выражение обозначает далёкое прошлое; здесь оно, вероятно, напоминает о прежнем освобождении Израиля.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «под каждым зеленеющим деревом» часто встречается у пророков и обозначает места, связанные с идолопоклонством.
    reason: cultural_note
  - marker: c
    text: Еврейское слово редкое, и его точное значение неясно. Возможны также переводы «склонялась» или «распластывалась»; вероятно, оно изображает позу сексуальной доступности.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: давным-давно
  rationale: Выражение указывает на далёкое прошлое, здесь — на прежнее освобождение Израиля; оно не означает абстрактную вечность.
- source_word: שָׁבַרְתִּי עֻלֵּךְ
  choice: Я сломал твоё ярмо
  rationale: Сохранён конкретный образ освобождения от порабощения и первое лицо согласно масоретской огласовке WLC.
- source_word: נִתַּקְתִּי מוֹסְרֹתַיִךְ
  choice: разорвал твои путы
  rationale: Глагол передаёт разрыв или расторжение связей, а существительное продолжает образ ярма и освобождения.
- source_word: לֹא אעבד
  choice: Не буду служить
  rationale: «Служить» сохраняет как основной смысл подчинения, заданный образом ярма, так и возможный религиозный оттенок служения Богу.
- source_word: כִּי
  choice: И правда
  rationale: Второе כִּי вводит подтверждение сказанного последующим описанием неверности Израиля.
- source_word: עַל כָּל גִּבְעָה גְּבֹהָה וְתַחַת כָּל עֵץ רַעֲנָן
  choice: на каждом высоком холме и под каждым зеленеющим деревом
  rationale: Сохранено буквальное пророческое обозначение мест языческого культа; רַעֲנָן передано естественным русским словом, обозначающим пышную зелень.
- source_word: צֹעָה
  choice: ты ложилась
  rationale: Редкое и трудное слово, вероятно, изображает позу сексуальной доступности; выбранный вариант естественен по-русски и сохраняет телесную силу метафоры, а неопределённость отмечена в сноске.
- source_word: זֹנָה
  choice: как блудница
  rationale: Явный образ проституции сохранён как метафора заветной неверности; «блудница» уместно для dignified prophetic register and remains understandable in modern Russian.
theological_decisions:
- issue: Образ половой неверности как обозначение идолопоклонства
  choice: Сохранить в основном тексте прямой образ блудницы
  alternative: Смягчить до «ты была неверна» или прямо истолковать как «ты поклонялась идолам»
  rationale: Иеремия намеренно описывает нарушение завета языком половой неверности. Смягчение устранило бы резкость пророческого обличения, а поясняющая замена преждевременно истолковала бы метафору.
- issue: Субъект глаголов «сломал» и «разорвал»
  choice: 'Передать первое лицо: Бог сломал ярмо и разорвал путы'
  alternative: 'Понять формы как обращение во втором лице: «ты сломала… ты разорвала…»'
  rationale: Масоретская огласовка данного текста WLC однозначно представляет формы как первое лицо единственного числа; этот трудный переход к словам Израиля сохранён, а не исправлен по распространённому альтернативному прочтению.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и резкости пророческой речи. Обращение к Израилю передано в женском роде. Образы ярма, пут и блудницы оставлены конкретными, без конфессионального истолкования.
