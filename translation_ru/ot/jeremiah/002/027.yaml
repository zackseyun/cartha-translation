  to: 'Они говорят дереву: «Ты — мой отец», а камню: «Ты дал мне жизнь»[a]. Ведь они повернулись ко Мне спиной[b], а не лицом; но во время своего бедствия[c] они говорят: «Встань и спаси нас!»'
  rationale: Правка требуется только для устранения смыслового сдвига в русском «родил меня». Нейтральное «дал мне жизнь» естественно при обращении к грамматически мужскому «камню», сохраняет утверждение о происхождении от идола и не создаёт ложного мужского образа; буквальная грамматическая особенность исходного текста прозрачно отмечена в сноске. Остальная формулировка точно передаёт еврейский параллелизм и контраст.
