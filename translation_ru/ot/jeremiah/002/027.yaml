source:
  edition: WLC
  text: אֹמְרִ֨ים לָ/עֵ֜ץ אָ֣בִ/י אַ֗תָּה וְ/לָ/אֶ֨בֶן֙ אַ֣תְּ ילדת/ני כִּֽי פָנ֥וּ אֵלַ֛/י עֹ֖רֶף וְ/לֹ֣א פָנִ֑ים וּ/בְ/עֵ֤ת רָֽעָתָ/ם֙ יֹֽאמְר֔וּ ק֖וּמָ/ה וְ/הוֹשִׁיעֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/027.yaml
  text: They say to a tree[a], “You are my father,” and to a stone, “You gave birth to me.” For they have turned their back to me and not their face; but in the time of their trouble they say[c][b], “Rise up and save us!”
translation:
  language: ru
  text: 'Они говорят дереву: «Ты — мой отец», а камню: «Ты дал мне жизнь»[a]. Ведь они повернулись ко Мне спиной[b], а не лицом; но во время своего бедствия[c] они говорят: «Встань и спаси нас!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском: «Ты родила меня»; глагол стоит в женском роде, согласуясь с еврейским словом «камень».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «повернули ко Мне затылок, а не лицо» — образ отвержения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «во время своей беды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: они говорят
  rationale: 'Причастная форма передана личной формой настоящего времени: она естественно выражает продолжающееся или характерное поведение.'
- source_word: לָעֵץ
  choice: дереву
  rationale: עֵץ означает «дерево» или «древесина»; конкретное «дерево» сохраняет резкость обличения идолопоклонства.
- source_word: אָבִי אַתָּה
  choice: Ты — мой отец
  rationale: Сохранено прямое приписывание деревянному идолу отцовства.
- source_word: וְלָאֶבֶן
  choice: а камню
  rationale: אֶבֶן прямо означает «камень»; союз «а» естественно оформляет русский параллелизм и сопоставление материалов идолов.
- source_word: אַתְּ יְלַדְתִּנִי
  choice: Ты родил меня
  rationale: Глагол ילד здесь означает рождение. В еврейском обращение и глагол стоят в женском роде, но русское «камень» — мужского рода, поэтому грамматически требуется «родил»; исходная форма отмечена в сноске.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит поясняющее основание обвинения; «ведь» естественно передаёт эту связь в современном русском языке.
- source_word: פָנוּ אֵלַי עֹרֶף
  choice: повернулись ко Мне спиной
  rationale: Буквально упомянут затылок; русская идиома «повернуться спиной» точно передаёт жест отвержения.
- source_word: וְלֹא פָנִים
  choice: а не лицом
  rationale: Сохранён выразительный исходный контраст между спиной и лицом.
- source_word: וּבְעֵת רָעָתָם
  choice: но во время своего бедствия
  rationale: רָעָה может обозначать зло, беду или бедствие; здесь речь о несчастье, вызывающем просьбу о спасении. Противительный союз передаёт смысловой контраст.
- source_word: יֹאמְרוּ
  choice: они говорят
  rationale: Имперфект допускает будущий или повторяющийся смысл; настоящее время в сочетании с обстоятельством времени живо передаёт типичную реакцию народа.
- source_word: קוּמָה
  choice: Встань
  rationale: Прямой современный эквивалент повелительной формы без архаизации.
- source_word: וְהוֹשִׁיעֵנוּ
  choice: и спаси нас
  rationale: Порода hifil глагола ישׁע означает «спасти, избавить»; «спаси нас» прямо и ясно передаёт мольбу.
theological_decisions:
- issue: Буквальность обращения к идолам как к родителям
  choice: Сохранить прямую речь, в которой дерево названо отцом, а камню приписано рождение народа.
  alternative: Обобщить смысл как поклонение идолам.
  rationale: Исходный текст намеренно использует родственные и родовые образы; их буквальное сохранение передаёт силу пророческого обличения и не сглаживает богословское напряжение.
- issue: Временное значение יֹאמְרוּ
  choice: 'Передать как привычное настоящее: «они говорят».'
  alternative: 'Передать будущим временем: «они скажут».'
  rationale: Еврейская форма допускает оба оттенка. Настоящее время в данном контексте выражает повторяющееся поведение, не исключая реакции при будущем бедствии.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм и резкий контраст «спиной, а не лицом» сохранены; архаизмы устранены. Прописная буква в «Мне» употреблена как редакционный знак обращения к Богу, не меняющий смысла оригинала.
