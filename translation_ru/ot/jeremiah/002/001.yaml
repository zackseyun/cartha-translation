lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма глагола היה вводит новое сообщение в повествовании; традиционная, но понятная современному читателю формула «И было» сохраняет структуру еврейского текста.
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле דְבַר יְהוָה слово דָּבָר обозначает обращённую к пророку Божью речь; «слово» точно сохраняет формульный и богословский характер выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица указывает, что слово было обращено к пророку; «ко мне» естественно сочетается в русском языке с формулой «было слово».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «сказать» вводит содержание последующей прямой речи. В современном русском эту функцию естественно и без смысловой потери передаёт двоеточие.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Форма «Яхве» передаёт его как имя, не подменяя титулом; вариант «Иегова» основан на более позднем соединении согласных тетраграмматона с подсказывающими гласными.
translation_notes:
  register: Современный литературный русский с сохранением краткой пророческой формулы. Двоеточие естественно вводит речь, начинающуюся в следующем стихе; архаичное «говоря» не добавлено.
