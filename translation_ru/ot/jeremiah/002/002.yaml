base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/002.yaml
  text: 'Go and proclaim in the hearing of Jerusalem[a], saying, ‘Thus says Yahweh: I remember for you the faithful love of your youth, the love of your betrothal, when you went after me in the wilderness[b], in a land not sown.’'
translation:
  language: ru
  text: 'Иди и провозгласи Иерусалиму: «Так говорит Яхве: „Я помню твою преданность в юности[a], твою любовь, когда ты была невестой[b], как ты шла за Мной по пустыне, по незасеянной земле“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верную любовь твоей юности». Еврейское חֶסֶד здесь обозначает любовь, выраженную в верности и преданности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «любовь поры твоего обручения» или «любовь твоих свадебных дней». Еврейское выражение сохраняет некоторую неопределённость, но представляет ранний Израиль в образе невесты Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  choice: Иди и провозгласи
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает повеление; перевод передаёт движение и публичный характер пророческого возвещения без ненужного акцента на громкости.
- source_word: בְאָזְנֵי יְרוּשָׁלִַם
  choice: Иерусалиму
  rationale: Буквально — «в уши Иерусалима». Русский дательный естественно передаёт адресата возвещения, сохраняя «Иерусалим» как обозначение города и его жителей.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена традиционная формула пророческого посланника, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: זָכַרְתִּי לָךְ
  choice: Я помню твою
  rationale: В русском языке конструкция с прямым дополнением естественно выражает направленность воспоминания на Иерусалим/Израиль; отдельная передача дательного местоимения сделала бы фразу искусственной.
- source_word: חֶסֶד
  choice: преданность
  rationale: В данном контексте слово описывает раннюю любовь и верность Израиля Яхве. «Преданность» передаёт и устойчивость отношения, и заветную лояльность, не создавая впечатления, будто речь идёт о любви Бога к Израилю.
- source_word: נְעוּרַיִךְ
  choice: в юности
  rationale: Женский род согласован с персонифицированным Иерусалимом; образ указывает на раннюю пору истории Израиля.
- source_word: אַהֲבַת כְּלוּלֹתָיִךְ
  choice: твою любовь, когда ты была невестой
  rationale: Так сохраняется брачный образ и вероятное указание на пору невесты, но не навязывается более узкое понимание как только обручения или только свадьбы.
- source_word: לֶכְתֵּךְ אַחֲרַי
  choice: как ты шла за Мной
  rationale: Отглагольная конструкция продолжает содержание воспоминания; буквальный образ следования сохранён в естественной русской форме.
- source_word: בַּמִּדְבָּר
  choice: по пустыне
  rationale: «Пустыня» естественно обозначает незаселённую и неплодородную местность исхода; предлог «по» соответствует движению вслед за Яхве.
- source_word: בְּאֶרֶץ לֹא זְרוּעָה
  choice: по незасеянной земле
  rationale: Сохранён земледельческий образ земли, которую не засевают; повтор предлога поддерживает поэтический параллелизм.
theological_decisions:
- issue: Брачный образ ранних отношений Израиля с Яхве
  choice: твою любовь, когда ты была невестой
  alternative: любовь поры твоего обручения; любовь твоих свадебных дней
  rationale: Перевод сохраняет образ Израиля как невесты и его ранней любви к Яхве, не решая однозначно, относится ли форма כְּלוּלֹת к обручению, свадьбе или началу брачной жизни.
- issue: Носитель חֶסֶד в данном стихе
  choice: преданность Израиля в юности
  alternative: верная любовь; неизменная любовь
  rationale: Грамматика относит חֶסֶד к Иерусалиму/Израилю, а последующие слова поясняют это как любовь и следование за Яхве. Перевод не переносит качество на Бога, хотя сохраняет заветный оттенок слова.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан понятным для обычного читателя; сохранены персонификация Иерусалима, брачная метафора, образ следования через пустыню и земледельческий образ незасеянной земли. Написание «Мной» с прописной буквы использовано как уважительное обозначение Бога внутри прямой речи.
