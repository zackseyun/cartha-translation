base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/025.yaml
  text: Keep your feet from going unshod and your throat from thirst. But you said[a], “It is hopeless! No, for I have loved strangers, and after them I will go.”
translation:
  language: ru
  text: 'Не ходи босиком и не давай горлу своему томиться от жажды. Но ты сказала: «Безнадёжно! Нет, ведь я полюбила чужих[a] и пойду за ними».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иноплеменников». В данном контексте это слово может метафорически обозначать чужих богов, чужих любовников либо другие народы и союзы с ними.'
    reason: Сохранение лексической и метафорической неоднозначности זָרִים.
lexical_decisions:
- source_word: מִנְעִי רַגְלֵךְ מִיָּחֵף
  choice: Не давай ногам своим оставаться босыми
  rationale: Женский императив обращён к олицетворённой Иудее. Формулировка сохраняет запретительный смысл и образ босых ног, но звучит естественно по-русски; единственное число «нога» в еврейском имеет собирательное значение.
- source_word: וְגֹרֹנֵךְ מִצִּמְאָה
  choice: а горлу — томиться от жажды
  rationale: גָּרוֹן означает «горло»; эллиптическая конструкция передаёт параллелизм первой строки и образ изнурительной жажды.
- source_word: וַתֹּאמְרִי
  choice: Но ты сказала
  rationale: Союз передан противительным «но», поскольку ответ Иудеи отвергает предостережение.
- source_word: נוֹאָשׁ
  choice: Бесполезно!
  rationale: Слово выражает безнадёжность и отказ от попытки изменить поведение; «Бесполезно!» естественно передаёт здесь смысл «ничего не выйдет / нет смысла».
- source_word: לֹא כִּי
  choice: Нет, ведь
  rationale: לֹא резко отвергает призыв, а כִּי вводит основание этого отказа.
- source_word: אָהַבְתִּי זָרִים
  choice: я полюбила чужих
  rationale: Перфект אָהַבְתִּי передан как «полюбила», обозначая сложившуюся привязанность. «Чужие» сохраняет широту זָרִים и не сводит метафору только к богам, любовникам или политическим союзникам.
- source_word: וְאַחֲרֵיהֶם אֵלֵךְ
  choice: и пойду за ними
  rationale: Сохраняется образ сознательного следования за теми, к кому Иудея привязалась; имперфект естественно передан будущим временем.
theological_decisions:
- issue: Кого обозначают זָרִים в метафоре неверности
  choice: В основном тексте сохранено широкое «чужих».
  alternative: «иноплеменников», «чужих богов», «чужих любовников» или «чужеземные народы».
  rationale: Контекст Иеремии соединяет образы супружеской неверности, идолопоклонства и обращения к иностранным державам. Более узкий перевод преждевременно устранил бы намеренную многослойность пророческой речи.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение последовательно дано в женском роде, поскольку речь обращена к олицетворённой Иудее. Параллелизм образов ног и горла сохранён без архаизмов.
