  text: קֹ֤דֶשׁ יִשְׂרָאֵל֙ לַ/יהוָ֔ה רֵאשִׁ֖ית תְּבוּאָתֹ֑/ה כָּל אֹכְלָ֣י/ו יֶאְשָׁ֔מוּ רָעָ֛ה תָּבֹ֥א אֲלֵי/הֶ֖ם נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/003.yaml
  text: Israel was holy to Yahweh[a], the firstfruits of his harvest; all who devoured him became guilty; disaster came upon them[c][b], declares Yahweh.
translation:
  language: ru
  text: Израиль был святыней Яхве, начатком Его урожая.[a] Все, кто пожирал его,[b] навлекут на себя вину; бедствие постигнет их,[c] — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первыми плодами Его урожая» или «начатком Его плодов».'
    reason: Лексическая альтернатива для רֵאשִׁית תְּבוּאָתוֹ; «начаток» передаёт посвящённую Богу первую долю урожая.
  - marker: b
    text: 'Буквально: «все, кто ел его»; это образ народов, разорявших и грабивших Израиль.'
    reason: Пояснение метафоры אֹכְלָיו.
  - marker: c
    text: 'Еврейские формы также могут передавать обобщённое значение: «навлекают на себя вину; бедствие постигает их».'
    reason: Отмечает временно-аспектуальную неоднозначность יֶאְשָׁמוּ и תָּבֹא, не меняя основного пророческого прочтения.
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: святыней
  rationale: Существительное в именной части сказуемого представляет Израиль как посвящённое Богу, священное достояние; «святыней» сохраняет предметно-культовый оттенок лучше, чем только качественное «свят».
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל выражает посвящение и принадлежность; «для Яхве» естественно передаёт эту связь, не устраняя её смысловую широту.
- source_word: רֵאשִׁית תְּבוּאָתוֹ
  choice: первыми плодами Его урожая
  rationale: רֵאשִׁית в сочетании с урожаем вызывает образ первых, посвящённых Богу плодов; русский оборот сохраняет как земледельческий, так и культовый смысл.
- source_word: אֹכְלָיו
  choice: кто пожирал его
  rationale: Буквально речь идёт о тех, кто «ел» Израиль; «пожирал» сохраняет метафору и ясно выражает насилие враждебных народов. Мужской род следует корпоративному единственному числу «Израиль».
- source_word: יֶאְשָׁמוּ
  choice: навлекали на себя вину
  rationale: Глагол обозначает становление виновными и возникновение ответственности; эта формулировка естественна по-русски и не сужает образ до формального суда.
- source_word: רָעָה תָּבֹא אֲלֵיהֶם
  choice: бедствие постигало их
  rationale: В контексте суда רָעָה означает не нравственное зло, а пагубу или бедствие. Прошедшее несовершенного вида согласуется с последовательностью повторяющихся посягательств и их последствий, хотя еврейская форма допускает и будущее прочтение.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивую пророческую формулу передаёт современный, торжественный оборот, отличающий Божье изречение от обычной речи.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя יהוה; транслитерация «Яхве» сохраняет его как имя и соответствует предоставленной доктринальной установке.
- issue: Культовый образ Израиля
  choice: святыней для Яхве, первыми плодами Его урожая
  alternative: свят для Яхве, начаток Его урожая
  rationale: Формулировка сохраняет представление об Израиле как о посвящённой Богу доле и первых плодах, не привнося более поздних богословских выводов.
- issue: Временное значение יֶאְשָׁמוּ и תָּבֹא
  choice: навлекали… постигало
  alternative: навлекут… постигнет
  rationale: В контексте воспоминания о ранней истории Израиля формы можно понимать как описание закономерно происходившего в прошлом. Возможное будущее или обобщённое прочтение отмечено в сноске, чтобы не скрывать аспектуально-временную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Сохранены культовая метафора первых плодов, метафора пожирания и корпоративный мужской род слова «Израиль»; синтаксис сделан ясным для обычного читателя.
