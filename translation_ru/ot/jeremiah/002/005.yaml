base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/005.yaml
  text: 'Thus says Yahweh: What wrong did your fathers find in me[a], that they went far from me, and went after vanity[b], and became vain?'
translation:
  language: ru
  text: 'Так говорит Яхве: «Какую несправедливость нашли во Мне ваши предки, что удалились от Меня, пошли за пустотой[a] и сами стали пусты?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова «пустотой» и «стали пусты» в еврейском тексте образованы от одного корня: следуя за пустым и тщетным, люди и сами стали такими.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена стандартная пророческая формула и передано личное covenantное имя יְהוָה как «Яхве».
- source_word: מַה מָּצְאוּ אֲבוֹתֵיכֶם בִּי עָוֶל
  choice: Какую несправедливость нашли во Мне ваши предки
  rationale: עָוֶל обозначает несправедливость, неправду или нравственный изъян; «несправедливость» ясно сохраняет риторическое обвинение. אֲבוֹתֵיכֶם передано естественным современным словом «предки».
- source_word: כִּי רָחֲקוּ מֵעָלָי
  choice: что удалились от Меня
  rationale: Союз כִּי здесь связывает предполагаемое основание с последующим отступлением; «удалились» сохраняет пространственный образ отчуждения.
- source_word: וַיֵּלְכוּ אַחֲרֵי הַהֶבֶל
  choice: пошли за пустотой
  rationale: 'Не конкретизировано как «идолы», поскольку הֶבֶל шире: нечто пустое, тщетное и лишённое сущности. Формулировка сохраняет образ следования.'
- source_word: וַיֶּהְבָּלוּ
  choice: и сами стали пусты
  rationale: 'Глагол образован от того же корня, что הֶבֶל; повтор «пустотой — стали пусты» воспроизводит смысловую игру: человек уподобляется тому, за чем следует.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя Бога, не заменяя его титулом.
- issue: Референт הַהֶבֶל
  choice: пустота
  alternative: идолы
  rationale: В контексте слово, вероятно, намекает на идолов, однако исходное выражение намеренно шире и участвует в игре слов с וַיֶּהְבָּלוּ; поэтому конкретизация не внесена в основной текст.
translation_notes:
  register: Современный литературный русский, сдержанный пророческий стиль. Риторический вопрос и корневая игра исходного текста сохранены без архаизмов и без преждевременной конкретизации «пустоты» как идолов.
