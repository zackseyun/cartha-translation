  text: הַ/עֶ֨בֶד֙ יִשְׂרָאֵ֔ל אִם יְלִ֥יד בַּ֖יִת ה֑וּא מַדּ֖וּעַ הָיָ֥ה לָ/בַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/014.yaml
  text: Is Israel a servant[b][a], or a homeborn servant? Why then has he become plunder?
translation:
  language: ru
  text: Раб ли Израиль, или он раб, рождённый в доме хозяина[a]? Почему же он стал добычей[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рождённый в доме»; имеется в виду раб, родившийся в доме своего хозяина.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предметом разграбления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֶבֶד
  choice: раб
  rationale: Слово עֶבֶד обозначает раба или слугу; в этом риторическом вопросе существенна именно несвобода, поэтому «раб» точнее передаёт смысл, чем более мягкое «слуга».
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятая русская форма библейского имени; мужской род позволяет сохранить олицетворение Израиля.
- source_word: אִם
  choice: или
  rationale: В вопросительной конструкции אִם вводит альтернативу и естественно передаётся союзом «или».
- source_word: יְלִיד בַּיִת
  choice: раб, рождённый в доме хозяина
  rationale: Буквально выражение означает «рождённый в доме» и в данном параллелизме подразумевает раба, родившегося в хозяйском доме. Добавление «раб» и «хозяина» делает подразумеваемые отношения ясными по-русски, не меняя их характера.
- source_word: הוּא
  choice: он
  rationale: Местоимение мужского рода относится к олицетворённому Израилю.
- source_word: מַדּוּעַ
  choice: почему же
  rationale: «Почему» передаёт вопросительное значение, а частица «же» естественно выражает риторическую связь со сказанным ранее.
- source_word: הָיָה
  choice: стал
  rationale: Глагол здесь описывает наступившее состояние; русское «стал» кратко и естественно передаёт результат изменения.
- source_word: לָבַז
  choice: добычей
  rationale: בַּז обозначает добычу, трофей или награбленное. «Добычей» естественно сочетается с глаголом «стал» и сохраняет образ того, чем завладели другие.
theological_decisions:
- issue: Передача социального статуса, выраженного словом עֶבֶד
  choice: Использовать слово «раб»
  alternative: «Слуга»
  rationale: Риторическая сила вопроса основана на положении несвободного человека. Перевод «раб» сохраняет социальную реальность текста и не смягчает её конфессионально привычной лексикой.
- issue: Подразумеваемое значение выражения יְלִיד בַּיִת
  choice: 'Явно передать: «раб, рождённый в доме хозяина»'
  alternative: 'Буквально: «рождённый в доме»'
  rationale: Контекст первой части вопроса указывает на раба, родившегося в хозяйском доме. Экспликация необходима для понятного современного русского текста, а буквальная форма сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной риторикой. Инверсия «Раб ли Израиль» сохраняет вопросительный напор оригинала, оставаясь естественной для библейского пророческого стиля.
