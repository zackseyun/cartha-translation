  text: וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל אֶ֣רֶץ הַ/כַּרְמֶ֔ל לֶ/אֱכֹ֥ל פִּרְיָ֖/הּ וְ/טוּבָ֑/הּ וַ/תָּבֹ֨אוּ֙ וַ/תְּטַמְּא֣וּ אֶת אַרְצִ֔/י וְ/נַחֲלָתִ֥/י שַׂמְתֶּ֖ם לְ/תוֹעֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/007.yaml
  text: I brought you into a fertile land to eat its fruit and its goodness[a], but when you came in[b], you defiled my land and made my inheritance an abomination.
translation:
  language: ru
  text: Я ввёл вас в плодородную землю[a], чтобы вы питались её плодами и благами[b]. Но, войдя в неё, вы осквернили Мою землю и превратили Мой удел в мерзость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в землю Кармил». Еврейское слово может обозначать плодородную, возделанную землю.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «её изобилием» или «всем добром, которое она даёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבִיא
  choice: Я ввёл
  rationale: Hiphil глагола בוא означает «ввести, привести». «Ввёл» естественно передаёт Божье действие и движение в землю.
- source_word: אֶרֶץ הַכַּרְמֶל
  choice: в плодородную землю
  rationale: В данном контексте כַּרְמֶל лучше понимать как нарицательное обозначение плодородной, возделанной земли; это подтверждается последующим упоминанием её плодов и благ.
- source_word: לֶאֱכֹל פִּרְיָהּ וְטוּבָהּ
  choice: чтобы вы питались её плодами и благами
  rationale: Инфинитив выражает цель. «Плодами» сохраняет прямое значение פְּרִי, а «благами» передаёт широкий смысл טוּב — добро, изобилие и всё хорошее, что даёт земля.
- source_word: וַתָּבֹאוּ
  choice: Но, войдя в неё
  rationale: Оборот естественно связывает вступление народа в землю с последующим осквернением и ясно выражает контраст с благодеянием Бога.
- source_word: וַתְּטַמְּאוּ
  choice: вы осквернили
  rationale: Порода piel глагола טמא означает сделать нечистым, осквернить; выбранное слово сохраняет как нравственный, так и культовый оттенок.
- source_word: אַרְצִי
  choice: Мою землю
  rationale: Прямо сохраняет притяжательное значение и подчёркивает принадлежность земли Богу.
- source_word: נַחֲלָתִי
  choice: Мой удел
  rationale: נַחֲלָה обозначает наследственный удел или владение. В русском библейском контексте «удел» естественнее буквального «наследие», когда речь идёт о земле как Божьем владении.
- source_word: שַׂמְתֶּם לְתוֹעֵבָה
  choice: превратили ... в мерзость
  rationale: Формулировка сохраняет результативную конструкцию שׂים לְ и сильное нравственно-религиозное значение תוֹעֵבָה.
theological_decisions:
- issue: Значение כַּרְמֶל
  choice: 'нарицательное: «плодородная земля»'
  alternative: 'географическое название: «земля Кармил»'
  rationale: Синтаксис и параллельное упоминание плодов и благ земли поддерживают значение плодородной, возделанной местности, но возможность связи с названием Кармил отмечена в сноске.
- issue: Объём значения טוּב
  choice: «блага»
  alternative: «изобилие» или «добро»
  rationale: Еврейское слово шире сельскохозяйственной продукции и может охватывать всё добро и изобилие земли; «блага» сохраняет эту широту без уточняющего толкования.
- issue: Значение נַחֲלָה применительно к Божьей земле
  choice: «Мой удел»
  alternative: «Моё наследие» или «Моё владение»
  rationale: «Удел» выражает землю как принадлежащее Богу владение и не создаёт неуместного впечатления, будто Бог получил наследство после чьей-либо смерти.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Прописные буквы в местоименных формах «Мою», «Мой» следуют принятой русской религиозной издательской традиции; синтаксис остаётся ясным для широкого читателя.
