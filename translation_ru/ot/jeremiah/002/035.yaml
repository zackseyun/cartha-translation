base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/035.yaml
  text: Yet you said[a], “I am innocent; surely his anger has turned away from me.” Behold, I am entering into judgment with you because you say, “I have not sinned.”
translation:
  language: ru
  text: 'Но ты сказала: «Я невиновна; несомненно, Его гнев отступил от меня». Вот, Я вступаю в судебную тяжбу с тобой[a] за то, что ты говоришь: «Я не согрешила».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я сужусь с тобой»; еврейское выражение имеет судебный смысл.'
    reason: Лексическая альтернатива, поясняющая юридический оттенок נִשְׁפָּט אֹתָךְ.
lexical_decisions:
- source_word: וַתֹּאמְרִי
  choice: Но ты сказала
  rationale: Форма 2-го лица женского рода единственного числа обращена к олицетворённой Иудее; союз передаёт контраст с предшествующим обличением.
- source_word: נִקֵּיתִי
  choice: Я невиновна
  rationale: Nifal от נקה здесь означает свободу от вины; русское «невиновна» естественно сохраняет нравственно-судебный смысл.
- source_word: אַךְ
  choice: несомненно
  rationale: Частица усиливает самоуверенное утверждение говорящей, а не выражает ограничение.
- source_word: שָׁב אַפּוֹ מִמֶּנִּי
  choice: Его гнев отвернулся от меня
  rationale: Идиома со שׁוב и אַף обозначает прекращение или отвращение гнева; образ движения сохранён.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Частица привлекает внимание к непосредственному ответу Бога; «вот» соответствует современному литературному и при этом возвышенному регистру.
- source_word: נִשְׁפָּט אֹתָךְ
  choice: Я вступаю с тобой в суд
  rationale: Причастная форма Nifal от שׁפט с אֵת передаёт начало судебного разбирательства или тяжбы; перевод сохраняет юридический оттенок и настоящее, разворачивающееся действие.
- source_word: עַל אָמְרֵךְ
  choice: за то, что ты говоришь
  rationale: Предлог עַל с отглагольной формой указывает основание суда; русская причинная конструкция звучит естественно.
- source_word: לֹא חָטָאתִי
  choice: Я не согрешила
  rationale: Перфект חטא выражает отрицание совершённого греха; женский род соответствует адресату и прямой речи.
theological_decisions:
- issue: Судебный оттенок Божьего ответа
  choice: Я вступаю с тобой в суд
  alternative: Я сужусь с тобой; Я буду судить тебя
  rationale: Выбранная формулировка сохраняет образ судебной тяжбы и взаимную конструкцию еврейского выражения, не сводя его ни к простому вынесению приговора, ни к конфессионально окрашенному толкованию.
- issue: Отнесение местоимения в выражении «Его гнев»
  choice: Его гнев
  alternative: гнев Бога; Мой гнев
  rationale: Третье лицо оригинала сохранено внутри цитаты Иудеи; явная замена на «Божий» или «Мой» устранила бы грамматическую перспективу исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Женский род последовательно передаёт обращение к олицетворённой Иудее. Судебная метафора сохранена без архаизма «тяжусь» и без чрезмерно канцелярского оборота.
