  text: וְ/אָֽנֹכִי֙ נְטַעְתִּ֣י/ךְ שֹׂרֵ֔ק כֻּלֹּ֖/ה זֶ֣רַע אֱמֶ֑ת וְ/אֵיךְ֙ נֶהְפַּ֣כְתְּ לִ֔/י סוּרֵ֖י הַ/גֶּ֥פֶן נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/021.yaml
  text: Yet I planted you as a choice vine[a], wholly of true seed[c][b]. How then have you turned for me into the degenerate shoots of a foreign vine?
translation:
  language: ru
  text: Я же посадил тебя как отборную лозу[a], целиком выращенную из доброкачественного семени[b]. Как же ты стала для Меня выродившимися побегами[c] чужой лозы?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благородную виноградную лозу»; еврейское слово обозначает особо ценную, отборную лозу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «целиком из подлинного семени» или «целиком из доброкачественного посадочного материала».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское слово переведено предположительно; возможны также варианты: «одичавшие ветви» или «испорченная поросль».'
    reason: textual_difficulty
lexical_decisions:
- source_word: נְטַעְתִּיךְ
  choice: посадил тебя
  rationale: Qal, перфект 1-го лица единственного числа с суффиксом 2-го лица женского рода; передаёт совершённое действие Бога по отношению к олицетворённому народу.
- source_word: שֹׂרֵק
  choice: отборную лозу
  rationale: Слово обозначает благородную, особо ценную виноградную лозу; «отборная лоза» естественно передаёт качественную характеристику и сохраняет образ.
- source_word: כֻּלֹּה זֶרַע אֱמֶת
  choice: всю из подлинного семени
  rationale: Фраза подчёркивает, что вся лоза произошла из чистого, надёжного посадочного материала. «Подлинное» в данном контексте не навязывает исключительно нравственное значение אֱמֶת.
- source_word: וְאֵיךְ
  choice: Как же
  rationale: Частица вводит риторический вопрос с оттенком изумления и резкого противопоставления предшествующему утверждению.
- source_word: נֶהְפַּכְתְּ לִי
  choice: ты превратилась у Меня
  rationale: Нифаль от הפך выражает изменение состояния; дательный לִי сохранён оборотом «у Меня», передающим личностно-оценочное отношение Бога и не утяжеляющим русскую фразу.
- source_word: סוּרֵי
  choice: выродившиеся побеги
  rationale: Форма трудна для точного истолкования; в контексте она обозначает уклонившийся от исходного качества, испорченный рост лозы. Выбор сохраняет и образ побегов, и смысл порчи.
- source_word: הַגֶּפֶן נָכְרִיָּה
  choice: чужой лозы
  rationale: נָכְרִיָּה означает «чужая, иноземная». «Чужая лоза» звучит естественно по-русски и сохраняет оттенок отчуждённости.
theological_decisions:
- issue: Образ Израиля/Иуды как лозы, посаженной Богом
  choice: Сохранён развёрнутый образ лозы, семени и побегов без сведения его к прямому нравственному пояснению.
  alternative: «Я создал тебя чистым народом, но ты развратилась».
  rationale: Сельскохозяйственная метафора принадлежит самому еврейскому тексту, несёт пророческие и заветные ассоциации и сохраняет напряжение между Божьим добрым насаждением и последующим перерождением народа.
- issue: Значение אֱמֶת в выражении זֶרַע אֱמֶת
  choice: «подлинного семени»
  alternative: «верного семени»
  rationale: В контексте посадочного материала вероятнее акцент на подлинности и доброкачественности; перевод «верного» мог бы преждевременно сузить образ до нравственной или заветной верности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род («тебя», «превратилась») сохраняет олицетворение народа как лозы. Тире помогает ясно связать уточнение о происхождении всей лозы с первым образом; риторическое «Как же» передаёт потрясённый укор.
