source:
  edition: WLC
  text: הַ/דּ֗וֹר אַתֶּם֙ רְא֣וּ דְבַר יְהוָ֔ה הֲ/מִדְבָּ֤ר הָיִ֨יתִי֙ לְ/יִשְׂרָאֵ֔ל אִ֛ם אֶ֥רֶץ מַאְפֵּ֖לְיָ֑ה מַדּ֜וּעַ אָמְר֤וּ עַמִּ/י֙ רַ֔דְנוּ לֽוֹא נָב֥וֹא ע֖וֹד אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/031.yaml
  text: 'O generation[a], you yourselves, see the word of Yahweh: Have I been a wilderness to Israel, or a land of deep darkness? Why has my people said, ‘We are lords; we will come to you no more’?”'
translation:
  language: ru
  text: 'О поколение! Вы сами вникните в слово Яхве: разве Я был для Израиля пустыней или землёй непроглядной тьмы? Почему Мой народ сказал: «Мы сами себе хозяева[a] и больше к Тебе не придём»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение еврейского глагола неясно. Возможны переводы: «мы свободно скитаемся», «мы господствуем» или «мы вырвались на свободу». В данном контексте реплика выражает притязание народа на независимость от Яхве.'
    reason: Сохраняет существенную лексическую неоднозначность формы רַדְנוּ, не выдавая контекстуальное понимание за единственно возможное значение.
lexical_decisions:
- source_word: הַדּוֹר
  choice: О поколение!
  rationale: Форма с артиклем употреблена как прямое обращение. Краткое «О поколение!» сохраняет торжественный пророческий призыв.
- source_word: אַתֶּם רְאוּ דְבַר יְהוָה
  choice: Вы сами вникните в слово Яхве
  rationale: Самостоятельное местоимение אַתֶּם передаёт усиление («вы сами»). Буквальное «увидьте слово» по-русски неестественно; «вникните» выражает призыв внимательно воспринять сказанное, сохраняя формулу «слово Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: הֲמִדְבָּר הָיִיתִי לְיִשְׂרָאֵל
  choice: разве Я был для Израиля пустыней
  rationale: Сохранена метафора бесплодного и негостеприимного места; вопросительная частица естественно передана словом «разве».
- source_word: אֶרֶץ מַאְפֵּלְיָה
  choice: землёй непроглядной тьмы
  rationale: Передаёт усиленное значение мрака и сохраняет параллель с образом пустыни.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Прямо передаёт заветное обозначение народа; прописная буква в местоимении отражает современную русскую библейскую издательскую норму.
- source_word: רַדְנוּ
  choice: Мы никому не подвластны[a]
  rationale: Трудная форма допускает толкования, связанные со свободным скитанием, господством или освобождением от уз. В контексте реплика выражает притязание народа на независимость; основной перевод передаёт это, а примечание сохраняет лексическую неопределённость.
- source_word: לֹא נָבוֹא עוֹד אֵלֶיךָ
  choice: больше к Тебе не придём
  rationale: Естественно и выразительно передаёт отрицание дальнейшего возвращения или приближения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя, присутствующее в еврейском тексте, не заменяя его титулом.
- issue: Толкование трудного глагола רַדְנוּ
  choice: Мы никому не подвластны
  alternative: Мы странствуем на свободе; мы господствуем; мы вырвались на свободу
  rationale: Основной текст передаёт контекстуальную мысль о заявленной независимости от Яхве, но не сводит неоднозначную форму к узкому догматическому утверждению; варианты вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с dignified пророческой интонацией. Риторические вопросы переданы естественно, без архаизмов; обращение и местоимения, относящиеся к Богу, оформлены в традиционной русской библейской манере.
