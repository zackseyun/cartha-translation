  text: In the fourth month[a], on the ninth day of the month, the famine became severe in the city, and there was no bread for the people of the land.
translation:
  language: ru
  text: В четвёртом месяце, в девятый день месяца, голод в городе усилился, и у жителей страны не было хлеба.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרְבִיעִי
  choice: В четвёртом месяце
  rationale: Передаёт еврейское обозначение даты без добавления отсутствующих в тексте слов «года» или названия месяца.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: в девятый день месяца
  rationale: Естественная русская передача стандартной еврейской формулы датировки; слово «день» подразумевается в оригинале.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: голод … усилился
  rationale: Глагол חזק буквально связан с силой, но при подлежащем «голод» означает нарастание, усиление бедствия.
- source_word: בָּעִיר
  choice: в городе
  rationale: Сохраняет простой локатив; из контекста ясно, что речь идёт об Иерусалиме, поэтому его название не добавляется.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: не было хлеба
  rationale: Сохраняет конкретное значение לֶחֶם «хлеб», не заменяя его более широким словом «пища».
- source_word: לְעַם הָאָרֶץ
  choice: у народа земли
  rationale: Буквальная передача неоднозначного выражения עַם הָאָרֶץ сохраняет его образ и не решает без достаточных оснований, обозначает ли оно всё население страны или простонародье.
