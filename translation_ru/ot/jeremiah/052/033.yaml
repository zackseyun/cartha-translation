  text: וְ/שִׁנָּ֕ה אֵ֖ת בִּגְדֵ֣י כִלְא֑/וֹ וְ/אָכַ֨ל לֶ֧חֶם לְ/פָנָ֛י/ו תָּמִ֖יד כָּל יְמֵ֥י חַיָּֽ/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/033.yaml
  text: And he changed out of his prison clothes and ate bread before him continually all the days of his life[a][b].
translation:
  language: ru
  text: Он сменил свою тюремную одежду[a] и постоянно ел хлеб перед ним[b] во все дни своей жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «одежду своего заключения».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ел хлеб перед ним»; вероятно, имеется в виду, что он регулярно принимал пищу в присутствии царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּה
  choice: сменил
  rationale: Глагол שׁנה здесь означает «менять, сменять»; дополнение названо далее. Русское «сменил одежду» естественно передаёт снятие тюремной одежды и замену её другой.
- source_word: אֵת בִּגְדֵי כִלְאוֹ
  choice: свою тюремную одежду
  rationale: בִּגְדֵי означает «одежда, одеяния», а כִלְאוֹ — его заключение. Выражение «тюремная одежда» ясно и современно, тогда как более буквальное «одежда его заключения» по-русски тяжеловесно.
- source_word: וְאָכַל לֶחֶם
  choice: ел хлеб
  rationale: Сохранено буквальное «ел хлеб», которое в древнееврейском также может обозначать принятие пищи вообще; такая передача удерживает образ совместной царской трапезы, не делая подразумеваемое значение частью основного текста.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Буквально «перед его лицом, перед ним». Такая передача сохраняет формальность и местоименную соотнесённость исходного текста; «за его столом» было бы более истолковывающим.
- source_word: תָּמִיד
  choice: постоянно
  rationale: תָּמִיד выражает непрерывную или регулярную повторяемость. «Постоянно» сохраняет это значение и естественно сочетается с последующим временным оборотом.
- source_word: כָּל יְמֵי חַיָּו
  choice: во все дни своей жизни
  rationale: Сохранён обычный древнееврейский оборот и его ритм. По контексту речь идёт об оставшихся днях жизни, но исходный текст буквально этого не уточняет.
