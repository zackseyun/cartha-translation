base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/034.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king of Babylon, a daily portion day by day, until the day of his death, all the days of his life.
translation:
  language: ru
  text: И содержание его[a] — постоянное содержание — выдавалось ему от царя Вавилона ежедневно, в размере, положенном на каждый день, до дня его смерти, во все дни его жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «паёк», «обеспечение» или «положенная доля» (евр. אֲרֻחָה). Здесь имеется в виду назначенное царём содержание Иехонии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: содержание / содержание его
  rationale: В данном контексте слово обозначает назначенное царём материальное обеспечение Иехонии, а не просто отдельную трапезу. «Содержание» естественно передаёт длительное обеспечение и допускает административный оттенок.
- source_word: תָּמִיד
  choice: постоянное
  rationale: Передаёт непрерывный, регулярный характер обеспечения и сохраняет повтор существительного, подчёркнутый в еврейском тексте.
- source_word: נִתְּנָה
  choice: выдавалось
  rationale: Сохраняет пассивную конструкцию и в контексте назначенного содержания звучит естественнее буквального «давалось».
- source_word: מֵאֵת מֶלֶךְ בָּבֶל
  choice: от царя Вавилона
  rationale: Предлог «от» передаёт источник содержания, выраженный еврейским מֵאֵת, не сводя оборот исключительно к обозначению действующего лица.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: изо дня в день, сколько полагалось на каждый день
  rationale: Передаёт как ежедневную регулярность, так и назначенную на каждый день меру; умеренная развёрнутость сохраняет смысл еврейской распределительной идиомы.
- source_word: עַד יוֹם מוֹתוֹ
  choice: до дня его смерти
  rationale: Формально и ясно воспроизводит полную конструкцию исходного текста.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: во все дни его жизни
  rationale: Сохраняет традиционную библейскую каденцию и буквальную протяжённость выражения, не устраняя намеренное итоговое повторение.
