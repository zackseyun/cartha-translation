  source_fidelity: 'Русский текст точно передаёт перечисление и синтаксические связи еврейского оригинала: придворный чиновник поставлен над воинами; семь лиц, имевших доступ к царю, находились в городе; писец военачальника осуществлял набор народа страны; шестьдесят человек также находились в городе. «В городе» вместо более буквального «внутри города» не утрачивает существенного смысла.'
