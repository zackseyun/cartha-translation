source:
  edition: WLC
  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר הָיָ֥ה פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וְ/שִׁבְעָ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת סֹפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בְּ/ת֥וֹךְ הָ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/025.yaml
  text: And from the city he took one court official who had been appointed over the men of war[a], and seven men from those who saw the king’s face, who were found in the city, and the scribe of the commander of the army, who mustered the people of the land, and sixty men from the people of the land who were found within the city.
translation:
  language: ru
  text: А из города он взял одного придворного, поставленного над воинами, семерых из тех, кто видел лицо царя[a] и находился в городе, писца военачальника, проводившего набор среди народа страны, и шестьдесят человек из народа страны, находившихся в городе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из приближённых царя»: выражение «видеть лицо царя» означает иметь непосредственный доступ к нему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: придворный
  rationale: Слово может обозначать как евнуха, так и придворного должностного лица. Контекст указывает на высокий служебный пост, но не требует утверждать физический статус человека.
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: поставленного над воинами
  rationale: Передаёт назначение на руководящую должность и сохраняет военный смысл исходного выражения.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: из тех, кто видел лицо царя
  rationale: Основной текст сохраняет образное придворное выражение, обозначающее непосредственный доступ к царю; его значение поясняется в сноске.
- source_word: סֹפֵר שַׂר הַצָּבָא
  choice: писца военачальника
  rationale: 'Сохраняет конструкцию принадлежности: речь идёт о писце или секретаре, состоявшем при начальнике войска.'
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: проводившего набор среди народа страны
  rationale: Причастие каузативной породы обозначает организацию набора или призыва на военную службу. Формулировка естественна по-русски и не уточняет сверх текста, был ли набор всеобщим или выборочным.
- source_word: עַם הָאָרֶץ
  choice: народ страны
  rationale: Буквально и достаточно естественно передаёт выражение, которое может обозначать население страны и иметь общественно-политический оттенок; вариант «простонародье» был бы чрезмерно узким.
- source_word: בְּתוֹךְ הָעִיר
  choice: в городе
  rationale: Естественная русская передача местонахождения без стилистически тяжёлого «внутри города».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно формальным повествовательным регистром. Сохранён придворный образ «видеть лицо царя», но его идиоматическое значение разъяснено в сноске. Длинное перечисление исходного текста сохранено, при этом синтаксис сделан понятным для современного читателя.
