base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/015.yaml
  text: And some of the poorest of the people[a], and the rest of the people who remained in the city, and the deserters who had defected to the king of Babylon, and the rest of the craftsmen—Nebuzaradan, the captain of the guard[c][b], carried into exile.
translation:
  language: ru
  text: А некоторых из беднейших в народе, остальных людей, остававшихся в городе, перебежчиков, которые перешли на сторону[b] царя Вавилона, и остальных ремесленников[a] Невузарадан, начальник стражи[c], отправил в изгнание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставшуюся массу народа». Значение еврейского слова здесь неясно; в данном контексте его нередко понимают как обозначение ремесленников. Ср. параллельное повествование в 4 Царств 25:11.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «павших, которые пали к царю Вавилона»; это идиома, означающая переход на его сторону.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «начальник палачей»; так называлась должность начальника царской стражи. Ср. 4 Царств 25:11.'
    reason: cross_reference
lexical_decisions:
- source_word: וּמִדַּלּוֹת הָעָם
  choice: некоторых из беднейших жителей
  rationale: 'Предлог מִן имеет разделительное значение: речь идёт о части беднейших слоёв народа. «Жителей» в данном контексте звучит естественнее буквального «народа» и не меняет референта.'
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: остальных людей, остававшихся в городе
  rationale: Передаёт как יֶתֶר («остальные»), так и причастие הַנִּשְׁאָרִים («остававшиеся»), не сливая их в одно понятие.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ אֶל מֶלֶךְ בָּבֶל
  choice: перебежчиков, которые перешли на сторону царя Вавилона
  rationale: В военно-политическом контексте נפל אֶל — идиома перехода на сторону противника. Сочетание существительного и придаточного предложения отражает повтор корня в еврейском тексте, оставаясь естественным по-русски.
- source_word: יֶתֶר הָאָמֹון
  choice: остальных ремесленников
  rationale: Значение אָמוֹן в этом месте неясно. Контекст депортации и параллель в 4 Царств 25:11 позволяют понимать слово как обозначение ремесленников; альтернативное понимание «множество людей» сохранено в сноске.
- source_word: הֶגְלָה
  choice: отправил в изгнание
  rationale: Порода хифиль глагола גלה означает принудительно выселить, депортировать. Выбранная формулировка точно передаёт изгнание и сохраняет торжественный исторический регистр.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Буквальное значение связано с начальником палачей, однако при царском дворе это название должности главы стражи, выполнявшей также карательные функции.
