  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָֽיְתָה֙ בִּ/ירוּשָׁלִַ֣ם וִֽ/יהוּדָ֔ה עַד הִשְׁלִיכ֥/וֹ אוֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/003.yaml
  text: For because of the anger of Yahweh it came to pass in Jerusalem and Judah[a], until he cast them out from before his face[b]; and Zedekiah rebelled against the king of Babylon.
translation:
  language: ru
  text: Ибо из-за гнева Яхве это было в Иерусалиме и Иудее, пока Он не изгнал их от лица Своего[a]. А Седекия восстал против царя Вавилона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пока Он не бросил их прочь от лица Своего», то есть не удалил из Своего присутствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение событий, описанных в предшествующем контексте.
- source_word: עַל אַף יְהוָה
  choice: из-за гнева Яхве
  rationale: Еврейское выражение указывает на причину происходящего — гнев Яхве; буквальный образ «нос» в русском не передаёт значения идиомы.
- source_word: הָיְתָה
  choice: всё это происходило
  rationale: Глагол женского рода не имеет явно выраженного подлежащего и отсылает к бедствиям в контексте; русская формулировка естественно сохраняет эту контекстуальную отсылку.
- source_word: בִּירוּשָׁלִַם וִיהוּדָה
  choice: с Иерусалимом и Иудеей
  rationale: При выбранной русской конструкции «происходило» предлог «с» естественно обозначает тех, кого постигли описанные события.
- source_word: עַד הִשְׁלִיכוֹ אוֹתָם
  choice: пока Он не отверг их
  rationale: Конструкция עַד с инфинитивом обозначает предел развития событий, а Hiphil от שלך — решительное удаление или изгнание.
- source_word: מֵעַל פָּנָיו
  choice: от Своего лица
  rationale: Сохранён конкретный древнееврейский образ удаления от Божьего лица, то есть из Его присутствия.
- source_word: וַיִּמְרֹד
  choice: А ... восстал
  rationale: מרד обозначает политический мятеж или восстание; союз передаёт переход к следующему повествовательному событию.
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: против царя Вавилона
  rationale: При глаголе מרד предлог בְּ выражает направленность восстания против правителя.
theological_decisions:
- issue: Божественный гнев как причина суда
  choice: «из-за гнева Яхве»
  alternative: «из-за негодования Яхве»
  rationale: Текст прямо связывает бедствия Иерусалима и Иудеи с гневом Яхве; перевод не смягчает и не усиливает это причинное утверждение.
- issue: Удаление от Божьего лица
  choice: сохранить образ «от Своего лица»
  alternative: «из Своего присутствия»
  rationale: Буквальный образ значим и понятен по-русски; сноска поясняет его смысл, не устраняя образ из основного текста.
- issue: Неявное подлежащее הָיְתָה
  choice: «всё это происходило» как отсылка к контексту
  alternative: «это случилось»
  rationale: Выбор делает русскую фразу грамматически полноценной, не называя конкретного события, которого еврейский текст здесь явно не называет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Имя יהוה передано как «Яхве». Прописные местоимения при указании на Бога использованы согласно принятой русской религиозно-издательской норме.
