  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם אֶחָד֙ וְ/הַ/בָּקָ֞ר שְׁנֵים עָשָׂ֤ר נְחֹ֨שֶׁת֙ אֲשֶׁר תַּ֣חַת הַ/מְּכֹנ֔וֹת אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֻשְׁתָּ֖/ם כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/020.yaml
  text: As for the two pillars[a], the one Sea, and the twelve bronze oxen that were under the stands[b], which King Solomon had made for the house of Yahweh—there was no weighing the bronze of all these vessels.
translation:
  language: ru
  text: Два столба, одно Море[a] и двенадцать медных быков[b], находившихся под подставками[c], — все эти предметы царь Соломон изготовил для дома Яхве. Вес меди всех этих предметов не был установлен[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Море» — большой храмовый водоём, то есть огромная чаша для воды.
    reason: cultural_clarification
  - marker: b
    text: 'Или: «двенадцать медных волов»; еврейское слово обозначает крупный рогатый скот.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «под основаниями». Формулировка еврейского текста необычна; в других описаниях двенадцать быков служат опорой Моря.'
    reason: textual_clarification
  - marker: d
    text: 'Буквально: «не было веса их меди»; возможно, её не взвешивали, её вес не был указан или он считался неисчислимым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: два столба
  rationale: עַמּוּדִים обозначает несущие или отдельно стоящие столбы; в контексте храмового убранства «столбы» — естественный и традиционный русский термин.
- source_word: הַיָּם אֶחָד
  choice: одно Море
  rationale: יָם здесь — название большого храмового водоёма, поэтому сохранено «Море» с прописной буквы; числительное отражает перечневую форму еврейского текста.
- source_word: וְהַבָּקָר שְׁנֵים עָשָׂר נְחֹשֶׁת
  choice: и двенадцать медных быков
  rationale: בָּקָר может обозначать крупный рогатый скот, волов или быков; для изображений, служивших опорами храмового сооружения, по-русски естественно «быки». נְחֹשֶׁת передано как «медь», традиционное и понятное обозначение материала; точный состав древнего сплава текст не уточняет.
- source_word: אֲשֶׁר תַּחַת הַמְּכֹנוֹת
  choice: находившихся под подставками
  rationale: מְכֹנוֹת означает основания или подставки храмовых сосудов. Перевод сохраняет необычную формулировку масоретского текста, не исправляя её по параллельным описаниям.
- source_word: אֲשֶׁר עָשָׂה הַמֶּלֶךְ שְׁלֹמֹה
  choice: все эти предметы царь Соломон изготовил
  rationale: Относительная конструкция перестроена в отдельную русскую предикацию ради ясности; её отнесение ко всему перечислению соответствует заключительному כָּל הַכֵּלִים הָאֵלֶּה.
- source_word: לְבֵית יְהוָה
  choice: для дома Яхве
  rationale: בֵּית передано буквально как «дом», сохраняя библейское обозначение храма; личное имя יהוה транслитерировано как «Яхве».
- source_word: לֹא הָיָה מִשְׁקָל לִנְחֻשְׁתָּם
  choice: вес их меди невозможно было определить
  rationale: 'Буквально: «не было веса их меди». Русская формулировка передаёт идиоматический смысл огромного, не установленного веса, а примечание сохраняет возможную неоднозначность между отсутствием взвешивания и невозможностью исчисления.'
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: все эти предметы
  rationale: כֵּלִים — широкое обозначение вещей, изделий или утвари. Поскольку в перечне есть столбы и скульптурные фигуры, «предметы» здесь точнее общего «сосуды».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, Тетраграмматон. «Яхве» прямо передаёт имя и не заменяет его титулом.
- issue: Необычное указание, что быки находились под подставками
  choice: сохранить чтение масоретского текста
  alternative: согласовать описание с параллельными местами и указать, что быки находились под Морем
  rationale: Фраза אֲשֶׁר תַּחַת הַמְּכֹנוֹת в представленном еврейском тексте относится к ближайшему существительному «быки». Перевод не должен молча устранять текстовую или предметную трудность.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового повествования. Перечень сделан синтаксически ясным, но технические названия и неоднозначность заключительной фразы сохранены. «Медный» употреблено как естественное библейское обозначение материала без утверждения о точном составе сплава.
