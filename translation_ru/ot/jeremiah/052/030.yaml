base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/030.yaml
  text: In the twenty-third year of Nebuchadnezzar[a], Nebuzaradan the captain of the guard carried away 745 Judeans[c][b]. All the persons were 4,600.
translation:
  language: ru
  text: В двадцать третий год царствования Навуходоносора[a] Навузардан, начальник стражи, увёл в плен[b] 745 иудеев. Всего — 4600 человек[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в двадцать третий год Навуходоносора», то есть в двадцать третий год его царствования.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отправил в изгнание», «переселил». Древнееврейский глагол означает принудительно увести в изгнание.'
    reason: lexical_alternative
  - marker: c
    text: Итоговое число 4600 суммирует уведённых в плен, перечисленных в стихах 28–30. В обоих подсчётах древнееврейское слово, буквально означающее «душа», употреблено в значении «человек».
    reason: cross_reference
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ וְעֶשְׂרִים לִנְבוּכַדְרֶאצַּר
  choice: В двадцать третий год царствования Навуходоносора
  rationale: Предлог לְ обозначает отсчёт по годам правления царя; добавление «царствования» естественно и недвусмысленно передаёт смысл древнееврейской формулы датировки.
- source_word: הֶגְלָה
  choice: увёл в плен
  rationale: Порода хифиль глагола גלה означает принудительно отправить в изгнание. «Увёл в плен» сохраняет исторический тон и понятнее широкому читателю, чем канцелярское «депортировал».
- source_word: נְבוּזַרְאֲדָן
  choice: Навузардан
  rationale: Имя передано в принятой русской библейской форме.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: В контексте это официальный придворно-военный титул. Буквальное «начальник палачей» возможно этимологически, но здесь способно неверно сузить должностной смысл.
- source_word: יְהוּדִים
  choice: иудеев
  rationale: В данном историческом контексте слово обозначает жителей и народ Иудеи; «иудеи» сохраняет этногеографический оттенок.
- source_word: נֶפֶשׁ
  choice: человек
  rationale: При подсчёте נֶפֶשׁ является счётным обозначением людей; русское «человек» естественно и не вносит неуместного метафизического смысла слова «душа».
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: '745'
  rationale: Цифровая запись точно передаёт число и облегчает восприятие статистического перечня.
- source_word: כָּל נֶפֶשׁ אַרְבַּעַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: Всего — 4600 человек
  rationale: Естественная русская итоговая формула передаёт суммирующее значение древнееврейского выражения и точное число.
