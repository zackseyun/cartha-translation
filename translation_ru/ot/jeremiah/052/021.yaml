base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/021.yaml
  text: As for the pillars[a], the height of each pillar was eighteen cubits, and a line of twelve cubits would go around it; its thickness was four fingers, and it was hollow.
translation:
  language: ru
  text: Что касается столбов, высота каждого из них была восемнадцать локтей; шнур длиной в двенадцать локтей охватывал столб. Толщина его стенки составляла четыре пальца[a], и он был полым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть четыре пальца в ширину. В еврейском тексте буквально: «четыре пальца» — мера длины, основанная на ширине пальца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעַמּוּדִים
  choice: Что касается столбов
  rationale: Оборот естественно вводит столбы как тему описания; начальный союз וְ и определённое существительное переданы без добавления нового содержания.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה קומה הָעַמֻּד הָאֶחָד
  choice: высота каждого из них была восемнадцать локтей
  rationale: Еврейский текст буквально говорит о высоте «одного столба», но при начальном множественном числе эта мера характеризует каждый из двух столбов. Формулировка сохраняет индивидуальное применение размера и звучит естественно по-русски.
- source_word: חוּט
  choice: шнур
  rationale: Слово обозначает нить или шнур; в контексте измерения окружности «шнур» конкретен и естественен.
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה יְסֻבֶּנּוּ
  choice: шнур длиной в двенадцать локтей охватывал столб
  rationale: Глагол סבב выражает охватывание по окружности. Явное повторение слова «столб» устраняет неясность русского местоимения и передаёт способ указания окружности.
- source_word: עָבְיוֹ
  choice: толщина его стенки
  rationale: Поскольку столб назван полым, речь идёт о толщине материала, то есть стенки, а не о полном диаметре столба.
- source_word: אַרְבַּע אַצְבָּעוֹת
  choice: четыре пальца
  rationale: Сохранено буквальное, основанное на ширине пальца обозначение меры; пояснение дано в сноске.
- source_word: נָבוּב
  choice: внутри он был полым
  rationale: Передаёт характеристику полой конструкции ясным современным русским выражением.
