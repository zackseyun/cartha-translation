revisions:
- from: Но войско халдеев погналось за царём и настигло Седекию на равнинах Иерихона[a]. Всё его войско разбежалось, оставив его.
  to: Но войско халдеев погналось за царём и настигло Седекию на равнинах Иерихона[a]. А всё его войско разбежалось от него.
  rationale: Заменено «оставив его» на «от него», чтобы непосредственно передать מֵעָלָיו и не приписывать войску намеренного оставления царя. Союз «А» сохраняет повествовательную связь еврейского וְ без изменения смысла.
