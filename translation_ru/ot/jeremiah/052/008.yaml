  text: וַ/יִּרְדְּפ֤וּ חֵיל כַּשְׂדִּים֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ וַ/יַּשִּׂ֥יגוּ אֶת צִדְקִיָּ֖הוּ בְּ/עַֽרְבֹ֣ת יְרֵח֑וֹ וְ/כָל חֵיל֔/וֹ נָפֹ֖צוּ מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/008.yaml
  text: But the army of the Chaldeans pursued the king and overtook Zedekiah in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: ru
  text: Но войско халдеев погналось за царём и настигло Седекию на равнинах Иерихона[a]. А всё его войско разбежалось от него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в степях Иерихона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: войско халдеев
  rationale: חֵיל здесь обозначает военную силу, а כַּשְׂדִּים — употреблённое в еврейском тексте этнополитическое название; «халдеев» точнее следует форме оригинала, чем контекстуальное «вавилонян».
- source_word: וַיִּרְדְּפוּ אַחֲרֵי הַמֶּלֶךְ
  choice: погналось за царём
  rationale: רדף в военном повествовании означает преследование; русское «погналось за» естественно передаёт начавшуюся погоню и согласуется с собирательным существительным «войско».
- source_word: וַיַּשִּׂיגוּ אֶת־צִדְקִיָּהוּ
  choice: настигло Седекию
  rationale: נשׂג означает догнать преследуемого; «настигло» точно и естественно для военного повествования.
- source_word: בְּעַרְבֹת יְרֵחוֹ
  choice: на равнинах Иерихона
  rationale: עֲרָבוֹת обозначает равнинную степную местность. «Равнины» понятно современному читателю, а более специальное «степи» сохранено в примечании как возможный вариант.
- source_word: וְכָל־חֵילוֹ נָפֹצוּ מֵעָלָיו
  choice: Всё его войско разбежалось, оставив его
  rationale: Множественная форма נָפֹצוּ при собирательном חֵיל изображает рассеяние воинов. «Разбежалось» естественно передаёт распад войска, а «оставив его» ясно выражает отделение от Седекии в מֵעָלָיו.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным для русского: собирательное «войско» согласовано в единственном числе, тогда как значение еврейского множественного глагола передано глаголом «разбежалось». Маркер примечания поставлен непосредственно после соответствующего выражения.'
