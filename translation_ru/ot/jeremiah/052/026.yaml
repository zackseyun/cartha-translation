base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/026.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: ru
  text: Навузардан, начальник царской стражи[a], взял их и отвёл[b] к вавилонскому царю в Ривлу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «начальник убивающих»; этот титул обозначал начальника царской стражи, который, возможно, также ведал казнями.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «доставил». Еврейский глагол здесь может передавать значение «отвёл», «привёл» или «доставил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное повествовательное значение לקח — «взять». Контекст допускает пленение, но более сильное «схватил» не выражено самим глаголом однозначно.
- source_word: אוֹתָם
  choice: их
  rationale: Местоимение прямого дополнения отсылает к должностным лицам, названным в предыдущем стихе.
- source_word: נְבוּזַרְאֲדָן
  choice: Невузардан
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: רַב טַבָּחִים
  choice: начальник царской стражи
  rationale: Буквально титул означает «начальник убивающих/палачей», но при царском дворе обозначает начальника стражи, чьи обязанности могли включать приведение приговоров в исполнение. Слово «царской» ясно передаёт придворный характер должности.
- source_word: וַיֹּלֶךְ
  choice: отвёл
  rationale: Каузативная форма глагола הלך с прямым дополнением и направлением означает «повёл/доставил». В контексте конвоирования людей русское «отвёл» звучит естественно и не уточняет способ перемещения.
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: к вавилонскому царю
  rationale: Предлог אֶל прямо выражает направление «к»; прилагательное «вавилонскому» естественно передаёт еврейское сочетание «царь Вавилона».
- source_word: רִבְלָתָה
  choice: в Ривлу
  rationale: Направительное окончание у названия города допускает значение движения в Ривлу. Такая формулировка одновременно согласуется с контекстом, где в Ривле находился вавилонский царь.
