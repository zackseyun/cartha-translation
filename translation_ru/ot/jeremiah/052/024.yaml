  - marker: b
    text: 'Или: «священника второго ранга»; или: «священника-заместителя».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «трёх привратников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: В нововавилонском царском контексте это устойчивое обозначение начальника царской стражи; буквальное «начальник палачей» здесь звучало бы чрезмерно узко и могло бы исказить должностной смысл.
- source_word: וַיִּקַּח
  choice: взял
  rationale: Сохраняет обычное значение לקח и не усиливает его до «схватил» или «арестовал», хотя по контексту речь идёт о взятии под стражу.
- source_word: שְׂרָיָה
  choice: Сераию
  rationale: Традиционная и узнаваемая русская передача библейского имени; форма винительного падежа обусловлена синтаксисом.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: главного священника
  rationale: Передаёт буквальное сочетание «священник-глава / главный священник», не устраняя возможность понимания титула как «первосвященник».
- source_word: צְפַנְיָה
  choice: Софонию
  rationale: Использована укоренившаяся в русской библейской традиции форма имени; винительный падеж соответствует синтаксису.
- source_word: כֹּהֵן הַמִּשְׁנֶה
  choice: второго священника
  rationale: Достаточно буквально сохраняет указание на второй ранг и не уточняет без необходимости, был ли это формальный заместитель.
- source_word: שְׁלֹשֶׁת
  choice: трёх
  rationale: Естественная русская форма количественного числительного при одушевлённом дополнении во множественном числе.
- source_word: שֹׁמְרֵי הַסַּף
  choice: хранителей порога
  rationale: Сохраняет конкретный образ и должностное обозначение еврейского выражения; вероятно, имеются в виду храмовые привратники или стражи входа.
theological_decisions:
- issue: Статус כֹּהֵן הָרֹאשׁ
  choice: главный священник
  alternative: первосвященник
  rationale: Основной текст прозрачно отражает формулировку «священник-глава», а сноска сохраняет традиционное титульное понимание.
- issue: Статус כֹּהֵן הַמִּשְׁנֶה
  choice: второй священник
  alternative: заместитель священника / священник второго ранга
  rationale: Перевод не определяет точные полномочия должности сверх того, что выражает еврейское указание на второе положение.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским регистром. Синтаксис сохранён простым и последовательным; традиционные формы имён «Сераия» и «Софония» обеспечивают узнаваемость. Все смысловые альтернативы, которые нельзя уверенно разрешить по еврейскому тексту, вынесены в сноски.
