  naturalness: Черновик в целом написан естественным современным литературным русским языком. Предлагаемая редакция сохраняет эту ясность, но точнее распределяет обстоятельства осады.
  terminology: «Навуходоносор» — нормативная традиционная русская форма. «Осадный вал» — уместное конкретное соответствие דָּיֵק; сноска сохраняет более широкие лексические варианты. Формула «сам и всё его войско» передаёт выделительное הוּא וְכָל־חֵילוֹ.
