base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/004.yaml
  text: And in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, Nebuchadnezzar king of Babylon came—he and all his army—against Jerusalem[b], and they encamped against it and built a siege wall around it.
translation:
  language: ru
  text: На девятом году его царствования, в десятом месяце, в десятый день месяца Навуходоносор[a], царь Вавилона, сам и всё его войско выступили против Иерусалима. Они расположились лагерем против него и возвели вокруг него осадный вал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское написание имени здесь точнее передаётся как «Невухадреццар»; «Навуходоносор» — его традиционная русская форма.
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово דָּיֵק можно также перевести как «осадные сооружения» или «укрепление».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: На девятом году…
  rationale: Повествовательная формула вводит датированное событие; по-русски естественно передать её непосредственно временным оборотом, без архаичного «и было».
- source_word: בַשָּׁנָה הַתְּשִׁעִית לְמָלְכוֹ
  choice: на девятом году его царствования
  rationale: Точно передаёт обычную формулу датировки по годам правления и сохраняет местоимение «его», отсылающее к предшествующему контексту.
- source_word: בַחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: в десятом месяце, в десятый день месяца
  rationale: Сохраняет обе календарные характеристики без добавления отсутствующего в еврейском тексте названия месяца.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Устоявшаяся и легко узнаваемая русская форма имени; особенность еврейского написания отмечена в сноске.
- source_word: בָּא ... עַל יְרוּשָׁלַםִ
  choice: подошёл к Иерусалиму
  rationale: В военном контексте сочетание обозначает прибытие войска с враждебной целью; «подошёл к» звучит естественно и не повторяет последующее описание осады.
- source_word: הוּא וְכָל חֵילוֹ
  choice: со всем своим войском
  rationale: Передаёт участие царя и всей его военной силы естественным русским оборотом.
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: они расположились вокруг города
  rationale: Множественное число относится к царю и войску. Слово «города» ясно указывает на Иерусалим и избегает неестественного местоимения среднего рода.
- source_word: וַיִּבְנוּ עָלֶיהָ דָּיֵק סָבִיב
  choice: возвели осадный вал
  rationale: «Осадный вал» конкретно и понятно передаёт דָּיֵק; идею окружения выражает непосредственно предшествующее «вокруг города».
