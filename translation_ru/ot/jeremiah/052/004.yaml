    rationale: Предлог עַל в данном военном контексте выражает направленность против города. Нейтральное «к» ослабляет смысл нападения/осады.
  - severity: medium
    issue: «расположились вокруг города и возвели осадный вал»
    rationale: Слово סָבִיב («вокруг») синтаксически завершает сообщение о строительстве דָּיֵק. В черновике оно отнесено к расположению войска, а окружение осадным валом не выражено.
  - severity: low
    issue: «со всем своим войском» не вполне воспроизводит выделительное местоимение הוּא
    rationale: Смысл в целом сохранён, но «сам и всё его войско» точнее передаёт эксплицитное «он и всё его войско».
