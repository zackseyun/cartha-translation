  to: На девятом году его царствования, в десятом месяце, в десятый день месяца Навуходоносор[a], царь Вавилона, сам и всё его войско выступили против Иерусалима. Они расположились лагерем против него и возвели вокруг него осадный вал[b].
  rationale: Редакция восстанавливает военную направленность «против Иерусалима», передаёт явное сочетание царя со всем его войском и относит «вокруг него» к сооружению осадного вала, как в еврейском тексте. Смысл, датировка и современный литературный регистр сохранены.
