    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: Он сжёг
  rationale: Форма Qal wayyiqtol продолжает повествование; союз ו естественно не воспроизводится отдельным «и» в русском начале стиха.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Буквально «дом Яхве»; сохраняется исходный образ и личное имя יהוה, тогда как «храм» дан как ясная смысловая альтернатива в примечании.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дом
  rationale: Передаёт буквальное «дом царя» естественным русским сочетанием и сохраняет повтор слова בַּיִת; по смыслу это царский дворец.
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: все дома Иерусалима
  rationale: Сохраняет еврейскую конструкцию принадлежности при ясном значении домов, находившихся в городе.
- source_word: כָּל בֵּית הַגָּדוֹל
  choice: каждый большой дом
  rationale: Единственное число после כָּל передано дистрибутивно. גָּדוֹל может обозначать как размер, так и значительность, поэтому неоднозначность отмечена в сноске.
- source_word: שָׂרַף בָּאֵשׁ
  choice: предал огню
  rationale: Естественная и выразительная русская передача сочетания «сжёг огнём», сохраняющая его усилительный характер без ненужной тавтологии.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя יהוה; форма «Яхве» передаёт его как имя, не подменяя титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Повтор «дом» сохранён ради структуры еврейского текста; заключительное выражение передано идиоматически.
