  yaml_path: translation/ot/jeremiah/052/013.yaml
  text: He burned the house of Yahweh[a], the house of the king, and all the houses of Jerusalem[c][b]; every great house he burned with fire.
translation:
  language: ru
  text: Он сжёг дом Яхве[a], царский дом[b] и все дома Иерусалима; каждый большой дом[c] он предал огню.
  philosophy: optimal-equivalence
