  text: They captured the king and brought him up to the king of Babylon at Riblah in the land of Hamath[a], and he passed sentence on him.
translation:
  language: ru
  text: Царя схватили и привели к царю Вавилона в Ривлу, в земле Хамата, и царь Вавилона вынес ему приговор.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и изрёк ему судебные решения»; это древнееврейское выражение означает вынесение судебного приговора.'
    reason: Сноска сохраняет буквальный образ и множественное число מִשְׁפָּטִים, которые в основном тексте переданы естественной русской судебной формулой.
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ אֶת־הַמֶּלֶךְ
  choice: Царя схватили
  rationale: תפשׂ означает «схватить, захватить». В военном контексте «схватили» естественно передаёт пленение царя, не добавляя его имени.
- source_word: וַיַּעֲלוּ אֹתוֹ אֶל־מֶלֶךְ בָּבֶל
  choice: и отвели к царю Вавилона
  rationale: Каузативное употребление עלה буквально выражает движение «вверх», однако по-русски в данном повествовательном контексте естественнее «отвели»; направление к царю передано предлогом «к».
- source_word: רִבְלָתָה
  choice: в Ривлу
  rationale: Направительный суффикс передан русской конструкцией с винительным падежом; топоним транслитерирован как «Ривла».
- source_word: בְּאֶרֶץ חֲמָת
  choice: в земле Хамат
  rationale: אֶרֶץ здесь обозначает землю или область, связанную с Хаматом. Формулировка сохраняет географический способ выражения оригинала.
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: и тот вынес ему приговор
  rationale: Буквально выражение означает «говорил с ним/ему судебные решения», но в данном контексте это судебная идиома. «Вынес ему приговор» ясно и естественно передаёт её смысл; местоимение «тот» однозначно указывает на царя Вавилона.
