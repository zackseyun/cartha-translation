  text: וְ/כֹתֶ֨רֶת עָלָ֜י/ו נְחֹ֗שֶׁת וְ/קוֹמַ֨ת הַ/כֹּתֶ֥רֶת הָ/אַחַת֮ חָמֵ֣שׁ אַמּוֹת֒ וּ/שְׂבָכָ֨ה וְ/רִמּוֹנִ֧ים עַֽל הַ/כּוֹתֶ֛רֶת סָבִ֖יב הַ/כֹּ֣ל נְחֹ֑שֶׁת וְ/כָ/אֵ֛לֶּה לַֽ/עַמּ֥וּד הַ/שֵּׁנִ֖י וְ/רִמּוֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/022.yaml
  text: And on it was a bronze capital[a], and the height of the one capital was five cubits, with latticework and pomegranates on the capital all around, all of bronze. And the second pillar had the same[b], with pomegranates.
translation:
  language: ru
  text: На нём была бронзовая капитель, и высота этой капители составляла пять локтей. Капитель со всех сторон украшали сетчатый узор[a] и гранаты[b] — всё из бронзы. На втором столбе были такие же украшения, в том числе гранаты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сетка».'
    reason: lexical_alternative
  - marker: b
    text: То есть украшения в форме плодов граната.
    reason: cultural_note
lexical_decisions:
- source_word: כֹתֶרֶת
  choice: капитель
  rationale: В контексте храмовой архитектуры слово обозначает украшенную верхнюю часть столба; «капитель» — точный и употребительный русский архитектурный термин.
- source_word: עָלָיו
  choice: на нём
  rationale: Местоименный суффикс отсылает к столбу из предшествующего контекста; перевод сохраняет пространственное отношение.
- source_word: נְחֹשֶׁת
  choice: бронза / бронзовый
  rationale: В описаниях библейских металлических изделий נְחֹשֶׁת обычно обозначает бронзу; это исторически уместнее, чем «латунь», хотя значение «медь» лексически возможно.
- source_word: קוֹמַת
  choice: высота
  rationale: Здесь речь идёт о вертикальном размере капители.
- source_word: הָאַחַת
  choice: одной
  rationale: Еврейский текст выделяет одну из двух капителей, не обязательно называя её первой.
- source_word: חָמֵשׁ אַמּוֹת
  choice: пять локтей
  rationale: Сохранена древняя единица измерения, прямо названная в источнике.
- source_word: שְׂבָכָה
  choice: сетчатое плетение
  rationale: Слово обозначает декоративную конструкцию наподобие сети; этот вариант конкретен и понятен современному читателю.
- source_word: רִמּוֹנִים
  choice: гранаты
  rationale: Буквально «гранаты»; в архитектурном контексте имеются в виду украшения в форме плодов граната, что поясняется в сноске.
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Передаёт расположение украшений по окружности капители.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: всё из бронзы
  rationale: Кратко и естественно передаёт указание на материал всех названных элементов.
- source_word: וְכָאֵלֶּה
  choice: то же
  rationale: Еврейское сравнительное выражение указывает, что второй столб имел такие же элементы.
- source_word: לָעַמּוּד הַשֵּׁנִי
  choice: было и на втором столбе
  rationale: В еврейском выражении опущено сказуемое; его восполнение создаёт естественную русскую фразу без изменения смысла.
