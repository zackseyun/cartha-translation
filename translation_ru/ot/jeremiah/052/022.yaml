revisions:
- from: На нём была бронзовая капитель, и высота одной капители была пять локтей. Капитель со всех сторон украшали сетчатое плетение[a] и гранаты[b] — всё из бронзы. То же было и на втором столбе, включая гранаты.
  to: На нём была бронзовая капитель, и высота этой капители составляла пять локтей. Капитель со всех сторон украшали сетчатый узор[a] и гранаты[b] — всё из бронзы. На втором столбе были такие же украшения, в том числе гранаты.
  rationale: Исправлена грамматика обозначения высоты. Синтаксис описания украшений и второго столба слегка прояснён для современного литературного русского, при этом сохранены материал, мера, архитектурный термин, повторное упоминание гранатов и эллиптическое сопоставление второго столба с первым.
