  - severity: low
    issue: Не вполне ясная эллиптическая финальная фраза
    rationale: «То же было и на втором столбе, включая гранаты» не называет, что именно было тем же. «На втором столбе были такие же украшения, в том числе гранаты» ясно передаёт эллиптическое сравнение וְכָאֵלֶּה без добавления новых сведений.
