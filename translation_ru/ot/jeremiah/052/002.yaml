source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה יְהוֹיָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/002.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that Jehoiakim had done.
translation:
  language: ru
  text: И он делал зло в глазах Яхве[a], поступая во всём так же, как Иоаким.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в глазах Яхве»; это обычное древнееврейское выражение означает «по оценке Яхве», «пред Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: И он делал
  rationale: Форма wayyiqtol продолжает повествование; союз «и» сохраняет последовательную связь с предыдущим стихом, а несовершенный вид естественно описывает образ действий царя.
- source_word: הָרַע
  choice: зло
  rationale: Сочетание עשה הרע — устойчивое выражение со значением «делать зло»; такой перевод естественен по-русски и не утяжеляет фразу буквальным «делать то, что зло».
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: 'Сохранён прозрачный древнееврейский образ, обозначающий оценку или суждение: «с точки зрения, перед взором».'
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: поступая во всём так же, как
  rationale: Передаёт значение соответствия всему образу действий Иоакима; «поступая» позволяет избежать тяжёлого повтора глагола «делать».
- source_word: יְהוֹיָקִים
  choice: Иоаким
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; форма «Яхве» сохраняет личное имя и наиболее вероятную научную реконструкцию его произношения.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа «в глазах». Формулировка проста и достойна по тону; личное имя передано как «Яхве», имя царя — в традиционной русской форме «Иоаким».
