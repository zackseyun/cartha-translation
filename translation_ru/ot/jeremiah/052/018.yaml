base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/018.yaml
  text: They took away the pots[a], the shovels, the snuffers, the basins, the dishes[c][b], and all the bronze vessels with which they ministered.
translation:
  language: ru
  text: Они унесли котлы, совки, щипцы для светильников[a], чаши, блюда[b] и всю бронзовую утварь, которой пользовались при служении[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ножи для подрезания фитилей»; точный вид этих принадлежностей неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «небольшие чаши»; еврейское слово обозначает сосуды различной формы, в том числе ложкообразные.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «которой совершали служение». Еврейский глагол нередко обозначает храмовое служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּרוֹת
  choice: котлы
  rationale: Слово обозначает котлы или иные сосуды для приготовления; «котлы» естественно и без лишней конкретизации передаёт предмет храмовой утвари.
- source_word: הַיָּעִים
  choice: совки
  rationale: Речь об орудиях для удаления золы или углей; русское «совки» точнее и естественнее в данном перечне, чем более крупные «лопаты».
- source_word: הַמְזַמְּרוֹת
  choice: щипцы для светильников
  rationale: В перечнях храмовой утвари термин, вероятно, обозначает приспособления для ухода за фитилями; перевод сохраняет функциональный смысл, а вариантное понимание отмечено в сноске.
- source_word: הַמִּזְרָקֹת
  choice: чаши
  rationale: Это культовые сосуды, использовавшиеся, в частности, для жертвенной крови или иной жидкости; «чаши» остаётся ясным и не чрезмерно специальным обозначением.
- source_word: הַכַּפּוֹת
  choice: блюда
  rationale: Термин может обозначать небольшие чаши, блюда или ложкообразные сосуды; «блюда» сохраняет требуемую широту значения.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: всю бронзовую утварь
  rationale: В контексте храмового инвентаря נְחֹשֶׁת уместно передать как «бронза», а כְּלֵי — собирательным словом «утварь».
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: которой пользовались при служении
  rationale: Формулировка сохраняет инструментальное значение предлога и культовый оттенок глагола שרת, не называя прямо не выраженный в еврейском тексте субъект.
- source_word: לָקָחוּ
  choice: они унесли
  rationale: В контексте разграбления храма глагол означает не просто взятие, но удаление предметов; «унесли» естественно передаёт это по-русски.
theological_decisions:
- issue: Культовый оттенок אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: которой пользовались при служении
  alternative: которой служили
  rationale: Выбранный вариант ясно показывает, что утварь использовалась как орудие храмового служения, и избегает возможного русского прочтения, будто служение было обращено к самой утвари.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Перечень передан конкретными общеупотребительными названиями; неустранимая неопределённость редких терминов сохранена в сносках.
