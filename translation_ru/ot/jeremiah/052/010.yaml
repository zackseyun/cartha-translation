source:
  edition: WLC
  text: וַ/יִּשְׁחַ֧ט מֶֽלֶךְ בָּבֶ֛ל אֶת בְּנֵ֥י צִדְקִיָּ֖הוּ לְ/עֵינָ֑י/ו וְ/גַ֛ם אֶת כָּל שָׂרֵ֥י יְהוּדָ֖ה שָׁחַ֥ט בְּ/רִבְלָֽתָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/010.yaml
  text: Then the king of Babylon slaughtered the sons of Zedekiah before his eyes[a], and he also slaughtered all the officials of Judah at Riblah.
translation:
  language: ru
  text: И царь Вавилона зарезал сыновей Седекии у него на глазах, а также зарезал всех сановников[a] Иудеи в Ривле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «князей». Еврейское שָׂרֵי может обозначать высокопоставленных правителей, должностных лиц или князей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: И ... зарезал
  rationale: Глагол שׁחט обозначает заклание или жестокое убийство. «Зарезал» передаёт конкретность и жестокость казни лучше, чем нейтральное «убил»; союз «и» сохраняет повествовательную связь וַ־.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Естественная русская передача еврейской сопряжённой конструкции без добавления имени царя, которого в данном стихе нет.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: сыновей Седекии
  rationale: בְּנֵי здесь прямо означает сыновей; более широкое «детей» было бы менее точно.
- source_word: לְעֵינָיו
  choice: у него на глазах
  rationale: Современная и выразительная русская идиома, сохраняющая акцент на том, что Седекия видел казнь собственных сыновей.
- source_word: וְגַם
  choice: а также
  rationale: Передаёт присоединительно-усилительное значение וְגַם и естественно связывает две казни.
- source_word: כָּל שָׂרֵי יְהוּדָה
  choice: всех сановников Иудеи
  rationale: שָׂרֵי обозначает высокопоставленных правителей, должностных лиц или князей. «Сановников» ясно указывает на высших представителей власти и не создаёт обязательной ассоциации с членами царского рода.
- source_word: שָׁחַט
  choice: зарезал
  rationale: Повтор того же русского глагола сохраняет лексический повтор еврейского текста и суровость описания.
- source_word: בְּרִבְלָתָה
  choice: в Ривле
  rationale: Обычная русская локативная конструкция для названия места Ривла.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранены жестокая конкретность и повтор глагола שׁחט. Маркер сноски помещён после слова «сановников», к которому относится лексическая альтернатива; расположение маркера после «глазах» в английском консультационном слое не соответствует содержанию его сноски.
