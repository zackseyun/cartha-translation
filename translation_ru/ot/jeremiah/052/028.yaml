  language: en
  yaml_path: translation/ot/jeremiah/052/028.yaml
  text: 'These are the people whom Nebuchadnezzar carried away captive: in the seventh year[b][a], 3,023 Judeans.'
translation:
  language: ru
  text: 'Вот люди, которых Навуходоносор переселил[a]: в седьмой год — 3 023 иудея[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «увёл в изгнание», «депортировал».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть люди из Иудейского царства; также можно перевести: «жители Иудеи». Традиционно: «евреи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הָעָם
  choice: Вот люди
  rationale: В еврейском тексте буквально стоит единственное число «вот этот народ», однако далее следует численный перечень. Русское «вот люди» естественно вводит такую сводку и сохраняет указательную функцию оборота.
- source_word: אֲשֶׁר
  choice: которых
  rationale: Относительное местоимение относится к людям и естественно передаётся русским «которых».
- source_word: הֶגְלָה
  choice: переселил
  rationale: Порода хифиль глагола גלה обозначает принудительное удаление людей с родины, отправление в изгнание. «Переселил» передаёт действие кратко и без добавления отсутствующего в тексте слова «плен»; альтернативы приведены в сноске.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Устоявшаяся русская библейская форма имени вавилонского царя.
- source_word: בִּשְׁנַת שֶׁבַע
  choice: в седьмой год
  rationale: Количественное числительное в конструктивном сочетании употреблено в порядковом значении; формула сохраняет неуточнённую в самом стихе точку отсчёта царствования.
- source_word: יְהוּדִים
  choice: иудея
  rationale: 'Форма «иудеи» обозначает здесь людей из Иудейского царства. После числа 3 023 по нормам русского языка требуется родительный падеж единственного числа: «иудея».'
- source_word: שְׁלֹשֶׁת אֲלָפִים וְעֶשְׂרִים וּשְׁלֹשָׁה
  choice: 3 023
  rationale: Еврейское число буквально складывается как «три тысячи, двадцать и три». Цифровая запись уместна в статистическом перечне и облегчает чтение.
