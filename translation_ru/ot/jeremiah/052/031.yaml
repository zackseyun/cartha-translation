base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/031.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-fifth day of the month, that Evil-merodach king of Babylon, in the first year of his reign[b], lifted up the head of Jehoiachin king of Judah and brought him out from the prison.
translation:
  language: ru
  text: В тридцать седьмой год изгнания Иехонии, царя Иудеи, в двенадцатом месяце, в двадцать пятый день месяца, Евилмеродах[a], царь Вавилона, в год своего воцарения[b] поднял голову Иехонии[c], царя Иудеи, и вывел его из темницы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евилмеродах известен в исторических источниках также под аккадским именем Амель-Мардук.
    reason: alternative_reading
  - marker: b
    text: 'То есть в первый год его царствования; буквально: «в год его царствования».'
    reason: textual_clarification
  - marker: c
    text: 'Или, передавая смысл выражения: «оказал благосклонность Иехонии»; буквально: «поднял голову Иехонии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: На … году
  rationale: Еврейская повествовательная формула естественно передана через русскую временную конструкцию без архаичного «и было».
- source_word: לְגָלוּת
  choice: изгнания
  rationale: Слово обозначает депортацию и последующее пребывание в изгнании; «изгнание» ясно и исторически уместно.
- source_word: יְהוֹיָכִין
  choice: Иехония
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: в двенадцатый месяц
  rationale: Естественная русская передача еврейской формулы датировки.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה לַחֹדֶשׁ
  choice: в двадцать пятый день месяца
  rationale: Слово «день» добавлено для ясной и естественной русской датировки.
- source_word: אֱוִיל מְרֹדַךְ
  choice: Евилмеродах
  rationale: Сохранена традиционная и узнаваемая русская библейская форма имени; историческая аккадская форма дана в сноске.
- source_word: בִּשְׁנַת מַלְכֻתוֹ
  choice: в год своего воцарения
  rationale: Буквально речь идёт о годе его царствования/вступления на престол; такая передача не вносит отсутствующее в еврейском тексте порядковое числительное, но соответствует контексту начала правления.
- source_word: נָשָׂא אֶת רֹאשׁ
  choice: поднял голову
  rationale: Сохранён выразительный еврейский оборот, означающий возвышение или проявление благосклонности; значение разъяснено в сноске.
- source_word: וַיֹּצֵא אוֹתוֹ
  choice: и вывел его
  rationale: Каузативная форма глагола יצא прямо означает «вывести»; перевод сохраняет действие, не подменяя его более толковательным «освободил».
- source_word: מִבֵּית הַכְּלִיא
  choice: из темницы
  rationale: Естественный литературный эквивалент выражения «из дома заключения», сохраняющий достоинство повествования.
