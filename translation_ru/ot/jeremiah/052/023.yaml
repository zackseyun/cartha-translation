base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/023.yaml
  text: There were ninety-six pomegranates toward the outside[a]; all the pomegranates on the lattice all around were one hundred.
translation:
  language: ru
  text: Гранатовых яблок с наружной стороны[a] было девяносто шесть; всего же гранатовых яблок на решётке по кругу было сто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово здесь неясно; возможны также значения «по направлению наружу», «в одном направлении» или «с наветренной стороны». Вероятно, девяносто шесть украшений были насчитаны с одной стороны, тогда как всего по кругу их было сто.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִמֹּנִים
  choice: гранатовых яблок
  rationale: רִמּוֹנִים буквально означает плоды граната; здесь имеются в виду украшения такой формы. Традиционное и понятное русское «гранатовые яблоки» сохраняет образ исходного текста без пояснительной вставки в основной текст.
- source_word: תִּשְׁעִים וְשִׁשָּׁה
  choice: девяносто шесть
  rationale: Прямая передача количественного числительного.
- source_word: רוּחָה
  choice: с наружной стороны[a]
  rationale: Форма от רוּחַ с направительным окончанием в данном архитектурном контексте неясна. Перевод передаёт вероятную пространственную ориентацию, но не скрывает неоднозначность, отмеченную в сноске.
- source_word: כָּל הָרִמּוֹנִים מֵאָה
  choice: всего же гранатовых яблок ... было сто
  rationale: Оборот с כָּל обозначает общее число. Русское «всего же» ясно противопоставляет итоговый подсчёт упомянутым девяноста шести.
- source_word: הַשְּׂבָכָה
  choice: решётке
  rationale: שְׂבָכָה обозначает сетчатое или решётчатое украшение капители; «решётка» — краткий и естественный современный эквивалент.
- source_word: סָבִיב
  choice: по кругу
  rationale: Наречие указывает на расположение по всей окружности; «по кругу» естественно передаёт пространственный смысл в данном контексте.
