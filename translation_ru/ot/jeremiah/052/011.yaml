  text: וְ/אֶת עֵינֵ֥י צִדְקִיָּ֖הוּ עִוֵּ֑ר וַ/יַּאַסְרֵ֣/הוּ בַֽ/נְחֻשְׁתַּ֗יִם וַ/יְבִאֵ֤/הוּ מֶֽלֶךְ בָּבֶל֙ בָּבֶ֔לָ/ה וַ/יִּתְּנֵ֥/הוּ ב/בית הַ/פְּקֻדֹּ֖ת עַד י֥וֹם מוֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/011.yaml
  text: Then he blinded Zedekiah’s eyes[a], bound him with bronze shackles, and the king of Babylon brought him to Babylon and put him in the house of custody until the day of his death.
translation:
  language: ru
  text: Царь Вавилона ослепил Седекию, заковал его в бронзовые оковы, отвёл в Вавилон и поместил в дом стражи[a] до дня его смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тюрьму». Буквально: «в дом стражи» — то есть в место содержания под надзором.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי צִדְקִיָּהוּ עִוֵּר
  choice: ослепил Седекию
  rationale: Еврейский текст буквально говорит, что он «ослепил глаза Седекии». По-русски «ослепил Седекию» естественно передаёт тот же смысл, не уточняя способ ослепления, которого глагол сам по себе не называет.
- source_word: וַיַּאַסְרֵהוּ בַנְחֻשְׁתַּיִם
  choice: заковал его в бронзовые оковы
  rationale: Глагол אסר означает «связать, сковать», а נְחֻשְׁתַּיִם обозначает бронзовые металлические путы. «Заковал в бронзовые оковы» точно и естественно передаёт сочетание действия и средства.
- source_word: וַיְבִאֵהוּ ... בָּבֶלָה
  choice: отвёл в Вавилон
  rationale: Каузативная форма בוא значит «привести, доставить». В контексте пленника русское «отвёл» естественно описывает принудительное сопровождение, а направительная форма בָּבֶלָה передана сочетанием «в Вавилон».
- source_word: בֵּית הַפְּקֻדֹּת
  choice: дом стражи
  rationale: Редкое выражение обозначает место содержания под надзором или стражей. «Дом стражи» сохраняет образ и неопределённость оригинала; более привычное «тюрьма» дано как допустимый вариант в сноске.
- source_word: עַד יוֹם מוֹתוֹ
  choice: до дня его смерти
  rationale: Формально и ритмически воспроизводит еврейское выражение, сохраняя его торжественную завершённость.
