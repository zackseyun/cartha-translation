  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֗א נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים עָמַ֛ד לִ/פְנֵ֥י מֶֽלֶךְ בָּבֶ֖ל בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/012.yaml
  text: In the fifth month[a], on the tenth day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan the captain of the guard, who stood before the king of Babylon[c][b], came to Jerusalem.
translation:
  language: ru
  text: В пятый месяц, в десятый день месяца — это был девятнадцатый год правления Навуходоносора, царя Вавилона, — в Иерусалим пришёл Навузардан, начальник стражи[a], служивший при царе Вавилона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «начальник палачей» или «начальник исполнителей казней»; вероятно, это титул высокопоставленного царского чиновника, руководившего стражей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «стоявший перед царём Вавилона» — придворное выражение, означающее службу при царе.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: В пятом месяце
  rationale: Начальное ו продолжает повествование, но в современном русском отдельный союз здесь не требуется; временная формула передана прямо и естественно.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: в десятый день месяца
  rationale: Еврейская формула буквально означает «в десятый [день] месяца»; слово «день» выражено по-русски для ясности.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבוּכַדְרֶאצַּר
  choice: это был девятнадцатый год правления Навуходоносора
  rationale: Местоимение הִיא возобновляет датировку, а לַמֶּלֶךְ обозначает исчисление лет царствования. «Год правления» естественно передаёт смысл русскому читателю.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Использована закрепившаяся в русской библейской и литературной традиции форма имени.
- source_word: נְבוּזַרְאֲדָן
  choice: Невузарадан
  rationale: Имя транслитерировано с еврейской формы с учётом естественной русской передачи согласных.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Буквально титул связан с начальником палачей или исполнителей казней, но в придворном контексте обозначает высокопоставленного начальника царской стражи; буквальная окраска сохранена в примечании.
- source_word: עָמַד לִפְנֵי מֶלֶךְ בָּבֶל
  choice: служивший при царе Вавилона
  rationale: Буквальное «стоял перед царём» является придворным выражением, обозначающим службу в присутствии царя. Функциональный смысл дан в тексте, буквальный образ — в примечании.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалим
  rationale: При глаголе движения ב по смыслу обозначает прибытие в город; русское управление требует винительного падежа с предлогом «в».
