  text: В восемнадцатый год Навуходоносора — из Иерусалима 832 человека.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: в восемнадцатый год
  rationale: Сочетание с בְּ задаёт время, а количественное числительное при слове «год» имеет порядковое значение; это естественная русская формула датировки.
- source_word: לִנְבוּכַדְרֶאצַּר
  choice: Навуходоносора
  rationale: Префикс לְ обозначает отнесённость года к царствованию Навуходоносора; по-русски это естественно передаётся родительным падежом.
- source_word: מִירוּשָׁלִַם
  choice: из Иерусалима
  rationale: Предлог מִן указывает исходный пункт; в контексте перечня переселённых речь идёт о людях, уведённых из Иерусалима.
- source_word: נֶפֶשׁ
  choice: человека
  rationale: Здесь נֶפֶשׁ употреблено как счётное обозначение отдельных людей. Русское «человека» ясно и естественно после числа 832.
- source_word: שְׁמֹנֶה מֵאוֹת שְׁלֹשִׁים וּשְׁנָיִם
  choice: '832'
  rationale: Число складывается как 800 + 30 + 2; цифровая запись уместна в статистическом перечне.
