  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר לְ/בֵית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת כָּל נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/017.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze Sea that was in the house of Yahweh[b], and carried all their bronze to Babylon.
translation:
  language: ru
  text: Бронзовые столбы, принадлежавшие храму Яхве, подставки и бронзовое Море, находившееся в храме Яхве, халдеи[a] разбили на части и увезли всю их бронзу в Вавилон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Халдеи — здесь вавилонские войска.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: медные столбы
  rationale: עַמּוּדֵי означает «столбы, колонны», а נְחֹשֶׁת в контексте храмовой утвари обозначает медь или бронзу. Традиционное и понятное русское «медные» сохраняет более широкий смысл материала.
- source_word: אֲשֶׁר לְבֵית יְהוָה
  choice: принадлежавшие храму Яхве
  rationale: Предлог לְ здесь естественно выражает отношение или принадлежность, в отличие от последующего בְּ — «в».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: הַמְּכֹנוֹת
  choice: подставки
  rationale: Слово обозначает храмовые передвижные основания или подставки; «подставки» понятно современному читателю и подходит по контексту.
- source_word: יָם הַנְּחֹשֶׁת
  choice: медное Море
  rationale: Это устойчивое наименование большого храмового резервуара; прописная буква показывает, что «Море» является названием предмета.
- source_word: אֲשֶׁר בְּבֵית יְהוָה
  choice: находившееся в храме Яхве
  rationale: Единственное число непосредственно соотносит относительное предложение с ближайшим существительным יָם — «Море», не исключая общей храмовой принадлежности прочих предметов.
- source_word: שִׁבְּרוּ
  choice: разбили на части
  rationale: Глагол описывает разбор крупных металлических предметов на части для перевозки.
- source_word: כַשְׂדִּים
  choice: халдеи
  rationale: Сохранено конкретное историческое обозначение исходного текста, а не более общее «вавилоняне».
- source_word: וַיִּשְׂאוּ
  choice: увезли
  rationale: В данном контексте נשא означает унести или вывезти захваченное имущество; «увезли» естественно сочетается с направлением в Вавилон.
- source_word: כָּל נְחֻשְׁתָּם
  choice: всю их медь
  rationale: 'Местоименный суффикс отсылает к перечисленным предметам: был вывезен весь металл, из которого они состояли.'
- source_word: בָּבֶלָה
  choice: в Вавилон
  rationale: Направительный суффикс передаёт движение к Вавилону.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога. «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Связь אֲשֶׁר בְּבֵית יְהוָה
  choice: отнести к ближайшему существительному «Море»
  alternative: отнести ко всему перечню храмовых предметов
  rationale: Единственное число и непосредственное положение после יָם поддерживают связь с «Морем», хотя сжатый перечень допускает более широкое понимание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок частей предложения слегка перестроен ради ясности и естественного русского синтаксиса; различие между לְ («принадлежавшие храму») и בְּ («в храме») сохранено.
