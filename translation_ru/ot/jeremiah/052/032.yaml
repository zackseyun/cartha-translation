lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: говорил с ним благосклонно
  rationale: Конструкция דבר с אֵת означает «говорить с кем-либо», а טֹבוֹת — буквально «доброе; добрые слова» — здесь употреблено в значении благоприятной, доброжелательной речи. «Говорил с ним благосклонно» естественно передаёт этот смысл по-русски, не превращая речь в более широкое обращение или отношение.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: поставил его престол
  rationale: В придворном контексте נתן с כִּסֵּא указывает на назначение престолу определённого места и тем самым на установленный царю ранг. Конкретный образ престола сохранён.
- source_word: כִּסְאוֹ
  choice: его престол
  rationale: Хотя כִּסֵּא может означать и обычное сиденье, упоминание царей и их ранга требует царственного значения «престол».
- source_word: מִמַּעַל לְכִסֵּא מלכים
  choice: выше престолов царей
  rationale: Оборот выражает более высокое положение по сравнению с престолами других царей; форма «престолов царей» ясно передаёт подразумеваемую множественность и сохраняет придворный образ.
- source_word: אֲשֶׁר אִתּוֹ בְּבָבֶל
  choice: которые были с ним в Вавилоне
  rationale: Относительное предложение непосредственно определяет царей, находившихся вместе с вавилонским правителем в Вавилоне. Перевод сохраняет местоименную неоднозначность оригинала.
