base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/001.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem[b]. His mother’s name was Hamutal the daughter of Jeremiah of Libnah.
translation:
  language: ru
  text: Седекия был двадцати одного года, когда стал царём[a], и царствовал в Иерусалиме одиннадцать лет. Его мать звали Хамуталь; она была дочерью Иеремии из Ливны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда он начал царствовать».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иеремии, родом из Ливны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: Седекии был двадцать один год
  rationale: Обычная древнееврейская идиома для обозначения возраста передана естественным современным русским выражением.
- source_word: בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Предлог ב с инфинитивом от מלך обозначает время восшествия на царство; выбран ясный и естественный русский эквивалент.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол обозначает осуществление царской власти на протяжении указанного срока.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое местное значение предлога ב при названии города.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Естественная русская форма родословного сообщения, сохраняющая его смысл без буквального и тяжеловесного порядка слов.
- source_word: חמיטל
  choice: Хамуталь
  rationale: Имя транслитерировано с древнееврейского; написание отражает гласную шурук в масоретском тексте.
- source_word: בַּת יִרְמְיָהוּ
  choice: дочерью Иеремии
  rationale: Стандартная передача древнееврейского обозначения родства и традиционная русская форма имени.
- source_word: מִלִּבְנָה
  choice: из Ливны
  rationale: Предлог מן указывает на происхождение или связь Иеремии с этим местом; краткая русская формулировка сохраняет эту допустимую широту.
