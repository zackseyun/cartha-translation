lexical_decisions:
- source_word: וּמִדַּלּוֹת הָאָרֶץ
  choice: А некоторых из беднейших жителей страны
  rationale: 'Предлог מִן перед формой множественного числа выражает часть целого: речь идёт о некоторых из беднейших слоёв населения Иудеи. Союз передан как «а», поскольку фраза противопоставляет оставленных ранее уведённым в плен.'
- source_word: הִשְׁאִיר
  choice: оставил
  rationale: Порода hифиль глагола שׁאר означает «оставить, сохранить оставшимися»; нейтральное «оставил» не приписывает действующему лицу дополнительного мотива.
- source_word: נְבוּזַרְאֲדָן
  choice: Навузардан
  rationale: Использована укоренившаяся в русской библейской традиции форма имени.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Буквально титул связан с «убивающими/палачами», однако в контексте обозначает высокую придворную или военную должность. «Начальник стражи» естественно передаёт функцию титула и не создаёт ложного впечатления о профессии мясника.
- source_word: לְכֹרְמִים
  choice: работать в виноградниках
  rationale: Существительное обозначает людей, возделывающих виноградники, а לְ указывает на назначенную им работу. Описательная формулировка понятнее современному читателю, чем редкое «виноградари».
- source_word: וּלְיֹגְבִים
  choice: и на полях
  rationale: Редкое слово обозначает сельскохозяйственных работников, вероятно пахарей или земледельцев. Указание на работу «на полях» сохраняет сельскохозяйственный смысл, не устраняя лексическую неопределённость; она пояснена в сноске.
