source:
  edition: WLC
  text: וְ/אֶת הַ֠/סִּפִּים וְ/אֶת הַ/מַּחְתּ֨וֹת וְ/אֶת הַ/מִּזְרָק֜וֹת וְ/אֶת הַ/סִּיר֣וֹת וְ/אֶת הַ/מְּנֹר֗וֹת וְ/אֶת הַ/כַּפּוֹת֙ וְ/אֶת הַ/מְּנַקִי֔וֹת אֲשֶׁ֤ר זָהָב֙ זָהָ֔ב וַ/אֲשֶׁר כֶּ֖סֶף כָּ֑סֶף לָקַ֖ח רַב טַבָּחִֽים־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/019.yaml
  text: And the bowls[a], the firepans, the basins, the pots, the lampstands, the cups, and the vessels for pouring—whatever was gold, gold, and whatever was silver[d][c][b], silver—the captain of the guard took.
translation:
  language: ru
  text: И чаши[a], совки для углей[b], тазы, котлы, светильники, ковши и сосуды для возлияний — всё золотое, золотое, и всё серебряное, серебряное[c] — взял начальник стражи[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кубки». Точное различие между несколькими названиями храмовых сосудов в этом перечне неясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кадильницы».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте слова «золотое» и «серебряное» повторены: «всё золотое, золотое, и всё серебряное, серебряное».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «начальник палачей»; возможно также: «начальник телохранителей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים
  choice: чаши
  rationale: Слово обозначает храмовые сосуды типа чаш или кубков; «чаши» естественно для перечня утвари, хотя точное различие между несколькими названиями сосудов неясно.
- source_word: הַמַּחְתּוֹת
  choice: совки для углей
  rationale: Речь идёт о приспособлениях для переноса горячих углей, возможно также служивших при воскурении; функциональный перевод конкретен и не сужает значение до кадильниц.
- source_word: הַמִּזְרָקוֹת
  choice: тазы
  rationale: Это культовые чашеобразные сосуды, вероятно употреблявшиеся при жертвоприношениях; «тазы» сохраняет предметное значение без неподтверждённого уточнения функции.
- source_word: הַסִּירוֹת
  choice: котлы
  rationale: Существительное обозначает котлы или крупные сосуды; «котлы» уместно в храмовом инвентарном перечне.
- source_word: הַמְּנֹרוֹת
  choice: светильники
  rationale: מְנוֹרָה обозначает храмовый светильник, обычно с подставкой и ветвями; русское «светильники» является естественным названием всего предмета.
- source_word: הַכַּפּוֹת
  choice: ковши
  rationale: В храмовых перечнях слово может обозначать небольшие чаши, ковши или ложки; «ковши» отличает эти предметы от упомянутых ранее чаш и передаёт форму небольшого сосуда.
- source_word: הַמְּנַקִיּוֹת
  choice: сосуды для возлияний
  rationale: Редкое слово с не вполне ясным значением; по храмовому контексту вероятны сосуды, связанные с выливанием или возлияниями. Функциональный перевод сохраняет эту вероятность без архаизма.
- source_word: אֲשֶׁר זָהָב זָהָב וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: всё золотое, золотое, и всё серебряное, серебряное
  rationale: Сохранён необычный инвентарный повтор «золото, золото» и «серебро, серебро», передающий формулу и эмфазу еврейского текста.
- source_word: לָקַח
  choice: взял
  rationale: Прямое значение глагола — «взял»; контекст ясно подразумевает захват, поэтому нет необходимости усиливать его до «унёс» или «забрал».
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Устойчивое и понятное обозначение вавилонской военной должности; буквальное «начальник палачей» возможно этимологически, но в данном контексте может вводить в заблуждение.
