lexical_decisions:
- source_word: חֹמוֹת
  choice: стены
  rationale: Множественное число חוֹמָה обозначает оборонительные стены города; слово «Иерусалима» ясно задаёт городской контекст.
- source_word: סָבִיב
  choice: вокруг Иерусалима
  rationale: Наречное употребление передаёт окружающий город периметр; такой порядок слов естественен для современного русского языка.
- source_word: נָתְצוּ
  choice: разрушило
  rationale: Глагол נתץ означает ломать или сносить сооружение. Активная конструкция естественна по-русски и сохраняет названного в еврейском тексте деятеля.
- source_word: חֵיל
  choice: войско
  rationale: В данном контексте חֵיל обозначает военную силу; «войско» точно и стилистически уместно в историческом повествовании.
- source_word: כַּשְׂדִּים
  choice: халдеев
  rationale: Передаёт непосредственно еврейский этноним; контекстуальный вариант «вавилонян» отмечен в сноске.
- source_word: אֲשֶׁר אֶת
  choice: бывшее с
  rationale: Сочетание выражает нахождение войска при названном должностном лице; причастный оборот сохраняет определительную связь и согласуется с собирательным существительным «войско».
- source_word: רַב טַבָּחִים
  choice: начальником стражи
  rationale: Это понятное функциональное обозначение высокого вавилонского чиновника; буквальный смысл титула и возможная связь с царской охраной сохранены в сноске.
