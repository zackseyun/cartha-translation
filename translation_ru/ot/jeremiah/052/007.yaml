base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/007.yaml
  text: Then the city was breached[a], and all the men of war fled and went out of the city by night by way of the gate between the two walls, which was by the king’s garden, while the Chaldeans were all around the city[c][b]; and they went by way of the Arabah.
translation:
  language: ru
  text: Тогда в городской стене была пробита брешь[a], и все воины бежали. Ночью они вышли из города через ворота между двумя стенами, у царского сада. А халдеи[b] окружали город со всех сторон; они пошли дорогой в Араву[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в городской стене была пробита брешь.
    reason: lexical_alternative
  - marker: b
    text: «Халдеи» — еврейское этническое название, часто употребляемое для обозначения вавилонских сил.
    reason: cultural_note
  - marker: c
    text: Арава — область Иорданской рифтовой долины; это название иногда переводят как «равнина».
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: в городе пробили брешь
  rationale: Еврейское выражение буквально представляет город как «проломленный»; в контексте осады речь идет о пробитой обороне, то есть о бреши в городской стене. Русская формулировка естественна и не называет деятеля, которого исходный текст не указывает.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: воины
  rationale: Передает мужчин, участвующих в сражении, современно и без излишне буквального оборота «люди войны».
- source_word: יִבְרְחוּ
  choice: бежали
  rationale: Несмотря на форму имперфекта, в данной повествовательной последовательности глагол обозначает завершенное событие прошлого.
- source_word: וַיֵּצְאוּ מֵהָעִיר לַיְלָה
  choice: Ночью они вышли из города
  rationale: Сохраняет временное обстоятельство и естественный порядок слов современного русского повествования.
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: через ворота между двумя стенами
  rationale: דֶּרֶךְ здесь обозначает путь следования, а двойственное число הַחֹמֹתַיִם прямо указывает на две стены.
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: у царского сада
  rationale: Предлог עַל имеет здесь пространственное значение близости; краткое «у» естественно передает расположение ворот.
- source_word: וְכַשְׂדִּים עַל הָעִיר סָבִיב
  choice: Хотя халдеи окружали город со всех сторон
  rationale: Обстоятельственный оборот подчеркивает, что бегство состоялось при полном окружении. «Халдеи» сохраняет историко-этническое обозначение исходного текста.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: они пошли по дороге к Араве
  rationale: דֶּרֶךְ обозначает маршрут, а הָעֲרָבָה — конкретную географическую область. Формулировка «по дороге к» естественна по-русски, хотя еврейский оборот может обозначать как направление, так и путь через эту область.
