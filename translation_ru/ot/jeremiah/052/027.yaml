base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/027.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[a]. So Judah was taken into exile from its land.
translation:
  language: ru
  text: И царь Вавилона поразил их и предал смерти в Ривле, в земле Хамат. Так Иудея была уведена в изгнание со своей земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: поразил их
  rationale: Глагол נכה в породе хифиль обозначает нанесение насильственного удара или поражение. «Поразил» сохраняет отдельность действия перед последующим «предал смерти», не сливая два еврейских глагола.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Естественная русская передача сопряжённой конструкции с географическим названием.
- source_word: וַיְמִתֵם
  choice: предал смерти
  rationale: Хифиль от מות буквально выражает причинение смерти. «Предал смерти» передаёт каузативный и карательный оттенок, но не добавляет прямо не обозначенной в тексте формальной судебной процедуры.
- source_word: בְּרִבְלָה
  choice: в Ривле
  rationale: Предлог ב перед названием места имеет локативное значение; форма «в Ривле» естественна для русского языка.
- source_word: בְּאֶרֶץ חֲמָת
  choice: в земле Хамат
  rationale: Близкая и ясная передача географического выражения אֶרֶץ חֲמָת без уточняющего добавления «область».
- source_word: וַיִּגֶל
  choice: была уведена в изгнание
  rationale: Глагол גלה здесь описывает насильственное переселение. Русская пассивная конструкция естественно передаёт депортацию Иудеи, хотя еврейская форма грамматически активна.
- source_word: יְהוּדָה
  choice: Иудея
  rationale: В данном контексте название обозначает страну или народ как единое целое. «Иудея» сохраняет метонимическую компактность и согласуется с традиционным русским географическим наименованием.
- source_word: מֵעַל אַדְמָתוֹ
  choice: со своей земли
  rationale: אַדָמָה здесь означает родную землю или территорию. Возвратное «своей» естественно соотносит землю с Иудеей, не заставляя русского читателя воспринимать грамматический мужской суффикс как биологический пол.
theological_decisions:
- issue: Мужской суффикс 3-го лица единственного числа в מֵעַל אַדְמָתוֹ при названии Иуды
  choice: со своей земли
  alternative: с его земли
  rationale: Мужской суффикс согласован с еврейским יְהוּדָה, грамматически мужским названием страны/народа. В русском «Иудея» женского рода, поэтому возвратное «своей» точно сохраняет принадлежность земли Иудее и не создаёт ложной персонализации. Это грамматическое, а не богословское решение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксический параллелизм двух карательных действий сохранён; архаизмы вроде «умертвил» и излишне юридическое «казнил» не использованы.
