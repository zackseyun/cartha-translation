source:
  edition: WLC
  text: וְ/הַֽאֲכַלְתִּ֞י/ם אֶת בְּשַׂ֣ר בְּנֵי/הֶ֗ם וְ/אֵת֙ בְּשַׂ֣ר בְּנֹתֵי/הֶ֔ם וְ/אִ֥ישׁ בְּשַׂר רֵעֵ֖/הוּ יֹאכֵ֑לוּ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֧יקוּ לָ/הֶ֛ם אֹיְבֵי/הֶ֖ם וּ/מְבַקְשֵׁ֥י נַפְשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/009.yaml
  text: And I will make them eat the flesh of their sons and the flesh of their daughters[b][a], and each will eat the flesh of his neighbor in the siege and in the distress with which their enemies and those who seek their life will afflict them.
translation:
  language: ru
  text: Я заставлю их есть плоть своих сыновей и плоть своих дочерей. Каждый будет есть плоть своего ближнего в осаде и в бедствии[a], которыми будут теснить их враги и те, кто стремится лишить их жизни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в осаде и в мучительном стеснении».'
    reason: Лексема מָצוֹק может обозначать бедствие, муку или крайне стеснённое положение.
  - marker: b
    text: 'Буквально: «и те, кто ищет их жизни»; это еврейское выражение означает тех, кто стремится их убить.'
    reason: Пояснение исходной идиомы и буквальной формы выражения.
lexical_decisions:
- source_word: וְהַאֲכַלְתִּים
  choice: Я заставлю их есть
  rationale: Каузативная форма глагола אכל прямо выражает действие Бога как причины суда; «заставлю есть» естественно по-русски и не смягчает смысл до простого позволения.
- source_word: בְּשַׂר
  choice: плоть
  rationale: «Плоть» точно передаёт конкретность и ужас сказанного; «мясо» звучало бы грубее и бытовее, а «тело» было бы менее точно.
- source_word: בְּנֵיהֶם וְאֵת בְּשַׂר בְּנֹתֵיהֶם
  choice: плоть своих сыновей и плоть своих дочерей
  rationale: Сохранены раздельное упоминание сыновей и дочерей и повтор слова «плоть», подчёркивающий параллелизм еврейского текста.
- source_word: וְאִישׁ
  choice: Каждый
  rationale: 'אִישׁ употреблено дистрибутивно: речь идёт о каждом человеке. Русское «каждый» естественно передаёт этот смысл без ненужного гендерного сужения.'
- source_word: רֵעֵהוּ
  choice: своего ближнего
  rationale: «Ближний» точно обозначает другого человека из той же общины и сохраняет библейскую смысловую связь; «друг» необоснованно предполагал бы близкую дружбу.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: во время осады и в бедствии
  rationale: מָצוֹר означает осаду, а מָצוֹק — тяжёлое, стеснённое положение. Формулировка понятна современному читателю и передаёт два взаимосвязанных аспекта происходящего.
- source_word: אֲשֶׁר יָצִיקוּ לָהֶם
  choice: когда их будут теснить
  rationale: Глагол יָצִיקוּ выражает сильное давление и притеснение. Конструкция с «когда» естественно связывает это действие с обстоятельствами осады и бедствия, не создавая громоздкого относительного оборота.
- source_word: אֹיְבֵיהֶם
  choice: враги
  rationale: Прямой и контекстуально точный эквивалент.
- source_word: וּמְבַקְשֵׁי נַפְשָׁם
  choice: те, кто стремится лишить их жизни
  rationale: Еврейская идиома буквально говорит об ищущих чьей-либо жизни и означает людей, намеренных убить. Выбранная формулировка ясно передаёт смысл на современном русском, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Божественная причинность суда
  choice: «Я заставлю их есть»
  alternative: «Я допущу, что они будут есть» или «Я позволю им есть»
  rationale: Каузативная форма от первого лица представляет Бога активно приводящим в исполнение объявленный суд. Перевод не ослабляет эту напряжённую формулировку до одного лишь попущения.
- issue: Значение נֶפֶשׁ в выражении וּמְבַקְשֵׁי נַפְשָׁם
  choice: «те, кто стремится лишить их жизни»
  alternative: «те, кто ищет их душ» или буквально «ищущие их жизни»
  rationale: В этой идиоме נֶפֶשׁ обозначает жизнь человека, которой угрожают, а не отдельно мыслимую нематериальную душу. Такой перевод избегает внесения в текст чуждой ему антропологической конкретизации.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя, при этом сохранены прямота божественного действия, повтор «плоть» и предельная тяжесть образа. Архаичные «в тесноте» и неестественное «ищущие их жизни» вынесены из основного текста или разъяснены в сносках.
