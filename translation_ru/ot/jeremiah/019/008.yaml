base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/008.yaml
  text: And I will make this city a horror and an object of hissing[b][a]; everyone who passes by it will be appalled and will hiss because of all its wounds.
translation:
  language: ru
  text: Я превращу этот город в ужасающее зрелище и предмет насмешливого свиста[a]. Всякий, кто будет проходить мимо него, ужаснётся и засвистит[b] из-за всех постигших его ударов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в запустение и предмет свиста». Еврейские слова указывают и на разорённое состояние города, и на вызываемую им реакцию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет поражён и засвистит (или зашипит)». Еврейский глагол может обозначать свист или шипение — реакцию потрясения либо насмешки при виде постигшего город суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Я превращу
  rationale: В сочетании с לְ и существительными результата глагол שׂים означает приведение города в указанное состояние; «превращу» естественно передаёт это по-русски.
- source_word: הָעִיר הַזֹּאת
  choice: этот город
  rationale: Прямо сохраняет указательное значение еврейской конструкции.
- source_word: לְשַׁמָּה
  choice: в место запустения
  rationale: שַׁמָּה обозначает опустошённое состояние, вызывающее ужас; «место запустения» ясно передаёт состояние города, а оттенок ужаса выражен далее глаголом «ужаснётся».
- source_word: וְלִשְׁרֵקָה
  choice: и предмет насмешливого свиста
  rationale: Существительное от שרק указывает на свист при виде постигшего судом разорения; добавление «насмешливого» поясняет обычную для пророческой речи окраску образа, не устраняя возможности свиста от потрясения.
- source_word: כֹּל עֹבֵר עָלֶיהָ
  choice: Всякий, кто будет проходить мимо него
  rationale: Причастная конструкция имеет обобщающее значение; перевод сохраняет универсальность כֹּל и естественно звучит на современном русском.
- source_word: יִשֹּׁם
  choice: ужаснётся
  rationale: В данном контексте форма от שׁמם передаёт потрясение и ужас человека перед опустошением.
- source_word: וְיִשְׁרֹק
  choice: и присвистнет
  rationale: שרק может означать свист или шипение. Русское «присвистнет» естественно обозначает видимую реакцию потрясения, удивления или насмешки и сохраняет образ.
- source_word: עַל כָּל מַכֹּתֶיהָ
  choice: при виде всех нанесённых ему ударов
  rationale: מַכָּה может означать удар, поражение, рану или бедствие. «Нанесённые ему удары» сохраняет образ города как поражённого судом и не сужает смысл до болезни.
