  variant: modern literary Russian
source:
  edition: WLC
  text: כֵּֽן אֶעֱשֶׂ֞ה לַ/מָּק֥וֹם הַ/זֶּ֛ה נְאֻם יְהוָ֖ה וּ/לְ/יֽוֹשְׁבָ֑י/ו וְ/לָ/תֵ֛ת אֶת הָ/עִ֥יר הַ/זֹּ֖את כְּ/תֹֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/012.yaml
  text: So I will do to this place[a], declares Yahweh, and to its inhabitants, making this city like Topheth.
translation:
  language: ru
  text: 'Так Я поступлю с этим местом, — возвещает Яхве, — и с его жителями: сделаю этот город подобным Тофету[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тофет — место в долине Бен-Хинном, связанное с принесением детей в жертву, а позднее — с осквернением и судом. Сравнение означает, что Иерусалим станет местом ужаса и ритуальной нечистоты.
    reason: Культурно-историческое пояснение образа Тофета.
lexical_decisions:
- source_word: כֵּן
  choice: Так
  rationale: 'Передаёт указание на соответствие предшествующему знамению и объявленному суду: «таким образом».'
- source_word: אֶעֱשֶׂה לַמָּקוֹם הַזֶּה
  choice: Я поступлю с этим местом
  rationale: Глагол עשה имеет широкое значение «делать, поступать», а ל обозначает затрагиваемый объект. Русское «поступить с» естественно выражает эту связь, не добавляя отдельного предлога «против».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественный характер устойчивой пророческой формулы и передаёт личное имя יהוה как «Яхве».
- source_word: וּלְיוֹשְׁבָיו
  choice: и с его жителями
  rationale: Местоименный суффикс отнесён к «этому месту»; параллельная конструкция с «поступлю» естественна по-русски.
- source_word: וְלָתֵת אֶת הָעִיר הַזֹּאת
  choice: сделаю этот город
  rationale: Инфинитив נתן буквально означает «дать, сделать» и здесь уточняет действие и его итог. Двоеточие ясно передаёт эту связь без чрезмерно жёсткого выбора между целью и результатом.
- source_word: כְּתֹפֶת
  choice: подобным Тофету
  rationale: Префикс כ выражает сравнение; творительная конструкция с «подобным» звучит естественно и сохраняет образ исходного текста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Смысл связи וְלָתֵת с предшествующим обещанием суда
  choice: 'уточнение действия через двоеточие: «сделаю»'
  alternative: 'цель или результат: «чтобы сделать» / «так что сделаю»'
  rationale: Инфинитив допускает оттенок цели или результата; нейтральное пояснение после двоеточия сохраняет смысловую связь, не устраняя эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Прямая и строгая формулировка сохраняет угрозу суда; вставная формула «возвещает Яхве» выделена тире.
