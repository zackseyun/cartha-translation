base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/001.yaml
  text: 'Thus says Yahweh: Go and buy a potter’s earthenware flask[a], and take some of the elders of the people and some of the elders of the priests[b],'
translation:
  language: ru
  text: 'Так говорит Яхве: «Пойди, купи глиняный кувшин работы горшечника[a] и возьми с собой нескольких старейшин народа и нескольких старейшин из числа священников[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глиняный сосуд» или «глиняную бутыль». Еврейское слово обозначает формованный сосуд, вероятно с узким горлом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из старейшин народа и из старейшин священников», то есть представителей обеих групп.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Естественная для современного русского языка пророческая формула; настоящее время передаёт непосредственность возвещаемого слова, а личное имя сохраняет יהוה как имя, а не заменяет его титулом.
- source_word: הָלוֹךְ וְקָנִיתָ
  choice: Пойди, купи
  rationale: Инфинитив абсолютный имеет повелительную силу, а следующая перфектная форма продолжает последовательность повелений; по-русски это ясно выражается двумя императивами.
- source_word: בַקְבֻּק
  choice: кувшин
  rationale: Слово обозначает формованный сосуд, вероятно с узким горлом. «Кувшин» понятно современному читателю и естественно сочетается с последующим разбиванием сосуда, хотя точная форма остаётся не вполне определённой.
- source_word: יוֹצֵר חָרֶשׂ
  choice: глиняный … сделанный горшечником
  rationale: Переданы и материал сосуда, и его изготовитель; развёрнутая конструкция яснее и естественнее буквального «кувшин горшечника из черепка».
- source_word: וּמִזִּקְנֵי הָעָם וּמִזִּקְנֵי הַכֹּהֲנִים
  choice: и возьми с собой нескольких старейшин народа и нескольких старейшин священников
  rationale: 'Предлог מן имеет партитивное значение: Иеремия должен взять представителей из обеих групп. Глагол «возьми» восстанавливается по смыслу, а «с собой» естественно передаёт совместное следование.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога и не подменяет его титулом; форма «Яхве» наиболее распространена в современной научной и литературной русской передаче.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным, при этом сохранены последовательность повелений, партитивный смысл מן и неопределённость относительно точной формы сосуда.
