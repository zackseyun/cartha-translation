base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/014.yaml
  text: Then Jeremiah came from Topheth[a], where Yahweh had sent him to prophesy, and he stood in the court of the house of Yahweh and said to all the people,
translation:
  language: ru
  text: 'Иеремия пришёл из Тофета[a], куда Яхве послал его пророчествовать, встал во дворе дома Яхве и сказал всему народу:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тофет — место, связанное с совершённым Иеремией ранее в этой главе пророческим знамением и возвещённым там пророчеством.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: вернулся
  rationale: Глагол בוא допускает значения «пришёл» и «вернулся» в зависимости от точки отсчёта. Контекст описывает возвращение Иеремии из Тофета к храму, поэтому «вернулся» естественно передаёт движение и связь с предшествующим эпизодом.
- source_word: מֵהַתֹּפֶת
  choice: из Тофета
  rationale: Тофет — географическое название; в русском тексте оно передано традиционной транслитерацией и поставлено в родительный падеж после предлога «из».
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה שָׁם
  choice: куда Яхве посылал его
  rationale: Сочетание относительного местоимения с שָׁם указывает на место, в которое был послан Иеремия. Русское «куда» передаёт это идиоматично; прошедшее время обозначает действие, предшествующее возвращению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: לְהִנָּבֵא
  choice: пророчествовать
  rationale: Нифальский инфинитив от נבא означает выступать или говорить как пророк; «пророчествовать» точно и кратко передаёт это значение.
- source_word: וַיַּעֲמֹד
  choice: Он встал
  rationale: עמד здесь прямо обозначает, что Иеремия встал или занял положение во дворе; нейтральное «встал» не добавляет отсутствующего в оригинале акцента.
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: во дворе дома Яхве
  rationale: חצר означает двор или внутренний двор. Конструкция «двор дома Яхве» сохраняет еврейскую цепочку сопряжённых существительных и остаётся понятной как обозначение храмового двора.
- source_word: וַיֹּאמֶר אֶל כָּל הָעָם
  choice: и сказал всему народу
  rationale: אמר обычно означает «сказать», а כָּל הָעָם — «весь народ»; перевод не сужает круг слушателей.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Передача «Яхве» сохраняет личное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским регистром. Длинная еврейская повествовательная цепочка разделена на два предложения для естественности; двоеточие в конце показывает, что речь Иеремии следует в следующем стихе.
