  text: וְ/הָי֞וּ בָּתֵּ֣י יְרוּשָׁלִַ֗ם וּ/בָתֵּי֙ מַלְכֵ֣י יְהוּדָ֔ה כִּ/מְק֥וֹם הַ/תֹּ֖פֶת הַ/טְּמֵאִ֑ים לְ/כֹ֣ל הַ/בָּתִּ֗ים אֲשֶׁ֨ר קִטְּר֜וּ עַל גַּגֹּֽתֵי/הֶם֙ לְ/כֹל֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/הַסֵּ֥ךְ נְסָכִ֖ים לֵ/אלֹהִ֥ים אֲחֵרִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/013.yaml
  text: The houses of Jerusalem and the houses of the kings of Judah will become like the unclean place of Topheth—all the houses on whose rooftops they burned incense to all the host of heaven and poured out drink offerings to other gods[a][b].
translation:
  language: ru
  text: И дома Иерусалима, и дома царей Иудеи станут нечистыми[a], подобно месту Тофет, — все дома, на крышах которых возжигали благовония всему воинству небесному[b] и возливали возлияния иным богам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осквернёнными».'
    reason: lexical_alternative
  - marker: b
    text: «Воинство небесное» здесь означает небесные светила, которым поклонялись как божествам.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיוּ
  choice: станут
  rationale: В сочетании со сравнением כִּמְקוֹם глагол обозначает наступление нового состояния вследствие суда, поэтому «станут» точнее простого «будут».
- source_word: בָּתֵּי יְרוּשָׁלִַם וּבָתֵּי מַלְכֵי יְהוּדָה
  choice: дома Иерусалима, и дома царей Иудеи
  rationale: Сохранены обе параллельные конструкции с обычным словом «дома»; более узкое «дворцы» не вводится в основной текст.
- source_word: כִּמְקוֹם הַתֹּפֶת
  choice: подобно месту Тофет
  rationale: Явно передано מָקוֹם, а название места транслитерировано в принятой русской библейской форме «Тофет».
- source_word: הַטְּמֵאִים
  choice: нечистыми
  rationale: Форма множественного числа согласуется с «домами» и обозначает их культовую и нравственную осквернённость; русский творительный падеж требуется после «станут».
- source_word: לְכֹל הַבָּתִּים אֲשֶׁר
  choice: все дома, ... которых
  rationale: 'Оборот понят как уточнение объёма предшествующего высказывания: речь идёт обо всех домах, где совершалось описанное поклонение.'
- source_word: קִטְּרוּ עַל גַּגֹּתֵיהֶם
  choice: на крышах которых возжигали благовония
  rationale: Передан культовый смысл Piel קטר и буквально сохранено указание на крыши как место поклонения.
- source_word: לְכֹל צְבָא הַשָּׁמַיִם
  choice: всему воинству небесному
  rationale: Сохранён традиционный библейский образ небесного воинства, а примечание поясняет его значение в данном контексте.
- source_word: וְהַסֵּךְ נְסָכִים
  choice: и возливали возлияния
  rationale: Передана культовая формула совершения жидких приношений; повтор корня в русском сохраняет торжественный библейский регистр и остаётся понятным.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: иным богам
  rationale: Прямой и естественный перевод устойчивого пророческого обозначения чужих богов.
theological_decisions:
- issue: Синтаксическая связь הַטְּמֵאִים
  choice: «нечистыми» отнесено к домам
  alternative: «подобно нечистому месту Тофет»
  rationale: Еврейское הַטְּמֵאִים имеет форму мужского рода множественного числа и потому естественно относится к בָּתֵּי («дома»), а не к единственному числу מְקוֹם («место»). Такая передача сохраняет грамматическое напряжение текста и не исправляет его по английскому консультационному слою.
- issue: Значение нечистоты в образе суда
  choice: нечистыми
  alternative: осквернёнными
  rationale: «Нечистыми» сохраняет категорию ритуальной и нравственной нечистоты, не сводя её только к физическому загрязнению.
- issue: Дома царей Иудеи
  choice: сохранено буквальное «дома»
  alternative: «дворцы царей Иудеи»
  rationale: Хотя, вероятно, имеются в виду царские резиденции, исходный текст употребляет обычное слово «дома»; буквальная форма также поддерживает параллелизм стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Сохранены повтор «дома» и культовые термины «возжигали благовония» и «возливали возлияния». Тире вводит поясняющее уточнение без устранения синтаксической неоднозначности еврейского текста.
