  text: וְ/אָֽמַרְתָּ֙ שִׁמְע֣וּ דְבַר יְהוָ֔ה מַלְכֵ֣י יְהוּדָ֔ה וְ/יֹשְׁבֵ֖י יְרֽוּשָׁלִָ֑ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ עַל הַ/מָּק֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר כָּל שֹׁמְעָ֖/הּ תִּצַּ֥לְנָה אָזְנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/003.yaml
  text: 'And say, ‘Hear the word of the LORD, O kings of Judah and inhabitants of Jerusalem. Thus says the LORD of hosts, the God of Israel: Behold, I am bringing disaster on this place, at which everyone who hears of it—his ears will tingle.’'
translation:
  language: ru
  text: 'И скажи: «Слушайте слово ГОСПОДА, цари Иудеи и жители Иерусалима! Так говорит ГОСПОДЬ Воинств, Бог Израиля: вот, Я наведу на это место такое бедствие, что у всякого, кто услышит о нём, зазвенит в ушах».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона, различимая прописными буквами и соответствующая принятому в консультационном тексте решению.
- source_word: יְהוָה צְבָאוֹת
  choice: ГОСПОДЬ Воинств
  rationale: Сохраняет образ небесных и земных воинств и не сужает многозначное צְבָאוֹת до одного толкования.
- source_word: רָעָה
  choice: бедствие
  rationale: В контексте Божьего суда обозначает насылаемое несчастье или катастрофу, а не нравственное зло.
- source_word: תִּצַּלְנָה אָזְנָיו
  choice: зазвенит в ушах
  rationale: Естественный русский фразеологический эквивалент еврейского выражения о потрясающей, страшной вести; единственное число согласовано с собирательным «у всякого».
theological_decisions:
- issue: Характер объявленного бедствия
  choice: «Я наведу»
  alternative: «Я допущу»
  rationale: Причастная конструкция מֵבִיא прямо представляет ГОСПОДА действующим субъектом; перевод не ослабляет утверждение текста о Божьем суде.
- issue: Передача титула צְבָאוֹת
  choice: «Воинств»
  alternative: «Сил» или «Саваоф»
  rationale: «Воинств» сохраняет исходный образ и понятнее современному читателю, не вводя конфессионально закреплённую транслитерацию.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Сохранены прямое обращение к царям и жителям, формула вестника и усилительное «вот». Архаизмы сведены к минимуму; «ГОСПОДЬ Воинств» оставлено как содержательно точный библейский титул.
