  text: וְ/יָצָ֨אתָ֙ אֶל גֵּ֣יא בֶן הִנֹּ֔ם אֲשֶׁ֕ר פֶּ֖תַח שַׁ֣עַר ה/חרסות וְ/קָרָ֣אתָ שָּׁ֔ם אֶת הַ/דְּבָרִ֖ים אֲשֶׁר אֲדַבֵּ֥ר אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/002.yaml
  text: and go out to the Valley of Ben Hinnom[a], which is at the entrance of the Potsherd Gate, and proclaim there the words that I will speak to you.
translation:
  language: ru
  text: И выйди в долину Бен-Хиннома[a], которая находится у входа в Ворота Черепков[b], и провозгласи там слова, которые Я скажу тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «долину сына Хиннома». Это исторический топоним; позднейшее слово «геенна» связано с этим названием, но здесь речь идёт о конкретной долине.'
    reason: Сохраняет буквальную основу топонима и предотвращает смешение с позднейшим употреблением слова «геенна».
  - marker: b
    text: Название ворот в еврейском тексте не вполне ясно; возможны переводы «Ворота Черепков» и «Ворота глиняных изделий», а при передаче названия транслитерацией — «ворота Харсит».
    reason: Сохраняет текстовую и лексическую неопределённость названия ворот.
lexical_decisions:
- source_word: וְיָצָאתָ
  choice: и выйди
  rationale: Форма в последовательности повелений передана русским императивом; приставочный глагол «выйди» сохраняет направительное значение יצא.
- source_word: גֵּיא בֶן הִנֹּם
  choice: долину Бен-Хинном
  rationale: Топоним сохранён с транслитерацией личного элемента; вариант «геенна» внёс бы более поздние ассоциации, не выраженные здесь непосредственно.
- source_word: אֲשֶׁר פֶּתַח שַׁעַר ה/חרסות
  choice: что у входа в Черепичные ворота
  rationale: פֶּתַח שַׁעַר естественно обозначает место у входа в ворота. Название הַחַרְסוּת, вероятно, связано с черепками или гончарными изделиями, хотя еврейское чтение и точный смысл не вполне ясны.
- source_word: וְקָרָאתָ שָּׁם
  choice: и провозгласи там
  rationale: В пророческом контексте קרא означает публично возгласить или провозгласить; «провозгласи» передаёт эту силу естественным литературным русским языком.
- source_word: אֶת הַדְּבָרִים
  choice: слова
  rationale: Буквальное «слова» сохраняет связь с последующим Божьим речением и не сводит множественное число к обобщённому «весть».
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: которые Я скажу тебе
  rationale: По-русски «скажу тебе» естественнее буквального «буду говорить тебе», сохраняя будущее время и содержание прямого Божьего поручения.
theological_decisions:
- issue: Передача топонима גֵּיא בֶן הִנֹּם
  choice: долина Бен-Хинном
  alternative: долина сына Хиннома; геенна
  rationale: Транслитерация сохраняет исторический топоним и не привносит богословские ассоциации позднейшего термина «геенна».
translation_notes:
  register: Современный литературный русский язык с ясной повелительной конструкцией и достоинством пророческой речи. Топоним передан без архаизации; не вполне ясное название ворот переведено по вероятной связи с черепками, а неопределённость отмечена в сноске.
