  text: וּ/בָנ֞וּ אֶת בָּמ֣וֹת הַ/בַּ֗עַל לִ/שְׂרֹ֧ף אֶת בְּנֵי/הֶ֛ם בָּ/אֵ֖שׁ עֹל֣וֹת לַ/בָּ֑עַל אֲשֶׁ֤ר לֹֽא צִוִּ֨יתִי֙ וְ/לֹ֣א דִבַּ֔רְתִּי וְ/לֹ֥א עָלְתָ֖ה עַל לִבִּֽ/י־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/005.yaml
  text: They have built the high places of Baal to burn their sons in the fire as burnt offerings to Baal—something I did not command or speak[a], nor did it arise in my heart.
translation:
  language: ru
  text: Они построили высоты Ваала, чтобы сжигать своих сыновей в огне как всесожжения Ваалу — чего Я не повелевал, о чём не говорил и что не приходило Мне на сердце[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не поднималось на Моё сердце»; возможный смысл: «и Мне это не приходило в мысль».'
    reason: Уточнение буквальной формы и смысловой альтернативы еврейской идиомы.
lexical_decisions:
- source_word: וּבָנוּ
  choice: Они построили
  rationale: Форма qal perfect 3-го лица множественного числа обозначает совершённое действие; в русском контексте пророческого обвинения естественно простое прошедшее время.
- source_word: בָּמוֹת
  choice: высоты
  rationale: Традиционный и достаточно точный термин для культовых мест; он сохраняет связь с возвышенностями и не сводит значение лишь к строениям-святилищам.
- source_word: הַבַּעַל / לַבָּעַל
  choice: Ваала / Ваалу
  rationale: В данном контексте это имя ханаанского божества; по-русски артикль отдельно не передаётся.
- source_word: לִשְׂרֹף
  choice: чтобы сжигать
  rationale: Инфинитив выражает цель сооружения культовых высот.
- source_word: בְּנֵיהֶם
  choice: своих сыновей
  rationale: Передано конкретное значение «сыновья»; возвратное «своих» естественно указывает на принадлежность подлежащему.
- source_word: בָּאֵשׁ
  choice: в огне
  rationale: Сохраняется обычное для русского языка локативно-инструментальное выражение.
- source_word: עֹלוֹת
  choice: как всесожжения
  rationale: Это технический жертвенный термин; конструкция показывает, что сыновей сжигали в качестве всесожжений.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: чего Я не повелевал
  rationale: Относительное местоимение относится ко всей описанной практике; «повелевал» точно передаёт идею отсутствия Божьего предписания.
- source_word: וְלֹא דִבַּרְתִּי
  choice: о чём не говорил
  rationale: 'Добавление русского предложного управления делает смысл естественным: Бог не высказывал ничего об установлении такой практики.'
- source_word: וְלֹא עָלְתָה עַל לִבִּי
  choice: и что не приходило Мне на сердце
  rationale: Формулировка близко сохраняет еврейскую идиому «не поднималось на Моё сердце» и её антропоморфную, не только когнитивную образность.
theological_decisions:
- issue: Антропоморфное описание внутреннего отношения Бога
  choice: что не приходило Мне на сердце
  alternative: что не приходило Мне в голову / чего Я и не помышлял
  rationale: Слово לֵב означает «сердце». Основной текст сохраняет исходный образ и богословское напряжение, не сводя высказывание исключительно к утверждению о знании или мышлении Бога.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Сохранены технические термины «высоты» и «всесожжения», конкретное «сыновей» и образ сердца; синтаксис слегка сглажен для ясности.
