- from: И расстрою замысел Иудеи и Иерусалима на этом месте[a], и поражу их мечом перед лицом их врагов, рукой тех, кто ищет их смерти[b], и отдам их трупы на съедение птицам небесным[c] и земным зверям.
  to: И расстрою замысел Иудеи и Иерусалима в этом месте[a], и обреку их на гибель от меча перед лицом их врагов и от руки тех, кто посягает на их жизнь[b], и отдам их трупы на съедение птицам небесным[c] и земным зверям.
  rationale: Исправлена только форма, необходимая для ясного и естественного воспроизведения двух параллельных еврейских оборотов. «Обреку их на гибель» передаёт каузативный характер וְהִפַּלְתִּים в контексте меча, не добавляя нового богословского или исторического содержания. Сноска b теперь соответствует буквальному значению נפש как «жизнь», а основной текст даёт современный смысл идиомы.
