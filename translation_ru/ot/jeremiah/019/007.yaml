    issue: Неясная передача «мечом ... рукой тех».
    rationale: Еврейское בַּחֶרֶב ... וּבְיַד вводит два координированных обстоятельства. В русском черновике второй оборот без «от руки» или иной связки воспринимается негладко.
  - severity: low
    issue: «На этом месте» менее точно в данном контексте.
    rationale: בַּמָּקוֹם הַזֶּה означает «в этом месте»; вариант «на этом месте» возможен лишь при более выраженном указании на площадку или поверхность.
