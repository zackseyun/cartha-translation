source:
  edition: WLC
  text: וּ֠/בַקֹּתִי אֶת עֲצַ֨ת יְהוּדָ֤ה וִ/ירוּשָׁלִַ֨ם֙ בַּ/מָּק֣וֹם הַ/זֶּ֔ה וְ/הִפַּלְתִּ֤י/ם בַּ/חֶ֨רֶב֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/נָתַתִּ֤י אֶת נִבְלָתָ/ם֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/007.yaml
  text: And I will frustrate the plan of Judah and Jerusalem in this place[a], and I will make them fall by the sword before their enemies and by the hand of those who seek their life[c][b], and I will give their corpses as food to the birds of the heavens and to the beasts of the earth.
translation:
  language: ru
  text: И расстрою замысел Иудеи и Иерусалима в этом месте[a], и обреку их на гибель от меча перед лицом их врагов и от руки тех, кто посягает на их жизнь[b], и отдам их трупы на съедение птицам небесным[c] и земным зверям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совет Иудеи и Иерусалима».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тех, кто ищет их жизни»; то есть стремится лишить их жизни.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «птицам поднебесным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַקֹּתִי
  choice: расстрою
  rationale: Каузативное употребление בקק означает сделать замысел пустым, безрезультатным; «расстрою» естественно передаёт срыв намерения.
- source_word: עֲצַת
  choice: замысел
  rationale: עֵצָה допускает значения «совет», «план», «замысел». В контексте действия, которое Бог обращает в ничто, «замысел» звучит ясно и сохраняет смысловую широту.
- source_word: יְהוּדָה וִירוּשָׁלַם
  choice: Иудеи и Иерусалима
  rationale: Традиционные русские формы названий сохраняют сочетание царства и столицы.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: на этом месте
  rationale: Прямое и естественное обозначение конкретного места, на которое указывает пророческое действие.
- source_word: וְהִפַּלְתִּים בַּחֶרֶב
  choice: поражу их мечом
  rationale: Буквально каузативная форма означает «заставлю их пасть от меча». Русское «поражу их мечом» естественно передаёт гибель и явную причинную роль говорящего без смягчения.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: перед лицом их врагов
  rationale: Сохраняет пространственно-реляционное значение לִפְנֵי и уместный библейский регистр.
- source_word: וּבְיַד מְבַקְשֵׁי נַפְשָׁם
  choice: рукой тех, кто ищет их смерти
  rationale: «Рукой» передаёт инструментальную роль исполнителей. Идиома «искать чью-либо душу/жизнь» здесь означает стремиться убить; «ищет их смерти» понятно современному читателю и не создаёт ложной двусмысленности.
- source_word: נִבְלָתָם
  choice: их трупы
  rationale: נְבֵלָה обозначает мёртвое тело, оставленное без погребения; «трупы» точно и прямо передаёт унизительный итог суда.
- source_word: לְמַאֲכָל
  choice: на съедение
  rationale: Устойчивое русское выражение естественно передаёт предназначение тел в пищу.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: птицам небесным
  rationale: Передаёт обычный древнееврейский меризм среды обитания и сохраняет возвышенный, но понятный регистр.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: и земным зверям
  rationale: בְּהֵמָה здесь охватывает наземных животных, питающихся останками; «земные звери» естественно противопоставлены небесным птицам.
theological_decisions:
- issue: Прямая божественная действенность суда
  choice: 'Сохранена последовательность действий от первого лица: «расстрою… поражу… отдам».'
  alternative: Смягчить причинность формулами «допущу, чтобы они пали» или «позволю отдать».
  rationale: Древнееврейские глаголы прямо приписывают говорящему осуществление суда; перевод не должен ослаблять это утверждение.
- issue: Значение идиомы מְבַקְשֵׁי נַפְשָׁם
  choice: «те, кто ищет их смерти»
  alternative: 'Формально: «те, кто ищет их жизни/души».'
  rationale: В данном контексте идиома однозначно обозначает стремление лишить жизни. Выбранная формулировка передаёт намерение убийц, не вводя чуждого смысла о поиске или спасении души.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской ритмикой. Параллельная цепь глаголов первого лица сохранена. Формулировки прямы и понятны, без конфессиональных добавлений.
