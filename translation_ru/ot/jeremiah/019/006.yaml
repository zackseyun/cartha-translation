  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יִקָּרֵא֩ לַ/מָּק֨וֹם הַ/זֶּ֥ה ע֛וֹד הַ/תֹּ֖פֶת וְ/גֵ֣יא בֶן הִנֹּ֑ם כִּ֖י אִם גֵּ֥יא הַ/הֲרֵגָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/006.yaml
  text: Therefore, look, days are coming, declares the LORD, when this place will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter.
translation:
  language: ru
  text: Поэтому вот, наступают дни, — возвещает ГОСПОДЬ, — когда это место уже не будет называться Тофетом и долиной Бен-Хинном, а будет называться долиной Резни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим пророчеством.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательно-эмфатическую частицу пророческого объявления; по-русски естественно в сочетании «вот, наступают дни».
- source_word: יָמִים בָּאִים
  choice: наступают дни
  rationale: Естественный современный русский эквивалент устойчивой древнееврейской формулы о грядущем времени.
- source_word: נְאֻם יְהוָה
  choice: возвещает ГОСПОДЬ
  rationale: «Возвещает» передаёт формулу авторитетного божественного изречения; написание «ГОСПОДЬ» следует принятой русской традиции передачи тетраграмматона.
- source_word: יִקָּרֵא
  choice: не будут называть… а назовут
  rationale: Безлично-множественная русская конструкция естественно передаёт пассивное значение «будет называться», а повтор глагола делает противопоставление ясным.
- source_word: הַתֹּפֶת
  choice: Тофетом
  rationale: Транслитерация географического названия; творительный падеж обусловлен глаголом «называть».
- source_word: גֵיא בֶן הִנֹּם
  choice: долиной Бен-Хинном
  rationale: Сохраняет форму имени, близкую к древнееврейскому выражению, не подменяя её истолкованием.
- source_word: גֵּיא הַהֲרֵגָה
  choice: долиной Резни
  rationale: «Резня» передаёт массовое насильственное умерщвление, выраженное существительным הֲרֵגָה, и сохраняет зловещий характер нового названия.
theological_decisions:
- issue: Передача имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Традиционная русская передача тетраграмматона малыми прописными буквами узнаваема широким кругом читателей и не вносит конфессионального толкования.
- issue: Связь двух прежних названий
  choice: «Тофетом и долиной Бен-Хинном»
  alternative: «Тофетом или долиной Бен-Хинном»
  rationale: Союз וְ буквально соединяет два наименования; «и» сохраняет формальную структуру и допускает понимание их как двух обозначений данного места.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Имена собственные переданы последовательно; архаизм «се» не используется. Заглавная буква в «Резни» отмечает новое географическое название.
