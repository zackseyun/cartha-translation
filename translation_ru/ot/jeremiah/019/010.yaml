  text: וְ/שָׁבַרְתָּ֖ הַ/בַּקְבֻּ֑ק לְ/עֵינֵי֙ הָֽ/אֲנָשִׁ֔ים הַ/הֹלְכִ֖ים אוֹתָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/010.yaml
  text: Then you shall break the flask before the eyes of the men who are going with you[a].
translation:
  language: ru
  text: Затем разбей кувшин на глазах у людей, которые идут с тобой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии людей, сопровождающих тебя».'
    reason: 'Лексико-стилистический вариант: לְעֵינֵי буквально связано со зрением, а הַהֹלְכִים אוֹתָךְ может естественно передаваться как «сопровождающих тебя».'
lexical_decisions:
- source_word: וְשָׁבַרְתָּ
  choice: Затем разбей
  rationale: Перфект qal, 2-е лицо мужского рода единственного числа, с союзом וְ в последовательности пророческих указаний передаёт следующий повелительный шаг. «Затем разбей» естественно выражает и последовательность, и директивную силу.
- source_word: הַבַּקְבֻּק
  choice: кувшин
  rationale: Слово обозначает узкогорлый глиняный сосуд, используемый здесь в символическом действии. «Кувшин» — конкретное и понятное современному русскому читателю обозначение такого сосуда.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Буквально «перед глазами»; русский оборот «на глазах у» сохраняет зрительную образность и ясно указывает на присутствие свидетелей.
- source_word: הָאֲנָשִׁים
  choice: людей
  rationale: אֲנָשִׁים может обозначать мужчин или людей как группу. В данном контексте речь идёт о сопровождающих Иеремию представителях старейшин; «людей» звучит естественно и не утверждает больше, чем требует форма.
- source_word: הַהֹלְכִים אוֹתָךְ
  choice: которые идут с тобой
  rationale: Причастие выражает продолжающееся действие и описывает людей, сопровождающих Иеремию. Формулировка близка к структуре еврейского текста и естественна по-русски.
