base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/004.yaml
  text: Because they have forsaken me and made this place unrecognizable[a], and have burned incense in it to other gods whom neither they nor their fathers nor the kings of Judah had known, and they have filled this place with the blood of innocents[b],
translation:
  language: ru
  text: За то, что они оставили Меня, сделали это место чуждым[a], кадили в нём другим богам, которых не знали ни они, ни их отцы, ни цари Иудеи, и наполнили это место кровью невинных[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осквернили это место»; «сделали это место чужим»; «стали относиться к этому месту как к чужому». Еврейский глагол выражает идею придания месту чуждости или отчуждённости.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «кровью невинных»; по смыслу также возможно: «невинной кровью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: За то, что
  rationale: Передаёт причинное основание грядущего суда и естественно продолжает синтаксис высказывания, начатого в предыдущем стихе.
- source_word: עֲזָבֻנִי
  choice: они оставили Меня
  rationale: Глагол עזב означает «оставить, покинуть»; формулировка сохраняет личный и заветный характер обвинения без архаичного «оставили/покинули» в усиленном церковном регистре.
- source_word: וַיְנַכְּרוּ אֶת־הַמָּקוֹם הַזֶּה
  choice: сделали это место чужим
  rationale: Сохраняет основную семантику породы piel глагола נכר — сделать чужим, отчуждённым — и не подменяет образ более однозначным толкованием «осквернили».
- source_word: וַיְקַטְּרוּ בוֹ
  choice: кадили здесь
  rationale: קטר в данном контексте обозначает сжигание благовоний как культовое действие; «кадили» кратко и точно передаёт это значение, а «здесь» естественно указывает на названное место.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямое и ясное соответствие еврейскому выражению без добавления значения «чужеземные».
- source_word: אֲשֶׁר לֹא יְדָעוּם הֵמָּה וַאֲבוֹתֵיהֶם וּמַלְכֵי יְהוּדָה
  choice: которых не знали ни они, ни их предки, ни цари Иудеи
  rationale: Конструкция с повтором «ни» естественно распространяет отрицание на все три группы. «Предки» в современном русском языке здесь понятнее, чем гендерно ограниченное «отцы».
- source_word: וּמָלְאוּ אֶת־הַמָּקוֹם הַזֶּה
  choice: и наполнили это место
  rationale: Передаёт переходный глагол полноты и повтор существительного «место», сохраняющий риторическую структуру оригинала.
- source_word: דַּם נְקִיִּם
  choice: кровью невинных
  rationale: 'Передаёт личную отнесённость субстантивированного множественного נְקִיִּם: речь идёт о крови невинных людей, а не только об абстрактной «невинной крови».'
theological_decisions:
- issue: Значение נכר в обвинении о «месте»
  choice: сделали это место чужим
  alternative: осквернили это место; превратили это место в чужое; стали относиться к этому месту как к чужому
  rationale: Корневой образ связан с чуждостью и отчуждением. Выбранный вариант сохраняет намеренную необычность образа и его связь с последующим поклонением другим богам, не утверждая как единственно возможное более интерпретирующее «осквернили».
- issue: Референт выражения דַּם נְקִיִּם
  choice: кровью невинных
  alternative: невинной кровью
  rationale: Множественная форма указывает на невинных людей; перевод делает это явным, не уточняя сверх текста личности или обстоятельства их гибели.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет причинную зависимость от окружающего контекста, поэтому стих завершается запятой. Местоимение «Меня» написано с прописной буквы по принятой русской библейской издательской традиции; это орфографическое, а не догматическое решение.
