source:
  edition: WLC
  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת כָּ֣כָה אֶשְׁבֹּ֞ר אֶת הָ/עָ֤ם הַ/זֶּה֙ וְ/אֶת הָ/עִ֣יר הַ/זֹּ֔את כַּ/אֲשֶׁ֤ר יִשְׁבֹּר֙ אֶת כְּלִ֣י הַ/יּוֹצֵ֔ר אֲשֶׁ֛ר לֹֽא יוּכַ֥ל לְ/הֵרָפֵ֖ה ע֑וֹד וּ/בְ/תֹ֣פֶת יִקְבְּר֔וּ מֵ/אֵ֥ין מָק֖וֹם לִ/קְבּֽוֹר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/011.yaml
  text: 'And you shall say to them[a], ‘Thus says Yahweh of hosts: In this way I will break this people and this city, as one breaks a potter’s vessel, which cannot be repaired again[b]; and in Topheth they will bury because there is no place else to bury.’'
translation:
  language: ru
  text: 'И скажи им: «Так говорит Яхве Воинств: вот так Я разобью этот народ и этот город, как разбивают сосуд горшечника[a], который уже нельзя починить[b]. И в Тофете будут хоронить из-за отсутствия места для погребения».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово имеет широкое значение: «сосуд, изделие»; оно не уточняет, что это именно кувшин.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «который уже нельзя исцелить»; о разбитом сосуде это означает, что его нельзя починить или восстановить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет широту традиционного библейского титула и не сужает его до одних земных армий.
- source_word: כָּכָה
  choice: вот так
  rationale: Указывает на совершаемое пророком знамение — разбитие сосуда — и отличает это слово от כֹּה в формуле «Так говорит».
- source_word: אֶשְׁבֹּר ... יִשְׁבֹּר
  choice: разобью ... разбивают
  rationale: Сохраняет повтор одного и того же еврейского глагола и наглядность пророческого действия.
- source_word: כְּלִי הַיּוֹצֵר
  choice: сосуд горшечника
  rationale: כְּלִי обозначает сосуд или изделие в широком смысле; перевод не сужает значение до конкретного кувшина.
- source_word: לֹא יוּכַל לְהֵרָפֵה עוֹד
  choice: уже нельзя починить
  rationale: Буквально употреблён глагол «исцелять», но применительно к разбитой керамике современное русское «починить» естественно передаёт смысл; «уже» выражает עוֹד в отрицательной конструкции.
- source_word: וּבְתֹפֶת
  choice: И в Тофете
  rationale: Сохраняет топоним и значение предлога ב как места погребения.
- source_word: יִקְבְּרוּ
  choice: будут хоронить
  rationale: Передаёт активную форму третьего лица множественного числа без добавления отсутствующего в еврейском тексте прямого дополнения.
- source_word: מֵאֵין מָקוֹם לִקְבּוֹר
  choice: потому что больше негде будет хоронить
  rationale: Естественно передаёт причинное значение оборота и нехватку иного места для погребения.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо содержит тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Значение титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Яхве Саваоф / Яхве воинств небесных
  rationale: Формулировка сохраняет образ множества воинств, не ограничивая его одной заранее выбранной богословской трактовкой.
translation_notes:
  register: Современный литературный русский язык с торжественностью пророческой речи. Формула «Так говорит» сохранена, а «вот так» подчёркивает наглядное действие. Безличное «будут хоронить» естественно передаёт неопределённый субъект еврейской формы.
