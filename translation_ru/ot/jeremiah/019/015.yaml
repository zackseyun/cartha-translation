  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י מבי אֶל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל כָּל עָרֶ֔י/הָ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתִּי עָלֶ֑י/הָ כִּ֤י הִקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֖י שְׁמ֥וֹעַ אֶת דְּבָרָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/015.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Behold, I am bringing on this city and on all its towns all the disaster that I have spoken against it[c][b], because they have stiffened their neck so as not to hear my words.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств[a], Бог Израиля: «Вот, Я наведу на этот город и на все его поселения[b] всё бедствие[c], о котором Я говорил против него, потому что они упрямо противились[d], не желая слушать Моих слов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве, Повелитель воинств». Под «воинствами» могут подразумеваться как небесные, так и земные силы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на все его города».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово здесь означает бедствие или несчастье как последствие суда, а не нравственное зло.
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «сделали свои шеи жёсткими» — еврейский образ упрямого отказа повиноваться.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — широким по значению словом «Воинств», без сужения только до земных войск.
- source_word: הִנְנִי מֵבִיא
  choice: Вот, Я наведу
  rationale: «Вот» передаёт торжественную непосредственность הִנְנִי, а каузативная форма בוא обозначает наведение грядущего бедствия.
- source_word: כָּל עָרֶיהָ
  choice: все его города
  rationale: Суффикс принадлежности сохранён; слово עָרִים допускает значения «города» и «поселения».
- source_word: כָּל הָרָעָה
  choice: всё бедствие
  rationale: В контексте суда רָעָה означает пагубное бедствие, а не нравственное зло.
- source_word: דִּבַּרְתִּי עָלֶיהָ
  choice: которое Я предрёк этому городу
  rationale: Формулировка естественно передаёт ранее возвещённый против города приговор; повтор существительного устраняет неясность русского местоименного согласования.
- source_word: הִקְשׁוּ אֶת עָרְפָּם
  choice: они упорно противились
  rationale: Значение еврейской телесной метафоры передано понятным современным выражением, а буквальный образ сохранён в примечании.
- source_word: לְבִלְתִּי שְׁמוֹעַ אֶת דְּבָרָי
  choice: не желая слушать Моих слов
  rationale: Оборот выражает намеренный отказ внимать Божьим словам, а не простую физическую неспособность услышать.
theological_decisions:
- issue: Передача имени и титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве, Повелитель воинств
  rationale: Выбор сохраняет открыто названное личное имя и широкий образ воинств, не подменяя имя титулом и не ограничивая речь исключительно земными армиями.
- issue: Характер רָעָה в Божьем суде
  choice: бедствие
  alternative: зло; несчастье
  rationale: Здесь речь о губительных последствиях суда. Перевод «зло» мог бы ошибочно приписать Богу нравственное зло.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Архаизмы вроде «се», «выя» и «Саваоф» в основном тексте не использованы. Синтаксис сохранён цельным, но еврейская идиома раскрыта естественно и снабжена буквальным пояснением.
