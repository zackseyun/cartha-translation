base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/014.yaml
  text: And Yahweh said to me[b][a], “From the north the disaster will break forth against all the inhabitants of the land.”
translation:
  language: ru
  text: 'И сказал мне Яхве: «С севера разразится бедствие[a] на всех жителей земли[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обрушится бедствие»; буквальнее: «бедствие откроется».'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, здесь имеется в виду земля Иудеи; слово также может означать землю в смысле всего мира.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продолжает повествование; «И сказал» естественно сохраняет связь с предыдущим стихом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֵלָי
  choice: мне
  rationale: Естественная современная передача еврейского предлога с местоименным суффиксом первого лица.
- source_word: מִצָּפוֹן
  choice: с севера
  rationale: Прямая и идиоматичная передача направления, откуда придёт предсказанное бедствие.
- source_word: תִּפָּתַח
  choice: обрушится
  rationale: Нифаль глагола פתח буквально означает «будет открыто», но в сочетании с רָעָה описывает начало или высвобождение бедствия. «Обрушится» ясно и выразительно передаёт наступление бедствия в современном русском языке; буквальный образ отмечен в сноске.
- source_word: הָרָעָה
  choice: бедствие
  rationale: В контексте грядущего суда слово обозначает несчастье или катастрофу, а не нравственное зло. «Бедствие» сохраняет серьёзный пророческий регистр.
- source_word: עַל
  choice: на
  rationale: При глаголе «обрушится» предлог «на» естественно выражает направленность бедствия против жителей.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: всех жителей земли
  rationale: Передаёт всех живущих на данной территории, не уточняя в основном тексте, идёт ли речь именно о земле Иудеи или о земле в более широком смысле.
theological_decisions:
- issue: Значение הָרָעָה в контексте Божьего суда
  choice: бедствие
  alternative: зло; несчастье
  rationale: Контекст возвещает губительные события, приходящие с севера. Перевод «бедствие» не превращает стих в утверждение о том, что Бог производит нравственное зло, но лексическая широта слова отмечена в сноске.
- issue: Объём значения הָאָרֶץ
  choice: земля без добавленного уточнения
  alternative: земля Иудеи; вся земля
  rationale: Ближайший контекст указывает прежде всего на Иудею, однако само слово допускает более широкое значение. Основной текст сохраняет эту открытость, а вероятная местная отсылка и альтернатива пояснены в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Синтаксис сохраняет порядок и напряжённость еврейского высказывания, а непривычная буквальная метафора разъясняется в сноске.
