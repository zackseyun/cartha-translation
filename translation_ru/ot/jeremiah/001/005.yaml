base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/005.yaml
  text: Before I formed you in the womb[a], I knew you, and before you came out from the womb, I set you apart[b]; I appointed you as a prophet to the nations.
translation:
  language: ru
  text: Прежде чем Я образовал тебя во чреве, Я знал тебя; прежде чем ты вышел из утробы, Я освятил тебя[a]. Я поставил тебя пророком для народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я посвятил тебя»; также возможно: «Я отделил тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: прежде чем
  rationale: Естественно передаёт временное значение «до того как» без добавочного усиления.
- source_word: אצור/ך
  choice: Я образовал тебя
  rationale: Глагол יצר обозначает формирование, придание формы; «образовал» сохраняет конкретный образ божественного созидания.
- source_word: בַבֶּטֶן
  choice: во чреве
  rationale: В данном дородовом контексте בטן означает материнское чрево; формулировка литературна и понятна.
- source_word: יְדַעְתִּיךָ
  choice: Я знал тебя
  rationale: Сохраняет широкое значение ידע, включая возможный оттенок личного отношения или избрания, не сводя его к одному толкованию.
- source_word: תֵּצֵא מֵרֶחֶם
  choice: ты вышел из утробы
  rationale: Передаёт конкретное еврейское выражение «выйти из утробы», относящееся к рождению.
- source_word: הִקְדַּשְׁתִּיךָ
  choice: Я отделил тебя для Себя
  rationale: Hифиль קדש выражает посвящение, отделение как святого. Добавление «для Себя» естественно проясняет подразумеваемую посвящённость Богу, не вводя конфессиональной терминологии.
- source_word: נָבִיא לַגּוֹיִם
  choice: пророком для народов
  rationale: «Народы» сохраняет широкий смысл גוים, а предлог «для» естественно обозначает сферу служения пророка.
- source_word: נְתַתִּיךָ
  choice: Я поставил тебя
  rationale: Хотя נתן буквально значит «дать», в контексте назначения на служение естественно передаётся как «поставить».
theological_decisions:
- issue: Значение יְדַעְתִּיךָ в связи с предведением и избранием
  choice: Я знал тебя
  alternative: Я избрал тебя
  rationale: Еврейский глагол ידע способен подразумевать личное отношение и избрание, однако его более широкая формулировка сохранена, чтобы не устранять богословскую многозначность.
- issue: Значение הִקְדַּשְׁתִּיךָ
  choice: Я отделил тебя для Себя
  alternative: Я освятил тебя / Я посвятил тебя
  rationale: Выбранная формулировка доступно передаёт отделение для святой цели; вариант «посвятил» также лексически возможен и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксический параллелизм двух временных придаточных сохранён; инверсия в заключительной фразе передаёт торжественный акцент еврейского текста.
