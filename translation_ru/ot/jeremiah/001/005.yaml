- from: 'Прежде чем Я образовал тебя во чреве, Я знал тебя; и прежде чем ты вышел из утробы, Я отделил тебя для Себя[a]: пророком для народов Я поставил тебя.'
  to: Прежде чем Я образовал тебя во чреве, Я знал тебя; прежде чем ты вышел из утробы, Я освятил тебя[a]. Я поставил тебя пророком для народов.
  rationale: Убрано невыраженное в оригинале «для Себя». «Я освятил тебя» прямо передаёт הקדשתיך, а сноска сохраняет доступные лексические альтернативы «посвятил» и «отделил». Заключительная фраза перестроена в естественный русский порядок слов без утраты смысла назначения.
