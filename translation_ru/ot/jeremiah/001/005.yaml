  source_fidelity: 'Основной смысл передан точно: сохранены временные придаточные, образ формирования во чреве, «Я знал тебя», выход из утробы и назначение пророком для народов. Однако «Я отделил тебя для Себя» добавляет к еврейскому тексту явное «для Себя», которого в тексте нет; лучше передать הקדשתיך термином «Я освятил тебя», с альтернативами в сноске.'
