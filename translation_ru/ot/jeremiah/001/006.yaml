base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/006.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I do not know how to speak[c][b], for I am a youth.”
translation:
  language: ru
  text: 'Тогда я сказал: «Ах, Владыка Яхве![a] Вот, я не умею говорить[b], потому что я ещё молод[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский титул אֲדֹנָי יְהוִה сочетает «Владыка» и имя Яхве; традиционно его также передают как «Господь Бог».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «я не знаю говорить» — еврейское выражение со значением «я не умею говорить» или «я не знаю, как говорить».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское נַעַר может обозначать мальчика, юношу или молодого мужчину; точный возраст здесь не указан.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Тогда я сказал
  rationale: Форма wayyiqtol продолжает повествование; «тогда» естественно передаёт последовательность событий.
- source_word: אֲהָהּ
  choice: О
  rationale: Междометие выражает тревогу и возражение Иеремии. «О» сохраняет эмоциональную силу, не придавая словам исключительно скорбного оттенка.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי и позволяет ясно сохранить личное имя Яхве без неестественного сочетания «Господь Господь».
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к последующему возражению; русское «вот» кратко и естественно сохраняет эту функцию.
- source_word: לֹא יָדַעְתִּי דַּבֵּר
  choice: я не умею говорить
  rationale: Буквально конструкция означает «я не знаю говорить»; по-русски значение неспособности или неопытности естественно передаётся выражением «не умею говорить» без утверждения физической немоты.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, которой Иеремия объясняет своё возражение.
- source_word: נַעַר אָנֹכִי
  choice: я ещё молод
  rationale: נַעַר обозначает человека от мальчика до молодого мужчины в зависимости от контекста. «Ещё молод» сохраняет акцент на молодости и неопытности, не фиксируя точный возраст; самостоятельное אָנֹכִי подчёркивает «я».
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбранный вариант различает титул אֲדֹנָי и личное имя יהוה, сохраняя оба элемента еврейского текста. Сноска сообщает читателю о традиционном способе передачи.
- issue: Характер возражения Иеремии
  choice: я не умею говорить
  alternative: я не знаю, как говорить
  rationale: Формулировка сохраняет заявленную неопытность или неспособность, не уточняя, идёт ли речь о возрасте, красноречии или пророческой речи.
translation_notes:
  register: Современный литературный русский язык с dignified, но не архаичной интонацией. Синтаксис сохраняет краткость и эмоциональность возражения; «ещё молод» звучит естественнее буквального «я юноша» и подчёркивает неопытность без чрезмерного уточнения возраста.
