  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה אֵלַ/י֙ שֵׁנִ֣ית לֵ/אמֹ֔ר מָ֥ה אַתָּ֖ה רֹאֶ֑ה וָ/אֹמַ֗ר סִ֤יר נָפ֨וּחַ֙ אֲנִ֣י רֹאֶ֔ה וּ/פָנָ֖י/ו מִ/פְּנֵ֥י צָפֽוֹנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/013.yaml
  text: And the word of Yahweh came to me a second time[a], saying, “What do you see?” And I said, “I see a boiling pot[b], and its face is from the north.”
translation:
  language: ru
  text: 'И слово Яхве пришло ко мне во второй раз: «Что ты видишь?» Я ответил: «Я вижу кипящий котёл[a], лицевая сторона которого — со стороны севера[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «котёл, огонь под которым раздувают»; еврейское причастие может указывать на раздувание огня, от которого котёл закипает.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и его лицо — от лица севера». Возможно, речь идёт о передней стороне или отверстии котла и его ориентации относительно севера; точное положение неясно.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и передаёт личное имя יְהוָה как «Яхве».
- source_word: שֵׁנִית
  choice: во второй раз
  rationale: Точно выражает последовательность, обозначенную еврейским наречием.
- source_word: מָה אַתָּה רֹאֶה
  choice: Что ты видишь?
  rationale: Естественная русская передача вопроса с причастием настоящего времени.
- source_word: סִיר נָפוּחַ
  choice: кипящий котёл
  rationale: סִיר обозначает сосуд для приготовления пищи, а נָפוּחַ буквально связано с раздуванием огня и в данном образе, вероятно, описывает доведённый до кипения котёл.
- source_word: וּפָנָיו מִפְּנֵי צָפוֹנָה
  choice: обращённый к северу
  rationale: Естественно передаёт ориентацию котла относительно севера, не уточняя, идёт ли речь о передней стороне, крае или отверстии; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога и соответствует принятому в проекте решению.
- issue: Ориентация котла
  choice: обращённый к северу
  alternative: его лицевая сторона — со стороны севера; наклонён от севера
  rationale: Еврейское выражение необычно и допускает разные пространственные толкования. Основной текст передаёт общую связь образа с севером, а сноска сохраняет буквальную форму и неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «И было ко мне слово Яхве» намеренно сохраняет библейскую торжественность; ответ передан естественно и ясно. Все сноски отмечены в основном тексте.
