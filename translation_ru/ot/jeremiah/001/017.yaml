review_pass:
  verdict: revise
  source_fidelity: 'Основная структура и смысл переданы верно: подчёркнутое «А ты», последовательность призыва к действию, полнота поручения, двукратное «перед ними» и предупреждение сохранены. Однако «подпояшь одежду на поясе» тавтологично и не соответствует естественному русскому способу выразить древний образ. Формула «не приходи в смятение» также неестественна для современного литературного русского.'
  naturalness: «Подпояшься» — естественная современная литературная форма, сохраняющая образ подготовки одежды к действию; сноска раскрывает буквальный образ. «Не смущайся ... Я смущу тебя» образует ясный лексический повтор и звучит естественнее, чем «не приходи в смятение ... приведу в смятение».
  terminology: Теологически нагруженных терминов в стихе нет. Местоимение «Я» уместно пишется с прописной буквы в прямой речи Бога. «Смущаться / смутить» передаёт предупреждение и, насколько возможно по-русски, воспроизводит игру форм одного еврейского корня, не навязывая более узкого толкования вроде физического поражения.
  issues:
  - severity: medium
    issue: Неестественная тавтология «подпояшь одежду на поясе».
    rationale: Подпоясывание уже означает закрепление одежды поясом. Формула утяжеляет текст и не является нормативно естественной для современного литературного русского.
  - severity: medium
    issue: Неестественная конструкция «Не приходи в смятение».
    rationale: По-русски обычно говорят «не смущайся», «не робей» или «не падай духом». В данном контексте «не смущайся» позволяет также сохранить повтор с последующим «Я смущу тебя».
  - severity: low
    issue: Сноска называет буквальным выражение «подпояшь свои бёдра».
    rationale: Это допустимое пояснение идиомы, но более точно обозначить его как древнееврейский буквальный образ и пояснить, что речь идёт о закреплении одежды для действия.
