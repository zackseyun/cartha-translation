source:
  edition: WLC
  text: וְ/אַתָּה֙ תֶּאְזֹ֣ר מָתְנֶ֔י/ךָ וְ/קַמְתָּ֙ וְ/דִבַּרְתָּ֣ אֲלֵי/הֶ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י אֲצַוֶּ֑/ךָּ אַל תֵּחַת֙ מִ/פְּנֵי/הֶ֔ם פֶּֽן אֲחִתְּ/ךָ֖ לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/017.yaml
  text: But you[a], gird up your loins, and arise and speak to them all that I command you. Do not be dismayed before them, lest I dismay you before them.
translation:
  language: ru
  text: А ты подпояшься[a], встань и скажи им всё, что Я повелю тебе. Не смущайся перед ними, чтобы Я не смутил тебя перед ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейская идиома буквально: «опояшь свои бёдра»; то есть закрепи одежду поясом и приготовься действовать.'
    reason: Поясняет конкретный древний образ, сохранённый в основном тексте естественным русским глаголом «подпояшься».
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Сочетание союза с явным местоимением обозначает подчеркнутый переход к прямому поручению Иеремии; «А ты» естественно передаёт этот контраст в русском языке.
- source_word: תֶּאְזֹר מָתְנֶיךָ
  choice: подпояшь одежду на поясе
  rationale: Еврейская идиома буквально описывает подготовку длинной одежды к действию. Формулировка сохраняет телесный образ, но избегает малопонятного современному читателю архаизма «препояшь чресла».
- source_word: וְקַמְתָּ
  choice: встань
  rationale: Форма входит в последовательность повелений и передаёт призыв приступить к исполнению поручения.
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם
  choice: скажи им
  rationale: Обычное и прямое соответствие דבר с אל в данном поручении; контекст не требует усиленного «возвести» или «провозгласи».
- source_word: אֵת כָּל אֲשֶׁר אָנֹכִי אֲצַוֶּךָּ
  choice: всё, что Я повелю тебе
  rationale: Передаёт требование полной верности Божьему поручению. Будущее «повелю» естественно выражает открытый ряд указаний, которые Бог будет давать пророку, не исключая настоящего поручения.
- source_word: אַל תֵּחַת ... פֶּן אֲחִתְּךָ
  choice: Не приходи в смятение ... иначе Я приведу тебя в смятение
  rationale: 'Одинаковая русская основа сохраняет намеренную игру между Niphal и Hiphil одного еврейского корня חתת: Иеремия не должен поддаваться смятению, иначе Бог Сам приведёт его в смятение.'
- source_word: מִפְּנֵיהֶם ... לִפְנֵיהֶם
  choice: перед ними ... перед ними
  rationale: Повтор сохраняет пространственно-конфронтационный оттенок оригинала и его риторическую симметрию.
theological_decisions:
- issue: Сохранение телесной идиомы в призвании пророка
  choice: Передать конкретный образ как «подпояшь одежду на поясе» и пояснить его в сноске
  alternative: Сразу заменить идиому выражением «приготовься действовать»
  rationale: Конкретный образ подчёркивает готовность, решимость и торжественность поручения; пояснение позволяет сохранить его без архаичной и малопонятной лексики.
- issue: Предупреждение, построенное на двух формах корня חתת
  choice: 'Сохранить лексический повтор: «приходи в смятение / приведу в смятение»'
  alternative: 'Передать разными словами: «не бойся / иначе Я устрашу»'
  rationale: 'Повтор является существенной частью смысла и риторической силы предупреждения: состояние, которому пророк поддастся перед людьми, Бог может Сам на него навести.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Архаизм «чресла» не использован; образ подготовки одежды к действию сохранён в понятной форме. Повтор «перед ними» и игра форм одного корня переданы намеренно.
