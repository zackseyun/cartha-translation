  to: А ты подпояшься[a], встань и скажи им всё, что Я повелю тебе. Не смущайся перед ними, чтобы Я не смутил тебя перед ними.
  rationale: Исправлены две неестественные формулировки без изменения смысла. «Подпояшься» передаёт подготовку одежды к действию, а сноска сохраняет буквальный образ. Пара «не смущайся / не смутил» отражает намеренный повтор корня חתת в формах Niphal и Hiphil и сохраняет предупредительный характер придаточного с פֶּן.
