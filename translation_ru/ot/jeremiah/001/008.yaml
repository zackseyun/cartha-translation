  text: אַל תִּירָ֖א מִ/פְּנֵי/הֶ֑ם כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הַצִּלֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/008.yaml
  text: Do not be afraid of them[a], for I am with you to deliver you[b], declares Yahweh.
translation:
  language: ru
  text: Не бойся их[a], ибо Я с тобой, чтобы избавить тебя[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за их лица»; то есть из-за них или в их присутствии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы спасти тебя»; «чтобы выручить тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Отрицательная частица אַל с формой имперфекта выражает запрет; «не бойся» — естественная и точная русская передача.
- source_word: מִפְּנֵיהֶם
  choice: их
  rationale: Буквально выражение связано с нахождением «перед их лицом», но при глаголе ירא идиоматически обозначает объект или причину страха.
- source_word: כִּי
  choice: потому что
  rationale: 'Союз вводит основание запрета: Иеремии не следует бояться именно потому, что Яхве с ним.'
- source_word: אִתְּךָ אֲנִי
  choice: Я с тобой
  rationale: Сохраняет заверение в личном присутствии Бога; постановка «Я» передаёт заметный акцент исходной конструкции без неестественной тяжеловесности.
- source_word: לְהַצִּלְךָ
  choice: чтобы избавлять тебя
  rationale: Порода hифиль глагола נצל означает вырывать из опасности, спасать, избавлять. Несовершенный вид по-русски уместно передаёт не только единичное действие, но и обещание Божьей защиты в ходе служения.
- source_word: נְאֻם
  choice: возвещает
  rationale: Торжественная пророческая формула; «возвещает» сохраняет официальный характер божественного речения и звучит естественнее буквального «изречение».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет это различие и не превращает имя в титул.
- issue: Смысл לְהַצִּלְךָ
  choice: чтобы избавлять тебя
  alternative: чтобы спасти тебя; чтобы выручить тебя
  rationale: Формулировка сохраняет широкий смысл Божьего освобождения от опасности в пророческом служении и не сужает обещание ни до одной конкретной угрозы, ни до исключительно духовного спасения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим оттенком. Заглавное «Я» подчёркивает выраженное в еврейском тексте местоимение. Формула «возвещает Яхве» сохраняет возвышенный характер נְאֻם, не прибегая к архаизмам.
