source:
  edition: WLC
  text: רְאֵ֞ה הִפְקַדְתִּ֣י/ךָ הַ/יּ֣וֹם הַ/זֶּ֗ה עַל הַ/גּוֹיִם֙ וְ/עַל הַ/מַּמְלָכ֔וֹת לִ/נְת֥וֹשׁ וְ/לִ/נְת֖וֹץ וּ/לְ/הַאֲבִ֣יד וְ/לַ/הֲר֑וֹס לִ/בְנ֖וֹת וְ/לִ/נְטֽוֹעַ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/010.yaml
  text: See[a], today I have appointed you over the nations and over the kingdoms, to uproot and to tear down, and to destroy and to demolish[c][b], to build and to plant.
translation:
  language: ru
  text: 'Смотри: сегодня Я поставил тебя над народами и над царствами[a], чтобы искоренять и разрушать, губить и сокрушать, созидать и насаждать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь идёт о пророческом поручении Иеремии возвещать Божье слово о народах и царствах, а не о прямой политической власти над ними.
    reason: cultural_note
lexical_decisions:
- source_word: רְאֵה
  choice: Смотри
  rationale: Повелительная форма служит призывом обратить внимание. «Смотри» естественно для современного русского языка и сохраняет прямоту обращения.
- source_word: הִפְקַדְתִּיךָ
  choice: Я поставил тебя
  rationale: Hифиль глагола פקד обозначает назначение и вверение полномочий. «Поставил» передаёт торжественное поручение без излишнего уточнения его характера.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Естественный современный эквивалент выражения «в этот день», сохраняющий непосредственность момента призвания.
- source_word: עַל הַגּוֹיִם וְעַל הַמַּמְלָכוֹת
  choice: над народами и над царствами
  rationale: При פקד предлог עַל указывает на область вверенного полномочия. «Над» сохраняет форму и напряжение оригинала; сноска поясняет, что речь идёт о пророческом поручении, а не о политическом правлении.
- source_word: לִנְתוֹשׁ
  choice: искоренять
  rationale: Глагол передаёт образ вырывания с корнем и образует смысловую пару с последующим «насаждать».
- source_word: לִנְתוֹץ
  choice: разрушать
  rationale: Обозначает разбор или разрушение сооружения; русский глагол естествен и сохраняет отличие от следующей пары глаголов.
- source_word: וּלְהַאֲבִיד
  choice: губить
  rationale: Каузатив от אבד означает приводить к гибели, уничтожать. «Губить» кратко передаёт это значение и поддерживает ритм перечисления.
- source_word: וְלַהֲרוֹס
  choice: сокрушать
  rationale: Глагол означает рушить, низвергать, разорять. «Сокрушать» позволяет не повторять «разрушать» и сохраняет нарастающую силу ряда из четырёх глаголов суда.
- source_word: לִבְנוֹת
  choice: созидать
  rationale: Точно передаёт восстановительный образ строительства и в данном торжественном контексте звучит естественно и достойно.
- source_word: וְלִנְטוֹעַ
  choice: насаждать
  rationale: Сохраняет земледельческий образ и создаёт явную смысловую пару с «искоренять».
theological_decisions:
- issue: Характер власти Иеремии над народами и царствами
  choice: Сохранено «над народами и над царствами» с пояснением, что полномочие осуществляется через пророческое слово.
  alternative: «О народах и царствах» или «против народов и царств».
  rationale: Сочетание פקד с עַל естественно выражает назначение над определённой сферой, тогда как последующие инфинитивы показывают действие пророческого слова в суде и восстановлении. Перевод не превращает это поручение в прямую гражданскую власть.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Симметричные пары «искоренять — насаждать» и «разрушать — созидать» сохраняют образность и ритм еврейского перечисления; четыре глагола суда и два глагола восстановления оставлены без смыслового сглаживания.
