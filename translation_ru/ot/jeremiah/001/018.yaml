  text: וַ/אֲנִ֞י הִנֵּ֧ה נְתַתִּ֣י/ךָ הַ/יּ֗וֹם לְ/עִ֨יר מִבְצָ֜ר וּ/לְ/עַמּ֥וּד בַּרְזֶ֛ל וּ/לְ/חֹמ֥וֹת נְחֹ֖שֶׁת עַל כָּל הָ/אָ֑רֶץ לְ/מַלְכֵ֤י יְהוּדָה֙ לְ/שָׂרֶ֔י/הָ לְ/כֹהֲנֶ֖י/הָ וּ/לְ/עַ֥ם הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/018.yaml
  text: And I—behold[a], I have made you today a fortified city, an iron pillar, and bronze walls against the whole land—against the kings of Judah, its officials, its priests[b], and the people of the land.
translation:
  language: ru
  text: А Я — вот, сегодня Я сделал тебя укреплённым городом, железным столпом и бронзовыми стенами против всей страны — против царей Иудеи, её правителей, её священников и народа страны[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «народ страны» может означать население страны в целом, а в некоторых контекстах — простой народ в отличие от правителей.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: А Я — вот
  rationale: Самостоятельное местоимение подчёркивает говорящего, а הִנֵּה придаёт высказыванию указательную и торжественную силу. «А Я — вот» естественно передаёт смену фокуса и акцент, не превращая связь в однозначно противительную.
- source_word: נְתַתִּיךָ
  choice: Я сделал тебя
  rationale: Хотя נתן буквально означает «дать, поставить», с последующими именными дополнениями с לְ глагол выражает назначение или наделение новым положением. «Сделал тебя» естественно сохраняет образное уподобление Иеремии укреплениям.
- source_word: לְעִיר מִבְצָר
  choice: укреплённым городом
  rationale: Предлог לְ вводит результативно-предикативное значение. Русский творительный падеж после «сделал» ясно и естественно передаёт этот смысл.
- source_word: וּלְעַמּוּד בַּרְזֶל
  choice: железным столпом
  rationale: «Столп» сохраняет торжественный пророческий регистр и образ несокрушимой опоры, оставаясь понятным в современном литературном русском.
- source_word: וּלְחֹמוֹת נְחֹשֶׁת
  choice: медными стенами
  rationale: נְחֹשֶׁת может обозначать медь или бронзу. Традиционное и лексически допустимое «медные» сохраняет металлический образ без ложной технической точности; множественное число передано.
- source_word: עַל כָּל הָאָרֶץ
  choice: против всей этой земли
  rationale: В контексте עַל выражает противостояние, а הָאָרֶץ относится к земле Иудеи, что уточняется последующим перечнем. Указательное «этой» помогает избежать значения всей планеты.
- source_word: לְמַלְכֵי יְהוּדָה לְשָׂרֶיהָ לְכֹהֲנֶיהָ
  choice: против царей Иудеи, её правителей, её священников
  rationale: Повтор «против» перед перечнем выявляет отношение групп к предыдущему עַל. שָׂרִים здесь естественно передано современным словом «правители», охватывающим высших должностных лиц.
- source_word: וּלְעַם הָאָרֶץ
  choice: и народа этой земли
  rationale: Буквальная формула сохранена, поскольку она может обозначать как широкое население, так и, в некоторых контекстах, простонародье; сноска отмечает эту неоднозначность.
theological_decisions:
- issue: Масштаб выражения כָּל הָאָרֶץ
  choice: «вся эта земля», то есть земля Иудеи
  alternative: «вся земля» в смысле всей земли или мира
  rationale: Непосредующее перечисление царей Иудеи, её правителей, священников и народа указывает на местный, национальный охват, не ослабляя всеобщности противостояния внутри Иудеи.
- issue: Характер образов города, столпа и стен
  choice: Сохранены как метафорическое описание того, кем Бог делает Иеремию
  alternative: Истолковать их как отдельные качества — безопасность, стойкость и защиту
  rationale: Исходный текст даёт ряд конкретных образов и не объясняет каждый из них; перевод не должен догматически распределять их значения.
- issue: Социальный объём עַם הָאָרֶץ
  choice: «народ этой земли» с сохранением широты выражения
  alternative: «простой народ»
  rationale: Контекст допускает охват всего населения наряду с его руководящими слоями, тогда как перевод «простой народ» преждевременно сужает значение.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Заглавное «Я» обозначает Бога в прямой речи. Синтаксис сохраняет эмфатическое начало и нарастающий ряд метафор; тире перед перечнем делает сферу противостояния ясной. Единственный маркер [a] размещён непосредственно после соответствующего выражения.
