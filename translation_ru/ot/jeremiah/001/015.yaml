id: JER.1.15
reference: Jeremiah 1:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י הִנְ/נִ֣י קֹרֵ֗א לְ/כָֽל מִשְׁפְּח֛וֹת מַמְלְכ֥וֹת צָפ֖וֹנָ/ה נְאֻם יְהוָ֑ה וּ/בָ֡אוּ וְֽ/נָתְנוּ֩ אִ֨ישׁ כִּסְא֜/וֹ פֶּ֣תַח שַׁעֲרֵ֣י יְרוּשָׁלִַ֗ם וְ/עַ֤ל כָּל חוֹמֹתֶ֨י/הָ֙ סָבִ֔יב וְ/עַ֖ל כָּל עָרֵ֥י יְהוּדָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/015.yaml
  text: For behold[a], I am calling all the clans of the kingdoms of the north, declares Yahweh, and they will come, and each will set his throne at the entrance of the gates of Jerusalem, against all her walls all around[b], and against all the cities of Judah.
translation:
  language: ru
  text: Ибо вот, Я созываю все роды[a] северных царств, — говорит Яхве, — и они придут, и каждый поставит свой престол[b] у входа в ворота Иерусалима, против всех стен вокруг него и против всех городов Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать большие семьи, роды, кланы или сходные родственные объединения.
    reason: lexical_alternative
  - marker: b
    text: Престолы у городских ворот могут изображать то, как пришедшие правители занимают место власти и суда.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הִנְנִי
  choice: Ибо вот, Я
  rationale: «Ибо» связывает стих с предшествующим объяснением, а «вот» сохраняет указательно-эмфатическую силу הִנְנִי и непосредственность предстоящего действия.
- source_word: קֹרֵא
  choice: созываю
  rationale: В контексте властного призыва северных сил «созываю» естественно передаёт причастную форму и оттенок собирания по призыву.
- source_word: לְכָל מִשְׁפְּחוֹת מַמְלְכוֹת צָפוֹנָה
  choice: все роды северных царств
  rationale: «Роды» передаёт социально-родовые группы מִשְׁפְּחוֹת, не сводя их к отдельным домашним семьям; множественное число «царств» сохранено.
- source_word: נְאֻם יְהוָה
  choice: говорит Яхве
  rationale: Естественная и торжественная русская форма пророческой формулы; личное имя יהוה передано как «Яхве».
- source_word: וּבָאוּ
  choice: Они придут
  rationale: Контекст требует будущего значения последовательной формы.
- source_word: וְנָתְנוּ אִישׁ כִּסְאוֹ
  choice: и каждый поставит свой престол
  rationale: אִישׁ употреблено распределительно — «каждый»; «престол» сохраняет царский и судебный образ כִּסֵּא.
- source_word: פֶּתַח שַׁעֲרֵי יְרוּשָׁלִַם
  choice: у входа в ворота Иерусалима
  rationale: Передаёт единственное число «вход» и множественное «ворота», сохраняя пространственный образ исходного текста.
- source_word: וְעַל כָּל חוֹמֹתֶיהָ סָבִיב
  choice: против всех стен вокруг него
  rationale: В военном контексте עַל имеет враждебную направленность «против», а סָבִיב указывает на окружение города.
- source_word: וְעַל כָּל עָרֵי יְהוּדָה
  choice: и против всех городов Иудеи
  rationale: Сохранены враждебное значение предлога, множественное число и полный охват территории.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя, не заменяя его титулом.
- issue: Образ поставленных престолов
  choice: сохранён буквально и пояснён в сноске
  alternative: истолковать в основном тексте как осаду или суд
  rationale: Образ допускает взаимосвязанные оттенки царской власти, суда и военного господства; перевод не устраняет эту смысловую напряжённость.
- issue: Распределительное אִישׁ
  choice: каждый
  alternative: каждый мужчина
  rationale: Здесь форма распределяет действие между призванными группами или их правителями, а не подчёркивает пол участников.
translation_notes:
  register: Современный литературный русский язык с торжественностью пророческой речи. Синтаксис разделён прямой речью для ясности; образность исходного текста сохранена без конфессионального истолкования.
