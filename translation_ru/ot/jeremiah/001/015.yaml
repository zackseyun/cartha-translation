    rationale: Престолы у ворот действительно вызывают ассоциации с царской властью и судом, но в непосредственном контексте также присутствует угроза нападения. Следует обозначить пояснение как возможное значение образа и не добавлять «над Иерусалимом» как прямое утверждение текста.
