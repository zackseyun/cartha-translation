- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение того, почему увиденное пророком признано верным.
- source_word: שֹׁקֵד
  choice: неусыпно слежу
  rationale: Причастие выражает бодрствующую бдительность. Слово «неусыпно» помогает передать этот оттенок, хотя еврейскую игру слов полностью воспроизвести невозможно.
- source_word: דְּבָרִי
  choice: Моим словом
  rationale: Сохранено широкое значение единственного числа без сужения до «обещания» или «вести».
- source_word: לַעֲשֹׂתוֹ
  choice: чтобы исполнить его
  rationale: 'Инфинитив выражает цель: Яхве следит за Своим словом, чтобы осуществить сказанное; «исполнить» естественно сочетается со «словом» в русском языке.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя; транслитерация сохраняет его, не подменяя титулом.
- issue: Значение דָּבָר в пророческом контексте
  choice: Моим словом
  alternative: Моим обещанием; Моей вестью
  rationale: «Слово» сохраняет семантическую широту еврейского существительного и не уточняет смысл сверх текста.
- issue: Связь между שָׁקֵד в стихе 11 и שֹׁקֵד в стихе 12
  choice: Передать основной смысл в тексте и объяснить игру слов в сноске
  alternative: Создать искусственную русскую игру слов
  rationale: Еврейское созвучие между «миндалём» и «бодрствую/слежу» не имеет естественного точного соответствия по-русски; сноска сохраняет значимый литературный приём без искажения.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Заглавные буквы в местоимениях, относящихся к Богу, применены в соответствии с распространённой русской библейской традицией. Единственный маркер [a] стоит непосредственно после относящейся к нему фразы.
