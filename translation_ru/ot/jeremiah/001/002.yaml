base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/002.yaml
  text: to whom the word of Yahweh came in the days of Josiah son of Amon, king of Judah, in the thirteenth year of his reign.
translation:
  language: ru
  text: к которому пришло слово Яхве во дни Иосии, сына Амона, царя Иудеи, в тринадцатый год его царствования.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר ... אֵלָיו
  choice: к которому
  rationale: Относительное местоимение относится к Иеремии из предыдущего стиха; сочетание с אֵלָיו естественно передаётся по-русски как «к которому».
- source_word: הָיָה דְבַר יְהוָה
  choice: было слово Яхве
  rationale: Сохранена традиционная пророческая формула, естественная для русского библейского стиля и близкая к еврейской конструкции; «слово» передаёт откровенный и действенный характер דָּבָר.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: בִּימֵי
  choice: во дни
  rationale: Краткое и узнаваемое обозначение времени в историко-пророческом заголовке.
- source_word: יֹאשִׁיָּהוּ בֶן אָמוֹן
  choice: Иосии, сына Амона
  rationale: Использованы устоявшиеся русские формы библейских имён и прямо сохранена родословная идентификация.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Прямое и естественное обозначение титула и царства.
- source_word: בִּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה לְמָלְכוֹ
  choice: в тринадцатый год его царствования
  rationale: Идиоматическая русская передача датировки по году правления царя.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Оборот «во дни» сохранён как ясная и уместная формула пророческого заголовка. Синтаксис учитывает, что стих продолжает предложение, начатое в Иер 1:1.
