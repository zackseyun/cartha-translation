source:
  edition: WLC
  text: וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הַצִּילֶֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/019.yaml
  text: They will fight against you[a], but they will not prevail against you, for I am with you, declares Yahweh[c][b], to deliver you.
translation:
  language: ru
  text: Они будут сражаться против тебя, но не смогут одолеть тебя[a], потому что Я с тобой, — возвещает Яхве[b], — чтобы избавить тебя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не смогут против тебя»; также возможно: «не возьмут над тобой верх».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте стоит יהוה (ЙХВХ), личное имя Бога; традиционно переводится как «Господь».
    reason: alternative_reading
  - marker: c
    text: 'Или: «чтобы спасти тебя»; глагол означает избавление или спасение из опасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  choice: будут сражаться против тебя
  rationale: Нифаль глагола לחם обозначает вступление в борьбу, а אֶל при нём указывает на враждебную направленность. Формулировка естественна по-русски и не усиливает значение до полномасштабной войны.
- source_word: וְלֹא יוּכְלוּ לָךְ
  choice: но не смогут одолеть тебя
  rationale: Сочетание יכל с ל выражает неспособность противников добиться успеха в борьбе с Иеремией. Перевод передаёт обещание их конечной неудачи, не подразумевая, что пророк вовсе не пострадает.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой противники не одолеют пророка.
- source_word: אִתְּךָ אֲנִי
  choice: Я с тобой
  rationale: Сохранена краткая формула заверения в Божьем присутствии и её богословская насыщенность.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Пророческая формула обозначает торжественное Божье изречение. «Возвещает» звучит достойно и понятно, а личное имя передано непосредственно.
- source_word: לְהַצִּילֶךָ
  choice: чтобы избавить тебя
  rationale: Хифиль נצל означает вырвать из опасности, избавить или спасти. «Избавить» соответствует пророческому контексту и не сужает смысл до одного конкретного способа спасения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Сила обещания Божьей защиты
  choice: не смогут одолеть тебя
  alternative: не возьмут над тобой верх
  rationale: Фраза обещает, что противники не добьются победы над Иеремией благодаря Божьему присутствию и избавлению, но не устраняет возможность противостояния и страданий.
- issue: Целевое или результативное значение לְהַצִּילֶךָ
  choice: чтобы избавить тебя
  alternative: и избавлю тебя
  rationale: Инфинитив с ל естественно выражает цель Божьего присутствия; перевод сохраняет синтаксическую связь, не превращая её в отдельное обещание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис остаётся ясным для обычного читателя; тире выделяют формулу Божьего изречения. Начальный соединительный ו не передан отдельным «и», поскольку в русском самостоятельный стих естественно начинается без него.
