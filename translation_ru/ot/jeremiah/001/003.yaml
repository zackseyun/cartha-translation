revisions:
- from: Оно продолжало приходить и во дни Иоакима, сына Иосии, царя Иудеи, вплоть до завершения одиннадцатого года правления Седекии, сына Иосии, царя Иудеи[a], — до уведения Иерусалима в изгнание[b] в пятом месяце.
