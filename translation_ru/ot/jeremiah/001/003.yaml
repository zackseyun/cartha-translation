base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/003.yaml
  text: And it continued in the days of Jehoiakim son of Josiah[a], king of Judah, until the completion of the eleventh year of Zedekiah son of Josiah, king of Judah[b], until the exile of Jerusalem in the fifth month.
translation:
  language: ru
  text: Оно приходило и во дни Иоакима, сына Иосии, царя Иудеи, до конца одиннадцатого года правления Седекии, сына Иосии, царя Иудеи, — вплоть до изгнания Иерусалима в пятом месяце.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть до депортации населения Иерусалима в пятом месяце, после падения города.
    reason: 'Поясняет метонимию оригинала: «Иерусалим» обозначает его жителей, уведённых в изгнание.'
lexical_decisions:
- source_word: וַיְהִי
  choice: Оно продолжало приходить
  rationale: Форма возобновляет мысль предыдущего стиха о слове Господа и указывает, что оно приходило к Иеремии и в последующий период. Местоимение «оно» относится к слову Господа; такой перевод естественнее по-русски, чем буквальное «и было», и сохраняет связь со стихом 2.
- source_word: בִּימֵי
  choice: во дни
  rationale: Сохранена обычная библейская временная формула; она понятна современному читателю и уместна в литературном регистре.
- source_word: יְהוֹיָקִים בֶּן־יֹאשִׁיָּהוּ
  choice: Иоакима, сына Иосии
  rationale: Использованы закрепившиеся в русской библейской традиции формы личных имён и прямо передано указание на родство.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Естественная современная русская форма царского титула и названия страны.
- source_word: עַד תֹּם
  choice: вплоть до завершения
  rationale: Передаёт достижение полного временного предела; «завершение» несколько точнее отражает תֹּם, тогда как «конец» дан как допустимая альтернатива в сноске.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה לְצִדְקִיָּהוּ
  choice: одиннадцатого года правления Седекии
  rationale: Префикс לְ в формуле царской датировки раскрыт словом «правления», чтобы выражение было однозначным и естественным по-русски.
- source_word: גְּלוֹת יְרוּשָׁלִַם
  choice: уведения Иерусалима в изгнание
  rationale: Сохранена метонимия оригинала, где Иерусалим обозначает его население, при этом глагольное существительное גְּלוֹת передано как событие насильственного переселения.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: в пятом месяце
  rationale: Прямой перевод древней календарной датировки без подстановки позднейшего названия месяца.
theological_decisions: []
translation_notes:
