    rationale: Глагол может связывать сообщение со «словом Господа» из ст. 2, но не требует выражать длительное или многократное продолжение. Нейтральное «приходило» ближе к исходной неопределённости.
  - severity: low
    issue: «Вплоть до завершения» тяжеловесно для русской царской датировки.
    rationale: «До конца одиннадцатого года» передаёт עַד תֹּם прямо и естественно; альтернативу «до завершения» можно не выносить в сноску, поскольку она не нужна для понимания и не отражает существенной текстовой неоднозначности.
  - severity: low
    issue: Пояснение к метонимии следует связать с датировкой пятого месяца.
    rationale: Так читателю ясно, что речь идёт о депортации населения, последовавшей за падением города, а не о буквальном изгнании самого города.
