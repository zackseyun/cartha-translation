  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יָד֔/וֹ וַ/יַּגַּ֖ע עַל פִּ֑/י וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י הִנֵּ֛ה נָתַ֥תִּי דְבָרַ֖/י בְּ/פִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/009.yaml
  text: Then the LORD stretched out his hand and touched my mouth, and the LORD said to me, “Look, I have put my words in your mouth.”
translation:
  language: ru
  text: 'И простёр ГОСПОДЬ руку Свою, и коснулся моих уст. И сказал мне ГОСПОДЬ: «Вот, Я вложил слова Мои в твои уста».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И простёр
  rationale: Передаёт последовательность повествования и буквальный образ протянутой руки естественным литературным русским языком.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона; написание прописными буквами указывает на личное имя в исходном тексте.
- source_word: וַיִּגַּע עַל־פִּי
  choice: и коснулся моих уст
  rationale: Русское «уст» здесь естественно передаёт פֶּה в возвышенном пророческом контексте; предлог עַל при глаголе прикосновения не требует отдельной передачи.
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-эмфатическую функцию частицы и звучит естественнее в данном русском контексте, чем «смотри».
- source_word: נָתַתִּי דְבָרַי בְּפִיךָ
  choice: Я вложил слова Мои в твои уста
  rationale: «Вложил» ясно выражает идиому помещения слов в уста пророка; множественное «слова» сохраняет форму דְבָרַי.
theological_decisions:
- issue: Характер пророческой речи
  choice: «Я вложил слова Мои в твои уста»
  alternative: «Я дал тебе Мои слова для возвещения»
  rationale: Сохранён телесный образ исходного текста, связывающий Божье прикосновение с наделением пророка словами, без добавочного толкования механизма вдохновения.
- issue: Передача тетраграмматона
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Выбрана укоренённая русская библейская конвенция, при этом прописное написание отличает имя יהוה от обычного титула «Господь».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Инверсия «руку Свою», «слова Мои» и слово «уста» сохраняют достоинство пророческой сцены, оставаясь понятными современному читателю.
