  yaml_path: translation/ot/jeremiah/001/011.yaml
  text: And the word of Yahweh came to me[a], saying, “What do you see, Jeremiah?” And I said, “I see a branch of an almond tree.”
translation:
  language: ru
  text: 'И пришло ко мне слово Яхве: «Что ты видишь, Иеремия?» Я сказал: «Я вижу миндальную ветвь[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прут из миндального дерева» или «миндальный жезл». Еврейское слово может обозначать не только ветвь, но также прут, жезл или посох. В следующем стихе обыгрывается созвучие слов «миндаль» (шаке́д) и «бодрствую» (шоке́д).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: И было ко мне слово Яхве
  rationale: Сохранена устойчивая пророческая формула и повествовательный переход; «слово» точнее передаёт דָּבָר, чем более истолковывающее «весть», а личное имя יהוה передано как «Яхве».
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В современном русском инфинитив «говоря» здесь звучал бы тяжеловесно; его функцию естественно передаёт оформление прямой речи.
- source_word: מָה אַתָּה רֹאֶה
  choice: Что ты видишь
  rationale: Естественный русский эквивалент прямого вопроса с причастной формой רֹאֶה.
- source_word: יִרְמְיָהוּ
  choice: Иеремия
  rationale: Употреблена закрепившаяся в русской библейской традиции форма имени.
- source_word: וָאֹמַר
  choice: Я ответил
  rationale: В контексте ответа на вопрос русский глагол «ответил» естественно передаёт речевую последовательность, не меняя содержания.
- source_word: מַקֵּל שָׁקֵד
  choice: миндальную ветвь
  rationale: מַקֵּל может обозначать ветвь, прут, жезл или посох; в зрительном образе дерева «ветвь» звучит естественно, тогда как примечание сохраняет подлинную лексическую неоднозначность.
- source_word: אֲנִי רֹאֶה
  choice: Я вижу
  rationale: Краткая современная передача ответа; выраженное местоимение естественно сохраняется в русском.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя-тетраграмматон, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Неоднозначность образа מַקֵּל
  choice: ветвь с примечанием об альтернативе
  alternative: прут; жезл; посох
  rationale: Основной текст сохраняет ясный зрительный образ миндального дерева, а примечание не устраняет возможность понимания предмета как прута или жезла и указывает на игру слов следующего стиха.
translation_notes:
  register: Современный литературный русский с сохранением достоинства пророческой речи. Начальная формула слегка приподнята, но понятна; синтаксис прямой речи естественен для современного читателя.
