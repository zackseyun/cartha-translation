source:
  edition: WLC
  text: וְ/דִבַּרְתִּ֤י מִשְׁפָּטַ/י֙ אוֹתָ֔/ם עַ֖ל כָּל רָעָתָ֑/ם אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לְ/מַעֲשֵׂ֥י יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/016.yaml
  text: And I will pronounce my judgments against them for all their evil[a], because they have forsaken me, burned incense to other gods[b], and bowed down to the works of their own hands.
translation:
  language: ru
  text: 'И Я объявлю им Свои приговоры за всё их зло[a]: они оставили Меня, воскуряли благовония другим богам и кланялись изделиям собственных рук[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Я изреку Свои судебные решения против них за всё их зло». Еврейский глагол буквально означает «говорить», но здесь, вероятно, подразумевает официальное оглашение судебного решения.'
    reason: lexical_alternative
  - marker: b
    text: «Изделия собственных рук» — идолы, изготовленные ими самими.
    reason: cultural_note
lexical_decisions:
- source_word: וְדִבַּרְתִּי מִשְׁפָּטַי אוֹתָם
  choice: И Я произнесу над ними Мои приговоры
  rationale: В судебно-пророческом контексте דבר с מִשְׁפָּט обозначает официальное оглашение судебных решений. «Произнесу… приговоры» сохраняет как речевой акт, так и юридическую силу выражения; «над ними» естественно передаёт направленность приговора.
- source_word: עַל כָּל רָעָתָם
  choice: за всё их зло
  rationale: Предлог עַל здесь указывает на основание суда. «Зло» сохраняет широкую нравственную категорию רָעָה, не сужая её до отдельного проступка.
- source_word: אֲשֶׁר עֲזָבוּנִי
  choice: они оставили Меня
  rationale: עזב выражает разрыв отношений и отступление. «Оставили Меня» звучит современно и сохраняет смысл без добавления конфессиональной терминологии; причинная связь передана двоеточием.
- source_word: וַיְקַטְּרוּ לֵאלֹהִים אֲחֵרִים
  choice: воскуряли благовония другим богам
  rationale: Пиэль קטר в данном контексте обозначает культовое сжигание ароматических веществ. «Воскуряли благовония» точно передаёт конкретное действие и остаётся понятным в библейском регистре.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: поклонялись
  rationale: Форма обозначает поклон или простирание ниц как акт почитания. Русское «поклонялись» естественно совмещает телесный жест и очевидный здесь культовый смысл.
- source_word: לְמַעֲשֵׂי יְדֵיהֶם
  choice: делам собственных рук
  rationale: 'Буквальный образ подчёркивает пророческую иронию: люди почитают созданное ими самими. «Собственных» ясно выражает возвратный смысл притяжательного суффикса.'
theological_decisions:
- issue: Характер действия Бога во фразе וְדִבַּרְתִּי מִשְׁפָּטַי
  choice: Бог официально огласит Свои судебные приговоры над народом.
  alternative: Бог лишь выскажет им Свои установления или непосредственно совершит суд без акцента на его словесном оглашении.
  rationale: Сочетание דבר и משפט в пророческом судебном контексте указывает на формальное произнесение решения, однако перевод не исключает последующего исполнения суда.
- issue: Передача идолопоклонства
  choice: 'Сохранены три конкретных обвинения: оставление Бога, воскурение другим богам и поклонение изделиям собственных рук.'
  alternative: Обобщить их выражением «они поклонялись идолам».
  rationale: Перечень в еврейском тексте имеет самостоятельную риторическую и богословскую силу; его обобщение устранило бы конкретность обвинения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Заглавные местоимения в отношении Бога соответствуют принятому русскому библейскому регистру. Синтаксис сохраняет юридическую торжественность первой части и конкретный трёхчастный перечень обвинений.
