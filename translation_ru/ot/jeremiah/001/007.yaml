  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אַל תֹּאמַ֖ר נַ֣עַר אָנֹ֑כִי כִּ֠י עַֽל כָּל אֲשֶׁ֤ר אֶֽשְׁלָחֲ/ךָ֙ תֵּלֵ֔ךְ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר אֲצַוְּ/ךָ֖ תְּדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/007.yaml
  text: But Yahweh said to me[a], “Do not say, ‘I am a youth,’ for to all to whom I send you, you shall go, and all that I command you[b], you shall speak.”
translation:
  language: ru
  text: 'Но Яхве сказал мне: «Не говори: „Я молод“, — потому что ко всем, к кому Я пошлю тебя[a], ты пойдёшь и всё, что Я повелю тебе, скажешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «куда бы Я тебя ни послал». Еврейское выражение может относиться как к людям, к которым послан пророк, так и в более общем смысле — к месту или поручению, куда он послан.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная и естественная передача повествовательной формы глагола אמר; союз передан как «но», поскольку ответ противопоставлен возражению Иеремии в предыдущем стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אַל תֹּאמַר
  choice: не говори
  rationale: Точно и естественно передаёт запрет с אַל.
- source_word: נַעַר אָנֹכִי
  choice: я ещё молод
  rationale: נַעַר обозначает молодого человека и может подразумевать неопытность; русское «я ещё молод» естественно выражает возражение, не устанавливая точного возраста.
- source_word: עַל כָּל אֲשֶׁר אֶשְׁלָחֲךָ
  choice: ко всем, к кому Я пошлю тебя
  rationale: Сохраняет вероятное личное понимание כָּל אֲשֶׁר и направленность поручения, не сводя выражение исключительно к месту назначения.
- source_word: תֵּלֵךְ
  choice: ты пойдёшь
  rationale: Будущее время в русском языке естественно передаёт властное предписание в составе поручения.
- source_word: וְאֵת כָּל אֲשֶׁר אֲצַוְּךָ
  choice: и всё, что Я повелю тебе
  rationale: Сохраняет всеохватность כָּל и повелительную силу צוה.
- source_word: תְּדַבֵּר
  choice: скажешь
  rationale: В данном контексте пророческой передачи конкретно повелённого содержания «скажешь» звучит естественнее, чем более общее «будешь говорить».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Адресаты или места в עַל כָּל אֲשֶׁר אֶשְׁלָחֲךָ
  choice: ко всем, к кому Я пошлю тебя
  alternative: куда бы Я ни послал тебя
  rationale: Основной текст сохраняет личное прочтение выражения, подходящее к пророческому служению; пространственное обобщение возможно, но не обязательно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным синтаксисом. Параллелизм «пойдёшь — скажешь» сохранён; добавочное «ещё» служит естественной русской передачей возрастного возражения, а не усилением смысла до «только лишь».
