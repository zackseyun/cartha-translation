  text: דִּבְרֵ֥י יִרְמְיָ֖הוּ בֶּן חִלְקִיָּ֑הוּ מִן הַ/כֹּֽהֲנִים֙ אֲשֶׁ֣ר בַּ/עֲנָת֔וֹת בְּ/אֶ֖רֶץ בִּנְיָמִֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/001.yaml
  text: The words of Yirmeyahu son of Hilqiyahu[a], one of the priests who were in Anathoth, in the land of Benjamin.
translation:
  language: ru
  text: Слова Иеремии, сына Хелкии, одного из священников, живших в Анафофе, в земле Вениамина.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Слова
  rationale: Форма сопряжённого состояния множественного числа служит заголовком книги; «слова» естественно и без лишнего сужения передаёт широкий смысл דָּבָר.
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Устоявшаяся русская библейская форма имени узнаваема и естественно склоняется в современном литературном русском языке.
- source_word: בֶּן חִלְקִיָּהוּ
  choice: сына Хелкии
  rationale: Стандартная генеалогическая связь; «Хелкия» — узнаваемая русская передача еврейского имени חִלְקִיָּהוּ.
- source_word: מִן הַכֹּהֲנִים
  choice: одного из священников
  rationale: 'Предлог מִן при обозначении группы имеет здесь партитивное значение: Иеремия принадлежал к числу священников.'
- source_word: אֲשֶׁר בַּעֲנָתוֹת
  choice: живших в Анафофе
  rationale: Относительная конструкция указывает местонахождение священников; причастие «живших» делает русскую фразу естественной, не добавляя специального служебного смысла.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: в земле Вениамина
  rationale: Сохраняет территориально-племенной смысл אֶרֶץ и традиционную русскую форму имени Вениамин.
