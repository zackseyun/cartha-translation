lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Ваййиктоль от היה отмечает развитие повествования. Русское «И было» естественно сочетается с устойчивой пророческой формулой «слово … было к кому-либо» и не добавляет отсутствующего в оригинале явного указания времени.
- source_word: דְבַר
  choice: слово
  rationale: В формуле דְבַר יְהוָה это наиболее прозрачная передача, сохраняющая связь с пророческим откровением; «весть» возможно, но менее формально соответствует источнику.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямую форму еврейского текста, не заменяя её титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица единственного числа означает «ко мне»; эта форма также естественна в русской библейской пророческой формуле.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив לֵאמֹר вводит следующую прямую речь. В современном русском его функцию естественно и без смысловой потери передаёт двоеточие; буквальное «говоря» здесь звучало бы тяжеловесно.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. «Яхве» передаёт его как имя; «Господь» заменяет имя титулом, а «Иегова» отражает позднюю гибридную форму произношения.
translation_notes:
  register: Современный литературный русский с сохранением краткой и торжественной пророческой формулы. Двоеточие подготавливает прямую речь следующего стиха; подлежащее «слово Яхве» следует за сказуемым в естественном для этой формулы порядке.
