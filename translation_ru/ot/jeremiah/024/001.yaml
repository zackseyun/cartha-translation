source:
  edition: WLC
  text: הִרְאַ/נִי֮ יְהוָה֒ וְ/הִנֵּ֗ה שְׁנֵי֙ דּוּדָאֵ֣י תְאֵנִ֔ים מוּעָדִ֕ים לִ/פְנֵ֖י הֵיכַ֣ל יְהוָ֑ה אַחֲרֵ֣י הַגְל֣וֹת נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֡ל אֶת יְכָנְיָ֣הוּ בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָה֩ וְ/אֶת שָׂרֵ֨י יְהוּדָ֜ה וְ/אֶת הֶ/חָרָ֤שׁ וְ/אֶת הַ/מַּסְגֵּר֙ מִ/יר֣וּשָׁלִַ֔ם וַ/יְבִאֵ֖/ם בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/001.yaml
  text: Yahweh showed me[a], and behold, two baskets of figs were set before the temple of Yahweh, after Nebuchadrezzar king of Babylon had taken into exile Jeconiah son of Jehoiakim, king of Judah, along with the officials of Judah, the craftsmen, and the smiths from Jerusalem[c][b], and had brought them to Babylon.
translation:
  language: ru
  text: 'Яхве показал мне: вот, перед храмом Яхве были поставлены две корзины инжира. Это было после того, как Навуходоносор[a], царь Вавилона, увёл из Иерусалима в изгнание Иехонию, сына Иоакима, царя Иудеи, вместе с правителями Иудеи[b], ремесленниками и кузнецами[c] и привёл их в Вавилон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит форма имени Невухадреццар; в русском языке этого царя обычно называют Навуходоносором.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «князьями Иудеи».'
    reason: lexical_alternative
  - marker: c
    text: Еврейские слова обозначают группы искусных работников; второе слово можно также перевести как «работники по металлу» или «слесари».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְאַנִי
  choice: показал мне
  rationale: Порода хифиль глагола ראה означает «показать, дать увидеть»; выбран естественный русский оборот, сохраняющий характер откровения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица вводит зримую картину и привлекает к ней внимание; «вот» естественно передаёт эту функцию по-русски.
- source_word: שְׁנֵי דּוּדָאֵי תְאֵנִים
  choice: две корзины инжира
  rationale: דּוּד может обозначать сосуд или корзину; в контексте плодов наиболее естественно «корзины». Современное «инжир» понятнее обычному читателю, чем «смоквы».
- source_word: מוּעָדִים
  choice: были поставлены
  rationale: Страдательное причастие здесь обозначает размещение корзин перед храмом; перевод сохраняет пассивную форму исходного текста.
- source_word: הֵיכַל
  choice: храм
  rationale: В данном контексте слово обозначает храмовое здание.
- source_word: אַחֲרֵי הַגְלוֹת
  choice: после того, как … увёл … в изгнание
  rationale: Оборот выражает предшествующее насильственное переселение и ясно передаёт временную последовательность.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Использована закрепившаяся в русском языке форма имени; отличительная форма еврейского написания отмечена в сноске.
- source_word: יְכָנְיָהוּ
  choice: Иехония
  rationale: Традиционная и узнаваемая русская передача данной формы имени.
- source_word: שָׂרֵי יְהוּדָה
  choice: правители Иудеи
  rationale: שָׂרִים обозначает людей, наделённых властью; «правители» не создаёт ошибочного впечатления, будто речь обязательно идёт о царских сыновьях.
- source_word: הֶחָרָשׁ וְאֶת הַמַּסְגֵּר
  choice: ремесленники и кузнецы
  rationale: Оба существительных употреблены собирательно и обозначают вывезенные группы квалифицированных работников; вероятная ремесленная специализация второго слова передана как «кузнецы», а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Характер увиденного пророком
  choice: '«показал мне: вот» без уточнения, было ли это видением'
  alternative: «Яхве дал мне увидеть видение»
  rationale: Стих не называет увиденное сном или видением; перевод сохраняет эту неопределённость и не добавляет способ откровения.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис разделён на два предложения ради ясности, без изменения временной связи. Все местоименные связи сохранены: вывезенные из Иерусалима люди затем были приведены в Вавилон.'
