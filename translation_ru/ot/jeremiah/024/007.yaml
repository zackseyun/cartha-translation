source:
  edition: WLC
  text: וְ/נָתַתִּי֩ לָ/הֶ֨ם לֵ֜ב לָ/דַ֣עַת אֹתִ֗/י כִּ֚י אֲנִ֣י יְהוָ֔ה וְ/הָיוּ לִ֣/י לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִ֑ים כִּֽי יָשֻׁ֥בוּ אֵלַ֖/י בְּ/כָל לִבָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/007.yaml
  text: And I will give them a heart to know me[a], that I am Yahweh; and they will be my people, and I will be their God[b], for they will return to me with all their heart.
translation:
  language: ru
  text: И Я дам им сердце, чтобы они познали Меня и узнали, что Я — Яхве[a]. Они будут Моим народом, а Я буду их Богом, ибо обратятся ко Мне всем сердцем[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они познали Меня, ибо Я — Яхве».'
    reason: Союз כִּי может вводить содержание знания («что Я — Яхве») или иметь пояснительно-обосновывающий оттенок («ибо Я — Яхве»).
  - marker: b
    text: 'Или: «ибо вернутся ко Мне всем сердцем».'
    reason: Глагол שׁוּב может означать «обратиться» или «вернуться».
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И Я дам
  rationale: Форма совершенного вида с союзом в пророческом обещании передаёт будущее действие; союз сохраняет связь с предыдущим контекстом.
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет древнееврейский образ внутреннего человека, охватывающий разум, волю и устремления, не сводя смысл только к интеллекту.
- source_word: לָדַעַת אֹתִי
  choice: чтобы они знали Меня
  rationale: Инфинитив выражает цель или результат дара; глагол «знать» сохраняет личностный и заветный смысл.
- source_word: כִּי אֲנִי יְהוָה
  choice: что Я Яхве
  rationale: כִּי естественно вводит содержание знания, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: וְהָיוּ לִי לְעָם
  choice: Они будут Моим народом
  rationale: Естественно передаёт первую часть устойчивой формулы завета.
- source_word: וְאָנֹכִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: а Я буду их Богом
  rationale: Сохраняет взаимность формулы завета; противительно-сопоставительное «а» естественно для русского синтаксиса.
- source_word: כִּי יָשֻׁבוּ אֵלַי
  choice: потому что обратятся ко Мне
  rationale: Заключительное כִּי понято причинно; שׁוב в контексте восстановления отношений с Богом означает обращение или возвращение к Нему.
- source_word: בְּכָל לִבָּם
  choice: всем сердцем
  rationale: Это естественное русское соответствие древнееврейской идиоме, обозначающей полноту внутренней преданности.
theological_decisions:
- issue: Формула завета
  choice: «Они будут Моим народом, а Я буду их Богом»
  alternative: Парафраз о принадлежности Богу
  rationale: Сохранение традиционной взаимной формулы передаёт её межтекстовые связи и богословское значение без дополнительных толкований.
- issue: Характер знания Бога
  choice: «знали Меня»
  alternative: «признавали Меня» или «понимали, что Я Яхве»
  rationale: Прямой перевод сохраняет как познавательную, так и личностно-заветную сторону глагола ידע.
- issue: Связь заключительной части стиха
  choice: Причинное «потому что»
  alternative: Пояснительное или утвердительное «ведь»
  rationale: כִּי допускает оттенки основания и пояснения; причинное прочтение хорошо связывает цельное обращение народа с восстановленными отношениями завета, не устраняя возможного пояснительного оттенка.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы. Разбиение на два предложения облегчает чтение, сохраняя последовательность древнееврейского текста; тире обозначает пояснительное содержание знания.
