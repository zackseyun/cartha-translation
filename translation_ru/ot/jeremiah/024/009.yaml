  text: וּ/נְתַתִּי/ם֙ ל/זועה לְ/רָעָ֔ה לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ לְ/חֶרְפָּ֤ה וּ/לְ/מָשָׁל֙ לִ/שְׁנִינָ֣ה וְ/לִ/קְלָלָ֔ה בְּ/כָל הַ/מְּקֹמ֖וֹת אֲשֶֽׁר אַדִּיחֵ֥/ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/009.yaml
  text: I will make them a horror[a], a calamity, to all the kingdoms of the earth—a reproach, a proverb, a taunt[c][b], and a curse in all the places where I drive them.
translation:
  language: ru
  text: Я сделаю их ужасом и бедствием для всех царств земли, предметом поношения, присловьем[b], посмешищем и проклятием во всех местах, куда Я их изгоню[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «поговоркой»; то есть расхожим выражением, повторяемым о них с презрением.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «куда Я их прогоню». Глагол означает принудительно удалить, прогнать или изгнать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: Я сделаю их
  rationale: В сочетании с рядом оборотов с ל глагол נתן выражает приведение к определённому состоянию или положению; «сделаю их» естественно передаёт этот предикативный смысл.
- source_word: לְזַוֲעָה
  choice: ужасом
  rationale: Существительное обозначает то, что вызывает ужас и содрогание; краткая форма сохраняет образ, а более развёрнутый вариант отмечен в сноске.
- source_word: לְרָעָה
  choice: бедствием
  rationale: В контексте суда רעה означает губительное несчастье или бедствие. Такой перевод естественнее буквального «злом» и не приписывает людям нравственную сущность.
- source_word: לְכָל מַמְלְכוֹת הָאָרֶץ
  choice: для всех царств земли
  rationale: Предлог ל указывает на круг народов, перед которыми изгнанники станут ужасом и бедствием; сохранён всеобщий охват выражения.
- source_word: לְחֶרְפָּה
  choice: предметом поношения
  rationale: חרפה означает позор, поругание или поношение; развёрнутая русская формулировка ясно показывает, что поношению подвергнутся они.
- source_word: וּלְמָשָׁל
  choice: притчей
  rationale: משל может обозначать притчу, поговорку или расхожее присловье. «Притчей» сохраняет прямое лексическое соответствие и библейскую весомость, а контекст и сноска передают уничижительный оттенок.
- source_word: לִשְׁנִינָה
  choice: насмешкой
  rationale: Редкое существительное относится к язвительной, повторяемой речи; «насмешкой» передаёт враждебно-издевательский характер без излишней архаики.
- source_word: וְלִקְלָלָה
  choice: проклятием
  rationale: קללה обозначает проклятие; здесь судьба изгнанников становится образцом, упоминаемым в формулах проклятия.
- source_word: בְּכָל הַמְּקֹמוֹת אֲשֶׁר אַדִּיחֵם שָׁם
  choice: во всех местах, куда Я их изгоню
  rationale: Формулировка сохраняет полный пространственный оборот; Hiphil от נדח передаёт принудительное удаление, то есть изгнание.
theological_decisions:
- issue: Характер формулы суда
  choice: 'Сохранить накопительный ряд последствий и положений: ужас, бедствие, поношение, притча, насмешка и проклятие.'
  alternative: Свести ряд к обобщённой фразе о бедствии и позоре среди народов.
  rationale: Повторяющиеся обороты с ל риторически усиливают картину Божьего суда и позора изгнания. Перечень сохраняет напряжённость исходного текста, не добавляя конфессионального толкования.
- issue: Значение רעה применительно к изгнанникам
  choice: Перевести как «бедствием».
  alternative: Перевести как «злом» или «нечем злым».
  rationale: Контекст допускает значение беды или губительного несчастья; «бедствием» сохраняет смысл суда и избегает неоднозначного утверждения, будто сами люди превращаются в нравственное зло.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и накопительный перечень сохранены; архаизмы сведены к минимуму. Заглавная буква в местоимении «Я» обозначает говорящего Бога в непосредственной речи и соответствует принятому русскому библейскому регистру.
