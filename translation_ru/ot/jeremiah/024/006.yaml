  text: וְ/שַׂמְתִּ֨י עֵינִ֤/י עֲלֵי/הֶם֙ לְ/טוֹבָ֔ה וַ/הֲשִׁבֹתִ֖י/ם עַל הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְנִיתִי/ם֙ וְ/לֹ֣א אֶהֱרֹ֔ס וּ/נְטַעְתִּ֖י/ם וְ/לֹ֥א אֶתּֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/006.yaml
  text: I will set my eyes on them for good[a], and I will bring them back to this land. I will build them up and not tear them down[c][b]; I will plant them and not uproot them.
translation:
  language: ru
  text: Я обращу на них Свой благосклонный взор[a] и возвращу их на эту землю[b]. Я буду созидать их, а не разрушать; посажу их и не вырву с корнем[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «положу Мой глаз на них во благо»; также возможно: «обращу на них взор ради их блага».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «восстановлю их на этой земле».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте употреблены две парные метафоры восстановления: «созидать — не разрушать» и «сажать — не вырывать с корнем».'
    reason: cross_reference
lexical_decisions:
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  choice: Я обращу на них Свой благосклонный взор
  rationale: Еврейская идиома буквально говорит о том, что Бог «положит/установит Свой глаз» на них. Русское «обращу ... взор» сохраняет образ направленного Божьего внимания, а «благосклонный» естественно передаёт связь с последующим לְטוֹבָה.
- source_word: לְטוֹבָה
  choice: благосклонный
  rationale: В данном сочетании выражает благую, благоприятную направленность Божьего взора. Это значение включено в формулировку основной строки; более буквальный вариант отмечен в сноске.
- source_word: וַהֲשִׁבֹתִים
  choice: возвращу их
  rationale: Hiphil от שוב с прямым дополнением означает «сделать так, чтобы вернулись», то есть «возвратить». Контекст изгнания и упоминание земли делают пространственный смысл явным.
- source_word: עַל הָאָרֶץ הַזֹּאת
  choice: в эту землю
  rationale: При глаголе возвращения עַל имеет направительное значение. «В эту землю» естественно по-русски и указывает на конкретную землю Иудеи, а не на землю вообще.
- source_word: וּבְנִיתִים
  choice: буду созидать их
  rationale: С личным объектом глагол сохраняет метафору устроения и восстановления народа. «Созидать» звучит естественнее, чем буквальное «строить их», и сохраняет противопоставление разрушению.
- source_word: וְלֹא אֶהֱרֹס
  choice: а не разрушать
  rationale: הרס является смысловым антонимом בנה. «Разрушать» сохраняет строительную метафору и чёткое противопоставление.
- source_word: וּנְטַעְתִּים
  choice: насаждать их
  rationale: Сохранена земледельческая метафора. «Насаждать» в dignified modern literary Russian подходит для метафорического объекта-народа и образует пару с «искоренять».
- source_word: וְלֹא אֶתּוֹשׁ
  choice: а не искоренять
  rationale: נתש означает вырывать растение с корнем. «Искоренять» ясно сохраняет образ и естественно применяется к народу в метафорической речи.
theological_decisions:
- issue: Восстановление в контексте суда, изгнания и заветного спасения
  choice: Передать конкретное обещание благосклонного Божьего внимания и возвращения изгнанников в эту землю, сохранив метафоры созидания и насаждения.
  alternative: Истолковать стих как общее обещание благополучия или исключительно духовного восстановления.
  rationale: Ближайший контекст прямо говорит об изгнанниках и их возвращении в землю. Перевод сохраняет историческую конкретность обещания, не добавляя более поздних конфессиональных толкований.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены оба исходных метафорических ряда; синтаксис сделан плавным и понятным без конфессиональной конкретизации.
