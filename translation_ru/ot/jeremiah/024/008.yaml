  text: וְ/כַ/תְּאֵנִים֙ הָֽ/רָע֔וֹת אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹ֑עַ כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה כֵּ֣ן אֶ֠תֵּן אֶת צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֤ה וְ/אֶת שָׂרָי/ו֙ וְ/אֵ֣ת שְׁאֵרִ֣ית יְרוּשָׁלִַ֗ם הַ/נִּשְׁאָרִים֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/הַ/יֹּשְׁבִ֖ים בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/008.yaml
  text: 'But like the bad figs that cannot be eaten because they are so bad[a], thus says Yahweh: so I will make Zedekiah king of Judah, his officials, the remnant of Jerusalem who remain in this land, and those who dwell in the land of Egypt.'
translation:
  language: ru
  text: А с плохими смоквами, настолько плохими, что их нельзя есть, — так говорит Яхве, — так Я поступлю[a] с Седекией, царём Иудеи, с его вельможами, с остатком жителей Иерусалима, оставшихся в этой земле, и с теми, кто живёт в Египте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «так Я дам Седекию…». В еврейском тексте употреблён глагол «дать»; сравнение с плохими смоквами подразумевает соответствующее обращение с перечисленными людьми.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כַ/תְּאֵנִים הָרָעוֹת
  choice: А с плохими смоквами
  rationale: Союз передаёт переход и контраст с хорошими смоквами предыдущего стиха; конструкция с «с» естественно вводит по-русски последующее «так Я поступлю». «Плохие» соответствует качеству плодов, не привнося прежде времени нравственного значения слова «злые».
- source_word: לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: которые из-за своей негодности несъедобны
  rationale: Передаёт причинный смысл מִן и крайнюю непригодность плодов в естественной современной русской форме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: כֵּן אֶתֵּן
  choice: так Я поступлю[a] с
  rationale: Глагол נתן буквально означает «дать», но здесь в соотнесении с образом плохих смокв указывает на соответствующее обращение с перечисленными людьми. Формулировка сохраняет сравнение и не уточняет содержание суда раньше последующих стихов.
- source_word: שָׂרָיו
  choice: его вельможами
  rationale: В данном царском контексте שׂרים — высокопоставленные правители и придворные; «вельможи» сохраняет торжественный, но понятный регистр.
- source_word: שְׁאֵרִית יְרוּשָׁלִַם הַנִּשְׁאָרִים
  choice: остатком жителей Иерусалима, оставшихся
  rationale: Добавление «жителей» естественно согласует собирательное «остаток» с причастием мужского рода множественного числа и ясно выражает, что речь идёт о людях.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в Египте
  rationale: Естественный русский эквивалент еврейского «в земле Египетской» без потери географического смысла.
theological_decisions:
- issue: Смысл судебной формулы כֵּן אֶתֵּן в сравнении с плохими смоквами
  choice: «так Я поступлю с» с примечанием о буквальном глаголе
  alternative: «так Я отдам» или «так Я сделаю»
  rationale: В еврейском тексте стоит многозначный נתן («дать»), однако без явно выраженного дополнения результата буквальное «отдам Седекию» по-русски звучит незавершённо и может преждевременно определить вид суда. Выбранная формулировка сохраняет соответствие образу плохих смокв, а примечание оставляет читателю доступ к исходной неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Порядок фразы слегка перестроен ради естественной связи образа смокв с формулой «так Я поступлю», при этом повтор «так… так» сохраняет соответствующую структуру оригинала.
