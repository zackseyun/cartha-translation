    issue: Сноска добавляет определённое следствие и меняет субъект действия.
    rationale: Фраза «предадут их суду» не соответствует форме «Я дам» и вносит более конкретное судебное действие, чем выражено в этом стихе. Следует ограничиться буквальным значением глагола и указанием на подразумеваемое уподобление плохим смоквам.
  - severity: low
