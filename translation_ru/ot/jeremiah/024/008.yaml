  terminology: «Яхве», «Седекия», «царь Иудеи», «остаток» и «вельможи» допустимы для современного литературного и пророческого регистра. «Остаток жителей Иерусалима» оправданно разъясняет, что речь идёт о людях. Сноска должна сохранять неоднозначность נתן («дать»), не утверждая конкретный вид суда.
  issues:
