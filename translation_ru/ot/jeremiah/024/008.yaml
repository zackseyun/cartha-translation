  source_fidelity: 'Основная смысловая линия передана верно: противопоставление хорошим смоквам сохранено, Яхве назван по тетраграмматону, перечислены Седекия, его сановники, остаток Иерусалима и живущие в Египте. Однако примечание слишком уверенно конкретизирует подразумеваемое следствие как «предадут их суду» и к тому же меняет лицо и число действия. В самом стихе суд лишь подразумевается образом и раскрывается далее.'
