  to: А с плохими смоквами, настолько плохими, что их нельзя есть, — так говорит Яхве, — так Я поступлю[a] с Седекией, царём Иудеи, с его вельможами, с остатком жителей Иерусалима, оставшихся в этой земле, и с теми, кто живёт в Египте.
