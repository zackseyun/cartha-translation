  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י מָֽה אַתָּ֤ה רֹאֶה֙ יִרְמְיָ֔הוּ וָ/אֹמַ֖ר תְּאֵנִ֑ים הַ/תְּאֵנִ֤ים הַ/טֹּבוֹת֙ טֹב֣וֹת מְאֹ֔ד וְ/הָֽ/רָעוֹת֙ רָע֣וֹת מְאֹ֔ד אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹֽעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/003.yaml
  text: Then Yahweh said to me[a], “What do you see, Jeremiah?” And I said, “Figs—the good figs are very good, and the bad figs are very bad, so bad that they cannot be eaten.”
translation:
  language: ru
  text: 'Тогда Яхве сказал мне: «Что ты видишь, Иеремия?» Я ответил: «Плоды инжира. Хорошие плоды очень хороши, а плохие — очень плохи, настолько, что их невозможно есть[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые невозможно есть из-за их негодности».'
    reason: 'Еврейское מֵרֹעַ допускает более формальную причинную передачу: плоды нельзя есть из-за их плохого состояния.'
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт смену действия.
- source_word: מָה אַתָּה רֹאֶה
  choice: Что ты видишь
  rationale: Естественный русский вопрос в настоящем времени, сохраняющий непосредственность видения.
- source_word: תְּאֵנִים
  choice: плоды инжира
  rationale: Современное и однозначное обозначение множественного числа; позволяет избежать менее обычного «инжиры» и архаичного «смоквы».
- source_word: הַתְּאֵנִים הַטֹּבוֹת טֹבוֹת מְאֹד
  choice: Хорошие плоды очень хороши
  rationale: Сохраняет намеренный повтор прилагательного и усиление מְאֹד.
- source_word: וְהָרָעוֹת רָעוֹת מְאֹד
  choice: а плохие — очень плохи
  rationale: רָעוֹת здесь обозначает качество плодов, а не нравственное зло; пропуск слова «плоды» во второй части естественен по-русски.
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: настолько, что их невозможно есть
  rationale: Передаёт крайнюю степень плохого состояния и результат — несъедобность, не уточняя без достаточных оснований, были ли плоды гнилыми или испорченными иным образом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. «Плоды инжира» выбрано вместо архаичного «смоквы». Повтор «хорошие... очень хороши / плохие... очень плохи» сохранён как выразительная особенность оригинала.
