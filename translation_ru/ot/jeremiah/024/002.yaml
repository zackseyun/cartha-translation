  text: הַ/דּ֣וּד אֶחָ֗ד תְּאֵנִים֙ טֹב֣וֹת מְאֹ֔ד כִּ/תְאֵנֵ֖י הַ/בַּכֻּר֑וֹת וְ/הַ/דּ֣וּד אֶחָ֗ד תְּאֵנִים֙ רָע֣וֹת מְאֹ֔ד אֲשֶׁ֥ר לֹא תֵֽאָכַ֖לְנָה מֵ/רֹֽעַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/002.yaml
  text: One basket had very good figs[a], like first-ripe figs, and one basket had very bad figs[b], which could not be eaten because of their badness.
translation:
  language: ru
  text: В одной корзине были очень хорошие плоды инжира — как первые созревшие плоды[a], а в другой корзине — очень плохие, настолько плохие, что их нельзя было есть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «как ранние плоды инжира» или «как плоды инжира первого урожая».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которые нельзя было есть из-за их негодности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּד
  choice: корзина
  rationale: Хотя существительное может обозначать также горшок или котёл, в данном видении сосуд наполнен плодами инжира; «корзина» естественно соответствует контексту.
- source_word: תְּאֵנִים
  choice: плоды инжира
  rationale: Современное и понятное обозначение названного в еврейском тексте плода; оно точнее для широкой аудитории, чем более традиционное «смоквы».
- source_word: טֹבוֹת מְאֹד
  choice: очень хорошие
  rationale: Передаёт прилагательное с усилителем и сохраняет резкое противопоставление плохим плодам.
- source_word: כִּתְאֵנֵי הַבַּכֻּרוֹת
  choice: как первые созревшие плоды
  rationale: Передаёт сравнение с первыми созревшими за сезон плодами, не добавляя отсутствующей в тексте оценки их ценности.
- source_word: רָעוֹת מְאֹד
  choice: очень плохие
  rationale: Прямо передаёт усиленную отрицательную характеристику и сохраняет параллель с «очень хорошие».
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: настолько плохие, что их нельзя было есть
  rationale: Естественно по-русски выражает следствие и причинный оттенок еврейского מֵרֹעַ, не уточняя, были ли плоды гнилыми или имели иной изъян.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным повествованием. «Плоды инжира» выбрано вместо архаичного «смоквы» ради понятности; повтор во второй половине частично сокращён естественным русским эллипсисом без потери смысла.
