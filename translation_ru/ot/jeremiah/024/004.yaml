lexical_decisions:
- source_word: וַיְהִי
  choice: было
  rationale: В устойчивой пророческой формуле русское «было ко мне слово» сохраняет форму исходного текста и звучит естественно в возвышенном библейском регистре; возможное «пришло» передаёт тот же смысл более динамично.
- source_word: דְבַר
  choice: слово
  rationale: «Слово» сохраняет лексическую преемственность повторяющейся пророческой формулы; «весть» возможно по смыслу, но уже интерпретирует существительное как сообщение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица имеет направительное значение; «ко мне» естественно сочетается с формулой «было слово».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит прямую речь, начинающуюся в следующем стихе. В современном русском эту функцию естественно и без смысловой потери передаёт двоеточие, избегая тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул. «Яхве» является принятой научной реконструкцией произношения; примечание сохраняет сведения о традиционной замене имени.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и узнаваемой пророческой формулы. Двоеточие передаёт функцию לֵאמֹר и связывает стих с последующей прямой речью.
