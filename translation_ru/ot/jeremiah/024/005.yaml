source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/תְּאֵנִ֥ים הַ/טֹּב֖וֹת הָ/אֵ֑לֶּה כֵּֽן אַכִּ֞יר אֶת גָּל֣וּת יְהוּדָ֗ה אֲשֶׁ֨ר שִׁלַּ֜חְתִּי מִן הַ/מָּק֥וֹם הַ/זֶּ֛ה אֶ֥רֶץ כַּשְׂדִּ֖ים לְ/טוֹבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/005.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Like these good figs, so I will regard the exiles of Judah, whom I sent away from this place to the land of the Chaldeans[b], for good.'
translation:
  language: ru
  text: 'Так говорит Господь, Бог Израиля: «Как эти хорошие смоквы, так Я буду благосклонно относиться к изгнанникам Иудеи[a], которых Я выслал отсюда в землю халдеев во благо[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изгнание Иудеи» или «плен Иудеи». Еврейское выражение может обозначать как изгнанных людей, так и само состояние изгнания; здесь последующее «которых Я выслал» указывает прежде всего на людей.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «им во благо». В еврейском тексте сказано буквально «во благо», без явного указания, кому именно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая и естественная для современного русского языка пророческая формула, сохраняющая торжественный регистр.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, понятная широкому читателю и уместная в литературном библейском тексте.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача еврейской сопряжённой конструкции, сохраняющая заветное именование.
- source_word: כַּתְּאֵנִים הַטֹּבוֹת הָאֵלֶּה
  choice: Как эти хорошие смоквы
  rationale: Сохраняет сравнение, указательное значение и связь с видением; «смоквы» — общеупотребительное библейское название плодов инжира.
- source_word: כֵּן
  choice: так
  rationale: Образует естественную русскую парную конструкцию «как… так…» и сохраняет структуру сравнения.
- source_word: אַכִּיר
  choice: буду благосклонно смотреть
  rationale: В данном контексте Hiphil от נכר означает не простое узнавание, а положительное признание и отношение; формулировка связывает изгнанников с хорошими смоквами, не сводя глагол к одному лишь умственному распознаванию.
- source_word: גָּלוּת יְהוּדָה
  choice: изгнанников Иудеи
  rationale: Собирательное существительное допускает значение состояния изгнания, однако последующее «которых Я выслал» указывает прежде всего на изгнанных людей.
- source_word: שִׁלַּחְתִּי
  choice: Я выслал
  rationale: Передаёт удаление из родной земли и прямо сохраняет выраженное в тексте действие Бога, не усиливая его специальным административным термином «депортировал».
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: отсюда
  rationale: Естественная и точная по смыслу русская передача «из этого места» в прямой речи.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: в землю халдеев
  rationale: Сохраняет этногеографическое обозначение исходного текста, не заменяя его толкующим названием «Вавилония».
- source_word: לְטוֹבָה
  choice: во благо
  rationale: Передаёт краткую целевую формулу без добавления отсутствующего в еврейском тексте местоимения; контекст позволяет понимать её как благо для изгнанников.
theological_decisions:
- issue: Референт גָּלוּת יְהוּדָה
  choice: 'Люди: «изгнанники Иудеи»'
  alternative: 'Состояние или событие: «изгнание Иудеи», «плен Иудеи»'
  rationale: Сравнение с хорошими смоквами и относительное предложение «которых Я выслал» естественнее относятся к людям; альтернативная семантическая возможность отмечена в сноске.
- issue: Значение и связь לְטוֹבָה
  choice: «во благо» без названного получателя
  alternative: «им во благо» или «для их блага»
  rationale: Еврейский текст не называет получателя блага явно. Краткая русская формула сохраняет эту недосказанность и не устраняет напряжение между изгнанием как судом и его благой целью.
- issue: Характер действия אַכִּיר
  choice: 'Благосклонное отношение: «буду благосклонно смотреть»'
  alternative: «признаю», «сочту хорошими», «обращу внимание»
  rationale: Контекст хороших смокв требует положительной оценки, однако исходный глагол не следует чрезмерно конкретизировать как формальное объявление изгнанников хорошими.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим регистром. Синтаксическая пара «как… так…» сохраняет форму еврейского сравнения. «Господь» употреблено как традиционная русская передача имени יהוה. Все сноски привязаны к тем выражениям, неоднозначность которых они поясняют.
