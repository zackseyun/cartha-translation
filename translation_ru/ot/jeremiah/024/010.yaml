  yaml_path: translation/ot/jeremiah/024/010.yaml
  text: And I will send against them the sword[a], the famine, and the pestilence, until they are consumed from the land that I gave to them and to their fathers.
translation:
  language: ru
  text: И Я пошлю на них меч, голод и мор[a], пока они не исчезнут с земли, которую Я дал им и их отцам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моровую язву»; еврейское слово обозначает губительную эпидемическую болезнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי בָם
  choice: И пошлю на них
  rationale: Пиэль глагола שׁלח с בְּ при орудиях суда выражает враждебно направленное действие; «пошлю на них» естественно передаёт и направление, и Божье действие.
- source_word: הַחֶרֶב
  choice: меч
  rationale: Сохранён конкретный образ меча, который в пророческой формуле также служит метонимией войны и насильственной смерти.
- source_word: הָרָעָב
  choice: голод
  rationale: В контексте суда רָעָב означает массовый голод; русское «голод» естественно и сохраняет традиционную трёхчастную формулу.
- source_word: הַדָּבֶר
  choice: мор
  rationale: דֶּבֶר обозначает губительную эпидемическую болезнь. «Мор» кратко и точно сохраняет торжественную пророческую триаду; возможное более общее пояснение дано в сноске.
- source_word: עַד תֻּמָּם
  choice: пока они не исчезнут
  rationale: Форма от תמם выражает доведение до конца, полное прекращение существования. В данном контексте «не исчезнут» ясно передаёт результат, не уточняя сверх текста способ гибели каждого человека.
- source_word: מֵעַל הָאֲדָמָה
  choice: с земли
  rationale: מֵעַל буквально выражает удаление «с поверхности», а אֲדָמָה здесь обозначает дарованную территорию; по-русски «с земли» передаёт обе стороны выражения естественно.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם וְלַאֲבוֹתֵיהֶם
  choice: которую Я дал им и их отцам
  rationale: «Отцам» сохраняет историческую и заветную конкретность אָבוֹת, не обобщая её до нейтрального «предков».
theological_decisions:
- issue: Заветный язык дарования земли
  choice: земли, которую Я дал им и их отцам
  alternative: земли, которую Я дал им и их предкам
  rationale: Формулировка сохраняет связь нынешнего поколения с отцами Израиля и не устраняет заветно-историческую окраску еврейского текста.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис прост и доступен; традиционная формула «меч, голод и мор» сохранена без архаизации остальной фразы.
