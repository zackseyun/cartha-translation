  text: וְ/אֶֽל יִרְמְיָ֖הוּ הָיָ֣ה דְבַר יְהוָ֑ה בִּֽ/הְיֹת֣/וֹ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/015.yaml
  text: The word of Yahweh had come to Jeremiah while he was confined in the court of the guard[a], saying,
translation:
  language: ru
  text: 'А к Иеремии пришло слово Яхве, когда он находился под стражей во дворе стражи[a], со словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда он был заключён во дворе стражи».'
    reason: 'Лексическая альтернатива: עָצוּר может быть передано более буквально как «заключён», тогда как «под стражей» не уточняет степень и юридический характер ограничения свободы.'
lexical_decisions:
- source_word: וְ/אֶל יִרְמְיָהוּ
  choice: А к Иеремии
  rationale: 'Союз וְ передаёт переход к дополнительному эпизоду, а אֶל сохраняет направленность: слово было обращено к Иеремии. Русское «А к Иеремии» естественно связывает этот ретроспективный эпизод с контекстом.'
- source_word: הָיָה דְבַר יְהוָה
  choice: пришло слово Яхве
  rationale: Сохранена устойчивая пророческая формула; הָיָה в сочетании со «словом» естественно передаётся глаголом «пришло». Русская форма не маркирует плюсквамперфект грамматически, но временная отнесённость раскрывается придаточным и контекстом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, представленное тетраграмматоном, а не заменено титулом.
- source_word: בִּֽ/הְיֹת֣/וֹ עָצוּר
  choice: когда он находился под стражей
  rationale: Оборот с инфинитивом задаёт временное обстоятельство, а עָצוּר указывает на ограничение свободы. «Находился под стражей» естественно для современного русского и не уточняет форму заключения сверх текста.
- source_word: בַּ/חֲצַר הַ/מַּטָּרָה
  choice: во дворе стражи
  rationale: חָצֵר означает двор, а מַטָּרָה здесь обозначает место или службу стражи; формула сохраняет связь с известным в книге местом содержания Иеремии.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: Инфинитив «сказать» вводит следующую прямую речь. В современном русском двоеточие выполняет эту функцию естественнее буквального «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Формула דְבַר יְהוָה
  choice: слово Яхве
  alternative: весть Яхве
  rationale: «Слово» сохраняет устойчивую пророческую формулу и её богословскую насыщенность, не сводя её лишь к передаче информации.
- issue: Временная отнесённость הָיָה
  choice: пришло
  alternative: уже приходило
  rationale: Контекст допускает ретроспективное понимание, отражённое английским pluperfect, однако еврейская форма сама по себе не требует явного «уже». Простое русское прошедшее сохраняет контекстуальную открытость.
translation_notes:
  register: Современный литературный русский с достоинством пророческого повествования. Начальное «А» сохраняет присоединительно-контрастный переход וְ без искусственного временного «теперь». Повтор «под стражей во дворе стражи» близок терминологии оригинала, хотя слегка тяжеловесен; он удержан ради точности и узнаваемости места.
