  edition: WLC
  text: כִּ֤י מַלֵּט֙ אֲמַלֶּטְ/ךָ֔ וּ/בַ/חֶ֖רֶב לֹ֣א תִפֹּ֑ל וְ/הָיְתָ֨ה לְ/ךָ֤ נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל כִּֽי בָטַ֥חְתָּ בִּ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/018.yaml
  text: For I will surely rescue you[a], and you will not fall by the sword. Your life will be yours as plunder, because you have trusted in me[b], declares Yahweh.
translation:
  language: ru
  text: Ибо Я непременно избавлю тебя[a], и ты не падёшь от меча. Жизнь твоя достанется тебе как добыча[b], потому что ты положился на Меня, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте обещание усилено сочетанием абсолютного инфинитива с личной формой того же глагола; возможный перевод: «Я непременно спасу тебя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твоя жизнь будет тебе добычей». Это военный образ, означающий, что человек спасётся и сохранит жизнь.'
    reason: cultural_note
lexical_decisions:
- source_word: מַלֵּט אֲמַלֶּטְךָ
  choice: непременно избавлю тебя
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает обещание. «Непременно избавлю» естественно передаёт это усиление и в данном контексте обозначает физическое спасение от опасности.
- source_word: וּבַחֶרֶב לֹא תִפֹּל
  choice: и ты не падёшь от меча
  rationale: 'Сохранён военный образ исходного текста: глагол נפל буквально означает «пасть», а в таком контексте — погибнуть от оружия.'
- source_word: וְהָיְתָה לְךָ נַפְשְׁךָ לְשָׁלָל
  choice: Жизнь твоя достанется тебе как добыча
  rationale: 'Сохранена характерная для Иеремии военная метафора: человек унесёт с собой собственную жизнь, словно единственную добычу.'
- source_word: נַפְשְׁךָ
  choice: жизнь твоя
  rationale: В контексте избавления от гибели נֶפֶשׁ означает жизнь человека, а не специально его нематериальную душу.
- source_word: לְשָׁלָל
  choice: как добыча
  rationale: «Добыча» ясно и естественно сохраняет образ того, что уносится с войны.
- source_word: כִּי בָטַחְתָּ בִּי
  choice: потому что ты положился на Меня
  rationale: Глагол בטח выражает доверие как опору и упование; «положился на Меня» естественно передаёт эту направленность доверия.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: «Возвещает» передаёт торжественную пророческую формулу נְאֻם, а личное имя יְהוָה передано как «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя Бога, не заменяя его титулом.
- issue: Значение נֶפֶשׁ в выражении о добыче
  choice: жизнь
  alternative: душа
  rationale: Непосредственный контекст говорит о физическом избавлении от меча. Перевод «жизнь» не вносит в стих отсутствующего здесь антропологического разграничения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены военный образ «пасть от меча» и метафора жизни как добычи; синтаксис сделан ясным для обычного современного читателя.
