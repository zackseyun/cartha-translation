base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/014.yaml
  text: So they sent and took Jeremiah from the court of the guard, and they entrusted him to Gedaliah son of Ahikam, son of Shaphan, to bring him home. So he lived among the people.
translation:
  language: ru
  text: И послали за Иеремией, забрали его со двора стражи и передали Гедалии, сыну Ахикама, сына Шафана, чтобы тот отвёл его в дом[a]. И Иеремия жил среди народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вывести его в дом»; чей именно дом имеется в виду, в еврейском тексте не уточняется.'
    reason: Сохраняет лексическую и референциальную неоднозначность выражения אֶל הַבָּיִת.
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְחוּ
  choice: послали за Иеремией, забрали его
  rationale: Естественно передаёт последовательность «послали — взяли», не добавляя в текст не названного субъекта действий.
- source_word: חֲצַר הַמַּטָּרָה
  choice: двор стражи
  rationale: Устойчивое и понятное обозначение охраняемого двора, где содержался Иеремия.
- source_word: וַיִּתְּנוּ אֹתוֹ אֶל גְּדַלְיָהוּ
  choice: передали Гедалии
  rationale: В данном контексте נתן אל означает передачу человека под чью-либо ответственность, а не просто физическое «дали».
- source_word: לְהוֹצִאֵהוּ אֶל הַבָּיִת
  choice: чтобы тот отвёл его домой
  rationale: Передаёт движение из места заключения к дому; местоимение «тот» ясно связывает действие с Гедалией, хотя принадлежность дома в еврейском тексте прямо не указана.
- source_word: וַיֵּשֶׁב בְּתוֹךְ הָעָם
  choice: И Иеремия жил среди народа
  rationale: Явно называет подразумеваемого субъекта и сохраняет смысл пребывания в среде оставшегося населения.
theological_decisions:
- issue: Чей дом обозначен словом הַבָּיִת
  choice: домой с примечанием о буквальном выражении
  alternative: в дом
  rationale: Контекст указывает на освобождение Иеремии для обычной жизни, но еврейский текст не уточняет, был ли это его собственный дом, дом Гедалии или «дом» в общем смысле; примечание сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; повествование лаконичное и достойное. Синтаксис упрощён для ясности без устранения подлинной неоднозначности исходного текста.
