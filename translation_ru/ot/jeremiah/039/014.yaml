  source_fidelity: 'Основной смысл передан точно: Иеремию забирают из двора стражи, передают Гедалии, сыну Ахикама, сына Шафана, чтобы тот вывел его в дом; затем Иеремия живёт среди народа. Однако «домой» необоснованно конкретизирует אֶל־הַבָּיִת как возвращение в собственный дом, тогда как принадлежность и точный референт дома в еврейском тексте не названы. Английское audit-trail чтение «home» отражает редакционное решение, но не должно устранять эту неоднозначность в русском переводе.'
