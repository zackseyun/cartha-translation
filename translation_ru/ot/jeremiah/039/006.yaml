base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/006.yaml
  text: The king of Babylon slaughtered the sons of Zedekiah at Riblah before his eyes[a], and the king of Babylon slaughtered all the nobles of Judah.
translation:
  language: ru
  text: Царь Вавилона зарезал сыновей Седекии в Ривле на глазах у Седекии; царь Вавилона зарезал всех знатных людей Иудеи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех сановников Иудеи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט / שָׁחַט
  choice: зарезал
  rationale: Глагол обозначает заклание или жестокое умерщвление; «зарезал» сохраняет конкретность и жестокость сцены лучше, чем нейтральное «убил».
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Прямо передаёт сочетание существительных. Во второй части подлежащее естественно не повторяется по-русски, хотя повтор глагола сохраняет риторическую связь.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: сыновей Седекии
  rationale: בְּנֵי здесь прямо указывает на сыновей мужского пола.
- source_word: בְּרִבְלָה
  choice: в Ривле
  rationale: Обычная русская передача местонахождения с предлогом בְּ и традиционной формой топонима.
- source_word: לְעֵינָיו
  choice: у него на глазах
  rationale: Естественная и яркая русская идиома, показывающая, что Седекия был вынужден видеть казнь.
- source_word: כָּל
  choice: всех
  rationale: Соответствует собирательному охвату всей названной группы.
- source_word: חֹרֵי יְהוּדָה
  choice: знатных людей Иудеи
  rationale: Передаёт социально-политический статус חֹרִים и звучит понятнее современному читателю, чем субстантивированное «знатных».
- source_word: יְהוּדָה
  choice: Иудея
  rationale: Стандартное русское название территории и политического образования.
