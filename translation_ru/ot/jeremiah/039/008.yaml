  text: וְ/אֶת בֵּ֤ית הַ/מֶּ֨לֶךְ֙ וְ/אֶת בֵּ֣ית הָ/עָ֔ם שָׂרְפ֥וּ הַ/כַּשְׂדִּ֖ים בָּ/אֵ֑שׁ וְ/אֶת חֹמ֥וֹת יְרוּשָׁלִַ֖ם נָתָֽצוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/008.yaml
  text: The Chaldeans burned the king’s house and the houses of the people with fire[b][a], and they tore down the walls of Jerusalem.
translation:
  language: ru
  text: Халдеи[b] сожгли огнём царский дом[a] и дома жителей, а стены Иерусалима разрушили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царский дворец».'
    reason: lexical_alternative
  - marker: b
    text: То есть вавилонские войска.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дом
  rationale: Буквально «дом царя»; в данном контексте выражение может обозначать дворец. Вариант «царский дом» сохраняет образ исходного текста и остаётся понятным по-русски, а возможное значение поясняется в сноске.
- source_word: בֵּית הָעָם
  choice: дома жителей
  rationale: Единственное число при собирательном существительном здесь естественно понимать дистрибутивно — как жилища населения. «Дома жителей» передаёт этот смысл современно и не добавляет отсутствующего в еврейском тексте социального разграничения.
- source_word: שָׂרְפוּ
  choice: сожгли
  rationale: Прямое и естественное соответствие глаголу со значением «жечь, сжигать»; не усиливает значение до обязательного полного уничтожения.
- source_word: הַכַּשְׂדִּים
  choice: Халдеи
  rationale: Сохраняется буквальное этническое наименование исходного текста; в контексте имеются в виду вавилонские войска, что поясняется в сноске.
- source_word: בָּאֵשׁ
  choice: огнём
  rationale: Предлог ב здесь обозначает средство действия. Творительный падеж передаёт «огнём» кратко и близко к еврейской конструкции.
- source_word: חֹמוֹת יְרוּשָׁלִַם
  choice: стены Иерусалима
  rationale: Прямо и естественно передаёт сопряжённую конструкцию.
- source_word: נָתָצוּ
  choice: разрушили
  rationale: Глагол обозначает разрушение или снос сооружения. «Разрушили» ясно и естественно описывает действие над городскими стенами.
theological_decisions: []
translation_notes:
  register: Современная литературная русская повествовательная речь с умеренно библейской торжественностью. Синтаксис краток и ясен; союз «а» естественно отделяет разрушение стен от сожжения зданий.
