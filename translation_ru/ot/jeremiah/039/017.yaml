  text: וְ/הִצַּלְתִּ֥י/ךָ בַ/יּוֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ בְּ/יַ֣ד הָֽ/אֲנָשִׁ֔ים אֲשֶׁר אַתָּ֥ה יָג֖וֹר מִ/פְּנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/017.yaml
  text: But I will deliver you on that day[a], declares Yahweh[b], and you will not be given into the hand of the men of whom you are afraid.
translation:
  language: ru
  text: Но в тот день Я избавлю тебя[a], — возвещает Яхве, — и ты не будешь отдан в руки[b] тех людей, которых боишься.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасу тебя» либо «вырву тебя из опасности». Древнееврейский глагол означает избавление от грозящей беды.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в руку». Это древнееврейский образ, означающий оказаться под чьей-либо властью.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  choice: Но Я избавлю тебя
  rationale: Порода hифиль глагола נצל означает избавление или спасение от опасности. «Избавлю» сохраняет конкретный смысл и не придаёт выражению излишне отвлечённого богословского оттенка. Союз ו передан как «но» в соответствии с противопоставлением в контексте.
- source_word: בַיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача обычного древнееврейского обстоятельства времени.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана торжественно, но понятно современному читателю; «возвещает» отличает её от обычного глагола речи.
- source_word: וְלֹא תִנָּתֵן
  choice: и ты не будешь отдан
  rationale: Страдательная форма глагола נתן непосредственно означает «быть отданным»; последующее выражение уточняет, что речь идёт о попадании под чужую власть.
- source_word: בְּיַד
  choice: в руки
  rationale: Древнееврейская идиома буквально говорит о «руке» и обозначает власть или контроль. Русское «отдать в руки» естественно сохраняет исходный образ.
- source_word: הָאֲנָשִׁים
  choice: тех людей
  rationale: Определённая форма указывает на конкретных людей, известных из контекста. Русское «людей» здесь естественнее, чем гендерно маркированное «мужчин», несущественное для смысла.
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  choice: которых боишься
  rationale: Глагол גור с מִפְּנֵי выражает страх или ужас перед кем-либо. Краткая формулировка естественна по-русски и не ослабляет смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом, не вводя дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Прямая речь оформлена ясными вставными тире; исходная образность сохранена там, где она естественна по-русски.
