  text: בַּ/שָּׁנָ֣ה הַ֠/תְּשִׁעִית לְ/צִדְקִיָּ֨הוּ מֶלֶךְ יְהוּדָ֜ה בַּ/חֹ֣דֶשׁ הָ/עֲשִׂרִ֗י בָּ֠א נְבוּכַדְרֶאצַּ֨ר מֶֽלֶךְ בָּבֶ֤ל וְ/כָל חֵיל/וֹ֙ אֶל יְר֣וּשָׁלִַ֔ם וַ/יָּצֻ֖רוּ עָלֶֽי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/001.yaml
  text: In the ninth year of Zedekiah king of Judah[a], in the tenth month, Nebuchadnezzar king of Babylon came to Jerusalem with all his army, and they laid siege to it.
translation:
  language: ru
  text: В девятый год царствования Седекии, царя Иудеи, в десятый месяц, Навуходоносор, царь Вавилона, пришёл к Иерусалиму со всем своим войском, и они осадили город.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשָּׁנָה הַתְּשִׁעִית לְצִדְקִיָּהוּ
  choice: В девятый год царствования Седекии
  rationale: Предлог לְ при указании года правления передан естественной русской формулой «год царствования»; это проясняет способ датировки, не добавляя новой исторической информации.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Сопряжённая конструкция передана обычным русским царским титулом.
- source_word: בַּחֹדֶשׁ הָעֲשִׂרִי
  choice: в десятый месяц
  rationale: Сохранена древняя календарная формула без подстановки названия месяца, которого в тексте нет.
- source_word: בָּא
  choice: пришёл
  rationale: Базовое значение глагола בוא сохранено; более конкретное «выступил» или «подошёл» излишне уточняло бы характер движения.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Использована закрепившаяся в русском языке и легко узнаваемая форма имени; древнееврейское написание в данном стихе отражает вариант имени, не требующий отдельной русской формы.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Сопряжённая конструкция прямо и естественно передана по-русски.
- source_word: וְכָל חֵילוֹ
  choice: со всем своим войском
  rationale: В военном контексте חַיִל означает войско; союз передан как сопровождение, естественное для русского синтаксиса.
- source_word: אֶל יְרוּשָׁלִַם
  choice: к Иерусалиму
  rationale: Сохранено основное направительное значение אֶל; враждебная цель ясно выражена следующим глаголом.
- source_word: וַיָּצֻרוּ עָלֶיהָ
  choice: и они осадили город
  rationale: Глагол צור в данном контексте означает осаду. Местоименное «его» по-русски могло бы формально соотноситься с ближайшим существительным «войско», поэтому референт «Иерусалим» естественно обозначен словом «город».
