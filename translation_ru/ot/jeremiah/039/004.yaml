base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/004.yaml
  text: And when Zedekiah king of Judah and all the men of war saw them[a], they fled and went out by night from the city by way of the king’s garden, through the gate between the two walls[b]; and he went out by way of the Arabah.
translation:
  language: ru
  text: Когда Седекия, царь Иудеи, и все воины увидели их, они бежали и ночью вышли из города по дороге у царского сада, через ворота между двумя стенами; а он вышел[a] по дороге к Араве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь стоит форма единственного числа: «он вышел»; в некоторых переводах её заменяют множественным числом в соответствии с предыдущими глаголами.'
    reason: textual_variant
  - marker: b
    text: 'Или: «к равнине», «к Иорданской долине».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָם
  choice: увидели их
  rationale: Суффикс 3-го лица мужского рода множественного числа передан явным дополнением «их»; по контексту речь идёт о ранее упомянутых вавилонских силах.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: воины
  rationale: Современное и естественное обозначение людей, участвующих в бою; оно сохраняет военный смысл еврейского сочетания без архаичного буквального оборота.
- source_word: וַיִּבְרְחוּ
  choice: они бежали
  rationale: Кратко и точно передаёт ברח в повествовательном контексте.
- source_word: וַיֵּצְאוּ לַיְלָה
  choice: ночью вышли
  rationale: Естественно передаёт обстоятельство времени и сохраняет глагол движения исходного текста.
- source_word: דֶּרֶךְ גַּן הַמֶּלֶךְ
  choice: через царский сад
  rationale: В данном описании бегства דֶּרֶךְ обозначает маршрут; русское «через» ясно и естественно выражает движение этим путём, не перегружая фразу.
- source_word: בְּשַׁעַר בֵּין הַחֹמֹתָיִם
  choice: через ворота между двумя стенами
  rationale: Двойственное число חֹמֹתַיִם явно передано словами «двумя стенами», а предлог «через» соответствует движению из города.
- source_word: וַיֵּצֵא
  choice: а он вышел
  rationale: Сохранено единственное число масоретского текста, хотя перед этим употреблены глаголы во множественном числе; союз «а» делает смену числа заметной, не объясняя её в самом тексте.
- source_word: הָעֲרָבָה
  choice: Арава
  rationale: Топонимическая передача сохраняет вероятное обозначение географической области и не сводит его к общему слову «равнина».
