  text: וּ/מִן הָ/עָ֣ם הַ/דַּלִּ֗ים אֲשֶׁ֤ר אֵין לָ/הֶם֙ מְא֔וּמָה הִשְׁאִ֛יר נְבוּזַרְאֲדָ֥ן רַב טַבָּחִ֖ים בְּ/אֶ֣רֶץ יְהוּדָ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם כְּרָמִ֥ים וִֽ/יגֵבִ֖ים בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/010.yaml
  text: But Nebuzaradan the captain of the guard left some of the poorest of the people[a], who had nothing, in the land of Judah, and on that day he gave them vineyards and fields.
translation:
  language: ru
  text: Но некоторых бедняков из народа, у которых ничего не было, Навузардан, начальник стражи, оставил в земле Иудеи и в тот день дал им виноградники и поля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последнее еврейское слово неясно; возможно также: «водоёмы» или «виноградные давильни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הָעָם הַדַּלִּים
  choice: Но некоторых бедняков из народа
  rationale: Предлог מִן передаёт значение части целого («некоторых из»), а союз уместно выражает контраст с предшествующим рассказом. Слово דַּלִּים обозначает неимущих, социально слабых людей.
- source_word: אֲשֶׁר אֵין לָהֶם מְאוּמָה
  choice: у которых ничего не было
  rationale: Естественная русская формулировка сохраняет подчёркнутое полное отсутствие имущества.
- source_word: הִשְׁאִיר
  choice: оставил
  rationale: Каузативная форма глагола שׁאר здесь означает, что этих людей оставили жить на прежнем месте.
- source_word: נְבוּזַרְאֲדָן
  choice: Навузардан
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Контекстуально это официальный вавилонский титул. Такой перевод естественен по-русски и не сужает значение до «начальника палачей».
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: в земле Иудеи
  rationale: Сохранено территориальное значение слова אֶרֶץ, а не только название области.
- source_word: כְּרָמִים
  choice: виноградники
  rationale: Прямое и однозначное соответствие еврейскому слову.
- source_word: וִיגֵבִים
  choice: поля
  rationale: Значение редкого еврейского слова неясно. В контексте раздачи сельскохозяйственных владений «поля» даёт связный смысл, а другие реальные возможности отмечены в сноске.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная современная передача обычного еврейского обозначения времени.
