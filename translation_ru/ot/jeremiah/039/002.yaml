  text: In the eleventh year of Zedekiah[a], in the fourth month, on the ninth day of the month, the city was breached.
translation:
  language: ru
  text: В одиннадцатый год правления Седекии, в четвёртый месяц, в девятый день месяца в городской стене была пробита брешь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/עַשְׁתֵּי עֶשְׂרֵה שָׁנָה לְ/צִדְקִיָּהוּ
  choice: в одиннадцатый год правления Седекии
  rationale: Предлог ב задаёт время, а ל при имени царя относит порядковый год к его царствованию. Слово «правления» естественно раскрывает подразумеваемую в еврейской формуле мысль.
- source_word: בַּ/חֹדֶשׁ הָ/רְבִיעִי
  choice: в четвёртый месяц
  rationale: Сохранена древнееврейская нумерация месяцев без замены современным календарным названием.
- source_word: בְּ/תִשְׁעָה לַ/חֹדֶשׁ
  choice: в девятый день месяца
  rationale: Слово «день» подразумевается еврейской конструкцией и добавлено по нормам современного русского языка.
- source_word: הָבְקְעָה הָ/עִיר
  choice: в городской стене был пробит пролом
  rationale: Нифаль глагола בקע обозначает военный прорыв. В еврейском тексте буквально сказано, что был прорван «город», то есть его укрепления; русская формулировка естественно передаёт эту метонимию и не сводит событие просто к захвату города.
