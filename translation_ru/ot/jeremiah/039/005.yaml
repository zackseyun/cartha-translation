  text: וַ/יִּרְדְּפ֨וּ חֵיל כַּשְׂדִּ֜ים אַחֲרֵי/הֶ֗ם וַ/יַּשִּׂ֣גוּ אֶת צִדְקִיָּהוּ֮ בְּ/עַֽרְב֣וֹת יְרֵחוֹ֒ וַ/יִּקְח֣וּ אֹת֗/וֹ וַֽ֠/יַּעֲלֻ/הוּ אֶל נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל רִבְלָ֖תָ/ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יְדַבֵּ֥ר אִתּ֖/וֹ מִשְׁפָּטִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/005.yaml
  text: But the army of the Chaldeans pursued them and overtook Zedekiah in the plains of Jericho. They seized him and brought him up to Nebuchadnezzar king of Babylon at Riblah[a], in the land of Hamath, and he passed sentence on him.
translation:
  language: ru
  text: Но войско халдеев погналось за ними и настигло Седекию на равнинах Иерихона. Они схватили его и отвели к Навуходоносору[a], царю Вавилона, в Ривлу, что в земле Емаф, и тот вынес Седекии приговор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте имя имеет форму «Невухадреццар»; в основном тексте употреблена привычная русская форма «Навуходоносор».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: войско халдеев
  rationale: «Войско» естественно передаёт военное значение חֵיל, а «халдеи» сохраняет этнополитическое обозначение исходного текста, не заменяя его контекстуальным «вавилоняне».
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵיהֶם
  choice: погналось за ними
  rationale: Передаёт преследование беглецов естественным современным русским выражением и сохраняет динамику повествования.
- source_word: וַיַּשִּׂגוּ
  choice: настигло
  rationale: Точно выражает достижение преследуемого в ходе погони.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: на равнинах Иерихона
  rationale: עֲרָבוֹת обозначает равнинную, степную местность; «равнины» понятно широкому читателю и не вносит лишней технической окраски.
- source_word: וַיִּקְחוּ אֹתוֹ
  choice: они схватили его
  rationale: Хотя לקח буквально означает «взять», в контексте военного захвата «схватили» естественно передаёт принудительный характер действия.
- source_word: וַיַּעֲלֻהוּ אֶל
  choice: отвели к
  rationale: Русское «отвели к» естественно описывает доставление пленника к царю; буквальная направительная семантика «подняли/повели вверх» здесь по-русски звучала бы неясно.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Использована закрепившаяся и узнаваемая русская форма имени; более близкая к еврейскому написанию форма отмечена в сноске.
- source_word: רִבְלָתָה
  choice: в Ривлу
  rationale: Традиционная русская передача топонима; направительно-местный суффикс еврейского слова естественно выражен русским предлогом и винительным падежом.
- source_word: בְּאֶרֶץ חֲמָת
  choice: что в земле Емаф
  rationale: Сохраняет географическое обозначение אֶרֶץ и традиционную русскую форму названия Емаф, при этом ясно связывает уточнение с Ривлой.
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: и тот вынес Седекии приговор
  rationale: 'Еврейская правовая идиома буквально говорит о «судебных решениях»; в данном контексте естественное русское соответствие — «вынес приговор». Имя повторено вместо двусмысленного местоимения, чтобы было ясно: Навуходоносор судит Седекию.'
