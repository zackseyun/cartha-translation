base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/009.yaml
  text: As for the rest of the people who remained in the city[a], and the deserters who had gone over to him, together with the rest of the people who remained, Nebuzaradan, the captain of the guard[c][b], carried away to Babylon.
translation:
  language: ru
  text: А остальных людей, оставшихся в городе, и перебежчиков, перешедших к нему,[a] и остальных людей, оставшихся,[b] Невузарадан, начальник стражи,[c] увёл в Вавилон в изгнание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «падавших, которые пали к нему». Это военное выражение означает переход на сторону противника.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте повторяется выражение «остальные люди, оставшиеся»; повтор сохранён.
    reason: lexical_alternative
  - marker: c
    text: «Начальник стражи» — вавилонский придворно-военный титул; буквально он связан со словом «забойщики» или «слaughterers».
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: остальных жителей, которые оставались в городе
  rationale: Передаёт значение остатка народа и причастия от שׁאר, не уточняя без необходимости, что речь именно о выживших. «Жители» естественно выражает הָעָם в сочетании с «в городе».
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עָלָיו
  choice: перебежчиков, перешедших к нему
  rationale: Военно-политическая идиома נפל על означает переход на сторону правителя или войска. Формулировка сохраняет повтор корня посредством близких по смыслу слов и оставляет местоимение «к нему» без уточнения референта.
- source_word: וְאֵת יֶתֶר הָעָם הַנִּשְׁאָרִים
  choice: и прочих оставшихся из народа
  rationale: Сохраняет присутствующее в еврейском тексте повторное упоминание остатка народа, но выражает его естественно по-русски.
- source_word: הֶגְלָה
  choice: увёл в плен
  rationale: Hiphil от גלה обозначает принудительное переселение в изгнание. «Увёл в плен» естественно в повествовательном контексте и вместе с направлением «в Вавилон» ясно передаёт депортацию.
- source_word: נְבוּזַר אֲדָן
  choice: Невузарадан
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Это вавилонский придворно-военный титул; буквальная связь со «слугами/исполнителями казней» могла бы создать ложное впечатление о функции должности.
- source_word: בָּבֶל
  choice: Вавилон
  rationale: Устоявшееся русское название города и державы; здесь после глагола движения естественно «в Вавилон».
theological_decisions:
- issue: Референт местоимения עָלָיו («к нему»)
  choice: Сохранено «к нему» без пояснения в основном тексте
  alternative: «к вавилонянам» или «к царю Вавилона»
  rationale: Еврейский текст содержит местоимение мужского рода единственного числа, а явное уточнение референта внесло бы толкование, которого нет в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет длинное перечисление и повтор оригинала, но остаётся понятным обычному читателю. Все примечания отмечены в основном тексте.
