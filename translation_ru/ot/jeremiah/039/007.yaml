  text: He blinded Zedekiah’s eyes and bound him with bronze shackles to bring him to Babylon[a].
translation:
  language: ru
  text: Он ослепил Седекию и заковал его в бронзовые оковы, чтобы отвести его в Вавилон[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в бронзовые цепи»; или: «в бронзовые кандалы».'
    reason: Лексема נְחֻשְׁתַּיִם допускает разные обозначения бронзовых средств удержания.
lexical_decisions:
- source_word: עֵינֵי צִדְקִיָּהוּ עִוֵּר
  choice: ослепил Седекию
  rationale: Еврейский текст буквально говорит «ослепил глаза Седекии», но по-русски естественнее и столь же точно передать это как «ослепил Седекию».
- source_word: וַיַּאַסְרֵהוּ
  choice: заковал его
  rationale: Глагол אסר означает «связать, заключить»; вместе с последующим обозначением металлических оков «заковал» естественно передаёт физическое лишение свободы.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: в бронзовые оковы
  rationale: Форма обозначает металлические средства удержания, вероятно парные; «бронзовые оковы» точно и понятно, не сужая значение до конкретного вида цепей.
- source_word: לָבִיא אֹתוֹ
  choice: чтобы отвести
  rationale: Инфинитив выражает цель. В данном контексте пленника ведут под стражей, поэтому «отвести» по-русски естественнее буквального «привести».
- source_word: בָּבֶלָה
  choice: в Вавилон
  rationale: Направительный суффикс указывает на движение к Вавилону; по-русски это естественно выражается конструкцией «в Вавилон».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; изложение краткое, повествовательное и dignified. Конкретная еврейская конструкция с «глазами» передана естественным русским глаголом «ослепил», а лексическая вариативность названия оков сохранена в сноске.
