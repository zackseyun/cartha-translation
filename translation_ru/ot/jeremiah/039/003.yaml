source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ כֹּ֚ל שָׂרֵ֣י מֶֽלֶךְ בָּבֶ֔ל וַ/יֵּשְׁב֖וּ בְּ/שַׁ֣עַר הַ/תָּ֑וֶךְ נֵרְגַ֣ל שַׂר אֶ֠צֶר סַֽמְגַּר נְב֞וּ שַׂר סְכִ֣ים רַב סָרִ֗יס נֵרְגַ֤ל שַׂר אֶ֨צֶר֙ רַב מָ֔ג וְ/כָל שְׁאֵרִ֔ית שָׂרֵ֖י מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/003.yaml
  text: 'Then all the officials of the king of Babylon came in and sat in the Middle Gate: Nergal-sharezer[a], Samgar-nebu, Sarsechim the Rab-saris, Nergal-sharezer the Rab-mag[d][c][b], and all the rest of the officials of the king of Babylon.'
translation:
  language: ru
  text: 'Тогда вошли все сановники вавилонского царя и сели у Средних ворот[a]: Нергал-Шарецер, Самгар-Небу, Сарсехим, раб-сарис[b][c], Нергал-Шарецер, раб-маг[d], и все остальные сановники вавилонского царя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Средних воротах». Еврейский предлог в данном контексте допускает оба понимания.'
    reason: lexical_alternative
  - marker: b
    text: 'Последовательность «Самгар-Небу, Сарсехим, раб-сарис» трудна для разбора. Имена и титулы можно разделить иначе: например, «Самгар» понимать как титул, а «Сарсехим» — как обозначение должности, а не личное имя.'
    reason: alternative_reading
  - marker: c
    text: «Раб-сарис» — вавилонский титул, который традиционно понимают как «начальник евнухов» или «главный придворный».
    reason: cultural_note
  - marker: d
    text: «Раб-маг» — вавилонский титул; возможно, он означал «главный маг» или обозначал высокопоставленного служителя культа.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: вошли
  rationale: В повествовательном контексте глагол בוא обозначает вступление в захваченный город; «вошли» естественно передаёт направленное движение внутрь.
- source_word: כֹּל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: все сановники вавилонского царя
  rationale: שָׂרִים здесь обозначает высокопоставленных царских служащих или военачальников. «Сановники» сохраняет широту значения и не ограничивает группу только военными.
- source_word: וַיֵּשְׁבוּ
  choice: сели
  rationale: ישׁב буквально означает «сидеть»; перевод не делает явный вывод о том, что они заседали или официально приняли власть.
- source_word: בְּשַׁעַר הַתָּוֶךְ
  choice: у Средних ворот
  rationale: Название передано как обозначение конкретных ворот. Предлог בְּ допускает локативное «у» в контексте городских ворот; вариант «в Средних воротах» сохранён в примечании.
- source_word: נֵרְגַל שַׂר אֶצֶר
  choice: Нергал-Шарецер
  rationale: Вавилонское личное имя передано принятой русской библейской транслитерацией.
- source_word: סַמְגַּר נְבוּ
  choice: Самгар-Неву
  rationale: Последовательность согласных и масоретская огласовка переданы транслитерацией без попытки переводить спорное имя или титул.
- source_word: שַׂר סְכִים
  choice: Сарсехим
  rationale: Масоретская огласовка позволяет понимать выражение как личное имя; из-за спорности разбора иные варианты отмечены в сноске.
- source_word: רַב סָרִיס
  choice: раб-сарис
  rationale: Вавилонский придворный титул оставлен в транслитерации, чтобы не сводить его значение без достаточной уверенности к «главному евнуху».
- source_word: רַב מָג
  choice: раб-маг
  rationale: Вавилонский титул передан транслитерацией, поскольку точный круг обязанностей носителя неясен.
- source_word: וְכָל שְׁאֵרִית שָׂרֵי מֶלֶךְ בָּבֶל
  choice: и все остальные сановники вавилонского царя
  rationale: שְׁאֵרִית в перечне означает остальных лиц той же группы; такая формулировка естественна в современном русском языке.
