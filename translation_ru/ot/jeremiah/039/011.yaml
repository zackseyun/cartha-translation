base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/011.yaml
  text: Nebuchadnezzar king of Babylon gave orders concerning Jeremiah through Nebuzaradan[a], the captain of the guard, saying,
translation:
  language: ru
  text: 'Навуходоносор, царь Вавилона, через Невузардана, начальника стражи[a], отдал распоряжение об Иеремии:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальника палачей»; буквально: «главного над резниками (мясниками)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: отдал распоряжение
  rationale: Глагол צוה означает повелевать или отдавать распоряжение. Эта формулировка естественна в современном русском и вводит содержание приказа в следующем стихе.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Устоявшаяся и легко узнаваемая русская форма имени вавилонского царя.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Прямая передача титула и области царствования.
- source_word: עַל יִרְמְיָהוּ
  choice: об Иеремии
  rationale: При глаголе צוה предлог עַל обозначает лицо, которого касается распоряжение; приказ не обращён непосредственно к Иеремии.
- source_word: בְּיַד
  choice: через
  rationale: Идиома «рукой» указывает на посредничество; «через» ясно и естественно передаёт эту функцию по-русски.
- source_word: נְבוּזַרְאֲדָן
  choice: Невузардан
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: רַב טַבָּחִים
  choice: начальника стражи
  rationale: В придворно-военном контексте это должность начальника царской охраны, в обязанности которой также могли входить казни. Буквальная семантика титула отражена в примечании.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит прямое содержание распоряжения в следующем стихе. В современном русском двоеточие естественнее буквального «говоря» и сохраняет связь с последующей речью.
