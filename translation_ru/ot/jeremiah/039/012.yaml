  yaml_path: translation/ot/jeremiah/039/012.yaml
  text: Take him, keep your eyes on him, and do him no harm; rather, do with him just as he speaks to you.
translation:
  language: ru
  text: «Возьми его, держи его под присмотром и не причиняй ему никакого вреда; напротив, поступай с ним так, как он тебе скажет».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָחֶנּוּ
  choice: «Возьми его»
  rationale: Прямо передаёт повелительную форму לקח с местоименным суффиксом; в данном контексте означает принять Иеремию под надзор.
- source_word: וְעֵינֶיךָ שִׂים עָלָיו
  choice: «позаботься о нём»
  rationale: 'Буквально: «обрати/положи на него свои глаза». Русская идиома естественно выражает внимательный, благожелательный надзор, требуемый контекстом.'
- source_word: וְאַל תַּעַשׂ לוֹ מְאוּמָה רָע
  choice: «и не причиняй ему никакого зла»
  rationale: Сохраняет усиление מְאוּמָה («ничего, никакого») и широкое значение רָע («зло, вред»).
- source_word: כִּי אִם
  choice: точка с запятой без отдельного «но/напротив»
  rationale: 'Сочетание вводит противопоставление после запрета: не причинять зла, а действовать согласно словам Иеремии. В русском это естественно передано синтаксическим противопоставлением.'
- source_word: כַּאֲשֶׁר יְדַבֵּר אֵלֶיךָ כֵּן עֲשֵׂה עִמּוֹ
  choice: «поступай с ним так, как он тебе скажет»
  rationale: Сохраняет корреляцию כַּאֲשֶׁר…כֵּן («как… так») и допускает, что Иеремия сам выскажет желаемое обращение с ним.
