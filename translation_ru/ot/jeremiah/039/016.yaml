    issue: «во зло, а не во благо»
    rationale: רָעָה в судебном контексте означает бедствие, несчастье, пагубный исход, а не нравственное зло. «Во зло» в современном русском создаёт нежелательную моральную двусмысленность.
  - severity: medium
    issue: «исполню Мои слова об этом городе»
    rationale: Еврейское «привожу слова Мои к/на этот город» описывает осуществление возвещённых слов против города. Предлог «об» делает город лишь темой слов, а не объектом суда.
  - severity: low
    issue: Капитализация «Мои слова»
    rationale: В современной литературной русской норме притяжательное местоимение в прямой речи Бога обычно пишется со строчной буквы; заглавная не нужна для исходной семантики.
