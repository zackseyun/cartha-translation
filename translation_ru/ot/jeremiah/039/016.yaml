source:
  edition: WLC
  text: הָל֣וֹךְ וְ/אָמַרְתָּ֡ לְ/עֶבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י לֵ/אמֹ֗ר כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֩ מבי אֶת דְּבָרַ֜/י אֶל הָ/עִ֥יר הַ/זֹּ֛את לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/הָי֥וּ לְ/פָנֶ֖י/ךָ בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/016.yaml
  text: 'Go and say to Ebed-melech the Cushite[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am bringing my words against this city for harm and not for good[b], and they will come to pass before you on that day.’'
translation:
  language: ru
  text: 'Пойди и скажи Эвед-Мелеху, кушиту[a]: «Так говорит Яхве Воинств, Бог Израиля: вот, Я навожу Мои слова на этот город — к бедствию, а не ко благу[b], — и в тот день они исполнятся у тебя на глазах».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эфиопу». Буквально: «кушиту», то есть человеку из Куша.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во вред, а не во благо»; букв. «ко злу, а не ко благу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: Пойди и скажи
  rationale: Инфинитив абсолютный с личной формой глагола усиливает повеление; по-русски его естественно передаёт прямое «Пойди и скажи».
- source_word: לְעֶבֶד מֶלֶךְ
  choice: Эвед-Мелеху
  rationale: В данном контексте это личное имя; оно транслитерировано, а не переведено как нарицательное сочетание.
- source_word: הַכּוּשִׁי
  choice: кушиту
  rationale: Прямая передача этнонима, связанного с Кушем; традиционное «эфиоп» может создавать более позднюю географическую ассоциацию.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная и устоявшаяся русская передача пророческой формулы посланника.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией, а צְבָאוֹת — как «Воинств», сохраняя широту образа небесных и земных сил.
- source_word: הִנְנִי מֵבִיא אֶת דְּבָרַי
  choice: вот, Я исполню Мои слова
  rationale: הִנְנִי придаёт высказыванию торжественную непосредственность, а «исполню Мои слова» естественно выражает осуществление возвещённых приговоров; множественное число сохранено.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: об этом городе
  rationale: При глаголе осуществления слов русское «об этом городе» естественно обозначает предмет пророчеств, не устраняя их враждебной направленности, раскрытой следующей фразой.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: во зло, а не во благо
  rationale: Сохраняется формальная антитеза רָעָה/טוֹבָה; здесь «зло» обозначает бедствие или пагубный исход, а не нравственное зло со стороны Бога.
- source_word: וְהָיוּ לְפָנֶיךָ בַּיּוֹם הַהוּא
  choice: и в тот день они исполнятся у тебя на глазах
  rationale: Буквально слова «будут перед тобой» в контексте означают, что возвещённые события осуществятся при Эвед-Мелехе, у него на глазах.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Смысл רָעָה применительно к Божьему суду
  choice: во зло
  alternative: к бедствию; во вред
  rationale: «Во зло» сохраняет параллель с «во благо», при этом контекст указывает на бедствие и пагубный исход, а не на нравственное зло Бога.
- issue: Исполнение слов перед Эвед-Мелехом
  choice: исполнятся у тебя на глазах
  alternative: будут перед тобой
  rationale: Выбранный вариант передаёт контекстуальный смысл идиомы, не утверждая ничего сверх того, что суд над городом произойдёт в его присутствии и станет для него очевидным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены формула «Так говорит», частица «вот», противопоставление «во зло — во благо» и личное имя Яхве; синтаксис сделан ясным для обычного читателя.
