base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/013.yaml
  text: Nebuzaradan the captain of the guard[a], Nebushazban the chief officer, Nergal-sharezer the chief magus[c][b], and all the chief officials of the king of Babylon sent word.
translation:
  language: ru
  text: Невузарадан, начальник стражи, Невушазбан, главный придворный[b], Нергал-Шарецер, начальник магов[c], и все высшие сановники царя Вавилона послали[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «послали». Кого или что они послали, здесь не сказано; начатое действие продолжается в следующем стихе.'
    reason: lexical_alternative
  - marker: b
    text: Титул можно также передать как «главный евнух» или «начальник придворных».
    reason: lexical_alternative
  - marker: c
    text: Так передан вавилонский придворный титул; традиционная форма без перевода — «раб-маг».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послали
  rationale: Глагол שׁלח означает «посылать». В еврейском тексте дополнение не выражено, а действие продолжается в следующем стихе; поэтому сохранена эллиптичность без добавления «весть», «людей» или «приказ».
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Это вавилонский придворно-военный титул начальника царской охраны; буквальное «начальник палачей» в данном контексте могло бы ввести читателя в заблуждение.
- source_word: רַב סָרִיס
  choice: главный придворный
  rationale: סָרִיס может обозначать как евнуха, так и высокопоставленного придворного. Основной текст передаёт должностной смысл, не утверждая недостоверной физиологической подробности.
- source_word: נְבוּשַׁזְבָּ
  choice: Невушазбан
  rationale: Личное имя передано современной русской транслитерацией.
- source_word: נֵרְגַל שַׂר אֶצֶר
  choice: Нергал-Шарецер
  rationale: Последовательность понята как единое личное имя в его общепринятой библейской форме.
- source_word: רַב מָג
  choice: начальник магов
  rationale: Вавилонский придворный титул переведён по смыслу, а не оставлен в форме «раб-маг».
- source_word: וְכֹל רַבֵּי מֶלֶךְ בָּבֶל
  choice: и все высшие сановники вавилонского царя
  rationale: רַבֵּי здесь обозначает ведущих царских должностных лиц; «сановники» естественно передаёт их высокий придворный ранг.
