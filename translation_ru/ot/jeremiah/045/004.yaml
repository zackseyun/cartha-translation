  text: 'This is what you shall say to him: ‘This is what Yahweh says: Behold[a], what I have built I am tearing down, and what I have planted I am uprooting, that is, the whole land.’'
translation:
  language: ru
  text: 'Так скажи ему: «Так говорит Яхве: вот, что Я построил, то разрушаю, и что насадил, то вырываю с корнем, — то есть всю страну[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю землю». Еврейское אֶרֶץ может означать как определённую страну, так и землю в более широком смысле; здесь контекст суда над Иудой поддерживает первое понимание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹּאמַר אֵלָיו
  choice: Так скажи ему
  rationale: Кратко и естественно передаёт формулу כֹּה и инструктивное значение имперфекта תֹּאמַר; контекст требует повелительного смысла.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет традиционную пророческую формулу и передаёт личное имя יְהוָה транслитерацией «Яхве».
- source_word: הִנֵּה
  choice: вот
  rationale: Современный литературный русский эквивалент указательно-эмфатической частицы, сохраняющий торжественное привлечение внимания без архаизма «се».
- source_word: אֲשֶׁר בָּנִיתִי אֲנִי הֹרֵס
  choice: что Я построил, то разрушаю
  rationale: Конструкция «что..., то...» естественно воспроизводит относительный оборот и подчёркнутое אֲנִי; настоящее время передаёт действие причастия הֹרֵס.
- source_word: וְאֵת אֲשֶׁר נָטַעְתִּי אֲנִי נֹתֵשׁ
  choice: и что насадил, то вырываю с корнем
  rationale: Сохраняет образ насаждения и искоренения, повторяющийся у Иеремии; «вырываю с корнем» понятно современному читателю.
- source_word: וְאֶת כָּל הָאָרֶץ הִיא
  choice: — всю эту землю
  rationale: Передаёт эллиптическое приложение к предыдущим действиям. Указательное «эту» отражает возобновляющее הִיא и контекстуально указывает на страну под судом, не устраняя лексическую возможность значения «земля» в более широком смысле.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Объём значения כָּל הָאָרֶץ
  choice: всю эту землю
  alternative: всю землю (то есть весь мир)
  rationale: В ближайшем контексте суда вероятнее имеется в виду страна Иуды, однако еврейское אֶרֶץ допускает и более широкое значение; альтернативу следует отметить, а не исключать.
translation_notes:
  register: Современный литературный, достойный пророческой речи регистр. Формула «Так говорит Яхве» сохранена; «вот» выбрано вместо архаического «се». Параллельные образы строительства/разрушения и насаждения/искоренения переданы симметрично.
