source:
  edition: WLC
  text: כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עָלֶ֖י/ךָ בָּרֽוּךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel, concerning you, Baruch:'
translation:
  language: ru
  text: 'Так говорит Яхве, Бог Израиля, о тебе[a], Варух:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «касательно тебя»; менее вероятно: «против тебя».'
    reason: Лексическая неоднозначность предлога עַל в сочетании с глаголом речи.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула; настоящее время естественно передаёт её перформативную функцию в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача еврейской сопряжённой конструкции и традиционного заветного наименования.
- source_word: עָלֶיךָ
  choice: о тебе
  rationale: Предлог עַל при глаголе речи здесь естественно обозначает содержание высказывания; эта передача не усиливает текст до враждебного «против тебя».
- source_word: בָּרוּךְ
  choice: Варух
  rationale: Общепринятая русская передача библейского личного имени.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Оттенок выражения עָלֶיךָ
  choice: о тебе
  alternative: против тебя
  rationale: Контекст вводит обращённое к Варуху пророческое слово, но сама предложная конструкция допускает оттенки. Основной текст сохраняет нейтральное значение, а менее вероятное враждебное прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной краткости пророческой формулы. Порядок компонентов близок к еврейскому, но синтаксис естественен для русского.
