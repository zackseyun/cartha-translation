source:
  edition: WLC
  text: הַ/דָּבָ֗ר אֲשֶׁ֤ר דִּבֶּר֙ יִרְמְיָ֣הוּ הַ/נָּבִ֔יא אֶל בָּר֖וּךְ בֶּֽן נֵֽרִיָּ֑ה בְּ/כָתְב/וֹ֩ אֶת הַ/דְּבָרִ֨ים הָ/אֵ֤לֶּה עַל סֵ֨פֶר֙ מִ/פִּ֣י יִרְמְיָ֔הוּ בַּ/שָּׁנָה֙ הָֽ/רְבִעִ֔ית לִ/יהוֹיָקִ֧ים בֶּן יֹאשִׁיָּ֛הוּ מֶ֥לֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/001.yaml
  text: 'The word that Jeremiah the prophet spoke to Baruch son of Neriah when he wrote these words in a scroll at the mouth of Jeremiah[a], in the fourth year of Jehoiakim son of Josiah, king of Judah, saying:'
translation:
  language: ru
  text: 'Слово, которое пророк Иеремия сказал Варуху, сыну Нирии, когда тот записал в свиток эти слова из уст Иеремии[a], в четвёртый год правления Иоакима, сына Иосии, царя Иудеи:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под диктовку Иеремии»; буквально: «из уст Иеремии».'
    reason: Литературный образ оригинала подразумевает, что Варух записывал произносимые Иеремией слова.
lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: В пророческом введении דָּבָר обозначает слово или весть; «Слово» сохраняет традиционный пророческий регистр и не сужает значение до простого сообщения.
- source_word: דִּבֶּר
  choice: сказал
  rationale: Обычный русский глагол речи естественно вводит обращение Иеремии к Варуху.
- source_word: הַנָּבִיא
  choice: пророк
  rationale: Прямой перевод титула Иеремии.
- source_word: בְּכָתְבוֹ
  choice: когда тот записал
  rationale: Конструкция с ב и инфинитивом имеет временное значение. Указательное «тот» ясно соотносит действие с ближайшим названным лицом — Варухом.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: В контексте диктовки и записи множественное דְּבָרִים относится к записываемым словам.
- source_word: עַל סֵפֶר
  choice: в свиток
  rationale: סֵפֶר здесь означает письменный документ; «свиток» исторически уместнее современного «книга», а «записал в свиток» естественно по-русски.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: из уст Иеремии
  rationale: Сохранён буквальный древнееврейский образ, подразумевающий запись со слов Иеремии; смысл разъяснён в сноске.
- source_word: בַּשָּׁנָה הָרְבִעִית לִיהוֹיָקִים
  choice: в четвёртый год правления Иоакима
  rationale: В формуле датировки ל указывает на год царствования; добавление «правления» делает этот смысл ясным и естественным в современном русском.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Формула вводит последующую прямую речь. В русском двоеточие выполняет эту функцию естественнее буквального «говоря» или «сказав».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением достоинства пророческого введения. Синтаксис слегка прояснён местоимением «тот» и словом «правления»; древнееврейский образ «из уст Иеремии» сохранён в основном тексте и пояснён сноской.
