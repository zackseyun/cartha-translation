  text: אָמַ֨רְתָּ֙ אֽוֹי נָ֣א לִ֔/י כִּֽי יָסַ֧ף יְהוָ֛ה יָג֖וֹן עַל מַכְאֹבִ֑/י יָגַ֨עְתִּי֙ בְּ/אַנְחָתִ֔/י וּ/מְנוּחָ֖ה לֹ֥א מָצָֽאתִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/003.yaml
  text: You said[a], ‘Woe is me now, for Yahweh has added sorrow to my pain. I am weary with my groaning, and I have found no rest.’
translation:
  language: ru
  text: 'Ты сказал: «Горе мне! Ведь Яхве прибавил скорбь к моей боли. Я изнемог от стонов и не нахожу покоя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: Ты сказал
  rationale: Qal perfect, 2-е лицо ед. числа, вводит переданную речь Варуха; в повествовательном контексте естественно простое прошедшее время.
- source_word: אוֹי נָא לִי
  choice: Горе мне!
  rationale: אוֹי выражает плач и бедствие; נָא здесь усиливает возглас, а не означает вежливое «пожалуйста». По-русски усиление естественно передаётся восклицанием без отдельного слова.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит причину жалобы; «ведь» естественно сохраняет пояснительную связь.
- source_word: יָסַף
  choice: прибавил
  rationale: Глагол означает «добавить, увеличить»; «прибавил» сохраняет образ нового бремени, добавленного к уже существующей боли.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: יָגוֹן
  choice: скорбь
  rationale: Слово обозначает горе или печаль; «скорбь» сохраняет эмоциональный смысл и отличается от следующей «боли».
- source_word: עַל מַכְאֹבִי
  choice: к моей боли
  rationale: После יסף предлог עַל обозначает добавление к уже существующему страданию; русский оборот «прибавил… к…» передаёт это прямо.
- source_word: יָגַעְתִּי
  choice: я изнемог
  rationale: Перфект выражает достигнутое состояние крайней усталости; «изнемог» естественно и выразительно передаёт результат продолжительных страданий.
- source_word: בְּאַנְחָתִי
  choice: от стонов
  rationale: אַנְחָה может означать стон или вздох; ב допускает причинное понимание. «Изнемог от стонов» звучит естественно и сохраняет связь изнурения с непрестанным плачем.
- source_word: וּמְנוּחָה לֹא מָצָאתִי
  choice: и не нахожу покоя
  rationale: Буквально «и покоя я не нашёл»; русское настоящее время естественно передаёт сохраняющееся состояние, возникшее вследствие безуспешного поиска.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык; речь эмоциональна, но сохраняет достоинство пророческого текста. Восклицание «Горе мне!» передаёт усиленный еврейский возглас без неестественного буквального воспроизведения נָא.
