  text: וְ/אַתָּ֛ה תְּבַקֶּשׁ לְ/ךָ֥ גְדֹל֖וֹת אַל תְּבַקֵּ֑שׁ כִּ֡י הִנְ/נִי֩ מֵבִ֨יא רָעָ֤ה עַל כָּל בָּשָׂר֙ נְאֻם יְהוָ֔ה וְ/נָתַתִּ֨י לְ/ךָ֤ אֶֽת נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל עַ֥ל כָּל הַ/מְּקֹמ֖וֹת אֲשֶׁ֥ר תֵּֽלֶךְ שָֽׁם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/005.yaml
  text: And you—are you seeking great things for yourself? Do not seek them, for behold, I am bringing disaster on all flesh, declares the LORD. But I will give you your life as plunder in every place where you go.
translation:
  language: ru
  text: 'А ты ищешь для себя чего-то великого? Не ищи: вот, Я наведу бедствие на всякую плоть[a], — возвещает Господь, — а тебе Я дам твою жизнь как добычу[b] во всех местах, куда ты пойдёшь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «всякая плоть» может означать всё человечество, всех смертных людей.
    reason: Поясняет распространённую еврейскую идиому, сохраняя её образ в основном тексте.
  - marker: b
    text: То есть ты сохранишь жизнь, словно добычу, унесённую из разгрома.
    reason: Разъясняет буквальную военную метафору, не заменяя её пересказом в основном тексте.
lexical_decisions:
- source_word: גְדֹלוֹת
  choice: великого
  rationale: Субстантивированное множественное число обозначает «великие вещи» или высокие достижения; русское «великого» естественно передаёт широту и намеренную неопределённость выражения.
- source_word: רָעָה
  choice: бедствие
  rationale: В данном контексте слово означает несчастье или катастрофу, которую Господь наводит в суде, а не нравственное зло.
- source_word: כָּל־בָּשָׂר
  choice: всякую плоть
  rationale: Сохранён образ исходного текста и его широкий охват; пояснение идиомы дано в сноске без сужения основного текста.
- source_word: נַפְשְׁךָ לְשָׁלָל
  choice: твою жизнь как добычу
  rationale: נפש здесь означает жизнь самого человека, а образ добычи описывает жизнь, унесённую с собой из общей катастрофы; метафора сохранена.
- source_word: עַל כָּל־הַמְּקֹמוֹת אֲשֶׁר תֵּלֶךְ־שָׁם
  choice: во всех местах, куда бы ты ни пошёл
  rationale: Естественная русская передача всеохватности обещания при сохранении пространственной формулировки оригинала.
theological_decisions:
- issue: Охват выражения כָּל־בָּשָׂר
  choice: всякую плоть
  alternative: всех людей
  rationale: Более буквальная формулировка сохраняет универсальность и образность еврейского выражения, не решая без необходимости, насколько широко следует понимать объявленное бедствие.
- issue: Обещание נַפְשְׁךָ לְשָׁלָל
  choice: Я дам тебе твою жизнь как добычу
  alternative: Я сохраню тебе жизнь
  rationale: Прямое обещание сохранения жизни передано без устранения напряжённого образа добычи, подчёркивающего спасение среди всеобщего разорения.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Начальное «А ты» сохраняет контраст и личное обращение; метафоры «всякая плоть» и «жизнь как добыча» оставлены в тексте и кратко пояснены.
