base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/005.yaml
  text: For if you truly make your ways and your deeds good[a], if you truly do justice between a man and his neighbor[b],
translation:
  language: ru
  text: Ибо если вы действительно исправите свои пути и поступки[a], если действительно будете вершить правосудие между человеком и его ближним[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделаете свои пути и поступки добрыми». Еврейский текст в обеих условных фразах сочетает абсолютный инфинитив с личной формой глагола, усиливая выраженное действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будете поистине творить справедливый суд между человеком и его ближним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Ибо если
  rationale: Сохраняет как связующую силу כִּי, так и условное значение אִם, не усиливая контраст сверх выраженного в еврейском тексте.
- source_word: הֵיטֵיב תֵּיטִיבוּ
  choice: действительно исправите
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает действие. «Действительно» передаёт эмфазу, а «исправите» естественно сочетается с прямыми дополнениями «пути и поступки».
- source_word: דַּרְכֵיכֶם
  choice: свои пути
  rationale: Сохраняется прозрачная библейская метафора образа жизни; возвратное «свои» естественно при обращении во втором лице.
- source_word: מַעַלְלֵיכֶם
  choice: поступки
  rationale: Слово обозначает совершаемые дела и действия; «поступки» ясно передаёт нравственный оттенок в современном русском языке.
- source_word: אִם עָשׂוֹ תַעֲשׂוּ
  choice: если действительно будете вершить
  rationale: Повторная конструкция абсолютного инфинитива с личной формой снова передана усилительным «действительно»; «вершить» идиоматично сочетается с «правосудием».
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В данном контексте речь идёт о справедливом разбирательстве и осуществлении справедливости в отношениях между членами общества.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: между человеком и его ближним
  rationale: Формула обозначает справедливое разбирательство между членами сообщества. «Человек» передаёт представительное употребление אִישׁ, а «ближний» сохраняет традиционный и понятный смысл רֵעַ.
theological_decisions:
- issue: Представительное мужское обозначение אִישׁ
  choice: человеком
  alternative: мужчиной; одним человеком
  rationale: Хотя אִישׁ грамматически мужского рода, в данной правовой формуле слово имеет обобщающее значение. Русское «человек» сохраняет форму единственного числа и не ограничивает смысл только взрослыми мужчинами.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Пути», «ближний» и «вершить правосудие» сохраняют достоинство и образность исходного текста, оставаясь понятными широкому читателю.
