  text: גָּזִּ֤י נִזְרֵ/ךְ֙ וְֽ/הַשְׁלִ֔יכִי וּ/שְׂאִ֥י עַל שְׁפָיִ֖ם קִינָ֑ה כִּ֚י מָאַ֣ס יְהוָ֔ה וַ/יִּטֹּ֖שׁ אֶת דּ֥וֹר עֶבְרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/029.yaml
  text: Cut off your hair and throw it away[a], and raise a lament on the bare heights[b], for Yahweh has rejected and abandoned the generation of his wrath.
translation:
  language: ru
  text: Остриги свои волосы и отбрось их[a]; подними плач на голых высотах, ибо Яхве отверг и покинул поколение Его гнева[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свой венец». Еврейское слово может обозначать посвящение, венец или волосы, служащие знаком посвящения; повеления остричь и отбросить здесь указывают прежде всего на волосы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поколение, на которое направлен Его гнев». Буквально: «поколение Его гнева».'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּזִּי
  choice: Остриги
  rationale: Повелительная форма женского рода от גזז означает стричь или срезать; «остриги» естественно сочетается с волосами и сохраняет обращение к олицетворённому Иерусалиму.
- source_word: נִזְרֵךְ
  choice: свои волосы
  rationale: Существительное נֵזֶר может обозначать посвящение, венец или волосы как знак посвящения. Глаголы «остриги» и «выбрось» указывают здесь прежде всего на волосы; возможный оттенок посвящённости вынесен в примечание.
- source_word: וְהַשְׁלִיכִי
  choice: и выбрось их
  rationale: Глагол שלך передаёт намеренное отбрасывание; «выбрось» ясно и современно выражает отказ от остриженных волос.
- source_word: וּשְׂאִי ... קִינָה
  choice: подними плач
  rationale: Сочетание נשׂא с קינה означает начать, вознести погребальный или скорбный плач. «Подними плач» сохраняет образность оригинала и понятно по-русски.
- source_word: עַל שְׁפָיִם
  choice: на голых высотах
  rationale: שְׁפָיִם обозначает безлесные, открытые возвышенности. «Голые высоты» точно передаёт природный образ, не превращая его без достаточных оснований в культовые «высоты».
- source_word: כִּי מָאַס
  choice: потому что ... отверг
  rationale: מאס выражает отвержение; «отверг» передаёт решительный разрыв без добавления эмоционального оттенка презрения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией «Яхве», а не заменено титулом.
- source_word: וַיִּטֹּשׁ
  choice: и покинул
  rationale: נטש означает оставить, покинуть или бросить; «покинул» звучит естественно и сохраняет смысл оставления.
- source_word: דּוֹר עֶבְרָתוֹ
  choice: поколение, на которое излился Его гнев
  rationale: Буквально — «поколение Его ярости/гнева». Контекстуальное раскрытие выражает направленность Божьего гнева на это поколение, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Смысл נִזְרֵךְ
  choice: свои волосы
  alternative: свой венец; волосы посвящения
  rationale: При повелениях остричь и выбросить наиболее вероятен конкретный образ волос, однако многозначность слова и связь с посвящением сохранены в примечании.
- issue: Смысл דּוֹר עֶבְרָתוֹ
  choice: поколение, на которое излился Его гнев
  alternative: поколение Его гнева
  rationale: Русская формулировка ясно передаёт отношение конструкта, не скрывая в сноске его буквальной и более напряжённой формы.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формы женского рода отражают обращение к олицетворённому Иерусалиму. Сохранены образ «голых высот», личное имя Яхве и смысловая напряжённость заключительной конструкции.
