source:
  edition: WLC
  text: וּ/בָאתֶ֞ם וַ/עֲמַדְתֶּ֣ם לְ/פָנַ֗/י בַּ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר נִקְרָא שְׁמִ֣/י עָלָ֔י/ו וַ/אֲמַרְתֶּ֖ם נִצַּ֑לְנוּ לְמַ֣עַן עֲשׂ֔וֹת אֵ֥ת כָּל הַ/תּוֹעֵב֖וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/010.yaml
  text: Then you come and stand before me in this house[a], which is called by my name, and say[b], ‘We are delivered!’—so that you may do all these abominations.
translation:
  language: ru
  text: 'Затем вы приходите и становитесь предо Мной в этом доме[a], который назван Моим именем, и говорите: «Мы избавлены!»[b] — чтобы творить все эти мерзости.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в этом храме». Буквально: «в этом доме».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Мы спасены!»; возможно также: «Теперь мы в безопасности!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתֶם
  choice: А потом вы приходите
  rationale: Вав продолжает последовательность обвинения; настоящее время сохраняет живость пророческой речи, а «потом» передаёт последовательную связь.
- source_word: וַעֲמַדְתֶּם לְפָנַי
  choice: и становитесь предо Мной
  rationale: Прямо передаёт עמד לפני — явиться и стоять в чьём-либо присутствии; «предо Мной» соответствует возвышенному, но понятному библейскому регистру.
- source_word: בַּבַּיִת הַזֶּה
  choice: в этом доме
  rationale: Сохраняет буквальное значение בַּיִת и образ Божьего дома; по контексту речь идёт о храме.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: над которым провозглашено Моё имя
  rationale: Сохраняет пассивную конструкцию и пространственный элемент על, не сводя идиому лишь к более свободному «который носит Моё имя».
- source_word: וַאֲמַרְתֶּם
  choice: и говорите
  rationale: Настоящее время продолжает живую обвинительную последовательность.
- source_word: נִצַּלְנוּ
  choice: Мы спасены!
  rationale: Форма нифаля от נצל обозначает избавление от опасности. Русское «спасены» естественно выражает заявленное ими избавление, не уточняя, идёт ли речь о состоявшемся спасении или ощущении безопасности.
- source_word: לְמַעַן עֲשׂוֹת
  choice: чтобы творить
  rationale: Передаёт целевую либо иронически-результативную связь без добавления явно не выраженной длительности действия.
- source_word: כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: все эти мерзости
  rationale: «Мерзости» — сильный и устойчивый русский эквивалент תועבות, охватывающий отвратительные в религиозном и нравственном отношении поступки.
theological_decisions:
- issue: Обозначение храма словом בַּיִת
  choice: дом
  alternative: храм
  rationale: Непосредственный референт — Иерусалимский храм, однако древнееврейский текст говорит «дом». Такой перевод сохраняет исходный образ и богословскую связь с последующим упоминанием Божьего имени.
- issue: Смысл נִצַּלְנוּ
  choice: Мы спасены!
  alternative: Мы избавлены! / Теперь мы в безопасности!
  rationale: Высказывание может означать как заявленное избавление, так и уверенность в безопасности. Основной текст сохраняет естественную для русского языка формулировку, а примечание отмечает диапазон смысла.
- issue: Связь לְמַעַן с последующим грехом
  choice: чтобы творить
  alternative: и потому можете творить / чтобы продолжать творить
  rationale: 'Формулировка сохраняет резкую ироническую целевую связь: они используют предполагаемое спасение как возможность совершать мерзости, не добавляя прямо не выраженного аспектуального значения.'
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Прописные буквы в местоимениях, относящихся к Богу, следуют принятой русской религиозно-издательской норме. Пунктуация подчёркивает обвинительную иронию последней целевой конструкции.
