  verdict: revise
  source_fidelity: 'Основной смысл передан верно: пророческая обвинительная последовательность сохранена настоящим временем; בַּיִת передано как «дом», а לְמַעַן עֲשׂוֹת — как ироническая целевая конструкция. Однако «над которым провозглашено Моё имя» неудачно передаёт устойчивый еврейский оборот נִקְרָא שְׁמִי עָלָיו: речь о доме, названном именем Бога / принадлежащем Ему, а не о действии провозглашения над ним. «Мы спасены!» в русском языке легко получает позднейший сотериологический оттенок; «Мы избавлены!» точнее передаёт נִצַּלְנוּ и оставляет в сноске варианты.'
  naturalness: «Предо Мной» допустимо в возвышенном регистре, но «над которым провозглашено Моё имя» звучит искусственно и не является естественным русским эквивалентом библейского идиоматического оборота. «Затем» естественнее, чем разговорно окрашенное «А потом», в данном торжественно-обличительном контексте.
  terminology: «Дом» и «мерзости» удачно сохраняют лексику и библейский регистр. Формула «который назван Моим именем» — устоявшееся, понятное и достаточно близкое воспроизведение идиомы. «Избавлены» предпочтительнее «спасены» как основной текст; вариант «спасены» следует оставить в примечании.
