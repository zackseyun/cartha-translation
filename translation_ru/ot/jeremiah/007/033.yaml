  text: וְֽ/הָ֨יְתָ֜ה נִבְלַ֨ת הָ/עָ֤ם הַ/זֶּה֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֣ת הָ/אָ֑רֶץ וְ/אֵ֖ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/033.yaml
  text: The corpses of this people will become food for the birds of the heavens and for the beasts of the earth[a], with no one to frighten them away.
translation:
  language: ru
  text: И трупы этого народа станут пищей для птиц небесных и для зверей земных[a], и некому будет их отпугнуть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «труп этого народа… и нет отпугивающего». Единственное число «труп» может иметь собирательное значение, а дополнение в последней части по-еврейски подразумевается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: станут
  rationale: В пророческом контексте форма указывает на будущий результат; русское «станут пищей» естественно передаёт конструкцию с לְמַאֲכָל.
- source_word: נִבְלַת
  choice: трупы
  rationale: Существительное стоит в единственном числе, но может иметь собирательное значение; множественное число по-русски ясно обозначает тела погибших из этого народа.
- source_word: הָעָם הַזֶּה
  choice: этого народа
  rationale: Прямое и контекстуально уместное соответствие עַם без излишнего политического оттенка слова «нация».
- source_word: לְמַאֲכָל
  choice: пищей
  rationale: 'Кратко и точно сохраняет суровый образ: тела станут кормом для падальщиков.'
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: для птиц небесных
  rationale: Передаёт собирательное עוֹף и устойчивую возвышенную библейскую формулу, оставаясь понятным современному читателю.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: и для зверей земных
  rationale: Собирательно обозначает наземных животных; формулировка сохраняет параллелизм с «птицами небесными».
- source_word: וְאֵין מַחֲרִיד
  choice: и некому будет их отпугнуть
  rationale: Причастная конструкция выражает отсутствие того, кто мог бы заставить животных отступить; подразумеваемое дополнение естественно выражено местоимением «их».
