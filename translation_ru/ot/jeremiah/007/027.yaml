  text: וְ/דִבַּרְתָּ֤ אֲלֵי/הֶם֙ אֶת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/לֹ֥א יִשְׁמְע֖וּ אֵלֶ֑י/ךָ וְ/קָרָ֥אתָ אֲלֵי/הֶ֖ם וְ/לֹ֥א יַעֲנֽוּ/כָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/027.yaml
  text: You shall speak all these words to them[a], but they will not listen to you; you shall call to them, but they will not answer you.
translation:
  language: ru
  text: И ты скажешь им все эти слова, но они не послушают тебя[a]; ты позовёшь их, но они тебе не ответят.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не станут тебя слушать»; возможно также: «не услышат тебя» или «не будут повиноваться тебе». Еврейский глагол שׁמע может означать «слышать», «слушать» или «слушаться» — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם
  choice: И ты скажешь им
  rationale: Форма с וְ продолжает обращённое к Иеремии наставление и в данном контексте имеет будущее значение. «Скажешь им» естественно передаёт направленную к слушателям пророческую речь.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: דְּבָרִים допускает значения «слова», «дела» и «обстоятельства», но здесь речь идёт о содержании пророческого возвещения, поэтому выбрано «слова».
- source_word: וְלֹא יִשְׁמְעוּ אֵלֶיךָ
  choice: но они не послушают тебя
  rationale: שׁמע с אֶל означает слушать кого-либо и может также подразумевать повиновение. Русское «не послушают» сохраняет оба оттенка лучше, чем исключительно слуховое «не услышат».
- source_word: וְקָרָאתָ אֲלֵיהֶם
  choice: ты позовёшь их
  rationale: קרא с אֶל здесь означает обратиться с призывом или позвать. «Позовёшь их» передаёт значение прямо, не добавляя оттенка громкого крика или официального провозглашения.
- source_word: וְלֹא יַעֲנוּכָה
  choice: но они тебе не ответят
  rationale: Глагол ענה в породе qal означает «ответить, откликнуться»; местоименный суффикс явно передан словом «тебе».
