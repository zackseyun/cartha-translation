  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/ל֤וֹא שָׁמְעוּ֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם הֵרֵ֖עוּ מֵ/אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/026.yaml
  text: Yet they did not listen to me[a], and they did not incline their ear, but they stiffened their neck[b]; they acted more wickedly than their fathers.
translation:
  language: ru
  text: Но они не слушали Меня и не склоняли уха, а упрямо противились[a]; они творили ещё больше зла, чем их предки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделали свою шею жёсткой» — еврейский образ упрямства и непокорности.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «отцы». Здесь имеются в виду прежние поколения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֵלַי
  choice: не слушали Меня
  rationale: Глагол שׁמע с אֶל означает не просто слышать звук, а слушать и внимать. Перевод сохраняет волевой оттенок, не усиливая его до прямого «не повиновались».
- source_word: הִטּוּ אֶת אָזְנָם
  choice: не склоняли уха
  rationale: Сохранён еврейский образ внимательного слушания; выражение понятно в современном литературном русском и поддерживает параллелизм с предыдущей частью стиха.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: упрямо противились
  rationale: Буквальный образ «сделали шею жёсткой» обозначает упорное сопротивление. В основном тексте использовано естественное русское соответствие, а образ отмечен в сноске.
- source_word: הֵרֵעוּ
  choice: творили ещё больше зла
  rationale: Порода hифиль глагола רעע здесь выражает совершение зла; следующая конструкция с מִן задаёт явное сравнение, переданное словами «ещё больше… чем».
- source_word: מֵאֲבוֹתָם
  choice: чем их предки
  rationale: אָבוֹת буквально означает «отцы», но в данном историческом сравнении охватывает прежние поколения. «Предки» естественно передаёт этот смысл по-русски, не сужая его до непосредственных отцов.
- source_word: וְלֹא ... וְלֹא ... וַ
  choice: Но ... и ... а ...
  rationale: 'Связки передают продолжение речи и контраст с предшествующим призывом: народ не только не внимал, но и упорно сопротивлялся.'
theological_decisions:
- issue: Степень смыслового усиления שׁמע
  choice: не слушали Меня
  alternative: не повиновались Мне
  rationale: Неповиновение подразумевается контекстом, однако основной перевод сохраняет более широкий смысл слушания и внимания, не превращая следствие в прямое значение глагола.
- issue: Передача метафоры жёсткой шеи
  choice: упрямо противились
  alternative: сделали свою шею жёсткой
  rationale: Еврейская метафора обозначает сознательное упорство. Естественная русская формулировка раскрывает идиоматический смысл, а буквальный образ сохраняется в сноске.
- issue: Объём значения אָבוֹת
  choice: предки
  alternative: отцы
  rationale: Речь, вероятно, идёт о прежних поколениях Израиля вообще. «Предки» сохраняет эту широту; буквальное соответствие указано в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Оборот «склоняли уха» сохраняет исходный образ и параллелизм, оставаясь понятным; архаизмы вроде «выя» и конфессионально окрашенные формулы не используются.
