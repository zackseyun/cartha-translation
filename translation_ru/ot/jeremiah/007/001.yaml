  text: 'The word that came to Yirmeyahu from the LORD, saying:'
translation:
  language: ru
  text: 'Слово, которое пришло к Иеремии от Господа:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: Обычное библейское обозначение данного Богом пророческого сообщения; единственное число и определённость переданы естественно для русского языка.
- source_word: הָיָה אֶל
  choice: было к
  rationale: Формально сохраняет характерную древнееврейскую формулу получения откровения, не подменяя её более истолковывающим «пришло».
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Употреблена укоренившаяся русская форма имени пророка.
- source_word: מֵאֵת יְהוָה
  choice: от Господа
  rationale: Передаёт источник слова; тетраграмматон дан традиционным русским соответствием «Господь».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь; в современном русском эту функцию естественно выполняет двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יהוה
  choice: Господа
  alternative: Яхве
  rationale: Традиционное русское соответствие сохраняет достоинство и узнаваемость текста, не вводя спорную реконструкцию произношения.
- issue: Характер пророческого откровения в формуле הָיָה אֶל
  choice: было к Иеремии
  alternative: пришло к Иеремии
  rationale: Более формальная передача не уточняет сверх сказанного способ, которым пророк получил слово.
translation_notes:
  register: Современный литературный русский с сохранением торжественной и лаконичной пророческой формулы. Архаическое «глаголя» отвергнуто; вводная формула завершается двоеточием, поскольку далее следует содержание речи.
