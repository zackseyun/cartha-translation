base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/023.yaml
  text: 'But this command I gave them: ‘Listen to my voice[a], and I will be your God, and you shall be my people; and walk in all the way that I command you, so that it may go well with you.’'
translation:
  language: ru
  text: 'Но вот что Я повелел им: «Слушайте Мой голос[a], и Я буду вашим Богом, а вы будете Моим народом; во всём идите по пути, который Я заповедую вам, чтобы вам было хорошо».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Слушайтесь Моего голоса». В еврейском эта идиома часто подразумевает также послушание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Но вот
  rationale: Оборот после отрицания в предыдущем стихе вводит контрастирующее уточнение. «Но вот» естественно передаёт переход к тому, что Бог действительно повелел.
- source_word: הַדָּבָר הַזֶּה
  choice: вот что
  rationale: Буквально «это слово/дело»; при глаголе «повелел» речь идёт о содержании повеления. Русское «вот что Я повелел» избегает тяжеловесного повтора «вот это повеление Я повелел».
- source_word: צִוִּיתִי אוֹתָם לֵאמֹר
  choice: Я повелел им
  rationale: Глагол прямо обозначает повеление, а последующая прямая речь передаёт его содержание; отдельное «говоря» в современном русском не требуется.
- source_word: שִׁמְעוּ בְקוֹלִי
  choice: Слушайтесь Моего голоса
  rationale: Еврейская идиома буквально связана со слушанием голоса, но в данном контексте включает послушание. Возвратная форма «слушайтесь» передаёт этот смысл, сохраняя образ голоса.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: и Я буду вашим Богом
  rationale: Естественная русская форма устойчивой формулы заветных отношений.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: а вы будете Моим народом
  rationale: «А» ясно выражает взаимное соответствие двух сторон формулы завета, не добавляя противопоставления по существу.
- source_word: וַהֲלַכְתֶּם בְּכָל הַדֶּרֶךְ
  choice: Идите по всему пути
  rationale: Сохраняются метафора хождения, единственное число «путь» и всеохватность כָּל. Императив естественно продолжает предшествующее повеление.
- source_word: אֲשֶׁר אֲצַוֶּה אֶתְכֶם
  choice: который Я заповедую вам
  rationale: Имперфект допускает настоящее или будущее значение. Настоящее время естественно выражает общее, продолжающее действовать Божье наставление.
- source_word: לְמַעַן יִיטַב לָכֶם
  choice: чтобы вам было хорошо
  rationale: Передаёт целевое значение לְמַעַן и обычную еврейскую идиому благополучия без излишнего уточнения его характера.
theological_decisions:
- issue: Формула завета
  choice: «Я буду вашим Богом, а вы будете Моим народом»
  alternative: «Я буду для вас Богом, а вы будете для Меня народом»
  rationale: Выбранная формулировка естественна по-русски и сохраняет взаимную принадлежность и отношения завета, не превращая выражение в отвлечённое утверждение о Божьей природе.
- issue: Смысл שִׁמְעוּ בְקוֹלִי
  choice: «Слушайтесь Моего голоса»
  alternative: «Слушайте Мой голос»
  rationale: Контекст повеления и обычное употребление идиомы предполагают не просто восприятие речи, но послушный отклик. При этом слово «голоса» сохраняет образность оригинала; буквальная альтернатива дана в сноске.
- issue: Метафора пути
  choice: «Идите по всему пути»
  alternative: «Во всём поступайте так»
  rationale: Сохранена библейская метафора жизненного пути и формальная особенность единственного числа, без сведения её к более узкому понятию поведения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавные местоимения в прямой Божьей речи соответствуют принятой русской издательской традиции. Формула завета и метафора пути сохранены, синтаксис упрощён для ясного чтения.
