base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/032.yaml
  text: Therefore, look, days are coming, declares the LORD, when it will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter; and they will bury in Topheth because there is no place left.
translation:
  language: ru
  text: 'Поэтому: вот, наступают дни, — возвещает ГОСПОДЬ, — когда это место уже не будут называть Тофетом и долиной Бен-Хинном, но назовут долиной Резни. И будут хоронить в Тофете, потому что больше не останется места.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт прямую логическую связь с предшествующим приговором.
- source_word: הִנֵּה יָמִים בָּאִים
  choice: вот, наступают дни
  rationale: Сохраняет указательное הִנֵּה и естественно передаёт пророческую формулу на современном русском языке.
- source_word: נְאֻם יְהוָה
  choice: возвещает ГОСПОДЬ
  rationale: נְאֻם обозначает торжественное божественное изречение; написание «ГОСПОДЬ» традиционно указывает на тетраграмматон יהוה без навязывания реконструированного произношения.
- source_word: הַתֹּפֶת
  choice: Тофет
  rationale: Собственное название передано общепринятой русской транслитерацией.
- source_word: גֵיא בֶן הִנֹּם
  choice: долина Бен-Хинном
  rationale: Сохраняет форму еврейского топонима без превращения имени в толкование.
- source_word: גֵיא הַהֲרֵגָה
  choice: долина Убиения
  rationale: Передаёт название, образованное от существительного со значением массового убийства или заклания, и сохраняет его мрачную переименовывающую функцию.
- source_word: מֵאֵין מָקוֹם
  choice: потому что больше не останется места
  rationale: Естественно передаёт причинную конструкцию и не уточняет сверх текста, где именно не останется места.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Капительное написание сохраняет различие тетраграмматона и обычного титула, оставаясь понятным широкой русскоязычной аудитории.
- issue: Неопределённый субъект וְקָבְרוּ
  choice: И будут хоронить
  alternative: И они будут хоронить
  rationale: Безлично-неопределённая русская конструкция сохраняет отсутствие названного субъекта и не вводит дополнительных действующих лиц.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Добавление «это место» служит только для естественной связи двух прежних названий с новым и не конкретизирует референт сверх контекста. Пунктуация выделяет формулу божественного изречения.
