  text: עֲמֹ֗ד בְּ/שַׁ֨עַר֙ בֵּ֣ית יְהוָ֔ה וְ/קָרָ֣אתָ שָּׁ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה וְ/אָמַרְתָּ֞ שִׁמְע֣וּ דְבַר יְהוָ֗ה כָּל יְהוּדָה֙ הַ/בָּאִים֙ בַּ/שְּׁעָרִ֣ים הָ/אֵ֔לֶּה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/002.yaml
  text: Stand in the gate of the house of Yahweh[a], and proclaim there this word, and say, “Hear the word of Yahweh, all Judah, who enter through these gates to worship Yahweh.”
translation:
  language: ru
  text: 'Стань у ворот дома Яхве и возвести там это слово. Скажи: «Слушайте слово Яхве, все вы, жители Иудеи, входящие в эти ворота, чтобы поклониться[a] Яхве!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы поклониться, пав ниц перед Яхве». Еврейский глагол может обозначать поклонение, выражаемое поклоном или простиранием ниц.'
    reason: Лексическая альтернатива передаёт возможный телесный оттенок еврейского глагола השתחוה и привязана непосредственно к поясняемому слову.
lexical_decisions:
- source_word: עֲמֹד
  choice: Встань
  rationale: Прямо передаёт повелительную форму глагола עמד и указание Иеремии занять определённое место.
- source_word: בְּשַׁעַר בֵּית יְהוָה
  choice: у ворот дома Яхве
  rationale: Предлог ב здесь допускает значение «у/при/в» воротах; «у ворот» естественно обозначает место публичного обращения. «Дом Яхве» сохраняет образное обозначение храма из еврейского текста.
- source_word: וְקָרָאתָ שָּׁם אֶת־הַדָּבָר הַזֶּה
  choice: и провозгласи там это слово
  rationale: В пророческом контексте קרא означает публично возвестить; единственное число דָּבָר сохранено словом «слово».
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: Слушайте слово Яхве
  rationale: «Слушайте» естественно передаёт повелительное שמע как призыв внимательно воспринять пророческое слово.
- source_word: כָּל יְהוּדָה
  choice: весь народ Иудеи
  rationale: Иуда употреблена собирательно; добавление «народ» делает обращение ясным по-русски, не ограничивая его отдельной группой жителей.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: входящий в эти ворота
  rationale: Причастный оборот характеризует собирательное выражение «весь народ Иудеи»; множественное число «ворота» соответствует источнику.
- source_word: לְהִשְׁתַּחֲוֺת לַיהוָה
  choice: чтобы поклониться Яхве
  rationale: Глагол השתחוה обозначает поклонение и может включать телесное простирание ниц; основной вариант краток и естественен, а физический оттенок отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Значение לְהִשְׁתַּחֲוֺת
  choice: чтобы поклониться
  alternative: чтобы пасть ниц перед
  rationale: Контекст ясно относится к богопочитанию, однако еврейский глагол также способен обозначать физическое простирание; этот оттенок сохранён как открытая лексическая альтернатива в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Синтаксис слегка упрощён разделением на два предложения; повтор имени Яхве и формула «слово Яхве» сохранены.
