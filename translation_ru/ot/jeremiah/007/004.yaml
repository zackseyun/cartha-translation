  text: אַל תִּבְטְח֣וּ לָ/כֶ֔ם אֶל דִּבְרֵ֥י הַ/שֶּׁ֖קֶר לֵ/אמֹ֑ר הֵיכַ֤ל יְהוָה֙ הֵיכַ֣ל יְהוָ֔ה הֵיכַ֥ל יְהוָ֖ה הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/004.yaml
  text: Do not trust in deceptive words[a], saying, “The temple of Yahweh, the temple of Yahweh[b], the temple of Yahweh are these.”
translation:
  language: ru
  text: 'Не полагайтесь на обманчивые слова[a], говоря: «Храм Яхве, храм Яхве, храм Яхве — вот они!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ложные слова». Еврейское выражение может подчёркивать как ложность этих слов, так и то, что они вводят в заблуждение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Храм Яхве, храм Яхве, храм Яхве — они». Троекратный повтор звучит как самоуверенная формула. Множественное «они» может относиться к повторённым словам, храмовым строениям или священным объектам; точная отсылка остаётся не вполне ясной.'
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: אַל תִּבְטְחוּ לָכֶם
  choice: Не полагайтесь
  rationale: Конструкция אַל с имперфектом выражает запрет, а בטח — доверие или опору на что-либо. «Не полагайтесь» естественно передаёт это значение; дательно-рефлексивный оттенок לָכֶם по-русски отдельно не выражен, поскольку буквальное добавление было бы неестественным.
- source_word: אֶל דִּבְרֵי הַשֶּׁקֶר
  choice: на обманчивые слова
  rationale: После בטח предлог אֶל вводит объект доверия. הַשֶּׁקֶר может указывать как на ложность слов, так и на их вводящее в заблуждение действие; «обманчивые» сохраняет оба оттенка.
- source_word: לֵאמֹר
  choice: повторяя
  rationale: Инфинитив вводит содержание произносимой формулы. В данном контексте «повторяя» естественно связано с последующим троекратным возгласом, не устраняя его риторической силы.
- source_word: הֵיכַל יְהוָה
  choice: Храм Яхве
  rationale: הֵיכַל здесь обозначает Иерусалимский храм. Имя יהוה передано транслитерацией «Яхве», а повтор формулы сохранён полностью.
- source_word: הֵמָּה
  choice: вот они
  rationale: Самостоятельное местоимение мужского рода множественного числа имеет указательно-эмфатическую силу. «Вот они» сохраняет необычную множественную форму и дейктический акцент оригинала, не заменяя её толкованием «вот он».
theological_decisions:
- issue: Троекратная храмовая формула
  choice: «Храм Яхве, храм Яхве, храм Яхве»
  alternative: «Это храм Яхве» или сокращённое повторение
  rationale: Дословный троекратный повтор передаёт риторическую настойчивость и раскрывает ложную уверенность слушателей в самом святилище, не объясняя её прямо внутри текста.
- issue: Множественное הֵמָּה после повторённого הֵיכַל
  choice: «вот они»
  alternative: «вот он» / «это храм Яхве»
  rationale: 'Оригинал грамматически необычен: множественное местоимение может указывать на повторённые слова, храмовые сооружения или находящиеся перед слушателями священные объекты. Перевод сохраняет эту напряжённость, а сноска обозначает основные возможности.'
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Передано личное божественное имя, присутствующее в еврейском тексте, без замены титулом.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Троекратный повтор и необычное множественное указание сохранены; пунктуация делает формулу естественной для устной речи.
