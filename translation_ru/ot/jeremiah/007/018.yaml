  text: הַ/בָּנִ֞ים מְלַקְּטִ֣ים עֵצִ֗ים וְ/הָֽ/אָבוֹת֙ מְבַעֲרִ֣ים אֶת הָ/אֵ֔שׁ וְ/הַ/נָּשִׁ֖ים לָשׁ֣וֹת בָּצֵ֑ק לַ/עֲשׂ֨וֹת כַּוָּנִ֜ים לִ/מְלֶ֣כֶת הַ/שָּׁמַ֗יִם וְ/הַסֵּ֤ךְ נְסָכִים֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֖עַן הַכְעִסֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/018.yaml
  text: The children gather wood[a], the fathers kindle the fire, and the women knead dough to make cakes for the Queen of Heaven and to pour out drink offerings to other gods, so as to provoke me to anger.
translation:
  language: ru
  text: Дети собирают дрова, отцы разжигают огонь, а женщины месят тесто, чтобы изготавливать лепёшки для Царицы Небесной[a] и совершать возлияния другим богам, чтобы разгневать Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское מְלֶכֶת הַשָּׁמַיִם традиционно понимают как «Царица Небесная» — вероятно, титул богини, которой поклонялись в Иудее. Предлагалось также понимание «дело небесное», однако контекст здесь указывает на личное божество, принимающее приношения.
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַקְּטִים עֵצִים
  choice: собирают дрова
  rationale: Причастие обозначает собирание, а עֵצִים в контексте разведения огня естественно передаётся как «дрова».
- source_word: מְבַעֲרִים אֶת הָאֵשׁ
  choice: разжигают огонь
  rationale: Выражение описывает поддерживаемое действие по разведению огня; «разжигают огонь» точно и естественно по-русски.
- source_word: לָשׁוֹת בָּצֵק
  choice: месят тесто
  rationale: Глагол означает именно замешивание теста; выбранное выражение конкретно и общеупотребительно.
- source_word: כַּוָּנִים
  choice: лепёшки
  rationale: Слово обозначает особые фигурные хлебные изделия культового назначения; «лепёшки» передаёт предмет без избыточного толкования.
- source_word: מְלֶכֶת הַשָּׁמַיִם
  choice: Царицы Небесной
  rationale: Традиционное и наиболее вероятное в данном контексте понимание выражения как титула богини; прописные буквы показывают функцию собственного титула.
- source_word: וְהַסֵּךְ נְסָכִים
  choice: и совершать возлияния
  rationale: Передаёт культовое действие ясно и без неестественного русского повтора «возливать возлияния».
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Буквально передаёт определение «другие», не добавляя значения «чужеземные».
- source_word: לְמַעַן הַכְעִסֵנִי
  choice: вызывая у Меня гнев
  rationale: Передаёт каузативный смысл глагола и допускаемую конструкцией смысловую грань цели или результата, не делая намерение единственно возможным.
theological_decisions:
- issue: Идентификация מְלֶכֶת הַשָּׁמַיִם
  choice: Царица Небесная
  alternative: небесное воинство / дело небесное
  rationale: Домашние культовые действия и приношения в этом стихе направлены личному божеству; такое прочтение также лучше соответствует повторному употреблению выражения в книге Иеремии. Спорное альтернативное понимание сохранено в сноске, а не устранено.
- issue: Цель или результат לְמַעַן הַכְעִסֵנִי
  choice: вызывая у Меня гнев
  alternative: чтобы вызвать у Меня гнев
  rationale: Еврейская конструкция может выражать цель или итог. Деепричастный оборот сохраняет обвинительный смысл, не утверждая однозначно, что гнев Бога был сознательной конечной целью участников обряда.
translation_notes:
  register: Современный литературный русский язык с ясной, ритмичной трёхчастной структурой. Конкретные бытовые действия переданы общепонятными словами, а культовое «возлияния» сохранено как точный и уместный библейский термин. Местоимение «Меня» написано с прописной буквы согласно принятой русской библейской традиции.
