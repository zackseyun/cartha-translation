revisions:
- from: Дети собирают дрова, отцы разжигают огонь, а женщины месят тесто, чтобы печь лепёшки для Царицы Небесной[a] и совершать возлияния другим богам, вызывая у Меня гнев.
  to: Дети собирают дрова, отцы разжигают огонь, а женщины месят тесто, чтобы изготавливать лепёшки для Царицы Небесной[a] и совершать возлияния другим богам, чтобы разгневать Меня.
  rationale: Исправление устраняет невыраженное в оригинале указание на выпекание, точнее передаёт целевую конструкцию и приводит сноску в соответствие с предоставленным английским аудиторским следом, не устраняя отмеченную текстовую неоднозначность.
