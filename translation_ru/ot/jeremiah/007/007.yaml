  text: then I will let you dwell in this place[b][a], in the land that I gave to your fathers from of old and forever.
translation:
  language: ru
  text: то Я дам вам жить на этом месте, на земле, которую Я дал вашим отцам[a], — с давних времён и навсегда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вашим предкам». Буквально: «вашим отцам».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от века и до века»; выражение охватывает далёкое прошлое и неопределённое будущее.'
    reason: semantic_ambiguity
lexical_decisions:
- source_word: וְשִׁכַּנְתִּי
  choice: то Я дам вам жить
  rationale: 'Порода hифиль передаёт каузативное значение: Бог даст народу жить или оставаться в земле. Формулировка естественна по-русски и не превращает глагол в «Я буду жить с вами», что неверно передало бы объект.'
- source_word: בַּמָּקוֹם הַזֶּה
  choice: на этом месте
  rationale: Сохранены как общее существительное «место», так и указательное значение; конкретизация как храм, Иерусалим или Иудея в текст не вносится.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: Здесь אֶרֶץ обозначает землю, данную предкам, а не весь мир; русское управление «жить на земле» звучит естественно.
- source_word: אֲשֶׁר נָתַתִּי
  choice: которую Я дал
  rationale: Придаточное предложение прямо и естественно передаёт совершившееся дарование земли.
- source_word: לַאֲבוֹתֵיכֶם
  choice: вашим отцам
  rationale: Сохраняется буквальное мужское обозначение אָבוֹת; более обобщённое «предкам» отмечено как допустимая альтернатива.
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  choice: с давних времён и навсегда
  rationale: Первое עוֹלָם указывает назад, к отдалённому прошлому, второе — вперёд, к неопределённому будущему. Перевод сохраняет эту временную протяжённость, не усиливая выражение до метафизического «от вечности до вечности».
theological_decisions:
- issue: Означает ли обещание безусловное и неизменное владение землёй
  choice: Передать его как следствие условий, изложенных в предыдущих стихах, не добавляя формулы безусловности.
  alternative: Сформулировать как абсолютное обещание земли независимо от послушания завету.
  rationale: Союз «то» связывает стих с предшествующим условным призывом исправить пути и поступки. При этом сам факт дарования земли отцам сохранён без разрешения более широкого богословского спора.
- issue: К чему синтаксически относится временное выражение לְמִן עוֹלָם וְעַד עוֹלָם
  choice: Пунктуационно связать его со всем утверждением о данной отцам земле, сохранив некоторую широту отнесения.
  alternative: Однозначно отнести выражение только к глаголу «дал» либо только к будущему проживанию.
  rationale: Еврейский порядок слов допускает смысловую связь с даром земли и его длительностью; тире не заставляет искусственно выбрать лишь один узкий синтаксический вариант.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. «Дам вам жить» передаёт каузатив без тяжеловесного «поселю» и в контексте может подразумевать продолжение проживания. Местоимение «Я» написано с прописной буквы по принятой русской библейской традиции.
