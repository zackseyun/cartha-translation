  text: הַֽ/אֵינְ/ךָ֣ רֹאֶ֔ה מָ֛ה הֵ֥מָּה עֹשִׂ֖ים בְּ/עָרֵ֣י יְהוּדָ֑ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/017.yaml
  text: Do you not see what they are doing in the cities of Judah and in the streets of Jerusalem?[a]
translation:
  language: ru
  text: Разве ты не видишь, что они делают в городах Иудеи и на улицах Иерусалима?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на площадях» или «на открытых местах Иерусалима».'
    reason: Лексема חֻצוֹת может обозначать улицы, площади либо открытые общественные места города.
lexical_decisions:
- source_word: הַאֵינְךָ רֹאֶה
  choice: Разве ты не видишь
  rationale: Риторический вопрос с отрицанием и обращением во 2-м лице единственного числа естественно передаётся по-русски оборотом «Разве ты не видишь», сохраняя прямое обращение и побуждение признать очевидное.
- source_word: מָה הֵמָּה עֹשִׂים
  choice: что они делают
  rationale: «Что» вводит содержание видимого, самостоятельное местоимение הֵמָּה передано как «они», а причастие עֹשִׂים — формой настоящего времени, указывающей на продолжающиеся действия.
- source_word: בְּעָרֵי יְהוּדָה
  choice: в городах Иудеи
  rationale: Сохраняется прямое пространственное значение предлога и конструктивная связь существительных.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: и на улицах Иерусалима
  rationale: В данном городском контексте חֻצוֹת естественно передать как «улицы»; русский язык требует предлога «на». Возможные значения «площади» и «открытые места» отмечены в сноске.
