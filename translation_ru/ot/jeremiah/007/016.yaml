  text: וְ/אַתָּ֞ה אַל תִּתְפַּלֵּ֣ל בְּעַד הָ/עָ֣ם הַ/זֶּ֗ה וְ/אַל תִּשָּׂ֧א בַעֲדָ֛/ם רִנָּ֥ה וּ/תְפִלָּ֖ה וְ/אַל תִּפְגַּע בִּ֑/י כִּי אֵינֶ֥/נִּי שֹׁמֵ֖עַ אֹתָֽ/ךְ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/016.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, and do not intercede with me[b], for I am not listening to you.
translation:
  language: ru
  text: А ты не молись за этот народ, не возноси за них ни вопля, ни молитвы и не ходатайствуй передо Мной[a], потому что Я не слушаю тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не умоляй Меня»; еврейский глагол может обозначать настойчивую просьбу или ходатайство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что Я не услышу тебя». Еврейскую форму можно понимать и в будущем смысле, хотя причастие также допускает перевод «Я не слушаю тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Союз с самостоятельным местоимением выделяет Иеремию и выражает контраст; по-русски это естественно передаётся сочетанием «А ты».
- source_word: אַל תִּתְפַּלֵּל
  choice: не молись
  rationale: אַל с имперфектом выражает прямой запрет; отрицательный императив естественен в современном русском языке.
- source_word: בְּעַד הָעָם הַזֶּה
  choice: за этот народ
  rationale: Предлог בְּעַד обозначает действие в пользу или от имени другого; «молиться за» — точное и естественное русское сочетание.
- source_word: וְאַל תִּשָּׂא
  choice: не возноси
  rationale: נשא буквально означает «поднимать, возносить»; с обозначениями молитвы русское «возносить» сохраняет образ и остаётся понятным.
- source_word: רִנָּה וּתְפִלָּה
  choice: ни вопля, ни молитвы
  rationale: רִנָּה здесь означает громкий, настойчивый молитвенный крик, а תְּפִלָּה — молитву. Конструкция «ни… ни…» естественно передаёт охват обоих понятий в запрете.
- source_word: בַעֲדָם
  choice: за них
  rationale: Местоименный суффикс относится к народу; краткая формулировка сохраняет смысл заступничества и избегает тяжеловесности.
- source_word: וְאַל תִּפְגַּע בִּי
  choice: и не ходатайствуй передо Мной
  rationale: В данном молитвенном контексте Hiphil глагола פגע означает настойчиво обращаться, просить или ходатайствовать. «Ходатайствовать передо Мной» ясно передаёт заступничество, не исключая оттенка настойчивой мольбы.
- source_word: כִּי אֵינֶנִּי שֹׁמֵעַ אֹתָךְ
  choice: потому что Я не слушаю тебя
  rationale: Отрицательная конструкция с причастием поддерживает настоящее, продолжающееся значение. «Не слушаю» также может выражать отказ внимать просьбе, а не физическую неспособность слышать.
theological_decisions:
- issue: Характер запрета на ходатайство Иеремии
  choice: Прямой и настойчивый запрет пророку ходатайствовать за народ в данный момент суда
  alternative: Гиперболическое предостережение, а не действительный запрет
  rationale: Три последовательных запрета с אַל и заключительное объяснение указывают на реальный запрет в непосредственном контексте. Перевод сохраняет его суровость, не делая более широких догматических выводов.
- issue: Временной оттенок Божьего ответа
  choice: «Я не слушаю тебя»
  alternative: «Я не услышу тебя»
  rationale: Причастная форма допускает настоящее, продолжающееся значение, тогда как контекст может позволять и будущее понимание. Основной текст передаёт аспект настоящего, а сноска сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. «Передо Мной» выбрано ради благозвучия перед сочетанием согласных. Прописные местоимения в обращении Бога к Себе соответствуют распространённой русской библейской издательской норме. Термин «вопль» сохраняет силу רִנָּה, а повтор отрицаний подчёркивает тройной запрет.
