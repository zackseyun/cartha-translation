base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/009.yaml
  text: Will you steal[a], murder, commit adultery, swear falsely, burn incense to Baal[b], and go after other gods that you have not known—
translation:
  language: ru
  text: Неужели вы будете красть, убивать, прелюбодействовать, ложно клясться, воскурять благовония Ваалу и следовать за другими богами, которых вы прежде не знали, —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲ/גָנֹב
  choice: Неужели вы будете красть
  rationale: Вопросительная частица הֲ открывает риторический вопрос, а последовательность инфинитивов перечисляет проступки. «Неужели» естественно передаёт обличительный тон; будущее время согласуется с развитием вопроса в контексте.
- source_word: רָצֹחַ
  choice: убивать
  rationale: В данном нравственно-правовом перечне רצח обозначает противоправное лишение жизни. Русское «убивать» в сочетании с остальными запретами звучит естественно; контекст исключает нейтральное понимание любого причинения смерти.
- source_word: וְ/נָאֹף
  choice: прелюбодействовать
  rationale: נאף — обычный древнееврейский глагол для супружеской неверности; выбран прямой и точный русский эквивалент.
- source_word: וְ/הִשָּׁבֵעַ לַ/שֶּׁקֶר
  choice: давать ложные клятвы
  rationale: Оборот означает ложно клясться или подтверждать ложь клятвой. Такой перевод ясно сохраняет юридико-нравственный смысл и естественен по-русски.
- source_word: וְ/קַטֵּר לַ/בָּעַל
  choice: воскурять благовония Ваалу
  rationale: В культовом контексте קטר означает сжигать благовония или совершать дымное приношение. «Воскурять благовония» понятно современному читателю и сохраняет культовую конкретность действия.
- source_word: וְ/הָלֹךְ אַחֲרֵי
  choice: следовать за
  rationale: Древнееврейский оборот буквально выражает хождение вслед за кем-либо и переносно — приверженность ему. «Следовать за» естественно передаёт оба оттенка без излишней архаизации.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другими богами
  rationale: Прямое значение выражения — «другие боги»; вариант «чужие боги» был бы более истолковательным.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: которых вы не знали
  rationale: 'Буквальный широкий перевод сохраняет возможные оттенки ידע: знание, признание и опыт отношений, не сводя выражение к одному истолкованию.'
theological_decisions:
- issue: Характер «знания» других богов
  choice: которых вы не знали
  alternative: которых вы не признавали
  rationale: ידע может подразумевать не только осведомлённость, но также признание или отношения. Основной текст сохраняет более широкое «знали», не разрешая богословскую напряжённость истолковательным переводом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторический вопрос передан через «неужели»; тире в конце сохраняет незавершённость синтаксиса и переход к продолжению вопроса в следующем стихе. Архаичное «кадить» заменено ясным выражением «воскурять благовония».
