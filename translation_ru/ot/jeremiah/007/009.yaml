  source_fidelity: Перечень действий и риторическая форма переданы верно. רצח в данном контексте относится к противоправному убийству; «убивать» допустимо, хотя не маркирует это так явно, как английское «murder». Перфект в אשר לא ידעתם лучше передать с указанием предшествующего незнания, а не простым прошедшим временем, которое в русском может звучать как завершённое состояние.
