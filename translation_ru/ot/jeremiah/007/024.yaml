  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹֽא הִטּ֣וּ אֶת אָזְנָ֔/ם וַ/יֵּֽלְכוּ֙ בְּ/מֹ֣עֵצ֔וֹת בִּ/שְׁרִר֖וּת לִבָּ֣/ם הָ/רָ֑ע וַ/יִּהְי֥וּ לְ/אָח֖וֹר וְ/לֹ֥א לְ/פָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/024.yaml
  text: But they did not listen[a], and they did not incline their ear, but walked in their own counsels, in the stubbornness of their evil heart[c][b], and they went backward and not forward.
translation:
  language: ru
  text: Но они не слушали[a] и не склоняли уха, а поступали по собственным замыслам[b], следуя упрямству своего злого сердца[c], и шли назад, а не вперёд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не внимали»; глагол может означать как слышание, так и такое слушание, которое ведёт к послушанию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по собственным планам» или «по собственным ухищрениям».'
    reason: lexical_alternative
  - marker: c
    text: В древнееврейском «сердце» — это внутренний центр мыслей, воли и решений, а не только чувств.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: не слушали
  rationale: Глагол שׁמע охватывает значения «слышать», «слушать» и «слушаться». В сочетании с выражением «не склоняли уха» речь идёт о сознательном невнимании; «не слушали» передаёт это, не сужая смысл до одного лишь непослушания.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: не склоняли уха
  rationale: Сохранена понятная по-русски телесная метафора внимательного слушания; более разъяснительное «не внимали» устранило бы образ исходного текста.
- source_word: וַיֵּלְכוּ
  choice: поступали
  rationale: הלך с предлогом ב здесь обозначает образ действий или поведение. Русское «поступали» естественно передаёт этот смысл, тогда как буквальное «ходили в замыслах» звучало бы неясно.
- source_word: בְּמֹעֵצוֹת
  choice: по собственным замыслам
  rationale: Форма множественного числа обозначает планы, решения или советы; местоименный суффикс передан словом «собственным». «Замыслы» сохраняет как мыслительный, так и волевой оттенок.
- source_word: בִּשְׁרִרוּת
  choice: следуя упрямству
  rationale: שְׁרִרוּת у Иеремии обозначает упорное своеволие. Оборот «следуя упрямству» естественно связывает это слово с описанием поведения, сохраняя его отрицательную нравственную оценку.
- source_word: לִבָּם הָרָע
  choice: своего злого сердца
  rationale: Сохранены единственное число и образ «сердца», которое в древнееврейском обозначает внутренний центр мыслей, решений и воли, а не только чувств.
- source_word: וַיִּהְיוּ לְאָחוֹר וְלֹא לְפָנִים
  choice: шли назад, а не вперёд
  rationale: Так передан направительный контраст между отступлением и движением вперёд. Перевод не подменяет данные слова близким, но отсутствующим здесь образом спины и лица.
theological_decisions:
- issue: Нравственная характеристика «злого сердца»
  choice: Сохранить прямое определение «злого сердца» без догматического расширения.
  alternative: Передать как «греховной природы» или усилить до «совершенно злого сердца».
  rationale: Текст прямо называет сердце народа злым и говорит о его упрямстве, но не формулирует здесь более широкого учения о природе человека или его заветном статусе.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Сохранено выражение «склоняли уха», поскольку оно понятно и передаёт метафору оригинала; буквальное «ходили в замыслах» заменено естественным «поступали по замыслам». Союзная последовательность и финальный контраст следуют движению древнееврейской фразы.
