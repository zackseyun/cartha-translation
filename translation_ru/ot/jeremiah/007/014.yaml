base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/014.yaml
  text: So I will do to the house that is called by my name[a], in which you trust, and to the place that I gave to you and to your fathers[b], just as I did to Shiloh.
translation:
  language: ru
  text: То Я поступлю с домом, который носит Моё имя[a] и на который вы полагаетесь, и с местом, которое Я дал вам и вашим отцам, так же, как поступил с Силомом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «над которым призвано Моё имя». Этот еврейский оборот означает, что дом принадлежит Господу и связан с Ним.'
    reason: lexical_alternative
  - marker: b
    text: Силом был прежним местом, где находилось святилище; он служит предостерегающим примером Божьего суда. См. 1 Царств 4; Иеремия 7:12.
    reason: cross_reference
lexical_decisions:
- source_word: וְעָשִׂתִי
  choice: то Я поступлю
  rationale: Союз связывает угрозу с предшествующими словами и в данном контексте имеет оттенок следствия. Оборот «поступить с» естественно передаёт עשה с ל, сохраняя зловещую недосказанность относительно самого действия.
- source_word: לַבַּיִת
  choice: с домом
  rationale: Сохранено буквальное «дом», обозначающее здесь храм; это также удерживает различие между храмовым зданием и более широким «местом».
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: который носит Моё имя
  rationale: Естественный современный русский эквивалент еврейского оборота, указывающего на принадлежность дома Господу и его отождествление с Ним; буквальная форма приведена в примечании.
- source_word: אֲשֶׁר אַתֶּם בֹּטְחִים בּוֹ
  choice: на который вы полагаетесь
  rationale: Причастная форма выражает продолжающуюся уверенность или опору на храм. «Полагаетесь» ясно передаёт эту ложную уверенность и сохраняет управление предлогом.
- source_word: וְלַמָּקוֹם
  choice: и с местом
  rationale: '«Место» сохранено отдельно от «дома»: речь может идти о священном месте или городе шире, чем только храмовое здание. Указательное «этим» не добавлено, поскольку его нет в еврейском тексте.'
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: которое Я дал вам и вашим отцам
  rationale: Повторяющийся предлог ל естественно передан русскими дательными формами. «Отцам» сохраняет прямое обозначение предшествующих поколений в исходном тексте.
- source_word: כַּאֲשֶׁר עָשִׂיתִי לְשִׁלֹה
  choice: так же, как поступил с Силомом
  rationale: Сравнение с прежним святилищем передано прямо, а еврейское название שִׁלֹה дано в принятой русской библейской форме «Силом».
theological_decisions:
- issue: Передача языка принадлежности святилища Богу
  choice: дом, который носит Моё имя
  alternative: дом, над которым призвано Моё имя; храм, названный Моим именем
  rationale: Выбранная формулировка ясно передаёт принадлежность и связь с Господом, не вводя позднейшего богословского толкования. Буквальный образ сохранён в примечании.
- issue: Различение «дома» и «места»
  choice: сохранить оба разных существительных
  alternative: передать оба как храм или святилище
  rationale: Исходный текст различает храмовое здание и более широкое место. Это сохраняет масштаб пророческой угрозы без искусственного уточнения.
- issue: Передача אֲבוֹתֵיכֶם
  choice: вашим отцам
  alternative: вашим предкам
  rationale: «Отцам» непосредственно соответствует исходному слову и сохраняет его заветно-историческое звучание; контекст не требует обобщающей замены.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет нарастающую структуру еврейской угрозы; архаизмы вроде «наречено имя» устранены, но ключевые образы «дом», «место» и «отцы» сохранены.
