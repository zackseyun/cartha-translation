  text: כִּ֣י לְכוּ נָ֗א אֶל מְקוֹמִ/י֙ אֲשֶׁ֣ר בְּ/שִׁיל֔וֹ אֲשֶׁ֨ר שִׁכַּ֧נְתִּֽי שְׁמִ֛/י שָׁ֖ם בָּ/רִֽאשׁוֹנָ֑ה וּ/רְאוּ֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתִי ל֔/וֹ מִ/פְּנֵ֕י רָעַ֖ת עַמִּ֥/י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/012.yaml
  text: For go now to my place that was in Shiloh[a], where I made my name dwell at first, and see what I did to it because of the evil of my people Israel.
translation:
  language: ru
  text: Ибо пойдите теперь к Моему месту в Силоме, где Я прежде дал пребывать Моему имени[a], и посмотрите, что Я с ним сделал из-за зла Моего народа Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «где Я прежде поселил Моё имя»; традиционно: «где Я прежде утвердил Моё имя». Еврейский текст сохраняет образ пребывания Божьего имени в этом месте.'
    reason: Лексическая альтернатива и пояснение образного выражения о Божьем имени.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего предостережения; «ибо» ясно передаёт причинно-пояснительную связь и сохраняет достоинство пророческой речи.
- source_word: לְכוּ נָא
  choice: пойдите теперь
  rationale: Форма множественного числа с частицей נָא выражает настойчивое побуждение; «теперь» естественно передаёт его срочность без оттенка вежливой просьбы.
- source_word: מְקוֹמִי אֲשֶׁר בְּשִׁלוֹ
  choice: к Моему месту в Силоме
  rationale: «Моё место» прямо передаёт принадлежность места Богу, а предложная конструкция естественно обозначает прежнее святилище, находившееся в Силоме.
- source_word: שִׁכַּנְתִּי שְׁמִי שָׁם
  choice: где Я прежде поселил Моё имя
  rationale: Глагол сохраняет еврейский образ пребывания Божьего имени; «поселил» по-русски звучит естественнее буквального каузатива «сделал обитающим».
- source_word: בָּרִאשׁוֹנָה
  choice: прежде
  rationale: Наречие указывает на более ранний этап истории святилища; «прежде» кратко и естественно в данном контексте.
- source_word: וּרְאוּ
  choice: и посмотрите
  rationale: Продолжает цепь повелений и призывает осмыслить исторический пример суда.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי לוֹ
  choice: что Я сделал с ним
  rationale: Местоименный суффикс наиболее естественно относится к «Моему месту»; русский мужской род согласуется со словом «место» в форме местоимения после предлога.
- source_word: מִפְּנֵי רָעַת עַמִּי יִשְׂרָאֵל
  choice: за зло Моего народа Израиля
  rationale: מִפְּנֵי обозначает причину суда, а רָעָה здесь имеет нравственный смысл. «За зло» одновременно передаёт причину и судебно-возмездный оттенок контекста.
theological_decisions:
- issue: Образ Божьего присутствия в שִׁכַּנְתִּי שְׁמִי שָׁם
  choice: где Я прежде поселил Моё имя
  alternative: где Я прежде утвердил Моё имя
  rationale: Выбранный вариант сохраняет подлинный образ пребывания имени и не отождествляет Божье существо с физическим святилищем. Альтернатива понятна, но ослабляет образ глагола שכן.
- issue: Временной смысл упоминания Силома
  choice: к Моему месту в Силоме, где Я прежде…
  alternative: к Моему месту, которое было в Силоме
  rationale: Наречие «прежде» и последующее указание на совершившийся суд достаточно ясно показывают, что речь идёт о прежнем святилище; конструкция не добавляет в относительное предложение отсутствующую в еврейском тексте связку прошедшего времени.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис остаётся близким к еврейской последовательности повелений, но не звучит калькированно. Прописные местоимения при обращении Бога к Себе использованы согласно принятой русской библейской традиции.
