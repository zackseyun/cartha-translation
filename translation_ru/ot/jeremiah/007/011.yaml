source:
  edition: WLC
  text: הַ/מְעָרַ֣ת פָּרִצִ֗ים הָיָ֨ה הַ/בַּ֧יִת הַ/זֶּ֛ה אֲשֶׁר נִקְרָֽא שְׁמִ֥/י עָלָ֖י/ו בְּ/עֵינֵי/כֶ֑ם גַּ֧ם אָנֹכִ֛י הִנֵּ֥ה רָאִ֖יתִי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/011.yaml
  text: Has this house[a], which is called by my name, become a den of robbers in your eyes? Even I myself, look, I have seen it, declares Yahweh.
translation:
  language: ru
  text: Неужели этот дом, который носит Моё имя, стал в ваших глазах притоном разбойников?[a] И Я Сам — вот, Я видел это, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пещерой жестоких беззаконников»; или: «логовом грабителей». Еврейское выражение может указывать не только на грабителей, но и более широко — на жестоких, беззаконных людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעָרַת
  choice: притоном
  rationale: Слово обозначает пещеру или логово, служащее укрытием. В сочетании с פָּרִצִים русское «притон» естественно передаёт место, где укрываются преступники, сохраняя обвинительный образ.
- source_word: פָּרִצִים
  choice: разбойничьим
  rationale: Слово может обозначать грабителей, разбойников или вообще жестоких беззаконников. «Разбойничий» передаёт и насилие, и хищническую преступность, не сужая смысл до тайной кражи.
- source_word: הָיָה
  choice: стал
  rationale: 'Перфект היה в данном риторическом вопросе естественно допускает результативное значение: дом превратили в убежище преступников.'
- source_word: הַבַּיִת הַזֶּה
  choice: этот дом
  rationale: Сохранено буквальное «этот дом»; из контекста ясно, что речь идёт о храме.
- source_word: נִקְרָא שְׁמִי עָלָיו
  choice: над которым провозглашено Моё имя
  rationale: Еврейская формула буквально говорит о призывании или провозглашении имени над кем-либо или чем-либо и выражает принадлежность Богу. Такой перевод сохраняет образ и не сводит его к простому наименованию.
- source_word: בְּעֵינֵיכֶם
  choice: в ваших глазах
  rationale: Сохранён естественный русский эквивалент еврейской оценочной идиомы.
- source_word: גַּם אָנֹכִי
  choice: Но и Я
  rationale: 'גַּם и усиленное אָנֹכִי подчёркивают противопоставление человеческому взгляду: Бог со Своей стороны также видел происходящее.'
- source_word: הִנֵּה
  choice: вот
  rationale: «Вот» служит современным и достойным маркером привлечения внимания, соответствующим הִנֵּה.
- source_word: רָאִיתִי
  choice: Я видел это
  rationale: Перфект передан прошедшим временем с подразумеваемым объектом «это», необходимым для естественного русского синтаксиса.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана весомо и современно; «возвещает» подчёркивает характер авторитетного Божьего изречения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; «Яхве» сохраняет его как имя без подмены титулом.
- issue: Результативное или стативное значение הָיָה
  choice: стал
  alternative: является; был
  rationale: В контексте обличительного риторического вопроса «стал» передаёт превращение храма в убежище беззаконников, сохраняя допустимую результативную силу формы.
- issue: Значение формулы נִקְרָא שְׁמִי עָלָיו
  choice: над которым провозглашено Моё имя
  alternative: который назван Моим именем; который носит Моё имя
  rationale: Выбранный вариант сохраняет древнееврейскую формулу Божьего притязания и принадлежности, не истолковывая её лишь как присвоение названия.
translation_notes:
  register: Современный литературный русский с пророческой торжественностью. Риторический вопрос и повтор «Я — вот, Я» сохраняют напряжение и эмфазу еврейского текста; пунктуация делает эту эмфазу понятной без архаизации.
