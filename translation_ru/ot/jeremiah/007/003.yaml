  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַֽעַלְלֵי/כֶ֑ם וַ/אֲשַׁכְּנָ֣ה אֶתְ/כֶ֔ם בַּ/מָּק֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/003.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Make your ways and your deeds good[b], and I will let you dwell in this place.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств, Бог Израиля: «Исправьте свои пути и поступки[a], и Я позволю вам жить в этом месте[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделайте хорошими свои пути и поступки»; также возможно: «измените к лучшему».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и Я поселю вас в этом месте»; возможно также: «и Я позволю вам остаться в этом месте».'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула передачи Божьего слова; сохраняет торжественный ритм и естественно звучит по-русски.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией, а צְבָאוֹת — широким традиционным словом «Воинств», не сужающим смысл только до земных армий.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача сочетания в сопряжённом состоянии.
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: Исправьте свои пути и поступки
  rationale: Каузативный императив от יטב требует деятельного нравственного изменения. «Исправьте» естественно выражает это по-русски, а «пути и поступки» сохраняет различие между образом жизни и конкретными делами.
- source_word: וַאֲשַׁכְּנָה אֶתְכֶם
  choice: и Я позволю вам жить
  rationale: Hiphil глагола שכן допускает значения «поселить», «дать жить» и в данном контексте «позволить остаться». Основной вариант передаёт условие дальнейшего проживания, не устраняя оттенок Божьего действия.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: на этом месте
  rationale: Сохраняет намеренно широкий референт מָקוֹם, который в контексте может охватывать храм, Иерусалим и землю, не подменяя его более узким словом «земля».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное Божье имя, не заменяя его титулом и не навязывая конфессиональную традицию произношения «Иегова».
- issue: Значение וַאֲשַׁכְּנָה אֶתְכֶם в контексте заветного предостережения
  choice: и Я позволю вам жить
  alternative: и Я поселю вас; и Я позволю вам остаться
  rationale: Выбранная формулировка сохраняет напряжение между суверенным Божьим действием и продолжением проживания народа при условии исправления, не сводя смысл только к переселению или только к неизменному пребыванию.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Формула «Так говорит» и титул «Яхве Воинств» сохраняют библейскую торжественность, тогда как «исправьте свои пути и поступки» остаётся ясным для обычного читателя. Местоимение «Я» написано с прописной буквы как уважительная издательская конвенция.
