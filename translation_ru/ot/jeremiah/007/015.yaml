base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/015.yaml
  text: And I will cast you out from before me[a], just as I cast out all your brothers[c][b], all the offspring of Ephraim.
translation:
  language: ru
  text: И Я отброшу вас от лица Моего[a], как отбросил всех ваших братьев[b] — всё потомство Ефрема[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от Моего лица»; то есть прочь от Моего присутствия.'
    reason: lexical_alternative
  - marker: b
    text: «Братьями» названы соплеменники жителей Иудеи — израильтяне северного царства.
    reason: cultural_note
  - marker: c
    text: Ефрем здесь обозначает северное царство Израиля.
    reason: metonymy_note
lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי
  choice: И Я отвергну
  rationale: В породе hифиль глагол שׁלך выражает решительное удаление или изгнание. «Отвергну» естественно сочетается с оборотом «от Моего лица» и передаёт судебную силу образа, не сводя его лишь к физическому броску.
- source_word: אֶתְכֶם
  choice: вас
  rationale: Прямое дополнение во втором лице мужского рода множественного числа.
- source_word: מֵעַל פָּנָי
  choice: от Моего лица
  rationale: Близко передаёт буквальный образ «от/с поверхности Моего лица» и сохраняет смысл удаления от Божьего присутствия, не разрешая идиому чрезмерно истолковывающим переводом.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Естественно вводит сопоставление предстоящего суда над Иудеей с прежним судом над северным царством.
- source_word: הִשְׁלַכְתִּי
  choice: отверг
  rationale: Повтор того же русского глагола сохраняет намеренный лексический повтор еврейского текста.
- source_word: כָּל אֲחֵיכֶם
  choice: всех ваших братьев
  rationale: Сохраняет родственный образ אָח и мужское множественное число; здесь речь идёт о соплеменниках-иְзраильтянах из северного царства.
- source_word: אֵת כָּל זֶרַע אֶפְרָיִם
  choice: всё потомство Ефрема
  rationale: זֶרַע обозначает совокупность потомков. «Потомство» естественно в современном литературном русском и сохраняет имя Ефрем, не подменяя его толкованием.
theological_decisions:
- issue: Смысл формулы удаления מֵעַל פָּנָי
  choice: от Моего лица
  alternative: с глаз Моих; прочь от Моего присутствия
  rationale: Выбранный вариант сохраняет антропоморфный образ Божьего лица и выраженную в нём судебную отвергнутость, не вводя дополнительных утверждений о природе Божьего присутствия.
- issue: Значение אֲחֵיכֶם
  choice: ваших братьев
  alternative: ваших соплеменников; ваших родичей
  rationale: «Братья» сохраняет семейно-заветную риторику оригинала; примечание поясняет, что подразумеваются другие израильтяне.
- issue: Метонимическое употребление имени Ефрем
  choice: Ефрем сохранён в основном тексте
  alternative: северное царство Израиля
  rationale: Оригинал прямо называет Ефрема. Его коллективное значение разъясняется в примечании, а не внедряется в перевод.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Сохранены повтор глагола, родственный образ «братьев» и метонимия «Ефрем». Тире перед уточняющим приложением помогает ясно показать, что «всё потомство Ефрема» поясняет, кого именно называют братьями.
