base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/022.yaml
  text: For I did not speak to your fathers or command them on the day I brought them out of the land of Egypt concerning burnt offering and sacrifice[a][b][c].
translation:
  language: ru
  text: Ибо в тот день, когда Я вывел их из земли Египетской, Я не говорил с вашими отцами и не давал им повелений относительно всесожжения и жертвы[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насчёт всесожжений и жертв». Вероятно, это резкое пророческое противопоставление: главным требованием завета было послушание, а не жертвенный обряд; ср. следующий стих.'
    reason: lexical_alternative
  - marker: b
    text: Эти слова не обязательно отрицают, что постановления о жертвах вообще были даны; в данном контексте они могут подчёркивать различие в приоритетах.
    reason: theological_tension
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим обличением, не делая её чрезмерно жёсткой.
- source_word: לֹא דִבַּרְתִּי
  choice: Я не говорил
  rationale: Прямо сохраняет обычное значение דבר и резкую форму отрицания в еврейском тексте.
- source_word: אֶת אֲבוֹתֵיכֶם
  choice: вашим отцам
  rationale: Сохраняет исторически конкретный и традиционный библейский оборот, относящийся к праотцам Израиля.
- source_word: וְלֹא צִוִּיתִים
  choice: и не давал им повелений
  rationale: Естественно по-русски передаёт צוה и сохраняет параллельное отрицание.
- source_word: בְּיוֹם הוציא אוֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: в тот день, когда вывел их из земли Египетской
  rationale: Сохраняет буквальную временную привязку בְּיוֹם к исходу; подразумеваемое подлежащее «Я» ясно из контекста.
- source_word: עַל דִּבְרֵי
  choice: о
  rationale: Кратко и естественно вводит предмет речи или повеления.
- source_word: עוֹלָה
  choice: всесожжении
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: וָזָבַח
  choice: и жертве
  rationale: Сохраняет форму единственного числа и категориальное употребление זבח.
theological_decisions:
- issue: Следует ли смягчить отрицание так, чтобы стих не выглядел как отрицание данных Богом постановлений о жертвах?
  choice: 'Сохранить прямое отрицание: «не говорил… и не давал… повелений… о всесожжении и жертве».'
  alternative: 'Передать как относительный приоритет: «говорил не прежде всего о…» или добавить «поначалу».'
  rationale: Еврейский текст выражает отрицание резко. Перевод должен сохранить пророческое напряжение, а возможное понимание как риторического противопоставления послушания обряду вынести в примечание, а не вносить в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Земля Египетская» и «всесожжение» сохраняют узнаваемую библейскую лексику, тогда как синтаксис остаётся доступным современному читателю.
