  text: הַ/אֹתִ֛/י הֵ֥ם מַכְעִסִ֖ים נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֹתָ֔/ם לְמַ֖עַן בֹּ֥שֶׁת פְּנֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/019.yaml
  text: Is it I whom they are provoking? declares Yahweh. Is it not themselves[a], to the shame of their own faces?
translation:
  language: ru
  text: «Разве не Меня они гневят? — возвещает Яхве. — Разве не себя самих, себе же на позор?[a]»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «ради стыда их лиц»; возможный перевод: «Разве не самих себя они гневят, навлекая на себя позор?»'
    reason: Сохраняет образность еврейского выражения и отмечает возможность связать подразумеваемый во втором вопросе глагол с «себя самих».
lexical_decisions:
- source_word: הַאֹתִי
  choice: Не Меня ли
  rationale: Фронтированное дополнение с вопросительной частицей передаёт эмфатический риторический вопрос и подчёркивает противопоставление «Меня — самих себя».
- source_word: מַכְעִסִים
  choice: гневят
  rationale: Hiphil причастие от כעס означает «вызывать гнев, раздражать». «Гневят» кратко, естественно и сохраняет продолжающийся характер действия в контексте.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана торжественно, но понятно современному читателю; личное имя יהוה транслитерировано как «Яхве».
- source_word: הֲלוֹא אֹתָם
  choice: Не самих ли себя
  rationale: 'Формально אֹתָם значит «их», однако в контрасте с «Меня» местоимение имеет возвратный смысл: последствия их поступков обращаются против них самих.'
- source_word: לְמַעַן בֹּשֶׁת פְּנֵיהֶם
  choice: себе же на стыд
  rationale: Выражение передаёт результат или направленность поступка. Русская идиома сохраняет смысл личного посрамления, не перегружая фразу буквальным «стыдом их лиц».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное божественное имя, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: На кого направлено пагубное действие идолопоклонства
  choice: 'Риторическое противопоставление: они пытаются гневить Яхве, но навлекают стыд на самих себя'
  alternative: Они вовсе не гневят Яхве, а только самих себя
  rationale: 'Два риторических вопроса сохраняют напряжение оригинала: первый признаёт вызывающий характер их действий, второй подчёркивает, что вред и посрамление в итоге обращаются против них.'
translation_notes:
  register: Современный литературный русский язык с краткой, весомой пророческой интонацией. Инверсия «Не Меня ли» сохраняет акцент оригинала; «себе же на стыд» естественно передаёт последствие поступков. Маркер сноски помещён непосредственно в основном тексте.
