  text: גֵּ֣ר יָת֤וֹם וְ/אַלְמָנָה֙ לֹ֣א תַֽעֲשֹׁ֔קוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֣וֹם הַ/זֶּ֑ה וְ/אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים לֹ֥א תֵלְכ֖וּ לְ/רַ֥ע לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/006.yaml
  text: Do not oppress the foreigner[a], the fatherless, and the widow; do not shed innocent blood in this place[c][b]; and do not go after other gods to your own harm.
translation:
  language: ru
  text: Не притесняйте пришельца[a], сироту[b] и вдову, не проливайте невинной крови в этом месте и не ходите вслед за другими богами[c] — себе во вред.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземца»; речь о неуроженце, живущем среди народа.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может обозначать человека, лишённого отца.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не следуйте за другими богами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: пришелец
  rationale: Обозначает неуроженца, постоянно живущего среди Израиля и находящегося в уязвимом общественном положении. «Пришелец» сохраняет особую социальную категорию текста; более современные варианты приведены в примечании.
- source_word: יָתוֹם
  choice: сирота
  rationale: Наиболее естественное современное русское обозначение ребёнка, лишённого родительской защиты; возможный более узкий смысл «лишённый отца» отмечен в примечании.
- source_word: אַלְמָנָה
  choice: вдова
  rationale: Точный и общеупотребительный эквивалент названной в еврейском тексте уязвимой социальной группы.
- source_word: תַעֲשֹׁקוּ
  choice: притесняйте
  rationale: Передаёт несправедливое угнетение и эксплуатацию социально уязвимых людей, не сужая смысл только до имущественного обмана.
- source_word: דָם נָקִי
  choice: невинной крови
  rationale: Сохраняет устойчивое библейское выражение, обозначающее неправедное убийство невиновных.
- source_word: תִּשְׁפְּכוּ
  choice: проливайте
  rationale: В сочетании с «кровью» это естественный русский эквивалент еврейского глагола со значением «лить, проливать».
- source_word: בַּמָּקוֹם הַזֶּה
  choice: на этом месте
  rationale: Прямо сохраняет указание на место произнесения храмовой речи; «здесь» было бы менее явно.
- source_word: אַחֲרֵי ... לֹא תֵלְכוּ
  choice: не ходите вслед за
  rationale: Сохраняет еврейскую метафору хождения вслед за кем-либо, выражающую приверженность и поклонение; более гладкий вариант отмечен в примечании.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другими богами
  rationale: Прямой эквивалент, не добавляющий отсутствующего в тексте этнического оттенка «чужеземные».
- source_word: לְרַע לָכֶם
  choice: себе во вред
  rationale: Естественно передаёт пагубное последствие для самих слушателей, сохраняя смысловую связь с запретом следовать другим богам.
theological_decisions:
- issue: Наименование трёх уязвимых общественных групп
  choice: пришельца, сироту и вдову
  alternative: чужеземца, лишённого отца и вдову
  rationale: Сохранены три конкретные заветные социальные категории, а не обобщающее обозначение «уязвимые»; при этом естественное русское «сирота» не превращено в неуклюжую кальку.
- issue: Связь выражения לְרַע לָכֶם с предшествующим запретом
  choice: не ходите вслед за другими богами — себе во вред
  alternative: не ходите вслед за другими богами, чтобы не навлечь на себя беду
  rationale: 'Краткая конструкция сохраняет формальную неоднозначность оттенка: речь может идти как о результате, так и о предостережении, и не превращает её в явно выраженную цель.'
translation_notes:
  register: Современный литературный русский с сохранением достоинства и ритма пророческого увещевания. «Пришелец» и «ходить вслед» слегка отмечены библейским регистром, но понятны из контекста; примечания дают более современные варианты. Тире перед «себе во вред» проясняет смысловую связь, не устраняя возможного оттенка результата или предостережения.
