  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי עָשׂ֨וּ בְנֵי יְהוּדָ֥ה הָ/רַ֛ע בְּ/עֵינַ֖/י נְאֻום יְהוָ֑ה שָׂ֣מוּ שִׁקּֽוּצֵי/הֶ֗ם בַּ/בַּ֛יִת אֲשֶׁר נִקְרָא שְׁמִ֥/י עָלָ֖י/ו לְ/טַמְּאֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/030.yaml
  text: For the sons of Judah have done what is evil in my sight[a], declares Yahweh. They have put their abominations in the house that is called by my name[c][b], to defile it.
translation:
  language: ru
  text: Ведь сыны Иуды сделали зло в Моих глазах, — возвещает Яхве. Они поставили свои мерзости в доме, носящем Моё имя[a], чтобы осквернить его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть в храме в Иерусалиме. Буквально: «в доме, над которым призвано Моё имя»; эта древнееврейская формула указывает, что дом принадлежит Яхве и связан с Его именем.'
    reason: Культурное пояснение и буквальная передача древнееврейской идиомы.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Связывает обвинение с предшествующим контекстом как его основание или объяснение; в современном русском «ведь» естественно передаёт эту функцию.
- source_word: בְנֵי יְהוּדָה
  choice: сыны Иуды
  rationale: Сохраняет родственное выражение оригинала; возвышенное, но понятное в библейском литературном регистре.
- source_word: עָשׂוּ ... הָרַע
  choice: делали зло
  rationale: Естественно передаёт совершённое деяние без навязывания русскому тексту видо-временной конкретизации, которой древнееврейская форма сама по себе не требует.
- source_word: בְּעֵינַי
  choice: в Моих глазах
  rationale: Сохраняет прозрачный образ древнееврейской идиомы божественной оценки.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт весомую пророческую формулу и сохраняет личное имя, выраженное тетраграмматоном.
- source_word: שָׂמוּ
  choice: поставили
  rationale: Близко передаёт обычное значение глагола и подходит для размещения культовых предметов.
- source_word: שִׁקּוּצֵיהֶם
  choice: свои мерзости
  rationale: Передаёт резко отрицательную культовую оценку, не сужая референт исключительно до идолов, хотя в контексте, вероятно, имеются в виду отвратительные культовые предметы.
- source_word: בַּבַּיִת
  choice: в доме
  rationale: Сохраняет исходную метафору дома; из контекста речь идёт о храме в Иерусалиме.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: над которым призвано Моё имя
  rationale: Близко сохраняет необычную формулу оригинала, выражающую принадлежность дома Яхве и его связь с Его именем.
- source_word: לְטַמְּאוֹ
  choice: и тем осквернили его
  rationale: Передаёт возможный результат действия; формулировка не сводит инфинитив однозначно к сознательной цели.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал содержит личное божественное имя; транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: 'Функция לְטַמְּאוֹ: цель или результат'
  choice: и тем осквернили его
  alternative: чтобы осквернить его
  rationale: Древнееврейский инфинитив допускает оттенок цели или результата. Основной текст естественно передаёт результат и избегает утверждения, будто осознанной целью было именно осквернение.
- issue: Значение формулы призывания имени над домом
  choice: над которым призвано Моё имя
  alternative: который назван Моим именем; который носит Моё имя
  rationale: Сохранена богословски насыщенная и несколько необычная форма оригинала без сведения её только к названию здания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Сыны Иуды» и «возвещает» поддерживают достоинство пророческой речи; синтаксис остаётся ясным для широкого читателя.
