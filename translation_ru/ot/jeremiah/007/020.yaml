source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה הִנֵּ֨ה אַפִּ֤/י וַֽ/חֲמָתִ/י֙ נִתֶּ֨כֶת֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה עַל הָֽ/אָדָם֙ וְ/עַל הַ/בְּהֵמָ֔ה וְ/עַל עֵ֥ץ הַ/שָּׂדֶ֖ה וְ/עַל פְּרִ֣י הָֽ/אֲדָמָ֑ה וּ/בָעֲרָ֖ה וְ/לֹ֥א תִכְבֶּֽה־׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], my anger and my wrath are being poured out on this place, on man and on beast, on the trees of the field and on the fruit of the ground; it will burn and will not be quenched.'
translation:
  language: ru
  text: 'Поэтому так говорит Владыка Яхве: «Вот, Мой гнев и Моя ярость изливаются на это место — на человека[a] и на животных, на деревья в поле и на плоды земли. Она будет пылать и не угаснет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на людей»; древнееврейское слово стоит в единственном числе, но имеет здесь родовое, собирательное значение.'
    reason: Лексическая альтернатива и пояснение родового значения הָאָדָם.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие из предшествующего обличения.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная для русского языка и узнаваемая пророческая формула посланника.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сохраняет различие между титулом אֲדֹנָי и личным именем יְהוִה, не создавая сочетания «Господь Господь».
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт торжественное привлечение внимания без архаичного «се».
- source_word: אַפִּי וַחֲמָתִי
  choice: Мой гнев и Моя ярость
  rationale: Сохраняет два близких, но не тождественных обозначения Божьего негодования и усиление во второй части пары.
- source_word: נִתֶּכֶת
  choice: изливаются
  rationale: Сохраняет образ излияния; русское множественное число естественно согласуется с парным подлежащим «гнев и ярость».
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: на это место
  rationale: В контексте излияния суда предлог «на» естественно обозначает его направленность.
- source_word: הָאָדָם
  choice: человека
  rationale: Сохраняет грамматическое единственное число и родовое, собирательное значение древнееврейского слова.
- source_word: הַבְּהֵמָה
  choice: животных
  rationale: Передаёт широкую категорию животных; «скот» могло бы неоправданно сузить значение.
- source_word: עֵץ הַשָּׂדֶה
  choice: деревья в поле
  rationale: Естественно передаёт собирательное значение единственного числа и сохраняет полевой образ.
- source_word: פְּרִי הָאֲדָמָה
  choice: плоды земли
  rationale: Сохраняет земледельческий образ и не сужает его до хозяйственного термина «урожай».
- source_word: וּבָעֲרָה וְלֹא תִכְבֶּה
  choice: Будет пылать и не угаснет
  rationale: Передаёт образ неугасимого горения, не добавляя в основной текст отсутствующего существительного «огонь» и не устраняя неявность подлежащего.
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант непосредственно передаёт личное имя יְהוִה и одновременно сохраняет отдельный титул אֲדֹנָי.
- issue: Родовое значение הָאָדָם
  choice: человека
  alternative: людей / человечество
  rationale: Единственное число соответствует форме источника и в данном перечислении имеет обтельное собирательное значение, а не обозначает только одного мужчину.
- issue: Неявное подлежащее в заключительной фразе
  choice: Будет пылать и не угаснет
  alternative: Огонь будет пылать и не угаснет
  rationale: В древнееврейском тексте слово «огонь» отсутствует; безличная по форме русская конструкция сохраняет образ и не разрешает неоднозначность за автора.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Архаизмы вроде «се» и узкоконфессиональные формулы не использованы; параллелизм и образность древнееврейского текста сохранены.
