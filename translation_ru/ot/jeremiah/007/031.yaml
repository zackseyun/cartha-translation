id: JER.7.31
reference: Jeremiah 7:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בָנ֞וּ בָּמ֣וֹת הַ/תֹּ֗פֶת אֲשֶׁר֙ בְּ/גֵ֣יא בֶן הִנֹּ֔ם לִ/שְׂרֹ֛ף אֶת בְּנֵי/הֶ֥ם וְ/אֶת בְּנֹתֵי/הֶ֖ם בָּ/אֵ֑שׁ אֲשֶׁר֙ לֹ֣א צִוִּ֔יתִי וְ/לֹ֥א עָלְתָ֖ה עַל לִבִּֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/031.yaml
  text: They have built the high places of Topheth[a], which is in the Valley of Ben-hinnom, to burn their sons and their daughters in the fire—something I did not command, nor did it come up in my heart.
translation:
  language: ru
  text: Они устроили высоты Тофета, что в долине Бен-Хинном, чтобы сжигать в огне своих сыновей и дочерей, — чего Я не повелевал и что Мне и на сердце не приходило.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не поднималось на Моё сердце»; по смыслу также возможно: «и Мне в мысль не приходило».'
    reason: Сноска показывает буквальный образ древнееврейской идиомы и её более динамический русский эквивалент, не устраняя возможного смыслового напряжения.
lexical_decisions:
- source_word: וּבָנוּ
  choice: Они устроили
  rationale: Qal perfect 3-го лица множественного числа обозначает завершённое действие с сохраняющимся результатом. «Устроили» естественно сочетается с культовыми сооружениями и не ограничивает действие одной лишь постройкой.
- source_word: בָּמוֹת
  choice: высоты
  rationale: Традиционный и достаточно точный термин для культовых мест или святилищ; он сохраняет специфический смысл древнееврейского слова, не сводя его просто к «святилищам».
- source_word: הַתֹּפֶת
  choice: Тофета
  rationale: Название передано транслитерацией; форма родительного падежа естественна после слова «высоты».
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: в долине Бен-Хинном
  rationale: גֵיא переведено как «долина», а составное географическое название сохранено транслитерацией.
- source_word: לִשְׂרֹף
  choice: чтобы сжигать
  rationale: Инфинитив с ל выражает цель. Несовершенный вид по-русски естественно обозначает практику, ради которой были устроены эти места.
- source_word: אֶת־בְּנֵיהֶם וְאֶת־בְּנֹתֵיהֶם
  choice: своих сыновей и дочерей
  rationale: Сохранено явное различение сыновей и дочерей; возвратное «своих» естественно указывает на принадлежность субъекту.
- source_word: בָּאֵשׁ
  choice: в огне
  rationale: Прямой и естественный русский эквивалент локативно-инструментального употребления предлога ב в данном контексте.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: чего Я не повелевал
  rationale: Относительная конструкция соотнесена с описанной практикой сожжения детей. Форма «чего» ясно передаёт этот смысл по-русски.
- source_word: וְלֹא עָלְתָה עַל־לִבִּי
  choice: и что Мне и на сердце не приходило
  rationale: Сохранён образ древнееврейской идиомы с «сердцем», но выражение оформлено естественно для современного литературного русского. Повторное «и» усиливает полное отвержение практики.
theological_decisions:
- issue: Божественное отвержение жертвоприношения детей
  choice: Сохранить антропоморфную идиому «Мне и на сердце не приходило» как сильное выражение полного отвержения этой практики.
  alternative: «Мне и в мысль не приходило», что может звучать как утверждение об отсутствии знания или предведения.
  rationale: Текст прямо утверждает, что Бог этого не повелевал и что это не возникало в Его сердце. Перевод сохраняет напряжение и образ исходника, не добавляя богословского вывода о пределах божественного знания.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены традиционный библейский термин «высоты», географические имена и образ сердца; синтаксис сделан понятным для обычного читателя.
