revisions:
- from: И теперь, за то, что вы делали все эти дела, — возвещает Яхве, — и Я говорил вам с раннего утра, говорил снова и снова[a], но вы не слушали; Я звал вас, но вы не отвечали,
  to: И теперь, за то, что вы совершили все эти дела, — говорит Яхве, — Я, вставая рано, говорил вам[a], но вы не слушали; Я звал вас, но вы не отвечали,
  rationale: Исправлен вид «делали» на «совершили», чтобы не добавлять аспектуальное значение. Идиома הַשְׁכֵּם וְדַבֵּר передана с сохранением образа раннего вставания без избыточной интерпретации в основном тексте; её прагматическое значение остаётся в сноске. Формула נְאֻם יְהוָה оформлена естественным для русского пророческим оборотом «говорит Яхве».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:12:09Z'
review_pass:
  verdict: revise
  source_fidelity: В целом структура, причинная связь, имя Яхве и незавершённая пунктуация, ведущая к следующему стиху, переданы верно. Однако «вы делали» неоправданно вводит длительно-повторительный вид там, где еврейская конструкция обозначает совершение этих действий; «с раннего утра, говорил снова и снова» одновременно перерабатывает идиому и стилистически неровно передаёт её.
  naturalness: Фраза «Я говорил вам с раннего утра, говорил снова и снова» звучит тяжеловесно и допускает узкое временное понимание («в течение одного утра»). «Я, вставая рано, говорил вам» сохраняет образ, остаётся литературно естественным и позволяет сноске пояснить устойчивый смысл.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Говорит Яхве» — естественная современная передача נְאֻם יְהוָה; «звал» / «не отвечали» сохраняет образ призыва и ответа. Сноска привязана к идиоме и не навязывает богословского истолкования.
  issues:
  - severity: medium
    issue: Вид глагола в «вы делали все эти дела»
    rationale: עֲשׂוֹתְכֶם в причинной конструкции указывает на совершение названных дел. Русское несовершенное «делали» добавляет значение процесса или привычной повторяемости, не выраженное формой само по себе.
  - severity: medium
    issue: Передача הַשְׁכֵּם וְדַבֵּר
    rationale: «С раннего утра, говорил снова и снова» дублирует два интерпретирующих компонента и синтаксически неудачно присоединено к «Я говорил». Следует сохранить образ раннего вставания в основном тексте, а значение настойчивого повторного обращения пояснить в сноске.
  revised_text: И теперь, за то, что вы совершили все эти дела, — говорит Яхве, — Я, вставая рано, говорил вам[a], но вы не слушали; Я звал вас, но вы не отвечали,
