  text: וְ/עַתָּ֗ה יַ֧עַן עֲשׂוֹתְ/כֶ֛ם אֶת כָּל הַ/מַּֽעֲשִׂ֥ים הָ/אֵ֖לֶּה נְאֻם יְהוָ֑ה וָ/אֲדַבֵּ֨ר אֲלֵי/כֶ֜ם הַשְׁכֵּ֤ם וְ/דַבֵּר֙ וְ/לֹ֣א שְׁמַעְתֶּ֔ם וָ/אֶקְרָ֥א אֶתְ/כֶ֖ם וְ/לֹ֥א עֲנִיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/013.yaml
  text: And now[a], because you have done all these deeds, declares Yahweh, and I spoke to you, rising early and speaking, but you did not listen, and I called to you, but you did not answer[b],
translation:
  language: ru
  text: И теперь, за то, что вы совершили все эти дела, — говорит Яхве, — Я, вставая рано, говорил вам[a], но вы не слушали; Я звал вас, но вы не отвечали,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вставая рано и говоря»; еврейская идиома, выражающая настойчивое, неоднократное обращение.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительную и переходно-выводную силу выражения.
- source_word: יַעַן עֲשׂוֹתְכֶם אֶת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: за то, что вы делали все эти дела
  rationale: Передаёт причинное основание последующего суда; несовершенный по смыслу русский вид уместен для устойчивого поведения, описанного в контексте.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную пророческую формулу и сохраняет личное имя יְהוָה.
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: Я говорил вам
  rationale: Естественно передаёт обращённую к народу речь Бога и допускает повторяемость действия.
- source_word: הַשְׁכֵּם וְדַבֵּר
  choice: с раннего утра, говорил снова и снова
  rationale: Сохраняет образ раннего вставания и одновременно ясно передаёт идиоматический смысл настойчивого, неоднократного обращения.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: но вы не слушали
  rationale: Сохраняет слуховой образ и не сводит многозначное שׁמע исключительно к неповиновению.
- source_word: וָאֶקְרָא אֶתְכֶם
  choice: Я звал вас
  rationale: Передаёт прямой призыв Бога без чрезмерно официального оттенка слова «призывал» или «вызывал».
- source_word: וְלֹא עֲנִיתֶם
  choice: но вы не отвечали
  rationale: Сохраняет диалогический образ ответа на Божий зов.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Передача идиомы הַשְׁכֵּם וְדַבֵּר
  choice: Сохранить образ раннего утра и пояснить повторность в основном тексте
  alternative: вставал рано и говорил; настойчиво говорил
  rationale: Так сохраняются и образность исходного выражения, и его общепризнанная идиоматическая сила, без сведения смысла только к буквальному времени суток.
- issue: Значение שׁמע
  choice: слушали
  alternative: слышали; повиновались
  rationale: «Слушали» удерживает намеренную смысловую широту между восприятием речи и послушанием.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сохраняет протяжённость исходной фразы, которая продолжается в следующем стихе; поэтому текст оканчивается запятой. Единственный маркер [a] размещён непосредственно после поясняемой идиомы.
