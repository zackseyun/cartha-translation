base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Add your burnt offerings to your sacrifices, and eat the flesh.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств, Бог Израиля: «Прибавьте ваши всесожжения к вашим жертвам[a] и ешьте мясо».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к вашим мирным жертвам»; еврейское слово здесь может более конкретно обозначать жертвы, мясо которых ели приносившие.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула, естественная для современного литературного русского языка и сохраняющая торжественный тон.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет широкий смысл титула, который может охватывать небесные и земные силы, не сужая его до обычных человеческих армий.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача еврейского сочетания.
- source_word: עֹלוֹתֵיכֶם
  choice: ваши всесожжения
  rationale: Термин обозначает жертвы, целиком сжигавшиеся на жертвеннике; «всесожжения» точно и привычно передаёт этот культовый смысл.
- source_word: סְפוּ עַל
  choice: прибавьте … к
  rationale: Естественно передаёт повеление добавить один вид жертв к другому и сохраняет его резкий, вероятно иронический характер.
- source_word: זִבְחֵיכֶם
  choice: вашим жертвам
  rationale: זֶבַח может обозначать жертву в широком смысле; более узкое культовое значение сохранено в примечании.
- source_word: וְאִכְלוּ בָשָׂר
  choice: и ешьте мясо
  rationale: В контексте жертвоприношения בָשָׂר означает съедобное мясо животного; «мясо» звучит естественнее современного русского «плоть».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Степень конкретности זִבְחֵיכֶם в противопоставлении всесожжениям
  choice: жертвам
  alternative: мирным жертвам
  rationale: В данном культовом контексте речь может идти конкретно о жертвах, мясо которых ели приносившие, но само еврейское слово допускает более широкое значение. Основной текст сохраняет эту неоднозначность, а узкое прочтение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формулировка краткая и резкая, чтобы сохранить ироническую силу повеления; культовые термины переданы точно, но без излишней архаики.
