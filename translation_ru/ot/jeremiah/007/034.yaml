  text: וְ/הִשְׁבַּתִּ֣י מֵ/עָרֵ֣י יְהוּדָ֗ה וּ/מֵֽ/חֻצוֹת֙ יְר֣וּשָׁלִַ֔ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה כִּ֥י לְ/חָרְבָּ֖ה תִּהְיֶ֥ה הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/034.yaml
  text: And I will put an end[a], from the cities of Judah and from the streets of Jerusalem, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride[c][b], for the land will become a ruin.
translation:
  language: ru
  text: Я положу конец в городах Иудеи и на улицах Иерусалима[a] звукам ликования и звукам радости, голосу жениха и голосу невесты, ибо земля будет опустошена[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на площадях Иерусалима»; еврейское слово может обозначать улицы или открытые общественные места.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «превратится в руины»; еврейское слово обозначает разорение, опустошение или руины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: И Я прекращу
  rationale: 'Форма hифиль от שׁבת имеет каузативный смысл: Бог положит конец этим звукам. «Прекращу» прямо передаёт Его действие и естественно звучит по-русски.'
- source_word: מֵעָרֵי יְהוּדָה
  choice: в городах Иудеи
  rationale: Предлог מִן указывает на места, откуда будут устранены звуки. В русском сочетание «прекращу в городах» естественнее буквального «из городов», при этом значение удаления сохраняется.
- source_word: וּמֵחֻצוֹת יְרוּשָׁלִַם
  choice: и на улицах Иерусалима
  rationale: חֻצוֹת обозначает улицы и открытые общественные места; «улицы» — ясный основной эквивалент, а более широкое значение отмечено в сноске.
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: звуки ликования и звуки радости
  rationale: קוֹל здесь обозначает слышимые проявления праздника; «звуки» подходит к отвлечённым существительным. Различение «ликование» и «радость» сохраняет парность двух близких еврейских слов.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: голос жениха и голос невесты
  rationale: Когда речь идёт о людях, קוֹל естественно передаётся словом «голос». Повтор сохраняет ритм и свадебную формулу оригинала.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину исчезновения праздничных голосов.
- source_word: לְחָרְבָּה תִּהְיֶה הָאָרֶץ
  choice: эта земля станет пустошью
  rationale: Конструкция היה с לְ передаёт переход в новое состояние. «Пустошь» выражает опустошение и разорение, не создавая обязательного образа природной пустыни; указательное «эта» естественно обозначает находящуюся в контексте землю Иудеи.
theological_decisions:
- issue: Божественное действие в суде
  choice: 'Сохранено прямое действие Бога от первого лица: «Я прекращу».'
  alternative: Безличное «звуки… умолкнут».
  rationale: Еврейский глагол стоит в первом лице и прямо представляет Бога совершающим суд; безличная конструкция ослабила бы эту смысловую особенность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Сохранены повтор «звуки… звуки» и параллельное «голос… голос», характерные для еврейского текста; избегнуты архаизмы и конфессионально окрашенные формулировки.
