base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/028.yaml
  text: Then you shall say to them[a], ‘This is the nation that did not listen to the voice of Yahweh its God and did not accept correction. Faithfulness has perished; it has been cut off from their mouth.’
translation:
  language: ru
  text: 'И скажи им: «Вот народ, который не слушал голоса Яхве, своего Бога, и не принимал вразумления. Верность[a] исчезла и отсечена от их уст».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истина». Еврейское אֱמוּנָה может означать «верность», «надёжность» или «истина».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: И скажи им
  rationale: Последовательная форма в пророческой речи продолжает повеление; русский императив естественно передаёт его силу.
- source_word: זֶה הַגּוֹי
  choice: Вот народ
  rationale: Сохраняет указательную конструкцию и коллективное значение גּוֹי, естественно звуча в формуле обличения.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: не слушал голоса
  rationale: Сохраняет еврейский слуховой образ, при этом контекст ясно подразумевает непослушание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֱלֹהָיו
  choice: своего Бога
  rationale: Местоименная форма единственного числа согласуется с собирательным существительным «народ».
- source_word: לֹא לָקְחוּ מוּסָר
  choice: не принимал вразумления
  rationale: «Вразумление» охватывает исправляющее наставление и дисциплину; глагол «принимать» передаёт отказ народа откликнуться.
- source_word: אָבְדָה הָאֱמוּנָה
  choice: Верность исчезла
  rationale: אֱמוּנָה обозначает верность, надёжность или истину. «Верность» сохраняет нравственный и заветный оттенок, а «исчезла» естественно передаёт утрату.
- source_word: וְנִכְרְתָה מִפִּיהֶם
  choice: и была исторгнута из их уст
  rationale: Сохраняет пассивную форму и резкий образ полного удаления из уст, не сводя выражение просто к молчанию.
theological_decisions:
- issue: Значение אֱמוּנָה в контексте обличения народа
  choice: верность
  alternative: истина
  rationale: Контекст допускает как нравственно-реляционную верность, так и истинность речи. В основном тексте выбрана «верность», а реальная лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обличения. Сохранены образ «слушать голос» и упоминание уст; синтаксис упрощён лишь настолько, чтобы стих был понятен обычному читателю.
