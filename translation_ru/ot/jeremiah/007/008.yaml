id: JER.7.8
reference: Jeremiah 7:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הִנֵּ֤ה אַתֶּם֙ בֹּטְחִ֣ים לָ/כֶ֔ם עַל דִּבְרֵ֖י הַ/שָּׁ֑קֶר לְ/בִלְתִּ֖י הוֹעִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/008.yaml
  text: Look[b][a], you are trusting in deceptive words to no benefit.
translation:
  language: ru
  text: Вот, вы полагаетесь на обманчивые слова[a] — без всякой пользы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лживые слова»; или: «ложные слова».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «напрасно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Эмфатически привлекает внимание; «вот» естественно и достойно передаёт указательную силу еврейского слова.
- source_word: בֹּטְחִים
  choice: полагаетесь
  rationale: Причастие обозначает продолжающееся или характерное действие; форма настоящего времени передаёт это естественно по-русски.
- source_word: לָכֶם
  choice: не выражено отдельно
  rationale: Местоименная форма здесь идиоматически связана с глаголом; отдельное «для себя» сделало бы русский текст тяжеловесным и могло бы внести излишний смысловой акцент.
- source_word: עַל
  choice: на
  rationale: При глаголе «полагаться» предлог «на» является естественным русским соответствием и сохраняет значение опоры.
- source_word: דִּבְרֵי הַשָּׁקֶר
  choice: обманчивые слова
  rationale: Сочетание обозначает слова, отмеченные ложью и вводящие в заблуждение; «обманчивые» передаёт этот оттенок современным литературным языком.
- source_word: לְבִלְתִּי הוֹעִיל
  choice: без всякой пользы
  rationale: Передаёт отрицание пользы или результата, не превращая «слова» в явно выраженное грамматическое подлежащее действия «приносить пользу».
