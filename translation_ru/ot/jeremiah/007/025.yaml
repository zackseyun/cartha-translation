revisions:
- from: С того дня, когда ваши предки вышли из земли Египетской, и вплоть до нынешнего дня Я посылал к вам всех Моих слуг — пророков; изо дня в день Я вставал рано и посылал их.[a]
  to: С того дня, когда ваши предки вышли из земли Египетской, и до сегодняшнего дня я посылал к вам всех моих слуг — пророков, изо дня в день вставая рано и посылая их.[a]
  rationale: Правка сохраняет все смысловые компоненты исходного текста и аудит-следа, но связывает идиому «вставая рано и посылая» с главным глаголом «посылал», как в еврейском. Также слегка модернизирована временная формула без утраты библейского регистра. Сноска сохранена с тем же якорем и поясняет буквальный образ, не устраняя его из основного текста.
  reviewer_model: gpt-5.6-terra
