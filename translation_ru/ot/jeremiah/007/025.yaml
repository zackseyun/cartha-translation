    issue: Идиома о раннем вставании и посылании оформлена как отдельное предложение.
    rationale: В еврейском тексте она непосредственно развивает «я посылал», а не вводит независимое действие. Связная деепричастная конструкция лучше отражает эту зависимость.
  - severity: low
    issue: Формула «и вплоть до нынешнего дня» несколько тяжеловесна.
    rationale: «И до сегодняшнего дня» сохраняет временной предел עַד הַיּוֹם הַזֶּה и звучит естественнее в современном литературном русском.
