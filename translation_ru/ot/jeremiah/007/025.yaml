review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан точно: временной охват от исхода до настоящего момента речи, посылание всех пророков как Божьих слуг и настойчиво-повторяющийся характер этого посылания сохранены. Однако лучше не разделять еврейскую идиому на второе самостоятельное предложение: инфинитивы הַשְׁכֵּם וְשָׁלֹחַ поясняют действие «посылал».'
  naturalness: «И до сегодняшнего дня» естественнее, чем несколько тяжеловесное «и вплоть до нынешнего дня». Включение «вставая рано и посылая их» в конструкцию с «я посылал» делает русскую фразу связнее и ближе к синтаксической функции еврейского выражения. Строчные «я», «моих» соответствуют обычной современной литературной орфографии; прописные не обусловлены исходным текстом.
  terminology: «Предки», «земля Египетская», «слуги — пророки» и «посылал» удачно передают соответствующие элементы оригинала. «Слуги» уместнее «рабов» в данном контексте порученного пророческого служения. Тире допустимо для пояснительного приложения.
  issues:
