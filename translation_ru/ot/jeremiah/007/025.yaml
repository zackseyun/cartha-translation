base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/025.yaml
  text: From the day your fathers came out of the land of Egypt until this day[a], I have sent to you all my servants the prophets, day after day[b], rising early and sending them.
translation:
  language: ru
  text: С того дня, когда ваши предки вышли из земли Египетской, и до сегодняшнего дня я посылал к вам всех моих слуг — пророков, изо дня в день вставая рано и посылая их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «изо дня в день вставая рано и посылая». Это еврейское выражение передаёт настойчивость и постоянство, с которыми Бог посылал пророков.'
    reason: cultural_note
lexical_decisions:
- source_word: לְמִן הַיּוֹם אֲשֶׁר ... עַד הַיּוֹם הַזֶּה
  choice: С того дня, когда ... и вплоть до нынешнего дня
  rationale: Передаёт начальную и конечную точки продолжительного периода естественным современным русским языком.
- source_word: יָצְאוּ אֲבוֹתֵיכֶם
  choice: ваши предки вышли
  rationale: В данном историческом контексте אָבוֹת обозначает предшествующие поколения Израиля; «предки» яснее современному читателю, чем буквальное «отцы».
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохранена полная формула исхода и её библейско-историческое звучание без сведения к простому «из Египта».
- source_word: וָאֶשְׁלַח אֲלֵיכֶם
  choice: Я посылал к вам
  rationale: Русский несовершенный вид естественно выражает многократное действие на всём указанном временном протяжении.
- source_word: אֶת כָּל עֲבָדַי הַנְּבִיאִים
  choice: всех Моих слуг — пророков
  rationale: Приложение показывает, что пророки названы Божьими слугами; тире ясно передаёт эту связь.
- source_word: יוֹם הַשְׁכֵּם וְשָׁלֹחַ
  choice: изо дня в день Я вставал рано и посылал их
  rationale: Сохранены повторность и образность характерной для Иеремии еврейской идиомы; примечание разъясняет её прагматический смысл.
theological_decisions:
- issue: Передача עֲבָדַי применительно к пророкам
  choice: слуг
  alternative: рабов
  rationale: Здесь слово подчёркивает порученное Богом служение пророков как Его посланников, а не их социально-правовой статус; «слуг» точнее передаёт контекст и не привносит лишнего оттенка.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формула «земля Египетская» сохранена ради связи с повествованием об исходе; архаизм «до сего дня» заменён современным выражением. Образ «вставал рано» намеренно не устранён из основного текста, а пояснён в сноске.
