source:
  edition: WLC
  text: וּ/מִן אָ֡ז חָדַ֜לְנוּ לְ/קַטֵּ֨ר לִ/מְלֶ֧כֶת הַ/שָּׁמַ֛יִם וְ/הַסֵּֽךְ לָ֥/הּ נְסָכִ֖ים חָסַ֣רְנוּ כֹ֑ל וּ/בַ/חֶ֥רֶב וּ/בָ/רָעָ֖ב תָּֽמְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/018.yaml
  text: But from the time we stopped burning incense to the Queen of Heaven and pouring out drink offerings to her[a], we have lacked everything[c][b], and we have been consumed by the sword and by famine.
translation:
  language: ru
  text: А с тех пор как мы перестали возжигать благовония Небесной царице[a] и совершать ей возлияния, нам всего недостаёт, и мы гибнем от меча и голода[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Небесная царица» — титул богини, которой здесь поклонялись говорящие.
    reason: cultural_note
  - marker: b
    text: 'Или: «мы были истреблены мечом и голодом»; еврейский глагол может означать, что кто-либо пришёл к концу, погиб или был полностью изведён.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן אָז
  choice: А с тех пор как
  rationale: Передаёт временную отправную точку и связь с противопоставлением в предшествующем контексте; по-русски естественно вводит придаточное с «перестали».
- source_word: חָדַלְנוּ
  choice: мы перестали
  rationale: Прямое и современное соответствие значению «прекратили, перестали».
- source_word: לְקַטֵּר
  choice: возжигать благовония
  rationale: Передаёт культовое сжигание благовоний, оставаясь понятным и стилистически достойным; не сужает действие до бытового курения.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: Небесной царице
  rationale: Естественная русская форма титула богини, упоминаемой говорящими; прописные буквы показывают употребление как титула, не утверждая истинности её божественного статуса.
- source_word: וְהַסֵּךְ לָהּ נְסָכִים
  choice: и совершать ей возлияния
  rationale: Ясно обозначает культовый обряд излияния жидкой жертвы и избегает тяжёлого повтора «возливать возлияния».
- source_word: חָסַרְנוּ כֹל
  choice: нам всего недостаёт
  rationale: Передаёт всеобъемлющую нужду и сохраняет результирующее состояние, которое говорящие связывают с прекращением культа.
- source_word: וּבַחֶרֶב וּבָרָעָב תָּמְנוּ
  choice: и мы гибнем от меча и голода
  rationale: Предлог ב передан естественным русским «от», а תמם — как доведение до гибели; настоящее время выражает продолжающийся результат, заявленный говорящими.
theological_decisions:
- issue: Титул מְלֶכֶת הַשָּׁמַיִם
  choice: Небесная царица
  alternative: царица небес
  rationale: Сохранён языческий культовый титул в данном повествовательном контексте без отождествления с более поздними религиозными употреблениями и без добавочной конфессиональной оценки.
- issue: Временная и причинная связь между прекращением культа и бедствиями
  choice: Передать утверждение говорящих через «с тех пор как», не усиливая его до явного «потому что»
  alternative: поскольку мы перестали
  rationale: Еврейский текст устанавливает временную связь, из которой сами говорящие подразумевают причинную; перевод не должен превращать их взгляд в прямое авторское подтверждение причинности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. «Возжигать благовония» и «совершать возлияния» понятны без архаической перегруженности; синтаксис сохраняет напряжённое утверждение говорящих и не подтверждает его богословски от лица повествователя.
