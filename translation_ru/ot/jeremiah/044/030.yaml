base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/030.yaml
  text: 'Thus says Yahweh: Behold[a], I am giving Pharaoh Hophra king of Egypt into the hand of his enemies and into the hand of those seeking his life, just as I gave Zedekiah king of Judah into the hand of Nebuchadnezzar king of Babylon, his enemy and the one seeking his life.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Вот, Я отдаю фараона Хофру, царя Египта, в руки его врагов и тех, кто хочет лишить его жизни, как отдал Седекию, царя Иудеи, в руки Навуходоносора[a], царя Вавилона, его врага и того, кто хотел лишить его жизни».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь употреблена форма имени, более точно передаваемая как «Навуходреццар»; «Навуходоносор» — традиционная русская форма.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена стандартная пророческая формула вестника; тетраграмматон передан как личное имя «Яхве».
- source_word: הִנְנִי נֹתֵן
  choice: Вот, Я отдаю
  rationale: «Вот» сохраняет указательно-торжественную силу הִנְנִי, а настоящее время «отдаю» передаёт наглядность и непреложность близкого действия, выраженного причастием.
- source_word: פַּרְעֹה חָפְרַע
  choice: фараона Хофру
  rationale: Имя передано по его еврейской форме, а не через греческий исторический эквивалент Априй.
- source_word: בְּיַד
  choice: в руки
  rationale: Еврейская идиома обозначает передачу под власть другого; русский оборот «отдать в руки» естественен и сохраняет повтор исходного текста.
- source_word: מְבַקְשֵׁי נַפְשׁוֹ
  choice: тех, кто покушается на его жизнь
  rationale: Передан смысл намерения лишить человека жизни, при этом сохранён образ «жизни» (נפש), а не введён более прямой глагол «убить».
- source_word: צִדְקִיָּהוּ
  choice: Седекию
  rationale: Использована укоренившаяся русская форма имени иудейского царя.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносора[a]
  rationale: Использована общепринятая и узнаваемая русская форма; особая форма имени в еврейском тексте отмечена в сноске.
- source_word: אֹיְבוֹ וּמְבַקֵּשׁ נַפְשׁוֹ
  choice: его врага, покушавшегося на его жизнь
  rationale: Обе формы в единственном числе отнесены к Навуходоносору. Причастный оборот естественно передаёт поясняющее приложение, не устраняя смысловой связи между двумя характеристиками.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя передано транслитерацией, что сохраняет различие между тетраграмматоном и титулом «Господь».
- issue: Характер Божьего действия в הִנְנִי נֹתֵן
  choice: Вот, Я отдаю
  alternative: Вот, Я отдам
  rationale: Настоящее время сохраняет пророческую наглядность и уверенность высказывания, не отрицая его ближайшей будущей реализации.
translation_notes:
  register: Современный литературный русский язык с торжественностью пророческой речи. Синтаксический параллелизм и повтор «в руки» сохранены; буквальный, но неестественный оборот «ищущие его души» передан как «покушающиеся на его жизнь».
