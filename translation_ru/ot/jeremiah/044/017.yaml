  source_fidelity: Перевод точно передаёт эмфатическую решимость в עָשֹׂה נַעֲשֶׂה («непременно исполним»), содержание произнесённого обязательства, оба культовых действия, титул «Царица Небесная», исторический перечень участников и итоговое утверждение о прежнем достатке, благополучии и отсутствии бедствий. «Жили благополучно» адекватно передаёт широкое וַנִּהְיֶה טוֹבִים, не сужая его исключительно до материального процветания.
  naturalness: Текст звучит как современный литературный русский с уместной библейской торжественностью. Сочетания «воскурять благовония» и «возливать возлияния» намеренно культово окрашены, но ясны в контексте и не являются чрезмерно архаичными. Синтаксис последнего предложения естественно воспроизводит ретроспективный довод говорящих.
  terminology: «Царица Небесная», «возлияния», «Иудея», «Иерусалим», «сановники» и «бедствие» употреблены последовательно и соответствуют исходному тексту. Сноска [a] корректно привязана к «вдоволь хлеба» и даёт буквальный вариант; сноска [b] корректно привязана к «жили благополучно» и отмечает более буквальное чтение. Это исправляет несоответствие расположения сносок в английской аудиторской записи, не меняя смысла.
