language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֩י עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶֽת כָּל הַ/דָּבָ֣ר אֲשֶׁר יָצָ֣א מִ/פִּ֗י/נוּ לְ/קַטֵּ֞ר לִ/מְלֶ֣כֶת הַ/שָּׁמַיִם֮ וְ/הַסֵּֽיךְ לָ֣/הּ נְסָכִים֒ כַּ/אֲשֶׁ֨ר עָשִׂ֜ינוּ אֲנַ֤חְנוּ וַ/אֲבֹתֵ֨י/נוּ֙ מְלָכֵ֣י/נוּ וְ/שָׂרֵ֔י/נוּ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָ֑ם וַ/נִּֽשְׂבַּֽע לֶ֨חֶם֙ וַ/נִּֽהְיֶ֣ה טוֹבִ֔ים וְ/רָעָ֖ה לֹ֥א רָאִֽינוּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/017.yaml
  text: 'But we will certainly do every word that has gone out from our mouth: to burn incense to the Queen of Heaven and to pour out drink offerings to her[a], just as we and our fathers, our kings and our officials, did in the cities of Judah and in the streets of Jerusalem; then we had plenty of bread, prospered[b], and saw no disaster.'
translation:
  language: ru
  text: 'Но мы непременно исполним всё, что вышло из наших уст: будем воскурять благовония Царице Небесной и возливать ей возлияния, как делали мы и наши предки, наши цари и сановники в городах Иудеи и на улицах Иерусалима. Тогда у нас было вдоволь хлеба[a], мы жили благополучно[b] и не видели бедствия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «насыщались хлебом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нам было хорошо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: В данном контексте частица вводит вызывающее противопоставление предыдущему повелению Иеремии; русское «но» естественно передаёт эту дискурсивную функцию.
- source_word: עָשֹׂה נַעֲשֶׂה
  choice: мы непременно исполним
  rationale: Инфинитив абсолютный при личной форме усиливает решимость говорящих. «Непременно» передаёт эмфазу, а «исполним» естественно сочетается с данным далее заявлением.
- source_word: כָּל הַדָּבָר אֲשֶׁר יָצָא מִפִּינוּ
  choice: всё, что вышло из наших уст
  rationale: Сохранён конкретный древнееврейский образ произнесённого обязательства или обета без излишнего уточнения его юридического статуса.
- source_word: לְקַטֵּר
  choice: воскурять благовония
  rationale: Глагол обозначает культовое сожжение ароматического приношения; это точная и понятная современному читателю формулировка.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: Царице Небесной
  rationale: Передан титул почитаемого женского божества без замены его пояснительным названием и без одобрения самого культа.
- source_word: וְהַסֵּיךְ לָהּ נְסָכִים
  choice: и возливать ей возлияния
  rationale: Сохранена стандартная жертвенная терминология оригинала; повтор корня в русском звучит торжественно и остаётся понятным.
- source_word: אֲנַחְנוּ וַאֲבֹתֵינוּ מְלָכֵינוּ וְשָׂרֵינוּ
  choice: мы и наши предки, наши цари и сановники
  rationale: «Предки» естественнее современного буквального «отцы» в историческом перечне, а «сановники» передаёт высокопоставленных государственных лиц.
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: в городах Иудеи и на улицах Иерусалима
  rationale: חֻצוֹת может обозначать улицы или открытые городские пространства; «улицы» сохраняет широкое и естественное значение.
- source_word: וַנִּשְׂבַּע לֶחֶם
  choice: у нас было вдоволь хлеба
  rationale: Передаёт материальное изобилие, сохраняя образ хлеба; буквальное значение отмечено в сноске.
- source_word: וַנִּהְיֶה טוֹבִים
  choice: мы жили благополучно
  rationale: Фраза буквально говорит, что говорящим было хорошо; в контексте их довода речь идёт об общем благополучии, но не обязательно только о богатстве.
- source_word: וְרָעָה לֹא רָאִינוּ
  choice: и не видели бедствия
  rationale: Здесь רָעָה обозначает пережитое несчастье или бедствие, а не нравственное зло; сохранён глагольный образ «видеть».
theological_decisions:
- issue: Передача титула языческого женского божества
  choice: Царица Небесная
  alternative: царица небес / богиня неба
  rationale: Прямой титул оригинала сохранён как название объекта идолопоклонства. Контекст ясно показывает, что повествователь не одобряет этот культ; перевод не привносит позднейших богословских отождествлений.
- issue: Характер заявленного прежнего благополучия
  choice: жили благополучно
  alternative: процветали
  rationale: Выражение сохраняет широту וַנִּהְיֶה טוֹבִים и не сводит утверждение говорящих исключительно к материальному процветанию, хотя соседнее упоминание хлеба сохраняет экономический оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской интонацией. Синтаксис сохраняет решительный, вызывающий тон речи и последовательность доводов, но избегает архаизмов и конфессионально окрашенных пояснений.
