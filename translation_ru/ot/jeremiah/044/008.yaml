  text: לְ/הַכְעִסֵ֨/נִי֙ בְּ/מַעֲשֵׂ֣י יְדֵי/כֶ֔ם לְ/קַטֵּ֞ר לֵ/אלֹהִ֤ים אֲחֵרִים֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם אֲשֶׁר אַתֶּ֥ם בָּאִ֖ים לָ/ג֣וּר שָׁ֑ם לְמַ֨עַן֙ הַכְרִ֣ית לָ/כֶ֔ם וּ/לְמַ֤עַן הֱיֽוֹתְ/כֶם֙ לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה בְּ/כֹ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/008.yaml
  text: provoking me to anger by the works of your hands[a], by burning incense to other gods in the land of Egypt, where you are going to sojourn[c][b], so that you may cut yourselves off and so that you may become a curse and a reproach among all the nations of the earth.
translation:
  language: ru
  text: тем, что вызываете Мой гнев делами своих рук[a], сжигая благовония иным богам в земле Египта, куда вы отправились жить как чужеземцы[b], — чтобы погубить самих себя[c] и стать проклятием[d] и предметом поношения среди всех народов земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «дела своих рук» может указывать как на поступки, так и на сделанных руками идолов.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «куда вы приходите жить пришельцами»; глагол может подчёркивать проживание в чужой земле в качестве пришельцев.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможны также переводы: «чтобы быть истреблёнными» или «чтобы Я истребил вас»; в контексте может подразумеваться Божий суд.'
    reason: alternative_reading
  - marker: d
    text: 'Или: «объектом проклятий», то есть народом, чью участь приводят как пример в формулах проклятия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַכְעִסֵנִי
  choice: вызываете Мой гнев
  rationale: Каузативный инфинитив породы hифиль передаёт действие, вызывающее гнев Бога; русская формулировка естественна и сохраняет причинный смысл.
- source_word: בְּמַעֲשֵׂי יְדֵיכֶם
  choice: делами своих рук
  rationale: Сохранён еврейский образ, который может обозначать как поступки, так и изготовленные руками предметы, в данном контексте, вероятно, связанные с идолопоклонством.
- source_word: לְקַטֵּר
  choice: сжигая благовония
  rationale: В культовом контексте глагол обычно означает воскурение благовоний; деепричастие естественно связывает действие с вызыванием Божьего гнева.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: иным богам
  rationale: Прямо передаёт значение «другим богам», не добавляя толкования «чужеземным».
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египетской
  rationale: Сохраняет явно выраженное существительное אֶרֶץ и соответствует dignified библейскому регистру без архаической непонятности.
- source_word: אֲשֶׁר אַתֶּם בָּאִים לָגוּר שָׁם
  choice: куда вы пришли жить как чужеземцы
  rationale: Глагол גור обозначает проживание вне своей земли в статусе пришельца; перевод явно передаёт эту существенную смысловую черту.
- source_word: לְמַעַן הַכְרִית לָכֶם
  choice: чтобы навлечь на себя истребление
  rationale: Формулировка передаёт результат собственных действий адресатов и образ окончательного отсечения/истребления, не вводя в основной текст не названный в этой клаузе субъект.
- source_word: וּלְמַעַן הֱיוֹתְכֶם
  choice: и стать
  rationale: Инфинитив היה описывает переход в последующее состояние; краткое «стать» естественно по-русски.
- source_word: לִקְלָלָה
  choice: проклятием
  rationale: Сохраняет прямое значение существительного и допускает смысл народа, упоминаемого в формулах проклятия.
- source_word: וּלְחֶרְפָּה
  choice: предметом поношения
  rationale: Передаёт общественный позор и презрение, выраженные חרפה, яснее современному читателю, чем одно лишь «поношением».
- source_word: בְּכֹל גּוֹיֵי הָאָרֶץ
  choice: среди всех народов земли
  rationale: Предлог передан как обозначение социальной среды, а הָאָרֶץ в сочетании со всеми народами — в широком значении мира/земли.
theological_decisions:
- issue: Субъект и направленность действия в לְמַעַן הַכְרִית לָכֶם
  choice: 'результативно-рефлексивное: «чтобы навлечь на себя истребление»'
  alternative: '«чтобы истребить самих себя» или «чтобы быть истреблёнными»; в контексте также возможно подразумевать Божье действие: «чтобы Я истребил вас»'
  rationale: В самой клаузе новый субъект прямо не назван, а לָכֶם придаёт действию направленность на адресатов и их погибель. Выбранный вариант сохраняет их ответственность, не отрицая Божьего суда в широком контексте и не делая подразумеваемого деятеля явным.
- issue: Целевой или результативный оттенок повторённого לְמַעַן
  choice: сохранено формой «чтобы», допускающей горькое указание на итог поведения
  alternative: явно результативное «так что» или «тем самым»
  rationale: Еврейская конструкция может выражать цель либо следствие; буквальная русская связка сохраняет риторическое напряжение и не сводит смысл только к намерению народа уничтожить себя.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Начальная строчная буква отражает синтаксическое продолжение предыдущей части предложения. Выражения «земля Египетская» и «предмет поношения» сохраняют торжественный пророческий регистр, оставаясь понятными современному читателю.
