  text: הַֽ/שְׁכַחְתֶּם֩ אֶת רָע֨וֹת אֲבוֹתֵי/כֶ֜ם וְ/אֶת רָע֣וֹת מַלְכֵ֣י יְהוּדָ֗ה וְ/אֵת֙ רָע֣וֹת נָשָׁ֔י/ו וְ/אֵת֙ רָעֹ֣תֵ/כֶ֔ם וְ/אֵ֖ת רָעֹ֣ת נְשֵׁי/כֶ֑ם אֲשֶׁ֤ר עָשׂוּ֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/009.yaml
  text: Have you forgotten the evil deeds of your fathers[a], the evil deeds of the kings of Judah, the evil deeds of their wives, your own evil deeds, and the evil deeds of your wives[b], which they did in the land of Judah and in the streets of Jerusalem?
translation:
  language: ru
  text: Неужели вы забыли злые дела[b] ваших отцов, злые дела царей Иудеи и их жён[a], ваши собственные злые дела и злые дела ваших жён, которые они совершили в земле Иудеи и на улицах Иерусалима?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его жён»; вероятно, форма употреблена распределительно по отношению к царям Иудеи, то есть речь идёт об их жёнах.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зло», «злодеяния» или «злые поступки». Здесь слово относится к действиям, поскольку далее сказано, что их совершили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁכַחְתֶּם
  choice: Неужели вы забыли
  rationale: Риторический вопрос выражает упрёк; частица «неужели» естественно передаёт его силу в современном русском языке.
- source_word: רָעוֹת / רָעֹתֵיכֶם
  choice: злые дела
  rationale: Форма множественного числа обозначает конкретные проявления зла; последующее עָשׂוּ («совершали») подтверждает деятельностный смысл.
- source_word: אֲבוֹתֵיכֶם
  choice: ваших отцов
  rationale: Сохраняет прямой родственный и поколенческий смысл еврейского выражения, не заменяя его более широким «предков».
- source_word: מַלְכֵי יְהוּדָה
  choice: царей Иудеи
  rationale: Естественная русская передача сопряжённой конструкции.
- source_word: נָשָׁיו
  choice: их жён
  rationale: Морфологически суффикс единственного числа означает «его», но после множественного «цари Иудеи» конструкция, вероятно, имеет распределительное значение; по-русски это естественно передаётся как «их жён».
- source_word: אֲשֶׁר עָשׂוּ
  choice: всё то, что они совершали
  rationale: «Совершали» идиоматично сочетается со «злыми делами», а несовершенный вид уместно представляет совокупность повторявшихся деяний. «Всё то» ясно связывает относительное предложение со всем предшествующим перечнем.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: в земле Иудеи
  rationale: Сохраняет обычное географическое значение אֶרֶץ и традиционное библейское наименование территории.
- source_word: בְּחֻצוֹת יְרוּשָׁלִָם
  choice: на улицах Иерусалима
  rationale: חֻצוֹת может обозначать улицы или открытые общественные места; «на улицах» — наиболее естественная современная передача в данном городском контексте.
theological_decisions:
- issue: Смысл רָעוֹת
  choice: Конкретное «злые дела»
  alternative: «зло», «злодеяния», «бедствия»
  rationale: Контекст перечисляет виновные действия различных групп и использует глагол «делать»; речь идёт о нравственном зле, совершённом людьми, а не о постигших их бедствиях.
- issue: Поколенческое обозначение אֲבוֹתֵיכֶם
  choice: «ваших отцов»
  alternative: «ваших предков»
  rationale: Более буквальная формулировка сохраняет мужской род и семейно-поколенческую силу обвинения, не расширяя явно выраженный референт.
- issue: Соотнесение נָשָׁיו с «царями Иудеи»
  choice: «их жён»
  alternative: 'Буквально по морфологии: «его жён»'
  rationale: Контекстуальный антецедент стоит во множественном числе; русское множественное местоимение передаёт вероятный собирательно-распределительный смысл, при этом формальная особенность отмечена в сноске.
- issue: Субъект עָשׂוּ
  choice: Сохранено местоимение «они» без явного уточнения
  alternative: «которые вы и они совершали» или повторение всех перечисленных групп
  rationale: Еврейская форма третьего лица множественного числа после смешанного перечня создаёт некоторую грамматическую напряжённость. Перевод не устраняет её посредством добавленного толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Перечислительная структура и риторический упрёк сохранены; тире облегчает восприятие длинной цепочки однородных членов. Все сноски имеют маркеры в основном тексте.
