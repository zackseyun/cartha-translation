source:
  edition: WLC
  text: לָ/כֵן֙ שִׁמְע֣וּ דְבַר יְהוָ֔ה כָּל יְהוּדָ֕ה הַ/יֹּשְׁבִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם הִנְ/נִ֨י נִשְׁבַּ֜עְתִּי בִּ/שְׁמִ֤/י הַ/גָּדוֹל֙ אָמַ֣ר יְהוָ֔ה אִם יִהְיֶה֩ ע֨וֹד שְׁמִ֜/י נִקְרָ֣א בְּ/פִ֣י כָּל אִ֣ישׁ יְהוּדָ֗ה אֹמֵ֛ר חַי אֲדֹנָ֥/י יְהוִ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/026.yaml
  text: 'Therefore hear the word of Yahweh[a], all Judah who dwell in the land of Egypt: Behold, I have sworn by my great name, says Yahweh, that my name shall no longer be called upon by the mouth of any man of Judah in all the land of Egypt, saying, ‘As the Lord GOD lives.’'
translation:
  language: ru
  text: 'Итак, слушайте слово Яхве, все иудеи, живущие в земле Египта: вот, Я поклялся Моим великим именем, — говорит Яхве, — что во всей земле Египта Моё имя больше не будет звучать на устах ни одного иудея[a], говорящего: «Жив Владыка Яхве!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Моё имя больше не будет названо в устах ни одного иудея». Этот древнееврейский оборот относится здесь к произнесению имени Яхве в формуле клятвы.'
    reason: Пояснение древнееврейского оборота и его контекстуального значения.
lexical_decisions:
- source_word: לָכֵן
  choice: Итак
  rationale: Передаёт вывод из предшествующей речи о суде и естественно вводит торжественное заключение.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: слушайте слово Яхве
  rationale: Множественное повелительное наклонение и традиционная пророческая формула сохранены; יהוה передано личным именем «Яхве».
- source_word: כָּל יְהוּדָה הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: все иудеи, живущие в земле Египетской
  rationale: Коллективное «вся Иудея» по контексту обозначает иудеев, поселившихся в Египте; русский этноним делает обращение ясным, а «земля Египетская» сохраняет אֶרֶץ.
- source_word: הִנְנִי
  choice: вот
  rationale: Сохраняет указательную торжественность вводной формулы без архаического утяжеления.
- source_word: נִשְׁבַּעְתִּי בִּשְׁמִי הַגָּדוֹל
  choice: Я поклялся Моим великим именем
  rationale: Совершенный вид передаёт уже данную непреложную клятву; образ великого имени сохранён буквально.
- source_word: אִם יִהְיֶה עוֹד
  choice: больше не будет
  rationale: После формулы клятвы אִם выражает усиленное отрицание; по-русски отрицательная сила должна быть обозначена явно.
- source_word: שְׁמִי נִקְרָא בְּפִי
  choice: Моё имя больше не будет произнесено устами
  rationale: Сохраняется пассивная конструкция и образ имени в устах говорящего; контекст уточняет, что речь идёт о клятвенном произнесении.
- source_word: כָּל אִישׁ יְהוּדָה
  choice: ни одного иудея
  rationale: В отрицательном русском предложении естественно передаёт распределительное «какого-либо мужа/человека Иуды», не исключая грамматически мужскую форму исходного выражения.
- source_word: חַי אֲדֹנָי יְהוִה
  choice: Жив Владыка Яхве!
  rationale: Передаёт обычную древнееврейскую формулу клятвы; אֲדֹנָי передано титулом «Владыка», а יהוה — именем «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет различие между личным именем יהוה и титулом אֲדֹנָי.
- issue: Смысл выражения שְׁמִי נִקְרָא בְּפִי
  choice: Моё имя больше не будет произнесено устами ... в словах
  alternative: никто больше не будет призывать Моё имя
  rationale: Выбранная формулировка сохраняет телесный образ уст и не расширяет значение до молитвенного призывания вообще; приведённая далее формула показывает контекст клятвы.
- issue: Сочетание אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Так сохраняются и титул, и личное имя, а два разных еврейских элемента не сливаются в общее обозначение Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис торжественный, но понятный; сохранены повтор имени Яхве, формула божественной клятвы и образ произнесения имени устами.
