    rationale: Еврейское אֹמֵר относится к человеку, у которого имя звучит «в устах», и вводит произносимую клятвенную формулу. Русское «в словах» звучит канцелярски и размывает эту связь.
  - severity: low
    issue: «В земле Египетской» несколько архаично для заявленного современного литературного варианта.
    rationale: «В земле Египта» сохраняет значение אֶרֶץ и торжественный регистр без искусственной архаизации.
  - severity: low
    issue: Сноска поставлена после цитируемой формулы, хотя поясняет предшествующий древнееврейский оборот.
    rationale: Якорь следует поставить непосредственно после слов об имени «на устах»; так объём поясняемого выражения ясен.
