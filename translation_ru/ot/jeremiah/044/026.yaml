  to: 'Итак, слушайте слово Яхве, все иудеи, живущие в земле Египта: вот, Я поклялся Моим великим именем, — говорит Яхве, — что во всей земле Египта Моё имя больше не будет звучать на устах ни одного иудея[a], говорящего: «Жив Владыка Яхве!»'
  rationale: Правка сохраняет пассивно-образный смысл исходного выражения — имя больше не будет находиться на устах иудеев — и точнее связывает «говорящего» с последующей формулой клятвы. Также устранена ненужная архаизация и перенесён знак сноски к поясняемому обороту.
