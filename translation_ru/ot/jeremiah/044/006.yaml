  text: וַ/תִּתַּ֤ךְ חֲמָתִ/י֙ וְ/אַפִּ֔/י וַ/תִּבְעַר֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרֽוּשָׁלִָ֑ם וַ/תִּהְיֶ֛ינָה לְ/חָרְבָּ֥ה לִ/שְׁמָמָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/006.yaml
  text: So my wrath and my anger were poured out and burned in the cities of Judah and in the streets of Jerusalem[a], and they became a ruin and a desolation, as they are this day.
translation:
  language: ru
  text: И излились моя ярость и мой гнев, и запылали в городах Иудеи и на улицах Иерусалима[a]; города и улицы стали разорением и запустением, как они таковы и поныне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на площадях» или «в открытых местах» Иерусалима.'
    reason: Еврейское חֻצוֹת может обозначать улицы, площади или открытые общественные места.
lexical_decisions:
- source_word: וַתִּתַּךְ
  choice: излились
  rationale: Сохраняет конкретную метафору излияния Божьего гнева; множественное число естественно согласуется с однородными подлежащими «ярость» и «гнев».
- source_word: חֲמָתִי
  choice: Моя ярость
  rationale: Передаёт значение жгучей, сильной ярости и позволяет отличить חֵמָה от следующего אַף, сохраняя параллелизм.
- source_word: וְאַפִּי
  choice: и Мой гнев
  rationale: Передаёт идиоматическое значение אַף, а не буквальное «нос»; в паре с «яростью» звучит естественно и сохраняет усиление.
- source_word: וַתִּבְעַר
  choice: и запылали
  rationale: Сохраняет метафору горения. Форма единственного числа в еврейском может относиться к совокупному выражению гнева, тогда как по-русски при двух однородных подлежащих естественно множественное число.
- source_word: בְּעָרֵי יְהוּדָה
  choice: в городах Иудеи
  rationale: Прямо передаёт местное значение предлога ב и название области.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: и на улицах Иерусалима
  rationale: «Улицы» — наиболее естественное контекстуальное значение חֻצוֹת; возможное значение «площади» отмечено в сноске.
- source_word: וַתִּהְיֶינָה
  choice: и те превратились
  rationale: Передаёт наступившее вследствие суда состояние и сохраняет множественное число, относя его к названным местам; указательное «те» предотвращает ошибочное отнесение к ярости и гневу.
- source_word: לְחָרְבָּה
  choice: в развалины
  rationale: Естественно передаёт состояние разрушенных городов и улиц; множественная форма хорошо согласуется с коллективным обозначением мест.
- source_word: לִשְׁמָמָה
  choice: и пустыню
  rationale: Сохраняет образ опустошённого, безлюдного места и пророческую выразительность.
- source_word: כַּיּוֹם הַזֶּה
  choice: как это и есть сегодня
  rationale: Передаёт указание на наблюдаемое состояние ко времени речи современным и естественным русским оборотом.
theological_decisions:
- issue: Язык Божьего суда
  choice: 'Сохранены конкретные образы: «ярость», «гнев», «излились», «запылали».'
  alternative: Обобщить как «пришло наказание» или «совершился суд».
  rationale: Еврейский текст подчёркивает личное и деятельное Божье осуждение яркими метафорами; их не следует смягчать или заменять богословским пересказом.
- issue: Референт формы וַתִּהְיֶינָה
  choice: «те превратились» относится к перечисленным местам — городам и улицам.
  alternative: 'Безличное или обобщённое единственное число: «всё стало».'
  rationale: Женская форма множественного числа естественно отсылает к местам, названным существительными женского рода; перевод сохраняет число и делает связь ясной без снятия образной напряжённости.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные буквы в притяжательных местоимениях, относящихся к Богу, соответствуют принятой русской библейской издательской традиции. Союзная цепочка сохранена умеренно, чтобы отразить движение еврейского повествования без тяжеловесности.
