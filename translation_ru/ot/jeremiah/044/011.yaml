base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/011.yaml
  text: 'Therefore[a], this is what Yahweh of Armies, the God of Israel, says: Behold, I am setting my face against you for harm[b], to cut off all Judah.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве воинств[a], Бог Израиля: «Вот, Я обращу лицо Моё против вас, чтобы навести бедствие[b] и истребить всю Иудею».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Господь Саваоф».'
    reason: lexical_alternative
  - marker: b
    text: То есть бедствие как кара и суд, а не нравственное зло.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего обличения и сохраняет логическую связь.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная для современного литературного русского языка пророческая формула, сохраняющая торжественный регистр.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя как имя, а צְבָאוֹת — прозрачным русским соответствием, охватывающим силы, которыми повелевает Бог.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо передаёт древнееврейскую сопряжённую конструкцию.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет указательную силу и торжественное введение решительного Божьего действия.
- source_word: שָׂם פָּנַי בָּכֶם
  choice: обращу лицо Моё против вас
  rationale: Сохраняет древнееврейскую метафору решительной враждебной направленности; русское будущее естественно выражает предстоящее действие в данном пророческом контексте.
- source_word: לְרָעָה
  choice: чтобы навести бедствие
  rationale: В контексте суда רָעָה означает губительное бедствие, а не нравственное зло; конструкция также естественно связывается с последующим инфинитивом цели.
- source_word: וּלְהַכְרִית
  choice: и истребить
  rationale: Передаёт каузативное значение Hiphil и крайнюю тяжесть суда более естественно по-русски, чем буквальное «отсечь».
- source_word: כָּל יְהוּדָה
  choice: всю Иудею
  rationale: Сохраняет компактность оригинала и коллективно-территориальную неоднозначность названия Иуды/Иудеи.
theological_decisions:
- issue: Передача יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф / Господь воинств
  rationale: Тетраграмматон передан личным именем, а титул — по смыслу, без сведения его к менее прозрачной традиционной транслитерации.
- issue: Смысл לְרָעָה применительно к Божьему действию
  choice: чтобы навести бедствие
  alternative: во зло / на погибель
  rationale: Контекст указывает на бедствие как судебное наказание, а не на нравственное зло; формулировка не устраняет суровую направленность Божьего решения.
- issue: Объём כָּל יְהוּדָה
  choice: всю Иудею
  alternative: весь народ Иудеи / всю Иуду
  rationale: Название может обозначать как страну, так и сообщество; краткая форма сохраняет коллективно-территориальное напряжение, не добавляя слова «народ».
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Сохранена метафора обращения лица против адресатов; синтаксис сделан естественным без ослабления угрозы суда.
