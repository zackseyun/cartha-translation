  terminology: «Воскурять благовония» точно передаёт קטר в данном культовом контексте; «другим богам» корректно передаёт לֵאלֹהִים אֲחֵרִים. «От своего зла» сохраняет широту רָעָה и не навязывает более узкое толкование.
