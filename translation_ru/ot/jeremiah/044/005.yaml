base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/005.yaml
  text: But they did not listen or incline their ear to turn from their evil[a], so as not to make offerings to other gods.
translation:
  language: ru
  text: Но они не слушали и не склоняли уха, чтобы отвратиться от своего зла и перестать воскурять благовония другим богам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: не слушали
  rationale: В данном пророческом обличении глагол означает не просто слышать звук, а внимать сказанному; «не слушали» сохраняет этот смысл, не усиливая его до прямого «не повиновались».
- source_word: הִטּוּ אֶת אָזְנָם
  choice: не склонили уха
  rationale: Сохранён еврейский образ внимательного прислушивания; выражение естественно для возвышенного современного русского библейского регистра.
- source_word: לָשׁוּב
  choice: отвернуться
  rationale: Глагол שׁוב здесь обозначает перемену направления — уход от зла; «отвернуться» передаёт это без добавления более специального богословского термина «покаяться».
- source_word: מֵרָעָתָם
  choice: от своего зла
  rationale: Форма с местоименным суффиксом буквально указывает на принадлежащее им зло; формулировка оставляет открытыми как злые поступки, так и более широкий смысл порочности.
- source_word: לְבִלְתִּי קַטֵּר
  choice: и не воскурять благовония
  rationale: קטר в данной культовой формуле непосредственно обозначает воскурение; русский глагол «воскурять» точно и кратко передаёт ритуальное действие. Союз «и» естественно связывает отказ от этого действия с обращением от зла, а отрицательный инфинитив передаёт לבלתי.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Дательный падеж естественно передаёт направленность и посвящение культового действия иным богам.
theological_decisions:
- issue: Объём значения культового глагола קטר
  choice: не воскурять благовония другим богам
  alternative: не приносить приношений другим богам
  rationale: В этом контексте буквальное культовое значение «воскурять» хорошо понятно по-русски и не требует расширять смысл до всех видов приношений; тем самым сохраняется конкретность еврейского текста.
- issue: Связь לבלתי קטר с обращением от зла
  choice: чтобы отвернуться от своего зла и не воскурять
  alternative: чтобы, отвернувшись от своего зла, перестать воскурять
  rationale: Конструкция допускает понимание прекращения воскурений как конкретного выражения обращения от зла. Выбранная координация не навязывает строгого разграничения между целью и пояснением и сохраняет компактность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Образ «склонить ухо» и культовый глагол «воскурять» сохранены как понятные библейские выражения; архаические формы и конфессионально окрашенные пояснения не вводятся.
