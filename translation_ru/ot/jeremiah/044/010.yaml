source:
  edition: WLC
  text: לֹ֣א דֻכְּא֔וּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א יָרְא֗וּ וְ/לֹֽא הָלְכ֤וּ בְ/תֽוֹרָתִ/י֙ וּ/בְ/חֻקֹּתַ֔/י אֲשֶׁר נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם וְ/לִ/פְנֵ֥י אֲבוֹתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/010.yaml
  text: They have not been humbled to this day[a], and they have not feared[b], and they have not walked in my law and in my statutes that I set before you and before your fathers.
translation:
  language: ru
  text: Они по сей день не смирились[a], не боялись[b] и не жили по Моему Закону и Моим установлениям, которые Я дал вам и вашим отцам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не сокрушились», «не были сокрушены» или «не были смирены»; по смыслу также возможно: «не раскаялись».'
    reason: lexical_alternative
  - marker: b
    text: Здесь речь может идти не только о страхе, но и о благоговейном почтении к Богу.
    reason: lexical_ambiguity
  - marker: c
    text: 'То есть прежним поколениям; возможно также: «вашим предкам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֻכְּאוּ
  choice: не смирились
  rationale: Форма от דכא может означать «быть сокрушёнными, униженными». В данном контексте «не смирились» естественно передаёт нравственно-духовный смысл, не подменяя глагол более истолковательным «не покаялись».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до этого дня
  rationale: Устойчивое обозначение состояния, продолжающегося вплоть до настоящего момента.
- source_word: יָרְאוּ
  choice: не боялись
  rationale: Глагол ירא допускает как страх, так и благоговейное почтение. «Не боялись» сохраняет эту смысловую напряжённость и не сводит выражение только к испугу или только к почитанию.
- source_word: הָלְכוּ
  choice: не жили по
  rationale: Буквально глагол означает «ходить», но в сочетании с Законом выражает образ жизни и поведение. «Не жили по» передаёт заветную метафору естественным современным русским языком.
- source_word: בְּתוֹרָתִי
  choice: по Моему Закону
  rationale: תורה может означать «наставление, учение, закон»; параллель с установлениями и правовой контекст поддерживают перевод «Закон».
- source_word: וּבְחֻקֹּתַי
  choice: и Моим установлениям
  rationale: חֻקּוֹת обозначает предписанные постановления или установления. Выбранный вариант сохраняет заветно-правовой регистр и звучит естественно по-русски.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: которые Я дал вам
  rationale: נתן буквально означает «дать». Сочетание с לפני указывает на то, что предписания были представлены адресатам и обязательны для них; по-русски «дал вам» передаёт это ясно и без буквализма.
- source_word: וְלִפְנֵי אֲבוֹתֵיכֶם
  choice: и вашим отцам
  rationale: 'Суффиксы в еврейском тексте стоят во втором лице множественного числа: «вам» и «вашим отцам». «Отцам» сохраняет явно мужскую форму и может обозначать прежние поколения.'
theological_decisions:
- issue: Следует ли передавать דֻכְּאוּ явным языком покаяния
  choice: не смирились
  alternative: не покаялись; не сокрушились; не были унижены
  rationale: Контекст подразумевает отказ должным образом откликнуться на Божий суд, однако сам глагол прямо не означает «каяться». Перевод сохраняет формулировку и богословский вывод, не сливая их.
- issue: Как передать смысл יָרְאוּ
  choice: не боялись
  alternative: не благоговели; не испытывали страха
  rationale: Еврейский глагол способен обозначать и страх, и благоговейное отношение к Богу. Более широкое «боялись» не устраняет эту многозначность.
- issue: К кому относятся суффиксы в конце стиха
  choice: вам и вашим отцам
  alternative: им и их отцам
  rationale: Формы לִפְנֵיכֶם и אֲבוֹתֵיכֶם недвусмысленно имеют суффиксы второго лица мужского рода множественного числа. Поэтому обращение к слушателям сохраняется, несмотря на третье лицо в начале стиха.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Заглавные буквы в «Моему Закону», «Моим» и «Я» обозначают речь Бога. Выражение «жили по» естественно передаёт еврейскую заветную идиому «ходили в», а повтор отрицания умеренно сглажен без изменения смысла.
