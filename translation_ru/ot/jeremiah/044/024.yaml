  text: וַ/יֹּ֤אמֶר יִרְמְיָ֨הוּ֙ אֶל כָּל הָ/עָ֔ם וְ/אֶ֖ל כָּל הַ/נָּשִׁ֑ים שִׁמְעוּ֙ דְּבַר יְהוָ֔ה כָּל יְהוּדָ֕ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/024.yaml
  text: Then Jeremiah said to all the people and to all the women[a], “Hear the word of Yahweh, all Judah who are in the land of Egypt.”
translation:
  language: ru
  text: 'Затем Иеремия сказал всему народу и всем женщинам: «Слушайте слово Яхве, все иудеи[a], находящиеся в Египте!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вся Иудея». Здесь имеется в виду вся иудейская община, находившаяся в Египте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Затем … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «затем» естественно передаёт переход к следующему речевому акту.
- source_word: יִרְמְיָהוּ
  choice: Иеремия
  rationale: Устоявшаяся русская форма имени пророка.
- source_word: אֶל כָּל הָעָם
  choice: всему народу
  rationale: עָם обозначает народ как совокупность людей; дательный падеж после «сказал» естественен в русском.
- source_word: וְאֶל כָּל הַנָּשִׁים
  choice: и всем женщинам
  rationale: נָשִׁים может означать женщин или жён; в данном контексте обращение направлено к женщинам как группе, поэтому выбрано более широкое значение.
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Повелительная форма множественного числа. «Слушайте» естественно звучит как настоятельный пророческий призыв и предполагает внимательное восприятие.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняется традиционная пророческая формула и личное Божье имя.
- source_word: יְהוָה
  choice: Яхве
  rationale: Русская передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: כָּל יְהוּדָה
  choice: все иудеи[a]
  rationale: Буквально выражение имеет коллективную форму «вся Иудея», но здесь непосредственно обозначает находящихся в Египте выходцев из Иудеи; «все иудеи» ясно передаёт адресатов.
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  choice: находящиеся в Египте
  rationale: Естественная современная русская передача относительной конструкции и обычного древнееврейского географического выражения «в земле Египта».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Коллективное обозначение כָּל יְהוּדָה
  choice: все иудеи
  alternative: вся Иудея
  rationale: В обращении речь идёт не о территории или государстве, а о всей иудейской общине в Египте; буквальная форма отмечена в сноске, чтобы сохранить образ выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным для устного обращения; архаизмы вроде «в земле Египетской» не используются.
