  verdict: revise
  source_fidelity: 'Второй אֶל перед «всеми иудеями» естественнее передать как указание на адресатов: пророческое слово обращено к иудеям в Египте. Вариант «обо всех иудеях» превращает их прежде всего в предмет сообщения и ослабляет адресную направленность, подтверждаемую последующей речью. Остальные элементы, включая повтор «живущим», перечень мест, «землю Патрос» и завершающую формулу, переданы верно.'
