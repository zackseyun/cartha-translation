revisions:
- from: 'Слово, которое пришло к Иеремии обо всех иудеях, живущих в земле Египетской, — о живущих в Мигдоле, Тафнисе, Нофе[a] и земле Патрос, — гласило:'
  to: 'Слово, которое пришло к Иеремии ко всем иудеям, живущим в земле Египта, — к живущим в Мигдоле, Тафнисе, Нофе[a] и земле Патрос, — гласило:'
  rationale: 'Исправлено обозначение отношения слова к иудеям: они переданы как адресаты, а не как тема слова. Одновременно «земля Египетская» заменена на нейтральное современное «земля Египта». Сохранены пророческая формула, повтор причастия, топонимы, двоеточие перед речью следующего стиха и сноска к Нофу.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:14:48Z'
