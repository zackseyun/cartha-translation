base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/001.yaml
  text: The word that came to Jeremiah concerning all the Judeans living in the land of Egypt[a], those living in Migdol and in Tahpanhes and in Noph and in the land of Pathros, saying,
translation:
  language: ru
  text: 'Слово, которое пришло к Иеремии ко всем иудеям, живущим в земле Египта, — к живущим в Мигдоле, Тафнисе, Нофе[a] и земле Патрос, — гласило:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ноф — еврейское название египетского города, более известного как Мемфис.
    reason: cross_reference
lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: Сохраняет устойчивую пророческую формулу и не заменяет её более истолковывающим словом «весть».
- source_word: אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: которое пришло к Иеремии
  rationale: Естественно передаёт обычную древнееврейскую формулу о слове, полученном пророком.
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: обо всех иудеях
  rationale: В данном построении второй предлог אֶל обозначает круг людей, к которым относится пророческое слово; «иудеи» сохраняет историко-географическую связь с Иудеей.
- source_word: הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: живущих в земле Египетской
  rationale: Причастие передаёт постоянное проживание, а слово «земля» сохранено из еврейского текста.
- source_word: הַיֹּשְׁבִים
  choice: о живущих
  rationale: Повтор причастия сохранён, поскольку он вводит уточняющий перечень мест проживания.
- source_word: מִגְדֹּל
  choice: Мигдол
  rationale: Географическое название передано принятой русской транслитерацией.
- source_word: תַחְפַּנְחֵס
  choice: Тафнис
  rationale: Использована узнаваемая русская библейская форма египетского топонима.
- source_word: נֹף
  choice: Ноф
  rationale: В основном тексте сохранена еврейская форма названия; отождествление с Мемфисом вынесено в сноску.
- source_word: אֶרֶץ פַּתְרוֹס
  choice: земле Патрос
  rationale: Сохранено явно выраженное в оригинале слово «земля».
- source_word: לֵאמֹר
  choice: 'гласило:'
  rationale: Передаёт формулу введения последующей речи и естественно завершает русское предложение перед словами следующего стиха.
theological_decisions:
- issue: Значение второго אֶל перед כָּל הַיְּהוּדִים
  choice: обо всех иудеях
  alternative: ко всем иудеям / для всех иудеев
  rationale: Конструкция допускает понимание иудеев как адресатов, однако выбранный вариант естественно связывает второй אֶל с содержанием слова, пришедшего к Иеремии, не исключая того, что последующее пророчество обращено к ним.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой формулы. Тире выделяют уточняющий перечень поселений; двоеточие показывает, что речь начинается в следующем стихе.
