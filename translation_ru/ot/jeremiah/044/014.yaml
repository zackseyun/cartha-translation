revisions:
- from: И никто не спасётся и не уцелеет из остатка Иуды, пришедшего поселиться там, в земле Египетской, а затем вернуться в землю Иуды, куда они всей душой стремятся вернуться, чтобы жить там[a]. Они не вернутся — кроме тех, кому удастся спастись.
  to: И не будет ни спасшегося, ни уцелевшего среди остатка Иуды — тех, кто пришёл поселиться там, в земле Египта, а затем вернуться в землю Иуды, куда они всей душой стремятся[a] вернуться, чтобы жить там; ибо они не вернутся, кроме спасшихся.
  rationale: Исправлена связь множественного еврейского причастия с «остатком Иуды», сохранены два исходных обозначения лиц в начальной паре и сделана однозначной привязка сноски к идиоме. Исключение в конце оставлено столь же напряжённым, как в еврейском тексте, без добавления «немногие» или иной интерпретации.
