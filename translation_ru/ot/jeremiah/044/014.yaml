source:
  edition: WLC
  text: וְ/לֹ֨א יִהְיֶ֜ה פָּלִ֤יט וְ/שָׂרִיד֙ לִ/שְׁאֵרִ֣ית יְהוּדָ֔ה הַ/בָּאִ֥ים לָ/גֽוּר שָׁ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לָ/שׁ֣וּב אֶ֣רֶץ יְהוּדָ֗ה אֲשֶׁר הֵ֜מָּה מְנַשְּׂאִ֤ים אֶת נַפְשָׁ/ם֙ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת שָׁ֔ם כִּ֥י לֹֽא יָשׁ֖וּבוּ כִּ֥י אִם פְּלֵטִֽים־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/014.yaml
  text: So there will be no fugitive or survivor for the remnant of Judah who are coming to sojourn there in the land of Egypt and then to return to the land of Judah[a], to which they are lifting up their soul to return and dwell there; for they will not return, except for fugitives.
translation:
  language: ru
  text: И не будет ни спасшегося, ни уцелевшего среди остатка Иуды — тех, кто пришёл поселиться там, в земле Египта, а затем вернуться в землю Иуды, куда они всей душой стремятся[a] вернуться, чтобы жить там; ибо они не вернутся, кроме спасшихся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «куда они возносят свою душу, чтобы вернуться и жить там»; это еврейское выражение означает сильное желание, стремление.'
    reason: Пояснение еврейской идиомы и сохранение её буквального образа для читателя.
lexical_decisions:
- source_word: פָּלִיט וְשָׂרִיד
  choice: никто не спасётся и не уцелеет
  rationale: Глагольная формулировка естественна по-русски и сохраняет различие между тем, кто избежал гибели, и тем, кто остался в живых после бедствия.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: остаток Иуды
  rationale: Передаёт исторически оставшуюся часть народа без добавления положительной богословской оценки.
- source_word: הַבָּאִים לָגוּר שָׁם
  choice: пришедшего поселиться там
  rationale: Причастие обозначает людей, пришедших в Египет; גור указывает на проживание пришельцами, но в современном русском «поселиться» яснее и естественнее архаичного «обитать».
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египетской
  rationale: Сохраняет явно выраженное אֶרֶץ и торжественный строй пророческой речи.
- source_word: וְלָשׁוּב אֶרֶץ יְהוּדָה
  choice: а затем вернуться в землю Иуды
  rationale: '«Затем» поясняет предполагаемую последовательность: временно поселиться в Египте и после этого возвратиться; русское «а» естественно отмечает смену направления.'
- source_word: מְנַשְּׂאִים אֶת נַפְשָׁם
  choice: всей душой стремятся
  rationale: Идиома буквально говорит о «вознесении души», то есть о сильном стремлении или желании. Функциональный русский эквивалент сохраняет образ души без неясной кальки.
- source_word: לָשׁוּב לָשֶׁבֶת שָׁם
  choice: вернуться, чтобы жить там
  rationale: Передаёт два связанных инфинитива и ясно выражает цель возвращения.
- source_word: כִּי לֹא יָשׁוּבוּ כִּי אִם פְּלֵטִים
  choice: Они не вернутся — кроме тех, кому удастся спастись
  rationale: Сохраняет резкое общее отрицание и последующее исключение, не добавляя отсутствующего в еврейском определения «немногие».
theological_decisions:
- issue: Богословская окраска выражения «остаток Иуды»
  choice: 'Понять выражение описательно: уцелевшая часть населения Иуды, находящаяся под судом.'
  alternative: Передать его как положительно оценённый «верный остаток».
  rationale: Контекст не называет эту группу верной и не придаёт ей положительного заветного статуса; такая окраска была бы привнесена в текст.
- issue: Напряжение между полным отрицанием спасшихся и заключительным исключением
  choice: 'Сохранить формулировку: никто не спасётся, но затем — «кроме тех, кому удастся спастись».'
  alternative: Сгладить напряжение, добавив «почти никто» или «лишь немногие».
  rationale: Еврейский текст сам сочетает категорическое утверждение с исключением; перевод не должен молча устранять эту риторическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Избегаются как архаичные кальки («возносят душу» в основном тексте), так и разговорные обороты. Повтор «вернуться» сохранён, поскольку он заметен и смыслово значим в еврейском тексте.
