lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему речевому действию.
- source_word: אֶל כָּל הָעָם
  choice: всему народу
  rationale: עָם обозначает народ как совокупность людей, а אֶל указывает на адресата речи.
- source_word: עַל הַגְּבָרִים וְעַל הַנָּשִׁים
  choice: мужчинам, женщинам
  rationale: После обозначения всего народа повторённое עַל вводит уточнение адресатов; дательный падеж по-русски передаёт эту функцию естественнее, чем буквальное «о мужчинах и о женщинах».
- source_word: וְעַל כָּל הָעָם
  choice: и всем
  rationale: Сохраняется повторное указание на полноту аудитории, но слово «народ» не дублируется механически, поскольку по-русски это создало бы ложное впечатление о двух разных группах.
- source_word: הָעֹנִים אֹתוֹ דָּבָר
  choice: кто отвечал ему
  rationale: Причастие עֹנִים характеризует собравшихся как отвечавших Иеремии. Сочетание с דָּבָר буквально означает «отвечавшие ему слово», но по-русски смысл естественно выражается глаголом «отвечал».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит прямую речь, продолжающуюся в следующем стихе; в современном русском эту функцию естественно выполняет двоеточие.
