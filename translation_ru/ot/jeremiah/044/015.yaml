  text: וַ/יַּעֲנ֣וּ אֶֽת יִרְמְיָ֗הוּ כָּל הָ/אֲנָשִׁ֤ים הַ/יֹּֽדְעִים֙ כִּֽי מְקַטְּר֤וֹת נְשֵׁי/הֶם֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וְ/כָל הַ/נָּשִׁ֥ים הָ/עֹמְד֖וֹת קָהָ֣ל גָּד֑וֹל וְ/כָל הָ/עָ֛ם הַ/יֹּשְׁבִ֥ים בְּ/אֶֽרֶץ מִצְרַ֖יִם בְּ/פַתְר֥וֹס לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/015.yaml
  text: Then all the men who knew that their wives were burning incense to other gods[a], and all the women who were standing by—a great assembly—and all the people who were living in the land of Egypt, in Pathros, answered Jeremiah, saying,
translation:
  language: ru
  text: 'Тогда все мужчины, знавшие, что их жёны возжигали благовония другим богам, и все стоявшие женщины — большое собрание, — и весь народ, живший в земле Египта, в Патросе, ответили Иеремии:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: ответили
  rationale: Глагол ענה в данном повествовательном контексте вводит ответ на слова Иеремии; «ответили» естественно и точно передаёт эту функцию.
- source_word: כָּל הָאֲנָשִׁים
  choice: все мужчины
  rationale: 'Здесь אֲנָשִׁים обозначает именно мужчин: далее упомянуты «их жёны», а женщины названы отдельно.'
- source_word: הַיֹּדְעִים
  choice: знавшие
  rationale: Причастие атрибутивно характеризует мужчин как осведомлённых о действиях своих жён.
- source_word: מְקַטְּרוֹת
  choice: воскуряют благовония
  rationale: В породе piel קטר обычно обозначает культовое сожжение благовоний; настоящее время по-русски естественно передаёт продолжительное или обычное действие, выраженное причастием.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Дательный падеж ясно передаёт направленность культового действия к иным божествам.
- source_word: וְכָל הַנָּשִׁים הָעֹמְדוֹת
  choice: и все стоявшие там женщины
  rationale: Причастие עמד указывает, что женщины стояли и присутствовали на месте происходящего; «там» естественно выражает контекстуальный дейксис без изменения смысла.
- source_word: קָהָל גָּדוֹל
  choice: большое собрание
  rationale: קָהָל обозначает собравшуюся общность; «собрание» сохраняет коллективный и несколько официальный оттенок.
- source_word: וְכָל הָעָם
  choice: и весь народ
  rationale: עָם обозначает более широкую совокупность людей; «весь народ» является прямым и естественным соответствием.
- source_word: הַיֹּשְׁבִים
  choice: живший
  rationale: В географическом контексте ישׁב означает проживание; форма единственного числа согласуется с собирательным «народ».
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египетской
  rationale: Формулировка сохраняет явно названное в еврейском тексте слово «земля» и остаётся понятной в dignified литературном русском.
- source_word: בְּפַתְרוֹס
  choice: в Патросе
  rationale: Географическое название транслитерировано и оформлено согласно русской падежной норме.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейская формула введения прямой речи естественно передаётся в современном русском двоеточием, поскольку сама речь следует в следующем стихе.
