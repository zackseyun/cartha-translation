base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/013.yaml
  text: And I will punish those who dwell in the land of Egypt[a], just as I punished Jerusalem, with the sword, with famine[b], and with pestilence.
translation:
  language: ru
  text: 'И Я накажу жителей земли Египта[a], как наказал Иерусалим: мечом, голодом и мором[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я совершу суд над жителями земли Египта… как совершил суд над Иерусалимом». Еврейский глагол פקד может означать «обратить внимание», «посетить», а в контексте суда, как здесь, — «наказать».'
    reason: lexical_alternative
  - marker: b
    text: '«Мор» — повальная смертоносная болезнь; возможный перевод: «эпидемия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: И Я накажу
  rationale: В данном контексте פקד обозначает карающее вмешательство Бога; «накажу» ясно и естественно передаёт этот смысл, не устраняя более широкую семантику глагола, отмеченную в сноске.
- source_word: הַיֹּשְׁבִים בְּאֶרֶץ מִצְרַיִם
  choice: живущих в земле Египетской
  rationale: Причастие ישב передано как «живущих», а выражение «земля Египетская» сохраняет явное упоминание земли и звучит в русском библейском повествовании естественно и достойно.
- source_word: כַּאֲשֶׁר פָּקַדְתִּי עַל יְרוּשָׁלִָם
  choice: как наказал Иерусалим
  rationale: Сравнение сохранено прямо; повтор פקד передан тем же глаголом ради смысловой и риторической связи двух судов.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: мечом, голодом и мором
  rationale: Творительный падеж естественно выражает средство суда и сохраняет традиционную трёхчастную пророческую формулу; דֶּבֶר здесь означает повальную смертоносную болезнь.
theological_decisions:
- issue: Судебное значение глагола פקד
  choice: «накажу / наказал»
  alternative: «посещу / посетил судом»
  rationale: Меч, голод и мор однозначно задают контекст Божьего суда. Явное «накажу» передаёт судебную силу текста без добавления конфессионального толкования; более буквальная возможность указана в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавное «Я» обозначает говорящего Бога. Тире перед перечислением подчёркивает средства суда, не добавляя нового смыслового отношения.
