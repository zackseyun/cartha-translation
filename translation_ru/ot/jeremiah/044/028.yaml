revisions:
- from: И уцелевшие от меча возвратятся из земли Египетской в землю Иудейскую — немногие числом[a]. Тогда весь остаток Иудеи, пришедший в землю Египетскую, чтобы жить там как чужеземцы, узнает, чьё слово устоит[b] — Моё или их.
  to: И немногие уцелевшие от меча возвратятся из земли Египта в землю Иудеи[a], и все оставшиеся из Иудеи, пришедшие в землю Египта, чтобы поселиться там как чужеземцы, узнают, чьё слово устоит[b] — Моё или их.
  rationale: Убрано невыраженное в оригинале «тогда», множественное הַבָּאִים передано явным множественным определением, а географические формулы обновлены без потери повторяемого слова «земля». Сохранены образ «меча», термин «остаток» по смыслу («оставшиеся из Иудеи») и метафора подтверждённого слова («устоит»).
