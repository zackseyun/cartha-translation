    rationale: Последовательность событий понятна из контекста, но в еврейском тексте нет отдельного временного наречия; его лучше не добавлять.
  - severity: low
    issue: Собирательное единственное число в определении «остаток ... пришедший» скрывает множественное число הַבָּאִים.
    rationale: Форма «все оставшиеся из Иудеи, пришедшие...» естественно передаёт и охват כָּל, и множественное причастие оригинала.
  - severity: low
    issue: Географические прилагательные «Египетская» и «Иудейская» несколько архаичны.
    rationale: Родительный оборот соответствует современному литературному русскому и сохраняет повтор «земля» в оригинале.
