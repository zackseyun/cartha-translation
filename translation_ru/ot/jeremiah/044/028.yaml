source:
  edition: WLC
  text: וּ/פְלִיטֵ֨י חֶ֜רֶב יְשֻׁב֨וּ/ן מִן אֶ֧רֶץ מִצְרַ֛יִם אֶ֥רֶץ יְהוּדָ֖ה מְתֵ֣י מִסְפָּ֑ר וְֽ/יָדְע֞וּ כָּל שְׁאֵרִ֣ית יְהוּדָ֗ה הַ/בָּאִ֤ים לְ/אֶֽרֶץ מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם דְּבַר מִ֥י יָק֖וּם מִמֶּ֥/נִּי וּ/מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/028.yaml
  text: And a few survivors of the sword will return from the land of Egypt to the land of Judah[a], and all the remnant of Judah who came to the land of Egypt to sojourn there will know whose word will stand[b], mine or theirs.
translation:
  language: ru
  text: И немногие уцелевшие от меча возвратятся из земли Египта в землю Иудеи[a], и все оставшиеся из Иудеи, пришедшие в землю Египта, чтобы поселиться там как чужеземцы, узнают, чьё слово устоит[b] — Моё или их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уцелевшие от меча ... немногие числом».'
    reason: Передаёт порядок и образность еврейского выражения; в русском «немногие» ради естественности вынесено вперёд.
  - marker: b
    text: 'Или: «чьё слово исполнится — Моё или их».'
    reason: Передаёт возможное идиоматическое понимание יָקוּם.
lexical_decisions:
- source_word: וּפְלִיטֵי חֶרֶב
  choice: уцелевшие от меча
  rationale: Передаёт значение спасшихся или уцелевших и сохраняет образ меча как насильственной гибели или военного суда.
- source_word: יְשֻׁבוּן
  choice: возвратятся
  rationale: Прямо передаёт обычное значение שוב в данном предсказательном контексте.
- source_word: מִן אֶרֶץ מִצְרַיִם אֶרֶץ יְהוּדָה
  choice: из земли Египетской в землю Иудейскую
  rationale: Сохраняет повтор слова «земля» и направление движения, оставаясь естественным для литературного русского.
- source_word: מְתֵי מִסְפָּר
  choice: немногие числом
  rationale: Передаёт идиому о малом, легко исчислимом числе людей без перестановки её в начало фразы.
- source_word: וְיָדְעוּ
  choice: тогда ... узнает
  rationale: Будущее узнавание представлено как результат предшествующего суда; «тогда» естественно выражает последовательность, подразумеваемую контекстом.
- source_word: כָּל שְׁאֵרִית יְהוּדָה
  choice: весь остаток Иудеи
  rationale: «Остаток» — точный и привычный термин пророческой речи; согласование в единственном числе соответствует русской грамматике.
- source_word: הַבָּאִים לְאֶרֶץ מִצְרַיִם לָגוּר שָׁם
  choice: пришедший в землю Египетскую, чтобы жить там как чужеземцы
  rationale: «Пришедший» сохраняет форму בוא, а пояснение «как чужеземцы» передаёт социальный оттенок גור — проживания не как коренных жителей.
- source_word: דְּבַר מִי יָקוּם
  choice: чьё слово устоит
  rationale: Сохраняет еврейскую метафору утверждения и подтверждения слова, не сводя её только к исполнению.
- source_word: מִמֶּנִּי וּמֵהֶם
  choice: Моё или их
  rationale: Местоимения отнесены к слову; прописная буква обозначает речь Господа согласно непосредственному контексту.
theological_decisions:
- issue: Формула подтверждения пророческого слова
  choice: чьё слово устоит — Моё или их
  alternative: чьё слово исполнится — Моё или их
  rationale: «Устоит» сохраняет образ יָקוּם и напряжение между словом Господа и противоположными утверждениями иудеев, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Формы «земля Египетская» и «земля Иудейская» сохраняют библейскую географическую формулу, а «жить там как чужеземцы» делает значение גור понятным современному читателю.
