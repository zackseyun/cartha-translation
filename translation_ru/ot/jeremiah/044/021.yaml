  text: הֲ/ל֣וֹא אֶת הַ/קִּטֵּ֗ר אֲשֶׁ֨ר קִטַּרְתֶּ֜ם בְּ/עָרֵ֤י יְהוּדָה֙ וּ/בְ/חֻצ֣וֹת יְרוּשָׁלִַ֔ם אַתֶּ֧ם וַ/אֲבֽוֹתֵי/כֶ֛ם מַלְכֵי/כֶ֥ם וְ/שָׂרֵי/כֶ֖ם וְ/עַ֣ם הָ/אָ֑רֶץ אֹתָ/ם֙ זָכַ֣ר יְהוָ֔ה וַֽ/תַּעֲלֶ֖ה עַל לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/021.yaml
  text: Was it not the incense that you burned in the cities of Judah and in the streets of Jerusalem—you and your fathers[a], your kings and your officials, and the people of the land—that Yahweh remembered, and it came up upon his heart?
translation:
  language: ru
  text: «Разве Яхве не вспомнил воскурение, которое вы совершали в городах Иудеи и на улицах Иерусалима, — вы, ваши отцы, ваши цари, ваши вельможи и народ этой земли, — и не взошло оно Ему на сердце[a]?»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взошло на Его сердце» — образное выражение о том, что совершённое предстало перед внутренним вниманием Яхве и было Им принято во внимание.'
    reason: Сохранённый древнееврейский образ требует краткого пояснения для современного читателя.
lexical_decisions:
- source_word: הֲלֹוא
  choice: Разве не…?
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: אֶת הַקִּטֵּר אֲשֶׁר קִטַּרְתֶּם
  choice: то, что вы воскуряли
  rationale: Сохраняет культовый смысл курения жертвы и позволяет не сводить выражение исключительно к веществу или исключительно к действию.
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִַם
  choice: в городах Иудеи и на улицах Иерусалима
  rationale: Естественная передача местных выражений; חֻצוֹת может обозначать улицы и открытые городские пространства.
- source_word: אַתֶּם וַאֲבוֹתֵיכֶם מַלְכֵיכֶם וְשָׂרֵיכֶם וְעַם הָאָרֶץ
  choice: вы и ваши отцы, ваши цари и ваши вельможи, и народ этой земли
  rationale: Сохраняет полный перечень участников. «Вельможи» передаёт שָׂרִים без узкого значения царских сыновей; «народ этой земли» сохраняет прозрачность еврейского оборота.
- source_word: זָכַר יְהוָה
  choice: вспомнил Яхве
  rationale: Прямо передаёт обычное значение זכר и сохраняет личное имя יהוה.
- source_word: וַתַּעֲלֶה עַל לִבּוֹ
  choice: взошло это Ему на сердце
  rationale: Сохраняет образное и антропоморфное выражение оригинала; указательное «это» соотносится со всем упомянутым воскурением как действием.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Антропоморфизм עַל לִבּוֹ
  choice: взошло это Ему на сердце
  alternative: пришло Ему на ум
  rationale: Образ сердца сохранён, чтобы не сводить выражение лишь к умственному припоминанию и не устранять богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Два риторических вопроса делают длинную еврейскую конструкцию яснее, не меняя её общего смысла. Парные тире выделяют перечень участников.
