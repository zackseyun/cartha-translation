  source_fidelity: 'В черновике верно переданы участники, местности, личное имя Яхве и образ «сердца». Однако еврейский текст образует один риторический вопрос: Яхве вспомнил воскурение, и оно взошло Ему на сердце. Деление на два самостоятельных вопроса с повтором «Разве не» ослабляет исходную синтаксическую связь.'
  naturalness: «Взошло это Ему на сердце» понятно, но порядок «это» после глагола звучит менее естественно, чем «оно взошло Ему на сердце». «То, что вы воскуряли» несколько расплывчато; «воскурение, которое вы совершали» яснее сохраняет и культовое действие, и его предметную определённость.
