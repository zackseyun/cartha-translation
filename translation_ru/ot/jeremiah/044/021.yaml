revisions:
- from: «Разве не то, что вы воскуряли в городах Иудеи и на улицах Иерусалима, — вы и ваши отцы, ваши цари и ваши вельможи, и народ этой земли, — вспомнил Яхве? Разве не взошло это Ему на сердце[a]?»
