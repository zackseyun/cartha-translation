  text: מִ/פְּנֵי֩ אֲשֶׁ֨ר קִטַּרְתֶּ֜ם וַ/אֲשֶׁ֧ר חֲטָאתֶ֣ם לַ/יהוָ֗ה וְ/לֹ֤א שְׁמַעְתֶּם֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/בְ/תֹרָת֧/וֹ וּ/בְ/חֻקֹּתָ֛י/ו וּ/בְ/עֵדְוֺתָ֖י/ו לֹ֣א הֲלַכְתֶּ֑ם עַל כֵּ֞ן קָרָ֥את אֶתְ/כֶ֛ם הָ/רָעָ֥ה הַ/זֹּ֖את כַּ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/023.yaml
  text: Because you burned incense and sinned against Yahweh[a], and did not listen to the voice of Yahweh or walk in his law, his statutes, and his testimonies, therefore this disaster has come upon you[d][c][b], as it is this day.
translation:
  language: ru
  text: Поскольку вы кадили[a] и грешили против Яхве, не слушали голоса Яхве[b] и не следовали его закону[c], его постановлениям и его свидетельствам, потому это бедствие[d] постигло вас, как это видно сегодня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приносили курения». Еврейский глагол означает совершение культового воскурения благовоний или дымного приношения.'
    reason: lexical_alternative
  - marker: b
    text: 'По смыслу также: «не повиновались Яхве». Буквально: «не слушали голоса Яхве».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово тора может означать не только «закон», но и «наставление».
    reason: lexical_alternative
  - marker: d
    text: 'Или: «это несчастье постигло вас». Еврейское слово может означать «зло», но здесь обозначает бедствие или несчастье.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי אֲשֶׁר
  choice: поскольку
  rationale: Передаёт причинное основание последовавшего суда и естественно вводит придаточное предложение в современном русском языке.
- source_word: קִטַּרְתֶּם
  choice: кадили
  rationale: Глагол обозначает воскурение благовоний или принесение курений как культового дара; краткое «кадили» сохраняет культовый смысл в данном контексте.
- source_word: חֲטָאתֶם לַיהוָה
  choice: грешили против Яхве
  rationale: Предлог ל при חטא здесь указывает, против кого был направлен грех; сочетание естественно передаётся по-русски как «грешить против».
- source_word: שְׁמַעְתֶּם בְּקוֹל יְהוָה
  choice: не слушали голоса Яхве
  rationale: Сохранён образ «слушать голос», который одновременно подразумевает послушание, но не сводится в основном тексте только к нему.
- source_word: וּבְתוֹרָתוֹ
  choice: его закону
  rationale: В ряду заветных установлений תּוֹרָה уместно передать как «закон», сохраняя в примечании более широкое значение «наставление».
- source_word: וּבְחֻקֹּתָיו
  choice: его постановлениям
  rationale: «Постановления» ясно передаёт обязательные установления и отличается от соседних терминов.
- source_word: וּבְעֵדְוֺתָיו
  choice: его свидетельствам
  rationale: Формальный эквивалент сохраняет лексическое отличие עֵדוֹת от закона и постановлений, не сглаживая трёхчленное перечисление.
- source_word: לֹא הֲלַכְתֶּם
  choice: не следовали
  rationale: Передаёт метафору поведения, выраженную глаголом «ходить», естественным и понятным современным русским оборотом.
- source_word: קָרָאת אֶתְכֶם הָרָעָה הַזֹּאת
  choice: это бедствие постигло вас
  rationale: В контексте суда רָעָה обозначает губительное несчастье, а не нравственное зло; «постигло вас» идиоматично передаёт наступление бедствия.
- source_word: כַּיּוֹם הַזֶּה
  choice: как это видно сегодня
  rationale: Передаёт указание на нынешнее, наблюдаемое положение народа без архаичного русского оборота «как в сей день».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное заветное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Значение רָעָה в контексте суда
  choice: бедствие
  alternative: зло; несчастье; calamity
  rationale: Здесь речь идёт о постигшем народ наказании, а не о нравственном зле; «бедствие» сохраняет тяжесть смысла и не вносит утверждения о моральном зле со стороны Бога.
- issue: Соотношение слышания и послушания в שׁמע בקול
  choice: не слушали голоса Яхве
  alternative: не повиновались Яхве
  rationale: Основной текст сохраняет конкретный образ исходника, тогда как подразумеваемое послушание отмечено как допустимое смысловое прочтение.
translation_notes:
  register: Современный литературный русский с достойным библейским звучанием. Синтаксис причинно-следственной связи сделан естественным для русского языка; сохранены личное имя Яхве, образ слушания голоса и различие трёх заветно-правовых терминов.
