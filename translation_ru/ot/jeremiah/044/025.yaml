source:
  edition: WLC
  text: כֹּֽה אָמַ֣ר יְהוָֽה צְבָאוֹת֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אַתֶּ֨ם וּ/נְשֵׁי/כֶ֜ם וַ/תְּדַבֵּ֣רְנָה בְּ/פִי/כֶם֮ וּ/בִ/ידֵי/כֶ֣ם מִלֵּאתֶ֣ם לֵ/אמֹר֒ עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶת נְדָרֵ֗י/נוּ אֲשֶׁ֤ר נָדַ֨רְנוּ֙ לְ/קַטֵּר֙ לִ/מְלֶ֣כֶת הַ/שָּׁמַ֔יִם וּ/לְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִ֑ים הָקֵ֤ים תָּקִ֨ימְנָה֙ אֶת נִדְרֵי/כֶ֔ם וְ/עָשֹׂ֥ה תַעֲשֶׂ֖ינָה אֶת נִדְרֵי/כֶֽם־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/025.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: You and your wives have spoken with your mouths and fulfilled it with your hands, saying, ‘We will surely carry out our vows that we have vowed, to burn incense to the Queen of Heaven and to pour out drink offerings to her.’ Go ahead, confirm your vows and carry out your vows.'
translation:
  language: ru
  text: 'Так говорит Господь Воинств, Бог Израиля: «Вы и ваши жёны сказали своими устами и исполнили своими руками, говоря: „Мы непременно исполним обеты, которые дали: будем воскурять благовония Царице Небесной и возливать ей возлияния“. Вы, жёны, твёрдо держитесь своих обетов и исполняйте свои обеты!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Господь Воинств
  rationale: Передаёт традиционную замену тетраграмматона словом «Господь» и сохраняет конкретный образ צְבָאוֹת («воинства»), не сводя его к абстрактному «Вседержитель».
- source_word: מִלֵּאתֶם ... בִידֵיכֶם
  choice: исполнили своими руками
  rationale: Сохраняет противопоставление речи устами и осуществления делом; «руками» передано явно, как в еврейском тексте.
- source_word: עָשֹׂה נַעֲשֶׂה
  choice: мы непременно исполним
  rationale: Инфинитив абсолютный с личной формой выражает усиление и решимость; по-русски естественно передаётся наречием «непременно».
- source_word: לְקַטֵּר
  choice: воскурять благовония
  rationale: В культовом контексте обозначает совершение ароматного курения; формулировка понятна современному читателю и сохраняет ритуальный смысл.
- source_word: מְלֶכֶת הַשָּׁמַיִם
  choice: Царице Небесной
  rationale: Форма понимается как титул женского божества «царица небес»; прописные буквы обозначают титульное имя, не выражая одобрения культа.
- source_word: לְהַסֵּךְ ... נְסָכִים
  choice: возливать ей жертвенные возлияния
  rationale: Сохраняет культовое значение как глагола возлияния, так и существительного נְסָכִים; добавление «жертвенные» проясняет ритуальный характер.
- source_word: הָקֵים תָּקִימְנָה ... וְעָשֹׂה תַעֲשֶׂינָה
  choice: так непременно соблюдайте свои обеты и исполняйте их
  rationale: Две усиленные формы женского множественного числа переданы настойчивым повелением; различие между подтверждением/соблюдением и исполнением обета сохранено без тяжеловесного повтора.
theological_decisions:
- issue: Характер заключительного повеления
  choice: 'Сохранено как резкое повеление: «Так непременно соблюдайте…»'
  alternative: 'Смягчить до нейтрального разрешения: «можете исполнить»'
  rationale: Еврейские усиленные императивные формы звучат как иронический вызов или предание адресатов их упорному выбору в контексте суда, а не как божественное одобрение идолопоклонства. Сам стих оставляет риторический оттенок неразъяснённым.
- issue: Титул מְלֶכֶת הַשָּׁמַיִם
  choice: «Царица Небесная»
  alternative: «царица неба» или указание имени конкретной богини
  rationale: Текст даёт титул, но не называет божество; перевод не должен отождествлять его с конкретной богиней без прямого основания в стихе.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксический параллелизм «устами — руками» сохранён; намеренно оставлен резкий, вероятно иронический тон финала. Архаизмы сведены к уместной культовой лексике («воскурять», «возлияния»).
