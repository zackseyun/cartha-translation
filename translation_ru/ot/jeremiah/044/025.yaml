revisions:
- from: 'Так говорит Господь Воинств, Бог Израиля: «Вы и ваши жёны сказали своими устами и исполнили своими руками: „Мы непременно исполним обеты, которые дали: воскурять благовония Царице Небесной и возливать ей жертвенные возлияния“. Так непременно соблюдайте свои обеты и исполняйте их!»'
  to: 'Так говорит Господь Воинств, Бог Израиля: «Вы и ваши жёны сказали своими устами и исполнили своими руками, говоря: „Мы непременно исполним обеты, которые дали: будем воскурять благовония Царице Небесной и возливать ей возлияния“. Вы, жёны, твёрдо держитесь своих обетов и исполняйте свои обеты!»'
  rationale: Уточнён адресат финальных форм — жёны — и сохранено различие между утверждением (твёрдым соблюдением) обетов и их исполнением. Будущее «будем воскурять ... и возливать» естественно передаёт содержание данного обета и делает синтаксис русской прямой речи более плавным. Резкий, вероятно иронический характер заключения не истолковывается в самом переводе.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:14:59Z'
review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт структуру стиха, усиление в обещании («непременно») и культовые действия. Однако заключительные глаголы в еврейском тексте стоят во 2-м лице женского множественного числа и обращены именно к жёнам; это различие в черновике не отражено. Кроме того, הָקֵם в первой из двух заключительных форм лучше передать как «утверждайте/подтверждайте», а не тем же смыслом исполнения, который следует далее.
  naturalness: Язык современный, литературный и соответствует пророческому регистру. «Воскурять благовония» и «возлияния» уместны в культовом контексте. Явное обращение «Вы, жёны» в финальной реплике несколько усиливает повтор, но необходимо для сохранения грамматического адресата и остаётся естественным.
  terminology: «Господь Воинств», «Царица Небесная», «обеты», «воскурять благовония» и «возлияния» переданы последовательно и без неоправданной идентификации почитаемого божества. «Возлияния» уже передаёт ритуальный характер נְסָכִים; определение «жертвенные» можно опустить без смысловой потери.
  issues:
  - severity: medium
    issue: Не передан женский множественный адресат заключительных повелительных форм.
    rationale: Формы תָּקִימְנָה и תַּעֲשֶׂינָה обращены к женскому множественному числу. В контексте «вы и ваши жёны» финальная реплика специально обращена к жёнам; русское общее «соблюдайте» это различие стирает.
  - severity: low
    issue: Первое заключительное повеление слито по смыслу с последующим исполнением обетов.
    rationale: הָקֵם выражает утверждение, подтверждение или твёрдое соблюдение обетов, тогда как עָשָׂה — их исполнение. Различение можно сохранить естественной парой «твёрдо держитесь ... и исполняйте».
