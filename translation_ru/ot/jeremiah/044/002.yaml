reference: Jeremiah 44:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַתֶּ֣ם רְאִיתֶ֗ם אֵ֤ת כָּל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם וְ/עַ֖ל כָּל עָרֵ֣י יְהוּדָ֑ה וְ/הִנָּ֤/ם חָרְבָּה֙ הַ/יּ֣וֹם הַ/זֶּ֔ה וְ/אֵ֥ין בָּ/הֶ֖ם יוֹשֵֽׁב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: You yourselves have seen all the disaster that I brought on Jerusalem and on all the cities of Judah. And behold, they are a ruin this day[b], and there is no one living in them.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств[a], Бог Израиля: «Вы сами видели всё бедствие, которое Я навёл на Иерусалим и на все города Иудеи. И вот, ныне они — развалины[b], и никто в них не живёт».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве сил»; еврейский титул может подразумевать небесные и земные воинства.'
    reason: Лексическая широта титула צְבָאוֹת.
  - marker: b
    text: 'Или: «ныне они разорены» или «ныне они опустошены». Еврейское слово стоит в единственном числе и обозначает состояние разорения или запустения.'
    reason: Передаёт собирательный характер חָרְבָּה и объясняет возможные русские способы его передачи.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая формула пророческой речи, естественная и торжественная в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не замена его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: В составе титула сохраняет широкий смысл небесных и земных сил; традиционно и ёмко по-русски.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача еврейского сопряжённого сочетания.
- source_word: אַתֶּם רְאִיתֶם
  choice: Вы сами видели
  rationale: Отдельное местоимение אַתֶּם подчёркивает, что адресаты лично были свидетелями произошедшего.
- source_word: כָּל הָרָעָה
  choice: всё бедствие
  rationale: В контексте רָעָה означает пагубное бедствие как суд, а не нравственное зло.
- source_word: הֵבֵאתִי עַל
  choice: Я навёл на
  rationale: 'Естественно передаёт причинное действие: бедствие было приведено на Иерусалим и города Иудеи.'
- source_word: עָרֵי יְהוּדָה
  choice: города Иудеи
  rationale: Контекстуально и традиционно точная передача עָרִים.
- source_word: וְהִנָּם
  choice: И вот, они
  rationale: Сохраняет указательно-привлекающую внимание функцию частицы и её местоименный суффикс множественного числа.
- source_word: חָרְבָּה
  choice: лежат в развалинах
  rationale: Естественная русская передача состояния разорения; грамматическое единственное число в еврейском имеет собирательно-предикативную функцию при совокупном референте.
- source_word: הַיּוֹם הַזֶּה
  choice: ныне
  rationale: Передаёт актуальное состояние «в этот день» без добавления явно не выраженного длительного значения «до сего дня».
- source_word: וְאֵין בָּהֶם יוֹשֵׁב
  choice: и никто в них не живёт
  rationale: Идиоматичная русская передача буквального «нет в них жителя/живущего».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя; форма «Яхве» сохраняет его как имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Характер бедствия, наведённого Богом
  choice: бедствие, которое Я навёл
  alternative: зло, которое Я навёл
  rationale: Сохраняется прямое утверждение о Божьем действии суда, но רָעָה в данном контексте не представляется как нравственное зло.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Формула «Так говорит» и частица «И вот» сохраняют библейскую торжественность, тогда как остальная фраза избегает архаической синтаксической тяжеловесности.
