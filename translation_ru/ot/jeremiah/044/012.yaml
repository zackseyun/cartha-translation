  text: וְ/לָקַחְתִּ֞י אֶת שְׁאֵרִ֣ית יְהוּדָ֗ה אֲשֶׁר שָׂ֨מוּ פְנֵי/הֶ֜ם לָ/ב֣וֹא אֶֽרֶץ מִצְרַיִם֮ לָ/ג֣וּר שָׁם֒ וְ/תַ֨מּוּ כֹ֜ל בְּ/אֶ֧רֶץ מִצְרַ֣יִם יִפֹּ֗לוּ בַּ/חֶ֤רֶב בָּֽ/רָעָב֙ יִתַּ֔מּוּ מִ/קָּטֹן֙ וְ/עַד גָּד֔וֹל בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב יָמֻ֑תוּ וְ/הָיוּ֙ לְ/אָלָ֣ה לְ/שַׁמָּ֔ה וְ/לִ/קְלָלָ֖ה וּ/לְ/חֶרְפָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/012.yaml
  text: And I will take the remnant of Judah who have set their faces to enter the land of Egypt to sojourn there[a], and they will all come to an end in the land of Egypt. They will fall by the sword and by famine; from the least even to the greatest, they will come to an end. By the sword and by famine they will die, and they will become an oath, a horror, a curse, and a reproach.
translation:
  language: ru
  text: Я возьму остаток Иудеи — тех, кто твёрдо решил пойти в землю Египта, чтобы жить там как пришельцы, — и все они погибнут в земле Египта. Они падут от меча и голода; от малого до великого все погибнут; от меча и голода умрут и станут заклятием[a], ужасом, проклятием и поношением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «формулой проклятия» или «клятвой, призывающей проклятие». Еврейское слово אָלָה может обозначать клятву, связанную с проклятием, и отличается от следующего слова «проклятие».'
    reason: Уточняет значение אָלָה и сохраняет его отличие от קְלָלָה («проклятие»).
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Я возьму
  rationale: Сохраняет прямое значение לקח и намеренно не уточняет, каким именно образом Бог «возьмёт» остаток для суда.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: остаток Иудеи
  rationale: «Остаток» точно передаёт тех, кто уцелел после предшествующей катастрофы, и является естественным библейским термином в русском языке.
- source_word: אֲשֶׁר שָׂמוּ פְנֵיהֶם
  choice: тех, кто твёрдо решил
  rationale: Еврейская идиома буквально говорит о людях, «обративших/устремивших свои лица»; по-русски её смысл решительной направленности естественно выражается словами «твёрдо решил».
- source_word: לָבוֹא אֶרֶץ מִצְרַיִם
  choice: отправиться в землю Египта
  rationale: Передаёт направленное движение и вход в Египет без неестественного русского оборота «войти землю».
- source_word: לָגוּר שָׁם
  choice: жить там как чужеземцы
  rationale: Глагол גור обозначает проживание в качестве пришельца или переселенца; перевод сохраняет этот социальный оттенок.
- source_word: וְתַמּוּ כֹל ... בָּרָעָב יִתַּמּוּ
  choice: Все они погибнут ... погибнут от голода
  rationale: Повтор «погибнут» отражает повтор корня תמם и тяжёлую риторику приговора, оставаясь естественным по-русски.
- source_word: יִפֹּלוּ בַּחֶרֶב
  choice: падут от меча
  rationale: Сохраняет конкретный образ глагола נפל и обычную пророческую формулу гибели от меча.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: от малого до великого
  rationale: Передаёт меризм, охватывающий всех без различия положения или возраста, и сохраняет лаконичную форму оригинала.
- source_word: וְהָיוּ לְאָלָה
  choice: станут клятвенным проклятием
  rationale: אָלָה может обозначать клятву, включающую призывание проклятия. «Клятвенное проклятие» сохраняет отличие от последующего קְלָלָה и передаёт зловещий смысл выражения.
- source_word: לְשַׁמָּה וְלִקְלָלָה וּלְחֶרְפָּה
  choice: ужасом, проклятием и поношением
  rationale: 'Передаёт ряд существительных суда раздельно и без смягчения: потрясающий ужас, проклятие и публичное бесчестие.'
theological_decisions:
- issue: Повторяющиеся формулы Божьего суда
  choice: Сохранены прямые слова о гибели, падении от меча, смерти от голода и превращении в предмет проклятия и поношения.
  alternative: Свести повторы к одному обобщённому выражению, например «будут полностью уничтожены».
  rationale: Оригинал намеренно накапливает и повторяет формулы суда; их нельзя смягчать или заменять более систематизированным богословским выводом.
- issue: Различение אָלָה и קְלָלָה
  choice: אָלָה передано как «клятвенное проклятие», а קְלָלָה — как «проклятие».
  alternative: Передать оба слова одинаково как «проклятие» или первое только как «клятва».
  rationale: Первое слово обозначает клятву с призыванием проклятия, тогда как второе прямо означает проклятие. Раздельный перевод сохраняет напряжение и различие еврейских терминов.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Устойчивые выражения «остаток Иудеи», «от малого до великого» и «падут от меча» сохранены; непрозрачная еврейская идиома о направлении лица передана естественно как твёрдое решение. Повтор «погибнут» намеренно отражает повтор еврейского корня.
