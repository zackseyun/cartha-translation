language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הַשְׁכֵּ֥ים וְ/שָׁלֹ֖חַ לֵ/אמֹ֑ר אַל נָ֣א תַעֲשׂ֗וּ אֵ֛ת דְּבַֽר הַ/תֹּעֵבָ֥ה הַ/זֹּ֖את אֲשֶׁ֥ר שָׂנֵֽאתִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/004.yaml
  text: Yet I sent to you all my servants the prophets[a], rising early and sending them, saying[b], 'Please do not do this abominable thing that I hate.'
translation:
  language: ru
  text: 'Но Я снова и снова посылал к вам всех Моих слуг — пророков[a] — со словами: «Прошу вас, не совершайте этого отвратительного дела[b], которое Я ненавижу!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «вставая рано и посылая» — устойчивый оборот, выражающий настойчивое и неоднократное действие.'
    reason: cultural_note
  - marker: b
    text: 'Или: «этой мерзости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Но Я посылал
  rationale: Связка וַ продолжает повествование, однако в контексте непослушания народа уместно передать лёгкое противопоставление союзом «но». Несовершенный вид «посылал» согласуется с дальнейшим указанием на неоднократность действия.
- source_word: אֲלֵיכֶם
  choice: к вам
  rationale: Обычное обозначение направления к адресатам во втором лице множественного числа.
- source_word: כָּל עֲבָדַי הַנְּבִיאִים
  choice: всех Моих слуг — пророков
  rationale: 'Сохранены оба приложения: пророки названы Божьими слугами, то есть уполномоченными Им вестниками. «Слуги» здесь естественнее и точнее по функции, чем «рабы».'
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  choice: снова и снова посылал
  rationale: Еврейский идиоматический оборот буквально изображает раннее вставание и посылание, а по смыслу подчёркивает настойчивость и неоднократность. Русская формулировка естественно передаёт его функцию; буквальный образ отмечен в сноске.
- source_word: לֵאמֹר
  choice: со словами
  rationale: Естественная русская формула, вводящая содержание переданного через пророков обращения.
- source_word: אַל נָא תַעֲשׂוּ
  choice: Прошу вас, не совершайте
  rationale: אַל выражает запрет, а נָא придаёт ему оттенок настойчивой просьбы. «Совершайте» хорошо сочетается с существительным «дело».
- source_word: דְּבַר הַתּוֹעֵבָה הַזֹּאת
  choice: этого отвратительного дела
  rationale: דָּבָר здесь означает «дело, поступок», а תּוֹעֵבָה — нечто вызывающее сильное нравственное и религиозное отвращение; в контексте речь идёт об идолопоклонстве.
- source_word: אֲשֶׁר שָׂנֵאתִי
  choice: которое Я ненавижу
  rationale: Еврейский перфект выражает устойчивое отношение Бога к названному поступку. Настоящее время в русском ясно передаёт эту непреходящую оценку.
theological_decisions:
- issue: Передача Божьего отношения к идолопоклонническому поступку без смягчения или богословского расширения
  choice: которое Я ненавижу
  alternative: которое Мне отвратительно; которое Я возненавидел
  rationale: Текст прямо говорит о ненависти Бога к поступку. Выбранная формулировка сохраняет силу высказывания и не добавляет отсутствующих в стихе доктринальных пояснений.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Прописные местоимения при речи Бога следуют принятой русской издательской традиции. Идиома передана по смыслу, а её буквальный образ сохранён в сноске.
