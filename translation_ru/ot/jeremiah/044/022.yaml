  text: וְ/לֹֽא יוּכַל֩ יְהוָ֨ה ע֜וֹד לָ/שֵׂ֗את מִ/פְּנֵי֙ רֹ֣עַ מַעַלְלֵי/כֶ֔ם מִ/פְּנֵ֥י הַ/תּוֹעֵבֹ֖ת אֲשֶׁ֣ר עֲשִׂיתֶ֑ם וַ/תְּהִ֣י אַ֠רְצְ/כֶם לְ/חָרְבָּ֨ה וּ/לְ/שַׁמָּ֧ה וְ/לִ/קְלָלָ֛ה מֵ/אֵ֥ין יוֹשֵׁ֖ב כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/022.yaml
  text: And Yahweh could no longer bear it because of the evil of your deeds[a], because of the abominations that you committed. So your land became a ruin, a desolation, and a curse, without inhabitant[c][b], as it is this day.
translation:
  language: ru
  text: И Яхве уже не мог больше терпеть из-за зла ваших поступков и из-за мерзостей, которые вы совершили. Поэтому ваша земля стала разорением, запустением и проклятием, без жителей, какова она и по сей день.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога и сохраняет его отличие от титула «Господь».
- source_word: לֹא יוּכַל ... עוֹד לָשֵׂאת
  choice: больше не мог терпеть
  rationale: В данном контексте идиома означает, что терпению пришёл предел; «терпеть» естественно по-русски и сохраняет смысл еврейского «нести, сносить».
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיכֶם
  choice: из-за зла ваших поступков
  rationale: מִפְּנֵי имеет причинное значение, а сочетание רֹעַ מַעַלְלֵיכֶם подчёркивает нравственное зло совершённых поступков.
- source_word: הַתּוֹעֵבֹת אֲשֶׁר עֲשִׂיתֶם
  choice: мерзостей, которые вы совершали
  rationale: «Мерзости» сохраняет сильную нравственную и культовую окраску תּוֹעֵבוֹת; глагол передан естественным русским сочетанием «совершать мерзости».
- source_word: לְחָרְבָּה
  choice: превратилась в руины
  rationale: Передаёт состояние земли после полного разорения; глагольная формулировка делает ряд сказуемых естественным по-русски.
- source_word: וּלְשַׁמָּה
  choice: стала местом запустения
  rationale: Основным выбран смысл опустошённости, при этом возможный оттенок ужаса и изумления отмечен в сноске.
- source_word: וְלִקְלָלָה
  choice: проклятием
  rationale: Кратко сохраняет образ земли, ставшей примером или формулой проклятия; более развёрнутый смысл указан в сноске.
- source_word: מֵאֵין יוֹשֵׁב
  choice: осталась без жителей
  rationale: Естественно выражает полное отсутствие обитателей, обозначенное еврейской конструкцией.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: как и по сей день
  rationale: Современная русская формула ясно передаёт сохранение описанного состояния до времени речи.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, а не титул. «Яхве» сохраняет эту особенность исходного текста, не заменяя имя истолковывающим титулом.
- issue: Фраза о том, что Яхве больше не мог терпеть
  choice: Сохранено прямое утверждение «больше не мог терпеть»
  alternative: «решил больше не терпеть»
  rationale: Исходный текст прямо говорит о достигнутом пределе терпения. Перефразировка через решение могла бы снять заложенное в формулировке богословское напряжение, поэтому она не внесена.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Параллельный ряд последствий сохранён без тяжеловесной буквальности; причинно-следственная связь передана словом «поэтому».
