  to: И Яхве уже не мог больше терпеть из-за зла ваших поступков и из-за мерзостей, которые вы совершили. Поэтому ваша земля стала разорением, запустением и проклятием, без жителей, какова она и по сей день.
  rationale: Исправлены вид глагола и добавленный аспект «осталась», а три последствия для земли переданы параллельным рядом, близким к еврейскому тексту. Примечания сохранены; якоря добавлены к словам «терпеть», «запустением» и «проклятием».
