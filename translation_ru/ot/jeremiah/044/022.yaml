    text: 'Или: «больше не мог сносить». Буквально еврейское выражение означает «больше не мог нести» и говорит о том, что терпению пришёл предел.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «предмет ужаса» или «нечто, вызывающее изумление».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «предметом проклятий», то есть тем, что упоминают в формуле проклятия.'
    reason: lexical_alternative
