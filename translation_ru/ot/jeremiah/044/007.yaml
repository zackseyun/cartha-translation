source:
  edition: WLC
  text: וְ/עַתָּ֡ה כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָ/מָה֩ אַתֶּ֨ם עֹשִׂ֜ים רָעָ֤ה גְדוֹלָה֙ אֶל נַפְשֹׁ֣תֵ/כֶ֔ם לְ/הַכְרִ֨ית לָ/כֶ֧ם אִישׁ וְ/אִשָּׁ֛ה עוֹלֵ֥ל וְ/יוֹנֵ֖ק מִ/תּ֣וֹךְ יְהוּדָ֑ה לְ/בִלְתִּ֛י הוֹתִ֥יר לָ/כֶ֖ם שְׁאֵרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/007.yaml
  text: 'And now[a], thus says Yahweh, the God of hosts, the God of Israel: Why are you doing this great evil against yourselves, to cut off from among Judah man and woman, child and infant, leaving yourselves no remnant?'
translation:
  language: ru
  text: 'И ныне так говорит Яхве, Бог Воинств, Бог Израиля: «Зачем вы совершаете великое зло против самих себя[a], чтобы истребить из среды Иуды мужчин и женщин, детей и грудных младенцев, так что у вас не останется никакого остатка?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «причиняете самим себе великий вред». Еврейское רָעָה может означать как нравственное зло, так и бедствие или вред; здесь эти значения тесно связаны.'
    reason: Лексическая неоднозначность слова רָעָה.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бог Воинств
  rationale: Сохраняет образ צְבָאוֹת — воинств или небесных сил — и форму божественного титула.
- source_word: עֹשִׂים רָעָה גְדוֹלָה אֶל נַפְשֹׁתֵיכֶם
  choice: совершаете такое великое зло против самих себя
  rationale: Сохраняет нравственный смысл רָעָה и направленность действия против самих совершающих его; указательное «такое» естественно передаёт связь с описываемым далее самоистреблением.
- source_word: נַפְשֹׁתֵיכֶם
  choice: самих себя
  rationale: В данном обороте נֶפֶשׁ обозначает самих людей, а не отдельно понимаемую нематериальную душу.
- source_word: לְהַכְרִית
  choice: истребляя
  rationale: Передаёт каузативный смысл полного устранения; деепричастие естественно связывает действие с его гибельным результатом.
- source_word: אִישׁ וְאִשָּׁה
  choice: мужчин и женщин
  rationale: Русское множественное число естественно передаёт распределительную и всеохватную пару в единственном числе.
- source_word: עוֹלֵל וְיוֹנֵק
  choice: детей и грудных младенцев
  rationale: עוֹלֵל — малое дитя, а יוֹנֵק буквально обозначает грудного ребёнка; перевод сохраняет различие возрастов.
- source_word: מִתּוֹךְ יְהוּדָה
  choice: из среды Иуды
  rationale: Формулировка сохраняет смысл удаления изнутри Иуды как народа и общности, не сводя Иуду только к территории.
- source_word: לְבִלְתִּי הוֹתִיר לָכֶם שְׁאֵרִית
  choice: так что у вас не останется никакого остатка
  rationale: Передаёт итог их действий и сохраняет ключевой пророческий термин שְׁאֵרִית как «остаток».
theological_decisions:
- issue: 'Смысл רָעָה: нравственное зло или причиняемый вред'
  choice: великое зло против самих себя
  alternative: великий вред самим себе
  rationale: Основной текст сохраняет нравственную силу слова רָעָה, тогда как возвратная конструкция и дальнейшее описание истребления одновременно указывают на причиняемый себе вред; альтернативный смысл отмечен в сноске.
- issue: Передача שְׁאֵרִית
  choice: остаток
  alternative: уцелевшие
  rationale: «Остаток» сохраняет конкретный смысл сохранившейся части народа и устойчивое пророческое звучание термина, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис сделан понятным для обычного читателя, при этом сохранены личное имя Яхве, титул «Бог Воинств» и ключевой термин «остаток».
