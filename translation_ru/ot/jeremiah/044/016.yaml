  text: הַ/דָּבָ֛ר אֲשֶׁר דִּבַּ֥רְתָּ אֵלֵ֖י/נוּ בְּ/שֵׁ֣ם יְהוָ֑ה אֵינֶ֥/נּוּ שֹׁמְעִ֖ים אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/016.yaml
  text: As for the word that you have spoken to us in the name of Yahweh[a], we will not listen to you.
translation:
  language: ru
  text: Что до слова, которое ты сказал нам от имени Яхве, мы не станем тебя слушать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы не станем тебе повиноваться». Еврейский глагол может означать как слушание, так и послушание; из контекста ясно, что речь идёт также об отказе повиноваться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: слова
  rationale: דָּבָר здесь обозначает произнесённое Иеремией пророческое слово. Русское «слово» сохраняет прямой лексический смысл и естественно звучит в данном контексте.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֵלֵינוּ
  choice: которое ты сказал нам
  rationale: Форма совершенного вида передаёт завершённую речь Иеремии; «сказал нам» естественно по-русски и сохраняет направление действия, выраженное אֶל.
- source_word: בְּשֵׁם יְהוָה
  choice: от имени Яхве
  rationale: Оборот означает, что Иеремия говорил как представитель Бога и с его властью. «От имени» — естественная русская передача этой формулы, а личное имя יהוה передано как «Яхве».
- source_word: אֵינֶנּוּ שֹׁמְעִים
  choice: мы не станем слушать
  rationale: Отрицательная конструкция с причастием в этом прямом ответе выражает твёрдый сознательный отказ. «Не станем слушать» передаёт волевой оттенок, сохраняя основной смысл שׁמע.
- source_word: אֵלֶיךָ
  choice: тебя
  rationale: Русский глагол «слушать» обычно требует прямого дополнения без предлога; поэтому «тебя» естественно передаёт еврейское אֵלֶיךָ и сохраняет личную направленность отказа.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие.
- issue: Смысл שׁמע при отказе принять пророческое слово
  choice: слушать
  alternative: повиноваться
  rationale: Глагол может включать смысл послушания, однако его непосредственное значение связано со слушанием. Основной текст сохраняет эту смысловую широту, а подразумеваемый отказ повиноваться отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой пророческой речи. Начальное «Что до слова» сохраняет вынесенную тему еврейского предложения; «не станем» передаёт решительный отказ без архаизации.
