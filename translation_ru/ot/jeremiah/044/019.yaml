  text: וְ/כִֽי אֲנַ֤חְנוּ מְקַטְּרִים֙ לִ/מְלֶ֣כֶת הַ/שָּׁמַ֔יִם וּ/לְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִ֑ים הֲ/מִֽ/בַּלְעֲדֵ֣י אֲנָשֵׁ֗י/נוּ עָשִׂ֨ינוּ לָ֤/הּ כַּוָּנִים֙ לְ/הַ֣עֲצִבָ֔/ה וְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/019.yaml
  text: And when we burned incense to the Queen of Heaven and poured out drink offerings to her[a], was it apart from our husbands that we made cakes for her, to depict her, and poured out drink offerings to her?
translation:
  language: ru
  text: И когда мы воскуряли благовония Царице Небесной и возливали ей возлияния, разве мы без наших мужей готовили для неё лепёшки, чтобы изобразить её[a], и возливали ей возлияния?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы представить её»; возможно: «чтобы сделать её изображение». Еврейское выражение, вероятно, относится к лепёшкам, сделанным в образе богини.'
    reason: Смысл לְהַעֲצִבָהּ допускает передачу как изображения, представления или изготовления образа; конкретная форма лепёшек остаётся не вполне определённой.
lexical_decisions:
- source_word: וְכִי
  choice: И когда
  rationale: В контексте продолжает ответ женщин и указывает на обстоятельство их прежних обрядовых действий, а не вводит условие.
- source_word: מְקַטְּרִים
  choice: воскуряли благовония
  rationale: Порода piel глагола קטר в культовом контексте обозначает воскурение; формулировка естественна для современного литературного русского и сохраняет ритуальный смысл.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: Царице Небесной
  rationale: Сохраняет языческий культовый титул без отождествления с каким-либо позднейшим религиозным образом.
- source_word: וּלְהַסֵּךְ לָהּ נְסָכִים
  choice: и возливали ей возлияния
  rationale: Передаёт как действие возливания, так и ритуальное значение נְסָכִים; повтор в конце стиха сохранён.
- source_word: הֲמִבַּלְעֲדֵי אֲנָשֵׁינוּ
  choice: разве без ведома наших мужей
  rationale: אֲנָשֵׁינוּ в речи женщин контекстуально означает мужей. «Без ведома» естественно выражает отрицание самостоятельного действия, хотя буквально оборот означает «без наших мужей».
- source_word: עָשִׂינוּ לָהּ כַּוָּנִים
  choice: мы пекли для неё лепёшки
  rationale: כַּוָּנִים — приготовленные для культа фигурные лепёшки; «пекли» по-русски естественно конкретизирует способ их изготовления.
- source_word: לְהַעֲצִבָהּ
  choice: изображавшие её
  rationale: 'Передаёт вероятный целевой смысл: лепёшки представляли богиню или были выполнены в её образе, не уточняя степень сходства.'
theological_decisions:
- issue: Передача языческого титула מְלֶכֶת הַשָּׁמַיִם
  choice: Царица Небесная
  alternative: царица небес
  rationale: Форма с прописных букв ясно передаёт устойчивый культовый титул в речи его почитателей, не выражая одобрения и не привнося позднейших богословских ассоциаций.
- issue: Участие мужей в обряде
  choice: разве без ведома наших мужей
  alternative: разве без наших мужей
  rationale: Контекст указывает на осведомлённость или согласие мужей, однако еврейский оборот краток; выбранная формулировка передаёт прагматический смысл вопроса без утверждения, что мужья лично совершали все действия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной культовой лексикой («воскуряли», «возлияния»). Риторический вопрос и повтор обряда сохранены. Маркер сноски поставлен непосредственно после неоднозначного выражения.
