  text: הִנְ/נִ֨י שֹׁקֵ֧ד עֲלֵי/הֶ֛ם לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/תַמּוּ֩ כָל אִ֨ישׁ יְהוּדָ֜ה אֲשֶׁ֧ר בְּ/אֶֽרֶץ מִצְרַ֛יִם בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב עַד כְּלוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/027.yaml
  text: Behold[a], I am watching over them for harm and not for good, and every man of Judah who is in the land of Egypt will come to an end by the sword and by famine[c][b], until they are consumed.
translation:
  language: ru
  text: Вот, Я неусыпно слежу за ними — им во вред[a], а не во благо. И все иудеи, живущие в земле Египетской[b], погибнут от меча и голода, пока не будут истреблены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на беду», «к несчастью». Здесь речь идёт о пагубном бедствии как суде, а не о нравственном зле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый муж Иуды, который находится в земле Египетской»; выражение употреблено дистрибутивно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» сохраняет торжественную, привлекающую внимание формулу божественного заявления; местоимение требуется естественным русским синтаксисом.
- source_word: שֹׁקֵד עֲלֵיהֶם
  choice: неусыпно слежу за ними
  rationale: Причастие שֹׁקֵד выражает бодрствующую, непрерывную и целенаправленную внимательность; «неусыпно» передаёт этот оттенок и сохраняет характерный для Иеремии мотив Божьего бдения.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: во зло, а не во благо
  rationale: Сохраняется краткая антитеза исходного текста. В данном контексте רָעָה означает бедствие или пагубный исход, а не нравственное зло; это пояснено в сноске.
- source_word: וְתַמּוּ
  choice: погибнут
  rationale: Форма от תמם означает прийти к концу, исчезнуть. В сочетании с мечом и голодом естественное русское «погибнут» ясно передаёт итог, не смешивая этот глагол с последующим כלה.
- source_word: כָל אִישׁ יְהוּדָה
  choice: все иудеи
  rationale: Буквально дистрибутивное «каждый муж Иуды». В современном русском собирательное «все иудеи» естественно передаёт охват всей названной группы без неуместного сужения только до взрослых мужчин; буквальная форма отмечена в сноске.
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרַיִם
  choice: живущие в земле Египетской
  rationale: Передаёт относительную конструкцию идиоматично и сохраняет полную географическую формулу.
- source_word: בַּחֶרֶב וּבָרָעָב
  choice: от меча и голода
  rationale: Естественная русская форма стандартной у Иеремии формулы суда, сохраняющая причинно-инструментальный смысл.
- source_word: עַד כְּלוֹתָם
  choice: пока не будут истреблены
  rationale: Инфинитив כלה с местоименным суффиксом выражает доведение группы до полного исчезновения; страдательная конструкция сохраняет резкую завершённость фразы.
theological_decisions:
- issue: Язык Божьего суда и значение רָעָה
  choice: во зло
  alternative: на беду / к несчастью / во вред
  rationale: Антитеза «во зло — во благо» близко воспроизводит форму еврейского текста, а сноска не позволяет ошибочно понять её как приписывание Богу нравственного зла.
- issue: Охват выражения כָל אִישׁ יְהוּדָה
  choice: все иудеи
  alternative: каждый мужчина из Иудеи
  rationale: Мужской единственный в исходном тексте употреблён дистрибутивно по отношению к иудейской общине в Египте. Основной текст передаёт коллективный охват, а буквальная форма сохраняется в сноске, не вводя доктринального ограничения.
- issue: Соотношение וְתַמּוּ и עַד כְּלוֹתָם
  choice: погибнут … пока не будут истреблены
  alternative: придут к концу … до полного исчезновения
  rationale: 'Перевод сохраняет усиление и напряжённый повтор двух близких, но разных глаголов: сначала констатируется гибель, затем её полное доведение до конца.'
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. «Вот» и «земля Египетская» сохраняют библейское достоинство, тогда как синтаксис и лексика остаются понятными современному читателю. Все маркеры сносок помещены непосредственно после соответствующих выражений.
