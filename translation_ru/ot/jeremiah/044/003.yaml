  text: because of their evil that they did to provoke me to anger[a], by going to burn incense and to serve other gods[b], whom they had not known—they, you, and your fathers.
translation:
  language: ru
  text: за зло, которое они совершили, вызывая Мой гнев тем, что ходили воскурять благовония и служить другим богам[a], которых не знали — они, вы и ваши отцы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклоняться другим богам». Еврейский глагол может обозначать религиозное служение или поклонение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которых не знали ни они, ни вы, ни ваши отцы». В еврейском тексте стих завершается подчёркнутым перечислением: «они, вы и ваши отцы».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: מִפְּנֵי רָעָתָם
  choice: за зло
  rationale: Предлог вводит причину описанного ранее опустошения, а רָעָה здесь обозначает нравственное зло, поскольку далее названы совершённые ими идолопоклоннические действия.
- source_word: אֲשֶׁר עָשׂוּ
  choice: которое они совершали
  rationale: Относительное придаточное передаёт простой смысл еврейского глагола; несовершенный вид естественно описывает неоднократные действия, далее выраженные оборотом «ходили воскурять».
- source_word: לְהַכְעִסֵנִי
  choice: вызывая Мой гнев
  rationale: Каузативная форма глагола כעס означает «вызывать гнев, приводить в ярость»; формулировка сохраняет как причинность, так и указание на Божий гнев.
- source_word: לָלֶכֶת
  choice: тем, что ходили
  rationale: Инфинитив поясняет, каким образом они вызывали Божий гнев; «ходили» сохраняет значение движения и в русском контексте допускает повторяемость действия.
- source_word: לְקַטֵּר
  choice: воскурять благовония
  rationale: В контексте языческого культа форма Piel глагола קטר обычно обозначает ритуальное сжигание ароматического курения; это традиционная и понятная русская формулировка.
- source_word: לַעֲבֹד
  choice: служить
  rationale: עבד по отношению к божествам охватывает религиозное служение и поклонение; «служить» является более прямым соответствием и сохраняет широту значения.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Устойчивое выражение обозначает божеств помимо Господа; буквальный вариант естественен для современного русского языка.
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: которых не знали
  rationale: «Знать» сохраняет возможный оттенок признания и отношений, не заменяя его более узким толкованием.
- source_word: הֵמָּה אַתֶּם וַאֲבֹתֵיכֶם
  choice: они, вы и ваши отцы
  rationale: Сохранено эмфатическое перечисление подлежащих. «Отцы» непосредственно передаёт мужской род и конкретную родственную лексику исходного текста.
theological_decisions:
- issue: Передача языка идолопоклоннического служения
  choice: служить другим богам
  alternative: поклоняться другим богам
  rationale: Глагол עבד шире собственно культового поклонения и может обозначать служение и преданность божеству; основной текст сохраняет более широкое значение, а допустимая альтернатива отмечена в сноске.
- issue: Эмфатический ряд הֵמָּה אַתֶּם וַאֲבֹתֵיכֶם
  choice: которых не знали — они, вы и ваши отцы
  alternative: которых не знали ни они, ни вы, ни ваши отцы
  rationale: Основной вариант воспроизводит необычное аппозиционное перечисление и его напряжённый акцент, не сглаживая синтаксис полностью; более естественная отрицательная конструкция приведена в сноске.
- issue: Передача וַאֲבֹתֵיכֶם
  choice: ваши отцы
  alternative: ваши предки
  rationale: «Отцы» сохраняет грамматически мужское и более конкретное обозначение исходного текста, не нейтрализуя его без необходимости.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Конструкция «вызывая Мой гнев тем, что…» ясно связывает идолопоклоннические действия с их следствием; финальное тире намеренно сохраняет эмфатическую, несколько напряжённую структуру еврейского текста.
