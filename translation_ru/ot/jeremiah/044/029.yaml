  text: וְ/זֹאת לָ/כֶ֤ם הָ/אוֹת֙ נְאֻם יְהוָ֔ה כִּֽי פֹקֵ֥ד אֲנִ֛י עֲלֵי/כֶ֖ם בַּ/מָּק֣וֹם הַ/זֶּ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּי֩ ק֨וֹם יָק֧וּמוּ דְבָרַ֛/י עֲלֵי/כֶ֖ם לְ/רָעָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/029.yaml
  text: And this will be the sign for you[a], declares Yahweh, that I am punishing you in this place, so that you may know that my words will surely stand against you for harm.
translation:
  language: ru
  text: 'И вот вам знак, — возвещает Яхве, — что Я наказываю вас в этом месте, чтобы вы узнали: Мои слова против вас непременно исполнятся, к вашей беде[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Мои слова непременно устоят против вас — к беде вашей». Иначе: «Мои слова против вас непременно исполнятся, обернувшись бедствием».'
    reason: Сохраняет буквальный образ усиленной конструкции קוֹם יָקוּמוּ и возможную более формальную передачу לְרָעָה.
lexical_decisions:
- source_word: וְזֹאת לָכֶם הָאוֹת
  choice: И вот вам знак
  rationale: Сохраняет связь с предшествующей речью, указательное значение и пророческое понятие подтверждающего знака, не добавляя отсутствующего в еврейском тексте глагола «дам».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу современным торжественным русским языком и сохраняет личное имя יְהוָה.
- source_word: כִּי פֹקֵד אֲנִי עֲלֵיכֶם
  choice: что Я накажу вас
  rationale: В контексте суда פקד имеет отрицательный смысл наказания. Будущее время естественно по-русски выражает предстоящее действие, обозначенное еврейским причастием.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: в этом месте
  rationale: Прямо сохраняет локативное и указательное значение выражения.
- source_word: לְמַעַן תֵּדְעוּ
  choice: чтобы вы узнали
  rationale: Передаёт целевое значение לְמַעַן без стилистической тяжеловесности.
- source_word: כִּי קוֹם יָקוּמוּ דְבָרַי
  choice: Мои слова непременно сбудутся
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает уверенность. Для слов или пророчеств קום естественно означает их осуществление; наречие «непременно» сохраняет усиление.
- source_word: עֲלֵיכֶם לְרָעָה
  choice: против вас … принесут вам бедствие
  rationale: «Против вас» сохраняет враждебно-судебную направленность עֲלֵיכֶם, а «принесут вам бедствие» передаёт רָעָה как губительное последствие, а не нравственное зло.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; личное имя сохраняется в транслитерации без замены титулом.
- issue: Значение לְרָעָה в контексте Божьего суда
  choice: принесут вам бедствие
  alternative: будут вам во зло; навлекут на вас зло
  rationale: Здесь רָעָה обозначает пагубное последствие наказания, а не нравственное зло; выбранная формулировка не снимает суровости суда и не приписывает Богу морального зла.
- issue: Образное или идиоматическое понимание קוֹם יָקוּמוּ דְבָרַי
  choice: слова … непременно сбудутся
  alternative: слова … непременно устоят
  rationale: В сочетании со «словами» глагол קום указывает на их подтверждение и осуществление. Буквальный образ сохранён в примечании, чтобы не скрывать форму оригинала.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Порядок слов «Мои слова против вас» подчёркивает направленность суда; двоеточие естественно вводит содержание того, что адресаты должны узнать.
