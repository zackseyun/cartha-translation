base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/016.yaml
  text: He has multiplied the stumbling; indeed[a], each man falls against his companion, and they say, “Come, and let us return to our people and to the land of our birth, away from the sword of the oppressor.”
translation:
  language: ru
  text: 'Он многих заставил споткнуться; даже один за другим падали, и они говорили: «Вставайте, вернёмся к своему народу, в родную землю, подальше от меча угнетателя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «меча голубя». Еврейское слово допускает такое буквальное прочтение, но в данном контексте его обычно понимают в значении «угнетатель» или «насильник».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִרְבָּה כּוֹשֵׁל
  choice: Он многих заставил споткнуться
  rationale: Глагольная форма породы hифиль передаёт причинное действие, а причастие כּוֹשֵׁל обозначает спотыкающихся или терпящих поражение. Такой перевод естественно выражает сжатую еврейскую конструкцию, не называя прямо подразумеваемого субъекта.
- source_word: גַּם נָפַל אִישׁ אֶל רֵעֵהוּ
  choice: один падает на другого
  rationale: Распределительное אִישׁ передано оборотом «один… на другого»; он сохраняет картину беспорядочного взаимного падения.
- source_word: קוּמָה וְנָשֻׁבָה
  choice: Вставай! Вернёмся
  rationale: Повелительное קוּמָה дано буквально и естественно, а когортатив וְנָשֻׁבָה передаёт совместное решительное намерение вернуться.
- source_word: עַמֵּנוּ
  choice: своему народу
  rationale: עַם здесь обозначает собственный народ в этническом и национальном смысле; возвратное «своему» естественно в русской речи при подлежащем «мы».
- source_word: אֶרֶץ מוֹלַדְתֵּנוּ
  choice: в землю, где мы родились
  rationale: Передаёт значение родной страны непосредственно и понятно, сохраняя образ земли рождения.
- source_word: מִפְּנֵי חֶרֶב
  choice: подальше от меча
  rationale: מִפְּנֵי в контексте бегства выражает удаление от непосредственной угрозы; «подальше от» естественно связывает возвращение с желанием спастись.
- source_word: הַיּוֹנָה
  choice: угнетателя
  rationale: В военном контексте слово осмысляется как обозначение притеснителя или насильника, вероятно в связи с корнем ינה; буквальная возможность «голубя» сохранена в примечании.
theological_decisions:
- issue: Толкование הַיּוֹנָה в заключительном выражении
  choice: угнетателя
  alternative: голубя
  rationale: «Меч угнетателя» соответствует контексту битвы и бегства. Поскольку та же еврейская форма допускает буквальное прочтение «голубя», эта реальная неоднозначность не устранена, а отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатой, тревожной динамики еврейского текста. Речь бегущих воинов передана живо, но без разговорной сниженности.
