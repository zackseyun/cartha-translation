  text: אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י פוֹקֵד֙ אֶל אָמ֣וֹן מִ/נֹּ֔א וְ/עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם וְ/עַל אֱלֹהֶ֖י/הָ וְ/עַל מְלָכֶ֑י/הָ וְ/עַ֨ל פַּרְעֹ֔ה וְ/עַ֥ל הַ/בֹּטְחִ֖ים בּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/025.yaml
  text: 'Yahweh of hosts[a], the God of Israel, says: Behold, I am about to punish Amon of No, and Pharaoh, and Egypt, and her gods, and her kings, and Pharaoh[b], and those who trust in him.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств, Бог Израиля: «Вот, Я собираюсь наказать Амона из Но[a], фараона и Египет, его богов и царей, фараона и тех, кто полагается на него[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Амона Фиванского». Но — еврейское название египетского города, обычно отождествляемого с Фивами.'
    reason: cultural_note
  - marker: b
    text: 'Или: «кто полагается на Египет», если местоимение относится не к фараону, а к Египту.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя Бога и сохраняет широкий смысл титула צְבָאוֹת, который может охватывать небесные и земные силы, не сводя его только к человеческим армиям.
- source_word: הִנְנִי פוֹקֵד
  choice: Вот, Я накажу
  rationale: «Вот» сохраняет торжественную пророческую выразительность הִנְנִי, а «накажу» ясно передаёт судебный смысл פקד в данном контексте.
- source_word: אָמֹון מִנֹּא
  choice: Амона из Но
  rationale: Сохраняет еврейское название города Но и естественно передаёт связь египетского божества Амона с этим городом; отождествление Но с Фивами вынесено в примечание.
- source_word: וְעַל פַּרְעֹה וְעַל מִצְרַיִם
  choice: фараона и Египет
  rationale: Повторяемый предлог עַל продолжает перечень объектов наказания; в русском его естественно не воспроизводить перед каждым членом списка.
- source_word: אֱלֹהֶיהָ וּמְלָכֶיהָ
  choice: его богов и царей
  rationale: Еврейские суффиксы женского рода относятся к Египту; в русском согласование определяется мужским родом слова «Египет».
- source_word: וְעַל פַּרְעֹה
  choice: самого фараона
  rationale: Сохраняет намеренное повторение слова «фараон», а «самого» делает это повторение естественным по-русски и подчёркивает фигуру правителя.
- source_word: הַבֹּטְחִים בּוֹ
  choice: тех, кто полагается на него
  rationale: Местоимение мужского рода и ближайший антецедент указывают прежде всего на фараона; глагол בטח означает доверие или поиск опоры и безопасности.
theological_decisions:
- issue: К кому относится местоимение בּוֹ («на него/на него как опору»)
  choice: 'К фараону: «тех, кто полагается на него»'
  alternative: 'К Египту: «тех, кто полагается на него [Египет]»'
  rationale: Ближайший антецедент — повторённое существительное мужского рода «фараон», что согласуется с формой местоимения. Однако более широкая отсылка к Египту остаётся возможной по контексту, поэтому она отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксическое накопление объектов суда сохранено, но повтор предлогов сглажен ради естественности. Повторное упоминание фараона не устранено как возможное риторическое выделение.
