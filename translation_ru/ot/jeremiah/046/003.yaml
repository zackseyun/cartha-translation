  text: Prepare buckler and shield[a], and advance to battle.
translation:
  language: ru
  text: Приготовьте малый и большой щиты[a] и выступайте в бой!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Приготовьте щит и большой щит и подойдите к сражению».'
    reason: 'Лексическая альтернатива: различие в размере между מָגֵן и צִנָּה вероятно, но выражено не явно; וּגְשׁוּ можно передать более буквально как «подойдите».'
lexical_decisions:
- source_word: עִרְכוּ
  choice: Приготовьте
  rationale: Императив от ערך означает «расположить, привести в готовность»; с названиями оружия естественно передаётся как «приготовьте».
- source_word: מָגֵן
  choice: малый щит
  rationale: מָגֵן обозначает щит и здесь, в паре с צִנָּה, вероятно, указывает на меньший вид щита. Описательный перевод понятнее современному читателю, чем архаичное «тарч».
- source_word: צִנָּה
  choice: большой щит
  rationale: צִנָּה обычно обозначает крупный щит; определение «большой» сохраняет контраст с מָגֵן.
- source_word: וּגְשׁוּ
  choice: и выступайте
  rationale: נגשׁ буквально значит «приблизиться, подойти»; в военном призыве «выступайте» естественно передаёт движение к сражению.
- source_word: לַמִּלְחָמָה
  choice: в бой
  rationale: Сочетание предлога ל с מִלְחָמָה здесь обозначает направленность к сражению; русское «в бой» кратко и идиоматично.
