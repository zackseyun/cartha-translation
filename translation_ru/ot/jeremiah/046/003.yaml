  source_fidelity: 'Текст точно передаёт два повелительных глагола: עִרְכוּ («приготовьте, приведите в готовность») и וּגְשׁוּ («подойдите, приблизьтесь»). «Выступайте в бой» — естественная в военном контексте передача движения к сражению. Пара «малый и большой щиты» правдоподобно сохраняет различение מָגֵן и צִנָּה, не выдавая конкретную техническую идентификацию предметов за бесспорную.'
