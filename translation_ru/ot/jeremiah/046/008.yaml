base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/008.yaml
  text: Egypt rises like the Nile[a], and its waters surge like rivers. It says, ‘I will rise, I will cover the earth; I will destroy the city and those who dwell in it.’
translation:
  language: ru
  text: 'Египет поднимается, словно Нил, и его воды вздымаются, словно реки. И говорит: «Я поднимусь, покрою землю[a], уничтожу город и его жителей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страну». Еврейское אֶרֶץ может означать как «землю», так и «страну»; вариант в основном тексте сохраняет широкий, гиперболический размах похвальбы Египта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Египет
  rationale: Общепринятое русское название страны; в контексте Египет олицетворён как наступающая военная сила.
- source_word: כַּיְאֹר
  choice: как Нил
  rationale: В египетском контексте יְאֹר обозначает прежде всего Нил; такое прочтение конкретно и сохраняет образ разлива.
- source_word: יַעֲלֶה
  choice: поднимается
  rationale: Настоящее время передаёт живую поэтическую картину и одновременно подходит к образу прибывающей воды и наступающего войска.
- source_word: וְכַנְּהָרוֹת יִתְגֹּעֲשׁוּ מָיִם
  choice: и воды его бурлят, как реки
  rationale: «Бурлят» передаёт неистовое, вздымающееся движение יתגעשו; местоимение «его» естественно связывает воды с олицетворённым Египтом, не устраняя сравнения с реками.
- source_word: וַיֹּאמֶר
  choice: Он говорит
  rationale: Египет олицетворён и в еврейском тексте представлен грамматически как говорящий в единственном числе; настоящее время сохраняет живость пророческой речи.
- source_word: אַעֲלֶה
  choice: Я поднимусь
  rationale: Сохраняется словесный повтор с יַעֲלֶה и единый образ наводнения и военного наступления.
- source_word: אֲכַסֶּה אֶרֶץ
  choice: покрою землю
  rationale: אֶרֶץ допускает значения «земля» и «страна»; в основном тексте «землю» сохраняет широкий, гиперболический размах египетской похвальбы.
- source_word: אֹבִידָה
  choice: уничтожу
  rationale: Прямо передаёт каузативную форму корня אבד в контексте военной угрозы.
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  choice: город и его жителей
  rationale: Сохранено единственное число «город»; естественная русская формулировка точно передаёт город вместе с живущими в нём людьми.
