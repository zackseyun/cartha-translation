  text: מַדּ֣וּעַ רָאִ֗יתִי הֵ֣מָּה חַתִּים֮ נְסֹגִ֣ים אָחוֹר֒ וְ/גִבּוֹרֵי/הֶ֣ם יֻכַּ֔תּוּ וּ/מָנ֥וֹס נָ֖סוּ וְ/לֹ֣א הִפְנ֑וּ מָג֥וֹר מִ/סָּבִ֖יב נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/005.yaml
  text: Why have I seen this? They are terrified[a], turning back; their warriors are crushed, and they have fled hastily and have not turned back. Terror is on every side[b], declares Yahweh.
translation:
  language: ru
  text: Почему я вижу их в смятении, отступающими? Их воины разбиты; они обратились в бегство[b] и не оглядываются. Ужас со всех сторон! — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Буквально: «бегут бегством» — усилительное однокоренное сочетание, изображающее полный разгром и безудержное бегство.'
    reason: Сохранение в примечании эмфатической внутренней конструкции וּמָנוֹס נָסוּ.
lexical_decisions:
- source_word: מַדּוּעַ רָאִיתִי
  choice: Почему я вижу это?
  rationale: Вопрос передаёт изумление пророка перед разворачивающимся видением; настоящее время естественно выражает его живую непосредственность по-русски.
- source_word: הֵמָּה חַתִּים
  choice: Они в смятении
  rationale: חתים описывает сломленность духа, испуг и растерянность; «в смятении» естественно для картины военной паники и не сужает значение только до страха.
- source_word: נְסֹגִים אָחוֹר
  choice: отступают
  rationale: Русское «отступают» ясно передаёт движение назад в военном контексте без избыточного «отступают назад».
- source_word: גִבּוֹרֵיהֶם
  choice: их воины
  rationale: В данном военном контексте גִּבּוֹרִים обозначает сильных, доблестных бойцов; «воины» понятно современному читателю.
- source_word: יֻכַּתּוּ
  choice: разбиты
  rationale: Пассивная форма выражает нанесённое им поражение; «разбиты» сохраняет как образ удара, так и смысл военного разгрома.
- source_word: וּמָנוֹס נָסוּ
  choice: Они стремительно бегут
  rationale: Однокоренное сочетание усиливает глагол бегства. Наречие передаёт безудержность бегства естественным современным русским языком, а буквальная форма отмечена в сноске.
- source_word: וְלֹא הִפְנוּ
  choice: и не оборачиваются
  rationale: В контексте панического бегства выражение означает, что воины не поворачиваются назад и не пытаются встретить преследователя.
- source_word: מָגוֹר מִסָּבִיב
  choice: Ужас со всех сторон!
  rationale: Сохранена характерная для Иеремии краткая формула всеобъемлющей угрозы.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: «Возвещает» передаёт весомость пророческой формулы, а личное имя Яхве непосредственно отражает тетраграмматон.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное Божье имя, поэтому оно передано транслитерацией без замены титулом.
- issue: Связь поражения египетских воинов с речью Яхве
  choice: Сохранена пророческая формула «возвещает Яхве» без добавочного объяснения
  alternative: Яхве говорит это как прямую причинную оценку поражения
  rationale: Текст утверждает авторитет пророчества, но в самом стихе не формулирует отдельного причинного пояснения; перевод его не добавляет.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Короткие фразы передают внезапность видения и стремительность разгрома; устаревшая военная и церковнославянская лексика не используется.
