  text: וְֽ/הַ/יּ֨וֹם הַ/ה֜וּא לַ/אדֹנָ֧/י יְהוִ֣ה צְבָא֗וֹת י֤וֹם נְקָמָה֙ לְ/הִנָּקֵ֣ם מִ/צָּרָ֔י/ו וְ/אָכְלָ֥ה חֶ֨רֶב֙ וְ/שָׂ֣בְעָ֔ה וְ/רָוְתָ֖ה מִ/דָּמָ֑/ם כִּ֣י זֶ֠בַח לַ/אדֹנָ֨/י יְהוִ֧ה צְבָא֛וֹת בְּ/אֶ֥רֶץ צָפ֖וֹן אֶל נְהַר פְּרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/010.yaml
  text: That day belongs to the Lord GOD of Armies[a], a day of vengeance, to avenge himself on his foes. The sword will devour and be satisfied and drink its fill of their blood, for the Lord GOD of Armies has a sacrifice in the land of the north[b], by the Euphrates River.
translation:
  language: ru
  text: Тот день принадлежит Владыке Яхве Воинств[a] — день возмездия, чтобы Он отомстил Своим врагам. Меч будет пожирать, насытится и вдоволь напьётся их крови, потому что у Владыки Яхве Воинств — жертва[b] в северной земле, у реки Евфрат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный русский библейский титул: «Господь Саваоф». Буквально: «Владыка Яхве Воинств».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейскую конструкцию можно также передать: «потому что в северной земле, у реки Евфрат, есть жертва для Владыки Яхве Воинств».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְהַיּוֹם הַהוּא
  choice: Тот день
  rationale: Естественно передаёт указательное временное выражение; начальный союз в русском не требуется.
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: принадлежит Владыке Яхве Воинств
  rationale: Предлог ל выражает принадлежность или отношение; «принадлежит» ясно передаёт, что это день Яхве.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» отличает титул אֲדֹנָי от имени Яхве и избегает неестественного сочетания «Господь Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет закрепившуюся в русском библейском языке форму титула и его военный оттенок.
- source_word: יוֹם נְקָמָה לְהִנָּקֵם מִצָּרָיו
  choice: день возмездия, когда Он отомстит Своим врагам
  rationale: «Возмездие» передаёт судебно-карательный оттенок נְקָמָה, а глагольная часть сохраняет личное действие Бога против Его противников.
- source_word: וְאָכְלָה חֶרֶב וְשָׂבְעָה וְרָוְתָה מִדָּמָם
  choice: Меч будет пожирать, пока не насытится, и вдоволь напьётся их крови
  rationale: Сохранена яркая персонификация меча и последовательный образ насыщения и питья.
- source_word: כִּי זֶבַח לַאדֹנָי
  choice: потому что у Владыки ... — жертвоприношение
  rationale: Конструкция с ל допускает понимание принадлежности; тире делает именную конструкцию естественной по-русски, не устраняя её сжатости.
- source_word: בְּאֶרֶץ צָפוֹן
  choice: в северной земле
  rationale: Близко передаёт географическое обозначение без излишней конкретизации.
- source_word: אֶל נְהַר פְּרָת
  choice: у реки Евфрат
  rationale: В данном контексте אֶל обозначает местоположение у реки; русская форма естественна и точна.
theological_decisions:
- issue: Передача составного божественного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Сохраняется личное имя Яхве и одновременно различается титул אֲדֹנָי; перевод не заменяет имя толковательным обозначением.
- issue: Значение נקמה
  choice: возмездие / отомстит
  alternative: месть / совершит возмездие
  rationale: Выбор сохраняет напряжённый образ Божьего ответного суда, но не привносит оттенка мелочной человеческой мстительности.
- issue: Жертвенная метафора זֶבַח
  choice: жертвоприношение
  alternative: жертва; жертвенная бойня
  rationale: Сохранена культовая метафора текста без смягчения военного суда и без добавления отсутствующего в оригинале пояснения.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены военная, кровавая и жертвенная образность оригинала. Указатель [a] поставлен после божественного титула, [b] — после предложения, к которому относится синтаксическая альтернатива.
