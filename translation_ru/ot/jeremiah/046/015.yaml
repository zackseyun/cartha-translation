  text: מַדּ֖וּעַ נִסְחַ֣ף אַבִּירֶ֑י/ךָ לֹ֣א עָמַ֔ד כִּ֥י יְהוָ֖ה הֲדָפֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/015.yaml
  text: Why has your mighty one been swept away? He did not stand[a], for Yahweh drove him away.
translation:
  language: ru
  text: Почему твой могучий сметён[a]? Он не устоял, потому что Яхве отбросил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твои могучие»; еврейскую форму можно также понять как «твой бык» — возможно, имеется в виду Апис, священный бык Египта.'
    reason: Альтернативное прочтение неоднозначной еврейской формы и возможная историческая отсылка.
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Почему
  rationale: Естественно передаёт вопросительное наречие, вводящее риторический вопрос.
- source_word: נִסְחַף
  choice: сметён
  rationale: Сохраняет страдательное значение и яркий образ того, кого силой уносит или сметает в поражении.
- source_word: אַבִּירֶיךָ
  choice: твой могучий
  rationale: Субстантивированное прилагательное передаёт значение силы, не уточняя спорного референта; единственное число согласуется с последующими формами единственного числа. Возможные значения «твои могучие» и «твой бык» вынесены в примечание.
- source_word: לֹא עָמַד
  choice: Он не устоял
  rationale: Передаёт как буквальное стояние, так и естественный для военного контекста смысл неспособности удержаться.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит причину поражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הֲדָפוֹ
  choice: отбросил его
  rationale: Передаёт действие толкнуть, оттеснить или отбросить; местоимение сохраняет мужской род и единственное число еврейского суффикса.
theological_decisions:
- issue: Референт אַבִּירֶיךָ в пророчестве о Египте
  choice: В основном тексте — обобщённое «твой могучий»
  alternative: «твои могучие»; «твой бык», возможно священный египетский бык Апис
  rationale: Слово связано с силой и может обозначать могучего или быка. Ближайшие глаголы и объектный суффикс стоят в единственном числе, поэтому основной текст сохраняет единственное число. Возможная отсылка к Апису остаётся в примечании, поскольку сам еврейский текст не называет его прямо.
translation_notes:
  register: Современный литературный русский язык с краткой, энергичной военной образностью. «Могучий» намеренно оставлено без конкретизации, чтобы сохранить неоднозначность исходного текста.
