language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הַגִּ֤ידוּ בְ/מִצְרַ֨יִם֙ וְ/הַשְׁמִ֣יעוּ בְ/מִגְדּ֔וֹל וְ/הַשְׁמִ֥יעוּ בְ/נֹ֖ף וּ/בְ/תַחְפַּנְחֵ֑ס אִמְר֗וּ הִתְיַצֵּב֙ וְ/הָכֵ֣ן לָ֔/ךְ כִּֽי אָכְלָ֥ה חֶ֖רֶב סְבִיבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/014.yaml
  text: Declare it in Egypt[a], and proclaim it in Migdol; proclaim it in Noph and in Tahpanhes. Say, ‘Take your stand and prepare yourself, for the sword has devoured those around you.’
translation:
  language: ru
  text: 'Возвестите в Египте и объявите в Мигдоле; объявите в Нофе[a] и в Тахпанхесе. Скажите: «Займи своё место и приготовься, потому что меч пожрал всё вокруг тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ноф — древнееврейское название Мемфиса.
    reason: Историческое соответствие географического названия помогает современному читателю опознать город, не заменяя форму исходного текста.
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Возвестите
  rationale: Публичное каузативное значение породы hифиль передано торжественным, но понятным глаголом, соответствующим пророческому провозглашению.
- source_word: וְהַשְׁמִיעוּ
  choice: объявите
  rationale: Hифиль от שמע означает сделать весть услышанной; повтор глагола сохранён в обоих случаях.
- source_word: בְמִצְרַיִם
  choice: в Египте
  rationale: Предлог ב передан в прямом местном значении.
- source_word: בְמִגְדּוֹל
  choice: в Мигдоле
  rationale: Географическое название транслитерировано и оформлено по нормам русского склонения.
- source_word: בְנֹף
  choice: в Нофе
  rationale: Сохранено древнееврейское название города; более известное историческое соответствие указано в примечании.
- source_word: וּבְתַחְפַּנְחֵס
  choice: и в Тафанхесе
  rationale: Географическое название передано принятой русской библейской формой, близкой к еврейскому тексту.
- source_word: אִמְרוּ
  choice: Скажите
  rationale: Простой императив естественно вводит прямую речь.
- source_word: הִתְיַצֵּב
  choice: Займи позицию
  rationale: Hitpael от יצב выражает сознательное занятие места и готовность стоять; перевод сохраняет деятельный оттенок формы.
- source_word: וְהָכֵן לָךְ
  choice: и приготовься
  rationale: Конструкция с לָךְ имеет возвратный смысл и обращена к единственному адресату.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предшествующего приказа.
- source_word: אָכְלָה חֶרֶב
  choice: меч пожрал
  rationale: Сохранены перфектная форма и яркая персонифицирующая метафора разрушительного действия меча.
- source_word: סְבִיבֶיךָ
  choice: всё вокруг тебя
  rationale: Выражение обозначает окружающее пространство или окружение без явно названного объекта; нейтральная формулировка не добавляет в текст слово «люди».
theological_decisions:
- issue: Переход от множественного числа к единственному в обращении
  choice: 'В прямой речи сохранено единственное число: «Займи… приготовься… вокруг тебя».'
  alternative: Согласовать обращение с предшествующими множественными повелениями или понимать его как обращение к отдельному городу либо воинской части.
  rationale: Еврейская грамматика намеренно переходит от множественных приказов глашатаям к единственному адресату, вероятнее всего олицетворённому Египту; сглаживать этот переход не следует.
- issue: Видо-временное значение אָכְלָה
  choice: 'Перфект передан прошедшим совершенным видом: «пожрал».'
  alternative: «пожирает» или «пожрёт».
  rationale: Пророческий перфект допускает завершённое, уже наступающее либо представляемое как несомненное действие. Русское прошедшее совершенного вида сохраняет образ свершившегося опустошения, не превращая его однозначно в предсказание будущего.
- issue: Неявный объект при סְבִיבֶיךָ
  choice: «всё вокруг тебя»
  alternative: «тех, кто вокруг тебя» или просто «вокруг тебя».
  rationale: В масоретском тексте отдельного слова «тех» нет. Добавление одушевлённого объекта чрезмерно уточнило бы неоднозначный образ; «всё» естественно передаёт охват окружения.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Параллелизм и повтор «объявите» сохранены; топонимы даны в традиционных русских библейских формах. Единственное число в прямой речи намеренно не сглажено.
