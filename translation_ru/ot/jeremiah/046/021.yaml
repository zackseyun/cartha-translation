  source_fidelity: 'В целом образ и военная ситуация переданы точно: наёмные воины уподоблены откормленным телятам, затем они поворачивают, бегут и не могут устоять. Однако «Но и они» вносит противительный оттенок, которого כִּי גַם не выражает; здесь уместнее причинно-пояснительное «ибо и они». «Время наказания» точнее передаёт контекстуально карательное значение פְּקֻדָּה, не добавляя оттенка заслуженного воздаяния, который может вызывать «возмездие».'
