  terminology: «Наёмные воины» уместно передаёт שְׂכִירֶיהָ в военном контексте. «Откормленные телята», «день бедствия» и «время наказания» точно и естественно передают ключевые выражения. Сноска сохраняет возможные альтернативы для פְּקֻדָּה.
