  text: גַּם שְׂכִרֶ֤י/הָ בְ/קִרְבָּ/הּ֙ כְּ/עֶגְלֵ֣י מַרְבֵּ֔ק כִּֽי גַם הֵ֧מָּה הִפְנ֛וּ נָ֥סוּ יַחְדָּ֖יו לֹ֣א עָמָ֑דוּ כִּ֣י י֥וֹם אֵידָ֛/ם בָּ֥א עֲלֵי/הֶ֖ם עֵ֥ת פְּקֻדָּתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/021.yaml
  text: Even her hired soldiers in her midst are like fattened calves; for even they have turned and fled together; they did not stand[a], for the day of their disaster has come upon them, the time of their punishment.
translation:
  language: ru
  text: Даже наёмные воины среди неё — словно откормленные телята. Ибо и они повернули и вместе бежали, не устояли, потому что пришёл на них день бедствия, время наказания[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «время их посещения»; или: «время расплаты».'
    reason: Лексема פְּקֻדָּה может обозначать посещение, взыскание или наказание; контекст поддерживает карательный смысл.
lexical_decisions:
- source_word: שְׂכִרֶיהָ
  choice: наёмные воины
  rationale: Существительное обозначает нанятых людей, а в военном пророчестве о Египте — наёмных воинов. Этот вариант ясно передаёт военный смысл и звучит естественно по-русски.
- source_word: בְקִרְבָּהּ
  choice: среди неё
  rationale: 'Сохранён пространственный образ: наёмные воины находятся внутри олицетворённого Египта.'
- source_word: כְּעֶגְלֵי מַרְבֵּק
  choice: словно откормленные телята
  rationale: Речь о телятах, которых держат в стойле и откармливают; перевод сохраняет образ благополучных, но уязвимых животных.
- source_word: הִפְנוּ
  choice: повернули
  rationale: Передано основное значение глагола без добавления отсутствующего в тексте направления; последующее «бежали» проясняет, что речь об отступлении.
- source_word: נָסוּ יַחְדָּו
  choice: все вместе бежали
  rationale: Естественно передаёт совместное бегство; «все» выражает усилительный оттенок контекста.
- source_word: לֹא עָמָדוּ
  choice: не устояли
  rationale: Русское «не устояли» сохраняет образ неспособности противостоять врагу, не вводя более узкого пояснения вроде «не удержали позиций».
- source_word: יוֹם אֵידָם
  choice: день бедствия
  rationale: אֵיד обозначает бедствие или несчастье; выбран современный и уместный для пророческой речи эквивалент.
- source_word: עֵת פְּקֻדָּתָם
  choice: время возмездия
  rationale: В контексте суда פְּקֻדָּה имеет карательный оттенок. «Возмездие» передаёт наступившую расплату, а более буквальная семантическая возможность отмечена в сноске.
theological_decisions:
- issue: Передача слова פְּקֻדָּה в пророчестве о суде
  choice: время возмездия
  alternative: время их посещения; время расплаты
  rationale: Параллель с «днём бедствия» указывает на наказание, однако слово может обозначать посещение или момент, когда с кем-либо взыскивают. Основной текст передаёт контекстуальный карательный смысл, а сноска сохраняет более широкий диапазон.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксический параллелизм и повтор усилительных частиц переданы естественно, без архаизмов. Маркер сноски помещён после «возмездия», поскольку сноска относится к слову פְּקֻדָּה.
