base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/012.yaml
  text: The nations have heard of your shame[a], and your cry has filled the earth; for warrior has stumbled against warrior; together both of them have fallen.
translation:
  language: ru
  text: Народы услышали о твоём позоре, и твой вопль наполнил землю[a], потому что воин споткнулся о воина — оба пали вместе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страну». Еврейское אֶרֶץ может означать как всю землю, так и отдельную страну; здесь «землю» поддерживает предыдущее упоминание народов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: услышали
  rationale: Форма qal perfect обозначает совершившееся действие; русское прошедшее время естественно передаёт распространение вести.
- source_word: גוֹיִם
  choice: народы
  rationale: Обычное значение множественного числа גוי; в контексте речь идёт о народах, узнавших о поражении Египта.
- source_word: קְלוֹנֵךְ
  choice: о твоём позоре
  rationale: קָלוֹן означает позор, бесчестье, публичное унижение; местоимение женского рода обращено к Египту.
- source_word: וְצִוְחָתֵךְ
  choice: и твой вопль
  rationale: צְוָחָה — громкий крик бедствия; «вопль» сохраняет силу образа и подходит к возвышенной пророческой речи.
- source_word: מָלְאָה הָאָרֶץ
  choice: наполнил землю
  rationale: 'Форма מָלְאָה согласована с צִוְחָה: вопль наполнил אֶרֶץ, которое может означать как землю вообще, так и страну.'
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение того, почему вопль распространился повсюду.
- source_word: גִבּוֹר
  choice: воин
  rationale: В военном контексте גִּבּוֹר обозначает сильного бойца или воина, а не просто сильного человека.
- source_word: בְּגִבּוֹר
  choice: о воина
  rationale: 'Предлог ב при כּשל передаёт столкновение: один воин спотыкается о другого во время бегства или разгрома.'
- source_word: כָּשָׁלוּ
  choice: споткнулся
  rationale: Глагол означает спотыкаться или оступаться и намеренно отличён от следующего נָפְלוּ «пали»; единственное число по-русски естественно передаёт распределительную конструкцию «воин о воина».
- source_word: יַחְדָּיו נָפְלוּ שְׁנֵיהֶם
  choice: оба пали вместе
  rationale: Перевод сохраняет одновременность действия и подчёркнутое указание שְׁנֵיהֶם на обоих воинов.
