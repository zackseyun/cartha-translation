base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/023.yaml
  text: They have cut down her forest[a], declares Yahweh, though it cannot be searched out, because they are more numerous than locusts, and they are without number.
translation:
  language: ru
  text: 'Они вырубят её лес, — возвещает Яхве, — хотя[a] его не обозреть: их больше, чем саранчи, и нет им числа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо его не обозреть». Еврейский союз כִּי может иметь как уступительное значение («хотя»), так и причинное («ибо», «потому что»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרְתוּ
  choice: они вырубят
  rationale: Форма qal perfect 3-го лица множественного числа буквально представляет действие как совершившееся или несомненное; в контексте грядущего нападения русский будущий вид естественно передаёт пророческую уверенность.
- source_word: יַעְרָהּ
  choice: её лес
  rationale: Существительное יַעַר означает «лес»; суффикс женского рода относится к олицетворённому Египту и сохраняется местоимением «её».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современно и достойно; «возвещает» сохраняет большую весомость, чем нейтральное «говорит».
- source_word: כִּי לֹא יֵחָקֵר
  choice: хотя он неисследим
  rationale: Niphal от חקר выражает невозможность исследовать или обозреть лес; краткое «неисследим» сохраняет пассивно-модальное значение. Союз כִּי понят уступительно, но причинное прочтение отмечено в сноске.
- source_word: כִּי רַבּוּ מֵאַרְבֶּה
  choice: их больше, чем саранчи
  rationale: רבו указывает на подавляющую многочисленность нападающих, а собирательное אַרְבֶּה создаёт образ неисчислимого разрушительного нашествия саранчи.
- source_word: וְאֵין לָהֶם מִסְפָּר
  choice: и нет им числа
  rationale: Близкая к еврейской идиоме русская формула ясно выражает неисчислимость и сохраняет возвышенный пророческий строй.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, поэтому транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Связь כִּי לֹא יֵחָקֵר с предшествующей фразой
  choice: 'уступительная: «хотя он неисследим»'
  alternative: 'причинная: «ибо он неисследим»'
  rationale: 'Уступительное прочтение лучше выражает контраст: лес будет вырублен, несмотря на его необозримость. Однако многозначность כִּי допускает причинное понимание, поэтому оно сохранено в сноске.'
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Метафоры леса и саранчи сохранены; синтаксис сделан ясным без устранения неоднозначности союза כִּי.
