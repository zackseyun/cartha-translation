source:
  edition: WLC
  text: אַל יָנ֣וּס הַ/קַּ֔ל וְ/אַל יִמָּלֵ֖ט הַ/גִּבּ֑וֹר צָפ֨וֹנָ/ה֙ עַל יַ֣ד נְהַר פְּרָ֔ת כָּשְׁל֖וּ וְ/נָפָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/006.yaml
  text: Let not the swift flee[a], and let not the mighty man escape; in the north, by the bank of the Euphrates River[c][b], they have stumbled and fallen.
translation:
  language: ru
  text: Да не убежит быстроногий, и да не спасётся воин[a]! На севере[b], у реки Евфрат[c], они споткнулись и пали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильный» или «доблестный боец». Еврейское גִּבּוֹר часто обозначает сильного, отважного воина.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к северу» или «на север». Еврейскую форму צָפוֹנָה можно понимать и как указание направления, и как указание места.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «у руки Евфрата» — еврейское выражение со значением «рядом с Евфратом» или «у берега Евфрата».'
    reason: idiom
lexical_decisions:
- source_word: אַל יָנוּס
  choice: да не убежит
  rationale: Сочетание אַל с имперфектом выражает запретительно-пожелательное значение в третьем лице. Конструкция «да не» сохраняет его и соответствует возвышенному пророческому тону.
- source_word: הַקַּל
  choice: быстроногий
  rationale: Прилагательное обозначает лёгкого, быстрого человека; в военном контексте речь идёт о проворном бойце. «Быстроногий» естественно передаёт способность быстро бежать.
- source_word: וְאַל יִמָּלֵט
  choice: и да не спасётся
  rationale: Нифаль глагола מלט здесь означает избежать гибели, спастись или уйти невредимым. «Спастись» ясно передаёт смысл в сцене военного поражения.
- source_word: הַגִּבּוֹר
  choice: воин
  rationale: В военном контексте גִּבּוֹר обозначает сильного, доблестного бойца. «Воин» звучит естественно и не вводит лишней характеристики.
- source_word: צָפוֹנָה
  choice: на севере
  rationale: Форма с направительным окончанием может обозначать движение к северу, но при следующем географическом уточнении естественно понимать её как указание места поражения.
- source_word: עַל יַד
  choice: у
  rationale: Буквально «у руки/стороны»; это обычное пространственное выражение со значением «рядом с, возле». Русское «у реки» кратко и идиоматично.
- source_word: נְהַר פְּרָת
  choice: реки Евфрат
  rationale: Сохраняется как родовое обозначение «река», так и собственное имя; русская конструкция после предлога требует родительного падежа.
- source_word: כָּשְׁלוּ וְנָפָלוּ
  choice: они споткнулись и пали
  rationale: Два перфекта изображают завершившееся поражение краткой последовательностью действий. «Пали» сохраняет поэтический и военный оттенок נפל.
