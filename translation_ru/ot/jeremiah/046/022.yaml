base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/022.yaml
  text: Her sound goes like a serpent[a], for they go with an army and come against her with axes[c][b], like woodcutters.
translation:
  language: ru
  text: Голос её раздаётся, словно шипение змеи[a], ведь они идут с войском[b] и выступают против неё с топорами[c], как дровосеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «голос её идёт, словно змея». Слово קוֹל может означать «голос», «звук» или «шум»; шипение подразумевается сравнением со змеёй.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «идут большой силой». Слово חַיִל может обозначать военную силу, мощь или войско.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «приходят к ней»; в данном контексте речь идёт о вражеском выступлении против неё.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלָהּ
  choice: голос её
  rationale: קוֹל может обозначать голос, звук или шум. «Голос» сохраняет олицетворение Египта в женском роде и подходит возвышенной пророческой речи; широта значения отмечена в сноске.
- source_word: כַּנָּחָשׁ יֵלֵךְ
  choice: раздаётся, словно шипение змеи
  rationale: Буквально образ выражен как «идёт, словно змея». По-русски звук естественно «раздаётся», а уподобление звуку змеи передано как «шипение»; буквальная форма, не называющая шипения прямо, сохранена в сноске.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит объяснение предшествующего образа и естественно передаётся причинно-пояснительным «ведь».
- source_word: בְחַיִל
  choice: несметным войском
  rationale: חַיִל может обозначать силу, военную мощь или войско. В контексте наступающих вооружённых людей выбран военный смысл; «несметным» передаёт идею движения большой силой, не превращая выражение в отвлечённое «с силой».
- source_word: יֵלֵכוּ
  choice: идут
  rationale: Сохранено основное значение הלך «идти» без дополнительного уточнения способа движения.
- source_word: וּבְקַרְדֻּמּוֹת
  choice: с топорами
  rationale: קַרְדֹּם обозначает топор; множественное число и инструментальное значение предлога естественно переданы сочетанием «с топорами».
- source_word: בָּאוּ לָהּ
  choice: выступают против неё
  rationale: Буквально конструкция означает «приходят к ней», но военный контекст показывает враждебную направленность. «Выступают против неё» ясно выражает её, а буквальная форма отмечена в сноске.
- source_word: כְּחֹטְבֵי עֵצִים
  choice: как дровосеки
  rationale: Причастное выражение буквально означает «как рубящие дерево/деревья». «Дровосеки» — краткий, современный и образный русский эквивалент.
