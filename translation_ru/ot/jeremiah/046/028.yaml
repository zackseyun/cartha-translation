  text: אַ֠תָּה אַל תִּירָ֞א עַבְדִּ֤/י יַֽעֲקֹב֙ נְאֻם יְהוָ֔ה כִּ֥י אִתְּ/ךָ֖ אָ֑נִי כִּי֩ אֶעֱשֶׂ֨ה כָלָ֜ה בְּ/כָֽל הַ/גּוֹיִ֣ם אֲשֶׁ֧ר הִדַּחְתִּ֣י/ךָ שָׁ֗מָּ/ה וְ/אֹֽתְ/ךָ֙ לֹא אֶעֱשֶׂ֣ה כָלָ֔ה וְ/יִסַּרְתִּ֨י/ךָ֙ לַ/מִּשְׁפָּ֔ט וְ/נַקֵּ֖ה לֹ֥א אֲנַקֶּֽ/ךָּ־־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/028.yaml
  text: But you[a], do not fear, my servant Jacob, declares Yahweh, for I am with you. For I will make a full end of all the nations where I have driven you, but of you I will not make a full end. Yet I will discipline you with justice[b], and I will by no means leave you unpunished.
translation:
  language: ru
  text: А ты не бойся, Мой слуга Иаков, — говорит Яхве, — ибо Я с тобой. Я полностью уничтожу все народы, к которым Я изгнал тебя, но тебя полностью не уничтожу[a]. Я подвергну тебя взысканию по справедливости и без наказания тебя не оставлю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не сделаю тебе полного конца». То же выражение ранее употреблено о народах, что подчёркивает контраст между их участью и участью Иакова.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и невиновным тебя не объявлю». Еврейский глагол может иметь судебный смысл — «оправдать, признать невиновным», — а здесь также означает, что Иаков не останется без заслуженного наказания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: не бойся
  rationale: Естественная русская передача прямого запрета, сохраняющая тон пророческого ободрения.
- source_word: עַבְדִּי יַעֲקֹב
  choice: раб Мой Иаков
  rationale: Сохранены и заветный титул, и прямо названное в еврейском тексте имя Иаков.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную пророческую формулу и сохраняет личное имя Бога.
- source_word: כִּי אִתְּךָ אָנִי
  choice: потому что Я с тобой
  rationale: Прямо передаёт основание повеления не бояться — Божье присутствие.
- source_word: אֶעֱשֶׂה כָלָה
  choice: полностью истреблю
  rationale: Передаёт значение полного уничтожения и позволяет сохранить намеренный контраст между народами и Иаковом.
- source_word: אֲשֶׁר הִדַּחְתִּיךָ שָׁמָּה
  choice: среди которых рассеял тебя
  rationale: В контексте изгнания каузативная форма נדח указывает на совершённое Богом удаление и рассеяние Иакова среди народов.
- source_word: וְיִסַּרְתִּיךָ לַמִּשְׁפָּט
  choice: Я накажу тебя по справедливости
  rationale: Сочетание передаёт исправительное взыскание, осуществляемое справедливо, а не произвольно или безмерно.
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  choice: и без наказания тебя не оставлю
  rationale: Инфинитив абсолютный усиливает отрицание; выбранная формулировка естественно передаёт мысль, что Иаков не будет освобождён от заслуженных последствий.
theological_decisions:
- issue: Суд над Иаковом в сопоставлении с судом над народами
  choice: Бог не допустит полного истребления Иакова, но подвергнет его справедливому взысканию.
  alternative: Понять обещание так, будто Иаков вовсе не испытает Божьего суда, либо представить взыскание как исключительно уничтожающую кару.
  rationale: 'Стих намеренно удерживает вместе милость и суд: Иаков будет сохранён от полного уничтожения, но не останется без справедливого наказания.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Местоимения, относящиеся к Богу в прямой речи, оформлены с прописной буквы; личное имя יהוה передано как «Яхве». Повтор «полностью истреблю / полностью не истреблю» сохраняет риторическое противопоставление оригинала.
