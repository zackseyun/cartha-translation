- source_word: כַּנְּהָרוֹת
  choice: словно реки
  rationale: Сохранены множественное число и поэтическое сравнение исходного текста без уточнения вида водных потоков.
- source_word: יִתְגָּעֲשׁוּ
  choice: бурлят
  rationale: Форма хитпаэль передаёт бурное движение воды; «бурлят» сохраняет динамику образа, не сводя его только к шуму.
- source_word: מֵימָיו
  choice: воды его
  rationale: Буквально местоименный суффикс означает «его воды». Такая формулировка сохраняет олицетворение и синтаксическую связь с загадочной фигурой, представленной вопросом.
