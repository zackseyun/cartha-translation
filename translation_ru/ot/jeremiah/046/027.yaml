reference: Jeremiah 46:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ֠/אַתָּה אַל תִּירָ֞א עַבְדִּ֤/י יַֽעֲקֹב֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲק֛וֹב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/027.yaml
  text: But as for you[a], do not fear, my servant Jacob, and do not be dismayed, Israel; for behold, I will save you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
translation:
  language: ru
  text: Но ты не бойся, раб Мой Иаков, и не страшись, Израиль, ибо вот, Я спасу тебя издалека и твоё потомство — из земли их плена.[a] Иаков возвратится и будет жить спокойно и безмятежно, и никто не устрашит его.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из земли, где они находятся в плену».'
    reason: lexical_alternative
  - marker: b
    text: «Иаков» и «Израиль» здесь олицетворяют народ завета.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  choice: Но ты
  rationale: Самостоятельное местоимение с союзом подчёркивает контраст с предшествующим пророчеством о суде; «Но ты» естественно передаёт этот переход.
- source_word: אַל תִּירָא עַבְדִּי יַעֲקֹב
  choice: не бойся, раб Мой Иаков
  rationale: Сохранены прямой запрет и заветное именование народа через имя патриарха.
- source_word: וְאַל תֵּחַת
  choice: и не страшись
  rationale: Глагол передаёт состояние ужаса или душевной подавленности; «не страшись» образует естественный поэтический параллелизм с «не бойся».
- source_word: כִּי הִנְנִי מוֹשִׁיעֲךָ
  choice: ибо вот, Я спасу тебя
  rationale: הִנְנִי с причастием представляет действие как предстоящее и несомненное; в русском обещании естественнее совершенный вид будущего времени.
- source_word: מֵרָחוֹק
  choice: издалека
  rationale: 'Сохраняет пространственное значение: спасение и возвращение из далёкой земли.'
- source_word: זַרְעֲךָ
  choice: твоё потомство
  rationale: Коллективное значение זרע передано современным и понятным словом без буквального «семя».
- source_word: מֵאֶרֶץ שִׁבְיָם
  choice: из земли их плена
  rationale: Близко передаёт существительное שבי и множественный притяжательный суффикс, относящийся к потомству как совокупности людей.
- source_word: וְשָׁב יַעֲקֹב
  choice: Иаков возвратится
  rationale: В контексте восстановления שׁוב означает возвращение из изгнания.
- source_word: וְשָׁקַט וְשַׁאֲנַן
  choice: и будет жить спокойно и безмятежно
  rationale: Парные глаголы описывают не молчание, а безопасный, ничем не тревожимый покой; добавление «жить» делает выражение естественным по-русски.
- source_word: וְאֵין מַחֲרִיד
  choice: и никто не устрашит его
  rationale: 'Сохраняет личную конструкцию и причинное значение причастия: не будет того, кто наведёт страх.'
theological_decisions:
- issue: Кого обозначают «Иаков» и «Израиль»
  choice: Заветный народ, олицетворённый под именами патриарха
  alternative: Лично патриарх Иаков как символическая фигура
  rationale: Параллельные обращения и упоминание потомства в контексте плена и возвращения указывают на народ; собственные имена сохранены, чтобы не устранять пророческое олицетворение.
- issue: Временная направленность מוֹשִׁיעֲךָ
  choice: 'Будущее обещание: «Я спасу тебя»'
  alternative: 'Актуально-развёртывающееся действие: «Я спасаю тебя»'
  rationale: Причастие после הִנְנִי может подчёркивать близость или несомненность действия, но контекст будущего возвращения делает русское будущее время наиболее естественным, не отрицая уверенности обещания.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого тона. Местоимение «Мой» при прямой речи Бога написано с прописной буквы по принятой русской библейской традиции; синтаксис остаётся ясным для обычного читателя.
