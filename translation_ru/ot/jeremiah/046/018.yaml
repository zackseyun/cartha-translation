base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/018.yaml
  text: As I live[a], declares the King, whose name is Yahweh of Armies, surely as Tabor among the mountains and as Carmel by the sea[b], so he will come.
translation:
  language: ru
  text: Жив Я, — возвещает Царь, чьё имя — Яхве Воинств[a], — как Фавор среди гор и как Кармил у моря, так непременно придёт[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве Саваоф».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте субъект глагола «придёт» прямо не назван; из контекста следует, что речь идёт о наступающем завоевателе, возвещённом в соседних стихах.
    reason: cross_reference
lexical_decisions:
- source_word: חַי אָנִי
  choice: Живу Я
  rationale: Торжественная формула божественной клятвы; сохраняет образ самоудостоверения Божьей жизнью и звучит естественно в возвышенной русской речи.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт устойчивую пророческую формулу речи без тяжеловесного буквального «изречение».
- source_word: הַמֶּלֶךְ
  choice: Царь
  rationale: Определённый титул Бога; прописная буква указывает на употребление как божественного титула.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יהוה как «Яхве», а צבאות — как «Воинств», сохраняя военный и царственный оттенок выражения.
- source_word: שְׁמוֹ
  choice: чьё имя
  rationale: Естественная русская относительная конструкция, точно связывающая титул Царя с именем Яхве Воинств.
- source_word: כִּי
  choice: непременно
  rationale: Вводит содержание клятвенного заверения и выражает уверенность, а не причинную связь.
- source_word: כְּתָבוֹר בֶּהָרִים
  choice: словно Фавор среди гор
  rationale: Сохраняет сравнительную частицу и образ выдающейся горы среди других гор.
- source_word: וּכְכַרְמֶל בַּיָּם
  choice: и словно Кармил у моря
  rationale: Сохраняет второе параллельное сравнение и географический образ горы Кармил у Средиземного моря.
- source_word: יָבוֹא
  choice: он придёт
  rationale: Глагол имеет форму 3-го лица мужского рода единственного числа; местоимение необходимо по-русски, но его референт оставлен неуточнённым, как и в еврейском тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо содержит тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Передача צְבָאוֹת
  choice: Воинств
  alternative: Саваоф
  rationale: Перевод раскрывает значение слова современному читателю и сохраняет его военную образность; традиционное «Саваоф» для многих непрозрачно.
- issue: Неуказанный субъект יָבוֹא
  choice: он придёт
  alternative: придёт некто
  rationale: Мужской род глагола позволяет употребить «он», но сам стих не называет субъекта; поэтому примечание сохраняет грамматическую и контекстуальную неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Синтаксис сохраняет клятвенную формулу и два параллельных сравнения; субъект заключительного глагола не конкретизирован сверх исходного текста.
