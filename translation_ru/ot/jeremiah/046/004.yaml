  yaml_path: translation/ot/jeremiah/046/004.yaml
  text: Harness the horses[a]; mount up, you horsemen; take your stand with helmets on. Polish the spears[b]; put on the armor.
translation:
  language: ru
  text: Запрягайте коней; всадники, садитесь на коней! Становитесь в строй, надев шлемы. Начищайте копья, надевайте доспехи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «доспехи», обозначает защитное снаряжение для тела — возможно, панцири или кольчуги.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְרוּ הַסּוּסִים
  choice: Запрягайте коней
  rationale: Глагол אסר буквально связан со связыванием, но применительно к коням в военном приготовлении естественно означает «запрягать» или снаряжать их; выбран ясный современный русский оборот.
- source_word: וַעֲלוּ הַפָּרָשִׁים
  choice: всадники, садитесь в сёдла
  rationale: עלה буквально означает «подниматься», однако при обращении к всадникам здесь подразумевается посадка на коней. Обращение «всадники» сохраняет явную адресность приказа.
- source_word: וְהִתְיַצְּבוּ
  choice: Стройтесь
  rationale: Возвратная форма от יצב велит занять устойчивую позицию; в военном контексте «стройтесь» кратко и естественно передаёт построение и готовность стоять в строю.
- source_word: בְּכוֹבָעִים
  choice: надев шлемы
  rationale: כּוֹבָעִים обозначает военные шлемы; русский оборот естественно выражает требование быть в шлемах.
- source_word: מִרְקוּ הָרְמָחִים
  choice: Начищайте копья
  rationale: Глагол מרק означает очищать, полировать до блеска; «начищайте» доступно передаёт подготовку копий без архаичного оттенка слова «полируйте».
- source_word: לִבְשׁוּ הַסִּרְיֹנֹת
  choice: надевайте доспехи
  rationale: סִרְיֹן обозначает защитное снаряжение для тела, возможно панцирь или кольчугу. Общее «доспехи» сохраняет неопределённость конкретного вида защиты.
