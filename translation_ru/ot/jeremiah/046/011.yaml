translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой речи. Женский род императивов и местоимений сохраняет олицетворение Египта; восклицание выделяет прямое обращение. Подстрочные примечания расставлены в соответствии с их фактическим содержанием: культурное пояснение относится к бальзаму, текстологическое — к трудной глагольной форме.'
