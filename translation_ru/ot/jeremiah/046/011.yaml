base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/011.yaml
  text: Go up to Gilead and get balm[a], virgin daughter of Egypt. In vain you have multiplied remedies[b]; there is no healing for you.
translation:
  language: ru
  text: 'Поднимись в Галаад и возьми бальзам[a], дева, дочь Египта! Напрасно ты прибегала к множеству лекарств[b]: исцеления для тебя нет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Галаад славился лекарственным бальзамом. Повеление звучит иронически: даже самое известное целебное средство не исцелит Египет.'
    reason: cultural_note
  - marker: b
    text: 'Согласное написание глагола текстуально и морфологически трудно: при обычном чтении оно может означать «я умножил», тогда как контекст требует обращения к Египту во 2-м лице женского рода, вероятно: «ты умножила». Смысл ясен по контексту: Египет напрасно прибегал к многочисленным лекарствам.'
    reason: textual_variant
lexical_decisions:
- source_word: עֲלִי
  choice: Поднимись
  rationale: Форма повелительного наклонения Qal, 2-е лицо женского рода единственного числа от עלה; передаёт направление движения и согласуется с обращением к олицетворённому Египту.
- source_word: גִלְעָד
  choice: Галаад
  rationale: Традиционная и общепонятная русская форма географического названия; эта область славилась целебным бальзамом.
- source_word: וּקְחִי צֳרִי
  choice: и возьми целебного бальзама
  rationale: Императив לקח передан буквально и естественно; צֳרִי обозначает лекарственную смолу или бальзам, а определение «целебного» проясняет её употребление в данном контексте.
- source_word: בְּתוּלַת בַּת מִצְרָיִם
  choice: дева — дочь Египта
  rationale: Сохранена пророческая формула олицетворения страны как молодой женщины; тире ясно передаёт приложенное обозначение без устранения образной напряжённости.
- source_word: לַשָּׁוְא
  choice: Напрасно
  rationale: Кратко и естественно передаёт значение тщетности.
- source_word: הרביתי רְפֻאוֹת
  choice: ты умножаешь лекарства
  rationale: По контексту трудная согласная форма глагола понимается как обращение во 2-м лице женского рода; настоящее время в русском выражает предпринимаемые, но бесплодные попытки, а «умножаешь» сохраняет образ множественности средств.
- source_word: תְּעָלָה אֵין לָךְ
  choice: исцеления для тебя нет
  rationale: Сохранены экзистенциальная конструкция и прямой смысл отсутствия восстановления или излечения.
