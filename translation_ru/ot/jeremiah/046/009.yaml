base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/009.yaml
  text: Go up, O horses, and rage, O chariots; let the warriors go out—Cush and Put, who grasp the shield, and the Ludim, who grasp and bend the bow.
translation:
  language: ru
  text: Вперёд, кони! Неистовствуйте, колесницы! Пусть выступят воины — Куш и Пут, щитоносцы, и лудимы, берущие в руки и натягивающие луки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלוּ הַסּוּסִים
  choice: Вперёд, кони!
  rationale: Буквально «поднимайтесь/выступайте, кони»; в военном призыве естественное русское «Вперёд» передаёт побуждение без неуместного пространственного уточнения.
- source_word: וְהִתְהֹלְלוּ הָרֶכֶב
  choice: Неситесь, колесницы!
  rationale: Редкая форма от הלל в данном контексте описывает неистовое, стремительное движение колесниц; «неситесь» естественно передаёт образ, не вводя идею прославления.
- source_word: הַגִּבּוֹרִים
  choice: воины
  rationale: В военном контексте обозначает сильных, доблестных бойцов; «воины» ясно и стилистически уместно.
- source_word: כּוּשׁ וּפוּט
  choice: кушиты и путы
  rationale: Названия народов поняты как обозначение воинских подразделений; этнонимические формы естественнее по-русски, чем названия стран.
- source_word: וְלוּדִים
  choice: и лудимы
  rationale: Сохранён библейский этноним во множественном числе без спорного отождествления с более известными лидийцами.
- source_word: תֹּפְשֵׂי דֹּרְכֵי קָשֶׁת
  choice: держащие и натягивающие луки
  rationale: Два причастия передают владение луком и действие с ним; «натягивающие» естественно выражает подготовку лука к выстрелу.
