  text: הֹבִ֖ישָׁה בַּת מִצְרָ֑יִם נִתְּנָ֖ה בְּ/יַ֥ד עַם צָפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/024.yaml
  text: The daughter of Egypt is put to shame[a]; she is given into the hand of a people from the north.
translation:
  language: ru
  text: Посрамлена дочь Египта; она отдана в руки[a] народа с севера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руку народа с севера»; это выражение означает переход под его власть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישָׁה
  choice: посрамлена
  rationale: Форма породы hифиль от בוש выражает причинённый позор или поражение, обернувшееся позором. Краткое «посрамлена» сохраняет страдательный смысл и пророческий тон.
- source_word: בַּת מִצְרָיִם
  choice: дочь Египта
  rationale: Сохранено характерное для пророческой речи олицетворение страны; оно также передаёт женский род согласованных форм.
- source_word: נִתְּנָה
  choice: она отдана
  rationale: Нифаль от נתן имеет здесь страдательное значение и описывает передачу Египта во власть противника. Местоимение естественно связывает вторую часть стиха с «дочерью Египта».
- source_word: בְּיַד
  choice: в руки
  rationale: Еврейское выражение буквально говорит о передаче «в руку» и идиоматически означает переход под чью-либо власть. Русское «отдана в руки» естественно сохраняет тот же образ.
- source_word: עַם צָפוֹן
  choice: народа с севера
  rationale: Передаёт неопределённое собирательное «народ» и северное происхождение, не добавляя в основной текст исторического отождествления.
theological_decisions:
- issue: Следует ли прямо назвать северный народ Вавилоном
  choice: Оставить общее обозначение «народ с севера»
  alternative: 'Уточнить в переводе: «вавилоняне» или «вавилонское войско»'
  rationale: Еврейский текст не называет этот народ в данном стихе. Общее обозначение сохраняет формулировку и смысловую открытость источника.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм оригинала сохранён; метафора «дочь Египта» не упрощена.
