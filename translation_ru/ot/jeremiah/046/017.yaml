lexical_decisions:
- source_word: קָרְאוּ שָׁם
  choice: Там кричат
  rationale: 'Перфект Qal 3-го лица множественного числа в живом пророческом повествовании естественно передан русским настоящим временем; שָׁם обозначает место: «там».'
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Фараон, царь Египта
  rationale: Сохранены имя-титул и поясняющее приложение в естественном русском синтаксисе.
- source_word: שָׁאוֹן
  choice: один лишь шум
  rationale: Слово обозначает шум, грохот или смятение; в насмешливом контексте выражение передаёт мысль о громких, но бесплодных притязаниях, не сводя её к одному толкованию.
- source_word: הֶעֱבִיר
  choice: упустил
  rationale: Hiphil от עבר буквально выражает причинение или позволение пройти; при дополнении «назначенный срок» по-русски естественно передаётся как «упустил», то есть дал решающему сроку пройти.
- source_word: הַמּוֹעֵד
  choice: назначенный срок
  rationale: מוֹעֵד может означать назначенное время, срок, встречу или праздник; военно-политический контекст указывает здесь на установленный решающий срок.
