base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/002.yaml
  text: 'Concerning Egypt: concerning the army of Pharaoh Neco king of Egypt[a], which was by the Euphrates River at Carchemish, which Nebuchadnezzar king of Babylon struck down in the fourth year of Jehoiakim son of Josiah[b], king of Judah.'
translation:
  language: ru
  text: 'О Египте: о войске фараона Нехо, царя Египта, находившемся у реки Евфрат, при Кархемише, — войске, которое поразил Навуходоносор[a], царь Вавилона, в четвёртый год правления Иоакима, сына Иосии, царя Иудеи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская форма имени в этом стихе точнее передаётся как «Навуходреццар»; «Навуходоносор» — традиционная русская форма.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִצְרַיִם
  choice: О Египте
  rationale: В пророческом заголовке לְ вводит тему изречения. «О Египте» сохраняет широкий смысл и не усиливает направленность до «против Египта».
- source_word: עַל חֵיל
  choice: о войске
  rationale: עַל продолжает тематический заголовок, а חֵיל в данном военном контексте означает войско.
- source_word: פַּרְעֹה נְכוֹ
  choice: фараона Нехо
  rationale: «Нехо» — укоренившаяся в русском библейском употреблении передача имени, соответствующая еврейской форме.
- source_word: אֲשֶׁר הָיָה עַל נְהַר פְּרָת
  choice: которое стояло у реки Евфрат
  rationale: Буквально конструкция означает «которое было у реки Евфрат»; «стояло» естественно описывает расположение войска, не меняя смысла.
- source_word: בְּכַרְכְּמִשׁ
  choice: близ Кархемиша
  rationale: Предлог בְ обозначает местонахождение; «близ Кархемиша» естественно согласуется с расположением войска у Евфрата и историческим местом сражения.
- source_word: הִכָּה
  choice: разгромил
  rationale: В военном контексте נכה может обозначать нанесение поражения. «Разгромил» ясно передаёт результат удара по войску, хотя более формально возможно «поразил».
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносор
  rationale: Традиционная и общепонятная русская форма имени; особенность еврейского написания отмечена в сноске.
- source_word: בִּשְׁנַת הָרְבִיעִית לִיהוֹיָקִים
  choice: в четвёртый год правления Иоакима
  rationale: «Правления» естественно проясняет подразумеваемую царскую датировочную формулу.
- source_word: יְהוֹיָקִים בֶּן יֹאשִׁיָּהוּ
  choice: Иоакима, сына Иосии
  rationale: Использованы укоренившиеся русские формы библейских имён и прямо сохранено родственное указание.
theological_decisions:
- issue: Направленность заголовка לְמִצְרַיִם
  choice: О Египте
  alternative: Против Египта
  rationale: Грамматика допускает в пророческом заголовке направленное прочтение, однако здесь формула прежде всего называет тему и исторический объект изречения; нейтральное «о» сохраняет неоднозначность лучше.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческого заголовка. Синтаксис слегка разгружен: הָיָה передано как «стояло» применительно к войску, а датировочная формула — с естественным уточнением «правления». Все сноски имеют маркеры в основном тексте.'
