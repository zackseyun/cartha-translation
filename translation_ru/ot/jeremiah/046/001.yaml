lexical_decisions:
- source_word: אֲשֶׁר
  choice: которое
  rationale: Вводит относительное придаточное и естественно связывает заголовок с последующими пророчествами.
- source_word: הָיָה ... אֶל
  choice: было к
  rationale: Сохраняет обычную русскую библейскую форму пророческой формулы, оставаясь близкой к еврейской конструкции; выражение «пришло к» было бы более динамичным.
- source_word: דְבַר יְהוָה
  choice: Слово Яхве
  rationale: «Слово» сохраняет формальный и богословский вес выражения, а личное имя передаёт тетраграмматон без замены титулом.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: пророку Иеремии
  rationale: Естественный русский порядок слов сохраняет имя и явно названное служение Иеремии.
- source_word: עַל
  choice: о
  rationale: В заголовке может обозначать общую тему пророчеств; возможный в данном контексте враждебный смысл «против» сохранён в сноске.
- source_word: הַגּוֹיִם
  choice: народах
  rationale: Речь идёт об иноземных народах как политико-этнических общностях; слово «язычники» внесло бы лишний религиозный оттенок.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Смысл עַל הַגּוֹיִם в заголовке
  choice: о народах
  alternative: против народов
  rationale: Предлог может вводить тему вообще, хотя содержание следующих пророчеств преимущественно направлено против этих народов. Основной текст не сужает смысл, а контекстуально возможное прочтение дано в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческого заголовка. Сохранена традиционная для русского библейского языка формула «слово… было к», без архаизмов вроде «языки».
