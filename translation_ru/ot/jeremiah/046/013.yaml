  text: 'Слово, которое Яхве сказал пророку Иеремии о приходе Навуходоносора[a], царя Вавилона, чтобы поразить землю Египта:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте имя имеет форму «Невухадреццар»; здесь употреблена традиционная русская форма «Навуходоносор».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: В заголовках пророчеств דָּבָר обозначает слово или весть от Бога. «Слово» сохраняет устойчивую пророческую формулу и высокий, но понятный регистр.
- source_word: דִּבֶּר
  choice: сказал
  rationale: При Яхве как субъекте и Иеремии как адресате это естественный современный русский эквивалент; он не добавляет оттенков, отсутствующих в исходном тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: הַנָּבִיא
  choice: пророку
  rationale: Сохраняет указание на служение Иеремии; по нормам русского языка приложение естественно поставлено перед именем.
- source_word: לָבוֹא
  choice: о приходе
  rationale: Инфинитив с לְ здесь указывает на содержание пророчества и сохраняет направленный в будущее смысл, не превращая приход в уже завершившееся событие.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносора
  rationale: Использована узнаваемая традиционная русская форма имени; более точная передача написания в данном еврейском стихе приведена в сноске.
- source_word: מֶלֶךְ בָּבֶל
  choice: царя Вавилона
  rationale: Прямо и естественно передаёт сопряжённую конструкцию.
- source_word: לְהַכּוֹת
  choice: чтобы поразить
  rationale: Глагол נכה может означать нанесение удара, военное нападение или поражение. «Поразить» сохраняет военный и судебный оттенки, не уточняя исход сверх текста.
- source_word: אֶרֶץ מִצְרָיִם
  choice: землю Египта
  rationale: Сохраняет явно присутствующее אֶרֶץ и территориальную направленность грядущего удара.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יהוה. «Яхве» передаёт его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого заголовка. Синтаксис близок к еврейскому, но остаётся естественным; двоеточие показывает, что далее следует содержание пророчества.
