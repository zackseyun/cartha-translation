  text: Египет — прекрасная телица; с севера летит овод — летит[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с севера идёт погибель». Редкое еврейское слово может обозначать овода или, в более широком смысле, погибель.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶגְלָה
  choice: телица
  rationale: Существительное обозначает молодую корову; «телица» точно передаёт значение и сохраняет женский образ олицетворённого Египта.
- source_word: יְפֵה פִיָּה
  choice: прекрасная
  rationale: Сочетание описывает привлекательность или красоту животного. «Прекрасная» естественно звучит по-русски, не перегружая поэтический образ буквальным оборотом.
- source_word: מִצְרָיִם
  choice: Египет
  rationale: Обычная передача названия страны, здесь олицетворённой в образе телицы.
- source_word: קֶרֶץ
  choice: овод
  rationale: Редкое и не вполне ясное существительное, вероятно обозначающее жалящее или кусающее насекомое. «Овод» сохраняет цельный образ телицы, которую атакует насекомое; абстрактное понимание отражено в сноске.
- source_word: מִצָּפוֹן
  choice: с севера
  rationale: Стандартная передача направления; у Иеремии север часто связан с направлением вражеского нашествия и суда.
- source_word: בָּא בָא
  choice: налетел, налетел
  rationale: Двойное повторение сохранено ради настойчивости и срочности. В сочетании с «оводом» глагол «налетел» естественно передаёт приход и нападение, выраженные еврейским בָּא.
theological_decisions:
- issue: Значение קֶרֶץ в метафорическом пророчестве о суде
  choice: Конкретный образ овода, нападающего на телицу
  alternative: «Погибель» или «бедствие» с севера
  rationale: Конкретное значение лучше сохраняет единство животного образа и поэтическую выразительность стиха. Поскольку редкое еврейское слово допускает и более абстрактное толкование, оно приведено в сноске без устранения подлинной неоднозначности.
translation_notes:
  register: Современный литературный русский язык с краткой, выразительной пророческой фразой. Тире ясно оформляет метафорическое отождествление Египта с телицей; повтор глагола сохраняет напряжённость оригинала.
