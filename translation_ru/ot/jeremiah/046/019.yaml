lexical_decisions:
- source_word: כְּלֵי גוֹלָה
  choice: вещи для изгнания
  rationale: Сочетание буквально обозначает предметы или снаряжение, которые готовят для вынужденного переселения. «Вещи для изгнания» естественно передаёт конкретный образ, не превращая изгнание в добровольную дорогу.
- source_word: עֲשִׂי לָךְ
  choice: приготовь себе
  rationale: Женская форма повеления с местоименным оборотом означает приготовить необходимое для себя; русский оборот сохраняет и побуждение, и возвратный оттенок.
- source_word: יוֹשֶׁבֶת בַּת מִצְרָיִם
  choice: жительница, дочь Египта
  rationale: Сохраняются женский род причастия и пророческое олицетворение Египта. Приложение «дочь Египта» звучит по-русски понятнее буквального нагромождения, не устраняя образ.
- source_word: נֹף
  choice: Ноф
  rationale: Сохранена древнееврейская форма названия города; его отождествление с Мемфисом поясняется в сноске.
- source_word: לְשַׁמָּה
  choice: пустыней
  rationale: В данном контексте слово обозначает опустошённое, разорённое место; творительный падеж естественно сочетается с «станет».
- source_word: וְנִצְּתָה
  choice: будет разорён
  rationale: Форма передаёт гибель или опустошение города и может включать образ сожжения. Основной текст не сужает значение до огня, а возможный более конкретный смысл отмечен в сноске.
- source_word: מֵאֵין יוֹשֵׁב
  choice: останется без жителей
  rationale: Идиома означает полное отсутствие населения. Такой оборот естественен в современном русском и сохраняет мрачную завершённость пророчества.
