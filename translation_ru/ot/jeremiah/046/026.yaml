  text: וּ/נְתַתִּ֗י/ם בְּ/יַד֙ מְבַקְשֵׁ֣י נַפְשָׁ֔/ם וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/בְ/יַד עֲבָדָ֑י/ו וְ/אַחֲרֵי כֵ֛ן תִּשְׁכֹּ֥ן כִּֽ/ימֵי קֶ֖דֶם נְאֻם יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/026.yaml
  text: And I will give them into the hand of those who seek their life[a], and into the hand of Nebuchadnezzar king of Babylon, and into the hand of his servants. But afterward she will dwell as in days of old[b], declares Yahweh.
translation:
  language: ru
  text: И Я отдам их в руки тех, кто ищет их смерти[a], в руки Навуходоносора, царя Вавилона, и в руки его слуг. Но после этого Египет будет жить, как в древние дни[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тех, кто ищет их душу (жизнь)»; то есть тех, кто стремится их убить.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте глагол стоит в женском роде и относится к Египту, олицетворённому как женщина: «она будет жить (обитать)».'
    reason: translation_ambiguity
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: И Я отдам их
  rationale: В данном контексте נתן с объектным суффиксом означает передачу во власть врагов; «отдам» естественно передаёт и действие, и угрозу.
- source_word: בְיַד
  choice: в руки
  rationale: Сохранён понятный по-русски древнееврейский образ передачи кого-либо в чужую власть.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: тех, кто ищет их смерти
  rationale: Буквально оборот говорит об «ищущих их душу/жизнь», но идиоматически обозначает стремящихся их убить. В основном тексте значение выражено естественно, а буквальный образ отмечен в сноске.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Навуходоносора
  rationale: Использована устоявшаяся русская библейская форма имени, хотя еврейское написание в этом месте ближе к варианту «Навуходреццар».
- source_word: עֲבָדָיו
  choice: его слуг
  rationale: «Слуги» достаточно широко передаёт подчинённых царя, не уточняя без необходимости их должность или правовой статус.
- source_word: וְאַחֲרֵי כֵן
  choice: Но после этого
  rationale: Оборот обозначает временной переход и контекстуальный контраст между судом и последующим восстановлением.
- source_word: תִּשְׁכֹּן
  choice: Египет снова будет обитаем
  rationale: Форма женского рода соотносится с Египтом как страной. Русское «Египет» мужского рода, поэтому буквальное «она будет жить» неестественно и создаёт неясный референт; безлично-пассивная формулировка ясно выражает восстановление населённой страны.
- source_word: כִּימֵי קֶדֶם
  choice: как в прежние дни
  rationale: Естественный современный русский эквивалент, сохраняющий идею возвращения к прежнему состоянию.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передан весомый пророческий оборот, а тетраграмматон воспроизведён как личное имя «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Женский род תִּשְׁכֹּן и олицетворение Египта
  choice: Египет снова будет обитаем
  alternative: она будет жить / поселится
  rationale: В еврейском Египет осмысляется как страна женского рода, однако в русском название «Египет» грамматически мужского рода. Выбранная формулировка сохраняет смысл восстановления и не вводит неясное местоимение; «снова» передаёт возвращение к прежнему состоянию, подразумеваемое сравнением.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранён образ «в руки», но непрозрачная для современного читателя идиома «искать душу» раскрыта по смыслу. Повтор «в руки» удерживает риторику оригинала.
