  source_fidelity: Рָאִיתִי — перфект «я увидел / я видел»; «я взглянул на» возможно по смыслу, но несколько сужает прямое зрительное восприятие и добавляет направленность взгляда. Настоящее время в последующих причастных формах («дрожат», «колеблются») удачно передаёт картину, наблюдаемую в видении. «Горы» и «холмы» верно сохраняют различие הָרִים и גְּבָעוֹת. «Колеблются» приемлемо передаёт редкую форму הִתְקַלְקָלוּ как утрату устойчивости.
