base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/024.yaml
  text: I looked at the mountains[a], and behold, they were quaking, and all the hills were shaken.
translation:
  language: ru
  text: Я увидел горы — и вот они дрожат, и все холмы колеблются.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я взглянул на горы — и вот они трясутся, и все холмы шатаются».'
    reason: Лексические варианты для רָאִיתִי, רֹעֲשִׁים и הִתְקַלְקָלוּ; последняя форма допускает оттенок шатания или потери устойчивости.
lexical_decisions:
- source_word: רָאִיתִי
  choice: Я взглянул
  rationale: Форма Qal, перфект 1-го лица ед. числа от ראה. В череде видений «я взглянул» естественно передаёт направленное наблюдение и сохраняет повторяющуюся композиционную формулу.
- source_word: הֶהָרִים
  choice: на горы
  rationale: הָרִים обычно обозначает горы; перевод сохраняет отличие от последующего גבעות — «холмы».
- source_word: וְהִנֵּה
  choice: и вот
  rationale: הִנֵּה привлекает внимание к внезапно открывшейся картине; современное русское «и вот» сохраняет пророческую наглядность без архаизации.
- source_word: רֹעֲשִׁים
  choice: дрожат
  rationale: Причастие от רעשׁ описывает сильное, в том числе сейсмическое, движение. «Дрожат» ясно и естественно передаёт продолжающееся действие.
- source_word: וְכָל הַגְּבָעוֹת
  choice: и все холмы
  rationale: כָּל с существительным во множественном числе имеет собирательное значение «все», а גבעות обозначает холмы в отличие от гор.
- source_word: הִתְקַלְקָלוּ
  choice: колеблются
  rationale: Редкая форма передаёт нарушение устойчивости, шатание или метание. «Колеблются» сохраняет образ неустойчивого движения и поэтическое отличие от רֹעֲשִׁים.
