base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/003.yaml
  text: 'For thus says Yahweh to the men of Judah and to Jerusalem: Break up for yourselves unplowed ground[a], and do not sow among thorns.'
translation:
  language: ru
  text: 'Ибо так говорит Господь людям Иудеи и Иерусалиму: «Вспашите себе невозделанную землю[a] и не сейте среди терний».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «залежную землю». Еврейское слово обозначает землю, которую необходимо распахать перед посевом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, естественная для литературного библейского текста и не вводящая спорной реконструкции произношения в основной текст.
- source_word: לְאִישׁ יְהוּדָה
  choice: мужам Иудеи
  rationale: Единственное אִישׁ здесь имеет собирательное значение. «Мужам Иудеи» сохраняет мужскую семантику и согласуется с обращением к Иерусалиму.
- source_word: וְלִירוּשָׁלִַם
  choice: и Иерусалиму
  rationale: Сохраняется прямое наименование города; подразумеваемые жители не добавляются в основной текст.
- source_word: נִירוּ
  choice: распашите
  rationale: Повелительная форма обозначает обработку и взрыхление земли перед посевом; «распашите» естественно сочетается с «целиной».
- source_word: נִיר
  choice: целину
  rationale: Существительное обозначает землю, которую нужно впервые или заново обработать перед посевом. «Целина» кратко и ясно сохраняет земледельческий образ, хотя возможен оттенок залежной земли.
- source_word: לָכֶם
  choice: себе
  rationale: Передаёт дательный личной заинтересованности и рефлексивный оттенок выражения.
- source_word: וְאַל תִּזְרְעוּ
  choice: и не сейте
  rationale: Точно сохраняет земледельческое значение זרע и запретительную конструкцию.
- source_word: אֶל קוֹצִים
  choice: среди колючек
  rationale: В контексте посева предлог указывает на попадание семян в заросшее колючими растениями место. «Среди» естественно передаёт этот смысл, не устраняя образ.
theological_decisions:
- issue: Метафорический смысл земледельческих повелений
  choice: Сохранить в основном тексте прямые образы распашки, сева и колючек без пояснения их как покаяния.
  alternative: 'Передать смысл толковательно, например: «Подготовьте свои сердца и удалите греховные препятствия».'
  rationale: Еврейский текст выражает призыв посредством земледельческого образа, не раскрывая его толкование непосредственно в этом стихе. Прямая передача сохраняет образность и богословскую напряжённость контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным; сельскохозяйственная метафора сохранена без конфессионального истолкования.
