  text: וָ/אֹמַ֞ר אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה אָכֵן֩ הַשֵּׁ֨א הִשֵּׁ֜אתָ לָ/עָ֤ם הַ/זֶּה֙ וְ/לִ/ירוּשָׁלִַ֣ם לֵ/אמֹ֔ר שָׁל֖וֹם יִהְיֶ֣ה לָ/כֶ֑ם וְ/נָגְעָ֥ה חֶ֖רֶב עַד הַ/נָּֽפֶשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/010.yaml
  text: Then I said[a], “Ah, Lord Yahweh, surely you have greatly deceived this people and Jerusalem, saying[b], ‘You will have peace,’ while the sword has reached to the soul.”
translation:
  language: ru
  text: 'Тогда я сказал: «Ах, Господи Яхве! Ты поистине совершенно обманул[a] этот народ и Иерусалим, говоря: „Будет у вас мир“, — а меч достиг самой души[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совсем обманул», «сильно ввёл в заблуждение». В еврейском тексте абсолютный инфинитив поставлен рядом с личной формой того же глагола, усиливая его значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «до самой жизни» или «до горла». Еврейское слово нэфеш может означать душу, жизнь, самого человека или горло; здесь, вероятно, речь о смертельной опасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ
  choice: О
  rationale: Передаёт внезапный возглас скорби и потрясения естественным для современного русского языка образом; «увы» возможно, но звучит более книжно.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: Различает титул אֲדֹנָי и личное имя יהוה, избегая неестественного сочетания «Господь Господь».
- source_word: אָכֵן הַשֵּׁא הִשֵּׁאתָ
  choice: Неужели Ты и вправду жестоко обманул
  rationale: «И вправду» передаёт אָכֵן, а наречие «жестоко» — усиление, создаваемое сочетанием абсолютного инфинитива с личной формой того же глагола. Вопросительно-восклицательная форма естественно выражает потрясённую жалобу пророка, не ослабляя прямого обвинения.
- source_word: לָעָם הַזֶּה וְלִירוּשָׁלִַם
  choice: этот народ и Иерусалим
  rationale: Сохраняет параллельное представление народа и олицетворённого города как объектов действия.
- source_word: שָׁלוֹם יִהְיֶה לָכֶם
  choice: Будет у вас мир
  rationale: Прямая и естественная передача обещания мира, благополучия и безопасности.
- source_word: וְנָגְעָה חֶרֶב עַד הַנָּפֶשׁ
  choice: а меч уже дошёл до самой души
  rationale: «Дошёл» передаёт достигшую предела угрозу, а «до самой души» сохраняет образность и многозначность נֶפֶשׁ, которое здесь указывает на жизнь, поражённую смертельной опасностью.
theological_decisions:
- issue: Следует ли смягчать утверждение, что Бог обманул народ
  choice: 'Сохранено прямое обращение: «Ты… жестоко обманул»'
  alternative: «Ты допустил, чтобы этот народ был обманут» или «Ты ввёл в заблуждение»
  rationale: Еврейский глагол נשׁא прямо означает обман или введение в заблуждение, а усилительная конструкция делает высказывание особенно резким. Перевод сохраняет богословское напряжение пророческой жалобы и не вводит объяснение, отсутствующее в тексте.
- issue: Как передать נֶפֶשׁ в образе достигшего её меча
  choice: «до самой души» с пояснением в сноске
  alternative: «до самой жизни» или «до горла»
  rationale: Основной текст сохраняет широту еврейского образа, не сводя его заранее только к анатомическому или отвлечённому значению; сноска поясняет вероятный смысл смертельной угрозы.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохраняет резкость возгласа и контраст между обещанным миром и уже приблизившимся мечом; архаизмы и конфессионально маркированные толкования исключены.
