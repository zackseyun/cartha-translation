base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/016.yaml
  text: 'Declare it to the nations: ‘Look[a], proclaim it concerning Jerusalem: Watchers are coming from a distant land, and they raise their voice against the cities of Judah.’'
translation:
  language: ru
  text: 'Возвестите народам: «Вот, объявите об Иерусалиме: из далёкой страны идут наблюдатели[a] и возвышают голос против городов Иудеи».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осаждающие». Еврейское слово буквально обозначает тех, кто наблюдает или сторожит, но здесь, вероятно, речь идёт о вражеских силах, окружающих города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְכִּירוּ
  choice: Возвестите
  rationale: Форма породы хифиль, повелительное наклонение множественного числа, здесь призывает публично сообщить весть. «Возвестите» передаёт торжественную настоятельность без излишней архаики.
- source_word: לַגּוֹיִם
  choice: народам
  rationale: Предлог ל естественно передан дательным падежом; גּוֹיִם означает народы или нации, без позднейшего конфессионального оттенка слова «язычники».
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание и выражает срочность; «вот» естественно и точно для современного литературного русского.
- source_word: הַשְׁמִיעוּ עַל יְרוּשָׁלִַם
  choice: объявите о Иерусалиме
  rationale: Хифиль שמע передаёт оглашение или объявление, а עַל допускает значение «о, относительно». Формулировка сохраняет предмет сообщения, не опережая явную враждебность следующей части.
- source_word: נֹצְרִים
  choice: наблюдатели
  rationale: Причастие от נצר буквально обозначает тех, кто наблюдает или сторожит. В контексте это вражеские силы, возможно осаждающие город, но основной текст сохраняет еврейский образ, а контекст раскрывает угрозу.
- source_word: בָּאִים
  choice: идут
  rationale: Причастие выражает разворачивающееся или близкое действие; русский глагол настоящего времени естественно передаёт приближение.
- source_word: מֵאֶרֶץ הַמֶּרְחָק
  choice: из далёкой страны
  rationale: Сочетание буквально указывает на географически далёкую землю; единственное число сохранено.
- source_word: וַיִּתְּנוּ ... קוֹלָם
  choice: и возвышают голос
  rationale: Еврейская идиома буквально означает «дают свой голос», то есть громко взывают или кричат. «Возвышают голос» сохраняет образ и звучит понятно.
- source_word: עַל עָרֵי יְהוּדָה
  choice: против городов Иудеи
  rationale: В военном контексте עַל имеет враждебную направленность; «против» ясно передаёт эту функцию.
theological_decisions:
- issue: Характер נֹצְרִים
  choice: наблюдатели
  alternative: осаждающие
  rationale: Лексическое значение сохранено в основном тексте, а контекстуальное военное понимание отмечено в сноске, чтобы не устранять подлинную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством пророческого воззвания. Избегаются как разговорность, так и тяжёлая церковнославянская архаика. Синтаксис сохраняет последовательность повелений и образность еврейского текста.
