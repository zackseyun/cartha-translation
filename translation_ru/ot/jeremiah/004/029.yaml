  text: At the sound of the horseman and the archer[a], every city flees; they go into the thickets and climb up among the rocks. Every city is abandoned[d][c][b], and no man dwells in them.
translation:
  language: ru
  text: От шума всадника и лучника[a] разбегаются жители всех городов[b]; они уходят в заросли[c] и взбираются на скалы. Все города покинуты, и в них не живёт ни один человек[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «При шуме всадника и лучника» или «Из-за шума всадника и лучника». Еврейский предлог может указывать как на обстоятельство, так и на причину; буквально: «стреляющий из лука».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «бежит каждый город»; возможно также понимание: «разбегается весь город».'
    reason: lexical_alternative
  - marker: c
    text: 'Значение еврейского слова не вполне ясно. Возможно: «в облака», однако контекст укрытия и параллель со скалами говорят в пользу густых зарослей.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «и нет живущего в них человека».'
    reason: literal_rendering
lexical_decisions:
- source_word: מִקּוֹל
  choice: От топота... и звука
  rationale: Предлог מִן при קוֹל допускает оттенок причины или повода. В сочетании со всадником по-русски естественно конкретизировать слышимый шум как «топот», сохраняя образ внезапной паники.
- source_word: פָּרָשׁ
  choice: всадника
  rationale: Слово обозначает конного воина; «всадник» естественно и не вводит более узкое представление о регулярной кавалерии.
- source_word: וְרֹמֵה קֶשֶׁת
  choice: звука натягиваемого лука
  rationale: Буквально это «мечущего/стреляющего из лука». В контексте קוֹל русская формулировка передаёт звук готового выстрелить лучника, не создавая неестественного «звука лучника».
- source_word: בֹּרַחַת כָּל הָעִיר
  choice: разбегаются жители всех городов
  rationale: Буквально «бежит каждый/весь город». Метонимия раскрыта естественным русским выражением; дальнейшие формы множественного числа поддерживают распределительное понимание.
- source_word: בָּאוּ
  choice: они уходят
  rationale: Глагол буквально значит «приходят/входят», но здесь описывает движение бегущих к укрытиям; «уходят в» естественно передаёт ситуацию.
- source_word: בֶּעָבִים
  choice: в заросли
  rationale: Хотя форма может быть связана с «облаками», контекст наземных укрытий и параллель со скалами поддерживают значение густой растительности.
- source_word: וּבַכֵּפִים עָלוּ
  choice: и взбираются на скалы
  rationale: כֵּפִים обозначает скалы или утёсы, а עלה — движение вверх; выбранная формулировка ясно передаёт поиск труднодоступного убежища.
- source_word: עֲזוּבָה
  choice: покинуты
  rationale: Передаёт результат бегства жителей современным литературным языком.
- source_word: וְאֵין יוֹשֵׁב בָּהֵן אִישׁ
  choice: и ни в одном из них не осталось ни человека
  rationale: Смысл конструкции — полное отсутствие жителей. «Ни человека» сохраняет усиление אִישׁ и звучит естественно по-русски.
