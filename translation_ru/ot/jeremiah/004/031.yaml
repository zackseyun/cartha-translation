source:
  edition: WLC
  text: כִּי֩ ק֨וֹל כְּ/חוֹלָ֜ה שָׁמַ֗עְתִּי צָרָה֙ כְּ/מַבְכִּירָ֔ה ק֧וֹל בַּת צִיּ֛וֹן תִּתְיַפֵּ֖חַ תְּפָרֵ֣שׂ כַּפֶּ֑י/הָ אֽוֹי נָ֣א לִ֔/י כִּֽי עָיְפָ֥ה נַפְשִׁ֖/י לְ/הֹרְגִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/031.yaml
  text: 'For I have heard a sound like a woman in labor[a], distress like one giving birth to her first child— the sound of Daughter Zion gasping for breath, spreading out her hands: “Woe is me[c][b], for my life is faint before killers.”'
translation:
  language: ru
  text: 'Ибо я слышал голос, как у роженицы, муку, как у первородящей, — голос дочери Сиона: она тяжело дышит, простирает руки: «Горе мне! Жизнь моя изнемогает перед убийцами».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душа моя изнемогает перед убийцами». Еврейское слово נֶפֶשׁ может означать «душа», «сам человек» или «жизнь»; предлог перед словом «убийцы» допускает также смысл «из-за» или «во власти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: голос
  rationale: Еврейское слово может означать голос, звук или крик. «Голос» естественно применимо и к первоначально не названной роженице, и к персонифицированной дочери Сиона, сохраняя повтор исходного текста.
- source_word: כְחוֹלָה
  choice: словно крик роженицы
  rationale: Форма связана с корнем, обозначающим корчи и родовые муки; в данном параллелизме речь именно о роженице. Добавление «крик» по смыслу раскрывает сочетание с קוֹל.
- source_word: צָרָה
  choice: стон
  rationale: Слово обозначает бедствие, тесноту и мучительную боль. В русском поэтическом контексте «стон» естественно передаёт слышимое проявление страдания, хотя конкретизирует образ.
- source_word: כְמַבְכִּירָה
  choice: словно у женщины, рождающей первенца
  rationale: Причастие указывает на первые роды или рождение первенца и подчёркивает особенно сильные родовые муки.
- source_word: בַּת־צִיּוֹן
  choice: дочь Сиона
  rationale: Сохранена традиционная пророческая персонификация Иерусалима/Сиона без её аллегорического истолкования.
- source_word: תִּתְיַפֵּחַ
  choice: она задыхается
  rationale: Глагол передаёт тяжёлое, прерывистое дыхание; «задыхается» кратко и наглядно выражает телесное изнеможение.
- source_word: תְּפָרֵשׂ כַּפֶּיהָ
  choice: простирает руки
  rationale: Передан жест отчаяния, мольбы или беспомощности без уточнения его единственного значения.
- source_word: אוֹי נָא לִי
  choice: Горе мне!
  rationale: Естественное и торжественное русское восклицание плача; частица נָא усиливает настойчивость, которую здесь передаёт восклицательная форма.
- source_word: עָיְפָה נַפְשִׁי
  choice: Жизнь моя изнемогает
  rationale: נפש в контексте смертельной угрозы обозначает живую личность или жизнь, а не обязательно отдельную нематериальную «душу»; глагол выражает истощение и ослабление.
- source_word: לְהֹרְגִים
  choice: перед убийцами
  rationale: Причастие обозначает убивающих людей, а предлог допускает отношение «перед, в присутствии, во власти». Формулировка сохраняет некоторую неоднозначность связи.
theological_decisions:
- issue: Персонификация Сиона
  choice: дочь Сиона как персонифицированный Иерусалим/Сион
  alternative: дочь Сионова
  rationale: Современная форма сохраняет поэтическую персонификацию и не добавляет богословской аллегории.
- issue: Значение נֶפֶשׁ при смертельной угрозе
  choice: жизнь моя
  alternative: душа моя
  rationale: «Жизнь» передаёт здесь находящуюся под угрозой живую личность и не навязывает тексту позднейшего антропологического разграничения души и тела.
translation_notes:
  register: Современный литературный русский с достоинством пророческого плача. Сохранены повтор слова «голос», образ первых родов, персонификация Сиона и напряжённая неоднозначность заключительной фразы; синтаксис сделан ясным для обычного читателя.
