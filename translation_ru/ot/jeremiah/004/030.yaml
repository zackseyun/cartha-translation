  text: ו/אתי שָׁד֜וּד מַֽה תַּעֲשִׂ֗י כִּֽי תִלְבְּשִׁ֨י שָׁנִ֜י כִּי תַעְדִּ֣י עֲדִי זָהָ֗ב כִּֽי תִקְרְעִ֤י בַ/פּוּךְ֙ עֵינַ֔יִ/ךְ לַ/שָּׁ֖וְא תִּתְיַפִּ֑י מָאֲסוּ בָ֥/ךְ עֹגְבִ֖ים נַפְשֵׁ֥/ךְ יְבַקֵּֽשׁוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/030.yaml
  text: And you[a], devastated one, what will you do? Though you dress in scarlet, though you adorn yourself with ornaments of gold, though you enlarge your eyes with paint, you beautify yourself in vain. Your lovers despise you[b]; they seek your life.
translation:
  language: ru
  text: А ты, разорённая[a], что будешь делать? Хотя ты наряжаешься в алые одежды, хотя украшаешь себя золотыми украшениями, хотя подводкой делаешь глаза больше[b], напрасно ты себя украшаешь. Любовники твои отвергли тебя; они ищут твоей смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разграбленная», «опустошённая». В еврейском тексте это обращение к лицу женского рода — вероятно, к олицетворённому Иерусалиму или Сиону.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «раздираешь глаза пухом». «Пух» — тёмное косметическое средство для глаз, подобное сурьме или кайалу; им глаза зрительно увеличивали и подчёркивали.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׁדוּד
  choice: разорённая
  rationale: Страдательная форма от שׁדד обозначает женщину, подвергшуюся разорению или опустошению. «Разорённая» естественно звучит как обращение и сохраняет как разрушение, так и разграбление, не называя прямо олицетворённый город.
- source_word: מַה תַּעֲשִׂי
  choice: что будешь делать?
  rationale: Имперфект второго лица женского рода передан будущим временем в риторическом вопросе о надвигающейся беде.
- source_word: שָׁנִי
  choice: багряница
  rationale: Слово обозначает ткань или одежду алого цвета. «Багряница» здесь кратко и естественно передаёт дорогую яркую одежду, хотя более буквальное «алое» также возможно.
- source_word: תַעְדִּי עֲדִי זָהָב
  choice: украшаешь себя золотыми украшениями
  rationale: Сохранены и возвратное значение глагола «украшать себя», и существительное со значением украшения.
- source_word: תִקְרְעִי בַפּוּךְ עֵינַיִךְ
  choice: подводкой делаешь глаза больше
  rationale: Буквальный образ «раздираешь/расширяешь глаза сурьмой» обозначает косметическое зрительное увеличение и подчёркивание глаз. Передан смысл идиомы без вводящего в заблуждение буквального насилия.
- source_word: פּוּךְ
  choice: подводка
  rationale: Речь о тёмном косметическом средстве для глаз, близком к сурьме или кайалу. «Подводка» понятно современному читателю; культурная конкретика отмечена в сноске.
- source_word: לַשָּׁוְא תִּתְיַפִּי
  choice: напрасно ты стараешься стать красивой
  rationale: Передана тщетность возвратного действия. Русская конструкция естественнее буквального «украшаешь себя напрасно» в данном контексте.
- source_word: מָאֲסוּ בָךְ עֹגְבִים
  choice: любовники твои отвергли тебя
  rationale: עֹגְבִים — любовники или воздыхатели в пророческом образе неверных союзов; «любовники» сохраняет интимную и отрицательную окраску. מָאַס передано как «отвергли», что точнее описывает отказ и отвращение, чем только внутреннее презрение.
- source_word: נַפְשֵׁךְ יְבַקֵּשׁוּ
  choice: они ищут твоей смерти
  rationale: Идиома буквально означает «ищут твоей жизни/души», то есть намереваются лишить жизни. Русское «ищут твоей смерти» ясно передаёт угрозу убийства и сохраняет образную формулу.
theological_decisions:
- issue: Олицетворение Иерусалима/Сиона в женском образе
  choice: Сохранить обращение в женском роде, не добавляя имени Иерусалима или Сиона в основной текст
  alternative: Прямо вставить «Иерусалим» или «дочь Сиона»
  rationale: Грамматика однозначно указывает на адресата женского рода, но сам стих его не называет. Такая передача сохраняет олицетворение и не устраняет контекстуальную неоднозначность.
- issue: Образ любовников
  choice: Сохранить метафорическое «любовники» без поясняющего отождествления
  alternative: Передать как «союзники» или прямо назвать иностранные державы
  rationale: Пророческая метафора намеренно соединяет политическую неверность и интимный образ. Замена на «союзников» сняла бы часть богословского напряжения и образности.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Женский род последовательно сохраняет олицетворение. Синтаксический повтор «хотя» передаёт трёхчастное כִּי и нарастание тщетных попыток приукрасить себя; финал сделан прямым и угрожающим.
