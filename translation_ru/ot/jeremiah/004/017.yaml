  text: כְּ/שֹׁמְרֵ֣י שָׂדַ֔י הָי֥וּ עָלֶ֖י/הָ מִ/סָּבִ֑יב כִּי אֹתִ֥/י מָרָ֖תָה נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/017.yaml
  text: Like watchmen of a field[a], they are against her all around, because she has rebelled against me, declares Yahweh.
translation:
  language: ru
  text: Подобно стражам поля[a], они окружают её со всех сторон, потому что она восстала против Меня, — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Подобно стражам открытой местности»; также возможно: «Подобно тем, кто сторожит поле». Образ стражей, расположившихся вокруг поля, здесь относится к врагам, окружившим город.'
    reason: Лексическое значение שֹׁמְרֵי שָׂדַי допускает варианты «стражи поля», «стражи открытой местности» или описательное «те, кто сторожит поле».
lexical_decisions:
- source_word: כְּשֹׁמְרֵי
  choice: Подобно сторожам
  rationale: Предлог כְּ выражает сравнение, а причастная форма שֹׁמְרֵי обозначает тех, кто сторожит или охраняет. «Сторожа» естественно передаёт образ бдительных людей и соответствует картине осады.
- source_word: שָׂדַי
  choice: поля
  rationale: שָׂדֶה обычно означает «поле». Сохранено единственное число и образ сторожей, охраняющих поле.
- source_word: הָיוּ עָלֶיהָ מִסָּבִיב
  choice: они стоят против неё со всех сторон
  rationale: Формально הָיוּ — перфект «были/стали», но в пророческой речи действие представлено как уже наличное и зримое. «Стоят против неё» сохраняет враждебную направленность עָלֶיהָ, а «со всех сторон» передаёт окружение, выраженное מִסָּבִיב.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину суда; «потому что» ясно и естественно передаёт причинное значение.
- source_word: אֹתִי מָרָתָה
  choice: она восстала против Меня
  rationale: מָרָה обозначает неповиновение, мятеж или открытое противление. «Восстала против» сохраняет силу выражения и естественное управление в русском языке.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Пророческая формула обозначает торжественное божественное изречение. «Возвещает» передаёт её весомость, а имя יהוה транслитерируется как «Яхве».
theological_decisions:
- issue: Референт местоимения женского рода עָלֶיהָ / глагольной формы מָרָתָה
  choice: Сохранено местоимение «она/неё» без пояснения в основном тексте
  alternative: Иерусалим; дочь Сиона; Иудея или земля
  rationale: В еврейском тексте непосредственный референт в самом стихе не назван. Местоимение сохраняет олицетворение и не устраняет намеренную контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; образ поля и женское местоимение сохранены без разъясняющей вставки.
