  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה שְׁמָמָ֥ה תִהְיֶ֖ה כָּל הָ/אָ֑רֶץ וְ/כָלָ֖ה לֹ֥א אֶעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/027.yaml
  text: 'For thus says Yahweh: The whole land will be a desolation[b][a], yet I will not make a full end.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве: вся страна[a] будет разорена, но Я не уничтожу её до конца[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вся земля», то есть «весь мир». Еврейское אֶרֶץ может означать как страну или землю определённого народа, так и землю вообще. Здесь контекст прежде всего указывает на Иуду, хотя образы в окружающем отрывке имеют и космический размах.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «но полного конца не сделаю». Или: «но не положу ей полного конца». Еврейское выражение сохраняет напряжение между опустошительным судом и отказом Яхве от окончательного истребления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предшествующего видения; «ибо» сохраняет причинно-пояснительную связь и возвышенный, но понятный пророческий регистр.
- source_word: כֹה אָמַר
  choice: так говорит
  rationale: Устойчивая формула пророческой речи; настоящее время естественно звучит по-русски и представляет последующие слова как непосредственное изречение Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: שְׁמָמָה תִהְיֶה
  choice: станет пустыней
  rationale: Сохраняет именную образность שְׁמָמָה и будущий переход земли в состояние запустения. Русское «станет пустыней» естественнее буквального «будет опустошением».
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: В ближайшем контексте речь идёт прежде всего о земле Иуды; вместе с тем русское «земля» сохраняет возможность более широкого, космического отзвука.
- source_word: וְכָלָה לֹא אֶעֱשֶׂה
  choice: но полного уничтожения Я не совершу
  rationale: Передаёт כָלָה как окончательное, всецелое истребление, а עשה — простым глаголом действия. Формулировка сохраняет напряжение между всеобщим запустением и отказом от полного уничтожения.
theological_decisions:
- issue: Масштаб הָאָרֶץ
  choice: земля
  alternative: вся земля в значении «весь мир»
  rationale: Контекст сосредоточен на суде над Иудой, поэтому перевод не утверждает однозначно глобальный масштаб. Однако многозначность отмечена в сноске из-за космической образности окружающего отрывка.
- issue: Смысл וְכָלָה לֹא אֶעֱשֶׂה
  choice: но полного уничтожения Я не совершу
  alternative: но не положу ей полного конца
  rationale: Основной текст ясно выражает ограничение суда, не превращая его в полное истребление. Альтернатива сохраняет более буквальную идиому «положить конец» и приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Порядок слов в заключительной части слегка маркирован, чтобы подчеркнуть именно неполноту уничтожения, но остаётся естественным и понятным.
