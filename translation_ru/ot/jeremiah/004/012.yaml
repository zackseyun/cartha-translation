source:
  edition: WLC
  text: ר֧וּחַ מָלֵ֛א מֵ/אֵ֖לֶּה יָ֣בוֹא לִ֑/י עַתָּ֕ה גַּם אֲנִ֛י אֲדַבֵּ֥ר מִשְׁפָּטִ֖ים אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/012.yaml
  text: A wind too full for these will come for me[b][a]; now I myself will also speak judgments against them.
translation:
  language: ru
  text: Ветер, слишком сильный для этого, придёт ко Мне[a]; теперь и Я произнесу над ними приговоры[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ветер полный/сильный от этих придёт ко Мне». Сжатое еврейское выражение допускает понимание «слишком сильный, чем эти», «от этих» или «для этих [целей]»; в контексте имеются в виду действия, названные в предыдущем стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «теперь и Я изреку над ними суды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: ветер
  rationale: В ближайшем контексте речь идёт о ветре с пустынных высот; образ имеет метеорологический характер и служит образом грядущего суда.
- source_word: מָלֵא
  choice: слишком сильный
  rationale: Буквально прилагательное означает «полный», но применительно к ветру и в противопоставлении веянию и очищению в предыдущем стихе передаёт чрезмерную силу.
- source_word: מֵאֵלֶּה
  choice: для этого
  rationale: Сжатое сочетание с предлогом מִן допускает оттенки сравнения, источника или назначения. В основном тексте оно связано с занятиями, упомянутыми в предыдущем стихе, а неоднозначность отмечена в сноске.
- source_word: יָבוֹא לִי
  choice: придёт ко Мне
  rationale: 'Передаёт буквальное направление «к/для Меня», не устраняя возможный смысл: ветер приходит в распоряжение Господа или по Его повелению.'
- source_word: עַתָּה
  choice: теперь
  rationale: Прямой и естественный эквивалент временного наречия.
- source_word: גַּם אֲנִי
  choice: и Я
  rationale: Сочетание частицы и самостоятельного местоимения подчёркивает самого говорящего; русское ударное «Я» сохраняет эту эмфазу без тяжеловесности.
- source_word: אֲדַבֵּר מִשְׁפָּטִים
  choice: произнесу … приговоры
  rationale: Глагол буквально означает «говорить», а множественное מִשְׁפָּטִים здесь обозначает судебные решения. «Произнесу приговоры» естественно передаёт всю конструкцию по-русски.
- source_word: אוֹתָם
  choice: над ними
  rationale: Формально это показатель прямого дополнения с местоименным суффиксом, но при русском «произнести приговор» судебная направленность естественно выражается сочетанием «над ними».
theological_decisions:
- issue: Кто говорит в первом лице и что означает «ко Мне»
  choice: 'Говорящий — Господь: губительный ветер приходит к Нему, то есть в Его распоряжение или по Его воле, и Он объявляет народу приговоры.'
  alternative: Первое лицо может относиться к пророку; кроме того, «ко Мне» можно понимать лишь как указание направления, не подчёркивая волю или действие Господа.
  rationale: Контекст продолжает речь Господа о суде, а формы первого лица естественно относятся к Нему. При этом перевод не добавляет отсутствующих в еврейском тексте слов вроде «по Моему повелению» и сохраняет компактность выражения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Образ ветра сохранён, судебная формула передана естественно; неоднозначность компактного еврейского оборота вынесена в сноску.
