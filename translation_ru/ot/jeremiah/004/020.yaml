source:
  edition: WLC
  text: שֶׁ֤בֶר עַל שֶׁ֨בֶר֙ נִקְרָ֔א כִּ֥י שֻׁדְּדָ֖ה כָּל הָ/אָ֑רֶץ פִּתְאֹם֙ שֻׁדְּד֣וּ אֹהָלַ֔/י רֶ֖גַע יְרִיעֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/020.yaml
  text: Disaster upon disaster is proclaimed[a], for the whole land is devastated. Suddenly my tents are devastated[b], my curtains in a moment.
translation:
  language: ru
  text: Беда за бедой возвещается, ибо разорена вся страна[a]. Внезапно разорены мои шатры, в одно мгновение — мои шатровые полотнища[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское אֶרֶץ может означать «земля», «страна» или «земной мир». Здесь контекст прежде всего указывает на страну, подвергаемую суду; возможно и более широкое значение «вся земля».
    reason: alternative_reading
  - marker: b
    text: «Шатровые полотнища» — тканевые полотна, образующие покрытие и стены шатра; образ описывает внезапное разрушение жилища.
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר עַל שֶׁבֶר
  choice: Беда за бедой
  rationale: Повтор с עַל изображает череду нагромождающихся бедствий; естественная русская формула сохраняет и повтор, и нарастающий характер несчастий.
- source_word: נִקְרָא
  choice: возвещается
  rationale: Нифаль от קרא здесь передаёт публично раздающееся сообщение или возглас; безлично-пассивное «возвещается» сохраняет эту форму и поэтическую торжественность.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину провозглашаемой беды; причинная связь выражена явно и естественно для современного русского языка.
- source_word: שֻׁדְּדָה / שֻׁדְּדוּ
  choice: разорена / разорены
  rationale: Формы שׁדד обозначают насильственное опустошение или разорение. «Разорены» подходит и земле, и шатрам, не сводя смысл только к разграблению имущества.
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: אֶרֶץ может обозначать страну, землю или всю землю; в контексте суда над Иудеей русское «земля» естественно допускает территориальное понимание, не устраняя лексическую многозначность.
- source_word: פִּתְאֹם
  choice: внезапно
  rationale: Точно передаёт неожиданность и резкость наступившего разорения.
- source_word: אֹהָלַי
  choice: шатры мои
  rationale: Сохранён буквальный образ жилища. Постпозиция местоимения поддерживает поэтический, но понятный современному читателю строй.
- source_word: רֶגַע
  choice: в одно мгновение
  rationale: Передаёт чрезвычайную быстроту события и естественно сочетается с параллельным «внезапно».
- source_word: יְרִיעֹתַי
  choice: полотнища мои
  rationale: יְרִיעָה здесь означает полотнища, образующие покрытие или стены шатра. Выбор сохраняет материальный образ точнее, чем общее «занавеси».
theological_decisions:
- issue: Объём значения הָאָרֶץ
  choice: вся земля
  alternative: вся страна; вся Земля
  rationale: Ближайший контекст указывает прежде всего на землю Иудеи, однако еврейское слово сохраняет потенциально более широкий смысл. Основной текст не уточняет «Иудея», а сноска отмечает возможные значения.
- issue: Образ «моих шатров»
  choice: сохранить первое лицо и буквальный образ
  alternative: истолковать как жилища народа или страны
  rationale: Говорящий и точный референт образа допускают обсуждение, поэтому перевод не отождествляет «шатры» с конкретной богословской или национальной сущностью.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Повтор глагола «разорены» воспроизводит повтор еврейского שׁדד, а тире во второй половине подчёркивает параллелизм и стремительность бедствия.
