  naturalness: «Шатры мои» и «полотнища мои» допустимы в поэтическом регистре, но постпозиция обоих притяжательных местоимений несколько стилизована. «Мои шатры» и «мои шатровые полотнища» звучат естественнее и при этом сохраняют образ.
  terminology: «Беда за бедой», «возвещается», «разорена», «шатры» и «полотнища» удачно передают лексику и поэтический строй. «Страна» в основном тексте конкретизирует контекстуально предпочтительное значение הָאָרֶץ, а сноска сохраняет лексическую неоднозначность.
