id: JER.4.1
reference: Jeremiah 4:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִם תָּשׁ֨וּב יִשְׂרָאֵ֧ל נְאֻם יְהוָ֛ה אֵלַ֖/י תָּשׁ֑וּב וְ/אִם תָּסִ֧יר שִׁקּוּצֶ֛י/ךָ מִ/פָּנַ֖/י וְ/לֹ֥א תָנֽוּד־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/001.yaml
  text: If you return[a], O Israel, declares Yahweh, to me you should return; if you remove your detestable things from before me and do not wander about[c][b],
translation:
  language: ru
  text: Если ты возвратишься[a], Израиль, — говорит Яхве, — ко Мне возвратись; и если удалишь из Моего присутствия свои мерзости[b] и не будешь блуждать[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте глагол «возвратиться» повторён: буквально возможна передача «Если ты возвратишься, Израиль… то возвратишься ко Мне». Здесь второе употребление передано как призыв: «ко Мне возвратись».'
    reason: alternative_reading
  - marker: b
    text: «Мерзости» — то, что вызывает отвращение; в данном контексте речь особенно может идти об идолах и связанных с ними культовых предметах.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «и не будешь колебаться», «и не будешь скитаться». Еврейский глагол может обозначать блуждание, неустойчивость или уклонение; возможно также понимание результата: «и не будешь изгнан».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תָּשׁוּב
  choice: Если ты возвратишься
  rationale: Условное אִם передано как «если», а שוב — широким по смыслу «возвратиться», сохраняющим образ возвращения к Богу и не сводящим его только к внутреннему раскаянию.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Имя употреблено как прямое обращение; русская пунктуация ясно передаёт звательный смысл без архаического «о».
- source_word: נְאֻם יְהוָה
  choice: говорит Яхве
  rationale: Естественная современная передача торжественной пророческой формулы; личное имя יהוה передано как «Яхве».
- source_word: אֵלַי תָּשׁוּב
  choice: ко Мне возвратись
  rationale: Сохранены и направление «ко Мне», и повтор глагола שוב. Повелительная форма естественно передаёт призыв, хотя грамматическую неоднозначность повторной формы следует отметить.
- source_word: תָּסִיר
  choice: удалишь
  rationale: Каузативная форма означает убрать, устранить; «удалишь» сочетается с образом удаления чего-либо от Божьего лица.
- source_word: שִׁקּוּצֶיךָ
  choice: свои мерзости
  rationale: Слово выражает сильное отвращение и часто обозначает отвратительные культовые предметы, особенно идолов; «мерзости» сохраняет широту обозначения.
- source_word: מִפָּנַי
  choice: от Моего лица
  rationale: Сохранён буквальный пространственно-личностный образ еврейского выражения «от моего лица», то есть из Божьего присутствия.
- source_word: וְלֹא תָנוּד
  choice: и не будешь блуждать
  rationale: נוד может обозначать блуждание, скитание или неустойчивость; «блуждать» сохраняет как пространственный, так и переносный оттенок уклонения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Сила повторения שוב
  choice: «Если ты возвратишься… ко Мне возвратись»
  alternative: «Если ты возвратишься… то возвратишься ко Мне»
  rationale: Выбранный вариант сохраняет оба употребления глагола и передаёт увещевательный характер обращения, не скрывая в сноске возможного изъявительного понимания второй формы.
- issue: Значение וְלֹא תָנוּד
  choice: «и не будешь блуждать» как продолжение условия и призыва
  alternative: «и не поколеблешься»; «и не будешь изгнан»
  rationale: Форма допускает оттенки блуждания и неустойчивости, а в некоторых толкованиях — следствие возвращения. Основной текст не вводит более узкий богословский смысл.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Обращение оформлено без архаического «о»; повтор «возвратишься — возвратись» намеренно сохранён. Заглавные буквы в местоимениях «Мне», «Моего» служат принятому русскому благоговейному оформлению прямой Божьей речи.
