source:
  edition: WLC
  text: הִמֹּ֣לוּ לַ/יהֹוָ֗ה וְ/הָסִ֨רוּ֙ עָרְל֣וֹת לְבַבְ/כֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מַעַלְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/004.yaml
  text: Circumcise yourselves to Yahweh[a], and remove the foreskins of your hearts, men of Judah and inhabitants of Jerusalem, lest my wrath go out like fire and burn, with no one to quench it[b], because of the evil of your deeds.
translation:
  language: ru
  text: Обрежьтесь для Яхве и удалите крайнюю плоть ваших сердец[a], мужи Иудеи и жители Иерусалима, чтобы Мой гнев не вырвался, словно огонь, и не запылал так, что некому будет его погасить, из-за зла ваших дел[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «удалите крайнюю плоть ваших сердец» — образ внутренней верности завету и покаяния.'
    reason: cultural_note
  - marker: b
    text: 'Или более буквально: «Моя ярость выйдет, как огонь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִמֹּלוּ
  choice: Обрежьтесь
  rationale: Возвратная форма естественно передаёт повелительное значение нифаля и сохраняет образ обрезания, не заменяя его толкованием.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל выражает направленность или посвящение; «для Яхве» сохраняет эту заветную ориентацию.
- source_word: וְהָסִרוּ עָרְלוֹת לְבַבְכֶם
  choice: и удалите крайнюю плоть ваших сердец
  rationale: Сохранён конкретный телесный образ, метафорически отнесённый к внутренней жизни; множественное «сердец» отражает обращение ко многим людям.
- source_word: אִישׁ יְהוּדָה
  choice: мужи Иудеи
  rationale: Единственное число имеет собирательно-распределительное значение. «Мужи Иудеи» сохраняет мужскую форму и соответствует торжественному пророческому регистру.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: и жители Иерусалима
  rationale: Естественная современная передача субстантивированного причастия со значением постоянных жителей.
- source_word: פֶּן
  choice: иначе
  rationale: Ясно вводит угрожающее последствие и звучит естественнее в современном русском, чем архаичное «дабы не».
- source_word: תֵּצֵא כָאֵשׁ חֲמָתִי
  choice: Мой гнев вырвется, словно огонь
  rationale: «Гнев» передаёт חֵמָה в контексте суда, а «вырвется» естественно выражает внезапный выход огня, сохраняя силу образа.
- source_word: וּבָעֲרָה
  choice: и запылает
  rationale: Глагол продолжает образ огня; «запылает» передаёт начало и развитие горения без добавления прямо не названного уничтожения.
- source_word: וְאֵין מְכַבֶּה
  choice: и некому будет его погасить
  rationale: Передаёт отсутствие того, кто мог бы потушить огонь, не утверждая отдельно невозможность как абстрактное качество.
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיכֶם
  choice: из-за зла ваших дел
  rationale: מִפְּנֵי здесь обозначает причину; перевод сохраняет как нравственную оценку, так и указание на конкретные поступки.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно употреблено личное заветное имя; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Метафора обрезания сердца
  choice: Сохранить буквальный образ в основном тексте
  alternative: очистите сердца / раскайтесь всем сердцем
  rationale: Перенесение знака завета на сердце составляет смысловой и богословский центр призыва; разъясняющая замена преждевременно устранила бы образ и его напряжение.
- issue: Мужская форма אִישׁ יְהוּדָה
  choice: мужи Иудеи
  alternative: народ Иудеи / жители Иудеи
  rationale: Так сохраняется грамматически мужское обращение, тогда как нейтрализация стирала бы форму исходного текста.
- issue: Образ выхода гнева как огня
  choice: Мой гнев вырвется, словно огонь
  alternative: Моя ярость выйдет, как огонь
  rationale: Основной перевод естественен по-русски и сохраняет сравнение; примечание отмечает более формальную лексическую возможность.
translation_notes:
  register: Современный литературный русский с возвышенным пророческим звучанием. Архаизмы сведены к минимуму; «мужи Иудеи» сохранено ради мужской формы обращения и торжественного регистра. Все примечания поставлены непосредственно после выражений, которые они поясняют.
