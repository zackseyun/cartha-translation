source:
  edition: WLC
  text: הִנֵּ֣ה כַּ/עֲנָנִ֣ים יַעֲלֶ֗ה וְ/כַ/סּוּפָה֙ מַרְכְּבוֹתָ֔י/ו קַלּ֥וּ מִ/נְּשָׁרִ֖ים סוּסָ֑י/ו א֥וֹי לָ֖/נוּ כִּ֥י שֻׁדָּֽדְנוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/013.yaml
  text: Look[a], he comes up like clouds, and his chariots are like the whirlwind; his horses are swifter than eagles. Woe to us, for we are ruined!
translation:
  language: ru
  text: 'Вот, он надвигается, словно тучи,

    и колесницы его — как вихрь;

    кони его быстрее орлов[a].

    Горе нам! Мы разорены!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грифов». Еврейское נְשָׁרִים может обозначать крупных хищных птиц или птиц, питающихся падалью; традиционный перевод здесь — «орлов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт срочное указание на внезапно возникшую угрозу естественным и современным русским возгласом.
- source_word: כַּעֲנָנִים
  choice: словно тучи
  rationale: Сохраняет сравнительную частицу и множественное число; «тучи» естественно передают образ надвигающейся массы и угрозы.
- source_word: יַעֲלֶה
  choice: он надвигается
  rationale: Глагол буквально обозначает движение вверх или приближение; в данном военном контексте «надвигается» ясно передаёт приближение захватчика и естественно сочетается с образом туч.
- source_word: וְכַסּוּפָה
  choice: и ... как вихрь
  rationale: סוּפָה обозначает бурю или вихрь; «вихрь» сохраняет стремительность и разрушительную силу сравнения.
- source_word: מַרְכְּבוֹתָיו
  choice: колесницы его
  rationale: Прямая передача существительного с притяжательным суффиксом; военное значение ясно из контекста.
- source_word: קַלּוּ
  choice: быстрее
  rationale: В сочетании с сравнительной конструкцией מן форма выражает превосходство в скорости.
- source_word: מִנְּשָׁרִים
  choice: орлов
  rationale: Традиционная и контекстуально уместная передача названия крупных хищных или питающихся падалью птиц; возможное значение «грифы» отмечено в сноске.
- source_word: סוּסָיו
  choice: кони его
  rationale: Прямая передача слова и притяжательного суффикса; «кони» соответствует возвышенному поэтическому регистру.
- source_word: אוֹי לָנוּ
  choice: Горе нам!
  rationale: Сохраняет силу общего возгласа скорби и ужаса перед бедствием.
- source_word: כִּי שֻׁדָּדְנוּ
  choice: Мы разорены!
  rationale: В русском отдельное восклицание естественно выражает основание плача; «разорены» передаёт результат насильственного опустошения, не усиливая его до полного уничтожения.
theological_decisions:
- issue: Кого обозначает местоимение «он»
  choice: Сохранить не названного в стихе деятеля как «он»
  alternative: 'Уточнить: «враг» или «захватчик»'
  rationale: Еврейский текст не называет деятеля в самом стихе; добавление конкретного обозначения устранило бы сохраняемую текстом контекстуальную недосказанность.
translation_notes:
  register: Современный литературный русский с сохранением пророческой образности и ритмичной трёхчастной картины наступления. Инверсия «колесницы его», «кони его» придаёт строкам умеренно возвышенный библейский тон, оставаясь понятной современному читателю.
