source:
  edition: WLC
  text: וְ/נִשְׁבַּ֨עְתָּ֙ חַי יְהוָ֔ה בֶּ/אֱמֶ֖ת בְּ/מִשְׁפָּ֣ט וּ/בִ/צְדָקָ֑ה וְ/הִתְבָּ֥רְכוּ ב֛/וֹ גּוֹיִ֖ם וּ/ב֥/וֹ יִתְהַלָּֽלוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/002.yaml
  text: and if you swear[a], ‘As Yahweh lives,’ in truth, in justice, and in righteousness, then nations will bless themselves in him[c][b], and in him they will boast.
translation:
  language: ru
  text: 'И если будешь клясться: «Жив Яхве!»[a] — искренне, справедливо и праведно, тогда народы будут благословлять себя в нём[b][c] и в нём будут хвалиться.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейская формула клятвы: «Как жив Яхве!»'
    reason: cultural_note
  - marker: b
    text: 'Местоимение «нём» допускает разные толкования: оно может относиться к восстановленному Израилю или Иудее; некоторые относят его к Яхве.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «тогда народы будут благословлены в нём». Древнееврейский глагол можно понимать возвратно («будут благословлять себя») либо, что здесь менее вероятно, в значении, близком к страдательному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁבַּעְתָּ
  choice: и если будешь клясться
  rationale: Перфект с союзом וְ продолжает условную мысль предыдущего стиха; условная конструкция по-русски передаёт эту зависимость яснее, чем простое будущее.
- source_word: חַי יְהוָה
  choice: «Жив Яхве!»
  rationale: Краткая русская формула сохраняет форму древнееврейской клятвы и личное имя Бога.
- source_word: בֶּאֱמֶת
  choice: в истине
  rationale: Существительное указывает на истинность и искренность клятвы; предложная конструкция сохраняет параллелизм трёх характеристик.
- source_word: בְּמִשְׁפָּט
  choice: в справедливости
  rationale: מִשְׁפָּט здесь обозначает справедливый, должный порядок; выбор отличает его от следующего צְדָקָה.
- source_word: וּבִצְדָקָה
  choice: и в праведности
  rationale: Передаёт нравственную правоту и сохраняет традиционно узнаваемое различие между справедливостью и праведностью.
- source_word: וְהִתְבָּרְכוּ
  choice: тогда … будут благословлять себя
  rationale: Возвратная форма Hitpael передана возвратно, без сведения её к однозначному пассиву; условное следствие выражено словом «тогда».
- source_word: בּוֹ
  choice: в нём
  rationale: Буквально сохраняет предлог בְּ и местоимение мужского рода, не называя спорный референт.
- source_word: גּוֹיִם
  choice: народы
  rationale: Нейтральное и обычное обозначение народов вне Израиля в пророческом контексте.
- source_word: יִתְהַלָּלוּ
  choice: будут хвалиться
  rationale: Возвратная форма הלל выражает похвалу или гордость, основанную на ком-либо; «хвалиться» ясно передаёт это значение.
theological_decisions:
- issue: К кому относится местоимение «в нём»
  choice: Местоимение оставлено без уточнения референта.
  alternative: «в Яхве» или «в восстановленном Израиле/Иудее»
  rationale: В древнееврейском тексте стоит местоимение мужского рода единственного числа без прямо названного в этой части стиха существительного. Контекст допускает разные соотнесения, поэтому перевод не устраняет неоднозначность.
- issue: Значение возвратной формы וְהִתְבָּרְכוּ
  choice: «будут благословлять себя»
  alternative: «будут благословлены»
  rationale: Hitpael естественно допускает возвратное значение, но в формулах о благословении народов возможен и близкий к пассивному смысл; основной текст сохраняет морфологически более прямое чтение, а альтернативу отмечает сноска.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Трёхчастный ряд «в истине, в справедливости и в праведности» намеренно сохраняет синтаксический параллелизм оригинала. Повтор «в нём» также сохранён ради риторической структуры и смысловой неоднозначности древнееврейского текста.
