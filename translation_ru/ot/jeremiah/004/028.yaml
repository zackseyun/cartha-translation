source:
  edition: WLC
  text: עַל זֹאת֙ תֶּאֱבַ֣ל הָ/אָ֔רֶץ וְ/קָדְר֥וּ הַ/שָּׁמַ֖יִם מִ/מָּ֑עַל עַ֤ל כִּי דִבַּ֨רְתִּי֙ זַמֹּ֔תִי וְ/לֹ֥א נִחַ֖מְתִּי וְ/לֹא אָשׁ֥וּב מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/028.yaml
  text: Because of this the earth will mourn[a], and the heavens above will grow dark, because I have spoken, I have purposed, and I have not relented[c][b], nor will I turn back from it.
translation:
  language: ru
  text: Из-за этого земля будет скорбеть[a], и небеса в вышине помрачатся, ибо Я сказал, Я решил[b], не изменил Своего решения[c] и не отступлю от этого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страна будет скорбеть». Еврейское слово אֶרֶץ может означать и землю вообще, и конкретную страну; параллель с небесами поддерживает здесь более широкий смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «замыслил», «положил».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Я не отступил»; «Я не передумал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: Из-за этого
  rationale: Передаёт причинное значение сочетания и естественно связывает космическую скорбь с объявленным судом.
- source_word: תֶּאֱבַל
  choice: будет скорбеть
  rationale: Глагол обозначает скорбь или плач; выбранная форма сохраняет олицетворение земли и звучит естественно по-русски.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Слово может означать как землю вообще, так и страну. Параллель с небесами поддерживает более широкий смысл, но неоднозначность отмечена в сноске.
- source_word: וְקָדְרוּ
  choice: помрачнеют
  rationale: Кратко и литературно передаёт наступление тьмы или мрака в небесах.
- source_word: הַשָּׁמַיִם מִמָּעַל
  choice: небеса в вышине
  rationale: Сохраняет возвышенный регистр и явное пространственное значение מִמָּעַל.
- source_word: דִבַּרְתִּי
  choice: Я сказал
  rationale: Прямой и торжественный эквивалент, уместный для совершённого Божьего речения.
- source_word: זַמֹּתִי
  choice: замыслил
  rationale: Передаёт обдуманное намерение, не добавляя большей степени окончательности, чем выражено в исходном слове.
- source_word: וְלֹא נִחַמְתִּי
  choice: Я не смягчился
  rationale: В контексте объявленного суда означает, что Бог не отказался от намерения и не отменил наказание; формулировка избегает ложного оттенка нравственного раскаяния.
- source_word: וְלֹא אָשׁוּב מִמֶּנָּה
  choice: и не отступлю от этого
  rationale: Сохраняет образ поворота назад и не уточняет сверх текста, относится ли местоимение прежде всего к замыслу, слову или объявленному суду.
theological_decisions:
- issue: Значение божественного נִחַמְתִּי
  choice: Я не смягчился
  alternative: Я не изменил Своего решения; Я не раскаялся
  rationale: Здесь речь идёт не о признании нравственной вины, а об отсутствии отказа от объявленного суда. Выбор сохраняет контекстуальный смысл, а возможная передача через изменение решения указана в сноске.
- issue: Объём значения הָאָרֶץ
  choice: земля
  alternative: страна
  rationale: Суд непосредственно касается Иудеи, однако параллелизм с небесами создаёт космический образ. Основной текст сохраняет широкий смысл, а сноска — локальную возможность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис сохраняет причинные связи и торжественную последовательность божественных утверждений; подлинная неоднозначность слов «земля» и נחם отражена в сносках.
