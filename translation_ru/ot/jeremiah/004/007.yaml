base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/007.yaml
  text: A lion has come up from his thicket[a], and a destroyer of nations has set out; he has gone out from his place to make your land a desolation. Your cities will be laid waste[b], without inhabitant.
translation:
  language: ru
  text: Лев поднялся из своей чащи[a], и губитель народов двинулся в путь; он вышел из своего места, чтобы обратить твою землю в запустение. Твои города будут разорены[b] и останутся без жителей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из своего логова». Еврейское слово обозначает густые, переплетённые заросли, служащие льву укрытием.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «придут в запустение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: поднялся
  rationale: Глагол עלה обозначает движение вверх или выступление в направлении страны; «поднялся» сохраняет образ внезапно появляющегося и наступающего льва.
- source_word: אַרְיֵה
  choice: лев
  rationale: Сохранена буквальная и главная метафора захватчика.
- source_word: מִסֻּבְּכוֹ
  choice: из своей чащи
  rationale: Существительное обозначает густые заросли, укрывающие льва; «чаща» естественно передаёт этот образ по-русски.
- source_word: מַשְׁחִית גּוֹיִם
  choice: губитель народов
  rationale: Причастная конструкция характеризует того же захватчика и сохраняет выразительный пророческий тон.
- source_word: נָסַע
  choice: двинулся в путь
  rationale: Глагол часто означает сняться с места или лагеря и отправиться; выбранная формулировка ясно передаёт начало военного движения.
- source_word: יָצָא מִמְּקֹמוֹ
  choice: он вышел из своего места
  rationale: Сохранены повторное указание на выступление захватчика и нейтральное значение מָקוֹם без уточнения, которого нет в тексте.
- source_word: לָשׂוּם אַרְצֵךְ לְשַׁמָּה
  choice: чтобы превратить твою землю в пустыню
  rationale: Конструкция выражает цель; «превратить … в пустыню» естественно передаёт полное запустение, не ограничивая смысл природной пустыней.
- source_word: עָרַיִךְ תִּצֶּינָה
  choice: твои города будут разорены
  rationale: Формулировка передаёт предстоящее опустошение городов и звучит естественно в современном литературном русском.
- source_word: מֵאֵין יוֹשֵׁב
  choice: останутся без жителей
  rationale: Еврейское выражение буквально указывает на отсутствие живущего там человека; русский множественный оборот согласован с «городами» и ясно передаёт результат.
