  variant: modern literary Russian
source:
  edition: WLC
  text: רָאִ֕יתִי וְ/הִנֵּ֥ה הַ/כַּרְמֶ֖ל הַ/מִּדְבָּ֑ר וְ/כָל עָרָ֗י/ו נִתְּצוּ֙ מִ/פְּנֵ֣י יְהוָ֔ה מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/026.yaml
  text: I looked[a], and behold, the fruitful land was a wilderness, and all its cities were torn down before Yahweh[b], before his fierce anger.
translation:
  language: ru
  text: Я взглянул — и вот, плодородная земля[a] стала пустыней, и все её города были разрушены пред Яхве, пред его пылающим гневом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово можно также понять как название местности: «Кармил». Здесь, вероятнее всего, имеется в виду плодородная или возделанная земля вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из-за Яхве, из-за его пылающего гнева». Еврейский текст дважды употребляет выражение, буквально означающее «от лица» или «пред лицом».'
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  choice: Я взглянул
  rationale: В череде пророческих видений форма глагола ראה передаёт направленное восприятие. «Я взглянул» естественно вводит очередную картину и сохраняет форму первого лица.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Частица הִנֵּה резко привлекает внимание к увиденному; «и вот» сохраняет живость пророческого повествования.
- source_word: הַכַּרְמֶל
  choice: плодородная земля
  rationale: כַּרְמֶל может обозначать как Кармил, так и плодородную, возделанную землю. Противопоставление пустыне делает нарицательное значение наиболее вероятным, но неоднозначность отмечена в сноске.
- source_word: הַמִּדְבָּר
  choice: пустыней
  rationale: מִדְבָּר обозначает пустынную, безлюдную местность, не обязательно песчаную пустыню. Творительный падеж естественно передаёт именную часть сказуемого.
- source_word: וְכָל עָרָיו
  choice: и все её города
  rationale: Местоименный суффикс мужского рода относится к названной земле или области; в русском согласование по смыслу передано формой «её».
- source_word: נִתְּצוּ
  choice: были разрушены
  rationale: Порода нифаль глагола נתץ обозначает разрушение или снос построек. «Были разрушены» естественно применительно ко всем городам.
- source_word: מִפְּנֵי יְהוָה
  choice: пред Яхве
  rationale: מִפְּנֵי буквально связано с нахождением «перед лицом» и здесь может также выражать причину. Основной текст сохраняет пространственно-образную формулировку, а причинное прочтение отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: מִפְּנֵי חֲרוֹן אַפּוֹ
  choice: пред его пылающим гневом
  rationale: Идиома חֲרוֹן אַף буквально связана с жаром или пыланием гнева. «Пылающий гнев» сохраняет интенсивность образа и повтор предлога מִפְּנֵי.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение повторённого מִפְּנֵי в описании суда
  choice: пред Яхве, пред его пылающим гневом
  alternative: из-за Яхве, из-за его пылающего гнева
  rationale: Еврейское выражение допускает как образ присутствия, перед которым всё рушится, так и причинное значение. Основной текст сохраняет буквальный образ, а сноска — причинную возможность, не устраняя напряжение между ними.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Повтор «пред» намеренно сохраняет параллелизм и напряжённость еврейского текста; лексическая неоднозначность הַכַּרְמֶל и причинно-пространственный диапазон מִפְּנֵי вынесены в сноски.
