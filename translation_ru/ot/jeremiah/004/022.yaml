  - severity: low
    issue: «народ Мой» и «лишённые понимания»
    rationale: Это допустимо, но «Мой народ» естественнее, а «они неразумны» точнее воспроизводит самостоятельное сказуемое וְלֹא נְבוֹנִים הֵמָּה и улучшает параллелизм.
