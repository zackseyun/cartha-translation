source:
  edition: WLC
  text: כִּ֣י אֱוִ֣יל עַמִּ֗/י אוֹתִ/י֙ לֹ֣א יָדָ֔עוּ בָּנִ֤ים סְכָלִים֙ הֵ֔מָּה וְ/לֹ֥א נְבוֹנִ֖ים הֵ֑מָּה חֲכָמִ֥ים הֵ֨מָּה֙ לְ/הָרַ֔ע וּ/לְ/הֵיטִ֖יב לֹ֥א יָדָֽעוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/022.yaml
  text: For my people are foolish; they do not know me. They are foolish children[a], and they have no understanding. They are wise to do evil, but they do not know how to do good.
translation:
  language: ru
  text: 'Ведь Мой народ глуп: они не знают Меня. Они — неразумные дети[a], они неразумны. Они мудры на зло, а делать добро не умеют.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «неразумные сыновья»; здесь «сыновья» — собирательное обозначение народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт объяснительно-причинную связь с предшествующим видением суда и естественно звучит в современном русском тексте.
- source_word: אֱוִיל עַמִּי
  choice: народ Мой глуп
  rationale: «Глуп» сохраняет нравственно-духовный смысл אֱוִיל, не сводя его к недостатку интеллекта; притяжательное местоимение подчёркивает трагизм отношений Бога со Своим народом.
- source_word: אוֹתִי לֹא יָדָעוּ
  choice: они не знают Меня
  rationale: Простая формулировка сохраняет возможную широту יָדַע, включая личное и заветное признание Бога, без поясняющего истолкования внутри текста.
- source_word: בָּנִים סְכָלִים
  choice: неразумные дети
  rationale: בָּנִים здесь коллективно обозначает народ; «дети» естественнее передаёт этот смысл. «Неразумные» выражает резкую отрицательную оценку סְכָלִים, сохраняя достоинство литературного регистра.
- source_word: וְלֹא נְבוֹנִים הֵמָּה
  choice: лишённые понимания
  rationale: Передаёт отсутствие рассудительности и проницательности и избегает неестественного повтора связки «они».
- source_word: חֲכָמִים הֵמָּה לְהָרַע
  choice: они умудрены делать зло
  rationale: 'Сохраняет ироническое употребление корня «мудр»: их практическая умелость направлена ко злу.'
- source_word: וּלְהֵיטִיב לֹא יָדָעוּ
  choice: а делать добро не умеют
  rationale: В данном сочетании יָדַע с инфинитивом выражает практическую способность или умение; русский глагол «умеют» ясно передаёт этот оттенок.
theological_decisions:
- issue: Характер знания Бога
  choice: «не знают Меня» с сохранением смысловой широты
  alternative: «не признают Меня»
  rationale: В пророческом контексте речь, вероятно, идёт о личном и заветном знании, проявляющемся в верности, однако буквальное «знают» не устраняет возможную смысловую напряжённость.
- issue: Коллективное значение בָּנִים
  choice: «дети»
  alternative: «сыновья»
  rationale: Мужской род еврейского существительного здесь не ограничивает высказывание мужчинами, а характеризует весь народ; «дети» точно передаёт коллективный смысл.
- issue: Ирония слова חֲכָמִים
  choice: «умудрены делать зло»
  alternative: «искусны в зле»
  rationale: 'Выбранный вариант сохраняет богословски значимую иронию: мудрость народа извращена и обращена ко злу, а не представлена как нейтральное мастерство.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм и контраст между умением делать зло и неспособностью делать добро сохранены; лексика остаётся понятной без конфессионально окрашенных добавлений.
