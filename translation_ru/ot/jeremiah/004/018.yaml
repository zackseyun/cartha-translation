base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/018.yaml
  text: Your way and your deeds have brought these things upon you. This is your evil[a]—how bitter it is! For it has reached your heart.
translation:
  language: ru
  text: Твой путь и твои дела навлекли на тебя всё это. Вот твоё зло[a] — как же оно горько! Ибо оно достигло самого сердца твоего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот твоё бедствие» или «Вот твоё несчастье». Еврейское слово может означать как нравственное зло, так и вызванное им бедствие; основной текст сохраняет обвинительную силу контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵּךְ
  choice: твой путь
  rationale: Сохраняет еврейскую метафору жизненного пути; в сочетании с «делами» означает образ поведения Иудеи.
- source_word: וּמַעֲלָלַיִךְ
  choice: и твои дела
  rationale: «Дела» естественно передаёт поступки с нравственной окраской, характерной для пророческого контекста.
- source_word: עָשׂוּ אֵלֶּה לָךְ
  choice: навлекли на тебя всё это
  rationale: 'Передаёт идиоматический причинно-следственный смысл: бедствие стало следствием собственного поведения адресата.'
- source_word: זֹאת רָעָתֵךְ
  choice: вот твоё зло
  rationale: רָעָה допускает значения нравственного зла и постигшего бедствия. Основной текст сохраняет обвинительный смысл, а сноска отмечает другую возможность.
- source_word: כִּי מָר
  choice: как же оно горько!
  rationale: Экспрессивно и естественно передаёт в данном контексте силу כִּי с прилагательным «горько», не превращая фразу в тяжеловесное причинное придаточное.
- source_word: כִּי נָגַע עַד לִבֵּךְ
  choice: оно проникло в самое сердце твоё
  rationale: 'Передаёт достигнутое внутреннее воздействие: беда коснулась глубины человеческого существа. «Проникло» естественно выражает сочетание נגע с עַד־לב.'
theological_decisions:
- issue: Значение רָעָה в выражении זֹאת רָעָתֵךְ
  choice: твоё зло
  alternative: твоё бедствие / твоё несчастье
  rationale: Контекст связывает происходящее с виновными путями и делами Иудеи, поэтому основной текст сохраняет нравственно-обвинительный оттенок. Вместе с тем слово может обозначать и вызванное этим зло-бедствие, что отражено в сноске.
- issue: Отношение зла к его последствиям
  choice: Сохранена напряжённость между виновностью Иудеи и переживаемым ею горьким бедствием
  alternative: Однозначно истолковать רָעָה только как грех либо только как наказание
  rationale: Еврейская формулировка допускает наложение нравственной причины и бедственного результата; перевод не должен искусственно устранять эту многозначность.
translation_notes:
  register: Современный литературный русский язык с пророческой торжественностью. Инверсия «сердце твоё» в заключительной фразе умеренно возвышает речь и подчёркивает её кульминацию; остальной синтаксис остаётся ясным и естественным.
