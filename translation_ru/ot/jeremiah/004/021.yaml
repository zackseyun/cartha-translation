  text: How long must I see the signal flag and hear the sound of the trumpet?[a][b]
translation:
  language: ru
  text: Доколе мне видеть сигнальное знамя[a] и слышать звук рога[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знамя», «штандарт» или просто «сигнал». Еврейское נֵס означает поднятый знак, нередко служивший военным сигналом.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское שׁוֹפָר обозначает сигнальный рог, часто бараний, которым подавали тревогу или созывали людей.
    reason: cultural_note
lexical_decisions:
- source_word: עַד מָתַי
  choice: Доколе
  rationale: Естественно передаёт риторический вопрос-жалобу о мучительно продолжающемся положении; сохраняет возвышенный, но понятный библейский регистр.
- source_word: אֶרְאֶה
  choice: мне видеть
  rationale: Форма 1-го лица в данном контексте обозначает продолжающееся переживание. Конструкция с «доколе мне» передаёт вынужденность без добавления отсутствующего в еврейском отдельного модального глагола.
- source_word: נֵּס
  choice: сигнальное знамя
  rationale: Слово обозначает поднятый видимый знак, в том числе военный. «Сигнальное знамя» ясно выражает и предмет, и его функцию.
- source_word: אֶשְׁמְעָה
  choice: и слышать
  rationale: Глагол параллелен «видеть» и зависит от общей конструкции «доколе мне», что естественно передаёт длительное тягостное восприятие.
- source_word: קוֹל
  choice: звук
  rationale: В сочетании с рогом означает слышимый звук, а не голос.
- source_word: שׁוֹפָר
  choice: рог
  rationale: Еврейское слово обозначает духовой сигнальный инструмент, обычно изготовленный из рога животного. «Рог» точнее сохраняет древний предметный образ, чем современная «труба».
