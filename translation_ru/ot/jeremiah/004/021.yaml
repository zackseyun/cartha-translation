  verdict: approve
  source_fidelity: Текст точно передаёт еврейский риторический вопрос עַד־מָתַי и параллелизм «видеть … и слышать». «Сигнальное знамя» адекватно передаёт נֵס как поднятый видимый, вероятно военный, сигнал; «звук рога» точно отражает קוֹל שׁוֹפָר. Конструкция «Доколе мне видеть … и слышать?» естественно выражает тягостно-продолжительный характер двух еврейских имперфектов, не приписывая им излишней грамматической модальности.
  naturalness: Фраза звучит литературно и ясно. «Доколе» имеет умеренно возвышенную библейскую окраску, но остаётся понятным современному читателю и соответствует жанру пророческого плача. Сочетания «сигнальное знамя» и «звук рога» естественны в данном контексте.
  terminology: Термины выбраны последовательно и без конфессиональной интерпретации. «Рог» сохраняет конкретный древний образ שׁוֹפָר; примечание корректно поясняет его обычное изготовление и сигнальную функцию. Оба маркера сносок поставлены после соответствующих слов и соотносятся с пояснениями.
