  text: כַּבְּסִ֨י מֵ/רָעָ֤ה לִבֵּ/ךְ֙ יְר֣וּשָׁלִַ֔ם לְמַ֖עַן תִּוָּשֵׁ֑עִי עַד מָתַ֛י תָּלִ֥ין בְּ/קִרְבֵּ֖/ךְ מַחְשְׁב֥וֹת אוֹנֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/014.yaml
  text: Wash your heart from evil[a], Jerusalem, so that you may be saved. How long will wicked thoughts lodge within you?
translation:
  language: ru
  text: Омой своё сердце от зла, Иерусалим, чтобы тебе спастись. Долго ли ещё будут оставаться в тебе злые помыслы?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Доколе будут ночевать в тебе помыслы твоего беззакония?» Возможный перевод: «Доколе будут оставаться в тебе преступные замыслы?»'
    reason: 'Сноска сохраняет буквальный образ временного ночлега в תָּלִין и смысловую широту сочетания מַחְשְׁבוֹת אוֹנֵךְ: мысли, намерения или замыслы, связанные со злом и беззаконием.'
lexical_decisions:
- source_word: כַּבְּסִי
  choice: Омой
  rationale: Глагол буквально означает мыть или стирать. «Омой» сохраняет конкретный образ очищения и естественно сочетается в русском языке со словом «сердце».
- source_word: מֵרָעָה
  choice: от зла
  rationale: В призыве омыть сердце речь идёт прежде всего о нравственном зле, а предлог указывает на удаление, очищение от него.
- source_word: לִבֵּךְ
  choice: своё сердце
  rationale: «Сердце» сохраняет древнееврейское представление о внутреннем человеке — его мыслях, воле и намерениях. Возвратное местоимение естественно передаёт обращение во втором лице.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Общепринятая русская форма названия; город персонифицирован и выступает непосредственным адресатом.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно и ясно выражает цель.
- source_word: תִּוָּשֵׁעִי
  choice: тебе спастись
  rationale: Передаёт широкий смысл формы нифаль от ישׁע, не ограничивая её ни только избавлением от непосредственной беды, ни исключительно духовным спасением.
- source_word: עַד מָתַי
  choice: Долго ли ещё
  rationale: Естественный современный русский эквивалент вопросительной формулы «до каких пор?».
- source_word: תָּלִין
  choice: будут оставаться
  rationale: Глагол буквально связан с ночлегом или временным пребыванием. «Оставаться» ясно передаёт продолжительное присутствие мыслей; буквальный образ отмечен в сноске.
- source_word: בְּקִרְבֵּךְ
  choice: в тебе
  rationale: Передаёт внутреннее местонахождение помыслов в персонифицированном Иерусалиме.
- source_word: מַחְשְׁבוֹת
  choice: помыслы
  rationale: Слово может означать мысли, намерения или замыслы. «Помыслы» естественно обозначает внутренние нравственно окрашенные мысли и сочетается с образом сердца.
- source_word: אוֹנֵךְ
  choice: злые
  rationale: און здесь характеризует помыслы как порочные или беззаконные. «Злые» кратко и ясно передаёт нравственный смысл.
theological_decisions:
- issue: Смысл תִּוָּשֵׁעִי в пророческом контексте
  choice: «тебе спастись» без дальнейшего уточнения
  alternative: «чтобы ты была избавлена»
  rationale: Контекст Иеремии включает грядущий суд и возможность избавления через покаяние. «Спастись» сохраняет широту древнееврейского слова и не снимает напряжения между историческим избавлением и более широким библейским смыслом спасения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого призыва. Форма «омой» сохраняет исходную метафору, а «долго ли ещё» звучит естественнее для обычного читателя, чем более архаичное «доколе».
