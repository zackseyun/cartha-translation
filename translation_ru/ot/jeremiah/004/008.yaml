  text: עַל זֹ֛את חִגְר֥וּ שַׂקִּ֖ים סִפְד֣וּ וְ/הֵילִ֑ילוּ כִּ֥י לֹא שָׁ֛ב חֲר֥וֹן אַף יְהֹוָ֖ה מִמֶּֽ/נּוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/008.yaml
  text: Because of this[a], put on sackcloth; mourn and wail[b], for the burning anger of Yahweh has not turned away from us.
translation:
  language: ru
  text: Из-за этого оденьтесь в траурные одежды из грубой ткани[a], скорбите и рыдайте, ведь пылающий гнев Яхве не отступил от нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «опояшьтесь мешковиной»; то есть наденьте траурную одежду из грубой ткани.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: Из-за этого
  rationale: Оборот указывает на причину или повод для последующих повелений; перевод сохраняет причинное значение и естественно звучит по-русски.
- source_word: חִגְרוּ שַׂקִּים
  choice: наденьте рубище
  rationale: Глагол буквально обозначает опоясывание, а в сочетании с שַׂקִּים — облачение в грубую траурную одежду. «Наденьте рубище» ясно передаёт действие и образ скорби.
- source_word: סִפְדוּ וְהֵילִילוּ
  choice: скорбите и рыдайте
  rationale: Первый глагол обозначает траурный плач, второй — громкие вопли горя; два разных русских глагола сохраняют нарастание выражения скорби.
- source_word: חֲרוֹן אַף
  choice: пылающий гнев
  rationale: Еврейская идиома выражает жар и силу гнева; «пылающий гнев» сохраняет образ, не сводя его к нейтральному обозначению ярости.
- source_word: לֹא שָׁב ... מִמֶּנּוּ
  choice: не отступил от нас
  rationale: Перевод сохраняет пространственную метафору глагола שׁוב и верно передаёт местоименный суффикс первого лица множественного числа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, непосредственно присутствующее в еврейском тексте, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон как личное имя; транслитерация позволяет сохранить это различие, не подменяя имя титулом.
- issue: Направленность Божьего гнева
  choice: не отступил от нас
  alternative: не смягчился к нам
  rationale: Выбранный вариант сохраняет образ движения в שׁוב и не истолковывает выражение как внутреннюю перемену намерения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Императивы переданы кратко и энергично; образ жара в выражении о гневе и коллективное «от нас» сохранены.
