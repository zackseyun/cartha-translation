base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/015.yaml
  text: For a voice is declaring from Dan[b][a], and proclaiming disaster from the hill country of Ephraim.
translation:
  language: ru
  text: Ибо голос возвещает из Дана и провозглашает бедствие[a] с нагорья Ефрема[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беду» или «несчастье»; в других контекстах это еврейское слово может также означать «нечестие».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с горы Ефрема»; вероятно, имеется в виду гористая область Ефрема.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предшествующему предупреждению; «ибо» сохраняет связующую силу и соответствует достоинству пророческой речи.
- source_word: קוֹל
  choice: голос
  rationale: Сохраняет конкретный и выразительный образ еврейского текста; по контексту это голос, несущий весть.
- source_word: מַגִּיד
  choice: возвещает
  rationale: Причастная форма передана настоящим временем, которое естественно по-русски выражает живое, разворачивающееся пророческое сообщение.
- source_word: מִדָּן
  choice: из Дана
  rationale: Дан — географическое название; предлог указывает на северный пункт, откуда распространяется весть.
- source_word: וּמַשְׁמִיעַ
  choice: и провозглашает
  rationale: Каузатив от שמע означает «давать услышать, объявлять». «Провозглашает» естественно передаёт публичность сообщения и сохраняет параллелизм.
- source_word: אָוֶן
  choice: бедствие
  rationale: В данном контексте приближающегося суда слово обозначает беду или гибельное несчастье, а не нравственное нечестие; возможные значения отмечены в сноске.
- source_word: מֵהַר אֶפְרָיִם
  choice: с нагорья Ефрема
  rationale: Сочетание הַר אֶפְרָיִם служит географическим обозначением гористой области Ефрема. «Нагорье Ефрема» точно и естественно передаёт региональный смысл, не создавая впечатления одной отдельной горы.
theological_decisions:
- issue: Значение אָוֶן
  choice: бедствие
  alternative: нечестие
  rationale: Военный и пророческий контекст указывает на пагубное событие или беду; нравственное значение слова не исключается вообще, но здесь контекстуально менее вероятно.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Настоящее время сохраняет живость еврейских причастий; параллелизм двух глаголов удержан.
