base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/011.yaml
  text: 'At that time it will be said to this people and to Jerusalem: “A scorching wind from the bare heights in the wilderness comes toward the daughter of my people—not for winnowing and not for cleansing.”'
translation:
  language: ru
  text: 'В то время скажут этому народу и Иерусалиму: «Палящий ветер с голых высот в пустыне дует к дочери Моего народа — не для веяния и не для очистки».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רוּחַ צַח
  choice: палящий ветер
  rationale: צַח описывает здесь сухой, обжигающий ветер; сочетание передаёт угрозу природного образа естественным современным русским языком.
- source_word: שְׁפָיִים
  choice: голые высоты
  rationale: Слово обозначает открытые, лишённые растительности возвышенности; «голые высоты» сохраняет конкретность образа.
- source_word: דֶּרֶךְ
  choice: на
  rationale: В данном сочетании слово указывает направленность ветра к дочери народа; по-русски это естественно выражается предлогом «на».
- source_word: בַּת עַמִּי
  choice: дочь Моего народа
  rationale: Сохранена поэтическая персонификация еврейского текста, а местоимение передано с прописной буквы как относящееся к говорящему Богу.
- source_word: לִזְרוֹת ... לְהָבַר
  choice: веять зерно ... очищать его
  rationale: 'Термины относятся к обработке зерна: провеиванию и очистке. Добавленные «зерно» и «его» делают подразумеваемый объект ясным без изменения смысла.'
theological_decisions:
- issue: Назначение ветра
  choice: не для того, чтобы веять зерно, и не для того, чтобы очищать его
  alternative: не для веяния и не для очищения
  rationale: 'Сохранено двойное отрицание оригинала и противопоставление обычному полезному ветру: этот ветер служит образом суда, а не сельскохозяйственной очистки.'
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой образности и торжественного тона. Формулировка избегает архаичного «дщерь», но сохраняет метафору «дочь Моего народа».
