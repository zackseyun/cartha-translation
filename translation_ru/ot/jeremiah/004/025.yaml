  text: I looked[a], and behold, there was no man, and all the birds of the heavens had fled.
translation:
  language: ru
  text: Я взглянул — и вот, не было человека[a], и все птицы небесные разлетелись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
