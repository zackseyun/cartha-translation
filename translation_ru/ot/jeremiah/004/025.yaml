    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  choice: Я взглянул
  rationale: Форма Qal, перфект, 1-е лицо единственного числа допускает значения «я увидел» и «я взглянул». В повторяющейся формуле видения «я взглянул» естественно передаёт последовательное обозрение пророком открывающейся картины.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Частица הִנֵּה привлекает внимание к увиденному; «и вот» сохраняет живость пророческого повествования и естественно звучит по-русски.
- source_word: אֵין
  choice: не было
  rationale: Отрицательная экзистенциальная конструкция передана в прошедшем времени в соответствии с рамкой видения, заданной словами «я взглянул».
- source_word: הָאָדָם
  choice: человека
  rationale: Существительное אָדָם с артиклем стоит в единственном числе, но здесь имеет родовое, собирательно-представительное значение. «Не было человека» сохраняет форму исходного текста и остаётся понятным по-русски; широкий смысл пояснён в сноске.
- source_word: וְכָל
  choice: и все
  rationale: 'כָּל при собирательном обозначении птиц выражает полноту: исчезли все без исключения.'
- source_word: עוֹף הַשָּׁמַיִם
  choice: небесные птицы
  rationale: Устойчивое сочетание буквально обозначает «птиц небес». Русское «небесные птицы» сохраняет возвышенный библейский регистр и ясно означает птиц, летающих в небе.
- source_word: נָדָדוּ
  choice: улетели
  rationale: Глагол נדד обозначает удаление, бегство или уход прочь. Применительно к птицам «улетели» естественно передаёт их исчезновение из опустошённой земли, не добавляя явно не выраженной причины.
theological_decisions:
- issue: Родовое значение הָאָדָם в единственном числе
  choice: человека
  alternative: людей; человечества
  rationale: Еврейское слово употреблено в грамматическом единственном числе с артиклем, но обозначает человека как род, а не только мужчину. Основной текст сохраняет эту форму и напряжение между единичным образом и общим смыслом; сноска предотвращает узкое, исключительно мужское понимание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Конструкция «и вот» сохраняет зрительную непосредственность видения; лексика остаётся понятной обычному читателю без архаизации.
