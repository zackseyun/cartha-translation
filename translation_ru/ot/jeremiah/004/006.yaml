  source_fidelity: 'Перевод в целом верно передаёт повеления, направительный оттенок צִיּוֹנָה, бедствие רָעָה и «великое разрушение» שֶׁבֶר גָּדוֹל. Однако «Я навожу с севера бедствие» по-русски звучит неестественно и несколько меняет образ: наведение обычно предполагает объект, на который направлено бедствие, тогда как в еврейском оно приходит «с севера».'
