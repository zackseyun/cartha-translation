  text: שְׂאוּ נֵ֣ס צִיּ֔וֹנָ/ה הָעִ֖יזוּ אַֽל תַּעֲמֹ֑דוּ כִּ֣י רָעָ֗ה אָנֹכִ֛י מֵבִ֥יא מִ/צָּפ֖וֹן וְ/שֶׁ֥בֶר גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/006.yaml
  text: Raise a signal toward Zion[a]. Take refuge; do not stand still, for I am bringing disaster from the north[c][b], and great destruction.
translation:
  language: ru
  text: Поднимите знамя в сторону Сиона[a]! Ищите убежище[b], не оставайтесь на месте, потому что Я несу с севера бедствие[c] и великое разрушение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поднимите сигнальный знак по направлению к Сиону».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «Бегите в безопасное место».'
    reason: lexical_alternative
  - marker: c
    text: Здесь «бедствие» означает катастрофу или кару, а не нравственное зло.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ נֵס
  choice: Поднимите сигнальное знамя
  rationale: Сочетание императива נשׂא с נֵס обозначает поднятие заметного знака для сбора или предупреждения. «Сигнальное знамя» передаёт и предметный образ, и его назначение.
- source_word: צִיּוֹנָה
  choice: в сторону Сиона
  rationale: Направительный ה указывает направление к Сиону; оборот «в сторону Сиона» естественно сохраняет эту особенность.
- source_word: הָעִיזוּ
  choice: Ищите убежища
  rationale: Форма от עוז в данном контексте призывает укрыться или искать безопасности. Выбор сохраняет идею убежища, не усиливая без необходимости значение до однозначного «бегите».
- source_word: אַל תַּעֲמֹדוּ
  choice: не оставайтесь на месте
  rationale: Запрет буквально связан со стоянием, но в срочном предупреждении означает не задерживаться и не бездействовать. Русский оборот сохраняет образ и звучит естественно.
- source_word: רָעָה
  choice: бедствие
  rationale: В контексте пророческого суда слово обозначает несчастье или катастрофу, а не нравственное зло.
- source_word: אָנֹכִי מֵבִיא
  choice: Я навожу
  rationale: Местоимение подчёркивает личное действие говорящего, а причастие представляет бедствие как надвигающееся. «Я навожу» ясно передаёт непосредственную причинность и сохраняет напряжённость высказывания.
- source_word: מִצָּפוֹן
  choice: с севера
  rationale: Обычное географическое выражение, указывающее направление, откуда приходит суд.
- source_word: שֶׁבֶר גָּדוֹל
  choice: великое разрушение
  rationale: שֶׁבֶר обозначает сокрушение, крах или разорение; «великое разрушение» точно и понятно передаёт масштаб грядущей катастрофы.
theological_decisions:
- issue: Значение רָעָה применительно к действию Бога
  choice: бедствие
  alternative: зло
  rationale: Контекст говорит о ниспосылаемой катастрофе и суде. «Бедствие» сохраняет прямое утверждение о том, что его наводит Бог, но не приписывает Ему совершение нравственного зла.
- issue: Степень выраженности движения в הָעִיזוּ
  choice: Ищите убежища
  alternative: Бегите в безопасное место
  rationale: Глагольная форма допускает оттенки поиска убежища и поспешного удаления в безопасное место. Основной текст не делает движение более определённым, чем позволяет еврейское слово; более динамический вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Краткие повеления передают срочность предупреждения; прописное «Я» отмечает речь Бога в соответствии с русской библейской издательской традицией.
