    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Я посмотрел
  rationale: Форма Qal, перфект, 1-е лицо единственного числа от ראה. В контексте пророческого видения «я посмотрел» естественно вводит последовательное обозрение картин и сохраняет наблюдательную силу глагола.
- source_word: הָאָרֶץ
  choice: землю
  rationale: אֶרֶץ может означать как «землю/страну», так и «землю» в космическом смысле. Сочетание с небесами и отсылка к Быт 1:2 склоняют к космическому значению, не устраняя исторического контекста опустошения страны.
- source_word: וְהִנֵּה
  choice: — и вот,
  rationale: «И вот» передаёт указательную и визионерскую силу הִנֵּה, сохраняя непосредственность пророческой картины.
- source_word: תֹהוּ וָבֹהוּ
  choice: безвидна и пуста
  rationale: Устойчивое выражение прямо перекликается с Быт 1:2. Формулировка «безвидна и пуста» сохраняет узнаваемую русскую библейскую связь и образ мира, обращённого к состоянию до устроения творения.
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: В паре с землёй слово имеет космический охват; «небеса» точнее сохраняет этот смысл, чем более узкое «небо» как видимый небосвод.
- source_word: וְאֵין אוֹרָם
  choice: и не было у них света
  rationale: Местоименный суффикс в אוֹרָם относится к небесам. Формулировка прямо выражает отсутствие у них света и не уточняет сверх текста, был ли свет отнят или изначально отсутствовал.
theological_decisions:
- issue: Отголосок Бытия 1:2 в пророчестве о суде
  choice: 'Сохранить образ космического раз-творения: земля «безвидна и пуста», а у небес нет света.'
  alternative: Передать הָאָרֶץ исключительно как опустошённую страну Иудеи и ослабить космическую образность.
  rationale: Сочетание תֹהוּ וָבֹהוּ и пара «земля — небеса» явно отсылают к Быт 1:2 и изображают суд как обращение творения вспять. Перевод сохраняет эту литературно-богословскую напряжённость, не отрицая исторической связи пророчества с Иудеей.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Повтор «посмотрел» добавлен во второй части по-русски для ясного параллелизма, хотя в еврейском тексте глагол подразумевается. Традиционное «безвидна и пуста» сохранено ради точной межтекстовой связи; менее привычное слово разъяснено в сноске.
