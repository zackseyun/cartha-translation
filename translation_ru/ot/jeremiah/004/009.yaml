id: JER.4.9
reference: Jeremiah 4:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה יֹאבַ֥ד לֵב הַ/מֶּ֖לֶךְ וְ/לֵ֣ב הַ/שָּׂרִ֑ים וְ/נָשַׁ֨מּוּ֙ הַ/כֹּ֣הֲנִ֔ים וְ/הַ/נְּבִיאִ֖ים יִתְמָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/009.yaml
  text: And it will happen on that day[a], declares Yahweh, that the heart of the king and the heart of the officials will perish, and the priests will be appalled, and the prophets will be astonished.
translation:
  language: ru
  text: И будет в тот день, — возвещает Яхве, — царь и сановники падут духом[a], священники оцепенеют, а пророки изумятся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «погибнет сердце царя и сердце сановников»; то есть они лишатся мужества, решимости или самообладания.'
    reason: Лֵב означает «сердце», но здесь может обозначать внутреннюю стойкость, мужество или способность принимать решения; אבד буквально значит «погибнуть, исчезнуть».
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохраняет пророческую формулу будущего события и торжественный строй оригинала, оставаясь понятным современному читателю.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую формулу пророческого речения и прямо воспроизводит личное имя יהוה.
- source_word: יֹאבַד לֵב הַמֶּלֶךְ וְלֵב הַשָּׂרִים
  choice: царь и сановники падут духом
  rationale: Еврейское «погибнет сердце» в данном контексте означает утрату внутренней стойкости или мужества. Естественная русская идиома передаёт этот смысл, а буквальный образ сохранён в сноске.
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: В контексте царского управления обозначает высокопоставленных правителей или должностных лиц; «сановники» естественно передаёт их положение.
- source_word: וְנָשַׁמּוּ הַכֹּהֲנִים
  choice: священники оцепенеют
  rationale: Форма от שמם выражает потрясение, ужас и ошеломление; «оцепенеют» передаёт сильную реакцию без добавления причины.
- source_word: וְהַנְּבִיאִים יִתְמָהוּ
  choice: а пророки изумятся
  rationale: תמה обозначает изумление или растерянное недоумение. «Изумятся» сохраняет отличие от более сильного оцепенения священников.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Значение образа «погибнет сердце»
  choice: царь и сановники падут духом
  alternative: сердце царя и сердце сановников погибнет
  rationale: Образ может охватывать утрату мужества, решимости или способности здраво действовать. Основной текст передаёт наиболее вероятный смысл, а сноска сохраняет буквальную форму и её широту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Архаическая формула «И будет в тот день» сохранена как ясная и узнаваемая; остальная фраза изложена естественно и без конфессионально окрашенной терминологии.
