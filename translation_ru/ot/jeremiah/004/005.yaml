  text: הַגִּ֣ידוּ בִֽ/יהוּדָ֗ה וּ/בִ/ירוּשָׁלִַ֨ם֙ הַשְׁמִ֔יעוּ וְ/אִמְר֕וּ ו/תקעו שׁוֹפָ֖ר בָּ/אָ֑רֶץ קִרְא֤וּ מַלְאוּ֙ וְ/אִמְר֔וּ הֵאָסְפ֥וּ וְ/נָב֖וֹאָה אֶל עָרֵ֥י הַ/מִּבְצָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/005.yaml
  text: 'Declare it in Judah[a], and proclaim it in Jerusalem, and say: Blow the trumpet in the land. Cry aloud, fill the air, and say: Gather yourselves[d][c][b], and let us go into the fortified cities.'
translation:
  language: ru
  text: 'Объявите в Иудее, возвестите в Иерусалиме и скажите:


    «Трубите в рог по стране![a]


    Кричите во весь голос[b] и говорите:


    „Собирайтесь! Пойдём в укреплённые города[c]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «трубите в шофар в стране». Шофар — рог, служивший, в частности, для подачи сигнала тревоги.'
    reason: cultural_note
  - marker: b
    text: 'Еврейское выражение кратко и необычно; возможно также: «громко взывайте» или буквально: «взывайте, наполняйте». Что именно надлежит «наполнить» криком, в тексте не уточняется.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к укреплённым городам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ בִיהוּדָה
  choice: Объявите в Иудее
  rationale: Публичный и настоятельный характер Hiphil-императива נגד передан глаголом «объявите»; подразумеваемое дополнение не добавлено, поскольку по-русски оно не обязательно.
- source_word: וּבִירוּשָׁלִַם הַשְׁמִיעוּ
  choice: возвестите в Иерусалиме
  rationale: Hiphil שמע буквально означает «сделайте так, чтобы услышали»; «возвестите» естественно передаёт публичное провозглашение и сохраняет возвышенный, но понятный регистр.
- source_word: וְתִקְעוּ שׁוֹפָר בָּאָרֶץ
  choice: Трубите в рог по всей стране
  rationale: שׁוֹפָר — сигнальный рог; «рог» точнее обозначает предмет, чем общее «труба». Русское «по всей стране» естественно выражает распространение тревожного сигнала в пределах земли Иуды.
- source_word: קִרְאוּ מַלְאוּ
  choice: Кричите во весь голос
  rationale: Сочетание краткое и эллиптическое. Древние версии и контекст поддерживают понимание מַלְאוּ как усиления призыва; «во весь голос» передаёт громкость и настоятельность, не вводя неопределённый объект глагола «наполните».
- source_word: הֵאָסְפוּ
  choice: Собирайтесь
  rationale: Niphal-императив אסף представляет призыв собраться вместе; возвратная форма «собирайтесь» естественна и точна.
- source_word: וְנָבוֹאָה
  choice: Пойдём
  rationale: Когортатив первого лица множественного числа выражает побуждение, включающее говорящего; «пойдём» передаёт это непосредственно.
- source_word: אֶל עָרֵי הַמִּבְצָר
  choice: в укреплённые города
  rationale: Фраза обозначает защищённые укреплениями города. Предлог «в» естественен при движении внутрь города, хотя еврейское אֶל само по себе может означать и направление «к».
