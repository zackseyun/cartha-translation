  text: My inward parts[a], my inward parts! I writhe in pain! O walls of my heart! My heart pounds within me; I cannot keep silent, for you, my soul, have heard the sound of the trumpet[c][b], the battle cry.
translation:
  language: ru
  text: О, внутренности мои, внутренности мои! Я корчусь от боли! О, стены сердца моего! Сердце моё бушует во мне; не могу молчать, ибо ты, душа моя, услышала звук рога[a], боевой клич[b].
