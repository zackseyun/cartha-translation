  - marker: b
    text: 'Или: «военную тревогу» или «боевой сигнал». Еврейское слово может обозначать крик, трубный сигнал либо сигнал тревоги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַי
  choice: внутренности мои
  rationale: Сохраняет буквальный, телесный образ внутренних органов как средоточия глубокой муки; повтор передаёт напряжённость возгласа.
- source_word: אחולה
  choice: я корчусь от боли
  rationale: Форма от חול/חיל выражает мучительное содрогание или корчи, подобные родовым мукам; перевод сохраняет телесную и эмоциональную силу.
- source_word: קִירוֹת לִבִּי
  choice: стены сердца моего
  rationale: Буквальное значение קִירוֹת — «стены». Необычная метафора сохранена, а не сглажена до «глубины» или «покои сердца».
- source_word: הֹמֶה לִּי לִבִּי
  choice: сердце моё трепещет во мне
  rationale: המה обозначает шум, смятение и бурное движение; «трепещет» естественно передаёт внутреннее сердечное волнение, не сводя образ только к учащённому биению.
- source_word: לֹא אַחֲרִישׁ
  choice: не могу молчать
  rationale: В контексте невольного крика боли выражение естественно передаёт невозможность хранить молчание, хотя формально возможно и волевое «не буду молчать».
- source_word: קול שופר
  choice: звук рога
  rationale: שׁוֹפָר — сигнальный рог, обычно бараний; «рог» точнее сохраняет конкретный древний инструмент, чем обобщённая «труба».
- source_word: שמעתי נפשי
  choice: ты, душа моя, слышишь
  rationale: Сохраняет возможность эмоционального обращения говорящего к собственной душе. В еврейском перфект שמעתי имеет форму первого лица («я услышал»), тогда как נַפְשִׁי допускает неоднозначную синтаксическую связь; русский перевод передаёт выбранное самoобращение, а альтернативное чтение отмечено.
- source_word: תְּרוּעַת מִלְחָמָה
  choice: боевой клич
  rationale: תְּרוּעָה может означать громкий крик, тревожный сигнал или боевой возглас; «боевой клич» кратко и образно соответствует сочетанию с מִלְחָמָה.
