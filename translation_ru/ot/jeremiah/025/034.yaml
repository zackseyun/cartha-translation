source:
  edition: WLC
  text: הֵילִ֨ילוּ הָ/רֹעִ֜ים וְ/זַעֲק֗וּ וְ/הִֽתְפַּלְּשׁוּ֙ אַדִּירֵ֣י הַ/צֹּ֔אן כִּֽי מָלְא֥וּ יְמֵי/כֶ֖ם לִ/טְב֑וֹחַ וּ/תְפוֹצ֣וֹתִי/כֶ֔ם וּ/נְפַלְתֶּ֖ם כִּ/כְלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/034.yaml
  text: Wail[a], you shepherds, and cry out; roll in the dust, you lords of the flock, for the days of your slaughter are fulfilled[b], and your dispersions have come[e][d][c], and you will fall like a precious vessel.
translation:
  language: ru
  text: Рыдайте, пастухи, и вопите! Валяйтесь в прахе[a], вожди стада[b], потому что исполнились дни ваши для заклания, и настало время рассеяния вашего[c]; вы упадёте, словно драгоценный сосуд[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «катайтесь» или «валяйтесь»; имеется в виду жест скорби и унижения — катание в прахе или пепле.'
    reason: cultural_note
  - marker: b
    text: 'Или: «знатные», «могущественные среди стада». Здесь пастухи и вожди стада образно обозначают руководителей.'
    reason: lexical_alternative
  - marker: c
    text: Еврейский текст здесь труден. Масоретская форма может означать «ваши рассеяния»; предлагались также чтения «Я рассею вас» и «Я разобью вас».
    reason: alternative_reading
  - marker: d
    text: 'Или: «желанный сосуд», то есть ценный, дорогой предмет, который, однако, может разбиться при падении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: Рыдайте
  rationale: Императив множественного числа от ילל обозначает громкое скорбное причитание. «Рыдайте» естественно передаёт плач, не ослабляя его силы.
- source_word: הָרֹעִים
  choice: пастухи
  rationale: Сохранён буквальный пастушеский образ, который у Иеремии применён к правителям и руководителям, но не истолкован вместо читателя.
- source_word: וְזַעֲקוּ
  choice: и вопите
  rationale: זעק означает громко взывать, особенно в бедствии. «Вопите» соответствует возвышенному и грозному регистру контекста.
- source_word: וְהִתְפַּלְּשׁוּ
  choice: валяйтесь в прахе
  rationale: Возвратная форма глагола описывает жест скорби и унижения — катание по земле, в прахе или пепле. Добавление «в прахе» делает древний образ понятным.
- source_word: אַדִּירֵי הַצֹּאן
  choice: вожди стада
  rationale: אַדִּיר обозначает знатных, могущественных или величественных лиц. «Вожди» передаёт власть и высокий статус, сохраняя образ стада.
- source_word: כִּי מָלְאוּ יְמֵיכֶם לִטְבוֹחַ
  choice: потому что настал срок вашего заклания
  rationale: Буквально говорится, что дни, назначенные для заклания, наполнились. «Настал срок» естественно выражает достижение назначенного времени, а «заклание» сохраняет резкую жертвенно-убойную образность טבח.
- source_word: וּתְפוֹצוֹתִיכֶם
  choice: и рассеяния
  rationale: Масоретская форма трудна и буквально указывает на «ваши рассеяния». В русском она синтаксически соединена со «сроком», при этом неопределённость формы отмечена в сноске.
- source_word: וּנְפַלְתֶּם
  choice: вы упадёте
  rationale: Перфект с союзом в контексте предстоящего суда имеет результирующее будущее значение.
- source_word: כִּכְלִי חֶמְדָּה
  choice: словно драгоценный сосуд
  rationale: כְּלִי — сосуд или предмет, а חֶמְדָּה — нечто желанное, ценное, дорогое. Формулировка сохраняет образ ценного, но хрупкого предмета.
theological_decisions:
- issue: Кого обозначают «пастухи» и «вожди стада»
  choice: Сохранить пастушескую метафору в основном тексте.
  alternative: Передать прямо как «правители» или «руководители народа».
  rationale: В книге Иеремии эти образы часто относятся к правителям, однако исходный текст говорит метафорически. Сохранение образа не навязывает единственного толкования.
- issue: Сила образа заклания
  choice: Сохранить слово «заклание».
  alternative: Смягчить до «гибели» или «уничтожения».
  rationale: לטבוח выражает насильственное умерщвление. Смягчение ослабило бы язык суда.
- issue: Неясная форма וּתְפוֹצוֹתִיכֶם
  choice: Передать масоретскую форму как «рассеяние» и отметить трудность в сноске.
  alternative: 'Следовать возможному иному чтению: «Я рассею вас» или «Я разобью вас».'
  rationale: Так основной текст следует имеющейся масоретской форме, не скрывая текстовой и смысловой неопределённости.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повеления переданы резко и ритмично; пастушеская метафора и напряжённая образность суда сохранены. Архаизирующее «заклание» употреблено намеренно как точное и понятное в библейском контексте слово.
