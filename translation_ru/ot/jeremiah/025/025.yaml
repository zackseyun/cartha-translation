source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל מַלְכֵ֣י זִמְרִ֗י וְ/אֵת֙ כָּל מַלְכֵ֣י עֵילָ֔ם וְ/אֵ֖ת כָּל מַלְכֵ֥י מָדָֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/025.yaml
  text: and all the kings of Zimri[a], and all the kings of Elam, and all the kings of Media[b];
translation:
  language: ru
  text: и всех царей Зимри[a], и всех царей Элама, и всех царей Мидии[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кого или что обозначает название «Зимри», точно неизвестно; возможно, речь идёт о народе или области, не засвидетельствованных однозначно в других источниках.
    reason: cultural_note
  - marker: b
    text: 'Или: «мидян». Еврейское מָדָי может обозначать как страну Мидию, так и мидийский народ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: и
  rationale: Союз ו передан как «и», а служебный показатель прямого дополнения אֵת отдельно не переводится; перечисление продолжает ряд дополнений из предыдущего стиха.
- source_word: כָּל
  choice: всех
  rationale: Перед существительным во множественном числе כָּל обозначает всю совокупность и естественно передаётся по-русски словом «всех».
- source_word: מַלְכֵי
  choice: царей
  rationale: Сопряжённая форма множественного числа от מֶלֶךְ означает «царей [кого-либо/чего-либо]»; зависимость выражена последующим родительным падежом.
- source_word: זִמְרִי
  choice: Зимри
  rationale: Неясное название народа или области сохранено посредством русской транслитерации, без попытки установить его референт в основном тексте.
- source_word: עֵילָם
  choice: Элама
  rationale: Употреблено традиционное русское название древней области; родительный падеж обусловлен словом «царей».
- source_word: מָדָי
  choice: Мидии
  rationale: Еврейское название может обозначать как страну Мидию, так и мидийский народ. В параллельном перечне после «царей» географическое название «Мидия» звучит естественно, но лексическая неоднозначность отмечена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного ритма перечисления. Повтор «и всех царей» воспроизводит синтаксический параллелизм еврейского текста. Имена переданы в общепринятых русских формах; неопределённость названия «Зимри» и двойное значение מָדָי не устранены, а вынесены в сноски. Маркеры английского консультационного слоя были соотнесены с надлежащими словами по содержанию примечаний.
