  text: וְ/אַל תֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם וְ/לֹֽא תַכְעִ֤יסוּ אוֹתִ/י֙ בְּ/מַעֲשֵׂ֣ה יְדֵי/כֶ֔ם וְ/לֹ֥א אָרַ֖ע לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/006.yaml
  text: And do not go after other gods to serve them and to bow down to them[a], and do not provoke me to anger by the work of your hands[b], and I will do you no harm.
translation:
  language: ru
  text: Не следуйте другим богам, чтобы служить им и поклоняться им[a], и не вызывайте Моего гнева делами ваших рук, и Я не причиню вам беды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идти вслед за другими богами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и Я не навлеку на вас бедствия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּלְכוּ אַחֲרֵי
  choice: ходите вслед за
  rationale: Еврейская идиома буквально сохраняет образ движения вслед за кем-либо и в данном контексте означает следование в преданности; русское «ходить вслед за» передаёт и образ, и смысл.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другими богами
  rationale: Прямое обозначение божеств, иных по отношению к Яхве; вариант «чужими богами» мог бы привнести дополнительный оттенок принадлежности или иноземности.
- source_word: לְעָבְדָם
  choice: служить им
  rationale: Глагол עבד применительно к божествам включает религиозное служение, но «служить» сохраняет его основной смысл и не сливает его со следующим глаголом поклонения.
- source_word: וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: и поклоняться им
  rationale: Глагол обозначает поклон или простирание в знак почтения. В современном русском «поклоняться» естественно передаёт этот религиозный жест, сохраняя отличие от «служить».
- source_word: תַכְעִיסוּ אֹתִי
  choice: вызывайте Мой гнев
  rationale: Каузативная форма כעס означает побуждать к гневу, раздражать. Формулировка естественна по-русски и ясно сохраняет причинительный смысл.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: делами ваших рук
  rationale: Сохранена еврейская образная формула, которая в контексте указывает на изготовленные людьми предметы, прежде всего идолов, без внесения этого толкования непосредственно в текст.
- source_word: וְלֹא אָרַע לָכֶם
  choice: и Я не причиню вам беды
  rationale: Hiphil глагола רעע здесь означает причинить вред или навлечь бедствие. «Не причиню вам беды» избегает нравственно двусмысленного «не сделаю вам зла» и сохраняет обещание не наказывать бедствием.
theological_decisions:
- issue: Смысл заключительной клаузы как обещания или цели
  choice: и Я не причиню вам беды
  alternative: чтобы Мне не причинить вам беды
  rationale: В еврейском тексте стоит простой союз וְ с отрицанием и глаголом первого лица. В контексте это естественно воспринимается как Божье заверение, связанное с запретами; перевод не превращает союз явно в целевой оборот.
- issue: Подразумеваемый объект выражения «делами ваших рук»
  choice: сохранить образное выражение без пояснения «идолами» в основном тексте
  alternative: идолами, сделанными вашими руками
  rationale: Контекст указывает на идолов, однако само выражение шире и буквально говорит о произведении рук. Сохранение образа не устраняет намеренную смысловую связь и не добавляет отсутствующее существительное.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Множественное число обращений сохранено; местоимение «Мой» и «Я» оформлены с прописной буквы по принятой русской библейской традиции. Тире перед заключительным обещанием помогает ясно показать следствие, не превращая его в явно условную конструкцию.
