base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/032.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], disaster is going out from nation to nation[c][b], and a great storm is being stirred up from the farthest parts of the earth.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Вот, бедствие переходит от народа к народу, и великая буря поднимается из самых дальних краёв земли».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет стандартную пророческую формулу в естественном и торжественном современном русском языке.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יְהוָה транслитерацией и сохраняет широкий смысл צְבָאוֹת, не сужая его исключительно до земных армий.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественно передаёт указательное значение и усиливает пророческую настоятельность.
- source_word: רָעָה
  choice: бедствие
  rationale: В данном контексте слово обозначает губительное несчастье как суд, а не нравственное зло.
- source_word: יֹצֵאת מִגּוֹי אֶל גּוֹי
  choice: переходит от народа к народу
  rationale: Причастная форма изображает разворачивающееся действие, а предлоги — последовательное распространение среди народов; «переходит» звучит по-русски естественнее буквального «выходит».
- source_word: סַעַר גָּדוֹל
  choice: великая буря
  rationale: Сохраняет сильный образ разрушительной бури и возвышенный тон пророчества.
- source_word: יֵעוֹר
  choice: поднимается
  rationale: Передаёт нифаль со значением пробуждения или возбуждения бури и сохраняет живую пророческую картину; возможен и будущий оттенок.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: от самых дальних краёв земли
  rationale: Передаёт удалённые пределы земли, сохраняя пространственную образность исходного выражения.
theological_decisions:
- issue: Значение רָעָה в речи о Божьем суде
  choice: бедствие
  alternative: зло; несчастье
  rationale: Контекст говорит о разрушительном суде над народами. Перевод «зло» мог бы быть ошибочно понят как указание на нравственное зло, тогда как еврейское слово здесь естественно означает бедствие.
- issue: Временной оттенок יֵעוֹר
  choice: поднимается
  alternative: поднимется; будет поднята
  rationale: Настоящее время сохраняет пророческую наглядность и согласуется с причастием יֹצֵאת, не исключая заложенной в контексте близкой будущности.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Синтаксис ясен для широкого читателя; архаизмы избегаются. Кавычки обозначают начало прямой речи после формулы посланника.
