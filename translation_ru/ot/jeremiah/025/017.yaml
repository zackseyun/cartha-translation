  text: וָ/אֶקַּ֥ח אֶת הַ/כּ֖וֹס מִ/יַּ֣ד יְהוָ֑ה וָֽ/אַשְׁקֶה֙ אֶת כָּל הַ/גּוֹיִ֔ם אֲשֶׁר שְׁלָחַ֥/נִי יְהוָ֖ה אֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/017.yaml
  text: So I took the cup from the hand of Yahweh and made all the nations to whom Yahweh had sent me drink[a][b].
translation:
  language: ru
  text: И я взял чашу из руки Яхве и напоил все народы, к которым послал меня Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и дал пить всем народам»; еврейский глагол имеет каузативное значение — «напоил», «побудил пить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: И я взял
  rationale: Форма wayyiqtol от לקח продолжает последовательное повествование; союз «и» естественно передаёт связь с предыдущим действием.
- source_word: הַכּוֹס
  choice: чашу
  rationale: Прямое соответствие כּוֹס с определённым артиклем; в русском определённость ясна из контекста без отдельного показателя.
- source_word: מִיַּד יְהוָה
  choice: из руки Яхве
  rationale: 'Сохранён яркий образ исходного текста: пророк получает чашу непосредственно от Яхве.'
- source_word: וָאַשְׁקֶה
  choice: и напоил
  rationale: Hiphil от שׁקה имеет каузативное значение. Русское «напоил» естественно выражает действие «дал/заставил пить», не уточняя сверх текста степень принуждения.
- source_word: כָּל הַגּוֹיִם
  choice: все народы
  rationale: В данном контексте גּוֹיִם обозначает народы, которым обращены последующие пророчества.
- source_word: אֲשֶׁר שְׁלָחַנִי יְהוָה אֲלֵיהֶם
  choice: к которым послал меня Яхве
  rationale: Относительное придаточное ясно относится к «народам» и сохраняет простой прошедший вид еврейской формы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное божественное имя, непосредственно стоящее в еврейском тексте, без замены титулом.
- issue: Характер действия, выраженного וָאַשְׁקֶה
  choice: напоил
  alternative: дал пить; заставил пить
  rationale: Каузатив сохранён, но русский глагол не снимает смыслового напряжения между предоставлением питья и принуждением, которое определяется образом чаши суда в контексте.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного повествовательного строя и образа «из руки Яхве». «Напоил» звучит естественно и достойно, при этом передаёт каузатив исходного глагола.
