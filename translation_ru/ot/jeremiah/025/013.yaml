    rationale: В русском «навести на землю слова» не передаёт ясно, что возвещённые слова будут исполнены. «Исполню на той земле все Мои слова» естественно выражает исполнение пророческих речений без сужения их значения до одного бедствия.
  - severity: low
    issue: Тяжеловесная связь «всё написанное ... что Иеремия пророчествовал».
    rationale: Конструкция формально понятна, но относительное «что» после субстантивированного причастия звучит неловко. Повторительное «всё, что» ясно передаёт еврейскую тотальность и аппозиционное уточнение.
