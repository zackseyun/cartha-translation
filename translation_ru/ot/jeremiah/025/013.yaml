base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/013.yaml
  text: And I will bring upon that land all my words that I have spoken against it—all that is written in this book[b][a], which Jeremiah prophesied against all the nations.
translation:
  language: ru
  text: И Я исполню на той земле все Мои слова, которые Я изрёк против неё, — всё написанное в этом свитке[a], всё, что Иеремия пророчествовал против всех народов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в этой книге». Еврейское слово может обозначать свиток или книгу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о всех народах». Еврейский предлог допускает более широкое значение, хотя контекст здесь указывает на пророчества суда.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: И наведу
  rationale: Каузативная форма глагола בוא означает, что Господь приведёт в исполнение возвещённое бедствие; русское «наведу на» естественно передаёт сочетание с עַל.
- source_word: עַל הָאָרֶץ הַהִיא
  choice: на ту землю
  rationale: אֶרֶץ обозначает здесь землю как территорию, подвергаемую суду; предлог עַל после «наведу» передан как «на».
- source_word: אֵת כָּל דְּבָרַי
  choice: все Мои слова
  rationale: Буквальное «слова» сохраняет связь между Божьим изречением и его исполнением, не сужая смысл до одних лишь наказаний.
- source_word: אֲשֶׁר דִּבַּרְתִּי עָלֶיהָ
  choice: которые Я изрёк против неё
  rationale: «Изрёк» уместно для возвышенной пророческой речи, а «против неё» передаёт в данном контексте направленность суда.
- source_word: אֵת כָּל הַכָּתוּב
  choice: всё написанное
  rationale: Передаёт полноту письменного содержания без добавочного толкования.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: в этом свитке
  rationale: סֵפֶר может означать книгу или свиток; в древнем письменном контексте «свиток» конкретнее, при этом альтернативное «книга» отмечено в сноске.
- source_word: אֲשֶׁר נִבָּא יִרְמְיָהוּ
  choice: что Иеремия пророчествовал
  rationale: Сохраняется активная конструкция еврейского текста и обычное значение נבא — «пророчествовать».
- source_word: עַל כָּל הַגּוֹיִם
  choice: против всех народов
  rationale: В контексте пророчеств о суде עַל имеет враждебно-судебный оттенок; более широкое значение «о» сохраняется в сноске.
theological_decisions:
- issue: Направленность пророчеств в заключительной фразе
  choice: против всех народов
  alternative: о всех народах
  rationale: Предлог עַל при глаголе «пророчествовать» допускает общее значение темы речи, но контекст возвещённого суда поддерживает значение «против»; сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. «Наведу» и «изрёк» сохраняют достоинство стиля, оставаясь понятными; местоимение «Мои» оформлено с прописной буквы по устойчивой русской библейской традиции.
