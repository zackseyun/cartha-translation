translation_notes:
  register: Современный литературный русский язык; сохранены традиционные библейские формы имён. Фрагмент передан как продолжение синтаксического перечня из предыдущего стиха, поэтому у выражения «сыновей Аммона» явно выражен винительный падеж; несклоняемые здесь формы «Эдом» и «Моав» внешне совпадают с именительным.
