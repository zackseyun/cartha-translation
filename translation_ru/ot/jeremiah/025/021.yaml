lexical_decisions:
- source_word: אֱדוֹם
  choice: Эдом
  rationale: Собственное имя народа и страны передано традиционной русской формой; контекст перечисляет народы как объекты суда.
- source_word: מוֹאָב
  choice: Моав
  rationale: Сохранено собственное имя в традиционной русской форме, без замены на этноним «моавитяне».
- source_word: בְּנֵי עַמּוֹן
  choice: сыновей Аммона
  rationale: Формально передаёт еврейское родовое выражение «сыны/сыновья Аммона» и при этом естественно включается в зависимый от предыдущего стиха перечень.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: Эдом, Моав и сыновей Аммона
  rationale: Показатели прямого дополнения отдельно не переводятся; союзы и падежная форма передают синтаксическую связь с глаголом из предыдущего контекста.
