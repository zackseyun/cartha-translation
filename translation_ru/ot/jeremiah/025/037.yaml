  text: וְ/נָדַ֖מּוּ נְא֣וֹת הַ/שָּׁל֑וֹם מִ/פְּנֵ֖י חֲר֥וֹן אַף יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/037.yaml
  text: And the peaceful pastures are laid waste because of the burning anger of Yahweh[a].
translation:
  language: ru
  text: И опустели мирные пастбища[a] из-за пылающего гнева Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пастбища мира».'
    reason: Сохранена более буквальная передача еврейского сочетания נְאוֹת הַשָּׁלוֹם.
lexical_decisions:
- source_word: וְנָדַמּוּ
  choice: И опустели
  rationale: Форма от דמם буквально связана с молчанием и замиранием, но применительно к пастбищам в контексте суда передаёт их запустение. «Опустели» естественно по-русски выражает наступившее состояние, не устраняя полностью образ безжизненной тишины.
- source_word: נְאוֹת
  choice: пастбища
  rationale: В пастушеской образности Иеремии слово обозначает места выпаса, пастбищные угодья, а не жилища вообще.
- source_word: הַשָּׁלוֹם
  choice: мирные
  rationale: Определение передаёт состояние покоя, безопасности и благополучия. Более буквальное сочетание «пастбища мира» сохранено в сноске.
- source_word: מִפְּנֵי
  choice: из-за
  rationale: Предлог здесь выражает причину наступившего запустения, а не пространственное отношение.
- source_word: חֲרוֹן אַף
  choice: пылающего гнева
  rationale: Устойчивое еврейское сочетание выражает сильный гнев через образ жара; «пылающий гнев» сохраняет эту метафору.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык; краткая пророческая строка сохраняет торжественный тон и образ опустевших пастбищ. Союз «И» передаёт связь с предыдущим стихом.
