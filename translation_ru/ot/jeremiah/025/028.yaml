  text: וְ/הָיָ֗ה כִּ֧י יְמָאֲנ֛וּ לָ/קַֽחַת הַ/כּ֥וֹס מִ/יָּדְ/ךָ֖ לִ/שְׁתּ֑וֹת וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת שָׁת֥וֹ תִשְׁתּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/028.yaml
  text: 'And if they refuse to take the cup from your hand to drink[a], then you shall say to them, ‘Thus says Yahweh of hosts: You shall surely drink.’'
translation:
  language: ru
  text: 'И если они откажутся взять чашу из твоей руки, чтобы выпить, то скажи им: «Так говорит Яхве Воинств: вы непременно выпьете[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально усиленная конструкция: «пить — выпьете»; она подчёркивает несомненность сказанного.'
    reason: Передача эмфатического инфинитива абсолютного при личной форме глагола без добавления оттенка обязанности.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И если
  rationale: Естественно передаёт условное значение еврейского оборота в контексте будущего действия.
- source_word: יְמָאֲנוּ
  choice: они откажутся
  rationale: Порода пиэль глагола מאן обозначает сознательный отказ или нежелание.
- source_word: לָקַחַת הַכּוֹס מִיָּדְךָ
  choice: взять чашу из твоей руки
  rationale: Сохраняет конкретную образность и единственное число еврейского текста.
- source_word: לִשְׁתּוֹת
  choice: чтобы выпить
  rationale: Передаёт цель, с которой предлагается взять чашу; совершенный вид естественен по-русски.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: то скажи им
  rationale: В последовательности пророческих наставлений форма выражает предписание; русский императив передаёт его прямо и естественно.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчиво и точно передаёт пророческую формулу посланника.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт собственное имя Яхве и сохраняет образное значение титула צבאות без замены толкованием «Всемогущий».
- source_word: שָׁתוֹ תִשְׁתּוּ
  choice: вы непременно выпьете
  rationale: Инфинитив абсолютный при личной форме усиливает категоричность и неизбежность действия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит Тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя.
- issue: Следует ли раскрывать образ чаши как Божий гнев
  choice: Сохранить слово «чаша» без поясняющего добавления
  alternative: чаша гнева; чаша Моего гнева
  rationale: Сам стих говорит только о чаше; контекстуальный смысл не следует вносить в основной текст.
- issue: Сила выражения שָׁתוֹ תִשְׁתּוּ
  choice: 'Категорическая неизбежность: «вы непременно выпьете»'
  alternative: вы должны выпить; пейте же
  rationale: Конструкция совмещает властную силу речи с уверенностью в исполнении; выбранный вариант сохраняет это напряжение, не сводя фразу лишь к приказу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Метафора чаши сохранена; синтаксис сделан естественным для широкого круга читателей. Местоимения, обращённые к людям, даны со строчной буквы.
