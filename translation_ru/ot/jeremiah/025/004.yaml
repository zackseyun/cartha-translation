  text: וְ/שָׁלַח֩ יְהוָ֨ה אֲלֵי/כֶ֜ם אֶֽת כָּל עֲבָדָ֧י/ו הַ/נְּבִאִ֛ים הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֣א שְׁמַעְתֶּ֑ם וְ/לֹֽא הִטִּיתֶ֥ם אֶֽת אָזְנְ/כֶ֖ם לִ/שְׁמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/004.yaml
  text: And Yahweh sent to you all his servants the prophets[a], rising early and sending them, but you did not listen, nor did you incline your ear to hear.
translation:
  language: ru
  text: И Яхве посылал к вам всех Своих слуг — пророков, с раннего утра посылал их[a], но вы не слушали и не склоняли уха, чтобы услышать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рано вставая и посылая». Это еврейское выражение подчёркивает, что Бог посылал пророков снова и снова, настойчиво и ревностно.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁלַח
  choice: И … посылал
  rationale: Форма Qal perfect вводит действие Яхве; русское несовершенное «посылал» естественно согласуется с последующим оборотом, указывающим на неоднократность посылания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: אֲלֵיכֶם
  choice: к вам
  rationale: Естественная русская передача направительного предлога с суффиксом второго лица множественного числа.
- source_word: כָּל עֲבָדָיו הַנְּבִאִים
  choice: всех Своих слуг — пророков
  rationale: «Слуги» передаёт почётное обозначение Божьих посланников; «пророков» является приложением, поясняющим, о каких слугах идёт речь.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: с раннего утра посылал их
  rationale: Сохраняет образ раннего вставания и повторного посылания, одновременно передавая устойчивый смысл ревностного и неоднократного действия. Местоимение «их» ясно отсылает к пророкам.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: но вы не слушали
  rationale: В контексте пророческого упрёка שׁמע означает не просто физически слышать, а внимать сказанному; союз «но» естественно выражает противопоставление.
- source_word: וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם לִשְׁמֹעַ
  choice: и не склоняли уха, чтобы услышать
  rationale: Сохраняет еврейскую метафору внимательного слушания; формулировка литературна, понятна и не сводит выражение исключительно к послушанию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе употреблено собственное имя Бога. «Яхве» прямо передаёт тетраграмматон и не подменяет его титулом.
- issue: Смысл שׁמע в упрёке народу
  choice: не слушали
  alternative: не слышали; не повиновались
  rationale: «Не слушали» сохраняет связь между слышанием и откликом, не сужая смысл ни до физического восприятия, ни исключительно до повиновения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены образ «с раннего утра» и метафора склонённого уха; тире ясно оформляет приложение «пророков».
