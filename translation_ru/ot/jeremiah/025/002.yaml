  rationale: Передаёт действие речи и естественно сочетается с последующим לֵאמֹר, не создавая повтора «сказал... сказав».
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: пророк Иеремия
  rationale: Естественный для современного русского порядок приложения; титул и имя сохранены.
- source_word: עַל כָּל עַם יְהוּדָה
  choice: перед всем народом Иудеи
  rationale: В сочетании с глаголом речи и параллельным וְאֶל выражает направленность речи к аудитории. «Перед» естественно обозначает публичное обращение и не навязывает значения «против».
- source_word: וְאֶל כָּל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: и всеми жителями Иерусалима
  rationale: После общего «перед» однородная группа оформлена творительным падежом; יֹשְׁבֵי передано современным и ясным словом «жители».
- source_word: לֵאמֹר
  choice: 'сказав:'
  rationale: Сохраняет еврейский вводный оборот, открывающий прямую речь следующего стиха.
