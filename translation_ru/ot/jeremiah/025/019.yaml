lexical_decisions:
- source_word: פַּרְעֹה
  choice: фараона
  rationale: Традиционная русская передача царского титула-имени; винительный падеж обусловлен повторяющимся показателем прямого дополнения אֶת и связью с предшествующим контекстом.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: царя Египта
  rationale: Сопряжённая конструкция прямо называет фараона правителем Египта; в русском естественно оформляется приложением.
- source_word: עֲבָדָיו
  choice: его слуг
  rationale: עֶבֶד может означать раба, слугу или царского служителя. Здесь широкое «слуги» сохраняет значение людей на службе фараона, не сужая его до рабского статуса или придворного круга.
- source_word: שָׂרָיו
  choice: его сановников
  rationale: שַׂר обозначает высокопоставленного правителя, начальника или должностное лицо. «Сановники» естественно передаёт контекст царской администрации и не подразумевает исключительно царских сыновей.
- source_word: כָּל עַמּוֹ
  choice: весь его народ
  rationale: Прямая и естественная передача собирательного עַם с сохранением всеохватности כָּל.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: перечень однородных дополнений
  rationale: Повтор אֶת размечает прямые дополнения в составе более длинного предложения. В русском он передаётся винительным падежом и сочинительной связью без механического повтора союза перед каждым элементом.
