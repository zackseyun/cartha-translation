  yaml_path: translation/ot/jeremiah/025/016.yaml
  text: They will drink[a], and stagger, and act like madmen because of the sword that I am sending among them.
translation:
  language: ru
  text: Они выпьют, зашатаются и будут вести себя как безумные[a] из-за меча, который Я посылаю в их среду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обезумеют». Еврейский глагол может обозначать как безумное поведение, так и состояние помешательства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁתוּ
  choice: Они выпьют
  rationale: Форма в пророческой последовательности имеет будущее значение и продолжает образ чаши; совершенный вид естественно передаёт завершённость питья.
- source_word: וְהִתְגֹּעֲשׁוּ
  choice: зашатаются
  rationale: Глагол выражает сильное колебание или неустойчивое движение; в контексте питья передаёт образ людей, которых шатает.
- source_word: וְהִתְהֹלָלוּ
  choice: будут вести себя как безумные
  rationale: Возвратно-интенсивная форма может обозначать безумное, неразумное поведение; перевод сохраняет поведенческий оттенок, не исключая значения «обезумеют».
- source_word: מִפְּנֵי הַחֶרֶב
  choice: из-за меча
  rationale: 'מִפְּנֵי здесь естественно понимать причинно: причиной их состояния станет посылаемый Богом меч.'
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ
  choice: который Я посылаю
  rationale: Причастие с אָנֹכִי передаёт непосредственное или уже совершаемое действие; настоящее время сохраняет эту силу.
- source_word: בֵּינֹתָם
  choice: в их среду
  rationale: Выражение обозначает направление меча внутрь сообщества народов и звучит естественно в современном литературном русском.
theological_decisions:
- issue: Образ Божьего суда
  choice: Сохранены конкретные образы питья, шатания, безумного поведения и меча, посылаемого Богом.
  alternative: Передать их отвлечённо как ужас, смятение или политический крах.
  rationale: Текст прямо связывает состояние народов с мечом, который Бог посылает в их среду; конкретная пророческая образность не должна сглаживаться.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой образности. Местоимение «Я» написано с прописной буквы как прямая речь Бога; синтаксис краткий и ритмичный.
