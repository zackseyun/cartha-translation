  terminology: «Цари севера», «царства земли» и транслитерация «Шешах» удачны. Сноска верно представляет отождествление с Вавилоном как вероятное, а не как подстановку в текст; якорь сноски поставлен непосредственно при имени, к которому относится пояснение.
