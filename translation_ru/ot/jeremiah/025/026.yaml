  text: וְ/אֵ֣ת כָּל מַלְכֵ֣י הַ/צָּפ֗וֹן הַ/קְּרֹבִ֤ים וְ/הָֽ/רְחֹקִים֙ אִ֣ישׁ אֶל אָחִ֔י/ו וְ/אֵת֙ כָּל הַ/מַּמְלְכ֣וֹת הָ/אָ֔רֶץ אֲשֶׁ֖ר עַל פְּנֵ֣י הָ/אֲדָמָ֑ה וּ/מֶ֥לֶךְ שֵׁשַׁ֖ךְ יִשְׁתֶּ֥ה אַחֲרֵי/הֶֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/026.yaml
  text: and all the kings of the north[a], both near and far, each one with his brother, and all the kingdoms of the earth that are on the face of the ground. And the king of Sheshach will drink after them.
translation:
  language: ru
  text: и всех царей севера, близких и далёких, одного за другим, и все царства земли, какие есть на её поверхности. А после них будет пить царь Шешаха[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шешах, по широко распространённому мнению, — зашифрованное название Вавилона, вероятно образованное посредством атбаша — замены букв еврейского алфавита в обратном порядке.
    reason: Поясняет вероятную идентификацию непрозрачного имени, не подменяя ею форму исходного текста.
lexical_decisions:
- source_word: מַלְכֵי הַצָּפוֹן
  choice: царей севера
  rationale: Сохраняет простую родительную конструкцию и геополитический смысл еврейского выражения, не уточняя конкретный регион.
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  choice: близких и далёких
  rationale: Естественная русская парная формула, передающая всеохватность исходного меризма.
- source_word: אִישׁ אֶל אָחִיו
  choice: одного за другим
  rationale: В перечне царей выражение обозначает их последовательное включение или расположение, а не буквальное родство; русский оборот естественно передаёт этот контекстуальный смысл.
- source_word: כָּל הַמַּמְלְכוֹת הָאָרֶץ
  choice: все царства земли
  rationale: Передаёт универсальный охват и сохраняет образ царств, принадлежащих земному миру.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: какие есть на её поверхности
  rationale: Естественно передаёт еврейскую формулу всемирного охвата, избегая тяжёлого русского повтора «земли… на лице земли».
- source_word: שֵׁשַׁךְ
  choice: Шешах
  rationale: Имя транслитерировано, а не заменено предполагаемым расшифрованным названием «Вавилон», поскольку в еврейском тексте стоит именно שֵׁשַׁךְ.
- source_word: יִשְׁתֶּה אַחֲרֵיהֶם
  choice: после них выпьет
  rationale: Сохраняет временную последовательность и продолжает образ чаши из контекста, не добавляя отсутствующее здесь слово «чаша».
theological_decisions:
- issue: Кого обозначает «Шешах»
  choice: Сохранить «Шешах» в основном тексте и пояснить вероятное отождествление с Вавилоном в сноске.
  alternative: Заменить в основном тексте на «Вавилон».
  rationale: Еврейский текст намеренно использует שֵׁשַׁךְ, а не בָּבֶל. Сохранение имени не устраняет заложенную в тексте непрозрачность, тогда как сноска сообщает читателю наиболее вероятное объяснение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Начальное «и» сохранено как связь с продолжающимся перечнем. Порядок слов в последнем предложении слегка перестроен ради естественного русского звучания и подчёркивания последовательности.
