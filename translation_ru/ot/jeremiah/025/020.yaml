lexical_decisions:
- source_word: הָעֶרֶב
  choice: смешанный народ
  rationale: Слово, вероятнее всего, обозначает смешанное население, а не один определённый этнос; перевод сохраняет собирательный смысл и не исключает иной трактовки.
- source_word: מַלְכֵי אֶרֶץ הָעוּץ
  choice: царей земли Уц
  rationale: Буквально передаёт географическое выражение; Уц сохранено как название земли.
- source_word: מַלְכֵי אֶרֶץ פְּלִשְׁתִּים
  choice: царей земли филистимлян
  rationale: Сохраняет этногеографическую форму еврейского текста и естественно звучит по-русски.
- source_word: אַשְׁקְלוֹן
  choice: Аскалона
  rationale: Традиционная русская библейская форма названия города, поставленная в родительном падеже по синтаксису перечня царей.
- source_word: עַזָּה
  choice: Газы
  rationale: Общепринятая современная русская форма названия, в родительном падеже по синтаксису.
- source_word: עֶקְרוֹן
  choice: Екрона
  rationale: Устоявшаяся русская библейская передача названия города, в родительном падеже по синтаксису.
- source_word: שְׁאֵרִית אַשְׁדּוֹד
  choice: остаток Азота
  rationale: 'Сохраняет неопределённость: речь может идти как об уцелевших жителях, так и о том, что осталось от города или города-государства.'
