base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/023.yaml
  text: and Dedan[a], and Tema, and Buz, and all who clip the corners of their hair,
translation:
  language: ru
  text: Дедан, Тема, Буз и все, кто подстригает волосы на висках[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все обрезающие край». Вероятно, речь идёт о тех, кто подстригает или сбривает волосы по бокам головы; возможно также понимание: край бороды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּדָן
  choice: Дедан
  rationale: Собственное имя народа или местности; передано традиционной русской транслитерацией.
- source_word: תֵּימָא
  choice: Тема
  rationale: Собственное имя аравийского оазиса или связанного с ним племени; передано принятой русской формой.
- source_word: בּוּז
  choice: Буз
  rationale: Собственное имя народа или области; транслитерировано.
- source_word: כָּל
  choice: все
  rationale: Сохраняет всеохватность еврейского определителя и естественно звучит в перечне народов.
- source_word: קְצוּצֵי
  choice: кто подстригает
  rationale: Причастная форма от קצץ обозначает тех, кто обрезает или подстригает; русское придаточное естественно передаёт характеристику группы.
- source_word: פֵאָה
  choice: волосы на висках
  rationale: Буквально «край, угол»; в данном этнографическом выражении, вероятнее всего, имеется в виду подстригание волос по бокам головы. Конкретизация делает идиому понятной, а возможное отношение к бороде отмечено в сноске.
