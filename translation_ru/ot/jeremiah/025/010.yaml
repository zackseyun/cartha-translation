  text: וְ/הַאֲבַדְתִּ֣י מֵ/הֶ֗ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה ק֥וֹל רֵחַ֖יִם וְ/א֥וֹר נֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/010.yaml
  text: And I will destroy from among them the sound of joy and the sound of gladness[a], the voice of the bridegroom and the voice of the bride[b], the sound of the millstones and the light of the lamp.
translation:
  language: ru
  text: И Я удалю из их среды звуки ликования и радости[a], голоса жениха и невесты[b], шум жерновов и свет светильника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я положу конец в их среде звукам ликования и радости». Еврейский глагол имеет каузативное значение: «заставить исчезнуть, прекратить».'
    reason: lexical_alternative
  - marker: b
    text: «Голоса жениха и невесты» — устойчивый образ свадебного торжества и нормальной жизни общины.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  choice: И Я удалю
  rationale: Hифиль глагола אבד выражает причинение исчезновения или прекращения. В данном контексте объектами служат звуки и свет, поэтому «удалю» естественно передаёт их устранение из жизни общины, не предполагая буквального уничтожения звуков.
- source_word: מֵהֶם
  choice: из их среды
  rationale: Предлог מן с местоименным суффиксом обозначает удаление изнутри сообщества; «из их среды» ясно и естественно передаёт этот смысл.
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: звуки ликования и радости
  rationale: קוֹל здесь означает слышимые проявления, а שָׂשׂוֹן и שִׂמְחָה образуют близкую по смыслу торжественную пару. «Ликование и радость» сохраняет некоторое различие между словами без архаизации.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: голоса жениха и невесты
  rationale: При обозначении людей קוֹל естественно передать словом «голос». Формула сохраняет свадебный образ нормальной общественной жизни.
- source_word: קוֹל רֵחַיִם
  choice: шум жерновов
  rationale: Рֵחַיִם обозначает парные жернова ручной мельницы. «Шум жерновов» идиоматично передаёт звук повседневного труда.
- source_word: אוֹר נֵר
  choice: свет светильника
  rationale: Прямо передаёт конструкцию «свет светильника» и образ обитаемого дома, не добавляя толкования.
theological_decisions:
- issue: Образ пророческого суда
  choice: Сохранён перечень исчезающих признаков праздничной, семейной и домашней жизни.
  alternative: Обобщить как «Я прекращу всякую радость и обычную жизнь».
  rationale: Еврейский текст выражает опустошение через конкретные звуки и свет. Их сохранение передаёт силу образа и не заменяет текст интерпретирующим пересказом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор еврейского קוֹל частично варьирован как «звуки», «голоса» и «шум» ради естественности русского языка; последовательность конкретных образов сохранена.
