  variant: modern literary Russian
source:
  edition: WLC
  text: ק֚וֹל צַעֲקַ֣ת הָֽ/רֹעִ֔ים וִֽ/ילְלַ֖ת אַדִּירֵ֣י הַ/צֹּ֑אן כִּֽי שֹׁדֵ֥ד יְהוָ֖ה אֶת מַרְעִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/036.yaml
  text: The sound of the cry of the shepherds[a], and the wailing of the leaders of the flock[b], for Yahweh is devastating their pasture.
translation:
  language: ru
  text: Раздаётся крик пастухов и рыдание вождей стада[a], потому что Яхве опустошает их пастбище.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могучих в стаде»; также возможно: «знатных в стаде».'
    reason: lexical_alternative
  - marker: b
    text: Образы пастухов, стада и пастбища, вероятно, относятся к правителям, тем, кто находится под их властью, и их земле.
    reason: cultural_note
lexical_decisions:
- source_word: קוֹל צַעֲקַת
  choice: Раздаётся крик
  rationale: Буквально сочетание указывает на «звук крика». Русское «раздаётся крик» естественно передаёт слышимый вопль бедствия, не утяжеляя фразу тавтологией.
- source_word: הָרֹעִים
  choice: пастухов
  rationale: Сохранён конкретный образ пастухов, хотя в контексте он, вероятно, обозначает правителей или других руководителей.
- source_word: וִילְלַת
  choice: и рыдание
  rationale: Слово обозначает громкий скорбный плач или вопль. «Рыдание» передаёт остроту горя и уместно в современном литературном русском.
- source_word: אַדִּירֵי הַצֹּאן
  choice: вождей стада
  rationale: אַדִּירֵי может обозначать могущественных, знатных или главных. «Вожди стада» сохраняет и представление о высоком положении, и образ стада; возможные более буквальные оттенки вынесены в примечание.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину крика и рыдания; «потому что» ясно выражает эту связь.
- source_word: שֹׁדֵד
  choice: опустошает
  rationale: Причастная форма описывает совершаемое разорение. «Опустошает» передаёт разрушительную силу действия и естественно сочетается с пастбищем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: מַרְעִיתָם
  choice: их пастбище
  rationale: «Пастбище» — прямое и современное соответствие слову, обозначающему место выпаса; оно сохраняет единую пастушескую метафору стиха.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Форма «Яхве» передаёт тетраграмматон как имя, не подменяя его титулом.
- issue: Истолкование образов пастухов, стада и пастбища
  choice: Сохранить метафору в основном тексте
  alternative: Передать прямо как правителей, подвластный им народ и их землю
  rationale: Образы, вероятно, относятся к руководителям и тем, кто находится под их властью, однако еврейский текст не раскрывает метафору прямо. Её сохранение не устраняет заложенную в тексте многозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого звучания. Пастушеская метафора удержана последовательно; синтаксис сделан естественным для русского читателя без ослабления картины бедствия.
