  text: וְ/אֵת֙ כָּל מַלְכֵי צֹ֔ר וְ/אֵ֖ת כָּל מַלְכֵ֣י צִיד֑וֹן וְ/אֵת֙ מַלְכֵ֣י הָ/אִ֔י אֲשֶׁ֖ר בְּ/עֵ֥בֶר הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/022.yaml
  text: and all the kings of Tyre[a], and all the kings of Sidon, and the kings of the coastland that is across the sea;
translation:
  language: ru
  text: и всех царей Тира, и всех царей Сидона, и царей побережья[a], что за морем;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «острова». Еврейское אִי может означать «остров», но в пророческой речи нередко обозначает шире побережье или приморскую область.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: всех
  rationale: В винительном контексте продолженного перечня естественно передаёт полный охват, выраженный כָּל.
- source_word: מַלְכֵי
  choice: царей
  rationale: Форма сопряжённого множественного числа от מֶלֶךְ прямо обозначает «царей»; зависимые названия переданы родительным падежом.
- source_word: צֹר
  choice: Тира
  rationale: Нормативная русская форма библейского топонима «Тир» в родительном падеже после «царей».
- source_word: צִידוֹן
  choice: Сидона
  rationale: Нормативная русская форма библейского топонима «Сидон» в родительном падеже после «царей».
- source_word: הָאִי
  choice: побережья
  rationale: אִי может означать остров, но в пророческой географии нередко обозначает приморскую землю или побережье; здесь такой вариант естественнее сочетается с указанием «за морем» и не сужает смысл до острова.
- source_word: אֲשֶׁר בְּעֵבֶר הַיָּם
  choice: что за морем
  rationale: Передаёт относительное אֲשֶׁר и пространственное значение בְּעֵבֶר הַיָּם кратко и естественно по-русски.
- source_word: וְאֵת ... וְאֵת ... וְאֵת
  choice: и ... и ... и
  rationale: Повтор союза сохраняет ритм и структуру продолжающегося перечня; показатель прямого дополнения отдельно не переводится.
