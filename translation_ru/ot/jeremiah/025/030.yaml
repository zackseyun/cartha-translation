source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּנָּבֵ֣א אֲלֵי/הֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם יְהוָ֞ה מִ/מָּר֤וֹם יִשְׁאָג֙ וּ/מִ/מְּע֤וֹן קָדְשׁ/וֹ֙ יִתֵּ֣ן קוֹל֔/וֹ שָׁאֹ֤ג יִשְׁאַג֙ עַל נָוֵ֔/הוּ הֵידָד֙ כְּ/דֹרְכִ֣ים יַֽעֲנֶ֔ה אֶ֥ל כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/030.yaml
  text: 'And you, you shall prophesy all these words against them, and you shall say to them: The LORD will roar from on high, and from his holy dwelling he will give his voice; he will surely roar against his pasture. He will answer with a shout like those who tread grapes, against all the inhabitants of the earth.'
translation:
  language: ru
  text: 'А ты пророчествуй против них, возвещая все эти слова, и скажи им: «Господь возрычит с высоты и из Своей святой обители подаст Свой голос; громко возрычит Он против Своего пастбища. Криком, подобно топчущим виноград, Он ответит всем жителям земли».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, соответствующая контексту и принятому литературному библейскому регистру.
- source_word: יִשְׁאָג / שָׁאֹג יִשְׁאַג
  choice: возрычит / громко возрычит
  rationale: Глагол описывает мощный рёв, прежде всего львиный; сочетание инфинитива абсолютного с личной формой передаёт усиление.
- source_word: מִמָּרוֹם
  choice: с высоты
  rationale: Сохраняет пространственный образ небесной высоты без добавочного толкования.
- source_word: מִמְּעוֹן קָדְשׁוֹ
  choice: из Своей святой обители
  rationale: מָעוֹן — место пребывания, обитель; формулировка естественна и сохраняет сакральный регистр.
- source_word: עַל נָוֵהוּ
  choice: на Своё пастбище
  rationale: נָוֶה может означать пастбище, жилище или обитель; образ пастбища уместен рядом со львиным рыком, однако двусмысленность отмечается в сноске.
- source_word: הֵידָד
  choice: криком
  rationale: Обозначает громкий возглас, в данном сравнении — ритмический крик топчущих виноград.
- source_word: יַעֲנֶה
  choice: отзовётся
  rationale: Сохраняет основное значение «ответит, откликнется» и необычную образность текста, не заменяя её простым «закричит».
- source_word: הָאָרֶץ
  choice: земли
  rationale: В универсальном выражении «все жители земли» слово естественно понимается как вся земля; формальная неоднозначность между «землёй» и «страной» остаётся контекстуально допустимой.
theological_decisions:
- issue: 'Направление Божьего рыка: עַל נָוֵהוּ'
  choice: «на Своё пастбище»
  alternative: «против Своей обители» или «над Своим пастбищем»
  rationale: Предлог עַל допускает оттенки «на, над, против». Контекст суда поддерживает направленность действия, но перевод не уточняет богословски, кого именно обозначает «пастбище».
- issue: Объём выражения כָּל יֹשְׁבֵי הָאָרֶץ
  choice: «всех жителей земли»
  alternative: «всех жителей страны»
  rationale: Контекст окружающего пророчества о народах благоприятствует универсальному прочтению, но существительное само по себе допускает оба значения.
translation_notes:
  register: Современный литературный русский с dignified библейским звучанием. Повтор усилительной конструкции передан не буквальным «рыча возрычит», а естественным «громко возрычит». Местоимение «Своей» написано с прописной буквы по распространённой русской библейской традиции; синтаксис сохраняет последовательность пророческого повеления и прямой речи.
