base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/033.yaml
  text: And the slain of Yahweh on that day will be from one end of the earth even to the other end of the earth[a]. They will not be mourned, or gathered, or buried[c][b]; they will become dung on the surface of the ground.
translation:
  language: ru
  text: В тот день от одного края земли до другого будут лежать убитые Яхве[a][b]. Их не будут оплакивать, не соберут и не похоронят; они станут навозом на поверхности почвы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кого убил Яхве». Еврейское сочетание может более прямо указывать на то, что именно Яхве предал их смерти.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «от одного края страны до другого». Еврейское אֶרֶץ может означать как «землю», так и «страну»; здесь выбран более широкий смысл ввиду контекста суда над народами.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на лице почвы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלְלֵי יְהוָה
  choice: убитые Яхве
  rationale: חַלְלֵי — форма множественного числа в сопряжённом состоянии со значением «убитые, поражённые насмерть». Русское сочетание сохраняет краткость и суровую образность оригинала; наиболее вероятна мысль об убитых в результате суда Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом «Господь».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская формула, сохраняющая пророческий регистр.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: от одного края земли до другого
  rationale: Передаёт меризм и всеохватный размах суда без тяжеловесного повтора «края земли»; אֶרֶץ здесь понято как «земля» в широком смысле, хотя значение «страна» возможно.
- source_word: לֹא יִסָּפְדוּ
  choice: их не будут оплакивать
  rationale: Nifal глагола ספד обозначает отсутствие погребального плача по погибшим.
- source_word: וְלֹא יֵאָסְפוּ
  choice: не соберут
  rationale: Речь о телах, которые не соберут после бедствия; формулировка сохраняет последовательность действий перед погребением.
- source_word: וְלֹא יִקָּבֵרוּ
  choice: не похоронят
  rationale: Прямая и естественная передача страдательной формы глагола קבר.
- source_word: לְדֹמֶן
  choice: навозом
  rationale: Сохраняет резкий, унизительный образ пророческой речи; более мягкое «отбросами» ослабило бы его.
- source_word: עַל־פְּנֵי הָאֲדָמָה
  choice: на поверхности земли
  rationale: Естественно передаёт буквальный образ «на лице почвы/земли».
- source_word: יִהְיוּ
  choice: станут
  rationale: В сочетании с לְדֹמֶן глагол выражает итоговое состояние; «станут навозом» передаёт его без добавления отсутствующего в еврейском тексте сравнения «как».
theological_decisions:
- issue: Значение אֶרֶץ
  choice: земля
  alternative: страна
  rationale: Контекст пророчества о народах и меризм «от одного края… до другого» поддерживают широкий охват. Лексически возможное локальное значение отмечено в сноске.
- issue: Смысл сочетания חַלְלֵי יְהוָה
  choice: убитые Яхве
  alternative: убитые, принадлежащие Яхве
  rationale: Сопряжённая конструкция допускает некоторую формальную неоднозначность, однако в контексте суда естественнее понимать Яхве как деятеля или первопричину гибели. Краткая конструкция основного текста не расширена пояснением, а смысл уточнён в сноске.
- issue: Характер выражения לְדֹמֶן ... יִהְיוּ
  choice: станут навозом
  alternative: будут словно навоз
  rationale: В еврейском тексте нет явного показателя сравнения; результативная формулировка сохраняет жёсткость образа и не превращает метафору в явно выраженное сравнение.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Начальное «В тот день» вынесено вперёд ради естественного русского синтаксиса. Слово «повсюду» введено для ясного выражения еврейской конструкции существования и последующего меризма; тире подчёркивает пояснение «от одного края земли до другого». Сохранена резкость заключительного образа.
