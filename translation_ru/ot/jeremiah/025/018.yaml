  yaml_path: translation/ot/jeremiah/025/018.yaml
  text: Jerusalem[a], the cities of Judah, her kings, and her officials—to make them a ruin, a horror, a hissing, and a curse[b], as it is this day.
translation:
  language: ru
  text: Иерусалим, города Иудеи, её царей и её сановников — чтобы предать их разорению и сделать ужасом, предметом насмешливого свиста[a] и проклятием, как это и есть сегодня.
