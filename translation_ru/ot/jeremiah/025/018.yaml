lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
- source_word: עָרֵי יְהוּדָה
  choice: города Иудеи
  rationale: Естественно передаёт еврейскую сопряжённую конструкцию и географическую принадлежность.
- source_word: מְלָכֶיהָ
  choice: её царей
  rationale: Суффикс 3-го лица женского рода относится к Иудее как к женскому коллективному образу; местоимение сохраняет связь с оригиналом.
- source_word: שָׂרֶיהָ
  choice: её вельмож
  rationale: שׂרים обозначает высокопоставленных правителей и должностных лиц; «вельможи» здесь естественно сочетается с царями и не ограничивает значение царскими сыновьями.
- source_word: לָתֵת אֹתָם
  choice: чтобы обратить их… сделать их
  rationale: נתן с последующими существительными с ל выражает приведение к состоянию или результат; вариативное русское выражение устраняет тяжёлый повтор.
- source_word: לְחָרְבָּה
  choice: в развалины
  rationale: Конкретно и естественно передаёт состояние полного разорения; множественное число согласуется с рядом городов, царей и вельмож.
- source_word: לְשַׁמָּה
  choice: ужасом
  rationale: Слово обозначает опустошение, вызывающее потрясение и ужас; перевод сохраняет реакцию наблюдателей.
- source_word: לִשְׁרֵקָה
  choice: предметом насмешливого свиста
  rationale: Передаёт конкретный звук, которым свидетели выражают презрение или насмешку при виде разорения.
- source_word: וְלִקְלָלָה
  choice: проклятием
  rationale: 'Сохраняет краткий образ: разорённое место становится образцом, упоминаемым в проклятиях.'
- source_word: כַּיּוֹם הַזֶּה
  choice: как это и есть сегодня
  rationale: Передаёт указание на нынешнее для говорящего положение как на очевидное подтверждение сказанного.
