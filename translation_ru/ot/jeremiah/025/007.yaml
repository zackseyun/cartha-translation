  text: וְ/לֹֽא שְׁמַעְתֶּ֥ם אֵלַ֖/י נְאֻם יְהוָ֑ה לְמַ֧עַן הכעסו/ני בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶ֖ם לְ/רַ֥ע לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/007.yaml
  text: Yet you did not listen to me[a], declares Yahweh, to provoke me to anger by the work of your hands, to your own harm.
translation:
  language: ru
  text: Но вы не слушали Меня, — возвещает Яхве, — чтобы разгневать Меня делами своих рук[a] — себе же во вред.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «творениями своих рук». У Иеремии это выражение нередко обозначает идолов или дела, связанные с идолопоклонством.'
    reason: Лексическая альтернатива и контекстуальный оттенок устойчивого выражения.
lexical_decisions:
- source_word: וְלֹא שְׁמַעְתֶּם אֵלַי
  choice: Но вы не слушали Меня
  rationale: Союз передаёт противопоставление неоднократным призывам Бога в контексте; «слушали» сохраняет смысл восприятия речи, не сводя глагол только к послушанию.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественную пророческую формулу и передаёт личное имя יהוה как «Яхве».
- source_word: לְמַעַן הַכְעִסוּנִי
  choice: и тем вызывали Мой гнев
  rationale: לְמַעַן допускает оттенок цели или результата. В русском оборот «и тем» естественно выражает связь между отказом слушать и вызванным гневом, не утверждая однозначно, что гнев Бога был сознательной целью народа.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: делами своих рук
  rationale: Сохраняет образное выражение оригинала; единственное число собирательно, поэтому естественное русское множественное число передаёт совокупность сделанного ими и не сужает смысл исключительно до идолов.
- source_word: לְרַע לָכֶם
  choice: себе же во вред
  rationale: Естественно передаёт пагубное последствие, обращающееся против самих адресатов.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя.
- issue: Относится ли בְּמַעֲשֵׂה יְדֵיכֶם прямо к идолам
  choice: делами своих рук
  alternative: идолами, сделанными вашими руками
  rationale: У Иеремии выражение часто связано с идолопоклонством, однако данный стих прямо не называет идолов; основной текст сохраняет более широкую формулировку.
- issue: Цель или результат в לְמַעַן
  choice: и тем вызывали Мой гнев
  alternative: чтобы вызвать Мой гнев
  rationale: Так сохраняется богословское и грамматическое напряжение без категоричного приписывания народу сознательной цели разгневать Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные буквы в местоимениях «Меня», «Мой» употреблены как уважительная издательская норма. Тире помогают ясно оформить вводную пророческую формулу и заключительное следствие.
