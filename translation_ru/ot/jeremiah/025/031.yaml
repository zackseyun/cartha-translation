  text: בָּ֤א שָׁאוֹן֙ עַד קְצֵ֣ה הָ/אָ֔רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ בַּ/גּוֹיִ֔ם נִשְׁפָּ֥ט ה֖וּא לְ/כָל בָּשָׂ֑ר הָ/רְשָׁעִ֛ים נְתָנָ֥/ם לַ/חֶ֖רֶב נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/031.yaml
  text: An uproar has come to the end of the earth[a], for Yahweh has a case against the nations; he is entering into judgment with all flesh. He has given the wicked to the sword[d][c][b], declares Yahweh.
translation:
  language: ru
  text: Шум дошёл до края земли[a], потому что у Яхве есть тяжба с народами; Он судится со всякой плотью[b]. Нечестивых Он предал мечу[c], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гул», «грохот» или «смятение».'
    reason: lexical_alternative
  - marker: b
    text: «Всякая плоть» — библейское выражение, означающее всё человечество.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «отдал во власть меча».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוֹן
  choice: шум
  rationale: Передаёт громкий гул и смятение в контексте суда; сохраняет широту значения еврейского слова.
- source_word: בָּא
  choice: дошёл
  rationale: Совершенный вид естественно передаёт qatal как уже достигшее предела движение в пророческом изображении.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: до края земли
  rationale: Сохраняет единственное число קְצֵה и пространственный образ исходного текста.
- source_word: רִיב לַיהוָה בַּגּוֹיִם
  choice: у Яхве тяжба с народами
  rationale: «Тяжба» сохраняет юридический смысл רִיב, а «с народами» естественно передаёт участников разбирательства, не устраняя оттенка противостояния.
- source_word: נִשְׁפָּט הוּא
  choice: Он судится
  rationale: Возвратная форма передаёт юридическое действие Niphal и сохраняет напряжение между участием Яхве в тяжбе и Его судебной властью.
- source_word: לְכָל בָּשָׂר
  choice: со всякой плотью
  rationale: Сохраняет библейский образ и универсальный охват выражения; значение поясняется в сноске.
- source_word: הָרְשָׁעִים
  choice: нечестивых
  rationale: Передаёт нравственную характеристику субстантивированного прилагательного без сведения её только к юридической виновности.
- source_word: נְתָנָם לַחֶרֶב
  choice: Нечестивых Он предал мечу
  rationale: Естественная русская формула, передающая вручение или обречение на гибель от меча.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная и понятная формула пророческого речения, сохраняющая авторитет высказывания.
theological_decisions:
- issue: Юридический образ Божьего суда
  choice: «у Яхве тяжба… Он судится»
  alternative: «Яхве обвиняет… Он судит»
  rationale: Сочетание רִיב и נשפט требует сохранить судебно-правовую образность и не сводить её лишь к вынесению приговора; русский глагол «судится» также удерживает заложенную в форме неоднозначность.
- issue: Охват выражения כָל־בָּשָׂר
  choice: «со всякой плотью»
  alternative: «со всем человечеством»
  rationale: Буквенный образ сохраняет универсальность суда и библейскую выразительность; идиоматический смысл дан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Сохранены юридическая образность, выражение «всякая плоть» и личное имя Яхве; синтаксис сделан ясным для обычного читателя.
