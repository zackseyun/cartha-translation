base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/005.yaml
  text: saying[a], ‘Please turn back, each man from his evil way and from the evil of your deeds[b], and dwell in the land that Yahweh gave to you and to your fathers from of old and forever.’
translation:
  language: ru
  text: 'говоря: «Прошу, обратитесь каждый от своего злого пути и от зла ваших дел и живите на земле, которую Яхве дал вам и вашим отцам — от века и до века».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от века и до века»; временной оборот охватывает прошлое и будущее и относится к дарованию земли.'
    reason: cultural_note
lexical_decisions:
- source_word: לֵאמֹר
  choice: говоря
  rationale: Инфинитив вводит содержание неоднократно передаваемого пророческого призыва; русское деепричастие сохраняет связь с предыдущим стихом.
- source_word: שׁוּבוּ נָא
  choice: Прошу вас, пусть каждый отвернётся
  rationale: שׁוּב обозначает возвращение или поворот, здесь — отказ от дурного образа жизни; נָא передаёт настойчивую просьбу, а не значение времени.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: каждый отвернётся от своего злого пути
  rationale: Дистрибутивное אִישׁ естественно передаётся словом «каждый»; «путь» сохраняет нравственную метафору образа жизни.
- source_word: וּמֵרֹעַ מַעַלְלֵיכֶם
  choice: и от зла ваших дел
  rationale: Сохранены абстрактное רֹעַ «зло» и конкретное מַעֲלָלִים «дела», а также переход от единственного распределительного к множественному обращению.
- source_word: וּשְׁבוּ עַל הָאֲדָמָה
  choice: и живёт на земле
  rationale: יָשַׁב в контексте дарованной земли означает постоянное проживание; «на земле» естественно передаёт עַל и не смешивает אֲדָמָה с названием страны.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменено титулом.
- source_word: לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: вам и вашим отцам
  rationale: Сохраняется семейно-заветная формулировка «отцам», а также множественное обращение.
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  choice: с давних времён и навеки
  rationale: 'Переданы разные временные направления идиомы: первый оборот обращён в прошлое, второй — в будущее.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Соотношение призыва к обращению и обещания жить на земле
  choice: оба глагола переданы как части одного призыва без добавления условной связки
  alternative: «тогда будете жить»
  rationale: Еврейский текст соединяет императивы союзом וְ и прямо не выражает следствие; перевод не должен устранять эту синтаксическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Прошу вас» естественно передаёт частицу мольбы נָא; конструкция «пусть каждый» позволяет согласовать единственное распределительное обращение с последующим множественным «ваших».
