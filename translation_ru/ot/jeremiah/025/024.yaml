lexical_decisions:
- source_word: מַלְכֵי
  choice: царей
  rationale: Форма сопряжённого множественного числа от מֶלֶךְ; зависимая группа естественно передаётся по-русски родительным падежом.
- source_word: עֲרָב
  choice: Аравии
  rationale: Собственное имя обозначает Аравию или её народы; в перечне народов и царств географическое название звучит естественно.
- source_word: הָעֶרֶב
  choice: смешанных племён
  rationale: Это слово отличается от предшествующего עֲרָב и здесь, вероятнее всего, обозначает смешанное население; перевод сохраняет лексическое различие и согласуется с последующим определением.
- source_word: הַשֹּׁכְנִים
  choice: живущих
  rationale: Причастие qal множественного числа от ישׁב атрибутивно характеризует смешанные племена; «живущих» ясно и естественно в современном русском языке.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; «в пустыне» естественно и точно в данном контексте.
- source_word: וְאֵת ... וְאֵת
  choice: и ... и
  rationale: Повтор союза с показателем прямого дополнения продолжает перечень; непереводимый показатель дополнения опускается, а добавочное значение сохраняется повтором «и».
