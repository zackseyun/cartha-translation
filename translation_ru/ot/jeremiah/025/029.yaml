  source_fidelity: 'Смысл исходного текста в целом передан верно: начало наведения бедствия, усиленный риторический вопрос о безнаказанности, отрицательный ответ, призыв меча и всеобщий охват сохранены. Однако русское «провозглашено Моё имя над городом» неоправданно сдвигает идиому נִקְרָא שְׁמִי עָלֶיהָ к акту публичного возвещения. Здесь речь о том, что город носит имя Яхве / назван Его именем, то есть отмечен принадлежностью Ему.'
