  text: כִּי֩ הִנֵּ֨ה בָ/עִ֜יר אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עָלֶ֗י/הָ אָֽנֹכִי֙ מֵחֵ֣ל לְ/הָרַ֔ע וְ/אַתֶּ֖ם הִנָּקֵ֣ה תִנָּק֑וּ לֹ֣א תִנָּק֔וּ כִּ֣י חֶ֗רֶב אֲנִ֤י קֹרֵא֙ עַל כָּל יֹשְׁבֵ֣י הָ/אָ֔רֶץ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/029.yaml
  text: For behold[a], in the city over which my name is called, I am beginning to bring harm, and shall you indeed go unpunished? You shall not go unpunished, for I am calling for a sword against all the inhabitants of the earth[b], declares Yahweh of hosts.
translation:
  language: ru
  text: 'Ибо вот: Я начинаю наводить бедствие на город, названный Моим именем[a], — неужели же вы останетесь без наказания? Нет, вы не останетесь без наказания, ибо Я призываю меч на всех жителей земли[b], — возвещает Яхве воинств.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на город, над которым названо Моё имя». Буквально: «на город, над которым названо Моё имя»; это еврейская идиома, указывающая на принадлежность города Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на всех жителей страны». Еврейское слово אֶרֶץ может означать и «землю», и «страну».'
    reason: alternative_reading
lexical_decisions:
- source_word: בָעִיר אֲשֶׁר נִקְרָא שְׁמִי עָלֶיהָ
  choice: на город, над которым провозглашено Моё имя
  rationale: Сохраняет образ еврейской идиомы «имя провозглашено над», выражающей принадлежность города Яхве, и при этом понятно по-русски.
- source_word: מֵחֵל לְהָרַע
  choice: начинаю наводить бедствие
  rationale: Конструкция передаёт начало действия; в данном контексте רעה обозначает губительное бедствие как суд, а не нравственное зло.
- source_word: הִנָּקֵה תִנָּקוּ / לֹא תִנָּקוּ
  choice: неужели же вы останетесь без наказания? Нет, вы не останетесь без наказания
  rationale: Инфинитив абсолютный усиливает риторический вопрос. Повтор одного русского выражения сохраняет настойчивость и судебный смысл оригинала.
- source_word: חֶרֶב אֲנִי קֹרֵא
  choice: Я призываю меч
  rationale: Сохраняется конкретный образ меча, олицетворённого как призываемый исполнитель суда.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: всех жителей земли
  rationale: אֶרֶץ допускает значения «земля» и «страна»; широкий контекст суда над народами поддерживает «земля», но региональный смысл отмечен в сноске.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Яхве Воинств
  rationale: «Возвещает» естественно передаёт пророческую формулу נְאֻם; имя Яхве транслитерировано, а צְבָאוֹת передано традиционно и ёмко как «Воинств».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя без замены титулом.
- issue: Смысл לְהָרַע применительно к действию Бога
  choice: наводить бедствие
  alternative: делать зло; причинять вред
  rationale: В судебном контексте глагол означает наведение бедствия, а не совершение нравственного зла; перевод не устраняет суровость Божьего суда.
- issue: Объём значения הָאָרֶץ
  choice: земля
  alternative: страна
  rationale: Контекст главы расширяет суд от Иерусалима к народам, поддерживая всемирное прочтение, однако лексическая двусмысленность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены риторический вопрос, его категорическое отрицание и конкретный образ призываемого меча; синтаксис слегка упорядочен ради естественности.
