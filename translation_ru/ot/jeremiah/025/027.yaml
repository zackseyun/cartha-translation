source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁת֤וּ וְ/שִׁכְרוּ֙ וּ/קְי֔וּ וְ/נִפְל֖וּ וְ/לֹ֣א תָק֑וּמוּ מִ/פְּנֵ֣י הַ/חֶ֔רֶב אֲשֶׁ֛ר אָנֹכִ֥י שֹׁלֵ֖חַ בֵּינֵי/כֶֽםס־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/027.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Drink and become drunk, and vomit, and fall, and do not rise, because of the sword that I am sending among you.’'
translation:
  language: ru
  text: 'И скажи им: «Так говорит Яхве Воинств, Бог Израиля: пейте и пьянейте, извергните, падайте и не вставайте из-за меча, который Я посылаю среди вас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: И скажи им
  rationale: Вав с перфектом в пророческом поручении передаёт последовательное указание; русский императив естественно сохраняет директивный смысл.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула в настоящем времени сохраняет непосредственность Божьего слова.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией, а צְבָאוֹת — широким обозначением сил и воинств под властью Бога, без сужения до одних земных армий.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямой и естественный перевод сочетания в сопряжённом состоянии.
- source_word: שְׁתוּ וְשִׁכְרוּ
  choice: пейте и пьянейте
  rationale: 'Сохранены два последовательных повелительных глагола: пить и приходить в состояние опьянения.'
- source_word: וּקְיוּ
  choice: извергайте выпитое
  rationale: Редкий глагол обозначает рвоту; выбран ясный, но не сниженный русский оборот. Более резкий буквальный вариант дан в примечании.
- source_word: וְנִפְלוּ וְלֹא תָקוּמוּ
  choice: падайте и не вставайте
  rationale: Буквальная последовательность сохраняет одновременно образ опьянения и смысл окончательного поражения, не добавляя отсутствующего в тексте «никогда» или «снова».
- source_word: מִפְּנֵי הַחֶרֶב
  choice: из-за меча
  rationale: В данном контексте מִפְּנֵי указывает на причину падения и невозможности встать; «из-за» естественно выражает эту связь по-русски.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ בֵּינֵיכֶם
  choice: который Я посылаю среди вас
  rationale: «Среди вас» сохраняет пространственный оттенок בֵּינֵיכֶם и образ меча, проходящего среди народов, не усиливая значение до «против вас».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Смысл образа опьянения
  choice: Сохранена цепочка буквальных повелений без пояснения метафоры
  alternative: Явно истолковать чашу и опьянение как Божий суд
  rationale: Контекст связывает опьянение с мечом и судом, но сам стих выражает это образно; перевод не должен устранять напряжение между буквальным образом и его судебным смыслом.
translation_notes:
  register: Современный литературный русский с торжественным пророческим тоном. Сохранены краткие повелительные формы и нарастающая последовательность действий; избегнуты как архаизмы, так и разговорно-сниженная лексика в основном тексте.
