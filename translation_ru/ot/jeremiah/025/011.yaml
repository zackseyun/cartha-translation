base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/011.yaml
  text: And all this land will become a ruin and a horror[a], and these nations will serve the king of Babylon for seventy years.
translation:
  language: ru
  text: И вся эта земля превратится в развалины и станет предметом ужаса[a], и эти народы будут служить царю Вавилона семьдесят лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зрелищем, вызывающим ужас»; подчёркивается потрясение тех, кто увидит опустошённую землю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: И ... превратится
  rationale: Перфект с וְ в пророческой речи имеет будущее значение; «превратится» естественно передаёт наступление нового, опустошённого состояния.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: вся эта земля
  rationale: В данном историческом контексте אֶרֶץ обозначает землю, о которой идёт речь, а не весь мир; перевод сохраняет כָּל и указательное הַזֹּאת.
- source_word: לְחָרְבָּה
  choice: в развалины
  rationale: Слово обозначает разорение и опустошение; множественное «развалины» конкретно и естественно по-русски описывает итог разрушения земли.
- source_word: לְשַׁמָּה
  choice: станет ужасом
  rationale: שַׁמָּה выражает вызывающее потрясение зрелище опустошения; «станет ужасом» сохраняет краткость и допускает как состояние ужаса, так и вызывающий ужас объект.
- source_word: וְעָבְדוּ
  choice: будут служить
  rationale: Глагол עבד с прямым дополнением здесь означает служение правителю и политическое подчинение, не сводя смысл только к труду.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: эти народы
  rationale: גּוֹיִם здесь обозначает политические народы; «эти народы» — точный и нейтральный современный эквивалент.
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: царю Вавилона
  rationale: После русского «служить» требуется дательный падеж; конструкция естественно передаёт еврейское «царя Вавилона».
- source_word: שִׁבְעִים שָׁנָה
  choice: семьдесят лет
  rationale: Прямой и идиоматичный перевод обозначения продолжительности времени; отдельный предлог в русском не требуется.
theological_decisions:
- issue: Объём значения «земля» в пророчестве о суде
  choice: Речь идёт о всей данной земле, находящейся под судом, а не обо всей планете.
  alternative: «Вся земля» может пониматься шире или гиперболически как весь мир.
  rationale: Ближайший контекст говорит об Иудее и окружающих народах под властью Вавилона; «вся эта земля» сохраняет указание исходного текста и не расширяет географический охват.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Синтаксический параллелизм оригинала сохранён; архаизмы и конфессионально окрашенные уточнения не вводятся.
