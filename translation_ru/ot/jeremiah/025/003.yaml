  text: מִן שְׁלֹ֣שׁ עֶשְׂרֵ֣ה שָׁנָ֡ה לְ/יֹאשִׁיָּ֣הוּ בֶן אָמוֹן֩ מֶ֨לֶךְ יְהוּדָ֜ה וְ/עַ֣ד הַ/יּ֣וֹם הַ/זֶּ֗ה זֶ֚ה שָׁלֹ֤שׁ וְ/עֶשְׂרִים֙ שָׁנָ֔ה הָיָ֥ה דְבַר יְהוָ֖ה אֵלָ֑/י וָ/אֲדַבֵּ֧ר אֲלֵי/כֶ֛ם אַשְׁכֵּ֥ים וְ/דַבֵּ֖ר וְ/לֹ֥א שְׁמַעְתֶּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/003.yaml
  text: From the thirteenth year of Josiah son of Amon[a], king of Judah, even to this day, these twenty-three years, the word of Yahweh has come to me, and I have spoken to you, rising early and speaking, but you have not listened.
translation:
  language: ru
  text: С тринадцатого года царствования Иосии, сына Амона и царя Иудеи, до сего дня — вот уже двадцать три года — слово Яхве приходило ко мне; и я говорил вам неустанно[a], но вы не слушали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вставал рано и говорил» — еврейское выражение, обозначающее усердное и неоднократное действие.'
    reason: Сохраняет буквальный образ идиомы אַשְׁכֵּים וְדַבֵּר, тогда как основной текст передаёт её смысл.
lexical_decisions:
- source_word: מִן ... וְעַד
  choice: С ... и до
  rationale: Ясно передаёт весь временной промежуток от начальной точки до настоящего дня.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה לְיֹאשִׁיָּהוּ
  choice: с тринадцатого года правления Иосии
  rationale: Речь идёт о тринадцатом годе царствования Иосии; добавление «правления» устраняет возможное понимание как возраста.
- source_word: הַיּוֹם הַזֶּה
  choice: сего дня
  rationale: Сохраняет торжественный дейктический оттенок исходного выражения и уместно в литературной пророческой речи.
- source_word: זֶה שָׁלֹשׁ וְעֶשְׂרִים שָׁנָה
  choice: вот уже двадцать три года
  rationale: Естественно по-русски передаёт указательное זֶה и подчёркивает длительность периода до настоящего момента.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: ко мне было слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и не превращает «слово» в неопределённую серию сообщений.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: Я говорил вам
  rationale: Русское прошедшее несовершенного вида выражает повторяющееся действие в течение названного периода.
- source_word: אַשְׁכֵּים וְדַבֵּר
  choice: настойчиво, снова и снова
  rationale: Передаёт идиоматический смысл раннего вставания как усердного и многократного действия; буквальный образ сохранён в примечании.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: но вы не слушали
  rationale: Сохраняет слуховой образ глагола שׁמע и не сужает его значение до прямого «не повиновались».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Передача пророческой идиомы אַשְׁכֵּים וְדַבֵּר
  choice: настойчиво, снова и снова
  alternative: вставал рано и говорил
  rationale: Основной текст передаёт значение упорного, многократного обращения, а примечание сохраняет буквальный образ и тем самым не скрывает особенность оригинала.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной пророческой интонацией. Конструкция «ко мне было слово» и выражение «до сего дня» сохраняют библейское достоинство, оставаясь понятными; идиома передана естественно, с буквальным вариантом в примечании.
