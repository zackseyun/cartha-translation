  - severity: medium
    issue: Неестественная конструкция «ко мне было слово Яхве».
    rationale: При временном отрезке «с ... до сего дня — вот уже двадцать три года» русский глагол «приходило» естественно выражает продолжающееся/повторяющееся получение пророческого слова и сохраняет формульный характер оригинала.
  - severity: low
    issue: Смысловая избыточность в «настойчиво, снова и снова».
    rationale: Оба наречия передают один и тот же аспект идиомы אַשְׁכֵּים וְדַבֵּר. «Неустанно» сохраняет смысл без утяжеления, а буквальное выражение документировано в сноске.
  revised_text: С тринадцатого года царствования Иосии, сына Амона и царя Иудеи, до сего дня — вот уже двадцать три года — слово Яхве приходило ко мне; и я говорил вам неустанно[a], но вы не слушали.
