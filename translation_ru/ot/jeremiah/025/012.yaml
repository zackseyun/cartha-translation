  text: וְ/הָיָ֣ה כִ/מְלֹ֣אות שִׁבְעִ֣ים שָׁנָ֡ה אֶפְקֹ֣ד עַל מֶֽלֶךְ בָּבֶל֩ וְ/עַל הַ/גּ֨וֹי הַ/ה֧וּא נְאֻם יְהוָ֛ה אֶת עֲוֺנָ֖/ם וְ/עַל אֶ֣רֶץ כַּשְׂדִּ֑ים וְ/שַׂמְתִּ֥י אֹת֖/וֹ לְ/שִֽׁמְמ֥וֹת עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/012.yaml
  text: And when seventy years are completed[a], I will punish the king of Babylon and that nation—oracle of Yahweh—for their iniquity, and the land of the Chaldeans[b], and I will make it an everlasting desolation.
translation:
  language: ru
  text: И когда исполнятся семьдесят лет, Я накажу царя Вавилона и тот народ — возвещает Яхве[a] — за их вину, а также землю халдеев; Я обращу её в вечное запустение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорит Яхве». Буквально: «речение Яхве»; это устойчивая пророческая формула.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в вечные запустения»; в еврейском тексте существительное стоит во множественном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִמְלֹאות שִׁבְעִים שָׁנָה
  choice: И когда исполнятся семьдесят лет
  rationale: Временная конструкция с כ и инфинитивом מלא указывает на момент, когда установленный срок полностью истечёт. «Исполнятся» естественно передаёт этот смысл по-русски.
- source_word: אֶפְקֹד עַל
  choice: Я накажу … накажу и
  rationale: В данном контексте פקד с עַל обозначает карательное взыскание. Повтор глагола в русском тексте ясно связывает суд как с царём и народом, так и с землёй халдеев.
- source_word: מֶלֶךְ בָּבֶל
  choice: царя Вавилона
  rationale: Прямое и естественное соответствие еврейской сопряжённой конструкции.
- source_word: הַגּוֹי הַהוּא
  choice: тот народ
  rationale: Гוי обозначает здесь политико-этническую общность Вавилона; «народ» в современном русском звучит естественнее, не устраняя государственного контекста.
- source_word: נְאֻם יְהוָה
  choice: таково слово Яхве
  rationale: Сохранена торжественная пророческая формула, при этом выражение остаётся понятным современному читателю.
- source_word: אֶת עֲוֺנָם
  choice: за их беззаконие
  rationale: עון может обозначать беззаконие, вину или её последствия. Здесь оно называет основание наказания; «беззаконие» сохраняет нравственный смысл слова.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: землю халдеев
  rationale: Сохранено историческое этническое наименование כַּשְׂדִּים, без замены его более общим «вавилоняне».
- source_word: וְשַׂמְתִּי אֹתוֹ
  choice: и превращу её
  rationale: Глагол שׂים в этой конструкции означает привести объект в определённое состояние. Женский род местоимения однозначно связывает его в русском тексте с ближайшим существительным «землю».
- source_word: לְשִׁמְמוֹת עוֹלָם
  choice: в пустошь навеки
  rationale: Еврейское множественное שִׁמְמוֹת имеет усилительное или собирательное значение и естественно передаётся русским единственным числом. «Навеки» сохраняет сильную временную формулировку עוֹלָם, не внося дополнительного философского уточнения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон. Транслитерация «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Референт местоимения אֹתוֹ
  choice: земля халдеев
  alternative: Вся совокупность осуждённых — царь, народ и земля
  rationale: Ближайший грамматически подходящий антецедент — единственное число «земля». Поэтому русский текст связывает местоимение именно с ней, хотя обобщённое понимание всего Вавилона также возможно.
- issue: Смысл עֲוֺנָם
  choice: их беззаконие как основание наказания
  alternative: их вина; последствие их вины
  rationale: Слово עון допускает связь как с проступком и виной, так и с их последствиями. Синтаксис с глаголом наказания лучше всего поддерживает значение основания суда, но лексическая многозначность учитывается.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Порядок суда сохранён, а повтор «накажу» добавлен для ясности русской синтаксической связи. Тире выделяет пророческую формулу, точка с запятой разграничивает наказание людей и опустошение земли.
