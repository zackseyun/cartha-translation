  text: הִנְ/נִ֣י שֹׁלֵ֡חַ וְ/לָקַחְתִּי֩ אֶת כָּל מִשְׁפְּח֨וֹת צָפ֜וֹן נְאֻם יְהוָ֗ה וְ/אֶל נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶל֮ עַבְדִּ/י֒ וַ/הֲבִ֨אֹתִ֜י/ם עַל הָ/אָ֤רֶץ הַ/זֹּאת֙ וְ/עַל יֹ֣שְׁבֶ֔י/הָ וְ/עַ֛ל כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה סָבִ֑יב וְ/הַ֣חֲרַמְתִּ֔י/ם וְ/שַׂמְתִּי/ם֙ לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה וּ/לְ/חָרְב֖וֹת עוֹלָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/009.yaml
  text: Look[a], I am sending for and taking all the clans of the north, declares Yahweh, and Nebuchadnezzar king of Babylon, my servant, and I will bring them against this land and against its inhabitants and against all these surrounding nations[b]. I will devote them to destruction and make them a horror, a hissing[c], and everlasting ruins.
translation:
  language: ru
  text: «Вот, Я пошлю за всеми племенами севера и за Навуходоносором, царём Вавилона, Моим слугой[a], — возвещает Яхве, — и приведу их против этой земли, против её жителей и против всех этих окрестных народов. Я обреку их на полное уничтожение[b] и сделаю их предметом ужаса, предметом свиста[c] и вечными руинами».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название Навуходоносора «Моим слугой» указывает здесь на то, что Яхве использует его как исполнителя Своего замысла; оно не обязательно означает, что царь был верным поклонником Яхве.
    reason: cultural_note
  - marker: b
    text: Еврейский глагол может означать «предать заклятию», то есть безвозвратно предназначить людей или имущество для уничтожения.
    reason: lexical_alternative
  - marker: c
    text: Свист здесь выражает потрясение, презрение или насмешку при виде постигшего страну разорения.
    reason: cultural_note
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот
  rationale: Передаёт призыв обратить внимание и торжественность начинающегося Божьего возвещения без архаизации.
- source_word: שֹׁלֵחַ וְלָקַחְתִּי ... וְאֶל
  choice: Я пошлю за всеми ... и за Навуходоносором
  rationale: В данном контексте сочетание обозначает властный вызов и собирание северных сил. Русское «пошлю за» естественно связывает племена и Навуходоносора, не превращая אֶל в простое соединительное слово.
- source_word: מִשְׁפְּחוֹת צָפוֹן
  choice: все племена севера
  rationale: מִשְׁפָּחוֹת здесь обозначает родоплеменные или этнополитические группы, а не домашние семьи.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет вес пророческой формулы, а личное имя יהוה передаётся как «Яхве».
- source_word: עַבְדִּי
  choice: Моим слугой
  rationale: Буквально сохраняет значимое обозначение Навуходоносора как подчинённого Божьей воле исполнителя.
- source_word: וַהֲבִאֹתִים עַל
  choice: Я приведу их против
  rationale: Передаёт будущее действие и враждебную направленность движения, выраженную עַל.
- source_word: וְהַחֲרַמְתִּים
  choice: Я обреку их на полное уничтожение
  rationale: Понятно передаёт результат посвящения заклятию; технический оттенок еврейского глагола поясняется в сноске.
- source_word: לְשַׁמָּה
  choice: в ужасающее зрелище
  rationale: В сочетании со свистом и развалинами слово указывает на опустошённое состояние, вызывающее ужас у наблюдателей.
- source_word: לִשְׁרֵקָה
  choice: предмет насмешливого свиста
  rationale: Разворачивает непривычный для современного русского читателя образ свиста как реакции презрения и изумления.
- source_word: לְחָרְבוֹת עוֹלָם
  choice: развалины навеки
  rationale: Сохраняет сильную формулу длительного, необратимого опустошения в естественной русской форме.
theological_decisions:
- issue: Навуходоносор назван «Моим слугой»
  choice: Сохранить титул буквально и пояснить его инструментальный смысл.
  alternative: Понять титул как свидетельство личного благочестия или верности Навуходоносора завету.
  rationale: Контекст говорит о Божьей власти над народами и об использовании вавилонского царя как орудия суда, но сам текст не утверждает его личной верности Яхве.
- issue: Значение חרם
  choice: «обреку их на полное уничтожение» с пояснением образа заклятия в сноске
  alternative: «предам их заклятию»
  rationale: Основной текст остаётся ясным современному читателю, а сноска сохраняет культово-богословский оттенок еврейского слова.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис разделён на две фразы ради ясности, при этом последовательность Божьих действий и повтор «против» сохранены. Прописные местоимения относятся к прямой речи Яхве и соответствуют принятому русскому религиозно-литературному регистру.
