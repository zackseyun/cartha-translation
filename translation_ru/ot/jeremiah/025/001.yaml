  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה עַֽל יִרְמְיָ֨הוּ֙ עַל כָּל עַ֣ם יְהוּדָ֔ה בַּ/שָּׁנָה֙ הָֽ/רְבִעִ֔ית לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הִ֗יא הַ/שָּׁנָה֙ הָ/רִ֣אשֹׁנִ֔ית לִ/נְבֽוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/001.yaml
  text: The word that came to Yirmeyahu concerning all the people of Judah in the fourth year of Jehoiakim son of Josiah[a], king of Judah—it was the first year of Nebuchadnezzar king of Babylon—
translation:
  language: ru
  text: Слово, пришедшее к Иеремии обо всём народе Иудеи[a], — в четвёртый год правления Иоакима, царя Иудеи, сына Иосии; это был первый год правления Навуходоносора, царя Вавилона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против всего народа Иудеи». В пророческом контексте еврейский предлог может иметь оба значения.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַדָּבָר
  choice: Слово
  rationale: В пророческих заголовках דָּבָר обычно обозначает сообщённое Богом слово. Традиционная формула «Слово» сохраняет пророческий оборот и не превращает его в пояснительный пересказ.
- source_word: אֲשֶׁר הָיָה עַל
  choice: пришедшее к
  rationale: Оборот היה על при имени пророка означает, что слово пришло к нему или было ему дано. «Пришедшее к» естественно по-русски и сохраняет библейскую формулу.
- source_word: יִרְמְיָהוּ
  choice: Иеремии
  rationale: Использована укоренившаяся русская форма имени, понятная современному читателю и соответствующая норме литературного библейского русского языка.
- source_word: עַל כָּל עַם יְהוּדָה
  choice: обо всём народе Иудеи
  rationale: Предлог עַל здесь допускает значения «о, относительно» и «против». Основной текст сохраняет более широкое значение темы пророчества, а возможный враждебный оттенок отмечен в сноске.
- source_word: בַּשָּׁנָה הָרְבִעִית לִיהוֹיָקִים
  choice: в четвёртый год Иоакима
  rationale: Обычная формула датировки по году царствования; русский оборот краток и однозначен.
- source_word: בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: сына Иосии, царя Иудеи
  rationale: Сохранены родословное указание и царский титул с естественным для русского языка падежным управлением.
- source_word: הִיא הַשָּׁנָה הָרִאשֹׁנִית
  choice: это был первый год
  rationale: Местоимение возобновляет ранее названный год и отождествляет его с первым годом правления вавилонского царя.
- source_word: לִנְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל
  choice: Навуходоносора, царя Вавилона
  rationale: Выбрана узнаваемая русская форма царского имени; конструкция передаёт датировку по году царствования и сохраняет титул.
theological_decisions:
- issue: Значение עַל перед выражением «весь народ Иудеи»
  choice: обо всём народе Иудеи
  alternative: против всего народа Иудеи
  rationale: Хотя дальнейшее пророчество содержит суд, сам заголовок может лишь обозначать его предмет. Основной вариант не усиливает заранее обвинительную направленность, а смысл «против» сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого заголовка. Синтаксис сделан естественным, но сохранены повтор слова «год», царские титулы и открытая смысловая возможность предлога עַל.
