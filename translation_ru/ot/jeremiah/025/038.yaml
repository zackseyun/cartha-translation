source:
  edition: WLC
  text: עָזַ֥ב כַּ/כְּפִ֖יר סֻכּ֑/וֹ כִּֽי הָיְתָ֤ה אַרְצָ/ם֙ לְ/שַׁמָּ֔ה מִ/פְּנֵי֙ חֲר֣וֹן הַ/יּוֹנָ֔ה וּ/מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/038.yaml
  text: Like a young lion[a], he has left his den, for their land has become a desolation because of the burning anger of the oppressor[b], and because of his burning anger.
translation:
  language: ru
  text: Как молодой лев, он покинул своё логово, потому что их земля превратилась в пустошь из-за пылающего гнева угнетателя[a] и из-за его пылающего гнева[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за пылающего гнева голубя». Еврейское написание допускает такое прочтение, однако контекст скорее указывает на значение «угнетатель».'
    reason: alternative_reading
  - marker: b
    text: «Его», вероятнее всего, относится к Господу, о Котором говорится в ближайшем контексте; по другому пониманию — к угнетателю из предыдущего оборота.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזַב
  choice: покинул
  rationale: Перфект qal 3-го лица мужского рода обозначает завершённое действие; «покинул» естественно и без излишнего усиления передаёт смысл.
- source_word: כַּכְּפִיר
  choice: как молодой лев
  rationale: כפיר обычно означает молодого, уже сильного и опасного льва; «молодой лев» точнее, чем «львёнок».
- source_word: סֻכּוֹ
  choice: Своё логово
  rationale: Буквально סֻכָּה — «укрытие, шалаш», но в образе льва речь идёт о месте его обитания; «логово» звучит естественно.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину предшествующего действия и ясно передаёт объяснительную связь.
- source_word: הָיְתָה אַרְצָם לְשַׁמָּה
  choice: их земля стала пустыней
  rationale: Сохраняется результативная конструкция и существительное שַׁמָּה со значением опустошения; по-русски «стала пустыней» естественнее буквального «стала опустошением».
- source_word: מִפְּנֵי
  choice: из-за
  rationale: В данной причинной конструкции это современный и точный русский эквивалент.
- source_word: חֲרוֹן
  choice: пылающий гнев
  rationale: Передаёт образ жара, заложенный в חֲרוֹן, и сохраняет повтор в параллельных оборотах.
- source_word: הַיּוֹנָה
  choice: угнетателя
  rationale: В контексте разорения форма понимается как обозначение того, кто угнетает; однако графическая форма допускает чтение «голубя», поэтому оно отмечено в сноске.
- source_word: וּמִפְּנֵי חֲרוֹן אַפּוֹ
  choice: и из-за пылающего гнева Его
  rationale: Идиома с אַף естественно передаётся словом «гнев»; повтор сохраняет параллелизм. Местоимение оставлено без явного называния референта.
theological_decisions:
- issue: К кому относятся образ льва и конечное местоимение
  choice: В основном тексте прописные «Он / Своё / Его» указывают на Господа как наиболее вероятного деятеля в контексте Иер 25:30–38.
  alternative: Образ льва может относиться к Навуходоносору или иному человеческому разорителю, а конечное местоимение — к угнетателю.
  rationale: Ближайший контекст изображает суд Господа, однако еврейская форма местоимения сама по себе не устраняет неоднозначности; альтернативный референт конечного местоимения сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический параллелизм и метафора пылающего гнева сохранены; неоднозначные места не устранены молча и пояснены сносками.
