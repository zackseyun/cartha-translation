  text: וְ/אָבַ֥ד מָנ֖וֹס מִן הָֽ/רֹעִ֑ים וּ/פְלֵיטָ֖ה מֵ/אַדִּירֵ֥י הַ/צֹּֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/035.yaml
  text: Escape has perished from the shepherds[b][a], and deliverance from the lords of the flock.
translation:
  language: ru
  text: И не останется пастухам возможности бежать,[a] а вожакам стада — спасения.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убежища».'
    reason: lexical_alternative
  - marker: b
    text: «Пастухи» и «стадо» — пророческие образы руководителей народа и вверенных им людей.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבַד
  choice: не станет
  rationale: Qal-перфект от אבד выражает исчезновение или утрату. В пророческом объявлении суда естественная русская конструкция «не станет» передаёт окончательное лишение возможности спастись.
- source_word: מָנוֹס
  choice: пути к бегству
  rationale: Существительное обозначает убежище, возможность или средство бегства. В данном контексте речь идёт о невозможности уйти от суда; «путь к бегству» ясно и естественно передаёт этот смысл.
- source_word: מִן הָרֹעִים
  choice: для пастухов
  rationale: 'Хотя מן буквально указывает на удаление («от пастухов»), по-русски исчезновение возможности выражается естественнее дательным оборотом: «для пастухов не станет». Пастушеская метафора сохранена.'
- source_word: וּפְלֵיטָה
  choice: спасения
  rationale: Здесь слово параллельно מָנוֹס и обозначает спасение бегством или избавление. «Спасение» сохраняет смысл и позволяет избежать тяжеловесного повтора.
- source_word: מֵאַדִּירֵי הַצֹּאן
  choice: для вожаков стада
  rationale: אַדִּירֵי обозначает могущественных, знатных или главных. «Вожаки стада» естественно сохраняет образ влиятельных членов стада и не заменяет метафору прямым толкованием «правители».
theological_decisions:
- issue: Пастухи и видные члены стада как образы руководителей народа
  choice: 'Сохранить в основном тексте пастушескую метафору: «пастухи» и «вожаки стада»'
  alternative: 'Передать толкованием: «правители» или «руководители народа»'
  rationale: Еврейский текст использует цельный образ пастухов и стада. Его сохранение не сужает референцию до одной конкретной категории власти и оставляет читателю присущую оригиналу образность.
- issue: Значение אַדִּירֵי применительно к стаду
  choice: «вожаки стада»
  alternative: «могущественные стада», «знатные стада» или «господа стада»
  rationale: Форма допускает оттенки могущества, знатности и главенства. «Вожаки» передаёт высокий статус внутри метафорического стада, не вводя феодального оттенка слова «господа».
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого тона и пастушеской образности. Параллелизм двух полустиший передан симметрично; тире во втором полустишии восполняет сказуемое без ненужного повтора.
