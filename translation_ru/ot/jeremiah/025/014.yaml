  terminology: '«Народы», «великие цари» и «воздам» удачны. Два параллельных выражения о воздаянии следует сохранить; «по их делам и по делам их рук» передаёт повтор исходного текста и остаётся естественным. Сноска должна точнее выражать альтернативу: речь не о неестественном русском «служили ими», а о возможности понимать выражение как «воспользовались ими» / «служили с их помощью».'
