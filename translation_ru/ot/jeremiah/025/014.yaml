  yaml_path: translation/ot/jeremiah/025/014.yaml
  text: For many nations and great kings will make even them serve[a], and I will repay them according to their work and according to the work of their hands.
translation:
  language: ru
  text: Ибо многие народы и великие цари поработят также и их[a], и Я воздам им по их делам и по делам их рук.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможен также смысл: «ибо многие народы и великие цари также воспользовались ими» или «служили с их помощью». Еврейское выражение сжато и допускает разные толкования; в контексте наиболее вероятно, что сам Вавилон будет подчинён многим народам и великим царям.'
    reason: Лексико-синтаксическая неоднозначность עָבְדוּ בָם и временного значения формы.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим приговором и естественно звучит по-русски.
- source_word: עָבְדוּ בָם
  choice: заставят служить их
  rationale: Форма Qal с предлогом בְּ выражена сжато и допускает буквальное понимание «служили/воспользовались ими»; контекст суда над Вавилоном указывает на обратное порабощение, поэтому в основном тексте передан подразумеваемый понудительный смысл, а неоднозначность отмечена в сноске.
- source_word: גַּם הֵמָּה
  choice: даже их
  rationale: 'Эмфатическое сочетание подчёркивает перемену ролей: те, кто порабощал других, сами будут обращены в рабство.'
- source_word: גּוֹיִם רַבִּים
  choice: многие народы
  rationale: В геополитическом контексте גּוֹיִם обозначает народы или нации; «народы» — естественный и точный русский эквивалент.
- source_word: וּמְלָכִים גְּדוֹלִים
  choice: и великие цари
  rationale: Сохраняет буквальное значение גְּדוֹלִים и подразумеваемую значительность и могущество правителей.
- source_word: וְשִׁלַּמְתִּי לָהֶם
  choice: и Я воздам им
  rationale: Порода Piel глагола שׁלם означает воздаяние или отплату; «воздам» сохраняет судебный оттенок и высокий, но понятный регистр.
- source_word: כְּפָעֳלָם
  choice: по их делам
  rationale: Передаёт поступки и деятельность; множественное «делам» естественно в русской формуле соразмерного воздаяния.
- source_word: וּכְמַעֲשֵׂה יְדֵיהֶם
  choice: и по деянию их рук
  rationale: Сохраняет образ рук и некоторую лексическую разницу между פֹּעַל и מַעֲשֶׂה; единственное число соответствует форме источника.
theological_decisions:
- issue: К кому относится местоимение «их» в мотиве перемены ролей
  choice: К Вавилону/халдеям, которых многие народы и великие цари заставят служить
  alternative: 'Более формальное прочтение: «многие народы и великие цари также служили ими/воспользовались ими»'
  rationale: В Иер 25:12–14 речь непосредственно идёт о суде над царём Вавилона и его землёй. Поэтому наиболее вероятен смысл ответного подчинения Вавилона, однако грамматическая сжатость еврейского текста не позволяет скрыть альтернативу, которая вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Воздам» и «деяние их рук» сохраняют судебный тон и образность оригинала, не делая фразу архаичной; подлинная неоднозначность первой части обозначена сноской.
