  source_fidelity: 'Основной смысл верно соотнесён с контекстом суда над Вавилоном (Иер 25:12–14): многие народы и великие цари обратят вавилонян в подчинение. Однако «заставят служить даже их» синтаксически тяжеловесно и не вполне естественно по-русски. «Поработят также и их» ясно передаёт контекстуально подразумеваемый результат, не приписывая еврейской форме отдельного каузативного морфологического значения.'
