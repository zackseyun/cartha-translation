- source_word: אֶת דְּבָרָי
  choice: моих слов
  rationale: Прямо и естественно передаёт форму דְּבָרַי; предлог обусловлен русским управлением глагола «слушать».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя YHWH, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Смысл глагола שׁמע в контексте Божьих слов
  choice: не слушали
  alternative: не слушались; не повиновались
  rationale: Выбранный вариант сохраняет связь со слышанием слов и не снимает подразумеваемого оттенка непослушания.
