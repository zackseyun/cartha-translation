base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/015.yaml
  text: 'For thus said Yahweh[a], the God of Israel, to me: “Take from my hand this cup of the wine of wrath, and make all the nations to whom I am sending you drink it.”'
translation:
  language: ru
  text: 'Ибо так сказал мне Яхве, Бог Израиля: «Возьми из моей руки эту чашу вина гнева[a] и дай испить его всем народам, к которым я посылаю тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ярости».'
    reason: Лексическая альтернатива для חֵמָה.
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Ибо так сказал
  rationale: Сохраняет связующую силу כִּי и указательное значение כֹה, оставаясь естественным для возвышенной современной русской прозы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и устоявшаяся передача еврейской сопряжённой конструкции.
- source_word: קַח אֶת כּוֹס ... הַזֹּאת מִיָּדִי
  choice: Возьми из Моей руки эту чашу
  rationale: Сохраняет императив, указательное местоимение и конкретный образ чаши, получаемой из руки Бога.
- source_word: הַיַּיִן הַחֵמָה
  choice: с вином ярости
  rationale: Передаёт образ вина, несущего или воплощающего Божий гнев; «ярость» хорошо отражает интенсивность חֵמָה, а возможная передача «гнев» отмечена в сноске.
- source_word: וְהִשְׁקִיתָה אֹתוֹ אֶת כָּל הַגּוֹיִם
  choice: и напои им все народы
  rationale: Русский глагол «напоить» естественно передаёт каузатив Hiphil; местоимение «им» соотносится с вином и сохраняет образ питья.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אוֹתְךָ אֲלֵיהֶם
  choice: к которым Я посылаю тебя
  rationale: Точно и естественно передаёт направление пророческого посланничества и продолжающееся действие причастной формы.
theological_decisions:
- issue: Передача חֵמָה в образе чаши суда
  choice: ярость
  alternative: гнев
  rationale: «Ярость» выражает интенсивность слова חֵמָה и не устраняет метафору опьяняющего Божьего суда; «гнев» также лексически возможен и указан как альтернатива.
- issue: Связь вина и ярости в הַיַּיִן הַחֵמָה
  choice: чаша с вином ярости
  alternative: чаша вина — ярости
  rationale: Основной вариант сохраняет традиционную генитивную метафору и звучит по-русски естественно, не утверждая сверх текста, является ли ярость содержимым вина или его символическим определением.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис близок к еврейскому, но не тяжеловесен; конкретная метафора чаши и вина сохранена.
