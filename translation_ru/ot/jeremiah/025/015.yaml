revisions:
- from: 'Ибо так сказал мне Яхве, Бог Израиля: «Возьми из Моей руки эту чашу с вином ярости[a] и напои им все народы, к которым Я посылаю тебя».'
  to: 'Ибо так сказал мне Яхве, Бог Израиля: «Возьми из моей руки эту чашу вина гнева[a] и дай испить его всем народам, к которым я посылаю тебя».'
  rationale: Правка уточняет каузативное значение וְהִשְׁקִיתָה и референт местоимения («вино»), сохраняет полный образ исходного текста и приводит орфографию местоимений к нейтральной современной литературной норме. Альтернатива для חֵמָה сохранена в сноске.
