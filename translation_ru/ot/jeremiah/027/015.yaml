source:
  edition: WLC
  text: כִּ֣י לֹ֤א שְׁלַחְתִּי/ם֙ נְאֻם יְהוָ֔ה וְ/הֵ֛ם נִבְּאִ֥ים בִּ/שְׁמִ֖/י לַ/שָּׁ֑קֶר לְמַ֨עַן הַדִּיחִ֤/י אֶתְ/כֶם֙ וַ/אֲבַדְתֶּ֔ם אַתֶּ֕ם וְ/הַ/נְּבִאִ֖ים הַֽ/נִּבְּאִ֥ים לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/015.yaml
  text: For I did not send them[a], declares Yahweh, and they are prophesying falsely in my name, so that I may drive you out[b], and you will perish—you and the prophets who are prophesying to you.
translation:
  language: ru
  text: Ведь не Я посылал их, — возвещает Яхве, — а они ложно[a] пророчествуют от Моего имени, чтобы Я изгнал вас[b] и вы погибли — и вы, и пророки, которые пророчествуют вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пророчествуют ложь от Моего имени».'
    reason: Сочетание לַשָּׁקֶר допускает как наречную передачу «ложно», так и более буквальную именную — «ложь».
  - marker: b
    text: 'Или: «удалю вас», «вышлю вас»; еврейский глагол означает прогнать, удалить или сделать изгнанниками.'
    reason: Лексическая широта глагола נדח; в данном контексте речь идёт об изгнании.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт причинно-пояснительную связь с предшествующим предупреждением и естественно звучит в современном русском языке.
- source_word: לֹא שְׁלַחְתִּים
  choice: не Я посылал их
  rationale: Форма Qal perfect 1-го лица ед. числа с суффиксом 3-го лица мн. числа. Инверсия и ударное «Я» подчёркивают, что пророки не были посланы Яхве.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественную пророческую формулу и передаёт тетраграмматон личным именем «Яхве».
- source_word: וְהֵם נִבְּאִים
  choice: а они ... пророчествуют
  rationale: Причастная форма обозначает продолжающееся действие. Русский противительный союз естественно выражает контраст, заложенный в сопоставлении «Я не посылал — они пророчествуют», не меняя смысла еврейского וְ.
- source_word: בִּשְׁמִי לַשָּׁקֶר
  choice: ложно пророчествуют от Моего имени
  rationale: Наречие «ложно» естественно передаёт לַשָּׁקֶר, а «от Моего имени» обозначает притязание говорить как представитель Яхве.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Сохраняет выраженную в еврейском тексте целевую или результативную связь, не устраняя её богословскую напряжённость.
- source_word: הַדִּיחִי אֶתְכֶם
  choice: чтобы Я изгнал вас
  rationale: В контексте суда и грядущего изгнания Hiphil от נדח означает удаление, изгнание из земли; «изгнал» кратко и ясно передаёт этот смысл.
- source_word: וַאֲבַדְתֶּם
  choice: и вы погибли
  rationale: Форма с וַ передаёт последующее будущее следствие. «Погибли» сохраняет широкий смысл окончательной гибели, не уточняя её способ.
- source_word: אַתֶּם וְהַנְּבִאִים הַנִּבְּאִים לָכֶם
  choice: и вы, и пророки, которые пророчествуют вам
  rationale: Сохраняются оба участника предстоящей гибели и повтор корня נבא; «вам» передаёт адресатов пророчеств.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон; личное имя «Яхве» сохраняет его как имя Бога, а не заменяет титулом.
- issue: Целевая или результативная сила לְמַעַן
  choice: чтобы Я изгнал вас
  alternative: так что Я изгоню вас
  rationale: 'Буквальное «чтобы» сохраняет грамматически выраженную цель и богословскую напряжённость: ложные пророчества становятся средством суда. Результативное прочтение возможно, но не должно молча подменять форму оригинала.'
- issue: Смысл נדח в данном контексте
  choice: изгнал
  alternative: увёл с пути
  rationale: Контекст Иеремии 27 говорит об удалении народа и изгнании из земли. Значение заблуждения лексически возможно в иных контекстах, но здесь менее вероятно.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Заглавные буквы в местоимениях «Я», «Моего» отмечают речь Бога согласно принятой русской библейской традиции. Повтор «пророки, которые пророчествуют» намеренно сохранён как отражение еврейского текста.
