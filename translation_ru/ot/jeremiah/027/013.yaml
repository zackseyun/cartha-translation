  text: לָ֤/מָּה תָמ֨וּתוּ֙ אַתָּ֣ה וְ/עַמֶּ֔/ךָ בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר֙ כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה אֶל הַ/גּ֕וֹי אֲשֶׁ֥ר לֹֽא יַעֲבֹ֖ד אֶת מֶ֥לֶךְ בָּבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/013.yaml
  text: Why will you and your people die by the sword, by famine, and by pestilence, just as the LORD has spoken concerning the nation that will not serve the king of Babylon?
translation:
  language: ru
  text: Зачем тебе и твоему народу умирать от меча, голода и моровой язвы, как сказал ГОСПОДЬ о народе, который не станет служить царю Вавилона?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה תָמוּתוּ
  choice: Зачем ... умирать
  rationale: Передаёт риторический вопрос и увещевательный оттенок естественным современным русским языком, не превращая его в простое предсказание.
- source_word: בַחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: от меча, голода и моровой язвы
  rationale: Русское «от» естественно обозначает причины смерти; «моровая язва» сохраняет значение смертоносного поветрия и библейскую торжественность.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона прописными буквами, отличающая имя Бога от обычного титула.
- source_word: אֲשֶׁר לֹא יַעֲבֹד
  choice: который не станет служить
  rationale: Передаёт имперфект в данном обобщённо-будущем контексте и сохраняет смысл отказа подчиниться власти вавилонского царя.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Прямая и естественная передача титула и географического названия.
theological_decisions:
- issue: Характер связи между угрозой смерти и словом ГОСПОДА
  choice: как сказал ГОСПОДЬ
  alternative: точно так, как сказал ГОСПОДЬ
  rationale: Еврейское כַּאֲשֶׁר допускает простое сравнительно-соотносительное «как»; перевод не усиливает выражение словом «точно», отсутствующим в источнике.
- issue: Значение служения царю Вавилона
  choice: служить царю Вавилона
  alternative: подчиниться царю Вавилона
  rationale: 'Сохранён широкий смысл עבד: он включает политическое подчинение, но формулировка не сужается до одного толкования.'
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Единственное число «тебе» сохраняет обращение к царю, а «твоему народу» — коллективного адресата. Порядок трёх бедствий сохранён.
