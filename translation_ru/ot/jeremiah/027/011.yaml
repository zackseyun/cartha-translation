  text: וְ/הַ/גּ֗וֹי אֲשֶׁ֨ר יָבִ֧יא אֶת צַוָּאר֛/וֹ בְּ/עֹ֥ל מֶֽלֶךְ בָּבֶ֖ל וַֽ/עֲבָד֑/וֹ וְ/הִנַּחְתִּ֤י/ו עַל אַדְמָת/וֹ֙ נְאֻם יְהוָ֔ה וַֽ/עֲבָדָ֖/הּ וְ/יָ֥שַׁב בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/011.yaml
  text: But the nation that brings its neck under the yoke of the king of Babylon and serves him[a], I will let remain on its own land, declares Yahweh[b], and it will till it and dwell in it.
translation:
  language: ru
  text: Но народ, который подставит свою шею под ярмо вавилонского царя и будет служить ему, Я дам ему остаться на собственной земле[a], — возвещает Яхве, — и он будет возделывать её[b] и жить на ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «оставлю его на его земле» или «дам ему покой на его земле».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будет обрабатывать её», то есть землю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹי
  choice: народ
  rationale: В контексте международных отношений обозначает политически организованный народ; по-русски «народ» здесь естественнее, чем более отвлечённое «нация».
- source_word: יָבִיא אֶת צַוָּארוֹ בְּעֹל
  choice: склонит шею под ярмо
  rationale: Сохраняет конкретный образ добровольного подчинения и звучит естественно в современном литературном русском.
- source_word: עֹל
  choice: ярмо
  rationale: Сохраняет центральный для главы образ политического подчинения.
- source_word: מֶלֶךְ בָּבֶל
  choice: вавилонский царь
  rationale: Естественная русская передача еврейской сопряжённой конструкции без изменения смысла.
- source_word: וַעֲבָדוֹ
  choice: и будет служить ему
  rationale: Передаёт политическую зависимость и вассальное служение царю Вавилона.
- source_word: וְהִנַּחְתִּיו עַל אַדְמָתוֹ
  choice: Я оставлю на его земле
  rationale: Каузативная форма передаёт позволение остаться на собственной земле; краткая формулировка сохраняет возможный оттенок покоя или невмешательства, отмеченный в сноске.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт устойчивую пророческую формулу, а личное имя יְהוָה транслитерируется как «Яхве».
- source_word: וַעֲבָדָהּ
  choice: и он будет возделывать её
  rationale: Женский суффикс относится к земле; при земле עבד означает обрабатывать или возделывать её.
- source_word: וְיָשַׁב בָּהּ
  choice: и жить на ней
  rationale: Передаёт проживание на земле естественным современным русским выражением.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; «Яхве» непосредственно передаёт тетраграмматон и не заменяет его титулом.
- issue: Характер подчинения Вавилону
  choice: сохранён образ склонённой под ярмо шеи
  alternative: подчинится вавилонскому царю
  rationale: Образ ярма является смыслообразующим для главы и выражает политическое подчинение, не добавляя богословской оценки самого народа.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Конкретный образ ярма сохранён; местоимения согласованы с русским словом «народ». Маркеры сносок помещены непосредственно после выражений, к которым относятся.
