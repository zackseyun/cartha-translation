base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/012.yaml
  text: And to Zedekiah king of Judah I spoke all these words[a], saying, “Bring your necks under the yoke of the king of Babylon, and serve him and his people[b], and live.”
translation:
  language: ru
  text: 'Седекии, царю Иудеи, я сказал то же самое: «Подставьте свои шеи под ярмо царя Вавилона[a], служите ему и его народу — и живите[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «введите свои шеи в ярмо царя Вавилона».'
    reason: lexical_alternative
  - marker: b
    text: 'Эти слова можно также понимать как указание на следствие или цель: «и будете жить» либо «чтобы вам жить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּרְתִּי
  choice: я сказал
  rationale: Пиэль глагола דבר означает «говорить, сказать». В русском «я сказал» естественно вводит конкретное обращение, выраженное далее прямой речью.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: Передаёт явное значение דְּבָרִים («слова») без тяжеловесного русского оборота «согласно всем этим словам»; предлог כְּ в данном контексте не требует отдельного буквального соответствия.
- source_word: הָבִיאוּ אֶת צַוְּארֵיכֶם בְּעֹל
  choice: подставьте свои шеи под ярмо
  rationale: Сохраняет телесный образ шей и ярма, а также повелительную форму; по-русски естественно выражает добровольное принятие подчинения. Более буквальная конструкция отмечена в сноске.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Прямо передаёт древнееврейскую конструкцию и соответствует устойчивому русскому библейскому именованию правителя.
- source_word: וְעִבְדוּ אֹתוֹ וְעַמּוֹ
  choice: служите ему и его народу
  rationale: Сохраняет политический смысл עבד — подчинённое служение царю — и прямое значение עַם («народ»), не превращая исторический приказ в отвлечённый духовный принцип.
- source_word: וִחְיוּ
  choice: и живите
  rationale: Сохраняет краткую повелительную форму и не устраняет возможный оттенок следствия или цели.
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Седекии, царю Иудеи
  rationale: Использованы традиционные русские формы библейского имени и географического названия; дательный падеж передаёт אֶל.
theological_decisions:
- issue: Политическое подчинение власти Вавилона
  choice: Приказ передан как конкретное требование подчиниться царю Вавилона и служить ему и его народу.
  alternative: Истолковать образ ярма как общее наставление о смирении или духовном послушании.
  rationale: В историческом контексте речь идёт о пророческом требовании принять вавилонское господство; перевод не смягчает и не обобщает эту напряжённую политико-богословскую мысль.
- issue: Смысл וִחְיוּ
  choice: «и живите»
  alternative: «и будете жить» или «чтобы вам жить»
  rationale: Повелительная форма сохраняет грамматику и лаконичность оригинала, тогда как возможный последовательный или целевой оттенок поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис упрощён ради ясности, но сохранены ключевые образы шей и ярма, политический характер повеления и неоднозначность заключительного императива.
