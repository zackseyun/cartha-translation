base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/007.yaml
  text: All the nations will serve him[a], and his son, and his grandson, until the time of his own land comes[c][b]; then many nations and great kings will make even him serve them.
translation:
  language: ru
  text: И все народы будут служить ему, его сыну и сыну его сына[a], пока не придёт срок и для его собственной земли[b]. Тогда многие народы и великие цари заставят и его служить им[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его сыну и сыну его сына». Этот оборот указывает на продолжение династии.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пока не придёт срок его земли», то есть назначенный срок, касающийся собственной земли вавилонского царя.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское выражение означает, что его самого обратят в подчинённое служение; более буквально: «будут использовать его для служения».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבְדוּ אֹתוֹ
  choice: будут служить ему
  rationale: В политическом контексте עבד обозначает подчинённое служение правителю или державе, а не просто труд.
- source_word: כָּל הַגּוֹיִם
  choice: все народы
  rationale: גּוֹיִם здесь обозначает народы как политические сообщества, подвластные Вавилону; «народы» естественно и не несёт лишней религиозной окраски.
- source_word: וְאֶת בְּנוֹ וְאֶת בֶּן בְּנוֹ
  choice: его сыну и сыну его сына
  rationale: Сохранён буквальный династический оборот еврейского текста; он понятен по-русски и не снимает возможной широты выражения, как это могло бы сделать слово «внук».
- source_word: עַד בֹּא עֵת אַרְצוֹ
  choice: пока не придёт срок и для его собственной земли
  rationale: Сжатый еврейский оборот указывает на наступление назначенного срока, касающегося земли самого вавилонского царя; «и» естественно передаёт переход к её собственной очереди, не уточняя сверх текста характер события.
- source_word: גַּם הוּא
  choice: даже его
  rationale: 'Явно сохранено усиление גם הוא: тот, кому прежде служили другие, сам окажется в подчинении.'
- source_word: וְעָבְדוּ בוֹ
  choice: заставят служить даже его
  rationale: Конструкция עבד с ב здесь выражает обращение кого-либо в служение или использование его как подвластного; каузативная русская формулировка передаёт смену власти.
- source_word: גּוֹיִם רַבִּים וּמְלָכִים גְּדֹלִים
  choice: многие народы и великие цари
  rationale: Формулировка сохраняет параллелизм и широкий политический масштаб оригинала.
theological_decisions:
- issue: Перемена участи Вавилона в заключительной части стиха
  choice: После наступления срока для земли вавилонского царя многие народы и великие цари подчинят его самого.
  alternative: 'Более буквально и менее ясно: «многие народы и великие цари воспользуются им для служения».'
  rationale: Контекст главы говорит о временном господстве Вавилона и последующем подчинении самого Вавилона. При этом перевод не добавляет прямого упоминания суда или уничтожения, которых в данном стихе нет.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным синтаксисом. «Великие цари» сохранено как прямой эквивалент оригинала. Маркеры сносок расположены непосредственно при соответствующих выражениях.
