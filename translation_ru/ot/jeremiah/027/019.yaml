  source_fidelity: 'Основной смысл и перечисление переданы верно: כִּי вводит пояснение, пророческая формула сохранена, а אֶל имеет значение темы высказывания. Однако הַנּוֹתָרִים означает «оставшиеся/уцелевшие», а не просто предметы, которые «ещё находятся» в городе; последнее звучит как излишнее временно-локативное перефразирование.'
