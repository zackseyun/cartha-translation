base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/019.yaml
  text: 'For thus says Yahweh of Armies concerning the pillars[a], the Sea, the stands[b], and the rest of the vessels that remain in this city:'
translation:
  language: ru
  text: 'Ибо так говорит Яхве Воинств о столбах, Море[a], подставках[b] и остальных сосудах, оставшихся в этом городе:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Море» — большой бронзовый бассейн среди храмовой утвари.
    reason: cultural_note
  - marker: b
    text: 'Или: «основания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит пояснение к предыдущему высказыванию; «ибо» естественно передаёт эту логическую связь в повествовательно-пророческом контексте.
- source_word: כֹה אָמַר
  choice: так говорит
  rationale: Сохранена стандартная формула речи пророка; настоящее время уместно для провозглашаемого слова.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת переведено по конкретному значению «воинства», без традиционного, но малопонятного заимствования «Саваоф».
- source_word: אֶל
  choice: о
  rationale: Предлог вводит тему последующего высказывания, а не обращение к неодушевлённым предметам.
- source_word: הָעַמֻּדִים
  choice: столбах
  rationale: Речь идёт об архитектурных столбах Храма; «столбы» — точное и понятное обозначение.
- source_word: הַיָּם
  choice: Море
  rationale: Это особое название большого храмового умывального сосуда; прописная буква указывает на конкретный предмет храмовой утвари.
- source_word: הַמְּכֹנוֹת
  choice: подставках
  rationale: Слово обозначает основания или подвижные подставки для храмовых сосудов; «подставки» передают функцию без лишнего уточнения конструкции.
- source_word: יֶתֶר הַכֵּלִים
  choice: остальных сосудах
  rationale: В контексте храмового имущества כֵּלִים естественно передать как «сосуды», а יֶתֶר — как «остальные».
- source_word: הַנּוֹתָרִים בָּעִיר הַזֹּאת
  choice: которые ещё находятся в этом городе
  rationale: Фраза передаёт значение оставшихся в городе предметов и естественно звучит по-русски; «ещё» подчёркивает, что они пока не вывезены.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; сил; небесных воинств
  rationale: «Воинств» сохраняет конкретный множественный смысл еврейского слова, не ограничивая референт добавленным определением «небесных» и не заменяя перевод непрозрачной транслитерацией.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой формулы. Синтаксис следует еврейскому перечислению, но остаётся естественным для русского читателя. Двоеточие сохранено, поскольку высказывание продолжается в следующем стихе.
