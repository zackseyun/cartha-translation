base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/010.yaml
  text: For they are prophesying lies to you[a], in order to remove you from your land; and I will drive you out[c][b], and you will perish.
translation:
  language: ru
  text: Ведь они пророчествуют вам ложь[a], чтобы удалить вас с вашей земли; Я изгоню вас[b], и вы погибнете.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неправду».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте здесь прямо выражено действие Бога: «Я изгоню вас, и вы погибнете».'
    reason: agency_clarification
lexical_decisions:
- source_word: שֶׁקֶר
  choice: ложь
  rationale: Существительное обозначает ложь или обман; в сочетании с глаголом «пророчествовать» русское «пророчествуют ложь» сохраняет конкретность и звучит по-библейски, оставаясь понятным.
- source_word: נִבְּאִים לָכֶם
  choice: пророчествуют вам
  rationale: Причастная форма выражает продолжающееся действие; настоящее время естественно передаёт его в русском контексте.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое значение кратко и естественно, не устраняя возможного оттенка результата.
- source_word: הַרְחִיק אֶתְכֶם מֵעַל אַדְמַתְכֶם
  choice: удалить вас с вашей земли
  rationale: Каузативная форма רחק означает сделать далёкими, удалить; предлог מֵעַל здесь передаёт отторжение от земли. В русском «удалить вас с вашей земли» сохраняет пространственный и насильственный смысл без добавления отсутствующего наречия «далеко».
- source_word: אַדְמַתְכֶם
  choice: вашей земли
  rationale: В контексте изгнания אַדָמָה обозначает землю как территорию проживания, а не только почву.
- source_word: וְהִדַּחְתִּי אֶתְכֶם
  choice: Я же изгоню вас
  rationale: Каузатив נדח выражает изгнание или отбрасывание прочь. Явное «Я» сохраняет переход к прямо названному Божьему действию, а частица «же» подчёркивает синтаксический поворот без излишнего толкования.
- source_word: וַאֲבַדְתֶּם
  choice: и вы погибнете
  rationale: Глагол אבד здесь означает погибнуть или быть уничтоженными; непереходное «погибнете» не уточняет способ гибели.
theological_decisions:
- issue: Кто действует в последовательности суда
  choice: 'Лжепророки пророчествуют ложь с целью или следствием удаления народа, после чего Бог прямо говорит: «Я же изгоню вас».'
  alternative: Считать лжепророков подразумеваемыми исполнителями всего удаления и не выделять последующее действие Бога.
  rationale: Еврейский текст отличает целевой оборот לְמַעַן הַרְחִיק от explícитной формы первого лица וְהִדַּחְתִּי. Перевод сохраняет это различие и присущую ему богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Пророчествуют ложь» намеренно сохраняет библейскую сочетаемость, а явное «Я же» отмечает смену агентности. Все сноски обозначены в основном тексте.
