base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/002.yaml
  text: 'Thus said Yahweh to me: “Make for yourself bonds and yoke-bars[a], and put them on your neck.”'
translation:
  language: ru
  text: 'Так сказал мне Яхве: «Сделай себе ремни и перекладины ярма[a] и возложи их себе на шею».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение означает «путы (или ремни) и перекладины ярма»; первый термин также переводят более обобщённо: «узы», а второй — «ярма».'
    reason: Сохраняет лексическую неоднозначность названий предметов и поясняет возможный более обобщённый перевод, не меняя текста.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так сказал
  rationale: Сохраняет пророческую формулу и значение формы перфекта в данном повествовательном контексте; звучит естественно и торжественно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: אֵלַי
  choice: мне
  rationale: 'С глаголом речи предлог אֶל естественно означает адресата: «мне».'
- source_word: עֲשֵׂה לְךָ
  choice: Сделай себе
  rationale: Императив и дательный компонент לְךָ переданы прямо и естественно.
- source_word: מוֹסֵרוֹת
  choice: ремни
  rationale: В контексте ярма слово обозначает связывающие ремни или путы; «ремни» ясно передаёт предметную функцию без архаической неясности.
- source_word: מֹטוֹת
  choice: перекладины ярма
  rationale: Множественное число מֹטוֹת обозначает деревянные брусья или перекладины ярма, а не обязательно всё ярмо целиком.
- source_word: וּנְתַתָּם
  choice: и надень их
  rationale: Форма с союзом продолжает повеление; при помещении ярма на шею русское «надень» естественнее буквального «положи».
- source_word: עַל צַוָּארֶךָ
  choice: себе на шею
  rationale: Точно и идиоматично передаёт местонахождение и принадлежность, выраженную суффиксом второго лица.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие и не заменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием пророческой формулы. Предметная лексика выбрана понятной, но уточняющая сноска сохраняет конкретность и неоднозначность еврейских терминов.
