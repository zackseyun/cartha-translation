  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אָנֹכִ֞י עָשִׂ֣יתִי אֶת הָ/אָ֗רֶץ אֶת הָ/אָדָ֤ם וְ/אֶת הַ/בְּהֵמָה֙ אֲשֶׁר֙ עַל פְּנֵ֣י הָ/אָ֔רֶץ בְּ/כֹחִ/י֙ הַ/גָּד֔וֹל וּ/בִ/זְרוֹעִ֖/י הַ/נְּטוּיָ֑ה וּ/נְתַתִּ֕י/הָ לַ/אֲשֶׁ֖ר יָשַׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/005.yaml
  text: I myself made the earth[a], mankind, and the animals that are on the face of the earth, by my great power and by my outstretched arm, and I give it to whomever is right in my eyes.
translation:
  language: ru
  text: Я Сам создал землю, человека[a] и животных, которые на земле, — Своей великой силой и простёртой рукой; и Я отдаю её тому, кого Я сочту правым в Своих глазах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человечество»; еврейское слово стоит в единственном числе — «человек», — но здесь обозначает весь человеческий род.'
    reason: Лексическая альтернатива и пояснение собирательно-представительного употребления אָדָם.
lexical_decisions:
- source_word: אָנֹכִי
  choice: Я Сам
  rationale: Самостоятельное местоимение усиливает уже выраженное глаголом первое лицо; «Я Сам» естественно передаёт это ударение по-русски.
- source_word: עָשִׂיתִי
  choice: создал
  rationale: Основное значение — «сделал»; применительно к земле, человеку и животным русское «создал» звучит естественно, не требуя специального богословского термина «сотворил».
- source_word: הָאָרֶץ
  choice: землю
  rationale: Перечень земли, человека и животных имеет вселенский, а не локальный смысл, поэтому выбрано «землю», а не «страну».
- source_word: הָאָדָם
  choice: человека
  rationale: 'Сохраняется форма единственного числа с собирательно-представительным значением: речь идёт о человеческом роде.'
- source_word: הַבְּהֵמָה
  choice: животных
  rationale: Еврейское существительное в единственном числе употреблено собирательно; русское множественное число естественно передаёт широкий класс животных.
- source_word: אֲשֶׁר עַל־פְּנֵי הָאָרֶץ
  choice: обитающих по всей земле
  rationale: Буквальное «которые на лице земли» по-русски тяжеловесно; выражение передаёт нахождение животных на поверхности всей земли и остаётся ясным.
- source_word: בְּכֹחִי הַגָּדוֹל
  choice: Своей великой силой
  rationale: Творительный падеж естественно выражает орудийное значение предлога ב.
- source_word: וּבִזְרוֹעִי הַנְּטוּיָה
  choice: и простёртой рукой
  rationale: Сохраняется библейский антропоморфный образ Божьей силы в действии.
- source_word: וּנְתַתִּיהָ
  choice: и Я отдаю её
  rationale: Женский суффикс указывает на землю; настоящее время передаёт провозглашаемое здесь постоянное право Бога распоряжаться ею.
- source_word: לַאֲשֶׁר יָשַׁר בְּעֵינָי
  choice: тому, кто угоден в Моих глазах
  rationale: Сохранены и оценочный смысл выражения, и образ «в Моих глазах»; формулировка не сводит фразу ни исключительно к нравственной правоте человека, ни исключительно к произвольному желанию.
theological_decisions:
- issue: Родовое значение הָאָדָם в контексте творения
  choice: человека
  alternative: человечество
  rationale: «Человека» сохраняет еврейское единственное число и одновременно естественно обозначает человеческий род; сноска делает собирательный смысл явным.
- issue: Смысл יָשַׁר בְּעֵינָי применительно к Божьему дарованию земли
  choice: кто угоден в Моих глазах
  alternative: кому Я сочту нужным отдать её
  rationale: Основной текст сохраняет образ и напряжение оригинала между одобрением лица и суверенным решением Бога, не превращая выражение в утверждение о заслугах и не устраняя его оценочный оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные буквы в местоимениях «Сам», «Своей», «Я», «Моих» последовательно обозначают Бога. Тире отделяет перечисление сотворённого от указания на средство действия; точка с запятой сохраняет тесную связь творения с Божьим правом распоряжаться землёй.
