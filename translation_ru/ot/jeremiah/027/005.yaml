    issue: «обитающих по всей земле»
    rationale: Еврейское אֲשֶׁר עַל־פְּנֵי הָאָרֶץ означает «которые на поверхности/на лице земли». Слова «обитающих» и особенно «по всей» вносят дополнительные смысловые оттенки.
  - severity: medium
    issue: «кто угоден в Моих глазах»
    rationale: יָשָׁר означает «прямой, правильный, подходящий»; «угоден» возможно как интерпретация, но менее точно передаёт оценочное «правым в Моих глазах» и несколько меняет акцент.
