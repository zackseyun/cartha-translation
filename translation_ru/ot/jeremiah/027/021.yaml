language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עַל הַ/כֵּלִ֗ים הַ/נּֽוֹתָרִים֙ בֵּ֣ית יְהוָ֔ה וּ/בֵ֥ית מֶֽלֶךְ יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/021.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel, concerning the vessels that remain in the house of Yahweh, in the house of the king of Judah[b], and in Jerusalem:'
translation:
  language: ru
  text: 'Ибо так говорит Яхве Воинств, Бог Израиля, о сосудах, оставшихся в доме Яхве[a], в доме царя Иудеи[b] и в Иерусалиме:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храме Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во дворце царя Иудеи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего высказывания; «ибо» сохраняет эту связующую функцию и соответствует возвышенному повествовательному контексту.
- source_word: כֹה אָמַר
  choice: так говорит
  rationale: Устойчивая пророческая формула передана настоящим временем, сохраняющим непосредственную силу провозглашаемого Божьего слова.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией «Яхве», а צְבָאוֹת — широким по значению словом «Воинств», не ограничивающим титул только земными армиями.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача древнееврейской сопряжённой конструкции.
- source_word: עַל
  choice: о
  rationale: Предлог вводит тему последующего речения; краткое «о» естественно в современном русском языке.
- source_word: הַכֵּלִים
  choice: сосудах
  rationale: В храмовом контексте слово обозначает священные сосуды и принадлежности; традиционное «сосуды» сохраняет конкретность, не уточняя их назначение сверх текста.
- source_word: הַנּוֹתָרִים
  choice: оставшихся
  rationale: Причастие обозначает предметы, которые остались после прежнего вывоза.
- source_word: בֵּית יְהוָה
  choice: доме Яхве
  rationale: Буквальное «дом Яхве» сохраняет образ и повтор существительного בַּיִת; по смыслу речь идёт о храме, что отмечено в сноске.
- source_word: וּבֵית מֶלֶךְ יְהוּדָה
  choice: в доме царя Иудеи
  rationale: Сохранён лексический повтор «дом»; контекстуальный вариант «дворец» вынесен в сноску.
- source_word: וִירוּשָׁלִָם
  choice: и в Иерусалиме
  rationale: Предлог, распространяющийся на ряд мест, естественно выражен по-русски и передаёт местонахождение оставшихся предметов.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Значение титула צְבָאוֹת
  choice: Воинств
  alternative: Сил / небесных воинств
  rationale: «Воинств» сохраняет широту и традиционную узнаваемость титула, не ограничивая его одним определённым видом сил.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «так говорит» и «ибо» сохраняют библейскую торжественность без архаической грамматики; буквальный повтор «дом» удержан, а более контекстуальные варианты даны в сносках.
