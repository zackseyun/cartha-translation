  source_fidelity: Текст точно передаёт формулу כִּי כֹה אָמַר, титул «Яхве Воинств, Бог Израиля», тематическое עַל («о») и три места, к которым относятся оставшиеся сосуды. Повтор «доме» надлежащим образом отражает повтор בֵּית; «и в Иерусалиме» передаёт союз и предлог исходного текста.
