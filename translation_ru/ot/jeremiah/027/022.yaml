  text: בָּבֶ֥לָ/ה יוּבָ֖אוּ וְ/שָׁ֣מָּ/ה יִֽהְי֑וּ עַ֠ד י֣וֹם פָּקְדִ֤/י אֹתָ/ם֙ נְאֻם יְהוָ֔ה וְ/הַֽעֲלִיתִי/ם֙ וַ/הֲשִׁ֣יבֹתִ֔י/ם אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/022.yaml
  text: They will be brought to Babylon[a], and there they will remain until the day I attend to them, declares Yahweh[b]. Then I will bring them up and restore them to this place.
translation:
  language: ru
  text: Их унесут в Вавилон, и там они останутся до того дня, когда Я посещу их[a], — возвещает Яхве. Тогда Я подниму их[b] и верну их на это место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может также означать «обратить внимание на», «вмешаться» или «взыскать». Здесь последующее обещание возвращения указывает на посещение ради восстановления, а не ради наказания.
    reason: lexical_alternative
  - marker: b
    text: Буквально «подниму их». Это обычный библейский образ возвращения из изгнания; следующий глагол прямо означает «верну».
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּבֶלָה
  choice: в Вавилон
  rationale: Направительное окончание указывает на движение к Вавилону; по-русски это естественно передаётся предлогом «в» с винительным падежом.
- source_word: יוּבָאוּ
  choice: их унесут
  rationale: Глагол в хофале выражает действие, совершаемое над упомянутыми предметами. Русская неопределённо-личная конструкция естественно передаёт пассивный смысл в контексте храмовой утвари.
- source_word: וְשָׁמָּה יִהְיוּ
  choice: и там они останутся
  rationale: Буквально «и там они будут»; в данном пространственно-временном контексте глагол выражает продолжающееся пребывание, поэтому «останутся» звучит естественно и точно.
- source_word: פָּקְדִי אֹתָם
  choice: Я посещу их
  rationale: פקד может означать посещение, проявление внимания или вмешательство как ради суда, так и ради блага. «Посещу» сохраняет образ и исходную смысловую широту, а последующие слова указывают здесь на восстановление.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана литературным русским выражением; личное имя יְהוָה транслитерировано как «Яхве».
- source_word: וְהַעֲלִיתִים
  choice: Тогда Я подниму их
  rationale: Сохранён буквальный образ каузативной формы עלה — «поднять, привести наверх», традиционно связанный с возвращением из изгнания в землю Израиля.
- source_word: וַהֲשִׁיבֹתִים אֶל הַמָּקוֹם הַזֶּה
  choice: и возвращу на это место
  rationale: Каузатив שוב означает «вернуть, привести обратно», а הַמָּקוֹם הַזֶּה прямо обозначает «это место»; конкретизация как «земля» или «Иерусалим» не внесена.
theological_decisions:
- issue: Смысл פקד в контексте последующего восстановления
  choice: «посещу» с пояснением благоприятного контекста
  alternative: «покараю», «позабочусь о них» или «обращу на них внимание»
  rationale: Следующие глаголы обещают возвращение, поэтому карательное значение здесь маловероятно. Вместе с тем перевод «посещу» не устраняет присущую глаголу смысловую широту и не превращает контекстуальный вывод в само значение слова.
- issue: Образ движения вверх при возвращении из изгнания
  choice: сохранить «подниму»
  alternative: «приведу обратно»
  rationale: Так сохраняется самостоятельный образ וְהַעֲלִיתִים, тогда как следующий глагол уже прямо выражает возвращение; слияние обоих глаголов обеднило бы параллельное высказывание.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным для русского языка, при этом сохранены повтор местоимения, пророческая формула, личное имя Яхве и два отдельных образа — «подниму» и «возвращу».
