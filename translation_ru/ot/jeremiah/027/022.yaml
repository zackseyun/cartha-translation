  - severity: medium
    issue: Не выражено дополнение при «возвращу»
    rationale: В «Тогда Я подниму их и возвращу на это место» дополнение формально может восстанавливаться из первой части, но еврейский текст повторяет суффикс «их», и русское «верну их на это место» яснее и естественнее.
