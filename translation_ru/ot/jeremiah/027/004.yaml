  text: וְ/צִוִּיתָ֣ אֹתָ֔/ם אֶל אֲדֹֽנֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כֹּ֥ה תֹֽאמְר֖וּ אֶל אֲדֹֽנֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/004.yaml
  text: 'And command them to say to their masters[a], ‘Thus says Yahweh of hosts, the God of Israel: Thus you shall say to your masters,’'
translation:
  language: ru
  text: 'И повели им передать своим владыкам[a]: «Так говорит Яхве Воинств, Бог Израиля: вот что скажите вашим владыкам:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «господам». Здесь речь идёт о человеческих правителях — царях, пославших своих представителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתָ אֹתָם
  choice: И повели им
  rationale: Форма совершенного вида с союзом продолжает последовательность указаний пророку; русский императив естественно передаёт предписывающую силу контекста. Местоимение относится к посланникам из ближайшего контекста.
- source_word: אֶל אֲדֹנֵיהֶם / אֶל אֲדֹנֵיכֶם
  choice: своим владыкам / вашим владыкам
  rationale: אדון здесь обозначает человеческих правителей, к которым посланы представители. «Владыки» сохраняет значение верховной власти и не смешивается с божественным именем; смена местоименных суффиксов сохранена.
- source_word: לֵאמֹר
  choice: передать
  rationale: Инфинитив вводит содержание поручения. В сочетании «повели им передать» современный русский ясно показывает, что посланники должны сообщить слова своим правителям.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена устойчивая пророческая формула; прошедшая по форме древнееврейская конструкция в формуле естественно передаётся русским настоящим временем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: В составе устойчивого божественного наименования родительный падеж «Воинств» сохраняет образ небесных или совокупных сил и узнаваемую библейскую формулу.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: כֹּה תֹאמְרוּ
  choice: вот что скажите
  rationale: Форма второго лица множественного числа обращена к посланникам; русский императив сохраняет директивную силу и естественно вводит последующую речь.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя. «Яхве» сохраняет его отличие от титула אדון и не подменяет имя традиционным титулом.
- issue: Значение צְבָאוֹת в титуле
  choice: Воинств
  alternative: Сил / небесных воинств
  rationale: Краткая традиционная форма сохраняет широту исходного выражения и не ограничивает его явно только земными или только небесными армиями.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим регистром. «Владыкам» выбрано вместо двусмысленного «господам»; синтаксис разгружен за счёт «передать», при этом повтор адресата и смена «своим/вашим» сохранены.
