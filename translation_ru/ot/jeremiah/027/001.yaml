lexical_decisions:
- source_word: בְּרֵאשִׁית מַמְלֶכֶת
  choice: В начале царствования
  rationale: Сочетание обозначает начальный период правления названного царя; «царствование» естественно передаёт временной смысл מַמְלֶכֶת в данном контексте.
- source_word: יְהוֹיָקִם בֶּן יֹאושִׁיָּהוּ
  choice: Иоакима, сына Иосии
  rationale: Имена переданы в традиционной русской библейской форме, а родственная связь сохранена явно.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Прямое и естественное обозначение царского титула и страны.
- source_word: הָיָה הַדָּבָר הַזֶּה אֶל יִרְמְיָה
  choice: к Иеремии пришло… такое слово
  rationale: Сохранена характерная пророческая формула, при этом русский порядок слов сделан естественным. «Слово» не сужает значение до более толковательного «послания».
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: Предлог передаёт источник откровения, а тетраграмматон представлен как личное имя «Яхве».
- source_word: לֵאמֹר
  choice: двоеточие после «слово»
  rationale: Еврейская формула вводит последующую прямую речь; в современном русском её функцию естественно выполняет двоеточие, поскольку содержание слова начинается в следующем стихе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное Божественное имя; транслитерация сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Имя царя в начале стиха
  choice: Иоаким
  alternative: Седекия
  rationale: Основной текст следует предоставленному еврейскому тексту WLC и не исправляет его по контексту. Разночтение и контекстуальная трудность указаны в примечании, чтобы сохранить напряжение свидетельств.
