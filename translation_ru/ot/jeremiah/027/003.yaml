source:
  edition: WLC
  text: וְ/שִׁלַּחְתָּ/ם֩ אֶל מֶ֨לֶךְ אֱד֜וֹם וְ/אֶל מֶ֣לֶךְ מוֹאָ֗ב וְ/אֶל מֶ֨לֶךְ֙ בְּנֵ֣י עַמּ֔וֹן וְ/אֶל מֶ֥לֶךְ צֹ֖ר וְ/אֶל מֶ֣לֶךְ צִיד֑וֹן בְּ/יַ֤ד מַלְאָכִים֙ הַ/בָּאִ֣ים יְרוּשָׁלִַ֔ם אֶל צִדְקִיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/003.yaml
  text: And send them to the king of Edom[a], the king of Moab, the king of the Ammonites, the king of Tyre, and the king of Sidon, by the hand of the messengers who are coming to Jerusalem to Zedekiah king of Judah.
translation:
  language: ru
  text: И пошли их к царю Эдома, к царю Моава, к царю аммонитян[a], к царю Тира и к царю Сидона через посланников, которые прибывают в Иерусалим к Седекии, царю Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Аммона», то есть аммонитян.'
    reason: Сохраняет буквальную форму еврейского этнического обозначения בְּנֵי עַמּוֹן.
lexical_decisions:
- source_word: וְשִׁלַּחְתָּם
  choice: И пошли их
  rationale: Пиэль, перфект 2-го лица мужского рода единственного числа с суффиксом 3-го лица множественного числа, в последовательности предписаний имеет повелительную силу; союз וְ передан как «И».
- source_word: מֶלֶךְ
  choice: царь / к царю
  rationale: Форма сопряжённого состояния обозначает царя соответствующего народа или города; русский падеж определяется предлогом אֶל.
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Буквально «сыны Аммона», но в геополитическом перечне это устойчивое этническое обозначение; естественный русский эквивалент — «аммонитяне».
- source_word: בְּיַד
  choice: через
  rationale: Идиома буквально означает «рукой» и здесь выражает посредничество или передачу через посланников; «через» естественно передаёт её функцию по-русски.
- source_word: מַלְאָכִים
  choice: посланники
  rationale: Слово обозначает посланцев; контекст допускает дипломатических представителей, но не требует более узкого «послы».
- source_word: הַבָּאִים
  choice: которые прибыли
  rationale: Субстантивированное причастие описывает прибывающих или пришедших посланников. В данном контексте они уже находятся при дворе, поэтому русское прошедшее совершенного вида естественно передаёт результат их прибытия, не меняя референции.
- source_word: אֶל צִדְקִיָּהוּ
  choice: к Седекии
  rationale: Предлог אֶל указывает направление движения к царю Седекии.
theological_decisions:
- issue: Этническое выражение בְּנֵי עַמּוֹן
  choice: аммонитяне
  alternative: сыны Аммона
  rationale: В перечне государей выражение функционирует как название народа. Идиоматическое «аммонитяне» не устраняет значимого богословского оттенка, а буквальная форма сохранена в примечании.
- issue: Временной оттенок причастия הַבָּאִים
  choice: которые прибыли
  alternative: которые идут / приходят
  rationale: Еврейское причастие само по себе допускает текущую или контекстуально завершившуюся ситуацию. По смыслу речь о представителях, прибывших к Седекии; русский совершенный вид делает синтаксис ясным без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Повтор «к царю» сохранён ради ритма и структуры перечня; архаизирующее «рукою» заменено функциональным «через».
