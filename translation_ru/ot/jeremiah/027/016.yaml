  text: וְ/אֶל הַ/כֹּהֲנִים֩ וְ/אֶל כָּל הָ/עָ֨ם הַ/זֶּ֜ה דִּבַּ֣רְתִּי לֵ/אמֹ֗ר כֹּה֮ אָמַ֣ר יְהוָה֒ אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י נְבִֽיאֵי/כֶ֗ם הַֽ/נִּבְּאִ֤ים לָ/כֶם֙ לֵ/אמֹ֔ר הִנֵּ֨ה כְלֵ֧י בֵית יְהוָ֛ה מוּשָׁבִ֥ים מִ/בָּבֶ֖לָ/ה עַתָּ֣ה מְהֵרָ֑ה כִּ֣י שֶׁ֔קֶר הֵ֖מָּה נִבְּאִ֥ים לָ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/016.yaml
  text: 'And to the priests and to all this people I spoke[a], saying, “Thus says Yahweh: Do not listen to the words of your prophets who are prophesying to you, saying, ‘Behold, the vessels of the house of Yahweh are being brought back from Babylon now, quickly,’ for they are prophesying falsely to you.”'
translation:
  language: ru
  text: 'И священникам, и всему этому народу я сказал: «Так говорит Яхве: не слушайте слов ваших пророков, которые пророчествуют вам, говоря: „Вот, сосуды Дома Яхве вот-вот будут возвращены из Вавилона“[a], ибо они пророчествуют вам ложь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «теперь, быстро». Это выражение подчёркивает, что ложные пророки обещали возвращение в самое ближайшее время.'
    reason: Лексически буквальная форма в основном тексте звучала бы по-русски неестественно; примечание сохраняет усиленную срочность еврейского выражения.
lexical_decisions:
- source_word: וְאֶל הַכֹּהֲנִים וְאֶל כָּל הָעָם הַזֶּה
  choice: И священникам, и всему этому народу
  rationale: Повторение «и ... и» передаёт повторяющиеся союз и предлог; «народ» сохранён как собирательное существительное в единственном числе.
- source_word: דִּבַּרְתִּי לֵאמֹר
  choice: я сказал
  rationale: Естественная русская передача формулы введения прямой речи; буквальное «говорил, говоря» было бы тяжеловесным и не добавляло бы смысла.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена устойчивая пророческая формула и личное имя, представленное тетраграмматоном.
- source_word: אַל תִּשְׁמְעוּ אֶל
  choice: не слушайте
  rationale: Передаёт не просто слуховое восприятие, а призыв не внимать словам пророков.
- source_word: דִּבְרֵי נְבִיאֵיכֶם
  choice: слов ваших пророков
  rationale: Сохраняет конкретное значение «слова» и притяжательное отношение исходного текста.
- source_word: הַנִּבְּאִים לָכֶם
  choice: которые пророчествуют вам
  rationale: Причастная форма обозначает продолжающееся действие; адресат пророчества выражен явно.
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный и достойный русский эквивалент указательно-вводной частицы.
- source_word: כְלֵי בֵית יְהוָה
  choice: сосуды дома Яхве
  rationale: «Сосуды» уместно обозначает храмовые священные предметы, а «дом Яхве» сохраняет образ и лексику оригинала.
- source_word: מוּשָׁבִים מִבָּבֶלָה
  choice: будут возвращены из Вавилона
  rationale: Страдательная форма передаёт значение хофаля от שוב; будущее время естественно по-русски выражает обещанное скорое возвращение.
- source_word: עַתָּה מְהֵרָה
  choice: уже скоро
  rationale: Передаёт подчёркнутую ложными пророками непосредственную близость события без неестественного русского сочетания «теперь, быстро».
- source_word: כִּי שֶׁקֶר הֵמָּה נִבְּאִים לָכֶם
  choice: Они пророчествуют вам ложь
  rationale: Сохраняет существительное «ложь» и прямую связь ложного пророчества с адресатами.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале непосредственно употреблён тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Характер ложного пророчества
  choice: пророчествуют вам ложь
  alternative: лжепророчествуют вам / пророчествуют вам ложно
  rationale: Выбор сохраняет שֶׁקֶר как существительное и не вводит дополнительного конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис упрощён лишь там, где буквальное воспроизведение еврейской вводной формулы было бы неестественным; повтор адресатов, храмовая образность и напряжённость утверждения о лжи сохранены.
