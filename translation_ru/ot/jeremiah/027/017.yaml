  - marker: b
    text: 'Или: «Почему этот город должен стать опустошённым?» Еврейское слово обозначает разорение, развалины или опустошённое место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁמְעוּ אֲלֵיהֶם
  choice: Не слушайте их
  rationale: Глагол שׁמע с אֶל означает «слушать» и по смыслу может включать «внимать, повиноваться». Естественное русское выражение сохраняет эту широту; альтернативный оттенок отмечен в сноске.
- source_word: עִבְדוּ
  choice: Служите
  rationale: Здесь עבד обозначает служение царю в смысле политического подчинения. «Служите» сохраняет и прямое значение, и требование признать власть Вавилона.
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: царю Вавилона
  rationale: Прозрачная передача еврейской конструкции; дательный падеж обусловлен русским управлением глагола «служить».
- source_word: וִחְיוּ
  choice: и останетесь живы
  rationale: 'Сочетание императивов имеет оттенок результата: подчинитесь — и будете жить. «Останетесь живы» естественно передаёт обещанное сохранение жизни, не превращая призыв в отвлечённое «живите».'
- source_word: לָמָּה תִהְיֶה
  choice: Зачем … превращаться
  rationale: Риторический вопрос указывает на нежелательный будущий исход. «Зачем» в современном русском естественно выражает призыв избежать его, а «превращаться» передаёт переход в состояние разорения.
- source_word: הָעִיר הַזֹּאת
  choice: этому городу
  rationale: Стандартная передача указательной конструкции «этот город» с падежной формой, требуемой русским оборотом.
- source_word: חָרְבָּה
  choice: в руины
  rationale: Существительное חָרְבָּה обозначает разорение, развалины или опустошённое место. Множественное «руины» идиоматично по-русски; смысловая альтернатива дана в сноске.
