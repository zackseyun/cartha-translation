  yaml_path: translation/ot/jeremiah/027/017.yaml
  text: Do not listen to them[a]. Serve the king of Babylon and live[b]. Why should this city become a ruin?
translation:
  language: ru
  text: Не слушайте их[a]. Служите царю Вавилона и живите. Зачем этому городу стать развалинами?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не повинуйтесь им». Еврейский глагол может означать не только слушать, но и внимать или повиноваться.'
