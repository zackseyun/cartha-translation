source:
  edition: WLC
  text: וְ/אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י הַ/נְּבִאִ֗ים הָ/אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֣לֶךְ בָּבֶ֑ל כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֥ים לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/014.yaml
  text: And do not listen to the words of the prophets who are saying to you[a], ‘You will not serve the king of Babylon,’ for they are prophesying a lie to you.
translation:
  language: ru
  text: 'И не слушайте слов пророков, которые говорят вам: «Не будете служить царю Вавилона»[a], — потому что они пророчествуют вам ложь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не служите царю Вавилона». Еврейскую форму можно понять как запрет, но в данном контексте вероятнее, что это ложное предсказание пророков о том, что Иудее не придётся служить Вавилону.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַל
  choice: И не
  rationale: Союз וְ связывает повеление с предшествующей речью, а אַל с имперфектом выражает запрет; сочетание «И не» естественно сохраняет ход рассуждения.
- source_word: תִּשְׁמְעוּ אֶל דִּבְרֵי
  choice: слушайте слов
  rationale: שׁמע с אֶל здесь означает внимать, прислушиваться; конструкция «слушать слов» сохраняет образ еврейского выражения и уместна в dignified modern Russian.
- source_word: הַנְּבִאִים הָאֹמְרִים אֲלֵיכֶם
  choice: пророков, которые говорят вам
  rationale: Причастие הָאֹמְרִים передаёт продолжающуюся или повторяющуюся речь известной из контекста группы пророков.
- source_word: לֹא תַעַבְדוּ
  choice: Не будете служить
  rationale: В цитируемой пророческой речи имперфект естественно понимается как предсказание будущего; форма также сохраняет возможность иного, запретительного прочтения в сноске.
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: царю Вавилона
  rationale: При глаголе עבד служение человеку по-русски требует дательного падежа; конструкция ясно передаёт подчинение вавилонскому царю.
- source_word: כִּי שֶׁקֶר הֵם נִבְּאִים לָכֶם
  choice: потому что они пророчествуют вам ложь
  rationale: כִּי вводит основание запрета, שֶׁקֶר сохраняется как прямое обозначение лжи, а נִבְּאִים передаётся глаголом «пророчествуют», сохраняющим характер их притязания.
theological_decisions:
- issue: Характер ложного пророческого сообщения
  choice: «Не будете служить царю Вавилона» — ложное предсказание
  alternative: «Не служите царю Вавилона» — запрет или призыв
  rationale: Контекст речи Иеремии направлен против пророков, отрицавших предстоящее подчинение Вавилону, поэтому форма естественнее читается как предсказание. Однако еврейский имперфект допускает запретительное понимание, которое отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены повтор «вам» и прямое сочетание «пророчествуют… ложь», чтобы передать структуру и акцент еврейского текста.
