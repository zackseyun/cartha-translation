  text: וְ/הָיָ֨ה הַ/גּ֜וֹי וְ/הַ/מַּמְלָכָ֗ה אֲשֶׁ֨ר לֹֽא יַעַבְד֤וּ אֹת/וֹ֙ אֶת נְבוּכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/אֵ֨ת אֲשֶׁ֤ר לֹֽא יִתֵּן֙ אֶת צַוָּאר֔/וֹ בְּ/עֹ֖ל מֶ֣לֶךְ בָּבֶ֑ל בַּ/חֶרֶב֩ וּ/בָ/רָעָ֨ב וּ/בַ/דֶּ֜בֶר אֶפְקֹ֨ד עַל הַ/גּ֤וֹי הַ/הוּא֙ נְאֻם יְהוָ֔ה עַד תֻּמִּ֥/י אֹתָ֖/ם בְּ/יָדֽ/וֹ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/008.yaml
  text: And it shall be that the nation or the kingdom that will not serve him[a], Nebuchadnezzar king of Babylon, and that will not put its neck under the yoke of the king of Babylon, I will punish that nation with the sword, with famine, and with pestilence, declares Yahweh[c][b], until I have finished them by his hand.
translation:
  language: ru
  text: И если любой народ или царство[a] не станет служить ему — Навуходоносору, царю Вавилона, — и не подставит свою шею под ярмо царя Вавилона[b], то Я накажу этот народ мечом, голодом и мором, — возвещает Яхве, — пока Я не положу им конец его рукой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «народ и царство»; два политических обозначения образуют распределительное предупреждение, относящееся к любому владению, которое откажется подчиниться Вавилону.'
    reason: lexical_alternative
  - marker: b
    text: «Подставить шею под ярмо» — образ подчинения власти вавилонского царя.
    reason: cultural_note
  - marker: c
    text: 'Или: «пока не доведу их до конца его рукой». «Его рукой» означает, что Навуходоносор станет орудием наказания.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: И если
  rationale: В данном контексте формула вводит условие и его будущее последствие; по-русски «И если» естественно связывает стих с предшествующей речью, не утрачивая пророческой весомости.
- source_word: הַגּוֹי וְהַמַּמְלָכָה
  choice: какой-либо народ или царство
  rationale: Еврейское сочетание буквально соединено союзом «и», но предупреждение имеет распределительный смысл и относится к любой политической общности. «Или» ясно передаёт этот смысл; буквальная форма отмечена в сноске.
- source_word: יַעַבְדוּ אֹתוֹ אֶת נְבוּכַדְנֶאצַּר
  choice: не станет служить ему — Навуходоносору
  rationale: עבד обозначает здесь политическое подчинение и службу имперскому правителю. Местоимение с последующим поясняющим именем сохранено.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Навуходоносор
  rationale: Устоявшаяся русская форма имени вавилонского царя.
- source_word: יִתֵּן אֶת צַוָּארוֹ בְּעֹל
  choice: не подставит свою шею под ярмо
  rationale: Передан конкретный образ добровольного или вынужденного подчинения; русский оборот остаётся понятным без замены метафоры абстрактным «не покорится».
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  choice: мечом, голодом и мором
  rationale: Сохранена характерная для Иеремии тройная формула суда. «Мор» — краткий и уместный в возвышенной речи русский эквивалент массовой смертоносной болезни.
- source_word: אֶפְקֹד עַל
  choice: Я накажу
  rationale: В контексте суда פקד על означает обратить карающее внимание, то есть наказать; прямой русский глагол наиболее ясен.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Формула передаёт торжественное пророческое изречение, а не просто разговорное «говорит».
- source_word: עַד תֻּמִּי אֹתָם
  choice: пока не покончу с ними
  rationale: Глагол תמם выражает доведение до конца. Формулировка сохраняет суровость суда, не уточняя сверх текста конкретный способ уничтожения.
- source_word: בְּיָדוֹ
  choice: его рукой
  rationale: Сохранён еврейский образ руки как орудия действия; местоимение относится к Навуходоносору.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное божественное имя — тетраграмматон; транслитерация «Яхве» отличает его от титула אֲדֹנָי и не вносит конфессионального толкования.
- issue: Степень окончательности суда в עַד תֻּמִּי אֹתָם
  choice: пока не покончу с ними
  alternative: пока не истреблю их
  rationale: Источник говорит о доведении их до конца, но не употребляет здесь специального глагола «истреблять»; выбранный вариант сохраняет и окончательность, и лексическую сдержанность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены метафоры ярма и руки, но синтаксис сделан естественным для современного читателя. Формы «Навуходоносор», «царь Вавилона» и «Яхве» употреблены последовательно; архаизмы вроде «будет же» и «моровая язва» не использованы.
