  to: И если любой народ или царство[a] не станет служить ему — Навуходоносору, царю Вавилона, — и не подставит свою шею под ярмо царя Вавилона[b], то Я накажу этот народ мечом, голодом и мором, — возвещает Яхве, — пока Я не положу им конец его рукой[c].
