source:
  edition: WLC
  text: וְ֠/אַתֶּם אַל תִּשְׁמְע֨וּ אֶל נְבִיאֵי/כֶ֜ם וְ/אֶל קֹֽסְמֵי/כֶ֗ם וְ/אֶל֙ חֲלֹמֹ֣תֵי/כֶ֔ם וְ/אֶל עֹֽנְנֵי/כֶ֖ם וְ/אֶל כַּשָּׁפֵי/כֶ֑ם אֲשֶׁר הֵ֞ם אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֥לֶךְ בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/009.yaml
  text: But you[a], do not listen to your prophets, your diviners, your dreamers, your soothsayers, or your sorcerers, who are saying to you, ‘You will not serve the king of Babylon.’
translation:
  language: ru
  text: 'А вы не слушайте ни своих пророков, ни прорицателей, ни сновидцев[a], ни гадателей, ни колдунов, которые говорят вам: «Вы не будете служить царю Вавилона».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ваших снов»; в этом перечне, вероятно, имеются в виду люди, которые ссылаются на сны как на откровения.'
    reason: Сохраняет формальное значение еврейского слова и отмечает вероятную метонимию, не навязывая значение «толкователи снов».
lexical_decisions:
- source_word: וְאַתֶּם
  choice: А вы
  rationale: Союз с самостоятельным местоимением выражает контраст с предшествующим обращением; «А вы» естественно передаёт его по-русски.
- source_word: אַל תִּשְׁמְעוּ אֶל
  choice: не слушайте
  rationale: Сочетание שׁמע с אֶל означает «слушать, внимать»; запрет передан прямо, без усиления до «не повинуйтесь».
- source_word: נְבִיאֵיכֶם
  choice: своих пророков
  rationale: Сохранено обычное значение נביא и принадлежность этих пророков к сообществам адресатов; слово «своих» естественно при общем для всего перечня притяжательном отношении.
- source_word: קֹסְמֵיכֶם
  choice: прорицателей
  rationale: קסם обозначает практику прорицания; это точное и литературно нейтральное русское наименование.
- source_word: חֲלֹמֹתֵיכֶם
  choice: толкователей снов
  rationale: Формально слово означает «ваши сны», но в перечне действующих лиц, вероятно, метонимически обозначает людей, ссылающихся на откровения во сне. Сноска сохраняет буквальную форму и неоднозначность.
- source_word: עֹנְנֵיכֶם
  choice: предсказателей
  rationale: Термин обозначает занимающихся знамениями или предсказаниями; широкий русский эквивалент не навязывает спорный конкретный способ гадания.
- source_word: כַּשָּׁפֵיכֶם
  choice: колдунов
  rationale: כשף связано с колдовством и магической практикой; «колдуны» — прямой и понятный современному читателю эквивалент.
- source_word: אֲשֶׁר הֵם אֹמְרִים אֲלֵיכֶם לֵאמֹר
  choice: которые говорят вам
  rationale: Причастная конструкция указывает на повторяемое или продолжающееся сообщение; настоящее время естественно передаёт это по-русски.
- source_word: לֹא תַעַבְדוּ
  choice: Вы не будете служить
  rationale: 'В составе передаваемой речи имперфект лучше понимать как предсказание, а не повеление: эти люди обещают, что подчинения Вавилону не будет.'
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: царю Вавилона
  rationale: Конструкция означает царя, правящего Вавилоном; дательный падеж обусловлен русским управлением глагола «служить».
theological_decisions:
- issue: Перечень недостоверных религиозных и оккультных авторитетов
  choice: Сохранить прямые наименования «пророки, прорицатели, толкователи снов, предсказатели, колдуны», не добавляя «лжепророки» или «так называемые».
  alternative: Явно назвать пророков ложными либо взять их название в кавычки.
  rationale: Еврейский текст сам не добавляет определения «ложные»; их ненадёжность устанавливается запретом слушать их и контекстом. Перевод не должен заранее разрешать это посредством добавленного определения.
- issue: Характер слов לֹא תַעַבְדוּ в речи этих людей
  choice: 'Передать как предсказание: «Вы не будете служить».'
  alternative: 'Передать как призыв: «Не служите».'
  rationale: После «говорят вам» форма естественнее выражает обещание отсутствия будущего подчинения; повелительный перевод изменил бы содержание их сообщения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «ни» поддерживает ритм перечня и ясно связывает все группы с единым запретом; притяжательное «своих» не повторяется перед каждым существительным во избежание тяжеловесности.
