  text: וְ/עַתָּ֗ה אָֽנֹכִי֙ נָתַ֨תִּי֙ אֶת כָּל הָ/אֲרָצ֣וֹת הָ/אֵ֔לֶּה בְּ/יַ֛ד נְבוּכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַבְדִּ֑/י וְ/גַם֙ אֶת חַיַּ֣ת הַ/שָּׂדֶ֔ה נָתַ֥תִּי ל֖/וֹ לְ/עָבְדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/006.yaml
  text: And now I have given all these lands into the hand of Nebuchadnezzar king of Babylon[a], my servant[b]; and I have also given him the beasts of the field to serve him.
translation:
  language: ru
  text: А теперь Я отдал все эти земли в руку Навуходоносора, царя Вавилона[a], Моего слуги[b]; а также отдал ему полевых зверей, чтобы они служили ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское имя царя также передают как «Невухаднецар»; «Навуходоносор» — традиционная русская форма.
    reason: lexical_alternative
  - marker: b
    text: Название «Мой слуга» означает здесь, что Бог использует Навуходоносора как исполнителя Своего замысла; оно само по себе не выражает нравственного одобрения его поступков.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет и соединительную силу וְ, и временно-дискурсивное значение עַתָּה, вводя нынешнее Божье объявление.
- source_word: אָנֹכִי נָתַתִּי
  choice: Я отдал
  rationale: Самостоятельное местоимение передаёт подчёркнутого деятеля — Бога; русский перфектив прошедшего времени естественно выражает совершённое действие, сохраняющее силу в настоящем.
- source_word: כָּל הָאֲרָצוֹת הָאֵלֶּה
  choice: все эти земли
  rationale: «Земли» обозначают упомянутые территории и владения, не навязывая современного политического смысла слова «страны».
- source_word: בְּיַד
  choice: в руку
  rationale: Сохраняет еврейский образ передачи под власть и контроль; выражение понятно в возвышенном библейском контексте.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Навуходоносора, царя Вавилона
  rationale: Использована укоренившаяся в русском библейском и литературном употреблении форма имени и прямо передана конструкция титула.
- source_word: עַבְדִּי
  choice: Моего слуги
  rationale: עֶבֶד здесь характеризует языческого царя как исполнителя Божьего замысла; «слуга» передаёт служебную роль лучше, чем социально-правовое «раб».
- source_word: וְגַם אֶת חַיַּת הַשָּׂדֶה
  choice: даже полевых зверей
  rationale: וְגַם добавляет усиленный, примечательный элемент к объёму передачи; собирательное выражение естественно передано множественным числом.
- source_word: נָתַתִּי לוֹ לְעָבְדוֹ
  choice: Я отдал ему, чтобы они служили ему
  rationale: Инфинитив с לְ передаёт цель или результат подчинения; повтор «ему» сохраняет ясность отношений, а множественное «они» естественно согласуется с русским «зверей».
theological_decisions:
- issue: Навуходоносор назван Божьим עֶבֶד
  choice: Моего слуги
  alternative: Моего раба
  rationale: Текст сохраняет богословски напряжённое утверждение, что Бог использует языческого царя как Своё орудие, но не утверждает этим нравственного одобрения царя. «Слуга» выражает порученную функцию без лишнего акцента на его социальном статусе.
- issue: Масштаб данной царю власти включает животных
  choice: даже полевых зверей Я отдал ему, чтобы они служили ему
  alternative: и также зверей полевых дал ему в подчинение
  rationale: Формулировка сохраняет прямое утверждение текста о всеохватности Божьего распоряжения и не сводит его заранее к одной метафорической трактовке.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавные буквы в «Я» и «Моего» обозначают Бога в соответствии с устойчивой русской издательской практикой. Сохранён образ «в руку», но синтаксис сделан естественным для современного читателя.
