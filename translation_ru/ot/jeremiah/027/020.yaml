base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/020.yaml
  text: which Nebuchadnezzar king of Babylon did not take when he exiled Jeconiah son of Jehoiakim[a], king of Judah, from Jerusalem to Babylon[c][b], along with all the nobles of Judah and Jerusalem.
translation:
  language: ru
  text: которых Навуходоносор, царь Вавилона, не забрал, когда увёл в плен[a] из Иерусалима в Вавилон Иехонию[b], сына Иоакима, царя Иудеи, вместе со всеми вельможами[c] Иудеи и Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда переселил в изгнание».'
    reason: lexical_alternative
  - marker: b
    text: Еврейская форма имени — Йехонья; также передаётся как Ехония.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «знатными людьми», «высокопоставленными лицами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לֹא לְקָחָם
  choice: которых … не забрал
  rationale: Относительное местоимение относится к сосудам из предыдущего стиха; форма множественного числа суффикса сохранена. «Не забрал» естественно передаёт действие в контексте вывоза имущества.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Навуходоносор, царь Вавилона
  rationale: Использована общепринятая русская форма имени и прямо сохранена конструкция титула.
- source_word: בַּגְלוֹתוֹ
  choice: когда увёл в плен
  rationale: Временная конструкция с инфинитивом גלה обозначает переселение в изгнание; выбран естественный русский оборот, сохраняющий принудительный характер депортации.
- source_word: יְכָונְיָה בֶן יְהוֹיָקִים
  choice: Иехонию, сына Иоакима
  rationale: Сохранены традиционные русские формы царских имён и прямое указание на родство.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: из Иерусалима в Вавилон
  rationale: Предлоги и направительная форма передают исходную точку и место назначения.
- source_word: וְאֵת כָּל חֹרֵי יְהוּדָה וִירוּשָׁלִָם
  choice: вместе со всеми вельможами Иудеи и Иерусалима
  rationale: חֹרֵי обозначает знатных или высокопоставленных людей. «Вельможи» точно передаёт общественно-политический статус, а «вместе с» ясно связывает их депортацию с депортацией царя.
