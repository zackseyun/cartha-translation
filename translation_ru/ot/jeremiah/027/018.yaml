base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/018.yaml
  text: But if they are prophets[a], and if the word of Yahweh is with them, let them now plead with Yahweh of hosts that the vessels remaining in the house of Yahweh, in the house of the king of Judah[c][b], and in Jerusalem may not go to Babylon.
translation:
  language: ru
  text: Но если они пророки и если слово Яхве с ними, пусть же молят Яхве Воинств[a], чтобы оставшиеся сосуды, находящиеся в доме Яхве, в доме царя Иудеи[b] и в Иерусалиме, не попали в Вавилон[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть ходатайствуют перед Яхве Воинств». Еврейский глагол может обозначать настойчивую просьбу или ходатайство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во дворце царя Иудеи». Буквально: «в доме царя Иудеи».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не пришли в Вавилон»; в русском «не попали в Вавилон» естественно передаёт прибытие предметов без уточнения способа их перемещения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם נְבִאִים הֵם
  choice: Но если они пророки
  rationale: Условие звучит как вызов лжепророкам на фоне предыдущего контекста; «но» естественно передаёт противопоставление.
- source_word: וְאִם יֵשׁ דְּבַר יְהוָה אִתָּם
  choice: и если с ними слово Яхве
  rationale: Сохраняет еврейскую конструкцию и намеренно не сводит её к более свободному «если у них есть слово».
- source_word: יִפְגְּעוּ נָא בַּיהוָה צְבָאוֹת
  choice: пусть теперь молят Яхве Воинств
  rationale: Глагол פגע с ב здесь обозначает настойчивую просьбу или ходатайство; «молят» естественно выражает обращение к Богу, а «теперь» передаёт נָא.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное Божье имя.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет образ צְבָאוֹת и связь титула с личным именем Яхве.
- source_word: הַכֵּלִים הַנּוֹתָרִים
  choice: оставшиеся сосуды
  rationale: «Сосуды» соответствует храмовой и дворцовой утвари и сохраняет традиционную предметную конкретность כֵּלִים.
- source_word: בְּבֵית יְהוָה
  choice: из дома Яхве
  rationale: Предлог ב обозначает местонахождение оставшейся утвари, но в русской конструкции с «унесены» источник естественно выражается через «из»; «дом» сохраняет лексику оригинала.
- source_word: וּבֵית מֶלֶךְ יְהוּדָה
  choice: из дворца царя Иудеи
  rationale: Хотя буквально сказано «дом царя», в данном контексте современное русское «дворец» точно обозначает царскую резиденцию.
- source_word: לְבִלְתִּי בֹאוּ ... בָּבֶלָה
  choice: чтобы ... не были унесены в Вавилон
  rationale: Передаёт цель ходатайства и подразумеваемое насильственное перемещение сосудов; буквальное «не пришли» по-русски было бы неестественно и могло бы создать неверный образ самостоятельного движения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал непосредственно употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и отличает его от титула.
- issue: Значение יִפְגְּעוּ в пророческом контексте
  choice: молят
  alternative: ходатайствуют перед
  rationale: Контекст подразумевает ходатайство, однако «молят» сохраняет более широкий смысл настойчивого обращения и не превращает глагол в узкий богословский термин.
- issue: Каузативность перемещения сосудов в לְבִלְתִּי בֹאוּ
  choice: не были унесены
  alternative: не отправились / не пришли
  rationale: Сосуды неодушевлённы и должны быть вывезены завоевателями; пассивная формулировка ясно передаёт подразумеваемое действие, не называя невыраженного агента.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохранён близким к еврейскому, но неодушевлённое בֹאוּ передано естественной русской пассивной конструкцией. Термин «сосуды» выбран как понятное традиционное обозначение храмовой и дворцовой утвари.
