revisions:
- from: Но если они пророки и если с ними слово Яхве, пусть теперь молят Яхве Воинств[a], чтобы оставшиеся сосуды из дома Яхве, из дворца царя Иудеи[b] и из Иерусалима не были унесены в Вавилон[c].
  to: Но если они пророки и если слово Яхве с ними, пусть же молят Яхве Воинств[a], чтобы оставшиеся сосуды, находящиеся в доме Яхве, в доме царя Иудеи[b] и в Иерусалиме, не попали в Вавилон[c].
  rationale: Перевод исправлен для сохранения функции еврейских локативных оборотов и для устранения добавленного представления о насильственном унесении. «Пусть же» передаёт побудительно-просительную окраску נא без не вполне естественного в данном русском контексте «теперь».
