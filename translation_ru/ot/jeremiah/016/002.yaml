lexical_decisions:
- source_word: תִקַּח לְךָ אִשָּׁה
  choice: бери себе жену
  rationale: Оборот буквально означает «взять себе жену» и в данном контексте выражает вступление в брак. Формулировка сохраняет еврейский образ и остаётся понятной по-русски.
- source_word: וְלֹא יִהְיוּ לְךָ
  choice: и пусть не будет у тебя
  rationale: Конструкция היה с לְ выражает наличие или принадлежность. Русская конструкция близко передаёт форму и повелительно-запретительный смысл контекста.
- source_word: בָּנִים וּבָנוֹת
  choice: ни сыновей, ни дочерей
  rationale: Источник прямо называет потомков обоих полов; повтор «ни... ни...» естественно передаёт их отрицание в русском языке.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: на этом месте
  rationale: מָקוֹם прежде всего означает «место». Перевод сохраняет указательное значение и не расширяет его до «земли» или «страны».
theological_decisions:
- issue: Сила запрета, обращённого к Иеремии
  choice: Прямое Божье запрещение Иеремии вступать в брак и иметь детей на этом месте
  alternative: Предсказание того, что Иеремия останется неженатым и бездетным, либо запрет, относящийся ко всей земле
  rationale: Формы второго лица единственного числа и отрицательная конструкция в контексте имеют силу прямого повеления. «На этом месте» сохраняет локальную направленность исходного текста, не уточняя её сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной библейской интонацией. Буквальный брачный оборот сохранён в основном тексте, а более динамичный вариант дан в сноске.
