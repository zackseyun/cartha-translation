source:
  edition: WLC
  text: וְ/הֵטַלְתִּ֣י אֶתְ/כֶ֗ם מֵ/עַל֙ הָ/אָ֣רֶץ הַ/זֹּ֔את עַל הָ/אָ֕רֶץ אֲשֶׁר֙ לֹ֣א יְדַעְתֶּ֔ם אַתֶּ֖ם וַ/אֲבֽוֹתֵי/כֶ֑ם וַ/עֲבַדְתֶּם שָׁ֞ם אֶת אֱלֹהִ֤ים אֲחֵרִים֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֲשֶׁ֛ר לֹֽא אֶתֵּ֥ן לָ/כֶ֖ם חֲנִינָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/013.yaml
  text: So I will cast you out from this land onto a land that neither you nor your fathers have known[a], and there you will serve other gods day and night[d][c][b], for I will show you no favor.
translation:
  language: ru
  text: И Я выброшу[a] вас из этой земли в землю, которой не знали ни вы, ни ваши отцы[b]. Там вы будете день и ночь служить[c] другим богам, потому что Я не окажу вам милости[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «отброшу» или «швырну прочь». Еврейский глагол подчёркивает силу и насильственный характер изгнания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ваши предки». Буквально: «ваши отцы».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «поклоняться». Еврейский глагол обычно означает «служить», а применительно к богам может подразумевать служение-поклонение.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «не дарую вам благоволения». Еврейское существительное обозначает милость, благосклонность или благоволение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  choice: И Я выброшу
  rationale: Порода хифиль передаёт сильное, принудительное удаление — буквально действие, при котором кого-либо бросают прочь. «Выброшу» естественно звучит по-русски и сохраняет резкость изгнания.
- source_word: מֵעַל הָאָרֶץ הַזֹּאת עַל הָאָרֶץ
  choice: из этой земли в землю
  rationale: Буквальное пространственное противопоставление «с этой земли — на землю» по-русски звучит неестественно. Пара «из… в…» ясно передаёт изгнание из одной страны и перемещение в другую.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם אַתֶּם וַאֲבוֹתֵיכֶם
  choice: которой не знали ни вы, ни ваши отцы
  rationale: Глагол ידע передан обычным «знали», а конструкция с двумя подлежащими — естественным русским оборотом «ни… ни…». «Отцы» сохраняет конкретное слово еврейского текста.
- source_word: וַעֲבַדְתֶּם שָׁם אֶת אֱלֹהִים אֲחֵרִים
  choice: Там вы будете … служить другим богам
  rationale: עבד означает «служить» и в отношении богов включает поклонение. Более широкое «служить» сохраняет возможную иронию и не уточняет без основания, будет ли это добровольным поклонением или следствием жизни в изгнании.
- source_word: יוֹמָם וָלַיְלָה
  choice: день и ночь
  rationale: Сохранён ясный образ непрерывности из еврейского текста без замены абстрактным «постоянно».
- source_word: אֲשֶׁר לֹא אֶתֵּן לָכֶם חֲנִינָה
  choice: потому что Я не окажу вам милости
  rationale: В контексте אֲשֶׁר естественно понято причинно, а חֲנִינָה обозначает милость, благосклонность или благоволение. Формула «оказать милость» современна, понятна и не превращает слово в узкий богословский термин.
theological_decisions:
- issue: Значение וַאֲבוֹתֵיכֶם
  choice: ваши отцы
  alternative: ваши предки
  rationale: Еврейский текст буквально называет «отцов». Основной перевод сохраняет этот образ, тогда как более широкий родовой смысл указан в примечании.
- issue: Характер служения иным богам
  choice: служить другим богам
  alternative: поклоняться другим богам
  rationale: «Служить» сохраняет полный диапазон עבד и не снимает напряжение между религиозным поклонением и подчинением чужому укладу в изгнании.
- issue: Смысл חֲנִינָה
  choice: милость
  alternative: благоволение
  rationale: «Милость» передаёт отказ Бога проявить благосклонность, но примечание сохраняет лексическую возможность «благоволения» и не навязывает технического догматического смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; резкость изгнания и богословская неоднозначность «служения» другим богам сохранены. Заглавная «Я» употреблена как традиционное типографическое обозначение речи Бога, без добавления отсутствующих в источнике титулов.
