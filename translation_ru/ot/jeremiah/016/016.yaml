  text: הִנְ/נִ֨י שֹׁלֵ֜חַ ל/דוגים רַבִּ֛ים נְאֻם יְהוָ֖ה וְ/דִיג֑וּ/ם וְ/אַֽחֲרֵי כֵ֗ן אֶשְׁלַח֙ לְ/רַבִּ֣ים צַיָּדִ֔ים וְ/צָד֞וּ/ם מֵ/עַ֤ל כָּל הַר֙ וּ/מֵ/עַ֣ל כָּל גִּבְעָ֔ה וּ/מִ/נְּקִיקֵ֖י הַ/סְּלָעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/016.yaml
  text: Look[a], I am sending for many fishermen, declares Yahweh, and they will catch them; and after that I will send for many hunters[b], and they will hunt them from every mountain and from every hill and from the clefts of the rocks.
translation:
  language: ru
  text: Вот, Я посылаю за многими рыбаками[a], — возвещает Яхве, — и они выловят их. А после этого Я пошлю за многими охотниками[b], и они будут охотиться на них, снимая их с каждой горы, с каждого холма и из расселин скал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ловцов рыбы».'
    reason: lexical_alternative
  - marker: b
    text: Образы рыбаков и охотников показывают, что людей разыщут и схватят, где бы они ни скрывались. Сам стих не уточняет, кто именно эти посланные Яхве исполнители.
    reason: cultural_note
lexical_decisions:
- source_word: הִנְנִי שֹׁלֵחַ
  choice: Вот, Я посылаю
  rationale: Оборот с причастием вводит торжественное и живое объявление о близком действии; настоящее время сохраняет эту непосредственность.
- source_word: לְדוגים רַבִּים
  choice: за множеством рыбаков
  rationale: Предлог לְ здесь естественно передаёт призыв или отправку за исполнителями, а «рыбаки» сохраняет конкретный образ.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет вес пророческой формулы и передаёт личное имя יהוה как «Яхве».
- source_word: וְדִיגוּם
  choice: и они выловят их
  rationale: Глагол от דוג обозначает ловлю рыбы; «выловят» естественно передаёт образ и местоименный объект.
- source_word: לְרַבִּים צַיָּדִים
  choice: за множеством охотников
  rationale: Сохраняется конкретный образ охотников и параллель с рыбаками.
- source_word: וְצָדוּם
  choice: и они выследят их
  rationale: «Выследят» удерживает охотничью образность и естественно сочетается с перечислением мест, хотя глагол также может включать смысл поимки.
- source_word: מֵעַל כָּל הַר וּמֵעַל כָּל גִּבְעָה וּמִנְּקִיקֵי הַסְּלָעִים
  choice: на каждой горе, на каждом холме и в расселинах скал
  rationale: По-русски такое оформление естественно указывает на все места, где людей разыщут; повтор «каждой/каждом» сохраняет всеохватность оригинала.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале прямо стоит тетраграмматон; личное имя передано транслитерацией без замены титулом.
- issue: Смысл образов рыбаков и охотников
  choice: Сохранить конкретные метафоры, не уточняя личность посланных и тех, кого ловят
  alternative: Прямо назвать посланных вражескими захватчиками или собирателями изгнанников
  rationale: Сам стих изображает разыскание и поимку людей во всех укрытиях, но не называет исполнителей и не требует снять контекстуальную богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; конкретные образы и неопределённое «их» сохранены.
