revisions:
- from: Вот, Я посылаю за множеством рыбаков[a], — возвещает Яхве, — и они выловят их. А после этого Я пошлю за множеством охотников[b], и они выследят их на каждой горе, на каждом холме и в расселинах скал.
  to: Вот, Я посылаю за многими рыбаками[a], — возвещает Яхве, — и они выловят их. А после этого Я пошлю за многими охотниками[b], и они будут охотиться на них, снимая их с каждой горы, с каждого холма и из расселин скал.
  rationale: Заменено «выследят» на «будут охотиться на них», чтобы не сводить צוד к одному выслеживанию и сохранить образ охоты. Концовка перестроена с «снимая их с... и из...», чтобы в современном русском передать направление, выраженное повторёнными מֵעַל и מִן, не создавая неестественного сочетания «охотиться с гор».
