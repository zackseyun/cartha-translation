  text: מְמוֹתֵ֨י תַחֲלֻאִ֜ים יָמֻ֗תוּ לֹ֤א יִסָּֽפְדוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְי֑וּ וּ/בַ/חֶ֤רֶב וּ/בָֽ/רָעָב֙ יִכְל֔וּ וְ/הָיְתָ֤ה נִבְלָתָ/ם֙ לְ/מַאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/004.yaml
  text: They will die of deadly diseases[a]. They will not be mourned or buried. They will become dung on the surface of the ground. They will be consumed by the sword and by famine[c][b], and their carcasses will become food for the birds of the heavens and for the beasts of the earth.
translation:
  language: ru
  text: Они умрут от тяжких болезней[a]. Их не будут оплакивать и не похоронят. Они станут навозом на поверхности земли. Они будут истреблены мечом и голодом, а их трупы станут пищей птицам небесным и зверям земным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «смертями болезней умрут»; имеется в виду смерть от тяжёлых недугов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמוֹתֵי תַחֲלֻאִים יָמֻתוּ
  choice: они умрут от тяжких болезней
  rationale: Буквальная конструкция «смертями болезней умрут» по-русски неестественна; она означает смерть вследствие тяжёлых недугов. Перевод сохраняет причину смерти и суровый смысл выражения.
- source_word: לֹא יִסָּפְדוּ וְלֹא יִקָּבֵרוּ
  choice: их не будут оплакивать и не похоронят
  rationale: Глагол ספד относится к оплакиванию умерших, а קבר — к погребению. Разные русские формы пассива и неопределённо-личной конструкции дают естественную и ясную фразу.
- source_word: לְדֹמֶן עַל־פְּנֵי הָאֲדָמָה יִהְיוּ
  choice: они станут навозом на поверхности земли
  rationale: דֹּמֶן означает навоз; резкое слово сохраняет унизительный образ непогребённых останков. עַל־פְּנֵי передано естественным выражением «на поверхности».
- source_word: וּבַחֶרֶב וּבָרָעָב יִכְלוּ
  choice: они будут истреблены мечом и голодом
  rationale: כלה здесь означает быть окончательно уничтоженными или истреблёнными. Пассивная формулировка сохраняет инструментальное значение предлога ב и тяжесть пророческого суда.
- source_word: וְהָיְתָה נִבְלָתָם לְמַאֲכָל
  choice: их трупы станут пищей
  rationale: נְבֵלָה в данном контексте обозначает мёртвое тело, оставленное без погребения. «Трупы» точно и естественно передаёт унизительный образ, не добавляя значения животной падали.
- source_word: לְעוֹף הַשָּׁמַיִם וּלְבֶהֱמַת הָאָרֶץ
  choice: птицам небесным и зверям земным
  rationale: Сочетание сохраняет параллелизм «небеса — земля» и возвышенную библейскую окраску, оставаясь понятным современному читателю.
