source:
  edition: WLC
  text: לָ/כֵן֙ הִנְ/נִ֣י מֽוֹדִיעָ֔/ם בַּ/פַּ֣עַם הַ/זֹּ֔את אוֹדִיעֵ֥/ם אֶת יָדִ֖/י וְ/אֶת גְּבֽוּרָתִ֑/י וְ/יָדְע֖וּ כִּֽי שְׁמִ֥/י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/021.yaml
  text: Therefore[a], behold, I am making them know—this time I will make them know my hand and my might[c][b], and they will know that my name is Yahweh.
translation:
  language: ru
  text: Поэтому вот, Я даю им узнать — на этот раз дам им узнать Мою руку и Мою мощь[a], — и они узнают, что имя Моё — Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «рука» — образ деятельной силы.
    reason: cultural_note
  - marker: b
    text: Евр. יהוה (YHWH); традиционно передаётся как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод или следствие из предшествующего контекста.
- source_word: הִנְנִי
  choice: вот
  rationale: Сохраняет эмфатическое указание, вводящее торжественное Божье объявление, и естественно звучит по-русски.
- source_word: מוֹדִיעָם / אוֹדִיעֵם
  choice: дам им узнать, дам им узнать
  rationale: Каузатив породы hифиль передан как «дать узнать»; повтор сохраняет настойчивую риторику еврейского текста. Причастие в конструкции הִנְנִי и последующая личная форма вместе выражают решительное объявление о предстоящем действии.
- source_word: בַּפַּעַם הַזֹּאת
  choice: на этот раз
  rationale: Естественное русское соответствие временному выражению с указательным акцентом.
- source_word: יָדִי
  choice: Мою руку
  rationale: Сохранён образ руки как деятельной силы; соседнее «мощь» поясняет его, не устраняя метафору.
- source_word: גְּבוּרָתִי
  choice: Мою мощь
  rationale: Передаёт силу и могущество и при этом не сливается по значению с образом руки.
- source_word: וְיָדְעוּ
  choice: и они узнают
  rationale: Сохраняет простое еврейское сочинение и выраженный результат.
- source_word: שְׁמִי
  choice: имя Моё
  rationale: Буквально сохраняет значимую формулу Божьего самооткровения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, прямо стоящее в еврейском тексте, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В исходном тексте употреблён тетраграмматон; транслитерация сохраняет личное имя и не подменяет его традиционным титулом.
- issue: Передача выражения «Моя рука»
  choice: сохранить метафору «Моя рука»
  alternative: Моя сила
  rationale: Еврейский текст различает «руку» и «мощь». Буквальная передача сохраняет образность и риторическую пару, не сглаживая её толкованием.
- issue: Объект каузативного глагола ידע
  choice: дам им узнать
  alternative: дам им это узнать / дам им познать
  rationale: Местоименный суффикс допускает понимание как личного объекта («им/их»), тогда как предмет познания раскрывается далее. Выбранная формулировка сохраняет эту некоторую синтаксическую открытость и естественна в русском контексте.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаичным библейским звучанием. Повтор «дам им узнать» намеренно сохранён ради эмфазы оригинала; прописные местоимения относятся к Богу как к участнику прямой речи.
