source:
  edition: WLC
  text: כִּ֤י עֵינַ/י֙ עַל כָּל דַּרְכֵי/הֶ֔ם לֹ֥א נִסְתְּר֖וּ מִ/לְּ/פָנָ֑/י וְ/לֹֽא נִצְפַּ֥ן עֲוֺנָ֖/ם מִ/נֶּ֥גֶד עֵינָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/017.yaml
  text: For my eyes are on all their ways[a]; they are not hidden from me[c][b], and their iniquity is not concealed from before my eyes.
translation:
  language: ru
  text: Ибо мои глаза обращены на все их пути[a]; они не скрыты от меня, и их беззаконие[b] не сокрыто от моих глаз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть все их поступки и весь их образ жизни.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вина». Еврейское слово может обозначать как беззаконие, так и связанную с ним вину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего высказывания; «ибо» ясно передаёт пояснительно-причинную связь и уместно в возвышенной пророческой речи.
- source_word: עֵינַי עַל
  choice: мои глаза обращены на
  rationale: Сохраняется конкретный антропоморфный образ пристального Божьего наблюдения, при этом выражение естественно звучит по-русски.
- source_word: כָּל דַּרְכֵיהֶם
  choice: все их пути
  rationale: «Пути» сохраняет еврейскую метафору, обозначающую поступки, поведение и образ жизни, не сводя её к пояснительному пересказу.
- source_word: לֹא נִסְתְּרוּ מִלְּפָנַי
  choice: они не скрыты от меня
  rationale: Множественное число соотнесено с «путями». Естественное русское «от меня» передаёт смысл еврейского выражения «от моего лица / присутствия» без тяжеловесной кальки.
- source_word: עֲוֺנָם
  choice: их беззаконие
  rationale: Слово עָוֹן может обозначать как нравственное зло, так и связанную с ним вину. «Беззаконие» сохраняет нравственно-богословскую весомость и не устраняет смысловую неоднозначность, отмеченную в сноске.
- source_word: לֹא נִצְפַּן מִנֶּגֶד עֵינָי
  choice: не сокрыто от моих глаз
  rationale: Передан пассивный смысл глагола и сохранён повтор образа глаз; «сокрыто» слегка возвышенно, но понятно и соответствует регистру пророческого текста.
theological_decisions:
- issue: Антропоморфный образ Божьего знания
  choice: Сохранить упоминание глаз Бога, обращённых на пути людей, и беззакония, не сокрытого от его глаз.
  alternative: 'Передать абстрактно: «Я вижу всё, что они делают» или «ничто не ускользает от моего внимания».'
  rationale: Еврейский текст выражает всеведение и нравственное испытание через конкретный телесный образ. Его сохранение передаёт риторику текста, не подменяя её отвлечённой богословской формулировкой.
- issue: Смысл עָוֹן
  choice: беззаконие
  alternative: вина; злодеяние; грех
  rationale: Контекст допускает как совершённое зло, так и обусловленную им вину. Основной текст передаёт нравственное нарушение, а сноска сохраняет возможность понимания как вины.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены параллелизм, метафора «путей» и образ Божьих глаз; местоимения, относящиеся к Богу, даны со строчной буквы в соответствии с нейтральной современной орфографической практикой и без добавления отсутствующего в оригинале конфессионального оформления.
