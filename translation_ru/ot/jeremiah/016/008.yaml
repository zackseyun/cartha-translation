  text: И в дом пира не входи, чтобы сидеть с ними[a], есть и пить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в дом пиршества»; возможный смысл: «в дом празднества». Еврейское выражение обозначает место, где люди собираются для праздничной еды и питья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית מִשְׁתֶּה
  choice: И в дом пиршества
  rationale: Сочетание בֵּית מִשְׁתֶּה буквально обозначает дом или место, где устраивают пир. «Дом пиршества» сохраняет конкретный образ еврейского текста и торжественный регистр; союз וּ передан как «И» в продолжение ряда запретов.
- source_word: לֹא תָבוֹא
  choice: не входи
  rationale: Имперфект 2-го лица мужского рода единственного числа с отрицанием לֹא здесь выражает запрет. Русское повелительное «не входи» естественно и ясно передаёт пророческое предписание.
- source_word: לָשֶׁבֶת אוֹתָם
  choice: чтобы сидеть с ними
  rationale: 'Инфинитив לָשֶׁבֶת обозначает цель входа, а אוֹתָם в данном сочетании имеет сопроводительно-ассоциативный смысл: сидеть вместе с участниками пира.'
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: есть и пить
  rationale: Два однородных инфинитива передают участие в общей трапезе. В русском повторение «чтобы» или частицы «чтобы» перед каждым глаголом не требуется.
