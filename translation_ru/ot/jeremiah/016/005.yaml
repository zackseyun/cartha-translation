  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה אַל תָּבוֹא֙ בֵּ֣ית מַרְזֵ֔חַ וְ/אַל תֵּלֵ֣ךְ לִ/סְפּ֔וֹד וְ/אַל תָּנֹ֖ד לָ/הֶ֑ם כִּֽי אָסַ֨פְתִּי אֶת שְׁלוֹמִ֜/י מֵ/אֵ֨ת הָ/עָ֤ם הַ/זֶּה֙ נְאֻם יְהוָ֔ה אֶת הַ/חֶ֖סֶד וְ/אֶת הָֽ/רַחֲמִֽים־׀־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/005.yaml
  text: 'For thus says Yahweh: Do not enter a house of mourning[a], and do not go to mourn or show sympathy for them, for I have taken away my peace from this people[c][b], declares Yahweh—steadfast love and compassion.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве: «Не входи в дом скорби[a], не ходи туда, чтобы оплакивать, и не выражай им сочувствия[b], потому что Я отнял у этого народа Мой мир[c], неизменную любовь и милосердие, — возвещает Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в дом пиршества». Еврейское слово מַרְזֵחַ в некоторых контекстах обозначает пиршественное собрание, однако здесь упоминания оплакивания и сочувствия указывают на дом скорби.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не утешай их». Еврейский глагол может обозначать жесты и слова соболезнования скорбящим.'
    reason: lexical_alternative
  - marker: c
    text: Здесь «мир» включает не только отсутствие вражды, но также благополучие, целостность и безопасность.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, представленное тетраграмматоном, и соответствует проектному подходу.
- source_word: בֵּית מַרְזֵחַ
  choice: дом скорби
  rationale: Хотя מַרְזֵחַ может обозначать место пиршества, упоминания плача и соболезнования в непосредственном контексте указывают на траурное собрание.
- source_word: לִסְפּוֹד
  choice: оплакивать
  rationale: Глагол относится к обрядовому оплакиванию умерших; этот русский эквивалент ясно сохраняет погребальный контекст.
- source_word: תָּנֹד לָהֶם
  choice: выражай им сочувствия
  rationale: В данном контексте נוד обозначает выражение соболезнования или сочувствия скорбящим, а не просто движение головой.
- source_word: אָסַפְתִּי אֶת שְׁלוֹמִי
  choice: Я отнял ... Мой мир
  rationale: אָסַף здесь имеет смысл удаления или отнятия, а שָׁלוֹם сохраняется как ключевое многозначное слово.
- source_word: שְׁלוֹמִי
  choice: Мой мир
  rationale: Слово включает благополучие, целостность и безопасность, но прямое «мир» позволяет сохранить его смысловую широту.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную пророческую формулу естественным современным русским языком.
- source_word: הַחֶסֶד
  choice: неизменную любовь
  rationale: Передаёт сочетание любви, верности и постоянства в חֶסֶד без конфессионально узкого истолкования.
- source_word: הָרַחֲמִים
  choice: милосердие
  rationale: Естественно передаёт абстрактное значение еврейского множественного числа רַחֲמִים.
theological_decisions:
- issue: Связь заключительных слов «неизменную любовь и милосердие» с «Моим миром»
  choice: Заключительные винительные формы поняты как пояснение того, что Бог отнял; это передано с помощью тире.
  alternative: 'Можно подразумевать повторение глагола: «Я отнял у этого народа Мой мир… неизменную любовь и милосердие».'
  rationale: Повтор частицы אֶת перед существительными допускает перечисление отдельных отнятых благ, тогда как расположение слов также позволяет видеть в них раскрытие содержания «Моего мира». Пунктуация сохраняет эту синтаксическую напряжённость без добавления лишнего глагола.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Повеления переданы ясно и без архаизмов; личное имя Яхве сохранено. Заглавные местоимения при обращении Бога к Самому Себе использованы в соответствии с принятой русской библейской традицией.
