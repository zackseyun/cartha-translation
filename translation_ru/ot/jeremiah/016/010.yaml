id: JER.16.10
reference: Jeremiah 16:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י תַגִּיד֙ לָ/עָ֣ם הַ/זֶּ֔ה אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמְר֣וּ אֵלֶ֗י/ךָ עַל מֶה֩ דִבֶּ֨ר יְהוָ֤ה עָלֵ֨י/נוּ֙ אֵ֣ת כָּל הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את וּ/מֶ֤ה עֲוֺנֵ֨/נוּ֙ וּ/מֶ֣ה חַטָּאתֵ֔/נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/010.yaml
  text: And when you tell this people all these words[a], and they say to you, ‘Why has Yahweh spoken against us all this great disaster? And what is our iniquity, and what is our sin that we have sinned against Yahweh our God?’
translation:
  language: ru
  text: 'И когда ты передашь этому народу все эти слова, они спросят тебя: «За что Яхве объявил против нас всё это великое бедствие? В чём наша вина и в чём наш грех, которым мы согрешили против Яхве, нашего Бога?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Еврейский оборот вводит ожидаемое будущее обстоятельство; «И когда» естественно передаёт его временное значение.
- source_word: תַגִּיד
  choice: ты передашь
  rationale: Порода hифиль глагола נגד означает сообщить или довести до сведения; в контексте пророческой вести «передашь» звучит естественно и сохраняет смысл.
- source_word: לָעָם הַזֶּה
  choice: этому народу
  rationale: Сохранены единственное число собирательного существительного עָם и указательное определение.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: דְּבָרִים здесь обозначает возвещённую пророческую речь; «слова» сохраняет речевой характер сообщения.
- source_word: עַל מֶה
  choice: За что
  rationale: Выражение спрашивает об основании наказания. Русское «за что» особенно естественно в вопросе о вине, повлекшей бедствие.
- source_word: דִבֶּר יְהוָה עָלֵינוּ
  choice: Яхве объявил нам
  rationale: В контексте суда דבר с עַל означает произнести или объявить нечто против адресатов. По-русски «объявил нам бедствие» естественнее буквального «сказал против нас», при этом судебный смысл сохраняется.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: всё это великое бедствие
  rationale: רָעָה в данном контексте означает губительное бедствие как суд, а не нравственное зло; сохранены усиление כָּל и определения «это» и «великое».
- source_word: עֲוֺנֵנוּ
  choice: наша вина
  rationale: עָוֹן может обозначать как беззаконие, так и вину. «Вина» естественно сочетается с вопросом «в чём» и отличает слово от следующего חַטָּאת.
- source_word: חַטָּאתֵנוּ
  choice: наш грех
  rationale: Основное значение חַטָּאת здесь — грех; русское соответствие сохраняет отличие от עָוֹן настолько, насколько позволяет контекст.
- source_word: אֲשֶׁר חָטָאנוּ
  choice: которым мы согрешили
  rationale: Придаточное уточняет предшествующее «наш грех»; инструментальная конструкция естественна по-русски и сохраняет внутренний повтор корня חטא.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: против Яхве, нашего Бога
  rationale: При глаголе חטא предлог לְ обозначает того, против кого совершён грех; русское «согрешить против» передаёт это отношение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Значение רָעָה в контексте суда
  choice: бедствие
  alternative: зло; несчастье
  rationale: Речь идёт о грядущей катастрофе, объявленной народу как суд. «Бедствие» сохраняет тяжесть выражения и не создаёт ложного впечатления, будто Богу приписывается нравственное зло.
- issue: Соотношение עָוֹן и חַטָּאת
  choice: вина и грех
  alternative: беззаконие и грех
  rationale: עָוֹן допускает значения проступка и возникшей из него вины. Вопрос народа о причине суда позволяет сохранить эту неоднозначность словом «вина», одновременно отличив его от חַטָּאת — «грех».
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис вопроса сделан естественным для устной реакции народа; сохранены повтор «в чём… и в чём…» и различие между «виной» и «грехом». Имя Яхве передано последовательно.
