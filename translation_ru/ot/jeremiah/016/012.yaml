source:
  edition: WLC
  text: וְ/אַתֶּ֛ם הֲרֵעֹתֶ֥ם לַ/עֲשׂ֖וֹת מֵ/אֲבֽוֹתֵי/כֶ֑ם וְ/הִנְּ/כֶ֣ם הֹלְכִ֗ים אִ֚ישׁ אַֽחֲרֵי֙ שְׁרִר֣וּת לִבּֽ/וֹ הָ/רָ֔ע לְ/בִלְתִּ֖י שְׁמֹ֥עַ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/012.yaml
  text: But you have done worse than your fathers[a], and look, each of you is walking after the stubbornness of his evil heart[c][b], refusing to listen to me.
translation:
  language: ru
  text: Но вы поступили ещё хуже своих отцов[a]. И вот, каждый из вас[b] следует упрямству своего злого сердца[c], чтобы не слушать Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ещё нечестивее своих предков».'
    reason: Передаёт альтернативную формулировку нравственного сравнения и более широкое значение אָבוֹת.
  - marker: b
    text: 'Буквально: «каждый человек»; выражение употреблено распределительно обо всём народе.'
    reason: Поясняет форму אִישׁ и то, что речь не ограничена мужчинами.
  - marker: c
    text: 'Или: «своеволию своего злого сердца»; возможно также: «своевольному замыслу своего злого сердца».'
    reason: Отражает שְׁרִרוּת как упрямую своевольную установку; вариант «замыслу» сохраняет возможный оттенок внутреннего замысла, не навязывая его основному тексту.
lexical_decisions:
- source_word: הֲרֵעֹתֶם לַעֲשׂוֹת
  choice: поступили ещё хуже
  rationale: Хифиль глагола רעע вместе с последующим сравнением передаёт нравственно отрицательное действие, превосходящее поступки прежних поколений. Русское «поступили ещё хуже» естественно выражает и сравнение, и нравственную оценку.
- source_word: מֵאֲבוֹתֵיכֶם
  choice: своих отцов
  rationale: אָבוֹת может обозначать как отцов, так и предков. «Отцов» сохраняет семейно-поколенческую образность еврейского текста; возвратное «своих» естественно при русском подлежащем «вы».
- source_word: וְהִנְּכֶם
  choice: И вот
  rationale: הִנֵּה привлекает внимание к нынешнему поведению адресатов. «И вот» сохраняет указательно-эмфатическую функцию и звучит современно и достойно.
- source_word: הֹלְכִים אִישׁ אַחֲרֵי
  choice: каждый из вас следует
  rationale: Причастие הֹלְכִים описывает продолжающийся образ поведения, а אִישׁ имеет распределительное значение. Глагол «следует» естественно передаёт метафорическое «идёт вслед».
- source_word: שְׁרִרוּת
  choice: упорству
  rationale: В книге Иеремии существительное обозначает своевольную, непреклонную внутреннюю установку. «Упорство» сохраняет отрицательный смысл в данном контексте, не вводя спорного значения «воображение» в основной текст.
- source_word: לִבּוֹ הָרָע
  choice: своего злого сердца
  rationale: Буквально и ясно передаёт сердце как средоточие воли и помыслов и сохраняет прямую нравственную оценку רַע.
- source_word: לְבִלְתִּי שְׁמֹעַ אֵלָי
  choice: чтобы не слушать Меня
  rationale: Конструкция לְבִלְתִּי с инфинитивом допускает оттенок цели или результата. «Чтобы не слушать Меня» близко следует форме источника и не устраняет эту смысловую напряжённость.
theological_decisions:
- issue: Распределительное употребление אִישׁ при обращении ко всему народу
  choice: каждый из вас
  alternative: каждый человек; каждый мужчина
  rationale: В контексте אִישׁ индивидуализирует всех адресатов, а не ограничивает обвинение мужчинами. «Каждый из вас» сохраняет распределительную силу выражения.
- issue: Обозначение прежних поколений словом אָבוֹת
  choice: отцов
  alternative: предков
  rationale: «Отцов» сохраняет конкретную родовую образность и традиционную пророческую лексику; примечание указывает более широкое возможное значение.
- issue: Целевой или результирующий оттенок לְבִלְתִּי
  choice: чтобы не слушать Меня
  alternative: не желая слушать Меня; так что вы не слушаете Меня
  rationale: Еврейская конструкция может описывать цель либо следствие избранного пути. Основной вариант формально сохраняет эту открытость и не усиливает волевой оттенок сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис остаётся прозрачным для широкого читателя; «И вот» передаёт дейктическое усиление без архаического «се».
