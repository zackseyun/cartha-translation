  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם עַל֩ אֲשֶׁר עָזְב֨וּ אֲבוֹתֵי/כֶ֤ם אוֹתִ/י֙ נְאֻם יְהוָ֔ה וַ/יֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יַּעַבְד֖וּ/ם וַ/יִּשְׁתַּחֲו֣וּ לָ/הֶ֑ם וְ/אֹתִ֣/י עָזָ֔בוּ וְ/אֶת תּוֹרָתִ֖/י לֹ֥א שָׁמָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/011.yaml
  text: Then you shall say to them, ‘Because your fathers abandoned me,’ declares the LORD, ‘and went after other gods, and served them, and bowed down to them. But me they abandoned, and my law they did not keep.’
translation:
  language: ru
  text: 'И скажи им: «За то, что ваши отцы оставили Меня, — возвещает ГОСПОДЬ, — пошли вслед за другими богами, служили им и поклонялись им. Меня же они оставили и закона Моего не соблюдали».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְאֻם יְהוָה
  choice: возвещает ГОСПОДЬ
  rationale: נְאֻם — формула божественного изречения; «возвещает» естественно передаёт её торжественный пророческий регистр. Тетраграмматон представлен принятой заместительной формой «ГОСПОДЬ».
- source_word: אֲבוֹתֵיכֶם
  choice: ваши отцы
  rationale: Сохраняет историко-родовое значение «предки» и библейскую связь поколений; в данном контексте выражение понятно современному читателю.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: пошли вслед за другими богами
  rationale: Близко воспроизводит еврейскую идиому следования за богами как выражение религиозной приверженности.
- source_word: וַיַּעַבְדוּם
  choice: служили им
  rationale: Глагол עבד в культовом контексте означает служение или почитание божеств; «служили» сохраняет исходный образ.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: поклонялись им
  rationale: Передаёт телесное преклонение и культовое поклонение без лишнего уточнения.
- source_word: תּוֹרָתִי
  choice: закона Моего
  rationale: В данном обвинении תּוֹרָה обозначает данное Богом наставление-закон; «закон» сохраняет традиционную и контекстуально уместную формулировку.
- source_word: לֹא שָׁמָרוּ
  choice: не соблюдали
  rationale: В сочетании с תורה глагол שמר означает хранить через исполнение; «соблюдали» естественно передаёт этот смысл по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Заместительная передача капителью соответствует предоставленному аудированному слою и широко понятна русскому читателю, не вводя конфессионально специфического толкования.
- issue: Контраст וְאֹתִי עָזָבוּ
  choice: Меня же они оставили
  alternative: И Меня они оставили
  rationale: Частица «же» сохраняет эмфатическое вынесение объекта «Меня» и контраст между служением другим богам и оставлением Бога.
translation_notes:
  register: Современный литературный русский с торжественным пророческим оттенком. Сохранены последовательность обвинений, повтор глагола «оставили» и усиленный контраст «Меня же». Формы «Меня» и «Моего» написаны с прописной буквы как уважительное обозначение Бога.
