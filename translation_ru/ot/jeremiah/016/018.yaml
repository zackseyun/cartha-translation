source:
  edition: WLC
  text: וְ/שִׁלַּמְתִּ֣י רִֽאשׁוֹנָ֗ה מִשְׁנֵ֤ה עֲוֺנָ/ם֙ וְ/חַטָּאתָ֔/ם עַ֖ל חַלְּלָ֣/ם אֶת אַרְצִ֑/י בְּ/נִבְלַ֤ת שִׁקּֽוּצֵי/הֶם֙ וְ/תוֹעֲב֣וֹתֵי/הֶ֔ם מָלְא֖וּ אֶת נַחֲלָתִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/018.yaml
  text: And first I will repay double their iniquity and their sin[a], because they have defiled my land with the carcasses of their detestable idols and have filled my inheritance with their abominations.
translation:
  language: ru
  text: Прежде всего Я воздам им вдвое за их беззаконие и грех, за то, что они осквернили Мою землю трупами своих гнусных идолов[a] и наполнили Моё наследие своими мерзостями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трупами их гнусных вещей»; в пророческих текстах это еврейское слово часто обозначает идолов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: Я воздам им
  rationale: Пиэль глагола שלם выражает воздаяние за содеянное. «Воздам» сохраняет судебный оттенок и естественно звучит в современном литературном русском; местоимение «им» раскрывает подразумеваемый объект воздаяния.
- source_word: רִאשׁוֹנָה
  choice: Сначала
  rationale: Наречие указывает на первоочерёдность воздаяния, вероятно перед последующим восстановлением; «сначала» ясно передаёт временную последовательность.
- source_word: מִשְׁנֵה
  choice: вдвойне
  rationale: Существительное обозначает двойную меру. Наречие «вдвойне» кратко и естественно передаёт меру воздаяния.
- source_word: עֲוֺנָם וְחַטָּאתָם
  choice: за их беззаконие и грех
  rationale: Сохранены два параллельных понятия и единственное число собирательного חַטָּאתָם. Предлог «за» естественно выражает основание воздаяния по-русски.
- source_word: עַל
  choice: потому что
  rationale: В данном контексте предлог вводит причину наказания; причинный союз делает связь ясной без изменения смысла.
- source_word: חַלְּלָם אֶת־אַרְצִי
  choice: они осквернили Мою землю
  rationale: Глагол חלל здесь обозначает религиозно-нравственное осквернение земли. «Осквернили» сохраняет эту смысловую насыщенность.
- source_word: בְּנִבְלַת שִׁקּוּצֵיהֶם
  choice: трупами своих мерзких идолов
  rationale: נִבְלָה означает труп или падаль, а שִׁקּוּצִים в пророческой полемике часто обозначает идолов. Формулировка сохраняет резкий образ мёртвых, нечистых культовых предметов.
- source_word: וְתוֹעֲבוֹתֵיהֶם
  choice: своими мерзостями
  rationale: Термин обозначает отвратительные культовые предметы или действия. «Мерзости» сохраняет широкое значение и не ограничивает его только предметами.
- source_word: מָלְאוּ אֶת־נַחֲלָתִי
  choice: наполнили Моё наследие
  rationale: נַחֲלָה представляет землю как принадлежащее Богу наследие. Буквальный образ сохранён благодаря его заветному значению.
theological_decisions:
- issue: Уточнять ли, что שִׁקּוּצֵיהֶם обозначает идолов
  choice: В основном тексте переведено «мерзких идолов»
  alternative: «мерзких вещей» или «мерзостей»
  rationale: В пророческом контексте Иеремии слово часто обозначает именно идольские предметы. Уточнение помогает современному читателю распознать вероятный референт, а более широкое буквальное значение отмечено в сноске.
- issue: Смысл двойного воздаяния
  choice: Сохранено прямое выражение «вдвойне» без богословского пояснения
  alternative: Истолковать как полное или соответствующее воздаяние
  rationale: Еврейский текст прямо говорит о двойной мере и не объясняет её механизм; перевод сохраняет напряжение образа, не навязывая толкования.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис упрощён лишь настолько, чтобы причинная связь была ясна. Местоимения, относящиеся к Богу, написаны с прописной буквы; сохранены образы двойного воздаяния, осквернения земли и Божьего наследия.
