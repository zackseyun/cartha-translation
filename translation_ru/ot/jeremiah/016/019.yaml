base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/019.yaml
  text: O Yahweh[a], my strength and my stronghold, my refuge in the day of distress, to you the nations will come from the ends of the earth and say, “Surely our fathers inherited only lies[b], worthless things in which there is no profit.”
translation:
  language: ru
  text: 'О Яхве[a], сила моя, твердыня моя и прибежище моё в день бедствия! К Тебе придут народы от краёв земли и скажут: «Поистине, наши отцы унаследовали лишь ложь и суету[b], в которых нет ничего полезного».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное древнееврейскими согласными יהוה (ЙХВХ); в переводах его также традиционно передают словом «Господь».
    reason: divine_name
  - marker: b
    text: 'Или: «наши предки унаследовали лишь ложь, пустоту и то, в чём нет пользы». Древнееврейское слово, переведённое как «суета», может также означать пустоту, тщету или нечто никчёмное; в данном контексте оно может подразумевать идолов.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом; форма «Яхве» принята в современной русской библеистике.
- source_word: עֻזִּי
  choice: сила моя
  rationale: Прямо передаёт значение существительного и сохраняет исповедальный параллелизм обращения.
- source_word: מָעֻזִּי
  choice: твердыня моя
  rationale: Сохраняет образ укреплённого безопасного места и не сливается по смыслу со следующим «прибежище».
- source_word: מְנוּסִי
  choice: прибежище моё
  rationale: Передаёт место, куда бегут ради спасения; это естественное и возвышенное русское выражение.
- source_word: בְּיוֹם צָרָה
  choice: в день бедствия
  rationale: Сохраняет временную формулу и серьёзность обозначенной поры беды.
- source_word: גּוֹיִם
  choice: народы
  rationale: Соответствует международному охвату высказывания без внесения дополнительного противопоставления иудеев и язычников.
- source_word: מֵאַפְסֵי אָרֶץ
  choice: от краёв земли
  rationale: Естественно передаёт древнееврейскую идиому о самых отдалённых местах.
- source_word: אַךְ
  choice: поистине; лишь
  rationale: Сочетание «поистине» и ограничительного «лишь» передаёт как усилительную, так и ограничительную силу частицы в данном признании.
- source_word: שֶׁקֶר
  choice: ложь
  rationale: Собирательное единственное число по-русски естественно обозначает ложное содержание унаследованной традиции.
- source_word: נָחֲלוּ
  choice: унаследовали
  rationale: Сохраняет конкретный образ получения наследства и его ироническое применение к религиозному преданию.
- source_word: אֲבוֹתֵינוּ
  choice: наши отцы
  rationale: Формально соответствует древнееврейскому выражению; в контексте означает предков народа.
- source_word: הֶבֶל
  choice: суета
  rationale: Сохраняет широкий образ пустоты, тщетности и никчёмности, не сужая его без необходимости до прямого обозначения идолов.
- source_word: וְאֵין בָּם מוֹעִיל
  choice: в которой нет никакой пользы
  rationale: Естественно передаёт полную бесполезность унаследованной лжи и суеты; русский относительный оборот согласован с ближайшим собирательным понятием.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога. Транслитерация сохраняет это различие, тогда как «Господь» передаёт титул.
- issue: Следует ли переводить הֶבֶל прямо как «идолы»
  choice: суета
  alternative: идолы; ничтожные вещи; пустота
  rationale: Контекст допускает отнесение слова к идолам и ложной религии, но само слово шире и обозначает пустоту, тщету или никчёмность. Более широкая передача сохраняет смысловую напряжённость.
- issue: Синтаксическая связь שֶׁקֶר, הֶבֶל и וְאֵין בָּם מוֹעִיל
  choice: «ложь — суету, в которой нет никакой пользы»
  alternative: «ложь, суету и то, в чём нет пользы»
  rationale: Древнееврейская последовательность допускает понимание последующих слов как пояснения к «лжи» либо как перечисления. Основной текст выбирает пояснительное прочтение, а примечание сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Сохранены параллельные образы «сила — твердыня — прибежище», международный размах пророчества и образ унаследованной ложной традиции; архаизмы, кроме укоренённого библейского слова «твердыня», не используются.
