lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Стандартное повествовательное введение; в сочетании с דְבַר יְהוָה естественно передаёт начало пророческой формулы и сохраняет её библейскую торжественность без лишней архаизации.
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле означает обращённое к пророку Божье слово; «слово» сохраняет исходный образ и менее истолковательно, чем «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Прямое и естественное соответствие предлогу אֶל с суффиксом первого лица единственного числа.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском двоеточие естественно выполняет эту функцию и избегает тяжеловесного «говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя, тогда как «Господь» заменяет его титулом; «Иегова» отражает более позднюю смешанную форму произношения.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой пророческой формулы. Двоеточие передаёт функцию לֵאמֹר как введения прямой речи, которая следует в следующем стихе.
