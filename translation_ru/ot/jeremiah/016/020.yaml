  text: הֲ/יַעֲשֶׂה לּ֥/וֹ אָדָ֖ם אֱלֹהִ֑ים וְ/הֵ֖מָּה לֹ֥א אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/020.yaml
  text: Can a man make gods for himself? Yet they are not gods[a].
translation:
  language: ru
  text: Разве может человек сделать себе богов? Но они — не боги[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Станет ли человек делать себе богов? А они — не боги».'
    reason: Либо вопрос может передаваться без модального оттенка возможности, а союз וְ — менее резко, чем «но».
lexical_decisions:
- source_word: הֲיַעֲשֶׂה
  choice: Разве может … сделать
  rationale: Вопросительная частица הֲ с имперфектом עשה образует риторический вопрос. Оборот «разве может … сделать» естественно передаёт недоверие и подразумеваемый отрицательный ответ.
- source_word: לּוֹ
  choice: себе
  rationale: 'Предлог ל с суффиксом 3-го лица мужского рода единственного числа здесь имеет контекстуально возвратный смысл: человек делает богов для самого себя.'
- source_word: אָדָם
  choice: человек
  rationale: Существительное употреблено в единственном числе и имеет обобщённое значение. Русское «человек» сохраняет и форму, и родовую отнесённость без ненужного указания на пол.
- source_word: אֱלֹהִים
  choice: богов / боги
  rationale: Форма множественного числа обозначает изготовляемых людьми божеств. Перевод во множественном числе сохраняет прямой смысл и пророческую полемику.
- source_word: וְהֵמָּה
  choice: Но они
  rationale: Союз וְ в данном контексте вводит противопоставление, а самостоятельное местоимение הֵמָּה подчёркивает предмет отрицания. «Но они» ясно и естественно передаёт этот поворот.
- source_word: לֹא אֱלֹהִים
  choice: не боги
  rationale: Фраза прямо отрицает подлинный божественный статус изготовленных человеком объектов, не превращая множественное число в единственное.
theological_decisions:
- issue: Характер полемики против идолов
  choice: Стих отрицает, что сделанные человеком божества действительно являются богами.
  alternative: Стих лишь высмеивает изготовление идолов, не высказывая более общего суждения об их божественном статусе.
  rationale: 'Заключительная фраза לֹא אֱלֹהִים представляет собой явное отрицание: то, что люди изготавливают как «богов», на самом деле богами не является. Перевод сохраняет эту силу, не добавляя отсутствующей в тексте философской терминологии.'
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, достойная и понятная. Тире в именной части «они — не боги» подчёркивает категорическое отрицание, уже выраженное в еврейском тексте, не добавляя нового смысла.
