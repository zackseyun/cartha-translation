  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י מַשְׁבִּ֜ית מִן הַ/מָּק֥וֹם הַ/זֶּ֛ה לְ/עֵינֵי/כֶ֖ם וּ/בִֽ/ימֵי/כֶ֑ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֥וֹל כַּלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/009.yaml
  text: 'For thus says Yahweh of Armies[a], the God of Israel: Behold, I am about to put an end, from this place before your eyes and in your days, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве Воинств[a], Бог Израиля: «Вот, в этом месте, у вас на глазах и при вашей жизни, Я заставлю умолкнуть звуки ликования и веселья, голос жениха и голос невесты».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционная передача: «Господь Саваоф». Слово «Саваоф» означает «Воинств».'
    reason: Лексическая альтернатива для божественного титула יהוה צבאות.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом; это соответствует прямому употреблению Тетраграмматона в еврейском тексте.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет конкретный смысл множественного числа «воинства, силы» в составе божественного титула; традиционный вариант отмечен в сноске.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: הִנְנִי מַשְׁבִּית
  choice: Вот… Я заставлю умолкнуть
  rationale: «Вот» сохраняет указательно-эмфатическую силу הִנְנִי, а будущая форма передаёт близкое предстоящее действие; «заставлю умолкнуть» выражает каузативное значение формы Hiphil от שׁבת в контексте голосов и праздничных звуков.
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: на этом месте
  rationale: По-русски естественно обозначает место, откуда будут устранены праздничные звуки, не меняя локального смысла еврейского оборота.
- source_word: לְעֵינֵיכֶם וּבִימֵיכֶם
  choice: у вас на глазах и при вашей жизни
  rationale: Передаёт как очевидность и засвидетельствованность события, так и то, что оно произойдёт при жизни адресатов.
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: звуки ликования и веселья
  rationale: Различает два близких праздничных понятия и естественно передаёт קוֹל при отвлечённых существительных как слышимые звуки торжества.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: голос жениха и голос невесты
  rationale: При обозначении людей קוֹל естественно переводится как «голос»; повтор слова сохраняет ритм и свадебную образность исходного текста.
theological_decisions:
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф
  rationale: Основной текст сохраняет личное имя יְהוָה и прозрачно передаёт смысл צְבָאוֹת, не связывая титул с узкоконфессиональным толкованием; привычная церковная форма приведена как допустимая традиционная альтернатива.
translation_notes:
  register: 'Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис упорядочен для ясности: обстоятельства вынесены перед сказуемым, а параллелизм праздничных звуков и свадебных голосов сохранён.'
