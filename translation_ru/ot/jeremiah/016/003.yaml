base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/003.yaml
  text: 'For thus says Yahweh concerning the sons and the daughters born in this place[a], and concerning their mothers who bear them[c][b], and their fathers who father them in this land:'
translation:
  language: ru
  text: 'Ибо так говорит Яхве о сыновьях и дочерях, рождённых в этом месте, об их матерях, родивших их, и об их отцах, породивших их в этой земле:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предшествующего повеления и сохраняет торжественную пророческую связность.
- source_word: כֹה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохранена стандартная древнееврейская формула пророческой вести и передано личное имя Бога.
- source_word: עַל
  choice: о
  rationale: Предлог здесь обозначает тех, о ком говорится в последующем пророчестве; повторение конструкции сохранено.
- source_word: הַבָּנִים וְהַבָּנוֹת
  choice: о сыновьях и дочерях
  rationale: Передана явно названная в еврейском тексте пара мужского и женского рода, без сведения её к общему слову «дети».
- source_word: הַיִּלּוֹדִים בַּמָּקוֹם הַזֶּה
  choice: рождённых в этом месте
  rationale: Причастная конструкция и указание места переданы прямо и естественно по-русски.
- source_word: אִמֹּתָם הַיֹּלְדוֹת אוֹתָם
  choice: об их матерях, родивших их
  rationale: Форма от ילד применительно к матерям обозначает рождение; причастие прошедшего времени естественно указывает на матерей уже названных сыновей и дочерей.
- source_word: אֲבוֹתָם הַמּוֹלִדִים אוֹתָם
  choice: об их отцах, породивших их
  rationale: Каузативная форма от ילד применительно к отцам выражает отцовское порождение. «Породивших» сохраняет связь с рождением и не приписывает отцам сам акт родов.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: в этой земле
  rationale: Слово אֶרֶץ в данном контексте обозначает землю, где живут адресаты пророчества; буквальное «земле» сохраняет библейскую пространственную конкретность.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано непосредственно как «Яхве», без замены титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы. Параллелизм сыновей и дочерей, матерей и отцов передан явно; архаические обороты вроде «земле сей» и «родивших» применительно к отцам не использованы.
