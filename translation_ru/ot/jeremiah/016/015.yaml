  text: כִּ֣י אִם חַי יְהוָ֗ה אֲשֶׁ֨ר הֶעֱלָ֜ה אֶת בְּנֵ֤י יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ צָפ֔וֹן וּ/מִ/כֹּל֙ הָֽ/אֲרָצ֔וֹת אֲשֶׁ֥ר הִדִּיחָ֖/ם שָׁ֑מָּ/ה וַ/הֲשִֽׁבֹתִי/ם֙ עַל אַדְמָתָ֔/ם אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבוֹתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/015.yaml
  text: but[a], ‘As Yahweh lives[b], who brought up the children of Israel from the land of the north and from all the lands where he had driven them.’ For I will bring them back to their own land that I gave to their fathers.
translation:
  language: ru
  text: 'но[a]: «Жив Яхве, Который вывел сынов Израиля из северной земли и из всех земель, куда Он изгнал их, и Я верну их на их землю, которую Я дал их отцам[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но напротив», «а вместо этого». Еврейский оборот продолжает противопоставление словам предыдущего стиха.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их предкам». Буквально: «их отцам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: но
  rationale: 'Оборот продолжает противопоставление, начатое в ст. 14: прежняя формула клятвы сменится новой. Краткое «но» естественно по-русски; двоеточие показывает подразумеваемую формулу речи.'
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Сохранена традиционная форма древнееврейской клятвы и личное имя Бога, а не добавлено отсутствующее в тексте «клянусь».
- source_word: הֶעֱלָה
  choice: вывел
  rationale: В данном контексте каузатив глагола עלה обозначает выведение народа и перекликается с исходом; русское «вывел» передаёт этот смысл естественнее буквального «поднял».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Устойчивое библейское выражение точно передаёт еврейскую конструкцию и обозначает народ Израиля.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: из северной земли
  rationale: Сохранено географическое выражение без отождествления с каким-либо современным государством.
- source_word: וּמִכֹּל הָאֲרָצוֹת
  choice: и из всех земель
  rationale: «Земли» сохраняет широкий древний смысл אֲרָצוֹת и не навязывает современное понятие национальных государств.
- source_word: הִדִּיחָם שָׁמָּה
  choice: куда Он изгнал их
  rationale: «Изгнал» передаёт принудительный характер рассеяния; направительное שָׁמָּה естественно включено в русское «куда».
- source_word: וַהֲשִׁבֹתִים
  choice: Ведь Я возвращу их
  rationale: Каузатив означает «дать вернуться, возвратить». «Ведь» естественно передаёт пояснительную связь с новой клятвенной формулой, не превращая обещание в самостоятельное логическое доказательство.
- source_word: עַל אַדְמָתָם
  choice: на их землю
  rationale: Передаёт и пространственное направление, и принадлежность земли народу, не усиливая текст словом «собственную».
- source_word: אֲשֶׁר נָתַתִּי לַאֲבוֹתָם
  choice: которую дал их отцам
  rationale: Сохранено конкретное мужское и заветное обозначение предшествующих поколений; русское подлежащее «Я» может естественно опускаться при ясной глагольной форме.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет его как имя и не смешивает с титулом «Господь».
- issue: Форма клятвы חַי יְהוָה
  choice: Жив Яхве
  alternative: Клянусь жизнью Яхве
  rationale: Выбранная формула сохраняет образ и лаконичность еврейского выражения, не добавляя явно выраженного глагола клятвы.
- issue: Значение לַאֲבוֹתָם
  choice: их отцам
  alternative: их предкам
  rationale: «Отцам» формально точнее и сохраняет возможный заветный намёк на праотцов; более широкое «предкам» остаётся допустимым смысловым вариантом.
translation_notes:
  register: Современный литературный русский с сохранением торжественной клятвенной формулы. Прописные «Который» и «Он» внутри цитаты поддерживают принятый в русском библейском стиле почтительный регистр; смена третьего лица на первое сохранена как в исходной прямой речи. Пунктуация показывает, что новая формула клятвы продолжается из контекста ст. 14.
