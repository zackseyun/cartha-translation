  yaml_path: translation/ot/jeremiah/016/007.yaml
  text: No one will break bread for them in mourning[a], to comfort him for the dead[b], and no one will give them the cup of consolation to drink for his father or for his mother.
translation:
  language: ru
  text: Никто не будет делить с ними пищу во время траура[a], чтобы утешить его в связи со смертью человека; и никто не подаст им чашу утешения[b] в связи со смертью его отца или его матери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преломлять для них хлеб». Еврейский глагол буквально означает «делить, разламывать» и, вероятно, указывает на обычай разделять пищу с участниками траура.'
    reason: lexical_alternative
  - marker: b
    text: «Чаша утешения», вероятно, означает напиток, который по обычаю подавали скорбящим после смерти.
    reason: cultural_note
lexical_decisions:
- source_word: יִפְרְסוּ
  choice: станет преломлять… хлеб
  rationale: Глагол פרס буквально означает «делить, разламывать». Хотя дополнение в еврейском тексте не выражено, контекст указывает на пищу поминальной трапезы; «преломлять хлеб» сохраняет конкретный образ и понятно по-русски.
- source_word: עַל אֵבֶל
  choice: во время скорби
  rationale: Сочетание обозначает обстоятельство траура. Такой перевод естественно передаёт похоронный контекст, не сводя אֵבֶל только к внутреннему переживанию.
- source_word: לְנַחֲמוֹ
  choice: чтобы утешить его
  rationale: Форма с суффиксом 3-го лица мужского рода единственного числа передана буквально, несмотря на предшествующее множественное «для них».
- source_word: עַל מֵת
  choice: в горе по умершему
  rationale: Предлог указывает на причину утешения — смерть человека. Русское выражение передаёт смысл естественно и сохраняет упоминание умершего.
- source_word: יַשְׁקוּ אוֹתָם
  choice: не даст им выпить
  rationale: Каузативная форма שקה означает «дать пить, напоить». Конструкция «дать им выпить» естественна по-русски и сохраняет множественное число объекта.
- source_word: כּוֹס תַּנְחוּמִים
  choice: чашу утешения
  rationale: Сохранено образное и, вероятно, культурно обусловленное выражение еврейского текста.
- source_word: עַל אָבִיו וְעַל אִמּוֹ
  choice: в скорби по его отцу и по его матери
  rationale: Мужские суффиксы единственного числа сохранены как «его», а повтор предлога и союз ו переданы без стирания структуры исходного текста.
