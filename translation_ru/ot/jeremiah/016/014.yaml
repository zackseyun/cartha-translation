  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹֽא יֵאָמֵ֥ר עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/014.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when it will no longer be said, ‘As Yahweh lives[b], who brought up the sons of Israel from the land of Egypt,’
translation:
  language: ru
  text: 'Поэтому вот, наступают дни, — возвещает Яхве, — когда уже не будут говорить: «Жив Яхве, Который вывел[b] сынов Израиля[a] из земли Египетской»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян» или «народ Израиля». Буквально: «сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский глагол буквально связан с движением вверх; в рассказе об исходе он означает, что Яхве «вывел» Израиль из Египта. Возможно также: «поднял».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт выводное значение союза и связь с предшествующим пророчеством.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет характерный для пророческой речи призыв обратить внимание, не утяжеляя современный русский текст.
- source_word: יָמִים בָּאִים
  choice: наступают дни
  rationale: Естественно передаёт устойчивую пророческую формулу о приближении времени Божьего действия.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественность пророческой формулы; «возвещает» в данном контексте звучит естественнее буквального существительного «изречение».
- source_word: וְלֹא יֵאָמֵר עוֹד
  choice: уже не будут говорить
  rationale: Безличное русское множественное число естественно передаёт еврейскую безличную пассивную конструкцию и значение прекращения прежнего речения.
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Передаёт устойчивую еврейскую формулу клятвы, сохраняя её краткость и библейскую выразительность.
- source_word: אֲשֶׁר הֶעֱלָה
  choice: Который вывел
  rationale: В контексте исхода каузатив глагола עלה означает избавительное выведение из Египта; «вывел» ясно и естественно выражает смысл.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет родственную образность и грамматическую форму исходного выражения; более идиоматичные коллективные варианты отмечены в сноске.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Сохраняет существительное «земля» и традиционную формулу исхода в достойном, понятном современному читателю русском регистре.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное заветное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Буквальная родственная метафора сохранена без сужения или расширения состава названной общности; идиоматические варианты даны в сноске.
- issue: Формула חַי יְהוָה
  choice: Жив Яхве
  alternative: клянусь жизнью Яхве; как жив Яхве
  rationale: Сохранена форма клятвенного речения, а не только его прагматический смысл, чтобы не устранять богословски значимую связь клятвы с жизнью Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены формула привлечения внимания «вот», клятвенное выражение «Жив Яхве» и незавершённость синтаксиса стиха, продолжающегося в следующем стихе. Маркеры сносок поставлены непосредственно при выражениях, к которым они относятся.
