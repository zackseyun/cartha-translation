  yaml_path: translation/ot/jeremiah/016/006.yaml
  text: Both great and small will die in this land[a]. They will not be buried, and no one will mourn for them, or cut himself[b], or make himself bald for them.
translation:
  language: ru
  text: И великие, и малые умрут в этой земле. Их не похоронят; никто не будет оплакивать их[b], наносить себе надрезы или обривать себе голову в знак траура по ним[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Речь идёт об обычаях траура: в знак скорби по умершим люди наносили себе надрезы и обривали голову.'
    reason: cultural_note
  - marker: b
    text: 'Евр.: «не будут оплакивать их»; в еврейском тексте употреблён глагол во множественном числе с неопределённым действующим лицом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵתוּ
  choice: умрут
  rationale: Прямое значение глагола מות; перфект в пророческом контексте передаёт предстоящее событие.
- source_word: גְדֹלִים וּקְטַנִּים
  choice: и великие, и малые
  rationale: 'Сохраняет образную пару оригинала и её широту: речь может идти о положении, значимости или возрасте, поэтому более узкое «знатные и простые» не выбрано.'
- source_word: בָּאָרֶץ הַזֹּאת
  choice: в этой земле
  rationale: «Земля» естественно передаёт אֶרֶץ в географическом и заветном контексте Иеремии.
- source_word: לֹא יִקָּבֵרוּ
  choice: их не похоронят
  rationale: Безличная активная конструкция естественнее по-русски, чем пассивная, и точно передаёт отсутствие погребения.
- source_word: וְלֹא יִסְפְּדוּ לָהֶם
  choice: никто не будет оплакивать их
  rationale: Неопределённое множественное число еврейского глагола естественно передано русским «никто»; смысл публичного траура сохранён.
- source_word: וְלֹא יִתְגֹּדַד
  choice: делать ради них надрезы на теле
  rationale: Конкретно передаёт ритуальное нанесение себе порезов и не заменяет названный обычай общим выражением «совершать траурные обряды».
- source_word: וְלֹא יִקָּרֵחַ לָהֶם
  choice: обривать голову наголо
  rationale: Естественно выражает намеренное создание плеши или облысения как знак траура, не предполагая естественной потери волос.
theological_decisions:
- issue: Передача конкретных траурных обычаев
  choice: Прямо назвать надрезы на теле и обривание головы наголо
  alternative: Обобщить как «совершать траурные обряды»
  rationale: Оригинал намеренно перечисляет телесные действия; их сохранение передаёт резкость пророчества и культурную конкретность без конфессионального толкования.
- issue: Значение пары «великие и малые»
  choice: Сохранить широкую образную формулировку
  alternative: Передать как «знатные и простые» или «взрослые и дети»
  rationale: Контекст допускает понимание по общественному положению, значимости или возрасту; перевод не должен без необходимости устранять эту многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Пара «великие и малые» сохранена ради смысловой широты оригинала; конкретные траурные действия названы ясно и без архаизмов.
