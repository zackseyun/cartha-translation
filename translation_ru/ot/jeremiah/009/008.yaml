  variant: modern literary Russian
source:
  edition: WLC
  text: הַ/עַל אֵ֥לֶּה לֹֽא אֶפְקָד בָּ֖/ם נְאֻם יְהוָ֑ה אִ֚ם בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/008.yaml
  text: Shall I not punish them for these things? declares Yahweh[a]. Shall my soul not avenge itself on a nation such as this?
translation:
  language: ru
  text: «Неужели Я не взыщу с них за всё это? — возвещает Яхве. — Неужели душа Моя[a] не отомстит такому народу?»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «душа Моя»; антропопатическое выражение. Возможный смысл: «Я Сам» или «всё Моё существо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: за всё это
  rationale: Вопросительная частица הַ и предлог עַל выражают риторический вопрос о причине суда. «За всё это» естественно передаёт причинное значение и совокупность названных преступлений.
- source_word: אֶפְקָד בָּם
  choice: Я не взыщу с них
  rationale: В данном контексте פקד означает судебное привлечение к ответу и наказание. «Взыщу с них» сохраняет судебно-пророческую окраску и остаётся понятным современному читателю.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Формула вводит торжественное пророческое изречение. «Возвещает» передаёт её весомость, а личное имя יהוה транслитерируется как «Яхве».
- source_word: אִם
  choice: Неужели ... не
  rationale: Здесь אִם вводит не условие, а второй параллельный риторический вопрос, предполагающий утвердительный ответ.
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: такому народу
  rationale: Краткая естественная формулировка сохраняет указательное усиление כָּזֶה — «такому, как этот».
- source_word: תִתְנַקֵּם
  choice: не отомстит
  rationale: Hitpael глагола נקם здесь обозначает совершение возмездия против объекта, отмеченного предлогом בְּ. Русское «отомстить кому-либо» естественно передаёт направленность возмездия; возвратный оттенок формы не следует искусственно усиливать добавлением отсутствующего «за себя».
- source_word: נַפְשִׁי
  choice: душа Моя
  rationale: Буквальное выражение сохраняет яркий антропопатический образ и эмоциональную напряжённость исходного текста, не сводя его к более гладкому «Я Сам».
theological_decisions:
- issue: Божественное самонаименование נַפְשִׁי в контексте суда
  choice: душа Моя
  alternative: Я Сам; всё Моё существо
  rationale: Сохранено образное выражение еврейского текста, чтобы не устранять его антропопатическую силу и богословское напряжение.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация передаёт личное имя Бога, употреблённое в исходном тексте, а не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Два параллельных риторических вопроса сохранены; синтаксис сделан естественным для русского, а образ «душа Моя» оставлен без сглаживания.
