revisions:
- from: Они натягивают свой язык, словно лук, для лжи; не верностью они обрели силу в стране. Они переходят от зла ко злу[a] и Меня не знают[b], — возвещает Яхве.
  to: Они напрягают язык свой, как лук, для лжи; не ради верности они обрели силу в земле, ибо от зла ко злу они переходят[a] и Меня не знают[b], — возвещает Яхве.
