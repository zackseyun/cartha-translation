    rationale: 'Фраза «не верностью они обрели силу» понимает ל как средство. В данном противопоставлении שֶׁקֶר / אֱמוּנָה естественнее передать направленность: «не ради верности».'
  - severity: low
    issue: «В стране» вместо «в земле»
    rationale: בָּאָרֶץ в контексте Иеремии, вероятно, обозначает землю народа. «В земле» сохраняет эту связь и не ограничивает значение современным государством.
  - severity: low
    issue: Не вполне естественная образность «натягивают свой язык»
    rationale: Русский глагол «натягивать» обычно требует лука как объекта. «Напрягают язык свой, как лук» остаётся близким к метафоре и звучит литературно естественнее.
  - severity: low
