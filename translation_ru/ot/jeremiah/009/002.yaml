source:
  edition: WLC
  text: וַֽ/יַּדְרְכ֤וּ אֶת לְשׁוֹנָ/ם֙ קַשְׁתָּ֣/ם שֶׁ֔קֶר וְ/לֹ֥א לֶ/אֱמוּנָ֖ה גָּבְר֣וּ בָ/אָ֑רֶץ כִּי֩ מֵ/רָעָ֨ה אֶל רָעָ֧ה יָצָ֛אוּ וְ/אֹתִ֥/י לֹֽא יָדָ֖עוּ נְאֻם יְהוָֽה־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/002.yaml
  text: They bend their tongue[a] like their bow for falsehood, and not for faithfulness have they grown strong in the land; for from evil to evil they go out, and they do not know me[b], declares Yahweh.
translation:
  language: ru
  text: Они напрягают язык свой, как лук, для лжи; не ради верности они обрели силу в земле, ибо от зла ко злу они переходят[a] и Меня не знают[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переходят от одного зла к другому».'
    reason: lexical_alternative
  - marker: b
    text: «Знать Меня» может также означать признавать Яхве в личной и заветной связи.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְרְכוּ
  choice: натягивают
  rationale: Глагол דרך в сочетании с образом лука обозначает натягивание или подготовку лука к выстрелу. Настоящее время естественно передаёт описываемое постоянное поведение.
- source_word: לְשׁוֹנָם קַשְׁתָּם
  choice: свой язык, словно лук
  rationale: Сохранён воинский образ языка как оружия; «словно» естественно раскрывает сжатое еврейское соположение «язык — их лук», не устраняя метафору.
- source_word: שֶׁקֶר
  choice: для лжи
  rationale: Абстрактное существительное שׁקר означает ложь и обман; формулировка сохраняет противопоставление последующей «верности».
- source_word: לֶאֱמוּנָה
  choice: верностью
  rationale: אֱמוּנָה здесь обозначает верность, надёжность и честность, а не только отвлечённую истину.
- source_word: גָּבְרוּ
  choice: обрели силу
  rationale: Глагол גבר выражает усиление, могущество или преобладание. Совершенный вид передаёт достигнутое ими положение, сохраняя нравственную иронию контекста.
- source_word: בָאָרֶץ
  choice: в стране
  rationale: В контексте Иеремии речь, вероятнее всего, идёт о земле/стране народа, а не обо всей земле как мире.
- source_word: מֵרָעָה אֶל רָעָה יָצָאוּ
  choice: переходят от зла ко злу
  rationale: Русское «переходят» естественно выражает заложенное в יצא движение и непрерывное продвижение от одного зла к следующему.
- source_word: יָדָעוּ
  choice: не знают
  rationale: 'Сохранено широкое значение ידע: оно допускает как знание, так и личное, верное признание Бога, не сводя выражение к одной стороне.'
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Формула передаёт торжественную силу пророческого изречения, а личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Заветно-личный оттенок выражения «знать Меня»
  choice: Меня не знают
  alternative: Меня не признают
  rationale: 'Буквальная формулировка сохраняет смысловую широту ידע: не только осведомлённость, но также личное и заветное признание Бога.'
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет в тексте личное имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены образ языка как натянутого лука, противопоставление лжи и верности и смысловая широта глагола «знать»; сжатый еврейский синтаксис умеренно сглажен ради ясности.
