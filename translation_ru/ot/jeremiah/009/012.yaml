  text: וַ/יֹּ֣אמֶר יְהוָ֔ה עַל עָזְבָ/ם֙ אֶת תּ֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/הֶ֑ם וְ/לֹא שָׁמְע֥וּ בְ/קוֹלִ֖/י וְ/לֹא הָ֥לְכוּ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/012.yaml
  text: And Yahweh said[a], "Because they have forsaken my law that I set before them[b], and have not obeyed my voice or walked in it,"
translation:
  language: ru
  text: 'И сказал Яхве: «За то, что они оставили Мой закон[a], который Я дал им, не слушались Моего голоса[b] и не следовали ему…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё наставление». Еврейское слово тора может обозначать наставление в широком смысле, хотя здесь оно имеет силу заветного установления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не слушали Моего голоса». В еврейском этот оборот обычно подразумевает также повиновение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Сохраняет повествовательную связь, выраженную формой с waw.
- source_word: עַל עָזְבָם
  choice: За то, что они оставили
  rationale: עַל вводит основание последующего суда; «за то, что» естественно передаёт причинно-ответственный оттенок, а «оставили» сохраняет смысл нарушения заветной верности.
- source_word: תּוֹרָתִי
  choice: Мой закон
  rationale: В данном контексте תּוֹרָה имеет заветно-нормативную силу; возможное более широкое значение «наставление» вынесено в примечание.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיהֶם
  choice: который Я предложил им
  rationale: Естественно передаёт идиому «дал/положил перед ними» в смысле представил для соблюдения.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: не слушались Моего голоса
  rationale: Русское «слушались» одновременно сохраняет образ слушания голоса и ясно выражает заключённый в идиоме смысл повиновения.
- source_word: וְלֹא הָלְכוּ בָהּ
  choice: и не следовали ему
  rationale: Передаёт метафорическое «не ходили по нему/в нём» как поведение согласно закону, избегая неестественного русского оборота.
theological_decisions:
- issue: Передача תּוֹרָה в контексте нарушения завета
  choice: Мой закон
  alternative: Моё наставление
  rationale: «Закон» сохраняет нормативную и заветную силу слова в этом месте, тогда как более широкая лексическая возможность отмечена отдельно.
- issue: Степень экспликации שׁמע בְּקוֹל
  choice: не слушались Моего голоса
  alternative: не внимали Моему голосу / не повиновались Мне
  rationale: Формулировка сохраняет образ голоса и одновременно передаёт смысл послушания, не сводя выражение лишь к физическому слышанию.
- issue: Метафора הָלְכוּ בָהּ
  choice: не следовали ему
  alternative: не ходили по нему
  rationale: В современном русском выбран естественный эквивалент поведения по норме; местоимение сохраняет отсылку к закону.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прописные местоимения при обращении Бога к Самому Себе соответствуют принятой русской библейской традиции. Многоточие отражает синтаксическую незавершённость стиха, продолжающегося далее.
