base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/021.yaml
  text: 'Speak: Thus says Yahweh[a], “The corpse of man will fall like dung on the face of the field, and like a sheaf behind the reaper, with no one to gather it.”'
translation:
  language: ru
  text: 'Скажи: так говорит Яхве: «Падут тела людей, словно навоз на поверхности поля, словно сноп позади жнеца, и некому будет собрать их».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Скажи
  rationale: Повелительная форма 2-го лица единственного числа вводит пророческое возвещение; «Скажи» естественно и точно передаёт приказ.
- source_word: כֹּה נְאֻם יְהוָה
  choice: так говорит Яхве
  rationale: Передаёт обычную формулу пророческого послания современным литературным русским языком, сохраняя личное имя Бога.
- source_word: וְנָפְלָה
  choice: И падёт
  rationale: Перфект в пророческом возвещении выражает несомненное предстоящее событие; будущее время сохраняет смысл объявленного суда.
- source_word: נִבְלַת הָאָדָם
  choice: человеческий труп
  rationale: Конструкция буквально обозначает «труп человека»; прилагательное «человеческий» естественно сохраняет родовое, обобщённое значение единственного אָדָם.
- source_word: כְּדֹמֶן
  choice: словно навоз
  rationale: Сохраняет намеренно резкий, унизительный сельскохозяйственный образ.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: на поверхности поля
  rationale: Естественно передаёт еврейскую идиому «на лице поля» и образ оставленного непогребённого тела.
- source_word: וּכְעָמִיר
  choice: словно сноп
  rationale: עָמִיר обозначает сноп или связку сжатых стеблей; «сноп» точно соответствует контексту жатвы.
- source_word: מֵאַחֲרֵי הַקֹּצֵר
  choice: позади жнеца
  rationale: Сохраняет пространственный образ того, что остаётся за идущим жнецом.
- source_word: וְאֵין מְאַסֵּף
  choice: и некому будет его подобрать
  rationale: Передаёт отсутствие того, кто забрал бы оставленное; «подобрать» естественно объединяет образ оставшегося снопа и непогребённого тела.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Обобщённое значение הָאָדָם
  choice: человеческий труп
  alternative: труп человека; труп человечества
  rationale: Единственное число אָדָם здесь может иметь родовое значение. Формулировка сохраняет единственное число и обобщённость, не сужая смысл до одного мужчины и не превращая его в абстракцию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены резкость образа навоза, сельскохозяйственная метафора и смысл полной оставленности; архаизмы сведены к уместной форме «падёт».
