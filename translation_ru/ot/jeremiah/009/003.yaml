source:
  edition: WLC
  text: אִ֤ישׁ מֵ/רֵעֵ֨/הוּ֙ הִשָּׁמֵ֔רוּ וְ/עַל כָּל אָ֖ח אַל תִּבְטָ֑חוּ כִּ֤י כָל אָח֙ עָק֣וֹב יַעְקֹ֔ב וְ/כָל רֵ֖עַ רָכִ֥יל יַהֲלֹֽךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/003.yaml
  text: Each man[a], beware of his neighbor, and do not trust any brother; for every brother surely deceives[c][b], and every neighbor goes about as a slanderer.
translation:
  language: ru
  text: Каждый пусть остерегается своего ближнего[a] и не доверяет ни одному брату[b], потому что всякий брат непременно обманывает[c], и всякий ближний ходит, разнося клевету[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «товарища» или «друга».'
    reason: lexical_alternative
  - marker: b
    text: «Брат» может означать как родного брата, так и другого члена общины.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «всякий брат коварно обходит» или «всякий брат обманом обходит другого». В еврейском тексте однокоренные формы усиливают мысль; корень עקב может обозначать коварный обход, обман или узурпирующее занятие чужого места.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «ходит, разнося сплетни»; буквально: «ходит как клеветник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מֵרֵעֵהוּ הִשָּׁמֵרוּ
  choice: Пусть каждый остерегается своего ближнего
  rationale: 'Форма единственного числа אִישׁ в сочетании с повелительным множественного числа имеет распределительное значение: предупреждение обращено к каждому. Русская конструкция с «пусть каждый» естественно передаёт этот смысл.'
- source_word: רֵעַ
  choice: ближний
  rationale: Слово может означать ближнего, товарища, спутника или друга. «Ближний» сохраняет широкий общественный смысл и не предполагает близкой дружбы; в обеих частях стиха оно переведено одинаково.
- source_word: הִשָּׁמֵרוּ
  choice: остерегается
  rationale: Нифаль повелительного наклонения выражает призыв быть настороже и беречься указанного человека.
- source_word: וְעַל כָּל אָח אַל תִּבְטָחוּ
  choice: и не доверяет ни одному брату
  rationale: בָּטַח означает доверять или полагаться. В отрицательном предписании сочетание כָּל אָח естественно передано как «ни одному брату».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для предшествующего предупреждения.
- source_word: עָקוֹב יַעְקֹב
  choice: непременно обманывает
  rationale: Сочетание однокоренных форм усиливает глагольную мысль. Перевод передаёт и действие, и усиление, не воспроизводя неестественный для русского повтор.
- source_word: רָכִיל יַהֲלֹךְ
  choice: ходит, разнося клевету
  rationale: הלך описывает привычное поведение, а רָכִיל — человека, распространяющего клевету или сплетни. Оборот передаёт образ постоянного хождения с пагубными речами.
theological_decisions:
- issue: Объём значения אָח
  choice: Сохранено слово «брат» с пояснением в сноске.
  alternative: «соплеменник» или «ближний»
  rationale: В контексте возможны как родной брат, так и член той же общины; основной текст не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конструкция «пусть каждый» сохраняет распределительный характер обращения, а настоящее время в заключительных утверждениях передаёт привычное, повторяющееся поведение.
