  text: כִּֽי שְׁמַ֤עְנָה נָשִׁים֙ דְּבַר יְהוָ֔ה וְ/תִקַּ֥ח אָזְנְ/כֶ֖ם דְּבַר פִּ֑י/ו וְ/לַמֵּ֤דְנָה בְנֽוֹתֵי/כֶם֙ נֶ֔הִי וְ/אִשָּׁ֥ה רְעוּתָ֖/הּ קִינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/019.yaml
  text: For hear the word of Yahweh[a], O women, and let your ear receive the word of his mouth; teach your daughters a lament[c][b], and each woman her neighbor a dirge.
translation:
  language: ru
  text: Ибо слушайте[a] слово Яхве, женщины, и пусть ваше ухо примет[b] слово из его уст; научите ваших дочерей плачу, и пусть каждая научит свою ближнюю погребальной песне[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Можно также перевести: «услышьте». Еврейский глагол подразумевает не только слышание, но и внимательное слушание.'
    reason: lexical_alternative
  - marker: b
    text: Оборот «пусть ваше ухо примет» означает внимательное и восприимчивое слушание.
    reason: idiom_note
  - marker: c
    text: 'В еврейском тексте употреблены два близких обозначения скорби: «плач» и «погребальная песнь»; оба могут относиться к установленным формам оплакивания.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: 'Сохраняет связующую причинную функцию частицы в контексте: повеление обосновывается предшествующим призывом к плакальщицам.'
- source_word: שְׁמַעְנָה נָשִׁים
  choice: слушайте, женщины
  rationale: Женская форма множественного числа повелительного наклонения и прямое обращение к женщинам переданы явно; «слушайте» естественно выражает требование внимать.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранены устойчивое пророческое выражение «слово» и личное имя Бога, представленное тетраграмматоном.
- source_word: וְתִקַּח אָזְנְכֶם
  choice: и пусть ваше ухо примет
  rationale: Сохранены конкретный образ и грамматическое единственное число «ухо»; оборот означает внимательное восприятие сказанного.
- source_word: דְּבַר פִּיו
  choice: слово из его уст
  rationale: Передаёт конкретный образ речи, исходящей из Божьих уст, и звучит естественнее по-русски, чем буквальное «слово его уст».
- source_word: וְלַמֵּדְנָה בְנוֹתֵיכֶם
  choice: научите ваших дочерей
  rationale: Повеление обращено к женщинам и прямо упоминает дочерей; гендерная конкретность оригинала сохранена.
- source_word: נֶהִי
  choice: плачу
  rationale: Слово обозначает плач или выражение скорби; простой русский эквивалент сохраняет его отличие от более формальной קִינָה.
- source_word: וְאִשָּׁה רְעוּתָהּ
  choice: и каждая — свою ближнюю
  rationale: 'Эллиптическое продолжение предыдущего глагола раскрыто минимально: каждая женщина должна научить другую женщину из своего окружения.'
- source_word: קִינָה
  choice: погребальной песне
  rationale: Передаёт формальный плачевный напев или песнь скорби и позволяет отличить этот термин от נֶהִי.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Обращение именно к женщинам
  choice: женщины / ваши дочери / каждая — свою ближнюю
  alternative: люди / дети / каждый — ближнего
  rationale: Женские формы повелений и существительные оригинала требуют сохранить конкретную женскую аудиторию.
- issue: Различение двух обозначений скорби
  choice: плач / погребальная песнь
  alternative: плач / плач
  rationale: Два близких, но не тождественных еврейских термина сохранены разными выражениями без утверждения чрезмерно строгой жанровой границы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены обращение к женщинам, конкретный образ уха и уст, а также различие двух терминов оплакивания; эллипсис последней части передан тире без тяжеловесного повтора глагола.
