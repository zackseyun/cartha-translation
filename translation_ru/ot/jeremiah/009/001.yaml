source:
  edition: WLC
  text: מִֽי יִתְּנֵ֣/נִי בַ/מִּדְבָּ֗ר מְלוֹן֙ אֹֽרְחִ֔ים וְ/אֶֽעֶזְבָה֙ אֶת עַמִּ֔/י וְ/אֵלְכָ֖ה מֵֽ/אִתָּ֑/ם כִּ֤י כֻלָּ/ם֙ מְנָ֣אֲפִ֔ים עֲצֶ֖רֶת בֹּגְדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/001.yaml
  text: Oh[a], that I had a travelers' lodging place in the wilderness, so that I might leave my people and go away from them! For all of them are adulterers[d][c][b], an assembly of traitors.
translation:
  language: ru
  text: О, если бы у меня был в пустыне приют для путников[a]! Я оставил бы свой народ и ушёл от них, потому что все они — прелюбодеи[b], собрание изменников[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Кто даст мне в пустыне приют для путников?» Это еврейский оборот, выражающий сильное желание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «те, кто прелюбодействует». В пророческом контексте это слово может также указывать на неверность завету, а не только на буквальное прелюбодеяние.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «собрание вероломных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: О, если бы у меня был
  rationale: Буквально выражение построено как вопрос «Кто даст мне…?», но здесь это идиома сильного желания. Русская конструкция сохраняет желательное и скорбное звучание.
- source_word: בַמִּדְבָּר
  choice: в пустыне
  rationale: «Пустыня» естественно передаёт מִדְבָּר как незаселённую дикую местность и соответствует возвышенному пророческому контексту.
- source_word: מְלוֹן אֹרְחִים
  choice: приют для путников
  rationale: מְלוֹן обозначает место ночлега или временное пристанище, а אֹרְחִים — путников. «Приют» не создаёт лишнего образа благоустроенной гостиницы.
- source_word: וְאֶעֶזְבָה ... וְאֵלְכָה מֵאִתָּם
  choice: Я оставил бы ... и ушёл от них
  rationale: Условно-желательная форма по-русски естественно продолжает начальное пожелание и передаёт волитивные формы оригинала, включая идею удаления от народа.
- source_word: עַמִּי
  choice: свой народ
  rationale: Возвратное притяжательное местоимение естественно в русском при совпадении обладателя с подлежащим и сохраняет личную связь говорящего с народом.
- source_word: כִּי כֻלָּם
  choice: потому что все они
  rationale: כִּי вводит причину желания уйти, а «все они» сохраняет подчёркнутую всеобщность обвинения.
- source_word: מְנָאֲפִים
  choice: прелюбодеи
  rationale: Сохраняется прямое значение причастия от נאף. Слово допускает как буквальный смысл, так и пророческий оттенок неверности завету.
- source_word: עֲצֶרֶת בֹּגְדִים
  choice: сборище изменников
  rationale: «Сборище» передаёт коллективное עֲצֶרֶת и в данном обличительном контексте звучит резко; «изменники» передаёт вероломство и неверность בגד, не ограничивая обвинение политической изменой.
theological_decisions:
- issue: Следует ли понимать מְנָאֲפִים только буквально или только как образ неверности завету
  choice: Сохранить в основном тексте конкретное «прелюбодеи», а двойной возможный смысл отметить в сноске.
  alternative: «Неверные» или «духовные прелюбодеи».
  rationale: Пророческая речь может одновременно подразумевать буквальное прелюбодеяние и неверность Богу. Перевод не должен устранять эту смысловую напряжённость.
- issue: Характер измены в בֹּגְדִים
  choice: «изменники» без уточнения объекта измены.
  alternative: «предатели» или «вероломные».
  rationale: В оригинале объект не назван; нейтрально широкое «изменники» сохраняет возможность межличностной и заветной неверности.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Начальное «О, если бы» передаёт плач и желание; «приют для путников» остаётся понятным и не архаичным. «Сборище» намеренно сохраняет резкость обличения.
