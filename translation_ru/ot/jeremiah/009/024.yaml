source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וּ/פָ֣קַדְתִּ֔י עַל כָּל מ֖וּל בְּ/עָרְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/024.yaml
  text: Look[a], days are coming, declares Yahweh[b], when I will punish everyone circumcised only in foreskin.
translation:
  language: ru
  text: Вот, наступают дни, — возвещает Яхве[a], — когда Я покараю каждого, кто обрезан, но остаётся необрезанным[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное еврейскими согласными יהוה; традиционно его также заменяют словом «Господь».
    reason: divine_name
  - marker: b
    text: 'Буквально: «каждого обрезанного в необрезании» или «с крайней плотью». Намеренно парадоксальная фраза указывает на внешне обрезанных, которые в более глубоком, заветном смысле остаются необрезанными; ср. Иер. 4:4 и следующие стихи.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-эмфатическую силу пророческого вступления естественным и достойным современным русским языком.
- source_word: יָמִים בָּאִים
  choice: наступают дни
  rationale: Сохраняет обычную пророческую формулу грядущего Божьего действия; «наступают» по-русски естественнее буквального «приходят».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную формулу божественного изречения; «возвещает» сохраняет пророческий регистр, а «Яхве» представляет личное имя יהוה.
- source_word: וּפָקַדְתִּי עַל
  choice: Я покараю
  rationale: В контексте суда פקד с עַל означает карательное взыскание; «покараю» ясно выражает судебный смысл и сохраняет возвышенный регистр.
- source_word: עַל כָּל
  choice: каждого
  rationale: Кратко и естественно вводит всякого представителя названной далее группы.
- source_word: מוּל בְּעָרְלָה
  choice: кто обрезан, но остаётся необрезанным
  rationale: Сохраняет намеренный парадокс еврейской фразы и не уточняет прямо, о каком внутреннем состоянии идёт речь; это раскрывается ближайшим контекстом.
theological_decisions:
- issue: Парадокс מוּל בְּעָרְלָה
  choice: кто обрезан, но остаётся необрезанным
  alternative: каждого обрезанного в необрезании; всех обрезанных вместе с необрезанными
  rationale: Основной текст должен быть понятен современному читателю, но не устранять напряжение между внешним обрезанием и сохраняющимся «необрезанием». Формулировка не добавляет слова «сердце», которого в данном стихе нет.
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога, присутствующее в исходном тексте, вместо замены его титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис упрощён до естественной русской формы, однако резкий парадокс заключительной фразы сохранён. Заглавное «Я» употреблено в прямой речи Бога по принятой русской библейской традиции.
