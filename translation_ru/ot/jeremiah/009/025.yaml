  text: עַל מִצְרַ֣יִם וְ/עַל יְהוּדָ֗ה וְ/עַל אֱד֞וֹם וְ/עַל בְּנֵ֤י עַמּוֹן֙ וְ/עַל מוֹאָ֔ב וְ/עַל֙ כָּל קְצוּצֵ֣י פֵאָ֔ה הַ/יֹּשְׁבִ֖ים בַּ/מִּדְבָּ֑ר כִּ֤י כָל הַ/גּוֹיִם֙ עֲרֵלִ֔ים וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל עַרְלֵי לֵֽב־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/025.yaml
  text: against Egypt[a], and against Judah, and against Edom, and against the sons of Ammon, and against Moab, and against all those with the corners of their hair cut off, who dwell in the wilderness; for all the nations are uncircumcised, and all the house of Israel are uncircumcised in heart.
translation:
  language: ru
  text: …Египет, Иудею, Эдом, сыновей Аммона, Моав и всех, у кого волосы острижены по краям[a] и кто живёт в пустыне. Ведь все народы необрезаны, а весь дом Израиля — с необрезанным сердцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всех остриженных по краю»; вероятно, речь идёт об особой причёске народов пустыни.'
    reason: Лексически неоднозначное выражение обозначает стрижку края волос, но точный вид причёски по древнееврейскому тексту установить трудно.
lexical_decisions:
- source_word: עַל
  choice: 'передано падежным управлением перечисления: «Египет, Иудею…»'
  rationale: Стих продолжает начатое ранее объявление о наказании; в русском языке повторение предлога «против» здесь было бы менее естественным, а винительный падеж ясно указывает на объекты суда.
- source_word: בְּנֵי עַמּוֹן
  choice: сыновей Аммона
  rationale: Сохраняет явную древнееврейскую конструкцию и её собирательное обозначение народа, не заменяя её этнонимом «аммонитяне».
- source_word: כָּל קְצוּצֵי פֵאָה
  choice: всех, у кого волосы острижены по краям
  rationale: Передаёт конкретный образ стрижки по краю, не сводя неоднозначную фразу исключительно к вискам или к иной точно реконструированной причёске.
- source_word: הַיֹּשְׁבִים בַּמִּדְבָּר
  choice: кто живёт в пустыне
  rationale: Естественная современная русская формулировка, уместная для обозначения населяющих пустынную местность народов.
- source_word: כָל הַגּוֹיִם
  choice: все народы
  rationale: В контексте перечислены окружающие народы; «народы» сохраняет этнополитический смысл без привнесения позднейшего термина «язычники».
- source_word: עֲרֵלִים
  choice: необрезаны
  rationale: Буквальная передача сохраняет заветную и полемическую силу противопоставления.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: весь дом Израиля
  rationale: Сохраняет библейский собирательный образ и остаётся понятным в современном литературном русском языке.
- source_word: עַרְלֵי לֵב
  choice: необрезан сердцем
  rationale: Сохраняет телесную метафору внутреннего состояния и её связь с предшествующим словом «необрезаны».
theological_decisions:
- issue: Метафорическое описание состояния Израиля
  choice: необрезан сердцем
  alternative: духовно необрезан; с ожесточённым сердцем
  rationale: В тексте знак обрезания метафорически отнесён к сердцу. Буквальная метафора сохраняет напряжение между внешним знаком завета и внутренним состоянием, не истолковывая его вместо читателя.
- issue: Соотношение народов и Израиля в заключительной причине
  choice: «все народы необрезаны, а весь дом Израиля необрезан сердцем»
  alternative: «все язычники необрезаны, и весь Израиль духовно необрезан»
  rationale: Формулировка сохраняет параллелизм и различие между физической необрезанностью народов и метафорической необрезанностью сердца Израиля.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Перечень оформлен как продолжение синтаксической конструкции предыдущего стиха; заключительное объяснение выделено отдельным предложением для ясности. Заветная метафора намеренно сохранена.
