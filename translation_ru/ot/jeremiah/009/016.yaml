reference: Jeremiah 9:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִתְבּֽוֹנְנ֛וּ וְ/קִרְא֥וּ לַ/מְקוֹנְנ֖וֹת וּ/תְבוֹאֶ֑ינָה וְ/אֶל הַ/חֲכָמ֥וֹת שִׁלְח֖וּ וְ/תָבֽוֹאנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/016.yaml
  text: 'Thus says Yahweh of hosts: Consider[a], and call for the mourning women, that they may come; and send for the skillful women[b], that they may come.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Вникните и позовите плакальщиц[a], пусть они придут; пошлите за искусными женщинами[b], пусть они придут».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть женщин, исполняющих плач; возможно, профессиональных плакальщиц.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мудрыми женщинами»; здесь, вероятно, имеются в виду женщины, искусные в исполнении плача.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Так
  rationale: Устойчиво и естественно передаёт пророческую формулу введения речи.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя Бога и широкий смысл титула, не сводя צְבָאוֹת исключительно к земным армиям.
- source_word: הִתְבּוֹנְנוּ
  choice: Вникните
  rationale: Передаёт повеление внимательно осмыслить происходящее; звучит естественно и не добавляет объекта, которого нет в еврейском тексте.
- source_word: וְקִרְאוּ
  choice: и позовите
  rationale: В данном контексте означает призвать женщин, чтобы они пришли.
- source_word: לַמְקוֹנְנוֹת
  choice: плакальщиц
  rationale: Кратко и точно обозначает женщин, исполняющих погребальный или общественный плач; профессиональный статус вероятен, но не выражен в переводе как обязательный.
- source_word: וּתְבוֹאֶינָה
  choice: пусть они придут
  rationale: В последовательности после повеления имперфект выражает желаемое последующее действие.
- source_word: הַחֲכָמוֹת
  choice: искусными женщинами
  rationale: Буквально слово может означать «мудрые», однако параллелизм указывает на женщин, искусных в исполнении плача.
- source_word: שִׁלְחוּ
  choice: пошлите за
  rationale: Естественная русская идиома для отправки кого-либо с целью позвать или привести этих женщин.
- source_word: וְתָבֹאנָה
  choice: пусть они придут
  rationale: Сохраняет повтор и параллелизм еврейского текста, а также волитивный оттенок формы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Значение титула צְבָאוֹת
  choice: Воинств
  alternative: Сил; небесных воинств
  rationale: Форма «Воинств» сохраняет традиционную широту титула и не уточняет без необходимости, идёт ли речь только о небесных или также о земных силах.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы и параллелизма. Повтор «пусть они придут» оставлен намеренно. «Плакальщицы» понятно современному читателю и точнее передаёт функцию женщин, чем описательное «скорбящие женщины».
