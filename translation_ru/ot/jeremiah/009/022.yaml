  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל יִתְהַלֵּ֤ל חָכָם֙ בְּ/חָכְמָת֔/וֹ וְ/אַל יִתְהַלֵּ֥ל הַ/גִּבּ֖וֹר בִּ/גְבֽוּרָת֑/וֹ אַל יִתְהַלֵּ֥ל עָשִׁ֖יר בְּ/עָשְׁרֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/022.yaml
  text: 'Thus says Yahweh: Let not the wise man boast in his wisdom[a], and let not the mighty man boast in his might; let not the rich man boast in his riches.'
translation:
  language: ru
  text: 'Так говорит Яхве[a]: «Пусть мудрый не хвалится своей мудростью, пусть сильный не хвалится своей силой, пусть богатый не хвалится своим богатством».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: ЙХВХ; традиционно переводится «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного русского языка формула пророческого возвещения, сохраняющая торжественный характер и настоящее время авторитетного провозглашения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, не заменяя его титулом.
- source_word: אַל יִתְהַלֵּל
  choice: пусть ... не хвалится
  rationale: Возвратная форма точно передаёт хитпаэль со значением самовосхваления; конструкция сохраняет оттенок запрета и повтор исходного текста.
- source_word: חָכָם
  choice: мудрый
  rationale: Субстантивированное прилагательное в единственном числе естественно передаётся по-русски без добавления слова «человек».
- source_word: בְּחָכְמָתוֹ
  choice: своей мудростью
  rationale: Творительный падеж после «хвалиться» идиоматично передаёт основание или предмет похвальбы, обозначенный предлогом בְּ.
- source_word: הַגִּבּוֹר
  choice: сильный
  rationale: В данном обобщённом ряду слово обозначает человека, отличающегося силой или могуществом; «сильный» не сужает смысл до воина.
- source_word: בִּגְבוּרָתוֹ
  choice: своей силой
  rationale: Сохраняет корневую связь с «сильный» и выражает физическую либо общественную мощь без ненужного уточнения.
- source_word: עָשִׁיר
  choice: богатый
  rationale: Прямое и естественное обозначение богатого человека в представительном мужском единственном числе.
- source_word: בְּעָשְׁרוֹ
  choice: своим богатством
  rationale: Современное русское «богатство» естественно передаёт материальное достояние и поддерживает трёхчастный параллелизм.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; его транслитерация сохраняет различие между именем и титулом. Традиционный вариант указан в сноске.
- issue: Характер запрета אַל יִתְהַלֵּל
  choice: Пусть ... не хвалится
  alternative: Не хвались
  rationale: Форма третьего лица соответствует еврейской юссивной конструкции и сохраняет обобщённое обращение к трём типам людей.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной пророческой интонацией. Трёхчастный синтаксический параллелизм и повтор глагола сохранены; архаизмы и избыточные добавления устранены.
