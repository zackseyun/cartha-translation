  text: כִּ֣י ק֥וֹל נְהִ֛י נִשְׁמַ֥ע מִ/צִּיּ֖וֹן אֵ֣יךְ שֻׁדָּ֑דְנוּ בֹּ֤שְׁנֽוּ מְאֹד֙ כִּֽי עָזַ֣בְנוּ אָ֔רֶץ כִּ֥י הִשְׁלִ֖יכוּ מִשְׁכְּנוֹתֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/018.yaml
  text: 'For the sound of wailing is heard from Zion: “How we are devastated! We are utterly ashamed[a], because we have left the land[c][b], because they have cast down our dwellings.”'
translation:
  language: ru
  text: 'Ведь с Сиона слышен плач:


    «Как мы разорены[a]!


    Нам очень стыдно,


    потому что мы покинули землю[b],


    потому что они разрушили наши жилища[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как мы разграблены!» Еврейский глагол может указывать как на разорение вообще, так и на разграбление врагом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оставили землю». Еврейский глагол может обозначать и уход, и оставление; здесь не уточняется, насколько этот уход был вынужденным.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «повергли (бросили вниз) наши жилища»; то есть разрушили их. Возможный перевод слова «жилища»: «дома» или «обиталища».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь / потому что
  rationale: Первое כִּי поясняет предшествующий призыв к плачу, поэтому передано словом «ведь»; последующие два вводят причины и естественно передаются как «потому что».
- source_word: קוֹל נְהִי
  choice: слышен плач
  rationale: Сочетание буквально означает «звук/голос плача». Русская формулировка сохраняет слуховой образ вместе с נִשְׁמַע и звучит естественно.
- source_word: נִשְׁמַע מִצִּיּוֹן
  choice: с Сиона слышен
  rationale: Сохранены пассивное значение нифаля и направление звука от Сиона без уточнения временного аспекта.
- source_word: אֵיךְ שֻׁדָּדְנוּ
  choice: Как мы разорены
  rationale: שׁדד в пассиве может обозначать общее разорение или разграбление врагом. «Разорены» сохраняет широкий смысл и силу восклицания.
- source_word: בֹּשְׁנוּ מְאֹד
  choice: Мы покрыты глубоким стыдом
  rationale: בושׁ выражает стыд и бесчестье, а מְאֹד усиливает его. Формулировка современна, выразительна и не сводит смысл только к внутреннему чувству.
- source_word: עָזַבְנוּ אָרֶץ
  choice: покинули свою землю
  rationale: עָזַב допускает значения «покинуть» и «оставить». «Покинули» не решает без необходимости, был ли уход добровольным; притяжательное «свою» естественно обозначает родную землю, подразумеваемую контекстом.
- source_word: הִשְׁלִיכוּ מִשְׁכְּנוֹתֵינוּ
  choice: они разрушили наши жилища
  rationale: Буквально глагол означает «бросили/повергли». При объекте «жилища» речь естественно понимается как их низвержение или разрушение; неопределённое «они» сохранено.
theological_decisions:
- issue: Характер ухода из земли
  choice: покинули свою землю
  alternative: оставили свою землю / были вынуждены уйти из своей земли
  rationale: Еврейский текст не уточняет прямо степень принуждения. Перевод сохраняет эту неоднозначность и не вводит дополнительного объяснения изгнания.
- issue: Не названные разрушители жилищ
  choice: они разрушили
  alternative: наши жилища разрушены
  rationale: Сохранено выраженное в еврейском тексте третье лицо множественного числа без попытки назвать врагов или истолковать их богословскую роль.
translation_notes:
  register: Современный литературный русский с достоинством пророческого плача. Строки разбиты по поэтическим смысловым единицам; избегаются как архаизмы, так и разговорная лексика. Повтор причинного союза сохранён для передачи риторической структуры еврейского текста.
