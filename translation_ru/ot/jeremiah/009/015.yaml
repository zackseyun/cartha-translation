base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/015.yaml
  text: And I will scatter them among the nations that neither they nor their fathers have known[c][b][a], and I will send the sword after them until I have consumed them.
translation:
  language: ru
  text: Я рассею их среди народов, которых не знали ни они, ни их отцы[a], и пошлю вслед за ними меч[b], пока не положу им конец[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их предки». Буквально: «их отцы».'
    reason: lexical_alternative
  - marker: b
    text: «Меч» — распространённый библейский образ войны или губительного суда.
    reason: cultural_note
  - marker: c
    text: 'Или: «пока не истреблю их»; также возможно: «пока не уничтожу их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִים
  choice: Я рассею их
  rationale: Каузативная форма от פוץ означает «рассеять, разогнать». «Рассею» естественно передаёт принудительное расселение как суд.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם здесь означает чужие народы; перевод «язычники» внёс бы не обязательный для контекста религиозный оттенок.
- source_word: אֲשֶׁר לֹא יָדְעוּ הֵמָּה וַאֲבוֹתָם
  choice: которых не знали ни они, ни их отцы
  rationale: יָדַע выражает знание или знакомство; конструкция с отрицанием естественно передана сочетанием «ни… ни». «Отцы» сохраняет конкретный образ еврейского текста.
- source_word: וְשִׁלַּחְתִּי אַחֲרֵיהֶם
  choice: и пошлю вслед за ними
  rationale: Сохраняется буквальный образ меча, посланного за изгнанниками и преследующего их.
- source_word: אֶת הַחֶרֶב
  choice: меч
  rationale: חֶרֶב буквально означает «меч» и здесь также может обозначать войну или насильственную гибель; конкретный образ сохранён в основном тексте.
- source_word: עַד כַּלּוֹתִי אוֹתָם
  choice: пока не положу им конец
  rationale: כלה в данной конструкции означает довести до конца, покончить. Русский оборот сохраняет суровость угрозы, не уточняя сверх текста способ уничтожения.
theological_decisions:
- issue: Значение וַאֲבוֹתָם
  choice: их отцы
  alternative: их предки
  rationale: «Отцы» непосредственно соответствует источнику и сохраняет характерный для пророческой речи историко-родовой образ; «предки» возможно как более общее значение.
- issue: Метафорическая сила выражения הַחֶרֶב
  choice: меч
  alternative: война или смертельный суд
  rationale: В основном тексте сохранён конкретный библейский образ, который может метонимически охватывать военное разорение и смертельный суд, без сведения его к одному толкованию.
- issue: Степень окончательности עַד כַּלּוֹתִי אוֹתָם
  choice: пока не положу им конец
  alternative: пока не истреблю их
  rationale: Перевод передаёт доведение суда до конца, сохраняя некоторую лексическую широту כלה и не разрешая без необходимости вопрос о полном уничтожении.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис близок к еврейскому, но естественен по-русски; конкретные образы «отцы» и «меч» сохранены.
