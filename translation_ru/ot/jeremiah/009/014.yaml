base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/014.yaml
  text: 'Therefore thus says Yahweh of Armies[a], the God of Israel: Behold, I am feeding this people wormwood[b], and I will make them drink poisoned water.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве Воинств[a], Бог Израиля: «Вот, Я накормлю этот народ полынью[b] и напою его ядовитой водой[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве воинств»; еврейское слово может обозначать войска или многочисленные силы.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово обозначает полынь — горькое растение, часто служащее образом горечи и суда.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «водой яда»; традиционный вариант — «водой с желчью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет конкретный смысл множества небесных или военных сил и устойчиво сочетается с именем Яхве.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо передаёт конструкцию принадлежности и связь Яхве с Израилем.
- source_word: הִנְנִי מַאֲכִילָם
  choice: Вот, Я накормлю
  rationale: «Вот» сохраняет усилительную формулу объявления; совершенный вид будущего времени естественно выражает близкое и несомненное действие, обозначенное причастием после הִנְנִי.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняет указательное значение и обычное пророческое обозначение народа завета.
- source_word: לַעֲנָה
  choice: полынью
  rationale: Сохраняет конкретный образ горького растения, который в пророческом контексте служит образом суда и горечи.
- source_word: וְהִשְׁקִיתִים
  choice: и напою его
  rationale: Русский глагол «напоить» естественно передаёт каузативное значение еврейской формы — дать или заставить пить.
- source_word: מֵי רֹאשׁ
  choice: ядовитой водой
  rationale: Передаёт воду, содержащую яд или губительное горькое вещество, не подменяя образ отвлечённым толкованием.
theological_decisions:
- issue: Передача божественного титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Господь воинств
  rationale: Транслитерация сохраняет личное имя יְהוָה, а перевод צְבָאוֹת раскрывает смысл титула без привнесения конфессионального толкования.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным для русского: «Поэтому так говорит…», а параллельные глаголы «накормлю» и «напою» сохраняют резкость и образность еврейского текста.'
