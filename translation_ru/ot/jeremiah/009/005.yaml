  text: שִׁבְתְּ/ךָ֖ בְּ/ת֣וֹךְ מִרְמָ֑ה בְּ/מִרְמָ֛ה מֵאֲנ֥וּ דַֽעַת אוֹתִ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/005.yaml
  text: Your dwelling is in the midst of deceit[a]; through deceit they refuse to know me[b], declares Yahweh.
translation:
  language: ru
  text: Твоё жилище — среди обмана[a]; обманом они отказываются знать Меня[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте сначала стоит форма единственного числа («твоё жилище»), а затем — глагол во множественном числе («они отказываются»): вероятно, сначала народ или город представлен как единое целое, а затем имеются в виду его жители.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обманом они отказались знать Меня». Форма глагола может передаваться также завершённым прошедшим временем.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְתְּךָ
  choice: Ты живёшь
  rationale: Форма от ישׁב с суффиксом 2-го лица мужского рода единственного числа обозначает пребывание или обитание. Личная глагольная конструкция естественнее по-русски, чем буквальное «твоё обитание», и сохраняет обращение в единственном числе.
- source_word: בְּתוֹךְ
  choice: среди
  rationale: Передаёт нахождение внутри окружающей среды или состояния, а не просто местоположение.
- source_word: מִרְמָה
  choice: обман
  rationale: Слово обозначает обман, лживость или коварство. «Обман» ясно, современно и позволяет сохранить лексический повтор.
- source_word: בְּמִרְמָה
  choice: из-за обмана
  rationale: Предлог ב здесь допускает причинное, инструментальное или обстоятельственное понимание. Основной текст передаёт естественное по-русски причинное прочтение, а примечание сохраняет инструментальную альтернативу.
- source_word: מֵאֲנוּ
  choice: они отказываются
  rationale: Глагол מאן означает «отказываться, не желать». Настоящее время выражает устойчивое состояние, описываемое пророком; множественное число сохранено.
- source_word: דַעַת אֹתִי
  choice: знать Меня
  rationale: Инфинитив ידע с прямым дополнением буквально означает «знать Меня». Такая формулировка сохраняет возможный заветно-реляционный смысл, не истолковывая его в самом переводе как «признавать».
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современным литературным оборотом; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Переход от единственного числа к множественному
  choice: «Ты живёшь» — «они отказываются»
  alternative: Согласовать всё предложение либо в единственном, либо во множественном числе
  rationale: Еврейский текст обращается к коллективному адресату в единственном числе, а затем говорит о людях во множественном. Этот выразительный сдвиг сохранён, а не сглажен.
- issue: Смысл בְּמִרְמָה
  choice: 'причинное прочтение: «из-за обмана»'
  alternative: 'инструментальное прочтение: «обманом»'
  rationale: Предлог ב допускает оба оттенка. Основной вариант естественен по-русски, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Лексический повтор «обман — обмана» намеренно сохранён; синтаксический переход от единственного числа к множественному отражает структуру еврейского текста.
