id: JER.9.10
reference: Jeremiah 9:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/נָתַתִּ֧י אֶת יְרוּשָׁלִַ֛ם לְ/גַלִּ֖ים מְע֣וֹן תַּנִּ֑ים וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מִ/בְּלִ֖י יוֹשֵֽׁב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/010.yaml
  text: And I will make Jerusalem a heap of ruins[a], a haunt of jackals; and I will make the cities of Judah a desolation[c][b], without inhabitant.
translation:
  language: ru
  text: Я превращу Иерусалим в груды развалин[a], в логово шакалов[b], а города Иудеи сделаю пустынными — без единого жителя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в груды камней».'
    reason: Лексема גלים буквально обозначает груды или насыпи; в контексте разрушенного города имеются в виду груды обломков.
  - marker: b
    text: Евр. танним; традиционно также переводилось как «драконы», но в картинах запустения, вероятнее всего, имеются в виду шакалы.
    reason: Сохраняется лексическая неоднозначность названия животного при указании наиболее вероятного контекстуального значения.
  - marker: c
    text: 'Буквально: «без жителя» или «без живущего там».'
    reason: Приводится более формальное соответствие еврейскому выражению מבלי יושב.
lexical_decisions:
- source_word: וְנָתַתִּי / אֶתֵּן
  choice: превращу / сделаю
  rationale: Глагол נתן буквально означает «дать, положить», но с дополнением результата здесь выражает приведение города и городов в состояние разорения. Русские «превращу» и «сделаю» естественно передают этот результативный смысл.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Устоявшаяся русская форма географического названия.
- source_word: לְגַלִּים
  choice: в груды развалин
  rationale: Множественное число גלים обозначает груды или насыпи, в данном контексте — груды обломков разрушенного города. Формулировка сохраняет зримый образ и число исходного текста.
- source_word: מְעוֹן
  choice: логово
  rationale: Слово означает жилище или место обитания. В отношении диких животных среди развалин естественное русское соответствие — «логово».
- source_word: תַּנִּים
  choice: шакалов
  rationale: В пророческих картинах запустения это слово наиболее вероятно обозначает шакалов — животных, обитающих среди покинутых развалин. Традиционное «драконы» здесь менее вероятно.
- source_word: עָרֵי יְהוּדָה
  choice: города Иудеи
  rationale: Прямо передаёт конструкцию принадлежности и географическое наименование.
- source_word: שְׁמָמָה
  choice: пустынными
  rationale: Слово обозначает опустошение и запустение. Предикативное прилагательное звучит по-русски естественно и передаёт состояние разорённых городов.
- source_word: מִבְּלִי יוֹשֵׁב
  choice: без единого жителя
  rationale: 'Буквально: «без жителя / без живущего». Добавление «единого» идиоматично подчёркивает полное отсутствие населения, не расширяя смысла исходного текста.'
theological_decisions:
- issue: Божественная действенность суда, выраженная повторением נתן
  choice: Передать как «превращу» и «сделаю», ясно обозначив действие говорящего, приводящее Иерусалим и города Иудеи к разорению.
  alternative: Формально передать как «положу» или «отдам».
  rationale: В данном синтаксическом окружении נתן имеет результативный смысл. Выбранные глаголы не усиливают богословское утверждение, а естественно передают непосредственную действенность объявленного суда.
- issue: Определение תַּנִּים в образе опустевшего города
  choice: шакалы
  alternative: драконы; змеи
  rationale: Контекст реального городского запустения лучше всего поддерживает значение «шакалы». Сноска сохраняет сведения о традиционном альтернативном переводе и не превращает образ в мифологическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Образы конкретны и понятны; архаизмы «обиталище» и «без жителя» оставлены для сносок или заменены естественными современными выражениями. Противительное «а» ясно связывает две параллельные части высказывания.
