base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/004.yaml
  text: And each man deceives his neighbor[a], and they do not speak truth; they have taught their tongue to speak falsehood[b]; they weary themselves committing iniquity.
translation:
  language: ru
  text: Каждый обманывает своего ближнего[a] и не говорит правды; они приучили свой язык говорить ложь; они изнурили себя, совершая беззаконие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насмехается над своим ближним»; или: «поступает со своим ближним коварно».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «они изнемогли, делая зло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: каждый
  rationale: Единственное число имеет распределительное значение. «Каждый» естественно передаёт его по-русски, не добавляя ненужного указания на пол.
- source_word: בְּרֵעֵהוּ
  choice: своего ближнего
  rationale: רֵעַ обозначает ближнего, товарища или другого человека из близкого социального круга. «Ближний» сохраняет социально-нравственный смысл контекста.
- source_word: יְהָתֵלּוּ
  choice: обманывает
  rationale: В данной породе и контексте глагол указывает прежде всего на введение в заблуждение; это значение поддерживается параллельным упоминанием неправдивой речи.
- source_word: אֱמֶת
  choice: правды
  rationale: Здесь слово относится к правдивости речи. Оборот «не говорят правды» естественен в современном русском языке и сохраняет смысл существительного.
- source_word: לִמְּדוּ לְשׁוֹנָם
  choice: они приучили свой язык
  rationale: Перфект описывает сформировавшуюся привычку, а буквальный образ языка как обученного орудия лжи сохранён.
- source_word: דַּבֶּר שֶׁקֶר
  choice: говорить ложь
  rationale: Инфинитив с существительным שֶׁקֶר обозначает лживую речь. «Говорить ложь» сохраняет пророческую торжественность, оставаясь понятным.
- source_word: הַעֲוֵה
  choice: творя беззаконие
  rationale: Форма передаёт совершение неправды или извращённого поступка. «Творя беззаконие» сохраняет нравственную тяжесть обвинения.
- source_word: נִלְאוּ
  choice: они изнуряют себя
  rationale: 'Нифаль допускает результативно-возвратное понимание: постоянное зло доводит их до изнеможения. Настоящее время по-русски естественно описывает устойчивое поведение в контексте.'
