  naturalness: Фраза звучит естественно в современном литературном русском. Сочетание единственного распределительного «каждый» с последующим множественным «они» отражает переход в еврейском тексте и приемлемо по-русски; удаление лишнего «они» после первого придаточного делает начало плавнее.
  terminology: «Ближний», «правда», «ложь» и «беззаконие» соответствуют пророческому регистру и не вносят конфессиональной интерпретации. «Совершая беззаконие» естественнее, чем «творя беззаконие», при сохранении нравственной тяжести עוה.
