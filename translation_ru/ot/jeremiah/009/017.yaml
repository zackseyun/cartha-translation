lexical_decisions:
- source_word: וּתְמַהֵרְנָה
  choice: Пусть они поспешат
  rationale: Форма 3-го лица женского рода множественного числа имеет побудительное значение и в контексте относится к призываемым плакальщицам; перевод сохраняет и побуждение, и срочность.
- source_word: וְתִשֶּׂנָה עָלֵינוּ נֶהִי
  choice: и поднимут плач о нас
  rationale: Сочетание נשׂא с נֶהִי означает «поднять, начать плач». Формулировка сохраняет образ исходного текста и остаётся понятной по-русски.
- source_word: נֶהִי
  choice: плач
  rationale: Слово обозначает скорбный плач, причитание; «плач» естественно и достаточно широко передаёт значение без излишней специализации слова «погребальная песнь».
- source_word: וְתֵרַדְנָה עֵינֵינוּ דִּמְעָה
  choice: пусть слёзы польются из наших глаз
  rationale: Буквальный образ нисходящей слезы передан естественной русской конструкцией; единственное число דִּמְעָה понято собирательно.
- source_word: וְעַפְעַפֵּינוּ יִזְּלוּ מָיִם
  choice: и вода потечёт из-под наших век
  rationale: Сохранено исходное «вода» и поэтический параллелизм со слезами; русская конструкция передаёт истечение жидкости без неестественного утверждения, будто текут сами веки.
