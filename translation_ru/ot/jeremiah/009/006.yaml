    issue: «с дочерью Моего народа» вместо причинного значения מִפְּנֵי
    rationale: 'Еврейское מִפְּנֵי здесь выражает основание/причину: «из-за, по причине дочери Моего народа», а не лицо, с которым совершается действие. Вариант «поступить с дочерью» существенно меняет синтаксическую связь и смысл.'
  - severity: medium
    issue: «переплавляю» недостаточно ясно передаёт צרף
    rationale: Глагол צרף обозначает рафинирование, очищение металла посредством огня. Русское «переплавлять» может означать лишь переплавку без идеи очищения. «Очищаю в огне» сохраняет образ и его направленность.
