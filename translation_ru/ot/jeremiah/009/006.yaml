- from: 'Поэтому так говорит Яхве Воинств: «Вот, Я переплавляю их и испытываю; ведь как иначе Мне поступить с дочерью Моего народа[a]?»[b]'
  to: 'Поэтому так говорит Яхве Воинств: «Вот, Я очищаю их в огне и испытываю; ведь как иначе Мне поступить из-за дочери Моего народа[a]?»[b]'
  rationale: 'Исправлен причинный смысл מִפְּנֵי: «из-за», а не «с». Металлургический глагол צרף передан как «очищаю ... в огне», что точнее выражает очистительную метафору, сохраняя её конкретность. Остальная структура, имя «Яхве», титул «Воинств», риторическая форма и намеренно буквальный образ «дочери Моего народа» сохранены.'
