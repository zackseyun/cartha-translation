  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י צוֹרְפָ֖/ם וּ/בְחַנְתִּ֑י/ם כִּֽי אֵ֣יךְ אֶעֱשֶׂ֔ה מִ/פְּנֵ֖י בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/006.yaml
  text: 'Therefore[a], thus says Yahweh of hosts: Behold, I am refining them and testing them[b], for how else can I act because of the daughter of my people?'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве Воинств: «Вот, Я очищаю их в огне и испытываю; ведь как иначе Мне поступить из-за дочери Моего народа[a]?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть «Моим народом» или «дорогим Мне народом». Буквально по-еврейски: «дочерью Моего народа» — пророческий образ близости и заветных отношений.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также перевод: «ведь что ещё Мне делать?» Глаголы «очищаю» и «испытываю» могут быть переданы будущим временем: «очищу их в огне и испытаю».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — широким по смыслу словом «Воинств», не ограничивающим образ только земными армиями.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» сохраняет указательно-эмфатическую силу оборота и торжественный пророческий тон.
- source_word: צוֹרְפָם
  choice: переплавляю их
  rationale: Глагол сохраняет металлургический образ очищения огнём; настоящее время передаёт конструкцию הִנְנִי с причастием, представляющую действие как начатое или непосредственно предстоящее.
- source_word: וּבְחַנְתִּים
  choice: и испытываю
  rationale: «Испытываю» естественно сочетается с образом переплавки и передаёт проверку качества, не сводя смысл только к нравственному очищению.
- source_word: כִּי אֵיךְ אֶעֱשֶׂה
  choice: ведь как иначе Мне поступить
  rationale: Риторический вопрос передан естественно для современного русского языка; слово «иначе» раскрывает подразумеваемую безальтернативность, не превращая её в отдельное богословское утверждение.
- source_word: מִפְּנֵי
  choice: с
  rationale: В сочетании «как поступить с» русский предлог естественно передаёт обусловленность действия состоянием народа, не перегружая фразу буквальным «из-за».
- source_word: בַּת עַמִּי
  choice: дочерью Моего народа
  rationale: Сохранён буквальный пророческий образ, выражающий близость и заветную связь; его смысл пояснён в сноске.
theological_decisions:
- issue: Передача пророческого выражения בַּת עַמִּי
  choice: дочерью Моего народа
  alternative: Моим народом; дорогим Мне народом
  rationale: Буквальный семейный образ сохраняет эмоциональную и заветную напряжённость текста, а не заменяет её более гладким толкованием.
- issue: Сила риторического вопроса כִּי אֵיךְ אֶעֱשֶׂה
  choice: ведь как иначе Мне поступить
  alternative: ведь что ещё Мне делать; ведь как Мне поступить
  rationale: Избранный вариант передаёт риторическую обусловленность суда испорченностью народа, но не добавляет учения о внешнем ограничении Божьей воли.
- issue: Временной аспект הִנְנִי צוֹרְפָם וּבְחַנְתִּים
  choice: Вот, Я переплавляю их и испытываю
  alternative: Вот, Я переплавлю их и испытаю
  rationale: Настоящее время следует причастной конструкции после הִנְנִי и сохраняет живую непосредственность провозглашённого действия; возможное будущее понимание отмечено как аспектуальная альтернатива в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Металлургическая метафора и непривычный семейный образ сохранены; синтаксис вопроса сделан естественным для широкого читателя. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
