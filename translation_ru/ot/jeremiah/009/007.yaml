base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/007.yaml
  text: Their tongue is a slaughtering arrow[a]; it speaks deceit. With his mouth each man speaks peace to his neighbor[c][b], but within himself he sets his ambush.
translation:
  language: ru
  text: Их язык — стрела, несущая смерть[a]; он изрекает ложь. Устами каждый говорит ближнему мирные слова[b], а внутри себя устраивает засаду[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «смертоносная стрела» или «разящая стрела». Еврейское слово образовано от глагола «закалывать, убивать» и подчёркивает смертоносный характер, а не просто остроту.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «говорит мир своему ближнему», то есть обращается к нему мирно и дружелюбно, скрывая злой замысел.'
    reason: cultural_note
  - marker: c
    text: 'Возможные переводы: «устраивает свою засаду» или «внутри него устраивает засаду». Тот, против кого она направлена, в еврейском тексте прямо не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵץ שוחט
  choice: стрела, несущая смерть
  rationale: Сохраняет образ стрелы и передаёт причастие от שחט как указание на смертоносное назначение, а не только на остроту.
- source_word: לשונם
  choice: их язык
  rationale: Коллективное единственное число естественно звучит по-русски и сохраняет общее обвинение.
- source_word: מרמה דבר
  choice: он говорит обман
  rationale: Мужской род местоимения соответствует слову «язык»; настоящее время передаёт обычное, повторяющееся поведение. «Обман» непосредственно отражает מרמה.
- source_word: בפיו
  choice: устами
  rationale: Естественная для литературного русского инструментальная форма, подчёркивающая противопоставление внешней речи внутреннему намерению.
- source_word: שלום את רעהו ידבר
  choice: каждый говорит ближнему мирные слова
  rationale: Добавленное «каждый» выражает переход еврейского текста к единственному числу; «мирные слова» естественно передаёт идиому «говорить мир» без сведения שלום лишь к приветствию.
- source_word: ובקרבו
  choice: а внутри себя
  rationale: Ясно сохраняет контраст между устами и внутренним замыслом.
- source_word: ישים ארבו
  choice: устраивает засаду
  rationale: Идиоматично передаёт сочетание שים с существительным «засада»; цель засады, не названная в еврейском тексте, не добавляется.
