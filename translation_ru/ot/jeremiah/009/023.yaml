source:
  edition: WLC
  text: כִּ֣י אִם בְּ/זֹ֞את יִתְהַלֵּ֣ל הַ/מִּתְהַלֵּ֗ל הַשְׂכֵּל֮ וְ/יָדֹ֣עַ אוֹתִ/י֒ כִּ֚י אֲנִ֣י יְהוָ֔ה עֹ֥שֶׂה חֶ֛סֶד מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָ֑רֶץ כִּֽי בְ/אֵ֥לֶּה חָפַ֖צְתִּי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/023.yaml
  text: 'But let the one who boasts boast in this: that he understands and knows me[a], that I am Yahweh, who practices steadfast love, justice, and righteousness in the earth; for in these I delight[b], declares Yahweh.'
translation:
  language: ru
  text: 'Но пусть хвалящийся хвалится тем, что он понимает и знает Меня: что Я — Яхве, являющий неизменную любовь[a], правосудие и праведность на земле[b], ибо в этом Я нахожу радость, — возвещает Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское חֶסֶד может также передаваться словами «милость», «преданная любовь» или «верность завету»; здесь оно обозначает любовь, отличающуюся постоянством и верностью.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в стране». Еврейское אֶרֶץ может означать как землю вообще, так и определённую страну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Но
  rationale: В контексте противопоставления предыдущим запретам хвалиться мудростью, силой и богатством оборот вводит единственно достойное основание для похвалы.
- source_word: יִתְהַלֵּל / הַמִּתְהַלֵּל
  choice: хвалящийся пусть хвалится
  rationale: Сохранён намеренный повтор одного и того же еврейского корня и обобщённое значение единственного числа.
- source_word: הַשְׂכֵּל וְיָדֹעַ אוֹתִי
  choice: понимает и знает Меня
  rationale: Передаёт сочетание постижения с личным, отношенческим знанием Бога, не сводя ידע к простому обладанию сведениями.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя передано транслитерацией, а не заменено титулом; форма «Яхве» привычна в современной русской библеистической речи.
- source_word: עֹשֶׂה
  choice: проявляющий / вершащий / утверждающий
  rationale: Один широкий еврейский глагол естественно распределён по трём русским сочетаниям; причастная конструкция сохраняет характеристику постоянной деятельности Яхве.
- source_word: חֶסֶד
  choice: неизменную любовь
  rationale: Передаёт одновременно любовь и её устойчивую, верную направленность; возможные оттенки милости и заветной верности отмечены в сноске.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В данной триаде слово обозначает справедливое решение и управление, а не только отдельный приговор или акт суда.
- source_word: צְדָקָה
  choice: праведность
  rationale: Сохранено отличие от מִשְׁפָּט и нравственно-реляционный характер понятия.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: Выбран широкий смысл אֶרֶץ, соответствующий общему утверждению о деятельности и характере Яхве; локальное значение «в стране» остаётся возможным.
- source_word: כִּי בְאֵלֶּה חָפַצְתִּי
  choice: ибо это Мне угодно
  rationale: Естественно по-русски передаёт удовольствие и благоволение, выраженные חפץ, сохраняя причинную связь.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Объём значения בָּאָרֶץ
  choice: на земле
  alternative: в стране
  rationale: Широкое прочтение естественно в утверждении о характерной деятельности Яхве, но еврейское אֶרֶץ допускает и более узкое указание на конкретную страну, что отражено в сноске.
- issue: Характер знания Бога в וְיָדֹעַ אוֹתִי
  choice: знает Меня
  alternative: признаёт Меня
  rationale: Прямая формулировка сохраняет как познавательный, так и личностный смысл ידע, не ограничивая его одной лишь формой признания.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Повтор «хвалящийся пусть хвалится» намеренно сохранён. Развёртывание одного עֹשֶׂה тремя сочетаемыми русскими глаголами устраняет неестественные словосочетания, не меняя трёхчастной структуры высказывания.
