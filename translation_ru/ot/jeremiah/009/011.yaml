id: JER.9.11
reference: Jeremiah 9:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מִֽי הָ/אִ֤ישׁ הֶֽ/חָכָם֙ וְ/יָבֵ֣ן אֶת זֹ֔את וַ/אֲשֶׁ֨ר דִּבֶּ֧ר פִּֽי יְהוָ֛ה אֵלָ֖י/ו וְ/יַגִּדָ֑/הּ עַל מָה֙ אָבְדָ֣ה הָ/אָ֔רֶץ נִצְּתָ֥ה כַ/מִּדְבָּ֖ר מִ/בְּלִ֖י עֹבֵֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/011.yaml
  text: Who is the wise man who can understand this? To whom has the mouth of Yahweh spoken[a], that he may declare it? Why has the land perished, laid waste like the wilderness[c][b], with no one passing through?
translation:
  language: ru
  text: Кто этот мудрый человек, способный понять это? И кому говорили уста Яхве[a], чтобы он возвестил, почему погибла[b] земля, опустошённая[c], словно пустыня, без единого прохожего?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Уста Яхве» — пророческий оборот, обозначающий непосредственную речь Яхве.
    reason: cultural_note
  - marker: b
    text: 'Или: «пришла в запустение», «разорена».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «выжженная».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הָאִישׁ הֶחָכָם וְיָבֵן אֶת־זֹאת
  choice: Кто тот мудрый человек, который способен понять это?
  rationale: Сохранены мужской род единственного числа и вопрос о человеке, способном постичь происходящее. «Способен понять» передаёт возможный модальный оттенок имперфекта וְיָבֵן.
- source_word: וַאֲשֶׁר דִּבֶּר פִּי יְהוָה אֵלָיו
  choice: И к кому обращались уста Яхве
  rationale: Буквальный образ «уста Яхве» сохранён как значимый пророческий оборот прямой божественной речи; множественное согласование естественно для русского слова «уста».
- source_word: וְיַגִּדָהּ
  choice: чтобы он возвестил
  rationale: Глагол в породе хифиль означает сообщить или сделать известным; «возвестил» соответствует публичному и пророческому регистру. Местоименный суффикс передан через последующее изъяснение после двоеточия.
- source_word: עַל־מָה אָבְדָה הָאָרֶץ
  choice: почему погибла земля
  rationale: עַל־מָה естественно передаётся вопросом «почему», а אָבְדָה допускает значения гибели и разорения. Основной вариант сохраняет сильную и торжественную формулировку оригинала.
- source_word: נִצְּתָה כַמִּדְבָּר
  choice: опустошённая, словно пустыня
  rationale: Контекст подчёркивает запустение земли. «Опустошённая» не сужает значение до буквального пожара, тогда как примечание сохраняет возможное значение «выжженная».
- source_word: מִבְּלִי עֹבֵר
  choice: так что никто по ней не проходит
  rationale: Передано полное отсутствие проходящих через землю; добавленное «по ней» естественно указывает на землю как место движения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; форма «Яхве» сохраняет личное имя Бога и не подменяет его титулом.
- issue: Антропоморфный оборот פִּי יְהוָה
  choice: уста Яхве
  alternative: Яхве говорил
  rationale: Сохранение образа подчёркивает непосредственность божественной речи и не сглаживает пророческую идиому.
- issue: Мужской род в הָאִישׁ הֶחָכָם
  choice: мудрый человек
  alternative: мудрец; мудрый
  rationale: Формулировка сохраняет явно выраженное существительное «человек» и мужской род оригинала, не придавая ему лишнего специального значения звания «мудрец».
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис разделён на два вопроса для ясности, но связь между получившим откровение и призванным объяснить бедствие сохранена. Подлинная лексическая неоднозначность אָבְדָה и נִצְּתָה отражена в примечаниях.
