  to: Они пошли за упрямством своего сердца и за Ваалами, служению которым научили их отцы[a].
  rationale: Заменено «как научили их отцы» на «служению которым научили их отцы». Это сохраняет относительную связь с «Ваалами» и передаёт подразумеваемый в еврейском тексте предмет обучения. Слово «служение» — минимально необходимое для русского управления раскрытие, не навязывающее конкретной формы культа. Остальные элементы точно и естественно передают повтор «за… и за…», единственное число «сердца», множественное число «Ваалы» и буквальное «отцы».
