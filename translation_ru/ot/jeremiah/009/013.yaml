base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/013.yaml
  text: They went after the stubbornness of their heart and after the Baals[a], which their fathers taught them.
translation:
  language: ru
  text: Они пошли за упрямством своего сердца и за Ваалами, служению которым научили их отцы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предки». Буквально: «отцы»; здесь имеются в виду прежние поколения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: пошли за
  rationale: Сочетание הלך с אַחֲרֵי означает «идти за, следовать». Перевод сохраняет образ движения и выражает приверженность.
- source_word: שְׁרִרוּת
  choice: упрямством
  rationale: В книге Иеремии слово обозначает своевольное упорство, отказ повиноваться; «упрямство» ясно передаёт этот нравственный смысл.
- source_word: לִבָּם
  choice: своего сердца
  rationale: В еврейском тексте «сердце» стоит в единственном числе при множественном обладателе и собирательно обозначает внутреннюю волю народа. Эта форма сохранена и по-русски.
- source_word: וְאַחֲרֵי
  choice: и за
  rationale: Повтор предлога сохраняет параллелизм двух объектов, за которыми пошёл народ.
- source_word: הַבְּעָלִים
  choice: Ваалами
  rationale: Множественное число указывает на местные проявления или культовые образы ханаанского божества Ваала, а не на нарицательное «господа».
- source_word: אֲשֶׁר לִמְּדוּם אֲבוֹתָם
  choice: как научили их отцы
  rationale: Буквальная конструкция с относительным אֲשֶׁר и глаголом «научили их» по смыслу указывает на усвоенный от прежних поколений образ следования Ваалам. «Как научили» естественно передаёт подразумеваемое действие, не уточняя сверх текста, чему именно учили.
- source_word: אֲבוֹתָם
  choice: их отцы
  rationale: Сохранено буквальное мужское множественное число исходного текста; более широкое значение «предки, прежние поколения» отмечено в сноске.
theological_decisions:
- issue: Передача אֲבוֹתָם
  choice: их отцы
  alternative: их предки
  rationale: Основной текст сохраняет буквальное «отцы» и не нейтрализует грамматический род, тогда как контекстуально возможный более широкий смысл вынесен в сноску.
- issue: Синтаксическая связь אֲשֶׁר לִמְּדוּם с Ваалами
  choice: как научили их отцы
  alternative: которым научили их отцы / следовать которым научили их отцы
  rationale: В еврейской фразе буквально сказано «которые/как научили их отцы», причём предмет обучения подразумевается. Выбранный вариант сохраняет эту сжатость и не добавляет прямо отсутствующее слово «поклоняться» или «следовать».
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, библейски достойным звучанием. Повтор «за… и за…» и единственное число «сердца» сохраняют риторическую форму еврейского текста; «как научили» устраняет неестественную для русского двусмысленность конструкции без догматического уточнения.
