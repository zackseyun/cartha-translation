  register: Современный литературный русский с достоинством пророческой поэзии. Строки организованы как плач; сохранены образность, параллелизм и усиление двух заключительных глаголов. Архаизмы сведены к минимуму, но выражение «птицы небесные» оставлено как прозрачный поэтический образ.
