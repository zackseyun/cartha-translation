base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/009.yaml
  text: Over the mountains I will lift up weeping and wailing[a], and over the pastures of the wilderness a lament, because they are laid waste so that no man passes through, and they do not hear the sound of livestock. From the birds of the heavens to the beasts, they have fled[c][b]; they are gone.
translation:
  language: ru
  text: 'Над горами подниму я плач и рыдание,

    над пастбищами пустыни — скорбную песнь,

    потому что они выжжены[a]: никто там не проходит,

    и не слышно голоса скота.

    От птиц небесных до животных —

    все разбежались, ушли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опустошены». Еврейский глагол может обозначать разорение вообще, хотя, вероятно, здесь присутствует образ выжженной земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: подниму я
  rationale: Глагол נשׂא буквально означает «поднимать, нести»; в сочетании с обозначениями плача передаёт идиому «поднять плач». Постпозиция местоимения сохраняет поэтическое звучание и подчёркивает говорящего.
- source_word: בְכִי וָנֶהִי
  choice: плач и рыдание
  rationale: Два близких существительных передают усиленное выражение скорби. «Рыдание» отличает נֶהִי от следующего קִינָה.
- source_word: נְאוֹת מִדְבָּר
  choice: пастбища в степи
  rationale: נְאוֹת обозначает пастбища, места выпаса; מִדְבָּר здесь — незаселённая степная местность, а не обязательно песчаная пустыня.
- source_word: קִינָה
  choice: скорбная песнь
  rationale: Слово обозначает погребальный или траурный плач, особую песнь скорби. Такой перевод понятен современному читателю и отличает термин от общего «плача» в первой строке.
- source_word: נִצְּתוּ
  choice: выжжены
  rationale: Пассивная форма передаёт опустошение с вероятным образом пожара. «Выжжены» сохраняет конкретность образа, не утверждая непременно полного сгорания.
- source_word: מִבְּלִי אִישׁ עֹבֵר
  choice: никто там не проходит
  rationale: אִישׁ употреблено обобщённо, поэтому естественное русское «никто» точно передаёт полное безлюдье.
- source_word: וְלֹא שָׁמְעוּ קוֹל מִקְנֶה
  choice: и не слышно голоса скота
  rationale: Безличная русская конструкция естественно передаёт отсутствие каких-либо звуков домашнего скота и не создаёт неясного местоименного субъекта.
- source_word: מֵעוֹף הַשָּׁמַיִם וְעַד בְּהֵמָה
  choice: От птиц небесных до зверей — все
  rationale: Конструкция «от… до…» охватывает весь диапазон живых существ. «Птицы небесные» сохраняет традиционный и буквальный образ, а «звери» здесь обозначают наземных животных вообще.
- source_word: נָדְדוּ הָלָכוּ
  choice: разбежались, ушли
  rationale: Два последовательных глагола усиливают картину исчезновения животных. Оба сохранены, но переданы без тяжеловесной буквальной тавтологии.
