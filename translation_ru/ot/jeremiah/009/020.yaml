base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/020.yaml
  text: For death has climbed in through our windows[a]; it has entered our palaces, to cut off the child from outside[b], the young men from the streets.
translation:
  language: ru
  text: Ибо смерть взобралась к нам через окна, вошла в наши дворцы, чтобы истребить ребёнка на улице, юношей — на улицах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на площадях». Еврейское слово обозначает широкие общественные пространства города — площади или улицы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим призывом к плачу и естественно звучит по-русски.
- source_word: עָלָה מָוֶת בְּחַלּוֹנֵינוּ
  choice: смерть поднялась к нашим окнам
  rationale: Сохраняет олицетворение смерти и буквальный образ подъёма к окнам; последующее «вошла» ясно указывает на проникновение внутрь.
- source_word: בָּא בְּאַרְמְנוֹתֵינוּ
  choice: вошла в наши дворцы
  rationale: Передаёт вторжение смерти даже в защищённые или знатные жилища; «дворцы» — прозрачный эквивалент אַרְמוֹנוֹת.
- source_word: לְהַכְרִית
  choice: чтобы истребить
  rationale: В данном контексте русского «отрезать» недостаточно ясно; «истребить» передаёт причинение смерти и резкость еврейского глагола.
- source_word: עוֹלָל
  choice: детей
  rationale: Хотя форма единственного числа, существительное употреблено собирательно и параллельно множественному «юношей»; слово обозначает малых детей.
- source_word: מִחוּץ
  choice: на улице
  rationale: В этом поэтическом параллелизме обозначает открытое пространство вне домов; по-русски «истребить детей снаружи» звучало бы неестественно.
- source_word: בַּחוּרִים
  choice: юношей
  rationale: Точно и кратко обозначает молодых мужчин.
- source_word: מֵרְחֹבוֹת
  choice: на площадях
  rationale: רְחֹבוֹת часто означает широкие городские пространства или площади; этот вариант сохраняет отличие от более общего חוּץ.
