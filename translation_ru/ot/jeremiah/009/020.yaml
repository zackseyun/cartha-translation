  to: Ибо смерть взобралась к нам через окна, вошла в наши дворцы, чтобы истребить ребёнка на улице, юношей — на улицах[a].
  rationale: 'Исправлен глагольный образ: смерть не просто подходит к окнам, а проникает через них. Сохранено единственное число «ребёнка» для עוֹלָל; контекст при этом не исключает собирательного смысла. Основным соответствием рְחֹבוֹת выбраны «улицы», а вариант «площади» перенесён в сноску. Сноска привязана к слову, которое она поясняет.'
