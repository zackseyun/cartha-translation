    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעֲרֵי
  choice: ворота
  rationale: Форма сопряжённого множественного числа от שַׁעַר означает «ворота, врата»; «ворота» естественно и точно передаёт конкретный образ сооружения.
- source_word: הַנְּהָרוֹת
  choice: рек
  rationale: Обычное значение множественного числа от נָהָר — «реки». Возможное указание на каналы Ниневии сохранено в примечании, а не внесено в основной текст.
- source_word: נִפְתָּחוּ
  choice: распахнуты
  rationale: Нифаль, перфект, 3-е лицо множественного числа передаёт состояние или событие открытия. «Распахнуты» сохраняет пассивный смысл и усиливает присущую контексту картину внезапного прорыва, не уточняя действующее лицо.
- source_word: הַהֵיכָל
  choice: дворец
  rationale: הֵיכָל может означать дворец или храм. В пророчестве о падении Ниневии контекст вероятнее указывает на царский дворец.
- source_word: נָמוֹג
  choice: тает
  rationale: Глагол выражает таяние, растворение или утрату устойчивости. Буквальное метафорическое «тает» сохраняет яркость и допускает как физическое разрушение, так и образ полного распада.
theological_decisions:
- issue: Значение הֵיכָל
  choice: дворец
  alternative: храм
  rationale: Контекст падения Ниневии благоприятствует значению «дворец», однако лексическая неоднозначность не устраняется и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческого повествования. Метафора «дворец тает» сохранена без рационализирующего пояснения; лексические неоднозначности вынесены в сноски.
