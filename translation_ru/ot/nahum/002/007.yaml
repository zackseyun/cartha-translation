base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/007.yaml
  text: The gates of the rivers are opened[b][a], and the palace melts away.
translation:
  language: ru
  text: Ворота рек[a] открыты, и дворец[b] тает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ворота каналов», если речь идёт не о реках в обычном смысле, а о водных сооружениях Ниневии.'
    reason: lexical_alternative
  - marker: b
