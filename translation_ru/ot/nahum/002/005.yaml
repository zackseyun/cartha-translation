  rationale: В городском контексте חוּצוֹת естественно обозначает улицы; это соответствует параллельному упоминанию площадей.
- source_word: יִתְהוֹלְלוּ
  choice: бешено мчатся
  rationale: Форма глагола передаёт неистовое, безудержное движение; выражение сохраняет как скорость, так и оттенок исступления.
- source_word: הָרֶכֶב
  choice: колесницы
  rationale: Единственное число имеет собирательное значение и обозначает множество боевых колесниц.
- source_word: יִשְׁתַּקְשְׁקוּן
  choice: с грохотом несутся
  rationale: Редкий, вероятно звукоподражательный глагол сочетает представление о шуме, тряске и стремительном движении.
- source_word: בָּרְחֹבוֹת
  choice: по площадям
  rationale: רְחֹבוֹת — широкие городские пространства, площади; современное русское слово точно передаёт обстановку.
- source_word: מַרְאֵיהֶן
  choice: вид их
  rationale: Краткое и естественное соответствие существительному со значением видимого облика.
- source_word: כַּלַּפִּידִם
  choice: словно факелы
  rationale: לַפִּידִים обозначает горящие факелы или огненные головни; «факелы» сохраняет ясный зрительный образ.
- source_word: כַּבְּרָקִים
  choice: словно молнии
  rationale: Множественное число передаёт образ отдельных вспышек молнии и согласуется с множеством колесниц.
- source_word: יְרוֹצֵצוּ
  choice: мечутся туда и сюда
  rationale: Глагол описывает быстрое движение в разных направлениях; выражение сохраняет динамику и повторность движения.
