  text: In the streets the chariots race wildly[a]; they rattle through the squares. Their appearance is like torches[c][b]; like lightning they dart about.
translation:
  language: ru
  text: По улицам бешено мчатся колесницы[a], с грохотом несутся по площадям[b]. Вид их — словно факелы; словно молнии, они мечутся туда и сюда[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неистово носятся»; еврейский глагол может обозначать исступлённое, почти безумное поведение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «грохочут по площадям»; редкий еврейский глагол, вероятно, звукоподражательный и подчёркивает шумное, тряское движение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «стремительно носятся туда и сюда»; еврейский глагол передаёт быстрое движение в разных направлениях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּצוֹת
