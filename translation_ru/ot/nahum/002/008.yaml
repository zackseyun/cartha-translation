base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/008.yaml
  text: 'It is fixed: she is stripped bare[a], she is carried away; and her servant girls are led off, moaning like the sound of doves[b], beating on their hearts.'
translation:
  language: ru
  text: 'Решено: она обнажена[a], уведена прочь; её рабынь уводят, они стонут, подобно голубиному воркованию, и бьют себя в грудь[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «раскрыта» или «изгнана». Еврейский текст труден и может соединять образы унижения и насильственного переселения.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «ударяют по своим сердцам»; вероятно, имеется в виду обычный жест скорби — удары в грудь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֻצַּב
  choice: Решено
  rationale: Форма трудна и допускает разные толкования. Безличное «решено» передаёт мысль о том, что участь определена, не превращая выражение в явно юридическое «постановлено» и не принимая слово за имя собственное.
- source_word: גֻּלְּתָה
  choice: она обнажена
  rationale: Пассивная форма от גלה может обозначать обнажение, раскрытие или изгнание. «Обнажена» сохраняет образ унижения и не дублирует последующее описание увода.
- source_word: הֹעֲלָתָה
  choice: уведена прочь
  rationale: Хофаль от עלה здесь передаёт принудительное перемещение. «Уведена прочь» естественно звучит в сцене пленения, хотя буквальное направление «поднята/выведена вверх» в переводе не выражено.
- source_word: אַמְהֹתֶיהָ
  choice: её рабыни
  rationale: אָמָה обозначает женщину в подневольном положении; «рабыни» точнее сохраняет её социальный статус, чем смягчённое «служанки».
- source_word: מְנַהֲגוֹת
  choice: уводят
  rationale: Форма описывает женщин как ведомых или гонимых. Неопределённо-личная конструкция по-русски естественно передаёт пассивный смысл.
- source_word: כְּקוֹל יוֹנִים
  choice: словно голубки
  rationale: Буквально сказано «как голос/звук голубей». В русском сравнении «стонут, словно голубки» слуховой образ ясен без тяжеловесного «подобно звуку голубей».
- source_word: מְתֹפְפֹת עַל לִבְבֵהֶן
  choice: бьют себя в грудь
  rationale: Буквальный образ — ритмически ударять «по своим сердцам». Русское выражение «бить себя в грудь» естественно передаёт телесный жест скорби; буквальная формулировка сохранена в сноске.
