  rationale: 'Исправлена передача синтаксиса: «ходил» относится к льву, тогда как «там были» относится ко львице и львёнку. Это точнее отражает порядок и число еврейского текста, сохраняя его образность, риторический тон и лексическую неоднозначность לָבִיא. Маркер первой сноски перенесён к выражению, которое она поясняет.'
