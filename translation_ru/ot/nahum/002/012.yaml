base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/012.yaml
  text: Where is the lions’ den[a], the feeding place of the young lions, where the lion and lioness walked, where the lion’s cub was[b], with none to make them afraid?
translation:
  language: ru
  text: Где логово львов — место кормления[a] молодых львов, где ходил лев, где были львица[b] и львёнок, и никто не пугал их?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пастбище для молодых львов». Еврейское слово может обозначать пастбище или место кормления; здесь оно метафорически включено в образ львов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «могучий лев». Еврейское слово לָבִיא допускает разные обозначения льва; в данном контексте «львица» хорошо соответствует ряду: лев, львица и львёнок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Где
  rationale: Вопросительное наречие места открывает насмешливый вопрос о павшей Ниневии; в русском настоящая связка не требуется.
- source_word: מְעוֹן אֲרָיוֹת
  choice: логово львов
  rationale: «Логово» естественно передаёт жилище в рамках развёрнутого образа львов.
- source_word: וּמִרְעֶה הוּא לַכְּפִרִים
  choice: и место кормления молодых львов
  rationale: מִרְעֶה может означать пастбище или место кормления; здесь последнее сохраняет смысл, не создавая впечатления, будто львы пасутся. הוּא естественно включено в именную конструкцию.
- source_word: אֲשֶׁר הָלַךְ
  choice: где ходили
  rationale: Относительное слово имеет здесь местное значение; нейтральное «ходили» не усиливает исходный глагол значением «рыскали».
- source_word: אַרְיֵה לָבִיא
  choice: лев и львица
  rationale: В контексте семейной группы львов לָבִיא естественно понимать как львицу, сохраняя при этом альтернативу в сноске.
- source_word: גּוּר אַרְיֵה
  choice: львёнок
  rationale: Сочетание обозначает детёныша льва; обычное русское слово кратко и ясно передаёт образ.
- source_word: וְאֵין מַחֲרִיד
  choice: и никто их не пугал
  rationale: Причастная конструкция выражает отсутствие того, кто наводил бы страх; прошедшее время согласовано с описанием исчезнувшего логова.
theological_decisions:
- issue: Неоднозначное значение לָבִיא
  choice: львица
  alternative: могучий лев
  rationale: Последовательность «лев — львица — львёнок» лучше всего соответствует изображению безопасного львиного семейства, однако лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий риторический вопрос сохраняет насмешливо-трагический тон пророчества. Формулировки понятны без специальной библейской лексики, а повтор «где» передаёт пространственную структуру еврейской строки.
