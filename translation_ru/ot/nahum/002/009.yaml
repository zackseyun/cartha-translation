base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/009.yaml
  text: Nineveh has been like a pool of water from her earliest days[a], yet they are fleeing[b]. “Stop! Stop!”—but no one turns back.
translation:
  language: ru
  text: Ниневия была словно водоём с давних пор[a], но они бегут. «Стойте! Стойте!»[b] — но никто не оборачивается.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со дней, как она [существует]»; речь может идти обо всём давнем прошлом Ниневии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Остановитесь! Остановитесь!» Буквально: «Стойте! Стойте!»; в сцене бегства приказ призывает бегущих остановиться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִינְוֵה
  choice: Ниневия
  rationale: Общепринятая русская форма названия города.
- source_word: כִבְרֵכַת מַיִם
  choice: словно водоём
  rationale: Сохраняет образ собранной массы воды, не уточняя без достаточных оснований, был ли это пруд, бассейн или искусственное водохранилище.
- source_word: מִימֵי הִיא
  choice: с давних пор
  rationale: Естественно передаёт смысл трудного буквального оборота «со дней, как она [существует]», указывающего на давнее состояние Ниневии.
- source_word: וְהֵמָּה נָסִים
  choice: но они бегут
  rationale: Местоимение с причастием изображает продолжающееся бегство; «но» передаёт контраст с прежним устойчивым состоянием города, а неопределённое «они» сохраняет лаконичность оригинала.
- source_word: עִמְדוּ עֲמֹדוּ
  choice: Стойте! Стойте!
  rationale: Повтор повелительной формы сохранён; русское «Стойте!» естественно звучит как срочный приказ остановиться и одновременно сохраняет основной смысл глагола.
- source_word: וְאֵין מַפְנֶה
  choice: но никто не оборачивается
  rationale: Личная конструкция естественно передаёт отсутствие отклика на призыв и не добавляет более узкого значения «смотрит назад» или «возвращается».
