id: NAM.2.1
reference: Nahum 2:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הִנֵּ֨ה עַל הֶ/הָרִ֜ים רַגְלֵ֤י מְבַשֵּׂר֙ מַשְׁמִ֣יעַ שָׁל֔וֹם חָגִּ֧י יְהוּדָ֛ה חַגַּ֖יִ/ךְ שַׁלְּמִ֣י נְדָרָ֑יִ/ךְ כִּי֩ לֹ֨א יוֹסִ֥יף ע֛וֹד ל/עבור בָּ֥/ךְ בְּלִיַּ֖עַל כֻּלֹּ֥/ה נִכְרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/001.yaml
  text: Look[a], on the mountains are the feet of one who brings good news, who announces peace. Celebrate your festivals, Judah; fulfill your vows[b], for the worthless one will never again pass through you; he is completely cut off.
translation:
  language: ru
  text: 'Вот, на горах — ноги того, кто несёт добрую весть[a], кто возвещает мир. Празднуй свои праздники, Иуда, исполняй свои обеты, потому что нечестивец[b] больше никогда не пройдёт через тебя: он окончательно уничтожен.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ноги вестника доброй вести».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «негодяй»; традиционно: «Велиал».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательную и привлекающую внимание силу частицы естественным для современного русского языка способом.
- source_word: עַל הֶהָרִים
  choice: на горах
  rationale: Сохраняет прямое пространственное значение предлога и существительного, а также возвышенный образ приближающегося вестника.
- source_word: רַגְלֵי מְבַשֵּׂר
  choice: ноги того, кто несёт добрую весть
  rationale: Сохраняет конкретный образ ног и передаёт причастие через ясную современную конструкцию, не сводя выражение к отвлечённому сообщению.
- source_word: מַשְׁמִיעַ שָׁלוֹם
  choice: кто возвещает мир
  rationale: Форма Hiphil глагола שמע означает «давать услышать, объявлять»; «возвещает» сохраняет торжественный характер речи вестника.
- source_word: חָגִּי ... חַגַּיִךְ
  choice: празднуй свои праздники
  rationale: Передаёт повеление возобновить священные праздничные торжества; намеренный корневой повтор звучит по-русски понятно и соответствует еврейскому выражению.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Устоявшаяся русская библейская форма названия страны и народа; женский род повелительных форм отражает грамматику обращения в еврейском тексте.
- source_word: שַׁלְּמִי נְדָרָיִךְ
  choice: исполняй свои обеты
  rationale: Еврейская идиома буквально связана с уплатой или завершением обета; «исполняй» естественно передаёт выполнение принятого религиозного обязательства.
- source_word: בְּלִיַּעַל
  choice: негодный
  rationale: Субстантивированное прилагательное сохраняет описательный смысл «негодный, порочный» и не превращает слово без достаточных оснований в имя демонического существа.
- source_word: לֹא יוֹסִיף עוֹד לַעֲבוֹר בָּךְ
  choice: больше никогда не пройдёт через тебя
  rationale: Передаёт усиленное отрицание повторного прохождения; «через тебя» сохраняет образ вражеского движения по земле Иуды, не заменяя его толкованием «вторгнется».
- source_word: כֻּלֹּה נִכְרָת
  choice: он полностью истреблён
  rationale: Передаёт завершённость и всеохватность отсечения врага в естественной русской формулировке.
theological_decisions:
- issue: Следует ли понимать בְּלִיַּעַל как имя собственное «Велиал» или как описательное обозначение врага
  choice: Описательное обозначение «негодный» в основном тексте
  alternative: «нечестивец»; традиционно — «Велиал»
  rationale: В данном пророческом контексте слово естественно обозначает порочного, ни к чему не годного врага. Описательный перевод не вносит в текст более позднее представление о личном демоническом существе, а традиционная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены конкретный образ ног вестника, прямое обращение к Иуде в женском роде и напряжение между описательным и традиционно именным пониманием בְּלִיַּעַל.
