base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/004.yaml
  text: The shield of his mighty men is red[a]; the men of valor are clothed in scarlet. The chariots flash with the fire of steel on the day of his preparation[b], and the cypress spears are brandished.
translation:
  language: ru
  text: Щит его могучих воинов красен; доблестные воины одеты в багряное. Колесницы сверкают огнём стали[a] в день его приготовлений, и копья с кипарисовыми древками потрясаются[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «колесницы объяты огнём стали». Еврейское выражение трудно для истолкования; возможно, речь идёт об огненном блеске металлических деталей или клинков колесниц.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «кипарисы потрясаются». Вероятно, «кипарисы» метонимически обозначают копья или древки, изготовленные из кипарисовой древесины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָגֵן
  choice: щит
  rationale: Обычное военное значение слова; «щит» — естественный и точный современный русский эквивалент.
- source_word: גִּבֹּרֵיהוּ
  choice: его могучих воинов
  rationale: Передаёт и воинский смысл גִּבּוֹר, и местоименный суффикс «его», не уточняя, к кому именно он относится.
- source_word: מְאָדָּם
  choice: окрашен в красное
  rationale: 'Сохраняет пассивно-результативный оттенок формы: щит сделан красным или выглядит покрасневшим.'
- source_word: אַנְשֵׁי חַיִל
  choice: доблестные воины
  rationale: Естественно передаёт устойчивое обозначение способных и отважных бойцов.
- source_word: מְתֻלָּעִים
  choice: одеты в багряное
  rationale: Слово связано с багряной или червлёной окраской; по отношению к воинам контекст подразумевает одежду.
- source_word: בְּאֵשׁ פְּלָדוֹת
  choice: сверкают огнём стали
  rationale: Трудное выражение передано как образ огненного блеска металлических частей колесниц; неопределённость отмечена в сноске.
- source_word: הָרֶכֶב
  choice: колесницы
  rationale: Собирательное обозначение боевых колесниц естественно передаётся русским множественным числом.
- source_word: בְּיוֹם הֲכִינוֹ
  choice: в день, когда он готовится к бою
  rationale: Передаёт временное значение конструкции и местоименный суффикс, не называя явно его референта; «к бою» следует военному контексту.
- source_word: וְהַבְּרֹשִׁים
  choice: копья с кипарисовыми древками
  rationale: Буквально речь идёт о «кипарисах», но в военном контексте дерево, вероятно, метонимически обозначает изготовленные из него древки или копья.
- source_word: הָרְעָלוּ
  choice: потрясаются
  rationale: Редкая и трудная форма, вероятно, описывает сотрясение или размахивание оружием; нейтральное «потрясаются» сохраняет пассивную форму и образ движения.
