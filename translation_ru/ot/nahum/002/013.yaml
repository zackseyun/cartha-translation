  source_fidelity: В целом сохранены львиный образ, адресаты действий («львята», «львицы») и различие между טֶרֶף («добыча») и טְרֵפָה («растерзанное мясо»). Однако וַיְמַלֵּא — форма wayyiqtol, естественно передающая последующее завершённое действие; «он наполнял» неоправданно размывает этот сдвиг. Неявное дополнение при «душил» в русском лучше восстановить местоимением, не добавляя нового смысла.
  naturalness: 'Сочетание «терзал добычу — вдоволь для своих львят» несколько тяжеловесно и синтаксически неясно: «вдоволь» может восприниматься как характеристика самого льва, а не меры добычи. Формулировка «сколько нужно было его львятам» яснее и сохраняет количественный оттенок בְּדֵי. «Душил её для своих львиц» звучит по-русски естественнее, чем абсолютное «душил для своих львиц».'
