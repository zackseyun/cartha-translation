base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/013.yaml
  text: The lion tore enough for his cubs and strangled prey for his lionesses[b][a]; he filled his dens with prey and his lairs with torn flesh.
translation:
  language: ru
  text: Лев раздирал добычу, сколько нужно было его львятам, и душил её для своих львиц; он наполнил свои логова добычей, а свои убежища — растерзанным мясом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейские причастия «раздирал» и «душил» могут передавать как продолжающееся или привычное действие, так и живо изображённое действие без точного указания времени.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אַרְיֵה
  choice: Лев
  rationale: Определённый образ льва представляет Ниневию или Ассирию; буквальный зоологический образ сохранён без истолковывающей подстановки.
- source_word: טֹרֵף בְּדֵי
  choice: терзал добычу — вдоволь
  rationale: Причастие от טרף передаёт разрывание добычи, а בְּדֵי — достаточность; тире позволяет ясно связать меру с потребностями львят.
- source_word: גֹרוֹתָיו
  choice: своих львят
  rationale: Современное и точное обозначение детёнышей льва.
- source_word: וּמְחַנֵּק
  choice: и душил
  rationale: Сохранено буквальное значение חנק. Дополнение «добычу» не повторяется, поскольку оно естественно подразумевается из первой части строки.
- source_word: לְלִבְאֹתָיו
  choice: для своих львиц
  rationale: Прямо сохраняет зоологический смысл и параллелизм с львятами.
- source_word: וַיְמַלֵּא
  choice: он наполнял
  rationale: Несовершенный вид по-русски согласуется с описанием привычного, продолжающегося хищничества, выраженного также предшествующими причастиями.
- source_word: טֶרֶף
  choice: добычей
  rationale: Сохраняет образ львиной охоты и одновременно допускает подразумеваемую связь с военной добычей.
- source_word: חֹרָיו
  choice: свои логова
  rationale: Естественное русское название звериных укрытий в контексте львиного образа.
- source_word: וּמְעֹנֹתָיו
  choice: свои убежища
  rationale: Сохраняет отличие от חֹרָיו и широкое значение «места обитания, укрытия».
- source_word: טְרֵפָה
  choice: растерзанным мясом
  rationale: Передаёт результат разрывания и сохраняет поэтическое лексическое различие с טֶרֶף «добыча».
theological_decisions:
- issue: Метафорический образ льва применительно к Ассирии/Ниневии
  choice: Львиный образ сохранён буквально, без прямого называния политического референта.
  alternative: 'Передать смысл толкованием: царь Ассирии грабил ради своих подданных.'
  rationale: Еврейский текст строит насмешливое пророческое описание посредством развёрнутой метафоры; её раскрытие внутри перевода устранило бы поэтическую многозначность.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной пророческой образностью. Синтаксический параллелизм и различие между «добычей» и «растерзанным мясом» сохранены; архаизмы устранены.
