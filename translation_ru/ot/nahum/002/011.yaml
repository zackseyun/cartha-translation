  naturalness: «Разорение, опустошение, разрушение!» сохраняет краткий ударный ритм и более естественно звучит в современном литературном русском. «Дрожь во всём теле» ясно передаёт телесное потрясение; «лица у всех изменились» сохраняет намеренную сдержанность там, где еврейский оборот труден.
