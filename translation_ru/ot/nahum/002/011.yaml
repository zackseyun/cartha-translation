base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/011.yaml
  text: Devastation[a], desolation, and destruction! Hearts melt, knees give way, anguish is in every waist, and all their faces grow pale.
translation:
  language: ru
  text: Разорение, опустошение, разрушение! Сердца тают, колени подгибаются, дрожь во всём теле, и лица у всех изменились[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лица всех их собрали мрак». Значение последнего еврейского слова неясно; выражение может описывать потемневшие, побледневшие или иным образом изменившиеся лица.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוּקָה וּמְבוּקָה וּמְבֻלָּקָה
  choice: Пустота, опустошение и разорение
  rationale: Три близких по смыслу слова переданы краткой нарастающей триадой. «Пустота» сохраняет основной образ первого слова, а «опустошение» и «разорение» выражают усиление полного разгрома; точное звуковое созвучие еврейского текста по-русски невоспроизводимо без смысловых потерь.
- source_word: לֵב נָמֵס
  choice: Сердца тают
  rationale: Сохранена яркая еврейская метафора страха и утраты мужества; множественное число естественно передаёт собирательное значение единственного числа в контексте.
- source_word: פִק בִּרְכַּיִם
  choice: колени подгибаются
  rationale: Современное русское выражение естественно описывает физическую слабость и потерю устойчивости от ужаса.
- source_word: חַלְחָלָה בְּכָל מָתְנַיִם
  choice: дрожь охватывает всё тело
  rationale: חַלְחָלָה обозначает дрожь, содрогание или мучительное корчение, а מָתְנַיִם — поясницу или чресла. Перевод передаёт телесную реакцию страха ясным современным языком, не используя архаичное «чресла».
- source_word: וּפְנֵי כֻלָּם קִבְּצוּ פָארוּר
  choice: лица у всех меняются от ужаса
  rationale: Еврейское выражение трудно для точного истолкования и, вероятно, описывает резкое изменение цвета или вида лица от страха. Более общее выражение сохраняет неоднозначность, а буквальный образ отмечен в сноске.
