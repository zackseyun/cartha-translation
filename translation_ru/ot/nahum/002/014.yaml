base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/014.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will burn your chariots in smoke; the sword will devour your young lions. I will cut off your prey from the earth[c][b], and the voice of your messengers will no longer be heard.
translation:
  language: ru
  text: Вот, Я — против тебя, — возвещает Яхве Воинств, — и Я сожгу в дыму твои колесницы[a], и меч пожрёт твоих молодых львов[b]. Я истреблю добычу твою с земли, и больше не будет слышен голос твоих посланников[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обращу в дым твои колесницы». Еврейское выражение может указывать как на сопровождающий горение дым, так и на результат сожжения.'
    reason: lexical_alternative
  - marker: b
    text: «Молодые львы» продолжают образ львов, связанный с Ниневией; вероятно, так метафорически названы её воины или правители.
    reason: cultural_note
  - marker: c
    text: 'Или: «послов». Еврейское слово может обозначать людей, отправленных с официальным поручением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: Вот, Я — против тебя
  rationale: Сохраняет торжественную пророческую формулу привлечения внимания и ясно передаёт враждебное значение אֵלַיִךְ в данном контексте.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Яхве Воинств
  rationale: «Возвещает» передаёт формулу пророческого изречения נְאֻם; имя Яхве воспроизводит יהוה, а «Воинств» сохраняет традиционно понятный смысл צְבָאוֹת.
- source_word: וְהִבְעַרְתִּי בֶעָשָׁן רִכְבָּהּ
  choice: Я сожгу в дыму твои колесницы
  rationale: «Сожгу» передаёт каузативное уничтожение огнём; собирательное רִכְבָּהּ естественно выражено множественным числом. Неоднозначность בֶעָשָׁן отмечена в сноске.
- source_word: וּכְפִירַיִךְ תֹּאכַל חָרֶב
  choice: меч пожрёт твоих молодых львов
  rationale: Сохранены олицетворение меча и продолжающийся в контексте образ львов, без замены метафоры её предполагаемым толкованием.
- source_word: וְהִכְרַתִּי מֵאֶרֶץ טַרְפֵּךְ
  choice: Я истреблю добычу твою с земли
  rationale: «Истреблю» естественно передаёт удаление и прекращение, выраженные Hiphil глагола כרת; «добыча» сохраняет хищнический образ טֶרֶף.
- source_word: וְלֹא יִשָּׁמַע עוֹד קוֹל מַלְאָכֵכֵה
  choice: и больше не будет слышен голос твоих посланников
  rationale: Пассивная конструкция и окончательность עוֹד сохранены; מַלְאָךְ в политико-военном контексте означает человеческого посланника или вестника.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо содержит тетраграмматон; передача «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Образ «молодых львов»
  choice: сохранить буквальную метафору
  alternative: воины или правители
  rationale: Контекст допускает отнесение образа к ассирийским воинам либо властителям, но сам текст сохраняет львиную образность; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Архаизмы сведены к минимуму; инверсия «добычу твою» использована умеренно ради ритма и достоинства речи. Все метафоры исходного текста сохранены.
