base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/002.yaml
  text: A scatterer has come up against your face[a]. Guard the fortress; watch the road; strengthen your loins[c][b]; muster your strength greatly.
translation:
  language: ru
  text: Поднялся против тебя разрушитель[a]. Охраняй крепость[b], следи за дорогой, укрепи чресла, собери все свои силы!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассеиватель», «сокрушитель»; еврейское слово может обозначать того, кто рассеивает или разбивает.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «укрепление»; еврейское существительное может обозначать укреплённое место, а возможно, также осадное или оборонительное сооружение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: поднялся
  rationale: Перфект передаёт наступление врага как уже начавшееся или ставшее непосредственной реальностью; «поднялся» сохраняет обычный военный оттенок глагола עלה.
- source_word: מֵפִיץ
  choice: разрушитель
  rationale: Причастное существительное обозначает того, кто рассеивает либо сокрушает. «Разрушитель» естественно по-русски передаёт губительную силу, не сужая образ до одного способа нападения; варианты отмечены в сноске.
- source_word: עַל־פָּנַיִךְ
  choice: против тебя
  rationale: Буквально «на/против твоего лица»; в контексте это прямое выступление против Ниневии. Естественный русский оборот передаёт смысл без неясной кальки.
- source_word: נָצוֹר מְצֻרָה
  choice: охраняй крепость
  rationale: Императив требует оборонительных действий; מְצֻרָה может обозначать укреплённое место, а также укрепление или осадное сооружение. Контекст последовательности приказов поддерживает «крепость».
- source_word: צַפֵּה דֶרֶךְ
  choice: следи за дорогой
  rationale: Краткий военный приказ наблюдать за путём, по которому приближается враг.
- source_word: חַזֵּק מָתְנַיִם
  choice: препояшь чресла
  rationale: Передаёт телесный образ решительной подготовки к действию. «Препояшь» естественнее в русском библейском регистре, чем буквальное «укрепи», хотя слегка идиоматизирует выражение.
- source_word: אַמֵּץ כֹּחַ מְאֹד
  choice: собери все свои силы
  rationale: Передаёт активное напряжение и усиление мощи; «все» естественно выражает интенсивность מְאֹד в русском языке.
