translation_notes:
  register: Современный литературный русский с краткими, энергичными военными повелениями и умеренно возвышенным пророческим звучанием. Архаизирующий оборот «препояшь чресла» сохранён как понятный библейский образ решительной готовности; адресат передан в единственном числе женского рода по еврейской форме, относящейся к Ниневии.
