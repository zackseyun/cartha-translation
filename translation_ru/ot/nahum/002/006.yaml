  yaml_path: translation/ot/nahum/002/006.yaml
  text: He summons his nobles; they stumble in their march. They hurry to her wall, and the siege shelter is set up.
translation:
  language: ru
  text: Он призывает своих вельмож; они спотыкаются на ходу. Они спешат к её стене, и осадный навес установлен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִזְכֹּר
  choice: созывает
  rationale: Буквально глагол означает «вспоминает», но в военном контексте может передавать смысл призыва или созыва подчинённых; такой перевод естественно связывает первую строку с последующим поспешным движением к стене.
- source_word: אַדִּירָיו
  choice: своих знатных воинов
  rationale: Слово обозначает могущественных или знатных людей; в данном военном контексте речь, вероятно, о высокопоставленных бойцах или военачальниках. Формулировка сохраняет оба оттенка.
- source_word: בַּהֲלִיכוֹתָם
  choice: на ходу
  rationale: Форма означает «в их хождении/движении»; русское «на ходу» кратко и естественно передаёт происходящее во время их продвижения.
- source_word: הַסֹּכֵךְ
  choice: осадное укрытие
  rationale: Редкое существительное связано с покрытием или защитным сооружением; в сцене штурма стены вероятен защитный навес для осаждающих, но точный вид устройства неясен.
theological_decisions:
- issue: Не назван субъект, созывающий воинов
  choice: сохранить мужское местоимение «он» без уточнения личности
  alternative: назвать царя или военачальника
  rationale: Еврейский текст не называет действующее лицо в самом стихе; уточнение преждевременно устранило бы контекстуальную неоднозначность.
- issue: Принадлежность стены, обозначенная местоименным суффиксом женского рода
  choice: «к её стене»
  alternative: «к городской стене» или назвать Ниневию
  rationale: Источник использует женский суффикс, вероятно относящийся к городу; местоимение сохраняет форму и не добавляет явного имени.
translation_notes:
  register: Современный литературный русский язык с военной образностью и сжатым пророческим ритмом. Редкое «осадное укрытие» выбрано вместо чрезмерно конкретных терминов вроде «таран» или «щитовой навес», поскольку точная конструкция не установлена.
