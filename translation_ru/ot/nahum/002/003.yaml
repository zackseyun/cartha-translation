  text: כִּ֣י שָׁ֤ב יְהוָה֙ אֶת גְּא֣וֹן יַעֲקֹ֔ב כִּ/גְא֖וֹן יִשְׂרָאֵ֑ל כִּ֤י בְקָקוּ/ם֙ בֹּֽקְקִ֔ים וּ/זְמֹרֵי/הֶ֖ם שִׁחֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/003.yaml
  text: For Yahweh is restoring the majesty of Jacob like the majesty of Israel[c][b][a], though destroyers have destroyed them and ruined their vine branches.
translation:
  language: ru
  text: Ибо Яхве восстанавливает величие Иакова, подобное величию Израиля[a][b], хотя опустошители опустошили их[c] и погубили их виноградные ветви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «восстановил» либо «восстановит»; еврейская глагольная форма может выражать пророческую уверенность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гордость Иакова, как гордость Израиля».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «опустошители опустошили их»; однокоренная конструкция подчёркивает полноту разорения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: восстанавливает
  rationale: Форма qatal глагола שׁוב допускает завершённое действие и пророчески достоверное будущее; настоящее время передаёт живую уверенность пророчества, не сводя смысл только к прошлому.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не замена его титулом.
- source_word: גְּאוֹן
  choice: величие
  rationale: В данном благоприятном контексте слово обозначает достоинство, великолепие или величие, а не обязательно греховную гордость.
- source_word: כִּ/גְאוֹן יִשְׂרָאֵל
  choice: подобное величию Израиля
  rationale: Префикс כ передан как сравнительный; согласование «подобное» естественно связывает оборот с «величие Иакова».
- source_word: בְקָקוּם ... בֹּקְקִים
  choice: опустошители опустошили их
  rationale: Однокоренная конструкция сохранена ради усиления и поэтического звучания; בקק означает опустошать, разорять, лишать содержимого.
- source_word: וּזְמֹרֵיהֶם
  choice: их виноградные ветви
  rationale: זְמוֹרָה обозначает ветвь или побег виноградной лозы, поэтому конкретный земледельческий образ сохранён.
- source_word: שִׁחֵתוּ
  choice: погубили
  rationale: Порода piel выражает причинение порчи, разорение или уничтожение; «погубили» естественно сочетается с образом виноградных ветвей.
theological_decisions:
- issue: Значение גְּאוֹן применительно к Иакову и Израилю
  choice: положительное величие и достоинство, восстанавливаемые Богом
  alternative: гордость Иакова, как гордость Израиля
  rationale: Благоприятное действие Яхве в контексте восстановления указывает на положительный оттенок, однако лексическая возможность перевода «гордость» отмечена в сноске.
- issue: Временное значение שָׁב
  choice: настоящее время с оттенком совершающегося или пророчески достоверного восстановления
  alternative: «восстановил» или «восстановит»
  rationale: Еврейская форма сама по себе допускает несколько контекстуальных временных прочтений; перевод не должен превращать это в жёсткое догматическое утверждение о хронологии.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены личное имя Яхве, параллелизм Иакова и Израиля, а также виноградарский образ. Однокоренный оборот «опустошители опустошили» намеренно слегка маркирован как поэтический и отражает форму еврейского текста.
