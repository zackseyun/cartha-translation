source:
  edition: WLC
  text: בֹּ֥זּוּ כֶ֖סֶף בֹּ֣זּוּ זָהָ֑ב וְ/אֵ֥ין קֵ֨צֶה֙ לַ/תְּכוּנָ֔ה כָּבֹ֕ד מִ/כֹּ֖ל כְּלִ֥י חֶמְדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/010.yaml
  text: Plunder silver! Plunder gold! There is no end to the treasure[b][a], an abundance of every precious thing.
translation:
  language: ru
  text: Расхищайте серебро! Расхищайте золото! Нет конца сокровищам[a] — несметное множество всяких драгоценных вещей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «запасам». Редкое еврейское слово может подчёркивать накопленные припасы или хранившиеся богатства.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всевозможных драгоценных сосудов (предметов)». Еврейское слово имеет широкий смысл и может обозначать сосуд, утварь, изделие или вообще ценную вещь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּזּוּ
  choice: Расхищайте!
  rationale: Форма повелительного наклонения множественного числа от בזז выражает приказ захватить имущество как военную добычу. Повтор сохранён ради настойчивости и поэтической силы.
- source_word: כֶסֶף
  choice: серебро
  rationale: В параллели с золотом речь идёт о драгоценном металле, а не о деньгах вообще.
- source_word: זָהָב
  choice: золото
  rationale: Прямое соответствие еврейскому слову и естественная пара к «серебру».
- source_word: וְאֵין קֵצֶה
  choice: Нет конца
  rationale: Естественно передаёт отрицательную конструкцию со значением отсутствия предела.
- source_word: תְּכוּנָה
  choice: сокровищам
  rationale: Редкое существительное в данном контексте обозначает накопленные ценности или запасы. «Сокровища» ясно передаёт смысл богатств, а более буквальная возможность «запасы» отмечена в сноске.
- source_word: כָּבֹד
  choice: несметное множество
  rationale: В контексте материальных ценностей слово, обычно связанное с весом, славой или великолепием, указывает на внушительное изобилие. Такое выражение естественно по-русски и не вводит отвлечённого значения «слава».
- source_word: מִכֹּל כְּלִי חֶמְדָּה
  choice: всяких драгоценных вещей
  rationale: כְּלִי может обозначать сосуд, предмет, утварь или изделие, а חֶמְדָּה — нечто желанное и ценное. Обобщённый перевод соответствует контексту разнообразной добычи; более конкретный вариант отражён в сноске.
