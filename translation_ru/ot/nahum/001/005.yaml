  text: הָרִים֙ רָעֲשׁ֣וּ מִמֶּ֔/נּוּ וְ/הַ/גְּבָע֖וֹת הִתְמֹגָ֑גוּ וַ/תִּשָּׂ֤א הָ/אָ֨רֶץ֙ מִ/פָּנָ֔י/ו וְ/תֵבֵ֖ל וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/005.yaml
  text: The mountains quake before him[a], and the hills melt away; the earth rises up before his face[b], the world and all who dwell in it.
translation:
  language: ru
  text: Горы содрогаются перед Ним[a], и холмы тают; пред лицом Его вздымается земля[b] — обитаемый мир и все живущие в нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Него», «из-за Него».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поднимается», «приходит в волнение». Еврейский глагол может передавать поднятие или вздымание земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים רָעֲשׁוּ
  choice: Горы содрогаются
  rationale: רעש обозначает сильное дрожание или сотрясение; «содрогаются» естественно передаёт сейсмический образ и реакцию творения на Божье явление.
- source_word: מִמֶּנּוּ
  choice: перед Ним
  rationale: Буквально предлог может означать «от Него»; в контексте теофании он выражает вызванную Его присутствием реакцию. В сноске сохранена причинно-исходная возможность.
- source_word: הַגְּבָעוֹת הִתְמֹגָגוּ
  choice: холмы тают
  rationale: Форма Hitpael от מוג передаёт таяние, растворение или утрату устойчивости; буквальный яркий образ сохранён без поясняющей парафразы.
- source_word: וַתִּשָּׂא הָאָרֶץ
  choice: вздымается земля
  rationale: נשׂא выражает поднятие или вознесение; «вздымается» передаёт движение земли вверх в картине космического потрясения и сохраняет лексическую неоднозначность.
- source_word: מִפָּנָיו
  choice: пред лицом Его
  rationale: Сохранён буквальный антропоморфный оборот «от/пред Его лицом», естественный для возвышенного русского регистра.
- source_word: תֵבֵל
  choice: обитаемый мир
  rationale: תבל обозначает устроенный, населённый мир; уточнение «обитаемый» отличает это слово от более общего הָאָרֶץ и поддерживает связь со всеми живущими в нём.
- source_word: וְכָל יֹשְׁבֵי בָהּ
  choice: и все живущие в нём
  rationale: Причастная конструкция прямо обозначает всех обитателей мира; формулировка ясна, современна и сохраняет возвышенный тон.
theological_decisions:
- issue: Космическая образность Божьего явления и суда
  choice: Сохранить прямую картину того, как горы, холмы и вся земля реагируют на Божье присутствие.
  alternative: Истолковать описание исключительно как метафору политических потрясений.
  rationale: Контекст изображает явление Господа в гневе и величии. Перевод не ослабляет космические образы, но и не навязывает сверх текста способ их буквального осуществления.
- issue: Антропоморфное выражение מִפָּנָיו
  choice: пред лицом Его
  alternative: перед Ним; в Его присутствии
  rationale: Буквальный образ Божьего лица богословски значим как обозначение непосредственного присутствия и не требует сглаживания в русском тексте.
translation_notes:
  register: Современный литературный русский с достоинством пророческой поэзии. Инверсия «пред лицом Его» сохраняет торжественный ритм и еврейский образ, не переходя в архаическую грамматику. Тире представляет «обитаемый мир» как поясняющее расширение слова «земля» и делает координацию естественной по-русски.
