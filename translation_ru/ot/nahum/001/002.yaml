  text: אֵ֣ל קַנּ֤וֹא וְ/נֹקֵם֙ יְהוָ֔ה נֹקֵ֥ם יְהוָ֖ה וּ/בַ֣עַל חֵמָ֑ה נֹקֵ֤ם יְהוָה֙ לְ/צָרָ֔י/ו וְ/נוֹטֵ֥ר ה֖וּא לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/002.yaml
  text: Yahweh is a jealous and avenging God[a]; Yahweh is avenging and full of wrath. Yahweh takes vengeance on his adversaries[c][b], and he keeps wrath for his enemies.
translation:
  language: ru
  text: Яхве — Бог ревнивый[a] и мстящий; Яхве мстит и исполнен гнева[b]. Яхве мстит Своим противникам и хранит гнев для Своих врагов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ревностный». Еврейское слово говорит о ревности Яхве, требующей исключительной верности Ему в отношениях завета.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «обладатель» или «господин гнева».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский текст прямо не называет, что именно Он хранит; возможно также: «хранит возмездие для Своих врагов».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֵל
  choice: Бог
  rationale: Существительное называет Яхве Богом и вместе с последующими определениями описывает Его; «Бог» естественно и без лишнего уточнения передаёт אֵל.
- source_word: קַנּוֹא
  choice: ревнивый
  rationale: Слово выражает ревностное требование исключительной верности в отношениях завета; «ревнивый» сохраняет эту библейскую напряжённость, тогда как «ревностный» может ослабить личностно-заветный оттенок.
- source_word: נֹקֵם / וְנֹקֵם
  choice: мстящий / мстит
  rationale: Причастие от נקם имеет деятельное значение. Повтор корня сохранён в трёхкратном «мстящий / мстит / мстит», чтобы передать настойчивость еврейского текста и не свести речь к общему наказанию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: וּבַעַל חֵמָה
  choice: и Он — Владыка ярости
  rationale: בעל буквально означает «владелец, господин». «Владыка ярости» сохраняет выразительную метафору обладания и власти, не представляя Божий гнев неконтролируемым; буквальная особенность пояснена сноской.
- source_word: חֵמָה
  choice: ярость
  rationale: В контексте суда слово обозначает сильный, пламенный гнев. «Ярость» передаёт интенсивность חֵמָה, тогда как общий «гнев» был бы слабее.
- source_word: לְצָרָיו
  choice: Своим противникам
  rationale: Предлог לְ отмечает объект возмездия, а צרים — тех, кто противостоит Яхве. Дательный падеж после «мстит» естественен для русского языка.
- source_word: וְנוֹטֵר
  choice: хранит гнев
  rationale: נטר может означать «хранить, удерживать»; объект в еврейском не выражен прямо, но параллелизм подразумевает сохраняемый гнев или возмездие. Добавление «гнев» делает русский текст понятным, не устраняя неоднозначности, отмеченной в сноске.
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение имеет подчёркивающую функцию; она сохранена явным «Он» во второй строке.
- source_word: לְאֹיְבָיו
  choice: для Своих врагов
  rationale: Предлог выражает, для кого удерживается гнев; «для» сохраняет оттенок того, что он оставлен врагам на будущее воздаяние.
theological_decisions:
- issue: Божественная ревность
  choice: «ревнивый» как требующий исключительной верности в завете
  alternative: «ревностный»
  rationale: Перевод сохраняет библейское утверждение о Божьей ревности, не сводя её к человеческой зависти и не смягчая до безличного усердия.
- issue: Божественное возмездие и ярость
  choice: Сохранить сильные слова «мстящий», «мстит» и «ярость»
  alternative: Смягчить до «наказывает» и «гневается»
  rationale: Трёхкратное נקם и существительное חֵמָה намеренно подчёркивают судебное воздаяние; смягчение устранило бы силу и богословское напряжение стиха.
- issue: Образ בַעַל חֵמָה
  choice: «Владыка ярости»
  alternative: «исполнен ярости»
  rationale: Более формальная передача сохраняет образ обладания/владычества и избегает возможного впечатления, будто ярость переполняет Бога или управляет Им.
- issue: Неявный объект וְנוֹטֵר
  choice: «хранит гнев» с указанием альтернативы в сноске
  alternative: «хранит возмездие» или оставить объект невыраженным
  rationale: По-русски переходное «хранит» требует дополнения; контекст позволяет восполнить «гнев», но поскольку еврейский текст не называет объект, альтернативный смысл честно отмечен.
translation_notes:
  register: Современный литературный русский с возвышенной, пророческой ритмикой. Инверсия в первой строке и трёхкратный повтор «мстящий / мстит / мстит» воспроизводят торжественную настойчивость оригинала. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции.
