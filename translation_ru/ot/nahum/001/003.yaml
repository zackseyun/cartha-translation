source:
  edition: WLC
  text: יְהֹוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ ו/גדול כֹּ֔חַ וְ/נַקֵּ֖ה לֹ֣א יְנַקֶּ֑ה יְהוָ֗ה בְּ/סוּפָ֤ה וּ/בִ/שְׂעָרָה֙ דַּרְכּ֔/וֹ וְ/עָנָ֖ן אֲבַ֥ק רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/003.yaml
  text: Yahweh is slow to anger and great in power[a], and he will by no means leave the guilty unpunished. Yahweh—his way is in the whirlwind and the storm, and clouds are the dust of his feet.
translation:
  language: ru
  text: Яхве не скор на гнев и велик силой; и виновного Он ни в коем случае не оставит без наказания.[a] Путь Яхве — в вихре и буре, и облако — пыль от Его ног.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более формально: «Он никак не оправдает» или «Он ни в коем случае не очистит [от вины]».'
    reason: Лексема נקה и усилительная конструкция допускают более буквальную судебную передачу; основной текст делает подразумеваемого виновного явным.
lexical_decisions:
- source_word: יְהֹוָה / יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом; форма «Яхве» общепринята в современной научной и переводческой практике.
- source_word: אֶרֶךְ אַפַּיִם
  choice: не скор на гнев
  rationale: Естественно передаёт еврейскую идиому «долгий ноздрями», то есть медленно гневающийся, терпеливый, сохраняя прямое упоминание гнева.
- source_word: וּגְדוֹל־כֹּחַ
  choice: и велик силой
  rationale: Близко следует сочетанию «великий силой/мощью» и сохраняет торжественный, но понятный русский регистр.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: но виновного Он ни в коем случае не оставит без наказания
  rationale: Передаёт усиленное отрицание инфинитивом абсолютным и подразумеваемый судебный объект. Союз «но» естественно подчёркивает напряжение между долготерпением и неотвратимостью суда.
- source_word: בְּסוּפָה וּבִשְׂעָרָה
  choice: в вихре и буре
  rationale: Сохраняет две близкие, но отдельные картины разрушительной непогоды и звучит естественно по-русски.
- source_word: דַּרְכּוֹ
  choice: Путь Яхве
  rationale: Прямо передаёт образ пути или шествия Яхве; перестройка именной фразы делает синтаксис ясным без устранения поэтической образности.
- source_word: וְעָנָן אֲבַק רַגְלָיו
  choice: и облако — пыль от Его ног
  rationale: Сохраняет грамматическое единственное число «облако» и метафору пыли, поднимающейся от ног в божественном шествии.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст дважды употребляет личное имя; транслитерация сохраняет это и не превращает имя в титул.
- issue: Сила судебного выражения וְנַקֵּה לֹא יְנַקֶּה
  choice: виновного Он ни в коем случае не оставит без наказания
  alternative: Он никак не оправдает
  rationale: Основной вариант ясно выражает усиленное отрицание и неотвратимость правосудия, не ослабляя при этом предшествующего утверждения о терпении Бога. Более формальный судебный вариант дан в сноске.
- issue: Связь терпения и суда
  choice: но
  alternative: и
  rationale: Еврейский ו допускает контекстуально-противительное прочтение. Русское «но» естественно выявляет уже присутствующее в параллельных утверждениях напряжение, не устраняя ни терпения, ни суда.
translation_notes:
  register: Современный литературный русский с умеренно торжественным поэтическим звучанием. Сохранены повтор имени Яхве, образы вихря, бури и пыли у ног, а также напряжение между долготерпением и неотвратимым судом.
