  - severity: medium
    issue: Неточная и неестественная формулировка второго варианта в сноске
    rationale: '«Он непременно не очистит от вины» не является нормативно естественной русской передачей emphatic negation и может быть понята двусмысленно. Следует: «Он ни в коем случае не очистит [от вины]» или «Он никак не оправдает».'
