  source_fidelity: 'В целом структура и образы переданы точно: море иссушается, все реки лишаются воды, а плодородные Башан, Кармил и цветение Ливана увядают. Однако «грозно повелевает морю» смещает גער от резкого укора/угрозы к прямому приказу и добавляет невыраженное наречие «грозно». Более близкое и естественное в этом поэтическом олицетворении «грозит морю».'
