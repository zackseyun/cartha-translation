  terminology: «Башан», «Кармил» и «Ливан» переданы последовательно и в принятой русской библейской форме. «Цвет Ливана» удачно сохраняет собирательный поэтический смысл פֶרַח. Сноску следует сформулировать без образа превращения рек именно «в сушу», который может подразумевать изменение их в земельные участки, а не их иссушение.
