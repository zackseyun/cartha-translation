base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/004.yaml
  text: He rebukes the sea and dries it up; he makes all the rivers run dry[a]. Bashan and Carmel wither; even the blossom of Lebanon withers.
translation:
  language: ru
  text: Он грозит морю — и иссушает его, иссушает и все реки[a]. Увядают Башан и Кармил, увядает цвет Ливана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иссушает все реки».'
    reason: 'Лексическая альтернатива: каузативная форма חרב может быть передана более прямо как «иссушает все реки».'
lexical_decisions:
- source_word: גּוֹעֵר
  choice: грозно повелевает
  rationale: Глагол выражает властный словесный окрик или укор. В отношении Божьей власти над морем сочетание «грозно повелевает» звучит естественно по-русски и сохраняет образ действенного приказа.
- source_word: בַּיָּם
  choice: морю
  rationale: Определённое единственное число передано как нарицательное «море»; оснований превращать его в имя собственное нет.
- source_word: וַיַּבְּשֵׁהוּ
  choice: иссушает его
  rationale: Суффикс мужского рода отсылает к морю, а глагол обозначает приведение в сухое состояние.
- source_word: וְכָל הַנְּהָרוֹת הֶחֱרִיב
  choice: иссушает и все реки
  rationale: 'Порода hифиль глагола חרב здесь имеет каузативный смысл: Бог делает реки сухими. Повтор «иссушает» сохраняет тесный параллелизм обеих строк.'
- source_word: אֻמְלַל
  choice: увядают / увядает
  rationale: В контексте плодородных областей и растительности глагол означает утрату свежести и жизненной силы; «увядать» точно передаёт этот образ.
- source_word: בָּשָׁן
  choice: Башан
  rationale: Традиционная русская передача географического названия плодородной области.
- source_word: וְכַרְמֶל
  choice: и Кармил
  rationale: Передано как географическое имя без добавления слова «гора», которого в еврейском тексте нет.
- source_word: וּפֶרַח לְבָנוֹן
  choice: цвет Ливана
  rationale: פֶרַח — цветок, цветение или цвет; поэтическое «цвет Ливана» сохраняет собирательность образа без добавочного усилительного слова.
theological_decisions:
- issue: Подлежащее при глаголах в стихе не выражено явно
  choice: «Он» как продолжение речи о Господе в предшествующем контексте
  alternative: Повторить «Господь»
  rationale: Формы третьего лица мужского рода получают подлежащее из Наум 1:2–3. Местоимение делает русскую фразу грамматически полной, не добавляя отсутствующего в данном стихе Божьего имени.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической дикцией. Повтор «иссушает» и «увядает» передаёт еврейский параллелизм; тире отмечает резкий переход от властного слова к его результату.
