base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/009.yaml
  text: What are you plotting against Yahweh? He will make a complete end[b][a]; trouble will not rise up a second time.
translation:
  language: ru
  text: Что вы замышляете против Яхве?[a] Он совершит полное уничтожение; бедствие не повторится.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что вы задумываете против Яхве?» Глагол может означать «думать», «задумывать» или «замышлять».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «бедствие не встанет дважды». Возможны также переводы: «бедствие не возникнет во второй раз» или «притеснение не повторится». Краткая еврейская фраза может говорить либо о новом нападении врага, либо о том, что суд не придётся повторять.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה תְּחַשְּׁבוּן
  choice: Что вы замышляете
  rationale: Вопросительное מַה передаётся прямо как «что», а глагол חשׁב в данном враждебном контексте означает обдумывать или замышлять. Формулировка сохраняет риторический характер вопроса.
- source_word: אֶל יְהוָה
  choice: против Яхве
  rationale: Предлог אֶל обычно указывает направление, но при глаголе замысла в контексте противостояния естественно передаётся как «против». Тетраграмматон передан личным именем «Яхве».
- source_word: כָּלָה הוּא עֹשֶׂה
  choice: Он положит этому полный конец
  rationale: כָּלָה обозначает завершение, полный конец, нередко уничтожение. Местоимение с причастием выражает решительное и несомненное действие; будущее время естественно для пророческого контекста. «Этому» делает русскую фразу связной, относя конец к враждебному замыслу или противостоянию, не уточняя объект уничтожения.
- source_word: לֹא תָקוּם פַּעֲמַיִם צָרָה
  choice: бедствие не постигнет дважды
  rationale: צָרָה может означать бедствие, скорбь или притеснение. Буквальное «не встанет дважды» по-русски неестественно; «не постигнет дважды» сохраняет смысл повторного наступления бедствия, не закрепляя однозначно, кого именно оно постигает.
theological_decisions:
- issue: Смысл и референт заключительной фразы
  choice: «бедствие не постигнет дважды» — решающий суд Яхве не потребуется повторять
  alternative: Враг не поднимется для второго нападения; либо бедствие не придёт к Божьему народу во второй раз
  rationale: Краткая еврейская формулировка не называет явно ни сторону, испытывающую бедствие, ни точный характер события. Перевод сохраняет эту неоднозначность и подчёркивает окончательность действия Яхве, не ограничивая смысл одной богословской трактовкой.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной пророческой интонацией. Синтаксис краткий и энергичный; личное имя «Яхве» сохранено. Необычный еврейский образ в последней строке передан естественной русской конструкцией, а буквальная форма и смысловая неоднозначность отмечены в сноске.
