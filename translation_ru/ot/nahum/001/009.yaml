  source_fidelity: Первая строка точно передаёт риторический вопрос и враждебный оттенок חשׁב с אֶל. Имя Яхве передано последовательно. Вторая строка верно выражает решительное завершительное действие כָּלָה הוּא עֹשֶׂה. В исходном русском варианте «этому» необоснованно задаёт объект действия, которого в еврейском тексте нет. В последней строке «бедствие не постигнет дважды» требует невыраженного адресата и несколько смещает образ; «не повторится» естественно передаёт отрицание повторности, оставляя референт бедствия открытым.
