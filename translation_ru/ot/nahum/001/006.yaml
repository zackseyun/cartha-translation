base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/006.yaml
  text: Who can stand before his indignation? And who can rise up in the heat of his anger? His wrath is poured out like fire[c][b][a], and the rocks are shattered by him.
translation:
  language: ru
  text: Кто устоит перед Его негодованием? Кто поднимется в пылу Его гнева? Ярость Его изливается, как огонь, и скалы сокрушаются от Него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скалы сокрушаются Им»; выражение «от Него» может указывать на источник, причину или действующее лицо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי זַעְמוֹ
  choice: перед Его негодованием
  rationale: לִפְנֵי естественно передаётся как «перед», а זַעַם обозначает сильный, в том числе нравственно обусловленный, гнев; «негодование» сохраняет этот оттенок.
- source_word: יַעֲמוֹד
  choice: устоит
  rationale: В риторическом вопросе глагол выражает способность остаться стоять и выдержать; русское «устоит» передаёт оба оттенка без добавочного модального слова.
- source_word: יָקוּם
  choice: поднимется
  rationale: קוּם буквально означает «встать, подняться». Выбор сохраняет отличие от עמד и поэтический параллелизм.
- source_word: בַּחֲרוֹן אַפּוֹ
  choice: при пылании Его гнева
  rationale: חֲרוֹן сохраняет образ жара или пылания гнева. Предлог ב допускает значение пребывания в обстоятельствах этого гнева; «при» звучит естественно и не устраняет образность.
- source_word: חֲמָתוֹ
  choice: ярость Его
  rationale: חֵמָה — сильный гнев, ярость. Отдельное слово сохраняет накопление различных еврейских обозначений гнева.
- source_word: נִתְּכָה כָאֵשׁ
  choice: изливается, как огонь
  rationale: Нифаль נתך в данном контексте означает «изливаться», а כָאֵשׁ вводит прямое сравнение с огнём.
- source_word: הַצֻּרִים נִתְּצוּ
  choice: скалы рушатся
  rationale: צוּר может означать скалу, утёс или каменную глыбу; «скалы» соответствует природно-космическому образу. נתץ обозначает разрушение или сокрушение; «рушатся» естественно передаёт пассивную форму в русском языке.
- source_word: מִמֶּנּוּ
  choice: от Него
  rationale: Предлог מִן может указывать как на источник, так и на причину или действующее лицо. «От Него» сохраняет эту смысловую открытость лучше, чем исключительно инструментальное «Им».
theological_decisions:
- issue: Различение обозначений Божьего гнева
  choice: «негодование», «гнев», «ярость»
  alternative: Повторять одно слово «гнев» либо усилить все выражения словами «ярость» и «неистовство»
  rationale: В еврейском тексте последовательно употреблены разные слова и образные выражения. Русское лексическое разнообразие сохраняет поэтическое нарастание, не сводя всё к одному понятию.
- issue: Сила риторических вопросов
  choice: «Кто устоит…? Кто поднимется…?»
  alternative: «Кто может устоять…? Кто может подняться…?» или «Кто выдержит…?»
  rationale: Русское будущее совершенного вида естественно выражает подразумеваемую невозможность выдержать Божий гнев, сохраняя форму риторических вопросов и различие двух еврейских глаголов.
- issue: Связь разрушения скал с Богом
  choice: «от Него»
  alternative: «Им», «из-за Него» или «пред Ним»
  rationale: Еврейское מִמֶּנּוּ допускает оттенки источника, причины и агентности. Формулировка «от Него» сохраняет напряжение между ними, не фиксируя единственное толкование.
translation_notes:
  register: Современный литературный русский язык с возвышенным пророческим звучанием. Синтаксис краткий и ритмичный; сохранены риторический параллелизм и три разных обозначения Божьего гнева. Местоимение, относящееся к Богу, написано с прописной буквы согласно русской библейской традиции.
