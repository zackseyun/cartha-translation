  text: An oracle concerning Nineveh[a]. The book of the vision of Nahum the Elkoshite.
translation:
  language: ru
  text: Пророческое изречение о Ниневии[a]. Книга видения Наума, елкосеянина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «Бремя Ниневии» или «Возвещение о Ниневии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: пророческое изречение
  rationale: В заголовках пророческих книг слово обозначает весомое пророческое возвещение, а не буквальную ношу. Такой перевод естественен по-русски и сохраняет пророческий характер текста.
- source_word: נִינְוֵה
  choice: Ниневия
  rationale: Принятая в русской библейской традиции форма названия города; контекст указывает, что изречение обращено против Ниневии или касается её.
- source_word: סֵפֶר
  choice: книга
  rationale: Прямое и естественное обозначение письменного произведения в данном заголовке.
- source_word: חֲזוֹן
  choice: видение
  rationale: Сохраняет обычное пророческое значение откровения, данного пророку, не уточняя сверх текста способ его получения.
- source_word: נַחוּם
  choice: Наум
  rationale: Традиционная русская форма личного имени пророка.
- source_word: הָאֶלְקֹשִׁי
  choice: елкосеянин
  rationale: Передаёт определённую форму обозначения человека по происхождению или связи с местом Елкос; не утверждает точнее, чем еврейский текст, характер этой связи.
theological_decisions:
- issue: Связь двух именных частей надписания
  choice: 'Передать как два кратких предложения-заголовка: «Пророческое изречение о Ниневии. Книга видения Наума, елкосеянина».'
  alternative: 'Объединить в один формальный заголовок: «Изречение о Ниневии, книга видения Наума, елкосеянина».'
  rationale: Еврейский текст допускает тесную связь частей, но их разделение сохраняет структуру надписания и делает русский текст яснее, не представляя Ниневию источником изречения.
- issue: Значение מַשָּׂא в пророческом заголовке
  choice: «пророческое изречение»
  alternative: «бремя» или «возвещение»
  rationale: «Бремя» сохраняет этимологический образ, но в современном русском может быть ошибочно понято буквально; основной вариант выражает жанровое значение, а подлинная лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием пророческого надписания. Традиционные формы имён сохранены; синтаксис сделан ясным без устранения лексической неоднозначности.
