source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם שְׁלֵמִים֙ וְ/כֵ֣ן רַבִּ֔ים וְ/כֵ֥ן נָגֹ֖זּוּ וְ/עָבָ֑ר וְ/עִ֨נִּתִ֔/ךְ לֹ֥א אֲעַנֵּ֖/ךְ עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/012.yaml
  text: 'Thus says the LORD: Though they are whole, and likewise many, even so they will be cut down and pass away. Though I have afflicted you, I will afflict you no more.'
translation:
  language: ru
  text: 'Так говорит ГОСПОДЬ: «Хотя они и в полной силе, и многочисленны, всё же будут скошены и исчезнут. Я причинял тебе страдания, но больше не буду причинять тебе страданий».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: сильны
  rationale: В данном контексте слово, буквально обозначающее целостность или полноту, вероятно, описывает невредимую, полную силу ассирийцев; «сильны» естественно передаёт смысл без внесения лишней конкретики.
- source_word: רַבִּים
  choice: многочисленны
  rationale: Передаёт значение множества применительно к людям или войску.
- source_word: נָגֹזּוּ
  choice: будут скошены
  rationale: Редкий глагол допускает образ срезания или остригания; «скошены» сохраняет образ внезапного уничтожения множества.
- source_word: וְעָבָר
  choice: и исчезнут
  rationale: Буквально «пройдёт/уйдёт»; в контексте гибели вражеской силы естественно передать как исчезновение.
- source_word: עִנִּתִךְ / אֲעַנֵּךְ
  choice: смирял тебя / смирять не буду
  rationale: Глагол ענה во II породе означает подвергать страданию, угнетать, смирять. «Смирять» сохраняет единство повторяющегося корня и допускает как наказание, так и причинённое бедствие.
theological_decisions:
- issue: К кому относятся местоимения третьего и второго лица
  choice: «они» относится к вражеской силе, а «тебя» — к Иудее; референты не названы в самом стихе
  alternative: Явно вставить «ассирийцы» и «Иуда»
  rationale: Грамматика и контекст поддерживают эти референты, но исходный текст оставляет их невыраженными; перевод сохраняет эту особенность.
- issue: Субъект причинённого Иудее бедствия
  choice: 'Сохранено первое лицо Бога: «Я смирял тебя»'
  alternative: 'Обезличить: «ты была в бедствии»'
  rationale: Еврейский текст прямо называет говорящего субъектом действия; эту богословскую напряжённость не следует сглаживать.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Имя יְהוָה передано принятой библейской формой «ГОСПОДЬ». Женский род местоимения второго лица в еврейском тексте по-русски явно не выражен, поскольку прошедшая форма «смирял» согласуется с говорящим, а инфинитив не маркирует адресата по роду.
