base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/011.yaml
  text: From you has come one who plots evil against Yahweh[a], a counselor of worthlessness.
translation:
  language: ru
  text: Из тебя вышел тот, кто замышляет зло против Яхве, — советник злодейства.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «советник Велиала», если בְּלִיָּעַל понимать как личное имя, а не как «злодейство».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֵּךְ
  choice: Из тебя
  rationale: Предлог מִן с суффиксом 2-го лица женского рода единственного числа указывает на источник или происхождение. «Из тебя» естественно передаёт появление человека из города или страны, к которым обращена речь.
- source_word: יָצָא
  choice: вышел
  rationale: Форма qatal описывает совершившееся действие; «вышел» сохраняет пространственный образ исхода из адресата и хорошо сочетается с «из тебя».
- source_word: חֹשֵׁב
  choice: тот, кто замышляет
  rationale: Причастие от חשׁב в данном враждебном контексте означает намеренно задумывать или замышлять; оборот сохраняет его субстантивированную функцию.
- source_word: עַל יְהוָה
  choice: против Яхве
  rationale: При обозначении злого умысла עַל имеет направленное, враждебное значение «против», а не нейтральное «о» или «касательно».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой современной русской транслитерацией, а не заменено титулом.
- source_word: רָעָה
  choice: зло
  rationale: Здесь слово обозначает злой, враждебный замысел; нравственное значение «зло» точнее, чем «бедствие» или нейтральный «вред».
- source_word: יֹעֵץ
  choice: советник
  rationale: Причастие употреблено как существительное и приложением характеризует того же человека; «советник» кратко сохраняет эту структуру.
- source_word: בְּלִיָּעַל
  choice: нечестия
  rationale: В еврейской Библии בְּלִיָּעַל обычно выражает негодность, порочность или нечестие, не обязательно являясь именем собственным. «Советник нечестия» сохраняет качественную характеристику и не привносит более позднюю персонификацию.
theological_decisions:
- issue: Значение בְּלִיָּעַל
  choice: 'Нарицательное значение: «нечестие»'
  alternative: Имяобразное «Велиал»; также возможно «негодность» или «порочность»
  rationale: Непосредственное древнееврейское словоупотребление допускает и поддерживает характеристику злого, негодного советника без обязательной ссылки на персонифицированное злое существо. Традиционная возможность прочитать слово как имя сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Тире подчёркивает приложение «советник нечестия». Маркер сноски поставлен непосредственно в основном тексте.
