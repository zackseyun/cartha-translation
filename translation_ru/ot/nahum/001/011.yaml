revisions:
- from: Из тебя вышел тот, кто замышляет зло против Яхве, — советник нечестия.[a]
  to: Из тебя вышел тот, кто замышляет зло против Яхве, — советник злодейства.[a]
  rationale: Исправление ограничено более естественной современной русской передачей בְּלִיָּעַל и стилистически ясной формулировкой сноски. Синтаксическое приложение, направленность зла против Яхве и нарицательное основное прочтение сохранены; вариант с Велиалом не утверждается как предпочтительный.
