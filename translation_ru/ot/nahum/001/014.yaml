source:
  edition: WLC
  text: וְ/צִוָּ֤ה עָלֶ֨י/ךָ֙ יְהוָ֔ה לֹֽא יִזָּרַ֥ע מִ/שִּׁמְ/ךָ֖ ע֑וֹד מִ/בֵּ֨ית אֱלֹהֶ֜י/ךָ אַכְרִ֨ית פֶּ֧סֶל וּ/מַסֵּכָ֛ה אָשִׂ֥ים קִבְרֶ֖/ךָ כִּ֥י קַלּֽוֹתָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/014.yaml
  text: 'Yahweh has commanded concerning you: No more will your name be sown[a]. From the house of your gods I will cut off carved image and cast image. I will make your grave[c][b], for you are contemptible.'
translation:
  language: ru
  text: 'Яхве повелел о тебе:


    «От твоего имени больше не будет посеяно потомства[a].


    Из дома твоих богов[b]

    Я истреблю резное изображение и литое изображение.


    Я приготовлю тебе могилу,

    ибо ты презрен[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от твоего имени больше не будет посеяно». Вероятно, имеется в виду, что имя адресата, его род или династия не продолжатся.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из храма твоего бога». Еврейскую форму можно буквально передать как «из дома твоих богов».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ибо ты ничтожен»; «ибо ты малозначителен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה עָלֶיךָ יְהוָה
  choice: Яхве повелел о тебе
  rationale: Совершенный вид передаёт уже изданное и остающееся в силе Божье повеление; «о тебе» сохраняет широкий смысл предлога עַל, не усиливая его до «против тебя».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: לֹא יִזָּרַע מִשִּׁמְךָ עוֹד
  choice: Имя твоё больше не будет посеяно
  rationale: Сохранён необычный земледельческий образ еврейского текста и его страдательная конструкция; вероятный смысл прекращения рода пояснён в сноске.
- source_word: מִבֵּית אֱלֹהֶיךָ
  choice: из дома твоих богов
  rationale: Сохранены буквальное «дом» и морфологически множественное «боги»; в данном контексте «дом» означает святилище или храм.
- source_word: אַכְרִית
  choice: истреблю
  rationale: Глагол כרת выражает решительное отсечение и уничтожение; «истреблю» естественно передаёт здесь судебную силу действия.
- source_word: פֶּסֶל וּמַסֵּכָה
  choice: резные и литые изваяния
  rationale: Переданы два разных способа изготовления культовых изображений — вырезание и отливка; множественное согласование делает русский текст естественным без изменения собирательного смысла.
- source_word: אָשִׂים קִבְרֶךָ
  choice: Я приготовлю тебе могилу
  rationale: Русская формулировка сохраняет краткость и угрозу смерти, естественно передавая идиоматическое сочетание «сделаю/устрою твою могилу».
- source_word: כִּי קַלּוֹתָ
  choice: ибо ты ничтожен
  rationale: Слово связано с представлением о лёгкости и потому может означать малозначительность, низость или презренность; «ничтожен» сохраняет и оценочный, и статусный оттенки.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Смысл образа «имя будет посеяно»
  choice: Сохранить метафору в основном тексте
  alternative: Твой род больше не продолжится; у тебя больше не будет потомков
  rationale: Еврейская формулировка допускает образное указание на прекращение имени, потомства или династии. Основной текст не сводит образ к одному толкованию, а сноска раскрывает вероятный смысл.
- issue: Число אֱלֹהֶיךָ
  choice: твоих богов
  alternative: твоего бога
  rationale: Форма морфологически множественная и в политеистическом контексте естественно обозначает множество божеств; возможное собирательное или единственное понимание отмечено в сноске.
- issue: Оценка в כִּי קַלּוֹתָ
  choice: ибо ты ничтожен
  alternative: ибо ты презрен; ибо ты малозначителен
  rationale: Сохранена смысловая напряжённость между нравственной презренностью и ничтожностью положения без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Синтаксис краток и строг; сохранены образ посева имени, храмовая лексика и резкость заключительного приговора. Архаизмы сведены к умеренному «ибо», уместному в возвышенной речи.
