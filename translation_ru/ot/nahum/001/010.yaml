lexical_decisions:
- source_word: כִּי עַד
  choice: И хотя
  rationale: 'Сжатое и трудное поэтическое сочетание передано уступительно: несмотря на спутанность и опьянение, их постигнет уничтожение. Иное понимание отмечено в сноске.'
- source_word: סִירִים סְבֻכִים
  choice: сплелись, словно колючки
  rationale: Сохраняет образ переплетённых колючих растений и естественно звучит по-русски применительно к подразумеваемым людям.
- source_word: וּכְסָבְאָם סְבוּאִים
  choice: упились своим хмельным питьём
  rationale: Передаёт внутреннюю игру слов, связанную с питьём и опьянением, не сводя выражение к более свободному образу «промокли от питья».
- source_word: אֻכְּלוּ
  choice: будут пожраны
  rationale: Пророческий перфект передан будущим временем как несомненно грядущий суд; глагол сохраняет сильное значение полного уничтожения.
- source_word: כְּקַשׁ יָבֵשׁ מָלֵא
  choice: как совершенно сухая стерня
  rationale: קשׁ обозначает сухие остатки стеблей; מָלֵא понято как усиление степени сухости. Образ подразумевает лёгкое и полное сгорание, не добавляя прямо отсутствующего в строке слова «огонь».
