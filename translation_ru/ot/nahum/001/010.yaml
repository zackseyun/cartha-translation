    issue: «Будут пожраны» чрезмерно конкретизирует אֻכְּלוּ.
    rationale: Пассив от «есть» в данном поэтическом контексте означает быть поглощёнными/уничтоженными; в русском «пожраны» обычно вызывает образ конкретного пожирателя, которого текст не называет.
  - severity: low
    issue: Сноска b стоит после заключительной фразы, хотя поясняет начальное «И хотя».
    rationale: Маркер следует поставить непосредственно после начальной уступительной конструкции.
  - severity: low
    issue: «Хмельным» добавляет признак, не выраженный отдельно в еврейском тексте.
    rationale: Смысл опьянения достаточно передаётся глаголом «упились», а «своим питьём» сохраняет трудную повторность исходного выражения.
