  text: וּ/בְ/שֶׁ֣טֶף עֹבֵ֔ר כָּלָ֖ה יַעֲשֶׂ֣ה מְקוֹמָ֑/הּ וְ/אֹיְבָ֖י/ו יְרַדֶּף חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/008.yaml
  text: But with an overwhelming flood he will make a complete end of its place[a], and darkness will pursue his enemies.
translation:
  language: ru
  text: Но всесокрушающим потоком Он полностью уничтожит её место[a], и тьма будет преследовать Его врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «её место». Суффикс женского рода, вероятно, указывает на олицетворённый город под судом — по контексту, Ниневию. При иной идентификации неявного референта возможно безличное: «его место»; такой перевод не сохраняет женский род еврейского суффикса.'
    reason: Неявный референт женского суффикса допускает различное понимание; основной текст сохраняет его грамматический род.
lexical_decisions:
- source_word: וּבְשֶׁטֶף עֹבֵר
  choice: Но всесокрушающим потоком
  rationale: וּ передаётся противительным «но» ввиду контраста со ст. 7; שֶׁטֶף עֹבֵר изображает разливающийся, всё сметающий поток. «Всесокрушающим» естественно выражает его неудержимую разрушительную силу.
- source_word: כָּלָה יַעֲשֶׂה
  choice: Он положит конец
  rationale: Сочетание буквально означает «сделает конец» и указывает на полное уничтожение. Русское «положит конец» идиоматично; абсолютный характер действия уже подчёркнут образом всесокрушающего потока.
- source_word: מְקוֹמָהּ
  choice: её месту
  rationale: Суффикс женского рода единственного числа сохранён; вероятнее всего, подразумевается олицетворённый город, по контексту Ниневия. Неявность антецедента отражена сноской.
- source_word: וְאֹיְבָיו
  choice: и Его врагов
  rationale: Суффикс мужского рода единственного числа естественно относится к Господу. Заглавная буква помогает русскому читателю распознать этот референт, не добавляя имени в основной текст.
- source_word: יְרַדֶּף
  choice: будет преследовать
  rationale: Порода piel глагола רדף имеет прямое значение «преследовать, гнаться за»; длительная русская форма сохраняет зловещую динамику образа.
- source_word: חֹשֶׁךְ
  choice: тьма
  rationale: Сохранён конкретный поэтический образ без истолковывающей добавки «суда» или «гибели».
theological_decisions:
- issue: Референты местоименных суффиксов в מְקוֹמָהּ и וְאֹיְבָיו
  choice: «её месту» относится к городу или враждебной силе, представленной в женском роде; «Его врагов» — к врагам Господа.
  alternative: «его/этого месту» при безличном понимании первого суффикса либо отнесение обоих суффиксов к одному референту.
  rationale: Еврейский текст намеренно или фактически переходит от суффикса женского рода к суффиксу мужского рода. Сохранение этой смены передаёт грамматику источника и не сглаживает возможную неоднозначность.
- issue: Субъект יַעֲשֶׂה
  choice: «Он» относится к Господу из ближайшего контекста.
  alternative: Повторить имя «Господь» для явности.
  rationale: В еврейском тексте субъект выражен формой глагола и определяется контекстом; местоимение сохраняет связность без эксплицирующей вставки.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Образы потока и тьмы сохранены без конфессионального истолкования; местоименная смена источника не сглажена.
