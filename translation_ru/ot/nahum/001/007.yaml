  source_fidelity: 'Текст точно передаёт структуру и смысл еврейского стиха: טוֹב — «Благ», личное имя יְהוָה — «Яхве», לְמָעוֹז — «твердыня», בְּיוֹם צָרָה — «в день бедствия», а חֹסֵי בוֹ — «тех, кто ищет в Нём убежища». Формула «ищет в Нём убежища» естественно выражает значение причастия חסה — обращаться за защитой, находить прибежище. «Знает» обоснованно сохраняет смысл ידע без излишнего толкования.'
