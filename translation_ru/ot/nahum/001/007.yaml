source:
  edition: WLC
  text: ט֣וֹב יְהוָ֔ה לְ/מָע֖וֹז בְּ/י֣וֹם צָרָ֑ה וְ/יֹדֵ֖עַ חֹ֥סֵי בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/007.yaml
  text: Yahweh is good[a], a stronghold in the day of distress[c][b]; he knows those who take refuge in him.
translation:
  language: ru
  text: Благ Яхве — твердыня в день бедствия[a]; Он знает тех, кто ищет в Нём убежища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в день скорби» или «в день беды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: благ
  rationale: Кратко и ёмко передаёт нравственную доброту и благотворность Яхве; форма «благ» сохраняет возвышенный, но понятный библейский регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: לְמָעוֹז
  choice: твердыня
  rationale: מָעוֹז обозначает укреплённое безопасное место. «Твердыня» сохраняет конкретный образ защиты и естественно выступает именной характеристикой Яхве.
- source_word: בְּיוֹם צָרָה
  choice: в день бедствия
  rationale: Передаёт временное значение сочетания и широкую силу צָרָה — беду, тесноту, тяжёлое положение — без обязательного эсхатологического уточнения.
- source_word: וְיֹדֵעַ
  choice: Он знает
  rationale: Сохраняет основной смысл ידע и его возможную смысловую глубину — личное знание и признание — не сводя выражение к пояснительному «заботится».
- source_word: חֹסֵי בוֹ
  choice: тех, кто ищет в Нём убежища
  rationale: Причастие от חסה выражает обращение к кому-либо за защитой. Формулировка сохраняет метафору укрытия и связь с образом твердыни.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Характер выражения «в день бедствия»
  choice: Общее временное значение
  alternative: Особый эсхатологический день бедствия
  rationale: Сам стих не требует понимать выражение как техническое обозначение конкретного события последних времён; перевод оставляет его более широкий смысл.
- issue: Смысл глагола ידע в отношении ищущих убежища
  choice: «знает»
  alternative: «признаёт»; «заботится о»
  rationale: Буквальное «знает» сохраняет возможную полноту личного отношения, не закрепляя в основном тексте лишь один из выводимых оттенков.
translation_notes:
  register: Современный литературный русский с кратким, торжественным строем. «Благ» и «твердыня» принадлежат понятному библейскому регистру; синтаксис сохраняет лаконизм еврейской поэтической строки.
