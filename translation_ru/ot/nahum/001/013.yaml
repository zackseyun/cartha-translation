source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֶשְׁבֹּ֥ר מֹטֵ֖/הוּ מֵֽ/עָלָ֑יִ/ךְ וּ/מוֹסְרֹתַ֖יִ/ךְ אֲנַתֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/013.yaml
  text: And now I will break his yoke from upon you[a], and I will tear off your bonds.
translation:
  language: ru
  text: И теперь Я сломаю его ярмо, лежащее на тебе[a], и разорву твои узы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его перекладину». Еврейское слово может обозначать жердь, перекладину или ярмо; в сочетании с узами здесь лучше подходит «ярмо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительный союз и временной переход к близкому Божьему действию; естественно звучит по-русски.
- source_word: אֶשְׁבֹּר
  choice: Я сломаю
  rationale: Прямо передаёт значение qal 1-го лица ед. числа от שׁבר и соответствует образу ярма.
- source_word: מֹטֵהוּ
  choice: его ярмо
  rationale: Существительное может означать жердь, перекладину или ярмо; в параллели с узами здесь наиболее естественен образ ярма угнетения. Местоименный суффикс 3-го лица сохранён без уточнения его носителя.
- source_word: מֵעָלָיִךְ
  choice: лежащее на тебе
  rationale: Передаёт пространственный образ מֵעַל — снятия того, что находится сверху и давит на адресата женского рода, избегая неестественного русского «с тебя» после глагола «сломаю».
- source_word: וּמוֹסְרֹתַיִךְ
  choice: и твои узы
  rationale: Сохраняет множественное число и метафору подчинения; «узы» образуют естественную смысловую пару с ярмом.
- source_word: אֲנַתֵּק
  choice: разорву
  rationale: Порода piel глагола נתק выражает сильное разъединение, разрыв или срывание; «разорву» естественно сочетается с «узы».
theological_decisions:
- issue: К кому относится суффикс 3-го лица мужского рода в מֹטֵהוּ («его ярмо»)
  choice: Сохранить «его ярмо», не называя угнетателя.
  alternative: «ярмо Ассирии» или «ярмо ассирийского царя»
  rationale: Контекст указывает на вражескую державу, вероятнее всего Ассирию или её царя, однако еврейский текст здесь содержит лишь местоименный суффикс; перевод не должен устранять эту референциальную сдержанность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Прописная «Я» обозначает говорящего Бога по русской издательской традиции. Женский род в «тебе» в русском не выражен, хотя еврейская форма обращена к адресату женского рода.
