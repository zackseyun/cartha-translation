    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Современное и вместе с тем торжественное указательное междометие, передающее эмфатическое введение.
- source_word: עַמֵּךְ
  choice: народ твой
  rationale: Основное значение עַם — «народ». Военный контекст допускает понимание защитников или войска, но перевод сохраняет более широкое и прямое значение исходного слова.
- source_word: נָשִׁים
  choice: женщины
  rationale: Буквальное существительное во множественном числе; гендерно окрашенная военная насмешка сохраняется без смягчения и без добавления отсутствующего показателя сравнения.
- source_word: בְּקִרְבֵּךְ
  choice: среди тебя
  rationale: Естественно передаёт локативное выражение «в твоей среде, внутри тебя» при обращении к Ниневии.
- source_word: לְאֹיְבַיִךְ
  choice: перед твоими врагами
  rationale: В сочетании с образом распахнутых ворот русский предлог «перед» естественно выражает их открытость и доступность для врагов.
- source_word: פָּתוֹחַ נִפְתְּחוּ
  choice: настежь открыты
  rationale: Инфинитив абсолютный с личной формой усиливает действие; «настежь» передаёт значение полного открытия.
- source_word: שַׁעֲרֵי אַרְצֵךְ
  choice: ворота твоей земли
  rationale: Прямо сохраняет сочетание «ворота» и «земля», обозначающее доступы в подвластную территорию.
- source_word: אָכְלָה אֵשׁ
  choice: огонь пожрал
  rationale: Глагол אָכַל буквально означает «есть, пожирать»; олицетворённое «пожрал» сохраняет яркость пророческого образа.
- source_word: בְּרִיחָיִךְ
  choice: твои засовы
  rationale: Обозначает запирающие брусья или засовы ворот; «засовы» понятно современному читателю и ясно связано с предшествующими воротами.
theological_decisions:
- issue: Гендерно окрашенная военная насмешка נָשִׁים
  choice: Сохранено прямое «женщины» без сравнительного оборота.
  alternative: «как женщины» или «слабы, как женщины»
  rationale: В еврейском тексте нет показателя сравнения и нет прилагательного «слабые». Перевод не смягчает историческую риторику и не добавляет её истолкование.
- issue: Объём значения עַמֵּךְ
  choice: «народ твой»
  alternative: «твоё войско» или «твои воины»
  rationale: Военный контекст позволяет отнести слово к защитникам города, однако основное лексическое значение остаётся «народ». Более узкое прочтение не вносится в основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческого приговора. Инверсия «народ твой» поддерживает возвышенный регистр, не создавая архаичности. Образность и резкость оригинала сохранены.
