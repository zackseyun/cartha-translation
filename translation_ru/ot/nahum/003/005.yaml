base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/005.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will uncover your skirts over your face, and I will show the nations your nakedness and the kingdoms your shame.
translation:
  language: ru
  text: «Вот Я против тебя, — возвещает Яхве Воинств, — Я подниму подол твоего платья тебе на лицо[a] и покажу народам твою наготу, царствам — твой позор».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обнажу (подниму) твои подолы на твоё лицо». Это образ публичного обнажения и унижения Ниневии, представленной как женщина.'
    reason: Поясняет непривычный буквальный образ, не добавляя не выраженных в тексте деталей.
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: Вот Я — против тебя
  rationale: Сохраняет торжественную пророческую формулу и ясно передаёт направленную против Ниневии враждебность; женский род адресата раскрывается далее через местоимения.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Яхве Воинств
  rationale: «Возвещает» естественно передаёт формулу божественного изречения; имя Яхве воспроизводит тетраграмматон, а «Воинств» сохраняет ёмкий военный и небесный титул.
- source_word: וְגִלֵּיתִי שׁוּלַיִךְ עַל פָּנָיִךְ
  choice: Я подниму подол твоей одежды тебе на лицо
  rationale: Передаёт конкретный образ обнажения и публичного унижения. Единственное число «подол твоей одежды» естественнее по-русски, чем буквальное множественное «твои подолы».
- source_word: וְהַרְאֵיתִי גוֹיִם מַעְרֵךְ
  choice: и покажу народам твою наготу
  rationale: Сохраняет каузативное значение «покажу» и прямой, но не излишне натуралистичный смысл редкого существительного מַעְרֵךְ.
- source_word: וּמַמְלָכוֹת קְלוֹנֵךְ
  choice: царствам — твой позор
  rationale: Эллипсис естественно воспроизводит еврейский параллелизм, а «позор» подчёркивает публичное бесчестие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; Небесных Воинств
  rationale: «Воинств» сохраняет намеренную широту древнееврейского титула и не ограничивает его значение только небесным войском.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены резкость образа суда, обращение к Ниневии в женском роде и параллелизм заключительных строк.
