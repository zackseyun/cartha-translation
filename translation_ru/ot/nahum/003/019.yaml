  text: אֵין כֵּהָ֣ה לְ/שִׁבְרֶ֔/ךָ נַחְלָ֖ה מַכָּתֶ֑/ךָ כֹּ֣ל שֹׁמְעֵ֣י שִׁמְעֲ/ךָ֗ תָּ֤קְעוּ כַף֙ עָלֶ֔י/ךָ כִּ֗י עַל מִ֛י לֹֽא עָבְרָ֥ה רָעָתְ/ךָ֖ תָּמִֽיד־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/019.yaml
  text: There is no healing for your fracture[a]; your wound is grievous. All who hear the report about you clap their hands over you[b], for over whom has your evil not continually passed?
translation:
  language: ru
  text: Нет исцеления от твоего сокрушения[a], тяжела твоя рана. Все, кто услышит весть о тебе, будут хлопать в ладоши над тобой[b], ведь кого не постигало непрестанно твоё зло?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нет облегчения от твоего повреждения»; слова могут обозначать облегчение или исцеление, а также перелом, повреждение или сокрушение.'
    reason: lexical_alternative
  - marker: b
    text: 'Хлопанье в ладоши здесь выражает торжество при падении Ниневии: её зло коснулось столь многих, что известие о её гибели вызывает радость.'
    reason: cultural_note
lexical_decisions:
- source_word: אֵין כֵּהָה לְשִׁבְרֶךָ
  choice: Нет облегчения твоему разлому
  rationale: כֵּהָה обозначает ослабление, облегчение или исцеление, а שֶׁבֶר — перелом, разлом или крушение. Перевод сохраняет образ тяжёлого повреждения и не усиливает выражение до прямого утверждения о неизлечимости.
- source_word: נַחְלָה מַכָּתֶךָ
  choice: тяжела твоя рана
  rationale: נַחְלָה передаёт болезненность и тяжесть состояния, а מַכָּה — удар или нанесённую им рану. «Тяжела» естественно звучит по-русски и сохраняет серьёзность приговора без избыточного уточнения «неизлечима».
- source_word: כֹּל שֹׁמְעֵי שִׁמְעֲךָ
  choice: Все, кто услышит весть о тебе
  rationale: Созвучная еврейская конструкция означает всех, до кого дойдёт известие о Ниневии и её падении. «Весть о тебе» ясно и естественно передаёт смысл.
- source_word: תָּקְעוּ כַף עָלֶיךָ
  choice: захлопают в ладоши над тобой
  rationale: Идиома буквально описывает удар ладонью и в данном контексте выражает злорадное торжество при падении Ниневии. Будущее время естественно связано с предшествующим «услышит».
- source_word: כִּי עַל מִי לֹא עָבְרָה רָעָתְךָ תָּמִיד
  choice: ведь кого не настигало непрестанно твоё зло?
  rationale: Риторический вопрос утверждает широту и длительность причинённого Ниневией зла. «Настигало» естественно передаёт направленное на людей действие, выраженное сочетанием עַל и עבר, а «непрестанно» сохраняет תָּמִיד.
theological_decisions:
- issue: Значение רָעָתְךָ в пророческом обвинении Ниневии
  choice: твоё зло
  alternative: твоё нечестие; твоя жестокость; причинённое тобой бедствие
  rationale: «Зло» сохраняет широкий нравственный смысл רָעָה и одновременно допускает его проявление в насилии и угнетении, не сужая обвинение только до жестокости или последствий злых действий.
- issue: Смысл риторического вопроса в конце стиха
  choice: сохранён как вопрос
  alternative: 'передать утвердительно: «ведь твоё зло непрестанно настигало всех»'
  rationale: Вопросительная форма оригинала усиливает обвинение и объясняет всеобщую радость при падении Ниневии, не превращая риторическую гиперболу в прямое прозаическое утверждение.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Медицинский образ повреждения и раны сохранён; синтаксис сделан ясным для обычного читателя, а заключительный риторический вопрос оставлен без догматического сглаживания.
