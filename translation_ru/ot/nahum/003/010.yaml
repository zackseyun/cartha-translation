revisions:
- from: Но и она пошла в изгнание, в плен. Даже её младенцы были разбиты о камни в начале каждой улицы[a]. О её знатных людях бросали жребий, и все её вельможи были закованы в цепи.
  to: Но и она пошла в изгнание, в плен. Даже её младенцев разбивали в начале каждой улицы[a]. О её знатных людях бросали жребий, и все её вельможи были закованы в цепи.
  rationale: Убрано не имеющее опоры в оригинале «о камни». Сохранены жестокая образность глагола, прошедшее повествовательное время, параллелизм и пространственно неоднозначное «в начале каждой улицы», разъяснённое сноской. Маркер сноски остаётся непосредственно после соответствующего выражения.
  reviewer_model: gpt-5.6-terra
