  text: גַּם הִ֗יא לַ/גֹּלָה֙ הָלְכָ֣ה בַ/שֶּׁ֔בִי גַּ֧ם עֹלָלֶ֛י/הָ יְרֻטְּשׁ֖וּ בְּ/רֹ֣אשׁ כָּל חוּצ֑וֹת וְ/עַל נִכְבַּדֶּ֨י/הָ֙ יַדּ֣וּ גוֹרָ֔ל וְ/כָל גְּדוֹלֶ֖י/הָ רֻתְּק֥וּ בַ/זִּקִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/010.yaml
  text: Yet she too went into exile[a], into captivity; her children too were dashed to pieces at the head of every street. They cast lots for her honored men[d][c][b], and all her great men were bound in chains.
translation:
  language: ru
  text: Но и она пошла в изгнание, в плен. Даже её младенцев разбивали в начале каждой улицы[a]. О её знатных людях бросали жребий, и все её вельможи были закованы в цепи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во главе каждой улицы»; вероятно, у входов на улицы или на перекрёстках.'
    reason: cultural_note
lexical_decisions:
- source_word: גַּם הִיא
  choice: Но и она
  rationale: 'Сохраняет усилительное «и она» и контекстуальное противопоставление: даже Но-Амон не избежал участи, грозящей Ниневии.'
- source_word: לַגֹּלָה הָלְכָה בַשֶּׁבִי
  choice: пошла в изгнание, в плен
  rationale: Передаёт движение к состоянию изгнания и сохраняет усиливающее приложение «в плен», не сводя два выражения в одно.
- source_word: עֹלָלֶיהָ
  choice: её младенцы
  rationale: Слово обозначает совсем маленьких детей; «младенцы» естественно и достаточно точно передаёт возрастную специфику.
- source_word: יְרֻטְּשׁוּ
  choice: были разбиты о камни
  rationale: Передаёт жестокое умерщвление маленьких детей и естественно звучит по-русски; упоминание камней является подразумеваемым образом действия в данном устойчивом библейском выражении.
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: в начале каждой улицы
  rationale: Формально сохраняет образ «головы/начала улицы», не устраняя возможную пространственную неоднозначность; пояснение дано в сноске.
- source_word: נִכְבַּדֶּיהָ
  choice: её знатных людях
  rationale: Передаёт высокий общественный статус лиц; «знатные люди» естественнее буквального «почитаемые» и не обязательно ограничивает их официальной должностью.
- source_word: יַדּוּ גוֹרָל
  choice: бросали жребий
  rationale: Устойчивый русский эквивалент древнееврейской идиомы распределения людей по жребию.
- source_word: גְּדוֹלֶיהָ
  choice: её вельможи
  rationale: Обозначает влиятельных и высокопоставленных людей; позволяет естественно отличить их от נִכְבַּדֶּיהָ, хотя группы могли пересекаться.
- source_word: רֻתְּקוּ בַזִּקִּים
  choice: были закованы в цепи
  rationale: Точно и естественно передаёт принудительное связывание металлическими узами при пленении.
