    rationale: Еврейский текст говорит лишь, что младенцев «разбивали/разбивали насмерть» (ירטשו), у начала всех улиц; он не называет камни. Добавление конкретного орудия сужает и изменяет образ оригинала.
  revised_text: Но и она пошла в изгнание, в плен. Даже её младенцев разбивали в начале каждой улицы[a]. О её знатных людях бросали жребий, и все её вельможи были закованы в цепи.
  revised_footnotes:
