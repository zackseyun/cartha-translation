review_pass:
  verdict: revise
  source_fidelity: 'Существенное отклонение в формулировке «были разбиты о камни»: в древнееврейском тексте нет ни «камней», ни иного орудия действия. Глагол רטש передаёт жестокое разбивание/растерзание, но способ не уточнён. Остальные основные соответствия сохранены: изгнание и плен, жребий о знатных людях и оковы для великих людей.'
  naturalness: «Младенцев разбивали в начале каждой улицы» — мрачная, но понятная и литературно приемлемая передача без добавления невыраженной детали. «В начале каждой улицы» намеренно сохраняет пространственную неоднозначность оригинала; сноска помогает читателю. В целом регистр соответствует пророческой речи.
  terminology: «Знатные люди» для נִכְבַּדֶּיהָ и «вельможи» для גְּדוֹלֶיהָ удачно передают близкие, но не тождественные обозначения общественно значимых лиц. «Закованы в цепи» точно передаёт רֻתְּקוּ בַזִּקִּים. «Младенцы» допустимо передаёт עֹלָלִים как совсем малых детей.
