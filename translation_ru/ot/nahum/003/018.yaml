  text: נָמ֤וּ רֹעֶ֨י/ךָ֙ מֶ֣לֶךְ אַשּׁ֔וּר יִשְׁכְּנ֖וּ אַדִּירֶ֑י/ךָ נָפֹ֧שׁוּ עַמְּ/ךָ֛ עַל הֶ/הָרִ֖ים וְ/אֵ֥ין מְקַבֵּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/018.yaml
  text: Your shepherds slumber[a], O king of Assyria; your nobles lie down. Your people are scattered on the mountains[d][c][b], and there is no one to gather them.
translation:
  language: ru
  text: Дремлют твои пастыри[a][b], царь Ассирии; покоятся твои вельможи[c]. Твой народ рассеян по горам[d], и некому его собрать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спят». Еврейский образ может указывать на нерадивость руководителей, их бессилие или смерть.'
    reason: lexical_alternative
  - marker: b
    text: «Пастыри» — образное обозначение правителей или руководителей Ассирии.
    reason: cultural_note
  - marker: c
    text: 'Или: «пребывают», «отдыхают». Еврейский глагол обычно означает «обитать, пребывать», но здесь, вероятно, продолжает образ неподвижных руководителей.'
    reason: alternative_reading
  - marker: d
    text: 'Еврейская форма, переведённая как «рассеян», трудна для толкования; такой смысл поддерживает следующая строка: «некому его собрать».'
    reason: textual_variant
lexical_decisions:
- source_word: נָמוּ
  choice: дремлют
  rationale: Глагол נום обозначает сон или дремоту. «Дремлют» сохраняет поэтический образ бездействующих или утративших способность действовать вождей и естественно звучит по-русски.
- source_word: רֹעֶיךָ
  choice: твои пастыри
  rationale: Сохранён буквальный пастушеский образ, которым в пророческой речи обозначаются правители и руководители.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Фраза понята как прямое обращение; русский звательный смысл передаётся формой именительного падежа без архаического «о».
- source_word: יִשְׁכְּנוּ
  choice: покоятся
  rationale: Обычно глагол значит «обитать, пребывать», но в параллели с נָמוּ здесь вероятен смысл покоя или неподвижности. «Покоятся» сохраняет как образ бездействия, так и возможный оттенок смерти.
- source_word: אַדִּירֶיךָ
  choice: твои вельможи
  rationale: Субстантивированное слово может обозначать могущественных, знатных людей. «Вельможи» точно передаёт общественно-политический смысл и не сужает его до военачальников.
- source_word: נָפֹשׁוּ
  choice: рассеян
  rationale: Форма трудна, однако упоминание гор и последующее «некому его собрать» указывают на рассеяние народа. Русское единственное число согласовано с собирательным существительным «народ».
- source_word: עַמְּךָ
  choice: твой народ
  rationale: Сохранено обычное значение слова; контекст не даёт достаточных оснований сужать его до войска.
- source_word: עַל הֶהָרִים
  choice: по горам
  rationale: Предлог עַל здесь естественно передаётся по-русски как «по», поскольку речь идёт о людях, рассеянных в горной местности.
- source_word: וְאֵין מְקַבֵּץ
  choice: и некому его собрать
  rationale: Безличная конструкция естественна для современного русского языка. Местоимение «его» явно отсылает к собирательному существительному «народ».
