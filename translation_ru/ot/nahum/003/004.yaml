  yaml_path: translation/ot/nahum/003/004.yaml
  text: because of the many prostitutions of the prostitute[a], charming in grace, mistress of sorceries[b], who sells nations by her prostitutions and clans by her sorceries.
translation:
  language: ru
  text: Из-за множества блудодеяний блудницы, прекрасной и обаятельной[a], владеющей колдовством, продающей народы своими блудодеяниями и роды[b] — своим колдовством.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прекрасной в благоволении»; выражение описывает привлекательность и обаяние.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кланы». Еврейское слово обозначает расширенные родственные группы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב
  choice: из-за множества
  rationale: 'Предлог מִן с רֹב выражает здесь причину грядущего суда и одновременно сохраняет количественное значение: «из-за множества».'
- source_word: זְנוּנֵי / זוֹנָה
  choice: блудодеяний блудницы
  rationale: Однокоренное сочетание сохраняет усиленную метафору проституции. «Блудница» и «блудодеяния» уместны в современном литературном библейском регистре и не сводят образ лишь к буквальному сексуальному поведению.
- source_word: טוֹבַת חֵן
  choice: обольстительной и прекрасной
  rationale: Идиома характеризует привлекательность и пленительное обаяние. Такое сочетание естественно по-русски и передаёт соблазняющую привлекательность, не ограничивая её только телесной красотой.
- source_word: בַּעֲלַת כְּשָׁפִים
  choice: владеющей колдовством
  rationale: Буквально выражение обозначает женщину, обладающую чарами или характеризуемую ими. «Владеющей колдовством» сохраняет женский образ и звучит естественнее буквального «госпожи колдовств».
- source_word: הַמֹּכֶרֶת
  choice: продающей
  rationale: Причастие продолжает описание олицетворённой блудницы; прямой глагол сохраняет коммерческий образ эксплуатации и порабощения.
- source_word: גּוֹיִם
  choice: народы
  rationale: В пророческом контексте слово обозначает народы как политико-этнические общности; «язычники» здесь было бы неоправданным сужением.
- source_word: בִּזְנוּנֶיהָ
  choice: своими блудодеяниями
  rationale: 'Предлог בְּ имеет инструментальное значение: блудодеяния представлены как средство, которым она продаёт народы.'
- source_word: וּמִשְׁפָּחוֹת
  choice: племена
  rationale: מִשְׁפָּחוֹת может обозначать расширенные родственные группы или кланы. «Племена» естественно сочетается с «народами» и передаёт надсемейную общность.
- source_word: בִּכְשָׁפֶיהָ
  choice: своим колдовством
  rationale: Инструментальное בְּ передано творительным падежом. Собирательное «колдовство» естественно по-русски и сохраняет связь с предыдущим упоминанием колдовства.
theological_decisions:
- issue: Смысл образов блудницы и колдовства
  choice: Сохранить многозначный пророческий образ обольщающей и порабощающей силы Ниневии, не ограничивая его только сексуальным грехом, идолопоклонством либо политико-экономической эксплуатацией.
  alternative: Истолковать образ исключительно как идолопоклонство или исключительно как политическое и экономическое обольщение.
  rationale: Текст соединяет проституцию, привлекательность, колдовство и продажу народов. Перевод сохраняет эту напряжённую совокупность образов без внесения однозначного конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с возвышенным пророческим звучанием. Синтаксис сохраняет зависимость фразы от контекста предыдущего стиха. Повтор «блудодеяний блудницы» намеренно воспроизводит усиление оригинала; инструментальность передана творительным падежом.
