  text: וְ/הָיָ֤ה כָל רֹאַ֨יִ/ךְ֙ יִדּ֣וֹד מִמֵּ֔/ךְ וְ/אָמַר֙ שָׁדְּדָ֣ה נִֽינְוֵ֔ה מִ֖י יָנ֣וּד לָ֑/הּ מֵ/אַ֛יִן אֲבַקֵּ֥שׁ מְנַחֲמִ֖ים לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/007.yaml
  text: And it will happen that all who see you will shrink from you and say, ‘Nineveh is devastated; who will grieve for her? Where can I seek comforters for you?’
translation:
  language: ru
  text: 'И будет так: всякий, кто увидит тебя, отшатнётся от тебя и скажет: «Ниневия разорена! Кто пожалеет её? Где мне найти для тебя утешителей?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִדּוֹד מִמֵּךְ
  choice: отшатнётся от тебя
  rationale: Глагол передаёт удаление прочь; в контексте зрелища гибели естественное русское «отшатнётся» выражает испуганное или брезгливое отстранение, не сводя смысл просто к бегству.
- source_word: שָׁדְּדָה
  choice: разорена
  rationale: Форма описывает опустошение и разграбление города; «разорена» сохраняет этот широкий смысл и торжественно-пророческий регистр.
- source_word: יָנוּד לָהּ
  choice: пожалеет её
  rationale: В данном контексте נוד означает проявить сочувствие, пожалеть; выбор сохраняет риторический вопрос без чрезмерного уточнения характера скорби.
- source_word: מֵאַיִן אֲבַקֵּשׁ מְנַחֲמִים
  choice: Где мне найти ... утешителей?
  rationale: Русское «найти» естественно передаёт результат поисков, выраженных אֲבַקֵּשׁ, а «утешители» прямо соответствует מְנַחֲמִים.
theological_decisions:
- issue: Переход от третьего лица «её» к обращению «тебя»
  choice: 'Сохранить смену лица: «Кто пожалеет её? Где мне найти для тебя утешителей?»'
  alternative: 'Унифицировать всё как прямое обращение: «Кто пожалеет тебя?»'
  rationale: Масоретский текст действительно чередует לָהּ («её») и לָךְ («тебе/для тебя»); сохранение перехода передаёт риторическую подвижность оригинала и не сглаживает её.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Начальное «И будет» сохраняет формулу וְהָיָה; женский род обращения соответствует олицетворённой Ниневии. Кавычки и восклицание делают границы прямой речи ясными без добавления толкования.
