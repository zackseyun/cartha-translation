base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/001.yaml
  text: Woe to the city of bloodshed[a], all of it full of lies, full of plunder[d][c][b]; prey never departs.
translation:
  language: ru
  text: Горе городу кровопролития[a]! Он весь полон лжи, полон награбленного[b]; добыча не покидает его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «городу кровей» — то есть городу, отмеченному кровопролитием и виной за пролитую кровь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «полон награбленной добычи»; еврейское слово подразумевает насильственный захват.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «добыча не отходит». Возможен также смысл: «добыча не прекращается» — то есть хищнический грабёж города не прекращается.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Междометие выражает одновременно плач и пророческое осуждение; «горе» естественно передаёт обе стороны.
- source_word: עִיר דָּמִים
  choice: городу кровопролития
  rationale: Буквально «город кровей» — идиома, обозначающая город, запятнанный многочисленными убийствами и виной за пролитую кровь.
- source_word: כֻּלָּהּ כַּחַשׁ
  choice: Весь он — ложь
  rationale: 'Сохраняется резкая именная конструкция еврейского текста: город во всей своей полноте характеризуется ложью и обманом; местоимение согласовано с русским словом «город».'
- source_word: פֶּרֶק מְלֵאָה
  choice: полон награбленного
  rationale: פֶּרֶק обозначает добытое насильственным захватом; «награбленное» ясно передаёт и добычу, и преступный способ её приобретения.
- source_word: לֹא יָמִישׁ טָרֶף
  choice: добыча в нём не переводится
  rationale: Буквально добыча «не отходит»; русская идиома естественно передаёт её постоянное наличие и непрекращающийся хищнический грабёж, не устраняя образ добычи.
