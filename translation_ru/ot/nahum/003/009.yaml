  terminology: Имена «Куш» и «Пут» последовательно транслитерированы. «Ливийцы» — ясная современная передача לוּבִים; примечание к Путу корректно указывает традиционный вариант «Фут». Примечание a верно объясняет значимую смену лица и не навязывает гармонизирующее чтение.
