  source_fidelity: 'Перевод точно передаёт ключевые элементы масоретского текста: Куш назван «её силой» с сохранением суффикса 3-го лица женского рода, далее сохранён переход к обращению во 2-м лице в «тебе в помощь». Эллиптическое «и Египет — без конца» уместно оставляет неуточнённым, что именно у Египта было «без конца», как и в еврейском וְאֵין קֵצֶה.'
