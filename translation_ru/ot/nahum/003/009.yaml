source:
  edition: WLC
  text: כּ֥וּשׁ עָצְמָ֛/ה וּ/מִצְרַ֖יִם וְ/אֵ֣ין קֵ֑צֶה פּ֣וּט וְ/לוּבִ֔ים הָי֖וּ בְּ/עֶזְרָתֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/009.yaml
  text: Cush was her strength[a], and Egypt without end[d][c][b]; Put and the Libyans were among your helpers.
translation:
  language: ru
  text: Куш был её силой[a], и Египет — без конца; Пут[b] и ливийцы были тебе в помощь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте внутри стиха меняется лицо: сначала «её силой» (3-е лицо женского рода), а затем «тебе в помощь» (2-е лицо женского рода). Иногда эту смену сглаживают и переводят «твоей силой».'
    reason: alternative_reading
  - marker: b
    text: Пут — название народа или страны; традиционный вариант имени — Фут.
    reason: cultural_note
lexical_decisions:
- source_word: כּוּשׁ
  choice: Куш
  rationale: Собственное имя передано транслитерацией, без географически более узкого отождествления с Эфиопией.
- source_word: עָצְמָהּ
  choice: был её силой
  rationale: Суффикс 3-го лица женского рода единственного числа сохранён как «её»; речь в контексте идёт о Но-Аммоне. Формулировка естественно передаёт значение силы и могущества.
- source_word: וּמִצְרַיִם וְאֵין קֵצֶה
  choice: и Египет — без конца
  rationale: 'Сохранено компактное и несколько неоднозначное выражение оригинала: не уточняется, идёт ли речь о неисчислимой силе, населении или ресурсах Египта.'
- source_word: פּוּט
  choice: Пут
  rationale: Имя прямо транслитерировано с еврейского.
- source_word: לוּבִים
  choice: ливийцы
  rationale: Этноним передан привычным современным русским названием народа; буквально в еврейском тексте — «лувим».
- source_word: הָיוּ בְּעֶזְרָתֵךְ
  choice: были тебе в помощь
  rationale: Русская идиома естественно передаёт участие Пута и ливийцев в оказании поддержки и сохраняет обращение во 2-м лице женского рода.
theological_decisions:
- issue: Смена грамматического лица внутри стиха
  choice: 'Сохранено: «её силой» ... «тебе в помощь»'
  alternative: 'Согласовать местоимения: «твоей силой» ... «тебе в помощь»'
  rationale: Масоретский текст сначала содержит суффикс 3-го лица женского рода, а затем суффикс 2-го лица женского рода. Сглаживание устранило бы реальную особенность исходного текста.
- issue: Смысл выражения וְאֵין קֵצֶה
  choice: «без конца» без добавления поясняемого существительного
  alternative: «сила её была беспредельна» или «не было ей конца»
  rationale: Исходный текст не называет явно, что именно не имеет предела; перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным пророческим ритмом. Сохранены собственные имена и намеренная грамматическая неровность еврейского текста; выражение «без конца» оставлено без разъясняющей вставки, чтобы не снимать исходную неоднозначность.
