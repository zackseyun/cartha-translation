source:
  edition: WLC
  text: גַּם אַ֣תְּ תִּשְׁכְּרִ֔י תְּהִ֖י נַֽעֲלָמָ֑ה גַּם אַ֛תְּ תְּבַקְשִׁ֥י מָע֖וֹז מֵ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/011.yaml
  text: You too will become drunk[a]; you will be hidden[b]. You too will seek a refuge from the enemy.
translation:
  language: ru
  text: И ты опьянеешь[a], будешь скрыта; и ты будешь искать убежища[b] от врага.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Опьянеешь» здесь, вероятно, продолжает пророческий образ: под судом город будет ошеломлён и станет шататься, словно пьяный; речь не обязательно только о буквальном опьянении.'
    reason: cultural_note
  - marker: b
    text: 'Или: «укрепления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַתְּ
  choice: И ты
  rationale: Повторённое обращение к Ниневии подчёркивает, что её постигнет та же участь, что и Но-Амон. Женский род сохранён в формах сказуемых.
- source_word: תִּשְׁכְּרִי
  choice: опьянеешь
  rationale: Qal имперфект глагола שׁכר означает «опьянеть». Конкретный пророческий образ сохранён без сведения его лишь к буквальному употреблению вина.
- source_word: תְּהִי נַעֲלָמָה
  choice: будешь скрыта
  rationale: Сочетание היה с формой от עלם передаёт состояние сокрытости. Перевод сохраняет пассивно-результативный смысл и не заменяет его более толковательным «исчезнешь».
- source_word: תְּבַקְשִׁי
  choice: будешь искать
  rationale: Piel глагола בקש обычно означает целенаправленно искать или стараться обрести; выбран естественный и стилистически уместный русский эквивалент.
- source_word: מָעוֹז
  choice: убежища
  rationale: Слово обозначает место или средство защиты и силы. «Убежище» естественно передаёт функцию искомой защиты; более предметное «укрепление» отмечено в сноске.
- source_word: מֵאוֹיֵב
  choice: от врага
  rationale: 'Предлог מִן естественно выражает удаление или защиту от угрозы: убежище от врага.'
theological_decisions:
- issue: Образ опьянения в пророчестве о суде
  choice: Сохранить буквальный образ «опьянеешь» и пояснить его вероятную метафорическую силу в сноске.
  alternative: 'Передать толковательно: «зашатаешься под ударом суда».'
  rationale: Сам стих прямо не называет ни чашу, ни гнев, поэтому перевод не должен устранять многозначность образа, хотя контекст суда делает переносное значение вероятным.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Женский род обращения отражает олицетворение Ниневии. Повтор «и ты» сохранён ради риторического сопоставления с Но-Амоном.
