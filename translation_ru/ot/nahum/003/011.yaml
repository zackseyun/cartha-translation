  terminology: '«Опьянеешь» сохраняет конкретный образ, а сноска осторожно объясняет его вероятную пророческую образность, не превращая её в основной текст. «Убежище» точно передаёт функциональный смысл מעוז; вариант «укрепления» в сноске обоснован. Якоря сносок в русском тексте поставлены содержательно верно: a относится к «опьянеешь», b — к «убежища».'
