  source_fidelity: 'Текст точно передаёт три параллельных предсказания в женском роде, обращённые к олицетворённой Ниневии: «опьянеешь» (תשכרי), «будешь скрыта» (תהי נעלמה) и «будешь искать убежища от врага» (תבקשי מעוז מאויב). Повтор «И ты» корректно сохраняет emphatic גם את и сопоставление с Но-Амоном в предшествующем контексте. Пассивно-результативный оттенок «будешь скрыта» сохранён без неоправданного толкования как «исчезнешь».'
