base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/014.yaml
  text: Draw water for yourself for the siege; strengthen your fortresses[a]. Go into the clay and tread the mortar; take hold of the brick mold.
translation:
  language: ru
  text: Набери себе воды на случай осады; укрепи свои крепости. Ступай в глину, топчи раствор, возьмись за форму для кирпичей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возьмись за кирпичную печь». Редкое еврейское слово מַלְבֵּן может обозначать либо форму для изготовления кирпичей, либо печь для их обжига; ближайший контекст работы с глиной и раствором скорее указывает на форму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵי מָצוֹר
  choice: воды на время осады
  rationale: Буквально «воды осады»; речь идёт о запасе воды в преддверии осады. Такой перевод естественно передаёт временную и целевую связь.
- source_word: שַׁאֲבִי לָךְ
  choice: начерпай себе
  rationale: Женский род повелительной формы обусловлен обращением к олицетворённому городу; «себе» сохраняет значение לָךְ.
- source_word: חַזְּקִי מִבְצָרָיִךְ
  choice: укрепи свои крепости
  rationale: Сохраняется сочетание глагола со значением укрепления и конкретного обозначения укреплённых мест.
- source_word: בֹּאִי בַטִּיט
  choice: войди в глину
  rationale: טִיט может означать грязь или глину; контекст изготовления кирпичей поддерживает значение «глина».
- source_word: וְרִמְסִי בַחֹמֶר
  choice: топчи раствор
  rationale: רמס буквально обозначает топтание, а חֹמֶר в данном ремесленном контексте — подготовленную глиняную массу, раствор.
- source_word: הַחֲזִיקִי מַלְבֵּן
  choice: возьмись за форму для кирпичей
  rationale: Глагол здесь передаёт действие взяться или ухватиться за предмет; редкое מַלְבֵּן в контексте работы с глиной вероятнее всего обозначает форму для изготовления кирпичей.
