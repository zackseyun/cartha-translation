  text: There the fire will devour you; the sword will cut you off; it will devour you like the locust[a]. Multiply yourself like the locust; multiply yourself like the swarming locust.
translation:
  language: ru
  text: Там пожрёт тебя огонь, истребит тебя меч, пожрёт тебя, как саранча[a]. Умножайся, как саранча, умножайся, как рой саранчи!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте употреблены два близких названия саранчовых: יֶלֶק, возможно обозначающее особый вид или стадию развития, и обычное слово אַרְבֶּה — «саранча». В основном тексте они переданы как «саранча» и «рой саранчи», чтобы сохранить образ множества, не утверждая точного энтомологического различия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Там
  rationale: Сохраняет указание на то самое место, где Ниневия рассчитывает найти безопасность.
- source_word: תֹּאכְלֵךְ ... אֵשׁ
  choice: пожрёт тебя огонь
  rationale: Глагол אָכַל буквально означает «есть, пожирать»; «пожрёт» естественно передаёт яркий образ уничтожающего огня.
- source_word: תַּכְרִיתֵךְ חֶרֶב
  choice: истребит тебя меч
  rationale: Форма от כרת означает «отсечь, уничтожить». В русском сочетание «истребит тебя меч» звучит естественнее буквального «отсечёт тебя», сохраняя смысл полного уничтожения.
- source_word: תֹּאכְלֵךְ
  choice: пожрёт тебя
  rationale: Повтор того же русского глагола сохраняет настойчивую образность еврейского текста; ближайший названный субъект — меч.
- source_word: כַּיָּלֶק / כַּיֶּלֶק
  choice: как саранча
  rationale: יֶלֶק обозначает пожирающее насекомое из группы саранчовых или стадию саранчи; общеупотребительное «саранча» ясно передаёт основной образ.
- source_word: הִתְכַּבֵּד / הִתְכַּבְּדִי
  choice: умножайся
  rationale: В контексте нашествия насекомых формы передают иронический призыв стать многочисленной; «умножайся» сохраняет повтор и возвышенный пророческий регистр.
- source_word: כָּאַרְבֶּה
  choice: как полчища саранчи
  rationale: אַרְבֶּה — обычное название саранчи, часто вызывающее образ массового нашествия. «Полчища» отличает этот термин от יֶלֶק и выражает множественность без введения иного вида насекомого.
