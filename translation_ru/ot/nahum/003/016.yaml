  yaml_path: translation/ot/nahum/003/016.yaml
  text: You multiplied your merchants more than the stars of the heavens[b][a]; the locust strips bare and flies away.
translation:
  language: ru
  text: Ты умножила число своих купцов — их стало больше, чем звёзд на небе. Саранча[a] всё обирает[b] и улетает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молодая саранча»; еврейское слово обозначает особый вид или стадию развития саранчи.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может также означать «расстилается» или «всё оголяет». Здесь, вероятно, имеется в виду, что саранча опустошает всё, а затем улетает.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבֵּית
  choice: Ты умножила число
  rationale: Каузативная форма глагола רבה обращена к Ниневии как к городу женского рода; выражение передаёт увеличение множества и естественно звучит по-русски.
- source_word: רֹכְלַיִךְ
  choice: своих купцов
  rationale: Существительное обозначает торговцев или купцов; «купцов» уместно для образа широкой торговли Ниневии.
- source_word: מִכּוֹכְבֵי הַשָּׁמָיִם
  choice: больше, чем звёзд на небе
  rationale: Предлог מן после רבה имеет сравнительное значение; эта формулировка точно и естественно передаёт неисчислимое множество.
- source_word: יֶלֶק
  choice: саранча
  rationale: Еврейское слово обозначает определённый вид или стадию развития саранчи, но точная идентификация неясна; общий русский термин сохраняет понятный образ, а неопределённость отмечена в сноске.
- source_word: פָּשַׁט
  choice: всё обирает
  rationale: Глагол допускает значения «распространяться», «снимать, сдирать» и в образе саранчи указывает на полное опустошение. «Всё обирает» сохраняет также возможную игру с образом купцов, не вводя излишней конкретизации.
- source_word: וַיָּעֹף
  choice: и улетает
  rationale: Последовательная глагольная форма от עוף описывает внезапный отлёт после опустошения.
