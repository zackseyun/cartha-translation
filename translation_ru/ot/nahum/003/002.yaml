lexical_decisions:
- source_word: קוֹל שׁוֹט
  choice: щёлканье бича
  rationale: קוֹל обозначает звук, а שׁוֹט — бич или кнут. «Щёлканье бича» естественно и выразительно передаёт слуховой образ; «бич» сохраняет возвышенный, но понятный регистр.
- source_word: קוֹל רַעַשׁ אוֹפָן
  choice: грохот колёс
  rationale: רַעַשׁ выражает сильный шум, грохот или сотрясение; в сочетании с אוֹפָן речь идёт о шуме движущихся колёс. Русское множественное число естественно при собирательной картине колесниц.
- source_word: סוּס דֹּהֵר
  choice: скачущие кони
  rationale: דֹּהֵר — причастие со значением стремительного бега или скачки. «Скачущие» ясно и идиоматично описывает движение коней.
- source_word: מֶרְכָּבָה מְרַקֵּדָה
  choice: подскакивающие колесницы
  rationale: מְרַקֵּדָה буквально передаёт скачкообразное, подпрыгивающее движение. «Подскакивающие» показывает сильную тряску колесниц и не вызывает неуместной ассоциации с танцем.
