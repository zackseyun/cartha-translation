base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/008.yaml
  text: Are you better than No-amon, who sat among the Nile channels, with waters all around her, whose rampart was the sea, whose wall was from the sea?
translation:
  language: ru
  text: Разве ты лучше Но-Амона[a], обитавшего среди нильских протоков, которого со всех сторон окружали воды, чьим оплотом было море и стеной которому служило море?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Но-Амон — египетские Фивы, крупный город на Ниле; название означает «город Амона».
    reason: Современному читателю древнее географическое название обычно неизвестно, а его идентификация важна для понимания сравнения.
lexical_decisions:
- source_word: הֲתֵיטְבִי מִנֹּא אָמוֹן
  choice: Разве ты лучше Но-Амона
  rationale: Сравнительная конструкция передана прямо; вопрос подразумевает отрицательный ответ. Название египетского города сохранено в транслитерации.
- source_word: הַיֹּשְׁבָה בַּיְאֹרִים
  choice: расположенного среди нильских протоков
  rationale: יָשַׁב здесь описывает местоположение города, а יְאֹרִים в египетском контексте — рукава и каналы Нила. Формулировка естественна для современного русского языка.
- source_word: מַיִם סָבִיב לָהּ
  choice: Вода окружала его
  rationale: Сохранён образ города, со всех сторон защищённого водой; русское местоимение согласовано с названием города.
- source_word: אֲשֶׁר חֵיל יָם
  choice: морем был его вал
  rationale: חֵיל обозначает оборонительный вал или укрепление; необычная метафора оригинала сохранена.
- source_word: מִיָּם חוֹמָתָהּ
  choice: из моря поднималась его стена
  rationale: Предлог מִן буквально передан как «из»; добавлен нейтральный глагол «поднималась», необходимый для естественной русской фразы и не устраняющий образную неоднозначность.
theological_decisions:
- issue: Риторическое сопоставление Ниневии с Но-Амоном
  choice: Сохранён вопрос «Разве ты лучше…?» без поясняющего вывода.
  alternative: «Неужели ты защищённее Но-Амона?»
  rationale: Исходный текст говорит «лучше», оставляя основание сравнения шире одной лишь военной защищённости.
- issue: Образы моря, вала и стены
  choice: Сохранены как две параллельные, но не полностью прояснённые метафоры.
  alternative: Истолковать «море» исключительно как Нил или сеть каналов.
  rationale: Текст допускает понимание יָם как обширных вод Нила, однако перевод не должен без необходимости устранять эту поэтическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Женский грамматический род еврейских форм относится к олицетворённому городу; в русском тексте после мужского по форме названия «Но-Амон» употреблён мужской род. Пунктуация делит длинный еврейский вопрос на вопрос и поясняющее предложение ради ясности.
