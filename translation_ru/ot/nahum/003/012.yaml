lexical_decisions:
- source_word: מִבְצָרַיִךְ
  choice: твои крепости
  rationale: Слово обозначает укреплённые места или твердыни; «крепости» конкретно и естественно передаёт военный образ в обращении к Ниневии.
- source_word: תְּאֵנִים
  choice: смоковницы
  rationale: Форма может обозначать и плоды инжира, однако в сравнении укреплённых мест наиболее связный образ создают деревья, с которых при встряхивании падают ранние плоды.
- source_word: עִם בִּכּוּרִים
  choice: с ранними смоквами
  rationale: בִּכּוּרִים здесь означает первые созревшие плоды, конкретно ранние смоквы; перевод сохраняет сельскохозяйственный образ и не придаёт слову ненужного культового оттенка.
- source_word: אִם
  choice: если
  rationale: Сохранено условное значение частицы; условие выражает закономерный и легко наступающий результат.
- source_word: יִנּוֹעוּ
  choice: их встряхнуть
  rationale: Глагол נוע передаёт качание или сотрясение. Неопределённо-личная конструкция естественна по-русски и отражает воздействие на деревья.
- source_word: וְנָפְלוּ
  choice: плоды упадут
  rationale: Перфект после условия обозначает результат. Будущее время естественно для русской условной конструкции; слово «плоды» проясняет образ, не меняя его смысла.
- source_word: עַל פִּי אוֹכֵל
  choice: прямо в рот тому, кто ест
  rationale: Буквально выражение означает «на уста едящего»; выбранная формулировка идиоматично передаёт лёгкость и непосредственность падения плодов.
