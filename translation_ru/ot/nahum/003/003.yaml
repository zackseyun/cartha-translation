  text: פָּרָ֣שׁ מַעֲלֶ֗ה וְ/לַ֤הַב חֶ֨רֶב֙ וּ/בְרַ֣ק חֲנִ֔ית וְ/רֹ֥ב חָלָ֖ל וְ/כֹ֣בֶד פָּ֑גֶר וְ/אֵ֥ין קֵ֨צֶה֙ לַ/גְּוִיָּ֔ה יכשלו בִּ/גְוִיָּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/003.yaml
  text: Horsemen charging[a], and the flashing sword and the gleaming spear, and a multitude of slain, and heaps of corpses[c][b]; and there is no end to the bodies— they stumble over the bodies.
translation:
  language: ru
  text: Всадники мчатся вперёд; сверкает меч, блистает копьё[a]. Множество убитых, груды мёртвых тел! Телам нет конца — о них спотыкаются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пламя меча и молния копья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרָשׁ מַעֲלֶה
  choice: Всадники мчатся вперёд
  rationale: Единственное число פָּרָשׁ имеет собирательное значение, а причастная форма от עלה изображает наступательное движение. Русское выражение передаёт стремительность конной атаки.
- source_word: לַהַב חֶרֶב
  choice: сверкает меч
  rationale: לַהַב буквально означает «пламя, блеск» и здесь образно передаёт вспышки клинка; глагольная конструкция естественна по-русски и сохраняет зримый образ.
- source_word: בְּרַק חֲנִית
  choice: блистает копьё
  rationale: בְּרַק означает «молния, вспышка»; перевод передаёт яркий отблеск оружия, не превращая метафору в буквальное описание молнии.
- source_word: רֹב חָלָל
  choice: множество убитых
  rationale: В данной батальной сцене חָלָל обозначает павших, а רֹב подчёркивает их огромное число.
- source_word: כֹבֶד פָּגֶר
  choice: груды мёртвых тел
  rationale: Буквальная «тяжесть/масса трупов» идиоматически указывает на скопление тел; «груды» естественно и зримо передаёт смысл.
- source_word: אֵין קֵצֶה לַגְּוִיָּה
  choice: Телам нет конца
  rationale: Краткая русская формула сохраняет гиперболический акцент на неисчислимом количестве мёртвых тел.
- source_word: יכשלו בִּגְוִיָּתָם
  choice: о них спотыкаются
  rationale: יכשלו прямо означает «спотыкаются». Суффикс 3-го лица множественного числа в בִּגְוִיָּתָם формально допускает «об их телах», но его референт в контексте не вполне прозрачен; местоимение «них» естественно отсылает к только что названным телам, не создавая неясного притяжательного отношения.
theological_decisions: []
