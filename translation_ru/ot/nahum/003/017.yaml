base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/017.yaml
  text: Your guards are like locusts[a], and your scribes like swarms of locusts, settling on the walls on a cold day. The sun rises, and they fly away[d][c][b]; no one knows where they are.
translation:
  language: ru
  text: Твоя стража[a] — словно саранча, а твои писцы[b] — словно рои саранчи, которые в холодный день садятся на оградах[c]. Солнце взошло — и они улетают; неизвестно их место — где они?[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твои венценосцы», «твои князья» или «твои посвящённые»; значение редкого еврейского слова неясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «твои сановники», «твои начальники» или «твои военачальники».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может также означать стены, заграждения или огороженные места.
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «неизвестно место его — где они?» В еврейском тексте слово «место» стоит в единственном числе, а заключительное «где они?» — во множественном; возможно, это продолжение собирательного образа саранчи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְּזָרַיִךְ
  choice: твоя стража
  rationale: Редкое и спорное слово обозначает, вероятно, особую группу высокопоставленных или охраняющих лиц. В контексте насмешки над защитниками Ниневии «стража» естественно передаёт вероятную функцию, а иные значения сохранены в примечании.
- source_word: כָּאַרְבֶּה
  choice: словно саранча
  rationale: Сравнение имеет собирательный смысл; русское «саранча» естественно обозначает множество насекомых.
- source_word: טַפְסְרַיִךְ
  choice: твои писцы
  rationale: Заимствованное слово может обозначать писцов или высоких административных и военных должностных лиц. «Писцы» сохраняет вероятное основное значение, а альтернативы вынесены в примечание.
- source_word: כְּגֹב גֹבָי
  choice: словно рои саранчи
  rationale: Повторенная форма усиливает образ многочисленной массы саранчи; «рои» ясно и естественно передаёт собирательность.
- source_word: הַחוֹנִים
  choice: которые ... садятся
  rationale: Причастие от חנה означает располагаться, становиться лагерем или оседать. В отношении насекомых естественно русское «садятся».
- source_word: בַּגְּדֵרוֹת
  choice: на оградах
  rationale: Существительное может обозначать ограды, стены или заграждения. «Ограды» сохраняет широту предметного значения и не ограничивает образ городскими стенами.
- source_word: בְּיוֹם קָרָה
  choice: в холодный день
  rationale: Прямое и естественное соответствие еврейскому временному обороту.
- source_word: שֶׁמֶשׁ זָרְחָה
  choice: восходит солнце
  rationale: Поэтическое настоящее живо передаёт момент появления солнечного тепла.
- source_word: וְנוֹדַד
  choice: они улетают
  rationale: Глагол означает удаляться, бежать или странствовать; в развёрнутом образе саранчи «улетают» передаёт действие естественно, при этом множественное число согласуется с изображёнными группами людей.
- source_word: וְלֹא נוֹדַע מְקוֹמוֹ אַיָּם
  choice: никто не знает, где они
  rationale: Так естественно передан смысл внезапного исчезновения. Необычный переход от единственного «его место» к вопросу о множестве отражён в примечании.
