lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי עָלַיִךְ
  choice: И Я брошу на тебя
  rationale: Глагол שלך в породе hифиль означает намеренно бросить или швырнуть; сочетание с עַל сохраняет конкретный образ того, что бросают на олицетворённую Ниневию.
- source_word: שִׁקֻּצִים
  choice: мерзость
  rationale: Слово обозначает нечто отвратительное, оскверняющее или вызывающее отвращение. «Мерзость» сохраняет как предметный образ унижения, так и возможный нравственно-ритуальный оттенок; иные значения отмечены в сноске.
- source_word: וְנִבַּלְתִּיךְ
  choice: опозорю тебя
  rationale: Пиэль глагола נבל здесь выражает активное унижение и лишение чести. «Опозорю» естественно и ёмко передаёт результат действия.
- source_word: וְשַׂמְתִּיךְ כְּרֹאִי
  choice: выставлю напоказ
  rationale: Буквально речь идёт о том, чтобы сделать Ниневию предметом созерцания. Русское выражение передаёт публичное выставление и подразумеваемый позор без архаизма.
theological_decisions:
- issue: Образ унижения Ниневии, олицетворённой как женщина
  choice: Сохранить суровый образ Божьего суда и публичного позора без смягчения.
  alternative: 'Передать более буквально: «сделаю тебя отвратительной и поставлю как зрелище».'
  rationale: Еврейский текст изображает намеренное публичное унижение города. Перевод сохраняет силу пророческого суда, не добавляя сексуализированных или конфессионально обусловленных смыслов.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавное «Я» подчёркивает говорящего Бога без введения отсутствующего в тексте имени. Формулировка сохраняет параллельную последовательность трёх действий и обращение к Ниневии во втором лице женского рода.
