    reason: Сохраняет неопределённую сферу отрицания в выражении was not from God’s law.
  - marker: d
    text: 'Формулировка доступного свидетельства неясна: буквально Иосиф предполагал, что учитель «уже не был неопытен и пострадал». Возможно, это отсылает к предыдущим рассказам об учителях, но текст не уточняет этого.'
    reason: Объясняет синтаксически и повествовательно трудную фразу, не отождествляя учителя с конкретным персонажем и не определяя вид его страдания.
  - marker: e
