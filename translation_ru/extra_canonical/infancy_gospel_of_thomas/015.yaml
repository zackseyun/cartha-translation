  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/015.yaml
  text: '(1) Some days later, another teacher again said to Joseph, Jesus’ father, “Come, brother, give him to me at the school, so that I can teach him letters with flattery.”


    Joseph said to him, “If you have courage, brother, take him with salvation.”


    The teacher took the child by the hand and led him away with great fear and concern. The child went gladly.


    (2) When Jesus entered the school, he found a book lying on the lectern. He picked it up, but he did not read what was written in it, because it was not from God’s law. Instead, he opened his mouth and uttered such impressive words that the teacher sitting opposite him listened with great delight and encouraged him to say more. The crowd standing there was amazed at his holy words.


    (3) Joseph quickly ran to the school, suspecting that this teacher was no longer inexperienced and had suffered. But the teacher said to Joseph, “So that you may know, brother, I did indeed take your child as a disciple, but he is full of great grace and wisdom. Therefore, brother, lead him away with salvation into your house.”


    (4) Jesus said to the teacher, “Since you have spoken correctly and testified correctly, the one struck down will also be saved because of you.” Immediately, that teacher also was saved. Joseph took the child and led him away into his house.'
translation:
  language: ru
  text: 'Евангелие детства от Фомы — Глава 15. Третий учитель


    (1) Спустя несколько дней ещё один учитель сказал Иосифу, отцу Иисуса:


    — Приди, брат, отдай Его мне в школу, чтобы я лаской научил Его буквам.[a]


    Иосиф ответил ему:


    — Если у тебя хватит мужества, брат, возьми Его с миром.[b]


    Учитель взял Ребёнка за руку и повёл с великим страхом и тревогой. А Ребёнок шёл охотно.


    (2) Войдя в школу, Иисус увидел книгу, лежавшую на подставке. Он взял её, но не стал читать написанное в ней, потому что оно было не из Закона Божьего.[c] Вместо этого Он открыл уста и произнёс столь поразительные слова, что сидевший напротив учитель слушал Его с великой радостью и побуждал говорить дальше. Стоявшая там толпа дивилась Его святым словам.


    (3) Иосиф поспешно прибежал в школу, предполагая, что и этот учитель уже не остался неопытным и пострадал.[d] Но учитель сказал Иосифу:


    — Знай, брат: я действительно взял твоего Ребёнка как ученика, но Он исполнен великой благодати и мудрости. Поэтому, брат, уведи Его с миром в свой дом.[b]


    (4) Иисус сказал учителю:


    — Поскольку ты говорил верно и свидетельствовал верно, благодаря тебе будет спасён и поражённый.[e]


    И тотчас этот учитель также был спасён.[f] Иосиф взял Ребёнка и отвёл Его в свой дом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лестью». Здесь, вероятно, имеется в виду мягкое уговаривание или доброжелательное обращение.'
    reason: Английский свидетель использует неоднозначное flattery; современное русское «лесть» обычно несёт более выраженный отрицательный оттенок.
  - marker: b
    text: 'Буквально: «со спасением». Необычный оборот, вероятно, выражает пожелание благополучия или невредимости.'
    reason: Сохраняет заметность трудного выражения with salvation, встречающегося в главе дважды, не делая русский текст неестественным.
  - marker: c
    text: 'Возможный смысл: книга не содержала текста Божьего Закона.'
    reason: Фраза может характеризовать либо саму книгу, либо написанный в ней текст; перевод оставляет границы значения открытыми.
  - marker: d
    text: То есть, по-видимому, Иосиф опасался, что учитель уже на собственном горьком опыте узнал, что бывает с теми, кто пытается учить Иисуса. Формулировка доступного свидетельства неясна.
    reason: Конструкция «уже не был неопытным и пострадал» необычна и может зависеть от греческой рукописной традиции; прямой обзор греческого источника ещё не выполнен.
  - marker: e
    text: Не уточняется, кто назван «поражённым» и в чём состояло его поражение.
    reason: Не позволяет молча отождествить персонажа с конкретным учителем из предыдущего эпизода или заменить поражение смертью, болезнью либо проклятием.
  - marker: f
    text: Здесь не уточняется, означает ли «спасён» телесное избавление, восстановление или спасение в более широком смысле.
    reason: Сохраняет богословскую и повествовательную многозначность слова saved.
lexical_decisions:
- source_word: with flattery
  choice: лаской
  rationale: Передаёт способ мягкого, располагающего убеждения без отрицательного оттенка корыстной «лести», который в современном русском мог бы неоправданно очернить намерение учителя; неоднозначность отмечена сноской.
- source_word: letters
  choice: буквам
  rationale: Сохраняет конкретное значение начального обучения грамоте и связь эпизода с предшествующими рассказами об алфавите.
- source_word: with salvation
  choice: с миром
  rationale: Даёт понятную русскую формулу благополучного ухода, но не скрывает необычность исходного оборота; буквальный смысл указан в сноске.
- source_word: lectern
  choice: подставке
  rationale: Нейтральное обозначение опоры для книги; слово «аналой» внесло бы более позднюю церковно-литургическую окраску.
- source_word: was not from God’s law
  choice: было не из Закона Божьего
  rationale: Сохраняет формальную связь с Божьим Законом и не уточняет без достаточного основания, была ли это неканоническая книга или текст иного рода.
- source_word: the one struck down
  choice: поражённый
  rationale: Сохраняет неопределённость личности и характера поражения, не подставляя конкретного персонажа из предшествующего повествования.
theological_decisions:
- issue: Смысл выражения «будет спасён» применительно к поражённому и учителю
  choice: Сохранено слово «спасён» без пояснения вида спасения
  alternative: «исцелён», «оживёт» или «будет избавлен»
  rationale: Свидетель допускает как телесное избавление, так и более широкий богословский смысл; конкретизация устранила бы подлинную неоднозначность.
- issue: Причинная формула «благодаря тебе»
  choice: Сохранена непосредственная связь спасения поражённого со словами учителя
  alternative: Ослабить до «после твоих слов»
  rationale: Текст прямо выражает причинную или посредническую связь; её не следует гармонизировать или богословски переопределять.
- issue: «Святые слова» ребёнка Иисуса
  choice: Передано прямо как «Его святые слова»
  alternative: «возвышенные слова»
  rationale: Сохраняется религиозная характеристика речи, явно присутствующая в доступном свидетельстве.
translation_notes:
  register: 'Современный литературный русский язык с ясным повествовательным ритмом и умеренно возвышенной библейской окраской («Закон Божий», «открыл уста», «исполнен благодати»). Местоимения, относящиеся к Иисусу, написаны с прописной буквы как редакционная норма почтительного религиозного текста, без изменения смысла. Перевод предварительный: предоставлен английский публично-доменный свидетель, тогда как непосредственная сверка с греческой рукописной традицией ещё ожидается. Поэтому трудные обороты сохранены или явно отмечены, а не исправлены посредством догадки.'
