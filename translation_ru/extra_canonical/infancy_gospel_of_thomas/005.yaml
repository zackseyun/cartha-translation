translation:
  language: ru
  text: '(1) Иосиф сказал Иисусу: «Почему ты говоришь такое, а они страдают и ненавидят нас?»


    Ребёнок ответил Иосифу: «Раз ты знаешь мудрые изречения, тебе небезызвестно, откуда они взялись; [a]они были сказаны о пятилетнем.[b] И они не восстанут, а эти понесут наказание».[c]


    И тотчас обвинявшие его ослепли.


    (2) Тогда Иосиф взял его — Иисуса — за ухо и сильно потянул.


    (3) Иисус сказал ему: «Довольно с тебя того, что ты ищешь и находишь меня; не следует тебе вдобавок бичевать меня, приняв на себя природное неведение.[d] Ты не увидел меня ясно — почему же я твой?[e] Вот, я покорился тебе».[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Всё высказывание ребёнка в этом месте передано по трудному и, вероятно, повреждённому тексту; прямая сверка с греческой рукописной традицией ещё требуется.
    reason: Предупреждает читателя о предварительном характере реконструкции, не скрывая текстологическую неопределённость.
  - marker: b
    text: 'Буквально по имеющемуся английскому свидетельству: «они были сказаны о пятилетнем»; связь этой фразы с предыдущими словами неясна.'
    reason: Сохраняет необычное указание на возраст и отмечает синтаксическую трудность.
  - marker: c
    text: Неясно, к кому относятся «они» и «эти», а «восстанут» может означать «поднимутся», «оживут» или иметь оттенок воскресения.
    reason: Фиксирует местоименную и смысловую неоднозначность без навязывания толкования.
  - marker: d
    text: Выражение «природное неведение» неясно; возможны иные понимания после проверки греческого текста.
    reason: Не позволяет представить предварительный буквальный оборот как надёжно установленный смысл.
  - marker: e
    text: 'Возможен и иной синтаксический разбор: «Ты не увидел ясно, кто я для тебя» или «что я твой».'
    reason: Показывает главные варианты трудной фразы, сохраняя вопрос о принадлежности открытым.
  - marker: f
    text: 'Или: «Вот, я смирён перед тобой»; точный оттенок — покорность, усмирение или подчинение — неясен.'
    reason: Отмечает семантическую широту заключительного выражения.
lexical_decisions:
- source_word: wise words
  choice: мудрые изречения
  rationale: Передаёт предполагаемое значение без чрезмерного уточнения, что речь идёт именно о пословицах или Писании.
- source_word: they won’t be raised
  choice: они не восстанут
  rationale: Сохраняет двусмысленность между буквальным вставанием, возвращением к жизни и возможным эсхатологическим оттенком.
- source_word: became blind
  choice: ослепли
  rationale: Прямое и естественное соответствие, сохраняющее внезапность наказания.
- source_word: pulled hard
  choice: сильно потянул
  rationale: Естественно описывает резкое физическое действие Иосифа без усиления до отсутствующего в свидетельстве удара.
- source_word: scourge me
  choice: бичевать меня
  rationale: Сохраняет сильный образ наказания и необычность речи, не сводя его к более общему «наказывать».
- source_word: natural ignorance
  choice: природное неведение
  rationale: Формально сохраняет трудное и, вероятно, текстуально неясное выражение до прямой сверки с греческим источником.
- source_word: I’ve been subdued before you
  choice: я покорился тебе
  rationale: Передаёт состояние подчинения Иосифу, сохраняя напряжение между властью отца и речью ребёнка.
theological_decisions:
- issue: К кому относятся местоимения во фразе «они не восстанут, а эти понесут наказание»
  choice: Сохранены разные указательные формы без определения их референтов
  alternative: Явно отнести первую группу к пострадавшим детям, а вторую — к обвинителям
  rationale: Свидетельство неоднозначно, а прямой обзор греческого текста ещё не выполнен; уточнение искусственно разрешило бы смысл.
- issue: Возможный смысл глагола «восстанут»
  choice: Использовано «не восстанут»
  alternative: «не оживут» или «не поднимутся»
  rationale: Так сохраняется возможная связь как с физическим вставанием или оживлением, так и с богословским языком воскресения.
- issue: Отношение Иисуса к Иосифу во фразе «почему я твой»
  choice: Сохранён вопрос «почему же я твой?»
  alternative: «Ты не понял, что я принадлежу тебе»
  rationale: Исходное английское свидетельство синтаксически трудно; нельзя без греческой сверки превращать вопрос о принадлежности в утверждение сыновства.
- issue: Финальное заявление о подчинении
  choice: «Вот, я покорился тебе»
  alternative: «Вот, я смирён перед тобой»
  rationale: Выбран естественный русский оборот, который не устраняет парадокс добровольного или вынужденного подчинения.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Синтаксис сделан понятным для обычного читателя, но намеренно сохранены резкие переходы, неоднозначные местоимения и трудные богословские формулировки. Поскольку предоставлена лишь английская передача греческой рукописной традиции и прямой обзор исходного языка ожидается, текст следует считать предварительным публикационным черновиком.
