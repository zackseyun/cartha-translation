  - marker: a
    text: 'Буквально в доступном английском свидетельстве: «иссушил их скопления». Неясно, относится ли «их» к скоплениям воды, к водоёмам или к иному предшествующему элементу повествования.'
    reason: Исходная греческая формулировка ещё не сверена; доступное свидетельство сохраняет неоднозначное множественное местоимение, которое не следует разрешать в переводе.
  revision_rationale: Исправлена только непреднамеренная конкретизация спорного местоимения и уточнение образа ветра. Метафорическое «засох» сохранено без истолкования как смерти.
