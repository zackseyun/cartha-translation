base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/003.yaml
  text: '(1) Annas the high priest’s son said to him, Jesus, “Why are you doing such a thing on the Sabbath?” Then he took a willow twig, destroyed the pools, drained the water Jesus had gathered, and dried up their gatherings.


    (2) But when Jesus saw what had happened, he said to him, “Your fruit will have no root, and your shoot will be withered like a scorched branch in a violent wind!”


    (3) Immediately, that child withered away.'
translation:
  language: ru
  text: '(1) Сын первосвященника Анны сказал ему, Иисусу: «Почему ты делаешь такое в субботу?» Затем он взял ивовый прутик, разрушил водоёмы, выпустил воду, которую собрал Иисус, и иссушил её скопления.[a]


    (2) Увидев случившееся, Иисус сказал ему: «У твоего плода не будет корня, а твой побег засохнет, как обожжённая ветвь под порывом свирепого ветра!»


    (3) И тотчас этот ребёнок засох.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в доступном английском свидетельстве: «иссушил их скопления». Неясно, относится ли это к скоплениям воды или к самим водоёмам.'
    reason: Исходная греческая формулировка ещё не сверена, а доступное свидетельство сохраняет неоднозначное множественное местоимение.
lexical_decisions:
- source_word: Annas the high priest
  choice: первосвященника Анны
  rationale: Передаёт имя в традиционной русской библейской форме и сохраняет титул.
- source_word: willow twig
  choice: ивовый прутик
  rationale: Естественное современное соответствие, сохраняющее конкретный материал и небольшой размер ветви.
- source_word: pools
  choice: водоёмы
  rationale: Нейтральное обозначение небольших устроенных скоплений воды без чрезмерного уточнения их формы.
- source_word: withered away / withered
  choice: засохнет / засох
  rationale: Сохраняет намеренный словесный повтор между пророческим изречением и его немедленным исполнением.
theological_decisions:
- issue: Причинная связь между словами Иисуса и смертью или состоянием ребёнка
  choice: Сохранено буквальное «засох», без пояснения, что ребёнок умер
  alternative: «умер» или «иссох и умер»
  rationale: Свидетель использует образное «withered away»; конкретизация как смерти сняла бы присущую тексту неоднозначность.
- issue: Форма высказывания о плоде и побеге
  choice: Сохранены метафоры корня, плода и побега
  alternative: Передать как прямое проклятие или предсказание гибели
  rationale: Образность и богословское напряжение текста не должны разрешаться толкованием внутри перевода.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Поскольку прямая сверка с греческой рукописной традицией ожидается, перевод остаётся предварительным и опирается на предоставленное публично-доменное английское свидетельство; спорная фраза отмечена сноской.
