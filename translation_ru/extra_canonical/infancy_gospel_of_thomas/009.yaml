lexical_decisions:
- source_word: roof of an upstairs room
  choice: на крыше одной горницы
  rationale: «Горница» естественно и кратко передаёт верхнее помещение дома, сохраняя пространственное различие между комнатой и её крышей.
- source_word: pushed down
  choice: столкнул / сталкивал
  rationale: Глагол ясно выражает обвинение в том, что Иисус намеренно сбросил ребёнка с крыши; повтор обвинения сохранён.
- source_word: body
  choice: телом
  rationale: Нейтральное «тело» соответствует повествованию и не добавляет более резкого слова «труп».
- source_word: sir
  choice: господин
  rationale: Сохраняет уважительное обращение и возможную смысловую неоднозначность без усиления до богословского титула «Господь».
- source_word: Fall asleep
  choice: Усни
  rationale: Сохраняет эвфемистическую и богословски напряжённую формулировку источника, не заменяя её прямым «умри».
- source_word: worshipped
  choice: поклонились
  rationale: Передаёт действие почтительного или религиозного поклонения, не уточняя его степень сверх доступного свидетельства.
- source_word: child Jesus
  choice: младенцу Иисусу
  rationale: Традиционное русское обозначение Иисуса в повествованиях о детстве; возрастная категория источника передана без добавочного титула.
theological_decisions:
- issue: Смысл повеления «Fall asleep» после воскрешения
  choice: «Усни!»
  alternative: «Умри снова!»
  rationale: Буквальный образ сна сохраняет эвфемизм и не разрешает явно, описывает ли текст повторную смерть.
- issue: Характер поклонения ребёнку Иисусу
  choice: «поклонились младенцу Иисусу»
  alternative: «почтили младенца Иисуса» или «поклонились Иисусу как Богу»
  rationale: Выбранная формулировка сохраняет силу действия, но не навязывает ни ослабляющего, ни догматически уточняющего толкования.
- issue: Обращение воскресшего Зенона к Иисусу
  choice: «Нет, господин»
  alternative: «Нет, Господи»
  rationale: Строчная буква и форма «господин» сохраняют социально-почтительное обращение, не превращая его без достаточных оснований в исповедание божественного титула.
translation_notes:
  register: Современный литературный русский язык с достоинством апокрифического повествования. Синтаксис упрощён там, где буквальное накопление союзов звучало бы тяжеловесно, но последовательность событий, повторы и смысловые напряжения сохранены. Реплики оформлены естественным русским диалогом.
