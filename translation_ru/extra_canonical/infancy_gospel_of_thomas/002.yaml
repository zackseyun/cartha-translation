lexical_decisions:
- source_word: child Jesus
  choice: младенец Иисус
  rationale: Сохраняет традиционный для древнехристианского произведения способ именования маленького Иисуса; указанный возраст предотвращает неверное понимание слова «младенец» в строго возрастном смысле.
- source_word: ford of a flowing stream
  choice: у брода через проточный ручей
  rationale: Передаёт и место игры, и движение воды естественным современным русским языком.
- source_word: clean and excellent
  choice: чистой и прекрасной
  rationale: Сохраняет двойную положительную характеристику воды, не сводя второй эпитет к практической пригодности.
- source_word: ordering them by word alone – and not ordering them by a deed
  choice: повелевая ей одним лишь словом, а не каким-либо действием
  rationale: Сохранено необычное противопоставление слова и действия, хотя его точная греческая формулировка требует проверки по рукописной традиции.
- source_word: slandered
  choice: донёс на
  rationale: По контексту персонаж сообщает Иосифу о предполагаемом нарушении субботы; формулировка сохраняет отрицательный оттенок, но звучит естественнее буквального «оклеветал».
- source_word: made clay
  choice: приготовил глину
  rationale: Передаёт подразумеваемое разминание или обработку глины, рассматриваемое обвинителем как запрещённая субботняя работа.
- source_word: Go, take flight like living beings!
  choice: Летите! Взмывайте, как живые!
  rationale: Передаёт два повелительных элемента и чудесное оживление фигурок, не утверждая сверх текста, каким именно образом они получили жизнь.
- source_word: squawking
  choice: с щебетом
  rationale: Естественное русское обозначение слышимого голоса воробьёв; не усиливает его до резкого крика без проверки греческого глагола.
theological_decisions:
- issue: Повеление словом и противопоставление действию
  choice: 'Сохранить прямое противопоставление: «одним лишь словом, а не каким-либо действием»'
  alternative: Сгладить как «одним только словом» и опустить вторую часть
  rationale: Необычная формула может иметь повествовательное или богословское значение, поэтому её не следует молча упрощать.
- issue: Оживление глиняных птиц
  choice: «как живые»
  alternative: «станьте живыми»
  rationale: Исходное свидетельство формулирует приказ через сравнение; перевод не превращает его в более явное онтологическое утверждение.
- issue: Обозначение Иосифа отцом Иисуса
  choice: «к его отцу Иосифу»
  alternative: «к Иосифу, считавшемуся его отцом»
  rationale: Сохранена прямая повествовательная формулировка источника без привнесения позднейшего догматического пояснения.
- issue: Смена обозначения персонажа с «одного иудея» на «фарисея»
  choice: Сохранить оба обозначения и отметить несогласованность сноской
  alternative: Унифицировать персонажа как иудея или фарисея
  rationale: Свидетельство меняет обозначение персонажа; унификация молча разрешила бы реальную текстовую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис упрощён там, где это не устраняет повторов и смысловые напряжения источника. Поскольку прямое изучение греческого текста ещё не проведено, решения основаны на предоставленном общедоступном английском свидетельстве и должны считаться предварительными. Маркер [a] поставлен при слове «фарисей», к которому относится примечание.
