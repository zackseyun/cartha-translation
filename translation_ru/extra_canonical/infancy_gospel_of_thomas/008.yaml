base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/008.yaml
  text: '(1) The child Jesus laughed and said, “Now may the barren bear fruit, the blind see, and the foolish in heart understand that I am here from above, so that I may deliver those below and call them up, just as the one who sent me to you commanded me.”


    (2) Immediately, all who had fallen under his curse were saved. From then on, no one dared to provoke him.'
translation:
  language: ru
  text: '(1) Младенец Иисус рассмеялся и сказал: «Пусть же теперь бесплодные принесут плод, слепые прозреют, а неразумные сердцем обретут понимание: я пришёл свыше, чтобы избавить тех, кто внизу, и призвать их наверх, как повелел мне Пославший меня к вам».


    (2) И тотчас все, кто оказался под его проклятием, были спасены. С тех пор никто не осмеливался его гневить.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the child Jesus
  choice: младенец Иисус
  rationale: Сохраняет традиционное обозначение героя повествования и соответствует жанру евангелия детства; «ребёнок Иисус» было бы разговорнее.
- source_word: the barren bear fruit
  choice: бесплодные принесут плод
  rationale: 'Сохранена образность свидетеля и возможная многозначность: речь может идти как о бесплодии, так и о духовной плодоносности.'
- source_word: the foolish in heart find understanding
  choice: неразумные сердцем обретут понимание
  rationale: Передаёт семитизированное сочетание «сердцем» и не сводит его исключительно к интеллектуальной способности.
- source_word: I’m here from above
  choice: я пришёл свыше
  rationale: Естественная русская формулировка, сохраняющая указание на небесное происхождение или посланничество.
- source_word: deliver those below
  choice: избавить тех, кто внизу
  rationale: «Избавить» сохраняет широкий смысл спасения или освобождения; пространственная антитеза «свыше — внизу» оставлена явной.
- source_word: call them up
  choice: призвать их наверх
  rationale: Сохранено буквальное пространственное направление и возможный богословский подтекст без уточнения его природы.
- source_word: saved
  choice: были спасены
  rationale: Передаёт сильный сотериологический глагол свидетеля, не заменяя его более узким «исцелены» или «освобождены».
- source_word: provoke him
  choice: его гневить
  rationale: В контексте последствий проклятия означает навлекать его гнев; формулировка естественна по-русски и не предполагает лишь словесной провокации.
theological_decisions:
- issue: Вертикальная образность происхождения и спасения
  choice: «пришёл свыше… тех, кто внизу… призвать их наверх»
  alternative: «пришёл с небес… спасти земных… вознести их»
  rationale: Выбранный вариант сохраняет неоднозначную пространственно-богословскую образность и не вводит более определённые понятия небес или вознесения.
- issue: Действие над находившимися под проклятием
  choice: «были спасены»
  alternative: «были освобождены от проклятия»
  rationale: Сохранена формулировка доступного свидетеля, допускающая как снятие проклятия, так и более широкий смысл спасения.
- issue: Обозначение пославшего Иисуса
  choice: «Пославший меня»
  alternative: «тот, кто послал меня»
  rationale: Прописная буква ненавязчиво указывает на Бога как подразумеваемого Пославшего, не добавляя имени или конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Поскольку непосредственная сверка с греческими рукописями ещё не проведена, текст следует считать предварительным переводом по публичному английскому свидетелю; спорные пространственные и сотериологические выражения намеренно сохранены без догматического уточнения.
