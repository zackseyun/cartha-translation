base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/011.yaml
  text: '(1) The child Jesus was about seven years old, and his mother Mary sent him to fetch water. But there was a large crowd at the cistern, and the pitcher was struck and broke.


    (2) Jesus spread out the cloak he was wearing, filled it with water, and carried it to his mother. Mary saw the sign Jesus had performed. She kissed him and said, “Lord, my God, bless our child,” because they were afraid that someone might bewitch him.'
translation:
  language: ru
  text: '**Евангелие детства от Фомы — глава 11. Иисус приносит воду в своём плаще**


    (1) Ребёнку Иисусу было около семи лет. Его мать Мария послала его за водой. Но у водоёма собралась большая толпа; кувшин задели, и он разбился.


    (2) Тогда Иисус расправил плащ, который был на нём, набрал в него воды и принёс матери. Увидев знамение, совершённое Иисусом, Мария поцеловала его и сказала: «Господи, Боже мой, благослови наше дитя». Ведь они боялись, как бы кто-нибудь его не околдовал.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: child Jesus
  choice: ребёнку Иисусу / Иисус
  rationale: Естественная современная русская формулировка сохраняет указание на детский возраст, не повторяя его там, где имя уже достаточно ясно.
- source_word: water cistern
  choice: водоём
  rationale: Передаёт место общего набора воды без чрезмерно конкретного предположения о конструкции цистерны; прямой обзор греческого чтения ещё требуется.
- source_word: pitcher was struck
  choice: кувшин задели
  rationale: 'Сохраняет пассивный и неопределённый характер происшествия: не уточняется, кто именно ударил или опрокинул сосуд.'
- source_word: cloak
  choice: плащ
  rationale: Понятное современному читателю обозначение верхней одежды, которую можно расправить и использовать в повествовании как вместилище.
- source_word: sign
  choice: знамение
  rationale: Сохраняет религиозно значимый оттенок необычного деяния, не заменяя его более истолковывающим словом «чудо».
- source_word: bewitch
  choice: околдовал
  rationale: Прямо передаёт страх перед наведением колдовского воздействия, не рационализируя и не смягчая древнее представление.
theological_decisions:
- issue: Обращение Марии «Lord, my God»
  choice: «Господи, Боже мой»
  alternative: «Господь, Бог мой»
  rationale: Использован естественный русский звательный оборот как обращение к Богу; текст не переиначен так, будто Мария обращается к ребёнку.
- issue: Кто обозначен местоимением «они» в объяснении страха
  choice: «они боялись»
  alternative: «Мария боялась»
  rationale: Сохранено множественное число свидетеля, хотя его точный референт в данном отрывке не назван; неоднозначность не устранена редакторским предположением.
- issue: Характер деяния Иисуса
  choice: «знамение»
  alternative: «чудо»
  rationale: Выбор ближе к формулировке доступного свидетеля и не навязывает дополнительной классификации события.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и ясным повествовательным ритмом. Перевод предварительный: он выполнен по предоставленному англоязычному публичнодоменному свидетелю; непосредственная сверка с греческой рукописной традицией ещё не проведена. Поэтому спорные детали не конкретизированы сверх доступного основания.'
