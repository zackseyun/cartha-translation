    (2) Тогда Иисус расправил плащ, который был на нём, набрал в него воды и принёс матери. Увидев знамение, совершённое Иисусом, Мария поцеловала его и сказала: «Господи, Боже мой, благослови наше дитя». Ведь они боялись, как бы кто-нибудь его не околдовал.'
  revised_footnotes: []
