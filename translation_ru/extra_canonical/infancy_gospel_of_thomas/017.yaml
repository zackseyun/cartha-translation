translation:
  language: ru
  text: '(1) После этого по соседству с Иосифом заболел и умер один младенец. Его мать горько плакала.


    Услышав громкий плач и смятение, Иисус поспешно прибежал туда. Он увидел, что ребёнок мёртв, прикоснулся к его груди и сказал: «Говорю тебе, младенец: не умирай, но живи и будь со своей матерью».


    Младенец тотчас открыл глаза и засмеялся. Иисус сказал матери: «Возьми своего ребёнка, накорми его молоком и помни обо Мне».


    (2) Стоявшие там люди изумились и сказали: «Поистине, этот ребёнок — бог или ангел, ведь каждое его слово становится делом!»[a]


    А Иисус снова ушёл играть с детьми.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: прямая сверка с греческой рукописной традицией ещё не проведена. Выражение «бог или ангел» может означать, что толпа считает Иисуса божественным существом либо ангелом; написание «Бог» сделало бы это высказывание более определённым, чем позволяет доступное английское свидетельство.'
    reason: Необходимо обозначить ограниченность источниковой основы и сохранить богословскую неоднозначность реплики толпы.
lexical_decisions:
- source_word: baby
  choice: младенец / ребёнок
  rationale: «Младенец» сохраняет указание на возраст в ключевых местах, а «ребёнок» естественно звучит в обращении к матери и позволяет избежать тяжеловесного повтора.
- source_word: great grief and commotion
  choice: громкий плач и смятение
  rationale: Передаёт одновременно скорбь и вызванное ею волнение; формулировка опирается на предоставленное английское свидетельство, поскольку сверка с греческим текстом ещё не проведена.
- source_word: touched his chest
  choice: прикоснулся к его груди
  rationale: Формально и естественно передаёт описанное телесное действие без добавления медицинского или символического смысла.
- source_word: looked up
  choice: открыл глаза
  rationale: В контексте оживления младенца это естественное русское выражение; однако точный греческий глагол не проверен, поэтому решение остаётся предварительным.
- source_word: remember me
  choice: помни обо Мне
  rationale: Сохраняет прямое и богословски неуточнённое требование помнить Иисуса, не заменяя его благодарностью или почитанием.
- source_word: every word becomes a deed
  choice: каждое его слово становится делом
  rationale: Сохраняет выразительную связь между словом и совершившимся действием, не сводя её к более узкому «исполняется».
theological_decisions:
- issue: Высказывание толпы о природе Иисуса
  choice: «этот ребёнок — бог или ангел»
  alternative: «этот ребёнок — Бог или ангел»
  rationale: Строчная буква сохраняет неоднозначную, исходящую от изумлённой толпы классификацию «божественное существо или ангел» и не превращает её без достаточного основания в однозначное исповедание тождества с Богом. Вариант отмечен сноской.
- issue: Действенность слова Иисуса
  choice: «каждое его слово становится делом»
  alternative: «каждое его слово исполняется»
  rationale: Выбранная формулировка сохраняет напряжённое утверждение о том, что слово непосредственно становится действием, не сглаживая его до обычного исполнения предсказания.
translation_notes:
  register: Современный литературный русский язык с простым, повествовательным и достойным звучанием. Сохранены нумерация частей, краткие фразы и детская сцена в финале. Черновик основан на предоставленном публично-доступном английском свидетельстве; до прямой проверки греческого текста лексические нюансы считаются предварительными.
