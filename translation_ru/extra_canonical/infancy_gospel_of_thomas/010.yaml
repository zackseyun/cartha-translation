translation:
  language: ru
  text: 'В рукописи Hagios Saba 259 этот отрывок расположен после главы 16.[a]


    (1) И снова: один юноша раскалывал дерево на равные части. Он рассёк себе подошву, истёк кровью и умер.


    (2) Поднялся переполох, и Иисус прибежал туда. Протиснувшись сквозь толпу, Он взялся за повреждённую стопу, и та тотчас исцелилась. Иисус сказал юноше: «Иди, раскалывай своё дерево».


    (3) Увидев это, люди изумились и сказали: «Он спас от смерти уже многие души и будет спасать во все дни Своей жизни».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописи Hagios Saba 259 этот эпизод следует после главы 16; в других формах текста порядок глав может отличаться.
    reason: Поясняет рукописное расположение отрывка и не представляет его как часть самого повествования.
  - marker: b
    text: Выражение «души» может здесь обозначать людей или их жизни; перевод сохраняет формулировку доступного свидетельства.
    reason: Сохраняет лексическую и богословскую неоднозначность, не подменяя её толкованием.
lexical_decisions:
- source_word: splitting wood into equal parts
  choice: раскалывал дерево на равные части
  rationale: Передаёт конкретное действие и указание на равные части, не уточняя без достаточных оснований, шла ли речь о дровах, брёвнах или плотницкой работе.
- source_word: bottom of his foot
  choice: подошву
  rationale: Естественное русское обозначение нижней поверхности стопы.
- source_word: bled out
  choice: истёк кровью
  rationale: Точно и литературно передаёт смертельную кровопотерю.
- source_word: commotion
  choice: переполох
  rationale: Передаёт внезапное общественное волнение в естественной современной форме.
- source_word: seized the stricken foot
  choice: взялся за повреждённую стопу
  rationale: Сохраняет физическое действие, избегая излишне резкого «схватил»; «повреждённую» не определяет точный характер раны сверх свидетельства.
- source_word: souls
  choice: души
  rationale: Сохраняет традиционную антропологическую лексику свидетельства и возможную смысловую напряжённость между «душами» и «жизнями».
theological_decisions:
- issue: Смысл выражения «спас многие души от смерти»
  choice: 'сохранено буквально: «спас от смерти уже многие души»'
  alternative: «спас от смерти уже многих людей» или «сохранил многие жизни»
  rationale: Буквальная формулировка сохраняет богословскую и антропологическую неоднозначность свидетельства, не сводя её молча только к физическому спасению.
- issue: Будущее служение Иисуса
  choice: «будет спасать во все дни Своей жизни»
  alternative: «будет продолжать спасать до конца Своей жизни»
  rationale: Сохранён необычный временной оборот и его напряжённость; более гладкая альтернатива сильнее истолковывает смысл.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом и умеренно возвышенной евангельской интонацией. Местоимения, относящиеся к Иисусу, написаны с прописной буквы как редакционный знак уважительного регистра, без изменения смысла. Поскольку непосредственная сверка с греческим источником ещё не выполнена, решения намеренно консервативны и основаны на предоставленном публичном английском свидетельстве.
