translation:
  language: ru
  text: '(1) Оттуда Он шёл со Своим отцом Иосифом, и кто-то, пробегая мимо, толкнул Его в плечо. И Иисус сказал ему: «Будь проклят из-за своего предводителя!»[a]


    И тотчас тот умер.


    Люди, увидевшие, что он тотчас умер, вскричали: «Откуда родился этот ребёнок, что Его слово становится делом?»[b]


    (2) Когда родители умершего ребёнка увидели, что произошло, они стали обвинять Иосифа, Его отца, говоря: «Откуда бы ни был у тебя этот ребёнок, ты не можешь жить с нами в этом селении. Если хочешь оставаться здесь, научи Его благословлять, а не проклинать, потому что нашего ребёнка у нас отняли».


    [a] Необычная фраза «из-за своего предводителя» передана буквально по доступному английскому свидетельству; её смысл и греческое чтение требуют проверки по рукописям.


    [b] Буквально по доступному свидетельству: «Откуда был рождён этот ребёнок?» Вопрос выражает изумление происхождением ребёнка, чьё слово немедленно исполняется.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Необычная фраза «из-за своего предводителя» передана буквально по доступному английскому свидетельству; её смысл и греческое чтение требуют проверки по рукописям.
