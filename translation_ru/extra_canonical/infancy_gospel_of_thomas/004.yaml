  naturalness: 'Требуется небольшая стилистическая правка: «Откуда бы ни взялся у тебя этот ребёнок» — естественная современная русская конструкция без добавления смысла. В реплике свидетелей «Откуда же родом этот ребёнок» звучит литературно и сохраняет вопрос о происхождении.'
  terminology: Имена Иисус и Иосиф переданы последовательно. «Предводитель» оправданно сохраняет неясность английского свидетельства; сноска необходима. Термины «благословлять» и «проклинать» соответствуют исходному тексту и регистру.
