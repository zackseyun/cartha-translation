    reason: Объясняет необычную семитизированную или буквально переданную вопросительную конструкцию, сохраняя её риторическую силу.
lexical_decisions:
- source_word: someone running struck his shoulder
  choice: кто-то, пробегая мимо, толкнул Его в плечо
  rationale: Передаёт случайное столкновение естественным современным русским языком, не уточняя личность бегущего, которая в доступном свидетельстве не названа.
- source_word: Cursed be you because of your leader
  choice: Будь проклят из-за своего предводителя
  rationale: Сохраняет необычную причинную конструкцию и слово «предводитель», не подменяя неясный смысл более привычной формулой; неопределённость отмечена сноской.
- source_word: his word becomes deed
  choice: Его слово становится делом
  rationale: Сохраняет выразительный параллелизм свидетельства и мысль о немедленном осуществлении сказанного.
- source_word: has been taken away from us
  choice: у нас отняли
  rationale: Передаёт переживание утраты и допускает подразумеваемую безличную силу, не добавляя прямого обвинения Иисуса, которого формулировка явно не называет.
theological_decisions:
- issue: Связь проклятия Иисуса со смертью ребёнка
  choice: Сохранена последовательность повествования без объяснения причинности
  alternative: Явно сказать, что Иисус убил ребёнка Своим словом
  rationale: Текст ставит высказывание и смерть рядом, но перевод не должен усиливать повествование внесённым причинным утверждением.
- issue: Неясное основание проклятия
  choice: Сохранена формула «из-за своего предводителя»
  alternative: Истолковать её как ссылку на власть, учителя, старшего или дурное поведение
  rationale: При отсутствии завершённой проверки греческого источника богословски и текстологически безопаснее сохранить подлинную неясность.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского повествования. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской религиозно-издательской норме. Перевод остаётся предварительным, поскольку предоставлена лишь английская передача греческой рукописной традиции, а прямая сверка с древнегреческим источником ещё не выполнена.
