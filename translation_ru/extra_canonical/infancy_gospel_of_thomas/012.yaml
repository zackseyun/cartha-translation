base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/012.yaml
  text: '(1) At sowing time, Joseph sowed seed, and the child Jesus sowed one measure of wheat.


    (2) His father harvested a hundred large measures. He gave generously to the poor and the orphans. But Joseph took from Jesus’ seed.'
translation:
  language: ru
  text: '(1) Во время сева Иосиф сеял зерно, а ребёнок Иисус посеял одну меру пшеницы.


    (2) Его отец собрал сто больших мер. Он щедро раздал их бедным и сиротам. Но Иосиф взял их из посеянного Иисусом.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в доступном английском свидетельстве: «Но Иосиф взял из семян Иисуса». Перевод предварительный; прямая сверка с греческой рукописной традицией ещё не проведена.'
    reason: Заключительная фраза в исходном свидетельстве неоднозначна, а предоставленная база не включает греческий текст.
lexical_decisions:
- source_word: at the time of the sowing
  choice: во время сева
  rationale: Естественное и точное обозначение времени посевных работ в современном литературном русском языке.
- source_word: one measure of wheat
  choice: одну меру пшеницы
  rationale: Сохраняет неопределённость древней единицы объёма и не подменяет её современной мерой.
- source_word: a hundred great measures
  choice: сто больших мер
  rationale: Передаёт количественный контраст и необычайный масштаб урожая, не конкретизируя неуказанную единицу.
- source_word: gave graciously
  choice: щедро раздал
  rationale: По контексту речь идёт о щедрой раздаче урожая нуждающимся; глагол делает объект действия понятным по-русски.
- source_word: the poor and the orphans
  choice: бедным и сиротам
  rationale: Прямое, современное и стилистически достойное соответствие.
- source_word: took from Jesus’ seeds
  choice: взял их из посеянного Иисусом
  rationale: Передаёт связь урожая с зерном, посеянным Иисусом, и избегает неестественного буквального выражения «из семян Иисуса».
theological_decisions:
- issue: Кому приписан чудесный урожай
  choice: 'Сохранена последовательность свидетельства: отец Иисуса собирает урожай, происходящий из посеянного Иисусом.'
  alternative: Явно назвать урожай чудом, совершённым Иисусом.
  rationale: Текст подразумевает чудесное умножение, но прямо не объясняет его механизм; перевод не должен добавлять богословское толкование.
- issue: Неясность заключительной фразы
  choice: «Но Иосиф взял их из посеянного Иисусом» с примечанием.
  alternative: «Иосиф взял семена Иисуса» или «Иосиф получил урожай из семян Иисуса».
  rationale: Свидетельство сформулировано сжато и несколько неясно. Основной текст предлагает естественное контекстуальное прочтение, а примечание сохраняет осведомлённость о буквальной форме и предварительном характере перевода.
translation_notes:
  register: Современный литературный русский язык с простой повествовательной структурой и умеренно возвышенным библейским звучанием. Архаизмы и конфессионально окрашенные формулировки не используются. Поскольку греческий текст не предоставлен и его проверка ожидается, draft осторожно следует доступному публичному английскому свидетельству и явно отмечает неясное место.
