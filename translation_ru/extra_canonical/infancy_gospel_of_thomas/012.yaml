review_pass:
  verdict: revise
  source_fidelity: 'Предоставленное исходное свидетельство доступно только в английской форме; прямую сверку с греческой рукописной традицией выполнить нельзя. По этому свидетельству первые предложения переданы точно. В заключении черновик чрезмерно конкретизирует смысл: местоимение «их» относит действие Иосифа к уже собранным ста мерам, тогда как «took from Jesus’ seeds» может обозначать взятие от зерна, посеянного Иисусом, без уточнения объекта или количества.'
  naturalness: '«Во время сева», «одну меру пшеницы», «сто больших мер» и «щедро раздал их бедным и сиротам» звучат естественно для современного литературного русского. Формула «взял их из посеянного Иисусом» менее удачна: у «их» нет однозначного референта, а выражение меняет смысловую определённость оригинала.'
  terminology: Имена Иосиф и Иисус переданы нормативно. «Мера» правильно сохраняет неопознанную единицу объёма. «Зерно» в заключительной фразе является естественным русским собирательным соответствием английскому seeds в данном земледельческом контексте; уточнение «посеянного Иисусом» опирается на предыдущее предложение и не называет ни объём, ни характер взятого.
  issues:
  - severity: medium
    issue: Заключительная фраза истолкована как взятие именно собранного урожая.
    rationale: «Но Иосиф взял их из посеянного Иисусом» вводит местоимение «их», естественно отсылающее к ста мерам, которых в исходной фразе нет. Следует сохранить неясность того, что именно и в каком количестве взял Иосиф.
  revised_text: '(1) Во время сева Иосиф сеял зерно, а ребёнок Иисус посеял одну меру пшеницы.


    (2) Его отец собрал сто больших мер. Он щедро раздал их бедным и сиротам. Но Иосиф взял от зерна, посеянного Иисусом.[a]'
  revised_footnotes:
  - marker: a
    text: 'Буквально в доступном английском свидетельстве: «Но Иосиф взял из семян Иисуса». Заключительная фраза не уточняет, что именно и сколько взял Иосиф; перевод предварительный, поскольку прямая сверка с греческой рукописной традицией ещё не проведена.'
    reason: Сохраняет отмеченную в свидетельстве неоднозначность и не связывает действие Иосифа однозначно со ста мерами урожая.
  revision_rationale: Исправлена только заключительная фраза и примечание к ней. Новый вариант устраняет необоснованное отнесение «взял» к уже собранным ста мерам, при этом сохраняет земледельческий контекст и смысловую неопределённость доступного свидетельства.
