  text: '(1) A teacher named Zacchaeus was standing there. He heard Jesus saying these things to his father Joseph, and he was greatly amazed.


    (2) He said to Joseph, “Come, brother, give him to me so that he may be taught letters, know all knowledge, learn to love those his own age, honor old age, and respect elders, so that he may develop a yearning for children and teach them in return.”


    (3) But Joseph said to the teacher, “Who can control this child and teach him? Do not think of him as a small person, brother.”


    But the teacher said, “Give him to me, brother, and do not let him concern you.”


    (4) The child Jesus looked at them and addressed the teacher: “Being a teacher comes naturally to you, but you are a stranger to the name by which you are called, because I am outside you and within you on account of the nobility of my birth in the flesh. But you, a lawyer, do not know the law.”


    Then he said to Joseph, “When you were born, I already existed, standing beside you, so that you, as a father, might be taught by me a teaching that no one else knows or can teach. And you will bear the name of salvation.”


    (5) The Jews cried out and said to him, “Oh, what a new and incredible wonder! The child is perhaps five years old, and oh, what words he speaks! We have never known such words. No one—neither a lawyer nor a Pharisee—has spoken like this child.”


    (6) The child answered them, “Why are you amazed? Or rather, why do you not believe the things I have told you? The truth is that I, who was created before this world, know precisely when you were born, as well as your fathers and their fathers.”


    (7) All the people who heard this were speechless and could no longer speak to him. But he went up to them, skipped around, and said, “I was playing with you because I know that you are small-minded and amazed by small things.”


    (8) When they seemed comforted by the child’s encouragement, the teacher said to his father, “Come, bring him into the school. I will teach him letters.”


    Joseph took his hand and led him into the school. The teacher flattered him and brought him into the school. Zacchaeus wrote out the alphabet for him and began to teach him, repeating the same letter frequently. But the child did not answer him.


    The teacher became irritated and struck him on the head.


    The child became irritated and said to him, “I want to teach you rather than be taught by you, since I know the letters you are teaching more precisely. To me, these things are like a noisy gong or a clanging cymbal that produces neither the sound, nor the glory, nor the power of understanding.”


    (9) When the child’s anger had ceased, he recited all the letters by himself, from alpha to omega, with great skill. Looking directly at the teacher, he said, “If you do not know the nature of the alpha, how can you teach someone else the beta? Hypocrite! If you know, first teach me the alpha, and then I will trust you to speak about the beta.” Then he began to teach the teacher about the first element, and the teacher could say nothing to him.


    (10) While many people listened, he said to the teacher, “Listen, Teacher, and understand the arrangement of the first element. Notice how it has sharp lines and a middle stroke, which you see pointing, standing with its legs apart, coming together, going out, dragging behind, lifting up, dancing around, <…>, in triple rhythm, two-cornered, of the same form, of the same thickness, of the same family, raised, balanced, isometric, and of equal proportions. These are the lines of the alpha.”'
translation:
  language: ru
  text: '(1) Там стоял учитель по имени Закхей. Услышав, что Иисус говорил это своему отцу Иосифу, он чрезвычайно удивился.


    (2) Он сказал Иосифу: «Ну же, брат, отдай его мне, чтобы он научился грамоте, овладел всяким знанием, научился любить своих сверстников, почитать старость и уважать старших, чтобы в нём пробудилась любовь к детям и он, в свою очередь, учил их».


    (3) Но Иосиф сказал учителю: «Кто сможет обуздать этого ребёнка и научить его? Не считай его малым, брат».


    Учитель же сказал: «Отдай его мне, брат, и не беспокойся о нём».


    (4) Младенец Иисус посмотрел на них и обратился к учителю с такими словами: «Быть учителем тебе дано от природы, но имя, которым тебя называют, тебе чуждо, потому что по благородству моего рождения во плоти я вне тебя и внутри тебя.[a] Но ты, знаток Закона, не знаешь Закона».


    Затем он сказал Иосифу: «Когда ты родился, я уже существовал и стоял рядом с тобой, чтобы ты, как отец, получил от меня учение, которого никто другой не знает и которому не может научить. И ты будешь носить имя спасения».[b]


    (5) Иудеи воскликнули: «О, какое новое и невероятное чудо! Ребёнку, пожалуй, лет пять — и какие слова он произносит! Мы никогда не слышали подобных слов. Никто — ни знаток Закона, ни фарисей — не говорил так, как этот ребёнок».


    (6) Ребёнок ответил им: «Почему вы удивляетесь? Или, вернее, почему не верите тому, что я вам сказал? Истинно говорю: я, сотворённый прежде этого мира,[c] точно знаю, когда родились вы, ваши отцы и их отцы».


    (7) Все, кто это слышал, лишились дара речи и больше не могли ему возражать. А он подошёл к ним, стал вприпрыжку ходить вокруг и сказал: «Я играл с вами, потому что знаю: вы мелко мыслите и удивляетесь мелочам».


    (8) Когда слова ребёнка, казалось, их успокоили, учитель сказал его отцу: «Ну же, приведи его в школу. Я научу его грамоте».


    Иосиф взял его за руку и повёл в школу. Учитель ласково уговаривал его и ввёл в школу. Закхей написал для него алфавит и начал учить, многократно повторяя одну и ту же букву. Но ребёнок ему не отвечал.


    Тогда учитель рассердился и ударил его по голове.


    Ребёнок тоже рассердился и сказал ему: «Я хочу учить тебя, а не учиться у тебя, потому что знаю буквы, которым ты учишь, точнее тебя. Для меня всё это — словно гулкий гонг или звенящий кимвал: они не передают ни звука, ни славы, ни силы разумения».[d]


    (9) Когда гнев ребёнка утих, он сам искусно произнёс все буквы — от альфы до омеги. Посмотрев учителю прямо в лицо, он сказал: «Если ты не знаешь природы альфы, как можешь учить другого бете? Лицемер! Если знаешь, сначала научи меня альфе — тогда я поверю, что ты можешь говорить о бете». Затем он стал объяснять учителю первую букву, а тот ничего не мог ему ответить.


    (10) И пока множество людей слушало, он сказал учителю: «Слушай, учитель, и уразумей устройство первой буквы. Обрати внимание: у неё есть острые линии и средняя черта; они, как ты видишь, устремляются вперёд, стоят, расставив ноги, сходятся, расходятся, тянутся позади, поднимаются, кружатся в танце, <…>, движутся в тройном ритме; они двуугольны, одинаковы по форме и толщине, родственны друг другу, приподняты, уравновешены, равномерны и соразмерны. Таковы линии альфы».[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «я вне тебя и внутри тебя» неясно; перевод сохраняет формулировку данного свидетеля, не предлагая однозначного толкования.
    reason: Сохранение подлинной смысловой неоднозначности.
  - marker: b
    text: Смысл выражения «носить имя спасения» неясен; возможно, здесь содержится игра с именем или титулом, однако данный текст её не объясняет.
    reason: Предупреждение против необоснованного богословского уточнения.
  - marker: c
    text: 'Именно так в представленном свидетеле: «сотворённый прежде этого мира».'
    reason: Фиксация богословски значимого чтения без конфессиональной гармонизации.
  - marker: d
    text: Образ гонга и кимвала напоминает 1 Кор. 13:1, однако дальнейшая формулировка здесь отличается и остаётся трудной для понимания.
    reason: Указание на вероятный литературный отзвук и неясность текста.
  - marker: e
    text: В описании начертания альфы текст труден, а в месте, обозначенном <…>, рукописный текст повреждён или утрачен.
    reason: Отражение лакуны и неясной последовательности геометрических терминов.
lexical_decisions:
- source_word: letters
  choice: грамота / буквы
  rationale: В выражении об обучении употреблено естественное русское «научиться грамоте»; при обозначении отдельных знаков алфавита сохранено «буквы».
- source_word: lawyer
  choice: знаток Закона
  rationale: Передаёт специалиста по религиозному Закону, не создавая современного значения профессионального юриста.
- source_word: first element
  choice: первая буква
  rationale: В данном контексте речь идёт об альфе как первом элементе алфавита; перевод остаётся понятным современному читателю.
- source_word: alpha / beta / omega
  choice: альфа / бета / омега
  rationale: Сохранены названия греческих букв, поскольку рассуждение зависит от их формы и порядка в греческом алфавите.
- source_word: small person
  choice: малый
  rationale: 'Не сведено просто к возрастному «маленькому ребёнку»: реплика Иосифа намекает, что Иисуса нельзя считать незначительным или обычным ребёнком.'
- source_word: yearning for children
  choice: любовь к детям
  rationale: Буквальное «томление по детям» по-русски двусмысленно и неестественно; выбран контекстуально ясный вариант без усиления смысла.
theological_decisions:
- issue: Предсуществование и сотворённость Иисуса
  choice: «я, сотворённый прежде этого мира»
  alternative: «я, существовавший прежде этого мира»
  rationale: Сохранено напряжённое и богословски значимое утверждение свидетеля о сотворённости; оно не исправлено в соответствии с позднейшими конфессиональными формулами.
- issue: Высказывание «вне тебя и внутри тебя»
  choice: Сохранено буквально с пояснительной сноской
  alternative: Истолковать как превосходство Иисуса над учителем
  rationale: Фраза неясна и, вероятно, текстологически или концептуально трудна; перевод не разрешает её неоднозначность молча.
- issue: «Имя спасения»
  choice: Сохранено как «носить имя спасения»
  alternative: Истолковать как имя Иисуса или роль Иосифа в истории спасения
  rationale: Источник не раскрывает точный смысл выражения, поэтому возможная игра имен или титулов оставлена открытой.
- issue: Библейский отзвук гонга и кимвала
  choice: «гулкий гонг или звенящий кимвал»
  alternative: «медь звенящая или кимвал звучащий»
  rationale: Сохранён узнаваемый образ, но без искусственной гармонизации с конкретным каноническим русским переводом.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис упрощён там, где буквальное воспроизведение английского посредника звучало бы тяжеловесно, но повторы, резкие реплики и богословские напряжения сохранены. Проект остаётся предварительным: предоставлен англоязычный публичный свидетель, а непосредственная сверка с греческой рукописной традицией ещё не выполнена.'
