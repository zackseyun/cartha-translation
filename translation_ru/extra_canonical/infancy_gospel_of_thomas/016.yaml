translation:
  language: ru
  text: '**Евангелие детства от Фомы — Глава 16. Иисус исцеляет Иакова после укуса змеи**


    (1) Иаков пошёл в рощу связать хворост, чтобы можно было испечь хлеб. Иисус пошёл с ним. Когда они собирали хворост, страшная змея укусила Иакова за руку.


    (2) Он лежал, распростёршись на земле, и умирал. Тогда отрок Иисус подбежал к Иакову и подул на место укуса. И тотчас укус был исцелён, змея погибла, а Иаков был спасён.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописи Hagios Saba 259 отсутствуют главы 17 и 18; поэтому следующие две главы основываются на более поздних греческих рукописях.
    reason: Текстологическое примечание относится к положению главы в рукописной традиции и необходимо для понимания основания последующего текста.
lexical_decisions:
- source_word: James
  choice: Иаков
  rationale: Традиционная русская передача библейского имени, естественная для текста раннехристианской литературы.
- source_word: grove
  choice: роща
  rationale: Прямая и понятная передача английского свидетельства без уточнения вида насаждений, не подтверждённого греческим источником.
- source_word: tie up sticks
  choice: связать хворост
  rationale: «Хворост» естественно обозначает собранные сухие ветви для топлива; глагол сохраняет указание на связывание их в вязанку.
- source_word: child Jesus
  choice: отрок Иисус
  rationale: Достоинная литературная формулировка, уместная в повествовании об Иисусе в детстве; она не уточняет возраст сверх контекста.
- source_word: blew on the bite
  choice: подул на место укуса
  rationale: В русском языке дуют не на отвлечённый «укус», а на поражённое место; действие исходного свидетельства сохранено.
- source_word: beast
  choice: змея
  rationale: В данном контексте слово явно возвращает читателя к напавшей змее; повтор существительного устраняет неестественное русское «зверь», не меняя референта.
- source_word: saved
  choice: спасён
  rationale: Сохраняет формальную и возможную богословскую насыщенность выражения, хотя в ближайшем контексте речь идёт о спасении от смерти.
theological_decisions:
- issue: Характер исцеления и гибели змеи
  choice: 'Сохранена последовательность: Иисус дует на место укуса, укус исцеляется, змея погибает, Иаков спасается.'
  alternative: Истолковать гибель змеи как символическое уничтожение яда или зла.
  rationale: Свидетельство излагает события буквально; перевод не должен вводить отсутствующее аллегорическое объяснение.
- issue: Значение слова «спасён»
  choice: Использовано «спасён».
  alternative: «Остался жив» или «избежал смерти».
  rationale: Более узкие варианты заранее свели бы смысл только к физическому выживанию; «спасён» сохраняет широту формулировки источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Избегаются как архаизмы вроде «чадо» и «древеса», так и разговорные обороты. Поскольку непосредственная сверка с греческим текстом ещё не проведена, перевод остаётся источниково осторожным и следует предоставленному публичному английскому свидетельству; текстологическая информация вынесена в отмеченную сноску.
