  text: 'I, Thomas the Israelite, considered it necessary to make known to all the Gentile brothers and sisters everything done by our Lord Jesus Christ in the village of Nazareth after he was born in our region of Bethlehem. This is the beginning:'
translation:
  language: ru
  text: 'Я, Фома Израильтянин, счёл необходимым поведать всем братьям и сёстрам из язычников обо всём, что совершил Господь наш Иисус Христос в селении Назарете после того, как родился в нашей земле, в Вифлееме. Вот начало:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Thomas the Israelite
  choice: Фома Израильтянин
  rationale: Сохранены имя и самообозначение автора; форма «израильтянин» естественна для русского библейского регистра.
- source_word: Gentile brothers (and sisters)
  choice: братьям и сёстрам из язычников
  rationale: Передаёт как родственную форму обращения, так и противопоставление неиудеев Израилю, не сводя выражение лишь к «христианам-язычникам».
- source_word: make known
  choice: поведать
  rationale: Дигнифицированный, но понятный современный глагол, подходящий для пролога повествования.
- source_word: all the things done by our Lord Jesus Christ
  choice: обо всём, что совершил Господь наш Иисус Христос
  rationale: Русская активная конструкция звучит естественно и сохраняет полноту утверждения.
- source_word: village of Nazareth
  choice: в селении Назарете
  rationale: «Селение» сохраняет указание на небольшой населённый пункт и лучше соответствует литературному регистру, чем разговорное «деревня».
- source_word: our region of Bethlehem
  choice: в нашей земле, в Вифлееме
  rationale: Сохраняет локальную принадлежность, не навязывая точного административного смысла слову «region».
- source_word: This is the beginning
  choice: Вот начало
  rationale: Краткая и естественная формула, вводящая последующее повествование.
theological_decisions:
- issue: Объём выражения «Gentile brothers (and sisters)»
  choice: братьям и сёстрам из язычников
  alternative: братьям и сёстрам среди язычников
  rationale: Выбранная формулировка яснее обозначает адресатов-неевреев, не добавляя конфессиональной характеристики.
- issue: Форма упоминания Иисуса
  choice: Господь наш Иисус Христос
  alternative: наш Господь Иисус Христос
  rationale: Сохранён традиционный торжественный порядок слов без изменения христологического титула.
- issue: Связь рождения в Вифлееме с последующими деяниями в Назарете
  choice: после того, как родился в нашей земле, в Вифлееме
  alternative: после своего рождения в нашей Вифлеемской области
  rationale: Формулировка сохраняет последовательность и географическое различие, не вводя отсутствующего в свидетельстве названия административной области.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским оттенком. Поскольку непосредственная сверка с греческой рукописной традицией ещё не выполнена, перевод остаётся предварительным и основан на предоставленном англоязычном публичном свидетельстве; спорные нюансы не конкретизированы сверх его данных.
