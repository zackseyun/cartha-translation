base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/018.yaml
  text: '(1) After some time, a building was being constructed. There was a great commotion, and Jesus got up and went there.


    When Jesus saw a man lying dead, he took the man’s hand and said, “I tell you, man, rise and do your work.” The man immediately rose and worshiped him.


    (2) The crowd saw this and was amazed. They said, “This child is from heaven, for he has saved many souls from death, and he will continue to save throughout all the days of his life.”'
translation:
  language: ru
  text: '(1) Спустя некоторое время строили здание. Поднялся сильный шум, и Иисус встал и пошёл туда.


    Увидев лежавшего мёртвым человека, Иисус взял его за руку и сказал: «Говорю тебе, человек: встань и делай свою работу». Тотчас человек встал и поклонился ему.[a]


    (2) Увидев это, народ изумился и сказал: «Этот ребёнок — с небес, ведь он спас многие души от смерти и будет спасать во все дни своей жизни».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонился ему». Глагол может обозначать как почтительный поклон, так и поклонение; доступное английское свидетельство не позволяет точнее определить оттенок без проверки греческих рукописей.'
    reason: Сохранение богословской и лексической неоднозначности до прямой сверки с греческим текстом.
  - marker: b
    text: 'Перевод предварительный: он основан на общедоступном английском свидетельстве греческой рукописной традиции. Необходима прямая сверка с греческими рукописями; выражение «души» может также подразумевать людей или человеческие жизни.'
    reason: Источник прямо указывает, что обзор исходного греческого текста ещё не выполнен.
lexical_decisions:
- source_word: a building was being constructed
  choice: строили здание
  rationale: Естественная русская конструкция с неопределённо-личным сказуемым сохраняет незавершённость действия.
- source_word: great commotion
  choice: сильный шум
  rationale: Передаёт заметное общественное волнение или суматоху, не уточняя её причину.
- source_word: seized/took his hand
  choice: взял его за руку
  rationale: Нейтральное и естественное выражение; английское свидетельство допускает более резкое «схватил», но контекст исцеления не требует усиления.
- source_word: worshipped him
  choice: поклонился ему
  rationale: Сохраняет возможный диапазон между почтительным поклоном и религиозным поклонением, не снимая богословской неоднозначности.
- source_word: souls
  choice: души
  rationale: Формально сохраняет лексику доступного свидетельства, хотя по смыслу речь может идти о человеческих жизнях или людях.
theological_decisions:
- issue: Характер поклонения воскресшего человека Иисусу
  choice: поклонился ему
  alternative: поклонился ему как Богу / почтил его
  rationale: Текст не определяет явно ни предмет, ни богословский смысл действия, поэтому перевод сохраняет напряжение.
- issue: Происхождение ребёнка
  choice: Этот ребёнок — с небес
  alternative: Этот ребёнок пришёл с неба
  rationale: Именная формулировка близка свидетельству и не добавляет прямо не выраженного глагола нисхождения.
- issue: Спасение душ от смерти
  choice: спас многие души от смерти
  alternative: спас многих людей от смерти
  rationale: Сохранена необычная формулировка свидетельства, чтобы не разрешать вопрос, означает ли «души» людей, жизни или духовные души.
translation_notes:
  register: Современный литературный русский язык с простым, достоинственным повествованием. Синтаксис слегка библейский, но без архаизмов. Из-за отсутствия непосредственно предоставленного греческого текста проект остаётся предварительным и следует доступному публичному английскому свидетельству.
