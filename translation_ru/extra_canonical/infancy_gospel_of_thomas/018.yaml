review_pass:
  verdict: revise
  source_fidelity: Черновик в целом следует доступному английскому свидетельству. Однако «сильный шум» сужает значение great commotion до звука, тогда как речь скорее о заметной суматохе/волнении. «Народ» допустим, но «толпа» точнее передаёт crowd. Формула «во все дни своей жизни» понятна, однако «всю Свою жизнь» естественнее и полностью передаёт throughout all the days of his life. Прямая сверка с греческими рукописями по предоставленным данным невозможна, поэтому неоднозначности греческой традиции окончательно не разрешаются.
  naturalness: Текст литературный и понятный. «Строили здание» естественно, хотя «возводили здание» несколько точнее передаёт процесс строительства. «Поднялся сильный шум» лучше заменить на «поднялась большая суматоха».
  terminology: '«Поклонился ему» удачно сохраняет возможную широту английского worshiped без догматического уточнения. «Спас многие души от смерти» формально соответствует свидетельству и не должно заменяться на «спас жизни» без греческой проверки. Следует удалить сноску a: она предлагает ровно тот же перевод, что стоит в тексте, и потому не поясняет вариант.'
  issues:
  - severity: medium
    issue: «сильный шум» вместо great commotion
    rationale: Русское выражение говорит преимущественно о громком звуке, тогда как commotion охватывает суматоху, волнение и беспорядочное движение людей.
  - severity: low
    issue: Сноска a дублирует основной текст
    rationale: 'Формулировка «Или: “поклонился ему”» совпадает с текстом и не даёт читателю реального варианта или пояснения.'
  - severity: low
    issue: «во все дни своей жизни»
    rationale: Фраза понятна, но для современного литературного русского менее естественна, чем «всю Свою жизнь»; смысл свидетельства при этом сохраняется.
  revised_text: '(1) Спустя некоторое время возводили здание. Поднялась большая суматоха, и Иисус встал и пошёл туда.


    Увидев человека, лежавшего мёртвым, Иисус взял его за руку и сказал: «Говорю тебе, человек: встань и делай свою работу». Человек тотчас встал и поклонился ему.


    (2) Толпа увидела это, изумилась и сказала: «Этот ребёнок — с небес, ведь он спас многие души от смерти и будет спасать всю Свою жизнь».[a]'
  revised_footnotes:
  - marker: a
    text: 'Перевод предварительный: он основан на общедоступном английском свидетельстве греческой рукописной традиции. Необходима прямая сверка с греческими рукописями; слово, переданное здесь как «души», может в контексте обозначать также людей или человеческие жизни.'
    reason: Оговаривает ограниченность доступной основы и сохраняет смысловую неопределённость выражения «many souls» без добавления богословского толкования.
  revision_rationale: Правки уточняют значение доступного английского свидетельства и улучшают современную русскую идиоматику. Удалена неинформативная сноска, идентичная основному переводу. «Поклонился ему» и «души» сохранены как формулировки, не навязывающие конфессионального толкования. Местоимение «Свою» написано с прописной буквы как обычное редакционное обозначение Иисуса в русских библейских изданиях, не меняющее смысла.
