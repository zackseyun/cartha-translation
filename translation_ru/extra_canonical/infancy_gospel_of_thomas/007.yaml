translation:
  language: ru
  text: '(1) Услышав, как Иисус столь уверенно рассуждает о начертаниях первой буквы, учитель был озадачен его учением и ответом. И сказал учитель: «Горе мне! Горе мне! Я в замешательстве и несчастен. Взявшись за этого ребёнка, я лишь опозорил себя.


    (2) Забери его от меня, брат, потому что я не могу вынести ни его взгляда, ни ясности его речи. Этот ребёнок просто не от мира сего. Он даже может укрощать огонь! Быть может, он существовал ещё до сотворения мира. Какое чрево носило его? Какая мать вскормила его? Не знаю. Горе мне, брат! Он ошеломляет меня. Мой ум не в силах за ним последовать. Я сам себя обманул — трижды несчастный! Думал приобрести ученика, а оказалось, что учитель — у меня.


    (3) Друзья, я размышляю о своём позоре: я, старик, побеждён ребёнком. Мне остаётся быть изгнанным и умереть — или бежать из этого селения из-за этого ребёнка. Я больше не могу показываться людям на глаза, особенно тем, кто видел, как совсем малый ребёнок одержал надо мной верх. Но что я могу сказать или кому-нибудь поведать о чертах первого знака?[a] По правде говоря, друзья, я не знаю, потому что не понимаю ни начала, ни конца!


    (4) Поэтому, брат Иосиф, благополучно отведи его к себе домой, потому что этот ребёнок — нечто великое: бог ли он, ангел или кто-то иной — не знаю».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в доступном английском свидетельстве: «о линиях первого элемента». Вероятно, имеются в виду черты или элементы начертания первой буквы; точное чтение требует сверки с греческими рукописями.'
    reason: Исходные данные прямо отмечают, что проверка по греческому тексту ещё не проведена, а выражение неоднозначно.
  - marker: b
    text: 'Перевод этой главы предварительный: он выполнен по предоставленному английскому свидетельству. Необходима непосредственная сверка с греческой рукописной традицией.'
    reason: Прозрачно обозначает ограничение источниковой базы и не создаёт ложного впечатления прямого перевода с греческого.
lexical_decisions:
- source_word: good familiarity
  choice: столь уверенно рассуждает
  rationale: 'Английское свидетельство здесь неясно и отражает трудное исходное чтение. Передан контекст: Иисус обнаруживает необыкновенное знание предмета; буквальное «хорошее знакомство» по-русски звучало бы неестественно.'
- source_word: lines of the first letter
  choice: начертания первой буквы / черты первого знака
  rationale: Сохранена связь с формой и элементами первой буквы, но во второй реплике использовано «знак», чтобы естественно передать двусмысленность слова element и не утверждать сверх доступного свидетельства.
- source_word: defense
  choice: ответом
  rationale: В контексте речь, вероятно, идёт об объяснении или ответной речи Иисуса, а не о юридической защите.
- source_word: clarity of his word
  choice: ясности его речи
  rationale: Сохраняет значение ясной, убедительной речи и звучит естественно в современном русском языке.
- source_word: not of this earth
  choice: не от мира сего
  rationale: Устойчивое русское выражение точно передаёт неземное происхождение, не уточняя его природу.
- source_word: tame fire
  choice: укрощать огонь
  rationale: Сохранён яркий образ исходного свидетельства без рационализации.
- source_word: with salvation
  choice: благополучно
  rationale: Передаёт идиоматический смысл безопасного возвращения домой; буквальное «со спасением» в данном контексте было бы неясно.
- source_word: a great thing
  choice: нечто великое
  rationale: Сохранена намеренно необычная и неопределённая характеристика ребёнка.
theological_decisions:
- issue: Предсуществование ребёнка
  choice: «Быть может, он существовал ещё до сотворения мира»
  alternative: Утвердить его предвечное существование
  rationale: Учитель высказывает предположение, а не исповедальное утверждение; модальность сохранена.
- issue: Природа ребёнка
  choice: «бог ли он, ангел или кто-то иной — не знаю»
  alternative: «Бог ли он...» с прописной буквы
  rationale: Реплика перечисляет неопределённые возможные категории и прямо завершается незнанием. Строчная буква не превращает догадку персонажа в христианское исповедание и сохраняет напряжение текста.
- issue: «Не от мира сего»
  choice: Сохранить образное утверждение без пояснения
  alternative: Передать как «не обычный человек» или «не человек»
  rationale: Такие варианты устранили бы подлинную неоднозначность происхождения и природы ребёнка.
translation_notes:
  register: Современный литературный русский язык с достоинством и эмоциональной силой плача учителя. Синтаксис слегка приподнят, но понятен обычному читателю. Повторы «Горе мне!» и риторические вопросы сохранены. Кавычки и абзацы оформлены по русской норме; добавленные местоимения служат естественности и не меняют содержания.
