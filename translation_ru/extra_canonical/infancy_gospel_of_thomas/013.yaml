base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/013.yaml
  text: '(1) Now Jesus was about eight years old. His father was a carpenter who made plows and yokes. He took a bed from a certain rich man so that he could make it very large and suitable. But one of the beams, called the (…), was shorter; it was not the (right) length. Joseph was distressed and did not know what to do.


    The child came to his father and said, “Set down the two boards and line them up at your end.”


    (2) Joseph did just as Jesus told him. The child Jesus stood at the other end, took hold of the short board, and stretched it. He made it equal in length to the other board.


    Then he said to his father, “Do not be distressed, but make whatever you want to.”


    Joseph embraced and kissed him, saying, “Blessed am I that God gave this child to me.”'
translation:
  language: ru
  text: '(1) Иисусу было тогда около восьми лет. Его отец был плотником и делал плуги и ярма. Один богатый человек поручил ему переделать кровать, чтобы сделать её очень большой и подходящей по размеру. Но одна из перекладин, называемая «…»[a], оказалась короче другой — ей недоставало длины. Иосиф огорчился и не знал, что делать.


    Ребёнок подошёл к отцу и сказал:


    — Положи обе доски рядом и выровняй их с твоего конца.


    (2) Иосиф сделал, как он сказал. Ребёнок Иисус встал у другого конца, взялся за короткую доску и растянул её, так что она стала равна другой.


    Затем он сказал отцу:


    — Не огорчайся, а делай то, что задумал.


    Иосиф обнял и поцеловал его, говоря:


    — Благословен я, потому что Бог дал мне этого ребёнка.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописной традиции название этой части кровати неясно или не сохранилось; многоточие передаёт нерешённое место текста.
    reason: Нельзя без достаточных оснований восстанавливать неизвестный греческий термин по поздней догадке.
lexical_decisions:
- source_word: bed
  choice: кровать
  rationale: Передаёт названный предмет прямо и естественно; дальнейший контекст показывает, что Иосиф должен был переделать его деревянные части.
- source_word: beams / boards
  choice: перекладина / доски
  rationale: 'Сохранено различие английского свидетеля: сначала деталь кровати названа перекладиной, а в речи Иисуса — одной из двух досок. Без греческой сверки унифицировать термины не следует.'
- source_word: stretched
  choice: растянул
  rationale: Буквально сохраняет чудесный характер действия и не заменяет его более рационализирующим выражением вроде «удлинил».
- source_word: ploughs and yokes
  choice: плуги и ярма
  rationale: Обычные современные русские названия плотницких изделий, сохраняющие историческую предметность.
- source_word: make whatever you want to
  choice: делай то, что задумал
  rationale: Естественная русская формулировка в данном ремесленном контексте; она не уточняет сверх источника, какую именно работу Иосиф намеревался выполнить.
theological_decisions:
- issue: Чудесное растяжение деревянной доски ребёнком Иисусом
  choice: Передано прямо как действие Иисуса
  alternative: Смягчить или истолковать как обычную плотницкую операцию
  rationale: Рассказ представляет событие как чудо; перевод не должен рационализировать повествование.
- issue: Слова Иосифа о том, что Бог дал ему ребёнка
  choice: «Бог дал мне этого ребёнка»
  alternative: «Бог даровал мне Своего Сына» или иная христологически уточнённая формула
  rationale: Сохранена сдержанная формулировка свидетеля без внесения отсутствующего богословского уточнения.
- issue: «Благословен я»
  choice: Сохранена формула благословения
  alternative: «Как я счастлив»
  rationale: «Благословен» удерживает религиозный смысл высказывания, не сводя его к эмоциональному состоянию.
translation_notes:
  register: 'Современный литературный русский язык с простым, достойным повествовательным тоном. Прямая речь оформлена естественно для русского издания. Проект предварительный: предоставлен английский публично-доменный свидетель, а непосредственная сверка с греческой рукописной традицией ещё ожидается.'
