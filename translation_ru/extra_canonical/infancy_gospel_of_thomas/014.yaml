base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/014.yaml
  text: '(1) Joseph saw Jesus’ wisdom and understanding. He did not want him to be unfamiliar with letters, so he entrusted him to another teacher.


    The teacher wrote out the alphabet for Jesus and said, “Say alpha.”


    (2) The child said, “First tell me what beta is, and I will tell you what alpha is.”


    The teacher became irritated and struck him. Jesus cursed him, and the teacher fell down and died.


    (3) The child went home to his parents. Joseph called Jesus’ mother and ordered her not to let him leave the house, so that those who provoke him might not die.'
translation:
  language: ru
  text: '(1) Иосиф увидел мудрость и разумение Иисуса. Он не хотел, чтобы тот не знал грамоты, и потому отдал его другому учителю.


    Учитель написал для Иисуса азбуку и сказал:


    — Скажи: «альфа».


    (2) Ребёнок ответил:


    — Сначала ты скажи мне, что такое «бета», а я скажу тебе, что такое «альфа».


    Учитель рассердился и ударил его. Тогда Иисус проклял учителя, и тот упал и умер.


    (3) Ребёнок вернулся домой, к своим родителям. Иосиф позвал мать Иисуса и велел ей не выпускать его из дома, чтобы не умерли те, кто его рассердит.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному английскому свидетельству. Требуется сверка с греческой рукописной традицией. Заключительную фразу можно также понять как «чтобы не умерли те, кто его спровоцирует».'
    reason: Исходные данные прямо указывают, что проверка по греческому тексту ещё не проведена; у глагола «провоцировать» возможны оттенки «раздражать», «вызывать гнев».
lexical_decisions:
- source_word: wisdom and understanding
  choice: мудрость и разумение
  rationale: Сохранены два различных понятия; «разумение» звучит достойно и передаёт способность понимать, не сливая её с мудростью.
- source_word: letters
  choice: грамоты
  rationale: В данном контексте речь идёт не просто об отдельных буквах, а об обучении чтению и письму; выражение «не знал грамоты» естественно по-русски.
- source_word: wrote the alphabet
  choice: написал ... азбуку
  rationale: «Азбука» естественно обозначает последовательность букв, хотя названия «альфа» и «бета» сохраняют греческую учебную обстановку.
- source_word: cursed
  choice: проклял
  rationale: Прямо сохраняет резкое действие повествования без смягчения или богословского истолкования.
- source_word: provoke
  choice: рассердит
  rationale: Передаёт контекст раздражения, вызванного действиями окружающих, и звучит естественно применительно к ребёнку.
theological_decisions:
- issue: Причинная связь между проклятием Иисуса и смертью учителя
  choice: 'События переданы последовательно: Иисус проклял, учитель упал и умер'
  alternative: Явно утверждать, что Иисус сверхъестественно убил учителя
  rationale: Источник сообщает последовательность и подразумеваемую связь, но перевод не должен добавлять механизм или богословское объяснение.
- issue: Смысл заключительного предостережения Иосифа
  choice: «чтобы не умерли те, кто его рассердит»
  alternative: «потому что всякий, кто его рассердит, умрёт»
  rationale: Сохранена целевая конструкция и некоторая неопределённость исходного свидетельства, без превращения её в универсальное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным строем. Реплики оформлены естественно для русской прозы. Имена Иисуса добавлены там, где это необходимо для ясности и подтверждается предоставленным свидетельством; избыточные местоименные уточнения устранены.
