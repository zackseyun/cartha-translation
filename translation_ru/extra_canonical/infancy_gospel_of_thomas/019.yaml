lexical_decisions:
- source_word: traveling company
  choice: другие путники
  rationale: Передаёт группу совместно путешествующих людей естественным современным русским языком, не вводя более специфического образа каравана.
- source_word: teachers
  choice: учителя
  rationale: Сохраняет нейтральное обозначение наставников Закона; «законоучители» было бы более толковательным.
- source_word: elders
  choice: старейшины
  rationale: Сохраняет отличие от названных ранее «учителей» и формальный оттенок исходного свидетельства.
- source_word: main points of the law
  choice: главные положения Закона
  rationale: Передаёт содержание как основные положения Моисеева Закона, не сводя выражение к отдельным заповедям.
- source_word: riddles
  choice: загадочные изречения
  rationale: В контексте пророческих текстов звучит естественнее буквальных «загадок» и сохраняет смысл трудных, требующих истолкования речений.
- source_word: maturity
  choice: зрелость
  rationale: Сохраняет более широкий смысл взросления, не ограничивая его исключительно физическим ростом или возрастом.
- source_word: grace
  choice: благодать
  rationale: Традиционный и богословски ёмкий эквивалент, сохраняющий возможный смысл Божьего благоволения.
theological_decisions:
- issue: Место Отца в ответе Иисуса
  choice: в доме Моего Отца
  alternative: на месте Моего Отца / при делах Моего Отца
  rationale: Храмовый контекст естественно поддерживает значение «дом», однако исходная формулировка по представленному свидетельству допускает более широкое понимание; неоднозначность отмечена сноской.
- issue: Благословение Марии
  choice: Господь Бог благословил плод твоего чрева
  alternative: Господь Бог благословил ребёнка, которого ты родила
  rationale: Сохранена библейская образность и связь с традиционной формулой, без внесения дополнительных мариологических утверждений.
- issue: Заключительная доксология
  choice: Ему да будет [слава…]
  alternative: Которому да будет [слава…]
  rationale: Местоимение отнесено к ближайшему центральному лицу повествования — Иисусу, но повреждённый или восстановленный характер окончания сохранён скобками и многоточием.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской религиозно-издательской норме. Перевод остаётся предварительным: он основан на предоставленном англоязычном публичном свидетельстве; непосредственная сверка с греческой рукописной традицией ещё требуется.'
