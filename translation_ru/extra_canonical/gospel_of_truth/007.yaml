  consult_excerpt: 'Every realm emanates from him. They know they’ve come out from him like children who are from someone who’s completely mature. They knew they hadn’t yet received form or a name. The Father gives birth to each one. Then, when they receive form from his knowledge, although they’re really within him, they don’t know him. But the Father is complete, knowing every realm that’s within him. If he wants to, he reveals whomever he wants, giving them a form and a name. He gives a name to them, and causes those to come into being who, before they come into being, are ignorant of the one who made them.

    I’m not saying, then, that those who haven’t yet come into being are nothing, but they exist 28 in the one who will want them to come into being when he wants, like a later time. Before everything is revealed, he knows what he’ll produce. But the fruit which he hasn’t yet revealed doesn’t yet know anything, nor does it do anything. In addition, every realm which is itself in the Father is from the one who exists, who establishes them from what doesn’t exist. For those who have no root have no fruit either. They think to themselves, “I’ve come into being,” but they’ll dissolve by themselves. Because of this, those who didn’t exist at all won’t exist.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/007.yaml
  text: 'For they had not yet received form or a name. The Father brings them forth. Then[a], when they receive form by his knowledge, though they are truly within him, they do not know him. But the Father is complete, knowing every space that is within him. If he wills, he reveals whomever he wills, giving them form and giving them a name. He gives a name to them and causes them to come into being—those who, before they come into being, are ignorant of the one who made them.


    Do not, then, say that those who have not yet come to be are nothing; rather, they exist in the One who will will them to come to be, when he wills—like a later season. Before everything is revealed, he knows what he will produce in his own time. But the fruit that he has not yet revealed knows nothing yet and does nothing.


    Moreover, every aeon that is in the Father is from the One‑who‑is, who establishes them out of non‑being. For those who have no root have no fruit. They say within themselves, “I have come to be,” but they will dissolve by themselves. Because of this, those who did not exist at all will not exist.'
translation:
  language: ru
  text: 'Ведь они ещё не получили ни облика, ни имени. Отец производит их на свет. И тогда[a], получив облик через Его знание, они, хотя и пребывают в Нём поистине, не знают Его. Но Отец совершенен: Он знает всякое место в Нём. Когда Он желает, Он открывает того, кого желает, давая тому облик и имя. Он даёт им имена и приводит к бытию — тех, кто до своего появления не знает Того, Кто их создал.



    Итак, не говори, что ещё не возникшие — ничто. Напротив, они существуют в Том, Кто пожелает привести их к бытию, когда пожелает, — словно грядущая пора. Прежде чем всё откроется, Он знает, что произведёт в своё время. Но плод, которого Он ещё не явил, пока ничего не знает и ничего не делает.



    Кроме того, каждый эон, пребывающий в Отце, происходит от Того-Кто-Есть: Он утверждает их из небытия. Ведь у тех, у кого нет корня, нет и плода. Они говорят сами себе: «Я пришёл к бытию», — но сами собой растворятся. Поэтому те, кто вовсе не существовал, существовать не будут.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Связь предложений в повреждённой и местами неясной рукописной последовательности допускает иную расстановку границ; «и тогда» передаёт наиболее вероятный переход к получению облика через знание Отца.
    reason: Синтаксис коптского текста в этом месте не вполне ясен, а прежняя реконструкция существенно меняла последовательность мысли.
lexical_decisions:
- source_word: ⲙⲁⲉⲓⲧ
  choice: облик
  rationale: «Облик» естественно передаёт внешнюю форму или образ, не превращая слово в отвлечённый философский термин.
- source_word: ⲕⲁⲓⲣⲟⲥ / ⲡⲉⲡⲓⲣⲏⲧⲉ
  choice: пора / назначенное Им время
  rationale: Различение сохраняет оттенок особой, надлежащей поры у греческого заимствования καιρός и более общее значение времени у второго выражения.
- source_word: ⲡⲉⲧϣⲟⲟⲡ
  choice: то, что существует; Тот-Кто-Есть
  rationale: Контекст требует онтологической лексики; в титульном употреблении выбран графически выделенный эквивалент без прямого отождествления с какой-либо канонической формулой.
- source_word: ⲧⲙⲛⲧⲉⲩⲛⲟⲩ
  choice: небытие
  rationale: Сохраняет метафизическое противопоставление бытию и не сводит выражение к разговорному «ничто».
- source_word: ⲕⲁⲣⲡⲟⲥ
  choice: плод
  rationale: Прямо сохраняет сквозной образ корня и плода.
- source_word: ⲛⲧⲟⲩϣⲏ
  choice: растворятся
  rationale: Передаёт конкретный образ исчезновения через таяние или растворение, а не обобщённую гибель.
- source_word: ⲡⲓⲱⲧ
  choice: Отец
  rationale: Устойчивый и понятный эквивалент божественного титула; прописная буква отмечает титульное употребление.
- source_word: aeon terminology
  choice: эон
  rationale: Технический термин сохранён, поскольку «мир», «век» или «область» сгладили бы специфический понятийный строй текста.
theological_decisions:
- issue: Происхождение эонов «из небытия»
