- source_word: ⲧϩⲩⲗⲏ
  choice: материя
  rationale: Прямой русский эквивалент греческого философского заимствования hylē; греческая форма сохранена в примечании.
- source_word: ⲁⲧⲧⲉⲕⲟ / ⲙⲛⲧⲁⲧⲧⲉⲕⲟ
  choice: Нетленный / Нетленность
  rationale: Сохраняет различие личного и отвлечённого употреблений и олицетворение в данном рассуждении.
- source_word: ⲃⲁⲑⲟⲥ
  choice: Глубина
  rationale: Буквально передаёт титул Отца и не подменяет его более толковательным «Бездна».
- source_word: ⲡⲗⲁⲛⲏ
  choice: Заблуждение
  rationale: Передаёт ошибку и уклонение; прописная буква сохраняет олицетворение.
- source_word: ⲙⲉⲧⲁⲛⲟⲓⲁ
  choice: перемена ума
  rationale: Контекст связывает термин с возвращением и переменой мышления; традиционное «покаяние» дано в примечании.
- source_word: ⲡⲥⲁⲉⲓⲛ
  choice: врач
  rationale: Естественное современное обозначение целителя, ясно поддерживающее образ болезни и восполнения нужды.
- source_word: ⲡⲭⲥ
  choice: Мессия
  rationale: Передаёт титульное значение Χριστός; привычное «Христос» сохранено в примечании.
- source_word: ⲧⲱϩⲥ
  choice: сосуд
  rationale: Сохраняет конкретный образ вместилища и его метафорический диапазон.
- source_word: ⲥⲧⲟ / ⲧⲱϩⲥ (anointing imagery)
  choice: миро / помазание
  rationale: «Миро» естественно передаёт культовое благовонное масло, а «помазание» — совершаемое им действие; примечание поясняет термин.
- source_word: ⲧⲉⲗⲓⲟⲥ
  choice: совершенные
  rationale: Сохраняет богословскую многозначность между совершенством и завершённостью.
