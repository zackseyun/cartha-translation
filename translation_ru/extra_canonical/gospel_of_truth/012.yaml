revisions:
- from: 'Слово Благой вести об обретении Полноты обращено к тем, кто ожидает спасения, приходящего свыше.[a] Пока они ждут его, надежда принадлежит тем, чей образ — свет без тени. И когда приходит Полнота, нужда материи[b] происходит не от безмерности Отца: он приходит дать нужде её срок. Однако никто не может сказать, что Нетленный приходит именно так. Напротив, Глубина Отца возрастала и умножалась, а помысла Заблуждения при нём не было. Заблуждение — это падение, которое легко исправить, когда будет найден тот, кто придёт к тому, к чему он возвращается; ведь возвращение называется переменой ума.[c]


    Поэтому Нетленность дохнула и последовала за согрешившим, чтобы тот обрёл покой. Ведь нуждающемуся свету остаётся прощение — Слово Полноты. Врач спешит туда, где есть болезнь, потому что такова его воля. И нуждающийся не скрывает своей нужды, ведь у врача есть то, чего ему недостаёт. Так Полнота, сама ни в чём не нуждающаяся, дала от себя то, что восполняет нужду, чтобы они приняли благодать. Ибо, когда они были в нужде, благодати у них не было. Поэтому там, где нет благодати, произошло умаление. Когда же умалённое было восстановлено, недостающее явилось как Полнота. Таково обретение света Истины, озарившего их, ибо он неизменен.


    Поэтому среди них о Мессии[d] говорили: «Ищите — и смятённые возвратятся, и он помажет их миром».[e] Миро — это милость Отца, и он помилует их. Те же, кого он помазал, — совершенные, ведь помазывают наполненные сосуды. Но когда помазание одного из них разрушается, сосуд пустеет; причиной нужды становится то место, откуда вытекает миро, потому что дуновение со своей силой увлекает его. Однако у того, кто ни в чём не нуждается, не снимается никакая печать и ничто не опустошается. Напротив, Отец, который совершенен, вновь восполняет в нём недостающее. Он благ и знает свои насаждения, потому что сам насадил их в своём Раю. А его Рай — место его покоя.'
