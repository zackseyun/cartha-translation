  consult_excerpt: 'What, then, did he want them to think of themselves? He wanted to them to think, “I’ve come into being like the shadows and phantoms of the night.” When the light shines on the terror which they received, they know that it’s nothing. In this way, they were ignorant of the Father, whom 29 they didn’t see. Since it was terror and disturbance and instability and doubt and division, many illusions were at work among them, and vain ignorance, like they were deep in sleep and found themselves in nightmares. Either they’re running somewhere, or unable to run away from someone; or they’re fighting, or being beaten; or they’ve fallen from heights, or fly through the air without wings. Sometimes, too, it’s like someone is killing them, even though no one’s chasing them; or they themselves are killing those around them, covered in their blood. Until those who are going through all these nightmares can wake up, they see nothing, because these things are nothing.

    That’s the way it is with those who’ve cast off ignorance like sleep. They don’t regard it as anything, nor do they regard its 30 other works as real, but they abandon them like a dream in the night. They value the knowledge of the Father like they value the light. The ignorant have acted like they’re asleep; those who’ve come to knowledge have acted like they’ve awakened. Good for the one who returns and awakens! Blessed is the one who’s opened the eyes of those who can’t see! The Holy Spirit hurried after them to revive them. Having given a hand to the one who lay on the ground, it set them up on their feet, because they hadn’t yet arisen. It gave them the knowledge of the Father and the revelation of the Son, because when they saw him and heard him, he granted them to taste him and to grasp the beloved Son.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/008.yaml
  text: 'What, then, did he want them to think? That they had come to be like a shadow and a phantasm of the night.


    When light falls upon the terror that they had received, it turns out to be nothing. In this way they were ignorant of the Father, whom they did not see. For it was terror and disturbance and instability and division and doubt; many empty illusions were at work among them, and vain nothingness—as if they were sunk in sleep and, in their dreams, found themselves in nightmares.


    Either they are running to some place, or they are unable to flee from someone; or they are fighting, or they are being beaten; or they fall from heights, or they fly through the air without wings. Sometimes also someone is killing them even though no one pursues them; or they themselves are killing those around them, and they are smeared with their blood. Until those who are going through all these things awaken, they see nothing—because these things are nothing.


    So it is with those who have cast off ignorance like sleep: they do not reckon it to be anything, nor do they reckon its other works to be real; rather, they abandon them like a dream of the night. They value the knowledge of the Father like the light. Those who were ignorant acted as if asleep; those who have come to know acted as if awake.


    Good is the one who returns and awakens![a] Blessed is the one who opens the eyes of the blind!


    The Spirit ran after them in order to make them live. Having given a hand to the one who lay on the ground, it set them on their feet, for they had not yet arisen. It granted them the knowledge of the Father and the revelation of the Son; for when they saw him and heard him, he allowed them to taste him and to grasp the beloved Son.'
translation:
  language: ru
  text: '**Притча о кошмарах**


    Так что же он хотел, чтобы они подумали? Что они возникли словно тень и ночной призрак.


    Когда свет падает на охвативший их ужас, оказывается, что он — ничто. Так они пребывали в неведении об Отце, которого не видели. Ибо там были ужас и смятение, неустойчивость, разделение и сомнение; среди них действовало множество пустых обманчивых видений и тщетное небытие — словно они погрузились в сон и во сне обнаружили себя в кошмарах.


    То они куда-то бегут, то не могут от кого-то убежать; то сражаются, то их избивают; то падают с высоты, то летят по воздуху без крыльев. Иногда им кажется, будто кто-то убивает их, хотя никто за ними не гонится; или же они сами убивают окружающих и сами покрыты кровью. Пока переживающие всё это не пробудятся, они ничего не видят, потому что всё это — ничто.


    Так бывает и с теми, кто сбросил с себя неведение, словно сон: они не считают его чем бы то ни было и не считают реальными прочие его дела, но оставляют их позади, как ночное сновидение. Познание Отца они ценят как свет. Пребывавшие в неведении поступали как спящие, а пришедшие к познанию — как пробудившиеся.


    Благо тому, кто возвращается и пробуждается![a] Блажен тот, кто открывает глаза слепым!


    Дух поспешил за ним, чтобы оживить его. Подав руку лежавшему на земле, он поставил его на ноги, потому что тот ещё не поднялся. Дух даровал им познание Отца и откровение Сына; ведь когда они увидели и услышали его, он позволил им вкусить его и ухватиться за возлюбленного Сына.


    [a] Или: «Блажен тот, кто возвращается и пробуждается!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Блажен тот, кто возвращается и пробуждается!»'
    reason: Допустимая более традиционная передача первой благопожелательной формулы; основной текст сохраняет лексическое отличие от следующего предложения с явным «блажен».
lexical_decisions:
- source_word: ⲣⲡⲧⲉ
  choice: тень
  rationale: Передаёт образ нематериальности и нереальности; естественно сочетается с «ночным призраком».
- source_word: ⲱⲡⲧ
  choice: призрак
  rationale: Сохраняет значение нереального явления, не сводя его к нейтральному «образу».
- source_word: ⲧⲣⲙⲣⲟⲩ
  choice: ужас
  rationale: Сильнее обычного «страха» и соответствует ряду мучительных состояний.
- source_word: ⲙⲛⲧⲁⲧⲧⲁⲕⲁⲣⲉⲓⲥ
  choice: смятение
  rationale: Широкое обозначение внутреннего расстройства, подходящее для данного перечня.
- source_word: ⲙⲛⲧϩⲏⲧ
  choice: неустойчивость
  rationale: Сохраняет идею отсутствия твёрдости без чрезмерного психологического уточнения.
- source_word: ⲥⲛⲉⲩ
  choice: разделение
  rationale: Передаёт как разобщение, так и внутреннюю раздвоенность, не разрешая образ однозначно.
- source_word: ⲡⲱϣⲉ
  choice: сомнение
  rationale: Лучше всего соответствует познавательному контексту неведения и последующего познания.
- source_word: ⲙⲙⲛⲧⲁ
  choice: тщетное небытие
  rationale: Сохраняет одновременно смысл пустоты, недействительности и небытия.
- source_word: ⲡϭⲁⲗ
  choice: сон
  rationale: Прямое значение слова и центральная метафора неведения в отрывке.
- source_word: ⲛⲉⲉⲓ
  choice: сновидение / кошмары
  rationale: В образном рассказе речь идёт об обычных снах, а не о пророческих видениях.
- source_word: ⲥⲁⲩⲛⲉ
  choice: познание
  rationale: В контексте это не просто набор сведений, а действенное узнавание Отца; «познание» естественно передаёт эту насыщенность без транслитерации «гнозис».
- source_word: ⲡⲓⲡⲛⲁ
  choice: Дух
  rationale: Личное действующее начало, которое оживляет, поднимает и дарует познание; слово «Святой» не добавлено, поскольку в данном месте оно явно не выражено.
theological_decisions:
- issue: Кого обозначает ⲡⲓⲡⲛⲁ
  choice: «Дух» с прописной буквы
  alternative: «дух» или «дыхание»
  rationale: Оживление, поднятие человека и дарование познания представлены как личные действия; при этом эпитет «Святой» не внесён в основной текст.
- issue: Передача спасительного знания Отца
  choice: «познание Отца»
  alternative: «знание об Отце» или «гнозис Отца»
  rationale: «Познание» сохраняет деятельный и преобразующий смысл, оставаясь понятным современному читателю и не вводя специальной конфессиональной терминологии.
- issue: Различие между «благо» и «блажен»
  choice: 'Сохранено: «Благо тому...» и «Блажен тот...»'
  alternative: Оба высказывания передать словом «блажен»
  rationale: Коптский текст употребляет в соседних фразах разные выражения; перевод не сглаживает это значимое различие.
- issue: Образ вкушения и овладения Сыном
  choice: «вкусить его и ухватиться за возлюбленного Сына»
  alternative: «познать его и постичь возлюбленного Сына»
  rationale: Сохранены телесные и реляционные метафоры источника, а не заменены отвлечённо-интеллектуальным толкованием.
translation_notes:
  register: Современный литературный русский с достоинством гомилетического текста. Короткие параллельные конструкции сохранены в описании кошмаров; архаизмы и узкоспециальная гностическая терминология не вводятся. Метафизическая напряжённость выражения «тщетное небытие» и чувственные образы «вкусить» и «ухватиться» намеренно сохранены.
