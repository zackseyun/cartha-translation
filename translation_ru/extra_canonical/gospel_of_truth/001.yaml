base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/001.yaml
  text: The Gospel of Truth is joy for those who have received grace from the Father of Truth[a], so that they might know him through the power of the Word that came forth from the Pleroma—the one who is in the thought and the mind of the Father. He is called “Savior”; that is the name of the work he will do to save those who had become ignorant of the Father. And the name “Gospel” is the revelation of hope, the discovery for those who seek him.
translation:
  language: ru
  text: 'Евангелие истины — радость для тех, кто принял благодать от Отца истины, чтобы они познали Его силой Слова, пришедшего из Плеромы[a], — Того, Кто пребывает в мысли и разуме Отца. Его называют «Спасителем»: это имя дела, которое Он совершит, спасая тех, кто пребывал в неведении об Отце. А имя «Евангелие» означает откровение надежды, обретение теми, кто ищет Его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Плерома — греческое слово, означающее «полнота»; здесь оно употреблено как специальный термин.
    reason: Нейтрально поясняет транслитерированный термин, не закрепляя за ним более развёрнутую богословскую интерпретацию.
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  choice: Евангелие
  rationale: Греческое заимствование употреблено как богословское наименование; традиционная форма сохраняет самоотсылочный характер текста.
- source_word: ⲧⲙⲏⲉ
  choice: истина
  rationale: Прямое и устойчивое соответствие коптскому слову.
- source_word: ⲭⲁⲣⲓⲥ (восстанавливается по конструкции)
  choice: благодать
  rationale: Передаёт как дарованную милость, так и богословскую насыщенность выражения, не сводя его к человеческому расположению.
- source_word: ⲡⲓⲱⲧ
  choice: Отец
  rationale: Сохраняет божественный титул и последовательность терминологии трактата.
- source_word: ⲧϭⲁⲙ
  choice: сила
  rationale: Контекст говорит о действенной силе, посредством которой становится возможным познание.
- source_word: ⲡⲓϣⲉϫⲉ / ⲡⲥⲁϫⲉ
  choice: Слово
  rationale: Слово представлено как пришедшее из Плеромы и соотнесённое с мыслью Отца; прописная буква передаёт персонифицированное употребление без замены на интерпретирующее «Логос».
- source_word: ⲡⲡⲗⲏⲣⲱⲙⲁ
  choice: Плерома
  rationale: Транслитерация сохраняет специальный смысл божественной полноты; значение пояснено в сноске.
- source_word: ⲛⲟⲩⲥ
  choice: разум
  rationale: Естественное русское соответствие греческому νοῦς; вместе со «мыслью» сохраняет пару различных познавательных понятий.
- source_word: ⲡⲥⲱⲧⲏⲣ
  choice: Спаситель
  rationale: Стандартно передаёт титул σωτήρ и поддерживает словесную связь с последующим «спасая».
- source_word: ⲡⲟⲩⲱⲛϩ ⲃⲁⲗ
  choice: откровение
  rationale: Идиоматически передаёт образ раскрытия или явления надежды.
- source_word: ⲕⲱⲧⲉ ⲛⲥⲱϥ
  choice: ищет Его
  rationale: Краткое и естественное выражение целенаправленного поиска.
theological_decisions:
- issue: Персонифицированное «Слово»
  choice: Слово с прописной буквы
  alternative: слово; Логос
  rationale: Форма текста допускает личностное прочтение, но не требует подменять коптское слово греческим техническим термином «Логос».
- issue: Передача ⲡⲡⲗⲏⲣⲱⲙⲁ
  choice: Плерома с пояснением
  alternative: Полнота
  rationale: Специальный термин сохранён, но сноска делает его понятным обычному читателю и не навязывает развитую конфессиональную схему.
- issue: Связь титула «Спаситель» с делом спасения
  choice: «это имя дела… спасая»
  alternative: «это название служения… искупая»
  rationale: Сохраняется риторическая связь между именем Спасителя и совершаемым Им спасением, а также явное в источнике слово «имя».
- issue: Смысл незнания Отца
  choice: «пребывал в неведении об Отце»
  alternative: «не знал Отца»
  rationale: Формулировка сохраняет состояние незнания, не добавляя оценки виновности или учения о способе спасения.
- issue: Фраза об имени «Евангелие»
  choice: «имя „Евангелие“ означает»
  alternative: «а имя „Евангелие“ есть»
  rationale: Источник прямо говорит об имени; «означает» естественно передаёт объяснение названия и сохраняет параллель с именем Спасителя.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского богословского текста. Синтаксис упрощён лишь настолько, чтобы длинная исходная фраза оставалась понятной. Прописные буквы в местоимениях, относящихся к Отцу и Спасителю, служат русской религиозно-литературной норме, не разрешая неоднозначность их отношений. Ошибочная прежняя сноска «Или: “А слово ‘Евангелие’”» не перенесена: коптский текст содержит ⲡⲣⲁⲛ, «имя».'
