  naturalness: 'Текст в целом соответствует современному литературному русскому и сохраняет возвышенный регистр. Замену требует только сочетание «обретение для тех, кто ищет Его»: естественнее «обретение теми, кто ищет Его».'
  terminology: '«Евангелие», «Отец», «Слово», «Плерома» и «Спаситель» переданы последовательно. Сноску о Плероме следует сделать менее доктринально определяющей: рукописный контекст допускает терминологическую значимость, но краткое этимологическое пояснение достаточно.'
