  to: 'Евангелие истины — радость для тех, кто принял благодать от Отца истины, чтобы они познали Его силой Слова, пришедшего из Плеромы[a], — Того, Кто пребывает в мысли и разуме Отца. Его называют «Спасителем»: это имя дела, которое Он совершит, спасая тех, кто пребывал в неведении об Отце. А имя «Евангелие» означает откровение надежды, обретение теми, кто ищет Его.'
  rationale: 'Исправлена заключительная конструкция, чтобы сохранить связь между «обретением» и ищущими, а также устранена из сноски излишне интерпретирующая характеристика Плеромы. Остальные решения, включая «имя “Евангелие”», сохранены: коптский текст говорит именно об имени, а не о слове.'
