- source_word: ⲡⲗⲏⲣⲱⲙⲁ
  choice: Полнота
  rationale: Русский смысловой эквивалент греческого plērōma сохраняет технический характер при помощи прописной буквы и сноски.
- source_word: ⲗⲟⲅⲟⲥ
  choice: Слово
  rationale: Традиционное и понятное русское соответствие Logos; сноска сохраняет греческий термин.
