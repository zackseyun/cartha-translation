    Ведь не уши обоняют благоухание — его обоняет Дух. Он привлекает благоухание к Себе и погружается в благоухание Отца. Тогда Отец укрывает его и уносит туда, откуда оно пришло, — к первоначальному благоуханию, которое остыло. Это — нечто внутри одушевлённого образования,[c] подобно холодной воде, впитавшейся в рыхлый ком земли. Видящие это думают, что перед ними лишь земля; потом оно вновь растворяется, и, если дыхание вбирает его, оно согревается.


