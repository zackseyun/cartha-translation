  consult_excerpt: 'He’s the shepherd who left behind the ninety- 32 nine sheep which weren’t lost. He went and searched for the one which was lost. He rejoiced when he found it, because ninety-nine is a number expressed with the left hand. However, when the one is found, the numerical sum moves to the right hand. In this way, what needs the one – that is, the whole right hand – draws what it needs, takes it from the left hand, and moves it to the right, so the number becomes one hundred. This is a symbol of the sound of these numbers; this is the Father.

    Even on the Sabbath, he worked for the sheep which he found fallen in the pit. He saved the life of the sheep, having brought it up from the pit, so that you may know in your hearts – you’re children of the knowledge of the heart – what is the Sabbath, on which it isn’t right for salvation to be idle, so that you may speak of the day which is above, which has no night, and of the light that doesn’t set, because it’s complete. Speak then from the heart, because you’re the completed day, and the light that doesn’t cease dwells within you. Speak of the Truth with those who search for it, and of knowledge with those who’ve sinned in their Error.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/010.yaml
  text: 'He is the shepherd who left the ninety‑nine sheep that had not gone astray[a], and he went and sought the one that had wandered. When he found it, he rejoiced over it, because ninety‑nine is a number on the left hand. But when the one is found, the reckoning moves to the right hand. In this way, what needs the one—that is, the whole of the right hand—draws what it needs, taking it from the left hand and transferring it to the right, so that the number becomes a hundred. This is a sign of the sound of these numbers; it is the Father.


    Even on the Sabbath he labored for the sake of the sheep that he found fallen into the pit. He saved the life of the sheep, having brought it up out of the pit, so that you may know in your heart—since you are children of the knowledge of the heart—what the Sabbath is: that on it it is not fitting for salvation to be idle, so that you may speak of the Day which is above, which has no night, and of the Light that does not set, because it is complete. Speak, then, from the heart, for you are the perfect Day, and the light that does not fail dwells within you. Speak of the Truth with those who seek it[b], and of Knowledge with those who have sinned in their Error.'
translation:
  language: ru
  text: 'Он — пастух, который оставил девяносто девять овец, не сбившихся с пути, и пошёл искать ту, что заблудилась. Найдя её, он обрадовался, потому что девяносто девять — это число, изображаемое на левой руке[a]. Но когда находится одна овца, счёт переходит на правую руку. Так то, чему недостаёт единицы, — то есть вся правая рука — притягивает недостающее: берёт его с левой руки и переносит на правую, и число становится сотней. Это знак звука этих чисел[b]; это Отец.


    Даже в субботу он трудился ради овцы, которую нашёл упавшей в яму. Он спас овце жизнь, вытащив её из ямы, чтобы вы сердцем познали — ведь вы дети знания сердца, — что такое суббота: в неё спасение не должно оставаться без дела, чтобы вы могли говорить о Дне, который свыше, в котором нет ночи, и о Свете, который не заходит, потому что он совершенен. Итак, говорите от сердца, ибо вы — совершенный День, и в вас обитает Свет, который не угасает. Говорите об Истине с теми, кто её ищет, и о Знании — с теми, кто согрешил в Заблуждении.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Имеется в виду древний способ обозначать числа положением пальцев: девяносто девять соотносится с левой рукой, а число сто — с правой.'
    reason: Культурно-историческое пояснение необходимо для понимания перехода счёта с одной руки на другую.
  - marker: b
    text: 'Или: «голоса этих чисел».'
    reason: Исходное выражение допускает значения «звук» и «голос»; основной текст не приписывает числам явно выраженную речь.
lexical_decisions:
- source_word: ⲥⲁⲩ
  choice: овца / овцы
  rationale: 'Обычное коптское обозначение овцы; число определяется контекстом: сначала девяносто девять овец, затем одна найденная овца.'
- source_word: ⲡⲗⲁⲛⲏ
  choice: Заблуждение
  rationale: Греческое заимствование planē в «Евангелии Истины» обозначает не только ошибку, но и действующую силу, противопоставленную Знанию; прописная буква сохраняет этот оттенок, не превращая его в отдельное имя.
- source_word: ⲟⲩⲱⲡⲉ
  choice: число / счёт
  rationale: Контекст связан с изображением 99 и 100 посредством пальцев; «число» называет величину, а «счёт» естественно передаёт переход между руками.
- source_word: ⲧⲁⲉⲓⲉ; ⲙⲣⲏⲧⲉ
  choice: левая рука; правая рука
  rationale: Явное добавление слова «рука» необходимо для понятной передачи древней системы счёта на пальцах.
- source_word: ⲧⲱⲱⲛⲉ
  choice: единица
  rationale: В данном месте речь идёт о числе, дополняющем девяносто девять до ста; «единица» яснее русского «одно» и не навязывает метафизического титула «Единый».
- source_word: ϫⲏⲕ
  choice: совершенный / совершенен
  rationale: Слово охватывает значения полноты, завершённости и совершенства; «совершенный» сохраняет возвышенный риторический регистр отрывка.
- source_word: ⲥⲁⲃⲃⲁⲧⲟⲛ
  choice: суббота
  rationale: Устоявшееся русское обозначение дня покоя, сохраняющее иудейскую календарную отсылку.
- source_word: ⲡⲟⲩϫⲁⲉⲓ
