revisions:
- from: '### Книга живых


    Что до имён Живых, они записаны в Книге Живых.[a]


    Они получают наставление о самих себе; они получают его от Сыновства,[b] чтобы слышащий мог ответить, обратиться и взглянуть на того, кто назвал его по имени. Он исполняет его волю, следует за ним и говорит, что названные им принадлежат ему. Каждый знает, откуда он был призван; он исполняет его волю, желает быть ему угодным и обретает покой. Имя каждого становится его собственным.


    Поскольку полнота Всего[c] — в нём, Всё должно взойти к нему, и каждый должен получить принадлежащее ему. Он записал это заранее, приготовив в своей мысли и в своей воле, чтобы дать вышедшим от него.


    Те, кого он заранее знал по имени, были призваны в конце, так что обладающий знанием — это тот, чьё имя произнёс Отец; ведь тот, чьё имя не было произнесено, пребывает в неведении. И как он услышит, если его имя не было названо? Тот, кто до конца остаётся в неведении, — порождение Заблуждения,[d] и вместе с ним он исчезнет. Иначе почему у этих несчастных нет имени? Почему у них нет голоса?


    Итак, если кто обладает знанием, тот свыше. Когда его зовут, он слышит, отвечает, обращается к зовущему, восходит к нему и понимает, как именно он призван. Обладая знанием, он исполняет волю призвавшего его, желает быть ему угодным и обретает покой. Его имя становится его собственным. Такой человек знает, откуда пришёл и куда идёт. Он подобен тому, кто, опьянев, отрезвел, пришёл в себя и вновь привёл в порядок то, что ему принадлежит.


    Он возвратил многих из Заблуждения. Он прошёл перед ними к тем местам, откуда они удалились. Они приняли Заблуждение из-за глубины того, кто окружает всякое место, хотя ничто не окружает его. Великое чудо: они были в Отце и не знали его; они смогли выйти сами, хотя не могли постичь и познать того, в ком находились. Он явил свою волю как знание, в согласии со всем, что вышло от него.


    Таково знание Живой Книги,[a] которое он открыл последним поколениям: это исходящие от него письмена, показывающие, что они не гласные и не согласные, которые кто-нибудь мог бы прочесть и счесть пустыми. Нет, это письмена Истины: они говорят и знают самих себя. Каждое письмено — законченная мысль, подобная завершённой книге, ибо эти письмена начертаны Единством.[e] Отец начертал их, чтобы поколения посредством исходящих от него письмен познали Отца.'
