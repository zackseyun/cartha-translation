  choice: знание
  rationale: Прямой смысл слова и смысловая противоположность Забвению; в данном трактате знание Отца имеет откровенный и спасительный характер.
- source_word: ⲡⲉⲩⲥⲱϥ
  choice: благовестие о Том, Кого ищут
  rationale: Передаёт евангельскую весть и сохраняет определение искомого Лица, не подменяя его заранее названным титулом.
