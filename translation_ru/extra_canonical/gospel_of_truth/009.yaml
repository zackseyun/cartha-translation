  consult_excerpt: 'When he was revealed, he taught them about the Father, the uncontainable one, and breathed into them what’s in the thought, doing his will. When many had received the light, they turned 31 to him. For the material ones were strangers, who didn’t see his form or know him. For he came by means of fleshly form, and nothing could block his path, because incorruptibility can’t be grasped. Moreover, he said new things while he spoke about what’s in the Father’s heart and brought out the complete Word. When the light spoke through his mouth, and by his voice gave birth to life, he gave them thought, wisdom, mercy, salvation, and the Spirit of power from the infinity and sweetness of the Father. He caused punishments and torments to cease, because they led astray into Error and bondage those who needed mercy. He dissolved and confounded them with knowledge. He became:

    a Way for those who were led astray,

    knowledge for those who were ignorant,

    a discovery for those who were searching,

    strength for those who were wavering, and

    purity for those who were impure.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/009.yaml
  text: 'When he was revealed[a], he taught them of the Father—the uncontainable one—and he breathed into them what is in the Thought, accomplishing his will. Many received the Light and turned to him, for the material ones were strangers; they did not behold his form nor know him. He came by means of a fleshly form, and nothing was able to block his way, because incorruptibility is ungraspable.


    He spoke things new, speaking out what is in the Father’s heart, and he brought forth the complete Word; when the Light spoke from his mouth, and his voice gave birth to life, he gave them Thought, understanding, mercy, salvation, and the Spirit of power, from the infinity and sweetness of the Father.


    He caused punishments and scourges to cease, because they were leading into Error and into captivity those who had need of mercy. He dissolved them, and he confounded them by Knowledge.


    Thus he became:

    - a Way for those who were wandering,

    - Knowledge for those who were ignorant,

    - a Discovery for those who were seeking,

    - Strength for those who were wavering,

    - and Purity for those who were defiled.'
translation:
  language: ru
  text: 'Когда Он открылся[a], то поведал им об Отце — Необъятном — и вдохнул в них то, что заключено в Мысли, исполняя Его волю. Многие приняли Свет и обратились к Нему, ведь те, кто принадлежал материи, были чужими: они не видели Его облика и не знали Его. Он пришёл посредством плотского облика, и ничто не могло преградить Ему путь, потому что нетление нельзя схватить.


    Он говорил новое: возвещал то, что в сердце Отца, и явил полное Слово. Когда Свет заговорил Его устами и Его голос породил жизнь, Он даровал им Мысль, разумение, милость, спасение и Дух силы — из беспредельности и сладости Отца.


    Он положил конец наказаниям и бичам, потому что они уводили в Заблуждение и плен тех, кто нуждался в милости. Он рассеял их и привёл их в смятение Знанием.


    Так Он стал:


    - Путём для заблудившихся,


    - Знанием для не знавших,


    - Обретением для искавших,


    - Силой для колебавшихся


    - и Чистотой для осквернённых.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Когда Он явил Себя».'
    reason: Глагольное выражение допускает оттенок как явления, так и самораскрытия; примечание сохраняет эту смысловую грань без добавления отсутствующих в рукописи фраз.
lexical_decisions:
- source_word: ⲟⲉⲓⲛ / ⲡⲟⲩⲁⲉⲓⲛ
  choice: Свет
  rationale: Прописная буква передаёт олицетворённый, спасительный Свет в богословском строе произведения, не вводя специального термина.
- source_word: ⲡϣⲉϫⲉ
  choice: Слово
  rationale: В данном откровенном контексте слово обозначает не просто речь, а явленное совершенное изречение; прописная буква сохраняет его терминологический вес.
- source_word: ⲁⲧⲉⲙⲁϩⲧⲉ
  choice: Необъятный
  rationale: Отрицательная форма от глагола со значением «схватить, удержать» описывает Отца как Того, Кого невозможно охватить или вместить.
- source_word: ⲧⲙⲛⲧⲁⲧⲧⲉⲕⲟ … ⲧⲁⲧⲉⲙⲁϩⲧⲉ
  choice: нетление нельзя схватить
  rationale: 'Перевод сохраняет обе части образа: нетление и его неуловимость, а также конкретную метафору схватывания.'
- source_word: ⲥⲁⲩⲛⲉ
  choice: Знание
  rationale: Прописная буква отмечает спасительное Знание как действенную реальность, сохраняя при этом понятное русское слово вместо заимствования «гнозис».
- source_word: ⲡⲗⲁⲛⲏ
  choice: Заблуждение
  rationale: Прописная буква передаёт олицетворённую в произведении враждебную силу, но не устраняет основное значение греческого заимствования.
- source_word: ⲥⲁⲓ
  choice: плен
  rationale: Слово естественно выражает состояние порабощения и сохраняет сотериологическое противопоставление освобождению.
- source_word: ⲕⲟⲗⲁⲥⲓⲥ / ⲙⲁⲥⲧⲓⲅⲝ
  choice: наказания и бичи
  rationale: 'Сохранены два отдельных образа: карательное воздаяние и причиняющий мучение бич.'
- source_word: ⲙⲁⲉⲓⲧ
  choice: Путь
  rationale: В итоговом перечне это спасительная роль Сына; прописная буква подчёркивает функцию, не превращая её в привнесённый титул.
- source_word: ⲟⲩϭⲓⲛⲉ
  choice: Обретение
  rationale: Передаёт как действие нахождения, так и найденное искомое, сохраняя краткий параллелизм перечня.
theological_decisions:
- issue: Олицетворение Заблуждения
  choice: «Заблуждение» с прописной буквы
  alternative: «заблуждение» или «обман» как нарицательное состояние
  rationale: В «Евангелии истины» Заблуждение действует как враждебная сила или область; графическое выделение передаёт это без дополнительного догматического толкования.
- issue: Родительный оборот «Дух силы»
  choice: «Дух силы»
  alternative: «могущественный Дух»
  rationale: Сохранена форма исходного сочетания и параллельность ряда даров; определение не сведено к простому прилагательному.
- issue: Пришествие посредством плотского облика
