  consult_excerpt: 'He’s good. He knows his plants, because he planted them in his paradise. Now his paradise is a place of rest. This 37 is the completion in the Father’s thought, and these are the words of his meditation. Each of his words is the work of his one will in the revelation of his Word. When they were still in the depths of his thought, the Word – which was the first to come out – revealed them along with a mind that speaks the one Word in a silent grace. He was called “the Thought,” since they were in it before being revealed. It happened, then, that he was the first to come out at the time when it pleased the one who wanted it. Now the Father rests in his will, and is pleased with it.

    Nothing happens without him, nor does anything happen without the will of the Father, but his will is incomprehensible. His trace is the will, and no one can know him, nor does he exist for people to scrutinize so that they might grasp him, but when he wills, what he wills is this – even if the sight doesn’t please them in any way before God – the will of the Father, because he knows the beginning of all of them, and their end, for in the end he’ll greet them directly. Now the end is receiving knowledge of the one who’s hidden; this is the Father, 38 from whom the beginning has come, and to whom all who’ve come out from him will return. They were revealed for the glory and the joy of his name.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/013.yaml
  text: 'He is the Good—within the Father’s Thought[a], in contemplation.


    The utterance of his meditation—each one, every one of his words—is the work of his Will. For they are speech in the Light, outside, belonging to his Saying: while they were still in the depths of his Thought, the Logos—the first to come forth—manifested them, with a Mind that speaks the one Word in a silent grace. He was called “the Thought,” because they were in it before they were manifested outside. And so it happened that he was the first to come forth, at the time when it pleased the will of the one who willed it.


    The Will is that in which the Father rests. Nothing happens without him, nor does anything happen without the Will of the Father. But his Will is uninvestigable; his trace is the Will. No one can know him, nor does he exist in such a way as for them to scrutinize him so that they might grasp him; rather, what he wills—this is what happens, even if their sight should not be pleasing in any way before God—the Will of the Father. For the Father knows their beginning and their end; for in their end he will greet them face to face. And the end is the knowledge of the Hidden One; and the Hidden One is the Father—from whom the beginning came forth and to whom all who came forth from him will return[c][b]. They were manifested for the glory and the joy of his Name.'
translation:
  language: ru
  text: '**Рай Отца**



    Это — завершение в мысли Отца, слова его размышления.



    Каждое из его слов — дело его единой Воли, явленное в откровении его Слова. Пока они ещё пребывали в глубине его мысли, Логос — первым вышедший вовне — явил их вместе с Умом, который в безмолвной благодати изрекает единое Слово. Его назвали «Мыслью», потому что в ней они пребывали прежде, чем были явлены. Итак, он первым вышел вовне тогда, когда это было угодно Тому, кто пожелал его.[a]



    Воля — то, в чём покоится Отец и чем он доволен. Ничто не происходит без него, и ничто не происходит без Воли Отца. Но его Воля неисследима; его след — Воля.[b] Никто не может познать его; и он не таков, чтобы его могли исследовать и тем самым постичь. Но чего он желает, то и совершается, даже если увиденное нисколько не угодно им перед Богом, — такова Воля Отца.[c] Ибо Отец знает начало их всех и их конец. Ведь в конце он встретит их лицом к лицу. А конец — познание Сокрытого; Сокрытый же — это Отец, от которого произошло начало и к которому возвратятся все, кто вышел от него. Они были явлены ради славы и радости его Имени.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «И получилось так, что он первым явил их, однако лишь тогда, когда это было угодно Тому, кто пожелал его».'
    reason: Форма при ϣⲁⲣⲡ допускает как непереходное «первым выйти», так и каузативное понимание «впервые явить их»; последнее местоимение относится к нему, а не к безличному «этому».
  - marker: b
    text: 'Или: «Воля — его след». Образ может означать, что о непостижимом Отце можно судить лишь по его Воле как по оставленному следу.'
    reason: Краткая именная конструкция метафорична и допускает различное синтаксическое членение без устранения её намеренной загадочности.
  - marker: c
    text: 'Местоимение во фразе «не угодно им» не имеет однозначно названного референта; возможно также: «даже если увиденное никак не угодно перед Богом».'
    reason: Исходная местоименная и синтаксическая связь неясна; примечание сохраняет реальную неоднозначность вместо скрытого уточнения субъекта.
lexical_decisions:
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: Логос
  rationale: Сохраняет греческий технический термин и его личностно-метафизический оттенок; соседнее ⲡϣⲉϫⲉ передано как «Слово», чтобы оставалась слышна словесная семантика.
- source_word: ⲛⲟⲩⲥ
  choice: Ум
  rationale: Естественный русский эквивалент греческого νοῦς, сохраняющий здесь значение мыслящего начала без привнесения более узкого термина «интеллект».
- source_word: ⲭⲁⲣⲓⲥ
  choice: благодать
  rationale: Передаёт религиозно-философское значение греческого χάρις и естественно сочетается с определением «безмолвная».
- source_word: ⲙⲉⲩⲉ / ⲙⲉⲉⲓⲛⲉ
  choice: мысль / размышление / Мысль
  rationale: Различены процесс размышления, мысль Отца и олицетворённое наименование «Мысль».
- source_word: ⲟⲩⲱϣ
  choice: Воля / желать
  rationale: Существительное передано как «Воля» с прописной буквы там, где оно выступает как олицетворённое начало; глагольные формы переданы обычным «желать».
- source_word: ⲓⲭⲛⲟⲥ
  choice: след
  rationale: Сохраняет конкретную метафору греческого ἴχνος и её смысл доступного проявления непостижимого Отца.
- source_word: ⲥⲟⲟⲩⲛⲉ
  choice: познание
  rationale: Передаёт не только обладание сведениями, но и направленный акт познания Сокрытого, не вводя в основной текст нагруженную транслитерацию «гносис».
- source_word: ⲡⲉⲉⲓ ⲉⲑⲏⲡ
  choice: Сокрытый
  rationale: Субстантивированное наименование сохраняет титульный характер выражения и связь с Отцом.
- source_word: ⲁⲃⲁⲗ
  choice: вовне / явлены
  rationale: По возможности сохранена пространственная метафора выхода из глубины мысли наружу; там, где буквальное повторение утяжеляло бы русский текст, смысл выражен глаголом явления.
theological_decisions:
- issue: Статус Воли Отца
  choice: «Воля» с прописной буквы в олицетворённых употреблениях
  alternative: «воля» как обычное свойство Отца
  rationale: Текст говорит о Воле как о том, в чём Отец покоится, и как о его следе; прописная буква отмечает олицетворение, не утверждая отдельную сущность.
- issue: Соотношение Логоса, Слова и Ума
  choice: Сохранить различимые термины «Логос», «Слово» и «Ум»
  alternative: Всюду переводить ⲗⲟⲅⲟⲥ и ϣⲉϫⲉ одним словом «Слово»
  rationale: Так сохраняется словесная игра исходника и одновременно не стираются его технические термины.
- issue: Конец как познание Сокрытого
  choice: «конец — познание Сокрытого»
  alternative: «цель — гносис Сокрытого»
  rationale: «Конец» сохраняет напряжение между завершением и целью, а «познание» остаётся доступным читателю и не навязывает позднейшую конфессионально-полемическую классификацию.
- issue: Возвращение вышедших от Отца
  choice: Сохранить всеобщее по форме «все, кто вышел от него» без догматического пояснения
  alternative: Ограничить группу избранными или истолковать как универсальное спасение
  rationale: Исходный текст сам не разрешает объём и сотериологический статус этой группы; перевод не должен делать это за него.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаизированным ритмом. Технические слова выделены прописной буквой только при явном олицетворении. Синтаксис несколько созерцательный и повторный, как в коптском тексте, но расчленён для понятности обычному читателю. Заголовок редакционный; основной перевод данного раздела завершается перед началом следующего рассуждения об Имени на странице 38.
