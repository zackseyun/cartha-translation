    Каждое из его слов — дело его единой Воли, явленное в откровении его Слова. Пока они ещё пребывали в глубине его мысли, Логос — первым вышедший вовне — явил их вместе с Умом, который в безмолвной благодати изрекает единое Слово. Его назвали «Мыслью», потому что в ней они пребывали прежде, чем были явлены. Итак, он первым вышел вовне тогда, когда это было угодно Тому, кто пожелал его.[a]



    Воля — то, в чём покоится Отец и чем он доволен. Ничто не происходит без него, и ничто не происходит без Воли Отца. Но его Воля неисследима; его след — Воля.[b] Никто не может познать его; и он не таков, чтобы его могли исследовать и тем самым постичь. Но чего он желает, то и совершается, даже если увиденное нисколько не угодно им перед Богом, — такова Воля Отца.[c] Ибо Отец знает начало их всех и их конец. Ведь в конце он встретит их лицом к лицу. А конец — познание Сокрытого; Сокрытый же — это Отец, от которого произошло начало и к которому возвратятся все, кто вышел от него. Они были явлены ради славы и радости его Имени.'
