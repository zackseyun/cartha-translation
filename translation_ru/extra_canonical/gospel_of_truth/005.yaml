revisions:
- from: 'Иисус беспредельной сладости.[a]


    Отец открыл свою грудь; его грудь — Святой Дух. Он явил сокрытое в себе; сокрытое в нём — его Сын, чтобы по милосердию Отца эоны познали его, перестали изнурять себя поисками Отца и обрели покой в нём, зная, что это и есть Покой.


    Отец восполнил недостаток и растворил его облик — этот облик есть мир, которому он служил. Ведь там, где есть зависть и вражда, есть недостаток, а там, где есть Единство, есть завершённость. Поскольку недостаток возник из-за того, что Отца не знали, когда Отца познают, с того времени недостатка больше не будет. Как невежество человека растворяется, когда приходит знание, и как тьма растворяется, когда является свет, так и недостаток растворяется в завершённости. С того времени его облик уже не является[b] и растворится в согласии Единства.


    Пока же их дела рассеяны, но в своё время Единство приведёт эоны к завершённости. В Единстве каждый обретёт самого себя, а в Знании очистит себя, перейдя от множественности к Единству: он поглотит в себе материю, как огонь; тьму — светом, а смерть — жизнью. Если всё это действительно произошло с каждым из нас, нам надлежит помышлять обо всём, чтобы этот дом был свят и безмолвен ради Единства.'
