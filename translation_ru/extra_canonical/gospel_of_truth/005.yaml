  warnings: []
  consult_excerpt: 'His Wisdom meditates on the Word,

    his teaching speaks it,

    his knowledge has revealed it,

    his patience is a crown upon it,

    his joy is in harmony with it,

    his glory has exalted it,

    his image has revealed it,

    his rest has received it,

    his love made a body around it,

    his faith embraced it.

    In this way, the Word of the Father goes out in all, as the fruit 24 [of] his heart and an expression of his will. But it supports all. It chooses them and also takes the expression of all, purifying them, returning them to the Father and to the Mother, Jesus of infinite sweetness.

    The Father reveals his bosom, and his bosom is the Holy Spirit. He reveals what’s hidden of himself; what’s hidden of himself is his Son – so that through the mercies of the Father, the generations may know him and cease their work in searching for the Father, resting in him and knowing that this is the rest. He’s filled the need and dissolved its appearance – its appearance is the world in which it served, because where there’s envy and strife there’s need, but where there’s Unity there’s completion. Since need came into being because the Father wasn’t known, when the Father is known, from then on, need will no longer exist. As someone’s ignorance dissolves when they gain knowledge, and as darkness dissolves when the light appears, 25 so also need dissolves in completion. So the appearance is revealed from then on, but it’ll dissolve in the harmony of Unity.

    For now, their works lie scattered. In time, Unity will complete the realms. Within Unity each one will receive themselves, and within knowledge they’ll purify themselves from multiplicity into Unity, consuming matter within themselves like fire, and darkness by light, death by life. If indeed these things have happened to each one of us, then it’s right for us to think about all, so that this house will be holy and silent for the Unity.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/005.yaml
  text: 'Jesus of the infinite sweetness[a].


    The Father made his bosom known; his bosom is the Holy Spirit. He manifested what is hidden of himself; what is hidden of himself is his Son, so that, through the mercies of the Father, the Aeons might know him, cease from searching for the Father, and rest in him, knowing that this is the Rest.


    The Father filled the deficiency and dissolved its appearance—its appearance is the world in which it had served. For in the place where there is envy and strife, there is deficiency; but in the place where there is Unity, there is completion. Since the deficiency came to be because the Father was not known, when the Father is known, from that time the deficiency will no longer be—just as a person’s ignorance is dissolved when knowledge is present, and just as darkness is dissolved when the light appears. So also the deficiency is dissolved by the completion. From then on its appearance is no longer manifest, and it will be dissolved in the concord of Unity.


    For now their works are scattered; but in time Unity will complete the Aeons. Within Unity each one will receive himself, and within Knowledge they will purify themselves from multiplicity into Unity—consuming matter within themselves like fire, and darkness by light, and death by life. If indeed these things have happened to each of us, it is necessary to think concerning the All[d][c][b], so that this house may be holy and still for the sake of Unity.'
translation:
  language: ru
  text: 'Иисус беспредельной сладости.[a]


    Отец открыл своё лоно; его лоно — Святой Дух. Он явил сокрытое в себе; сокрытое в нём — его Сын, чтобы по милосердию Отца эоны познали его, перестали изнурять себя поисками Отца и обрели покой в нём, зная, что это и есть Покой.


    Отец восполнил недостаток и растворил его облик — этот облик есть мир, в котором он служил. Ведь там, где есть зависть и вражда, есть недостаток, а там, где есть Единство, есть завершённость. Поскольку недостаток возник из-за того, что Отца не знали, когда Отца познают, с того времени недостатка больше не будет. Как невежество человека растворяется, когда приходит знание, и как тьма растворяется, когда является свет, так и недостаток растворяется в завершённости. С того времени его облик уже не будет явлен[b] и растворится в согласии Единства.


    Пока же их дела рассеяны, но в своё время Единство приведёт эоны к завершённости. В Единстве каждый обретёт самого себя, а в Знании очистит себя, перейдя от множественности к Единству: он поглотит в себе материю, как огонь; тьму — светом, а смерть — жизнью. Если всё это действительно произошло с каждым из нас, нам надлежит помышлять обо всём, чтобы этот дом был свят и безмолвен ради Единства.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эта фраза в рукописи продолжает предыдущее предложение; её можно понимать как завершение слов о возвращении «к Отцу, к Матери — Иисусу беспредельной сладости».
    reason: Граница редакционного раздела разрывает исходный синтаксис, а соотношение слов «Матерь» и «Иисус» допускает неоднозначное членение.
  - marker: b
    text: 'В рукописи здесь читается отрицание: «уже не будет явлен».'
    reason: В предоставленном OCR отрицательная частица пропущена; примечание сообщает существенное текстологическое уточнение, меняющее смысл фразы.
lexical_decisions:
- source_word: ⲧⲙⲛⲧⲟⲩⲉⲉⲓⲛ / ⲙⲛⲧⲟⲩⲉⲉⲓ
  choice: Единство
  rationale: Передаёт техническое понятие единства в противопоставлении множественности; прописная буква отмечает его концептуальный статус, не вводя дополнительного толкования.
- source_word: ⲁⲓⲱⲛ
  choice: эон
  rationale: Сохранён космологический термин греческого происхождения; перевод «век» здесь затемнил бы устройство рассуждения.
- source_word: ⲥⲭⲏⲙⲁ
  choice: облик
  rationale: Передаёт внешнее проявление или форму недостатка и естественно сочетается с глаголами «являться» и «растворяться».
- source_word: ⲃⲱⲗ ⲁⲃⲁⲗ
  choice: растворить / растворяться
  rationale: Сохраняет повторяющийся образ упразднения недостатка, невежества и тьмы; не привносит отсутствующий в источнике образ изгнания.
- source_word: ⲥⲁⲩⲛⲉ
  choice: знание / Знание
  rationale: В обычном сравнении употреблено со строчной буквы, а в заключительном техническом противопоставлении множественности — с прописной.
- source_word: ϣⲧⲁ
  choice: недостаток
  rationale: Нейтрально передаёт нехватку или ущербность и позволяет сохранить повтор ключевого слова без отождествления с иным специальным термином.
- source_word: ϫⲱⲕ
  choice: завершённость / привести к завершённости
  rationale: Передаёт смысл завершения и исполнения, не подменяя его термином «Плерома».
- source_word: ⲧϩⲩⲗⲏ
  choice: материя
  rationale: Сохраняет философский смысл греческого заимствования ὕλη.
- source_word: ⲡⲏⲡ / ⲡⲉⲑⲏⲡ
  choice: грудь
  rationale: Прямой и понятный эквивалент образа отцовской груди/лона; сохраняет телесную метафору откровения сокрытого.
theological_decisions:
- issue: Отождествление груди Отца со Святым Духом
  choice: «его грудь — Святой Дух»
  alternative: Понять грудь лишь как метафору близости или внутреннего присутствия
  rationale: Коптская эквативная конструкция выражает прямое отождествление; перевод сохраняет его, не ослабляя и не развивая доктринально.
- issue: Соотношение недостатка, мира и Единства
  choice: Сохранить утверждение, что мир является обликом недостатка, а недостаток растворяется в завершённости Единства
  alternative: Истолковать мир как безусловно злую материальную реальность либо заменить Единство конфессиональным понятием
  rationale: Текст формулирует напряжённое онтологическое противопоставление, но сам не даёт оснований уточнять его в рамках позднейшей доктрины.
- issue: Кто обретает и очищает себя
